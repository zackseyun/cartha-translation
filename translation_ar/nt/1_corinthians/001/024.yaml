  source_fidelity: 'المعنى الرئيس منقول بأمانة: «المدعوون»، و«يهود» و«يونانيون»، و«المسيح»، و«قوة الله وحكمة الله» توافق اليونانية. لكن «سواء أكانوا ... أم ...» تُضعف قليلًا دلالة الاقتران الجامعة في τε καί («يهودًا ويونانيين»)، وتوحي بصيغة بديلة لا بصنفين مشمولين معًا.'
