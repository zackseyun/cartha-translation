base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: ar
  text: 'إلى كنيسة الله التي في كورنثوس، إلى المقدَّسين في المسيح يسوع، المدعوين قديسين[a]، مع جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان، لهم ولنا[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القديسين المدعوين». حرفيًا: «مدعوين قديسين»؛ والمعنى: الذين دُعوا ليكونوا من شعب الله المقدس.'
    reason: lexical_alternative
  - marker: b
    text: 'العبارة اليونانية موجزة: قد يُفهم «في كل مكان» متعلقًا بجميع الذين يدعون باسم الرب، أو قد يُفهم «لهم ولنا» وصفًا للأماكن بأنها تخصهم وتخصنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: كنيسة
  rationale: «كنيسة» هي المقابل العربي الطبيعي المستقر للجماعة المؤمنة هنا، وتدل في هذا السياق على جماعة الله لا على المبنى.
- source_word: ἡγιασμένοις
  choice: المقدَّسين
  rationale: صيغة اسم المفعول تحفظ المبني للمجهول في اليونانية، وتشير إلى فعل تمّ وما زالت نتيجته قائمة.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: يحفظ هذا التعبير الصيغة البولسية وعلاقة المؤمنين بالمسيح، ويترجم Χριστός بلقبه العربي المألوف «المسيح».
- source_word: κλητοῖς ἁγίοις
  choice: المدعوين ليكونوا قديسين
  rationale: صياغة عربية واضحة تعبّر عن الدعوة الإلهية إلى القداسة، مع بيان الصياغة الأقرب إلى اللفظ في الحاشية.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: الذين يدعون باسم
  rationale: تعبير عربي كتابي طبيعي يدل هنا على التضرع والعبادة والاعتراف بالرب.
- source_word: κυρίου
  choice: ربنا
  rationale: «الرب» هو المقابل العربي الراسخ لـ κύριος في الاعتراف المسيحي المبكر، وضمير الجمع وارد صراحة في النص.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: في كل مكان، لهم ولنا
  rationale: تحافظ العبارة الموجزة على انضغاط التركيب اليوناني وغموض تعلّق «لهم ولنا»، بدل حسمه داخل المتن.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح في الموضعين
  alternative: اعتبار اللفظ اسمًا مجردًا بلا إبراز دلالته اللقبية
  rationale: «المسيح» ترجمة عربية طبيعية للقب اليوناني، وتحفظ دلالته المسيانية من غير إضافة تفسير مذهبي.
- issue: تعلّق αὐτῶν καὶ ἡμῶν
  choice: الإبقاء على الغموض بعبارة «لهم ولنا»
  alternative: «في كل مكان يخصهم ويخصنا» أو «ربهم وربنا»
  rationale: التركيب اليوناني المضغوط يمكن أن يُفهم متعلقًا بالمكان، كما يمكن وصله بالرب؛ لذلك لا يُحسم في المتن وتُذكر الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية موقرة. استُعملت ألفاظ كتابية مألوفة من غير تقليد تركيب أجنبي حين يعيق الفهم، مع إبقاء الغموض الحقيقي في خاتمة الآية وشرحه في الحاشية.
