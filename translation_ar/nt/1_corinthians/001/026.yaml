  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: ar
  text: 'فتأمَّلوا، أيها الإخوة[a]، دعوتكم: فليس كثيرون منكم حكماء بحسب المقاييس البشرية، ولا كثيرون ذوو نفوذ، ولا كثيرون من ذوي النسب الرفيع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «الإخوة» هنا موجَّه إلى جماعة المؤمنين كلها، ويشمل النساء المؤمنات كما يشمل الرجال.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: تأمَّلوا
  rationale: تحتمل الصيغة اليونانية الأمر والخبر، لكن السياق يرجّح الحث على النظر المتبصّر في حال الجماعة؛ و«تأمّلوا» تنقل هذه القوة الخطابية بوضوح.
- source_word: κλῆσιν
  choice: دعوتكم
  rationale: تشير في السياق البولسي إلى دعوة الله التي بها صار المخاطَبون من جماعة المؤمنين، لا إلى مهنة أو منزلة اجتماعية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ اللفظ على الصيغة المذكرة في الأصل، مع بيان شموله جماعة المؤمنين كلها في الحاشية.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: ليس كثيرون منكم حكماء
  rationale: أُظهر المرجع المفهوم من السياق، أي أهل كورنثوس المخاطبون، لأن ذلك أوضح وأطبع في العربية.
- source_word: κατὰ σάρκα
  choice: بحسب المقاييس البشرية
  rationale: العبارة هنا تصف الحكمة وفق التقييم البشري، لا الجسد الحرفي؛ وهذه الصياغة تؤدي معناها الاصطلاحي الطبيعي من غير تحميلها معنى أخلاقيًا زائدًا.
- source_word: δυνατοί
  choice: ذوو نفوذ
  rationale: يرجح السياق الاجتماعي معنى أصحاب القوة والمكانة المؤثرة، و«ذوو نفوذ» أوضح للقارئ العربي من «أقوياء» التي قد تُفهم على القوة الجسدية.
- source_word: εὐγενεῖς
  choice: من ذوي النسب الرفيع
  rationale: يدل اللفظ على شرف الأصل وعلو النسب الاجتماعي، وهذه العبارة تنقل المعنى بوضوح معاصر.
theological_decisions:
- issue: دلالة «دعوتكم»
  choice: الإبقاء على «دعوتكم» من غير إضافة «من الله» في المتن
  alternative: دعوة الله لكم
  rationale: الإضافة مفهومة من السياق البولسي لكنها غير مصرّح بها في هذه العبارة، فالإبقاء على اللفظ يحفظ إيجاز الأصل ولا يحسم ما تركه ضمنيًا.
- issue: دلالة κατὰ σάρκα
  choice: بحسب المقاييس البشرية
  alternative: بحسب الجسد
  rationale: المقصود هنا معيار الحكم البشري على الحكمة؛ والترجمة الحرفية قد توحي خطأً بالجسد المادي أو بمفهوم أخلاقي تقني لا يقتضيه السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت بنية إيقاعية متوازية في العبارات الثلاث الأخيرة لمحاكاة تكرار οὐ πολλοὶ، مع اختيار «ذوو نفوذ» و«ذوو النسب الرفيع» لإبراز البعد الاجتماعي في السياق.
