base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: ar
  text: 'لأنّه مكتوب: «سأُبيد حكمة الحكماء، وأُبطِل فهم الفهماء».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأرفض فهم الفهماء» أو «وأجعله باطلًا».'
    reason: يحتمل الفعل اليوناني معنى الرفض أو الإبطال أو جعل الشيء عديم الأثر.
lexical_decisions:
- source_word: γέγραπται
  choice: مكتوب
  rationale: الصيغة العربية المألوفة للاقتباس الكتابي، وتحفظ دلالة صيغة التام المبني للمجهول على كلام كُتب وما زال ثابتًا.
- source_word: γάρ
  choice: لأنّه
  rationale: تبيّن أن الاقتباس يقدّم أساسًا لما سبقه، في اتصال سببي واضح.
- source_word: Ἀπολῶ
  choice: سأُبيد
  rationale: تنقل قوة الفعل ἀπόλλυμι الدال هنا على الإهلاك أو الإزالة، من غير إضافة تفسيرية.
- source_word: σοφίαν τῶν σοφῶν
  choice: حكمة الحكماء
  rationale: تحفظ التكرار الاشتقاقي والتوازي البلاغي في اليونانية بعبارة عربية موجزة وطبيعية.
- source_word: σύνεσιν τῶν συνετῶν
  choice: فهم الفهماء
  rationale: تحفظ الصلة الاشتقاقية بين الاسم والصفة، كما تحافظ على موازاة «حكمة الحكماء».
- source_word: ἀθετήσω
  choice: أُبطِل
  rationale: يؤدي معنى جعل الشيء باطل الأثر أو إسقاط اعتباره، وهو مناسب للمقابلة مع «سأُبيد» من غير مبالغة في التفسير.
theological_decisions:
- issue: صياغة اقتباس إشعياء بما يحفظ قوة مقابلة بولس بين عمل الله وحكمة البشر
  choice: استعمال فعلي المستقبل «سأُبيد» و«أُبطِل» على نحو مباشر
  alternative: صياغات تفسيرية مثل «أُحبط» أو «أجعل بلا قيمة»
  rationale: المستقبل المباشر يحفظ بنية النص اليوناني وقوة الاقتباس النبوي، من غير إدخال تحديد عقائدي زائد لطبيعة إبطال الحكمة البشرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي الاشتقاقي في «حكمة الحكماء» و«فهم الفهماء»، ووُضع هامش [a] بعد العبارة التي يشرح بديلها.
