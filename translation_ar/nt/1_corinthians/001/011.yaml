    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: أُخبِرتُ
  rationale: ينقل المبني للمجهول ودلالة وصول الخبر إلى بولس بصياغة عربية طبيعية واضحة.
- source_word: γάρ
  choice: فقد
  rationale: تحفظ الصلة التفسيرية بما سبق، وتنسجم مع السياق العربي أكثر من ترجمة حرفية مستقلة.
- source_word: περὶ ὑμῶν
  choice: عنكم
  rationale: مقابل عربي موجز وطبيعي لمعنى العبارة المتعلقة بأخبار المخاطَبين.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: يحفظ صيغة المذكر الجمع في اليونانية، مع بيان احتمال شمول جماعة المؤمنين كلها في الحاشية.
- source_word: ὑπὸ τῶν Χλόης
  choice: من جماعة خُلُوي
  rationale: تفيد أشخاصًا منتسبين إلى خُلُوي أو مرتبطين بها، من غير حسم أنهم أهل بيتها تحديدًا.
- source_word: ἔριδες
  choice: خصومات
  rationale: تعبّر عن نزاعات بين الأشخاص، ولا تخلطها بالمفهوم الأوسع للانقسامات الوارد في السياق.
- source_word: ἐν ὑμῖν εἰσιν
  choice: أن بينكم ...
  rationale: صياغة عربية اصطلاحية طبيعية تفيد وجود الخصومات وسط الجماعة.
theological_decisions:
- issue: دلالة ἀδελφοί في جماعة كنسية تضم رجالًا ونساءً
  choice: يا إخوتي
  alternative: يا إخوتي وأخواتي
  rationale: النص اليوناني يستعمل جمع المذكر «إخوة»، وقد يكون خطابه شاملًا لجماعة المؤمنين كلها؛ لذلك حُفظت الصيغة في المتن ووُضّح الاحتمال الشامل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «جماعة خُلُوي» لتجنب التحديد الزائد الذي تنطوي عليه عبارة «أهل بيت خُلُوي»، وحُفظت الصلة السياقية بأداة «فقد».
