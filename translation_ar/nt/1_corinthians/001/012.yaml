id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: ar
  text: 'أعني بهذا أن كلَّ واحد منكم يقول: «أنا لبولس»، أو «أنا لأبلّوس»، أو «أنا لكِيفا»، أو «أنا للمسيح».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: أعني بهذا
  rationale: صياغة عربية طبيعية تحفظ وظيفة العبارة في توضيح ما يقصده بولس.
- source_word: ἕκαστος ὑμῶν
  choice: كلَّ واحد منكم
  rationale: تنقل بوضوح القوة التوزيعية للفظ اليوناني، إذ ينسب بولس الشعار إلى كل فرد داخل الانقسامات المذكورة.
- source_word: λέγει
  choice: يقول
  rationale: يحفظ زمن المضارع ويعرض الأقوال بوصفها نمطًا قائمًا.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: أنا لبولس ... أنا لأبلّوس ... أنا لكِيفا ... أنا للمسيح
  rationale: اللام صياغة عربية موجزة تحفظ معنى الانتساب أو الولاء الذي يفيده تركيب εἰμί مع المضاف إليه، من غير أن تضيف تفسيرًا مثل «من أتباع».
- source_word: Κηφᾶ
  choice: كِيفا
  rationale: نقل صوتي للاسم الآرامي الذي استعمله بولس هنا، بدل إحلال «بطرس» محله.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ترجمة اللقب اليوناني إلى مقابله العربي المألوف والدقيق، لا نقله صوتيًا.
theological_decisions:
- issue: دلالة شعارات الانتساب في الأحزاب الكورنثية
  choice: الإبقاء على الصيغة الموجزة «أنا لـ...»
  alternative: «أنا من أتباع...»
  rationale: الصيغة المختارة تحفظ احتمال الانتساب أو الولاء من غير حصره في معنى التلمذة الرسمية، كما تحافظ على التوازي اللافت بين بولس وأبلّوس وكِيفا والمسيح.
- issue: ترجمة Χριστοῦ في الشعار الأخير
  choice: المسيح
  alternative: نقل صوتي يقابل «Christ»
  rationale: «المسيح» هو اللقب العربي الطبيعي المقابل لـ Χριστός، ويحفظ طبيعته اللقبية؛ ولا يوجد في العربية الفصحى تباين اصطلاحي مماثل للتباين الإنجليزي بين Messiah وChrist يستلزم حاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. حُفظ تكرار «أنا» وبنية الشعارات المتوازية، واستُعملت أسماء منقولة صوتيًا وفق ألفاظ النص اليوناني.
