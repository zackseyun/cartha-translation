  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: بولس، ودعوته الرسولية، وارتباطها بمشيئة الله، وذكر سوستانيس بوصفه أخًا مشاركًا في الجماعة. عبارة «المدعو ليكون رسولًا» تؤدي κλητὸς ἀπόστολος بوضوح عربي من غير إضافة معنى لاهوتي مستقل، و«أخونا» تمثل الاستعمال الجماعي الطبيعي لـὁ ἀδελφός في افتتاح الرسالة.'
