  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: ar
  text: بولس، المدعو ليكون رسولًا للمسيح يسوع بمشيئة الله، وسوستانيس أخونا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: بولس
  rationale: الصيغة العربية الراسخة للاسم الشخصي اليوناني.
- source_word: κλητὸς ἀπόστολος
  choice: المدعو ليكون رسولًا
  rationale: ينقل وصف بولس بأنه مدعو إلى مقام الرسولية، مع إظهار العلاقة بين الصفة والاسم بعبارة عربية طبيعية؛ و«ليكون» توضيح نحوي لا يضيف دعوى مستقلة إلى النص.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: يحافظ على ترتيب اللقب ثم الاسم في اليونانية، و«المسيح» هو المقابل العربي الراسخ للقب Χριστός ويظل مفهومًا بوصفه لقبًا لا اسم عائلة.
- source_word: διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  rationale: ترجمة عربية طبيعية لعبارة διά مع المضاف إليه، وهي هنا تدل على أن دعوة بولس الرسولية قائمة بمشيئة الله.
- source_word: Σωσθένης
  choice: سوستانيس
  rationale: النقل الصوتي العربي الشائع للاسم اليوناني.
- source_word: ὁ ἀδελφὸς
  choice: أخونا
  rationale: مع أن اليونانية تقول حرفيًا «الأخ» بلا ضمير ملكية، فإن «أخونا» تؤدي بصورة عربية طبيعية الاستعمال الكنسي العائلي المقصود في افتتاح الرسالة.
theological_decisions:
- issue: دلالة Χριστός في تحية بولسية
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: أُبقي ترتيب النص اليوناني، اللقب قبل الاسم، بما يبرز الصفة المسيانية من غير استيراد تفسير مذهبي إضافي.
- issue: طبيعة دعوة بولس الرسولية
  choice: المدعو ليكون رسولًا
  alternative: رسول مدعو
  rationale: الترجمة المختارة تُظهر أن κλητός يصف رسوليته بوصفها ناشئة عن دعوة، من غير حسم تفاصيل لاهوتية لا يصرح بها هذا الشطر.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية وقورة. حوفظ على ترتيب «المسيح يسوع»، واستُخدمت «أخونا» بدل الترجمة الحرفية المتعثرة «الأخ» لتأدية الاصطلاح الجماعي طبيعيًا. لا تلزم حاشية للمقابلة الإنجليزية بين Messiah وChrist، لأن العربية الراسخة «المسيح» تستوعب الدلالة اللقبية نفسها.
