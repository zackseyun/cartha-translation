reference: 1 Corinthians 1:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: ar
  text: وأناشدكم، أيها الإخوة[a]، باسم ربنا يسوع المسيح[b]، أن تقولوا جميعًا قولًا واحدًا، وألا تكون بينكم انقسامات[c]، بل أن تكونوا ملتئمين[d] في فكر واحد ورأي واحد[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يشمل اللفظ هنا الإخوة والأخوات؛ فصيغة المذكر الجمع اليونانية قد تُوجَّه إلى جماعة المؤمنين كلها.
    reason: ملاحظة لغوية وثقافية
  - marker: b
    text: «المسيح» لقب معناه «الممسوح».
    reason: توضيح معجمي
  - marker: c
    text: 'أو: «شقاقات».'
    reason: بديل معجمي
  - marker: d
    text: 'أو: «مُصلَحين» أو «منضمّين بعضكم إلى بعض»؛ يدل الفعل على إعادة ما تصدّع إلى حال سليمة متوافقة.'
    reason: بيان اتساع دلالة اللفظ
  - marker: e
    text: 'أو: «حكم واحد» أو «قناعة واحدة».'
    reason: بديل معجمي يحفظ غموض γνώμη
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أناشدكم
  rationale: ينقل طبيعة الالتماس الرعوي الملحّ، لا مجرد إصدار أمر، وهو تعبير عربي فصيح وطبيعي.
- source_word: δὲ
  choice: الواو في «وأناشدكم»
  rationale: أداة ربط سياقية لا ظرف زمان؛ لذلك لم تُترجم بما يفيد «الآن»، وحُفظ الانتقال بواو الاستئناف.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ صيغة المذكر الجمع في اليونانية، مع بيان إمكان شمول الخطاب لجماعة المؤمنين كلها في الحاشية.
- source_word: διὰ τοῦ ὀνόματος
  choice: باسم
  rationale: ينقل معنى الوسيلة أو الأساس والاحتكام إلى سلطان الرب يسوع، بصياغة عربية مألوفة.
- source_word: κυρίου
  choice: ربنا
  rationale: «الرب» المقابل الطبيعي لـ κύριος في الاعتراف المسيحي بسلطان يسوع.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός وتحافظ على دلالته اللقبية.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: أن تقولوا جميعًا قولًا واحدًا
  rationale: صياغة قريبة من الأصل تحفظ صورة القول المشترك ولا تختزلها في مفهوم الاتفاق المجرد.
- source_word: σχίσματα
  choice: انقسامات
  rationale: لفظ عربي واضح ينقل معنى التصدعات والانشقاقات داخل الجماعة دون تقييده بالمصطلح الكنسي التقني.
- source_word: κατηρτισμένοι
  choice: ملتئمين
  rationale: يحفظ معنى إصلاح التصدع وإعادة الأجزاء إلى التوافق والاتصال، وهو مناسب لسياق الانقسامات ويحافظ على الحالة الناتجة المقصودة في المبني للمجهول.
- source_word: νοῒ
  choice: فكر
  rationale: ينقل معنى الذهن وطريقة التفكير، مع إبقائه متميزًا عن γνώμη.
- source_word: γνώμῃ
  choice: رأي
  rationale: يحفظ المجال الدلالي للحكم أو القناعة أو التوجه، من غير حسمه إلى «غاية» أو «عزم» فقط.
theological_decisions:
- issue: ترجمة اللقب Χριστός
  choice: المسيح
  alternative: كريستوس/الممسوح
  rationale: «المسيح» هو المقابل العربي الدلالي والتقليدي الواضح للقب، ويحفظ كونه لقبًا ليسوع من غير تحويله إلى مجرد اسم منقول صوتيًا.
- issue: مدى شمول ἀδελφοί
  choice: «الإخوة» في المتن مع حاشية توضح الشمول السياقي
  alternative: «الإخوة والأخوات» في المتن
  rationale: يحفظ المتن الصيغة النحوية المذكرة في الأصل، بينما تمنع الحاشية فهم الخطاب على أنه يستبعد النساء من جماعة المؤمنين.
- issue: طبيعة الوحدة المطلوبة
  choice: الإبقاء على «قول واحد... فكر واحد ورأي واحد»
  alternative: اختزال العبارة إلى «أن تتفقوا تمامًا»
  rationale: الصياغة القريبة من الأصل تصون التوتر بين وحدة الجماعة وبقاء الألفاظ المتمايزة للقول والفكر والرأي، ولا تضيف دعوى لاهوتية بأن كل اختلاف فردي ممنوع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «أناشدكم» لنبرة الالتماس الرسولي، و«ملتئمين» لمقابلة صورة إصلاح الانقسام. روعي التوازي الإيقاعي في «قولًا واحدًا... فكر واحد ورأي واحد»، ووُضعت جميع علامات الحواشي في مواضعها داخل المتن.
