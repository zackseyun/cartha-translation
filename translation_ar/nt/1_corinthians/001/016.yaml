base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: ar
  text: وعمَّدتُ أيضًا أهل بيت استفاناس[a]. وفيما عدا ذلك، لا أعلم هل عمَّدتُ أحدًا آخر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بيت استفاناس». يمكن أن تدل الكلمة اليونانية على أهل البيت بوصفهم جماعة، لا على المبنى وحده.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا وصل العبارة هكذا: «وفيما عدا ذلك، لا أعلم إن كنتُ قد عمَّدتُ أحدًا آخر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: عمَّدتُ
  rationale: الفعل اليوناني يدل هنا على إجراء المعمودية. وهذه هي العبارة العربية المعيارية الواضحة، من غير حسم لطريقة إجرائها.
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: تفيد العبارة إضافة أهل بيت استفاناس إلى من سبق ذكرهم، و«أيضًا» تنقل هذا المعنى بسلاسة.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: أهل بيت استفاناس
  rationale: يدل οἶκος هنا على الجماعة المنزلية أو الأسرة الممتدة، لا على المبنى وحده؛ و«أهل بيت» تحفظ هذا الاتساع بصورة طبيعية.
- source_word: λοιπὸν
  choice: وفيما عدا ذلك
  rationale: تشير الكلمة إلى ما بقي بعد الاستثناء المذكور، وهذه الصياغة تنقل انتقال بولس إلى نفي علمه بأي حالات أخرى.
- source_word: οὐκ οἶδα
  choice: لا أعلم
  rationale: يحافظ هذا الاختيار على التعبير الصريح عن عدم العلم، من دون استبداله بتفسير سياقي مثل «لا أتذكر».
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: هل عمَّدتُ أحدًا آخر
  rationale: تأتي εἰ هنا في سؤال غير مباشر يفيد عدم اليقين؛ و«هل» هي الصياغة العربية الطبيعية الدقيقة.
