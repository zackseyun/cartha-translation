  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: ar
  text: أين الحكيم؟ أين الكاتب؟ أين مجادل هذا الدهر؟ أما جعل الله حكمة العالم حماقة؟[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أين الإنسان الحكيم؟» فالصيغة في اليونانية مفرد مذكر، ويُرجَّح أنها تمثل الفئة عمومًا.'
    reason: lexical_alternative
  - marker: b
    text: تُترجم «هذا الدهر» كلمةً يونانية مختلفة عن الكلمة المترجمة «العالم» في آخر الآية.
    reason: cross_reference
  - marker: c
    text: 'أو: «أما أظهر الله حكمة العالم على أنها حماقة؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: أين
  rationale: تؤدي الاستفهام البلاغي المتكرر بصورة طبيعية ومباشرة.
- source_word: σοφός
  choice: الحكيم
  rationale: تحافظ على صيغة المفرد المذكر التي تمثل فئة الحكماء عمومًا، من غير حاجة إلى إضافة «الرجل».
- source_word: γραμματεύς
  choice: الكاتب
  rationale: المقابل العربي التاريخي المباشر للفظ، ويحافظ على صورته الملموسة بدل توسيعه إلى «العالِم».
- source_word: συζητητής
  choice: مجادل
  rationale: لفظ عربي واضح يدل على من يخوض الجدل والمناظرة.
- source_word: τοῦ αἰῶνος τούτου
  choice: هذا الدهر
  rationale: يحفظ معنى αἰών ويميّزه عن κόσμος الواردة لاحقًا، مع تعبير عربي كتابي مفهوم.
- source_word: οὐχὶ
  choice: أما
  rationale: تدخل على سؤال بلاغي ينتظر جوابًا بالإيجاب.
- source_word: ἐμώρανεν
  choice: جعل ... حماقة
  rationale: يحافظ على القوة السببية للفعل، مع تركيب عربي طبيعي يصف إبطال دعوى الحكمة.
- source_word: σοφίαν
  choice: حكمة
  rationale: المقابل المباشر الذي يصون التضاد البلاغي بين الحكمة والحماقة.
- source_word: κόσμου
  choice: العالم
  rationale: يميز κόσμος عن αἰών المترجمة «الدهر» ويحافظ على اختلاف اللفظين في الأصل.
theological_decisions:
- issue: التمييز بين αἰών وκόσμος في الآية نفسها
  choice: ترجمة αἰών بـ«الدهر» وκόσμος بـ«العالم»
  alternative: ترجمة اللفظين كليهما بـ«العالم»
  rationale: استعمال مقابلين مختلفين يصون التمييز المعجمي المقصود في النص اليوناني ولا يطمس التوتر بين هذا الدهر وحكمة العالم.
- issue: دلالة ἐμώρανεν السببية أو الكاشفة
  choice: «جعل ... حماقة» مع إثبات البديل في الحاشية
  alternative: «أظهر ... أنها حماقة»
  rationale: الصياغة المختارة تحفظ القوة السببية الأقرب للفعل، بينما الحاشية تصون احتمال فهمه بمعنى إظهار الحكمة المزعومة على حقيقتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وإيقاع بلاغي يحفظ تكرار «أين». اختير «الكاتب» بوصفه المقابل التاريخي المباشر، و«الدهر» لتمييز αἰών عن κόσμος. تظهر جميع علامات الحواشي في المتن.
