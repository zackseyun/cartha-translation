  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: ar
  text: أَمَّا نَحْنُ فَنُعْلِنُ الْمَسِيحَ مَصْلُوبًا[a]، فَهُوَ لِلْيَهُودِ حَجَرُ عَثْرَةٍ، وَلِلْأُمَمِ حَمَاقَةٌ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: نعلن المسيح بوصفه مصلوبًا.'
    reason: توضيح أن «مصلوبًا» وصف مباشر للمسيح، محافظًا على تكثيف العبارة اليونانية.
  - marker: b
    text: 'حرفيًّا: «الأمم»؛ والمقصود هنا على الأرجح غير اليهود، في مقابل اليهود.'
    reason: بيان المجال المعجمي للفظ اليوناني ودلالته السياقية.
lexical_decisions:
- source_word: κηρύσσομεν
  choice: نُنَادِي
  rationale: ينقل معنى الإعلان العلني على نحو المنادي، وهو طبيعي وفصيح في العربية ويحفظ قوة الفعل اليوناني.
- source_word: Χριστόν
  choice: الْمَسِيحِ
  rationale: اللفظ هنا لقب يشير إلى هوية يسوع المسيانية بوصفها مضمون الكرازة، لا مجرد اسم عَلَم.
- source_word: ἐσταυρωμένον
  choice: مَصْلُوبًا
  rationale: يحفظ دلالة اسم المفعول التام المبني للمجهول بصورة عربية موجزة، ويعرض المسيح في حال كونه المصلوب.
- source_word: Ἰουδαίοις
  choice: لِلْيَهُودِ
  rationale: السياق يقابل اليهود بالأمم، فالمقصود الجماعة الإثنية الدينية لا سكان اليهودية بمعناها الجغرافي الضيق.
- source_word: σκάνδαλον
  choice: حَجَرُ عَثْرَةٍ
  rationale: يحفظ الصورة المجازية للشيء الذي يوقع المرء في العثار، بدل تسطيحها إلى مجرد إساءة أو صدمة.
- source_word: ἔθνεσιν
  choice: لِلْأُمَمِ
  rationale: هذا هو المقابل العربي المباشر للفظ اليوناني «الأمم»، ويُفهم هنا سياقيًا على أنه غير اليهود؛ وقد أُوضح ذلك في الحاشية.
- source_word: μωρίαν
  choice: حَمَاقَةٌ
  rationale: يعبر بوضوح عن حكم السامعين على مضمون الكرازة ويحافظ على الصلة المعجمية بموضوع الحماقة والحكمة في السياق المحيط.
theological_decisions:
- issue: هل يُفهم Χριστός لقبًا أم اسمًا شبه عَلَم؟
  choice: الْمَسِيحِ
  alternative: المسيح بوصفه اسمًا مألوفًا دون إبراز دلالة اللقب
  rationale: سياق مضمون المناداة يبرز الدعوى المسيانية، ولذلك حُفظت صيغة اللقب العربية من غير إضافة تفسيرية تحسم أكثر مما يقوله النص.
- issue: علاقة «مصلوبًا» بـ«المسيح»
  choice: المسيح مصلوبًا
  alternative: المسيح الذي صُلِب
  rationale: الصياغة المختارة تحافظ على التكثيف اليوناني وعلى التوتر اللاهوتي في إعلان المسيح نفسه بوصفه مصلوبًا، بدل تحويل العبارة إلى مجرد خبر عن واقعة ماضية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «أمّا نحن فننادي» لإبراز المقابلة في ἡμεῖς δέ، وأُضيف «وهو» لتستقيم الجملة العربية وتوضح أن المسيح المصلوب هو حجر عثرة وحماقة في نظر الفئتين، من غير تغيير مضمون النص.
