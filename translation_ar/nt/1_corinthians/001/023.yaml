  to: أَمَّا نَحْنُ فَنُعْلِنُ الْمَسِيحَ مَصْلُوبًا[a]، فَهُوَ لِلْيَهُودِ حَجَرُ عَثْرَةٍ، وَلِلْأُمَمِ حَمَاقَةٌ[b].
