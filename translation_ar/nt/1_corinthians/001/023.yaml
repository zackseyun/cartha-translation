  verdict: revise
  source_fidelity: يحفظ النص المقابلة في «أمّا نحن»، ولقب «المسيح»، ووصفه «مصلوبًا»، والتوازي بين اليهود والأمم. لكن «نُنادي بالمسيح» في الاستعمال العربي الحديث تميل إلى معنى الدعوة إلى المسيح أو المناداة باسمه، لا إلى جعل «المسيح المصلوب» مضمون الإعلان كما في κηρύσσομεν Χριστὸν ἐσταυρωμένον.
  naturalness: «فنعلن المسيح مصلوبًا» أفصح وأوضح في العربية المعاصرة، ويجعل «المسيح مصلوبًا» مفعول الإعلان مباشرة. وصيغة «فهو لليهود...» سليمة وموجزة وتحافظ على علاقة الوصف بالحكمين اللاحقين.
  terminology: «المسيح»، «اليهود»، «حجر عثرة»، «الأمم»، و«حماقة» اختيارات مناسبة. «الأمم» أمين للفظ ἔθνεσιν، والحاشية تبيّن المقصود السياقي دون فرض قراءة تتجاوز النص.
