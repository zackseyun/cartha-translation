  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: ar
  text: لِأَنَّكُمْ فِيهِ أُغْنِيتُمْ مِنْ كُلِّ وَجْهٍ، فِي كُلِّ كَلَامٍ وَكُلِّ مَعْرِفَةٍ،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّكُمْ
  rationale: تفيد الأداة هنا التعليل، إذ تبيّن سبب شكر بولس المذكور في السياق السابق؛ لذلك نُقلت بـ«لأنّ».
- source_word: ἐν παντὶ
  choice: مِنْ كُلِّ وَجْهٍ
  rationale: تعبير شامل يُراد به الغنى على جميع الوجوه، وهذه الصياغة عربية طبيعية وتحفظ عموم العبارة.
- source_word: ἐπλουτίσθητε
  choice: أُغْنِيتُمْ
  rationale: يحفظ المبني للمجهول في اليونانية، فيدل على أنهم تلقّوا هذا الغنى، كما يحفظ صورة الغنى دون قصرها على المال.
- source_word: ἐν αὐτῷ
  choice: فِيهِ
  rationale: تحفظ دلالة المجال أو الاتحاد التي تؤديها ἐν، ولا تستبدلها بدلالة السببية مثل «به».
- source_word: ἐν παντὶ λόγῳ
  choice: فِي كُلِّ كَلَامٍ
  rationale: λόγος واسع الدلالة، وفي اقترانه بالمعرفة يُرجّح أن يشير إلى التعبير اللفظي أو الكلام؛ و«كل كلام» موجزة وتحفظ التوازي اليوناني.
- source_word: πάσῃ γνώσει
  choice: وَكُلِّ مَعْرِفَةٍ
  rationale: تنقل γνώσις بمعناها العام وتحفظ التوازي البنيوي مع «كل كلام».
theological_decisions:
- issue: دلالة ἐν αὐτῷ
  choice: فِيهِ
  alternative: بِهِ / بواسطته
  rationale: أُبقيت دلالة الكينونة في المسيح أو مجال الارتباط به، بدل حسمها في معنى الوسيلة أو الفاعلية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقّرة، مع الحفاظ على المبني للمجهول، واستعارة الغنى، والتوازي بين الكلام والمعرفة.
