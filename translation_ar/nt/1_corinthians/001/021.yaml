  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: ar
  text: فبما أن العالم، في حكمة الله، لم يعرف الله بالحكمة، ارتضى الله أن يخلِّص الذين يؤمنون بحماقة الرسالة المُعلَنة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحماقة الكرازة».'
    reason: alternative_reading
  - marker: b
    text: 'أي: ما يعدّه العالم حماقةً في الرسالة المُعلَنة.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: فلأن
  rationale: تنقل الصلة التفسيرية التي تفيدها γάρ والسببية التي تفيدها ἐπειδή في صياغة عربية موجزة وطبيعية.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: في حكمة الله
  rationale: تحافظ على إبهام ἐν بين المجال والتدبير، من غير حصرها في معنى الوسيلة.
- source_word: οὐκ ἔγνω
  choice: لم يعرف
  rationale: تنقل الفعل بصياغة واضحة وتحفظ اتساع معنى المعرفة، معرفيًا وعلائقيًا.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: المقابل المألوف الذي يدل هنا على البشر في نظامهم الدنيوي من غير توسع تفسيري.
- source_word: διὰ τῆς σοφίας
  choice: عن طريق الحكمة
  rationale: تبيّن معنى الوسيلة في διά مع المضاف إليه، مع إبقاء «الحكمة» غير محددة بأنها حكمة العالم صراحةً.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: سُرَّ الله
  rationale: تحفظ معنى مشيئة الله الصالحة ورضاه، ولا تختزل الفعل إلى مجرد اتخاذ قرار.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: بحماقة ما يُكرَز به
  rationale: ترجّح دلالة κήρυγμα على مضمون الرسالة المعلنة، مع إبقاء وصف الحماقة في صيغته البلاغية وبيان منظور العالم في الحاشية.
- source_word: σῶσαι
  choice: أن يخلِّص
  rationale: المقابل اللاهوتي العربي المباشر الذي يحفظ دلالة الخلاص.
- source_word: τοὺς πιστεύοντας
  choice: الذين يؤمنون
  rationale: تنقل اسم الفاعل المضارع بصياغة عربية طبيعية من غير إضافة دلالة عقدية غير مصرّح بها.
theological_decisions:
- issue: دلالة διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: تشير أساسًا إلى حماقة الرسالة المعلنة بحسب حكم العالم
  alternative: قد تشير إلى ما يبدو حماقةً في فعل الكرازة أو أسلوبها
  rationale: غالبًا ما يدل κήρυγμα على مضمون ما يُعلَن، لكن السياق لا يستبعد استحضار فعل الكرازة العلني؛ لذلك اختيرت صياغة تبرز المضمون، مع إثبات البديل في الحاشية وعدم نسبة الحماقة إلى حكم الله.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ التوازي بين «حكمة الله» و«الحكمة»، كما حُفظ التوتر البلاغي بين الحكمة والحماقة من غير تسويته تفسيريًا.
