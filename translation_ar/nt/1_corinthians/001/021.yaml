revisions:
- from: فلأن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، سُرَّ الله أن يخلِّص الذين يؤمنون بحماقة ما يُكرَز به[a][b].
  to: فبما أن العالم، في حكمة الله، لم يعرف الله بالحكمة، ارتضى الله أن يخلِّص الذين يؤمنون بحماقة الرسالة المُعلَنة[a][b].
  rationale: تُحسّن المراجعة سلاسة العربية ودقة التعبير عن κήρυγμα، من غير تغيير المعنى أو حسم الالتباس القائم بين مضمون الإعلان وفعل الكرازة. وتبقى العلاقة البلاغية بين حكمة الله والحكمة وحماقة الرسالة ظاهرة، كما تبقى الحاشيتان مرتبطتين بالعبارة ذات الصلة.
