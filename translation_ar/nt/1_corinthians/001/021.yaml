review_pass:
  verdict: revise
  source_fidelity: 'النص يحافظ عمومًا على البنية والمعاني الأساسية: فـ«في حكمة الله» تصون اتساع ἐν، و«بالحكمة» تنقل دلالة الوسيلة في διά، و«الذين يؤمنون» مناسبة لاسم الفاعل المضارع. لكن «سُرَّ الله» أقل سلاسةً في العربية الفصحى المعاصرة في هذا السياق، و«ما يُكرَز به» صياغة أثقل وأقل مباشرة من دلالة κήρυγμα بوصفه الرسالة المعلنة.'
  naturalness: تحتاج بداية الآية إلى صياغة عربية أيسر؛ «فبما أن» تؤدي الرابط التفسيري والسببية بوضوح. كما أن «ارتضى الله» أفصح وأكثر طبيعية هنا من «سُرَّ الله»، مع حفظ معنى المسرة/الرضا الإلهي. و«الرسالة المُعلنة» تعبير واضح وطبيعي لمضمون الكرازة، من دون إلغاء احتمال الإشارة إلى فعل الكرازة في الحاشية.
  terminology: يُحافَظ على «حكمة الله»، و«الحكمة»، و«يخلّص»، و«الذين يؤمنون». وتستبدل «حماقة ما يُكرَز به» بـ«حماقة الرسالة المُعلنة» لأنها أوضح لمصطلح κήρυγμα وتنسجم مع مسار التدقيق الإنجليزي، بينما تبقى «حماقة الكرازة» قراءة بديلة مشروعة في الحاشية.
  issues:
  - severity: low
    issue: صياغة «سُرَّ الله» غير مألوفة نسبيًا في هذا الموضع.
    rationale: هي مفهومة وصحيحة من حيث الأصل، لكن «ارتضى الله» أكثر سلاسة في الفصحى الحديثة وينقل εὐδόκησεν من غير اختزاله إلى قرار محض.
  - severity: medium
    issue: «بحماقة ما يُكرَز به» أقل دقة ووضوحًا في تمثيل κήρυγμα.
    rationale: قد توحي البنية بما يُكرز به بوصفه وسيلة أو موضوعًا، في حين أن المقصود الأول هو الرسالة/المضمون المُعلَن؛ «الرسالة المُعلنة» أوضح، مع إبقاء بديل «الكرازة» في الحاشية لصون مجال الدلالة.
  - severity: low
    issue: «فلأن» صياغة مضغوطة وثقيلة عند افتتاح الآية.
    rationale: «فبما أن» تنقل بصورة طبيعية الرابط الذي يجمع γάρ وἐπειδή.
  revised_text: فبما أن العالم، في حكمة الله، لم يعرف الله بالحكمة، ارتضى الله أن يخلِّص الذين يؤمنون بحماقة الرسالة المُعلَنة[a][b].
