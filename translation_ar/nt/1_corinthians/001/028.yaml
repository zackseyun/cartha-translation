  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: ar
  text: واختار الله ما هو من أصلٍ وضيعٍ في العالم، وما هو مُحتقَر، وما ليس موجودًا[a]، ليُبطل ما هو موجود[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن يُعَدّون لا شيء».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يُصيّر ما هو موجودًا لا شيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: وضيعُ النسب
  rationale: يدل اللفظ على انعدام شرف الميلاد أو المكانة الاجتماعية، وهذه الصياغة تحفظ بُعد النسب والمقام بوضوح.
- source_word: ἐξουθενημένα
  choice: مُحتقَر
  rationale: اسم المفعول يفيد ما عومل باحتقار وعُدّ بلا قيمة؛ و«مُحتقَر» موجز وطبيعي ويحفظ قوة الرفض.
- source_word: τὰ μὴ ὄντα
  choice: ما ليس موجودًا
  rationale: تحفظ العبارة الصادمة في اليونانية، وتبقي التوتر بين معنى عدم الوجود ومعنى انعدام الشأن الاجتماعي.
- source_word: τὰ ὄντα
  choice: ما هو موجود
  rationale: تحافظ هذه الصياغة على المقابلة المتوازنة مع «ما ليس موجودًا» من غير تضييقها على تفسير اجتماعي وحده.
- source_word: καταργήσῃ
  choice: يُبطل
  rationale: الفعل يعني جعل الشيء عديم الفاعلية أو الأثر؛ و«يُبطل» يؤدي المعنى من غير أن يوحي بالضرورة بالإفناء.
- source_word: ἐξελέξατο
  choice: اختار
  rationale: هو المقابل العربي الطبيعي والمألوف لفعل الاختيار الإلهي، ويلائم تكراره في السياق القريب.
theological_decisions:
- issue: هل تُفسَّر عبارتا τὰ μὴ ὄντα وτὰ ὄντα في المتن بوصفهما فئتين اجتماعيتين أم عبارتين وجوديتين مطلقتين؟
  choice: 'الإبقاء على المقابلة القريبة من اللفظ: «ما ليس موجودًا» و«ما هو موجود».'
  alternative: 'صياغتهما تفسيريًا: «مَن لا يُحسبون شيئًا» و«مَن يُحسبون شيئًا».'
  rationale: السياق يتعلق بوضوح بالمكانة في نظر العالم، لكن بولس يصوغ كلامه بعبارة أوسع وأشد وقعًا؛ فالإبقاء عليها يحفظ حدتها البلاغية ودلالتها الاجتماعية معًا من غير حصرها في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم المفرد المحايد «ما هو» مراعاةً لصيغة الجمع المحايد اليونانية مع إبقاء إمكان الإشارة البلاغية إلى الأشخاص والأوضاع الاجتماعية.
