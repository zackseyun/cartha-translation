lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تفيد المطابقة أو المقارنة بما سبق، و«كما» تؤدي وظيفة الرابط بوضوح وطبيعية.
- source_word: μαρτύριον
  choice: الشهادة
  rationale: تحافظ على معنى الشهادة المعلنة وما تنطوي عليه من دلالة إثباتية، من غير تحويلها إلى مجرد «رسالة».
- source_word: τοῦ Χριστοῦ
  choice: عن المسيح
  rationale: تُفهم الإضافة هنا على الأرجح على أنها موضوعية، أي إن المسيح هو موضوع الشهادة؛ و«المسيح» هو المقابل العربي الطبيعي للقب Χριστός.
- source_word: ἐβεβαιώθη
  choice: تأكَّدت
  rationale: تنقل معنى صيرورة الشهادة ثابتة ومؤيَّدة، بصياغة عربية واضحة وطبيعية، مع مراعاة المبني للمجهول في اليونانية دلاليًا.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: مع ضمير الجمع، يُرجَّح أن العبارة تشير إلى ثبوت الشهادة وسط جماعة المؤمنين؛ ويُحفظ احتمال «فيكم» في الحاشية.
theological_decisions:
- issue: دلالة الإضافة في τοῦ Χριστοῦ
  choice: 'إضافة موضوعية: «الشهادة عن المسيح»'
  alternative: 'إضافة ذاتية أو إضافة غير مفصَّلة: «شهادة المسيح»'
  rationale: يرجّح السياق أن المقصود هو الشهادة الرسولية التي موضوعها المسيح والتي تأكدت في جماعة كورنثوس، لكن تركيب اليونانية لا يحسم نوع الإضافة، لذلك حُفظ البديل في الحاشية.
- issue: نطاق ἐν ὑμῖν
  choice: 'جماعي: «بينكم»'
  alternative: 'داخلي أو مباشر: «فيكم»'
  rationale: صيغة الجمع وسياق الجماعة يرجّحان المعنى الجماعي، مع بقاء «فيكم» ترجمة ممكنة تحفظ قرب العبارة اليونانية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. وُضع كل مؤشر حاشية عقب العبارة التي يشرحها، مع تجنّب لغة طائفية أو تفسير يحسم ما تركه الأصل محتملًا.
