source:
  edition: SBLGNT
  text: οὐκ ἀσχημονεῖ, οὐ ζητεῖ τὰ ἑαυτῆς, οὐ παροξύνεται, οὐ λογίζεται τὸ κακόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: ar
  text: لا يتصرّف تصرّفًا مُشينًا[a]، ولا يطلب ما لنفسه[b]، ولا يُستفَزّ[c]، ولا يحسب الإساءة[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يسلك بما لا يليق»، أو: «لا يتصرّف بوقاحة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لا يطلب ما لنفسه»؛ أي لا يسعى إلى مصلحته الذاتية.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لا يحتدّ» أو «لا يُثار إلى الغضب». أما «لا يغضب بسهولة» فتضيف معنى «بسهولة»، وهو غير مذكور صراحة في اليونانية.'
    reason: alternative_reading
  - marker: d
    text: 'أو: «لا يحسب الشر»، وبالمعنى السياقي: «لا يحتفظ بسجلّ للإساءات». حرفيًا، يستعمل النص فعلًا من مجال الحساب مع المفرد «الشر/الإساءة».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: يتصرّف تصرّفًا مُشينًا
  rationale: ينقل معنى السلوك غير اللائق أو المخزي، من غير حصره في الوقاحة وحدها أو إضافة مفعول غير مذكور.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: يطلب ما لنفسه
  rationale: يحافظ على صورة التعبير اليوناني ومعناه الدال على طلب المرء ما يخصه، مع إبقاء مدى العبارة مفتوحًا بدل تخصيصها بالمصالح أو بالإصرار على الرأي.
- source_word: παροξύνεται
  choice: يُستفَزّ
  rationale: يعكس الصيغة الدالة على الاستثارة إلى الحدة أو الغضب، من دون إضافة معنى «بسهولة» غير الموجود صراحة في اليونانية.
- source_word: λογίζεται
  choice: يحسب
  rationale: يحفظ استعارة الحساب أو القيد الكامنة في الفعل، بصياغة عربية موجزة وطبيعية.
- source_word: τὸ κακόν
  choice: الإساءة
  rationale: في هذا السياق العلاقي، تدل العبارة على الشر أو الخطأ الواقع من الغير؛ و«الإساءة» تنقل هذا المعنى بصورة طبيعية، مع الإشارة في الحاشية إلى البدائل الأوسع.
- source_word: ἀγάπη (فاعل مفهوم من السياق)
  choice: فاعل مستتر يعود إلى المحبة
  rationale: العربية تسمح باستمرار سلسلة الأفعال من السياق السابق من غير تكرار كلمة «المحبة»، مع بقاء مرجع الفاعل واضحًا.
theological_decisions:
- issue: هل تُضاف دلالة السهولة إلى παροξύνεται؟
  choice: لا يُستفَزّ
  alternative: لا يغضب بسهولة
  rationale: لا يرد في النص اليوناني ظرف يقابل «بسهولة»، ولذلك أُبقي الحكم مطلقًا من غير تقييد تفسيري.
- issue: هل يُوسَّع λογίζεται τὸ κακόν إلى معنى الاحتفاظ بسجل للإساءات؟
  choice: لا يحسب الإساءة
  alternative: لا يحتفظ بسجلّ للإساءات
  rationale: الصياغة المختارة تحفظ فعل الحساب والمفرد المعرّف في اليونانية، أما البديل فيوضح الدلالة السياقية لكنه توسع تفسيري ويحوّل المفرد إلى جمع.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «مُشينًا» لتغطية البعد الأخلاقي والاجتماعي، و«يُستفَزّ» بلا إضافة «بسهولة»، و«يحسب الإساءة» للمحافظة قدر الإمكان على استعارة الحساب وعلى توتر العبارة اليونانية، مع بيان القراءات التفسيرية في الحواشي.
