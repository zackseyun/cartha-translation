base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: ar
  text: فإننا الآن نرى بواسطة مرآة، على نحوٍ ملغز[a]، أما حينئذ فوجها لوجه. الآن أعرف جزئيًا، أما حينئذ فسأعرف تمامًا، كما عُرِفتُ أنا أيضًا تمامًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بصورة غامضة». واليونانية تقول حرفيًا: «في لغز»، مشيرةً إلى رؤية غير مباشرة وملغزة يصعب إدراكها بوضوح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: نرى
  rationale: يحفظ استعارة الرؤية بصيغة المضارع وبأسلوب عربي مباشر.
- source_word: ἄρτι
  choice: الآن
  rationale: ينقل التقابل الزمني الواضح مع τότε، أي «حينئذ».
- source_word: δι’ ἐσόπτρου
  choice: بواسطة مرآة
  rationale: يحفظ معنى الوساطة في διά مع المضاف إليه، من غير أن يوحي بأن المرآة جسم شفاف يُنظر من خلاله.
- source_word: ἐν αἰνίγματι
  choice: في صورة لغز
  rationale: ينقل الاسم αἴνιγμα بوصفه لغزًا أو قولًا ملغزًا، بدل اختزاله في معنى «بصورة باهتة».
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: وجهًا لوجه
  rationale: تعبير عربي راسخ يحفظ صورة اللقاء المباشر غير المتوسَّط.
- source_word: γινώσκω ἐκ μέρους
  choice: أعرف جزئيًا
  rationale: صياغة طبيعية ودقيقة لعبارة المعرفة الجزئية، وتحافظ على مقابلة المعرفة الآتية.
- source_word: ἐπιγνώσομαι
  choice: سأعرف تمامًا
  rationale: يعكس قوة الفعل المركب والتقابل مع المعرفة الجزئية، من غير أن يصرح بمعرفة إلهية شاملة لكل شيء.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: كما عُرِفتُ أنا أيضًا تمامًا
  rationale: يحفظ المبني للمجهول، ويترك هوية العارف مضمرة كما في اليونانية، كما يحافظ على الصلة اللفظية مع ἐπιγνώσομαι.
theological_decisions:
- issue: مدى المعرفة المستقبلية في التقابل بين المعرفة الجزئية وἐπιγνώσομαι
  choice: سأعرف تمامًا
  alternative: سأعرف كل شيء
  rationale: النص يعد بمعرفة كاملة بالمعنى المقصود في هذا التقابل، لكنه لا ينص على أن الإنسان سيحوز علمًا مطلقًا أو مساويًا لعلم الله؛ لذلك تتجنب الصياغة إضافة هذا الادعاء.
- issue: هوية من عَرَف بولس في العبارة المبنية للمجهول
  choice: 'الإبقاء على المبني للمجهول: «عُرِفتُ»'
  alternative: كما عرفني الله تمامًا
  rationale: مع أن السياق قد يُفهم منه أن الله هو العارف، لا يذكر النص الفاعل صراحة، فحُفظ هذا الإضمار والتوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ التوازي بين «الآن» و«حينئذ»، وبين المعرفة الجزئية والمعرفة التامة، مع تجنب الصياغات المذهبية أو تفسير المبني للمجهول داخل المتن.
