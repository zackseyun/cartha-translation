  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: ar
  text: ولكن متى جاء ما هو كامل[a]، يُبطَل[b] ما هو جزئي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ما هو تام» أو «ما هو ناضج». العبارة اليونانية موضع خلاف؛ فقد تُفهم على أنها الكمال أو النضج أو الاكتمال الأخروي في مقابل الحالة الجزئية الحاضرة.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا: «يزول»، أو «يُلغى»، أو «يُوضَع جانبًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: متى
  rationale: تُدخل جملة زمنية تتعلق بحدث مستقبلي مرتقب، وتحافظ هنا على معنى «عندما» مع مسحة الترقب التي في صيغة الأصل.
- source_word: δὲ
  choice: ولكن
  rationale: تُظهر المقابلة اللطيفة بين الحالة الجزئية الحاضرة وما سيأتي من كمال.
- source_word: ἔλθῃ
  choice: جاء
  rationale: الفعل الماضي بعد «متى» في العربية الفصيحة ملائم للدلالة على حدث مستقبلي متحقق الوقوع في سياقه الزمني.
- source_word: τὸ τέλειον
  choice: ما هو كامل
  rationale: تحافظ صيغة «ما هو» على الطابع المحايد والاسمي للتعبير اليوناني، وتبقي دلالة اللفظ مفتوحة بين الكامل والتام والناضج من غير تعيين مرجعه.
- source_word: τὸ ἐκ μέρους
  choice: ما هو جزئي
  rationale: تنقل العبارة الاسمية اليونانية بمعنى ما لا يوجد إلا جزئيًا، وتقابل «ما هو كامل» بوضوح.
- source_word: καταργηθήσεται
  choice: يُبطَل
  rationale: تنقل صيغة المستقبل المبني للمجهول ومعنى جعل الشيء غير فاعل أو إنهائه، من غير أن توحي بالضرورة بإفنائه.
theological_decisions:
- issue: مرجع τὸ τέλειον ومعناه
  choice: إبقاء العبارة عامة بصيغة «ما هو كامل» من غير تحديد مرجعها
  alternative: «ما هو تام»، أو «ما هو ناضج»، أو فهمها على أنها اكتمال أخروي مرتبط بمجيء المسيح أو بالمعرفة وجهًا لوجه، أو تفسيرها باكتمال قانون الأسفار المقدسة
  rationale: لا يحدد النص اليوناني في هذه الآية مرجع العبارة صراحة. وصيغة المحايد المفرد تلائم معنى مجردًا أو جامعًا، لكنها لا تحسم وحدها الخلاف التفسيري؛ لذلك ينبغي ألا تفرض الترجمة تفسيرًا عقائديًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت الصياغتان المتوازيتان «ما هو كامل» و«ما هو جزئي» لإبراز المقابلة في الأصل، مع تجنب جعل «الكامل» لقبًا شخصيًا أو حصره في تفسير لاهوتي محدد.
