  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: ar
  text: وَإِنْ وَزَّعْتُ كُلَّ مُمْتَلَكَاتِي، وَإِنْ سَلَّمْتُ جَسَدِي لِكَيْ أُحْرَقَ، وَلَكِنْ لَمْ تَكُنْ لِي مَحَبَّةٌ، فَلَا أَسْتَفِيدُ شَيْئًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «لكي أفتخر» بدلًا من «لكي أُحرَق».'
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: وَزَّعْتُ
  rationale: يفيد الفعل توزيع الشيء لقمةً لقمة أو جزءًا جزءًا، ويشير هنا إلى بذل الممتلكات للآخرين؛ و«وزعت» واضحة وتحفظ دلالة التوزيع المقصود.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: كل ممتلكاتي
  rationale: تشير العبارة إلى ما يملكه المتكلم من أموال ومقتنيات، و«كل ممتلكاتي» تعبير عربي واضح يحفظ شمول العبارة.
- source_word: παραδῶ
  choice: سلَّمتُ
  rationale: يحفظ معنى الدفع أو التسليم من غير إضافة تفسير مثل «ضحيت»، ويلائم تسليم الجسد للأذى.
- source_word: τὸ σῶμά μου
  choice: جسدي
  rationale: ترجمة مباشرة للعبارة الحسية من غير توسع مجازي.
- source_word: ἵνα
  choice: لكي
  rationale: تبيّن الغاية أو النتيجة المقصودة وتحفظ علاقة الجملة بما قبلها.
- source_word: καυθήσομαι
  choice: أُحرَق
  rationale: ترجمة مباشرة لقراءة SBLGNT المبنية للمجهول من καίω، مع إثبات القراءة النصية الأخرى في الحاشية.
- source_word: ἀγάπην
  choice: محبة
  rationale: «محبة» هي المقابل العربي الطبيعي والراسخ لـἀγάπη هنا، من غير تضييق معناها إلى الصدقة وحدها.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: فلا أنتفع شيئًا
  rationale: يحفظ صيغة الفعل التي تركز على عدم حصول المتكلم على أي نفع، وهو تعبير عربي فصيح ومفهوم.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: وإن ... وإن
  rationale: يحفظ تكرار الشرط وتصاعد الافتراضين في بلاغة بولس.
theological_decisions:
- issue: الاختلاف النصي في جملة الغاية
  choice: اتباع قراءة SBLGNT καυθήσομαι وترجمتها «أُحرَق» في المتن.
  alternative: καυχήσωμαι — «أفتخر»
  rationale: النص اليوناني المعطى يقرأ صيغة من καίω بمعنى الحرق. ولأن القراءة الأخرى تغيّر المعنى من التعرض للحرق إلى الافتخار، تُذكر في الحاشية حفاظًا على الشفافية وعلى التوتر التفسيري الحقيقي.
translation_notes:
  register: العربية الفصحى المعاصرة الواضحة ذات نبرة كريمة. حُفظ التوازي الشرطي، وتُجنبت ألفاظ مذهبية أو تفسيرات توسعية. وُضع مؤشر الحاشية بعد الجملة كلها لأنه يتعلق باختلاف نصي داخل جملة الغاية.
