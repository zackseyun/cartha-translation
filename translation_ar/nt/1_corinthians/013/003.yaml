revisions:
- from: وَإِنْ وَزَّعْتُ كُلَّ مُمْتَلَكَاتِي، وَإِنْ سَلَّمْتُ جَسَدِي لِكَيْ أُحْرَقَ، وَلَكِنْ لَمْ تَكُنْ لِي مَحَبَّةٌ، فَلَا أَنْتَفِعُ شَيْئًا.[a]
  to: وَإِنْ وَزَّعْتُ كُلَّ مُمْتَلَكَاتِي، وَإِنْ سَلَّمْتُ جَسَدِي لِكَيْ أُحْرَقَ، وَلَكِنْ لَمْ تَكُنْ لِي مَحَبَّةٌ، فَلَا أَسْتَفِيدُ شَيْئًا.[a]
  rationale: اقتصر التعديل على استبدال «أنتفع» بـ«أستفيد» في الخاتمة لتحسين الفصاحة والوضوح مع الحفاظ على الدلالة الشخصية لعبارة οὐδὲν ὠφελοῦμαι («لا أحصل على أي فائدة»). أُبقيت قراءة الحرق في المتن، وأُبقي البديل «أفتخر» في الحاشية، كما أُبقيت البنية الشرطية والتعبيرات الرئيسة دون تغيير.
