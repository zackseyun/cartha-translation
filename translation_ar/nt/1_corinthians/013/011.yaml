source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: ar
  text: لَمَّا كُنْتُ طِفْلًا، كُنْتُ أَتَكَلَّمُ كَطِفْلٍ، وَأَفْكِرُ كَطِفْلٍ، وَأَسْتَدِلُّ كَطِفْلٍ. وَلَمَّا صِرْتُ رَجُلًا، تَرَكْتُ مَا لِلطِّفْلِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أمور الطفل، أو طرائق الطفل. واليونانية حرفيًا: «ما للطفل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: طِفْل
  rationale: يدل اللفظ على طفل صغير أو غير ناضج. واختيار «طفل» طبيعي في العربية ويحفظ المقابلة مع «رجل» من غير حصر المعنى في الرضيع.
- source_word: ἐλάλουν
  choice: كنت أتكلم
  rationale: ترجمة واضحة مباشرة تحافظ على صيغة الماضي المستمر وعلى التوازي البلاغي.
- source_word: ἐφρόνουν
  choice: كنت أفكر
  rationale: يعبر الفعل عن التفكير أو الذهنية؛ و«أفكر» موجز وطبيعي في هذا السياق، مع إبقاء تمييزه عن الاستدلال.
- source_word: ἐλογιζόμην
  choice: كنت أستدل
  rationale: يحمل الفعل معنى الحساب أو الاعتبار أو التفكير الاستدلالي. و«أستدل» يميز العملية العقلية المقصودة عن «أفكر»، من غير إطالة تفسيرية.
- source_word: γέγονα
  choice: صرت
  rationale: صيغة التمام تصف بلوغ حالة جديدة؛ و«صرت» تؤدي الانتقال بوضوح وطبيعية بعد «لما».
- source_word: ἀνήρ
  choice: رجلًا
  rationale: الاسم مذكر صريح ويقابل الطفل في مثال بولس الشخصي؛ لذا حُفظت دلالته الجنسية الأصلية بدل تعميمها إلى «بالغ».
- source_word: κατήργηκα
  choice: تركت
  rationale: يدل هنا على إبطال عمل أشياء الطفولة أو وضعها جانبًا. و«تركت» عربية طبيعية تلائم صورة النضج، مع تجنب لفظ تقني مثل «أبطلت».
- source_word: τὰ τοῦ νηπίου
  choice: ما للطفل
  rationale: يحفظ التركيب الإضافي اليوناني العام، «الأشياء الخاصة بالطفل»، ولا يحصره في الأشياء المادية أو يضيف حكمًا سلبيًا مثل «التصرفات الطفولية».
theological_decisions:
- issue: المقابلة المذكرة في ἀνήρ
  choice: رجلًا
  alternative: بالغًا
  rationale: النص اليوناني يستعمل اسمًا مذكرًا صريحًا، وبولس يتحدث عن نفسه في مثال للنضج. إبقاء «رجلًا» يحفظ صورة النص من غير أن يُفهم منه تفضيل عقائدي للذكور.
- issue: مدى عبارة τὰ τοῦ νηπίου
  choice: ما للطفل
  alternative: الأمور الطفولية / طرائق الطفل
  rationale: العبارة اليونانية عامة ومقتضبة، فحُفظ اتساعها بدل حصرها في سلوك مذموم أو في عادات بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات إيقاع متوازٍ. استُعمل تكرار «كطفل» حفاظًا على التوازي الثلاثي في الأصل، ووُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
