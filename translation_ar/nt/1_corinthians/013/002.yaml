- from: وَإِنْ كَانَتْ لِي نُبُوَّةٌ، وَعَرَفْتُ جَمِيعَ الأَسْرَارِ وَكُلَّ مَعْرِفَةٍ، وَإِنْ كَانَ لِي الإِيمَانُ كُلُّهُ[a] حَتَّى أَنْقُلَ الْجِبَالَ، وَلَكِنْ لَمْ تَكُنْ لِي مَحَبَّةٌ، فَأَنَا لَا شَيْءَ.
  to: وَإِنْ كَانَتْ لِي نُبُوَّةٌ، وَعَرَفْتُ جَمِيعَ الأَسْرَارِ وَكُلَّ مَعْرِفَةٍ، وَإِنْ كَانَ لِي الإِيمَانُ كُلُّهُ[a] حَتَّى أَنْقُلَ الْجِبَالَ، وَلَكِنْ لَا مَحَبَّةَ لِي، فَلَسْتُ شَيْئًا.
  rationale: أُبقيت جميع المقابلات الأساسية والحاشية كما هي. واقتصر التعديل على استبدال النفي الماضي بتركيب اسمي حاضر («لا محبة لي») وعلى صياغة النتيجة العربية المألوفة («فلست شيئًا»)، ليوافقا زمن اليونانية ووظيفتها البلاغية بقدر أفضل.
