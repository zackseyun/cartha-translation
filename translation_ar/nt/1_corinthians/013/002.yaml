reference: 1 Corinthians 13:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: ar
  text: وَإِنْ كَانَتْ لِي نُبُوَّةٌ، وَعَرَفْتُ جَمِيعَ الأَسْرَارِ وَكُلَّ مَعْرِفَةٍ، وَإِنْ كَانَ لِي الإِيمَانُ كُلُّهُ[a] حَتَّى أَنْقُلَ الْجِبَالَ، وَلَكِنْ لَا مَحَبَّةَ لِي، فَلَسْتُ شَيْئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «الثقة كلها»؛ والأقل احتمالًا: «الأمانة كلها». تحمل الكلمة اليونانية هذه المعاني، لكن السياق هنا يرجّح الإيمان الاستثنائي.'
    reason: بديل معجمي يوضح مجال معنى πίστις مع عدم حسمه بأكثر مما يسمح به السياق.
lexical_decisions:
- source_word: προφητείαν
  choice: نُبُوَّةٌ
  rationale: يحافظ اللفظ المباشر على سعة معنى الاسم اليوناني في سياق المواهب الروحية، من غير أن يقيّده بفعل التنبؤ أو بمنصب النبي.
- source_word: εἰδῶ
  choice: عَرَفْتُ
  rationale: ينقل فعل المعرفة والإدراك بوضوح، مع إبقاء التمييز اللفظي بين الفعل وبين الاسم γνῶσις المترجم «معرفة».
- source_word: μυστήρια
  choice: الأَسْرَارِ
  rationale: «الأسرار» هو المقابل اللاهوتي الطبيعي في العربية، ويحفظ معنى الحقائق الإلهية الخفية أو المعلنة دون شرح زائد داخل المتن.
- source_word: γνῶσιν
  choice: مَعْرِفَةٍ
  rationale: ترجمة اسمية مباشرة تحفظ التوازي والمبالغة الشاملة في العبارة «كل معرفة».
- source_word: πᾶσαν τὴν πίστιν
  choice: الإِيمَانُ كُلُّهُ
  rationale: يحفظ المعنى المعتاد لـ πίστις وصيغة الشمول المبالغ فيها؛ والسياق يرجح إيمانًا استثنائيًا مرتبطًا بنقل الجبال، لا استعمالًا تقنيًا عن الإيمان الخلاصي.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: حَتَّى أَنْقُلَ الْجِبَالَ
  rationale: صياغة عربية طبيعية تحفظ صورة نقل الجبال ودلالة النتيجة أو القدرة التي تفيدها ὥστε مع المصدر.
- source_word: ἀγάπην
  choice: مَحَبَّةٌ
  rationale: «المحبة» المقابل العربي الواضح والمستقر لـ ἀγάπη، من غير تضييق المعنى على الصدقة أو الإحسان وحدهما.
- source_word: οὐθέν εἰμι
  choice: فَأَنَا لَا شَيْءَ
  rationale: يحفظ النفي الحاد المتعلق بكيان المتكلم وقيمته، بدل تحويله إلى مجرد القول إن أعماله لا تنفع.
theological_decisions:
- issue: دلالة πίστις في سياق القدرة الخارقة على نقل الجبال
  choice: الإيمان
  alternative: 'الثقة؛ والأقل احتمالًا: الأمانة'
  rationale: يرجح السياق معنى الإيمان الاستثنائي القادر على صنع العجائب. أما «الثقة» فممكنة معجميًا، و«الأمانة» من معاني الكلمة في سياقات أخرى لكنها أضعف هنا؛ لذلك بقي «الإيمان» في المتن وحُفظ البديلان في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي التصاعدي والتكرار في الأصل، كما حُفظت المبالغة في «جميع الأسرار» و«كل معرفة» و«الإيمان كله». وُضعت علامة الحاشية بعد «الإيمان كله» لأنها تخص πίστις، لا «المعرفة».
