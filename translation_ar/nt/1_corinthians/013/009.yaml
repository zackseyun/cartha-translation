- source_word: γινώσκομεν
  choice: نعرف
  rationale: ترجمة مباشرة تحفظ الدلالة المعرفية للفعل من غير توسيعها إلى معنى الفهم العميق.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل بين العبارتين المتوازيتين ويحفظ بنيتهما.
- source_word: προφητεύομεν
  choice: نتنبأ
  rationale: يؤدي الفعل الدال على ممارسة النبوة في سياق المواهب الروحية، من غير حصره في الإخبار بالمستقبل أو في الوعظ العام.
theological_decisions:
