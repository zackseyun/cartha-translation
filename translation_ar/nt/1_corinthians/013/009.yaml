  choice: نتنبأ
  alternative: نخبر بأحداث المستقبل؛ نعظ
  rationale: السياق المباشر يتناول المواهب الروحية، ويمكن للفعل اليوناني أن يدل على كلام نبوي موحى به بمعنى أوسع من مجرد التنبؤ بالمستقبل. وتحفظ الصياغة المختارة هذا الاتساع من غير حسم تفسير محل نقاش.
