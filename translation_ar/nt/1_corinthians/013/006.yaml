translation:
  language: ar
  text: لا يفرحُ بالظلم[a]، بل يفرحُ مع الحقّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالإثم» أو «بفعل الشر». ويمكن أن تدل الكلمة اليونانية أيضًا على الجور وعدم العدل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يفرح بالحقّ». قد يعني الفعل اليوناني المركّب المشاركة في الفرح مع الحقّ، أو الفرح بالحقّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: يفرح
  rationale: ينقل معنى الفرح والسرور، ويحافظ على التوازي اللفظي مع συγχαίρει بأسلوب عربي طبيعي رصين.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: بالظلم
  rationale: الباء مع «يفرح» تعبّر طبيعيًا عن سبب الفرح أو موضوعه. و«الظلم» لفظ عربي واسع يشمل التعدّي وفعل الشر وغياب العدل، مع إثبات البدائل في الحاشية.
- source_word: συγχαίρει
  choice: يفرح مع
  rationale: يحافظ على دلالة السابقة συν- التي تفيد المشاركة في الفرح، من غير حسم مَن أو ما الذي يُشارَك في الفرح معه.
- source_word: δὲ
  choice: بل
  rationale: تفيد الانتقال التصحيحي والتضاد بين ما لا تفعله المحبة وما تفعله، وهي أنسب عربيًا بعد النفي.
- source_word: τῇ ἀληθείᾳ
  choice: الحقّ
  rationale: يحفظ أداة التعريف والتقابل الأخلاقي مع ἀδικία، من غير قصر المعنى على صدق الكلام أو السلوك أو مضمون البشارة وحده.
theological_decisions:
- issue: دلالة ἀδικία في التقابل الأخلاقي البولسي
  choice: الظلم
  alternative: الإثم أو فعل الشر
  rationale: «الظلم» يحفظ مجال اللفظة الأخلاقي ومعنى مخالفة العدل، وهو أفصح وأيسر للقارئ العربي من «عدم البر». وتبيّن الحاشية أن الأصل قد يشمل الإثم وفعل الشر، حتى لا يُحصر في الظلم الاجتماعي وحده.
- issue: دلالة المشاركة في συγχαίρει
  choice: يفرح مع الحقّ
  alternative: يفرح بالحقّ
  rationale: الصياغة المختارة تُظهر عنصر المشاركة الذي في الفعل المركب وتحفظ غرابة الصورة المقصودة، بينما تذكر الحاشية القراءة العربية الطبيعية البديلة التي تركّز على موضوع الفرح.
translation_notes:
  register: عربية فصحى حديثة، موجزة ورصينة، تحافظ على التوازي البلاغي بين «لا يفرح» و«يفرح»، وعلى التضاد بين «الظلم» و«الحقّ». أُبقي الفاعل مستترًا اتساقًا مع سياق وصف المحبة في الآيات المحيطة.
