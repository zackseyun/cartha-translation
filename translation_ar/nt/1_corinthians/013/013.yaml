base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: ar
  text: 'أَمَّا الآنَ فَتَبْقَى هذِهِ الثَّلاثَةُ: الإِيمَانُ، وَالرَّجَاءُ، وَالْمَحَبَّةُ؛ وَأَعْظَمُهَا الْمَحَبَّةُ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «وأعظمُ هذه المحبةُ»؛ جاءت «أعظم» في اليونانية بصيغة المقارنة، لكن السياق يرتّب المحبة بين الثلاثة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أَمَّا الآنَ
  rationale: تنقل νυνί بمعنى «الآن»، وتحفظ δέ بوصفها أداة انتقال فيها مسحة مقابلة في ختام الحجة، من غير تشديد زائد على التعارض.
- source_word: μένει
  choice: فَتَبْقَى
  rationale: الفعل μένω هنا يدل على البقاء والاستمرار، في مقابل ما يزول مما سبق ذكره. و«تبقى» واضحة وطبيعية في العربية المعاصرة.
- source_word: πίστις
  choice: الإِيمَانُ
  rationale: في هذا الثالوث البولسي مع الرجاء والمحبة، «الإيمان» هو المقابل العربي المألوف والأرجح، مع أن معنى الثقة حاضر في المجال الدلالي للكلمة.
- source_word: ἐλπίς
  choice: الرَّجَاءُ
  rationale: «الرجاء» هو التعبير العربي الكتابي الواضح عن التطلع الواثق الذي تدل عليه ἐλπίς، وهو أنسب من «التوقع» في هذا السياق.
- source_word: ἀγάπη
  choice: الْمَحَبَّةُ
  rationale: «المحبة» تؤدي معنى ἀγάπη بوضوح وكرامة، وتناسب موضوع الإصحاح من دون إدخال تخصيص مذهبي.
- source_word: τὰ τρία ταῦτα
  choice: هذِهِ الثَّلاثَةُ
  rationale: صياغة عربية موجزة تشير مباشرة إلى الإيمان والرجاء والمحبة، وتحفظ قوة اسم الإشارة.
- source_word: μείζων δὲ τούτων ἡ ἀγάπη
  choice: وَأَعْظَمُهَا الْمَحَبَّةُ
  rationale: مع أن μείζων صيغة مقارنة، فإن تركيبها مع τούτων يرتب المحبة داخل مجموعة الثلاثة؛ لذا تؤدي «أعظمها» المعنى العربي الطبيعي بدقة.
theological_decisions:
- issue: 'دلالة πίστις في الثالوث: الإيمان والرجاء والمحبة'
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: السياق يرجح «الإيمان» بوصفه الفضيلة المقترنة بالرجاء والمحبة. ولم تُختَر «الأمانة» لأنها أقل احتمالًا هنا، بينما تظل «الثقة» جانبًا ممكنًا من الدلالة لا يستدعي استبدال اللفظ المألوف.
- issue: قوة صيغة المقارنة μείζων في ترتيب الفضائل الثلاث
  choice: وأعظمها المحبة
  alternative: والمحبة أعظم من هذه
  rationale: التركيب اليوناني يقرر تفوق المحبة ضمن الثلاثة. «أعظمها» تنقل هذا الترتيب طبيعيًا من غير توسيع سبب التفوق أو حسم أسئلة لاهوتية لا يصرح بها النص.
- issue: العلاقة الخطابية في νυνὶ δὲ
  choice: أما الآن
  alternative: والآن؛ لكن الآن
  rationale: الأداة δέ تحتمل الانتقال أو المقابلة الخفيفة. «أما الآن» تحفظ هذا التوتر دون جعلها مجرد عطف أو استدراك حاد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات إيقاع وقور. استُعملت ألفاظ «الإيمان، الرجاء، المحبة» لشيوعها ودقتها، مع تجنب التراكيب القديمة غير اللازمة. وُضعت علامة الحاشية بعد الجملة التي تتصل بها.
