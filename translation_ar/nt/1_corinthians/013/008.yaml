reference: 1 Corinthians 13:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: ar
  text: المحبة لا تفشل أبدًا[a]. وأما النبوات فستُبطَل، وأما الألسنة[b] فستتوقف، وأما المعرفة فستُبطَل[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المحبة لا تسقط أبدًا» أو «المحبة لا تنتهي أبدًا».'
    reason: بدائل معجمية للفعل πίπτει، الذي يحتمل صورة السقوط أو معنى الإخفاق أو عدم الدوام بحسب السياق.
  - marker: b
    text: 'أو: «اللغات».'
    reason: بديل معجمي ممكن لـγλῶσσαι مع إبقاء طبيعة الظاهرة دون حسم.
  - marker: c
    text: الفعل المترجم «ستُبطَل» هنا هو نفسه المستخدم مع «النبوات».
    reason: إظهار التوازي اللفظي في الأصل بين عبارتي النبوات والمعرفة.
lexical_decisions:
- source_word: ἀγάπη
  choice: المحبة
  rationale: اللفظ العربي المألوف والأوسع دلالة للمحبة التي يتحدث عنها بولس، من غير تضييقها في معنى الصدقة أو الإحسان.
- source_word: οὐδέποτε
  choice: لا... أبدًا
  rationale: ينقل النفي المطلق بصياغة عربية طبيعية وواضحة.
- source_word: πίπτει
  choice: تفشل
  rationale: استعمال سياقي يفيد أن المحبة لا تخفق ولا تفقد فاعليتها، مع عدم دمجه في أفعال التوقف والإبطال اللاحقة.
- source_word: εἴτε δὲ
  choice: وأما
  rationale: تؤدي التحول التقابلي وتناسب تتابع العناصر الثلاثة في عربية فصيحة طبيعية.
- source_word: προφητεῖαι
  choice: النبوات
  rationale: المقابل الاصطلاحي الواضح الذي يمكن أن يشمل الأقوال أو الممارسات النبوية في السياق.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: ستُبطَل
  rationale: تحافظ على المبني للمجهول وعلى وحدة الفعل في عبارتي النبوات والمعرفة، وتفيد زوال العمل أو الفاعلية دون التصريح بالفناء.
- source_word: γλῶσσαι
  choice: الألسنة
  rationale: يحفظ التعبير الاصطلاحي في سياق المواهب ولا يحسم طبيعة الظاهرة، مع ذكر «اللغات» بديلًا ممكنًا في الحاشية.
- source_word: παύσονται
  choice: ستتوقف
  rationale: ينقل معنى الكف أو التوقف ويحافظ على اختلاف الفعل عن καταργέω في العبارتين المحيطتين.
- source_word: γνῶσις
  choice: المعرفة
  rationale: المقابل المباشر الملائم للاستعمال البولسي وللسياق اللاحق عن المعرفة الجزئية.
theological_decisions:
- issue: دلالة πίπτει في وصف المحبة
  choice: المحبة لا تفشل أبدًا
  alternative: المحبة لا تسقط أبدًا؛ المحبة لا تنتهي أبدًا
  rationale: «لا تفشل» عربية مفهومة تعبّر عن ثبات المحبة ودوام فاعليتها، من غير مساواة الفعل بأفعال التوقف والإبطال الواردة لاحقًا؛ وتبقى البدائل الدلالية في الحاشية.
- issue: دلالة γλῶσσαι في هذا السياق
  choice: الألسنة
  alternative: اللغات
  rationale: «الألسنة» تحافظ على المصطلح السياقي المرتبط بالموهبة، من غير حسم الجدل حول كون الظاهرة لغات بشرية معروفة أو غير ذلك.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدم التوازي «وأما... فـ» لإبراز البنية الثلاثية، وحُفظ الفرق بين «ستُبطَل» و«ستتوقف»، مع تجنب فرض تفسير مذهبي لطبيعة الألسنة أو توقيت انتهاء المواهب.
