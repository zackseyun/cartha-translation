  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: ar
  text: تَحْتَمِلُ كُلَّ شَيْءٍ[a]، وَتُصَدِّقُ كُلَّ شَيْءٍ[b]، وَتَرْجُو كُلَّ شَيْءٍ، وَتَصْبِرُ عَلَى كُلِّ شَيْءٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تستر كل شيء»؛ فقد يدل الفعل اليوناني على الستر أو الحماية، كما يدل على الاحتمال.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تثق في كل شيء»؛ وليس المعنى أن المحبة ساذجة، بل أنها تميل إلى الثقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: كُلَّ شَيْءٍ
  rationale: يحافظ على الشمول وعلى التكرار البلاغي الرباعي في النص اليوناني من غير تقييد للمفعول أو زيادة تفسيرية.
- source_word: στέγει
  choice: تَحْتَمِلُ
  rationale: ينقل في هذا السياق معنى الاحتمال والثبات إزاء المشقة، مع إبقاء معنى «تستر» الممكن معجميًا في الحاشية.
- source_word: πιστεύει
  choice: تُصَدِّقُ
  rationale: مقابل مباشر للفعل الذي قد يعني التصديق أو الثقة. يحفظ الإيجاز والتوازي، ولا يلزم منه أن المحبة ساذجة أو عديمة التمييز.
- source_word: ἐλπίζει
  choice: تَرْجُو
  rationale: ترجمة مباشرة طبيعية تعبّر عن صفة المحبة المستمرة وتحافظ على إيقاع العبارات الموجزة.
- source_word: ὑπομένει
  choice: تَصْبِرُ عَلَى
  rationale: يؤدي معنى الثبات تحت الضغط والمداومة على الاحتمال، وهو تعبير عربي طبيعي يلائم خاتمة السلسلة.
theological_decisions:
- issue: دلالة تكرار πάντα في وصف المحبة
  choice: الإبقاء على العبارة الشاملة «كل شيء» بوصفها وصفًا بلاغيًا لثبات المحبة الشامل.
  alternative: فهمها على أنها قبول مطلق لكل أمر أو تصديق ساذج لكل دعوى.
  rationale: السياق وصف شعري لخصال المحبة؛ لذلك يُحفظ إطلاق العبارة وتوترها من غير أن تُفسَّر على أنها إلغاء للتمييز الأخلاقي أو دعوة إلى السذاجة.
- issue: التداخل الدلالي بين στέγει وὑπομένει
  choice: ترجمة الأول «تحتمل» والأخير «تصبر على»، مع ذكر «تستر» بديلًا للأول.
  alternative: ترجمة الفعلين بلفظ عربي واحد، أو اعتماد «تستر» في المتن.
  rationale: الاختيار يبيّن قدرًا من التدرج بين الاحتمال والصبر الثابت، من غير إخفاء الاحتمال المعجمي الآخر للفعل الأول.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع توازٍ رباعي وتكرار «كل شيء» كما في الأصل. استُعمل ضبط جزئي كامل للجملة لتوضيح البنية، وأُبقيت البدائل الدلالية الحقيقية في الحواشي.
