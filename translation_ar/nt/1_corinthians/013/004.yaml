  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: ar
  text: المحبة تتأنّى، والمحبة تترفق. لا تحسد[a]، ولا تتباهى، ولا تنتفخ من الكبرياء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تغار». يمكن أن يدل الفعل اليوناني على الغيرة أو الحماسة، لكن السياق المنفي هنا يرجّح معنى الحسد.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا تتكبر». يستعمل بولس صورة الانتفاخ للدلالة على التعاظم والكبرياء.'
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἀγάπη
  choice: المحبة
  rationale: «المحبة» هي المقابل العربي الطبيعي الواسع الدلالة، وتحافظ على المعنى الأخلاقي والعلائقي من غير حصره في الصدقة أو الإحسان المادي.
- source_word: μακροθυμεῖ
  choice: تتأنّى
  rationale: يفيد الفعل طول الصبر، ولا سيما في معاملة الآخرين. و«تتأنّى» تعبير عربي موجز وطبيعي يحفظ البعد الاستمراري للفعل.
- source_word: χρηστεύεται
  choice: تترفق
  rationale: يدل الفعل النادر على إظهار اللطف والإحسان في التعامل. و«تترفق» تحافظ على الصيغة الفعلية وتلائم السياق العلائقي.
- source_word: ζηλοῖ
  choice: تحسد
  rationale: يمكن أن يدل الفعل بحسب السياق على الغيرة أو الحماسة، لكن النفي وسلسلة الصفات السلبية هنا يرجحان معنى الحسد.
- source_word: περπερεύεται
  choice: تتباهى
  rationale: يشير الفعل إلى التفاخر والاستعراض الذاتي؛ و«تتباهى» واضحة وفصيحة وتحافظ على كونه فعلًا.
- source_word: φυσιοῦται
  choice: تنتفخ كبرياءً
  rationale: يحفظ هذا التعبير صورة الانتفاخ التي يستخدمها بولس للدلالة على التعاظم، مع بيان جهة الصورة بكلمة «كبرياءً».
- source_word: οὐ
  choice: لا
  rationale: تؤدي «لا» معنى النفي مع الأفعال المضارعة بصورة طبيعية ومتسقة في العربية.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: المحبة ... والمحبة ... [ضمير مستتر في الأفعال التالية]
  rationale: حُفظ تكرار «المحبة» في الجملتين الأوليين للتوكيد البلاغي، ثم استُعمل الضمير المؤنث المستتر في الأفعال اللاحقة اتساقًا مع أسلوب العربية ومن غير تكرار ثقيل.
theological_decisions:
- issue: ترجمة ἀγάπη في هذا المقطع الأخلاقي واللاهوتي
  choice: المحبة
  alternative: الحب؛ الإحسان
  rationale: «المحبة» مألوفة وواضحة في العربية الفصحى، وتشمل البعد الأخلاقي والعلائقي المقصود، بخلاف «الإحسان» الذي قد يضيّق المعنى إلى فعل الخير أو العطاء.
- issue: دلالة ζηλοῖ المنفية
  choice: لا تحسد
  alternative: لا تغار
  rationale: للفعل مجال دلالي يشمل الغيرة والحماسة والحسد، لكن السياق السلبي يرجح الحسد؛ وقد أُبقي البديل الممكن في الحاشية بدل إلغاء التعدد الدلالي.
- issue: صورة φυσιοῦται البلاغية
  choice: لا تنتفخ كبرياءً
  alternative: لا تتكبر
  rationale: حُفظت استعارة الانتفاخ المرتبطة بالكبرياء في استعمال بولس، بدل تسويتها إلى وصف تجريدي فحسب.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. حُفظ الإيقاع القائم على أفعال قصيرة متوازية، كما حُفظ تكرار «المحبة» في مطلع القول والاستعارة البولسية في «تنتفخ».
