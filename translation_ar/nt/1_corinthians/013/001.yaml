base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: ar
  text: إِنْ كُنْتُ أَتَكَلَّمُ بِأَلْسِنَةٍ[a] الْبَشَرِ وَالْمَلَائِكَةِ، وَلَكِنْ لَيْسَتْ لِي مَحَبَّةٌ، فَقَدْ صِرْتُ نُحَاسًا يَرِنُّ[b] أَوْ صَنْجًا صَاخِبًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «بألسنة» إلى «بلغات». وقد يشير اللفظ اليوناني إلى الألسنة أو اللغات؛ واستُعملت «ألسنة» للمحافظة على الصلة بمناقشة الكلام بالألسنة في هذه الرسالة.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «برونزًا يدوّي». يشير اللفظ اليوناني إلى معدن مُصوِّت، لا إلى آلة موسيقية محددة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: إِنْ كُنْتُ
  rationale: يفتتح شرطًا افتراضيًا، وهذه الصياغة العربية الطبيعية تلائم اقتران فعل الشرط بالمضارع في اليونانية.
- source_word: ταῖς γλώσσαις
  choice: بِأَلْسِنَةِ
  rationale: تحفظ دلالة اللفظ اليوناني الممكنة على الألسنة أو اللغات، وتبقي الصلة بسياق الكلام بالألسنة في الرسالة.
- source_word: τῶν ἀνθρώπων
  choice: الْبَشَرِ
  rationale: يدل اللفظ هنا على البشر عمومًا في مقابل الملائكة، لا على الذكور وحدهم.
- source_word: καὶ τῶν ἀγγέλων
  choice: وَالْمَلَائِكَةِ
  rationale: المقابلة مع البشر والترقي البلاغي يرجحان الإشارة إلى الكائنات السماوية.
- source_word: ἀγάπην δὲ μὴ ἔχω
  choice: وَلَكِنْ لَيْسَ لِي مَحَبَّةٌ
  rationale: تنقل أداة الاستدراك ونفي امتلاك المحبة بعبارة عربية واضحة وطبيعية.
- source_word: γέγονα
  choice: فَقَدْ صِرْتُ
  rationale: تحفظ دلالة صيغة التمام اليونانية على التحول إلى حالة قائمة ونتيجتها الحاضرة.
- source_word: χαλκὸς ἠχῶν
  choice: نُحَاسًا يَرِنُّ
  rationale: يبقي صورة المعدن المصوّت دون افتراض آلة بعينها؛ و«النحاس» تعبير عربي مفهوم عن المعدن المقصود، مع إمكان اتساع الأصل للبرونز أو النحاس.
- source_word: κύμβαλον ἀλαλάζον
  choice: صَنْجًا يَصْخَبُ
  rationale: «الصنج» اسم الآلة، والفعل يصور صوتها العالي الصاخب من غير تلطيف للصورة السمعية.
theological_decisions:
- issue: معنى ألسنة البشر والملائكة
  choice: إبقاء المقابلة البلاغية بين ألسنة البشر والملائكة من غير حسم طبيعتها
  alternative: اعتبارها لغات سماوية فعلية، أو مبالغة بلاغية في أرفع كلام يمكن تصوره
  rationale: النص لا يلزم القارئ بأحد التفسيرين، ولذلك تحافظ الترجمة على الغموض المقصود والتوتر اللاهوتي.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. اختير «البشر» لبيان الشمول الطبيعي في مقابل الملائكة، واستُبقيت الصورة البلاغية المسموعة وقوة الشرط الافتراضي.
