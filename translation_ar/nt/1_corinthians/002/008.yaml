  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: ar
  text: التي لم يعرفها أحدٌ من حكّام هذا الدهر[a]؛ لأنهم لو عرفوها، لما صلبوا ربَّ المجد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُراد بعبارة «حكّام هذا الدهر» حكّامٌ من البشر، أو قوى روحية، أو إليهما معًا.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: التي
  rationale: اسم موصول مؤنث مفرد يعود إلى «الحكمة» المذكورة في السياق السابق، ويحفظ الترابط النحوي بوضوح.
- source_word: ἀρχόντων
  choice: حكّام
  rationale: ينقل معنى أصحاب السلطان والحكم، مع إبقاء المرجع محتمِلًا للسلطات البشرية أو القوى الروحية أو كليهما.
- source_word: τοῦ αἰῶνος τούτου
  choice: هذا الدهر
  rationale: «الدهر» يؤدي المعنى الزمني والنظام الحاضر في αἰών أدق من «العالم» في هذا السياق البولسي.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: يعرفها / عرفوها
  rationale: ترجمة مباشرة لفعل γινώσκω، وتكرار الجذر العربي يحافظ على التوازي المقصود بين الجملة الخبرية والشرط المخالف للواقع.
- source_word: τὸν κύριον τῆς δόξης
  choice: ربَّ المجد
  rationale: يحفظ التركيب الإضافي المهيب في اليونانية دون تحويله إلى مجرد صفة مثل «الرب المجيد».
- source_word: ἐσταύρωσαν
  choice: صلبوا
  rationale: المقابل العربي المباشر والمستقر للفعل، ويحفظ التحديد التاريخي لطريقة القتل.
theological_decisions:
- issue: هوية «حكّام هذا الدهر»
  choice: الإبقاء على التعبير المحايد «حكّام هذا الدهر»
  alternative: تعيينهم بوصفهم حكامًا سياسيين أو دينيين من البشر، أو قوى روحية، أو الاثنين معًا
  rationale: لا يحسم التعبير اليوناني وحده هوية الحكام، وقد يحتمل السلطات البشرية أو القوى الروحية أو دلالة تجمعهما؛ لذلك تُصان هذه الإمكانية في المتن وتُوضَّح في الحاشية.
- issue: دلالة γινώσκω في السياق
  choice: «يعرفها / عرفوها»
  alternative: «يدركها / أدركوها» أو «يفهمها / فهموها»
  rationale: «عرف» أقرب إلى اللفظ اليوناني ويحفظ مدى دلاليًا يمكن أن يشمل المعرفة والإدراك، بدل حصره صراحة في الفهم العقلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُخدم «الدهر» للمحافظة على البعد الزمني والنظام الحاضر، و«رب المجد» لصون قوة التركيب الإضافي. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
