  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: ar
  text: وأنا أيضًا، لما أتيت إليكم، أيها الإخوة[a]، لم آتِ بسموّ الكلام أو الحكمة، مُعلِنًا لكم شهادة الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُقصد بـ«الإخوة» جماعة المؤمنين عمومًا، بمن فيهم النساء في الكنيسة.
    reason: cultural_note
  - marker: b
    text: 'تقرأ بعض المخطوطات: «سرّ الله».'
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: وأنا أيضًا
  rationale: تحفظ الواو قوة الربط، ويُظهر الضمير المنفصل بقدر طبيعي توكيد المتكلم في اليونانية.
- source_word: ἐλθὼν … ἦλθον
  choice: لما أتيت … لم آتِ
  rationale: تنقل تركيب اسم الفاعل مع الفعل الرئيس في صياغة زمنية عربية طبيعية، مع إبقاء تكرار فعل المجيء.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحفظ صيغة النداء المذكرة في النص، مع توضيح شمولها المحتمل للمؤمنات في الحاشية.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: بسموّ الكلام أو الحكمة
  rationale: تعبر عن رفعة الأسلوب وبلاغته المبهرة من غير تضييق الدلالة على مصطلح خطابي فني.
- source_word: καταγγέλλων
  choice: بل كنت أعلن
  rationale: ينقل معنى الإعلان العلني المستمر في السياق، وتوضح «بل» تعلق العبارة بطريقة مجيء بولس في عربية سلسة دون جعلها نقيضًا مستقلًا للمحتوى.
- source_word: μαρτύριον
  choice: شهادة
  rationale: تتبع قراءة SBLGNT وتحفظ الثقل الدلالي للاسم، مع إثبات القراءة البديلة في الحاشية.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: الإضافة في «شهادة الله» تحفظ إمكان كون الشهادة من الله أو عنه، فلا تحسم علاقة المضاف إليه تفسيريًا.
theological_decisions:
- issue: الاختلاف النصي في μαρτύριον
  choice: شهادة الله
  alternative: سرّ الله
  rationale: متن SBLGNT يقرأ μαρτύριον («شهادة»)، أما μυστήριον («سرّ») فقراءة مخطوطية معروفة ذات أثر في الترجمة، ولذلك تُذكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تكرار «أتيت/آتِ» والنداء وصيغة الإضافة اللاهوتية الملتبسة، مع تجنب الألفاظ المذهبية أو التفسير الزائد.
