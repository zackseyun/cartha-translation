  rationale: اقتصر التعديل على استبدال «بل كنت أعلن» بـ«مُعلِنًا» لإزالة المقابلة غير الموجودة في الأصل والمحافظة على وظيفة اسم الفاعل اليوناني، من غير تغيير المعنى أو القراءة النصية أو الحواشي.
