id: 1CO.2.6
reference: 1 Corinthians 2:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: ar
  text: لكننا نتكلم بحكمة بين الناضجين[a]، غير أنها ليست حكمة هذا الدهر، ولا حكمة حكام هذا الدهر[b]، الذين يُبطَلون[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الكاملين»؛ والأرجح هنا أن المقصود هم الناضجون روحيًا.
    reason: lexical_alternative
  - marker: b
    text: قد يُقصد بـ«حكام هذا الدهر» سلطات بشرية، أو قوى روحية، أو كلاهما.
    reason: alternative_reading
  - marker: c
    text: أو «يزولون»، أو «يُلغَون»، أو «تُبطَل فاعليتهم».
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν
  choice: حكمة
  rationale: المقابل العربي المباشر والطبيعي، وقد تكرر في النص اليوناني للتوكيد، فحُفظ التكرار.
- source_word: δὲ
  choice: لكننا
  rationale: تفيد الأداة هنا الاستدراك على السياق السابق، و«لكن» تؤدي هذا المعنى بوضوح في العربية.
- source_word: λαλοῦμεν
  choice: نتكلم
  rationale: الفعل يعني أساسًا الكلام أو التحدث، وهو أدق من تخصيصه بمعنى «نعلن».
- source_word: ἐν τοῖς τελείοις
  choice: بين الناضجين
  rationale: يفيد التركيب في هذا السياق الكلام في وسط أشخاص بلغوا النضج؛ وتبقي الحاشية احتمال المعنى الحرفي «الكاملين».
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: ليست حكمة هذا الدهر
  rationale: «الدهر» يحفظ دلالة αἰών الزمنية والحاضرة من غير خلطه بلفظ «العالم» الذي يقابل عادةً κόσμος.
- source_word: ἀρχόντων
  choice: حكام
  rationale: لفظ واسع يدل على أصحاب الحكم أو السلطان، من غير حسم ما إذا كان المقصود بشرًا أم قوى روحية أم كليهما.
- source_word: τῶν καταργουμένων
  choice: الذين يُبطَلون
  rationale: يحفظ معنى جعلهم بلا فاعلية أو إزالتهم، كما يحفظ صيغة المضارع المبني للمجهول الدالة على عملية جارية.
theological_decisions:
- issue: هوية «حكام هذا الدهر»
  choice: الإبقاء على اللفظ عامًا من غير تحديد هويتهم
  alternative: السلطات البشرية، أو القوى الروحية، أو كلاهما
  rationale: العبارة اليونانية لا تحسم المرجع، ولذلك ينبغي ألا يحسمه متن الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ تكرار «حكمة» وبقيت هوية الحكام ودلالة إبطالهم مفتوحتين كما في الأصل.
