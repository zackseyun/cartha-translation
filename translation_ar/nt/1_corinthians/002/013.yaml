  verdict: approve
  source_fidelity: 'النص العربي ينقل البنية والمعنى الأساسيين بدقة: «هذه الأمور» لـἃ، و«نتكلم بها» لـλαλοῦμεν، والمقابلة بين كلمات تتعلم من حكمة بشرية وكلمات يعلمها الروح. كما يعالج التركيب المختلف عليه πνευματικοῖς πνευματικὰ συγκρίνοντες بقراءة محايدة منسجمة مع سياق «الكلمات»، من دون إلغاء القراءة المذكرة الممكنة.'
  naturalness: الصياغة فصيحة معاصرة وواضحة. «نتكلّم بها» و«بكلمات تعلّمها حكمة بشرية» و«شارحين الأمور الروحية بكلمات روحية» تراكيب سليمة وطبيعية في العربية. موضع علامة الحاشية مناسب، إذ يلي العبارة ذاتها التي يحيط بها الغموض التركيبي.
  terminology: استعمال «الروح» يحافظ على لفظ النص ولا يضيف «القدس» غير المذكورة في الآية، مع أن السياق يعيّن المرجع على نحو راجح بروح الله. و«الأمور الروحية» و«كلمات روحية» يحافظان على التوازي اللفظي في πνευματικά/πνευματικοῖς.
