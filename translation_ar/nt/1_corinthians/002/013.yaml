source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: ar
  text: وهذه الأمور أيضًا نتكلّم بها، لا بكلمات تعلّمها حكمة بشرية، بل بكلمات يعلّمها الروح، شارحين الأمور الروحية بكلمات روحية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شارحين الأمور الروحية لأناس روحيين». تحتمل العبارة اليونانية أيضًا معنى «مقابلين الأمور الروحية بالأمور الروحية».'
    reason: تحفظ الحاشية غموض πνευματικοῖς، الذي قد يكون مذكرًا أو محايدًا، واتساع معنى συγκρίνοντες.
lexical_decisions:
- source_word: ἃ
  choice: هذه الأمور
  rationale: تحيل طبيعيًا إلى ما سبق من عطايا الله وحقائقه المعلنة، مع إظهار المفعول به في العربية بوضوح.
- source_word: λαλοῦμεν
  choice: نتكلّم بها
  rationale: يحفظ دلالة الكلام والتبليغ الشفهي، ويصل الضمير بما أُشير إليه في مطلع الجملة.
- source_word: ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: بكلمات تعلّمها حكمة بشرية
  rationale: الباء تؤدي معنى الوسيلة في ἐν، والصياغة تبقي الحكمة البشرية مصدر هذا التعليم من غير إثقال.
- source_word: ἐν διδακτοῖς πνεύματος
  choice: بكلمات يعلّمها الروح
  rationale: أُظهر الاسم المحذوف المفهوم من λόγοις لتستقيم العربية، وفُهم πνεύματος في السياق على أنه روح الله.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: شارحين الأمور الروحية بكلمات روحية
  rationale: تلائم هذه الصياغة الحديث المباشر عن الكلمات التي يعلّمها الروح، مع إبقاء احتمال قراءة πνευματικοῖς على أنه مذكر دال على أناس روحيين في الحاشية.
theological_decisions:
- issue: مرجع πνεύματος
  choice: الروح، أي روح الله
  alternative: روح أو مصدر روحي على وجه العموم
  rationale: السياق القريب في 1 كورنثوس 2 يذكر روح الله صراحة ويقابله بما هو بشري، لذلك المرجع الشخصي هو الأرجح، من غير إضافة وصف «القدس» غير الموجود لفظًا في هذه الجملة.
- issue: إعراب πνευματικοῖς ومعنى συγκρίνοντες
  choice: شرح الأمور الروحية بكلمات روحية
  alternative: شرح الأمور الروحية لأناس روحيين؛ أو مقابلة الروحيات بالروحيات
  rationale: صيغة πνευματικοῖς تحتمل المحايد الدال على كلمات أو وسائل روحية، كما تحتمل المذكر الدال على أشخاص روحيين، والفعل نفسه واسع الدلالة؛ لذلك اختير ما ينسجم مع سياق «الكلمات» وأُثبت البديل الحقيقي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «كلمات» لاتصالها المباشر بموضوع القول، و«حكمة بشرية» بدل تعبير أثقل. وُضعت علامة الحاشية عند العبارة الملتبسة نفسها.
