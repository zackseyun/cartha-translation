review_pass:
  verdict: revise
  source_fidelity: 'المتن ينقل بدقة البنية الأساسية للنص اليوناني: المقابلة بـ«أمّا»، وشمول «كل شيء»، وتوكيد «وهو نفسه»، والنفي المطلق في «لا يفحصه أحد». كما يحافظ على تكرار ἀνακρίνω في الموضعين. وصياغة المبني للمعلوم مع «أحد» عربية سليمة وتؤدي معنى المبني للمجهول اليوناني («لا يُفحَص من أحد») على نحو طبيعي.'
  naturalness: «أمّا الإنسان الروحي فيفحص كل شيء، وهو نفسه لا يفحصه أحد» فصيحة واضحة ومناسبة للسجل الكتابي العربي المعاصر. ولا يلزم تحويل الجملة الثانية إلى مبني للمجهول، إذ ستكون الصياغة أقل سلاسة في العربية.
  terminology: «الإنسان الروحي» مناسب للصفة الاسمية المذكرة ذات الدلالة العامة، و«يفحص» اختيار مقبول لـἀνακρίνω في سياق التمحيص والتقويم. لكن «يحكم في» في الحاشية ليس بديلاً معجميًا موازيًا صالحًا للفعل في كلا الموضعين بهذه الصياغة، ولا سيما في الجملة الثانية؛ لذلك تحتاج الحاشية إلى تصحيح محدود.
  issues:
  - severity: low
    issue: البديل «يحكم في» في الحاشية غير متوازٍ نحويًا ودلاليًا مع الفعل في الموضعين.
    rationale: الفعل اليوناني يتكرر بصيغة متعدية ثم مبنية للمجهول. «يحكم في» يحتاج متعلقًا مختلفًا ولا يعطي مقابلاً طبيعيًا للجملة «لا يفحصه أحد». يُستعاض عنه بـ«يمتحن» أو «يقيّم» أو «يميّز».
