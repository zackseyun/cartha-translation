lexical_decisions:
- source_word: πνευματικὸς
  choice: الإِنْسَانُ الرُّوحِيُّ
  rationale: الصفة اليونانية مفردة مذكرة ومستعملة استعمال الاسم، وتشير بصورة عامة إلى شخص يتصف بالروح؛ وإضافة «الإنسان» تجعل المرجع الشخصي واضحًا من غير قصره على رجل بعينه.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: يَفْحَصُ / لَا يَفْحَصُهُ
  rationale: «يفحص» ينقل معنى النظر الدقيق والتقويم المتبصر، ويحافظ على تكرار الفعل نفسه في الجملتين وصيغة المبني للمجهول دلاليًا في الثانية، بصياغة عربية طبيعية.
- source_word: τὰ πάντα
  choice: كُلَّ شَيْءٍ
  rationale: صياغة عربية واضحة تحافظ على شمول العبارة اليونانية من غير إضافة قيد تفسيري.
- source_word: αὐτὸς
  choice: وَهُوَ نَفْسُهُ
  rationale: تحافظ العبارة على توكيد الضمير في اليونانية وعلى المقابلة بين فحصه كل شيء وعدم فحص أحد له.
- source_word: ὑπ’ οὐδενὸς
  choice: لَا يَفْحَصُهُ أَحَدٌ
  rationale: تنقل النفي المطلق «من لا أحد» بأسلوب عربي طبيعي، مع إبقاء الشخص الروحي مفعولًا للفحص.
theological_decisions:
- issue: نطاق قول بولس عن الإنسان الروحي
  choice: الإبقاء على الإطلاق في «كل شيء» و«لا يفحصه أحد»
  alternative: تقييد العبارة صراحة بالأمور الروحية في المتن
  rationale: نص الآية يورد القول بلا قيد، بينما يوفّر السياق المباشر إطاره التفسيري؛ وإضافة القيد في المتن تحسم توترًا لم يحسمه اللفظ اليوناني نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «يفحص» للمحافظة على التكرار المعجمي وعلى معنى التمحيص، ووُضعت علامتا الحاشية بعد العبارتين اللتين تشرحانهما مباشرة.
