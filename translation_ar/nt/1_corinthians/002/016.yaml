base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: ar
  text: فَمَنْ عَرَفَ فِكْرَ الرَّبِّ حَتَّى يُعَلِّمَهُ؟[a] أَمَّا نَحْنُ فَلَنَا فِكْرُ الْمَسِيحِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يشير بولس إلى إشعياء 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: فَمَنْ
  rationale: تنقل «فـ» الصلة التفسيرية بما سبق، وتأتي «مَن» بالسؤال البلاغي مباشرة وبأسلوب عربي طبيعي.
- source_word: ἔγνω
  choice: عَرَفَ
  rationale: الماضي العربي يلائم صيغة الفعل اليوناني ويؤدي معنى المعرفة المكتسبة التي تؤهل صاحبها لتعليم الرب، وهو ما ينفيه السؤال البلاغي.
- source_word: νοῦν κυρίου
  choice: فِكْرَ الرَّبِّ
  rationale: «فكر» تعبير عربي واضح يشمل الإدراك والقصد، و«الرب» يحفظ صدى الاقتباس الكتابي.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: حَتَّى يُعَلِّمَهُ
  rationale: تؤدي «حتى» معنى التأهل أو النتيجة في السؤال البلاغي، و«يعلّمه» هو المعنى الأنسب للفعل في سياق الاقتباس.
- source_word: ἡμεῖς δὲ
  choice: أَمَّا نَحْنُ فَـ
  rationale: يبين هذا التركيب المقابلة القوية بين عجز الإنسان المذكور في السؤال وما يقرره بولس عن جماعة المؤمنين.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: فَلَنَا فِكْرُ الْمَسِيحِ
  rationale: صيغة الملكية العربية طبيعية ومباشرة، و«المسيح» تنقل Χριστός بوصفه لقبًا معهودًا دون الحاجة إلى الفصل العربي بين Messiah وChrist.
theological_decisions:
- issue: دلالة عبارة «فكر المسيح»
  choice: 'الإبقاء على العبارة الموجزة: «لنا فكر المسيح»'
  alternative: لدينا طريقة تفكير المسيح أو نعرف قصد المسيح
  rationale: النص اليوناني لا يحدد هل المقصود معرفة قصد المسيح أم المشاركة في نظرته وتوجهه؛ لذلك تحافظ الصياغة على السعة والتوتر اللاهوتي في الأصل دون تفسير زائد.
- issue: العلاقة بين «الرب» في اقتباس إشعياء و«المسيح» في خاتمة الآية
  choice: 'الإبقاء على الاسمين كما يوردهما النص: «الرب» ثم «المسيح»'
  alternative: توحيدهما تفسيرًا أو إضافة بيان يحدد علاقتهما
  rationale: يحفظ ذلك انتقال بولس المقصود من الاقتباس إلى تصريحه عن فكر المسيح من غير أن يفرض تحديدًا لاهوتيًا غير مصرح به في ألفاظ الآية نفسها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «فكر» بدل تعبيرات أكثر تجريدًا، وحُفظ السؤال البلاغي والمقابلة في الأصل دون توسع تفسيري.
