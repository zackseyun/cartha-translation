id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: ar
  text: فمَن مِن الناس يعرف ما في الإنسان إلا روح الإنسان الذي فيه؟ وكذلك لا أحد قد عرف ما في الله إلا روح الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: الناس / الإنسان
  rationale: اللفظ هنا عام يشمل البشر، وليس خاصًّا بالذكور؛ وهذه الصياغة طبيعية في العربية وتحفظ التوازي.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: ما في الإنسان
  rationale: التعبير اليوناني واسع، ويشير إلى شؤون الإنسان الباطنة وما يخصه، لا إلى أفكاره وحدها. «ما في الإنسان» واضح ويحافظ على المقابلة مع «ما في الله».
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: روح الإنسان الذي فيه
  rationale: صياغة قريبة من ترتيب الأصل، تحفظ الإضافة وعبارة الوجود في الإنسان من دون توسيع تفسيري.
- source_word: οὕτως καὶ
  choice: وكذلك
  rationale: تؤدي معنى المماثلة الوثيقة بين الشطرين بإيجاز وفصاحة.
- source_word: ἔγνωκεν
  choice: قد عرف
  rationale: تحفظ دلالة صيغة التام في الأصل، مع بقاء نتيجتها الحاضرة مفهومة من السياق.
- source_word: τὰ τοῦ θεοῦ
  choice: ما في الله
  rationale: يحافظ على سعة العبارة وعلى التوازي مع «ما في الإنسان»، من غير تضييقها إلى الأفكار فقط.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: روح الله
  rationale: ترجمة مباشرة تشير في السياق إلى روح الله نفسه، ولا تحتاج العربية إلى تمييز طباعي بحرف كبير.
theological_decisions:
- issue: هل تشير عبارة πνεῦμα τοῦ θεοῦ إلى روح الله الشخصي أم إلى «روح» بمعنى غير شخصي؟
  choice: روح الله
  alternative: روحٌ من الله
  rationale: السياق المباشر يتحدث عن روح الله الذي يفحص أعماق الله ويعلنها؛ والإضافة في الأصل هي «روح الله»، من غير إدخال تفصيل عقائدي زائد.
- issue: مدى τὰ τοῦ ἀνθρώπου / τὰ τοῦ θεοῦ
  choice: ما في الإنسان / ما في الله
  alternative: أفكار الإنسان / أفكار الله
  rationale: اختيار العبارة الأوسع يصون قصد النص ولا يحصر المعرفة في الأفكار وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على السؤال البلاغي، وعلى التوازي بين الإنسان والله، وعلى الفرق الزمني الظاهر بين οἶδεν وἔγνωκεν.
