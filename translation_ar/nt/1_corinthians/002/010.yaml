  source_fidelity: 'الترجمة أمينة للنص اليوناني: نقلت γάρ بـ«فقد»، وἀπεκάλυψεν بصيغة ماضية مناسبة، وأظهرت المفعول المحذوف «هذه الأمور» استنادًا إلى السياق، وحافظت على وساطة الروح في διὰ τοῦ πνεύματος. كما أن «يفحص كل شيء، حتى أعماق الله» ينقل ἐραυνᾷ πάντα καὶ τὰ βάθη τοῦ θεοῦ مع المحافظة على التصعيد الذي تفيده καί.'
  naturalness: 'الصياغة فصيحة معاصرة وسلسة: «فقد كشف الله لنا هذه الأمور بالروح» و«لأن الروح يفحص كل شيء» واضحتان ومناسبتان لسجل النص. ولا تستلزم «يفحص» افتراض نقص معرفة سابق في هذا السياق، بل تؤدي معنى الاستقصاء النافذ.'
  terminology: استعمال «الروح» في الموضعين يحافظ على اتساق اللفظ اليوناني وعلى الإحالة السياقية إلى روح الله، من غير إدخال إضافة تفسيرية مثل «القدس» في المتن. و«أعماق الله» ترجمة دقيقة وطبيعية لـτὰ βάθη τοῦ θεοῦ. الحاشيتان تعالجان بأمانة المفعول الضمني والبديل المعجمي.
