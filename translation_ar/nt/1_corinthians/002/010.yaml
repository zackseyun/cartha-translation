id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: ar
  text: فقد كشف الله لنا هذه الأمور[a] بالروح، لأن الروح يفحص كل شيء، حتى أعماق الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كشفها لنا»؛ فالمفعول به غير مذكور صراحة في اليونانية، ويُفهم من السياق السابق.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «أمور الله العميقة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: كشف
  rationale: ينقل معنى الإظهار والإعلان بعد الخفاء، وصيغة الماضي العربية تلائم الفعل اليوناني الماضي من غير أن تنفي استمرار أثر الكشف.
- source_word: ἡμῖν
  choice: لنا
  rationale: تؤدي وظيفة المفعول غير المباشر، فتبيّن أن المتكلمين هم متلقّو الكشف.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: هذه الأمور
  rationale: المفعول به محذوف في اليونانية ويُفهم من السياق السابق؛ وإظهاره في العربية يوضح الصلة بالسياق من غير توسع تفسيري.
- source_word: διὰ τοῦ πνεύματος
  choice: بالروح
  rationale: تعبّر الباء عن الوسيلة أو الواسطة التي تدل عليها διά مع المضاف إليه، بصياغة عربية موجزة وطبيعية.
- source_word: πνεῦμα
  choice: الروح
  rationale: السياق يشير إلى روح الله الذي يكشف ويدرك أعماق الله، مع إبقاء اللفظ نفسه الذي في الأصل من غير إضافة «القدس» إلى نص الآية.
- source_word: ἐραυνᾷ
  choice: يفحص
  rationale: يحفظ معنى التقصي والنفاذ إلى حقيقة الشيء، ولا يوحي بالضرورة بجهل سابق كما قد يوحي «يبحث» في العربية المعاصرة.
- source_word: πάντα
  choice: كل شيء
  rationale: ترجمة عربية طبيعية تحافظ على شمول اللفظ اليوناني.
- source_word: καὶ
  choice: حتى
  rationale: تؤدي هنا وظيفة تصعيدية، فتبرز «أعماق الله» بوصفها ذروة نطاق الفحص.
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: أعماق الله
  rationale: تحافظ على استعارة العمق وعلى الإضافة إلى الله من غير تفسير المقصود تفسيرًا زائدًا.
theological_decisions:
- issue: هل يشير πνεῦμα إلى الروح القدس أم إلى روح بشري؟
  choice: الروح الإلهي في الموضعين
  alternative: الروح البشري بمعنى عام
  rationale: ينسب السياق الكشف إلى الروح، ثم يصف معرفته بأنها تمتد حتى إلى أعماق الله؛ وهذا يرجح بوضوح الإشارة إلى روح الله، مع إبقاء نص الآية على لفظ «الروح» كما في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ الإيجاز والاستعارة في الأصل، ووُضع [a] بعد العبارة التي تتعلق بها الحاشية مباشرة، مع إظهار علامتي الحاشيتين في المتن.
