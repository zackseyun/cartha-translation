source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: ar
  text: أَمَّا الإِنْسَانُ الطَّبِيعِيُّ[a] فَلَا يَقْبَلُ أُمُورَ رُوحِ اللهِ، لِأَنَّهَا عِنْدَهُ حَمَاقَةٌ، وَلَا يَقْدِرُ أَنْ يَعْرِفَهَا، لِأَنَّهَا تُمَيَّزُ رُوحِيًّا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإِنْسَانُ غَيْرُ الرُّوحِيِّ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تُفْحَصُ» أو «يُحْكَمُ فِيهَا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: الطبيعي
  rationale: يحافظ على التقابل السياقي مع ما هو روحي، ويصف الإنسان المحصور في نطاق الحياة البشرية الطبيعية دون أن يضيف إلى اللفظ تفسيرًا عقائديًا صريحًا.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: لفظ عربي طبيعي ذو دلالة عامة هنا، مع محافظته على صيغة المفرد المذكر في اليونانية.
- source_word: δέχεται
  choice: يقبل
  rationale: يفيد تلقي هذه الأمور والإقرار بها، لا مجرد وصولها إلى السامع.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: أمور روح الله
  rationale: صياغة موجزة تحافظ على سعة التعبير اليوناني لما يخص روح الله أو يصدر عنه.
- source_word: μωρία
  choice: حماقة
  rationale: تحافظ على المفردة التي تتكرر في رسالة كورنثوس الأولى ضمن المقابلة بين حكمة الله وحكم البشر.
- source_word: γνῶναι
  choice: أن يعرفها
  rationale: ينقل معنى المعرفة والإدراك في السياق من غير تضييقه على الفهم العقلي وحده.
- source_word: πνευματικῶς
  choice: روحيًّا
  rationale: ينقل الظرف اليوناني مباشرة، مع إبقاء احتمال دلالته على الكيفية أو المجال الروحي.
- source_word: ἀνακρίνεται
  choice: تُميَّز
  rationale: يعبر عن التمييز والفحص المؤدي إلى الحكم الصائب، مع الإشارة في الحاشية إلى البدائل المعجمية الأخرى.
theological_decisions:
- issue: دلالة Ψυχικὸς ἄνθρωπος في مقابل التمييز الروحي
  choice: الإنسان الطبيعي
  alternative: الإنسان غير الروحي
  rationale: يحافظ الاختيار على التوتر بين الحالة البشرية الطبيعية والإدراك الروحي دون أن يصرح بأن الشخص «بلا الروح»، وهي صياغة أصرح من النص اليوناني.
- issue: كيفية فهم πνευματικῶς ἀνακρίνεται
  choice: تُميَّز روحيًّا
  alternative: تُفحَص روحيًّا أو يُحكَم فيها روحيًّا
  rationale: يبقي النص كيفية التمييز الروحي عامة، فلا يحسم هل المقصود أداة الروح أم المجال أو الصفة الروحية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعمل «الإنسان» للدلالة العامة، وحوفظ على تكرار الضمائر المؤنثة العائدة إلى «أمور» وفق الاستعمال العربي، مع إبقاء الغموض الدلالي في عبارتي «الطبيعي» و«روحيًّا».
