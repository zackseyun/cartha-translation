source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: ar
  text: 'بل كما هو مكتوب: «ما لم تره عين، ولم تسمعه أذن، ولم يخطر على قلب إنسان[a]—ما أعدَّه الله للذين يحبونه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ولم يصعد على قلب إنسان»؛ أي لم يَرِد على قلب بشر أو لم يخطر لأحد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الانتقال الاستدراكي المقابل لما سبق، وهي موجزة وطبيعية في العربية.
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: تحفظ صيغة الاستشهاد الكتابي ودلالة بقاء المكتوب قائمًا.
- source_word: Ἃ ... ὅσα
  choice: ما ... ما
  rationale: تحفظ البنية الترابطية الاستئنافية في اليونانية من غير تكلف عربي.
- source_word: ὀφθαλμὸς / οὖς
  choice: عين / أذن
  rationale: يحافظ المفردان على التوازي الشعري والاستعمال العام في الأصل.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: لم يخطر على قلب إنسان
  rationale: تعبير عربي طبيعي ينقل صورة صعود الأمر إلى القلب بمعنى وروده في الفكر، مع إبقاء لفظ «القلب» وعدم استبداله بالعقل.
- source_word: ἡτοίμασεν
  choice: أعدَّه
  rationale: ينقل الفعل الماضي الدال على الإعداد المنجز، والسياق يبيّن استمرار أثره.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: للذين يحبونه
  rationale: ينقل وصفًا مستمرًا بصورة عربية مألوفة، ويحفظ عائد الضمير إلى الله.
theological_decisions:
- issue: دلالة ἀνθρώπου العامة
  choice: قلب إنسان
  alternative: قلب الإنسان / قلب بشر
  rationale: «إنسان» مفرد نكرة يؤدي المعنى التمثيلي العام للجنس البشري بوضوح، من غير حصره في الذكور أو تحميل النص تمييزًا مذهبيًا.
- issue: العلاقة بين عناصر الاقتباس وما أعدّه الله
  choice: الإبقاء على الشرطة قبل «ما أعدَّه الله»
  alternative: وصل العبارة بلا شرطة
  rationale: تحفظ الاستئناف التفسيري في ὅσα وتُبقي احتمال كونه استئنافًا جامعًا لما سبق من غير فرض تركيب تفسيري واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إيقاع متوازٍ في «عين… أذن… قلب»، والحفاظ على الغموض التركيبي الحقيقي في العبارة الختامية.
