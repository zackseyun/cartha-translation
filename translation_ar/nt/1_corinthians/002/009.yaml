  verdict: revise
  source_fidelity: 'النص أمين عمومًا لليونانية: «بل كما هو مكتوب» يحفظ الاستدراك وصيغة الاستشهاد، و«ما... ما» يحافظ على البنية الاستئنافية، و«لم يخطر على قلب إنسان» نقل عربي سليم للعبارة الاصطلاحية اليونانية مع إبقاء «القلب». كما أن «أعدَّه الله للذين يحبونه» مطابق للمعنى والزمن المنجَز في السياق.'
  naturalness: 'يلزم تعديل محدود في الشطر الثاني من التوازي: «لم تسمع به أذن» تميل في العربية إلى معنى “لم تسمع عنه/به خبرًا”، في حين أن اليونانية تقول ببساطة إن الأذن لم تسمعه. «لم تسمعه أذن» أوضح وأشد موازاةً لـ«لم تره عين».'
  terminology: «قلب إنسان» فصيحة جامعة ومناسبة لـἀνθρώπου، و«أعدَّه» و«الذين يحبونه» دقيقتان وطبيعيتان. لا تقتضي الآية مصطلحًا لاهوتيًا إضافيًا أو تفسيرًا عقائديًا.
