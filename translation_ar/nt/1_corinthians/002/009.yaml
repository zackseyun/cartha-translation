  to: 'بل كما هو مكتوب: «ما لم تره عين، ولم تسمعه أذن، ولم يخطر على قلب إنسان[a]—ما أعدَّه الله للذين يحبونه».'
  rationale: التعديل الوحيد هو «ولم تسمعه أذن» بدل «ولم تسمع به أذن»، لتفادي الإيحاء العربي الإضافي بـ«سمع عنه» ولتمثيل الفعل اليوناني بلا حرف جر، مع الإبقاء على جميع اختيارات النص ومعناه وغموضه التركيبي.
