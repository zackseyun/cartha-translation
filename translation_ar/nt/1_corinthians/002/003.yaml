lexical_decisions:
- source_word: κἀγώ
  choice: وكنتُ
  rationale: تُبقي الواوُ الصلةَ بما سبق، ويُظهر ضمير المتكلم المتصل مرجع بولس طبيعيًّا من غير إضافة توكيد غير لازم.
- source_word: ἐν ἀσθενείᾳ
  choice: في ضعفٍ
  rationale: «ضعف» هو المقابل العربي الواضح الواسع الدلالة، ويحفظ احتمال الضعف الجسدي أو محدودية الحال من غير تخصيص.
- source_word: ἐν φόβῳ
  choice: وخوفٍ
  rationale: ترجمة مباشرة تحفظ وصف بولس لحالته ولا تُلطّف الخوف إلى مجرد مهابة أو حذر.
- source_word: ἐν τρόμῳ πολλῷ
  choice: وارتجافٍ شديد
  rationale: «ارتجاف» ينقل معنى τρόμος بوضوح، و«شديد» يؤدي قوة πολλῷ بتعبير عربي طبيعي.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: كنتُ عندكم
  rationale: تعبير عربي طبيعي يفيد وجود بولس بين المخاطَبين وحالته في حضرتهم، مع إبقاء احتمال الدلالة على المجيء في الحاشية.
theological_decisions:
- issue: طبيعة الخوف المذكور
  choice: خوف
  alternative: مهابة أو خشية تعبّدية
  rationale: النص اليوناني لا يحدد موضوع الخوف أو طبيعته، لذلك تُحفظ دلالته المفتوحة دون تفسير مذهبي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «عندكم» بدل «معكم» لتصوير الحضور بينهم بصورة طبيعية، وحُفظ التوازي بين الضعف والخوف والارتجاف.
