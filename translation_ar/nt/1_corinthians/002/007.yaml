  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: ar
  text: بل نتكلّم بحكمة الله في سرّ[a]، الحكمة المخفيّة التي سبق أن عيّنها الله[b] قبل الدهور[c] لمجدنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في أمر خفيّ». يستعمل بولس لفظ «السرّ» كثيرًا للدلالة على قصد الله الذي كان مخفيًا ثم أُعلن.
    reason: lexical_alternative
  - marker: b
    text: أو «قرّرها الله مسبقًا».
    reason: lexical_alternative
  - marker: c
    text: أو «قبل كل الدهور».
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: نتكلّم
  rationale: ينقل المعنى المباشر للفعل، ويحافظ على صيغة المتكلم الجمع وعلى المقابلة التي تبدأ بها الجملة.
- source_word: θεοῦ σοφίαν
  choice: بحكمة الله
  rationale: صياغة عربية طبيعية تحافظ على إضافة الحكمة إلى الله دون زيادة تفسيرية.
- source_word: ἐν μυστηρίῳ
  choice: في سرّ
  rationale: يحافظ على مصطلح «السر» البولسي، الذي يدل غالبًا على قصد إلهي كان مخفيًا ثم أُعلن، بدل اختزاله في معنى الكتمان وحده.
- source_word: τὴν ἀποκεκρυμμένην
  choice: الحكمة المخفيّة
  rationale: اسم المفعول المؤنث يعود إلى «الحكمة»، وتكرار الاسم في العربية يوضح هذا العود ويحافظ على التركيب الوصفي.
- source_word: προώρισεν
  choice: سبق الله فعيّنها
  rationale: ينقل معنى التعيين السابق بعبارة عربية راسخة وواضحة، من غير حصر الفعل في منظومة لاهوتية بعينها.
- source_word: πρὸ τῶν αἰώνων
  choice: قبل الدهور
  rationale: ترجمة قريبة من الصورة الزمنية الكونية في الأصل، وأقل تفسيرًا من «قبل خلق العالم».
- source_word: εἰς δόξαν ἡμῶν
  choice: لمجدنا
  rationale: يحافظ على دلالة الغاية وعلى الثقل اللاهوتي لكلمة «المجد» دون تحويلها صراحة إلى «تمجيدنا».
theological_decisions:
- issue: الدلالة العقائدية للفعل προώρισεν
  choice: سبق الله فعيّنها
  alternative: قرّرها الله مسبقًا
  rationale: الاختيار يثبت أن التعيين تمّ سلفًا، كما يقتضي الفعل اليوناني، لكنه لا يضيف تحديدًا مذهبيًا لطبيعة هذا التعيين أو نطاقه.
- issue: مرجع التعيين السابق
  choice: الحكمة المخفيّة التي سبق الله فعيّنها
  alternative: السر الذي سبق الله فعيّنه
  rationale: التطابق النحوي في اليونانية يربط اسم المفعول والضمير الموصول بـ«الحكمة»، لذلك أُبقيت الحكمة هي المرجع المباشر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «السر» بوصفه المصطلح البولسي المألوف، و«قبل الدهور» للمحافظة على الصورة الأصلية، مع إبقاء التعيين السابق والمجد بصياغة لا تحسم التوتر اللاهوتي خارج ما تقوله الآية.
