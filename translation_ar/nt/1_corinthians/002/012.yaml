revisions:
- from: أَمَّا نَحْنُ فَلَمْ نَأْخُذْ رُوحَ الْعَالَمِ، بَلِ الرُّوحَ الَّذِي مِنَ اللهِ، لِكَيْ نَعْرِفَ مَا وَهَبَهُ اللهُ لَنَا بِالنِّعْمَةِ.[a]
  to: أَمَّا نَحْنُ، فَلَمْ نَتَلَقَّ رُوحَ الْعَالَمِ، بَلِ الرُّوحَ الَّذِي مِنَ اللهِ، لِكَيْ نَعْرِفَ مَا وَهَبَهُ اللهُ لَنَا بِنِعْمَتِهِ.[a]
  rationale: استُبدل «نأخذ» بـ«نتلقّى» لمزيد من الدقة والطبيعية في ترجمة فعل التلقّي، وعُدّلت «بالنعمة» إلى «بنعمته» لإبراز أن العطاء صادر عن نعمة الله. ولم يُضف تفسير طائفي أو لقب غير وارد في النص إلى «الروح».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:17Z'
