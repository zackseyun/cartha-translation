  terminology: «روح العالم» و«الروح الذي من الله» يحفظان المقابلة اليونانية من غير إضافة لقب «القدس» غير المذكور. واستعمال «ما» يحافظ على اتساع المحايد الجمع τὰ، و«وهبه» مناسب لـχαρισθέντα.
