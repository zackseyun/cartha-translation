  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: ar
  text: أَمَّا نَحْنُ، فَلَمْ نَتَلَقَّ رُوحَ الْعَالَمِ، بَلِ الرُّوحَ الَّذِي مِنَ اللهِ، لِكَيْ نَعْرِفَ مَا وَهَبَهُ اللهُ لَنَا بِنِعْمَتِهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما أنعم الله به علينا»، أو: «ما أعطاه الله لنا مجانًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: رُوح / الرُّوح
  rationale: حُفظ التباين بين «روح العالم» بوصفه تأثير العالم واتجاهه المحرّك، و«الروح الذي من الله» الذي يدل في السياق على روح الله؛ والتعريف في الثانية ينسجم مع الصياغة اليونانية والسياق.
- source_word: κόσμου
  choice: العالم
  rationale: هو المقابل العربي الواضح والمألوف، ويشير هنا إلى النظام البشري الحاضر في تعارضه مع الله.
- source_word: ἐλάβομεν
  choice: أخذنا
  rationale: الفعل اليوناني ماضٍ بسيط، و«أخذنا» طبيعي في العربية مع بقاء معنى التلقّي من الله واضحًا من السياق.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: الذي من الله
  rationale: يحفظ دلالة المصدر في ἐκ وصلة الموصول التي يقتضيها التركيب العربي من غير توسّع تفسيري.
- source_word: ἵνα εἰδῶμεν
  choice: لكي نعرف
  rationale: يحفظ غرض العبارة صريحًا، وينقل المعنى الإدراكي للفعل من دون تحويله إلى شرح زائد.
- source_word: χαρισθέντα
  choice: وهبه ... بالنعمة
  rationale: «وهب» ينقل معنى العطاء المجاني، وإضافة «بالنعمة» تُظهر الصلة الدلالية بالفعل χαρίζομαι ولا تكتفي بالمعنى العام «أعطى».
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: ما وهبه الله لنا بالنعمة
  rationale: «ما» تحافظ على شمول الجمع المحايد، فلا تحصر المقصود في مواهب روحية بعينها.
theological_decisions:
- issue: هل يشير πνεῦμα τὸ ἐκ τοῦ θεοῦ تحديدًا إلى الروح القدس؟
  choice: «الرُّوحَ الَّذِي مِنَ اللهِ» مع تعريف «الروح»
  alternative: «روحًا من الله» أو «الروح الآتي من الله»
  rationale: السياق يرجّح الإشارة إلى روح الله المعطى للمؤمنين، لكن النص لا يورد وصف «القدس» هنا؛ لذلك حُفظت عبارته من غير إضافة هذا اللقب.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «أمّا نحن» لإبراز المقابلة في ἡμεῖς δέ، وحُفظت جملة الغرض «لكي نعرف». وُضعت علامة الحاشية في المتن كما يلزم.
