  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: ar
  text: لِكَيْ لَا يَكُونَ إِيمَانُكُمْ قَائِمًا عَلَى حِكْمَةِ الْبَشَرِ، بَلْ عَلَى قُوَّةِ اللهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: لِكَيْ
  rationale: تُدخِل جملة غرض وتحفظ القوة الغائية للأداة اليونانية بصياغة عربية طبيعية.
- source_word: ἡ πίστις ὑμῶν
  choice: إِيمَانُكُمْ
  rationale: يدل السياق على استجابة الكورنثيين المؤمنة، ولذلك فـ«إيمانكم» أدق من «أمانتكم» هنا.
- source_word: μὴ ᾖ ἐν
  choice: لَا يَكُونَ ... قَائِمًا عَلَى
  rationale: تنقل صيغة المضارع الاحتمالية التابعة لجملة الغرض، وتوضح بالعربية الطبيعية معنى اعتماد الإيمان أو استناده دون تغيير المقابلة.
- source_word: σοφίᾳ ἀνθρώπων
  choice: حِكْمَةِ الْبَشَرِ
  rationale: «البشر» تعبر بوضوح عن ἀνθρώπων بمعناه العام الشامل لجميع الناس، وتحافظ على الإضافة والمقابلة مع قوة الله.
- source_word: δυνάμει θεοῦ
  choice: قُوَّةِ اللهِ
  rationale: تحفظ الإضافة المباشرة والتوازي البلاغي مع «حكمة البشر».
theological_decisions:
- issue: طبيعة العلاقة التي تفيدها ἐν في طرفي المقابلة
  choice: قائمًا على ... بل على
  alternative: في ... بل في
  rationale: المقصود أن الإيمان لا يستند إلى الحكمة البشرية بل إلى قوة الله. تعبير «قائمًا على» عربي واضح ويحفظ المقابلة من غير أن يحصرها في معنى مكاني حرفي.
- issue: الدلالة العامة لكلمة ἀνθρώπων
  choice: البشر
  alternative: الناس / الرجال
  rationale: الكلمة هنا تشير إلى البشر عمومًا لا إلى الذكور خاصة؛ و«البشر» تنقل هذا المعنى مباشرة من غير حاجة إلى حاشية تفسيرية أو إدخال تمييز طائفي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حُفظ تركيب الغرض والتقابل المتوازي بين الحكمة البشرية وقوة الله، مع تجنب الحرفية غير الطبيعية.
