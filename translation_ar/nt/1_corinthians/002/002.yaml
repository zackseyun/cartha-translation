id: 1CO.2.2
reference: 1 Corinthians 2:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: ar
  text: لأني قررت ألا أعرف بينكم شيئًا إلا يسوع المسيح، وإياه مصلوبًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκρινά
  choice: قررت
  rationale: يفيد الفعل هنا اتخاذ قرار راسخ، لا إصدار حكم قضائي؛ و«قررت» تعبير عربي واضح وطبيعي.
- source_word: τι εἰδέναι
  choice: ألا أعرف بينكم شيئًا
  rationale: مع النفي والتركيب الاستثنائي εἰ μὴ، يدل التعبير على حصر ما عزم بولس أن يجعله محور معرفته وإعلانه.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: ينقل سياق وجود بولس وخدمته وسط أهل كورنثوس بإيجاز طبيعي.
- source_word: εἰ μὴ
  choice: إلا
  rationale: هي أداة الاستثناء العربية المباشرة المقابلة للتركيب اليوناني.
- source_word: Ἰησοῦν Χριστόν
  choice: يسوع المسيح
  rationale: «المسيح» في العربية يحمل معنى اللقب المسياني، وهو كذلك الصيغة الكتابية الطبيعية المألوفة، فلا تستلزم حاشية بديلة من نوع «المسيّا».
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: وإياه مصلوبًا
  rationale: «إياه» تحفظ توكيد اسم الإشارة τοῦτον، و«مصلوبًا» تنقل العبارة الموجزة والحالة التي يبرزها اسم المفعول التام المبني للمجهول.
theological_decisions:
- issue: قوة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» ترجمة عربية أصيلة للقب Χριστός وتحفظ دلالته المسيانية، مع كونها أفصح وأشيع من نقل اللفظ العبري صوتيًا.
- issue: دلالة معرفة المسيح وحده
  choice: 'الإبقاء على صيغة الحصر: «ألا أعرف بينكم شيئًا إلا...»'
  alternative: تفسيرها صراحة بأنها حصر لموضوع الكرازة
  rationale: يحفظ النص توتر العبارة البلاغية ولا يضيّقها بإضافة تفسير غير مصرح به في اليونانية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حوفظ على إيجاز الأصل وتوكيده في «وإياه مصلوبًا» دون شرح زائد.
