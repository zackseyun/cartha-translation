lexical_decisions:
- source_word: λόγος
  choice: كلامي
  rationale: يشير في السياق إلى كلام بولس وأسلوب عرضه، ويحافظ على تمييزه عن κήρυγμα.
- source_word: κήρυγμα
  choice: كرازتي
  rationale: ينقل معنى المناداة العلنية بالرسالة، وهو تعبير عربي كتابي واضح ومتميز عن «كلامي».
- source_word: πειθοῖ σοφίας
  choice: بحكمة مقنعة
  rationale: يحافظ على إيجاز اليونانية التي لا تذكر «كلمات» صراحة، وينقل معنى الحكمة ذات القدرة البلاغية على الإقناع.
- source_word: ἀποδείξει
  choice: ببرهان
  rationale: ينقل معنى الإظهار المبيّن أو الإثبات، ويقيم المقابلة مع الإقناع البلاغي المجرد.
- source_word: πνεύματος
  choice: الروح
  rationale: يرجح السياق الإشارة إلى روح الله، مع إبقاء احتمال قراءة «روح» دون تعيين في الحاشية.
- source_word: δυνάμεως
  choice: القوة
  rationale: مقابل عربي مباشر وطبيعي، ويحافظ على اقترانه بالروح في العبارة البولسية.
theological_decisions:
- issue: هل يشير πνεύματος إلى روح الله أم إلى الروح بمعنى غير معيّن؟
  choice: الروح
  alternative: روح
  rationale: سياق الأصحاح الذي يقابل حكمة البشر بما يأتي من الله يرجح روح الله، لكن صيغة اليونانية نفسها تسمح بقدر من عدم التعيين، لذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ التوازي بين «كلامي وكرازتي» والمقابلة بين «حكمة مقنعة» و«برهان من الروح والقوة»، من غير إضافة «كلمات» غير المذكورة صراحة في النص اليوناني.
