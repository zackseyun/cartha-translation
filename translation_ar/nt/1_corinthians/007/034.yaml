source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: ar
  text: وهو منقسم. أما المرأة غير المتزوجة، أي العذراء[a]، فتهتم بأمور الرب لكي تكون مقدسة في الجسد والروح كليهما. وأما المرأة المتزوجة فتهتم بأمور العالم، كيف ترضي زوجها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والمرأة غير المتزوجة والعذراء تهتمان بأمور الرب». يمكن فهم اليونانية على أنها تذكر فئتين بدل أن تجعل «العذراء» توضيحًا للمرأة غير المتزوجة.'
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: وهو منقسم
  rationale: يحافظ على صورة الانقسام وعلى دلالة الحالة الناتجة في صيغة التام المبني للمجهول. والضمير المستتر يعود، بحسب الوقف في نص SBLGNT، إلى الرجل المتزوج المذكور في السياق السابق، لا إلى المرأة اللاحقة.
- source_word: γυνὴ ἡ ἄγαμος
  choice: المرأة غير المتزوجة
  rationale: γυνή تعني المرأة أو الزوجة، والمقابلة هنا مع المرأة المتزوجة تجعل «المرأة غير المتزوجة» أوضح تعبير عربي.
- source_word: παρθένος
  choice: العذراء
  rationale: يحفظ المعنى المعجمي المحدد للكلمة اليونانية بدل تعميمه إلى «الفتاة».
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: المرأة غير المتزوجة، أي العذراء
  rationale: تُفهم العبارة هنا على أنها بدل أو توضيح، وهو ما ينسجم مع الفعل المفرد، مع إثبات احتمال العطف بين فئتين في الحاشية.
- source_word: μεριμνᾷ
  choice: تهتم
  rationale: يدل الفعل هنا على انشغال العناية والاهتمام، لا بالضرورة على القلق المذموم.
- source_word: τὰ τοῦ κυρίου
  choice: بأمور الرب
  rationale: صياغة عربية واضحة تحافظ على المقابلة اللفظية مع «أمور العالم».
- source_word: ἵνα ᾖ ἁγία
  choice: لكي تكون مقدسة
  rationale: تحافظ «لكي» على معنى الغاية، وتحفظ «مقدسة» لغة القداسة الصريحة في الأصل.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: في الجسد والروح كليهما
  rationale: تفيد العبارة مجالَي القداسة، وتُظهر «كليهما» قوة تركيب καὶ ... καὶ من غير تقرير نظرية خاصة في تكوين الإنسان.
- source_word: ἡ δὲ γαμήσασα
  choice: المرأة المتزوجة
  rationale: ترجمة عربية اصطلاحية لاسم الفاعل المستخدم للدلالة على المرأة التي دخلت حالة الزواج.
- source_word: τὰ τοῦ κόσμου
  choice: بأمور العالم
  rationale: تحافظ على التوازي مع «بأمور الرب» من غير إضفاء معنى أخلاقي سلبي أقوى مما يقتضيه السياق.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: كيف ترضي زوجها
  rationale: ἀνήρ يعني الزوج بوضوح في هذا السياق، والصياغة تنقل موضوع اهتمامها على نحو طبيعي.
theological_decisions:
- issue: هل «المرأة غير المتزوجة» و«العذراء» فئتان منفصلتان أم إن الثانية توضيح للأولى؟
  choice: 'صيغت العبارة على سبيل التوضيح: «المرأة غير المتزوجة، أي العذراء»'
  alternative: «المرأة غير المتزوجة والعذراء تهتمان بأمور الرب»
  rationale: التركيب اليوناني موجز ويحتمل الوجهين، لكن الفعل المفرد يرجح فهم الموضوع على أنه وحدة واحدة. أُبقي الوجه الآخر في الحاشية حتى لا يُمحى الغموض الحقيقي.
- issue: مرجع «منقسم» في مطلع الآية
  choice: «وهو منقسم»، عائدًا إلى الرجل المتزوج في السياق السابق
  alternative: «وهي منقسمة»، عائدًا إلى المرأة
  rationale: الفعل اليوناني لا يحمل علامة جنس، لكن الوقف في SBLGNT يفصل الجملة قبل بدء الكلام عن المرأة، وسياق الآية السابقة يجعل الرجل المتزوج هو المرجع النحوي الأقرب. لذلك اتُّبع دليل النص اليوناني لا صيغة طبقة الاستشارة الإنجليزية في هذه النقطة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمور الرب/أمور العالم» للمحافظة على التوازي، ووُضعت علامة الحاشية [a] في المتن عند موضع الاحتمال النحوي.
