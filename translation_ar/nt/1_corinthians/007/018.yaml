  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: ar
  text: هل دُعيَ أحدٌ وهو مختون؟ فلا يحاول إخفاء آثار الختان أو عكسها[a]. هل دُعيَ أحدٌ وهو غير مختون؟ فلا يختتن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فلا يَصِرْ غير مختون»، أي لا يحاول إخفاء علامات الختان أو عكسها.'
    reason: بديل معجمي يوضح الصورة الحرفية والممارسة القديمة التي يدل عليها الفعل.
lexical_decisions:
- source_word: περιτετμημένος
  choice: وهو مختون
  rationale: اسم المفعول التام يدل على حالة قائمة ناتجة عن الختان، وهذه الصياغة العربية الطبيعية تُبرز الحالة وقت الدعوة.
- source_word: ἐκλήθη / κέκληταί
  choice: أَدُعِيَ
  rationale: يحافظ على لفظ الدعوة في اليونانية وعلى احتمال دلالته البولسية على دعوة الله، من غير استبداله بتفسير مثل «آمن» أو «اهتدى».
- source_word: ἐπισπάσθω
  choice: فلا يحاول أن يزيل آثار ختانه
  rationale: الفعل يشير حرفيًا إلى جعل المختون نفسه كغير المختون، أي إخفاء علامات الختان أو عكسها؛ والصياغة توصل المقصود بوضوح مع إبقاء البديل الحرفي في الحاشية.
- source_word: ἐν ἀκροβυστίᾳ
  choice: وهو غير مختون
  rationale: العبارة تصف الحالة التي كان عليها الشخص حين دُعي، وهذه صياغة عربية واضحة وغير متكلفة.
- source_word: περιτεμνέσθω
  choice: فلا يختتن
  rationale: يحافظ المضارع المنهي عنه على قوة التوجيه الموجز في الأصل.
theological_decisions:
- issue: مدلول «الدعوة» في العبارتين
  choice: الإبقاء على «أَدُعِيَ» بما يرجّح دعوة الله إلى الحياة المسيحية من غير التصريح بالفاعل
  alternative: «آمن» أو «دخل في الإيمان»
  rationale: السياق القريب في 1 كورنثوس 7 يتناول حال المؤمن وقت دعوة الله له، لكن الأصل يستعمل فعل «دعا» ولا يذكر الفاعل صراحة؛ لذلك تحفظ الترجمة التعبير وتوتره الدلالي بدل تحويله إلى تفسير صريح.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة، مع بنية استفهام وجواب موازية للأصل. ضُبط الفعل «أَدُعِيَ» لتفادي التباسه بالفعل المبني للمعلوم «أدعو».
