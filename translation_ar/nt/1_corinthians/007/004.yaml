source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: ar
  text: ليس للزوجة سلطة على جسدها هي، بل لزوجها سلطة عليه؛ وكذلك ليس للزوج سلطة على جسده هو، بل لزوجته سلطة عليه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تمارس الزوجة سلطة على جسدها هي... ولا يمارس الزوج سلطة على جسده هو». يمكن أن يدل الفعل اليوناني على امتلاك السلطة أو ممارستها؛ والسلطة هنا متبادلة بين الزوجين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: الزوجة
  rationale: السياق المباشر يتناول الزواج والواجبات المتبادلة بين الزوجين، ولذلك يدل اللفظ هنا على المرأة المتزوجة لا على المرأة عمومًا.
- source_word: ὁ ἀνήρ
  choice: الزوج
  rationale: اقترانه بلفظ γυνή في سياق الزواج يقتضي معنى الزوج، لا الرجل بمعناه العام.
- source_word: τοῦ ἰδίου σώματος
  choice: على جسدها / على جسده
  rationale: تحافظ الصياغة العربية الطبيعية على الإحالة إلى جسد الشخص نفسه، في حين يؤدي تركيب «ليست له سلطة على» معنى الفعل اليوناني بوضوح.
- source_word: ἐξουσιάζει
  choice: له/لها سلطة على
  rationale: يدل الفعل على امتلاك السلطة أو ممارستها. وهذه الصياغة مباشرة وتحفظ القوة العلاقية للنص من غير أن تضيف معنى السيطرة القسرية.
- source_word: ἀλλά
  choice: بل
  rationale: «بل» تنقل المقابلة التصحيحية الواضحة بين صاحب الجسد والطرف الآخر في الزواج.
- source_word: ὁμοίως δὲ καὶ
  choice: وكذلك
  rationale: صياغة عربية موجزة وطبيعية تحفظ التوازي والتبادلية بين شطري الآية.
theological_decisions:
- issue: طبيعة السلطة الزوجية في الآية
  choice: صياغة القول بوصفه سلطة متبادلة بين الزوجين، مع الحفاظ على البنية المتوازية للنص.
  alternative: تخفيف العبارة إلى معنى الملكية، أو تشديدها إلى معنى التحكم القسري في جسد الطرف الآخر.
  rationale: يسند النص الحكم نفسه إلى كل من الزوجة والزوج على نحو متبادل. لذلك ينبغي ألا تميل الترجمة إلى تراتبية أحادية الجانب، ولا أن تحوّل السلطة المذكورة إلى مجرد انتماء أو إلى إكراه لم يصرّح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم تركيب «ليست لـ... سلطة على» لأنه طبيعي ويقابل الفعل اليوناني مباشرة، وحُفظ التوازي بين الزوجة والزوج. وُضع مؤشر الحاشية في نهاية الآية لأنه يشرح الفعل في موضعيه كليهما.
