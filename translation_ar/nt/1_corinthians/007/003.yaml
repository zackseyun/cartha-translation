  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: ar
  text: لِيُعْطِ الزوجُ زوجتَه حقَّها الزوجيَّ[a]، وكذلك الزوجةُ زوجَها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما يجب لها»؛ وحرفيًّا: «الدَّين» أو «الالتزام». والمقصود في السياق حق كلٍّ من الزوجين في العلاقة الزوجية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ γυναικί
  choice: زوجتَه
  rationale: السياق سياق زواج، ولذلك تدل γυνή هنا على الزوجة، لا على المرأة عمومًا.
- source_word: ὁ ἀνήρ
  choice: الزوجُ
  rationale: في المقابلة مع γυνή وضمن تعليمات الزواج، يدل ἀνήρ على الزوج.
- source_word: τὴν ὀφειλήν
  choice: حقَّها الزوجيَّ
  rationale: تعني ὀφειλή ما هو مستحق أو واجب الأداء. ويبيّن السياق أن المقصود حق متبادل في العلاقة الزوجية؛ وتعبير «حقها الزوجي» يحفظ معنى الاستحقاق دون تضييق اللفظ أكثر مما يقتضيه السياق.
- source_word: ἀποδιδότω
  choice: لِيُعْطِ
  rationale: صيغة الأمر الحاضر تفيد أداء الالتزام المستمر، و«ليُعطِ» عربية واضحة تحافظ على قوة الأمر وعلى معنى ردّ ما هو مستحق.
- source_word: ὁμοίως δὲ καὶ
  choice: وكذلك
  rationale: تنقل الربط والإضافة والتماثل المتبادل بين الزوج والزوجة بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: مدى التصريح بطبيعة الالتزام الذي تدل عليه ὀφειλή
  choice: حقَّها الزوجيَّ
  alternative: ما يجب لها؛ الواجب الزوجي؛ حقها في المعاشرة
  rationale: الاسم اليوناني أوسع من التصريح بالمعاشرة، لكن سياق الآيات 2 و4–5 يحدده بوصفه التزامًا زوجيًا حميمًا. تحافظ الصياغة المختارة على هذا السياق وعلى كون الحق متبادلًا، من غير تحويل العبارة إلى وصف تشريحي أو قانوني ضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. حوفظ على التوازي المتبادل في الأصل، واستُخدم «الحق الزوجي» لإبراز معنى ما هو مستحق مع إبقاء التحديد السياقي في الحاشية.
