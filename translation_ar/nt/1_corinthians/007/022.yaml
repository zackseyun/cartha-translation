source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: ar
  text: فإن العبد الذي دُعي في الرب هو عتيق الرب[a]؛ وكذلك الحر الذي دُعي هو عبد المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الشخص الذي أُعتق من الرق وصار حرًّا؛ واللفظ لا يعني مجرد «الحر» بوجه عام.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تُترجم «عبد المسيح» أيضًا «مملوك المسيح»؛ والمقصود تبعيته الكاملة للمسيح، في مقابلة حريته الاجتماعية.
    reason: lexical_clarification
lexical_decisions:
- source_word: δοῦλος
  choice: العبد
  rationale: يحافظ لفظ «العبد» على دلالة الرق والتبعية، وهي جوهر المفارقة بين وضع الإنسان الاجتماعي وانتمائه إلى المسيح.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: نُقلت العبارة كما هي للمحافظة على احتمال دلالتها على الاتحاد بالرب أو المجال الروحي الذي تمت فيه الدعوة، من غير حسم زائد.
- source_word: κληθεὶς
  choice: الذي دُعي
  rationale: صيغة المبني للمجهول تنقل اسم المفعول اليوناني وتحافظ على معنى الدعوة الإلهية الضمني في استعمال بولس.
- source_word: ἀπελεύθερος
  choice: عتيق
  rationale: «العتيق» في هذا السياق هو من أُعتق من الرق، لا مجرد شخص حر؛ وبذلك تبقى المقابلة القانونية والاجتماعية مع «العبد» واضحة.
- source_word: κυρίου
  choice: الرب
  rationale: الإضافة في «عتيق الرب» تحافظ بإيجاز على علاقة الانتماء التي تفيدها صيغة المضاف إليه اليونانية.
- source_word: ὁμοίως
  choice: وكذلك
  rationale: تحافظ على التوازي البلاغي المحكم بين شطري الآية.
- source_word: ἐλεύθερος
  choice: الحر
  rationale: ينقل الوضع الاجتماعي المقابل للعبد بصياغة عربية طبيعية، مع بقاء المفرد المذكر التمثيلي في الأصل.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، وتحافظ الإضافة في «عبد المسيح» على معنى الانتماء إليه.
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب اللاهوتي المألوف ولا يختزله في علاقة السيد الاجتماعي بعبده.
theological_decisions:
- issue: المفارقة بين الرق والحرية
  choice: 'الإبقاء على الألفاظ الحادة: العبد، عتيق الرب، الحر، عبد المسيح'
  alternative: تلطيف «عبد» إلى «خادم»، أو تعميم «عتيق» إلى «حر»
  rationale: 'يبني بولس حجته على انقلاب متعمد في الوضع: العبد اجتماعيًا عتيق للرب، والحر اجتماعيًا عبد للمسيح. تلطيف الألفاظ يضعف هذه المفارقة.'
- issue: دلالة الإضافة في «عتيق الرب»
  choice: الحفاظ على علاقة الانتماء بصيغة الإضافة
  alternative: تفسيرها صراحة بأنه «الذي حرره الرب»
  rationale: قد توحي العبارة اليونانية بالانتماء إلى الرب بصفته عتيقه، ولا يلزم أن تُحسم إلى بيان فاعل العتق وحده.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: ترك اللفظ بصيغة اسمية منقولة لا تُظهر اللقب
  rationale: اللفظ اليوناني لقب يدل على الممسوح، و«المسيح» هو المقابل العربي الراسخ والطبيعي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع استعمال «عتيق» بوصفه مصطلحًا دقيقًا يحتاج إلى إيضاح في الحاشية. حُفظ التوازي بين «العبد/الحر» و«عتيق الرب/عبد المسيح»، وحُفظت عبارة «في الرب» من غير تفسير زائد.
