source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: ar
  text: 'وأقول هذا، أيها الإخوة[a]: إن الوقت قد اختُصر[b]؛ فمن الآن فصاعدًا، فليكن حتى الذين لهم زوجات كأنهم لا زوجات لهم،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: صيغة «الإخوة» تترجم جمع المذكر ἀδελφοί، ويمكن أن تشمل في هذا السياق جماعة المؤمنين من الرجال والنساء.
    reason: cultural_note
  - marker: b
    text: 'أو: «إن الوقت المحدد قد قَصُر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: فأقول هذا
  rationale: صياغة عربية طبيعية تحفظ وظيفة العبارة في استئناف الكلام وتقديم ما يريد بولس تأكيده، من غير تحويلها إلى تفسير زائد.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية، وهي صيغة يمكن أن يُخاطَب بها عموم المؤمنين بحسب السياق.
- source_word: ὁ καιρός
  choice: الوقت
  rationale: لفظ موجز وطبيعي، مع بقاء دلالة الوقت الحاسم أو المحدد ممكنة بحسب السياق.
- source_word: συνεσταλμένος ἐστίν
  choice: قد اختُصر
  rationale: يحفظ معنى التركيب التام الدال على أن الوقت صار في حالة من الاختصار، ولا يحسم في المتن هل المقصود أنه قَصُر أو جُعل أقصر.
- source_word: τὸ λοιπὸν
  choice: من الآن فصاعدًا
  rationale: ينقل بوضوح القوة الزمنية للعبارة بوصفها مدخلًا إلى ما ينبغي أن يكون عليه السلوك في المدة الباقية.
- source_word: ἵνα
  choice: ليكن
  rationale: ينقل إلى العربية الأثر الحاثّ للجملة التابعة مع الحفاظ على صلتها بضيق الوقت، من غير المبالغة في حسم كونها غاية أو نتيجة.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: الذين لهم زوجات
  rationale: يتبع اللفظ اليوناني مباشرة، حيث تدل γυναῖκας في هذا السياق على الزوجات لا على النساء بوجه عام.
- source_word: ὡς μὴ ἔχοντες
  choice: كأن ليست لهم زوجات
  rationale: يحافظ على حدة المقارنة في الأصل ويصرّح بالمرجع في العربية اتقاءً للالتباس.
theological_decisions:
- issue: القوة الرعوية واللاهوتية للتوجيه المتعلق بالزواج
  choice: 'إبقاء القول مباشرًا: «كأن ليست لهم زوجات»'
  alternative: تفسيره في الترجمة بأنه دعوة إلى التخفف العاطفي من التعلق بالزواج أو إلى عدم الانشغال به
  rationale: يربط النص إضفاء النسبية على الأوضاع الاجتماعية العادية بإلحاح الوقت. لذلك تُحفظ حدة العبارة وتوترها مع واجبات الزواج ومكانته، بدل حل هذا التوتر بتفسير داخل الترجمة.
- issue: العلاقة المنطقية التي تفيدها ἵνα
  choice: صياغتها بصيغة الحث «ليكن» مع إبقاء الصلة بما سبق
  alternative: حسمها صراحة على أنها غاية بعبارة «لكي» أو نتيجة بعبارة «لذلك»
  rationale: يمكن أن تحمل ἵνα هنا قوة الغاية أو النتيجة/التبعة العملية؛ والصياغة المختارة لا تغلق هذا المجال الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «اختُصر» للمحافظة على صورة تقلّص الوقت وحالة القِصر الناتجة، واستُبقيت العبارة الخاصة بالزوجات بصورتها الحادة من غير تلطيف تفسيري.
