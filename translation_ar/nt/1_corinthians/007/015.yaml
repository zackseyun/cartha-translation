  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: ar
  text: وَإِنْ فَارَقَ غَيْرُ الْمُؤْمِنِ[a]، فَلْيُفَارِقْ. فَلَا الْأَخُ مُسْتَعْبَدٌ وَلَا الْأُخْتُ مُسْتَعْبَدَةٌ فِي مِثْلِ هَذِهِ الْأَحْوَالِ[b]، بَلْ قَدْ دَعَانَا[c] اللهُ فِي سَلَامٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'بحسب السياق، المقصود الزوج غير المؤمن. ويمكن أيضًا ترجمتها: «الشخص غير المؤمن».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن ترجمتها: «غير مقيَّد». غير أن الفعل اليوناني مشتق من كلمة تعني «يستعبد»، لا من الفعل المعتاد الذي يعني «يربط».'
    reason: lexical_alternative
  - marker: c
    text: 'تقرأ بعض المخطوطات: «دعاكم» بدلًا من «دعانا».'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: غَيْرُ الْمُؤْمِنِ
  rationale: تعبير اسمي يطابق اليونانية من غير إضافة «الزوج» إلى المتن، مع أن سياق الزواج يحدد المقصود.
- source_word: χωρίζεται / χωριζέσθω
  choice: يُفَارِقُ / فَلْيُفَارِقْ
  rationale: يحافظ على تكرار الجذر في الفعلين، ولا يحسم هل المقصود طلاق قانوني أم مجرد انفصال أو رحيل.
- source_word: οὐ δεδούλωται
  choice: فَلَا الْأَخُ مُسْتَعْبَدٌ وَلَا الْأُخْتُ مُسْتَعْبَدَةٌ
  rationale: يحافظ على دلالة δουλόω، أي الاستعباد، بدل تحويلها مباشرة إلى مصطلح تقني بمعنى الربط. وفُكَّ تركيب «الأخ أو الأخت» قليلًا لضمان المطابقة الطبيعية بين الجنس والصفة في العربية.
- source_word: ἐν τοῖς τοιούτοις
  choice: فِي مِثْلِ هَذِهِ الْأَحْوَالِ
  rationale: صياغة عربية واضحة تؤدي معنى الحالات أو الظروف المماثلة التي يشير إليها جمع العبارة اليونانية.
- source_word: ἐν δὲ εἰρήνῃ
  choice: بَلْ ... فِي سَلَامٍ
  rationale: يبقي حرف الجر ودلالة المجال أو الحال، من غير تحويل العبارة جازمًا إلى «إلى السلام» أو «لأجل السلام».
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: قَدْ دَعَانَا اللهُ
  rationale: '«قد» مع الماضي تنقل كون الدعوة فعلًا تم وله أثر قائم، و«نا» تتبع قراءة SBLGNT: ἡμᾶς.'
theological_decisions:
- issue: مدى الحرية التي تفيدها عبارة οὐ δεδούλωται بشأن انحلال الزواج والزواج اللاحق
  choice: استُعملت «مستعبد» من غير تحديد النتائج الفقهية أو العقائدية الكاملة لهذه الحرية.
  alternative: «غير مرتبط» بوصفها عبارة تقنية تجيز الزواج اللاحق، أو قصرها على عدم إلزام المؤمن بملاحقة الطرف المفارق.
  rationale: النص يصرح بعدم الاستعباد في هذه الأحوال، لكنه لا يحدد هنا كل ما يترتب على ذلك؛ لذلك تُحفظ دلالة اللفظ والتوتر التفسيري.
- issue: هوية ὁ ἄπιστος
  choice: «غير المؤمن» في المتن، ويفهم من السياق أنه الزوج غير المؤمن.
  alternative: إضافة «الزوج غير المؤمن» صراحةً في المتن.
  rationale: السياق الزوجي واضح، لكن كلمة «الزوج» تفسير سياقي وليست مذكورة صراحة في العبارة اليونانية.
- issue: دلالة ἐν εἰρήνῃ
  choice: «في سلام»
  alternative: «إلى السلام» أو «للسلام»
  rationale: تحافظ الصياغة على احتمال كون السلام مجال الدعوة أو حالها، بدل حصر العبارة في غايتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حُفظ تكرار فعل المفارقة، واستُعملت صياغة مزدوجة للأخ والأخت كي تكون المطابقة النحوية طبيعية، مع إبقاء ألفاظ الاستعباد والسلام قريبة من بنية الأصل من غير فرض نتيجة مذهبية.
