translation:
  language: ar
  text: لِيَبْقَ كُلُّ وَاحِدٍ فِي الدَّعْوَةِ الَّتِي دُعِيَ فِيهَا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحال»، أو «الظروف»، أو «المكانة في الحياة». تقول اليونانية حرفيًا «الدعوة»، مردِّدةً لفظ «دُعِيَ» في الآية نفسها.
    reason: lexical_alternative
  - marker: b
    text: يستعمل النص اليوناني صيغة المفرد المذكر استعمالًا تمثيليًا، فتشمل الوصية كل شخص.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: كُلُّ وَاحِدٍ
  rationale: يحافظ على صيغة المفرد التوزيعية، فيوجّه الوصية إلى كل فرد على حدة.
- source_word: κλήσει
  choice: الدَّعْوَةِ
  rationale: يحفظ المعنى اللفظي والصلة البلاغية بالفعل ἐκλήθη («دُعِيَ»)، من غير اختزال التوتر بين دعوة الله وحال الإنسان عند دعوته.
- source_word: ᾗ ἐκλήθη
  choice: الَّتِي دُعِيَ فِيهَا
  rationale: يحافظ على تركيب «في» وعلى المبني للمجهول الذي يلمّح إلى الفاعل الإلهي من غير التصريح به في النص.
- source_word: ἐν ταύτῃ
  choice: فِي الدَّعْوَةِ الَّتِي دُعِيَ فِيهَا
  rationale: أُدمجت الإحالة إلى «هذه» في العبارة العربية الطبيعية، مع إبقاء المرجع واضحًا من غير تكرار ثقيل.
- source_word: μενέτω
  choice: لِيَبْقَ
  rationale: صيغة أمر عربية واضحة تدل على الاستمرار في الحال القائمة، من غير تشديدها إلى معنى الوجوب المطلق.
theological_decisions:
- issue: دلالة κλῆσις في السياق
  choice: إبقاء «الدعوة» في المتن
  alternative: الحال، أو الظروف، أو المكانة في الحياة
  rationale: السياق يتناول أحوالًا مثل الختان والعبودية، لكن اليونانية تقرن κλήσει بالفعل ἐκλήθη عمدًا. وتحافظ «الدعوة… دُعي» على هذا الترابط وعلى التوتر بين الدعوة الإلهية والظرف الحياتي.
- issue: صيغة المفرد المذكر التمثيلية
  choice: «كل واحد» مع الفعل المبني للمجهول «دُعي»
  alternative: كل شخص، أو صياغة جمع شاملة
  rationale: يحافظ ذلك على المفرد التوزيعي في الأصل، مع بيان أن الخطاب يشمل كل مؤمن في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «لِيَبْقَ» للأمر المستمر، وحُفظ التجانس اللفظي بين «الدعوة» و«دُعِيَ» مع تجنب تفسير المقصود تفسيرًا اجتماعيًا محضًا.
