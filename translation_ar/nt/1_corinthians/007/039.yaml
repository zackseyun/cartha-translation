  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: ar
  text: الزوجة مرتبطة بزوجها ما دام حيًّا؛ ولكن إن رقد زوجها[a]، فهي حرة أن تتزوج بمن تشاء، على أن يكون ذلك في الرب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: مات. يستعمل النص اليوناني «رقد» تعبيرًا ملطفًا شائعًا عن الموت.'
    reason: lexical_alternative
  - marker: b
    text: يُفهم قول «في الرب» في الغالب على أنه يقصر الزواج على من ينتمي إلى الرب، أي على مؤمن؛ وقد يدل أيضًا على أن يكون الزواج منسجمًا مع الولاء للرب.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: الزوجة
  rationale: السياق الزوجي وذكر «زوجها» يحددان معنى الكلمة هنا بالزوجة، لا المرأة عمومًا.
- source_word: δέδεται
  choice: مرتبطة بزوجها
  rationale: صيغة التام المبني للمجهول تفيد حالة ارتباط مستمرة؛ وهذه العبارة تحافظ على القوة العلائقية والقانونية دون إضافة «بالشريعة»، وهي غير موجودة في النص اليوناني.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: ما دام حيًّا
  rationale: تعبير عربي طبيعي ودقيق عن مدة استمرار حياة الزوج.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: زوجها
  rationale: ἀνήρ في هذا السياق يعني الزوج بوضوح.
- source_word: κοιμηθῇ
  choice: رقد
  rationale: يحفظ الاستعارة اليونانية الشائعة للموت، وهي مفهومة في العربية الكتابية، مع بيان معناها الصريح في الحاشية.
- source_word: ἐλευθέρα ἐστίν
  choice: فهي حرة
  rationale: ينقل بوضوح تحررها من رباط الزواج السابق.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: أن تتزوج بمن تشاء
  rationale: صياغة عربية طبيعية تؤدي معنى حرية اختيار الزوج الجديد؛ ولا يلزم في العربية تقليد صيغة المبني للمجهول حرفيًا.
- source_word: μόνον ἐν κυρίῳ
  choice: على أن يكون ذلك في الرب
  rationale: «على أن» تؤدي قوة القيد، وإرجاع الضمير إلى الزواج يتجنب حصر العبارة تفسيرًا في هوية الزوج وحدها، بينما يحفظ التعبير البولسي «في الرب».
theological_decisions:
- issue: معنى «في الرب» في توجيه الزواج من جديد
  choice: الإبقاء على العبارة «في الرب» دون توسيعها في المتن
  alternative: ألا تتزوج إلا مؤمنًا بالرب؛ أو أن يكون الزواج على نحو يوافق الولاء للرب
  rationale: العبارة اليونانية موجزة وتحمل قدرًا من الانفتاح التفسيري. إبقاؤها كما هي يصون التوتر اللاهوتي ولا يحصرها في تفسير واحد، مع ذكر الفهم الشائع في الحاشية.
- issue: استعارة النوم للموت
  choice: رقد
  alternative: مات
  rationale: يستعمل بولس فعل النوم تعبيرًا عن الموت. يحفظ «رقد» صورة الأصل، وتوضح الحاشية المعنى المباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «رقد» لصون صورة الأصل، و«على أن يكون ذلك في الرب» لإبراز القيد مع تجنب حسم مرجع العبارة على نحو أضيق من اليونانية.
