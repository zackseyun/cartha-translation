  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: ar
  text: ولكن إن ظنّ أحدٌ أنه يتصرف على نحو غير لائق تجاه عذرائه[a]، إن كانت قد تجاوزت سنَّ الشباب، وكان ينبغي أن يحدث الأمر هكذا، فليفعل ما يريد؛ فهو لا يرتكب خطيئة. فليتزوجا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجاه خطيبته العذراء». وفُهمت العبارة تقليديًا أيضًا بمعنى: «تجاه ابنته العذراء». واليونانية تحتمل الوجهين.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: يتصرف على نحو غير لائق
  rationale: ينقل معنى السلوك غير اللائق أو غير المحتشم من غير المبالغة بإضفاء معنى جنسي صريح لا يفرضه اللفظ.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: تجاه عذرائه
  rationale: يحافظ قدر الإمكان على التعبير اليوناني الملتبس، إذ قد يُفهم عن عذراء مرتبطة بالرجل، كخطيبته، أو عن ابنته العذراء التي في رعايته؛ وتوضح الحاشية الوجهين.
- source_word: ὑπέρακμος
  choice: تجاوزت سنَّ الشباب
  rationale: يدل اللفظ على تجاوز أوج الشباب أو زهرته، وهذه صياغة عربية واضحة لا تحدد سنًا عصرية دقيقة.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: وكان ينبغي أن يحدث الأمر هكذا
  rationale: تحافظ الصياغة على عموم معنى الوجوب والحدوث في اليونانية، من غير تعيين سبب الضرورة.
- source_word: ὃ θέλει ποιείτω
  choice: فليفعل ما يريد
  rationale: صيغة أمر إباحي مباشرة تحافظ على قوة العبارة.
- source_word: οὐχ ἁμαρτάνει
  choice: إنه لا يخطئ
  rationale: يعبر المضارع عن أن هذا الفعل لا يُعد خطيئة، بصياغة عربية طبيعية.
- source_word: γαμείτωσαν
  choice: فليتزوجا
  rationale: صيغة أمر للمثنى في العربية، وتشير طبيعيًا إلى الطرفين الداخلين في الزواج.
theological_decisions:
- issue: هوية «عذرائه» (παρθένον αὐτοῦ)
  choice: أُبقي في المتن تعبير قريب من غموض الأصل، مع بيان القراءتين الرئيسيتين في الحاشية.
  alternative: ترجمته صراحةً «خطيبته العذراء» أو «ابنته العذراء».
  rationale: العبارة اليونانية ملتبسة حقًا، وقد فُهمت إما عن رجل وخطيبته، وإما عن أب أو ولي وابنته العذراء. تعيين أحد الوجهين في المتن يحسم ما لم يحسمه المصدر.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «عذرائه» للمحافظة على التباس الأصل قدر الإمكان، وإن كان أقل شيوعًا من تعيين «خطيبته» أو «ابنته»، ولذلك أُرفق بإيضاح في الحاشية.
