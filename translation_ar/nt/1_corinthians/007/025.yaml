source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: ar
  text: وأمّا العذارى[a]، فليس عندي أمرٌ من الرب، لكنني أبدي رأيي[b]، بصفتي مَن رحمه الرب لأكون جديرًا بالثقة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «غير المتزوجات»، أو بحسب بعض تفسيرات السياق: «البنات العذارى». واللفظ اليوناني هو «العذارى».'
    reason: lexical_alternative
  - marker: b
    text: أو «تقديري» أو «مشورتي». يقابل بولس هنا رأيه المدروس بأمر مباشر من الرب.
    reason: alternative_reading
  - marker: c
    text: أو «أمينًا». يمكن أن يدل اللفظ اليوناني على الأمانة أو على كون الشخص جديرًا بالثقة؛ ويرجَّح هنا معنى الموثوقية في تقديم الإرشاد.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: وأمّا
  rationale: صيغة عربية طبيعية للانتقال إلى موضوع جديد، وتحافظ على وظيفة περί مع δέ من غير إدخال معنى زمني غير موجود في اليونانية.
- source_word: τῶν παρθένων
  choice: العذارى
  rationale: المعنى الأساسي لـ παρθένος هو العذراء، وغالبًا الشابة غير المتزوجة. أُبقي اللفظ عامًا لأن هوية المقصودات في السياق موضع نقاش.
- source_word: ἐπιταγὴν κυρίου
  choice: أمرٌ من الرب
  rationale: تنقل ἐπιταγή بمعنى الأمر أو التوجيه الملزم، وتوضح أن مصدره الرب.
- source_word: γνώμην δὲ δίδωμι
  choice: لكنني أبدي رأيي
  rationale: تنقل γνώμη بوصفها رأيًا مدروسًا أو تقديرًا، وتحافظ على مقابلتها بالأمر المباشر من الرب؛ و«أبدي» صياغة عربية طبيعية لفعل δίδωμι في هذا التركيب.
- source_word: ὡς ἠλεημένος ὑπὸ κυρίου
  choice: بصفتي مَن رحمه الرب
  rationale: 'تحافظ على دلالة اسم المفعول التام المبني للمجهول: أن بولس قد نال الرحمة من الرب، وعلى كون هذه العبارة أساسًا للصفة التالية.'
- source_word: πιστὸς εἶναι
  choice: لأكون جديرًا بالثقة
  rationale: يمكن أن تعني πιστός «أمينًا» أو «جديرًا بالثقة». يناسب المعنى الثاني سياق تقديم رأي يمكن الاعتماد عليه، مع ذكر البديل في الحاشية.
theological_decisions:
- issue: طبيعة سلطة قول بولس في مقابل أمر مباشر من الرب
  choice: يفرّق النص بين عدم وجود أمر مباشر من الرب في هذه المسألة وبين إبداء بولس رأيًا بصفته شخصًا رحمه الرب وجعله جديرًا بالثقة.
  alternative: اعتبار الكلام مجرد رأي شخصي بلا وزن رسولي، أو اعتباره نقلًا غير مباشر لأمر غير مذكور عن يسوع.
  rationale: 'المقابلة بين ἐπιταγή وγνώμη تحفظ التوتر في النص: لا يدّعي بولس هنا وجود أمر مباشر من الرب، لكنه لا يقدّم رأيه بوصفه رأيًا عابرًا، بل يربطه بالرحمة التي نالها من الرب وبكونه جديرًا بالثقة.'
- issue: دلالة πιστός
  choice: جديرًا بالثقة
  alternative: أمينًا
  rationale: السياق يتناول موثوقية الإرشاد الذي يقدمه بولس، لكن اللفظ اليوناني يحتمل أيضًا معنى الأمانة؛ لذلك أُثبت المعنى السياقي الأرجح في المتن وحُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «وأمّا» للانتقال الموضوعي، و«أبدي رأيي» لتجنب إيحاء أن الكلام رأي عابر، مع إبقاء الفرق بين الأمر المباشر والرأي المدروس من غير حسم زائد لطبيعة السلطة الرسولية.
