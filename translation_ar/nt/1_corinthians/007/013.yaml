base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: ar
  text: وَإِنْ كَانَتِ امْرَأَةٌ لَهَا زَوْجٌ غَيْرُ مُؤْمِنٍ، وَهُوَ يَرْضَى أَنْ يَعِيشَ مَعَهَا، فَلَا تَتْرُكْ زَوْجَهَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فلا تُطَلِّقْ زوجها». الفعل اليوناني يعني حرفيًا «يترك» أو «يُطلِق»، ويشير هنا إلى إنهاء العلاقة الزوجية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις ἔχει ἄνδρα
  choice: وَإِنْ كَانَ لِامْرَأَةٍ زَوْجٌ
  rationale: ينقل الشرط العام والسياق الزوجي بعربية طبيعية، ويجعل معنى ἀνήρ هنا «زوجًا» لا مجرد «رجل».
- source_word: ἄπιστον
  choice: غَيْرُ مُؤْمِنٍ
  rationale: يدل في السياق على الزوج الذي لا يشارك المرأة إيمانها، من غير إيحاء بالخيانة الزوجية.
- source_word: οὗτος συνευδοκεῖ
  choice: وَهُوَ يَرْضَى
  rationale: يعبّر عن موافقته الطوعية على استمرار الحياة المشتركة، مع نقل الإحالة إلى الزوج بوضوح.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: أَنْ يَعِيشَ مَعَهَا
  rationale: صياغة عربية واضحة وطبيعية لمعنى السكن والمعيشة الزوجية المشتركة.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: فَلَا تَتْرُكْ زَوْجَهَا
  rationale: يحافظ «تترك» على السعة الدلالية للفعل ἀφίημι بدل حصره اصطلاحيًا في الطلاق، بينما يوضح السياق أنه متعلق بإنهاء العلاقة الزوجية.
theological_decisions:
- issue: دلالة ἀφιέτω في الإرشاد المتعلق بالزواج بين مؤمنة وغير مؤمن
  choice: فَلَا تَتْرُكْ زَوْجَهَا
  alternative: فَلَا تُطَلِّقْ زَوْجَهَا
  rationale: الفعل قد يدل على الترك أو الإرسال، وله هنا قوة زوجية واضحة، لكن ترجمته بـ«تترك» تصون قدرًا من الغموض الأصلي ولا تقصر الفعل على إجراء قانوني محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «غير مؤمن» لتجنب التباس «غير أمين»، و«يعيش معها» بدل التعبير الأقدم «يسكن معها». وُضعت علامة الحاشية بعد الجملة التي تشرحها.
