  to: وَإِنْ كَانَتِ امْرَأَةٌ لَهَا زَوْجٌ غَيْرُ مُؤْمِنٍ، وَهُوَ يَرْضَى أَنْ يَعِيشَ مَعَهَا، فَلَا تَتْرُكْ زَوْجَهَا.[a]
