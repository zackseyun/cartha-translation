  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: ar
  text: 'وأمّا ما كتبتم عنه: فحسنٌ للرجل ألّا يمسّ امرأةً.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تكون عبارة «ألّا يمسّ امرأةً» تلطيفًا لغويًا بمعنى ألّا يقيم معها علاقة جنسية. ويرى بعضهم أن هذه الكلمات تقتبس قولًا ورد في رسالة أهل كورنثوس إلى بولس، لكن النص اليوناني لا يحسم ذلك.
    reason: توضيح الدلالة الاصطلاحية المحتملة وموضع الخلاف بشأن كون العبارة اقتباسًا، من غير فرض أحد التفسيرين في المتن.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: وأمّا ما كتبتم عنه
  rationale: تنقل صيغة الانتقال إلى موضوع جديد، وتحافظ على عموم الموصول دون إضافة «أمور» غير الصريحة في اليونانية.
- source_word: καλὸν
  choice: حسنٌ
  rationale: مقابل طبيعي ومباشر يفيد أن الأمر محمود أو نافع، من غير تحويله إلى وصية إلزامية.
- source_word: ἀνθρώπῳ
  choice: للرجل
  rationale: مع أن اللفظة قد تعني الإنسان عمومًا، فإن اقترانها بـ«امرأة» وسياق العلاقة الجنسية يرجّح هنا معنى الرجل.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: ألّا يمسّ امرأةً
  rationale: يحافظ على الاستعارة الجسدية في الأصل وعلى احتمال دلالتها الاصطلاحية على الاتصال الجنسي، دون حسمها داخل المتن.
theological_decisions:
- issue: هل العبارة تقرير لبولس أم اقتباس من رسالة الكورنثيين؟
  choice: أُبقيت العبارة بلا علامات اقتباس
  alternative: «حسنٌ للرجل ألّا يمسّ امرأةً» بوصفها اقتباسًا من قولهم
  rationale: النص اليوناني لا يضع علامات اقتباس ولا يحسم وحده حدود الاقتباس؛ لذا لا ينبغي فرض قراءة تفسيرية في المتن.
- issue: دلالة «يمسّ امرأة»
  choice: الإبقاء على التعبير المجازي الحرفي
  alternative: «ألّا يقيم علاقة جنسية مع امرأة» أو «ألّا يتزوج»
  rationale: التعبير اليوناني يمكن أن يكون تلطيفًا للاتصال الجنسي، لكنه لا يساوي صراحةً الامتناع عن الزواج؛ إبقاء الصورة يصون التوتر والدلالة السياقية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «وأمّا» لنقل الانتقال الموضوعي الذي تؤديه δέ بعد Περὶ، وتُركت الاستعارة «يمسّ امرأة» كما في الأصل مع شرحها في الحاشية.
