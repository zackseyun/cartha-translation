  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: ar
  text: لكنني أريدكم أن تكونوا بلا هموم. الرجل غير المتزوج يهتم بأمور الرب، كيف يُرضي الرب؛
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θέλω δὲ
  choice: لكنني أريد
  rationale: تفيد θέλω الإرادة أو الرغبة، وδέ هنا تفيد انتقالًا ذا مسحة استدراكية متصلًا بما سبق؛ لذا جاءت «لكنني أريد» واضحة وطبيعية.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: أن تكونوا بلا هموم
  rationale: تدل ἀμέριμνος على التحرر من القلق أو الهمّ، لا على اللامبالاة؛ وتؤدي «بلا هموم» المعنى بإيجاز وتحافظ على الصلة اللفظية بالفعل التالي.
- source_word: ὁ ἄγαμος
  choice: غير المتزوج
  rationale: الصيغة اليونانية مفرد مذكر، والسياق القريب يعالج حال الرجل غير المتزوج ثم المرأة؛ لذلك حُفظ التذكير والإفراد في العربية من غير إضافة اسم غير موجود في الأصل.
- source_word: μεριμνᾷ
  choice: يهتم
  rationale: يمكن أن يعني الفعل القلق أو الانشغال والاهتمام. وفي هذا السياق الإيجابي المتعلق بأمور الرب، «يهتم» أنسب، مع إبقاء المقابلة الدلالية مع «بلا هموم».
- source_word: τὰ τοῦ κυρίου
  choice: بأمور الرب
  rationale: التركيب واسع الدلالة، ويشير إلى ما يخص الرب أو يتعلق به؛ و«أمور الرب» عربية طبيعية تحافظ على هذا الاتساع.
- source_word: κυρίου / κυρίῳ
  choice: الرب
  rationale: يحفظ «الرب» الدلالة اللقبية والتعبدية المعتادة لكلمة κύριος في سياق العهد الجديد.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: كيف يُرضي الرب
  rationale: تحفظ «كيف» معنى πῶς المتعلق بالكيفية أو الغاية، ويؤدي المضارع المنصوب «يُرضي» الفعل المتوخى في صيغة الاحتمال اليونانية من غير إثقال العبارة.
theological_decisions:
- issue: الإشارة المذكرة المفردة في المقارنة بين حالتي غير المتزوج والمتزوج
  choice: 'الإبقاء على المفرد المذكر: «غير المتزوج»'
  alternative: «الشخص غير المتزوج» أو صياغة عامة تشمل الجنسين
  rationale: ὁ ἄγαμος مذكر مفرد نحويًا، والآيات المجاورة تفصل بين حالة الرجل وحالة المرأة. لذلك يحفظ النص الرئيس هذه الدقة بدل تعميم العبارة بما قد يطمس بنية المقارنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي الإيجاز والتوازي الدلالي بين «بلا هموم» و«يهتم»، مع إبقاء اتساع عبارة «أمور الرب» وعدم تفسيرها تفسيرًا مذهبيًا.
