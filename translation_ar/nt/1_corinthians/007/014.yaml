reference: 1 Corinthians 7:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: ar
  text: لأن الزوج غير المؤمن قد تقدَّس في زوجته، والزوجة غير المؤمنة قد تقدَّست في الأخ[a]؛ وإلا فأولادكم نجسون، أما الآن فهم مقدَّسون[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي على الأرجح الزوج المؤمن؛ فالأصل اليوناني يقول «الأخ»، وهو تعبير يستعمله بولس عادةً عن المؤمن.
    reason: lexical_alternative
  - marker: b
    text: لا يلزم من «تقدَّس» و«مقدَّسون» هنا الخلاص الشخصي؛ فقد يشيران إلى وضع من الاختصاص أو التكريس في علاقة الزوج المؤمن وأسرته.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: قد تقدَّس / قد تقدَّست
  rationale: ينقل صيغة التام المبني للمجهول ونتيجتها المستمرة، ويحافظ على الصلة اللفظية مع «مقدَّسون» من غير أن يصرّح بأن المقصود خلاص شخصي.
- source_word: ἄπιστος
  choice: غير المؤمن
  rationale: يدل في سياق الزواج على الزوج أو الزوجة الذي لا يؤمن، لا على من يتصف بالخيانة أو عدم الأمانة.
- source_word: ἐν
  choice: في
  rationale: يحافظ على حرف الجر في الأصل وعلى ما فيه من سعة دلالية قد تشمل العلاقة أو الارتباط، بدل حصره في معنى سببي أو آلي واحد.
- source_word: ἀνήρ / γυνή
  choice: الزوج / الزوجة
  rationale: السياق المباشر سياق زواج، ولذلك فهذان اللفظان أدق من «الرجل» و«المرأة».
- source_word: ἀδελφῷ
  choice: الأخ
  rationale: يحافظ على لفظ الأصل غير المتناظر مع «الزوج»، مع شرح مرجعه المرجح في الحاشية.
- source_word: ἐπεὶ ἄρα
  choice: وإلا
  rationale: ينقل بوضوح النتيجة المقابلة المفترضة إذا لم تصح العبارة السابقة.
- source_word: ἀκάθαρτα
  choice: نجسون
  rationale: يحفظ دلالة النجاسة ذات الصدى الطقسي والعَهدي، بدل لفظ أعم مثل «غير طاهرين».
- source_word: νῦν δὲ
  choice: أما الآن
  rationale: يحافظ على المقابلة بين الحالة المفترضة والحالة الفعلية الحاضرة.
- source_word: ἅγια
  choice: مقدَّسون
  rationale: يحافظ على الصلة الجذرية والدلالية مع «تقدَّس»، ويعبّر عن حالة التكريس أو الاختصاص من غير تفسير زائد داخل المتن.
theological_decisions:
- issue: معنى تقديس الزوج غير المؤمن
  choice: إبقاء لغة التقديس كما هي، مع بيان أنها قد تدل هنا على وضع من الاختصاص أو التكريس في إطار الزواج والأسرة، ولا تستلزم بذاتها الخلاص الشخصي.
  alternative: تفسير العبارة في المتن بأنها خلاص تلقائي لغير المؤمن، أو قصرها على شرعية العلاقة الزوجية وحدها.
  rationale: حجة بولس تربط وضع الزوجين بوضع الأولاد، والنص لا يصرّح بتجدد غير المؤمن ولا يحصر المعنى في شرعية المعاشرة؛ لذلك تُحفظ مساحة الدلالة والتوتر اللاهوتي.
- issue: مرجع ἀδελφῷ
  choice: إبقاء «الأخ» في المتن وفهمه على الأرجح بوصفه الزوج المؤمن.
  alternative: استبداله في المتن بـ«الزوج المؤمن» أو «الزوج».
  rationale: الأصل يستعمل «الأخ» لا «الزوج» في العبارة الثانية. إبقاؤه يصون شفافية الترجمة، والحاشية توضح الاستعمال المسيحي المرجح عند بولس.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. حُفظت ألفاظ «تقدَّس»، «نجسون»، و«مقدَّسون» لصون الترابط المعجمي والتوتر اللاهوتي، كما أُبقي «الأخ» وفق صياغة الأصل مع إيضاحه في الحاشية.
