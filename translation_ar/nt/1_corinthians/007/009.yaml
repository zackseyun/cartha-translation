    text: 'أو ببساطة: «من أن يحترقوا». التعبير اليوناني ضمني أكثر، لكن السياق يرجّح أنه يشير إلى الاحتراق بالشهوة الجنسية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: يضبطون أنفسهم
  rationale: ينقل معنى ممارسة ضبط النفس، ولا سيما في السياق الجنسي، بعبارة عربية واضحة وطبيعية.
- source_word: γαμησάτωσαν
  choice: فليتزوجوا
  rationale: يحفظ صيغة الأمر للغائب الجمع وإرشاد بولس المباشر.
- source_word: κρεῖττον
  choice: خير
  rationale: مقابل عربي موجز وطبيعي لصيغة التفضيل الخبرية.
- source_word: γαμῆσαι
  choice: الزواج
  rationale: استخدام المصدر العربي يحقق الموازاة الطبيعية مع العبارة التالية.
- source_word: πυροῦσθαι
  choice: أن يحترقوا بالشهوة
  rationale: يحفظ استعارة الاحتراق، ويبيّن دلالتها الأرجح من سياق الزواج وضبط النفس، مع إثبات الصياغة الأشد حرفية في الحاشية.
- source_word: δὲ
  choice: ولكن
  rationale: ينقل الانتقال التقابلي المعتدل مع الكلام السابق.
theological_decisions:
- issue: دلالة πυροῦσθαι في السياق
  choice: الاحتراق بالشهوة
  alternative: الاحتراق، أو الاحتراق في الدينونة
  rationale: المقابلة المباشرة بين عدم ضبط النفس والزواج ترجّح الاشتعال بالرغبة الجنسية. ومع ذلك، تُحفظ الصياغة اليونانية الضمنية في الحاشية ولا تُطمس استعارة الاحتراق.
