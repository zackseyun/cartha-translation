base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: ar
  text: لذلك أرى أن هذا حسن بسبب الضيق الحاضر[a]، أي إن من الحسن للإنسان[b] أن يبقى على حاله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب الضرورة الحاضرة». وقد تُفهم أيضًا: «بسبب الأزمة الوشيكة».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «للإنسان»، ويمكن أن تُفهم بمعنى عام: «للشخص».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «أن يكون هكذا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: أرى
  rationale: ينقل حكم بولس الشخصي المدروس بصيغة طبيعية، من غير أن يحوّله إلى أمر مطلق.
- source_word: οὖν
  choice: إذًا
  rationale: يبين أن القول نتيجة لما سبقه، بأسلوب عربي واضح.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: أن هذا حسن
  rationale: يصوغ تركيب المصدر اليوناني صياغة عربية سليمة، ويحفظ معنى التقييم في καλόν دون جعله حكمًا أخلاقيًا مطلقًا.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: بسبب الضيق الحاضر
  rationale: تعبر «الضيق» عن ظرف ضاغط خارجي، و«الحاضر» يحفظ دلالة الحالة القائمة لا المستقبلية وحدها.
- source_word: ὅτι
  choice: أن
  rationale: تُفهم هنا على أنها تقدم مضمون رأي بولس، مع إبقاء احتمال العلاقة التفسيرية ظاهرًا من السياق.
- source_word: καλὸν
  choice: من الحسن
  rationale: يحفظ تكرار اللفظ التقييمي نفسه في الآية.
- source_word: ἀνθρώπῳ
  choice: للإنسان
  rationale: ἄνθρωπος قد يُستعمل استعمالًا عامًا؛ و«الإنسان» يحفظ المفرد العام طبيعيًا في العربية من غير حصر غير لازم في الذكر.
- source_word: τὸ οὕτως εἶναι
  choice: أن يبقى على حاله
  rationale: يوضح الإحالة السياقية لعبارة «أن يكون هكذا» إلى الاستمرار في الحالة القائمة، من غير تحديد تلك الحالة أكثر مما يتيحه النص.
theological_decisions:
- issue: طبيعة قول بولس
  choice: صياغته بوصفه رأيًا رعويًا مرتبطًا بالضيق الحاضر
  alternative: فهمه تفضيلًا دائمًا ومطلقًا لعدم الزواج
  rationale: يفيد «أرى» مع التعليل بـ«الضيق الحاضر» حكمًا ظرفيًا، ولا يصرح النص هنا بتحريم عام أو دائم للزواج.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «أرى» لإبراز طبيعة الحكم الشخصي المدروس، و«الضيق الحاضر» لحفظ ضغط الظرف القائم، مع توضيح البدائل المعجمية في الحواشي وعدم حسم طبيعة الأزمة أو الحالة المشار إليها بما يتجاوز النص.
