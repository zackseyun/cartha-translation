  naturalness: «لملازمة الرب» غير مألوفة في العربية المعاصرة وقد توحي بمرافقة الرب، لا بالتفرغ له. كما أن إعادة «لأجل» تُظهر بوضوح البناء الغائي المتوازي في العبارة.
  terminology: «شَرَكًا» يحافظ على صورة βρόχος القوية، وإن كان المقصود الأدق حبلًا/حلقةً للإمساك؛ وهو مقبول في هذا الموضع. «التفرغ للرب» عربي واضح ولا يضيف مفهوم «الخدمة» غير المذكور صراحة.
