  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: ar
  text: أقول هذا لمنفعتكم أنتم، لا لألقي عليكم شَرَكًا، بل لأجل ما هو لائق، ولأجل التفرغ للرب بلا تشتّت.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: منفعتكم
  rationale: ينقل معنى ما هو نافع وملائم لهم، مع إبراز ὑμῶν αὐτῶν بعبارة «لكم أنتم».
- source_word: βρόχον
  choice: شَرَكًا
  rationale: يحفظ الصورة القوية في اليونانية، وهي شَرَك أو حبل يصيد ويقيّد، بدل إضعافها إلى مجرد «تقييد» أو «إلزام».
- source_word: εὔσχημον
  choice: ما هو لائق
  rationale: تعبير عربي طبيعي ينقل معنى السلوك الحسن اللائق في السياق.
- source_word: εὐπάρεδρον
  choice: ملازمة
  rationale: تفيد الحضور الدائم والانصراف إلى الرب، من غير تحميل اللفظة معنى طقسيًا أو مؤسسيًا غير مصرّح به.
- source_word: ἀπερισπάστως
  choice: بلا تشتّت
  rationale: ينقل معنى عدم الانجذاب بعيدًا أو الانشغال بما يصرف عن ملازمة الرب.
theological_decisions:
- issue: طبيعة غرض بولس من الإرشاد السابق
  choice: «لا لألقي عليكم شَرَكًا»
  alternative: «لا لأفرض عليكم قيدًا»
  rationale: أُبقيت استعارة الشَّرَك الواردة في النص، لكي يظهر أن بولس ينفي إرادة الإيقاع بهم في إلزام خانق، من غير تحويل كلامه إلى حكم مذهبي بشأن الزواج أو العزوبة.
- issue: معنى التوجّه إلى الرب
  choice: «لملازمة الرب بلا تشتّت»
  alternative: «للتفرغ لخدمة الرب بلا تشتّت»
  rationale: «ملازمة» أقرب إلى دلالة εὐπάρεδρον، أما إضافة «خدمة» فتفسّر المقصود تفسيرًا ممكنًا لكنه غير مذكور صراحة في العبارة اليونانية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقّرة. حُفظ التوازي الغائي في «لما هو لائق، ولملازمة الرب»، وحُذفت أي أداة زمنية من قبيل «الآن» لعدم وجود مقابل صريح لها في المصدر.
