  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: ar
  text: فكيف تعرفين، أيتها الزوجة، هل ستخلّصين زوجكِ؟ أو كيف تعرف، أيها الزوج، هل ستخلّص زوجتكَ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بعبارة عربية أكثر سلاسة: «فكيف لكِ أن تعرفي... لعلّكِ تخلّصين...؟» وكذلك في الشطر الثاني. يستعمل النص اليوناني فعلًا في صيغة المستقبل («ستخلّصين/ستخلّص») داخل سؤال غير مباشر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: فكيف تعرفين / أو كيف تعرف
  rationale: تؤدي «كيف تعرف» معنى التعبير اليوناني الطبيعي في هذا السؤال البلاغي، وتحفظ الفاء قوة γάρ التعليلية والارتباط بما سبق.
- source_word: γύναι
  choice: أيتها الزوجة
  rationale: مع أن اللفظة قد تعني «امرأة» أو «زوجة»، فإن سياق الزواج يعيّن معنى «الزوجة»، وصيغة النداء العربية واضحة وكريمة.
- source_word: ἄνερ
  choice: أيها الزوج
  rationale: السياق الزوجي يعيّن معنى «الزوج» لا مجرد «الرجل».
- source_word: σώσεις
  choice: ستخلّصين / ستخلّص
  rationale: يحافظ الفعل المستقبل في العربية على صيغة المستقبل اليونانية، بينما تجعل «هل» الجملة سؤالًا غير مباشر عن الاحتمال لا تقريرًا مؤكدًا.
- source_word: τὸν ἄνδρα / τὴν γυναῖκα
  choice: زوجكِ / زوجتكَ
  rationale: الإضافة بالضمير هي الصياغة العربية الطبيعية التي تُظهر علاقة الزواج المقصودة من أداة التعريف والسياق.
- source_word: ἢ
  choice: أو
  rationale: تنقل أداة العطف الفاصلة بين السؤالين المتوازيين ببساطة ودقة.
theological_decisions:
- issue: معنى «يخلّص» في سياق الزواج
  choice: الإبقاء على «تخلّصين/تخلّص»
  alternative: تقودين/تقود إلى الإيمان؛ تحافظين/تحافظ على الزواج؛ تكونين/تكون سببًا في الخلاص
  rationale: للفعل σῴζω هنا دلالة خلاصية محتملة وقوية، ولا ينبغي تضييقه إلى الحفاظ على الزواج أو تفسير آليته داخل المتن. الإبقاء على لفظ «يخلّص» يصون التوتر اللاهوتي في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي التوازي بين مخاطبة الزوجة ومخاطبة الزوج، واستُعمل التشكيل الجزئي في الضمائر لتوضيح جنس المخاطَب. وُضع مؤشر الحاشية في نهاية الآية لأنه يشرح صيغة الفعل في الشطرين.
