base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: ar
  text: الختان لا شيء[a]، وعدم الختان لا شيء، بل حفظ وصايا الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا اعتبار له»؛ وكذلك في عبارة «عدم الختان لا شيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: الختان
  rationale: المقابل الاسمي العربي المألوف، ويحفظ تركيز العبارة على علامة الهوية لا على فعل إجرائها وحده.
- source_word: οὐδέν ἐστιν
  choice: لا شيء
  rationale: صياغة مباشرة تحفظ حدّة العبارة اليونانية وتكرار بنيتها، مع بيان البديل الدلالي الأوضح في الحاشية.
- source_word: ἀκροβυστία
  choice: عدم الختان
  rationale: تعبير واضح في العربية المعاصرة يحفظ التقابل البلاغي مع «الختان» دون استعمال لفظ قديم غامض.
- source_word: ἀλλά
  choice: بل
  rationale: تلائم الانتقال من نفي قيمة الحالتين إلى تقرير ما له الاعتبار في هذا السياق.
- source_word: τήρησις
  choice: حفظ
  rationale: يحافظ على الصيغة الاسمية وعلى الارتباط الطبيعي بلفظ «وصايا»، من غير تحويلها تفسيرياً إلى مفهوم أعمّ مثل الطاعة.
- source_word: ἐντολῶν θεοῦ
  choice: وصايا الله
  rationale: تركيب عربي طبيعي ودقيق يبقي الجمع الملموس «وصايا» وعلاقة الإضافة إلى الله.
theological_decisions:
- issue: تقويم بولس للختان وعدم الختان
  choice: تُبقي الترجمة كلا الحالتين «لا شيء» بالمقارنة مع حفظ وصايا الله ضمن حجة الآية.
  alternative: فهم العبارة على أنها تنفي كل دلالة أخلاقية للختان في جميع السياقات الممكنة.
  rationale: النص اليوناني ينفي الاعتبار عن الحالتين في هذا التقابل ثم يضع بإزائهما حفظ وصايا الله؛ لذلك لا توسّع الترجمة الحكم إلى استنتاجات لاهوتية تتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على التوازي والتكرار البلاغي في الأصل. استُعمل «عدم الختان» لوضوحه لدى القارئ العام، ووُضعت علامة الحاشية في المتن كما يلزم.
