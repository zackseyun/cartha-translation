base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: ar
  text: 'أَمَّا الْبَاقُونَ فَأَقُولُ لَهُمْ أَنَا، لَا الرَّبُّ: إِنْ كَانَ لِأَخٍ زَوْجَةٌ غَيْرُ مُؤْمِنَةٍ، وَهِيَ تَرْضَى أَنْ تَسْكُنَ مَعَهُ، فَلَا يُطَلِّقْهَا[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا يتركها» أو «فلا يصرفها». يمكن ترجمة الفعل اليوناني ترجمة أقرب إلى الحرفية بمعنى «يترك» أو «يصرف»، لكنه يشير هنا إلى إنهاء الزواج.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: أَمَّا الْبَاقُونَ فَأَقُولُ لَهُمْ
  rationale: تنقل العبارة الانتقال إلى الفئة الباقية التي لم يتناولها التوجيه السابق، وتأتي «أمّا» طبيعية في العربية لإبراز هذا الانتقال الخفيف.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: فَأَقُولُ لَهُمْ أَنَا، لَا الرَّبُّ
  rationale: أُبقي ضمير المتكلم المنفصل «أنا» لإظهار توكيد ἐγώ، مع الحفاظ على المقابلة الموجزة التي في اليونانية دون تفسيرها داخل النص.
- source_word: ἀδελφὸς
  choice: أَخٍ
  rationale: يحافظ على اللفظ الكنسي وعلى التحديد المذكر في هذا السياق، إذ يقابله ذكر الزوجة.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: لِأَخٍ زَوْجَةٌ غَيْرُ مُؤْمِنَةٍ
  rationale: صياغة عربية طبيعية تفيد العلاقة الزوجية، وتوضح أن ἄπιστος هنا تصف عدم الإيمان لا الخيانة الزوجية.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: وَهِيَ تَرْضَى
  rationale: «ترضى» تنقل الموافقة الإرادية التي يدل عليها συνευδοκέω بلغة عربية واضحة وغير قانونية أكثر من اللازم.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: أَنْ تَسْكُنَ مَعَهُ
  rationale: تنقل معنى استمرار المعيشة المنزلية المشتركة بعبارة عربية مألوفة.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: فَلَا يُطَلِّقْهَا
  rationale: في سياق الزواج يدل الفعل على ترك الزوجة أو صرفها بما ينهي الزواج؛ و«يطلّقها» توضح المقصود العملي، مع إثبات البدائل الحرفية في الحاشية.
theological_decisions:
- issue: قول بولس «أنا، لا الرب»
  choice: 'الإبقاء على العبارة كما هي: «أقول لهم أنا، لا الرب»'
  alternative: تفسيرها في المتن على أنها مجرد رأي شخصي، أو إضافة أنها لا تنفي السلطان الرسولي
  rationale: النص يميّز بين توجيه بولس وقول مباشر من الرب في المسألة، لكنه لا يصرّح هنا بتقويم سلطان هذا التوجيه. لذلك حُفظ التوتر اللاهوتي دون حسم تفسيري داخل الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت تراكيب مألوفة مثل «ترضى أن تسكن معه»، مع إبقاء التوكيد في «أنا، لا الرب» والغموض اللاهوتي الأصلي دون شرح مذهبي داخل المتن.
