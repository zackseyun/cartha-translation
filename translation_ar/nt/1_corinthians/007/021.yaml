  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: ar
  text: هل دُعيتَ وأنت عبد؟ فلا يزعجك ذلك. ولكن إن كنت تستطيع حقًّا أن تصير حرًّا، فاغتنم الفرصة بالأحرى[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل انتفع بحالتك الراهنة»، أي ابقَ كما أنت. يترك التعبير اليوناني مفعول «انتفع» غير مذكور، ولذلك فُهم على الوجهين.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: عبد
  rationale: يدلّ اللفظ هنا على شخص في حالة رقّ، لا على خادم عادي، كما يؤكده التقابل مع إمكان أن يصير حرًّا.
- source_word: ἐκλήθης
  choice: أَدُعيتَ
  rationale: يحافظ على صيغة الدعوة الإلهية المألوفة عند بولس من غير إضافة «من الله» أو «إلى الإيمان»، إذ ليستا مصرحًا بهما في العبارة.
- source_word: μή σοι μελέτω
  choice: لا يزعجك ذلك
  rationale: صياغة عربية طبيعية تنقل معنى القلق والانشغال الذي يفيده التعبير، وتحافظ على نبرته الرعوية.
- source_word: ἐλεύθερος γενέσθαι
  choice: أن تصير حرًّا
  rationale: ينقل مباشرة التحول في الوضع الاجتماعي من العبودية إلى الحرية.
- source_word: μᾶλλον χρῆσαι
  choice: فاغتنم الفرصة
  rationale: يفهم المفعول المحذوف على أنه فرصة نيل الحرية المذكورة في الشرط السابق، مع إثبات القراءة الأخرى ذات الشواهد التاريخية في الحاشية لأن اليونانية لا تصرّح بالمفعول.
theological_decisions:
- issue: غموض العبارة μᾶλλον χρῆσαι
  choice: الحث على اغتنام فرصة الحرية إن أمكنت
  alternative: الانتفاع بالحالة الراهنة، أي البقاء في العبودية
  rationale: السياق المباشر يجعل فرصة الحرية مفهومًا طبيعيًّا بوصفها مفعولًا محذوفًا، لكن التركيب اليوناني يتركه غير مذكور، لذلك لا تُطمس القراءة البديلة بل تُحفظ في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «عبد» لإظهار حالة الرق، وصيغ السؤال على نحو طبيعي يحفظ كون الدعوة وقعت والشخص في تلك الحالة.
