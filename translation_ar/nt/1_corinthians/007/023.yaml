  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: ar
  text: قد اشتُريتم بثمن؛ فلا تصيروا عبيدًا للبشر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: بثمن
  rationale: المضاف إليه مع فعل الشراء يدل على الثمن أو الكلفة. وتؤدي «بثمن» المعنى بإيجاز وطبيعية، من غير تحديد مقدار الثمن.
- source_word: ἠγοράσθητε
  choice: اشتُريتم
  rationale: فعل ماضٍ مبني للمجهول للمخاطبين جمعًا؛ ويحفظ تشبيه الشراء وما فيه من معنى انتقال الملكية.
- source_word: μὴ γίνεσθε
  choice: فلا تصيروا
  rationale: يحفظ معنى γίνομαι الدال على الصيرورة، بدل تحويله إلى مجرد نهي عن حالة ثابتة.
- source_word: δοῦλοι
  choice: عبيدًا
  rationale: السياق قائم على الشراء والملكية والولاء، لذلك تنقل «عبيدًا» قوة اللفظ أدق من «خدمًا».
- source_word: ἀνθρώπων
  choice: للبشر
  rationale: يدل اللفظ هنا على الناس عمومًا في مقابل السيد الإلهي، لا على الذكور وحدهم؛ و«للبشر» عربية واضحة وتحفظ هذه المقابلة.
theological_decisions:
- issue: دلالة عبارة δοῦλοι ἀνθρώπων في سياق الشراء والولاء
  choice: عبيدًا للبشر
  alternative: خدمًا للناس
  rationale: يحفظ الاختيار صورة الملكية والخضوع التي تربط شطري الآية، من غير حصر ἀνθρώπων في الرجال أو إضافة تفسير يحدد نوع الخضوع المقصود.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية كريمة. لم تُضف حاشية لأن «البشر» تنقل الدلالة التمثيلية الشاملة للفظ اليوناني مباشرة، ولا يوجد في النص العربي بديل ملتبس يحتاج إلى توضيح.
