base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: ar
  text: أأنتَ مرتبطٌ بزوجة؟ فلا تطلب حَلَّ هذا الارتباط. أأنتَ في حِلٍّ من زوجة؟ فلا تطلب زوجة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδεσαι
  choice: أأنتَ مرتبطٌ
  rationale: يحفظ صورة الربط في صيغة التام، ويمهّد للمقابلة مع λύσιν وλέλυσαι، بدل تفسيرها مباشرةً بمعنى «متزوج».
- source_word: γυναικί
  choice: بزوجة
  rationale: γυνή في هذا السياق الزوجي تعني «زوجة»، والباء تلائم تركيب «مرتبط بزوجة».
- source_word: ζήτει
  choice: تطلب
  rationale: ينقل معنى ζητέω وصيغة النهي بعبارة عربية طبيعية ومباشرة.
- source_word: λύσιν
  choice: الانفكاك
  rationale: يحفظ صورة فكّ الرباط والارتباط الاشتقاقي الدلالي مع λέλυσαι، من غير حصر المعنى في الطلاق.
- source_word: λέλυσαι
  choice: أأنتَ منفكٌّ
  rationale: يحفظ صيغة التام وصورة الحلّ المقابلة للربط، ولا يحسم وحده أكان المقصود طلاقًا أم ترمّلًا أم حالة أخرى من عدم الارتباط.
- source_word: ἀπὸ γυναικός
  choice: من زوجة
  rationale: ينقل ἀπό بمعنى «من»، ويفهم γυνή زوجةً بحسب السياق.
- source_word: γυναῖκα
  choice: زوجة
  rationale: السياق سياق زواج، ولذلك «زوجة» أدق من «امرأة».
theological_decisions:
- issue: هل تُستعمل ألفاظ الزواج والطلاق الصريحة، أم تُحفظ صورة الربط والفك في اليونانية؟
  choice: الإبقاء على صورة الارتباط والانفكاك في المتن.
  alternative: «أأنت متزوج؟ فلا تطلب الطلاق. أأنت مطلّق؟ فلا تطلب زوجة.»
  rationale: النص اليوناني يستعمل لغة الربط والحل، لا ألفاظًا صريحة خاصة بالزواج والطلاق. وحفظ الصورة يصون سعة العبارة ولا يضيّقها إلى فئة قانونية واحدة.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُعمل «الانفكاك» للمحافظة على تقابل الربط والحل، مع شرح القراءة التفسيرية في الحاشية.
