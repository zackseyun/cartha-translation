  verdict: revise
  source_fidelity: ينقل المتن مقابلة اليونانية المقصودة بين الارتباط (δέδεσαι) والحل/الانفكاك (λύσις، λέλυσαι)، ويحافظ على عدم تحويلها في المتن إلى ألفاظ الزواج والطلاق الصريحة. لكن «الانفكاك» و«منفكّ» أقل سلاسة في العربية المعاصرة الواضحة، ولا سيما في صيغة السؤال الثانية.
