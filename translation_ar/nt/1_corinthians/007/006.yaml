id: 1CO.7.6
reference: 1 Corinthians 7:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: ar
  text: لكني أقول هذا على سبيل السماح[a]، لا على سبيل الأمر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على سبيل الإذن» أو «من باب السماح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: اسم الإشارة يحيل إلى القول ذي الصلة المباشرة في السياق، وتبقى «هذا» طبيعية من غير أن تحسم هل الإحالة إلى ما سبق أو ما يأتي.
- source_word: δὲ
  choice: لكنني
  rationale: تفيد δέ انتقالًا مع تباين خفيف، فتنقل «لكن» المقابلة بين السماح والأمر، وأُلحقت بها نون الوقاية والضمير لتلائم العربية.
- source_word: λέγω
  choice: أقول
  rationale: مضارع عربي مباشر وطبيعي يقابل المضارع الخبري اليوناني.
- source_word: κατὰ συγγνώμην
  choice: على سبيل السماح
  rationale: تعبير عربي واضح يدل على إتاحة الأمر لا إلزامه، ويحافظ على المقابلة مع «على سبيل الأمر».
- source_word: συγγνώμην
  choice: السماح
  rationale: تدل الكلمة هنا على الإذن أو الإفساح، لا على الغفران؛ و«السماح» مفهوم في السياق بوصفه مقابلًا للأمر الملزم.
- source_word: οὐ
  choice: لا
  rationale: أداة النفي العربية المناسبة في هذه المقابلة.
- source_word: κατ’ ἐπιταγήν
  choice: على سبيل الأمر
  rationale: ينقل معنى التوجيه السلطوي الملزم، مع موازاة أسلوبية لعبارة «على سبيل السماح».
- source_word: ἐπιταγήν
  choice: الأمر
  rationale: لفظ مباشر ومألوف يدل على التكليف السلطوي، من غير إضافة تفسير مذهبي.
theological_decisions:
- issue: هل يصوغ بولس قوله بوصفه سماحًا شخصيًا أم أمرًا إلهيًا بدرجة أدنى؟
  choice: يصف بولس هذا القول صراحة بأنه سماح لا أمر ملزم.
  alternative: قد يُفهم القول على أنه مشورة تظل ذات سلطة رسولية غير مباشرة.
  rationale: يقيم النص نفسه مقابلة واضحة بين السماح والأمر؛ لذلك تحفظ الترجمة هذه المقابلة من غير أن تنتقص من دور بولس الرسولي أو تحسم مدى سلطة المشورة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت الموازاة «على سبيل... لا على سبيل...» لإبراز بنية المقابلة اليونانية مع الحفاظ على طبيعية العبارة.
