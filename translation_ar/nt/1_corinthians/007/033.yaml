  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: ar
  text: أَمَّا الْمُتَزَوِّجُ فَيَهْتَمُّ بِأُمُورِ الْعَالَمِ[a]، كَيْفَ يُرْضِي زَوْجَتَهُ،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شؤون العالم» أو «ما يخص العالم».'
    reason: بدائل معجمية للتعبير τὰ τοῦ κόσμου.
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: أَمَّا الْمُتَزَوِّجُ
  rationale: اسم الفاعل المعرَّف مستعمل استعمال الاسم، ويشير في السياق إلى الرجل المتزوج في مقابل غير المتزوج. وهذه الصياغة عربية طبيعية وتحفظ دلالة المذكر المفرد.
- source_word: μεριμνᾷ
  choice: فَيَهْتَمُّ
  rationale: يمكن أن يدل الفعل على القلق أو الاهتمام أو الانشغال. والسياق يصف عناية المتزوج بمسؤوليات الحياة، من غير أن يقرر بالضرورة أنها قلق خاطئ، لذلك «يهتم» يحفظ هذا الاتساع الدلالي.
- source_word: τὰ τοῦ κόσμου
  choice: بِأُمُورِ الْعَالَمِ
  rationale: يشير التركيب إلى ما يخص الحياة في العالم وشؤونها العملية. و«أمور العالم» واضحة وطبيعية، ولا تضيف حكمًا أخلاقيًا سلبيًا غير لازم.
- source_word: πῶς ἀρέσῃ
  choice: كَيْفَ يُرْضِي
  rationale: تبيّن العبارة مضمون اهتمامه، أي كيفية إرضاء زوجته. وتحفظ «كيف يرضي» صيغة الاستفهام غير المباشر ودلالة الفعل الاحتمالية في السياق.
- source_word: τῇ γυναικί
  choice: زَوْجَتَهُ
  rationale: تعني γυνή هنا «زوجة» بوضوح بسبب السياق الزوجي، والضمير في العربية يعبّر طبيعيًا عن العلاقة المفهومة ضمنًا في اليونانية.
theological_decisions:
- issue: هل يحمل κόσμος هنا معنى أخلاقيًا سلبيًا؟
  choice: 'تُرجم ترجمة محايدة: «العالم» و«أمور العالم».'
  alternative: «الأمور الدنيوية» بمعنى قد يُفهم منه الذم.
  rationale: المقابلة في السياق تتناول التزامات الحياة الزوجية وانقسام الاهتمام، لا إدانة الزواج أو المسؤوليات العادية. وتحفظ الصياغة المحايدة التوتر في النص من دون إدخال نزعة زهدية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «أما» لإبراز المقابلة التي تؤديها δέ في السياق، وحُفظت الجملة مفتوحة بفاصلة لأنها تتصل بما يلي في المقطع.
