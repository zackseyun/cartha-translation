base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: ar
  text: فإذًا، مَن يُزوِّج عذراءه[a] يفعل حسنًا، ومَن لا يُزوِّجها سيفعل ما هو أفضل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن يتزوّج عذراءه المخطوبة يفعل حسنًا، ومَن لا يتزوّجها سيفعل ما هو أفضل». ومن التفسيرات الشائعة أيضًا أن المقصود «ابنته العذراء». غير أن الفعل اليوناني هنا يعني، على نحو أرجح، «يُزوِّج»، لذلك حافظ المتن على هذا المعنى من غير أن يحدّد طبيعة العلاقة تحديدًا أدق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: فإذًا
  rationale: تفيد استخلاص نتيجة مما سبق، وتحافظ على القوة الاستنتاجية بأسلوب عربي واضح.
- source_word: γαμίζων
  choice: يُزوِّج
  rationale: الفعل اليوناني ذو معنى سببي في الأصل، أي «يعطي للزواج/يُزوِّج»، لا مجرد «يتزوّج»؛ لذا حُفظ هذا المعنى من غير تحديد هوية العذراء.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: عذراءه
  rationale: تحافظ العبارة الموجزة على معنى παρθένος وعلى علاقة الإضافة التي تفيدها ἑαυτοῦ، من غير حسم ما إذا كانت العذراء ابنة أو من تحت ولايته أو مخطوبة له وفق تفسير بديل.
- source_word: καλῶς ποιεῖ
  choice: يفعل حسنًا
  rationale: تعبير عربي طبيعي ينقل التقويم الإيجابي من غير تحويله إلى حكم مطلق.
- source_word: μὴ γαμίζων
  choice: لا يُزوِّجها
  rationale: يحافظ على المعنى السببي نفسه، والضمير يعود إلى العذراء المذكورة في الشطر الأول.
- source_word: κρεῖσσον ποιήσει
  choice: سيفعل أفضل
  rationale: ينقل صيغة التفضيل المقارنة، لا معنى صيغة التفضيل المطلقة.
theological_decisions:
- issue: هوية «عذراءه» ودلالة γαμίζω في 1 كورنثوس 7:38
  choice: أُبقي الفعل في معناه السببي «يُزوِّج»، وأُبقيت هوية العذراء غير محددة في المتن.
  alternative: 'يمكن فهم العبارة بمعنى: «مَن يتزوّج عذراءه المخطوبة»، أو بتحديد العذراء على أنها ابنته.'
  rationale: الفعل γαμίζω يرجّح معنى «يُزوِّج»، لكن هوية العذراء وعلاقتها بالرجل موضع خلاف في تفسير 1 كورنثوس 7:36–38. لذلك لا يفرض المتن تصورًا اجتماعيًا أخص مما يدل عليه اليوناني مباشرة، وتُذكر القراءات الأساسية في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «عذراءه» على إيجازها للحفاظ على الغموض الحقيقي في العبارة اليونانية، مع شرح القراءات المحتملة في الحاشية.
