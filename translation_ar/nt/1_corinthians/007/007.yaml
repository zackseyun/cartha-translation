source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: ar
  text: 'لكني أود أن يكون جميع الناس مثلي أنا. غير أن لكل واحد هبته الخاصة من الله: هذا هكذا، وذاك هكذا.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: أود
  rationale: ينقل معنى الرغبة في السياق من غير أن يوحي بأمر أو إلزام.
- source_word: πάντας ἀνθρώπους
  choice: جميع الناس
  rationale: اللفظ اليوناني ἀνθρώπους عام للبشر هنا، والترجمة العربية الطبيعية الشاملة هي «الناس».
- source_word: χάρισμα
  choice: هبة
  rationale: يحفظ معنى العطية الممنوحة بالنعمة من الله، مع تعبير عربي واضح ومألوف.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: هذا هكذا، وذاك هكذا
  rationale: يحافظ على الصياغة المقتضبة والمفتوحة في الأصل، من غير تحديد نوعي الهبتين بما يتجاوز النص.
theological_decisions:
- issue: طبيعة الحالة التي يتمنى بولس أن يكون الجميع عليها
  choice: مثلي أنا
  alternative: غير متزوجين مثلي
  rationale: الأصل يكتفي بالمقارنة ولا يصرح هنا بتفسيرها؛ إبقاء العبارة على عمومها يصون إحالتها السياقية من غير إدخال شرح في المتن.
- issue: تنوع الهبات الإلهية
  choice: هذا هكذا، وذاك هكذا
  alternative: لأحدهم هبة، ولآخر هبة مختلفة
  rationale: يحفظ التوازي والغموض المقصودين في اليونانية، ولا يحصر الهبة في الزواج أو العزوبة تصريحًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «غير أن» لإبراز المقابلة، وحُفظ الإيجاز والتوتر بين رغبة بولس وتنوع هبات الله.
