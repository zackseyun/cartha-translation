  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: ar
  text: أمّا المتزوّجون فآمرهم—لا أنا، بل الرب—ألا تفارق الزوجة زوجها[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألا تطلّق زوجها». يمكن أن يدل الفعل اليوناني على المفارقة الزوجية، وقد يشمل الطلاق في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: أمّا المتزوّجون
  rationale: يفيد اسم الفاعل التامّ الذين هم في حالة زواج، وتُظهر «أمّا» انتقال δέ إلى توجيه متعلق بهم من غير إضافة معنى زمني.
- source_word: παραγγέλλω
  choice: فأوصيهم
  rationale: تنقل معنى التوجيه الملزم ذي السلطة بلغة عربية طبيعية، من غير أن تُضعف قوة الأمر.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: لا أنا، بل الرب
  rationale: تحفظ المقابلة المؤكدة في اليونانية من غير أن تفسرها داخل المتن أو توحي بنفي سلطة بولس الرسولية.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: الزوجة زوجها
  rationale: السياق الزوجي يحدد معنى γυνή وἀνήρ بأنه «زوجة» و«زوج»، والضمير يجعل العلاقة طبيعية وواضحة بالعربية.
- source_word: μὴ χωρισθῆναι
  choice: ألا تفارق
  rationale: الفعل اليوناني هنا يدل على الانفصال الزوجي، وقد يشمل الطلاق بحسب السياق؛ و«تفارق» تحفظ هذا الاتساع أفضل من حصره في الإجراء القانوني للطلاق.
theological_decisions:
- issue: معنى «لا أنا، بل الرب»
  choice: الإبقاء على المقابلة كما هي في النص
  alternative: تفسيرها بأن بولس ينفي السلطة عن كلامه
  rationale: تميز العبارة بين وصية منسوبة إلى تعليم الرب وبين معالجة بولس اللاحقة، لكن الترجمة لا تحسم تفسير طبيعة السلطة أو الوحي بإضافة غير موجودة.
- issue: مدى معنى χωρισθῆναι في الزواج
  choice: تفارق
  alternative: تطلّق
  rationale: «تفارق» تبقي المجال مفتوحًا للانفصال الذي قد يتضمن الطلاق، وتحفظ التوتر الدلالي الذي يتضح أكثر في الآية التالية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل تركيب «أمّا... فـ» لتجسيد الانتقال الخطابي الذي تؤديه δέ، مع إبقاء الشرطة الختامية لأن الجملة تتواصل في الآية التالية.
