revisions:
- from: على أن يسلك كلُّ واحد بحسب ما قسم له الرب، وبحسب الحال التي دعاه الله فيها.[a] وهكذا أوصي في الكنائس كلها.
  to: 'غير أن: كما قسم الرب لكل واحد، وكما دعا الله كل واحد، فليسلك هكذا. وهكذا أوجّه في جميع الكنائس.'
  rationale: أعيدت البنية المتوازية للنص اليوناني وتكرار «كل واحد» من دون إدخال «الحال» التي يستنتجها القارئ من السياق. وحُفظت استعارة السلوك، ودلالة «وهكذا» في الموضعين، والتمييز بين لقبي «الرب» و«الله». لا تستلزم الصياغة المباشرة حاشية معجمية.
