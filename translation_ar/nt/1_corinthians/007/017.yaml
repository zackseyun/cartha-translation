  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: ar
  text: 'غير أن: كما قسم الرب لكل واحد، وكما دعا الله كل واحد، فليسلك هكذا. وهكذا أوجّه في جميع الكنائس.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ μὴ
  choice: على أن
  rationale: تؤدي هنا وظيفة انتقالية استدراكية تضع المبدأ الضابط بعد الحالات السابقة، ولا تُفهم شرطًا حرفيًا بمعنى «إن لم».
- source_word: ἑκάστῳ / ἕκαστον
  choice: كلُّ واحد
  rationale: يحفظ التوزيع الفردي الذي يؤكده تكرار اللفظة اليونانية، مع صياغة عربية طبيعية.
- source_word: ἐμέρισεν
  choice: قسم له
  rationale: ينقل معنى ما وزعه الرب أو جعله نصيبًا لكل شخص، ويحافظ على صورة القسمة في الفعل اليوناني.
- source_word: ὁ κύριος
  choice: الرب
  rationale: المقابل العربي المألوف للقب κύριος في هذا السياق البولسي.
- source_word: κέκληκεν
  choice: دعاه
  rationale: ينقل معنى الدعوة الإلهية؛ والسياق العربي يعبّر طبيعيًا بالماضي عن الفعل التام ذي الأثر المستمر.
- source_word: οὕτως περιπατείτω
  choice: يسلك ... بحسب
  rationale: يحفظ استعارة «السلوك» الكتابية الدالة على نهج الحياة، ويصلها طبيعيًا بالمقياسين السابقين.
- source_word: διατάσσομαι
  choice: أوصي
  rationale: يفيد توجيهًا رسوليًا ملزمًا دون الإيحاء بقسوة زائدة قد تحملها «آمر» في العربية المعاصرة.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: في الكنائس كلها
  rationale: صياغة واضحة تحافظ على شمول الجماعات الكنسية جميعًا.
theological_decisions:
- issue: التمييز بين «الرب» و«الله»
  choice: 'الإبقاء على اللقبين متميزين: «قسم له الرب ... دعاه الله»'
  alternative: اعتبارهما تنويعًا أسلوبيًا لمرجع إلهي واحد ودمجهما في الصياغة
  rationale: النص اليوناني يضع اللقبين في عبارتين متوازيتين، فلا ينبغي للترجمة أن تزيل هذا التمييز أو تحسم دلالته.
- issue: صلة الدعوة بالحال الحياتية
  choice: «بحسب الحال التي دعاه الله فيها» مع حاشية تبين إمكان الصياغة الأقرب لفظيًا
  alternative: «كما دعا الله كلَّ واحد»
  rationale: الصياغة المختارة توضّح الصلة السياقية بين الدعوة والوضع الذي يعيش فيه الشخص، مع عدم إخفاء أن اليونانية أوجز وأبقى نحويًا على التوازي.
- issue: استعارة περιπατείτω
  choice: الحفاظ على الاستعارة بلفظ «يسلك»
  alternative: «يَعِش» أو «يسِر في حياته»
  rationale: «السلوك» تعبير عربي كتابي مفهوم يدل على نمط الحياة، ويحفظ الصورة دون تضييق معناها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «على أن» انتقالًا استدراكيًا، وحُفظت استعارة السلوك والتمييز بين «الرب» و«الله». وُضعت علامة الحاشية [a] في المتن كما يلزم.
