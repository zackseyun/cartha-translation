  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: ar
  text: ولكن إن انفصلت[a]، فلتبقَ غير متزوجة، أو فلتتصالح مع زوجها؛ وعلى الزوج ألّا يطلّق زوجته[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولكن حتى إن انفصلت». قد تحمل العبارة اليونانية هنا معنى تنازليًا خفيفًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو بصورة أقرب إلى اللفظ: «ألّا يصرف زوجته». يدل الفعل في أصله على الإرسال أو الصرف، لكنه يُستعمل في هذا السياق الزوجي للدلالة على الطلاق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: ولكن إن
  rationale: تنقل أداة الاستدراك والشرط بوضوح، مع إبقاء النبرة التنازلية المحتملة في الحاشية بدل فرضها في المتن.
- source_word: χωρισθῇ
  choice: انفصلت
  rationale: الفعل يدل هنا على الانفصال بين الزوجين، وهذه الصياغة لا تحسم هل المقصود طلاق قانوني ولا تنسب الفعل صراحة إلى طرف آخر.
- source_word: μενέτω
  choice: فلتبقَ
  rationale: تحافظ على قوة الأمر ومعنى الاستمرار في الحالة المذكورة.
- source_word: ἄγαμος
  choice: غير متزوجة
  rationale: تعبير عربي واضح ودقيق عن الحالة الزوجية، ويوافق كون المخاطَب عنها امرأة في السياق.
- source_word: καταλλαγήτω
  choice: فلتتصالح
  rationale: ينقل معنى المصالحة واستعادة العلاقة، وصيغة «تتصالح مع» هي التعبير العربي الطبيعي هنا.
- source_word: τῷ ἀνδρί
  choice: مع زوجها
  rationale: السياق الزوجي يحدد معنى ἀνήρ بأنه الزوج، والضمير لازم للوضوح والطبيعية في العربية.
- source_word: ἄνδρα
  choice: الزوج
  rationale: المقصود الزوج على وجه العموم، والتعريف الجنسي في العربية يؤدي هذا المعنى طبيعيًا.
- source_word: γυναῖκα
  choice: زوجته
  rationale: السياق يحدد معنى γυνή بأنه الزوجة، والضمير يبين العلاقة الزوجية في العربية.
- source_word: μὴ ἀφιέναι
  choice: ألّا يطلّق
  rationale: ينقل النهي بوضوح، ويدل ἀφίημι في هذا السياق الزوجي على تطليق الزوجة أو صرفها، مع إثبات البديل الحرفي في الحاشية.
theological_decisions:
- issue: هل يُترجم χωρισθῇ وἀφιέναι بالمصطلح نفسه؟
  choice: ترجمة χωρισθῇ بـ«انفصلت» وἀφιέναι بـ«يطلّق»
  alternative: ترجمة الفعلين كليهما بـ«يطلّق»، أو كليهما بلفظ عام يدل على الانفصال أو الترك
  rationale: استعمل بولس فعلين مختلفين؛ والمحافظة على هذا الفرق تمنع مساواة الانفصال بالطلاق القانوني من غير سند كافٍ، مع إظهار الدلالة الزوجية الأقوى للفعل ἀφιέναι في هذا الموضع.
- issue: كيفية تمثيل صيغة المبني للمجهول في καταλλαγήτω
  choice: فلتتصالح مع زوجها
  alternative: فلتُصالَح مع زوجها
  rationale: الصيغة الحرفية المبنية للمجهول ثقيلة وغير مألوفة في العربية، بينما «تتصالح مع» تنقل المصالحة العلائقية من غير أن تحدد وحدها الطرف المبادر أو تلغي التوتر القائم في النص.
- issue: إظهار الفاعل المؤنث المفهوم من السياق
  choice: 'استخدام صيغ الأفعال والصفة المؤنثة: «انفصلت… غير متزوجة… فلتتصالح»'
  alternative: تكرار الاسم «الزوجة» صراحة
  rationale: العربية تُظهر التأنيث في الصيغة نفسها، والسياق السابق يعيّن الزوجة؛ لذلك لا حاجة إلى إضافة اسم غير موجود في هذه الجملة اليونانية.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ورصينة. استُخدم «انفصلت» للمحافظة على الفرق بين الانفصال والطلاق، ووُضعت علامة الحاشية [b] بعد «زوجته» لأنها تتعلق بالفعل «يطلّق»، لا بعبارة «غير متزوجة».
