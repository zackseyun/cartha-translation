id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: ar
  text: أيها الإخوة[b]، ليبقَ كلُّ واحد أمام الله[a] في الحال التي دُعي فيها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مع الله»، أو «في حضرة الله».'
    reason: lexical_alternative
  - marker: b
    text: لفظ «الإخوة» هنا موجَّه إلى الجماعة كلها، ويشمل النساء أيضًا.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: كلُّ واحد
  rationale: يحفظ الدلالة التوزيعية للمفرد ويوضح أن الوصية تنطبق على كل فرد.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: في الحال التي ... فيها
  rationale: يشير التركيب إلى الحال أو الوضع الذي كان فيه الشخص حين دُعي، وهو ما يلائم سياق الأوضاع الاجتماعية في الفقرة.
- source_word: ἐκλήθη
  choice: دُعي
  rationale: يحفظ صيغة المبني للمجهول من غير إضافة «من الله»، مع أن السياق البولسي يرجّح أن الله هو الداعي.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: صيغة نداء عربية طبيعية تحفظ المذكر الجمع في الأصل، مع بيان شمول الخطاب للنساء في الحاشية.
- source_word: μενέτω
  choice: ليبقَ
  rationale: ينقل فعل الأمر الدال على الاستمرار في الحال القائمة، ويتسق مع تكرار الفكرة في هذا السياق.
- source_word: παρὰ θεῷ
  choice: أمام الله
  rationale: ينقل معنى الحضور والعلاقة أمام الله نقلاً عربيًا طبيعيًا؛ ويظل معنى «مع الله» ممكنًا بسبب إيجاز العبارة اليونانية، ولذلك أُثبت في الحاشية.
theological_decisions:
- issue: هل يُصرَّح بفاعلية الله في «دُعي»؟
  choice: الإبقاء على المبني للمجهول «دُعي» من غير إضافة الفاعل
  alternative: «دعاه الله» أو «دُعي من الله»
  rationale: السياق يرجّح الدعوة الإلهية، لكن النص اليوناني لا يذكر الفاعل صراحة، فحُفظ الإضمار.
- issue: دلالة ἀδελφοί في خطاب جماعة تضم رجالًا ونساءً
  choice: «أيها الإخوة» مع حاشية توضيحية
  alternative: «أيها الإخوة والأخوات»
  rationale: يحفظ المتن الصيغة النحوية في الأصل، بينما تمنع الحاشية إساءة فهم نطاق الخطاب.
- issue: دلالة παρὰ θεῷ
  choice: «أمام الله»
  alternative: «مع الله» أو «في حضرة الله»
  rationale: العبارة تحتمل القرب أو العلاقة والحضور أمام الله؛ اختير التعبير العربي الطبيعي من غير إلغاء البدائل الدلالية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. وُضع النداء أولًا على نحو طبيعي، وحُفظت بنية الأمر الفردي والمبني للمجهول، مع إظهار البدائل الحقيقية لعبارة παρὰ θεῷ في الحاشية.
