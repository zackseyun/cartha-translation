  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: ar
  text: ولكن حتى إن تزوَّجتَ، فلا تكون قد أخطأتَ؛ وإن تزوَّجت العذراء، فلا تكون قد أخطأت. غير أن أمثال هؤلاء سيلاقون ضيقًا في الجسد[a]، وأنا أُشفق عليكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: سيلاقون شدة أو مشقة في حياتهم الجسدية أو الأرضية. ولا تشير العبارة هنا بالضرورة إلى «الطبيعة الخاطئة».'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن ترجمتها: «وأنا أعفيكم» أو «وأنا أريد أن أُجنّبكم ذلك». يوضح بولس دافعه الرعوي إلى تحذيرهم من هذا الضيق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: تزوَّجتَ
  rationale: صيغة الشرط مع ἐάν تفيد احتمالًا مستقبلًا؛ والماضي العربي بعد «إن» تعبير فصيح طبيعي عن الشرط، مع إبقاء المخاطب مذكرًا كما في اليونانية.
- source_word: ἥμαρτες
  choice: فلا تكون قد أخطأتَ
  rationale: ينفي أن يكون الزواج خطيئة؛ و«تكون قد أخطأت» تنقل الحكم الأخلاقي الناتج عن الفعل، لا مجرد وقوع فعل في الماضي.
- source_word: ἡ παρθένος
  choice: العذراء
  rationale: يحافظ على المعنى المباشر لـ παρθένος وعلى أداة التعريف، من غير تعميمه إلى «غير المتزوجة» أو تخصيصه بـ«المخطوبة».
- source_word: γήμῃ
  choice: تزوَّجت
  rationale: يحافظ على التوازي مع فعل الزواج في الجملة الأولى وعلى القوة الشرطية.
- source_word: θλῖψιν
  choice: ضيقًا
  rationale: «الضيق» يقابل الضغط والشدة في θλῖψις، وهو واضح في العربية ولا يحصر العبارة في معنى أخروي اصطلاحي.
- source_word: τῇ σαρκὶ
  choice: في الجسد
  rationale: ترجمة قريبة من اللفظ تحفظ الإشارة إلى الحياة المتجسدة أو الأحوال الأرضية، ولا تستورد معنى «الطبيعة الخاطئة».
- source_word: οἱ τοιοῦτοι
  choice: أمثال هؤلاء
  rationale: تعبير عربي طبيعي يحفظ الإحالة العامة إلى من يتزوجون من غير تضييق زائد.
- source_word: φείδομαι
  choice: أُشفق عليكم
  rationale: يفيد الفعل اليوناني الرفق بشخص وتجنيبه المشقة. «أشفق عليكم» تنقل الدافع الرعوي بصورة طبيعية، مع إثبات البدائل الأقرب إلى المبنى في الحاشية.
theological_decisions:
- issue: معنى σάρξ في τῇ σαρκί
  choice: «في الجسد» بمعنى ضمن الحياة الجسدية أو الظروف الأرضية
  alternative: «في هذه الحياة» أو تفسيره بأنه «الطبيعة الخاطئة»
  rationale: السياق تحذير من مشقات تصيب المتزوجين، لا تقرير عن فساد الطبيعة البشرية. أُبقي لفظ «الجسد» في المتن للحفاظ على صياغة بولس، وتوضح الحاشية مجاله الدلالي من غير حسم زائد.
- issue: قوة φείδομαι الرعوية
  choice: «أُشفق عليكم»
  alternative: «أعفيكم» أو «أريد أن أُجنّبكم ذلك»
  rationale: العبارة تحتمل تقرير الرفق بهم أو بيان إرادة تجنيبهم الضيق. اختير تعبير عربي طبيعي، مع حفظ البدائل في الحاشية بدل تحويل الاحتمال إلى مقصد صريح حصري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الماضي بعد أداة الشرط على النمط العربي الطبيعي، وحُفظ لفظا «العذراء» و«الجسد» لقربهما من النص اليوناني. وُضعت علامتا الحاشيتين عند العبارتين اللتين تحتاجان إلى بيان دلالي.
