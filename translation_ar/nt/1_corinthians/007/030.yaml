lexical_decisions:
- source_word: κλαίοντες
  choice: الباكون
  rationale: 'اسم الفاعل المعرّف يؤدي وظيفة اسمية: «الذين يبكون». وصيغة «الباكون» موجزة وواضحة وتحافظ على توازي العبارات.'
- source_word: ὡς μὴ κλαίοντες
  choice: كأنهم غير باكين
  rationale: ينقل تركيب ὡς مع μή واسم الفاعل هيئة العيش أو الموقف، لا إنكار وقوع البكاء، ويحافظ على الصياغة المكثفة والتوازي البلاغي.
- source_word: χαίροντες
  choice: الفرحون
  rationale: ينقل معنى الفرح والابتهاج بصيغة اسم الفاعل، ويقابل «الباكون» في تركيب عربي متوازٍ.
- source_word: ὡς μὴ χαίροντες
  choice: كأنهم غير فرحين
  rationale: يحافظ على البناء نفسه الوارد في العبارة السابقة وعلى دلالة الموقف من الفرح، لا نفي حدوثه.
- source_word: ἀγοράζοντες
  choice: الذين يشترون
  rationale: تعبير عربي طبيعي ومباشر عن ممارسة الشراء، واستعمال الاسم الموصول هنا أوضح من «المشترون» في السياق الجاري.
- source_word: κατέχοντες
  choice: مالكين
  rationale: يفيد κατέχω هنا الإمساك بالشيء على أنه حيازة ثابتة أو مُلك، في مقابل فعل الشراء؛ و«مالكين» ينقل هذا المعنى بوضوح مع إبقاء احتمال الحيازة والتمسك ضمن السياق.
- source_word: καὶ
  choice: و
  rationale: تكرار الواو يحفظ إيقاع السلسلة التراكمية وترابط أجزائها كما في اليونانية.
theological_decisions:
- issue: دلالة التراكيب المتكررة ὡς μὴ مع أسماء الفاعلين
  choice: صيغت بعبارة «كأنهم غير...» للدلالة على كيفية التعامل مع الخبرات العاطفية والاقتصادية من غير إنكار وقوعها.
  alternative: أن تُفهم العبارات نهيًا زاهدًا مطلقًا عن البكاء والفرح والشراء، أو أن تُختزل في موقف نفسي منفصل عن سياق زوال صورة هذا العالم.
  rationale: السياق القريب يتحدث عن الضيق الحاضر وعن أن صورة هذا العالم تزول. والتركيب اليوناني يصف هيئة أو موقفًا، لا نفيًا مطلقًا للأفعال، لذلك تُرك التوتر قائمًا من غير تحويل النص إلى تحريم لهذه الخبرات.
