  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: ar
  text: أمّا مَن كان ثابتًا في قلبه، ولا ضرورة تلزمه، بل له سلطان على إرادته، وقد عزم في قلبه على أن يحفظ عذراءه[a]، فإنه يفعل حسنًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير «عذراءه» إلى ابنته العذراء، أو إلى خطيبته العذراء؛ والتعبير اليوناني موضع خلاف.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: كان ثابتًا
  rationale: ينقل صيغة الكمال مع معنى الرسوخ والاستقرار في العزم، بعبارة عربية طبيعية رصينة.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: في قلبه
  rationale: يحفظ الصورة الكتابية للقلب بوصفه موضع العزم والقرار.
- source_word: μὴ ἔχων ἀνάγκην
  choice: ولا ضرورة تلزمه
  rationale: يحفظ معنى الضرورة مع إيضاح أنها ليست قيدًا ملزمًا، من غير تحديد مصدرها.
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: بل له سلطان على إرادته
  rationale: «سلطان» يقابل ἐξουσία، و«إرادته» تقابل θέλημα، وتحفظ العبارة معنى القدرة على تقرير ما يريد.
- source_word: κέκρικεν
  choice: وقد عزم
  rationale: ينقل القرار المستقر الذي تدل عليه صيغة الكمال، وهو أنسب عربيًا في سياق قرار داخلي ثابت.
- source_word: τηρεῖν
  choice: أن يحفظ
  rationale: ترجمة قريبة للفعل بمعنى يُبقي أو يصون، من دون إضافة تفسيرية مثل «غير متزوجة».
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: عذراءه
  rationale: صياغة عربية موجزة تحافظ قدر الإمكان على غموض المرجع في اليونانية؛ ويبيّن الهامش الاحتمالين الرئيسيين.
- source_word: καλῶς ποιήσει
  choice: فإنه يفعل حسنًا
  rationale: تعبير عربي واضح ينقل الحكم الإيجابي على الفعل من دون مبالغة.
theological_decisions:
- issue: مرجع التعبير τὴν ἑαυτοῦ παρθένον
  choice: إبقاء التعبير محتملًا بلفظ «عذراءه» في المتن
  alternative: ابنته العذراء؛ أو خطيبته/المرأة العذراء المرتبط بها بعهد زواج
  rationale: النص اليوناني موضع خلاف ولا يحسم هل الكلام عن أب أو وليّ تجاه عذراء تحت رعايته، أم عن رجل تجاه خطيبته. لذلك لم يُحسم الاحتمال في المتن، ووُضع الإيضاح في الهامش.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. حُفظ تكرار «في قلبه» الوارد في الأصل، وتُرك مرجع «عذراءه» غامضًا عمدًا مع بيان الاحتمالات في الهامش.
