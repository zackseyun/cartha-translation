translation:
  language: ar
  text: والذين يستعملون العالم كأنهم لا يستعملونه إلى أقصى حدّ[a]؛ لأن هيئة هذا العالم[b] آخذة في الزوال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كأنهم لا ينتفعون به إلى أقصى حد»؛ وقد يحمل الفعل أيضًا معنى «كأنهم لا يسيئون استعماله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «المظهر الخارجي لهذا العالم» أو «نمط هذا العالم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: يستخدمون
  rationale: ينقل المعنى المباشر للفعل، أي استعمال العالم والتعامل مع موارده وشؤونه، بعبارة عربية واضحة وموجزة.
- source_word: κόσμον
  choice: العالم
  rationale: يحافظ على اللفظ اليوناني المباشر، مع دلالة السياق على العالم في نظامه المادي والاجتماعي الحاضر.
- source_word: ὡς μὴ καταχρώμενοι
  choice: كأنهم لا يستعملونه إلى أقصى حدّ
  rationale: يحافظ على التقابل اللفظي بين χράομαι وκαταχράομαι، وينقل معنى الاستعمال الكامل أو المستغرق دون حصر العبارة في معنى إساءة الاستعمال.
- source_word: παράγει
  choice: آخذة في الزوال
  rationale: تنقل صيغة المضارع بوصفها عملية جارية، وتبرز طابع العالم الحاضر العابر.
- source_word: σχῆμα
  choice: هيئة
  rationale: تدل «هيئة» على الصورة أو الكيفية الظاهرة والحاضرة، دون أن توحي بأن جوهر الخليقة هو المقصود.
- source_word: τοῦ κόσμου τούτου
  choice: هذا العالم
  rationale: يُبقي اسم الإشارة اليوناني ظاهرًا، فيحدد النظام العالمي الحاضر الذي يتصف بالزوال.
theological_decisions:
- issue: دلالة καταχρώμενοι في مقابل χρώμενοι
  choice: التعامل مع العالم دون استنفاد الانتفاع به أو الاستغراق الكامل في استعماله
  alternative: إساءة استعمال العالم
  rationale: التجاور بين الفعلين يصنع تقابلًا بين الاستعمال والاستعمال إلى أقصى مداه. وهذه الصياغة تحفظ هذا التوتر، مع ذكر معنى إساءة الاستعمال في الحاشية بدل جعله المعنى الوحيد.
- issue: دلالة σχῆμα
  choice: هيئة العالم الحاضرة العابرة
  alternative: مجرد مظهر العالم الخارجي، أو طبيعة العالم الجوهرية
  rationale: اللفظ يشير إلى الصورة أو الكيفية الراهنة التي تزول، لا إلى جوهر الخليقة؛ لذلك تحافظ «هيئة» على المعنى دون توسيعه أو تضييقه عقائديًا.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. حوفظ على تكرار معنى الاستعمال في الأصل وعلى غموض الفعل المكثف، كما نُقلت استمرارية الزوال بعبارة «آخذة في الزوال».
