  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: ar
  text: 'وأقول لغير المتزوجين وللأرامل: حسنٌ لهم أن يبقوا كما أنا أيضًا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «للرجال غير المتزوجين»، لأن الصيغة اليونانية مذكرة جمع؛ وقد يكون المذكر هنا مستعملًا استعمالًا تمثيليًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: وأقول
  rationale: تنقل الواو قوة δέ الانتقالية الخفيفة في هذا السياق من غير أن تجعلها استدراكًا قويًا أو تضيف معنى زمنيًا غير موجود.
- source_word: τοῖς ἀγάμοις
  choice: لغير المتزوجين
  rationale: تفيد ἄγαμος من ليس في حالة زواج. والصيغة اليونانية مذكرة جمع، وقد تكون خاصة بالرجال أو مستعملة استعمالًا تمثيليًا؛ لذلك أُبقي هذا الاحتمال في الحاشية.
- source_word: ταῖς χήραις
  choice: وللأرامل
  rationale: χήραις تدل تحديدًا على النساء اللواتي مات أزواجهن، فحُفظت الفئة المذكورة صراحة في النص.
- source_word: καλὸν αὐτοῖς
  choice: حسنٌ لهم
  rationale: يحفظ معنى الصلاح أو الملاءمة في καλόν من غير تحويله إلى صيغة مقارنة مثل «أفضل».
- source_word: ἐὰν μείνωσιν
  choice: أن يبقوا
  rationale: يفيد μένω البقاء والاستمرار، والمقصود سياقيًا الاستمرار في الحالة غير الزوجية.
- source_word: ὡς κἀγώ
  choice: كما أنا أيضًا
  rationale: تحفظ العبارة قوة κἀγώ، أي καὶ ἐγώ، بما فيها معنى «أيضًا»، وتترك الحالة التي يشير إليها بولس مفهومة من السياق.
theological_decisions:
- issue: نطاق τοῖς ἀγάμοις بالنسبة إلى الأرامل
  choice: «لغير المتزوجين» في المتن مع بيان الاحتمال النحوي في الحاشية
  alternative: «للرجال غير المتزوجين»
  rationale: الصيغة مذكرة جمع، لكنها قد تُستعمل تمثيليًا، والسياق لا يحسم تمامًا هل المقصود الرجال وحدهم. يحفظ المتن المعنى الأوسع الممكن، وتمنع الحاشية طمس الاحتمال الأضيق.
- issue: قوة καλὸν في مشورة بولس
  choice: «حسنٌ»
  alternative: «أفضل» أو «لائق»
  rationale: لا يحمل اللفظ اليوناني هنا صيغة مقارنة، ولذلك لا ينبغي أن تُستورد إلى النص مفاضلة أقوى مما يقوله الأصل.
translation_notes:
  register: عربية فصحى واضحة ورصينة. استُعمل التركيب الاسمي «حسنٌ لهم» لصون إيجاز الأصل وقوته غير المقارنة، وأُثبتت «أيضًا» لأنها موجودة في κἀγώ. لا حاجة إلى حاشية مستقلة لعبارة «كما أنا أيضًا» لأن المتن ينقلها حرفيًا بوضوح.
