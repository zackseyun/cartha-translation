  naturalness: النص فصيح في معظمه ويستعمل المثنى استعمالًا مناسبًا. تُستبدل صياغة الاستثناء بصياغة عربية حديثة واضحة، وتُصاغ عبارة العودة إلى الاجتماع بصورة أسلس وأقرب إلى الإيحاء المحتشم في الأصل.
  terminology: «الشيطان» و«الصلاة» و«ضبط النفس» مصطلحات مناسبة ومستقرة. وتبقى الإشارة إلى المعاشرة الزوجية غير صريحة في المتن، مع إيضاحها في الحاشية بحسب السياق.
