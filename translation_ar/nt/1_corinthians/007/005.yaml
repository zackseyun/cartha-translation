revisions:
- from: لا يَحرِمْ أحدُكما الآخرَ، إلا لعلّه باتفاقٍ متبادل، إلى حين، لكي تتفرّغا للصلاة، ثم تعودا إلى الاجتماع معًا[a]، لئلا يجرّبكما الشيطان بسبب عدم قدرتكما على ضبط نفسيكما.
  to: لا يَحرِمْ أحدُكما الآخرَ، إلا باتفاقٍ بينكما، ولفترةٍ محدودة، لكي تتفرّغا للصلاة، ثم تجتمعا من جديد[a]، لئلا يجرّبكما الشيطان بسبب افتقاركما إلى ضبط النفس.
  rationale: تُصحَّح صياغة الاستثناء لتكون عربية سليمة وواضحة مع بقاء الاتفاق المتبادل والمدة المحدودة. وتُستبدل عبارة «تعودا إلى الاجتماع معًا» بعبارة أكثر سلاسة، من دون جعل الدلالة الزوجية أكثر صراحة من الأسلوب اليوناني؛ وتبقى هذه الدلالة مبيّنة في الحاشية. كما يُستعمل «افتقاركما إلى ضبط النفس» للتعبير الطبيعي الدقيق عن ἀκρασία.
