  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: ar
  text: لا يَحرِمْ أحدُكما الآخرَ، إلا باتفاقٍ بينكما، ولفترةٍ محدودة، لكي تتفرّغا للصلاة، ثم تجتمعا من جديد[a]، لئلا يجرّبكما الشيطان بسبب افتقاركما إلى ضبط النفس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «تكونا معًا من جديد»؛ وتشير العبارة في هذا السياق إلى استئناف الحياة والمعاشرة الزوجية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: لا يَحرِمْ أحدُكما الآخرَ
  rationale: يفيد الفعل حجب ما هو مستحق للقرين في سياق العلاقة الزوجية. وصيغة النهي مع التعبير التبادلي تحفظ قوة الوصية ومبادلتها من غير إيحاء تجاري.
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: إلا لعلّه باتفاقٍ متبادل
  rationale: يحفظ «لعلّه» الطابع الاحتمالي أو المقيِّد في εἰ μήτι ἂν، ويبيّن «باتفاق متبادل» أن القرار قائم على رضا الزوجين كليهما.
- source_word: πρὸς καιρόν
  choice: إلى حين
  rationale: تعبير عربي طبيعي يدل على مدة محدودة ومؤقتة.
- source_word: σχολάσητε τῇ προσευχῇ
  choice: تتفرّغا للصلاة
  rationale: ينقل معنى تخصيص الوقت والانشغال المقصود بالصلاة، مع الحفاظ على صيغة الصلاة المفردة بوصفها ممارسة عامة.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: ثم تعودا إلى الاجتماع معًا
  rationale: يحافظ على التعبير غير الصريح في اليونانية، مع إبقاء دلالته السياقية على استئناف المعاشرة والحياة الزوجية.
- source_word: πειράζῃ
  choice: يجرّبكما
  rationale: مع فاعل هو الشيطان يدل السياق على الإغراء بالخطيئة، و«يجرّب» هو التعبير الكتابي العربي المألوف الذي يحتمل هذا المعنى.
- source_word: Σατανᾶς
  choice: الشيطان
  rationale: الاسم المستقر في العربية الكتابية لهذا الكائن الشخصي، وهو أنسب للقارئ العربي من النقل الصوتي «ساتان».
- source_word: ἀκρασίαν
  choice: عدم قدرتكما على ضبط نفسيكما
  rationale: يوضح عجز الزوجين عن ممارسة ضبط النفس في هذا السياق، بلغة حديثة مفهومة ومن دون ألفاظ قديمة أو ملتبسة.
theological_decisions:
- issue: مدى التصريح بالدلالة الجنسية لعبارة πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: ثم تعودا إلى الاجتماع معًا
  alternative: ثم تستأنفا العلاقات الزوجية
  rationale: السياق يشير على الأرجح إلى استئناف الاتحاد الزوجي، بما فيه المعاشرة، لكن الأصل يصوغه بعبارة محتشمة وغير صريحة؛ لذلك حُفظ هذا القدر من الإيحاء وأضيفت حاشية إيضاحية.
- issue: هل Σατανᾶς اسم لكائن شخصي أم وصف عام للخصم
  choice: الشيطان
  alternative: الخصم
  rationale: الاستعمال هنا يشير إلى الشيطان بوصفه كائنًا شخصيًا، لا إلى قوة معادية مجردة أو خصم بشري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومحتشمة، مع استعمال صيغة المثنى لإبراز خطاب الزوجين المتبادل. حُفظت الصياغة الاحتمالية في الاستثناء، ولم تُجعل الإشارة إلى المعاشرة أكثر صراحة من الأصل.
