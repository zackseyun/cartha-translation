  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: ar
  text: ولكن بسبب أعمال الفجور الجنسي[a]، فليكن لكل رجل زوجته، ولتكن لكل امرأة زوجها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «الفجور الجنسي» بالمفرد. جاء اللفظ اليوناني بصيغة الجمع: «أعمال الفجور الجنسي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: ولكن بسبب
  rationale: تحفظ «بسبب» دلالة διά السببية مع المفعول به، وتنقل «لكن» التحول أو المقابلة الخفيفة التي تفيدها δέ.
- source_word: τὰς πορνείας
  choice: أنواع الفجور الجنسي
  rationale: تشير πορνεία إلى السلوك الجنسي غير الأخلاقي، وقد وردت هنا بصيغة الجمع. وعبارة «أنواع الفجور الجنسي» عربية طبيعية نسبيًا وتحفظ دلالة الجمع دون استعمال لفظ قديم أو أضيق من الأصل.
- source_word: ἕκαστος
  choice: كل رجل
  rationale: المفرد المذكر، في موازاة ἑκάστη المؤنث واقترانه بزوجة، يدل هنا على الرجل لا على معنى عام مبهم.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: زوجته
  rationale: γυνή تعني «امرأة» أو «زوجة»، والسياق الزوجي والموازاة مع ἄνδρα يرجحان «زوجة». وتؤدي ياء الغائب في «زوجته» معنى الملكية الانعكاسية في ἑαυτοῦ بصورة عربية موجزة وطبيعية.
- source_word: ἐχέτω
  choice: فليكن لكل
  rationale: تنقل صيغة اللام الأمرية قوة فعل الأمر في الغائب، وتحافظ على معنى «أن يكون له» دون تحويله تفسيريًا إلى «فليتزوج» أو إلى إشارة صريحة للعلاقة الزوجية.
- source_word: καὶ ἑκάστη
  choice: ولكل امرأة
  rationale: تحفظ التوزيع المتوازي بين كل رجل وكل امرأة، مع بقاء العلاقة الزوجية محددة بالمفعول اللاحق.
- source_word: τὸν ἴδιον ἄνδρα
  choice: زوجها
  rationale: ἄνδρα تعني هنا «زوج» في الموازاة والسياق الزوجي، وتؤدي ياء الغائبة في «زوجها» معنى ἴδιον، أي زوجها هي.
theological_decisions:
- issue: هل تُفسَّر العبارة أمرًا بالزواج لتجنب الخطيئة الجنسية أم توجيهًا بشأن العلاقة الزوجية؟
  choice: 'الإبقاء على الصياغة المباشرة: «فليكن لكل رجل زوجته، ولكل امرأة زوجها».'
  alternative: «فليتزوج كل رجل وكل امرأة» أو «فليؤدِّ كل منهما واجبه الزوجي».
  rationale: يستعمل اليوناني ἐχέτω، أي «ليكن له/ليملك»، ولا يستعمل فعلًا صريحًا للزواج أو للمعاشرة. لذلك تحافظ الترجمة على اتساع العبارة وتترك تحديد مرادها الأدق للسياق دون استيراد حكم عقدي إضافي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت «أنواع الفجور الجنسي» لإظهار الجمع اليوناني بصورة مفهومة، وحُفظ التوازي البلاغي بين الرجل والمرأة، مع تجنب الألفاظ التفسيرية الزائدة مثل «يتزوج» أو «يعاشر».
