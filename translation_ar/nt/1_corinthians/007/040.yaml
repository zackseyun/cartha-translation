  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: ar
  text: لكنها تكون أسعد إن بقيت على حالها[a]، بحسب رأيي، وأظن أنني أنا أيضًا لديّ روح الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أكثر غبطة». يمكن لصيغة التفضيل اليونانية μακαριωτέρα أن تدل على غبطة أو بركة أعظم، كما يمكن أن تدل على سعادة أكبر.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: أسعد
  rationale: صيغة تفضيل من μακάριος، والسياق يقارن بين حالتين في إطار مشورة رعوية عملية. «أسعد» عربية طبيعية وتحفظ معنى المقارنة، مع إثبات البديل «أكثر غبطة» في الحاشية.
- source_word: ἐὰν οὕτως μείνῃ
  choice: إن بقيت على حالها
  rationale: الفعل μένω يعني البقاء، وοὕτως يحيل إلى حالها غير المتزوجة المذكورة في السياق. تحفظ العبارة الإحالة من غير زيادة تفسيرية.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: بحسب رأيي
  rationale: تدل γνώμη هنا على رأي أو حكم مدروس. «بحسب رأيي» واضحة وكريمة الأسلوب، وتحفظ تمييز بولس لهذه المشورة من قول مباشر للرب.
- source_word: δοκῶ
  choice: أظن
  rationale: تنقل التوكيد المتواضع في δοκέω من غير تحويله إلى تصريح يقيني أشد من الأصل؛ والسياق يمنع فهمها على أنها شك فعلي في امتلاك الروح.
- source_word: κἀγὼ
  choice: لي أنا أيضًا
  rationale: تحفظ القيمة الإضافية في κἀγώ، أي «وأنا أيضًا»، مع إبراز الضمير في صياغة عربية طبيعية.
- source_word: πνεῦμα θεοῦ
  choice: روح الله
  rationale: التركيب البولسي يشير هنا على الأرجح إلى روح الله، لا إلى مجرد نزعة روحية. والإضافة العربية طبيعية ولا تحتاج إلى أداة تعريف.
- source_word: ἔχειν
  choice: لي
  rationale: صيغ معنى «أن يكون لي/أن أمتلك» بأسلوب عربي طبيعي داخل الجملة، بدل «أمتلك» الأثقل نبرة.
theological_decisions:
- issue: هل يشير πνεῦμα θεοῦ إلى الروح القدس أم إلى نزعة روحية عامة؟
  choice: روح الله
  alternative: روح من الله أو بصيرة روحية إلهية
  rationale: استعمال بولس والسياق يرجحان الإشارة إلى روح الله نفسه بوصفه مصدر مشورته ذات الشرعية الروحية، من غير تحويل المشورة إلى وصية مباشرة من الرب.
- issue: قوة قول بولس δοκῶ ... πνεῦμα θεοῦ ἔχειν
  choice: ادعاء حقيقي بصيغة متواضعة أن له أيضًا روح الله
  alternative: شك متردد في أن له الروح، أو قول تهكمي صريح
  rationale: «أظن» تحفظ التواضع البلاغي في العبارة، لكن السياق لا يدل على أن بولس يشك فعلًا في حضور روح الله معه. لم تُضف الترجمة علامة تهكم غير مصرّح بها.
translation_notes:
  register: العربية فصحى معاصرة واضحة وكريمة، بصياغة موجزة تحفظ الإحالة إلى حال الأرملة، والتفضيل في μακαριωτέρα، والتواضع البلاغي مع بقاء دعوى الإرشاد بالروح.
