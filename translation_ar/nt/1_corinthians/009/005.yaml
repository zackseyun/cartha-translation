source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: ar
  text: أليس لنا الحق أن نصطحب معنا زوجةً هي أخت في الإيمان[a]، كما يفعل أيضًا سائر الرسل وإخوة الرب وكيفا؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أختًا، زوجةً»، أي زوجةً من جماعة المؤمنين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: الحق
  rationale: يدور السياق على استحقاق رسولي مشروع، لا على سلطة مجردة؛ و«الحق» تعبير عربي طبيعي ودقيق هنا.
- source_word: ἀδελφὴν γυναῖκα
  choice: زوجةً هي أخت في الإيمان
  rationale: 'يحفظ الوصفين في اليونانية: كون المرأة زوجة وكونها أختًا في جماعة المؤمنين، مع تجنب تركيب عربي ملتبس مثل «أختًا زوجةً».'
- source_word: περιάγειν
  choice: أن نصطحب معنا
  rationale: يشير الفعل في السياق إلى اصطحاب شخص في الأسفار والخدمة، وهذا التعبير واضح وطبيعي في العربية المعاصرة.
- source_word: ὡς καὶ
  choice: كما يفعل أيضًا
  rationale: يُظهر المقارنة والإضافة، ويصرّح بالفعل المحذوف المفهوم في اليونانية بما يلائم الأسلوب العربي.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: سائر الرسل
  rationale: تنقل «سائر» معنى بقية أفراد المجموعة بإيجاز وفصاحة.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: إخوة الرب
  rationale: ترجمة مباشرة لا تحسم طبيعة صلة القرابة المقصودة.
- source_word: Κηφᾶς
  choice: كيفا
  rationale: يحافظ على صيغة الاسم الواردة في النص اليوناني بدل استبدالها باسم بطرس.
theological_decisions:
- issue: مدلول «إخوة الرب»
  choice: إخوة الرب
  alternative: أقرباء الرب أو إخوته بحسب الجسد أو إخوته غير الأشقاء
  rationale: العبارة اليونانية لا تحسم وحدها طبيعة القرابة؛ لذلك تُنقل كما هي من غير إدخال حكم عقائدي لاحق.
- issue: مدلول ἀδελφὴν γυναῖκα
  choice: زوجةً هي أخت في الإيمان
  alternative: أختًا زوجةً؛ أو امرأة مؤمنة مرافقة
  rationale: تركيب الاسمين يدل على الأرجح على زوجة من جماعة المؤمنين. وتحافظ الصياغة على العنصرين مع بيان المعنى الطبيعي، بينما توثّق الحاشية الصورة الحرفية غير المألوفة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم السؤال «أليس لنا الحق» لنقل قوة النفي الاستفهامي، وأُضيف «يفعل» لإكمال المقارنة المحذوف فعلها في اليونانية من غير تغيير معناها.
