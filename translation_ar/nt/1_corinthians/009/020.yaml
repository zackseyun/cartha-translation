  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: ar
  text: وصرتُ لليهود كيهوديّ، لأربح اليهود[a]؛ وللذين تحت الشريعة، كأنّي تحت الشريعة—مع أنّي أنا نفسي لست تحت الشريعة—لأربح الذين تحت الشريعة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأكسب»؛ فالفعل قد يعني الربح أو كسب الناس واستمالتهم.'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن المقصود بـ«الشريعة» هنا شريعة موسى.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: صرتُ
  rationale: ينقل فعل γίνομαι بصيغة مباشرة، ويعبّر هنا عن تكيّف بولس في سلوكه وموقفه تجاه الفئات المختلفة.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: لليهود كيهوديّ
  rationale: يحفظ صيغة المقارنة ὡς مع الداتيف، من غير أن يوحي بأن بولس لم يكن يهوديًا من جهة الأصل.
- source_word: ἵνα ... κερδήσω
  choice: لأربح
  rationale: يحافظ على الصورة المعجمية للفعل κερδαίνω، أي الربح أو الكسب، وهي مفهومة هنا بمعنى استمالة الأشخاص وكسبهم.
- source_word: τοῖς ὑπὸ νόμον
  choice: للذين تحت الشريعة
  rationale: ينقل التركيب الاسمي كما هو، ويستعمل «الشريعة» بوصفها المقابل العربي الطبيعي لـ νόμος في هذا السياق اليهودي.
- source_word: ὡς ὑπὸ νόμον
  choice: كأنّي تحت الشريعة
  rationale: صياغة عربية طبيعية تحافظ على المقارنة وعلى التوازي مع «كيهوديّ»، ولا تثبت خضوع بولس الفعلي للشريعة.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: مع أنّي أنا نفسي لست تحت الشريعة
  rationale: ينقل الاعتراض التوضيحي المعاصر للفعل، ويحفظ النفي والحالة المستمرة والتوكيد في αὐτός.
- source_word: αὐτὸς
  choice: أنا نفسي
  rationale: يحفظ التوكيد الصريح في النص اليوناني.
- source_word: νόμος
  choice: الشريعة
  rationale: هو المقابل العربي المألوف في السياق الكتابي، مع إبقاء العبارة أوسع من التصريح في المتن بأنها شريعة موسى.
theological_decisions:
- issue: معنى قول بولس إنه ليس «تحت الشريعة»
  choice: مع أنّي أنا نفسي لست تحت الشريعة
  alternative: مع أنّي أنا نفسي لست تحت شريعة موسى؛ أو إضافة توضيح مستمد من الآية التالية بأنه تحت شريعة المسيح
  rationale: يصرّح النص اليوناني فقط بأن بولس ليس تحت الشريعة. لذلك تُحفظ العبارة بلا تضييق ولا مواءمة تفسيرية مع الآية التالية، إبقاءً للتوتر اللاهوتي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حوفظ على التوازي البلاغي والتكرار في الأصل، واستُعملت الشرطتان لإبراز الجملة الاعتراضية. وُضع كل مؤشّر حاشية في المتن، مع إسناد الحاشية المعجمية إلى أول ظهور لـ«لأربح»، والحاشية السياقية إلى ختام العبارة المتعلقة بالشريعة.
