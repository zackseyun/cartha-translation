  source_fidelity: 'النص العربي ينقل بدقة البنية الأساسية للنص اليوناني: «وصرتُ» لـἐγενόμην، والتوازي في «لليهود كيهوديّ» و«للذين تحت الشريعة...»، وغرض ἵνα في «لأربح». كما يحافظ الاعتراض الواقع بين الشرطتين على النفي الحاضر والتوكيد في «مع أنّي أنا نفسي لست تحت الشريعة»، من غير إدخال تقييد تفسيري من الآية التالية.'
  naturalness: الصياغة فصيحة واضحة وطبيعية في العربية المعيارية الحديثة. والتكرار مقصود وموافق للتوازي البلاغي في الأصل. و«كأنّي تحت الشريعة» تؤدي وظيفة المقارنة في العبارة اليونانية بسلاسة عربية، ولا تستلزم إثبات خضوع فعلي في ضوء الاعتراض التالي.
  terminology: «اليهود»، و«الشريعة»، و«تحت الشريعة» مصطلحات كتابية عربية مستقرة ومناسبة للسياق. و«لأربح» مقابِل مشروع لـκερδήσω في هذا الاستعمال، مع إتاحة البديل الدلالي في الحاشية. لا تضيف الحاشية الخاصة بالشريعة إلى المتن، وتحافظ على درجة الترجيح المناسبة.
