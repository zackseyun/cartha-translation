base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: ar
  text: مَنْ يتجنّد على نفقته الخاصة قط؟ ومَنْ يغرس كرمًا ولا يأكل من ثمره؟ ومَنْ يرعى قطيعًا ولا يأكل من لبن القطيع؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُترجم العبارة الأخيرة: «ولا يشرب من لبن القطيع؟» والفعل اليوناني حرفيًّا «يأكل»، وقد أُبقي هنا للمحافظة على التوازي مع الجملة السابقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: يخدم جنديًّا
  rationale: يفيد الفعل أداء الخدمة العسكرية، وهذه الصياغة تحفظ صورة المهنة من غير أن تحصرها في القتال.
- source_word: ἰδίοις ὀψωνίοις
  choice: على نفقته الخاصة
  rationale: تشير العبارة إلى أجرة الجندي أو مؤونته، والمقصود في السؤال البلاغي أن الجندي لا يتحمل بنفسه كلفة خدمته.
- source_word: ποτέ
  choice: قط
  rationale: تؤدي معنى «في أي وقت» في سياق السؤال البلاغي، وهي موجزة وفصيحة.
- source_word: φυτεύει ἀμπελῶνα
  choice: يغرس كرمًا
  rationale: نقل مباشر وطبيعي للصورة الزراعية في اليونانية.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: من ثمره
  rationale: يشير καρπός هنا إلى ما ينتجه الكرم، و«ثمره» واضحة وتحفظ الصورة الأصلية.
- source_word: ποιμαίνει ποίμνην
  choice: يرعى قطيعًا
  rationale: «يرعى» هو المقابل العربي الطبيعي الذي يحفظ صورة عمل الراعي.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: من لبن القطيع
  rationale: تحفظ الصياغة دلالة المصدر أو التبعيض في العبارة اليونانية.
- source_word: ἐσθίει
  choice: يأكل
  rationale: أُبقي الفعل نفسه في الجملتين كما في اليونانية، مع أن العربية المألوفة قد تقول «يشرب» مع اللبن؛ وبذلك يُحفظ التوازي اللفظي في الأصل.
theological_decisions:
- issue: المذكر المفرد التمثيلي في أسئلة τίς المتكررة
  choice: استعمال «مَنْ» مع أفعال المذكر المفرد وضميره
  alternative: صياغة جمع شاملة
  rationale: تستعمل اليونانية أمثلة بلاغية بصيغة المفرد المذكر على نحو تمثيلي؛ فحُفظ العدد والصيغة من غير حصر المبدأ في شخص بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. حُفظت الأسئلة البلاغية الثلاثة وتوازيها، واستُعمل «قط» للدلالة على ποτέ. وُضعت علامة الحاشية في المتن.
