  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: ar
  text: ولكنني أفعل كل شيء من أجل البشارة[a]، لكي أصير شريكًا فيها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أجل الإنجيل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكي أشارك فيها» أو «لكي أصير مشاركًا فيها مع الآخرين».'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: كل شيء
  rationale: تفيد صيغة الجمع المحايد هنا الشمول، و«كل شيء» تعبير عربي طبيعي يحفظ اتساع العبارة.
- source_word: δὲ
  choice: ولكنني
  rationale: تفيد الأداة انتقالًا مع مقابلة خفيفة بما سبق، ولذلك تنقلها «ولكنني» بوضوح في السياق.
- source_word: ποιῶ
  choice: أفعل
  rationale: الفعل مضارع خبري يدل هنا على سلوك بولس المعتاد والمستمر، و«أفعل» يؤدي ذلك بصورة طبيعية.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: من أجل البشارة
  rationale: تفيد διά مع النصب الدافع أو الغاية، و«من أجل» تحفظ هذا المعنى. و«البشارة» تنقل معنى الخبر السار بلغة عربية واضحة، مع إثبات البديل التقليدي «الإنجيل» في الحاشية.
- source_word: ἵνα
  choice: لكي
  rationale: تدخل الأداة جملة غائية، و«لكي» تحافظ على دلالة القصد بعبارة عربية موجزة.
- source_word: συγκοινωνὸς
  choice: شريكًا
  rationale: يدل الاسم على من يشترك مع آخرين في شيء؛ و«شريكًا» يحفظ معنى الاشتراك من غير أن يحدد طبيعته تحديدًا زائدًا.
- source_word: αὐτοῦ
  choice: فيها
  rationale: يعود الضمير على «البشارة»، والتعبير العربي الطبيعي مع «شريك» هو «شريكًا فيها».
- source_word: γένωμαι
  choice: أصير
  rationale: يحفظ «أصير» معنى الصيرورة في فعل γίνομαι، بدل اختزاله إلى مجرد الكينونة.
theological_decisions:
- issue: طبيعة اشتراك بولس في البشارة
  choice: الإبقاء على العبارة العامة «أصير شريكًا فيها»
  alternative: أن يشترك في بركات البشارة، أو انتشارها، أو خدمة التبشير بها
  rationale: لفظ συγκοινωνός واسع، وقد يشمل الاشتراك في البشارة وبركاتها أو في خدمتها وتقدمها. لذلك لا تحصر الترجمة المعنى في تفسير عقائدي أو خَدَمي واحد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. اختيرت «البشارة» لشفافية المعنى، ووُضع المصطلح التقليدي «الإنجيل» في الحاشية. حُفظت دلالة الغاية والصيرورة، كما تُرك نطاق الاشتراك مقصودًا من غير تضييق لاهوتي.
