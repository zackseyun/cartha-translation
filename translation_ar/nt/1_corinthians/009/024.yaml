  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: ar
  text: أمَا تعلمون أن الذين يركضون في ميدان السباق يركضون جميعًا، لكن واحدًا ينال الجائزة؟ فاركضوا هكذا لكي تدركوها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي تنالوها» أو «لكي تظفروا بها». يمكن أن يعني الفعل اليوناني «يدرك» أو «ينال» أو «يستولي على».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: أمَا تعلمون
  rationale: يحفظ صيغة السؤال البلاغي البولسية والمعنى المباشر للفعل، بصياغة عربية فصيحة طبيعية.
- source_word: ἐν σταδίῳ
  choice: في ميدان السباق
  rationale: يدل اللفظ اليوناني على موضع السباق، أي المضمار أو الملعب؛ و«ميدان السباق» يحفظ الصورة الرياضية بوضوح ولا يوهم بوحدة القياس.
- source_word: τρέχοντες ... τρέχουσιν
  choice: الذين يركضون ... يركضون
  rationale: يحفظ التكرار المقصود في اليونانية والصورة الحية للسباق.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: جميعًا، لكن واحدًا
  rationale: ينقل المقابلة بين الجميع والواحد بعبارة عربية واضحة من غير إثقال ترجمة الأداتين.
- source_word: λαμβάνει
  choice: ينال
  rationale: ينقل معنى الأخذ أو الحصول هنا بصورة طبيعية تلائم الجائزة، من غير استبداله بتفسير «يفوز».
- source_word: βραβεῖον
  choice: الجائزة
  rationale: المقابل العربي المألوف لجائزة المنتصر في المسابقات الرياضية.
- source_word: οὕτως
  choice: هكذا
  rationale: يحفظ الإحالة الموجزة إلى كيفية الركض في التشبيه السابق، ويظل طبيعيًا وقويًا في العربية.
- source_word: τρέχετε
  choice: فاركضوا
  rationale: صيغة الأمر تحافظ على قوة الحث، والفاء تصل التطبيق بالتشبيه السابق؛ ولا يلزم التصريح بالاستمرار الذي قد يدل عليه المضارع اليوناني.
- source_word: ἵνα καταλάβητε
  choice: لكي تدركوها
  rationale: «تدركوا» يحفظ مجال الفعل الذي قد يعني اللحاق بالشيء أو الظفر به أو الحصول عليه، والضمير يعود طبيعيًا إلى الجائزة.
theological_decisions:
- issue: تطبيق صورة السباق الرياضي على المثابرة المسيحية
  choice: الإبقاء على صورة السباق والحث على إدراك الجائزة من غير تحديد نظام عقائدي للخلاص أو الثواب
  alternative: 'ترجمتها تفسيريًا: «اركضوا لكي تفوزوا»'
  rationale: النص يحث على السعي المنضبط من خلال تشبيه رياضي، ولا يحسم بذاته النقاشات الأوسع بشأن الاستحقاق أو المثابرة أو طبيعة الجائزة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وحثية. استُعمل «ميدان السباق» بدل «الملعب» لإبراز موضع الجري، و«تدركوها» للحفاظ على القوة الدلالية والقدر الحقيقي من الاحتمال في καταλάβητε.
