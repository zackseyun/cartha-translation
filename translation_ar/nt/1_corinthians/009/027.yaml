base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: ar
  text: بَلْ أُؤَدِّبُ جَسَدِي تَأْدِيبًا صَارِمًا[a] وَأَجْعَلُهُ عَبْدًا[b]، لِئَلَّا أَصِيرَ أَنَا نَفْسِي غَيْرَ مُؤَهَّلٍ[c] بَعْدَمَا كَرَزْتُ لِلْآخَرِينَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَضْرِبُ جَسَدِي»؛ فالفعل اليوناني يعني حرفيًا الضرب تحت العين، ويُستعمل هنا مجازيًا للدلالة على التأديب الصارم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أُخْضِعُهُ لِلْعُبُودِيَّةِ» أو «أَسْتَعْبِدُهُ».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «مَرْفُوضًا» أو «غَيْرَ مُجَازٍ»؛ وتناسب «غَيْرَ مُؤَهَّلٍ» صورة السباق والاختبار في السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: أُرَوِّضُ
  rationale: الفعل يدل حرفيًا على الضرب تحت العين، ويُستعمل هنا مجازيًا لضبط الجسد ضبطًا صارمًا. «أُرَوِّضُ» تعبير عربي طبيعي يحفظ صورة التدريب والانضباط الشديد من غير أن يحصر المعنى في إيذاء الجسد حرفيًا.
- source_word: σῶμα
  choice: جَسَدِي
  rationale: أُبقي اللفظ الملموس «الجسد» لأن بولس يسمّي الجسد صراحةً موضوعًا للترويض، بدل تعميمه إلى «نفسي».
- source_word: δουλαγωγῶ
  choice: أَسْتَعْبِدُهُ
  rationale: يحفظ قوة الفعل الذي يعني إخضاع الشيء للعبودية أو جعله عبدًا، ولا يخففه إلى مجرد «أسيطر عليه».
- source_word: μή πως
  choice: لِئَلَّا
  rationale: تنقل غرض التحاشي والمخافة في العبارة اليونانية بوضوح وإيجاز؛ أما دلالة الاحتمال فظاهرة في سياق التحذير.
- source_word: ἄλλοις
  choice: لِلْآخَرِينَ
  rationale: ترجمة طبيعية للمفعول غير المباشر مع فعل الكرازة.
- source_word: κηρύξας
  choice: بَعْدَ أَنْ كَرَزْتُ
  rationale: تنقل سبق حدث الكرازة زمنيًا على النتيجة المخوفة، وتحفظ معنى المناداة العلنية.
- source_word: ἀδόκιμος
  choice: غَيْرَ مُؤَهَّلٍ
  rationale: يناسب سياق السباق والاختبار، ويحفظ معنى عدم اجتياز معيار القبول من غير أن يحسم إن كان المقصود الخلاص النهائي أم الأهلية للخدمة أو المكافأة.
- source_word: γένωμαι
  choice: أَصِيرَ
  rationale: يحفظ المعنى الاستقبالي للفعل في صيغة النتيجة المخوفة.
- source_word: ἀλλὰ
  choice: بَلْ
  rationale: تفيد الاستدراك والانتقال المقابل لما سبق بقوة طبيعية في العربية.
theological_decisions:
- issue: مدلول خوف بولس من أن يصير ἀδόκιμος
  choice: «غير مؤهل» ضمن صورة الاختبار الرياضي، من غير تحديد نوع عدم الأهلية
  alternative: «مرفوضًا» بمعنى خلاصي نهائي، أو «مستبعدًا» من الخدمة أو المكافأة وحدهما
  rationale: السياق المباشر سياق سباق وضبط للنفس ونيل الجائزة. لذلك ينبغي إبقاء التحذير جادًا مع عدم حسم الخلاف اللاهوتي بما يتجاوز النص اليوناني.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، تحافظ على توازي الفعلين وقوة الاستعارة، وعلى التوتر اللاهوتي في خاتمة الآية. وُضعت علامات الحواشي في المتن بحسب ترتيب ظهورها الصحيح.
