source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: ar
  text: ألستُ حرًّا؟ ألستُ رسولًا؟ ألم أرَ يسوعَ ربَّنا؟ ألستم أنتم عملي في الرب؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: حرًّا
  rationale: ينقل المعنى المباشر للحرية وما يتصل بها من حقوق في سياق حجة بولس.
- source_word: ἀπόστολος
  choice: رسولًا
  rationale: يحفظ المعنى الاصطلاحي لخدمة بولس الرسولية، لا معنى المبعوث العادي فحسب.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: يسوع ربَّنا
  rationale: يتبع ترتيب اليونانية ويصوغ اللقب المسيحاني بلغة عربية طبيعية واضحة.
- source_word: ἑόρακα
  choice: رأيتُ
  rationale: الماضي العربي هو التعبير الطبيعي عن واقعة الرؤية التي تظل لها دلالة حاضرة في إثبات رسوليته، من غير إضافة «القائم» التي لا يصرح بها النص.
- source_word: ἔργον
  choice: ثمرة عملي
  rationale: يوضح أن المؤمنين في كورنثوس هم حصيلة عمل بولس الرسولي؛ وهو أنسب عربيًا من وصف الأشخاص بأنهم «عملي» مع حفظ المجاز.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ العبارة البولسية المألوفة ودلالتها على المجال أو العلاقة التي فيها صار الكورنثيون ثمرة عمله.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: ألستُ...؟ / أما رأيتُ...؟ / ألستم...؟
  rationale: ينقل الأسئلة الإنكارية التي تنتظر جوابًا بالإيجاب بصياغة عربية فصيحة وطبيعية.
theological_decisions:
- issue: دلالة قول بولس إنه رأى يسوع
  choice: 'إبقاء العبارة على بساطتها: «أما رأيتُ يسوع ربَّنا؟» بوصفها سندًا لرسوليته في السياق'
  alternative: التصريح بأنه رأى يسوع المقام
  rationale: يرجح السياق أن المقصود رؤية يسوع بعد القيامة تأييدًا لرسوليته، لكن اليونانية لا تذكر «المقام» صراحة، لذلك لا تُضاف إلى الترجمة.
- issue: وصف الكورنثيين بأنهم ἔργον بولس
  choice: «ثمرة عملي»
  alternative: «عملي»
  rationale: تؤدي العبارة معنى كون الجماعة حصيلة خدمته من غير أن توحي بملكية روحية مستقلة عن الرب، مع إبقاء «في الرب» صريحة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. روعي تتابع الأسئلة البلاغية وإيقاعها، مع الحفاظ على عبارة «في الرب» وعلى عدم تفسير رؤية يسوع تفسيرًا زائدًا داخل المتن.
