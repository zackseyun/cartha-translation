  rationale: حُذفت الإضافة التفسيرية «ثمرة» لاستعادة المجاز المباشر في ἔργον، واستُبدلت صيغة السؤال الثالث بـ«ألم أرَ» لصياغة عربية معيارية طبيعية للأسلوب الاستنكاري. ولا يلزم إدراج الحاشية الإنجليزية الخاصة بترتيب الكلمات، إذ إن العربية تعتمد ترتيب «يسوع ربنا» الطبيعي ولا ينشأ فيها بديل دلالي مؤثر.
