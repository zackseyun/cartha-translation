  source_fidelity: تحتاج «ثمرة عملي» إلى تصحيح؛ فـἔργον تعني «عمل»، ولا تتضمن لفظ «ثمرة» الذي يضيف تصويرًا غير موجود في الأصل. أما الأسئلة الاستنكارية، و«حرًّا»، و«رسولًا»، و«يسوع ربنا»، و«في الرب» فتنقل اليونانية بأمانة.
  naturalness: الصياغة المقترحة فصيحة واضحة وتحافظ على الإيقاع المتوازي للأسئلة البلاغية. «ألم أرَ» أفصح وأشيع في العربية المعيارية من «أما رأيتُ» في هذا الموضع، مع بقاء الدلالة الاستنكارية نفسها.
  terminology: «رسول» مناسب للمصطلح الرسولي هنا، و«الرب» مناسب للقب κύριος. تُحفظ عبارة «في الرب» كما هي دون تفسير لاهوتي زائد.
