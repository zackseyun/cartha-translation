  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: ar
  text: وكلُّ مَن يتنافس يضبط نفسه في كلِّ شيء. فأولئك يفعلون ذلك لينالوا إكليلًا يفنى[a]، أمّا نحن فلأجل إكليلٍ لا يفنى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إكليل فوز»؛ فاللفظة اليونانية تشير إلى الإكليل الذي كان يُمنح للفائز في المسابقات الرياضية.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: كلُّ مَن يتنافس
  rationale: ينقل التركيب المفرد ذا الدلالة العامة، ويحافظ على صورة المنافسة الرياضية في السياق بلغة عربية طبيعية.
- source_word: πάντα ἐγκρατεύεται
  choice: يضبط نفسه في كلِّ شيء
  rationale: يعبّر عن ممارسة الامتناع والانضباط على نحو معتاد، مع إبقاء نطاق πάντα واسعًا من غير حصره في الطعام أو التدريب.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: فأولئك يفعلون ذلك
  rationale: يشير إلى المتنافسين المذكورين ويستعيد الفعل المفهوم من السياق، كما تفعل اليونانية ضمن المقابلة مع ἡμεῖς δέ.
- source_word: ἵνα ... λάβωσιν
  choice: لينالوا
  rationale: ينقل دلالة الغاية بإيجاز عربي واضح.
- source_word: φθαρτὸν στέφανον
  choice: إكليلًا يفنى
  rationale: الإكليل هو الجائزة التي كانت توضع على رأس الفائز في المسابقات؛ و«يفنى» يقيم المقابلة المباشرة مع «لا يفنى».
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: أمّا نحن فلننـال إكليلًا لا يفنى
  rationale: يوضح الفعل والاسم المحذوفين اللذين يُفهمان من العبارة السابقة، وهو إضمار طبيعي في اليونانية لكنه يحتاج إلى إظهارهما لتستقيم العربية.
theological_decisions:
- issue: ماهية المكافأة التي يرمز إليها الإكليل
  choice: الإبقاء على صورة الإكليل الذي لا يفنى دون تعيين مدلوله العقائدي
  alternative: تفسير الإكليل صراحةً بالحياة الأبدية أو بمكافآت سماوية محددة
  rationale: الآية نفسها لا تعرّف مدلول الإكليل بمزيد من التحديد، ولذلك يحفظ النص الصورة والتوتر اللاهوتي من غير فرض تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يتنافس» لإبقاء السياق الرياضي، و«يضبط نفسه» لتوصيل الانضباط الإرادي المعتاد. لم تُضف أداة زمنية مثل «الآن» لعدم وجود مقابل صريح لها في المصدر.
