    reason: توضيح البديل الدلالي وسبب إبقاء صورة العبودية
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: حرّ
  rationale: ينقل معنى الحرية من الخضوع أو الالتزام، ويحافظ على التضاد البلاغي مع «عبدًا».
- source_word: ἐκ πάντων
  choice: من الجميع
  rationale: يحافظ على العبارة اليونانية الموجزة، ويفيد أن بولس غير خاضع لأيٍّ منهم.
- source_word: πᾶσιν
  choice: للجميع
  rationale: ينقل صيغة المجرور الدالة على الذين أخضع بولس نفسه لهم، ويحافظ على التوازي بين «من الجميع» و«للجميع».
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: جعلت نفسي عبدًا
  rationale: يحافظ على لغة العبودية الصريحة وعلى الفعل الإرادي الانعكاسي، كما يبرز التضاد المقصود مع كونه حرًّا.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي معنى الغاية بوضوح في العربية المعاصرة.
- source_word: τοὺς πλείονας
  choice: عددًا أكبر
  rationale: ينقل المقارنة العددية من غير أن يحولها إلى «أكثرهم» أو إلى المعنى الأقوى «أكبر عدد ممكن».
- source_word: κερδήσω
  choice: أربح
  rationale: يحافظ على استعارة الكسب التي يستخدمها بولس في سياق خدمته للناس.
theological_decisions:
- issue: نقل لغة العبودية في ἐδούλωσα
  choice: عبدًا
  alternative: خادمًا
  rationale: التضاد بين «حرّ» و«جعلت نفسي عبدًا» محوري في الحجة؛ لذلك حُفظت صورة العبودية بدل تخفيفها إلى مجرد الخدمة.
- issue: العلاقة المنطقية في ὢν
  choice: مع أنني
  alternative: إذ أنا
  rationale: السياق والتركيب يبرزان مفارقة تنازل بولس الطوعي عن حقوقه مع كونه حرًّا، لكن الصياغة لا تنفي إمكان فهم اسم الفاعل على نحو وصفي أبسط.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، مع الحفاظ على التوازي البلاغي «من الجميع/للجميع» وعلى التوتر بين الحرية والاستعباد الطوعي. استُعمل «عددًا أكبر» لعدم تحديد طرف المقارنة الذي يتركه الأصل ضمنيًّا.
