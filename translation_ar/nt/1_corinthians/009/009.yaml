  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: ar
  text: 'فقد كُتب في شريعة موسى: «لا تَكُمَّ ثورًا وهو يدرس الحَبّ»[a]. أبالثيران يهتمّ الله؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهو يدوس الحَبّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: فقد كُتب في شريعة موسى
  rationale: تنقل «في شريعة موسى» تركيب ἐν مع الإضافة بعبارة عربية كتابية طبيعية، وتؤدي «فـ» وظيفة γάρ في ربط الاستشهاد بالحجة السابقة.
- source_word: γέγραπται
  choice: كُتب
  rationale: صيغة عربية مألوفة لإدخال اقتباس من الأسفار المقدسة، وتحافظ على دلالة الصيغة المبنية للمجهول من غير تكلف.
- source_word: Οὐ κημώσεις
  choice: لا تَكُمَّ
  rationale: نهي عربي مباشر ودقيق؛ والفعل «كمَّ» يعني وضع الكمام على فم الحيوان ومنعه من الأكل.
- source_word: βοῦν
  choice: ثورًا
  rationale: لفظ واضح ودقيق لحيوان البقر العامل المذكور في سياق الدرس.
- source_word: ἀλοῶντα
  choice: وهو يدرس الحَبّ
  rationale: ينقل اسم الفاعل الدال على الفعل الجاري، ويستعمل «يدرس» بمعناه الزراعي، مع ذكر الحَبّ لتوضيح هذا المعنى للقارئ الحديث.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: أَلَعَلَّ الله يهتمّ بالثيران؟
  rationale: تحافظ صيغة الاستفهام على القوة البلاغية للسؤال الذي يقدمه μή مع توقع جواب بالنفي، من غير إضافة «فقط» أو نفي عناية الله بالحيوانات نفيًا صريحًا.
theological_decisions:
- issue: سؤال بولس البلاغي عن اهتمام الله بالثيران
  choice: أَلَعَلَّ الله يهتمّ بالثيران؟
  alternative: أَبِالثيران يهتمّ الله؟
  rationale: تُبقي الصياغة السؤال بلاغيًا ولا تضيف قيد «فقط» غير المذكور في اليونانية، وبذلك تحفظ التوتر بين حجة بولس وعناية الله بالخليقة بدل حسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يدرس الحَبّ» بالمعنى الزراعي، وأُثبت البديل الأوضح «يدوس الحَبّ» في الحاشية. وُضع مؤشر الحاشية بعد الاقتباس الذي تتعلق به.
