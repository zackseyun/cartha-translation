  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: ar
  text: وهكذا أيضًا أمر الرب الذين يعلنون الإنجيل[a] أن يعيشوا من الإنجيل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يبشّرون بالإنجيل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن يستمدّوا معيشتهم من الإنجيل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تربط العبارة بما سبق وتُظهر أن الأمر الآتي مماثل للأمثلة السابقة، بصياغة عربية طبيعية.
- source_word: καὶ
  choice: أيضًا
  rationale: تنقل الدلالة الإضافية، إذ ينضم أمر الرب إلى الشواهد السابقة في الحجة.
- source_word: ὁ κύριος
  choice: الرب
  rationale: المقابل العربي المألوف لـκύριος، مع إبقاء المرجع كما ورد في النص من غير إضافة «يسوع».
- source_word: διέταξεν
  choice: أمر
  rationale: يعبر عن توجيه ذي سلطان، وهو أنسب للسياق من ألفاظ الترتيب أو التنظيم.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: الذين يعلنون
  rationale: تنقل صيغة اسم الفاعل المعرّف ودلالة الإذاعة والإعلان في καταγγέλλω، بلغة واضحة ومعاصرة.
- source_word: τὸ εὐαγγέλιον
  choice: الإنجيل
  rationale: لفظ راسخ ومفهوم في السياق البولسي، ويحافظ على الاتساق الاصطلاحي.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: من الإنجيل
  rationale: تحافظ على صورة الأصل، حيث تدل ἐκ على مصدر المعيشة، ويبين السياق أن المقصود الإعالة المرتبطة بخدمة الإنجيل.
- source_word: ζῆν
  choice: أن يعيشوا
  rationale: يتعلق المصدر بالفعل «أمر»، وصيغة الجمع العربية توافق «الذين يعلنون» وتحافظ على لفظ «يعيش» بدل تفسيره داخل المتن.
theological_decisions:
- issue: مرجع «الرب»
  choice: الإبقاء على «الرب»، مع أن المرجح في السياق أنه الرب يسوع
  alternative: التصريح بـ«الرب يسوع» أو فهم اللفظ بوصفه إشارة إلهية عامة
  rationale: السياق البولسي يرجح الإشارة إلى تعليم يسوع، لكن الأصل لا يضيف اسمه؛ لذلك تُحفظ صياغة النص من غير توسيع تفسيري.
- issue: معنى «أن يعيشوا من الإنجيل»
  choice: الإبقاء على العبارة التي تدل في السياق على نيل الإعالة المادية بسبب خدمة الإنجيل
  alternative: 'صياغتها تفسيريا: «أن تكون معيشتهم من خدمة الإنجيل»، أو فهمها على أنها حياة روحية مستمدة من الإنجيل'
  rationale: موضوع السياق هو حق خدام الإنجيل في الدعم المادي. وتحافظ الترجمة على توتر العبارة الأصلية وصورتها، بينما توضح الحاشية المعنى المقصود المحتمل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. قُدّم المفعول «الذين يعلنون الإنجيل» قبل المصدر المؤول «أن يعيشوا» لتكون جملة «أمر» طبيعية في العربية، مع الحفاظ على جميع عناصر الأصل. وُضعت علامتا الحاشيتين بجوار العبارتين اللتين تفسرانهما.
