id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: ar
  text: لِلَّذِينَ لَيْسُوا تَحْتَ الشَّرِيعَةِ[a] صِرْتُ كَمَنْ لَيْسَ تَحْتَ الشَّرِيعَةِ، مَعَ أَنِّي لَسْتُ خَارِجَ شَرِيعَةِ اللهِ، بَلْ خَاضِعٌ لِشَرِيعَةِ الْمَسِيحِ[b]، لِكَيْ أَرْبَحَ الَّذِينَ لَيْسُوا تَحْتَ الشَّرِيعَةِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين بلا شريعة». والمقصود هنا الذين ليسوا تحت الشريعة الموسوية، لا بالضرورة أناسًا خارجين على كل قانون أخلاقي.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة العبارة اليونانية: «بل داخل شريعة المسيح».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: الذين ليسوا تحت الشريعة / كمن ليس تحت الشريعة
  rationale: يشير التعبير في السياق إلى الذين لا يخضعون للشريعة الموسوية، لا بالضرورة إلى أناس فاسدين أخلاقيًّا. وتحافظ الصياغة على التكرار مع تجنب إيحاء «عديمي الشريعة» بالتمرد والفوضى.
- source_word: ὡς
  choice: كَمَنْ
  rationale: تدل على الهيئة التي تكيّف بها بولس مع مخاطبيه، من غير أن تعني أنه صار بلا التزام تجاه الله.
- source_word: μὴ ὢν
  choice: مَعَ أَنِّي لَسْتُ
  rationale: تُظهر القوة الاستدراكية أو التنازلية للعبارة الحالية بصورة عربية طبيعية.
- source_word: θεοῦ
  choice: اللهِ
  rationale: أُدرجت في تركيب الإضافة «شريعة الله» تعبيرًا عن علاقة المضاف إليه المفهومة من اليونانية.
- source_word: ἔννομος
  choice: خَاضِعٌ لِشَرِيعَةِ
  rationale: تنقل معنى الوجود ضمن سلطان الشريعة أو الخضوع لها، وتقابل بوضوح عبارة «ليس تحت الشريعة».
- source_word: Χριστοῦ
  choice: الْمَسِيحِ
  rationale: المسيح هو المقابل العربي الطبيعي للقب Χριστός، والإضافة هنا تربط الشريعة بالمسيح.
- source_word: ἵνα
  choice: لِكَيْ
  rationale: تقدم غاية تكيّف بولس مع مخاطبيه.
- source_word: κερδάνω
  choice: أَرْبَحَ
  rationale: الفعل في السياق التبشيري يعني كسب الأشخاص، لا تحقيق ربح مالي، وصيغة النصب بعد «لكي» تلائم الغرض.
theological_decisions:
- issue: معنى ἄνομος في هذا السياق
  choice: من ليس تحت الشريعة الموسوية، ولا سيما غير اليهود
  alternative: الفاجر أو المتمرد الذي لا يراعي أي قانون أخلاقي
  rationale: يقابل السياق السابق بين اليهود أو الذين تحت الشريعة وبين الذين ليسوا تحتها. كما أن توضيح بولس بشأن شريعة الله وشريعة المسيح ينفي أن يكون مراده التحرر الأخلاقي المطلق.
- issue: دلالة ἔννομος Χριστοῦ
  choice: خاضع لشريعة المسيح
  alternative: داخل شريعة المسيح
  rationale: يحافظ الاختيار على إقرار بولس بخضوعه لله في علاقته بالمسيح، من غير أن يحسم بأكثر مما يسمح به النص طبيعة هذه الشريعة أو علاقتها التفصيلية بالشريعة الموسوية.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الراسخ والطبيعي، ويحفظ وظيفته اللقبية هنا.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ومهيبة. استُعملت «الشريعة» بدل «الناموس» لقربها من فهم القارئ المعاصر، مع الحفاظ على التمييز السياقي بين عدم الخضوع للشريعة الموسوية والخضوع لشريعة المسيح. أُضيف «صرت» اعتمادًا على الفعل المفهوم من سياق الآية السابقة، كما يقتضيه اكتمال العبارة بالعربية.
