source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: ar
  text: لكنني لم أستعمل شيئًا من هذه الأمور[a]. ولم أكتب هذه الأمور لكي يكون الأمر هكذا معي، فالأفضل لي أن أموت من أن— لن يُفرغ أحدٌ افتخاري من مضمونه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير أوضح بحسب السياق: «شيئًا من هذه الحقوق».'
    reason: lexical_alternative
  - marker: b
    text: 'ينقطع التركيب اليوناني بعد «من أن—»، ثم يُستأنف هكذا: «لن يُفرغ أحدٌ افتخاري من مضمونه». وتسوّي ترجمات كثيرة العبارة إلى: «من أن يُفرغ أحدٌ افتخاري من مضمونه».'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: أستعمل
  rationale: ينقل معنى الانتفاع بشيء أو استخدامه من غير إيحاء بإساءة الاستغلال، وتفيد صيغة النفي مع الزمن اليوناني أن بولس لم ينتفع بهذه الأمور إلى الآن.
- source_word: οὐδενὶ τούτων
  choice: شيئًا من هذه الأمور
  rationale: يحافظ على الإحالة العامة في اليونانية، بينما يوضح السياق أن المقصود هو الحقوق المتعلقة بالإعالة؛ وقد ذُكر هذا التفسير في الحاشية دون إدخاله في المتن.
- source_word: ἔγραψα ... ταῦτα
  choice: كتبت هذا
  rationale: صياغة عربية طبيعية تشير إلى ما كتبه بولس آنفًا، مع نقل الماضي اليوناني بصيغة الماضي البسيط.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: لكي يحدث ذلك في حالتي
  rationale: 'تحافظ العبارة على معنى الغاية وعلى إيجاز الأصل: لم يكتب بولس ليحصل هو شخصيًا على المعاملة التي وصفها.'
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: فخيرٌ لي أن أموت
  rationale: ينقل المفاضلة المؤكدة في الأصل بصياغة عربية فصيحة وطبيعية، من غير إضعاف حدّة القول.
- source_word: τὸ καύχημά μου
  choice: افتخاري
  rationale: يحافظ على إمكان أن يدل الاسم على الافتخار نفسه أو على أساسه وموضوعه، من غير حسم هذا التداخل الدلالي في المتن.
- source_word: κενώσει
  choice: يُفرغ ... من مضمونه
  rationale: يحفظ استعارة الإفراغ في الفعل اليوناني، ويوضح بالعربية أن المراد جعل الافتخار خاليًا من محتواه أو قيمته.
theological_decisions:
- issue: الانقطاع النحوي المفاجئ بعد ἤ
  choice: إبقاء العبارة منقطعة بعد «من أن—» ثم استئنافها بجملة «لن يُفرغ أحدٌ افتخاري من مضمونه»
  alternative: خيرٌ لي أن أموت من أن يُفرغ أحدٌ افتخاري من مضمونه
  rationale: يتوقف التركيب اليوناني بعد أداة المقارنة ولا يتممها نحويًا، ثم يستأنف الكلام بصيغة جديدة. إبقاء الشرطة يحفظ الانفعال والتوتر البلاغي في النص بدل تسويته بإضافة كلمات مقدرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ إيجاز الإحالات في الأصل، كما حُفظ الانقطاع البلاغي الحاد بدل استكماله تفسيريًا في المتن.
