  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: ar
  text: صِرتُ للضُّعفاء ضعيفًا[a]، لأربح الضُّعفاء. وقد صِرتُ للجميع كلَّ شيء، لكي أُخلِّص بعضًا بكلِّ وسيلة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للضُّعفاء في الضمير»؛ فقد يُطلَق هذا التعبير في 1 كورنثوس خصوصًا على ذوي الضمائر الحسّاسة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بكلِّ طريقة»؛ أي باستخدام كل وسيلة ممكنة سعيًا إلى هذه الغاية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: صِرتُ
  rationale: ينقل فعل γίνομαι بوصفه دخول بولس طوعًا في حال أو موقف يتلاءم مع من يخدمهم، ويحافظ على صيغة الماضي هنا.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: للضُّعفاء / ضعيفًا / الضُّعفاء
  rationale: يحافظ على تكرار الجذر في اليونانية وقوته البلاغية، من غير حصر المعنى في ضعف الضمير، وإن كان السياق قد يشمله.
- source_word: κερδήσω
  choice: لأربح
  rationale: «أربح» تعبير عربي موجز وطبيعي في سياق السعي إلى كسب أشخاص، ويحفظ صورة الفعل اليوناني.
- source_word: τοῖς πᾶσιν
  choice: للجميع
  rationale: ينقل تركيب الداتيف المختصر بوضوح، والسياق يبيّن أن المقصود جميع الناس أو الفئات.
- source_word: γέγονα
  choice: وقد صِرتُ
  rationale: «قد» مع الماضي توحي بالحالة المتحققة الناتجة من نهج بولس المستمر، بما يناسب دلالة صيغة التام اليونانية.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: 'يحافظ على شمول العبارة وإيجازها البلاغي: «للجميع كل شيء».'
- source_word: πάντως
  choice: بكلِّ وسيلة
  rationale: ينقل معنى استعمال شتى الوسائل لتحقيق الغاية، من دون الإيحاء بأن العبارة تبيح وسائل غير مشروعة.
- source_word: τινὰς
  choice: بعضًا
  rationale: يحفظ التنكير والتواضع المقصودين؛ فبولس لا يدّعي أنه سيخلّص الجميع.
- source_word: σώσω
  choice: أُخلِّص
  rationale: يحافظ على الدلالة الخلاصية الصريحة للفعل، وعلى إسناد الفعل إلى بولس كما في النص، من غير شرح دوره الأداتي داخل المتن.
theological_decisions:
- issue: المقصود بـ«الضُّعفاء»
  choice: 'إبقاء التعبير عامًا: «الضُّعفاء»'
  alternative: «الضُّعفاء في الضمير» أو «العاجزون»
  rationale: قد يشير اللفظ في 1 كورنثوس، ولا سيما في الأصحاحات 8–10، إلى ذوي الضمائر الحساسة، لكن صياغة الآية نفسها عامة، فلا ينبغي تضييقها في المتن.
- issue: قوة فعل «أُخلِّص»
  choice: إثبات «أُخلِّص» في المتن
  alternative: «أقود بعضًا إلى الخلاص» أو «أُسهم في خلاص بعض»
  rationale: يحمل σώζω لغة خلاص حقيقية، والنص يسند الفعل إلى بولس في إطار خدمته. إضعافه يبدّد قوة الأصل، أما شرح كون دوره أداتيًا داخل المتن فيضيف ما لم تصرّح به العبارة.
- issue: مدى عبارة πάντως
  choice: «بكلِّ وسيلة»
  alternative: «على كل حال» أو «مهما كلّف الأمر»
  rationale: تحافظ الصياغة المختارة على اتساع الوسائل التي يستخدمها بولس من أجل الغاية، دون تحويل العبارة إلى إقرار بالتنازل الأخلاقي.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ التكرار البلاغي للجذر «ضعف»، كما حُفظت العبارة المكثفة «للجميع كل شيء». وُضعت علامتا الحاشية بعد الموضع الذي تفسّره كل منهما مباشرة.
