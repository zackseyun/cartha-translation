base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: ar
  text: فَإِنْ كُنْتُ أُبَشِّرُ بِالْإِنْجِيلِ[a]، فَلَا سَبَبَ لِي لِلِافْتِخَارِ، لِأَنَّ ضَرُورَةً مَفْرُوضَةٌ عَلَيَّ؛ فَالْوَيْلُ لِي إِنْ لَمْ أُبَشِّرْ بِالْإِنْجِيلِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُعْلِنُ الْبِشَارَةَ». وينطبق ذلك أيضًا على ورود الفعل في آخر الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: أُبَشِّرُ بِالْإِنْجِيلِ
  rationale: الفعل يعني إعلان البشارة أو الخبر السار. والمفعول به محذوف في اليونانية، لكنه مفهوم في هذا السياق على أنه الإنجيل؛ لذلك جاء التعبير العربي طبيعيًا وصريحًا، مع توحيد الصياغة في الموضعين.
- source_word: καύχημα
  choice: مَجَالَ لِي لِلِافْتِخَارِ
  rationale: يدل الاسم على ما يكون أساسًا أو سببًا للافتخار، لا على مجرد التلفظ بالافتخار. وهذه الصياغة تنقل نفي بولس وجود أساس شخصي يعتد به.
- source_word: ἀνάγκη
  choice: ضَرُورَةً
  rationale: تنقل معنى الإلزام أو الاضطرار من غير أن تحدد في نص الآية مصدر هذا الإلزام.
- source_word: ἐπίκειται
  choice: مَفْرُوضَةٌ عَلَيَّ
  rationale: يفيد الفعل أمرًا واقعًا على بولس وضاغطًا عليه بوصفه التزامًا؛ والتعبير العربي واضح وطبيعي.
- source_word: οὐαί
  choice: الْوَيْلُ لِي
  rationale: يحافظ التعبير على النبرة الجادة والإنذارية، ولا يخففها إلى مجرد الأسف.
- source_word: ἐὰν μὴ
  choice: إِنْ لَمْ
  rationale: ينقل الشرط المنفي بصورة عربية مباشرة وموجزة.
- source_word: γάρ
  choice: فَـ / لِأَنَّ / فَـ
  rationale: 'نُقلت الروابط التفسيرية بحسب مقتضى العربية: افتتحت الآية بالفاء، وصُرّح بالتعليل في الجملة الوسطى، وربطت جملة الويل بما قبلها بالفاء لتجنب تركيب عربي متكلف.'
theological_decisions:
- issue: طبيعة الضرورة الواقعة على بولس للتبشير
  choice: صيغت على أنها ضرورة مفروضة عليه من غير تحديد مصدرها في هذه الآية.
  alternative: التصريح بأنها تكليف إلهي، أو وصفها بأنها دافع داخلي محض، أو إكراه ناشئ من الظروف.
  rationale: النص اليوناني يثبت وقوع الضرورة على بولس، لكنه لا يحدد هنا وحده مصدرها أو طبيعتها تفصيلًا؛ لذلك تُرك التوتر الدلالي قائمًا دون إدخال تفسير عقدي زائد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُخدم «أبشّر بالإنجيل» بوصفه تعبيرًا مألوفًا عن فعل إعلان الخبر السار، مع تجنب تحديد مصدر الضرورة بما يتجاوز منطوق الآية.
