  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: ar
  text: أأقول هذه الأمور من منظور بشري محض[a]؟ أم أليس الناموس أيضًا يقول هذه الأمور؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على طريقة البشر»؛ أو: «من وجهة نظر بشرية».'
    reason: بدائل معجمية لعبارة κατὰ ἄνθρωπον، التي قد تدل على المقياس أو المنظور البشري.
lexical_decisions:
- source_word: Μὴ
  choice: أَلَعَلِّي
  rationale: ينقل صيغة السؤال الإنكاري الذي يُنتظر له جواب بالنفي، مع إبقاء العبارة عربية طبيعية.
- source_word: κατὰ ἄνθρωπον
  choice: بحسب منظور بشري محض
  rationale: يعبّر عن الكلام وفق مقياس أو وجهة نظر بشرية فقط، في مقابل شهادة الناموس، ولا يحصر المعنى في مجرد كون المتكلم إنسانًا.
- source_word: ταῦτα
  choice: هذا
  rationale: استُعمل اسم الإشارة المفرد بوصفه تعبيرًا عربيًا طبيعيًا يحيل إلى مجموع الكلام السابق، مع أن اليونانية تستعمل صيغة الجمع «هذه الأشياء».
- source_word: λαλῶ
  choice: أقول
  rationale: المضارع مناسب لحديث بولس الجاري وحجته الحالية.
- source_word: ἢ
  choice: أم
  rationale: «أم» هي الأليق في العربية للانتقال إلى الشق البديل من السؤال.
- source_word: καὶ
  choice: أيضًا
  rationale: 'يحفظ القوة الإضافية: الناموس شاهد كذلك، إلى جانب الاعتبار المذكور قبلًا.'
- source_word: ὁ νόμος
  choice: الناموس
  rationale: يشير السياق المباشر إلى شريعة موسى، إذ تأتي بعده إحالة إلى تثنية 25:4؛ و«الناموس» تعبير كتابي عربي معروف دون إضافة تفسيرية إلى المتن.
- source_word: οὐ λέγει
  choice: أليس ... يقول
  rationale: يحافظ على بنية السؤال الإنكاري وعلى توقع الجواب بالإثبات بدل تسويته إلى خبر مثبت.
theological_decisions:
- issue: مرجع «الناموس» في حجة بولس
  choice: شريعة موسى أو المدونة التشريعية الكتابية
  alternative: قانون أو مبدأ عام
  rationale: الآية التالية تقتبس تثنية 25:4 صراحة، ولذلك أبقيت الإشارة إلى «الناموس» من غير توسيع مذهبي.
- issue: العلاقة بين الحجة البشرية وشهادة الناموس
  choice: الإبقاء على السؤالين الإنكاريين دون جعل أحدهما نافيًا لقيمة الآخر نفيًا مطلقًا
  alternative: صياغة تقريرية تفيد أن بولس لا يستخدم أي استدلال بشري
  rationale: النص يقابل بين الاقتصار على منظور بشري وبين شهادة الناموس، لكنه لا يصرح برفض كل تعليل بشري؛ لذا حُفظ التوتر البلاغي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الناموس» للدلالة الكتابية المحددة، وحُفظت صيغة السؤال الإنكاري في الشقين. وُضعَت علامة الحاشية [a] في المتن.
