  text: Do we not have the right to eat and drink?[a]
translation:
  language: ar
  text: أَلَيْسَ لَنَا الْحَقُّ أَنْ نَأْكُلَ وَنَشْرَبَ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَلَيْسَ لَنَا السُّلْطَانُ أَنْ نَأْكُلَ وَنَشْرَبَ؟». والمقصود هنا حقٌّ مشروع أو حرية مأذون بها، ويرجح في سياق حجة بولس أنه يشير إلى تلقي الإعالة المادية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: أَلَيْسَ لَنَا
  rationale: يفيد التركيب سؤالًا إنكاريًّا ينتظر جوابًا بالإيجاب، وهذه صياغة عربية طبيعية تحفظ قوته الاستفهامية.
- source_word: ἔχομεν
  choice: لَنَا
  rationale: تؤدي اللام معنى الامتلاك في هذا السياق على نحو أفصح وأطبع من الترجمة الحرفية «نملك».
- source_word: ἐξουσίαν
  choice: الْحَقُّ
  rationale: السياق يتحدث عن استحقاق مشروع وحرية مأذون بها للرسول، لا عن سلطة حكم أو قدرة مجردة.
- source_word: φαγεῖν
  choice: أَنْ نَأْكُلَ
  rationale: ترجمة مباشرة للمصدر، ملائمة بعد «الحق» في العربية.
- source_word: καὶ πεῖν
  choice: وَنَشْرَبَ
  rationale: العطف داخل تركيب «أن نأكل ونشرب» طبيعي، ولا حاجة إلى تكرار «أن».
theological_decisions:
- issue: نطاق الحق الرسولي في السياق
  choice: 'يبقى النص الرئيس عامًا: الحق في الأكل والشرب، مع بيان احتمال الإعالة المادية في الحاشية.'
  alternative: التصريح في المتن بالحق في تلقي الطعام والشراب أو الإعالة من الكنائس.
  rationale: يتناول سياق الأصحاح حقوق الرسول، ويرجح أن المقصود تلقي الدعم المادي؛ لكن اللفظ اليوناني نفسه لا يصرح بمصدر الطعام والشراب، لذلك لا ينبغي تقييد المعنى في المتن.
translation_notes:
  register: عربية فصحى واضحة وموقرة؛ استُخدم السؤال الإنكاري الطبيعي «أليس لنا» للحفاظ على توقع الجواب بالإيجاب، مع تجنب إدخال معنى الإعالة صراحة في المتن.
