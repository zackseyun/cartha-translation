  to: فما هي إذًا مكافأتي؟ أن أقدّم البشارة مجانًا حين أبشّر، لكي لا أستعمل حقي في خدمة البشارة استعمالًا كاملًا.[a]
  rationale: تُبقي المراجعة جميع اختيارات المعنى الأساسية، لكنها تستبدل تركيبًا عربيًا أقل سلاسة بتركيب فصيح يعبّر عن الغاية في اليونانية وعن معنى «استخدام الحق استخدامًا كاملًا». وتُحافَظ الحاشية على الصياغة الحرفية وإمكان المعنى المتصل بخدمة البشارة.
