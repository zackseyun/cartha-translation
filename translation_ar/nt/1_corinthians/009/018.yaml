source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: ar
  text: فما هي إذًا مكافأتي؟ أن أقدّم البشارة مجانًا حين أبشّر، لكي لا أستعمل حقي في خدمة البشارة استعمالًا كاملًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في البشارة»؛ أي الحق المتصل بالتبشير بها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: مكافأتي
  rationale: تفيد الجزاء أو العوض، وتلائم السؤال البلاغي والمفارقة في أن مكافأة بولس هي تقديم البشارة بلا مقابل.
- source_word: εὐαγγελιζόμενος
  choice: حين أبشّر
  rationale: يحفظ القوة الفعلية لاسم الفاعل ويدل على أن تقديم البشارة مجانًا يقع في أثناء التبشير.
- source_word: ἀδάπανον
  choice: مجانًا
  rationale: تعبير عربي طبيعي واضح لمعنى تقديم الشيء من غير كلفة أو مقابل مالي.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: أقدّم البشارة
  rationale: الفعل يعني حرفيًا الوضع أو الجعل، لكنه هنا يدل سياقيًا على عرض البشارة أو تقديمها.
- source_word: εὐαγγέλιον
  choice: البشارة
  rationale: لفظ عربي واضح ومألوف ينقل معنى الخبر السار مع ملاءمته للسياق المسيحي.
- source_word: καταχρήσασθαι
  choice: أستعمل كامل
  rationale: ينقل معنى الاستعمال التام دون أن يحمّل الفعل بالضرورة معنى إساءة الاستغلال.
- source_word: ἐξουσίᾳ
  choice: حقي
  rationale: السياق يتناول استحقاق الرسول المشروع للنفقة، ولذلك «حق» أدق هنا من «سلطان».
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: في خدمة البشارة
  rationale: يبيّن المقصود السياقي، أي الحق المتصل بعمل التبشير، بدل العبارة العربية الملتبسة «في البشارة».
theological_decisions:
- issue: طبيعة ἐξουσία في السياق
  choice: حق بولس المشروع في نيل الدعم في خدمة البشارة، وهو لا يستعمله كاملًا بمحض اختياره.
  alternative: سلطانه الرسولي بوجه أعم، أو استعمال للسلطة ينطوي على إساءة.
  rationale: يعالج سياق الأصحاح مرارًا حق العامل الرسولي في النفقة؛ لذلك تجنبت الصياغة الإيحاء بأن الحق نفسه تعسفي أو أن استعماله إساءة.
- issue: دلالة ἐν τῷ εὐαγγελίῳ
  choice: في خدمة البشارة
  alternative: في البشارة؛ أو بسبب البشارة.
  rationale: العبارة اليونانية موجزة ويمكن أن تعني الحق المتصل بالبشارة أو بخدمتها. أُثبت المعنى السياقي الأوضح في المتن، مع الإشارة في الحاشية إلى الصياغة الأقرب حرفيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حافظت الصياغة على السؤال البلاغي ومفارقة كون المكافأة هي التبشير مجانًا، وابتعدت عن ألفاظ قد توحي بإساءة استعمال السلطة من غير ضرورة سياقية.
