  text: ἐγὼ τοίνυν οὕτως τρέχω ὡς οὐκ ἀδήλως, οὕτως πυκτεύω ὡς οὐκ ἀέρα δέρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: ar
  text: إذًا، أنا أركض هكذا، لا بلا هدف[a]؛ وألاكم هكذا، لا كمن يضرب الهواء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لا على غير يقين». يمكن للظرف اليوناني أن يدل على غياب الوضوح أو غياب الهدف المحدد؛ وفي صورة السباق تبرز عبارة «بلا هدف» معنى الركض من غير غاية واضحة.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: إذًا
  rationale: تفيد الانتقال الاستنتاجي من التشبيه الرياضي السابق إلى تطبيق بولس الشخصي، بصياغة عربية طبيعية موجزة.
- source_word: οὕτως
  choice: هكذا
  rationale: حُفظ تكرارها مرتين لإبراز كيفية الركض والملاكمة والمحافظة على توازي العبارة اليونانية.
- source_word: τρέχω
  choice: أركض
  rationale: ينقل صورة السباق الرياضية مباشرة، مع إبقاء المضارع بوصفه وصفًا حيًّا مستمرًّا.
- source_word: ἀδήλως
  choice: بلا هدف
  rationale: في سياق السباق، تعبّر العبارة عن غياب الغاية أو الوجهة الواضحة، مع الإشارة في الحاشية إلى معنى عدم اليقين الممكن.
- source_word: πυκτεύω
  choice: ألاكم
  rationale: الفعل اليوناني خاص بالملاكمة، و«ألاكم» هو المقابل العربي الحديث المباشر.
- source_word: ἀέρα
  choice: الهواء
  rationale: يحفظ المفعول الحرفي والصورة الرياضية للكمات التي لا تصيب خصمًا.
- source_word: δέρων
  choice: يضرب
  rationale: ينقل فعل توجيه الضربات بوضوح وطبيعية، وقد صيغ ضمن «كمن يضرب» لإظهار أن بولس ينفي هذه الكيفية عن ملاكمته.
