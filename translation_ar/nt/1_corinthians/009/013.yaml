base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: ar
  text: ألا تعلمون أن القائمين بالخدمة المقدسة يأكلون مما يأتي من الهيكل[a]، وأن الذين يخدمون عند المذبح ينالون نصيبًا مما يُقدَّم عليه[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصورة أقرب إلى اللفظ: «الذين يعملون في الأمور المقدسة يأكلون الأشياء الآتية من الهيكل».'
    reason: lexical_alternative
  - marker: b
    text: 'وبصورة حرفية: «يقتسمون مع المذبح»، أي ينالون نصيبًا من الذبائح المقدَّمة عليه.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: أما تعلمون
  rationale: صيغة استفهام إنكاري طبيعية في العربية الفصحى، وتحافظ على أسلوب بولس الخطابي.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: القائمين بالخدمة المقدسة
  rationale: تنقل معنى مزاولة الأعمال أو الشؤون المقدسة في سياق خدمة الهيكل، من غير حصر العبارة في بنية كنسية لاحقة.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: يأكلون مما يأتي من الهيكل
  rationale: تحافظ على فعل الأكل وعلى كون الهيكل مصدر القوت، مع صياغة عربية واضحة.
- source_word: ἱεροῦ
  choice: الهيكل
  rationale: يدل ἱερόν هنا على الهيكل أو نطاقه المقدس، و«الهيكل» هو المقابل العربي المألوف والدقيق في هذا السياق.
- source_word: παρεδρεύοντες
  choice: يخدمون عند
  rationale: يفيد الوجود إلى جانب المذبح بقصد خدمته؛ وهذه الصياغة تجمع الدلالة المكانية والوظيفية.
- source_word: θυσιαστηρίῳ
  choice: المذبح
  rationale: المقابل العربي القياسي لمذبح الذبائح.
- source_word: συμμερίζονται
  choice: ينالون نصيبًا مما يُقدَّم عليه
  rationale: يوضح أنهم يشتركون في أنصبة الذبائح المرتبطة بالمذبح، بدل التعبير الحرفي الملتبس «يقتسمون مع المذبح».
theological_decisions:
- issue: صورة العبادة ومصدر إعالة خدامها
  choice: إبقاء قياس بولس قائمًا على أن خدام الهيكل والمذبح يقتاتون من الخدمة المقدسة نفسها
  alternative: 'صياغة العبارة الأخيرة حرفيًا: «يقتسمون مع المذبح»'
  rationale: يحفظ النص مبدأ نيل القائمين بالخدمة المقدسة نصيبًا من التقدمات، من غير إدخال نظم كنسية لاحقة أو تحديد عقائدي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الهيكل» لـἱερόν و«المذبح» لـθυσιαστήριον، مع الحفاظ على الاستفهام الإنكاري وعلى صورة الأكل والاقتسام دون توسيع كنسي أو مذهبي.
