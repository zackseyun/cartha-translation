  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: ar
  text: 'أم إنه يقول ذلك حقًّا من أجلنا؟ نعم، فإنه من أجلنا كُتب: ينبغي للذي يحرث أن يحرث على رجاء، وللذي يدرس أن يدرس على رجاء أن ينال نصيبًا.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «حقًّا» بـ«بالتأكيد» أو «كليًّا». فاللفظة اليونانية πάντως تؤدي هنا وظيفة توكيدية، وقد تُفهم أيضًا بمعنى الشمول.
    reason: lexical_alternative
  - marker: b
    text: لا تذكر اليونانية صراحةً الشيء الذي ينال منه الدارس نصيبًا؛ فهو مفهوم من السياق الزراعي.
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: بلا شك
  rationale: تؤدي العبارة وظيفة توكيدية في السؤال البلاغي، وتبقي احتمال فهم اللفظة بمعنى «حقًّا/بالتأكيد» دون فرض معنى الحصر «كليًّا».
- source_word: δι’ ἡμᾶς
  choice: من أجلنا
  rationale: تنقل معنى التعليل أو المنفعة الذي تؤديه διά مع النصب في سياق حجة بولس.
- source_word: ἐγράφη
  choice: كُتب
  rationale: صيغة ماضٍ مبني للمجهول طبيعية ومطابقة للماضي اليوناني في صيغة الاستشهاد.
- source_word: ὀφείλει
  choice: ينبغي
  rationale: تحفظ معنى الاستحقاق أو الالتزام المعياري دون المبالغة في معنى الإكراه.
- source_word: ἐπ’ ἐλπίδι
  choice: على رجاء
  rationale: صياغة عربية موجزة تحفظ صورة العمل القائم على توقع نيل نصيب.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: للذي يحرث أن يحرث
  rationale: تحفظ التكرار والبنية العامة في الأصل بصياغة عربية مفهومة.
- source_word: ὁ ἀλοῶν
  choice: للذي يدرس أن يدرس
  rationale: «يدرس» هنا بمعنى يدوس الحب ويفصل الحبوب عن سنابلها، وهو المقابل الزراعي العربي للفعل اليوناني، مع المحافظة على موازاة عبارة الحرث.
- source_word: τοῦ μετέχειν
  choice: أن يكون له نصيب
  rationale: ينقل معنى المشاركة أو نيل حصة، مع عدم إضافة مفعول كالحصاد أو المحصول غير مذكور صراحة في اليونانية.
theological_decisions:
- issue: دلالة πάντως في السؤال البلاغي
  choice: بلا شك
  alternative: كليًّا / حصرًا
  rationale: يمكن أن تحمل اللفظة معنى التوكيد أو الشمول. اختير التوكيد لأنه أنسب لاستمرار الحجة في «بل من أجلنا كُتب»، مع التنبيه إلى البديل في الحاشية.
- issue: المفعول المحذوف مع τοῦ μετέχειν
  choice: 'إبقاء الشيء المشارَك فيه غير مصرّح به: «أن يكون له نصيب»'
  alternative: أن يكون له نصيب في المحصول / الحصاد
  rationale: الأصل اليوناني لا يذكر المفعول، وإبقاؤه ضمنيًّا يصون هذا القدر من الغموض من غير إقحام تفسير زراعي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «يدرس» بالمعنى الزراعي، لا بمعنى يتعلّم، وحُفظ التوازي بين الحرث والدراس. وُضع مؤشر الحاشية في المتن كما يلزم.
