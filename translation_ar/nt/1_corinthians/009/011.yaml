  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: ar
  text: إن كنا نحن قد زرعنا لكم الأمور الروحية، أفكثيرٌ أن نحصد نحن منكم الأمور المادية؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمور الجسدية». يقابل اليوناني بين «الأمور الروحية» وما يخص الحياة الجسدية أو المادية العادية، من غير أن يدل هنا على معنى أخلاقي سلبي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: الأمور الروحية
  rationale: الصفة المحايدة الجمع مستعملة استعمال الاسم، وتدل على نحو واسع على ما قُدِّم لهم من نفع أو خدمة روحية، من غير حصرها في بركات بعينها.
- source_word: ἐσπείραμεν
  choice: قد زرعنا
  rationale: يحافظ التعبير على صورة الزرع وعلى كون الخدمة قد وقعت، مع بقاء أثرها في الحاضر.
- source_word: μέγα
  choice: كثيرًا
  rationale: في هذا السؤال البلاغي يفيد اللفظ معنى الأمر الكبير أو المفرط؛ وصيغة «أفيكون كثيرًا» عربية طبيعية تنقل الاستنكار من عدِّ الطلب مبالغًا فيه.
- source_word: τὰ σαρκικὰ
  choice: الأمور المادية
  rationale: السياق يتحدث عن مؤونة الخدمة وما يتصل بالحياة الجسدية والزمنية، لا عن السلوك الخاطئ؛ و«المادية» توضح المقابلة مع «الروحية» من غير إيحاء أخلاقي سلبي.
- source_word: θερίσομεν
  choice: نحصد
  rationale: يبقي على استعارة الزرع والحصاد، ويؤدي معنى تلقي المؤونة الناتجة عن خدمتهم.
- source_word: ὑμῶν
  choice: منكم
  rationale: ينقل المضاف إليه اليوناني بوصفه مصدر ما يُحصد، أي إن المؤونة تأتي من أهل كورنثوس.
- source_word: ἡμεῖς
  choice: نحن / ضمير المتكلمين في «زرعنا» و«نحصد»
  rationale: العربية تدل على ضمير المتكلمين داخل الفعل، ويظل التقابل البلاغي واضحًا من تكراره في الشرط والجواب من غير حاجة إلى إقحام ضمير منفصل ثقيل.
theological_decisions:
- issue: دلالة τὰ σαρκικὰ في مقابل τὰ πνευματικὰ
  choice: الأمور المادية، أي المؤونة العملية أو الجسدية للخدمة
  alternative: الأمور الجسدية أو اللحمية بمعنى أخلاقي سلبي
  rationale: يدافع بولس في السياق عن حق العاملين في الخدمة في تلقي المؤونة. فالمقابلة هنا بين العطاء الروحي والدعم المادي الزمني، لا بين القداسة والخطيئة.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، تحفظ السؤال البلاغي واستعارة الزرع والحصاد. وُضع مؤشر الحاشية بعد الجملة التي تتضمن البديل المعجمي، مع تجنب لفظ «اللحمية» لما قد يحدثه من لبس في العربية.
