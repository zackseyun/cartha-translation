revisions:
- from: لأني إن كنت أفعل هذا طوعًا، فلي مكافأة؛ أما إن كنت أفعله رغمًا عن إرادتي، فقد اؤتمنت على تدبيرٍ[a].
  to: فإن كنت أفعل هذا طوعًا، فلي مكافأة؛ أما إن كنت أفعله رغمًا عن إرادتي، فقد اؤتمنت على مسؤوليةٍ[a].
  rationale: استُبدلت «تدبير» بـ«مسؤولية» لأنها أوضح في العربية المعاصرة لمعنى أمانة أو مهمة موكولة، مع إبقاء «وكالة» بديلًا هامشيًا مشروعًا. وحُسِّن الاستهلال إلى «فإن» مع الحفاظ على عمومية «أفعل هذا»، وعلى التوتر النصي بين المكافأة والخدمة المؤتمن عليها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي محفوظ: المقابلة بين العمل طوعًا والعمل بغير طوع، وبين «مكافأة» وكون بولس مؤتمنًا على مسؤولية، ظاهرة في المسودة. لكن «تدبير» في العربية المعاصرة يدل غالبًا على التخطيط أو الإجراء، ولا ينقل بوضوح οἰκονομία بوصفها مسؤولية/أمانة موكولة إلى شخص.'
  naturalness: «فقد اؤتمنت على تدبير» غير مألوفة نسبيًا وقد توحي بأن بولس مؤتمن على خطة أو ترتيب. «مسؤولية» أوضح وأيسر في الفصحى المعاصرة. كما أن افتتاح الآية بـ«فإن» يعكس γάρ + εἰ بسلاسة أكبر من «لأني إن».
  terminology: «مكافأة» مناسبة لـ μισθός في هذا السياق، و«طوعًا» و«رغمًا عن إرادتي» ينقلان التقابل المقصود دون تفسير مذهبي. ويصلح «وكالة» بديلًا هامشيًا لـ οἰκονομία، لكن ينبغي أن يكون المتن أوضح في معنى المسؤولية الموكولة.
  issues:
  - severity: medium
    issue: استعمال «تدبير» لترجمة οἰκονομία
    rationale: لا يوضح في الاستعمال العربي الحديث معنى الوكالة أو المسؤولية التي اؤتمن عليها الشخص، وقد يُفهم بمعنى خطة أو تنظيم.
  - severity: low
    issue: تركيب «لأني إن كنت»
    rationale: مفهوم، لكن «فإن كنت» أيسر وأقرب إلى البناء الشرطي في الأصل، ويجنب الإيحاء السببي الزائد الذي قد تحمله «لأني» في هذا الموضع.
  revised_text: فإن كنت أفعل هذا طوعًا، فلي مكافأة؛ أما إن كنت أفعله رغمًا عن إرادتي، فقد اؤتمنت على مسؤوليةٍ[a].
