  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: ar
  text: فإن كنت أفعل هذا طوعًا، فلي مكافأة؛ أما إن كنت أفعله رغمًا عن إرادتي، فقد اؤتمنت على مسؤوليةٍ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فقد اؤتمنت على وكالة».'
    reason: بديل معجمي لـ οἰκονομίαν πεπίστευμαι يبرز معنى الوكالة أو التكليف الموكَل.
lexical_decisions:
- source_word: ἑκὼν
  choice: طوعًا
  rationale: تؤدي معنى الفعل بإرادة واختيار، وهي موجزة وتحافظ على المقابلة المباشرة مع ἄκων.
- source_word: τοῦτο πράσσω
  choice: أفعل هذا
  rationale: صياغة عربية طبيعية تبقي الإشارة عامة كما في اليونانية، من غير أن تحدد عمل الخدمة بأكثر مما يحدده السياق.
- source_word: μισθὸν
  choice: مكافأة
  rationale: تشمل معنى الجزاء الذي يناله المرء، وهي أنسب في السياق من «أجرة» التي قد توحي براتب أو مقابل مالي محض.
- source_word: ἄκων
  choice: رغمًا عن إرادتي
  rationale: تحافظ على التضاد مع «طوعًا» من غير إضافة معنى التردد العاطفي الذي قد تحمله ألفاظ مثل «مكرهًا» في بعض الاستعمالات.
- source_word: οἰκονομίαν
  choice: تدبير
  rationale: ينقل معنى إدارة أمر عُهد به إلى شخص بوصفه مؤتمنًا عليه، مع إبقاء صورة المسؤولية الموكلة دون حصرها في منصب كنسي محدد.
- source_word: πεπίστευμαι
  choice: فقد اؤتمنت
  rationale: يعكس المبني للمجهول وحالة الائتمان المستمرة الناتجة عن الفعل التام في اليونانية.
theological_decisions:
- issue: طبيعة خدمة بولس في الجملة الثانية
  choice: حتى إن لم يؤدِّ بولس العمل طوعًا، فإنه يظل مؤتمنًا على مسؤولية عُهد بها إليه.
  alternative: لا تكون له مكافأة عند العمل رغمًا عن إرادته، بل لا يبقى له إلا أداء واجب مفروض؛ أو إن الكلام يقابل بين الخدمة الطوعية والمنصب الإلزامي.
  rationale: يقابل النص بين «فلي مكافأة» و«اؤتمنت على تدبير». وتحافظ الصياغة على التوتر بين الاختيار والالتزام، من غير نفي الدعوة الإلهية أو فرض نظرية مذهبية عن الخدمة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كريمة. استُعمل «طوعًا» في مقابل «رغمًا عن إرادتي» لبيان التضاد بوضوح، ووُضع هامش البديل عند العبارة التي يفسرها فعلًا.
