lexical_decisions:
- source_word: ἀπολογία
  choice: دفاعي
  rationale: تدل الكلمة هنا على جواب بولس عن التدقيق في رسوليته وحقوقه وسلوكه؛ و«دفاعي» تنقل المعنى بوضوح من غير إيحاء بالاعتذار عن خطأ.
- source_word: ἀνακρίνουσίν
  choice: يفحصونني
  rationale: الفعل يدل على إخضاع بولس للفحص والتقييم النقدي، و«يفحصونني» تحفظ هذا المعنى من غير أن تفترض صدور حكم نهائي.
- source_word: Ἡ ἐμὴ
  choice: دفاعي
  rationale: نُقلت الملكية بضمير المتكلم المتصل، وهو الأسلوب العربي الطبيعي الموافق للمعنى.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: أمام الذين يفحصونني
  rationale: «أمام» عربية طبيعية في سياق تقديم الدفاع لمن يتولون الفحص، مع بقاء إمكان فهم الداتيف بمعنى التوجيه «إلى» مذكورًا في الحاشية.
- source_word: ἐστιν αὕτη
  choice: هذا هو
  rationale: صياغة تعريفية عربية واضحة تحافظ على الإشارة التي في النص اليوناني، سواء أكانت إلى ما سبق أم إلى ما يأتي بحسب السياق.
