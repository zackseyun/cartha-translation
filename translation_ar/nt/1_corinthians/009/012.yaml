reference: 1 Corinthians 9:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: ar
  text: إن كان آخرون يتمتعون بهذا الحق عليكم[a]، أفلسنا نحن أحقَّ به؟ لكننا لم نستعمل هذا الحق، بل نتحمّل كل شيء لئلا نضع أيَّ عائق في طريق إنجيل المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذه المطالبة منكم» أو «هذا السلطان في علاقته بكم». ويُرجَّح أن المقصود حق الرسل في تلقي الدعم المادي من أهل كورنثوس.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إنجيل المسيح». وقد تشير الإضافة إلى الإنجيل المتعلق بالمسيح أو المنسوب إليه، دون أن يحسم التركيب وحده العلاقة المقصودة.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: الحق
  rationale: يدل اللفظ هنا على استحقاق مشروع يمكن لبولس ورفقائه استعماله، وهو تلقي الدعم المادي، و«الحق» أوضح من «السلطان» في هذا السياق.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: هذا الحق عليكم
  rationale: تُفهم إضافة الضمير على أنها علاقة بأهل كورنثوس، أي حق في مطالبتهم بالدعم، لا حق يملكونه هم.
- source_word: μετέχουσιν
  choice: يشتركون في
  rationale: ينقل معنى المشاركة في الانتفاع بهذا الحق، ويحافظ على صورة التعبير اليوناني.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: أفلسنا نحن أَوْلى به؟
  rationale: صياغة عربية طبيعية تحفظ السؤال البلاغي وقوة المقارنة، مع إبراز «نحن» كما في اليونانية.
- source_word: ἐχρησάμεθα
  choice: لم نستعمل
  rationale: ينقل معنى الانتفاع الفعلي بالحق أو ممارسته من غير إطالة.
- source_word: πάντα στέγομεν
  choice: نتحمّل كل شيء
  rationale: στέγω هنا يفيد احتمال المشقات والحرمان، لا الستر الحرفي، وπάντα يحافظ على شمول العبارة.
- source_word: τινα ἐγκοπὴν
  choice: أي عائق
  rationale: ἐγκοπή تعني ما يعرقل التقدم أو يعوقه، و«أي عائق» عربية واضحة تلائم سياق انتشار الإنجيل.
- source_word: δῶμεν
  choice: نضع
  rationale: التعبير العربي «نضع عائقًا أمام» طبيعي، ويحفظ صورة التسبب في وجود عائق دون تفسير زائد.
- source_word: εὐαγγελίῳ
  choice: إنجيل
  rationale: لفظ عربي راسخ ومفهوم في السياق البولسي، وينقل معنى البشارة السارة بصيغتها الاصطلاحية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: Χριστός هنا لقب معرف، و«المسيح» يحفظ دلالته المسيانية الطبيعية في العربية.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: المسيح يسوع / كريستوس
  rationale: النص اليوناني يقول حرفيًا «إنجيل المسيح»، واللفظ هنا لقب؛ لذلك حُفظ «المسيح» من غير تحويله إلى اسم شخصي موسع أو إدخال لفظ منقول صوتيًا.
- issue: علاقة الإنجيل بالمسيح في تركيب τοῦ Χριστοῦ
  choice: إنجيل المسيح
  alternative: الإنجيل عن المسيح
  rationale: الإضافة اليونانية يمكن أن تشمل كون الإنجيل متعلقًا بالمسيح أو منسوبًا إليه. أبقت الصياغة الإضافية العربية هذا الاتساع بدل حصرها في علاقة تفسيرية واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدمت «أَوْلى به» لصوغ المقارنة البلاغية طبيعيًا، و«نتحمّل» لنقل معنى الصبر على المشقة. أُبقي تركيب «إنجيل المسيح» حفاظًا على إيجاز الأصل واحتماله الدلالي.
