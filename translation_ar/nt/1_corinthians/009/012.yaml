review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: السؤال البلاغي، الامتناع عن استعمال الحق، احتمال المشقات، وغرض عدم إعاقة الإنجيل. لكن «يشتركون في هذا الحق عليكم» غير سلسة في العربية وقد توحي بمشاركةٍ بين أطراف في الحق، بينما المقصود انتفاع آخرين بحقٍّ أو مطالبةٍ تجاه أهل كورنثوس.'
  naturalness: الأسلوب فصيح إجمالًا، إلا أن «يتمتعون بهذا الحق عليكم» أيسر وأوضح في الاستعمال العربي الحديث من «يشتركون في هذا الحق عليكم». كما أن «أحقّ به» أوضح في سياق الاستحقاق من «أولى به»، و«في طريق إنجيل المسيح» أنسب من «أمام إنجيل المسيح» لنقل معنى العائق الذي يعترض تقدّم الإنجيل.
  terminology: «الحق»، و«نتحمّل كل شيء»، و«إنجيل المسيح» اختيارات سليمة. وتحافظ الإضافة في «إنجيل المسيح» على سعة العلاقة التي يحتملها التركيب اليوناني، دون فرض أن الإنجيل عنه أو صادر منه وحده.
  issues:
