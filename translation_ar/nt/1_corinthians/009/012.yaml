  to: إن كان آخرون يتمتعون بهذا الحق عليكم[a]، أفلسنا نحن أحقَّ به؟ لكننا لم نستعمل هذا الحق، بل نتحمّل كل شيء لئلا نضع أيَّ عائق في طريق إنجيل المسيح[b].
  rationale: 'التعديل محدود ويعالج سلاسة التعبير العربي ودقته السياقية: استُبدل «يشتركون» بـ«يتمتعون» لتفادي إيحاء التقاسم غير المقصود، واستُخدم «أحقّ به» لإبراز الاستحقاق، وصيغ العائق بأنه في طريق الإنجيل. لم يُضف أي تفسير مذهبي، وحُفظت دلالة الإضافة في «إنجيل المسيح» وحاشيتاها.'
