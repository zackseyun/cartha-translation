  - severity: low
    issue: «أولى به» أضعف اتصالًا بدلالة الحق والاستحقاق.
    rationale: «أحقّ به» يبيّن مباشرةً أن المقارنة تتعلق باستحقاق الرسل لهذا الحق، مع الحفاظ على قوة μᾶλλον البلاغية.
  - severity: low
