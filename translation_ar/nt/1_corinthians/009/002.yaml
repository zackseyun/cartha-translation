revisions:
- from: إن لم أكن رسولًا إلى آخرين، فأنا على الأقل رسولٌ إليكم؛ لأنكم أنتم ختمُ[a] رسوليتي في الرب.
  to: إن لم أكن رسولًا لآخرين، فأنا رسولٌ لكم حقًا؛ لأنكم أنتم ختمُ رسوليتي في الرب.
  rationale: عُدّلت أداة العلاقة مع «رسول» إلى اللام، واستُبدلت «على الأقل» بـ«حقًا» لتأدية التأكيد الذي تحمله γε مع تجنب الإيحاء بأن رسولية بولس محصورة في الكورنثيين. بقيت سائر العناصر، ولا سيما صورة الختم وعبارة «في الرب»، محافظة على ألفاظ الأصل واتساعها الدلالي.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:17Z'
review_pass:
  verdict: revise
  source_fidelity: يحافظ النص على البنية الشرطية وعلى تأكيد بولس أن الكورنثيين هم ختم رسوليته. لكن «إلى آخرين/إليكم» أقل ملاءمة مع «رسول» في العربية من اللام، و«على الأقل» قد توحي بتقليل غير لازم أو بحصر رسوليته فيهم، في حين أن γε تؤكد المقابلة هنا.
  naturalness: 'الصياغة المقترحة أفصح وأسلس: «رسولًا لآخرين» و«رسول لكم حقًا» تعبّران طبيعيًا عن العلاقة المقصودة، مع إبقاء صورة «الختم» واضحة.'
  terminology: «رسول»، و«رسوليتي»، و«الختم»، و«في الرب» اختيارات سليمة تحافظ على المصطلحات والصورة المجازية في الأصل. والهامش يشرح القيمة الإثباتية للختم دون استبدال الصورة في المتن.
  issues:
  - severity: medium
    issue: ترجمة ἀλλά γε بـ«فأنا على الأقل رسولٌ إليكم».
    rationale: «على الأقل» ممكنة من حيث الأصل، لكنها في العربية قد تضعف التأكيد أو تفهم بوصفها قصرًا فعليًا للرسولية على الكورنثيين. «فأنا رسول لكم حقًا» تنقل قوة المقابلة والتوكيد دون هذه الإيحاءات.
  - severity: low
    issue: استعمال «إلى» مع «رسول» في الموضعين.
    rationale: 'الداتيف هنا علاقة: رسول لآخرين/للكورنثيين. اللام العربية أكثر سلاسة وأدق في هذا الاستعمال.'
  revised_text: إن لم أكن رسولًا لآخرين، فأنا رسولٌ لكم حقًا؛ لأنكم أنتم ختمُ رسوليتي في الرب.
  revised_footnotes:
