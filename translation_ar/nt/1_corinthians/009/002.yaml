  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: ar
  text: إن لم أكن رسولًا لآخرين، فأنا رسولٌ لكم حقًا؛ لأنكم أنتم ختمُ رسوليتي في الرب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: رسول
  rationale: يدل في دفاع بولس عن نفسه على التكليف الرسولي المعترف به، لا على مجرد حامل رسالة.
- source_word: ἀλλά γε
  choice: فأنا على الأقل
  rationale: تنقل العبارةُ المقابلةَ المؤكدة في اليونانية، وتلائم السياق الذي يشدد فيه بولس على أن رسوليته ظاهرة بلا شك لدى الكورنثيين.
- source_word: σφραγίς
  choice: ختم
  rationale: يحافظ على الصورة اليونانية للختم بوصفه علامة تصديق تثبت الأصالة، بدل استبدال الصورة مباشرةً بكلمة «دليل».
- source_word: ἀποστολή
  choice: رسوليتي
  rationale: تشير هنا إلى صفة بولس وتكليفه بوصفه رسولًا؛ و«رسوليتي» تؤدي هذا المعنى الشخصي والوظيفي بإيجاز.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحافظ على العبارة البولسية وعلى احتمال دلالتها على وجود الكورنثيين وعلاقتهم ببولس ضمن صلتهم بالرب، دون حصرها في معنى السببية.
- source_word: ἄλλοις
  choice: إلى آخرين
  rationale: تنقل دلالة المجرور اليوناني بوصفه متعلقًا بنطاق خدمة بولس الرسولية وعلاقته بالآخرين.
theological_decisions:
- issue: مدى نفي بولس لرسوليته
  choice: 'صيغ الشرط كما في الأصل: «إن لم أكن رسولًا إلى آخرين»، مع تأكيد رسوليته للكورنثيين.'
  alternative: أن يكون بولس مقرًّا بأن رسوليته محدودة بالكورنثيين وحدهم، أو ناقلًا حكم الآخرين عليه صراحةً.
  rationale: السياق دفاعي وحجاجي، والشرط لا يقتضي أن بولس يقر فعلًا بنفي رسوليته لدى سائر الناس. كما أن الأصل لا يصرح بعبارة «في نظر الآخرين»، لذلك لم تُضف إلى المتن.
- issue: دلالة «في الرب»
  choice: الإبقاء على «في الرب» متصلة بكون الكورنثيين ختم رسوليته.
  alternative: «من الرب» للدلالة على الفاعل، أو «باتحادكم بالرب» لتفسير طبيعة العلاقة.
  rationale: التركيب اليوناني يحتمل غنى العلاقة البولسية ولا يحسمها في مجرد الفاعلية أو الاتحاد، ولذلك حُفظت صيغته الموجزة.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة. استُعمل «رسول» و«رسوليتي» بالمفهوم الاصطلاحي في السياق البولسي، ووُضع هامش «الختم» عند اللفظة التي يشرحها مباشرةً.
