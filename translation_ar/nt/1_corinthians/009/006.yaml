  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: ar
  text: أَمْ أَنَا وَبَرْنَابَا وَحْدَنَا لَا حَقَّ لَنَا فِي أَلَّا نَعْمَلَ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألا نشتغل» أو «أن نمتنع عن العمل». والمقصود في السياق الحق في ترك العمل لكسب المعيشة وتلقّي الإعالة للتفرغ للخدمة.'
    reason: بدائل معجمية وتوضيح الدلالة السياقية
lexical_decisions:
- source_word: ἢ
  choice: أَمْ
  rationale: تدخل بديلًا آخر في سلسلة الأسئلة البلاغية، و«أم» تلائم هذا السياق الاستفهامي المتصل.
- source_word: μόνος
  choice: وَحْدَنَا
  rationale: تعود إلى الفاعل المركب «أنا وبرنابا» وتبرز معنى الاستثناء، مع صياغة عربية طبيعية.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: أَنَا وَبَرْنَابَا
  rationale: تحافظ على ترتيب الأصل، مع نقل الاسم بصيغته العربية المألوفة.
- source_word: οὐκ ἔχομεν
  choice: لَا حَقَّ لَنَا
  rationale: صيغت مع ἐξουσίαν تركيبًا عربيًا طبيعيًا يفيد نفي امتلاك الحق.
- source_word: ἐξουσίαν
  choice: حَقَّ
  rationale: المقصود هنا استحقاق مشروع في سياق حقوق الرسل والإعالة، لا سلطة حكم.
- source_word: μὴ ἐργάζεσθαι
  choice: فِي أَلَّا نَعْمَلَ
  rationale: تنقل مضمون الحق بصياغة موجزة، وتحافظ على عموم لفظ «نعمل» من غير إدخال تفسير العمل اليدوي في صلب النص.
theological_decisions:
- issue: دلالة ἐξουσία في السياق
  choice: الحق في عدم العمل مع تلقي الإعالة للخدمة بحسب السياق
  alternative: سلطة أو حرية عامة لا تتصل تحديدًا بالإعالة المادية
  rationale: يتناول السياق المباشر حقوق الرسل في الطعام والإعالة وتنازل بولس الطوعي عنها؛ لكن المتن يبقى موجزًا، ويوضح الهامش المقصود السياقي.
- issue: طبيعة العمل المقصود
  choice: الإبقاء على «نعمل» في المتن وبيان العمل لكسب المعيشة في الهامش
  alternative: التصريح في المتن بـ«نعمل لكسب معيشتنا»
  rationale: يحافظ ذلك على إيجاز الأصل واحتماله اللفظي، من غير إخفاء دلالته السياقية.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُخدم «أم» لاستمرار الأسئلة البلاغية، و«حق» للدلالة على الاستحقاق المشروع. أُثبتت علامة الهامش في المتن.
