  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: ar
  text: ولمّا صعدا إلى القارب[a]، سكنت الريح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى اللفظ: «وبعد أن صعدا إلى القارب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: تحافظ الواو على صلة الجملة بسياق السرد من غير إضافة دلالة زمنية تفسيرية.
- source_word: ἀναβάντων αὐτῶν
  choice: لمّا صعدا
  rationale: حُوِّل التركيب الإضافي المطلق إلى جملة زمنية عربية طبيعية. وصيغة التثنية تحفظ إحالة الضمير اليوناني في السياق إلى يسوع وبطرس، بينما «صعدا» تنقل المعنى الأساسي للفعل ἀναβαίνω.
- source_word: εἰς τὸ πλοῖον
  choice: إلى القارب
  rationale: «القارب» أنسب لسفينة الصيد في بحيرة الجليل من «السفينة»، وحرف الجر «إلى» ينسجم طبيعيًا مع فعل الصعود.
- source_word: ἐκόπασεν
  choice: سكنت
  rationale: الفعل κοπάζω يدل على توقف الريح أو هدوئها. و«سكنت الريح» تعبير عربي واضح وموجز لا يضيف وصفًا لعملية تدريجية.
- source_word: ὁ ἄνεμος
  choice: الريح
  rationale: مقابل مباشر وطبيعي للاسم اليوناني المعرّف.
theological_decisions:
- issue: الدلالة السردية لسلطان يسوع على الطبيعة
  choice: نقل توقف الريح كما يورده النص من غير شرح لاهوتي مضاف.
  alternative: صياغة تفسيرية تُبرز صراحةً أن توقف الريح كان معجزة أو نتيجة أمر من يسوع.
  rationale: النص يذكر تتابع الحدثين، أما دلالته اللاهوتية فتظهر من السياق ولا ينبغي إدخالها في ألفاظ الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت صيغة التثنية لأنها طبيعية في العربية وتحفظ دلالة αὐτῶν السياقية، واستُبقي التعبير «صعدا إلى القارب» لقربه من صورة الأصل مع بيان البديل الأكثر حرفية في الحاشية.
