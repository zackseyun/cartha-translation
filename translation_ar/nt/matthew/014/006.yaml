lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: لما حان الاحتفال بعيد ميلاد هيرودس
  rationale: يفيد التركيب ظرف الزمان ويشير إلى حلول مناسبة الاحتفال بعيد الميلاد، لا إلى التاريخ المجرّد وحده. وهذه الصياغة عربية طبيعية وتحفظ دلالة المناسبة.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد أداة الربط هنا انتقالًا سرديًّا مع مسحة من الاستدراك، فاختيرت «ولكن» مراعاةً للسياق السابق.
- source_word: ὠρχήσατο
  choice: رقصت
  rationale: ترجمة مباشرة وطبيعية للفعل، من غير إضافة تفاصيل عن هيئة الرقصة لا يذكرها النص.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ابنة هيروديا
  rationale: تحفظ علاقة الإضافة كما في اليونانية، ولا تُدخل اسمًا تقليديًّا للابنة لم يرد في النص.
- source_word: ἐν τῷ μέσῳ
  choice: في وسط الحاضرين
  rationale: المعنى الحرفي «في الوسط»، ويرجح السياق أن المقصود وسط المجتمعين؛ أُثبت هذا الإيضاح في المتن مع توثيق الحرفي في الحاشية.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: فأعجبت هيرودس
  rationale: صياغة عربية جارية تؤدي معنى إرضائها له، من غير بيان سبب إعجابه أو طبيعته.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: هيرودس
  rationale: الصيغة العربية الشائعة للاسم في الاستعمال الكتابي.
