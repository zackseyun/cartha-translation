  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: ar
  text: 'فأجابه بطرس: «يا رب، إن كنتَ أنتَ، فمُرني أن آتي إليك على المياه[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على الماء». يَرِد اللفظ في اليونانية بصيغة الجمع: «المياه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: فأجابه بطرس
  rationale: صيغة سردية عربية طبيعية تنقل جواب بطرس للمسيح، من غير إثقال العبارة بترجمة حرفية مزدوجة لـ«أجاب وقال».
- source_word: Κύριε
  choice: يا رب
  rationale: تحافظ على دلالة الاحترام وعلى الثقل المسيحاني المحتمل للفظ، من غير حصره في معنى «يا معلّم».
- source_word: εἰ σὺ εἶ
  choice: إن كنتَ أنتَ
  rationale: تعبير عربي واضح يحفظ معنى التحقق من هوية الشخص الظاهر في السياق، ولا يضيف خبرًا غير مذكور في اليونانية.
- source_word: κέλευσόν
  choice: فمُرني
  rationale: ينقل قوة الأمر السلطاني في فعل κελεύω بصياغة عربية موجزة وطبيعية.
- source_word: με ἐλθεῖν πρὸς σὲ
  choice: أن آتي إليك
  rationale: يحفظ اتجاه الحركة نحو يسوع، وتلائم «آتي» منظور المخاطَب المقصود الوصول إليه.
- source_word: ἐπὶ τὰ ὕδατα
  choice: على المياه
  rationale: يحافظ على صيغة الجمع اليونانية τὰ ὕδατα وعلى الصورة الحية للمشهد، مع التنبيه إلى البديل العربي المألوف في الحاشية.
theological_decisions:
- issue: دلالة نداء بطرس ليسوع بلفظ κύριε
  choice: يا رب
  alternative: يا معلّم / يا سيدي
  rationale: لفظ «الرب» يحفظ ما قد يحمله النداء في إنجيل متى من معنى يتجاوز مجرد الاحترام، من غير أن يحسم وحده مقدار إدراك بطرس لهوية يسوع في هذه اللحظة.
- issue: طبيعة عبارة εἰ σὺ εἶ
  choice: إن كنتَ أنتَ
  alternative: إن كنتَ هو
  rationale: تحفظ الصياغة شرط التحقق من الهوية كما في الأصل، ولا تحولها إلى نفي أو شك عقائدي صريح يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت صياغة سردية سلسة، مع إبقاء «المياه» جمعًا موافقةً للأصل، ووضع البديل العربي الأكثر شيوعًا في الحاشية.
