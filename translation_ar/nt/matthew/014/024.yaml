base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: ar
  text: أمّا القارب فكان قد ابتعد عن البرّ[a] ستاديوناتٍ كثيرة[b]، وكانت الأمواج تضربه بعنف[c]، لأنّ الريح كانت معاكسةً له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عن الشاطئ». واللفظ اليوناني يقول حرفيًا: «عن البرّ».'
    reason: lexical_alternative
  - marker: b
    text: الستاديون وحدة مسافة قديمة تساوي نحو 185 مترًا.
    reason: cultural_note
  - marker: c
    text: 'يمكن أيضًا: «وكانت الأمواج تتلاطم به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: القارب
  rationale: لفظ طبيعي في سياق عبور بحيرة الجليل، ولا يوحي بحجم سفينة كبيرة.
- source_word: ἤδη
  choice: كان قد ابتعد
  rationale: صيغة «كان قد» تنقل دلالة ἤδη على أن الابتعاد تحقق بحلول هذه المرحلة من السرد.
- source_word: σταδίους πολλοὺς
  choice: أشواطًا كثيرة
  rationale: حُفظ مقياس المسافة القديم الوارد في اليونانية بصيغة عربية معرَّبة، مع شرحه في الحاشية بدل تحويله إلى مقياس حديث داخل النص.
- source_word: ἀπὸ τῆς γῆς
  choice: عن البرّ
  rationale: البرّ هو المقابل الطبيعي للماء في هذا السياق، ويؤدي معنى γῆ بوضوح؛ ويمكن فهمه هنا بمعنى الشاطئ.
- source_word: ἀπεῖχεν
  choice: ابتعد عن
  rationale: تعبير عربي طبيعي عن المسافة المكانية، مع المحافظة على علاقة القارب بالبرّ.
- source_word: βασανιζόμενον
  choice: تعصف به
  rationale: ينقل شدة تأثير الأمواج في القارب بعبارة عربية مألوفة، دون إقحام معنى العذاب النفسي الذي قد توحي به ترجمة حرفية.
- source_word: ὑπὸ τῶν κυμάτων
  choice: الأمواج تعصف به
  rationale: أعيد بناء المبني للمجهول في صيغة فعلية عربية واضحة، مع إبقاء الأمواج سببًا مباشرًا لما يصيب القارب.
- source_word: ἐναντίος
  choice: معاكسة له
  rationale: تنقل كون الريح مضادة لاتجاه القارب، وتصرّح بالمرجع الذي تركته اليونانية مفهومًا من السياق.
- source_word: δὲ
  choice: أمّا
  rationale: تلائم الانتقال السردي المقابل من حال يسوع على البر إلى حال القارب، من غير مبالغة في قوة الاستدراك.
- source_word: γάρ
  choice: لأنّ
  rationale: تبيّن بوضوح أن معاكسة الريح هي تفسير اضطراب القارب.
theological_decisions: []
