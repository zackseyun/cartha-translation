  to: أمّا القارب فكان قد ابتعد عن البرّ[a] ستاديوناتٍ كثيرة[b]، وكانت الأمواج تضربه بعنف[c]، لأنّ الريح كانت معاكسةً له.
  rationale: تُحفظ وحدة القياس اليونانية في المتن بصيغة معرّبة قابلة للفهم، ويُصحح موضع مرساة الحاشية المتعلقة بالبرّ. كما عُدّل وصف فعل الأمواج ليعكس بصورة أوضح معنى القارب الذي كانت الأمواج تضربه، دون تحميل النص معنى إضافيًا.
