  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: ar
  text: 'أما يسوع فقال لهم: «لا حاجة لهم إلى أن يذهبوا. أعطوهم أنتم ما يأكلون».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: أما
  rationale: تفيد انتقالًا سرديًّا مع مقابلة خفيفة بين اقتراح التلاميذ وجواب يسوع، وهي طبيعية في العربية الفصحى المعاصرة.
- source_word: εἶπεν αὐτοῖς
  choice: فقال لهم
  rationale: صياغة سردية عربية مألوفة تحفظ فعل القول والمفعول غير المباشر.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: لا حاجة لهم
  rationale: تحفظ تركيب معنى الحاجة في اليونانية، وتأتي عربية واضحة وموجزة.
- source_word: ἀπελθεῖν
  choice: إلى أن يذهبوا
  rationale: تنقل معنى مغادرة المكان دون زيادة تحديد غير موجودة في النص.
- source_word: δότε
  choice: أعطوا
  rationale: أمر صريح بصيغة جمع المخاطبين، مطابق لصيغة الفعل اليوناني.
- source_word: αὐτοῖς
  choice: هم
  rationale: ضمير الجمع يعود إلى الجموع، وقد اتصل بالفعل وفق الاستعمال العربي الطبيعي.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: إبراز الضمير المنفصل بعد الفعل يحفظ توكيد اليونانية على أن التلاميذ أنفسهم هم المخاطبون بالفعل.
- source_word: φαγεῖν
  choice: ما يأكلون
  rationale: تعبير عربي اصطلاحي طبيعي عن تركيب «أعطوهم ليأكلوا»، مع إظهار المفعول المفهوم من السياق دون تحديد نوع الطعام.
theological_decisions:
- issue: التوكيد على دور التلاميذ في أمر يسوع
  choice: أعطوهم أنتم ما يأكلون
  alternative: أعطوهم ما يأكلون
  rationale: إثبات «أنتم» يحفظ توكيد الضمير اليوناني ὑμεῖς من غير إضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أما يسوع فقال» لإظهار المقابلة السردية، و«أنتم» بعد الفعل لحفظ التوكيد. لا تستدعي الصياغة المختارة حاشية لأن البدائل المعجمية لا تغيّر المعنى تغييرًا مهمًّا.
