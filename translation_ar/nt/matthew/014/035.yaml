  rationale: تُصحَّح جهة الإرسال من «في» إلى «إلى» لمطابقة εἰς ولتحسين العربية، ويُستعمل «تعرّف عليه» لإبراز معنى ἐπιγινώσκω السياقي. ولا يُضاف إلى المتن مفعول لـ«أرسلوا»، إذ هو محذوف في اليونانية؛ ويُشرح هذا الحذف في الحاشية.
