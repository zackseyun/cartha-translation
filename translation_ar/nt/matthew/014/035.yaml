lexical_decisions:
- source_word: ἐπιγνόντες
  choice: عرفه
  rationale: يدل اسم الفاعل الماضي هنا على أنهم تعرّفوا إلى يسوع وأدركوا هويته عند رؤيته، لا على أنهم ابتدأوا معرفةً علائقية أوسع به.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: رجال ذلك المكان
  rationale: يحافظ «رجال» على الدلالة المذكرة الصريحة لـἀνήρ، ويؤدي «ذلك المكان» معنى τόπος في سياق الموضع الذي وصل إليه يسوع.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: أرسلوا في تلك الناحية المحيطة كلّها
  rationale: حُفظ فعل الإرسال من دون إضافة مفعول غير مذكور في اليونانية؛ و«الناحية المحيطة» تنقل معنى περίχωρος، أي المنطقة المجاورة كلها. استُعملت «في» عربيًا للدلالة على امتداد الإرسال في المنطقة.
- source_word: προσήνεγκαν αὐτῷ
  choice: أحضروا إليه
  rationale: يفيد προσφέρω هنا إحضار الأشخاص إلى يسوع، لا تقديم قربان؛ و«أحضروا إليه» تعبير عربي طبيعي وواضح.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: جميع المرضى
  rationale: العبارة κακῶς ἔχειν اصطلاح يوناني بمعنى أن يكون المرء مريضًا أو عليلًا؛ و«جميع المرضى» تؤدي المعنى بإيجاز وطبيعية.
