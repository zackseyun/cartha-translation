    issue: «رفعوا» في سياق البقايا الغذائية
    rationale: يجوز أن يترجم αἴρω حرفيًا بـ«رفع»، لكن المعنى السياقي هنا هو التقاط البقايا وجمعها؛ «جمعوا» أيسر وأوضح بالعربية.
  - severity: low
