  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: ar
  text: فأكلوا جميعًا وشبعوا، ثم جمعوا اثنتي عشرة سلةً مملوءةً من الكِسَر التي فضلت.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: أكلوا
  rationale: فعل ماضٍ بسيط يلائم تسلسل السرد وينقل صيغة الماضي اليونانية مباشرة.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ شمول الجمع، مع استغناء العربية عن إظهار الضمير المنفصل لوجوده في الفعل.
- source_word: ἐχορτάσθησαν
  choice: شبعوا
  rationale: تعبير عربي طبيعي ودقيق عن الأكل حتى الاكتفاء، من غير توسع تفسيري.
- source_word: ἦραν
  choice: رفعوا
  rationale: ينقل المعنى الأساسي للفعل αἴρω، أي رفع الشيء أو أخذه، من غير إضافة فعل الجمع غير المصرح به صراحة.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: ما فضل من الكِسَر
  rationale: صياغة عربية طبيعية تحفظ علاقة الباقي بالكِسَر، والكِسَر هنا قطع مكسورة، يُفهم من السياق أنها من الخبز.
- source_word: δώδεκα
  choice: اثنتي عشرة
  rationale: العدد مؤنث الصيغة لأن المعدود «قُفّة» مؤنث في العربية.
- source_word: κοφίνους
  choice: قُفّةً
  rationale: κόφινος يدل على وعاء منسوج أو سلّة؛ «قُفّة» تميّزه بقدر مناسب عن ألفاظ السلال الأخرى، من دون ادعاء تفاصيل لا يحددها النص.
- source_word: πλήρεις
  choice: مملوءةً
  rationale: يحفظ وصف القفاف بأنها ممتلئة، مع المطابقة العربية للمعدود غير العاقل في هذا التركيب.
theological_decisions:
- issue: وصف نتيجة الإطعام العجائبي بلغة الشبع العادية
  choice: شبعوا
  alternative: امتلأوا
  rationale: «شبعوا» ينقل اكتمال الكفاية الغذائية بوضوح من غير إدخال تفسير لاهوتي زائد، ويحافظ على بساطة تقرير الحدث.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «ثم» لتيسير تعاقب الحدثين في العربية، مع بقاء العلاقة السردية التي تؤديها καί. ووُضعت النقطتان قبل مقدار الباقي لتوضيح أن «اثنتي عشرة قفة مملوءة» بيانٌ لما رُفع.
