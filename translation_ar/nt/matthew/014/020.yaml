    rationale: النقطتان تضعفان الصلة المباشرة بين ما جُمع وبين «اثنتي عشرة سلة مملوءة»، بينما تجعل الصياغة المتصلة هذا التركيب جزءًا طبيعيًا من الجملة.
  - severity: low
    issue: «قُفّة»
    rationale: اللفظ صحيح، لكنه أقل تداولًا في الفصحى الحديثة الواضحة من «سلة»؛ ولا يقتضي اليوناني تمييزًا أدق لنوع السلة.
  revised_text: فأكلوا جميعًا وشبعوا، ثم جمعوا اثنتي عشرة سلةً مملوءةً من الكِسَر التي فضلت.
