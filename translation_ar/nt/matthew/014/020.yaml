  rationale: تُبقي المراجعة تسلسل السرد ومعنى الامتلاء وعدد السلال، وتعبّر عن فعل جمع البقايا بعبارة عربية طبيعية. ولا تستلزم «الكِسَر» حاشية هنا، إذ إن المقصود واضح في المتن ولا توجد ضرورة للحفاظ على البديل الإنجليزي «fragments» بحاشية عربية مستقلة.
