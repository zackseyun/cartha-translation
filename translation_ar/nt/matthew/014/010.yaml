  text: فأرسل فقطع رأس يوحنا في السجن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى البنية اليونانية: «وبعد أن أرسل، قطع رأس يوحنا في السجن». تستعمل اليونانية اسم فاعل بصيغة الأوريست يتبعه الفعل الرئيس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: حرف عطف يواصل السرد، وتؤدي الفاء العربية هنا معنى التعاقب الطبيعي من غير إضافة تفسير زائد.
- source_word: πέμψας
  choice: أرسل
  rationale: اسم فاعل ماضٍ يُستعمل ظرفيًا قبل الفعل الرئيس. وصيغة «أرسل و...» عربية طبيعية تحفظ تعاقب الحدثين، وتوحي بإيفاد من ينفذ الفعل من غير أن تستبدل الإسناد اليوناني بتفسير صريح مثل «أمر».
- source_word: ἀπεκεφάλισεν
  choice: قطع رأس
  rationale: الفعل يعني تحديدًا إزالة الرأس. و«قطع رأس» تعبير عربي واضح ودقيق، مع إبقاء الفعل منسوبًا نحويًا إلى هيرودس كما في اليونانية، بدل التفسير الأوسع «أمر بقطع رأسه».
- source_word: τὸν Ἰωάννην
  choice: يوحنا
  rationale: النص يذكر الاسم وحده، والسياق القريب يحدد المقصود؛ لذلك لا تُضاف عبارة «المعمدان».
- source_word: ἐν τῇ φυλακῇ
  choice: في السجن
  rationale: تفيد العبارة مكان الاحتجاز الذي وقع فيه قطع الرأس. وهذه صياغة عربية طبيعية تحافظ على الدلالة المكانية المحددة.
theological_decisions:
- issue: إسناد قطع الرأس إلى هيرودس مع تنفيذه بواسطة مُرسَل
  choice: 'الإبقاء على الإسناد المباشر: «أرسل وقطع رأس يوحنا»'
  alternative: «أرسل من يقطع رأس يوحنا» أو «أمر بقطع رأس يوحنا»
  rationale: اليونانية تجمع بين «أرسل» والفعل الرئيس المسند إلى هيرودس، وهو أسلوب يمكن أن ينسب فعل الوكيل إلى صاحب السلطان. التصريح بالأمر أو بالمنفذ يوضح الوساطة لكنه يضيف ما ليس مصرحًا به نحويًا في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ إيجاز السرد وإسناد الفعل كما في الأصل، مع تجنب الإضافة التفسيرية «أمر». وُضعت علامة الحاشية بعد الجملة.
