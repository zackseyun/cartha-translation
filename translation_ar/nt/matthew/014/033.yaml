base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: ar
  text: 'فسجد[a] له الذين في القارب قائلين: «حقًّا أنت ابن الله[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عبدوه» أو «انحنوا أمامه إجلالًا». يدل الفعل اليوناني على إظهار التوقير بالسجود أو الانحناء، ويرجّح السياق هنا معنى العبادة.'
    reason: lexical_alternative
  - marker: b
    text: أي «ابن الله» بوصفها لقبًا معروفًا. لا توجد أداة تعريف قبل «الله» في العبارة اليونانية، لكن السياق لا يفيد أنه مجرد «ابن من أبناء الله».
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: فـ... الذين
  rationale: تؤدي الفاء معنى الانتقال السردي الخفيف في δέ من غير أن توحي بتعارض قوي، و«الذين» تستعمل استعمالًا اسميًّا للإشارة إلى الموجودين في القارب.
- source_word: ἐν τῷ πλοίῳ
  choice: كانوا في القارب
  rationale: «القارب» لفظ عربي طبيعي للمركب المقصود، وإضافة «كانوا» تجعل الصلة العربية سليمة من غير زيادة في المعنى.
- source_word: προσεκύνησαν αὐτῷ
  choice: سجد له
  rationale: الفعل اليوناني يدل على الانحناء أو السجود إجلالًا، وقد يبلغ معنى العبادة بحسب السياق. و«سجد له» يحفظ صورة الفعل ويترك للسياق، مع الاعتراف اللاحق، بيان قوته.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ اسم الفاعل على البنية الحالية في اليونانية، وهو فصيح وطبيعي في السرد العربي.
- source_word: Ἀληθῶς
  choice: حقًّا
  rationale: تنقل «حقًّا» قوة التأكيد الجاد في الظرف اليوناني بعبارة عربية واضحة ومألوفة.
- source_word: θεοῦ υἱὸς
  choice: ابن الله
  rationale: هذه الصيغة العربية الطبيعية للقب، ولا تحتاج العربية إلى أداة تعريف قبل «ابن» في هذا التركيب الإضافي. السياق يدل على لقب محدد، لا على «ابن من أبناء الله».
- source_word: εἶ
  choice: أنت
  rationale: الجملة الاسمية العربية في الزمن الحاضر لا تحتاج إلى فعل رابط؛ ويؤدي الضمير «أنت» معنى المخاطب وفعل الكينونة اليونانيين طبيعيًّا.
theological_decisions:
- issue: دلالة προσκυνέω الموجَّه إلى يسوع
  choice: سجد له
  alternative: عبده؛ أو انحنى أمامه إجلالًا
  rationale: يحفظ «سجد له» الفعل الجسدي ودلالته التعبدية المحتملة معًا. وسياق سلطان يسوع على البحر والاعتراف بأنه ابن الله يرجح معنى العبادة، من غير طمس المجال الدلالي الأوسع للفعل.
- issue: تحديد عبارة θεοῦ υἱὸς
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: غياب أداة التعريف في اليونانية لا يجعل العبارة نكرة بالضرورة. وفي هذا الاعتراف المتّىاوي تعمل العبارة لقبًا محددًا، أما «ابنٌ لله» فقد توحي خطأ بأنه واحد من عدة أبناء.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «القارب» بدل ألفاظ بحرية أقدم، وحُفظ التركيب الموجز والإيقاع الاعترافي للنص. وُضعت علامتا الحاشيتين في المتن عند العبارتين اللتين تشرحانهما.
