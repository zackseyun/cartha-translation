source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: ar
  text: وبعد أن أمر الجموع أن يتكئوا على العشب، أخذ الأرغفة الخمسة والسمكتين، ورفع نظره نحو السماء وبارك[a]. ثم كسر الأرغفة وأعطاها للتلاميذ، والتلاميذ أعطوها للجموع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبارك الله» أو «وقال صلاة البركة». فالنص اليوناني يقول فقط: «وبارك»، من غير أن يذكر المفعول صراحةً.'
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: بعد أن أمر
  rationale: ينقل قوة التوجيه وتسلسل الحدث الذي يفيده اسم الفاعل الماضي، بصياغة عربية طبيعية.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: يحفظ صيغة الجمع ويعبّر بوضوح عن جماعات الناس المحتشدة.
- source_word: ἀνακλιθῆναι
  choice: أن يتكئوا
  rationale: يحفظ دلالة الاتكاء لتناول الطعام، بدل اللفظ الأعم «يجلسوا».
- source_word: ἐπὶ τοῦ χόρτου
  choice: على العشب
  rationale: ترجمة مباشرة لا تضيف وصف الخضرة غير الموجود في نص متى.
- source_word: τοὺς πέντε ἄρτους
  choice: الأرغفة الخمسة
  rationale: «أرغفة» تعيّن وحدات الخبز المعدودة في هذا السياق.
- source_word: τοὺς δύο ἰχθύας
  choice: السمكتين
  rationale: صيغة التثنية العربية الطبيعية والدقيقة.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: رفع نظره نحو السماء
  rationale: صياغة عربية واضحة تحفظ اتجاه النظر إلى أعلى نحو السماء.
- source_word: εὐλόγησεν
  choice: بارك
  rationale: يحافظ على الفعل بلا مفعول صريح كما في اليونانية، فلا يحسم أبارك الله أم الطعام.
- source_word: κλάσας
  choice: ثم كسر الأرغفة
  rationale: يبيّن تعاقب الفعل قبل الإعطاء، ويصرّح بالمفعول المفهوم من السياق.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: وأعطاها للتلاميذ
  rationale: ضمير المؤنث غير العاقل يعود طبيعيًا إلى الأرغفة في العربية.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: والتلاميذ أعطوها للجموع
  rationale: يُظهر الفعل المحذوف المفهوم في اليونانية لأن إظهاره أوضح وأطبع بالعربية.
theological_decisions:
- issue: مفعول الفعل εὐλόγησεν (بارك)
  choice: 'إبقاء المفعول غير مذكور: «وبارك»'
  alternative: «وبارك الله» أو «وقال صلاة البركة»، وربما «وبارك الطعام»
  rationale: النص اليوناني لا يصرّح بالمفعول، وإبقاؤه محذوفًا يصون الغموض الحقيقي ولا يرجّح تفسيرًا لاهوتيًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يتكئوا» للمحافظة على هيئة تناول الطعام، مع تجنب التراكيب القديمة الثقيلة. وُضع مؤشر الحاشية بعد «بارك» لأنه يخص الغموض في مفعول هذا الفعل.
