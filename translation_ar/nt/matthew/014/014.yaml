  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: ar
  text: ولمّا نزل إلى البرّ[a]، رأى جمعًا كثيرًا، فتحنّن عليهم وشفى مرضاهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «خرج» أو «لمّا خرج». ويرجّح السياق أن المقصود نزوله من القارب إلى البرّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: لمّا نزل إلى البرّ
  rationale: المعنى الحرفي هو «خرج»، لكن سياق الوصول بالقارب يرجّح أن المقصود نزوله إلى البرّ. صيغت العبارة بالعربية الطبيعية مع إثبات البديل الحرفي في الحاشية.
- source_word: εἶδεν
  choice: رأى
  rationale: مقابل عربي مباشر وطبيعي للفعل في هذا السياق.
- source_word: πολὺν ὄχλον
  choice: جمعًا كثيرًا
  rationale: ينقل معنى كثرة الناس بعبارة عربية واضحة وفصيحة من غير تهويل.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: تحنّن عليهم
  rationale: الفعل اليوناني يدل على شفقة عميقة تحرّك الباطن؛ و«تحنّن عليهم» تعبير عربي موجز يحفظ القوة العاطفية والصلة بما أعقبه من شفاء.
- source_word: ἐθεράπευσεν
  choice: شفى
  rationale: السياق يتحدث عن إزالة المرض، و«شفى» هو المقابل العربي الطبيعي المباشر.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: مرضاهم
  rationale: صياغة عربية موجزة تحفظ دلالة مرضى الجمع وعلاقة الضمير بهم، من غير توسّع تفسيري.
theological_decisions:
- issue: وصف استجابة يسوع العاطفية
  choice: تحنّن عليهم
  alternative: أشفق عليهم / تحرّك شفقةً عليهم
  rationale: يحفظ الاختيار دلالة الرحمة العميقة بوصفها الاستجابة التي سبقت الشفاء، من غير إضافة تفسير عقائدي أو مبالغة لا يقتضيها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «جمعًا كثيرًا» و«مرضاهم» للمحافظة على إيجاز الأصل، بينما أوضحت الحاشية أن «نزل إلى البرّ» ترجمة سياقية للفعل العام «خرج».
