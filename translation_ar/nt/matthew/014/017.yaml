  language: ar
  text: 'فقالوا له: «ليس عندنا هنا إلا خمسة أرغفة وسمكتان».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: فقالوا
  rationale: تدل أداة الربط δέ على انتقال ذي مقابلة خفيفة مع أمر يسوع السابق، وتؤدي الفاء هذا الربط طبيعيًا في السرد العربي، والفاعل المفهوم هم التلاميذ.
- source_word: λέγουσιν αὐτῷ
  choice: قالوا له
  rationale: ورد الفعل في اليونانية بالمضارع التاريخي، لكن الماضي هو الأسلوب الطبيعي في السرد العربي ويحفظ الوظيفة الخطابية.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: ليس عندنا هنا إلا
  rationale: هذه صياغة عربية طبيعية ودقيقة لبنية النفي والاستثناء، وتحفظ الدلالة المكانية لـὧδε.
- source_word: πέντε ἄρτους
  choice: خمسة أرغفة
  rationale: الرغيف هو المقابل المعدود الطبيعي لـἄρτος في هذا السياق.
- source_word: δύο ἰχθύας
  choice: سمكتان
  rationale: استُعمل المثنى العربي لأنه المقابل الطبيعي والدقيق للعدد اثنين مع ἰχθύας.
