lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تصل جواب يسوع بكلام التلاميذ السابق، وتوحي في السياق بالمقابلة من غير تشديد زائد.
- source_word: εἶπεν
  choice: قال
  rationale: ترجمة مباشرة للفعل في صيغة الماضي، من غير إضافة معنى الأمر إلى فعل القول نفسه.
- source_word: Φέρετέ
  choice: أحضروا
  rationale: صيغة أمر للجمع تفيد جلب الأشياء إلى موضع المتكلم، وهي طبيعية وواضحة في العربية المعاصرة.
- source_word: μοι
  choice: إليَّ
  rationale: يبين اتجاه الإحضار نحو المتكلم على نحو عربي فصيح وطبيعي.
- source_word: ὧδε
  choice: هنا
  rationale: يحفظ الدلالة المكانية الصريحة للظرف اليوناني.
- source_word: αὐτούς
  choice: ها
  rationale: الضمير يعود سياقيًا إلى الأرغفة والسمكتين المذكورة في الآية السابقة؛ وجاء مؤنثًا مفردًا لغير العاقل وفق الاستعمال العربي.
