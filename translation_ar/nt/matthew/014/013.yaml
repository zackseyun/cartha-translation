id: MAT.14.13
reference: Matthew 14:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: ar
  text: فلما سمع يسوع، انصرف من هناك في قارب إلى مكان قفر[a] على انفراد. ولما سمعت الجموع، تبعته سيرًا على الأقدام من البلدات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مكان خالٍ» أو «مكان منعزل». تصف الكلمة اليونانية موضعًا غير مأهول أو بعيدًا عن العمران، وليس بالضرورة صحراء رملية.
    reason: lexical_alternative
  - marker: b
    text: أو «المدن». يمكن أن تدل الكلمة اليونانية على البلدات أو المدن بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: فلما سمع يسوع
  rationale: صيغ اسم الفاعل الماضي بوصفه جملة زمنية، ونُقلت δέ بأداة ربط سردية خفيفة من غير إحداث مقابلة قوية. ولم يُضف مفعول صريح مثل «هذا» لأن النص اليوناني لا يذكره، مع بقاء المرجع مفهومًا من السياق.
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: ينقل معنى الابتعاد أو الانسحاب من الموضع استجابةً لما سبق، من غير أن يحدد دافعًا لم يصرح به النص.
- source_word: ἐκεῖθεν ἐν πλοίῳ
  choice: من هناك في قارب
  rationale: تعبير عربي طبيعي يحفظ موضع الانطلاق ووسيلة الانتقال.
- source_word: εἰς ἔρημον τόπον
  choice: إلى مكان قفر
  rationale: «قفر» يدل على موضع خالٍ أو غير مأهول، ولا يلزم منه أنه صحراء رملية.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: يحفظ معنى الابتعاد عن الناس أو الخصوصية، ولا يجزم بأنه لم يكن معه أي شخص في القارب.
- source_word: ἀκούσαντες οἱ ὄχλοι
  choice: ولما سمعت الجموع
  rationale: نُقل اسم الفاعل زمنيًا، وحُفظ جمع ὄχλοι بلفظ «الجموع».
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعته
  rationale: يعبر عن الاتباع المكاني المباشر هنا من غير تحميل اللفظ دلالة تلمذة غير مصرح بها.
- source_word: πεζῇ
  choice: سيرًا على الأقدام
  rationale: يوضح أنهم سلكوا برًا مشيًا، في مقابل انتقال يسوع بالقارب.
- source_word: ἀπὸ τῶν πόλεων
  choice: من البلدات
  rationale: لفظ πόλις قد يدل على مدينة أو بلدة؛ و«البلدات» مناسب للمستوطنات الجليلية في السياق، مع ذكر البديل في الحاشية.
theological_decisions:
- issue: دافع انصراف يسوع
  choice: 'صياغة الفعل بصيغة محايدة: «انصرف»'
  alternative: انسحب طلبًا للسلامة، أو اعتزل للحزن أو الصلاة
  rationale: يربط النص انصرافه بما سمع ويذكر ذهابه إلى موضع قفر على انفراد، لكنه لا يصرح بسبب نفسي أو لاهوتي محدد.
- issue: معنى «على انفراد»
  choice: الحفاظ على معنى الخصوصية من غير الجزم بأنه كان وحده تمامًا
  alternative: «بمفرده» بما قد يفهم منه نفي وجود التلاميذ معه
  rationale: العبارة κατ’ ἰδίαν تفيد الانفراد أو الابتعاد عن العامة، ولا تحسم وحدها جميع تفاصيل المرافقين.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة سردية وقورة. استُعمل «قارب» بدل تعبير تقني، و«على انفراد» لصون الغموض المتعلق بمن كان مع يسوع. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
