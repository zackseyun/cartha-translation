lexical_decisions:
- source_word: λυπηθεὶς
  choice: ومع أن الملك حزن
  rationale: 'اسم الفاعل اليوناني يدل على أن الملك أصابه الحزن، وصيغة «مع أن» تُظهر دلالته التنازلية في السياق: حزن، لكنه أصدر الأمر مع ذلك.'
- source_word: ὁ βασιλεὺς
  choice: الملك
  rationale: ترجمة مباشرة وطبيعية للفظ βασιλεύς، مع إبقاء اللقب الذي يستعمله السرد.
- source_word: διὰ τοὺς ὅρκους
  choice: بسبب ما أقسمه من أيمان
  rationale: تفيد διά مع النصب السببية، وὅρκους جمع يشير إلى الأيمان التي أقسمها الملك. هذه الصياغة واضحة وتتجنب التباس «إيمانه» بمعنى العقيدة.
- source_word: τοὺς συνανακειμένους
  choice: الجالسين معه إلى المائدة
  rationale: يشير اللفظ إلى المشاركين له في الطعام، وكانوا يتكئون بحسب عادة ذلك العصر. الصياغة العربية تنقل المشهد الاجتماعي بوضوح، وتوضح الحاشية الهيئة التاريخية بدقة.
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: ينقل معنى إصدار الأمر بإيجاز وبأسلوب سردي فصيح.
- source_word: δοθῆναι
  choice: بأن يُعطى لها
  rationale: يحافظ الفعل المبني للمجهول على صيغة المصدر اليوناني وعلى بقاء الشيء المُعطى مفهومًا من السياق السابق من غير تسميته صراحة.
