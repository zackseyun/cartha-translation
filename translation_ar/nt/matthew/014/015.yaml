source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: ar
  text: 'ولمّا حلّ المساء، تقدّم إليه التلاميذ وقالوا: «المكان مقفر[a]، وقد تأخّر الوقت[b]. اصرف الجموع لكي يذهبوا إلى القرى ويشتروا لأنفسهم طعامًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المكان خالٍ من السكان».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «وقد مضت الساعة بالفعل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: ولمّا حلّ المساء
  rationale: ترجمة طبيعية للتركيب الزمني المطلق، مع نقل δέ بوصفها انتقالًا سرديًّا من خلال استئناف السياق دون إضافة لفظ صريح بمعنى «الآن».
- source_word: προσῆλθον αὐτῷ
  choice: تقدّم إليه
  rationale: ينقل معنى الاقتراب والمجيء إلى شخص بعبارة عربية فصيحة وطبيعية.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف اليونانية تشير إلى الجماعة المعروفة من السياق، من غير حاجة إلى إضافة «تلاميذه» غير المصرّح بها.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: المكان مقفر
  rationale: «مقفر» يدل هنا على مكان خالٍ من العمران أو السكان، ولا يفرض أنه صحراء جغرافيًّا.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: وقد تأخّر الوقت
  rationale: صياغة عربية طبيعية تؤدي المعنى الاصطلاحي للعبارة الحرفية «الساعة قد مضت بالفعل»، أي إن الوقت صار متأخرًا.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: اصرف الجموع
  rationale: الفعل في السياق يعني أن يأذن لهم بالانصراف أو يرسلهم بعيدًا، و«اصرف» موجز وطبيعي.
- source_word: ἵνα ἀπελθόντες
  choice: لكي يذهبوا
  rationale: تؤدي غرض جملة ἵνα وتدمج تسلسل اسم الفاعل والفعل في تركيب عربي سلس من غير تغيير المعنى.
- source_word: εἰς τὰς κώμας
  choice: إلى القرى
  rationale: ترجمة مباشرة لـ κώμη من غير إضافة «القريبة»، لأن القرب مفهوم من السياق لكنه غير مذكور صراحة.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: ويشتروا لأنفسهم طعامًا
  rationale: يحافظ على معنى الطعام وعلى الضمير الانعكاسي الدال على أنهم يشترونه لأنفسهم.
theological_decisions: []
