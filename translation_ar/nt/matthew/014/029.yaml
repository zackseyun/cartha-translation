  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: ar
  text: 'فقال: «تعالَ». فنزل بطرس من القارب، ومشى على الماء، وجاء نحو يسوع.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وجاء إلى يسوع». تفيد العبارة اليونانية الحركة في اتجاه يسوع، ولا تصرّح بالضرورة باكتمال الوصول إليه.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: تعالَ
  rationale: فعل أمر مباشر من ἔρχομαι؛ و«تعالَ» مقابله العربي الطبيعي الموجز من غير زيادة.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: فنزل بطرس من القارب
  rationale: يفيد اسم الفاعل السابق زمنًا وقوع النزول قبل المشي، وتؤدي الفاء هذا التعاقب بسلاسة في العربية.
- source_word: πλοίου
  choice: القارب
  rationale: يلائم πλοῖον في سياق بحيرة الجليل، وهو أوضح للقارئ المعاصر من «السفينة» في هذا الموضع.
- source_word: περιεπάτησεν
  choice: ومشى
  rationale: المعنى السياقي المباشر للفعل هو المشي، من غير ما يقتضي إضافة «بدأ» أو معنى التجوال.
- source_word: ἐπὶ τὰ ὕδατα
  choice: على الماء
  rationale: تدل العبارة على الحركة فوق سطح الماء؛ والمفرد اسم جنس هو التعبير العربي الطبيعي.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: واتجه نحو يسوع
  rationale: تحفظ «نحو» دلالة الحركة في اتجاه يسوع التي تحملها πρός، من غير الجزم بأنه وصل إليه.
- source_word: δὲ
  choice: فـ
  rationale: δέ رابط سردي خفيف، والفاء هنا طبيعية بعد الكلام السابق وتواصل مجرى الرواية من غير إقحام معنى تضاد.
theological_decisions:
- issue: وصف حركة بطرس في اتجاه يسوع
  choice: واتجه نحو يسوع
  alternative: وجاء إلى يسوع
  rationale: تُبقي الصياغة على دلالة الاتجاه في πρός ولا تفترض اكتمال الوصول، فتحفظ التدرج والتوتر السرديين.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. روعي الإيجاز السردي، والتعاقب الطبيعي للأفعال، والحفاظ على الفرق بين الاتجاه نحو يسوع والوصول المكتمل إليه.
