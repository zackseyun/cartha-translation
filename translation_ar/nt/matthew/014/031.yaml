  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: ar
  text: 'وفي الحال مدَّ يسوع يده وأمسك به، وقال له: «يا قليل الإيمان، لماذا شككت[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ترددت؟»؛ فالفعل اليوناني قد يدل على التردد إلى جانب الشك.'
    reason: بديل معجمي يحفظ المدى الدلالي للفعل ἐδίστασας.
lexical_decisions:
- source_word: εὐθέως
  choice: وفي الحال
  rationale: تؤدي معنى الفورية بعبارة عربية فصيحة وطبيعية، وتحافظ على سرعة الحدث في السرد.
- source_word: δὲ
  choice: الواو في «وفي الحال»
  rationale: تنقل الصلة الاستمرارية الخفيفة بين الجمل من غير إثقال الأسلوب بأداة استدراك لا يقتضيها السياق العربي.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: مدَّ يده
  rationale: تعبير عربي مباشر يحفظ الصورة الحسية وتسلسل الفعل.
- source_word: ἐπελάβετο αὐτοῦ
  choice: أمسك به
  rationale: ينقل معنى الأخذ بالشخص أو الإمساك به من غير إضافة كيفية غير مصرَّح بها.
- source_word: λέγει αὐτῷ
  choice: وقال له
  rationale: صيغ الماضي هي الأنسب للسرد العربي المتصل؛ ولا يلزم تقليد المضارع التاريخي اليوناني على حساب طبيعية العربية.
- source_word: Ὀλιγόπιστε
  choice: يا قليل الإيمان
  rationale: يحفظ صيغة النداء ويربط التوبيخ بقلّة الإيمان، لا بانعدامه الكامل.
- source_word: εἰς τί
  choice: لماذا
  rationale: المقابل العربي الاستفهامي الطبيعي في هذا السياق.
- source_word: ἐδίστασας
  choice: شككت
  rationale: ترجمة واضحة ومألوفة، مع إثبات دلالة التردد أو التزعزع الممكنة في الحاشية حفاظًا على السعة الدلالية.
theological_decisions:
- issue: دلالة Ὀλιγόπιστε وصلتها بالإيمان
  choice: يا قليل الإيمان
  alternative: يا من إيمانك قليل
  rationale: تحافظ الصياغة على أن التوبيخ متعلق بضعف الإيمان، من غير تحويله إلى انعدام تام للإيمان أو إلى مجرد نقص في الشجاعة.
- issue: مدى دلالة ἐδίστασας
  choice: شككت
  alternative: ترددت أو تزعزعت
  rationale: «شككت» هي الأوضح في المتن، لكن الفعل اليوناني قد يدل أيضًا على التردد أو التزعزع؛ لذلك أُبقي هذا الاحتمال في الحاشية بدل حسمه لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم السرد بالماضي على نحو طبيعي، ووُضعت علامة الحاشية بعد اللفظة التي تشرحها مباشرة.
