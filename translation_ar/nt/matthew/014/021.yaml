  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: ar
  text: وكان الذين أكلوا نحو خمسة آلاف رجل، ما عدا النساء والأطفال[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من غير احتساب النساء والأطفال».
    reason: بديل معجمي يصرّح بأن النساء والأطفال غير داخلين في عدد الخمسة آلاف الذي تؤديه χωρὶς.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: وكان الذين أكلوا
  rationale: يؤدي التركيب ذو اسم الفاعل المعرّف معنى جماعة المشاركين في الأكل. وصيغة «الذين أكلوا» طبيعية وواضحة بالعربية، أما δέ فمُثّلت بواو الانتقال من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἦσαν
  choice: كانوا، ممثَّلة في السياق بـ«وكان»
  rationale: الفعل الناقص هنا يقرر عدد الآكلين، وصيغة «وكان الذين أكلوا...» هي المقابل العربي الطبيعي.
- source_word: ἄνδρες
  choice: رجل
  rationale: اللفظة اليونانية تدل هنا على الذكور تحديدًا، لا على الناس عمومًا، ويتأكد ذلك بذكر النساء والأطفال على حدة. وجاء المفرد «رجل» تمييزًا بعد العدد المركب بالآلاف.
- source_word: ὡσεὶ
  choice: نحو
  rationale: تدل على التقريب، و«نحو» فصيحة جارية وواضحة قبل العدد.
- source_word: πεντακισχίλιοι
  choice: خمسة آلاف
  rationale: نقل مباشر للعدد مع مراعاة الصياغة العددية العربية.
- source_word: χωρὶς
  choice: فضلًا عن
  rationale: تفيد أن النساء والأطفال غير داخلين في عدد الخمسة آلاف، مع إبقاء العبارة طبيعية في العربية؛ وتوضح الحاشية معنى عدم احتسابهم.
- source_word: γυναικῶν
  choice: النساء
  rationale: السياق لا يتحدث عن علاقة زوجية، لذلك المقصود النساء لا الزوجات.
- source_word: παιδίων
  choice: الأطفال
  rationale: مقابل عربي طبيعي للجمع، من غير تضييق الدلالة على سن أصغر مما يقتضيه السياق.
theological_decisions:
- issue: تحديد جنس المعدود في حشد مختلط
  choice: ترجمة ἄνδρες بـ«رجل» والإبقاء على ذكر النساء والأطفال منفصلًا
  alternative: ترجمة اللفظة بـ«شخص» أو «إنسان»
  rationale: النص اليوناني يحدد المعدودين بأنهم ذكور، ثم يذكر النساء والأطفال بوصفهم غير داخلين في هذا العدد. استعمال لفظ عام يمحو هذا التفصيل من النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على التقريب في العدد وعلى التمييز الصريح بين الرجال والنساء والأطفال، من غير تفسير زائد.
