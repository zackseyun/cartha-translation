  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: ar
  text: لأن هيرودس كان قد قبض على يوحنا[a]، وقيده، وأودعه السجن بسبب هيروديا، زوجة فيلبس أخيه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ أمسك يوحنا... أودعه السجن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لأن
  rationale: تحفظ الأداة معناها التعليلي الذي يربط الآية بما سبق، وتأتي طبيعية في العربية ضمن السياق.
- source_word: κρατήσας
  choice: كان قد قبض على
  rationale: ينقل الفعل معنى الإمساك المؤدي إلى الاحتجاز، ويُظهر أن هذا الحدث سبق الفعلين الرئيسيين من غير تقييد المعنى بمصطلح قانوني حديث أكثر مما يلزم.
- source_word: ἔδησεν
  choice: قيده
  rationale: يحفظ المعنى الحسي المباشر للفعل من غير تحديد وسيلة التقييد، كالحبال أو السلاسل.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: أودعه السجن
  rationale: تعبير عربي واضح وطبيعي يدل على وضعه في الحبس، ويقابل التركيب اليوناني اصطلاحيًا.
- source_word: διὰ Ἡρῳδιάδα
  choice: بسبب هيروديا
  rationale: ينقل دلالة السبب في διά مع حالة النصب بوضوح، من غير إضافة تفسير لطبيعة الدافع.
- source_word: γυναῖκα
  choice: زوجة
  rationale: المعنى العلاقي المقصود من γυνή في هذا التركيب هو الزوجة لا مجرد المرأة.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: فيلبس أخيه
  rationale: يحفظ علاقة البدل في اليونانية، ويوضح أن فيلبس هو أخو هيرودس بصياغة عربية موجزة.
theological_decisions:
- issue: التوصيف التاريخي والأخلاقي لعلاقة هيروديا بفيلبس
  choice: هيروديا، زوجة فيلبس أخيه
  alternative: هيروديا، زوجة أخيه فيلبس
  rationale: تعرّف الآية هيروديا بعلاقتها بفيلبس من غير أن تصرّح هنا بالحكم على علاقة هيرودس بها؛ لذلك لا تُستبق الإدانة الصريحة الواردة في الآية التالية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «كان قد» لإبراز سبق القبض زمنيًا، مع إبقاء «قيده» و«أودعه السجن» فعلين سرديين مباشرين. أبقيت الفاصلة الختامية لأن الآية تتصل نحويًا بما يليها.
