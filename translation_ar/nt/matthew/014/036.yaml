  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: ar
  text: وكانوا يتوسّلون إليه أن يلمسوا هدب ثوبه فقط[a]؛ وكل من لمسه شُفي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طرف ثوبه» أو «حاشية ثوبه»؛ فاللفظ اليوناني قد يشير إلى حافة الثوب أو هدبه، وربما شمل الشرّابة.
    reason: lexical_alternative
  - marker: b
    text: أو «صار معافًى». يمكن أن يعني الفعل اليوناني «نَجا» أو «أُنقذ» أو «صار معافًى»، والمقصود هنا، بحسب السياق، الشفاء الجسدي.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: كانوا يتوسّلون إليه
  rationale: صيغة الماضي الناقص تدل على التماس متكرر أو مستمر، و«يتوسّلون» تنقل الإلحاح بعبارة عربية طبيعية.
- source_word: ἵνα μόνον ἅψωνται
  choice: أن يدعهم يلمسون ... فقط
  rationale: تنقل مضمون الالتماس، وتحفظ «فقط» تأكيد أن مجرد اللمس هو المطلوب.
- source_word: τοῦ κρασπέδου
  choice: هدب
  rationale: يمكن أن يدل اللفظ على طرف الثوب أو حاشيته أو هدبه، وربما شمل الشرّابة؛ و«هدب» يحفظ هذا المجال دون الجزم بأنه شرّابة بعينها.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ثوبه
  rationale: ترجمة عامة وطبيعية للثوب الخارجي، من غير تخصيصه برداء ذي هيئة معينة.
- source_word: ὅσοι
  choice: كل من
  rationale: صياغة عربية واضحة تؤدي المعنى الشمولي التوزيعي للفظ اليوناني.
- source_word: ἥψαντο
  choice: لمسه
  rationale: الضمير يعود بصورة طبيعية إلى الهدب المذكور مباشرة.
- source_word: διεσώθησαν
  choice: نجا معافًى
  rationale: يحفظ في العربية صدى معنى النجاة أو الإنقاذ في الفعل المركب، مع توضيح أن النتيجة في هذا السياق هي العافية الجسدية، بدل حصر اللفظ في «شُفي» وحدها.
theological_decisions:
- issue: دلالة διεσώθησαν في سياق المعجزات والشفاء
  choice: نجا معافًى
  alternative: شُفي؛ صار معافًى؛ خَلَص
  rationale: السياق المباشر جسدي، لكن الفعل أوسع معجميًا من الشفاء وحده ويمكن أن يدل على الإنقاذ أو النجاة. تجمع الصياغة المختارة بين دلالة السياق وبين اتساع اللفظ، من غير تحويل الآية إلى تقرير صريح عن الخلاص الروحي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «كانوا يتوسّلون» لإظهار استمرار الالتماس، و«نجا معافًى» للموازنة بين الدلالة المعجمية الواسعة للفعل وسياق الشفاء الجسدي. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحانهما.
