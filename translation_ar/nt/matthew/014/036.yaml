    rationale: الالتماس موجّه إليه بلا شك، لكن اليونانية تقول إنهم كانوا يطلبون أن يلمسوا، لا «أن يسمح لهم» بلفظ صريح. يمكن للعربية أن تنقل ذلك مباشرة.
