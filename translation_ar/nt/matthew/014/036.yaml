review_pass:
  verdict: revise
  source_fidelity: 'تحتاج العبارة الختامية إلى تعديل: «نجا معافًى» ليست مقابلاً عربيًا سليمًا أو طبيعيًا للمبني للمجهول διεσώθησαν في هذا السياق، وتوحي بأن الشخص نجا وهو في حالة عافية بدل أن تفيد حصول الشفاء. والسياق في متى 14:35–36 يحدد المقصود بالشفاء الجسدي. أما «كانوا يتوسّلون إليه» و«هدب ثوبه» فيحافظان جيدًا على الإلحاح وعلى سعة κράσπεδον.'
  naturalness: '«نجا معافًى» تركيب متعثر في العربية الفصحى الحديثة. «شُفي» واضح وطبيعي ومناسب للسياق. وحذف «أن يدعهم» يجعل الطلب أقرب إلى بناء اليونانية، إذ لا يصرح النص بفعل الإذن بل بمضمون الالتماس: أن يلمسوا الهدب فقط.'
