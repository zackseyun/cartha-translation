  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: ar
  text: وفي الحال ألزم التلاميذ أن يركبوا القارب ويسبقوه إلى الضفة الأخرى، ريثما يصرف الجموع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: في الحال
  rationale: تؤدي معنى المبادرة والانتقال السريع في السرد بلغة عربية واضحة وطبيعية.
- source_word: ἠνάγκασεν
  choice: ألزم
  rationale: يحفظ معنى الإصرار القوي أو الإكراه الذي يحمله الفعل، من غير أن يوحي بالضرورة بعنف جسدي.
- source_word: τοὺς μαθητάς
  choice: التلاميذ
  rationale: أداة التعريف تشير إلى الجماعة المعروفة، ولا حاجة إلى إضافة «تلاميذه» لأن ضمير الملكية غير مصرح به في اليونانية.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: أن يركبوا القارب
  rationale: «يركب القارب» تعبير عربي طبيعي ودقيق للصعود إليه، والسياق يحدد القارب المقصود رغم غياب أداة التعريف في اليونانية.
- source_word: προάγειν αὐτόν
  choice: يسبقوه
  rationale: يعبر بإيجاز ووضوح عن ذهاب التلاميذ أمام يسوع ووصولهم قبله.
- source_word: εἰς τὸ πέραν
  choice: إلى الضفة الأخرى
  rationale: يوضح أن المقصود هو الجانب المقابل من المسطح المائي.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: ريثما يصرف
  rationale: «ريثما» تحفظ العلاقة الزمنية والغاية المستقبلية النسبية التي يفيدها التركيب مع صيغة الاحتمال، في عربية سلسة.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: يصرف الجموع
  rationale: ينقل معنى إرسال الجموع بعيدًا أو إنهاء اجتماعها، ويحافظ على صيغة الجمع الصريحة.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة، بصياغة سردية طبيعية. لا تستدعي الآية حاشية؛ فالحاشية الإنجليزية المرفقة تبدو مزاحة موضعيًا، إذ إن بديل «send the crowds away» يتعلق بالفعل ἀπολύσῃ لا بعبارة «إلى الضفة الأخرى»، والمعنى مستوعب طبيعيًا في «يصرف الجموع».
