base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: ar
  text: 'لكنه لما رأى الريح الشديدة[a] خاف، ولما بدأ يغرق صرخ قائلًا: «يا رب، خلِّصني[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الريح العاتية».
    reason: lexical_alternative
  - marker: b
    text: أو «أنقذني». يمكن أن يدل الفعل اليوناني على الإنقاذ من خطر مباشر، كما يمكن أن يدل على الخلاص بمعناه الأوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: لما رأى
  rationale: ينقل الإدراك المتزامن مع الحدث بصياغة عربية طبيعية، من غير تحويل الرؤية إلى مجرد شعور بالريح.
- source_word: δὲ
  choice: لكنه
  rationale: يُظهر التحول التقابلي من سير بطرس على الماء إلى خوفه وغرقه.
- source_word: ἄνεμον ἰσχυρόν
  choice: الريح الشديدة
  rationale: ترجمة مباشرة وواضحة للريح الموصوفة بالقوة، مع إثبات البديل الدلالي في الحاشية.
- source_word: ἐφοβήθη
  choice: خاف
  rationale: يعبّر الفعل في السياق عن بدء الخوف عند رؤية الريح، والصياغة العربية الموجزة طبيعية وواضحة.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: لما بدأ يغرق
  rationale: يحافظ على كون الغرق عملية بدأت للتو، ولا يوحي بأنه غرق بالفعل أو مات.
- source_word: ἔκραξεν λέγων
  choice: صرخ قائلًا
  rationale: ينقل شدة النداء ويحافظ على الصلة بين الصراخ والكلام المباشر.
- source_word: Κύριε
  choice: يا رب
  rationale: الترجمة المألوفة الدقيقة للنداء المباشر إلى يسوع، وتحافظ على ما يحمله اللقب من دلالة من غير زيادة تفسيرية.
- source_word: σῶσόν με
  choice: خلِّصني
  rationale: ينقل صيغة الأمر العاجل ويحافظ على المجال الدلالي الأوسع للفعل، مع وضوح أن المقصود هنا النجاة من خطر مباشر.
theological_decisions:
- issue: ترجمة κύριος في خطاب مباشر ليسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» هي المقابل الطبيعي المألوف وتحفظ الثقل المسيحاني المحتمل للقب من غير أن تحسم ما يتجاوز دلالة السياق.
- issue: ترجمة σῴζω في سياق خطر جسدي مباشر
  choice: خلِّصني
  alternative: أنقذني
  rationale: «خلِّصني» تلائم الاستغاثة العاجلة وتحفظ في الوقت نفسه المدى الدلالي الأوسع للفعل اليوناني، أما «أنقذني» فتبرز النجاة الجسدية الآنية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُخدم «لما» لربط الأفعال زمنيًا بصورة طبيعية، وأُبقيت الاستغاثة قصيرة وقوية كما في الأصل.
