source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: ar
  text: وجيء برأسه على طبق[a]، وأُعطي للفتاة، فأتت به إلى أمها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «على صينية» أو «على صحن». تشير الكلمة اليونانية πίναξ إلى طبق أو صينية تُستخدم للتقديم.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: جيء بـ
  rationale: ينقل صيغة المبني للمجهول ومعنى الإحضار في سياق سردي عربي طبيعي.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: رأسه
  rationale: ترجمة مباشرة للعبارة اليونانية من غير تلطيف للمشهد.
- source_word: ἐπὶ πίνακι
  choice: على طبق
  rationale: يدل πίναξ هنا على طبق أو صينية للتقديم؛ و«طبق» لفظ واضح وطبيعي في العربية المعاصرة.
- source_word: ἐδόθη
  choice: أُعطي
  rationale: يحافظ على صيغة المبني للمجهول في اليونانية، والفاعل النحوي هو «رأسه» ولذلك جاء الفعل مذكرًا.
- source_word: τῷ κορασίῳ
  choice: للفتاة
  rationale: «الفتاة» ترجمة واضحة وطبيعية لـ κοράσιον، من غير استعمال لفظ قديم أو إضافة تحديد عمري غير لازم.
- source_word: ἤνεγκεν
  choice: فأتت به
  rationale: يؤدي معنى أنها حملته وأوصلته إلى أمها، مع ضمير يعود بوضوح إلى الرأس، ويجري بسلاسة في العربية.
- source_word: τῇ μητρὶ αὐτῆς
  choice: إلى أمها
  rationale: ترجمة مباشرة توضح أن المقصود أم الفتاة.
theological_decisions: []
