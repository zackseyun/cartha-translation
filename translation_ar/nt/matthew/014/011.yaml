  register: عربية فصحى حديثة واضحة وكريمة، تحافظ على تسلسل المبني للمجهول في الجملتين الأوليين، من غير تلطيف للعنف الصريح في النص. وُضع مؤشر الحاشية بعد «طبق» لأنه اللفظ الذي تشرحه الحاشية.
