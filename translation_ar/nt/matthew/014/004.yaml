base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: ar
  text: 'لِأَنَّ يُوحَنَّا كَانَ يَقُولُ لَهُ: «لَا يَحِلُّ لَكَ أَنْ تَكُونَ هِيَ لَكَ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يجوز لك أن تكون هي لك».'
    reason: بديل معجمي لعبارة Οὐκ ἔξεστίν، إذ يمكن أن تدل على عدم الجواز أو عدم المشروعية.
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص اليونانية تدل على قول مستمر أو متكرر في الماضي، و«كان يقول» تؤدي هذا المعنى طبيعيًا بالعربية.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تقدم الأداة تعليلًا أو خلفية تفسيرية لما سبق، و«لأنَّ» توضح هذه الصلة.
- source_word: αὐτῷ
  choice: له
  rationale: الضمير في حالة المفعول غير المباشر مع فعل القول يُنقل طبيعيًا بـ«له».
- source_word: ὁ Ἰωάννης
  choice: يوحنا
  rationale: النص اليوناني يذكر الاسم وحده، والسياق القريب يحدد المقصود، فلا حاجة إلى إضافة «المعمدان».
- source_word: Οὐκ ἔξεστίν
  choice: لا يحلّ
  rationale: التعبير يدل على عدم الجواز أو المشروعية، و«لا يحلّ» يحفظ القوة القانونية الأخلاقية للتوبيخ بصياغة عربية مألوفة.
- source_word: σοι
  choice: لك
  rationale: مع التعبير غير الشخصي ἔξεστιν، تنقل اللام الشخص الذي يتعلق به الجواز.
- source_word: ἔχειν
  choice: أن تكون لك
  rationale: الفعل يعني حرفيًا «أن يكون له/يمتلك»، لكنه في السياق يشير إلى اتخاذ المرأة زوجة أو إبقائها في علاقة زوجية؛ و«أن تكون لك» تحفظ الإيجاز والإحالة السياقية دون إضافة «زوجة» إلى المتن.
- source_word: αὐτήν
  choice: ها في «تكون لك»
  rationale: ضمير المؤنث يعود مباشرة إلى هيروديا، وتؤديه العربية بضمير مستتر يعود إلى مؤنث في تركيب «تكون لك» دون تكرار اسمها.
theological_decisions:
- issue: طبيعة توبيخ يوحنا
  choice: «لا يحلّ لك أن تكون لك» بوصفه منعًا ذا قوة شرعية أخلاقية
  alternative: «لا يجوز لك أن تكون لك» أو «ليس من حقك أن تكون لك»
  rationale: ἔξεστιν يتعلق بالجواز والمشروعية. و«لا يحلّ» يحفظ حدة التوبيخ من غير أن يضيف تحديدًا صريحًا لمصدر الشريعة أو تفصيلًا غير وارد في الآية.
- issue: دلالة ἔχειν على العلاقة الزوجية
  choice: الإبقاء على التعبير الموجز «أن تكون لك»
  alternative: «أن تتخذها زوجة» أو «أن تبقيها زوجة لك»
  rationale: السياق يدل على العلاقة الزوجية، لكن المصدر لا يذكر لفظ «زوجة» صراحة؛ لذلك تُترك الدلالة للسياق حفاظًا على حدود النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كان يقول» لإظهار الاستمرار في الماضي، و«لا يحلّ» لنقل القوة الشرعية الأخلاقية. وُضع مؤشر الحاشية [a] في المتن.
