lexical_decisions:
- source_word: θέλων
  choice: ومع أنه كان يريد
  rationale: اسم الفاعل يفيد الإرادة، ويُفهم في السياق على وجه الاستدراك مع الفعل الرئيس؛ صيغت العلاقة صراحةً بعربية طبيعية، مع التنبيه في الحاشية إلى الصياغة الأقرب إلى المبنى اليوناني.
- source_word: ἀποκτεῖναι
  choice: أن يقتله
  rationale: تؤدي المعنى المباشر، «يقتل»، من غير إضافة الحكم الأخلاقي الذي قد توحي به ألفاظ مثل «يغتاله».
- source_word: ἐφοβήθη τὸν ὄχλον
  choice: خاف من الجمع
  rationale: تعبير عربي واضح يحفظ معنى الخوف من جمهور الناس؛ و«الجمع» لفظ فصيح مفهوم يلائم السرد.
- source_word: ὅτι
  choice: لأن
  rationale: تدخل على علة خوفه كما في الأصل.
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: كانوا يعدّونه نبيًّا
  rationale: ينقل التركيب الاصطلاحي الدال على اعتبار الشخص أو النظر إليه بصفة معينة، من غير أن يجعل النص نفسه يحكم بصحة اعتقاد الجمع.
theological_decisions:
- issue: هوية الفاعل والمفعول المفهومة من السياق
  choice: 'الإبقاء على الضميرين: «أنه» و«يقتله»'
  alternative: 'التصريح بالاسمين: «هيرودس» و«يوحنا»'
  rationale: الأصل اليوناني يستعمل الضمائر، والسياق السابق يحدد مرجعيهما؛ فالإبقاء عليها يصون صيغة المصدر ولا يضيف أسماء غير مذكورة في هذه الآية.
- issue: العلاقة بين إرادة القتل والخوف من الجمع
  choice: 'صياغة اسم الفاعل على وجه استدراكي: «ومع أنه كان يريد»'
  alternative: 'الصياغة الأقرب حرفيًا: «وإذ كان يريد أن يقتله، خاف من الجمع»'
  rationale: السياق يفيد أن الخوف حال دون تنفيذ الإرادة، لكن لما كانت الدلالة الاستدراكية مستنبطة من السياق لا من أداة صريحة، أُثبت البديل الأقرب إلى المبنى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «الجمع» مقابل ὄχλος، و«يعدّونه» للتعبير الاصطلاحي عن اعتبار يوحنا نبيًّا. وُضعت علامة الحاشية بعد الجملة التي تتناولها.
