  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: ar
  text: لِذَلِكَ وَعَدَهَا بِقَسَمٍ أَنْ يُعْطِيَهَا مَهْمَا تَطْلُبُ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيَّ شيء تطلبه». يستعمل اليوناني جملة موصولية غير محددة (ὃ ἐὰν αἰτήσηται)، تفيد طلبًا مستقبليًا مفتوحًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: لذلك
  rationale: أداة استنتاج تربط الوعد بما سبقه في السرد، وتحفظ القوة السببية أو النتيجية بعبارة عربية طبيعية.
- source_word: μετὰ ὅρκου
  choice: بقسم
  rationale: تفيد العبارة أن الوعد اقترن بقسم؛ و«بقسم» موجزة وفصيحة وتحفظ معنى المصاحبة وطابع الالتزام المؤكد.
- source_word: ὡμολόγησεν
  choice: وعدها
  rationale: الفعل هنا يدل على التزام مؤكد، لا على الاعتراف؛ وإدخال ضمير المفعول يحفظ دلالة αὐτῇ بصورة طبيعية.
- source_word: δοῦναι
  choice: أن يعطيها
  rationale: ينقل المصدر المتمم الذي يبين مضمون الوعد، مع إظهار المتلقية كما يقتضيه السياق والتركيب العربي.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: مهما تطلب
  rationale: «مهما» مع المضارع تعبر طبيعيًا عن جملة موصولية شرطية غير محددة، وتبقي الطلب المستقبلي مفتوحًا دون تقييده.
theological_decisions: []
