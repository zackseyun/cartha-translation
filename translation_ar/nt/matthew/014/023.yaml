  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: ar
  text: وبعدما صرف الجموع، صعد إلى الجبل منفردًا ليصلّي. ولما حلّ المساء، كان هناك وحده.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσας
  choice: بعدما صرف
  rationale: اسم الفاعل الماضي يسبق الفعل الرئيس ويفيد هنا التعاقب الزمني؛ و«صرف» تعبير عربي طبيعي يدل على إنهاء اجتماع الجموع وإرسالهم دون إضافة معنى غير موجود.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: يحفظ صيغة الجمع ودلالة الجماعات المحتشدة، وهو أفصح وأشيع في السياق الإنجيلي من «الحشود».
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: صعد إلى الجبل
  rationale: ينقل الحركة صعودًا نحو الجبل بعبارة عربية طبيعية ودقيقة.
- source_word: κατ’ ἰδίαν
  choice: منفردًا
  rationale: ينقل معنى الانفراد والابتعاد عن الآخرين، مع تمييزه أسلوبيًا عن μόνος في ختام الآية.
- source_word: προσεύξασθαι
  choice: ليصلّي
  rationale: لام التعليل مع الفعل المضارع تعبّر طبيعيًا عن مصدر الغرض في اليونانية.
- source_word: ὀψίας δὲ γενομένης
  choice: ولما حلّ المساء
  rationale: ينقل التركيب الزمني المستقل بانتقال سردي عربي سلس، من غير المبالغة في تحديد وقت المساء.
- source_word: μόνος ἦν ἐκεῖ
  choice: كان هناك وحده
  rationale: يحفظ ترتيب عناصر المعنى والتوكيد الختامي على كونه وحده.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «منفردًا» ثم «وحده» للحفاظ على تكرار دلالة العزلة في الأصل من غير ركاكة لفظية. لا تستلزم الآية حاشية؛ فبديل «على انفراد» لا يغيّر المعنى بما يكفي لتوثيقه.
