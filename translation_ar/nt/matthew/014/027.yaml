  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: ar
  text: 'لكن يسوع كلّمهم في الحال قائلًا: «تشجّعوا! أنا هو[a]. لا تخافوا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو حرفيًا: «أنا هو». ويمكن أن تعني في هذا السياق: «هذا أنا». وقد يسمع فيها بعض القرّاء صدى للتعريف الإلهي بالنفس.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: في الحال
  rationale: ينقل الدلالة الزمنية بوضوح وبأسلوب عربي معاصر، من غير تكلّف.
- source_word: δὲ
  choice: لكن
  rationale: يفيد انتقالًا فيه مقابلة لطيفة مع خوف التلاميذ في الآية السابقة.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: يسوع كلّمهم ... قائلًا
  rationale: يحافظ على فعل الكلام، والمفعول غير المباشر، والبنية الحالية لاسم الفاعل، بصياغة عربية طبيعية.
- source_word: Θαρσεῖτε
  choice: تشجّعوا
  rationale: أمر للجمع يدعو إلى الثقة والشجاعة، وهو واضح ومباشر في العربية الحديثة.
- source_word: ἐγώ εἰμι
  choice: أنا هو
  rationale: تصلح في السياق للتعريف بالنفس، وتحافظ في الوقت نفسه على شيء من الصياغة اليونانية وما قد تحمله من صدى لاهوتي، دون الجزم به.
- source_word: μὴ φοβεῖσθε
  choice: لا تخافوا
  rationale: صياغة عربية طبيعية تحافظ على النهي الموجّه إلى الجمع من غير تحميل صيغة المضارع معنى زمنيًا زائدًا.
theological_decisions:
- issue: هل ἐγώ εἰμι مجرد تعريف بالنفس أم يحمل صدى لعبارة التعريف الإلهي؟
  choice: أنا هو
  alternative: 'هذا أنا؛ أو حرفيًا: أنا كائن'
  rationale: السياق المباشر هو طمأنة التلاميذ بتعريف يسوع بنفسه، لكن العبارة اليونانية قد تتيح أيضًا صدى لاهوتيًا. «أنا هو» تحفظ هذا التوتر أفضل من صياغة تحسم المعنى في اتجاه واحد، وتوضح الحاشية المعنى السياقي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «في الحال» بدل تعبيرات أقدم، و«تشجّعوا» لنقل الأمر بصياغة مألوفة. وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
