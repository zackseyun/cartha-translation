  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: ar
  text: 'أما هي، فبعد أن حثّتها أمها، قالت: «أعطني هنا على طبق رأس يوحنا المُعمِّد[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب التعبير التقليدي الشائع: «يوحنا المعمدان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: بعد أن لقّنتها
  rationale: يفيد اسم الفاعل المبني للمجهول تأثير الأم السابق في الفتاة وتوجيهها إلى ما تطلبه. و«لقّنتها» تعبير عربي طبيعي يحفظ معنى الحث والتوجيه من غير أن يجعله تعليمًا رسميًا.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: أمها
  rationale: تدل ὑπό مع المضاف إليه على أن الأم هي صاحبة الفعل في التركيب المبني للمجهول، وهو ظاهر في اتصال الضمير بالفعل العربي «لقّنتها».
- source_word: Δός μοι
  choice: أعطني
  rationale: ينقل صيغة الأمر المباشر بأوجز تعبير عربي طبيعي.
- source_word: φησίν
  choice: قالت
  rationale: مع أن اليونانية تستعمل المضارع التاريخي لإضفاء الحيوية، فإن الماضي هو الأسلوب العربي السردي الطبيعي هنا، من غير فقدان مضمون الحدث.
- source_word: ὧδε
  choice: هنا
  rationale: يحفظ الدلالة المكانية المباشرة، وقد توحي في السياق أيضًا بطلب التنفيذ في الحال من غير التصريح بما ليس في اللفظ.
- source_word: ἐπὶ πίνακι
  choice: على طبق
  rationale: يشير πίναξ في سياق الوليمة إلى طبق أو صينية للتقديم؛ و«طبق» واضح وطبيعي ويحفظ صورة حمل الرأس عليه.
- source_word: τὴν κεφαλὴν
  choice: رأس
  rationale: نقل مباشر يحافظ على صراحة الطلب وبشاعته كما في النص.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: يوحنا المُعمِّد
  rationale: «المُعمِّد» اسم فاعل ينقل الوظيفة الوصفية للقب اليوناني βαπτιστής، وهو كذلك التعبير العربي الكتابي المألوف.
theological_decisions:
- issue: ترجمة لقب يوحنا βαπτιστής
  choice: يوحنا المُعمِّد
  alternative: يوحنا المعمدان
  rationale: «المُعمِّد» يحفظ بوضوح معنى اسم الفاعل اليوناني، أي الذي كان يعمّد، بينما «المعمدان» هو اللقب العربي التقليدي الشائع؛ أُثبت البديل في الحاشية مراعاةً لألفة القراء من غير طمس القوة الوصفية للأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أما هي، فبعد أن...» لربط الجملة بالسياق وإبراز انتقال النظر إلى الفتاة، مع صياغة عربية طبيعية بدل محاكاة ترتيب الكلمات اليوناني.
