source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: ar
  text: 'وقال لخدمه: «هذا هو يوحنا المعمدان. لقد أُقيم من بين الأموات، ولهذا تعمل فيه القوى[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي «القوى الخارقة»، أو بتفسير أوسع: «المعجزات». يقول النص اليوناني حرفيًا «القوى» (αἱ δυνάμεις)، والمقصود قوة فوق طبيعية تتجلى في أعمال مقتدرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: خدمه
  rationale: يمكن أن تدل اللفظة على الأولاد أو الخدم أو المرافقين. والسياق هنا هو حاشية هيرودس وخدمه، لذا تنقل «خدمه» العلاقة الاجتماعية بوضوح من غير تحديد رتبة بعينها.
- source_word: ὁ βαπτιστής
  choice: المعمدان
  rationale: هذا هو اللقب العربي الراسخ ليوحنا، وهو يؤدي معنى من يقوم بالتعميد بصورة طبيعية ومفهومة.
- source_word: ἠγέρθη
  choice: أُقيم
  rationale: تحافظ صيغة المبني للمجهول على المبني للمجهول في اليونانية، فلا توحي بأن يوحنا أقام نفسه.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: من بين الأموات
  rationale: تنقل العبارة اليونانية بوضوح، إذ تشير إلى الإقامة من وسط جماعة الأموات.
- source_word: διὰ τοῦτο
  choice: ولهذا
  rationale: تؤدي العلاقة السببية والاستنتاجية بإيجاز طبيعي في العربية.
- source_word: αἱ δυνάμεις
  choice: القوى
  rationale: تحافظ على الاسم اليوناني من غير اختزاله في نتائج عمله، أي «المعجزات»، مع إيضاح دلالته السياقية في الحاشية.
- source_word: ἐνεργοῦσιν
  choice: تعمل
  rationale: تعبير عربي طبيعي يفيد أن هذه القوى فاعلة ومؤثرة.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحافظ على الدلالة المباشرة لحرف الجر اليوناني، من غير استبدالها بالتفسير الأبعد «من خلاله».
theological_decisions:
- issue: كيفية عودة يوحنا من الموت
  choice: لقد أُقيم من بين الأموات
  alternative: لقد قام من بين الأموات
  rationale: المبني للمجهول في الأصل يُحفظ كما هو، من غير توسيع قول هيرودس إلى تقرير لاهوتي عمّن أقامه أو كيفية ذلك.
- issue: دلالة δυνάμεις في السياق
  choice: تعمل فيه القوى
  alternative: تعمل فيه القوى الخارقة / تحدث المعجزات على يديه
  rationale: يرجح السياق معنى القوى الخارقة المتجلية في أعمال مقتدرة، لكن إبقاء «القوى» في المتن يصون اتساع اللفظة ولا يحولها مباشرة إلى الأعمال الناتجة عنها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «خدمه» بدل تعبيرات قديمة أو محددة الرتبة، وحُفظ المبني للمجهول في «أُقيم». وُضعت علامة الحاشية بعد «القوى» لأنها اللفظة التي تشرحها الحاشية.
