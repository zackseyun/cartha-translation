  source_fidelity: 'ينقل النص عناصر اليونانية الأساسية بأمانة: παισίν بـ«خدمه» في سياق بلاط هيرودس، وἠγέρθη بالمبني للمجهول «أُقيم»، وἀπὸ τῶν νεκρῶν بـ«من بين الأموات»، وعلاقة السببية في διὰ τοῦτο بـ«ولهذا». كما يحافظ «تعمل فيه القوى» على αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ من غير تحويل القوى مباشرة إلى «معجزات» أو تفسير ἐν بـ«من خلال».'
