  terminology: «يوحنا المعمدان» لقب عربي راسخ ومناسب، و«أُقيم» يحفظ المبني للمجهول بلا تحميل لاهوتي إضافي. الحاشية مرتبطة في الموضع الصحيح وتوضح أن «القوى» قد تشير إلى القوى الخارقة المتجلية في أعمال عظيمة، مع إبقاء اللفظ الأوسع في المتن.
