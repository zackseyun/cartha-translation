  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: ar
  text: وفي نوبة الحراسة الرابعة من الليل[a] جاء إليهم ماشيًا على البحر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «نوبة الحراسة الرابعة من الليل» هي نوبة الحراسة الليلية الأخيرة، وكانت تمتد تقريبًا من الساعة الثالثة إلى السادسة صباحًا بحسب التقسيم الروماني.
    reason: cultural_note
  - marker: b
    text: 'أي: فوق سطح البحر. وقد فهم بعضهم العبارة بمعنى «ماشيًا بمحاذاة البحر»، لكن السياق يرجح بقوة أنه كان يمشي على الماء نفسه.'
    reason: alternative_reading
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: في الهزيع الرابع من الليل
  rationale: العبارة في حالة المجرور اليونانية تؤدي معنى زمنيًا. ولفظ «الهزيع» يحفظ تقسيم الليل التاريخي إلى نوبات حراسة، مع إيضاح المقصود في الحاشية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، وتقابلها الواو طبيعيًا في العربية.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: جاء إليهم
  rationale: يعبر الفعل مع πρός عن الحركة باتجاه التلاميذ، و«جاء إليهم» صياغة عربية مباشرة وطبيعية.
- source_word: περιπατῶν
  choice: ماشيًا
  rationale: اسم الفاعل الحالي متزامن مع الفعل الرئيس، وينقله الحال «ماشيًا» بوضوح وإيجاز.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: على البحر
  rationale: مع فعل المشي والسياق، تدل العبارة على الحركة فوق سطح الماء. ويحافظ «البحر» على المقابل المعجمي لـ θάλασσα بدل استبداله بالتحديد الجغرافي «البحيرة».
theological_decisions:
- issue: وصف حركة يسوع المعجزية على الماء
  choice: ماشيًا على البحر
  alternative: ماشيًا بمحاذاة البحر
  rationale: تركيب περιπατῶν ἐπὶ τὴν θάλασσαν وسياق الرواية يرجحان بوضوح المشي فوق الماء، لا السير على الشاطئ. وتحفظ الصياغة المعنى الظاهر للنص دون تقليل طابعه المعجزي أو إضافة تفسير إليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعمل «الهزيع» حفاظًا على الإطار التاريخي، مع شرحه في الحاشية، ووُضعت علامات الحواشي بحسب ترتيب ظهورها في النص العربي.
