id: MAT.14.12
reference: Matthew 14:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: ar
  text: فتقدَّم تلاميذه، وأخذوا الجثمان ودفنوه، ثم ذهبوا وأخبروا يسوع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: فتقدَّم
  rationale: اسم الفاعل الأوريستي يدل على اقتراب التلاميذ للشروع في الفعل؛ و«تقدَّم» تعبير عربي طبيعي يحفظ معنى الاقتراب.
- source_word: μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: يحفظ المصطلح المعروف للتلاميذ، وتعود الهاء بحسب السياق المباشر إلى يوحنا المعمدان من غير حاجة إلى التصريح باسمه.
- source_word: ἦραν
  choice: أخذوا
  rationale: ينقل معنى αἴρω في سياق نقل الجثمان، من غير إضافة تفصيل مثل حمله بعيدًا.
- source_word: πτῶμα
  choice: الجثمان
  rationale: اللفظة اليونانية تعني جسد الميت؛ و«الجثمان» واضحة وكريمة الأسلوب، وتدل صراحة على الجسد بعد الموت.
- source_word: ἔθαψαν αὐτόν
  choice: دفنوه
  rationale: ترجمة مباشرة موجزة للفعل والضمير، بلا استيراد تفصيل عن قبر أو مدفن غير مذكور في الآية.
- source_word: ἐλθόντες
  choice: ثم ذهبوا
  rationale: يُصاغ اسم الفاعل اليوناني فعلًا عربيًا متسلسلًا؛ و«ثم» توضح تعاقب الحدثين، أما «ذهبوا» فتلائم الحركة نحو يسوع بحسب السياق.
- source_word: ἀπήγγειλαν
  choice: أخبروا
  rationale: ينقل معنى الإبلاغ نقلًا طبيعيًا في العربية، والمفعول المحذوف في اليونانية يبقى مفهومًا من السياق.
- source_word: τῷ Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية الكتابية المعيارية للاسم Ἰησοῦς.
theological_decisions:
- issue: مرجع الضمير في «تلاميذه»
  choice: تلاميذ يوحنا المعمدان هم المقصودون بحسب السياق، مع إبقاء الضمير كما في اليونانية.
  alternative: أن يكون المقصود تلاميذ يسوع.
  rationale: السياق المباشر يروي مقتل يوحنا والتعامل مع جثمانه، ولذلك يعود الضمير طبيعيًا إليه؛ والإبقاء على «تلاميذه» يحفظ صياغة الأصل ولا يبدد ما فيه من اعتماد على السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة، بصياغة سردية طبيعية. اختير «الجثمان» لأنها تؤدي دلالة πτῶμα على جسد ميت من غير خشونة «الجثة». لا حاجة إلى حاشية لأن اللفظ العربي المختار يصرح بالدلالة المعجمية.
