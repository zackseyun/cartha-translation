  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: ar
  text: 'فلما رآه التلاميذ ماشيًا على البحر، اضطربوا وقالوا: «إنه شبح![أ]» وصرخوا من الخوف.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: أو «طيف» أو «ظهور».
    reason: بدائل معجمية لكلمة φάντασμα، التي تدل على شبح أو ظهور مخيف.
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا سرديًا مع مسحة من المقابلة، وتنساب طبيعيًا مع «لما» في العربية.
- source_word: μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف اليونانية تحدد الجماعة المعروفة من السياق، ولا حاجة إلى إضافة «تلاميذه».
- source_word: ἰδόντες αὐτὸν
  choice: لما رآه التلاميذ
  rationale: حُوِّل اسم الفاعل الماضي إلى جملة زمنية طبيعية تحفظ ترتيب الحدث.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: ماشيًا على البحر
  rationale: تحافظ العبارة على صورة الحركة فوق سطح البحر وعلى لفظ «البحر» الوارد في اليونانية.
- source_word: ἐταράχθησαν
  choice: اضطربوا
  rationale: ينقل الفعل معنى الاضطراب والانزعاج الشديد من غير أن يختزل دلالته في الخوف وحده، إذ يصرح آخر الآية بالخوف.
- source_word: λέγοντες
  choice: وقالوا
  rationale: عطف الفعل المصرف أوضح وأطبع في السرد العربي من ترجمة اسم الفاعل حرفيًا.
- source_word: Φάντασμά ἐστιν
  choice: إنه شبح!
  rationale: «شبح» لفظ عربي واضح يدل على هيئة مخيفة أو ظهور غير مألوف، وينقل استنتاج التلاميذ من غير تقرير حقيقته ontologically.
- source_word: ἀπὸ τοῦ φόβου
  choice: من الخوف
  rationale: يحفظ دلالة المصدر أو السبب التي تؤديها ἀπό هنا.
- source_word: ἔκραξαν
  choice: صرخوا
  rationale: ينقل بوضوح الصيحة العالية الناجمة عن الخوف، وهو طبيعي في العربية المعاصرة.
theological_decisions:
- issue: طبيعة φάντασμα في قول التلاميذ
  choice: شبح
  alternative: طيف أو خيال
  rationale: العبارة تروي تصور التلاميذ المذعور والخاطئ للمشهد، ولا تقدم تقريرًا عقائديًا عن طبيعة الأرواح؛ لذلك اختير لفظ مفهوم لا يتجاوز دعوى السرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع تركيب سردي طبيعي. لم تُضف حاشية لأن الحاشية الإنجليزية المعطاة تبدو مرتبطة بعلامة موضوعة بعد «البحر» مع أن مضمونها يخص φάντασμα؛ وقد أُبقيت البدائل المعجمية في سجل القرارات بدل إدخال علامة ملتبسة في النص.
