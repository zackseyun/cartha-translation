id: MAT.2.11
reference: Matthew 2:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: ar
  text: 'ودخلوا البيت، فرأوا الطفل مع مريم أمه، فسجدوا له[a]. ثم فتحوا كنوزهم وقدموا له هدايا: ذهبًا ولبانًا ومُرًّا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني العبارة: «عبدوه»، أو «انحنوا له إجلالًا». فالفعل اليوناني قد يدل على العبادة أو على إظهار التوقير، بحسب السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: البيت
  rationale: ترجمة مباشرة وطبيعية للمسكن المعيّن في السياق، من غير إضافة تفاصيل غير مذكورة.
- source_word: παιδίον
  choice: الطفل
  rationale: تنقل الدلالة العامة للكلمة من غير تخصيص عمر أدق أو إضافة وصف غير لازم.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: مع مريم أمه
  rationale: صياغة عربية واضحة تحافظ على معنى المصاحبة وعلى تعريف مريم بأنها أمه.
- source_word: πεσόντες προσεκύνησαν αὐτῷ
  choice: فسجدوا له
  rationale: الفعل العربي «سجد» يجمع هيئة الانحناء إلى الأرض وفعل التوقير، وينقل العبارة اليونانية طبيعيًا من غير حسم ما إذا كان المقصود عبادة بالمعنى الأقوى أو إجلالًا ملكيًا؛ ويبيّن الهامش هذا الاتساع.
- source_word: θησαυροὺς αὐτῶν
  choice: كنوزهم
  rationale: يحافظ على التعبير اليوناني الواسع، بدل تخصيصه بصناديق أو أوعية لم يصرح بها النص.
- source_word: προσήνεγκαν αὐτῷ δῶρα
  choice: قدموا له هدايا
  rationale: صياغة عربية مألوفة لسياق إهداء الأشياء النفيسة، من غير تحميل «الهدايا» معنى الذبائح أو القرابين.
- source_word: λίβανον
  choice: لبانًا
  rationale: «اللبان» هو الراتنج العطري المحدد المقصود، وهو أدق من «البخور» الأعم.
- source_word: σμύρναν
  choice: مُرًّا
  rationale: المقابل العربي المألوف والدقيق للمادة العطرية المعروفة.
theological_decisions:
- issue: دلالة προσκυνέω في فعل المجوس تجاه الطفل يسوع
  choice: سجدوا له، مع هامش يوضح احتمال العبادة أو الإجلال
  alternative: عبدوه؛ أو انحنوا له إجلالًا
  rationale: للفعل اليوناني مجال دلالي يشمل السجود التعبدي والتوقير الشديد بحسب السياق. «سجدوا له» يحافظ على الفعل الجسدي وعلى التوتر اللاهوتي، ولا يفرض وحده أحد التفسيرين.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل تتابع الأفعال بالفاء ثم «ثم» لإظهار تسلسل الحدث طبيعيًا، مع تجنب الصياغة الحرفية الثقيلة للمشاركات اليونانية. وُضع مؤشر الهامش بعد العبارة التي يشرحها مباشرة.
