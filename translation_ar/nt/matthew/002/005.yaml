base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: ar
  text: 'فقالوا له: «في بيت لحم اليهودية، لأنه قد كُتب هكذا على لسان النبي:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: فقالوا
  rationale: الضمير المستتر يعود إلى رؤساء الكهنة وكتبة الشعب المذكورين في الآية السابقة، والفاء توفر ربطًا سرديًا عربيًا طبيعيًا من غير أن تضيف معنى تقابليًا قويًا.
- source_word: εἶπαν αὐτῷ
  choice: قالوا له
  rationale: ينقل فعل القول مع المفعول غير المباشر نقلًا مباشرًا وطبيعيًا.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: في بيت لحم اليهودية
  rationale: تفيد الإضافة اليونانية تحديد بيت لحم المقصودة بأنها الواقعة في اليهودية، وهذه الصياغة عربية واضحة ومألوفة.
- source_word: οὕτως γὰρ
  choice: لأنه هكذا
  rationale: تفيد γάρ تعليل الجواب، وتشير οὕτως إلى نص الاقتباس الآتي، فحُفظت الوظيفة التعليلية والإحالة الاستباقية.
- source_word: γέγραπται
  choice: قد كُتب
  rationale: تحافظ «قد» مع المبني للمجهول على دلالة التام اليوناني وعلى كون المكتوب قائمًا ونافذًا، مع بقاء العبارة طبيعية في العربية.
- source_word: διὰ τοῦ προφήτου
  choice: على لسان النبي
  rationale: تعبير عربي فصيح ينقل معنى الوساطة في διά مع المضاف إليه، بحيث يكون النبي واسطة إعلان النص لا بالضرورة مصدره النهائي.
theological_decisions:
- issue: صيغة الوساطة النبوية
  choice: على لسان النبي
  alternative: بواسطة النبي / من قِبل النبي
  rationale: «على لسان النبي» تعبير عربي طبيعي يحفظ كون الكلام منقولًا عبر النبي، من غير حسم زائد لمسألة الفاعل النهائي أو تسطيح معنى الوساطة.
- issue: قوة صيغة الاقتباس الكتابي
  choice: قد كُتب
  alternative: مكتوب
  rationale: الصيغة المختارة تعكس التام المبني للمجهول γέγραπται، بينما «مكتوب» بديل اصطلاحي عربي ممكن لكنه أقل إظهارًا للصيغة الفعلية اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت صياغة طبيعية غير متكلفة، مع الحفاظ على بنية الجواب وتعليله وصيغة الاقتباس النبوي.
