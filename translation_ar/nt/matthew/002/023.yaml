  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: ar
  text: 'وجاء وسكن في مدينة تُدعى الناصرة، لكي يتم ما قيل على لسان الأنبياء: «سيُدعى ناصريًّا»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نازوريًّا». والخلفية النبوية الدقيقة لعبارة «سيُدعى ناصريًّا» موضع نقاش؛ فقد يكون متى يلخّص موضوعات وردت عند الأنبياء بدلًا من أن يقتبس نصًّا واحدًا بعينه.'
    reason: بديل لفظي وبيان الغموض في الخلفية النبوية
lexical_decisions:
- source_word: ἐλθὼν
  choice: وجاء
  rationale: اسم فاعل ماضٍ يسبق الفعل الرئيس، ونقله بفعل معطوف عربي طبيعي يحفظ تتابع الحدثين.
- source_word: κατῴκησεν
  choice: وسكن
  rationale: يفيد اتخاذ موضع للسكن والإقامة، و«سكن» لفظ عربي واضح لا يبالغ في معنى الاستقرار الدائم.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: في مدينة تُدعى الناصرة
  rationale: مع فعل السكن تؤدي «في» المعنى العربي الطبيعي، و«مدينة» تقابل πόλις مباشرة، و«تُدعى» تحفظ صيغة الوصف المبني للمجهول.
- source_word: ὅπως πληρωθῇ
  choice: لكي يتم
  rationale: تحفظ «لكي» دلالة الغاية أو النتيجة في صيغة الإتمام عند متى، و«يتم» تعبير عربي مألوف عن تحقق القول النبوي.
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: ما قيل على لسان الأنبياء
  rationale: «ما قيل» تقابل التركيب الاسمي، و«على لسان» تنقل معنى الوساطة في διά مع المضاف إليه بصياغة عربية طبيعية، مع إبقاء جمع «الأنبياء».
- source_word: Ναζωραῖος
  choice: ناصريًّا
  rationale: تسمية منسوبة إلى الناصرة ومفهومة في العربية، من غير خلط بينها وبين «النذير» المرتبط بنذر خاص.
- source_word: κληθήσεται
  choice: سيُدعى
  rationale: يحفظ المستقبل والبناء للمجهول في صيغة القول النبوي.
theological_decisions:
- issue: طبيعة الاستشهاد النبوي مع عدم وجود نص واحد مطابق حرفيًا في العهد القديم
  choice: 'إبقاء الصيغة بصيغة الجمع: «ما قيل على لسان الأنبياء»، من غير تعيين نص نبوي بعينه'
  alternative: ربطه بإشعياء 11:1، أو اعتباره تلخيصًا لموضوعات نبوية عن اتضاع المسيح واحتقاره
  rationale: النص اليوناني يذكر «الأنبياء» بالجمع، مما يسمح بفهمه شاهدًا نبويًا مركبًا أو موضوعيًا، ولا يجيز حسم خلفيته في المتن.
- issue: دلالة Ναζωραῖος
  choice: ناصريًّا
  alternative: نَزُوريًّا، أو نذيرًا
  rationale: السياق يربط التسمية بمدينة الناصرة. أما «نذيرًا» فتخلط اللفظ بتسمية يونانية أخرى خاصة بنذر النذير؛ ويُذكر البديل الأكثر محافظة على صورة اللفظ في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «لكي يتم» لصيغة الإتمام، و«على لسان الأنبياء» لنقل الوساطة بأسلوب عربي طبيعي، مع تجنب الألفاظ الطائفية أو التفسير الحاسم للخلفية النبوية.
