source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: ar
  text: فجمع جميع رؤساء الكهنة وكتبة الشعب، وكان يستعلم منهم أين يُولَد المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني Χριστός لقب معناه «الممسوح»، ويُستعمل هنا عن المسيح المنتظر في السياق اليهودي.
    reason: توضيح دلالة اللقب وسياقه المسياني، لأن العربية لا تتيح التمييز الإنجليزي بين Messiah وChrist، من غير إضافة تفصيل غير مصرّح به في الآية.
lexical_decisions:
- source_word: συναγαγὼν
  choice: فجمع
  rationale: اسم فاعل أُورستي يدل على فعل سابق للفعل الرئيس، وصيغة «فجمع» تنقل التعاقب بإيجاز وطبيعية.
- source_word: πάντας
  choice: جميع
  rationale: تحفظ شمول اللفظ اليوناني دون زيادة تفسيرية.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تعبير عربي مألوف ودقيق للقيادات الكهنوتية العليا، لا لعدد من شاغلي منصب رئيس كهنة واحد.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: مقابل مباشر يحفظ الصفة التاريخية لهذه الفئة دون تفسيرها في المتن بمعلمي الشريعة.
- source_word: τοῦ λαοῦ
  choice: الشعب
  rationale: يحفظ الإضافة كما في المصدر من غير إدخال تحديد عرقي تفسيري.
- source_word: ἐπυνθάνετο
  choice: كان يستعلم
  rationale: تركيب «كان» مع المضارع ينقل الجانب الاستمراري للفعل الناقص، و«يستعلم» يلائم طلب المعلومة.
- source_word: παρ’ αὐτῶν
  choice: منهم
  rationale: ينقل معنى طلب المعلومة من المخاطَبين بعبارة عربية طبيعية.
- source_word: ποῦ
  choice: أين
  rationale: المقابل المباشر لأداة الاستفهام المكانية.
- source_word: ὁ χριστὸς
  choice: المسيح
  rationale: ينقل اللقب اليوناني في سياقه اليهودي بوصفه لقب الملك الممسوح المنتظر، لا اسمًا شخصيًا مجردًا.
- source_word: γεννᾶται
  choice: يُولَد
  rationale: يحفظ المضارع المبني للمجهول وصيغة السؤال غير المباشر، بينما يفهم التوجه المستقبلي طبيعيًا من سياق انتظار المسيح.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب، ويحفظ خلفيته المتعلقة بالملك الممسوح المنتظر؛ أما «الممسوح» فيوضح الاشتقاق لكنه أقل طبيعية في نص الكتاب المقدس.
- issue: القيمة الزمنية لـ γεννᾶται
  choice: أين يُولَد المسيح
  alternative: أين كان سيولد المسيح
  rationale: المصدر يستخدم المضارع في سؤال عن الموضع المتوقع للميلاد. إبقاء المضارع العربي يحفظ صيغة الأصل، ويترك السياق نفسه يدل على التوقع بدل فرض صيغة مستقبلية صريحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «رؤساء الكهنة» و«الكتبة» للمحافظة على المصطلحين التاريخيين، و«كان يستعلم» لإبراز استمرار الاستفسار دون مبالغة مثل «ظل يسأل».
