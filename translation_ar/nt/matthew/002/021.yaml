  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: ar
  text: فقام وأخذ الطفل وأمَّه ودخل أرض إسرائيل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تدل هنا على تتابع السرد لا على مقابلة قوية؛ والفاء تصل الفعل بما سبقه اتصالًا طبيعيًّا.
- source_word: ἐγερθεὶς
  choice: قام
  rationale: اسم الفاعل الماضي يُستعمل هنا بمعنى لازم، أي نهض؛ وصيغة «قام» عربية طبيعية موجزة وتحفظ تتابع الأحداث.
- source_word: παρέλαβε
  choice: أخذ
  rationale: المعنى في السياق هو أن يأخذ شخصًا معه؛ و«أخذ» تؤدي المعنى بوضوح في السرد، مع فهم المصاحبة من السياق.
- source_word: τὸ παιδίον
  choice: الطفل
  rationale: ترجمة مباشرة واضحة للاسم، من غير إضافة تحديد للعمر لا يقتضيه اليوناني.
- source_word: τὴν μητέρα αὐτοῦ
  choice: أمَّه
  rationale: الضمير يعود طبيعيًّا إلى الطفل؛ والصياغة موجزة وتحافظ على البناء اليوناني.
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: ينقل فعل الدخول إلى مكان بعبارة عربية طبيعية ومباشرة.
- source_word: εἰς γῆν Ἰσραήλ
  choice: أرض إسرائيل
  rationale: يحفظ الدلالة الجغرافية القومية للتركيب اليوناني من غير تفسير زائد.
