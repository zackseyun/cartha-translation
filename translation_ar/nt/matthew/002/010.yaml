lexical_decisions:
- source_word: ἰδόντες
  choice: فَلَمَّا رَأَوْا
  rationale: اسم فاعل ماضٍ يؤدي وظيفة زمنية سابقة للفعل الرئيس؛ وصيغة «فلما رأوا» عربية طبيعية تحفظ هذا التعاقب.
- source_word: δὲ
  choice: الفاء في «فلما»
  rationale: أداة ربط سردية خفيفة تواصل الحدث ولا تفيد تضادًا قويًا؛ وقد أدت الفاء هذا الربط طبيعيًا في العربية.
- source_word: τὸν ἀστέρα
  choice: النَّجْمَ
  rationale: ترجمة مباشرة للاسم مع أداة التعريف، لأنه النجم المحدد الذي سبق ذكره في السياق.
- source_word: ἐχάρησαν
  choice: فَرِحُوا
  rationale: الفعل ماضٍ وصيغته ذات معنى معلوم في الاستعمال؛ و«فرحوا» يحفظ قوته اللفظية بعبارة عربية واضحة.
- source_word: χαρὰν μεγάλην
  choice: فَرَحًا عَظِيمًا
  rationale: المفعول المطلق من جذر الفعل يقابل المفعول المطلق الاشتقاقي في اليونانية، ويحفظ شدة التعبير وفخامته بصورة طبيعية في العربية.
- source_word: σφόδρα
  choice: جِدًّا
  rationale: يفيد تقوية التعبير كله؛ و«جدًّا» واضحة وفصيحة وتحافظ على شدة التوكيد.
