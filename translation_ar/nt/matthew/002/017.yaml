lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمان يربط تحقق القول النبوي بالحدث السابق ويحافظ على تتابع السرد.
- source_word: ἐπληρώθη
  choice: تم
  rationale: يحفظ لغة التتميم المميزة عند متى بصياغة عربية طبيعية، من غير إضافة معنى سببي غير مصرح به.
- source_word: τὸ ῥηθὲν
  choice: ما قيل
  rationale: ينقل اسم الموصول المتضمن في اسم المفعول اليوناني بعبارة عربية موجزة وطبيعية.
- source_word: διὰ Ἰερεμίου
  choice: على لسان إرميا
  rationale: ينقل معنى الوساطة في διά مع المضاف إليه، ويبين أن القول وصل بواسطة النبي، بصياغة عربية مألوفة في سياق الأقوال النبوية.
- source_word: τοῦ προφήτου
  choice: النبي
  rationale: بدل يحدد صفة إرميا ووظيفته.
- source_word: λέγοντος
  choice: القائل
  rationale: يحافظ على تعلق اسم الفاعل بإرميا بحسب المطابقة في حالة الإضافة في اليونانية، ويمهد للاقتباس التالي من غير أن يوهم أن فعل التتميم هو الذي يتكلم.
theological_decisions:
- issue: صيغة التتميم عند متى
  choice: تم ما قيل
  alternative: حدث لكي يتم ما قيل
  rationale: النص يصرح بأن القول النبوي تم، لكنه لا يتضمن هنا عبارة غائية؛ لذلك حُفظ ادعاء التتميم من غير توسيعه.
- issue: مرجع اسم الفاعل λέγοντος
  choice: القائل، عائدًا إلى إرميا النبي
  alternative: إذ يقول، بما قد يُفهم أنه عائد إلى القول نفسه
  rationale: المطابقة النحوية في اليونانية تربط اسم الفاعل بإرميا، مع بقاء وظيفته الأساسية تقديم نص الاقتباس.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «على لسان» بدل الترجمة الحرفية «بواسطة» لأنها طبيعية في سياق نقل قول نبوي، مع الحفاظ على دلالة الوساطة.
