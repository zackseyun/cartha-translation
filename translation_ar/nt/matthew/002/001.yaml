source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: ar
  text: وبعدما وُلد يسوع في بيت لحم اليهودية، في أيام هيرودس الملك، إذا مجوس[a] من المشرق قد وصلوا إلى أورشليم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي رجال متعلمون من أهل المشرق، ارتبطوا على الأرجح بالتنجيم أو بحكمة البلاط.
    reason: إيضاح الدلالة التاريخية للمصطلح اليوناني μάγοι من غير إدخال تقاليد لاحقة بشأن عددهم أو كونهم ملوكًا.
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: وبعدما وُلد يسوع
  rationale: تركيب المضاف المطلق يقدّم ظرفًا زمنيًا سابقًا للفعل الرئيس، فتنقل «بعدما» هذه العلاقة بوضوح، بينما تؤدي الواو وظيفة δέ الانتقالية الخفيفة من غير إضافة معنى «الآن».
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: بيت لحم اليهودية
  rationale: صياغة عربية مألوفة تميّز بيت لحم الواقعة في اليهودية من أي موضع آخر يحمل الاسم نفسه.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: في أيام هيرودس الملك
  rationale: تحافظ على الأسلوب التاريخي والسردي في اليونانية وعلى ترتيب اللقب بوصفه بدلًا أو عطف بيان.
- source_word: ἰδοὺ
  choice: إذا
  rationale: «إذا» الفجائية تلفت النظر إلى ظهور القادمين في المشهد، وتنقل قوة أداة التنبيه بسلاسة في السرد العربي المعاصر.
- source_word: μάγοι
  choice: مجوس
  rationale: «مجوس» هو المقابل العربي الأدق للمصطلح، ويدل هنا على رجال متعلمين من الشرق ارتبطت معارفهم بالتنجيم أو بحكمة البلاط، من غير وصفهم ملوكًا أو تحديد عددهم.
- source_word: ἀπὸ ἀνατολῶν
  choice: من المشرق
  rationale: تنقل العبارة الاتجاه أو الأقاليم الشرقية بصياغة عربية طبيعية، مع بقاء الموطن الدقيق غير محدد.
- source_word: παρεγένοντο
  choice: قد وصلوا
  rationale: الفعل يدل على القدوم وبلوغ المكان؛ و«وصلوا إلى» تركيب عربي طبيعي، وتفيد «قد» تحقق الوصول ضمن المشهد السردي.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: تحافظ «إلى» على اتجاه الحركة الذي تدل عليه εἰς، وتلائم فعل الوصول في العربية.
theological_decisions:
- issue: نقل μάγοι من غير استيراد التقليد اللاحق
  choice: مجوس
  alternative: حكماء
  rationale: «مجوس» أدق من جهة المصطلح التاريخي، ولا تضيف أنهم كانوا ملوكًا أو أنهم ثلاثة. وتوضح الحاشية مدلول الكلمة في هذا السياق لئلا تُفهم وفق دلالات عربية لاحقة أضيق.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة سردية موقرة. استُعملت «إذا» بوصفها أداة مفاجأة وتنبيه طبيعية، وحُفظ التعبير الكتابي «في أيام هيرودس الملك». وُضع رمز الحاشية مباشرة بعد اللفظ الذي تشرحه.
