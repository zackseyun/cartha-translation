  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: ar
  text: 'وبقي هناك إلى موت هيرودس، لكي يتم ما قاله الرب على لسان النبي: «من مصر دعوت ابني».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الاقتباس من هوشع 11:1، حيث يشير «ابني» في سياقه الأصلي إلى إسرائيل؛ ويعرض متى خروج يسوع من مصر بوصفه إتمامًا لهذا القول.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: بقي هناك
  rationale: يفيد السياق استمرار وجوده هناك إلى زمن محدد؛ و«بقي هناك» تعبير عربي طبيعي لا يضيف معنى يتجاوز دلالة العبارة في سياقها.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: إلى موت هيرودس
  rationale: التعبير اليوناني الاسمي يدل على نهاية حياة هيرودس، و«إلى موت هيرودس» دقيق وموجز.
- source_word: ἵνα πληρωθῇ
  choice: لكي يتم
  rationale: يحفظ دلالة الغاية أو النتيجة في صيغة الإتمام المتكررة عند متى، من غير فرض نظرية بعينها لكيفية تحقق النبوة.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: ما قاله الرب على لسان النبي
  rationale: يميّز بين الرب بوصفه مصدر القول والنبي بوصفه واسطته، بصياغة عربية مألوفة ودقيقة.
- source_word: λέγοντος
  choice: —
  rationale: أُدمجت دلالته في النقطتين اللتين تقدمان الاقتباس؛ فإضافة «قائلًا» بعد «ما قاله» ثقيلة في العربية ولا تزيد معنى.
- source_word: Ἐξ Αἰγύπτου
  choice: من مصر
  rationale: «من» هي المقابل العربي الطبيعي لـἐξ هنا، وتفيد الخروج من مصر في هذا السياق.
- source_word: ἐκάλεσα
  choice: دعوت
  rationale: تحفظ المعنى العام للفعل καλέω وصدى اقتباس هوشع، من غير تضييقه إلى معنى الاستدعاء الرسمي.
- source_word: τὸν υἱόν μου
  choice: ابني
  rationale: ينقل دلالة υἱός المحددة ويحفظ الصلة اللاهوتية والنصية بين إسرائيل في هوشع وتطبيق متى للقول على يسوع.
theological_decisions:
- issue: صيغة الإتمام واقتباس هوشع 11:1
  choice: الإبقاء على عبارة «لكي يتم» دون تفسير آلية الإتمام داخل المتن
  alternative: صياغة النص على أنه تنبؤ مباشر فقط، أو التصريح بأنه تحقيق نمطي يعيد فيه المسيح مسيرة إسرائيل
  rationale: يؤكد متى الإتمام، لكن عبارته لا تفرض في الترجمة نظرية تفسيرية واحدة؛ لذا تُحفظ دلالة النص والتوتر بين سياق هوشع الأصلي وتطبيق متى.
- issue: κύριος في صيغة الاقتباس
  choice: الرب
  alternative: الرب الإله
  rationale: النص اليوناني يذكر κύριος وحدها؛ وإضافة «الإله» تتجاوز اللفظ، أما «الرب» فتحفظ الإحالة الإلهية بوضوح.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «على لسان النبي» لنقل الوساطة في διὰ τοῦ προφήτου بصورة طبيعية، ووُضع الهامش بعد الاقتباس مع ظهور علامته [a] في المتن.
