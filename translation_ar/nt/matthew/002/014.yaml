id: MAT.2.14
reference: Matthew 2:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: ar
  text: فقام وأخذ الطفل وأمه ليلًا، وانصرف إلى مصر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تواصل السرد وتُظهر أن قيام يوسف جاء استجابةً للأمر السابق، من غير إثقال العبارة بحرف استدراك.
- source_word: ἐγερθεὶς
  choice: قام
  rationale: اسم الفاعل الأُورِسطي يدل على الفعل السابق للفعل الرئيس في تسلسل الحدث؛ وصيغة «قام» عربية طبيعية واضحة.
- source_word: παρέλαβε
  choice: أخذ
  rationale: الفعل هنا يعني أن يصطحب أشخاصًا معه؛ و«أخذ» تؤدي المعنى بإيجاز ووضوح في هذا السياق.
- source_word: τὸ παιδίον
  choice: الطفل
  rationale: ينقل الدلالة المباشرة للكلمة من غير إضافة وصف عمري أو توكيد غير مصرّح به.
- source_word: τὴν μητέρα αὐτοῦ
  choice: أمه
  rationale: الضمير في اليونانية يعود طبيعيًا إلى الطفل، والتعبير العربي موجز وواضح.
- source_word: νυκτὸς
  choice: ليلًا
  rationale: صيغة المضاف إليه الزمنية تفيد وقوع الأفعال في الليل؛ و«ليلًا» تعبير فصيح معاصر وموجز.
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: ينقل معنى المغادرة والابتعاد إلى موضع آخر، مع الحفاظ على نبرة السرد من غير زيادة تفسير للدافع.
- source_word: εἰς Αἴγυπτον
  choice: إلى مصر
  rationale: حرف الجر εἰς يدل هنا على الحركة نحو وجهة، والمقابل العربي الطبيعي هو «إلى».
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة، تحافظ على سرعة تسلسل الأفعال في النص اليوناني. لم تُدرج حاشية لأن البديل الإنجليزي «to Egypt» هو نفسه المعنى المنقول مباشرةً في العربية بـ«إلى مصر»، كما أن موضع علامة الحاشية في طبقة الاستشارة الإنجليزية لا ينسجم مع نصها.
