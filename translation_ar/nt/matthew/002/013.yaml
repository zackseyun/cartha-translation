  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: ar
  text: 'وبعد أن انصرفوا، إذا ملاك الرب يظهر ليوسف في حلم قائلًا: «قم، وخذ الطفل وأمه، واهرب إلى مصر، وابقَ هناك حتى أقول لك؛ لأن هيرودس على وشك أن يبحث عن الطفل لكي يهلكه».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: وبعد أن انصرفوا
  rationale: تركيب إضافي مطلق يدل على فعل سبق الحدث الرئيس. «بعد أن انصرفوا» عربي طبيعي ويحفظ تتابع الأحداث، والضمير يعود في السياق إلى الزائرين المذكورين قبلًا.
- source_word: ἰδοὺ
  choice: إذا
  rationale: «إذا» الفجائية تنقل حيوية أداة التنبيه السردية وتدل على ظهور مفاجئ، من غير تعبير عربي متكلف.
- source_word: ἄγγελος κυρίου
  choice: ملاكٌ من عند الرب
  rationale: التنكير في «ملاكٌ» يعكس غياب أداة التعريف اليونانية، و«من عند الرب» يوضح صلته بالرب في عربية سليمة من غير حسم أنه ملاك معيّن معروف.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: يظهر ليوسف في حلم
  rationale: حُفظ المضارع السردي في اليونانية بالمضارع العربي لإبراز المشهد، و«في حلم» هو المعنى الاصطلاحي لعبارة κατ’ ὄναρ.
- source_word: λέγων
  choice: قائلًا
  rationale: اسم الحال يقدّم الكلام المباشر ويحافظ بسلاسة على بنية اسم الفاعل اليونانية.
- source_word: Ἐγερθεὶς
  choice: قم
  rationale: هو في الصورة اسم فاعل، لكنه يؤدي ضمن تسلسل الأوامر معنى الأمر؛ لذلك كان «قم» أوضح وأطبع في العربية.
- source_word: παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: وخذ الطفل وأمه
  rationale: παράλαβε هنا تعني أن يأخذهما معه، وهو مفهوم طبيعيًا من «خذ» في السياق. والضمير في «أمه» يعود بوضوح إلى الطفل.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: واهرب إلى مصر
  rationale: «اهرب» يحفظ معنى الفرار وما فيه من خطر وإلحاح.
- source_word: ἴσθι ἐκεῖ
  choice: وابقَ هناك
  rationale: المعنى الحرفي «كن هناك»، لكن المقصود استمرار الإقامة، و«ابقَ هناك» هو التعبير العربي الطبيعي.
- source_word: ἕως ἂν εἴπω σοι
  choice: حتى أقول لك
  rationale: يحفظ حدًّا زمنيًا مستقبليًا غير محدد، ولا يضيف إلى الكلام مضمونًا غير مذكور في الأصل.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: لأن هيرودس على وشك أن يبحث
  rationale: μέλλει تدل هنا على قرب الفعل المنتظر، وζητεῖν تعني أن يبحث أو يسعى، من غير افتراض أنه سيجد الطفل.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: لكي يهلكه
  rationale: ينقل «يهلكه» الدلالة الأساسية لـἀπόλλυμι ويحفظ غاية بحث هيرودس؛ وفي هذا السياق المقصود التسبب في موت الطفل.
theological_decisions:
- issue: دلالة κύριος في ἄγγελος κυρίου
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل الكتابي والسياقي الطبيعي للقب κύριος هنا، ولا يفرض تحديدًا أبعد مما يقوله النص.
- issue: هل ἄγγελος κυρίου ملاك غير معيّن أم «ملاك الرب» بوصفه تعبيرًا معروفًا؟
  choice: ملاكٌ من عند الرب
  alternative: ملاك الرب
  rationale: غياب أداة التعريف يرجّح التنكير في هذا الموضع، مع إبقاء القراءة المألوفة «ملاك الرب» في الحاشية لأن تركيب الإضافة العربي قد يُفهم بوصفه تعبيرًا كتابيًا معروفًا.
- issue: قوة τοῦ ἀπολέσαι αὐτό
  choice: لكي يهلكه
  alternative: لكي يقتله
  rationale: اختير اللفظ الأوسع الموافق للأصل، مع بيان دلالته السياقية الصريحة على القتل، من غير تلطيف قصد هيرودس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية موقرة. استُخدمت «إذا» الفجائية واحتُفظ بالمضارع السردي «يظهر» لنقل حيوية المشهد، مع تجنب الألفاظ القديمة مثل «انهض» و«امكث» حين يتوافر بديل حديث رصين.
