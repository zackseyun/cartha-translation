base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: ar
  text: 'قائلًا: «قُم، وخذ الطفل وأمه، واذهب إلى أرض إسرائيل، لأن الذين كانوا يسعون إلى قتل الطفل قد ماتوا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى ترتيب اليونانية: «فقد مات الذين كانوا يسعون إلى قتل الطفل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ اسم الفاعل المنصوب على صلة الكلام بما قبله، من غير تحويله إلى فعل مستقل.
- source_word: Ἐγερθεὶς
  choice: قُم
  rationale: اسم الفاعل اليوناني يسبق الأمر استعمالًا، والأمر العربي «قُم» ينقل قوته بوضوح وطبيعية.
- source_word: παράλαβε
  choice: خُذ
  rationale: المقصود أن يأخذ الطفل وأمه معه؛ و«خُذ» موجزة وطبيعية في هذا السياق.
- source_word: τὸ παιδίον
  choice: الطفل
  rationale: تنقل المعنى المعتاد للكلمة من غير إضافة تحديد عمري غير مصرّح به.
- source_word: τὴν μητέρα αὐτοῦ
  choice: أمه
  rationale: تعبير عربي طبيعي ودقيق يحفظ عود الضمير إلى الطفل.
- source_word: πορεύου
  choice: اذهب
  rationale: ينقل الأمر بالحركة والسفر إلى الوجهة المقصودة بعبارة عربية مباشرة.
- source_word: εἰς γῆν Ἰσραήλ
  choice: إلى أرض إسرائيل
  rationale: يحفظ الدلالة الجغرافية الصريحة لكلمة γῆ ولا يختزلها في اسم «إسرائيل» وحده.
- source_word: τεθνήκασιν
  choice: قد ماتوا
  rationale: الفعل التام اليوناني يدل على موت وقع وبقيت نتيجته قائمة؛ و«قد ماتوا» يؤدي ذلك طبيعيًا.
- source_word: οἱ ζητοῦντες
  choice: الذين كانوا يطلبون
  rationale: ينقل السعي السابق إلى قتل الطفل بوضوح، مع تجنب الإيحاء بأنهم ما زالوا يطلبونه بعد موتهم.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: حياة الطفل
  rationale: ψυχή في تركيب طلب حياة شخص تعني حياته المعرّضة للقتل، لا «النفس» بمعناها غير المادي.
theological_decisions:
- issue: معنى ψυχή في سياق التهديد بالقتل
  choice: حياة الطفل
  alternative: نفس الطفل
  rationale: السياق السردي والتركيب الاصطلاحي يدلان على محاولة قتله؛ أما «نفس الطفل» فقد توحي بدلالة لاهوتية لا يقتضيها النص.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. حُفظ الربط باسم الفاعل «قائلًا»، واستُخدمت أوامر مباشرة طبيعية، مع إبقاء «أرض إسرائيل» و«حياة الطفل» بما يوافق الدلالة الأصلية.
