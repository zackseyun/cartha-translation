    rationale: العبارة العربية قد تعني أنهم يطلبون الحياة للطفل أو يسألون عنها، بينما الاصطلاح اليوناني ζητεῖν τὴν ψυχήν يعني السعي إلى إزهاق حياته.
  - severity: medium
    issue: الحاشية «فقد مات طالبو حياة الطفل» غير طبيعية ولا تؤدي المعنى الاصطلاحي بوضوح.
    rationale: إضافة إلى ثقل تركيب «طالبو حياة»، لا تشرح الحاشية الفرق المقصود في ترتيب العبارة وصيغتها دون إعادة إنتاج الالتباس نفسه.
