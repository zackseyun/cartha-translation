- from: 'قائلًا: «قُم، وخذ الطفل وأمه، واذهب إلى أرض إسرائيل، لأن الذين كانوا يطلبون حياة الطفل قد ماتوا».[a]'
  to: 'قائلًا: «قُم، وخذ الطفل وأمه، واذهب إلى أرض إسرائيل، لأن الذين كانوا يسعون إلى قتل الطفل قد ماتوا».[a]'
  rationale: استُبدل تركيب «يطلبون حياة الطفل» بعبارة عربية طبيعية تبيّن المعنى الاصطلاحي للسعي إلى قتل الطفل، من غير إدخال تفسير لاهوتي. وحُفظت الإشارة إلى وقوع الموت وانتهاء أثره بـ«قد ماتوا»، وأعيدت صياغة الحاشية لتبقى بديلًا أسلوبيًا متعلقًا بترتيب العبارة من دون غموض.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:20Z'
review_pass:
  verdict: revise
  source_fidelity: النص ينقل الأوامر والعناصر الرئيسة بأمانة، بما في ذلك «أرض إسرائيل» ودلالة ψυχή على الحياة المهدَّدة. غير أن «يطلبون حياة الطفل» غير طبيعي في العربية وقد يُفهَم على أنه يطلب له الحياة لا أنه يسعى إلى قتله. وصيغة «كانوا يطلبون» مقبولة عربيًا في ضوء موتهم، لكن التعبير عن المقصود القاتل يحتاج إلى ضبط أوضح.
  naturalness: الأسلوب الفصيح واضح في مجمله. أما «طالبو حياة الطفل» في الحاشية فتركيب غير مألوف وملتبس، وكذلك «يطلبون حياة الطفل» في المتن لا يؤدي الاصطلاح المقصود طبيعيًا.
  terminology: «الطفل»، «أمه»، و«أرض إسرائيل» اختيارات سليمة. ينبغي إبقاء المقصود من ψυχή هو الحياة، مع صياغته عربيًا بعبارة «الساعين إلى قتل الطفل» بدل تركيب «طلب حياة الطفل» الملتبس.
  issues:
