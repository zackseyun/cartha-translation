  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: ar
  text: وبعد أن حُذِّروا[a] في حلم ألّا يرجعوا إلى هيرودس، انصرفوا إلى بلادهم من طريق أخرى[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تلقّوا تحذيرًا إلهيًا». صيغة المبني للمجهول في اليونانية توحي بمصدر إلهي للتحذير، من غير أن تذكر الله صراحة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بطريقٍ آخر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: أُوحِيَ إليهم
  rationale: الفعل المبني للمجهول يدل هنا، في سياق متّى، على تلقّي إبلاغ أو إنذار إلهي. «أُوحِيَ إليهم» تعبير عربي طبيعي يحفظ المصدر الإلهي الضمني من غير إضافة «من الله»، التي لا يذكرها النص صراحة.
- source_word: κατ’ ὄναρ
  choice: في حلم
  rationale: تعبير واضح ومألوف لنقل العبارة اليونانية الدالة على تلقي الإبلاغ أثناء الحلم.
- source_word: μὴ ἀνακάμψαι
  choice: ألّا يرجعوا
  rationale: ينقل مضمون الإبلاغ المنفي، ويلائم سياق العودة في السفر.
- source_word: πρὸς Ἡρῴδην
  choice: إلى هيرودس
  rationale: حرف الجر مع حالة النصب يدل على التوجه نحو شخص، و«إلى» هو المقابل العربي الطبيعي.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: من طريق أخرى
  rationale: ὁδός هنا طريق سفر ملموسة؛ والصياغة العربية موجزة وطبيعية وتحفظ إمكان معنى الطريق أو المسار.
- source_word: ἀνεχώρησαν
  choice: انصرفوا
  rationale: ينقل معنى المغادرة أو الابتعاد في هذا السياق السردي، مع دلالة مناسبة على تجنب الرجوع إلى هيرودس.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: إلى بلادهم
  rationale: χώρα قد تعني البلاد أو الأرض أو الإقليم. «بلادهم» واضحة في سياق عودة المجوس إلى موطنهم ولا تفرض تحديدًا سياسيًا حديثًا.
theological_decisions:
- issue: المصدر الإلهي الضمني للإبلاغ
  choice: أُوحِيَ إليهم، من غير تسمية الله صراحة
  alternative: حُذِّروا في حلم / أنذرهم الله في حلم
  rationale: صيغة المبني للمجهول والسياق يوحيان بفاعل إلهي، لكن الآية لا تسمّي الله. يحفظ النص المختار هذه الدلالة الضمنية من غير إدخال فاعل صريح.
translation_notes:
  register: فصحى حديثة واضحة ووقورة. استُخدم «أُوحِيَ إليهم» للدلالة على التبليغ الإلهي في الحلم، و«بلادهم» بوصفها صياغة طبيعية لا توحي بالضرورة بدولة ذات حدود حديثة.
