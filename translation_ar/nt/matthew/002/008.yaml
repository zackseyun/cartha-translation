base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: ar
  text: 'وبعد أن أرسلهم إلى بيت لحم، قال: «اذهبوا وابحثوا بدقة عن الطفل، ومتى وجدتموه فأخبروني، لكي آتي أنا أيضًا وأسجد له[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وقد تُترجم أيضًا: «أعبده» أو «أنحني له إجلالًا». فالفعل اليوناني قد يدل على العبادة، أو على السجود إكرامًا لشخص ذي مقامٍ ملكي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: ثم أرسلهم
  rationale: اسم الفاعل الأوريستي يعبّر عن فعل سابق للقول؛ وتؤدي «ثم أرسلهم... وقال» تسلسل الحدث بالعربية الطبيعية من غير تركيب ثقيل.
- source_word: Πορευθέντες
  choice: اذهبوا
  rationale: يؤدي اسم الفاعل هنا وظيفة مرتبطة بالأمر التالي، وصيغة الأمر العربية واضحة وطبيعية.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: ابحثوا بدقة
  rationale: يحفظ التعبير معنى التحري الدقيق والجاد مع ملاءمته لسياق العثور على الطفل.
- source_word: περὶ τοῦ παιδίου
  choice: عن الطفل
  rationale: حرف الجر περί مع فعل البحث أو التحري يُنقل طبيعيًا إلى «عن» في العربية.
- source_word: παιδίου
  choice: الطفل
  rationale: «الطفل» مقابل واضح وغير مفرط في التحديد؛ فاللفظة لا تقتضي بذاتها إضافة «الصغير».
- source_word: ἐπὰν δὲ εὕρητε
  choice: ومتى وجدتموه
  rationale: «متى» تحفظ معنى الاحتمال المتوقع في هذا التوجيه، من غير تحويل العبارة إلى يقين مطلق أو شرط مستبعد.
- source_word: ἀπαγγείλατέ μοι
  choice: فأخبروني
  rationale: ينقل الفعل معنى إبلاغ هيرودس بالنتيجة بصورة عربية مألوفة؛ والمراد يتضمن الرجوع إليه بالخبر.
- source_word: ὅπως
  choice: لكي
  rationale: تعبّر «لكي» بوضوح عن الغاية التي يزعمها هيرودس.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: تحفظ العبارة تشديد هيرودس على ادعائه المشاركة في قصد المجوس.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: آتي ... وأسجد له
  rationale: التنسيق بين الفعلين طبيعي في العربية، و«أسجد له» يحفظ فعل الانحناء أو السجود المقصود من προσκυνέω دون أن يحسم وحده هل المراد عبادة أم إكرام ملكي.
theological_decisions:
- issue: دلالة προσκυνήσω αὐτῷ تجاه الطفل يسوع
  choice: أسجد له
  alternative: أعبده؛ أو أؤدي له الإجلال
  rationale: يمكن أن يدل προσκυνέω على العبادة أو على السجود إجلالًا لشخص ملكي. «أسجد له» يحفظ الصورة الأساسية والمدى الدلالي والتوتر اللاهوتي في السياق، بينما توضح الحاشية الاحتمالين من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ثم» لصوغ تسلسل اسم الفاعل مع الفعل الرئيس بصورة طبيعية، وحُفظ الغموض الحقيقي في προσκυνέω بالنص والحاشية.
