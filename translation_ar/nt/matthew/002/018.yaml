  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: ar
  text: '«صَوْتٌ سُمِعَ فِي الرَّامَةِ: بُكَاءٌ وَنَحِيبٌ شَدِيدٌ؛ رَاحِيلُ تَبْكِي أَطْفَالَهَا، وَلَمْ تُرِدْ أَنْ تَتَعَزَّى[a]، لِأَنَّهُمْ لَيْسُوا بَعْدُ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وَرَفَضَتْ أَنْ تَتَعَزَّى».'
    reason: بديل تعبيري أقوى قليلًا لمعنى عدم إرادتها قبول العزاء.
  - marker: b
    text: 'حرفيًّا: «لِأَنَّهُمْ لَيْسُوا».'
    reason: إثبات الصيغة اليونانية المقتضبة وراء التعبير العربي الاصطلاحي.
lexical_decisions:
- source_word: Φωνὴ
  choice: صَوْتٌ
  rationale: تنقل المعنى الأساسي للكلمة وتحافظ على النبرة النبوية التشخيصية في الاقتباس.
- source_word: ἐν Ῥαμὰ
  choice: فِي الرَّامَةِ
  rationale: «في» هي المقابل الطبيعي لحرف الجر مع اسم المكان، و«الرامة» الصيغة العربية المألوفة للاسم الجغرافي.
- source_word: ἠκούσθη
  choice: سُمِعَ
  rationale: صيغة مبني للمجهول تطابق الماضي المبني للمجهول في اليونانية وتحافظ على أسلوب الإخبار غير الشخصي.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: بُكَاءٌ وَنَحِيبٌ شَدِيدٌ
  rationale: «بكاء» ينقل κλαυθμός، و«نحيب» ينقل الحداد المسموع في ὀδυρμός، أما «شديد» فتنقل قوة πολύς بعبارة عربية طبيعية.
- source_word: Ῥαχὴλ κλαίουσα
  choice: رَاحِيلُ تَبْكِي
  rationale: يحافظ على راحيل بوصفها الشخصية الأمومية في الاقتباس، ويعبّر الفعل المضارع عن الفعل المستمر الذي تؤديه صيغة اسم الفاعل اليونانية.
- source_word: τὰ τέκνα αὐτῆς
  choice: أَوْلَادِهَا
  rationale: «أولادها» تشمل الذكور والإناث ولا تحصر اللفظ في الأبناء الذكور.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: لَمْ تُرِدْ أَنْ تَتَعَزَّى
  rationale: تحافظ على معنى عدم الإرادة في θέλω وعلى تلقي العزاء في المبني للمجهول، من غير تشديده إلى الرفض الصريح في المتن.
- source_word: ὅτι οὐκ εἰσίν
  choice: لِأَنَّهُمْ لَمْ يَعُودُوا مَوْجُودِينَ
  rationale: تنقل العبارة الاصطلاحية الدالة على الفقد بوضوح عربي، من غير إضافة تصريح بأنهم ماتوا، مع إثبات الصيغة الحرفية في الحاشية.
theological_decisions:
- issue: طبيعة راحيل في الاقتباس النبوي
  choice: إبقاء راحيل كما يعرضها النص، أمًّا تبكي أولادها، من غير شرح رمزيتها في المتن.
  alternative: تفسير راحيل صراحةً بوصفها رمزًا لأمهات إسرائيل، أو اعتبار الكلام وصفًا حرفيًا لراحيل التاريخية وحدها.
  rationale: النص اليوناني يورد صورة راحيل من إرميا من غير أن يشرح مستواها الرمزي؛ لذلك تحافظ الترجمة على التوتر بين الشخصية التاريخية والدلالة الجماعية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع إيقاع يلائم الاقتباس النبوي. استُخدمت «الرامة» بصيغتها العربية الكتابية المألوفة، وحُفظ تكرار معنى البكاء في «بكاء» و«تبكي». جميع علامات الحواشي مثبتة في المتن.
