- from: '«صَوْتٌ سُمِعَ فِي الرَّامَةِ: بُكَاءٌ وَنَحِيبٌ شَدِيدٌ؛ رَاحِيلُ تَبْكِي عَلَى أَوْلَادِهَا، وَلَمْ تُرِدْ أَنْ تَتَعَزَّى[a]، لِأَنَّهُمْ لَمْ يَعُودُوا مَوْجُودِينَ[b]»。'
  to: '«صَوْتٌ سُمِعَ فِي الرَّامَةِ: بُكَاءٌ وَنَحِيبٌ شَدِيدٌ؛ رَاحِيلُ تَبْكِي أَطْفَالَهَا، وَلَمْ تُرِدْ أَنْ تَتَعَزَّى[a]، لِأَنَّهُمْ لَيْسُوا بَعْدُ[b]».'
  rationale: تُبقي المراجعة جميع عناصر النص اليوناني وترتيبه التصويري، لكنها تستبدل العبارة التفسيرية المطوّلة بتعبير عربي موجز يحفظ غموض الفقد المقصود، وتستعمل «أطفالها» مقابلاً أشمل لـ τέκνα، وتصحح علامة الترقيم الختامية.
  reviewer_model: gpt-5.6-terra
