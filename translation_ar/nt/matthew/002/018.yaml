review_pass:
  verdict: revise
  source_fidelity: 'المتن ينقل البنية والمعنى الرئيسيين بدقة: «صوت» و«سُمع» والموضع وراحيل وبكاؤها وعدم قبولها التعزية. لكن «لأنهم لم يعودوا موجودين» أوسع وأثقل من العبارة اليونانية المقتضبة «لأنهم ليسوا»، ويمكن أن يوحي بالانعدام الوجودي بدل الفقد المقصود في السياق. كما أن «على أولادها» أقل مباشرة من تعدية فعل البكاء إلى المفعول به في هذا الاقتباس.'
  naturalness: الأسلوب فصيح ومهيب في الجملة. غير أن «لأنهم لم يعودوا موجودين» مطوّل إداري النبرة نسبيًا، و«أولادها» قد تُفهم في الاستعمال المعاصر على أنها تميل إلى الذكور؛ «أطفالها» أوضح للشمول هنا. ويجب استبدال علامة الوقف الصينية الختامية بعلامة عربية سليمة.
  terminology: «الرامة» و«راحيل» صائبتان في الاستعمال الكتابي العربي، و«بكاء ونحيب شديد» و«تتعزّى» مناسبان. اقتراح «لأنهم ليسوا بعد» يحفظ الإيجاز والالتباس المقصودين، من غير التصريح بالموت.
  issues:
  - severity: medium
    issue: العبارة «لَمْ يَعُودُوا مَوْجُودِينَ» تفسيرية وثقيلة قياسًا إلى «οὐκ εἰσίν».
    rationale: الأصل يقول حرفيًا «لأنهم ليسوا»، وهي صيغة مقتضبة تشير إلى الفقد من غير تحديد آليته. «ليسوا بعد» أقرب في الإيجاز ويحافظ على عدم التصريح بالموت.
  - severity: low
    issue: «أولادها» قد لا يكون أوضح مقابل عربي شامل لـ τέκνα.
    rationale: τέκνα تعني الأطفال/الأبناء على وجه العموم، لا الذكور خاصة. «أطفالها» يزيل احتمال القراءة الجندرية في العربية المعاصرة.
  - severity: low
    issue: علامة الوقف الختامية «。» ليست من علامات الترقيم العربية.
    rationale: ينبغي استخدام النقطة العربية أو عدم إضافة علامة خارج الاقتباس؛ هذا تصحيح شكلي لازم للنص العربي.
