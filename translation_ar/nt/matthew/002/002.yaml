base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: ar
  text: 'قائلين: «أين الذي وُلد ملكًا لليهود؟ فإننا رأينا نجمه في المشرق[a]، وجئنا لننحني أمامه[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند طلوعه». يمكن أن تعني العبارة اليونانية «في المشرق» أو أن تشير إلى طلوع النجم.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «لنسجد له» أو «لنعبده». قد يدل الفعل اليوناني على تكريم ملك بالانحناء له، أو على العبادة، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي يقدّم مضمون كلام المجوس، وهذه الصياغة تنقل البنية اليونانية بوضوح وطبيعية.
- source_word: Ποῦ ἐστιν
  choice: أين
  rationale: استفهام مباشر عن المكان، ويُفهم فعل الكينونة المحذوف طبيعيًا في الجملة الاسمية العربية.
- source_word: ὁ τεχθεὶς
  choice: الذي وُلد
  rationale: ينقل اسم الفاعل المبني للمجهول المستعمل استعمال الاسم، من غير إضافة معنى «حديث الولادة» غير المصرّح به.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: ملكًا لليهود
  rationale: يحفظ اللقب الملكي وعلاقته باليهود، وتأتي «ملكًا» حالًا أو خبرًا دالًا على الصفة التي وُلد بها.
- source_word: εἴδομεν γὰρ
  choice: فإننا رأينا
  rationale: الفاء مع «إن» تبيّن أن الجملة تعليل للسؤال، والماضي البسيط يلائم صيغة الفعل اليوناني وسياق الرواية.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: نجمه
  rationale: ينقل ضمير الملكية بإيجاز، من غير تحديد طبيعة العلامة الفلكية.
- source_word: ἐν τῇ ἀνατολῇ
  choice: في المشرق
  rationale: ترجمة طبيعية للمعنى الجغرافي المحتمل، مع إبقاء المعنى الفلكي البديل «عند طلوعه» في الحاشية بسبب غموض العبارة اليونانية.
- source_word: ἤλθομεν
  choice: جئنا
  rationale: الماضي العربي طبيعي في كلام الوافدين عن وصولهم الذي أدّى إلى حضورهم الراهن.
- source_word: προσκυνῆσαι αὐτῷ
  choice: لننحني له إجلالًا
  rationale: تنقل فعل التوقير والخضوع أمام الملك من غير أن تحسم وحدها هل المقصود تكريم ملكي أم عبادة، وتحفظ البديل في الحاشية.
theological_decisions:
- issue: دلالة προσκυνῆσαι في توجيه الفعل إلى الطفل يسوع
  choice: لننحني له إجلالًا
  alternative: لنسجد له، أو لنعبده
  rationale: يمكن أن يدل الفعل اليوناني على الانحناء تكريمًا لملك أو على العبادة بحسب السياق. ولأن المتكلمين يطلبون «ملك اليهود»، تحافظ الصياغة المختارة على إطار التكريم الملكي وعلى التوتر اللاهوتي، من غير نفي إمكان معنى العبادة في سياق إنجيل متى الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت صياغة مباشرة تحفظ ترتيب السؤال والتعليل، مع تجنب الألفاظ الكنسية الاصطلاحية التي قد تحسم الغموض الدلالي في الأصل.
