base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: ar
  text: فَلَمَّا سَمِعَ الْمَلِكُ هِيرُودُسُ ذَلِكَ، اضْطَرَبَ، وَاضْطَرَبَتْ مَعَهُ أُورُشَلِيمُ كُلُّهَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُستعمل اسم المدينة هنا للدلالة على سكانها؛ وقد يكون وصف «أورشليم كلها» تعميمًا أو مبالغةً في تصوير القلق الذي عمَّ المدينة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: فَلَمَّا سَمِعَ
  rationale: اسم الفاعل الأوريستي يؤدي وظيفة زمنية، و«فلما سمع» صياغة عربية طبيعية تُظهر الانتقال السردي والعلاقة الزمنية من غير تكلف.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: الْمَلِكُ هِيرُودُ
  rationale: يحفظ اللقب والاسم وفق الترتيب العربي الطبيعي.
- source_word: ἐταράχθη
  choice: اضْطَرَبَ
  rationale: ينقل معنى القلق والانزعاج الداخلي من غير تحديد زائد لدرجته أو سببه.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: أُورُشَلِيمُ كُلُّهَا
  rationale: يحفظ استعمال اسم المدينة مجازًا عن سكانها ولا يضيّق المرجع بإضافة تفسيرية إلى المتن.
- source_word: μετ’ αὐτοῦ
  choice: مَعَهُ
  rationale: ترجمة مباشرة تحفظ اشتراك أورشليم مع هيرود في الاضطراب.
- source_word: implicit object of ἀκούσας
  choice: ذَلِكَ
  rationale: الشيء المسموع مفهوم من السياق السابق، وإظهاره باسم الإشارة يجعل العربية سليمة وطبيعية من غير إضافة مضمون تفسيري جديد.
theological_decisions:
- issue: نطاق عبارة πᾶσα Ἱεροσόλυμα
  choice: الإبقاء على الإسناد إلى أورشليم كلها بوصفه استعمالًا لاسم المدينة عن سكانها
  alternative: اعتبارها مبالغة تشير إلى كثيرين من سكانها، أو قصرها على دوائر القيادة فيها
  rationale: النص اليوناني يذكر المدينة كلها ولا يحدد فئة بعينها؛ لذلك تحافظ الصياغة على العموم والتوتر السردي، وتُذكر احتمالات النطاق في الحاشية بدل حسمها في المتن.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة، مع ضبطٍ كامل للنص القصير. كُرر الفعل «اضطرب» مع أورشليم لأن ذلك أنسب نحويًا وأسلس عربيًا من العطف الحرفي، مع بقاء معنى اشتراكها مع هيرود في الاضطراب.
