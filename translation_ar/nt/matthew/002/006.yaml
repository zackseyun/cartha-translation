source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: ar
  text: «وأنتِ يا بيت لحم، أرضَ يهوذا، لستِ البتةَ الأقلَّ شأنًا بين حكّام يهوذا؛ فمنكِ يخرج[a] حاكمٌ يرعى[b] شعبي، إسرائيل».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يأتي»؛ والمعنى الحرفي للفعل: «يخرج».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يحمل «يرعى» أيضًا معنى «يحكم»، فيجمع بين القيادة الملكية وعناية الراعي.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: أرضَ
  rationale: تفيد هنا الإقليم المنسوب إلى يهوذا، وقد جاءت بدلًا أو بيانًا لبيت لحم؛ و«أرض» تحافظ على الدلالة الجغرافية بإيجاز.
- source_word: οὐδαμῶς
  choice: لستِ بأي حالٍ
  rationale: تنقل النفي المؤكد في اليونانية، ولا تختزله إلى نفي بسيط.
- source_word: ἐλαχίστη
  choice: أصغرَ
  rationale: تؤدي صيغة التفضيل العليا في سياق المقارنة، مع احتمال دلالة الصغر على المكانة لا المساحة وحدها.
- source_word: ἡγεμόσιν
  choice: مدن يهوذا الحاكمة
  rationale: اللفظ يعني حرفيًا «الحكام/القادة»، لكن الاقتباس يربط بيت لحم بوحدات يهوذا التي يمثلها رؤساؤها؛ فهذه الصياغة العربية تجعل المقارنة ببيت لحم مفهومة مع إبقاء معنى الحكم.
- source_word: ἐξελεύσεται
  choice: يخرج
  rationale: يحافظ على الصورة المكانية للفعل اليوناني، أي خروج الحاكم من بيت لحم، وهو طبيعي في العربية.
- source_word: ἡγούμενος
  choice: حاكمٌ
  rationale: اسم الفاعل المستعمل استعمال الاسم يدل على شخص يتولى القيادة والحكم، و«حاكم» يحفظ البعد الملكي.
- source_word: ποιμανεῖ
  choice: يرعى
  rationale: يحفظ استعارة الراعي في الأصل، مع ما تتضمنه من قيادة ورعاية، بدل تسطيحها إلى «يحكم» وحدها.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: شعبي إسرائيل
  rationale: تنقل العبارة العهدية وعلاقة البدل أو البيان بإيجاز طبيعي.
theological_decisions:
- issue: الجمع بين صورة الحاكم وصورة الراعي في وصف الآتي
  choice: «حاكمٌ يرعى»
  alternative: «قائد يحكم» أو صياغة المصطلحين بلغة رعوية فقط
  rationale: يجمع النص بين السلطة الملكية ورعاية الراعي؛ والحفاظ على الصورتين يمنع حصر المعنى في الحكم السياسي أو العناية الرعوية وحدهما.
- issue: هوية المتكلم في «شعبي»
  choice: الإبقاء على ضمير المتكلم بلا إضافة تفسيرية
  alternative: إضافة «يقول الله» داخل النص
  rationale: الأصل يورد «شعبي» ضمن الاقتباس من غير تسمية المتكلم في هذه الجملة، فلا تُضاف هوية تفسيرية إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل خطاب المؤنث لبيت لحم، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
