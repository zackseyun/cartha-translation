  to: حينئذ، إذ رأى هيرودس أن المجوس[b] قد خدعوه[a]، غضب جدًا، فأرسل رجالًا وقتل جميع الصبيان في بيت لحم وفي كل نواحيها، ممن هم في سن سنتين فما دون، بحسب الزمن الذي استوثقه من المجوس.
  rationale: التعديل يزيل الالتباس في عبارة السن ويحسن نقل فعل الاستيثاق من المجوس، مع الحفاظ على بنية السرد ومعناه، وعلى موضعي الحاشيتين ومضمونهما. و«فأرسل رجالًا» يوضح، على نحو طبيعي، الإرسال الملازم لفعل القتل في السياق دون تغيير إسناد الفعل إلى هيرودس.
