id: MAT.2.16
reference: Matthew 2:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: ar
  text: حينئذ، إذ رأى هيرودس أن المجوس[b] قد خدعوه[a]، غضب جدًا، فأرسل رجالًا وقتل جميع الصبيان في بيت لحم وفي كل نواحيها، ممن هم في سن سنتين فما دون، بحسب الزمن الذي استوثقه من المجوس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «قد سخروا منه».'
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«المجوس» هنا حكماء منجّمون من المشرق.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية طبيعية تربط الحدث بما سبقه وتحافظ على تتابع السرد.
- source_word: ἰδὼν ὅτι
  choice: لما رأى أن
  rationale: ينقل الإدراك الذي أدى إلى رد فعل هيرودس، بصياغة عربية واضحة من غير زيادة تفسيرية.
- source_word: ἐνεπαίχθη
  choice: قد خدعوه
  rationale: الفعل المبني للمجهول يفيد حرفيًا التعرض للسخرية أو الاستهزاء، لكنه في السياق يدل على أن المجوس أفشلوا تدبير هيرودس ولم يرجعوا إليه؛ وأُثبت المعنى الحرفي البديل في الحاشية.
- source_word: ὑπὸ τῶν μάγων
  choice: المجوس
  rationale: المقابل العربي المألوف لـ μάγοι، مع حاشية توضّح المقصود التاريخي كيلا يُفهم اللفظ على نحو أضيق من السياق.
- source_word: ἐθυμώθη λίαν
  choice: غضب جدًا
  rationale: ينقل معنى اشتداد الغضب بعبارة مباشرة ومعاصرة دون إضافة لون انفعالي غير منصوص عليه.
- source_word: ἀποστείλας
  choice: فأرسل رجاله
  rationale: المفعول غير مذكور في اليونانية، لكن فعل الإرسال في السياق يقتضي منفذين؛ وذكر الرجال توضيح طبيعي للفاعل المباشر في القتل.
- source_word: ἀνεῖλεν
  choice: قتل
  rationale: تعبير مباشر ودقيق لمعنى الإهلاك أو القتل في هذا السياق.
- source_word: πάντας τοὺς παῖδας
  choice: جميع الصبيان
  rationale: السياق يحدد الأطفال الذكور المستهدفين، و«الصبيان» أوضح من لفظ عام مثل «الأطفال».
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: في بيت لحم وفي كل نواحيها
  rationale: ὅρια هنا هي المناطق أو الأنحاء التابعة المحيطة، لا خطوط الحدود المجردة.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: ممن هم في الثانية من العمر فما دون
  rationale: يبين الحد الأعلى للعمر على نحو شامل وواضح، من غير الإيحاء بأنهم أتموا أكثر من سنتين.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: بحسب الزمن الذي تحقَّق منه لدى المجوس
  rationale: يحافظ على معنى المطابقة للزمن الذي استوثق هيرودس منه عن طريق المجوس، من غير تحديد صريح لكونه زمن ظهور النجم لأن ذلك غير مذكور في الآية نفسها.
theological_decisions:
- issue: دلالة μάγοι
  choice: المجوس
  alternative: الحكماء أو المنجّمون
  rationale: «المجوس» هو المقابل العربي الكتابي المألوف ويحافظ على المصطلح الخاص، بينما توضح الحاشية أنهم حكماء منجّمون من المشرق دون استيراد الصور التقليدية اللاحقة.
- issue: دلالة ἐνεπαίχθη
  choice: قد خدعوه
  alternative: قد سخروا منه
  rationale: «خدعوه» يوضح القوة السياقية للفعل، إذ لم يرجع المجوس إلى هيرودس فظهر كمن أُفشل تدبيره؛ أما الدلالة الحرفية الأقرب، «سخروا منه»، فحُفظت في الحاشية حتى لا يضيع التوتر المعجمي.
- issue: فاعلية هيرودس في القتل
  choice: فأرسل رجاله وقتل
  alternative: فأرسل رجاله ليقتلوا
  rationale: الصياغة المختارة تمثل فعل الإرسال ثم الفعل الرئيسي «قتل»، وتحافظ على إسناد الجريمة إلى هيرودس مع إيضاح تنفيذها بواسطة رجاله؛ أما البديل فيحوّل الفعل الرئيسي إلى جملة غرضية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع تفضيل التراكيب السردية الطبيعية. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
