  - severity: low
    issue: صياغة الاستيثاق الزمني
    rationale: «تحقّق منه لدى المجوس» أقل مباشرة في الدلالة على أن هيرودس استوثق الزمن منهم. «استوثقه من المجوس» أوضح وأقرب إلى ἠκρίβωσεν παρὰ τῶν μάγων.
