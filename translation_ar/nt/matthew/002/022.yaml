lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: لكنه لما سمع
  rationale: تفيد صيغة اسم الفاعل الأوريستي ظرفًا زمنيًا سابقًا للفعل الرئيس، وتُظهر «لكن» التحول من نية الذهاب السابقة إلى العائق الجديد.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: يملك على اليهودية
  rationale: يحفظ الفعل معنى المُلك الملكي، وتؤدي «على» علاقة الحكم بالإقليم في عربية واضحة.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: بدلًا من أبيه هيرودس
  rationale: تنقل ἀντί معنى الحلول محل شخص آخر أو خلافته دون إضافة تفسير غير مصرح به.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: خاف أن يذهب إلى هناك
  rationale: صياغة عربية طبيعية تحافظ على الخوف من التوجه إلى المكان المذكور.
- source_word: χρηματισθεὶς
  choice: إذ أُنذر
  rationale: تحفظ المبني للمجهول ودلالة التحذير، من غير التصريح بفاعل لم يذكره النص اليوناني.
- source_word: κατ’ ὄναρ
  choice: في حلم
  rationale: تعبير عربي مباشر يقابل العبارة المتّية المعتادة عن تلقي رسالة أثناء الحلم.
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: ينقل معنى المغادرة المقصودة استجابةً للخطر أو للظرف، من غير المبالغة التي قد توحي بها «هرب».
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: إلى نواحي الجليل
  rationale: تعكس «نواحي» جمع μέρη، وتدل طبيعيًا على مناطق الإقليم لا على نقطة واحدة.
theological_decisions:
- issue: هل يُصرَّح بأن الله هو مصدر الإنذار في χρηματισθείς؟
  choice: 'الإبقاء على المبني للمجهول: «إذ أُنذر»'
  alternative: «إذ أنذره الله» أو «إذ تلقى إرشادًا إلهيًا»
  rationale: السياق والاستعمال المتّي يرجحان اتصال الإنذار بالله، لكن الفاعل غير مذكور صراحة في هذه الآية؛ لذلك يُحفظ الإضمار ولا يُضاف اسم الله إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «يملك على» لإبراز الدلالة الملكية، و«نواحي الجليل» لحفظ صيغة الجمع. وُضع مؤشر الحاشية عقب «في حلم» ليرتبط بعبارة الإنذار كاملة، وحُفظت الفاصلة الختامية لأن الآية تتصل نحويًا بما بعدها.
