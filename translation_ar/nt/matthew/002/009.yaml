source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: ar
  text: ولمّا سمعوا الملك، مضوا في طريقهم. وإذا بالنجم الذي رأوه في المشرق[a] يتقدّمهم، حتى أتى ووقف فوق المكان الذي كان فيه الطفل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند طلوعه». يمكن أن يشير التعبير اليوناني إلى المشرق بوصفه جهة أو منطقة، أو إلى طلوع النجم.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: ولمّا سمعوا الملك
  rationale: صيغت العبارة كجملة زمنية تسبق الفعل الرئيس، وفق دلالة اسم الفاعل الماضي في السياق. وأُبقي «الملك» كما في اليونانية من غير إضافة اسم هيرودس من السياق.
- source_word: ἐπορεύθησαν
  choice: مضوا في طريقهم
  rationale: تعبير عربي طبيعي يفيد الانطلاق ومواصلة السير بعد سماع الملك، من غير زيادة في تحديد الوجهة.
- source_word: ἰδοὺ
  choice: وإذا
  rationale: تحافظ «وإذا» على وظيفة أداة التنبيه والمفاجأة السردية بأسلوب عربي فصيح طبيعي.
- source_word: ὁ ἀστήρ
  choice: النجم
  rationale: المقابل العربي المباشر والدقيق للفظ اليوناني.
- source_word: ὃν εἶδον
  choice: الذي رأوه
  rationale: صيغة موصولية واضحة تحيل إلى رؤية سابقة، ويبيّن السياق ترتيب الحدثين من غير حاجة إلى تركيب زمني أثقل.
- source_word: ἐν τῇ ἀνατολῇ
  choice: في المشرق
  rationale: تحافظ على القراءة الجغرافية المألوفة، مع إثبات الدلالة الفلكية الممكنة «عند طلوعه» في الحاشية.
- source_word: προῆγεν αὐτούς
  choice: يتقدّمهم
  rationale: ينقل معنى السير أمامهم ويحافظ بصيغة المضارع السردي على الاستمرار الذي تفيده صيغة الماضي الناقص اليونانية.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: حتى أتى ووقف
  rationale: يحافظ على تتابع الوصول ثم الوقوف بصياغة عربية موجزة وطبيعية.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: فوق المكان الذي كان فيه الطفل
  rationale: يصرّح بالمكان الذي تفيده أداة الوصل المكانية في اليونانية، ويحافظ على صورة وجود النجم فوق موضع الطفل.
theological_decisions:
- issue: دلالة ἐν τῇ ἀνατολῇ في رواية النجم
  choice: في المشرق
  alternative: عند طلوعه
  rationale: يحتمل التعبير اليوناني الإشارة إلى الشرق بوصفه جهة أو منطقة، كما يحتمل الإشارة إلى طلوع النجم. لا يحسم النص وحده هذا الاحتمال، لذلك أُثبتت القراءة الجغرافية في المتن وحُفظ البديل الفلكي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُخدمت «وإذا» بدل مقابل حرفي ثقيل لأداة التنبيه، ووُضعت علامة الحاشية بعد «المشرق» لأنها تخص العبارة اليونانية المقابلة لها.
