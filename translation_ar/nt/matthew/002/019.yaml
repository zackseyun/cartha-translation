  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: ar
  text: وبعدما مات هيرودس، إذا ملاك الرب[a] يظهر ليوسف في حلم، وهو في مصر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: في اليونانية «ملاك» نكرة، إذ لا تسبقها أداة تعريف. أما العربية فتقتضي الإضافة في «ملاك الرب»؛ ولا يلزم من ذلك أن المقصود ملاك محدد.
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: وبعدما مات هيرودس
  rationale: اسم الفاعل الأوريستي في تركيب المضاف إليه المطلق يفيد هنا الزمن السابق للحدث الرئيس؛ و«بعدما مات» تعبير عربي طبيعي يحفظ هذا التسلسل. ونقلت δὲ بالواو الانتقالية الملائمة للسرد، بدل فرض مقابلة قوية لا يقتضيها السياق.
- source_word: ἰδοὺ
  choice: إذا
  rationale: «إذا» الفجائية في هذا السياق السردي تؤدي وظيفة أداة لفت الانتباه وتضفي حيوية على ظهور الملاك، بصياغة عربية فصيحة طبيعية.
- source_word: ἄγγελος κυρίου
  choice: ملاكٌ من الرب
  rationale: يحافظ هذا التركيب على تنكير ἄγγελος في اليونانية، ويتجنب أن تجعل الإضافة العربية العبارة معرفة تلقائيًا كما في «ملاك الرب».
- source_word: φαίνεται
  choice: يظهر
  rationale: المضارع يحفظ الحاضر التاريخي في النص اليوناني وحيوية المشهد السردي.
- source_word: κατ’ ὄναρ
  choice: في حلم
  rationale: مقابل عربي واضح وطبيعي للتعبير الاصطلاحي الدال على الظهور في الحلم.
- source_word: τῷ Ἰωσὴφ
  choice: ليوسف
  rationale: اللام تنقل المفعول غير المباشر بصورة عربية موجزة وطبيعية.
- source_word: ἐν Αἰγύπτῳ
  choice: بمصر
  rationale: الباء هنا تفيد المكان بعبارة عربية فصيحة موجزة، أي إن يوسف كان في مصر حين ظهر له الملاك.
theological_decisions:
- issue: دلالة κύριος في عبارة ἄγγελος κυρίου
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل العربي المستقر والملائم للقب κύριος في هذا السياق الديني، من غير إضافة تفسير عقائدي إلى النص.
- issue: تعريف ἄγγελος أو تنكيره
  choice: ملاكٌ من الرب
  alternative: ملاك الرب
  rationale: لا توجد أداة تعريف قبل ἄγγελος في اليونانية، لذلك يحافظ النص الرئيس على التنكير. أما «ملاك الرب» فصياغة تقليدية ممكنة، لكنها تصبح معرفة بحكم الإضافة العربية وقد توحي بتحديد لا يفرضه التركيب اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية مهيبة. استُخدمت «إذا» الفجائية لنقل قوة ἰδοὺ، وحُفظ المضارع التاريخي في «يظهر». وُضع موضع الحاشية مباشرة بعد العبارة التي تتناولها.
