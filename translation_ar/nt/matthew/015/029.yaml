  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: ar
  text: وانتقل يسوع من هناك، فجاء إلى جانب بحر الجليل، وصعد إلى الجبل، وكان جالسًا هناك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: وانتقل يسوع من هناك
  rationale: ينقل اسم الفاعل الأوريستي السابق للفعل الرئيس بصياغة سردية عربية طبيعية، مع الحفاظ على معنى مغادرة الموضع السابق.
- source_word: ἦλθεν
  choice: فجاء
  rationale: صيغة ماضٍ سردية مباشرة، والفاء توضح تعاقب الحدث مع ما قبله من غير إفراط في الشرح.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: بمحاذاة بحر الجليل
  rationale: παρά مع النصب وبعد فعل حركة تدل هنا على الوصول أو السير بمحاذاة البحر؛ و«بمحاذاة» تحفظ هذا المعنى من غير الجزم بمسار طويل على الساحل.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: ثم صعد إلى الجبل
  rationale: يحفظ الصعود والاتجاه إلى الجبل، وتؤدي «ثم» دلالة سبق اسم الفاعل الأوريستي لجلوسه.
- source_word: ἐκάθητο ἐκεῖ
  choice: وجلس هناك
  rationale: الماضي العربي «جلس» هو التعبير السردي الطبيعي، ويمكنه في السياق أن يعبّر عن اتخاذ وضع الجلوس، مع أن اليونانية بصيغة الناقص تصوّر الجلوس بوصفه حالة ممتدة.
