lexical_decisions:
- source_word: Καὶ
  choice: ثم
  rationale: تؤدي وظيفة الرابط السردي هنا بلغة عربية طبيعية، وتتابع الحدث من غير إضافة معنى تفسيري زائد.
- source_word: προσκαλεσάμενος
  choice: دعا ... إليه
  rationale: ينقل معنى استدعاء الجمع إلى المتكلم، ويصوغ اسم الفاعل الماضي اليوناني فعلاً عربياً سابقاً للفعل الرئيس على نحو طبيعي.
- source_word: τὸν ὄχλον
  choice: الجمع
  rationale: لفظ عربي فصيح وواضح يدل على جماعة الناس المحتشدة، من غير النبرة القديمة التي قد تحملها بدائل أخرى.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: مقابل مباشر وطبيعي للفعل مع المفعول غير المباشر.
- source_word: Ἀκούετε
  choice: اسمعوا
  rationale: يحفظ فعل السماع وصيغة الأمر للجمع، ويمكن في السياق أن يفيد الإصغاء المقصود.
- source_word: συνίετε
  choice: افهموا
  rationale: يدل على إدراك معنى ما يُسمع، ويحفظ التمييز بين السماع والفهم.
theological_decisions: []
