  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: ar
  text: 'لكنه أجاب: «لم أُرسَل إلا إلى الخراف الضالة من بيت إسرائيل».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: لكنه أجاب
  rationale: تنقل «لكن» التحول المقابل في δέ، وتؤدي «أجاب» معنى تركيب اسم الفاعل مع فعل القول بصياغة عربية طبيعية موجزة من غير فقد للمعنى.
- source_word: Οὐκ ἀπεστάλην εἰ μὴ
  choice: لم أُرسَل إلا
  rationale: تحافظ هذه الصياغة على المبني للمجهول وعلى بنية القصر الصريحة في اليونانية، وتبقي تقييد نطاق الإرسال كما ورد.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: الخراف الضالة
  rationale: تحفظ صورة الخراف المجازية، وتعبّر «الضالة» عن حال الضياع المقصودة هنا من غير أن توحي بالهلاك النهائي.
- source_word: οἴκου Ἰσραήλ
  choice: من بيت إسرائيل
  rationale: تحفظ العبارة الكتابية ذات الدلالة القومية والعهدية، كما يوضح حرف «من» أن الخراف تنتمي إلى بيت إسرائيل.
theological_decisions:
- issue: نطاق رسالة يسوع المعلنة في هذا القول
  choice: 'إبقاء القصر الصريح: «لم أُرسَل إلا إلى...»'
  alternative: صياغة تفيد الأولوية لإسرائيل فحسب، أو توسّع القول ليشمل الأمم استنادًا إلى سياقات لاحقة
  rationale: التركيب اليوناني Οὐκ ... εἰ μὴ تقييدي صريح؛ لذلك تُحفظ حدة القول وتوتره السردي من غير تلطيف أو إدخال تفسير لاهوتي من خارج الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت صيغة «لم أُرسَل إلا» لأنها طبيعية ودقيقة وتحفظ البنية التقييدية للأصل، ولم تلزم حاشية لعدم وجود بديل نصي أو غموض يحتاج إلى بيان.
