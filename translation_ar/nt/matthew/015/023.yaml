source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: ar
  text: 'لكنه لم يُجِبْها بكلمة. فتقدّم إليه تلاميذه وظلّوا يطلبون منه قائلين: «اصرفها[a]، لأنها تصرخ خلفنا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أطلقها». لا يوضح كلام التلاميذ هل قصدوا: «لبِّ طلبها واصرفها»، أم مجرد: «اصرفها عنا».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «في إثرنا». يمكن أن يدل التعبير اليوناني على الموقع، أي «خلفنا»، أو على الملاحقة، أي «في إثرنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: لم يُجِبْها بكلمة
  rationale: يحافظ على التعبير اليوناني المؤكد، أي إنه لم يقدم لها أي جواب، وهو تعبير عربي طبيعي واضح.
- source_word: προσελθόντες
  choice: فتقدّم إليه
  rationale: ينقل حركة التلاميذ نحو يسوع بوضوح، مع إظهار أن المقصود هو الاقتراب منه.
- source_word: ἠρώτουν
  choice: ظلّوا يطلبون منه
  rationale: صيغة الماضي الناقص تفيد الاستمرار أو التكرار؛ و«ظلّوا يطلبون» تنقل ذلك من غير المبالغة التي قد تحملها «توسّلوا».
- source_word: Ἀπόλυσον αὐτήν
  choice: اصرفها
  rationale: صياغة موجزة ومحايدة تدل على إرسالها أو صرفها، ولا تحسم هل قصد التلاميذ تلبية طلبها أولًا أم مجرد إبعادها.
- source_word: κράζει
  choice: تصرخ
  rationale: ينقل النداء المرتفع المستمر في السياق من غير حصره في مجرد علو الصوت.
- source_word: ὄπισθεν ἡμῶν
  choice: خلفنا
  rationale: هو المعنى المكاني المباشر، مع بقاء معنى السير في إثرهم احتمالًا معجميًا يُذكر في الحاشية.
theological_decisions:
- issue: مراد التلاميذ من قولهم Ἀπόλυσον αὐτήν
  choice: «اصرفها» بصياغة محايدة
  alternative: «لبِّ طلبها ثم اصرفها» أو «أبعدها عنا»
  rationale: الأمر اليوناني لا يصرّح هل أرادوا أن يلبي يسوع طلبها ثم يرسلها، أم أن يبعدها فحسب. لذلك تُحفظ مساحة الغموض والتوتر السردي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ظلّوا يطلبون» لإبراز الاستمرار، و«اصرفها» للمحافظة على غموض مقصد التلاميذ. وُضعت علامتا الحاشيتين بعد اللفظين اللذين تتعلقان بهما.
