source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: ar
  text: 'ثم دعا يسوع تلاميذه إليه وقال: «إني أشفق على الجمع[a]، لأنهم مكثوا معي منذ ثلاثة أيام، وليس عندهم ما يأكلونه. ولا أريد أن أصرفهم جياعًا[b]، لئلا تخور قواهم في الطريق[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أتحنن على الجمع». واللفظ اليوناني يدل على رحمة عميقة.'
    reason: lexical_alternative
  - marker: b
    text: 'اللفظ اليوناني حرفيًا: «صائمين» أو «بلا طعام»؛ والمقصود هنا أنهم لم يأكلوا، لا أنهم يمارسون صومًا تعبديًا.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لئلا يُغمى عليهم في الطريق» أو «لئلا ينهاروا في الطريق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: دعا ... إليه
  rationale: ينقل معنى صيغة الوسط واتجاه الدعوة إلى يسوع بعبارة عربية طبيعية.
- source_word: Σπλαγχνίζομαι
  choice: إني أشفق على
  rationale: يعبّر بوضوح عن التأثر العميق والرحمة من غير صياغة عتيقة أو تفسير زائد.
- source_word: ὄχλον
  choice: الجمع
  rationale: لفظ عربي فصيح ومألوف في السرد للدلالة على جماعة الناس المحتشدة.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: ملازمون لي منذ ثلاثة أيام
  rationale: يحفظ معنى استمرار بقائهم مع يسوع، ويؤدي ἤδη مع مدة الأيام الثلاثة بصياغة عربية سلسة.
- source_word: τί φάγωσιν
  choice: ما يأكلونه
  rationale: مقابل عربي طبيعي للعبارة التي تفيد عدم وجود طعام لديهم.
- source_word: ἀπολῦσαι
  choice: أن أصرفهم
  rationale: يلائم سياق إنهاء اجتماع الجمع وإرسالهم من المكان.
- source_word: νήστεις
  choice: صائمين
  rationale: 'يحافظ على الدلالة اللفظية: كونهم بلا طعام، مع حاشية تمنع فهمه بالضرورة على أنه صوم تعبدي.'
- source_word: μήποτε
  choice: لئلا
  rationale: ينقل بإيجاز معنى النتيجة المتخوَّف منها.
- source_word: ἐκλυθῶσιν
  choice: تخور قواهم
  rationale: يؤدي معنى إصابتهم بالوهن أو الإعياء، دون أن يحصره في الإغماء أو الانهيار الجسدي.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: ترجمة عربية مباشرة وطبيعية تشير إلى رحلة عودتهم.
