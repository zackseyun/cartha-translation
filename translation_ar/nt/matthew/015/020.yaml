base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: ar
  text: هذه هي الأشياء التي تُنجِّس الإنسان[a]، أمّا الأكل بأيدٍ غير مغسولة فلا يُنجِّس الإنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجعل الإنسان غير طاهر». يمكن أن يدل الفعل اليوناني على جعله نجسًا من جهة الطقوس؛ وتحفظ عبارة «تُنجِّس» هنا هذا السياق ومعنى الفساد الأوسع في تعليم يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: تُنجِّس / يُنجِّس
  rationale: ينقل فعل «نجَّس» معنى جعل الإنسان غير طاهر في سياق الطهارة، مع إبقاء الدلالة الأخلاقية الأوسع في تعليم يسوع.
- source_word: ἄνθρωπον
  choice: الإنسان
  rationale: اسم مفرد معرَّف يُستعمل استعمالًا تمثيليًا عامًا؛ و«الإنسان» يحفظ المفرد ويشمل البشر عمومًا بصورة طبيعية في العربية.
- source_word: ἀνίπτοις χερσὶν
  choice: بأيدٍ غير مغسولة
  rationale: صياغة عربية واضحة تحفظ وصف الأيدي كما في اليونانية وتلائم سياق غسل اليدين.
- source_word: φαγεῖν
  choice: الأكل
  rationale: المصدر العربي يؤدي وظيفة المصدر اليوناني ويحافظ على سلاسة الجملة.
- source_word: ταῦτά ἐστιν τὰ
  choice: هذه هي الأشياء التي
  rationale: يحفظ اسم الإشارة والتوكيد والبنية التعريفية بعبارة عربية واضحة.
- source_word: δέ
  choice: أمّا ... فلا
  rationale: هذه البنية العربية تُبرز المقابلة بين ما ينجّس حقًا وبين الأكل بأيدٍ غير مغسولة.
theological_decisions:
- issue: دلالة κοινόω في جدال عن الطهارة
  choice: تُرجم بـ«يُنجِّس» للمحافظة على خلفية النجاسة الطقسية وعلى القوة الأخلاقية الأوسع.
  alternative: يجعل الإنسان غير طاهر
  rationale: «يُنجِّس» موجز وطبيعي، ولا يحصر قول يسوع في الطهارة الطقسية وحدها.
- issue: المفرد العام ἄνθρωπον
  choice: الإنسان
  alternative: الشخص / الناس
  rationale: «الإنسان» يحفظ صيغة المفرد الممثِّل ويفيد الجنس البشري عمومًا من غير تحويله إلى جمع.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت بنية «أمّا ... فلا» لإظهار التضاد الطبيعي، وحُفظ تكرار «الإنسان» الوارد في الأصل.
