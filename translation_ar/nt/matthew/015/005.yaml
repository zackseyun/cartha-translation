  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: ar
  text: 'أَمَّا أَنْتُمْ فَتَقُولُونَ: «مَنْ قَالَ لِأَبِيهِ أَوْ أُمِّهِ: مَا كُنْتَ سَتَنْتَفِعُ بِهِ مِنِّي هُوَ عَطِيَّةٌ[a]»،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تَقْدِمَةٌ». والمقصود أن ما كان يمكن أن يُستعمل لإعالة الوالدين يُعلَن أنه مكرَّس لله؛ قارن مرقس 7:11، حيث يَرِد لفظ «قربان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: أَمَّا أَنْتُمْ فَتَقُولُونَ
  rationale: تنقل «أمّا» مع الفاء قوة المقابلة التي تؤديها δὲ، وتُبرز ضمير المخاطبين كما يبرزه النص اليوناني.
- source_word: Ὃς ἂν εἴπῃ
  choice: مَنْ قَالَ
  rationale: صيغة «مَن» الشرطية مع الماضي تفيد التعميم في العربية بوضوح وطبيعية، بما يوافق التركيب اليوناني الدال على الحالة العامة غير المحددة.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: لِأَبِيهِ أَوْ أُمِّهِ
  rationale: اللام تنقل وظيفة المفعول غير المباشر، والضمير المضاف طبيعي في العربية ويحفظ الإحالة إلى القائل.
- source_word: Δῶρον
  choice: قُرْبَانٌ
  rationale: لـ δῶρον معنى «هدية» أو «تقدمة». وفي هذا السياق التعبدي تدل «قربان» بوضوح على مال مكرس لله، من غير إدخال اللفظ المنقول «قربان» الوارد في مرقس بوصفه مصطلحًا آراميًا؛ وتوضح الحاشية البديل المعجمي.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: مَا كُنْتَ سَتَنْتَفِعُ بِهِ مِنِّي
  rationale: تحفظ العبارة مصدر المنفعة «مني» ومعنى ὠφεληθῇς، وتعبّر بصياغة عربية طبيعية عن المنفعة التي كان الوالد سينالها لولا هذا التصريح.
theological_decisions:
- issue: هل يُستعمل في متن متى مصطلح «قربان» التقني الوارد في مرقس 7:11؟
  choice: ترجمة δῶρον بـ«قربان» بوصفها كلمة عربية دالة على التقدمة، مع بيان «تقدمة» في الحاشية
  alternative: هدية؛ أو إدخال المصطلح الآرامي التقني كما في مرقس
  rationale: لا يورد متى اللفظ الآرامي κορβᾶν، ولذلك لا يُنسب إلى نصه اقتباس ذلك المصطلح. غير أن «قربان» في العربية الفصحى ترجمة سياقية طبيعية لـ δῶρον عندما تكون العطية مكرسة لله، والحاشية تمنع حصر المعنى في صيغة واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «أما أنتم فتقولون» لإظهار المقابلة والتوكيد، و«ما كنت ستنتفع به مني» لصون معنى المنفعة غير المتحققة دون تعقيد حرفي.
