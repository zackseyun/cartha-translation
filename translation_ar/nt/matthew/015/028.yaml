id: MAT.15.28
reference: Matthew 15:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: ar
  text: 'حينئذ أجابها يسوع: «يا امرأة، عظيم إيمانك[a]! ليكن لك كما تريدين». وشُفيت ابنتها من تلك الساعة[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عظيمة ثقتك». قد تدل الكلمة اليونانية πίστις أيضًا على الثقة أو الأمانة، لكن «الإيمان» هو الأنسب هنا.
    reason: lexical_alternative
  - marker: b
    text: 'أو «منذ تلك اللحظة». يقول اليوناني حرفيًا: «منذ تلك الساعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: أداة زمنية تصل جواب يسوع بالحوار السابق، و«حينئذ» واضحة وفصيحة من غير تكلّف.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: أجابها يسوع
  rationale: هذا تركيب سردي يوناني مألوف يجمع فعل الإجابة وفعل القول؛ وصياغتهما بفعل عربي واحد تتجنب التكرار وتحفظ كون الكلام موجَّهًا إليها.
- source_word: Ὦ γύναι
  choice: يا امرأة
  rationale: «يا» تؤدي النداء، و«امرأة» هي المقابل المباشر لـγύναι؛ والخطاب هنا مؤكد ومحترم، لا يحمل بالضرورة خشونة.
- source_word: μεγάλη σου ἡ πίστις
  choice: عظيم إيمانك
  rationale: تحفظ الصياغة تقديم وصف العظمة للتوكيد، وتبقى طبيعية ومهيبة في العربية.
- source_word: πίστις
  choice: إيمان
  rationale: «إيمان» هو المقابل المعتاد هنا، والسياق يدل على اعتماد المرأة الواثق على يسوع؛ وتُذكر دلالة «الثقة» الممكنة في الحاشية.
- source_word: γενηθήτω σοι
  choice: ليكن لك
  rationale: تحفظ صيغة الأمر المبني للمجهول وقوة إعلان يسوع من غير تحديد شيء لم يصرّح به النص.
- source_word: ὡς θέλεις
  choice: كما تريدين
  rationale: تنقل معنى الإرادة أو الرغبة بصياغة عربية طبيعية، مع مطابقة المخاطبة المؤنثة.
- source_word: ἰάθη
  choice: شُفيت
  rationale: تنقل المبني للمجهول ودلالة الشفاء بوضوح في سياق المعجزة.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: منذ تلك الساعة
  rationale: ترجمة قريبة من العبارة اليونانية، وتحفظ صورتها الزمنية بدل استبدالها في المتن بـ«منذ تلك اللحظة».
theological_decisions:
- issue: دلالة πίστις في ثناء يسوع
  choice: إيمان
  alternative: ثقة؛ أمانة
  rationale: السياق يركّز على اعتماد المرأة الواثق في طلبها، ولذلك يلائم «إيمان» الاستعمال المعتاد من غير حصر اللفظة في مفهوم مذهبي مفصّل. وتُحفظ «ثقة» بوصفها احتمالًا دلاليًا في الحاشية، أما «أمانة» فممكنة معجميًا لكنها أضعف سياقيًا هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعملت صياغة موجزة وطبيعية، مع الحفاظ على توكيد العبارة اليونانية وعلى صورتها الزمنية. وُضعت علامتا الحاشيتين بعد اللفظتين اللتين تشرحانهما مباشرة.
