  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: ar
  text: 'أما هي فجاءت وانحنت أمامه[a] قائلة: «يا رب، أعنّي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سجدت له»؛ ويمكن أيضًا أن تعني «عبدته». قد يدل الفعل اليوناني على الانحناء إجلالًا، أو إبداء التكريم، أو العبادة، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أما هي فـ
  rationale: تفيد انتقالًا ذا مسحة استدراكية أمام جواب يسوع السابق، وتُبرز إصرار المرأة بصياغة عربية طبيعية.
- source_word: ἐλθοῦσα
  choice: تقدمت
  rationale: اسم الفاعل الماضي يدل على إتيانها نحو يسوع؛ و«تقدمت» تنقل الحركة نحوه طبيعيًا من غير تركيب حرفي ثقيل.
- source_word: προσεκύνει αὐτῷ
  choice: سجدت له
  rationale: الفعل يدل على الانحناء أو السجود إكرامًا، وقد يدل بحسب السياق على العبادة. و«سجدت له» تحفظ الفعل الجسدي ودلالته التوقيرية من غير أن تحسم وحدها طبيعة إدراك المرأة اللاهوتي.
- source_word: λέγουσα
  choice: قائلة
  rationale: تنقل اسم الفاعل الذي يقدم الكلام المباشر بصياغة عربية موجزة وطبيعية.
- source_word: Κύριε
  choice: يا رب
  rationale: «رب» المقابل المعتاد لـκύριος، وأداة النداء لازمة طبيعيًا في العربية هنا، مع إبقاء ثقل اللقب واحتمال دلالته السياقية.
- source_word: βοήθει μοι
  choice: أعنّي
  rationale: أمر حاضر في صيغة التماس عاجل؛ و«أعنّي» موجزة وفصيحة وتحفظ مباشرة الرجاء وشدته.
theological_decisions:
- issue: دلالة προσκυνέω الموجَّه إلى يسوع
  choice: سجدت له
  alternative: عبدته؛ أو انحنت أمامه إجلالًا
  rationale: اللفظ اليوناني قد يصف سجود التوقير أو تقديم الإجلال، وقد يحمل معنى العبادة بحسب السياق. يثبت المتن الفعل الظاهر بصياغة عربية مألوفة، وتوضح الحاشية المجال الدلالي حتى لا يُحسم التوتر اللاهوتي بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت «تقدمت» بدل الصياغة الحرفية «إذ جاءت»، و«أعنّي» للمحافظة على إيجاز الالتماس وقوته. وُضعت علامة الحاشية [a] مباشرة بعد العبارة المعنية.
