  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ar
  text: اتركوهم وشأنهم؛ إنهم عميان، مرشدون للعميان. ولكن إن قاد أعمى أعمى[a]، فسيسقط كلاهما في حفرة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاء «أعمى» هنا بصيغة المفرد المذكر على سبيل التمثيل في المثل، والمعنى عام ولا يقتصر على الذكور.
    reason: cultural_note
  - marker: b
    text: 'أو: خندق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: اتركوهم وشأنهم
  rationale: ينقل فعل الأمر معنى تركهم وعدم الانشغال بهم، لا معنى المغفرة أو الإرسال، وتعبير «وشأنهم» عربي طبيعي يوضح قوة الأمر.
- source_word: τυφλοί
  choice: عميان
  rationale: يحافظ على استعارة العمى كما وردت، من غير تحويلها إلى تفسير مثل «جاهلون» أو «عميان روحيًا».
- source_word: ὁδηγοὶ τυφλῶν
  choice: قادة عميان للعميان
  rationale: يحافظ على صورة المرشدين أو القادة الذين يقودون عميانًا، وعلى الصياغة الاسمية الموجزة في اليونانية.
- source_word: τυφλὸς ... τυφλὸν
  choice: أعمى ... أعمى
  rationale: يحافظ على المفرد المذكر في صياغة المثل اليونانية، مع بيان دلالته التمثيلية العامة في الحاشية.
- source_word: δὲ
  choice: ولكن
  rationale: تنقل الانتقال المقابل إلى نتيجة المثل وتحذيره.
- source_word: ἐὰν ὁδηγῇ
  choice: إن قاد
  rationale: صيغة شرط عربية طبيعية تعبّر عن الشرط العام في الأصل.
- source_word: ἀμφότεροι
  choice: كلاهما
  rationale: ينقل بوضوح أن القائد والمقود يسقطان معًا.
- source_word: εἰς βόθυνον
  choice: في حفرة
  rationale: «حفرة» لفظ عام واضح يناسب مجال معنى βόθυνος، الذي قد يدل أيضًا على خندق أو هوة.
- source_word: πεσοῦνται
  choice: فسيسقط
  rationale: ينقل زمن المستقبل والنتيجة المترتبة على الشرط بصياغة عربية سلسة.
theological_decisions:
- issue: القوة المجازية للعمى
  choice: إبقاء «عميان» من غير شرح داخل المتن
  alternative: عميان روحيًا؛ قادة جاهلون
  rationale: الأصل يستعمل استعارة حية ولا يحدد معناها التفسيري صراحة؛ وشرحها في المتن من شأنه أن يحسم دلالتها بدل الحفاظ على قوتها وتوترها.
- issue: التذكير في صياغة المثل
  choice: أعمى ... أعمى بصيغة المفرد المذكر
  alternative: شخص أعمى ... شخص أعمى
  rationale: يحافظ هذا على بنية الأصل الموجزة، بينما توضح الحاشية أن المثل ذو تطبيق عام ولا يقتصر على الذكور.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموجزة، تحافظ على البنية المثلية والاستعارة. استُعمل «اتركوهم وشأنهم» للتعبير الطبيعي عن الأمر، مع إبقاء «قادة عميان للعميان» قريبًا من الصياغة الاسمية اليونانية.
