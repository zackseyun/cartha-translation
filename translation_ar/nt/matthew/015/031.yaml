  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ar
  text: حتى إنَّ الحشد تعجَّب حين رأى البُكم يتكلَّمون[a]، وذوي العاهات معافين[b]، والعُرج يمشون، والعُمي يبصرون؛ ومجَّدوا إله إسرائيل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الصُّم يتكلَّمون». يمكن أن تشير الكلمة اليونانية إلى الصُّم أو إلى البُكم، لكن ذكر التكلّم هنا يرجّح معنى البُكم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ذوي الأطراف المشوَّهة معافين» أو «ذوي الأطراف المبتورة وقد استعادوا عافيتهم». تصف الكلمة اليونانية أشخاصًا أصاب أطرافهم عجز أو تشوّه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: حتى إنَّ
  rationale: تفيد النتيجة المترتبة على أعمال الشفاء السابقة، وتأتي طبيعية في العربية.
- source_word: τὸν ὄχλον
