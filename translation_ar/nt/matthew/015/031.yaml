  rationale: تعبير عربي واضح وموجز عن جماعة الناس الحاضرة.
- source_word: θαυμάσαι
  choice: تعجَّبوا
  rationale: ينقل معنى الدهشة الممزوجة بالإعجاب الناتجة عمّا شاهدوه.
- source_word: κωφοὺς λαλοῦντας
  choice: البُكم يتكلَّمون
  rationale: يمكن أن تدل κωφός على الأصم أو الأبكم، لكن اقترانها هنا بالتكلّم يرجّح العجز عن الكلام.
- source_word: κυλλοὺς ὑγιεῖς
  choice: ذوي الأطراف العاجزة أصحّاء
  rationale: تحافظ العبارة على الإشارة إلى عجز أو إصابة الأطراف، وتترجم ὑγιεῖς بوصف الحالة الناتجة مباشرة.
- source_word: χωλοὺς περιπατοῦντας
  choice: العُرج يمشون
  rationale: صياغة مباشرة تحافظ على المقابلة بين العرج والمشي.
- source_word: τυφλοὺς βλέποντας
  choice: العُمي يبصرون
  rationale: صياغة مباشرة تعكس استعادة القدرة على الإبصار.
- source_word: ἐδόξασαν
  choice: مجَّدوا
  rationale: يحفظ معنى إسناد المجد إلى الله، وهو أدق هنا من الاكتفاء بالمدح.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: إله إسرائيل
  rationale: ترجمة مباشرة للإضافة اليونانية مع إبقاء الدلالة الكتابية كما هي.
theological_decisions:
- issue: دلالة κωφούς في عبارة κωφοὺς λαλοῦντας
  choice: البُكم يتكلَّمون
  alternative: الصُّم يتكلَّمون
  rationale: اللفظة اليونانية تحتمل الصمم أو البكم، لكن ذكر التكلّم يجعل البكم هو المعنى الأرجح من السياق، مع حفظ البديل في الحاشية.
- issue: معنى δοξάζω في استجابة الجمع لله
  choice: مجَّدوا إله إسرائيل
  alternative: سبَّحوا إله إسرائيل
  rationale: «مجَّدوا» يحافظ على معنى إسناد المجد إلى الله من غير تضييقه إلى صورة محددة من التسبيح.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «حتى إنَّ» لإبراز النتيجة، وحُفظ توازي قائمة المعجزات. وُضعت الحواشي عند موضعي الاحتمال المعجمي الحقيقي دون حسم ما لا يحسمه الأصل.
