base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: ar
  text: 'حينئذٍ جاء إلى يسوع فريسيون وكتبة[a] من أورشليم، قائلين:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني «الكتبة» أيضًا «علماء الشريعة» أو «معلمي الشريعة» في هذا السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: أداة زمنية تربط هذه الحادثة بما قبلها وتحافظ على انسياب السرد.
- source_word: προσέρχονται
  choice: جاء إلى
  rationale: تفيد التوجه إلى شخص والاقتراب منه. صيغ الماضي أشيع وأطبع في السرد العربي من نقل المضارع التاريخي حرفيًا.
- source_word: τῷ Ἰησοῦ
  choice: إلى يسوع
  rationale: المجرور اليوناني مع الفعل يحدد الشخص الذي جاؤوا إليه.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: من أورشليم
  rationale: تنقل معنى المصدر أو موضع الانطلاق من غير أن تضيف افتراضًا عن صفة الوفد الرسمية.
- source_word: Φαρισαῖοι
  choice: فريسيون
  rationale: التسمية العربية التاريخية المعروفة لهذه الجماعة اليهودية.
- source_word: γραμματεῖς
  choice: كتبة
  rationale: المقابل العربي المألوف، مع إمكان أن يدل السياق على المختصين بالشريعة؛ أُثبت هذا المعنى في الحاشية.
- source_word: καὶ
  choice: و
  rationale: تحافظ على العطف البسيط بين الجماعتين.
- source_word: λέγοντες
  choice: قائلين
  rationale: تحافظ على الصلة الحالية بين مجيئهم والكلام المباشر الذي يبدأ في العدد التالي.
theological_decisions:
- issue: المضارع التاريخي في προσέρχονται
  choice: 'نقله بالماضي العربي: «جاء»'
  alternative: «يأتي» أو «يجيء»
  rationale: المضارع التاريخي اليوناني يضفي حيوية على السرد، لكن الماضي هو الصيغة الطبيعية غير الملتبسة في السرد العربي، ولا يغير ترتيب الحدث أو مضمونه.
- issue: دلالة γραμματεῖς
  choice: «كتبة» في المتن
  alternative: «علماء الشريعة» أو «معلمو الشريعة»
  rationale: «كتبة» تحافظ على اللفظ التاريخي التقليدي، بينما توضّح الحاشية وظيفتهم المحتملة من غير حصر المصطلح في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. قُدّم الفاعل ثم ذُكر مصدره في تركيب طبيعي، وحُفظت «قائلين» لربط العدد بالسؤال الآتي.
