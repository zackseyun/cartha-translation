  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: ar
  text: 'يا مُراؤون، لقد أحسن إشعياء حين تنبأ عنكم قائلًا:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: يا مُراؤون
  rationale: اسم جمع في صيغة النداء المباشر، ويحمل توبيخًا أخلاقيًا ودينيًا قويًا. وإظهار أداة النداء طبيعي في العربية ويحفظ حدة الخطاب.
- source_word: καλῶς
  choice: أحسن
  rationale: يفيد أن نبوة إشعياء انطبقت عليهم على نحو صائب وملائم؛ وصيغة «أحسن حين...» عربية طبيعية وتحفظ ارتباط الظرف بالفعل من غير حسم زائد لمعناه.
- source_word: ἐπροφήτευσεν
  choice: تنبأ
  rationale: المقابل العربي المباشر المألوف للفعل، ويحفظ السجل النبوي وصلته بإشعياء.
- source_word: περὶ ὑμῶν
  choice: عنكم
  rationale: ينقل معنى περί مع المضاف إليه بوضوح وإيجاز في العربية المعاصرة.
- source_word: Ἠσαΐας
  choice: إشعياء
  rationale: الصيغة العربية الكتابية الراسخة لاسم النبي.
- source_word: λέγων
  choice: 'قائلًا:'
  rationale: ينقل اسم الفاعل الذي يمهد للاقتباس التالي، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: قوة خطاب يسوع المباشر للكتبة والفريسيين
  choice: يا مُراؤون
  alternative: يا متظاهرون
  rationale: اللفظ اليوناني اتهام صريح بالرياء في هذا السياق؛ أما «متظاهرون» فتخفف قوة التوبيخ ولا تؤدي دلالته الأخلاقية والدينية كاملة.
- issue: دلالة καλῶς في وصف نبوة إشعياء
  choice: لقد أحسن إشعياء حين تنبأ عنكم
  alternative: لقد تنبأ إشعياء عنكم بالصواب
  rationale: الصياغة المختارة تبقي المجال الدلالي بين جودة القول وصحة انطباقه، بدل قصره على معنى الدقة وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حافظت الصياغة على النداء الحاد وعلى التمهيد الرسمي للاقتباس، مع استعمال «لقد» لتوكيد الحكم كما يقتضيه السياق البلاغي.
