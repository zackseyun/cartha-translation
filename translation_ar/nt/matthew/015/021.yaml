  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: ar
  text: وخرج يسوع من هناك وانسحب إلى منطقة صور وصيدا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انصرف إلى منطقة صور وصيدا». يمكن ترجمة اليونانية بصياغة أكثر حيادًا، لكن «انسحب» تعكس استعمال متى المتكرر لهذا الفعل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ثم
  rationale: أداة ربط سردية تصل الحدث بما قبله، و«ثم» طبيعية في العربية هنا وتوضح تعاقب الحركة من غير إضافة دلالة لاهوتية.
- source_word: ἐξελθὼν
  choice: خرج
  rationale: اسم فعل ماضٍ يدل على حركة تسبق الفعل الرئيس؛ تصوغه العربية فعلًا معطوفًا بوضوح وطبيعية.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: ينقل دلالة مغادرة الموضع السابق بصياغة عربية موجزة ومألوفة.
- source_word: ἀνεχώρησεν
  choice: انسحب
  rationale: يحفظ الإيحاء المتكرر في استعمال متى بالفعل، أي الابتعاد أو الانصراف، من غير أن يبالغ إلى معنى الفرار أو يحدد الدافع.
- source_word: εἰς τὰ μέρη
  choice: إلى نواحي
  rationale: يفيد التوجه إلى المنطقة أو الجهات المحيطة، ولا يقتضي بالضرورة دخول المدينتين نفسيهما.
- source_word: Τύρου καὶ Σιδῶνος
  choice: صور وصيدا
  rationale: الاسمان العربيان المألوفان للمدينتين، وهما مضاف إليهما يحددان النواحي المقصودة.
theological_decisions:
- issue: دلالة حركة يسوع نحو منطقة مرتبطة بالأمم
  choice: ترجمة ἀνεχώρησεν بـ«انسحب» من غير التصريح بسبب الحركة.
  alternative: «انصرف» أو «غادر» بصياغة أكثر حيادًا، أو «تراجع» بصياغة أقوى.
  rationale: قد يوحي استعمال متى بابتعاد مقصود، لكن الآية لا تذكر الدافع؛ لذلك تحفظ الصياغة الإيحاء السردي من غير أن تستورد تفسيرًا نفسيًا أو لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «نواحي» للدلالة على الإقليم العام، وحُفظ الفرق بين الخروج أولًا ثم الانسحاب إلى المنطقة.
