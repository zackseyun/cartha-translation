  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: ar
  text: ألا تفهمون أن كل ما يدخل الفم يمضي إلى المعدة، ويُطرَح في المِرحاض؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل ما يدخل الفم... يُطرَح في موضع قضاء الحاجة/مرفق تصريف الفضلات».'
    reason: بديل معجمي للفظ ἀφεδρών، الذي يدل على المرحاض أو موضع قضاء الحاجة، وقد يُفهم أيضًا في سياق مرفق تصريف الفضلات.
lexical_decisions:
- source_word: νοεῖτε
  choice: تفهمون
  rationale: يدل الفعل هنا على إدراك المقصود ذهنيًا، وصيغة «ألا تفهمون» تنقل السؤال التوبيخي بوضوح وطبيعية.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: كل ما يدخل
  rationale: ينقل التركيب الاسمي العام المحايد، ويشير إلى أي شيء يدخل في سياق الأكل.
- source_word: εἰς τὸ στόμα
  choice: الفم
  rationale: مع الفعل «يدخل» تؤدي العربية الطبيعية معنى الحركة إلى داخل الفم من غير حاجة إلى تكرار حرف الجر.
- source_word: κοιλίαν
  choice: المعدة
  rationale: السياق الهضمي يحدد المعنى، و«المعدة» أدق وأوضح للقارئ المعاصر من «البطن».
- source_word: χωρεῖ
  choice: يمضي إلى
  rationale: يصف انتقال الطعام إلى المعدة، ويحافظ «يمضي إلى» على حركة الفعل من دون صياغة حرفية ثقيلة.
- source_word: ἀφεδρῶνα
  choice: المِرحاض
  rationale: يدل اللفظ على موضع قضاء الحاجة أو تصريف الفضلات؛ و«المِرحاض» فصيحة واضحة ومحترمة، مع إثبات البدائل في الحاشية.
- source_word: ἐκβάλλεται
  choice: يُطرَح
  rationale: ينقل المبني للمجهول وفكرة إخراج الفضلات، بعبارة موجزة غير مبتذلة.
theological_decisions:
- issue: صلة قول يسوع بأحكام الطهارة الشعائرية
  choice: تُرجمت العبارة بوصفها وصفًا مباشرًا لعملية الهضم والإخراج، من غير إضافة تصريح بإباحة جميع الأطعمة.
  alternative: إضافة تفسير يفيد أن جميع الأطعمة قد أُعلنت طاهرة.
  rationale: الآية نفسها تعرض الحجة الجسدية ولا تتضمن التعليق التفسيري الوارد في مرقس 7:19؛ لذلك تُحفظ حدود النص وتوتره اللاهوتي من غير توسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «المِرحاض» بدل تعبير عامي أو خشن، وحُفظ إيقاع السؤال التوبيخي وصورة الانتقال الجسدي الواردة في الأصل.
