  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: ar
  text: فأخذ الأرغفة السبعة والسمك، وبعدما قدَّم الشكر كسرها، وظلّ يناول التلاميذ، وظلّ التلاميذ يناولون الجموع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: فأخذ
  rationale: ينقل فعل الأخذ في تسلسل السرد بصورة طبيعية، والفاء تربط الفعل بما سبقه في السياق.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: الأرغفة السبعة
  rationale: يشير ἄρτος هنا إلى أرغفة معدودة، لا إلى الخبز بوصفه مادة عامة.
- source_word: τοὺς ἰχθύας
  choice: السمك
  rationale: «السمك» اسم جنس جمعي طبيعي في العربية، ويؤدي معنى صيغة الجمع اليونانية في هذا السياق.
- source_word: εὐχαριστήσας
  choice: بعدما قدَّم الشكر
  rationale: يعبر عن سبق الشكر لفعل الكسر، ويحافظ على عدم ذكر متلقّي الشكر صراحةً، كما في اليونانية.
- source_word: ἔκλασεν
  choice: كسرها
  rationale: يفيد كسر الطعام تمهيدًا لتوزيعه. أُضيف الضمير الذي يفهم من السياق لتستقيم العبارة العربية.
- source_word: ἐδίδου
  choice: أخذ يناولها
  rationale: ينقل دلالة الماضي الناقص على الفعل المستمر أو المتكرر أثناء التوزيع، و«يناول» أنسب من «يعطي» في نقل الطعام من يد إلى يد.
- source_word: τοῖς μαθηταῖς
  choice: للتلاميذ
  rationale: يحافظ على أداة التعريف ولا يضيف ضمير الملكية غير المذكور صراحةً في النص.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: والتلاميذ يناولونها للجموع
  rationale: يُصرَّح بالفعل المحذوف في العبارة اليونانية اعتمادًا على الفعل السابق كي تكون العربية واضحة، مع إبقاء «الجموع» بصيغة الجمع.
theological_decisions:
- issue: الإيحاء الإفخارستي المحتمل في εὐχαριστήσας
  choice: ترجمة الفعل بوصفه تقديمًا للشكر من غير توسع طقسي
  alternative: استعمال تعبير ليتورجي يبرز دلالة إفخارستية
  rationale: قد تحمل صياغة الرواية صدىً لنصوص العشاء الرباني، لكن الآية نفسها تصف تقديم الشكر على الطعام؛ لذلك لا تُضاف إليها دلالة أسرارية لا يصرح بها النص.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. حافظت الصياغة على تسلسل الأفعال، ونقلت استمرارية التوزيع بعبارة «أخذ يناولها»، وتجنبت إضافة «لله» لأن متلقّي الشكر غير مذكور صراحةً في اليونانية.
