id: MAT.15.33
reference: Matthew 15:33
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: ar
  text: 'فقال له التلاميذ: «من أين لنا في هذا المكان المقفر[a] كلُّ هذا الخبز[b] حتى نُشبع[c] هذا الجمع الكبير؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في البرية» أو «في مكان خالٍ».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «أرغفة بهذا العدد». واستُعمل «الخبز» هنا اسمًا جمعيًّا طبيعيًّا في العربية.'
    reason: lexical_alternative
  - marker: c
    text: أو «نطعم حتى الشبع»؛ فالفعل اليوناني يعني الإطعام إلى حد الامتلاء أو الشبع.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: فقال
  rationale: المضارع التاريخي اليوناني يُنقل طبيعيًّا بالماضي في السرد العربي، وأُضيفت الفاء لربط القول بسياقه السردي.
- source_word: οἱ μαθηταί
  choice: التلاميذ
  rationale: أداة التعريف تشير إلى جماعة معروفة من السياق، ولا حاجة إلى إضافة «تلاميذه» لأنها غير مصرح بها في النص.
- source_word: Πόθεν ἡμῖν
  choice: من أين لنا
  rationale: يحافظ هذا التعبير العربي الطبيعي على سؤال المصدر وعلى دلالة ضمير المتكلمين في صيغة المجرور غير المباشر.
- source_word: ἐν ἐρημίᾳ
  choice: في هذا المكان المقفر
  rationale: تدل الكلمة على موضع خالٍ أو غير مأهول، و«المكان المقفر» واضح وطبيعي، مع إضافة اسم الإشارة الذي يقتضيه المقام.
- source_word: ἄρτοι τοσοῦτοι
  choice: كل هذا الخبز
  rationale: الأصل حرفيًّا «أرغفة بهذا العدد»، لكن «كل هذا الخبز» يؤدي معنى الكثرة بصياغة عربية طبيعية مع استعمال الخبز اسمًا جمعيًّا.
- source_word: ὥστε
  choice: حتى
  rationale: مع المصدر اليوناني تفيد بلوغ النتيجة أو الغاية، و«حتى» تنقل هذا الارتباط من غير حسم زائد بين الغاية والنتيجة.
- source_word: χορτάσαι
  choice: نُشبع
  rationale: الفعل يدل على الإطعام إلى حد الشبع، ولذلك فـ«نُشبع» أدق من مجرد «نطعم».
- source_word: ὄχλον τοσοῦτον
  choice: هذا الجمع الكبير
  rationale: ينقل «الجمع» معنى الحشد، ويحفظ الوصف مع اسم الإشارة دلالة τοσοῦτον على عِظم عدده.
theological_decisions: []
