  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: ar
  text: 'فأجابهم وقال: «لماذا تتعدّون أنتم أيضًا وصية الله بسبب تقليدكم؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: فأجابهم وقال
  rationale: يحفظ عنصري التعبير اليوناني المتأثر بالأسلوب السامي، مع صياغة عربية طبيعية واضحة.
- source_word: Διὰ τί
  choice: لماذا
  rationale: أوضح مقابل عربي معاصر للاستفهام عن السبب.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: يحفظ المقابلة مع اتهام الكتبة والفريسيين السابق، من غير إضافة توكيد زائد.
- source_word: παραβαίνετε
  choice: تتعدّون
  rationale: ينقل معنى تجاوز الوصية وانتهاكها، ويحافظ على النبرة الكتابية مع بقائه مفهومًا.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: وصية الله
  rationale: صياغة عربية موجزة تحفظ السجل الكتابي والتباين بين سلطان الله والتقليد البشري.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: بسبب تقليدكم
  rationale: διά مع المنصوب تفيد هنا السبب؛ و«تقليدكم» يحفظ دلالة ما تسلّمه الناس وتناقلوه من غير توسيع النقد ليشمل كل تقليد.
theological_decisions:
- issue: التباين بين وصية الله والتقليد البشري
  choice: وصية الله ... تقليدكم
  alternative: أمر الله ... عادتكم
  rationale: يحفظ الاختيار التباين المباشر في النص بين الوصية الإلهية والتقليد المنسوب إلى المخاطَبين، من غير أن يوحي بإدانة جميع التقاليد على إطلاقها.
- issue: دلالة διὰ τὴν παράδοσιν ὑμῶν
  choice: بسبب تقليدكم
  alternative: من أجل تقليدكم
  rationale: السياق يسمح بتعبير سببي واضح. «بسبب» لا يحسم أن المقصود غاية مقصودة، بل يبين أن التقليد هو الأساس أو الدافع الذي أدى إلى التعدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «تتعدّون» بدل تعبير قانوني أثقل مثل «تنتهكون»، و«تقليدكم» بدل «تراثكم» للمحافظة على المقابلة الاصطلاحية في السياق.
