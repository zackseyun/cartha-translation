  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: ar
  text: وكان عدد الذين أكلوا أربعةَ آلافِ رجلٍ، دونَ النساء والأطفال.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: من غير احتساب النساء والأطفال.'
    reason: بديل معجمي يصرّح بأن النساء والأطفال لم يدخلوا في عدد الأربعة آلاف.
lexical_decisions:
- source_word: οἱ δὲ
  choice: وكان الذين
  rationale: نُقلت δέ بوصل خفيف بالواو من غير إضفاء معنى زمني أو تقابل قوي، ونُقل التركيب الاسمي ذو اسم الفاعل بصيغة «الذين».
- source_word: ἐσθίοντες
  choice: أكلوا
  rationale: مع أن الصيغة اليونانية اسم فاعل مضارع، فالسياق يشير إلى من فرغوا من تناول الطعام؛ والماضي هو التعبير العربي الطبيعي هنا.
- source_word: ἦσαν
  choice: كان
  rationale: نُقل فعل الكينونة مباشرة ضمن تركيب العد العربي.
- source_word: τετρακισχίλιοι
  choice: أربعة آلاف
  rationale: نقل مباشر للعدد.
- source_word: ἄνδρες
  choice: رجل
  rationale: اللفظة اليونانية تحدد الذكور الرجال، ولا تعني الناس عمومًا؛ وجاء المفرد «رجل» تمييزًا للعدد في العربية.
- source_word: χωρὶς
  choice: فضلًا عن
  rationale: تفيد هنا أن النساء والأطفال غير داخلين في عدد الأربعة آلاف، مع كونهم حاضرين إضافةً إليهم.
- source_word: γυναικῶν
  choice: النساء
  rationale: المعنى العام «النساء» أنسب من قصر اللفظة على الزوجات.
- source_word: καὶ παιδίων
  choice: والأطفال
  rationale: نقل واضح عام لا يحصر المرجع في سن أدق مما يقتضيه السياق.
theological_decisions:
- issue: صيغة الإحصاء المحددة بحسب الجنس
  choice: الإبقاء على «رجل» مع ذكر النساء والأطفال بوصفهم غير داخلين في العدد المذكور.
  alternative: استعمال «شخص» أو «إنسان» على نحو يشمل الجميع.
  rationale: النص اليوناني يذكر ἄνδρες، أي الرجال تحديدًا، ثم يفصل النساء والأطفال؛ وتعميم العبارة إلى «أشخاص» يمحو هذا التفريق المعجمي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «فضلًا عن» في المتن لسلاستها، مع توضيح معنى الاستثناء العددي في الحاشية. وُضع مؤشر الحاشية بعد العبارة التي يفسرها.
