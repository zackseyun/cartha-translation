base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: ar
  text: أَمَّا مَا يَخْرُجُ مِنَ الْفَمِ فَمِنَ الْقَلْبِ يَصْدُرُ، وَذَلِكَ يُنَجِّسُ الْإِنْسَانَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجعل الإنسان نجسًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: ما يخرج
  rationale: اسم الموصول «ما» مع الفعل يصوغان في العربية تعبيرًا طبيعيًا يشمل الأشياء أو الأقوال الخارجة، مع بقاء المرجع عامًا كما في اسم الفاعل اليوناني المحايد المستعمل استعمال الاسم.
- source_word: στόματος
  choice: الفم
  rationale: ترجمة مباشرة تحفظ الصورة الجسدية وسياق الكلام.
- source_word: καρδίας
  choice: القلب
  rationale: تحفظ اللفظة الكتابية الدالة هنا على باطن الإنسان، بما فيه الفكر والقصد الأخلاقي، من غير اختزالها في العاطفة.
- source_word: ἐξέρχεται
  choice: يصدر
  rationale: يفيد المنشأ بوضوح، ويجنب التكرار الثقيل لعبارة «يخرج... يخرج» مع الحفاظ على حركة المعنى من القلب إلى الخارج.
- source_word: κἀκεῖνα
  choice: وذلك
  rationale: إحالة عربية طبيعية إلى مجموع ما يخرج من الفم؛ والإفراد يتوافق مع «ما» العربية ذات الإحالة الجمعية في المعنى.
- source_word: κοινοῖ
  choice: يُنَجِّس
  rationale: في سياق الطهارة والنجاسة يدل الفعل على جعل الإنسان نجسًا أو مدنسًا؛ و«ينجس» يحفظ صلته المباشرة بهذا السياق.
- source_word: ἄνθρωπον
  choice: الإنسان
  rationale: اللفظ اليوناني مفرد تمثيلي عام. و«الإنسان» يحفظ المفرد والتعريف والدلالة البشرية العامة طبيعيًا في العربية من غير قصرها على الذكر.
theological_decisions:
- issue: مصدر النجاسة الأخلاقية
  choice: ما ينجس الإنسان يصدر من القلب ويظهر في ما يخرج من الفم.
  alternative: حصر المعنى في نجاسة طقسية تنشأ من الكلام وحده.
  rationale: السياق يقابل ما يدخل الفم بما يخرج منه، ويرد الأخير إلى القلب؛ فتحفظ الصياغة التوتر بين لغة الطهارة ودلالة الباطن الأخلاقية من غير توسيع أو تضييق.
- issue: دلالة ἄνθρωπον العامة
  choice: الإنسان
  alternative: الرجل
  rationale: المفرد اليوناني مذكر من جهة الصيغة، لكنه تمثيلي عام هنا. العربية الفصحى تعبّر طبيعيًا عن هذا العموم بـ«الإنسان»، مع حفظ المفرد المعرف.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على صورتي الفم والقلب وعلى مفردات النجاسة في السياق، مع ترتيب عربي طبيعي وإيقاع موجز.
