  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ar
  text: 'لأن الله قال: «أكرم أباك وأمك»، وقال أيضًا: «من يشتم أباه أو أمه، فليمت حتمًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من يلعن أباه أو أمه، فلا بد أن يُقتل».'
    reason: يبين بديلًا ممكنًا لكل من κακολογῶν وصيغة عقوبة الموت θανάτῳ τελευτάτω.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: لأن الله
  rationale: تفيد γάρ التعليل، و«لأن الله» تربط القول بحجة يسوع ربطًا طبيعيًا من غير إضافة توكيد غير مصرح به.
- source_word: εἶπεν
  choice: قال
  rationale: الفعل يقدّم اقتباسًا كتابيًا، و«قال» يحفظ معناه المباشر من غير تحويله إلى «أمر» رغم أن الاقتباس يتضمن أمرًا.
- source_word: Τίμα
  choice: أكرم
  rationale: ينقل فعل τιμάω معنى منح الوالدين ما يليق بهما من كرامة، وهو أقوى وأدق هنا من مجرد «احترم».
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: أباك وأمك
  rationale: صيغة المخاطب طبيعية في العربية ومفهومة من نص الوصية المقتبس.
- source_word: Ὁ κακολογῶν
  choice: من يشتم
  rationale: يفيد κακολογέω الإساءة بالقول، بما يشمل الشتم واللعن؛ و«من يشتم» واضحة وطبيعية وتحافظ على كون الفعل قوليًا.
- source_word: πατέρα ἢ μητέρα
  choice: أباه أو أمه
  rationale: تحتاج العربية في هذا السياق إلى ضمير يوضح علاقة الوالدين بالشخص المذكور، من غير تغيير المقصود العام.
- source_word: θανάτῳ τελευτάτω
  choice: فليمت حتمًا
  rationale: تحافظ العبارة على صيغة عقوبة الموت المشددة وعلى عدم تصريح اليونانية هنا بالجهة المنفذة، بخلاف «فليُقتل» التي تجعل الفعل مبنيًا للمجهول وتبرز التنفيذ البشري.
theological_decisions:
- issue: صياغة عقوبة الموت في الاقتباس التشريعي
  choice: فليمت حتمًا
  alternative: فلا بد أن يُقتل
  rationale: تنقل الصياغة المختارة شدة الحكم وصيغته القانونية، مع إبقاء عدم التصريح بالفاعل أو بجهة التنفيذ كما في θανάτῳ τελευτάτω.
- issue: مدى معنى κακολογῶν
  choice: من يشتم
  alternative: من يلعن
  rationale: «يشتم» تنقل الإساءة اللفظية الواسعة، بينما «يلعن» قراءة ممكنة لكنها أضيق وقد توحي تحديدًا باستدعاء اللعنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وقال أيضًا» لربط الاقتباسين طبيعيًا في العربية، مع إبقاء التعليل في أول الآية وصيغة الحكم القانونية الصارمة.
