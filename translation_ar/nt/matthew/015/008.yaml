  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: ar
  text: هَذَا الشَّعْبُ يُكْرِمُنِي بِشِفَاهِهِمْ، أَمَّا قَلْبُهُمْ فَبَعِيدٌ عَنِّي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قلوبهم». جاء «القلب» في اليونانية مفردًا، ويُرجَّح أنه مستعمل استعمالًا جمعيًّا للدلالة على الشعب كله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: هذا الشعب
  rationale: يحفظ معنى الجماعة في λαός وقوة اسم الإشارة οὗτος، ويلائم صدى الاقتباس النبوي.
- source_word: τοῖς χείλεσίν
  choice: بشفتيه
  rationale: الباء تؤدي معنى الأداة في صيغة المجرور اليونانية، وتحفظ الصورة الجسدية الملموسة بدل تجريدها إلى الكلام.
- source_word: με
  choice: ني
  rationale: ضمير المفعول به المباشر للفعل، وقد أُلحق بالفعل على نحو طبيعي في العربية.
- source_word: τιμᾷ
  choice: يكرمني
  rationale: يؤدي معنى إظهار الإكرام دون المبالغة إلى معنى التمجيد.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: أما قلبهم
  rationale: تحفظ «قلب» مفردةً كما في اليونانية، بوصفها مفردًا جمعيًّا يشير إلى باطن الشعب، وتؤدي «أما» المقابلة التي تفيدها δέ.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: فبعيد عني
  rationale: صياغة عربية طبيعية تنقل معنى البعد المكاني المجازي والعلاقة المنفصلة، مع جملة اسمية موجزة.
theological_decisions:
- issue: المفرد الجمعي «القلب» في مقابل الجمع التوزيعي
  choice: 'الإبقاء على المفرد: «قلبهم»'
  alternative: قلوبهم
  rationale: النص اليوناني يستعمل καρδία بالمفرد، ويرجح أنه يصور الشعب جماعةً ذات موقف باطني واحد. إبقاء المفرد يحفظ القوة البلاغية ولا يحسمها إلى قراءة توزيعية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل المفرد الجمعي «شفتيه» موافقةً لمرجع «هذا الشعب»، مع إبقاء «قلبهم» كما في بنية الأصل اليوناني. وُضع مؤشر الحاشية بعد الجملة التي تتعلق بها.
