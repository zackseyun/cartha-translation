lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: جاءت إليه
  rationale: تعبير عربي طبيعي ينقل معنى الاقتراب والمجيء إلى يسوع في سياق الحركة السردية.
- source_word: ὄχλοι πολλοὶ
  choice: جموع كثيرة
  rationale: يحفظ صيغة الجمع ومعنى الكثرة بعبارة عربية واضحة ومألوفة.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: ومعهم
  rationale: ينقل معنى «كان معهم» بإيجاز طبيعي، ويفهم من السياق أنهم أحضروهم.
- source_word: κωφούς
  choice: خُرس
  rationale: يمكن أن تدل الكلمة اليونانية على فاقدي السمع أو النطق أو كليهما؛ اختير معنى الخرس في المتن مع إثبات البديل في الحاشية حفظًا للغموض المعجمي.
- source_word: τυφλούς
  choice: عمي
  rationale: المقابل العربي المباشر والمألوف للكلمة في قائمة حالات الشفاء.
- source_word: χωλούς
  choice: عُرج
  rationale: ترجمة موجزة ودقيقة لمن يعانون عجزًا في المشي.
- source_word: κυλλούς
  choice: ذوو أطراف معاقة
  rationale: تعبير واضح ومحترم يشمل من كانت أطرافهم مشوهة أو مصابة أو عاجزة، من غير استعمال وصف قد يبدو جارحًا في العربية المعاصرة.
- source_word: ἑτέρους πολλούς
  choice: كثيرون غيرهم
  rationale: ينقل بوضوح وجود أشخاص كثيرين آخرين غير الفئات المذكورة.
- source_word: ἔρριψαν
  choice: وضعوهم
  rationale: الفعل قد يعني حرفيًا الطرح أو الإلقاء، لكن السياق يسمح بمعنى الوضع؛ وهذه الصياغة لا توحي بقسوة لا يقتضيها النص.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: عند قدميه
  rationale: يحفظ الصورة المكانية بدقة؛ فحرف الجر يدل على القرب أو المحاذاة.
- source_word: ἐθεράπευσεν αὐτούς
  choice: فشفاهم
  rationale: الترجمة العربية المعيارية لفعل الشفاء في هذا السياق، مع الفاء لربط النتيجة بالفعل السابق طبيعيًا.
