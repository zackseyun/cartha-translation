  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: ar
  text: 'حينئذ تقدَّم التلاميذ وقالوا له: «أتعلم أن الفريسيين استاؤوا[a] حين سمعوا هذا الكلام[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «شعروا بالإهانة»؛ وحرفيًّا: «تعثّروا».'
    reason: lexical_alternative
  - marker: b
    text: يشير «هذا الكلام» إلى قول يسوع السابق.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية تربط الحدث بما سبقه، و«حينئذ» رابط سردي عربي واضح وموجز.
- source_word: προσελθόντες
  choice: تقدَّم
  rationale: ينقل معنى اقتراب التلاميذ من يسوع، مع صياغة عربية طبيعية للتركيب الذي يجمع اسم الفاعل اليوناني بالفعل الرئيس.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: يحافظ على التعريف الوارد في اليونانية من غير إضافة ضمير ملكية غير مصرَّح به.
- source_word: λέγουσιν αὐτῷ
  choice: وقالوا له
  rationale: صيغ المضارع التاريخي في اليونانية بالماضي، وهو الأسلوب الطبيعي في السرد العربي.
- source_word: Οἶδας
  choice: أتعلم
  rationale: ترجمة مباشرة للسؤال، من غير إضافة معنى «أتدرك» التفسيري.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيين
  rationale: التسمية العربية المعيارية لهذه الجماعة.
- source_word: ἀκούσαντες τὸν λόγον
  choice: حين سمعوا هذا الكلام
  rationale: «الكلام» مقابل طبيعي لـλόγος في هذا السياق، واسم الإشارة يوضح أن المقصود قول يسوع السابق، كما يقتضيه السياق.
- source_word: ἐσκανδαλίσθησαν
  choice: استاؤوا
  rationale: ينقل رد الفعل السلبي والإحساس بالإساءة في السياق بلغة عربية معاصرة، مع إبقاء الدلالة الحرفية المتعلقة بالعثرة في الحاشية.
theological_decisions:
- issue: دلالة σκανδαλίζω في وصف رد فعل الفريسيين
  choice: استاؤوا
  alternative: عثروا؛ شعروا بالإهانة
  rationale: السياق يصف رد فعلهم السلبي تجاه قول يسوع، ولا يوجب تقرير أنهم سقطوا روحيًا أو ارتدوا. لذلك تجنبت الصياغة التي تحسم دلالة لاهوتية، وأثبتُّ المعنى الحرفي المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على ترتيب الحدث والسؤال المباشر، واستُخدمت صياغة طبيعية من غير توسيع تفسيري أو إضافة ضمير ملكية إلى «التلاميذ».
