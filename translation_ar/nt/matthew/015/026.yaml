  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: ar
  text: 'فأجاب: «ليس من الصواب أخذ خبز الأولاد وطرحه للكلاب الصغيرة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلاب البيت» أو «الجِراء». استُعملت في اليونانية صيغة تصغير، مما قد يوحي بكلاب صغيرة أو منزلية، بدلًا من كلاب الشوارع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: يجمع التعبير العربي الطبيعي بين معنى الاستجابة والقول، من غير محاكاة حرفية ثقيلة للتركيب اليوناني «أجاب قائلًا».
- source_word: καλὸν
  choice: من الصواب
  rationale: يدل اللفظ هنا على ما هو لائق أو مناسب، لا على الحُسن المجرد؛ و«من الصواب» تعبير عربي واضح يحفظ هذا المعنى.
- source_word: λαβεῖν
  choice: أن نأخذ
  rationale: يحفظ المعنى المباشر للفعل وصورة أخذ الخبز، مع استعمال صيغة عربية عامة طبيعية.
- source_word: ἄρτον
  choice: خبز
  rationale: المقابل المباشر الذي يحافظ على الصورة المجازية في القول.
- source_word: τέκνων
  choice: الأولاد
  rationale: لفظ جمع شامل للذكور والإناث في هذا السياق، ويحافظ على علاقة الإضافة في «خبز الأولاد».
- source_word: βαλεῖν
  choice: نطرحه
  rationale: يحفظ حيوية معنى الإلقاء في الفعل اليوناني، ولا يلطّفه إلى «نعطيه».
- source_word: κυναρίοις
  choice: للكلاب الصغيرة
  rationale: ينقل صيغة التصغير اليونانية من غير الجزم بأنها جِراء؛ وقد تشير الصيغة إلى كلاب صغيرة أو منزلية.
theological_decisions:
- issue: الحفاظ على قوة استعارة الأولاد والكلاب من غير إضافة تفسير عرقي أو افتراض نبرة بعينها.
  choice: 'إبقاء الصورة مباشرة: «خبز الأولاد» و«الكلاب الصغيرة».'
  alternative: تفسير أطراف الاستعارة صراحةً داخل المتن، أو تخفيف «نطرحه» إلى «نعطيه».
  rationale: لا يصرّح هذا العدد بهوية أطراف الاستعارة، بل يترك فهمها للسياق؛ لذلك تحافظ الصياغة على التوتر المقصود من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت صيغة المتكلم الجمع «نأخذ... ونطرحه» للتعبير الطبيعي عن المصدرين اليونانيين ذوي الدلالة العامة، ووُضع مؤشر الحاشية عند اللفظ الذي تشرحه.
