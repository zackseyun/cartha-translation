  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «فأكلوا» لوصل الحدث بما قبله، و«ثم» لتوضيح تعاقب الأكل وجمع البقايا من غير تغيير المعنى. وُضعت علامة الحاشية بعد «كبيرة» لأنها تتعلق بدلالة حجم السلال.
