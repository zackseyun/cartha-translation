  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: ar
  text: فأكلوا جميعًا وشبعوا، ثم جمعوا سبع سلال ممتلئة من الكِسَر الباقية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سبع سلال كبيرة ممتلئة». قد تدل الكلمة اليونانية هنا (σπυρίδας) على نوع من السلال أكبر من السلال المذكورة في بعض روايات إطعام الجموع الأخرى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: أكلوا
  rationale: صيغة الماضي من ἐσθίω تعني ببساطة أنهم أكلوا، ولا يذكر اليوناني مفعولًا به.
- source_word: πάντες
  choice: جميعًا
  rationale: تنقل شمول الجمع بصورة عربية طبيعية، أي إنهم أكلوا كلهم.
- source_word: ἐχορτάσθησαν
  choice: شبعوا
  rationale: الفعل يدل هنا على الأكل حتى الامتلاء، و«شبعوا» هي العبارة العربية المباشرة والطبيعية.
- source_word: τὸ περισσεῦον
  choice: التي بقيت
  rationale: اسم الفاعل المعرّف مستعمل استعمال الاسم بمعنى ما بقي أو فاض، وصيغته هنا مرتبطة بالكِسَر في تركيب عربي واضح.
- source_word: κλασμάτων
  choice: الكِسَر
  rationale: يشير إلى قطع الطعام المكسورة الباقية، و«الكِسَر» دقيقة وموجزة.
- source_word: ἦραν
  choice: جمعوا
  rationale: مع أن αἴρω يعني أصلًا أخذ أو رفع، فإن «جمعوا» يعبّر طبيعيًا عن التقاط البقايا في هذا السياق.
- source_word: ἑπτὰ
  choice: سبع
  rationale: نقل مباشر للعدد، مع مراعاة صيغة العدد العربية مع «سلال».
- source_word: σπυρίδας
  choice: سلال كبيرة
  rationale: σπυρίς اسم لنوع من السلال يُفهم غالبًا أنه كبير نسبيًا؛ أُثبتت دلالة الحجم في المتن مع حاشية تبيّن الاحتمال المعجمي.
- source_word: πλήρεις
  choice: ممتلئة
  rationale: صفة خبرية للسلال، ونقلها المباشر «ممتلئة» واضح وطبيعي.
theological_decisions: []
