  source_fidelity: الترجمة تحافظ على ترتيب القائمة وعلى صورة خروج الشرور من القلب، و«افتراءات» مع الحاشية خيار سليم لـ βλασφημίαι في هذا السياق العام. لكن «أفعال زنى» لا تميّز بوضوح μοιχεῖαι، التي تشير تحديدًا إلى الخيانة/الزنى الزوجي، عن πορνεῖαι اللاحقة ذات المجال الأوسع.
