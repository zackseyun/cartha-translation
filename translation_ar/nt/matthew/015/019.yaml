base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: ar
  text: لِأَنَّ مِنَ الْقَلْبِ تَخْرُجُ أَفْكَارٌ شِرِّيرَةٌ، وَجَرَائِمُ قَتْلٍ، وَخِيَانَاتٌ زَوْجِيَّةٌ، وَمُمَارَسَاتٌ جِنْسِيَّةٌ مُحَرَّمَةٌ، وَسَرِقَاتٌ، وَشَهَادَاتُ زُورٍ، وَافْتِرَاءَاتٌ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجاديف». قد تدل الكلمة اليونانية على الافتراء والإساءة إلى الناس، أو على التجديف على الله، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας ἐξέρχονται
  choice: لِأَنَّ مِنَ الْقَلْبِ تَخْرُجُ
  rationale: تنقل «لأن» وظيفة γάρ التفسيرية، وتحفظ «من القلب تخرج» صورة القلب بوصفه مصدر الشرور الداخلية.
- source_word: διαλογισμοὶ πονηροί
  choice: أَفْكَارٌ شِرِّيرَةٌ
  rationale: تعبير عربي واضح يحفظ المعنى الأخلاقي العام من غير حصر اللفظة في التخطيط أو الاستدلال.
- source_word: φόνοι
  choice: جَرَائِمُ قَتْلٍ
  rationale: يميّز القتل الإجرامي المقصود هنا من كل قتل، ويؤدي صيغة الجمع بصورة عربية طبيعية.
- source_word: μοιχεῖαι
  choice: أَفْعَالُ زِنًى
  rationale: يحفظ الجمع ويعبّر بوضوح عن انتهاك رابطة الزواج.
- source_word: πορνεῖαι
  choice: مُمَارَسَاتٌ جِنْسِيَّةٌ مُحَرَّمَةٌ
  rationale: ينقل اتساع اللفظة اليونانية الدالة على صور السلوك الجنسي غير المشروع، مع الحفاظ على الجمع.
- source_word: κλοπαί
  choice: سَرِقَاتٌ
  rationale: مقابل مباشر وطبيعي يحفظ صيغة الجمع في قائمة الرذائل.
- source_word: ψευδομαρτυρίαι
  choice: شَهَادَاتُ زُورٍ
  rationale: تعبير عربي مألوف يحفظ الدلالة القضائية أو الشهادية وصيغة الجمع.
- source_word: βλασφημίαι
  choice: افْتِرَاءَاتٌ
  rationale: يلائم سياق قائمة عامة من الشرور ويؤدي معنى الكلام المؤذي أو التشهيري، مع إبقاء احتمال التجديف في الحاشية.
theological_decisions:
- issue: نطاق دلالة βλασφημίαι في قائمة الرذائل
  choice: افتراءات
  alternative: تجاديف
  rationale: قد تشير اللفظة إلى الإساءة إلى الناس بالقول أو إلى التجديف على الله. ولأن السياق لا يحدد المتعلَّق، اختير المعنى العام الملائم للقائمة، مع حفظ البديل في الحاشية وعدم حسم الغموض لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة القلب وبنية قائمة الرذائل، واستُعملت تراكيب جمع طبيعية بدل ألفاظ قديمة أو ملتبسة. وُضع مؤشر الحاشية بعد «افتراءات» لأنه يخص βλασφημίαι.
