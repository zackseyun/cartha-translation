    rationale: «أفعال زنى» قد تُفهم في العربية فهمًا واسعًا يشمل السلوك الجنسي غير المشروع عمومًا، فيتداخل معناها مع «ممارسات جنسية محرمة». أما μοιχεῖαι فتتعلق على نحو أخص بالخيانة الزوجية.
