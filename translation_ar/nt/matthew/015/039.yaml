id: MAT.15.39
reference: Matthew 15:39
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: ar
  text: وبعد أن صرف الجموع، ركب القارب وجاء إلى نواحي ماغادان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «مجدلة» بدلًا من «ماغادان».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: بعد أن صرف
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا وقع قبل الفعل الرئيس، ويعبّر طبيعيًا عن إرسال الجموع وانصرافهم من غير إضافة معنى غير موجود في اليونانية.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: تعبير عربي فصيح وواضح يحافظ على صيغة الجمع في الأصل.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: ركب القارب
  rationale: هذا هو التعبير العربي الطبيعي للصعود إلى وسيلة نقل بحرية، وينقل الفعل الملموس من غير حرفية ثقيلة.
- source_word: ἦλθεν
  choice: جاء
  rationale: يحافظ على المعنى المعتاد للفعل ἔρχομαι، وهو مناسب في هذا السرد الانتقالي.
- source_word: τὰ ὅρια
  choice: نواحي
  rationale: الجمع اليوناني الذي يعني حرفيًا الحدود يُستعمل هنا للدلالة على المنطقة أو النطاق الجغرافي؛ و«نواحي» يحفظ شيئًا من صورة الجمع مع أداء المعنى المكاني الطبيعي.
- source_word: Μαγαδάν
  choice: ماغادان
  rationale: نقل صوتي لاسم المكان بحسب قراءة نص SBLGNT، بدل إحلال القراءة النصية البديلة محله.
theological_decisions:
- issue: صيغة اسم المكان في خاتمة الآية
  choice: ماغادان
  alternative: مجدلة
  rationale: المسألة نصية وجغرافية لا عقائدية. يتبع المتن قراءة SBLGNT «Μαγαδάν»، مع إثبات القراءة البديلة المعروفة في الحاشية حفاظًا على الشفافية النصية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. وُضع رمز الحاشية بعد اسم المكان الذي تتعلق به القراءة المختلفة، لا بعد «الجموع».
