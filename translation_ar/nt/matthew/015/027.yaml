  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: ar
  text: 'فقالت: «نعم، يا ربّ[b]، فإن حتى الكلاب الصغيرة[a] تأكل من الفتات الذي يسقط من مائدة أسيادها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «الكلاب» أو «كلاب البيت» أو «الجراء». استُعملت في اليونانية صيغة تصغير قد توحي بكلاب منزلية صغيرة.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يُفهم «يا ربّ» أيضًا بمعنى نداء الاحترام «يا سيدي»، لكن الترجمة تُبقي الصياغة المعتادة للفظ اليوناني κύριος في الأناجيل.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: نعم
  rationale: إثبات مباشر وطبيعي، يحفظ موافقة المرأة على الصورة التي طرحها يسوع.
- source_word: κύριε
  choice: يا ربّ
  rationale: يحفظ المدى الدلالي المعتاد للفظ κύριος في مخاطبة يسوع، مع إمكان فهمه أيضًا بوصفه نداء احترام.
- source_word: καὶ γὰρ
  choice: فحتى
  rationale: 'الفاء تؤدي معنى التعليل والربط، و«حتى» تبرز المعنى الإضافي التقووي: إن الكلاب الصغيرة نفسها تنال من الفتات.'
- source_word: κυνάρια
  choice: الكلاب الصغيرة
  rationale: يحفظ صيغة التصغير في اليونانية من غير تحويلها بالضرورة إلى «جراء»، وقد توحي بكلاب منزلية صغيرة.
- source_word: ἐσθίει
  choice: تأكل
  rationale: المعنى المعجمي المباشر، وجاء الفعل مفردًا مؤنثًا على نحو طبيعي مع جمع غير العاقل في العربية.
- source_word: ψιχίων
  choice: الفتات
  rationale: اللفظ العربي المألوف والدقيق لقطع الطعام الصغيرة المتساقطة من المائدة.
- source_word: τῶν πιπτόντων
  choice: الذي يسقط
  rationale: جملة صلة عربية طبيعية تحافظ على دلالة اسم الفاعل اليوناني العامة أو المستمرة.
- source_word: τραπέζης
  choice: مائدة
  rationale: تلائم مشهد الطعام المنزلي، وهي أفصح في هذا السياق من «طاولة».
- source_word: τῶν κυρίων αὐτῶν
  choice: أسيادها
  rationale: تميّز هنا بين κύριος بوصفه نداءً ليسوع وبين اللفظ نفسه الدال على أصحاب الكلاب أو سادتها داخل الصورة.
theological_decisions:
- issue: ترجمة κύριε في خطاب المرأة ليسوع
  choice: يا ربّ
  alternative: يا سيدي
  rationale: «يا ربّ» تحافظ على الاحتمال اللاهوتي في سياق إنجيل متى، من غير أن تلغي إمكان كون النداء تعبيرًا عن الاحترام.
- issue: الحفاظ على قوة التصغير في κυνάρια
  choice: الكلاب الصغيرة
  alternative: الكلاب؛ كلاب البيت؛ الجراء
  rationale: يحفظ هذا الاختيار الفارق المعجمي في الأصل من غير زيادة تلطيف الصورة أو جعلها أشد قسوة مما هي عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «فحتى» لتجنب تركيب تعليلي ثقيل، و«مائدة أسيادها» للحفاظ على صورة البيت والعلاقة بين الكلاب وأصحابها. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما.
