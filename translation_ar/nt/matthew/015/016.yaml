  text: But he said[a], “Are you also still without understanding?”
translation:
  language: ar
  text: 'فقال: «أفأنتم أيضًا لا تزالون بلا فهم؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا استدراكيًا خفيفًا إلى جواب يسوع، والفاء طبيعية في سياق الحوار العربي.
- source_word: ὁ ... εἶπεν
  choice: قال
  rationale: أداة التعريف مستعملة هنا استعمال الضمير وتشير إلى يسوع المعلوم من السياق؛ ولا يلزم إظهار الضمير في العربية لأن صيغة الفعل تدل عليه.
- source_word: Ἀκμὴν
  choice: لا تزالون
  rationale: تفيد الاستمرار إلى هذه اللحظة؛ ونقلها بالفعل «لا تزالون» واضح وطبيعي ويحفظ نبرة العتاب.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: يحفظ الضمير الصريح للتوكيد، وينقل καί بمعنى «أيضًا»، أي إن التلاميذ مشمولون هم كذلك في العتاب.
- source_word: ἀσύνετοί
  choice: بلا فهم
  rationale: يدل اللفظ على انعدام الفهم أو الإدراك في هذا السياق، من غير تشديده إلى إدانة أخلاقية بمعنى «حمقى».
- source_word: ἐστε
  choice: لا تزالون
  rationale: دُمج فعل الكينونة مع دلالة Ἀκμήν الاستمرارية في تركيب عربي طبيعي.
theological_decisions:
- issue: نبرة توبيخ يسوع للتلاميذ
  choice: صياغته سؤالًا مباشرًا عن استمرار افتقارهم إلى الفهم
  alternative: «أما زلتم أنتم أيضًا قليلي الفهم؟» أو «أفأنتم أيضًا حتى الآن غير فاهمين؟»
  rationale: يحفظ النص عتاب يسوع الواضح من غير تغليظه إلى حكم أشد، ويبقي التركيز على قصور الفهم في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم الاستفهام مع الفاء و«أنتم أيضًا» للمحافظة على الالتفات المؤكد، وصيغت دلالة الاستمرار بعبارة عربية مألوفة.
