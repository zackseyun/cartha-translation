  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: ar
  text: «لماذا يخالف تلاميذك تقليد الشيوخ؟ فهم لا يغسلون أيديهم حين يأكلون الخبز[a][b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود ممارسة غسل الأيدي التي كان تقليد الشيوخ يعدّها مطلوبة، لا مجرد مسألة تتعلق بالنظافة العادية.
    reason: cultural_note
  - marker: b
    text: 'أو: «حين يتناولون الطعام». قد تُستعمل كلمة «الخبز» اليونانية أحيانًا للدلالة على الطعام عمومًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: لماذا
  rationale: أداة استفهام طبيعية في العربية لطلب سبب الفعل.
- source_word: παραβαίνουσιν
  choice: يتعدّى
  rationale: ينقل معنى تجاوز ما هو مقرَّر أو مخالفته، ويحافظ على الصلة الدلالية بفكرة التعدّي من غير صياغة قانونية ثقيلة.
- source_word: τὴν παράδοσιν
  choice: تقليد
  rationale: يدل على ما تسلّمته الجماعة وتناقله السابقون، وهو أدق من «عادة» التي قد تضعف سلطته في السياق.
- source_word: τῶν πρεσβυτέρων
  choice: الشيوخ
  rationale: يشير هنا إلى السابقين أو أصحاب السلطة الدينية المرتبطين بالتقليد الموروث، لا إلى كبار السن عمومًا.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: يغسلون أيديهم
  rationale: صياغة عربية مباشرة وطبيعية لفعل غسل جزء من الجسد مع المفعول وضمير الملكية.
- source_word: ὅταν
  choice: حين
  rationale: ينقل الظرف الزمني المتكرر مع الفعل المضارع، والسياق يوضح المعنى الاعتيادي.
- source_word: ἄρτον
  choice: الخبز
  rationale: يحافظ على اللفظ اليوناني الحرفي، مع بيان إمكان استعماله بمعنى الطعام أو الوجبة في الحاشية.
- source_word: ἐσθίωσιν
  choice: يأكلون
  rationale: المضارع العربي مناسب للحدث الاعتيادي الذي تفيده الجملة الزمنية.
theological_decisions:
- issue: طبيعة غسل الأيدي المذكور
  choice: إبقاء النص في إطار الخلاف بشأن تقليد الشيوخ، من غير وصف الغسل في المتن بأنه طقسي أو صحي.
  alternative: التصريح بأنه غسل شعائري، أو تفسيره على أنه نظافة عادية.
  rationale: الآية نفسها تربط المسألة بتقليد الشيوخ، ولا تحسم في عبارتها وحدها الوصف التفسيري الأدق؛ لذلك يُترك التوضيح الثقافي للحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «يتعدّى» لإظهار معنى المخالفة من غير تعبير اصطلاحي ثقيل، وأُبقي «الخبز» في المتن التزامًا بأولوية النص اليوناني، مع البديل الدلالي في الحاشية.
