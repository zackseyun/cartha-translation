  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: ar
  text: ليس ما يدخل الفم هو ما ينجِّس الإنسان[a]، بل ما يخرج من الفم، فهذا هو ما ينجِّس الإنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: يجعل الإنسان غير طاهر. يدل الفعل اليوناني هنا على التنجيس في سياق الطهارة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: ينجِّس
  rationale: ينقل فعل κοινόω في سياق الطهارة بمعنى جعل الإنسان نجسًا، مع إبقاء الصدى الطقسي والأخلاقي دون قصره على الاتساخ الحسي.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ما يدخل الفم
  rationale: صياغة عربية طبيعية لاسم الفاعل المعرّف المستعمل استعمال الاسم، وتحافظ على الصورة الحسية في النص.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ما يخرج من الفم
  rationale: صياغة واضحة ومباشرة تحفظ معنى الخروج وحرف الجر ἐκ.
- source_word: τὸν ἄνθρωπον
  choice: الإنسان
  rationale: لفظ عربي مفرد يؤدي الدلالة العامة الممثِّلة لـἄνθρωπος، ويشمل الإنسان بوجه عام دون الحاجة إلى تعبير ملتبس مثل «الرجل».
- source_word: τοῦτο
  choice: فهذا هو
  rationale: إظهار اسم الإشارة مع ضمير الفصل يحفظ توكيد اليونانية على أن الخارج من الفم هو الذي ينجّس.
- source_word: οὐ ... ἀλλὰ
  choice: ليس ... بل ...
  rationale: يحفظ بنية النفي والاستدراك بعبارة عربية فصيحة وطبيعية.
theological_decisions:
- issue: دلالة الطهارة في κοινόω
  choice: ينجِّس
  alternative: يجعل الإنسان غير طاهر
  rationale: «ينجِّس» يحفظ اتساع الدلالة بين النجاسة الطقسية والأخلاقية، ولا يحصر القول في النظافة المادية أو في الحكم الطقسي وحده.
- issue: القوة العامة للفظ ἄνθρωπον
  choice: الإنسان
  alternative: الرجل
  rationale: مع أن اللفظ اليوناني مفرد، فدلالته هنا عامة وممثِّلة للبشر؛ و«الإنسان» يقابل ذلك طبيعيًا في العربية من غير تغيير المرجع إلى الذكر البالغ على وجه الخصوص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على التوازي بين «يدخل الفم» و«يخرج من الفم»، وعلى التوكيد الذي يحمله اسم الإشارة في الشطر الثاني.
