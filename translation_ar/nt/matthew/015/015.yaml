  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «فأجاب» لـἈποκριθεὶς، والفاء انتقال سردي مناسب لـδέ، و«بطرس»، و«وقال له»، والأمر «اشرح»، و«لنا»، و«هذا المثل». ولا يضيف تفسيرًا عقائديًا أو يضيّق دلالة παραβολή على نحو غير لازم.'
