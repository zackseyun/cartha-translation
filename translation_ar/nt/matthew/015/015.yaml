  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: ar
  text: 'فأجاب بطرس وقال له: «اشرح لنا هذا المثل».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بيّن لنا هذا المثل»، أو: «وضّح لنا هذا المثل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: فأجاب
  rationale: اسم الفاعل الماضي من ἀποκρίνομαι مستعمل استعمالًا معلوم المعنى، و«أجاب» ينقل وظيفته الخطابية بوضوح، مع ربط السياق بالفاء.
- source_word: δὲ
  choice: فـ
  rationale: تفيد أداة الانتقال هنا تطورًا خفيفًا في السرد؛ والفاء طبيعية في العربية لربط جواب بطرس بما سبق، من غير تشديد التباين.
- source_word: ὁ Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الراسخة للاسم الشخصي Πέτρος.
- source_word: εἶπεν αὐτῷ
  choice: وقال له
  rationale: يحافظ على البنية السردية اليونانية «أجاب وقال له» وعلى دلالة ضمير المفعول غير المباشر.
- source_word: Φράσον
  choice: اشرح
  rationale: صيغة أمر من φράζω تدل هنا على الإيضاح أو البيان، و«اشرح» هي العبارة العربية الطبيعية في طلب فهم القول المجازي.
- source_word: ἡμῖν
  choice: لنا
  rationale: ينقل ضمير الجمع في صيغة عربية طبيعية مع فعل الشرح.
- source_word: τὴν παραβολὴν ταύτην
  choice: هذا المثل
  rationale: «المثل» هو المقابل الإنجيلي المألوف لـ παραβολή، و«هذا» يحفظ الإشارة إلى القول السابق مباشرة.
theological_decisions:
- issue: مدى دلالة παραβολή في هذا السياق
  choice: المثل
  alternative: القول المجازي أو الصورة
  rationale: أُبقي المصطلح الإنجيلي المعتاد من دون حصر المقصود في قصة مثلية؛ إذ قد يشير هنا إلى القول التصويري السابق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ التركيب السردي «أجاب... وقال له» لقربه من الأصل، مع استعمال الفاء بدل ترجمة δέ ترجمةً تباينية ثقيلة. وُضع مؤشر الحاشية بعد الجملة التي تتصل بها البدائل.
