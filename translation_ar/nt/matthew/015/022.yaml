source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: ar
  text: 'وإذا بامرأة كنعانية خرجت من تلك النواحي، وكانت تصرخ قائلة: «ارحمني يا رب، يا ابن داود! إن ابنتي تعاني بشدة من تسلّط شيطان عليها[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استحوذ عليها شيطان استحواذًا شديدًا»؛ أو: «يعذّبها شيطان بشدة».'
    reason: يحمل الفعل اليوناني معنى الوقوع تحت فاعلية شيطانية، ولا يحدد وحده بدقة طبيعة هذا التسلط أو مظاهره.
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: تنقل أداة لفت الانتباه والمفاجأة السردية بصياغة عربية فصيحة وطبيعية، بدل حذفها أو استعمال «هوذا» الأشد تقليدية.
- source_word: Χαναναία
  choice: كنعانية
  rationale: يحافظ على وصف متى الصريح وعلى ما يستدعيه من خلفية تاريخية، من غير استبداله بوصف «فينيقية سورية» الوارد في الرواية الموازية.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: من تلك النواحي
  rationale: يفيد الأقاليم أو المناطق المحيطة، ويحافظ على معنى الجمع بصياغة عربية مألوفة.
- source_word: ἐξελθοῦσα
  choice: خرجت
  rationale: يُصاغ اسم الفاعل اليوناني كفعل ماضٍ وفق تسلسل السرد الطبيعي في العربية.
- source_word: ἔκραζεν
  choice: كانت تصرخ
  rationale: يحفظ دلالة الماضي الناقص على الفعل المستمر أو المتكرر.
- source_word: Ἐλέησόν με
  choice: ارحمني
  rationale: ترجمة مباشرة ومألوفة تحفظ الإلحاح ومفردة الرحمة.
- source_word: κύριε
  choice: يا رب
  rationale: يحفظ اللقب الموقر وقوته المحتملة في اقترانه بلقب «ابن داود»، من غير الجزم بمدى فهم المرأة اللاهوتي له.
- source_word: υἱὸς Δαυίδ
  choice: يا ابن داود
  rationale: يحفظ اللقب الداودي بصورته المباشرة ودلالته المسيانية المحتملة.
- source_word: κακῶς
  choice: بشدة
  rationale: ينقل شدة الحالة بوضوح ومن دون تعبير عامي أو مبالغة تفسيرية.
- source_word: δαιμονίζεται
  choice: تحت تسلّط شيطان
  rationale: يبيّن نسبة الحالة إلى فاعلية شيطانية، مع تجنب حصر الفعل اليوناني في تصور تفصيلي واحد لمقدار الاستحواذ أو طبيعته.
theological_decisions:
- issue: دلالة κύριε في خطاب مقترن بلقب مسياني
  choice: يا رب
  alternative: يا سيدي
  rationale: اقتران النداء بـ«يا ابن داود» يرجّح نبرة تتجاوز مجرد المخاطبة المهذبة، لكن الترجمة لا تفترض أن المرأة قدّمت اعترافًا لاهوتيًا مكتملًا.
- issue: مدى التحديد في ترجمة δαιμονίζεται
  choice: تحت تسلّط شيطان
  alternative: استحوذ عليها شيطان / يعذّبها شيطان
  rationale: الفعل يثبت فاعلية شيطانية شديدة، لكنه لا يحدد بدقة في العربية الحديثة الفرق بين التسلط والاستحواذ والتعذيب؛ لذلك اختير تعبير واسع ووُضعت البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعملت «وإذا بـ» لإبراز التحول السردي بصورة طبيعية، وحُفظ استمرار صراخ المرأة، كما وُضع مؤشر الحاشية مباشرة بعد العبارة التي تشرحها.
