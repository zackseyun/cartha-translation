  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: ar
  text: فلا يلزمه البتة أن يكرم أباه[b]. وقد أبطلتم كلمة الله[a] بسبب تقليدكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «وصية الله» بدلًا من «كلمة الله».'
    reason: textual_variant
  - marker: b
    text: يُرجَّح أن «يكرم» هنا يشمل الواجب العملي في إعالة الوالدين، لا مجرد إظهار الاحترام لهما.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: فلا يلزمه البتة
  rationale: النفي المؤكد هنا ينفي الإلزام في سياق الحكم التقليدي المذكور، و«البتة» تحفظ قوة οὐ μή من غير تحويل العبارة إلى مجرد تنبؤ بالمستقبل.
- source_word: τιμήσει
  choice: أن يكرم
  rationale: يحفظ فعل «يكرم» الصلة اللفظية بالوصية المتعلقة بإكرام الوالدين، مع إبقاء ما يتضمنه السياق من إعالة عملية دون حصر المعنى فيها.
- source_word: τὸν πατέρα αὐτοῦ
  choice: أباه
  rationale: النص اليوناني المطبوع يذكر الأب بصيغة المفرد، لذلك لم تُوسَّع العبارة إلى «أباه أو أمه» رغم ورود كليهما في السياق الأوسع.
- source_word: ἠκυρώσατε
  choice: أبطلتم
  rationale: ينقل «أبطلتم» المعنى القوي للفعل ἀκυρόω، أي جعل الشيء باطل المفعول أو عديم النفاذ.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: يتبع هذا الاختيار قراءة SBLGNT، λόγον، مباشرة؛ أما قراءة «وصية الله» فمذكورة في الحاشية بوصفها اختلافًا نصيًا.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: بسبب تقليدكم
  rationale: تعبّر «بسبب» عن الدلالة السببية لـδιά مع حالة النصب، و«تقليدكم» ترجمة واضحة ومباشرة لـπαράδοσιν ὑμῶν.
theological_decisions:
- issue: هل يُصرَّح بأن إكرام الأب يشمل إعالته ماديًا؟
  choice: الإبقاء على «يكرم» في المتن، مع بيان الدلالة العملية المحتملة في الحاشية.
  alternative: ترجمة الفعل بـ«يعيل» أو «يعتني بـ» لإبراز الجانب المادي.
  rationale: الفعل اليوناني هو τιμάω، ودلالته الأساسية «يكرم». والسياق يشير إلى النفقة على الوالدين، لكن إدخالها في المتن يضيّق اللفظ أكثر مما يقتضيه الأصل.
- issue: هل تُسوّى العبارة وفق السياق القريب أو القراءات البديلة؟
  choice: ترجمة «أباه» و«كلمة الله» كما وردتا في نص SBLGNT.
  alternative: «أباه أو أمه» و«وصية الله».
  rationale: اتباع النص اليوناني المعطى يمنع توسيع المفرد من السياق أو إدخال قراءة نصية بديلة في المتن؛ وتُحفظ القراءة المهمة في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة ووقورة. استُخدمت «فلا يلزمه البتة» لنقل النفي المؤكد بوصفه رفعًا للالتزام في هذا السياق، و«وقد» لربط الاتهام التالي بالعبارة السابقة ربطًا طبيعيًا مع الحفاظ على قيمة καὶ.
