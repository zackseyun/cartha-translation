  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: ar
  text: 'أمّا هو فأجاب وقال: «كلُّ غرسٍ[a] لم يغرسه أبي السماوي سيُقتلع من جذوره».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل نبتة لم يغرسها أبي السماوي ستُقتلع من جذورها».'
    reason: بديل معجمي؛ يمكن أن يدل φυτεία على الغرس أو على الشيء المغروس نفسه.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب وقال
  rationale: يحافظ على الفعلين في الصيغة السردية اليونانية المتأثرة بالأسلوب السامي، مع بقاء العبارة طبيعية في العربية.
- source_word: Πᾶσα
  choice: كلُّ
  rationale: تنقل المعنى التوزيعي للمفرد، وتنسجم مع الاسم المفرد بعدها.
- source_word: φυτεία
  choice: غرس
  rationale: يدل اللفظ اليوناني على ما غُرس أو على الغرس نفسه. و«غرس» يحفظ الصورة الزراعية، ويلائم فعل الاقتلاع، كما يتيح بقاء قدر من اتساع الدلالة الأصلية.
- source_word: ἐφύτευσεν
  choice: يغرسه
  rationale: يحفظ الاستعارة الزراعية ويصل لفظيًا ودلاليًا بين «غرس» وفعل الغرس.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: أبي السماوي
  rationale: صياغة عربية موجزة وطبيعية تحفظ ضمير المتكلم ووصف الآب بأنه سماوي.
- source_word: ἐκριζωθήσεται
  choice: سيُقتلع من جذوره
  rationale: ينقل بوضوح صيغة المستقبل المبني للمجهول وصورة النزع من الجذور التي يحملها الفعل اليوناني.
theological_decisions:
- issue: المرجع المقصود من استعارة «كل غرس»
  choice: الإبقاء على الاستعارة من دون تحديد مرجعها
  alternative: كل تعليم؛ كل تقليد؛ كل شخص لم يغرسه الآب
  rationale: لا يصرّح النص اليوناني بما إذا كان الغرس يشير إلى تعاليم أو تقاليد أو أشخاص؛ لذلك تُترك الاستعارة مفتوحة حفظًا للغموض المقصود والتوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حُفظت الصيغة السردية «فأجاب وقال»، واستُبقيت الصورة الزراعية كاملة من الغرس إلى الاقتلاع من الجذور.
