  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «كم رغيفًا عندكم؟» فقالوا: «سبعة، وقليل من السمك الصغير[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ببساطة: «سمك»؛ فالكلمة اليونانية مصوغة بصيغة التصغير، مما قد يشير إلى سمك صغير.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: الفعل في اليونانية مضارع تاريخي، لكن الماضي أنسب للسرد العربي الطبيعي ويحفظ وظيفته القصصية.
- source_word: Πόσους ἄρτους
  choice: كم رغيفًا
  rationale: صيغة ἄρτους معدودة، و«رغيف» هو المقابل العربي الطبيعي للخبز المعدود.
- source_word: ἔχετε
  choice: عندكم
  rationale: تعبير عربي فصيح وطبيعي عن الامتلاك في هذا السؤال.
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: تنقل الفاء تتابع الحوار بسلاسة، ولا تُحمّل δέ معنى استدراكيًا أقوى مما يقتضيه السياق.
- source_word: Ἑπτά
  choice: سبعة
  rationale: نقل مباشر للعدد، والمعدود المفهوم هو الأرغفة.
- source_word: ὀλίγα
  choice: بضع
  rationale: تعبير عربي موجز وطبيعي عن عدد قليل غير محدد، ويلائم جمع المعدود.
- source_word: ἰχθύδια
  choice: سمكات صغيرة
  rationale: يحفظ هذا التعبير دلالة صيغة التصغير اليونانية مع بقاء العبارة واضحة للقارئ المعاصر.
