  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ar
  text: لكنهم يعبدونني باطلًا، إذ يعلِّمون وصايا البشر على أنها تعاليم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يعلِّمون تعاليمَ هي وصايا البشر».'
    reason: صياغة بديلة تعكس الاقتران المقتضب بين «التعاليم» و«وصايا البشر» في التركيب اليوناني.
lexical_decisions:
- source_word: μάτην
  choice: باطلًا
  rationale: ينقل معنى العبادة التي لا تحقق غايتها ولا تنال قبول الله، ويحافظ على نبرة الاقتباس النبوية الموقرة.
- source_word: δὲ
  choice: لكنهم
  rationale: تفيد δέ هنا انتقالًا ذا مقابلة خفيفة في سياق التوبيخ، و«لكن» أنسب لذلك في العربية.
- source_word: σέβονταί με
  choice: يعبدونني
  rationale: الفعل يدل هنا على التعبد والتوقير الموجَّه إلى الله، و«يعبدونني» هو التعبير العربي الطبيعي الدقيق.
- source_word: διδάσκοντες
  choice: إذ يعلِّمون
  rationale: تحافظ «إذ» على صلة اسم الفاعل اليوناني بما قبله، وتبيّن الملابسة من غير حصر الدلالة في الزمن أو السببية وحدها.
- source_word: διδασκαλίας
  choice: تعاليمَ
  rationale: تقابل اللفظة اليونانية بصيغة الجمع وتحافظ على معناها الديني العام من غير تحميلها اصطلاحًا مذهبيًا خاصًا.
- source_word: ἐντάλματα
  choice: وصايا
  rationale: تنقل معنى الأوامر الملزمة وتحافظ على السجل الديني والكتابي للاقتباس.
- source_word: ἀνθρώπων
  choice: بشر
  rationale: «بشر» تؤدي الدلالة الإنسانية العامة في ἀνθρώπων، وتبرز المقابلة الضمنية بين المصدر البشري والمصدر الإلهي من غير إيحاء باختصاص الذكور.
theological_decisions:
- issue: العلاقة النحوية في العبارة διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: يعلِّمون تعاليمَ هي وصايا بشر
  alternative: يعلِّمون وصايا بشرية على أنها تعاليم
  rationale: العبارة اليونانية مقتضبة، ويحتمل تركيبها أن تكون «وصايا بشر» بيانًا لمضمون «تعاليم». يحافظ المتن على هذا التقارب اللفظي، بينما تعرض الحاشية الصياغة التي تُبرز منح الوصايا البشرية منزلة التعاليم الملزمة.
- issue: الدلالة العامة للفظة ἀνθρώπων
  choice: بشر
  alternative: الناس
  rationale: المقصود أصل بشري في مقابل الأصل الإلهي، لا جنس الذكور؛ و«بشر» تنقل هذه المقابلة بوضوح وإيجاز.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع الحفاظ على إيقاع الاقتباس النبوي. استُخدم «باطلًا» بدل تعبيرات عامية أو تفسيرية، واستُعملت «بشر» للدلالة الإنسانية العامة.
