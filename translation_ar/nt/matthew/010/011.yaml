base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: ar
  text: وأيَّ مدينةٍ أو قريةٍ تدخلونها، فتحرَّوا مَن فيها جديرٌ[a]، وأقيموا هناك إلى أن تغادروا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يفيد «جدير» هنا الشخص الملائم أو المستعد لاستقبال الرسل.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «إلى أن تخرجوا». ويُفهم من السياق أن الخروج هو مغادرة المدينة أو القرية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην
  choice: وأيَّ مدينةٍ أو قريةٍ
  rationale: 'تنقل العبارة معنى الشرط النسبي غير المحدد: أيًّا تكن المدينة أو القرية التي يدخلها التلاميذ. ويفهم اتجاه الدخول من الفعل «دخلتم»، فلا حاجة إلى حرف جر زائد في العربية.'
- source_word: εἰσέλθητε
  choice: دخلتم
  rationale: صيغة الماضي العربية طبيعية بعد «أيَّ» في هذا السياق الإرشادي، وتفيد كل حالة دخول محتملة دون الإيحاء بأن الفعل وقع بالفعل.
- source_word: ἐξετάσατε
  choice: فتحرَّوا
  rationale: يفيد الفعل اليوناني الاستقصاء والسؤال بعناية، و«تحرَّوا» عربية واضحة وموجزة تنقل القصد المقصود أفضل من مجرد «اسألوا».
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: فيها عمَّن هو جدير
  rationale: تحافظ الصياغة على السؤال عن شخص داخل البلدة، وعلى الوصف التقييمي «جدير» من غير أن تحسم في المتن طبيعة جدارته.
- source_word: κἀκεῖ μείνατε
  choice: وأقيموا هناك
  rationale: «أقيموا» تلائم سياق المكوث المؤقت لدى مضيف، و«هناك» تحفظ إحالة النص اليوناني من غير إضافة «في بيته» التي لا يصرح بها النص.
- source_word: ἕως ἂν ἐξέλθητε
  choice: إلى أن تغادروا
  rationale: تنقل الغاية الزمنية واحتمال المغادرة المستقبلية بعبارة عربية طبيعية. لم يُذكر مفعول «تغادروا» لأن اليونانية تتركه مفهومًا من السياق.
theological_decisions:
- issue: معنى «جدير» في تعليمات إرسال التلاميذ
  choice: الإبقاء على «جدير» في المتن، مع بيان أن المقصود في السياق على الأرجح شخص ملائم أو مستعد لاستقبال الرسل.
  alternative: فهم الوصف على أنه حكم أوسع على الاستحقاق الأخلاقي للشخص.
  rationale: السياق يتناول العثور على مضيف مناسب للرسل، لكن لفظ ἄξιος يحمل دلالة تقييمية حقيقية؛ لذلك حُفظت في المتن ولم تُستبدل بتفسير يحسم المعنى، ووُضع الإيضاح السياقي في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «تحرَّوا» للدلالة على السؤال المتأني، و«أقيموا» للمكوث المؤقت. أبقت الصياغة على شيء من غموض «هناك» و«جدير» بدل إضافة تفاصيل تفسيرية إلى المتن.
