  to: يكفي التلميذ أن يصير مثل معلّمه، والعبد أن يصير مثل سيّده. إن كانوا قد سمّوا ربَّ البيت بَعْلَزَبُولَ[a]، فكم بالأولى يسمّون أهلَ بيته!
  rationale: أُظهر فعل «يسمّون» في الشطر الأخير، وهو مفهوم من الفعل السابق في اليونانية، لتستقيم الجملة العربية وتبقى دلالة أهل البيت بوصفهم متلقّي التسمية جلية. كما ضُبط نطاق ملاحظة الصيغة البديلة بما يوافق سجل التدقيق الإنجليزي.
  reviewer_model: gpt-5.6-terra
