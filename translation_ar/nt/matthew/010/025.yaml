  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: ar
  text: يكفي التلميذ أن يصير مثل معلّمه، والعبد أن يصير مثل سيّده. إن كانوا قد سمّوا ربَّ البيت بَعْلَزَبُولَ[a]، فكم بالأولى يسمّون أهلَ بيته!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بَعْلَزَبُوب»، وهي صيغة بديلة مألوفة في التقليد الإنجليزي.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: يكفي
  rationale: تؤدي معنى الكفاية بصياغة عربية طبيعية ومباشرة.
- source_word: μαθητῇ
  choice: التلميذ
  rationale: يحفظ معنى التعلّم في علاقة التبعية للمعلّم، وهو أنسب من «الطالب» في هذا السياق الإنجيلي.
- source_word: ἵνα γένηται
  choice: أن يصير
  rationale: يحافظ على دلالة الصيرورة في التركيب اليوناني، ولا يختزلها إلى مجرد المشابهة الساكنة.
- source_word: διδάσκαλος
  choice: معلّمه
  rationale: المقابل العربي الواضح في ثنائية التلميذ والمعلّم.
- source_word: δοῦλος
  choice: العبد
  rationale: يحفظ علاقة الخضوع والملكية التي تبرزها المقابلة مع السيد، بخلاف «الخادم» التي قد تخففها.
- source_word: κύριος
  choice: سيّده
  rationale: السياق هو علاقة العبد بصاحب السلطة عليه، لا استعمال لقب إلهي صريح.
- source_word: οἰκοδεσπότην
  choice: ربَّ البيت
  rationale: تعبير عربي موجز يدل على صاحب البيت والمتسلط على شؤونه، ويحافظ على الصلة بصورة أهل البيت.
- source_word: Βεελζεβοὺλ
  choice: بَعْلَزَبُولَ
  rationale: نقل صوتي للصيغة الواردة في نص SBLGNT، مع إثبات الصيغة التقليدية البديلة في الحاشية.
- source_word: ἐπεκάλεσαν
  choice: سمّوا
  rationale: يفيد هنا إطلاق اسم أو لقب على شخص، وهو أوضح في العربية من «دعوا» المحتملة لمعانٍ أخرى.
- source_word: πόσῳ μᾶλλον
  choice: فكم بالأولى
  rationale: تعبير عربي طبيعي يؤدي حجة الانتقال من الأَوْلى إلى ما هو أشد وقوعًا.
- source_word: οἰκιακοὺς
  choice: أهلَ بيته
  rationale: يشمل المنتمين إلى البيت عمومًا، ولا يقصر المعنى على العبيد أو الخدم.
theological_decisions:
- issue: دلالة κύριος في تشبيه اجتماعي منزلي
  choice: سيّده
  alternative: ربّه
  rationale: المقابلة المباشرة مع «العبد» تجعل معنى السيد البشري هو المتقدم، من غير فرض دلالة لاهوتية لقبية على العبارة.
- issue: دلالة δοῦλος
  choice: العبد
  alternative: الخادم
  rationale: المشهد قائم على تفاوت المكانة والسلطة بين العبد والسيد؛ لذلك يحفظ «العبد» قوة اللفظ اليوناني ولا يلطّفها.
- issue: فاعل «سمّوا» غير المصرح به
  choice: إن كانوا قد سمّوا
  alternative: إن سمّى الناس
  rationale: يحافظ على الفاعل الجمعي غير المحدد في اليونانية ولا يضيف هوية لم يذكرها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة وقورة. أُعيد فعل «أن يصير» في الشطر الثاني لسلامة التركيب ووضوح الموازاة، واستُعمل التعجب في الخاتمة لإظهار قوة العبارة الناقصة الفعل في اليونانية. وُضع مؤشر الحاشية بعد «بعلزبول» لأنه هو اللفظ الذي تتعلق به القراءة البديلة.
