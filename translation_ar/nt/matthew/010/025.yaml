  - severity: low
    issue: الحاشية لا تحدد أن صيغة «بعلزبوب» البديلة مألوفة في التقليد الإنجليزي.
    rationale: هذا هو نطاق الملاحظة في سجل التدقيق الإنجليزي، وتحديده أدق للقارئ العربي.
