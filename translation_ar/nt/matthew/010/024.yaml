base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: ar
  text: لَيْسَ التِّلْمِيذُ أَعْلَى مِنْ مُعَلِّمِهِ، وَلَا الْعَبْدُ أَعْلَى مِنْ سَيِّدِهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «العبد» بـ«الخادم» بحسب السياق؛ فاللفظ اليوناني يُستعمل في سياقات قد تجعل هذه الترجمة مناسبة.
    reason: alternative_reading
lexical_decisions:
- source_word: μαθητής
  choice: التلميذ
  rationale: يحفظ معنى التعلّم الملازم للمعلم واتباعه في سياق الإنجيل، وهو أنسب من «الطالب» ذي الإيحاء الأكاديمي الحديث.
- source_word: ὑπέρ
  choice: أعلى من
  rationale: تفيد ὑπέρ مع المنصوب هنا التفوق في المنزلة أو المرتبة، و«أعلى من» تعبير عربي واضح يحافظ على صورة المقارنة.
- source_word: διδάσκαλος
  choice: المعلّم
  rationale: هو المعنى المباشر للكلمة، ويلائم علاقة التلميذ بمن يعلّمه.
- source_word: δοῦλος
  choice: العبد
  rationale: المقابلة مع κύριος تبرز علاقة الخضوع والملكية الاجتماعية، ولذلك يحفظ «العبد» قوة اللفظ أكثر من «الخادم».
- source_word: κύριος
  choice: السيّد
  rationale: في هذه المقابلة الاجتماعية يدل اللفظ على صاحب السلطة على العبد، لا على لقب إلهي؛ و«السيّد» هو المقابل العربي الطبيعي هنا.
- source_word: αὐτοῦ
  choice: ـه في «سيده»
  rationale: ضمير الملكية يعود إلى العبد، وقد أُدمج طبيعيًا في الاسم العربي.
- source_word: οὐδέ
  choice: ولا
  rationale: تربط المقارنة المنفية الثانية بالأولى بعبارة عربية موجزة وطبيعية.
theological_decisions:
- issue: ترجمة δοῦλος في تشبيه اجتماعي
  choice: العبد
  alternative: الخادم
  rationale: سياق العبد والسيّد يجعل التبعية الاجتماعية القوية بارزة؛ وتُذكر «الخادم» في الحاشية بوصفها احتمالًا معجميًا قد يلائم بعض السياقات.
- issue: ترجمة κύριος في سياق بشري غير لاهوتي
  choice: السيّد
  alternative: الربّ
  rationale: اللفظ هنا طرف في مقابلة اجتماعية مع العبد، ويشير إلى رئيس بشري؛ لذا لا تُستعمل «الربّ» التي قد توحي بلقب إلهي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «التلميذ» للمحافظة على بُعد التعلّم والاتباع، و«سيده» بدل «الربّ» لأن المقارنة هنا اجتماعية بشرية. وُضعت الحاشية بعد الجملة التي تتصل بها، مع إثبات علامتها [a] في المتن.
