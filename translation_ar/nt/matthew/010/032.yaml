  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: ar
  text: فكلُّ من يعترف بي أمام الناس[a]، أعترف أنا أيضًا به[b] أمام أبي الذي في السماوات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «أمام البشر»؛ واللفظ بصيغة جمع مذكّر، لكنه يُستعمل هنا للدلالة العامة على الناس.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية أقرب إلى الحرفية: «أعترف أنا أيضًا فيه» أو «بشأنه»؛ وقد صيغت هنا بحسب الاستعمال العربي الطبيعي: «أعترف به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: فكلُّ من
  rationale: تنقل «فـ» الاستنتاج أو الصلة بما سبق، وتؤدي «كل من» معنى التعبير التعميمي الشامل بصورة عربية طبيعية.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: يعترف بي
  rationale: الفعل هنا يدل على الإقرار العلني بيسوع أو الاعتراف به. واستعمال الباء مع «يعترف» هو التعبير العربي الطبيعي، بدل النقل الحرفي غير المألوف لحرف الجر اليوناني ἐν.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: أمام الناس
  rationale: «أمام» تحفظ معنى الحضور العلني، و«الناس» تؤدي المرجع البشري العام للجمع اليوناني دون حصره في الذكور.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: أعترف أنا أيضًا به
  rationale: تكرار «أعترف» يحفظ التوازي المقصود مع الفعل الأول، و«أنا أيضًا» تنقل توكيد κἀγώ، أما «به» فهي الصياغة العربية الاصطلاحية للعلاقة التي عبّر عنها اليوناني بـἐν αὐτῷ.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: أبي الذي في السماوات
  rationale: تحفظ العبارة الصيغة المتّائية ومجيء οὐρανοῖς في صيغة الجمع، وهي فصيحة وواضحة في العربية الكتابية المعاصرة.
theological_decisions:
- issue: اعتراف الإنسان العلني بيسوع واعتراف يسوع المقابل به
  choice: صيغت الآية بوصفها وعدًا باعتراف متبادل أمام الناس وأمام الآب، من غير تحديد زمن هذا الاعتراف المقابل أو آليته العقائدية.
  alternative: تفسير الاعتراف الثاني صراحةً بوصفه إعلانًا قضائيًا في الدينونة الأخيرة، أو قصره على واقع التلمذة الحاضر.
  rationale: النص يثبت المقابلة والوقوف أمام الآب، لكنه لا يصرّح هنا بالتفاصيل الزمنية أو النسقية؛ لذلك ينبغي إبقاء هذا الاتساع دون حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي بين فعلي «يعترف» و«أعترف»، واستُخدمت «السماوات» مراعاةً لصيغة الجمع في الأصل وللأسلوب المتّائي، مع تجنّب الصياغة الحرفية الملتبسة لحرف الجر اليوناني.
