id: MAT.10.41
reference: Matthew 10:41
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: ar
  text: مَنْ يَقْبَلُ نَبِيًّا بِاسْمِ نَبِيٍّ[a] يَنَالُ أَجْرَ نَبِيٍّ، وَمَنْ يَقْبَلُ بَارًّا بِاسْمِ بَارٍّ[b] يَنَالُ أَجْرَ بَارٍّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكونه نبيًّا» أو «بصفته نبيًّا». واليونانية حرفيًّا: «باسم نبي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكونه بارًّا» أو «بصفته بارًّا». واليونانية حرفيًّا: «باسم بارّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: مَنْ يَقْبَلُ
  rationale: اسم الفاعل المعرّف مستعمل استعمالًا اسميًّا للدلالة العامة. وصيغة «مَن يقبل» عربية طبيعية تحفظ عموم العبارة وقوة الفعل الحاضر.
- source_word: προφήτην
  choice: نَبِيًّا
  rationale: مفعول به مباشر، و«نبي» هو المقابل العربي المألوف الذي يحفظ دلالة الدور من غير شرح زائد.
- source_word: εἰς ὄνομα προφήτου
  choice: بِاسْمِ نَبِيٍّ
  rationale: 'يحفظ هذا التعبير صورة الأصل وتكراره، مع بيان معناه الاحتمالي في الحاشية: لكونه نبيًّا أو بصفته نبيًّا.'
- source_word: μισθὸν προφήτου
  choice: أَجْرَ نَبِيٍّ
  rationale: 'تحفظ الإضافة العربية علاقة المضاف والمضاف إليه وغموضها المشروع: أهو الأجر الذي يناله النبي أم الأجر الموافق لاستقبال النبي.'
- source_word: λήμψεται
  choice: يَنَالُ
  rationale: المضارع العربي في جواب الشرط الموصولي العام يؤدي معنى المستقبل المؤكد بصورة طبيعية، و«ينال» أنسب للأجر من التعبير العام «يأخذ».
- source_word: δίκαιον
  choice: بَارًّا
  rationale: الصفة المذكرة المفردة مستعملة اسميًّا. و«بارّ» لفظ عربي كتابي واضح يدل على الاستقامة أمام الله، ويحفظ صيغة المذكر في الأصل.
- source_word: εἰς ὄνομα δικαίου
  choice: بِاسْمِ بَارٍّ
  rationale: يحافظ على التوازي الدقيق مع الشطر الأول وعلى صيغة الأصل، وتوضح الحاشية المعنى الاصطلاحي المحتمل.
- source_word: μισθὸν δικαίου
  choice: أَجْرَ بَارٍّ
  rationale: إضافة موجزة تحفظ التوازي والغموض الدلالي في تركيب اليونانية من غير حسم زائد.
theological_decisions:
- issue: دلالة εἰς ὄνομα مع المضاف إليه
  choice: إبقاء «باسم» في المتن مع شرح «لكونه... أو بصفته...» في الحاشية.
  alternative: 'ترجمة العبارة مباشرة: «لأنه نبي/بار» أو «بصفته نبيًّا/بارًّا».'
  rationale: تفيد العبارة قبول الشخص على أساس هويته أو صفته المعترف بها. إبقاء صورتها يحفظ التكرار والنسيج اللاهوتي، بينما تمنع الحاشية التباسها بمعنى التصرف بتفويض منه.
- issue: صيغة δίκαιον / δικαίου المذكرة
  choice: «بارًّا / بارٍّ» بصيغة المذكر المفرد.
  alternative: «شخصًا بارًّا».
  rationale: الأصل مذكر مفرد مستعمل استعمالًا اسميًّا، والعربية تستوعب ذلك طبيعيًّا من غير حاجة إلى تعميم تفسيري أو ادعاء حصر المقصود في الرجال.
- issue: غموض μισθὸν προφήτου وμισθὸν δικαίου
  choice: 'الحفاظ على الإضافة: «أجر نبي» و«أجر بار».'
  alternative: «الأجر الذي يناله النبي/البار» أو «أجر استقبال النبي/البار».
  rationale: لا يحدد التركيب صراحة نوع العلاقة التي تفيدها الإضافة، ولذلك لا ينبغي حسمها بتفسير داخل المتن.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «مَن يقبل» بدل تركيب أثقل، وحُفظ التوازي الكامل بين الشطرين. وُضعت علامتا الحاشية مباشرة بعد العبارتين اللتين تشرحانهما.
