  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: ar
  text: مَنْ يَقْبَلُكُمْ يَقْبَلُنِي[a]، وَمَنْ يَقْبَلُنِي يَقْبَلُ الَّذِي أَرْسَلَنِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُرَحِّبُ بِي»؛ فالفعل اليوناني قد يعني القبول أو الاستقبال أو الترحيب، ولا سيما عند استقبال رسول.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: مَنْ يَقْبَلُ
  rationale: اسم الفاعل المضارع المعرّف مستعمل استعمالًا اسميًا ذا دلالة عامة؛ وصيغة «مَنْ يَقْبَلُ» تنقل هذا العموم بصورة طبيعية وواضحة في العربية.
- source_word: δέχομαι / δέχεται
  choice: يَقْبَلُ
  rationale: يحافظ «يَقْبَلُ» على تكرار الفعل المقصود وعلى معناه الواسع، الذي يشمل قبول الرسل والترحيب بهم والاعتراف برسالتهم.
- source_word: ὑμᾶς
  choice: كُمْ
  rationale: ضمير مخاطب جمع يعود إلى تلاميذ يسوع، وقد حافظت العربية على دلالة الجمع الصريحة.
- source_word: ἐμέ
  choice: نِي
  rationale: ضمير المتكلم المفرد في محل المفعول به، ويعود إلى يسوع.
- source_word: τὸν ἀποστείλαντά με
  choice: الَّذِي أَرْسَلَنِي
  rationale: ترجمة طبيعية ودقيقة لاسم الفاعل الماضي المعرّف المستعمل استعمالًا اسميًا، من غير إضافة هوية المُرسِل إلى منطوق النص.
theological_decisions:
- issue: هوية الذي أرسل يسوع
  choice: الَّذِي أَرْسَلَنِي
  alternative: الآب الذي أرسلني
  rationale: يدل السياق ولاهوت متى بقوة على الآب، لكن النص اليوناني يقول حرفيًا «الذي أرسلني»؛ لذلك تُحفظ العبارة دون إدخال «الآب» في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «يَقْبَلُ» بدل «يَسْتَقْبِلُ» للمحافظة على سعة المعنى وعلى التكرار البلاغي الذي يربط قبول التلاميذ بقبول يسوع وقبول مُرسِله.
