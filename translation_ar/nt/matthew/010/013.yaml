reference: Matthew 10:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: ar
  text: وإن كان البيت[a] أهلًا[b]، فليأتِ سلامكم عليه؛ وإن لم يكن أهلًا، فليرجع سلامكم إليكم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل البيت»؛ فقد تشير الكلمة اليونانية إلى المسكن، وبالامتداد إلى الساكنين فيه.
    reason: lexical_alternative
  - marker: b
    text: أي ملائمًا لاستقبال الرسل وسلامهم، لا كاملًا أخلاقيًا أو بلا خطية.
    reason: cultural_note
  - marker: c
    text: أو «فليرتدّ سلامكم إليكم».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: البيت
  rationale: المقابل المباشر للكلمة اليونانية، مع إمكان أن تدل في السياق على أهل البيت أيضًا من غير حصر المعنى فيهم.
- source_word: ἀξία
  choice: أهلًا
  rationale: يحفظ معنى الجدارة أو الملاءمة في السياق، وهو عربي طبيعي، من غير تفسيره بأنه كمال أخلاقي أو مجرد استعداد نفسي للقبول.
- source_word: ἐλθάτω
  choice: فليأتِ
  rationale: ينقل صيغة الأمر ولفظ المجيء مباشرة، ويحافظ على صورة السلام الآتي إلى البيت.
- source_word: εἰρήνη
  choice: سلامكم
  rationale: «السلام» هو المقابل المعتاد، ويترك دلالة البركة والخير المصاحبة للتحية والإرسالية مفهومة من السياق.
- source_word: ἐπ’ αὐτήν
  choice: عليه
  rationale: يحفظ الاتجاه نحو البيت وصورة حلول السلام عليه، مع مراعاة تذكير «البيت» في العربية.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: ينقل المعنى الاتجاهي لحرف الجر، ويأتي طبيعيًا مع فعل الرجوع.
- source_word: ἐπιστραφήτω
  choice: فليرجع
  rationale: صياغة عربية طبيعية تحفظ الأمر ومعنى عودة السلام إلى التلاميذ.
- source_word: μὲν ... δὲ
  choice: وإن ... وإن لم ...
  rationale: ينقل التقابل الشرطي بوضوح وبأسلوب عربي سلس، من غير إثقال العبارة بأدوات مقابلة زائدة.
theological_decisions:
- issue: طبيعة «سلامكم»
  choice: الإبقاء على «سلامكم» بوصفه سلام التلاميذ الذي يأتي على البيت أو يرجع إليهم
  alternative: تحية السلام التي تلقونها؛ أو بركة السلام التي تنطقون بها
  rationale: يعرض النص السلام بصورة محسوسة تكاد تجعله منتقلًا، لكنه لا يحدد آلية لاهوتية لذلك. وتحفظ الصياغة الصورة والتوتر دون اختزال السلام إلى مجرد تحية لفظية أو تحويله إلى قوة آلية.
- issue: معنى أهلية البيت
  choice: «أهلًا» بمعنى ملائم لتلقي الرسل وسلامهم
  alternative: بارًا أخلاقيًا أو خاليًا من الخطية
  rationale: السياق الإرسالي يتناول استقبال الرسل، ولا يقرر أن أهل البيت بلا خطية أو مستحقون أخلاقيًا على نحو مطلق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «فليأتِ» و«فليرجع» للمحافظة على صيغتي الأمر وصورة حركة السلام، مع تجنب ألفاظ طائفية أو تفسيرية زائدة.
