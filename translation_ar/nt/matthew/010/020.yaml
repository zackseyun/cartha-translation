base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: ar
  text: لِأَنَّكُمْ لَسْتُمْ أَنْتُمُ الْمُتَكَلِّمِينَ، بَلْ رُوحُ أَبِيكُمُ هُوَ الْمُتَكَلِّمُ فِيكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم العبارة: «المتكلم من خلالكم». واللفظ اليوناني حرفيًّا «فيكم»، وقد يتضمن معنى أن الكلام يصدر بواسطة التلاميذ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: لِأَنَّ... لَسْتُمْ
  rationale: تنقل «لأن» وظيفة γάρ التعليلية الرابطة بما سبق، ويقع النفي مع الجملة الاسمية بصورة عربية طبيعية.
- source_word: ὑμεῖς
  choice: أَنْتُم
  rationale: إثبات الضمير المنفصل بعد ضمير الخطاب المتصل يحفظ توكيد الضمير الصريح في اليونانية.
- source_word: ἐστε οἱ λαλοῦντες
  choice: لَسْتُمْ أَنْتُمُ الْمُتَكَلِّمِينَ
  rationale: يحفظ التركيب هوية القائمين بالكلام، لا مجرد وقوع فعل الكلام، ويعبّر عن اسم الفاعل الحاضر.
- source_word: ἀλλὰ
  choice: بَلْ
  rationale: «بل» أنسب بعد النفي لإبراز الاستدراك والمقابلة القوية.
- source_word: τὸ πνεῦμα
  choice: رُوحُ
  rationale: السياق يعيّن الروح الإلهي، والإضافة إلى «أبيكم» تغني في العربية عن أي زيادة تفسيرية.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: أَبِيكُم
  rationale: ترجمة مباشرة للإضافة من غير إدخال وصف «السماوي» غير الموجود في الآية.
- source_word: τὸ λαλοῦν
  choice: هُوَ الْمُتَكَلِّمُ
  rationale: الضمير الفاصل يوضح أن اسم الفاعل عائد إلى «روح» لا إلى «أبيكم»، ويحفظ التوكيد والمقابلة في صياغة عربية سليمة.
- source_word: ἐν ὑμῖν
  choice: فِيكُمْ
  rationale: هذا هو المقابل المباشر لـἐν ὑμῖν، ويحفظ احتمال الدلالة على الحضور في التلاميذ مع إمكان فهم الكلام الجاري بواسطتهم.
theological_decisions:
- issue: هل تُترجم ἐν ὑμῖν بدلالة الحضور «فيكم» أم الوساطة «بكم/من خلالكم»؟
  choice: فِيكُمْ
  alternative: بِكُمْ / مِنْ خِلَالِكُمْ
  rationale: المعنى المباشر لحرف الجر ἐν هو «في». وقد يدل السياق على أن الروح يتكلم بواسطة التلاميذ، لكن وضع هذا التفسير في المتن يحسم دلالة أبقاها النص قابلة للأمرين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المتكلمين» بدل «الذين يتكلمون» للمحافظة على تركيز الأصل على هوية المتكلم، وأُثبت الضمير «أنتم» لنقل التوكيد. وُضع مؤشر الحاشية بعد «فيكم» مباشرة.
