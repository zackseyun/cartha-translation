  source_fidelity: 'المتن ينقل البنية الأساسية بأمانة: «لأن» تؤدي وظيفة γάρ التفسيرية، و«لستم أنتم» يحفظ توكيد ὑμεῖς، و«بل» تنقل المقابلة. كما أن «فيكم» ترجمة مباشرة لـἐν ὑμῖν وتحافظ على عدم حسمه إلى معنى الوساطة. وصيغة «روح أبيكم هو المتكلم» تعيّن بوضوح أن الكلام منسوب إلى الروح لا إلى الآب.'
