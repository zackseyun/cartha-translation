lexical_decisions:
- source_word: ὑμῶν
  choice: رُؤُوسِكُمْ
  rationale: الضمير جمع للمخاطبين، وقد صيغت دلالته الملكية طبيعيًّا بإلحاق ضمير الجمع بكلمة «رؤوس».
- source_word: δὲ
  choice: أَمَّا أَنْتُمْ، فَـ
  rationale: ينقل التحول الخطابي والمقابلة الخفيفة مع السياق السابق، مع إبراز المخاطبين كما تسمح به صيغة ὑμῶν المتقدمة في اليونانية.
- source_word: καὶ
  choice: حَتَّى
  rationale: تفيد هنا التوكيد بمعنى «حتى»، إذ تشمل الصورة أدق التفاصيل، وهي شعور الرأس.
- source_word: αἱ τρίχες
  choice: شُعُورُ
  rationale: جمع «شَعْرَة» مناسب للدلالة على الشعرات منفردة ومجتمعة، ويحافظ على الصورة الحسية في الأصل.
- source_word: τῆς κεφαλῆς
  choice: رُؤُوسِكُمْ
  rationale: حُوِّل تركيب الإضافة اليوناني إلى إضافة عربية طبيعية، واستُعمل الجمع لأن الخطاب موجَّه إلى جماعة.
- source_word: πᾶσαι
  choice: كُلُّهَا
  rationale: يحفظ معنى الشمول التام ويعود بوضوح إلى شعور الرؤوس.
- source_word: ἠριθμημέναι εἰσίν
  choice: مَعْدُودَةٌ
  rationale: خبر اسم مفعول ينقل الحالة الناتجة عن فعل سابق، وهو أسلوب عربي موجز وطبيعي يوافق دلالة التام المبني للمجهول.
theological_decisions:
- issue: مدى المعرفة أو العناية الإلهية التي تفيدها العبارة
  choice: 'الإبقاء على الصورة المباشرة: شعور رؤوس المخاطبين كلها معدودة.'
  alternative: التصريح بأن الله يعرف كل شعرة أو يعتني بكل تفصيل من حياتهم.
  rationale: الآية تذكر العدّ دون أن توسع العبارة إلى شرح عقائدي؛ لذا تُترك دلالة المعرفة والعناية الإلهية لتظهر من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «أما أنتم» لإظهار التحول الخطابي، و«حتى» للتوكيد، مع الحفاظ على الصورة الملموسة ودلالة الحالة المستمرة من غير إضافة تفسير لاهوتي.
