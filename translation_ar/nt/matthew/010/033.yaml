  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: ar
  text: ولكن كلُّ من ينكرني أمام الناس، سأنكره أنا أيضًا أمام أبي الذي في السماوات.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: ولكن كلَّ من
  rationale: «ولكن» تُظهر المقابلة مع الآية السابقة، و«كل من» تنقل معنى الموصول العام مع أداة التعميم.
- source_word: ἀρνήσηταί με
  choice: ينكرني
  rationale: ينقل معنى الإنكار العلني أو التنصل، ويحافظ على فعل واحد في شطري الآية.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: أمام الناس
  rationale: تعبير عربي طبيعي يفيد الحضور العلني؛ و«الناس» تنقل الدلالة العامة لـἀνθρώπων من غير حصرها في الذكور.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: سأنكره أنا أيضًا
  rationale: يحافظ على التقابل المباشر والتوكيد الذي تؤديه κἀγώ، مع إبراز الضمير «أنا» في العربية.
- source_word: τοῦ πατρός μου
  choice: أبي
  rationale: ترجمة مباشرة وطبيعية للعبارة البنوية التي يستعملها يسوع.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: الذي في السماوات
  rationale: يحافظ على صيغة الجمع في الأصل اليوناني، وهي فصيحة ومألوفة في العربية الكتابية من غير إخلال بالوضوح.
theological_decisions:
- issue: التقابل في لغة الإنكار
  choice: ينكرني ... سأنكره
  alternative: يتنكر لي ... سأتَنكر له
  rationale: تكرار جذر «نكر» في الطرفين يحفظ التناظر البلاغي واللاهوتي في الأصل من غير إضافة تفسيرية.
- issue: الدلالة العامة لـἀνθρώπων والإحالة المفردة في αὐτόν
  choice: أمام الناس ... سأنكره
  alternative: أمام البشر ... سأنكر ذلك الشخص
  rationale: «الناس» واضحة وعامة في العربية، وضمير المفرد المذكر في «سأنكره» يتبع البنية النحوية لـ«كل من» ولا يقصر الحكم على الرجال.
- issue: صيغة الجمع في «السماوات»
  choice: في السماوات
  alternative: في السماء
  rationale: اختير الجمع موافقةً للنص اليوناني، من غير استنتاج لاهوتي بشأن عدد السماوات.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حافظت الصياغة على المقابلة مع الآية السابقة، وعلى التوازي الصارم بين إنكار الإنسان للمسيح وإنكار المسيح له، مع تجنب الألفاظ الطائفية أو الشروح المضافة.
