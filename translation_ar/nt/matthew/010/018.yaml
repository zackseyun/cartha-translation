id: MAT.10.18
reference: Matthew 10:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: ar
  text: وستُساقون أمام الولاة والملوك بسببي، شهادةً لهم[b] وللأمم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لغير اليهود».'
    reason: lexical_alternative
  - marker: b
    text: يمكن في هذا السياق أن تُفهم «لهم» أيضًا بمعنى «عليهم»، لكن صيغة الضمير اليونانية لا تصرّح بذلك.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: أمام الولاة والملوك
  rationale: تفيد ἐπί مع النصب بعد فعل السوق المثول أمام أصحاب السلطة. و«الولاة» مقابل عربي مألوف لـἡγεμόνας في السياق السياسي، و«الملوك» تقابل βασιλεῖς مباشرة.
- source_word: ἀχθήσεσθε
  choice: ستُساقون
  rationale: الفعل مستقبل مبني للمجهول من ἄγω. و«تُساقون» يحافظ على صورة الاقتياد وعلى الطابع القضائي، من غير أن يضيف عنفًا غير مصرح به كما قد تفعل «تُجرّون».
- source_word: ἕνεκεν ἐμοῦ
  choice: بسببي
  rationale: تفيد العبارة السبب، وهذه الصياغة عربية واضحة ومباشرة وتحافظ على الإحالة الشخصية إلى يسوع.
- source_word: εἰς μαρτύριον
  choice: شهادةً
  rationale: 'تعبّر العبارة هنا عن الغاية أو النتيجة: سيكون مثول التلاميذ شهادة. ويحافظ المنصوب «شهادةً» على الصيغة الاسمية بإيجاز طبيعي.'
- source_word: αὐτοῖς
  choice: لهم
  rationale: يعود الضمير في الأرجح إلى الولاة والملوك. واللام تحافظ على الدلالة المحايدة للمجرور اليوناني، من غير أن تحسم هل الشهادة مقدمة إليهم أم قائمة عليهم.
- source_word: τοῖς ἔθνεσιν
  choice: للأمم
  rationale: يمكن أن تعني ἔθνη «الأمم» أو «غير اليهود». اختيرت «الأمم» لأنها تحافظ على المجال الدلالي الأوسع للنص اليوناني، مع توضيح المعنى البديل في الحاشية.
theological_decisions:
- issue: دلالة μαρτύριον αὐτοῖς
  choice: «شهادةً لهم» بصياغة محايدة
  alternative: «شهادةً عليهم»
  rationale: 'حالة المجرور في αὐτοῖς لا تدل بذاتها صراحة على الخصومة أو الإدانة. لذلك تبقي «لهم» التوتر قائمًا: قد تكون الشهادة موجهة إليهم، وقد تصير في السياق شهادة عليهم بحسب استجابتهم.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المبني للمجهول «ستُساقون» بما يوافق الأصل، وحُفظ الإيجاز والتركيب المتوازن. وُضعت علامتا الحاشيتين في المتن عند اللفظين اللذين تتعلقان بهما.
