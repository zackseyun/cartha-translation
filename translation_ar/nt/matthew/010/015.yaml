review_pass:
  verdict: revise
  source_fidelity: 'يحافظ المسودّ على عناصر النص الأساسية: صيغة التأكيد، والمقارنة، و«أرض سدوم وعمورة»، و«يوم الدينونة»، و«تلك المدينة». لكن «أرض ... أقدر على الاحتمال» تجعل الأرض هي القادرة على الاحتمال، بينما تفيد البنية اليونانية أن الأمر سيكون أيسر احتمالًا لأرض سدوم وعمورة من المدينة المذكورة.'
  naturalness: «الحق أقول لكم» و«يوم الدينونة» فصيحتان وطبيعيتان. أما «ستكون أرض سدوم وعمورة ... أقدر على الاحتمال» فثقيلة دلاليًا في العربية؛ إذ لا توصف الأرض عادة بأنها أقدر على احتمال العقوبة. إعادة الصياغة المقترحة تنقل المقارنة بصورة عربية سليمة مع إبقاء «أرض» صراحةً.
  terminology: «سدوم وعمورة»، و«الدينونة»، و«المدينة» اختيارات مناسبة. ولا تستلزم الآية إضافة تفسير لطبيعة الدينونة أو لمن تشملهم الإحالة إلى الأرض.
