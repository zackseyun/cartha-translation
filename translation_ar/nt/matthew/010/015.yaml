source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: ar
  text: 'الحق أقول لكم: سيكون الأمر يوم الدينونة أيسر احتمالًا لأرض سدوم وعمورة مما سيكون لتلك المدينة.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي «الحق» في صيغة «الحق أقول لكم» قوة التوكيد الاحتفالي التي تحملها ἀμήν، وهي واضحة وطبيعية في العربية الفصحى.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحافظ على صيغة الخطاب اليونانية.
- source_word: ἀνεκτότερον
  choice: أقدر على الاحتمال
  rationale: 'تعبير عربي واضح ينقل معنى المقارنة: أن ما تواجهه أرض سدوم وعمورة سيكون أخف وطأة وأسهل احتمالًا، من غير تحديد ماهية العقوبة بما يتجاوز النص.'
- source_word: γῇ
  choice: أرض
  rationale: يحافظ على الدلالة الجغرافية الصريحة للكلمة اليونانية بدل حذفها أو تحويلها إلى السكان وحدهم.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: سدوم وعمورة
  rationale: الصيغة العربية الشائعة لاسمي الموضعين الكتابيين، وهما مضاف إليهما بعد «أرض».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: يوم الدينونة
  rationale: صياغة عربية موجزة وطبيعية تحفظ الإشارة إلى يوم القضاء الإلهي من غير إضافة تفاصيل عقائدية لا يذكرها النص.
- source_word: πόλει
  choice: المدينة
  rationale: «مدينة» هي المقابل العربي المباشر لـ πόλις وتناسب الإحالة إلى الموضع الذي يرفض الرسل، مع بقاء إمكان فهمها بلدةً بحسب السياق.
- source_word: ἐκείνῃ
  choice: تلك
  rationale: تحفظ قوة اسم الإشارة ورجوعه إلى المدينة المحددة في السياق السابق.
theological_decisions:
- issue: طبيعة «يوم الدينونة»
  choice: الإبقاء على العبارة بوصفها يومًا للدينونة الإلهية من غير تفصيل إضافي
  alternative: تفسيرها تفسيرًا عامًا على أنها مجرد وقت للقضاء أو تحديد مخطط أخروي بعينه
  rationale: السياق يحمل توجّهًا مستقبليًا جادًا، لكن الآية لا تفصّل طبيعة ذلك اليوم ولا تسلسل أحداثه؛ لذلك تحافظ الترجمة على العبارة وتوترها اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حافظت الصياغة على ترتيب المقارنة وعلى العبارة الحرفية «أرض سدوم وعمورة»، وتجنبت إدخال تفسير لطبيعة الدينونة أو درجاتها يتجاوز منطوق النص.
