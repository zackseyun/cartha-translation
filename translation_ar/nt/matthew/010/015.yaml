  rationale: تستبدل المراجعة الإسناد غير المألوف إلى الأرض بتركيب «أيسر احتمالًا لأرض ... مما سيكون لتلك المدينة»، وهو ينقل وظيفة الداتيف في اليونانية والمقارنة بوضوح. وإضافة «الأمر» لازمة أسلوبيًا في العربية ولا تحدد طبيعة العقوبة أو الدينونة بما يتجاوز النص.
