  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: ar
  text: مَنْ يجد حياته[a] يفقدها، ومَنْ يفقد حياته من أجلي يجدها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نفسه» في الموضعين؛ فالكلمة اليونانية ψυχή قد تعني «الحياة» أو «النفس»، لكن «الحياة» أنسب هنا لسياق فقد الإنسان حياته والعثور عليها في التلمذة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: مَنْ يجد
  rationale: أداة الشرط العامة «مَنْ» مع المضارع تصوغ القول بصيغة عامة طبيعية في العربية، وتحفظ دلالة اسم الفاعل اليوناني المسبوق بأداة التعريف على الشخص النموذجي.
- source_word: ψυχὴν
  choice: حياته
  rationale: تدل ψυχή هنا أساسًا على حياة الإنسان في سياق المفارقة بين التشبث بالحياة وفقدها في سبيل اتباع يسوع، لا على النفس بوصفها جزءًا غير مادي فحسب.
- source_word: ἀπολέσει
  choice: يفقدها
  rationale: «يفقد» يلائم معنى الخسارة هنا، ويحفظ التضاد المقصود مع «يجد» من غير إيحاء ضروري بالإهلاك أو الفناء.
- source_word: ὁ ἀπολέσας
  choice: مَنْ يفقد
  rationale: مع أن اسم الفاعل اليوناني بصيغة الماضي، فالبناء الشرطي العربي بالمضارع ينقل على نحو طبيعي القوة العامة للمقولة واتصاله بنتيجتها.
- source_word: ἕνεκεν ἐμοῦ
  choice: من أجلي
  rationale: تعبير عربي موجز وطبيعي ينقل معنى السبب أو الدافع، ويبرز أن فقد الحياة ناتج عن الولاء ليسوع.
- source_word: εὑρήσει
  choice: يجدها
  rationale: تكرار «يجد» يحفظ التقابل اللفظي المتعمد مع εὑρὼν وبنية المفارقة.
- source_word: αὐτοῦ / αὐτήν
  choice: حياته / ها
  rationale: يحفظ الضمير المفرد العائد إلى الشخص العام، مع إحالة ضمير المفعول إلى «الحياة» المؤنثة في العربية.
theological_decisions:
- issue: ترجمة ψυχή في مفارقة التلمذة
  choice: الحياة
  alternative: النفس
  rationale: السياق يتناول تمسّك الإنسان بحياته أو بذلها من أجل يسوع، ولذلك تنقل «الحياة» المعنى الأرجح وتحفظ توتر المفارقة. ومع ذلك، تبقى «النفس» بديلًا معجميًا ممكنًا ينبغي إثباته في الحاشية من غير حسم المجال الدلالي كله.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على التوازي والمفارقة في الأصل. استُعملت «مَنْ» الشرطية العامة بدل تركيب أثقل، وجاءت الأفعال بالمضارع لأن العربية تعبّر به طبيعيًا عن النتيجة العامة المؤكدة في هذا الأسلوب.
