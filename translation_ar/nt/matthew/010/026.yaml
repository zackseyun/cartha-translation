source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: ar
  text: فلا تخافوهم، لأنه ما من شيء مغطّى إلا سيُكشَف، ولا شيء خفيّ إلا سيُعرَف.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: فلا تخافوهم
  rationale: تنقل οὖν بالفاء الاستنتاجية الطبيعية في العربية، وتحافظ على النهي ومرجع ضمير الجمع من غير تفسير زائد.
- source_word: κεκαλυμμένον
  choice: مغطّى
  rationale: يحافظ على صورة الشيء الذي وُضع عليه غطاء، وعلى الصلة اللفظية بالفعل المقابل ἀποκαλυφθήσεται.
- source_word: ἀποκαλυφθήσεται
  choice: سيُكشَف
  rationale: صيغة مبنية للمجهول تقابل المبني للمجهول في اليونانية، وتؤدي معنى رفع الغطاء أو الإظهار.
- source_word: κρυπτὸν
  choice: خفيّ
  rationale: صياغة عربية موجزة وطبيعية تدل على ما هو مستور أو غير ظاهر.
- source_word: γνωσθήσεται
  choice: سيُعرَف
  rationale: تحافظ على معنى المعرفة وعلى البناء للمجهول، من غير تحويله إلى مجرد إعلان علني.
theological_decisions:
- issue: هوية الفاعل في فعلي الكشف والمعرفة
  choice: 'الإبقاء على البناء للمجهول: «سيُكشَف» و«سيُعرَف»'
  alternative: 'تعيين الله فاعلًا أو القول: «سيكشفه الناس»'
  rationale: النص اليوناني لا يصرّح بالفاعل؛ لذا لا ينبغي حسم ما تركه النص مفتوحًا.
- issue: 'طبيعة القول: مبدأ عام أم وعد أخروي محدد'
  choice: صياغة عامة بلا تحديد زمني أو أخروي زائد
  alternative: تفسيره صراحةً على أنه كشف في يوم الدينونة
  rationale: زمن المستقبل حاضر في النص، لكن الآية نفسها لا تسمّي ظرف الكشف ولا توقيته اللاهوتي المحدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التوازي بين «مغطّى/سيُكشَف» و«خفيّ/سيُعرَف»، مع تجنب الألفاظ التفسيرية أو المذهبية الزائدة.
