id: MAT.10.17
reference: Matthew 10:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: ar
  text: لكن احذروا الناس، لأنهم سيسلّمونكم إلى المجالس، ويجلدونكم في مجامعهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: احذروا
  rationale: فعل أمر للجمع يفيد التنبه إلى خطر أشخاص معادين، و«احذروا» عربية واضحة وموجزة وتحفظ قوة التحذير.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا فيه مقابلة خفيفة مع الإرشاد السابق، و«لكن» تلائم انعطاف الكلام إلى التحذير.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: الناس
  rationale: حرف ἀπό مع προσέχω يحدد مصدر الخطر، فيكون المعنى «احذروا الناس». والاسم هنا عام يشير إلى البشر المعادين، لا إلى الذكور حصرًا.
- source_word: παραδώσουσιν
  choice: سيسلّمونكم
  rationale: الفعل يدل هنا على تسليم أشخاص إلى سلطات، و«سيسلّمونكم» يحفظ المعنى القضائي دون تخصيصه بالخيانة.
- source_word: συνέδρια
  choice: المجالس
  rationale: صيغة الجمع تشير إلى مجالس محلية ذات وظيفة حاكمة أو قضائية، لا بالضرورة إلى السنهدريم في أورشليم وحده.
- source_word: συναγωγαῖς
  choice: مجامعهم
  rationale: يشير اللفظ إلى أماكن الاجتماع اليهودية المعروفة، و«المجامع» هو المقابل العربي الكتابي الواضح في هذا السياق.
- source_word: μαστιγώσουσιν
  choice: يجلدونكم
  rationale: يدل الفعل على عقوبة جسدية بالضرب بالسوط، و«يجلدونكم» تعبير عربي فصيح وواضح ذو دلالة قضائية مناسبة.
theological_decisions:
- issue: الدلالة الجندرية للفظ ἀνθρώπων
  choice: الناس
  alternative: الرجال
  rationale: اللفظ مذكر جمع من جهة الصيغة النحوية، لكنه عام دلاليًا هنا ويشير إلى المضطهِدين من البشر، فلا يقتصر على الذكور.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على توازي الفعلين المستقبليين وعلى عمومية «الناس». لا حاجة إلى حاشية لأن «الناس» ينقل الدلالة العامة مباشرة دون غموض ذي قيمة تفسيرية.
