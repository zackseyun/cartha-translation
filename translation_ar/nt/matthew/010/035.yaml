base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: ar
  text: فإني جئت لأجعل الرجل ضدّ أبيه[a]، والابنة ضدّ أمها، والكنّة ضدّ حماتها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لأفرّق»؛ فالفعل اليوناني يعني «يفرّق» أو «يُحدث انقسامًا»، لكن تكرار عبارة «ضدّ» يوضح أن المقصود هنا تعارض داخل العلاقات الأسرية.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية «عروسًا» في بعض السياقات، لكنها هنا تعني «كنّة» (زوجة الابن) لاقترانها بـ«الحماة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: جئت
  rationale: صيغة الماضي اليونانية تشير في هذا الخطاب إلى مجيء يسوع ورسالته، و«جئت» هي المقابل العربي المباشر والطبيعي.
- source_word: γὰρ
  choice: فإني
  rationale: تحفظ الفاء القوة التفسيرية والارتباط بما سبق، وتلائم السياق العربي.
- source_word: διχάσαι
  choice: لأجعل ... في مواجهة
  rationale: الفعل يعني إحداث انقسام، وتراكيب κατά المتكررة بعده تحدد هذا الانقسام بوصفه مواجهة بين أفراد الأسرة. هذه الصياغة تحافظ على حدة القول من غير أن توحي بمجرد تقسيم مجرد.
- source_word: ἄνθρωπον
  choice: الرجل
  rationale: مع أن اللفظة قد تأتي بمعنى عام، فإنها هنا جزء من ثلاثية أسرية تقابل الرجل بالبنت والكنّة، ولذلك يحسن إبقاء الدلالة المذكرة.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: في مواجهة أبيه
  rationale: κατά مع المضاف إليه تفيد المعارضة؛ و«في مواجهة» عربية واضحة تحفظ معنى الوقوف ضد شخص من غير تكلف.
- source_word: θυγατέρα
  choice: البنت
  rationale: مقابل عربي مباشر وطبيعي للاسم المفرد.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: في مواجهة أمها
  rationale: تحافظ على تكرار بنية المعارضة نفسها الواردة في اليونانية.
- source_word: νύμφην
  choice: الكنّة
  rationale: قد تعني اللفظة «عروسًا» في سياقات أخرى، لكن اقترانها هنا بالحماة يثبت معنى زوجة الابن، أي الكنّة.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: في مواجهة حماتها
  rationale: ترجمة طبيعية لمصطلح القرابة مع الحفاظ على نمط المواجهة المتكرر.
theological_decisions:
- issue: طبيعة الغاية المعلنة من مجيء يسوع في السياق
  choice: صياغة القول بوصفه إحداث مواجهة وانقسام بين أفراد الأسرة، مع إبقاء حدة العبارة كما هي.
  alternative: تفسير العبارة في المتن بأنها مجرد نتيجة اجتماعية غير مقصودة، أو توسيعها صراحة لتشير إلى الاضطهاد بسبب الولاء ليسوع.
  rationale: النص اليوناني يستعمل صيغة غائية قوية، فلا ينبغي تخفيفها إلى مجرد أثر عارض، كما لا ينبغي إضافة تفسير لاهوتي لا يصرح به هذا العدد. تحفظ الترجمة التوتر وتترك شرحه للسياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «الكنّة» لدقتها في الدلالة على زوجة الابن، و«حماتها» لكونها المقابل الطبيعي في علاقة المصاهرة. تكرار «في مواجهة» يعكس التوازي البلاغي في الأصل.
