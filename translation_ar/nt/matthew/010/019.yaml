base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: ar
  text: ولكن حين يسلّمونكم، فلا تقلقوا كيف ستتكلّمون أو ماذا ستقولون، لأن ما ستقولونه سيُعطى[a] لكم في تلك الساعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاء الفعل «سيُعطى» مبنيًا للمجهول، فلا يُذكر المعطي صراحة هنا؛ وتوضح الآية التالية أن روح أبيكم هو الذي يتكلم فيكم.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ولكن متى
  rationale: تفيد ὅταν احتمالًا مستقبليًا متكررًا أو غير محدد، وتؤدي «متى» هذا المعنى هنا، بينما تنقل «ولكن» الانتقال الخفيف الذي تدل عليه δέ في سياق التحذير السابق.
- source_word: παραδῶσιν ὑμᾶς
  choice: أسلموكم
  rationale: «أسلم» تعبير عربي واضح في سياق التسليم إلى السلطات، ويحفظ الدلالة القضائية العدائية من غير أن يخصص المعنى بالخيانة.
- source_word: μὴ μεριμνήσητε
  choice: فلا تقلقوا
  rationale: ينهي الفعل هنا عن القلق بشأن الشهادة المرتقبة؛ و«تقلقوا» لفظ معاصر طبيعي لا ينفي الاهتمام المسؤول على إطلاقه.
- source_word: πῶς ἢ τί
  choice: كيف أو ماذا
  rationale: تحفظ العبارة التمييز بين كيفية الكلام ومضمونه، وتنقل ἤ بأداة العطف «أو».
- source_word: λαλήσητε
  choice: تتكلمون
  rationale: يناسب المضارع العربي السؤال غير المباشر المتعلق بالكلام المرتقب، ويحافظ على تكرار جذر λαλέω في شطري الآية.
- source_word: δοθήσεται
  choice: سيُعطى
  rationale: يحفظ المبني للمجهول في اليونانية، فلا يسمّي المعطي قبل أن يوضحه السياق في الآية التالية.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: في تلك الساعة
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة «الساعة» وفورية العطاء وقت الحاجة.
- source_word: τί λαλήσητε
  choice: ما تتكلمون به
  rationale: صياغة عربية طبيعية تحدد مضمون الكلام وتحافظ على الصلة اللفظية بالفعل السابق.
theological_decisions:
- issue: المبني للمجهول الدال على الفاعل الإلهي في δοθήσεται
  choice: الإبقاء على «سيُعطى» من غير تسمية المعطي في المتن
  alternative: سيعطيكم الله؛ أو سيعطيكم الروح
  rationale: لا تسمّي هذه الآية المعطي صراحة، وإن كانت الآية التالية تحدد عمل روح الآب؛ لذلك تحفظ الترجمة تحفظ النص وتدرجه.
translation_notes:
  register: عربية فصحى واضحة ومعاصرة ذات نبرة كتابية وقورة. استُخدم «أسلموكم» للدلالة على التسليم إلى السلطات، وحُفظ المبني للمجهول والتكرار اللفظي قدر الإمكان من غير تكلف.
