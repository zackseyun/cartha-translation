  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: ar
  text: سِمْعَان القانوي[a]، ويهوذا الإسخريوطي، الذي أسلمه[b] أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سِمْعَان الغيور». يرد في اليونانية لقب «القانوي»، وهو على الأرجح منقول عن تسمية آرامية أو عبرية تُفهم تقليديًا بمعنى «الغيور».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذي خانه». يمكن أن يعني الفعل اليوناني أيضًا «سلَّم» أو «دفع إلى»، لكن سياق يهوذا يبرز معنى الخيانة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: القانوي
  rationale: نقلٌ صوتي للقب اليوناني ذي الأصل الآرامي/العبري، بدل إدخال تفسير «الغيور» في صلب النص؛ ويُذكر المعنى الشائع في الحاشية.
- source_word: Ἰσκαριώτης
  choice: الإسخريوطي
  rationale: الصيغة العربية المعيارية الشائعة للنقل الصوتي لهذا اللقب الشخصي.
- source_word: παραδοὺς
  choice: أسلمه
  rationale: يحافظ على المعنى الأساسي الواسع للفعل اليوناني، «سلَّم»، ولا يحسم داخل الترجمة ما إذا كان ينبغي التعبير عنه بلفظ «خان»، مع أن السياق يبيّن خيانة يهوذا.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: الذي أسلمه أيضًا
  rationale: تحويل التركيب الوصفي المكوَّن من أداة التعريف واسم الفاعل إلى جملة صلة عربية طبيعية، مع إبقاء دلالة καί «أيضًا».
theological_decisions:
- issue: هل يُترجم παραδοὺς بلفظ محايد نسبيًا («أسلمه») أم بلفظ مشحون أخلاقيًا («خانه»)؟
  choice: أسلمه
  alternative: خانه
  rationale: الفعل اليوناني أوسع من معنى الخيانة، لذا يحفظ «أسلمه» الغموض المعجمي الحقيقي، بينما يظل طابع فعل يهوذا الخياني واضحًا من سياق الإنجيل وتوضحه الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حوفظ على اللقب المنقول صوتيًا «القانوي» وعلى سعة معنى الفعل اليوناني، مع شرح البدائل في الحواشي.
