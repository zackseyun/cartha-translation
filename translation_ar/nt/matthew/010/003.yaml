lexical_decisions:
- source_word: Φίλιππος
  choice: فِيلُبُّسُ
  rationale: نقل صوتي عربي شائع للاسم اليوناني، من غير ترجمة معناه.
- source_word: Βαρθολομαῖος
  choice: بَرْثُولَمَاوُسُ
  rationale: الصيغة العربية الكتابية المألوفة للاسم، وهي قريبة من نطقه اليوناني.
- source_word: Θωμᾶς
  choice: تُومَا
  rationale: الصيغة العربية الشائعة للاسم في العهد الجديد.
- source_word: Μαθθαῖος
  choice: مَتَّى
  rationale: الصيغة العربية الراسخة والمفهومة للاسم.
- source_word: ὁ τελώνης
  choice: جَابِي الضَّرَائِبِ
  rationale: تعبير عربي معاصر واضح يدل على من يجبي الضرائب أو الرسوم، ويتجنب اللفظ القديم أو المعنى الأضيق.
- source_word: Ἰάκωβος
  choice: يَعْقُوبُ
  rationale: الصيغة العربية التقليدية للاسم اليوناني Ἰάκωβος، وتحافظ على التعرف إلى الشخصية في قوائم الرسل.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: بْنُ حَلْفَى
  rationale: يجعل علاقة البنوة التي يدل عليها التركيب اليوناني الإضافي صريحة وطبيعية بالعربية.
- source_word: Ἁλφαίου
  choice: حَلْفَى
  rationale: الصيغة العربية الكتابية المألوفة لاسم Ἁλφαῖος في حالة الإضافة اليونانية.
- source_word: Θαδδαῖος
  choice: تَدَّاوُسُ
  rationale: ينقل قراءة النص اليوناني الأساس Θαδδαῖος، مع إبقاء القراءات والتسميات الأخرى في الحاشية.
- source_word: καὶ
  choice: و
  rationale: حرف العطف العربي الطبيعي الذي يحافظ على البنية العطفية البسيطة للقائمة.
theological_decisions:
- issue: تحديد الرسول الأخير في القائمة
  choice: تَدَّاوُسُ
  alternative: لَبَّاوُسُ؛ ويَهُوذَا بْنُ يَعْقُوبَ في قائمتي لوقا
  rationale: النص اليوناني المقدم يقرأ Θαδδαῖος، ولذلك اتُّبعت هذه القراءة في المتن، من غير توحيد قسري بينها وبين القراءات المخطوطية أو القوائم الموازية.
translation_notes:
  register: عربية فصحى واضحة وموقرة، مع استعمال الأسماء الكتابية العربية المألوفة. حُفظ إيقاع القائمة القائم على العطف بالواو، واستُعمل «جابي الضرائب» بدل الألفاظ القديمة. وُضع مؤشر الحاشية بعد «تداوس» لأنه موضع الاختلاف النصي والتسموي.
