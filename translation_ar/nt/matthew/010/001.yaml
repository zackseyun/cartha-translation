id: MAT.10.1
reference: Matthew 10:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: ar
  text: ودعا تلاميذه الاثني عشر إليه، وأعطاهم سلطانًا على الأرواح النجسة، ليخرجوها ويشفوا كل داء وكل مرض.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: دعا ... إليه
  rationale: اسم الفاعل اليوناني من فعل يفيد الاستدعاء إلى النفس؛ والصياغة العربية تربط الحدثين طبيعيًا وتحفظ معنى «إليه» دون إثقال.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: تلاميذه الاثني عشر
  rationale: «تلاميذ» المقابل المألوف والدقيق في سياق الأناجيل، والضمير المتصل ينقل αὐτοῦ بوضوح.
- source_word: ἔδωκεν
  choice: أعطاهم
  rationale: ينقل المعنى المباشر للفعل δίδωμι دون إضافة دلالة تفسيرية.
- source_word: ἐξουσίαν
  choice: سلطانًا
  rationale: «سلطان» يدل على صلاحية وقدرة مخوَّلة لممارسة الفعل، وهو أدق هنا من الاقتصار على القوة المجردة.
- source_word: πνευμάτων ἀκαθάρτων
  choice: على الأرواح النجسة
  rationale: حرف الجر «على» يبين مجال السلطان، و«الأرواح النجسة» تعبير عربي كتابي واضح ودقيق.
- source_word: ὥστε
  choice: لِـ
  rationale: اللام مع الفعل المضارع تنقل بإيجاز طبيعي معنى الغاية أو النتيجة المقصودة، من غير حسم زائد بينهما.
- source_word: ἐκβάλλειν αὐτὰ
  choice: ليخرجوها
  rationale: يحفظ معنى طرد الأرواح، والضمير المؤنث غير العاقل يعود بوضوح إلى «الأرواح».
- source_word: θεραπεύειν
  choice: يشفوا
  rationale: «شفى» هو المقابل الطبيعي الدقيق في سياق إزالة المرض.
- source_word: πᾶσαν νόσον
  choice: كل داء
  rationale: «داء» ينقل νόσος ويحافظ على تمييز لفظي عن المصطلح التالي.
- source_word: πᾶσαν μαλακίαν
  choice: كل مرض
  rationale: «مرض» تعبير عام مفهوم لحالة الاعتلال، ويحفظ الثنائية اليونانية دون دمج اللفظين.
theological_decisions:
- issue: طبيعة ما منحه يسوع للتلاميذ
  choice: سلطان على الأرواح النجسة
  alternative: قوة على الأرواح النجسة
  rationale: ἐξουσία تدل في هذا السياق على سلطان أو صلاحية ممنوحة، لا على قوة مجردة فقط؛ وتحفظ الترجمة كون هذا السلطان صادرًا من يسوع دون إضافة تقرير عقائدي خارج النص.
- issue: دلالة ὥστε مع المصدرين
  choice: ليخرجوها ويشفوا
  alternative: حتى يخرجوها ويشفوا
  rationale: تحفظ لام التعليل مجال التداخل بين الغاية والنتيجة في التركيب اليوناني، ولا تفرض فصلًا لاهوتيًا غير موجود في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «سلطان» لدقته وشيوعه، وحُفظت الثنائية «كل داء وكل مرض» لتعكس المصطلحين اليونانيين المترادفين جزئيًا. لا توجد حواشٍ لازمة لأن البدائل لا تؤثر في فهم النص بقدر يستدعي إثقال الآية.
