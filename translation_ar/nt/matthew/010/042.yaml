  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: ar
  text: 'وَمَنْ سَقَى وَاحِدًا مِنْ هَؤُلَاءِ الصِّغَارِ[b]، وَلَوْ بِكَأْسِ مَاءٍ بَارِدٍ فَقَطْ، بِسَبَبِ كَوْنِهِ تِلْمِيذًا[a]، فَالْحَقَّ أَقُولُ لَكُمْ: لَنْ يَفْقِدَ أَجْرَهُ أَبَدًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «باسم تلميذ». يدل التعبير اليوناني هنا على أن السقي يُقدَّم بسبب هوية المتلقي كتلميذ.'
    reason: alternative_reading
  - marker: b
    text: لا يلزم أن تشير عبارة «هؤلاء الصغار» إلى الأطفال وحدهم؛ فهي في هذا السياق قد تشمل أتباع يسوع المتواضعين أو الذين يُعَدّون قليلي الشأن.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: وَمَنْ
  rationale: تفيد أداة الوصل مع ἄν التعميم وعدم التعيين؛ و«مَنْ» تؤدي هذا المعنى طبيعيًا في العربية.
- source_word: ποτίσῃ
  choice: سَقَى
  rationale: الفعل اليوناني يعني إعطاء شخص ما ليشرب، و«سقى» هو المقابل العربي الموجز والطبيعي.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: وَاحِدًا مِنْ هَؤُلَاءِ الصِّغَارِ
  rationale: يحافظ التعبير على صورة النص ولا يحصر المرجع في الأطفال، إذ قد يدل السياق على أتباع يسوع المتواضعين أو قليلي الشأن.
- source_word: ποτήριον ψυχροῦ
  choice: كَأْسَ مَاءٍ بَارِدٍ
  rationale: الموصوف المحذوف في اليونانية مفهوم على أنه الماء؛ والتعبير العربي صريح وطبيعي.
- source_word: μόνον
  choice: وَلَوْ ... فَحَسْبُ
  rationale: يبرز ضآلة العطية وبساطتها، أي إن الوعد يشمل حتى تقديم كأس ماء بارد لا أكثر.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: لِأَنَّهُ تِلْمِيذٌ
  rationale: ينقل المعنى السياقي، وهو أن السقي يُقدَّم بسبب هوية المتلقي كتلميذ، مع إثبات الصيغة الأقرب إلى اللفظ في الحاشية.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: فَالْحَقَّ أَقُولُ لَكُمْ
  rationale: صيغة عربية واضحة ومهيبة تنقل وظيفة ἀμήν بوصفها توكيدًا solemnًا لقول يسوع.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: لَنْ يَفْقِدَ ... أَبَدًا
  rationale: تركيب οὐ μή نفي مؤكد جدًا؛ وإضافة «أبدًا» تنقل قوة هذا النفي في عربية طبيعية.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: أَجْرَهُ
  rationale: «الأجر» يشمل معنى الجزاء أو المكافأة، وهو الأنسب في سياق الوعد.
theological_decisions:
- issue: مرجع «هؤلاء الصغار»
  choice: الإبقاء على «هؤلاء الصغار» دون حصرها في الأطفال
  alternative: الأطفال حرفيًا، أو المؤمنون الجدد والضعفاء وحدهم
  rationale: السياق المباشر يتناول استقبال التلاميذ وخدمتهم بسبب صلتهم بيسوع؛ لذلك تُحفظ سعة التعبير ولا يُضيَّق تفسيره في المتن.
- issue: دلالة εἰς ὄνομα μαθητοῦ
  choice: «لأنه تلميذ» مع بديل حرفي في الحاشية
  alternative: «باسم تلميذ»
  rationale: المعنى الأرجح أن الفعل يُعمل بسبب هوية المتلقي كتلميذ. الصياغة المختارة واضحة في العربية ولا تضيف دلالة طقسية أو صيغية، مع حفظ البنية اليونانية في الحاشية.
- issue: طبيعة الأجر
  choice: الإبقاء على «أجره» بلا تحديد لزمنه أو كيفيته
  alternative: تفسيره صراحة بأنه أجر أخروي أو زمني
  rationale: النص يؤكد عدم ضياع الأجر لكنه لا يحدد هنا طبيعته أو توقيته، ولذلك لا تُحسم المسألة ترجميًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة من غير تراكيب مهجورة. استُعمل التشكيل الجزئي لتيسير القراءة، وحُفظ التوكيد القوي في خاتمة الآية.
