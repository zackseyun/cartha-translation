  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ar
  text: وستكونون مكروهين من الجميع بسبب اسمي. لكن من يصمد إلى النهاية فسيخلُص.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «سيخلُص»: «سينجو» أو «سيُنقَذ»، بحسب فهم السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: مكروهين
  rationale: ينقل معنى حالة الكراهية التي تدل عليها الصيغة المحيطية المستقبلية ἔσεσθε μισούμενοι، بعبارة عربية واضحة وطبيعية.
- source_word: ὑπὸ πάντων
  choice: من الجميع
  rationale: تدل ὑπό مع المضاف إليه في البناء للمجهول على فاعلين شخصيين، و«من الجميع» تحفظ الشمول دون تقييده بجماعة معينة.
- source_word: διὰ τὸ ὄνομά μου
  choice: بسبب اسمي
  rationale: تعبّر διά مع النصب عن السبب، و«اسمي» تبقي الدلالة الكتابية الواسعة على شخص يسوع وسلطانه والانتساب إليه.
- source_word: ὁ δὲ ὑπομείνας
  choice: لكن من يصمد
  rationale: اسم الفاعل المعرّف يؤدي وظيفة اسمية؛ و«يصمد» ينقل الثبات تحت الاضطهاد بلغة معاصرة من غير إدخال مصطلح عقائدي لاحق.
- source_word: εἰς τέλος
  choice: إلى النهاية
  rationale: تحفظ بلوغ الصمود غايته أو نهايته، مع إبقاء ماهية «النهاية» غير محددة كما في الأصل.
- source_word: οὗτος
  choice: فـ
  rationale: الضمير اليوناني استئنافي توكيدي؛ وتؤدي الفاء الرابطة في العربية معنى النتيجة والتخصيص بصورة طبيعية، بدل «فهذا» الأثقل أسلوبيًا.
- source_word: σωθήσεται
  choice: سيخلُص
  rationale: تحفظ «يخلُص» المجال الدلالي الواسع لـσῴζω، بما يشمل الخلاص والإنقاذ، من غير حسم نوع النجاة المقصودة.
theological_decisions:
- issue: معنى الخلاص النهائي وعلاقته بالصمود
  choice: الإبقاء على «سيخلُص» بمعناها الواسع دون تحديد نوع الخلاص
  alternative: سينجو جسديًا؛ أو سينال الخلاص الأخروي النهائي؛ أو صياغة الآية وفق مذهب معين في المثابرة
  rationale: تربط الآية الصمود تحت الاضطهاد بالخلاص، لكنها لا تفصّل هنا طبيعة ذلك الخلاص ولا تحسم الجدل العقائدي اللاحق؛ لذلك ينبغي إبقاء التوتر اللاهوتي قائمًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يصمد» بدل «يثبت» لتوضيح معنى الاحتمال والثبات تحت الاضطهاد، وحُفظت «بسبب اسمي» حرفيًا نسبيًا لما للاسم من دلالة كتابية واسعة.
