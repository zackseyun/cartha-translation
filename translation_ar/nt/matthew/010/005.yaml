base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: ar
  text: 'أرسل يسوع هؤلاء الاثني عشر، وأمرهم قائلًا: «لا تسلكوا طريقًا إلى الأمم[a]، ولا تدخلوا مدينةً سامرية[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تذهبوا في طريق الأمم». العبارة اليونانية حرفيًا أقرب إلى لغة الطريق أو المسار، ويُرجَّح أنها تشير إلى التوجه نحو مناطق الأمم، أي غير اليهود.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مدينةً للسامريين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: هؤلاء الاثني عشر
  rationale: ينقل اسم الإشارة والعدد كما وردا، من غير إضافة «تلميذًا» لأنها مفهومة من السياق وليست مذكورة في العبارة اليونانية.
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: تعبير عربي طبيعي يدل في السياق على إيفادهم في مهمة، من غير تحميل اللفظ معنى رسميًا زائدًا مثل «كلّف».
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: وأوصاهم قائلًا
  rationale: يحافظ على القوة التوجيهية للفعل وعلى تقديم الخطاب المباشر، بصياغة عربية واضحة؛ و«أوصى» هنا أمر توجيهي لا مجرد نصيحة.
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: لا تسلكوا طريقًا إلى الأمم
  rationale: يحفظ صورة الطريق في ὁδός، ويعبّر طبيعيًا عن التوجه نحو مناطق غير اليهود، مع إبقاء احتمال البنية الحرفية في الحاشية.
- source_word: ἐθνῶν
  choice: الأمم
  rationale: هو المقابل الكتابي العربي المألوف لغير اليهود في هذا السياق، من غير الوصف التقويمي الذي قد تحمله ألفاظ مثل «الوثنيين».
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: لا تدخلوا مدينةً للسامريين
  rationale: ينقل النهي مباشرة ويحافظ على تركيب الإضافة الدال على مدينة تخص السامريين؛ و«مدينة» مقابل مناسب لـ πόλις من غير حسم حجم التجمع.
theological_decisions:
- issue: نطاق النهي عن التوجه إلى الأمم ودخول مدن السامريين ومدته
  choice: صياغته بوصفه توجيهًا مباشرًا لهذه الإرسالية المحددة، من غير إضافة قيد زمني أو تعميم دائم
  alternative: صياغة توحي بمنع مطلق ودائم، أو إضافة تفسير صريح بأنه مؤقت
  rationale: النص نفسه يورد أمرًا خاصًا بإرسال الاثني عشر، لكنه لا يصرّح هنا بمدته؛ لذلك تحفظ الترجمة قوة النهي والتوتر السردي من غير تقرير لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الأمم» بالمفهوم الكتابي، و«السامريين» بالصيغة العربية المألوفة. وُضعت علامتا الحاشيتين في المتن عند موضعي البدائل المعجمية.
