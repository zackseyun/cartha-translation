  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: ar
  text: وَيَكُونُ أَعْدَاءُ الْإِنْسَانِ أَهْلَ بَيْتِهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويكون أعداءُ الإنسان أفرادَ بيته».'
    reason: بديل أسلوبي يوضح أن المقصود الأشخاص المنتمون إلى البيت، لا البيت بوصفه مكانًا.
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف بسيط يصل هذه العبارة بالسياق السابق من غير إضافة معنى سببي أو توكيدي غير صريح.
- source_word: ἐχθροὶ
  choice: أَعْدَاءُ
  rationale: جمع اسمي يدل على المعادين، و«أعداء» هو المقابل العربي الطبيعي المباشر.
- source_word: τοῦ ἀνθρώπου
  choice: الْإِنْسَانِ
  rationale: تفيد الإضافة أن الحديث عن أعداء الإنسان. ولفظ «الإنسان» يحافظ على صيغة المفرد التمثيلية، وهو في العربية صالح للدلالة العامة على الفرد البشري.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: أَهْلُ بَيْتِهِ
  rationale: يدل اللفظ على المنتمين إلى البيت لا على المبنى نفسه. والتعبير العربي «أهل بيته» موجز وطبيعي ويحفظ معنى العلاقة المنزلية وضمير الملكية.
theological_decisions:
- issue: دلالة ἀνθρώπου التمثيلية وصيغته المفردة
  choice: الإنسان
  alternative: الشخص
  rationale: «الإنسان» يحافظ على المفرد التمثيلي في الأصل، ويؤدي في العربية معنى عامًا من غير حصر القول في ذكر بالغ، فلا يلزم تسطيح الصيغة إلى «الشخص».
- issue: مدى مدلول οἰκιακοί
  choice: أهل بيته
  alternative: أفراد أسرته
  rationale: «أهل بيته» يحفظ المجال الأوسع للأسرة أو الجماعة المنزلية، ولا يقصره بالضرورة على مفهوم الأسرة النووية الحديث.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة، ذات إيقاع مَثَلي يوافق تركيب الأصل. أُبقي العطف بالواو، واستُخدم «أهل بيته» بوصفه تعبيرًا عربيًا طبيعيًا يشمل المنتمين إلى البيت.
