id: MAT.10.14
reference: Matthew 10:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: ar
  text: ومَن لا يقبلكم ولا يستمع إلى كلامكم[a]، فعند خروجكم من ذلك البيت أو تلك البلدة[c]، انفضوا الغبار عن أقدامكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا يسمع كلماتكم».'
    reason: lexical_alternative
  - marker: b
    text: كان «نفض الغبار عن الأقدام» فعلًا رمزيًا يدل على الانفصال عن الذين رفضوا الرسالة وعلى الحكم عليهم.
    reason: cultural_note
  - marker: c
    text: 'أو: «ذلك البيت أو تلك المدينة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: ومَن لا
  rationale: 'تنقل الصيغة الموصولة غير المحددة بمعنى عام: «كل من لا»، بصياغة عربية موجزة وطبيعية، مع إبقاء الواو التي تصل الآية بسياقها.'
- source_word: δέξηται ὑμᾶς
  choice: يقبلكم
  rationale: يحفظ المعنى الواسع للفعل، الذي يشمل استقبال الرسل والترحيب بهم وقبول مهمتهم، من غير حصره في الضيافة وحدها.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: ولا يستمع إلى كلامكم
  rationale: «يستمع» يفيد الإصغاء المقصود في هذا السياق، و«كلامكم» تعبير عربي طبيعي يحفظ الإشارة إلى ما يقوله التلاميذ من غير إضافة معنى الطاعة صراحة.
- source_word: ἐξερχόμενοι ἔξω
  choice: فعند خروجكم من
  rationale: ينقل تركيب اسم الفاعل مع ظرف الخروج بوصفه ظرفًا مصاحبًا للأمر الرئيس، في صياغة عربية واضحة.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: ذلك البيت أو تلك البلدة
  rationale: يحفظ اسم الإشارة وتحديد المكان المقصود. واختيار «البلدة» لا يوحي بالضرورة بمركز حضري كبير، مع إثبات «المدينة» بديلًا في الحاشية.
- source_word: ἐκτινάξατε
  choice: انفضوا
  rationale: فعل عربي دقيق وطبيعي للحركة المقصودة، ويحفظ صورة إزالة الغبار بقوة من غير تفسير الرمز داخل المتن.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: الغبار عن أقدامكم
  rationale: يحفظ الصورة الحسية المحددة للغبار وإزالته عن الأقدام، ولا يعممها إلى «التراب» أو «الأوساخ».
theological_decisions:
- issue: الدلالة الرمزية لنفض الغبار عند رفض الرسل وكلامهم
  choice: الإبقاء على الأمر الحسي «انفضوا الغبار عن أقدامكم» في المتن
  alternative: تفسيره في المتن بعبارة مثل «إعلانًا للحكم عليهم» أو إضافة ألفاظ من الروايات الموازية
  rationale: الآية نفسها تأمر بالفعل الرمزي من غير أن تشرح دلالته صراحة؛ لذلك يحفظ المتن الصورة والتوتر الدلالي، وتُذكر الخلفية التفسيرية في الحاشية فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كلامكم» بدل «كلماتكم» لسلاسة التعبير، و«البلدة» بدل «المدينة» لتجنب افتراض حجم المكان، مع حفظ البديلين في الحواشي. وُضعت علامات الحواشي كلها في المتن عند مواضعها.
