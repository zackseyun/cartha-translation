  source_fidelity: يحفظ النص المقارنة الواضحة في ὑπὲρ ἐμέ («أكثر مني») والتوازي بين شطري الآية. لكن «فلا يستحقني» قد تُفهم عربيًا على أنها «لا يستحق أن ينالني»، وهي أضيق وأشد إيحاءً بالاستحقاق الشخصي من تركيب ἄξιος μου («ليس أهلًا لي/غير جدير بي»). كما أن الحاشية الحالية تنسب إلى اليونانية عبارة عربية («أكثر مني») بدل العبارة اليونانية نفسها.
