base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: ar
  text: مَنْ يُحِبُّ أبًا أو أمًّا أكثرَ مني فليس أهلًا لي[a]، ومَنْ يُحِبُّ ابنًا أو ابنةً أكثرَ مني فليس أهلًا لي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا يستحقني». والعبارة اليونانية «ὑπὲρ ἐμέ» تفيد محبة شخص وتقديمه على يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: مَنْ يُحِبُّ
  rationale: «مَنْ» مع الفعل المضارع صياغة عربية طبيعية تؤدي وظيفة اسم الفاعل المعرّف المستعمل استعمالًا اسميًّا، وتحافظ على الدلالة العامة.
- source_word: πατέρα ἢ μητέρα
  choice: أبًا أو أمًّا
  rationale: نُقلت أسماء القرابة من غير إضافة ضمير ملكية، موافقةً لعدم وجوده صراحةً في اليونانية، مع بقاء العلاقة مفهومة من السياق.
- source_word: ὑπὲρ ἐμέ
  choice: أكثرَ مني
  rationale: يفيد التركيب في هذا السياق المقارنة في المحبة وتقديم شخص على يسوع؛ و«أكثر مني» أوضح تعبير عربي طبيعي عن ذلك، مع إثبات البديل الحرفي في الحاشية.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: فلا يستحقني
  rationale: تؤدي العبارة العربية بإيجاز معنى عدم كون الشخص أهلًا للمسيح، وتحافظ على حدّة الحكم من غير إضافة تفسير مثل الانتماء إليه.
- source_word: καὶ
  choice: وَ
  rationale: الواو تحافظ على التنسيق البسيط والبنية المتوازية بين شطري الآية.
- source_word: υἱὸν ἢ θυγατέρα
  choice: ابنًا أو ابنةً
  rationale: ترجمة مباشرة لأسماء القرابة من دون إضافة ضمير غير مذكور صراحةً في النص اليوناني.
theological_decisions:
- issue: علاقة محبة يسوع بمحبة أقرب أفراد الأسرة
  choice: تُصاغ الآية بوصفها مطالبة بأن تكون محبة يسوع فوق محبة الأب أو الأم أو الابن أو الابنة، من غير نفي صلاح المحبة العائلية في ذاتها.
  alternative: تخفيف العبارة إلى «لا يحبني بقدر ما يحبهم»، أو توسيعها تفسيريًّا بما يفيد كراهية الأسرة.
  rationale: يفيد ὑπὲρ ἐμέ أولويةً مقارنةً في المحبة، ويعقبه حكم صريح بعدم الاستحقاق. لذلك حُفظ المطلب الحاد للتلمذة من غير تشديد يتجاوز ألفاظ هذه الآية أو تخفيف لمعناها.
- issue: دلالة οὐκ ἔστιν μου ἄξιος
  choice: فلا يستحقني
  alternative: فليس أهلًا لي / فلا يستحق أن يكون لي
  rationale: «فلا يستحقني» عبارة عربية واضحة وقوية تقابل علاقة ἄξιος بالمضاف إليه μου، وتتجنب إدخال فكرة الانتماء التي ليست مصرحًا بها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع توازٍ لفظي بين نصفي الآية. استُعملت «مَنْ» العامة، وتُركت أسماء القرابة بلا ضمير ملكية التزامًا بدرجة التصريح في الأصل. وُضعت علامة الحاشية [a] في المتن.
