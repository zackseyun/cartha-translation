  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: ar
  text: ومَن لا يأخذ صليبه ويتبعني من ورائي، فليس جديرًا بي.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ضمير «ـه» في «صليبه» يقابل في اليونانية ضميرًا مفردًا مذكرًا مستعملًا استعمالًا عامًا؛ أي إن على كل تلميذ أن يأخذ صليبه هو.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن ترجمتها ببساطة: «يتبعني». لكن اليونانية تقول بصورة أصرح: «يتبعني من ورائي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: مَن
  rationale: اسم موصول عام ينقل المعنى غير المحدد والشامل بصورة طبيعية وموجزة في العربية.
- source_word: λαμβάνει
  choice: يأخذ
  rationale: مع «صليبه» يفيد حمل الصليب وقبول ما يقتضيه طريق التلمذة؛ ولا حاجة إلى إضافة «يحمل» إلى النص لأن الفعل اليوناني هو «يأخذ».
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: صليبه
  rationale: يحفظ الصورة الملموسة وصيغة المفرد المذكر ذات الاستعمال العام، من غير تحويلها إلى شرح تجريدي عن الألم أو إنكار الذات.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: يتبعني من ورائي
  rationale: يحفظ دلالة ὀπίσω الصريحة، أي السير وراء يسوع، مع صياغة عربية واضحة.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: فلا يستحقني
  rationale: صياغة عربية طبيعية وقوية للعلاقة بين ἄξιος والمضاف إليه μου، وتحفظ التقييم الشخصي من غير توسع تفسيري.
theological_decisions:
- issue: صورة حمل الصليب في التلمذة
  choice: الإبقاء على الصورة الملموسة «يأخذ صليبه»
  alternative: تفسيرها في المتن بعبارات مثل «يقبل الألم» أو «ينكر ذاته»
  rationale: الصورة التاريخية واللاهوتية مقصودة في النص، وتفسيرها تجريديًا يضيّق مجال معناها.
- issue: المفرد المذكر العام في αὐτοῦ
  choice: «صليبه» بصيغة المفرد المذكر
  alternative: صياغة جمعية أو محايدة من نحو «صليبهم»
  rationale: يحفظ البنية النحوية للمصدر، مع بيان أن الاستعمال عام في الحاشية.
- issue: دلالة ὀπίσω في اتباع يسوع
  choice: «يتبعني من ورائي»
  alternative: «يتبعني» فقط
  rationale: إثبات «من ورائي» يصون العنصر المكاني/التلمذي الصريح في اليونانية من غير تحميله تفسيرًا مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «مَن» للعموم، وحُفظت صورة الصليب والتعبير الصريح عن الاتباع من وراء يسوع. وُضعت علامتا الحاشيتين في المتن كما هو مطلوب.
