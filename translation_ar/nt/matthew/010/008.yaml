  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: ar
  text: اشفوا المرضى، وأقيموا الموتى[a]، وطهِّروا المصابين بالبرص[b]، وأخرجوا الشياطين. مجانًا أخذتم، فمجانًا أعطوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا ترد عبارة «وأقيموا الموتى» في بعض المخطوطات.
    reason: textual_variant
  - marker: b
    text: قد يدل اللفظ المترجم «البرص» في الاستعمال الكتابي على طائفة من الأمراض الجلدية الخطيرة، لا على مرض هانسن المعروف حديثًا وحده.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: اشفوا المرضى
  rationale: ينقل اسم الفاعل معنى المصابين بالمرض في هذا السياق، ويؤدي فعل الأمر «اشفوا» معنى θεραπεύετε بوضوح وطبيعية.
- source_word: νεκροὺς ἐγείρετε
  choice: أقيموا الموتى
  rationale: يفيد ἐγείρω هنا الإقامة من الموت، لا مجرد الإيقاظ، وتحافظ الصياغة على الأمر المباشر.
- source_word: λεπροὺς καθαρίζετε
  choice: طهِّروا المصابين بالبرص
  rationale: تحافظ «طهِّروا» على الدلالة الجسدية والطقسية لفعل καθαρίζω، بينما تتجنب عبارة «المصابين بالبرص» استعمال وصف المرض هويةً للأشخاص.
- source_word: δαιμόνια ἐκβάλλετε
  choice: أخرجوا الشياطين
  rationale: ترجمة مباشرة وطبيعية لعبارة الطرد في سياق إخراج الشياطين.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: مجانًا أخذتم، فمجانًا أعطوا
  rationale: تكرر «مجانًا» للمحافظة على التوازي والتوكيد في اليونانية، وتصل الفاء بين ما نالوه وما أُمروا أن يعطوه بصورة عربية طبيعية دون تحويل العلاقة إلى شرح زائد.
theological_decisions:
- issue: نطاق أوامر الأعمال المعجزية
  choice: إبقاء الأفعال أوامر مباشرة موجَّهة إلى الاثني عشر في سياق إرسالهم
  alternative: تأويل بعض الأفعال مجازيًا أو حصرها في ممارسات كنسية لاحقة
  rationale: يعرض النص سلسلة من أفعال الأمر بصيغة الجمع وأعمالًا محددة؛ لذلك لا تُلطَّف إلى استعارات ولا يُوسَّع تطبيقها أو يُضيَّق خارج ما يقوله السياق.
- issue: معنى التطهير للمصابين بالبرص
  choice: استعمال «طهِّروا» بدل الاكتفاء بـ«اشفوا»
  alternative: اشفوا المصابين بالبرص
  rationale: يحفظ اللفظ دلالة καθαρίζω التي قد تشمل التعافي الجسدي والطهارة الشعائرية، من غير حسم العلاقة بينهما.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقرة، تحافظ على إيقاع الأوامر المتتابعة والتوازي في خاتمة الآية. وُضع كل رمز حاشية عند العبارة التي يشرحها، وصُحح بذلك موضع الحاشية الثقافية الوارد على نحو غير متسق في طبقة الاستشارة الإنجليزية.
