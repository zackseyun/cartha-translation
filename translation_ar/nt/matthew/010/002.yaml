id: MAT.10.2
reference: Matthew 10:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: ar
  text: 'وهذه أسماء الرسل الاثني عشر: أولًا[a] سمعان الذي يُدعى بطرس، وأندراوس أخوه؛ ويعقوب بن زبدي، ويوحنا أخوه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو قد تفيد «أولًا» الصدارة بين الاثني عشر، لا مجرد الترتيب في القائمة.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: أداة انتقال خفيفة تربط عرض الأسماء بما قبله، والواو طبيعية في العربية ولا تضيف معنى زمنيًا غير صريح.
- source_word: δώδεκα ἀποστόλων
  choice: الرسل الاثني عشر
  rationale: «الرسل» هو المقابل العربي المستقر والدقيق للجماعة التي اختارها يسوع وأرسلها، مع موافقة العدد للمعدود في العربية.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: هذه أسماء
  rationale: صياغة عربية واضحة تحافظ على البنية الإشارية من غير تكلّف.
- source_word: πρῶτος
  choice: أولًا
  rationale: تؤدي المعنى المباشر في بدء تعداد الأسماء، من غير أن تحسم وحدها دلالة الرتبة أو الصدارة.
- source_word: ὁ λεγόμενος
  choice: الذي يُدعى
  rationale: تنقل العبارة التعريفية بصياغة عربية طبيعية وقريبة من اليونانية.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الكتابية المستقرة للاسم.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: أخوه
  rationale: تفيد الأخوّة العائلية حرفيًا وبإيجاز عربي طبيعي؛ يعود الضمير أولًا إلى سمعان ثم إلى يعقوب.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: بن زبدي
  rationale: الإضافة اليونانية تدل في السياق على النسب، و«بن زبدي» هي الصياغة العربية الطبيعية الموجزة.
theological_decisions:
- issue: دلالة πρῶτος في وصف سمعان بطرس
  choice: أولًا، بوصفها بداية التعداد من غير تصريح بعقيدة عن سلطة بطرس
  alternative: قد تحمل اللفظة أيضًا إيحاءً بالصدارة أو المكانة بين الاثني عشر
  rationale: السياق يسرد أسماء، فيناسبه المعنى الترتيبي المباشر، لكن اللفظة قد تتسع لدلالة المكانة؛ لذلك حُفظ هذا الاحتمال في الحاشية دون حسم طائفي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت الأسماء العربية الكتابية المألوفة، وحُفظت خفة الانتقال في δὲ بالواو من غير إدخال ظرف زمني.
