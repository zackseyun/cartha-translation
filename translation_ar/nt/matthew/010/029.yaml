  source_fidelity: 'المعنى منقول بأمانة في الجملة: «عصفوران»، وبيعُهما بعملة زهيدة، وعدم سقوط واحد منهما بمعزل عن الآب. لكن الفعل اليوناني πεσεῖται في المستقبل، والأفضل إظهار ذلك بالعربية بـ«لن يسقط». كما أن تركيب «بآسّاريون واحد» غير سليم/غير طبيعي في الاستعمال العربي المعاصر؛ فإدخال الاسم التاريخي بعد «قطعة» يزيل الإشكال من غير تغيير المعنى.'
