  rationale: اقتصر التعديل على تسوية تركيب العملة تاريخيًا ولغويًا في العربية، وعلى إظهار المستقبل الذي في النص اليوناني. وبقيت عبارة «بمعزل عن أبيكم» محافظة على الغموض المقصود في ἄνευ τοῦ πατρὸς ὑμῶν، مع حاشية لا تحسمه في العلم أو العناية أو المشيئة.
