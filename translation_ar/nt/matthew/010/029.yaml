  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: ar
  text: أليس عصفوران يُباعان بقطعة آسّاريون واحدة[b]؟ ومع ذلك، لن يسقط واحد منهما على الأرض بمعزل عن أبيكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من دون أبيكم». قد تفيد العبارة أنه لا يحدث من دون علمه أو عنايته أو مشيئته، لكن اليونانية لا تحدد أيًّا من ذلك.
    reason: alternative_reading
  - marker: b
    text: الآسّاريون قطعة نقدية رومانية نحاسية صغيرة، زهيدة القيمة جدًا.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: عصفوران
  rationale: يدل اللفظ هنا على عصافير صغيرة، و«عصفوران» هو المقابل العربي الطبيعي والمحدد في هذا القول.
- source_word: ἀσσαρίου
  choice: آسّاريون واحد
  rationale: اسم قطعة نقدية رومانية نحاسية زهيدة القيمة؛ أبقينا الاسم التاريخي بدل استبداله بعملة عربية تقريبية، مع توضيحه في الحاشية.
- source_word: πωλεῖται
  choice: يُباعان
  rationale: صيغة المبني للمجهول تحفظ المعنى التجاري، وجاء الفعل مثنى على مقتضى العربية الواضحة.
- source_word: ἓν ἐξ αὐτῶν
  choice: واحد منهما
  rationale: تعبير عربي طبيعي يحفظ معنى التركيب التبعي، ويعود بوضوح إلى العصفورين.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: يسقط ... على الأرض
  rationale: ينقل معنى السقوط على الأرض بصياغة عربية مباشرة وطبيعية.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: بمعزل عن أبيكم
  rationale: يحفظ معنى عدم الانفصال عن الآب من غير أن يحدد هل المقصود علمه أم عنايته أم مشيئته.
- source_word: οὐχὶ ... ;
  choice: أليس ...؟
  rationale: ينقل السؤال البلاغي الذي ينتظر جوابًا بالإيجاب في أسلوب عربي مألوف.
- source_word: καὶ
  choice: ومع ذلك
  rationale: يبرز المفارقة السياقية بين ضآلة قيمة العصفورين وعدم سقوط واحد منهما بمعزل عن الآب.
theological_decisions:
- issue: دلالة «بمعزل عن أبيكم» في صلة الآية بالعناية الإلهية
  choice: الإبقاء على العبارة العامة «بمعزل عن أبيكم»
  alternative: من دون علم أبيكم؛ من دون مشيئة أبيكم
  rationale: 'النص اليوناني يقرر أن سقوط العصفور لا يحدث بمعزل عن الآب، لكنه لا يحدد صراحة نوع هذه الصلة: علمًا أو عناية أو إرادة. لذلك لم تُحصر العبارة في تفسير عقدي أضيق من النص.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «أليس» للسؤال البلاغي، و«ومع ذلك» لإظهار المفارقة، مع الاحتفاظ باسم العملة التاريخي وشرحها في الحاشية.
