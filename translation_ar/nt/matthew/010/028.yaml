  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: ar
  text: ولا تخافوا من الذين يقتلون الجسد ولا يقدرون أن يقتلوا النفس. بل خافوا بالأحرى القادر أن يُهلك النفس والجسد كليهما في جهنم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'جهنم: اسم مشتق من «وادي هنوم»، واستُعمل للدلالة على موضع الدينونة النهائية.'
    reason: توضيح الخلفية المعجمية والتاريخية للمصطلح اليوناني γεέννα.
lexical_decisions:
- source_word: φοβεῖσθε
  choice: تخافوا / خافوا
  rationale: يحافظ تكرار الجذر العربي نفسه على المقابلة في اليونانية بين النهي عن خوف البشر والأمر بخوف القادر على الدينونة.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: من الذين يقتلون
  rationale: ترجمة طبيعية لاسم الفاعل المعرّف المستعمل للدلالة على فئة عامة.
- source_word: σῶμα
  choice: الجسد
  rationale: المقابل العربي المباشر للجسد المادي، وهو ملائم لمقابلته بالنفس.
- source_word: ψυχήν
  choice: النفس
  rationale: في سياق المقابلة مع الجسد، تحافظ «النفس» على التمييز الذي يقيمه النص، بخلاف «الحياة» التي قد تطمس هذه المقابلة.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: لا يقدرون أن يقتلوا
  rationale: يحفظ معنى عدم القدرة وصيغة الفعل بوضوح وطبيعية في العربية.
- source_word: μᾶλλον
  choice: بل ... بالحري
  rationale: تؤدي التصحيح والمقابلة مع الاحتفاظ بالقوة المقارنة للفظ اليوناني.
- source_word: τὸν δυνάμενον
  choice: القادر
  rationale: يحافظ على التعبير الاسمي المفتوح في اليونانية من غير التصريح بهوية المرجع.
- source_word: ἀπολέσαι
  choice: يُهلك
  rationale: ينقل معنى الهلاك الحاسم في الدينونة من غير تحديد زائد لطبيعته الميتافيزيقية.
- source_word: ἐν γεέννῃ
  choice: في جهنم
  rationale: «جهنم» هي المقابل العربي المتداول المنحدر، مثل اللفظ اليوناني، من اسم وادي هنوم؛ وهي تحفظ المصطلح التاريخي مع وضوح دلالته للقارئ العربي.
theological_decisions:
- issue: هوية «القادر أن يُهلك النفس والجسد كليهما في جهنم»
  choice: القادر، من غير تسمية صريحة
  alternative: الله؛ أو الشيطان
  rationale: السياق يُفهم منه على الأرجح أن المرجع هو الله صاحب سلطان الدينونة النهائية، لكن العبارة اليونانية لا تسميه؛ لذلك تُحفظ صياغة النص وتوتره التفسيري.
- issue: دلالة ἀπολέσαι في الدينونة
  choice: يُهلك
  alternative: يُفني؛ يُدمّر؛ يجعل يهلك
  rationale: «يُهلك» يحفظ شدة الحكم من غير أن يحسم وحده مسائل الإفناء أو طبيعة العقاب النهائي.
- issue: نقل γέεννα
  choice: جهنم
  alternative: الجحيم؛ وادي هنوم
  rationale: «جهنم» في العربية اسم متجذر في الأصل نفسه ومفهوم بوصفه موضع الدينونة، أما «الجحيم» فأعم وقد يفقد الخلفية الاسمية التاريخية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُخدمت «بل ... بالحري» لإبراز المقابلة، و«القادر» للمحافظة على عدم تسمية المرجع صراحة. وُضع مؤشر الحاشية بعد «جهنم» مباشرة.
