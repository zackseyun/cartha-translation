id: MAT.10.16
reference: Matthew 10:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: ar
  text: ها أنا أرسلكم كغنمٍ في وسط ذئاب؛ فكونوا إذن حكماء كالحيات، وبسطاء كالحمام.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: تعبير عربي فصيح وطبيعي يلفت الانتباه، ويلائم اقترانه بالضمير ἐγώ أكثر من صيغة أمر حرفية مثل «انظروا».
- source_word: ἀποστέλλω
  choice: أرسل
  rationale: ينقل فعل الإيفاد أو الإرسال مباشرة، مع دلالة الحاضر في السياق.
- source_word: πρόβατα
  choice: غنم
  rationale: اسم جمع طبيعي في العربية، ويحافظ على صورة حيوانات القطيع الضعيفة بين الذئاب دون تخصيصها بالخراف أو الحملان.
- source_word: φρόνιμοι
  choice: حكماء
  rationale: ينقل معنى الفطنة وحسن التقدير العملي في هذا السياق، لا مجرد المعرفة النظرية.
- source_word: ὄφεις
  choice: الحيات
  rationale: مقابل عربي واضح للجمع، ويحافظ على الصورة البلاغية من غير إضافة دلالة تفسيرية.
- source_word: ἀκέραιοι
  choice: بسطاء
  rationale: يفيد الخلو من الخبث أو الغش وعدم الاختلاط بالشر، ويقيم موازنة طبيعية مع «حكماء»؛ مع بقاء احتمال ترجمة اللفظة بـ«أبرياء».
- source_word: περιστεραί
  choice: الحمام
  rationale: اسم جنس جمعي طبيعي في العربية لصورة الحمام الواردة في التشبيه.
theological_decisions:
- issue: العلاقة بين حكمة الحيات وبساطة الحمام
  choice: الإبقاء على الصفتين متجاورتين من غير شرح يوفّق بينهما
  alternative: تفسيرهما بإضافات مثل «فطنين في الحذر وغير مؤذين»
  rationale: النص يجمع عمدًا بين الفطنة والنقاء في توتر أخلاقي موجز، ولا يصرح بتفصيل كيفية اجتماعهما.
- issue: دلالة ἀκέραιοι
  choice: بسطاء
  alternative: أبرياء
  rationale: «بسطاء» أقرب إلى معنى غير المختلط أو الخالي من الخبث، بينما «أبرياء» قد تُفهم أساسًا بمعنى عدم ثبوت الذنب؛ ومع ذلك فالبديل ممكن معجميًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، مع الحفاظ على توازي التشبيهين وإيجاز النص اليوناني. استُخدمت «كغنمٍ» و«كالحمام» بصيغتي اسم الجمع الطبيعيتين في العربية.
