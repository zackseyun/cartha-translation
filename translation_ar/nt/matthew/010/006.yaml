  text: بل اذهبوا بالأحرى إلى خراف بيت إسرائيل الضالّة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل اذهبوا بالأحرى إلى خراف بيت إسرائيل التي ضلّت».'
    reason: بديل تركيبي يعبّر عن الوصف اليوناني بصلة موصولة بدل النعت، من غير إضافة علاقة «عن» غير المصرح بها في الأصل.
lexical_decisions:
- source_word: πορεύεσθε
  choice: اذهبوا
  rationale: فعل أمر موجّه إلى جماعة، و«اذهبوا» هو التعبير العربي الطبيعي الملائم لسياق الإرسال.
- source_word: δὲ μᾶλλον
  choice: بل ... بالأحرى
  rationale: ينقل التركيب معنى المقابلة وإعادة توجيه التلاميذ إلى مقصد آخر، مع الحفاظ على دلالة μᾶλλον من غير جعلها مجرد تفضيل ضعيف.
- source_word: πρὸς
  choice: إلى
  rationale: يدل مع فعل الحركة على الاتجاه نحو المقصد، و«إلى» هي المقابل العربي المباشر والطبيعي.
- source_word: τὰ πρόβατα
  choice: خراف
  rationale: يحافظ على الصورة الرعوية الصريحة في اليونانية بدل تحويلها إلى تعبير تفسيري عن الناس.
- source_word: τὰ ἀπολωλότα
  choice: الضالّة
  rationale: في استعارة الخراف يدل الوصف على التي ضلّت أو فُقدت؛ و«الضالّة» عربية طبيعية وتحفظ الصورة ومعناها الروحي المحتمل من غير شرح زائد.
- source_word: οἴκου Ἰσραήλ
  choice: بيت إسرائيل
  rationale: يحافظ على الصياغة الكتابية ذات الدلالة الجماعية والعهدية، بدل اختزالها في «شعب إسرائيل».
theological_decisions:
- issue: الوصف الاستعاري لإسرائيل
  choice: الإبقاء على عبارة «خراف بيت إسرائيل الضالّة»
  alternative: الإسرائيليون الذين ضلّوا
  rationale: النص اليوناني يقدّم استعارة صريحة ذات صلات بالتصوير النبوي في الأسفار المقدسة؛ والإبقاء عليها يصون أبعادها الأدبية واللاهوتية من غير فرض تفسير.
- issue: تعلّق عبارة «بيت إسرائيل»
  choice: 'اعتبارها مضافة إلى «خراف»: خراف بيت إسرائيل الضالّة'
  alternative: الخراف التي ضلّت عن بيت إسرائيل
  rationale: يسمح التركيب اليوناني من حيث الدلالة بقراءة الخراف بوصفها من بيت إسرائيل، بينما يمكن أن تُفهم العبارة أيضًا على أنها خراف فُقدت من البيت؛ لذلك تُحفظ القراءة الأساسية ويُذكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الصورة الكتابية «خراف بيت إسرائيل»، واستُعمل «بل ... بالأحرى» لإظهار المقابلة وإعادة التوجيه في δὲ μᾶλλον.
