  text: لذلك لا تخافوا؛ فأنتم أكثر قيمة من عصافير كثيرة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: فَلَا تَخَافُوا إِذًا
  rationale: تفيد μή مع فعل الأمر الحاضر النهي، وتدل οὖν على نتيجة مستخلصة من الكلام السابق عن عناية الآب. ويحافظ هذا التركيب العربي الطبيعي على النهي والصلة الاستنتاجية معًا.
- source_word: πολλῶν στρουθίων
  choice: عَصَافِيرَ كَثِيرَةٍ
  rationale: يشير στρουθίον في هذا السياق، ولا سيما بالنظر إلى الآية 29، إلى العصافير، وتأتي العبارة في تركيب المقارنة بعد διαφέρετε.
- source_word: διαφέρετε
  choice: أَثْمَنُ مِنْ
  rationale: يحمل الفعل هنا معنى التفوق في القيمة أو القدر، لا مجرد الاختلاف. ولفظ «أثمن» موجز وطبيعي ويحفظ المقارنة من غير زيادة تفسيرية.
- source_word: ὑμεῖς
  choice: أَنْتُمْ
  rationale: الضمير اليوناني مصرح به للتوكيد والمقابلة مع العصافير؛ لذلك صُرِّح بالضمير «أنتم» في العربية.
theological_decisions:
- issue: القيمة النسبية للتلاميذ والعصافير في تعليم يسوع
  choice: فَأَنْتُمْ أَثْمَنُ مِنْ عَصَافِيرَ كَثِيرَةٍ
  alternative: فَأَنْتُمْ أَفْضَلُ مِنْ عَصَافِيرَ كَثِيرَةٍ
  rationale: يحفظ اختيار «أثمن» دلالة التفوق في القيمة ضمن سياق عناية الله، من غير أن يوحي بإنكار عنايته بالعصافير، كما أنه أوضح للقارئ الحديث من «أفضل» التي قد تتسع للمفاضلة الأخلاقية أو النوعية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الفاء لإظهار أن النهي نتيجة لما سبقه، مع «إذًا» لتجسيد قوة οὖν الاستنتاجية، وصُرِّح بـ«أنتم» لنقل توكيد الضمير اليوناني.
