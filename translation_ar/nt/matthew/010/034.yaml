source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: ar
  text: «لا تظنّوا أني جئت لأجلب السلام إلى الأرض[a]. لم آتِ لأجلب السلام، بل سيفًا[b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أني قد جئت لأجلب السلام على الأرض».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية تقول حرفيًا: «سيفًا». وفي السياق تشير هذه الصورة إلى الانقسام الذي يسببه اتباع يسوع، لا إلى الدعوة إلى العنف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: لا تظنّوا
  rationale: ينقل النهي بصيغة طبيعية مباشرة، ويحافظ على دلالة فعل التفكير من غير توسع تفسيري.
- source_word: ἦλθον
  choice: جئت / آتِ
  rationale: الماضي العربي هو المقابل الطبيعي هنا لفعل المجيء في سياق بيان الغاية من الرسالة؛ وجاءت «آتِ» بعد «لم» وفق الصياغة العربية الفصيحة.
- source_word: βαλεῖν
  choice: لأجلب
  rationale: المعنى الحرفي هو «ألقي/أطرح»، لكن مع «السلام» و«السيف» في هذا التركيب تفيد العربية الطبيعية معنى الإحضار أو الإتيان بالنتيجة؛ و«أجلب» تحافظ أيضًا على تكرار الفعل في الشطرين.
- source_word: εἰρήνην
  choice: السلام
  rationale: المقابل العربي المألوف والدقيق، مع التعريف الطبيعي لاسم الجنس في هذا السياق.
- source_word: ἐπὶ τὴν γῆν
  choice: إلى الأرض
  rationale: تلائم فعل «أجلب» في العربية وتعبّر عن اتجاه مجيء السلام إلى العالم الأرضي؛ ويمكن من جهة اللفظ ترجمتها «على الأرض».
- source_word: ἀλλὰ
  choice: بل
  rationale: «بل» تؤدي الاستدراك القوي بعد النفي على نحو أفصح وأدق في العربية من «لكن» هنا.
- source_word: μάχαιραν
  choice: سيفًا
  rationale: يحفظ الصورة المحسوسة الصريحة في اليونانية ولا يستبدل بها تفسيرًا مثل «الانقسام».
theological_decisions:
- issue: هل تُستبدل صورة السيف في المتن بتفسيرها على أنها انقسام؟
  choice: الإبقاء على «سيفًا» في المتن
  alternative: انقسامًا
  rationale: النص اليوناني يذكر السيف صراحة. والسياق اللاحق يبيّن أثر الانقسام، لكن الترجمة ينبغي أن تحفظ الصورة والتوتر اللاهوتي بدل أن تحسم معناها داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُخدم «لا تظنّوا» للنهي المباشر، و«بل» لإبراز المقابلة الحادة. حُفظ تكرار «لأجلب السلام» وصورة «السيف» كما في المصدر، مع شرح سياقي موجز في الحاشية من غير تذويب الصورة في المتن.
