  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: ar
  text: لا تأخذوا مزودًا للطريق، ولا ثوبين، ولا نعالًا، ولا عصًا[a]؛ فإن العامل يستحق طعامه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يفهم بعضهم عبارة «ولا عصًا» على أنها نهي عن أخذ عصًا إضافية، ولا سيما في ضوء مرقس 6:8، حيث يُسمح بأخذ عصًا.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: مزودًا
  rationale: المِزود وعاء يحمله المسافر للزاد، فيؤدي معنى الحقيبة المخصصة لمؤونة الطريق بإيجاز ملائم للسياق.
- source_word: εἰς ὁδὸν
  choice: للطريق
  rationale: تعبير عربي طبيعي يدل على ما يؤخذ في السفر، ويحافظ على إيجاز الأصل.
- source_word: δύο χιτῶνας
  choice: ثوبين
  rationale: χιτών هو الثوب الأساسي الملبوس على الجسد. «ثوبين» أوضح للقارئ العربي المعاصر من اللفظ التاريخي «قميصين»، من غير توسيع المعنى إلى أمتعة اللباس عمومًا.
- source_word: ὑποδήματα
  choice: نعالًا
  rationale: يدل اللفظ على ما يُربط تحت القدم، و«نعال» أنسب بأحذية سياق القرن الأول من «أحذية» العامة.
- source_word: ῥάβδον
  choice: عصًا
  rationale: المقصود عصا المسافر. تبقى مفردة في النص كما في اليونانية، من غير إضافة «أخرى» بغرض التوفيق مع مرقس 6:8.
- source_word: ἄξιος
  choice: مستحقٌّ
  rationale: ينقل معنى الجدارة والاستحقاق بعبارة عربية طبيعية؛ والبنية «مستحق طعامه» تحافظ على العلاقة الإضافية في الأصل.
- source_word: ὁ ἐργάτης
  choice: العامل
  rationale: لفظ عام واضح لمن يعمل، ولا يُدخل مصطلحًا كنسيًا فنيًا في سياق إرسال التلاميذ.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: طعامه
  rationale: τροφή تعني مباشرة الطعام أو القوت؛ فاختيار «طعامه» يحفظ المعنى المحسوس ولا يوسعه تفسيريًا إلى كل أشكال الدعم.
theological_decisions:
- issue: التوفيق المحتمل بين روايات الأناجيل بشأن أدوات السفر المسموح بها
  choice: إبقاء نهي متى عن أخذ العصا في المتن كما هو، من غير توفيق مع مرقس 6:8.
  alternative: فهم النهي على أنه عن عصا إضافية، أو صياغة العبارة بحرية بحيث تتوافق مع مرقس.
  rationale: النص اليوناني يدرج ῥάβδον صراحة ضمن الأشياء المنهي عنها. لذلك تُصان صياغة متى والتوتر مع الرواية الموازية، ويُذكر احتمال الفهم الآخر في الحاشية بدل فرضه على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كريمة. استُعمل «مزود» لأنه أدق من «حقيبة» في دلالته على وعاء زاد المسافر، مع إبقاء ترتيب قائمة المنهيات وبنية التعليل قريبين من الأصل.
