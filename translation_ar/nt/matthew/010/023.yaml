  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: ar
  text: 'ومتى اضطهدوكم في هذه المدينة، فاهربوا إلى الأخرى[a]. فالحق أقول لكم: لن تفرغوا من المرور في مدن إسرائيل[b] حتى يأتي ابن الإنسان[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فاهربوا إلى مدينة أخرى». يقول اليوناني حرفيًا: «إلى الأخرى»، ولفظ «المدينة» مفهوم من العبارة السابقة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لن تفرغوا من مدن إسرائيل». وقد أُضيفت عبارة «المرور في» لإظهار النشاط المفهوم من سياق تنقّل التلاميذ في الإرسالية.'
    reason: lexical_alternative
  - marker: c
    text: تُركت عبارة «حتى يأتي ابن الإنسان» مفتوحة الدلالة عن قصد؛ إذ يختلف المفسرون في كونها تشير إلى إظهار حقّ يسوع، أو إلى مجيء للدينونة، أو إلى عودته النهائية.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: متى
  rationale: تفيد زمنًا غير محدد مع احتمال التكرار، و«متى» تؤدي هذا المعنى طبيعيًا في العربية.
- source_word: διώκωσιν
  choice: اضطهدوكم
  rationale: يدل الفعل في سياق خطاب الإرسالية على الاضطهاد العدائي، لا مجرد المطاردة.
- source_word: πόλει ταύτῃ
  choice: هذه المدينة
  rationale: يحافظ اسم الإشارة القريب على مباشرة توجيه يسوع.
- source_word: φεύγετε
  choice: فاهربوا
  rationale: صيغة أمر تدل على مغادرة عاجلة في مواجهة الاضطهاد.
- source_word: εἰς τὴν ἑτέραν
  choice: إلى الأخرى
  rationale: لفظ «المدينة» مفهوم من العبارة السابقة، و«الأخرى» تحفظ الإيجاز الموجود في اليونانية.
- source_word: ἀμὴν
  choice: فالحق
  rationale: ينقل صيغة التوكيد السلطانية في قول يسوع بلغة عربية واضحة وموقرة.
- source_word: οὐ μὴ τελέσητε
  choice: لن تتمّوا
  rationale: «لن» مع السياق تنقل النفي المستقبلي المؤكد، و«تتمّوا» تحافظ على معنى الإكمال.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: مدن إسرائيل
  rationale: ترجمة مباشرة للتركيب الإضافي، مع بقاء المقصود الجغرافي أو القومي كما يتيحه السياق.
- source_word: ἕως ἂν ἔλθῃ
  choice: حتى يأتي
  rationale: ينقل التركيب الزمني الذي يحدد نقطة مستقبلية يبقى الإتمام قبلها غير واقع.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: التعبير العربي الراسخ يحفظ الصياغة الحرفية وأصداءها الكتابية واللاهوتية.
theological_decisions:
- issue: المقصود بمجيء ابن الإنسان في هذا السياق
  choice: الإبقاء على «حتى يأتي ابن الإنسان» من دون تحديد نوع المجيء
  alternative: تفسيره صراحةً بأنه القيامة والتبرير، أو الدينونة على أورشليم، أو المجيء النهائي
  rationale: العبارة اليونانية لا تحسم المرجع، لذلك يحفظ النص الغموض المقصود والتوتر الأخروي بدل فرض تفسير بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت صياغة قريبة من بنية الأصل، مع إيضاح مقتضب للنشاط المضمر في «تتمّوا مدن إسرائيل»، ووُضعت جميع علامات الحواشي في المتن.
