lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: لا تقتنوا
  rationale: الفعل κτάομαι يدل في الأصل على الاقتناء أو التحصيل، لا على مجرد الحمل؛ و«لا تقتنوا» يحفظ هذا المعنى في سياق إرسال التلاميذ.
- source_word: χρυσὸν
  choice: ذهبًا
  rationale: مقابل مباشر لاسم المادة، والمقصود في السياق مال من الذهب.
- source_word: ἄργυρον
  choice: فضةً
  rationale: مقابل مباشر لاسم المادة، والمقصود في السياق مال من الفضة.
- source_word: χαλκὸν
  choice: نحاسًا
  rationale: يمكن أن يدل χαλκός على النحاس أو البرونز. واختيار «النحاس» أنسب في قائمة أموال مرتبة مع الذهب والفضة، مع إثبات البديل في الحاشية.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: لتحملوه في أحزمتكم
  rationale: كانت الأحزمة تُستعمل لحفظ النقود وحملها. تصوغ العبارة العربية الدلالة المقصودة من εἰς بصورة طبيعية، من غير إدخال لفظ «نقود» في المتن.
