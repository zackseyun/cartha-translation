base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: ar
  text: ما أقوله لكم في الظلمة[a]، قولوه في النور؛ وما تسمعونه في الأذن[b]، أعلنوه على السطوح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الخفاء ... علنًا». غير أن اليونانية تحفظ صورة «الظلمة ... النور».'
    reason: lexical_alternative
  - marker: b
    text: تعبير «في الأذن» يدل على ما يُسمع على نحو خاص؛ والمقصود أن يُعلَن علنًا. وكانت سطوح البيوت القديمة مستوية، فتُستعمل مواضع ظاهرة للإعلان العام.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: ما أقوله لكم
  rationale: صياغة عربية طبيعية تحفظ الموصول المفعولي ومعنى الخطاب المباشر من غير تكلّف.
- source_word: ἐν τῇ σκοτίᾳ
  choice: في الظلمة
  rationale: تحفظ الصورة اليونانية والمقابلة البلاغية مع «في النور»، بدل تفسيرها مباشرةً بمعنى السرية.
- source_word: εἴπατε ἐν τῷ φωτί
  choice: قولوه في النور
  rationale: تحفظ صيغة الأمر وصورة الانتقال من الظلمة إلى النور، مع إظهار ضمير المفعول الذي تتطلبه العربية الطبيعية.
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: تسمعونه في آذانكم
  rationale: تنقل صورة التلقي القريب والخاص بصياغة عربية مفهومة؛ استُعمل الجمع مع ضمير المخاطبين وفق الاستعمال العربي الطبيعي، مع بيان اللفظ الحرفي في الحاشية.
- source_word: κηρύξατε
  choice: نادوا به
  rationale: يفيد الإعلان العلني بصوت مسموع، ويحفظ قوة فعل المنادي أو المبشّر من غير قصره على الوعظ الرسمي.
- source_word: ἐπὶ τῶν δωμάτων
  choice: على السطوح
  rationale: ترجمة قريبة تحفظ الصورة الثقافية لسطوح البيوت المستوية بوصفها موضعًا مرتفعًا للإعلان.
theological_decisions:
- issue: هل تُترجم صور الظلمة والنور والأذن والسطوح ترجمة تصويرية أم تُستبدل بتفسير عن السر والعلن؟
  choice: 'إبقاء الصور في المتن: «في الظلمة... في النور... في آذانكم... على السطوح».'
  alternative: «سرًّا... علنًا... ما يُهمس لكم به... أعلنوه على الملأ».
  rationale: النص اليوناني يبني أمر يسوع على مقابلات تصويرية حية. إبقاؤها يصون بلاغته ولا يحصر المعنى في تفسير واحد، بينما توضح الحواشي دلالة الخصوصية والعلنية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت المقابلات التصويرية الأصلية، واستُخدم «نادوا به» لإبراز الإعلان العلني، مع تجنب ألفاظ طائفية أو تفسيرية زائدة.
