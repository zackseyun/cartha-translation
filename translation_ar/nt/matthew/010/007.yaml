  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: ar
  text: 'وفيما أنتم ذاهبون، أعلنوا قائلين: «قد اقترب[a] ملكوت السماوات[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «قد دنا» أو «صار قريبًا». تدل صيغة الفعل اليوناني التامة على قربٍ تحقق وما زالت نتيجته قائمة.'
    reason: lexical_alternative
  - marker: b
    text: يستعمل متى عادةً عبارة «ملكوت السماوات»، حيث ترد في الأناجيل الأخرى غالبًا عبارة «ملكوت الله».
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: فيما أنتم ذاهبون
  rationale: اسم فاعل حاضر يصف الفعل المصاحب للأمر؛ وصيغة «فيما أنتم ذاهبون» تنقل معنى الاستمرار الزمني من غير تحويله إلى أمر مستقل.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تصل هذا التوجيه بما قبله من غير أن توحي بتعارض قوي.
- source_word: κηρύσσετε
  choice: نادوا
  rationale: فعل أمر يدل على إعلان علني على نحو المنادي؛ و«نادوا» واضح ومعاصر ويحفظ الطابع العلني السلطاني أكثر من تعبير كنسي اصطلاحي.
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل يحدد مضمون النداء، وقد أُبقي عليه لإظهار بنية الأصل وإدخال القول المنقول.
- source_word: ὅτι
  choice: علامتا الاقتباس بعد النقطتين
  rationale: تُدخل الأداة مضمون القول، ويؤديه الاقتباس المباشر في العربية بصورة طبيعية من غير إضافة «إن» أو «أن».
- source_word: Ἤγγικεν
  choice: قد اقترب
  rationale: الماضي اليوناني التام يدل على اقتراب تحقق وما زالت نتيجته قائمة؛ وتساعد «قد» مع الماضي على نقل تحقق الاقتراب، مع إبقاء معنى القرب مفتوحًا.
- source_word: ἡ βασιλεία
  choice: ملكوت
  rationale: لفظ عربي كتابي راسخ يتسع لمعنى سلطان الملك ولمملكته، فلا يحصر العبارة في رقعة أو كيان سياسي.
- source_word: τῶν οὐρανῶν
  choice: السماوات
  rationale: يحفظ صيغة الجمع في اليونانية وتعبير متى المميز، من غير استبداله بعبارة «الله».
theological_decisions:
- issue: معنى «ملكوت السماوات»
  choice: الإبقاء على «ملكوت السماوات»
  alternative: حُكم الله / ملكوت الله / مملكة السماء
  rationale: يحفظ تعبير متى الخاص ولا ينسقه مع صيغ الأناجيل الأخرى، كما يبقي «ملكوت» دالًا على الحكم والمجال معًا.
- issue: دلالة صيغة Ἤγγικεν
  choice: قد اقترب
  alternative: هو قريب / قد دنا
  rationale: تنقل الصيغة تحقق الاقتراب مع بقاء أثره، من غير حسم الكيفية الزمنية أو استكمال الملكوت بما يتجاوز دلالة الفعل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقيت عبارة «نادوا قائلين» لأنها تعكس الفعل واسم الفاعل في الأصل، مع أن «أعلنوا» أقصر. واستُعمل «ملكوت» بوصفه اللفظ العربي الكتابي الراسخ الذي يحفظ اتساع معنى βασιλεία.
