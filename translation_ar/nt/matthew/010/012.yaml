  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: ar
  text: وعندما تدخلون البيت[a]، فسلِّموا عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فسلِّموا على أهل البيت». يقول اليوناني حرفيًا: «فسلِّموا عليه»، أي على البيت، والأرجح أنه يذكر البيت كنايةً عن ساكنيه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: عندما تدخلون
  rationale: اسم فاعل مضارع مرفوع للجمع يؤدي وظيفة ظرفية مع فعل الأمر؛ وصياغته جملة زمنية طبيعية تحافظ على تزامن الدخول مع إلقاء السلام.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تصل هذه الوصية بما قبلها، من غير دلالة تضاد قوية.
- source_word: οἰκίαν
  choice: البيت
  rationale: يمكن أن تدل الكلمة على المبنى أو أهل البيت. وسياق الدخول يرجّح المعنى المكاني المباشر، مع بقاء الاستعمال المجازي لأهله ممكنًا.
- source_word: ἀσπάσασθε
  choice: فسلِّموا
  rationale: فعل أمر للمخاطبين الجمع؛ و«سلِّموا» هو المقابل العربي الجاري والواضح لإلقاء التحية.
- source_word: αὐτήν
  choice: عليه
  rationale: الضمير مؤنث مفرد في اليونانية ويعود إلى οἰκίαν. أما العربية فتستعمل «البيت» مذكرًا، ولذلك يلزم الضمير المذكر مع الحفاظ على الإحالة إلى البيت نفسه.
theological_decisions:
- issue: مخاطبة البيت مجازًا أم التصريح بأهله
  choice: الإبقاء على «فسلِّموا عليه» في المتن
  alternative: فسلِّموا على أهل البيت
  rationale: النص اليوناني يعيد الضمير صراحة إلى «البيت»، مع احتمال قوي أن يكون البيت كناية عن ساكنيه. إبقاء المجاز في المتن يحفظ صياغة المصدر، وتوضح الحاشية المقصود الاجتماعي المحتمل من غير حسمه داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعمل «البيت» بدل «المنزل» لطبيعته وسعته الدلالية، وحُفظت الكناية اليونانية في المتن مع شرحها في الحاشية.
