source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: ar
  text: وسيسلِّم الأخُ أخاه إلى الموت[a]، والأبُ ولدَه، وسيثور الأولادُ على والديهم ويقتلونهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيسلِّم الأخ أخاه ليُقتل»؛ وقد يحمل الفعل أيضًا معنى «يخون» في سياق الغدر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: سيسلِّم
  rationale: يفيد الفعل تسليم شخص إلى سلطة معادية أو إلى مصير الموت. «يسلِّم» يحفظ الصورة الملموسة من غير أن يحصر المعنى في الخيانة، مع أن السياق العائلي قد يوحي بها.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: الأخُ أخاه
  rationale: يحفظ اللفظان المفردان العلاقة العائلية المذكرة وصيغة المثال التمثيلي، كما أن الإضافة بالضمير طبيعية في العربية.
- source_word: εἰς θάνατον
  choice: إلى الموت
  rationale: 'تعبير موجز يحفظ دلالة الغاية أو النتيجة: التسليم المؤدي إلى الموت.'
- source_word: πατὴρ τέκνον
  choice: الأبُ ولدَه
  rationale: «ولد» هنا يشمل الابن والبنت، بخلاف «ابن»، ويعبّر الضمير عن العلاقة المفهومة من السياق.
- source_word: ἐπαναστήσονται
  choice: سيثور
  rationale: ينقل صورة النهوض بعداء ومقاومة، من غير تضييقها على التمرد السياسي.
- source_word: τέκνα
  choice: الأولاد
  rationale: لفظ جمع شامل للذكور والإناث في العربية المعاصرة، ومناسب للمقابلة العائلية.
- source_word: ἐπὶ γονεῖς
  choice: على والديهم
  rationale: «على» مع «يثور» تؤدي معنى العداء الذي تفيده ἐπί، و«والديهم» يوضح العلاقة الطبيعية من غير تغيير المرجع.
- source_word: θανατώσουσιν
  choice: يقتلونهم
  rationale: ينقل بوضوح التسبب المتعمد في الموت. وهو طبيعي في العربية، بينما «يميتونهم» أقل ملاءمة هنا، و«يعدمونهم» قد يفرط في تحديد إجراء قضائي.
- source_word: αὐτούς
  choice: هم في «يقتلونهم»
  rationale: يعود الضمير على الوالدين، ويحفظ تسلسل النص اليوناني من غير تكرار الاسم.
theological_decisions:
- issue: ألفاظ القرابة المذكرة والشاملة
  choice: الإبقاء على «الأخ» لـἀδελφός، واستعمال «ولد/أولاد» و«والدين» للألفاظ الأوسع
  alternative: تعميم ἀδελφός إلى «القريب» أو «أحد الإخوة والأخوات»
  rationale: النص يذكر علاقة الأخ بأخيه بصيغة مذكرة محددة، في حين أن τέκνον وτέκνα وγονεῖς أوسع دلالة؛ لذلك تحافظ الصياغة على الفروق المعجمية من غير فرض تخصيص غير موجود.
- issue: طبيعة التسليم
  choice: عدم حصر παραδίδωμι في معنى «يخون»
  alternative: «سيخون الأخ أخاه ويسلمه للموت»
  rationale: السياق يحمل توتر الخيانة العائلية، لكن الفعل نفسه يركز على التسليم إلى الموت؛ لذا أُبقي المعنى الأوسع مع ذكر البديل في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم الاستقبال بالسين لمجاراة الأفعال المستقبلية، وحُفظ التوازي بين تفكك روابط الأسرة ونتيجته المميتة.
