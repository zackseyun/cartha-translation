  source_fidelity: 'النص العربي يحافظ على البنية المستقبلية المتوازية وعلى العلاقات العائلية في اليونانية: «الأخ أخاه»، ثم «الأب ولده»، ثم «الأولاد ... والديهم». «يسلِّم ... إلى الموت» ينقل παραδώσει ... εἰς θάνατον بأمانة من غير فرض معنى «الخيانة»، و«سيثور ... ويقتلونهم» ينقل ἐπαναστήσονται ... θανατώσουσιν بصورة سليمة. حذف تكرار فعل «يسلِّم» في الشطر الثاني يعكس الحذف المفهوم في الأصل ولا يوقع في غموض مؤثر.'
  naturalness: الصياغة فصحى حديثة واضحة ووقورة. التوازي بين الجمل طبيعي، و«سيثور الأولاد على والديهم ويقتلونهم» مفهوم وسلس. الضمير في «يقتلونهم» ذو مرجع واضح هو «والديهم».
  terminology: اختيار «الأخ» يطابق الدلالة المذكرة لـἀδελφός، و«ولد/الأولاد/الوالدين» مناسب للألفاظ الأوسع τέκνον/τέκνα/γονεῖς. «إلى الموت» و«يقتلونهم» لا يفرضان إجراءً قضائيًا غير منصوص عليه. الحاشية تعرض البديل المعجمي «يخون» بوصفه احتمالًا سياقيًا لا ترجمة مفروضة.
