  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: ar
  text: أَعْطِ مَن يطلب منك، ولا تُعرِضْ عمَّن يريد أن يقترض منك.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا ترفض مَن يريد أن يقترض منك».'
    reason: بديل معجمي يوضح المعنى السياقي المحتمل لعبارة μὴ ἀποστραφῇς، بينما يحفظ المتن صورة الإعراض.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: مَن يطلب منك
  rationale: اسم الفاعل المضارع المعرَّف مستعمل استعمال الاسم للدلالة العامة على كل من يطلب؛ وهذه الصياغة عربية طبيعية وتحفظ عموم التعبير.
- source_word: δός
  choice: أَعْطِ
  rationale: فعل أمر ماضٍ من δίδωμι؛ ينقله الأمر العربي المباشر من غير إضافة قيد أو تلطيف.
- source_word: θέλοντα
  choice: مَن يريد
  rationale: اسم فاعل مضارع معرَّف مستعمل استعمال الاسم؛ و«يريد» أقرب مقابل طبيعي لـ θέλω في هذا السياق.
- source_word: ἀπὸ σοῦ
  choice: منك
  rationale: تحفظ دلالة المصدر في العبارة اليونانية وتلائم سياق الاقتراض.
- source_word: δανίσασθαι
  choice: أن يقترض
  rationale: المصدر الأوسط يدل هنا على الاقتراض، ولم يُذكر أن المطلوب مال تحديدًا، لذلك تُرك المفعول به عامًا.
- source_word: μὴ ἀποστραφῇς
  choice: لا تُعرِضْ
  rationale: نهي مباشر؛ و«لا تُعرِض» يحفظ صورة الانصراف عن الشخص مع بقاء العبارة طبيعية ومفهومة بالعربية.
theological_decisions:
- issue: مدى وصيغة وصية يسوع الأخلاقية
  choice: نقلها أمرًا ونهيًا مباشرين عامَّين من غير تلطيف أو تقييد زائد.
  alternative: تفسيرها على أنها مقصورة على مستحقين بعينهم، أو صياغة النهي تفسيرًا بمعنى «لا ترفض».
  rationale: يعرض النص وصيتين مباشرتين ضمن الموعظة على الجبل، ولا يورد في هذه الآية قيودًا على هوية السائل أو المقترض؛ لذا ينبغي إبقاء عمومهما وقوتهما مع عدم إضافة شروط غير مذكورة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كريمة. استُعمل «مَن» للعموم، وحُفظت مباشرة الأمر والنهي وصورة الإعراض في الأصل اليوناني.
