  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: ar
  text: وَإِنْ سَلَّمْتُمْ عَلَى إِخْوَتِكُمْ وَحْدَهُمْ[a]، فَمَا الَّذِي تَفْعَلُونَهُ فَوْقَ الْمُعْتَادِ؟ أَلَيْسَ الْأُمَمِيُّونَ أَيْضًا يَفْعَلُونَ الشَّيْءَ نَفْسَهُ؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُراد بـ«إخوتكم» إخوتكم وأخواتكم، أو أفراد جماعتكم؛ واليونانية تقول حرفيًا «إخوتكم».
    reason: lexical_alternative
  - marker: b
    text: '«الأمميون» هم غير اليهود؛ ويمكن أيضًا ترجمتها: «الوثنيون».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: سَلَّمْتُمْ عَلَى
  rationale: يدل الفعل على توجيه التحية، وهذه العبارة هي المقابل العربي الطبيعي الواضح من غير تحميله معنى الضيافة.
- source_word: ἀδελφοὺς
  choice: إِخْوَتِكُمْ
  rationale: يحافظ اللفظ على صيغة الجمع المذكر في اليونانية، مع إمكان أن يدل سياقيًا على أفراد الجماعة التي ينتمي إليها المخاطَبون.
- source_word: μόνον
  choice: وَحْدَهُمْ
  rationale: يبيّن قصر التحية على الإخوة، وهو تعبير عربي طبيعي في هذا التركيب.
- source_word: τί περισσὸν ποιεῖτε
  choice: فَأَيَّ شَيْءٍ فَائِقٍ تَفْعَلُونَ؟
  rationale: ينقل περισσόν معنى ما يتجاوز المعتاد أو يزيد عليه، ويحافظ على صيغة السؤال البلاغي.
- source_word: ἐθνικοὶ
  choice: الْأُمَمِيُّونَ
  rationale: يشير المصطلح في هذا السياق اليهودي إلى غير اليهود، و«الأمميون» يحفظ المقابلة القومية والعهدية دون تشديد معنى الوثنية.
- source_word: τὸ αὐτὸ
  choice: الشَّيْءَ نَفْسَهُ
  rationale: مقابل عربي صريح وطبيعي لعبارة «الأمر نفسه» في سياق الفعل.
theological_decisions:
- issue: نطاق مدلول ἀδελφοὺς في التعليم الأخلاقي
  choice: إخوتكم في المتن، مع بيان احتمال اتساع المدلول في الحاشية.
  alternative: إخوتكم وأخواتكم؛ أو أفراد جماعتكم.
  rationale: يحفظ الاختيار الصيغة المذكرة في الأصل، ولا يحسم ما إذا كان المرجع مقصورًا على الذكور أو يشمل جماعة الانتماء الأوسع.
- issue: معنى ἐθνικοὶ
  choice: الأمميون
  alternative: الوثنيون؛ أو الأمم.
  rationale: المعنى الأساسي هنا هو غير اليهود. و«الأمميون» يحفظ المقابلة السياقية دون أن يضيف حكمًا دينيًا أقوى مما يقتضيه اللفظ.
- issue: دلالة περισσόν
  choice: شيء فائق
  alternative: شيء زائد؛ أو ماذا تفعلون أكثر من غيركم؟
  rationale: يحفظ معنى تجاوز السلوك المعتاد من غير تحديد معيار المقارنة تحديدًا غير مصرح به في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «سلّمتم على» للتحية الاجتماعية، و«الأمميون» للمقابلة اليهودية/غير اليهودية. وُضعت جميع علامات الحواشي في المتن.
