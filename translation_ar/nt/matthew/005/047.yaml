review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للأصل: التحية مقصورة على جماعة المرء، ثم السؤال البلاغي، ثم المقارنة بمن هم خارج الجماعة اليهودية. «الأمميون» مقابل مناسب لـἐθνικοί، و«الشيء نفسه» ينقل τὸ αὐτό بدقة. لكن «شيء فائق» ترجمة حرفية غير مألوفة لـπερισσόν في هذا السياق.'
  naturalness: «سَلَّمْتُمْ على» و«إخوتكم وحدهم» سليمتان، لكن «فأيَّ شيءٍ فائقٍ تفعلون؟» ثقيلة وغير طبيعية في العربية المعاصرة. «فما الذي تفعلونه فوق المعتاد؟» أفصح وأوضح، ويحفظ معنى ما يتجاوز السلوك العادي من غير إضافة معيار غير مذكور في الأصل.
  terminology: «إخوتكم» يحافظ على اللفظ المذكر مع حاشية مناسبة لاتساع المرجع المحتمل. و«الأمميون» مصطلح كتابي دقيق هنا، لكن من النافع بيان المقصود في الحاشية بوصفهم غير اليهود، مع إبقاء إمكان «الوثنيين» بديلًا سياقيًا لا معنى مفروضًا على المتن.
  issues:
