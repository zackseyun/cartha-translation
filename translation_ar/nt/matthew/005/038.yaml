lexical_decisions:
- source_word: Ἠκούσατε
  choice: سمعتم
  rationale: الفعل ماضٍ في اليونانية، وهذه الصيغة العربية الطبيعية تحافظ على خطاب الجمع وعلى المدخل المألوف للاقتباس.
- source_word: ὅτι
  choice: أنَّه
  rationale: أداة تُدخل مضمون ما سمعه المخاطَبون.
- source_word: ἐρρέθη
  choice: قيل
  rationale: مبني للمجهول، ويحفظ الصياغة غير الشخصية في الأصل من غير تعيين القائل.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: عينٌ بعينٍ
  rationale: تعبير عربي موجز ومألوف للمبدأ القانوني، ويؤدي معنى المقابلة أو العوض في ἀντί.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل بين شطري العبارة المتوازية.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: سنٌّ بسنٍّ
  rationale: يحافظ على التوازي القانوني والإيقاع الموجز في الأصل.
theological_decisions:
- issue: صياغة مبدأ القصاص المقتبس
  choice: عينٌ بعينٍ، وسنٌّ بسنٍّ
  alternative: عينٌ بدل عين، وسنٌّ بدل سن
  rationale: تحفظ الصياغة المختارة المبدأ القانوني المعروف وتبقى أمينة لمعنى المقابلة في اليونانية، من غير أن تحسم هنا هل التطبيق حرفي أم تناسبي.
