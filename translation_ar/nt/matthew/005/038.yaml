  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: ar
  text: '«سمعتم أنه قيل: عينٌ بعينٍ، وسنٌّ بسنٍّ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصورة أكثر حرفية: «عينٌ بدل عين، وسنٌّ بدل سن».'
