base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: ar
  text: طُوبَى لِلَّذِينَ يَجُوعُونَ وَيَعْطَشُونَ إِلَى الْبِرِّ[a]، لِأَنَّهُمْ سَيُشْبَعُونَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العدل». قد تدل الكلمة اليونانية على البرّ، أو العدل، أو ما هو حقّ أمام الله.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: طُوبَى
  rationale: صيغة عربية راسخة وطبيعية في التطويبات، وتحفظ معنى إعلان الغبطة والبركة دون اختزاله في شعور نفسي بالسعادة.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: لِلْجِيَاعِ وَالْعِطَاشِ
  rationale: يحافظ التعبير على صورتي الجوع والعطش وعلى دلالة التطلع المتواصل، بصياغة عربية موجزة ومفهومة.
- source_word: τὴν δικαιοσύνην
  choice: إِلَى الْبِرِّ
  rationale: البرّ مقابل عربي واسع المدى لـ δικαιοσύνη، ويمكن أن يشمل الاستقامة وما هو حق أمام الله؛ ووُضع احتمال العدل في الحاشية حفظًا للاتساع الدلالي.
- source_word: ὅτι
  choice: لِأَنَّهُمْ
  rationale: تنقل لام التعليل بوضوح كون الجملة التالية سبب إعلان التطويب.
- source_word: αὐτοὶ
  choice: هُمْ في صيغة لِأَنَّهُمْ
  rationale: يظهر الضمير صراحة في العربية، من غير إضافة توكيد ثقيل مثل «هم أنفسهم» لا يقتضيه الأسلوب الطبيعي.
- source_word: χορτασθήσονται
  choice: سَيَشْبَعُونَ
  rationale: ينقل معنى الامتلاء حتى الشبع ويحفظ صورة الجوع والعطش. صيغ المبني للمجهول مثل «سيُشبَعون» أقرب شكليًا، لكن «سيشبعون» أفصح وأطبع، مع بقاء الفاعل الإلهي مفهومًا ضمنًا.
theological_decisions:
- issue: دلالة δικαιοσύνη
  choice: البرّ
  alternative: العدل، أو ما هو حق أمام الله
  rationale: لا يقتصر اللفظ اليوناني بالضرورة على صلاح الفرد ولا على العدالة الاجتماعية وحدها؛ لذلك يحفظ النص «البرّ» بوصفه لفظًا عربيًا دينيًا واسعًا، وتوضح الحاشية البدائل الممكنة دون حسم التوتر الدلالي.
- issue: المبني للمجهول في χορτασθήσονται
  choice: سيشبعون
  alternative: سيُشبَعون
  rationale: الصيغة اليونانية مبنية للمجهول وقد توحي ضمنًا بأن الله هو الذي يُشبع. اختيرت صيغة عربية طبيعية تحفظ النتيجة الموعودة دون تسمية الفاعل، فلا تُزال الإشارة اللاهوتية الضمنية ولا يُضاف ما ليس مصرحًا به.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «طوبى» لرسوخها في أسلوب التطويبات، مع إبقاء الجوع والعطش والشبع شبكةً تصويرية واحدة. تظهر علامة الحاشية [a] في المتن.
