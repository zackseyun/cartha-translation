base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: ar
  text: 'الحق أقول لك: لن تخرج من هناك قطعًا حتى تؤدي آخر كوادرانس[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الكوادرانس عملة رومانية صغيرة.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: في صيغة ἀμὴν λέγω σοι الاستهلالية، تؤدي «الحق» معنى التوكيد الرسمي المهيب بلغة عربية طبيعية، بدل إبقاء اللفظة منقولة صوتيًا.
- source_word: λέγω σοι
  choice: أقول لك
  rationale: ترجمة مباشرة وطبيعية لصيغة الخطاب، وتحافظ على سلطان القول ووضوح توجيهه إلى المخاطب المفرد.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: لن تخرج ... أبدًا
  rationale: يجمع هذا التعبير بين «لن» و«أبدًا» لنقل النفي اليوناني المؤكد οὐ μή دون صياغة عربية متكلفة.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: تدل اللفظة على الحركة ابتداءً من ذلك الموضع، و«من هناك» هي المقابل العربي الطبيعي المباشر.
- source_word: ἕως ἂν ἀποδῷς
  choice: حتى تؤدي
  rationale: تنقل «حتى» الحد المستقبلي للحالة السابقة، و«تؤدي» تلائم قضاء دين مستحق، مع بقاء معنى إتمام السداد مفهومًا من السياق.
- source_word: τὸν ἔσχατον
  choice: آخر
  rationale: تحافظ «آخر» على معنى الجزء النهائي من المبلغ بلا إضافة توكيد غير مصرح به.
- source_word: κοδράντην
  choice: فلس
  rationale: الكوادرانس قطعة نقدية رومانية بالغة الصغر؛ و«فلس» اسم عربي واضح لقطعة نقدية ضئيلة القيمة، مع توضيح العملة التاريخية المحددة في الحاشية لتجنب غرابة النقل الصوتي في المتن.
theological_decisions:
- issue: هل تُصاغ العبارة بما يحسم الصورة على أنها دينونة أخيرة أو تطهير بعد الموت أو مجرد حبس قانوني بسبب دين؟
  choice: الإبقاء على صورة الخروج وأداء آخر قطعة من الدين من غير تعيين مدلول عقائدي.
  alternative: التصريح بأنها تشير إلى الدينونة الإلهية أو إلى تطهير بعد الموت.
  rationale: النص اليوناني نفسه يقرر استحالة الخروج إلى أن يتم الأداء، لكنه لا يسمّي تفسيرًا عقائديًا بعينه؛ لذلك تحفظ الترجمة التوتر واتساع الدلالة في سياق التحذير والمصالحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت صيغة المفرد المذكر كما في اليونانية، وحُفظ التوكيد القوي في النفي دون أسلوب مهجور. وُضع مؤشر الحاشية بعد اسم القطعة النقدية التي يشرحها.
