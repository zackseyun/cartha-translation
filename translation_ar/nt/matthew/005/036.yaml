  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: ar
  text: ولا تحلف برأسك، لأنك لا تقدر أن تجعل شعرةً واحدةً بيضاءَ أو سوداءَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: ولا
  rationale: تواصل سلسلة النواهي المنسقة في السياق السابق بصياغة عربية طبيعية وموجزة.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: برأسك
  rationale: الباء هي الصياغة العربية المألوفة للشيء الذي يُقسَم به، والرأس هو المذكور في النص بوصفه متعلق القسم.
- source_word: ὀμόσῃς
  choice: تحلف
  rationale: ينقل فعل القسم في صيغة نهي مباشرة واضحة، من غير توسيعه إلى تفسير فقهي أو عقدي.
- source_word: ὅτι
  choice: لأنك
  rationale: تحفظ العلاقة السببية بين النهي وعجز الإنسان المذكور بعده.
- source_word: οὐ δύνασαι
  choice: لا تقدر
  rationale: تعبير عربي واضح يحفظ معنى عدم الاستطاعة أو القدرة.
- source_word: μίαν τρίχα
  choice: شعرةً واحدةً
  rationale: يحفظ توكيد المفرد، أي العجز عن التحكم حتى في شعرة واحدة.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: بيضاءَ أو سوداءَ
  rationale: يحافظ على تقابل اللونين الصريح في اليونانية من غير استبدال الأبيض بالرمادي أو الأسود بالداكن.
- source_word: ποιῆσαι
  choice: أن تجعل
  rationale: ينقل معنى التسبب في صيرورة الشعرة على إحدى الصفتين، وهو استعمال عربي طبيعي مع المفعول والصفة.
theological_decisions:
- issue: نطاق النهي عن الحلف
  choice: صياغة النهي بوصفه متعلقًا بالحلف بالرأس كما يرد في الآية نفسها
  alternative: تفسيره في الترجمة على أنه حظر مطلق لكل قسم، أو قصره صراحةً على صيغ القسم المراوغة
  rationale: الآية تحدد الحلف بالرأس وتعلل النهي بعجز الإنسان؛ لذلك تُبقي الترجمة نطاق العبارة وتوترها اللاهوتي من غير حسم الجدل الأوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تحلف» بدل التعبير الأطول «تُقسم قسمًا»، و«لا تقدر» للمحافظة على وضوح معنى العجز. لا حاجة إلى حاشية، لأن ترتيب الجملة العربية ينقل المعنى اليوناني بوضوح ولا توجد هنا قراءة نصية بديلة مؤثرة.
