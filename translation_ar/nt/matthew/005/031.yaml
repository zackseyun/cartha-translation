  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: ar
  text: 'وقيل أيضًا: «مَن طلَّق زوجته، فليعطها وثيقة طلاق».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن صرف زوجته، فليعطها كتاب طلاق». يمكن أن يعني الفعل اليوناني «صرف»، لكنه يشير هنا، في السياق الزوجي القانوني، إلى الطلاق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: وقيل أيضًا
  rationale: صيغة المبني للمجهول «قيل» تحفظ أسلوب إدخال القول، و«أيضًا» تؤدي وظيفة δέ الانتقالية في سياق الأقوال المتتابعة بصورة طبيعية، من غير فرض تضاد أشد مما يقتضيه السياق.
- source_word: Ὃς ἂν
  choice: مَن
  rationale: اسم الشرط «مَن» يؤدي معنى الشرط العام غير المحدد بإيجاز وفصاحة.
- source_word: ἀπολύσῃ
  choice: طلَّق
  rationale: 'مع أن الفعل قد يعني الإطلاق أو الصرف، فإن سياق الزواج وذكر وثيقة الطلاق يحددان هنا المعنى القانوني: الطلاق.'
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: زوجته
  rationale: السياق الزوجي يقتضي معنى «الزوجة» لا مطلق «المرأة»، والضمير يحفظ الإضافة الواردة في اليونانية.
- source_word: δότω αὐτῇ
  choice: فليعطها
  rationale: تحفظ لام الأمر قوة صيغة الأمر للغائب، والضمير المتصل يؤدي المفعول غير المباشر طبيعيًا في العربية.
- source_word: ἀποστάσιον
  choice: وثيقة طلاق
  rationale: الاسم يدل على مستند مكتوب يثبت الطلاق؛ و«وثيقة طلاق» تعبير عربي واضح يحفظ الطابع القانوني.
theological_decisions:
- issue: علاقة قول يسوع بحكم الطلاق في الشريعة الموسوية
  choice: صياغة العبارة بوصفها اقتباسًا قانونيًا من غير تضمين إقرار أو رفض في هذه الآية نفسها.
  alternative: تفسيرها صراحةً على أنها أمر يجيز الطلاق، أو مجرد وصف لتعليم شائع.
  rationale: الآية تمهد للمعالجة التي تأتي في الآية التالية؛ لذلك ينبغي حفظ التوتر اللاهوتي وعدم حسم موقف النص الأوسع داخل هذه الجملة التمهيدية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «وقيل أيضًا» للانتقال الطبيعي ضمن سلسلة الأقوال، و«وثيقة طلاق» لإبراز أن المقصود مستند قانوني مكتوب. وُضعت علامة الحاشية بعد الاقتباس كله لأنها تشرح عبارتين مترابطتين فيه.
