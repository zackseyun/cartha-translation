  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: ar
  text: 'أمّا أنا فأقول لكم: إن كلَّ من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل من ينظر إلى امرأة ليشتهيها».'
    reason: بديل صياغي أقرب إلى بنية الغرض اليونانية مع إيجاز عربي.
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية المترجمة «امرأة» أيضًا «زوجة»، بحسب السياق.
    reason: حفظ الاحتمال المعجمي في γυνή من غير تضييق المتن.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: أمّا أنا فأقول لكم
  rationale: يحفظ توكيد الضمير ἐγώ والمقابلة التي تفيدها δέ، بصياغة عربية فصيحة وطبيعية.
- source_word: πᾶς ὁ βλέπων
  choice: كل من ينظر
  rationale: ينقل عموم πᾶς مع اسم الفاعل، من غير زيادة تخصيص جنسي لا يصرّح به التركيب في وظيفته العامة.
- source_word: γυναῖκα
  choice: امرأة
  rationale: يمكن أن تعني γυνή امرأة أو زوجة بحسب السياق؛ واختيار «امرأة» يحفظ عموم اللفظ اليوناني، مع بيان البديل في الحاشية.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: بقصد أن يشتهيها
  rationale: ينقل معنى الغرض أو القصد في πρὸς مع المصدر المعرّف، ويعبّر «يشتهيها» بوضوح عن الرغبة الجنسية الخاطئة التي يحددها سياق الزنى.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: فقد زنى بها
  rationale: «فقد» تؤدي معنى تحقق الفعل سلفًا الذي تشير إليه ἤδη، و«زنى بها» تعبير عربي طبيعي يقابل الفعل المتعدي وضميره.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: في قلبه
  rationale: ترجمة مباشرة وطبيعية تحفظ الاستعمال الكتابي للقلب بوصفه موضع الفكر والإرادة والرغبة الباطنة.
theological_decisions:
- issue: هل تُترجم γυνή بـ«امرأة» أم «زوجة» في سياق الزنى؟
  choice: امرأة
  alternative: زوجة
  rationale: النص اليوناني لا يعيّن حالتها الزوجية صراحة. «امرأة» تحفظ سعة اللفظ، بينما يوضح سياق الزنى خطورة الفعل الأخلاقية، وتُذكر دلالة «زوجة» الممكنة في الحاشية.
- issue: هل يُفهم النظر على أنه عابر أم مقصود لإثارة الشهوة؟
  choice: بقصد أن يشتهيها
  alternative: يشتهيها / لينظر إليها بشهوة
  rationale: تركيب πρὸς τὸ مع المصدر يدل على الغرض أو الاتجاه المقصود؛ لذلك تحافظ الصياغة على عنصر القصد ولا تجعل كل رؤية عابرة مساوية للزنى الباطني.
- issue: كيفية تمثيل ἐπιθυμέω
  choice: يشتهيها
  alternative: يرغب فيها
  rationale: للفعل مجال دلالي أوسع في مواضع أخرى، لكن سياق الزنى هنا يجعل الرغبة الجنسية المحرمة ظاهرة؛ و«يشتهيها» أوضح وأطبع بالعربية من تعبير قد يبدو محايدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا أنا» لإبراز المقابلة والتوكيد، و«بقصد أن» لحفظ دلالة النية في التركيب اليوناني، مع تجنب صياغة توحي بأن مجرد النظر العابر هو المقصود.
