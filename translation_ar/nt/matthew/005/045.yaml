id: MAT.5.45
reference: Matthew 5:45
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: ar
  text: لِكَيْ تَصِيرُوا أَبْنَاءَ أَبِيكُمُ الَّذِي فِي السَّمَاوَاتِ، لأَنَّهُ يُطْلِعُ شَمْسَهُ عَلَى الأَشْرَارِ وَالأَخْيَارِ، وَيُمْطِرُ عَلَى الأَبْرَارِ وَالظَّالِمِينَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: لِكَيْ
  rationale: تؤدي معنى الغاية أو النتيجة المقصودة بوضوح وطبيعية في العربية المعاصرة.
- source_word: γένησθε
  choice: تَصِيرُوا
  rationale: تحفظ الدلالة الحركية للفعل γίνομαι، أي الصيرورة، بدل تسويته بالفعل الساكن «تكونوا».
- source_word: υἱοὶ
  choice: أَبْنَاءَ
  rationale: تنقل اللفظ اليوناني المذكر الدال على البنوة، من غير استبداله بلفظ «أولاد» الأعم.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: أَبِيكُمُ الَّذِي فِي السَّمَاوَاتِ
  rationale: ترجمة مباشرة وطبيعية، مع إبقاء جمع οὐρανοῖς الذي له مقابل عربي كتابي مفهوم وغير متكلف.
- source_word: ὅτι
  choice: لأَنَّهُ
  rationale: تبيّن أن ما يلي تعليل لما سبق، وتحافظ على الإحالة إلى الآب بوصفه فاعل الأفعال التالية.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: يُشْرِقُ شَمْسَهُ
  rationale: صياغة عربية موجزة وطبيعية تحفظ ضمير الملكية وكون الله فاعل إشراق الشمس.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: عَلَى الأَشْرَارِ وَالأَخْيَارِ
  rationale: تحوّل الصفتين المستعملتين اسميًا إلى صيغتين اسميتين واضحتين، وتحفظ المقابلة الأخلاقية.
- source_word: βρέχει
  choice: يُمْطِرُ
  rationale: المقابل العربي المباشر طبيعي مع إسناده إلى الله، فلا حاجة إلى التوسيع إلى «يرسل المطر».
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: عَلَى الأَبْرَارِ وَالظَّالِمِينَ
  rationale: «الأبرار» مقابل عربي راسخ لـ δικαίους، و«الظالمين» ينقل ἀδίκους طبيعيًا في هذا التقابل الأخلاقي؛ ويُذكر البديل الأقرب اشتقاقيًا في الحاشية.
theological_decisions:
- issue: لغة البنوة المذكرة
  choice: أَبْنَاءَ أَبِيكُم
  alternative: أولاد أبيكم
  rationale: النص اليوناني يستعمل υἱοί، ولذلك حُفظت لغة البنوة المذكرة من غير أن يُضاف إلى الآية تحديد لا تصرّح به.
- issue: دلالة γένησθε وصلتها بالبنوة
  choice: تَصِيرُوا
  alternative: تكونوا أو تظهروا أنكم
  rationale: تحفظ الترجمة معنى الصيرورة من غير أن تشرح داخل النص كيف ترتبط هذه الصيرورة بالهوية أو التبنّي؛ وبذلك تبقى مساحة التوتر التفسيري في الأصل.
- issue: تقابل δικαίους وἀδίκους
  choice: الأَبْرَارِ وَالظَّالِمِينَ
  alternative: العادلين وغير العادلين
  rationale: يحفظ الاختيار المعنى الأخلاقي العام في عربية كتابية واضحة، من غير حصر δικαιοσύνη في العدالة القضائية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة من غير تقعّر. استُعمل الضبط الجزئي لتيسير القراءة، وحُفظ التوازي الإيقاعي بين الزوجين المتقابلين. وُضعت علامة الحاشية [a] في آخر الآية لأنها تتناول تقابلين لفظيين فيها.
