- from: لِكَيْ تَصِيرُوا أَبْنَاءَ أَبِيكُمُ الَّذِي فِي السَّمَاوَاتِ، لأَنَّهُ يُشْرِقُ شَمْسَهُ عَلَى الأَشْرَارِ وَالأَخْيَارِ، وَيُمْطِرُ عَلَى الأَبْرَارِ وَالظَّالِمِينَ.[a]
