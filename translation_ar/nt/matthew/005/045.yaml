review_pass:
  verdict: revise
  source_fidelity: 'تحتاج العبارة الخاصة بالشمس إلى تصحيح: «يُشرِقُ شمسَه» لا تؤدي بوضوح في العربية معنى أن الله يُسبب شروق الشمس، وقد تُفهم على أن الله نفسه يشرق. أما «يُطلِع شمسَه» فتؤدي الفعل اليوناني ἀνατέλλει مع حفظ الفاعلية الإلهية. وسائر البنية تحافظ على الغاية في ὅπως، والصيرورة في γένησθε، ولفظ «أبناء» لـ υἱοί، وجمع «السماوات».'
  naturalness: «يُطلِع شمسَه» أفصح وأشيع في هذا السياق من «يُشرِق شمسَه». وتبقى الصياغة ميسرة وفصيحة ذات جرس كتابي طبيعي.
  terminology: «الأشرار والأخيار» و«الأبرار والظالمين» يحافظان على الزوجين المتمايزين في اليونانية؛ والأخير مقبول في الاستعمال الكتابي العربي لـ ἀδίκους. الحاشية المقترحة في المسودة تجمع بدائل غير لازمة، ومنها «الطالحين» الأقل ملاءمة للسجل الفصيح الحديث؛ لذا حذفت.
  issues:
  - severity: medium
    issue: الفعل «يُشرِقُ شمسَه»
    rationale: الفعل «أشرق» لازم في هذا الاستعمال غالبًا («أشرقت الشمس»)، ولا يعبّر بوضوح عن جعل الله الشمس تطلع. الفعل «يُطلِع» سببي طبيعي ويقابل المعنى المقصود لـ ἀνατέλλει.
  - severity: low
    issue: الحاشية المعجمية تجمع بدائل غير متوازية
    rationale: الحاشية لا تضيف معلومة نصية لازمة، وتورد «الطالحين» الأقل مناسبة من «الأشرار» في الفصحى الحديثة. حذفها أنظف ولا يفقد أي غموض في الأصل.
  revised_text: لِكَيْ تَصِيرُوا أَبْنَاءَ أَبِيكُمُ الَّذِي فِي السَّمَاوَاتِ، لأَنَّهُ يُطْلِعُ شَمْسَهُ عَلَى الأَشْرَارِ وَالأَخْيَارِ، وَيُمْطِرُ عَلَى الأَبْرَارِ وَالظَّالِمِينَ.
