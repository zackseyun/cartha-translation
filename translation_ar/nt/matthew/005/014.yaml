base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: ar
  text: أنتم نور العالم. لا يمكن أن تُخفى مدينة واقعة على جبل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بمعنى أقرب إلى الحرفية: «مدينة كائنة فوق جبل».'
    reason: بديل لفظي يبرز معنى κειμένη بوصفها كائنة أو واقعة في موضع، مع إمكان فهم ἐπάνω ὄρους بمعنى «فوق جبل».
lexical_decisions:
- source_word: Ὑμεῖς
  choice: أنتم
  rationale: الضمير اليوناني مذكور صراحةً للتوكيد، و«أنتم» ينقل الخطاب المباشر والجمع بوضوح في العربية.
- source_word: τὸ φῶς
  choice: نور
  rationale: «نور» هو المقابل العربي الطبيعي في هذا الاستعمال المجازي، والإضافة إلى «العالم» تمنحه التعريف المقصود من التركيب اليوناني.
- source_word: τοῦ κόσμου
  choice: العالم
  rationale: تحافظ الإضافة «نور العالم» على علاقة المضاف إليه في اليونانية، من غير تحويلها تفسيريًا إلى «نور للعالم».
- source_word: οὐ δύναται
  choice: لا يمكن
  rationale: تعبير عربي طبيعي ينقل معنى عدم الإمكان.
- source_word: πόλις
  choice: مدينة
  rationale: هو المقابل المعتاد لـπόλις، ويحافظ على صورة القول.
- source_word: κρυβῆναι
  choice: أن تُخفى
  rationale: يحفظ صيغة المبني للمجهول ومعنى الاستتار أو الإخفاء.
- source_word: ἐπάνω ὄρους
  choice: على جبل
  rationale: ὄρος يدل على جبل أو مرتفع؛ و«جبل» هو المقابل المباشر دون تضييق المعنى إلى «تل».
- source_word: κειμένη
  choice: قائمة
  rationale: ينقل معنى كون المدينة كائنة أو واقعة في موضعها بصياغة عربية طبيعية، دون الإيحاء بحدث وضعها عمدًا.
theological_decisions:
- issue: التعريف المجازي للتلاميذ بأنهم نور العالم
  choice: أنتم نور العالم
  alternative: أنتم نور للعالم
  rationale: يحافظ النص على الاستعارة المباشرة وعلى علاقة الإضافة في الأصل، من غير توسيع تفسيري لوظيفة النور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «قائمة» لصياغة سلسة، مع إثبات البديل الحرفي «واقعة» في الحاشية.
