  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: ar
  text: 'بل ليكن كلامكم: «نعم، نعم»، أو «لا، لا». وما زاد على ذلك فهو من الشرير.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الشر». فالعبارة اليونانية τοῦ πονηροῦ يمكن أن تُفهم على نحو شخصي («الشرير») أو غير شخصي («الشر»).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: ليكن
  rationale: فعل أمر للغائب من εἰμί، وصيغة «ليكن» تنقل الحث مباشرة وبإيجاز طبيعي في العربية الفصحى.
- source_word: λόγος
  choice: كلامكم
  rationale: يشير هنا إلى ما يقوله المخاطبون في حديثهم العادي، و«كلامكم» أفصح وأطبع في هذا السياق من «كلمتكم»، مع الحفاظ على الإيجاز.
- source_word: ναὶ ναί, οὒ οὔ
  choice: «نعم، نعم»، أو «لا، لا»
  rationale: أُبقي تكرار أداتي الإيجاب والنفي كما في اليونانية للمحافظة على التوكيد والإيقاع، وأُضيفت «أو» لإظهار التقابل بوضوح.
- source_word: περισσὸν
  choice: ما زاد
  rationale: الصفة مستعملة استعمال الاسم للدلالة على ما يتجاوز الجواب البسيط المذكور، و«ما زاد» تعبير عربي موجز وطبيعي.
- source_word: τούτων
  choice: على ذلك
  rationale: يعود اسم الإشارة إلى صيغتي «نعم» و«لا» السابقتين؛ والمفرد الإشاري العربي هنا يحيل طبيعيًا إلى الأمر المذكور بمجموعه.
- source_word: ἐκ
  choice: من
  rationale: تنقل معنى المصدر أو المنشأ مباشرة.
- source_word: τοῦ πονηροῦ
  choice: الشرير
  rationale: التركيب اليوناني يحتمل معنى شخصيًا («الشرير») أو غير شخصي («الشر»). اختير المعنى الشخصي لأنه مرجح في استعمال متى، مع إثبات البديل في الحاشية.
theological_decisions:
- issue: هل τοῦ πονηροῦ شخصي بمعنى «الشرير» أم غير شخصي بمعنى «الشر»؟
  choice: الشرير
  alternative: الشر
  rationale: العبارة مبهمة نحويًا، لكن استعمال متى يرجح أحيانًا الإشارة الشخصية إلى الشرير. حُفظ الاحتمال غير الشخصي في الحاشية حتى لا يُحسم التوتر الدلالي ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ الإيجاز الحكمي والتكرار اليوناني، واستُعملت «بل» لربط الوصية بما قبلها ربطًا استدراكيًا طبيعيًا.
