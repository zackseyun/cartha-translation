base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: ar
  text: ومَن أراد أن يقاضيك[a] ويأخذ قميصك[b]، فدَعْه يأخذ رداءك أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يرفع عليك دعوى». والفعل اليوناني، بصيغة المبني للمجهول، يشير في هذا السياق إلى التعرّض للحكم في نزاع قضائي.'
    reason: lexical_alternative
  - marker: b
    text: كان «القميص» ثوبًا داخليًا، أما «الرداء» فكان ثوبًا خارجيًا.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: مَن أراد
  rationale: ينقل اسم الفاعل المعرَّف المستعمل استعمال الاسم للدلالة على شخص عام، ويحفظ معنى الإرادة بصياغة عربية طبيعية.
- source_word: σοι κριθῆναι
  choice: أن يقاضيك
  rationale: الفعل في هذا السياق يدل على الدخول مع المخاطَب في خصومة قضائية. «يقاضيك» موجز وطبيعي، مع بيان الدلالة الحرفية الأوسع في الحاشية.
- source_word: χιτῶνά
  choice: قميصك
  rationale: يشير إلى الثوب الداخلي الملاصق للجسد، و«قميص» مقابل عربي مفهوم يحافظ على تمييزه من الرداء الخارجي.
- source_word: λαβεῖν
  choice: ويأخذ
  rationale: ينقل معنى نيل الثوب أو حيازته في سياق الخصومة القضائية من غير إضافة معنى الانتزاع بالقوة.
- source_word: ἄφες
  choice: فاترك له
  rationale: يحفظ قوة الأمر ومعنى التنازل له عن الرداء، من غير تحويل العبارة إلى مصطلح قانوني تقني.
- source_word: ἱμάτιον
  choice: رداءك
  rationale: يدل على الثوب الخارجي، و«رداء» يحفظ المقابلة التاريخية والدلالية مع القميص الداخلي.
- source_word: καὶ ... καὶ
  choice: و... أيضًا
  rationale: تحفظ الواو الربط، وتنقل «أيضًا» القوة الإضافية في تقديم الرداء فوق القميص.
theological_decisions:
- issue: القوة الأخلاقية لأمر يسوع في خصومة قضائية
  choice: صياغته أمرًا مباشرًا بالتنازل السخي غير الانتقامي
  alternative: صياغته مبدأً عامًا مجردًا عن التنازل عن الحقوق
  rationale: صيغة الأمر ἄφες وصورة الثوبين الملموسة تحفظان حدة التعليم وواقعيته، من غير تقييده بمنظومة مذهبية أو إفراغه في تعميم مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «يقاضيك» لطبيعته ودقته السياقية، مع إبقاء الدلالة القضائية الأوسع في الحاشية. وحُفظت المقابلة الثقافية بين القميص الداخلي والرداء الخارجي.
