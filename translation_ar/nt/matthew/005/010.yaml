base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: ar
  text: طوبى للمضطهدين من أجل البرّ[a]، لأن لهم ملكوت السماوات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل». يمكن للكلمة اليونانية أن تشمل الاستقامة الأخلاقية والوفاء للعهد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: طوبى
  rationale: صيغة عربية راسخة وطبيعية في التطويبات، تعبّر عن إعلان الغبطة والبركة لا عن مجرد شعور ذاتي بالسعادة.
- source_word: οἱ δεδιωγμένοι
  choice: للمضطهدين
  rationale: اسم المفعول مع أل التعريف ينقل الاستعمال الاسمي للمشاركة اليونانية المبنية للمجهول، وتوحي الصيغة العربية بحال من وقع عليهم الاضطهاد من غير إثقال العبارة بزمن لا يصرّح به السياق العربي.
- source_word: ἕνεκεν
  choice: من أجل
  rationale: تؤدي معنى السببية، ويمكنها هنا أيضًا أن تحتفظ بإيحاء «في سبيل» البرّ دون حصر العبارة في دافع المضطهِدين وحده.
- source_word: δικαιοσύνης
  choice: البرّ
  rationale: المقابل العربي الكتابي والطبيعي الذي يشمل الاستقامة والسلوك الموافق لإرادة الله، مع إثبات «العدل» بوصفه احتمالًا دلاليًا في الحاشية.
- source_word: ὅτι
  choice: لأن
  rationale: تبيّن سبب إعلان التطويب بوضوح في العربية المعاصرة.
- source_word: αὐτῶν
  choice: لهم
  rationale: صياغة عربية موجزة وطبيعية تفيد أن الملكوت يخصهم أو يعود إليهم.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: يحافظ «ملكوت» على معنى المُلك والسيادة، وتبقي «السماوات» جمع الأصل اليوناني وتوافق التعبير المتّى العربي المألوف.
theological_decisions:
- issue: دلالة δικαιοσύνη
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» أوسع ملاءمةً لسياق متّى، إذ يمكن أن يدل على الاستقامة والحياة الموافقة لإرادة الله؛ أما «العدل» فدلالة حقيقية محتملة لا ينبغي إلغاؤها، ولذلك حُفظت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع استعمال الصياغة المألوفة للتطويبات. جرى تجنب التفسير الطائفي، والحفاظ على سعة معنى «البرّ» وإمكان «العدل» في الحاشية.
