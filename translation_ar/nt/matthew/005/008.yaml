  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: ar
  text: طُوبَى لِأَنْقِيَاءِ الْقَلْبِ[a]، لِأَنَّهُمْ سَيَرَوْنَ اللهَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أطهار القلب».'
    reason: lexical_alternative
  - marker: b
    text: قد يشير الوعد «سيرون الله» إلى الدخول المباشر إلى حضرة الله، بما في ذلك اكتماله في المستقبل؛ وتُبقي الترجمة العبارة على اتساعها من غير حصر معناها.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: طُوبَى لِـ
  rationale: صيغة عربية راسخة وطبيعية في التطويبات، تعبّر عن الغبطة والحظوة الإلهية من غير اختزال المعنى في شعور السعادة.
- source_word: καθαροὶ
  choice: أَنْقِيَاء
  rationale: ينقل المعنى الأخلاقي والباطني للنقاوة في هذا السياق؛ و«أطهار» بديل ممكن، لكنه قد يوحي بدرجة أكبر بالطهارة الشعائرية.
- source_word: τῇ καρδίᾳ
  choice: الْقَلْبِ
  rationale: جاءت في تركيب الإضافة العربي «أنقياء القلب»، وهو تعبير طبيعي يدل على نقاوة الإنسان في باطنه، لا على العاطفة وحدها.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تبيّن علة التطويب أو أساسه بوضوح في العربية المعاصرة.
- source_word: αὐτοὶ
  choice: هُمْ
  rationale: الضمير المنفصل يحفظ توكيد اليونانية، فيبرز أن هؤلاء أنفسهم هم الذين ينالون الوعد.
- source_word: τὸν θεὸν
  choice: اللهَ
  rationale: ترجمة مباشرة للمفعول به، بصياغة عربية طبيعية.
- source_word: ὄψονται
  choice: سَيَرَوْنَ
  rationale: ينقل صيغة المستقبل والوعد المباشر من غير توسيع تفسيري.
theological_decisions:
- issue: معنى «سيرون الله»
  choice: الإبقاء على العبارة المباشرة «سيرون الله»
  alternative: سيختبرون حضور الله؛ أو سيعاينون الله في الاكتمال الآتي
  rationale: تحتمل العبارة الدخول المباشر إلى حضرة الله، بما يشمل اكتمال الوعد في المستقبل، لكن النص اليوناني موجز ولا يحدد الكيفية أو الزمن بأكثر من صيغة المستقبل؛ لذلك تُحفظ سعته ولا يُحصر في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم تركيب «طوبى لأنقياء القلب» المألوف والطبيعي، مع الحفاظ على إيجاز التطويبة وتوكيد الضمير في جوابها.
