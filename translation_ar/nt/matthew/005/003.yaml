  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: ar
  text: طُوبَى لِلْفُقَرَاءِ فِي الرُّوحِ[a][b]، لِأَنَّ لَهُمْ مَلَكُوتَ السَّمَاوَاتِ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «هنيئًا لـ» أو «ما أسعد». تدل الكلمة اليونانية على حال جديرة بالغبطة تنشأ من الحظوة الإلهية، لا على مجرد شعور بالسعادة.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تُفهم عبارة «الفقراء في الروح» بمعنى «الفقراء روحيًّا» أو «الذين يدركون احتياجهم الروحي». يُبقي المتن التعبير اليوناني من غير حصر معناه في تفسير واحد.
    reason: alternative_reading
  - marker: c
    text: 'حرفيًّا: «ملكوت السماوات»، وهو تعبير مميز في إنجيل متّى. أبقى المتن صيغة الجمع الواردة في اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: طُوبَى لِـ
  rationale: صيغة عربية راسخة وطبيعية في التطويبات، تدل على حال المغبوطين الذين نالوا الحظوة الإلهية، لا على مجرد شعور عابر بالسعادة.
- source_word: οἱ πτωχοὶ
  choice: الفقراء
  rationale: يحفظ معنى الفقر والعوز والقوة الاسمية للصفة المعرّفة، من غير تضييقها إلى معنى المتسولين.
- source_word: τῷ πνεύματι
  choice: في الروح
  rationale: يحافظ على إيجاز العبارة اليونانية وانفتاحها الدلالي، ولا يعيّن الروح القدس لأن الأصل لا يصرّح بذلك.
- source_word: ὅτι
  choice: لأنَّ
  rationale: تقدّم بوضوح علة التطويب في عربية معاصرة سليمة.
- source_word: αὐτῶν ἐστιν
  choice: لهم
  rationale: تركيب عربي طبيعي يفيد الملكية في الزمن الحاضر ويحافظ على تقديم الضمير في الأصل للتوكيد، من غير تحويل الوعد إلى المستقبل.
- source_word: ἡ βασιλεία
  choice: ملكوت
  rationale: اللفظ العربي الكتابي المألوف الذي يستوعب دلالتي الحكم والمملكة في هذا السياق.
- source_word: τῶν οὐρανῶν
  choice: السماوات
  rationale: يحفظ صيغة الجمع الواردة في التعبير المتّاوي المميز، وهي فصيحة ومألوفة في العربية.
theological_decisions:
- issue: معنى «الفقراء في الروح»
  choice: إبقاء العبارة «الفقراء في الروح» من غير توسيع تفسيري
  alternative: الفقراء روحيًّا؛ المتواضعون؛ الذين يدركون احتياجهم الروحي
  rationale: العبارة الأصلية غنية ومفتوحة نسبيًّا، وأي توسيع في المتن قد يحسم معنى تركه اليوناني ضمنيًّا.
- issue: زمن امتلاك الملكوت
  choice: 'صيغة الحاضر: «لهم ملكوت السماوات»'
  alternative: سيكون لهم ملكوت السماوات
  rationale: الفعل اليوناني في الحاضر، فلا ينبغي تحويل دلالته إلى مكافأة مستقبلية فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وكتابية مألوفة. استُعمل الضبط الجزئي في «طُوبَى» لتيسير القراءة، وحُفظت العبارة اللاهوتية المفتوحة «في الروح» وصيغة الحاضر.
