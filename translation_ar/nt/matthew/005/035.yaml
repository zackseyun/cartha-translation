source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: ar
  text: ولا بالأرض[b]، لأنها موطئ قدميه؛ ولا بأورشليم[a]، لأنها مدينة الملك العظيم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «إلى أورشليم» أو «نحو أورشليم»، لكن حرف الجر يُستعمل هنا اصطلاحيًا في صيغة القَسَم بمعنى «بأورشليم».'
    reason: lexical_alternative
  - marker: b
    text: 'تلميح إلى إشعياء 66:1: «الأرض موطئ قدميّ».'
    reason: cross_reference
  - marker: c
    text: تلميح إلى مزمور 48:2، حيث تُدعى أورشليم «مدينة الملك العظيم».
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: ولا
  rationale: تواصل أداة النفي سلسلة المحظورات الواردة في السياق السابق، و«ولا» هي الصياغة العربية الطبيعية المناسبة للتنسيق بين عناصرها.
- source_word: ἐν τῇ γῇ
  choice: بالأرض
  rationale: تؤدي ἐν هنا وظيفة اصطلاحية في صيغة القَسَم، ولذلك تنقل الباء العربية معنى الحلف بشيء بوضوح وطبيعية.
- source_word: γῇ
  choice: الأرض
  rationale: المقابلة مع السماء وأورشليم في السياق تدل على الأرض عامة، لا على إقليم بعينه.
- source_word: ὅτι
  choice: لأنها
  rationale: تقدم ὅτι علة النهي، و«لأنها» تحافظ على العلاقة السببية بوضوح.
- source_word: ὑποπόδιόν ... τῶν ποδῶν αὐτοῦ
  choice: موطئ قدميه
  rationale: صياغة عربية واضحة وموجزة تنقل صورة مسند القدمين وتحافظ على صدى التعبير الكتابي.
- source_word: εἰς Ἱεροσόλυμα
  choice: بأورشليم
  rationale: مع أن εἰς ذات دلالة اتجاهية في أصلها، فإنها تعمل هنا اصطلاحيًا في سياق القَسَم؛ لذا فالباء أوضح في العربية، مع بيان اللفظ الحرفي في الحاشية.
- source_word: πόλις ... τοῦ μεγάλου βασιλέως
  choice: مدينة الملك العظيم
  rationale: تنقل الإضافة اليونانية وصياغتها المهيبة نقلًا مباشرًا وطبيعيًا، وتحفظ التلميح إلى المزمور.
theological_decisions:
- issue: مرجع الضمير في «قدميه»
  choice: إبقاء المرجع ضمنيًا كما في اليونانية، مع دلالة السياق على الله
  alternative: التصريح بقول «قدمي الله»
  rationale: لا يسمّي النص اليوناني مرجع αὐτοῦ في هذه العبارة نفسها، وإن كان السياق والتلميح إلى إشعياء يدلان عليه؛ لذلك يحافظ الضمير على بنية المصدر دون إزالة ما فيه من ضمنية.
- issue: هوية «الملك العظيم»
  choice: إبقاء اللقب كما ورد دون إضافة تفسير داخل المتن
  alternative: التصريح بأنه الله
  rationale: يحفظ هذا الاختيار صياغة النص والتلميح إلى مزمور 48، من غير إدخال تفسير زائد في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت صيغة القَسَم الطبيعية بالباء، مع حفظ اختلاف حرف الجر اليوناني في حاشية، وتُركت الإشارات اللاهوتية الضمنية بلا توسع تفسيري داخل المتن.
