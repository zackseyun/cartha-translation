id: MAT.5.16
reference: Matthew 5:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: ar
  text: هكذا فليُضِئْ نوركم أمام الناس، لكي يروا أعمالكم الحسنة ويمجِّدوا أباكم الذي في السماوات.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: هكذا
  rationale: 'تربط الآية بصورة السراج والنور السابقة، وتعبّر بإيجاز طبيعي عن الكيفية: على هذا النحو.'
- source_word: λαμψάτω
  choice: فليُضِئْ
  rationale: صيغة أمر للغائب تحافظ على قوة فعل الأمر اليوناني، والفاء تُظهر الصلة بما سبق.
- source_word: τὸ φῶς ὑμῶν
  choice: نوركم
  rationale: يحافظ على المفرد ذي الدلالة الجماعية وعلى الإضافة إلى المخاطَبين بصياغة عربية طبيعية.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: أمام الناس
  rationale: الناس تؤدي المعنى العام لـἄνθρωποι، أي البشر دون حصره في الذكور، وهي العبارة العربية الطبيعية هنا.
- source_word: ὅπως
  choice: لكي
  rationale: تعبّر بوضوح عن الغاية التي تليها أفعال بصيغة الاحتمال في اليونانية.
- source_word: ἴδωσιν
  choice: يروا
  rationale: الفعل المنصوب بعد لكي ينقل بصورة طبيعية مضمون صيغة الاحتمال اليونانية بعد ὅπως.
- source_word: τὰ καλὰ ἔργα
  choice: أعمالكم الحسنة
  rationale: الحسنة تنقل معنى καλὰ بوصف الأعمال جيدة ونبيلة، مع إبقاء ضمير الملكية الوارد في النص.
- source_word: δοξάσωσιν
  choice: يمجِّدوا
  rationale: ترجمة مألوفة ودقيقة لـδοξάζω عند توجيه المجد إلى الله.
- source_word: τὸν πατέρα ὑμῶν
  choice: أباكم
  rationale: يحافظ على لغة العلاقة وعلى ضمير المخاطَبين في صياغة عربية موجزة.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: الذي في السماوات
  rationale: يحافظ على جمع οὐρανοῖς كما في النص اليوناني، وهو تعبير عربي واضح ومألوف.
theological_decisions:
- issue: الدلالة العامة لكلمة ἀνθρώπων
  choice: أمام الناس
  alternative: أمام البشر / أمام الآخرين
  rationale: المقصود عموم البشر لا الذكور وحدهم؛ وكلمة الناس تنقل هذا المعنى دون إضافة تفسير طائفي أو تضييق لدلالة الأصل.
- issue: جمع οὐρανοῖς
  choice: الذي في السماوات
  alternative: الذي في السماء
  rationale: أُبقي الجمع الوارد في اليونانية بدل تسويته إلى المفرد التقليدي، مع بقاء العبارة طبيعية في العربية.
- issue: العلاقة بين الأعمال الصالحة وتمجيد الآب
  choice: لكي يروا أعمالكم الحسنة ويمجِّدوا أباكم
  alternative: فيروا أعمالكم الحسنة ويمجِّدوا أباكم
  rationale: تحافظ لكي على علاقة الغاية في ὅπως دون أن تفصل بين ظهور أعمال التلاميذ وتوجيه المجد إلى الآب.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «هكذا» للربط بالسياق السابق، و«الناس» للدلالة البشرية العامة، وأُبقي جمع «السماوات» موافقةً لصيغة الأصل. لا تحتاج الآية إلى حواشٍ لأن هذه الفروق أمكن تمثيلها بوضوح في المتن.
