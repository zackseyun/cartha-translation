  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: ar
  text: 'أمّا أنا فأقول لكم: أحبّوا أعداءكم، وصلّوا من أجل الذين يضطهدونكم.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وصلّوا لصالح الذين يضطهدونكم».'
    reason: يبين أن ὑπέρ مع المضاف إليه قد يحمل معنى العمل لمصلحة الآخرين أو نيابةً عنهم، من غير إثقال المتن.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: أمّا أنا فأقول لكم
  rationale: يحفظ إبراز الضمير ἐγώ وقوة المقابلة التي تفيدها δέ، بصياغة عربية فصيحة وطبيعية.
- source_word: ἀγαπᾶτε
  choice: أحبّوا
  rationale: ينقل فعل الأمر مباشرة من غير حصر المحبة في شعور أو سلوك بعينه، ومن غير تحميل صيغة المضارع دلالة زمنية زائدة.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: أعداءكم
  rationale: ترجمة موجزة ومباشرة تحفظ معنى العداوة العلائقية في ἐχθρός.
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: المقابل العربي الطبيعي لفعل الأمر من προσεύχομαι، ويحفظ قوة التكليف دون صياغة متكلفة.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: ينقل معنى الصلاة لأجل أشخاص ولمصلحتهم، وهو أوضح في العربية المعاصرة من «عن» التي قد تلتبس بدلالات أخرى.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: الذين يضطهدونكم
  rationale: يحفظ الطابع الفعلي لاسم الفاعل اليوناني وإمكان دلالته على فعل متكرر أو مستمر، بدل اختزاله في اسم جامد مثل «مضطهديكم».
theological_decisions:
- issue: مدى الوصية بمحبة الأعداء
  choice: 'نقل الأمرين كما وردا: محبة الأعداء والصلاة من أجل المضطهِدين، دون شرح نوع المحبة أو مضمون الصلاة.'
  alternative: تفسير المحبة بأنها إحسان عملي فقط، أو تحديد الصلاة بأنها طلب بركة المضطهِدين أو توبتهم.
  rationale: النص يثبت الوصيتين بقوة لكنه لا يفصّل هنا جميع تطبيقاتهما أو يحدد المطلوب طلبه في الصلاة؛ لذلك تُترك سعة العبارة وتوترها الأخلاقي كما هما.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «أمّا أنا» لإظهار توكيد الضمير والمقابلة، و«من أجل» لتجنب الالتباس الممكن في «صلّوا عن». وُضعت علامة الحاشية عند العبارة التي تشرحها.
