source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: ar
  text: فاترك قربانك هناك أمام المذبح، واذهب أولًا وتصالح مع أخيك[a]، ثم تعال وقدِّم قربانك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني مفرد مذكر، أي «أخيك»؛ وقد ينطبق مبدأ المصالحة في هذا السياق على العلاقات بوجه أعم.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: فاترك
  rationale: يفيد الفعل هنا إبقاء القربان في موضعه، لا الغفران أو السماح؛ و«اترك» هو المقابل العربي الطبيعي في هذا السياق المكاني.
- source_word: ἐκεῖ
  choice: هناك
  rationale: يحفظ الإشارة المكانية الصريحة إلى موضع القربان.
- source_word: τὸ δῶρόν σου
  choice: قربانك
  rationale: يدل δῶρον هنا على عطية تُقدَّم لله، و«قربان» أوضح في سياق المذبح من «هدية»، مع الحفاظ على دلالة التقدمة التعبدية.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: أمام المذبح
  rationale: صياغة عربية مباشرة تحفظ العلاقة المكانية في اليونانية.
- source_word: ὕπαγε πρῶτον
  choice: واذهب أولًا
  rationale: يحفظ الأمر بالحركة وأولوية المصالحة قبل تقديم القربان.
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: وتصالح مع أخيك
  rationale: «تصالح مع» تعبير عربي طبيعي يؤدي معنى الدخول في علاقة مصالحة، ويحفظ الطابع المتبادل الذي يفهم من السياق من غير تحديد كيفية تحقق المصالحة.
- source_word: καὶ τότε ἐλθὼν
  choice: ثم تعال
  rationale: ينقل الترتيب الزمني، ويصوغ اسم الفاعل اليوناني في صورة فعل عربي تابع طبيعي.
- source_word: πρόσφερε
  choice: وقدِّم
  rationale: فعل عربي مألوف لتقديم القرابين، ويحافظ على معنى الفعل التعبدي في هذا السياق.
theological_decisions:
- issue: دلالة ἀδελφός في سياق أخلاقي يتعلق بالعلاقات
  choice: أخيك
  alternative: أخيك أو أختك؛ قريبك؛ أخوك في الإيمان
  rationale: اللفظ اليوناني مفرد مذكر، ولذلك حُفظ بصيغة «أخيك» دون توسيعه داخل المتن. وتوضح الحاشية أن المبدأ الأخلاقي قد يمتد في السياق إلى العلاقات بوجه أعم، من غير إدخال هذا التفسير في نص الآية.
- issue: صيغة الأمر في διαλλάγηθι وعلاقة طرفي المصالحة
  choice: تصالح مع أخيك
  alternative: صالِح أخاك؛ كن مصالحًا لأخيك
  rationale: الصيغة اليونانية أمر مبني للمجهول من حيث الشكل، لكن المقصود الدخول في حالة مصالحة. «تصالح مع» تحافظ على البعد العلائقي ولا تنسب اللوم أو المبادرة حصرًا إلى أحد الطرفين.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «قربان» لاتساقه الطبيعي مع «المذبح»، و«تصالح مع» لسلامته في الاستعمال المعاصر ولحفظ المعنى العلائقي دون حل التوتر المتعلق بمسؤولية كل طرف.
