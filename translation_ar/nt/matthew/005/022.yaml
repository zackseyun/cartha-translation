source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: ar
  text: 'أمّا أنا فأقول لكم: إنّ كلَّ من يغضب على أخيه يكون مستوجبًا الدينونة[a]؛ ومن يقول لأخيه: «راقا»[b]، يكون مستوجبًا للمحاكمة أمام المجلس[c]؛ ومن يقول: «يا أحمق»، يكون مستوجبًا نار جهنّم[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تضيف بعض المخطوطات بعد «يغضب على أخيه» عبارة «بلا سبب»، لكن أقدم الشواهد وأقواها تأييدًا تحذفها.
    reason: textual_variant
  - marker: b
    text: '«راقا» لفظ آرامي للتحقير، ومعناه التقريبي: «فارغ الرأس» أو «عديم القيمة».'
    reason: cultural_note
  - marker: c
    text: يمكن أن يُفهم «المجلس» على أنه «السنهدريم»، أي المجلس اليهودي الحاكم.
    reason: alternative_reading
  - marker: d
    text: '«جهنّم» تنقل مصطلحًا مرتبطًا بوادي هنوم وصورته الدالة على الدينونة؛ ويمكن ترجمة العبارة أيضًا: «جحيم النار».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: أمّا أنا فأقول لكم
  rationale: يحفظ توكيد الضمير ἐγώ والمقابلة التي تفيدها δέ، بصياغة عربية طبيعية رصينة.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: كلَّ من يغضب
  rationale: ينقل دلالة اسم الفاعل المضارع العامة من غير تقييد الغضب بلحظة ابتدائه أو استمراره.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: على أخيه
  rationale: تعبير عربي طبيعي مع فعل الغضب، ويحافظ على المفرد المذكر الوارد في اليونانية من غير تضييق القوة التمثيلية للقول.
- source_word: ἔνοχος ἔσται
  choice: يكون مستوجبًا
  rationale: ينقل معنى التعرض للمساءلة أو العقوبة ضمن الصور القضائية المتصاعدة في الآية.
- source_word: τῇ κρίσει
  choice: الدينونة
  rationale: تحافظ على إمكان فهم اللفظ بوصفه حكمًا أو إجراءً قضائيًا، من غير حصره في محكمة محلية بعينها.
- source_word: Ῥακά
  choice: راقا
  rationale: نقل صوتي للفظ الآرامي الذي أبقاه النص اليوناني، مع شرح دلالته الازدرائية في الحاشية.
- source_word: τῷ συνεδρίῳ
  choice: حكم المجلس
  rationale: يبين وجه التعلّق القضائي في العربية، ويترجم اللفظ العام «المجلس» دون الجزم بأنه اسم علم للمجمع اليهودي الأعلى.
- source_word: Μωρέ
  choice: يا أحمق
  rationale: ينقل صيغة النداء والإهانة المباشرة، ويحفظ القوة الأخلاقية للفظ من غير استعمال تعبير عامي أو طبي مضلل.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: نار جهنّم
  rationale: صياغة عربية واضحة تحفظ المصطلح التاريخي جهنّم وصورة النار، مع تجنب تحميله تفصيلات لاهوتية لاحقة لا يصرح بها التركيب.
theological_decisions:
- issue: قراءة العبارة المتعلقة بالغضب
  choice: من يغضب على أخيه
  alternative: من يغضب على أخيه بلا سبب
  rationale: يحذف نص SBLGNT عبارة «بلا سبب»، وهي قراءة تشهد لها مخطوطات أخرى؛ لذلك لا تُدرج في المتن ويُنبَّه إليها في الحاشية.
- issue: دلالة γέεννα
  choice: جهنّم
  alternative: الجحيم
  rationale: «جهنّم» هي المقابل العربي التاريخي الأقرب للمصطلح المنحدر من وادي هنوم، وتحفظ خلفيته الخاصة بدل إذابته في لفظ عام.
- issue: مدى ἀδελφός
  choice: أخيه
  alternative: أخيه أو أخته / قريبه
  rationale: يحافظ المتن على المفرد المذكر في الأصل، مع بقاء إمكان استعماله استعمالًا تمثيليًا أوسع دون فرض معنى «المؤمن» أو الأخ الجسدي وحده.
- issue: هوية συνέδριον
  choice: المجلس
  alternative: السنهدريم / المجمع اليهودي الأعلى
  rationale: اللفظ يمكن أن يعني مجلسًا قضائيًا، وقد يدل على السنهدريم، لكن السياق لا يوجب حصره تقنيًا في هيئة بعينها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «مستوجبًا» للمحافظة على النسق القضائي المتكرر، ونُقل «راقا» صوتيًا مع شرحه. وُزعت علامات الحواشي في مواضعها المباشرة داخل المتن.
