source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: ar
  text: لذلك، مَن ينقض[a] واحدةً من أصغر هذه الوصايا ويعلِّم الناس أن يفعلوا كذلك، يُدعَى الأصغر في ملكوت السماوات؛ وأما مَن يعمل بها ويعلِّمها، فهذا يُدعَى عظيمًا في ملكوت السماوات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يُبطل» أو «يُرخي إلزامها». الفعل اليوناني يعني حرفيًا «يفكّ»، ويشير هنا إلى إضعاف قوة الوصية أو معاملتها كأنها غير ملزمة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: لذلك
  rationale: تنقل أداة الاستنتاج وصلتها بما سبق بعبارة عربية واضحة ورصينة.
- source_word: λύσῃ
  choice: ينقض
  rationale: في سياق الوصايا، يدل الفعل على إبطال قوة الوصية أو معاملتها كغير ملزمة. «ينقض» يحفظ الصلة بفكرة فكّ ما هو ملزم من غير حصر المعنى في مجرد ارتكاب المخالفة.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: واحدةً من أصغر هذه الوصايا
  rationale: تحفظ تركيب التبعيض وكون الوصية من الوصايا المصنفة في أدنى مرتبة.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: يعلِّم الناس أن يفعلوا كذلك
  rationale: «الناس» تؤدي الدلالة البشرية العامة لـἀνθρώπους، و«أن يفعلوا كذلك» توضح رجوع οὕτως إلى نقض الوصية.
- source_word: ἐλάχιστος κληθήσεται
  choice: يُدعَ الأصغر
  rationale: تحافظ الصيغة المبنية للمجهول على معنى «سيُدعى»، ويعبّر «الأصغر» عن المرتبة المقارنة في مقابل «عظيمًا».
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: في ملكوت السماوات
  rationale: صياغة عربية مفهومة تحفظ جمع «السماوات» والتعبير المتكرر المميز في إنجيل متى.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: يعمل بها ويعلِّمها
  rationale: «يعمل بها» تعبير عربي طبيعي عن تنفيذ الوصايا، مع إبقاء التعليم بها في الشق المقابل.
- source_word: οὗτος
  choice: فهذا
  rationale: يحفظ اسم الإشارة توكيد المقابلة بين الشخصين بدل اختزاله إلى ضمير.
- source_word: μέγας
  choice: عظيمًا
  rationale: المقابل المباشر للصفة، من غير تحويلها إلى صيغة تفضيل أو إلى رتبة اصطلاحية.
theological_decisions:
- issue: دلالة «الأصغر/عظيمًا» في الملكوت
  choice: إبقاء الكلام عن المنزلة داخل ملكوت السماوات كما يورده النص
  alternative: تفسير «الأصغر» على أنه مستبعد من الملكوت، أو جعل «عظيمًا» رتبة فنية محددة للثواب
  rationale: النص يقول إن الشخص يُدعى الأصغر «في» الملكوت، ولا يصرّح بإخراجه منه ولا يحدد نظامًا لدرجات الثواب؛ لذا تُحفظ دلالته وتوتره اللاهوتي من غير حسم زائد.
- issue: مرجع الضمائر في «يعمل بها ويعلِّمها»
  choice: إظهار أن المفعول هو الوصايا
  alternative: ترك الفعلين بلا مفعول ظاهر أو قصرهما على وصية واحدة
  rationale: السياق يجعل الوصايا هي المفعول المفهوم، والجمع العربي يبين ذلك طبيعيًا من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «الناس» للدلالة العامة الطبيعية على البشر، وحُفظ التعبير المتّاوي «ملكوت السماوات» مع المقابلة المؤكدة في «فهذا».
