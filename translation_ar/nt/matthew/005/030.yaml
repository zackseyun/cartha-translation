source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: ar
  text: وإن كانت يدك اليمنى تُعثِرك[a]، فاقطعها وألقِها بعيدًا عنك. فخيرٌ لك أن يهلك عضوٌ واحد من أعضائك، ولا يذهب جسدك كله إلى جهنم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجعلك تخطئ». الفعل اليوناني يعني حرفيًا التسبب في التعثر.'
    reason: lexical_alternative
  - marker: b
    text: «جهنم» من اسم وادي هنوم، واستُعملت للدلالة على الدينونة الأخروية.
    reason: historical_context
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: يدك اليمنى
  rationale: تعبير عربي طبيعي ودقيق يحفظ التحديد الجسدي والموازاة البلاغية مع الآية السابقة.
- source_word: σκανδαλίζει
  choice: تُعثِرك
  rationale: يحفظ صورة التعثر في اليونانية، مع بيان دلالتها الأخلاقية المحتملة في الحاشية بدل إحلال التفسير محل الصورة.
- source_word: ἔκκοψον
  choice: فاقطعها
  rationale: ينقل أمرًا حاسمًا ومباشرًا بقطع اليد.
- source_word: βάλε ἀπὸ σοῦ
  choice: وألقِها بعيدًا عنك
  rationale: ينقل قوة فعل الإلقاء ومعنى الإبعاد والنبذ بصياغة عربية واضحة وطبيعية.
- source_word: συμφέρει γάρ σοι
  choice: لأنه خيرٌ لك
  rationale: يعبر عن المفاضلة والمنفعة في السياق، دون إيحاء بالربح المادي.
- source_word: ἵνα ἀπόληται
  choice: أن يهلك
  rationale: يحفظ شدة فعل الفقد أو الهلاك في المقابلة بين عضو واحد والجسد كله.
- source_word: ἓν τῶν μελῶν σου
  choice: عضوٌ واحد من أعضائك
  rationale: يحفظ معنى μέλος بوصفه جزءًا من الجسد، ولا يضيقه إلى الأطراف وحدها.
- source_word: ὅλον τὸ σῶμά σου
  choice: جسدك كله
  rationale: صياغة عربية طبيعية تحفظ مقابلة الكل بعضو واحد.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: يمضي ... إلى جهنم
  rationale: يعكس فعل الذهاب والاتجاه الواردين في النص، ولا يستبدلهما بفعل مبني للمجهول مثل «يُطرح».
theological_decisions:
- issue: دلالة σκανδαλίζει
  choice: تُعثِرك
  alternative: تجعلك تخطئ
  rationale: اختيرت صياغة تحفظ استعارة التعثر، مع إتاحة المعنى الأخلاقي في الحاشية من غير تسطيح الصورة الأصلية.
- issue: ترجمة γέεννα
  choice: جهنم
  alternative: وادي هنوم
  rationale: «جهنم» هي المقابل العربي المألوف تاريخيًا للفظ اليوناني γέεννα، وتحفظ دلالته على موضع الدينونة الأخروية؛ وتوضح الحاشية خلفيته في وادي هنوم من غير اختزاله في الموضع الجغرافي وحده.
- issue: حدة الأمر بقطع اليد
  choice: الإبقاء على الأمر المباشر دون تلطيف تفسيري
  alternative: صياغته بوصفه إزالة مجازية لسبب الخطية
  rationale: النص نفسه يستخدم صورة جسدية صادمة، ولا يحسم داخل هذه الآية وحدها كيفية تطبيقها؛ لذلك تُصان حدة العبارة وتوترها بدل إدخال تفسير مذهبي في المتن.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدمت أفعال مباشرة تحافظ على حدة التحذير، مع تجنب الألفاظ القديمة غير الضرورية والتفسيرات الطائفية. جميع علامات الحواشي مثبتة في مواضعها في المتن.
