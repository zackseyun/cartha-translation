source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ar
  text: 'أمّا أنا فأقول لكم: إن كلَّ من يطلِّق زوجته، إلا بسبب سلوكٍ جنسيٍّ محرَّم[a]، يجعلها ترتكب الزنا[b]؛ ومن يتزوج مطلَّقة يزني.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «سلوك جنسي محرَّم» ترجمة للكلمة اليونانية porneia، وهي لفظ واسع يشمل السلوك الجنسي غير المشروع؛ ويمكن أيضًا ترجمتها «فجور جنسي» أو «علاقة جنسية محرَّمة».
    reason: lexical_alternative
  - marker: b
    text: 'أو، على نحو أقرب إلى صيغة اليونانية المبنية للمجهول: «يجعلها تصير زانية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: يطلِّق / مطلَّقة
  rationale: في السياق الزوجي يدل الفعل على الطلاق، لا على مجرد الإرسال أو الإطلاق، ويحافظ استعمال اللفظ نفسه على الترابط بين صيغتي الأصل.
- source_word: γυναῖκα
  choice: زوجته
  rationale: يمكن أن تعني الكلمة «امرأة» أو «زوجة»، لكن ضمير الملكية وسياق الطلاق يحددان معنى الزوجة هنا.
- source_word: παρεκτὸς λόγου πορνείας
  choice: إلا بسبب فُجور جنسي
  rationale: تفيد παρεκτός الاستثناء، وλόγου هنا بمعنى السبب أو الأمر، أما πορνεία فهي لفظ واسع للسلوك الجنسي المحرَّم، ولذلك لا تُحصر في الزنا الزوجي وحده.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: يجعلها تصير زانية
  rationale: يحافظ هذا التعبير على سببية ποιεῖ وعلى الطابع المبني للمجهول أو الصيروري في μοιχευθῆναι، من غير تحويله بلا تنبيه إلى صيغة فاعلة صريحة.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: من يتزوج
  rationale: ينقل التركيب الشرطي العام بصياغة عربية موجزة وطبيعية.
- source_word: μοιχᾶται
  choice: يزني
  rationale: هذا هو المقابل العربي الطبيعي للفعل في سياق انتهاك رابطة الزواج.
- source_word: πᾶς ὁ ἀπολύων
  choice: كل من يطلِّق
  rationale: ينقل العموم في التركيب اليوناني، بينما يوضح لفظ «زوجته» الإطار الاجتماعي الذكوري الوارد في النص.
theological_decisions:
- issue: دلالة عبارة الاستثناء παρεκτὸς λόγου πορνείας
  choice: 'صياغتها استثناءً حقيقيًا: «إلا بسبب فُجور جنسي».'
  alternative: «إلا في حالة زواج غير مشروع» أو قصر πορνεία على نوع بعينه من المخالفة الجنسية.
  rationale: يقدّم اليوناني العبارة بوصفها استثناءً صريحًا، لكنه لا يحدد هنا نطاق πορνεία تحديدًا أضيق؛ لذلك تُحفظ سعة اللفظ والتوتر التفسيري.
- issue: قوة μοιχευθῆναι بعد ποιεῖ
  choice: «يجعلها تصير زانية» في المتن.
  alternative: «يجعلها ترتكب الزنا» أو «يجعل الزنا يقع عليها».
  rationale: صيغة المصدر مبنية للمجهول في اليونانية، وقد تُفهم على نحو صيروري أو فعلي. اختيرت صياغة تحافظ بقدر معقول على هذا الجانب، مع إثبات البديل الاصطلاحي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أمّا أنا فأقول لكم» لإبراز المقابلة في ἐγὼ δὲ، واختير «فُجور جنسي» لنقل سعة πορνεία من غير حصرها في فعل واحد. وُضعت علامتا الحاشية في المتن عند العبارتين اللتين تحتاجان إلى بيان معجمي ونحوي.
