base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: ar
  text: افرحوا وابتهجوا جدًا، لأن أجركم عظيم في السماوات[a]؛ فهكذا اضطهدوا الأنبياء الذين كانوا قبلكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية هنا بصيغة الجمع: «في السماوات». وقد تنقلها بعض الترجمات بصيغة المفرد: «في السماء».'
    reason: يبين فرق الصياغة بين الجمع في اليونانية وخيار المفرد الاصطلاحي في بعض الترجمات، مع إبقاء المتن محافظًا على الجمع.
lexical_decisions:
- source_word: χαίρετε
  choice: افرحوا
  rationale: فعل أمر لجمع المخاطبين يدعو إلى الفرح الفعّال، وهذه صياغة عربية واضحة ومباشرة.
- source_word: ἀγαλλιᾶσθε
  choice: ابتهجوا جدًا
  rationale: يدل الفعل على فرح غامر يفوق دلالة χαίρετε؛ وتحافظ «ابتهجوا جدًا» على هذا التصعيد بلغة مفهومة.
- source_word: μισθὸς
  choice: أجركم
  rationale: يدل هنا على الجزاء الذي يمنحه الله بسبب احتمال الاضطهاد، و«الأجر» تعبير عربي طبيعي في هذا السياق دون حصر المعنى في أجرٍ تجاري.
- source_word: πολὺς
  choice: عظيم
  rationale: صفة خبرية تبين مقدار الأجر، و«عظيم» تلائم «الأجر» وتحفظ قوة التعبير.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: تحافظ الصياغة على جمع النص اليوناني، وهي سليمة ومألوفة في العربية.
- source_word: οὕτως
  choice: هكذا
  rationale: تحفظ دلالة الكيفية والمقارنة بين اضطهاد المخاطبين واضطهاد الأنبياء السابقين من غير إطالة تفسيرية.
- source_word: ἐδίωξαν
  choice: اضطهدوا
  rationale: يحمل الفعل هنا معنى الملاحقة العدائية والاضطهاد بحسب السياق السابق.
- source_word: τοὺς προφήτας
  choice: الأنبياء
  rationale: المقابل العربي المعتاد والواضح للأنبياء السابقين.
- source_word: τοὺς πρὸ ὑμῶν
  choice: الذين كانوا قبلكم
  rationale: ينقل بوضوح سبق الأنبياء للمخاطبين في الزمن والتاريخ.
theological_decisions:
- issue: دلالة «في السماوات»
  choice: 'الإبقاء على صيغة الجمع: «في السماوات»'
  alternative: «في السماء» بصيغة المفرد
  rationale: النص اليوناني يستعمل الجمع، والجمع طبيعي في العربية ويحفظ صورة متى اللفظية دون فرض تحديد إضافي لطبيعة موضع الأجر.
- issue: طبيعة الأجر
  choice: نقل μισθός بلفظ «الأجر» دون شرح ماهيته داخل المتن
  alternative: «المكافأة» أو إضافة أن الأجر محفوظ عند الله
  rationale: «الأجر» يحفظ مفهوم الجزاء الإلهي، بينما تجنب الإضافة يصون إيجاز النص ولا يحسم تفاصيل لا يصرح بها العدد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم فعلان متتابعان مع «جدًا» لإظهار تصاعد معنى الفرح، وحُفظ جمع «السماوات» وصيغة المقارنة الموجزة «هكذا».
