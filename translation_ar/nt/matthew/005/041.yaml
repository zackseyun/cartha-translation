lexical_decisions:
- source_word: ὅστις
  choice: ومَن
  rationale: اسم موصول يفيد التعميم ويفتتح حالة عامة؛ «ومَن» عربية طبيعية موجزة.
- source_word: ἀγγαρεύσει
  choice: يُجبرك أن تسير
  rationale: يدل الفعل على التسخير أو الإكراه على خدمة، ولا سيما بأمر ذي سلطة. وتوضح الصياغة معنى الإكراه والحركة التي يدل عليها سياق المسافة.
- source_word: μίλιον ἕν
  choice: ميلًا واحدًا
  rationale: المقصود ميل روماني؛ وتحافظ العبارة على وحدة المسافة والعدد الواردين في النص.
- source_word: ὕπαγε
  choice: فاذهب
  rationale: أمر بالمضي، و«اذهب» واضحة وطبيعية في هذا السياق.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: تنقل معنى المصاحبة مباشرة من μετά مع المجرور.
- source_word: δύο
  choice: ميلين
  rationale: ورد في اليونانية العدد «اثنين» على الحذف، ووحدة «الميل» مفهومة من العبارة السابقة؛ وإظهارها بالمثنى هو التعبير العربي الطبيعي.
theological_decisions:
- issue: الخلفية التاريخية والاجتماعية للتسخير القسري
  choice: تصوير الطلب بوصفه إكراهًا من غير ذكر الجنود الرومان في المتن
  alternative: التصريح بأن المُكرِه جندي روماني يسخّر الشخص للخدمة
  rationale: يوحي الفعل وذكر الميل بممارسة التسخير الرسمي في البيئة الرومانية، لكن النص اليوناني لا يذكر جنديًا ولا الرومان صراحة؛ لذلك تُحفظ دلالة الإكراه من غير زيادة تخصيص تاريخي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «يُجبرك» لإبراز الإكراه، مع إبقاء التلميح إلى التسخير الرسمي في الحاشية، وصيغ «ميلين» بدل محاكاة الحذف اليوناني غير الطبيعي في العربية.
