  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يُسخّرك لقطع ميل واحد». كان الفعل يُستعمل للإكراه على خدمة بأمر رسمي، ويرجَّح أنه يلمّح إلى التسخير في العهد الروماني.'
