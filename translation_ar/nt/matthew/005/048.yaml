  text: فكونوا إذن أنتم كاملين[a]، كما أن أباكم السماوي كامل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تامّين» أو «ناضجين». يمكن أن تدل الكلمة اليونانية τέλειος على التمام والنضج، إلى جانب معنى الكمال.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: فكونوا
  rationale: الفعل في صيغة المستقبل الخبرية، لكنه يؤدي هنا قوة الأمر أو الحث؛ وصيغة «فكونوا» تنقل هذه القوة بوضوح وطبيعية في العربية.
- source_word: οὖν
  choice: إذن
  rationale: تُظهر النتيجة المستخلصة من التعليم السابق، ولا سيما محبة الأعداء.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: ذِكر الضمير صراحةً في اليونانية يفيد التوكيد، ولذلك حُفظ في العربية مع أن الفعل يدل على المخاطبين.
- source_word: τέλειοι / τέλειός
  choice: كاملين / كامل
  rationale: «كامل» أقرب مقابل مباشر يحفظ تكرار اللفظ والمقارنة البلاغية بين المخاطبين والآب، مع بيان اتساع الدلالة في الحاشية.
- source_word: ὡς
  choice: كما
  rationale: تنقل أداة المقارنة بإيجاز ووضوح.
- source_word: πατὴρ ὑμῶν
  choice: أباكم
  rationale: ترجمة مباشرة لتركيب الاسم مع ضمير الملكية، وجاء منصوبًا بعد «أن».
- source_word: οὐράνιος
  choice: السماوي
  rationale: صفة منسوبة إلى السماء تعدّل «أباكم»، وتحافظ على الصياغة الوصفية في النص اليوناني.
theological_decisions:
- issue: دلالة τέλειος في الحث الأخلاقي
  choice: كاملين
  alternative: تامّين، ناضجين
  rationale: يحفظ «كاملين» قوة المطالبة الأخلاقية والمقارنة بالآب، من غير أن يحسم وحده هل المقصود كمال مطلق أم تمام المحبة وعدم انقسامها في السياق. وتعرض الحاشية الاحتمالات الدلالية الحقيقية بدل طمسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي الضمير «أنتم» للتوكيد، واستُخدم «السماوي» بوصفه صفةً مطابقة لبنية الأصل.
