  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: ar
  text: فَإِنْ أَحْبَبْتُمُ الَّذِينَ يُحِبُّونَكُمْ، فَأَيُّ أَجْرٍ لَكُمْ[a]؟ أَفَلَا يَفْعَلُ حَتَّى جُبَاةُ الضَّرَائِبِ الشَّيْءَ نَفْسَهُ؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية «أجرة» أو «مكافأة»؛ والمقصود هنا الجزاء في سياق تعليم يسوع.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: فَإِنْ
  rationale: تحفظ الفاء صلة التعليل بما سبق، وتؤدي «إنْ» معنى الشرط بعبارة عربية طبيعية.
- source_word: ἀγαπήσητε
  choice: أَحْبَبْتُم
  rationale: الفعل الماضي بعد «إنْ» أسلوب عربي فصيح للتعبير عن الشرط العام، ولا يُراد به حصر الفعل في زمن ماضٍ.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: الَّذِينَ يُحِبُّونَكُمْ
  rationale: تنقل اسم الفاعل اليوناني المستعمل للدلالة على جماعة، وتحافظ على تكرار جذر المحبة.
- source_word: τίνα μισθὸν ἔχετε
  choice: فَأَيُّ أَجْرٍ لَكُمْ
  rationale: «أجر» يقابل مجال معنى μισθός، الذي يشمل الجزاء والأجرة، كما أن تركيب «لكم» عربي طبيعي مقابل معنى الامتلاك في السياق.
- source_word: οὐχὶ καὶ
  choice: أَفَلَا ... أَيْضًا
  rationale: يصوغ السؤال البلاغي الذي يتوقع جوابًا بالإيجاب، وينقل «أيضًا» القوة الإضافية أو التوكيدية لـκαί.
- source_word: οἱ τελῶναι
  choice: جُبَاةُ الضَّرَائِبِ
  rationale: تعبير واضح ومعاصر لمن كانوا يجمعون الضرائب والرسوم في السياق الإنجيلي.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: يَفْعَلُ ... الشَّيْءَ نَفْسَهُ
  rationale: ترجمة صريحة وطبيعية لعبارة «يفعلون الأمر نفسه»، مع إفراد الفعل وفق الاستعمال العربي عند تقدمه على الفاعل الجمع.
theological_decisions:
- issue: دلالة μισθός في تعليم يسوع الأخلاقي
  choice: أجر
  alternative: مكافأة؛ أجرة؛ جزاء
  rationale: تحفظ «أجر» اتساع اللفظة اليونانية بين الأجرة والجزاء، وتناسب سياق المقابلة بين المحبة المتبادلة والسلوك الذي ينتظر جزاءً، من غير أن تفرض تصورًا آليًا للاستحقاق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم السؤال البلاغي «أفلا» لإبراز أن الجواب المتوقع هو نعم، مع الحفاظ على حدة المقارنة من غير إضافة تفسير اجتماعي إلى نص الآية.
