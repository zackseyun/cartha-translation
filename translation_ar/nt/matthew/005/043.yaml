  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: ar
  text: '«سمعتم أنه قيل[a]: أحبب قريبك، وأبغض عدوك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُردِّد الشطر الأول صدى لاويين 19:18؛ أما الشطر الثاني، «وأبغض عدوك»، فليس اقتباسًا مباشرًا من العهد القديم، بل يعكس تعليمًا متداولًا كان يسوع يصححه.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: سمعتم
  rationale: ينقل صيغة التعليم التمهيدية بوضوح وطبيعية، ويدل في السياق على تعليم سبق أن تلقّاه المخاطبون.
- source_word: ἐρρέθη
  choice: قيل
  rationale: يحافظ على صيغة المبني للمجهول من غير تعيين القائل.
- source_word: Ἀγαπήσεις
  choice: أحبب
  rationale: المستقبل اليوناني هنا يؤدي معنى الأمر في صيغة مقتبسة؛ وصيغة الأمر العربية أوضح وأطبع في نقل القوة الإلزامية.
- source_word: τὸν πλησίον σου
  choice: قريبك
  rationale: «القريب» هو المقابل العربي المألوف والدقيق في هذا السياق الأخلاقي وفي صدى لاويين 19:18.
- source_word: μισήσεις
  choice: أبغض
  rationale: ينقل الفعل اليوناني مباشرة، ويحافظ على موازاة الأمر السابق ضمن القول المنقول.
- source_word: τὸν ἐχθρόν σου
  choice: عدوك
  rationale: مقابل مباشر وطبيعي يدل على الشخص المعادي في هذا التضاد الأخلاقي.
theological_decisions:
- issue: وضع عبارة «وأبغض عدوك»
  choice: إبقاؤها جزءًا من القول الذي سمعه المخاطبون، مع توضيح وضعها في الحاشية.
  alternative: عرض القول كله كأنه اقتباس مباشر ومتساوي الأجزاء من العهد القديم.
  rationale: اليونانية تعرض قولًا منقولًا واحدًا بعد «قيل»، لكن الشطر الثاني ليس اقتباسًا مباشرًا من العهد القديم؛ لذلك يحافظ المتن على بنية القول، وتمنع الحاشية الإيحاء بأن الشطرين اقتباس كتابي مباشر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت صيغتا الأمر «أحبب» و«أبغض» لنقل قوة المستقبل ذي الدلالة الأمرية، مع إبقاء المبني للمجهول في «قيل» وعدم تحديد مصدر القول.
