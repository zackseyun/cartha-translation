lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: نقلٌ مباشر لأداة العطف البسيطة، من غير إضافة دلالة زمنية أقوى مثل «ثم».
- source_word: ἀνοίξας
  choice: فتح
  rationale: يحافظ على الصورة الأصلية المتمثلة في فتح الفم، ويصوغ اسم الفاعل الأوريستي فعلًا عربيًا طبيعيًا سبق فعل التعليم.
- source_word: τὸ στόμα αὐτοῦ
  choice: فاه
  rationale: تعبير عربي فصيح وطبيعي يحفظ العبارة الأصلية ونبرتها الوقورة التي تمهّد لكلام رسمي.
- source_word: ἐδίδασκεν
  choice: علَّمهم
  rationale: الماضي العربي هو الأنسب في السرد هنا، مع إثبات بديل أكثر حرفية في الحاشية يحافظ على الجانب الاستمراري للفعل اليوناني الناقص.
- source_word: αὐτοὺς
  choice: هم
  rationale: أُبقي الضمير كما في اليونانية من غير حصر مرجعه في التلاميذ أو الجموع.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ الصلة الحالية للفعل ويقدّم مضمون التعليم بصورة عربية فصيحة ومألوفة.
