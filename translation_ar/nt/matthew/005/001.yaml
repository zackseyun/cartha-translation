source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: ar
  text: ولمّا رأى الجموع[a]، صعد إلى الجبل. ولمّا جلس[b]، تقدّم إليه تلاميذه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وإذ رأى الجموع».'
    reason: يحافظ البديل بصورة أقرب على البنية الظرفية لاسم الفاعل اليوناني، في حين يعبّر النص الرئيس عن وظيفته الزمنية الطبيعية في العربية.
  - marker: b
    text: 'يمكن أيضًا: «وبعد أن جلس». يستعمل اليوناني هنا تركيبًا مستقلاً من ضمير واسم فاعل في حالة المضاف إليه.'
    reason: يبيّن البديل احتمال إبراز التعاقب الزمني، مع أن التركيب لا يفرض هذا الإبراز بصرامة.
lexical_decisions:
- source_word: Ἰδὼν
  choice: ولمّا رأى
  rationale: اسم فاعل ماضٍ مستعمل استعمالًا ظرفيًّا لبيان الملابسة الزمنية السابقة للفعل الرئيس. «ولمّا رأى» عربية طبيعية تحفظ الصلة بين الرؤية والصعود من غير تشديد غير لازم على التعاقب.
- source_word: δὲ
  choice: غير مترجمة على حدة
  rationale: أداة انتقال وربط خفيفة، وقد أدّت الواو في «ولمّا» وظيفتها في السياق من غير إضافة معنى الاستدراك.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: تحفظ صيغة الجمع وتشير إلى جماعات الناس المحتشدة، وهي واضحة وفصيحة في العربية المعاصرة.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: صعد إلى الجبل
  rationale: تنقل الحركة إلى أعلى باتجاه الجبل مع الحفاظ على تعريف ὄρος، وهي صياغة عربية طبيعية لا تفترض تضاريس أدق مما يذكره النص.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: ولمّا جلس
  rationale: التركيب اليوناني مضاف مطلق يفيد الملابسة الزمنية. «ولمّا جلس» يحافظ على تسلسل السرد من غير حصر الدلالة في معنى «بعد أن» الصارم.
- source_word: προσῆλθαν αὐτῷ
  choice: تقدّم إليه
  rationale: يفيد الاقتراب والمجيء إلى شخص، و«تقدّم إليه» تعبير عربي طبيعي ودقيق في هذا المقام.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: اللفظ يدل على أتباعه المتعلمين منه، و«تلاميذه» المقابل المألوف والدقيق في سياق الإنجيل.
theological_decisions:
- issue: تعريف τὸ ὄρος
  choice: الجبل
  alternative: جبل
  rationale: ورد الاسم مع أداة التعريف في اليونانية، فحُفظ التعريف من غير أن يقتضي ذلك تعيين جبل مسمّى بعينه.
- issue: الدلالة الزمنية للتركيب καθίσαντος αὐτοῦ
  choice: ولمّا جلس
  alternative: وبعد أن جلس
  rationale: يحمل التركيب علاقة زمنية أو ملابسة، لكن لا يلزم منه التشديد على تعاقب صارم؛ لذلك تُركت الدلالة على سعتها ولم تُحمّل الجلسة معنى تعليميًّا طقسيًّا لا يصرّح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، بجمل سردية طبيعية. استُعملت «الجموع» لحفظ الجمع، و«صعد إلى الجبل» للحفاظ على اتجاه الحركة وتعريف الموضع، من غير ألفاظ قديمة ثقيلة أو تفسير طائفي.
