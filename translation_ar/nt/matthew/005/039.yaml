  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: ar
  text: 'أمّا أنا فأقول لكم: لا تقاوموا الإنسان الشرير[a]، بل من لطمك على خدك الأيمن[b]، فأدر له الخد الآخر أيضًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تقاوموا الشر»؛ ويجوز أيضًا: «لا تقاوموا الشرير».'
    reason: حفظ الالتباس الحقيقي في τῷ πονηρῷ بين المحايد المجرّد والمذكر الشخصي.
  - marker: b
    text: 'أو: «على فكّك الأيمن».'
    reason: يمكن أن تدل σιαγών على الخد أو الفك، وإن كان «الخد» أنسب في سياق اللطم.
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: لا تقاوموا
  rationale: يحافظ على المعنى المباشر للفعل، أي الوقوف في وجه شخص أو مقاومته، من غير حصره في المقاومة القانونية أو الانتقام وحده.
- source_word: τῷ πονηρῷ
  choice: الإنسان الشرير
  rationale: التركيب اليوناني يحتمل الشر بمعناه المجرّد، أو شخصًا شريرًا، أو الشرير بوصفه شخصًا معيّنًا. ويرجّح المثال التالي، الذي يتحدث عن شخص يلطم المخاطَب، الإشارة إلى إنسان شرير.
- source_word: ῥαπίζει
  choice: لطمك
  rationale: يدل الفعل غالبًا على الضرب باليد، ولا سيما اللطم؛ وهذا يلائم ذكر الخد ويحفظ دلالة الإهانة.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: على خدك الأيمن
  rationale: يمكن أن تعني σιαγών الخد أو الفك، لكن «الخد» هو التعبير العربي الطبيعي في سياق اللطم، وحرف الجر «على» ينقل استعمال εἰς مع فعل الضرب.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: فحوِّل إليه الآخر أيضًا
  rationale: ينقل معنى «أدر/حوّل» بأمانة، ويُفهم «الآخر» من السياق على أنه الخد الآخر، من غير إضافة معنى تفسيري أقوى مثل «قدِّم».
- source_word: ὅστις
  choice: من
  rationale: أداة شرط عامة طبيعية في العربية تؤدي معنى «أيّ شخص» في هذا السياق.
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: أمّا أنا فأقول لكم
  rationale: تفيد الصياغة المقابلة والتوكيد الكامنين في ἐγὼ δὲ، وتحافظ على الأسلوب التعليمي الوقور.
theological_decisions:
- issue: دلالة τῷ πονηρῷ
  choice: الإشارة العامة إلى «الإنسان الشرير»
  alternative: «الشر» بمعناه المجرّد، أو «الشرير» بوصفه شخصًا معيّنًا
  rationale: العبارة ملتبسة نحويًا ودلاليًا، لكن المثال المباشر عن شخص يلطُم يرجّح المرجع البشري العام. وتُحفظ القراءات الأخرى في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمّا أنا» لإبراز المقابلة، و«لطم» بدل اللفظ الأعم «ضرب»، مع الإبقاء على إيجاز العبارة الأصلية وعدم تحويل الوصية إلى صياغة قانونية أو مذهبية.
