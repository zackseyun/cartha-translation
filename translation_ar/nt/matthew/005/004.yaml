  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: ar
  text: طُوبَى لِلْحَزَانَى[a]، لأَنَّهُمْ سَيُعَزَّوْنَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذين يحزنون». اللفظ اليوناني واسع ولا يحدّد سبب الحزن.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: طُوبَى
  rationale: تحافظ «طوبى» على الصيغة التقويمية الراسخة للتطويبات، ولا تختزل المعنى في شعور ذاتي بالسعادة.
- source_word: οἱ πενθοῦντες
  choice: لِلْحَزَانَى
  rationale: ينقل التعبير اسم الفاعل المعرّف الدال على جماعة في صياغة عربية طبيعية، مع إبقاء سبب الحزن مفتوحًا كما في اليونانية.
- source_word: ὅτι
  choice: لأَنَّهُمْ
  rationale: تنقل اللام مع «أنّ» العلاقة السببية بوضوح في العربية المعاصرة.
- source_word: αὐτοὶ
  choice: 'هُمْ (في الضمير المتصل: ـهم)'
  rationale: السياق العربي يوضح عود الضمير إلى الحزانى، أما التشديد الصريح من قبيل «هم أنفسهم» فسيبدو زائدًا؛ وتبقى المقابلة بارزة في بنية التطويب.
- source_word: παρακληθήσονται
  choice: سَيَتَعَزَّوْنَ
  rationale: صيغة عربية طبيعية تدل على نيل العزاء في المستقبل، وتحافظ دلاليًا على كون التعزية واقعة عليهم من غير تعيين فاعلها.
theological_decisions:
- issue: نطاق الحزن في التطويب
  choice: إبقاء «الحزانى» عامة من غير تحديد سبب حزنهم.
  alternative: الحزانى على خطاياهم، أو المتألمون من الفقد، أو النائحون على حال إسرائيل.
  rationale: النص اليوناني لا يذكر متعلق الحزن؛ لذلك يحفظ هذا الاختيار اتساع القول وتوتره اللاهوتي والرعوي بدل حصره في تفسير واحد.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعملت صيغة «طوبى» المألوفة في التطويبات، مع تركيب موجز وطبيعي يحافظ على عموم الحزن ووعد التعزية.
