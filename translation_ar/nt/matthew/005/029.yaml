  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: ar
  text: ولكن إن كانت عينك اليمنى تُعثِرك[a]، فاقلعها وألقِها عنك؛ لأنه خير لك أن يهلك عضو واحد من أعضائك من أن يُلقى جسدك كله في جهنم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجعلك تخطئ».'
    reason: lexical_alternative
  - marker: b
    text: «جهنم» صيغة اسم ارتبط بوادي هنوم؛ وتُستعمل تقليديًا للدلالة على الجحيم.
    reason: historical_term_clarification
lexical_decisions:
- source_word: σκανδαλίζει
  choice: تُعثِرك
  rationale: يحفظ الاستعارة اليونانية التي تصوّر الوقوع في العثرة، مع بقاء معنى الإيقاع في الخطيئة واضحًا من السياق.
- source_word: ἔξελε
  choice: فاقلعها
  rationale: صيغة أمر قوية تلائم صورة نزع العين بإلحاح، وهي أفصح وأشد من «انزعها» دون تكلف.
- source_word: βάλε ἀπὸ σοῦ
  choice: وألقِها عنك
  rationale: يحفظ قوة فعل الإلقاء ومعنى الإبعاد والانفصال الذي تؤديه العبارة ἀπὸ σοῦ.
- source_word: συμφέρει
  choice: خير لك
  rationale: تعبير عربي طبيعي موجز يؤدي معنى المنفعة والأفضلية في المقارنة.
- source_word: ἀπόληται
  choice: يهلك
  rationale: يحفظ ثقل الفعل وإمكان معنى الفقد أو الهلاك، من غير حصره في معنى الإبادة.
- source_word: ἓν τῶν μελῶν σου
  choice: عضو واحد من أعضائك
  rationale: «عضو» يشمل العين وسائر أجزاء الجسد، ويحفظ المقابلة مع الجسد كله.
- source_word: βληθῇ
  choice: يُلقى
  rationale: ينقل المبني للمجهول وقوة فعل الرمي بصياغة عربية فصيحة وطبيعية.
- source_word: γέενναν
  choice: جهنم
  rationale: «جهنم» هي الصيغة العربية المتداولة للاسم ذي الصلة بوادي هنوم، وتحفظه اسمًا مميزًا بدل استبداله بتعبير تفسيري عام مثل «النار».
- source_word: ὁ δεξιὸς
  choice: اليمنى
  rationale: يحفظ التحديد الصريح للعين اليمنى في النص اليوناني.
- source_word: δὲ
  choice: ولكن
  rationale: ينقل الاستمرار مع المقابلة الخفيفة التي تفيدها δέ في السياق السابق.
theological_decisions:
- issue: دلالة γέεννα
  choice: جهنم
  alternative: الجحيم / النار
  rationale: اختير الاسم العربي الموروث الموافق للمصطلح اليوناني المحدد، تجنبًا لتسوية دلالاته التاريخية واللاهوتية في مصطلح تفسيري أعم.
- issue: القوة المجازية للفعل σκανδαλίζω
  choice: تُعثِرك
  alternative: تجعلك تخطئ
  rationale: تحفظ الصياغة صورة العثرة في الأصل بدل حلها مباشرة في تفسير واحد، مع بيان المعنى السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «تُعثِرك» للمحافظة على الصورة الأصلية، و«فاقلعها» لنقل حدة الأمر، مع تجنب الألفاظ المذهبية التفسيرية.
