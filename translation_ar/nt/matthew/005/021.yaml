  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: ar
  text: '«سمعتم أنه قيل للقدماء[a]: لا ترتكب جريمة قتل؛ ومن يرتكب جريمة قتل يكن مستوجبًا للحكم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للذين من قديم». والمقصود أناس الأزمنة السابقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: سمعتم
  rationale: صيغة عربية طبيعية تحفظ الماضي في العبارة الخطابية وتشير إلى التعليم الذي تلقاه السامعون.
- source_word: ἐρρέθη
  choice: قيل
  rationale: يحفظ البناء للمجهول ولا يعيّن القائل بما يتجاوز النص.
- source_word: τοῖς ἀρχαίοις
  choice: للأقدمين
  rationale: يحفظ دلالة المجرور اليوناني بوصفه متلقي القول، مع الإبقاء على احتمال «للذين من قديم» في الحاشية.
- source_word: Οὐ φονεύσεις
  choice: لا تقتل
  rationale: الفعل اليوناني يدل هنا على القتل المحرّم، وفي العربية الكتابية والقانونية يفيد السياق ذلك؛ أضيفت حاشية توضيحية دفعًا لفهم القتل على إطلاقه.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: ومن يقتل
  rationale: صياغة شرطية عامة طبيعية تؤدي معنى الموصول مع ἄν وصيغة الاحتمال.
- source_word: ἔνοχος ἔσται
  choice: يكن مستوجبًا
  rationale: ينقل معنى المسؤولية والتعرض لنتيجة قضائية، لا مجرد وصف الذنب المجرد.
- source_word: τῇ κρίσει
  choice: للحكم
  rationale: يبقي المرجع قضائيًا عامًا من غير حصره في محكمة بعينها أو تفسيره سلفًا بالإدانة.
theological_decisions:
- issue: مدى دلالة وصية Οὐ φονεύσεις
  choice: لا تقتل، مع توضيح أن المقصود القتل المحرّم عمدًا
  alternative: لا ترتكب جريمة قتل
  rationale: يحافظ الاختيار على الصياغة العربية الموجزة والمألوفة، بينما تمنع الحاشية توسيع دلالة φονεύω لتشمل كل إزهاق للنفس بلا تمييز.
- issue: هوية القائل في ἐρρέθη
  choice: 'البناء للمجهول: «قيل»'
  alternative: قال الله
  rationale: النص لا يصرّح هنا بهوية القائل، ولذلك لا تُحسم المسألة تفسيريًا داخل الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدمت الفاصلة المنقوطة لعرض الوصية والنتيجة القضائية كوحدة واحدة من التعليم المنقول.
