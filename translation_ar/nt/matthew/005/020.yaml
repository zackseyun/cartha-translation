  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: ar
  text: 'فإني أقول لكم: إن لم يَفُقْ برُّكم برَّ الكتبة والفريسيين[a]، فلن تدخلوا ملكوت السماوات أبدًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عدلُكم». يمكن للكلمة اليونانية أن تدل على البر والعدل، لكن «البر» أنسب بسياق متى 5.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: فإني أقول لكم
  rationale: تنقل «γάρ» التعليل والربط بما سبق، وتحافظ «أقول لكم» على الخطاب المباشر بصياغة عربية فصيحة طبيعية.
- source_word: ἐὰν μὴ
  choice: إن لم
  rationale: تؤدي الشرط السلبي الضروري بوضوح، وهي أنسب نحويًا مع الفعل «يَفُقْ».
- source_word: περισσεύσῃ ... πλεῖον
  choice: يَفُقْ
  rationale: يفيد التركيب أن يكون البر زائدًا أو متجاوزًا لما لدى جماعة المقارنة؛ و«يفوق» موجزة وطبيعية وتحفظ معنى المقارنة.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: برُّكم
  rationale: «البر» المقابل العربي الراسخ لـδικαιοσύνη، ويشمل هنا الاستقامة وفعل ما هو مستقيم في سياق متى 5، من غير حصره في الإنصاف القضائي.
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: برَّ الكتبة والفريسيين
  rationale: أُعيدت كلمة «بر» في العربية لرفع احتمال أن تكون المقارنة بالأشخاص أنفسهم لا ببرهم. و«الكتبة» و«الفريسيون» هما الاسمان العربيان المألوفان للجماعتين.
- source_word: οὐ μὴ εἰσέλθητε
  choice: فلن تدخلوا ... أبدًا
  rationale: يجمع «لن» و«أبدًا» قوة النفي المؤكد في οὐ μή مع صياغة عربية واضحة غير عتيقة.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تحفظ العبارة الاصطلاح المتاوي المميز بصيغته العربية الكتابية المعروفة، كما أن جمع «السماوات» يقابل صيغة المصدر اليوناني.
theological_decisions:
- issue: دلالة δικαιοσύνη في سياق إنجيل متى
  choice: البر
  alternative: العدل
  rationale: يتناول السياق الاستقامة والطاعة العملية أمام الله، ولذلك يوافق «البر» مجال اللفظة هنا أكثر من «العدل». ومع ذلك تبقى دلالة العدل ممكنة معجميًا، فذُكرت في الحاشية بدل إلغائها.
- issue: طبيعة المقارنة مع الكتبة والفريسيين
  choice: أن يفوق بر التلاميذ بر الكتبة والفريسيين
  alternative: أن يكثر بر التلاميذ أكثر من الكتبة والفريسيين
  rationale: يُفهم التركيب اليوناني طبيعيًا على أنه يقارن مقدار أو نوع البر؛ وتكرار «بر» يوضح ذلك من غير تحديد الكيفية التي يفوق بها، حفاظًا على التوتر التفسيري في القول.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ملكوت السماوات» للمحافظة على اصطلاح متى المألوف، وجاء النفي «لن... أبدًا» لنقل التوكيد القوي في الأصل. تظهر علامة الحاشية [a] في المتن بعد موضع العبارة التي تتناولها.
