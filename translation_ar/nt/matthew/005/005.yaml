  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: ar
  text: طُوبَى لِلْوُدَعَاءِ[a]، لِأَنَّهُمْ سَيَرِثُونَ الْأَرْضَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحلماء»؛ والمقصود بالوداعة هنا اللطف المتواضع، لا الضعف.
    reason: lexical_alternative
  - marker: b
    text: أو «البلاد»؛ ويُرجَّح أن العبارة تردّد صدى مزمور 37:11، حيث يمكن أن يُفهَم الوعد في إطار أرض العهد وكذلك بمعنى أوسع.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: طُوبَى لِـ
  rationale: صيغة عربية كتابية راسخة وطبيعية في التطويبات، تعبّر عن نوال الحظوة والهناء من الله، ولا تختزل المعنى في شعور عابر بالسعادة.
- source_word: οἱ πραεῖς
  choice: الودعاء
  rationale: تنقل معنى اللطف المتواضع والرفق المنضبط، لا الضعف أو الجبن، كما أن الاسم المعرّف يجسّد استعمال الصفة اليونانية استعمالًا اسميًا.
- source_word: ὅτι
  choice: لأنهم
  rationale: تقدّم سبب التطويب بعبارة عربية واضحة ومباشرة.
- source_word: αὐτοὶ
  choice: هم في ضمير «لأنهم» وواو «سيرثون»
  rationale: الضمير اليوناني توكيدي، لكن إبراز «هم أنفسهم» في العربية يثقل العبارة؛ وتفيد بنية الجملة المقابلة والتركيز الطبيعي معنى الاختصاص بما يكفي.
- source_word: κληρονομήσουσι
  choice: سيرثون
  rationale: ترجمة مباشرة طبيعية تحفظ معنى نوال الميراث وصدى لغة الوعد.
- source_word: τὴν γῆν
  choice: الأرض
  rationale: «الأرض» في العربية تحتمل الأرض كلها كما قد تحتمل البلاد أو الأرض الموعودة بحسب السياق، فتحفظ سعة اللفظ اليوناني وصدى مزمور 37:11 دون حسم زائد.
theological_decisions:
- issue: نطاق معنى τὴν γῆν
  choice: الأرض
  alternative: البلاد أو الأرض الموعودة
  rationale: يمكن أن يدل اللفظ اليوناني على الأرض بمعناها الواسع أو على أرض/بلاد بعينها. واختيار «الأرض» يحافظ على الوعد الشامل المحتمل وعلى الصدى العهدي لمزمور 37:11، مع بيان الاحتمال الآخر في الحاشية.
- issue: دلالة πραεῖς
  choice: الودعاء
  alternative: الحلماء أو المتواضعون
  rationale: المقصود وداعة متواضعة ورفق، لا خنوعًا ولا ضعفًا. «الودعاء» تحفظ المصطلح الكتابي المألوف مع توضيح معناه في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت صيغة «طوبى» المألوفة في التطويبات، مع تجنّب ألفاظ قد توحي بأن الوداعة ضعف، والإبقاء على مرونة «الأرض» الدلالية.
