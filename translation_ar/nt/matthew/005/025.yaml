  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: ar
  text: كُنْ حَسَنَ النية تجاه خصمك، وبادر إلى ذلك سريعًا، ما دمتَ معه في الطريق، لئلا يسلّمك الخصم إلى القاضي، والقاضي إلى العون، فتُلقى في السجن.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: كُنْ سريعًا حَسَنَ النية تجاه
  rationale: يحافظ على معنى الاستعداد الودّي أو الموقف الإيجابي في εὐνοέω، مع صياغة عربية طبيعية نسبيًا، من غير أن يحوّله صراحةً إلى إبرام تسوية.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: خصمك / الخصم
  rationale: «الخصم» لفظ عربي واضح يلائم الطرف المنازع في السياق القضائي، ولا يحصر دوره في توجيه اتهام جنائي كما قد يفعل «المشتكي» أو «المتهم».
- source_word: ταχὺ
  choice: سريعًا
  rationale: ينقل معنى العجلة والإلحاح، ويرتبط طبيعيًا بالأمر كله.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: ما دمتَ معه في الطريق
  rationale: يحفظ صورة الطريق الملموسة ولا يضيف صراحةً أن الوجهة هي المحكمة، مع أن السياق يوحي بذلك.
- source_word: μήποτέ
  choice: لئلا
  rationale: ينقل التحذير من نتيجة محتملة بصياغة عربية فصيحة موجزة.
- source_word: παραδῷ
  choice: يسلّمك
  rationale: يعبّر بوضوح عن نقل الشخص إلى سلطة قضائية.
- source_word: κριτῇ / κριτὴς
  choice: القاضي
  rationale: المقابل العربي المباشر والواضح في هذا السياق القضائي.
- source_word: ὑπηρέτῃ
  choice: الحارس
  rationale: يشير هنا إلى الموظف التابع الذي ينفّذ أمر القاضي ويقتاد المحكوم عليه؛ و«الحارس» أوضح للقارئ العام من لفظ إداري أو تاريخي شديد التخصيص.
- source_word: εἰς φυλακὴν
  choice: في السجن
  rationale: التعبير العربي الطبيعي المقابل للإيداع في السجن.
- source_word: βληθήσῃ
  choice: تُلقى
  rationale: يحفظ القوة التصويرية للفعل βάλλω وصيغة المبني للمجهول.
theological_decisions:
- issue: هل يُصاغ الأمر الأول بوصفه تسوية قانونية صريحة أم بوصفه موقفًا حسنًا تجاه الخصم؟
  choice: 'الإبقاء في المتن على المعنى المعجمي: «كُنْ سريعًا حَسَنَ النية تجاه خصمك».'
  alternative: «بادِرْ إلى التفاهم مع خصمك» أو «تصالح سريعًا مع خصمك».
  rationale: السياق القضائي يجعل التوصل إلى اتفاق مفهومًا مرجحًا، لكن εὐνοέω يدل في أصله على حسن النية أو الميل الودّي. لذلك يحفظ المتن هذا القدر من الانفتاح، وتوضح الحاشية الصياغة الاصطلاحية المحتملة.
translation_notes:
  register: عربية فصحى حديثة، واضحة وذات نبرة وقورة. حُفظت صورة السير في الطريق وتسلسل التسليم القضائي، وتُجنّبت إضافة «إلى المحكمة» أو جعل التسوية القانونية المعنى الوحيد الممكن.
