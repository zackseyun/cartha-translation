review_pass:
  verdict: revise
  source_fidelity: المعنى العام وتسلسل الإحالة القضائية محفوظان، وكذلك صورة الطريق والتحذير. لكن موضع «سريعًا» في الصياغة الحالية («كُنْ سريعًا حَسَنَ النية») غير سليم تركيبيًا على نحوٍ قد يجعل «سريعًا» وصفًا للمتكلم بدل أن يبيّن إلحاح الأمر. كما أن «الحارس» أضيق من ὑπηρέτης في هذا التسلسل القضائي؛ فالكلمة تدل على تابع/عون ينفّذ أمر القاضي، لا على حارس سجن بالضرورة.
  naturalness: 'النص فصيح وواضح في معظمه. الصياغة المنقحة تجعل افتتاح الآية عربيًا طبيعيًا: «كُنْ حسنَ النية تجاه خصمك، وبادر إلى ذلك سريعًا». وهي تحافظ على حسن النية بوصفه المعنى الرئيس، مع إسناد السرعة بوضوح إلى المبادرة.'
  terminology: «خصم» و«قاضٍ» و«سجن» اختيارات مناسبة. استُبدل «الحارس» بـ«العون» لتفادي تخصيص غير وارد في اليونانية وللدلالة على الموظف التابع للقاضي. وحُفظت الحاشية بوصفها بديلًا اصطلاحيًا لا المعنى الوحيد للنص.
  issues:
