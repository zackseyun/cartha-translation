  to: كُنْ حَسَنَ النية تجاه خصمك، وبادر إلى ذلك سريعًا، ما دمتَ معه في الطريق، لئلا يسلّمك الخصم إلى القاضي، والقاضي إلى العون، فتُلقى في السجن.
  rationale: عُدّل ترتيب العبارة الافتتاحية لتؤدي أمر ἴσθι εὐνοῶν ومعه ταχὺ بلغة عربية واضحة، من غير تحويل المتن إلى أمر صريح بتسوية قانونية. واستُبدل المقابل الضيق لـὑπηρέτης بمقابل أوسع يلائم دوره التابع للقاضي. أُبقيت الحاشية البديلة، وأُضيف مرساها [a] إلى النص المنقح.
