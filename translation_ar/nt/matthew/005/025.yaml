    rationale: في تسلسل الخصم–القاضي–ὑπηρέτης، المقصود تابع أو عون قضائي ينفّذ الإجراء. «الحارس» قد يعيّن حارس السجن ويضيّق الدلالة قبل ذكر السجن.
