  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: ar
  text: 'أمّا أنا فأقول لكم: لا تحلفوا مطلقًا، لا بالسماء، لأنها عرش الله؛'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: أمّا أنا فأقول لكم
  rationale: يُظهر الضمير البارز ἐγώ مع δέ المقابلة والتوكيد في قول يسوع، بصياغة عربية طبيعية ورصينة.
- source_word: μὴ ὀμόσαι ὅλως
  choice: لا تحلفوا مطلقًا
  rationale: ينقل النهي ومعنى ὅλως، أي «على الإطلاق»، بوضوح من غير إضافة تفسيرية.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: لا بالسماء
  rationale: الباء هي الصياغة العربية المألوفة لأداة القسم، وتنقل المقصود من ἐν في هذا السياق.
- source_word: ὅτι
  choice: لأنها
  rationale: تُبقي الدلالة السببية المباشرة للأداة اليونانية، مع ضمير يعود إلى السماء.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: عرش الله
  rationale: ترجمة مباشرة تحافظ على صورة العرش وعلى الإضافة إلى الله.
theological_decisions:
- issue: مدى النهي عن الحلف في عبارة μὴ ὀμόσαι ὅλως
  choice: لا تحلفوا مطلقًا
  alternative: لا تحلفوا باطلًا / لا تنكثوا الأيمان
  rationale: النص هنا يصوغ نهيًا عامًا بلفظ ὅλως، ولذلك لا تُضيَّق دلالته بإضافة قيد غير مذكور. ويُترك تحديد علاقته بسائر النصوص للسياق الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع الحفاظ على المقابلة المؤكدة في صدر الآية والصورة الكتابية «عرش الله».
