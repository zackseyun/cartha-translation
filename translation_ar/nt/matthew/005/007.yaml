  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: ar
  text: طوبى للرحماء، لأنهم هم سيُرحمون[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: ستُمنح لهم الرحمة. الفعل اليوناني في صيغة المستقبل المبني للمجهول، ولا يصرّح بمن يرحمهم.'
    reason: توضيح دلالة المبني للمجهول مع الحفاظ على عدم تعيين الفاعل.
lexical_decisions:
- source_word: μακάριοι
  choice: طوبى
  rationale: صيغة عربية راسخة وموجزة في التطويبات، تدل على الغبطة والحظوة، ولا تختزل المعنى في شعور ذاتي بالسعادة.
- source_word: οἱ ἐλεήμονες
  choice: للرحماء
  rationale: الصفة المسبوقة بأداة التعريف مستعملة اسميًا بمعنى «الذين يرحمون». واختيار «الرحماء» يحفظ الإيجاز والصلة اللفظية بالفعل اللاحق.
- source_word: ὅτι
  choice: لأنهم
  rationale: تنقل الأداة السببية بوضوح في العربية المعاصرة، وتربط التطويب بسبب الوعد اللاحق.
- source_word: αὐτοὶ
  choice: هم
  rationale: أُثبت الضمير المنفصل لإظهار التوكيد في الأصل، مع بقاء العبارة طبيعية وموجزة.
- source_word: ἐλεηθήσονται
  choice: سيُرحمون
  rationale: صيغة مستقبل مبني للمجهول تحفظ جذر الرحمة والتوازي مع «الرحماء»، ولا تسمّي فاعل الرحمة الذي تركه النص غير مصرّح به.
theological_decisions:
- issue: هوية مَن يمنح الرحمة
  choice: 'الإبقاء على المبني للمجهول: «سيُرحمون»'
  alternative: «سيرحمهم الله» أو «سينالون الرحمة»
  rationale: السياق يوحي بقوة بأن الله هو المانح، لكن اليونانية لا تصرّح بالفاعل؛ لذلك يحفظ المبني للمجهول الغموض المقصود ولا يضيف تحديدًا غير وارد في النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على الإيجاز الإيقاعي لصيغة التطويبات والتكرار المقصود لجذر «رحم».
