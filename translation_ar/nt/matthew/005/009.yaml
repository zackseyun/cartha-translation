lexical_decisions:
- source_word: μακάριοι
  choice: طُوبَى لِـ
  rationale: الصيغة العربية المألوفة للتطويبات، وتعبّر عن الغبطة والحظوة لدى الله، لا عن مجرد شعور ذاتي بالسعادة.
- source_word: εἰρηνοποιοί
  choice: صانعي السلام
  rationale: 'تحافظ على دلالة الاسم المركب الفاعلية: أناس يعملون على إحلال السلام، لا من يتصفون بالمسالمة فقط.'
- source_word: ὅτι
  choice: لأنهم
  rationale: تنقل العلاقة السببية التي تقدم أساس التطويب بلغة عربية واضحة وطبيعية.
- source_word: αὐτοὶ
  choice: هم
  rationale: يؤدي الضمير المنفصل معنى التوكيد في اليونانية، وقد اندمج طبيعيًا في «لأنهم» من غير إثقال العبارة بتوكيد زائد.
- source_word: υἱοὶ θεοῦ
  choice: أبناء الله
  rationale: «أبناء» تقابل جمع υἱοί المذكر وتحفظ لغة البنوة المباشرة في النص، مع كونها في هذا السياق ذات دلالة تمثيلية شاملة.
- source_word: κληθήσονται
  choice: سيُدعون
  rationale: ترجمة مباشرة للمستقبل المبني للمجهول، من غير حصر المعنى في مجرد اعتراف اجتماعي أو تفسير هوية المدعوين.
theological_decisions:
- issue: لغة البنوة المذكرة في υἱοὶ θεοῦ
  choice: أبناء الله
  alternative: أولاد الله
  rationale: تحفظ «أبناء الله» الصياغة البنوية المذكرة في الأصل وما قد تحمله من دلالة المكانة والانتساب، فيما توضّح الحاشية أن الجمع هنا ذو قوة تمثيلية تشمل صانعي السلام من الرجال والنساء.
