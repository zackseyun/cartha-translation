  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت الصيغة التراثية المفهومة «طوبى لـ» لملاءمتها لجنس التطويبات، مع تركيب طبيعي موجز يحافظ على ترتيب الأصل وعلاقته السببية.
