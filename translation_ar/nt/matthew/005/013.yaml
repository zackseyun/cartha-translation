  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: ar
  text: «أنتم ملح الأرض. ولكن إن فقد الملح ملوحته، فبماذا يُملَّح؟ لا يعود يصلح لشيء إلا أن يُطرح خارجًا ويُداس بأقدام الناس.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: أنتم
  rationale: الضمير اليوناني الصريح يحمل توكيدًا، ويؤديه الضمير المنفصل «أنتم» طبيعيًا في العربية.
- source_word: τὸ ἅλας τῆς γῆς
  choice: ملح الأرض
  rationale: يحافظ على الصورة المجازية وعلى المعنى الواسع لكلمة γῆ في هذا السياق.
- source_word: μωρανθῇ
  choice: فقد ملوحته
  rationale: الفعل، مع الملح، يدل على زوال طعمه أو خاصيته الملحية؛ وهذه صياغة عربية واضحة وطبيعية، مع أن اللفظ اليوناني يرتبط اشتقاقيًا بمعنى الحماقة.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: فبماذا يُملَّح؟
  rationale: يحفظ صيغة الاستفهام والمبني للمجهول في الأصل، من غير أن يحدد صراحة هل الضمير يعود إلى الملح أم إلى شيء آخر.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: لا يعود يصلح لشيء
  rationale: ينقل معنى انعدام النفع أو الفاعلية بصياغة عربية معاصرة.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: إلا أن يُطرح خارجًا
  rationale: يحفظ الفعل وصورة الإخراج المكانية التي تفيدها ἔξω.
- source_word: καταπατεῖσθαι
  choice: يُداس بأقدام
  rationale: ينقل صورة الدوس بوضوح وحيوية في العربية.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: الناس
  rationale: ἄνθρωποι هنا عام للبشر، و«الناس» هو المقابل العربي الطبيعي الدال على العموم من غير تخصيص للذكور.
theological_decisions:
- issue: الدلالة العامة للفظ ἀνθρώπων
  choice: الناس
  alternative: الرجال
  rationale: السياق واللفظ يدلان على البشر عمومًا لا على الذكور وحدهم؛ والعربية تعبّر عن هذا المعنى مباشرة بلفظ «الناس».
- issue: مرجع الفعل المبني للمجهول ἁλισθήσεται
  choice: فبماذا يُملَّح؟
  alternative: فبماذا تُعاد إليه ملوحته؟
  rationale: الصياغة المختارة تحافظ على إيجاز الأصل واحتماله النحوي، بينما البديل يحسم أن المقصود استعادة ملوحة الملح.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على إيجاز القول وصورته البلاغية. استُخدم «يُطرح خارجًا» بدل التعبير الاصطلاحي الأبعد «يُرمى» لإبقاء القوة المكانية في النص اليوناني.
