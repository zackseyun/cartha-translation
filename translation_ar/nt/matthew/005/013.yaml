  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: الضمير المؤكَّد «أنتم»، واستعارة «ملح الأرض»، وفقدان الملوحة، والاستفهام المبني للمجهول، وانعدام المنفعة، والطرح إلى الخارج، والدوس من الناس. وتحافظ «فبماذا يُملَّح؟» على إيجاز الأصل وبنائه للمجهول دون تفسير زائد لمرجع الفعل.'
  naturalness: الصياغة فصيحة معاصرة واضحة وموجزة. «فقد الملح ملوحته» و«لا يعود يصلح لشيء» و«يُداس بأقدام الناس» تعبيرات طبيعية. وقد يبدو «يُملَّح» غير مألوف قليلًا مقصودًا في العربية كما في مفارقة الأصل المتعلقة بالملح، لكنه سليم ومفهوم في هذا السياق.
  terminology: «ملح الأرض» يحفظ الصورة الاصطلاحية الشائعة والأمانة لـ γῆ. و«الناس» مقابل عربي دقيق لـ ἀνθρώπων في دلالتها العامة، ولا يستلزم حاشية جندرية عربية. ولا توجد مصطلحات لاهوتية بحاجة إلى توحيد خاص في الآية.
