reference: Matthew 5:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: ar
  text: لا تظنّوا أنني جئتُ[a] لأُبطل الشريعة أو الأنبياء. ما جئتُ لأُبطل، بل لأُتمّم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «قد جئتُ» في الموضعين.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تُفهم «أُتمّم» أيضًا بمعنى «أوصل إلى التمام» أو «أُظهر على نحو كامل».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: لا تظنّوا
  rationale: صيغة نهي مباشرة وطبيعية في العربية، وتحفظ معنى النهي الذي تؤديه μή مع صيغة الماضي المنصوب في اليونانية.
- source_word: ἦλθον
  choice: جئتُ
  rationale: ينقل الفعل الماضي اليوناني بوضوح وطبيعية في سياق بيان غاية المجيء، مع الإبقاء في الحاشية على إمكان التعبير بـ«قد جئتُ».
- source_word: καταλῦσαι
  choice: لأُبطل
  rationale: المقصود هنا، مع «الشريعة أو الأنبياء»، ليس الهدم المادي، بل الإلغاء أو إبطال السلطان؛ و«أُبطل» واضحة في العربية الحديثة وتحفظ هذه الدلالة.
- source_word: τὸν νόμον
  choice: الشريعة
  rationale: تشير العبارة هنا إلى شريعة موسى بوصفها جزءًا معروفًا من أسفار إسرائيل، لا إلى قانون عام؛ و«الشريعة» أوضح للقارئ العربي المعاصر من المصطلحات الأقل تداولًا.
- source_word: τοὺς προφήτας
  choice: الأنبياء
  rationale: تحفظ اللفظة صيغة العبارة الكتابية المعروفة «الشريعة أو الأنبياء»، ويمكن أن تدل على القسم النبوي من الأسفار من غير حصرها في أفراد الأنبياء.
- source_word: ἀλλὰ πληρῶσαι
  choice: بل لأُتمّم
  rationale: «أُتمّم» تحافظ على اتساع معنى πληρόω، الذي قد يشمل التحقيق أو الإيصال إلى التمام أو الإظهار الكامل، من غير فرض تفسير لاهوتي واحد. ولم يُضف مفعول صريح لأن النص اليوناني يتركه مفهومًا من السياق.
theological_decisions:
- issue: دلالة علاقة يسوع بـ«الشريعة أو الأنبياء» في πληρῶσαι
  choice: الإبقاء على «أُتمّم» من غير تضييق معناها إلى تفسير لاهوتي واحد
  alternative: أُكمل؛ أوصل إلى غايتها؛ أُظهر معناها كاملًا؛ أُثبّت
  rationale: الفعل اليوناني واسع الدلالة في هذا السياق، والقراءات اللاهوتية تختلف في كيفية إتمام يسوع للشريعة والأنبياء. لذلك يحفظ النص الرئيس هذا التوتر، وتوضح الحاشية بعض وجوه المعنى الممكنة دون أن تحسم بينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الشريعة» بدلًا من «الناموس» لسهولة الفهم لدى القارئ المعاصر، مع الحفاظ على الصيغة الكتابية «الشريعة أو الأنبياء». ووُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما.
