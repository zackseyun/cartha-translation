  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: ar
  text: طُوبَى لَكُمْ مَتَى عَيَّرُوكُمْ[a] وَاضْطَهَدُوكُمْ، وَقَالُوا عَلَيْكُمْ كَذِبًا كُلَّ سُوءٍ[b] مِنْ أَجْلِي[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شتموكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قالوا عليكم كلَّ أنواع الشر».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بسببي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: طُوبَى لَكُمْ
  rationale: تحافظ هذه الصياغة العربية المألوفة على قالب التطويبات وثقله اللاهوتي، ولا تختزل المعنى في مجرد الحظ أو السعادة النفسية.
- source_word: ὅταν
  choice: مَتَى
  rationale: تعبّر بوضوح عن الحالة العامة المتوقعة التي تليها أفعال الاحتمال في اليونانية، وتنسجم طبيعيًا مع أسلوب التطويبات.
- source_word: ὀνειδίσωσιν
  choice: عَيَّرُوكُمْ
  rationale: ينقل معنى التوبيخ المهين والإساءة اللفظية بلفظ عربي واضح؛ ويمكن أيضًا فهمه بمعنى شتموكم.
- source_word: διώξωσιν
  choice: اضْطَهَدُوكُمْ
  rationale: يحفظ اتساع معنى المعاملة العدائية بسبب الانتماء إلى يسوع، من غير قصرها على العنف الجسدي أو الملاحقة القانونية.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: قَالُوا عَلَيْكُمْ كُلَّ سُوءٍ
  rationale: صياغة عربية طبيعية تنقل شمول الكلام الشرير الموجَّه ضد المخاطَبين، من غير تقييده بنوع واحد من الاتهام.
- source_word: ψευδόμενοι
  choice: كَذِبًا
  rationale: يؤدي وظيفة الحال في العربية ويوضح أن ما يُقال عليهم غير صحيح، مع بقاء التركيب موجزًا وطبيعيًا.
- source_word: ἕνεκεν ἐμοῦ
  choice: مِنْ أَجْلِي
  rationale: ينقل سبب الإساءة والاضطهاد، أي ارتباطهما بيسوع، ويحافظ على العبارة الموجزة ذات الدلالة الشخصية.
theological_decisions:
- issue: طبيعة المقاومة المذكورة
  choice: يشمل النص التعيير والاضطهاد والأقوال الشريرة الكاذبة التي تقع بسبب يسوع، من غير تحديد صورة واحدة للاضطهاد.
  alternative: قصر الاضطهاد على العنف الجسدي، أو قصر الآية كلها على الافتراء اللفظي وحده.
  rationale: الأفعال الثلاثة المنسقة في النص اليوناني تعرض صورًا متمايزة ومتداخلة من العداء؛ لذلك تحفظ الترجمة هذا الاتساع ولا تحسمه في نوع واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «طوبى لكم» حفاظًا على قالب التطويبات الراسخ، مع ألفاظ مفهومة للقارئ المعاصر وتراكيب غير متكلفة.
