  verdict: revise
  source_fidelity: النص ينقل البنية الأساسية ومعنى النفي المؤكد نقلًا جيدًا، بما في ذلك دوام الشريعة إلى أن يقع «كل شيء». لكن الحاشية (ب) توسّع «κεραία» إلى «نقطة»، وهي ليست المقابل الدقيق؛ فهي نتوء أو علامة كتابية دقيقة، لا نقطة بالضرورة. كما أن «علامة صغيرة» في المتن أدق وأفصح من «شرطة صغيرة» في هذا السياق.
  naturalness: «فالحق أقول لكم» فصيحة ومناسبة. واستبدال «شرطة صغيرة» بـ«علامة صغيرة» يزيل إيحاء الشرطة الطباعية الحديثة، مع الحفاظ على الصورة الكتابية المقصودة.
  terminology: «الشريعة» اختيار سليم لـ νόμος في السياق، من دون فرض تحديدٍ أضيق من اللفظ. والإبقاء على «يوتا» يحفظ التحديد المعجمي، وتشرح الحاشية وظيفتها التصويرية. ولا يلزم تغيير عبارة «إلى أن يحدث كل شيء»، إذ تبقي سعة γένηται دون ترجيح تفسيري.
