  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: ar
  text: 'فالحق أقول لكم: إلى أن تزول السماء والأرض، لن يزول أبدًا من الشريعة حرف يوتا واحد[a] ولا علامة صغيرة واحدة[b]، إلى أن يحدث كل شيء[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«يوتا» اسم حرف يوناني، ويُستعمل هنا للدلالة على أصغر عنصر حرفي؛ ويمكن ترجمة المعنى: «أصغر حرف».'
    reason: lexical_alternative
  - marker: b
    text: 'أي علامة كتابية بالغة الصغر قد تميّز حرفًا من آخر؛ ويمكن أيضًا: «نتوء صغير واحد».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «إلى أن يتم كل شيء» أو «إلى أن يتحقق كل شيء».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν γὰρ λέγω ὑμῖν
  choice: فالحق أقول لكم
  rationale: صياغة عربية فصيحة وطبيعية تنقل التأكيد الاحتفالي والسلطة في قول يسوع، وتحفظ صلة γάρ التفسيرية بما سبق بواسطة الفاء.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: إلى أن تزول السماء والأرض
  rationale: «تزول» تنقل معنى παρέρχομαι الملائم للسماء والأرض، مع إبقاء العبارة الكونية موجزة وواضحة.
- source_word: ἰῶτα ἓν
  choice: حرف يوتا واحد
  rationale: يحفظ اسم الحرف الوارد صراحة في اليونانية بدل استبداله بتعبير تفسيري عام مثل «أصغر حرف».
- source_word: μία κεραία
  choice: شرطة صغيرة واحدة
  rationale: تنقل صورة العلامة الخطية الدقيقة التي قد تميز حرفًا من آخر، بلغة عربية معاصرة مفهومة.
- source_word: οὐ μὴ παρέλθῃ
  choice: لن يزول أبدًا
  rationale: يجمع «لن» و«أبدًا» لنقل النفي اليوناني المؤكد οὐ μή دون تركيب عربي متكلف.
- source_word: ἀπὸ τοῦ νόμου
  choice: من الشريعة
  rationale: «الشريعة» تعبير عربي واضح عن القانون الإلهي المكتوب في هذا السياق، من غير توسيع العبارة صراحة إلى جميع الأسفار.
- source_word: ἕως ἂν πάντα γένηται
  choice: إلى أن يحدث كل شيء
  rationale: صياغة واسعة تحفظ معنى وقوع الأمور أو تحققها، ولا تحسم وحدها ما إذا كان التركيز على الحدوث أم الإتمام.
theological_decisions:
- issue: مدلول νόμος في قول يسوع
  choice: الشريعة بوصفها شريعة الله المكتوبة
  alternative: التوراة تحديدًا، أو أسفار العهد القديم بمعناها الأوسع
  rationale: السياق القريب يذكر «الشريعة والأنبياء»، لكن اللفظ هنا هو νόμος وحده؛ لذلك تُبقي الترجمة اللفظ عامًا نسبيًا ولا تضيف نطاقًا غير مصرح به.
- issue: دلالة πάντα γένηται
  choice: إلى أن يحدث كل شيء
  alternative: إلى أن يتم كل شيء / إلى أن يتحقق كل شيء
  rationale: الفعل γίνομαι يحتمل معنى الحدوث أو التحقق، والترجمة المختارة تحفظ هذا الاتساع، بينما تعرض الحاشية البدائل التي تميل أكثر إلى معنى الإتمام.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة من غير ألفاظ كنسية قديمة مثل «الناموس» أو «نقطة من حرف». استُبقي «يوتا» حفاظًا على التحديد المعجمي في الأصل، مع شرح مباشر في الحاشية.
