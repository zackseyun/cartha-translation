base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: ar
  text: ولا يُوقِد الناس سراجًا ويضعونه تحت المكيال[a]، بل يضعونه على حامل السراج، فيضيء لجميع مَن في البيت[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: وعاء يُستعمل للكيل؛ فالكلمة اليونانية تشير إلى مكيال للمواد الجافة، وإلى الوعاء الذي يُكال به.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ويلمع لجميع مَن في البيت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ولا
  rationale: تربط هذه الصورة بالنفي الوارد في السياق السابق، بصياغة عربية طبيعية موجزة.
- source_word: καίουσιν
  choice: يُوقِد
  rationale: الفعل العربي المألوف مع السراج، وينقل معنى إشعاله لا مجرد احتراقه.
- source_word: λύχνον
  choice: سراجًا
  rationale: يدل الأصل على مصباح زيتي محسوس؛ و«سراج» يحفظ الصورة بوضوح ووقار.
- source_word: τιθέασιν
  choice: يضعونه
  rationale: مقابل مباشر وطبيعي للفعل، مع ضمير يعود إلى السراج.
- source_word: ὑπὸ τὸν μόδιον
  choice: تحت مكيال
  rationale: المόδιος مكيال للحبوب، ويُراد به أيضًا الوعاء المستخدم في الكيل؛ و«مكيال» يحفظ هذه الدلالة التاريخية أفضل من تعميمها إلى مجرد سلة.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: بل على حامل السراج
  rationale: «حامل السراج» واضح في العربية الحديثة ويجنب الالتباس المعاصر في لفظ «المنارة»، مع نقل وظيفة λυχνία بدقة.
- source_word: λάμπει
  choice: فيضيء
  rationale: ينقل أثر نور السراج على الموجودين في البيت، مع بقاء معنى اللمعان ممكنًا في الحاشية.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: لجميع مَن في البيت
  rationale: يحفظ شمول πᾶσιν والدلالة المكانية لعبارة «في البيت» بصياغة عربية طبيعية.
theological_decisions:
- issue: فاعل الجمع الغائب غير المصرح به في اليونانية
  choice: ولا يُوقِد الناس سراجًا
  alternative: ولا يُوقِد أحدٌ سراجًا
  rationale: إضافة «الناس» تُظهر أن العبارة مثل عام من غير تقييد الفاعل بشخص بعينه، وتحافظ على صيغة الجمع في الأصل.
- issue: دلالة λάμπει وعلاقتها بمن في البيت
  choice: فيضيء لجميع مَن في البيت
  alternative: فيلمع أمام جميع مَن في البيت
  rationale: الترجمة المختارة تعبّر طبيعيًا عن وصول ضوء السراج إلى الجميع، بينما تُذكر دلالة «يلمع» الأقرب شكليًا في الحاشية دون فرض تفسير لاهوتي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كريمة. استُخدم «حامل السراج» بدل «المنارة» لتفادي فهمها بمعنى برج الضوء، و«مكيال» مع حاشية توضيحية لصون الصورة التاريخية في الأصل.
