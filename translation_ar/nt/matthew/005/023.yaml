  text: فإن كنتَ تقدِّم قربانك على المذبح، وتذكَّرت هناك أن لأخيك شيئًا عليك،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأخيك أو أختك»؛ ترد في اليونانية كلمة «أخ»، وهي اسم مذكر مفرد قد يُستعمل هنا استعمالًا تمثيليًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: فإن كنتَ
  rationale: تنقل الفاء الاستنتاجية معنى οὖν وتؤدي «إن» معنى الشرط، بينما يصوّر تركيب «كنت تقدّم» المشهد الجاري بصورة طبيعية.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: تقدِّم قربانك
  rationale: «تقدّم» تلائم فعل الإتيان بالتقدمة، و«قربان» توضح أن δῶρον هنا عطية عبادية من غير حصرها في نوع ذبيحة بعينه.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: على المذبح
  rationale: تحافظ «على» على الاتجاه المكاني في ἐπί مع المفعول، أي وضع القربان أو تقديمه على المذبح.
- source_word: κἀκεῖ μνησθῇς
  choice: وتذكَّرت هناك
  rationale: تحفظ الواو والرابطة المكانية «هناك»، وتنقل الفعل بصيغة طبيعية من غير تحديد سبب التذكّر.
- source_word: ὁ ἀδελφός σου
  choice: أخيك
  rationale: تحافظ على الاسم اليوناني المذكر المفرد، مع بيان إمكان استعماله تمثيليًا في الحاشية.
- source_word: ἔχει τι κατὰ σοῦ
  choice: لأخيك شيئًا عليك
  rationale: صياغة عربية موجزة تحفظ إبهام τι وتؤدي معنى وجود شكوى أو مأخذ، من غير أن تحدد طبيعته.
theological_decisions:
- issue: دلالة ἀδελφός المذكرة وإمكان شمولها
  choice: أخيك
  alternative: أخيك أو أختك؛ أو أحد إخوتك في الإيمان
  rationale: النص اليوناني مذكر مفرد، فحُفظ في المتن بدل توسيعه صراحة، مع الإشارة في الحاشية إلى إمكان الاستعمال التمثيلي بحسب السياق.
- issue: طبيعة ما للأخ على المخاطَب
  choice: شيئًا عليك
  alternative: شكوى عليك؛ أو مأخذًا عليك
  rationale: يحفظ هذا التعبير تعمّد النص عدم تحديد الأمر، فلا يحسم هل هو شكوى محقة أو مجرد اعتراض.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كريمة. استُعمل «قربان» لملاءمة سياق المذبح، وحُفظت الجملة شرطية غير مكتملة لأنها تتواصل في العدد التالي.
