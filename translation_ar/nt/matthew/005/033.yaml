  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: ar
  text: '«وسمعتم أيضًا أنه قيل للأقدمين: لا تحلف كذبًا[a]، بل أوفِ للرب[b] بأقسامك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تنقض قسمًا»؛ فالفعل قد يدل على الحلف كذبًا أو على مخالفة القسم وعدم الوفاء به.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «للرَّب»، في ضوء اسم الله العهدي الوارد في نصوص العهد القديم التي يلخّصها هذا القول.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: أيضًا
  rationale: تلائم انتقال الخطاب إلى مثال آخر في السلسلة، وهي طبيعية في العربية من غير أن توحي بضرورة تكرار زمني.
- source_word: ἠκούσατε
  choice: سمعتم
  rationale: الماضي العربي ينقل صيغة الفعل اليوناني بوضوح ويحافظ على العبارة المتكررة في السياق.
- source_word: ἐρρέθη
  choice: قيل
  rationale: يحفظ البناء للمجهول ولا يحدد القائل بما يتجاوز النص.
- source_word: τοῖς ἀρχαίοις
  choice: للأقدمين
  rationale: يدل على أناس الأجيال الماضية، لا على كبار السن فحسب.
- source_word: Οὐκ ἐπιορκήσεις
  choice: لا تحلف كذبًا
  rationale: ينقل المعنى الأساسي للفعل، مع حفظ احتمال نقض القسم في الحاشية.
- source_word: ἀποδώσεις
  choice: أوفِ
  rationale: يعبّر طبيعيًا عن أداء الالتزام الذي رتبه القسم، بدل الترجمة الحرفية «ادفع».
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: ينقل κύριος كما ورد في النص اليوناني، مع الإشارة في الحاشية إلى خلفيته الكتابية المرتبطة بالاسم الإلهي.
- source_word: τοὺς ὅρκους σου
  choice: بقَسَمك
  rationale: صياغة عربية موجزة وطبيعية؛ واسم الجنس المفرد المضاف يمكن أن يشمل ما يصدر عن المخاطب من أقسام.
theological_decisions:
- issue: ترجمة κύριος في تلخيص لتعليم من أسفار إسرائيل
  choice: الرب
  alternative: الرَّبّ، بوصفه ممثلًا للاسم الإلهي في خلفية العهد القديم
  rationale: النص اليوناني يورد κυρίῳ لا الاسم العبري نفسه، لذلك تبقى «الرب» في المتن، وتُحفظ الخلفية العهدية في الحاشية.
- issue: مدى معنى ἐπιορκέω
  choice: تحلف كذبًا
  alternative: تنقض قسمًا
  rationale: يمكن للفعل أن يدل على الحلف الكاذب أو عدم الوفاء بالقسم؛ اختير المعنى المباشر في المتن دون إلغاء البديل المعجمي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «أيضًا» لسلاسة الربط، و«أوفِ للرب بقَسَمك» للحفاظ على معنى أداء القسم بصياغة مفهومة. أُثبتت علامتا الحاشيتين في المتن.
