- source_word: γαμοῦντες
  choice: يتزوجون
  rationale: ينقل المعنى المباشر للفعل، ويحافظ على كونه نشاطًا مستمرًا ضمن سلسلة الأفعال.
- source_word: γαμίζοντες
  choice: يزوِّجون
  rationale: يحافظ على التمييز المعجمي بين الزواج وبين تزويج الآخرين، مع إثبات الاحتمال الآخر في الحاشية.
- source_word: ἄχρι ἧς ἡμέρας
  choice: إلى اليوم الذي
  rationale: تحدد العبارة نهاية استمرار الأنشطة، وتأتي في العربية على نحو واضح وطبيعي.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: دخل فيه نوح الفُلْك
  rationale: ينقل الحدث المحدد الذي ينهي الفترة السابقة، و«الفُلْك» تعبير عربي كتابي معروف لسفينة نوح ويحفظ الصلة بقصة التكوين.
theological_decisions:
- issue: هل تُصاغ الأنشطة المذكورة بوصفها إفراطًا خاطئًا أم مجرى الحياة العادي قبل الدينونة؟
  choice: صيغت الأفعال بصيغة محايدة تصف أنشطة بشرية عادية.
  alternative: إضفاء معنى الانغماس أو الاستهتار الأخلاقي على الأكل والشرب والزواج.
  rationale: الألفاظ اليونانية نفسها لا تتضمن وصفًا أخلاقيًا سلبيًا؛ والتركيز السياقي على استمرار الحياة المعتادة حتى مجيء الدينونة بغتة.
