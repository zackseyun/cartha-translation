  rationale: تحفظ الفاء القوة التفسيرية لـγάρ، وتحفظ الكاف معنى المقارنة في ὡς، بصياغة عربية طبيعية مرتبطة بالسياق السابق.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
