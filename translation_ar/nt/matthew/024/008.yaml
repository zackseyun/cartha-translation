  text: لكن هذه كلَّها بدايةُ آلامِ الولادة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «آلام المخاض» أو «أوجاع الولادة». يستحضر التعبير اليوناني آلام الوضع مجازًا عن المرحلة الأولى من ضيق آتٍ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ... ταῦτα
  choice: هذه كلَّها
  rationale: ينقل التركيب اليوناني بمعنى «كل هذه الأمور»، ويعود بوضوح وطبيعية إلى الأحداث المذكورة سابقًا.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا يتضمن مقابلة خفيفة بين الأحداث السابقة وبين تقويمها هنا؛ و«لكن» تؤدي ذلك بوضوح.
- source_word: ἀρχὴ
  choice: بداية
  rationale: تعبّر عن المرحلة الأولى من مسار آتٍ، من غير أن توحي بأن الأحداث المذكورة هي النهاية نفسها.
- source_word: ὠδίνων
  choice: آلام الولادة
  rationale: يحفظ التعبير صورة آلام الوضع التي يحملها الأصل اليوناني، وهو تعبير عربي واضح وشائع.
theological_decisions:
- issue: القوة المجازية لكلمة ὠδίνων
  choice: الإبقاء على استعارة الولادة بعبارة «آلام الولادة»
  alternative: الشدائد أو المعاناة
  rationale: يربط النص الاضطرابات السابقة ببداية عملية مؤلمة لا بنهايتها، والإبقاء على الاستعارة يصون التوتر الأخروي من غير فرض مخطط عقائدي تفصيلي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. قُدِّمت «هذه» على «كلها» لصياغة طبيعية، وحُفظت استعارة الولادة كما في الأصل.
