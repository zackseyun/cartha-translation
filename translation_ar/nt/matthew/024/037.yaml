  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: ar
  text: فكما كانت أيام نوح، هكذا يكون مجيء[a] ابن الإنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حضور». يمكن للكلمة اليونانية أن تدل على الحضور أو الوصول، لكنها تشير هنا إلى مجيء ابن الإنسان في المستقبل.
    reason: بديل معجمي
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: كما ... هكذا
  rationale: 'يحافظ هذا التركيب على المقابلة الترابطية المؤكدة في اليونانية: «كما... هكذا...».'
- source_word: γὰρ
  choice: فـ
  rationale: الفاء تنقل الصلة التفسيرية بالقول السابق بصورة موجزة وطبيعية في العربية.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: كانت أيام نوح
  rationale: العبارة اليونانية موجزة وحُذف منها الخبر في شطر المقارنة الأول؛ وإضافة «كانت» تستكمل التركيب العربي بأقل قدر من التفسير.
- source_word: Νῶε
  choice: نوح
  rationale: الصيغة العربية الراسخة للاسم الكتابي.
- source_word: ἔσται
  choice: يكون
  rationale: ينقل مستقبل فعل الكينونة مباشرة، من غير إضافة معنى «يحدث» أو غيره.
- source_word: παρουσία
  choice: مجيء
  rationale: في هذا السياق الأخروي تدل الكلمة على إتيان ابن الإنسان في المستقبل؛ و«مجيء» أوضح تعبير عربي، مع إبقاء معنى «الحضور» الممكن في الحاشية.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب الكتابي الراسخ وصلته بنصوص العهد القديم من غير استبداله بتعبير تفسيري.
theological_decisions:
- issue: ترجمة παρουσία في قول أخروي
  choice: مجيء
  alternative: حضور
  rationale: يفيد السياق الإتيان المستقبلي لابن الإنسان، ولذلك ينقل «مجيء» القوة الحدثية بوضوح. ومع ذلك، لا يُحجب المجال الدلالي الأوسع للكلمة، إذ يُذكر «حضور» في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل التركيب «كما... هكذا...» لصون بنية المقارنة، ووُضعت علامة الحاشية بعد اللفظة التي تتناولها مباشرة.
