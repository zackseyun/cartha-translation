  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: ar
  text: حَيْثُمَا تَكُنِ الجُثَّةُ، فَهُنَاكَ تَجْتَمِعُ النُّسُورُ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العِقبان». قد تدل الكلمة اليونانية على العقبان، لكن «النسور» أنسب لصورة طيور تتجمع حول جثة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: حيثما تكن
  rationale: تنقل «حيثما» دلالة الموصول المكاني غير المعيّن الناتجة من ὅπου مع ἐάν وصيغة الاحتمال، وتأتي «تكن» موافقة لأسلوب العربية الفصيحة الطبيعي.
- source_word: πτῶμα
  choice: الجثة
  rationale: تدل الكلمة على جسد ميت أو ساقط، و«الجثة» لفظ عربي دقيق ومألوف، من غير حصر الصورة في الحيوان كما قد توحي «الجيفة».
- source_word: συναχθήσονται
  choice: تجتمع
  rationale: مع أن الصيغة اليونانية مبنية للمجهول، يمكن أن تؤدي هنا معنى التجمع؛ والصياغة العربية اللازمة طبيعية مع الطيور وتحفظ المعنى من غير تكلف «تُجمع».
- source_word: ἀετοί
  choice: النسور
  rationale: اللفظ اليوناني قد يعني العقبان، لكنه في صورة طيور تتجمع حول جثة يرجح الطيور الكاسرة الآكلة للجيف؛ و«النسور» هو التعبير العربي الطبيعي لهذه الصورة، مع إثبات البديل المعجمي في الحاشية.
theological_decisions:
- issue: تفسير صورة المثل
  choice: نقل الصورة كما هي من غير تعيين مدلولها الأخروي
  alternative: اعتبارها رمزًا لحتمية الدينونة، أو لظهور مجيء ابن الإنسان، أو لخراب أورشليم والرايات الرومانية
  rationale: لا يصرح النص بما ترمز إليه الجثة أو الطيور، لذلك ينبغي ألا تحسم الترجمة خلافًا تفسيريًا لا يحسمه اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، ذات إيقاع مثلي رصين. حُفظ الغموض المقصود في الصورة، وأُثبت البديل المعجمي في الحاشية.
