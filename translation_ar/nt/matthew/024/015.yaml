base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: ar
  text: فمتى رأيتم «رجاسة الخراب» التي قيلت على لسان دانيال النبي قائمةً في مكان مقدّس—ليفهم القارئ—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب الصياغة التقليدية: «في المكان المقدّس».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «الرجاسة المخرِّبة» أو «الرجاسة التي تسبّب الخراب»، صدىً لعبارة دانيال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: فمتى
  rationale: تفيد العبارة انتقالًا واستنتاجًا من السياق السابق مع ظرف زمني مستقبلي؛ و«فمتى» عربية طبيعية تحفظ الرابط والخطاب النبوي.
- source_word: ἴδητε
  choice: رأيتم
  rationale: ترجمة مباشرة لفعل الرؤية، مع ضمير جمع المخاطبين.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: رجاسة الخراب
  rationale: تحفظ الصياغة الإضافية الموروثة وصدى سفر دانيال من غير حسم نوع العلاقة التي تدل عليها الإضافة.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: التي قيل عنها بلسان دانيال النبي
  rationale: «قيل عنها» يوضح أن الكلام النبوي يتعلق بالرجاسة، و«بلسان» يحفظ دلالة الوساطة في διά مع المضاف إليه.
- source_word: ἑστὸς
  choice: قائمةً
  rationale: تنقل معنى الوقوف مباشرة، وجاء التأنيث بحسب «رجاسة» في العربية من غير تفسير ماهية المرجع.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: في مكان مقدّس
  rationale: تعكس غياب أداة التعريف في اليونانية وتحافظ على إمكان عدم التحديد، من غير قصر العبارة صراحةً على موضع بعينه.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: ليفهم القارئ
  rationale: صياغة موجزة وطبيعية تحفظ قوة الأمر الاعتراضي الموجّه إلى القارئ.
theological_decisions:
- issue: تعريف τόπῳ ἁγίῳ واحتمال الإشارة المحددة إلى الهيكل
  choice: في مكان مقدّس
  alternative: في المكان المقدّس
  rationale: العبارة اليونانية بلا أداة تعريف، ومع أنها قد تستحضر الهيكل أو موضعًا مكرسًا، لا يلزم منها التحديد؛ لذلك بقي الاحتمال الأخص في الحاشية.
- issue: دلالة الإضافة في βδέλυγμα τῆς ἐρημώσεως
  choice: رجاسة الخراب
  alternative: الرجاسة المخرِّبة؛ الرجاسة التي تسبّب الخراب
  rationale: تحفظ الترجمة الرسمية صدى دانيال والغموض الدلالي في تركيب الإضافة، بدل تقرير ما إذا كان الخراب وصفًا أو نتيجة سببية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «مقدّس» بدل «مقدَّس» المشكولة التباسًا جزئيًا، وحُفظ الاعتراض بشرطتين. تظهر علامتا الحاشيتين [a] و[b] في المتن.
