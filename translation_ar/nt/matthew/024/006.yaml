    rationale: هي جائزة، لكن «تسمعون عن حروب» أوضح في الاستعمال الفصيح الحديث لمعنى وصول الأخبار عن الحروب، ويجعل العلاقة مع «أخبار حروب» أكثر سلاسة.
  revised_text: 'وستسمعون عن حروب وأخبار حروب. انتبهوا: لا تضطربوا، إذ لا بد أن يحدث ذلك، ولكن النهاية ليست بعد.'
