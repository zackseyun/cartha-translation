  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: ar
  text: 'وستسمعون عن حروب وأخبار حروب. انتبهوا: لا تضطربوا، إذ لا بد أن يحدث ذلك، ولكن النهاية ليست بعد.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μελλήσετε ἀκούειν
  choice: وستسمعون
  rationale: ينقل المستقبل المتوقع في تركيب μέλλω مع المصدر بصياغة عربية طبيعية، من غير المبالغة في معنى القرب الزمني.
- source_word: πολέμους
  choice: بحروب
  rationale: πόλεμος يدل عادة على الحرب، وصيغة الجمع محفوظة؛ واستُعمل حرف الجر لأن السياق هو تلقّي الخبر لا السماع المباشر لأصوات القتال.
- source_word: ἀκοὰς πολέμων
  choice: أخبار حروب
  rationale: ἀκοή قد تعني الخبر أو التقرير أو ما يُسمع. «أخبار» أوسع من «شائعات» ولا تفترض أن المنقول غير صحيح.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: احذروا أن تفزعوا
  rationale: ὁρᾶτε هنا أداة تنبيه وتحذير، وθροεῖσθε يفيد الاضطراب والفزع؛ والصياغة واضحة وطبيعية وتحفظ قوة النهي.
- source_word: δεῖ γὰρ γενέσθαι
  choice: فلا بد أن يحدث ذلك
  rationale: δεῖ يفيد الضرورة، وγενέσθαι يفيد الحدوث. يعود «ذلك» بإيجاز إلى ما سبق من حروب وأخبارها، من غير إضافة تفسير تفصيلي.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: ولكن ليست النهاية بعد
  rationale: صياغة قريبة من ترتيب اليونانية وتحفظ إطلاق «النهاية» من دون تقييدها بمخطط أخروي معين.
theological_decisions:
- issue: الدلالة الأخروية لعبارة τὸ τέλος
  choice: النهاية
  alternative: الاكتمال / النهاية الأخيرة
  rationale: أُبقيت العبارة عامة كما في اليونانية، من غير حصرها في تصور طائفي محدد لأحداث الأزمنة الأخيرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. لم تُضف حاشية لأن البديل «شائعات حروب» يخص ἀκοὰς πολέμων لا عبارة «أن تفزعوا»؛ ووضع علامة الحاشية في النص الإنجليزي بعد alarmed لا يطابق موضوعها. حافظت الترجمة على معنى الأخبار الأوسع من الشائعات.
