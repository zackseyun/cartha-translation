    rationale: الفعل اليوناني يشمل الاضطراب والانزعاج والهلع، بينما «تفزعوا» يميل إلى معنى الفزع المفاجئ وقد يضيّق الدلالة. «لا تضطربوا» أوسع وأقرب إلى المقصود في السياق.
  - severity: low
