revisions:
- from: وستسمعون بحروب وأخبار حروب. احذروا أن تفزعوا، فلا بد أن يحدث ذلك، ولكن ليست النهاية بعد.
  to: 'وستسمعون عن حروب وأخبار حروب. انتبهوا: لا تضطربوا، إذ لا بد أن يحدث ذلك، ولكن النهاية ليست بعد.'
  rationale: 'عُدّلت الصياغة لتكون عربية فصحى حديثة أكثر سلاسة، مع الحفاظ على البنية والمعنى اليونانيين: مستقبل السماع، الحروب وأخبارها، التحذير من الاضطراب، ضرورة وقوع ذلك، وعدم حضور النهاية بعد. لا تضيف الصياغة تفسيرًا أخرويًا أو تفصيلًا غير وارد في النص.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:58Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك التمييز بين الحروب وأخبارها، وضرورة وقوع ذلك، وعدم مجيء النهاية بعد. لكن «تفزعوا» أضيق وأشدّ من θροεῖσθε، التي تدل على الاضطراب أو الانزعاج أو الذعر، لا على الفزع وحده.
  naturalness: '«وستسمعون بحروب» مفهومة، لكن «ستسمعون عن حروب» أشيع وأوضح في العربية الفصحى الحديثة عند تلقي الأخبار. كما أن «انتبهوا: لا تضطربوا» ينقل تسلسل التحذير والنهي بوضوح وطبيعية.'
  terminology: «أخبار حروب» مناسب لـἀκοὰς πολέμων ولا يفترض أنها شائعات كاذبة. و«النهاية» تحافظ على اتساع τὸ τέλος الأخروي بلا تحميل تفسيري. لا يلزم إدراج حاشية؛ فالترجمة المختارة تعكس المعنى الأوسع، ولا توجد علامة حاشية عربية غير منضبطة الموضع.
