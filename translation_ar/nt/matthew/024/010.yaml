  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: ar
  text: وحينئذ سيتعثّر كثيرون[a]، ويخون بعضهم بعضًا[b]، ويبغض بعضهم بعضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سيرتدّ كثيرون»، أو «سيُعثَر بكثيرين».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «ويسلّم بعضهم بعضًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني يربط الأحداث بما سبق في خطاب يسوع، و«حينئذ» تعبير عربي واضح يحافظ على معنى التتابع.
- source_word: σκανδαλισθήσονται
  choice: سيتعثّر
  rationale: يحافظ «يتعثّر» على الصورة الأصلية وعلى سعة المعنى بين السقوط تحت الضغط، والنفور، والارتداد، من غير أن يحصر اللفظ في تفسير عقائدي واحد.
- source_word: πολλοὶ
  choice: كثيرون
  rationale: نقل مباشر وطبيعي للصفة المستعملة اسميًّا.
- source_word: ἀλλήλους
  choice: بعضهم بعضًا
  rationale: صياغة عربية فصيحة وواضحة تعبّر عن الفعل المتبادل، وقد تكررت كما في الأصل.
- source_word: παραδώσουσιν
  choice: يخون بعضهم بعضًا
  rationale: يفيد الفعل أصلًا التسليم إلى يد الغير، لكنه في سياق الاضطهاد والعداوة يحمل معنى الخيانة؛ لذلك اختير التعبير الطبيعي في المتن مع إثبات المعنى الحرفي في الحاشية.
- source_word: μισήσουσιν
  choice: يبغض بعضهم بعضًا
  rationale: نقل مباشر لمعنى العداوة والكراهية الفاعلة بصياغة عربية رصينة.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: وحينئذ ...، و...، و...
  rationale: يحافظ تكرار الواو على الترابط والإيقاع التراكمي في النص اليوناني.
theological_decisions:
- issue: دلالة σκανδαλισθήσονται في سياق الاضطهاد في آخر الزمان
  choice: سيتعثّر
  alternative: سيرتدّ؛ أو سيجد ما يدعوه إلى النفور
  rationale: «سيتعثّر» يحفظ الاستعارة الأصلية والجدية الروحية للفعل، مع إبقاء احتمال الارتداد أو النفور حاضرًا من غير فرض تعريف عقائدي محدد للارتداد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعملت السين مرة واحدة مع أول فعل لتحديد الاستقبال، ثم عُطفت الأفعال المضارعة التالية ضمن الإطار الزمني نفسه تجنبًا للثقل، مع الحفاظ على التوازي والتصاعد في العبارة اليونانية.
