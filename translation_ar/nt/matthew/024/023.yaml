base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: ar
  text: 'حينئذٍ، إن قال لكم أحد: «ها، المسيح هنا!» أو: «ها هو هنا!» فلا تصدّقوا ذلك.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمان يربط التحذير بسياق الخطاب السابق، ويحافظ على معنى التتابع الزمني.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: إن قال لكم أحد
  rationale: صياغة شرطية عربية طبيعية تحفظ فاعلًا غير معيّن دون تضييق مرجعه.
- source_word: Ἰδοὺ
  choice: انظروا
  rationale: أداة تنبيه ولفت للانتباه؛ والترجمة بصيغة الجمع تلائم المخاطَبين في «لكم».
- source_word: ὧδε
  choice: هنا
  rationale: يحفظ الدلالة المكانية المباشرة في الموضع الأول.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي المألوف للقب اليوناني، وتحفظ أداة التعريف كونه لقبًا للممسوح المنتظر.
- source_word: ἤ· Ὧδε
  choice: 'أو: «ها هو هناك!»'
  rationale: العبارة اليونانية مقتضبة وتحذف ما يُفهم من السياق؛ أُكمل المحذوف في العربية بقدر محدود للوضوح. واستُعمل «هناك» بوصفه إشارة قولية إلى موضع آخر، مع التنبيه في القرار اللاهوتي إلى أن اللفظ اليوناني نفسه يعني حرفيًا «هنا».
- source_word: μὴ πιστεύσητε
  choice: فلا تصدّقوا
  rationale: نهي عن قبول الادعاء السابق؛ والفعل العربي المتعدي مفهوم المفعول من السياق ولا يحتاج إلى إضافته.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: في العربية الكتابية والمعاصرة، «المسيح» هو اللقب الطبيعي المعروف للممسوح المنتظر، ويحافظ هنا على وظيفة اللفظ بوصفه لقبًا لا اسمًا شخصيًا صرفًا.
- issue: تعيين المكان في العبارة المقتضبة الثانية Ὧδε
  choice: ها هو هناك
  alternative: ها هو هنا
  rationale: اللفظ اليوناني Ὧδε يعني «هنا»، ولذلك تبقى «ها هو هنا» البديل الأشد حرفية. غير أن العبارة في سياق نقل أقوال متعاقبة يمكن أن تشير من منظور المتكلم الناقل إلى موضع آخر، فاختيرت صياغة عربية طبيعية مع إبقاء التوتر الدلالي موضحًا بدل اعتباره فرقًا ثابتًا في اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع المحافظة على صيغة الخطاب للجمع وعلى الإيجاز التحذيري في الأصل. لا توجد علامات حواشٍ لأن النص المنشور لا يحتاج إلى حاشية لازمة في هذه الآية.
