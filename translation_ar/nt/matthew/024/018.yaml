base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: ar
  text: ومَن كان في الحقل فلا يرجع إلى الوراء ليأخذ رداءه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثوبه» أو «ثوبه الخارجي».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: مَن كان في الحقل
  rationale: تفيد العبارة المعرَّفة شخصًا يتصف بكونه في الحقل. وصيغة «مَن كان» عربية طبيعية تحفظ العموم المقصود من المذكر التمثيلي من غير قصره على الرجال.
- source_word: μὴ ἐπιστρεψάτω
  choice: فلا يرجع
  rationale: صيغة الأمر مع أداة النفي تفيد النهي. ويؤدي «فلا يرجع» هذا المعنى بوضوح وبأسلوب عربي طبيعي يلائم إلحاح السياق.
- source_word: ὀπίσω
  choice: إلى الوراء
  rationale: تأتي هنا مع فعل الرجوع لتؤكد معنى العودة إلى الخلف، لا مجرد الموقع «خلف».
- source_word: ἆραι
  choice: ليأخذ
  rationale: المصدر اليوناني يبيّن الغرض من الرجوع؛ لذلك تنقل لام التعليل في «ليأخذ» العلاقة النحوية والمعنى المقصودين.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: رداءه
  rationale: تشير ἱμάτιον عادةً إلى الثوب الخارجي أو الرداء. و«رداء» لفظ واضح وموجز يلائم مشهد الفرار العاجل.
theological_decisions:
- issue: التمثيل الجندري في أداة التعريف المذكرة المستعملة استعمال الاسم
  choice: مَن كان في الحقل
  alternative: الرجل الذي في الحقل
  rationale: الصيغة اليونانية مذكرة نحويًا، لكنها عامة وتمثيلية في سياق التحذير. وتحفظ «مَن» هذا العموم مع بقاء الإشارة إلى الفرد، من غير تضييق المرجع على الذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم النهي المباشر «فلا يرجع» وحُفظت دلالة الغرض في «ليأخذ»، مع إثبات علامة الحاشية في المتن.
