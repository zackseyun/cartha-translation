  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: ar
  text: طوبى لذلك العبد الذي سيجده سيده، حين يأتي، يفعل هكذا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: طوبى
  rationale: تعبير عربي فصيح ومألوف في سياق التطويب، ينقل معنى السعادة والغبطة الناتجتين عن رضا الله.
- source_word: δοῦλος
  choice: العبد
  rationale: يحافظ على الدلالة الاجتماعية المباشرة للكلمة اليونانية في صورة ربّ البيت وعبده، من غير تلطيفها إلى «خادم».
- source_word: κύριος
  choice: سيده
  rationale: السياق يتحدث عن صاحب السلطة على العبد؛ و«سيده» تنقل هذه العلاقة بوضوح، مع إبقاء لفظ «الرب» للمواضع التي تكون فيها الدلالة الإلهية أصرح.
- source_word: οὕτως ποιοῦντα
  choice: يفعل هكذا
  rationale: يحافظ على إحالة «هكذا» إلى العمل الموصوف في السياق السابق، من غير إضافة تفسير غير وارد في الآية.
theological_decisions:
- issue: دلالة κύριος في المثل
  choice: سيده
  alternative: ربه
  rationale: تدل الكلمة مباشرة في المستوى القصصي على سيد العبد، مع بقاء إمكان التطبيق الرمزي على الرب مفهومًا من سياق الخطاب من غير فرضه معجميًا داخل العبارة.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقّرة. استُخدم المستقبل «سيجده» لنقل εὑρήσει، وحُفظ الاعتراض الزمني «حين يأتي» بحيث يكون فاعل المجيء هو السيد بوضوح.
