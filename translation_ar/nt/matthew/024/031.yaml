  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: ar
  text: ويرسل ملائكته مع بوق عظيم[a]، فيجمعون مختاريه[b] من الرياح الأربع[c]، من أقصى السماوات إلى أقصاها[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «مع بوق مدوٍّ» أو «مع نفخة بوق».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: الذين اختارهم؛ ويُقال تقليديًّا أيضًا: «مختاريه».'
    reason: lexical_alternative
  - marker: c
    text: «الرياح الأربع» تعبير تصويري يشير إلى أبعد الجهات في كل اتجاه.
    reason: cultural_note
  - marker: d
    text: 'حرفيًّا: «من أطراف السماوات إلى أطرافها»، أي من أقصى طرف إلى الطرف الآخر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: يرسل
  rationale: فعل مستقبل يفيد الإرسال؛ والسياق يوضح أن الملائكة يُرسَلون لتنفيذ مهمة، فلا حاجة إلى زيادة تفسيرية.
- source_word: ἀγγέλους
  choice: ملائكته
  rationale: السياق الأخروي يدل على الملائكة، لا على رسل بشريين، كما أن الضمير αὐτοῦ محفوظ في صيغة الإضافة.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: على صوت بوق عظيم
  rationale: صياغة عربية طبيعية تنقل مصاحبة البوق للإرسال، وتحافظ على وصفه بأنه «عظيم» من غير حصر المعنى في شدة الصوت وحدها.
- source_word: ἐπισυνάξουσιν
  choice: فيجمعون
  rationale: ينقل معنى الجمع مع بقاء الملائكة فاعلًا للجمع؛ والفاء تلائم تتابع الحدثين في العربية.
- source_word: ἐκλεκτούς
  choice: مختاريه
  rationale: تعبير موجز وواضح يحفظ معنى الذين وقع عليهم الاختيار، من غير شرح النص ضمن إطار مذهبي لاحق.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: من الرياح الأربع
  rationale: يحفظ الصورة الكتابية الأصلية بدل استبدالها بالتفسير «من الجهات الأربع».
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: من أقصى السماوات إلى أقصاها
  rationale: يحفظ جمع «السماوات» وصورة الامتداد من أقصى طرف إلى الطرف المقابل، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: دلالة «المختارين» في السياق الأخروي
  choice: مختاريه
  alternative: الذين اختارهم
  rationale: النص يصف جماعة يختارها ابن الإنسان من غير أن يحدد هنا تفاصيل إطار لاهوتي منظومي؛ لذلك تُحفظ الدلالة المعجمية بلا توسع عقائدي.
- issue: نطاق صورة الجمع
  choice: من الرياح الأربع، من أقصى السماوات إلى أقصاها
  alternative: من الجهات الأربع، من أقصى جهة إلى أقصى جهة
  rationale: الإبقاء على الصورة الكونية الواسعة يصون لغة المصدر ولا يحصرها في تفسير جغرافي أضيق.
- issue: وصف البوق
  choice: على صوت بوق عظيم
  alternative: على صوت بوق مدوٍّ
  rationale: «عظيم» يحفظ سعة معنى μεγάλης، التي قد تشير إلى العظمة أو إلى شدة الصوت، بدل حسمها في معنى واحد.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ومهيبة. حُفظت الصور الأصلية: البوق، والرياح الأربع، والسماوات بصيغة الجمع. استُعملت صياغة طبيعية من غير إدخال مصطلحات مذهبية تفسيرية.'
