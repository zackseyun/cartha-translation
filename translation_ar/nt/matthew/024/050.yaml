  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: ar
  text: سيأتي سيّدُ ذلك العبد[a] في يومٍ لا يتوقعه، وفي ساعةٍ لا يعرفها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «الخادم». غير أن اللفظة اليونانية تدل هنا على عبدٍ خاضعٍ لسلطة سيّده.'
    reason: lexical_alternative
  - marker: b
    text: أي إن العبد لا يعرف الساعة التي سيأتي فيها سيّده.
    reason: referent_clarification
lexical_decisions:
- source_word: ἥξει
  choice: يأتي
  rationale: فعل مستقبل يدل على المجيء أو الوصول؛ وصيغة المضارع العربية هنا تؤدي معنى المستقبل في سياق التنبؤ بعودة السيد.
- source_word: ὁ κύριος
  choice: سيدُ
  rationale: يشير في الصورة المَثَلية إلى صاحب السلطة على العبد، لا إلى لقب إلهي مباشر؛ و«السيد» يحفظ علاقة السلطة في السياق.
- source_word: τοῦ δούλου ἐκείνου
  choice: ذلك العبد
  rationale: «العبد» ينقل علاقة الخدمة المملوكة التي يدل عليها δοῦλος في هذا السياق المنزلي، و«ذلك» تعود إلى الشخص المذكور في الكلام السابق.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: في يوم لا يتوقعه
  rationale: يحفظ عدم تعيين اليوم، ويجعل الضمير العائد إلى اليوم صريحًا وطبيعيًا في العربية.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: وفي ساعة لا يعرفها
  rationale: يحافظ على الموازاة البلاغية بين «يوم» و«ساعة» وعلى المعنى المباشر لعدم المعرفة.
theological_decisions:
- issue: دلالة κύριος في سياق المثل
  choice: سيد
  alternative: رب
  rationale: المعنى المباشر هنا هو السيد البشري للعبد داخل عالم المثل. أما «الرب» فقد يُفهم بوصفه لقبًا إلهيًا مباشرًا، فيحسم الإيحاء اللاهوتي على نحو لا يقتضيه تركيب الجملة نفسه.
- issue: دلالة δοῦλος
  choice: عبد
  alternative: خادم
  rationale: السياق يبرز علاقة السلطة والتبعية المقيدة بين السيد والعبد؛ لذلك تحافظ «عبد» على القوة الاجتماعية للفظ أكثر من «خادم»، مع التنبيه إلى البديل في الحاشية.
- issue: مرجع الفاعل في οὐ προσδοκᾷ وοὐ γινώσκει
  choice: العبد المذكور
  alternative: لا بديل نحوي مرجح
  rationale: الفاعل المستتر في الفعلين يعود طبيعيًا إلى العبد، أما ضميرا المفعول في العربية فيعودان إلى اليوم والساعة.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، مع الحفاظ على التوازي بين «في يوم» و«في ساعة». استُعملت «سيد» بدل «رب» لأن المرجع المباشر في المثل سيد بشري، واستُعملت «عبد» لإبراز علاقة التبعية التي يحملها اللفظ اليوناني.
