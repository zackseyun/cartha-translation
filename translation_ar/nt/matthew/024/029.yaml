source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: ar
  text: ولكن فورًا بعد ضيق تلك الأيام، ستُظلَم الشمس، ولن يعطي القمر ضوءه، وستسقط النجوم من السماء[a]، وستتزعزع قوى السماوات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من صفحة السماء».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير «قوى السماوات» إلى القوى الكونية، أو الأجرام السماوية، أو الكائنات ذات السلطان في العالم السماوي؛ والعبارة اليونانية تبقى واسعة الدلالة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: ولكن فورًا
  rationale: تنقل «فورًا» الدلالة الزمنية القوية، وتفيد «لكن» الانتقال مع قدر من المقابلة في السياق.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: بعد ضيق تلك الأيام
  rationale: «ضيق» لفظ عربي واضح وذو وزن سياقي، ويحافظ التركيب على ارتباط الضيق بتلك الأيام دون زيادة تفسيرية.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: تُظلَم الشمس
  rationale: يحافظ المبني للمجهول على صيغة المستقبل المبني للمجهول في اليونانية وعلى النبرة النبوية.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: لا يعطي القمر ضوءه
  rationale: صياغة طبيعية وقريبة من الصورة الأصلية التي تصف القمر بأنه لا يعطي ضوءه.
- source_word: οἱ ἀστέρες πεσοῦνται
  choice: تتساقط النجوم
  rationale: «تتساقط» طبيعية في العربية مع جمع غير العاقل، وتنقل حدوث سقوط النجوم دون فرض تفسير للصورة.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: «السماء» تشمل في العربية مجال السماء المنظور مع احتفاظها بالسجل الكتابي، ويُذكر البديل الممكن في الحاشية.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: قوات السماوات
  rationale: «قوات» تبقي معنى القوى أو القدرات واسعًا، و«السماوات» تحفظ جمع οὐρανῶν، من غير حصر العبارة في أجرام أو كائنات سماوية.
- source_word: σαλευθήσονται
  choice: تتزعزع
  rationale: تنقل معنى الاهتزاز والاضطراب بقوة، وتناسب الصورة الكونية والنبرة النبوية.
theological_decisions:
- issue: طبيعة العلامات الكونية في الخطاب الرؤيوي
  choice: الإبقاء على الصور كما وردت دون تحديد أهي أحداث فلكية حرفية أم لغة نبوية رمزية أم تجمع بين الأمرين
  alternative: تفسيرها حصرًا على أنها انهيار كوني حرفي، أو حصرًا على أنها رمز لاضطراب سياسي وقضائي
  rationale: النص يستخدم صورًا نبوية رؤيوية معروفة، ولا يحسم بنفسه كيفية العلاقة بين الدلالة الحرفية والرمزية.
- issue: هوية «قوات السماوات»
  choice: استخدام عبارة واسعة تحفظ الغموض الدلالي
  alternative: تعيينها بوصفها أجرامًا سماوية أو قوى كونية أو كائنات سماوية
  rationale: العبارة اليونانية تحتمل هذه التصورات، ولا ينبغي للترجمة أن تختار واحدًا منها دون قرينة حاسمة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على تتابع الجملة النبوية وصورها الكونية. استُخدم جمع «السماوات» لمطابقة اليونانية، وتُركت «قوات» واسعة الدلالة منعًا للتفسير المذهبي.
