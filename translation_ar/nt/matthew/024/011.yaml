  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: ar
  text: وَسَيَقُومُ أَنْبِيَاءُ كَذَبَةٌ كَثِيرُونَ، وَيُضِلُّونَ كَثِيرِينَ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يخدعون كثيرين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سيُقام أنبياء كذبة كثيرون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: كَثِيرُونَ
  rationale: ينقل الصفة الكمية اليونانية مباشرة وبصياغة عربية طبيعية.
- source_word: ψευδοπροφῆται
  choice: أَنْبِيَاءُ كَذَبَةٌ
  rationale: تعبير عربي راسخ ودقيق يدل على من يدّعون النبوة وهم زائفون أو مخادعون، من غير تضييق معنى الكلمة.
- source_word: ἐγερθήσονται
  choice: سَيَقُومُ
  rationale: يعبر طبيعيًا عن بروز هؤلاء وظهورهم في المشهد، ولا يوحي في هذا السياق بالقيامة من الموت؛ وتُذكر دلالة المبني للمجهول الممكنة في الحاشية.
- source_word: πλανήσουσιν
  choice: يُضِلُّونَ
  rationale: يحفظ معنى التسبب في الضلال أو التيه، وهو أوجز وأفصح في العربية هنا، مع إثبات البديل «يخدعون» في الحاشية.
- source_word: πολλούς
  choice: كَثِيرِينَ
  rationale: مفعول به مباشر ينقل اللفظ اليوناني من غير إضافة غير لازمة مثل «أناسًا».
- source_word: καὶ ... καὶ
  choice: وَ... وَ...
  rationale: يحافظ على تنسيق الفعلين وتراكم التحذير كما في البنية اليونانية.
theological_decisions:
- issue: طبيعة الإضلال الذي يدل عليه πλανήσουσιν
  choice: 'إبقاء التحذير عامًا: سيُضل الأنبياء الكذبة كثيرين، من غير تحديد وسيلة الإضلال أو مجاله.'
  alternative: تفسير الإضلال بأنه عقائدي أساسًا، أو أخلاقي، أو متعلق بأحداث النهاية.
  rationale: الفعل اليوناني واسع الدلالة ويمكن أن يشمل التضليل العقائدي والأخلاقي والروحي؛ لذلك لا يحسم النص العربي ما لم يحسمه الأصل.
- issue: دلالة المبني للمجهول في ἐγερθήσονται
  choice: ترجمته اصطلاحيًا «سيقوم» بمعنى سيبرز أو سيظهر، مع بيان البديل الحرفي في الحاشية.
  alternative: «سيُقام» أو «سيُنهَض» بما يحافظ صراحة على صيغة المبني للمجهول.
  rationale: السياق يتحدث عن ظهور شخصيات مخادعة، و«سيقوم» عربية طبيعية تحفظ الحدث من غير أن تنسب إقامتهم صراحة إلى الله أو توحي بقيامة الموتى، بينما تصون الحاشية الاحتمال الصرفي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أنبياء كذبة» للتعبير الكتابي المألوف، و«يُضلّون» للمحافظة على صورة الانحراف عن الطريق الكامنة في الفعل اليوناني. وُضعت علامتا الحاشيتين بعد الجملة كما في طبقة الاستشارة الإنجليزية، وكلتاهما ظاهرتان في المتن.
