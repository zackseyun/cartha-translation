  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: ar
  text: ستكون امرأتان تطحنان على الرحى[a]؛ تُؤخذ إحداهما وتُترك الأخرى.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند الطاحونة» أو «بحجر الرحى»؛ فاللفظة اليونانية قد تشير إلى الطاحونة أو إلى حجرها.'
    reason: lexical_alternative
  - marker: b
    text: يقول اليوناني ببساطة إن إحداهما تُؤخذ والأخرى تُترك، من غير أن يحدد هنا هل الأخذ للخلاص أم للدينونة.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: تكون امرأتان تطحنان
  rationale: اسم الفاعل اليوناني مؤنث مثنى في المعنى مع العدد «اثنتان»، ولذلك صُرّح بـ«امرأتان». وصيغة «تكون... تطحنان» تنقل المشهد المستمر في السياق بصورة عربية طبيعية.
- source_word: ἐν τῷ μύλῳ
  choice: عند الطاحونة
  rationale: يمكن أن يدل μύλος على الطاحونة أو حجر الرحى. و«عند الطاحونة» تعبير واضح لا يفرط في تحديد نوع الأداة.
- source_word: μία παραλαμβάνεται
  choice: تُؤخذ إحداهما
  rationale: يحافظ المبني للمجهول على عدم ذكر الفاعل، وتبقى «تُؤخذ» محايدة في شأن كون الأخذ للخلاص أو للدينونة.
- source_word: καὶ μία ἀφίεται
  choice: وتُترك الأخرى
  rationale: تنقل الواو حرف العطف البسيط، وتؤدي «الأخرى» المقابلة التوزيعية الطبيعية بين المرأتين من غير إضافة معنى «تُترك وراءها» أو «تُهجر».
theological_decisions:
- issue: تحديد جنس الشخصين المفهوم من اسم الفاعل
  choice: التصريح بأنهما امرأتان
  alternative: تكون اثنتان تطحنان
  rationale: الصيغة ἀλήθουσαι مؤنثة، فالتصريح بـ«امرأتان» يحفظ معلومة نحوية دلالية ظاهرة في الأصل.
- issue: هل الأخذ والترك للخلاص أم للدينونة
  choice: الإبقاء على «تُؤخذ» و«تُترك» بلا تفسير
  alternative: تُؤخذ إحداهما للخلاص وتُترك الأخرى للدينونة، أو تُؤخذ إحداهما للدينونة وتُترك الأخرى
  rationale: العبارة نفسها لا تعيّن صراحة دلالة كل فعل من الناحية الأخروية، ولذلك ينبغي ألا تحسم الترجمة هذا الخلاف.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «تكون امرأتان تطحنان» لمجاراة صياغة المشهد المستقبلي في السياق، مع إبقاء الغموض المقصود في فعلي الأخذ والترك.
