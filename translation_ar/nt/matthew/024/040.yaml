base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: ar
  text: حينئذ يكون رجلان في الحقل؛ يُؤخذ أحدهما[a] ويُترك الآخر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُصطحب أحدهما». والفعل في ذاته لا يحدد هل الأخذ للنجاة أم للدينونة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمان يصل القول بالسياق الأخروي السابق، و«حينئذ» عربية فصيحة موجزة تحفظ هذا الترابط.
- source_word: δύο ἔσονται
  choice: يكون رجلان
  rationale: اليونانية تقول حرفيًا «يكون اثنان»، لكن صيغتي εἷς المذكرة، مع المثال الموازي للمرأتين في العدد التالي، تدلان على أن الحديث هنا عن رجلين؛ والتصريح بذلك طبيعي في العربية.
- source_word: ἐν τῷ ἀγρῷ
  choice: في الحقل
  rationale: ترجمة مكانية مباشرة وطبيعية من غير إضافة دلالية.
- source_word: εἷς ... εἷς
  choice: أحدهما ... الآخر
  rationale: هذه الصياغة العربية الطبيعية تُظهر المقابلة الموجزة بين الشخصين وتحفظ التذكير.
- source_word: παραλαμβάνεται
  choice: يُؤخذ
  rationale: مضارع مبني للمجهول ضمن مشهد مستقبلي. «يُؤخذ» يحفظ الإيجاز ولا يحسم بذاته هل الأخذ للنجاة أم للدينونة.
- source_word: ἀφίεται
  choice: يُترك
  rationale: ترجمة مباشرة ومحايدة؛ وتتجنب تعبيرات قد تضيف معنى الهجر أو تستدعي تصورًا أخرويًا بعينه.
theological_decisions:
- issue: هل يدل παραλαμβάνεται على الأخذ للنجاة أم للدينونة؟
  choice: الإبقاء على الصياغة المحايدة «يُؤخذ» في المتن
  alternative: «يُؤخذ» بمعنى يُنقذ، أو بمعنى يُساق إلى الدينونة
  rationale: الفعل في ذاته لا يحسم جهة الأخذ، والسياق موضع نقاش تفسيري؛ لذلك تحفظ الترجمة التوتر الدلالي من غير فرض نظام أخروي محدد.
- issue: هل يُصرَّح بأن الاثنين رجلان؟
  choice: «رجلان»
  alternative: «اثنان»
  rationale: مع أن δύο تعني «اثنان»، فإن صيغتي εἷς المذكرة والمشهد الموازي الخاص بالنساء في العدد التالي يؤيدان إظهار المرجع المذكر في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم المبني للمجهول كما في المصدر، وحُفظ الإيقاع المتوازي بين «يُؤخذ» و«يُترك»، مع تجنب المصطلحات المحمّلة بتفسير أخروي خاص.
