source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: ar
  text: فكما أن البرق يخرج من الشرق ويُرى حتى الغرب، كذلك يكون مجيء ابن الإنسان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حضور». يمكن للكلمة اليونانية παρουσία أن تعني «الحضور» أو «القدوم»، لكنها تشير هنا في السياق إلى مجيء ابن الإنسان في المستقبل.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: فكما أن
  rationale: تحفظ الفاء وظيفة γάρ التفسيرية، وتنقل ὥσπερ ببنية مقارنة عربية طبيعية.
- source_word: ἡ ἀστραπή
  choice: البرق
  rationale: هو المقابل العربي المباشر والطبيعي للظاهرة المقصودة في التشبيه.
- source_word: ἐξέρχεται
  choice: يخرج
  rationale: يحفظ معنى الخروج أو الانبثاق في الأصل، ويلائم وصف البرق في العربية الفصحى.
- source_word: ἀπὸ ἀνατολῶν
  choice: من الشرق
  rationale: السياق يقابل جهة الشروق بجهة الغروب، ولذلك فالمعنى الاتجاهي «الشرق» هو الأوضح.
- source_word: φαίνεται
  choice: يُرى
  rationale: ينقل صيغة الفعل المبني للمجهول ودلالة الظهور المرئي العلني من غير إضافة معنى «يلمع».
- source_word: ἕως δυσμῶν
  choice: إلى الغرب
  rationale: تنقل مدى الرؤية حتى جهة الغروب بعبارة عربية موجزة وطبيعية.
- source_word: οὕτως ἔσται
  choice: هكذا يكون
  rationale: تحفظ بنية جواب التشبيه ودلالة المستقبل المفهومة من السياق والفعل اليوناني.
- source_word: παρουσία
  choice: مجيء
  rationale: في هذا السياق الأخروي يدل اللفظ على مجيء ابن الإنسان، مع إبقاء معنى «الحضور» الممكن معجميًا في الحاشية.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصياغة العربية الراسخة للقب، وتحفظ صلته النصية والدلالية من غير تفسير زائد.
theological_decisions:
- issue: ترجمة παρουσία في قول أخروي
  choice: مجيء
  alternative: حضور أو قدوم
  rationale: يشبّه السياق παρουσία ابن الإنسان بظهور البرق العلني الذي لا يخفى، ولذلك ينقل «مجيء» المعنى الحدثي المستقبلي بوضوح، مع حفظ البديل المعجمي «حضور» في الحاشية وعدم حسم المجال الدلالي بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت بنية التشبيه من الشرق إلى الغرب، واستُعملت الصياغة الكتابية المألوفة «ابن الإنسان».
