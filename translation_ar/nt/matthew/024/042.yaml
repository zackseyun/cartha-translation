base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: ar
  text: فاسهروا إذن، لأنكم لا تعرفون في أيّ يوم يأتي ربكم.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تيقظوا» أو «كونوا متنبّهين».
    reason: lexical_alternative
  - marker: b
    text: أو «سيأتي ربكم». يستعمل النص اليوناني صيغة المضارع.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: فعل أمر مضارع للجمع يدعو إلى يقظة مستمرة. و«اسهروا» يحفظ صورة اليقظة في الأصل، ويؤدي في السياق معنى التنبّه والترقّب.
- source_word: οὖν
  choice: إذن
  rationale: تفيد النتيجة المستخلصة من التعليم السابق، وموضعها بعد فعل الأمر طبيعي وواضح في العربية المعاصرة.
- source_word: ὅτι
  choice: لأنكم
  rationale: تُدخل سبب الأمر بالسهر، ودمجها مع ضمير المخاطبين صياغة عربية طبيعية.
- source_word: οὐκ οἴδατε
  choice: لا تعرفون
  rationale: نقل مباشر لنفي المعرفة، من غير إضافة معنى اليقين أو التخمين غير الموجود في اليونانية.
- source_word: ποίᾳ ἡμέρᾳ
  choice: في أيّ يوم
  rationale: تعبير عربي طبيعي عن الزمن، ويحفظ تخصيص اليوم المجهول.
- source_word: ὁ κύριος ὑμῶν
  choice: ربكم
  rationale: صياغة عربية موجزة وطبيعية تحفظ معنى السيادة ونسبة الرب إلى المخاطبين.
- source_word: ἔρχεται
  choice: يأتي
  rationale: مضارع عربي يطابق صيغة الحاضر اليونانية، ويمكن في السياق أن يحمل دلالة الحدث المنتظر من غير تحويله صراحة إلى مستقبل.
theological_decisions:
- issue: القوة الأخروية لصيغة الحاضر ἔρχεται
  choice: يأتي
  alternative: سيأتي
  rationale: يحفظ المضارع العربي صيغة الحاضر في اليونانية وإلحاح القول، مع بقائه طبيعيًا في الحديث عن حدث منتظر، من غير فرض تحديد عقائدي لزمن المجيء.
- issue: دلالة γρηγορεῖτε المجازية
  choice: اسهروا
  alternative: تيقظوا / كونوا متنبّهين
  rationale: اختير اللفظ الذي يحفظ استعارة عدم النوم، مع الإقرار بأن المقصود السياقي هو اليقظة الروحية والترقّب، دون استبدال الصورة بتفسيرها وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدمت «اسهروا» للمحافظة على صورة اليقظة الأصلية، و«يأتي» للمحافظة على المضارع اليوناني. وُضعت علامتا الحاشيتين في النص الرئيس، من دون إنشاء حاشية غير لازمة لعبارة «في أيّ يوم» لأنها بالفعل الصياغة العربية الطبيعية.
