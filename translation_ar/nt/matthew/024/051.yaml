base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ar
  text: ويقطعه نصفين[a]، ويجعل نصيبه مع المرائين[b]. هناك يكون البكاء وصرير الأسنان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب فهمٍ مجازي: «يعاقبه عقابًا شديدًا». والفعل اليوناني يعني حرفيًا: «يقطع إلى نصفين».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «نصيبه» أو «حصته». والعبارة تفيد أنه يعيّن له نصيبًا مع المرائين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: يقطعه نصفين
  rationale: يحفظ المعنى الحسي المباشر للفعل اليوناني، أي القطع إلى قسمين، من غير تلطيفه إلى عقاب شديد.
- source_word: μέρος
  choice: نصيبه
  rationale: ينقل معنى الجزء أو الحصة المعيّنة له، ويظل طبيعيًا في سياق المصير المقضي به دون حصره في موقع مكاني فقط.
- source_word: ὑποκριτῶν
  choice: المرائين
  rationale: لفظ عربي راسخ ومفهوم يدل على من يُظهر خلاف ما يبطن، ويحفظ قوة المصطلح المتكرر في متى.
- source_word: ἐκεῖ
  choice: هناك
  rationale: ينقل الإشارة المكانية بإيجاز ووضوح إلى المصير المذكور قبلها.
- source_word: κλαυθμὸς
  choice: البكاء
  rationale: ترجمة مباشرة تحافظ على الصيغة المتكررة في إنجيل متى.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: صرير الأسنان
  rationale: تعبير عربي مألوف ودقيق للصيغة التصويرية الثابتة في متى.
theological_decisions:
- issue: هل يُلطَّف الفعل διχοτομήσει إلى صيغة عامة عن شدة العقاب؟
  choice: 'الإبقاء على الصورة الحسية: «يقطعه نصفين»'
  alternative: «يعاقبه عقابًا شديدًا»
  rationale: المعنى المعجمي المباشر شديد وواضح، ولا يقتضي النص حسم كونه وصفًا حرفيًا أو صورة للعقاب؛ لذلك تُحفظ الصورة ويُذكر البديل الاصطلاحي في الحاشية.
- issue: كيفية التعبير عن τὸ μέρος αὐτοῦ ... θήσει
  choice: «يجعل نصيبه مع المرائين»
  alternative: «يجعل مكانه مع المرائين»
  rationale: «نصيبه» أقرب إلى μέρος وتحفظ غموض النص بين الحصة والمصير والمكان، من غير تخصيص زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت الصورة اليونانية القوية في المتن، واستُخدم «نصيبه» لقربه من اللفظ الأصلي مع إبقاء دلالة المصير غير محصورة في المكان.
