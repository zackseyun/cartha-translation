  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: ar
  text: 'الحق أقول لكم: لن يزول هذا الجيل حتى تحدث هذه الأمور كلها.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هذا الشعب» أو «هذا العِرق». قد تُفهم الكلمة اليونانية بمعنى أوسع، لكن «الجيل» هو ترجمتها الأكثر مباشرة هنا.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي قوة التوكيد المهيب في صيغة يسوع «ἀμὴν λέγω ὑμῖν»، وهي عبارة عربية كتابية واضحة وطبيعية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحافظ على الخطاب الموجَّه إلى الجمع.
- source_word: ὅτι
  choice: —
  rationale: لا تحتاج العربية إلى أداة صريحة بعد الصيغة «الحق أقول لكم»، ووضع النقطتين يوضح بدء مضمون القول من غير إخلال بالمعنى.
- source_word: οὐ μὴ παρέλθῃ
  choice: لن يزول
  rationale: «لن» تنقل النفي المستقبلي المؤكد، و«يزول» تؤدي معنى παρέρχομαι هنا بوضوح وإيجاز.
- source_word: ἡ γενεὰ αὕτη
  choice: هذا الجيل
  rationale: «الجيل» هو المقابل المباشر والأشيع لـ γενεά في هذا السياق، ويحفظ موضع الخلاف التفسيري من غير حسمه داخل المتن.
- source_word: ἕως ἂν
  choice: حتى
  rationale: تنقل الحد الزمني المرتبط بوقوع أحداث مستقبلية على نحو طبيعي في العربية.
- source_word: πάντα ταῦτα
  choice: هذه الأمور كلها
  rationale: تحافظ على الجمع والإحالة إلى مجموعة الأحداث المذكورة في الخطاب، بصياغة عربية سلسة.
- source_word: γένηται
  choice: تحدث
  rationale: تؤدي معنى وقوع الأحداث في هذا السياق بلغة عربية معاصرة واضحة.
theological_decisions:
- issue: مدلول «هذا الجيل» (ἡ γενεὰ αὕτη) في الخطاب الأخروي
  choice: إثبات «هذا الجيل» في المتن بحسب المعنى المعجمي المباشر.
  alternative: «هذا الشعب» أو «هذا العِرق».
  rationale: يحفظ الاختيار التوتر التفسيري ولا يفرض إطارًا أخرويًا بعينه؛ وتُذكر الدلالات الأوسع الممكنة في الحاشية بدل إدخالها في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعملت الصيغة المألوفة «الحق أقول لكم» مع تجنب الألفاظ القديمة مثل «لا يمضي» و«يكون هذا كله»، والحفاظ على الغموض الحقيقي في «هذا الجيل».
