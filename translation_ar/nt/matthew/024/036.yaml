  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: ar
  text: أمّا ذلك اليوم وتلك الساعة، فلا يعلمهما أحد، ولا ملائكة السماوات، ولا الابن، إلا الآب وحده.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تحذف بعض المخطوطات عبارة «ولا الابن». ويتبع المتن هنا قراءة SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: أَمَّا
  rationale: تُدخل «أمّا» موضوعًا جديدًا مع إبقاء معنى الانتقال الذي تؤديه δέ، وهي صياغة عربية طبيعية في هذا السياق.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ذَلِكَ الْيَوْمُ وَتِلْكَ السَّاعَةُ
  rationale: يُفهم التعبير اليوناني على أنه يشير إلى زمن بعينه. وكُرر اسم الإشارة في العربية لموافقة جنس الاسمين وتحقيق الوضوح الطبيعي.
- source_word: οὐδεὶς οἶδεν
  choice: فَلَا يَعْرِفُهُمَا أَحَدٌ
  rationale: ينقل النفي الشامل بوضوح، والضمير المثنى يعود إلى اليوم والساعة. «يعرف» تعبير عربي واضح عن العلم بالموعد المقصود.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: وَلَا مَلَائِكَةُ السَّمَاوَاتِ
  rationale: تحافظ «ولا» على تسلسل العناصر المنفية، وتترجم صيغة الجمع τῶν οὐρανῶν ترجمة مباشرة وطبيعية في الأسلوب الكتابي العربي.
- source_word: οὐδὲ ὁ υἱός
  choice: وَلَا الِابْنُ
  rationale: أُبقي اللقب والتصريح بعدم المعرفة دون تلطيف أو تفسير، وفق قراءة SBLGNT.
- source_word: εἰ μὴ
  choice: إِلَّا
  rationale: بعد النفي تفيد العبارة الاستثناء، لا الشرط.
- source_word: ὁ πατὴρ μόνος
  choice: الْآبُ وَحْدَهُ
  rationale: تنقل «وحده» قصر المعرفة على الآب، مع استعمال «الآب» بوصفه لقبًا إلهيًا معروفًا.
theological_decisions:
- issue: الدلالة المسيحولوجية لعبارة «ولا الابن»
  choice: إثبات العبارة كاملة في المتن دون تلطيف أو توسع تفسيري.
  alternative: حذف العبارة اعتمادًا على بعض الشواهد النصية، أو إعادة صياغتها لتخفيف التوتر اللاهوتي.
  rationale: يتضمن نص SBLGNT عبارة οὐδὲ ὁ υἱός، ولذلك تُحفظ كما هي. لا ينبغي للترجمة أن تحسم التوتر اللاهوتي أو تقلله بإضافة تفسير غير موجود في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل تركيب «أمّا... فلا» لانتقال طبيعي إلى الموضوع، مع الحفاظ على سلسلة النفي والاستثناء وعلى الغموض والتوتر الموجودين في الأصل.
