  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: ar
  text: فإن أُمَّةً ستنهض ضد أُمَّة[a]، ومملكةً ضد مملكة، وستحدث مجاعات[b] وزلازل في أماكن متفرقة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ستقوم أُمَّة على أُمَّة». يفيد التعبير اليوناني نشوب العداء بين الأمم.'
    reason: lexical_alternative
  - marker: b
    text: 'تضيف بعض المخطوطات بعد «مجاعات»: «وأوبئة».'
    reason: textual_variant
  - marker: c
    text: 'أو: «في أماكن مختلفة» أو «من مكان إلى مكان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: ستقوم
  rationale: الفعل في هذا التركيب يدل على النهوض في وجه طرف آخر واندلاع العداء. «ستقوم» عربية طبيعية، ومع «على» تنقل معنى المواجهة من غير افتراض أن الله هو الذي يقيمها.
- source_word: γὰρ
  choice: لأن
  rationale: تربط الأداة القول بما قبله على سبيل التعليل أو التفسير، وإثباتها يحافظ على ترابط الخطاب.
- source_word: ἔθνος ἐπὶ ἔθνος
  choice: أُمَّة على أُمَّة
  rationale: «أُمَّة» تنقل معنى الجماعة القومية أو السياسية، و«على» في هذا السياق تفيد المواجهة والعداء مع الحفاظ على صياغة موجزة ومألوفة.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: مملكة على مملكة
  rationale: المقصود كيان سياسي مَلَكي، وهو موازٍ للأمة في الشطر السابق؛ لذلك تحافظ «مملكة» على التوازي والسجل الأخروي.
- source_word: ἔσονται
  choice: ستحدث
  rationale: الاستعمال وجودي، و«ستحدث» أنسب في العربية مع المجاعات والزلازل من ترجمة حرفية مثل «ستكون».
- source_word: λιμοὶ
  choice: مجاعات
  rationale: الجمع يدل على أزمات شديدة في توفر الطعام، و«مجاعات» هو المقابل المباشر الواضح.
- source_word: σεισμοὶ
  choice: زلازل
  rationale: المعنى السياقي هو الهزات الأرضية، و«زلازل» المقابل العربي المعتاد والدقيق.
- source_word: κατὰ τόπους
  choice: في أماكن متفرقة
  rationale: العبارة توزيعية، أي إن الأحداث تقع في مواقع متعددة، ولا تعني بالضرورة تسلسلاً مكانيًا محددًا.
theological_decisions:
- issue: نطاق معنى ἔθνος في قول عن صراعات أخروية
  choice: أُمَّة
  alternative: شعب
  rationale: التوازي مع «مملكة» يرجح جماعات قومية أو سياسية واسعة، ولا يقتضي تخصيص المعنى بالأمم غير اليهودية.
- issue: دلالة الصيغة ἐγερθήσεται في سياق العداء
  choice: ستقوم على
  alternative: ستُقام على
  rationale: التركيب يصف نشوب الصراع، ولا يصرح بفاعل يقيم الأمة؛ لذلك تجنبت الصياغة المبنية للمجهول التي قد توحي بسبب إلهي صريح.
- issue: القراءة النصية بعد λιμοὶ
  choice: إبقاء «مجاعات» وفق نص SBLGNT
  alternative: «مجاعات وأوبئة» وفق قراءة بعض المخطوطات
  rationale: النص المعتمد لا يشتمل على λοιμοί، لكن القراءة الإضافية ذات صلة بالقارئ، فذُكرت في حاشية من غير إدخالها في المتن.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. حُفظ التوازي بين «أُمَّة» و«مملكة»، واستُخدم «على» للدلالة الطبيعية على المواجهة، مع توضيح البديل في الحاشية. وُضعت جميع علامات الحواشي في المتن عند مواضعها الفعلية.
