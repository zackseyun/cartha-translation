  source_fidelity: 'ينقل النص عناصر اليونانية الأساسية بأمانة: المستقبل المبني للمجهول في «ستُعلَن»، و«بشارة الملكوت»، والشمول في «العالم كله» و«جميع الأمم»، ووظيفة الشهادة، ثم مجيء النهاية. ولا يفرض تحديدًا جغرافيًا أو أخرويًا زائدًا على οἰκουμένη أو τέλος.'
  naturalness: الصياغة فصيحة واضحة ومناسبة للسجل الكتابي المعاصر. وترتيب «بشارةُ الملكوت هذه» جائز عربيًا ويحافظ على إبراز اسم الإشارة المقابل لـτοῦτο، وإن كان ذا نبرة أدبية رصينة ملائمة للسياق.
