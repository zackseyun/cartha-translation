id: MAT.24.14
reference: Matthew 24:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: ar
  text: وستُعلَن بشارةُ الملكوت هذه[a] في العالم كله[b] شهادةً لجميع الأمم[c]، وعندئذ تأتي النهاية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنجيل الملكوت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في المسكونة كلها»، أي في العالم المأهول كله.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لجميع الشعوب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: ستُعلَن
  rationale: ينقل المبني للمجهول في صيغة المستقبل، ويحفظ معنى الإعلان العلني من غير حصره في الوعظ الكنسي.
- source_word: εὐαγγέλιον τῆς βασιλείας
  choice: بشارةُ الملكوت
  rationale: «بشارة» عربية واضحة تحمل معنى الخبر السار، والإضافة في «الملكوت» تحافظ على تركيب اليونانية من غير أن تحسم هل المقصود بشارة صادرة عن الملكوت أم متعلقة به.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: في العالم كله
  rationale: تعبير عربي طبيعي ينقل الامتداد الشامل، مع إثبات البديل الأدق حرفيًا في الحاشية.
- source_word: εἰς μαρτύριον
  choice: شهادةً
  rationale: يحفظ قوة الشهادة والإثبات، ويترك دلالة الغاية أو النتيجة مفتوحة كما في الأصل.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: لجميع الأمم
  rationale: يحافظ على المقابل المعجمي والرنين الكتابي لـἔθνη، من غير قصره على غير اليهود.
- source_word: ἥξει τὸ τέλος
  choice: تأتي النهاية
  rationale: صياغة عربية مباشرة تحفظ صورة مجيء النهاية من غير إدخال إطار زمني أو لاهوتي غير مصرح به.
theological_decisions:
- issue: مدى οἰκουμένη وἔθνη في هذا القول الأخروي
  choice: استخدام «في العالم كله» و«لجميع الأمم» للدلالة على المدى الشامل.
  alternative: «في المسكونة كلها» و«لجميع الشعوب».
  rationale: تحفظ الصياغة شمول الإعلان من غير تضييقه على الإمبراطورية الرومانية أو ربطه بتصور تبشيري أو جدول أخروي بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «الملكوت» حفاظًا على المصطلح الكتابي المألوف، و«بشارة» بدلًا من الاقتصار على المصطلح الكنسي «إنجيل». وُضعت علامات الحواشي بجوار الألفاظ التي تشرح بدائلها.
