reference: Matthew 24:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: ar
  text: ولو لم تُقصَّر تلك الأيام[a]، لما نجا أيُّ بشر؛ ولكن لأجل المختارين[b] ستُقصَّر تلك الأيام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تُختصر تلك الأيام ... ستُختصر». يدل الفعل اليوناني على تقصير المدة أو اختصارها.'
    reason: lexical_alternative
  - marker: b
    text: «المختارون» هم الذين جرى اختيارهم؛ ولا تحدد هذه الآية وحدها هويتهم على نحو أضيق.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: لم تُقصَّر / ستُقصَّر
  rationale: الفعل يدل على تقليل المدة أو جعل الشيء أقصر. و«تُقصَّر» عربية طبيعية تحافظ على الصورة الزمنية من غير أن توحي بأن الأيام نفسها حُذفت.
- source_word: οὐκ ἂν ἐσώθη
  choice: لما نجا
  rationale: التركيب اليوناني يفيد نتيجة ممتنعة في شرط مخالف للواقع. وفي سياق الضيق، يدل الفعل مباشرة على النجاة والبقاء حيًّا؛ لذلك تنقل «نجا» المعنى السياقي بوضوح من غير إقحام معنى خلاصي عقائدي حصري.
- source_word: πᾶσα σάρξ
  choice: أيُّ بشر
  rationale: العبارة اليونانية حرفيًا «كل جسد»، لكنها في النفي اصطلاح كتابي يراد به ألا ينجو إنسان. «أي بشر» واضحة وفصيحة وتحافظ على شمول التعبير وعلى نبرته الكتابية.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: ولكن لأجل المختارين
  rationale: «لأجل» تنقل معنى السبب أو المصلحة في διά مع النصب، و«المختارين» تقابل ἐκλεκτούς من غير تحديد هوية الجماعة بما يتجاوز النص.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: تلك الأيام
  rationale: مقابل مباشر وطبيعي يحفظ قوة اسم الإشارة.
- source_word: καὶ εἰ μὴ
  choice: ولو لم
  rationale: «ولو لم» تؤدي الشرط المخالف للواقع في العربية بوضوح وسلاسة، مع اقترانه بنتيجة «لما نجا».
theological_decisions:
- issue: هوية «المختارين» في الخطاب الأخروي
  choice: الإبقاء على «المختارين» بلا شرح تفسيري داخل النص
  alternative: شعب الله المختار؛ المؤمنون؛ البقية الأمينة
  rationale: لا تحدد الآية هنا النطاق اللاهوتي الكامل للجماعة، ولذلك يحفظ اللفظ الغموض المقصود ويتجنب حسم خلافات تتعلق بإسرائيل أو الكنيسة أو البقية.
- issue: دلالة σῴζω في السياق
  choice: «نجا» مع إبقاء التركيز على حفظ الحياة في سياق الضيق
  alternative: خَلَص؛ بقي حيًّا؛ حُفظ
  rationale: السياق يتحدث مباشرة عن النجاة من كارثة، و«نجا» لا يفرض على الفعل معنى الخلاص الروحي وحده، ولا يبعده عن معنى الإنقاذ.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. استُخدم الشرط «ولو لم ... لما» لنقل الحالة المخالفة للواقع، وحُوِّل الاصطلاح «كل جسد» إلى «أي بشر» كي يكون مفهومًا للقارئ المعاصر مع الحفاظ على الشمول.
