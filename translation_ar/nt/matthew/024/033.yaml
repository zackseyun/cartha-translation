  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: ar
  text: وهكذا أنتم أيضًا، متى رأيتم هذه الأمور كلها، فاعلموا أنه قريب، على الأبواب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنه هو قريب»، في إشارة إلى ابن الإنسان. لا تذكر اليونانية الفاعل صراحةً.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: وهكذا أنتم أيضًا
  rationale: تحفظ العبارة المقارنة بمثل شجرة التين السابق، كما تُبقي توكيد المخاطَبين الذي تؤديه καὶ.
- source_word: ὅταν ἴδητε
  choice: متى رأيتم
  rationale: ينقل التركيب الزمني المستقبلي بصياغة عربية واضحة من غير إيحاء بتكرار الحدث.
- source_word: πάντα ταῦτα
  choice: هذه الأمور كلها
  rationale: يحفظ دلالة الجمع المحايد من دون إضافة تفسير مثل «الأحداث».
- source_word: γινώσκετε
  choice: فاعلموا
  rationale: ينقل صيغة الأمر مباشرة، وتناسب الفاءُ الارتباطَ بجملة الشرط الزمنية في العربية.
- source_word: ἐγγύς
  choice: قريب
  rationale: المقابل العربي المباشر الذي يحفظ عدم تحديد مرجع القرب.
- source_word: ἐπὶ θύραις
  choice: على الأبواب
  rationale: يحفظ جمع θύραις ويؤدي التعبير الاصطلاحي الدال على شدة القرب.
- source_word: ἐγγύς ἐστιν
  choice: أنه قريب
  rationale: تتيح العربية ضميرًا قد يعود إلى مذكّر أو إلى أمر مفهوم من السياق، وبذلك لا تُسمّي الفاعل المحذوف في اليونانية صراحة.
theological_decisions:
- issue: الفاعل الضمني في ἐγγύς ἐστιν
  choice: «أنه قريب» مع إبقاء المرجع غير مصرَّح به
  alternative: «إنه هو قريب» في إشارة صريحة إلى ابن الإنسان، أو «إنها قريبة» في إشارة صريحة إلى النهاية أو المملكة
  rationale: لا تذكر اليونانية فاعلًا صريحًا، وقد يُفهم الكلام عن ابن الإنسان أو عن الأمر الآتي. لذلك تُحفظ مساحة الغموض النصي ولا يُحسم المرجع لاهوتيًا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «متى رأيتم» لسلامة الأسلوب، و«على الأبواب» للمحافظة على الصورة اليونانية بصيغة الجمع. وُضع مؤشر الحاشية بعد الجملة كاملة.
