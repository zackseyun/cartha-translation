id: MAT.24.45
reference: Matthew 24:45
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: ar
  text: فمَن هو إذًا العبد[a] الأمين الحكيم الذي أقامه سيده[b] على خدم بيته ليعطيهم الطعام في حينه؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخادم». يمكن أن تدل الكلمة اليونانية على عبد أو خادم بحسب السياق؛ وهنا تحافظ «العبد» على المعنى الأقوى للخضوع لسلطة سيد.
    reason: lexical_alternative
  - marker: b
    text: أو «ربه». استُعملت «سيده» لأن السياق يصوّر تدبير شؤون بيت وعلاقة عبد بسيده.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: فمَن هو إذًا
  rationale: تنقل صيغة السؤال مع قوة ἄρα الاستنتاجية والانتقالية، وتربط السؤال طبيعيًا بما سبقه.
- source_word: πιστὸς
  choice: الأمين
  rationale: تدل هنا على من يُعتمد عليه في أداء المسؤولية الموكلة إليه؛ و«الأمين» تعبير عربي طبيعي يحفظ البعد الأخلاقي والعملي.
- source_word: δοῦλος
  choice: العبد
  rationale: تحفظ «العبد» دلالة الخضوع لسلطة السيد في صورة البيت، بينما تُذكر «الخادم» بديلًا معجميًا في الحاشية.
- source_word: φρόνιμος
  choice: الحكيم
  rationale: تنقل الحكمة العملية وحسن التصرّف المقصودين في السياق، وهي صياغة عربية واضحة ومألوفة.
- source_word: κατέστησεν
  choice: أقامه
  rationale: تفيد وضعه في منصب مسؤولية وتكليفه به من قِبل السيد، من غير زيادة تفسيرية.
- source_word: κύριος
  choice: سيده
  rationale: يلائم علاقة السيد بالعبد في المشهد المنزلي المباشر، مع إبقاء «ربه» بديلًا ممكنًا في الحاشية.
- source_word: οἰκετείας
  choice: خدم بيته
  rationale: تشير الكلمة إلى جماعة البيت، ولا سيما العاملين فيه؛ وهذه الصياغة تمنع فهمها على أنها الأسرة وحدها وتنسجم مع إعطائهم الطعام.
- source_word: τοῦ δοῦναι
  choice: ليعطيهم
  rationale: تنقل غرض التعيين الذي تعبّر عنه صيغة المصدر المعرّف.
- source_word: τροφὴν
  choice: الطعام
  rationale: ترجمة مباشرة وواضحة للغذاء أو القوت، من غير تخصيص زائد مثل «الجراية».
- source_word: ἐν καιρῷ
  choice: في حينه
  rationale: تدل على الوقت المناسب أو المحدد، لا على مجرد وقوع الفعل في الزمن.
theological_decisions:
- issue: ترجمة κύριος في سياق صورة منزلية تمثيلية
  choice: سيده
  alternative: ربه
  rationale: تُبرز «سيده» العلاقة الاجتماعية الظاهرة في الصورة بين العبد وصاحب السلطة عليه، من غير أن تنفي الإحالة الأوسع إلى الرب في سياق الخطاب؛ وتحفظ الحاشية الترجمة البديلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على صيغة السؤال البلاغي وعلى صورة البيت، واستُعمل «خدم بيته» لتوضيح أن المقصود جماعة العاملين في البيت لا أفراد الأسرة فحسب.
