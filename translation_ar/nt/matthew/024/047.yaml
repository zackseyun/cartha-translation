  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: ar
  text: 'الحق أقول لكم: إنه سيقيمه على جميع ممتلكاته[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على كل ما له».'
    reason: بديل معجمي أقرب إلى البنية الحرفية لعبارة τοῖς ὑπάρχουσιν αὐτοῦ.
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي معنى الاستهلال التوكيدي المهيب في كلام يسوع، وهي صياغة عربية طبيعية راسخة من غير نقل صوتي لكلمة «آمين».
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة تحافظ على صيغة الخطاب المهيبة والضمير الجمعي.
- source_word: ὅτι
  choice: إنه
  rationale: تُدخل مضمون القول بوضوح في العربية، مع ضمير الشأن المناسب للتركيب.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: على جميع ممتلكاته
  rationale: تفيد ἐπί مع المجرور هنا نطاق المسؤولية، وتشير العبارة الاسمية إلى كل ما يملكه السيد؛ و«ممتلكاته» موجزة وطبيعية.
- source_word: καταστήσει
  choice: سيقيم
  rationale: ينقل معنى التعيين في منصب أو مسؤولية، لا مجرد الوضع المكاني، ويلائم لغة المثل.
- source_word: αὐτόν
  choice: ـه
  rationale: يحفظ ضمير المذكر المفرد العائد إلى العبد المذكور في السياق السابق.
theological_decisions:
- issue: طبيعة مكافأة السيد أو توسيع الأمانة
  choice: صياغة القول بوصفه إقامة العبد على جميع ممتلكات سيده ضمن منطق المثل، من غير إضافة تفسير عقائدي.
  alternative: تفسير الإقامة صراحةً بأنها سلطة كنسية أو مكافأة سماوية أخروية.
  rationale: الآية نفسها تصف توسيع نطاق المسؤولية، أما تطبيق ذلك كنسيًا أو أخرويًا فهو استنتاج تفسيري لا ينبغي إدخاله في نص الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «الحق أقول لكم» للحفاظ على الصيغة التوكيدية، و«سيقيمه» للدلالة على التعيين في مسؤولية. أُثبتت علامة الحاشية [a] في المتن.
