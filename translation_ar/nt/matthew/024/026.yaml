base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: ar
  text: 'فإذا قالوا لكم: «ها هو في البرية»، فلا تخرجوا؛ «ها هو في الغرف الداخلية»[a]، فلا تصدّقوا ذلك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المخازن»، أو «الحجرات الخاصة». يمكن أن تشير الكلمة اليونانية إلى غرف داخلية أو خاصة أو إلى مخازن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: فإن ... إذًا
  rationale: تحفظ «إن» قوة الشرط، وتنقل «إذًا» الاستنتاج من التحذير السابق، مع ترتيب عربي طبيعي.
- source_word: εἴπωσιν ὑμῖν
  choice: قالوا لكم
  rationale: يحافظ الجمع الغائب على فاعل غير معيّن، كما في اليونانية.
- source_word: Ἰδοὺ
  choice: ها هو
  rationale: أداة تنبيه وإشارة طبيعية في العربية، وتناسب وجود ضمير مذكّر مفهوم من السياق.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» تشمل الأرض القفر أو الخلاء، وتحفظ الدلالة الكتابية الأوسع دون حصرها في صحراء رملية.
- source_word: ἐστίν
  choice: هو
  rationale: أُظهر الضمير الذي يقتضيه التعبير العربي، من غير إضافة لقب مثل «المسيح» لا يرد صراحة في العبارة.
- source_word: μὴ ἐξέλθητε
  choice: فلا تخرجوا
  rationale: نهي مباشر يحفظ معنى الحركة إلى الخارج.
- source_word: ἐν τοῖς ταμείοις
  choice: في الغرف الداخلية
  rationale: ينقل معنى الغرف الواقعة في داخل البيت أو الخاصة، مع إبقاء البدائل المعجمية في الحاشية.
- source_word: μὴ πιστεύσητε
  choice: فلا تصدّقوا
  rationale: النهي منصبّ في السياق على تصديق الادعاء؛ والعربية تجيز حذف المفعول حين يكون مفهومًا.
theological_decisions:
- issue: مرجع الضمير المستتر في ἐστίν
  choice: «ها هو» من غير تسمية المرجع
  alternative: «ها هو المسيح» أو «هو هناك»
  rationale: السياق يدل على الشخص الذي يزعمون حضوره، لكن النص اليوناني لا يذكر هنا اسمًا أو لقبًا؛ لذلك حُفظ الإضمار ولم يُحسم بإضافة تفسيرية.
- issue: العلاقة بين خبري البرية والغرف الداخلية
  choice: إبقاء الخبرين متوازيين بفاصلة منقوطة دون إضافة «أو»
  alternative: إضافة «أو» لبيان أنهما احتمالان بديلان
  rationale: اليونانية تكرر Ἰδοὺ من غير أداة عطف تخييرية، فحُفظ التوازي والربط الشرطي من غير إضافة غير ملفوظة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «البرية» لصداها الكتابي الطبيعي، و«الغرف الداخلية» لتجنب الإيحاء الزائد بالسرية مع حفظ اتساع اللفظ اليوناني في الحاشية.
