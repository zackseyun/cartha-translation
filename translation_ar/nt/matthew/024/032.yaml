  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: ar
  text: 'وتعلَّموا من شجرة التين هذا المثل[a]: متى صار غصنها غضًّا وأخذت أوراقها تنبت[b]، تعرفون أن الصيف قريب[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذه العبرة» أو «هذا التشبيه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ونبتت أوراقها».'
    reason: lexical_alternative
  - marker: c
    text: يمكن أن تدل الكلمة اليونانية على «الصيف»، وفي بعض السياقات على موسم الحصاد؛ والمعنى الموسمي هنا أنسب لصورة شجرة التين.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: وتعلَّموا من شجرة التين
  rationale: تحفظ «من» دلالة ἀπό على المصدر، وتأتي الواو بصلة انتقالية خفيفة لـδέ من غير إدخال ظرف زمان غير موجود في الأصل.
- source_word: μάθετε
  choice: تعلَّموا
  rationale: صيغة أمر مباشرة توافق فعل الأمر اليوناني، وتحافظ على معنى تلقي العبرة بدل تحويله إلى مجرد نتيجة ذهنية مثل «افهموا».
- source_word: τὴν παραβολήν
  choice: هذا المثل
  rationale: «المثل» هو المقابل الإنجيلي المألوف لـπαραβολή، واسم الإشارة يجعل التركيب العربي طبيعيًّا مع بيان المقارنة الآتي.
- source_word: ὅταν ἤδη
  choice: متى
  rationale: تفيد شرطًا زمنيًّا عامًّا مناسبًا للمشهد الموسمي؛ ولا يلزم نقل ἤδη بلفظ مستقل إذا كان بدء العلامة واضحًا من صيرورة الغصن غضًّا وخروج الورق.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: صار غصنها غضًّا
  rationale: «صار» تنقل تغير الحالة، و«غضًّا» وصف عربي طبيعي للغصن الطري الحديث النمو.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: وأخرج أوراقه
  rationale: ينقل ἐκφύῃ معنى إنبات الأوراق وإبرازها بعبارة عربية واضحة وطبيعية.
- source_word: γινώσκετε
  choice: تعرفون
  rationale: صيغة خبرية مضارعة للجمع توافق التحليل الصرفي، ولا تحولها إلى أمر.
- source_word: ἐγγὺς τὸ θέρος
  choice: أن الصيف قريب
  rationale: «الصيف» هو المعنى الموسمي الأنسب لـθέρος في صورة شجرة التين، مع إبقاء إمكان معنى موسم الحصاد في الحاشية.
theological_decisions:
- issue: دلالة صورة شجرة التين
  choice: أُبقيت بوصفها مثلًا موسميًّا عن معرفة قرب الأمر من علاماته، من غير تعيين مدلول رمزي لشجرة التين.
  alternative: اعتبار شجرة التين رمزًا لإسرائيل، أو اعتبارها مجرد مثال طبيعي عام بلا أي دلالة رمزية.
  rationale: لا يصرّح نص الآية نفسه بهوية رمزية للشجرة؛ لذلك تحافظ الترجمة على الصورة وعلى مجال التأويل الأخروي من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «غضًّا» لحداثة نمو الغصن وطراوته، وحُفظت صيغة الجمع في الخطاب. وُضعت علامات الحواشي بجوار الألفاظ التي تشرحها، مع الحفاظ على جميع العلامات [a] و[b] و[c].
