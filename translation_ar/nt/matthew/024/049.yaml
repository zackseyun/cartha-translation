  choice: رفاقه العبيد
  alternative: رفاقه الخدم
  rationale: سياق المثل قائم على خضوع الجميع لسيد واحد، ولذلك يحفظ لفظ «العبيد» البنية الاجتماعية والأثر الأخلاقي للنص، مع شرح البديل في الحاشية.
translation_notes:
