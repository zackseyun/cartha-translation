lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: يبدأ يضرب
  rationale: يحفظ التركيب الدال على الشروع في الفعل، ويؤدي τύπτειν بمعنى الضرب العنيف أو المتكرر في هذا السياق.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: رفاقه العبيد
  rationale: ينقل معنى σύνδουλος، أي العبيد المشاركين له في الخضوع للسيد نفسه، بصياغة عربية واضحة مع إبقاء واقع العبودية في المثل.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: ويأكل ويشرب
  rationale: صياغة طبيعية تحفظ اقتران الفعلين، وتفهم δέ هنا بوصفها أداة وصل خفيفة لا تستلزم تضادًا.
- source_word: μετὰ τῶν μεθυόντων
  choice: مع السَّكارى
  rationale: اسم الفاعل اليوناني يصف أناسًا يتعاطون السُّكر أو يتصفون به؛ و«السَّكارى» موجزة وطبيعية في العربية.
theological_decisions:
