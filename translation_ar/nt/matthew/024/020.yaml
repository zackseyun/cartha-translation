base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: ar
  text: لكن صلّوا لئلّا يكون هروبكم في الشتاء ولا في يوم سبت[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في يوم السبت».'
    reason: صياغة بديلة تعكس إمكان فهم σαββάτῳ معرفًا في الاستعمال، رغم عدم وجود أداة التعريف في اليونانية.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: فعل أمر لجمع المخاطبين؛ وهذه الصياغة العربية الطبيعية تنقل الأمر من غير أن تفرض دلالة الاستمرار التي قد يوحي بها زمن المضارع اليوناني.
- source_word: δὲ
  choice: لكن
  rationale: تنقل التحول الخطابي والمقابلة الخفيفة مع التحذير السابق.
- source_word: ἵνα μὴ γένηται
  choice: لئلّا يكون
  rationale: تنقل مضمون الصلاة بصياغة عربية موجزة وطبيعية، مع إبقاء الحدث غير واقع بحسب المطلوب في الصلاة.
- source_word: ἡ φυγὴ ὑμῶν
  choice: هروبكم
  rationale: ينقل معنى الفرار من الخطر من غير أن يفترض نجاح النجاة، وهو طبيعي وواضح في العربية المعاصرة.
- source_word: χειμῶνος
  choice: في الشتاء
  rationale: ترجمة طبيعية لمضاف إليه يدل على زمن وقوع الحدث أو موسمه.
- source_word: μηδὲ σαββάτῳ
  choice: ولا في يوم سبت
  rationale: تحافظ «ولا» على العطف داخل النفي، وتنقل «يوم سبت» الاسم اليوناني غير المعرّف من غير فرض التعريف.
theological_decisions:
- issue: تعريف كلمة σαββάτῳ أو تنكيرها
  choice: في يوم سبت
  alternative: في السبت
  rationale: ورد الاسم اليوناني بلا أداة تعريف؛ لذلك يحافظ المتن على التنكير الممكن، بينما تُذكر الصياغة المعرّفة الشائعة في الحاشية من غير حسم دلالة لا يحسمها اللفظ وحده.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كتابية كريمة. استُعمل «هروبكم» بدل «فراركم» لسهولة الفهم مع الحفاظ على معنى φυγή، ووُضع مؤشر الحاشية في المتن كما هو مطلوب.
