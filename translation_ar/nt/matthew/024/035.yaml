id: MAT.24.35
reference: Matthew 24:35
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ar
  text: السماء والأرض ستزولان، أما كلماتي فلن تزول أبدًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: السماء
  rationale: في الاقتران الكوني «السماء والأرض»، تدل الكلمة على السماء بوصفها جزءًا من الخليقة، لا على الجو المرئي وحده.
- source_word: ἡ γῆ
  choice: الأرض
  rationale: ضمن التعبير «السماء والأرض»، تشير الكلمة إلى الأرض في النطاق الكوني، لا إلى إقليم بعينه.
- source_word: παρελεύσεται
  choice: ستزولان
  rationale: الفعل هنا يدل على زوال النظام المخلوق الحاضر. وجاء بصيغة المثنى العربية لأن الفاعل مركب من «السماء والأرض».
- source_word: δὲ
  choice: أما ... فـ
  rationale: هذا التركيب العربي الطبيعي يبرز التضاد بين زوال السماء والأرض وعدم زوال كلمات يسوع.
- source_word: οἱ λόγοι μου
  choice: كلماتي
  rationale: تنقل العبارة أقوال يسوع وتعاليمه بصورة مباشرة وطبيعية، مع الحفاظ على اتساع مدلولها.
- source_word: οὐ μὴ παρέλθωσιν
  choice: فلن تزول أبدًا
  rationale: تركيب οὐ μή مع صيغة الاحتمال نفي مؤكد؛ و«لن ... أبدًا» يؤدي هذا التوكيد بوضوح في العربية المعاصرة.
theological_decisions:
- issue: دلالة قول يسوع عن بقاء كلماته
  choice: صياغة نفي مؤكد تُظهر أن كلماته لن تزول أبدًا
  alternative: «فلن تزول بالتأكيد»
  rationale: يحافظ النص على المقابلة القوية بين زوال الخليقة الحاضرة وثبات كلمات يسوع، من دون إضافة تفسير عقائدي يتجاوز منطوق الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم المثنى «ستزولان» مراعاةً للنحو العربي، واستُخدم «أما ... فـ» لإظهار المقابلة الطبيعية. لم تُضف حاشية لأن «لن ... أبدًا» تنقل النفي اليوناني المؤكد في المتن نفسه.
