    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: خرج
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق الفعل الرئيس؛ و«خرج» يحفظ معنى الحركة من داخل المكان إلى خارجه بصياغة عربية طبيعية.
- source_word: ἱεροῦ
  choice: الهيكل
  rationale: تشير ἱερόν هنا إلى مجمّع الهيكل وأروقته، لا إلى المقدس الداخلي وحده؛ و«الهيكل» هو المقابل العربي المألوف، مع توضيح الدلالة الأوسع في الحاشية.
- source_word: ἐπορεύετο
  choice: مضى مبتعدًا
  rationale: صيغة الماضي الناقص تصوّر حركة مستمرة بعيدًا عن الهيكل؛ وتحفظ العبارة هذا الجانب الاستمراري من غير تكلف.
- source_word: προσῆλθον
  choice: تقدّم إليه
  rationale: يفيد الفعل اقتراب التلاميذ من يسوع، و«تقدّم إليه» أوضح من مجرد «جاء» في هذا السياق.
- source_word: ἐπιδεῖξαι
  choice: ليروه
  rationale: المصدر يعبّر عن الغرض؛ وهذه الصياغة العربية الطبيعية تنقل معنى أن التلاميذ قصدوا أن يُروا يسوع الأبنية.
- source_word: οἰκοδομὰς
  choice: أبنية
  rationale: يدل اللفظ على المباني أو المنشآت المشيدة، و«أبنية» مقابل مباشر وواضح في السياق.
- source_word: τοῦ ἱεροῦ
  choice: الهيكل
  rationale: الإضافة تحدد أن الأبنية تابعة لمجمّع الهيكل، وتكرار «الهيكل» يحفظ تكرار النص اليوناني وتوكيده.
theological_decisions:
- issue: دلالة ἱερόν في مقابل ναός
  choice: الهيكل مع حاشية توضيحية
  alternative: مجمّع الهيكل أو ساحات الهيكل في المتن
  rationale: اللفظ اليوناني يدل على نطاق الهيكل كله، لا على المقدس الداخلي وحده. يحافظ «الهيكل» على الأسلوب العربي الكتابي المألوف، بينما تمنع الحاشية فهمه على أنه المبنى الداخلي وحده.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «مضى مبتعدًا» لإبراز استمرار الحركة في ἐπορεύετο، ووُضع مؤشر الحاشية بعد أول ورود لكلمة «الهيكل» لأنه موضع الإيضاح المعجمي.
