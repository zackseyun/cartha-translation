  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: ar
  text: 'فإنه حينئذ سيكون ضيق عظيم[a]، لم يحدث مثله منذ بداية العالم إلى الآن، ولن يحدث مثله أبدًا.


    [a] أو: «شدة عظيمة» أو «بلاء عظيم». تدل الكلمة اليونانية على الضيق الشديد أو المعاناة أو ما يقع على الإنسان من ضغط واضطهاد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شدة عظيمة» أو «بلاء عظيم». تدل الكلمة اليونانية على الضيق الشديد أو المعاناة أو ما يقع على الإنسان من ضغط واضطهاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: لأنه حينئذ
  rationale: تنقل «لأن» قوة γάρ التفسيرية التي تصل الآية بما قبلها، وتنقل «حينئذ» الدلالة الزمنية لـ τότε.
- source_word: ἔσται
  choice: سيكون
  rationale: صياغة عربية طبيعية مع «ضيق عظيم»، وتحافظ على الدلالة المستقبلية.
- source_word: θλῖψις μεγάλη
  choice: ضيق عظيم
  rationale: «ضيق» لفظ واضح وراسخ يدل على الشدة والكرب من غير حصر المعنى في تفسير أخروي اصطلاحي بعينه، و«عظيم» تنقل μεγάλη مباشرة.
- source_word: οἵα οὐ γέγονεν
  choice: لم يكن مثله
  rationale: تنقل المقارنة النوعية وشدة الحدث غير المسبوقة بصياغة عربية موجزة وطبيعية، مع بقاء معنى الفعل عامًا بين الوجود والحدوث.
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: منذ بداية العالم إلى الآن
  rationale: ترجمة مباشرة وواضحة للعبارة الزمنية، من غير توسيع κόσμος إلى «الخليقة».
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: ولن يكون مثله أبدًا
  rationale: تنقل النفي المستقبلي المؤكد في οὐ μή، وتستعيد عنصر المقارنة المفهوم من οἵα، من غير إضافة تحديد زمني أو عقائدي غير موجود في النص.
theological_decisions:
- issue: الدلالة الأخروية لعبارة θλῖψις μεγάλη
  choice: ضيق عظيم
  alternative: شدة عظيمة / بلاء عظيم
  rationale: يحفظ الاختيار ثقل العبارة وصلتها بسياق خطاب يسوع عن الأحداث الآتية، لكنه لا يحولها إلى مصطلح عقائدي تقني قد يفرض تصورًا زمنيًا أو مذهبيًا معينًا.
- issue: مدى تفرد الضيق المذكور
  choice: لم يكن مثله... ولن يكون مثله أبدًا
  alternative: لم يحدث مثله... ولن يحدث مرة أخرى
  rationale: الصياغة المختارة تحفظ المقارنة المطلقة في النص وقوة النفي، ولا تحسم طبيعة الحدث أو كيفية تحقيقه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «بداية العالم» بدل الصياغة الأقدم «ابتداء العالم»، وحُفظ الإيقاع المكثف للقول مع تجنب المصطلحات المذهبية التقنية.
