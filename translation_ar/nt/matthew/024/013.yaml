  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: ar
  text: أمّا الذي يصمد إلى النهاية، فهو سيخلُص[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حتى النهاية».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سينجو» أو «سيُنقَذ». يمكن أن يدل الفعل اليوناني على النجاة أو الخلاص؛ وأُبقي في المتن التعبير الأوسع لأن السياق لا يقتضي حصر المعنى.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: الذي يصمد
  rationale: أداة التعريف مع اسم الفاعل الأوْرِسْتي تؤدي وظيفة اسمية وتشير إلى شخص يثبت تحت الشدة. وصيغة «الذي يصمد» عربية طبيعية تحفظ المفرد التمثيلي من غير تقييد غير لازم بالجنس، ولا تجعل الفعل حدثًا ماضيًا.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد δέ انتقالًا ذا مسحة مقابلة مع التحذيرات السابقة. و«أمّا» تُظهر هذه المقابلة بلغة عربية طبيعية، ويتجاوب معها ضمير الفصل الاستئنافي «فهو».
- source_word: ὑπομείνας (ὑπομένω)
  choice: يصمد
  rationale: الفعل يدل على البقاء والثبات تحت المحنة. «يصمد» واضح ومباشر، ويحمل معنى احتمال الضغط من غير إضافة اصطلاح لاهوتي.
- source_word: εἰς τέλος
  choice: إلى النهاية
  rationale: العبارة تدل على الاستمرار وصولًا إلى نقطة النهاية. «إلى النهاية» تقابل البنية اليونانية بإيجاز، مع إمكان «حتى النهاية» بوصفه بديلًا صحيحًا.
- source_word: οὗτος
  choice: فهو
  rationale: الضمير اليوناني استئنافي توكيدي بعد العبارة الاسمية. «فهو» يحفظ هذا الاستئناف والتوكيد من غير الصياغة الحرفية الثقيلة «فهذا».
- source_word: σωθήσεται
  choice: سيخلُص
  rationale: صيغة المستقبل المبني للمجهول من σῴζω قد تدل على الخلاص أو النجاة. «سيخلُص» تحافظ على الاتساع الدلالي والبعد الأخروي ولا تحصر المعنى في إنقاذ زمني.
theological_decisions:
- issue: مدلول σωθήσεται في سياق الصمود الأخروي
  choice: سيخلُص
  alternative: سينجو؛ سيُنقَذ
  rationale: لا تحسم الآية وحدها هل المقصود الخلاص الأخروي النهائي أم النجاة في الشدة أم كليهما؛ لذلك تُرك التعبير واسعًا ولم يُقيَّد بتفسير مذهبي لأثر الصمود أو طبيعة الخلاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «يصمد» لسهولة فهمه ودلالته على الثبات تحت المحنة، واستُخدم «فهو» لحفظ توكيد οὗτος بصورة طبيعية. ضُبطت «سيخلُص» بالشكل الجزئي لتفادي قراءتها خطأً على معنى الإخلاص.
