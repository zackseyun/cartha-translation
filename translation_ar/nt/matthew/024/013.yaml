  source_fidelity: 'النص العربي ينقل عناصر اليونانية بأمانة: «أمّا» تؤدي المقابلة الخفيفة في δέ، و«الذي يصمد» ينقل الاسم الموصول المبني على اسم الفاعل مع دلالة الثبات تحت الضيق، و«إلى النهاية» تقابل εἰς τέλος، و«فهو» يحفظ الاستئناف التوكيدي في οὗτος، و«سيخلُص» يبقي مجال σωθήσεται واسعًا بين الخلاص والنجاة دون حسم نطاقه.'
