  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: ar
  text: 'ولكن إن قال ذلك العبد الشرير[a] في قلبه: «سيّدي[b] يتأخر»،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ذلك الخادم الشرير». يمكن أن تدل الكلمة اليونانية على «عبد» أو «خادم» بحسب السياق.
    reason: lexical_alternative
  - marker: b
    text: أو «ربي يتأخر». المقصود في الإطار المنزلي للمثل هو السيد صاحب السلطان على العبد؛ والكلمة اليونانية هي «كيريوس».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ولكن إن
  rationale: تحفظ أداة الشرط مع دلالة δέ على الاستدراك الخفيف، وتأتي طبيعية في العربية.
- source_word: εἴπῃ
  choice: قال
  rationale: الماضي بعد «إن» أسلوب عربي فصيح طبيعي للتعبير عن الشرط المحتمل، ويحفظ القوة الشرطية لصيغة المصدر.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ذلك العبد الشرير
  rationale: «الشرير» تنقل الحكم الأخلاقي في κακός، و«العبد» تقابل δοῦλος بوضوح وتحفظ علاقة الخضوع في سياق البيت، و«ذلك» تحفظ اسم الإشارة.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: في قلبه
  rationale: تحفظ الصورة الأصلية للتفكير الباطني، وهي عبارة عربية مفهومة وذات سجل كتابي طبيعي.
- source_word: Χρονίζει
  choice: يتأخر
  rationale: تنقل الفعل المضارع بوصفه تأخرًا مستمرًا من منظور العبد، دون إضافة معنى غير موجود في النص.
- source_word: μου ὁ κύριος
  choice: سيدي
  rationale: «سيدي» تلائم قول العبد عن صاحب السلطان عليه في إطار المثل، وتحفظ معنى الملكية في μου ودلالة κύριος السياقية دون فرض لقب لاهوتي صريح.
theological_decisions:
- issue: دلالة κύριος في السياق المنزلي للمثل
  choice: سيدي
  alternative: ربي
  rationale: المتكلم عبد يشير داخل القصة إلى صاحب السلطان عليه؛ لذا توضح «سيدي» العلاقة المباشرة، بينما قد توحي «ربي» في العربية بإحالة إلهية صريحة. ومع ذلك لا تمنع الصياغة القارئ من إدراك مرمى المثل الأوسع.
- issue: ترجمة δοῦλος
  choice: العبد
  alternative: الخادم
  rationale: «العبد» هي المقابلة الأدق لوضع δοῦλος من جهة الخضوع والملكية، ولا تحصر اللفظة في مجرد أداء خدمة. ويُذكر البديل السياقي «الخادم» في الحاشية حفاظًا على المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة «في قلبه»، واستُعمل «سيدي» في الكلام المباشر لملاءمة السياق المنزلي، مع إثبات البدائل المعجمية في الحواشي.
