id: MAT.24.39
reference: Matthew 24:39
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: ar
  text: ولم يعلموا حتى جاء الطوفان وجرفهم جميعًا؛ هكذا أيضًا سيكون مجيء ابن الإنسان.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: لم يعلموا
  rationale: ينقل المعنى المباشر للفعل دون إضافة تفسير مثل «لم يدركوا الخطر» أو «لم ينتبهوا».
- source_word: κατακλυσμός
  choice: الطوفان
  rationale: هو المقابل العربي المألوف والدقيق للطوفان الوارد في سياق نوح.
- source_word: ἦρεν ἅπαντας
  choice: جرفهم جميعًا
  rationale: يحفظ صورة الطوفان الذي أخذهم وأزالهم، ويعبّر طبيعيًا عن أثر المياه في العربية؛ ولا يضيف صراحةً معنى الهلاك مع أن السياق يدل عليه.
- source_word: οὕτως ... καὶ
  choice: هكذا أيضًا
  rationale: يحافظ على المقارنة وعلى دلالة καὶ التي تقابل بين مجيء الطوفان ومجيء ابن الإنسان.
- source_word: παρουσία
  choice: مجيء
  rationale: مقابل واضح وشائع في هذا السياق الأخروي، مع إبقاء طبيعة المجيء وتفاصيله غير مفسرة.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصياغة العربية الراسخة للقب، وتحفظ طابعه الكتابي دون إعادة تفسيره.
theological_decisions:
- issue: دلالة عدم العلم
  choice: لم يعلموا
  alternative: لم يشعروا / لم يدركوا
  rationale: النص يقول إنهم لم يعلموا، ولا يحدد هنا هل المقصود الجهل أو عدم الاكتراث؛ لذلك تُحفظ سعة العبارة.
- issue: مقارنة الطوفان بمجيء ابن الإنسان
  choice: هكذا أيضًا سيكون
  alternative: كذلك يكون
  rationale: إثبات «أيضًا» يحفظ عنصر المقابلة الظاهر في καὶ من غير شرح لماهية التشابه beyond ما يقدمه السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «جرفهم» لتقديم صورة طبيعية قوية للطوفان، مع الحفاظ على الإيجاز والتوازي في الأصل.
