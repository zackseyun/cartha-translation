  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: ar
  text: حينئذ يسلّمونكم إلى الضيق[a] ويقتلونكم، وستبغضكم جميع الأمم[b] بسبب اسمي[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى الشدة» أو «إلى الاضطهاد». يمكن للكلمة اليونانية أن تدل على الضيق أو الكرب أو الاضطهاد.
    reason: lexical_alternative
  - marker: b
    text: 'أو «من الأمم كلها»، وأقل احتمالًا في هذا السياق: «من جميع الأمميين».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «بسبب اسمي»؛ أي بسبب الانتماء إلى يسوع وما يمثله اسمه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: ظرف زمان يدل على تتابع الأحداث في الخطاب، و«حينئذ» فصيحة واضحة وتحفظ الارتباط الزمني.
- source_word: παραδώσουσιν ὑμᾶς
  choice: يسلّمونكم
  rationale: يفيد الفعل تسليم شخص إلى سلطة غيره أو قبضته؛ والصياغة العربية تحافظ على هذا المعنى من غير أن تخصّصه بالخيانة.
- source_word: εἰς θλῖψιν
  choice: إلى الضيق
  rationale: «الضيق» يستوعب معنى الشدة والكرب والاضطهاد، ويحفظ احتمال الصدى الأخروي في السياق من غير تحويل اللفظ إلى مصطلح مذهبي تقني.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: ويقتلونكم
  rationale: ترجمة مباشرة للفعل الدال على القتل، من غير إضافة معنى «الاغتيال» أو الحكم القضائي بالإعدام.
- source_word: ἔσεσθε μισούμενοι
  choice: وتكونون مكروهين
  rationale: ينقل البناء المحيطي معنى المستقبل المبني للمجهول بصورة عربية طبيعية وقريبة من تركيب الأصل.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: من جميع الأمم
  rationale: «الأمم» هنا أرجح من «الأمميين» لأنها تعبّر عن شمول العداوة بين الشعوب، لا عن مقابلة عرقية أو دينية مخصوصة.
- source_word: διὰ τὸ ὄνομά μου
  choice: بسبب اسمي
  rationale: تنقل διά مع النصب معنى السبب، وتحفظ دلالة «الاسم» الكتابية بدل استبدالها بتفسير داخل المتن.
theological_decisions:
- issue: دلالة θλῖψις في خطاب ذي أفق أخروي
  choice: الضيق
  alternative: الشدة أو الاضطهاد أو الكرب
  rationale: «الضيق» يحفظ الجمع بين المعاناة الواقعية والرنين الأخروي المحتمل، من غير فرض نظام أخروي بعينه.
- issue: دلالة ἔθνη
  choice: الأمم
  alternative: الأمميون
  rationale: السياق يرجّح شمول الشعوب في العداوة، بينما «الأمميون» قد توحي بتقابل يهودي/غير يهودي لا يفرضه النص هنا.
- issue: دلالة «اسمي»
  choice: إبقاء العبارة الحرفية «بسبب اسمي»
  alternative: بسبب ولائكم لي
  rationale: إبقاء صورة الاسم يحفظ ثراءها اللاهوتي، وتوضّح الحاشية أنها تشير إلى الانتماء إلى يسوع وما يمثله اسمه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «حينئذ» للحركة الزمنية، و«الضيق» للحفاظ على سعة θλῖψις، مع إبقاء «اسمي» في المتن وشرح دلالته في الحاشية. وُضعت علامات الحواشي بعد العبارات التي تشرحها مباشرة.
