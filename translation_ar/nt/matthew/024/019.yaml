id: MAT.24.19
reference: Matthew 24:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: ar
  text: وَوَيْلٌ لِلْحَوَامِلِ وَالْمُرْضِعَاتِ فِي تِلْكَ الْأَيَّامِ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: وَوَيْلٌ
  rationale: يحفظ قوة صيحة التحذير والرثاء النبوية أمام الضيق الوشيك، وهو أقوى من «يا للأسف».
- source_word: δὲ
  choice: الواو في «وَوَيْلٌ»
  rationale: تفيد انتقالًا خفيفًا متصلًا بالسياق السابق؛ والواو العربية طبيعية هنا ولا تبالغ في إثبات تعارض.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: لِلْحَوَامِلِ
  rationale: يؤدي التعبير الاصطلاحي اليوناني بمعنى الحوامل في صياغة عربية واضحة وموجزة، مع إبقاء التأنيث الصريح في الأصل.
- source_word: ταῖς θηλαζούσαις
  choice: وَالْمُرْضِعَاتِ
  rationale: ينقل معنى النساء اللواتي يرضعن أطفالًا، من غير حاجة إلى إظهار المفعول المفهوم من الفعل والسياق.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: فِي تِلْكَ الْأَيَّامِ
  rationale: ترجمة زمنية مباشرة وطبيعية تحافظ على اسم الإشارة البعيد.
theological_decisions:
- issue: مرجع صيغتي التأنيث في عبارتي الحوامل والمرضعات
  choice: استعمال الاسمين المؤنثين «الحوامل» و«المرضعات» من غير إضافة «النساء»
  alternative: للنساء الحوامل والنساء المرضعات
  rationale: الصيغ اليونانية مؤنثة بوضوح، والعربية تعبّر عن المرجع بدقة وطبيعية بهذين الاسمين من غير إضافة اسم غير مذكور صراحة في الأصل.
- issue: قوة οὐαί بين التحذير والرثاء
  choice: «ويل» مع علامة التعجب
  alternative: «يا للأسف»
  rationale: «ويل» يبقي التوتر المقصود بين إعلان شدة المصير والرثاء لحال المتضررات، من غير حصر العبارة في دعاء عليهن أو في مجرد الأسف.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت صيغة موجزة قريبة من بنية الأصل، من غير حشو أو تفسير زائد.
