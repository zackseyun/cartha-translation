base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: ar
  text: 'فأجاب وقال لهم: «أما ترون هذه كلَّها؟ الحق أقول لكم: لن يُترَك هنا حجرٌ على حجر إلا ويُهدَم[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يُنقَض». يدل الفعل اليوناني على تفكيك البناء أو هدمه.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب وقال لهم
  rationale: يحافظ على الفعلين في التعبير اليوناني المتأثر بالأسلوب السامي، مع بقاء العبارة طبيعية ومفهومة بالعربية.
- source_word: Οὐ βλέπετε
  choice: أما ترون
  rationale: ينقل السؤال البلاغي الذي يتوقع الإقرار، ويعبّر عن الرؤية الحسية والانتباه إلى ما أمامهم.
- source_word: ταῦτα πάντα
  choice: هذه كلَّها
  rationale: صياغة عربية طبيعية تحافظ على شمول العبارة، ومرجعها مباني الهيكل المذكورة في السياق.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: ينقل الصيغة التوكيدية المهيبة التي يستهل بها يسوع قوله، بلغة عربية واضحة راسخة.
- source_word: οὐ μὴ ἀφεθῇ
  choice: لن يُترَك
  rationale: «لن» مع المبني للمجهول تنقل النفي المستقبلي القاطع، ويزداد توكيده من سياق عدم بقاء أي حجر.
- source_word: ὧδε
  choice: هنا
  rationale: ينقل الظرف المكاني مباشرة، مشيرًا إلى موضع الهيكل في السياق.
- source_word: λίθος ἐπὶ λίθον
  choice: حجرٌ على حجر
  rationale: يحافظ على الصورة المعمارية الموجزة والطبيعية في العربية.
- source_word: καταλυθήσεται
  choice: يُهدَم
  rationale: الفعل في هذا السياق يدل على نقض البناء وإسقاطه؛ و«يُهدم» واضح ودقيق مع إبقاء البديل الأقرب إلى التفكيك في الحاشية.
theological_decisions:
- issue: مدى نبوءة يسوع وقوتها بشأن الهيكل
  choice: صياغتها نبوءة ملموسة بهدم البناء هدمًا شاملًا
  alternative: فهمها قولًا رمزيًا في المقام الأول، أو ربطها ضمن الترجمة بإطار أخروي بعينه
  rationale: صور الحجارة والبناء والنقض صور معمارية محسوسة. تحفظ الترجمة هذا المعنى من غير أن تضيف تحديدًا عقائديًا أو أخرويًا لا يصرّح به العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «أما ترون» للسؤال البلاغي، و«الحق أقول لكم» للصيغة التوكيدية، مع الحفاظ على الصورة المعمارية الملموسة وتجنّب التفسير المذهبي الزائد.
