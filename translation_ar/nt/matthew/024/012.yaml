  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: ar
  text: وَلِأَنَّ التَّعَدِّيَ عَلَى الشَّرِيعَةِ سَيَكْثُرُ[a]، سَتَبْرُدُ مَحَبَّةُ كَثِيرِينَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبسبب ازدياد التعدّي على الشريعة».'
    reason: بديل تركيبي يحوّل العبارة الفعلية السببية إلى تركيب اسمي مع الحفاظ على المعنى.
  - marker: b
    text: 'أو: «محبة الكثيرين».'
    reason: بديل أقرب إلى إظهار أداة التعريف في العبارة اليونانية τῶν πολλῶν.
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: وَلِأَنَّ ... سَيَكْثُرُ
  rationale: تفيد διά مع المصدر المحلّى بأداة التعريف السببية. وتحافظ الصياغة الفعلية المستقبلية على القوة اللفظية للمصدر اليوناني في هذا السياق، من غير تحويله بالضرورة إلى اسم.
- source_word: ἀνομίαν
  choice: التَّعَدِّيَ عَلَى الشَّرِيعَةِ
  rationale: ينقل معنى مخالفة الشريعة أو تجاهلها بعبارة عربية واضحة، وهو أدق من ألفاظ أعم مثل «الشر» وأيسر فهمًا من بعض الألفاظ التراثية المحتملة.
- source_word: ψυγήσεται
  choice: سَتَبْرُدُ
  rationale: يحافظ على صورة البرودة في الأصل، ويعبّر طبيعيًا في العربية عن فتور المحبة، من غير اللجوء إلى مبني للمجهول متكلف.
- source_word: ἀγάπη
  choice: مَحَبَّةُ
  rationale: المقابل العربي المباشر والمألوف، ويحفظ اتساع الدلالة من غير تخصيص نوع المحبة بما لا يصرح به النص.
- source_word: τῶν πολλῶν
  choice: كَثِيرِينَ
  rationale: صياغة عربية طبيعية تحفظ الإبهام في نطاق الجماعة، ولا تحوّل العبارة إلى حكم إحصائي مثل «معظم الناس».
theological_decisions:
- issue: نطاق «محبة كثيرين»
  choice: أُبقيت هوية «كثيرين» غير محددة.
  alternative: تخصيصهم بالمؤمنين، أو بالناس عمومًا، أو بجماعة مختلطة.
  rationale: لا تعيّن العبارة اليونانية τῶν πολλῶν الجماعة المقصودة صراحة، ولذلك يحفظ النص التوتر التفسيري ولا يفرض تحديدًا لاهوتيًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «ستبرد» للمحافظة على الاستعارة الأصلية، و«التعدّي على الشريعة» لإبراز الصلة الدلالية بالقانون أو الشريعة دون غموض لفظي.
