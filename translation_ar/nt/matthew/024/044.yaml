base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: ar
  text: لِذَلِكَ كُونُوا أَنْتُمْ أَيْضًا مُسْتَعِدِّينَ، لِأَنَّ ابْنَ الْإِنْسَانِ يَأْتِي فِي سَاعَةٍ لَا تَتَوَقَّعُونَهَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في ساعة لا تظنون أنه يأتي فيها». يمكن أن يعني الفعل اليوناني «يظن» أو «يحسب»، ويؤدي في هذا السياق معنى «يتوقع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تفيد العبارة تعليلًا واستنتاجًا يعودان إلى التحذير السابق، و«لذلك» تنقل هذه الصلة بوضوح وإيجاز.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: إظهار الضمير المنفصل يحفظ توكيد الضمير اليوناني، و«أيضًا» تنقل معنى الإضافة والشمول.
- source_word: γίνεσθε ἕτοιμοι
  choice: كونوا مستعدين
  rationale: صيغة الأمر الحاضرة تدعو إلى اتخاذ حالة الاستعداد والاستمرار فيها؛ وهذه الصياغة عربية طبيعية وتحفظ قوة الأمر دون إضافة لفظ مثل «يجب» غير موجود صراحةً.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم الأداة هنا سبب الأمر بالاستعداد، ولذلك فالصياغة السببية هي الأنسب.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: في ساعة لا تتوقعونها
  rationale: التركيب ذو دلالة زمنية، و«تتوقعون» يؤدي المعنى السياقي للفعل δοκέω في تحذير يتعلق بمجيء غير منتظر، مع التنبيه في الحاشية إلى المعنى الأقرب إلى اللفظ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة الحرفية المألوفة تحفظ صيغة اللقب وخلفيته الكتابية ودلالته المسيحانية من غير تفسير زائد.
- source_word: ἔρχεται
  choice: يأتي
  rationale: المضارع العربي يحفظ حيوية المضارع اليوناني ويمكن أن يدل سياقيًا على المجيء الآتي دون تحويله صراحةً إلى مستقبل.
theological_decisions:
- issue: ترجمة اللقب المسيحاني ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: «ابن الإنسان» يحفظ بنية اللقب وصِلته المحتملة بدانيال واستعماله الراسخ في الأناجيل، أما البديل فيختزل اللقب ويحل بعض توتره الدلالي.
- issue: القيمة الزمنية للفعل ἔρχεται
  choice: يأتي
  alternative: سيأتي
  rationale: اختيار المضارع يحفظ صيغة النص وحيويته، مع بقاء الإشارة إلى المستقبل مفهومة من سياق التحذير، بدل حسمها نحويًا بصيغة المستقبل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «كونوا مستعدين» بوصفه تعبيرًا طبيعيًا عن الأمر المستمر، وأُبقي لقب «ابن الإنسان» بصيغته الكتابية المعروفة. وُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
