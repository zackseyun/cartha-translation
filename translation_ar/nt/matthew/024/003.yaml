id: MAT.24.3
reference: Matthew 24:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: ar
  text: 'وبينما كان جالسًا على جبل الزيتون، تقدم إليه التلاميذ على انفراد قائلين: «قل لنا: متى تكون هذه الأمور، وما علامة مجيئك[a] وانقضاء الدهر[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حضورك» أو «وصولك».
    reason: lexical_alternative
  - marker: b
    text: 'أو «اكتمال الدهر»؛ وتُترجم تقليديًا: «نهاية العالم».'
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: وبينما كان جالسًا
  rationale: تركيب إضافي مطلق يفيد الظرف الزمني؛ والصياغة العربية تحافظ على استمرار الجلوس وتلائم السرد.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: جبل الزيتون
  rationale: الاسم الجغرافي العربي الشائع، وهو أنسب من الترجمة الحرفية بصيغة الجمع.
- source_word: προσῆλθον αὐτῷ
  choice: تقدم إليه
  rationale: ينقل حركة الاقتراب المقصودة في الفعل اليوناني بصياغة عربية طبيعية.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: تعبير عربي واضح يفيد أنهم خاطبوه بعيدًا عن الآخرين.
- source_word: Εἰπὸν ἡμῖν
  choice: قل لنا
  rationale: ينقل صيغة الأمر المباشرة بأمانة وإيجاز.
- source_word: πότε ταῦτα ἔσται
  choice: متى تكون هذه الأمور
  rationale: يحافظ على عموم فعل الكينونة وعلى الإشارة إلى ما سبق، من غير تحويله بالضرورة إلى «تحدث».
- source_word: σημεῖον
  choice: علامة
  rationale: المقابل العربي المألوف والواضح في هذا السياق الأخروي.
- source_word: παρουσίας
  choice: مجيئك
  rationale: يلائم السؤال المستقبلي في السياق، مع إبقاء معنيي الحضور والوصول الممكنين في الحاشية.
- source_word: συντελείας τοῦ αἰῶνος
  choice: انقضاء الدهر
  rationale: «انقضاء» يعبّر عن بلوغ الحقبة نهايتها، و«الدهر» يدل على العصر أو الحقبة لا على الكون المادي.
theological_decisions:
- issue: دلالة παρουσία في الخطاب الأخروي
  choice: مجيئك
  alternative: حضورك أو وصولك
  rationale: «المجيء» واضح في سياق السؤال عن المستقبل، لكنه لا يحصر اللفظة في تفسير زمني أو مذهبي معين؛ وتُذكر البدائل المعجمية في الحاشية.
- issue: دلالة συντελείας τοῦ αἰῶνος
  choice: انقضاء الدهر
  alternative: اكتمال الدهر أو نهاية العالم
  rationale: يحافظ الاختيار على الإشارة إلى نهاية حقبة أو عصر، ولا يضيف إلى النص تصريحًا بفناء العالم المادي؛ أما «اكتمال» فيبرز معنى بلوغ الغاية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «هذه الأمور» بدل «هذه الأشياء» لسلامة الأسلوب، وحُفظت الصلة بين «مجيئك» و«انقضاء الدهر» من غير فرض طبيعة العلاقة بينهما.
