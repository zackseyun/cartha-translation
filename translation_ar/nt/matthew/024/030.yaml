reference: Matthew 24:30
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: ar
  text: وحينئذ تظهر علامة ابن الإنسان في السماء[a]، وحينئذ تنوح جميع قبائل الأرض[b]، ويرون ابن الإنسان آتيًا على سحب السماء بقوة ومجد عظيم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الجو». فاللفظة اليونانية يمكن أن تعني «السماء» أو «الجو» بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «جميع قبائل البلاد». فاللفظة اليونانية يمكن أن تعني «الأرض» أو «البلاد».'
    reason: alternative_reading
  - marker: c
    text: تستدعي عبارة «آتيًا على سحب السماء» صدى دانيال 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: تظهر
  rationale: صيغة المستقبل هنا تؤدي معنى الظهور أو الصيرورة إلى العيان، و«تظهر» طبيعية وواضحة في العربية.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: علامة ابن الإنسان
  rationale: 'تحافظ الإضافة العربية على غموض التركيب اليوناني: أهي علامة مرتبطة بابن الإنسان أم أن ابن الإنسان نفسه هو العلامة، من غير حسم تفسيري.'
- source_word: ἐν τῷ οὐρανῷ
  choice: في السماء
  rationale: «السماء» تلائم السياق الرؤيوي وتحفظ إمكان فهم اللفظ اليوناني على أنه السماء أو فضاء السماء، مع إثبات البديل في الحاشية.
- source_word: κόψονται
  choice: تنوح
  rationale: الفعل في هذا الاستعمال يدل على النواح والحداد؛ و«تنوح» تنقل قوة التعبير بوضوح من غير إلزام النص بإيماءة جسدية محددة.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: جميع قبائل الأرض
  rationale: «قبائل» المقابل المباشر لـ φυλαί، و«الأرض» أنسب للسياق الكوني، مع إبقاء معنى «البلاد/الأرض المعينة» احتمالًا في الحاشية.
- source_word: ὄψονται
  choice: يرون
  rationale: ترجمة مباشرة وطبيعية لفعل الرؤية في المستقبل ضمن السياق العربي.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: آتيًا على سحب السماء
  rationale: تحفظ الصورة المكانية والصدى الواضح لدانيال 7:13، و«آتيًا» صياغة عربية فصيحة ومفهومة.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: بقوة ومجد عظيم
  rationale: تحافظ الصياغة على تعلق وصف العظمة بالمجد مباشرة، كما في التركيب اليوناني، وتأتي طبيعية في العربية.
theological_decisions:
- issue: معنى «علامة ابن الإنسان»
  choice: 'الإبقاء على الإضافة من غير تفسير: «علامة ابن الإنسان»'
  alternative: «العلامة الخاصة بابن الإنسان» أو «العلامة، أي ابن الإنسان نفسه»
  rationale: التركيب اليوناني لا يحسم العلاقة المقصودة، لذا تحفظ الترجمة الغموض اللاهوتي بدل أن تختار تفسيرًا بعينه.
- issue: مدى معنى γῆ في «قبائل الأرض»
  choice: الأرض
  alternative: البلاد أو الأرض المعينة
  rationale: السياق الكوني والرؤيوي يرجح المعنى الشامل، لكن احتمال الإشارة إلى البلاد/الأرض يبقى معتبرًا ويُذكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة تلائم الخطاب الرؤيوي. استُخدمت «وحينئذ» لتماسك التسلسل، و«تنوح» لنقل معنى الحداد بلفظ مألوف ودقيق، مع تجنب الألفاظ المذهبية أو التفسيرية.
