  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: ar
  text: 'فأجابهم يسوع: «احذروا أن يُضِلَّكم أحد[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يخدعكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: فأجابهم
  rationale: يجمع التعبير العربي الطبيعي بين معنى الاستجابة وفعل القول في الصيغة اليونانية السامية التأثير، من غير تكرار ثقيل مثل «أجاب وقال لهم».
- source_word: Βλέπετε μή
  choice: احذروا أن
  rationale: ينقل الاستعمال الاصطلاحي لفعل الأمر مع μή، وهو التنبيه إلى الاحتراز ومنع وقوع الفعل التالي، بعبارة عربية واضحة وطبيعية.
- source_word: τις
  choice: أحد
  rationale: مع سياق النهي تفيد «أحد» معنى «أيّ شخص»، وتؤدي معنى الضمير اليوناني غير المحدد بصورة موجزة.
- source_word: πλανήσῃ
  choice: يُضِلَّكم
  rationale: يحفظ معنى حمل الآخرين على الضلال أو إبعادهم عن الطريق الصحيح، وهو أوسع من مجرد الخداع الذهني ويناسب سياق التحذير.
theological_decisions:
- issue: طبيعة التحذير في πλανήσῃ
  choice: يُضِلَّكم
  alternative: يخدعكم
  rationale: اختير «يُضِلَّكم» للمحافظة على اتساع المعنى بين الخداع والانحراف عن الطريق، من غير حصر التحذير في تلقي معلومة كاذبة فقط. وأُبقي البديل المعجمي في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة وموجزة، مع الحفاظ على نبرة التحذير المباشر. وُضع مؤشر الحاشية بعد الفعل الذي تتعلق به دلاليًا.
