  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: ar
  text: فلا ينزل من كان على سطح البيت ليأخذ ما في بيته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي السطح العلوي المستوي القابل للاستعمال في بيوت ذلك العصر.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: من كان على سطح البيت
  rationale: ينقل التركيب الاسمي الدال على الشخص الموجود فوق البيت بصياغة عربية طبيعية، من غير تخصيص غير لازم بلفظ «الرجل».
- source_word: δώματος
  choice: سطح البيت
  rationale: يشير إلى السطح العلوي المستوي القابل للاستعمال في بيوت ذلك العصر، و«سطح البيت» واضح ودقيق في العربية المعاصرة.
- source_word: μὴ καταβάτω
  choice: فلا ينزل
  rationale: صيغة نهي مباشرة تحفظ إلحاح الأمر، وتعبّر عن النزول من السطح إلى داخل البيت أو إلى أسفله.
- source_word: ἆραι
  choice: ليأخذ
  rationale: المصدر هنا يفيد الغرض؛ أي لا ينزل بغرض أخذ شيء.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: ما في بيته
  rationale: التركيب اليوناني موجز وإضماري ويشير إلى الأشياء الموجودة في البيت؛ وهذه الصياغة طبيعية ولا تحصرها تفسيرياً في «الأمتعة» أو «المقتنيات».
- source_word: οἰκίας αὐτοῦ
  choice: بيته
  rationale: يحفظ المعنى المكاني الملموس للبيت والضمير المفرد المذكر التمثيلي في الأصل.
theological_decisions:
- issue: الإشارة بالمفرد المذكر على سبيل التمثيل
  choice: الإبقاء على ضمير المفرد المذكر في «بيته»
  alternative: بيته أو بيتها / بيتهم
  rationale: الأصل يستعمل مفرداً مذكراً ذا قوة تمثيلية عامة، وليس المقصود تقرير معنى عقدي خاص بالنوع؛ لذا تُحفظ الصيغة من غير توسيع أو تحييد تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُعمل «سطح البيت» بدلاً من «السطح» وحده لإبراز الدلالة المعمارية، وجاء النهي بصيغة طبيعية تحفظ سرعة التوجيه في السياق.
