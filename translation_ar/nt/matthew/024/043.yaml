lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: ولكن اعلموا هذا
  rationale: تنقل «ولكن» التحول في مسار الكلام، وتؤدي «اعلموا هذا» الصيغة بوصفها أمرًا مباشرًا طبيعيًّا في العربية، مع بقاء احتمال قراءتها خبرًا من جهة الصيغة اليونانية.
- source_word: οἰκοδεσπότης
  choice: ربُّ البيت
  rationale: تعبير عربي واضح يحافظ على معنى رئيس البيت أو المسؤول عنه، من غير افتراض حديث يتعلق بملكية العقار.
- source_word: ποίᾳ φυλακῇ
  choice: في أيِّ هزيعٍ من الليل
  rationale: تشير φυλακή هنا إلى قسم من أقسام الليل؛ و«هزيع من الليل» تعبير عربي موجز يحفظ الصورة الزمنية القديمة ويوضح المقصود.
- source_word: ὁ κλέπτης ἔρχεται
  choice: يأتي اللص
  rationale: يحافظ المضارع العربي على صيغة الحاضر اليونانية داخل الشرط الافتراضي، وهو مستقيم وطبيعي في العربية.
- source_word: ἐγρηγόρησεν ἂν
  choice: لسهر
  rationale: يؤدي معنى البقاء مستيقظًا ومتيقظًا، ويلائم صورة مجيء اللص ليلًا.
- source_word: οὐκ ἂν εἴασεν
  choice: ولم يدع
  rationale: صياغة عربية طبيعية تؤدي معنى عدم السماح بوقوع الفعل.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: بيته يُقتحم
  rationale: ينقل المعنى السياقي، أي دخول اللص إلى البيت بالقوة، بلغة مفهومة؛ أما الصورة الحرفية، وهي نقب البناء، فمحفوظة في الحاشية.
theological_decisions:
- issue: دلالة رب البيت في المثل
  choice: ربُّ البيت
  alternative: صاحب البيت؛ رب الأسرة
  rationale: العبارة جزء من صورة تمثيلية وليست لقبًا عقائديًّا هنا؛ وهذا الاختيار يحفظ الدور الاجتماعي من غير تحميل النص افتراضات حديثة عن الملكية.
- issue: صورة اقتحام البيت
  choice: بيته يُقتحم
  alternative: يُنقَب بيته
  rationale: يقدّم النص المعنى المقصود بوضوح، مع إبقاء الصورة الحرفية المرتبطة بطريقة اختراق البيوت القديمة في الحاشية، من غير استنتاج لاهوتي زائد.
- issue: صيغة γινώσκετε
  choice: اعلموا
  alternative: أنتم تعلمون
  rationale: الصيغة اليونانية يمكن من حيث الشكل أن تكون أمرًا أو خبرًا، لكن السياق الخطابي يرجّح الأمر؛ ولم يُبنَ على هذا الترجيح معنى عقائدي خاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «هزيع من الليل» للحفاظ على التقسيم الليلي القديم مع إيضاحه في الحاشية، واستُعمل «يُقتحم» في المتن لسلاسة الفهم مع حفظ الصورة الحرفية في الحاشية.
