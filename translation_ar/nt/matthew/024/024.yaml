source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: ar
  text: لِأَنَّهُ سَيَقُومُ مُسَحَاءُ كَذَبَةٌ[a] وَأَنْبِيَاءُ كَذَبَةٌ، وَيَصْنَعُونَ آيَاتٍ عَظِيمَةً وَعَجَائِبَ، حَتَّى يُضِلُّوا[b]، إِنْ أَمْكَنَ[c]، الْمُخْتَارِينَ أَنْفُسَهُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أناس يدّعون أنهم المسيح. والكلمة اليونانية هي جمع لقب «المسيح».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «يخدعوا». والفعل قد يعني التسبب في أن يضلّ الإنسان أو ينحرف عن الطريق.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لو أمكن». واليونانية تقول باختصار: «إن أمكن»، من غير أن تصرّح بما إذا كان ذلك ممكنًا بالفعل.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: سيقوم
  rationale: الفعل المبني للمجهول يُستعمل هنا اصطلاحيًا للظهور والبروز على الساحة؛ و«سيقوم» تعبير عربي طبيعي لا يوحي بالقيامة من الموت في هذا السياق.
- source_word: ψευδόχριστοι
  choice: مسحاء كذبة
  rationale: «المسيح» هنا لقب، وصيغة الجمع «مسحاء» تحفظ هذا المعنى، مع نقل السابقة ψευδο- بلفظ «كذبة».
- source_word: ψευδοπροφῆται
  choice: أنبياء كذبة
  rationale: ترجمة مباشرة وطبيعية للاسم المركب في العربية الكتابية المعاصرة.
- source_word: δώσουσιν
  choice: يصنعون
  rationale: مع «آيات وعجائب» لا يُترجم δίδωμι حرفيًا إلى «يعطون»، بل يدل على إحداث هذه الأعمال أو صنعها.
- source_word: σημεῖα μεγάλα
  choice: آيات عظيمة
  rationale: تحفظ «آيات» الدلالة الإشارية أو البرهانية لـσημεῖα، و«عظيمة» تنقل μεγάλα مباشرة.
- source_word: τέρατα
  choice: عجائب
  rationale: لفظ عربي مألوف ودقيق لما يثير الدهشة، ويحفظ الاقتران التقليدي «آيات وعجائب».
- source_word: ὥστε πλανῆσαι
  choice: حتى يضلوا
  rationale: ينقل تركيب النتيجة أو الغاية المحتملة دون حسمه حصرًا في أحد الوجهين.
- source_word: πλανῆσαι
  choice: يضلوا
  rationale: يحفظ معنى التسبب في الضلال، وهو أوسع من مجرد قول الكذب أو الخداع اللفظي.
- source_word: εἰ δυνατὸν
  choice: إن أمكن
  rationale: ترجمة موجزة ومباشرة للشرط اليوناني، من غير إضافة دلالة امتناع غير مصرّح بها.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: حتى المختارين
  rationale: «حتى» تنقل القوة التصاعدية لـκαί، و«المختارين» لفظ واضح يحفظ معنى ἐκλεκτούς.
theological_decisions:
- issue: دلالة ψευδόχριστοι بوصف Χριστός لقبًا
  choice: مسحاء كذبة
  alternative: أناس يدّعون أنهم المسيح؛ مسحاء مزيفون
  rationale: صيغة «مسحاء» تحفظ اللقب المسياني في صيغة الجمع دون تحويله إلى اسم علم أو إدخال تفسير مطوّل في المتن.
- issue: قوة الشرط εἰ δυνατὸν في شأن المختارين
  choice: إن أمكن
  alternative: لو أمكن؛ إن كان ذلك ممكنًا
  rationale: يبقي النص على الشرط كما في اليونانية، ولا يحسم ضمنًا الجدل اللاهوتي حول إمكان إضلال المختارين.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «مسحاء» للمحافظة على الصيغة اللقبية والجمع في الأصل، و«حتى» مرتين بوظيفتين مختلفتين واضحتين من السياق: الأولى للغاية أو النتيجة، والثانية للتصعيد بمعنى «حتى المختارين أنفسهم».'
