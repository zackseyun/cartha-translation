  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: ar
  text: 'لِأَنَّ كَثِيرِينَ سَيَأْتُونَ بِاسْمِي قَائِلِينَ: «أَنَا هُوَ الْمَسِيحُ»[a]، وَسَيُضِلُّونَ كَثِيرِينَ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أنا هو الممسوح». واللفظ اليوناني هو ὁ χριστός، وهو لقب يعني «الممسوح».'
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ
  choice: كَثِيرِينَ
  rationale: تنقل الصفة الكمية بصياغة عربية مباشرة، وهي اسم «أنَّ» منصوب.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحفظ القوة التفسيرية التي تربط القول بالتحذير السابق، وهي أوضح في العربية من حذف الأداة.
- source_word: ἐλεύσονται
  choice: سَيَأْتُونَ
  rationale: مقابل عربي طبيعي ودقيق لصيغة المستقبل من ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: بِاسْمِي
  rationale: تعبير عربي مألوف يحفظ احتمال الاستناد إلى اسم يسوع أو ادعاء تمثيله وهويته، من غير حصر المعنى في تفسير واحد.
- source_word: λέγοντες
  choice: قَائِلِينَ
  rationale: ينقل اسم الفاعل الذي يقدم مضمون ادعائهم من غير إضافة دلالة تفسيرية مثل «مدّعين».
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: أَنَا هُوَ الْمَسِيحُ
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني χριστός، و«هو» تقوي الإسناد في سياق ادعاء الهوية من غير تغيير مضمونه.
- source_word: πλανήσουσιν
  choice: سَيُضِلُّونَ
  rationale: يحفظ معنى التسبب في الضلال، بما يشمل الخداع والانحراف عن الطريق، بإيجاز عربي طبيعي.
- source_word: πολλοὺς
  choice: كَثِيرِينَ
  rationale: مفعول به يدل على أشخاص كثيرين، ولا يحتاج في العربية إلى إضافة «من الناس».
theological_decisions:
- issue: ترجمة اللقب χριστός في ادعاء مسياني كاذب
  choice: الْمَسِيحُ
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي المفهوم والراسخ، ويحافظ هنا على كون العبارة ادعاءً بالهوية المسيانية لا اسمًا شخصيًا؛ أما «الممسوح» فأشد حرفية لكنه أقل طبيعية وقد يوحي بوصف عام.
- issue: دلالة عبارة ἐπὶ τῷ ὀνόματί μου
  choice: بِاسْمِي
  alternative: مُسْتَنِدِينَ إِلَى اسْمِي / مُنْتَحِلِينَ اسْمِي
  rationale: تبقي «باسمي» المجال الدلالي مفتوحًا بين ادعاء السلطة والتمثيل والارتباط بالهوية، بينما البدائل تحسم وجهًا تفسيريًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة قريبة من بنية الأصل مع سلاسة عربية، وحُفظ التكرار بين «كثيرين» الأولى والثانية. أُثبتت علامة الحاشية [a] بعد الادعاء الذي تشرحه.
