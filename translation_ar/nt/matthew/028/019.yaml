base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: ar
  text: فاذهبوا إذًا واجعلوا جميع الأمم تلاميذ، وعمِّدوهم باسم الآب والابن والروح القدس[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى اسم الآب والابن والروح القدس». ترد العبارة في اليونانية حرفيًا: «إلى الاسم»، وقد تشدّد على الدخول في علاقة بالاسم أو الانتساب إليه.'
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: فاذهبوا
  rationale: اسم الفاعل اليوناني السابق لفعل الأمر الرئيسي يؤدي هنا معنى ملازمًا للأمر؛ وصيغة الأمر العربية طبيعية وتحفظ قوة الإرسالية، بخلاف «إذ تذهبون» التي قد توحي بأن الذهاب أمر عارض.
- source_word: οὖν
  choice: إذًا
  rationale: تفيد الاستنتاج من إعلان سلطان يسوع في الآية السابقة، و«إذًا» تربط التكليف بذلك الإعلان بوضوح ومن غير ثقل أسلوبي.
- source_word: μαθητεύσατε
  choice: اجعلوا ... تلاميذ
  rationale: يحمل الفعل معنى التسبب في أن يصير الآخرون تلاميذ؛ وهذه الصياغة أوضح في العربية المعاصرة من استعمال فعل اصطلاحي مثل «تلمذوا».
- source_word: πάντα τὰ ἔθνη
  choice: جميع الأمم
  rationale: تحفظ الشمول والنطاق القومي أو الشعوبي في العبارة اليونانية، ولا تضيّق المعنى إلى غير اليهود وحدهم.
- source_word: βαπτίζοντες
  choice: معمِّدين
  rationale: تحفظ المصطلح المسيحي المعروف من غير حسم كيفية إجراء المعمودية، وتبقي صلة اسم الفاعل بالأمر الرئيسي ظاهرة.
- source_word: εἰς τὸ ὄνομα
  choice: إلى اسم
  rationale: تحفظ الدلالة الاتجاهية الأساسية لحرف الجر εἰς، بما قد يشير إلى الدخول في علاقة أو هوية مرتبطة بالاسم، مع إثبات الصياغة العربية الأشهر «باسم» في الحاشية.
- source_word: τοῦ πατρὸς
  choice: الآب
  rationale: «الآب» هو اللقب العربي المسيحي الواضح في هذه الصيغة، ويميّزه من الاستعمال العام لكلمة «الأب».
- source_word: τοῦ υἱοῦ
  choice: الابن
  rationale: يحفظ اللقب البنوي في التوازي مع الآب والروح القدس من غير إضافة تفسيرية.
- source_word: τοῦ ἁγίου πνεύματος
  choice: الروح القدس
  rationale: هو التعبير العربي المعاصر الراسخ للمرجع الإلهي في الصيغة الثلاثية.
theological_decisions:
- issue: ترجمة حرف الجر εἰς في صيغة المعمودية
  choice: إلى اسم
  alternative: باسم
  rationale: «إلى» تمثل الاتجاه في النص اليوناني وقد توحي بالدخول في علاقة أو انتساب، من غير بناء نظرية أسرارية كاملة على العبارة. أما «باسم» فهي صياغة عربية تقليدية ممكنة، ولذلك أُثبتت في الحاشية.
- issue: الاسم المفرد مع الآب والابن والروح القدس
  choice: الإبقاء على «اسم» مفردًا وعلى الألقاب الثلاثة منسقة كما في المصدر
  alternative: توسيع العبارة بتفسير عقائدي صريح
  rationale: يحفظ النص البنية اليونانية ذات الاسم الواحد والمضافات الثلاثة، من غير تجاوز ألفاظ الآية أو تسوية ما فيها من كثافة لاهوتية بتفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «اجعلوا ... تلاميذ» بدل الفعل الاصطلاحي الأقل شيوعًا «تلمذوا»، وأُبقيت «إلى اسم» رغم أنها أقل مألوفية لحفظ دلالة الأصل، مع توضيح البديل الاصطلاحي في الحاشية.
