  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: ar
  text: وغادرتا القبر سريعًا، وهما في خوف[a] وفرح عظيم، وركضتا لتخبرا تلاميذه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهما في رهبة وفرح عظيم». يمكن للكلمة اليونانية المترجمة «خوف» أن تفيد أيضًا رهبة الإجلال في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: غادرتا
  rationale: اسم فاعل ماضٍ مؤنث جمع في اليونانية، والفاعل امرأتان بحسب السياق؛ وصيغة المثنى العربية أدق وأطبع هنا.
- source_word: ταχὺ
  choice: سريعًا
  rationale: ينقل معنى السرعة والعجلة نقلًا مباشرًا وطبيعيًا.
- source_word: μνημείου
  choice: القبر
  rationale: يشير في سياق القيامة إلى موضع الدفن، و«القبر» هو التعبير العربي الواضح المألوف.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: وهما في خوف وفرح عظيم
  rationale: يحفظ اجتماع الخوف والفرح من غير اختزال الخوف في الرهبة وحدها أو إزالة التوتر المقصود بين الشعورين.
- source_word: ἔδραμον
  choice: ركضتا
  rationale: ينقل الفعل الحسي الواضح «ركضتا» بدل تخفيفه إلى «أسرعتا».
- source_word: ἀπαγγεῖλαι
  choice: لتخبرا
  rationale: مصدر غرض يفيد نقل الخبر؛ لا يُضاف مفعول صريح لأن النص اليوناني لم يذكره.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: تلاميذه
  rationale: «التلاميذ» هو المقابل السياقي المألوف لـ μαθηταί، والضمير عائد إلى يسوع.
theological_decisions:
- issue: التوتر العاطفي في استجابة المرأتين
  choice: في خوف وفرح عظيم
  alternative: في رهبة وفرح عظيم
  rationale: لفظة φόβος قد تتضمن الرهبة في هذا السياق، لكن «خوف» يحفظ دلالتها الأساسية والتوتر الذي يجمعه متّى مع الفرح العظيم، من غير حسمها في معنى تعبدي فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل المثنى لأن المشار إليهما امرأتان في السياق، مع إبقاء الخبر نفسه غير مصرّح به كما في اليونانية.
