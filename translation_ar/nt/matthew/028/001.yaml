base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: ar
  text: وبعد السبت[a]، عند بزوغ فجر اليوم الأول من الأسبوع، جاءت مريم المجدلية ومريم الأخرى لتنظرا القبر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في أواخر السبت، عند بزوغ فجر اليوم الأول من الأسبوع». يمكن فهم العبارة اليونانية الافتتاحية بمعنى «بعد السبت» أو «في أواخر السبت».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: وبعد السبت
  rationale: يمكن أن تدل ὀψέ مع المضاف إليه على الزمن اللاحق، وσαββάτων صيغة جمع تُستعمل اصطلاحيًا للدلالة على السبت المفرد. نُقلت δέ بواو ربط خفيفة تلائم السرد العربي.
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: إذ كان فجر اليوم الأول من الأسبوع يطلع
  rationale: يشير ἐπιφώσκω هنا على الأرجح إلى انبلاج الضوء، وμίαν σαββάτων تعبير اصطلاحي عن اليوم الأول من الأسبوع. تعكس الصياغة العربية اتجاه الزمن نحو طلوع ذلك اليوم بصورة طبيعية.
- source_word: ἦλθεν
  choice: جاءت
  rationale: فعل مفرد يسبق فاعلين معطوفين، وهي مطابقة فصيحة طبيعية في العربية.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة، من غير إضافة تفسيرية.
- source_word: ἡ ἄλλη Μαρία
  choice: مريم الأخرى
  rationale: تنقل ἄλλη بوضوح وتحافظ على التمييز السردي بين المرأتين.
- source_word: θεωρῆσαι
  choice: لتنظرا
  rationale: يفيد θεωρέω النظر المقصود أو المتأمل؛ و«تنظرا» واضحة ولا تبالغ فتحوله إلى تفتيش رسمي. جاءت بالتثنية لموافقة الفاعلين.
- source_word: τὸν τάφον
  choice: القبر
  rationale: «القبر» هو المقابل العربي الحديث الواضح لموضع الدفن المقصود هنا.
theological_decisions:
- issue: التعبير الزمني في افتتاح رواية القيامة
  choice: بعد السبت، عند طلوع فجر اليوم الأول من الأسبوع
  alternative: في أواخر السبت، إذ كان اليوم الأول من الأسبوع يطلع
  rationale: يحتمل التعبير اليوناني ὀψὲ σαββάτων الوجهين. اختير معنى الزمن اللاحق للسبت لملاءمته مجموع العلامات الزمنية في الآية، مع إبقاء الاحتمال الآخر صريحًا في الحاشية وعدم حسم الغموض النصي بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «إذ كان فجر... يطلع» لتجنب تركيب حرفي ثقيل، مع الحفاظ على صورة انبلاج النهار. وُضعت علامة الحاشية [a] مباشرة بعد العبارة المختلف في معناها.
