base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: ar
  text: 'فأجاب الملاك وقال للمرأتين: «لا تخافا أنتما[a]، لأني أعلم أنكما تطلبان يسوع المصلوب[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ذُكر ضمير «أنتما» صراحةً في اليونانية للتوكيد؛ فالتطمين موجَّه إلى المرأتين على نحو خاص.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «يسوع الذي صُلب» أو «يسوع الذي قد صُلب». والعبارة اليونانية تصفه حرفيًا بأنه «المصلوب».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν
  choice: فأجاب الملاك وقال
  rationale: يحفظ صيغة السرد اليونانية «أجاب وقال»، مع نقل δέ بالفاء التي تلائم الانتقال والتعقيب في العربية.
- source_word: ταῖς γυναιξίν
  choice: للمرأتين
  rationale: السياق السابق يحدد امرأتين، وصيغة المثنى العربية تنقل المرجع بوضوح وطبيعية.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: لا تخافا أنتما
  rationale: «لا تخافا» نهي طبيعي موجّه إلى امرأتين، وإثبات «أنتما» يحفظ توكيد الضمير اليوناني الصريح من غير تفسير جهة المقابلة.
- source_word: οἶδα γὰρ ὅτι
  choice: لأني أعلم أنكما
  rationale: اللام تنقل تعليل γάρ، و«أعلم أنكما» تؤدي تركيب العلم ومضمونه بوضوح.
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: يسوع المصلوب
  rationale: الصفة «المصلوب» تنقل اسم المفعول اليوناني التام بإيجاز، وتُبقي أثر الصلب القائم في وصف يسوع.
- source_word: ζητεῖτε
  choice: تطلبان
  rationale: تؤدي معنى البحث عن شخص في عربية كتابية واضحة، مع مطابقة المخاطبتين في العدد.
theological_decisions:
- issue: توكيد الضمير ὑμεῖς في كلام الملاك
  choice: 'إبقاء التوكيد صراحةً: «لا تخافا أنتما»'
  alternative: «لا تخافا»
  rationale: الضمير اليوناني مذكور مع أن الفعل يدل على المخاطبتين، ولذلك يحمل توكيدًا حقيقيًا. تُحفظ هذه النبرة من غير الجزم بمن تقابَلان.
- issue: وصف يسوع بـ τὸν ἐσταυρωμένον
  choice: «يسوع المصلوب»
  alternative: «يسوع الذي صُلب» أو «يسوع الذي قد صُلب»
  rationale: يحافظ الوصف الاسمي على قوة اسم المفعول التام وعلى الصلة المستمرة بالفعل المكتمل، من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية مهيبة. استُعمل المثنى لأن المخاطبتين هما المرأتان المذكورتان في السياق، وحُفظت صيغة «أجاب... وقال» والتوكيد الضميري والوصف الاسمي من الأصل اليوناني.
