  text: 'قائلين: «قولوا: إن تلاميذه جاءوا ليلًا[a] وسرقوه[b] بينما كنا نائمين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الليل». جاءت νυκτός في اليونانية مضافًا إليه مستعملًا استعمال الظرف، للدلالة على زمن مجيئهم.'
    reason: lexical_alternative
  - marker: b
    text: 'الضمير في اليونانية: «إياه»، لا «جسده».'
