lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي يقدّم مضمون التعليمات، وتحافظ صيغة «قائلين» على صلته النحوية بالسياق السابق.
- source_word: Εἴπατε
  choice: قولوا
  rationale: فعل أمر ماضٍ، للجمع المخاطب؛ و«قولوا» تنقل قوة الأمر مباشرة من غير زيادة تفسيرية.
- source_word: ὅτι
  choice: علامتا الاقتباس بعد «قولوا»
  rationale: تقدّم الأداة مضمون القول، ويؤدي الاقتباس المباشر وظيفتها بوضوح وطبيعية في العربية.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: ترجمة عربية موجزة وطبيعية لتركيب الملكية، والضمير يعود إلى يسوع بحسب السياق.
- source_word: νυκτὸς
  choice: ليلًا
  rationale: مضاف إليه مستعمل استعمال الظرف للدلالة على زمن المجيء؛ و«ليلًا» تنقل المعنى الزمني بإيجاز.
- source_word: ἐλθόντες
  choice: جاء
  rationale: اسم فاعل ماضٍ يدل على فعل سابق للفعل الرئيس؛ صيغ في العربية فعلًا منسقًا طبيعيًا مع «سرقوه».
- source_word: ἔκλεψαν
  choice: سرقوه
  rationale: ينقل فعل السرقة بصيغته الماضية المباشرة، مع إلحاق ضمير المفعول به الوارد بعده في اليونانية.
- source_word: αὐτὸν
  choice: ـه في «سرقوه»
  rationale: يحافظ على الضمير الشخصي العائد إلى يسوع، من غير توسيعه تفسيريًا إلى «جسده».
- source_word: ἡμῶν κοιμωμένων
  choice: بينما كنا نائمين
  rationale: ترجمة واضحة للتركيب المطلق بالمضاف إليه، وتحفظ دلالته الظرفية المتزامنة.
theological_decisions:
- issue: مرجع الضمير αὐτόν في الرواية الملفقة
  choice: الإبقاء على الضمير الشخصي في «سرقوه»
  alternative: «سرقوا جسده»
  rationale: النص اليوناني يقول «إياه/هو» بضمير شخصي، ولا يذكر «جسده». والسياق يوضح المرجع، فلا حاجة إلى إضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت بنية القول المباشر، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تفسرهما كل حاشية، لا عند موضعيهما غير المتطابقين في طبقة الاستشارة الإنجليزية.
