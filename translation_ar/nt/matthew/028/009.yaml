  to: 'وإذا بيسوع يلتقيهنّ قائلًا: «سلامٌ عليكنّ!» فتقدّمن وأمسكن بقدميه وسجدن له.[a]'
  rationale: صححتُ السبك العربي في افتتاحية الآية، واستبدلتُ التحية بصيغتها العربية الاصطلاحية، ونقحتُ الحاشية لتعرض المجال الدلالي للفعل اليوناني بدقة ومن غير فرض قراءة عقائدية. ولم أضف حاشية مستقلة لـ«سلامٌ عليكنّ» لأن النص الرئيس يعامل Χαίρετε بوصفها تحية سياقية، وهو نقل كافٍ هنا.
