base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: ar
  text: 'وإذا بيسوع يلتقيهنّ قائلًا: «سلامٌ عليكنّ!» فتقدّمن وأمسكن بقدميه وسجدن له.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُترجم «سجدن له» أيضًا: «عبدنَه» أو «أظهرن له الإجلال». فالفعل اليوناني قد يدل على السجود أو التبجيل، وقد يحمل معنى العبادة؛ وسياق القيامة يرجّح الدلالة الأقوى.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: تؤدي وظيفة لفت الانتباه وإبراز المفاجأة في السرد، بصياغة عربية طبيعية أيسر من «وها هوذا».
- source_word: ὑπήντησεν
  choice: لاقاهنّ
  rationale: ينقل معنى أن يسوع التقى النساء في طريقهن، من غير إضافة اتجاه غير مصرّح به.
- source_word: Χαίρετε
  choice: سلامٌ لكنّ!
  rationale: الفعل اليوناني أمر جمع مشتق من الفرح، لكنه مستعمل هنا بوصفه تحية؛ و«سلام لكنّ» تحية عربية واضحة تحفظ الوظيفة السياقية.
- source_word: προσελθοῦσαι
  choice: فتقدّمن
  rationale: يحفظ حركة النساء نحو يسوع وتسلسل الأفعال بإيجاز طبيعي.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: وأمسكن بقدميه
  rationale: ينقل التلامس الجسدي والإمساك الفعلي من دون الإيحاء بالعنف الذي قد تحمله ألفاظ مثل «قبضن».
- source_word: προσεκύνησαν αὐτῷ
  choice: وسجدن له
  rationale: «سجدن له» يحفظ الصورة الجسدية والدلالة الدينية الممكنة معًا، ولا يحسم وحده هل المراد هيئة السجود أم العبادة صراحة.
theological_decisions:
- issue: دلالة προσκυνέω الموجّهة إلى يسوع القائم
  choice: وسجدن له
  alternative: وعبدنه / وقدّمن له الإجلال
  rationale: الفعل قد يدل على السجود أو تقديم الإجلال، وقد يحمل معنى العبادة بحسب السياق. تحافظ «سجدن له» على قوة المشهد وعلى التوتر الدلالي، بينما توضّح الحاشية احتمال معنى العبادة في سياق القيامة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «وإذا» لإبراز المفاجأة السردية، وحوفظ على ضمائر جمع المؤنث الظاهرة في اليونانية والسياق.
