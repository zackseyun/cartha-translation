review_pass:
  verdict: revise
  source_fidelity: ينقل النص تسلسل الأفعال ومعنى الإمساك بقدمي يسوع والسجود له بدقة جيدة. لكن افتتاحية «وإذا يسوع قد لاقاهنّ» غير سليمة السبك في العربية الفصحى المعاصرة؛ وصيغة «وإذا بيسوع يلتقيهنّ» تؤدي وظيفة ἰδού مع فعل اللقاء بوضوح وطبيعية. كما أن «سلامٌ عليكنّ» هي التحية العربية المستقرة والأفصح من «سلامٌ لكنّ».
  naturalness: الصياغة المنقحة فصحى معاصرة واضحة، وتحافظ على ضمائر جمع المؤنث وعلى إيقاع السرد. تركيب «وإذا بيسوع يلتقيهنّ» طبيعي في السرد العربي ويؤدي عنصر المفاجأة والتنبيه.
  terminology: أُبقيت «سجدن له» لأنها تنقل الفعل προσκυνέω من غير حسمٍ زائد بين السجود/التبجيل والعبادة. وتوضح الحاشية البدائل الدلالية دون جعل أحدها تفسيرًا مفروضًا. أما «سلامٌ عليكنّ» فتنقل وظيفة Χαίρετε بوصفها تحية، مع التنبيه إلى بديل «افرحن».
