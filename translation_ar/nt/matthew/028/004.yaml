  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: ar
  text: ومن خوفهم منه ارتجف الحراس، وصاروا كالأموات[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبسبب خوفهم منه ارتعد الحراس».'
    reason: بديل معجمي يصرّح بالدلالة السببية لـἀπό ويقدّم «ارتعد» بديلًا لـ«ارتجف».
lexical_decisions:
- source_word: ἀπὸ
  choice: من
  rationale: تفيد ἀπό مع المضاف إليه هنا منشأ رد الفعل أو سببه؛ وتحافظ «من» على صورة التعبير اليوناني مع وضوح الدلالة السببية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة، والواو أنسب في العربية من إدخال مقابلة قوية لا يقتضيها السياق.
- source_word: φόβου
  choice: خوفهم
  rationale: ينقل معنى φόβος المباشر، وإضافة ضمير الجمع تجعل التركيب العربي طبيعيًا وتبيّن أن الخوف هو خوف الحراس.
- source_word: αὐτοῦ
  choice: منه
  rationale: يعود الضمير، بحسب أقرب مرجع في السياق، إلى الملاك المذكور في الآية السابقة، ويؤدي «منه» معنى متعلَّق الخوف بوضوح.
- source_word: ἐσείσθησαν
  choice: ارتجف
  rationale: الفعل المبني للمجهول من σείω يُستعمل هنا للدلالة على الارتعاش من الخوف؛ و«ارتجف» تعبير عربي واضح وحيوي.
- source_word: οἱ τηροῦντες
  choice: الحراس
  rationale: المعنى الحرفي «القائمون بالحراسة»، والمقصود في السياق حراس القبر؛ لذا فـ«الحراس» موجز وطبيعي.
- source_word: ἐγενήθησαν
  choice: صاروا
  rationale: يفيد γίνομαι الانتقال إلى حالة، و«صاروا» يحفظ هذا المعنى أفضل من مجرد «كانوا».
- source_word: ὡς
  choice: كـ
  rationale: تفيد المقارنة لا التطابق؛ فهم بدوا أو غدوا مثل الأموات، لا أنهم ماتوا فعلًا.
- source_word: νεκροί
  choice: الأموات
  rationale: صياغة عربية طبيعية بعد أداة التشبيه، وتدل على أشخاص موتى دون تحويل الصورة إلى «جثث»، وهو تفسير أشد تحديدًا من الأصل.
theological_decisions:
- issue: مرجع الضمير في αὐτοῦ
  choice: الضمير يعود إلى الملاك المذكور في الآية السابقة.
  alternative: قد يُفهم على أنه إحالة أوسع إلى الحدث السماوي كله.
  rationale: أقرب مرجع نحوي وسياقي هو الملاك الذي وُصف منظره في الآية السابقة؛ وهذا ترجيح سياقي لا يتضمن حسمًا عقائديًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية وقورة. حافظت الصياغة على علاقة الخوف بالملاك، وعلى صورة التحول إلى حالة تشبه الموت من غير الإيحاء بأن الحراس ماتوا فعلًا.
