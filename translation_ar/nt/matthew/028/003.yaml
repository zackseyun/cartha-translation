base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: ar
  text: وكان منظره[a] كالبرق، ولباسه أبيض كالثلج.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هيئته» أو «مظهره» بدلًا من «منظره».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، وحرف الواو هو المقابل العربي الطبيعي هنا من غير إفادة تضاد قوي.
- source_word: εἰδέα
  choice: منظره
  rationale: تشير الكلمة إلى الهيئة المرئية أو المظهر الخارجي؛ و«منظره» تعبير عربي واضح وطبيعي يحافظ على هذا المعنى.
- source_word: ὡς ἀστραπή
  choice: كالبرق
  rationale: تحافظ الكاف على التشبيه، و«البرق» هو المقابل المباشر للكلمة اليونانية.
- source_word: ἔνδυμα
  choice: لباسه
  rationale: لفظ عام لما يُلبس، فلا يحدد رداءً أو نوعًا بعينه لم يذكره النص.
- source_word: λευκόν
  choice: أبيض
  rationale: ينقل معنى البياض مباشرة من غير إضافة شدة غير مصرح بها.
- source_word: ὡς χιών
  choice: كالثلج
  rationale: يحافظ على التشبيه الثاني الذي يصف بياض اللباس ببياض الثلج.
theological_decisions:
- issue: مرجع الضمير في αὐτοῦ
  choice: الإبقاء على الضمير «ـه» الذي يعود بحسب السياق المباشر إلى ملاك الرب المذكور في العدد السابق.
  alternative: التصريح بلفظ «الملاك» لتجنب احتمال فهم الضمير على أنه يعود إلى يسوع.
  rationale: النص اليوناني يستعمل الضمير، وأقرب مرجع له هو ملاك الرب في متى 28:2؛ لذلك يحافظ النص العربي على الضمير ولا يضيف اسمًا غير وارد في هذا العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت صياغة موجزة تحفظ تشبيهي النص وتتابع السرد، مع تجنب تخصيص نوع اللباس أو التصريح بمرجع الضمير داخل المتن.
