lexical_decisions:
- source_word: ἰδόντες
  choice: ولمّا رأوه
  rationale: نُقلت صيغة اسم الفاعل الماضي زمنيًّا بصياغة عربية طبيعية، مع الحفاظ على ارتباط الرؤية بالفعلين الرئيسيين.
- source_word: προσεκύνησαν
  choice: سجدوا له
  rationale: الفعل προσκυνέω يدل على السجود أو إظهار الإجلال أو العبادة. و«سجدوا له» يحفظ الفعل الجسدي ودلالته التعبدية في سياق ظهور يسوع بعد القيامة من غير أن يحصر المعنى في لفظ تفسيري واحد.
- source_word: οἱ δὲ
  choice: لكنّ بعضهم
  rationale: التركيب تقابلي وحذفه الاسمي يشير على الأرجح إلى بعض أفراد الجماعة المذكورة؛ والتصريح بـ«بعضهم» هو الأسلوب العربي الأوضح.
- source_word: ἐδίστασαν
  choice: شكّوا
  rationale: يمكن أن يعني الفعل الشك أو التردد والتذبذب. اختير «شكّوا» في المتن لكونه مباشرًا ومألوفًا، مع بيان طيف الدلالة في الحاشية.
theological_decisions:
- issue: دلالة προσκυνέω الموجَّه إلى يسوع القائم
  choice: سجدوا له
  alternative: عبدوه؛ انحنوا له إجلالًا
  rationale: يحفظ «سجدوا له» المعنى المعجمي للفعل وثقله التعبدي في سياق القيامة، من دون أن يفصل بين الحركة الجسدية ودلالتها الدينية أو يفرض توصيفًا عقديًا أضيق من اللفظ اليوناني.
- issue: دلالة διστάζω
  choice: شكّوا في المتن
  alternative: تردّدوا؛ تذبذبوا
  rationale: قد يدل اللفظ على تردد أو عدم يقين، لا على إنكار راسخ؛ لذلك أُبقي «شكّوا» في المتن وحُفظ الاحتمال الآخر في الحاشية.
