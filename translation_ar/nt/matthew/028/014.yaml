id: MAT.28.14
reference: Matthew 28:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: ar
  text: وإن بلغ هذا مسامع الوالي[a]، فنحن نقنعه ونجعلكم في مأمن من العواقب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإن وصل هذا إلى علم الوالي».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ونجعلكم بلا همّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ ... ἐπὶ τοῦ ἡγεμόνος
  choice: بلغ هذا مسامع الوالي
  rationale: تعبير عربي طبيعي يحفظ معنى المبني للمجهول اصطلاحيًا، أي وصول الخبر إلى علم الوالي، من غير جعله فاعلًا مباشرًا لفعل السماع.
- source_word: ἡγεμόνος
  choice: الوالي
  rationale: يشير اللفظ في هذا السياق الروماني إلى الحاكم الإقليمي، أي بيلاطس؛ و«الوالي» ترجمة عربية واضحة ودقيقة سياقيًا.
- source_word: πείσομεν αὐτόν
  choice: نقنعه
  rationale: ينقل المعنى المباشر للفعل πείθω من غير أن يحدد الوسيلة أو يفترض رشوة أو خداعًا لا يصرح به النص.
- source_word: ἀμερίμνους ποιήσομεν
  choice: نجعلكم في مأمن من العواقب
  rationale: الصيغة اليونانية حرفيًا «نجعلكم بلا همّ»، لكن السياق يدل على إزالة قلق الحراس من التبعات التأديبية؛ فهذه الصياغة طبيعية وتحفظ المعنى السياقي مع إيراد الحرفي في الحاشية.
theological_decisions: []
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. استُعمل «بلغ مسامع» بوصفه تعبيرًا عربيًا مألوفًا لوصول الخبر، و«في مأمن من العواقب» لإظهار المقصود السياقي من إزالة القلق من غير إضافة تحديد للعقوبة.
