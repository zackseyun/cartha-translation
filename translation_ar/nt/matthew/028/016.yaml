  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: ar
  text: وأمّا التلاميذ الأحد عشر فذهبوا إلى الجليل، إلى الجبل الذي سبق أن عيَّنه[a] لهم يسوع،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حدَّده لهم» أو «أمرهم به». يمكن أن يدل الفعل اليوناني على التعيين أو الترتيب أو الأمر.'
    reason: بديل معجمي يحفظ مدى دلالة ἐτάξατο في هذا السياق.
lexical_decisions:
- source_word: δὲ
  choice: وأمّا
  rationale: أداة انتقال خفيفة تستأنف السرد وتحوّل بؤرته إلى التلاميذ الأحد عشر، من غير أن تفرض تضادًا قويًّا.
- source_word: ἕνδεκα μαθηταὶ
  choice: التلاميذ الأحد عشر
  rationale: يحفظ العدد المحدد والمصطلح الإنجيلي المألوف μαθηταί بمعنى تلاميذ يسوع.
- source_word: ἐπορεύθησαν
  choice: فذهبوا
  rationale: صياغة عربية طبيعية ودقيقة للفعل الدال على الذهاب أو الارتحال، من غير رفع غير لازم لمستوى الأسلوب.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: تعبير عربي مألوف عن الحركة نحو الإقليم.
- source_word: εἰς τὸ ὄρος
  choice: إلى الجبل
  rationale: يحفظ معنى ὄρος وإشارة أداة التعريف إلى جبل بعينه.
- source_word: οὗ
  choice: الذي
  rationale: أعيدت الصلة في العربية إلى «الجبل» مباشرة، وهو أسلس من ترجمة ظرف المكان ترجمة حرفية.
- source_word: ἐτάξατο
  choice: عيَّنه لهم
  rationale: يفيد أن يسوع كان قد حدّد لهم هذا الجبل موضعًا للقاء، مع إبقاء احتمال دلالة الفعل على الأمر أو التوجيه في الحاشية.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحفظ المفعول غير المباشر بصياغة عربية طبيعية.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية القياسية للاسم في سياق العهد الجديد.
theological_decisions:
- issue: طبيعة تحديد يسوع لموضع اللقاء
  choice: «عيَّنه لهم» بوصفه تحديدًا سابقًا للمكان
  alternative: «أمرهم يسوع أن يذهبوا إليه»
  rationale: لا يقتضي السياق منصبًا كنسيًّا أو تعيينًا لأشخاص، بل تحديد موضع اللقاء. وتحفظ الحاشية احتمال ما في الفعل من معنى الأمر أو التوجيه من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «وأمّا» للانتقال السردي الخفيف، ووُضعت علامة الحاشية بعد العبارة التي تتعلق بها. أُبقيت الفاصلة الختامية لأن الجملة تستمر في الآية التالية.
