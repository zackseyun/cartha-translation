base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: ar
  text: لَيْسَ هُوَ هُنَا، فَإِنَّهُ أُقِيمَ[a] كَمَا قَالَ. تَعَالَيْنَ، انْظُرْنَ الْمَوْضِعَ الَّذِي كَانَ رَاقِدًا فِيهِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قام». الفعل اليوناني مبنيّ للمجهول في الصيغة («أُقيم»)، مع أن الترجمات العربية التقليدية تترجمه غالبًا بصيغة المعلوم.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «الموضع الذي رقد فيه» أو «الموضع الذي كان قد وُضع فيه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: ليس هو هنا
  rationale: ينقل العبارة المكانية اليونانية بوضوح، مع إظهار الضمير الذي يدل عليه السياق.
- source_word: ἠγέρθη
  choice: فقد أُقيم
  rationale: يحافظ على صيغة المبني للمجهول في اليونانية، وتفيد «قد» تمام الحدث ونتيجته القائمة.
- source_word: γὰρ
  choice: فـ
  rationale: تربط سبب عدم وجوده في القبر بما يلي ربطًا عربيًا طبيعيًا موجزًا.
- source_word: καθὼς εἶπεν
  choice: كما قال
  rationale: يحفظ معنى المطابقة بين الحدث وقوله السابق من غير زيادة تفسيرية.
- source_word: δεῦτε ἴδετε
  choice: تعالين وانظرن
  rationale: السياق يوجّه الخطاب إلى النساء، فاستُعمل جمع المؤنث في فعلي الأمر مع الحفاظ على الدعوة إلى الحضور والمعاينة.
- source_word: τὸν τόπον
  choice: الموضع
  rationale: لفظ واضح ودقيق للمكان المحدد داخل القبر.
- source_word: ὅπου ἔκειτο
  choice: الذي كان مضطجعًا فيه
  rationale: يحافظ على المعنى الحاليّ/الوضعي للفعل وعلى دلالة الماضي المستمر، من غير تحويله إلى حدث صريح بمعنى «وُضع».
theological_decisions:
- issue: صيغة الفعل والفاعلية في خبر القيامة
  choice: فقد أُقيم
  alternative: فقد قام
  rationale: الفعل اليوناني مبني للمجهول، لذا يحفظ النص العربي هذه الصيغة ولا يحوّلها بصمت إلى صيغة المعلوم، من غير أن ينفي ما تذكره نصوص أخرى عن فاعلية المسيح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. ضُبط خطاب الأمر بصيغة جمع المؤنث وفق سياق النساء المخاطَبات، واستُعمل «أُقيم» للمحافظة على المبني للمجهول في الأصل.
