  timestamp: '2026-07-16T07:38:33Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، وصيغة «أُقيم» تنقل المبني للمجهول في ἠγέρθη. لكن مسند الحاشية الحالي موضوع في نهاية الآية ويرتبط ببديل لعبارة الموضع، فيما لا توجد حاشية لبديل «قام» المقابل للحاشية الإنجليزية الخاصة بفعل القيامة.
  naturalness: «تعالين وانظرن» فصيحة ومناسبة لأن المخاطَبات نساء. و«الموضع الذي كان مضطجعًا فيه» مفهوم، لكنه أثقل وأقل سلاسة في العربية المعاصرة من «الموضع الذي كان راقدًا فيه».
  terminology: «أُقيم» يحافظ على المبني للمجهول دون فرض تفسير لفاعله. و«الموضع» مناسب لـ τόπον. يُستحسن توزيع الحواشي على مواضعها الدلالية الصحيحة.
