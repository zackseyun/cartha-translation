    rationale: الحاشية الوحيدة [a] موضوعة بعد «فيه» لكنها تعرض بدائل لـ ὅπου ἔκειτο، في حين أن بديل فعل القيامة («قام») غير موثّق بحاشية. يلزم تثبيت حاشية عند «أُقيم» وأخرى عند العبارة المكانية.
  - severity: low
    issue: «كان مضطجعًا» أقل طبيعية في هذا السياق.
    rationale: الفعل اليوناني κεῖμαι يدل على كون الجسد راقدًا/ممددًا في الموضع؛ و«كان راقدًا» أكثر سلاسة في الفصحى المعاصرة مع حفظ المعنى الوضعي.
