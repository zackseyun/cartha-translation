revisions:
- from: لَيْسَ هُوَ هُنَا، فَقَدْ أُقِيمَ كَمَا قَالَ. تَعَالَيْنَ وَانْظُرْنَ الْمَوْضِعَ الَّذِي كَانَ مُضْطَجِعًا فِيهِ.[a]
  to: لَيْسَ هُوَ هُنَا، فَإِنَّهُ أُقِيمَ[a] كَمَا قَالَ. تَعَالَيْنَ، انْظُرْنَ الْمَوْضِعَ الَّذِي كَانَ رَاقِدًا فِيهِ.[b]
  rationale: نُقلت الحاشية الخاصة بفعل القيامة إلى «أُقيم» وأضيفت الحاشية المعجمية الخاصة بعبارة الموضع في موضعها. كما استُبدلت «مضطجعًا» بـ«راقدًا» لتحسين السلاسة مع الإبقاء على الدلالة الوضعية لفعل κεῖμαι، وحُفظت صيغة جمع المؤنث في الأمر بحسب السياق.
