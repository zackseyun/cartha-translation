  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: ar
  text: فاجتمعوا مع الشيوخ، وبعد أن تشاوروا، أعطوا الجنود مبلغًا كبيرًا من الفضة،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναχθέντες
  choice: فاجتمعوا
  rationale: اسم فاعل ماضٍ بصيغة المبني للمجهول لكنه مستعمل هنا بمعنى الاجتماع؛ وصيغة الفعل العربية طبيعية وتحافظ على تتابع الأحداث.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: مع الشيوخ
  rationale: تفيد μετά مع المضاف إليه المصاحبة، و«الشيوخ» المقابل المألوف للفظ في سياق القيادة اليهودية.
- source_word: συμβούλιόν τε λαβόντες
  choice: وبعد أن تشاوروا
  rationale: العبارة الاصطلاحية تدل على التداول والتشاور لاتخاذ قرار، لا مجرد تلقي النصيحة.
- source_word: ἀργύρια ἱκανὰ
  choice: مبلغًا كبيرًا من الفضة
  rationale: تشير ἀργύρια إلى المال الفضي، وتصف ἱκανὰ كميته بأنها وافرة أو كبيرة؛ وهذه الصياغة واضحة وتحفظ ذكر الفضة صراحة.
- source_word: ἔδωκαν
  choice: أعطوا
  rationale: ترجمة مباشرة وطبيعية للفعل الماضي ἔδωκαν.
- source_word: τοῖς στρατιώταις
  choice: الجنود
  rationale: المعنى المعجمي هو «الجنود»، وإن كانوا يؤدون وظيفة الحراسة في السياق.
theological_decisions:
- issue: تحديد الفاعل المضمر
  choice: الفاعل المستتر في «اجتمعوا/تشاوروا/أعطوا» يعود إلى رؤساء الكهنة المذكورين في الآية السابقة
  alternative: جماعة غير محددة
  rationale: الصيغ اليونانية جمع مذكر، ويُفهم فاعلها من متصل السياق في متى 28:11؛ لذلك لم يُضف الاسم صراحة إلى نص الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ ترتيب الأحداث بصياغة طبيعية، وحُفظت الإشارة المادية إلى الفضة من غير تحويلها إلى «نقود» فقط.
