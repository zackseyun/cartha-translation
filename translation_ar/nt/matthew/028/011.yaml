    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: وفيما هما ذاهبتان
  rationale: تركيب المضاف إليه المطلق يهيئ الإطار الزمني للحدث التالي، والضمير يعود في السياق إلى المرأتين؛ لذا استُعمل المثنى المؤنث من غير تحديد وجهتهما.
- source_word: ἰδού
  choice: إذا بـ
  rationale: ينقل أداة التنبيه السردية الدالة على تطور مفاجئ أو جدير بالملاحظة، بصياغة عربية طبيعية.
- source_word: τινες τῆς κουστωδίας
  choice: بعض الحرس
  rationale: تشير κουστωδία إلى جماعة الحراسة الموضوعة عند القبر، و«بعض الحرس» واضحة وموجزة.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: قد دخلوا المدينة
  rationale: اسم الفاعل الماضي يسبق الفعل الرئيس، ونُقل إلى العربية بوصفه فعلاً تم قبل الإخبار؛ و«دخلوا المدينة» طبيعي في هذا السياق.
- source_word: ἀπήγγειλαν
  choice: أخبروا
  rationale: يفيد الفعل نقل خبر أو تقرير إلى أصحاب سلطة، و«أخبروا» فصيحة وطبيعية من غير زيادة في الطابع الرسمي.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للجمع ἀρχιερεῖς في سياق القيادة الدينية اليهودية.
- source_word: ἅπαντα τὰ γενόμενα
  choice: بكل ما حدث
  rationale: يحفظ شمول ἅπαντα ويعبّر بصورة عربية طبيعية عن جميع الوقائع التي جرت.
