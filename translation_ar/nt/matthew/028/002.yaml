  naturalness: النص المعدل فصيح وواضح، ويحافظ على إبراز الحدث المفاجئ في «وإذا»، وعلى تعاقب نزول الملاك واقترابه ودحرجته الحجر، ثم حالة جلوسه عليه.
  terminology: استُعمل «ملاك الرب» بوصفه التعبير العربي المألوف والطبيعي لعبارة «ملاك الرب/ملاكٍ للرب». وأُبقي «الرب» دون إدخال اسم إلهي غير وارد في المصدر.
