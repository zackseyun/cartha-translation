base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: ar
  text: وإذا وقع زلزال عظيم، لأن ملاك الرب نزل من السماء وتقدَّم، فدحرج الحجر، وكان جالسًا عليه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: صياغة عربية فصيحة وطبيعية تؤدي وظيفة لفت الانتباه وإبراز الحدث المفاجئ، من غير إثقال العبارة بترجمة حرفية.
- source_word: σεισμὸς ... μέγας
  choice: زلزال عظيم
  rationale: مقابل مباشر يحفظ قوة الوصف في الأصل.
- source_word: ἄγγελος ... κυρίου
  choice: ملاكًا للرب
  rationale: يحفظ تركيب الإضافة غير المعرَّف في اليونانية من غير إدخال اسم إلهي غير موجود نصًّا.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: نزل من السماء
  rationale: ينقل اسم الفاعل اليوناني بفعل عربي طبيعي، مع إبقاء السماء مفردة كما في الأصل.
- source_word: προσελθὼν
  choice: تقدَّم
  rationale: يدل على الاقتراب إلى موضع الحجر، ويحفظ دلالة الحركة من غير تعيين مفعول لم يصرّح به النص.
- source_word: ἀπεκύλισε
  choice: دحرج
  rationale: يعكس حركة الحجر الدائرية المقصودة بالفعل اليوناني بدقة.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: جلس عليه
  rationale: صياغة عربية واضحة، والضمير يعود طبيعيًا إلى الحجر.
theological_decisions:
- issue: دلالة «ملاك للرب»
  choice: ملاكًا للرب
  alternative: ملاك الرب
  rationale: اختير التنكير لأن ἄγγελος بلا أداة تعريف، ولتجنب تحويل العبارة تلقائيًا إلى لقب تقني معرّف؛ وفي الوقت نفسه تحافظ الإضافة إلى «الرب» على نسبته إليه.
- issue: العلاقة الزمنية بين نزول الملاك والزلزال
  choice: لأن ملاكًا للرب نزل من السماء
  alternative: لأن ملاكًا للرب كان قد نزل من السماء
  rationale: الأصل يقدّم نزول الملاك بوصفه تفسيرًا لحدوث الزلزال، لكنه لا يفرض بوضوح صيغة الماضي الأسبق؛ لذلك تُرك التسلسل طبيعيًا من غير زيادة زمنية تفسيرية.
- issue: مرجع الضمير في «عليه»
  choice: أُبقي الضمير في المتن
  alternative: جلس على الحجر
  rationale: المرجع الأقرب نحويًا هو الحجر، لكن إبقاء الضمير يحافظ على بنية الأصل من غير تكرار تفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع ترتيب أفعال طبيعي يحافظ على تعاقب المشهد وسببية «لأن». لا توجد علامات حواشٍ لأن النص لا يحتاج إلى حاشية لازمة.
