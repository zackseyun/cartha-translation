  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: ar
  text: فأخذوا الفضة وفعلوا كما عُلِّموا. فشاع هذا الخبر بين اليهود إلى هذا اليوم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: أخذوا
  rationale: صيغة اسم الفاعل الماضي تفيد فعلًا سابقًا للفعل الرئيس؛ و«أخذوا» تلائم تسلسل السرد بعد إعطائهم المال في العدد السابق.
- source_word: τὰ ἀργύρια
  choice: الفضة
  rationale: تحافظ على الدلالة المادية المباشرة للفظ اليوناني، من غير تخصيصه بقطع نقدية، مع أن المقصود في السياق هو المال الفضي.
- source_word: ἐποίησαν
  choice: فعلوا
  rationale: 'مقابل عربي مباشر وطبيعي للفعل العام ποιέω، ويرتبط بسلاسة بما يليه: «كما لُقِّنوا».'
- source_word: ὡς ἐδιδάχθησαν
  choice: كما لُقِّنوا
  rationale: الفعل المبني للمجهول يعني أنهم عُلِّموا أو وُجِّهوا ماذا يقولون. و«لُقِّنوا» طبيعية في هذا السياق، إذ تشير إلى تلقينهم رواية محددة من غير إضافة مضمون غير موجود.
- source_word: διεφημίσθη
  choice: شاع
  rationale: ينقل معنى الانتشار الواسع للخبر، وهو أسلوب عربي موجز وطبيعي. وامتداد الشيوع إلى زمن الكاتب ظاهر من العبارة الختامية «إلى هذا اليوم».
- source_word: ὁ λόγος οὗτος
  choice: هذا الخبر
  rationale: λόγος واسع الدلالة، وفي السياق يشير إلى الرواية المتداولة التي قالها الحراس. «الخبر» واضح ومحايد، ويحفظ طبيعة القول المنقول دون أن يوحي بأن المترجم يحكم بصحته أو بطلانه.
- source_word: παρὰ Ἰουδαίοις
  choice: بين اليهود
  rationale: تعكس معنى παρά مع المجرور هنا، أي داخل الجماعة اليهودية أو في أوساطها، من غير توسيع دلالة العبارة إلى حكم عام خارج السياق السردي.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: إلى هذا اليوم
  rationale: تعبير عربي مألوف يقابل الاصطلاح اليوناني الدال على استمرار تداول الخبر حتى زمن كتابة النص.
theological_decisions:
- issue: دلالة Ἰουδαίοις في سياق قد يُفهم منه تعميم سلبي على اليهود
  choice: بين اليهود
  alternative: بين أهل اليهودية
  rationale: «بين اليهود» هو المقابل المباشر والمفهوم في هذا الموضع، حيث يتحدث النص عن تداول خبر داخل الجماعة اليهودية. ولا تضيف الصياغة حكمًا لاهوتيًا أو أخلاقيًا عامًا على اليهود خارج إطار الرواية.
- issue: اختيار مقابل λόγος في الإشارة إلى رواية الحراس
  choice: هذا الخبر
  alternative: هذه الرواية
  rationale: يحافظ «الخبر» على اتساع اللفظ وإمكان كونه قولًا أو تقريرًا متداولًا، من غير أن يحسم صدقه من جهة المترجم. أما «الرواية» فممكنة، لكنها قد تحمل لدى بعض القراء إيحاءً أدبيًا أو تشكيكيًا زائدًا.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموجزة، تحافظ على تسلسل السرد. استُخدم «لُقِّنوا» لإبراز أنهم تلقوا تعليمات محددة بشأن ما يقولونه، و«شاع» للتعبير الطبيعي عن انتشار الخبر. لا توجد حاشية لازمة لأن «هذا الخبر» يستوعب دلالة λόγος في السياق دون إخفاء توتر لاهوتي أو غموض جوهري.
