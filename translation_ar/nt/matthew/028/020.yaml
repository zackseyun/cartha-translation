review_pass:
  verdict: revise
  source_fidelity: تحتاج «أوصيتكم به» إلى تعديل، لأن ἐνετειλάμην يفيد الأمر أو التكليف بوضوح أقوى من الوصية في الاستعمال العربي المعاصر. وسائر عناصر الآية تنقل الأصل بأمانة، بما في ذلك الاستمرار في «معلّمين»، وشمول «كل ما»، وحضور «أنا معكم»، وامتداد «كل الأيام».
  naturalness: التركيب فصيح ومفهوم. إلا أن «نهاية الدهر» أوضح للقارئ المعاصر من «انقضاء الدهر» مع بقائه مناسبًا للنبرة المهيبة، ويُستحسن وضع علامة الحاشية ملاصقة للعبارة التي تشرحها.
  terminology: «أمرتكم به» يقابل قوة الفعل اليوناني بدقة. و«الدهر» صالح لـ αἰών إذا أوضحت الحاشية أنه العصر أو الحقبة، لا العالم المادي. ولا يلزم الجزم بتفصيل كوني يتجاوز دلالة اللفظ.
  issues:
  - severity: medium
    issue: «أوصيتكم به» أضعف من دلالة ἐνετειλάμην.
    rationale: الفعل يعني «أمرت/كلّفت»، بينما «أوصى» قد يفهم في العربية على أنه نصح أو عهد غير ملزم.
  - severity: low
    issue: موضع علامة الحاشية بعد النقطة لا يربطها مباشرة بالعبارة الزمنية.
    rationale: الأفضل وضعها عقب «نهاية الدهر» لتكون إحالتها واضحة.
  - severity: low
    issue: «انقضاء الدهر» أقل مباشرة في العربية الفصحى الحديثة من «نهاية الدهر».
    rationale: «نهاية الدهر» طبيعية ومفهومة، وتنقل συντέλεια في هذا السياق من غير ادعاء أن المقصود نهاية العالم المادي.
  revised_text: مُعَلِّمِينَ إِيَّاهُمْ أَنْ يَحْفَظُوا كُلَّ مَا أَمَرْتُكُمْ بِهِ. وَهَا أَنَا مَعَكُمْ كُلَّ الأَيَّامِ، إِلَى نِهَايَةِ الدَّهْرِ[a].
