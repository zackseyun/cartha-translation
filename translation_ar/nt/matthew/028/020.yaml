  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: ar
  text: مُعَلِّمِينَ إِيَّاهُمْ أَنْ يَحْفَظُوا كُلَّ مَا أَمَرْتُكُمْ بِهِ. وَهَا أَنَا مَعَكُمْ كُلَّ الأَيَّامِ، إِلَى نِهَايَةِ الدَّهْرِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى نهاية العصر». والترجمة التقليدية: «إلى نهاية العالم». تشير اليونانية إلى اكتمال الدهر أو العصر (αἰών)، لا إلى العالم المادي على وجه التحديد.'
    reason: توضيح دلالة العبارة الزمنية وإيراد البديل التقليدي دون الخلط بين αἰών والعالم المادي.
lexical_decisions:
- source_word: διδάσκοντες
  choice: مُعَلِّمِينَ
  rationale: اسم فاعل حالي يبيّن الكيفية المستمرة لصنع التلاميذ المذكور في العدد السابق، وصيغة «معلّمين» مباشرة وطبيعية.
- source_word: τηρεῖν
  choice: أَنْ يَحْفَظُوا
  rationale: يفيد مراعاة الوصايا والعمل بها، و«يحفظوا» يجمع معنى الالتزام والطاعة من غير حصره في امتثال خارجي.
- source_word: πάντα ὅσα
  choice: كُلَّ مَا
  rationale: تعبير عربي موجز وطبيعي يحفظ الشمول الذي في الأصل.
- source_word: ἐνετειλάμην
  choice: أَوْصَيْتُكُمْ بِهِ
  rationale: ينقل إعطاء الوصايا بسلطان. واختيار «أوصيت» أنسب في العربية الكتابية الواضحة من «أمرت»، مع بقاء قوة التكليف في السياق.
- source_word: ἰδοὺ
  choice: وَهَا
  rationale: أداة تنبيه وتوكيد تحفظ النبرة المهيبة من غير استعمال صياغة قديمة عسيرة.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: أَنَا مَعَكُمْ
  rationale: ترجمة مباشرة وواضحة لحضور يسوع مع المخاطَبين.
- source_word: πάσας τὰς ἡμέρας
  choice: كُلَّ الأَيَّامِ
  rationale: تحفظ الصورة الحرفية ومعنى الاستمرار يومًا بعد يوم، بدل اختزالها في «دائمًا».
- source_word: συντελείας
  choice: انْقِضَاءِ
  rationale: يدل على بلوغ الحقبة نهايتها واكتمالها؛ و«انقضاء» عربي طبيعي يحمل هذا المعنى من غير الإيحاء بفناء العالم المادي.
- source_word: αἰῶνος
  choice: الدَّهْرِ
  rationale: يدل هنا على العصر أو الحقبة، لا على الكون المادي. و«الدهر» تركيب عربي راسخ في عبارة «انقضاء الدهر»، مع توضيح المقصود في الحاشية.
theological_decisions:
- issue: العبارة الزمنية ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: إِلَى انْقِضَاءِ الدَّهْرِ
  alternative: 'إلى نهاية العصر؛ وتقليديًا: إلى نهاية العالم'
  rationale: تحفظ العبارة البعد الأخروي لبلوغ العصر تمامه، ولا تحسمها خطأً على أنها فناء العالم المادي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُعملت «وها أنا» و«كل الأيام» للمحافظة على توكيد الأصل وإيقاعه، ووُضعت علامة الحاشية بعد العبارة التي تشرحها.
