source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: ar
  text: 'واذهبن سريعًا وأخبرن تلاميذه: «لقد أُقيم من بين الأموات، وها هو يسبقكم إلى الجليل. هناك سترونه». ها قد أخبرتكنّ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ
  choice: سريعًا
  rationale: 'ينقل معنى السرعة بعبارة عربية طبيعية، مع تعلّقه بالفعلين: الذهاب والإخبار.'
- source_word: Ἠγέρθη
  choice: أُقيم
  rationale: صيغة المبني للمجهول تحفظ صيغة الأصل ولا تصرّح بالفاعل الذي تركه النص ضمنيًا.
- source_word: προάγει
  choice: يسبقكم
  rationale: في هذا السياق تعني أنه يمضي أمامهم إلى الجليل؛ و«يسبقكم» واضحة وطبيعية.
- source_word: ἰδού
  choice: ها هو / ها أنا
  rationale: تُترجم أداة لفت الانتباه بصيغتين عربيتين ملائمتين للسياق النحوي في موضعيها.
- source_word: ὄψεσθε
  choice: سترونه
  rationale: يحافظ على دلالة المستقبل والخطاب للجمع.
theological_decisions:
- issue: دلالة المبني للمجهول في Ἠγέρθη
  choice: أُقيم من بين الأموات
  alternative: قام من بين الأموات
  rationale: يحفظ المبني للمجهول الإلهي المحتمل والتوتر اللاهوتي في الأصل من غير تعيين صريح للفاعل.
- issue: عدد المخاطَبات في صيغ الأمر والضمائر
  choice: 'المثنى المؤنث: اذهبا، قولا، لكما؛ مع جمع «يسبقكم/سترونه»'
  alternative: الجمع المؤنث في جميع المواضع
  rationale: سياق متى يذكر امرأتين، فتظهر صيغة المثنى في خطاب الملاك لهما؛ أما ضمير الجمع في عبارتي اللقاء فيشمل المرأتين مع التلاميذ المقصودين بالوعد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «ها هو/ها أنا» بدل «هوذا» لتكون طبيعية للقارئ الحديث، مع الحفاظ على قوة لفت الانتباه في ἰδού.
