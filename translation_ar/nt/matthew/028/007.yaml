review_pass:
  verdict: revise
  source_fidelity: 'يلزم تصحيح صيغ المخاطبة: اليونانية تستعمل الجمع المؤنث في πορευθεῖσαι وεἴπατε، وفي ὑμῖν الختامية، لا المثنى. كما أن «ها أنا قد قلت لكما» تُدخل «أنا» على نحو غير موجود في الأصل؛ فـἰδού هنا أداة تنبيه تليها «أخبرتكنّ». أما «أُقيم من بين الأموات» فصياغة أمينة للمبني للمجهول في Ἠγέρθη.'
  naturalness: النص المصحح فصيح معاصر وسلس. «اذهبن سريعًا وأخبرن تلاميذه» أوضح من «اذهبا... وقولا»، و«ها قد أخبرتكنّ» تؤدي ختام العبارة طبيعيًا من غير زيادة ضمير المتكلم المنفصل.
  terminology: «أُقيم من بين الأموات» يحافظ على المبني للمجهول وعدم تعيين الفاعل. «الجليل» و«تلاميذه» مناسبان، و«يسبقكم إلى الجليل» مفهوم في السياق لمعنى التقدّم أمام المخاطَبين إلى هناك.
  issues:
  - severity: high
    issue: استعمال المثنى المؤنث بدل الجمع المؤنث في أوامر الخطاب وختامه
    rationale: النص اليوناني يقرأ πορευθεῖσαι وεἴπατε بصيغة الجمع المؤنث، ويختم بـὑμῖν (لكُنّ). لا يصرح العدد بالمثنى، حتى إن كان السرد المحيط يذكر امرأتين؛ لذا ينبغي ألا تحوّل الترجمة صيغة المصدر إلى المثنى.
  - severity: medium
    issue: «ها أنا قد قلت لكما» تضيف ضميرًا وإحالة عددية غير موجودين
    rationale: ἰδοὺ εἶπον ὑμῖν تعني حرفيًا «ها/انظرن، قد أخبرتكنّ». «ها أنا» في العربية تقدم ضمير المتكلم بوصفه محور التنبيه، وهو غير ممثل في اليونانية.
  revised_text: 'واذهبن سريعًا وأخبرن تلاميذه: «لقد أُقيم من بين الأموات، وها هو يسبقكم إلى الجليل. هناك سترونه». ها قد أخبرتكنّ.'
