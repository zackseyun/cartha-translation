  to: 'واذهبن سريعًا وأخبرن تلاميذه: «لقد أُقيم من بين الأموات، وها هو يسبقكم إلى الجليل. هناك سترونه». ها قد أخبرتكنّ.'
  rationale: تقتصر المراجعة على استعادة الجمع المؤنث الذي في النص اليوناني، وإزالة الزيادة في الخاتمة. وتُبقي المبني للمجهول في «أُقيم»، ودلالة المستقبل في «سترونه»، وأداة التنبيه في موضعي ἰδού.
