  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: ar
  text: 'فقال لهن يسوع: «لا تخفن. اذهبن وأخبرن إخوتي أن يذهبوا إلى الجليل، وهناك سيرونني».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يشير «إخوتي» هنا، بحسب السياق، إلى تلاميذ يسوع؛ واللفظ اليوناني مذكّر جمع.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει αὐταῖς ὁ Ἰησοῦς
  choice: فقال لهن يسوع
  rationale: تؤدي «فـ» وظيفة τότε في تعاقب السرد بصورة عربية طبيعية، ويُنقل المضارع التاريخي λέγει بالماضي. و«لهن» تحفظ صيغة ضمير جمع المؤنث.
- source_word: Μὴ φοβεῖσθε
  choice: لا تخفن
  rationale: نهي موجّه إلى جمع من النساء، وصيغة جمع المؤنث واضحة وموجزة وطبيعية في العربية الفصحى.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: اذهبن وأخبرن
  rationale: يحفظ الفعلان صيغة الأمر وحركة الذهاب ثم تبليغ الرسالة، مع مراعاة جمع المؤنث بحسب المخاطبات.
- source_word: τοῖς ἀδελφοῖς μου
  choice: إخوتي
  rationale: يحفظ اللفظ العائلي اليوناني بصيغته المذكرة ولا يستبدله بالتفسير السياقي «تلاميذي».
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: أن يذهبوا إلى الجليل
  rationale: تُفهم ἵνα مع صيغة الالتزام هنا على أنها مضمون الرسالة أو الأمر غير المباشر، وتؤديها العربية طبيعيًا بـ«أن يذهبوا».
- source_word: κἀκεῖ με ὄψονται
  choice: وهناك سيرونني
  rationale: ترجمة مباشرة تحفظ معنى الرؤية ولا تستبدله بالمعنى الأضيق «سيلتقون بي».
theological_decisions:
- issue: مرجع «إخوتي»
  choice: الإبقاء على «إخوتي» في المتن، مع بيان أن السياق يشير إلى تلاميذ يسوع
  alternative: 'ترجمتها تفسيرياً: «تلاميذي» أو توسيعها إلى جميع الأتباع'
  rationale: اللفظ اليوناني مذكر جمع ويحمل دلالة عائلية مقصودة، بينما يحدد السياق المرجع. إبقاء اللفظ مع حاشية يصون المعنى والصلة اللاهوتية دون حسم النص بتفسير بديل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت صيغ جمع المؤنث في خطاب النساء، وحُفظ التعبير العائلي «إخوتي» مع إيضاح مرجعه في الحاشية.
