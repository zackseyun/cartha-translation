  source_fidelity: 'النص يحفظ عناصر اليونانية كلها: اقتراب يسوع، كلامه إلى المخاطَبين، وتمهيد القول المباشر. وتعبير «قد أُعطيتُ» ينقل الفعل الماضي المبني للمجهول Ἐδόθη ومعنى تلقّي السلطان من دون تسمية الواهب، كما في الأصل. و«كل سلطان في السماء وعلى الأرض» يقابل πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς بدقة.'
  naturalness: 'الصياغة فصيحة معاصرة وسلسة: «فتقدَّم يسوع وتكلَّم إليهم قائلًا» طبيعية وتحافظ على تسلسل الأفعال في اليونانية. واستعمال «قد» مع المبني للمجهول مناسب لإبراز الفعل المكتمل ذي الأثر القائم، من غير ادعاء أنه لازم نحويًا للفعل اليوناني.'
