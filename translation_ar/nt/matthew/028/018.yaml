source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: ar
  text: 'فتقدَّم يسوع وتكلَّم إليهم قائلًا: «قد أُعطيتُ[a] كلَّ سلطان[b] في السماء وعلى الأرض».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى ترتيب اليونانية: «أُعطي لي». الفعل اليوناني ماضٍ مبني للمجهول، و«قد أُعطيتُ» تعبّر طبيعيًّا عن فعل تمّ وما زالت نتيجته قائمة.'
    reason: lexical_alternative
  - marker: b
    text: أو «سلطة». اللفظة اليونانية تدل على السلطان أو الحق في الحكم، لا على مجرد القوة أو المقدرة.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم
  rationale: ينقل حركة يسوع نحو التلاميذ قبل كلامه، وهو تعبير عربي طبيعي يحفظ الدلالة المكانية لصيغة اسم الفاعل الماضي.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: وتكلَّم إليهم قائلًا
  rationale: يحفظ فعل الكلام ثم اسم الفاعل الذي يقدّم القول المباشر، من غير دمج العنصرين في فعل واحد.
- source_word: Ἐδόθη μοι
  choice: قد أُعطيتُ
  rationale: يحفظ المبني للمجهول ومعنى التلقّي، وتفيد «قد» وقوع العطاء مع بقاء نتيجته حاضرة في المقام؛ أمّا الصياغة الحرفية «أُعطي لي» فأُثبتت في الحاشية.
- source_word: πᾶσα ἐξουσία
  choice: كلَّ سلطان
  rationale: «كل» تلائم الاسم المجرّد المفرد وتفيد الشمول، و«سلطان» يدل على حق الحكم والنفوذ المشروع، لا على القدرة المجرّدة فحسب.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: في السماء وعلى الأرض
  rationale: صياغة عربية واضحة وطبيعية تحفظ اختلاف حرفي الجر والتقابل بين المجال السماوي والأرضي.
theological_decisions:
- issue: طبيعة امتلاك يسوع السلطان الشامل
  choice: قد أُعطيتُ كلَّ سلطان
  alternative: 'لي كل سلطان؛ أو: أملك كل سلطان'
  rationale: أُبقي المبني للمجهول ومعنى منح السلطان كما في اليونانية، بدل تحويل العبارة إلى تقرير مجرّد عن الامتلاك الذاتي. ولا يحدّد النص هنا صراحةً فاعل العطاء، لذلك لم يُضف إلى الترجمة.
- issue: دلالة ἐξουσία
  choice: سلطان
  alternative: 'قوة؛ أو: سلطة'
  rationale: «سلطان» يحفظ معنى الحق في الحكم والنفوذ المشروع، بينما قد توحي «قوة» بالمقدرة وحدها. و«سلطة» بديل معجمي صحيح، لكنه أقل ملاءمة للنبرة الكتابية المهيبة في هذا السياق.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة مهيبة غير متكلّفة. استُعمل «فتقدَّم» للحركة نحو المخاطَبين، و«سلطان» للمحافظة على الدلالة القانونية والحُكمية للفظة اليونانية.
