  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: ar
  text: 'فخرَّ العبد أمامه ساجدًا، قائلًا: «تمهَّل عليَّ، وسأوفيك كلَّ شيء».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν οὖν
  choice: فسقط
  rationale: ينقل اسم الفاعل الأَوْرَسْتي بوصفه فعلًا سابقًا للسجود، ويؤدي οὖν هنا وظيفة الانتقال إلى نتيجة ما سبق؛ وتكفي الفاء العربية الطبيعية للجمع بين التعاقب والنتيجة.
- source_word: ὁ δοῦλος
  choice: العبد
  rationale: يحافظ «العبد» على دلالة التبعية والملكية في العالم الاجتماعي للمثل، وهي أقوى من دلالة «الخادم».
- source_word: προσεκύνει αὐτῷ
  choice: سجد له
  rationale: يدل الفعل في هذا السياق على الارتماء أو السجود إجلالًا أمام سيد بشري. وهذه الصياغة تحفظ هيئة الخضوع من غير أن تحسم الفعل بوصفه عبادة دينية.
- source_word: λέγων
  choice: قائلًا
  rationale: ينقل اسم الفاعل الذي يقدم الكلام المباشر بصياغة عربية واضحة وطبيعية.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: تمهَّل عليَّ
  rationale: الطلب هو إطالة الأناة وتأخير المطالبة أو العقوبة؛ و«تمهّل عليّ» واضحة وملائمة لسياق الدَّين.
- source_word: καὶ πάντα ἀποδώσω σοι
  choice: وسأوفيك كلَّ شيء
  rationale: يؤدي ἀποδίδωμι في سياق الدَّين معنى الوفاء أو السداد، وπάντα يفيد الشمول. وتحافظ العبارة على وعد العبد الكامل كما ورد، من غير التعليق على إمكان تنفيذه.
theological_decisions:
- issue: دلالة προσκυνέω تجاه سيد بشري
  choice: سجد له بوصفه فعل خضوع وإجلال
  alternative: عبده؛ أو انحنى أمامه
  rationale: المخاطَب داخل المثل سيد بشري، والسياق يصور تذلل المدين أمامه. لفظ «سجد» يحفظ قوة الحركة الجسدية واتساع الدلالة الممكن، بينما توضح الحاشية أن السياق لا يقتضي العبادة الدينية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «العبد» لإظهار الوضع الاجتماعي المقصود، وحُفظت صورة السقوط والسجود من غير تكرار ثقيل أو إضافة تفسير مذهبي.
