  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: ar
  text: ومَن يستقبل طفلًا واحدًا كهذا باسمي، يستقبلني[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يَقبل». فالفعل اليوناني قد يعني «يستقبل» أو «يرحّب بـ» أو «يَقبل».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «طفلًا واحدًا كهذا»؛ لا يتضمن النص اليوناني في هذه الآية صفة «صغير».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: مَن
  rationale: تفيد صيغة الموصول مع ἐάν شرطًا عامًا غير محدد؛ و«مَن» تؤدي هذا المعنى طبيعيًا وبإيجاز في العربية.
- source_word: δέξηται / δέχεται
  choice: يستقبل / يستقبل
  rationale: «يستقبل» تعبر طبيعيًا عن تلقي الشخص والترحيب به، وتحافظ على تكرار الفعل اليوناني في الشطرين، فتُبقي الصلة الصريحة بين استقبال الطفل واستقبال يسوع.
- source_word: ἓν παιδίον τοιοῦτο
  choice: طفلًا واحدًا كهذا
  rationale: تحافظ العبارة على معنى العدد ἓν وعلى الإشارة الوصفية τοιοῦτο، من غير إضافة صفة «صغير» غير الموجودة في هذه الآية.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: باسمي
  rationale: 'صياغة عربية طبيعية تحتفظ باتساع الدلالة: الاستقبال بالإشارة إلى اسم يسوع أو سلطانه أو الانتماء إليه، من غير حصر المعنى في وجه واحد.'
- source_word: ἐμὲ
  choice: ني في «يستقبلني»
  rationale: ضمير المتكلم مفعول به مباشر، وتكرار «يستقبل» يجعل المطابقة التمثيلية بين استقبال الطفل واستقبال يسوع واضحة.
theological_decisions:
- issue: التماهي التمثيلي بين الطفل ويسوع
  choice: يقرر النص أن استقبال طفل كهذا باسم يسوع هو استقبال يسوع نفسه.
  alternative: تخفيف العبارة إلى أن هذا الاستقبال لا يزيد على كونه إكرامًا ليسوع.
  rationale: استُعمل الفعل نفسه مع «طفلًا واحدًا كهذا» ثم مع «ني»، مما ينشئ مطابقة تمثيلية قوية. تحافظ الصياغة عليها من غير إضافة دلالات طقسية أو كنسية لا يذكرها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على تكرار الفعل وعلى إيجاز الجملة الأصلية، واستُعملت «باسمي» من غير تفسير زائد يحسم أحد أوجه دلالتها.
