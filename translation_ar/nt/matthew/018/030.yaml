lexical_decisions:
- source_word: ὁ δὲ
  choice: لكنه
  rationale: الضمير المستتر في «لكنه» يعود طبيعيًا إلى العبد الأول، وتحفظ «لكن» المقابلة التي تفيدها δέ.
- source_word: οὐκ ἤθελεν
  choice: لم يُرِد
  rationale: يحفظ المعنى الإرادي المباشر للفعل θέλω من غير تشديده تفسيريًا إلى «رفض».
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد انتقالًا تقابليًا قويًا من عدم الإرادة إلى الفعل الذي أقدم عليه.
- source_word: ἀπελθὼν
  choice: مضى
  rationale: صياغة عربية طبيعية موجزة تحفظ تعاقب الفعلين في اسم الفاعل اليوناني السابق للفعل الرئيس.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: ألقاه في السجن
  rationale: «ألقى» يحفظ قوة βάλλω وقسوة التصرف أكثر من التعبير المحايد «وضعه في السجن».
- source_word: ἕως οὗ
  choice: إلى أن
  rationale: تعبير عربي طبيعي يبيّن الحد الزمني للحبس.
- source_word: ἀποδῷ
  choice: يردَّ
  rationale: يناسب معنى أداء المستحق وإرجاعه، ويحفظ دلالة الإنجاز المرتقب بعد «إلى أن».
- source_word: τὸ ὀφειλόμενον
  choice: ما عليه
  rationale: تعبير عربي واضح وطبيعي عن «المستحق/الشيء المدين به» من غير حصره اصطلاحيًا في لفظ «الدَّين».
