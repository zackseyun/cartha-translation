source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: ar
  text: وَإِنْ رَفَضَ أَنْ يَسْتَمِعَ إِلَيْهِمْ، فَقُلْ لِلْجَمَاعَةِ[a]. وَإِنْ رَفَضَ أَنْ يَسْتَمِعَ إِلَى الْجَمَاعَةِ أَيْضًا، فَلْيَكُنْ عِنْدَكَ كَالْأُمَمِيِّ وَجَابِي الضَّرَائِبِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «للكنيسة» أو «لجماعة المؤمنين»؛ واللفظ اليوناني هو إكليسيا (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: رَفَضَ أَنْ يَسْمَعَ
  rationale: ينقل معنى عدم الإصغاء المقصود ورفض الاستجابة في سياق التأديب، لا مجرد تعذر السماع ولا معنى العصيان الأشد صراحة.
- source_word: αὐτῶν
  choice: لَهُمَا
  rationale: الضمير اليوناني جمع، لكنه يعود في السياق السابق إلى الشاهد الواحد أو الاثنين المنضمين إلى المخاطَب؛ وفي الحد الأدنى المقصود جماعة الشهود مع المخاطَب. استُعمل المثنى بوصفه إحالة طبيعية إلى الشخصين المذكورين مباشرة، مع بقاء احتمال العدد الأوسع في السياق.
- source_word: εἰπὸν τῇ ἐκκλησίᾳ
  choice: فَقُلْ لِلْجَمَاعَةِ
  rationale: يحافظ على صيغة الأمر وعلى الإيجاز اليوناني من غير إضافة مفعول تفسيري مثل «الأمر». و«الجماعة» تدل على المجتمع المجتمع دون افتراض بنية مؤسسية متأخرة.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: الْجَمَاعَةِ
  rationale: لفظ عربي واضح يدل على جماعة المؤمنين المجتمعة، ويحفظ المعنى الأساسي لـἐκκλησία مع تجنب حصره في مبنى أو مؤسسة.
- source_word: ἔστω σοι
  choice: فَلْيَكُنْ عِنْدَكَ
  rationale: يحفظ قوة الأمر والدلالة الشخصية لصيغة σοι، وهو تعبير عربي طبيعي أقرب إلى الأصل من تحويله مباشرة إلى «عامله» أو «اعتبره».
- source_word: ὁ ἐθνικὸς
  choice: الْأُمَمِيِّ
  rationale: ينقل المصطلح اليهودي السياقي الذي يشير إلى من هو من الأمم خارج جماعة العهد، دون إضافة حكم «وثني» غير لازم لفظيًا.
- source_word: ὁ τελώνης
  choice: جَابِي الضَّرَائِبِ
  rationale: تعبير عربي معاصر ودقيق للمهنة المقصودة، مع إبقاء الفئة بصيغة تمثيلية.
theological_decisions:
- issue: دلالة ἐκκλησία في سياق متى السابق للقيامة
  choice: الجماعة
  alternative: الكنيسة أو جماعة المؤمنين
  rationale: «الجماعة» تحفظ معنى المجتمع المجتمع وتتفادى تحميل العبارة افتراضات طائفية أو مؤسسية لاحقة، بينما تُذكر «الكنيسة» في الحاشية بوصفها ترجمة تقليدية وسياقية ممكنة.
- issue: قوة تشبيه غير التائب بالأممي وجابي الضرائب
  choice: فليكن عندك كالأممي وجابي الضرائب
  alternative: عامله كأممي وجابي ضرائب؛ اعتبره خارج الجماعة
  rationale: تحفظ الصياغة التشبيه والأمر كما في اليونانية، ولا تحول الآية وحدها إلى إجراء تفصيلي أو عقيدة مكتملة عن الحرمان.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يسمع لـ» بمعنى يصغي ويستجيب، و«جابي الضرائب» بدل التعبير التاريخي الأقل وضوحًا «العشّار». تظهر علامة الحاشية [a] في المتن.
