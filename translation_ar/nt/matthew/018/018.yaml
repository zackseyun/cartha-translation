  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ar
  text: 'الحق أقول لكم: كل ما تربطونه على الأرض سيكون قد رُبط في السماء[a]، وكل ما تحلّونه على الأرض سيكون قد حُلَّ في السماء.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب الصياغة التقليدية: «سيُربط في السماء... وسيُحلّ في السماء». تسمح الصيغة اليونانية بهذه الترجمة، لكن النص هنا يعكس اجتماع فعل المستقبل مع اسم مفعول تام، وهو ما قد يدل على حالة كانت قد تحققت في السماء.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي قوة التوكيد الاحتفالي الذي يفتتح به يسوع قولًا ذا سلطان، وهي واضحة وطبيعية في العربية الفصحى المعاصرة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: تنقل صيغة الخطاب المباشر ببساطة وتحافظ على نبرة السلطان في القول.
- source_word: ὅσα ἐὰν
  choice: كل ما
  rationale: تنقل معنى العموم غير المحدد في التركيب اليوناني بصياغة عربية طبيعية.
- source_word: δήσητε
  choice: تربطونه
  rationale: تحافظ على صورة الربط وعلى مداها الدلالي، من غير حصرها مسبقًا في معنى قضائي مثل المنع.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: تعبير عربي مألوف يحفظ المقابلة بين المجال الأرضي والسماء.
- source_word: ἔσται δεδεμένα
  choice: سيكون قد رُبط
  rationale: تعكس الصيغة المؤلفة من فعل مستقبل واسم مفعول تام، فتشير إلى حالة قائمة ناتجة من فعل سابق، مع بقاء احتمال فهمها مستقبلًا مبنيًا للمجهول مذكورًا في الحاشية.
- source_word: ἐν οὐρανῷ
  choice: في السماء
  rationale: تنقل المفرد اليوناني بوصفه إشارة مألوفة إلى المجال السماوي.
- source_word: λύσητε
  choice: تحلّونه
  rationale: تحافظ على المقابلة التصويرية بين الربط والحل، ولا تحصر المعنى في الإباحة أو الإفراج وحدهما.
- source_word: ἔσται λελυμένα
  choice: سيكون قد حُلَّ
  rationale: تحافظ على التوازي مع الشطر الأول وتعكس معنى الحالة الناتجة من فعل سابق في صيغة المستقبل مع التمام.
theological_decisions:
- issue: القوة الزمنية واللاهوتية لصيغة الربط والحل
  choice: سيكون قد رُبط في السماء... سيكون قد حُلَّ في السماء
  alternative: سيُربط في السماء... سيُحلّ في السماء
  rationale: تركيب ἔσται مع اسم المفعول التام يرجّح وصف حالة مستقبلية ناتجة من فعل سابق. وتحفظ هذه الصياغة التوتر بين القرار الأرضي وما هو قائم في السماء، من غير أن تفرض نظرية طائفية بشأن سلطة الجماعة أو كيفية موافقة السماء.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. أُبقيت صورتا «الربط» و«الحل» لتجنب تضييق معناهما إلى المنع والإباحة، واستُخدمت صيغة «سيكون قد...» رغم ثقلها النسبي لأنها أوضح وسيلة عربية لإظهار البعد التام في التركيب اليوناني.
