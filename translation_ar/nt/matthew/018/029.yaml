  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: ar
  text: 'فسقط زميلُه[a] العبد أمامه، وأخذ يتوسّل إليه قائلًا: «تمهَّل عليَّ، وسأسدّد لك ما عليَّ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «زميله في العبودية»، أي عبد يشترك معه في السيد نفسه. ويمكن ترجمتها أيضًا: «رفيقه العبد».'
    reason: alternative_reading
lexical_decisions:
- source_word: σύνδουλος
  choice: العبد رفيقه
  rationale: ينقل معنى العبد الذي يشترك معه في السيد نفسه، مع إبراز علاقة العبودية في سياق المثل، وصيغت العبارة على نحو عربي طبيعي.
- source_word: πεσὼν
  choice: فسقط أمامه
  rationale: يحفظ فعل السقوط بوصفه حركة تذلل واستعطاف، وتوضح «أمامه» دلالة المقام من غير أن تستبدل بالفعل.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تلائم تدفق السرد العربي وتنقل الصلة الاستنتاجية والتتابعية التي تؤديها οὖν هنا.
- source_word: παρεκάλει
  choice: أخذ يتوسّل إليه
  rationale: صيغة «أخذ» مع المضارع تنقل الاستمرار الذي في الفعل اليوناني الناقص، و«يتوسّل» تعبّر عن شدة طلب الرحمة في سياق الدَّين.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: تمهَّل عليَّ
  rationale: تعبير عربي واضح وطبيعي يطلب الإمهال والصبر في سداد الدَّين، ويحفظ تعلق الطلب بالمتكلم.
- source_word: ἀποδώσω σοι
  choice: سأوفيك ما عليَّ
  rationale: في سياق الدَّين، يفيد الوفاء بما هو مستحق للمخاطَب، وهو عربي طبيعي مع إبقاء الوعد بالسداد دون إضافة مقدار غير مذكور.
theological_decisions:
- issue: ترجمة لغة العبودية في σύνδουλος
  choice: العبد رفيقه
  alternative: الخادم رفيقه / العبد مثله
  rationale: اختير «العبد» لأن σύνδουλος يدل على شخص يشترك مع آخر في السيد نفسه، ولأن علاقة العبودية بارزة في مثل الملك والديون. وأضيفت حاشية تبين هذا المعنى المركب من غير تلطيف الواقع الاجتماعي أو تحميله دلالة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «تمهَّل عليَّ» لملاءمة سياق طلب مهلة لسداد الدَّين، و«أخذ يتوسّل» لإظهار استمرار التوسل. وُضع مؤشر الحاشية بعد الجملة التي تتضمن اللفظ المشروح.
