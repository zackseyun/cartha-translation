lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: دعا
  rationale: صيغة اسم الفاعل الظرفية تدل على أن يسوع استدعى الطفل إليه؛ و«دعا» تؤدي المعنى بوضوح وطبيعية من غير إثقال العبارة.
- source_word: παιδίον
  choice: طفلًا
  rationale: لفظ عام لطفل صغير، و«طفل» هو المقابل العربي المعاصر الواضح من دون تحديد جنس لا يصرّح به اللفظ اليوناني.
- source_word: ἔστησεν
  choice: أوقفه
  rationale: الفعل المتعدي يعني جعله يقف أو وضعه واقفًا، لذا تحافظ «أوقفه» على الصورة الحركية في الأصل بدل الاكتفاء بـ«وضعه».
- source_word: ἐν μέσῳ αὐτῶν
  choice: في وسطهم
  rationale: ترجمة مباشرة وطبيعية تفيد وجود الطفل في مركز الجماعة المحيطة.
