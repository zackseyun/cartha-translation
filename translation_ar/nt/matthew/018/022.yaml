  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: ar
  text: 'يقول له يسوع: «لا أقول لك: إلى سبع مرات، بل إلى سبع وسبعين مرة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سبعين مرة سبع مرات».'
    reason: قراءة بديلة للتعبير العددي اليوناني الذي يحتمل «سبعًا وسبعين» أو «سبعين في سبعة».
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: يقول له يسوع
  rationale: يحافظ على المضارع السردي في اليونانية وعلى الضمير غير المسمّى، مع ترتيب عربي واضح وطبيعي.
- source_word: Οὐ λέγω σοι
  choice: لا أقول لك
  rationale: ترجمة مباشرة للمضارع مع ضمير المخاطب في صياغة عربية فصيحة مألوفة.
- source_word: ἕως ἑπτάκις
  choice: إلى سبع مرات
  rationale: تفيد ἕως هنا بلوغ حد عددي، و«سبع مرات» تعبّر بوضوح عن التكرار.
- source_word: ἀλλὰ
  choice: بل
  rationale: «بل» أنسب في العربية بعد النفي لتصحيح الحد المذكور ومقابلته بما بعده.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: إلى سبع وسبعين مرة
  rationale: يعكس أحد الوجهين النحويين المعتبرين للعبارة اليونانية الغامضة، مع إثبات الوجه الآخر في الحاشية.
theological_decisions:
- issue: غموض التعبير العددي في تعليم يسوع عن المغفرة
  choice: سبع وسبعين مرة
  alternative: سبعين مرة سبع مرات
  rationale: تحتمل العبارة اليونانية ἑβδομηκοντάκις ἑπτά القراءتين. اختيرت «سبع وسبعين مرة» في المتن بوصفها قراءة مباشرة معتبرة، وأُبقيت القراءة التقليدية الأخرى في الحاشية دون تحويل القول إلى تفسير يفرض حدًا حسابيًا أو ينفيه صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حوفظ على المضارع السردي وعلى الغموض العددي بواسطة المتن والحاشية.
