  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: ar
  text: وكذلك، فليس من مشيئة أبيكم الذي في السماوات أن يهلك واحدٌ من هؤلاء الصغار.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يضيع واحدٌ من هؤلاء الصغار». يمكن أن يعني الفعل اليوناني «يهلك» أو «يضيع»، وسياق الخروف الضال السابق يؤيد المعنى الأخير.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تربط الخلاصة بالمثل السابق بعبارة عربية طبيعية، وتحافظ على معنى «على هذا النحو».
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν
  choice: ليست مشيئة أبيكم
  rationale: هذه صياغة عربية واضحة للتعبير اليوناني الذي يفيد أن هلاكهم ليس مما يريده الآب؛ والترجمة الحرفية لـἔμπροσθεν، أي «أمام»، ثقيلة في هذا التركيب العربي.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: الذي في السماوات
  rationale: تحافظ على جملة الصلة وعلى صيغة الجمع اليونانية، مع بقاء التعبير فصيحًا ومفهومًا.
- source_word: ἵνα ἀπόληται
  choice: أن يهلك
  rationale: ينقل المعنى الخطير للفعل ἀπόλλυμι من غير حصره في مجرد الضلال، مع إثبات معنى «يضل/يضيع» الممكن سياقيًا في الحاشية.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: واحد من هؤلاء الصغار
  rationale: يلتزم بالمفرد العددي دون إضافة «حتى» غير المصرح بها، ويحفظ «الصغار» اتساع الدلالة فلا يقصرها على الأطفال وحدهم.
theological_decisions:
- issue: دلالة ἀπόληται في سياق مثل الخروف الضال
  choice: أن يهلك
  alternative: أن يضلّ أو يضيع
  rationale: قد يدل الفعل على الهلاك، وقد يحمل معنى الضياع بالنظر إلى السياق السابق. أُبقي المعنى الأول في المتن، وأُثبت الاحتمال السياقي في الحاشية، من غير حسم للتوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الصغار» بوصفها تسمية علائقية أو مجازية محتملة، لا «الأطفال»، تجنبًا لتقييد المرجع بالعمر. وُضع مؤشر الحاشية بعد الجملة التي تتعلق بها.
