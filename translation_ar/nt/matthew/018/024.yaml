  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: ar
  text: ولما بدأ في تسوية الحسابات، أُحضر إليه مدين واحد عليه عشرة آلاف وزنة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كانت الوزنة وحدة مالية ضخمة جدًا؛ ويمثل «عشرة آلاف وزنة» في سياق المثل دينًا هائلًا يفوق التصور.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: ولما بدأ
  rationale: ينقل تركيب المضاف المطلق بوصفه ظرفًا زمنيًا يمهّد للفعل الرئيس، بصياغة عربية طبيعية، مع إفادة δέ للانتقال في السرد.
- source_word: συναίρειν
  choice: يصفي الحسابات
  rationale: في السياق المالي يدل الفعل على مراجعة الحسابات وتسويتها؛ و«يصفي الحسابات» تعبير عربي واضح يحافظ على صورة المحاسبة.
- source_word: προσηνέχθη αὐτῷ
  choice: أُحضر إليه
  rationale: يحافظ المبني للمجهول على دلالة أن آخرين أحضروا المدين، وتؤدي «إليه» معنى الداتيف بوضوح.
- source_word: εἷς ὀφειλέτης
  choice: مدين
  rationale: «مدين» مقابل مباشر لـὀφειλέτης. لم تُترجم εἷς ترجمة عددية مستقلة لأن التنكير في العربية يقدّم فردًا واحدًا طبيعيًا من بين المدينين، ولأن «مدين واحد» قد يوحي بمقابلة عددية غير مقصودة.
- source_word: μυρίων ταλάντων
  choice: عشرة آلاف وزنة
  rationale: تُبقي العبارة العدد الصريح μύριοι والوحدة التاريخية τάλαντον من غير تحويل تخميني إلى عملة حديثة؛ و«الوزنة» هي الصيغة العربية المألوفة لهذه الوحدة.
