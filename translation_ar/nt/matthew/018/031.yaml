source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: ar
  text: فلما رأى رفقاؤه من العبيد[a] ما حدث، حزنوا حزنًا شديدًا، ثم جاؤوا وأبلغوا سيدهم[b] بكل ما حدث.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رفقاؤه من الخدم». اللفظ اليوناني يعني حرفيًا رفقاءه في العبودية أو الخدمة تحت السيد نفسه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مولاهم». اللفظ اليوناني κύριος قد يعني «السيد» أو «المولى» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ في «فلما»
  rationale: تفيد الانتقال الناتج عما سبق وتربط المشهد بما قبله ربطًا طبيعيًا في السرد العربي، دون إثقال العبارة بـ«لذلك».
- source_word: σύνδουλοι
  choice: رفقاؤه من العبيد
  rationale: ينقل معنى الاشتراك في منزلة العبودية تحت سيد واحد، وهو عنصر مهم في سياق المثل، مع صياغة عربية واضحة.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: ما حدث / كل ما حدث
  rationale: صياغة عربية مألوفة لاسم الفاعل اليوناني المستعمل استعمال الاسم، مع إظهار قوة πάντα في الموضع الثاني بواسطة «كل».
- source_word: ἐλυπήθησαν σφόδρα
  choice: حزنوا حزنًا شديدًا
  rationale: يحفظ معنى الحزن أو الأسى وشدة الانفعال التي تفيدها σφόδρα، بأسلوب عربي طبيعي ومؤكد.
- source_word: ἐλθόντες
  choice: ثم جاؤوا
  rationale: يحوّل اسم الفاعل الدال على الفعل السابق إلى فعل سردي عربي، وتوضح «ثم» تعاقب الأحداث دون تغيير مضمونها.
- source_word: διεσάφησαν
  choice: أبلغوا
  rationale: يناسب إبلاغ المرؤوسين سيدهم بما جرى؛ ويُفهم شمول البيان من العبارة التالية «بكل ما حدث».
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: سيدهم
  rationale: «السيد» مناسب لرئيس العبيد البشري في هذا المثل، ويحفظ دلالة κύριος السياقية من غير أن يوحي هنا بلقب إلهي.
theological_decisions:
- issue: نقل لفظ σύνδουλοι في بيئة العبودية التي يصورها المثل
  choice: رفقاؤه من العبيد
  alternative: رفقاؤه من الخدم
  rationale: يحافظ «العبيد» على المنزلة المقيدة المشتركة التي يدل عليها مركب σύνδουλοι، بدل تلطيفها إلى مجرد خدمة طوعية.
- issue: نقل κύριος حين يدل على صاحب سلطة بشري
  choice: سيدهم
  alternative: مولاهم
  rationale: «سيدهم» أوضح في العربية المعاصرة لعلاقة السيد بعبيده، ولا يحوّل الشخصية البشرية في المثل إلى مرجع إلهي صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم تركيب سردي طبيعي، مع إبقاء تكرار «ما حدث» المقصود في الأصل وإظهار منزلة العبودية المشتركة بوضوح.
