  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: ar
  text: هكذا أيضًا سيفعل بكم أبي السماوي، إن لم يغفر كلُّ واحد منكم لأخيه[a] من قلوبكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «أخيه» ترجمة للمفرد المذكر في اليونانية، وهو هنا يُستعمل تمثيليًا لكل تلميذ أو مؤمن آخر.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: وهكذا أيضًا
  rationale: تربط الآية بتطبيق المثل السابق، وتحفظ القوة المقارِنة والاستنتاجية للتعبير اليوناني.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: أبي السماوي
  rationale: صياغة عربية موجزة وطبيعية تحفظ ضمير المتكلم والصفة اليونانية οὐράνιος.
- source_word: ποιήσει ὑμῖν
  choice: سيفعل بكم
  rationale: تحفظ عمومية الفعل وإحالته إلى ما فعله السيد في المثل، من غير إضافة تفسير لطبيعة الدينونة.
- source_word: ἐὰν μὴ
  choice: إن لم
  rationale: تنقل الشرط المنفي بوضوح وطبيعية في العربية.
- source_word: ἀφῆτε
  choice: يغفر
  rationale: المعنى السياقي للفعل هو غفران الإساءة، مع بقاء صورة الدَّين في خلفية المثل.
- source_word: ἕκαστος
  choice: كلُّ واحد منكم
  rationale: تُظهر دلالة التوزيع في المفرد على جميع المخاطَبين بصياغة عربية واضحة.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: لأخيه
  rationale: تنقل المفرد المذكر في اليونانية بدقة، مع توضيح وظيفته التمثيلية في الحاشية.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: من قلوبكم
  rationale: تحفظ صيغة الجمع في الأصل وتشدد على أن الغفران صادر عن الباطن بصدق.
theological_decisions:
- issue: مدى التحذير وقوته
  choice: إبقاء العبارة تحذيرًا مباشرًا بأن الآب سيفعل بالمخاطَبين كما فعل السيد في المثل.
  alternative: تلطيفها إلى «سيعاملكم على هذا النحو»، أو تحديدها بأنها إدانة أبدية أو خسارة مكافأة.
  rationale: النص يعلن تحذيرًا شرطيًا جادًا، لكنه لا يحدد في هذه الآية وحدها التصنيف العقائدي الكامل للعقوبة؛ لذلك تُحفظ حدة التحذير والتوتر اللاهوتي بلا توسع.
- issue: دلالة ἀδελφῷ المذكرة
  choice: لأخيه
  alternative: لأخيه أو أخته؛ لأحد إخوته في الإيمان؛ لرفيقه المؤمن.
  rationale: الأصل مفرد مذكر، ولذلك يُحفظ في المتن، مع بيان أن السياق يجعله تمثيليًا لكل تلميذ أو مؤمن نظير.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. روعي إبقاء الإحالة إلى المثل السابق عامة، والمحافظة على الجمع في «قلوبكم» وعلى التحذير الشرطي من غير تفسير عقائدي زائد.
