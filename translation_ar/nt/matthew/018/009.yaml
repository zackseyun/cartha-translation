review_pass:
  verdict: revise
  source_fidelity: 'تحتاج المسودة إلى تصحيح نحوي ودلالي في العبارة الافتتاحية: «جعلتك عينك تعثر» لا تؤدي بوضوح معنى σκανδαλίζει σε، بل يختل فيها إسناد الفعل. الصياغة «تُعثِرك» تنقل السببية وصورة التعثر. كما أن «بعينين» في شق المقارنة يحفظ بصورة أوجز وأدق حال امتلاك العينين في اليونانية (δύο ὀφθαλμοὺς ἔχοντα).'
  naturalness: «وإن كانت عينك تُعثِرك» فصيحة وطبيعية في العربية المعاصرة. و«فألقها عنك» أوضح في الدلالة على الإبعاد من «واطرحها عنك»، مع بقاء قوة الصورة. والصياغة المعدلة تحافظ على السجل الكتابي الواضح دون تلطيف للأمر.
  terminology: أُبقيت «جهنم النار» مقابلاً مباشرًا لـ γέενναν τοῦ πυρός، ولم تُضف صفة «الأبدية» إلى «الحياة». وتبقى الحاشية الخاصة بجهنم مرتبطة بالكلمة نفسها، لا بعلامة ترقيم ختامية.
  issues:
