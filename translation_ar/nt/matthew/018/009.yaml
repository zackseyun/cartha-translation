revisions:
- from: وَإِنْ جَعَلَتْكَ عَيْنُكَ تَعْثُرُ[a]، فَاقْلَعْهَا وَاطْرَحْهَا عَنْكَ. فَخَيْرٌ لَكَ أَنْ تَدْخُلَ الْحَيَاةَ بِعَيْنٍ وَاحِدَةٍ مِنْ أَنْ تَكُونَ لَكَ عَيْنَانِ وَتُطْرَحَ فِي جَهَنَّمَ النَّارِ.[b]
  to: وَإِنْ كَانَتْ عَيْنُكَ تُعْثِرُكَ[a]، فَاقْلَعْهَا وَأَلْقِهَا عَنْكَ. فَخَيْرٌ لَكَ أَنْ تَدْخُلَ الْحَيَاةَ بِعَيْنٍ وَاحِدَةٍ مِنْ أَنْ تُطْرَحَ فِي جَهَنَّمَ[b] النَّارِ بِعَيْنَيْنِ.
  rationale: تُصحَّح العلاقة السببية التي يعبر عنها الفعل اليوناني، وتُهذَّب المقارنة لتطابق حال «ذي عينين» من دون إضافة تفسيرية. كما نُقلت علامة الحاشية لتتصل مباشرة بمصطلح «جهنم»، وحُفظت ألفاظ «الحياة» و«جهنم النار» وصورة الأمر الحادة.
