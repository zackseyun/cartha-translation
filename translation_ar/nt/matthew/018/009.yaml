    issue: خلل في تركيب «وَإِنْ جَعَلَتْكَ عَيْنُكَ تَعْثُرُ».
    rationale: 'لا يستقيم هذا التركيب لإفادة أن العين هي التي تسبب تعثر المخاطب؛ إذ يتداخل فيه موقع الفاعل والمفعول ومصدر الفعل. واليونانية σκανδαλίζει σε تفيد: «تُعثِرك/تسبب لك التعثر».'
  - severity: medium
    issue: «من أن تكون لك عينان وتُطرح» أوسع وأثقل من تركيب المصدر.
    rationale: اليونانية تصف الشخص المطروح بأنه «ذو عينين». و«من أن تُطرح ... بعينين» تؤدي هذه الحال مباشرة وبأسلوب عربي سلس.
