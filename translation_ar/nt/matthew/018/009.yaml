reference: Matthew 18:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: ar
  text: وَإِنْ كَانَتْ عَيْنُكَ تُعْثِرُكَ[a]، فَاقْلَعْهَا وَأَلْقِهَا عَنْكَ. فَخَيْرٌ لَكَ أَنْ تَدْخُلَ الْحَيَاةَ بِعَيْنٍ وَاحِدَةٍ مِنْ أَنْ تُطْرَحَ فِي جَهَنَّمَ[b] النَّارِ بِعَيْنَيْنِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تدفعك إلى الخطيئة». يمكن أن يعني الفعل اليوناني التسبب في التعثر أو السقوط أو الوقوع في الخطيئة.'
    reason: lexical_alternative
  - marker: b
    text: «جهنم» نقلٌ للمصطلح اليوناني «غيهنّا»، ويشير في هذا السياق إلى موضع الدينونة النهائية؛ ويُترجم تقليديًا «الجحيم».
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: جعلتك تعثر
  rationale: يحفظ صورة التعثر في الفعل اليوناني، مع بقاء دلالته السياقية على الوقوع في الخطيئة؛ وتوضح الحاشية هذا الاتساع الدلالي.
- source_word: ἔξελε
  choice: فاقلعها
  rationale: صيغة أمر قوية تنقل الصورة الحادة والعاجلة في النص، وهي طبيعية في العربية عند الحديث عن العين.
- source_word: βάλε ἀπὸ σοῦ
  choice: واطرحها عنك
  rationale: تعبّر عن الإبعاد الحاسم والكامل، وتحافظ على تركيب المصدر من غير تلطيف للصورة.
- source_word: καλόν σοί ἐστιν
  choice: فخير لك
  rationale: السياق مقارن بسبب جملة «مِن أن»، ولذلك تؤدي العبارة معنى الأفضلية لا مجرد الحُسن.
- source_word: μονόφθαλμον
  choice: بعين واحدة
  rationale: صياغة عربية واضحة وطبيعية تحفظ الصورة الجسدية التي يدل عليها الوصف اليوناني.
- source_word: εἰς τὴν ζωὴν
  choice: تدخل الحياة
  rationale: يحافظ على لفظ «الحياة» من دون إضافة «الأبدية»، مع إبقاء دلالته الأخروية المحتملة مفتوحة.
- source_word: βληθῆναι
  choice: تُطرح
  rationale: يحفظ المبني للمجهول وقوة فعل الإلقاء، كما يربط لغويًا بين طرح العين والطرح في جهنم.
- source_word: γέενναν
  choice: جهنم
  rationale: «جهنم» هي المقابل العربي الراسخ المنحدر من الاسم نفسه، وتحفظ خصوصية المصطلح أفضل من تعميمه إلى «الجحيم».
- source_word: τοῦ πυρός
  choice: جهنم النار
  rationale: يحافظ على الإضافة اليونانية حرفيًا نسبيًا، ويصون صورة النار من دون تحويلها إلى صفة تفسيرية.
theological_decisions:
- issue: ترجمة γέεννα
  choice: جهنم
  alternative: الجحيم
  rationale: النص يستعمل المصطلح المحدد «غيهنّا»، و«جهنم» مقابله العربي التاريخي المباشر، فلا يُستعاض عنه بلفظ عام قد يطمس خصوصيته.
- issue: ترجمة εἰς τὴν ζωὴν
  choice: تدخل الحياة
  alternative: تدخل الحياة الأبدية
  rationale: مع أن السياق يرجح معنى أخرويًا، لا ترد صفة «الأبدية» في اليونانية؛ لذا تُترك العبارة على اتساعها الأصلي.
- issue: حدة الأمر المتعلق بالعين
  choice: فاقلعها واطرحها عنك
  alternative: فأزلها وأبعدها عنك
  rationale: يحافظ الاختيار على الصورة البلاغية العنيفة في النص بدل تلطيفها أو إضافة تفسير يحدد كيفية تطبيقها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع صياغة كتابية طبيعية. حُفظت صورة التعثر وقوة الأمر، وأُبقيت عبارتا «الحياة» و«جهنم النار» قريبتين من اليونانية دون توسع تفسيري.
