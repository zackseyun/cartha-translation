reference: Matthew 18:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: ar
  text: 'وإن اتفق أن يجده[a]، فالحق أقول لكم: إنه يفرح به أكثر من فرحه بالخراف التسعة والتسعين التي لم تضلّ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «وإن حدث أن يجده».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «التي لم تبتعد عن الطريق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حُفظ حرف العطف البسيط لربط الآية بسياق المثل السابق دون إضافة انتقال تفسيري.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: وإن اتفق أن يجده
  rationale: تنقل العبارة معنى الاحتمال ووقوع الحدث الكامن في تركيب ἐὰν مع γένηται والمصدر، مع بقائها طبيعية في العربية.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: فالحق أقول لكم
  rationale: صيغة عربية واضحة ومهيبة تحفظ التوكيد الرسمي في قول يسوع. أضيفت الفاء لسلامة الربط العربي بعد الجملة الشرطية.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: يفرح به
  rationale: تنقل قوة χαίρει ومعنى كون الخروف الموجود سبب الفرح، بتعبير عربي طبيعي.
- source_word: μᾶλλον ἢ
  choice: أكثر من
  rationale: يحفظ المقارنة الصريحة في اليونانية ولا يحولها إلى تفضيل استبعادي.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: بالخراف التسعة والتسعين
  rationale: أُظهر الاسم المفهوم من السياق لأن ذكره يجعل المقارنة سليمة وواضحة بالعربية، مع أنه مقدر في اليونانية.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: التي لم تضلّ
  rationale: يحفظ صورة الابتعاد عن الطريق وحالة الخراف التي لم تضل، دون إدخال معنى أنها أُضلّت بفعل فاعل خارجي.
theological_decisions:
- issue: دلالة المقارنة بين فرح الراعي بالواحد وفرحه بالتسعة والتسعين
  choice: الإبقاء على أنه يفرح بالواحد الموجود أكثر من فرحه بالتسعة والتسعين التي لم تضل
  alternative: تلطيف المقارنة بما يوحي فقط بفرح خاص، أو فهمها على أنها انتقاص من قيمة التسعة والتسعين
  rationale: تفيد μᾶλλον ἢ مقارنة حقيقية. لذلك حُفظ التوتر في القول من غير استنتاج أن الراعي لا يهتم بالتسعة والتسعين أو أنها أقل قيمة في ذاتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «فالحق أقول لكم» لصيغة التوكيد، وأُظهر لفظ «الخراف» المفهوم من السياق منعًا للغموض في العربية. وُضعت علامتا الحاشيتين في موضعي العبارتين اللتين تشرحانهما.
