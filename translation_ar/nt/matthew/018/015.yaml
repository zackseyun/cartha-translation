  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: ar
  text: «وإن أخطأ أخوك في حقك[a][c]، فاذهب وواجِهه بخطئه[b] بينك وبينه على انفراد. فإن استمع إليك، فقد ربحت أخاك.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تحذف بعض المخطوطات عبارة «في حقك»، فتكون القراءة: «إن أخطأ أخوك، فاذهب وواجِهه بخطئه بينك وبينه على انفراد».'
    reason: textual_variant
  - marker: b
    text: 'أو: «وبِّخه»، أو: «بيِّن له خطأه».'
    reason: lexical_alternative
  - marker: c
    text: كلمة «أخ» هنا مفرد مذكر من الناحية النحوية، وقد تشير في السياق على نحو أوسع إلى أحد التلاميذ أو المؤمنين.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: أخطأ
  rationale: يحفظ الدلالة الأخلاقية للفعل في شرط عام، ويأتي عربيًا بصورة طبيعية بعد «إن».
- source_word: εἰς σέ
  choice: إليك
  rationale: تعبير عربي موجز وطبيعي يدل على أن الخطيئة موجَّهة إلى المخاطَب، مع إثبات الخلاف النصي في الحاشية.
- source_word: ὁ ἀδελφός σου
  choice: أخوك
  rationale: ينقل صيغة المفرد المذكر في اليونانية دون توسيع تفسيري داخل المتن، مع بيان إمكان الدلالة السياقية الأوسع في الحاشية.
- source_word: ὕπαγε
  choice: فاذهب
  rationale: ينقل فعل الأمر بوضوح وإيجاز، وتفيد الفاء الانتقال إلى الإجراء المطلوب.
- source_word: ἔλεγξον
  choice: واجِهه بخطئه
  rationale: يعبّر بلغة عربية معاصرة عن كشف الخطأ لصاحبه ومواجهته به، من غير أن يضفي بالضرورة قسوة «التوبيخ».
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: بينك وبينه على انفراد
  rationale: يحفظ التشديد على الخصوصية وقصر المواجهة أولًا على الشخصين.
- source_word: ἀκούσῃ
  choice: سمع لك
  rationale: تعبير عربي يفيد السماع المستجيب أو الإصغاء، من غير رفع المعنى صراحة إلى الطاعة الكاملة.
- source_word: ἐκέρδησας
  choice: ربحت
  rationale: يحفظ استعارة الكسب الواردة في κερδαίνω، ولا يضيف معنى «استعدت» غير المصرّح به.
theological_decisions:
- issue: هل تُترجم ἀδελφός بصيغة شاملة صراحةً؟
  choice: أخوك
  alternative: أخوك أو أختك؛ أخوك في الإيمان
  rationale: المتن يتبع صيغة المفرد المذكر في الأصل، بينما توضّح الحاشية أن السياق قد يوسّع المرجع إلى أحد التلاميذ أو المؤمنين.
- issue: الحالة النصية لعبارة εἰς σέ
  choice: إثبات «إليك» في المتن
  alternative: 'حذفها: «إن أخطأ أخوك»'
  rationale: يثبتها نص SBLGNT المعطى، لكن حذفها في بعض المخطوطات يؤثر في مدى الوصية، ولذلك يُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «واجِهه بخطئه» بدل لفظ قديم أو شديد النبرة، وحُفظت استعارة «ربحت أخاك». وُضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
