  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: ar
  text: أما كان ينبغي لك أنت أيضًا أن ترحم رفيقك في العبودية[a]، كما رحمتك أنا أيضًا؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رفيقك العبد». تشير الكلمة اليونانية إلى عبدٍ يشترك مع المخاطَب في السيد نفسه.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: أفما كان ينبغي
  rationale: ينقل معنى الوجوب الأخلاقي في سؤال توبيخي، بصياغة عربية فصيحة وطبيعية.
- source_word: καὶ σὲ
  choice: لك أنت أيضًا
  rationale: يحفظ معنى الإضافة والمقابلة، ويبرز المخاطَب كما يبرزه الضمير اليوناني.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: ترحم / رحمت
  rationale: يحافظ على تكرار الفعل نفسه في شطري الآية وعلى دلالته الأخلاقية واللاهوتية.
- source_word: τὸν σύνδουλόν σου
  choice: رفيقك في العبودية
  rationale: يعبّر عن شخص يشترك مع المخاطَب في منزلة العبد تحت سيد واحد، من غير تلطيف معنى العبودية إلى مجرد الخدمة.
- source_word: ὡς
  choice: كما
  rationale: تنقل المقارنة المباشرة بين الرحمة المطلوبة والرحمة التي سبق أن نالها المخاطَب.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: يحفظ معنى καὶ ἐγώ ويقابل «أنت أيضًا» في أول الجملة.
theological_decisions:
- issue: ترجمة لفظ σύνδουλος من أسرة δοῦλος
  choice: رفيقك في العبودية
  alternative: رفيقك الخادم؛ العبد رفيقك
  rationale: السياق سياق ملك وعبيد، ومن ثم تبقى رابطة العبودية والاشتراك في السيد ظاهرة. وتتفادى الصياغة حصر اللفظ في خدمة طوعية قد لا يدل عليها الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة توبيخية تليق بكلام الملك في المثل. استُعملت «أفما كان ينبغي» بدل تركيب حرفي ثقيل، مع الحفاظ على التوازي اللفظي بين «ترحم» و«رحمت».
