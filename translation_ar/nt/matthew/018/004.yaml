  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ar
  text: فمَن يتواضع مثل هذا الطفل، فهو الأعظم في ملكوت السماوات.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: يُواضِع نفسه
  rationale: ينقل الفعل المتعدي بمعنى أن يجعل المرء نفسه متواضعًا أو يتخذ منزلة متواضعة، مع الحفاظ على الصيغة الانعكاسية.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: مثل هذا الطفل
  rationale: ترجمة طبيعية للمقارنة، مع إبقاء الإشارة إلى الطفل الحاضر في السياق.
- source_word: ὁ μείζων
  choice: الأعظم
  rationale: صيغة تفضيل معرفة تشير إلى صاحب المنزلة الأعظم، دون إضافة قيد تفسيري.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: يحافظ على التعبير المتيّاوي المألوف وعلى صيغة الجمع في «السماوات».
theological_decisions:
- issue: العلاقة بين التواضع والعظمة في الملكوت
  choice: فهو الأعظم في ملكوت السماوات
  alternative: فهو الأكبر في ملكوت السماوات
  rationale: حُفظ التصريح المفارق كما هو، من غير تفسير العظمة بأنها خدمة أو رتبة بعينها، لأن الآية نفسها لا تفصّل ذلك.
- issue: إبراز الضمير في جملة النتيجة
  choice: فهو الأعظم
  alternative: هو الأعظم / يكون الأعظم
  rationale: يعكس οὗτός ἐστιν بتوكيد الشخص المشار إليه، ويحافظ على بنية النص التي تستأنف بالضمير الإشاري.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «يُواضِع نفسه» بدل «يتواضع» للمحافظة على دلالة جعل النفس في منزلة متواضعة، مع صياغة مفهومة في السياق.
