source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: ar
  text: لأنه حيث يكون اثنان أو ثلاثة مجتمعين باسمي، أكون هناك في وسطهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بينهم».'
    reason: بديل معجمي طبيعي لعبارة ἐν μέσῳ αὐτῶν، بينما يحافظ المتن على صورتها المكانية الأقرب.
lexical_decisions:
- source_word: οὗ
  choice: حيث
  rationale: تُدخل جملة مكانية، وتحافظ على الترابط مع «هناك» من غير توسيع المعنى إلى «حيثما».
- source_word: γάρ
  choice: لأنه
  rationale: تحفظ العلاقة التعليلية والتفسيرية مع السياق السابق بصياغة عربية واضحة.
- source_word: δύο ἢ τρεῖς
  choice: اثنان أو ثلاثة
  rationale: نقل مباشر ودقيق للتعبير العددي.
- source_word: συνηγμένοι
  choice: مجتمعين
  rationale: تنقل حالة اجتماعهم القائمة التي يدل عليها اسم الفاعل التام المبني للمجهول، من غير إثقال العبارة العربية بصياغة حرفية مصطنعة.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: باسمي
  rationale: تعبير عربي موجز وطبيعي يدل على الاجتماع ارتباطًا باسم يسوع، من غير حصره في تفسير واحد كالسلطان أو الولاء أو الغاية.
- source_word: ἐκεῖ
  choice: هناك
  rationale: تقابل «حيث» وتحافظ على بنية «حيث... هناك» في اليونانية.
- source_word: εἰμι
  choice: أكون
  rationale: تلائم جواب الجملة المكانية في العربية وتحفظ بساطة فعل الكينونة من غير إضافة تفسيرية مثل «أكون حاضرًا».
- source_word: ἐν μέσῳ αὐτῶν
  choice: في وسطهم
  rationale: تحافظ على الصورة المكانية في الأصل، مع إثبات البديل الاصطلاحي «بينهم» في الحاشية.
theological_decisions:
- issue: دلالة حضور يسوع وسط المجتمعين باسمه
  choice: صياغة القول بوصفه تأكيدًا مباشرًا لوجود يسوع وسطهم، من غير تحديد كيفية هذا الحضور.
  alternative: «أكون حاضرًا بينهم»، أو صياغة تربطه بتفسير أسراري أو كنسي خاص.
  rationale: النص يثبت حضور يسوع لكنه لا يشرح طبيعته الميتافيزيقية ولا يربطه صراحة بمذهب طائفي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت بنية «حيث... هناك» للمحافظة على تقابل الأصل، ووُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
