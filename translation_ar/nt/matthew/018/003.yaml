  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: ar
  text: 'وقال: «الحق أقول لكم: إن لم ترجعوا[a] وتصيروا مثل الأطفال[b]، فلن تدخلوا ملكوت السماوات أبدًا[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «تُرجَعوا»؛ فالصيغة اليونانية تحتمل معنى «ترجعوا» أو «تُرجَعوا».'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «مثل الأطفال» أو «مثل الأولاد». وقد يكون في العبارة صدى للطفل الذي أقامه يسوع بينهم في السياق السابق مباشرة.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «فلن تدخلوا قطعًا». تستعمل اليونانية نفيًا مشددًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: الحق
  rationale: تؤدي قوة صيغة الاستهلال المهيبة والمؤكِّدة في عربية واضحة ومألوفة، بدل نقل اللفظة صوتيًا في سياق الكلام.
- source_word: στραφῆτε
  choice: ترجعوا
  rationale: تنقل معنى التحول أو الرجوع الحاسم مع إبقاء احتمال الصيغة الوسطى أو المبنية للمجهول مذكورًا في الحاشية، من غير إدخال مصطلح لاهوتي تقني.
- source_word: γένησθε
  choice: تصيروا
  rationale: تعبر طبيعيًا عن الانتقال إلى حال جديدة، وتحافظ على اقتران الفعل بفعل الرجوع.
- source_word: ὡς τὰ παιδία
  choice: مثل الأطفال
  rationale: صياغة عربية طبيعية تفيد الأطفال بوصفهم فئة معروفة، وتبقي صفات التشبيه غير محددة كما في اليونانية.
- source_word: οὐ μὴ εἰσέλθητε
  choice: فلن تدخلوا ... أبدًا
  rationale: تنقل النفي اليوناني المشدد بوضوح وقوة في العربية المعاصرة.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تحافظ على تعبير متى المميز وعلى صيغة الجمع في «السماوات»، وهي عبارة عربية كتابية واضحة ومستقرة.
theological_decisions:
- issue: دلالة التحول في στραφῆτε
  choice: ترجعوا
  alternative: تُرجَعوا؛ تهتدوا
  rationale: «ترجعوا» تحفظ معنى إعادة التوجه الحاسمة من غير حصر العبارة في مصطلح عقائدي تقني، بينما تُذكر إمكانية فهم المبني للمجهول في الحاشية.
- issue: وجه الشبه بالأطفال
  choice: مثل الأطفال
  alternative: مثل الأولاد؛ كالأطفال الصغار
  rationale: لا تحدد الآية هنا أن المقصود هو البراءة أو التواضع أو غيرهما، لذلك تُترك جهة التشبيه مفتوحة ولا تُضاف صفة «صغار» غير مصرح بها.
- issue: قوة النفي في οὐ μή
  choice: فلن تدخلوا ... أبدًا
  alternative: فلن تدخلوا قطعًا
  rationale: الصياغة المختارة تحافظ على التحذير القاطع الذي تدل عليه أداة النفي اليونانية المشددة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «الحق أقول لكم» و«ملكوت السماوات» لرسوخهما ووضوحهما، مع تجنب الألفاظ المذهبية التقنية والمحافظة على غموض النص في جهة التشبه بالأطفال وفي فاعلية الرجوع.
