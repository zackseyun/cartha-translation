id: MAT.18.12
reference: Matthew 18:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: ar
  text: ماذا تظنون؟ إن كان لرجل مئة خروف، وضلَّ واحد منها[a]، أفلا يترك التسعة والتسعين على الجبال[b]، ويذهب ليبحث عن الخروف الضالّ[c]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شرد». يمكن أن يعني الفعل اليوناني «ضلَّ» أو «شرد»، وقد يعني في بعض السياقات «أُضلَّ».
    reason: lexical_alternative
  - marker: b
    text: أو «على التلال» أو «في المرتفعات».
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «الذي يضلّ»؛ والترجمة التقليدية: «المفقود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: ماذا تظنون؟
  rationale: سؤال عربي طبيعي ومباشر يدعو المخاطَبين إلى إبداء حكمهم، ويحفظ صيغة الجمع في ὑμῖν.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: إن كان لرجل
  rationale: ينقل تركيب الملكية أو الظرف الذي يفيده فعل γίνομαι مع المجرور الدال على صاحب الشيء، مع إبقاء المفرد المذكر العام في النص اليوناني.
- source_word: ἑκατὸν πρόβατα
  choice: مئة خروف
  rationale: تعبير عربي واضح ومباشر عن العدد والاسم الجمعي في السياق الرعوي.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: وضلَّ واحد منها
  rationale: يحفظ معنى الانحراف أو الشرود من غير أن يحدد فاعلًا خارجيًا أضلّه، وهو ما تتركه الصيغة اليونانية محتملًا.
- source_word: οὐχὶ ἀφήσει
  choice: أفلا يترك
  rationale: صيغة استفهام إنكاري تتوقع جوابًا بالإيجاب، و«يترك» أنسب من لفظ أقوى مثل «يهجر» لأن الترك هنا مؤقت.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: التسعة والتسعين
  rationale: الصياغة العربية المعيارية للعدد المقصود.
- source_word: ἐπὶ τὰ ὄρη
  choice: على الجبال
  rationale: يحفظ الصورة الطبوغرافية المباشرة في ὄρη، مع التنبيه في الحاشية إلى إمكان فهمها تلالًا أو مرتفعات.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: ويذهب ليبحث عن
  rationale: يفك تركيب اسم الفاعل مع الفعل الرئيس إلى غاية واضحة وطبيعية في العربية؛ و«يبحث عن» أوضح في الاستعمال الحديث من «يطلب» التي قد تُفهم بمعنى يسأل أو يلتمس.
- source_word: τὸ πλανώμενον
  choice: الخروف الضالّ
  rationale: صياغة عربية طبيعية تعيد ذكر الخروف وتربط اللفظ بالفعل السابق، مع بيان الصيغة الحرفية المستمرة في الحاشية وعدم تحويلها إلى «المفقود».
theological_decisions:
- issue: المفرد المذكر العام في ἀνθρώπῳ
  choice: لرجل
  alternative: لشخص
  rationale: يحفظ الصورة النحوية المذكرة والمفردة في الأصل من غير أن ينفي أن المثل ذو تطبيق عام.
- issue: دلالة πλανάω في صورة الخروف
  choice: ضلَّ / الخروف الضالّ
  alternative: شرد / أُضلَّ / الخروف المفقود
  rationale: يحفظ معنى الضلال والشرود من غير الجزم بأن سبب الضلال فاعل خارجي، ومن غير استبداله بمفردة «الفقد» غير الموجودة في الأصل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم الاستفهام الإنكاري «أفلا» لإبقاء توقع الجواب بالإيجاب، وجاءت العبارة الرعوية طبيعية من غير إزالة التكرار الدلالي في جذر الضلال.
