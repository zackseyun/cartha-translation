base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: ar
  text: فأشفق سيّدُ ذلك العبد[a] عليه، فأطلقه وأسقط عنه القرض[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: مملوكه؛ فاللفظ اليوناني يدل هنا على العبد، لا على مجرد خادم مأجور.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: الدَّين؛ واللفظ اليوناني يعني، على وجه أخص، قرضًا، أي ما أُقرض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: فتحنَّن
  rationale: ينقل معنى الشفقة العميقة في صياغة عربية طبيعية وموجزة، ويحافظ على كونها الدافع إلى الفعلين التاليين.
- source_word: δὲ
  choice: فـ
  rationale: تفيد الفاء هنا تعاقب الحدث ونتيجته في سياق السرد، من غير إثقال العبارة بأداة استدراك لا يقتضيها السياق العربي.
- source_word: κύριος
  choice: سيد
  rationale: المقصود في المستوى السردي سيد العبد البشري في المثل؛ ولفظ «سيد» طبيعي في هذه العلاقة ولا يحوّل الكلمة إلى لقب إلهي مباشر.
- source_word: δούλου
  choice: العبد
  rationale: يحافظ على دلالة δοῦλος الاجتماعية، أي الخضوع والملكية، وهي دلالة بارزة في مثل الدين والسلطة.
- source_word: ἀπέλυσεν αὐτόν
  choice: فأطلقه
  rationale: يعبر عن تركه حرًّا من الاحتجاز أو المطالبة الفورية، من غير تحديد زائد لطبيعة الإطلاق.
- source_word: τὸ δάνειον
  choice: القرض
  rationale: δάνειον أدق من لفظ «الدين»، إذ يدل على ما أُقرض؛ وتوضح العبارة مع «أسقط عنه» أن الالتزام المالي قد أُلغي.
- source_word: ἀφῆκεν αὐτῷ
  choice: أسقط عنه
  rationale: صياغة عربية واضحة لإبراء الشخص من الالتزام المالي؛ وهي تحافظ على معنى الإعفاء أو المحو في ἀφίημι من غير إيهام بأن القرض نفسه كائن يُغفر له.
theological_decisions:
- issue: إمكان فهم κύριος بوصفه لقبًا إلهيًا
  choice: سيد، في إشارة مباشرة إلى سيد العبد داخل المثل
  alternative: الرب
  rationale: المرجع النحوي والسردي هنا إنسان في المثل. وتجنب «الرب» يمنع فرض تطابق مباشر مع الله في نص الآية، مع إبقاء الدلالة اللاهوتية الأوسع للمثل مفتوحة.
- issue: الدلالة الاجتماعية لكلمة δοῦλος
  choice: العبد
  alternative: الخادم
  rationale: علاقة الملكية والسلطة غير المتكافئة مهمة في هذا السياق، و«الخادم» يخفف هذه الدلالة.
- issue: الصلة بين الإعفاء المالي ومفهوم الغفران
  choice: أسقط عنه القرض
  alternative: غفر له القرض
  rationale: السياق المباشر مالي، ولذلك اختير تعبير عربي صريح للإبراء من الدين، من غير محو الصدى الدلالي الأوسع للفعل اليوناني أو تحويله قسرًا إلى صيغة لاهوتية مباشرة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «فتحنَّن» لنقل الشفقة العميقة بإيجاز، و«أسقط عنه القرض» بوصفها صياغة مالية طبيعية. وُضعت علامتا الحاشيتين بعد اللفظين اللذين تشرحانهما مباشرة.
