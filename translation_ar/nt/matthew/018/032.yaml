  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: ar
  text: 'ثم استدعاه سيده وقال له: «أيها العبد الشرير[b]، عفوت لك عن ذلك الدين كله[a] لأنك توسلت إليّ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أسقطت عنك ذلك الدين كله». يمكن للفعل اليوناني أن يدل على إعفاء شخص من دينه أو إسقاط الدين، كما يدل على الصفح والغفران.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الخادم الشرير». يمكن للكلمة اليونانية δοῦλος أن تعني عبدًا أو خادمًا؛ واختيرت هنا «العبد» لأن علاقة العبودية بالسيد أساسية في المثل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: أداة ربط زمنية طبيعية تتابع أحداث المثل.
- source_word: προσκαλεσάμενος
  choice: استدعاه
  rationale: تفيد أن السيد دعاه إلى حضرته بسلطان، و«استدعاه» واضحة وطبيعية في السياق.
- source_word: ὁ κύριος αὐτοῦ
  choice: سيده
  rationale: المقصود سيد العبد في إطار المثل، لا لقبًا إلهيًا مستقلًا.
- source_word: λέγει αὐτῷ
  choice: وقال له
  rationale: المضارع اليوناني مضارع تاريخي، ونقله بالماضي يلائم السرد العربي من غير تغيير المعنى.
- source_word: Δοῦλε πονηρέ
  choice: أيها العبد الشرير
  rationale: «العبد» يحفظ علاقة التبعية والملكية البارزة في المثل، و«الشرير» ينقل الإدانة الأخلاقية في πονηρός.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: ذلك الدين كله
  rationale: صياغة عربية موجزة تنقل شمول الدين المشار إليه.
- source_word: ἀφῆκά σοι
  choice: عفوت لك عن
  rationale: يحفظ قدر الإمكان التداخل بين الصفح وإسقاط الدين، بدل حصر الفعل في معنى تجاري محض.
- source_word: ἐπεὶ
  choice: لأن
  rationale: تبيّن سبب تصرف السيد بوضوح.
- source_word: παρεκάλεσάς με
  choice: توسلت إليّ
  rationale: تنقل معنى الالتماس الملح في هذا السياق من غير مبالغة.
theological_decisions:
- issue: ترجمة δοῦλος في علاقة السيد بالعبد داخل المثل
  choice: العبد
  alternative: الخادم
  rationale: الوضع التابع والمملوك عنصر بارز في قوة المثل؛ و«العبد» أصرح في نقله من «الخادم»، مع إثبات البديل في الحاشية.
- issue: ترجمة ἀφίημι في سياق الدين
  choice: عفوت لك عن ذلك الدين
  alternative: أسقطت عنك ذلك الدين
  rationale: السياق المباشر هو إسقاط دين، لكن الفعل نفسه يحمل صدى الصفح والغفران في إنجيل متى؛ لذلك اختير تعبير يبقي التداخل الدلالي، مع توضيح المعنى المالي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة غير متكلفة. استُعمل «سيده» و«العبد» لإظهار البنية الاجتماعية للمثل، مع تجنب تحويل «السيد» هنا إلى لقب لاهوتي. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما، ولذلك تظهر [b] قبل [a] بحسب موضعهما في الجملة.
