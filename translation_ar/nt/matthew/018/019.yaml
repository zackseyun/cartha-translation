  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: ar
  text: 'ومرة أخرى أقول لكم: الحق أقول لكم، إن اتفق اثنان منكم على الأرض بشأن أيّ أمر يطلبانه[b]، فسيتحقق لهما ذلك من عند أبي الذي في السماوات[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: يأتي هذا القول عقب تعليم يسوع عن معالجة خطيئة أحد أفراد الجماعة وسلطتها في الربط والحل (متى 18:15–18)، مع أن ألفاظ الآية نفسها تتحدث على نحو واسع عن طلب يتفق عليه اثنان.
    reason: cross_reference
  - marker: c
    text: 'حرفيًا: «في السماوات»؛ وقد أُبقيت صيغة الجمع هنا كما في اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: أيضًا
  rationale: تفيد إضافة قول مؤكَّد إلى التعليم السابق، وهي أوضح في سياق الخطاب من ترجمة حرفية قد توحي بتكرار القول نفسه.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صياغة عربية طبيعية مهيبة تحفظ قوة صيغة التوكيد التي يستعملها يسوع من غير حاجة إلى نقل «آمين» صوتيًا.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: إن اتفق اثنان منكم
  rationale: تنقل معنى الاتفاق في συμφωνέω، وتحفظ دلالة ἐξ ὑμῶν على أن الاثنين من بين المخاطَبين.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: مقابل عربي مباشر وطبيعي، ويحفظ المقابلة المكانية مع الآب في السماوات.
- source_word: περὶ παντὸς πράγματος
  choice: بشأن أيّ أمر
  rationale: يحفظ اتساع πρᾶγμα، الذي يمكن أن يدل على أمر أو شأن، من غير تضييق مدلوله.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: يطلبانه
  rationale: صيغة المثنى تربط الطلب بالاثنين المذكورين، وتنقل معنى αἰτέω دون أن تضيف صراحة قيدًا تفسيريًا مثل «في الصلاة».
- source_word: γενήσεται αὐτοῖς
  choice: فسيكون لهما
  rationale: صياغة مقتضبة تحفظ اتساع γίνομαι ولا تحوّله صراحة إلى فعل إنجاز أو إعطاء، مع إبقاء المعنى مفهومًا من جملة المصدر التالية.
- source_word: παρὰ τοῦ πατρός μου
  choice: من عند أبي
  rationale: تحفظ دلالة παρά مع المضاف إليه على المصدر، وتتجنب حسمها حصريًا بوصفها دلالة وكالة، مع الإقرار بأن الآب هو مصدر تحقق الأمر.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: الذي في السماوات
  rationale: تحفظ صيغة الجمع اليونانية οὐρανοῖς، وهي سليمة ومألوفة في العربية الكتابية.
theological_decisions:
- issue: نطاق الوعد في سياقه
  choice: إبقاء العبارة عامة كما وردت، مع تنبيه سياقي في الحاشية إلى تعليم الجماعة والتأديب في متى 18:15–18.
  alternative: قصر الوعد صراحة على قرارات التأديب الكنسي، أو عرضه بوصفه ضمانًا غير مشروط لكل طلب متفق عليه.
  rationale: السياق السابق يتعلق بسلطة الجماعة والتأديب، لكن ألفاظ الآية نفسها واسعة وتتحدث عن اتفاق اثنين وطلبهما. لذلك لا تُضاف إلى المتن قيود عقائدية غير مصرَّح بها، ولا يُفصل الوعد عن سياقه.
- issue: طبيعة تحقق الطلب
  choice: «فسيكون لهما من عند أبي»
  alternative: «فسيحققه لهما أبي» أو «سيُفعل لهما من أبي».
  rationale: يحفظ الاختيار مرونة γίνομαι وπαρά بين الحدوث أو التحقق والمصدر أو الفاعلية، بدل حسم العلاقة النحوية واللاهوتية بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة. استُخدم المثنى حيث يقتضيه النص، وتُجنبت المصطلحات الطائفية والزيادات التفسيرية. أبقيت «السماوات» جمعًا حفظًا لصيغة الأصل، واستُعمل «من عند أبي» لصون شيء من مرونة علاقة المصدر والفاعلية في العبارة اليونانية.
