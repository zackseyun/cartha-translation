  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: ar
  text: لِأَنَّ ابْنَ الإِنْسَانِ جَاءَ لِيُخَلِّصَ مَا قَدْ ضَاعَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات القبطية المبكرة؛ لكنها موجودة في مخطوطة بيزا من القرن الخامس، وفي تقليد أغلبية المخطوطات البيزنطية، وفي الفولغاتا اللاتينية. ويُرجَّح أن نُسّاخًا متأخرين أضافوها لموافقة لوقا 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: σῴζω
  choice: يُخَلِّصَ
  rationale: ينقل المعنى المألوف للفعل في سياق الخلاص، أي الإنقاذ من الهلاك، ويحافظ على الصلة اللفظية واللاهوتية الطبيعية في العربية.
- source_word: τὸ ἀπολωλός
  choice: مَا قَدْ ضَاعَ
  rationale: اسم فاعل تام مبني على المحايد المفرد؛ وهذه الصياغة تحفظ عموم التعبير اليوناني وحالته الناتجة، من غير أن تحصر المرجع صراحة في شخص واحد أو جماعة.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابْنَ الإِنْسَانِ
  rationale: اللقب الاصطلاحي الطبيعي المقابل للتعبير اليوناني، مع الحفاظ على صيغته التعريفية ودلالته المسيانية المحتملة.
theological_decisions:
- issue: مرجع التعبير المحايد τὸ ἀπολωλός
  choice: مَا قَدْ ضَاعَ
  alternative: الضالين
  rationale: تجنبت الصياغة الشخصية الجمعية لأنها تحسم جنس المرجع وعدده أكثر مما يتيحه النص اليوناني، مع بقاء المعنى الخلاصي واضحًا من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «لأن» لـ γάρ، وصيغ الفعل بعد لام التعليل بالمضارع المنصوب. وُضع رمز الحاشية في نهاية الآية لأنه يخص الآية كلها من جهة ثبوتها النصي.
