  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: «ويل» لـ οὐαί، و«للعالَم بسبب العثرات» لمعنى οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων، و«فلا بدّ أن تأتي العثرات» للضرورة غير المفسَّرة في ἀνάγκη γὰρ ἐλθεῖν، مع حفظ الاستدراك في «ولكن» والتقابل بين جمع «العثرات» ومفرد «العثرة». وعبارة «الإنسان الذي تأتي العثرة عن طريقه» تؤدي δι’ οὗ من غير إضافة تفسير سببي أو لاهوتي.'
