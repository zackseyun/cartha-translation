id: MAT.18.7
reference: Matthew 18:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: ar
  text: ويلٌ للعالَم بسبب العثرات[a]! فلا بدّ أن تأتي العثرات، ولكن ويلٌ للإنسان[b] الذي تأتي العثرة عن طريقه!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أسباب السقوط» أو «ما يوقع في الخطيئة» أو «الفخاخ». تشير الكلمة اليونانية إلى ما يجعل الإنسان يعثر، سواء أكان إغراءً أم إساءةً أم سببًا للسقوط في الخطيئة.'
    reason: lexical_alternative
  - marker: b
    text: جاءت العبارة في اليونانية بصيغة المفرد المذكر، وهي هنا تمثّل أي فرد تأتي العثرة عن طريقه.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: ويلٌ
  rationale: يحافظ على قوة التحذير والإدانة النبوية، ويُكرَّر في الموضعين صونًا للتوازي البلاغي في اليونانية.
- source_word: κόσμῳ
  choice: للعالَم
  rationale: ينقل الإشارة الواسعة إلى العالم البشري، من غير حصرها في الخليقة المادية أو في نظام اجتماعي بعينه.
- source_word: ἀπὸ
  choice: بسبب
  rationale: يؤدي هنا معنى السبب أو المنشأ على نحو عربي طبيعي.
- source_word: σκάνδαλα / σκάνδαλον
  choice: العثرات / العثرة
  rationale: يحفظ صورة ما يجعل المرء يعثر، مع إبقاء المعنى الواسع الذي قد يشمل الإغراء أو الإيقاع في الخطيئة أو التسبب في السقوط، ويحافظ على الفرق بين الجمع والمفرد.
- source_word: ἀνάγκη
  choice: لا بدّ
  rationale: يعبّر بوضوح عن الضرورة أو الحتمية من غير تحديد أساسها، أهو تدبير إلهي أم واقع ناشئ عن حال العالم.
- source_word: γάρ
  choice: فـ
  rationale: تربط الجملة التعليلية بما قبلها بإيجاز وطبيعية في العربية.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: تأتي ... تأتي
  rationale: يحافظ على تكرار فعل المجيء في الأصل بدل تحويله إلى تعبير أكثر تجريدًا مثل «تحدث».
- source_word: πλήν
  choice: ولكن
  rationale: يبيّن الانتقال الاستدراكي القوي من حتمية مجيء العثرات إلى مسؤولية الفرد الذي تأتي عن طريقه.
- source_word: ἀνθρώπῳ
  choice: للإنسان
  rationale: «الإنسان» مفرد مذكر من جهة الصيغة العربية، ويصلح هنا للدلالة التمثيلية على أي فرد، مع بقاء التعبير طبيعيًا وغير مقصور دلاليًا على رجل بالغ.
- source_word: δι’ οὗ
  choice: الذي ... عن طريقه
  rationale: ينقل معنى الوساطة أو الوكالة الشخصية في العبارة اليونانية بوضوح، من غير أن يخفف مسؤولية الفاعل.
theological_decisions:
- issue: طبيعة الضرورة في ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: «فلا بدّ أن تأتي العثرات» من غير بيان مصدر هذه الضرورة.
  alternative: «فلا بدّ بحسب تدبير الله أن تأتي العثرات» أو «من المحتم عمليًا أن تحدث العثرات».
  rationale: الأصل يقرر الضرورة ولا يشرح أساسها؛ لذلك تُحفظ الحدة اللاهوتية من غير إسناد مباشر إلى قضاء إلهي أو اختزالها في مجرد احتمال عملي.
- issue: القوة التمثيلية للمفرد ἀνθρώπῳ
  choice: استعمال «الإنسان» في المتن بوصفه مفردًا تمثيليًا.
  alternative: «الشخص» أو «كل من».
  rationale: يحافظ الاختيار على صيغة المفرد وعلى الطابع الشخصي للتحذير، فيما توضّح الحاشية أن الحكم يتناول أي فرد يكون سببًا للعثرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «العثرات» للمحافظة على الصورة المجازية، و«لا بدّ» للتعبير الطبيعي عن الضرورة، مع إبقاء التكرار والتقابل البلاغي في الآية.
