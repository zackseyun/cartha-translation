  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: ar
  text: فغضب سيده وسلَّمه إلى المعذِّبين، حتى يوفي كل ما عليه.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ربه». الكلمة اليونانية هي «كيريوس»، لكنها تشير هنا، داخل المثل، إلى سيد العبد؛ ولذلك استُعملت «سيده» في المتن.
    reason: alternative_reading
  - marker: b
    text: أي الذين يوقعون العذاب؛ ويمكن ترجمتها أيضًا «المنكِّلين به»، وبمعنى أضعف «السجّانين». لكن اللفظ اليوناني أقوى من مجرد حراس عاديين.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: فغضب
  rationale: اسم فاعل ماضٍ يؤدي وظيفة ظرفية قبل الفعل الرئيس؛ وصيغة «فغضب» عربية طبيعية تنقل الحالة الانفعالية وصلتها بما أعقبها.
- source_word: κύριος
  choice: سيده
  rationale: يشير في سياق المثل إلى صاحب السلطان على العبد، ولذلك تلائم «سيده» العلاقة السردية أكثر من اللقب الإلهي «الرب».[a]
- source_word: παρέδωκεν
  choice: سلَّمه إلى
  rationale: تنقل معنى دفعه إلى سلطة آخرين أو عهد به إليهم، وتحافظ على الطابع القضائي في السياق.
- source_word: βασανισταῖς
  choice: المعذِّبين
  rationale: يدل اللفظ على من يوقعون العذاب، لا على حراس سجن عاديين فحسب؛ و«المعذِّبين» تحفظ شدة التعبير من غير زيادة تفسيرية.[b]
- source_word: ἕως οὗ
  choice: حتى
  rationale: أداة غاية زمنية واضحة وطبيعية في العربية.
- source_word: ἀποδῷ
  choice: يوفي
  rationale: الفعل في هذا السياق يعني أداء ما على المرء أو سداده، وصيغة المضارع بعد «حتى» تنقل الغاية المرتقبة.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: كل ما كان عليه
  rationale: تعبير عربي طبيعي يحافظ على عموم العبارة اليونانية ولا يقصرها صراحة على لفظ «الدَّين».
theological_decisions:
- issue: هل يُترجم κύριος باللقب «الرب»؟
  choice: سيده
  alternative: الرب
  rationale: المرجع المباشر داخل المثل هو سيد العبد البشري. تحافظ «سيده» على المعنى السردي من غير أن تفرض في النص الرئيس تطابقًا صريحًا مع لقب إلهي، مع إبقاء البديل في الحاشية.
- issue: شدة معنى βασανισταῖς في سياق العقوبة
  choice: المعذِّبين
  alternative: السجانين أو المعذِّبين بالتعذيب
  rationale: يحمل اللفظ معنى إيقاع العذاب، ولذلك لا ينبغي تخفيفه إلى مجرد الحراسة. وفي الوقت نفسه، «المعذِّبين» أوسع قليلًا من «الجلادين» وتحفظ توتر الصورة من غير حسم أسلوب العذاب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت جملة فعلية متتابعة تلائم السرد، وحُفظت شدة العقوبة وعموم المقدار الواجب من غير توسيع عقائدي.
