  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ar
  text: 'في ذلك الوقت، جاء التلاميذ إلى يسوع وقالوا: «مَن إذًا أكبرُ في ملكوت السماوات؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: في ذلك الوقت
  rationale: ينقل التعبير الزمني اليوناني بعبارة عربية طبيعية واضحة؛ فالمراد هنا ظرف وقوع الحدث، لا التشديد على ساعة زمنية محددة.
- source_word: προσῆλθον
  choice: جاء ... إلى
  rationale: صياغة عربية مألوفة تفيد الدنو والمجيء نحو يسوع من غير تكلف.
- source_word: ἄρα
  choice: إذًا
  rationale: يحفظ الدلالة الاستنتاجية أو الانتقالية للأداة في سؤال التلاميذ.
- source_word: μείζων
  choice: أكبرُ
  rationale: يحفظ صيغة المقارنة في الأصل بدل تحويلها صراحةً إلى صيغة تفيد «الأعظم» وحده، مع إبقاء مدى المقارنة مفهومًا من السياق.
- source_word: βασιλείᾳ τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تعبير عربي واضح ومستقر ينقل مفهوم الحكم أو المُلك الإلهي ويحافظ على الصيغة المتّبعة في إنجيل متى.
theological_decisions:
- issue: هل يُصاغ μείζων بصيغة المقارنة أم بصيغة التفضيل المطلقة؟
  choice: مَن إذًا أكبرُ في ملكوت السماوات؟
  alternative: مَن إذًا هو الأعظم في ملكوت السماوات؟
  rationale: النص اليوناني يستعمل صيغة المقارنة μείζων. لذلك حُفظت المقارنة في العربية ولم تُحسم دلالتها سياقيًا إلى «الأعظم»، مع بقاء السؤال طبيعيًا ومفهومًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت علامات الاقتباس العربية، وحُفظ إيجاز السؤال وقوته من دون إضافة تفسيرية.
