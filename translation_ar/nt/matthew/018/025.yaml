id: MAT.18.25
reference: Matthew 18:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: ar
  text: ولأنه لم يكن يملك ما يسدّد به، أمر سيده[a] أن يُباع هو وزوجته وأولاده وكل ما يملكه[b]، وأن يُسدَّد الدين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي سيد العبد في أحداث المثل. ويمكن أن تعني الكلمة اليونانية «الرب» أو «السيد» بحسب السياق.
    reason: lexical_alternative
  - marker: b
    text: أي إن الأمر قضى ببيع الرجل وأسرته وممتلكاته لتحصيل مبلغ يُسدَّد منه الدين.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: ولأنه لم يكن يملك ما يسدّد به
  rationale: ينقل التركيب المطلق في حالة المضاف إليه بوصفه سببًا، ويحافظ على دلالة عدم امتلاك وسيلة السداد دون تحويلها إلى مجرد عجز عام.
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: يدل الفعل على إصدار أمر ذي سلطة، و«أمر» طبيعي ومباشر في العربية.
- source_word: ὁ κύριος
  choice: سيده
  rationale: السياق سياق عبد وصاحب سلطة بشرية داخل المثل؛ والإضافة مفهومة من العلاقة، كما تمنع التباس اللفظ بلقب إلهي مباشر.
- source_word: πραθῆναι
  choice: أن يُباع
  rationale: يحفظ صيغة المبني للمجهول ومعنى البيع الفعلي بسبب الدين.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: وزوجته وأولاده
  rationale: الضمير المضاف طبيعي في العربية، والسياق يحدد أنهم أسرة المدين.
- source_word: πάντα ὅσα ἔχει
  choice: كل ما يملكه
  rationale: صياغة عربية واضحة وقريبة من شمول العبارة اليونانية لجميع ممتلكاته.
- source_word: καὶ ἀποδοθῆναι
  choice: وأن يُسدَّد الدين
  rationale: يفيد الفعل المبني للمجهول أداء المستحق؛ وذكر «الدين» يوضح المفعول المفهوم من سياق المثل من غير تغيير المقصود.
theological_decisions:
- issue: دلالة κύριος في سياق المثل
  choice: سيده
  alternative: الرب
  rationale: يشير اللفظ هنا داخل أحداث المثل إلى السيد البشري الذي يملك سلطة على العبد، لا إلى استعمال مباشر للقب الإلهي؛ لذلك تحافظ «سيده» على العلاقة الاجتماعية المقصودة وتجنب حسم الهوية المجازية داخل صياغة الحدث.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُخدم «يسدّد» الملائم لسياق الديون، وحُفظ تتابع عناصر أمر البيع كما في اليونانية، مع إبقاء العلامتين [a] و[b] في المتن.
