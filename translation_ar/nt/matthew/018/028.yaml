  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: ar
  text: 'لكن ذلك العبد، لما خرج، وجد واحدًا من رفقائه العبيد كان مدينًا له بمئة دينار[a]. فأمسك به وأخذ يخنقه قائلًا: «أدِّ إليَّ ما عليك، أيًّا كان[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدينار يعادل عادةً أجر يوم عمل لعامل أو جندي.
    reason: cultural_note
  - marker: b
    text: 'حرفيًا: «أدِّ إليَّ إن كان عليك شيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: العبد
  rationale: ينقل وضع العبودية في سياق المثل، حيث تبرز الملكية وسلطة الإكراه، بدلًا من تلطيفه إلى «الخادم».
- source_word: ἐξελθὼν δὲ
  choice: لكن ذلك العبد، لما خرج
  rationale: صياغة عربية طبيعية تحفظ الانتقال المقابل الذي تفيده δέ والعلاقة الزمنية التي يحملها اسم الفاعل اليوناني.
- source_word: συνδούλων
  choice: رفقائه العبيد
  rationale: يحفظ معنى المشاركة في الوضع نفسه الذي تفيده السابقة σύν، ويتسق مع ترجمة δοῦλος بـ«عبد».
- source_word: ὤφειλεν
  choice: كان مدينًا له
  rationale: تعبير عربي واضح وطبيعي عن الدين المالي المستمر.
- source_word: ἑκατὸν δηνάρια
  choice: مئة دينار
  rationale: يحفظ اسم العملة التاريخية، مع شرح قيمتها التقريبية ثقافيًا في الحاشية.
- source_word: κρατήσας
  choice: فأمسك به
  rationale: ينقل الفعل الجسدي القسري بإيجاز ومن دون مبالغة تفسيرية.
- source_word: ἔπνιγεν
  choice: وأخذ يخنقه
  rationale: ينقل الاستمرار أو بدء الفعل الذي يدل عليه الماضي الناقص اليوناني.
- source_word: Ἀπόδος
  choice: أدِّ إليَّ
  rationale: أمر حاد مناسب لسياق المطالبة بسداد الدين.
- source_word: εἴ τι ὀφείλεις
  choice: أيَّ شيء عليك
  rationale: يحفظ الصيغة غير المحددة في اليونانية بدل تحويلها إلى دين محدد مرجعيًا، مع إثبات الصياغة الحرفية البديلة في الحاشية.
theological_decisions:
- issue: ترجمة δοῦλος في السرد المثلي
  choice: عبد / رفقاؤه العبيد
  alternative: خادم / رفقاؤه الخدم
  rationale: وضع العبودية وسلطة السيد والإكراه عناصر ظاهرة في المثل؛ لذلك تحافظ «عبد» على الواقع الاجتماعي المقصود من غير إدخال تمييز طائفي.
- issue: دلالة εἴ τι ὀφείλεις
  choice: أيَّ شيء عليك
  alternative: ما عليك
  rationale: تُبقي العبارة غير محددة كما في اليونانية، ولا تحوّلها إلى إحالة محددة على مبلغ معلوم، مع إبقاء غرابة «إن كان عليك شيء» في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة؛ استُخدمت «عبد» و«رفقائه العبيد» لإبراز الوضع الاجتماعي في المثل، وصيغ الفعلان «أمسك» و«أخذ يخنق» بلغة مباشرة تحفظ عنف المشهد. أُبقي «الدينار» مصطلحًا تاريخيًا مع حاشية تفسيرية.
