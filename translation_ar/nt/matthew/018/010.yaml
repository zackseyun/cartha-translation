id: MAT.18.10
reference: Matthew 18:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: ar
  text: احذروا أن تحتقروا واحدًا من هؤلاء الصغار[a]، فإني أقول لكم إن ملائكتهم في السماوات يرون دائمًا وجه أبي الذي في السماوات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أن تزدَروا واحدًا من هؤلاء الصغار» أو «أن تنظروا باستخفاف إلى واحد منهم». ولا تحصر عبارة «هؤلاء الصغار» المقصود في الأطفال وحدهم بالضرورة.'
    reason: lexical_alternative
  - marker: b
    text: لا تحدد عبارة «ملائكتهم» وحدها ما إذا كان لكل واحد منهم ملاك حارس بعينه؛ فقد تشير إلى ملائكة مرتبطين بهم أو ممثلين لهم. وجاءت «السماوات» بالجمع وفق الأصل اليوناني.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: احذروا أن تحتقروا
  rationale: صيغة تحذير ونهي؛ «احذروا أن» تنقل معنى الانتباه الوقائي، و«تحتقروا» تحفظ دلالة معاملة الآخر بازدراء أو اعتباره قليل الشأن.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: واحدًا من هؤلاء الصغار
  rationale: تحفظ العبارة اتساع مدلول μικρῶν، فلا تحصره في الأطفال وحدهم ولا تلغي صلته بالسياق الذي يتناول الطفل والمتواضعين.
- source_word: λέγω γὰρ ὑμῖν
  choice: فإني أقول لكم
  rationale: صياغة عربية طبيعية تحفظ القوة التفسيرية لـ γάρ وصيغة القول المباشر.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: ملائكتهم
  rationale: تنقل علاقة الإضافة كما هي من غير أن تحسم طبيعة ارتباط الملائكة بهؤلاء الصغار.
- source_word: ἐν οὐρανοῖς
  choice: في السماوات
  rationale: تحافظ على صيغة الجمع اليونانية، وهي تعبير عربي كتابي واضح وطبيعي.
- source_word: διὰ παντὸς
  choice: دائمًا
  rationale: تنقل معنى الاستمرار أو الدوام في هذا التعبير الاصطلاحي بلفظ عربي موجز وواضح.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: يرون ... وجه
  rationale: تحفظ صورة رؤية الوجه بما توحي به من الحضور المباشر والمثول أمام الله دون شرح تفسيري داخل النص.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: أبي الذي في السماوات
  rationale: تحفظ لغة يسوع البنوية والعبارة الوصفية المكانية من غير إضافة «السماوي» أو حذف التكرار الموجود في الأصل.
theological_decisions:
- issue: دلالة «ملائكتهم»
  choice: إبقاء العبارة «ملائكتهم» بلا تحديد لعقيدة ملائكة حارسين أفراد.
  alternative: تفسيرها صراحة بملائكة حارسين مكلَّفين بكل طفل أو مؤمن، أو بملائكة يمثلون هؤلاء الصغار أو يخدمونهم عمومًا.
  rationale: النص يثبت صلة ما بين الملائكة وهؤلاء الصغار، لكنه لا يشرح طبيعة هذه الصلة ولا يحسم بمفرده التفاصيل العقائدية المتعلقة بالملائكة الحارسين.
- issue: هوية «هؤلاء الصغار»
  choice: استخدام «هؤلاء الصغار» مع إبقاء المرجع واسعًا.
  alternative: حصر العبارة في «هؤلاء الأطفال» أو تفسيرها صراحة بأنها تعني المؤمنين المتواضعين وحدهم.
  rationale: السياق يتصل بطفل موضوع في الوسط، لكن التعبير يمكن أن يتجاوز العمر إلى الصغر في المنزلة أو إلى التلاميذ المتواضعين؛ لذلك لا ينبغي حسم المرجع داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. اختير «احذروا أن» للتحذير المباشر، وأُبقيت «السماوات» بالجمع اتباعًا للنص اليوناني. وُضعت علامتا الحاشية في المتن، مع جمع الملاحظات المتصلة لتجنب إثقال آية قصيرة بكثرة العلامات.
