  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: ar
  text: لِذلِكَ شُبِّهَ مَلَكوتُ السَّماواتِ بِمَلِكٍ أَرادَ أَنْ يُحاسِبَ عَبيدَهُ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خَدَمَهُ»؛ واللفظة اليونانية تعني «العبيد»، فتبرز خضوعهم للملك ووضعهم المملوك.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لِذلِكَ
  rationale: تنقل العلاقة الاستنتاجية والسببية بما قبلها بعبارة عربية واضحة وموجزة.
- source_word: ὡμοιώθη
  choice: شُبِّهَ
  rationale: تحافظ على صيغة المبني للمجهول وعلى معنى إجراء التشبيه، من غير تحويلها إلى تقرير ساكن مثل «يشبه».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: مَلَكوتُ السَّماواتِ
  rationale: تعبير عربي كتابي راسخ، ويحفظ صيغة الجمع في الأصل اليوناني والتعبير المتّىاوي المميز.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: بِمَلِكٍ
  rationale: لفظة βασιλεῖ تخصّص ἀνθρώπῳ؛ وحذف «رجل» في العربية طبيعي ولا يفقد المعنى المقصود.
- source_word: ἠθέλησεν
  choice: أَرادَ
  rationale: تؤدي معنى الإرادة والقصد بأسلوب عربي معاصر وطبيعي.
- source_word: συνᾶραι λόγον
  choice: أَنْ يُحاسِبَ
  rationale: تعبر طبيعيًا عن اصطلاح مراجعة الحساب وتسويته، مع إبقاء معنى المساءلة المالية الذي يوضحه سياق المثل.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: عَبيدَهُ
  rationale: «عبيد» تنقل بوضوح وضع δοῦλοι الخاضع والمملوك في سياق سلطة الملك والديون، بدل أن تخففه إلى مجرد خدمة مأجورة.
theological_decisions:
- issue: ترجمة δοῦλος في سياق مَثَل ملكي مالي
  choice: عَبيدَهُ
  alternative: خَدَمَهُ
  rationale: سلطة الملك على هؤلاء الأشخاص وما يأتي من بيع العبد وأسرته يجعل وضع العبودية بارزًا في السياق. أُثبت البديل في حاشية لأن «خدم» شائع في الترجمات العربية، لكنه قد يحجب دلالة التبعية والامتلاك.
- issue: قوة صيغة ὡμοιώθη المبنية للمجهول
  choice: شُبِّهَ
  alternative: يُشبِهُ
  rationale: تحفظ الترجمة الفعل المبني للمجهول ولا تحوّل العبارة إلى وصف مباشر ثابت، مع عدم تحديد فاعل التشبيه الذي لم يذكره النص.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. استُخدم «ملكوت السماوات» بوصفه التعبير العربي الكتابي المألوف، و«يحاسب» لتجنب تركيب مالي ثقيل مع إبقاء معنى مراجعة الحسابات وتسويتها.
