base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: ar
  text: 'حينئذ تقدَّم بطرس إليه وقال: «يا رب، كم مرة سيخطئ إليَّ أخي[a]، وسأغفر له؟ إلى سبع مرات؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخي أو أختي». والنص اليوناني يقول حرفيًّا: «أخي» بصيغة المذكر المفرد، وقد يُراد به في هذا السياق على نحو أوسع أحد رفقاء التلمذة.'
    reason: بديل معجمي يبيّن احتمال الاتساع السياقي مع الحفاظ على صيغة الأصل في المتن.
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية تربط السؤال بما سبقه وتحافظ على تتابع السرد.
- source_word: προσελθὼν αὐτῷ
  choice: تقدَّم إليه
  rationale: ينقل معنى اقتراب بطرس من يسوع قبل الكلام بصياغة عربية طبيعية.
- source_word: ὁ Πέτρος εἶπεν
  choice: قال بطرس
  rationale: يحافظ على فعل القول العام في اليونانية، مع أن مضمون الكلام سؤال.
- source_word: Κύριε
  choice: يا رب
  rationale: ينقل صيغة النداء ويحفظ دلالة الاحترام وما قد تحمله من صدى لاهوتي.
- source_word: ποσάκις
  choice: كم مرة
  rationale: يعبر عن عدد مرات التكرار، وينسجم مع ذكر سبع مرات لاحقًا.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: سيخطئ إليَّ
  rationale: يحافظ على صيغة المستقبل وعلى اتجاه الإساءة نحو المتكلم؛ و«أخطأ إلى فلان» تعبير عربي فصيح مفهوم في هذا السياق.
- source_word: ὁ ἀδελφός μου
  choice: أخي
  rationale: يحافظ على المذكر المفرد الوارد صراحة في النص اليوناني، من غير توسيع تفسيري داخل المتن.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: وأغفر له
  rationale: ينقل معنى الغفران في السياق الأخلاقي ويحافظ على عطف الجملة كما في اليونانية.
- source_word: ἕως ἑπτάκις
  choice: أإلى سبع مرات؟
  rationale: يحفظ اقتراح بطرس حدًّا أقصى للغفران، مع همزة الاستفهام لسلامة العربية ووضوح السؤال.
theological_decisions:
- issue: نطاق دلالة ἀδελφός في السياق
  choice: إثبات «أخي» في المتن
  alternative: أخي أو أختي؛ أحد التلاميذ؛ أخي في الإيمان
  rationale: اللفظ اليوناني مذكر مفرد، وقد يُستعمل سياقيًّا استعمالًا أوسع لرفيق في جماعة التلاميذ. حُفظ اللفظ الصريح في المتن، وأُشير إلى الاحتمال الأوسع في الحاشية دون حسمه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «تقدَّم إليه» للسرد الطبيعي، و«سيخطئ إليَّ» للمحافظة على المستقبل واتجاه الإساءة، مع إبقاء التوتر النحوي في «وأغفر له» بدل تحويله إلى شرط تفسيري.
