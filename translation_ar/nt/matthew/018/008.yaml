id: MAT.18.8
reference: Matthew 18:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: ar
  text: وإن كانت يدك أو رجلك تُعثِرك[a]، فاقطعها وألقِها عنك. خيرٌ لك أن تدخل الحياة مبتورًا أو أعرج من أن تكون لك يدان أو رجلان فتُلقى في النار الأبدية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجعلك تخطئ». الفعل اليوناني يحمل في أصله صورة التسبب في التعثر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: تُعثِرك
  rationale: يحفظ صورة التعثر التي يحملها الفعل اليوناني، مع بقاء دلالته الأخلاقية مفهومة من السياق. ويُذكر البديل التفسيري في الحاشية.
- source_word: ἔκκοψον
  choice: فاقطعها
  rationale: ينقل صيغة الأمر القوية والمحسوسة، ويلائم كلًّا من اليد والرجل.
- source_word: βάλε ἀπὸ σοῦ
  choice: وألقِها عنك
  rationale: يعبّر بوضوح وإيجاز عن الإلقاء والإبعاد معًا.
- source_word: καλόν σοί ἐστιν
  choice: خيرٌ لك
  rationale: السياق المقارن مع ἢ يجعل المعنى «خير لك» لا مجرد «حسن لك»، وهذه صياغة عربية طبيعية رصينة.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: أن تدخل الحياة
  rationale: يحافظ على لفظ «الحياة» دون إضافة «الأبدية» غير الموجودة هنا في النص اليوناني، بينما يوضح السياق بعدها الأخروي.
- source_word: κυλλὸν
  choice: مبتورًا
  rationale: يشير في هذا السياق إلى فقد عضو بالقطع، وهو أدق من ألفاظ عامة مثل «مُعاقًا».
- source_word: χωλόν
  choice: أعرج
  rationale: المقابل العربي المباشر والطبيعي لحالة العرج المرتبطة بالرجل أو القدم.
- source_word: ἔχοντα
  choice: أن تكون لك
  rationale: ينقل معنى الملك أو الحيازة الذي يؤديه اسم الفاعل، بصياغة عربية سليمة داخل المقابلة.
- source_word: βληθῆναι
  choice: فتُلقى
  rationale: يحافظ على المبني للمجهول وعلى قوة فعل الإلقاء.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: النار الأبدية
  rationale: ينقل αἰώνιον في سياق الدينونة بالوصف العربي الواضح والمألوف «الأبدية».
theological_decisions:
- issue: هل يُترجم σκανδαλίζει ترجمة أخلاقية صريحة أم تُحفظ استعارة التعثر؟
  choice: تُعثِرك
  alternative: تجعلك تخطئ
  rationale: يحفظ النص صورة التعثر الأصلية بدل اختزالها في تفسير واحد، مع توضيح المعنى الأخلاقي المحتمل في الحاشية.
- issue: دلالة «الحياة» في εἰς τὴν ζωὴν
  choice: الحياة
  alternative: الحياة الأبدية
  rationale: للكلمة قوة أخروية في السياق، لكن الأصل يقول «الحياة» فقط؛ لذلك لا تُضاف صفة غير ملفوظة.
- issue: طبيعة الأمر بقطع اليد أو الرجل
  choice: الإبقاء على الأمر الحرفي الصارم في الصياغة
  alternative: إعادة صياغته بوصفه دعوة مجازية إلى التوبة الجذرية
  rationale: لا تحسم الترجمة ما إذا كان القول مبالغة بلاغية، بل تحفظ حدته وصورته كما وردتا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «خيرٌ لك» للمقارنة الطبيعية، وحُفظت الصورة القوية للأمر من غير تلطيف أو تفسير زائد.
