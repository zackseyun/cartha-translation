  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: ar
  text: أمّا مَن يجعل واحدًا من هؤلاء الصغار المؤمنين بي يتعثّر[a]، فخيرٌ له أن يُعلَّق حجرُ رحىً يديره حمار[b] في عنقه، وأن يُغرَق في عُرض البحر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يدفع واحدًا من هؤلاء الصغار المؤمنين بي إلى الخطيئة». يمكن أن يدل الفعل اليوناني على التسبّب في التعثّر أو السقوط أو الخطيئة.'
    reason: lexical_alternative
  - marker: b
    text: أي حجر رحى كبير كان يديره حمار.
    reason: cultural_note
  - marker: c
    text: 'أو: «في لجّة البحر». يشير التعبير اليوناني إلى البحر المفتوح بعيدًا عن الساحل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: يجعل ... يتعثّر
  rationale: يحفظ صورة التعثّر في اليونانية، مع بقاء معنى التسبّب في السقوط الروحي أو الخطيئة ممكنًا؛ لذلك ذُكر البديل في الحاشية.
- source_word: μικρῶν τούτων
  choice: هؤلاء الصغار
  rationale: يحافظ على اتساع التعبير، فلا يقصره على الأطفال وحدهم، وقد يشمل المؤمنين المتواضعين أو الضعفاء.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: المؤمنين بي
  rationale: ترجمة عربية مباشرة وطبيعية للعبارة التي تصف هؤلاء الصغار بإيمانهم بالمسيح.
- source_word: συμφέρει αὐτῷ
  choice: فخيرٌ له
  rationale: ينقل معنى الأفضلية أو المنفعة المقارنة بصورة عربية موجزة وملائمة لسياق التحذير.
- source_word: μύλος ὀνικὸς
  choice: حجر رحى يديره حمار
  rationale: يوضح أن المقصود حجر الرحى الكبير الذي كان يديره حمار، لا حجر الرحى اليدوي الصغير.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: في عنقه
  rationale: تعبير عربي طبيعي للصورة المقصودة من تعليق الحجر بالعنق.
- source_word: καταποντισθῇ
  choice: يُغرَق
  rationale: ينقل بوضوح معنى الإغراق أو التغطيس في الماء الوارد في صيغة المبني للمجهول.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: في عُرض البحر
  rationale: πέλαγος يدل على البحر المفتوح أو لجّته بعيدًا عن الساحل؛ و«عُرض البحر» تعبير عربي طبيعي يحفظ هذا المعنى.
theological_decisions:
- issue: نطاق مدلول «هؤلاء الصغار»
  choice: 'الإبقاء على التعبير عامًا: «هؤلاء الصغار المؤمنين بي»'
  alternative: هؤلاء الأطفال المؤمنين بي
  rationale: مع أن السياق السابق يعرض طفلًا مثالًا منظورًا، فإن وصفهم بأنهم «المؤمنون بي» يسمح بأن يشمل التعبير التلاميذ المتواضعين أو الضعفاء، فلا تحسم الترجمة المرجع في الأطفال وحدهم.
translation_notes:
  register: العربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «يتعثّر» للحفاظ على الاستعارة الأصلية، و«حجر رحى يديره حمار» لإيضاح الصورة الثقافية من غير غموض، و«عُرض البحر» للدلالة على البحر المفتوح.
