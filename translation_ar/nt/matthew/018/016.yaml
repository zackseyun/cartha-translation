base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: ar
  text: وَإِنْ لَمْ يُصْغِ، فَخُذْ مَعَكَ أَيْضًا وَاحِدًا أَوِ اثْنَيْنِ، لِكَيْ تَثْبُتَ كُلُّ مَسْأَلَةٍ عَلَى فَمِ شَاهِدَيْنِ أَوْ ثَلَاثَةٍ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: بناءً على شهادة شاهدين أو ثلاثة.'
    reason: lexical_alternative
  - marker: b
    text: إشارة إلى تثنية 19:15، حيث تثبت المسألة بشهادة شاهدين أو ثلاثة.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: يُصْغِ
  rationale: يفيد الفعل هنا السماع المصحوب بالانتباه والاستجابة، لا مجرد وصول الصوت؛ و«يُصغِ» يؤدي هذا المعنى في سياق معالجة الإساءة.
- source_word: παράλαβε μετὰ σοῦ
  choice: فاصطحب معك
  rationale: ينقل فعل الأمر ومعنى المصاحبة معًا بصياغة عربية طبيعية وواضحة.
- source_word: ἔτι ἕνα ἢ δύο
  choice: أيضًا واحدًا أو اثنين
  rationale: تحفظ «أيضًا» دلالة الإضافة في ἔτι من غير أن تفرض وصفًا غير مصرح به للأشخاص.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغرض التي تؤديها ἵνα.
- source_word: ἐπὶ στόματος
  choice: على فم
  rationale: يحفظ التعبير القانوني السامي وصدى تثنية 19:15، مع بيان معناه الأوضح في الحاشية.
- source_word: δύο μαρτύρων ἢ τριῶν
  choice: شاهدين أو ثلاثة
  rationale: «شاهد» هو المقابل القانوني المألوف، وحُفظ ترتيب العددين كما في النص اليوناني.
- source_word: σταθῇ
  choice: تثبت
  rationale: يفيد الفعل في هذا السياق القانوني ثبوت المسألة أو إقرارها بناءً على الشهادة.
- source_word: πᾶν ῥῆμα
  choice: كل مسألة
  rationale: مع أن اللفظ قد يعني حرفيًا «كل قول»، فإن الاستعمال القانوني وصدى تثنية 19:15 يدلان على الأمر أو المسألة محل النظر؛ و«مسألة» تحافظ على هذا الاتساع دون تضييقه إلى «تهمة».
theological_decisions:
- issue: الإحالة إلى قاعدة الشهود في تثنية 19:15 وتطبيقها في سياق تقويم عضو من الجماعة
  choice: الإبقاء على الصيغة الكتابية القانونية «على فم شاهدين أو ثلاثة» مع شرحها في الحاشية
  alternative: 'صياغتها تفسيريا: «بناءً على شهادة شاهدين أو ثلاثة»'
  rationale: يحفظ الاختيار صدى العهد القديم والقوة القانونية للنص، من غير حصر «كل مسألة» في تهمة بعينها أو إضافة تصور كنسي مذهبي غير منصوص عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعمل «فاصطحب» بدل التركيب الحرفي «خذ معك» لطبيعيته، وأُبقي التعبير «على فم» لصِلته المقصودة بالنص القانوني في التثنية، مع إيضاحه في الحاشية.
