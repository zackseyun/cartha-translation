  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: ar
  text: وزَرُبَّابِلُ أنجب أَبِيُودَ[a]، وأَبِيُودُ أنجب أَلِيَاقِيمَ، وأَلِيَاقِيمُ أنجب عَازُورَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صار أبًا لأَبِيُود»؛ فقد يَرِد الفعل المتكرر في سلاسل الأنساب الكتابية لعرض النسب عرضًا مختصرًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: زَرُبَّابِل
  rationale: نقلٌ صوتي للاسم بحسب صيغته العربية الكتابية الشائعة، مع عدم ترجمة الاسم الشخصي.
- source_word: δέ
  choice: الواو
  rationale: تؤدي هنا وظيفة وصل خفيف في تتابع النسب، لا معنى الاستدراك القوي؛ وصيغت الواو في العربية بما يحفظ انسياب السلسلة.
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: فعل عربي معاصر وموجز يناسب نسبة الولد إلى الأب في سجل الأنساب، ويتجنب اللفظ القديم «ولد» الذي قد يلتبس في العربية الحديثة.
- source_word: Ἀβιούδ
  choice: أَبِيُود
  rationale: نقل صوتي واضح للاسم اليوناني، موافق للصيغة العربية الكتابية المتداولة.
- source_word: Ἐλιακίμ
  choice: أَلِيَاقِيم
  rationale: استُخدمت الصيغة العربية الراسخة للاسم الكتابي، وهي تمثل الاسم اليوناني تمثيلًا مفهومًا للقارئ العربي.
- source_word: Ἀζώρ
  choice: عَازُور
  rationale: نقل صوتي بالصيغة العربية الكتابية الشائعة، مع المحافظة على كونه اسم علم.
theological_decisions:
- issue: دلالة γεννάω في سلسلة نسب قد تختصر بعض الأجيال
  choice: أنجب
  alternative: كان أبًا لـ / كان من أجداد
  rationale: يحافظ «أنجب» على العبارة النَّسَبية المباشرة المتكررة في اليونانية من غير أن يحسم صراحةً هل كل حلقة أبوة مباشرة أم أن السلسلة قد تعرض النسب بصورة مختصرة. أما «كان من أجداد» فيفسر العلاقة تفسيرًا أوسع مما يصرح به اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ إيقاع التكرار في سلسلة النسب، واستُعملت الأسماء بصيغ عربية كتابية مألوفة، مع إثبات علامة الحاشية [a] في المتن.
