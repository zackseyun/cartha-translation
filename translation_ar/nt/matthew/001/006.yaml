theological_decisions:
- issue: إشارة متى غير المباشرة إلى بثشبع
  choice: الإبقاء على التعبير غير المباشر «مِنِ امْرَأَةِ أُورِيَّا»
  alternative: مِنْ بَثْشَبَعَ / مِنَ الَّتِي كَانَتْ زَوْجَةَ أُورِيَّا
