    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: كتاب
  rationale: تدل اللفظة على كتاب أو سجل مكتوب، وتأتي العبارة هنا عنوانًا مهيبًا وموجزًا؛ و«كتاب» تحافظ على الصياغة الاسمية القريبة من الأصل.
- source_word: γενέσεως
  choice: نسب
  rationale: تتسع اللفظة لمعاني النشأة والميلاد والنسب، لكن سلسلة الأنساب التالية مباشرة تجعل «نسب» الأنسب في المتن، مع حفظ سعة المعنى في الحاشية.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المعيارية المستقرة للاسم العلم.
- source_word: χριστοῦ
  choice: المسيح
  rationale: اللفظة لقب يعني الممسوح، و«المسيح» المقابل العربي الطبيعي والموروث الذي يحفظ وظيفتها اللقبية.
- source_word: υἱοῦ Δαυὶδ
  choice: ابن داود
  rationale: تحافظ العبارة على اللفظ الحرفي وعلى قوة اللقب المسياني الملكي، مع أن «ابن» هنا يفيد أيضًا معنى السليل.
- source_word: υἱοῦ Ἀβραάμ
  choice: ابن إبراهيم
  rationale: تحافظ العبارة على أسلوب الأنساب وعلى الصلة العهدية بإبراهيم، مع أن المقصود في السياق هو الانتساب إليه.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي المستقر للقب اليوناني ويحفظ هويته اللقبية، لا بوصفه اسم عائلة؛ أما «الممسوح» فيوضح أصل المعنى لكنه أقل طبيعية في هذا الموضع.
- issue: دلالة γενέσεως في العنوان
  choice: نسب
  alternative: نشأة أو ميلاد
  rationale: السياق المباشر قائمة أنساب، لذلك اختير «نسب»، مع إبقاء احتمال الإشارة الأوسع إلى النشأة أو الميلاد في الحاشية بدل حسمه نهائيًا.
