base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: ar
  text: وآساف أنجب يهوشافاط[a]، ويهوشافاط أنجب يورام، ويورام أنجب عزيا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقرأ بعض المخطوطات «آسا» بدلًا من «آساف»؛ و«آسا» هو أيضًا اسم ملك يهوذا المذكور في نسب العهد القديم.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: أَسَاف
  rationale: نقلٌ صوتي للاسم اليوناني الوارد في نص SBLGNT، من غير مواءمته صامتًا مع اسم الملك آسا في خلفية العهد القديم؛ وتُذكر القراءة البديلة في الحاشية.
- source_word: δὲ
  choice: وَ
  rationale: تؤدي هنا وظيفة رابط خفيف بين حلقات النسب، لا معنى الاستدراك؛ والواو هي المقابل العربي الطبيعي الموجز.
- source_word: ἐγέννησεν
  choice: أَنْجَبَ
  rationale: فعل عربي واضح ومعاصر يدل في سياق النسب على الأبوة، ويحافظ على تكرار الروابط بين الأسماء من غير استعمال صيغة قديمة مثل «وَلَدَ» قد يلتبس فاعلها ومفعولها لدى بعض القراء.
- source_word: Ἰωσαφάτ
  choice: يَهُوشَافَاط
  rationale: الصيغة العربية المألوفة لاسم ملك يهوذا المقصود، مع إبقاء الصلة واضحة بخلفية العهد القديم.
- source_word: Ἰωράμ
  choice: يُورَام
  rationale: نقل عربي واضح للصيغة اليونانية الأقصر Ἰωράμ، من غير توسيعها إلى الصيغة العبرية الأطول «يهورام».
- source_word: Ὀζίαν
  choice: عُزِّيَّا
  rationale: الصيغة العربية الكتابية المألوفة لاسم ملك يهوذا، وهي أوضح للقارئ من النقل المباشر للصيغة اليونانية «أوزياس».
theological_decisions:
- issue: صياغة تسلسل النسب مع تكرار δὲ وἐγέννησεν
  choice: الحفاظ على كل حلقة من حلقات النسب وتكرار «و... أنجب...» في عربية سلسة.
  alternative: ضغط العبارات بدرجة أكبر، أو استعمال «وَلَدَ» المتكرر.
  rationale: التكرار جزء من بنية السلسلة، وصياغة «أنجب» واضحة للقارئ الحديث ولا تضيف تقريرًا عقائديًا يتجاوز النص.
- issue: هل يُواءَم Ἀσὰφ مع الاسم التاريخي المتوقع «آسا» في المتن؟
  choice: إبقاء «أَسَاف» في المتن، وذكر «آسا» في الحاشية.
  alternative: وضع «آسا» في المتن بناءً على نسب العهد القديم أو على قراءة مخطوطية بديلة.
  rationale: أولوية الدليل اليوناني المعروض تقتضي تمثيل صيغة Ἀσὰφ كما هي، مع صون المسألة النصية والنَسَبية بشفافية في الحاشية بدل حسمها ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت الأسماء العربية الكتابية المألوفة حيث تمثل الأشخاص المعروفين، مع نقل «أساف» بحسب صيغة النص اليوناني وإثبات علامة الحاشية في المتن.
