  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: ar
  text: وسليمان أنجب رحبعام، ورحبعام أنجب أبيا، وأبيا أنجب آساف[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «آسا»، وهو اسم ملك يهوذا المذكور في 1 ملوك 15 وأخبار الأيام الثاني 14–16؛ أما النص اليوناني هنا فيقرأ: «آساف».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: في سياق سلسلة النسب يدل الفعل على الأبوة والنسل من جهة الرجل، و«أنجب» تعبير عربي فصيح وواضح وموجز.
- source_word: δὲ
  choice: الواو
  rationale: تؤدي هنا وظيفة الربط الخفيف واستمرار سلسلة النسب، لا الاستدراك؛ لذلك تنقلها الواو العربية بصورة طبيعية.
- source_word: Σολομών
  choice: سليمان
  rationale: الصيغة العربية المعيارية المعروفة للاسم الكتابي.
- source_word: Ῥοβοάμ
  choice: رحبعام
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: Ἀβιά
  choice: أبيا
  rationale: صيغة عربية واضحة تحافظ على الاسم الوارد في اليونانية وعلى صلته بالاسم المعروف في العهد القديم.
- source_word: Ἀσάφ
  choice: آساف
  rationale: يتبع النص اليوناني المطبوع Ἀσάφ كما هو، من غير مواءمة صامتة مع اسم الملك آسا.
theological_decisions:
- issue: هل يُواءم اسم Ἀσάφ في نسب متى مع قائمة ملوك العهد القديم بترجمته «آسا»؟
  choice: إبقاء «آساف» في المتن
  alternative: «آسا»
  rationale: النص اليوناني المعطى يقرأ Ἀσάφ، ولذلك تُحفظ هذه القراءة في المتن وفق أولوية شاهد اللغة الأصلية، مع إثبات القراءة الأخرى في الحاشية بشفافية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أنجب» لتجنب الصيغة التراثية الأقل تداولًا «وَلَدَ» مع الحفاظ على إيجاز أسلوب سلسلة النسب. وُضعت علامة الحاشية بعد الاسم المختلف عليه مباشرة من حيث المعنى، في ختام الآية.
