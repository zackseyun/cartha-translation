  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: ar
  text: '«ها إنَّ العذراء[a] تحبل وتلد ابنًا، ويدعون[b] اسمه عِمَّانوئيل[c]»، الذي يُترجَم: «الله معنا».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الشابة». لكن «العذراء» هي الأنسب في سياق متّى، في ضوء اللفظ اليوناني παρθένος ورواية الحبل المحيطة.'
    reason: lexical_alternative
  - marker: b
    text: 'في اليونانية: «يدعون»؛ وهو جمع غائب غير محدد.'
    reason: lexical_alternative
  - marker: c
    text: ويُنقل الاسم أيضًا إلى العربية بصيغة «إيمانوئيل».
    reason: lexical_alternative
  - marker: d
    text: 'أو: «أي: الله معنا».'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ها إنَّ
  rationale: صيغة عربية فصيحة واضحة تسترعي الانتباه وتحافظ على النبرة النبوية المرفوعة من غير غرابة مفرطة.
- source_word: ἡ παρθένος
  choice: العذراء
  rationale: المعنى المعتاد للكلمة اليونانية في سياق متّى، كما أن رواية الميلاد المحيطة تعرض الحبل بوصفه استثنائيًا.
- source_word: ἐν γαστρὶ ἕξει
  choice: تحبل
  rationale: ينقل التعبير الاصطلاحي، وحرفيته «سيكون لها في البطن»، إلى فعل عربي طبيعي ودقيق.
- source_word: τέξεται υἱόν
  choice: تلد ابنًا
  rationale: ترجمة مباشرة وطبيعية تحفظ تتابع الحبل والولادة.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: يدعون اسمه
  rationale: تحافظ على صيغة الجمع الغائب غير المحدد في اليونانية بدل تحويلها إلى مبني للمجهول أو تعيين فاعل غير مذكور.
- source_word: Ἐμμανουήλ
  choice: عِمَّانوئيل
  rationale: نقل صوتي عربي شائع للاسم، مع إبقاء تفسير معناه الوارد في النص نفسه.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: أي
  rationale: أداة تفسير عربية موجزة وطبيعية تؤدي وظيفة العبارة اليونانية التي تشرح معنى الاسم.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: الله معنا
  rationale: صياغة عربية واضحة ومألوفة تنقل معنى الاسم بلا إضافة تفسير عقائدي يتجاوز النص.
theological_decisions:
- issue: دلالة παρθένος في سياق الحبل بيسوع
  choice: العذراء
  alternative: الشابة
  rationale: يستعمل متّى لفظ παρθένος ضمن رواية تصرّح بأن الحبل حدث قبل اجتماع مريم بيوسف؛ لذلك «العذراء» هي الأنسب في المتن، مع إثبات البديل المعجمي الأوسع في الحاشية حفاظًا على موضع النقاش المتعلق باقتباس إشعياء.
- issue: القوة اللاهوتية لتفسير اسم عِمَّانوئيل
  choice: الله معنا
  alternative: معنا الله
  rationale: تنقل العبارة المعنى الذي يقدمه متّى نفسه دون توسيعه إلى شرح عقائدي عن التجسد، وبذلك تُحفظ قوة النص وحدوده معًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «ها إنَّ» لصون قوة استرعاء الانتباه، وحُفظ الجمع غير المحدد في «يدعون». جُمعت ملاحظة نقل الاسم وتفسيره في حاشية واحدة لتجنب إثقال آية قصيرة بكثرة العلامات.
