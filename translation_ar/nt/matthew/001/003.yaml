source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: ar
  text: وأنجب يهوذا فارص وزارح من ثامار، وأنجب فارص حصرون، وأنجب حصرون أرام[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تورد بعض الترجمات «رام» هنا، تبعًا لطريقة نقل أو تقليد مختلف؛ أما النص اليوناني هنا فيقرأ «أرام».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: يهوذا
  rationale: الاسم المألوف في العربية للبطريرك يهوذا، وهو يميّزه من شخصيات العهد الجديد التي تُسمّى عادةً يهوذا أيضًا بحسب السياق.
- source_word: δὲ
  choice: الواو
  rationale: تؤدي هنا وظيفة الربط الخفيف في سلسلة النسب، لا الاستدراك؛ لذلك نُقلت بالواو حيث يلائم الأسلوب العربي.
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: فعل عربي واضح ومعاصر يعبّر بإيجاز عن الأبوة في سياق النسب، من غير اللجوء إلى الصيغة التراثية «وَلَدَ» التي قد تبدو ملتبسة للقارئ الحديث.
- source_word: Φαρὲς
  choice: فارص
  rationale: الصيغة العربية الكتابية الشائعة للاسم المقابل للعبرية פֶּרֶץ، وتحافظ على استمرارية الاسم بين الأسفار.
- source_word: Ζάρα
  choice: زارح
  rationale: الصيغة العربية الكتابية الشائعة للاسم المقابل للعبرية זֶרַח.
- source_word: ἐκ τῆς Θαμάρ
  choice: من ثامار
  rationale: تحفظ «من» دلالة الأصل الأمومي التي تؤديها ἐκ في سلسلة النسب، بصياغة عربية طبيعية وموجزة.
- source_word: Ἑσρώμ
  choice: حصرون
  rationale: الصيغة العربية المألوفة للاسم المقابل للعبرية חֶצְרוֹן، وتربط سلسلة النسب بنظيرتها في العهد القديم.
- source_word: Ἀράμ
  choice: أرام
  rationale: نقل مباشر للاسم الوارد في النص اليوناني Ἀράμ، من غير مواءمته صامتًا مع تقليد «رام» المعروف من مواضع أخرى.
theological_decisions:
- issue: هل يُوائَم الاسم الأخير مع صيغة النسب الشائعة في العهد القديم؟
  choice: أرام
  alternative: رام
  rationale: أُثبتت «أرام» لأن النص اليوناني المعطى يقرأ Ἀράμ. وأُبقيت «رام» في الحاشية بوصفها الصيغة التي قد يعرفها القراء من تقاليد كتابية وترجمية أخرى، من غير طمس الفرق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أنجب» بدل الصيغة التراثية «وَلَدَ» لسلامة الفهم المعاصر، مع الحفاظ على الإيقاع المتكرر لسلسلة النسب. وُضع مؤشر الحاشية بعد «أرام» لأنه الاسم الذي تتناوله الحاشية.
