id: MAT.1.16
reference: Matthew 1:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: ar
  text: ويعقوب أنجب يوسف، زوج مريم، ومنها وُلد يسوع الذي يُدعى المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال خفيفة تواصل سلسلة النسب، والواو تؤدي هذا المعنى طبيعيًا من غير إظهار مقابلة غير مقصودة.
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: يناسب سياق النسب، وهو تعبير عربي معاصر واضح يحافظ على دلالة التوليد الأبوي في العبارة.
- source_word: τὸν ἄνδρα Μαρίας
  choice: زوج مريم
  rationale: مع المضاف إليه «مريم» تدل ἀνήρ هنا على العلاقة الزوجية، لا على مجرد معنى «رجل».
- source_word: ἐξ ἧς
  choice: ومنها
  rationale: يحافظ ضمير المؤنث المفرد على الإحالة المحددة إلى مريم، كما تحفظ «من» دلالة ἐκ، وتُظهر العبارة التحول عن الصيغة المتكررة في سلسلة الآباء.
- source_word: ἐγεννήθη
  choice: وُلد
  rationale: المبني للمجهول هنا يختلف عمدًا عن «أنجب» السابقة، فينسب ولادة يسوع إلى مريم من غير القول إن يوسف أنجبه.
- source_word: ὁ λεγόμενος
  choice: الذي يُدعى
  rationale: صياغة عربية مباشرة وطبيعية لعبارة التعريف باللقب.
- source_word: χριστός
  choice: المسيح
  rationale: الكلمة هنا لقب في صيغة «الذي يُدعى»، و«المسيح» هو المقابل العربي الراسخ الذي يحفظ دلالة اللقب.
theological_decisions:
- issue: التحول في صيغة النسب عند الانتقال من يوسف إلى يسوع
  choice: «يعقوب أنجب يوسف»، ثم «ومنها وُلد يسوع»
  alternative: «يوسف أنجب يسوع»
  rationale: يفرق النص اليوناني بين الفعل المبني للمعلوم في نسب يوسف والفعل المبني للمجهول مع ضمير مؤنث يعود إلى مريم عند ذكر ولادة يسوع. تحافظ الترجمة على هذا الفرق من غير إضافة تفسير عقائدي.
- issue: دلالة χριστός في صيغة التعريف بيسوع
  choice: المسيح
  alternative: الممسوح
  rationale: ترد χριστός هنا لقبًا، و«المسيح» ينقل اللقب بصيغته العربية الكتابية المفهومة والراسخة، بينما «الممسوح» قد يبدو شرحًا لغويًا لا لقبًا متداولًا.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة وموجزة وذات نبرة وقورة. وُضعت «ومنها» بعد الجملة الاعتراضية لتبقى الإحالة إلى مريم صريحة، مع الحفاظ على التمييز بين إنجاب يوسف وولادة يسوع.
