  source_fidelity: النص العربي ينقل التسلسل الزمني في «Μετὰ δὲ» بوضوح، ويؤدي «τὴν μετοικεσίαν Βαβυλῶνος» بعبارة «السبي إلى بابل» التي تعكس النقل القسري إلى المنفى في سياق النسب. كما يحافظ على تكرار فعل النسب «ἐγέννησεν» وعلى ترتيب الأسماء كما في اليونانية.
