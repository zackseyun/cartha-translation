id: MAT.1.12
reference: Matthew 1:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: ar
  text: وبعد السبي إلى بابل[a]، أنجب يكنيا شألتئيل، وأنجب شألتئيل زربابل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الترحيل إلى بابل». يدل اللفظ اليوناني على نقل الشعب قسرًا إلى المنفى في بابل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: وبعد
  rationale: تفيد μετά مع صيغة النصب التعاقب الزمني، أما δέ فأداة ربط خفيفة؛ ونقلها بالواو مع «بعد» يحافظ على اتصال سلسلة النسب بسياقها في عربية طبيعية.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: السبي إلى بابل
  rationale: تشير μετοικεσία إلى النقل القسري إلى موضع آخر والإقامة في المنفى. و«السبي إلى بابل» تعبير عربي واضح ومألوف يجمع معنى الترحيل القسري وحالة المنفى، مع بيان جهة الانتقال.
- source_word: Ἰεχονίας
  choice: يكنيا
  rationale: صيغة عربية كتابية مألوفة للاسم، ومتسقة مع الاسم العبري المقابل.
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: في سياق الأنساب يدل γεννάω على الانتساب من جهة الأب. و«أنجب» موجزة وطبيعية، ولا تقتضي أن تكون كل حلقة من حلقات النسب بلا أجيال محذوفة وفق أعراف تدوين الأنساب.
- source_word: Σαλαθιήλ
  choice: شألتئيل
  rationale: صيغة عربية قريبة من الاسم السامي המקافئ، وتحافظ على التعرف إلى الشخصية في سياق العهد القديم.
- source_word: δὲ
  choice: و
  rationale: تربط الأداة هنا بين حلقتين متتاليتين في سلسلة النسب، والواو هي المقابل العربي الطبيعي.
- source_word: Ζοροβαβέλ
  choice: زربابل
  rationale: الصيغة العربية الكتابية الشائعة للاسم، وهي أقرب إلى الاسم السامي المعروف من النقل الحرفي للصيغة اليونانية.
theological_decisions:
- issue: دلالة γεννάω في سلسلة النسب
  choice: أنجب
  alternative: ولد؛ كان أبا لـ
  rationale: يحافظ «أنجب» على صيغة الانتساب الأبوي في السلسلة من غير فرض أن النص يصرح بتتابع بيولوجي مباشر لا تتخلله أجيال، إذ قد تُستعمل لغة الأنساب للدلالة على السلف والنسل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع استعمال الأسماء الكتابية العربية المألوفة، والمحافظة على إيقاع سلسلة النسب وتكرار فعل «أنجب».
