source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: ar
  text: وَحَزَقِيَّا أَنْجَبَ مَنَسَّى، وَمَنَسَّى أَنْجَبَ عَامُوسَ[a]، وَعَامُوسُ أَنْجَبَ يُوشِيَّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقرأ بعض الترجمات «آمون» هنا، مواءمةً للاسم مع ملك يهوذا المذكور في 2 ملوك 21؛ أمّا نص متى اليوناني فيقرأ «عاموس».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: أَنْجَبَ
  rationale: في سياق سلسلة النسب، يدل الفعل على الأبوة والنسل. و«أنجب» تعبير عربي فصيح وموجز وطبيعي، ويحافظ على الصيغة الفعلية المتكررة في اليونانية.
- source_word: Ἑζεκίας
  choice: حَزَقِيَّا
  rationale: استُخدمت الصيغة العربية الكتابية الشائعة للاسم، بدل النقل الحرفي عن اليونانية.
- source_word: Μανασσῆς
  choice: مَنَسَّى
  rationale: الصيغة العربية الكتابية المعروفة لهذا الاسم الشخصي.
- source_word: Ἀμώς
  choice: عَامُوس
  rationale: يتبع النص الرئيسي قراءة SBLGNT اليونانية Ἀμώς، أي «عاموس»، ولا يبدلها صمتًا إلى «آمون» لمواءمة اسم ملك يهوذا في سفر الملوك.
- source_word: Ἰωσίας
  choice: يُوشِيَّا
  rationale: الصيغة العربية الكتابية الشائعة للاسم الشخصي.
- source_word: δέ
  choice: وَ
  rationale: تعمل δέ هنا أداة ربط بسيطة في تسلسل النسب؛ وترجمتها بالواو تحافظ على إيقاع القائمة بصورة عربية طبيعية.
theological_decisions:
- issue: اختلاف الاسم في نسب متى عن اسم ملك يهوذا في العهد القديم
  choice: إثبات «عاموس» في المتن اتباعًا للنص اليوناني
  alternative: «آمون» لمواءمة الاسم مع الملك المذكور في 2 ملوك 21
  rationale: الأولوية لشاهد اللغة الأصلية؛ فنص متى اليوناني المعتمد يقرأ Ἀμώς لا Ἀμών. تُحفظ القراءة المألوفة تاريخيًا في الحاشية بدل إجراء مواءمة صامتة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على التوازي المتكرر في سلسلة النسب، واستُعملت الأسماء بصيغها العربية الكتابية الشائعة. وُضعت علامة الحاشية بعد «عاموس» لأنها موضع اختلاف الاسم، لا بعد «منسّى».
