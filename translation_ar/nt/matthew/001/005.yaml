  terminology: '«أنجب» مناسب للنسب الأبوي دون الالتجاء إلى تعبير قديم أو ملتبس. والأسماء: سلمون، بوعز، راحاب، عوبيد، راعوث، ويَسّى، صيغ كتابية عربية مألوفة ومتسقة.'
