  source_fidelity: 'الترجمة تحافظ بدقة على البنية اليونانية المتوازية: ثلاثة أفعال ἐγέννησεν بصيغة «أنجب»، وذكر الأمَّين صراحةً مع «من» المقابلة لـἐκ، والواو تؤدي وظيفة δέ الرابطة في تسلسل النسب. الأسماء المختارة تربط بوضوح بالشخصيات المعروفة في العهد القديم، ولا تضيف تفسيرًا إلى النص.'
