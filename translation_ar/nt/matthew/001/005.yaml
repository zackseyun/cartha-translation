id: MAT.1.5
reference: Matthew 1:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: ar
  text: وسَلْمون أنجب بوعز من راحاب، وبوعز أنجب عوبيد من راعوث، وعوبيد أنجب يَسّى،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: في سياق سلسلة النسب يدل الفعل على الإنجاب وإقامة النسب من جهة الأب. و«أنجب» تعبير عربي معاصر واضح، من غير اللجوء إلى الصيغة القديمة «وَلَدَ» التي قد يلتبس فاعلها في الاستعمال الحديث.
- source_word: ἐκ
  choice: من
  rationale: تفيد ἐκ مع اسم الأم المصدر أو النسب من جهة الأم. وتحافظ «من راحاب» و«من راعوث» على صورة التعبير اليوناني وعلى ذكر الأمَّين صراحة.
- source_word: δὲ
  choice: و
  rationale: الأداة هنا وصلة خفيفة تتابع حلقات النسب، وليست للاستدراك؛ لذلك تؤديها الواو بطلاقة ودقة.
- source_word: Σαλμὼν
  choice: سَلْمون
  rationale: الصيغة العربية الكتابية المعروفة للاسم، مع ضبط يوضح نطقه.
- source_word: Βόες
  choice: بوعز
  rationale: استُعمل الاسم العربي المألوف للشخصية نفسها في العهد القديم، حفاظًا على وضوح الهوية واتساق الأسماء.
- source_word: Ῥαχάβ
  choice: راحاب
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: Ἰωβὴδ
  choice: عوبيد
  rationale: الصيغة العربية المعروفة للاسم العبري في العهد القديم، وهي أوضح من النقل الآلي للصيغة اليونانية.
- source_word: Ῥούθ
  choice: راعوث
  rationale: الصيغة العربية الكتابية المستقرة لاسم الشخصية ولسفر راعوث.
- source_word: Ἰεσσαί
  choice: يَسّى
  rationale: الصيغة العربية الكتابية المعروفة التي تصل الاسم بنظيره في العهد القديم.
theological_decisions:
- issue: صيغة النسب وذكر الأمَّين
  choice: الإبقاء على النسب الأبوي بصيغة «أنجب»، مع ذكر راحاب وراعوث صراحة بواسطة «من».
  alternative: صياغة كل حلقة بعبارة «كان أبا» أو حذف التعبير الدال على جهة الأم.
  rationale: النص اليوناني يبرز الأمَّين على نحو غير معتاد في سلسلة النسب باستعمال ἐκ مع كل اسم. وتحفظ الصياغة المختارة كلاً من تسلسل الآباء والإشارة الصريحة إلى الأمَّين، من غير إضافة تفسير لاهوتي.
translation_notes:
  register: العربية فصحى حديثة، واضحة ووقورة. استُعملت الأسماء الكتابية العربية المألوفة لتحقيق الاستمرارية بين العهدين، وحوفظ على التوازي المتكرر في سلسلة النسب.
