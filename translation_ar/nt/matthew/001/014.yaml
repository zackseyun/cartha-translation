source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: ar
  text: وَأَنْجَبَ آزُورُ صَادُوقَ، وَأَنْجَبَ صَادُوقُ أَخِيمَ، وَأَنْجَبَ أَخِيمُ أَلِيُودَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: آزُور
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة، مع إثبات الضبط الذي يبيّن النطق.
- source_word: δέ
  choice: الواو
  rationale: تؤدي هنا وظيفة الربط البسيط بين حلقات النسب؛ وتكرار الواو طبيعي في العربية ويحفظ تتابع العبارات.
- source_word: ἐγέννησεν
  choice: أَنْجَبَ
  rationale: الفعل في سياق سلسلة النسب يدل على التوالد أو الانتساب من جهة الأب. «أنجب» تعبير عربي حديث موجز، ويحافظ على الصياغة المباشرة دون اللجوء إلى «ولد» التي قد يلتبس فاعلها في النص غير المضبوط.
- source_word: τὸν
  choice: غير مترجم على حدة
  rationale: أداة التعريف اليونانية هنا علامة نحوية تسبق المفعول به العَلَم، ولا يقابلها في العربية شيء مستقل مع أسماء الأعلام.
- source_word: Σαδώκ
  choice: صَادُوق
  rationale: نقل صوتي عربي للاسم اليوناني، بصيغة مألوفة في الاستعمال الكتابي العربي.
- source_word: Ἀχίμ
  choice: أَخِيم
  rationale: نقل صوتي مباشر للاسم اليوناني مع ضبط الحركة الأولى.
- source_word: Ἐλιούδ
  choice: أَلِيُود
  rationale: نقل صوتي مباشر للاسم اليوناني بصيغة عربية سهلة القراءة.
