source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: ar
  text: 'وبينما كان يفكّر في هذه الأمور، إذا بملاك الرب ظهر له في حلم قائلًا: «يا يوسف ابن داود، لا تخف أن تأخذ مريم زوجتك[a]، لأن الذي حُبل به فيها هو من الروح القدس».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تأخذ مريم زوجتك». تشير العبارة اليونانية إلى ضمّها إلى بيتك في إطار الزواج.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: كان يفكّر في
  rationale: ينقل معنى التروّي والتفكير الداخلي الجاري من غير أن يجعله قرارًا نهائيًا.
- source_word: ἰδοὺ
  choice: إذا بـ
  rationale: أداة عربية فصيحة وطبيعية تُبرز المفاجأة والتحول الحي في السرد.
- source_word: ἄγγελος κυρίου
  choice: ملاك من عند الرب
  rationale: يحافظ على التنكير في ἄγγελος ويدل بوضوح على انتساب الملاك ومصدر إرساله، من غير تحويل العبارة إلى اللقب المعرّف «ملاك الرب».
- source_word: κατ’ ὄναρ
  choice: في حلم
  rationale: المقابل العربي الطبيعي المباشر للتعبير اليوناني الاصطلاحي.
- source_word: ἐφάνη
  choice: ظهر
  rationale: صياغة سردية مألوفة للظهور الرؤيوي.
- source_word: υἱὸς Δαυίδ
  choice: ابن داود
  rationale: يحفظ النسب الداودي وما قد يحمله من صدى مسياني.
- source_word: μὴ φοβηθῇς
  choice: لا تخف
  rationale: نهي عربي واضح ومباشر يحفظ الدلالة الانفعالية للفعل.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: أن تأخذ مريم زوجتك
  rationale: يعكس تركيب «مريم زوجتك» مباشرة، مع دلالة السياق على أخذها إلى بيته في إطار الزواج، من غير الإيحاء بأنها ستصبح زوجته لأول مرة.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: الذي حُبل به فيها
  rationale: يحفظ الصياغة الموصولة المحايدة ويؤدي المعنى السابق للولادة في هذا السياق الجنيني بعبارة عربية مفهومة.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: هو من الروح القدس
  rationale: تدل «من» على المصدر أو المنشأ كما تفعل ἐκ، وتحفظ الإشارة إلى الروح القدس.
theological_decisions:
- issue: دلالة κυρίου في عبارة ἄγγελος κυρίου
  choice: الرب
  alternative: 'يهوه، أو صياغة تجعل العبارة لقبًا محددًا: ملاك الرب'
  rationale: «الرب» هو المقابل المباشر لـκύριος في النص، والتنـكير في «ملاك» لا يفرض هوية ثيوفانية خاصة.
- issue: مرجع πνεύματός ... ἁγίου
  choice: الروح القدس
  alternative: روح مقدسة، أو قوة الروح القدس
  rationale: السياق في رواية الميلاد يشير إلى الروح القدس بوصفه المصدر الإلهي، ولا يقدمه كروح غير معيّنة أو كمجرد قوة.
- issue: الوضع الزوجي في τὴν γυναῖκά σου
  choice: مريم زوجتك
  alternative: مريم لتكون زوجتك
  rationale: يحفظ النص وصف مريم بأنها زوجة يوسف ضمن وضع الخطبة اليهودي الملزم، ولا يستبق حل التوتر بين الخطبة وإدخالها إلى البيت.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «إذا بـ» بدل «هوذا» لتأدية قوة ἰδοὺ طبيعيًا، وحُفظت عبارة «مريم زوجتك» مع إيضاح دلالة الأخذ الزوجي في الحاشية.
