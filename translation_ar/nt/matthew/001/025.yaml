base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: ar
  text: ولم يعرفها[a] حتى[b] ولدت ابنًا، وسمّاه يسوع[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: لم يعاشرها معاشرة الأزواج. تستعمل اليونانية فعل «يعرف» هنا تعبيرًا ملطفًا عن العلاقة الجنسية.'
    reason: lexical_alternative
  - marker: b
    text: تبيّن «حتى» ما كان قائمًا إلى ولادة يسوع، لكنها لا تحسم بذاتها ما حدث بعد ذلك.
    reason: alternative_reading
  - marker: c
    text: 'حرفيًا: «ودعا اسمه يسوع».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: يعرفها
  rationale: يحافظ على التعبير اليوناني الملطف الذي يستعمل «المعرفة» للدلالة على المعاشرة الزوجية، مع توضيح المقصود في الحاشية.
- source_word: ἕως οὗ
  choice: حتى
  rationale: مقابل زمني عربي مباشر وطبيعي، يبيّن استمرار الحالة إلى وقت الولادة من غير أن يحسم ما حدث بعد ذلك.
- source_word: ἔτεκεν
  choice: ولدت
  rationale: تعبير عربي معاصر وطبيعي ينقل معنى فعل الولادة بوضوح.
- source_word: υἱόν
  choice: ابنًا
  rationale: يحافظ على التنكير الموجود في اليونانية ولا يضيف تعريفًا أو توكيدًا غير مصرح بهما.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: سمّاه يسوع
  rationale: ينقل المعنى المقصود بصياغة عربية طبيعية موجزة، بينما تُذكر البنية الحرفية في الحاشية.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المألوفة لاسم Ἰησοῦς في العهد الجديد.
theological_decisions:
- issue: دلالة «حتى» على علاقة مريم الزوجية بعد ولادة يسوع
  choice: إبقاء «حتى» بلا إضافة تحسم ما جرى بعد الولادة.
  alternative: قد يستنتج بعض القراء أن المعاشرة الزوجية بدأت بعد الولادة، بينما يرى آخرون أن العبارة لا تدل بذاتها على أي تغير لاحق.
  rationale: التعبير اليوناني يقرر ما كان قائمًا إلى وقت الولادة، لكنه لا يحسم بمفرده ما حدث بعدها؛ لذلك تحفظ الصياغة التوتر التفسيري ولا تتبنى موقفًا طائفيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي التعبير الملطف «يعرفها» لقربه من الأصل، مع شرحه في الحاشية، واستُعملت الصياغة العربية الطبيعية «سمّاه يسوع» بدل نقل التركيب اليوناني ذي الصبغة السامية نقلًا حرفيًا.
