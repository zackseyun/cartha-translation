source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: ar
  text: وكان يوسف زوجها[a] رجلًا بارًّا، ولم يُرِد أن يعرّضها للعار علنًا[b]، وعزم أن يطلّقها سرًّا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خطيبها». يقول النص اليوناني حرفيًا «رجلها/زوجها»، وهو تعبير يعكس القوة القانونية للخطبة اليهودية.
    reason: lexical_alternative
  - marker: b
    text: أو «أن يجعل منها عبرةً علنًا» أو «أن يفضحها علنًا».
    reason: lexical_alternative
  - marker: c
    text: أو «أن يصرفها سرًّا». والمقصود في هذا السياق طلاق رسمي في أثناء مدة الخطبة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: زوجها
  rationale: لفظ ἀνήρ قد يعني «رجلًا» أو «زوجًا»، وهنا تدل العلاقة القانونية وسياق إمكان ἀπολῦσαι على معنى «زوجها»، مع أن الزواج لم يكن قد اكتمل بالمعاشرة.
- source_word: δίκαιος
  choice: بارًّا
  rationale: ينقل «بارّ» الدلالة الأخلاقية والدينية للفظ δίκαιος، من غير حصرها في العدالة القانونية وحدها.
- source_word: δειγματίσαι
  choice: أن يعرّضها للعار علنًا
  rationale: يفيد الفعل كشف الشخص أمام الناس على نحو يجلب الخزي؛ والصياغة العربية توضّح البعد العلني من غير تحديد إجراء بعينه لا يذكره النص.
- source_word: ἐβουλήθη
  choice: فعزم
  rationale: يدل βούλομαι هنا على قصد مدروس أو قرار، و«عزم» موجزة وطبيعية في السياق السردي.
- source_word: λάθρᾳ
  choice: سرًّا
  rationale: ينقل الظرف معنى الفعل في الخفاء أو بعيدًا عن العلن، ويقابل بوضوح فكرة التشهير العلني.
- source_word: ἀπολῦσαι
  choice: أن يطلّقها
  rationale: مع أن المعنى الحرفي قد يكون «يصرفها»، فإن السياق هو إنهاء خطبة يهودية ملزمة قانونًا، ولذلك يبيّن «يطلّقها» القوة القانونية المقصودة.
- source_word: δὲ
  choice: وكان
  rationale: أُدمج الرابط السردي δέ في افتتاح عربي طبيعي يواصل الرواية من الآية السابقة.
- source_word: ὢν καὶ μὴ θέλων
  choice: رجلًا بارًّا، ولم يُرِد
  rationale: تحافظ الصياغة على وصفي برّ يوسف وعدم إرادته التشهير بها، من غير أن تحسم بدقة العلاقة المنطقية بين الوصفين.
theological_decisions:
- issue: دلالة وصف يوسف بأنه δίκαιος
  choice: «بارًّا» من غير تفسير البر بأنه تشدد في تطبيق الشريعة أو رحمة وحدها
  alternative: «عادلًا»، أو صياغة تفسيرية تجعل رحمته وحدها معنى برّه
  rationale: يجمع النص بين بر يوسف وامتناعه عن تعريض مريم للعار، وتُبقي الترجمة هذا التوتر الأخلاقي قائمًا بدل حسمه ضمن تصور لاهوتي خاص.
- issue: الوضع القانوني ليوسف ومريم
  choice: «زوجها» و«يطلّقها» في المتن
  alternative: «خطيبها» و«يفسخ خطبته منها»، أو «رجلها» و«يصرفها» بصورة أكثر حرفية
  rationale: كانت الخطبة اليهودية ملزمة قانونًا وتحتاج إلى طلاق لإنهائها. تنقل الألفاظ المختارة هذه الحقيقة للقارئ المعاصر، مع إثبات البدائل في الحواشي.
- issue: العلاقة بين بر يوسف وقراره
  choice: الحفاظ على اقتران كونه بارًّا بعدم إرادته التشهير بها، بلا تفسير سببي صريح
  alternative: «فلأنه كان بارًّا...» بما قد يجعل القرار نتيجة محددة للبر
  rationale: صيغة اسم الفاعل اليونانية تقدم خلفية للقرار، لكنها لا تشرح ماهية البر أو كيفية ارتباط عنصري الجملة به تفسيرًا كاملًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت ألفاظ كتابية مألوفة مثل «بارًّا»، مع تجنب التراكيب القديمة الثقيلة. وُضعت علامات الحواشي مباشرة بعد العبارات التي تشرحها.
