id: MAT.1.17
reference: Matthew 1:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: ar
  text: وهكذا، بلغ عدد الأجيال كلها من إبراهيم إلى داود أربعة عشر جيلًا، ومن داود إلى الترحيل إلى بابل أربعة عشر جيلًا، ومن الترحيل إلى بابل إلى المسيح أربعة عشر جيلًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: وهكذا، بلغ عدد الأجيال كلها
  rationale: تفيد οὖν الانتقال إلى خلاصة ما سبق، فنُقلت بـ«وهكذا». وتحفظ «الأجيال كلها» دلالة Πᾶσαι αἱ γενεαί، بينما تجعل عبارة «بلغ عدد» التركيب العددي طبيعيًّا وواضحًا في العربية.
- source_word: γενεαὶ
  choice: الأجيال / جيلًا
  rationale: تشير الكلمة هنا إلى الأجيال المتعاقبة في سلسلة النسب؛ لذلك فـ«الأجيال» هي المقابل العربي المباشر والواضح.
- source_word: ἀπὸ ... ἕως
  choice: من ... إلى
  rationale: ينقل هذا التركيب حدود كل مرحلة من مراحل سلسلة النسب بدقة وبأسلوب عربي مألوف.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: الترحيل إلى بابل
  rationale: تدل μετοικεσία على نقل الناس من موطنهم قسرًا؛ و«الترحيل إلى بابل» يحفظ معنى الحدث التاريخي من غير تحويله إلى مجرد حالة أسر أو إقامة في المنفى.
- source_word: τοῦ χριστοῦ
  choice: المسيح
  rationale: تأتي الكلمة مع أداة التعريف وفي ذروة سلسلة النسب بوصفها لقبًا، والمقابل العربي الراسخ والدال على اللقب هو «المسيح».
- source_word: γενεαὶ δεκατέσσαρες
  choice: أربعة عشر جيلًا
  rationale: صياغة عربية مباشرة تحافظ على العدد وعلى تكرار العبارة في الأقسام الثلاثة.
theological_decisions:
- issue: دلالة Χριστός في ختام سلسلة النسب
  choice: المسيح
  alternative: الممسوح
  rationale: السياق يستعمل اللفظ لقبًا مسيانيًّا لا اسمًا شخصيًّا مجردًا. «المسيح» هو المقابل العربي المألوف الذي يحفظ هذه الوظيفة، بينما «الممسوح» يشرح الاشتقاق لكنه غير طبيعي هنا.
- issue: وصف الحدث البابلي
  choice: الترحيل إلى بابل
  alternative: السبي إلى بابل
  rationale: اختيرت عبارة تبرز فعل النقل القسري الذي تدل عليه μετοικεσία. أما «السبي» فمألوف كتابيًّا، لكنه قد يركّز على الأسر أكثر من الترحيل نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ البناء الثلاثي المتوازي والتكرار المقصود لعبارة «أربعة عشر جيلًا»، مع صياغة افتتاحية طبيعية تتجنب الركاكة الناتجة عن الإسناد العددي المباشر إلى جمع «الأجيال».
