base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: ar
  text: ستلد ابنًا، وستسمّيه يسوع[a]، لأنه هو سيخلّص شعبه من خطاياهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «يسوع» هو المقابل اليوناني للاسم العبري/الآرامي «يشوع»، المرتبط بمعنى «الرب يخلّص»؛ وتعليل متّى «لأنه هو سيخلّص» يعكس هذا التلاعب اللفظي.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: ستلد
  rationale: فعل مستقبل في سياق الولادة؛ «ستلد» صياغة عربية طبيعية موجزة وتحفظ القوة التنبؤية.
- source_word: δὲ
  choice: —
  rationale: أداة ربط خفيفة، ولا يلزم تمثيلها صراحة هنا لأن العربية تستقيم من دونها.
- source_word: υἱὸν
  choice: ابنًا
  rationale: النكرة في إعلان الولادة تُنقل طبيعيًا بالنصب المنوّن.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: وتسمّيه
  rationale: ينقل صيغة التسمية اليونانية إلى تعبير عربي واضح وطبيعي من غير الإخلال بالمعنى.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المعيارية لاسم الشخص في العهد الجديد، مع شرح الصلة اللغوية في الحاشية.
- source_word: αὐτὸς
  choice: هو
  rationale: إثبات الضمير المنفصل بعد «لأنه» يحفظ قدرًا طبيعيًا من التوكيد الموجود في اليونانية من غير مبالغة مثل «هو نفسه».
- source_word: γὰρ
  choice: لأنه
  rationale: تُدخل تعليل الاسم وتفسيره بوضوح في العربية.
- source_word: σώσει
  choice: سيخلّص
  rationale: ينقل معنى الإنقاذ والخلاص، وهو الأنسب مع «شعبه» و«من خطاياهم».
- source_word: τὸν λαὸν αὐτοῦ
  choice: شعبه
  rationale: يحفظ علاقة الملكية والإيحاء الجماعي العهدي من غير حصر المقصود أو توسيعه تفسيرًا.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: من خطاياهم
  rationale: تحفظ «من» دلالة الانفصال، ويحفظ الجمع الإشارة إلى الخطايا بصيغة الجمع.
theological_decisions:
- issue: توكيد الفاعل αὐτὸς في عمل يسوع الخلاصي
  choice: لأنه هو سيخلّص
  alternative: لأنه سيخلّص؛ لأنه هو نفسه سيخلّص
  rationale: الضمير المنفصل «هو» يصون التوكيد اليوناني بصورة عربية طبيعية، من غير زيادة تفسيرية ثقيلة.
- issue: نطاق «شعبه»
  choice: شعبه
  alternative: شعبه إسرائيل؛ جميع الذين ينتمون إليه
  rationale: العبارة في الآية غير مقيّدة صراحة، لذلك تُترك على سعتها النصية من دون تضييقها على إسرائيل وحده أو توسيعها إلى البشرية كلها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تسمّيه» بدل النقل الحرفي الأثقل «تدعو اسمه»، مع إبقاء التوكيد الطبيعي في «هو سيخلّص» وإثبات علامة الحاشية في المتن.
