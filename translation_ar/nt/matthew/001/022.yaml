lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: وقد حدث هذا كله
  rationale: تشير العبارة إلى الأحداث السابقة بوصفها كُلًّا واحدًا، وتؤكد كلمة ὅλον شمولها. وتنقل الواو الانتقال السردي الذي تؤديه δὲ من غير أن توحي بتعارض قوي.
- source_word: γέγονεν
  choice: حدث
  rationale: فعل تام من γίνομαι يدل هنا على وقوع الأحداث المذكورة؛ و«حدث» تعبير عربي طبيعي واضح في السياق السردي.
- source_word: ἵνα πληρωθῇ
  choice: لكي يتم
  rationale: تحافظ الصياغة على صيغة الغاية أو النتيجة وعلى المبني للمجهول من حيث المعنى، من غير حسم التوتر بين القصد والنتيجة.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: ما تكلم به الرب
  rationale: صياغة عربية طبيعية تنقل أن الرب هو المتكلم الأصلي، من غير إضافة لفظ «الله» غير الموجود صراحة في النص اليوناني.
- source_word: διὰ τοῦ προφήτου
  choice: على لسان النبي
  rationale: تعبير عربي مألوف يحفظ معنى الوساطة في διά مع المضاف إليه، ويميز النبي بوصفه الواسطة البشرية للكلام.
- source_word: λέγοντος
  choice: القائل
  rationale: اسم الفاعل يعرّف النبي ويهيئ مباشرة للاقتباس الوارد في العدد التالي، محافظًا على الصلة النحوية باللفظ «النبي».
theological_decisions:
- issue: الفاعلية في الكلام النبوي
  choice: ما تكلم به الرب على لسان النبي
  alternative: ما قيل من الرب بواسطة النبي
  rationale: تُظهر الصياغة الرب مصدر الكلام والنبي واسطته، وفق التمييز اليوناني بين ὑπό وδιά، من غير توسيع العبارة إلى تقرير مذهبي يتجاوز النص.
- issue: صيغة الإتمام
  choice: لكي يتم
  alternative: حتى تم
  rationale: تحفظ «لكي» احتمال الغاية والنتيجة في ἵνα مع صيغة الالتزام، فلا تحصر العبارة في مجرد نتيجة تاريخية ولا تفرض عليها حتمية آلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «على لسان» لأنه طبيعي في العربية ويحفظ تمييز النص بين الرب بوصفه مصدر الكلام والنبي بوصفه واسطته، واستُبقيت صيغة «النبي القائل» لتمهيد الاقتباس التالي.
