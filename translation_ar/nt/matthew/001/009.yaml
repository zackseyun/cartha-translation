id: MAT.1.9
reference: Matthew 1:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: ar
  text: وَعُزِّيَّا أَنْجَبَ يُوثَامَ[a]، وَيُوثَامُ أَنْجَبَ آحَازَ، وَآحَازُ أَنْجَبَ حَزَقِيَّا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفعل اليوناني ἐγέννησεν يُترجم تقليديًا «وَلَدَ»؛ واستُخدمت هنا «أَنْجَبَ» بوصفها مقابلًا حديثًا واضحًا في سياق سلسلة النسب.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: عُزِّيَّا
  rationale: استُخدم الاسم العربي الكتابي المألوف للملك المعروف في العهد القديم، بدلًا من نقل الصورة اليونانية صوتيًا على نحو غريب عن القارئ العربي.
- source_word: δὲ
  choice: وَ
  rationale: تؤدي الأداة هنا وظيفة رابط خفيف يواصل سلسلة النسب، والواو العربية تحفظ انسياب الصيغة المتكررة.
- source_word: ἐγέννησεν
  choice: أَنْجَبَ
  rationale: فعل عربي واضح ومعاصر يدل في سياق النسب على الأبوة، ويحفظ إيجاز الصيغة اليونانية وتكرارها دون اللجوء إلى التعبير التراثي «وَلَدَ» الذي قد يلتبس في الاستعمال الحديث.
- source_word: Ἰωαθάμ
  choice: يُوثَامَ
  rationale: الصيغة العربية الكتابية المألوفة لاسم ملك يهوذا.
- source_word: Ἀχάζ
  choice: آحَازَ
  rationale: الصيغة العربية الكتابية المألوفة للاسم، الموافقة لهوية ملك يهوذا المعروف من العهد القديم.
- source_word: Ἑζεκίαν
  choice: حَزَقِيَّا
  rationale: الصيغة العربية الكتابية المألوفة لاسم الملك المعروف في العهد القديم.
theological_decisions:
- issue: الدلالة النَّسَبية للفعل γεννάω
  choice: أَنْجَبَ
  alternative: كان أبا / صار أبا / كان سلفًا
  rationale: تحفظ «أنجب» دلالة الصيغة النَّسَبية وإيقاعها المتكرر، من غير توسيع تفسيري إلى معنى «كان سلفًا». ومع أن سلاسل الأنساب الكتابية قد تختصر أجيالًا، فإن نص هذه الآية يعرض تعاقبًا أبويًا مباشرًا، ولذلك لم يُدخل التوسع في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع الحفاظ على البنية المتوازية المتكررة لسلسلة النسب. ضُبطت الأسماء والفعل ضبطًا جزئيًا لتيسير القراءة ومنع الالتباس، ووُضع التنوين أو الفتح المناسب في الأسماء الممنوعة من الصرف بحسب موقعها.
