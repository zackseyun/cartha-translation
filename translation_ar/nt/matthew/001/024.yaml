  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: ar
  text: فلمّا استيقظ يوسف من النوم، فعل كما أمره ملاك الرب، وأخذ زوجته إليه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قَبِل زوجته» أو «أخذ زوجته إلى بيته». يمكن أن يحمل الفعل اليوناني معنى أخذ شخص إلى كنف المرء أو بيته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: فلمّا استيقظ يوسف من النوم
  rationale: تنقل الصياغة العربية تسلسل السرد ودلالة النهوض من النوم بصورة طبيعية، من غير تكلف في محاكاة اسم الفاعل اليوناني.
- source_word: ἐποίησεν ὡς προσέταξεν αὐτῷ
  choice: فعل كما أمره
  rationale: تحفظ المطابقة بين فعل يوسف والأمر الذي تلقّاه، وتنقل قوة προστάσσω بوصفه أمرًا ذا سلطان.
- source_word: ὁ ἄγγελος κυρίου
  choice: ملاك الرب
  rationale: تعبير عربي كتابي واضح يقابل التركيب اليوناني ويحفظ لفظ «الرب» لـκύριος.
- source_word: παρέλαβεν
  choice: أخذ ... إليه
  rationale: يفيد الفعل اليوناني الأخذ أو القبول إلى الشخص، وإضافة «إليه» تحفظ هذا البعد من غير أن تحصر المعنى في إدخالها منزلًا بعينه.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: زوجته
  rationale: السياق القانوني والاجتماعي للخطبة يجيز معنى «الزوجة»، من غير أن يدل ذلك بذاته على إتمام العلاقة الزوجية.
theological_decisions:
- issue: معنى γυνή قبل إتمام العلاقة الزوجية
  choice: زوجته
  alternative: المرأة التي له
  rationale: يعامل السياق مريم ضمن إطار زواجي قانوني، مع بقاء ما يذكره العدد التالي عن عدم المعاشرة محفوظًا دون استباق أو طمس.
- issue: ترجمة κύριος في عبارة ἄγγελος κυρίου
  choice: ملاك الرب
  alternative: ملاك يهوه
  rationale: تحفظ «الرب» اللفظ اليوناني والصيغة الكتابية المألوفة، ولا تستبدل به اسمًا غير وارد صراحة في النص اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «فلمّا» لتدفق السرد، و«أخذ زوجته إليه» لإبقاء سعة معنى παραλαμβάνω، مع بيان البدائل في الحاشية.
