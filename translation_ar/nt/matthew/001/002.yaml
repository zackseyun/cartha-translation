lexical_decisions:
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: في سياق النسب يدل الفعل على الأبوة والإنجاب. و«أنجب» تعبير عربي فصيح واضح وموجز، يحفظ جهة النسب من الأب من غير أن يحسم ما إذا كانت كل حلقة مباشرة في جميع استعمالات الأنساب.
- source_word: δὲ
  choice: الواو
  rationale: تؤدي δέ هنا وظيفة وصل خفيفة في تسلسل النسب، لا معنى الاستدراك؛ لذلك تناسبها الواو العربية الطبيعية.
- source_word: Ἰούδαν
  choice: يهوذا
  rationale: المقصود يهوذا ابن يعقوب، وتلك هي الصيغة العربية الكتابية الشائعة لاسمه.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: إخوته
  rationale: اللفظ اليوناني مذكر ويشير في السياق إلى إخوة يهوذا الذكور، أي سائر أبناء يعقوب.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: إبراهيم / إسحاق / يعقوب
  rationale: استُعملت الصيغ العربية الراسخة لأسماء الآباء.
theological_decisions:
- issue: صياغة فعل النسب
  choice: استعمال «أنجب»
  alternative: «ولد» أو «صار أبًا لـ»
  rationale: تحفظ «أنجب» معنى الأبوة في سلسلة النسب بلغة عربية حديثة، من غير إضافة دعوى لاهوتية أو افتراض غير مصرح به بشأن مباشرة كل حلقة من حلقات النسب.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع تكرار «أنجب» للمحافظة على إيقاع سلسلة النسب. أُبقيت الفاصلة الختامية لأن الآية جزء من جملة النسب المتواصلة.
