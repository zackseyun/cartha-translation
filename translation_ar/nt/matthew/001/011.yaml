    text: 'أو: «عند السبي إلى بابل». يمكن أن يدل اللفظ اليوناني على الترحيل القسري أو على السبي والمنفى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: أَنْجَبَ
  rationale: يفيد الفعل في سياق سلسلة النسب الأبوة أو الانتساب من جهة الأب. و«أنجب» موجز وطبيعي في العربية المعاصرة، ويحافظ على صيغة السلسلة دون أن يحسم ما إذا كانت كل حلقة أبوة مباشرة، إذ قد تتضمن الأنساب اختصارًا للأجيال.
- source_word: Ἰεχονίαν
  choice: يَكُنْيَا
  rationale: صيغة عربية معروفة للاسم الكتابي، تقابل الاسم اليوناني Ἰεχονίας وتنسجم مع الاستعمال العربي الشائع.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: إِخْوَتَهُ
  rationale: اللفظ اليوناني جمع مذكر، ولذلك نُقل بلفظ «إخوته» لا بلفظ عام محايد.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: عِنْدَ السَّبْيِ إِلَى بَابِلَ
  rationale: تؤدي «عند» الدلالة الزمنية للتركيب ἐπί مع المضاف إليه، وتعبّر «السبي» عن الترحيل القسري والمنفى معًا، بينما توضّح «إلى بابل» جهة الانتقال المقصودة.
- source_word: δὲ
  choice: وَ
  rationale: أُثبت الرابط الخفيف بواو العطف، وهو طبيعي في تتابع سلسلة النسب العربية ولا يثقّل العبارة.
theological_decisions:
- issue: اختصار الأجيال في نسب متّى
  choice: نقل صيغة النسب كما وردت من غير محاولة حل الإشكال التاريخي في المتن
  alternative: تفسير «أنجب» صراحةً بمعنى أنه كان سلفًا ليكنيا لا أباه المباشر
  rationale: قد تختصر الأنساب أجيالًا، لكن النص اليوناني يستخدم الصيغة النسبية المعتادة. تحافظ «أنجب» على هذه الصيغة وتترك مقدار المباشرة في النسب دون شرح توافقي مُقحم.
- issue: دلالة μετοικεσία بين الحدث والحالة
  choice: السبي
  alternative: الترحيل إلى بابل؛ المنفى في بابل
  rationale: يمكن أن يشير اللفظ إلى الترحيل القسري أو إلى السبي/المنفى المرتبط به. اختير «السبي» لأنه تعبير عربي واضح يجمع بقدر مناسب بين الحدث القسري والحالة التاريخية، مع إثبات البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة وقورة ملائمة لسلسلة النسب. استُخدم الضبط الجزئي/الكامل في المتن لتوضيح الأسماء والبنية، مع تجنب الألفاظ القديمة غير المألوفة مثل «وَلَدَ» بمعناها النسبي المحتمل الالتباس أو «استولد».
