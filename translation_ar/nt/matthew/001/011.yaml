review_pass:
  verdict: revise
  source_fidelity: 'المتن يحافظ على عناصر اليونانية الأساسية: يوشيا، ويكنيا وإخوته، والإطار الزمني المرتبط بالـμετοικεσία البابلية. غير أن «السبي» قد يدل في العربية أولًا على حالة الأسر/المنفى، بينما تشير μετοικεσία في هذا الموضع بوضوح مناسب إلى حدث النقل أو الترحيل؛ لذا فـ«الترحيل إلى بابل» أدق في المتن.'
  naturalness: «عند السبي إلى بابل» مفهومة، لكنها أقل سلاسة وتحديدًا من «وقت الترحيل إلى بابل». والصياغة المعدلة فصحى حديثة موجزة وتلائم أسلوب سلسلة النسب.
  terminology: «أنجب» مناسب لصيغة γεννάω النسبية ولا يفرض معالجة لمسألة اختصار الأجيال. «يكنيا» صيغة عربية شائعة للاسم. ويُستحسن جعل الحاشية بديلًا حقيقيًا للمتن، إذ كانت الحاشية الحالية تعرض «وقت الترحيل إلى بابل» بوصفه بديلًا بينما هذا هو اللفظ المعتمد بعد التصحيح.
  issues:
  - severity: medium
    issue: «السبي» في المتن لا يبرز بقدر كافٍ حدث النقل القسري الذي تدل عليه μετοικεσία، وعبارة «عند السبي إلى بابل» أقل طبيعية.
    rationale: التركيب اليوناني مؤقت ويشير إلى التهجير/الترحيل المرتبط ببابل؛ «وقت الترحيل إلى بابل» ينقل الحدث والزمن بوضوح دون تجاوز دلالة المصدر.
  - severity: low
    issue: الحاشية الحالية ليست بديلًا فعليًا إذا صار المتن «وقت الترحيل إلى بابل».
    rationale: ينبغي أن تعرض الحاشية قراءة عربية بديلة، مثل «عند السبي إلى بابل»، مع بيان سعة الدلالة المعجمية.
