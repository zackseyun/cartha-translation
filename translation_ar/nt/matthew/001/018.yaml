  source_fidelity: 'النص يحافظ على عناصر اليونانية الأساسية: «ميلاد» لـγένεσις في السياق، و«يسوع المسيح» للقب Χριστός، وبنية بيان الكيفية في «فكان هكذا»، وحالة الخطبة الرسمية، والكناية غير المصرَّح بها في «قبل أن يجتمعا»، والمبني للمجهول في «وُجدت»، ودلالة الحمل، وكون الحمل «من الروح القدس». لا يضيف فاعلًا إلى «وُجدت» ولا يحسم معنى συνελθεῖν بما يتجاوز ما يتيحه الأصل.'
