id: MAT.1.18
reference: Matthew 1:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: ar
  text: 'أَمَّا مِيلَادُ يَسُوعَ الْمَسِيحِ[a] فَكَانَ هَكَذَا: لَمَّا كَانَتْ أُمُّهُ مَرْيَمُ مَخْطُوبَةً لِيُوسُفَ[b]، وَقَبْلَ أَنْ يَجْتَمِعَا[c]، وُجِدَتْ حُبْلَى مِنَ الرُّوحِ الْقُدُسِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح»، وهو ترجمة الكلمة اليونانية Χριστός.
    reason: lexical_note
  - marker: b
    text: كانت الخطبة آنذاك ارتباطًا رسميًّا معترفًا به قانونيًّا، وألزم من الخطبة بمفهومها الشائع اليوم.
    reason: cultural_note
  - marker: c
    text: قد تفيد عبارة «أن يجتمعا» أنهما لم يكونا قد أتما اتحادهما الزوجي بعد.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: مِيلَاد
  rationale: يدل اللفظ في هذا السياق على ميلاد يسوع ومجيئه إلى العالم، و«ميلاد» تعبير عربي طبيعي ينسجم مع الرواية التالية، مع بقاء احتمال معنى النشأة أو الأصل في الخلفية.
- source_word: Ἰησοῦ χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: استُعمل «المسيح» بوصفه لقبًا ذا معنى، لا اسم عائلة، وهو المقابل العربي الراسخ لـΧριστός.
- source_word: οὕτως ἦν
  choice: فَكَانَ هَكَذَا
  rationale: ينقل الأسلوب الذي يمهّد لبيان كيفية وقوع الحدث بصياغة عربية موجزة وطبيعية.
- source_word: μνηστευθείσης
  choice: كَانَتْ ... مَخْطُوبَةً
  rationale: ينقل حالة الخطبة الرسمية القائمة آنذاك، ويشرح الهامش قوتها القانونية في ذلك المجتمع.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: قَبْلَ أَنْ يَجْتَمِعَا
  rationale: يحافظ على الكناية المحتشمة والقدر الموجود في اليونانية من عدم التحديد، من غير قصرها صراحة على السكن المشترك أو العلاقة الزوجية.
- source_word: εὑρέθη
  choice: وُجِدَتْ
  rationale: يحافظ على صيغة المبني للمجهول في الأصل من غير إضافة فاعل أو تفسير لكيفية انكشاف الأمر.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: حُبْلَى
  rationale: مقابل عربي واضح وموجز للتعبير الاصطلاحي الدال على الحمل.
- source_word: ἐκ πνεύματος ἁγίου
  choice: مِنَ الرُّوحِ الْقُدُسِ
  rationale: تنقل «مِن» دلالة المصدر أو المنشأ في ἐκ، ويشير السياق إلى الروح القدس.
theological_decisions:
- issue: دلالة Χριστός
  choice: الْمَسِيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الراسخ الذي يحفظ الدلالة المسيانية للكلمة اليونانية، أما «الممسوح» فحرفي لكنه غير طبيعي هنا وقد يحجب هوية اللقب لدى القارئ.
- issue: مرجع πνεύματος ἁγίου
  choice: الرُّوح الْقُدُس
  alternative: روح مقدسة
  rationale: السياق يتحدث عن الروح القدس بوصفه المرجع الإلهي المعروف؛ وغياب أداة التعريف في اليونانية لا يوجب التنكير في العربية.
- issue: مدى دلالة συνελθεῖν
  choice: يَجْتَمِعَا
  alternative: تقوم بينهما علاقة زوجية
  rationale: أُبقيت الكناية التي يحتمل أن تشمل الدخول في الحياة الزوجية وإتمام الزواج، بدل حسم العبارة في معنى واحد أصرح من النص.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة. استُعمل تركيب «أمّا ... فـ» لنقل الانتقال الخطابي الذي تؤديه δέ من غير إدخال ظرف زمني مثل «الآن». وُضعت علامات الهوامش عند الألفاظ التي تشرحها مباشرة، وحُفظت الكناية في «يجتمعا» وصيغة المبني للمجهول في «وُجدت».
