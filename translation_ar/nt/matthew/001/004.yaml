  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: ar
  text: وَأَرَامُ أَنْجَبَ عَمِّينَادَابَ، وَعَمِّينَادَابُ أَنْجَبَ نَحْشُونَ، وَنَحْشُونُ أَنْجَبَ سَلْمُونَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρὰμ
  choice: أَرَام
  rationale: نقل صوتي مباشر للاسم اليوناني Ἀράμ، وهو واضح في العربية ولا يحتاج إلى حاشية بديلة؛ إذ إن «رام» في بعض الترجمات غير العربية متأثر بصورة الاسم العبرية.
- source_word: δὲ
  choice: الواو
  rationale: تؤدي δέ هنا وظيفة الربط وتتابع سلسلة النسب، لا الاستدراك؛ لذلك تنقلها الواو العربية بصورة طبيعية.
- source_word: ἐγέννησεν
  choice: أَنْجَبَ
  rationale: الفعل γεννάω في سياق النسب يدل على الأبوة أو الامتداد النسبي. «أنجب» تعبير عربي حديث موجز وواضح، ويحافظ هنا على الصياغة المباشرة للنص.
- source_word: Ἀμιναδάβ
  choice: عَمِّينَادَاب
  rationale: صيغة عربية مألوفة للاسم الكتابي، تقرّبه من أصله السامي وتتيح التعرف إليه في سياق الأنساب.
- source_word: Ναασσών
  choice: نَحْشُون
  rationale: اعتماد الصورة العربية المألوفة المقابلة للاسم العبري بدل النقل الحرفي للصيغة اليونانية، حفاظًا على اتساق أسماء الشخصيات الكتابية.
- source_word: Σαλμών
  choice: سَلْمُون
  rationale: صيغة عربية واضحة ومألوفة للاسم، وتمثل الاسم اليوناني في هيئة منسجمة مع أصله السامي.
theological_decisions: []
