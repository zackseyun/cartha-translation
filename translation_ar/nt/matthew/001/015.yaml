  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: ar
  text: وَأَنْجَبَ أَلِيهُودُ أَلِعَازَارَ، وَأَنْجَبَ أَلِعَازَارُ مَتَّانَ، وَأَنْجَبَ مَتَّانُ يَعْقُوبَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: أَلِيُودُ
  rationale: نقل صوتي للاسم اليوناني إلى العربية بصيغة واضحة، مع إظهار حركة الإعراب في السياق.
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط خفيفة تتابع سلسلة النسب؛ والواو هي المقابل العربي الطبيعي غير الموسوم في هذا السياق.
- source_word: ἐγέννησεν
  choice: أَنْجَبَ
  rationale: يدل الفعل في سياق سلسلة النسب على الأبوة والنسل. «أنجب» تعبير عربي حديث وموجز، ويتجنب عتق «ولد» المتعدي واحتمال التباسه بالفعل المبني للمجهول عند غياب الضبط.
- source_word: τὸν
  choice: غير مترجم على حدة
  rationale: أداة التعريف اليونانية هنا تسبق اسم العلم بوصفه مفعولًا به، ولا يقابلها في العربية أداة تعريف مع أسماء الأعلام.
- source_word: Ἐλεάζαρ
  choice: أَلِعَازَارَ
  rationale: اعتماد الصيغة العربية الكتابية المألوفة للاسم، مع ضبط موقعه الإعرابي بحسب السياق.
- source_word: Ματθάν
  choice: مَتَّانَ
  rationale: نقل صوتي واضح للاسم اليوناني Ματθάν، مع الشدة لتمثيل الصامت المضاعف.
- source_word: Ἰακώβ
  choice: يَعْقُوبَ
  rationale: اعتماد الصيغة العربية الراسخة للاسم الكتابي.
theological_decisions: []
