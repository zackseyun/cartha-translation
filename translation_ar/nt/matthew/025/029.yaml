source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: ar
  text: لأن كلَّ من له سيُعطى، ويكون في وفرة[a]؛ وأما من ليس له، فحتى ما له سيُؤخذ منه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويَفيض».'
    reason: بديل لفظي أقرب إلى الفعل اليوناني περισσευθήσεται، الذي قد يفيد بلوغ الوفرة أو الفيض.
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: لأن كلَّ من له
  rationale: تنقل «لأن» وظيفة γάρ التفسيرية، وتحافظ «كل من له» على القوة التوزيعية للتركيب الاسمي المفرد، من غير إضافة مفعول غير مذكور في اليونانية.
- source_word: δοθήσεται
  choice: سيُعطى
  rationale: صيغة مستقبل مبني للمجهول، وقد حُفظ المبني للمجهول كما في المصدر.
- source_word: καὶ περισσευθήσεται
  choice: فيكون له بوفرة
  rationale: 'تعبير عربي طبيعي عن النتيجة التي تدل عليها περισσεύω: أن يصير للإنسان فائض أو وفرة. وجاءت الفاء لتبيين النتيجة التي يصل إليها السياق، مع إثبات البديل الأقرب لفظًا في الحاشية.'
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: وأما من ليس له
  rationale: يحفظ المقابلة وصيغة المفرد التمثيلي في العبارة اليونانية، من غير تحديد الشيء غير المذكور الذي ليس له.
- source_word: καὶ ὃ ἔχει
  choice: فحتى ما له
  rationale: 'تؤدي «حتى» المعنى التصاعدي لـ καί هنا، فتبرز المفارقة: سيُنزع منه حتى الموجود لديه.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: سيُؤخذ منه
  rationale: يحفظ المستقبل المبني للمجهول ومعنى النزع والانفصال الذي تفيده αἴρω مع ἀπό، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: الإشارة العامة في صيغتي اسم الفاعل المفردتين
  choice: 'الإبقاء على المفرد التمثيلي: «كل من له ... من ليس له»'
  alternative: 'التحويل إلى الجمع: «الذين لهم ... الذين ليس لهم»'
  rationale: تستعمل اليونانية صيغًا مفردة ذات دلالة عامة. وتحافظ الصياغة العربية على هذا البناء من غير قصر القول على الذكور، إذ إن «من» عامة من حيث الدلالة.
- issue: عدم التصريح بالشيء الذي «له» أو «ليس له»
  choice: ترك المفعول غير مصرّح به كما في اليونانية
  alternative: إضافة اسم مثل «المال» أو «المواهب» بحسب سياق المثل
  rationale: النص اليوناني يتعمد الإطلاق، وإضافة شيء محدد قد تحسم دلالة المثل تفسيريا أو لاهوتيا دون سند لفظي مباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وأما» لإظهار المقابلة بجلاء، وحُفظت الأفعال المبنية للمجهول والإيجاز المقصود في الأصل.
