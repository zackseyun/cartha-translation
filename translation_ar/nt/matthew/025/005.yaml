  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: ar
  text: ولكن بينما تأخّر العريس[a]، نعسن جميعهنّ ونمن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بينما كان العريس يستغرق وقتًا طويلًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نعسن جميعهنّ وكنّ نائمات». يميّز اليوناني بين بدئهنّ بالنعاس (ἐνύσταξαν) واستمرارهنّ في النوم (ἐκάθευδον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: أبطأ
  rationale: يفيد الفعل أن العريس استغرق وقتًا أطول مما كان متوقعًا. و«أبطأ» تعبير عربي موجز وطبيعي يحفظ معنى التأخر من غير إضافة سبب له.
- source_word: δὲ
  choice: ولكن
  rationale: تشير الأداة إلى انتقال سردي فيه مقابلة خفيفة بين انتظار العريس وتأخره وما نتج عنه.
- source_word: νυμφίου
  choice: العريس
  rationale: هو اللفظ العربي الواضح والدقيق للرجل في سياق العرس، ويحفظ صورة المثل من غير توسيع تفسيري.
- source_word: ἐνύσταξαν
  choice: نعسن
  rationale: يحفظ معنى بدء الشعور بالنعاس، ويميّزه عن النوم الفعلي المذكور بعده.
- source_word: πᾶσαι
  choice: كلهنّ
  rationale: تعود صيغة المؤنث الجمع إلى العذارى العشر، وتؤكد أن النعاس والنوم شملاهن جميعًا.
- source_word: ἐκάθευδον
  choice: نمن
  rationale: ينقل معنى النوم بوضوح، مع إبقاء التدرج من النعاس إلى النوم. وتوضح الحاشية إمكان إبراز دلالة الاستمرار في صيغة الفعل اليونانية.
theological_decisions:
- issue: الصورة المَثَلية للعريس
  choice: الإبقاء على «العريس» بوصفه شخصية المثل من غير التصريح بهوية لاهوتية ضمن نص الآية
  alternative: إضافة تعريف تفسيري للعريس أو استبدال الصورة بلفظ عام
  rationale: قد تحمل صورة العريس دلالة أوسع في سياق إنجيل متى، لكن الآية نفسها تسرد المثل مباشرة؛ لذلك تُحفَظ الصورة وما فيها من دلالة محتملة من غير حسم تفسيري داخل الترجمة.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات نبرة سردية كريمة. استُعملت صيغ الجمع المؤنث لأن المرجع هو العذارى، وحُفظ التمييز بين النعاس والنوم مع تجنب الألفاظ العتيقة مثل «أبطأ في القدوم» أو «توانى» حين لا تلزم.
