lexical_decisions:
- source_word: ὡσαύτως
  choice: وكذلك
  rationale: تفيد مماثلة فعل هذا العبد لفعل العبد السابق في العدد 16، وتحافظ على قوة الربط والمقارنة بصياغة عربية موجزة وطبيعية.
- source_word: ὁ τὰ δύο
  choice: الذي معه الوزنتان
  rationale: التركيب اليوناني موجز ومحذوف منه ما يُفهم من السياق، ويشير إلى العبد المرتبط بالوزنتين المذكورتين سابقًا. تحافظ الصياغة على هذا الإيجاز، مع إظهار المعدود الذي يوضحه السياق.
- source_word: ἐκέρδησεν
  choice: ربح
  rationale: يدل الفعل هنا على تحصيل مال إضافي من نشاط ناجح؛ و«ربح» هو التعبير العربي الطبيعي الملائم للسياق المالي.
- source_word: ἄλλα δύο
  choice: وزنتين أخريين
  rationale: يدل التعبير على اثنتين إضافيتين من النوع نفسه؛ وإظهار «وزنتين» ضروري في العربية لوضوح المعدود، و«أخريين» تنقل معنى الإضافة.
