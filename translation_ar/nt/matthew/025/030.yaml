  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ar
  text: والعبد[a] عديم النفع فألقوه في الظلمة الخارجية؛ هناك يكون البكاء وصرير الأسنان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الكلمة اليونانية: «الخادم». فكلمة δοῦλος قد تدل على عبد أو خادم؛ واستُعملت «العبد» هنا لأن علاقة التبعية والملكية بارزة في سياق المثل.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: عديم النفع
  rationale: ينقل معنى من لا فائدة منه في تقدير سيده، ويحافظ على شدة الحكم من غير إدخال معنى أخلاقي زائد مثل «شرير».
- source_word: δοῦλον
  choice: العبد
  rationale: «عبد» أنسب لعلاقة السيد بالمملوك في سياق المثل، مع الإشارة في الحاشية إلى إمكان ترجمة اللفظة «خادمًا» بحسب السياق.
- source_word: ἐκβάλετε
  choice: ألقوه
  rationale: صيغة أمر قوية تعبّر بوضوح عن الطرد القسري، وهي طبيعية وفصيحة في هذا السياق.
- source_word: σκότος τὸ ἐξώτερον
  choice: الظلمة الخارجية
  rationale: يحافظ هذا التعبير على الصورة المَتّاوية المألوفة، أي الإقصاء إلى الظلمة التي في الخارج، من غير تفسير عقائدي مضاف.
- source_word: ἐκεῖ
  choice: هناك
  rationale: إحالة مباشرة وطبيعية إلى المكان المذكور قبلها.
- source_word: κλαυθμὸς
  choice: البكاء
  rationale: ينقل الحزن والمعاناة دون المبالغة في تحديد شدتهما.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: صرير الأسنان
  rationale: تعبير عربي راسخ يحافظ على صورة الألم و/أو الغيظ من غير حصرها في تفسير واحد.
theological_decisions:
- issue: طبيعة صورة الدينونة في المثل
  choice: الإبقاء على صورتي الإقصاء والمعاناة كما وردتا، من غير التصريح بأنها جهنم أو تحديد نوع العقاب.
  alternative: تفسير الظلمة الخارجية صراحةً بأنها جهنم، أو قصرها على إقصاء زمني أو مجازي.
  rationale: يستعمل النص لغة دينونة مَتّاوية معروفة، لكن الترجمة ينبغي أن تحفظ صورة النص وتوتره اللاهوتي دون أن تضيف حسمًا تفسيريًا لا تصرّح به الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على قوة الأمر وصور الدينونة الملموسة، مع تجنب الألفاظ القديمة أو الشروح العقائدية داخل المتن.
