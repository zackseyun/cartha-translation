source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: ar
  text: 'فقال له سيده: «أحسنت، أيها العبد الصالح الأمين![a] كنت أمينًا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «العبد» بـ«الخادم»، لكن اللفظ اليوناني δοῦλος قد يدل على شخص مملوك لسيده، ولذلك اختير «العبد» هنا.
    reason: alternative_reading
  - marker: b
    text: يمكن أن تُترجم الكلمة اليونانية κύριος بـ«الرب»، لكن «السيد» أنسب لعلاقة السيد بعبده في سياق المثل.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ κύριος αὐτοῦ
  choice: فقال له سيده
  rationale: صياغة سردية عربية طبيعية تحفظ الفاعل وعلاقة السيد بالعبد من غير إثقال.
- source_word: Εὖ
  choice: أحسنت
  rationale: تؤدي عبارة الاستحسان في هذا المقام بصورة عربية موجزة وطبيعية.
- source_word: δοῦλε
  choice: أيها العبد
  rationale: «عبد» هو المقابل المباشر الذي يحفظ وضع الشخص الاجتماعي وعلاقته بسيده في المثل؛ وذُكر البديل الأخف «خادم» في الحاشية.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: الصالح الأمين
  rationale: تحفظ الصفتين المتميزتين، وتؤدي πιστός هنا بمعنى الثبات والجدارة بالائتمان.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: كنت أمينًا على القليل
  rationale: تحفظ تكرار جذر الأمانة، كما تبقي «القليل» عامًا من دون تحديد ما لم يحدده النص.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: فسأقيمك على الكثير
  rationale: «أقيمك على» تنقل معنى التعيين في مسؤولية أو سلطة، وتحافظ على الموازاة بين القليل والكثير.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: ادخل إلى فرح
  rationale: تحفظ صورة الدخول التي في الأصل بدل تفسيرها مباشرة بمعنى المشاركة.
- source_word: κύριος
  choice: سيد
  rationale: «سيد» أنسب لعلاقة العبد بصاحب السلطة عليه داخل المثل، مع إبقاء «رب» بديلًا ممكنًا بحسب الدلالة الأوسع للكلمة اليونانية.
theological_decisions:
- issue: دلالة κύριος في مثل قد يحمل السيد فيه دلالة تمثيلية على الله أو المسيح
  choice: سيد
  alternative: رب
  rationale: السياق القصصي المباشر هو علاقة عبد بسيده؛ لذلك لا تُحوَّل الكلمة في الحوار إلى لقب لاهوتي صريح، مع التنبيه إلى البديل في الحاشية.
- issue: نقل δοῦλος في سياق العبودية المنزلية
  choice: عبد
  alternative: خادم
  rationale: يحفظ «عبد» العلاقة الاجتماعية والقانونية الأقوى في اللفظ اليوناني، بينما قد يكون «خادم» أنسب في بعض السياقات لكنه يخفف هذه الدلالة هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أحسنت» للاستحسان الطبيعي، وحُفظ التوازي بين «القليل» و«الكثير»، كما أُبقيت صورة «الدخول إلى الفرح» من غير تسطيحها إلى مجرد المشاركة.
