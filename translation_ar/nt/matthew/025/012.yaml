  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا أعترف بكنَّ». واليونانية حرفيًا: «لا أعرفكنَّ»، وقد تفيد في هذا السياق عدم الاعتراف بهنَّ على نحوٍ علائقي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: تؤدي الصيغة السردية اليونانية بصورة عربية طبيعية، وتفيد الفاء التعقيب والارتباط بما قبلها من التماس.
- source_word: Ἀμὴν
  choice: الحق
  rationale: تنقل صيغة التوكيد المهيبة في كلام يسوع بعبارة عربية واضحة ومألوفة، من غير إبقاء اللفظ المنقول صوتيًا «آمين».
- source_word: λέγω ὑμῖν
  choice: أقول لكنَّ
  rationale: ترجمة مباشرة وطبيعية، مع إظهار أن ضمير المخاطبات جمع مؤنث بحسب سياق العذارى في المثل.
- source_word: οὐκ οἶδα
  choice: لا أعرف
  rationale: تحفظ المعنى الأساسي للفعل اليوناني ولا تحسم ما ينطوي عليه السياق من عدم الاعتراف أو التنصل العلائقي.
- source_word: ὑμᾶς
  choice: كنَّ
  rationale: ضمير جمع المخاطبات هو الأنسب في العربية لأن الخطاب موجَّه إلى العذارى في سياق المثل.
theological_decisions:
- issue: دلالة «لا أعرفكنَّ» في المثل
  choice: 'الإبقاء على العبارة البسيطة ذات الثقل العلائقي: «لا أعرفكنَّ»'
  alternative: «لا أعترف بكنَّ» أو «ليست لي علاقة بكنَّ»
  rationale: يفيد السياق الإقصاء وعدم الاعتراف، لكن توسيع العبارة إلى تقرير عقائدي أدق من شأنه أن يحسم ما أبقاه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل جمع المؤنث في «لكنَّ/أعرفكنَّ» اتساقًا مع المخاطَبات في سياق المثل، مع المحافظة على الإيجاز والتوتر الدلالي في الأصل.
