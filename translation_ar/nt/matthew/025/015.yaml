  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: ar
  text: وأعطى لواحد خمس وزنات[a]، ولآخر وزنتين، ولآخر وزنة واحدة، لكل واحد بحسب قدرته[b]، وسافر. وفي الحال[c]...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الوزنة وحدة وزن كبيرة استُخدمت أيضًا كوحدة نقدية؛ والمقصود هنا مبلغ كبير، لا موهبة طبيعية.
    reason: توضيح معجمي وتاريخي يمنع فهم المصطلح بمعناه الحديث الشائع.
  - marker: b
    text: 'أو: «بحسب قدرة كل واحد».'
    reason: يوضح الصياغة التوزيعية لعبارة المفرد اليونانية.
  - marker: c
    text: تفتتح «وفي الحال» (εὐθέως) الجملة التالية في النص اليوناني، ويكتمل متعلقها في الآية 16؛ وعلامات الترقيم وأرقام الآيات تحريرية.
    reason: يحفظ موضع الظرف في النص المصدر واتصاله النحوي بما يلي.
lexical_decisions:
- source_word: τάλαντα
  choice: وزنات
  rationale: «الوزنة» مصطلح تاريخي عربي معروف لوحدة كبيرة من الوزن أو المال، ويحافظ على صورة المثل من غير تحويلها إلى عملة حديثة محددة أو الخلط بينها وبين الموهبة الطبيعية.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: واحدًا ... وآخر ... وآخر
  rationale: صياغة عربية طبيعية تُظهر توزيع المقادير على ثلاثة خدم مختلفين وتحفظ التقابل في التركيب اليوناني.
- source_word: ἕν
  choice: وزنة واحدة
  rationale: أُعيد الاسم في العربية لتجنب الالتباس ولأن التصريح به أسلس من حذف المعدود هنا.
- source_word: ἑκάστῳ
  choice: كلَّ واحد
  rationale: يحفظ المعنى التوزيعي للمفرد في الأصل بعبارة عربية واضحة.
- source_word: κατὰ τὴν ἰδίαν δύναμιν
  choice: على قدر طاقته
  rationale: تشير δύναμις هنا إلى قدرة الشخص واستطاعته، لا إلى قوة معجزية؛ وضمير المفرد يعود توزيعيًا إلى «كل واحد».
- source_word: ἀπεδήμησεν
  choice: سافر
  rationale: الفعل يدل على مغادرة الموطن أو الذهاب في سفر، و«سافر» أوجز وأدق من مجرد «ذهب» في هذا السياق.
- source_word: εὐθέως
  choice: في الحال
  rationale: تعبير عربي فصيح معاصر يفيد الفورية، مع التنبيه في الحاشية إلى احتمال تعلق الظرف بما يأتي بعده.
- source_word: καὶ
  choice: و / ثم
  rationale: حُفظ الربط في أول الآية بالواو، واستُعملت «ثم» قبل السفر لتوضيح تتابع الأفعال طبيعيًا من غير إضافة معنى لاهوتي.
theological_decisions:
- issue: دلالة الوزنات في المثل
  choice: وحدات مالية كبيرة مودعة لدى الخدم
  alternative: مواهب أو قدرات طبيعية
  rationale: السياق هو تسليم مال للتجارة والمحاسبة عليه؛ أما معنى «الموهبة» الشائع حديثًا فليس هو الدلالة المباشرة للمصطلح هنا.
- issue: مرجع الضمير في العبارة التوزيعية
  choice: كلَّ واحد على قدر طاقته
  alternative: كل واحد بحسب القدرة الخاصة به
  rationale: الصياغة المختارة تحفظ مفرد الأصل وقوته التوزيعية، من غير تعميم العبارة أو تحويلها إلى جمع.
- issue: تعلّق εὐθέως
  choice: 'بسفر السيد: «ثم سافر في الحال»'
  alternative: 'بفعل العبد ذي الوزنات الخمس في الآية التالية: «وفي الحال ذهب...»'
  rationale: ترتيب الألفاظ يسمح بربطه بالفعل السابق، وهو ما تتبعه طبقة POB الاستشارية، لكن علامات الترقيم تحريرية ويحتمل السياق ربطه بما يلي؛ لذلك حُفظ البديل في حاشية صريحة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل المصطلح الكتابي التاريخي «وزنة» مع شرحه، وتُجنبت ألفاظ قد توحي بأن موضوع المثل هو المواهب الفطرية. علامات الحواشي [a] و[b] و[c] مثبتة في المتن.
