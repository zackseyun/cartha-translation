  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: ar
  text: وبعد زمن طويل، يأتي سيد أولئك العبيد[a] ويحاسبهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «سيد أولئك العبيد» بـ«رب أولئك الخدم». فاللفظة اليونانية κύριος قد تعني «ربًّا» أو «سيدًا»، وδοῦλοι قد تعني «عبيدًا» أو «خدمًا»؛ وقد اختير في المتن المعنى الذي يبرز العلاقة المنزلية والاقتصادية في المثل.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: وبعد زمن طويل
  rationale: تفيد μετά مع المنصوب التعاقب الزمني، أي «بعد»، أما δέ فهي أداة ربط خفيفة تناسبها الواو في السياق السردي.
- source_word: ἔρχεται
  choice: يأتي
  rationale: حُفظ المضارع التاريخي في اليونانية لإبقاء حيوية السرد، وهو واضح وطبيعي هنا.
- source_word: ὁ κύριος
  choice: سيد
  rationale: يشير اللفظ في سياق المثل إلى صاحب السلطة على العبيد، لا إلى لقب لاهوتي صريح في هذه الجملة.
- source_word: τῶν δούλων ἐκείνων
  choice: أولئك العبيد
  rationale: يفيد δοῦλοι هنا منزلة العبودية ضمن علاقة اقتصادية واضحة بسيد، ولذلك «العبيد» أدق من «الخدم».
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: يحاسبهم
  rationale: هذا التعبير الاصطلاحي يعني تسوية الحساب أو إجراء المحاسبة؛ و«يحاسبهم» عربية موجزة وطبيعية تنقل معنى مراجعة ما اؤتمنوا عليه.
theological_decisions:
- issue: دلالة κύριος في المثل
  choice: سيد
  alternative: رب
  rationale: السياق المباشر علاقة سيد بعبيده داخل المثل؛ واختيار «سيد» يحفظ الدور القصصي من غير أن يفرض على اللفظ هنا لقبًا لاهوتيًا مباشرًا.
- issue: دلالة δοῦλος
  choice: عبيد
  alternative: خدم
  rationale: علاقة التبعية والملكية بارزة في سياق المثل، لذلك يحفظ لفظ «عبيد» البعد الاجتماعي الذي قد يخففه لفظ «خدم».
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، مع الحفاظ على المضارع التاريخي. وُضعت علامة الحاشية عند العبارة التي تشرحها مباشرة.
