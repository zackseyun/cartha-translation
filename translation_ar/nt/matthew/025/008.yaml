  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: ar
  text: 'فقالت الجاهلات للحكيمات: «أعطيننا من زيتكن، لأن مصابيحنا تنطفئ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مشاعلنا» بدلًا من «مصابيحنا»؛ فاللفظ اليوناني يمكن أن يشير إلى مصدر ضوء مشتعل يُحمل باليد، ويختلف الاختيار بحسب تصور مشهد المثل.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: الجاهلات
  rationale: صفة مستعملة استعمال الاسم وتشير إلى العذارى غير المستعدات؛ وتحافظ «الجاهلات» على التقابل المباشر مع «الحكيمات» من غير إضافة تفسيرية.
- source_word: φρονίμοις
  choice: للحكيمات
  rationale: يدل اللفظ هنا على الحكمة العملية وحسن الاستعداد، و«الحكيمات» تعبير عربي طبيعي يحفظ التقابل في المثل.
- source_word: Δότε ἡμῖν
  choice: أعطيننا
  rationale: فعل أمر لجمع المؤنث، يلائم كون المتكلمات والمخاطبات عذارى، وينقل الطلب المباشر بإيجاز.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: من زيتكن
  rationale: تحفظ «من» الدلالة التبعيضية في اليونانية، أي إعطاء مقدار من مخزون الزيت، من غير الحاجة إلى زيادة «بعض» في العربية.
- source_word: λαμπάδες
  choice: مصابيحنا
  rationale: يمكن أن يدل اللفظ على مصابيح أو مشاعل؛ واختيار «مصابيح» واضح ومألوف في سياق الزيت، مع حفظ البديل الممكن في الحاشية.
- source_word: σβέννυνται
  choice: تنطفئ
  rationale: صيغة المضارع تصف عملية جارية؛ و«تنطفئ» تنقل طبيعيًا أن اللهب آخذ في الخمود.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم سبب الطلب بوضوح في العربية المعاصرة.
