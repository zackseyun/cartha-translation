    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية تصل المثل بالسياق السابق، و«حينئذ» عربية واضحة وتحافظ على الصلة الزمنية.
- source_word: ὁμοιωθήσεται
  choice: يكون ... مثل
  rationale: صياغة عربية طبيعية تؤدي معنى التشبيه في المبني للمجهول اليوناني، مع إثبات الصيغة الحرفية البديلة في الحاشية.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تعبير عربي راسخ يحافظ على جمع «السماوات» في العبارة المتاوية.
- source_word: δέκα παρθένοις
  choice: عشر عذارى
  rationale: ينقل الدلالة المباشرة للكلمة في سياق العرس، من غير توسيعها إلى مجرد فتيات أو نساء غير متزوجات.
- source_word: λαβοῦσαι τὰς λαμπάδας ἑαυτῶν
  choice: أخذن مصابيحهن
  rationale: يعبّر الفعل الماضي عن الفعل السابق للخروج، و«مصابيح» ترجمة مألوفة مع إبقاء احتمال «مشاعل» في الحاشية.
- source_word: ἐξῆλθον εἰς ὑπάντησιν τοῦ νυμφίου
  choice: خرجن للقاء العريس
  rationale: صياغة عربية موجزة وطبيعية تحفظ حركة الخروج وغرضها، و«العريس» يحدد دوره في مشهد العرس.
theological_decisions:
- issue: صيغة التشبيه في المثل
  choice: يكون ملكوت السماوات مثل عشر عذارى
  alternative: يُشبَّه ملكوت السماوات بعشر عذارى
  rationale: المتن يقدّم المعنى بعربية طبيعية، بينما تحفظ الحاشية صيغة المبني للمجهول في الأصل ولا تحسم نطاق المطابقة بين الملكوت وعناصر المثل.
- issue: دلالة παρθένοις
  choice: عذارى
  alternative: فتيات غير متزوجات
  rationale: «عذارى» تحافظ على الخصوصية المعجمية للنص في سياق العرس من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع استعمال «ملكوت السماوات» المألوف كتابيًا. رُوعي تأنيث الأفعال مع جمع العاقل، وتجنبت الصياغة الحرفية الثقيلة في المتن مع حفظها في الحاشية.
