  text: حينئذٍ نهضت جميع أولئك العذارى، وهيَّأن مصابيحهن[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مشاعلهن» بدلًا من «مصابيحهن»؛ فاللفظ اليوناني (λαμπάδας) قد يشير إلى مصدر ضوء محمول، وسياق الزيت والاستعداد يحتمل المعنيين.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني ينقل السرد إلى الحدث التالي بعبارة عربية واضحة وموجزة.
- source_word: ἠγέρθησαν
  choice: نهضت
  rationale: يفيد هنا القيام من النوم أو من وضع الراحة؛ و«نهضت» تحافظ على هذا المعنى من غير أن تحسمه إلى «أُيقظت».
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: أولئك العذارى كلهن
  rationale: «العذارى» تقابل الدلالة المباشرة لـπαρθένοι وتلائم سياق العرس، و«كلهن» تحفظ الشمول.
- source_word: ἐκόσμησαν
  choice: هيأن
  rationale: الفعل يعني رتّبن أو أعددن؛ وفي سياق المصابيح يدل على تجهيزها للاستعمال، من غير إضافة تفاصيل غير مصرّح بها عن الفتائل.
- source_word: λαμπάδας
  choice: مصابيحهن
  rationale: يمكن أن يدل اللفظ اليوناني على مصابيح أو مشاعل؛ واختيار «مصابيح» ينسجم مع ذكر الزيت والإعداد في السياق، مع إثبات البديل في الحاشية.
- source_word: ἑαυτῶν
  choice: ـهن
  rationale: ضمير الملكية العربي يعبّر طبيعيًا عن عود الضمير على العذارى، ولا يقتضي السياق توكيدًا من قبيل «الخاصة بهن».
