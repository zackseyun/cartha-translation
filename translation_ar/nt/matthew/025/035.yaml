  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: ar
  text: لأني جعتُ فأطعمتموني، وعطشتُ فسقيتموني، وكنتُ غريبًا فآويتموني[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فاستقبلتموني». الفعل اليوناني يعني حرفيًا «جمع» أو «ضمّ»، ويشير هنا إلى استقبال الغريب وإكرامه.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: جعتُ
  rationale: ينقل فعل الجوع في الزمن الماضي بعبارة عربية موجزة وطبيعية.
- source_word: γὰρ
  choice: لأني
  rationale: تفيد الأداة تعليل الكلام السابق، و«لأني» تؤدي هذا الربط بوضوح في العربية.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: فأطعمتموني
  rationale: هذا هو المقابل العربي الطبيعي لتركيب «أعطيتموني لآكل»، ويحفظ معنى تقديم الطعام دون حرفية ثقيلة.
- source_word: ἐδίψησα
  choice: عطشتُ
  rationale: ينقل حالة العطش الماضية مباشرة وبأسلوب عربي مألوف.
- source_word: ἐποτίσατέ με
  choice: فسقيتموني
  rationale: الفعل العربي «سقى» يقابل إعطاء الشراب بوضوح ويحافظ على الموازاة مع «فأطعمتموني».
- source_word: ξένος
  choice: غريبًا
  rationale: «غريب» لفظ واسع يشمل من لا يعرفه الناس أو لا يجد بينهم انتماءً ومأوى، من غير حصره في وضع قومي أو قانوني.
- source_word: συνηγάγετέ με
  choice: فآويتموني
  rationale: مع أن المعنى الحرفي للفعل هو الجمع أو الضم، فإنه مع «غريبًا» يدل في السياق على قبول الغريب وإدخاله في كنف الضيافة؛ و«آويتموني» تعبر عن ذلك طبيعيًا.
theological_decisions:
- issue: دلالة الضيافة في ξένος ... συνηγάγετέ με
  choice: وكنتُ غريبًا فآويتموني
  alternative: وكنتُ غريبًا فاستقبلتموني
  rationale: يحفظ النص التركيز على الرحمة العملية تجاه الغريب والمحتاج إلى القبول والمأوى، من غير إدخال تصنيفات سياسية حديثة. وتوضح الحاشية المجال الدلالي للفعل دون حسمه في معنى أضيق مما يسمح به الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الأفعال العربية الموجزة «أطعمتموني» و«سقيتموني» بدل نقل التركيبات اليونانية نقلًا حرفيًا، مع إبقاء التوازي الإيقاعي بين الجمل الثلاث.
