source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: ar
  text: 'فقال له سيده: «أحسنت، أيها العبد الصالح الأمين! كنت أمينًا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: صيغة سردية عربية طبيعية لإدخال الكلام المباشر، مع الفاء التي تلائم تتابع أحداث المثل.
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: سيده / سيدك
  rationale: السياق القصصي يشير إلى صاحب السلطة على العبد داخل المثل؛ ولفظ «السيد» يحفظ العلاقة الهرمية من غير أن يحوّله صراحة إلى لقب إلهي.
- source_word: Εὖ
  choice: أحسنت
  rationale: تعبير عربي موجز وطبيعي عن الاستحسان والثناء.
- source_word: δοῦλε
  choice: أيها العبد
  rationale: المعنى الأساسي هنا لشخص خاضع لسيد، و«العبد» ينقل بوضوح وضعه غير الحر في عالم المثل، بخلاف «الخادم» الذي قد يوحي بعامل حر.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: الصالح الأمين
  rationale: يحفظ صفتي الجودة والأمانة، ويتيح تكرار جذر «أمين» مع πιστός في الجملة التالية.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: كنت أمينًا على القليل
  rationale: تركيب عربي واضح يحفظ معنى الأمانة في نطاق مسؤولية محدودة، كما يحفظ صيغة الجمع اليونانية دلاليًا بصيغة اسم الجنس «القليل».
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: فسأقيمك على الكثير
  rationale: «أقيمك على» تنقل معنى التعيين في موضع مسؤولية، وتحافظ على الموازاة بين القليل والكثير.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: ادخل إلى فرح
  rationale: يحفظ صورة الدخول المكانية في النص بدل تفسيرها بعبارة مثل «شارك في».
theological_decisions:
- issue: دلالة κύριος داخل المثل
  choice: سيد
  alternative: رب
  rationale: المرجع المباشر هو سيد العبد في القصة. «سيد» أنسب للسياق البشري، مع بقاء الدلالة اللاهوتية للمثل مستفادة من سياقه لا من فرض لقب «الرب» على الشخصية.
- issue: دلالة δοῦλος
  choice: عبد
  alternative: خادم
  rationale: «عبد» أقرب إلى الوضع الاجتماعي الذي تدل عليه الكلمة اليونانية في علاقة السيد والعبد، ويحفظ حدة العلاقة الهرمية بدل تلطيفها إلى خدمة طوعية محتملة.
- issue: صورة εἴσελθε εἰς τὴν χαράν
  choice: ادخل إلى فرح سيدك
  alternative: شارك سيدك فرحه
  rationale: الترجمة المختارة تبقي استعارة الدخول كما هي، ولا تحسم طبيعة الفرح أو كيفية المشاركة فيه تفسيرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «العبد» بوصفه المقابل الأدق سياقيًا لـδοῦλος، لذلك لا تلزم حاشية بديل هنا. حُفظ التوازي بين «القليل» و«الكثير»، وكذلك التكرار الدلالي لـπιστός بصيغة «الأمين/أمينًا».
