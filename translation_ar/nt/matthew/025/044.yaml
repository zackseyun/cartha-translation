source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: ar
  text: 'حينئذ سيجيبون هم أيضًا قائلين: «يا رب، متى رأيناك جائعًا أو عطشانَ أو غريبًا أو عريانَ أو مريضًا أو في السجن، ولم نخدمك؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نقم بخدمتك» أو «نعتنِ بك»؛ فالفعل اليوناني διακονέω يدل على تقديم الخدمة أو العناية العملية.'
    reason: بديل معجمي يوضح المجال الدلالي للفعل من غير تضييقه في المتن.
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: تفيد الترتيب الزمني في مشهد الدينونة، وتحافظ على الصلة بما يسبق بأسلوب عربي فصيح وطبيعي.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: سيجيبون هم أيضًا قائلين
  rationale: يحافظ المستقبل على زمن الفعل، وينقل «هم أيضًا» تأكيد καὶ αὐτοὶ وموازاته لجواب الفريق السابق، وتقدّم «قائلين» الكلام المباشر.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء طبيعية تحفظ معنى اللقب واحتماله اللاهوتي في مخاطبة يسوع.
- source_word: πεινῶντα ἢ διψῶντα
  choice: جائعًا أو عطشانَ
  rationale: ينقل الوصفين الحاليين الواقعين خبرين لحال المخاطَب بعد «رأيناك» بصورة موجزة وطبيعية.
- source_word: ξένον
  choice: غريبًا
  rationale: يحفظ المعنى الاجتماعي الواسع لشخص غريب محتاج إلى الإيواء، من غير تقييده بكونه أجنبيًا أو ضيفًا.
- source_word: γυμνὸν
  choice: عريانَ
  rationale: ترجمة مباشرة تحفظ قوة اللفظ، مع بقاء احتمال دلالته السياقية على قلة الكسوة.
- source_word: ἀσθενῆ
  choice: مريضًا
  rationale: مع أن اللفظ قد يعني «ضعيفًا»، فإن سياق قائمة الاحتياجات الجسدية والاجتماعية يرجّح المرض.
- source_word: ἐν φυλακῇ
  choice: في السجن
  rationale: ترجمة مباشرة وطبيعية لحالة السجن أو الحبس.
- source_word: οὐ διηκονήσαμέν σοι
  choice: ولم نخدمك
  rationale: تحفظ المعنى الواسع للفعل διακονέω بوصفه تقديم خدمة عملية، من غير حصره في خدمة كنسية أو في مجرد العناية العاطفية.
theological_decisions:
- issue: دلالة κύριος في مخاطبة يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ المخاطبة التكريمية والرنين المسيحاني في سياق متى، من غير إضافة تفسير إلى النص.
- issue: قوة διακονέω في العبارة الختامية
  choice: نخدمك
  alternative: نعتني بك / نقم بخدمتك
  rationale: «نخدمك» أوسع وأقرب إلى الأصل، وتبقي الصلة بين أعمال الرحمة والخدمة المقدمة للملك، بينما تُذكر البدائل في الحاشية لبيان المجال الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ بناء السؤال المتوازي وتكرار «أو»، واستُعملت ألفاظ مألوفة من غير تسطيح المعنى أو إدخال مصطلحات طائفية.
