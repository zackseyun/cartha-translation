  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: ar
  text: فالأمر كحال رجلٍ مسافرٍ دعا عبيده[a] وسلَّم إليهم ممتلكاته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خدمه». يمكن للكلمة اليونانية أن تدل على عبد أو خادم بحسب السياق؛ واختيرت هنا «عبيده» لأن سلطة السيد وعلاقة التبعية بارزتان في المثل.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: فالأمر كحال
  rationale: تُظهر الفاء الصلة التفسيرية بما سبق، وتعبير «كحال» يصوغ المقارنة الناقصة في اليونانية صياغة عربية طبيعية من غير تعيين مرجعها تعيينًا لاهوتيًا زائدًا.
- source_word: ἄνθρωπος
  choice: رجلٍ
  rationale: الاسم هنا يشير إلى شخصية ذكورية مفردة في المثل، لذلك «رجل» أدق من لفظ عام مثل «إنسان».
- source_word: ἀποδημῶν
  choice: عزم على السفر
  rationale: يفيد السياق مغادرة الرجل إلى مكان آخر؛ وهذه العبارة العربية الطبيعية تلائم فعل استدعائه عبيده قبل رحيله، من غير إضافة أنه سافر إلى خارج البلاد.
- source_word: ἐκάλεσεν
  choice: دعا
  rationale: مقابل مباشر وطبيعي للفعل، ويحمل في السياق معنى الاستدعاء من غير تكلف.
- source_word: τοὺς ἰδίους δούλους
  choice: عبيده
  rationale: «عبيد» يحفظ دلالة التبعية والملكية البارزة في δοῦλος، والضمير المتصل يؤدي معنى «الخاصين به» طبيعيًا من غير حشو.
- source_word: παρέδωκεν
  choice: سلَّم إليهم
  rationale: يحفظ معنى نقل ما يملكه الرجل إلى عهدتهم ومسؤوليتهم، من غير جعل معنى «الائتمان» الصريح هو المعنى الوحيد الممكن للفعل.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ممتلكاته
  rationale: تعبير عربي واضح عن أموال الرجل وما يخصه، ويلائم الإطار الاقتصادي للمثل.
theological_decisions:
- issue: ترجمة δοῦλος في سياق بيت السيد في المثل
  choice: عبيده
  alternative: خدمه
  rationale: اختيرت «عبيده» لأن علاقة الملكية وسلطة السيد بارزتان في السياق، ولئلا تُلطَّف الحقيقة الاجتماعية التي قد يدل عليها اللفظ اليوناني. وتذكر الحاشية إمكان «خدمه» بحسب اتساع دلالة الكلمة والسياق.
- issue: مرجع المقارنة الناقصة في Ὥσπερ γὰρ
  choice: فالأمر كحال
  alternative: لأن ملكوت السماوات مثل
  rationale: لم يُذكر «ملكوت السماوات» صراحة في هذه الآية؛ لذلك لم يُضف إلى المتن، حفاظًا على إيجاز الأصل وصلته المفتوحة بما سبق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «كحال» لتيسير المقارنة اليونانية المحذوف بعض عناصرها، ووُضعت علامة الحاشية بعد اللفظ الذي تتناوله مباشرة.
