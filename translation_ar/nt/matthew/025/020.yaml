  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: ar
  text: 'فتقدَّم الذي تسلَّم خمس وزنات، وأحضر خمس وزنات أخرى، قائلًا: «يا سيد[a]، سلَّمتني خمس وزنات[b]؛ انظر، لقد ربحت خمس وزنات أخرى».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا رب». اليونانية: كيريوس، ويمكن أن تعني «السيد» أو «الرب» بحسب السياق.'
    reason: alternative_reading
  - marker: b
    text: الوزنة وحدة وزن كبيرة، وكانت تُستعمل أيضًا كوحدة نقدية كبيرة القيمة.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم
  rationale: ينقل معنى الاقتراب إلى السيد في مشهد تقديم الحساب، وهو تعبير عربي طبيعي وموجز.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: الذي كان قد تسلَّم الوزنات الخمس
  rationale: يحافظ على البناء الوصفي وعلى سبق التسلُّم زمنيًا للفعل الرئيس، من غير إضافة لفظ «رجل» غير الموجود صراحة في اليونانية.
- source_word: τάλαντα
  choice: الوزنات
  rationale: «الوزنة» اسم تاريخي لوحدة كبيرة من الوزن أو المال، ويحفظ صورة النص بدل اختزالها في «نقود» أو تقييدها بنوع محدد من المعدن.
- source_word: προσήνεγκεν
  choice: أحضر
  rationale: يدل هنا على إحضار المبلغ الإضافي إلى السيد؛ و«أحضر» واضح ولا يوحي بالمعنى الشعائري الذي قد يحمله «قدَّم» في بعض السياقات.
- source_word: ἄλλα πέντε τάλαντα
  choice: خمس وزنات أخرى
  rationale: ينقل معنى مبلغ إضافي مساوٍ للمبلغ الأول ويحافظ على تكرار العبارة في الأصل.
- source_word: Κύριε
  choice: يا سيد
  rationale: في إطار المثل يخاطب العبد صاحبَه، و«يا سيد» هو المقابل العربي الطبيعي الذي لا يفرض وحده دلالة لاهوتية، مع إثبات البديل الممكن في الحاشية.
- source_word: παρέδωκας
  choice: سلَّمتني
  rationale: يقابل معنى التسليم أو الدفع إلى شخص بصورة مباشرة، من غير إدخال معنى «الائتمان» الضمني في لفظ الفعل نفسه.
- source_word: ἴδε
  choice: انظر
  rationale: أداة تنبيه وإشارة إلى النتيجة الحاضرة، و«انظر» فصيحة معاصرة وطبيعية في الخطاب المباشر.
- source_word: ἐκέρδησα
  choice: لقد ربحت
  rationale: «ربحت» ينقل معنى تحقيق زيادة أو مكسب، و«لقد» تبرز اكتمال الفعل وظهور نتيجته عند تقديم الحساب.
theological_decisions:
- issue: ترجمة Κύριε في خطاب داخل المثل
  choice: يا سيد
  alternative: يا رب
  rationale: السياق المباشر هو خطاب عبد لسيده، ولذلك يوضح «يا سيد» العلاقة داخل القصة. أما «يا رب» فممكن لغويًا وقد يُبقي صدى متّى اللاهوتي، لكنه في العربية الحديثة قد يحسم الإحالة إلى الله أو المسيح أكثر مما يحسمها هذا اللفظ في هذا الموضع؛ لذا أُبقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الوزنات» حفاظًا على المصطلح التاريخي في المثل، ووُضعت علامتا الحاشية عند اللفظين اللذين تشرحهما الحاشيتان مباشرة.
