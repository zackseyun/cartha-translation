  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: ar
  text: فاسهروا إذن[a]، لأنكم لا تعرفون اليوم ولا الساعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «راقبوا» أو «كونوا يقظين». يفيد فعل الأمر اليوناني يقظةً مستمرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: فعل أمر مضارع للجمع يفيد اليقظة المستمرة. و«اسهروا» يحفظ صورة البقاء يقظين في سياق المثل، مع احتمال معنى المراقبة والتأهب.
- source_word: οὖν
  choice: إذن
  rationale: تدل على النتيجة المستخلصة من المثل السابق، و«إذن» تربط الوصية بما قبلها بوضوح وطبيعية.
- source_word: ὅτι
  choice: لأنكم
  rationale: تدخل على سبب الأمر، فتنقل القوة السببية مباشرة.
- source_word: οὐκ οἴδατε
  choice: لا تعرفون
  rationale: نقل مباشر للفعل المنفي في صيغة المخاطب الجمع، من غير إضافة معنى اليقين أو غيره.
- source_word: τὴν ἡμέραν
  choice: اليوم
  rationale: حُفظ التعريف كما في اليونانية، من غير التصريح بما لم يصرح به النص عن ماهية ذلك اليوم.
- source_word: οὐδὲ τὴν ὥραν
  choice: ولا الساعة
  rationale: تنقل οὐδέ بوصفها عطفًا لعنصر منفي ثانٍ، وهي صياغة عربية طبيعية ودقيقة.
theological_decisions:
- issue: صورة الأمر باليقظة
  choice: اسهروا
  alternative: راقبوا؛ كونوا يقظين؛ تيقظوا
  rationale: تحفظ «اسهروا» الصورة المجازية المتصلة بسياق المثل، وتفيد دوام الاستعداد من غير حصرها في تصور أخروي مذهبي بعينه.
- issue: مدلول «اليوم ولا الساعة»
  choice: الإبقاء على العبارة بلا توسع تفسيري
  alternative: يوم أو ساعة مجيء ابن الإنسان؛ الموعد المعيّن
  rationale: مع أن السياق الأوسع يتناول المجيء والدينونة، فإن الآية نفسها تقول فقط «اليوم ولا الساعة»، ولذلك لم يُضف تحديد غير مصرح به.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم الجمع في «اسهروا» و«تعرفون» مطابقًا للأصل، وحُفظ الإيجاز والصورة المجازية.
