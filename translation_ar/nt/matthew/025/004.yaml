lexical_decisions:
- source_word: φρόνιμοι
  choice: الحكيمات
  rationale: ينقل معنى الحكمة العملية والتعقّل، ويحافظ على المقابلة مع الجاهلات في سياق المثل، من غير اختزال المعنى في مجرد الاستعداد.
- source_word: ἔλαβον
  choice: أخذن
  rationale: الفعل في السياق السردي يدل على أنهن أخذن الزيت معهن، لا أنهن تسلّمنه.
- source_word: ἔλαιον
  choice: زيتًا
  rationale: ترجمة عامة مطابقة للفظ اليوناني، الذي يشير عادةً إلى الزيت وغالبًا زيت الزيتون، من غير إضافة تخصيص غير مصرح به.
- source_word: ἀγγείοις
  choice: في أوعية
  rationale: «أوعية» لفظ عام يحافظ على عدم تحديد شكل الحاويات أو مادتها.
- source_word: λαμπάδων
  choice: مصابيحهن
  rationale: يمكن أن يدل اللفظ على المصابيح أو المشاعل؛ اختيرت «مصابيح» لملاءمتها الطبيعية لذكر الزيت، مع إثبات البديل الممكن في الحاشية.
- source_word: ἑαυτῶν
  choice: ـهن
  rationale: ضمير الملكية العربي يعبّر طبيعيًا عن عود الضمير إلى الحكيمات، ولا تستلزم العربية إضافة «الخاصة بهن».
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: مع مصابيحهن
  rationale: 'يحافظ حرف «مع» على معنى المصاحبة: أخذن الزيت في أوعية إلى جانب مصابيحهن.'
