  source_fidelity: 'الترجمة تنقل عناصر اليونانية كلها بأمانة: «الحكيمات» لـ φρόνιμοι في سياق العذارى، و«أخذن» لـ ἔλαβον، و«زيتًا» لـ ἔλαιον، و«في أوعية» لـ ἀγγείοις، و«مع مصابيحهن» لـ μετὰ τῶν λαμπάδων ἑαυτῶν. وترتيب العبارة العربية، وإن قدّم شبه الجملة «مع مصابيحهن»، لا يغيّر علاقة الزيت بالأوعية ولا معنى المصاحبة.'
