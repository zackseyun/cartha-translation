  text: فذهب الذي تسلَّم الوزنات الخمس[a]، وعمل بها[b]، فربح خمس وزنات أخرى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الوزنة وحدة كبيرة من المال، وليست موهبة أو قدرة طبيعية.
