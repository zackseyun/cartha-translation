lexical_decisions:
- source_word: πορευθεὶς
  choice: فذهب
  rationale: يؤدي اسم الفاعل الظرفي اليوناني بفعل ماضٍ طبيعي في العربية، من غير إضافة معنى «على الفور» غير المصرح به في النص.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: الذي تسلَّم الوزنات الخمس
  rationale: يحافظ على تعريف الخادم بما تسلّمه، ويجعل سبق التسلّم على العمل واضحًا في السياق.
- source_word: τάλαντα
  choice: الوزنات
  rationale: «الوزنة» مصطلح عربي معروف لوحدة مالية كبيرة في العالم القديم، ويحافظ على صورة المثل، مع توضيح معناها المالي في الحاشية.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: وعمل بها
  rationale: ترجمة مباشرة وطبيعية تفيد استخدام المال استخدامًا فعّالًا، من غير تضييق الفعل إلى نوع محدد من التجارة لا يصرّح به اليوناني.
- source_word: ἐκέρδησεν
  choice: فربح
  rationale: ينقل معنى تحقيق الكسب في هذا السياق المالي بوضوح، وتفيد الفاء ترتب الربح على العمل.
- source_word: ἄλλα πέντε
  choice: خمسًا أخرى
  rationale: صياغة عربية موجزة وطبيعية تحفظ معنى الزيادة المماثلة.
