  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: ar
  text: 'سيجيبهم الملك: «الحق أقول لكم: بقدر ما فعلتم ذلك لواحد من إخوتي هؤلاء الأصاغر، فلي فعلتموه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «آمين، أقول لكم». وقد تشير عبارة «إخوتي هؤلاء الأصاغر» خصوصًا إلى تلاميذ يسوع، أو إلى المؤمنين عمومًا، أو على نحو أوسع إلى المحتاجين والضعفاء؛ وتُبقي الترجمة العبارة دون حسم هذا الخلاف التفسيري.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἐρεῖ
  choice: فيجيبهم الملك قائلًا
  rationale: يجمع التركيب العربي الطبيعي بين معنى الاستجابة في اسم الفاعل ومعنى القول في الفعل المستقبل، ويحافظ المضارع الحكائي على مستقبل السياق العربي كما هو مألوف في السرد النبوي.
- source_word: ὁ βασιλεὺς
  choice: الملك
  rationale: يحافظ على اللقب الصريح في اليونانية؛ ولا تحتاج العربية إلى التمييز الطباعي بالحرف الكبير.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: ينقل قوة صيغة التأكيد الاحتفالية بعبارة عربية واضحة ومألوفة، مع الإشارة في الحاشية إلى الصياغة الحرفية «آمين».
- source_word: ἐφ’ ὅσον
  choice: بقدر ما
  rationale: يحافظ على دلالة المقدار أو المدى دون تحويل العبارة إلى جملة موصولة أوسع دلالة.
- source_word: ἐποιήσατε
  choice: فعلتم ذلك ... فعلتموه
  rationale: إظهار المفعول المضمر في العربية يوضح الإحالة إلى العمل المذكور في السياق ويحافظ على توازي الفعلين.
- source_word: ἑνὶ τούτων
  choice: لواحد من ... هؤلاء
  rationale: يحافظ على القوة الإفرادية لكلمة «واحد» وعلى الإشارة القريبة في «هؤلاء».
- source_word: τῶν ἀδελφῶν μου
  choice: إخوتي
  rationale: ترجمة مباشرة طبيعية للجمع المذكر اليوناني مع إبقاء مرجع الجماعة مفتوحًا للتفسير.
- source_word: τῶν ἐλαχίστων
  choice: الأصاغر
  rationale: ينقل صيغة التفضيل الاسمية المذكرة ويحافظ على اتساعها الدلالي من جهة المنزلة أو الشأن، دون حصرها في الفقر أو الضعف.
- source_word: ἐμοὶ
  choice: فلي
  rationale: 'تقديم الجار والمجرور يقابل إبراز الضمير اليوناني ويحافظ على التشديد: ما فُعل لهم عُدَّ فعلًا للملك نفسه.'
theological_decisions:
- issue: مرجع عبارة «إخوتي هؤلاء الأصاغر»
  choice: إبقاء العبارة كما هي من غير تعيين مرجعها
  alternative: تحديدهم بتلاميذ يسوع، أو بالمؤمنين عمومًا، أو بالمحتاجين والضعفاء على نطاق أوسع
  rationale: الآية نفسها لا تحسم هذا الخلاف التفسيري؛ لذلك تحافظ الترجمة على ألفاظ النص وعلى توتره اللاهوتي دون فرض قراءة طائفية.
- issue: جنس ἀδελφῶν
  choice: إخوتي
  alternative: إخوتي وأخواتي؛ أقربائي
  rationale: اللفظ اليوناني جمع مذكر، وترجمته بالمذكر تحافظ على الصيغة المصدرية ولا تضيف توسيعًا تفسيريًا، ولا سيما أن نطاق الجماعة محل خلاف.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «قائلًا» لتجنب تركيب عربي متثاقل، و«بقدر ما» للموازنة بين الدقة والطبيعية. وُضعت علامة الحاشية [a] في المتن.
