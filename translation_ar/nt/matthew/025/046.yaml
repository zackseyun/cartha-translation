  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: ar
  text: وسيذهب هؤلاء إلى عقاب أبدي[a]، وأما الأبرار فإلى حياة أبدية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عقاب دهري» ... «حياة دهرية». دلالة الصفة اليونانية αἰώνιος موضع نقاش في بعض السياقات، لكن الكلمة نفسها تصف هنا كلاً من «العقاب» و«الحياة»، لذلك تحافظ الترجمة على التوازي باستعمال «أبدي» في العبارتين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: سيذهب
  rationale: فعل مستقبل يدل على الانصراف والذهاب. واختيار «سيذهب» عربي طبيعي يحفظ معنى الحركة والمآل من غير إضافة تفسيرية.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: اسم إشارة يعود إلى الجماعة المذكورة في السياق السابق، ويحافظ على المقابلة الموجزة مع «الأبرار».
- source_word: κόλασιν
  choice: عقاب
  rationale: يدل في سياق الدينونة هنا على الجزاء العقابي؛ و«عقاب» أوضح من ألفاظ قد توحي حصراً بالتقويم أو التأديب الإصلاحي.
- source_word: αἰώνιον
  choice: أبدي / أبدية
  rationale: تُرجمت الصفة بالمقابل نفسه دلالياً في العبارتين، مع مراعاة التذكير والتأنيث في العربية، حفاظاً على التوازي اليوناني بين العقاب والحياة. وأُثبت البديل «دهري» في الحاشية لأن دلالة اللفظة محل نقاش في بعض السياقات.
- source_word: οἱ δὲ δίκαιοι
  choice: وأما الأبرار
  rationale: الصفة المستعملة اسماً تشير إلى الذين يتصفون بالبر. وصيغة «وأما» تُظهر المقابلة التي تؤديها δὲ بأسلوب عربي فصيح وطبيعي.
- source_word: ζωὴν
  choice: حياة
  rationale: المقابل العربي المباشر والطبيعي للاسم ζωή، ولا يقتضي السياق توسيعه تفسيرياً.
theological_decisions:
- issue: دلالة αἰώνιον في العبارتين المتوازيتين κόλασιν αἰώνιον وζωὴν αἰώνιον
  choice: ترجمة الصفة «أبدي/أبدية» في الموضعين
  alternative: «دهري/دهرية» أو «دائم/دائمة»
  rationale: الصفة اليونانية نفسها تصف كلاً من «العقاب» و«الحياة»، ولذلك تحافظ الترجمة على التوازي ولا تميّز بينهما في الدلالة أو المدة. «أبدي» هو المقابل العربي الواضح والمألوف هنا، مع ذكر البديل المعجمي في الحاشية من غير حسم النقاش الدلالي بصمت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «وأما» لإبراز المقابلة بسلاسة، وحُذف الفعل في الشطر الثاني تبعاً لإيجاز الأصل وإمكانه الطبيعي في العربية.
