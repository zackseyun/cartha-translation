  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: ar
  text: ومتى رأيناك غريبًا فآويناك[a]، أو عريانًا[b] فكسوناك؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «جمعناك» أو «أدخلناك»؛ والمقصود هنا استقبال الغريب وإيواؤه.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تعني الكلمة اليونانية أيضًا: «بلا كساء كافٍ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: متى
  rationale: أداة استفهام عن الزمن، و«متى» هي المقابل العربي الطبيعي المباشر.
- source_word: δέ
  choice: و
  rationale: تفيد هنا الربط الخفيف بالسؤال السابق ضمن سلسلة، لا استدراكًا قويًا.
- source_word: σε
  choice: رأيناك / آويناك
  rationale: ضمير مفعول به يعود إلى الملك/ابن الإنسان، وقد اتصل بالفعلين في العربية وفق الأسلوب الطبيعي.
- source_word: εἴδομεν
  choice: رأينا
  rationale: فعل ماضٍ يحافظ على الإشارة الزمنية لصيغة الماضي اليونانية، وجاء بعد «متى» في استفهام طبيعي.
- source_word: ξένον
  choice: غريبًا
  rationale: يدل هنا على شخص غريب عن الجماعة أو محتاج إلى الضيافة، من غير قصر المعنى على الانتماء القومي.
- source_word: συνηγάγομεν
  choice: آويناك
  rationale: الفعل يعني حرفيًا الجمع أو الإدخال، وفي سياق الضيافة يدل على استقبال الغريب وإدخاله إلى مأوى؛ «آويناك» واضحة وطبيعية في العربية.
- source_word: ἢ
  choice: أو
  rationale: تحافظ على الربط التخييري بين شطري السؤال.
- source_word: γυμνὸν
  choice: عريانًا
  rationale: ينقل المعنى المباشر، مع إبقاء احتمال أن المقصود هو الافتقار إلى الكساء الكافي في الحاشية.
- source_word: περιεβάλομεν
  choice: كسوناك
  rationale: يفيد إلباس الثياب، و«كسوناك» موجزة وفصيحة وطبيعية في هذا السياق.
theological_decisions:
- issue: دلالة ξένος في سياق أعمال الرحمة والضيافة
  choice: غريبًا
  alternative: أجنبيًا
  rationale: «غريب» يحفظ المعنى الاجتماعي لشخص من خارج دائرة المرء أو بلا ضيافة، ولا يفرض تصنيفًا قوميًّا أو سياسيًّا لا يقتضيه النص.
- issue: مدى دلالة γυμνός
  choice: عريانًا مع حاشية توضح سعة الدلالة
  alternative: بلا كساء كافٍ
  rationale: يحافظ المتن على المعنى المباشر والمألوف، بينما تمنع الحاشية حصر اللفظ في العري التام.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة كريمة ملائمة للسياق الكتابي. استُعمل «آويناك» لإيصال معنى الضيافة بصورة طبيعية، مع توضيح الصورة الحرفية في الحاشية، وحُفظ اتساع معنى «عريانًا» بحاشية مستقلة.
