  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: ar
  text: لذلك خذوا منه الوزنة، وأعطوها للذي عنده الوزنات العشر.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انزعوها منه». يمكن أن يُترجم فعل الأمر اليوناني أيضًا بمعنى «خذوها منه».'
    reason: lexical_alternative
  - marker: b
    text: كانت «الوزنة» وحدة كبيرة للوزن، واستُعملت تبعًا لذلك للدلالة على مبلغ كبير من المال.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: فخذوا
  rationale: فعل أمر موجَّه إلى جمع، يدل هنا على أخذ الشيء من صاحبه ونزعه من حيازته. «فخذوا» عربية طبيعية وتحفظ قوة الأمر، مع بيان البديل في الحاشية.
- source_word: οὖν
  choice: إذًا
  rationale: تفيد النتيجة المترتبة على الحكم السابق، و«إذًا» توصل هذا الاستنتاج بوضوح في العربية المعاصرة.
- source_word: ἀπ’ αὐτοῦ
  choice: منه
  rationale: تنقل معنى الانفصال الذي تفيده ἀπό مع المجرور، وتشير مباشرة إلى العبد المذكور.
- source_word: τὸ τάλαντον
  choice: الوزنة
  rationale: «الوزنة» مصطلح عربي كتابي معروف لوحدة كبيرة من الوزن، ثم من المال، ويحفظ الطابع التاريخي للمثل من غير تفسيرها على أنها موهبة فطرية.
- source_word: δότε
  choice: أعطوها
  rationale: يحفظ صيغة الأمر للجمع؛ وأضيف ضمير المؤنث العائد إلى «الوزنة» وفق مقتضى العربية.
- source_word: τῷ ἔχοντι
  choice: للذي عنده
  rationale: صياغة عربية واضحة للاسم الموصول المستفاد من اسم الفاعل المعرّف، من غير إضافة وصف غير موجود في اليونانية.
- source_word: τὰ δέκα τάλαντα
  choice: الوزنات العشر
  rationale: تحفظ أداة التعريف الإحالية إلى المقدار المحدد المذكور سابقًا، مع مطابقة العدد لقواعد العربية.
theological_decisions:
- issue: معنى τάλαντον في سياق المثل
  choice: نقله بالمصطلح التاريخي «الوزنة»
  alternative: مبلغ من المال؛ المال
  rationale: السياق يتناول أموالًا مؤتمنة وحسابًا عليها. «الوزنة» تحافظ على الصورة التاريخية ولا تستبدلها بتفسير عن القدرات أو المواهب الفطرية، بينما توضح الحاشية معناها المالي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعملت «الوزنة» للمحافظة على المصطلح التاريخي، ووُضعت علامتا الحاشيتين بعد الجملة مع ظهورهما في المتن.
