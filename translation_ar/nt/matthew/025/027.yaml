  to: فكان ينبغي لك إذًا أن تودع مالي لدى الصيارفة، وعند عودتي لكنت قد استوفيت ما لي مع فائدة.[a]
  rationale: 'عُدّل البناء الزمني والشرطي ليوافق السيناريو المضاد للواقع في اليونانية: لو أودع العبد المال، لكان السيد عند عودته قد تسلّم ما يخصه مع الفائدة. وأُبقيت المصطلحات المالية محايدة وتاريخيًا ملائمة، مع فصل «مالي» النقدي في أول الآية عن «ما لي» الدال على الملكية في ختامها.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:04Z'
