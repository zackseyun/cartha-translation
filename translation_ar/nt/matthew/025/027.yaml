source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: ar
  text: فكان ينبغي لك إذًا أن تودع مالي لدى الصيارفة، وعند عودتي لكنت قد استوفيت ما لي مع فائدة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تضع فضتي لدى الصيارفة، وعند عودتي لكنت قد استوفيت ما لي مع فائدة».'
    reason: بديل أكثر حرفية لـ «تودع» و«مالي»، يحافظ على إمكان معنى «الفضة» في τὰ ἀργύρια، من غير تغيير المعنى المالي للسياق.
lexical_decisions:
- source_word: ἔδει
  choice: كان ينبغي لك
  rationale: ينقل معنى الواجب أو ما كان مطلوبًا في الماضي، ويحافظ على نبرة التوبيخ بصياغة عربية طبيعية.
- source_word: οὖν
  choice: إذًا
  rationale: تدل على النتيجة المستخلصة من الكلام السابق، وتنسجم طبيعيًا مع سياق المحاجّة.
- source_word: βαλεῖν
  choice: أن تودع
  rationale: الفعل يعني حرفيًا الوضع، لكن اقترانه بالصيارفة والفائدة يجعل الإيداع هو المعنى المالي المقصود.
- source_word: τὰ ἀργύριά μου
  choice: مالي
  rationale: يمكن أن يعني اللفظ الفضة أو النقود؛ وفي السياق التجاري تؤدي كلمة «مالي» المعنى الوظيفي بوضوح، مع التنبيه إلى البديل الحرفي في الحاشية.
- source_word: τραπεζίταις
  choice: الصيارفة
  rationale: يدل اللفظ على من يتعامل بالنقود على مائدة الصرف، وقد شمل عملهم وظائف مصرفية؛ و«الصيارفة» لفظ عربي واضح ومناسب للبيئة القديمة دون إسقاط صورة البنوك الحديثة عليها.
- source_word: ἐλθὼν ἐγὼ
  choice: وعندما آتي
  rationale: يؤدي اسم الفاعل اليوناني معنى زمنيًا سابقًا للفعل الرئيس. استُعمل المضارع العربي لأن الشرط المخالف للواقع يتطلع من زمن الكلام في المثل إلى مجيء السيد المتوقع.
- source_word: ἐκομισάμην ἂν
  choice: كنت سأستردّ
  rationale: صيغة الوسط مع ἄν تفيد النتيجة التي كانت ستقع لو تم الإيداع، و«أستردّ» تبرز معنى تحصيل المرء ماله راجعًا إليه.
- source_word: τὸ ἐμὸν
  choice: مالي
  rationale: الصفة الملكية المستعملة اسميًا تشير إلى ما يخص السيد؛ وتكرار «مالي» واضح وطبيعي في العربية.
- source_word: σὺν τόκῳ
  choice: مع فائدته
  rationale: τόκος هنا هو العائد المالي على الوديعة. و«الفائدة» التعبير العربي المعاصر المحايد، من غير إيحاء تلقائي بالاستغلال.
theological_decisions:
- issue: اللغة المالية في المثل واحتمال تحميل أخذ الفائدة حكمًا أخلاقيًا
  choice: صياغة المصطلحات المالية بصفتها جزءًا من صورة المثل، من غير تقرير تأييد أخذ الفائدة أو إدانته على نحو عام.
  alternative: استعمال لفظ ذي حكم أخلاقي مسبق مثل «الرِّبا» لإدخال النقاش الفقهي أو اللاهوتي في الترجمة.
  rationale: النص يوظف معاملة مالية معروفة في بناء حجة السيد داخل المثل، ولا يصرح هنا بحكم شامل على جميع صور الإقراض أو الفائدة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي السياق الاقتصادي القديم باختيار «الصيارفة» بدل «المصرفيين»، مع استخدام «تودع» لتوضيح طبيعة الفعل. وُضعت علامة الحاشية بعد الجملة التي تتناول بدائلها.
