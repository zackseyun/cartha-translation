  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: ar
  text: ولكن حين يأتي ابن الإنسان في مجده، وجميع الملائكة معه، فحينئذ يجلس على عرش مجده.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عرشه المجيد».'
    reason: بديل تعبيري طبيعي لتركيب الإضافة اليوناني «عرش مجده».
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: ولكن متى
  rationale: تنقل «متى» الحدث المستقبلي المفرد بصورة طبيعية، بينما تفيد «لكن» انتقالًا خطابيًا فيه مقابلة خفيفة مع ما سبق.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: اللقب الكتابي المستقر يحفظ صلته بدانيال 7 ودلالته المسيانية والقضائية، من غير إعادة تفسيره.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: في مجده
  rationale: صياغة مباشرة تحفظ معنى المجد الظاهر وما يحمله اللفظ من صدى كتابي.
- source_word: πάντες οἱ ἄγγελοι
  choice: جميع الملائكة
  rationale: يحافظ على أداة التعريف في اليونانية ولا يضيف ضمير الملكية «ملائكته» غير الموجود في نص SBLGNT.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: ينقل معنى المصاحبة ببساطة ووضوح.
- source_word: τότε καθίσει
  choice: فحينئذ يجلس
  rationale: «فحينئذ» توضح تتابع الحدث والنتيجة، والمضارع العربي بعد الشرط الزمني يؤدي معنى المستقبل طبيعيًا.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: على عرش مجده
  rationale: يحفظ تركيب الإضافة في الأصل، بما يحتمله من وصف العرش بالمجد أو نسبته إلى مجد ابن الإنسان، بدل حصره في الصفة «عرشه المجيد».
theological_decisions:
- issue: اللقب المسيحاني ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان أو الكائن البشري
  rationale: يحفظ اللقب المعروف وإحالته إلى دانيال 7، ولا يبدد التوتر بين دلالته البشرية ودوره الملكي القضائي.
- issue: دلالة θρόνου δόξης αὐτοῦ
  choice: عرش مجده
  alternative: عرشه المجيد
  rationale: الصياغة المختارة أقرب إلى تركيب الأصل وتحفظ احتمال تعلق المجد بالعرش وبابن الإنسان، بينما البديل العربي الطبيعي يفسره بوصفه صفة للعرش.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فحينئذ» لربط جواب الظرف الزمني بسلاسة، وحُفظت العبارة الكتابية «ابن الإنسان» والتركيب الإضافي «عرش مجده» لما فيهما من صدى ودقة.
