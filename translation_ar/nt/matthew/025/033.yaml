lexical_decisions:
- source_word: στήσει
  choice: يُقيم
  rationale: الفعل هنا متعدٍّ، ومعناه يجعلها تقف أو يضعها في موضع معيّن. «يُقيم» طبيعي في مشهد الفرز ويحافظ على صورة الوقوف.
- source_word: τὰ μὲν πρόβατα
  choice: الخراف
  rationale: πρόβατα هو اللفظ المعتاد للخراف، وأداة التعريف تشير إلى الجماعة المذكورة في سياق المشهد.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: عن يمينه
  rationale: التركيب اليوناني اصطلاحي يدل على الموضع الواقع إلى يمينه، و«عن يمينه» تعبير عربي فصيح موجز.
- source_word: τὰ δὲ ἐρίφια
  choice: أما الجداء
  rationale: ἐρίφια يدل بدقة على صغار الماعز؛ و«الجداء» يحفظ هذا التفصيل المعجمي ويظل واضحًا في العربية الفصحى، مع توضيحه في الحاشية.
- source_word: ἐξ εὐωνύμων
  choice: فعن يساره
  rationale: يدل التركيب على الموضع الواقع إلى اليسار. أُضيف ضمير الغائب في العربية لتحقيق التوازي الطبيعي، مع أنه غير مكرر صراحة في اليونانية.
- source_word: μὲν ... δὲ
  choice: أما ... فـ
  rationale: هذا البناء العربي ينقل المقابلة بين الفريقين بوضوح وطبيعية.
theological_decisions:
- issue: هل تُصرَّح الدلالة الرمزية لليمين واليسار في الترجمة؟
  choice: 'الإبقاء على التحديد المكاني وحده: «عن يمينه ... عن يساره»'
  alternative: التوسّع إلى معنى موضع الرضا وموضع الرفض
  rationale: النص يصف موضع الفريقين في مشهد الدينونة، أما دلالته التقويمية فتظهر من السياق؛ والتصريح بها داخل الآية يزيد على اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية مهيبة. استُعمل «أما ... فـ» لإبراز المقابلة، وحُفظت الصورة المكانية من غير إضافة تفسير لاهوتي إلى المتن.
