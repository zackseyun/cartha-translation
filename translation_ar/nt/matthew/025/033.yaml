  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: ar
  text: ويُقيم الخراف عن يمينه، أما الجداء[a] فعن يساره.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي صغار الماعز.
    reason: lexical_alternative
  - marker: b
    text: 'في اليونانية تعبير اصطلاحي معناه: عن يمينه وعن يساره.'
