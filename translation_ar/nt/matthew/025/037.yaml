source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: ar
  text: 'حينئذ يجيبه الأبرار قائلين: «يا رب، متى رأيناك جائعًا فأطعمناك، أو عطشانَ فسقيناك؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمان يبيّن تعاقب أحداث المشهد، و«حينئذ» موجزة وطبيعية في العربية الفصحى.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: يجيبه
  rationale: الفعل مستقبل في اليونانية، لكن العربية تستعمل المضارع بعد ظرف السياق المستقبلي استعمالًا طبيعيًا؛ والضمير المتصل يعبّر عن المفعول غير المباشر بلا تكلّف.
- source_word: οἱ δίκαιοι
  choice: الأبرار
  rationale: صفة مستعملة استعمال الاسم، وتشير إلى الجماعة المعترف ببرّها في المشهد؛ و«الأبرار» تعبير عربي كتابي واضح وشائع.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على صيغة اسم الفاعل التي تمهّد للكلام المباشر.
- source_word: Κύριε
  choice: يا رب
  rationale: نداء مباشر يحفظ معنى κύριος وما في اللقب من توقير ودلالة مسيانية محتملة دون زيادة تفسيرية.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: جائعًا فأطعمناك
  rationale: «جائعًا» حال بعد فعل الرؤية، والفاء تربط رؤية الحال بالفعل الذي أعقبها ربطًا عربيًا طبيعيًا.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: عطشانَ فسقيناك
  rationale: «سقيناك» المقابل العربي المباشر والطبيعي للفعل ἐποτίσαμεν، ويحفظ التوازي مع «فأطعمناك».
theological_decisions:
- issue: دلالة κύριος في خطاب يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ اللقب المألوف ودلالته المسيانية الممكنة في إنجيل متى، من غير أن تحسم أكثر مما يقوله النص.
- issue: هوية οἱ δίκαιοι
  choice: الأبرار
  alternative: الصالحون
  rationale: «الأبرار» تنقل مفهوم البر الذي يحمله δίκαιοι، ولا تختزله في حسن السلوك العام.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، مع الحفاظ على بنية السؤال المتوازية والإيجاز الموجود في الأصل. لا حاجة إلى حاشية، لأن «فسقيناك» تنقل ἐποτίσαμεν بدقة وطبيعية.
