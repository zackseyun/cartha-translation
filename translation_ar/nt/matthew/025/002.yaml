  text: And five of them were foolish, and five were wise.
translation:
  language: ar
  text: وكانت خمسٌ منهنَّ سفيهات، وخمسٌ حكيمات.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: خمسٌ
  rationale: عدد صريح، وجاء مؤنثًا لأن المعدود المفهوم هو العذارى المذكورات في السياق. وتكراره يحفظ توازن العبارة اليونانية وتقابلها.
- source_word: δὲ
  choice: الواو في «وكانت»
  rationale: أداة ربط خفيفة في السياق، لا تقتضي إبراز معنى الاستدراك؛ فالواو تصل الوصف بما سبقه بصورة طبيعية.
- source_word: ἐξ αὐτῶν
  choice: منهنَّ
  rationale: تعبير تبعيضي يشير إلى أن الخمس جزء من جماعة العذارى السابقة الذكر، والضمير المؤنث هو الأفصح والأوضح هنا.
- source_word: ἦσαν
  choice: كانت
  rationale: فعل الكينونة في صيغة الماضي الناقص يؤدي وظيفة الربط الوصفي؛ وصيغة المفرد المؤنث جائزة وفصيحة مع جمع غير العاقل الوصفي هنا، مع مراعاة بنية الجملة العربية.
- source_word: μωραὶ
  choice: جاهلات
  rationale: ينقل معنى انعدام حسن التقدير أو التعقل، ويحافظ على الوصف المؤنث للعذارى. «جاهلات» طبيعية في العربية وأقل إيحاءً بالشتيمة المباشرة من «غبيات».
- source_word: καὶ πέντε φρόνιμοι
  choice: وخمسٌ حكيمات
  rationale: «حكيمات» تنقل معنى التعقل وحسن التدبير في مقابل «جاهلات»، وتبقي حذف فعل الكينونة في الشطر الثاني كما في اليونانية من غير إخلال بالوضوح.
