source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: ar
  text: 'ثم تقدَّم أيضًا مَن كان قد تسلَّم الوزنة الواحدة وقال: «يا سيدي، عرفتُ أنك إنسان قاسٍ[a]، تحصد حيث لم تزرع، وتجمع من حيث لم تنثر[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «شديد» أو «صارم». اللفظة اليونانية σκληρός تدل على القسوة أو الصلابة أو الشدة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تجمع مما لم تنثر». والمفعول، مثل «البذر»، مفهوم من الصورة الزراعية لكنه غير مذكور صراحة في اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: تقدَّم
  rationale: ينقل فعل الاقتراب والتقدّم للكلام في سياق مثولي الخدم أمام سيدهم، وهو طبيعي في السرد العربي.
- source_word: δὲ καὶ
  choice: ثم ... أيضًا
  rationale: «ثم» تتابع أحداث السرد، و«أيضًا» تُدرج صاحب الوزنة الواحدة ضمن الذين تقدّموا.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: مَن كان قد تسلَّم الوزنة الواحدة
  rationale: 'يحافظ على البناء الوصفي وعلى دلالة الفعل التام: تسلُّم وقع من قبل وظلّ ذا صلة بالموقف الحاضر.'
- source_word: τάλαντον
  choice: الوزنة
  rationale: مصطلح عربي كتابي مفهوم لوحدة كبيرة من الوزن أو المال، ويحافظ على صورة المثل دون تحويلها إلى مبلغ حديث محدد.
- source_word: Κύριε
  choice: يا سيدي
  rationale: نداء عربي طبيعي يُوجَّه إلى صاحب السلطان في المثل، ويحفظ الاحترام الذي يدل عليه κύριε من غير أن يحسم وحده إن كان الاستعمال لقبًا إلهيًا.
- source_word: ἔγνων σε ὅτι
  choice: عرفتُ أنك
  rationale: صياغة عربية طبيعية تنقل ادعاء الخادم معرفة صفة سيده؛ ولا تستلزم حرفية الضمير اليوناني تركيبًا عربيًا متكلفًا مثل «عرفتك أنك».
- source_word: σκληρὸς ἄνθρωπος
  choice: إنسان قاسٍ
  rationale: «قاسٍ» تؤدي معنى الصلابة أو الشدة الأخلاقية في هذا السياق، مع إبقاء الكلام اتهامًا صادرًا عن الخادم لا حكمًا يتبناه الراوي.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: تحصد حيث لم تزرع
  rationale: يحفظ التقابل الزراعي المباشر بين الحصاد والزرع.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: وتجمع من حيث لم تنثر
  rationale: يحافظ على «من حيث» في ὅθεν وعلى فعل النثر أو التفريق في διεσκόρπισας، من غير إضافة «البذر» غير المذكور صراحة.
theological_decisions:
- issue: دلالة κύριε في خطاب داخل المثل
  choice: يا سيدي
  alternative: يا رب
  rationale: السياق المباشر خطاب خادم لسيده، و«يا سيدي» هو المقابل العربي الطبيعي الذي لا يفرض مسبقًا أن النداء لقب إلهي، مع بقاء إمكان الدلالة الأوسع للمثل في سياقه.
- issue: وصف السيد بأنه σκληρός
  choice: 'نقل الوصف بوصفه قول الخادم: «إنسان قاسٍ»'
  alternative: تلطيفه إلى «إنسان صارم» أو تبنّيه بوصفه تقريرًا موضوعيًا
  rationale: النص يورد تصوّر الخادم واتهامه؛ لذلك لا ينبغي للترجمة أن تخففه أو أن تحسم صحة توصيفه.
- issue: المفعول المحذوف مع διεσκόρπισας
  choice: عدم إضافة «البذر» في المتن
  alternative: «لم تنثر بذرًا»
  rationale: الأصل اليوناني لا يصرّح بالمفعول، وحذفه ممكن ومفهوم بالعربية في إطار الصورة الزراعية، فيحفظ قدرًا من الإبهام اللفظي.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعملت «الوزنة» للمحافظة على المصطلح التاريخي، وصيغت الجملة على نحو طبيعي من غير إزالة التوتر الكامن في اتهام الخادم لسيده.
