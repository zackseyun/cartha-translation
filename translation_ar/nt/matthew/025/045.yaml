base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: ar
  text: 'حينئذ سيجيبهم قائلًا: «الحق أقول لكم[a]: بقدر ما لم تفعلوا ذلك لواحد من هؤلاء الأصاغر[b]، لم تفعلوه لي أيضًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو على نحو أكثر حرفية: «آمين، أقول لكم».'
    reason: lexical_alternative
  - marker: b
    text: قد تُفهم عبارة «هؤلاء الأصاغر» على أنها تشير خصوصًا إلى تلاميذ يسوع، أو على نطاق أوسع إلى الوضيعين والمحتاجين؛ وتُبقي الترجمة العبارة كما وردت في النص.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمان يربط الجواب بما يسبقه في مشهد الدينونة، و«حينئذ» فصيحة وطبيعية وتحفظ تتابع الأحداث.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: سيجيبهم قائلًا
  rationale: يحفظ صيغة المستقبل وبنية فعل الجواب مع اسم الفاعل الدال على الكلام، من غير إثقال العبارة العربية.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: ينقل صيغة يسوع التوكيدية المهيبة بلغة عربية واضحة؛ وتُذكر الصيغة الأكثر حرفية في الحاشية.
- source_word: ἐφ’ ὅσον
  choice: بقدر ما
  rationale: يحفظ دلالة المقدار أو المدى في التركيب اليوناني، ولا يختزلها سببيًا إلى «لأنكم».
- source_word: οὐκ ἐποιήσατε
  choice: لم تفعلوا ذلك
  rationale: أُضيف اسم الإشارة مفعولًا به مفهومًا من سياق أعمال الرحمة السابقة، ليكون التعبير طبيعيًا في العربية.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: لواحد من هؤلاء الأصاغر
  rationale: يحفظ المفرد التمثيلي «واحد» وصيغة التفضيل الجمع «الأصاغر»، من غير تحديد هوية الجماعة في الترجمة.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: لم تفعلوه لي أيضًا
  rationale: ينقل النفي الرابط الذي يفيد أن عدم الفعل لهم هو كذلك عدم فعل للمسيح، مع تكرار الفعل للموازاة والتوكيد.
theological_decisions:
- issue: هوية «هؤلاء الأصاغر» وعلاقة يسوع بهم
  choice: أُبقيت العبارة عامة كما وردت، مع الحفاظ على تقرير أن عدم الفعل لواحد منهم هو عدم الفعل ليسوع.
  alternative: قد يُفهم «هؤلاء الأصاغر» خصوصًا على أنه تلاميذ يسوع أو رسله، أو على نطاق أوسع على أنه المحتاجون والمتضعون.
  rationale: الآية تقرر علاقة يسوع المباشرة بهم، لكنها لا تحسم وحدها هوية الجماعة بما يكفي لإدخال تفسير مخصوص في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة ملائمة لمشهد الدينونة. حُفظ التوازي والتوكيد في الجملتين، وتُجنب حسم المرجع اللاهوتي لعبارة «هؤلاء الأصاغر» داخل المتن.
