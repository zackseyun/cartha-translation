lexical_decisions:
- source_word: ἐπείνασα
  choice: جعتُ
  rationale: فعل عربي طبيعي موجز ينقل صيغة الماضي الدالة على حالة الجوع، ويحافظ على المتكلم المفرد.
- source_word: γὰρ
  choice: لأنني
  rationale: ينقل القوة التعليلية للأداة اليونانية في سياق بيان سبب الدينونة.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: فلم تعطوني ما آكله
  rationale: صياغة عربية واضحة وطبيعية تحفظ فعل العطاء، والضمير الشخصي، والمصدر الدال على الأكل، من غير التزام حرفية متكلفة.
- source_word: ἐδίψησα
  choice: وعطشتُ
  rationale: يحافظ على التوازي مع «جعتُ» وينقل حالة العطش الماضية بعبارة عربية مباشرة.
- source_word: ἐποτίσατέ με
  choice: فلم تسقوني
  rationale: الفعل «سقى» هو المقابل العربي الطبيعي لمعنى إعطاء الشراب، ويُبقي ضمير المتكلم مفعولًا به ويحافظ على إيجاز الأصل.
theological_decisions:
- issue: درجة الحرفية في عبارتي الامتناع عن تقديم الطعام والشراب
  choice: «فلم تعطوني ما آكله ... فلم تسقوني»
  alternative: «فلم تعطوني لأكل ... ولم تعطوني لأشرب» أو «فلم تقدموا لي طعامًا ... ولا شرابًا»
  rationale: الاختيار يحفظ التركيز الشخصي على ما حُجب عن المتكلم، ويقدم العربية بصورة طبيعية، من غير إضافة تفسير لِمَن يمثله المتكلم في سياق خطاب الدينونة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على التوازي والإيجاز في الأصل اليوناني. استُخدمت «لأنني» بدل «فإني» لشفافية العلاقة التعليلية لدى القارئ المعاصر.
