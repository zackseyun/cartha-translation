  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: ar
  text: لأني جعتُ فلم تعطوني ما آكله[a]، وعطشتُ فلم تسقوني.
  philosophy: optimal-equivalence
  footnotes:
