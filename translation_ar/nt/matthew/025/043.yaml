base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: ar
  text: كنتُ غريبًا فلم تُؤووني[a]، وعاريًا فلم تكسوني، ومريضًا وفي السجن فلم تزوروني[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلم تستقبلوني» أو «فلم تضمّوني إليكم». الفعل اليوناني يعني حرفيًا «تجمعون»، ويدل هنا على استقبال الغريب وإيوائه بكرم.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يحمل «تزوروني» أيضًا معنى «تعتنوا بي» أو «ترعوني»، لا مجرد القيام بزيارة اجتماعية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: غريبًا
  rationale: «غريب» هو المقابل العربي الطبيعي الذي يدل هنا على شخص خارج دائرة البيت أو الجماعة ويحتاج إلى الضيافة، من غير حصر المعنى في الانتماء العرقي كما قد يوحي «أجنبي».
- source_word: συνηγάγετέ
  choice: تُؤووني
  rationale: الفعل يعني حرفيًا «تجمعون»، لكنه مع «غريب» يدل على استقبال الغريب وإدخاله في البيت مع الضيافة. «تؤووني» يعبّر بوضوح عن إيواء المحتاج، مع إثبات بدائل الاستقبال في الحاشية.
- source_word: γυμνός
  choice: عريانًا
  rationale: يحفظ قوة اللفظ اليوناني المباشر، مع احتمال أن يشمل من لا يملك لباسًا كافيًا؛ ويؤكد فعل «تكسوني» أن المقصود الحرمان من الكسوة.
- source_word: περιεβάλετέ
  choice: تكسوني
  rationale: الفعل يعني وضع الثياب حول الشخص، أي كسوته. والصياغة موجزة وطبيعية وموازية لعبارة «عريانًا».
- source_word: ἀσθενής
  choice: مريضًا
  rationale: مع أن اللفظ قد يعني «ضعيفًا»، فإن سياق أعمال الرحمة يجعل المرض الجسدي هو المعنى الأرجح.
- source_word: ἐν φυλακῇ
  choice: في السجن
  rationale: يدل اللفظ هنا على حالة السجن، وهذه هي الصياغة العربية المباشرة والمألوفة.
- source_word: ἐπεσκέψασθέ
  choice: تفتقدوني
  rationale: «افتقد» في هذا السياق يدل على الزيارة المصحوبة بالاهتمام والرعاية، لا على زيارة اجتماعية عابرة، ويحافظ على فعل واحد يشمل حالتي المرض والسجن.
theological_decisions:
- issue: دلالة فعل ἐπεσκέψασθέ على فعل الرحمة
  choice: تفتقدوني
  alternative: تزوروني؛ تعتنوا بي
  rationale: تحفظ «تفتقدوني» الفعل الملموس الوارد في اليونانية، وتوحي في الوقت نفسه بزيارة نابعة من الاهتمام، من غير تحويل النص إلى تفسير صريح مثل «تعتنوا بي».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ومباشرة. استُخدم «تؤووني» لإبراز الضيافة العملية، و«تفتقدوني» للحفاظ على معنى الزيارة المقترنة بالعناية. وُضعت علامتا الحاشيتين في موضعيهما من المتن.
