id: MAT.25.39
reference: Matthew 25:39
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: ar
  text: ومتى رأيناك مريضًا أو في السجن، وأتينا إليك؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «زرناك». واليونانية أقرب حرفيًا إلى: «أتينا إليك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: متى
  rationale: أداة استفهام عن الزمن، و«متى» هي المقابل العربي الطبيعي المباشر.
- source_word: δέ
  choice: و
  rationale: تؤدي هنا وظيفة ربط خفيفة ضمن سلسلة من الأسئلة، فلا يلزم جعلها استدراكية.
- source_word: εἴδομεν
  choice: رأيناك
  rationale: فعل ماضٍ يدل على الرؤية، واتصل به ضمير المخاطب وفق تركيب العربية الطبيعي.
- source_word: ἀσθενοῦντα
  choice: مريضًا
  rationale: يصف هنا حالة مرض جسدي في سياق أعمال الرحمة؛ و«مريضًا» أوضح من «ضعيفًا».
- source_word: ἐν φυλακῇ
  choice: في السجن
  rationale: يدل التعبير على الوجود في موضع الحبس، و«في السجن» تعبير عربي واضح وفصيح.
- source_word: ἤλθομεν πρός σε
  choice: أتينا إليك
  rationale: 'يحافظ على المعنى المباشر للفعل وحرف الجر: المجيء إلى الشخص، من غير إدخال معنى «الزيارة» صراحة في المتن.'
theological_decisions:
- issue: هل يُترجم ἤλθομεν πρός σε ترجمة اصطلاحية بمعنى «زرناك» أم ترجمة أقرب إلى اللفظ بمعنى «أتينا إليك»؟
  choice: أتينا إليك
  alternative: زرناك
  rationale: النص اليوناني يعبّر عن المجيء إلى الشخص، ولا يستعمل فعلًا خاصًا بالزيارة. لذلك يُحفظ التعبير المباشر في المتن، مع ذكر البديل الاصطلاحي في الحاشية، تجنبًا لإضافة دلالة تفسيرية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تسلسل السؤال وبساطة الأفعال، واستُعملت فاصلة قبل الجملة المعطوفة لتيسير القراءة من غير تغيير البنية الدلالية.
