  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: ar
  text: وستُجمع أمامه جميع الأمم[a]، وسيفصلهم بعضهم عن بعض، كما يفصل الراعي الخراف عن الجداء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «جميع الشعوب»؛ واليونانية حرفياً: «جميع الأمم» (πάντα τὰ ἔθνη).'
    reason: lexical_alternative
  - marker: b
    text: الكلمة اليونانية ἐρίφων تعني «الجداء»، أي صغار المعز؛ ويمكن في هذا السياق ترجمتها أيضاً «المعز».
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: تُجمَع
  rationale: صيغة مستقبل مبني للمجهول؛ يحفظ المبني للمجهول من غير تعيين الفاعل، ويؤدي المعنى بالعربية بوضوح.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: أمامه
  rationale: تعبير عربي طبيعي يحفظ معنى الوقوف في حضرته ضمن مشهد الدينونة.
- source_word: πάντα τὰ ἔθνη
  choice: جميع الأمم
  rationale: يحفظ الدلالة الأساسية الواسعة لعبارة ἔθνη من غير تضييقها إلى «الأمم غير اليهودية» أو حسمها تفسيرياً بمعنى آخر.
- source_word: ἀφορίσει
  choice: يفصل
  rationale: ينقل مباشرة معنى فصل جماعة عن أخرى.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: بعضهم عن بعض
  rationale: تعبير عربي فصيح وطبيعي يدل على الفصل المتبادل داخل الجمع المذكور.
- source_word: ὥσπερ
  choice: كما
  rationale: أداة مقارنة واضحة وطبيعية في العربية.
- source_word: ὁ ποιμὴν
  choice: الراعي
  rationale: يحفظ أداة التعريف ويصلح مثالاً جنسياً عاماً كما في اليونانية.
- source_word: τὰ πρόβατα
  choice: الخراف
  rationale: يحفظ الصورة الرعوية المحسوسة ولا يحول الاسم إلى اللفظ الجمعي «القطيع».
- source_word: τῶν ἐρίφων
  choice: الجداء
  rationale: ينقل بدقة معنى صغار المعز الذي يحتمله اللفظ اليوناني، وهو لفظ عربي فصيح ملائم للصورة الرعوية.
theological_decisions:
- issue: نطاق πάντα τὰ ἔθνη
  choice: جميع الأمم
  alternative: جميع الشعوب؛ جميع الأمم غير اليهودية
  rationale: أُبقيت العبارة على سعتها المعجمية، من غير حصر المقصود في غير اليهود أو فرض مخطط عقائدي معين على مشهد الدينونة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الجداء» لدقته المعجمية، مع شرح في الحاشية لأنه أقل تداولاً من «المعز».
