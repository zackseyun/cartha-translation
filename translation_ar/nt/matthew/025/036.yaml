source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: ar
  text: كُنْتُ عُرْيانًا فَكَسَوْتُمُونِي، وَمَرِيضًا فَعُدْتُمُونِي[a]، وَكُنْتُ فِي السِّجْنِ فَأَتَيْتُمْ إِلَيَّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «افتقدتموني»؛ فالفعل اليوناني قد يعني الزيارة المصحوبة بالاهتمام والرعاية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: عُرْيانًا
  rationale: ينقل المعنى المباشر للصفة اليونانية، أي من كان بلا كساء، ويلائم الفعل المقابل «كسوتموني»؛ وقد يدل السياق عمليًا على الافتقار إلى لباس كافٍ.
- source_word: περιεβάλετέ
  choice: كَسَوْتُمُونِي
  rationale: الفعل يعني وضع لباس على شخص أو إحاطته به، و«كسوتموني» تعبير عربي موجز وطبيعي يحفظ المقابلة مع «عريانًا».
- source_word: ἠσθένησα
  choice: مَرِيضًا
  rationale: مع أن الفعل قد يدل عمومًا على الضعف، فالسياق هنا يرجح المرض، والصياغة الاسمية بعد «كنت» طبيعية في العربية.
- source_word: ἐπεσκέψασθέ
  choice: عُدْتُمُونِي
  rationale: «عاد المريض» تعبير عربي فصيح واضح للزيارة المقترنة بالاهتمام، ويحفظ معنى الزيارة من غير توسيعه صراحةً إلى «اعتنيتم بي».
- source_word: φυλακῇ
  choice: السِّجْنِ
  rationale: يدل اللفظ هنا على موضع الحبس، و«السجن» هو المقابل العربي المعياري الواسع.
- source_word: ἤλθατε πρός με
  choice: أَتَيْتُمْ إِلَيَّ
  rationale: ترجمة مباشرة تحفظ بساطة العبارة اليونانية ولا تضيف إليها معنى الزيارة أو الرعاية تصريحًا.
theological_decisions:
- issue: مقدار التوسّع التفسيري في أفعال الرحمة
  choice: 'الإبقاء على الأفعال المحسوسة: «كسوتموني»، و«عدتموني»، و«أتيتم إليّ»، من غير شرح رعوي زائد.'
  alternative: «اعتنيتم بي» في العبارة الثانية، أو «أتيتم لزيارتي» في الثالثة.
  rationale: النص اليوناني يذكر أفعالًا واضحة ومباشرة. وتحافظ هذه الصياغة على تمييزه بين عيادة المريض ومجرد الإتيان إلى المسجون، من غير استيراد دلالات غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «عدتموني» لأنه الاصطلاح العربي الطبيعي لزيارة المريض، مع حاشية تحفظ سعة دلالة الفعل اليوناني. وُضعَت الحركات الجزئية لتسهيل القراءة ومنع التباس بعض الصيغ.
