  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: ar
  text: 'ثم تقدّم أيضًا الذي تسلّم الوزنتين وقال: «يا سيّد[a]، سلّمتني وزنتين[b]. ها قد ربحت وزنتين أخريين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا ربّ». اللفظ اليوناني κύριος يمكن أن يعني «الربّ»، ويُستعمل أيضًا لقبَ احترام عند مخاطبة السيّد.
    reason: alternative_reading
  - marker: b
    text: الوزنة وحدة كبيرة من الوزن والقيمة المالية، وليست موهبة فطرية.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: تقدّم
  rationale: ينقل معنى الاقتراب إلى السيّد بقصد الكلام، وهو تعبير عربي طبيعي في هذا السياق السردي.
- source_word: δὲ καὶ
  choice: ثم ... أيضًا
  rationale: يجمع بين تتابع أحداث الرواية وإضافة هذا العبد إلى سابقه.
- source_word: ὁ τὰ δύο τάλαντα
  choice: الذي أخذ الوزنتين
  rationale: التركيب اليوناني يعرّف الشخص بالمقدار الذي كان معه، وسياق المثل يوضح أنه أخذه من سيّده. أُضيف الفعل في العربية لإيضاح المرجع بصورة طبيعية.
- source_word: Κύριε
  choice: يا سيّد
  rationale: κύριος هنا نداء محترم لصاحب العبيد في المثل. «يا سيّد» يحافظ على الدلالة الاجتماعية المباشرة من غير أن يحسم ما قد يحمله اللقب من صدى لاهوتي.
- source_word: παρέδωκας
  choice: سلّمتني
  rationale: يحافظ على المعنى الأساسي للفعل παραδίδωμι، أي التسليم أو وضع الشيء في يد شخص، دون استبداله بتفسير أضيق مثل «ائتمنتني».
- source_word: ἴδε
  choice: ها قد
  rationale: صيغة عربية حية تلفت الانتباه إلى النتيجة المعروضة، وتؤدي وظيفة ἴδε دون تعبير عتيق.
- source_word: ἄλλα δύο τάλαντα
  choice: وزنتين أخريين
  rationale: ينقل معنى مقدار إضافي مساوٍ للمقدار الأول، بصياغة عربية سليمة.
- source_word: ἐκέρδησα
  choice: ربحت
  rationale: يؤدي معنى κερδαίνω، أي تحصيل زيادة أو ربح، ويلائم السياق المالي للمثل.
- source_word: τάλαντα
  choice: وزنتين
  rationale: «الوزنة» مصطلح عربي معروف لوحدة كبيرة من الوزن والقيمة في العالم القديم، ويحفظ صورة النص ولا يوحي بموهبة طبيعية.
theological_decisions:
- issue: ترجمة κύριος في نداء داخل المثل
  choice: يا سيّد
  alternative: يا ربّ
  rationale: المقام المباشر هو مخاطبة عبد لسيّده، ولذلك تبدو «يا سيّد» عربية طبيعية ودقيقة. وتُذكر «يا ربّ» في الحاشية لأنها ترجمة ممكنة للقب اليوناني وقد تحفظ صداه اللاهوتي، من غير فرض هذا الصدى على سياق المثل.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُعملت «الوزنة» حفاظًا على الصورة التاريخية، مع شرحها في الحاشية، ووُضع فعل القول قبل الاقتباس بصياغة عربية طبيعية.
