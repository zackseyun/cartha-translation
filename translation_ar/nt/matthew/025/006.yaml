  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: ar
  text: 'وفي منتصف الليل انطلقت صرخة: «ها هو العريس[a]! اخرجنَ للقائه.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف بعض المخطوطات بعد «العريس»: «إنه قادم».'
    reason: textual_variant
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: وفي منتصف الليل
  rationale: التركيب الإضافي تعبير زمني اصطلاحي يفيد وقوع الحدث في منتصف الليل، و«الواو» تنقل δέ بوصفها انتقالًا سرديًا خفيفًا من غير افتعال مقابلة قوية.
- source_word: κραυγὴ γέγονεν
  choice: دوّى صراخ
  rationale: ينقل وقوع النداء المفاجئ وقوته بلغة عربية طبيعية، بدل الترجمة الحرفية الثقيلة «حدث صراخ».
- source_word: Ἰδοὺ
  choice: ها هو
  rationale: أداة تنبيه وإشارة، و«ها هو» عربية معاصرة فصيحة تلائم ظهور شخص منتظر وتحافظ على قوة لفت الانتباه.
- source_word: ὁ νυμφίος
  choice: العريس
  rationale: يدل اللفظ على الرجل في سياق العرس؛ و«العريس» هو المقابل العربي الطبيعي الواضح ويحفظ صورة المثل.
- source_word: ἐξέρχεσθε
  choice: اخرجنَ
  rationale: فعل أمر بالجمع موجَّه في سياق المثل إلى العذارى، ولذلك استُعملت صيغة جمع المؤنث الصريحة. ويفيد الفعل الخروج إلى خارج المكان.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: للقائه
  rationale: ترجمة موجزة وطبيعية للتعبير الاصطلاحي الدال على الخروج لمقابلة شخص قادم.
theological_decisions:
- issue: مرجع «العريس» في المثل
  choice: إبقاء «العريس» اسمًا عاديًا بلا تعظيم طباعي أو تصريح بأنه المسيح
  alternative: «العريس» بصياغة أو علامة توضح صراحةً أنه المسيح
  rationale: يعرض العدد الشخصية داخل عالم المثل، أما تحديد مرجعها اللاهوتي فيُستنبط من السياق الأوسع؛ فلا ينبغي إدخال هذا التفسير في صلب الترجمة.
translation_notes:
  register: عربية فصحى واضحة ومهيبة من غير ألفاظ تراثية غامضة. اختير «دوّى صراخ» لإبراز فجائية الإعلان، و«اخرجنَ» لمطابقة المخاطَبات في سياق المثل. أُثبتت ملاحظة نصية لأن النص النقدي يشير إلى موضع اختلاف بعد «العريس»، حيث تزيد بعض الشواهد معنى «آتٍ».
