id: MAT.25.41
reference: Matthew 25:41
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: ar
  text: 'ثم سيقول أيضًا للذين عن يساره: «ابتعدوا عني[a]، أيها الملعونون، إلى النار الأبدية المعدّة لإبليس وملائكته».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اذهبوا عني».'
    reason: بديل معجمي ممكن للفعل Πορεύεσθε مع عبارة ἀπ’ ἐμοῦ.
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: تفيد التعاقب الزمني في مشهد الدينونة، وهي طبيعية وواضحة في العربية.
- source_word: ἐρεῖ
  choice: سيقول
  rationale: تحافظ على صيغة المستقبل وعلى فعل القول من غير إضافة قوة غير موجودة في اليونانية.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: للذين عن يساره
  rationale: تعبير عربي واضح عن الجماعة الواقفة إلى يسار الملك في السياق المباشر.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: ابتعدوا عني
  rationale: ينقل الأمر بالمغادرة والانفصال عن المتكلم بعبارة عربية طبيعية وقوية.
- source_word: οἱ κατηραμένοι
  choice: أيها الملعونون
  rationale: ينقل اسم الفاعل التام المبني للمجهول المستعمل في النداء، بصياغة عربية سليمة ومباشرة.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: إلى النار الأبدية
  rationale: يحفظ وجهة الحركة ودلالة αἰώνιον المعتادة في سياق الدينونة.
- source_word: τὸ ἡτοιμασμένον
  choice: المعدّة
  rationale: يعبر عن حالة ناتجة عن إعداد سابق، ويطابق النار في التأنيث.
- source_word: τῷ διαβόλῳ
  choice: لإبليس
  rationale: διάβολος هنا لقب شخصي معروف في سياق الدينونة، و«إبليس» هو المقابل العربي الواضح الراسخ.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: وملائكته
  rationale: يشير السياق إلى الكائنات السماوية التابعة لإبليس، لا إلى رسل بشريين.
theological_decisions:
- issue: دلالة αἰώνιον في سياق الدينونة
  choice: الأبدية
  alternative: الدائمة أو المنسوبة إلى الدهر
  rationale: «الأبدية» هي الدلالة العربية الطبيعية في هذا السياق وتحفظ جسامة الدينونة النهائية من غير إدخال تفصيل مذهبي لا يصرح به النص.
- issue: هوية διάβολος وἄγγελοι
  choice: إبليس وملائكته
  alternative: المفتري ورسله
  rationale: العبارة في هذا السياق الأخروي تسمية معروفة لإبليس والكائنات الملائكية التابعة له؛ أما الترجمة الوصفية العامة فتضعف تحديد المرجع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع تركيب مباشر ملائم للخطاب القضائي. استُعملت «أيها الملعونون» بدل صيغة نداء أقل سلامة نحويًا، وأُبقيت قوة الأمر والانفصال من غير تعبير عتيق.
