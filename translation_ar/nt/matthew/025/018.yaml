id: MAT.25.18
reference: Matthew 25:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: ar
  text: أمّا الذي تسلَّم الوزنة الواحدة، فمضى وحفر في الأرض وأخفى مال سيّده.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحرفية أكثر: «فضة سيّده».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: أمّا الذي
  rationale: تُبرز «أمّا» المقابلة بين هذا العبد والعبدين السابقين، و«الذي» تجسّد أداة التعريف المستعملة اسميًّا في اليونانية.
- source_word: τὸ ἓν
  choice: الوزنة الواحدة
  rationale: الاسم محذوف في اليونانية ومفهوم من السياق القريب في متى 25:15؛ وإظهاره ضروري للوضوح بالعربية. والوزنة هنا وحدة وزن وقيمة مالية قديمة.
- source_word: λαβὼν
  choice: تسلَّم
  rationale: يفيد الفعل هنا تلقي المال الذي ائتمنه عليه السيد، وتدل صيغة اسم الفاعل على سبق التسلُّم للأفعال التالية.
- source_word: ἀπελθὼν
  choice: مضى
  rationale: تعبير عربي طبيعي موجز يحفظ معنى الذهاب وتسلسل الحدث.
- source_word: ὤρυξεν γῆν
  choice: حفر في الأرض
  rationale: ينقل التعبير اليوناني بصياغة عربية طبيعية من غير إضافة «حفرة»، مع أنها مفهومة ضمنًا.
- source_word: ἔκρυψεν
  choice: أخفى
  rationale: مقابل واضح وطبيعي للفعل الدال على الإخفاء.
- source_word: τὸ ἀργύριον
  choice: مال
  rationale: يمكن أن تعني الكلمة «فضة» أو «مالًا»؛ والسياق يتحدث عن أموال مؤتمنة، لذا «مال» أوضح للقارئ الحديث، مع حفظ المعنى الحرفي في الحاشية.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: سيّده
  rationale: يشير κύριος داخل عالم المثل إلى صاحب سلطان على العبد، لا إلى لقب إلهي مباشر؛ و«سيّده» تحافظ على علاقة السلطة بصياغة عربية مألوفة.
theological_decisions:
- issue: ترجمة κύριος في الإشارة البشرية داخل المثل
  choice: سيّده
  alternative: ربّه
  rationale: المرجع المباشر هو سيد العبد البشري في أحداث المثل. واختيار «سيّده» يمنع إقحام دلالة اللقب الإلهي في العبارة، مع إبقاء إمكان الدلالة الرمزية للمثل دون حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الوزنة» بوصفها المصطلح السياقي المعروف لوحدة الوزن والقيمة القديمة، مع تركيب سلس يحفظ ترتيب الأفعال والمقابلة السردية.
