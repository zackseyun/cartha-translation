base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: ar
  text: 'وبعد ذلك جاءت أيضًا العذارى الباقيات وقلن: «يا رب، يا رب، افتح لنا».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «العذارى الأخريات».'
    reason: lexical_alternative
  - marker: b
    text: 'جاء في اليونانية حرفيًا: «افتح لنا»؛ والباب مفهوم من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: وبعد ذلك
  rationale: ظرف زمان يدل على وقوع الحدث لاحقًا، وهذه صياغة عربية طبيعية تحفظ تتابع أحداث المثل.
- source_word: δὲ
  choice: الواو في «وبعد ذلك»
  rationale: أداة ربط خفيفة؛ جُمعت دلالتها الانتقالية مع الظرف الزمني في تركيب عربي سلس.
- source_word: ἔρχονται
  choice: جاءت
  rationale: مضارع سردي في اليونانية، ونُقل بالماضي الملائم للسرد العربي من غير تغيير دلالته.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ القوة الإضافية للأداة، إذ تلحق العذارى الأخريات بمن سبقهن في المشهد.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: العذارى الأخريات
  rationale: تنقل λοιπαί بمعنى الأخريات أو الباقيات، وتحافظ على المعنى المباشر لكلمة παρθένοι.
- source_word: λέγουσαι
  choice: وقلن
  rationale: تحويل اسم الفاعل إلى فعل معطوف أكثر طبيعية في العربية مع الحفاظ على تزامن المجيء والقول.
- source_word: Κύριε κύριε
  choice: يا رب، يا رب
  rationale: تحافظ على تكرار النداء الدال على الإلحاح، وعلى إمكان حمل κύριος معنى المخاطبة الاجتماعية والرنين اللاهوتي معًا.
- source_word: ἄνοιξον ἡμῖν
  choice: افتح لنا
  rationale: ترجمة مباشرة للأمر مع ضمير المنفعة؛ لا تُضاف كلمة «الباب» إلى المتن لأنها مفهومة من السياق وليست مذكورة صراحة في اليونانية.
theological_decisions:
- issue: دلالة κύριος في النداء المباشر
  choice: رب
  alternative: سيد أو مولى
  rationale: «رب» تحفظ التوتر المقصود بين لقب المخاطبة في سياق المثل والدلالة اللاهوتية الأوسع في إنجيل متى، بدل حصر اللفظ في معنى اجتماعي فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل الماضي للسرد الطبيعي، وحُفظ تكرار النداء، ولم تُضف كلمة «الباب» إلى المتن.
