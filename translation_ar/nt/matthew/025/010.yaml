id: MAT.25.10
reference: Matthew 25:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: ar
  text: وبينما كُنَّ ذاهباتٍ ليشترين، جاء العريس، فدخلت المستعدات معه إلى وليمة العرس[a]، وأُغلق الباب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى مأدبة العرس»، أو ببساطة «إلى العرس». قد يشير الجمع في اليونانية إلى احتفال العرس كله.
    reason: بديل معجمي يوضح مدى دلالة اللفظ اليوناني الجمع.
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν
  choice: وبينما كُنَّ ذاهباتٍ
  rationale: ينقل التركيب المطلق في اليونانية بوصفه فعلًا متزامنًا، ويحافظ التأنيث على الإشارة إلى العذارى في السياق.
- source_word: ἀγοράσαι
  choice: ليشترين
  rationale: المصدر الأوريستي يفيد الغرض. لم يُذكر المفعول به في الآية، لذلك لم تُضف كلمة «زيتًا» من السياق السابق.
- source_word: ὁ νυμφίος
  choice: العريس
  rationale: هو المقابل العربي الطبيعي والدقيق للرجل المقبل على الزواج في مشهد العرس، من غير إدخال تفسير رمزي في نص المثل.
- source_word: αἱ ἕτοιμοι
  choice: المستعدات
  rationale: الصفة المؤنثة المجموعة مستعملة استعمال الاسم، وتشير إلى العذارى اللواتي كن على أهبة الاستعداد.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: فدخلت ... معه
  rationale: صياغة عربية طبيعية تنقل حركة السرد وعلاقة المصاحبة بوضوح.
- source_word: εἰς τοὺς γάμους
  choice: إلى وليمة العرس[a]
  rationale: الجمع اليوناني قد يدل على احتفال العرس في مجموعه. «وليمة العرس» توضح المقصود في هذا السياق، مع إثبات البدائل الممكنة في الحاشية.
- source_word: ἐκλείσθη ἡ θύρα
  choice: وأُغلق الباب
  rationale: يحافظ على المبني للمجهول وعلى الإيجاز والحسم اللذين يختمان المشهد.
theological_decisions:
- issue: الصورة العرسية في سياق المثل
  choice: الإبقاء على «العريس» و«وليمة العرس» بوصفهما من عناصر السرد من غير التصريح بهوية رمزية للعريس
  alternative: إضافة تفسير مسياني صريح، أو استعمال «الزوج» بدل «العريس»
  rationale: ينبغي أن يُستنبط المغزى اللاهوتي من المثل وسياقه، لا أن يُدرج تفسيره في ألفاظ الترجمة. وتحافظ الصياغة المختارة على الصورة وعلى النهاية الحاسمة من غير توسيع عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. روعي التأنيث لأن المشار إليهن هن العذارى، وتُجنب إدخال «الزيت» في هذه الآية مع أنه مفهوم من السياق، كما تُجنب تفسير الرمز داخل النص.
