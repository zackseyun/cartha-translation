  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: ar
  text: 'لكن سيده أجابه قائلا: «أيها العبد الشرير والكسول، أكنت تعرف أنني أحصد حيث لم أزرع، وأجمع من حيث لم أنثر؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'يمكن أيضا قراءة الكلام على أنه جملة خبرية: «كنت تعرف أنني أحصد حيث لم أزرع، وأجمع من حيث لم أنثر.»'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ
  choice: لكن سيده أجابه قائلا
  rationale: صياغة عربية طبيعية تنقل العبارة السردية اليونانية، مع إبقاء الدلالة الاستدراكية الخفيفة لـ δέ وعلاقة السيد بعبده في سياق المثل.
- source_word: Πονηρὲ
  choice: الشرير
  rationale: تنقل الحكم الأخلاقي في πονηρός، لا مجرد وصف العمل بأنه رديء.
- source_word: δοῦλε
  choice: العبد
  rationale: تعكس بوضوح علاقة التبعية التي يدل عليها δοῦλος في سياق المثل، مع إثبات «الخادم» بديلا ممكنا في الحاشية.
- source_word: ὀκνηρέ
  choice: الكسول
  rationale: لفظ عربي حديث وواضح يدل على التباطؤ والإحجام عن العمل.
- source_word: ᾔδεις ὅτι
  choice: كنت تعرف أنني
  rationale: يحافظ على معنى المعرفة المفترضة التي يرد بها السيد على كلام العبد، من غير تحويلها صراحة إلى استفهام معلوماتي.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: أحصد حيث لم أزرع
  rationale: يحفظ الصورة الزراعية والتقابل المباشر بين الحصاد والزرع.
- source_word: καὶ συνάγω ὅθεν οὐ διεσκόρπισα
  choice: وأجمع من حيث لم أنثر
  rationale: يحافظ على الفرق اللفظي بين ἔσπειρα، «أزرع»، وδιεσκόρπισα، «أنثر»، ولا يضيف مفعولا غير مذكور صراحة في اليونانية.
theological_decisions:
- issue: قوة الجملة الأخيرة وعلامة الترقيم
  choice: صياغتها كسؤال بلاغي ينتهي بعلامة استفهام
  alternative: 'صياغتها خبرا: «كنت تعرف أنني أحصد حيث لم أزرع، وأجمع من حيث لم أنثر.»'
  rationale: يحتمل النص اليوناني الخبر أو السؤال البلاغي. والسؤال البلاغي يلائم رد السيد الذي يقلب حجة العبد عليه، لكن الحاشية تحفظ القراءة الخبرية ولا تحسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت ألفاظ زراعية مألوفة، وحُفظ إيجاز الأصل وغموض كون العبارة الأخيرة خبرا أو سؤالا بلاغيا.
