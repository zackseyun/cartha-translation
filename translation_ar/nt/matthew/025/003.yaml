- source_word: γὰρ
  choice: لأن
  rationale: تفيد تعليل ما سبق، و«لأن» تنقل قوة الرابط بوضوح في العربية.
- source_word: μωραὶ
  choice: الجاهلات
  rationale: صفة مؤنثة جمع تعود إلى العذارى المذكورات في السياق، وتحافظ على الإحالة من غير تكرار كلمة «العذارى».
- source_word: λαβοῦσαι
  choice: إذ أخذن
  rationale: تنقل اسم الفاعل الأوريستي بدلالة زمنية مصاحبة للفعل الرئيس، مع إبقاء الصلة اللفظية بفعل «يأخذن» اللاحق.
- source_word: λαμπάδας
  choice: مصابيحهن
  rationale: «مصابيح» ترجمة مألوفة وملائمة للسياق، مع أن اللفظة اليونانية قد تدل أيضًا على مشاعل.
- source_word: οὐκ ἔλαβον
  choice: لم يأخذن
  rationale: تحافظ على التوازي اللفظي في اليونانية بين «أخذن» و«لم يأخذن».
- source_word: μεθ’ ἑαυτῶν
  choice: معهن
  rationale: المقابل العربي الطبيعي للعبارة الانعكاسية في هذا السياق.
- source_word: ἔλαιον
  choice: زيتًا
  rationale: ترجمة مباشرة للزيت المستخدم لإضاءة المصابيح أو المشاعل.
