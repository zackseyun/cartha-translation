base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: ar
  text: 'فأجابت العاقلات قائلات: «كلا، فقد لا يكفي لنا ولكُنّ[a]. بل اذهبن إلى الباعة واشترين لأنفسكنّ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحو أقرب إلى اللفظ: «لئلا لا يكفي لنا ولكُنّ». تجمع اليونانية بين أداة تفيد التخوّف ونفيٍ مؤكَّد، فتعبّر عن قلق شديد من ألا يكفي الزيت للفريقين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: أجابت
  rationale: فعل سردي مألوف يؤدي معنى الرد في الحوار بوضوح، وجاء مؤنثًا لموافقة جماعة العاقلات.
- source_word: αἱ φρόνιμοι
  choice: العاقلات
  rationale: يحافظ على الصفة المستعملة استعمال الاسم، وعلى دلالة الحكمة وحسن التقدير، من غير إضافة اسم غير موجود في هذه الآية.
- source_word: λέγουσαι
  choice: قائلات
  rationale: يحفظ البنية الوصفية للمصدر اليوناني مع صياغة عربية فصيحة طبيعية.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: لا، فقد لا يكفي
  rationale: يجعل الرفض المفهوم من السياق صريحًا، ويحفظ احتمال عدم الكفاية مع قوة القلق التي يعبّر عنها النفي اليوناني المؤكد، ويُشرح ذلك في الحاشية.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: لنا ولكنَّ جميعًا
  rationale: صياغة عربية طبيعية توضح أن المخزون قد لا يكفي الفريقين معًا، مع مراعاة المخاطبات المؤنثات.
- source_word: πορεύεσθε μᾶλλον
  choice: بل اذهبن
  rationale: «بل» تنقل الانتقال إلى البديل المفضّل، وفعل الأمر المؤنث الجمع يلائم المخاطبات في سياق المثل.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: إلى الباعة
  rationale: ينقل اسم الفاعل المستعمل استعمال الاسم بإيجاز ووضوح، دون إضافة مفعول غير مصرح به.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: اشترين لأنفسكنَّ
  rationale: يحفظ الأمر وصيغة الانعكاس الدالة على الشراء لحاجتهن الخاصة.
