  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: «حينئذ»، ونداء الملك لمن هم عن يمينه، وفعل الدعوة، وبركة الآب، وأمر الميراث، والملكوت المُعَدّ لهم، والإطار الزمني «منذ تأسيس العالم». وصيغة «باركهم أبي» تُظهر على نحو واضح جهة البركة، ولا تغيّر المعنى المقصود من اسم المفعول اليوناني.'
