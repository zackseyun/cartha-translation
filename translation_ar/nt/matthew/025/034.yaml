id: MAT.25.34
reference: Matthew 25:34
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: ar
  text: 'حينئذ يقول الملك للذين عن يمينه: «تعالوا، يا من باركهم أبي[a]، رِثوا الملكوت المُعَدَّ لكم منذ تأسيس العالم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «يا مبارَكي أبي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من تأسيس العالم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني يبيّن تتابع أحداث مشهد الدينونة، و«حينئذ» فصيحة وطبيعية في هذا السياق.
- source_word: ἐρεῖ
  choice: يقول
  rationale: مضارع عربي يؤدي معنى المستقبل الذي تدل عليه الصيغة اليونانية، إذ يوضحه سياق النبوءة.
- source_word: ὁ βασιλεὺς
  choice: الملك
  rationale: لقب معرّف في السياق يشير إلى الحاكم الذي يصدر الحكم.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: للذين عن يمينه
  rationale: يحفظ الموقع المكاني وما يرتبط به من دلالة التكريم، بصياغة عربية مألوفة.
- source_word: Δεῦτε
  choice: تعالوا
  rationale: أمر للجمع يتضمن دعوة مباشرة رسمية وموجزة.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: يا من باركهم أبي
  rationale: ينقل اسم المفعول التام ومعه المصدر أو الفاعل المفهوم من المضاف إليه بصياغة عربية واضحة، من غير إضعاف معنى البركة الصادرة عن الآب.
- source_word: κληρονομήσατε
  choice: رِثوا
  rationale: يحفظ صورة الميراث وما فيها من إيحاء عائلي وعهدي، بدل الاكتفاء بفعل عام مثل «خذوا».
- source_word: τὴν ... βασιλείαν
  choice: الملكوت
  rationale: لفظ عربي كتابي مفهوم يحفظ معنى مُلك الله ومجاله الأخروي، ويناسب كونه موضوعًا للميراث.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: المُعَدَّ لكم
  rationale: ينقل اسم المفعول التام الذي يدل على إعداد مكتمل وما زالت نتيجته قائمة.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: منذ تأسيس العالم
  rationale: «منذ» تؤدي الدلالة الزمنية المستمرة لـἀπό، و«تأسيس العالم» يحفظ صورة وضع الأساس بصياغة عربية واضحة.
theological_decisions:
- issue: دلالة الإضافة في τοῦ πατρός μου مع «المبارَكين»
  choice: يا من باركهم أبي
  alternative: يا مبارَكي أبي
  rationale: الصياغة المختارة توضّح أن الآب مصدر البركة وفاعلها من غير إضافة معنى غير موجود، مع إثبات البديل الأقرب إلى البنية اليونانية في الحاشية.
- issue: معنى βασιλεία في سياق الميراث الأخروي
  choice: الملكوت
  alternative: المملكة أو المُلك
  rationale: سياق «رِثوا» و«المُعَدّ لكم» يرجّح المجال الأخروي الموروث، مع بقاء معنى السيادة الملكية حاضرًا في اللفظ.
- issue: تعلّق العبارة ἀπὸ καταβολῆς κόσμου
  choice: 'ربطها بـ«المُعَدّ لكم»: «المُعَدّ لكم منذ تأسيس العالم»'
  alternative: فهمها على نحو أوسع بوصفها متعلقة بالدعوة كلها
  rationale: هذا هو التعلّق النحوي الأقرب والأكثر طبيعية، ولا يفرض على الآية نظامًا لاهوتيًا يتجاوز نصها.
- issue: الدلالة الزمنية لحرف ἀπό
  choice: منذ تأسيس العالم
  alternative: من تأسيس العالم
  rationale: «منذ» أوضح في العربية للدلالة على ابتداء زمني يمتد أثره إلى الزمن المقصود، بينما يحافظ البديل على المقابلة اللفظية الأقرب لحرف الجر اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تناسب خطاب الملك والدينونة. استُخدمت ألفاظ موجزة ومألوفة مثل «حينئذ» و«رِثوا»، مع إبقاء «الملكوت» لما يحمله من دلالة كتابية وأخروية. وُضعت علامتا الحاشيتين في موضعي البديلين اللغويين المقصودين.
