  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: ar
  text: فخفت، فذهبت وأخفيت وزنتك[a] في الأرض. انظر، هذا ما لك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: مبلغ كبير من المال؛ كانت الوزنة في الأصل وحدة وزن، وتُستعمل أيضًا وحدة نقدية كبيرة القيمة، ولا تعني هنا موهبة أو قدرة فطرية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: فخفت
  rationale: ينقل اسم الفاعل الظرفي بوصفه الدافع الذي ذكره العبد، من غير أن يحوّل الخوف إلى معنى التوقير.
- source_word: ἀπελθὼν
  choice: فذهبت
  rationale: يحوّل اسم الفاعل إلى فعل متتابع طبيعي في العربية، مع الحفاظ على ترتيب الأحداث.
- source_word: ἔκρυψα
  choice: أخفيت
  rationale: هو المقابل المباشر لمعنى الإخفاء؛ أما وضع المال في الأرض فيُفهم من العبارة التالية، فلا حاجة إلى استبداله بـ«دفنت».
- source_word: τὸ τάλαντόν σου
  choice: وزنتك
  rationale: «الوزنة» مصطلح تاريخي عربي لوحدة كبيرة من الوزن والقيمة المالية، ويحافظ على صورة المثل مع توضيح معناها النقدي في الحاشية.
- source_word: ἐν τῇ γῇ
  choice: في الأرض
  rationale: تعبير عربي واضح يدل هنا على موضع إخفاء المال في التراب.
- source_word: ἴδε
  choice: انظر
  rationale: أداة طبيعية لجذب الانتباه، من غير صياغة قديمة متكلفة.
- source_word: ἔχεις τὸ σόν
  choice: هذا ما لك
  rationale: يحافظ على التشديد في ضمير الملكية، ويعبّر طبيعيًا عن رد العبد ما يخص سيده.
theological_decisions:
- issue: معنى τάλαντον في المثل وإمكان فهمه على أنه موهبة فطرية
  choice: إبقاء المصطلح التاريخي «وزنة» في المتن، مع بيان دلالته المالية في الحاشية.
  alternative: مبلغ كبير من المال
  rationale: اللفظة اليونانية تشير إلى وحدة كبيرة من الوزن أو المال، لا إلى القدرة أو الموهبة الطبيعية. ويحافظ استعمال «وزنة» على الصورة التاريخية للمثل من غير إقرار المعنى المجازي اللاحق.
translation_notes:
  register: العربية فصحى حديثة واضحة وكريمة النبرة. وُضعت علامة الحاشية بعد «وزنتك» لأنها الكلمة التي تشرحها الحاشية، لا بعد عبارة الخوف.
