source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: ar
  text: 'فقالوا له: «أتسمع ما يقوله هؤلاء؟» فقال لهم يسوع: «نعم. أما قرأتم قط: ‹من أفواه الأطفال والرُّضَّع أعددتَ تسبيحًا›؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يقتبس يسوع هنا مزمور 8:2 بحسب التقليد اليوناني للكتاب المقدس. أمّا النص العبري فتُترجم عبارته عادةً: «من أفواه الأطفال والرُّضَّع أسستَ قوة».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: أتسمع
  rationale: مضارع في سؤال مباشر، وصيغة «أتسمع» عربية واضحة تحفظ نبرة الاعتراض الموجَّه إلى يسوع.
- source_word: τί οὗτοι λέγουσιν
  choice: ما يقوله هؤلاء
  rationale: تحفظ «هؤلاء» الإشارة التي قد تحمل شيئًا من الانتقاص، من غير إضافة اسم غير موجود في اليونانية؛ والمضارع العربي يؤدي معنى القول الجاري في السياق.
- source_word: λέγει
  choice: فقال لهم يسوع
  rationale: استُخدم الماضي العربي الطبيعي في السرد بدل محاكاة المضارع التاريخي اليوناني على نحو قد يبدو متكلفًا، من غير تغيير الحدث أو مضمونه.
- source_word: Ναί
  choice: نعم
  rationale: مقابل مباشر وطبيعي لأداة الإثبات البسيطة.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: أما قرأتم قط
  rationale: صياغة استفهامية إنكارية فصيحة وطبيعية، تحفظ نبرة التوبيخ بشأن معرفتهم بالكتاب.
- source_word: Ἐκ στόματος
  choice: من أفواه
  rationale: الجمع في العربية أنسب مع تعدد الأطفال والرُّضَّع، ويحفظ صورة خروج التسبيح من أفواههم.
- source_word: νηπίων
  choice: الأطفال
  rationale: يدل اللفظ على صغار السن، و«الأطفال» واضحة ولا تطمس التمييز عن الفئة التالية، أي الرُّضَّع.
- source_word: θηλαζόντων
  choice: الرُّضَّع
  rationale: لفظ عربي موجز ودقيق لمن يرضعون، ويحفظ الصورة من غير تعبير قديم أو ثقيل.
- source_word: κατηρτίσω
  choice: أعددتَ
  rationale: ينقل معنى الإعداد والتهيئة في نص الاقتباس اليوناني، من غير استبداله بقراءة النص العبري «أقمت قوة».
- source_word: αἶνον
  choice: تسبيحًا
  rationale: مقابل طبيعي للاسم بمعنى المدح الموجَّه إلى الله، وأنسب في هذا السياق من «مدحًا».
theological_decisions:
- issue: صياغة اقتباس مزمور 8:2 في حجة يسوع
  choice: 'إبقاء نص متى اليوناني في المتن: «أعددتَ تسبيحًا»'
  alternative: 'الصياغة المبنية على النص العبري: «أقمتَ قوة»'
  rationale: ينبغي ترجمة الاقتباس كما أورده متى وفق التقليد الكتابي اليوناني، لا مواءمته ضمنًا مع النص العبري؛ وتُذكر الصياغة العبرية في الحاشية لإيضاح الاختلاف النصي المشروع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «الرُّضَّع» للدقة والإيجاز، وحُفظ الاستفهام التوبيخي والاختلاف بين نص متى اليوناني وصياغة المزمور العبرية. وُضع مؤشر الحاشية بعد الاقتباس الذي تتعلق به مباشرة.
