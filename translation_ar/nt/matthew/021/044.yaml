    rationale: العبارة «وَمَنْ يَقَعْ هُوَ عَلَيْهِ» مضطربة؛ فالضمير «هو» لا يثبت أن الحجر هو الذي يقع. الأصل يجعل الحجر فاعل «πέσῃ»، والشخص هو الواقع عليه الحجر.
  - severity: medium
    issue: دمج الحاشية المعجمية والحاشية النصية تحت علامة واحدة موضوعة في نهاية الآية
    rationale: البديل المعجمي يخص «يسحقه»، فينبغي أن ترتبط علامته به؛ أما تنبيه غياب الآية في بعض المخطوطات فيتعلق بالآية كلها ويحتاج علامة مستقلة.
