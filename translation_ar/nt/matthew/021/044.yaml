  to: وَمَنْ يَقَعْ عَلَى هذَا الْحَجَرِ يَتَحَطَّمْ؛ وَأَمَّا مَنْ يَقَعْ عَلَيْهِ الْحَجَرُ، فَيَسْحَقُهُ[a].[b]
  rationale: صُحِّح الشطر الثاني لإظهار أن الحجر، لا الشخص، هو فاعل السقوط، مع إبقاء المقابلة التصويرية بين التكسّر عند السقوط على الحجر والسحق عند وقوع الحجر على الشخص. وفُصلت الحاشيتان ووُضعت علامة البديل المعجمي بعد الفعل الذي تشرحه، وعلامة الاختلاف النصي بعد الآية.
