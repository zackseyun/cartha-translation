base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: ar
  text: وَمَنْ يَقَعْ عَلَى هذَا الْحَجَرِ يَتَحَطَّمْ؛ وَأَمَّا مَنْ يَقَعْ عَلَيْهِ الْحَجَرُ، فَيَسْحَقُهُ[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أشد: «يَسْحَقُهُ حتّى يصير مسحوقًا» أو «يَذْرُوهُ كالعُصافة».'
    reason: lexical_alternative
  - marker: b
    text: هذه الآية غير موجودة في بعض مخطوطات إنجيل متّى، ولها نظير في لوقا 20:18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: مَنْ يَقَعْ
  rationale: اسم الفاعل المعرّف مستعمل استعمالًا اسميًّا عامًا؛ وصيغة «مَنْ يَقَعْ» تنقل هذا العموم بصورة عربية طبيعية.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: عَلَى هذَا الْحَجَرِ
  rationale: ترجمة مكانية مباشرة تحفظ لفظ «الحجر» وصورته في السياق السابق.
- source_word: συνθλασθήσεται
  choice: يَتَحَطَّمْ
  rationale: ينقل الفعل المبني للمجهول معنى التكسّر الشديد، مع إبقاء فرق دلالي عن الفعل الأقوى في الشطر الثاني.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: وَمَنْ يَقَعْ هُوَ عَلَيْهِ
  rationale: تحفظ العبارة انقلاب جهة السقوط، إذ يصبح الحجر هو الساقط، ويزيل الضمير «هو» التباس الفاعل في العربية.
- source_word: λικμήσει
  choice: يَسْحَقْهُ
  rationale: «يسحقه» واضحة وقوية، وتلائم معنى التفتيت أو السحق الشديد من غير أن تفرض صورة التذرية وحدها.
- source_word: αὐτόν
  choice: ـهُ
  rationale: الضمير المفرد المذكر يعود إلى الشخص المذكور بصيغة العموم، موافقًا لبنية الأصل.
theological_decisions:
- issue: صورة الحجر ودينونة السحق
  choice: 'الإبقاء على لفظ «الحجر» وعلى الفعلين المتميزين: «يتحطم» و«يسحقه» بلا تفسير مضاف.'
  alternative: التصريح في المتن بأن الحجر هو المسيح، أو توحيد الفعلين في تعبير عام عن الهلاك.
  rationale: الآية نفسها تصوغ صورة مَثَلية، أما هوية الحجر فتُفهم من السياق؛ لذا تُحفظ الصورة وحدّتها من غير توسع تفسيري.
- issue: المرجع المذكر المفرد العام
  choice: استعمال ضمير المفرد المذكر «ـه».
  alternative: استبداله بتعبير غير شخصي أو بصيغة الجمع.
  rationale: يحفظ ذلك عدد الضمير وجنسه النحويين وقوة المثال الفردي في اليونانية.
- issue: وجود الآية في التقليد النصي
  choice: إثبات الآية في المتن مع بيان اختلاف المخطوطات في الحاشية.
  alternative: حذف الآية من المتن أو إدراج التنبيه النصي داخله.
  rationale: نص SBLGNT يطبع العبارة مع علامات تدل على الشك النصي، ومن ثم يلزم عرضها مع حاشية صريحة تحفظ الدليل المخطوطي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدمت صيغة الشرط «مَنْ... يَتَحَطَّمْ / يَسْحَقْ» لنقل العموم المَثَلي، وأُبرز الضمير «هو» لتوضيح أن الحجر هو فاعل السقوط في الشطر الثاني.
