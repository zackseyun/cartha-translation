review_pass:
  verdict: revise
  source_fidelity: 'يحتاج الشطر الثاني إلى تصحيح نحوي ودلالي: «وَمَنْ يَقَعْ هُوَ عَلَيْهِ» لا يجعل الحجر فاعل السقوط على نحو سليم، بل يوهم بأن «مَن» هو الفاعل. النص اليوناني يعكس اتجاه الصورة بوضوح: الحجر هو الذي يقع على الشخص. أما الشطر الأول، فـ«يَتَحَطَّمْ» ينقل نتيجة التكسّر الشديد بصورة مفهومة، مع التمييز المناسب عن «يَسْحَقُهُ».'
  naturalness: الصياغة المقترحة فصيحة وحديثة ومباشرة. تركيب «مَنْ يَقَعْ عَلَيْهِ الْحَجَرُ، فَيَسْحَقُهُ» يرفع الالتباس ويجعل مرجع الفاعل طبيعيًا في العربية.
  terminology: «الحجر» مناسب لـ λίθος ويحافظ على صلة الآية بالسياق. و«يسحقه» مناسب لـ λικμήσει مع إمكان بيان صورة التذرية الأشد في حاشية. يلزم فصل الحاشيتين لأنهما تعالجان مسألتين مختلفتين، ووضع كل علامة عند موضعها المناسب.
  issues:
