id: MAT.21.46
reference: Matthew 21:46
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: ar
  text: ومع أنهم كانوا يسعون إلى القبض عليه، خافوا الجموع، لأنها كانت تعدّه نبيًّا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: ومع أنهم كانوا يسعون
  rationale: 'اسم الفاعل المضارع يدل على مسعى مستمر، والسياق يقتضي علاقة استدراكية مع الفعل الرئيس: سعوا إلى القبض عليه، لكن خوفهم منعهم.'
- source_word: κρατῆσαι
  choice: إلى القبض عليه
  rationale: في هذا السياق العدائي يدل الفعل على الإمساك بشخص بقصد احتجازه، و«القبض عليه» تعبير عربي طبيعي ودقيق.
- source_word: ἐφοβήθησαν
  choice: خافوا
  rationale: ينقل الماضي اليوناني مباشرة من غير افتراض دلالة ابتدائية مثل «أخذوا يخافون».
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: يحافظ على صيغة الجمع ويشير طبيعيًّا إلى جماعات الناس الحاضرة.
- source_word: ἐπεὶ εἰς
  choice: لأنها
  rationale: تقدم العبارة سبب خوفهم؛ وأعيد الضمير المؤنث المفرد إلى «الجموع» بحسب المطابقة العربية الطبيعية.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: كانت تعدّه نبيًّا
  rationale: ينقل التركيب الاصطلاحي بمعنى اعتبار شخص في منزلة أو صفة معينة، من غير حرفية مستغلقة.
- source_word: προφήτην
  choice: نبيًّا
  rationale: النكرة ملائمة هنا لأنها تصف إدراج يسوع في فئة الأنبياء بحسب تقدير الجموع.
theological_decisions:
- issue: نقل تقدير الجموع ليسوع بوصفه προφήτην من غير إضافة حكم مسيحي يتجاوز الآية أو ينتقص منه
  choice: كانت تعدّه نبيًّا
  alternative: كانت تعتبره نبيًّا؛ كانت تراه نبيًّا
  rationale: يعرض النص منظور الجموع، لا تعريفًا لاهوتيًّا كاملًا لهوية يسوع؛ لذا تحفظ الصياغة هذا المنظور ولا توحي بأنه لم يكن إلا نبيًّا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «ومع أنهم» لإظهار العلاقة الاستدراكية التي يفهمها السياق، و«الجموع» للمحافظة على جمع الأصل.
