  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: ar
  text: 'لكن لما رأى رؤساء الكهنة والكتبة الأمور العجيبة التي صنعها، والأطفال يصرخون في الهيكل[a] قائلين: «أوصنا[b] لابن داود!» اغتاظوا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية ἱερόν إلى مجمّع الهيكل أو ساحاته، لا إلى القدس الداخلي تحديدًا.
    reason: cultural_note
  - marker: b
    text: «أوصنا» هتاف ذو أصل عبري، معناه نحو «خلّصنا، نرجوك» أو «خلّصنا الآن»، وقد صار يُستعمل أيضًا هتافًا للمديح.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: لما رأى
  rationale: صياغة عربية طبيعية تنقل دلالة اسم الفاعل الماضي بوصفه ظرفًا زمنيًا للفعل الرئيس.
- source_word: δὲ
  choice: لكن
  rationale: تنقل التحول التقابلي المعتدل بين المشهد السابق ورد فعل القادة.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف للسلطات الكهنوتية القيادية بصيغة الجمع، لا لرئيس كهنة واحد.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: مقابل مباشر ومستقر لا يضيف تفسيرًا وظيفيًا غير مصرح به في النص.
- source_word: τὰ θαυμάσια
  choice: الأمور العجيبة
  rationale: يحافظ على الإشارة العامة إلى ما يثير العجب من غير حصرها صراحة في المعجزات.
- source_word: ἐποίησεν
  choice: صنعها
  rationale: فعل عربي واضح يوافق المفعول العام ويحافظ على بساطة الفعل اليوناني.
- source_word: παῖδας
  choice: الأطفال
  rationale: هو المعنى الأرجح في السياق، أما معنى الخدم فبعيد هنا، و«الصبيان» أضيق من اللازم.
- source_word: κράζοντας
  choice: كانوا يصرخون
  rationale: ينقل النداء المرتفع العلني دون أن يضفي عليه معنى العداء.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: تعبير عربي موجز ومألوف، مع توضيح أن المقصود مجمّع الهيكل لا القدس الداخلي في الحاشية.
- source_word: λέγοντας
  choice: قائلين
  rationale: يربط مضمون النداء بالفعل السابق ربطًا طبيعيًا في العربية.
- source_word: Ὡσαννὰ
  choice: أوصنّا
  rationale: نقل صوتي للهتاف ذي الأصل العبري يحفظ كونه طلب خلاص وهتاف مديح معًا، وتوضح الحاشية معناه.
- source_word: τῷ υἱῷ Δαυίδ
  choice: لابن داود
  rationale: يحافظ على اللقب المسياني حرفيًا، واللام تقابل علاقة صيغة المجرور بالهتاف على نحو طبيعي.
- source_word: ἠγανάκτησαν
  choice: اغتاظوا
  rationale: ينقل قوة الاستياء المصحوب بالغضب التي يدل عليها الفعل.
theological_decisions:
- issue: الدلالة المسيانية لعبارة «ابن داود»
  choice: 'الإبقاء على اللقب حرفيًا: «ابن داود»'
  alternative: وارث داود
  rationale: العبارة لقب مسياني مقصود في إنجيل متى، وإعادة صياغتها تفسيرًا تضعف صلتها اللفظية والسردية.
- issue: دلالة Ὡσαννὰ المزدوجة
  choice: النقل الصوتي «أوصنّا» في المتن مع شرح في الحاشية
  alternative: خلّص الآن / نرجوك خلّص
  rationale: الكلمة متأصلة في طلب الخلاص، لكنها تؤدي هنا أيضًا وظيفة هتاف المديح؛ والنقل الصوتي مع الحاشية يحفظ التوتر الدلالي بدل حسمه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت ألفاظ كتابية مألوفة مثل «رؤساء الكهنة» و«الكتبة» و«ابن داود»، مع تجنب التفسير الطائفي أو حصر «الأمور العجيبة» في نوع واحد من الأفعال.
