  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: ar
  text: وكلُّ ما تطلبونه[a] في الصلاة، وأنتم تؤمنون[b]، ستنالونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيَّ شيء تطلبونه» أو «كلَّ شيء تطلبونه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وأنتم واثقون»؛ ويدل اسم الفاعل اليوناني على الإيمان الملازم للصلاة والطلب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: كلُّ ما
  rationale: تعبير عربي طبيعي شامل يقابل التركيب اليوناني الذي يعني «كل ما» أو «أيًّا كان ما»، ويحفظ اتساع الدلالة.
- source_word: ἂν αἰτήσητε
  choice: تطلبونه
  rationale: يفيد التركيب اليوناني الطلب في جملة موصولة غير محددة. وصيغة «تطلبونه» طبيعية في العربية ولا تبالغ في إظهار الدلالة الاحتمالية للأداة ἄν مع صيغة الالتزام.
- source_word: ἐν τῇ προσευχῇ
  choice: في الصلاة
  rationale: تنقل العبارة الاسمية اليونانية مباشرة وبأسلوب عربي مألوف، من غير تحويلها إلى جملة زمنية مثل «حين تصلّون».
- source_word: πιστεύοντες
  choice: وأنتم تؤمنون
  rationale: تحفظ دلالة اسم الفاعل المضارع على الإيمان الملازم لطلبهم في الصلاة، من غير تحويله إلى شرط صريح.
- source_word: λήμψεσθε
  choice: ستنالونه
  rationale: تنقل المستقبل اليوناني بوضوح، والفعل «تنالون» فصيح طبيعي في هذا السياق وأرفع أسلوبًا من بدائل عامية.
theological_decisions:
- issue: علاقة الإيمان باستجابة الصلاة
  choice: وأنتم تؤمنون
  alternative: إن آمنتم / بشرط أن تؤمنوا
  rationale: النص اليوناني يستخدم اسم فاعل لا جملة شرطية صريحة. تحافظ الصياغة المختارة على الصلة الواضحة بين الصلاة والإيمان من غير حسم كيفية هذه الصلة أو نطاق الوعد بما يتجاوز تركيب النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. وُضعت علامة الحاشية [a] بعد العبارة التي تشرحها مباشرة، وحُفظت صيغة المشاركة الزمنية في πιστεύοντες من خلال الجملة الحالية «وأنتم تؤمنون».
