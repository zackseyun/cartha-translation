source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: ar
  text: فأمسك الكرّامون عبيده[a]، فضربوا واحدًا، وقتلوا آخر، ورجموا آخر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خدمه». يمكن أن يدل اللفظ اليوناني على العبيد أو الخدم بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: الكرّامون
  rationale: يدل اللفظ هنا على القائمين بزراعة الكرم، ويُفهم من سياق المثل أنهم مستأجرون له. «الكرّامون» موجزة وطبيعية وتحافظ على الصورة الزراعية من غير إضافة وصف غير مصرح به في اللفظ نفسه.
- source_word: λαβόντες
  choice: فأمسك
  rationale: ينقل معنى الأخذ والإمساك السابق للأفعال التالية، وصيغته العربية تربط الأحداث بسلاسة من غير المبالغة في القوة التي قد يوحي بها «انقضّوا على».
- source_word: δούλους
  choice: عبيده
  rationale: «عبيد» المقابل المباشر للفظ اليوناني، كما أن الإضافة إلى المالك ملائمة للسياق. ويُذكر احتمال «خدمه» في الحاشية لأن اللفظ قد يُفهم بحسب السياق على الوجهين.
- source_word: ἔδειραν
  choice: فضربوا
  rationale: ينقل المعنى العام للضرب من غير تخصيص وسيلته أو جعله جلدًا رسميًا.
- source_word: ἀπέκτειναν
  choice: وقتلوا
  rationale: مقابل مباشر لا يضيف دلالة قضائية أو توصيفًا أخلاقيًا زائدًا.
- source_word: ἐλιθοβόλησαν
  choice: ورجموا
  rationale: «رجم» هو المقابل العربي الموجز والدقيق للاعتداء بالحجارة.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: واحدًا ... آخر ... آخر
  rationale: يحافظ على التوزيع بين ثلاثة أشخاص وعلى الإيقاع المتوازي للعبارة اليونانية.
theological_decisions:
- issue: دلالة δοῦλος في سرد المثل
  choice: عبيده
  alternative: خدمه
  rationale: اختير اللفظ الأقرب إلى معنى التبعية والملكية في النص، مع إبقاء البديل السياقي في الحاشية بدل حسم المجال الدلالي بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع توازٍ إيقاعي بين الأفعال الثلاثة. استُعمل «الكرّامون» لملاءمة سياق الكرم، ووُضعت علامة الحاشية مباشرة بعد اللفظ الذي تتناوله.
