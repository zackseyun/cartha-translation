  source_fidelity: 'النص العربي أمين لليونانية: «الكرّامون» مناسب لسياق مثل الكرم، و«أمسك» ينقل λαβόντες دون زيادة، وتحافظ الأفعال «ضربوا... قتلوا... رجموا» على الترتيب والمعنى. كما أن «واحدًا... آخر... آخر» تنقل التوزيع المقصود بين ثلاثة عبيد.'
