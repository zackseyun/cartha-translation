  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: ar
  text: 'فأجابهم يسوع: «وسأسألكم أنا أيضًا سؤالًا واحدًا: إن أجبتموني عنه، أخبركم أنا أيضًا بأيّ سلطان أفعل هذه الأمور.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: فأجابهم يسوع
  rationale: صيغتا المشاركة والفعل القول تؤديان معًا تعبيرًا سرديًا اصطلاحيًا عن الرد؛ والصياغة العربية الموجزة تحفظ معنى الاستجابة من غير تكرار متكلف، بينما تنقل الفاء الانتقال المتصل بالسياق.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: وسأسألكم أنا أيضًا
  rationale: يحفظ المستقبل ومعنى السؤال، ويبرز «أنا أيضًا» دلالة المقابلة والمعاملة بالمثل في κἀγώ.
- source_word: λόγον ἕνα
  choice: سؤالًا واحدًا
  rationale: مع أن λόγος قد يعني «كلمة» أو «أمرًا»، فإن سياق الاستفهام والجواب يجعل «سؤالًا واحدًا» التعبير العربي الطبيعي والدقيق هنا.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: إن أجبتموني عنه
  rationale: المعنى السياقي لـ λέγω هو إعطاء الرد المطلوب؛ و«أجبتموني عنه» أوضح في العربية، مع إبقاء الشرط وإحالة الضمير إلى السؤال.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: أخبرتكم أنا أيضًا
  rationale: «أخبرتكم» تنقل معنى القول الموجَّه إليهم بصورة طبيعية، وتكرار «أنا أيضًا» يحفظ التوازي والمقابلة في الأصل.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: بأيّ سلطان
  rationale: الباء تعبّر طبيعيًا عن أساس الفعل أو التفويض الذي يُمارس به، و«سلطان» مقابل راسخ وواضح لـ ἐξουσία في هذا السياق.
- source_word: ταῦτα ποιῶ
  choice: أفعل هذه الأمور
  rationale: تحفظ جمع اسم الإشارة وإحالة العبارة إلى أعمال يسوع موضع النزاع، كما يحفظ المضارع دلالة الفعل الجاري أو العام.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة طبيعية غير حرفية على نحو مفرط، مع الحفاظ على بنية المقابلة بين سؤال يسوع وإخباره لهم بسلطانه. لا حاجة إلى حاشية لأن «سؤالًا» يبيّن المعنى السياقي لـ λόγον ἕνα من دون خسارة دلالية مؤثرة.
