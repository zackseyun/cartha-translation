  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: ar
  text: 'ثم أتى إلى الثاني وقال له مثل ذلك. فأجاب: «سأذهب[a]، يا سيدي[b]»، لكنه لم يذهب.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أنا»؛ وهو جواب مقتضب يُفهم منه: «سأذهب» أو «سأفعل».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة الكلمة اليونانية: «يا مولاي» أو «يا رب»؛ لكنها هنا نداء احترام موجّه إلى أب بشري.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: أتى إلى
  rationale: يفيد اقتراب الأب من الابن الثاني، و«أتى إلى» تعبير عربي طبيعي يحافظ على حركة السرد.
- source_word: τῷ δευτέρῳ
  choice: الثاني
  rationale: النص اليوناني يقول «الثاني» دون تكرار كلمة «الابن»، والسياق يوضح المقصود.
- source_word: ὡσαύτως
  choice: مثل ذلك
  rationale: تشير العبارة إلى أن الأب وجّه إلى الثاني القول نفسه الذي وجّهه إلى الأول.
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: صياغة عربية موجزة وطبيعية تؤدي معنى التركيب اليوناني الشائع «أجاب وقال» دون تكرار ثقيل.
- source_word: Ἐγώ
  choice: سأذهب
  rationale: اللفظ اليوناني هو الضمير المؤكد «أنا» وحده، لكنه جواب مقتضب يفيد الموافقة على الذهاب؛ أُظهر الفعل المضمر ليكون المعنى واضحًا بالعربية، مع توثيق الحرفي في الحاشية.
- source_word: κύριε
  choice: يا سيدي
  rationale: نداء احترام موجّه هنا إلى أب بشري؛ و«يا سيدي» يحفظ الاحترام من غير أن يفرض دلالة لاهوتية.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: لكنه لم يذهب
  rationale: نُقلت καί بأداة استدراك لأن المقابلة بين الوعد وعدم التنفيذ هي المقصودة في السياق.
theological_decisions:
- issue: دلالة κύριε في خطاب الابن لأبيه
  choice: يا سيدي
  alternative: يا رب؛ يا مولاي
  rationale: السياق خطاب احترام لأب بشري، لا لقب إلهي أو مسياني. وتحافظ «يا سيدي» على الاحترام مع إبقاء البدائل الدلالية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ إيجاز السرد، وأُظهر الفعل المضمر في جواب الابن لسلامة العربية، مع بيان الصيغة الحرفية في الحاشية.
