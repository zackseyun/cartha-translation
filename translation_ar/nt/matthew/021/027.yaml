  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ar
  text: 'فأجابوا يسوع وقالوا: «لا نعرف». فقال لهم هو أيضًا: «ولا أنا أقول لكم بأيّ سلطان أفعل هذه الأمور».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: فأجابوا ... قائلين
  rationale: ينقل صيغة المشاركة التي تمهّد للجواب، مع تركيب عربي طبيعي وواضح.
- source_word: Οὐκ οἴδαμεν
  choice: لا نعرف
  rationale: ترجمة مباشرة للنفي مع فعل المعرفة، وتحافظ على إيجاز جوابهم.
- source_word: ἔφη
  choice: فقال
  rationale: فعل قول بسيط غير محمّل بدلالة تفسيرية زائدة، والفاء تلائم تعاقب الحوار.
- source_word: καὶ αὐτός
  choice: هو أيضًا
  rationale: 'يحفظ معنى المقابلة والتجاوب: كما امتنعوا عن الإجابة، جاء رد يسوع عليهم بالمثل.'
- source_word: Οὐδὲ ἐγὼ
  choice: ولا أنا
  rationale: يحافظ على صيغة النفي المقابل وعلى إبراز الضمير ἐγώ دون تحويل المضارع صراحة إلى مستقبل.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة قريبة من المضارع اليوناني وتحافظ على فعل القول، مع بقاء معنى الامتناع عن الإفصاح واضحًا من السياق.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: بأيّ سلطان
  rationale: الباء تعبّر طبيعيًا عن أساس الفعل أو الصلاحية التي يُمارَس بها، و«سلطان» لفظ عربي واضح ذو قوة حقوقية تتجاوز مجرد القدرة.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحفظ جمع اسم الإشارة ويشير إلى أفعال يسوع موضع السؤال دون حصرها في فعل واحد.
- source_word: ποιῶ
  choice: أفعل
  rationale: يحافظ على المضارع البسيط ودلالته على أفعال يسوع في هذا السياق.
theological_decisions:
- issue: دلالة ἐξουσία في جواب يسوع
  choice: سلطان
  alternative: صلاحية؛ حق؛ قدرة
  rationale: السياق يتعلق بمصدر مشروعية أفعال يسوع وحقه في القيام بها، لا بمجرد استطاعته؛ و«سلطان» يحفظ المجالين الحقوقي واللاهوتي دون تحديد مصدر السلطان تفسيرًا.
- issue: زمن λέγω في عبارة الرفض
  choice: أقول لكم
  alternative: سأقول لكم؛ أخبركم
  rationale: الأصل يستعمل المضارع، فحُفظ في العربية لأن صيغة «ولا أنا أقول لكم» تؤدي معنى الرفض في السياق من غير فرض صيغة مستقبلية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على إيجاز الحوار، وعلى المقابلة بين جواب القادة ورد يسوع، من غير إضافة تفسير لسبب رفضه أو لمصدر سلطانه.
