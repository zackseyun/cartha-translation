  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: ar
  text: فأخذوه، وألقوه خارج الكرم[a]، وقتلوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأخرجوه من الكرم».'
    reason: بديل معجمي للفعل ἐκβάλλω ولصياغة الحركة إلى خارج الكرم.
lexical_decisions:
- source_word: λαβόντες
  choice: فأمسكوه
  rationale: اسم فعل ماضٍ من λαμβάνω يفيد هنا أخذ الابن والإمساك به تمهيدًا لما يليه. «أمسكوه» عربية طبيعية ولا تضيف بالضرورة درجة العنف التي قد توحي بها «قبضوا عليه».
- source_word: ἐξέβαλον
  choice: طرحوه خارج
  rationale: الفعل ἐκβάλλω يدل على الإخراج أو الطرح إلى الخارج. «طرحوه خارج» يحافظ على قوة الفعل وعلى الحركة المكانية، مع إثبات بديل أقل قوة في الحاشية.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: خارج الكرم
  rationale: العبارة تحدد الموضع خارج الكرم بعد إخراجه منه، وصياغة «خارج الكرم» واضحة ومباشرة في العربية.
- source_word: ἀμπελῶνος
  choice: الكرم
  rationale: ἀμπελών يعني بستان العنب أو الكرم، و«الكرم» هو المقابل العربي الموجز والمألوف في هذا السياق.
- source_word: ἀπέκτειναν
  choice: وقتلوه
  rationale: ἀποκτείνω يعني القتل. «قتلوه» ترجمة مباشرة لا تضيف التوصيف التفسيري الذي قد تحمله «اغتالوه» أو «قتلوه عمدًا».
theological_decisions:
- issue: ترتيب إخراج الابن من الكرم وقتله بالمقارنة مع الروايات الموازية
  choice: 'إبقاء ترتيب متى: أمسكوه، ثم طرحوه خارج الكرم، ثم قتلوه.'
  alternative: تغيير الترتيب أو صياغته بما يوافق ترتيب مرقس ولوقا.
  rationale: النص اليوناني في متى يصرح بهذا التسلسل، لذلك تُحفظ رواية متى كما هي من غير مواءمة ضمنية مع الروايات الموازية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع نبرة سردية رصينة. حُفظ تتابع الأفعال في الأصل، واستُعملت «الكرم» بالمعنى المألوف لبستان العنب.
