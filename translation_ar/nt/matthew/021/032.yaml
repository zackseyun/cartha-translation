revisions:
- from: لأن يوحنا جاءكم في طريق البر[a]، فلم تصدّقوه، أما جباة الضرائب والبغايا فصدّقوه. وأنتم، مع أنكم رأيتم ذلك، لم تغيّروا رأيكم بعدئذ لتصدّقوه[b][c].
  to: لأن يوحنا جاءكم في طريق البر[a]، فلم تصدّقوه، أما جباة الضرائب والبغايا فصدّقوه. وأنتم، حتى بعد أن رأيتم ذلك، لم تغيّروا رأيكم لاحقًا لتصدّقوه[b][c].
  rationale: يُستبدل التركيب التنازلي العام بعبارة «حتى بعد أن» لإظهار تشديد οὐδὲ مع الظرف ὕστερον، مع الإبقاء على معنى الرؤية والتغيّر اللاحق في الرأي والغاية المتمثلة في تصديق يوحنا. لا يلزم أي تغيير في المعنى اللاهوتي أو في ترتيب الحواشي، وتُصحّح فقط صيغة «بارّة» في الحاشية.
