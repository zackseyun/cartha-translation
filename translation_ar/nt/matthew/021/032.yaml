source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: ar
  text: لأن يوحنا جاءكم في طريق البر[a]، فلم تصدّقوه، أما جباة الضرائب والبغايا فصدّقوه. وأنتم، حتى بعد أن رأيتم ذلك، لم تغيّروا رأيكم لاحقًا لتصدّقوه[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بطريقة بارّة»، أو «في سبيل البر». قد تصف العبارة اليونانية سيرة يوحنا وخدمته، أو طريق البر الذي نادى به.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لم تندموا بعد ذلك فتصدّقوه»، أو «لم تتوبوا بعد ذلك فتصدّقوه». الفعل هنا هو μεταμέλομαι، ويدل بصورة أخص على الندم أو تغيّر الرأي، لا الفعل الأشهر للتوبة μετανοέω.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لتثقوا به». يمكن أن يفيد الفعل اليوناني تصديق الشخص أو الوثوق به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: لأن ... جاء
  rationale: تفيد γάρ تعليل التوبيخ السابق، و«لأن» توضح الصلة الحجاجية طبيعيًا في العربية، أما ἦλθεν فالمقابل السردي المباشر له هو «جاء».
- source_word: πρὸς ὑμᾶς
  choice: جاءكم
  rationale: صياغة عربية موجزة وطبيعية تحفظ معنى المجيء إلى المخاطَبين.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: في طريق البر
  rationale: تحفظ استعارة الطريق وإضافة δικαιοσύνη، من غير حصر العبارة في سلوك يوحنا أو في الطريق الذي نادى به.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: لم تصدّقوه / فصدّقوه
  rationale: الفعل πιστεύω مع المجرور الدال على الشخص يفيد تصديقه أو الوثوق به؛ «صدّقوه» تلائم هنا الاستجابة ليوحنا ورسالته، وتحافظ على التوازي والتضاد.
- source_word: τελῶναι
  choice: جباة الضرائب
  rationale: تعبير عربي معاصر واضح عن جامعي الضرائب في السياق القديم.
- source_word: πόρναι
  choice: البغايا
  rationale: مقابل عربي مباشر وفصيح يحفظ القوة الاجتماعية والأخلاقية للفظ من غير تلطيف.
- source_word: ἰδόντες
  choice: مع أنكم رأيتم ذلك
  rationale: يبرز المعنى التنازلي المناسب للسياق؛ و«ذلك» يعود بوضوح إلى تصديق جباة الضرائب والبغايا.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: لم تغيّروا رأيكم بعدئذ
  rationale: يحفظ معنى μεταμέλομαι بوصفه تغيّرًا في الرأي أو ندمًا، ويميّزه عن اللفظ الأشهر للتوبة μετανοέω.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: لتصدّقوه
  rationale: 'تنقل تركيب الغاية/النتيجة بإيجاز طبيعي: لم يحدث تغيّر يقود إلى تصديق يوحنا.'
theological_decisions:
- issue: دلالة «طريق البر»
  choice: الإبقاء على العبارة المجازية «في طريق البر»
  alternative: بطريقة بارة / في سبيل البر
  rationale: التركيب اليوناني قد يصف سيرة يوحنا وخدمته البارتين، أو الطريق البار الذي أعلنه. إبقاء المجاز يحفظ هذا الاتساع ولا يحسمه.
- issue: دلالة πιστεύω مع αὐτῷ
  choice: تصدّقوه
  alternative: تثقوا به / تؤمنوا به
  rationale: السياق يركّز على قبول شهادة يوحنا ورسالته. «تصدّقوه» يحفظ هذا المعنى ولا يستورد صيغة عقدية أوسع من النص، مع الإشارة في الحاشية إلى معنى الثقة.
- issue: دلالة μετεμελήθητε
  choice: تغيّروا رأيكم
  alternative: تتوبوا / تندموا
  rationale: يحافظ الاختيار على الفرق المعجمي بين μεταμέλομαι وμετανοέω، من دون نفي البعد الأخلاقي الذي يتيحه السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُعمل «البر» بوصفه المقابل الكتابي الطبيعي لـ δικαιοσύνη، و«جباة الضرائب» للوضوح المعاصر، مع الحفاظ على التكرار المقصود في «تصدّقوه» وعلى التوتر الدلالي في «طريق البر» وμεταμέλομαι.
