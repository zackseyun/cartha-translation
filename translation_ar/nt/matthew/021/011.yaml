  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: ar
  text: 'وكانت الجموع تقول: «هذا هو النبي[a] يسوع، الذي من الناصرة في الجليل».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نبي». والنص اليوناني حرفيًا «النبي»، وقد يعكس ذلك تحديد الجموع هوية يسوع بوصفه شخصية نبوية معروفة.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: وكانت الجموع
  rationale: حُفظ جمع ὄχλοι بلفظ «الجموع»، ومُثّل الربط الخفيف δέ بالواو بما يلائم انسياب السرد العربي.
- source_word: ἔλεγον
  choice: تقول
  rationale: الماضي الناقص اليوناني يدل على قول جارٍ أو متكرر؛ وصيغة «كانت... تقول» تنقل هذا الجانب من دون تشديد زائد على التكرار.
- source_word: Οὗτός ἐστιν
  choice: هذا هو
  rationale: صياغة تعريفية عربية طبيعية تحافظ على اسم الإشارة وفعل الكينونة المفهوم في العبارة اليونانية.
- source_word: ὁ προφήτης
  choice: النبي
  rationale: أُبقيت أداة التعريف الظاهرة في اليونانية، مع عدم التصريح بما إذا كان الجمع يقصد النبي المنتظر تحديدًا أم شخصية نبوية معروفة.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: نقل الاسم الشخصي بصيغته العربية الكتابية الشائعة.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: الذي من الناصرة في الجليل
  rationale: «الذي من» يعكس التركيب الوصفي المعرّف، و«في الجليل» يوضح العلاقة الجغرافية المقصودة بعبارة طبيعية في العربية المعاصرة.
theological_decisions:
- issue: هل تُترجم ὁ προφήτης بصيغة المعرفة أم النكرة؟
  choice: النبي
  alternative: نبي
  rationale: النص اليوناني يستعمل أداة التعريف، وقد تحمل العبارة صدى «النبي» المنتظر أو تشير إلى شخصية نبوية معروفة. أُبقي التعريف في المتن، مع ذكر احتمال الدلالة غير التعيينية في الحاشية حفاظًا على التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «كانت الجموع تقول» لنقل الاستمرار في الفعل، و«الذي من الناصرة في الجليل» لتجنب التباس نسبة الجليل إلى الناصرة مع إبقاء العبارة طبيعية.
