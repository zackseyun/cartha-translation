  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني بدقة: الإحضار، الأتان والجحش، وضع الثياب عليهما، ثم الجلوس. واستعمال «الأتان» يعبّر عن تأنيث ὄνον في هذا السياق، و«الجحش» مناسب لـ πῶλον. أما الضمير الأخير فملتبس في اليونانية بين الحيوانين والثياب؛ اختارت العربية مرجع الثياب بحكم المطابقة النحوية الطبيعية، مع حفظ الاحتمال الآخر صراحة في الحاشية.'
