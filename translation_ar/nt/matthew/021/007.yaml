  terminology: «الأتان» و«الجحش» مصطلحان عربيان دقيقان ومألوفان في هذا السياق. و«ثيابهما» مقابل مناسب لـ ἱμάτια، مع إسناد مفهوم من السياق إلى التلميذين. لا تظهر أي حمولة تفسيرية أو عقائدية زائدة.
