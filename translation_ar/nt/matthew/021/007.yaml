  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: ar
  text: فأتيا بالأتان والجحش، ووضعا عليهما ثيابهما، فجلس فوقها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن يعود الضمير في الأصل اليوناني إلى الحيوانين: «فجلس فوقهما»؛ ويمكن أن يعود إلى الثياب الموضوعة عليهما.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: فأتيا بـ
  rationale: الفعل ἄγω يحتمل الإتيان بالشيء أو اقتياده؛ وصيغة «أتيا بـ» طبيعية في السياق وتحافظ على كون التلميذين أحضرا الحيوانين إلى يسوع.
- source_word: τὴν ὄνον
  choice: الأتان
  rationale: الاسم مع أداة التعريف المؤنثة يدل هنا على أنثى الحمار، و«الأتان» لفظ عربي فصيح ودقيق ومألوف في السياق الكتابي.
- source_word: τὸν πῶλον
  choice: الجحش
  rationale: πῶλος يدل على حيوان صغير، وهو في هذا السياق صغير الأتان؛ و«الجحش» هو المقابل العربي الموجز والدقيق.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: ووضعا عليهما ثيابهما
  rationale: «ثيابهما» تنقل ἱμάτια بوصفها الثياب الخارجية، وتُظهر الإضافة إلى التلميذين التي يفهمها السياق. والمثنى العربي يوضح أن الفاعلين هما التلميذان وأن الحيوانين اثنان.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: فجلس فوقها
  rationale: الضمير اليوناني جمع ويمكن أن يعود إلى الحيوانين أو إلى الثياب. والضمير العربي «ها» بعد «الثياب» يحافظ بصورة طبيعية على إمكان عوده إلى الثياب، مع بيان الاحتمال الآخر في الحاشية.
theological_decisions:
- issue: مرجع الضمير في ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: «فجلس فوقها» مع إبقاء مرجع الضمير غير مصرح به
  alternative: «فجلس فوقهما» أي فوق الحيوانين
  rationale: الغموض نحوي وسردي لا عقائدي. أقرب اسم سابق في العربية هو «ثيابهما»، فيُفهم طبيعيًا أنه جلس فوق الثياب الموضوعة على الحيوانين، لكن الحاشية تحفظ إمكان عودة ضمير الجمع اليوناني إلى الحيوانين.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل المثنى حيث يقتضيه السياق العربي، واختيرت «الأتان» و«الجحش» للدقة والإيجاز. وُضعت علامة الحاشية في النص الرئيس كما هو مطلوب.
