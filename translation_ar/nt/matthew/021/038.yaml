  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: ar
  text: 'أَمَّا الْكَرَّامُونَ، فَلَمَّا رَأَوْا الِابْنَ، قَالُوا فِيمَا بَيْنَهُمْ: «هَذَا هُوَ الْوَارِثُ. هَلُمُّوا نَقْتُلْهُ وَنَسْتَوْلِ عَلَى مِيرَاثِهِ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًّا: «ويكون لنا ميراثه»؛ والمقصود في السياق الاستيلاء عليه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: الكرّامون
  rationale: يدل السياق على مستأجري الكرم القائمين على زراعته، و«الكرّامون» تعبير عربي موجز وطبيعي يحافظ على صلة اللفظ بالكرم المذكور في المثل.
- source_word: ἰδόντες
  choice: فلما رأوا
  rationale: صياغة زمنية عربية طبيعية تحفظ تعاقب الحدث الذي تؤديه صيغة اسم الفاعل اليونانية الماضية.
- source_word: τὸν υἱόν
  choice: الابن
  rationale: ترجمة مباشرة تحافظ على أداة التعريف ولا تضيف ضمير ملكية غير مصرح به في هذا الموضع.
- source_word: ἐν ἑαυτοῖς
  choice: فيما بينهم
  rationale: تبيّن أن القول دار داخل جماعتهم، وهي أوضح في العربية من الترجمة الحرفية «في أنفسهم» في هذا السياق الجمعي.
- source_word: κληρονόμος
  choice: الوارث
  rationale: المقابل العربي الطبيعي والدقيق للمعنى القانوني المتعلق بالميراث.
- source_word: δεῦτε
  choice: هلمّوا
  rationale: أداة حث جماعية فصيحة ومفهومة تناسب الدعوة إلى الفعل المشترك.
- source_word: ἀποκτείνωμεν
  choice: نقتله
  rationale: تحفظ صيغة الحث ومعنى القتل دون إضافة توصيف قانوني أو أخلاقي زائد مثل «نغتاله» أو «نعدمه».
- source_word: σχῶμεν
  choice: نستولي على
  rationale: الفعل في أصله يفيد الامتلاك، لكن سياق قتل الوارث بقصد أخذ الميراث يدل على الاستيلاء؛ وتوضح الحاشية المقابل الأقرب إلى الحرفية.
- source_word: κληρονομίαν αὐτοῦ
  choice: ميراثه
  rationale: ينقل معنى κληρονομία وضمير αὐτοῦ بوضوح، ويحافظ على الصلة اللفظية بالوارث.
theological_decisions:
- issue: الإشارة المَثَلية إلى الابن
  choice: إبقاء «الابن» على مستوى رواية المثل بلا تصريح بأنه يسوع
  alternative: صياغة تفسيرية تكشف في النص نفسه أن الابن يرمز إلى يسوع
  rationale: يشير سياق إنجيل متى إلى يسوع، لكن الآية ذاتها تتكلم بلغة المثل؛ لذلك تحفظ الترجمة التوتر اللاهوتي ولا تدمج التفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الكرّامون» لاتساقه مع سياق الكرم، و«هلمّوا» للحث الجماعي. وُضع مؤشر الحاشية بعد الجملة التي تشرح الحاشية فعلها.
