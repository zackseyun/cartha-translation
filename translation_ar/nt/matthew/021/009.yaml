language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: ar
  text: 'وكانت الجموع التي تتقدّمه والتي تتبعه تهتف قائلة: «أُوصَنَّا[a] لابن داود[b]! مبارك الآتي باسم الرب[c]! أُوصَنَّا في الأعالي!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «أُوصَنَّا» هتاف ذو أصل عبري معناه نحو «خلّص، من فضلك» أو «خلّص الآن»، لكنه يُستعمل هنا أيضًا هتافَ مديح.
    reason: lexical_alternative
  - marker: b
    text: «ابن داود» لقب ملكي مسياني.
    reason: cultural_note
  - marker: c
    text: تُردِّد هذه العبارة صدى مزمور 118:26، حيث تعكس كلمة «الرب» الاسم الإلهي «يهوه» في النص العبري.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: تنقل معنى جماعات الناس المحتشدة بلفظ عربي فصيح ومألوف.
- source_word: οἱ προάγοντες αὐτὸν
  choice: التي تتقدّمه
  rationale: تصف السائرين أمام يسوع في الموكب من غير أن توحي بأنهم كانوا يقودونه رسميًا.
- source_word: οἱ ἀκολουθοῦντες
  choice: التي تتبعه
  rationale: تقابل العبارة السابقة بوضوح وتحافظ على صورة الموكب.
- source_word: ἔκραζον λέγοντες
  choice: تهتف قائلة
  rationale: «تهتف» تلائم النداء الجماعي المرتفع، وصيغة المضارع بعد «كانت» تحفظ دلالة الاستمرار في الفعل الناقص اليوناني.
- source_word: Ὡσαννά
  choice: أُوصَنَّا
  rationale: نقل صوتي للهتاف ذي الأصل العبري يحفظ طابعه الليتورجي، مع بيان معناه الأصلي ووظيفته السياقية في الحاشية.
- source_word: τῷ υἱῷ Δαυίδ
  choice: لابن داود
  rationale: اللام تؤدي دلالة المجرور اليوناني مع الهتاف، وتحفظ اللقب الداودي كما ورد من غير استبداله بتفسير.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: مبارك الآتي
  rationale: صياغة عربية موجزة وطبيعية تحفظ اسم الفاعل المعرّف ودلالته الفردية.
- source_word: ἐν ὀνόματι κυρίου
  choice: باسم الرب
  rationale: تعبير عربي مألوف ودقيق يحفظ الصيغة الكتابية ودلالة السلطان والانتساب من غير شرح زائد داخل المتن.
- source_word: ἐν τοῖς ὑψίστοις
  choice: في الأعالي
  rationale: يحفظ صيغة الجمع اليونانية والنبرة التعبدية، ولا يحسم هل المقصود الأماكن أو السماوات العليا.
theological_decisions:
- issue: اللقب المسياني الملكي τῷ υἱῷ Δαυίδ
  choice: إبقاء «ابن داود» لقبًا في المتن
  alternative: للمسيح
  rationale: النص اليوناني يستعمل اللقب الداودي نفسه؛ والإبقاء عليه يصون نسيجه التاريخي واللاهوتي من غير إدخال تفسير بديل.
- issue: دلالة Ὡσαννά
  choice: نقلها صوتيًا «أُوصَنَّا» مع حاشية تفسيرية
  alternative: خلّصنا، من فضلك / خلّص الآن
  rationale: هي هنا هتاف تعبدي اكتسب وظيفة المديح، مع بقاء أصله الدال على طلب الخلاص؛ لذلك يحفظ النقل الصوتي التوتر بين الأصل والاستعمال.
- issue: مرجع κυρίου في اقتباس المزمور
  choice: ترجمتها «الرب» مع توضيح خلفية الاسم الإلهي في الحاشية
  alternative: يهوه
  rationale: المصدر اليوناني يقرأ κυρίου، فيما يعكس نص مزمور 118 العبري الاسم الإلهي؛ يحفظ المتن صياغة اليونانية وتعرض الحاشية الخلفية النصية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وتعبدية. استُعمل «تهتف» بدل تركيب حرفي أثقل، مع الحفاظ على استمرار الفعل، وحُفظت الألقاب والصيغ الكتابية من غير توسع تفسيري داخل المتن.
