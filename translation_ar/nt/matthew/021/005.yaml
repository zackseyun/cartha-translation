base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: ar
  text: 'قولوا لابنة صهيون: «ها ملكك يأتي إليك وديعًا، راكبًا على حمار، وعلى جحش، ابن دابةٍ للحمل».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «وديعًا» بـ«متواضعًا». والكلمة اليونانية قد تدل على الوداعة أو الحِلم أو التواضع، وفي العبارة صدى لزكريا 9:9. كما يحفظ متى هنا صيغتين مترابطتين: «على حمار، وعلى جحش، ابن دابةٍ للحمل».'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: قولوا
  rationale: فعل أمر للجمع، ويحافظ على قوة التوجيه في مطلع الاقتباس.
- source_word: τῇ θυγατρὶ Σιών
  choice: لابنة صهيون
  rationale: يحفظ التشخيص النبوي الوارد في اليونانية وخلفيته الكتابية، من دون تسطيحه إلى «سكان صهيون».
- source_word: Ἰδοὺ
  choice: ها
  rationale: أداة تنبيه طبيعية وموجزة في العربية الفصحى المعاصرة.
- source_word: ὁ βασιλεύς σου
  choice: ملكك
  rationale: ينقل تركيب الملكية مباشرة ويحفظ الدلالة الملكية والمسيانية.
- source_word: ἔρχεταί σοι
  choice: يأتي إليك
  rationale: صياغة عربية طبيعية تحفظ حيوية المضارع واتجاه المجيء نحو المخاطَبة.
- source_word: πραῢς
  choice: وديعًا
  rationale: «وديع» يجمع معنى اللطف والحِلم وعدم العنف، مع إبقاء «متواضع» بديلًا معجميًا ممكنًا في الحاشية.
- source_word: ἐπιβεβηκὼς
  choice: راكبًا
  rationale: يؤدي معنى كونه قد امتطى الدابة، وهو أفصح وأطبع هنا من «ممتطيًا».
- source_word: ἐπὶ ὄνον
  choice: على حمار
  rationale: نقل مباشر وطبيعي للعبارة اليونانية.
- source_word: πῶλον
  choice: جحش
  rationale: في هذا السياق يدل على صغير الحمار، و«جحش» هو المقابل العربي الدقيق والمألوف كتابيًا.
- source_word: υἱὸν ὑποζυγίου
  choice: ابن دابة حمل
  rationale: يحفظ التعبير السامي «ابن» وعمومية ὑποζύγιον بوصفها دابة تُستخدم للحمل، من غير اختزاله إلى «ابن أتان» غير المصرح بها في النص اليوناني.
theological_decisions:
- issue: الاقتباس المسياني من زكريا 9:9 واحتمال مواءمته مع نص العهد القديم
  choice: 'الحفاظ على صياغة متى اليونانية: «وديعًا، راكبًا على حمار، وعلى جحش، ابن دابة حمل».'
  alternative: استعمال «متواضعًا»، أو دمج عبارتي الحيوان في مرجع واحد بصياغة تفسيرية.
  rationale: ينبغي أن تعكس الترجمة نص متى نفسه، بما فيه العطف بين عبارتي الحيوان، وألا تحسم العلاقة بينهما أو توائم النص ضمنيًا مع صيغة أخرى للاقتباس.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة نبوية كريمة. أُبقي تعبير «ابنة صهيون» والتوازي بين عبارتي الحيوان، مع تجنب الألفاظ القديمة غير الضرورية. وُضعت علامة الحاشية [a] بعد الاقتباس لأنها تتناول «وديعًا» وصياغة الحيوانين معًا.
