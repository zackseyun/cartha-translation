base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: ar
  text: '«ولكن ما رأيكم؟ كان لرجل ولدان[a]. فتقدَّم إلى الأول وقال: يا ولدي، اذهب واعمل اليوم في الكرم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابنان». اللفظ اليوناني هنا τέκνα، أي «أولاد»، ولا يحدد أنهما ابنان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: ولكن ما رأيكم؟
  rationale: صياغة عربية طبيعية تستدعي حكم المخاطَبين، وتحفظ القوة الاستدراكية الخفيفة للأداة δὲ.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: يشير الاسم في سياق المثل إلى رجل ربّ أسرة، وهذه الصياغة واضحة وطبيعية.
- source_word: τέκνα δύο
  choice: طفلان
  rationale: يحفظ اللفظ العام τέκνα، أي «طفلين»، ولا يضيّقه إلى «ابنين» مع أن هذا هو التعبير التقليدي الشائع.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: فتقدَّم إلى الأول
  rationale: تنقل اسم الفاعل بصيغة فعل سردي متتابع، وتحفظ الإشارة الترتيبية إلى الطفل الأول.
- source_word: Τέκνον
  choice: يا ولدي
  rationale: نداء أبوي عربي طبيعي يقابل لفظ τέκνον العام في هذا السياق، من غير استعمال صيغة «يا بُنيّ» التي تصرّح بالبنوة الذكورية بدرجة أكبر.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: اذهب واعمل اليوم
  rationale: ينقل الأمرين بوضوح ويحافظ على الظرف الزمني «اليوم» مرتبطًا بالعمل المطلوب.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: في الكرم
  rationale: «الكرم» هو المقابل العربي المألوف لـἀμπελών ويحفظ الصورة الزراعية في المثل.
theological_decisions:
- issue: هل تُترجم τέκνα/τέκνον بلفظ يحدد الذكورة اتباعًا للتقليد الشائع؟
  choice: طفلان / يا ولدي
  alternative: ابنان / يا بُنيّ
  rationale: يستعمل الأصل اليوناني τέκνα وτέκνον، وهما أعم من «ابنين/ابن». لذلك حافظ المتن على العموم في «طفلان»، واختار في النداء عبارة عربية أبوية طبيعية دون أن يجعل «ابنان» نص الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ما رأيكم؟» بدل تركيب حرفي ثقيل، و«الكرم» بوصفه التعبير الكتابي العربي الطبيعي عن حقل العنب.
