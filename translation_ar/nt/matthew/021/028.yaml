  rationale: استُبدلت «طفلان» بـ«ولدان» لأن المقابل الجديد لا يضيف دلالة الطفولة العمرية، مع إبقاء اتساع اللفظ اليوناني وعدم تحويله في المتن إلى «ابنين». كما صُححت الحاشية لتشرح البديل والمعنى المعجمي بدقة. ولم يلزم تغيير بقية النص.
