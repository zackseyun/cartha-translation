  terminology: «الكرم» مقابل عربي راسخ لـἀμπελών. ويُستحسن استعمال «ولدان» بدل «طفلان» للمحافظة على عمومية τέκνα دون إدخال دلالة السن. أما النداء المفرد «يا ولدي» فهو طبيعي، وإن كان العربية لا تتيح في هذا الموضع نداءً مفردًا محايدًا تمامًا من جهة الجنس بالقدر نفسه من السلاسة.
