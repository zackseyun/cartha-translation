  source_fidelity: يُحافظ النص على ترتيب الجملة ومعناها الأساسيين، وعلى الاستفهام الاستهلالي والأمر بالذهاب والعمل في الكرم. لكن «طفلان» يضيف دلالة عمرية غير موجودة في τέκνα، وتصبح غير ملائمة في سياق تكليفهما بالعمل. كما أن الحاشية تساوي اللفظ اليوناني بـ«طفلان» على نحو غير دقيق؛ فهو يدل على الأولاد/الذرية ولا يحدد السن ولا الذكورة.
