base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: ar
  text: 'لكنه أرسل إليهم بعد ذلك ابنه، قائلًا: «سيحترمون[a] ابني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيوقّرون ابني». يمكن أن يدل الفعل اليوناني على إظهار الاحترام أو التوقير، وقد يعني في سياقات أخرى «يخجلون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: بعد ذلك
  rationale: تؤدي المعنى الزمني «لاحقًا/بعدئذ» بعبارة عربية طبيعية، من غير إضافة دلالة «أخيرًا» الأقوى من اللفظ اليوناني.
- source_word: δὲ
  choice: لكنه
  rationale: تفيد انتقالًا مع مقابلة خفيفة بين إرسال العبيد سابقًا وإرسال الابن الآن.
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: المعنى المباشر للفعل، بلا إيحاء اصطلاحي زائد.
- source_word: πρὸς αὐτοὺς
  choice: إليهم
  rationale: حرف الجر مع فعل الإرسال يدل هنا على الاتجاه إلى أشخاص.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ابنه
  rationale: صياغة عربية طبيعية تحفظ العلاقة من غير إضافة وصف مثل «الحبيب» غير موجود في النص.
- source_word: λέγων
  choice: قائلًا
  rationale: ينقل اسم الفاعل الذي يمهد لمضمون القول بصياغة عربية فصيحة ومألوفة.
- source_word: Ἐντραπήσονται
  choice: سيحترمون
  rationale: مع المفعول المباشر يدل الفعل في هذا السياق على إظهار الاحترام أو المهابة؛ و«سيحترمون» واضحة وحديثة.
- source_word: τὸν υἱόν μου
  choice: ابني
  rationale: يحفظ التعبير الشخصي العلاقي المباشر في كلام صاحب الكرم.
theological_decisions:
- issue: عرض الابن في المثل من غير فرض التفسير المسيحاني داخل الصياغة
  choice: ابنه / ابني
  alternative: ابنه الحبيب / الابن بصيغة لقبية
  rationale: لفظ υἱός هنا عادي، ولا يرد معه ἀγαπητός «الحبيب». لذلك تُحفظ صيغة المثل كما هي، ويُترك مدلولها المسيحاني للسياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «بعد ذلك» بدل «أخيرًا» لتجنب تقوية التتابع الزمني، و«سيحترمون» بوصفها العبارة الأوضح للقارئ المعاصر، مع توثيق البديل الدلالي في الحاشية.
