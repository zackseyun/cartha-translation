base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: ar
  text: أرسل أيضًا عبيدًا آخرين، أكثر من الأولين، ففعلوا بهم مثل ذلك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: أيضًا
  rationale: يفيد تكرار الإرسال، وموضعه بعد الفعل طبيعي في السرد العربي.
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: مقابل عربي مباشر وطبيعي للفعل في هذا السياق السردي.
- source_word: ἄλλους δούλους
  choice: عبيدًا آخرين
  rationale: «عبيد» ينقل الدلالة الاجتماعية الأساسية لـ δοῦλος بوضوح، كما يلائم سياق صاحب الكرم ومن يعملون تحت سلطانه.
- source_word: πλείονας τῶν πρώτων
  choice: أكثر من الأولين
  rationale: يحفظ صيغة المقارنة ويدل على أن عدد الجماعة اللاحقة كان أكبر من عدد الجماعة الأولى.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: ففعلوا بهم مثلما فعلوا بالأولين
  rationale: يحفظ الفعل العام والإحالة إلى سوء المعاملة الوارد في الآية السابقة، مع إظهار مرجع التشبيه بصورة طبيعية في العربية.
theological_decisions:
- issue: ترجمة δοῦλος في المثل
  choice: عبيد
  alternative: خدم
  rationale: اللفظ اليوناني يدل أساسًا على أشخاص خاضعين لسلطة سيد، و«عبيد» يحفظ هذه الدلالة دون أن يضيف تفسيرًا لرمزية المثل. أما «خدم» فأخف دلالة على وضعهم، وإن كان ممكنًا بحسب السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ثم» لربط الحدث بما قبله، وذُكر «بالأولين» في آخر الجملة لتوضيح مرجع المماثلة من غير تغيير المعنى.
