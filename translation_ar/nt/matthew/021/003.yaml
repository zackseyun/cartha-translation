  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: ar
  text: 'وإن قال لكم أحدٌ شيئًا، فقولوا: «الربّ[a] محتاجٌ إليهما»، فيرسلهما فورًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «السيد».'
    reason: lexical_alternative
  - marker: b
    text: الفاعل غير مذكور صراحةً في الأصل اليوناني. قد يُفهم أنه «الرب» المذكور في القول، أو الشخص الذي يعترض بحسب السياق؛ ويبقي المتن هذا غير محسوم.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐάν τις
  choice: إن قال لكم أحدٌ
  rationale: تنقل أداة الشرط مع الضمير النكرة المفتوح، بصياغة عربية طبيعية تفيد احتمال اعتراض أيّ شخص.
- source_word: εἴπῃ τι
  choice: قال ... شيئًا
  rationale: تحافظ على عموم القول ولا تضيّقه إلى سؤال أو استفسار.
- source_word: ἐρεῖτε
  choice: فقولوا
  rationale: المستقبل اليوناني هنا ذو قوة توجيهية؛ وصيغة الأمر العربية أوضح وأطبع في هذا السياق.
- source_word: Ὁ κύριος
  choice: الربّ
  rationale: تحفظ اللقب وقوته في السياق، مع الإشارة في الحاشية إلى إمكان المعنى العام «السيد».
- source_word: αὐτῶν / αὐτούς
  choice: إليهما / يرسلهما
  rationale: يعود الضميران على حيوانين مذكورين في السياق السابق؛ والمثنى العربي أدق من الجمع الشكلي في اليونانية عند نقل المرجع المقصود.
- source_word: χρείαν ἔχει
  choice: محتاجٌ إلى
  rationale: تعبير عربي واضح وطبيعي ينقل معنى الاحتياج من غير زيادة تفسيرية.
- source_word: εὐθὺς
  choice: فورًا
  rationale: ينقل دلالة المبادرة وعدم التأخير بإيجاز معاصر.
- source_word: ἀποστελεῖ
  choice: فيرسل
  rationale: يحفظ معنى الإرسال ولا يضيف معنى الإرجاع أو الإطلاق غير الصريح في الأصل.
theological_decisions:
- issue: دلالة Ὁ κύριος
  choice: الربّ
  alternative: السيد
  rationale: «الربّ» يحفظ إمكان كون اللفظ لقبًا ذا وزن مسياني، ولا يحصره في معنى مالك الحيوانين أو سيدهما؛ وتُذكر الدلالة العامة الممكنة في الحاشية بدل حسم التوتر السياقي.
- issue: فاعل ἀποστελεῖ المضمر
  choice: إبقاء الفاعل مضمرًا في «فيرسلهما»
  alternative: «فيرسلهما ذلك الشخص» أو فهم الفاعل على أنه «الربّ»
  rationale: الفعل اليوناني لا يصرّح بالفاعل. والأقرب سياقيًا أن يكون من خاطب التلميذين، لكن إبقاءه مضمرًا في العربية يحافظ على هذا القدر من الغموض من غير فرض تفسير داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعمل المثنى لأن الضمائر تشير إلى الأتان والجحش المذكورين في السياق، وأُبقي فاعل الفعل الأخير مضمرًا كما في اليونانية.
