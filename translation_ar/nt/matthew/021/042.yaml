source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: ar
  text: 'قال لهم يسوع: «أما قرأتم قط في الكتب المقدسة: ‹الحجر الذي رفضه البنّاؤون، هو نفسه صار حجر الزاوية[a]. من عند الرب حدث هذا، وهو عجيب في أعيننا›؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حجر القمّة»؛ وحرفيًا: «رأس الزاوية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: قال
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي، وهو الأسلوب الطبيعي في السرد العربي.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: أما قرأتم قط
  rationale: صياغة استفهامية عربية طبيعية تحفظ قوة النفي والاستنكار في السؤال اليوناني.
- source_word: γραφαῖς
  choice: الكتب
  rationale: يشير الجمع هنا إلى الأسفار المقدسة عند إسرائيل، و«الكتب» تعبير عربي واضح ومألوف في هذا السياق.
- source_word: ἀπεδοκίμασαν
  choice: رفضه
  rationale: ينقل معنى الحكم على الحجر بأنه غير صالح ثم استبعاده، من غير إطالة تفسيرية.
- source_word: οἱ οἰκοδομοῦντες
  choice: البنّاؤون
  rationale: اسم فاعل جمع طبيعي يحفظ صورة البناء الواردة في النص.
- source_word: οὗτος
  choice: هو نفسه
  rationale: يحفظ توكيد اسم الإشارة اليوناني ويبرز أن الحجر المرفوض بعينه نال المنزلة الجديدة.
- source_word: ἐγενήθη εἰς κεφαλὴν γωνίας
  choice: صار حجر الزاوية
  rationale: ينقل التحول إلى منزلة جديدة، ويؤدي التعبير الاصطلاحي بعبارة عربية مفهومة مع حفظ البدائل في الحاشية.
- source_word: παρὰ κυρίου ἐγένετο αὕτη
  choice: من عند الرب حدث هذا
  rationale: يحفظ دلالة المصدر في παρά مع المضاف إليه، ويجعل «هذا» إشارة طبيعية إلى الحدث السابق.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: عجيب في أعيننا
  rationale: صياغة رفيعة وواضحة تحافظ على صورة النظر في الاقتباس.
theological_decisions:
- issue: ترجمة κύριος في الاقتباس من المزمور
  choice: الرب
  alternative: يهوه
  rationale: المتن اليوناني يقرأ κυρίου، لذلك تُترجم «الرب»، مع بيان أن الأصل العبري للاقتباس يتضمن الاسم الإلهي في الحاشية.
- issue: التطبيق المسياني لصورة الحجر
  choice: إبقاء صورة الحجر بلا شرح تفسيري
  alternative: التصريح في المتن بأن الحجر هو المسيح
  rationale: السياق يطبق القول على يسوع، لكن نص الآية يورد الاقتباس من غير أن يضيف هذا التفسير صراحة، لذا لا يُدرج الشرح العقائدي في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ الإيقاع الاقتباسي وصورة البناء، مع تجنب التفسير العقائدي داخل المتن.
