lexical_decisions:
- source_word: Πρωῒ
  choice: في الصباح الباكر
  rationale: ينقل دلالة الظرف على الجزء المبكر من النهار بعبارة عربية واضحة وطبيعية.
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط سردية خفيفة هنا، فتنقلها الواو من غير إضفاء معنى تعارض قوي.
- source_word: ἐπανάγων
  choice: وهو عائد
  rationale: اسم فاعل مضارع يدل على فعل متزامن مع الفعل الرئيس؛ وهذه الصياغة تحفظ الاستمرار والتزامن بسلاسة.
- source_word: εἰς τὴν πόλιν
  choice: إلى المدينة
  rationale: تنقل اتجاه الحركة نحو المدينة من غير أن تفترض أن الوصول قد تم بالفعل.
- source_word: ἐπείνασεν
  choice: جاع
  rationale: فعل عربي موجز وطبيعي يعبّر عن حدوث الجوع، ويحفظ القوة الحدثية لصيغة الماضي اليونانية.
theological_decisions:
- issue: الدلالة المسيحانية لجوع يسوع
  choice: إثبات خبرة الجوع الحقيقية بصياغة مباشرة
  alternative: تلطيف العبارة أو شرحها عقائديًا داخل النص
  rationale: يعرض النص الجوع بوصفه خبرة بشرية حقيقية ليسوع؛ والترجمة المباشرة تحفظ شهادة السرد من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع تركيب سردي طبيعي. استُخدمت الواو لنقل الربط الخفيف الذي تؤديه δὲ، من غير إضافة أداة انتقال أثقل من الأصل.
