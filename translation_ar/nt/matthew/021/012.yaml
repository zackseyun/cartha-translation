  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: ar
  text: ودخل يسوع ساحات الهيكل، وطرد جميع الذين كانوا يبيعون ويشترون في ساحات الهيكل[a]، وقلب موائد الصيارفة ومقاعد بائعي الحمام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الهيكل» أو «نطاق الهيكل»؛ تشير الكلمة اليونانية إلى مجمّع الهيكل الأوسع، لا إلى المَقدِس الداخلي تحديدًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: ساحات الهيكل
  rationale: تشير الكلمة هنا إلى مجمّع الهيكل الأوسع، لا إلى المَقدِس الداخلي تحديدًا؛ وعبارة «ساحات الهيكل» توضّح الموضع الذي جرت فيه التجارة.
- source_word: ἐξέβαλεν
  choice: طرد
  rationale: ينقل الفعل معنى الإخراج الحازم والقسري بعبارة عربية طبيعية واضحة.
- source_word: πάντας
  choice: جميع
  rationale: تُبقي الترجمة نطاق اللفظة اليونانية صريحًا، فهي تشمل كل من كان يمارس البيع والشراء هناك.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: الذين كانوا يبيعون ويشترون
  rationale: تنقل العبارة وصف الأشخاص المنخرطين في هذين الفعلين بلغة عربية سلسة.
- source_word: τράπεζας
  choice: موائد
  rationale: هو المعنى المباشر للكلمة في السياق، ويشير إلى الموائد المستخدمة في الصرافة.
- source_word: κολλυβιστῶν
  choice: الصيارفة
  rationale: لفظ عربي مألوف لمن يبدّلون العملات والنقود، ويلائم سياق الهيكل.
- source_word: κατέστρεψεν
  choice: قلب
  rationale: يعبّر عن قلب الموائد وإطاحتها دون أن يوحي بالضرورة بتحطيمها.
- source_word: καθέδρας
  choice: مقاعد
  rationale: تنقل المعنى العام للكلمة بوضوح وتحافظ على النبرة السردية.
- source_word: περιστεράς
  choice: الحمام
  rationale: اللفظة اليونانية قد تدل على الحمام أو اليمام، و«الحمام» تعبير عربي طبيعي ملائم لسياق الذبائح.
theological_decisions:
- issue: نطاق ἱερόν وصلته بموضع عمل يسوع
  choice: دخل يسوع ساحات مجمّع الهيكل، لا المَقدِس الداخلي تحديدًا.
  alternative: 'ترجمة عامة: «دخل الهيكل» من غير تعيين للساحات.'
  rationale: يميّز السياق واللفظ اليوناني بين مجمّع الهيكل الأوسع وبين المَقدِس الداخلي؛ لذا تمنع «ساحات الهيكل» إيحاءً مكانيًا غير مقصود، من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الصيارفة» للإيجاز والطبيعية، وحوفظ على تكرار «ساحات الهيكل» لتوضيح المرجع المكاني كما في الأصل.
