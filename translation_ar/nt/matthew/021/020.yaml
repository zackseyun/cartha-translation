source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: ar
  text: 'ولما رأى التلاميذ ذلك[a]، تعجبوا قائلين: «كيف يبست شجرة التين في الحال؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا يرد «ذلك» صراحة في اليونانية، لكنه مفهوم من السياق.
    reason: بيان المفعول المقدر الذي أضيف لسلامة التعبير العربي.
lexical_decisions:
- source_word: ἰδόντες
  choice: ولما رأى ... ذلك
  rationale: صيغ اسم الفاعل الأوريستي في تركيب زمني عربي طبيعي. وأضيف اسم الإشارة «ذلك» لأن الفعل في اليونانية بلا مفعول مصرح به، والسياق يشير إلى ما حدث لشجرة التين.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: المقابل العربي المألوف والدقيق لتلاميذ يسوع في هذا السياق.
- source_word: ἐθαύμασαν
  choice: تعجبوا
  rationale: ينقل معنى الدهشة والتعجب بلغة عربية واضحة ورصينة.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على البنية الحالية المصاحبة للفعل الرئيس وعلى انسياب العبارة اليونانية.
- source_word: Πῶς
  choice: كيف
  rationale: أداة الاستفهام العربية الطبيعية للسؤال عن كيفية وقوع الأمر.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: ينقل الدلالة الزمنية المباشرة، أي «فورًا» أو «للحال»، بسجل عربي فصيح مفهوم.
- source_word: ἐξηράνθη
  choice: يبست
  rationale: الفعل العربي الطبيعي لوصف صيرورة الشجرة يابسة أو ذابلة؛ ويؤدي هنا معنى المبني للمجهول اليوناني دون افتعال صياغة عربية ثقيلة.
- source_word: ἡ συκῆ
  choice: شجرة التين
  rationale: المقابل المحدد والواضح للاسم اليوناني الذي يدل على شجرة التين.
theological_decisions: []
