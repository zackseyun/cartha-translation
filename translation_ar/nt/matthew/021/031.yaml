  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: ar
  text: '«أيُّهما عمل مشيئة أبيه؟» قالوا: «الأول». فقال لهم يسوع: «الحق أقول لكم: إن جباة الضرائب والبغايا يسبقونكم إلى ملكوت الله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يدخلون ملكوت الله قبلكم». تفيد اليونانية حرفيًا أنهم «يسبقونكم»، مؤكدةً الأسبقية من غير أن تصرّح بالضرورة باستبعادكم نهائيًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: أيُّ الاثنين
  rationale: صياغة عربية طبيعية تحفظ معنى الاختيار من بين اثنين.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: عمل مشيئة أبيه
  rationale: تعبير عربي واضح يحفظ معنى فعل مشيئة الأب في سياق المثل؛ ويُظهر الضمير المرجع السياقي الطبيعي من غير أن يحوّل الأب هنا مباشرةً إلى لقب إلهي.
- source_word: Ὁ πρῶτος
  choice: الأول
  rationale: جواب موجز يطابق الإضمار في اليونانية.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية كتابية مفهومة ومهيبة تنقل قوة الإعلان التوكيدي.
- source_word: τελῶναι
  choice: جباة الضرائب
  rationale: مقابل عربي حديث وواضح لوكلاء جباية الضرائب.
- source_word: πόρναι
  choice: البغايا
  rationale: لفظ محدد وفصيح معاصر نسبيًا، أدق من تعبير عام مثل «الفاسقات».
- source_word: προάγουσιν ὑμᾶς
  choice: يتقدّمونكم
  rationale: يحفظ صورة السبق في الفعل اليوناني وزمنه الحاضر، من غير أن يصرّح باستبعاد المخاطَبين نهائيًا.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: إلى ملكوت الله
  rationale: ترجمة مألوفة تحفظ دلالة الاتجاه في εἰς والعبارة اللاهوتية كاملة.
theological_decisions:
- issue: دلالة προάγουσιν ὑμᾶς في صلتها بدخول الملكوت
  choice: يتقدّمونكم إلى ملكوت الله
  alternative: يدخلون ملكوت الله قبلكم
  rationale: المختار يحفظ استعارة التقدّم والأسبقية، ولا يحسم ما إذا كان المخاطَبون سيُستبعدون نهائيًا؛ وبذلك يبقي التحذير والتوتر اللاهوتي القائمين في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت «ملكوت الله» للمحافظة على الاصطلاح الإنجيلي المألوف، مع تجنب الألفاظ القديمة حيث يتوفر مقابل حديث دقيق.
