base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: ar
  text: 'ويقول لهم: «مكتوب: بيتي سيُدعى بيتَ صلاةٍ، أما أنتم فتجعلونه مغارةَ لصوص[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يجمع يسوع هنا بين إشعياء 56:7 وإرميا 7:11. ويمكن أيضًا ترجمة «لصوص» بـ«قطاع طرق»، لأن اللفظة اليونانية قد تشير إلى لصوص عنيفين.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ويقول
  rationale: حُفظ المضارع التاريخي اليوناني لإبقاء حيوية السرد في متى، وهو استعمال عربي فصيح طبيعي في السياق القصصي.
- source_word: Γέγραπται
  choice: مكتوب
  rationale: صيغة عربية موجزة ومألوفة لإدخال الاقتباس الكتابي، وتحفظ دلالة ثبوت النص واستمرار سلطانه.
- source_word: Ὁ οἶκός μου
  choice: بيتي
  rationale: حُفظت صورة «البيت» الواردة في الاقتباس بدل تفسيرها بكلمة «الهيكل» الأضيق دلالة.
- source_word: οἶκος προσευχῆς
  choice: بيتَ صلاةٍ
  rationale: ترجمة مباشرة وطبيعية لتركيب الإضافة، وتحافظ على الصياغة النبوية.
- source_word: κληθήσεται
  choice: يُدعى
  rationale: ينقل المستقبل المبني للمجهول في صيغة عربية فصيحة؛ ودلالة الاستقبال مفهومة من بنية الاقتباس النبوي، مع إمكان الترجمة الأصرح «سيُدعى».
- source_word: ποιεῖτε
  choice: فتجعلونه
  rationale: ينقل فعل الجعل في المضارع ويبين استمرار فعل المخاطَبين دون إضافة معنى تفسيري زائد.
- source_word: σπήλαιον
  choice: مغارة
  rationale: المعنى الأصلي كهف أو مأوى خفي، و«مغارة» تحافظ على صورة إرميا مع ملاءمتها لمأوى اللصوص.
- source_word: λῃστῶν
  choice: لصوص
  rationale: المقابل العربي الطبيعي في السياق، مع التنبيه إلى أن اللفظة اليونانية قد تدل أيضًا على قطّاع الطرق العنيفين.
theological_decisions:
- issue: الاقتباس والإحالة إلى العهد القديم
  choice: صياغة تحفظ وضوح عبارة إشعياء 56:7 وصدى إرميا 7:11
  alternative: صياغة تفسيرية حرة قد تحجب الصلة بين النصين
  rationale: قول يسوع يجمع بين عبارة «بيتي بيت صلاة يُدعى» وصورة «مغارة اللصوص»، لذلك ينبغي إبقاء الرابطين ظاهرين من غير توسيع تفسيري.
- issue: دلالة λῃστῶν
  choice: لصوص
  alternative: قطّاع طرق
  rationale: لا يُحسم السياق بين السرقة عمومًا واللصوصية العنيفة؛ فاختير اللفظ الأوسع في المتن، وحُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المضارع التاريخي «ويقول»، وصورة «البيت» و«المغارة»، مع تجنب تفسير «البيت» مباشرة بأنه الهيكل. وُضع مؤشر الحاشية بعد «لصوص» مع أن الحاشية تجمع الإحالة الكتابية والبديل المعجمي.
