  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: ar
  text: ولمّا اقترب موسم الثمار، أرسل عبيده[a] إلى المزارعين المستأجرين[b] ليتسلّموا ثماره.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «خدمه». اللفظ اليوناني δοῦλος يعني في الأصل «عبدًا»، وقد يُستعمل عن خادم تابع لسيده؛ وهنا يبرز السياق أيضًا مهمة هؤلاء بوصفهم موفدي صاحب الكرم.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «المزارعين» أو «الفلّاحين». يدل اللفظ اليوناني γεωργός على من يزرع الأرض، ويبيّن سياق المثل أنهم مستأجرون يعملون كرمًا يملكه غيرهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ولمّا
  rationale: تؤدي معنى الظرف الزمني مع الانتقال السردي الذي تفيده δέ، بصياغة عربية طبيعية موجزة.
- source_word: ἤγγισεν
  choice: اقترب
  rationale: المعنى المباشر للفعل هو الدنو أو الاقتراب، وهو ملائم لاقتراب الموسم.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: موسم الثمار
  rationale: καιρός هنا وقت مناسب أو محدد في سياق زراعي، ولذلك تنقل «موسم» المعنى بوضوح، مع إبقاء جمع καρπῶν.
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: المقابل العربي الطبيعي والمباشر للفعل في السياق السردي.
- source_word: τοὺς δούλους αὐτοῦ
  choice: عبيده
  rationale: δοῦλος يدل في الأصل على العبد، واختيار «عبيده» يحافظ على دلالة اللفظ وعلى علاقة التبعية لصاحب الكرم، مع ذكر البديل السياقي في الحاشية.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: إلى المزارعين المستأجرين
  rationale: γεωργοί هم القائمون بالزراعة، ويبيّن سياق المثل أنهم يعملون كرم رجل آخر؛ لذا توضح «المستأجرين» دورهم من غير تحويل اللفظ إلى تفسير لاهوتي.
- source_word: λαβεῖν
  choice: ليتسلّم
  rationale: λαμβάνω واسع الدلالة، وهنا المقصود أن يتلقى المالك على أيدي عبيده ما يخصه من المحصول؛ «يتسلّم» طبيعية وتحافظ على هذا المعنى.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: ثماره
  rationale: تحافظ على جمع καρπούς وعلى ضمير الملكية αὐτοῦ، من غير إضافة تفسير مثل «نصيبه» أو «ما استحقه».
theological_decisions:
- issue: الدلالة الرمزية للثمار والعبيد والمزارعين
  choice: إبقاء ألفاظ المثل في معناها السردي من غير تعيين مدلولاتها الرمزية داخل الآية
  alternative: إضافة ألفاظ تفسيرية تحدد ما ترمز إليه الشخصيات أو الثمار
  rationale: النص نفسه يسرد عناصر المثل ولا يصرّح في هذه الآية وحدها بكل مقابلاتها الرمزية؛ لذلك لا ينبغي حسمها بإضافات ترجميّة.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. استُخدمت «ولمّا» للانتقال الزمني السلس، وحوفظ على جمع «الثمار» وضمير الملكية. وُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تتعلقان بهما.
