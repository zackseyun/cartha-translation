  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: ar
  text: 'وَإِنْ قُلْنَا: «مِنَ النَّاسِ[a]»، فَإِنَّنَا نَخَافُ الْجَمْعَ، لِأَنَّ الْجَمِيعَ يَعُدُّونَ يُوحَنَّا نَبِيًّا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: مِنْ مَصْدَرٍ بَشَرِيٍّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: وَإِنْ قُلْنَا
  rationale: ينقل صيغة الشرط الاحتمالي في اليونانية بعبارة عربية طبيعية موجزة، مع إبقاء المقابلة مع الاحتمال السابق في السياق.
- source_word: Ἐξ ἀνθρώπων
  choice: مِنَ النَّاسِ
  rationale: يحافظ على المقابلة الموجزة بين المصدر السماوي والمصدر البشري. والمقصود بالناس هنا البشر عمومًا، لا الذكور دون الإناث.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: فَإِنَّنَا نَخَافُ الْجَمْعَ
  rationale: ترجمة مباشرة تحفظ فورية خوفهم من جمهور الناس المحتشد.
- source_word: πάντες
  choice: الْجَمِيعَ
  rationale: ينقل شمول الحكم الشعبي بصياغة عربية واضحة، من غير تقييده نحويًا بمرجع قد لا يصرح به النص اليوناني.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: يَعُدُّونَ يُوحَنَّا نَبِيًّا
  rationale: يؤدي التعبير الاصطلاحي الدال على اعتبار شخص في منزلة أو صفة معينة، وهو أفصح وأوضح من النقل الحرفي للفعل اليوناني.
- source_word: Ἰωάννην
  choice: يُوحَنَّا
  rationale: الصيغة العربية الكتابية المعيارية للاسم الشخصي.
theological_decisions:
- issue: المقابلة بين المصدر السماوي والمصدر البشري في Ἐξ ἀνθρώπων
  choice: مِنَ النَّاسِ
  alternative: مِنْ مَصْدَرٍ بَشَرِيٍّ
  rationale: يحفظ الاختيار العبارة التصويرية الموجزة والمقابلة الأصلية، بينما توضح الحاشية أن المراد منشأ بشري لا نسبة إلى الرجال خاصة.
- issue: قوة نظرة الجمهور إلى يوحنا
  choice: الْجَمِيعَ يَعُدُّونَ يُوحَنَّا نَبِيًّا
  alternative: الْجَمِيعَ يَعْتَبِرُونَ يُوحَنَّا نَبِيًّا
  rationale: ينقل تقرير السرد عن اعتقاد الناس من دون أن يضيف حكمًا لاهوتيًا أو يوسع دلالة النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الجمع» للدلالة على جمهور الناس المحتشد، و«يعدّون» للتعبير الطبيعي عن اعتبار يوحنا نبيًا. وُضعت علامة الحاشية في المتن عقب العبارة التي تشرحها.
