lexical_decisions:
- source_word: προσῆλθον
  choice: جاء إليه
  rationale: يفيد الفعل التقدّم نحو شخص أو المجيء إليه، وهذه صياغة عربية طبيعية تحافظ على اتجاه الحركة الذي يوضحه الضمير في صيغة المجرور.
- source_word: τυφλοὶ
  choice: عميان
  rationale: الصفة مستعملة استعمال الاسم في صيغة الجمع، و«عميان» تؤدي المعنى بإيجاز ووضوح.
- source_word: χωλοὶ
  choice: عرج
  rationale: الصفة مستعملة استعمال الاسم وتشير إلى من لديهم عرج أو عجز في المشي؛ و«عرج» تقابل «عميان» في تركيب عربي موجز.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: ἱερόν يدل هنا على مجمّع الهيكل أو ساحاته، لا على المقدس الداخلي وحده. أبقينا التعبير العربي المألوف مع حاشية توضح المجال المكاني.
- source_word: ἐθεράπευσεν
  choice: فشفاهم
  rationale: الفعل يعني الشفاء في سياق معجزات الأناجيل. استُعملت الفاء لربط النتيجة بما سبق ربطًا عربيًا طبيعيًا من غير تغيير التسلسل.
theological_decisions:
- issue: المكان المقصود بلفظة ἱερόν
  choice: مجمّع الهيكل أو ساحاته
  alternative: المقدس الداخلي
  rationale: اللفظة اليونانية ἱερόν أوسع من ναός، فلا ينبغي أن توحي الترجمة بأن الشفاء وقع بالضرورة داخل المقدس الداخلي.
translation_notes:
