  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: ar
  text: 'قائلًا لهما: «اذهبا إلى القرية المقابلة لكما، فتجدان حالًا أتانًا مربوطة وجحشًا معها[a]. فحلّاهما وأحضراهما إليّ».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الجحش» هنا صغير الحمار، كما يتضح من السياق.
    reason: lexical_alternative
  - marker: b
    text: 'في اليونانية يسبق فعلَ الأمر «أحضرا» اسمُ فاعل بمعنى «بعد أن تحلّا» أو «حالّين»؛ وتُصاغ العبارة في العربية على هيئة أمرين متتابعين: «فحلّاهما وأحضراهما إليّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: قائلًا لهما
  rationale: يحافظ على صيغة اسم الفاعل التي تُدخل كلام يسوع، والمثنى مفهوم من سياق إرسال التلميذين.
- source_word: Πορεύεσθε
  choice: اذهبا
  rationale: أمر مباشر طبيعي في العربية، وصيغة المثنى تلائم المخاطَبَين في السياق.
- source_word: κώμην
  choice: القرية
  rationale: المقابل العربي الواضح والمعتاد لمستوطنة أصغر من المدينة.
- source_word: κατέναντι ὑμῶν
  choice: التي قبالتكما
  rationale: ينقل الدلالة المكانية، أي القرية المقابلة لهما، بعبارة عربية واضحة.
- source_word: εὐθέως
  choice: حالًا
  rationale: ينقل معنى الفورية بإيجاز وبأسلوب عربي طبيعي.
- source_word: ὄνον δεδεμένην
  choice: أتانًا مربوطة
  rationale: التأنيث النحوي في اليونانية والسياق الذي يقول «معها» يدلان على أن الحيوان أنثى؛ و«أتان» هو اللفظ العربي الدقيق لأنثى الحمار.
- source_word: πῶλον
  choice: جحشًا
  rationale: في هذا السياق هو صغير الحمار؛ و«جحش» واضح ودقيق في العربية.
- source_word: μετ’ αὐτῆς
  choice: معها
  rationale: يحفظ ضمير المؤنث المفرد العائد إلى الأتان.
- source_word: λύσαντες
  choice: فحُلّاهما
  rationale: حُوِّل اسم الفاعل الظرفي إلى أمر منسق طبيعي في العربية، مع إظهار المفعول المثنى الذي يقتضيه ذكر الحيوانين.
- source_word: ἀγάγετέ μοι
  choice: وأتياني بهما
  rationale: ينقل معنى إحضار الحيوانين إلى المتكلم، مع الحفاظ على المخاطب والمفعول بصيغة المثنى.
