translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعمل المثنى صراحة لأن العربية تتيحه ولأن السياق يحدد تلميذين وحيوانين. حُذفت حاشية الموقع الواردة في طبقة الاستشارة الإنجليزية لأنها لا تعرض بديلًا عربيًا ذا فرق مفيد عن «قبالتكما».
