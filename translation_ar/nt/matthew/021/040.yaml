  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: ar
  text: فمتى جاء صاحب الكرم، ماذا سيفعل بأولئك الكرّامين[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أولئك المزارعين». ويُفهم من سياق المثل أنهم مزارعون مستأجرون، مع أن الكلمة اليونانية تعني عمومًا الزراع أو الفلاحين.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: متى
  rationale: تدخل على حدث منتظر في سياق المثل؛ و«متى جاء» صياغة عربية طبيعية تحمل معنى «حين يأتي» من غير إيحاء بالتكرار.
- source_word: οὖν
  choice: الفاء في «فمتى»
  rationale: تفيد التفريع على أحداث المثل السابقة، وتحافظ على قوة الانتقال الاستنتاجي بصورة عربية موجزة وطبيعية.
- source_word: ἔλθῃ
  choice: جاء
  rationale: الفعل اليوناني في صيغة الماضي البسيط التابعة بعد ὅταν يشير إلى مجيء منتظر؛ والماضي بعد «متى» أسلوب عربي فصيح يفيد الاستقبال.
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: صاحب الكرم
  rationale: السياق يحدد κύριος بصفته مالك الكرم أو سيده داخل المثل، لا بصفته لقبًا إلهيًا؛ و«صاحب الكرم» تعبير عربي واضح وطبيعي.
- source_word: ἀμπελῶνος
  choice: الكرم
  rationale: «الكرم» هو المقابل العربي المألوف والدقيق لمزرعة العنب في السياق الكتابي والزراعي.
- source_word: τί ποιήσει
  choice: ماذا سيفعل
  rationale: يحافظ على الاستفهام وعلى دلالة المستقبل الصريحة في ποιήσει.
- source_word: τοῖς γεωργοῖς ἐκείνοις
  choice: بأولئك الكرّامين
  rationale: «الكرّامون» هم العاملون في زراعة الكرم، وتحافظ «أولئك» على التحديد ومسافة الإشارة في ἐκείνοις، بينما توضّح الحاشية أن السياق يصورهم مستأجرين.
theological_decisions:
- issue: دلالة κύριος في سياق المثل
  choice: صاحب الكرم
  alternative: سيد الكرم / رب الكرم
  rationale: العبارة تدل مباشرة على صاحب الكرم داخل عالم المثل. تجنبت «الرب» كيلا يُفرض في النص لقب لاهوتي، مع بقاء الدلالة الرمزية للمثل مفتوحة ضمن سياقها.
- issue: مدى تضمين γεωργοί معنى الاستئجار
  choice: الكرّامون في المتن مع توضيح سياقي في الحاشية
  alternative: المزارعون المستأجرون
  rationale: اللفظ اليوناني يدل في ذاته على الزراع أو الفلاحين، أما كونهم مستأجرين فيُفهم من سياق المثل؛ لذلك لم يُدمج التفصيل السياقي في صلب الترجمة.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُخدمت «فمتى جاء» لتفريع السؤال على ما سبق وللتعبير الطبيعي عن الحدث المنتظر، و«الكرّامين» لملاءمة زراعة الكرم تحديدًا. كل علامة حاشية في المتن تقابل حاشية مدرجة.
