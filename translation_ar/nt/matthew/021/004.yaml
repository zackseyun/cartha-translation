lexical_decisions:
- source_word: Τοῦτο
  choice: هذا
  rationale: اسم إشارة محايد مفرد يعود إلى الحدث السابق بوصفه كلًّا.
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط خفيفة استمرارية هنا، وليست أداة تضاد قوي؛ والواو تؤدي هذا الربط طبيعيًّا بالعربية.
- source_word: γέγονεν
  choice: حدث
  rationale: ينقل الفعل التام في صيغة الإتمام النبوي بعبارة عربية واضحة وطبيعية.
- source_word: ἵνα πληρωθῇ
  choice: لكي يتم
  rationale: يحفظ دلالة الغاية أو النتيجة في ἵνα مع المبني للمجهول، من غير إثقال العبارة.
- source_word: τὸ ῥηθὲν
  choice: ما قيل
  rationale: ينقل اسم المفعول المعرّف المستعمل استعمال الاسم، ويحافظ على صيغة المبني للمجهول.
- source_word: διὰ τοῦ προφήτου
  choice: على لسان النبي
  rationale: تعبير عربي مألوف يحفظ معنى أن القول نُقل من خلال النبي بوصفه وسيطًا.
- source_word: λέγοντος
  choice: القائل
  rationale: اسم فاعل يطابق النبي ويمهّد مباشرة للاقتباس التالي كما يفعل اسم الفاعل اليوناني.
theological_decisions:
- issue: صيغة الإتمام ووساطة النبي
  choice: ما قيل على لسان النبي
  alternative: ما قاله النبي؛ ما قيل بواسطة النبي
  rationale: يحافظ هذا التعبير على كون الكلام السابق قد جاء من خلال النبي، بدل اختزاله إلى مجرد قول صادر من النبي نفسه، من غير إضافة فاعل غير مذكور صراحة في النص.
