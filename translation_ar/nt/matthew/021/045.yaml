  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: ar
  text: ولما سمع رؤساء الكهنة والفريسيون أمثاله، عرفوا أنه يتكلم عنهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بشأنهم». والمعنى أنهم أدركوا أن الأمثال كانت موجهة إليهم. وتترجم بعض الترجمات العبارة بصورة تفسيرية: «ضدهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ولما سمع
  rationale: اسم فاعل ماضٍ يسبق الفعل الرئيس، فصيغ في العربية جملة زمنية طبيعية تحفظ ترتيب الحدثين.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف الدال على كبار القيادات الكهنوتية، لا على تعدد من يشغلون منصب رئيس الكهنة في الوقت نفسه.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: النقل العربي الاصطلاحي المعروف لاسم هذه الجماعة اليهودية.
- source_word: παραβολὰς
  choice: أمثاله
  rationale: «الأمثال» هو المصطلح العربي الراسخ لهذا النوع من أقوال يسوع وقصصه التصويرية، والضمير ينقل αὐτοῦ طبيعيًا.
- source_word: ἔγνωσαν
  choice: عرفوا
  rationale: ينقل فعل المعرفة أو الإدراك بصورة مباشرة، والسياق يوضح أنهم تعرفوا إلى المقصود من الكلام.
- source_word: περὶ αὐτῶν
  choice: عنهم
  rationale: المعنى المباشر للجار περί مع المضاف إليه هو «عن/بشأن»، دون إدخال معنى «ضدهم» الأقوى تفسيريًا.
- source_word: λέγει
  choice: يتكلم
  rationale: يحافظ المضارع العربي على حيوية المضارع اليوناني، ويأتي طبيعيًا بعد «عرفوا أنه».
theological_decisions:
- issue: هل يُصرَّح بأن أمثال يسوع كانت ضد القادة؟
  choice: يتكلم عنهم
  alternative: يتكلم ضدهم
  rationale: النص اليوناني يقول περὶ αὐτῶν، أي «عنهم/بشأنهم». وقد يدل السياق على النقد، لكن صياغة «ضدهم» تحسم دلالة أشد لا يصرح بها حرف الجر نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «ولما» لربط الجملة بسياقها السابق ونقل العلاقة الزمنية، مع إبقاء «عنهم» في المتن حفاظًا على دلالة الأصل دون تشديد تفسيري.
