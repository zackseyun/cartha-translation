base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: ar
  text: 'قالوا له: «أولئك الأشرار سيهلكهم شرَّ هلاكٍ[a]، ويؤجِّر الكرم لكرّامين آخرين[b] يؤدّون إليه ثماره في مواسمها[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستخدم اليونانية صفةً وظرفًا من أصل واحد، بمعنى يقارب: «الأشرار سيهلكهم هلاكًا سيئًا/بائسًا»، لتشديد الحكم عليهم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لمزارعين آخرين» أو «لمستأجرين آخرين».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يؤدّون إليه الغلّة في أوقاتها المعيّنة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: قالوا له
  rationale: المضارع اليوناني هنا مضارع تاريخي في سياق سردي، والماضي هو الأسلوب العربي الطبيعي.
- source_word: Κακοὺς κακῶς
  choice: أولئك الأشرار ... شرَّ هلاك
  rationale: يحافظ هذا التعبير على التوكيد والتلاعب الاشتقاقي بين الصفة والظرف في اليونانية بصياغة عربية واضحة وفصيحة.
- source_word: ἀπολέσει
  choice: سيهلكهم
  rationale: ينقل الحكم الحاسم من غير أن يحدد وسيلة الهلاك بما يتجاوز النص.
- source_word: τὸν ἀμπελῶνα
  choice: الكرم
  rationale: هو المقابل العربي المألوف لكرم العنب، ويحفظ صورة المثل الزراعية.
- source_word: ἐκδώσεται
  choice: يؤجِّر
  rationale: يدل الفعل في هذا السياق على تسليم العقار للانتفاع به مقابل حق مستحق لصاحبه.
- source_word: ἄλλοις γεωργοῖς
  choice: لكرّامين آخرين
  rationale: الكرّامون هم العاملون في الكرم أو مستأجروه، وهو أدق في هذا السياق من اللفظ الزراعي العام.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: يؤدّون إليه
  rationale: يفيد ردَّ ما هو مستحق لصاحب الكرم، ويحافظ على معنى الأداء دون حصره في دفع نقدي.
- source_word: τοὺς καρποὺς
  choice: ثماره
  rationale: يحفظ الصورة الحرفية وإيحاءها المجازي، مع إرجاع الضمير طبيعيًا إلى الكرم.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: في مواسمها
  rationale: ينقل معنى الأوقات الملائمة أو المعيّنة للثمار ضمن الصورة الزراعية.
theological_decisions:
- issue: شدة الحكم وطبيعته في جواب السامعين
  choice: سيهلكهم شرَّ هلاك
  alternative: سيقضي على أولئك الأشرار قضاءً أليمًا
  rationale: الصياغة المختارة تحفظ شدة الحكم والتوكيد الاشتقاقي في اليونانية، من غير أن تضيف تحديدًا عقائديًا لطبيعة العقوبة أو كيفيتها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «شرَّ هلاك» لمحاكاة الجناس الاشتقاقي اليوناني بعبارة عربية طبيعية نسبيًا، و«الكرّامين» للمحافظة على خصوصية مشهد الكرم.
