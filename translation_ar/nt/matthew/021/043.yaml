id: MAT.21.43
reference: Matthew 21:43
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: ar
  text: 'لذلك أقول لكم: إن ملكوت الله سيُنزع منكم ويُعطى لأمة[a] تُنتج ثماره.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لشعب». يمكن للكلمة اليونانية ἔθνει أن تدل على أمة أو جماعة بشرية؛ ويحدّد النص هذه الجماعة بأنها تُنتج ثمار الملكوت، من غير أن يعيّن هويتها على نحو أضيق.
    reason: بديل معجمي يحفظ سعة دلالة اللفظ اليوناني ويتجنب فرض تعيين لاهوتي غير مصرّح به.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تفيد الاستنتاج المبني على المثل والاقتباس السابقين، وهي صياغة عربية موجزة وطبيعية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: تحافظ على صيغة الخطاب المباشر وعلى حضور ضمير المتكلم والمخاطَبين.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: سيُنزع منكم
  rationale: ينقل صيغة المستقبل المبني للمجهول ومعنى الإزالة والانفصال عن المخاطَبين.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي راسخ يحفظ المجال الدلالي الذي يشمل مُلك الله وسلطانه ونطاق حكمه، من غير تضييقه إلى معنى واحد.
- source_word: δοθήσεται
  choice: ويُعطى
  rationale: يحافظ على المستقبل المبني للمجهول وعلى الموازاة مع «سيُنزع»؛ ويعود الضمير المستتر نحويًا إلى «ملكوت».
- source_word: ἔθνει
  choice: لأمة
  rationale: مقابل مباشر للمفرد الدال على جماعة متحدة، مع إبقاء احتمال معنى «شعب» في الحاشية وعدم تعيين هوية الجماعة بما يتجاوز النص.
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: تُنتج ثماره
  rationale: ينقل وصف الجماعة بفعل مستمر مثمر، ويحافظ على جمع «الثمار» وعلى عود الضمير إلى «ملكوت الله».
theological_decisions:
- issue: هوية «الأمة» (ἔθνει)
  choice: الإبقاء على التعبير العام «أمة» من غير تحديدها بالكنيسة أو بالأمم أو ببقية من إسرائيل.
  alternative: «شعب»، أو تفسيرها صراحة بأنها الكنيسة أو الأمم أو شعب الله المتجدد.
  rationale: اللفظ اليوناني يصف جماعةً مؤسسية بثمرها، لكنه لا يفرض في ذاته تعيينًا لاهوتيًا أضيق؛ لذلك تُحفظ مساحة الاحتمال والتوتر في النص.
- issue: دلالة «ملكوت الله» في قول الدينونة
  choice: 'ترجمة العبارة كما هي: «ملكوت الله».'
  alternative: «حكم الله» أو «امتيازات الانتماء إلى شعب الله».
  rationale: الصياغة المباشرة تحفظ المدى اللاهوتي الكامل للعبارة ولا تختزلها في سلطان مجرد أو امتيازات دينية.
- issue: مرجع الضمير في αὐτῆς
  choice: صياغته «ثماره» عائدًا إلى «ملكوت الله».
  alternative: فهم الثمار على أنها ثمار الأمة نفسها أو إعادة صياغة العبارة تفسيرًا.
  rationale: المؤنث اليوناني αὐτῆς يعود طبيعيًا إلى βασιλεία، أي «الملكوت»؛ وفي العربية يطابقه ضمير المذكر لأن «ملكوت» مذكر نحويًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «سيُنزع» لإبراز قوة فعل الإزالة، و«تُنتج ثماره» للحفاظ على استعارة الثمار وجمعها من غير شرح زائد داخل المتن.
