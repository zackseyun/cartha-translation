revisions:
- from: 'فأجابهم يسوع: «الحق أقول لكم: إن كان لكم إيمان ولم تشكّوا[a]، فلن تفعلوا ما جرى للتينة فحسب، بل حتى إن قلتم لهذا الجبل: ‹ارتفع وانطرح في البحر›، فسيحدث ذلك».'
  to: 'فأجابهم يسوع: «الحق أقول لكم: إن كان لكم إيمان ولم تشكّوا[a]، فلن يقتصر ما تفعلونه على ما جرى للتينة، بل حتى إن قلتم لهذا الجبل: ‹لِتُرفَع ولتُلقَ في البحر›، فسيحدث ذلك».'
  rationale: عُدّلت العبارة الإضمارية الخاصة بالتينة لتصبح طبيعية في العربية مع إبقاء الإحالة إلى ما جرى لها غير مفسَّرة فوق النص. وعُدّلت عبارتا الأمر الخاصتان بالجبل إلى المبني للمجهول («لِتُرفع ولتُلقَ») لمطابقة الصيغة اليونانية، مع الحفاظ على قوة الصورة وترك دلالتها التفسيرية مفتوحة. كما صيغ البديل في الحاشية بعبارة عربية أدق.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:08Z'
review_pass:
  verdict: revise
  source_fidelity: الترجمة تحافظ على بنية الشرط، وعلى «الإيمان» و«الشك»، وعلى التصعيد من التينة إلى الجبل، ولا تفرض تفسيرًا حرفيًا أو مجازيًا للصورة. لكن عبارة «فلن تفعلوا ما جرى للتينة» غير مستقيمة دلاليًا في العربية، لأن المرء لا «يفعل ما جرى» عادةً. كما أن «ارتفع وانطرح» يصوّر الجبل فاعلًا للفعلين، في حين أن فعلي الأمر اليونانيين مبنيان للمجهول.
  naturalness: الأسلوب فصيح وواضح عمومًا، وصيغة «الحق أقول لكم» مناسبة للسجل. يلزم تحسين العبارة الخاصة بالتينة لتكون عربية طبيعية، وصياغة الأمرين بشأن الجبل بما يحافظ على المبني للمجهول بصورة سليمة.
  terminology: «إيمان» مقابل مناسب لـ πίστις هنا، و«تشكّوا» مناسب لـ διακριθῆτε، مع حاشية تذكر التردد والانقسام الداخلي. و«هذا الجبل» و«البحر» و«الحق أقول لكم» اختيارات سليمة.
  issues:
  - severity: medium
    issue: «فلن تفعلوا ما جرى للتينة فحسب»
    rationale: التركيب يجعل «ما جرى» مفعولًا لـ«تفعلوا»، وهو غير طبيعي في العربية. كما أن العبارة اليونانية إضمارية وتشير إلى الأمر المتعلق بالتينة؛ الأنسب عربيًا إعادة بناء الجملة بحيث يبقى فعل التلاميذ حاضرًا من غير هذا التصادم الدلالي.
  - severity: medium
    issue: «ارتفع وانطرح في البحر»
    rationale: 'اليونانية Ἄρθητι وβλήθητι أمران مبنيان للمجهول: «لِتُرفع ولتُلقَ». أما «ارتفع وانطرح» فيصوّران الجبل قائمًا بالفعل، فلا يحفظان هذا الجانب من الصياغة المصدرية.'
