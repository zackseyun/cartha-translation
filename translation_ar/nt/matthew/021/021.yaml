  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: ar
  text: 'فأجابهم يسوع: «الحق أقول لكم: إن كان لكم إيمان ولم تشكّوا[a]، فلن يقتصر ما تفعلونه على ما جرى للتينة، بل حتى إن قلتم لهذا الجبل: ‹لِتُرفَع ولتُلقَ في البحر›، فسيحدث ذلك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولم تترددوا»، أو: «ولم تكونوا منقسمين في أنفسكم».'
    reason: يحمل الفعل اليوناني معنى الشك، وقد يوحي أيضًا بالتردد أو الانقسام الباطني.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: فأجابهم يسوع
  rationale: صياغة عربية طبيعية تجمع اسم الفاعل والفعل الدال على القول في تعبير واحد، وتحفظ كون كلام يسوع جوابًا وانتقال δέ السردي بالفاء.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: تعبير عربي واضح ومهيب يحفظ قوة الصيغة التوكيدية السلطانية من غير نقل «آمين» نقلًا صوتيًا قد يلتبس على القارئ.
- source_word: ἐὰν ἔχητε πίστιν
  choice: إن كان لكم إيمان
  rationale: يحفظ الشرط ودلالة πίστις هنا على الثقة المؤمنة، مع استعمال «إيمان» بوصفها المقابل العربي الطبيعي.
- source_word: μὴ διακριθῆτε
  choice: لم تشكّوا
  rationale: ينقل المعنى السياقي المباشر، أي عدم الشك أو التردد الباطني، مع إبقاء دلالة التردد وانقسام النفس في الحاشية.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: فلن تفعلوا ما جرى للتينة فحسب
  rationale: يفك الإضمار اليوناني المتعلق بأمر التينة بعبارة عربية مفهومة، من غير تحديد كيفية الحدث بما يتجاوز السياق.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: بل حتى إن قلتم لهذا الجبل
  rationale: يحفظ قوة الانتقال التصاعدي في κἄν والإشارة إلى جبل حاضر أو منظور.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: ارتفع وانطرح في البحر
  rationale: يحفظ الأمرين المبنيين للمجهول والصورة الحسية القوية، بصياغة عربية موجزة وطبيعية.
- source_word: γενήσεται
  choice: فسيحدث ذلك
  rationale: ينقل معنى وقوع الأمر مستقبلًا بوضوح، ويجعل مرجع الفعل مفهومًا في العربية بإضافة اسم الإشارة.
theological_decisions:
- issue: دلالة πίστις في قول يتعلق بفعل خارق
  choice: إيمان
  alternative: ثقة؛ أمانة
  rationale: السياق يتحدث عن ثقة مؤمنة لا عن صفة الأمانة، و«إيمان» يحفظ المصطلح من غير إضافة تحديد مذهبي.
- issue: طبيعة القول عن انتقال الجبل
  choice: الإبقاء على الصورة كما وردت من غير حصرها في المعنى الحرفي أو المجازي
  alternative: وعد حرفي محض بنقل جبل؛ أو استعارة محضة لتجاوز الصعوبات
  rationale: النص يستخدم صورة شديدة القوة، والترجمة تحفظ توترها ودلالتها المفتوحة بدل أن تحسم تفسيرها.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُخدمت «فحسب» لتقييد «ليس فقط»، وحُفظت صورة الجبل والبحر بلا تفسير زائد. تظهر علامة الحاشية [a] في موضعها في المتن.
