  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: ar
  text: 'ولمّا دخل أورشليم، اضطربت[a] المدينة كلّها، وهي تقول: «مَن هذا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اهتزّت». قد يدلّ الفعل اليوناني على الاهتزاز الحسي، ويصف هنا اضطرابًا عامًا في المدينة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: ولمّا دخل
  rationale: نُقلت صيغة المضاف المطلق اليونانية إلى جملة زمنية عربية طبيعية، مع إبقاء العلاقة الزمنية من غير حسمها إلى معنى «بعد أن».
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: ἐσείσθη
  choice: اضطربت
  rationale: الفعل اليوناني يعني في أصله الاهتزاز، ويُستعمل هنا مجازًا لوصف الاضطراب العام الذي أصاب المدينة. ولفظ «اضطربت» واضح وطبيعي مع احتفاظ الحاشية بالصورة الحرفية الممكنة.
- source_word: πᾶσα ἡ πόλις
  choice: المدينة كلّها
  rationale: صياغة عربية طبيعية تنقل شمول العبارة اليونانية.
- source_word: λέγουσα
  choice: وهي تقول
  rationale: تحافظ هذه الصياغة على إسناد القول إلى المدينة على سبيل المجاز، كما في النص اليوناني، بدل إضافة «الناس» تفسيرًا.
- source_word: Τίς ἐστιν οὗτος;
  choice: مَن هذا؟
  rationale: ترجمة مباشرة ومألوفة للسؤال، من غير إضافة كلمة «الرجل» غير الموجودة في الأصل.
theological_decisions:
- issue: هل يُفهم اضطراب المدينة حرفيًا أم مجازيًا؟
  choice: اضطربت
  alternative: اهتزّت
  rationale: السياق يصف رد فعل المدينة الجمعي عند دخول يسوع، لا وقوع زلزلة. ومع ذلك تُذكر «اهتزّت» في الحاشية حفاظًا على الصورة الكامنة في الفعل اليوناني وعلى قدر من احتماله اللفظي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «ولمّا» للربط الزمني الطبيعي، وأُبقي التشخيص البلاغي للمدينة في عبارة «وهي تقول» التزامًا ببنية الأصل.
