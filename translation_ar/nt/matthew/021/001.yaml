  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: ar
  text: ولمّا اقتربوا من أورشليم وجاءوا إلى بيت فاجي، إلى جبل الزيتون، أرسل يسوع حينئذٍ تلميذين
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: اقتربوا
  rationale: ينقل معنى الاقتراب المكاني من أورشليم بصياغة عربية فصيحة وطبيعية.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: ἦλθον
  choice: وصلوا إلى
  rationale: يميّز في العربية فعل الحركة الثاني من «اقتربوا»، ويفيد بلوغ بيت فاجي دون زيادة تفسيرية.
- source_word: Βηθφαγὴ
  choice: بيت فاجي
  rationale: نقل صوتي عربي واضح لاسم الموضع.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: عند جبل الزيتون
  rationale: يفهم التركيب على أنه يحدد موقع بيت فاجي بالنسبة إلى جبل الزيتون؛ و«عند» عربية طبيعية لا توهم الدخول في الجبل.
- source_word: τότε
  choice: حينئذٍ
  rationale: يحافظ على الانتقال الزمني السردي بصورة طبيعية.
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: المقابل المباشر والطبيعي في سياق إيفاد التلميذين في مهمة.
- source_word: δύο μαθητὰς
  choice: تلميذين
  rationale: صيغة المثنى العربية تؤدي العدد والاسم بإيجاز ووضوح.
theological_decisions:
- issue: فاعل الأفعال المجموعة قبل تسمية يسوع
  choice: الإبقاء على ضمير الجمع المستتر في «اقتربوا» و«وصلوا»، ثم ذكر يسوع حيث يذكره اليوناني.
  alternative: 'التصريح: «اقترب يسوع وتلاميذه».'
  rationale: النص اليوناني يفترض جماعة معلومة من السياق، لكنه لا يصرح هنا بعبارة «يسوع وتلاميذه»؛ لذلك لا تُضاف هوية تفصيلية غير مذكورة.
- issue: علاقة بيت فاجي بجبل الزيتون
  choice: «عند جبل الزيتون» بوصفها تحديدًا مكانيًا لبيت فاجي.
  alternative: «إلى جبل الزيتون»، بما قد يجعل الجبل غاية مستقلة للحركة.
  rationale: تتابع العبارة اليونانية يسمح بفهمها على أنها تحديد لموضع بيت فاجي، وهذه الصياغة تحافظ على المعنى الجغرافي الطبيعي دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ولمّا» لربط الحدث بالسياق السابق، وحوفظ على ترتيب السرد اليوناني وعلى عدم التصريح بفاعل الجمع قبل ورود اسم يسوع.
