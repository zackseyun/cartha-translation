source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: ar
  text: 'ولمّا دخل الهيكل[a]، دنا منه رؤساء الكهنة وشيوخ الشعب وهو يعلّم، وقالوا: «بأيّ سلطان تفعل هذه الأمور؟ ومن أعطاك هذا السلطان؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي على وجه التحديد.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: ولمّا دخل
  rationale: ترجمة طبيعية للتركيب المطلق بالمضاف إليه ذي الدلالة الزمنية، وتحفظ تتابع الحدث دون تحديد زائد لدرجة الفورية.
- source_word: ἱερὸν
  choice: الهيكل
  rationale: اللفظ اليوناني يدل هنا على مجمّع الهيكل وساحاته، لا على المقدس الداخلي وحده؛ واستُعمل اللفظ العربي المألوف مع إيضاح في الحاشية.
- source_word: προσῆλθον αὐτῷ
  choice: دنا منه
  rationale: ينقل معنى الاقتراب الجسدي بعبارة عربية فصيحة واضحة.
- source_word: διδάσκοντι
  choice: وهو يعلّم
  rationale: يحفظ تزامن التعليم مع اقتراب القادة منه.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: يشير الجمع إلى القيادات الكهنوتية، لا إلى تعدد شاغلي منصب رئيس الكهنة المفرد.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: شيوخ الشعب
  rationale: يدل على القادة المعترف بهم بين الشعب، وهو تعبير عربي موجز ومألوف.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: بأيّ سلطان
  rationale: ينقل السؤال عن الأساس المخوِّل للفعل؛ و«سلطان» هنا أوضح من «قوة» في الدلالة على الصلاحية والحق في التصرف.
- source_word: ταῦτα ποιεῖς
  choice: تفعل هذه الأمور
  rationale: يحفظ المضارع والمواجهة المباشرة بشأن أفعال يسوع في السياق القائم.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: ومن أعطاك هذا السلطان؟
  rationale: يحفظ فعل المنح في الماضي وصيغة السؤال المباشر، كما يحفظ العطف الوارد في الأصل.
theological_decisions:
- issue: دلالة ἐξουσία في تحدّي القادة
  choice: سلطان
  alternative: صلاحية، حق، قوة
  rationale: السياق يسأل عن التخويل المشروع لأفعال يسوع وتعليمه، لا عن القدرة المجردة؛ و«سلطان» يحفظ البعدين المؤسسي واللاهوتي دون حسم مصدره مسبقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الهيكل» بوصفه المقابل الكتابي المألوف، مع حاشية تمنع فهمه على أنه البناء الداخلي وحده، واستُخدم «سلطان» للحفاظ على قوة السؤال عن التخويل والحق في الفعل.
