- source_word: πορευθέντες
  choice: ذهب
  rationale: اسم فاعل ظرفي في اليونانية يسبق الفعل التالي؛ وصيغة الفعل الماضي في العربية تنقل تتابع الحدث طبيعيًا.
- source_word: δὲ
  choice: فـ
  rationale: تفيد مواصلة السرد مع إبراز أن ذهاب التلاميذ جاء استجابةً لما سبق.
- source_word: μαθηταὶ
  choice: التلاميذ
  rationale: المقابل العربي المألوف والدقيق لأتباع يسوع في سياق الأناجيل.
- source_word: ποιήσαντες
  choice: فعلوا
  rationale: تنقل الفعل بإيجاز ووضوح، وتنسجم طبيعيًا مع جملة «كما...» التالية.
- source_word: καθὼς
  choice: كما
  rationale: تفيد مطابقة فعل التلاميذ لما وجّههم إليه يسوع دون إضافة توكيد غير لازم.
- source_word: συνέταξεν
  choice: أمرهم
  rationale: الفعل συντάσσω يدل هنا على إصدار توجيه ملزم أو أمر؛ و«أمرهم» موجزة وطبيعية في العربية، مع إثبات البديل الأخف «أوصاهم» في الحاشية.
- source_word: αὐτοῖς
  choice: ـهم
  rationale: ضمير المفعول المتصل في «أمرهم» يؤدي معنى المفعول غير المباشر بصورة عربية طبيعية.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: النقل العربي المعياري للاسم العلم في نصوص العهد الجديد.
