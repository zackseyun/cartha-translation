  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: ar
  text: '«معمودية يوحنا، من أين كانت؟ أمن السماء أم من الناس؟» فتداولوا فيما بينهم قائلين: «إن قلنا: من السماء، فسيقول لنا: فلماذا إذًا لم تصدّقوه؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάπτισμα
  choice: معمودية
  rationale: يدل الاسم هنا على معمودية يوحنا بوصفها ممارسة ورسالة ذات سلطان، و«معمودية» هي المقابل العربي الراسخ والدقيق.
- source_word: τὸ Ἰωάννου
  choice: يوحنا
  rationale: الإضافة العربية في «معمودية يوحنا» تنقل علاقة المضاف إليه في اليونانية بصورة طبيعية.
- source_word: πόθεν
  choice: من أين كانت؟
  rationale: يسأل اللفظ عن المصدر أو المنشأ، وهذه الصياغة تحافظ على السؤال المباشر وتلائم عود الضمير إلى «معمودية» المؤنثة.
- source_word: ἐξ οὐρανοῦ
  choice: من السماء
  rationale: يحافظ على التعبير اليوناني الحرفي الذي يشير توقيريًا إلى الأصل أو السلطان الإلهي دون استبداله بتفسير صريح.
- source_word: ἐξ ἀνθρώπων
  choice: من الناس
  rationale: ينقل الأصل البشري العام المقابل للأصل السماوي من غير إيحاء بأن المقصود الذكور وحدهم.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: فتداولوا فيما بينهم
  rationale: ينقل المداولة المتبادلة المستمرة بصورة عربية طبيعية، لا مجرد التفكير الفردي الباطني.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على وظيفة اسم الفاعل في إدخال مضمون مداولتهم.
- source_word: Ἐὰν εἴπωμεν
  choice: إن قلنا
  rationale: صياغة شرطية عربية طبيعية ودقيقة للاحتمال المفترض.
- source_word: ἐρεῖ ἡμῖν
  choice: فسيقول لنا
  rationale: يحافظ على فعل القول وعلى المخاطبة المباشرة، مع إظهار نتيجة الشرط.
- source_word: Διὰ τί οὖν
  choice: فلماذا إذًا
  rationale: ينقل قوة الاستنتاج والاعتراض المترتب على جوابهم المفترض.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: لم تؤمنوا به
  rationale: «آمن به» هو التركيب العربي الطبيعي مع الشخص، ويشمل هنا تصديق يوحنا وقبول رسالته وسلطانه.
theological_decisions:
- issue: دلالة «من السماء»
  choice: إبقاء «من السماء» في المتن
  alternative: من الله
  rationale: يحفظ التعبير الأصلي وما فيه من إحالة توقيرية إلى المصدر الإلهي، من غير أن يحول الإيضاح التفسيري إلى نص صريح.
- issue: المقابلة بين السماء والبشر
  choice: من الناس
  alternative: من البشر
  rationale: «الناس» تعبير عربي واضح عام يشمل البشر، ويحافظ على المقابلة بين المصدر الإلهي والمصدر البشري دون تخصيص جنسي.
- issue: مدى معنى الإيمان بيوحنا
  choice: لم تؤمنوا به
  alternative: لم تصدقوه
  rationale: يحفظ «آمن به» سعة الفعل اليوناني، إذ قد يتضمن تصديق رسالة يوحنا وقبول سلطانه، بدل حصره في صدق أقواله فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «فتداولوا» لتصوير التشاور المتبادل، و«من الناس» لتجنب التذكير غير المقصود. لا توجد حواشٍ لأن البدائل التفسيرية غير لازمة لفهم الآية، ولذلك لا توجد علامات حواشٍ في المتن.
