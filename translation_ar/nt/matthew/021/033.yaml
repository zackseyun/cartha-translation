  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: ar
  text: '«اسمعوا مثلًا آخر: كان رجلٌ صاحبُ أرضٍ، غرس كرمًا، وأقام حوله سياجًا[b]، وحفر فيه معصرةً، وبنى برجًا[a]، ثم أجّره لكرّامين[c] وسافر.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تستحضر صورة غرس الكرم وإحاطته بسياج وحفر المعصرة وبناء البرج ما ورد في إشعياء 5:1–2.
    reason: cross_reference
  - marker: b
    text: 'أو: «أحاطه بسياج نباتي». يمكن للكلمة اليونانية أن تدل على حاجز محيط، مثل السياج أو الشجيرات المتشابكة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أجّره لمزارعين». يشير التعبير إلى تسليم الكرم إلى مزارعين يستأجرونه ويتولون زراعته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: اسمعوا مثلًا آخر
  rationale: صيغة الأمر للجمع في ἀκούσατε تُنقل طبيعيًا بـ«اسمعوا»، و«مثل» هو المقابل العربي المألوف والدقيق لـπαραβολή في تعليم يسوع.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: كان رجلٌ صاحبَ أرض
  rationale: يحفظ ذكر «رجل» في الأصل، ويعبّر «صاحب أرض» بوضوح عن دور οἰκοδεσπότης في هذا السياق الزراعي، من غير حصره في معنى ربّ البيت السكني.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: غرس كرمًا
  rationale: «غرس» مقابل مباشر لـἐφύτευσεν، و«كرم» تعبير عربي راسخ عن أرض مزروعة بالعنب ويحفظ الصورة الزراعية وصداها الكتابي.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: أقام حوله سياجًا
  rationale: φραγμός يدل على حاجز يحيط بالمكان، قد يكون سياجًا أو حائطًا نباتيًا؛ «سياج» واضح ولا يحدد مادته بما يتجاوز الأصل.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: حفر فيه معصرةً
  rationale: ينقل «حفر» معنى ὤρυξεν، و«معصرة» هو اللفظ العربي الطبيعي لمرفق عصر العنب في سياق الكرم.
- source_word: ᾠκοδόμησεν πύργον
  choice: بنى برجًا
  rationale: يحافظ على عمومية πύργος؛ فلا يضيف وظيفة المراقبة التي لا يصرح بها النص.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: أجّره لكرّامين
  rationale: الفعل الأوسط ἐξέδετο يفيد التأجير، و«كرّامين» يحدد مزارعي الكرم في السياق من غير أن يجعلهم مجرد عمال مأجورين.
- source_word: ἀπεδήμησεν
  choice: سافر
  rationale: يفيد ἀποδημέω مغادرة الموطن في سفر؛ و«سافر» طبيعي وموجز، ولا يضيف وجهة غير مذكورة.
theological_decisions:
- issue: صدى صورة الكرم في إشعياء 5:1–2
  choice: الإبقاء على عناصر الصورة الزراعية كما هي، مع بيان الصلة في الحاشية فقط
  alternative: استعمال ألفاظ تفسيرية أو تقليدية مخصوصة في المتن لتقوية الإشارة إلى إشعياء
  rationale: الصدى النصي قوي، لكن التصريح به داخل المتن يحوّل الترجمة إلى تفسير؛ لذلك تُحفظ الصورة الملموسة وتُذكر الإحالة في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعمل «كرم» و«كرّامين» لاتساق الصورة الزراعية، مع تجنب الألفاظ الكنسية الخاصة أو التفسير المذهبي. وُضعت علامات الحواشي ملاصقة للعبارات التي تشرحها.
