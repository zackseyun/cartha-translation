lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجاب
  rationale: صيغة سردية مألوفة، وتؤديها العربية الطبيعية بالفعل الماضي «أجاب» مع الفاء التي تصل الجواب بما قبله.
- source_word: Οὐ θέλω
  choice: لا أريد
  rationale: تنقل معنى الإرادة أو الرغبة في رفض مباشر، من غير تشديد العبارة إلى «لن أذهب» أو إضافة مفعول غير مذكور في اليونانية.
- source_word: ὕστερον
  choice: بعد ذلك
  rationale: تعبير زمني عربي واضح وطبيعي يدل على وقوع التحول لاحقًا.
- source_word: μεταμεληθεὶς
  choice: ندم
  rationale: الفعل اليوناني يدل على الندم أو التراجع المصحوب بتغير في الموقف؛ و«ندم» يحفظ هذا الجانب الوجداني مع إيضاح البديل في الحاشية، من غير استعمال «تاب» ذي الدلالة اللاهوتية الأقوى.
- source_word: ἀπῆλθεν
  choice: ذهب
  rationale: ينقل الفعل ببساطة، ويفهم من السياق أنه ذهب لينفذ ما طُلب منه، من غير إضافة هذا التفسير إلى النص.
theological_decisions:
- issue: دلالة μεταμεληθεὶς في سياق المثل
  choice: ندم
  alternative: غيّر رأيه؛ تراجع عن موقفه؛ تاب
  rationale: «ندم» قريب من المجال الدلالي للفعل ويحفظ التوتر بين الشعور بالأسف وتغيير المسار. أما «تاب» فقد يحمّل اللفظ معنى لاهوتيًا اصطلاحيًا أقوى مما يقتضيه الفعل اليوناني هنا، بينما تُذكر البدائل المشروعة في الحاشية.
