  source_fidelity: 'الترجمة تنقل بدقة البنية الأساسية للنص اليوناني: «معظم الجمع» لـ ὁ πλεῖστος ὄχλος، وفعل «فرش» للفعل التام ἔστρωσαν، ثم الصيغة المستمرة «كان آخرون يقطعون... ويفرشونها» للفعلين الناقصين ἔκοπτον وἐστρώννυον. كما حافظت على تكرار «على الطريق» وعلى كون الأغصان مأخوذة «من الأشجار».'
  naturalness: الصياغة عربية فصحى حديثة سليمة وواضحة، و«فرش ... ثيابهم على الطريق» و«أغصانًا من الأشجار» تعبيران طبيعيان. واستعمال المفرد في «وفرش معظم الجمع» مع ضمير الجمع في «ثيابهم» مقبول؛ إذ إن «معظم الجمع» يدل دلاليًا على أفراد متعددين.
