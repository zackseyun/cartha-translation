  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: ar
  text: وفرش معظمُ الجمع ثيابهم على الطريق[a][b]، وكان آخرون يقطعون أغصانًا من الأشجار ويفرشونها على الطريق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القسم الأكبر من الجمع».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «ثيابهم»: «أرديتهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: وفرش معظمُ الجمع
  rationale: تفيد πλεῖστος مع الاسم الجمعي غالبًا «معظم» أو «القسم الأكبر»، وتؤدي الواو وظيفة δέ بوصفها رابطًا سرديًا خفيفًا.
- source_word: ἔστρωσαν
  choice: فرش
  rationale: ينقل معنى بسط الأشياء ووضعها ممتدة على سطح الطريق.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: ثيابهم
  rationale: «الثياب» لفظ عربي واسع يلائم ἱμάτια، والضمير المتصل يؤدي معنى الملكية الانعكاسية طبيعيًا من غير تثقيل بعبارة «ثيابهم هم».
- source_word: ἐν τῇ ὁδῷ
  choice: على الطريق
  rationale: هذا هو التعبير العربي المألوف للأشياء المبسوطة فوق سطح الطريق، مع أن ἐν تعني حرفيًا «في».
- source_word: ἄλλοι δὲ
  choice: وكان آخرون
  rationale: تقدم فئة أخرى داخل الجمع، وتفيد الواو الإضافة السردية أكثر من المقابلة القوية.
- source_word: ἔκοπτον
  choice: يقطعون
  rationale: صيغة الماضي الناقص اليونانية تصور فعلًا جاريًا في المشهد، ويؤديه التركيب «كان... يقطعون».
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: أغصانًا من الأشجار
  rationale: ترجمة مباشرة وواضحة؛ «أغصان» هي المقابل العربي الطبيعي لـ κλάδους.
- source_word: καὶ ἐστρώννυον
  choice: ويفرشونها
  rationale: يحافظ الفعل المضارع بعد «كان» على الاستمرار الذي تفيده صيغة الماضي الناقص، والضمير يوضح أن المفعول هو الأغصان.
theological_decisions: []
