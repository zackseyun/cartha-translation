  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: ar
  text: 'ولمّا رأى شجرة تين عند الطريق، أقبل إليها، فلم يجد عليها شيئًا إلا أوراقًا فقط. فقال لها: «لا يخرج منك ثمر بعد الآن إلى الأبد».[a] فيبست شجرة التين في الحال.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بأسلوب عربي أكثر سلاسة: «لا تخرجي ثمرًا بعد الآن أبدًا».'
    reason: 'بديل أسلوبي يصوغ الشجرة فاعلًا للإثمار، بينما يحافظ المتن على صورة الأصل: خروج الثمر منها.'
lexical_decisions:
- source_word: συκῆν μίαν
  choice: شجرة تين
  rationale: تؤدي μίαν هنا وظيفة تنكير الشجرة وإدخالها في السرد؛ ولا يلزم إبراز العدد بقول «شجرة تين واحدة» في العربية.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: عند الطريق
  rationale: تعبير مكاني طبيعي يفيد وجود الشجرة بمحاذاة الطريق، من غير أن يوحي بأنها قائمة في وسطه.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: أقبل إليها
  rationale: ينقل معنى التوجه والاقتراب من الشجرة بلغة عربية طبيعية.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: لم يجد عليها شيئًا
  rationale: يقال في العربية عن الثمر والورق إنهما على الشجرة، وهو المقابل السياقي الطبيعي لحرف الجر اليوناني.
- source_word: εἰ μὴ φύλλα μόνον
  choice: إلا أوراقًا فقط
  rationale: 'يحفظ القصر والتوكيد في μόνον: لم يجد سوى الأوراق.'
- source_word: λέγει αὐτῇ
  choice: فقال لها
  rationale: حُوِّل المضارع التاريخي إلى الماضي الملائم للسرد العربي، مع إبقاء توجيه القول إلى الشجرة.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: لا يخرج منك ثمر بعد الآن إلى الأبد
  rationale: يحافظ على صورة خروج الثمر «منك»، وعلى اجتماع معنى الانقطاع من الآن فصاعدًا ومعنى الدوام، كما يصوغ القول بصيغة إنشائية جازمة.
- source_word: ἐξηράνθη παραχρῆμα
  choice: يبست ... في الحال
  rationale: «يبست» ملائمة للشجرة، و«في الحال» تنقل دلالة الفورية في παραχρῆμα.
theological_decisions:
- issue: قوة قول يسوع لشجرة التين
  choice: 'صيغة إنشائية جازمة: «لا يخرج منك ثمر بعد الآن إلى الأبد»'
  alternative: 'صيغة خبرية تنبؤية: «لن يخرج منك ثمر بعد الآن إلى الأبد»'
  rationale: صيغة اليونانية مع Μηκέτι والفعل في صيغة الاحتمال/الطلب تحمل قوة المنع أو الحكم، لا مجرد الإخبار بالمستقبل؛ وتحافظ الصياغة المختارة على ذلك من غير إضافة تفسير رمزي إلى نص الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع مراعاة إيقاع السرد. أُبقي التوكيد في «إلا أوراقًا فقط»، وحُفظت الصيغة الإنشائية والتوتر بين «بعد الآن» و«إلى الأبد» بدل تسويتهما في تعبير واحد.
