source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: ar
  text: وترك الناصرة[a]، ثم جاء وسكن في كفرناحوم الواقعة على شاطئ البحر، في منطقة زبولون ونفتالي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية هنا: «نازارا»؛ وهو اسم الناصرة بصيغة يونانية مختلفة.'
    reason: الحفاظ على الصيغة الاسمية الموجودة في النص اليوناني مع إبقاء الاسم العربي المعروف في المتن.
lexical_decisions:
- source_word: καταλιπὼν
  choice: وترك
  rationale: اسم فاعل ماضٍ يفيد فعلاً سابقاً للفعل الرئيس؛ وصيغة العطف العربية تنقل تتابع الأحداث بوضوح وطبيعية.
- source_word: Ναζαρὰ
  choice: الناصرة
  rationale: مع أن اليونانية هنا تستعمل الصيغة Ναζαρά، فإن «الناصرة» هي الصيغة العربية المستقرة للاسم نفسه؛ وتُذكر دقة الصيغة اليونانية في الحاشية.
- source_word: ἐλθὼν
  choice: ثم جاء
  rationale: اسم فاعل ماضٍ آخر؛ حُوِّل إلى فعل مع «ثم» لإظهار التتابع الزمني الطبيعي في العربية.
- source_word: κατῴκησεν
  choice: وسكن
  rationale: يفيد اتخاذ المكان موطناً أو الإقامة فيه؛ و«سكن» واضحة وفصيحة من غير تكلف.
- source_word: Καφαρναοὺμ
  choice: كفرناحوم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المكان.
- source_word: τὴν παραθαλασσίαν
  choice: الواقعة على شاطئ البحر
  rationale: وصف لكفرناحوم بأنها بجانب البحر؛ وهذه الصياغة واضحة وتبيّن تعلق الوصف بالمدينة.
- source_word: ἐν ὁρίοις
  choice: في منطقة
  rationale: الجمع ὅρια قد يدل على التخوم أو النواحي أو الأراضي؛ و«منطقة» تنقل المرجع الجغرافي من دون حصره في خطوط حدودية.
- source_word: Ζαβουλὼν
  choice: زبولون
  rationale: الصيغة العربية المألوفة للاسم القبلي والجغرافي.
- source_word: Νεφθαλίμ
  choice: نفتالي
  rationale: الصيغة العربية المألوفة للاسم القبلي والجغرافي.
