  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: ar
  text: 'لكي يتمّ ما قيل على لسان إشعياء النبي القائل:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تقدّم غرضًا أو نتيجة، وتحافظ بصياغة عربية طبيعية على قوة العبارة الغائية من غير حسم زائد بين الغرض والنتيجة.
- source_word: πληρωθῇ
  choice: يتمّ
  rationale: فعل ماضٍ تام مبني للمجهول بصيغة الاحتمال في جملة ἵνα. «يتمّ» تعبير عربي واضح مألوف في سياق إتمام ما سبق أن قيل، ويحفظ صيغة المبني للمجهول.
- source_word: τὸ ῥηθὲν
  choice: ما قيل
  rationale: الاسم الموصول «ما» مع الفعل المبني للمجهول ينقل طبيعيًا وظيفة الأداة والاسم المفعول المستعمل استعمال الاسم.
- source_word: διὰ
  choice: على لسان
  rationale: διά مع المضاف إليه هنا تدل على الوساطة؛ و«على لسان» تعبير عربي طبيعي يبرز أن إشعياء واسطة القول، لا مصدره النهائي.
- source_word: Ἠσαΐου
  choice: إشعياء
  rationale: الصيغة العربية المعيارية الشائعة لاسم النبي.
- source_word: τοῦ προφήτου
  choice: النبي
  rationale: بدل يعرّف دور إشعياء، وقد أُبقي صريحًا كما في النص اليوناني.
- source_word: λέγοντος
  choice: 'القائل:'
  rationale: اسم فاعل يقدّم الاقتباس الآتي، ويحافظ على البنية الوصفية الموازية للمصدر مع صياغة عربية سليمة.
theological_decisions:
- issue: صيغة الإتمام في متى
  choice: «لكي يتمّ ما قيل»
  alternative: «لكي يتحقق ما قيل» أو «فتمّ ما قيل»
  rationale: تحافظ «يتمّ» على موضوع إتمام الكتاب في متى، وعلى المبني للمجهول، بينما لا تضيف تفسيرًا لآلية الإتمام. كما أن «لكي» تصون ما في ἵνα من غرض أو نتيجة بدل تحويلها إلى تقرير زمني محض.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «على لسان» لنقل الوساطة النبوية بصورة طبيعية، وأُبقيت النقطتان لافتتاح الاقتباس التالي.
