id: MAT.4.8
reference: Matthew 4:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: ar
  text: مرةً أخرى، يأخذه إبليس إلى جبل عالٍ جدًا، ويُريه جميع ممالك العالم ومجدها[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بهاءها».'
    reason: بديل معجمي يوضح أن δόξα قد تشير هنا إلى العظمة أو الروعة الظاهرة للممالك.
lexical_decisions:
- source_word: Πάλιν
  choice: مرةً أخرى
  rationale: تفيد تكرار الفعل ضمن تسلسل التجارب، وهي عبارة عربية واضحة وطبيعية.
- source_word: παραλαμβάνει
  choice: يأخذه
  rationale: ينقل المضارع السردي كما ورد، ويعبّر بإيجاز عن اصطحابه إلى موضع آخر من غير إضافة تفصيل غير مذكور.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: اسم معروف وواضح في العربية للشخصية المشار إليها هنا، ويحافظ على دلالة اللقب في السياق.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: إلى جبل عالٍ جدًا
  rationale: يحافظ على دلالة الحركة إلى المكان وعلى التشديد الذي تفيده λίαν، بصياغة عربية طبيعية.
- source_word: δείκνυσιν
  choice: يُريه
  rationale: مقابل مباشر وطبيعي لفعل الإظهار، من غير مبالغة في دلالته.
- source_word: πάσας τὰς βασιλείας
  choice: جميع ممالك
  rationale: يحفظ معنى الشمول ودلالة βασιλεία السياسية والملكية.
- source_word: τοῦ κόσμου
  choice: العالم
  rationale: هو المقابل العربي الأوضح والأوسع ملاءمةً لـκόσμος في هذا السياق.
- source_word: τὴν δόξαν αὐτῶν
  choice: ومجدها
  rationale: يحافظ «مجدها» على المقابل المعجمي المعتاد لـδόξα، مع إمكان أن تدل هنا على العظمة والبهاء الظاهر؛ وقد أُثبت البديل التفسيري في الحاشية.
theological_decisions:
- issue: طبيعة مشهد الجبل في رواية التجربة
  choice: نقل المشهد كما ترويه العبارة، من غير تحديد كيفية رؤية جميع الممالك.
  alternative: اعتباره مسحًا بصريًا حرفيًا من جبل فعلي، أو كشفًا رؤيويًا أو فائقًا للطبيعة.
  rationale: يذكر النص أن إبليس أخذ يسوع إلى جبل عالٍ جدًا وأراه جميع ممالك العالم ومجدها، لكنه لا يشرح كيفية ذلك؛ لذلك تحافظ الترجمة على هذا الانفتاح ولا تفرض تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة، مع إبقاء المضارع السردي في «يأخذه» و«يُريه»، وتجنب أي شرح زائد داخل المتن.
