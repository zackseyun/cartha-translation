lexical_decisions:
- source_word: Ἀκούσας
  choice: ولمّا سمع
  rationale: اسم فاعل ماضٍ ذو دلالة زمنية بالنسبة إلى الفعل الرئيس؛ وصيغة «لمّا سمع» عربية طبيعية تحافظ على العلاقة الزمنية، والفاعل المفهوم من السياق هو يسوع.
- source_word: δὲ
  choice: الواو في «ولمّا»
  rationale: أداة ربط سردية خفيفة لا تفيد هنا تضادًا قويًا؛ نُقلت بواو الاستئناف من غير إضافة ظرف مثل «الآن» لا يصرّح به الأصل.
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: παρεδόθη
  choice: قد أُسلِمَ
  rationale: المبني للمجهول من παραδίδωμι، ومعناه أوسع من مجرد القبض؛ «أُسلِم» يحفظ معنى تسليمه إلى سلطة أخرى، مع بيان المعنى السياقي الأخص في الحاشية.
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: ينقل معنى الابتعاد أو المغادرة استجابةً للظرف، من غير أن يبالغ بإيحاء الفرار.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: حرف الجر يفيد الاتجاه إلى الجليل أو الدخول إليه؛ «إلى» هي الصياغة العربية الطبيعية هنا.
theological_decisions:
- issue: دلالة παραδίδωμι في خبر يوحنا
  choice: قد أُسلِمَ
  alternative: قد أُلقي القبض عليه
  rationale: يحفظ المتن المجال الدلالي الأوسع للفعل وما قد يحمله من صدى «التسليم»، من غير قصره على إجراء القبض؛ وتعرض الحاشية التحديد الذي يلائم السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «انصرف» بدل «انسحب» لتجنب إيحاء عسكري أو خوف زائد، وحُفظت علامة الحاشية [a] في المتن.
