    text: 'أو: «تنحني ساجدًا للرب إلهك». فالفعل اليوناني يدل في أصله على الانحناء أو السجود توقيرًا، ويأتي هنا في سياق العبادة.'
    reason: lexical_alternative
  - marker: b
    text: الفعل اليوناني المترجم «تعبد» قد يدل بوجه خاص على أداء خدمة دينية أو شعائرية لله.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: تفيد ترتيب الحدث في سياق السرد، وهي صياغة عربية موجزة وفصيحة.
- source_word: λέγει
  choice: يقول
  rationale: مضارع تاريخي في اليونانية؛ أُبقي بالمضارع حفاظًا على حيوية السرد.
- source_word: Ὕπαγε
  choice: اذهب
  rationale: أمر بالمغادرة يحمل قوة الطرد، وتؤدي «اذهب» المعنى بوضوح من غير تعبير متكلف.
- source_word: Σατανᾶ
  choice: يا شيطان
  rationale: اسم أو لقب في صيغة النداء، فنُقل بالصيغة العربية المألوفة.
- source_word: γέγραπται
  choice: مكتوب
  rationale: صيغة كتابية ثابتة تُدخل اقتباسًا من الأسفار المقدسة، وتحافظ على دلالة تمام الكتابة وبقاء سلطانها.
- source_word: Κύριον τὸν θεόν σου
  choice: للرب إلهك
  rationale: يحافظ على اقتران «الرب» و«إلهك»، وتلائم اللام الفعل العربي «تسجد».
- source_word: προσκυνήσεις
  choice: تسجد
  rationale: ينقل المعنى الحسي المباشر للانحناء أو السجود توقيرًا، مع بقاء دلالة العبادة واضحة في هذا السياق.
- source_word: αὐτῷ μόνῳ
  choice: إياه وحده
  rationale: تقديم ضمير المفعول المنفصل مع «وحده» يبرز قصر العبادة والخدمة عليه.
- source_word: λατρεύσεις
  choice: تعبد
  rationale: يدل الفعل اليوناني على خدمة دينية أو شعائرية مقدمة لله؛ و«تعبد» عربية طبيعية تحفظ طابعه الديني وتميزه هنا عن «تسجد».
theological_decisions:
- issue: تمييز الفعلين προσκυνέω وλατρεύω
  choice: ترجمة الأول «تسجد» والثاني «تعبد»
  alternative: ترجمة الأول «تعبد» والثاني «تخدم»
  rationale: يستعمل النص فعلين متقاربين لكن غير متطابقين. تحافظ «تسجد» و«تعبد» على التمييز بين فعل الخضوع التوقيري والخدمة الدينية، من غير حصر الدلالة في اصطلاح مذهبي.
- issue: دلالة الحصر في αὐτῷ μόνῳ
  choice: إياه وحده تعبد
  alternative: تعبده وحده
  rationale: الصياغة المختارة تُظهر بوضوح أن الحصر واقع على من تُقدَّم له العبادة، مع الحفاظ على التركيز اليوناني.
