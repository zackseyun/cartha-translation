source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: ar
  text: 'فأجاب: «مكتوب: ‹ليس بالخبز وحده يحيا الإنسان[a]، بل بكل كلمة تخرج من فم الله[b]›».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الإنسان عمومًا؛ فاللفظ اليوناني مفرد مذكر يُستعمل هنا استعمالًا تمثيليًا يشمل البشر.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تخرج عبر فم الله»؛ والمقصود كل ما ينطق به الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: صياغة عربية طبيعية موجزة تؤدي معنى العبارة السردية ذات الصبغة السامية من غير تكرار «أجاب وقال».
- source_word: Γέγραπται
  choice: مكتوب
  rationale: صيغة عربية مألوفة لإدخال اقتباس كتابي، وتحافظ على دلالة كون النص مكتوبًا وثابتًا.
- source_word: ἄρτῳ μόνῳ
  choice: بالخبز وحده
  rationale: تحافظ على المعنى المعجمي المباشر وعلى بنية العبارة اليونانية، من غير توسيع «الخبز» إلى الطعام عمومًا.
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: يحيا الإنسان
  rationale: المضارع العربي مناسب في المثل أو الحقيقة العامة، و«الإنسان» ينقل القوة التمثيلية العامة للاسم اليوناني المفرد.
- source_word: παντὶ ῥήματι
  choice: بكل كلمة
  rationale: «كلمة» تعبير واضح ومألوف لما ينطق به الله، من غير حصره في قول بعينه.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: تخرج من فم الله
  rationale: ينقل صورة الكلام الصادر من الفم بصياغة عربية طبيعية؛ ومع أن διά تعني حرفيًا «عبر/من خلال»، فإن العربية في هذا السياق تعبّر عن منشأ الكلام بـ«من».
theological_decisions:
- issue: الدلالة العامة في ὁ ἄνθρωπος
  choice: الإنسان
  alternative: الرجل / البشر
  rationale: المقصود حقيقة عامة تخص الإنسان، لا ذكرًا بالغًا بعينه؛ و«الإنسان» يحفظ المفرد التمثيلي بوضوح ومن دون تضييق الدلالة.
- issue: صيغة الاستشهاد Γέγραπται
  choice: مكتوب
  alternative: قد كُتب / مكتوبٌ هو
  rationale: تحافظ «مكتوب» على الصيغة الكتابية الموجزة وسلطان النص القائم، من دون إضافة تفسير عقدي.
- issue: دلالة διὰ στόματος θεοῦ
  choice: من فم الله
  alternative: عبر فم الله
  rationale: «من فم الله» هي العبارة العربية الطبيعية التي تحفظ استعارة صدور القول الإلهي؛ أما «عبر فم الله» فحرفية لكنها موهمة وغير مألوفة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الإبقاء على الإيقاع الكتابي المألوف في «ليس بالخبز وحده يحيا الإنسان». أُثبتت علامتا الحاشية في المتن، وصيغ الاقتباس الداخلي بعلامات واضحة.
