  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: ar
  text: 'وبينما كان يسوع يمشي بمحاذاة بحر الجليل، رأى أخوين: سمعان الذي يُدعى بطرس، وأندراوس أخاه، يلقيان شبكة[a] في البحر، لأنهما كانا صيادين.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: شبكة تُرمى للصيد؛ والكلمة اليونانية تشير إلى شبكة تُلقى في الماء للصيد.'
    reason: إبقاء التخصيص المعجمي لـἀμφίβληστρον في الحاشية مع استعمال لفظ عربي طبيعي في المتن.
lexical_decisions:
- source_word: Περιπατῶν δὲ
  choice: وبينما كان يسوع يمشي
  rationale: اسم الفاعل المضارع يدل على فعل مستمر متزامن مع الفعل الرئيس «رأى». أُظهر الفاعل «يسوع» في العربية اعتمادًا على سياق الآية السابقة لتفادي غموض الضمير، من غير إضافة معنى جديد.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: بمحاذاة بحر الجليل
  rationale: تفيد παρά مع النصب السير إلى جانب الموضع أو بمحاذاته، و«بحر الجليل» هو الاسم الجغرافي العربي المألوف.
- source_word: εἶδεν δύο ἀδελφούς
  choice: رأى أخوين
  rationale: صياغة عربية مباشرة تحفظ بساطة السرد، والمثنى يعبّر بدقة عن العدد وعن كونهما أخوين ذكرين.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: سمعان الذي يُدعى بطرس
  rationale: تحفظ جملة الصلة دلالة اسم المفعول اليوناني من غير أن توحي بأن «بطرس» مجرد وصف عابر.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: وأندراوس أخاه
  rationale: تحافظ على تركيب البدل الذي يعرّف أندراوس بعلاقته بسمعان، بصياغة عربية طبيعية.
- source_word: βάλλοντας ἀμφίβληστρον
  choice: يلقيان شبكة طرح
  rationale: المثنى يطابق الأخوين، و«شبكة طرح» تنقل خصوصية ἀμφίβληστρον بوصفها شبكة تُلقى للصيد، بدل الاكتفاء بكلمة عامة.
- source_word: εἰς τὴν θάλασσαν
  choice: في البحر
  rationale: مع فعل الإلقاء، «في البحر» هي الصياغة العربية الطبيعية لحركة الشبكة إلى داخله، وتحفظ الإحالة إلى بحر الجليل.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: لأنهما كانا صيادين
  rationale: تنقل «لأن» الوظيفة التفسيرية لـ γάρ بوضوح، ويطابق المثنى الشخصين المذكورين.
