lexical_decisions:
- source_word: Γῆ / γῆ
  choice: أرض
  rationale: يحافظ على الدلالة الجغرافية وعلى تكرار اللفظة في البنية المتوازية.
- source_word: Ζαβουλὼν
  choice: زبولون
  rationale: الصيغة العربية الكتابية المألوفة لاسم السبط والمنطقة.
- source_word: Νεφθαλίμ
  choice: نفتالي
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: ὁδὸν θαλάσσης
  choice: طريق البحر
  rationale: ترجمة موجزة تحافظ على صياغة الاقتباس وعلى احتمال أن يكون المقصود طريقًا معروفًا أو ناحية مرتبطة بالبحر.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: عبر الأردن
  rationale: يحفظ التعبير الجغرافي من غير أن يحدد جهة النظر تحديدًا زائدًا.
- source_word: Γαλιλαία
  choice: جليل
  rationale: الاسم العربي الكتابي المألوف للإقليم.
- source_word: τῶν ἐθνῶν
  choice: غير اليهود
  rationale: ينقل بوضوح في العربية المعاصرة دلالة الجماعات الأممية في هذا السياق اليهودي، مع إثبات البديل الحرفي الممكن في الحاشية.
theological_decisions:
- issue: دلالة ἐθνῶν في الاقتباس من إشعياء
  choice: غير اليهود
  alternative: الأمم
  rationale: السياق يبرز ارتباط الجليل بسكان من خارج الشعب اليهودي؛ وعبارة «غير اليهود» أوضح للقارئ المعاصر، بينما تبقى «الأمم» ترجمة معجمية صحيحة ومحفوظة في الحاشية.
