lexical_decisions:
- source_word: νηστεύσας
  choice: بعدما صام
  rationale: اسم الفاعل اليوناني في صيغة الماضي يعبّر هنا عن فعل سبق الفعل الرئيس؛ و«بعدما صام» صياغة عربية طبيعية تحفظ هذا الترتيب الزمني.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: أربعين يومًا وأربعين ليلة
  rationale: صيغة النصب اليونانية تدل على امتداد الزمن، والعربية تعبّر عن هذه المدة مباشرة من غير حاجة إلى حرف جر.
- source_word: ὕστερον
  choice: بعدما
  rationale: تدل الكلمة على الزمن اللاحق للصوم. دُمج معناها في «بعدما» تجنبًا للتكرار مع الحفاظ على العلاقة الزمنية؛ ويمكن إظهارها مستقلة بلفظ «بعد ذلك».
- source_word: ἐπείνασεν
  choice: جاع
  rationale: الفعل العربي «جاع» واضح وطبيعي، وينقل حدوث الجوع بعد الصوم من غير إقحام تفسير زائد.
- source_word: καὶ
  choice: و
  rationale: تحفظ الواو صلة الآية بسياق السرد السابق من غير إضافة دلالة تفسيرية.
theological_decisions:
- issue: إبراز احتياج يسوع البشري الحقيقي بعد الصوم
  choice: جاع
  alternative: شعر بالجوع
  rationale: «جاع» يقرر الجوع الحقيقي بوضوح، مع البقاء ضمن الدلالة المعجمية للنص ومن غير تحويل العبارة إلى تقرير عقائدي موسع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة وذات نبرة كتابية كريمة. استُعمل «بعدما» بوصفها صيغة طبيعية، مع إبقاء البديل الأكثر قربًا من ترتيب اليونانية في الحاشية.
