  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: ar
  text: ثم أصعد الروح يسوع إلى البرية ليُجرَّب[a] من إبليس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُمتحن»؛ فالفعل اليوناني قد يعني «يُجرَّب» أو «يُمتحن»، لكن السياق المباشر هنا يرجّح معنى «يُجرَّب».'
    reason: بديل معجمي يحفظ اتساع دلالة الفعل اليوناني.
lexical_decisions:
- source_word: Τότε
  choice: ثم
  rationale: أداة ربط زمنية طبيعية تُظهر تتابع الحدث مع ما سبقه.
- source_word: ἀνήχθη
  choice: قاد ... يسوع
  rationale: صياغة عربية طبيعية تنقل معنى القيادة والفاعل المذكور في العبارة اليونانية؛ أما إبراز اتجاه الصعود حرفيًا فيبدو متكلفًا هنا ولا يضيف معنى مكانيًا مؤكدًا.
- source_word: εἰς τὴν ἔρημον
  choice: إلى البرية
  rationale: «البرية» تشمل المنطقة المقفرة أو الخلاء من غير أن تحدد طبيعة التضاريس تحديدًا زائدًا.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: الروح
  rationale: التعريف وسياق معمودية يسوع السابق مباشرة يدلان على روح الله، من غير إضافة لفظ «القدس» غير الموجود في هذه الآية.
- source_word: πειρασθῆναι
  choice: لكي يجرّبه
  rationale: وجود إبليس فاعلًا وسياق السرد اللاحق يرجحان معنى الإغراء بالشر، مع إثبات معنى «الامتحان» الممكن في الحاشية.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: إبليس
  rationale: اللفظ هنا لقب للخصم الشخصي المعروف، و«إبليس» هو المقابل العربي الواضح والطبيعي في هذا السياق.
theological_decisions:
- issue: هوية τοῦ πνεύματος
  choice: الروح، أي روح الله بحسب السياق
  alternative: روح غير معيّنة أو روح يسوع البشرية
  rationale: يربط السياق الأدبي المباشر هذا الروح بالروح الذي نزل على يسوع عند معموديته، مع عدم إضافة «القدس» إلى نص الآية.
- issue: دلالة πειρασθῆναι
  choice: يجرّبه
  alternative: يمتحنه
  rationale: يحفظ الاختيار قوة التجربة الشيطانية في الحدث التالي، بينما تحفظ الحاشية المجال الدلالي الأوسع للفعل اليوناني والتوتر بين التجربة والامتحان.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت الجملة الفعلية المباشرة لتجنب ثقل المبني للمجهول مع شبه الجملة في العربية، مع الحفاظ على فاعلَي القيادة والتجربة كما يحددهما النص.
