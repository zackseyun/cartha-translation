  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: ar
  text: 'وقال له: «أعطيك هذه كلها إن خررت وسجدت لي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انحنيت لي» أو «أديت لي فروض الولاء». قد يدل الفعل اليوناني على السجود أو إظهار الولاء، لكن السياق هنا يرجّح العبادة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يحافظ على تتابع السرد من غير إضافة دلالة زمنية صريحة.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: يحافظ على الضميرين في اليونانية ولا يضيف اسمًا غير وارد في العبارة.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: أعطيك هذه كلها
  rationale: صياغة عربية واضحة تحفظ الإشارة إلى الأمور المعروضة في الآية السابقة، وشمول πάντα، ودلالة المستقبل في سياق العرض.
- source_word: ἐὰν
  choice: إن
  rationale: أداة شرط فصيحة وطبيعية تلائم الوعد المشروط.
- source_word: πεσὼν
  choice: خررت
  rationale: يحفظ صورة السقوط الجسدي السابق للسجود من غير أن يختزل الفعلين في تعبير واحد.
- source_word: προσκυνήσῃς μοι
  choice: سجدت لي
  rationale: السجود هو المقابل العربي المباشر الذي يجمع هيئة الانحناء ودلالة التعبد في هذا السياق، مع إبقاء المدى الدلالي في الحاشية.
theological_decisions:
- issue: دلالة προσκυνέω في طلب المجرّب
  choice: سجدت لي
  alternative: انحنيت لي / أديت لي فروض الولاء
  rationale: السياق الديني، ولا سيما جواب يسوع في الآية التالية عن عبادة الله وحده، يرجح معنى العبادة؛ لكن لفظ «سجد» يحفظ أيضًا الهيئة الجسدية والمدى الدلالي الأوسع ولا يحسمه بتفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «خررت وسجدت» للحفاظ على الفعلين اليونانيين والصورة الحسية، ووُضعت علامة الحاشية بعد الجملة كاملة.
