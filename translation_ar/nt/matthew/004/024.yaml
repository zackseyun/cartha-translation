  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: ar
  text: 'وانتشر الخبر عنه في سورية كلها، فأحضروا إليه جميع المرضى: المبتلين بأمراض وآلام شتى، والذين تسلّطت عليهم الشياطين[a]، والمصابين بنوبات صرع[b]، والمشلولين؛ فشفاهم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الممسوسين بالشياطين»، أو: «الذين بهم شياطين».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «المتأثرين بالقمر»؛ وقد تُرجم اللفظ تقليديًا: «المصروعين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: الخبر عنه
  rationale: يدل اللفظ هنا على ما يُسمع عن يسوع، أي الخبر المتداول عنه، لا على حاسة السمع.
- source_word: ἀπῆλθεν
  choice: انتشر
  rationale: ينقل في العربية الطبيعية صورة خروج الخبر وبلوغه أنحاء المنطقة، من غير الإخلال بالمعنى.
- source_word: Συρίαν
  choice: سورية
  rationale: الاسم العربي المعياري للإقليم.
- source_word: προσήνεγκαν
  choice: أحضروا إليه
  rationale: يفيد في السياق إحضار المرضى إلى يسوع، وهو تعبير عربي واضح وطبيعي.
- source_word: κακῶς ἔχοντας
  choice: جميع المرضى
  rationale: هذا التعبير اليوناني اصطلاح يدل على من كانت حالتهم سيئة بسبب المرض.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: الذين كانت تشتدّ عليهم أمراض وآلام شتى
  rationale: يحفظ تنوع الأمراض وشدة المعاناة التي تفيدها συνεχομένους وβασάνοις، بصياغة عربية مفهومة.
- source_word: δαιμονιζομένους
  choice: من تسلّطت عليهم الشياطين
  rationale: يثبت المرجع الشيطاني الحقيقي، مع تجنب حصر اللفظ في اصطلاح عربي تقني أضيق مما يلزم.
- source_word: σεληνιαζομένους
  choice: المصابين بنوبات صرع
  rationale: يعبّر عن الحالة الظاهرة للقارئ المعاصر دون تبنّي الربط السببي القديم بالقمر، مع بيان المعنى الحرفي في الحاشية.
- source_word: παραλυτικούς
  choice: المشلولين
  rationale: مقابل عربي واضح وشائع للأشخاص المصابين بالشلل.
- source_word: ἐθεράπευσεν
  choice: شفاهم
  rationale: المقابل السياقي المباشر والطبيعي لفعل الشفاء.
theological_decisions:
- issue: مدى دلالة δαιμονιζομένους على التملك أو التأثير الشيطاني
  choice: من تسلّطت عليهم الشياطين
  alternative: الممسوسين بالشياطين / الذين بهم شياطين
  rationale: الصياغة المختارة تحافظ على حقيقة الأذى الشيطاني، لكنها لا تفرض درجة تقنية محددة من «التملك» لا يحسمها اللفظ وحده.
- issue: كيفية نقل σεληνιαζομένους وعلاقته بالقمر
  choice: المصابين بنوبات صرع
  alternative: المصروعين / المتأثرين بالقمر
  rationale: يصف الاختيار الحالة على نحو مفهوم حديثًا دون إقرار أن القمر سببها، بينما تحفظ الحاشية الصلة اللفظية والتقليدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. رُتبت أوصاف المرضى بما يحافظ على تسلسل اليونانية، واستُخدمت ألفاظ غير تقنية قدر الإمكان. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
