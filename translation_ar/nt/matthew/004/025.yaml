lexical_decisions:
- source_word: ἠκολούθησαν
  choice: تبعته
  rationale: فعل ماضٍ يعبّر طبيعيًا عن السير وراء يسوع، مع إبقاء احتمال الاهتمام التلمذي من غير المبالغة في درجة الالتزام.
- source_word: ὄχλοι πολλοὶ
  choice: جموع كثيرة
  rationale: صياغة عربية واضحة تنقل تعدد الجموع وكثرتها، من غير تحويل الوصف إلى تقدير عددي دقيق.
- source_word: ἀπὸ
  choice: من
  rationale: تدل على مصدر الجموع، ويمتد معناها إلى عناصر القائمة الجغرافية.
- source_word: Γαλιλαίας
  choice: الجليل
  rationale: الاسم العربي الشائع للإقليم.
- source_word: Δεκαπόλεως
  choice: منطقة المدن العشر
  rationale: يوضح أن الاسم يدل على الإقليم المعروف المرتبط بعشر مدن، وهو أفهم للقارئ العربي من النقحرة وحدها.
- source_word: Ἱεροσολύμων
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة، رغم صيغة الجمع الصرفية في اليونانية.
- source_word: Ἰουδαίας
  choice: اليهودية
  rationale: الاسم العربي الشائع للإقليم.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ما وراء نهر الأردن
  rationale: يحفظ المعنى المكاني للناحية الواقعة وراء الأردن، مع توضيح أن الأردن هنا اسم النهر.
- source_word: καὶ ... καὶ ... καὶ
  choice: و... و... و...
  rationale: حُفظ التتابع العاطف قدر ما تسمح به العربية لإبراز الامتداد الجغرافي التراكمي.
