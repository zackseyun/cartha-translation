source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: ar
  text: حينئذ تركه إبليس، وإذا بملائكة أقبلوا وكانوا يخدمونه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة الفعل بـ«يخدمونه». وصيغة الماضي الناقص في اليونانية توحي بأن خدمتهم كانت عملًا جاريًا في ذلك المشهد.
    reason: بيان البديل الترجمِي ودلالة صيغة الفعل المستمرة.
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: أداة زمنية تربط الحدث بما سبقه وتبيّن تعاقب أحداث السرد بوضوح.
- source_word: ἀφίησιν
  choice: تركه
  rationale: الفعل مضارع تاريخي في اليونانية، وصيغة الماضي أنسب للسرد العربي. وفي السياق يدل على أن إبليس فارق يسوع.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: اللفظ هنا لقب شخصي للكائن الذي يجرّب يسوع، و«إبليس» هو المقابل العربي الواضح والمألوف في هذا السياق.
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: تركيب عربي طبيعي يحفظ عنصر المفاجأة ويلفت الانتباه إلى المشهد الجديد.
- source_word: ἄγγελοι
  choice: ملائكة
  rationale: السياق يدل على كائنات سماوية لا على رسل بشريين.
- source_word: προσῆλθον
  choice: اقتربوا
  rationale: يحفظ معنى الدنو أو التقدّم الوارد في الفعل، لا مجرد الوصول العام.
- source_word: διηκόνουν
  choice: كانوا يخدمونه
  rationale: صيغة الماضي الناقص اليونانية تصوّر الخدمة بوصفها عملًا جاريًا أو مستمرًا في المشهد، و«يخدمونه» عربية واضحة من غير إضافة نوع خدمة غير مذكور.
theological_decisions:
- issue: تعيين مدلول διάβολος في قصة التجربة
  choice: إبليس
  alternative: المفتري
  rationale: مع أن المعنى الاشتقاقي يمكن أن يفيد الافتراء، فإن الكلمة تؤدي هنا وظيفة اللقب الشخصي في سياق التجربة؛ لذلك يحفظ «إبليس» المرجع المقصود من غير فرض تفسير إضافي.
- issue: طبيعة خدمة الملائكة ليسوع
  choice: كانوا يخدمونه
  alternative: كانوا يقومون بخدمته
  rationale: النص لا يحدد نوع الخدمة، لذلك تُرك التعبير عامًا مع الحفاظ على دلالة الاستمرار في صيغة الفعل.
translation_notes:
  register: عربية فصحى حديثة، واضحة وذات نبرة سردية مهيبة. استُخدم «وإذا بـ» بدل المقابل الحرفي الجامد لأداة التنبيه، وحُفظت دلالة الاستمرار في «كانوا يخدمونه».
