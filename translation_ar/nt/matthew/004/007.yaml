base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: ar
  text: 'فقال له يسوع: «ومكتوب أيضًا: لا تضعِ الربَّ إلهك موضعَ الاختبار».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تختبر الرب إلهك». يمكن أن يُترجم الفعل اليوناني ἐκπειράζω بـ«يختبر» أو «يضع موضع الاختبار».'
    reason: lexical_alternative
  - marker: b
    text: اقتباس من تثنية 6:16. ولفظ «الرب» في اليونانية يعكس ترجمة السبعينية للاسم الإلهي.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: فقال له يسوع
  rationale: صيغة عربية طبيعية أمينة لترتيب الحدث، تنقل فعل القول البسيط والضمير غير المباشر من غير إضافة قوة دلالية.
- source_word: Πάλιν γέγραπται
  choice: ومكتوب أيضًا
  rationale: تحافظ على صيغة الاقتباس الكتابية وعلى دلالة πάλιν بوصفها استشهادًا مقابلًا أو إضافيًا في السياق.
- source_word: Οὐκ ἐκπειράσεις
  choice: لا تجرِّبْ
  rationale: المستقبل اليوناني يؤدي معنى النهي، والفعل العربي «جرَّب» طبيعي في هذا الاقتباس ويحمل معنى إخضاع الله للاختبار؛ وتوضح الحاشية البديل الدلالي.
- source_word: κύριον τὸν θεόν σου
  choice: الربَّ إلهك
  rationale: ينقل κύριος بلفظ «الرب» ويحافظ على تركيب البدل أو البيان «إلهك» وعلى الصدى العهدي للاقتباس.
theological_decisions:
- issue: ترجمة κύριος في اقتباس كتابي يشير إلى إله إسرائيل
  choice: الرب
  alternative: يهوه
  rationale: النص اليوناني المباشر يقرأ κύριον وفق صياغة السبعينية، لذلك تُحفظ «الرب» في المتن، مع بيان خلفية الاسم الإلهي في الحاشية.
- issue: دلالة ἐκπειράζω في النهي
  choice: لا تجرِّبِ الربَّ إلهك
  alternative: لا تضع الرب إلهك موضع الاختبار
  rationale: «تجرّب» موجزة وطبيعية وراسخة في العربية الكتابية، لكنها قد تحتمل معنى الإغراء في الاستعمال الحديث؛ لذلك تبيّن الحاشية أن المقصود امتحانه أو وضعه موضع الاختبار.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إبقاء الصيغة الكتابية المألوفة «مكتوب» وتركيب «الرب إلهك». أُثبتت علامتا الحاشيتين في المتن بعد الاقتباس، ورُتبتا وفق التسلسل المعتاد.
