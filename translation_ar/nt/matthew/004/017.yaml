  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: ar
  text: 'ومن ذلك الوقت بدأ يسوع يعلن قائلًا[a]: «توبوا[b]، لأن ملكوت السماوات[c] قد اقترب[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يعلن ويقول».'
    reason: previous_rendering
  - marker: b
    text: أو «ارجعوا». يتضمن الفعل تحولًا في الفكر والحياة، لا مجرد تغيير ذهني.
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية حرفيًا: «ملكوت السماوات». وهذا تعبير يكثر متى من استعماله حيث ترد في مواضع أخرى عبارة «ملكوت الله».'
    reason: lexical_alternative
  - marker: d
    text: أو «قد دنا» أو «صار قريبًا». تدل صيغة الفعل اليوناني على أن قرب الملكوت قد تحقق وما زال قائمًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: ومن ذلك الوقت
  rationale: يحفظ الإشارة إلى نقطة تحوّل زمنية في السرد بصياغة عربية طبيعية ورصينة.
- source_word: ἤρξατο
  choice: بدأ
  rationale: المقابل العربي المباشر والطبيعي للفعل مع المصدر المتمم.
- source_word: κηρύσσειν καὶ λέγειν
  choice: ينادي قائلًا
  rationale: ينقل معنى الإعلان العلني في κηρύσσειν، ويجعل «قائلًا» مدخلًا طبيعيًا إلى مضمون النداء، مع بيان البنية الحرفية في الحاشية.
- source_word: Μετανοεῖτε
  choice: توبوا
  rationale: صيغة أمر موجزة ومألوفة تشمل التحول عن الخطأ والرجوع إلى الله، ولا تختزل المعنى في مجرد تغيير فكري.
- source_word: ἤγγικεν
  choice: قد اقترب
  rationale: '«قد» مع الماضي تنقل على نحو مناسب دلالة الفعل التام: صار الملكوت قريبًا، مع بقاء حالة القرب قائمة.'
- source_word: βασιλεία
  choice: ملكوت
  rationale: يحفظ المصطلح العربي الكتابي المعروف، ويمكن أن يدل على سلطان الملك وحكمه، لا على الحيز المكاني وحده.
- source_word: τῶν οὐρανῶν
  choice: السماوات
  rationale: يحفظ صيغة الجمع المميزة في تعبير متى، وهي صياغة عربية مفهومة ومستقرة.
theological_decisions:
- issue: دلالة βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  alternative: حُكم السماوات / مملكة السماء
  rationale: يحفظ تعبير متى المميز واتساع دلالة βασιλεία بين الحُكم والملكوت، من غير حصره في مكان أو فرض تفسير مذهبي.
- issue: قوة الأمر Μετανοεῖτε
  choice: توبوا
  alternative: ارجعوا / غيّروا فكركم
  rationale: «توبوا» تشمل التحول الأخلاقي والروحي، ولا تقصر الأمر على إعادة النظر الذهني وحدها.
- issue: قوة صيغة التام في ἤγγικεν
  choice: قد اقترب
  alternative: هو قريب / قد دنا
  rationale: تنقل الصياغة أن القرب قد تحقق وصار حالة قائمة، من دون حسم كيفية حضور الملكوت أو توقيته بأكثر مما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «ينادي» بدل المصطلح الكنسي الأضيق «يكرز»، وحُفظ «ملكوت السماوات» لرسوخه ولدقته في هذا السياق.
