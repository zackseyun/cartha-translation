  rationale: 'تقتصر المراجعة على تحسين الفصاحة والدقة في نقل فعل الكرازة، وعلى ضبط مرساة الحاشية لتتصل بـ«بشارة»، مع إبقاء جميع عناصر المعنى اليوناني: الجولان المستمر في كامل الجليل، والتعليم في المجامع، وبشارة الملكوت، والشفاء الشامل بين الشعب.'
