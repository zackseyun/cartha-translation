id: MAT.4.23
reference: Matthew 4:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: ar
  text: وكان يجول في كل الجليل، يعلّم في مجامعهم، ويعلن بشارة[a] الملكوت، ويشفي كل مرض وكل سقم بين الشعب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنجيل الملكوت».'
    reason: بديل معجمي مألوف لـ εὐαγγέλιον.
lexical_decisions:
- source_word: περιῆγεν
  choice: كان يجول
  rationale: صيغة الماضي الناقص تصوّر حركة متواصلة بين مواضع المنطقة، و«كان يجول» تؤدي معنى التنقل المستمر بعبارة عربية طبيعية.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: في الجليل كله
  rationale: تحافظ العبارة على حرف الجر وعلى شمول المنطقة كلها، وتلائم فعل الحركة في العربية.
- source_word: διδάσκων
  choice: يعلِّم
  rationale: فعل مضارع معطوف يبيّن نشاطًا متزامنًا مع جولانه، وهو أوضح من تركيب حالي ثقيل.
- source_word: συναγωγαῖς αὐτῶν
  choice: مجامعهم
  rationale: «المجامع» هو المقابل العربي المألوف للمجامع اليهودية، والضمير يحفظ αὐτῶν.
- source_word: κηρύσσων
  choice: ينادي
  rationale: ينقل معنى الإعلان العلني الذي يحمله κηρύσσω، بلغة واضحة ومفهومة.
- source_word: τὸ εὐαγγέλιον
  choice: بشارة
  rationale: «بشارة» تنقل المعنى المعجمي للخبر السار بصورة مباشرة، مع إثبات البديل الاصطلاحي «إنجيل» في الحاشية.
- source_word: τῆς βασιλείας
  choice: الملكوت
  rationale: الإضافة في «بشارة الملكوت» تحفظ علاقة المضاف إليه في اليونانية ولا تحسمها تفسيرًا إلى «عن الملكوت».
- source_word: θεραπεύων
  choice: يشفي
  rationale: السياق يدل على الشفاء الفعلي، و«يشفي» هو التعبير العربي الطبيعي المباشر.
- source_word: πᾶσαν νόσον
  choice: كل مرض
  rationale: «مرض» مقابل واسع لـ νόσος، مع إبقاء تمييز لفظي عن μαλακία.
- source_word: πᾶσαν μαλακίαν
  choice: كل سقم
  rationale: «سقم» يدل على الاعتلال والوهن المرضي، ويحفظ ازدواج اللفظين وشمول كل منهما دون دمجهما.
- source_word: ἐν τῷ λαῷ
  choice: بين الشعب
  rationale: تؤدي العبارة معنى المجال الذي جرت فيه أعمال الشفاء بأسلوب عربي سليم، دون تحميل «الشعب» دلالة لاهوتية زائدة.
theological_decisions:
- issue: ترجمة εὐαγγέλιον
  choice: بشارة
  alternative: إنجيل
  rationale: «بشارة» شفافة دلاليًا للقارئ المعاصر، فيما تحفظ الحاشية المصطلح الكنسي المألوف من غير تغيير للمضمون.
- issue: مدى الشفاء في πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: كل مرض وكل سقم
  alternative: كل علة وكل ضعف
  rationale: تكرار «كل» يحفظ التأكيد والشمول في النص اليوناني، واختلاف الاسمين يمنع طمس الازدواج الأصلي من غير مبالغة تتجاوز الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت أفعال مضارعة متعاطفة بعد «كان يجول» لإبراز تزامن التعليم والمناداة والشفاء واستمرارها، مع تجنب التراكيب الحرفية الثقيلة.
