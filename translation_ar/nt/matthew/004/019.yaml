  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: ar
  text: 'ويقول لهما: «تعاليا ورائي، وسأجعلكما صيّادي الناس».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صيّادي بشر»؛ واللفظة اليونانية تشير هنا إلى البشر عمومًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ويقول
  rationale: حُفظ المضارع التاريخي اليوناني، وهو أسلوب سردي مألوف في الأناجيل، ويمكن نقله إلى العربية بوضوح.
- source_word: αὐτοῖς
  choice: لهما
  rationale: الضمير اليوناني جمع، لكن سياق العدد السابق يحدد المخاطبَين، والعربية الفصحى تقتضي استعمال المثنى.
- source_word: Δεῦτε
  choice: تعاليا
  rationale: صيغة دعوة أمرية بمعنى «هلمّا/تعاليا». اختير اللفظ المعاصر الواضح، مع إبقاء معنى ὀπίσω μου مستقلًا.
- source_word: ὀπίσω μου
  choice: ورائي
  rationale: ينقل حرفيًا وطبيعيًا معنى «خلفي/ورائي» ويحفظ صورة السير في إثر يسوع بوصفها دعوة إلى التلمذة.
- source_word: ποιήσω ὑμᾶς
  choice: فأجعلكما
  rationale: ينقل الوعد المستقبلي بفعل تحويلي، مع استعمال المثنى بحسب المخاطبَين؛ والفاء تصل النتيجة بالدعوة على نحو عربي طبيعي.
- source_word: ἁλιεῖς
  choice: صيّادي
  rationale: «صيّاد» المقابل العربي الطبيعي لمن يصيد، وجاء بصيغة جمع المذكر السالم المضاف الملائمة للمثنى المخاطَب دون إدخال قيد زائد.
- source_word: ἀνθρώπων
  choice: بشر
  rationale: ἄνθρωπος هنا يدل على البشر عمومًا لا على الذكور وحدهم. و«بشر» تحفظ الدلالة الإنسانية العامة، كما أن تركيب «صيّادي بشر» موجز ومفهوم.
theological_decisions:
- issue: الدلالة الجنسية في ἀνθρώπων
  choice: بشر
  alternative: رجال
  rationale: مع أن الصيغة اليونانية صرفيًا جمع مذكر، فإن ἄνθρωπος في هذا السياق اسم عام للبشر. ترجمتها «رجال» قد توهم حصر المهمة في الذكور، وهو تضييق لا يقتضيه النص.
- issue: صورة الصيد وعمل التلمذة
  choice: صيّادي بشر
  alternative: تجتذبان الناس
  rationale: حُفظت استعارة الصيد كما وردت، دون تفسير طبيعة المهمة أو نتائجها تفسيرًا مذهبيًا داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل المثنى في «لهما، تعاليا، أجعلكما» لأن السياق يحدد مخاطبَين، مع أن اليونانية تستعمل صيغ الجمع. وُضعت علامة الحاشية بعد الجملة التي تشرح عبارتها.
