    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ثم
  rationale: تفيد التعاقب الزمني في سياق السرد، و«ثم» صياغة عربية طبيعية وواضحة.
- source_word: παραλαμβάνει
  choice: يأخذه
  rationale: مضارع تاريخي يضفي حيوية على السرد؛ حُفظ بصيغة المضارع في العربية.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: يَرِد اللفظ هنا لقبًا شخصيًا للشرير؛ و«إبليس» المقابل الكتابي العربي المألوف الواضح.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: إلى المدينة المقدسة
  rationale: ينقل معنى الحركة نحو المدينة مع إبقاء اللقب الوارد في اليونانية بدل استبداله باسم أورشليم في المتن.
- source_word: ἔστησεν
  choice: يُوقفه
  rationale: الفعل متعدٍّ وسببي هنا، أي جعله يقف في ذلك الموضع؛ والمضارع ينسجم مع المضارع التاريخي السابق.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: على شُرفة
  rationale: πτερύγιον يدل حرفيًا على جناح أو طرف بارز، ويرجح أن يشير هنا إلى جزء معماري بارز وعالٍ؛ «شُرفة» طبيعية عربيًا، مع بيان الاحتمالات في الحاشية.
- source_word: τοῦ ἱεροῦ
  choice: الهيكل
  rationale: ἱερόν يشير إلى مجمّع الهيكل عمومًا لا إلى المقدس الداخلي وحده؛ «الهيكل» هو المقابل العربي المألوف في السياق.
theological_decisions:
- issue: تعيين «المدينة المقدسة»
  choice: الإبقاء على «المدينة المقدسة» في المتن
  alternative: أورشليم
  rationale: يحافظ ذلك على اللقب الذي استعمله النص اليوناني، مع توضيح المقصود في الحاشية دون إحلال التفسير محل العبارة الأصلية.
- issue: تحديد المعلم المعماري المقصود بلفظ πτερύγιον
  choice: شُرفة الهيكل
  alternative: جناح الهيكل؛ أعلى موضع في مجمّع الهيكل
  rationale: المعلم الدقيق غير محسوم؛ لذلك اختير تعبير عربي مفهوم يدل على بروز معماري، مع إبقاء البدائل في الحاشية حفاظًا على الغموض الحقيقي.
