  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: ar
  text: 'فتقدَّم إليه المجرِّب وقال له: «إن كنتَ ابنَ الله[a]، فقُلْ أن تصير هذه الحجارة أرغفةَ خبزٍ.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قد تأتي صيغة الشرط اليونانية هنا بمعنى التحدي، لا للتعبير عن شك بسيط؛ ويمكن أن يُفهم الكلام: «بما أنك ابن الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم إليه
  rationale: ينقل معنى الاقتراب من يسوع بوضوح، مع وصل اسم الفاعل اليوناني بالفعل الرئيس ربطًا طبيعيًّا في العربية.
- source_word: ὁ πειράζων
  choice: المجرِّب
  rationale: اسم فاعل مستعمل استعمال الاسم، ويصف من يجرّب يسوع في هذا السياق من غير تحويل المعنى إلى مجرد الاختبار المحايد.
- source_word: εἶπεν αὐτῷ
  choice: وقال له
  rationale: مقابل عربي مباشر وطبيعي للفعل مع المفعول غير المباشر.
- source_word: Εἰ
  choice: إن
  rationale: تحفظ صيغة الشرط وقوة التحدي، من غير الجزم بأن المتكلم يشك أو يسلّم بصحة القول.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ابن الله
  rationale: تعبير لقبي معرَّف بالإضافة في العربية، يطابق الاستعمال السياقي ولا يفيد فردًا غير معيّن من فئة.
- source_word: εἰπὲ
  choice: قُل
  rationale: يحافظ على المعنى المباشر لفعل القول، فيما تبيّن جملة المضمون التالية قوته الإنجازية من غير إدخال لفظ «أمُر» غير الصريح في الأصل.
- source_word: ἵνα
  choice: أن
  rationale: تدخل طبيعيًّا في العربية على مضمون القول والنتيجة المقصودة بعد فعل الأمر.
- source_word: οἱ λίθοι οὗτοι
  choice: هذه الحجارة
  rationale: ينقل الاسم والإشارة بعبارة عربية واضحة وطبيعية.
- source_word: ἄρτοι
  choice: أرغفة خبز
  rationale: يحفظ صيغة الجمع في اليونانية بوضوح، بخلاف «خبز» التي قد تُفهم اسم جنس مفردًا.
- source_word: γένωνται
  choice: تصير
  rationale: ينقل معنى التحول أو الصيرورة بصورة موجزة ومحايدة.
theological_decisions:
- issue: دلالة الشرط في Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: إن كنتَ ابنَ الله
  alternative: بما أنك ابن الله؛ إن كنت حقًّا ابن الله
  rationale: تبقي الصياغة العربية الشرط على ظاهره، مع عدم حسم ما إذا كان يفيد الشك أو التحدي المبني على افتراض صحة اللقب.
- issue: لقب υἱὸς τοῦ θεοῦ
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: الإضافة في العربية تعبّر طبيعيًّا عن اللقب المحدد في سياق متى، ولا تحوّله إلى عضوية عامة غير معيّنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صيغة الشرط وما فيها من توتر دلالي، كما حُفظ جمع «أرغفة» الوارد في الأصل اليوناني.
