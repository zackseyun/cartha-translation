  to: الشعب الجالس في الظلمة رأى نورًا عظيمًا، وعلى الجالسين في أرضٍ وفي ظلِّ الموت[أ] أشرق عليهم نور.
  rationale: استُبدلت «أرض الموت وظلِّه» بـ«أرضٍ وفي ظلِّ الموت» لأن العطف اليوناني يفصل بين «الأرض/المنطقة» و«ظل الموت». وحُوّلت الحاشية من بديل نحوي يعالج خلل المتن إلى ملاحظة معجمية متسقة مع أثر التدقيق الإنجليزي. لا يحدد النص المنقح طبيعة الظلمة أو هوية النور تفسيرًا.
