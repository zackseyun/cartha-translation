base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: ar
  text: الشعب الجالس في الظلمة رأى نورًا عظيمًا، وعلى الجالسين في أرضٍ وفي ظلِّ الموت[أ] أشرق عليهم نور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «الظلمة العميقة». أبقينا «ظلّ الموت» لأن النص اليوناني يذكر «الموت» صراحةً ويحفظ صورة كتابية مألوفة.'
    reason: بديل معجمي للصورة، مع بيان سبب إبقاء الصياغة الأقرب إلى اليونانية في المتن.
lexical_decisions:
- source_word: λαὸς
  choice: الشعب
  rationale: مقابل عربي طبيعي لاسم جماعي يدل على الناس، من غير حصر المعنى في كيان سياسي حديث.
- source_word: καθήμενος / καθημένοις
  choice: الجالس / الجالسين
  rationale: يحفظ المعنى الحرفي والصورة النبوية والتوازي بين شطري الآية، بدل تفسيره بالسكن أو العيش.
- source_word: σκοτίᾳ
  choice: الظلمة
  rationale: يحفظ المجال الحرفي والمجازي للكلمة من غير قصرها على معنى روحي أو أخلاقي بعينه.
- source_word: φῶς εἶδεν μέγα
  choice: رأى نورًا عظيمًا
  rationale: صياغة عربية واضحة تحافظ على الفعل الماضي وعلى وصف النور بالعظمة.
- source_word: χώρᾳ
  choice: أرض
  rationale: تلائم الصورة النبوية والمكانية، ولا توحي بدولة حديثة كما قد يفعل لفظ «بلد».
- source_word: σκιᾷ θανάτου
  choice: ظلِّ الموت
  rationale: يحفظ ذكر الموت الصريح في اليونانية والصورة الكتابية المألوفة، من غير اختزالها إلى «ظلام دامس».
- source_word: ἀνέτειλεν
  choice: أشرق
  rationale: ينقل صورة طلوع النور بعبارة عربية طبيعية، مع إبقاء النور فاعلًا للفعل.
- source_word: αὐτοῖς
  choice: على الجالسين
  rationale: أُدي معنى الداتيف في تركيب عربي طبيعي مع «أشرق على»، مع التصريح بمتلقي النور من سياق العبارة.
theological_decisions:
- issue: طبيعة صورة الظلمة والنور
  choice: الإبقاء على الصورة من غير تحديد الظلمة بأنها خطية أو جهل أو قهر، ومن غير التصريح بهوية النور داخل هذه العبارة.
  alternative: تفسير الظلمة صراحةً بأنها الخطية أو جهل الأمم، أو تفسير النور صراحةً بأنه إعلان الخلاص بالمسيح.
  rationale: النص اليوناني يورد صورة نبوية غنية ولا يحصر دلالتها في هذا الموضع؛ لذا تحفظ الترجمة سعتها وتوترها اللاهوتي.
- issue: العلاقة بين الأرض والموت والظل
  choice: «أرض الموت وظلِّه»
  alternative: «أرض وظل الموت»
  rationale: تركيب καὶ بين χώρᾳ وσκιᾷ يجعل «أرض الموت وظله» قراءة نحوية طبيعية تحافظ على العطف وعلى إضافة كل من الأرض والظل إلى الموت، بينما يظل البديل ممكنًا بوصفه صياغة أكثر تقليدية.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تكرار صورة الجلوس والتوازي الشعري، وتُجنبت التفسيرات العقائدية المضافة.
