  text: And they immediately left the nets and followed him.
translation:
  language: ar
  text: فتركا الشباك في الحال وتبعاه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تواصل السرد وتفيد التعاقب هنا من غير إبراز مقابلة ليست مقصودة.
- source_word: εὐθέως
  choice: في الحال
  rationale: تعبير عربي واضح وطبيعي يحفظ معنى الاستجابة الفورية.
- source_word: ἀφέντες
  choice: تركا
  rationale: اسم الفاعل اليوناني السابق للفعل الرئيس يدل على أنهما تركا الشباك ثم تبعاه؛ والعطف بالفعلين هو الصياغة العربية السردية الطبيعية.
- source_word: τὰ δίκτυα
  choice: الشباك
  rationale: يحافظ على أداة التعريف ولا يضيف «شباكهما» أو «شباك الصيد»، إذ يتضح المقصود من السياق.
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعاه
  rationale: المثنى مستفاد من سياق الفاعل، والضمير يعود إلى يسوع. ويحفظ الفعل معنى السير وراءه ومعنى الارتباط به كتلميذين.
theological_decisions:
- issue: دلالة التلمذة في ἠκολούθησαν αὐτῷ
  choice: تبعاه
  alternative: سارا وراءه
  rationale: «تبعاه» تحتمل الاتباع المكاني والالتحاق به كتلميذين، فتحفظ الاتساع السردي واللاهوتي من غير زيادة تفسيرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، بصياغة سردية طبيعية. استُعمل المثنى لأن الفاعلين في السياق هما سمعان وأندراوس.
