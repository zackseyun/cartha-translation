reference: Matthew 4:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: ar
  text: 'ثم تقدَّم من هناك، فرأى أخوين آخرين: يعقوب بن زبدي، ويوحنا أخاه، في القارب مع أبيهما زبدي، وهما يصلحان شباكهما، فدعاهما.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: تقدَّم من هناك
  rationale: يفيد الفعل المضيّ إلى موضع أبعد، والعبارة عربية طبيعية تحفظ معنى استمرار الحركة من المكان السابق.
- source_word: εἶδεν
  choice: رأى
  rationale: ينقل المعنى السردي البسيط للفعل من غير تقوية إلى «لاحظ» أو غيرها.
- source_word: ἄλλους δύο ἀδελφούς
  choice: أخوين آخرين
  rationale: يحفظ العدد وكونهما أخوين إضافيين بعد الأخوين المذكورين سابقًا.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: يعقوب بن زبدي
  rationale: التركيب اليوناني يعرّف يعقوب بنسبه إلى زبدي، وصيغة «بن» هي الأوجز والأفصح عربيًا.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: يوحنا أخاه
  rationale: يبيّن أن يوحنا أخو يعقوب، مع الحفاظ على الإيجاز والبنية السردية.
- source_word: ἐν τῷ πλοίῳ
  choice: في القارب
  rationale: السياق سياق صيد، و«القارب» أنسب من «السفينة» التي قد توحي بمركب أكبر.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: مع أبيهما زبدي
  rationale: يحفظ معنى المصاحبة ويصوغ علاقة الأبوة بوضوح طبيعي في العربية.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: وهما يصلحان شباكهما
  rationale: في سياق الصيد يدل الفعل على جعل الشباك صالحة للاستعمال، و«يصلحان» واضحة وتشمل ترميمها وتجهيزها.
- source_word: ἐκάλεσεν αὐτούς
  choice: فدعاهما
  rationale: يحفظ فعل الدعوة كما ورد من غير إضافة الغاية التي يوضحها السياق، كما تلائم التثنية العربية المرجع.
theological_decisions:
- issue: مدلول ἐκάλεσεν في سياق التلمذة
  choice: فدعاهما
  alternative: فدعاهما إلى اتباعه
  rationale: السياق يدل على دعوة إلى التلمذة، لكن الآية نفسها لا تصرّح بعبارة «إلى اتباعه»، لذلك تُترك الدلالة للسياق ولا تُزاد في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعملت صيغ التثنية الطبيعية «أبيهما، وهما يصلحان، شباكهما، دعاهما»، مع إبقاء الجملة متدفقة وتجنّب التفسير الزائد.
