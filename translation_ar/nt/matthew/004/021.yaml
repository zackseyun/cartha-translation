  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: المضي من الموضع السابق، رؤية أخوين آخرين، تعريف يعقوب بأنه ابن زبدي ويوحنا بأنه أخوه، وجودهما في القارب مع أبيهما، إصلاح الشباك، ثم دعوته لهما. وتحافظ صيغ التثنية على مرجع الضمائر في النص اليوناني.'
  naturalness: الصياغة فصيحة حديثة وسلسة. وتركيب «يعقوب بن زبدي، ويوحنا أخاه» طبيعي في السرد العربي، كما أن «وهما يصلحان شباكهما» واضح ومترابط.
  terminology: الأسماء المستعملة («يعقوب»، «يوحنا»، «زبدي») ملائمة للاستعمال العربي الكتابي. و«القارب» مناسب لسياق الصيد، و«يصلحان شباكهما» يؤدي معنى καταρτίζοντας دون توسيع تفسيري. و«فدعاهما» يحفظ بساطة ἐκάλεσεν αὐτούς ولا يضيف مضمون «اتباعه».
