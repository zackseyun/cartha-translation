id: MAT.4.6
reference: Matthew 4:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: ar
  text: 'وقال له: «إن كنت ابن الله، فألقِ بنفسك إلى أسفل[a]، لأنه مكتوب: ‹سيوصي ملائكته بك›، و‹على أيديهم يرفعونك[b]، لئلا تصدم قدمك بحجر›».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر تقليدية: «فاطرح نفسك إلى أسفل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يحملونك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: وقال
  rationale: المضارع اليوناني هنا مضارع تاريخي في سياق سردي، والماضي هو الأسلوب الطبيعي الواضح في العربية.
- source_word: Εἰ
  choice: إن كنت
  rationale: تحافظ «إن» على صيغة التحدي الشرطي من غير أن تحسمها بمعنى «بما أنك».
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ابن الله
  rationale: الإضافة العربية تؤدي التعبير اللقبي المحدد طبيعيًا في سياق متى، من غير إدخال شرح عقائدي في المتن.
- source_word: βάλε σεαυτὸν κάτω
  choice: فألقِ بنفسك إلى أسفل
  rationale: تعبير عربي حديث وواضح ينقل فعل الأمر وصيغته الانعكاسية واتجاه الحركة.
- source_word: γέγραπται
  choice: مكتوب
  rationale: الصيغة العربية المألوفة للاقتباس من الكتاب، وتحافظ على دلالة كون النص مكتوبًا وثابتًا.
- source_word: ἐντελεῖται
  choice: سيوصي
  rationale: تنقل معنى إصدار أمر أو تكليف ذي سلطان، وتلائم تركيب «يوصي ملائكته بك» في العربية.
- source_word: περὶ σοῦ
  choice: بك
  rationale: الباء مع «يوصي» هي الصياغة العربية الطبيعية لمعنى الوصية المتعلقة بالشخص والموجَّهة من أجله.
- source_word: ἐπὶ χειρῶν
  choice: على أيديهم
  rationale: تحافظ على صورة الإسناد والحمل الواردة في اليونانية.
- source_word: ἀροῦσίν σε
  choice: يرفعونك
  rationale: تنقل معنى الرفع بوضوح، مع إبقاء معنى الحمل الممكن في حاشية.
- source_word: μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: لئلا تصدم قدمك بحجر
  rationale: «لئلا» تنقل معنى الوقاية في μήποτε، و«تصدم قدمك بحجر» تعبّر بدقة وطبيعية عن الاصطدام المقصود، مع الحفاظ على إفراد القدم والحجر.
theological_decisions:
- issue: القوة المسيحانية لعبارة «ابن الله» في تحدي المجرِّب
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: في سياق متى تؤدي العبارة لقبًا معروفًا، والإضافة «ابن الله» هي المقابل العربي الطبيعي من غير إضافة مضمون عقائدي غير مصرَّح به في الآية.
- issue: دلالة أداة الشرط في قول المجرِّب
  choice: إن كنت
  alternative: بما أنك
  rationale: تحافظ صيغة الشرط على قوة الاختبار والتحدي وعلى ما في العبارة من توتر، من غير تحويلها إلى إقرار صريح.
- issue: استشهاد المجرِّب بالمزمور
  choice: إيراد الاقتباس كما نطق به ضمن كلامه
  alternative: إضافة تصحيح أو تعليق تفسيري داخل المتن
  rationale: النص يعرض المجرِّب مقتبسًا من الكتاب؛ لذلك لا ينبغي للترجمة أن تحسم دلالة استعماله بإقحام تفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُخدمت «وقال» للسرد الطبيعي، و«إن كنت» لصون الشرط، وعلامات اقتباس داخلية لتمييز نص المزمور ضمن كلام المتحدث. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما مباشرة.
