  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: ar
  text: فتركا في الحال القارب وأباهما وتبعاه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فورًا».'
    reason: بديل معجمي لـ εὐθέως يحفظ معنى الفورية.
lexical_decisions:
- source_word: οἱ δὲ
  choice: فـ
  rationale: الأداة δέ رابطة سردية خفيفة، والضمير المستتر في الفعلين يدل على الأخوين المذكورين سابقًا؛ والفاء تنقل السرد طبيعيًا من الدعوة إلى الاستجابة من غير مبالغة في معنى المقابلة.
- source_word: εὐθέως
  choice: في الحال
  rationale: تؤدي معنى السرعة والفورية بعبارة عربية فصيحة واضحة، وتحافظ على الإلحاح السردي في متى.
- source_word: ἀφέντες
  choice: تركا
  rationale: 'اسم الفاعل الأوريستي يدل على فعل سابق للفعل الرئيس: تركا أولًا ثم تبعا. وصيغة الفعل المنسوق طبيعية في العربية ولا توحي بالضرورة بهجر دائم.'
- source_word: τὸ πλοῖον
  choice: القارب
  rationale: السياق سياق صيد، و«القارب» أدق وأشيع من «السفينة» لمثل هذا المركب.
- source_word: τὸν πατέρα αὐτῶν
  choice: أباهما
  rationale: ضمير التثنية يوضح أن الحديث عن الأخوين، ويحفظ بوضوح كلفة الاستجابة العائلية.
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعاه
  rationale: يحفظ الفعل معنى السير وراء يسوع ومعنى التلمذة في سياق الأناجيل، مع التعبير العربي الطبيعي بضمير المفعول.
theological_decisions:
- issue: استجابة التلمذة والانفصال عن الأب
  choice: صياغة مباشرة تفيد أنهما تركا القارب وأباهما فورًا ليتبعا يسوع، من دون الجزم بأن الترك كان هجرًا دائمًا.
  alternative: «هجرا أباهما» بما قد يفيد قطيعة دائمة، أو صياغة تخفف الحدث إلى ابتعاد مؤقت.
  rationale: النص يشدد على فورية الاستجابة وحسمها، لكن ἀφέντες لا يقتضي بذاته تفسير الترك على أنه هجر نهائي؛ لذلك تحافظ «تركا» على قوة الرواية من غير تحميلها معنى زائدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة. استُخدمت صيغة التثنية في «تركا» و«أباهما» و«تبعاه» لإبقاء مرجع الأخوين صريحًا وطبيعيًا، ووُضعت علامة الحاشية بعد الجملة.
