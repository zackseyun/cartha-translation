  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: ar
  text: 'فأجاب يسوع وقال: «أنتما لا تعرفان ما تطلبان. هل تقدران أن تشربا الكأس[a] التي أنا مقبل على شربها؟» فقالا له: «نقدر».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تُستعمل «الكأس» في الكتاب المقدس مجازًا للنصيب المعيَّن للإنسان، ولا سيما للألم. ويمكن توضيح العبارة: «كأس الألم التي أنا مقبل على شربها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: فأجاب يسوع وقال
  rationale: تمثل الصيغة السردية اليونانية بالفعلين، وتؤدي الفاء معنى δέ بوصفها انتقالًا واستجابة في السياق دون مبالغة في إبراز التعارض.
- source_word: Οὐκ οἴδατε
  choice: أنتما لا تعرفان
  rationale: يحافظ «تعرفان» على الدلالة المباشرة لـ οἴδατε دون تحويلها تفسيريًا إلى «تفهمان»، وصيغة المثنى تلائم المخاطبَين في السياق.
- source_word: τί αἰτεῖσθε
  choice: ما تطلبان
  rationale: صياغة عربية طبيعية ودقيقة لطلبهما الجاري، مع إبقاء مضمون الطلب مفتوحًا كما في اليونانية.
- source_word: δύνασθε
  choice: هل تقدران
  rationale: ينقل معنى القدرة بوضوح، ويحافظ على مخاطبة الاثنين.
- source_word: τὸ ποτήριον
  choice: الكأس
  rationale: يحفظ الاستعارة الكتابية بدل تفسيرها في المتن بأنها الألم أو الموت.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: التي أنا مزمع أن أشربها
  rationale: «مزمع» تنقل توجه الفعل إلى المستقبل وقربه أو قصده، مع الحفاظ على صورة الشرب.
- source_word: λέγουσιν αὐτῷ
  choice: فقالا له
  rationale: حُوّل المضارع التاريخي إلى ماضٍ عربي طبيعي، واستُعمل المثنى لأن المتكلمين اثنان.
- source_word: Δυνάμεθα
  choice: نقدر
  rationale: يحافظ على الصلة اللفظية الواضحة بالسؤال السابق عن القدرة، في جواب عربي موجز وطبيعي.
theological_decisions:
- issue: الدلالة المجازية للكأس
  choice: إبقاء «الكأس» في المتن دون تفسيرها
  alternative: كأس الألم التي أنا مزمع أن أشربها / الألم الذي أنا مقبل عليه
  rationale: الصورة المجازية مقصودة وتحمل معنى النصيب المعيّن، ولا سيما الألم الوشيك، لكن تفسيرها داخل المتن يحصر دلالتها ويزيل شيئًا من توترها اللاهوتي والسردي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى صراحةً لأن يسوع يخاطب الأخوين، وحُفظت الصيغة المجازية «الكأس». وُضع مؤشر الحاشية بعد الآية كاملة كيلا يقطع السؤال والجواب.
