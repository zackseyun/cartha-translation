base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: ar
  text: ويُسَلِّمونه إلى الأمم ليسخروا به ويجلدوه ويصلبوه، وفي اليوم الثالث سيُبعث.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيقوم». الفعل اليوناني مبني للمجهول («سيُبعث»)، وهو تعبير شائع عن القيامة قد يُفهم منه أن الله هو الفاعل.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: يُسَلِّمونه
  rationale: ينقل معنى تسليمه إلى سلطة آخرين، من غير حصره في معنى الخيانة.
- source_word: τοῖς ἔθνεσιν
  choice: إلى الأمم
  rationale: تعبير كتابي واضح في السياق عن غير اليهود، مع الحفاظ على الصيغة اليونانية المألوفة.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: ليسخروا به
  rationale: يعبّر بوضوح عن الغرض، ويجعل المفعول به مفهومًا طبيعيًا في العربية.
- source_word: μαστιγῶσαι
  choice: ويجلدوه
  rationale: لفظ عربي معاصر ودقيق للعقوبة البدنية القضائية المقصودة.
- source_word: σταυρῶσαι
  choice: ويصلبوه
  rationale: ينقل الفعل المباشر «يصلب» ويصرّح بالضمير الذي تشترك فيه الأفعال المنسقة، وفق مقتضى العربية.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: وفي اليوم الثالث
  rationale: صياغة عربية طبيعية تحفظ الدلالة الزمنية للنص.
- source_word: ἐγερθήσεται
  choice: سيُقام
  rationale: يحفظ المبني للمجهول في اليونانية وإيحاء الفعل الإلهي، من غير استبعاد صياغة «سيقوم» الممكنة دلاليًا.
theological_decisions:
- issue: صيغة فعل القيامة
  choice: سيُقام
  alternative: سيقوم
  rationale: النص اليوناني يستعمل صيغة المستقبل المبني للمجهول؛ لذلك حُفظت الصيغة بما تتيحه من إشارة ضمنية إلى فعل الله، من غير حسم كل أبعاد الفاعلية اللاهوتية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت أفعال متوازية متتابعة، وأُبقي «الأمم» بوصفه المصطلح الكتابي السياقي لغير اليهود. وُضعت علامة الحاشية بعد عبارة القيامة لأنها تتعلق بفعل ἐγερθήσεται.
