lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: لا يَكُنِ الأمرُ هكذا بينكم
  rationale: يحافظ أسلوب النهي العربي على القوة المعيارية والاستشرافية للمستقبل ἔσται، ويجعل العبارة طبيعية وواضحة، بدل تسطيحها إلى مجرد وصف للحال.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: بل مَن أراد
  rationale: «مَن» تفيد العموم الموافق للتركيب اليوناني غير المحدد، و«أراد» تنقل معنى المشيئة بعبارة عربية طبيعية.
- source_word: μέγας γενέσθαι
  choice: أن يصير عظيمًا
  rationale: «يصير» تحفظ الدلالة الانتقالية للفعل γενέσθαι، فلا تجعله مجرد حالة ثابتة.
- source_word: διάκονος
  choice: خادمًا
  rationale: يدل اللفظ هنا على مَن يخدم؛ و«خادم» واضحة سياقيًا ولا توحي بالضرورة بمنصب كنسي لاحق كما قد يفعل «شمّاس».
- source_word: ὑμῶν
  choice: لكم
  rationale: تنقل اللام علاقة الخدمة المقصودة في التعبير «خادمًا لكم» بصياغة عربية سليمة.
theological_decisions:
- issue: طبيعة العظمة في جماعة أتباع يسوع
  choice: صياغة القول بوصفه قلبًا معياريًا لمفهوم السلطة الدنيوية، مع الإبقاء على لغة الخدمة المحسوسة
  alternative: فهم διάκονος بوصفه منصب «شمّاس»، أو اختزال العبارة إلى دعوة عامة للتواضع
  rationale: السياق يقابل تسلّط حكام الأمم بمعيار يسوع لتلاميذه؛ لذلك تحفظ الترجمة صورة الخادم من غير استيراد بنية كنسية لاحقة أو تذويبها في معنى تجريدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «لا يكن» لإبراز القوة المعيارية للمستقبل اليوناني، و«خادم» لتجنب الإيحاء بمنصب كنسي تقني.
