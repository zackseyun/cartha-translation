  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: ar
  text: 'فقال لهم: «اذهبوا أنتم أيضًا إلى الكرم، وسأعطيكم ما هو عادل[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حق» أو «منصف».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: لهم
  rationale: ضمير الإشارة في صيغة المجرور بالجمع يعود إلى العمال المذكورين في السياق، والضمير العربي هو التعبير الطبيعي الكافي.
- source_word: εἶπεν
  choice: فقال
  rationale: ينقل فعل القول السردي بصيغة عربية طبيعية، مع ربطه بما قبله بواسطة الفاء.
- source_word: Ὑπάγετε
  choice: اذهبوا
  rationale: أمر للجمع يدل هنا ببساطة على التوجه إلى الكرم.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: يحفظ توكيد الضمير ومعنى شمول هؤلاء مع من سبقهم.
- source_word: ἀμπελῶνα
  choice: الكرم
  rationale: المقابل العربي المألوف لحقل العنب، وهو ملائم لسياق المثل.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ما هو عادل
  rationale: يحفظ المعنى الأخلاقي الواسع للفظ δίκαιον، من غير قصره على الاستحقاق القانوني أو على الإنصاف الذاتي.
- source_word: δώσω ὑμῖν
  choice: سأعطيكم
  rationale: يحافظ على المعنى الأساسي للفعل، «أعطي»، بدل إدخال فعل «أدفع» الذي يفهم من السياق لكنه غير مصرح به في اليونانية.
theological_decisions:
- issue: دلالة δίκαιον في سياق تحديد أجرة العمال
  choice: عادل
  alternative: حق أو منصف
  rationale: «عادل» يحفظ بوضوح بُعد العدل والاستقامة في وعد صاحب الكرم، من غير تحويل العبارة إلى مصطلح قانوني ضيق أو حسمها بمعيار شخصي للإنصاف.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الكرم» بوصفه اللفظ العربي المألوف لحقل العنب، وحُفظ توكيد «أنتم أيضًا» وبنية الوعد المستقبلية.
