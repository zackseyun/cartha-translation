source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ar
  text: 'وإذا أعميان جالسان بجانب الطريق، فلما سمعا أن يسوع مارّ، صرخا قائلين: «يا رب، ارحمنا، يا ابن داود!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: تؤدي وظيفة أداة لفت الانتباه السردية بصياغة عربية فصيحة وطبيعية، وتحافظ على عنصر المفاجأة والمشهد الحي.
- source_word: δύο τυφλοὶ
  choice: أعميان
  rationale: صيغة المثنى المذكر تنقل بدقة أن المذكورين رجلان اثنان، ويُفهم العدد من صيغة المثنى من غير حاجة إلى إثقال العبارة بقول «رجلان أعميان».
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: جالسان بجانب الطريق
  rationale: ترجمة واضحة تحافظ على الهيئة والموقع المكاني اللذين تصفهما العبارة اليونانية.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: فلما سمعا أن يسوع مارّ
  rationale: تجعل اسم الفاعل الماضي ظرفًا زمنيًا كما يقتضي السياق، وتنقل παράγει بعبارة عربية موجزة وطبيعية.
- source_word: ἔκραξαν
  choice: صرخا
  rationale: تحافظ على شدة النداء التي يحملها الفعل κράζω، مع مراعاة المثنى.
- source_word: Κύριε
  choice: يا رب
  rationale: تحفظ قوة الخطاب التوقيرية واحتماله المسياني، ولا تختزله في معنى المخاطبة المهذبة مثل «يا سيدي».
- source_word: ἐλέησον ἡμᾶς
  choice: ارحمنا
  rationale: المقابل العربي المباشر والطبيعي لطلب الرحمة والمعونة.
- source_word: υἱὸς Δαυίδ
  choice: يا ابن داود
  rationale: تحفظ اللقب الداودي بصورته المعروفة وما يحمله في متى من دلالة مسيانية، بدل تحويله إلى وصف نسبي مفسِّر.
theological_decisions:
- issue: دلالة Κύριε في خطاب يسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: اقتران النداء بلقب «ابن داود» يمنحه وزنًا توقيريًا ومسيانيًا؛ و«يا رب» يحفظ هذا المجال الدلالي من غير أن يحسم وحده كل أبعاده اللاهوتية.
- issue: القوة المسيانية لعبارة υἱὸς Δαυίδ
  choice: يا ابن داود
  alternative: يا نسل داود
  rationale: الصيغة الحرفية تحفظ العبارة كلقب مسياني بارز في إنجيل متى، بينما قد تجعلها «نسل داود» مجرد بيان للنسب.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية موقرة. استُخدم المثنى في الأفعال والأوصاف مراعاةً لبنية العربية، وأضيفت أداة النداء قبل «ابن داود» لتوضيح أن اللقب منادى ثانٍ في صياغة عربية طبيعية.
