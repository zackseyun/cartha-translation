- from: فلما جاء الذين عملوا أولًا[a]، ظنوا أنهم سينالون أكثر، لكنهم هم أيضًا نالوا دينارًا لكل واحد[b].
  to: فلما جاء الأوّلون[a]، ظنوا أنهم سينالون أكثر، ونالوا هم أيضًا دينارًا لكل واحد[b].
  rationale: حُذفت أداة الاستدراك غير الموجودة في الأصل، واستُعيدت عبارة «الأوّلون» الأقرب إلى οἱ πρῶτοι مع إبقاء التفسير السياقي في الحاشية. كما حُفظت دلالة التوزيع في «دينارًا لكل واحد» والتوكيد في «هم أيضًا».
