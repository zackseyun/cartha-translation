source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: ar
  text: فلما جاء الأوّلون[a]، ظنوا أنهم سينالون أكثر، ونالوا هم أيضًا دينارًا لكل واحد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي العمال الذين استأجرهم صاحب الكرم أولًا في المثل.
    reason: lexical_alternative
  - marker: b
    text: كان الدينار أجرة يوم معتادة للعامل.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: فلما جاء
  rationale: اسم الفاعل الماضي يؤدي معنى زمنيًا؛ وصيغة «فلما جاء» تنقل تتابع الحدث طبيعيًا.
- source_word: οἱ πρῶτοι
  choice: الذين عملوا أولًا
  rationale: المقصود جماعة العمال الذين استؤجروا أولًا في المثل، وإضافة «عملوا» توضح المرجع من السياق دون تحويل العبارة إلى رتبة مجردة.
- source_word: ἐνόμισαν
  choice: ظنوا
  rationale: تفيد توقعًا أو افتراضًا، و«ظنوا» تعبير عربي واضح لا يوحي باليقين.
- source_word: πλεῖον
  choice: أكثر
  rationale: تنقل بإيجاز معنى المقدار الأكبر من الأجرة.
- source_word: λήμψονται
  choice: سينالون
  rationale: المستقبل في الكلام غير المباشر يعبر عن توقعهم في تلك اللحظة؛ و«سينالون» يحافظ على هذا المنظور.
- source_word: τὸ ἀνὰ δηνάριον
  choice: دينارًا لكل واحد
  rationale: تفيد ἀνά معنى التوزيع، أي دينارًا واحدًا لكل عامل، مع بقاء اسم العملة التاريخية.
- source_word: καὶ αὐτοί
  choice: لكنهم هم أيضًا
  rationale: تحفظ العبارة توكيد المفاجأة في مساواتهم بغيرهم في الأجرة؛ واستُعملت «لكن» لإظهار المفارقة التي يقتضيها السياق.
theological_decisions: []
