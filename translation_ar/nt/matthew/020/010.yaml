review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، لكن «لكنهم» لا يقابل أداة العطف اليونانية καί، التي تصل الحدثين من غير تصريح بأداة استدراك. كما أن «الذين عملوا أولًا» يضيف فعل «عملوا» إلى العبارة اليونانية «الأوّلون»، وإن كان مرجعها معلومًا من سياق المثل.
  naturalness: الصياغة المقترحة فصيحة معاصرة وطبيعية. «فلما جاء الأوّلون» تحافظ على إيجاز الأصل، وتوضح الحاشية أن المقصود العمال الذين استُؤجروا أولًا. «دينارًا لكل واحد» سليمة وواضحة.
  terminology: «دينار» مناسب للاسم النقدي التاريخي. و«ظنوا» و«سينالون» و«هم أيضًا» تنقل بدقة التوقع والتوكيد في الأصل. عُدّلت صياغة الحاشية الثقافية إلى تعبير عربي أكثر سلاسة.
  issues:
  - severity: medium
    issue: استعمال «لكنهم» بدل العطف
    rationale: النص اليوناني يقول καὶ ἔλαβον («ونالوا/وأخذوا») ولا يستعمل أداة مقابلة لـ«لكن». وجود مفارقة في السياق لا يبرر إدخال الاستدراك في المتن.
  - severity: low
    issue: إضافة «عملوا» في «الذين عملوا أولًا»
    rationale: οἱ πρῶτοι تعني حرفيًا «الأوّلون/الأوائل»؛ والمرجع هم العمال المستأجرون أولًا بحسب السياق. يمكن بيان ذلك في الحاشية من دون إضافته إلى المتن.
  revised_text: فلما جاء الأوّلون[a]، ظنوا أنهم سينالون أكثر، ونالوا هم أيضًا دينارًا لكل واحد[b].
  revised_footnotes:
