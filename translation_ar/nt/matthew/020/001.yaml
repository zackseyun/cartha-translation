  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ar
  text: فَإِنَّ مَلَكُوتَ السَّمَاوَاتِ يُشْبِهُ رَجُلًا، صَاحِبَ بَيْتٍ، خَرَجَ فِي الصَّبَاحِ الْبَاكِرِ لِيَسْتَأْجِرَ عُمَّالًا لِلْعَمَلِ فِي كَرْمِهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: مَلَكُوتَ السَّمَاوَاتِ
  rationale: تعبير عربي كتابي واضح يحافظ على صيغة الجمع في «السماوات» وعلى المعنى الملكي للمصطلح اليوناني.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: رَجُلًا رَبَّ بَيْتٍ
  rationale: يحافظ على وجود ἀνθρώπῳ «رجل» وعلى وصفه بأنه رب بيت، من غير دمج العنصرين أو حذف أحدهما.
- source_word: ἅμα πρωῒ
  choice: فِي الصَّبَاحِ الْبَاكِرِ
  rationale: صياغة عربية طبيعية تؤدي معنى الخروج باكرًا عند أول الصباح.
- source_word: μισθώσασθαι ἐργάτας
  choice: لِيَسْتَأْجِرَ عُمَّالًا
  rationale: ينقل بوضوح قصد صاحب البيت من الخروج، أي تشغيل عمال بأجر.
- source_word: ἀμπελῶνα
  choice: كَرْمِهِ
  rationale: «الكرم» هو اللفظ العربي المألوف لحقل العنب، والضمير ينقل αὐτοῦ.
theological_decisions:
- issue: نطاق التشبيه في عبارة «يشبه ملكوت السماوات رجلًا»
  choice: الإبقاء على البنية التي تجعل الرجل محور التشبيه لفظيًا
  alternative: «مثل ملكوت السماوات كمثل صاحب بيت»
  rationale: النص اليوناني يصرح بـἀνθρώπῳ ثم يصفه بـοἰκοδεσπότῃ؛ لذلك حُفظ «رجلًا» بدل اختزاله إلى لقب وظيفي وحده، من غير تفسير لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، مع ضبط كامل للنص القصير. استُعمل «رب بيت» للمحافظة على البنية المصدرية، و«كرم» بوصفه اللفظ الطبيعي لحقل العنب.
