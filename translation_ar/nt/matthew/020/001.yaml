    rationale: النص اليوناني يذكر «إنسانًا/رجلًا» ثم يصفه بـοἰκοδεσπότῃ. في العربية الحديثة، «رجلًا، صاحبَ بيتٍ» يحفظ هذا الترتيب ويجعل الوصف مفهومًا وسليمًا.
  - severity: low
    issue: ربط استئجار العمّال بالكرم يحتاج إلى بيان الوظيفة بصورة أيسر.
    rationale: إضافة «للعمل في كرمه» توضّح دلالة εἰς τὸν ἀμπελῶνα في السياق، من غير إضافة معنى يتجاوز المقصود.
