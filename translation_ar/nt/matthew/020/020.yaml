  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: ar
  text: حينئذٍ تقدمت إليه أمُّ ابني زبدي مع ابنيها، وهي ساجدة له[a] وطالبة منه شيئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني أيضًا: «منحنية أمامه» أو «عابدة له»؛ فالفعل اليوناني قد يدل على السجود توقيرًا، أو تقديم الإجلال، أو العبادة، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: أداة ربط زمنية تنقل السرد إلى الحدث التالي، وهذه الصياغة فصيحة وواضحة.
- source_word: προσῆλθεν αὐτῷ
  choice: جاءت إليه
  rationale: تفيد الاقتراب من شخص، و«جاءت إليه» عربية طبيعية تحفظ اتجاه الحركة.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: أمُّ ابني زبدي
  rationale: المثنى طبيعي في العربية لأن المقصود ابنان، ويحفظ التركيب علاقة الأم بابني زبدي دون إضافة أسماء غير واردة في النص.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: مع ابنيها
  rationale: μετά مع المضاف إليه تدل على المصاحبة، والمثنى يوافق الإشارة إلى ابني زبدي.
- source_word: προσκυνοῦσα
  choice: سجدت له
  rationale: الفعل يدل على الانحناء أو السجود تعظيمًا، وقد يدل بحسب السياق على العبادة. «سجدت له» يحفظ الفعل الجسدي ودلالة التوقير من غير أن يحسم وحده طبيعة هذا السجود.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: وطلبت منه شيئًا
  rationale: يحفظ معنى الطلب، ويفيد παρά مع المضاف إليه أن المطلوب صادر منه، بينما تنقل «شيئًا» عدم تعيين الطلب في هذه الآية.
theological_decisions:
- issue: دلالة προσκυνοῦσα في علاقتها بيسوع
  choice: سجدت له
  alternative: انحنت أمامه؛ عبدته
  rationale: يمكن أن يدل الفعل اليوناني على السجود توقيرًا أو على العبادة بحسب السياق. اختيرت عبارة تصف فعل السجود وتبقي دلالته اللاهوتية مفتوحة، مع بيان مجال المعنى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم المثنى «ابني» الملائم للعربية، مع الإبقاء على الغموض الدلالي المقصود في فعل السجود بواسطة الحاشية.
