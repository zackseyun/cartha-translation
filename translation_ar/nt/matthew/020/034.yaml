  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: ar
  text: فتحنَّن يسوع ولمس أعينهما، فأبصرا في الحال[a] وتبعاه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «فعاد إليهما بصرهما». وقد يعني الفعل اليوناني حرفيًا «رفعا نظرهما»، لكنه يدل في هذا السياق على حصولهما على البصر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: فتحنَّن
  rationale: ينقل معنى الشفقة العميقة بصياغة عربية موجزة وكريمة، من غير إضافة مفعول غير مذكور صراحة في اليونانية.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط سردية خفيفة تلائم انتقال الحدث ونتيجته في العربية، من غير إقحام معنى تضاد قوي.
- source_word: ἥψατο
  choice: لمس
  rationale: المعنى هنا لمسٌ جسدي في سياق الشفاء، و«لمس» هو المقابل العربي الواضح والطبيعي.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: أعينهما
  rationale: السياق السابق يحدد أن المقصود رجلان أعميان، ولذلك يعبّر المثنى العربي بدقة عن الجمع اليوناني المرجعي.
- source_word: εὐθέως
  choice: في الحال
  rationale: يحفظ معنى وقوع النتيجة فورًا، بعبارة عربية طبيعية ذات نبرة سردية رصينة.
- source_word: ἀνέβλεψαν
  choice: أبصرا
  rationale: في سياق شفاء الأعميين يدل الفعل على حصول البصر أو استعادته. «أبصرا» واضحة ولا تفترض صراحةً أنهما كانا مبصرين في وقت سابق.
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعاه
  rationale: يحفظ المعنى المباشر، أي سيرهما وراء يسوع، مع إبقاء ما قد يحمله السياق من إيحاء بالتلمذة من غير التصريح بما يتجاوز النص.
theological_decisions:
- issue: طبيعة النتيجة التي يدل عليها ἀνέβλεψαν
  choice: شفاء حقيقي وفوري مكّنهما من الإبصار
  alternative: أنهما رفعا نظرهما فحسب، أو عادت إليهما الرؤية إن كانا مبصرين من قبل
  rationale: سياق معجزة شفاء الأعميين واقتران الفعل بـ«في الحال» يدلان على حصول البصر فورًا، لكن الصياغة لا تزيد تفاصيل عن تاريخ عماهما.
- issue: دلالة ἠκολούθησαν αὐτῷ
  choice: تبعاه
  alternative: صارا من تلاميذه
  rationale: النص يذكر أنهما تبعاه، وقد يوحي ذلك بالتلمذة، لكنه لا يحدد صراحة طبيعة هذه التبعية أو مدتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم المثنى في «أعينهما، أبصرا، تبعاه» اتساقًا مع الرجلين المذكورين في السياق السابق، ووُضع هامش البديل عند الفعل الذي يخصه.
