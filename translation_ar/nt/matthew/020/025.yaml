source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: ar
  text: 'أمّا يسوع فدعاهم إليه وقال: «أنتم تعلمون أن حكّام الأمم[a] يتسلّطون عليهم، وأن عظماءهم[b] يمارسون السلطة عليهم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي الشعوب غير اليهودية؛ ويمكن أيضًا ترجمتها: «الشعوب».'
    reason: بديل معجمي يوضح الدلالة السياقية المحتملة لـἐθνῶν.
  - marker: b
    text: 'أو: «كبارهم» أو «كبار مسؤوليهم».'
    reason: بدائل معجمية توضّح أن المقصود ذوو المكانة أو النفوذ.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: فدعاهم إليه
  rationale: ينقل معنى اسم الفاعل الماضي المتوسط، بما فيه من استدعاء التلاميذ إلى يسوع، بعبارة عربية طبيعية موجزة.
- source_word: Οἴδατε
  choice: أنتم تعلمون
  rationale: الفعل تامّ في صيغته اليونانية لكنه حاضر المعنى؛ وإظهار الضمير يفيد توجيه الخطاب إلى التلاميذ بوضوح.
- source_word: ἄρχοντες
  choice: حكّام
  rationale: يدل على أصحاب الحكم والسلطة السياسية، و«حكّام» لفظ عربي معاصر واضح.
- source_word: τῶν ἐθνῶν
  choice: الأمم
  rationale: يحفظ المعنى الأساسي لـἔθνη، مع إبقاء احتمال الإشارة السياقية إلى غير اليهود في الحاشية، من غير حسم زائد.
- source_word: κατακυριεύουσιν
  choice: يتسلّطون
  rationale: ينقل معنى ممارسة السيادة بقوة أو بصورة استعلائية، ويحفظ النبرة السلبية في الفعل المركب.
- source_word: οἱ μεγάλοι
  choice: عظماؤهم
  rationale: يحفظ الصفة الاسمية المذكرة الدالة على ذوي المكانة والنفوذ، ويربطها بالأمم وفق السياق.
- source_word: κατεξουσιάζουσιν
  choice: يمارسون السلطة عليهم
  rationale: ترجمة مباشرة لمعنى ممارسة السلطة على الآخرين، مع بقاء النبرة الضاغطة ظاهرة من التوازي مع «يتسلّطون».
- source_word: αὐτῶν
  choice: عليهم
  rationale: يعود الضمير إلى شعوب الأمم الخاضعة للحكم، وتؤدي العربية هذا المرجع طبيعيًا بالضمير.
theological_decisions:
- issue: دلالة ἐθνῶν في قول يسوع ضمن سياق يهودي
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» يحفظ الاتساع المعجمي والتعبير المألوف كتابيًا، بينما توضّح الحاشية أن المقصود السياقي قد يكون الشعوب غير اليهودية، دون فرض تفسير واحد داخل المتن.
- issue: صياغة οἱ μεγάλοι المذكرة
  choice: عظماؤهم
  alternative: كبارهم أو كبار مسؤوليهم
  rationale: تحفظ الصيغة المذكرة ومعنى الوجاهة أو النفوذ، ولا تحصرها في منصب إداري محدد؛ وتعرض الحاشية بدائل أوضح وظيفيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أمّا يسوع» لإبراز انتقال الفاعل في ὁ δὲ Ἰησοῦς، وحُفظ التوازي بين فعلي السيطرة والسلطة دون جعل التعبيرين مترادفين تمامًا.
