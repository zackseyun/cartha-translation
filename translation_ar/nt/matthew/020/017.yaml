  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ar
  text: 'وفيما كان يسوع صاعدًا إلى أورشليم، أخذ التلاميذ الاثني عشر جانبًا، وقال لهم في الطريق:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: كان... صاعدًا
  rationale: يحفظ دلالة اسم الفاعل المضارع على فعل متزامن مع الفعل الرئيس، وينقل معنى الصعود إلى أورشليم بصياغة عربية طبيعية.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: «إلى» هي المقابل الطبيعي لحرف الاتجاه مع اسم المدينة، و«أورشليم» الصيغة العربية الكتابية الراسخة للاسم.
- source_word: παρέλαβεν
  choice: أخذ
  rationale: ينقل المعنى الأساسي للفعل، بينما يبيّن التعبير «على انفراد» أن الأخذ كان جانبًا بعيدًا عن الآخرين.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: التلاميذ الاثني عشر
  rationale: يمثل الاسم الصريح μαθητάς ولا يختزله إلى «الاثني عشر» فقط، ويستعمل المقابل العربي المألوف في سياق الأناجيل.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: تعبير عربي واضح وطبيعي يدل على الانفصال عن الآخرين والحديث في خصوصية.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: يحفظ إطار السفر بصياغة عربية موجزة ومألوفة.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: مقابل مباشر وطبيعي لفعل القول، ويترك مضمون الكلام للآية التالية.
