translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي ترتيب عربي طبيعي مع الحفاظ على تزامن الصعود وأخذ التلاميذ، وعلى خصوصية الموقف. لا تحتاج الآية إلى حاشية تفسيرية.
