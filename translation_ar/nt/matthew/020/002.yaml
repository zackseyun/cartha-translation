  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: ar
  text: وبعد أن اتفق مع العمال على دينار واحد لليوم[a]، أرسلهم إلى كرمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدينار أجرًا معتادًا ليوم عمل للعامل.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: بعد أن اتفق
  rationale: اسم فاعل ماضٍ يسبق الفعل الرئيس زمنيًا؛ والصياغة تبين أن الاتفاق تم قبل إرسال العمال.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة، ومثّلت بالواو الطبيعية في سياق العربية.
- source_word: ἐργατῶν
  choice: العمال
  rationale: لفظ عربي معاصر وواضح يلائم سياق استئجار العاملين في الكرم.
- source_word: ἐκ δηναρίου
  choice: على دينار واحد
  rationale: التركيب يدل على الأجرة المتفق عليها؛ وأُبقي اسم العملة القديمة مع التصريح بالعدد المفرد.
- source_word: τὴν ἡμέραν
  choice: لليوم
  rationale: يفيد مدة العمل التي تقابلها الأجرة، من غير إضافة معنى «اليوم كله» غير المصرح به.
- source_word: ἀπέστειλεν
  choice: أرسلهم
  rationale: المقابل السردي المباشر والطبيعي للفعل اليوناني.
- source_word: ἀμπελῶνα
  choice: كرمه
  rationale: «الكرم» هو المقابل العربي المألوف للأرض المغروسة بالعنب، والضمير يجسد αὐτοῦ.
