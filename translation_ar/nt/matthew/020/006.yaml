  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: ar
  text: 'وعند الساعة الحادية عشرة تقريبًا[a]، خرج فوجد آخرين واقفين، ويقول لهم[b]: «لماذا ظللتم واقفين هنا طوال النهار من غير عمل؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي قرابة الساعة الخامسة مساءً إذا حُسبت ساعات النهار من شروق الشمس؛ وحرفيًا: «نحو الساعة الحادية عشرة».'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «وقال لهم». يستخدم اليوناني المضارع التاريخي: «ويقول».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: ونحو الساعة الحادية عشرة
  rationale: تفيد περί مع حالة النصب التقريب الزمني. وتحافظ «الساعة الحادية عشرة» على طريقة عدّ ساعات النهار في سياق المثل، من غير تحويلها إلى توقيت حديث قد يوهم معنى غير مقصود.
- source_word: ἐξελθὼν
  choice: خرج
  rationale: اسم الفاعل اليوناني الماضي يدل على فعل سبق الفعل الرئيس، ويؤديه الفعل العربي المتتابع بوضوح وطبيعية.
- source_word: εὗρεν ἄλλους
  choice: فوجد آخرين
  rationale: ترجمة مباشرة تحفظ استعمال الصفة ἄλλους استعمالًا اسميًا من غير إضافة تحديد غير مصرّح به.
- source_word: ἑστῶτας
  choice: واقفين
  rationale: ينقل حالة الوقوف التي تفيدها صيغة التمام في اليونانية، من غير إضافة «هناك» إلى هذا الموضع لأن ὧδε يرد لاحقًا في السؤال.
- source_word: καὶ λέγει αὐτοῖς
  choice: ويقول لهم
  rationale: يحافظ المضارع العربي على المضارع التاريخي في النص اليوناني وعلى حيوية السرد.
- source_word: Τί ὧδε ἑστήκατε
  choice: لماذا ظللتم واقفين هنا
  rationale: تؤدي «لماذا» معنى Τί الاستفهامي في هذا التركيب، وتعبّر «ظللتم واقفين» عن الحالة المستمرة التي تفيدها صيغة التمام.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: طوال النهار من غير عمل
  rationale: «طوال النهار» تعبير عربي طبيعي للمدة، و«من غير عمل» ينقل معنى الخمول أو عدم الاشتغال من دون الإيحاء الاصطلاحي الحديث الذي قد تحمله كلمة «عاطلين».
