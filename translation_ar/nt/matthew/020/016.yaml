translation:
  language: ar
  text: وهكذا[a] سيكون الآخِرون أوَّلين، والأوَّلون آخِرين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وعلى هذا النحو سيكون الآخِرون أوَّلين، والأوَّلون آخِرين».'
    reason: بديل معجمي لـοὕτως يبرز معنى الكيفية، بينما يبرز المتن معنى النتيجة والخلاصة.
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تفيد الخلاصة والنتيجة المستنبطة من المثل، وهي صياغة عربية طبيعية تحافظ على قوة اللفظ الاستنتاجية من غير تكلّف.
- source_word: ἔσονται
  choice: يكون
  rationale: ينقل مستقبل فعل الكينونة بوضوح، ودلالة المستقبل مفهومة في العربية من سياق القول، مع جواز فهمه بوصفه قاعدة مترتبة على المثل.
- source_word: οἱ ἔσχατοι
  choice: الآخِرون
  rationale: الصفة مع أداة التعريف مستعملة استعمال الاسم؛ و«الآخِرون» تحافظ على معنى الترتيب أو المنزلة من غير تفسيره على أنه حكم على القيمة.
- source_word: πρῶτοι
  choice: أوَّلين
  rationale: خبر «يكون» منصوب، ويحافظ على المقابلة الموجزة بين الآخِرين والأوَّلين.
- source_word: καὶ
  choice: و
  rationale: تنقل العطف البسيط في اليونانية من غير إضافة معنى الاستدراك.
- source_word: οἱ πρῶτοι
  choice: الأوَّلون
  rationale: صفة مستعملة استعمال الاسم، وموازاتها لـ«الآخِرون» تحفظ بنية القول المتقابلة.
- source_word: ἔσχατοι
  choice: آخِرين
  rationale: خبر منصوب يُتمّ صيغة الانقلاب ويحافظ على التوازي اللفظي مع الشطر الأول.
theological_decisions:
- issue: طبيعة الانقلاب في هذا القول
  choice: صياغته قولًا موجزًا عن انقلاب الآخِرين والأوَّلين من غير تحديد مجال هذا الانقلاب.
  alternative: تفسيره صراحةً بأنه انقلاب اجتماعي، أو تفاوت في المكافأة بين التلاميذ، أو ترتيب في الخلاص.
  rationale: النص اليوناني يورد صيغة انقلاب عامة، ولا يحصرها لفظيًا في الزمن أو المكانة الاجتماعية أو المكافأة أو الخلاص؛ لذلك تحافظ الترجمة على هذا الاتساع والتوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على الإيقاع المتوازن للقول اليوناني. ضُبطت كلمتا «الآخِرون» و«الأوَّلون» جزئيًا لتفادي الالتباس البصري، وحُفظ العطف بالواو دون إدخال استدراك غير مصرّح به.
