  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: ar
  text: ومَن أراد أن يكون الأول بينكم، فسيكون عبدًا لكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظة اليونانية هي δοῦλος، وتدل على عبدٍ، أي شخص مملوك أو مستعبَد؛ وهي أقوى من لفظ «خادم» الوارد في العدد السابق.
    reason: بيان القوة المعجمية والفرق المقصود عن لفظ الخدمة في السياق السابق.
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: مَن أراد
  rationale: 'تركيب الاسم الموصول مع ἄν وصيغة الاحتمال يفيد العموم: أيّ شخص يريد. و«أراد» تعبير عربي طبيعي يحفظ معنى الإرادة والقصد.'
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: السياق يتناول المرتبة داخل جماعة التلاميذ، ولذلك تؤدي «بينكم» المعنى الاجتماعي المقصود بوضوح.
- source_word: εἶναι πρῶτος
  choice: أن يكون الأول
  rationale: ترجمة مباشرة وطبيعية للطموح إلى المرتبة الأولى، من غير تحويل المعنى إلى مجرد سبق زمني.
- source_word: ἔσται
  choice: فسيكون
  rationale: تحفظ صيغة المستقبل في اليونانية، مع إبقاء قوتها المعيارية المستفادة من السياق من غير استبدالها صراحةً بصيغة «يجب».
- source_word: ὑμῶν
  choice: لكم
  rationale: تفيد علاقة العبد بسائر أفراد الجماعة، وصياغة «عبدًا لكم» عربية واضحة وطبيعية.
- source_word: δοῦλος
  choice: عبد
  rationale: اللفظة أقوى من διάκονος الواردة في العدد السابق، وتشير في أصل استعمالها إلى شخص مملوك أو مستعبَد؛ لذلك تحفظ «عبد» تصعيد القول وقوته أكثر من «خادم».
theological_decisions:
- issue: ترجمة δοῦλος في قول عن التلمذة والخدمة
  choice: عبد
  alternative: خادم أو مملوك
  rationale: يحمل القول مفارقة بين طلب الصدارة وقبول أدنى منزلة اجتماعية. واختيار «عبد» يحفظ الفرق المقصود عن لفظ «خادم» في العدد السابق، من غير تلطيف حدة الصورة أو تحميلها تفسيرًا مذهبيًا.
translation_notes:
  register: لغة عربية فصحى حديثة، موجزة ومهيبة. استُخدمت «مَن أراد» بدل صياغة أثقل مثل «كل من يشأ»، وحُفظ المستقبل في «فسيكون» كما في النص اليوناني.
