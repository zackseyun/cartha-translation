lexical_decisions:
- source_word: Ἰδοὺ
  choice: ها نحن
  rationale: تؤدي وظيفة التنبيه وجذب الانتباه في عربية فصيحة طبيعية، من غير اللجوء إلى صيغة قديمة ثقيلة مثل «هوذا».
- source_word: ἀναβαίνομεν
  choice: صاعدون
  rationale: تحفظ معنى الصعود إلى أورشليم، جغرافيًا وفي الاستعمال المألوف للذهاب إليها، وتلائم الفعل الحاضر الدال على المسير الجاري.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الراسخة لاسم المدينة.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: تحفظ اللقب الإنجيلي بصيغته المألوفة وإمكان صداه في دانيال 7، من غير اختزاله إلى معنى «الإنسان» عمومًا.
- source_word: παραδοθήσεται
  choice: سيُسلَّم
  rationale: تحفظ المبني للمجهول والمعنى الواسع لنقل الشخص إلى سلطة آخرين، من غير حصر اللفظ في خيانة يهوذا.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: إلى رؤساء الكهنة
  rationale: التعبير العربي المعياري عن القيادات الكهنوتية التي يدل عليها الجمع اليوناني.
- source_word: γραμματεῦσιν
  choice: الكتبة
  rationale: مقابل مباشر ومألوف للمصطلح، ويحفظ هوية الفئة الدينية القانونية من غير توسيع تفسيري.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: فيحكمون عليه بالموت
  rationale: صياغة عربية طبيعية تنقل الدلالة القضائية للحكم وإيقاع عقوبة الموت، وتحفظ ارتباط الفعل بما قبله.
theological_decisions:
- issue: دلالة اللقب ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان / الكائن البشري
  rationale: يحفظ لقب يسوع المميز والتوتر بين دلالته البشرية وإمكان الإشارة إلى دانيال 7:13–14، من غير حسم تفسيري زائد.
- issue: نطاق معنى παραδοθήσεται
  choice: سيُسلَّم
  alternative: سيُخان
  rationale: النص هنا يصرح بالتسليم إلى السلطات ولا يحدد في هذا الفعل وحده صورة الخيانة أو فاعلها؛ لذلك تُختار العبارة الأوسع المطابقة للسياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «ها نحن» بدل «هوذا» لسلامة الأسلوب الحديث، مع الحفاظ على قوة التنبيه. وحُفظت المصطلحات الكتابية الراسخة «أورشليم»، و«ابن الإنسان»، و«رؤساء الكهنة»، و«الكتبة».
