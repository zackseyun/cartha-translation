  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: ar
  text: 'فتوقّف يسوع، وناداهما وقال: «ماذا تريدان أن أفعل لكما؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما الذي تريدان أن أفعله لكما؟»'
    reason: بديل صياغي للسؤال من غير تغيير المعنى أو الإيحاء بأن البديل أكثر حرفية.
lexical_decisions:
- source_word: στὰς
  choice: فتوقّف
  rationale: اسم الفاعل الأوريستي من ἵστημι يسبق الفعل الرئيس ويدل هنا على أن يسوع أوقف سيره؛ و«فتوقّف» تعبير عربي طبيعي يحفظ الحركة السردية.
- source_word: ἐφώνησεν
  choice: ناداهما
  rationale: الفعل φωνέω يعني النداء أو الاستدعاء. و«ناداهما» يلائم السياق، كما أن صيغة المثنى توضّح أن الضمير يعود إلى الأعميين المذكورين قبيل هذه الآية.
- source_word: αὐτούς
  choice: هما (في ناداهما)
  rationale: ضمير مفعول به جمع يعود في السياق إلى رجلين؛ لذلك استُعمل المثنى العربي، وأُدمج الضمير بالفعل على نحو طبيعي.
- source_word: Τί θέλετε
  choice: ماذا تريدان
  rationale: يحفظ الاستفهام المباشر ومعنى الإرادة في θέλω، مع استعمال المثنى بحسب مرجع المخاطبَين في السياق.
- source_word: ποιήσω ὑμῖν
  choice: أن أفعل لكما
  rationale: صيغة «أن أفعل» تنقل بصورة طبيعية مضمون ما يريدانه، واللام في «لكما» تؤدي معنى الداتيف الدال على المنفعة.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: نُقل الاسم بصيغته العربية المألوفة، ولم تُترجم أداة التعريف اليونانية مع اسم العلم.
theological_decisions:
- issue: نبرة سؤال يسوع وقوته
  choice: «ماذا تريدان أن أفعل لكما؟» بوصفه سؤالًا مباشرًا يتيح لهما إعلان طلبهما
  alternative: «ما الذي ترغبـان أن أفعله لكما؟» بصياغة أفصح قليلًا وأقل مباشرة
  rationale: لا يحمل التركيب مصطلحًا عقائديًا متنازعًا عليه. تحافظ الصياغة المختارة على المشاركة الشخصية المباشرة في السؤال من غير تكلّف أو إضافة تفسير لقصده.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعمل المثنى في «ناداهما، تريدان، لكما» لأن السياق السابق يحدّد المخاطبَين بأنهما رجلان، مع بقاء مضمون النص اليوناني محفوظًا. وُضعت علامة الحاشية بعد السؤال لأنها تتصل بصياغته، لا بالفعل «فتوقّف».
