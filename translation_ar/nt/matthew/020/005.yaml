lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: فذهبوا
  rationale: تشير οἱ إلى العمال المذكورين سابقًا، وδέ رابط سردي خفيف تلائمه الفاء، وἀπῆλθον تعني أنهم ذهبوا.
- source_word: πάλιν ἐξελθὼν
  choice: ثم خرج أيضًا
  rationale: تحافظ «أيضًا» على معنى تكرار الفعل في πάλιν، وتعبّر «ثم خرج» طبيعيًا عن التتابع السردي الذي يحمله اسم الفاعل الماضي ἐξελθών.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: نحو الساعة السادسة والتاسعة
  rationale: تنقل «نحو» دلالة التقريب في περὶ، مع إبقاء طريقة عدّ الساعات في الثقافة الأصلية وشرح مقابلها الحديث في الحاشية.
- source_word: ἐποίησεν ὡσαύτως
  choice: وفعل مثل ذلك
  rationale: تعبير عربي واضح وموجز ينقل الفعل العام ποιέω وقوة المماثلة في ὡσαύτως، مع إحالة «ذلك» إلى تصرفه السابق.
