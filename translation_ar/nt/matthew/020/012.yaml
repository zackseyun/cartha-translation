review_pass:
  verdict: revise
  source_fidelity: 'الترجمة دقيقة في معظم عناصرها: «قائلين» تؤدي اسم الفاعل، و«عملوا ساعة واحدة»، و«جعلتهم مساوين لنا»، و«تحمّلنا عبء النهار والحرّ اللافح» تنقل المعنى والصورة بوضوح. لكن «هؤلاء الذين جاءوا أخيرًا» تضيف فعل المجيء غير المذكور في هذه العبارة اليونانية؛ فـ οἱ ἔσχατοι تعني «هؤلاء الأخيرون/الآخرون» في سياق المثل، من دون التصريح هنا بالفعل الذي جعلهم أخيرين.'
  naturalness: الصياغة فصيحة وسلسة، و«الحرّ اللافح» و«عبء النهار» تعبيران طبيعيان في العربية الفصحى الحديثة. وتبقى «هؤلاء الأخيرون» واضحة ومألوفة في هذا السياق، ولا تحتاج إلى التوسيع التفسيري بـ«الذين جاءوا».
  terminology: مصطلحات العمل والاحتمال مناسبة ولا تحمل تفسيرًا لاهوتيًا زائدًا. لا يلزم إدراج حاشية؛ فالبديل الإنجليزي المتعلق بـ«عاملتهم على قدم المساواة» لا يقتضي حاشية عربية ما دامت الصياغة المباشرة تؤدي المعنى.
  issues:
