  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: ar
  text: 'قائلين: «هؤلاء الأخيرون عملوا ساعةً واحدة، وجعلتهم مساوين لنا، نحن الذين تحمّلنا عبء النهار والحرّ اللافح».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي بصيغة الجمع مرتبط بالسياق السابق، و«قائلين» يحافظ على تدفّق التركيب اليوناني وهو فصيح طبيعي.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: هؤلاء الذين جاءوا أخيرًا
  rationale: يشير إلى العمال الذين استُؤجروا في آخر النهار؛ وهذه الصياغة أوضح في العربية من الترجمة الحرفية «هؤلاء الآخرون».
- source_word: μίαν ὥραν ἐποίησαν
  choice: عملوا ساعةً واحدة
  rationale: الفعل ποιέω مع مدة زمنية يفيد هنا قضاءها في العمل، فالصياغة العربية الطبيعية هي «عملوا ساعةً واحدة».
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: جعلتهم مساوين لنا
  rationale: ينقل مباشرة معنى جعل أشخاص على قدم المساواة مع آخرين ويحفظ قوة شكوى العمال بلا تفسير زائد.
- source_word: τοῖς βαστάσασι
  choice: نحن الذين تحمّلنا
  rationale: βαστάζω يجمع هنا معنى حمل العبء واحتماله؛ و«تحمّلنا» يلائم مشقة العمل ويؤدي المعنيين.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: عبء النهار
  rationale: يحافظ على صورة الثقل أو العبء المقصود بها مشقة يوم العمل الكامل.
- source_word: τὸν καύσωνα
  choice: الحرّ اللافح
  rationale: καύσων يدل على حر شديد محرق، و«الحرّ اللافح» تعبير عربي واضح وطبيعي ينقل شدة اللفظة.
theological_decisions:
- issue: شكوى العمال في المثل بشأن المساواة والإنصاف
  choice: 'نقل الاحتجاج كما ورد: «جعلتهم مساوين لنا» دون وصف المعاملة صراحةً بأنها عادلة أو ظالمة.'
  alternative: صياغة تفسيرية مثل «عاملتهم مثلنا ظلمًا لنا».
  rationale: النص يورد شكوى العمال ويترك التوتر اللاهوتي في المثل قائمًا؛ فلا ينبغي للترجمة أن تحسم تقييم عدالة صاحب الكرم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «هؤلاء الذين جاءوا أخيرًا» لإزالة غموض التعبير الحرفي، مع الحفاظ على الإيجاز وقوة المقابلة، واستُبقيت صورة «عبء النهار» مع تعبير طبيعي عن الحر الشديد.
