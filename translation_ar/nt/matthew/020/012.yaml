  to: 'قائلين: «هؤلاء الأخيرون عملوا ساعةً واحدة، وجعلتهم مساوين لنا، نحن الذين تحمّلنا عبء النهار والحرّ اللافح».'
  rationale: استبدلتُ التوسيع التفسيري «الذين جاءوا أخيرًا» بـ«الأخيرون» لمطابقة التعبير اليوناني مباشرة مع بقاء المعنى واضحًا في سياق المثل. كما استُغني عن «قد» لأن العطف بـ«و» ينقل تسلسل الشكوى طبيعيًا في العربية، من غير تغيير المعنى.
