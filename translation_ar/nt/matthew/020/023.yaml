base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: ar
  text: 'فقال لهما: «أمّا كأسي فستشربانها بالفعل، وأمّا الجلوس عن يميني وعن يساري فليس لي أن أمنحه، بل هو للذين أعدَّه لهم أبي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الكأس» صورة مجازية تشير إلى الألم أو المصير المعيَّن ليسوع، والذي سيشترك فيه تلميذاه أيضًا.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: فقال لهما
  rationale: صيغ المضارع التاريخي اليوناني بصيغة الماضي الملائمة للسرد العربي. واستُعمل ضمير التثنية لأن المخاطبَين في السياق هما ابنا زبدي.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: أمّا كأسي فستشربانها بالفعل
  rationale: أُبقيت صورة «الكأس» المجازية من غير تفسير داخل المتن، ونُقلت صيغة المستقبل. وتؤدي «أمّا... بالفعل» وظيفة μὲν في توكيد الجملة الأولى وإعداد المقابلة مع ما يلي.
- source_word: τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: وأمّا الجلوس عن يميني وعن يساري
  rationale: صياغة عربية طبيعية تحفظ موضعي اليمين واليسار بوصفهما مكاني قرب وكرامة، من غير إضافة تفسيرية.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: فليس لي أن أمنحه
  rationale: تحفظ العبارة الإسناد المباشر الوارد في اليونانية، و«أمنحه» أنسب في العربية لإعطاء موضع أو امتياز.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: بل هو للذين أعدَّه لهم
  rationale: استُكمل الحذف المفهوم في اليونانية بعبارة «هو للذين» لوضوح العربية، مع إبقاء معنى الإعداد السابق القائم الأثر.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: أبي
  rationale: إسناد الإعداد إلى الآب محفوظ بوضوح. وبنية الفعل المبني للمعلوم طبيعية في العربية ولا تضيف معنى غير موجود في المصدر.
theological_decisions:
- issue: الدلالة المسيحانية لعبارة «فليس لي أن أمنحه»
  choice: إثبات العبارة كما هي من غير قيد تفسيري
  alternative: إضافة قيد مثل «بمعزل عن أبي» أو إعادة الصياغة لتخفيف التوتر اللاهوتي
  rationale: النص ينسب إعداد هذه المواضع إلى الآب ويقول صراحة إن منحها ليس ليسوع؛ لذلك حُفظ هذا التوتر كما ورد، من غير مواءمة عقائدية مضافة.
- issue: مدلول الكأس
  choice: الإبقاء على استعارة «كأسي» في المتن
  alternative: استبدالها بتفسير مباشر مثل «الآلام التي سأتألمها»
  rationale: الاستعارة مقصودة في كلام يسوع وتسمح ببقاء سعة الدلالة بين الألم والمصير المعيَّن، مع شرح موجز في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعملت صيغة التثنية اتساقًا مع المخاطبَين في السياق، وحُفظت استعارة الكأس والتقابل البلاغي بين الشرب والجلوس في موضعي الكرامة.
