  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: ar
  text: 'فأجاب وقال لواحدٍ منهم: «يا صديقي، أنا لا أظلمك. أما اتفقتَ معي على دينارٍ[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الدينار عملة فضية رومانية، وكان يُعَدّ عادةً أجرة يومٍ لعامل.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: فأجاب ... قائلًا
  rationale: ينقل تركيب اسم الفاعل مع فعل القول إلى صياغة عربية فصيحة وطبيعية، مع إبقاء معنى الرد.
- source_word: ἑνὶ αὐτῶν
  choice: واحدًا منهم
  rationale: يحفظ معنى إفراد شخص واحد من الجماعة بوصفه المتلقي للجواب.
- source_word: Ἑταῖρε
  choice: يا صديقي
  rationale: مقابل عربي طبيعي للنداء، مع إمكان أن يحمل السياق نبرة رسمية أو متحفظة لا حميمية بالضرورة.
- source_word: οὐκ ἀδικῶ σε
  choice: أنا لا أظلمك
  rationale: الفعل «أظلم» ينقل مباشرة معنى التعدي على حق المخاطب أو معاملته بغير عدل، ويحفظ زمن المضارع.
- source_word: οὐχὶ
  choice: أما ...؟
  rationale: صيغة استفهام تقريري تتوقع جوابًا بالإيجاب، وتلائم العربية الفصحى الواضحة.
- source_word: δηναρίου
  choice: على دينارٍ
  rationale: يحفظ اسم العملة التاريخية، و«على» تلائم في العربية الشيء المتفق عليه.
- source_word: συνεφώνησάς μοι
  choice: اتفقتَ معي
  rationale: ترجمة موجزة وطبيعية تدل على الاتفاق السابق بين الطرفين.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختير «يا صديقي» بصيغة النداء الطبيعية، من غير تحميلها حميمية لا يفرضها السياق. وُضع مؤشر الحاشية بعد «دينار» لأنه يشرح العملة التاريخية.
