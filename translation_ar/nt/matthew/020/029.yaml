  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: ar
  text: وفيما كانوا يخرجون من أريحا[a]، تبعه جمع كبير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وحين غادروا أريحا».'
    reason: بديل معجمي وتركيبي ممكن للعبارة الزمنية ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ.
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: كانوا يخرجون
  rationale: يحافظ الفعل المضارع ضمن تركيب «فيما كانوا» على الدلالة الزمنية وعلى صورة الحدث الجاري التي يؤديها اسم الفاعل اليوناني في صيغة الحاضر.
- source_word: ἀπὸ Ἰεριχὼ
  choice: من أريحا
  rationale: ينقل حرف الجر ἀπό الحركة ابتداءً من مكان، و«من أريحا» تعبير عربي طبيعي ودقيق.
- source_word: ἠκολούθησεν
  choice: تبعه
  rationale: ينقل المعنى المعتاد للفعل ἀκολουθέω في سياق السير خلف شخص، مع إبقاء الفعل في صيغة المفرد العائدة إلى يسوع.
- source_word: αὐτῷ
  choice: ـه في «تبعه»
  rationale: الضمير اليوناني مفرد، والأقرب في السياق أنه يعود إلى يسوع؛ لذلك حُفظ الانتقال من جمع «كانوا» إلى مفرد «تبعه» من غير تسوية.
- source_word: ὄχλος πολύς
  choice: جمع كبير
  rationale: تعبير واضح معاصر يدل على كثرة عدد الجموع من غير إيحاء نوعي زائد.
theological_decisions:
- issue: مرجع الضمير المفرد αὐτῷ بعد العبارة ذات الفاعل الجمع
  choice: 'الجمع تبع يسوع: «تبعه»'
  alternative: 'الجمع تبع المجموعة: «تبعهم»'
  rationale: ينتقل النص اليوناني صراحةً من الجمع في «كانوا يخرجون» إلى المفرد في «تبعه»، والأرجح أن المفرد يخص يسوع بوصفه محور المشهد؛ فحُفظ هذا الانتقال بدل تسويته.
translation_notes:
  register: العربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «فيما كانوا يخرجون» لصون الاستمرارية الزمنية، و«جمع كبير» للوضوح وسهولة الفهم.
