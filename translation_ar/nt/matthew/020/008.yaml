  terminology: «صاحب الكرم» و«وكيله» و«العمّال» ألفاظ مناسبة للسياق. و«أجرتهم» تؤدي المعنى التوزيعي للأجر المستحق، وإن كان الأصل يستعمل المفرد الجمعي.
