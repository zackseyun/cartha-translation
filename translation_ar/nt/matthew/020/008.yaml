  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ar
  text: 'ولمّا جاء المساء، قال صاحب الكرم لوكيله: «ادعُ العمّال وادفع لهم أجورهم، وابدأ بالآخرين وانتهِ بالأوّلين».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: ولمّا جاء المساء
  rationale: صياغة عربية طبيعية تنقل الظرف الزمني والتحول السردي دون زيادة تفسيرية.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: صاحب الكرم
  rationale: يدل السياق على مالك الكرم أو ربّه؛ و«صاحب الكرم» واضحة وطبيعية ولا تستدعي هنا لقبًا إلهيًا.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: لوكيله
  rationale: «الوكيل» ينقل معنى الشخص المكلّف بإدارة شؤون المالك، وهو أنسب من ألفاظ إدارية حديثة أكثر تخصصًا.
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: أعطهم أجرتهم
  rationale: ينقل فعل أداء المستحق ومعنى الأجر بعبارة عربية مألوفة؛ والإفراد اليوناني «الأجر» يُفهم توزيعيًا، فجاء الضمير مطابقًا للعمال.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: مبتدئًا بالآخرين حتى تصل إلى الأوّلين
  rationale: يحفظ ترتيب الدفع من آخر من عُيّنوا إلى أولهم، ويجعل مدى الإجراء واضحًا في العربية.
theological_decisions:
- issue: زمن λέγει المضارع في السرد
  choice: قال
  alternative: يقول
  rationale: المضارع التاريخي اليوناني أداة سردية شائعة، ويُنقل طبيعيًا في العربية بالماضي من غير تغيير للمضمون أو تحميله دلالة لاهوتية.
- issue: دلالة κύριος في المثل
  choice: صاحب الكرم
  alternative: ربّ الكرم
  rationale: المقصود داخل المشهد هو مالك الكرم؛ اختيار «صاحب» يحفظ المعنى السياقي ويتجنب الإيحاء بأن اللفظ هنا لقب إلهي صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع حوار طبيعي وألفاظ مألوفة. لا حاجة إلى حواشٍ لأن الفروق النصية أو الدلالية لا تؤثر هنا في صياغة الآية المنشورة.
