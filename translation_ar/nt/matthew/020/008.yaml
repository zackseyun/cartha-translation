  source_fidelity: 'النص ينقل عناصر اليونانية الأساسية بأمانة: المساء، صاحب الكرم، وكيله، دعوة العمال، دفع الأجر، وترتيب البدء بالآخرين وصولًا إلى الأولين. إلا أن تركيب «مبتدئًا بالآخرين حتى تصل إلى الأوّلين» يخلط بين اسم الفاعل والخطاب الموجّه إلى الوكيل، ويجعل الفعل «تصل» أقل مباشرة في بيان ترتيب الدفع.'
