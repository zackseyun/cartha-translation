  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: ar
  text: 'لكن الجمع انتهرهم لكي يصمتوا، أما هم فصرخوا أكثر فأكثر[a] قائلين: «يا رب، ارحمنا، يا ابن داود[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بصوت أعلى». قد تفيد صيغة المقارنة اليونانية ازدياد الشدة عمومًا («أكثر فأكثر») أو ارتفاع الصوت خصوصًا.'
    reason: lexical_alternative
  - marker: b
    text: «ابن داود» لقب مسياني، وليس مجرد إشارة إلى النسب.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: الجمع
  rationale: لفظ «الجمع» عربي واضح وطبيعي يدل على جماعة الناس الحاضرين، ويحفظ المعنى السردي للكلمة اليونانية.
- source_word: ἐπετίμησεν
  choice: انتهرهم
  rationale: «انتهر» ينقل التوبيخ الحاد ومحاولة إسكات الرجلين من غير مبالغة بإضافة أمر صريح غير مذكور في الفعل نفسه.
- source_word: ἵνα σιωπήσωσιν
  choice: لكي يصمتوا
  rationale: يحفظ غرض فعل الجمع كما تعبّر عنه جملة ἵνα، بصياغة عربية مباشرة وطبيعية.
- source_word: μεῖζον
  choice: أكثر فأكثر
  rationale: يحفظ قوة المقارنة والتصعيد عمومًا من غير حصرها في ارتفاع الصوت وحده؛ وإمكان فهمها بمعنى «بصوت أعلى» مذكور في الحاشية.
- source_word: ἔκραξαν
  choice: صرخوا
  rationale: ينقل دلالة النداء المرتفع والملحّ التي يحملها الفعل κράζω.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ المخاطبة المباشرة وما فيها من توقير، مع إبقاء إمكان دلالتها المسيانية أو اللاهوتية من غير حسم زائد.
- source_word: ἐλέησον ἡμᾶς
  choice: ارحمنا
  rationale: صياغة عربية موجزة ومألوفة تؤدي طلب الرحمة مباشرة.
- source_word: υἱὸς Δαυίδ
  choice: ابن داود
  rationale: يحفظ اللقب بصورته الحرفية المعروفة في إنجيل متى بدل تسطيحه إلى مجرد «سليل داود».
theological_decisions:
- issue: اللقب المسياني الموجَّه إلى يسوع
  choice: يا ابن داود
  alternative: يا سليل داود
  rationale: العبارة في متى لقب ذو دلالة ملكية ومسيانية، لا مجرد بيان للنسب؛ والترجمة الحرفية تحفظ هذه الدلالة من غير شرحها داخل المتن.
- issue: دلالة κύριος في مخاطبة يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ التوقير وإمكان الثقل christological في اللفظ، بينما قد تحصر «يا سيد» المعنى في المخاطبة الاجتماعية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين محاولة الجمع إسكاتهم وتصاعد صراخهم، كما حُفظت صيغة الجمع في هذه الآية بدل إدخال التثنية اعتمادًا على السياق السابق.
