  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: ar
  text: 'فقالا له: «يا رب، لِتُفتَح أعيننا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيد، لِتُفتَح أعيننا».'
    reason: بديل معجمي محتمل للنداء Κύριε.
lexical_decisions:
- source_word: λέγουσιν
  choice: فقالا
  rationale: المضارع التاريخي في سياق السرد يُنقل طبيعيًا بالماضي، وصيغة التثنية يقتضيها سياق الرجلين في العدد السابق.
- source_word: αὐτῷ
  choice: له
  rationale: ضمير في حالة المجرور غير المباشر، ومعناه المباشر «له».
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء من κύριος؛ و«يا رب» تحفظ دلالة الاحترام والسلطان، مع بقاء احتمال استعمالها نداءً توقيريًا بحسب السياق.
- source_word: ἵνα
  choice: نريد أن
  rationale: تأتي هنا لتبيين مضمون الطلب جوابًا عن سؤال يسوع؛ وهذه الصياغة عربية طبيعية توضّح قوة الطلب من غير تغيير مضمونه.
- source_word: ἀνοιγῶσιν
  choice: تنفتح
  rationale: فعل ماضٍ مبني للمجهول في صيغة الالتزام اليونانية؛ «تنفتح» تنقل المعنى المبني للمجهول/المطاوع طبيعيًا في العربية من غير تعيين فاعل الشفاء.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: أعيننا
  rationale: ترجمة طبيعية للاسم المعرّف مع ضمير الملكية، والمثنى مفهوم من ضمير المتكلمين وسياق المتكلمين الاثنين.
theological_decisions:
- issue: ترجمة κύριος في خطاب موجّه إلى يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» هي المقابل المعتاد وتحفظ وزن اللقب وإمكان دلالته الأوسع، من غير أن تفرض أن المتكلمين عبّروا هنا عن اعتراف لاهوتي كامل؛ لذلك ذُكر البديل في الحاشية.
- issue: تعيين فاعل فتح الأعين
  choice: تنفتح أعيننا
  alternative: افتح أعيننا
  rationale: يحافظ التعبير على كون الأعين هي الفاعل النحوي المتلقي للحدث في اليونانية، ولا يصرّح بفاعل لم يُذكر صراحة في الجملة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت صيغة التثنية في «فقالا» اعتمادًا على السياق المباشر، وصيغ الطلب بأسلوب عربي طبيعي، مع حاشية تحفظ البديل الأقرب إلى البنية اليونانية واحتمال معنى «يا سيد».
