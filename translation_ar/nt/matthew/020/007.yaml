  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: جواب العمال التعليلي («لأن»)، ونفي أن يكون أحد قد استأجرهم، وأمر صاحب الكرم لهم بالذهاب، مع إبراز شمولهم بعبارة «أنتم أيضًا». نقل المضارعين التاريخيين بصيغة الماضي عربيًّا لا يغيّر المعنى السردي.'
