  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: ar
  text: 'فقالوا له: «لأن أحدًا لم يستأجرنا». فقال لهم: «اذهبوا أنتم أيضًا إلى الكرم».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: فقالوا
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي، وهو الأسلوب الطبيعي في السرد العربي مع بقاء تتابع الحوار واضحًا.
- source_word: Ὅτι
  choice: لأن
  rationale: تأتي هنا لبيان سبب بقائهم بلا عمل، فتؤدي «لأن» القوة التعليلية بوضوح.
- source_word: οὐδεὶς
  choice: أحدًا لم
  rationale: هذا تركيب عربي فصيح وطبيعي لنفي قيام أي شخص باستئجارهم.
- source_word: ἐμισθώσατο
  choice: يستأجرنا
  rationale: الفعل يدل على استئجار عمال لقاء أجر؛ وصيغة الماضي بعد «لم» تعبّر طبيعيًا عن عدم وقوع ذلك إلى زمن الكلام.
- source_word: λέγει
  choice: فقال
  rationale: نُقل المضارع التاريخي بالماضي اتساقًا مع أسلوب السرد العربي الواضح والطبيعي.
- source_word: Ὑπάγετε
  choice: اذهبوا
  rationale: أمر مباشر بالحركة إلى موضع العمل، و«اذهبوا» هي المقابل العربي الواضح.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: يحفظ هذا التعبير توكيد شمول هذه الجماعة مع الذين أُرسلوا قبلها.
- source_word: ἀμπελῶνα
  choice: الكرم
  rationale: «الكرم» لفظ عربي معياري موجز لبستان العنب، وهو ملائم لسياق المثل.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم الماضي في فعلي القول لأن المضارع التاريخي اليوناني يُعبَّر عنه طبيعيًا بالماضي في السرد العربي، من غير تغيير في المعنى. لا تستدعي الآية حاشية نصية أو لاهوتية.
