base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: ar
  text: 'فقال لها: «ماذا تريدين؟» قالت له: «قُلْ[a]: ليجلس ابناي هذان، أحدهما عن يمينك والآخر عن يسارك، في مملكتك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'الفعل اليوناني يعني حرفيًا «قُلْ». وفي هذا السياق، يحمل القول المطلوب قوة الأمر أو الإقرار؛ ويمكن ترجمته تفسيرًا: «أمُرْ».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني «المملكة» هنا أيضًا «المُلك» أو «الحكم الملكي».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: ماذا تريدين؟
  rationale: سؤال مباشر عمّا تطلبه المرأة، وصيغة المؤنث يقتضيها مرجع الضمير αὐτῇ.
- source_word: Εἰπὲ
  choice: قُلْ
  rationale: يحافظ على المعنى الأساسي لفعل λέγω، مع صيغة «ليجلس» التي تجعل مضمون القول المطلوب طبيعيًا في العربية من غير استبدال الفعل صراحةً بـ«امنح».
- source_word: ἵνα καθίσωσιν
  choice: ليجلس
  rationale: تنقل لام الأمر مع الفعل المضارع مضمون الطلب المقصود بجملة ἵνα، وتنسجم طبيعيًا مع «قُلْ» في العربية.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: ابناي هذان
  rationale: تحافظ على الإشارة والتثنية والإضافة إلى المتكلمة بصياغة عربية فصيحة طبيعية.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: أحدهما عن يمينك والآخر عن يسارك
  rationale: تؤدي التعبير المكاني المتوازي بوضوح، مع «أحدهما... والآخر» الأنسب عربيًا للمقابلة بين الاثنين.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: في مملكتك
  rationale: «مملكتك» واضحة للقارئ المعاصر وتحفظ الصورة الملكية ومجال السيادة، مع التنبيه إلى إمكان دلالة اللفظ على المُلك أو الحكم.
theological_decisions:
- issue: طبيعة الجلوس المطلوب وصلته بملوكية يسوع
  choice: صياغة الطلب بوصفه جلوسًا عن اليمين واليسار في مملكته، من غير تحديد ما إذا كان المقصود طورًا أرضيًا أم سماويًا.
  alternative: تفسيره صراحةً بأنه في مملكة مسيانية أرضية أو في المملكة السماوية المكتملة.
  rationale: النص اليوناني يطلب موضعي شرف في βασιλεία يسوع، لكنه لا يحسم في هذه الآية وحدها الإطار الأخروي المقصود.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «قُلْ: ليجلس» لتجنب تركيب عربي متكلف، مع إبقاء اللفظ قريبًا من الفعل اليوناني، واستُخدمت «مملكتك» بدل مصطلح أشد كنسية حتى يظل المعنى مباشرًا للقارئ العام.'
