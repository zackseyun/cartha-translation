base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: ar
  text: والذين جاءوا نحو الساعة الحادية عشرة نال كلُّ واحدٍ منهم دينارًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدينار قطعة نقدية فضية رومانية، وكان يُعَدّ عادةً أجرة يومٍ لعامل.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: حرف ربط يواصل السرد ويربط مجيء هذه الفئة بما قبله من غير إضافة دلالة زمنية زائدة.
- source_word: ἐλθόντες
  choice: جاء
  rationale: ترجمة طبيعية لاسم الفاعل الماضي في سياق سردي، مع ربط الفعل بالجماعة المذكورة.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: الذين استُؤجروا نحو الساعة الحادية عشرة
  rationale: تدل العبارة على الجماعة المرتبطة زمنيًا بالساعة الحادية عشرة. أُظهر الاستئجار اعتمادًا على السياق القريب لتفادي إيحاء أن وقت المجيء وحده هو المقصود، مع الحفاظ على تقريب περὶ بكلمة «نحو».
- source_word: ἔλαβον
  choice: أخذ
  rationale: فعل عربي فصيح وطبيعي في مقام تسلُّم الأجرة، من غير مبالغة تفسيرية.
- source_word: ἀνὰ
  choice: كلُّ واحدٍ منهم
  rationale: 'ينقل المعنى التوزيعي بوضوح: دينار واحد لكل شخص.'
- source_word: δηνάριον
  choice: دينارًا
  rationale: يحافظ على اسم النقد التاريخي الوارد في اليونانية، وتُشرح قيمته التقريبية في الحاشية بدل استبداله بتفسير.
