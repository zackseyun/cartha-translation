  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: ar
  text: ألا يحقّ لي أن أفعل بما لي ما أريد؟ أم عينك شريرة لأنني صالح؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أم تحسدني لأنني صالح؟» فتعبير «العين الشريرة» يدل هنا على الحسد أو الاستياء من إحسان الآخر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: يحقّ لي
  rationale: ينقل معنى الجواز والحق المشروع بصياغة عربية طبيعية، ويحافظ على قوة السؤال الاستنكاري.
- source_word: ὃ θέλω ποιῆσαι
  choice: أن أفعل ... ما أريد
  rationale: يعبّر بوضوح عن الإرادة الشخصية من غير صياغة قديمة أو متكلّفة.
- source_word: ἐν τοῖς ἐμοῖς
  choice: بما لي
  rationale: صياغة عربية موجزة تفيد التصرّف فيما يملكه المتكلم، وتلائم سياق المثل الاقتصادي.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: عينك شريرة
  rationale: يحافظ على صورة التعبير اليوناني وعلى المقابلة اللفظية مع صلاح المتكلم، مع شرح دلالته الاصطلاحية في الحاشية.
- source_word: ἀγαθός
  choice: صالح
  rationale: ينقل المعنى الأساسي للصفة ويحفظ التقابل بين «شريرة» و«صالح»، من غير حصرها تفسيريًا في الكرم.
theological_decisions:
- issue: هل يُفسَّر التعبير الاصطلاحي ὁ ὀφθαλμός σου πονηρός داخل المتن؟
  choice: الإبقاء على الصورة الحرفية «عينك شريرة» في المتن
  alternative: أم تحسدني لأنني صالح؟ / أم تستاء لأنني كريم؟
  rationale: يحفظ هذا الاختيار صورة النص ومقابلته بين العين الشريرة وصلاح صاحب الكرم، ولا يحسم الدلالة في تفسير واحد؛ وتوضح الحاشية معنى الحسد أو الاستياء المرجح في السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. استُخدم «يحقّ لي» بدل «يحلّ لي» لطبيعته في العربية الحديثة، مع إبقاء صورة «العين الشريرة» وشرحها في الحاشية.
