id: MAT.20.28
reference: Matthew 20:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ar
  text: كما أن ابن الإنسان لم يأتِ ليُخدَم، بل ليَخدِم، وليبذل حياته فديةً عن كثيرين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير أكثر صراحة: «فديةً بدلًا من كثيرين».'
    reason: بديل معجمي يبرز بصورة أوضح قوة ἀντί الدالة على النيابة أو الحلول محلّ الغير.
lexical_decisions:
- source_word: ὥσπερ
  choice: كما أن
  rationale: تُدخل المقارنة بما سبق بعبارة عربية طبيعية وتحفظ قوة التشبيه.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية المألوفة لهذا اللقب، وتحفظ أصداءه الكتابية ولا سيما صلته بسفر دانيال.
- source_word: οὐκ ἦλθεν
  choice: لم يأتِ
  rationale: ينقل الماضي اليوناني بصيغة عربية موجزة من غير إضافة مكان أو دلالة زمنية غير واردة.
- source_word: διακονηθῆναι
  choice: ليُخدَم
  rationale: يحفظ صيغة المبني للمجهول والتقابل اللفظي مع الفعل التالي بلغة واضحة غير كهنوتية.
- source_word: ἀλλὰ διακονῆσαι
  choice: بل ليَخدِم
  rationale: يحفظ المقابلة المباشرة بين أن يُخدَم وأن يَخدِم، بصياغة عربية طبيعية.
- source_word: καὶ δοῦναι
  choice: وليبذل
  rationale: «يبذل» تعبير عربي طبيعي عن تقديم الحياة طوعًا، ويلائم سياق الموت من غير تحميل العبارة تفسيرًا زائدًا.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: حياته
  rationale: تشير ψυχή هنا إلى الحياة التي تُقدَّم حتى الموت، لا إلى النفس غير المادية وحدها.
- source_word: λύτρον
  choice: فديةً
  rationale: تنقل معنى الثمن المدفوع لإطلاق سراح أو افتداء، وهي لفظة عربية موجزة وراسخة.
- source_word: ἀντὶ πολλῶν
  choice: عن كثيرين
  rationale: صياغة عربية مألوفة مع «فدية» تدل على النيابة، مع توثيق معنى الاستبدال الأصرح في الحاشية.
theological_decisions:
- issue: دلالة ἀντί في قول الفدية
  choice: فديةً عن كثيرين
  alternative: فديةً بدلًا من كثيرين
  rationale: تعبير «عن كثيرين» عربي طبيعي ويحفظ معنى النيابة، بينما تُظهر الحاشية بوضوح أكبر دلالة المقابلة أو الحلول محلّ الآخرين التي قد تحملها ἀντί، من غير حسم التوتر الدلالي أو إخفائه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على التوازي بين «ليُخدَم» و«ليَخدِم». وُضعت علامة الحاشية بعد العبارة التي تتناولها مباشرة.
