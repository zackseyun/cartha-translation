  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: ar
  text: خُذْ ما لكَ واذهبْ. لكنني أريد أن أُعطي هذا الأخير كما أعطيك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: خُذْ
  rationale: فعل أمر يفيد هنا أن يأخذ العامل ما يخصه؛ والصياغة العربية مباشرة وطبيعية.
- source_word: τὸ σὸν
  choice: ما لكَ
  rationale: تحافظ على عموم العبارة اليونانية «ما هو لك» من غير إضافة «أجرتك» صراحة، مع أن السياق سياق أجرة.
- source_word: ὕπαγε
  choice: اذهبْ
  rationale: ينقل أمر الانصراف بإيجاز من غير أن يضيف نبرة عدائية غير لازمة.
- source_word: θέλω δὲ
  choice: لكنني أريد
  rationale: ينقل الإرادة التي يصرّح بها المتكلم، مع تمثيل δέ بأداة استدراك خفيفة.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: هذا الأخير
  rationale: تعبير عربي طبيعي يحيل إلى العامل الفرد المذكور في المثل، ويحافظ على معنى «الأخير».
- source_word: δοῦναι
  choice: أن أُعطي
  rationale: يحافظ على المعنى الأساسي للفعل δίδωμι بدل تخصيصه بالدفع، ويُبقي التركيز على حرية صاحب العمل في العطاء.
- source_word: ὡς καὶ σοί
  choice: مثلما أعطيتُكَ
  rationale: يجعل المقارنة المفهومة من السياق طبيعية في العربية؛ وإعادة فعل العطاء المقدر توضح تساوي المعاملة من غير تغيير المعنى.
theological_decisions:
- issue: تعيين جنس المشار إليه بالمفرد المذكر
  choice: هذا الأخير
  alternative: هذا الرجل الأخير
  rationale: صيغتا اسم الإشارة والصفة في العربية مذكرتان وتطابقان المرجع الذكر في اليونانية والسياق، فلا حاجة إلى إضافة كلمة «الرجل» غير الموجودة صراحة في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة، بأوامر مباشرة وصياغة طبيعية. لم تُضف حاشية لأن البديل الوارد في الطبقة الإنجليزية يخص على الأرجح موضع العبارة أو صياغتها، بينما ترتيب اليونانية ومعناها واضحان هنا.
