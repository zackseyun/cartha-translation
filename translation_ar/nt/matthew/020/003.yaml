source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: ar
  text: وخرج نحو الساعة الثالثة[a]، فرأى آخرين واقفين بلا عمل[b] في ساحة السوق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الساعة التاسعة صباحًا. تُحسب «الساعة الثالثة» هنا بحسب تقسيم ساعات النهار ابتداءً من شروق الشمس.
    reason: cultural_note
  - marker: b
    text: 'أو: «عاطلين». تفيد الكلمة اليونانية أنهم لم يكونوا يعملون.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: خرج
  rationale: اسم فاعل ماضٍ من ἐξέρχομαι يدل على فعل سبق الرؤية في تتابع السرد؛ وصيغة الفعل الماضي طبيعية في العربية وتحفظ هذا التتابع.
- source_word: περὶ τρίτην ὥραν
  choice: نحو الساعة الثالثة
  rationale: يحفظ التعبير الزمني اليهودي الوارد في النص، مع نقل περὶ الدالة على التقريب؛ ويوضَّح المقابل الزمني الحديث في الحاشية.
- source_word: εἶδεν
  choice: فرأى
  rationale: ترجمة مباشرة للفعل ὁράω، والفاء تُظهر تعاقب الخروج والرؤية بصورة طبيعية في السرد العربي.
- source_word: ἄλλους
  choice: آخرين
  rationale: الصفة مستعملة استعمال الاسم، ولا حاجة إلى إضافة «رجال» لأن اليونانية لم تصرّح بها.
- source_word: ἑστῶτας
  choice: واقفين
  rationale: ينقل الحالة المستمرة التي تفيدها صيغة اسم الفاعل التام من ἵστημι.
- source_word: ἀγορᾷ
  choice: ساحة السوق
  rationale: تشير ἀγορά إلى الساحة العامة التي كانت موضعًا للبيع والتجمع وانتظار العمال، و«ساحة السوق» أوضح من «السوق» وحدها.
- source_word: ἀργούς
  choice: بلا عمل
  rationale: ينقل المعنى السياقي، أي أنهم لم يكونوا يعملون، بلغة عربية واضحة من غير تحميل اللفظ مفهوم البطالة الاقتصادي الحديث؛ وتُذكر «عاطلين» بديلًا في الحاشية.
