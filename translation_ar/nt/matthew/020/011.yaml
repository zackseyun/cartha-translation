lexical_decisions:
- source_word: λαβόντες
  choice: ولمّا أخذوا أجرتهم
  rationale: اسم الفاعل الأوريستي يدل على فعل سابق للفعل الرئيس. وصيغة «لمّا أخذوا» طبيعية في العربية وتوضح التعاقب الزمني. المفعول محذوف في اليونانية، ويبيّن السياق أنه الأجرة، فذُكر للتوضيح.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة تواصل مجرى الكلام، ولا تستلزم هنا استدراكًا قويًا.
- source_word: ἐγόγγυζον
  choice: أخذوا يتذمّرون
  rationale: صيغة الماضي الناقص تحتمل الفعل المستمر أو الابتدائي؛ وتعبير «أخذوا يتذمّرون» ينقل بدء الفعل واستمراره، مع إبقاء دلالة الشكوى الساخطة.
- source_word: κατὰ
  choice: على
  rationale: تفيد κατά مع المضاف إليه توجيه التذمر ضد شخص؛ و«يتذمّرون على» تعبير عربي طبيعي يؤدي معنى الاعتراض الموجّه إليه.
- source_word: τοῦ οἰκοδεσπότου
  choice: ربّ البيت
  rationale: ينقل المعنى المركب للكلمة، أي سيد البيت أو رب الأسرة والعقار، وهو موجز ومألوف في العربية الفصحى.
