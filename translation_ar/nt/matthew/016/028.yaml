id: MAT.16.28
reference: Matthew 16:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: ar
  text: 'الحق أقول لكم: إن بعض الواقفين هنا لن يذوقوا الموت البتة[a] حتى يروا ابن الإنسان آتيًا[b] في ملكوته[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لن يذوقوا الموت بأي حال»؛ ففي اليونانية نفي مشدَّد.'
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «ابن الإنسان آتيًا في ملكوته» إلى التجلي، أو القيامة والتمجيد، أو حلول الدينونة بأورشليم، أو الخمسين، أو المجيء الأخير؛ والنص نفسه لا يعيّن أيَّ حدث منها.
    reason: alternative_reading
  - marker: c
    text: 'أو: «في مُلكه» أو «في سلطانه الملكي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي قوة التوكيد الجليل الذي يستهل به يسوع قوله، بصياغة عربية كتابية واضحة ومفهومة، من غير الاكتفاء بالنقل الصوتي «آمين».
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحفظ صيغة المخاطبة وسلطة القول.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: إن بعض الواقفين هنا
  rationale: تحفظ دلالة التبعيض في τινες مع ربطها طبيعيًا بجماعة الحاضرين الذين يقفون هناك.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: لن يذوقوا الموت البتة
  rationale: تحفظ استعارة «ذوق الموت»، وتؤدي «البتة» قوة النفي اليوناني المشدد οὐ μή.
- source_word: ἕως ἂν ἴδωσιν
  choice: حتى يروا
  rationale: صياغة عربية موجزة وطبيعية للبناء الزمني الدال على حدث مستقبل.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: تحفظ اللقب كما هو، بما له من صدى كتابي ورؤيوي، من غير تفسيره داخل النص.
- source_word: ἐρχόμενον
  choice: آتيًا
  rationale: اسم فاعل يطابق البناء اليوناني ويصف ابن الإنسان حال مجيئه، من غير إضافة «بقوة» أو غيرها مما لا يرد في الآية.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: في ملكوته
  rationale: «الملكوت» يؤدي βασιλεία ويحفظ الصورة التقليدية الملموسة، مع الإبقاء على احتمال معنى المُلك أو السلطان الملكي في الحاشية.
theological_decisions:
- issue: الحدث المقصود بمجيء ابن الإنسان في ملكوته
  choice: إبقاء العبارة من غير تعيين الحدث المقصود
  alternative: التجلي، أو القيامة والتمجيد، أو حلول الدينونة بأورشليم، أو الخمسين، أو المجيء الأخير
  rationale: النص اليوناني لا يحدد الحدث صراحة، ولذلك تحفظ الترجمة الغموض والتوتر التفسيري بدل حسمهما.
- issue: دلالة βασιλεία
  choice: ملكوته
  alternative: مُلكه أو سلطانه الملكي
  rationale: يمكن أن تدل الكلمة على المملكة أو فعل المُلك والسلطان؛ واختيار «ملكوته» يحفظ المصطلح والصورة من غير تضييق الدلالة على مفهوم مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة جليلة. حُفظت التعبيرات الكتابية المفهومة مثل «يذوقوا الموت» و«ابن الإنسان» و«ملكوته»، مع تجنب الألفاظ المذهبية والتفسير الحاسم داخل المتن.
