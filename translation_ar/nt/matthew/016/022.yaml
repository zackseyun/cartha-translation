  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: ar
  text: 'فأخذ بطرس يسوعَ على حدة، وبدأ ينتهره قائلًا: «حاشاك يا رب![a] لن يحدث لك هذا أبدًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رحمة لك يا رب!» أو: «لا سمحَ الله يا رب!» فالعبارة اليونانية اصطلاحية موجزة حُذف بعض عناصرها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος αὐτόν
  choice: أخذ بطرس يسوع جانبًا
  rationale: يفيد الفعل في هذا السياق أن بطرس استدعى يسوع إلى ناحية ليتحدث إليه على انفراد. أُظهر اسم «يسوع» بدل الضمير منعًا للالتباس في العربية.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: ابتدأ ينتهره
  rationale: يحافظ «ابتدأ» على دلالة الشروع، وينقل «ينتهره» معنى التوبيخ الحاد من غير تلطيف.
- source_word: Ἵλεώς σοι
  choice: حاشا لك
  rationale: تعبير عربي طبيعي ينقل قوة الاحتجاج والاستبعاد في العبارة اليونانية الاصطلاحية الموجزة، من غير إضافة اسم الله إلى المتن مع أنه غير مذكور صراحة.
- source_word: κύριε
  choice: يا رب
  rationale: «رب» المقابل المعتاد لـ κύριος، ويحفظ دلالة خطاب بطرس ليسوع واحترامه له.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: لن يحدث لك هذا أبدًا
  rationale: يجمع بين «لن» و«أبدًا» لنقل النفي اليوناني المؤكد، ويصوغ σοι بصورة عربية طبيعية.
theological_decisions:
- issue: نقل احتجاج بطرس من غير إدخال فاعل إلهي غير مصرَّح به
  choice: حاشا لك يا رب!
  alternative: رحمة لك يا رب! / لا سمح الله يا رب!
  rationale: العبارة Ἵλεώς σοι اصطلاحية وموجزة، ويمكن فهمها كتمنٍّ بالرحمة أو كصيغة استبعاد قوية. اختيرت «حاشا لك» لأنها تحفظ قوة رفض بطرس ولا تضيف «الله» إلى المتن، مع إثبات الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «ينتهره» لإبقاء حدة تصرف بطرس، و«حاشا لك» لصون إيجاز العبارة وقوة الاحتجاج. وُضع اسم يسوع بدل الضمير الأول لتجنب غموض مرجع الضمائر في العربية.
