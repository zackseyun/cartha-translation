  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «تنبَّهوا واحذروا من خمير[a] الفريسيين والصدوقيين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خميرة». اللفظ اليوناني يشير إلى ما يُخمِّر العجين، ويَرِد هنا مجازًا؛ ويبيّن السياق اللاحق صلته بتعليم الفريسيين والصدوقيين أو تأثيرهم.
    reason: بديل معجمي مع توضيح الصورة المجازية من السياق
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا مرتبطًا بالسياق السابق مع مسحة مقابلة خفيفة، من غير تشديدها إلى استدراك صريح.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: نقل مباشر وطبيعي للفعل مع المفعول غير المباشر.
- source_word: Ὁρᾶτε
  choice: تنبَّهوا
  rationale: الفعل هنا أمر تحذيري لا دعوة حرفية إلى النظر؛ و«تنبَّهوا» يؤدي وظيفته بوضوح في العربية المعاصرة.
- source_word: προσέχετε ἀπὸ
  choice: احذروا من
  rationale: تعبير عربي طبيعي يحافظ على التحذير الثاني وعلى تقوية الأمر بتجاور الفعلين.
- source_word: ζύμης
  choice: خمير
  rationale: يحافظ على صورة المادة التي تُخمّر العجين وعلى طابعها المجازي، من غير استباق تفسيرها اللاحق في السياق.
- source_word: Φαρισαίων
  choice: الفريسيين
  rationale: الصيغة العربية المعيارية لاسم هذه الجماعة.
- source_word: Σαδδουκαίων
  choice: الصدوقيين
  rationale: الصيغة العربية المعيارية لاسم هذه الجماعة.
theological_decisions:
- issue: الدلالة المجازية للخمير
  choice: الإبقاء على «خمير» في المتن من غير تفسير مباشر
  alternative: تعاليم الفريسيين والصدوقيين أو تأثيرهم
  rationale: النص نفسه يصوغ التحذير مجازيًا، ويأتي بيان المقصود لاحقًا في السياق؛ لذلك لا ينبغي إحلال التفسير محل الصورة في هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة تحذيرية كريمة. حُفظ التكرار البلاغي في فعلي الأمر «تنبَّهوا واحذروا»، وأُبقيت صورة الخمير من دون حلّ دلالتها داخل المتن.
