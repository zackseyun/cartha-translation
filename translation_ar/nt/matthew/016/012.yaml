id: MAT.16.12
reference: Matthew 16:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: ar
  text: عندئذ فهموا أنه لم يقل لهم أن يحذروا من خميرة الخبز[a]، بل من تعليم الفريسيين والصدوقيين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خميرة الأرغفة». فالاسم اليوناني هنا بصيغة الجمع.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: عندئذ
  rationale: ظرف زمني يحدد اللحظة التي فهم فيها التلاميذ المقصود، و«عندئذ» فصيحة وطبيعية في العربية المعاصرة.
- source_word: συνῆκαν
  choice: فهموا
  rationale: ينقل بوضوح معنى وصولهم إلى الفهم، من غير إضافة تفسير زائد.
- source_word: οὐκ εἶπεν
  choice: لم يقل لهم
  rationale: «لم يقل» يقابل النفي مع الفعل الماضي، وأُضيفت «لهم» لإيضاح جهة الخطاب التي يدل عليها السياق وبنية القول مع المصدر.
- source_word: προσέχειν ἀπό
  choice: أن يحذروا من
  rationale: في سياق التحذير تفيد العبارة التنبه والاحتراس من شيء، وهذه الصياغة عربية طبيعية وتحفظ قوة التنبيه.
- source_word: τῆς ζύμης
  choice: خميرة
  rationale: تحفظ الصورة المجازية المأخوذة من مادة تخمير العجين من غير تفسيرها بأوصاف غير واردة في الآية.
- source_word: τῶν ἄρτων
  choice: الخبز
  rationale: استُعمل اسم الجنس الجمعي الطبيعي في العربية بدل صيغة «الأرغفة» الأثقل في هذا التركيب، مع بيان صيغة الجمع اليونانية في الحاشية.
- source_word: διδαχῆς
  choice: تعليم
  rationale: لفظ واضح ومعاصر يدل على مضمون ما يُعلَّم، من غير إيحاء اصطلاحي طائفي.
- source_word: Φαρισαίων
  choice: الفريسيين
  rationale: الصيغة العربية القياسية الشائعة لاسم هذه الجماعة.
- source_word: Σαδδουκαίων
  choice: الصدوقيين
  rationale: الصيغة العربية القياسية الشائعة لاسم هذه الجماعة.
theological_decisions:
- issue: الدلالة المجازية للخميرة
  choice: الإبقاء على «خميرة» ثم بيان أن المقصود هو تعليم الفريسيين والصدوقيين، كما تفعل الآية نفسها.
  alternative: توسيع العبارة إلى «ريائهم» أو «تعليمهم الفاسد».
  rationale: تفسر الآية الخميرة بأنها التعليم، لكنها لا تضيف هنا وصفًا أخلاقيًا محددًا لذلك التعليم؛ لذا لا تُستورد تفسيرات من مواضع موازية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على المقابلة بين المعنى الحرفي للخميرة والمعنى المقصود، وتجنبت المصطلحات الكنسية الثقيلة والتفسير الزائد.
