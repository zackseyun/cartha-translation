  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: ar
  text: فماذا ينتفع الإنسان إن ربح العالم كله وخسر حياته[a]؟ أو ماذا يعطي الإنسان مقابلًا لحياته؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نفسه» في الموضعين اللذين وردت فيهما «حياته». يمكن للكلمة اليونانية ψυχή أن تعني «الحياة» أو «النفس» أو «الذات»، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: فماذا
  rationale: تنقل أداة الاستفهام مع قوة γάρ التفسيرية الرابطة بما سبق، بصياغة عربية طبيعية.
- source_word: ὠφεληθήσεται ἄνθρωπος
  choice: ينتفع الإنسان
  rationale: الفعل اليوناني المبني للمجهول يدل على نيل المنفعة، والعربية تعبّر عنه طبيعيًا بالفعل «ينتفع» من غير إخلال بالمعنى.
- source_word: τὸν κόσμον ὅλον κερδήσῃ
  choice: ربح العالم كله
  rationale: يحفظ صورة الربح وشمول العالم بأسره، ويمهّد للمقابلة مع الخسارة.
- source_word: τὴν ... ψυχὴν αὐτοῦ ζημιωθῇ
  choice: خسر حياته
  rationale: يمكن أن تدل ψυχή على الحياة أو النفس أو الذات، و«حياته» واضحة في السياق؛ أما ζημιόω فيفيد تكبّد الخسارة أو فقدان الشيء.
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: فداءً عن حياته
  rationale: ἀντάλλαγμα هو ما يُعطى مقابل شيء لاسترداده؛ و«فداءً عن» تعبير عربي موجز يحفظ صورة المقابل من غير أن يفرض هنا نظرية فدائية تفصيلية.
theological_decisions:
- issue: دلالة ψυχή في قول يتناول الخسارة القصوى
  choice: الحياة
  alternative: النفس
  rationale: السياق لا يوجب حصر اللفظة في النفس غير المادية، بل يمكن أن تشير إلى حياة الإنسان أو ذاته في معناها الكامل. أُثبت البديل «النفس» في الحاشية لصون الاحتمال المعجمي والوقع اللاهوتي التقليدي.
- issue: دلالة ἀντάλλαγμα
  choice: فداءً عن
  alternative: مقابلًا لـ
  rationale: «فداء» هنا بمعنى ما يُبذل لاسترجاع الحياة، وهو مناسب للسؤال البلاغي، من غير تحميل اللفظة عقيدة فداء محددة لا يصرّح بها السياق.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُخدم «الإنسان» استعمالًا عامًا موافقًا لـἄνθρωπος، وحُفظ التوازي البلاغي بين الربح والخسارة وبين السؤالين.
