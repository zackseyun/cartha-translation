  text: ولا الأرغفة السبعة للأربعة آلاف، وكم سلة كبيرة جمعتم؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: ولا
  rationale: تصل الجملة بما قبلها ضمن سلسلة من الأسئلة الاستنكارية، وتحافظ «ولا» على معنى الإضافة المنفية في الأصل.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: أرغفة الخبز السبعة
  rationale: «أرغفة الخبز» تعبير عربي واضح وطبيعي يحفظ الصورة الملموسة للأرغفة.
- source_word: τῶν τετρακισχιλίων
  choice: التي أطعمتُ بها الأربعة آلاف
  rationale: يفيد المضاف إليه هنا الارتباط بحادثة إطعام الأربعة آلاف؛ والتصريح بالعلاقة يجعل العبارة طبيعية وواضحة بالعربية من غير تغيير مرجعها السياقي.
- source_word: πόσας
  choice: كم
  rationale: أداة الاستفهام العربية المباشرة المطابقة للسؤال عن عدد السلال.
- source_word: σπυρίδας
  choice: سلّةً كبيرةً
  rationale: ينبغي إظهار أن σπυρίς تدل على سلة كبيرة، مع الحفاظ على التمييز المعجمي بينها وبين κόφινος في روايتي الإطعام.
- source_word: ἐλάβετε
  choice: رفعتم
  rationale: في سياق جمع الكسر، «رفعتم» تنقل فعل أخذ ما بقي ورفعه، وتنسجم مع التعبير الكتابي العربي الواضح.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. صيغت العبارة بوصفها تتمة للسؤال السابق، لذلك تبدأ بـ«ولا». أُظهر الارتباط السياقي بين الأرغفة والأربعة آلاف بعبارة «التي أطعمتُ بها»، وهي معلومة يقتضيها السياق القريب.
