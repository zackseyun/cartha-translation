source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: ar
  text: فإن ابن الإنسان مزمع أن يأتي[a] في مجد أبيه مع ملائكته، وحينئذ يجازي كل واحد بحسب عمله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سيأتي» أو «مقبل على أن يأتي». يفيد التعبير اليوناني حرفيًا أنه «مزمع أن يأتي»، وفيه إحساس بأن المجيء وشيك أو مقبل.
    reason: lexical_alternative
  - marker: b
    text: أو «بحسب ما عمل». يرد «العمل» في اليونانية بصيغة المفرد، موزعًا على كل إنسان، ويمكن أن يدل على مجمل فعله أو سلوكه.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει ... ἔρχεσθαι
  choice: مزمع أن يأتي
  rationale: يحافظ هذا التعبير على معنى الإقبال والوشوك الذي تضيفه μέλλει إلى فعل المجيء، من غير اختزاله إلى مجرد صيغة مستقبل.
- source_word: γὰρ
  choice: فإن
  rationale: تربط «فإن» الآية بما قبلها بوصفها تعليلًا، وتأتي طبيعية في العربية الفصحى.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: هو المقابل العربي المستقر لهذا اللقب، ويحفظ صداه الكتابي وصلته بصورة دانيال.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: في مجد أبيه
  rationale: تحفظ «في» دلالة ἐν على المجال أو المظهر الذي يتم فيه المجيء، مع إبقاء علاقة المجد بالأب صريحة.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: مع ملائكته
  rationale: ترجمة مباشرة وطبيعية لمعنى المصاحبة في μετά مع المضاف إليه.
- source_word: καὶ τότε
  choice: وحينئذ
  rationale: تحفظ أداة الربط والتتابع الزمني بين المجيء والمجازاة.
- source_word: ἀποδώσει
  choice: يجازي
  rationale: تنقل معنى إعطاء كل إنسان ما يستحقه في سياق الدينونة، من غير قصر اللفظ على الثواب وحده.
- source_word: ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: كل واحد بحسب عمله
  rationale: تحفظ القوة التوزيعية لـἑκάστῳ والمفرد πρᾶξιν، بينما تستعمل «عمل» بمعناها الجامع للسلوك أو ما فعله الإنسان.
theological_decisions:
- issue: الدلالة الأخروية لـμέλλει مع مجيء ابن الإنسان
  choice: إبقاء معنى الإقبال والوشك في «مزمع أن يأتي».
  alternative: «سيأتي» أو «آتٍ».
  rationale: يصرح اليوناني بـμέλλει مع المصدر، فلا ينبغي تسطيح ما في العبارة من إحساس بقرب الحدث أو كونه مقبلًا، ولا حسم النقاش المتعلق بتوقيته.
- issue: الدينونة بحسب العمل
  choice: «يجازي كل واحد بحسب عمله».
  alternative: «يكافئ كل واحد بحسب ما عمل» أو «يرد لكل واحد وفق أعماله».
  rationale: تثبت الصياغة المجازاة الفردية بحسب العمل من غير إدخال منظومة عقائدية أوسع، كما تبقي المجازاة محتملة للثواب أو العقاب بحسب مقتضى الدينونة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «مزمع» لصون دلالة الإقبال في الأصل، وأُرفقت بحاشية لأنها أفصح وأقل تداولًا من صيغة المستقبل البسيطة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما مباشرة.
