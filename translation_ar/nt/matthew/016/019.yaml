id: MAT.16.19
reference: Matthew 16:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ar
  text: وسأعطيك مفاتيح ملكوت السماوات[a]، وكل ما تربطه[c] على الأرض سيكون قد رُبط في السماوات[b]، وكل ما تحلّه على الأرض سيكون قد حُلّ في السماوات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاءت «السماوات» في اليونانية بصيغة الجمع؛ وهذا تعبير يكثر في إنجيل متى.
    reason: lexical_note
  - marker: b
    text: 'يمكن أن تُترجم ترجمة أبسط: «سيكون مربوطًا... سيكون محلولًا». أما «سيكون قد رُبط... سيكون قد حُلّ» فتعكس بصورة أدق تركيب المستقبل مع اسم المفعول التام في اليونانية.'
    reason: alternative_reading
  - marker: c
    text: قد يحمل «الربط» و«الحل» معنى المنع والسماح، أو فرض الالتزام ورفعه؛ وقد أبقى المتن الاستعارة اليونانية من غير حصرها في أحد هذه المعاني.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: سأعطيك
  rationale: ينقل المستقبل الوعدي مع المفعول غير المباشر بصياغة عربية طبيعية ومباشرة.
- source_word: τὰς κλεῖδας
  choice: مفاتيح
  rationale: يحافظ على صورة المفاتيح كما وردت، من غير تفسيرها بإضافة معنى سلطوي محدد.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: ينقل التعبير المتاوي بصيغة الجمع، ويحافظ على لفظ «الملكوت» المألوف والدال على المُلك أو السلطان الملكي، من غير حصره في مكان.
- source_word: ὃ ἐὰν
  choice: كل ما
  rationale: صياغة عربية طبيعية للموصول العام المتكرر في الجملتين.
- source_word: δήσῃς
  choice: تربطه
  rationale: يحفظ استعارة الربط وما تحتمله من دلالة المنع أو الإلزام، من غير إدخال هذا التفسير في المتن.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: ينقل المقابلة المكانية الاصطلاحية مع السماوات بعبارة عربية واضحة.
- source_word: ἔσται δεδεμένον
  choice: سيكون قد رُبط
  rationale: يعكس تركيب المستقبل مع اسم المفعول التام، فيدل على حالة مستقبلية ناتجة من فعل مكتمل، بدل تسويته بالمستقبل المبني للمجهول البسيط.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: يحافظ على صيغة الجمع في اليونانية وعلى المقابلة بين الأرض والسماوات.
- source_word: λύσῃς
  choice: تحلّه
  rationale: يحافظ على التقابل الاستعاري المباشر بين الربط والحل، مع إبقاء مجال المعنى مفتوحًا للسماح أو رفع الإلزام.
- source_word: ἔσται λελυμένον
  choice: سيكون قد حُلّ
  rationale: ينقل، بالتوازي مع عبارة الربط، المستقبل الدال على حالة ناشئة من فعل مكتمل.
theological_decisions:
- issue: دلالة صيغة الربط والحل بين الأرض والسماوات
  choice: سيكون قد رُبط / سيكون قد حُلّ
  alternative: سيُربط / سيُحلّ، أو سيكون مربوطًا / محلولًا
  rationale: التركيب اليوناني ἔσται مع اسم المفعول التام يبرز حالة مستقبلية مترتبة على فعل مكتمل. تحافظ الصياغة المختارة على هذه الدلالة الممكنة، وعلى احتمال أن الفعل الأرضي يوافق حكمًا سماويًا، من غير تحويل هذا الاحتمال النحوي إلى تقرير مذهبي صريح.
- issue: معنى مفاتيح ملكوت السماوات
  choice: الإبقاء على استعارة «المفاتيح»
  alternative: التفسير في المتن بأنها سلطة الإدخال والإخراج أو سلطة الوكالة
  rationale: الصورة توحي بالسلطة، لكن النص نفسه لا يفكك الاستعارة ولا يحدد نظامًا كنسيًا بعينه؛ لذلك أُبقيت الصورة كما هي.
- issue: مدى معنى الربط والحل
  choice: الإبقاء على «تربطه» و«تحلّه»
  alternative: تمنعه وتسمح به، أو تلزمه وترفع إلزامه
  rationale: يمكن أن يدل التعبيران في السياق اليهودي على المنع والسماح أو فرض الالتزام ورفعه، لكن الاستعارة اليونانية أوسع من أن تُحصر في تفسير واحد.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «ملكوت السماوات» للمحافظة على التعبير المتاوي، وأُبقي تقابل «الربط والحل» لما فيه من إيجاز وقوة، مع شرح احتمالاته في الحاشية.
