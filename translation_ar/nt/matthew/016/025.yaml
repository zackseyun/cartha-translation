  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ar
  text: لِأَنَّ مَنْ يُرِدْ أَنْ يَحْفَظَ حَيَاتَهُ فَسَيَفْقِدُهَا، وَأَمَّا مَنْ يَفْقِدْ حَيَاتَهُ مِنْ أَجْلِي فَسَيَجِدُهَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نفسه» في الموضعين؛ فالكلمة اليونانية يمكن أن تعني «الحياة» أو «النفس» أو «الذات» بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: لأن من ... وأما من
  rationale: يؤدي «مَن» معنى الشرط العام غير المحدد، وتحفظ «لأن» صلة γάρ بما سبق، بينما تُظهر «وأما» المقابلة التي تفيدها δέ.
- source_word: θέλῃ
  choice: يُرِدْ
  rationale: تعبير عربي فصيح وطبيعي عن الإرادة التي يدل عليها الفعل θέλω.
- source_word: ψυχὴν
  choice: حياته
  rationale: السياق يتناول مفارقة حفظ الحياة وفقدها والعثور عليها في اتباع يسوع؛ و«الحياة» أوضح هنا من حصر اللفظ في النفس غير المادية، مع إثبات البديل في الحاشية.
- source_word: σῶσαι
  choice: يُخلِّص
  rationale: يحفظ المعنى الأساسي للفعل والتوازي اللفظي مع الفقد، دون توسيع تفسيري.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: فسيفقدها / يفقد
  rationale: «يفقد» يلائم السياق أكثر من «يهلك» أو «يدمر»؛ وحُفظ المستقبل في الجملة الأولى، بينما صيغت الثانية شرطًا عامًا كما في اليونانية.
- source_word: ἕνεκεν ἐμοῦ
  choice: من أجلي
  rationale: ينقل السبب أو الدافع مع إبراز التعلق الشخصي بيسوع.
- source_word: εὑρήσει
  choice: فسيجدها
  rationale: ترجمة مباشرة تحفظ حدة المفارقة ولا تستبدل «يجد» بتفسير مثل «يربح».
- source_word: αὐτοῦ / αὐτήν
  choice: حياته / ها
  rationale: يحفظ المفرد المذكر التمثيلي في اليونانية، ويعيد الضمير المؤنث في العربية إلى «الحياة».
theological_decisions:
- issue: دلالة ψυχή في مفارقة التلمذة
  choice: الحياة
  alternative: النفس أو الذات
  rationale: أفعال التخليص والفقد والعثور، مع سياق احتمال الموت في اتباع يسوع، تجعل «الحياة» الأنسب عربيًا، مع إبقاء السعة الدلالية للكلمة اليونانية في الحاشية بدل حصرها لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم تركيب «من ... فـ» لإبراز الشرط والنتيجة، و«وأما» لإظهار التضاد. وُضع مؤشر الحاشية بعد الآية لأنه يخص تكراري «حياته» كليهما.
