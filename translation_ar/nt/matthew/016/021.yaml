id: MAT.16.21
reference: Matthew 16:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: ar
  text: منذ ذلك الحين بدأ يسوع يبيّن لتلاميذه أنه لا بد له أن يذهب إلى أورشليم، وأن يعاني آلامًا كثيرة[a] على أيدي الشيوخ ورؤساء الكهنة والكتبة[b]، وأن يُقتل، وأن يُقام في اليوم الثالث[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «يتألم كثيرًا». والعبارة اليونانية حرفيًا أقرب إلى «يتألم أشياء كثيرة»، وفيها إبراز لتنوع أوجه المعاناة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من قِبل الشيوخ ورؤساء الكهنة والكتبة».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «يقوم». والفعل اليوناني مبني للمجهول: «يُقام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: منذ ذلك الحين
  rationale: تعبير عربي طبيعي يحفظ الدلالة الزمنية ويشير إلى بداية مرحلة جديدة في السرد.
- source_word: ἤρξατο
  choice: بدأ
  rationale: ينقل بوضوح ابتداء مرحلة جديدة من تعليم يسوع لتلاميذه.
- source_word: δεικνύειν
  choice: يبيّن
  rationale: يحفظ معنى الإظهار والإيضاح من غير أن يضيف تفصيلًا غير مذكور في النص.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: صياغة عربية طبيعية تحافظ على المخاطَبين وعلاقتهم بيسوع.
- source_word: δεῖ αὐτὸν
  choice: لا بد له أن
  rationale: ينقل معنى الضرورة بقوة، من غير تحديد مصدرها أو تفسيرها لاهوتيًا في العبارة نفسها.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: يذهب إلى أورشليم
  rationale: تعبير عربي واضح وطبيعي للحركة نحو المدينة.
- source_word: πολλὰ παθεῖν
  choice: يعاني آلامًا كثيرة
  rationale: صياغة طبيعية تحافظ قدر الإمكان على صيغة الجمع التي توحي بتنوع أوجه المعاناة، لا بمجرد شدتها.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: على أيدي الشيوخ ورؤساء الكهنة والكتبة
  rationale: يبين في العربية علاقة هؤلاء بالمعاناة بوصفهم القائمين بها، وهي دلالة ἀπό مع المبني للمعلوم في هذا السياق.
- source_word: πρεσβυτέρων
  choice: الشيوخ
  rationale: المقابل الاصطلاحي المباشر لفئة من فئات القيادة اليهودية.
- source_word: ἀρχιερέων
  choice: رؤساء الكهنة
  rationale: المقابل الدقيق للجمع الذي يدل على جماعة القيادات الكهنوتية، لا على تعدد شاغلي منصب رئيس الكهنة في وقت واحد.
- source_word: γραμματέων
  choice: الكتبة
  rationale: مقابل مباشر يحافظ على المصطلح التاريخي بدل تفسير وظيفتهم داخل المتن.
- source_word: ἀποκτανθῆναι
  choice: يُقتل
  rationale: يحفظ المبني للمجهول ويؤدي المعنى بوضوح وإيجاز.
- source_word: ἐγερθῆναι
  choice: يُقام
  rationale: يحفظ صيغة المبني للمجهول في اليونانية ولا يحولها إلى فعل لازم بمعنى يقوم.
theological_decisions:
- issue: دلالة الضرورة في δεῖ
  choice: لا بد له أن
  alternative: ينبغي له أن؛ يجب عليه أن
  rationale: النص يقرر ضرورة ذهاب يسوع وآلامه وموته وإقامته، لكنه لا يحدد في هذه الجملة هل المقصود تدبير الله أم إتمام الكتب أم وجهًا آخر للضرورة؛ لذلك تُحفظ قوة العبارة من غير حسم تفسيرها.
- issue: صيغة ἐγερθῆναι
  choice: يُقام
  alternative: يقوم
  rationale: الفعل اليوناني مبني للمجهول. إبقاء المبني للمجهول يحفظ صياغة النص وما فيها من انفتاح على فاعل الإقامة، من غير إضافة اسمه إلى المتن.
- issue: علاقة القيادات بالآلام والموت
  choice: على أيدي الشيوخ ورؤساء الكهنة والكتبة
  alternative: من الشيوخ ورؤساء الكهنة والكتبة؛ من قِبل الشيوخ ورؤساء الكهنة والكتبة
  rationale: السياق يجعل القيادات مصدر الآلام والقائمين بها. اختير التعبير العربي الطبيعي، من غير توسيع لدورهم إلى ما وراء ما تفيده العبارة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُخدم «أورشليم» بوصفه الاسم الكتابي العربي المألوف، وحُفظت المصطلحات التاريخية «الشيوخ» و«رؤساء الكهنة» و«الكتبة». وُضعت جميع علامات الحواشي في مواضعها داخل المتن.
