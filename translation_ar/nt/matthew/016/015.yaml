  text: 'قال لهم: «أما أنتم، فمن تقولون إني أنا؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: المضارع التاريخي شائع في السرد اليوناني، وصيغة الماضي أفصح وأطبيعية في السرد العربي، من غير تغيير للزمن القصصي.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ضمير جمع في حالة الداتيف يدل على المخاطَبين بالفعل الكلامي.
- source_word: Ὑμεῖς
  choice: وأنتم
  rationale: إبراز الضمير المستقل يحفظ توكيد اليونانية والمقابلة مع آراء الآخرين في السياق السابق.
- source_word: δὲ
  choice: و
  rationale: مع الضمير المنفصل في «وأنتم» تؤدي الواو الاستئنافية معنى الانتقال المقابِل بصورة عربية طبيعية، من غير حاجة إلى «لكن» الأثقل هنا.
- source_word: τίνα
  choice: مَن
  rationale: اسم استفهام عن الهوية، وهو المقابل العربي الطبيعي في هذا التركيب.
- source_word: με ... εἶναι
  choice: إني أنا
  rationale: التركيب اليوناني من المفعول به مع المصدر يُنقل عربيًا إلى جملة اسمية بعد «إنّ»؛ والضمير المنفصل «أنا» يوضح أن السؤال عن هوية المتكلم ويحفظ بنية «مَن ... أكون» دلاليًا.
- source_word: λέγετε
  choice: تقولون
  rationale: مضارع مخاطب لجمع، ويقابله مباشرة «تقولون».
theological_decisions:
- issue: التوكيد على جواب التلاميذ أنفسهم
  choice: «وأنتم، مَن تقولون إني أنا؟»
  alternative: «لكن أنتم، مَن تقولون إني أنا؟»
  rationale: الصياغة المختارة تحفظ المقابلة التي يصنعها الضمير الصريح Ὑμεῖς مع السياق السابق، ولا تستبق مضمون اعتراف بطرس في العدد التالي ولا تضيف تفسيرًا عقائديًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير الماضي السردي لـλέγει لأنه الأسلوب الطبيعي في العربية، مع إبراز «وأنتم» لحفظ التوكيد والمقابلة. لا حاجة إلى حاشية لأن إعادة تركيب المفعول مع المصدر في صيغة «إني أنا» طبيعية في العربية ولا تخفي بديلًا دلاليًا مهمًا.
