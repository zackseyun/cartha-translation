lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجابهم قائلًا
  rationale: ينقل الصيغة السردية اليونانية «أجاب وقال» بعربية طبيعية، مع الحفاظ على معنى الجواب وتمهيد القول المباشر.
- source_word: Ὀψίας γενομένης
  choice: عندما يحلّ المساء
  rationale: ترجمة طبيعية للتركيب المطلق الدال على الزمن، وتحافظ على معنى حلول المساء.
- source_word: λέγετε
  choice: تقولون
  rationale: المضارع يدل هنا على قول معتاد ومتكرر في صيغة مثل سائر.
- source_word: Εὐδία
  choice: سيكون الطقس صحوًا
  rationale: اللفظة اسمية تفيد حسن الطقس وصفاءه؛ وصيغة التنبؤ تلائم المثل الجوي وسياقه في العربية.
- source_word: πυρράζει
  choice: محمرّة
  rationale: تفيد ظهور اللون الأحمر في السماء؛ و«محمرّة» عربية طبيعية ودقيقة دون المبالغة في شدة اللون.
- source_word: οὐρανός
  choice: السماء
  rationale: تعني هنا السماء المرئية في سياق علامة جوية؛ واللفظ العربي «السماء» طبيعي ويحفظ كذلك السعة المعجمية للكلمة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت صياغة طبيعية للمثل الجوي، مع إبقاء «السماء» بوصفها المقابل العربي المعتاد في هذا السياق. أُضيفت حاشية نصية لأن المقطع من «عندما يحلّ المساء» حتى نهاية الآية 3 محل اختلاف مهم في الشواهد اليونانية القديمة.
