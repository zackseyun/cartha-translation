  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: ar
  text: 'ولما جاء يسوع إلى نواحي قيصرية فيلبس، أخذ يسأل تلاميذه قائلًا: «من يقول الناس إن ابن الإنسان؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: ولما جاء
  rationale: ينقل اسم الفاعل الأوريستي مع δέ بوصفه انتقالًا سرديًا زمنيًا خفيفًا، من غير إضافة معنى «الآن» غير الموجود صراحةً.
- source_word: εἰς τὰ μέρη
  choice: إلى نواحي
  rationale: μέρη هنا تعني المنطقة أو الجهات المحيطة بالمدينة، و«نواحي» تعبير عربي طبيعي ودقيق.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: قيصرية فيلبس
  rationale: الصيغة العربية الشائعة لاسم الموضع، وتميزها من قيصرية الساحلية.
- source_word: ἠρώτα
  choice: أخذ يسأل
  rationale: ينقل دلالة الماضي الناقص على الفعل الجاري أو المبتدأ في السياق السردي، بصورة عربية طبيعية.
- source_word: μαθητὰς
  choice: تلاميذه
  rationale: «التلاميذ» المقابل المستقر والدقيق في سياق الأناجيل.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على البنية الحالية في اليونانية بأسلوب عربي فصيح ومألوف.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι
  choice: من يقول الناس
  rationale: ἄνθρωποι عامة تشمل البشر ولا تختص بالذكور؛ و«الناس» أنسب المقابلات العربية هنا.
- source_word: εἶναι
  choice: إن ... هو
  rationale: يحافظ على بنية القول غير المباشر ومعنى «يكون»، مع صياغة عربية واضحة.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ تعبير يسوع المميز عن نفسه وصِلته النصية المحتملة بدانيال 7، من غير تفسيره بلقب آخر.
theological_decisions:
- issue: ترجمة ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: «ابن الإنسان» هو التعبير العربي التقليدي الشفاف نسبيًا، ويحفظ الصياغة السامية والرنين الكتابي والتوتر بين الإشارة إلى الإنسان واللقب ذي الدلالة، بدل حسمها تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «نواحي» للدلالة على المنطقة المحيطة، و«أخذ يسأل» لإظهار جانب الماضي الناقص. وُضعت علامة الحاشية بعد السؤال الذي تتعلق بصياغته البديلة.
