lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: فأجاب
  rationale: يؤدي تركيب اسم الفاعل مع فعل القول وظيفة تمهيدية واحدة للكلام في السرد؛ و«فأجاب» عربية طبيعية تحفظ معنى الرد، كما تنقل الفاء انتقال δὲ الخفيف في السياق.
- source_word: Σίμων Πέτρος
  choice: سمعان بطرس
  rationale: نقل الاسمين وفق الصيغة العربية الكتابية الشائعة.
- source_word: Σὺ εἶ
  choice: أنت هو
  rationale: إبراز الضمير «أنت» يحفظ توكيد Σὺ، وضمير الفصل «هو» يلائم الجملة التعريفية ويبرز هوية المخاطَب.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: «المسيح» في العربية ترجمة راسخة للقب Χριστός وتحفظ دلالته اللقبية والمسيانية، لا بوصفه مجرد اسم شخصي.
- source_word: ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος
  choice: ابن الله الحي
  rationale: صيغة الإضافة العربية طبيعية وتحفظ التعريف والقوة اللقبية للعبارة، و«الحي» تنقل اسم الفاعل الوصفي ζῶντος.
theological_decisions:
- issue: الدلالة اللقبية لكلمة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي المباشر والراسخ للقب اليوناني، ويحفظ سياقه اليهودي المسياني؛ وتُذكر «المسيّا» في الحاشية لتوضيح معنى اللقب.
- issue: قوة عبارة «ابن الله»
  choice: ابن الله الحي
  alternative: —
  rationale: حُفظت العبارة الاعترافية كما وردت، من غير توسيعها بتعريفات عقائدية لاحقة أو تخفيف دلالتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة طبيعية موجزة، مع الحفاظ على توكيد الضمير وعلى الطابع الاعترافي واللقبي للعبارة.
