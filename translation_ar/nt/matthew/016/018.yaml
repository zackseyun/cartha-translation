id: MAT.16.18
reference: Matthew 16:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: ar
  text: 'وأنا أيضًا أقول لك: أنت بطرس، وعلى هذه الصخرة[a] سأبني كنيستي، وأبواب الهاوية[b] لن تقوى عليها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تُفهم «هذه الصخرة» على أنها تشير إلى بطرس، أو إلى اعتراف بطرس، أو إلى بطرس بصفته المعترف والممثل الرسولي.
    reason: alternative_reading
  - marker: b
    text: 'اليونانية: «هاديس»، أي عالم الأموات. وتقليديًا: «الجحيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: وأنا أيضًا
  rationale: يحفظ توكيد κἀγώ ومعنى الاستمرار أو المقابلة الخفيفة في δέ، ويُظهر أن القول يأتي جوابًا لما قاله بطرس من غير مبالغة في قوة المقابلة.
- source_word: σοι λέγω
  choice: أقول لك
  rationale: ترجمة مباشرة وطبيعية لـλέγω مع المفعول غير المباشر، وتحافظ على صيغة توجيه الكلام إلى بطرس.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية المألوفة للاسم، وهي تتيح إبقاء الصلة اللفظية والدلالية مع «الصخرة» بقدر ما تسمح به العربية.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: على هذه الصخرة
  rationale: تنقل معنى ἐπί مع المجرور ودلالة اسم الإشارة ταύτῃ، من غير تعيين مرجع «الصخرة» تفسيريًا.
- source_word: οἰκοδομήσω
  choice: سأبني
  rationale: تحافظ على استعارة البناء الصريحة في الفعل اليوناني وصيغة المستقبل.
- source_word: μου τὴν ἐκκλησίαν
  choice: كنيستي
  rationale: «الكنيسة» هي المقابل العربي المألوف للجماعة المنسوبة إلى المسيح في هذا السياق، والضمير المتصل يحفظ دلالة الملكية في μου.
- source_word: πύλαι ᾅδου
  choice: أبواب الهاوية
  rationale: «الهاوية» تقابل ᾅδης بوصفها عالم الأموات، وتتجنب الخلط بينها وبين جهنم بوصفها موضع العقاب النهائي، مع الحفاظ على صورة الأبواب.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: لن تقوى عليها
  rationale: تعبير عربي طبيعي ينقل معنى الغلبة والتفوق في κατισχύω، ويُبقي ضمير المؤنث عائدًا إلى الكنيسة.
theological_decisions:
- issue: مرجع «هذه الصخرة» (πέτρᾳ)
  choice: الإبقاء على «هذه الصخرة» من غير تحديد مرجعها داخل المتن
  alternative: قد تُفهم على أنها تشير إلى بطرس نفسه، أو إلى اعترافه، أو إلى بطرس بصفته المعترف والممثل الرسولي.
  rationale: يحافظ النص اليوناني على التلاعب اللفظي بين Πέτρος وπέτρα من غير أن يفصل صراحةً في جميع أبعاد المرجع؛ لذلك لا ينبغي للترجمة أن تحسم خلافًا تفسيريًا ولاهوتيًا يتجاوز صياغة النص.
- issue: دلالة ᾅδης
  choice: الهاوية
  alternative: 'عالم الأموات؛ وتقليديًا: الجحيم'
  rationale: تدل ᾅδης هنا على عالم الأموات، ولا تطابق بالضرورة مفهوم جهنم أو العقاب النهائي؛ فاختيار «الهاوية» يحفظ هذا التمييز.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم ترتيب طبيعي مع الحفاظ على توكيد «وأنا أيضًا»، وعلى استعارتَي البناء والأبواب، وعلى الغموض المقصود في مرجع «هذه الصخرة».
