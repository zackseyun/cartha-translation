  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: ar
  text: 'فالتفت وقال لبطرس: «اذهب خلفي يا شيطان! أنت حجر عثرة لي، لأنك لا تهتم بما لله، بل بما للبشر.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: فالتفت
  rationale: ينقل اسم الفاعل اليوناني الدال على التحول الجسدي قبل الكلام بعبارة عربية طبيعية موجزة.
- source_word: Ὕπαγε ὀπίσω μου
  choice: اذهب خلفي
  rationale: يحافظ على الفعل الحركي وعلى الدلالة المكانية لـὀπίσω، مع إبقاء احتمال الأمر بالابتعاد أو الرجوع إلى موضع التابع.
- source_word: Σατανᾶ
  choice: يا شيطان
  rationale: يحفظ اللقب/الاسم المعروف وحدّة التوبيخ من غير حسم ما إذا كان بطرس يُطابق الشيطان أو يقوم بدور معادٍ.
- source_word: σκάνδαλον
  choice: حجر عثرة
  rationale: تعبير عربي مألوف يحفظ صورة العائق الذي يسبب التعثر، وهو أنسب من ألفاظ مجردة مثل «إساءة».
- source_word: ἐμοῦ
  choice: لي
  rationale: ينقل علاقة العائق بيسوع بإيجاز ووضوح في العربية.
- source_word: φρονεῖς
  choice: تهتم
  rationale: يدل هنا على اتجاه الفكر والاهتمام، لا على مجرد التفكير العابر؛ والسياق المقابل بين ما لله وما للبشر يدعم هذا التعبير.
- source_word: τὰ τοῦ θεοῦ
  choice: ما لله
  rationale: يحفظ البنية الموجزة والتقابل اليوناني من غير توسيع تفسيري إلى «مصالح الله» أو «مقاصده».
- source_word: τὰ τῶν ἀνθρώπων
  choice: ما للبشر
  rationale: يعبر عن ἀνθρώπων بوصفه إشارة عامة إلى البشر، ويحفظ التقابل مع «ما لله» بلغة عربية واضحة.
theological_decisions:
- issue: دلالة مخاطبة بطرس بلفظ «شيطان»
  choice: إبقاء «يا شيطان» في الخطاب المباشر من غير شرح تفسيري داخل النص
  alternative: «يا عدو» أو التصريح بأن يسوع يخاطب الشيطان العامل من خلال بطرس
  rationale: النص اليوناني حاد ويحتمل أكثر من تحديد لوجه الخطاب؛ إبقاء اللفظ المعروف يحفظ الصدى الكتابي والتوتر اللاهوتي.
- issue: دلالة Ὕπαγε ὀπίσω μου
  choice: «اذهب خلفي»
  alternative: «ابتعد عني» أو «ارجع ورائي»
  rationale: الصياغة المختارة تحافظ على الدلالة المكانية، وقد تحمل معًا معنى الإبعاد وإعادة بطرس إلى موضع التابع، من غير حسم أحدهما.
- issue: عموم ἀνθρώπων
  choice: «البشر»
  alternative: «الناس» أو «البني آدمين»
  rationale: المراد في السياق الأمور البشرية في مقابل ما لله، لا الذكور وحدهم؛ و«البشر» فصيحة ودقيقة وشاملة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. حوفظ على التوازي «ما لله... ما للبشر»، وعلى حدة التوبيخ، مع تجنب التفسير العقائدي داخل المتن.
