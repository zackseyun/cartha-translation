id: MAT.16.1
reference: Matthew 16:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: ar
  text: وتقدَّم الفريسيون والصدوقيون، وسألوه، وهم يمتحنونه[a]، أن يُريهم آيةً من السماء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجرّبونه»، أو: «يحاولون الإيقاع به».'
    reason: بدائل معجمية توضّح درجات الدلالة المحتملة للفعل اليوناني πειράζω في هذا السياق.
lexical_decisions:
- source_word: προσελθόντες
  choice: تقدَّم
  rationale: ينقل حركة الاقتراب من يسوع بوصفها فعلًا سابقًا للفعل الرئيس، بصياغة عربية طبيعية.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية الشائعة لاسم هذه الجماعة.
- source_word: Σαδδουκαῖοι
  choice: الصدوقيون
  rationale: الصيغة العربية الشائعة لاسم هذه الجماعة.
- source_word: πειράζοντες
  choice: وهم يمتحنونه
  rationale: يحفظ معنى الاختبار واحتمال القصد العدائي من غير أن يصرّح بما يتجاوز اللفظ اليوناني.
- source_word: ἐπηρώτησαν
  choice: سألوه
  rationale: ترجمة واضحة ومباشرة للفعل الرئيس، وتتلاءم مع المصدر المؤول اللاحق.
- source_word: σημεῖον
  choice: آيةً
  rationale: «آية» المقابل العربي الكتابي الطبيعي لعلامة ذات دلالة، من غير إضافة وصف «معجزة» غير المصرح به.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: يحفظ دلالة المصدر أو المنشأ بصياغة عربية مألوفة.
- source_word: ἐπιδεῖξαι
  choice: أن يُريهم
  rationale: ينقل معنى إظهار الآية لهم، ويأتي طبيعيًا بعد «سألوه».
theological_decisions:
- issue: الدلالة العدائية في طلب الفريسيين والصدوقيين
  choice: وهم يمتحنونه
  alternative: وهم يجرّبونه؛ محاولين الإيقاع به
  rationale: «يمتحنونه» يحفظ معنى الاختبار والقصد غير المحايد، لكنه لا يحسمه على أنه إغراء إلى الشر أو محاولة صريحة للإيقاع به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. رُتبت الجملة بحيث يبقى فعل السؤال هو الفعل الرئيس، مع إبراز حال الامتحان من غير ثقل تركيبي.
