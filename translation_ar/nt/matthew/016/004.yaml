  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ar
  text: جِيلٌ شِرِّيرٌ وَزَانٍ يَطْلُبُ آيَةً[a]، وَلَنْ تُعْطَى لَهُ آيَةٌ إِلَّا آيَةَ يُونَانَ[b]. وَتَرَكَهُمْ وَمَضَى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم «زَانٍ» بمعنى «غير أمين»؛ فاللفظ اليوناني يستعمل استعارة الزنى، ويرجّح أنه يردّد لغة الأنبياء عن خيانة العهد.
    reason: lexical_alternative
  - marker: b
    text: تُشرح «آية يونان» في متى 12:39–40 بالإشارة إلى أيام يونان الثلاثة ولياليه الثلاث، بوصفها نمطًا يُطبَّق على ابن الإنسان.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: جِيلٌ
  rationale: المقابل المباشر والطبيعي لـ γενεά، ويحافظ على الإشارة إلى جماعة الجيل الحاضر في سياق متى دون توسيعها إلى «شعب» أو «عصر».
- source_word: πονηρὰ
  choice: شِرِّيرٌ
  rationale: ينقل الوصف الأخلاقي المباشر في πονηρά بلغة عربية واضحة ومألوفة.
- source_word: μοιχαλὶς
  choice: زَانٍ
  rationale: يحافظ على استعارة الزنى الصريحة وحدّتها، مع إبقاء احتمال صداها النبوي الدال على الخيانة وعدم الأمانة، بدل حصر المعنى في تفسير واحد.
- source_word: σημεῖον
  choice: آيَةً
  rationale: «آية» هي المقابل العربي المألوف لعلامة ذات دلالة أو تصديق، ولا تضيف وصف «معجزة» الذي لا يصرح به اللفظ اليوناني.
- source_word: ἐπιζητεῖ
  choice: يَطْلُبُ
  rationale: ينقل معنى السعي إلى الآية أو طلبها مباشرة، من غير فرض دلالة «يطالب» الأشد، وإن كان السياق قد يوحي بالإلحاح.
- source_word: δοθήσεται
  choice: تُعْطَى
  rationale: صيغة مبنية للمجهول تقابل مستقبل δίδωμι المبني للمجهول بصورة مباشرة وطبيعية.
- source_word: αὐτῇ
  choice: لَهُ
  rationale: الضمير يعود إلى «جيل»، وهو مذكر في العربية، ولذلك جاءت المطابقة النحوية عربية لا شكلية مع جنس الاسم اليوناني.
- source_word: εἰ μὴ
  choice: إِلَّا
  rationale: 'تبيّن الاستثناء الوحيد بوضوح: لن تُعطى آية سوى آية يونان.'
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: آيَةَ يُونَانَ
  rationale: يحافظ على تركيب الإضافة الموجز وعلى ما فيه من قابلية للتفسير، دون إدخال شرح القيامة في المتن.
- source_word: καταλιπὼν
  choice: تَرَكَهُمْ
  rationale: ينقل الفعل السابق للفعل الرئيس بسلاسة في العربية، مع التصريح بالمفعول الوارد في اليونانية.
- source_word: ἀπῆλθεν
  choice: مَضَى
  rationale: تعبير عربي طبيعي موجز يدل على الانصراف والابتعاد عنهم.
theological_decisions:
- issue: دلالة وصف الجيل بأنه μοιχαλὶς
  choice: الإبقاء على استعارة الزنى في عبارة «جيل شرير وزانٍ».
  alternative: «جيل شرير وغير أمين» أو «جيل خائن».
  rationale: اللفظ اليوناني يستعمل صورة الزنى، التي قد تحمل صدى لغة الأنبياء عن خيانة العهد. إبقاء الصورة يصون حدّتها ويترك دلالتها الأخلاقية والعهدية معًا دون حسمها في شرح واحد.
- issue: معنى «آية يونان»
  choice: إبقاء العبارة موجزة كما في الأصل، مع إحالة تفسيرية في الحاشية.
  alternative: التصريح في المتن بأنها موت يسوع وقيامته.
  rationale: الآية نفسها لا تفصّل المقصود، وإن كان متى 12:39–40 يربطها ببقاء يونان ثلاثة أيام وثلاث ليال وبابن الإنسان. عدم توسيع المتن يحافظ على إيجاز النص وغموضه المقصود.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع تشكيل جزئي للكلمات التي قد يلتبس نطقها. روعي التوافق العربي فجاء «جيل» مذكرًا، مع الحفاظ على استعارة «زانٍ» وعلى العبارة اللاهوتية الموجزة «آية يونان». وُضع كل مؤشّر حاشية في المتن.
