  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: ar
  text: 'وكانوا يتناقشون فيما بينهم قائلين: «لم نأخذ معنا خبزًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم نُحضر خبزًا».'
    reason: بديل تعبيري للفعل ἐλάβομεν في سياق اصطحاب المؤن.
lexical_decisions:
- source_word: οἱ δὲ
  choice: وكانوا
  rationale: δέ أداة ربط خفيفة تستأنف السرد، وتؤديها الواو طبيعيًا في العربية من غير مبالغة في معنى الاستدراك.
- source_word: διελογίζοντο
  choice: يتناقشون
  rationale: صيغة الماضي الناقص تدل على نقاش أو تداول كان جاريًا؛ و«يتناقشون» واضحة وطبيعية في السياق.
- source_word: ἐν ἑαυτοῖς
  choice: فيما بينهم
  rationale: تفيد أن الحديث دار داخل جماعتهم، و«فيما بينهم» هي العبارة العربية المألوفة لهذا المعنى.
- source_word: λέγοντες
  choice: قائلين
  rationale: ينقل اسم الفاعل مضمون نقاشهم مباشرة، وتحافظ «قائلين» على بنية العبارة اليونانية بأسلوب عربي سليم.
- source_word: ὅτι
  choice: —
  rationale: تأتي هنا لتقديم مضمون القول، ولا تحتاج إلى مقابل مستقل في العربية بعد «قائلين» والنقطتين؛ وتجنب إضافة «لأن» يحفظ احتمال كون العبارة مضمون حديثهم دون تفسير العلاقة تفسيرًا زائدًا.
- source_word: Ἄρτους
  choice: خبزًا
  rationale: مع أن اللفظ جمع في اليونانية، فإنه يشير هنا إلى الخبز بوصفه مؤونة، والمفرد الجنسي «خبزًا» هو التعبير العربي الطبيعي.
- source_word: οὐκ ἐλάβομεν
  choice: لم نأخذ معنا
  rationale: الفعل λαμβάνω يعني أساسًا الأخذ، وفي سياق السفر يدل على اصطحاب الشيء؛ وإضافة «معنا» توضح هذا المعنى السياقي من غير تغيير المقصود.
