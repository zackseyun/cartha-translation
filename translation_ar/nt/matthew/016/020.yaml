  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: ar
  text: حينئذ شدّد على التلاميذ ألا يقولوا لأحد إنه هو المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «الممسوح». والكلمة اليونانية Χριστός لقب.
    reason: توضيح دلالة اللقب اليوناني Χριστός من دون إضافة تفسير تاريخي أو لاهوتي زائد.
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني يدل على تعاقب أحداث الرواية، و«حينئذ» مقابل عربي موجز وطبيعي.
- source_word: διεστείλατο
  choice: أوصى بصرامة
  rationale: يفيد الفعل هنا توجيهًا مؤكدًا وملزمًا؛ وتحفظ العبارة قوة النهي من غير إيحاء خاص بالخطر.
- source_word: τοῖς μαθηταῖς
  choice: التلاميذ
  rationale: اسم جمع معرّف يشير إلى جماعة أتباع يسوع المعروفة في السياق، ولا تستلزم العربية إضافة «تلاميذه».
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: ألا يقولوا لأحد
  rationale: تنقل العبارة مضمون الوصية بصياغة عربية واضحة، وتحفظ النهي المطلق الذي يفيده μηδενί.
- source_word: ὅτι αὐτός ἐστιν
  choice: إنه هو
  rationale: تنقل مضمون القول، مع إبقاء الضمير اليوناني الصريح بصياغة عربية طبيعية قد تحمل قدرًا من التوكيد من دون المبالغة فيه.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ دلالته بوصفه لقبًا لا اسمًا شخصيًا.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: استُعمل «المسيح» لأنه المقابل العربي الموروث والطبيعي للقب Χριστός. وتوضح الحاشية أنه لقب بمعنى «الممسوح» حتى لا يُفهم هنا على أنه مجرد اسم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «أوصى ... بصرامة» لإظهار قوة الأمر، مع الحفاظ على ترتيب الجملة ومضمونها من غير توسع تفسيري.
