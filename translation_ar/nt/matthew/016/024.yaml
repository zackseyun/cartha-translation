base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: ar
  text: 'حينئذ قال يسوع لتلاميذه: «إن أراد أحد[a] أن يأتي ورائي، فلينكر نفسه، وليحمل صليبه، وليتبعني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: صيغة «أحد» وما يتبعها من أفعال وضمائر مفردة مذكرة ذات دلالة عامة هنا، فتشمل كل من يريد أن يأتي وراء يسوع.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة ربط زمنية تصل القول بما سبقه في السرد، و«حينئذ» فصيحة وواضحة.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: «التلاميذ» هو المقابل العربي المستقر الذي يحفظ علاقة التعلّم والاتباع.
- source_word: Εἴ τις θέλει
  choice: إن أراد أحد
  rationale: ينقل الشرط والإرادة والنطاق العام بصياغة عربية طبيعية.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: أن يأتي ورائي
  rationale: يحفظ صورة السير وراء يسوع ولا يدمجها مسبقًا في فعل الاتباع الوارد لاحقًا.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: فلينكر نفسه
  rationale: ينقل صيغة الأمر والدعوة إلى إنكار الذات نقلاً مباشرًا، مع بقاء دلالة الفعل الحاسمة في السياق.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: ويحمل صليبه
  rationale: «يحمل صليبه» تعبير عربي طبيعي يفيد رفع الصليب وحمله، ويحفظ تخصيصه لكل شخص.
- source_word: ἀκολουθείτω μοι
  choice: ويتبعني
  rationale: ينقل أمر المضارع بالاتباع؛ ويفهم الاستمرار من سياق التلمذة دون إثقال العبارة.
theological_decisions:
- issue: المفرد المذكر ذو الدلالة التمثيلية في الشرط والأوامر
  choice: «إن أراد أحد... فلينكر نفسه ويحمل صليبه ويتبعني»
  alternative: صياغة جمع شاملة من قبيل «إن أراد أناس... فلينكروا أنفسهم»
  rationale: اليونانية مفردة نحويًا وتدل على كل فرد من غير حصر الدعوة في الرجال. تحافظ العربية على المفرد التمثيلي بصورة طبيعية، مع بيان شموله في الحاشية.
- issue: العلاقة بين «أن يأتي ورائي» و«يتبعني»
  choice: الإبقاء على التعبيرين متميزين
  alternative: ترجمة الأول أيضًا بمعنى «يتبعني»
  rationale: يحفظ ذلك التكرار الدلالي المقصود والصورة المكانية في ὀπίσω μου، من غير اختزالها في فعل ἀκολουθέω.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة الأمر المقترنة بالفاء واللام، وحُفظت صورة المجيء وراء يسوع مع تجنب التفسير الطائفي أو توسيع المعنى beyond النص.
