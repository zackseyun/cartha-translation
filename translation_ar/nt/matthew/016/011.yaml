base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ar
  text: كيف لا تفهمون أني لم أكلمكم عن الخبز؟ ولكن احذروا من خميرة الفريسيين والصدوقيين[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «احترسوا من خميرة الفريسيين والصدوقيين».'
    reason: lexical_alternative
  - marker: b
    text: «الخميرة» هنا صورة مجازية؛ وتوضح الآية التالية أن المقصود بها تعليم الفريسيين والصدوقيين.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: كيف لا تفهمون
  rationale: يحفظ صيغة السؤال التوبيخي وقوة الاستفهام، ويؤدي معنى νοέω بعبارة عربية واضحة وطبيعية.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: أني لم أكلمكم عن الخبز
  rationale: استُعمل «الخبز» اسمَ جنس طبيعيًا في العربية مع أن ἄρτων جمع، و«أكلمكم» ينقل معنى القول الموجَّه إليهم دون زيادة تفسيرية.
- source_word: προσέχετε δὲ
  choice: بل احذروا
  rationale: الفعل هنا أمر تحذيري، و«احذروا» أنسب من مجرد «انتبهوا». أما «بل» فتنقل الانتقال التصحيحي من نفي الحديث عن الخبز إلى التحذير المقصود.
- source_word: ἀπὸ τῆς ζύμης
  choice: خميرة
  rationale: مع فعل التحذير تؤدي «احذروا خميرة» معنى الاحتراز من الشيء، وتحفظ الصورة المجازية من غير استباق تفسيرها في الآية التالية.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: الفريسيين والصدوقيين
  rationale: هذان هما الاسمان العربيان الشائعان للجماعتين، والإضافة تحفظ علاقة الخميرة بما يميزهما.
theological_decisions:
- issue: القوة المجازية لكلمة ζύμη
  choice: الإبقاء على «خميرة» في النص الرئيس
  alternative: احذروا تعليم الفريسيين والصدوقيين
  rationale: الآية نفسها تعرض الصورة المجازية، بينما تفسرها الآية التالية بأنها التعليم؛ وإبقاء المجاز هنا يحفظ تدرج السياق ولا يدخل التفسير في النص قبل موضعه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ السؤال التوبيخي والمجاز، مع صياغة مألوفة للقارئ المعاصر وتجنب الشرح العقائدي داخل متن الآية.
