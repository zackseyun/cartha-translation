lexical_decisions:
- source_word: ἐλθόντες
  choice: ولمّا وصل
  rationale: نُقلت صيغة اسم الفاعل الأوريستي بعلاقة زمنية طبيعية في العربية، مع الحفاظ على سبق الوصول للفعل الرئيس في السرد.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: الترجمة العربية المعيارية في سياق الأناجيل، وتشير هنا إلى تلاميذ يسوع تحديدًا.
- source_word: εἰς τὸ πέραν
  choice: إلى الضفة الأخرى
  rationale: تعبير طبيعي ودقيق في سياق عبور البحيرة، ويوضح المقصود من «الجانب الآخر» دون زيادة تفسيرية كبيرة.
- source_word: ἐπελάθοντο
  choice: نسوا
  rationale: المعنى المباشر للفعل هو النسيان. والماضي العربي مع «لمّا وصل» يبيّن تسلسل الحدثين بوضوح من غير حاجة إلى تركيب ماضٍ بعيد ثقيل.
- source_word: ἄρτους
  choice: أرغفة خبز
  rationale: يحافظ على صيغة الجمع اليونانية وعلى كون المقصود أرغفة معدودة، مع تعبير عربي واضح وطبيعي.
- source_word: λαβεῖν
  choice: أن يأخذوا معهم
  rationale: ينقل مصدر الفعل بوصفه متممًا لـ«نسوا»، وإضافة «معهم» تُظهر المعنى السياقي للحمل في الرحلة من غير تغيير المقصود.
