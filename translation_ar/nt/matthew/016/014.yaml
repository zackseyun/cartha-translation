base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: ar
  text: 'فقالوا[a]: «بعض الناس يقولون: يوحنا المعمدان، وآخرون: إيليا، وغيرهم: إرميا أو واحد من الأنبياء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبعبارة أكثر تصريحًا: «بعض الناس يقولون إنك يوحنا المعمدان، وآخرون إنك إيليا، وغيرهم إنك إرميا أو واحد من الأنبياء».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: تؤدي الفاء هنا وظيفة الوصل السردي الطبيعي في العربية من غير مبالغة في معنى المقابلة الذي قد توحي به δέ، و«قالوا» ترجمة مباشرة لـ εἶπαν في هذا السياق.
- source_word: Οἱ μὲν
  choice: بعض الناس يقولون
  rationale: تفتتح μέν توزيع الإجابات بين جماعات مختلفة. أُظهر فعل القول في العربية لتستقيم العبارة، مع إبقاء خبر القول مقتضبًا كما في اليونانية.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: يوحنا المعمدان
  rationale: هذه الصيغة العربية الشائعة والمفهومة لاسم الشخصية ولقبها، وتؤدي معنى βαπτιστής بوضوح.
- source_word: ἄλλοι δὲ
  choice: وآخرون
  rationale: تواصل العبارة تقسيم الآراء إلى جماعات، والواو مناسبة للسرد من غير تحميل δέ معنى تضاد قوي.
- source_word: Ἠλίαν
  choice: إيليا
  rationale: الصيغة العربية الكتابية المألوفة لاسم النبي.
- source_word: ἕτεροι δὲ
  choice: وغيرهم
  rationale: تدل على جماعة أخرى ضمن تسلسل الآراء، وتحافظ على تنويع التعبير الموجود بين ἄλλοι وἕτεροι.
- source_word: Ἰερεμίαν
  choice: إرميا
  rationale: الصيغة العربية المألوفة لاسم النبي.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: أو واحد من الأنبياء
  rationale: تحافظ على البديل الذي تدخله ἤ، ولا تضيف لفظ «الآخرين» غير الموجود صراحة في اليونانية.
theological_decisions:
- issue: المسند إليه المفهوم في تحديد الهوية
  choice: إبقاء معنى «أنك» محذوفًا في المتن اعتمادًا على سؤال يسوع في السياق السابق
  alternative: «بعض الناس يقولون إنك يوحنا المعمدان...»
  rationale: النص اليوناني يسرد الأسماء على نحو إيجازي ولا يذكر ضمير المخاطب أو فعل الكينونة صراحة. ويمكن للعربية أن تحافظ على هذا الإيجاز مع بقاء المعنى واضحًا من السياق، بينما تبيّن الحاشية الصياغة الصريحة الممكنة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم الإيجاز في تعداد الأسماء حفاظًا على بنية الأصل، مع صياغة طبيعية يفهمها القارئ العادي.
