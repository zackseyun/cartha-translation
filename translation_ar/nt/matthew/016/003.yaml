  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: ar
  text: 'وفي الصباح تقولون: «اليوم طقسٌ عاصف، لأن السماء حمراء مكفهرّة». تعرفون كيف تميّزون منظر السماء[a]، ولكنكم لا تستطيعون تمييز علامات الأزمنة[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «وجه السماء».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير «علامات الأزمنة» إلى الدلالة الروحية للوقت الحاضر، بما في ذلك أعمال يسوع الدالة على هويته ودوره.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: في الصباح
  rationale: تعبير زمني طبيعي يحافظ على معنى الظرف اليوناني.
- source_word: χειμών
  choice: طقسٌ عاصف
  rationale: يدل هنا على سوء الطقس والعاصفة، لا على فصل الشتاء.
- source_word: πυρράζει
  choice: حمراء
  rationale: ينقل لون السماء المحمر بعبارة عربية واضحة من غير مبالغة.
- source_word: στυγνάζων
  choice: مكفهرّة
  rationale: يصف هيئة السماء القاتمة المنذرة بسوء الطقس، ويحافظ على الصورة الواردة في الأصل.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: منظر السماء
  rationale: «المنظر» يؤدي المعنى الاصطلاحي للهيئة المرئية، مع ذكر المعنى الحرفي في الحاشية.
- source_word: γινώσκετε διακρίνειν
  choice: تعرفون كيف تميّزون
  rationale: يحافظ على دلالة المعرفة والقدرة على التمييز معًا.
- source_word: σημεῖα
  choice: علامات
  rationale: مقابل عربي مألوف يتسع للدلالة البرهانية والكاشفة في سياق متى.
- source_word: καιρῶν
  choice: الأزمنة
  rationale: يشير إلى أوقات ذات دلالة، لا إلى فصول الطقس، ويبقي مدى العبارة مفتوحًا.
- source_word: οὐ δύνασθε
  choice: لا تستطيعون تمييز
  rationale: ينقل عدم الاستطاعة الصريح، ويستعيد فعل «تميّزون» المفهوم من الجملة السابقة لتوضيح المقابلة.
theological_decisions:
- issue: معنى «علامات الأزمنة»
  choice: الإبقاء على العبارة العامة من غير حصرها في نوع واحد من العلامات.
  alternative: علامات هذا الزمان، أو العلامات المسيانية للأزمنة.
  rationale: العبارة اليونانية تشير إلى دلالة اللحظة الراهنة وقد تشمل أعمال يسوع ذات المغزى المسياني والأخروي، لكنها لا تحصر المعنى صراحة في أحد هذين الجانبين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «مكفهرّة» للحفاظ على صورة السماء القاتمة المنذرة بالعاصفة، ووضعت علامتا الحاشية في الموضعين المطابقين لمضمونهما.
