base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: ar
  text: 'فأجابه يسوع: «طوبى لك يا سمعان بار يونا[a]، لأن لحمٌ ودمٌ[b] لم يكشفا لك هذا، بل أبي الذي في السماوات.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «سمعان ابن يونا». و«بار» كلمة آرامية معناها «ابن»، وقد أبقى النص اليوناني صيغة النسب الآرامية.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لحم ودم»، وهو تعبير يشير إلى البشر أو إلى مصدر بشري محض.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: فأجابه يسوع
  rationale: ينقل التركيب اليوناني الشائع «أجاب وقال له» بعبارة عربية طبيعية موجزة، مع إفادة الفاء استمرار السرد وارتباط الجواب بما سبقه.
- source_word: Μακάριος
  choice: طوبى لك
  rationale: تعبير عربي كتابي فصيح ومفهوم يحفظ معنى البركة والتزكية، ولا يختزله في شعور نفسي عابر مثل السعادة.
- source_word: Σίμων Βαριωνᾶ
  choice: سمعان بار يونا
  rationale: نُقل الاسم الأول بصيغته العربية الكتابية الشائعة، وحُفظت صيغة النسب الآرامية «بار يونا» كما أثبتها النص اليوناني، مع بيان معناها في الحاشية.
- source_word: ὅτι
  choice: لأن
  rationale: تُدخل سبب إعلان الطوبى بوضوح.
- source_word: σὰρξ καὶ αἷμα
  choice: لحمًا ودمًا
  rationale: يحفظ التعبير الاصطلاحي حرفيًا، وهو هنا كناية عن البشر أو المصدر البشري؛ واستُعمل النصب لأن العبارة فاعل لفعل منفي متقدم.
- source_word: ἀπεκάλυψέν σοι
  choice: لم يكشفا لك هذا
  rationale: «كشف» يحفظ دلالة الإعلان والإظهار. أُضيف «هذا» لإيضاح المفعول المفهوم من السياق، وجاء الفعل مثنى لمطابقة «لحمًا ودمًا» بوصفهما عنصرين معطوفين.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: بل أبي
  rationale: «بل» تُبرز المقابلة القوية بين المصدر البشري وإعلان الآب.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: الذي في السماوات
  rationale: يحافظ على جملة الصلة وعلى جمع «السماوات» الوارد في اليونانية، وهو تعبير عربي طبيعي راسخ.
theological_decisions:
- issue: مصدر اعتراف سمعان
  choice: الإبقاء على المقابلة العامة بين المصدر البشري وإعلان الآب
  alternative: قصر «لحم ودم» على استنتاج سمعان الطبيعي وحده، أو على معلّم بشري بعينه
  rationale: النص ينفي المصدر البشري عمومًا وينسب الكشف إلى الآب، من غير أن يحدد آلية الإعلان أو يصوغ هنا عقيدة أوسع في الوحي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظت العبارة الاصطلاحية «لحمًا ودمًا» وصيغة النسب الآرامية، مع حواشٍ موجزة، كما حُفظ جمع «السماوات» المطابق للنص اليوناني.
