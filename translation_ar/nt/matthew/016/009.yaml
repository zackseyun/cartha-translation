  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: ar
  text: «أما زلتم لا تفهمون، ولا تتذكرون الأرغفة الخمسة التي أُطعِم بها الخمسة آلاف، وكم قُفَّةً جمعتم؟»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: حتى الآن
  rationale: 'ينقل الدلالة الزمنية: عدم الفهم مستمر إلى هذه اللحظة، ويلائم سياق العتاب في السؤال البلاغي.'
- source_word: νοεῖτε
  choice: تفهمون
  rationale: يدل هنا على إدراك مغزى الأحداث السابقة، لا على مجرد الملاحظة الحسية.
- source_word: οὐδὲ
  choice: ولا
  rationale: يربط الفعلين المنفيين ربطًا طبيعيًا وواضحًا في العربية.
- source_word: μνημονεύετε
  choice: تذكرون
  rationale: تعبير عربي مباشر عن استحضار حادثة الإطعام السابقة.
- source_word: τοὺς πέντε ἄρτους
  choice: الأرغفة الخمسة
  rationale: يحافظ على العدد والصورة الملموسة للخبز في رواية الإطعام.
- source_word: τῶν πεντακισχιλίων
  choice: للخمسة الآلاف
  rationale: توضح اللام الصلة السياقية بين الأرغفة وإطعام الخمسة الآلاف، بدل إبقاء الإضافة اليونانية ملتبسة أو ثقيلة عربيًا.
- source_word: πόσους κοφίνους
  choice: كم قُفَّةً
  rationale: κόφινος اسم لنوع من السلال؛ و«قُفّة» مقابِل عربي محدد يحافظ على تمييزه عن σπυρίς الوارد لاحقًا في السياق.
- source_word: ἐλάβετε
  choice: أخذتم
  rationale: يحافظ على المعنى الأساسي للفعل λαμβάνω وعلى إيجاز الأصل، مع كون جمع الفضلات مفهومًا من سياق المعجزة.
