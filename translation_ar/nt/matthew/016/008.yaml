revisions:
- from: 'فَعَلِمَ يَسُوعُ بِذَلِكَ وَقَالَ: «لِمَاذَا تَتَنَاقَشُونَ فِيمَا بَيْنَكُمْ، يَا قَلِيلِي الإِيمَانِ، فِي أَنَّكُمْ لَمْ تَأْخُذُوا أَرْغِفَةً؟»'
  to: 'وَإِذْ عَلِمَ يَسُوعُ ذَلِكَ، قَالَ: «لِمَاذَا تَتَنَاقَشُونَ فِيمَا بَيْنَكُمْ، يَا قَلِيلِي الإِيمَانِ، حَوْلَ أَنَّكُمْ لَمْ تَأْخُذُوا أَرْغِفَةً؟»'
  rationale: تعديل أسلوبي محدود لتحسين مطابقة وظيفة γνοὺς وسلاسة العربية. أبقيتُ «تأخذوا أرغفة» محافظةً على الجمع وعلى الدلالة المباشرة للفعل اليوناني، ولم أحوّلها إلى «لم تُحضروا» أو «ليس لديكم خبز»؛ كما أبقيتُ ὅτι مبيّنةً لموضوع نقاشهم دون تقرير سببي صريح.
