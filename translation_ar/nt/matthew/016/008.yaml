review_pass:
  verdict: revise
  source_fidelity: النص يحافظ على المعنى الأساسي، بما في ذلك توبيخ «يا قليلي الإيمان» وجمع «أرغفة». لكن «فَعَلِمَ» لا يُظهر بوضوح وظيفة اسم الفاعل γνοὺς بوصفه تمهيدًا سابقًا للقول، ويمكن صوغه بدقة أكبر بـ«وإذ علم...».
  naturalness: «في أنكم لم تأخذوا أرغفة» مفهومة، لكنها ثقيلة وغير مألوفة في العربية الفصحى الحديثة بعد «تتناقشون». «حول أنكم لم تأخذوا أرغفة» أوضح وأطبع، مع إبقاء «فيما بينكم» ترجمةً مستقلة لعبارة ἐν ἑαυτοῖς.
  terminology: «يسوع»، و«يا قليلي الإيمان»، و«أرغفة» سليمة ومناسبة للسجل الفصيح. ولا حاجة إلى حاشية؛ فاختيار «تأخذوا» يحفظ دلالة λαμβάνω المباشرة ولا يفرض معنى «أحضروا».
  issues:
