  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: ar
  text: 'وَإِذْ عَلِمَ يَسُوعُ ذَلِكَ، قَالَ: «لِمَاذَا تَتَنَاقَشُونَ فِيمَا بَيْنَكُمْ، يَا قَلِيلِي الإِيمَانِ، حَوْلَ أَنَّكُمْ لَمْ تَأْخُذُوا أَرْغِفَةً؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: فَعَلِمَ ... بِذَلِكَ
  rationale: اسم فاعل ماضٍ يفيد أن يسوع أدرك الأمر قبل أن يتكلم؛ وأُضيف «بذلك» اعتمادًا على السياق لأن المفعول غير مصرَّح به في اليونانية.
- source_word: δὲ
  choice: وَ
  rationale: تفيد انتقالًا سرديًّا خفيفًا، والواو طبيعية هنا ولا تبالغ في جعل العلاقة استدراكية.
- source_word: Τί
  choice: لِمَاذَا
  rationale: تأتي أداة الاستفهام هنا بمعنى السؤال عن سبب مناقشتهم، لا مجرد السؤال عن موضوعها.
- source_word: διαλογίζεσθε
  choice: تَتَنَاقَشُونَ
  rationale: تنقل تداول التلاميذ للأمر بعضهم مع بعض بلغة عربية معاصرة واضحة.
- source_word: ἐν ἑαυτοῖς
  choice: فِيمَا بَيْنَكُمْ
  rationale: يحفظ معنى التشاور أو النقاش فيما بينهم، مع بقاء إمكان الدلالة على تداولهم الداخلي الجماعي.
- source_word: ὀλιγόπιστοι
  choice: يَا قَلِيلِي الإِيمَانِ
  rationale: ترجمة مباشرة للنداء التوبيخي، وتحفظ صلته المتكررة في متى بضعف الإيمان أو الثقة.
- source_word: ὅτι
  choice: فِي أَنَّ
  rationale: تُفهم بوصفها مُدخلة لمضمون نقاشهم، مع الحفاظ على هذا التحليل بدل تحويلها إلى سببية صريحة.
- source_word: ἄρτους
  choice: أَرْغِفَةً
  rationale: يحفظ صيغة الجمع وصورة الأرغفة في النص اليوناني بوضوح طبيعي.
- source_word: οὐκ ἐλάβετε
  choice: لَمْ تَأْخُذُوا
  rationale: يحافظ على الدلالة المباشرة للفعل λαμβάνω وعلى الغموض المحدود بين الأخذ والإحضار، بدل اختزاله في حالة عدم وجود خبز لديهم.
theological_decisions:
- issue: قوة التوبيخ في ὀλιγόπιστοι
  choice: يا قليلي الإيمان
  alternative: يا ضعيفي الإيمان؛ يا من إيمانكم قليل
  rationale: يحفظ التوبيخ المتعلق بنقص الإيمان أو الثقة في الموقف دون توسيعه إلى تقرير عقائدي أشمل.
- issue: وظيفة ὅτι
  choice: 'بيان مضمون مناقشتهم: «في أنكم لم تأخذوا أرغفة»'
  alternative: 'السببية: «لأنكم لم تأخذوا أرغفة»'
  rationale: التركيب يحتمل السببية، لكن قراءته بوصفه مبيّنًا لمضمون حديثهم تلائم السياق المباشر وتحفظ السؤال عن سبب انشغالهم بهذا الأمر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «تتناقشون» بدل تعبير حرفي أثقل مثل «تتحاورون في نفوسكم»، وحُفظ الجمع في «أرغفة» والفعل المباشر «تأخذوا» لقربهما من الأصل.
