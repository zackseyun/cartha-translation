    issue: صياغة اسم الفاعل γνοὺς
    rationale: «فَعَلِمَ» صحيحة معنًى، لكن «وإذ علم يسوع ذلك» أوفى بوظيفة المشاركة السابقة للفعل الرئيس «قال».
  - severity: medium
    issue: ثقل التركيب «تتناقشون ... في أنكم»
    rationale: هذا التركيب أقل سلاسة في العربية المعاصرة، وقد يربك العلاقة بين «فيما بينكم» ومضمون النقاش. «تتناقشون فيما بينكم ... حول أنكم...» ينقل البنيتين بوضوح.
