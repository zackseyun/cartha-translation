  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: ar
  text: 'ووصيةٌ ثانيةٌ مثلها: «أحبِبْ قريبك كنفسك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والوصية الثانية مثلها».'
    reason: بديل نحوي معجمي؛ يجوز في السياق فهم Δευτέρα على أنها «الثانية» مع التعريف الدلالي.
lexical_decisions:
- source_word: Δευτέρα
  choice: وصيةٌ ثانيةٌ
  rationale: الصفة المؤنثة غير المعرَّفة مستعملة استعمال الاسم، والموصوف المفهوم من السياق هو «وصية». والتنكير يحفظ احتمال «وصية ثانية» بدل حسمها إلى «الوصية الثانية».
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع الكلام من غير دلالة على تضاد قوي، والواو طبيعية هنا.
- source_word: ὁμοία αὐτῇ
  choice: مثلها
  rationale: تفيد المماثلة للوصية الأولى المذكورة في السياق، من غير إضافة تفسير لطبيعة هذه المماثلة.
- source_word: Ἀγαπήσεις
  choice: أحبِبْ
  rationale: المستقبل اليوناني في نص الوصية يؤدي معنى الأمر. وصيغة الأمر العربية تنقل القوة الإلزامية بوضوح وطبيعية، مع بقاء الاقتباس في سجل كتابي رصين.
- source_word: τὸν πλησίον σου
  choice: قريبك
  rationale: تدل العبارة اصطلاحيًا على الإنسان القريب أو الآخر الذي تجب محبته، و«قريبك» المقابل العربي المألوف في هذا السياق، لا مجرد القرب المكاني.
- source_word: ὡς
  choice: كـ
  rationale: تدخل معيار المقارنة، والباء الملحقة بالكاف في «كنفسك» تؤدي معنى «مثلما» بإيجاز طبيعي.
- source_word: σεαυτόν
  choice: نفسك
  rationale: ضمير انعكاسي يعود إلى المخاطب، و«نفسك» صياغة عربية مباشرة ومألوفة.
theological_decisions:
- issue: علاقة الوصية الثانية بالأولى
  choice: وصيةٌ ثانيةٌ مثلها
  alternative: الوصية الثانية مثلها
  rationale: يحفظ التنكير الموجود في اليونانية إمكان فهم العبارة «وصية ثانية»، بينما يوضح إدخال «وصية» المحذوفة المقدرة من السياق. و«مثلها» تبقي وجه المماثلة غير مفصَّل ولا تدمج الوصيتين.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت صيغة الأمر «أحبِبْ» لأنها أنسب للعربية من محاكاة المستقبل اليوناني حرفيًا، وحُفظت صيغة «قريبك كنفسك» الموجزة والمألوفة.
