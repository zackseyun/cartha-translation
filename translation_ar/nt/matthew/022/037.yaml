source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: ar
  text: 'فقال له: «تُحِبُّ الربَّ إلهك بكلِّ قلبك، وبكلِّ نفسك، وبكلِّ ذهنك».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرف الجر اليوناني هو ἐν، ومعناه الحرفي «في»، لكن العربية الطبيعية في هذا التركيب تقول: «بكل قلبك... وبكل نفسك... وبكل ذهنك».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُترجم «ذهنك» أيضًا: «فهمك». أمّا «نفسك» فقد تدل بحسب السياق على حياتك أو ذاتك كلها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تتابع الحوار من غير أن تفرض معنى الاستدراك القوي.
- source_word: ἔφη αὐτῷ
  choice: قال له
  rationale: ترجمة مباشرة وطبيعية لفعل القول مع المفعول غير المباشر، من غير إضافة معنى «أجاب» غير المصرح به في الفعل.
- source_word: Ἀγαπήσεις
  choice: تُحِبُّ
  rationale: المستقبل اليوناني هنا يؤدي قوة الأمر في اقتباس كتابي؛ والمضارع العربي في سياق الوصية ينقل الإلزام بصياغة طبيعية ويحافظ على هيئة الاقتباس.
- source_word: κύριον τὸν θεόν σου
  choice: الربَّ إلهك
  rationale: يحفظ الصياغة العهدية للاقتباس، و«الرب» المقابل المألوف لـ κύριος في هذا السياق.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: بكلِّ قلبك
  rationale: الباء هي الصياغة العربية الاصطلاحية الطبيعية للدلالة على شمول المحبة، مع أن الأصل يستعمل ἐν، أي «في».
- source_word: ψυχῇ
  choice: نفسك
  rationale: «النفس» تقابل ψυχή طبيعيًا في العربية، ويمكن أن تشمل الذات أو الحياة كلها، من غير حصرها في تصور فلسفي ضيق.
- source_word: διανοίᾳ
  choice: ذهنك
  rationale: تنقل ملكة التفكير والفهم بلفظ عربي واضح، مع إمكان ترجمتها «فهمك».
theological_decisions:
- issue: صياغة الاقتباس من التثنية في جواب يسوع
  choice: 'الإبقاء على الثلاثية: القلب، والنفس، والذهن'
  alternative: دمج الألفاظ في تعبير تفسيري مثل «بكل كيانك»
  rationale: يحفظ ذلك الفروق اللفظية في النص اليوناني وشمول الوصية من غير فرض تقسيم عقائدي صارم لمكونات الإنسان.
- issue: قوة صيغة Ἀγαπήσεις
  choice: «تُحِبُّ» بوصفها صيغة وصية في سياق الاقتباس
  alternative: «يجب أن تحب» أو «أحبب»
  rationale: الصيغة المختارة طبيعية في العربية الكتابية وتحافظ على شكل الجملة الخبرية ذات القوة الأمرية، من غير إضافة فعل وجوب غير موجود صراحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تُحِبُّ» بصيغة المضارع ذي القوة الأمرية، وحُفظ التوازي الثلاثي والتكرار البلاغي في الأصل.
