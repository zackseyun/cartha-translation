id: MAT.22.11
reference: Matthew 22:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: ar
  text: ولكن حين دخل الملك لينظر إلى المدعوين المتكئين إلى المائدة[b]، رأى هناك رجلًا لم يكن مرتديًا لباس العرس[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثوب عرس». ويمكن أن تدل العبارة على ثوب مخصوص أو على لباس يليق بالعرس.'
    reason: lexical_alternative
  - marker: b
    text: 'يقول اليوناني حرفيًا: «المتكئين». وكان ضيوف الولائم الرسمية يتكئون إلى المائدة بحسب عادة ذلك الزمان.'
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν
  choice: حين دخل
  rationale: اسم الفاعل الأُورِسْتي يقدّم دخول الملك بوصفه حدثًا سابقًا للفعل الرئيس؛ وصيغة «حين دخل» طبيعية في السرد العربي وتحفظ هذا الترتيب.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد الأداة انتقالًا سرديًا ذا مقابلة خفيفة، إذ يبدأ دخول الملك منعطفًا يبعث على التوتر في المثل.
- source_word: ὁ βασιλεὺς
  choice: الملك
  rationale: المقابل العربي المباشر في سياق المثل الملكي.
- source_word: θεάσασθαι
  choice: لينظر إلى
  rationale: المصدر يدل على الغرض من الدخول. وتحفظ «لينظر إلى» معنى المشاهدة من غير أن تحسمه في معنى التفتيش الرسمي.
- source_word: τοὺς ἀνακειμένους
  choice: المدعوين المتكئين إلى المائدة
  rationale: يدل الفعل في سياق الولائم على الاتكاء لتناول الطعام. أُضيف «المدعوين» لتوضيح دورهم في مشهد العرس، مع إبقاء الهيئة التاريخية في «المتكئين إلى المائدة».
- source_word: εἶδεν
  choice: رأى
  rationale: ترجمة سردية مباشرة للفعل الأُورِسْتي من ὁράω.
- source_word: ἐκεῖ
  choice: هناك
  rationale: مقابل عربي طبيعي لظرف المكان.
- source_word: ἄνθρωπον
  choice: رجلًا
  rationale: يشير الاسم المفرد المذكر هنا إلى فرد ذكر في أحداث المثل، ولذلك حُفظ التحديد الجنسي في الترجمة.
- source_word: οὐκ ἐνδεδυμένον
  choice: لم يكن مرتديًا
  rationale: ينقل حالة الرجل القائمة التي يصفها اسم الفاعل التام، بصياغة عربية واضحة وطبيعية.
- source_word: ἔνδυμα γάμου
  choice: لباس العرس
  rationale: يحفظ «لباس» إمكان فهم الاسم المفرد على أنه ثوب بعينه أو لباس ملائم للعرس، من غير فرض تفاصيل لا يذكرها النص.
theological_decisions:
- issue: الصورة الثقافية لهيئة الحاضرين في الوليمة
  choice: الإبقاء على الاتكاء مع توضيح أنهم المدعوون إلى الوليمة
  alternative: الاكتفاء بقول «المدعوين» أو الترجمة الحرفية «المتكئين» بلا توضيح
  rationale: يحفظ هذا الاختيار الهيئة التاريخية للولائم القديمة، ويجعل المشهد مفهومًا للقارئ الحديث من غير تحميله دلالة عقائدية إضافية.
- issue: دلالة ἔνδυμα γάμου
  choice: لباس العرس
  alternative: ثوب عرس؛ أو ثياب تليق بالعرس
  rationale: لا يبيّن النص هل المقصود ثوب مخصوص واحد أم اللباس الملائم للمناسبة عمومًا؛ لذا تحافظ الصياغة المختارة والحاشية على هذا القدر من الانفتاح.
- issue: التحديد الجنسي في ἄνθρωπον
  choice: رجلًا
  alternative: شخصًا؛ أو إنسانًا
  rationale: الإشارة هنا إلى فرد مذكر داخل القصة، لا إلى البشر على وجه العموم، فكان «رجلًا» أدق.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، بنبرة سردية كريمة. استُعمل «المتكئين إلى المائدة» بدل «الجالسين» حفاظًا على التفصيل الثقافي، ووُضعت علامتا الحاشيتين في المتن بحسب موضعهما.
