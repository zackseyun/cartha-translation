source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: ar
  text: 'فأرسلوا إليه تلاميذهم مع الهيرودسيين[a]، قائلين: «يا معلّم، نعلم أنك صادق، وتعلّم طريق الله بالحق، ولا تبالي بأحد[b]، لأنك لا تراعي وجوه الناس[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الهيرودسيون جماعة ارتبطت بهيرودس وأسرته ومصالح حكمهم.
    reason: historical_context
  - marker: b
    text: أي إنك لا تتأثر بمكانة أحد أو نفوذه؛ وليس المقصود أنك لا تهتم بالناس.
    reason: idiom_clarification
  - marker: c
    text: 'حرفيًا: «لا تنظر إلى وجوه الناس». والتعبير يفيد عدم محاباة الناس أو الحكم بحسب مكانتهم أو مظهرهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: فأرسلوا
  rationale: استُخدم الماضي الملائم للسرد العربي، مع أن اليونانية تستعمل الحاضر السردي.
- source_word: μαθητὰς
  choice: تلاميذهم
  rationale: «التلاميذ» هو المقابل الإنجيلي المألوف، ويجمع معنى التعلّم والاتباع.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: مع الهيرودسيين
  rationale: ينقل المصاحبة بوضوح ويحافظ على اسم الجماعة التاريخية.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: نداء عربي طبيعي ودقيق، من غير إضافة دلالة سلطوية ليست لازمة في الأصل.
- source_word: ἀληθὴς
  choice: صادق
  rationale: يصف صدق الشخص واستقامته في هذا السياق بصورة أوضح من «حق» في العربية المعاصرة.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: طريق الله
  rationale: يحافظ على صورة «الطريق» وما قد تتضمنه من تعليم وسلوك بحسب إرادة الله.
- source_word: ἐν ἀληθείᾳ
  choice: بالحق
  rationale: يحافظ على صلة العبارة بالحق، ويمكن أن تفيد التعليم بصدق ووفقًا للحق.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: ولا تبالي بأحد
  rationale: ترجمة قريبة وموجزة؛ والسياق يبيّن أن المقصود عدم التأثر بمكانة الأشخاص، لا انعدام الاهتمام الأخلاقي بهم.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: لأنك لا تنظر إلى وجوه الناس
  rationale: تحافظ على الصورة اليونانية وعلى تعليل العبارة السابقة، مع توضيح معناها الاصطلاحي في الحاشية.
- source_word: ἀνθρώπων
  choice: الناس
  rationale: اللفظة اليونانية هنا عامة للبشر، و«الناس» هو المقابل العربي الطبيعي الجامع.
theological_decisions:
- issue: التعبير الاصطلاحي عن عدم المحاباة
  choice: 'الإبقاء على الصورة: «لا تنظر إلى وجوه الناس»'
  alternative: «لا تحابي الناس» أو «لا تحكم بحسب المظاهر»
  rationale: الصياغة المختارة تحفظ نسيج الأصل وصورته، بينما تشرح الحاشية أن المراد عدم التأثر بالمكانة أو المظهر، من غير حصر المعنى في تفسير واحد.
- issue: معنى «ولا تبالي بأحد»
  choice: الإبقاء على العبارة القريبة من الأصل مع حاشية مبيِّنة
  alternative: «ولا تتأثر برأي أحد» أو «ولا تعبأ بمكانة أحد»
  rationale: لا يصرّح الأصل بالرأي أو المكانة في هذه الجملة وحدها، وإن كان التعليل اللاحق يوجّه المعنى نحو عدم المحاباة؛ لذلك حُفظت الصياغة الأوسع مع منع الفهم المضلل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الماضي للسرد الطبيعي، وحُفظت صورتا «طريق الله» و«وجوه الناس» لقربهما من الأصل، مع حواشٍ تمنع سوء فهم التعبيرين الاصطلاحيين.
