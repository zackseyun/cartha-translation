lexical_decisions:
- source_word: ἀκούσαντες
  choice: فَلَمَّا سَمِعُوا ذَلِكَ
  rationale: اسم فاعل ماضٍ يفيد هنا حدثًا سابقًا للفعل الرئيس؛ وصياغته جملة زمنية طبيعية في العربية. أُضيف اسم الإشارة «ذلك» لأن المسموع مفهوم من السياق.
- source_word: ἐθαύμασαν
  choice: تَعَجَّبُوا
  rationale: ينقل معنى الدهشة والتعجب بلفظ عربي واضح ومألوف، من غير مبالغة في الدلالة.
- source_word: ἀφέντες αὐτὸν
  choice: تَرَكُوهُ
  rationale: ترجمة مباشرة تفيد أنهم تركوا يسوع وانصرفوا عنه، من غير إضافة معنى «وحده» غير المصرح به.
- source_word: ἀπῆλθαν
  choice: مَضَوْا
  rationale: لفظ عربي طبيعي موجز يدل على الانصراف والذهاب بعيدًا عن الموضع.
- source_word: καὶ ... καὶ
  choice: فَـ ... وَ
  rationale: استُخدمت الفاء لربط النتيجة بالسماع، والواو لتتابع الفعلين الأخيرين، بما يحفظ سرعة السرد وطبيعته في العربية.
