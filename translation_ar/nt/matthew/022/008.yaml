  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: ar
  text: 'ثم يقول لخدمه: «وليمة العرس جاهزة، لكن المدعوون لم يكونوا مستحقين.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: تفيد التعاقب الزمني في السرد، و«ثم» صياغة عربية طبيعية ومباشرة.
- source_word: λέγει
  choice: يقول
  rationale: تحافظ صيغة المضارع على المضارع التاريخي في اليونانية وعلى حيوية السرد.
- source_word: δούλοις
  choice: لخدمه
  rationale: تلائم «الخدم» سياق المثل الملكي، حيث لا تبرز في هذه الآية منزلة العبودية القانونية بوصفها محورًا للمعنى.
- source_word: Ὁ μὲν γάμος
  choice: عرسُ الزواج
  rationale: يدل γάμος هنا على احتفال الزواج ومأدبته، لا على عقد الزواج وحده؛ و«عرس الزواج» تعبير واضح في العربية، بينما يظهر التقابل الذي تؤديه μὲν مع δὲ بواسطة «لكن».
- source_word: ἕτοιμός ἐστιν
  choice: جاهز
  rationale: ينقل تركيب الصفة مع فعل الكينونة نقلًا موجزًا وطبيعيًا.
- source_word: οἱ δὲ κεκλημένοι
  choice: المدعوين
  rationale: اسم المفعول التام من καλέω يشير في سياق العرس إلى الذين وُجهت إليهم الدعوة؛ و«المدعوين» تحفظ الصلة اللفظية بالدعوة من غير فرض معنى لاهوتي خاص.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: لم يكونوا مستحقين
  rationale: تحفظ «مستحقين» القوة التقويمية لكلمة ἄξιοι من غير تحديد سبب عدم الاستحقاق.
theological_decisions:
- issue: ما قد تحمله κεκλημένοι من إيحاء لاهوتي بمعنى «الذين دُعوا»
  choice: المدعوين
  alternative: الذين دُعوا
  rationale: السياق المباشر هو دعوة ضيوف إلى العرس، ولذلك تؤدي «المدعوين» المعنى الاجتماعي المقصود بوضوح. وتُذكر الصياغة الحرفية البديلة في الحاشية حفاظًا على الشفافية وعلى إمكان ملاحظة الصلة بالفعل «دعا».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع الحفاظ على المضارع التاريخي والتقابل بين جاهزية العرس وعدم استحقاق المدعوين.
