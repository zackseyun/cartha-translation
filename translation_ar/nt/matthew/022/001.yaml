lexical_decisions:
- source_word: Καὶ
  choice: فـ
  rationale: أداة ربط تحفظ تتابع السرد من غير إضافة دلالة زمنية صريحة.
- source_word: ἀποκριθεὶς
  choice: أجاب
  rationale: تحافظ على الصيغة اليونانية الاصطلاحية الشائعة في السرد، حتى حين لا يسبقها سؤال مباشر.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: النقل العربي المألوف للاسم، ولا تُنقل أداة التعريف اليونانية مع اسم العلم.
- source_word: πάλιν
  choice: عاد
  rationale: تعبير عربي طبيعي يدل على تكرار فعل الكلام.
- source_word: εἶπεν
  choice: يكلّم
  rationale: ينقل فعل مخاطبة السامعين ويتجنب ثقل تكرار «قال... قائلًا».
- source_word: ἐν παραβολαῖς
  choice: بالأمثال
  rationale: الباء تعبّر طبيعيًا عن الوسيلة أو الأسلوب الذي جرى به الكلام.
- source_word: αὐτοῖς
  choice: هم
  rationale: الضمير المتصل بالفعل يبيّن أن الكلام موجّه إليهم.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ اسم الفاعل الذي يمهّد لمضمون الكلام الآتي.
theological_decisions:
- issue: استعمال «أجاب» من غير ورود سؤال مباشر قبله
  choice: الإبقاء على «أجاب»
  alternative: «ردّ» أو حذف فعل الإجابة والاكتفاء بـ«عاد يكلّمهم»
  rationale: هذا أسلوب سردي يوناني مألوف، والإبقاء عليه يحفظ الصياغة واستمرارية الخطاب من غير تحميلها تفسيرًا لاهوتيًا.
translation_notes:
