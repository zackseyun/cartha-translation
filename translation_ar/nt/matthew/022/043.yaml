base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: ar
  text: 'فقال لهم: «فكيف إذًا يدعو داودُ، بالروح[a]، المسيحَ ربًّا[b]، إذ يقول:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «في الروح». قد تدل العبارة اليونانية على المجال أو على الوساطة؛ وترجمتها هنا «بالروح» أنسب للسياق العربي.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «سيّدًا». اللفظ اليوناني هو κύριος، ويُترجم عادةً «ربّ».'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: فقال لهم
  rationale: المضارع اليوناني هنا مضارع تاريخي، وصيغة الماضي أنسب للسرد العربي، مع بقاء وظيفة العبارة في تقديم كلام يسوع.
- source_word: Πῶς οὖν
  choice: فكيف إذًا
  rationale: تحفظ الاستفهام في πῶς والدلالة الاستنتاجية أو الانتقالية في οὖν بصياغة عربية طبيعية.
- source_word: Δαυὶδ
  choice: داود
  rationale: الصيغة العربية الراسخة للاسم الكتابي.
- source_word: ἐν πνεύματι
  choice: بالروح
  rationale: الباء تعبّر طبيعيًّا في العربية عن وساطة الروح أو تأثيره في كلام داود، مع إبقاء قدر من مرونة العبارة اليونانية التي قد تدل على المجال أو الوساطة.
- source_word: καλεῖ αὐτὸν κύριον
  choice: يدعو داودُ ... المسيحَ ربًّا
  rationale: أُظهر مرجع الضمير αὐτόν على أنه المسيح من سياق السؤال السابق لتجنب غموض الضمير غير الطبيعي في العربية، وحُفظ κύριος بلقب «ربّ» لما له من وزن في الحجة والاقتباس الآتي.
- source_word: λέγων
  choice: إذ يقول
  rationale: صياغة عربية طبيعية تصل الفعل بالاقتباس الذي يليه وتحفظ العلاقة الظرفية للمشاركة اليونانية.
theological_decisions:
- issue: مرجع πνεῦμα في ἐν πνεύματι
  choice: الروح القدس هو المرجع الأرجح، وصيغ في المتن «بالروح»
  alternative: روح داود نفسه أو حالته الروحية؛ وكذلك يمكن ترجمة العبارة «في الروح»
  rationale: سياق الاستشهاد بكلام داود الملهم يرجّح الروح القدس، لكن الحاشية تحفظ احتمال دلالة ἐν على المجال بدل الوساطة ولا توسّع المتن إلى «الروح القدس».
- issue: ترجمة κύριος
  choice: ربًّا
  alternative: سيّدًا
  rationale: «ربّ» تحفظ اللقب ودلالته في الحجة المسيانية وصلته بالمزمور 110، بينما «سيّد» ممكنة معجميًّا لكنها أضعف في نقل التناص المقصود.
- issue: مرجع αὐτόν
  choice: المسيحَ
  alternative: إياه / له
  rationale: الضمير يعود في السياق إلى المسيح المذكور في السؤال السابق. إظهار المرجع يجعل العربية واضحة، من غير أن يضيف تحديدًا لاهوتيًّا غير موجود في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «فقال» للسرد الطبيعي، وأُظهر مرجع الضمير بلفظ «المسيح» اعتمادًا على السياق السابق. جميع علامات الحواشي مثبتة في المتن.
