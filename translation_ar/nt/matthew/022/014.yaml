  source_fidelity: 'الترجمة تنقل البنية والمعنى الأساسيين للنص اليوناني بأمانة: «كَثِيرِينَ» مقابل πολλοὶ، و«مَدْعُوُّونَ» مقابل κλητοί، و«قَلِيلِينَ» مقابل ὀλίγοι، و«مُخْتَارُونَ» مقابل ἐκλεκτοί. و«لِأَنَّ» تؤدي الوظيفة التفسيرية لـγάρ على نحو مقبول في العربية، مع أن الصلة بما قبلها تظل مفهومة.'
  naturalness: 'الصياغة فصيحة حديثة وموجزة وطبيعية: «لِأَنَّ كَثِيرِينَ مَدْعُوُّونَ، لَكِنَّ قَلِيلِينَ مُخْتَارُونَ». حذف فعل الكينونة في الحاضر سليم، والتوازي بين الشطرين واضح.'
  terminology: «مَدْعُوُّونَ» يحفظ اتساع κλητοί ولا يحصره في صورة الوليمة، بينما تعرض الحاشية بدقة إمكان معنى الدعوة إلى الوليمة في هذا السياق. و«مُخْتَارُونَ» مقابِل مباشر وواضح لـἐκλεκτοί، والحاشية «الْمُصْطَفَوْنَ» بديل معجمي مناسب دون فرض قراءة مذهبية.
