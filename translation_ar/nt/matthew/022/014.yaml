  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: ar
  text: لِأَنَّ كَثِيرِينَ مَدْعُوُّونَ[a]، لَكِنَّ قَلِيلِينَ مُخْتَارُونَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مَدْعُوُّونَ إِلَى الْوَلِيمَةِ»؛ فقد تحمل الكلمة هنا معنى الدعوة إلى وليمة العرس.
    reason: lexical_alternative
  - marker: b
    text: أو «الْمُصْطَفَوْنَ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: كَثِيرِينَ
  rationale: نُقلت الصفة المستعملة استعمال الاسم بصيغة موجزة، مع إبقاء المقابلة المباشرة مع «قليلين».
- source_word: γάρ
  choice: لِأَنَّ
  rationale: تفيد الأداة تعليلًا أو تفسيرًا لما سبق في المثل، و«لأن» تؤدي هذه الصلة بوضوح في العربية.
- source_word: εἰσιν
  choice: مَدْعُوُّونَ / مُخْتَارُونَ (جملة اسمية)
  rationale: لا تحتاج العربية في الزمن الحاضر إلى إظهار فعل الكينونة؛ لذلك أُدي المعنى بجملتين اسميتين طبيعيتين.
- source_word: κλητοὶ
  choice: مَدْعُوُّونَ
  rationale: يحفظ اللفظ معنى النداء، ويمكن في العربية أيضًا أن يُفهم بمعنى تلقي الدعوة، وهو ملائم لسياق وليمة العرس. وتوضح الحاشية هذا المعنى السياقي.
- source_word: ὀλίγοι
  choice: قَلِيلِينَ
  rationale: يحفظ المقابلة الموجزة والحادة مع «كثيرين».
- source_word: δὲ
  choice: لَكِنَّ
  rationale: تُظهر أداة الاستدراك التضاد بين كثرة المدعوين وقلة المختارين.
- source_word: ἐκλεκτοί
  choice: مُخْتَارُونَ
  rationale: ينقل المعنى المعجمي المباشر بعبارة عربية واضحة، من غير أن يفرض مصطلحًا مذهبيًا لاحقًا.
theological_decisions:
- issue: دلالة ἐκλεκτοί في نص يُستشهد به في مناقشات الاختيار والدعوة
  choice: مُخْتَارُونَ
  alternative: المُصْطَفَوْنَ
  rationale: «مختارون» تنقل المعنى المباشر وتحفظ التوتر اللاهوتي في العبارة دون حسمه ضمن منظومة مذهبية؛ وأُثبت البديل في الحاشية.
- issue: دلالة κλητοί في سياق مثل وليمة العرس
  choice: مَدْعُوُّونَ
  alternative: مَدْعُوُّونَ إِلَى الْوَلِيمَةِ
  rationale: الصياغة الرئيسة تحافظ على اتساع معنى النداء، بينما يبيّن البديل السياقي صلة الكلمة بدعوة الوليمة دون حصر معناها فيها.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة وذات نبرة مثلية. حُذِف فعل الكينونة في الحاضر وفق الأسلوب العربي الطبيعي، مع الحفاظ على ترتيب التقابل بين «كثيرين» و«قليلين» وعلى الغموض المقصود في «مدعوون» و«مختارون».
