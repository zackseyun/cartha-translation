  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: ar
  text: شُبِّهَ ملكوت السماوات بملكٍ أقام عرسًا لابنه[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صار ملكوت السماوات شبيهًا بملك». فصيغة الفعل اليوناني تعني حرفيًا «شُبِّهَ» أو «جُعل شبيهًا»، وتَرِد هنا في صيغة أمثال مألوفة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أعراسًا» بصيغة الجمع؛ وهي عبارة اصطلاحية تشير إلى احتفالات العرس أو وليمته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: شُبِّهَ
  rationale: يحافظ المبني للمجهول في الماضي على صيغة الفعل اليوناني، من غير إدخال معنى الإمكان الذي قد يوحي به «يمكن تشبيهه».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تعبير متى المميز؛ و«ملكوت» يحفظ إمكان دلالته على المُلك والسلطان معًا، و«السماوات» تنقل صيغة الجمع في الأصل.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: بملكٍ
  rationale: في هذا التركيب يحدد «ملك» الرجل المقصود، والعربية الطبيعية تستغني عن الصياغة الثقيلة «برجلٍ ملكٍ» من غير خسارة دلالية معتبرة.
- source_word: ὅστις
  choice: —
  rationale: أُدمجت جملة الصلة في تركيب عربي مباشر «بملكٍ أقام»؛ فالعربية تجيز حذف اسم الموصول مع النكرة، وهو الأسلوب الأفصح هنا.
- source_word: ἐποίησεν
  choice: أقام
  rationale: مع γάμους يدل الفعل اصطلاحيًا على إقامة احتفال العرس، لا على «صنعه» حرفيًا.
- source_word: γάμους
  choice: عرسًا
  rationale: جمع الكلمة اليونانية اصطلاحي، ويشير إلى احتفالات العرس أو وليمته؛ والمفرد العربي «عرسًا» طبيعي ويستوعب هذا المعنى، مع بيان الأصل في الحاشية.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: لابنه
  rationale: ينقل الداتيف بمعنى المصلحة أو التخصيص بإيجاز، من غير إضافة تفسيرية زائدة.
theological_decisions:
- issue: دلالة عبارة «ملكوت السماوات»
  choice: الإبقاء على «ملكوت السماوات»
  alternative: ملكوت الله؛ مُلك السماء
  rationale: يحفظ تعبير متى نفسه ولا يستبدله بتعبير لاهوتي موازٍ، كما يترك التوتر الدلالي بين السلطان والمجال قائمًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. اختير المبني للمجهول «شُبِّهَ» لصيانة صيغة الأصل، و«أقام عرسًا» لتجنب الحرفية غير الطبيعية. أُثبتت علامتا الحاشيتين في المتن.
