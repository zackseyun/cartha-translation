  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: ar
  text: «أنا إله إبراهيم، وإله إسحاق، وإله يعقوب». ليس هو إله أموات، بل إله أحياء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: أنا
  rationale: في العربية، الجملة الاسمية في الاقتباس «أنا إله...» تؤدي معنى الحاضر من غير حاجة إلى فعل رابط، وتحافظ على صيغة التعريف المباشر الطبيعية.
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: إله إبراهيم، وإله إسحاق، وإله يعقوب
  rationale: أُبقي تكرار «إله» كما في اليونانية لما له من وزن بلاغي، مع استعمال الإضافة العربية الطبيعية.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: ليس هو إله
  rationale: أُثبت الضمير «هو» ليعود بوضوح إلى الله المذكور، مع صياغة عربية طبيعية تحافظ على الحكم الخبري.
- source_word: νεκρῶν
  choice: أموات
  rationale: الصفة اليونانية بصيغة الجمع مستعملة استعمال الاسم؛ و«أموات» تنقلها بإيجاز وتحافظ على المقابلة.
- source_word: ζώντων
  choice: أحياء
  rationale: اسم الفاعل اليوناني مستعمل استعمال الاسم، و«أحياء» يقابله بوضوح وإيجاز في التضاد مع «أموات».
theological_decisions:
- issue: دلالة حياة الآباء أمام الله ضمن حجة يسوع بشأن القيامة
  choice: نقل العبارة كما هي من غير إضافة تفسير صريح عن القيامة أو حالة الإنسان بعد الموت.
  alternative: ليس هو إله أناس ماتوا، بل إله أناس ما زالوا أحياء لديه.
  rationale: يحفظ النص قوة حجة يسوع والتوتر اللاهوتي في عبارته، من غير أن يوسّعها إلى استنتاج عقائدي غير مصرح به في هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التكرار البلاغي في أسماء الآباء، واستُخدمت مقابلة موجزة وطبيعية بين «أموات» و«أحياء».
