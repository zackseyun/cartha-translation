  terminology: أسماء إبراهيم وإسحاق ويعقوب وصيغة «إله» مستقرة ومناسبة. لا تُدخل العبارة استنتاجًا عقائديًا زائدًا بشأن القيامة أو حالة الموتى، وتحفظ المقصود النصي.
