  source_fidelity: 'النص العربي ينقل بأمانة البنية والمعنى في اليونانية: يحافظ على الاستهلال التعريفي «أنا»، وعلى تكرار «إله» مع أسماء الآباء الثلاثة، وعلى المقابلة بين «أموات» و«أحياء». وحذف فعل الربط في «أنا إله...» أسلوب عربي فصيح يؤدي قيمة المضارع اليوناني دون زيادة تفسيرية.'
