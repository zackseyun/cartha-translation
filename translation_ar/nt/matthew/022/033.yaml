lexical_decisions:
- source_word: ἀκούσαντες
  choice: ولما سمعت ... ذلك
  rationale: اسم فاعل ماضٍ يؤدي معنى زمنيًا؛ وصياغة «ولما سمعت» طبيعية في العربية، و«ذلك» يصرّح بالمفعول المفهوم من السياق، أي جواب يسوع السابق.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: يحفظ صيغة الجمع اليونانية، وهو تعبير عربي واضح ومعاصر.
- source_word: ἐξεπλήσσοντο
  choice: دُهِشت
  rationale: ينقل قوة الدهشة التي يدل عليها الفعل، مع صياغة عربية موجزة وطبيعية؛ والماضي الناقص اليوناني يصوّر رد فعل الجموع.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: من تعليمه
  rationale: تفيد «من» سبب الدهشة أو منشأها بصورة طبيعية، وتحافظ «تعليمه» على المعنى غير التقني لكلمة διδαχή.
- source_word: καὶ
  choice: و
  rationale: أداة ربط بسيطة تصل رد فعل الجموع بما سبق.
