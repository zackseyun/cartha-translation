  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: ar
  text: 'قائلين: «يا معلّم، قال موسى: إن مات رجل وليس له أولاد، فعلى أخيه أن يتزوج أرملته[a] ويقيم نسلًا لأخيه المتوفى».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أدق: «أن يقوم بواجب أخي الزوج تجاه الأرملة». يشير الفعل اليوناني تحديدًا إلى زواج أخي الرجل المتوفى من أرملته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: نداء مباشر ليسوع بوصفه معلّمًا، وهو المقابل العربي الواضح والطبيعي.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: إن مات رجل
  rationale: السياق القانوني وصيغة المذكر يتناولان رجلًا بعينه في حكم زواج أخي الميت.
- source_word: μὴ ἔχων τέκνα
  choice: من غير أن يكون له أولاد
  rationale: يحافظ على معنى التركيب الوصفي وعلى جمع τέκνα العام، من غير قصره على البنين.
- source_word: ἐπιγαμβρεύσει
  choice: فعلى أخيه أن يتزوج امرأته
  rationale: ينقل المعنى الأساسي بوضوح في العربية، مع بيان الدلالة الفنية الخاصة بزواج أخي الميت في الحاشية.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: امرأته
  rationale: ترجمة مباشرة للتركيب اليوناني، والمرجع في السياق هو امرأة الرجل المتوفى، أي أرملته.
- source_word: ἀναστήσει σπέρμα
  choice: ويقيم نسلًا
  rationale: يحفظ الصورة الاصطلاحية التي تفيد إنجاب ذرية تُنسب إلى الأخ المتوفى، من دون استعمال «بذرة» غير الطبيعية هنا.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: لأخيه
  rationale: ينقل دلالة المنفعة أو النسبة في حالة المجرور اليونانية بإيجاز ودقة.
theological_decisions:
- issue: صياغة المثال القانوني بصيغة المذكر
  choice: «إن مات رجل... فعلى أخيه»
  alternative: «إن مات شخص... فعلى أخي ذلك الشخص»
  rationale: حكم زواج أخي الميت هنا مصوغ في أدوار أسرية ذكورية محددة، ولذلك تُحفظ دلالة الأصل ولا تُحايد.
- issue: نسبة النسل إلى الأخ المتوفى
  choice: «ويقيم نسلًا لأخيه»
  alternative: «وينجب ذرية تُنسب إلى أخيه»
  rationale: تحفظ الصياغة المختارة التعبير الكتابي المكثف والتوتر القانوني المتعلق باستمرار اسم المتوفى، من غير إضافة تفسير إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فعلى أخيه أن» لإظهار القوة الإلزامية للحكم بصورة طبيعية، ووُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
