    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: قالوا
  rationale: المضارع اليوناني هنا مضارع تاريخي؛ صيغ بالماضي بما يلائم السرد العربي الطبيعي.
- source_word: Καίσαρος
  choice: لقيصر
  rationale: المضاف إليه يجيب عن سؤال الملكية الضمني، وصيغة «لقيصر» موجزة وطبيعية في العربية.
- source_word: τότε λέγει
  choice: عندئذ قال
  rationale: تحافظ «عندئذ» على تتابع الحوار، ويُنقل المضارع التاريخي بالماضي العربي.
- source_word: Ἀπόδοτε
  choice: أدّوا
  rationale: تفيد أداء ما يجب أو رد ما يخص صاحبه، وتحافظ على قوة الأمر من غير حصر المعنى في دفع الضريبة وحدها.
- source_word: οὖν
  choice: إذن
  rationale: تبين أن الأمر نتيجة مترتبة على جوابهم السابق.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: لقيصر ما لقيصر
  rationale: صياغة عربية واضحة تحفظ الإيجاز والتوازي في الأصل.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: ولله ما لله
  rationale: تحفظ التوازي البلاغي مع العبارة السابقة وتبقي مدى حق الله مفتوحًا كما في النص.
theological_decisions:
- issue: مدى الالتزام تجاه السلطة المدنية وحق الله
  choice: 'الإبقاء على الأمرين المتوازيين: «لقيصر ما لقيصر، ولله ما لله»'
  alternative: حصر القول في دفع الضرائب، أو اعتباره تفويضًا مطلقًا لسلطة الدولة
  rationale: لا يفصل النص نظرية سياسية كاملة، بل يميز بين ما يخص قيصر وما يخص الله، مع إبقاء التوتر ومدى كل حق دون توسع تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «أدّوا» لأنها طبيعية في سياق الواجب وتحافظ على سعة الفعل اليوناني، ووُضعت علامة الحاشية مباشرة بعد اللفظ الذي تشرحه.
