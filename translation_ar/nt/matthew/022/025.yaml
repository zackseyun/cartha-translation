id: MAT.22.25
reference: Matthew 22:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: ar
  text: وكان عندنا سبعة إخوة. فتزوّج الأول ثم مات، وإذ لم يكن له نسل[a]، ترك زوجته لأخيه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «زرع». والمقصود هنا النسل أو الذرية.'
    reason: lexical_alternative
  - marker: b
    text: 'يشير هذا إلى عادة زواج أخي المتوفى، إذ كان يُنتظر من أخي الرجل الذي مات أن يتزوج أرملته ليقيم له نسلًا؛ انظر تثنية 25: 5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: عندنا
  rationale: تعبير عربي طبيعي يدل هنا على وجود هؤلاء الإخوة في جماعتهم أو محيطهم، من غير إضافة معنى زمني غير موجود في الأصل.
- source_word: ἑπτὰ ἀδελφοί
  choice: سبعة إخوة
  rationale: السياق الخاص بزواج أخي المتوفى يبيّن أن المقصود إخوة ذكور.
- source_word: ὁ πρῶτος
  choice: الأول
  rationale: يدل اللفظ على الأول في التسلسل، لا على الأكبر سنًا بالضرورة.
- source_word: γήμας
  choice: فتزوّج
  rationale: ينقل الفعل السابق للموت بعبارة عربية واضحة، مع الحفاظ على ترتيب الحدثين.
- source_word: ἐτελεύτησεν
  choice: ثم مات
  rationale: ترجمة مباشرة وواضحة، وتوضح «ثم» أن الموت وقع بعد الزواج كما تفيده صيغة اسم الفاعل الماضي في اليونانية.
- source_word: μὴ ἔχων σπέρμα
  choice: وإذ لم يكن له نسل
  rationale: «نسل» يؤدي المعنى العائلي والقانوني لكلمة σπέρμα، مع الإشارة في الحاشية إلى معناها الحرفي.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: ترك زوجته
  rationale: المقصود أنه خلّفها بعد موته، لا أنه طلّقها أو هجرها؛ والسياق يوضح ذلك.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: لأخيه
  rationale: يحافظ على دلالة المجرور اليوناني وعلى إيجاز الأصل من غير إدخال عبارة «ليتزوجها» في المتن.
theological_decisions:
- issue: هل يُصرَّح في المتن بأن الأخ كان سيأخذ الأرملة زوجة؟
  choice: 'الإبقاء على العبارة المضمرة: «ترك زوجته لأخيه».'
  alternative: «ترك زوجته لأخيه ليتزوجها».
  rationale: خلفية زواج أخي المتوفى مفهومة من الشريعة والسياق، لكن النص اليوناني لا يذكر هنا فعل الزواج صراحة؛ لذلك تُشرح الخلفية في الحاشية ولا تُضاف إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «عندنا» بدل صياغة أثقل مثل «في وسطنا»، وحُفظ إيجاز النص مع وضع علامتي الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان فعلًا.
