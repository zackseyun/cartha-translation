  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: ar
  text: فإن كان داود يدعوه «ربًّا»[a]، فكيف يكون ابنه؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتوضيح المقصود من السياق: «فإن كان داود يدعو المسيح ربًّا، فكيف يكون المسيح ابنه؟»'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: فإن كان
  rationale: تحفظ أداة الشرط والقوة الاستنتاجية في οὖν بصياغة عربية طبيعية، من غير تحويل المقدمة إلى تقرير قطعي.
- source_word: Δαυὶδ
  choice: داود
  rationale: الصيغة العربية المألوفة للاسم.
- source_word: καλεῖ
  choice: يدعوه
  rationale: تنقل معنى تسميته أو مناداته بلقب، وهو أدق هنا من «يقول له».
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود إلى المذكور في السياق السابق، من غير إضافة تفسيرية إلى المتن.
- source_word: κύριον
  choice: ربًّا
  rationale: تحفظ اللقب وما يحمله من صدى للمزمور 110:1 ومن دلالة لاهوتية، ولا تخففه إلى «سيدًا».
- source_word: πῶς
  choice: فكيف
  rationale: تنقل السؤال عن العلاقة المنطقية بين كونه رب داود وكونه ابنه.
- source_word: υἱὸς αὐτοῦ
  choice: ابنه
  rationale: تحفظ لفظ البنوة والتوتر المقصود، بدل تفسيره ابتداءً بمعنى «نسله».
- source_word: ἐστιν
  choice: يكون
  rationale: صياغة عربية طبيعية لفعل الكينونة داخل جواب الشرط والسؤال البلاغي.
theological_decisions:
- issue: دلالة دعوة داود للمسيح «ربًّا» مع كونه ابنه
  choice: إبقاء «ربًّا» و«ابنه» في المتن بلا حلّ تفسيري للتوتر بينهما.
  alternative: «فإن كان داود يدعو المسيح ربًّا، فكيف يكون المسيح ابن داود؟»
  rationale: اليونانية تستعمل ضميرًا يعود إلى السياق السابق ولا تذكر «المسيح» صراحة في هذه الآية. يحفظ النص المختار الإحالة الضميرية والتوتر المسياني والمسيحاني من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «فإن كان» لتأدية الشرط والاستنتاج بسلاسة، ووُضعت علامتا تنصيص حول اللقب «ربًّا» لإبراز أنه ما دعا به داود ذلك الشخص.
