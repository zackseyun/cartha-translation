  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: ar
  text: بهاتين الوصيتين يتعلّق الناموس كله والأنبياء.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في هاتين الوصيتين». حرف الجر اليوناني هو ἐν («في»)، لكن الباء في «بهاتين» تلائم في العربية صورة التعلّق وتفيد الارتكاز عليهما.'
    reason: lexical_alternative
  - marker: b
    text: أي إن الشهادة الكتابية كلها، المعبَّر عنها بعبارة «الناموس والأنبياء»، ترتكز على هاتين الوصيتين.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: بهاتين الوصيتين
  rationale: تؤدي الباء معنى التعلّق والارتكاز في العربية بصورة طبيعية مع الفعل «يتعلّق»، وتحافظ على الصلة المجازية التي تفيد الاعتماد.
- source_word: ὅλος ὁ νόμος
  choice: الناموس كله
  rationale: تحافظ «كله» على قوة الشمول في ὅλος، وتستعمل «الناموس» للدلالة على التوراة في الصيغة الكتابية المعروفة «الناموس والأنبياء»، لا على القانون بمعناه العام.
- source_word: κρέμαται
  choice: يتعلّق
  rationale: ينقل المعنى الحرفي المجازي للفعل، أي التعليق، كما يعبّر عربيًا عن اعتماد الكل على هاتين الوصيتين من غير استبدال الصورة بتفسير مباشر مثل «يعتمد».
- source_word: καὶ οἱ προφῆται
  choice: والأنبياء
  rationale: تحفظ العبارة الاصطلاحية «الناموس والأنبياء»، التي تشير في سياق متى إلى الشهادة الكتابية المعروفة.
theological_decisions:
- issue: دلالة عبارة «الناموس والأنبياء»
  choice: الإبقاء على الصيغة الكتابية التي تشير إلى مجموع الشهادة الكتابية في هذا السياق
  alternative: تفسيرها صراحةً بأنها «الكتب المقدسة كلها» أو حصرها في التعاليم الأخلاقية والتشريعية
  rationale: الإبقاء على الصيغة يحفظ صداها القانوني والعهدي واتساعها المقصود، من غير أن يحسمها في إعادة صياغة تفسيرية أضيق أو أوسع مما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. أُبقيت صورة التعلّق المجازية والصيغة الاصطلاحية «الناموس والأنبياء»، مع تجنّب شرح المعنى داخل المتن.
