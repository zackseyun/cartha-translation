base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: ar
  text: 'وأمّا قيامة الأموات، أفما قرأتم ما قاله الله لكم إذ يقول:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: وأمّا
  rationale: تفيد περί مع المضاف موضوع الكلام، وتدل δέ على الانتقال إلى نقطة جديدة؛ و«وأمّا» تؤدي الوظيفتين بطبيعية من غير جعل الانتقال تضادًّا قويًّا.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: قيامة الأموات
  rationale: تعبير عربي واضح ومألوف يحافظ على كون الأموات هم الفئة التي تقوم، وعلى الدلالة السياقية للقيامة الجسدية.
- source_word: οὐκ ἀνέγνωτε
  choice: أفما قرأتم
  rationale: استفهام إنكاري طبيعي يحافظ على تحدّي يسوع لمعرفتهم بما قرؤوه في الكتاب، دون تقييد الفعل بواقعة ماضية واحدة.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: ما قاله الله لكم
  rationale: صياغة عربية طبيعية تحفظ مضمون المبني للمجهول في اليونانية، وتُبقي الله مصدر القول والمخاطَبين متلقّيه.
- source_word: λέγοντος
  choice: إذ يقول
  rationale: تمهّد للاقتباس الآتي وتحافظ على صيغة اسم الفاعل الحاضر، بما يوحي بأن القول الكتابي ما زال يخاطب السامعين.
theological_decisions:
- issue: نسبة القول الكتابي إلى الله وكونه موجّهًا إلى السامعين
  choice: ما قاله الله لكم
  alternative: ما قيل لكم من قِبَل الله
  rationale: يحفظ النص أن الله هو المتكلم وأن كلام الكتاب موجّه إلى المخاطَبين، من غير إضافة نظرية محددة عن الوحي؛ واختيار المبني للمعلوم أكثر سلاسة في العربية ولا يغيّر العلاقة الدلالية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «وأمّا» للانتقال الموضوعي، و«أفما» للاستفهام الإنكاري، مع إبقاء الجملة مفتوحة بنقطتين تمهيدًا لاقتباس العدد التالي.
