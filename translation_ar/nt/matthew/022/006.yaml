  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: ar
  text: أمّا الباقون فأمسكوا بعبيده، وأساءوا معاملتهم وقتلوهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خدمه» (اليونانية: δούλους).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: أَمَّا الْبَاقُونَ
  rationale: تشير العبارة إلى بقية المدعوين، وتؤدي «أمّا» قوة δέ التقابلية الخفيفة في السياق.
- source_word: κρατήσαντες
  choice: فَأَمْسَكُوا
  rationale: تفيد القبض عليهم أو الإمساك بهم؛ وصيغت فعلًا منسقًا طبيعيًا في العربية مع بقاء تسلسل الأحداث واضحًا.
- source_word: τοὺς δούλους αὐτοῦ
  choice: عَبِيدَهُ
  rationale: تنقل «عبيده» دلالة δοῦλος الاجتماعية في سياق الملك ومبعوثيه، مع إثبات البديل «خدمه» في الحاشية.
- source_word: ὕβρισαν
  choice: أَسَاءُوا مُعَامَلَتَهُمْ
  rationale: الفعل يدل على معاملة مهينة ومؤذية، لا على الإهانة اللفظية وحدها.
- source_word: ἀπέκτειναν
  choice: قَتَلُوهُمْ
  rationale: ترجمة مباشرة لا تضيف إلى الفعل حكمًا قانونيًا زائدًا مثل «اغتالوهم» أو «قتلوهم عمدًا».
theological_decisions:
- issue: ترجمة δοῦλος في سياق المثل
  choice: عبيده
  alternative: خدمه
  rationale: «عبيده» تحافظ على الوضع الاجتماعي الذي تدل عليه اللفظة في سياق ملك يرسل مملوكيه، من غير تحميلها معنى لاهوتيًا إضافيًا؛ و«خدمه» بديل عربي سائغ مثبت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم التنسيق الفعلي بدل محاكاة اسم الفاعل اليوناني حرفيًا، لأن ذلك أجزل وأطبع في العربية، مع الحفاظ على ترتيب الإمساك ثم الإساءة والقتل.
