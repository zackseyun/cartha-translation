  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: ar
  text: 'ثم أرسل من جديد عبيدًا آخرين[a]، قائلًا: «قولوا للمدعوين: ها قد أعددت طعامي[b]؛ وقد ذُبحت ثيراني ومواشيَّ المُسمَّنة، وكل شيء جاهز. تعالوا إلى العرس[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة اللفظة اليونانية هنا: «خدمًا»؛ فهي قد تعني العبيد أو الخدم بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وجبتي» أو «وليمتي». تشير اللفظة اليونانية إلى وجبة مُعدّة، وغالبًا إلى وجبة النهار.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «إلى احتفالات العرس» أو «إلى وليمة العرس»؛ فاليونانية تستعمل صيغة الجمع التي قد تشير إلى احتفالات الزواج في مجموعها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: وعاد فأرسل
  rationale: صياغة عربية طبيعية تعبّر بوضوح عن تكرار الإرسال الذي تدل عليه πάλιν، من غير إثقال العبارة بتكرار الظروف.
- source_word: ἄλλους δούλους
  choice: عبيدًا آخرين
  rationale: لفظة δοῦλοι تدل في هذا السياق الملكي المنزلي على أشخاص خاضعين لسلطة السيد، و«عبيد» تنقل هذه المكانة الاجتماعية بصورة أوضح من «خدم».
- source_word: τοῖς κεκλημένοις
  choice: للمدعوين
  rationale: اسم المفعول العربي موجز وطبيعي، ويحفظ معنى الذين سبق أن وُجّهت إليهم الدعوة.
- source_word: Ἰδοὺ
  choice: ها
  rationale: أداة تنبيه عربية معاصرة وموجزة تؤدي وظيفة لفت الانتباه.
- source_word: τὸ ἄριστόν μου
  choice: طعامي
  rationale: اللفظة اليونانية تشير إلى وجبة مُعدّة، وقد تكون وجبة النهار أو طعام الوليمة؛ و«طعامي» يحفظ سعة الدلالة من غير حصرها في توقيت حديث محدد.
- source_word: οἱ ταῦροί μου
  choice: ثيراني
  rationale: «ثيران» أقرب دلالة مباشرة إلى ταῦροι من اللفظ الأعم «مواشٍ».
- source_word: τὰ σιτιστὰ
  choice: مواشيَّ المُسمَّنة
  rationale: الصفة اليونانية تدل على الحيوانات التي عُلّفت وسُمّنت للذبح، من غير أن تحدد أنها عجول؛ لذلك تجنبت التخصيص الزائد.
- source_word: τεθυμένα
  choice: قد ذُبحت
  rationale: السياق سياق إعداد طعام لا ذبيحة شعائرية؛ كما تنقل «قد» تمام الفعل ونتيجته الحاضرة.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: تعالوا إلى العرس
  rationale: صياغة عربية طبيعية للدعوة إلى مناسبة الزواج، مع بيان سعة الجمع اليوناني في الحاشية.
theological_decisions:
- issue: الدلالة الاجتماعية للفظة δοῦλος في مثل عن بيت ملكي
  choice: عبيد
  alternative: خدم
  rationale: يحفظ الاختيار واقع الخضوع والملكية الملازم غالبًا للفظة في العالم القديم، من غير تحويلها إلى مجرد وظيفة مأجورة أو تحميلها معنى لاهوتيًا إضافيًا.
- issue: هل تشير γάμοι إلى العرس أم إلى وليمة العرس تحديدًا؟
  choice: العرس
  alternative: وليمة العرس أو احتفالات العرس
  rationale: الجمع اليوناني قد يشمل احتفالات الزواج كلها، ولذلك اختير التعبير الأوسع في المتن بدل حصره في المأدبة وحدها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة من غير تقعر. استُخدم «وعاد فأرسل» للسرد الطبيعي، وحُفظت الفروق الدلالية في الحواشي حيث يمكن أن يضيّق اللفظ العربي معنى الأصل.
