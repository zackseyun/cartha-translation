  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: ar
  text: أَمَّا هُمْ فَلَمْ يُبَالُوا[a] وَانْصَرَفُوا، فَهَذَا إِلَى حَقْلِهِ، وَذَاكَ إِلَى تِجَارَتِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهملوا الأمر» أو «لم يكترثوا به»، والمقصود في السياق دعوة الملك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: فَلَمْ يُبَالُوا
  rationale: تفيد صيغة ἀμελέω عدم الاكتراث أو الإهمال. و«لم يبالوا» عربية طبيعية تنقل قوة اللامبالاة، مع إبقاء المفعول به مفهومًا من السياق، أي دعوة الملك.
- source_word: ἀπῆλθον
  choice: وَمَضَوْا
  rationale: تنقل «مضوا» معنى الانصراف والذهاب استجابةً للدعوة بالإهمال، وهي فصيحة واضحة من غير تكلّف.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: وَاحِدٌ ... وَآخَرُ
  rationale: تحفظ هذه الصياغة العربية التوزيع والمقابلة في التركيب اليوناني.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: إِلَى حَقْلِهِ
  rationale: «حقل» مقابل مباشر لـἀγρός، والضمير في «حقله» يؤدي معنى ἴδιον مع الملكية من غير حشو غير طبيعي.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: إِلَى تِجَارَتِهِ
  rationale: «تجارته» تنقل معنى النشاط التجاري في ἐμπορία وتحفظ ضمير الملكية، كما تقابل العمل الزراعي المذكور قبلها.
theological_decisions:
- issue: المفعول به المقدَّر مع ἀμελήσαντες
  choice: إبقاؤه ضمنيًا في «لم يبالوا»
  alternative: «لم يبالوا بالدعوة» أو «أهملوها»
  rationale: النص اليوناني لا يصرّح بالمفعول به، مع أن السياق يدل على دعوة الملك. إبقاؤه ضمنيًا يحفظ بنية المصدر وغموضه الحقيقي من غير أن يحجب المعنى عن القارئ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «لم يبالوا» لصياغة طبيعية، و«مضوا» للسرد الموجز، مع المحافظة على المقابلة بين الحقل والتجارة.
