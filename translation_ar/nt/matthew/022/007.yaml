  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: ar
  text: فغضب الملك، وأرسل جنوده، فأهلك أولئك القتلة وأحرق مدينتهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: غضب
  rationale: ينقل الفعل بوضوح وبصيغة طبيعية، مع إبقاء الملك فاعلًا للغضب.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: جنوده
  rationale: يدل السياق على قوات الملك العسكرية؛ و«جنوده» تعبير عربي واضح وموجز.
- source_word: ἀπώλεσεν
  choice: أهلك
  rationale: يحافظ على قوة الفعل الذي يفيد الإبادة أو التدمير في هذا السياق.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: أولئك القتلة
  rationale: ترجمة مباشرة تحافظ على الإشارة البعيدة والنعت الصريح.
- source_word: ἐνέπρησεν
  choice: أحرق
  rationale: ينقل المعنى المباشر لإضرام النار في المدينة دون زيادة تفسيرية.
theological_decisions:
- issue: العلاقة بين أفعال الملك المتتابعة
  choice: أرسل جنوده، فأهلك... وأحرق
  alternative: وإذ أرسل جيوشه أهلك... وأحرق
  rationale: الصياغة المختارة طبيعية في العربية، وتُظهر أن الإهلاك والإحراق أعقبا إرسال القوات، من غير إضافة تأويل لرموز المثل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إيجاز يتوافق مع تتابع الأفعال في النص اليوناني.
