  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عالِم بالشريعة». يدل اللفظ اليوناني على متخصص في الشريعة اليهودية.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: أداة ربط سردية تصل الآية بما قبلها، وتناسب العربية الطبيعية من غير إضافة دلالة زمنية زائدة.
- source_word: ἐπηρώτησεν
  choice: سأله
  rationale: ينقل معنى السؤال والاستفهام بإيجاز طبيعي، ولا يلزم إضافة «سؤالًا» لأن الفعل العربي يؤدي المعنى كاملًا.
- source_word: εἷς ἐξ αὐτῶν
  choice: واحدٌ منهم
  rationale: صياغة عربية مباشرة تحفظ دلالة انتمائه إلى الجماعة المذكورة سابقًا.
- source_word: νομικὸς
  choice: أحد علماء الشريعة
  rationale: يشير في هذا السياق اليهودي إلى المتخصص في الشريعة، لا إلى المحامي بالمفهوم المدني الحديث.
- source_word: πειράζων
  choice: ممتحنًا
  rationale: يحفظ معنى الاختبار ذي القصد العدائي أو الاستدراجي، من غير أن يضيّقه إلى الإغراء بالخطيئة.
- source_word: αὐτόν
  choice: إياه
  rationale: ضمير المفعول العائد إلى يسوع، وقد صيغ هكذا لتجنب تتابع الضمائر الملتبس.
theological_decisions:
- issue: دلالة πειράζων في موقف عالم الشريعة من يسوع
  choice: ممتحنًا إياه
  alternative: مجرِّبًا إياه
  rationale: اللفظ اليوناني يحتمل الاختبار والتجربة. «ممتحنًا» يبين هنا معنى الاختبار الاستدراجي، مع عدم تحويل العبارة إلى ادعاء أضيق بأنه كان يغريه بفعل الشر.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «علماء الشريعة» لتفادي الفهم الحديث لكلمة «محامٍ»، ووُضعت النقطتان لأن السؤال نفسه يرد في الآية التالية.
