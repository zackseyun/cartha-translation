  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: ar
  text: 'في ذلك اليوم جاء إليه الصدوقيون، الذين يقولون إنه لا قيامة، وسألوه:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير زمني عربي طبيعي يحفظ الإحالة إلى اليوم نفسه في سياق الرواية.
- source_word: προσῆλθον αὐτῷ
  choice: جاء إليه
  rationale: ينقل معنى الاقتراب والمجيء إلى يسوع بصياغة عربية واضحة وغير متكلفة.
- source_word: Σαδδουκαῖοι
  choice: الصدوقيون
  rationale: الاسم العربي المعياري المعروف لهذه الجماعة اليهودية.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: الذين يقولون إنه لا قيامة
  rationale: تؤدي العبارة بوصفها تعريفًا بموقف الصدوقيين المميز، وهو الأنسب عربيًا وسياقيًا، من غير أن تجعل السرد مؤيدًا لقولهم.
- source_word: ἀνάστασιν
  choice: قيامة
  rationale: المصطلح العربي الكتابي الشائع الذي يحفظ الدلالة اللاهوتية للكلمة اليونانية.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: وسألوه
  rationale: فعل عربي طبيعي يدل على توجيه السؤال، ويترك طبيعة السؤال الجدلية للسياق اللاحق بدل المبالغة بإضافة معنى الاستجواب.
theological_decisions:
- issue: صياغة إنكار الصدوقيين للقيامة
  choice: الذين يقولون إنه لا قيامة
  alternative: قائلين إنه لا قيامة
  rationale: يفيد التركيب اليوناني وصف الصدوقيين بموقفهم المعروف. صيغة الموصول توضح ذلك في العربية من دون إضافة تفصيل عقائدي أو تقديم قولهم على أنه تقرير من الراوي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت صيغة الموصول لإظهار الوظيفة الوصفية لاسم الفاعل اليوناني. وُضعت النقطتان في النهاية لأن الآية تمهد مباشرة لمضمون سؤالهم في الآية التالية.
