base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: ar
  text: 'فأجابهم يسوع: «أنتم مخطئون، لأنكم لا تعرفون الكتب المقدسة ولا قدرة الله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنتم ضالّون»، أو: «أنتم مُضلَّلون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: فأجابهم يسوع
  rationale: ينقل الصيغة اليونانية الاصطلاحية للجواب بعبارة عربية طبيعية موجزة، وتحمل الفاء معنى الانتقال والرد في السياق من غير تكرار حرفي من نوع «أجاب وقال».
- source_word: Πλανᾶσθε
  choice: أنتم ضالّون
  rationale: الفعل يدل هنا على الوقوع في الخطأ أو الضلال، وقد يكون بصيغة وسطى أو مبنية للمجهول من حيث الصورة. «ضالّون» تحفظ قوة التوبيخ ولا تحصر المعنى في مجرد خطأ عابر أو في تضليل خارجي وحده.
- source_word: μὴ εἰδότες
  choice: لأنكم لا تعرفون
  rationale: اسم الفاعل يبيّن سبب ضلالهم في السياق؛ وصياغة «لأنكم» تُظهر هذه العلاقة السببية بوضوح في العربية.
- source_word: τὰς γραφὰς
  choice: الكتب المقدسة
  rationale: الجمع يشير في هذا السياق اليهودي إلى الكتابات المعترف بها بوصفها نصوصًا مقدسة، وهذه العبارة هي المقابل العربي الواضح المألوف.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ولا قدرة الله
  rationale: تحافظ «ولا» على اقتران الأمرين المنفيين، وتنقل «قدرة الله» تركيب الإضافة اليوناني بدقة وطبيعية.
theological_decisions:
- issue: سبب ضلال الصدوقيين
  choice: يصرّح النص بأن ضلالهم ناشئ عن عدم معرفتهم بالكتب المقدسة وبقدرة الله معًا.
  alternative: اعتبار العبارة وصفًا مصاحبًا فقط، من غير إبراز العلاقة السببية.
  rationale: التركيب μὴ εἰδότες بعد Πλανᾶσθε يؤدي طبيعيًا وظيفة تعليلية، ولذلك تُرجِم بـ«لأنكم» مع الحفاظ على العنصرين المتوازيين.
- issue: مدى معنى Πλανᾶσθε
  choice: ضالّون
  alternative: مخطئون؛ أو مُضلَّلون
  rationale: «ضالّون» تبقي المجال مفتوحًا لكونهم واقعين في الخطأ أو منحرفين عن الصواب، من غير الجزم بأن طرفًا خارجيًا هو الذي خدعهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة مباشرة قوية تناسب مقام المحاجّة، مع تجنب الصياغة الحرفية الثقيلة. وُضع مؤشر الحاشية بعد الجملة كاملة، وهو يشرح البدائل الممكنة للفظ «ضالّون».
