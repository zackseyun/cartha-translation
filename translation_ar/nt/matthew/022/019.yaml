lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: أَرُوني
  rationale: فعل أمر للجمع، ومعناه إظهار الشيء للمتكلم كي يراه؛ و«أروني» تعبير عربي طبيعي يحفظ القوة البصرية للفعل.
- source_word: νόμισμα
  choice: عُمْلَة
  rationale: يدل اللفظ على قطعة نقدية متداولة. و«عملة» واضحة هنا، ثم يحدد السياق نوعها بأنه دينار.
- source_word: τοῦ κήνσου
  choice: الضريبة
  rationale: اللفظ اليوناني منقول عن اللاتينية ويشير إلى الضريبة الرومانية المقصودة في السياق. أبقت الترجمة المتن موجزًا، مع بيان البدائل الأدق في الحاشية.
- source_word: προσήνεγκαν
  choice: فأحضروا
  rationale: ينقل فعل الإتيان بالقطعة وتقديمها إليه في هذا السياق السردي بصياغة عربية طبيعية.
- source_word: δηνάριον
  choice: دينارًا
  rationale: اسم قطعة نقدية رومانية محددة؛ يحفظ التعريب خصوصيتها التاريخية بدل استبدالها بتسمية نقدية عامة.
