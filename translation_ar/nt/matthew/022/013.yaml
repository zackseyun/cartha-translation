  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: ar
  text: 'حينئذ قال الملك للخدم[a]: «قيّدوا رجليه ويديه، واطرحوه في الظلمة الخارجية. هناك سيكون البكاء وصرير الأسنان».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: القائمين على خدمته.'
    reason: بديل معجمي يوضح أن اللفظ يدل هنا على من يخدمون الملك في سياق المأدبة، من غير لزوم معنى كنسي اصطلاحي.
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: أداة زمنية تنقل السرد إلى الحدث التالي بعبارة عربية فصيحة وواضحة.
- source_word: ὁ βασιλεὺς
  choice: الملك
  rationale: يحفظ الصورة الملكية الصريحة في المثل.
- source_word: τοῖς διακόνοις
  choice: للخدم
  rationale: يلائم سياق المأدبة والقيام بخدمة الملك، من غير إقحام دلالة كنسية اصطلاحية؛ وأُثبت بديل توضيحي في الحاشية.
- source_word: Δήσαντες
  choice: قيّدوا
  rationale: نُقل اسم الفاعل السابق لفعل الأمر بصيغة أمر منسقة معه، وهي صياغة عربية طبيعية وتحفظ معنى الربط المحكم.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: رجليه ويديه
  rationale: 'يحفظ ترتيب اليونانية: الرجلان ثم اليدان.'
- source_word: ἐκβάλετε αὐτὸν
  choice: اطرحوه
  rationale: ينقل معنى الإخراج القسري بلفظ عربي قوي وموجز.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: في الظلمة الخارجية
  rationale: يحفظ التعبير المتّىاوي وصورته المكانية من غير تفسير عقائدي زائد.
- source_word: ἐκεῖ ἔσται
  choice: هناك يكون
  rationale: يحفظ التوكيد المكاني وصيغة المستقبل التي يدل عليها السياق، بصياغة عربية مألوفة في هذا الأسلوب الإنذاري.
- source_word: ὁ κλαυθμὸς
  choice: البكاء
  rationale: مقابل مباشر يحفظ دلالة النحيب والحزن من غير مبالغة تفسيرية.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: صرير الأسنان
  rationale: التعبير العربي الراسخ والدقيق لهذه الصورة، ويترك سببها من ألم أو غضب من غير حسم.
theological_decisions:
- issue: طبيعة صورة الإقصاء في المثل
  choice: الإبقاء على صورة الطرح في «الظلمة الخارجية» كما وردت
  alternative: التصريح بأنها جهنم أو قصرها على الحرمان الاجتماعي من المأدبة
  rationale: النص يقدم صورة دينونة حية داخل مثل، لكنه لا يفسرها هنا بهذه المصطلحات؛ لذلك ينبغي الحفاظ على توترها اللاهوتي من غير تضييق معناها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ ترتيب «رجليه ويديه» بحسب الأصل، واستُعملت العبارة الأدبية «الظلمة الخارجية» لما لها من قوة تصويرية مع بقائها مفهومة.
