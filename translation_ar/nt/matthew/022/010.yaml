  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: ar
  text: فخرج أولئك العبيد إلى الطرق، وجمعوا كل من وجدوه، الأشرار والأخيار، فامتلأ العرس بالمتكئين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي بالمدعوين المتكئين لتناول الطعام، حسب عادة الولائم الرسمية آنذاك. واليونانية حرفيًا: «فامتلأ العرس بالمتكئين».'
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: العبيد
  rationale: يحفظ الدلالة الاجتماعية الأصلية للكلمة، إذ تشير هنا إلى عبيد الملك العاملين تحت سلطانه، من غير تلطيفها إلى «خدم».
- source_word: ὁδοὺς
  choice: الطرق
  rationale: مقابل عربي طبيعي وعام للطرق العامة التي خرجوا إليها، من غير حصر المعنى في شوارع المدن.
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: جمعوا كل من وجدوه
  rationale: صياغة عربية واضحة تحفظ شمول العبارة وقوة فعل الجمع.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: الأشرار والأخيار
  rationale: تحفظ المقابلة الأخلاقية الصريحة في اليونانية، وهي أفصح وأطبع عربيًا من «السيئين والجيدين» في وصف الأشخاص.
- source_word: γάμος
  choice: العرس
  rationale: اللفظ اليوناني يعني العرس أو احتفاله، والنص نفسه يجعل المعنى السياقي مفهومًا من امتلائه بالمتكئين؛ لذلك أُبقي التعبير المجازي الموجز بدل تحويله صراحة إلى القاعة.
- source_word: ἀνακειμένων
  choice: بالمتكئين
  rationale: يحفظ هيئة تناول الطعام الرسمية في العالم القديم، مع إيضاحها في الحاشية لتجنب إدخال كلمة «ضيوف» غير الملفوظة صراحة.
theological_decisions:
- issue: الوصف الأخلاقي للمجموعين
  choice: الأشرار والأخيار
  alternative: السيئون والجيدون
  rationale: يحفظ الحدة الأخلاقية للمقابلة وشمول الدعوة في المثل، من غير استباق التمييز اللاحق أو استخلاص حكم عقائدي زائد.
- issue: مرجع «العرس» الممتلئ
  choice: الإبقاء على «العرس»
  alternative: قاعة العرس / وليمة العرس
  rationale: تحتمل γάμος العرس أو وليمته، واستعمالها بوصفها ممتلئة مجاز مفهوم في العربية؛ إبقاء اللفظ يصون سعة الأصل، بينما توضح الحاشية المقصود السياقي المحتمل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة سردية كريمة. استُعمل «العبيد» حفاظًا على الواقع الاجتماعي في الأصل، و«العرس» لصون التعبير اليوناني وعدم حسمه إلى القاعة أو الوليمة دون ضرورة.
