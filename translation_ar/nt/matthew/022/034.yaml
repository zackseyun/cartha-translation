  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: ar
  text: لكن لما سمع الفريسيون أنه قد أسكت الصدوقيين[a]، اجتمعوا معًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «كمَّم الصدوقيين». يستعمل الأصل اليوناني فعلًا يمكن أن يعني وضع كمامة على الفم، وهو هنا مجاز عن إسكاتهم في الجدال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا سرديًا مع شيء من المقابلة بما سبق، و«لكن» تؤدي ذلك بوضوح وطبيعية.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية الشائعة لاسم هذه الجماعة اليهودية.
- source_word: ἀκούσαντες
  choice: لما سمع
  rationale: اسم فاعل ماضٍ يؤدي هنا معنى زمنيًا؛ وصياغة «لما سمع» طبيعية وتحفظ تعاقب الحدثين.
- source_word: ἐφίμωσεν
  choice: قد أسكت
  rationale: الفعل يعني حرفيًا وضع كمامة، ويُستعمل هنا مجازًا للدلالة على إسكات الخصوم في الجدال؛ أُثبتت الصورة الحرفية في الحاشية.
- source_word: Σαδδουκαίους
  choice: الصدوقيين
  rationale: الصيغة العربية الشائعة لاسم هذه الجماعة اليهودية.
- source_word: συνήχθησαν
  choice: اجتمعوا
  rationale: 'صيغة المبني للمجهول في اليونانية تؤدي في السياق معنى لازمًا: تجمعوا أو اجتمعوا.'
- source_word: ἐπὶ τὸ αὐτό
  choice: معًا
  rationale: تعبير اصطلاحي يفيد الاجتماع معًا أو في موضع واحد، و«معًا» تحفظ المعنى من غير تحديد زائد للمكان أو الغرض.
