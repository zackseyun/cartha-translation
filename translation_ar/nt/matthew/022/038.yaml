lexical_decisions:
- source_word: αὕτη
  choice: هذه
  rationale: اسم إشارة مؤنث يعود إلى الوصية المذكورة في الآية السابقة، ويحفظ الإحالة بوضوح وطبيعية.
- source_word: ἐστὶν
  choice: هي
  rationale: يؤدي وظيفة فعل الكينونة في جملة اسمية عربية سليمة، ويؤكد الربط بين اسم الإشارة والخبر.
- source_word: μεγάλη
  choice: العظيمة
  rationale: ينقل معنى العظمة من جهة الأهمية والمكانة، من غير تحويل صيغة الصفة الإيجابية إلى صيغة تفضيل.
- source_word: πρώτη
  choice: الأولى
  rationale: ترجمة مباشرة للصفة التي تدل هنا على الأولوية أو الرتبة، مع إبقائها مستقلة عن صفة «العظيمة».
- source_word: ἐντολή
  choice: الوصية
  rationale: اللفظ العربي المألوف في السياق الكتابي والشرعي، وهو أنسب من «الأمر» في الحديث عن وصايا الشريعة.
theological_decisions:
- issue: العلاقة بين μεγάλη وπρώτη في وصف الوصية
  choice: 'إبقاء الصفتين منسوقتين: «الوصية العظيمة والأولى»'
  alternative: «الوصية الأهم» أو «الوصية العظمى والأولى»
  rationale: النص اليوناني يستعمل صفتين إيجابيتين منسوقتين تعدّلان «الوصية». وإظهارهما معًا يحفظ التوكيد والتمييز بين العظمة والأولوية، من غير دمجهما في معنى تفضيلي واحد أو تحويل μεγάλη إلى صيغة التفضيل.
