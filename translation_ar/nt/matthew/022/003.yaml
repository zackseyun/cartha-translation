  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: ar
  text: وأرسل خدمه[a] ليدعوا المدعوين[b] إلى وليمة العرس[c]، ولم يريدوا أن يأتوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عبيده». يمكن أن تعني الكلمة اليونانية خدمًا أو عبيدًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذين سبق أن دُعوا». يكرر النص اليوناني جذر الفعل نفسه في «ليدعوا» و«المدعوين».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «إلى العرس». والمقصود هنا احتفال العرس ووليمته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: ينقل الفعل الماضي اليوناني مباشرة وبأسلوب عربي طبيعي، من غير إضافة إيحاء أقوى مثل «أوفد».
- source_word: δούλους
  choice: خدمه
  rationale: يمكن أن يدل اللفظ اليوناني على العبيد أو الخدم. يركّز السياق هنا على دورهم بوصفهم منفذي أمر الملك، لذلك اختيرت «خدمه»، مع إثبات البديل في الحاشية.
- source_word: καλέσαι
  choice: ليدعوا
  rationale: يعبّر عن الغرض من إرسال الخدم، ويحافظ على الصلة اللفظية بالجذر نفسه في «المدعوين».
- source_word: τοὺς κεκλημένους
  choice: المدعوين
  rationale: اسم المفعول التام يشير إلى قوم سبق أن تلقوا الدعوة. وهذه الصياغة موجزة وتحافظ على تكرار جذر «دعا».
- source_word: εἰς τοὺς γάμους
  choice: إلى وليمة العرس
  rationale: صيغة الجمع اليونانية تدل في هذا السياق على احتفال العرس أو وليمته، لا على عقد الزواج وحده.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: لم يريدوا أن يأتوا
  rationale: يحافظ على دلالة الإرادة وعدم الرغبة، من غير تقوية العبارة إلى «رفضوا».
theological_decisions:
- issue: دلالة δοῦλος في المثل
  choice: خدمه
  alternative: عبيده
  rationale: المشهد يبرز وظيفة المرسلين بوصفهم خدم الملك وحملة أمره، ولا يجعل وضعهم الاجتماعي محورًا؛ ومع ذلك يُذكر المعنى البديل لأن اللفظ اليوناني يحتمله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تكرار جذر «دعا» في καλέσαι وκεκλημένους، وعلى دلالة الإرادة في οὐκ ἤθελον، مع وضع علامات الحواشي بجوار الألفاظ المعنية.
