  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: كان ... مجتمعين
  rationale: اسم فاعل في تركيب المضاف إليه المطلق يهيئ الظرف المحيط بالسؤال؛ وصيغة «بينما كان ... مجتمعين» تنقل الخلفية الزمنية والجمع بصورة عربية طبيعية.
- source_word: δὲ
  choice: وبينما
  rationale: أداة انتقال خفيفة غير استدراكية هنا؛ نُقل أثرها بواو الربط المدمجة في الجملة الظرفية، من غير إضافة لفظ مثل «أما» يوحي بمقابلة أقوى.
- source_word: τῶν Φαρισαίων
  choice: الفريسيون
  rationale: التسمية العربية القياسية للجماعة، وجاءت مرفوعة بحسب بناء الجملة العربية بعد «كان» مع تأخير الخبر.
- source_word: ἐπηρώτησεν
  choice: سأل
  rationale: المعنى المباشر في السياق هو توجيه سؤال، و«سأل» أفصح وأطبع من ألفاظ قد توحي بالاستجواب.
- source_word: αὐτοὺς
  choice: هم
  rationale: ضمير المفعول المتصل يعود بوضوح إلى الفريسيين.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الاسم العلم هو فاعل الفعل في العربية، ولا تحتاج الأعلام إلى أداة تعريف.
