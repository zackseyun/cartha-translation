base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: ar
  text: 'وقال له: «يا صاحب، كيف دخلت إلى هنا من دون لباس عرس؟» فأُسكت[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم ينطق بكلمة». والفعل اليوناني يعني حرفيًا وضع لجام في الفم، ويُستعمل بمعنى «إسكات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: يا صاحب
  rationale: نداء مهذب ظاهريًا لكنه يحمل مسافة ونبرة عتاب في سياق متى؛ و«يا صاحب» يحفظ هذا التوتر أكثر من «يا صديقي» التي قد توحي بمودة حميمة.
- source_word: πῶς
  choice: كيف
  rationale: يسأل عن الكيفية أو الوسيلة، وهو المقابل المباشر الطبيعي للفظ اليوناني من غير تحويل السؤال إلى سؤال عن الدافع.
- source_word: εἰσῆλθες ὧδε
  choice: دخلت إلى هنا
  rationale: ينقل فعل الدخول المكتمل وإشارة المكان بعبارة عربية واضحة وطبيعية.
- source_word: μὴ ἔχων
  choice: من دون
  rationale: صياغة عربية موجزة وطبيعية تعبّر عن حال دخوله وهو يفتقر إلى اللباس المذكور.
- source_word: ἔνδυμα γάμου
  choice: لباس عرس
  rationale: يحافظ على المفرد وعلى ارتباط اللباس بالعرس، من غير تحديد نوعه بأنه رداء أو حلة خاصة.
- source_word: ἐφιμώθη
  choice: لم ينطق بكلمة
  rationale: ينقل النتيجة السياقية الطبيعية، أي عجز الرجل عن تقديم جواب، بينما تُذكر الدلالة الحرفية والصيغة المبنية للمجهول في الحاشية.
theological_decisions:
- issue: نبرة خطاب صاحب العرس للرجل
  choice: نداء «يا صاحب» المهذب ظاهريًا والموحي بالعتاب والمسافة
  alternative: «يا صديقي» أو نداء أشد مثل «يا هذا»
  rationale: اللفظ اليوناني لا يقتضي مودة حميمة ولا ازدراءً صريحًا؛ لذلك يحفظ هذا الاختيار التوتر القصصي من غير تحميله موقفًا عقديًا أو عاطفيًا زائدًا.
- issue: دلالة ἐφιμώθη وصيغته المبنية للمجهول
  choice: 'صياغة تركّز على النتيجة: «لم ينطق بكلمة»'
  alternative: «أُسكت» أو، بصورة حرفية تصويرية، «كُمَّ فمه»
  rationale: السياق يبيّن أنه لم يستطع الإجابة. الصياغة المختارة عربية طبيعية، والحاشية تحفظ صورة الفعل اليوناني وقوة المبني للمجهول من غير الإيحاء في المتن بأن شخصًا سد فمه حرفيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «أما هو» لإبراز المقابلة التي تؤديها ὁ δὲ، ووُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
