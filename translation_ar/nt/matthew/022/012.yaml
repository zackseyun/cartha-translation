review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص معظم المعنى بدقة: «كيف»، وفعل الدخول، وغياب لباس العرس، وعجز الرجل عن الجواب. لكن «فلم ينطق بكلمة» يعبّر عن النتيجة وحدها ويُسقط بوضوح نسبي كون الفعل اليوناني مبنيًا للمجهول («أُسكت/أُلزم الصمت»)، وهو عنصر يمكن نقله عربيًا بسلاسة.'
  naturalness: الصياغة فصيحة وواضحة عمومًا. «يا صاحب» ممكنة، لكنها في العربية المعاصرة أقل طبيعية من «يا رجل» بوصفها نداءً غير حميم يحافظ على المسافة؛ ومع ذلك لا يلزم تغييرها. أما «أُسكت» فعبارة موجزة وطبيعية في هذا السياق وتستغني عن الإطالة التفسيرية.
  terminology: «لباس عرس» واضح ومناسب لـ ἔνδυμα γάμου، و«يا صاحب» مقبول لـ Ἑταῖρε من غير تحميل النداء مودة أو إهانة. ينبغي تعديل الحاشية لأن «كُمَّ فمه» صياغة غير مستقيمة هنا؛ والأدق في العربية «وُضِع لجام في فمه» عند بيان الخلفية التصويرية الحرفية.
  issues:
  - severity: medium
    issue: العبارة الختامية لا تُظهر المبني للمجهول في ἐφιμώθη.
    rationale: الفعل اليوناني يعني حرفيًا/أساسًا «أُسكت» (مع خلفية «كُمَّ/وُضع لجام»)، وسياقًا يفيد عجزه عن الجواب. يمكن حفظ المعنى والوضوح بعبارة «فأُسكت» مع حاشية تشرح الدلالة.
  - severity: low
    issue: صياغة الحاشية «كُمَّ فمه» غير سليمة نحويًا ودلاليًا بهذه الصورة.
    rationale: 'إن أريدت الصورة الحرفية للفعل، فالأوضح: «وُضع لجام في فمه» أو «أُلجم». كما أن الحاشية ينبغي أن تشرح أن «أُسكت» بديل أقرب إلى اللفظ لا أن تقدمه بوصفه المعنى الحرفي الوحيد.'
