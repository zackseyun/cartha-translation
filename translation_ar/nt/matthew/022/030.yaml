id: MAT.22.30
reference: Matthew 22:30
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: ar
  text: لأنهم في القيامة[a] لا يتزوجون ولا يُزوَّجون، بل هم مثل ملائكة الله في السماء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند القيامة».'
    reason: بديل لغوي ممكن لعبارة ἐν τῇ ἀναστάσει، يبرز الزمن بدل حال الحياة في القيامة.
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: في القيامة
  rationale: تحافظ «في» على دلالة حرف الجر اليوناني، ويمكن أن تشير إلى حال الحياة بعد القيامة أو زمنها، من غير حصر المعنى في لحظة الحدث وحدها.
- source_word: γαμοῦσιν
  choice: يتزوجون
  rationale: فعل عربي عام وطبيعي للدخول في الزواج، ولا يضيف تخصيصًا غير لازم.
- source_word: γαμίζονται
  choice: يُزوَّجون
  rationale: صيغة المبني للمجهول تحفظ تمييز النص اليوناني بين الإقدام على الزواج وبين أن يُزوَّج الشخص.
- source_word: ὡς
  choice: مثل
  rationale: تفيد المقارنة لا التطابق، فلا توحي بأن القائمين من الموت يصيرون ملائكة.
- source_word: ἄγγελοι θεοῦ
  choice: ملائكة الله
  rationale: تنقل المضاف إليه θεοῦ صراحة وبصياغة عربية واضحة ومألوفة.
- source_word: ἐν τῷ οὐρανῷ
  choice: في السماء
  rationale: المقصود هنا السماء بوصفها موطن الملائكة، لا السماء المنظورة وحدها.
- source_word: γὰρ
  choice: لأنهم
  rationale: تنقل العلاقة التفسيرية أو التعليلية مع الكلام السابق، ويأتي الضمير من الفعلين اليونانيين وسياق الحديث عن القائمين.
theological_decisions:
- issue: طبيعة التشبيه بالملائكة
  choice: القائمون من الموت مثل الملائكة في السياق المتعلق بعدم الزواج، لا أنهم يتحولون إلى ملائكة.
  alternative: قد يُفهم التشبيه على أنه يشمل نمط وجود ملائكيًا أوسع.
  rationale: تدل ὡς على المشابهة لا الهوية، والسياق المباشر يربط التشبيه بانتفاء الزواج؛ لذلك تحافظ «مثل» على حدود العبارة من غير إضافة تفسير عقدي إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. وُضع مؤشر الحاشية بعد «القيامة» لأنه يخص العبارة اليونانية ἐν τῇ ἀναστάσει. استُخدم «يُزوَّجون» للمحافظة على المبني للمجهول، و«مثل» لصون معنى المقارنة.
