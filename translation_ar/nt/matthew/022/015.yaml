source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: ar
  text: حينئذٍ ذهب الفريسيون وتشاوروا كيف يوقعونه في الفخ بكلامه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دبّروا كيف يوقعونه في الفخ بما يقوله».'
    reason: بديل معجمي وصياغي يبرز معنى التخطيط ويفكك العبارة اليونانية الموجزة ἐν λόγῳ.
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: ظرف زمان يربط الحدث بما سبقه في تسلسل السرد، وهذه صياغة عربية موجزة وطبيعية.
- source_word: πορευθέντες
  choice: ذهب
  rationale: اسم الفاعل الماضي يسبق الفعل الرئيس ويفيد هنا حركة تمهّد للتشاور؛ وصيغة الفعل المعطوف طبيعية في العربية.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: التسمية العربية المعيارية لهذه الجماعة.
- source_word: συμβούλιον ἔλαβον
  choice: تشاوروا
  rationale: ينقل التعبير الاصطلاحي بمعنى تداول الرأي ووضع خطة، من غير تحميله وحده معنى العداء الذي توضحه جملة الغرض.
- source_word: ὅπως
  choice: كيف
  rationale: تدخل على مضمون المشاورة وغايتها، وتنسجم طبيعيًا مع «تشاوروا».
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول العائد إلى يسوع بحسب السياق.
- source_word: παγιδεύσωσιν
  choice: يوقعونه في الفخ
  rationale: يحافظ على صورة المصيدة في الفعل اليوناني ويعبّر بوضوح عن القصد العدائي.
- source_word: ἐν λόγῳ
  choice: بكلامه
  rationale: يفيد الوسيلة أو المجال، أي اصطياده بسبب كلام يصدر منه؛ وإضافة الكلام إليه مفهومة من السياق.
theological_decisions:
- issue: مقدار العداء المعبَّر عنه في συμβούλιον ἔλαβον
  choice: 'ترجمة العبارة ترجمة محايدة نسبيًا: «تشاوروا»، وترك القصد العدائي لجملة «كيف يوقعونه في الفخ».'
  alternative: «تآمروا» أو «دبّروا مكيدة»
  rationale: العداء ثابت في الآية، لكنه مصرح به في غرض التشاور؛ لذلك لا حاجة إلى إدخاله مرتين أو تقوية العبارة الأولى تفسيريًا.
- issue: دلالة ἐν λόγῳ
  choice: «بكلامه» مع إثبات بديل في الحاشية.
  alternative: «بما يقوله»
  rationale: العبارة اليونانية موجزة ويمكن فهمها على أنها الوسيلة، أو الكلام الذي يراد أن يصدر عنه؛ والمتن يحافظ على إيجازها بينما توضّح الحاشية البديل الطبيعي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم «يوقعونه في الفخ» للمحافظة على الصورة المجازية، و«تشاوروا» لتجنب المبالغة التفسيرية في العبارة الأولى.
