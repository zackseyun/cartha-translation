  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: ar
  text: ولم يستطع أحد أن يجيبه بكلمة[a]، ولم يجرؤ أحد، منذ ذلك اليوم، أن يسأله بعد ذلك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يجيبه بكلمة واحدة». والتعبير اليوناني حرفيًا: «أن يجيبه بكلمة».'
    reason: بديل معجمي يوضح قوة التعبير اليوناني من غير أن يفرض كلمة «واحدة» في المتن.
lexical_decisions:
- source_word: οὐδεὶς
  choice: أحد مع النفي
  rationale: 'ينقل النفي الشامل للأشخاص بصياغة عربية فصيحة وطبيعية: «لم يستطع أحد».'
- source_word: ἐδύνατο
  choice: يستطع
  rationale: ينقل معنى القدرة المنفية في الزمن الماضي، مع دلالة صيغة الناقص اليونانية بحسب السياق السردي.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: أن يجيبه بكلمة
  rationale: يحافظ على ذكر «كلمة» الصريح في اليونانية وعلى قوة التعبير، مع بقاء العبارة مفهومة وطبيعية في العربية.
- source_word: οὐδὲ
  choice: ولم
  rationale: يربط الجملة السلبية الثانية بالأولى ربطًا طبيعيًا في العربية، مؤديًا معنى «ولا» الاستمراري.
- source_word: ἐτόλμησέν τις
  choice: يجرؤ أحد
  rationale: ينقل معنى الإقدام والجرأة، في تركيب منفي يلائم الأسلوب العربي.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: منذ ذلك اليوم
  rationale: يحدد نقطة بداية استمرار الامتناع عن السؤال، وهو المقصود من العبارة اليونانية.
- source_word: ἐπερωτῆσαι
  choice: أن يسأله
  rationale: الفعل يدل هنا على توجيه سؤال إلى يسوع في سياق المجادلة؛ و«يسأله» واضح ولا يضيف معنى الاستجواب القسري.
- source_word: οὐκέτι
  choice: بعد ذلك
  rationale: يعبّر في هذا السياق عن توقف توجيه الأسئلة من تلك النقطة فصاعدًا، بصياغة عربية طبيعية.
theological_decisions:
- issue: الدلالة السردية لصمت المخاطَبين بعد جواب يسوع
  choice: صياغة الخبر بوصفه عجزًا عن الإجابة وامتناعًا عن مواصلة سؤاله
  alternative: إدخال تعبير صريح عن تفوق حكمة يسوع أو سلطانه
  rationale: السياق يوحي بانتصاره في المجادلة، لكن الآية نفسها تقتصر على الإخبار بأن أحدًا لم يستطع أن يجيبه ولم يجرؤ على سؤاله بعد ذلك؛ لذلك لا تُضاف خلاصة لاهوتية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على توازي الجملتين المنفيتين وعلى العبارة اليونانية التي تذكر «كلمة» صراحة، مع تجنب التفسير العقائدي الزائد.
