lexical_decisions:
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: صيغة نداء مباشرة، و«معلّم» هي الدلالة المألوفة والواضحة في هذا السياق، من غير إيحاءات سلطوية زائدة.
- source_word: ποία
  choice: أيّة
  rationale: أداة استفهام تطلب تعيين وصية من بين وصايا الشريعة.
- source_word: ἐντολὴ
  choice: وصيّة
  rationale: اللفظ العربي المألوف للأمر الإلهي في السياق الكتابي والشرعي.
- source_word: μεγάλη
  choice: الأعظم
  rationale: مع أن اليونانية تستعمل صفة في الدرجة الإيجابية، فإن تركيب السؤال وسياق المفاضلة بين الوصايا يمنحانها معنى التفضيل، وصيغة «الأعظم» طبيعية وواضحة بالعربية.
- source_word: ἐν τῷ νόμῳ
  choice: في الشريعة
  rationale: تشير العبارة إلى شريعة موسى، و«الشريعة» تعبير عربي واضح وشائع لهذا المرجع.
theological_decisions:
- issue: هل تُنقل μεγάλη بصيغة الصفة العادية أم بصيغة التفضيل؟
  choice: الأعظم
  alternative: عظيمة
  rationale: الصيغة اليونانية إيجابية من حيث الشكل، لكن السؤال يطلب ترتيب وصية من بين الوصايا؛ لذلك تنقل «الأعظم» القوة السياقية نقلاً طبيعيًا، من غير إضافة موقف لاهوتي خاص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم النداء الطبيعي «يا معلّم»، وحُفظت صيغة السؤال الموجزة.
