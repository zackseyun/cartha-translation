  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: ar
  text: 'فقولوا لنا إذًا: ما رأيك؟ أيجوز أن نعطي قيصر ضريبة الرأس أم لا؟'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: ما رأيك؟
  rationale: 'تعبير عربي طبيعي ينقل سؤالهم الحرفي عن رأيه: «ماذا يبدو لك؟».'
- source_word: ἔξεστιν
  choice: أيجوز
  rationale: ينقل معنى الجواز أو المشروعية من غير أن يحسم هل المقصود حكم الشريعة تحديدًا أم الإذن عمومًا.
- source_word: δοῦναι
  choice: أن نعطي
  rationale: يحافظ على الفعل اليوناني «يعطي»، بدل استبداله تفسيرًا بالفعل «يدفع».
- source_word: κῆνσον
  choice: ضريبة الرأس
  rationale: يشير إلى ضريبة التعداد أو الجزية الفردية الرومانية، وهو أدق من لفظ «الضريبة» العام وحده.
- source_word: Καίσαρι
  choice: قيصر
  rationale: اللقب الإمبراطوري المعروف عربيًا، مع إبقاء الجهة السياسية المقصودة في النص.
theological_decisions:
- issue: مدى دلالة ἔξεστιν
  choice: أيجوز
  alternative: أيحلّ
  rationale: «أيجوز» يحفظ اتساع اللفظ بين الجواز الديني والقانوني، ولا يفرض إطارًا فقهيًا أضيق.
- issue: صياغة δοῦναι في سؤال الضريبة
  choice: أن نعطي
  alternative: أن ندفع
  rationale: اختيرت المطابقة المباشرة للفعل اليوناني، محافظةً على الصياغة التي قد تمهّد لجواب يسوع عن إعطاء ما لقيصر.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم الاستفهام «أيجوز» للإيجاز والطبيعية، و«ضريبة الرأس» لتوضيح نوع κῆνσος من دون حاشية.
