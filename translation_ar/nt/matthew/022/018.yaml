  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: ar
  text: 'لكن يسوع، إذ عرف خبثهم[a]، قال: «لماذا تختبرونني[b]، يا مراؤون؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شرهم» أو «سوء قصدهم».
    reason: lexical_alternative
  - marker: b
    text: أو «تجربونني». يمكن أن يعني الفعل اليوناني «يختبر» أو «يمتحن» أو «يجرّب»، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: إذ عرف
  rationale: اسم فاعل ظرفي سابق للفعل الرئيس، وتؤدي «إذ عرف» معنى إدراك يسوع لما وراء سؤالهم بصياغة عربية طبيعية موجزة.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة هنا انتقالًا ذا مسحة استدراكية، إذ يقابل إدراك يسوع خداعهم تظاهرهم بالإخلاص.
- source_word: πονηρίαν
  choice: خبثهم
  rationale: تدل الكلمة على الشر أو الخبث وسوء القصد. و«خبثهم» طبيعية في العربية، وتشمل فساد الدافع من غير أن تحصر الدلالة في مجرد نية ذهنية.
- source_word: εἶπεν
  choice: قال
  rationale: المقابل السردي العربي المعتاد والدقيق للفعل.
- source_word: Τί
  choice: لماذا
  rationale: تأتي τί هنا استفهامية عن السبب، و«لماذا» هي الصياغة العربية الطبيعية.
- source_word: πειράζετε
  choice: تختبرونني
  rationale: يمكن أن يعني الفعل الاختبار أو التجربة بحسب السياق. والخصوم هنا يحاولون امتحان يسوع للإيقاع به، لذلك يحفظ «تختبرونني» اتساع الدلالة، مع بيان البديل في الحاشية.
- source_word: ὑποκριταί
  choice: يا مراؤون
  rationale: «المراؤون» تعبير عربي واضح لمن يُظهرون غير ما يبطنون، وهو مناسب لتظاهرهم بالإخلاص مع إضمار الخبث.
theological_decisions:
- issue: إدراك يسوع للدافع الباطني لدى خصومه
  choice: إذ عرف خبثهم
  alternative: إذ أدرك شرهم؛ إذ عرف سوء قصدهم
  rationale: ينسب النص إلى يسوع معرفة الطابع الشرير في موقفهم. وتحفظ الصياغة هذا التقرير من غير توسيعه إلى تقرير عقائدي يتجاوز الآية.
- issue: دلالة πειράζετε بين الاختبار والتجربة
  choice: تختبرونني
  alternative: تجربونني
  rationale: السياق هو سؤال فخ يراد به امتحان يسوع والإيقاع به؛ لذا يلائم «تختبرونني» الحدث مباشرة، مع إبقاء «تجربونني» بديلًا معجميًا مشروعًا في الحاشية.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم النداء «يا مراؤون» لطلاقة العربية، وحُفظت البدائل الدلالية الحقيقية في الحواشي.
