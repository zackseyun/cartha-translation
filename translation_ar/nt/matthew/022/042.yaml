  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: ar
  text: 'قائلًا: «ما رأيكم في المسيح[a]؟ ابنُ مَن هو؟» قالوا له: «ابن داود».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللقب اليوناني هو Χριστός (خريستوس)، أي «المسيح»، وهو مستعمل هنا بمعناه المسياني.
    reason: توضيح دلالة اللقب اليوناني؛ إذ لا تتيح العربية في هذا الموضع تمييزًا طبيعيًا بين «المسيح» و«الـChrist» كما في الإنجليزية.
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حالي من λέγω يقدّم كلام يسوع مباشرة، وصيغة «قائلًا» تحافظ على البنية اليونانية وتلائم السرد العربي الفصيح.
- source_word: Τί ὑμῖν δοκεῖ
  choice: ما رأيكم
  rationale: يسأل التركيب عن حكم المخاطَبين أو رأيهم؛ و«ما رأيكم» تعبير عربي طبيعي ودقيق.
- source_word: περὶ τοῦ χριστοῦ
  choice: في المسيح
  rationale: Χριστός هنا لقب ذو دلالة مسيانية في سياق يهودي، و«المسيح» هو المقابل العربي المألوف الذي يحافظ على كونه لقبًا.
- source_word: τίνος υἱός ἐστιν
  choice: ابنُ مَن هو؟
  rationale: يحافظ على السؤال المباشر عن البنوة والنسب، مع ترتيب عربي واضح وطبيعي.
- source_word: λέγουσιν αὐτῷ
  choice: قالوا له
  rationale: الفعل مضارع تاريخي في السرد اليوناني، ويُنقل طبيعيًا بالماضي في العربية، مع إبقاء المفعول غير المباشر «له».
- source_word: Τοῦ Δαυίδ
  choice: ابن داود
  rationale: الجواب اليوناني مضاف إليه موجز حُذف منه «ابن» اعتمادًا على السؤال؛ وإظهاره في العربية يبيّن الإضمار ويعطي جوابًا طبيعيًا من غير تغيير المعنى.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الكريستوس
  rationale: اللفظ مستعمل هنا لقبًا مسيانيًا لا اسمًا شخصيًا؛ و«المسيح» ينقل معناه واستعماله العربي الراسخ، بينما النقل الصوتي غريب وغير لازم.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت صيغة السؤال المختصرة، ونُقل المضارع التاريخي بصيغة الماضي وفق أسلوب السرد العربي الطبيعي.
