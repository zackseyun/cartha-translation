  register: عربية فصحى معاصرة، واضحة وكريمة النبرة. استُخدم «ملتقيات الطرق» للمحافظة على المجال الدلالي للعبارة اليونانية، مع إثبات البدائل في الحاشية، واستُخدم «وليمة العرس» لإظهار المقصود الاصطلاحي من صيغة الجمع.
