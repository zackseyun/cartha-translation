  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: ar
  text: فاذهبوا إذن إلى ملتقيات الطرق[a]، وكلُّ من تجدونه ادعوه إلى وليمة العرس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مفارق الطرق» أو «مخارج الطرق»؛ تشير اليونانية إلى مواضع تلتقي فيها الطرق أو تتفرع.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا في اليونانية: «إلى الأعراس»، وهو تعبير يُقصد به احتفال العرس أو وليمته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: اذهبوا
  rationale: فعل أمر واضح ومباشر، وصيغة الجمع توافق المخاطَبين.
- source_word: οὖν
  choice: إذن
  rationale: تفيد النتيجة المترتبة على الكلام السابق، وهي طبيعية وواضحة في العربية المعاصرة.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: إلى ملتقيات الطرق
  rationale: تدل العبارة على المواضع التي تتلاقى فيها الطرق أو تتفرع، و«ملتقيات الطرق» تعبير عربي واضح من غير تقييد المشهد بتصور حضري حديث.
- source_word: ὅσους ἐὰν εὕρητε
  choice: كلُّ من تجدونه
  rationale: تنقل شمول العبارة وانفتاحها على جميع الذين يعثر عليهم الخدم، بصياغة عربية طبيعية.
- source_word: καλέσατε
  choice: ادعوه
  rationale: في سياق الوليمة يعني الفعل توجيه الدعوة، لا مجرد النداء.
- source_word: εἰς τοὺς γάμους
  choice: إلى وليمة العرس
  rationale: جمع γάμοι هنا اصطلاح يشير إلى احتفال العرس أو مأدبته، لا إلى أعراس متعددة.
theological_decisions: []
