base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: ar
  text: ففي القيامة إذن، زوجةُ أيِّ واحدٍ من السبعة تكون؟ لأنهم جميعًا تزوّجوها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا في اليونانية: «لأنهم جميعًا كانت لهم»، والمقصود أن السبعة كلهم تزوّجوها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: القيامة
  rationale: 'يدل الاسم في هذا السياق على قيامة الأموات التي ينكرها الصدوقيون، وتفيد العبارة مع ἐν الظرف الزمني أو الحال: «في القيامة».'
- source_word: οὖν
  choice: إذن
  rationale: تربط أداة الاستنتاج السؤال بما سبقه وتحافظ «إذن» على تسلسل الحجة بصياغة عربية طبيعية.
- source_word: τίνος τῶν ἑπτὰ
  choice: أيّ واحد من السبعة
  rationale: الاستفهام يطلب تعيين الزوج من بين الإخوة السبعة؛ وهذه الصياغة أوضح في العربية من الترجمة الحرفية «لِمَن من السبعة».
- source_word: ἔσται γυνή
  choice: تكون زوجة
  rationale: يفرض سياق الزواج معنى «زوجة» لـγυνή، ويُنقل المستقبل بالفعل «تكون» من غير زيادة تفسيرية.
- source_word: πάντες
  choice: جميعًا
  rationale: يعود اللفظ على الإخوة السبعة كلهم، وتحافظ «جميعًا» على شموله.
- source_word: γὰρ
  choice: لأن
  rationale: تقدم الأداة سبب السؤال وتربط الجملة التعليلية به ربطًا واضحًا في العربية المعاصرة.
- source_word: ἔσχον αὐτήν
  choice: تزوّجوها
  rationale: المعنى السياقي للعبارة الحرفية «كانت لهم/أخذوها» هو أن كل واحد منهم تزوجها؛ والصياغة المختارة طبيعية وواضحة، مع حفظ اللفظ الأقرب إلى الحرفية في الحاشية.
theological_decisions:
- issue: مدلول ἀνάστασις في تحدي الصدوقيين
  choice: القيامة المستقبلية من الموت
  alternative: حياة مبهمة بعد الموت
  rationale: يدور السياق تحديدًا حول إنكار الصدوقيين قيامة الأموات، ويجيب يسوع عن هذا الموضوع نفسه في الآيات التالية؛ لذلك تحافظ «القيامة» على المدلول المحدد من غير توسيع.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. قُدّم «زوجة» للنبرة الاستفهامية الطبيعية، واستُعمل «تزوّجوها» بدل محاكاة العبارة اليونانية التي تبدو ملتبسة أو غير مألوفة بالعربية، مع إثبات الحرفية في الحاشية.
