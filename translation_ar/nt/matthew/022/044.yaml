  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: ar
  text: '«قال الرب لربي: اجلس عن يميني حتى أضع أعداءك تحت قدميك»؟'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: يحافظ على اللقب نفسه في الموضعين كما في النص اليوناني، مع إظهار العلاقة في العبارة «لربي»، من غير إدخال تمييز غير مصرح به في صيغة الاقتباس اليونانية.
- source_word: Εἶπεν
  choice: قال
  rationale: المقابل العربي الطبيعي والمباشر لفعل القول في صيغة الاقتباس.
- source_word: τῷ κυρίῳ μου
  choice: لربي
  rationale: تنقل الداتيف بوصفه متلقي القول، وتحفظ لقب «الرب» ودلالة الإضافة «ربي» بإيجاز طبيعي.
- source_word: Κάθου
  choice: اجلس
  rationale: أمر مباشر وطبيعي يلائم سياق الجلوس في موضع السلطان والتكريم.
- source_word: ἐκ δεξιῶν μου
  choice: عن يميني
  rationale: تعبير عربي فصيح ومألوف للمكان ذي الكرامة والسلطان عند اليمين.
- source_word: ἕως ἂν θῶ
  choice: حتى أضع
  rationale: ينقل الغاية الزمنية المتجهة إلى المستقبل مع الفعل الدال على الوضع.
- source_word: ἐχθρούς
  choice: أعداءك
  rationale: المقابل العربي القياسي الواضح في هذا السياق.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: تحت قدميك
  rationale: ترجمة مباشرة لصياغة متى اليونانية، من غير استبدالها بصورة «موطئًا لقدميك» الواردة في تقليد نص المزمور العبري.
theological_decisions:
- issue: ورود κύριος مرتين في اقتباس مزمور 110:1
  choice: قال الرب لربي
  alternative: قال الرب لسيدي؛ أو قال الرَّب لربي مع تمييز طباعي للاسم الإلهي
  rationale: النص اليوناني يستخدم اللقب نفسه في الموضعين. لذلك تحافظ الترجمة على «الرب» في كليهما، وتترك الإضافة في «لربي» تبيّن العلاقة، من غير أن تفرض تمييزًا طباعيًا مستمدًا من العبرية أو تضعف قوة اللقب الثاني باستبداله بـ«سيدي».
- issue: صورة إخضاع الأعداء
  choice: أضع أعداءك تحت قدميك
  alternative: أجعل أعداءك موطئًا لقدميك
  rationale: صياغة متى اليونانية تقول مباشرة «تحت قدميك»، ولذلك تُحفظ في المتن بدل توسيعها إلى صورة الموطئ المأخوذة من الصياغة العبرية للمزمور.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على إيجاز الاقتباس وبنيته الاستفهامية ضمن سياق سؤال يسوع. لا حاجة إلى حاشية لأن البديل المذكور في طبقة المشاورة الإنجليزية («موطئًا لقدميك») لا يطابق حرفيًا صياغة متى اليونانية هنا.
