lexical_decisions:
- source_word: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς
  choice: وضرب لهم مثلًا آخر
  rationale: تؤدي العبارة العربية الطبيعية معنى تقديم مثل آخر للسامعين، وتحفظ تسلسل الأمثال من غير تقيد بصورة «وضع أمامهم» غير المألوفة عربيًا.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ صلة اسم الفاعل بالمقدمة وينقل بسلاسة إلى الكلام المباشر.
- source_word: Ὡμοιώθη
  choice: شُبِّه
  rationale: يحفظ صيغة الماضي المبني للمجهول في اليونانية، مع إبقاء المقارنة المَثَلية دون تحويلها إلى تقرير عن ماهية الملكوت.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تعبير عربي راسخ ودقيق لعبارة متى المميزة، ويحفظ صيغة الجمع في οὐρανῶν.
- source_word: ἀνθρώπῳ
  choice: برجل
  rationale: السياق يشير إلى شخصية مذكرة مفردة في المثل، ولذلك «رجل» أدق من لفظ عام مثل «إنسان».
- source_word: σπείραντι καλὸν σπέρμα
  choice: زرع زرعًا جيدًا
  rationale: يحفظ التكرار الاشتقاقي بين الفعل والاسم في اليونانية، ويبين جودة البذار تمهيدًا لمقابلته بالزوان في السياق التالي.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: في حقله
  rationale: ترجمة مباشرة ومألوفة، وتربط ضمير الملكية بالرجل المذكور.
theological_decisions:
- issue: صيغة تقديم مثل الملكوت
  choice: شُبِّه ملكوت السماوات برجل
  alternative: ملكوت السماوات يشبه رجلًا
  rationale: يحفظ المختار صيغة Ὡμοιώθη الماضية المبنية للمجهول والتوتر الأسلوبي في الأصل، من غير استنتاج أن الملكوت قد تغير أو «صار» شيئًا لم يكنه.
- issue: ترجمة ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  alternative: مملكة السماء
  rationale: «ملكوت السماوات» يصون الدلالة على سلطان الله وملكه، ويحفظ تعبير متى المميز وصيغة الجمع من دون إضافة تفسير مذهبي.
