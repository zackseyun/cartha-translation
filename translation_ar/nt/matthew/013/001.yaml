  text: في ذلك اليوم خرج يسوع من البيت، وكان جالسًا بجانب البحر[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في اليوم نفسه»، إذا عُدَّ التعبير مؤكدًا لاستمرار أحداث السياق السابق، لا مجرد تحديد للوقت.
    reason: alternative_reading
  - marker: b
