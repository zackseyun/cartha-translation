    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: في ذلك اليوم
  rationale: تعبير زمني عربي طبيعي يحفظ الإشارة إلى اليوم المذكور من غير أن يضيف صراحة معنى «نفسه» غير الموجود لفظًا في اليونانية.
- source_word: ἐξελθὼν
  choice: خرج
  rationale: اسم الفاعل الماضي يسبق الفعل الرئيس ويدل على حدث تمهيدي؛ وصياغته فعلًا معطوفًا هي الأسلس في العربية وتحفظ ترتيب الحدثين.
- source_word: τῆς οἰκίας
  choice: من البيت
  rationale: المضاف إليه مع فعل الخروج يحدد المكان الذي خرج منه يسوع، و«من البيت» هي الصياغة العربية الطبيعية.
- source_word: ἐκάθητο
  choice: جلس
  rationale: الفعل اليوناني الناقص قد يصوّر الجلوس بوصفه حالة مستمرة، لكن «جلس» في هذا السياق السردي عربي طبيعي ولا يفرض معنى بدء الجلوس أكثر مما يقتضيه السياق.
- source_word: παρὰ τὴν θάλασσαν
  choice: بجانب البحر
  rationale: تحفظ معنى الموقع القريب من البحر من غير تحديد أنه على الشاطئ نفسه أو بيان مسافة دقيقة.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: نقل الاسم الشخصي وفق الصيغة العربية الكتابية المستقرة.
