id: MAT.13.15
reference: Matthew 13:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: ar
  text: لأن قلب هذا الشعب قد تبلَّد، وبآذانهم سمعوا بثِقَل[a]، وأغمضوا عيونهم، لئلا يُبصروا بعيونهم، ويسمعوا بآذانهم، ويفهموا بقلوبهم، ويرجعوا[b]، فأشفيهم.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي سمعوا بصعوبة أو بتثاقل؛ وحرفيًا: «سمعوا بثِقَل».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «يعودوا» أو «يتحوّلوا».'
    reason: lexical_alternative
  - marker: c
    text: اقتباس من إشعياء 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: قد تبلَّد
  rationale: الفعل يعني حرفيًا صار غليظًا أو ثخينًا، لكنه مع «القلب» يدل على البلادة وفقدان الحس والفهم. «تبلَّد» ينقل الاستعارة بمعناها السياقي في عربية واضحة من غير إضافة تفسير عقائدي.
- source_word: καρδία
  choice: قلب
  rationale: يحافظ على صورة الأصل، حيث القلب موضع الفهم والاستجابة الباطنة، كما يؤكد ذكر الفهم بالقلب لاحقًا في الآية.
- source_word: βαρέως ἤκουσαν
  choice: سمعوا بثِقَل
  rationale: صياغة قريبة من حرفية الأصل «سمعوا بثقل»، وتحفظ صورة السمع المتعسر أو المتثاقل من غير حصرها في عجز جسدي أو امتناع إرادي وحده.
- source_word: ἐκάμμυσαν
  choice: أغمضوا
  rationale: ينقل الفعل المتعدي الذي يسند إلى الشعب إغلاق عيونهم، فيحفظ مسؤوليتهم الفاعلة التي يصرح بها النص.
- source_word: μήποτε
  choice: لئلا
  rationale: تحفظ دلالة الغاية أو النتيجة السلبية في العبارة، ولا تبدد التوتر المقصود في اقتباس إشعياء.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν ... ἐπιστρέψωσιν
  choice: يُبصروا ... ويسمعوا ... ويفهموا ... ويرجعوا
  rationale: تحافظ على تتابع أفعال الأصل وصيغة الاحتمال التابعة لـ«لئلا»، مع ألفاظ عربية مباشرة ومفهومة.
- source_word: ἐπιστρέψωσιν
  choice: يرجعوا
  rationale: «يرجعوا» يحفظ معنى التحول أو العودة، ويترك السياق يحمل دلالة الرجوع إلى الله من غير إدخال مصطلح كنسي تقني.
- source_word: ἰάσομαι
  choice: فأشفيهم
  rationale: ينقل المستقبل اليوناني بوصف الشفاء ما يلي رجوعهم. الفاء توضح التتابع الطبيعي في العربية، من غير تحويل العبارة إلى صيغة شرطية صريحة غير موجودة في الأصل.
theological_decisions:
- issue: التوتر بين الدينونة الإلهية ومسؤولية الشعب في عبارة «لئلا»
  choice: لئلا يُبصروا ... ويرجعوا، فأشفيهم
  alternative: وإلا لأبصروا ... ورجعوا، ولشفيتهم
  rationale: اختيرت الصياغة الأقرب إلى البنية الظاهرة للنص اليوناني، مع إبقاء إغماض العيون فعلًا منسوبًا إلى الشعب. وهي لا تحسم جدل الغاية والنتيجة أو علاقة التقسية بالمسؤولية البشرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حوفظ على التوازي بين العينين والأذنين والقلب، وعلى التكرار البلاغي في الأصل. استُخدم «تبلَّد» بدل الحرفية المربكة «سَمُن/غَلُظ» للقلب، بينما أُبقيت صورة «سمعوا بثقل» مع توضيحها في الحاشية.
