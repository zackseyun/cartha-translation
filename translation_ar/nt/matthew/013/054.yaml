  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: ar
  text: 'وجاء إلى بلدته، وكان يعلّمهم في مجمعهم، حتى إنهم اندهشوا وقالوا: «من أين لهذا الرجل هذه الحكمة وأعمال القوة هذه[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «الأعمال المقتدرة»؛ أي أعمال تظهر قدرة، وتُفهم غالبًا على أنها معجزات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: بلدته
  rationale: يدل السياق على البلدة التي نشأ فيها يسوع وكان أهلها يعرفونه، لا على وطن بمعنى الدولة أو البلاد عمومًا.
- source_word: ἐδίδασκεν
  choice: كان يعلّمهم
  rationale: يحافظ تركيب «كان يعلّم» على دلالة الماضي المستمر في صيغة الفعل اليوناني الناقص.
- source_word: συναγωγῇ
  choice: مجمعهم
  rationale: «المجمع» هو التعبير العربي الواضح والمألوف لمكان اجتماع اليهود وعبادتهم في هذا السياق.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: حتى دُهشوا وقالوا
  rationale: تنقل «حتى» نتيجة تعليمه، ويعبّر «دُهشوا» عن شدة وقع الأمر عليهم، مع صياغة عربية طبيعية بالفعلين الماضيين.
- source_word: Πόθεν τούτῳ
  choice: من أين لهذا الرجل
  rationale: يحافظ على السؤال عن المصدر وعلى نبرة الإشارة إلى يسوع بشيء من التباعد، من غير إضافة فعل غير مصرّح به في الأصل.
- source_word: σοφία
  choice: الحكمة
  rationale: مقابل مباشر وطبيعي يشير هنا إلى ما ظهر في تعليم يسوع من فهم وبصيرة.
- source_word: δυνάμεις
  choice: أعمال القوة
  rationale: ينقل معنى القوة في اللفظ اليوناني، وفي الوقت نفسه يوضح أن المقصود أفعال ناتجة عن القوة لا «قوات» بمعنى الجيوش أو الجهات المسلحة.
theological_decisions:
- issue: دلالة δυνάμεις على نشاط يسوع الاستثنائي
  choice: أعمال القوة
  alternative: المعجزات
  rationale: يحافظ الاختيار على الصلة اللفظية بالقوة ويتيح أن تُفهم العبارة على أنها أفعال مقتدرة أو معجزات، من غير حصر اللفظ منذ البداية في مصطلح تفسيري واحد.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «بلدته» للدلالة المحلية، و«كان يعلّم» لإبراز الاستمرار، ووُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
