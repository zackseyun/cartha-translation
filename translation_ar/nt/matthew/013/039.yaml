base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: ar
  text: والعدو الذي زرع الزوان هو إبليس؛ والحصاد هو نهاية العصر[a]، والحصّادون هم الملائكة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «اكتمال العصر»؛ والتعبير التقليدي: «نهاية العالم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: العدو
  rationale: المقابل العربي الطبيعي الذي يحفظ معنى الخصومة الشخصية في تفسير المثل.
- source_word: ὁ σπείρας
  choice: الذي زرع
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا مكتملًا يعرّف العدو، ويحافظ على صورة البذر الزراعية.
- source_word: αὐτά
  choice: ها
  rationale: ضمير يعود إلى الزوان المذكور في سياق المثل، وصيغة المؤنث المفرد طبيعية مع اسم الجمع غير العاقل في العربية.
- source_word: διάβολος
  choice: إبليس
  rationale: اسم واضح وشائع في العربية للشخص المقصود هنا، من غير تحويل اللفظ إلى معناه الاشتقاقي «المفتري» بما قد يحجب الإحالة الشخصية.
- source_word: θερισμὸς
  choice: الحصاد
  rationale: اللفظ العربي المعتاد الذي يصون الصورة الزراعية في المثل.
- source_word: συντέλεια αἰῶνός
  choice: انقضاء الدهر
  rationale: «انقضاء» يعبّر عن بلوغ الفترة تمامها ونهايتها، و«الدهر» هنا يدل على العصر أو الحقبة لا على العالم المادي.
- source_word: θερισταὶ
  choice: الحصّادون
  rationale: يحافظ على الصلة اللفظية الواضحة بـ«الحصاد» وعلى الصورة الزراعية.
- source_word: ἄγγελοί
  choice: الملائكة
  rationale: السياق الأخروي يدل على الكائنات السماوية، لا على رسل بشريين.
- source_word: δὲ
  choice: الواو
  rationale: تؤدي الواو وظيفة الانتقال والتنسيق المتكرر في العربية بسلاسة، من غير إقحام معنى الاستدراك.
theological_decisions:
- issue: دلالة αἰών في العبارة الأخروية συντέλεια αἰῶνός
  choice: انقضاء الدهر
  alternative: نهاية العالم؛ اكتمال الدهر
  rationale: يحفظ هذا الاختيار الدلالة الزمنية للعصر أو الدهر، ولا يوحي بأن المقصود بالضرورة فناء الكون المادي. وتوضح الحاشية أن «الاكتمال» وجه دلالي ممكن لـσυντέλεια.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «الدهر» بالمعنى الزمني الكتابي، مع حاشية تمنع التباسه بـ«العالم» المادي، وحوفظ على الترابط بين «الحصاد» و«الحصّادين».
