  to: والحقل هو العالم، والزرع الجيد، هؤلاء هم أبناء الملكوت، والزوان[a] هم أبناء الشرير[b].
  rationale: أُضيف «هؤلاء هم» لنقل οὗτοί εἰσιν وإبراز انتقال المثل من «الزرع» إلى الأشخاص. واستُبدلت الإحالة المفردة في «فهو أبناء» بصيغة الجمع الموافقة للزوان ولأبناء. كما عُممت الحاشية لتشمل التعبيرين المتوازيين في الآية، من دون إضافة تفسير عقائدي.
