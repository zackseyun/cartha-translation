  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: ar
  text: والحقل هو العالم، والزرع الجيد، هؤلاء هم أبناء الملكوت، والزوان[a] هم أبناء الشرير[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'الزوان نبات ضار يشبه القمح في أول نموه؛ ويمكن ترجمة اللفظ ترجمة أعم: «الأعشاب الضارة».'
    reason: lexical_alternative
  - marker: b
    text: «أبناء» هنا تعبير عن العلاقة والانتماء، ويشير إلى المنتمين إلى الملكوت أو إلى الشرير بحسب السياق.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: الحقل
  rationale: يحفظ الصورة الزراعية في المثل، وهو التعبير العربي الواضح والطبيعي.
- source_word: κόσμος
  choice: العالم
  rationale: يدل هنا على المجال الواسع الذي يحدث فيه الزرع، و«العالم» هو المقابل المباشر المألوف.
- source_word: καλὸν σπέρμα
  choice: الزرع الجيد
  rationale: «الزرع» أنسب من «البذرة» هنا لأن الاسم اليوناني مفرد جمعي، ثم يفسره النص بأشخاص بصيغة الجمع؛ كما يحفظ الصورة الزراعية.
- source_word: υἱοὶ τῆς βασιλείας
  choice: أبناء الملكوت
  rationale: يحفظ التعبير العلاقي في الأصل وصيغة المذكر الجمع، من غير حصر المقصود في الأبناء الجسديين.
- source_word: ζιζάνια
  choice: الزوان
  rationale: اسم عربي معروف للنبات الضار المقصود في هذا المثل، وهو أدق من اللفظ العام «الأعشاب الضارة»؛ وتوضحه الحاشية.
- source_word: τοῦ πονηροῦ
  choice: الشرير
  rationale: أداة التعريف وصيغة المذكر المفرد ترجحان الإشارة إلى شخص شرير، لا إلى الشر بوصفه معنى مجردًا.
theological_decisions:
- issue: هل τοῦ πονηροῦ شخصي أم مجرد؟
  choice: الشرير
  alternative: الشر
  rationale: التركيب اليوناني المعرّف والمذكر المفرد، مع مقابلة جماعتين في تفسير المثل، يرجح المرجع الشخصي من غير أن يضيف النص اسمًا لم يذكره الأصل.
- issue: كيفية نقل υἱοὶ في التعبير العلاقي
  choice: أبناء
  alternative: أولاد / المنتمون إلى
  rationale: «أبناء» يحفظ صورة الأصل العلاقية وصيغته، ويشمل في هذا الاستعمال من ينتمون إلى الملكوت، كما تبين الحاشية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، تحافظ على التوازي التفسيري في اليونانية. استُعملت «أما» قبل العنصر الثالث لإبراز المقابلة من غير تحميل δὲ معنى يتجاوز السياق.
