  source_fidelity: 'النص يطابق المعنى اليوناني في عناصره الرئيسة: اقتراب العبيد، وخطابهم لصاحب البيت، والسؤال التقريري عن البذار الجيد، ثم الاستفهام عن مصدر الزؤان. لكن الضمير في «جاءه» ملتبس في العربية؛ فقد يعود ظاهريًا إلى «ربّ البيت» أو إلى الحقل، بينما المقصود ظهور الزؤان في الحقل.'
