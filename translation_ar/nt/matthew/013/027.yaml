  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: ar
  text: 'فأقبل عبيد ربِّ البيت إليه وقالوا له: «يا سيد، أما زرعتَ بذارًا جيدًا في حقلك؟ فمن أين جاء الزؤان إذن؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: دنا
  rationale: ينقل حركة الاقتراب السابقة للقول بصياغة عربية موجزة وطبيعية.
- source_word: δοῦλοι
  choice: عبيد
  rationale: يحفظ دلالة التبعية والملكية الاجتماعية التي يحملها اللفظ اليوناني، من غير تلطيفها إلى «خدم».
- source_word: οἰκοδεσπότου
  choice: ربّ البيت
  rationale: تعبير عربي واضح يحفظ عنصري البيت والسلطة في اللفظ المركب.
- source_word: Κύριε
  choice: يا سيد
  rationale: في حوار المثل هو نداء احترام لصاحب البيت؛ و«يا سيد» طبيعي في العربية ولا يفرض هنا دلالة لاهوتية زائدة.
- source_word: οὐχὶ
  choice: أما
  rationale: تفتتح سؤالًا تقريريًا يتوقع جوابًا بالإيجاب، على نحو طبيعي في العربية.
- source_word: καλὸν σπέρμα
  choice: بذارًا جيدًا
  rationale: ترجمة زراعية واضحة؛ و«بذار» اسم جنس يلائم سياق الزرع.
- source_word: ἔσπειρας
  choice: زرعتَ
  rationale: الفعل العربي الشائع في هذا السياق، ويدل هنا على بذر الحبوب.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: في حقلك
  rationale: يحفظ دلالة المكان والملكية بإيجاز طبيعي.
- source_word: πόθεν οὖν
  choice: فمن أين ... إذن
  rationale: يحفظ السؤال عن المصدر والقوة الاستنتاجية للأداة οὖν.
- source_word: ἔχει ζιζάνια
  choice: جاءه ... الزؤان
  rationale: يعيد بناء التعبير اليوناني غير الطبيعي حرفيًا في العربية إلى سؤال واضح عن مصدر ظهور الزؤان، مع إبقاء الحقل مرجع الضمير.
- source_word: ζιζάνια
  choice: الزؤان
  rationale: اسم عربي مخصوص لعشب ضار يشبه القمح في أطواره الأولى، وهو أدق من اللفظ العام «الأعشاب الضارة».
theological_decisions:
- issue: ترجمة δοῦλοι في سياق بيت صاحب الحقل
  choice: عبيد
  alternative: خدم
  rationale: «عبيد» تحافظ على طبيعة العلاقة الاجتماعية التي يدل عليها النص، بينما قد تخفف «خدم» معنى التبعية.
- issue: ترجمة Κύριε في خطاب صاحب البيت داخل المثل
  choice: يا سيد
  alternative: يا رب
  rationale: السياق المباشر خطاب احترام لسيد العبيد وصاحب الحقل؛ لذلك تنقل «يا سيد» الوظيفة الخطابية بلا حسم لدلالة مسيحية مباشرة لا يصرح بها هذا الحوار.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «ربّ البيت» بمعناه العربي المألوف: صاحب البيت وسيده، ووضعت علامة الحاشية مباشرة بعد «الزؤان».'
