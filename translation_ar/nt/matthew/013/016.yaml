base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: ar
  text: أَمَّا أَنْتُمْ فَطُوبَى لِعُيُونِكُمْ، لِأَنَّهَا تُبْصِرُ، وَلِآذَانِكُمْ، لِأَنَّهَا تَسْمَعُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ إنها تُبصر ... إذ إنها تسمع». يمكن أن تُنقل الأداة اليونانية هنا بكلتا الصيغتين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا أَنْتُمْ فَـ
  rationale: ينقل قوة المقابلة مع من سبق وصفهم بأنهم لا يبصرون ولا يسمعون، ويجعل توجيه الخطاب إلى التلاميذ طبيعيًّا في العربية.
- source_word: μακάριοι
  choice: طُوبَى لِـ
  rationale: تعبير عربي كتابي راسخ يدل على الغبطة والبركة، ولا يحصر المعنى في شعور ذاتي بالسعادة.
- source_word: οἱ ὀφθαλμοὶ ... τὰ ὦτα ὑμῶν
  choice: لِعُيُونِكُمْ ... وَلِآذَانِكُمْ
  rationale: صياغة عربية طبيعية تحفظ التوازي وتُظهر أن عيون المخاطَبين وآذانهم هي موضع التطويب.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: فُهمت الأداة هنا على أنها سببية، أي إن الإبصار والسمع هما سبب التطويب؛ ويمكن أيضًا نقلها بصيغة «إذ»، ولذلك ذُكر البديل في الحاشية.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: تُبْصِرُ / تَسْمَعُ
  rationale: يحفظ الفعلين الحسيين المباشرين ولا يضيف تفسيرًا مثل «تفهم» أو «تدرك»، تاركًا للسياق أن يبيّن البعد الروحي.
theological_decisions:
- issue: هل يُصرَّح بأن الإبصار والسمع روحيان؟
  choice: الإبقاء على «تُبْصِرُ» و«تَسْمَعُ» كما في النص اليوناني.
  alternative: «تدرك» و«تفهم».
  rationale: السياق يضفي على الإبصار والسمع بُعدًا يتجاوز الحواس، لكن الآية نفسها تستعمل اللفظين الحسيين؛ فالتصريح بالفهم يحسم دلالة أبقاها النص ضمن توترها السياقي.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «طوبى» لملاءمته سياق التطويب، مع الحفاظ على التوازي والإيجاز في الأصل.
