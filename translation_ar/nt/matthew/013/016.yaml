  source_fidelity: النص العربي ينقل المقابلة التي تؤديها δὲ بوضوح في «أمّا أنتم»، ويحافظ على إسناد التطويب إلى عيون المخاطَبين وآذانهم. وترجمة ὅτι السببية بـ«لأنّ» سليمة في الموضعين، كما أن «تُبصر» و«تسمع» تحفظان اللفظ الحسي المباشر دون إضافة تفسيرية مثل الفهم أو الإدراك.
