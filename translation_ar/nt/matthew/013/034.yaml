  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: ar
  text: هذا كلُّه قاله يسوع للجموع بأمثال، ومن دون مَثَل لم يكن يقول لهم شيئًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ومن دون مَثَل لم يقل لهم شيئًا». قد يدل الماضي الناقص في اليونانية على فعل معتاد أو مستمر، وقد يُترجم هنا أيضًا بماضٍ بسيط.'
    reason: بيان البديل الأسلوبي والدلالة الزمنية المحتملة للفعل اليوناني
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: هذا كلُّه
  rationale: صياغة عربية طبيعية تحفظ الإشارة والشمول في العبارة اليونانية.
- source_word: ἐλάλησεν
  choice: قاله
  rationale: فعل ماضٍ يلخّص ما خاطب به يسوع الجموع، والضمير المتصل يعود إلى «هذا كلّه».
- source_word: ἐν παραβολαῖς
  choice: بأمثال
  rationale: الباء تعبّر طبيعيًا عن الوسيلة أو الأسلوب الذي تدل عليه ἐν مع المجرور.
- source_word: τοῖς ὄχλοις
  choice: للجموع
  rationale: تحفظ صيغة الجمع وتؤدي دلالة المخاطَبين بوضوح.
- source_word: χωρὶς παραβολῆς
  choice: من دون مَثَل
  rationale: تحفظ معنى الانفصال أو الاستثناء، وكذلك مفرد παραβολῆς، في تعبير عربي فصيح معاصر.
- source_word: οὐδὲν ἐλάλει
  choice: لم يكن يقول لهم شيئًا
  rationale: تركيب «لم يكن يقول» ينقل القيمة الاستمرارية أو الاعتيادية المحتملة للماضي الناقص اليوناني بصورة عربية طبيعية.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحيل الضمير بوضوح إلى الجموع من غير تكرار غير لازم.
theological_decisions:
- issue: دلالة الماضي الناقص ἐλάλει في الجملة الثانية
  choice: لم يكن يقول لهم شيئًا
  alternative: لم يقل لهم شيئًا
  rationale: الصياغة المختارة تحفظ القوة الاستمرارية أو الاعتيادية المحتملة للفعل، من غير تحويلها إلى تقرير عقائدي يتجاوز سياق السرد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعمل «مَثَل» بالمفرد في الجملة الثانية موافقةً للأصل، وحُفظ الفرق بين الماضي الملخِّص في «قاله» والماضي الناقص في «لم يكن يقول».
