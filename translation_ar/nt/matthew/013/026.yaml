  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: ar
  text: ولما نبت الزرع وأخرج حبًّا، ظهرت حينئذٍ الأعشاب الضارة أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الزوان» أو «الدَّنْدار»؛ وربما كان المقصود نوعًا محددًا من الأعشاب الضارة يشبه الحنطة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ولكن لما
  rationale: تؤدي «لما» معنى الظرف الزمني، وتنقل «لكن» الانتقال السردي مع المقابلة الخفيفة التي تفيدها δέ.
- source_word: ἐβλάστησεν
  choice: نبت
  rationale: فعل عربي طبيعي يدل على خروج النبات ونموه الأول، وهو مطابق لمعنى βλαστάνω في السياق الزراعي.
- source_word: ὁ χόρτος
  choice: الزرع
  rationale: المقصود هنا النبات المزروع في الحقل، لا العشب عمومًا؛ و«الزرع» واضحة وطبيعية من غير تحديد النوع قبل ظهور الحب.
- source_word: καρπὸν ἐποίησεν
  choice: أخرج حبًّا
  rationale: العبارة اليونانية تعني حرفيًا إحداث الثمر أو إنتاجه؛ وفي سياق الحنطة، «أخرج حبًّا» تنقل المحصول المقصود بوضوح.
- source_word: τότε
  choice: —
  rationale: دلالة «حينئذ» مفهومة من تركيب «لما... ظهر»، وحذف اللفظ الصريح يمنع الثقل في العربية من غير فقدان للتتابع الزمني.
- source_word: ἐφάνη
  choice: ظهر
  rationale: ينقل معنى صيرورته مرئيًا أو بيّنًا بإيجاز وطبيعية.
- source_word: καὶ τὰ ζιζάνια
  choice: الزوان أيضًا
  rationale: «الزوان» اسم عربي معروف لعشب ضار يشبه الحنطة، وهو أنسب من التعبير العام «الأعشاب الضارة» في هذا السياق؛ و«أيضًا» تنقل القوة الإضافية لـ καί.
theological_decisions:
- issue: التحديد النباتي للفظ ζιζάνια
  choice: الزوان في المتن
  alternative: الأعشاب الضارة أو الدَّنْدار
  rationale: اللفظ اليوناني يدل على عشب ضار في حقول الحبوب، ويرجح أن يكون نباتًا شبيهًا بالحنطة. «الزوان» يحافظ على الصورة الزراعية التقليدية من غير جعل التحديد النباتي القطعي جزءًا من معنى النص؛ لذلك يوضح الهامش إمكان المعنى الأعم.
