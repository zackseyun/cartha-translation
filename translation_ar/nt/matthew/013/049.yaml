  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: ar
  text: 'هكذا سيكون الأمر عند اكتمال العصر[a]: سيخرج الملائكة ويفصلون الأشرار من بين الأبرار.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند انقضاء العصر». المقصود باللفظة اليونانية هنا «العصر»، لا «العالم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: هكذا يكون
  rationale: صياغة عربية طبيعية تحفظ معنى الكيفية والاستقبال في سياق شرح المثل.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: عند اكتمال الدهر
  rationale: «اكتمال» ينقل معنى بلوغ الغاية في συντέλεια، و«الدهر» يدل هنا على العصر أو النظام الزمني، لا على العالم المادي.
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: يخرج الملائكة
  rationale: ينقل الفعل المستقبلي بصيغة المضارع العربي الدال على المستقبل بعد السياق، ويفهم «الملائكة» هنا بوصفهم كائنات سماوية.
- source_word: ἀφοριοῦσιν
  choice: يفصلون
  rationale: تعبير واضح عن عزل فريق من داخل جماعة مختلطة.
- source_word: τοὺς πονηροὺς
  choice: الأشرار
  rationale: صفة مستعملة اسميًا، وتشير إلى أشخاص يتصفون بالشر في سياق الدينونة.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: من بين الأبرار
  rationale: تحفظ العبارة معنى إخراج الأشرار من وسط جماعة الأبرار، و«الأبرار» تعبير عربي مألوف وواضح.
theological_decisions:
- issue: دلالة αἰών في العبارة الأخروية
  choice: الدهر
  alternative: العالم
  rationale: الأصل اليوناني يشير إلى الدهر أو العصر، فلا تفرض العبارة بذاتها معنى زوال الكون المادي.
- issue: هوية οἱ ἄγγελοι
  choice: الملائكة السماويون
  alternative: الرسل أو المبعوثون البشر
  rationale: سياق شرح المثل والدينونة النهائية يرجح بوضوح الإشارة إلى الملائكة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. اختير «اكتمال الدهر» لإبراز معنى بلوغ الدهر غايته مع إبقاء البديل «انقضاء الدهر» في الحاشية، وتجنب ترجمة αἰών بما يوحي خطأً بأن اللفظ يعني العالم المادي.
