  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: ar
  text: وأمّا المزروع بين الشوك، فهو الذي يسمع الكلمة، لكن همَّ هذا الدهر[a] وخداعَ الغنى[b] يخنقان الكلمة، فيصير بلا ثمر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هموم هذا العالم».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «غرور الغنى» أو «خداع الثروة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: وأمّا المزروع بين الشوك
  rationale: يحافظ على صورة الزرع وعلى صيغة المفرد المذكر التي تشير في تفسير المثل إلى الشخص الممثَّل بالبذار، و«بين الشوك» تعبير عربي طبيعي.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: فهو الذي يسمع الكلمة
  rationale: تؤدي جملة الصلة معنى اسم الفاعل اليوناني بصورة عربية واضحة، وتُبقي «الكلمة» للمضمون المُعلَن في سياق المثل.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: همَّ هذا الدهر
  rationale: «الهمّ» ينقل معنى الانشغال القَلِق، و«هذا الدهر» يحفظ الدلالة الزمنية والأخلاقية لـ αἰών دون تحويلها مباشرة إلى العالم المادي.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: خداعَ الغنى
  rationale: ينقل كون الغنى ذا أثر خادع؛ و«الغنى» لفظ عربي معاصر طبيعي يدل على الثراء.
- source_word: συμπνίγει
  choice: يخنقان
  rationale: يحفظ الصورة الزراعية القوية للفعل. استُعمل المثنى لأن الفاعلين في العربية هما «همّ هذا الدهر» و«خداع الغنى».
- source_word: ἄκαρπος γίνεται
  choice: فيصير بلا ثمر
  rationale: يحافظ على الاستعارة ويشير إلى السامع نفسه، مع تجنب الإيحاء بأن الكلمة هي التي صارت عقيمة في ذاتها.
theological_decisions:
- issue: دلالة αἰών
  choice: هذا الدهر
  alternative: هذا العالم
  rationale: «الدهر» يحفظ معنى العصر أو الحقبة في اللفظ اليوناني، ولا يفرض معنى الكون المادي؛ أما «العالم» فممكن سياقيًا لكنه أقل دقة هنا.
- issue: مرجع العبارة الختامية
  choice: فيصير بلا ثمر
  alternative: فتصير الكلمة بلا ثمر
  rationale: البنية التفسيرية تعرّف المزروع بأنه الشخص الذي يسمع الكلمة، وصيغة المفرد المذكر في اليونانية تؤيد رجوع النتيجة إليه، لا الحكم على الكلمة في ذاتها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت استعارتا الشوك والخنق والثمر، مع انتقال طبيعي من صورة المزروع إلى الشخص السامع. وُضعت علامتا الحاشيتين في نهاية الآية لأنهما تتصلان بتعبيرين داخل الجملة دون تعطيل انسيابها.
