  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: ar
  text: 'فقال: «لا، لئلا تقتلعوا القمح مع الأعشاب الضارة[a] حين تجمعونها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الزوان»؛ وربما يُقصد به على وجه أخص نوع من العشب الضار يشبه القمح في مراحل نموه الأولى.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: فقال
  rationale: صيغ المضارع التاريخي اليوناني بصيغة الماضي، وهي الأنسب للسرد العربي الطبيعي من غير تغيير للمعنى.
- source_word: Οὔ
  choice: لا
  rationale: ينقل جواب النفي المباشر بوضوح وإيجاز.
- source_word: μήποτε
  choice: لئلا
  rationale: تفيد التحذير من نتيجة محتملة غير مرغوب فيها.
- source_word: συλλέγοντες
  choice: حين تجمعونها
  rationale: ينقل دلالة اسم الفاعل الزمنية، أي احتمال اقتلاع القمح في أثناء جمع الأعشاب الضارة.
- source_word: ζιζάνια
  choice: الأعشاب الضارة
  rationale: تعبير عربي حديث واضح يفهمه عموم القراء، مع إثبات البديل الأدق والأشهر تقليديًا في الحاشية.
- source_word: ἐκριζώσητε
  choice: تقتلعوا
  rationale: يدل الفعل على النزع من الجذور، و«تقتلعوا» يؤدي هذا المعنى طبيعيًا في العربية.
- source_word: ἅμα αὐτοῖς
  choice: مع الأعشاب الضارة
  rationale: يوضح أن القمح قد يُنزع بصحبة الأعشاب نفسها، مع إظهار مرجع الضمير منعًا للالتباس.
- source_word: σῖτον
  choice: القمح
  rationale: السياق الزراعي والمقابلة مع الزوان يرجحان القمح على الحبوب بمعناها العام.
theological_decisions:
- issue: ترجمة ζιζάνια في مثل معروف
  choice: الأعشاب الضارة
  alternative: الزوان
  rationale: لا يتوقف المعنى اللاهوتي على تعيين النوع النباتي، لذلك اختير التعبير الأوضح في المتن، مع حفظ اللفظ التقليدي والتحديد النباتي المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. حافظت الصياغة على قوة التحذير وعلى العلاقة الزمنية بين جمع الأعشاب واحتمال اقتلاع القمح، من غير تضييق غير لازم للنوع النباتي.
