  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: أَنْتُمْ
  rationale: الضمير مذكور صراحةً في اليونانية للتوكيد؛ وإظهاره بعد فعل الأمر يحفظ المقابلة والتوكيد في عربية طبيعية.
- source_word: οὖν
  choice: فَـ
  rationale: تفيد الأداة انتقالًا مترتبًا على الكلام السابق، والفاء أوضح وأخف في العربية من «إذًا» في هذا السياق.
- source_word: ἀκούσατε
  choice: اسْمَعُوا
  rationale: فعل أمر للجمع، وترجمته الحرفية «اسمعوا» تحفظ صورة السماع وقوة الأمر من غير تحويلها تفسيريًا إلى «افهموا».
- source_word: παραβολὴν
  choice: مَثَلَ
  rationale: «المثل» هو المقابل العربي المألوف والدقيق لـ παραβολή في سياق تعليم يسوع.
- source_word: τοῦ σπείραντος
  choice: الَّذِي زَرَعَ
  rationale: يحفظ دلالة اسم الفاعل اليوناني الماضي حرفيًا نسبيًا بوصفه «الذي زرع»، من غير تحويله إلى لقب ثابت مثل «الزارع».
