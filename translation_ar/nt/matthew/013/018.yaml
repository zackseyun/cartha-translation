  register: 'صياغة عربية فصحى واضحة وموجزة ذات نبرة تعليمية كريمة. قُدِّم فعل الأمر ثم أُظهر الضمير للتوكيد: «فاسمعوا أنتم». لم تُضف علامة حاشية لأن النص العربي لا يحتاج إلى بديل يزيل غموضًا مؤثرًا.'
