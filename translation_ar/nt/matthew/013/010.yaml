  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «تكلِّمهم بأمثال» لصياغة طبيعية تحفظ بنية السؤال ومعناه، ووُضع البديل المعجمي المتعلق بالاقتراب في الحاشية.
