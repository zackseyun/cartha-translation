  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: ar
  text: 'فتقدَّم التلاميذ[a] وقالوا له: «لماذا تكلِّمهم بأمثال؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «اقترب التلاميذ»؛ تفيد الصيغة اليونانية أنهم دنوا من يسوع قبل أن يتكلموا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: فـ
  rationale: تربط الجملة بما قبلها وتدفع السرد إلى الحدث التالي بصورة طبيعية، من غير زيادة دلالية.
- source_word: προσελθόντες
  choice: تقدَّم
  rationale: يحفظ معنى اقتراب التلاميذ من يسوع قبل أن يتكلموا، ويأتي بصياغة عربية موجزة وطبيعية.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف اليونانية تشير إلى جماعة التلاميذ المعروفة في السياق، من غير إضافة ضمير ملكية غير مصرح به.
- source_word: εἶπαν αὐτῷ
  choice: قالوا له
  rationale: ينقل فعل القول كما في اليونانية، مع أن الكلام اللاحق سؤال.
- source_word: Διὰ τί
  choice: لماذا
  rationale: المقابل العربي المباشر والطبيعي لأداة الاستفهام عن السبب.
- source_word: ἐν παραβολαῖς
  choice: بأمثال
  rationale: الباء تعبّر طبيعيًا عن وسيلة الكلام أو أسلوبه، وتحفظ معنى العبارة اليونانية.
- source_word: λαλεῖς
  choice: تكلِّم
  rationale: ينقل المضارع والمخاطب المفرد بصيغة عربية واضحة، مع إبقاء المخاطَبين في الضمير اللاحق.
- source_word: αὐτοῖς
  choice: هم
  rationale: الضمير المتصل في «تكلِّمهم» يحدد الجمهور المخاطَب به بوضوح واقتصاد.
theological_decisions: []
