reference: Matthew 13:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ar
  text: 'فإني أقول لكم حقًّا: إن أنبياء كثيرين وأبرارًا[a] اشتاقوا أن يروا ما ترون فلم يروه، وأن يسمعوا ما تسمعون فلم يسمعوه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أشخاصًا أبرارًا؛ فالكلمة اليونانية صفة استُعملت هنا استعمال الاسم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: حقًّا
  rationale: تنقل قوة التوكيد الاحتفالي في الصيغة «ἀμὴν λέγω ὑμῖν» بعبارة عربية فصيحة وطبيعية، من غير الاكتفاء بالنقل الصوتي «آمين».
- source_word: γὰρ
  choice: فإني
  rationale: الفاء استئنافية تعليلية تربط القول بما سبقه، و«إني» تمهّد طبيعيًّا لصيغة التوكيد في العربية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يحافظ على مباشرة الصيغة اليونانية وترتيب عناصرها الأساسي مع سلامة الأسلوب العربي.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: أنبياء كثيرين وأبرارًا
  rationale: «أبرارًا» تستعمل الصفة استعمال الاسم كما في اليونانية، وتدل على أشخاص موصوفين بالبر من غير إضافة تفسيرية.
- source_word: ἐπεθύμησαν
  choice: اشتاقوا
  rationale: يفيد رغبة قوية ملحّة، وهو أنسب هنا من «أرادوا» الأضعف دلالة، ولا يحمل إيحاء الرغبة المذمومة.
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: أن يروا ما ترون فلم يروه
  rationale: يحفظ التوازي بين المصدر والفعلين، ويعيد ضمير المفعول على «ما» لتكتمل الجملة طبيعيًّا في العربية.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: وأن يسمعوا ما تسمعون فلم يسمعوه
  rationale: يحافظ على البنية الموازية للشطر السابق وعلى عدم تعيين مضمون المسموع.
theological_decisions:
- issue: مدلول δίκαιοι
  choice: أبرارًا
  alternative: الصالحين أو الأشخاص الأبرار
  rationale: اللفظة صفة مستعملة استعمال الاسم في صيغة الجمع. «أبرارًا» موجزة وطبيعية وتحفظ الفئة بوصفها أوسع من الأنبياء من غير فرض تحديد مذهبي.
- issue: ماهية ما رآه السامعون وسمعوه
  choice: إبقاء المفعولين بصيغة «ما ترون» و«ما تسمعون»
  alternative: تعيينهما بالمسيح أو بأسرار الملكوت
  rationale: السياق قد يشير إلى إعلان الملكوت في خدمة يسوع، لكن نص الآية لا يسمّي الشيء المرئي أو المسموع؛ لذلك تُحفظ دلالة الجملتين الموصولتين بلا توسع تفسيري.
- issue: قوة النفي في الأفعال الماضية
  choice: فلم يروه... فلم يسمعوه
  alternative: فما رأوه قط... وما سمعوه قط
  rationale: الماضي المنفي يقرر أنهم لم ينالوا ما اشتاقوا إليه، من غير إضافة «قط» التي قد تزيد توكيدًا غير مصرح به في اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي البلاغي بين الرؤية والسماع، واستُعملت «حقًّا» لنقل صيغة التوكيد، مع تجنب تعيين ما تركه النص ضمنيًّا.
