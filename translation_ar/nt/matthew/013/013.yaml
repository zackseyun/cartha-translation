base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: ar
  text: لِهَذَا أَتَكَلَّمُ إِلَيْهِمْ بِأَمْثَالٍ، لِأَنَّهُمْ، وَهُمْ يُبْصِرُونَ، لَا يُبْصِرُونَ، وَهُمْ يَسْمَعُونَ، لَا يَسْمَعُونَ وَلَا يَفْهَمُونَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا إبراز معنى المفارقة هكذا: «مع أنهم يبصرون، لا يبصرون، ومع أنهم يسمعون، لا يسمعون ولا يفهمون».'
    reason: بديل يصرّح بالدلالة التنازلية المحتملة لاسمي الفاعل اليونانيين.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: ينقل العبارة السببية بإيجاز وفصاحة، من غير أن يحولها إلى استنتاج أقوى مما يفيده الأصل.
- source_word: ἐν παραβολαῖς
  choice: بِأَمْثَالٍ
  rationale: الباء طبيعية في العربية للدلالة على أسلوب الكلام ووسيلته، وتحافظ على معنى الكلام في أمثال.
- source_word: αὐτοῖς λαλῶ
  choice: أُكَلِّمُهُمْ
  rationale: صياغة عربية مباشرة تجمع الفعل والضمير، وتحفظ المتكلم المفرد والمخاطَبين المشار إليهم.
- source_word: ὅτι
  choice: لِأَنَّهُمْ
  rationale: ينقل المعنى السببي في السياق بوضوح.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: إِذْ يُبْصِرُونَ لَا يُبْصِرُونَ
  rationale: يحافظ على تكرار الفعل والمفارقة في اليونانية، وتتيح «إذ» المعنى الحالي أو الظرفي من غير حسم الدلالة التنازلية في المتن.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: إِذْ يَسْمَعُونَ لَا يَسْمَعُونَ
  rationale: يحافظ على البنية الموازية وعلى تكرار الفعل كما في الأصل.
- source_word: οὐδὲ συνίουσιν
  choice: وَلَا يَفْهَمُونَ
  rationale: «ولا» تواصل سلسلة النفي، و«يفهمون» هي المقابل العربي الواضح لإدراك المعنى.
theological_decisions:
- issue: دلالة اسمي الفاعل βλέποντες وἀκούοντες
  choice: صياغتهما بعبارتي «إذ يبصرون» و«إذ يسمعون»
  alternative: «مع أنهم يبصرون» و«مع أنهم يسمعون»
  rationale: الصياغة المختارة تحفظ المفارقة وتبقي العلاقة الظرفية أو التنازلية محتملة، بدل أن تحسم ما لم تصرح به الصيغة اليونانية وحدها.
- issue: دلالة συνίουσιν في السياق
  choice: «يفهمون»
  alternative: «يدركون»
  rationale: تنقل عدم استيعاب المعنى بوضوح، من غير إضافة حكم عقائدي على سببه أو مداه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ التوازي البلاغي وتكرار فعلي الإبصار والسماع، ووُضعت علامة الحاشية عند العبارة التي تشرحها.
