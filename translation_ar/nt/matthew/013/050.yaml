  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ar
  text: وسيطرحونهم في أتون النار[a]. هناك سيكون البكاء وصرير الأسنان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أتون النار»؛ ويمكن أن تُترجم بحسب المعنى: «الأتون المتقد».'
    reason: بيان التركيب الحرفي وإيراد بديل عربي أكثر وصفية دون استبدال صورة الأصل.
lexical_decisions:
- source_word: βαλοῦσιν
  choice: يطرحون
  rationale: فعل مستقبل يدل على الإلقاء بقوة؛ و«يطرحون» فصيحة وطبيعية وتحافظ على قوة الصورة من غير نبرة قديمة.
- source_word: αὐτοὺς
  choice: هم
  rationale: ضمير مفعول به جمع مذكر يعود إلى الأشرار المذكورين في السياق السابق.
- source_word: κάμινον τοῦ πυρός
  choice: أتون النار
  rationale: يحافظ على تركيب الإضافة اليوناني وصورة موضع النار المتقدة، وهو تعبير عربي كتابي واضح وموجز.
- source_word: ἐκεῖ
  choice: هناك
  rationale: ينقل الظرف المكاني بوضوح ويحافظ على الإشارة المؤكدة إلى ذلك الموضع.
- source_word: ἔσται
  choice: يكون
  rationale: ينقل صيغة المستقبل في السياق العربي؛ ودلالة الاستقبال مفهومة من الجملة السابقة ومن سياق الحكم الآتي.
- source_word: ὁ κλαυθμὸς
  choice: البكاء
  rationale: مقابل مباشر يدل على البكاء والنحيب من غير تضييق الدلالة على درجة بعينها.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: صرير الأسنان
  rationale: تعبير عربي راسخ ودقيق للصيغة المتكررة في متى، ويحفظ إيحاءات الكرب والدينونة دون شرح زائد.
theological_decisions:
- issue: صياغة صور الدينونة في السياق الأخروي
  choice: 'الإبقاء على الصورتين المحسوستين: «أتون النار» و«البكاء وصرير الأسنان» من غير تلطيف أو توسع تفسيري.'
  alternative: 'صياغة تفسيرية مثل: «نار متقدة، حيث يبكون ويطحنون أسنانهم من شدة العذاب».'
  rationale: النص يعرض صور الدينونة كما هي ضمن تفسير المثل، ولا يحدد هنا كيفية فهم تفاصيلها؛ لذلك تحفظ الترجمة الصورة وقوتها والتوتر اللاهوتي من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم «أتون» لأنه أدق من «فرن» في تصوير موضع النار الشديدة، مع إثبات علامة الحاشية [a] في المتن.
