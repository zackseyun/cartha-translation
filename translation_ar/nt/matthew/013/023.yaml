base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: ar
  text: 'وأمّا المزروع في التربة الجيدة، فهو الذي يسمع الكلمة ويفهمها، وهو حقًّا يُثمر ويُنتج: فهذا مئة، وذاك ستين، وذاك ثلاثين.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «هذا مئة، وذاك ستين، وذاك ثلاثين»؛ أي إن مقدار الغلة يختلف، فيكون مئة ضعف أو ستين ضعفًا أو ثلاثين ضعفًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: على الأرض الجيدة
  rationale: تحفظ صورة البذر الزراعية، و«الجيدة» هنا بمعنى الصالحة للزرع أو الخصبة، لا بمعنى أخلاقي.
- source_word: σπαρείς
  choice: المزروع
  rationale: اسم مفعول موجز يحفظ المبني للمجهول وصورة المثل، مع بقاء الشخص الذي ترمز إليه البذرة هو المقصود.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: الذي يسمع الكلمة
  rationale: صياغة عربية طبيعية تحفظ «الكلمة» بما لها من صدى إنجيلي، دون استبدالها بتفسير مثل «الرسالة».
- source_word: συνιείς
  choice: ويفهمها
  rationale: يدل الفعل على إدراك معنى الكلمة المسموعة، والضمير مضاف في العربية لبيان المفعول المفهوم من السياق.
- source_word: δὴ
  choice: حقًّا
  rationale: تنقل قوة التوكيد في الأداة اليونانية بخفة ومن دون مبالغة.
- source_word: καρποφορεῖ
  choice: يُثمر
  rationale: يحفظ الاستعارة الزراعية الأساسية في المثل، وهو تعبير عربي مألوف.
- source_word: ποιεῖ
  choice: ويُنتج
  rationale: يبقي الفعل الثاني مستقلًا عن «يُثمر»، ويفيد إنتاج الغلة في هذا السياق.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: هذا مئة، وذاك ستين، وآخر ثلاثين
  rationale: تنقل البنية التوزيعية الموجزة وتُبقي الأعداد كما وردت، مع توضيح أن المحاصيل متفاوتة من حالة إلى أخرى.
theological_decisions:
- issue: طبيعة الاستجابة للكلمة في المثل
  choice: وصف السامع بأنه يسمع الكلمة ويفهمها ويُثمر بمقادير متفاوتة
  alternative: التصريح بالمثابرة أو بالتجدد الحقيقي بوصفهما المقصود العقائدي
  rationale: النص اليوناني يذكر السماع والفهم والإثمار، لكنه لا يصرّح بهذه التصنيفات العقائدية اللاحقة؛ لذلك تُحفظ ألفاظ النص وتوتره من دون إضافة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الأرض الجيدة» بدل تعبير تقني مثل «التربة» للمحافظة على طبيعية العبارة وصورة المثل، مع تجنب أي توسع عقائدي غير مصرح به في اليونانية.
