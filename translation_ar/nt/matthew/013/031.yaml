  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: ar
  text: 'وضرب لهم مثلًا آخر قائلًا: «يشبه ملكوت السماوات حبّة خردل أخذها رجل وبذرها في حقله».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: ضرب لهم مثلًا
  rationale: تعبير عربي طبيعي راسخ لتقديم المثل على السامعين، وينقل الوظيفة السياقية للفعل بدل محاكاة صورته الحرفية بصورة ثقيلة.
- source_word: παραβολὴν
  choice: مثلًا
  rationale: «مثل» هو المصطلح العربي المألوف والدقيق لهذا اللون من تعليم يسوع.
- source_word: Ὁμοία ἐστὶν
  choice: يشبه
  rationale: صياغة عربية واضحة ومباشرة لأداة المقارنة اليونانية، مع بقاء «ملكوت» هو طرف المقارنة النحوي.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: يحفظ تعبير متّى المميز، ويتيح أن يدل «الملكوت» على السلطان والحيّز معًا من غير حصر المعنى في أحدهما.
- source_word: κόκκῳ σινάπεως
  choice: حبّة خردل
  rationale: تعبير عربي مفهوم ودقيق لصورة بذرة الخردل الصغيرة؛ و«حبّة» تلائم κόκκος طبيعيًا.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: أخذها رجل
  rationale: يحفظ الفاعل المفرد المذكّر، ويحوّل التركيب الاشتقاقي اليوناني إلى ترتيب عربي سلس.
- source_word: ἔσπειρεν
  choice: زرعها
  rationale: «زرع» هو المقابل العربي الطبيعي للفعل σπείρω في هذا السياق، ويؤدي معنى بذر الحبّ دون تكلّف.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: في حقله
  rationale: ينقل معنى الحقل الزراعي وضمير الملكية بإيجاز ووضوح.
theological_decisions:
- issue: ترجمة عبارة متّى βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  alternative: مُلك السماوات / سيادة السماوات
  rationale: «ملكوت السماوات» يحافظ على الصيغة المتّية المعروفة ولا يضيّق دلالتها إلى مكان أو حكم مجرد، بل يبقي مداها اللاهوتي مفتوحًا.
- issue: مدى التشبيه في قول «يشبه ملكوت السماوات حبّة خردل»
  choice: الإبقاء على صيغة المقارنة الموجزة
  alternative: تفسير التشبيه بأنه يخص نمو الملكوت وحده
  rationale: النص اليوناني لا يصرّح هنا بالوجه الدقيق للمقارنة؛ لذلك لا ينبغي إدخال تفسير يحسم أن الشبه منحصر في البذرة أو نموها أو مجمل الحدث.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «ضرب لهم مثلًا» لسلامته ورسوخه في العربية، و«ملكوت السماوات» اتساقًا مع مصطلح متّى المفتاحي. لا توجد حاجة إلى حواشٍ نصية أو تفسيرية في هذه الآية.
