  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: تقديم مثل إضافي، وصيغة التشبيه، و«ملكوت السماوات»، وصورة الخميرة، وأخذ المرأة لها وإخفائها في ثلاثة أكيال من الدقيق، والنتيجة الشاملة في «حتى اختمر كله». ولا يفرض تقويمًا لاهوتيًا موجبًا أو سالبًا للخميرة.'
