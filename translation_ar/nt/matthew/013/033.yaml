  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: ar
  text: 'وضرب لهم مثلًا آخر: «يشبه ملكوت السماوات خميرةً[a] أخذتها امرأة وخبأتها[b] في ثلاثة أكيال من الدقيق[c]، حتى اختمر كله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي مادة التخمير التي تُستعمل في العجين.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم أيضًا بمعنى «خلطتها به» أو «عجنتها فيه»؛ واليونانية حرفيًا: «خبأتها فيه».'
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية: «ثلاثة أسآة من الدقيق»، وهي كمية كبيرة؛ والسأة مكيال قديم.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: وضرب لهم مثلًا آخر
  rationale: صياغة عربية طبيعية ومألوفة لتقديم الأمثال، وتحفظ معنى إضافة مثل آخر إلى ما سبقه.
- source_word: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: يشبه ملكوت السماوات
  rationale: تنقل صيغة المقارنة بوضوح، وتحافظ على التعبير المتّى «ملكوت السماوات» بصيغة عربية راسخة.
- source_word: ζύμῃ
  choice: خميرةً
  rationale: «الخميرة» لفظ عربي واضح لعامل التخمير، ويبقي صورة المثل محايدة من غير فرض دلالة لاهوتية إيجابية أو سلبية.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: أخذتها امرأة
  rationale: تحفظ تسلسل الفعل في تركيب عربي موجز وطبيعي.
- source_word: ἐνέκρυψεν εἰς
  choice: خبأتها في
  rationale: يحفظ المعنى الحرفي للفعل، أي الإخفاء في الشيء، بدل استبداله بالتفسير السياقي «خلطتها».
- source_word: ἀλεύρου σάτα τρία
  choice: ثلاثة أكيال من الدقيق
  rationale: «أكيال» تنقل كون السات مكيالًا للحبوب مع بقاء العبارة مفهومة؛ وتوضح الحاشية اسم المكيال وحجم الكمية.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: حتى اختمر كله
  rationale: صياغة عربية طبيعية تحفظ المبني للمجهول دلاليًا بوصف الكتلة كلها قد صارت مختمرة، من غير إضافة «العجين» إلى النص.
theological_decisions:
- issue: دلالة الخميرة في مثل الملكوت
  choice: إبقاء الصورة محايدة بلفظ «خميرة» من غير وصفها بالخير أو الشر
  alternative: تفسير الخميرة سلبًا استنادًا إلى مواضع أخرى، أو إبرازها إيجابيًا بوصفها رمزًا لنمو الملكوت
  rationale: النص نفسه يركز على عمل الخميرة الخفي والشامل، ولا يصرح هنا بتقويم أخلاقي لها؛ لذلك ينبغي ألا تحسم الترجمة الجدل التفسيري.
- issue: المرجع في «اختمر كله»
  choice: الإبقاء على المرجع الجمعي الضمني كما في اليونانية
  alternative: التصريح بعبارة «حتى اختمر العجين كله»
  rationale: النص يذكر الدقيق ولا يذكر العجين صراحة؛ والصياغة المختارة مفهومة وتحفظ قدرًا من إيجاز الأصل وعدم تخصيصه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت العبارة العربية المألوفة «ضرب مثلًا»، مع الحفاظ على «خبأتها» لتجسيد اللفظ اليوناني وعدم تسوية الصورة إلى مجرد الخلط. وُضعت جميع علامات الحواشي في المتن بترتيب ظهورها.
