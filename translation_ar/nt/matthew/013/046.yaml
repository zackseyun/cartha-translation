  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: ar
  text: ولمّا وجد لؤلؤةً واحدةً عظيمةَ القيمة[a]، مضى وباع كلَّ ما كان له واشتراها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لؤلؤةً ثمينةً».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: ولمّا وجد
  rationale: يعبّر عن الفعل السابق للأفعال الرئيسة، ويصل الجملة بسياقها وصلاً خفيفًا من غير إضفاء معنى استدراكي قوي على δέ.
- source_word: ἕνα
  choice: واحدةً
  rationale: يحفظ العدد الصريح في اليونانية ويبرز أن المقصود لؤلؤة واحدة ذات قيمة استثنائية.
- source_word: πολύτιμον
  choice: عظيمةَ القيمة
  rationale: تعبير عربي واضح ومعاصر ينقل شدة القيمة، مع إثبات البديل «ثمينة» في الحاشية.
- source_word: μαργαρίτην
  choice: لؤلؤةً
  rationale: المقابل العربي المعياري للاسم اليوناني في هذا السياق.
- source_word: ἀπελθὼν
  choice: مضى
  rationale: صياغة فعلية عربية طبيعية تحفظ تتابع الأحداث من غير تقيد حرفي ببنية اسم الفاعل اليونانية.
- source_word: πέπρακεν
  choice: باع
  rationale: ينقل الفعل التام بوصفه عملاً منجزًا ضمن السرد، وهو الأسلوب العربي الطبيعي هنا.
- source_word: πάντα ὅσα εἶχεν
  choice: كلَّ ما كان له
  rationale: يحفظ معنى الشمول التام وصلة الموصول بصياغة عربية واضحة.
- source_word: ἠγόρασεν
  choice: اشترى
  rationale: المقابل العربي المباشر والطبيعي للفعل.
- source_word: αὐτόν
  choice: ها
  rationale: الضمير يعود إلى «لؤلؤة»، وهي مؤنثة في العربية، ولذلك تلزم المطابقة العربية لا الجنس النحوي اليوناني.
