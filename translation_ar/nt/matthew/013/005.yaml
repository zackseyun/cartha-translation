  text: وَبِذَارٌ آخَرُ وَقَعَ عَلَى الْمَوَاضِعِ الصَّخْرِيَّةِ[a]، حَيْثُ لَمْ تَكُنْ فِيهِ تُرْبَةٌ كَثِيرَةٌ، فَنَبَتَ فِي الْحَالِ لِأَنَّ التُّرْبَةَ لَمْ تَكُنْ عَمِيقَةً،
  philosophy: optimal-equivalence
