  naturalness: «وبذارٌ آخرُ وقع» أوضح وأفصح في المقابلة التوزيعية من «ووقع بعض البذار». و«حيث لم تكن فيه تربة كثيرة» يزيل الغموض النحوي. وتبقى الفاصلة الختامية مناسبة لأن الجملة مستمرة في الآية التالية.
  terminology: «البذار»، و«المواضع الصخرية»، و«التربة» ألفاظ مناسبة للفصحى المعاصرة ولصورة المثل الزراعية. والحاشية تشرح بدقة أن المقصود تربة ضحلة فوق صخر، من غير إدخال تفسير عقائدي.
