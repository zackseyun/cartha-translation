  - severity: low
    issue: «ووقع بعض البذار» أقل دقة أسلوبيًا في تمثيل المقابلة التي في ἄλλα δέ.
    rationale: «وبذار آخر وقع» يحافظ على الإحالة البيضاوية إلى البذار وعلى التعاقب بين أنواع المواضع، من غير أن يوحي بتجزئة كمية غير لازمة.
