lexical_decisions:
- source_word: ἄλλα δὲ
  choice: ووقع بعض البذار
  rationale: الصفة المحايدة المجموعة تُحيل اختصارًا إلى البذار المذكورة في الآية السابقة؛ أُضيفت «البذار» للوضوح، ونقلت «بعض» معنى التوزيع والمقابلة في السياق.
- source_word: ἔπεσεν
  choice: وقع
  rationale: يحافظ على المعنى المباشر للفعل في صورة المثل، من غير تحويله تفسيريًا إلى «زُرع».
- source_word: ἐπὶ τὰ πετρώδη
  choice: على المواضع الصخرية
  rationale: صيغة الجمع المحايدة تدل حرفيًا على مواضع صخرية؛ وهذه العبارة تحفظ الجمع والصورة الأصلية، مع توضيح المقصود في الحاشية.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: حيث لم تكن له تربة كثيرة
  rationale: «التربة» طبيعية في السياق الزراعي، والضمير يحافظ على الصياغة التي تنسب قلة التربة إلى الموضع من غير حسم زائد لبنية العبارة.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: فنبت في الحال
  rationale: «نبت» تعبر طبيعيًا عن خروج النبات، و«في الحال» تحفظ دلالة الفورية في εὐθέως، بينما الفاء تلائم تتابع الحدث ونتيجته بالعربية.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: لأن التربة لم تكن عميقة
  rationale: تنقل διά السببية وصورة انعدام عمق التربة بعبارة عربية واضحة وطبيعية، من غير إضافة تفسير يتجاوز النص.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صورة السقوط والإنبات، واستُعملت ألفاظ زراعية مألوفة. أُبقيت علامة الحاشية [a] في المتن، وخُتمت العبارة بفاصلة لموافقة استمرار الجملة في الآية التالية.
