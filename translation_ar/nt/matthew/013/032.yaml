source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: ar
  text: وهي أصغر من جميع البذور، ولكنها متى نمت صارت أكبر من نباتات البستان، وأصبحت شجرة، بحيث تأتي طيور السماء وتعشِّش في أغصانها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تستدعي صورة الطيور التي تعشِّش في الأغصان صورًا في العهد القديم لشجرة عظيمة تمثّل مملكة، مثل حزقيال 17:23 ودانيال 4:12، لكن الآية لا تصرّح بهذا الرمز.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: أصغر من جميع البذور
  rationale: يحافظ على صيغة المقارنة اليونانية مع المضاف إليه الدال على مجال المقارنة، من غير تحويلها صراحة إلى صيغة تفضيل مطلق.
- source_word: μέν ... δέ
  choice: ولكن
  rationale: ينقل التضاد بين صغر البداية وكبر النتيجة بصياغة عربية طبيعية؛ ولا يلزم إظهار μέν بكلمة مستقلة.
- source_word: ὅταν ... αὐξηθῇ
  choice: متى نمت
  rationale: ينقل الحدث المحتمل الذي يُنظر إليه بوصفه تامًّا قبل النتيجة، بأسلوب عربي واضح وموجز.
- source_word: μεῖζον τῶν λαχάνων
  choice: أكبر من نباتات البستان
  rationale: يحافظ على المقارنة، ويعبّر عن النباتات المزروعة في البستان من غير حصرها في الخضروات أو الأعشاب.
- source_word: γίνεται δένδρον
  choice: أصبحت شجرة
  rationale: يبقي الصورة الصريحة في اليونانية ولا يخففها إلى «كالشجرة» أو «شبيهة بشجرة».
- source_word: ὥστε ἐλθεῖν
  choice: حتى تأتي
  rationale: تؤدي معنى النتيجة المقصود من ὥστε مع المصدر، بصياغة عربية مألوفة.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة السماء في الأصل.
- source_word: κατασκηνοῦν
  choice: تعشِّش
  rationale: يناسب سياق الطيور والأغصان، ويؤدي معنى اتخاذ موضع للإقامة أو العش.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: في أغصانها
  rationale: ترجمة مكانية مباشرة، مع تأنيث الضمير في العربية لموافقته «شجرة».
theological_decisions:
- issue: احتمال التلميح إلى صورة الشجرة الملكية العظيمة في العهد القديم
  choice: إبقاء صورة الطيور التي تعشِّش في الأغصان من غير تفسير رمزي في المتن
  alternative: تفسير الطيور صراحة بأنها الأمم أو الشعوب التي تجد مأوى في ملكوت الله
  rationale: قد تذكّر الصورة بحزقيال 17:23 ودانيال 4:12، لكن الآية نفسها لا تصرّح بمدلول رمزي؛ لذلك تُحفظ إمكانات التلميح من غير فرض تفسير بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على المقارنات والصورة الزراعية كما في اليونانية. وُضع مؤشر الحاشية بعد الصورة التي تتعلق بها. لم تُدرج حاشية «طيور الهواء» الواردة في طبقة الاستشارة الإنجليزية لأنها لا تلائم البديل العربي الطبيعي ولا يبدو موضع مؤشرها في النص الإنجليزي المقدم متسقًا مع مضمونها.
