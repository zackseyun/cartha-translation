- source_word: πολλὰ
  choice: بأمور كثيرة
  rationale: يحافظ على دلالة المحايد الجمع، أي أشياء أو أمور كثيرة، من غير زيادة تفسيرية.
- source_word: ἐν παραβολαῖς
  choice: بأمثال
  rationale: «الأمثال» هو المقابل العربي المألوف للقصص التشبيهية التعليمية في هذا السياق.
- source_word: Ἰδοὺ
  choice: ها إنَّ
  rationale: أداة تنبيه عربية فصيحة وحالية تسترعي الانتباه، من غير النبرة القديمة التي قد تحملها «هوذا».
- source_word: ὁ σπείρων
  choice: الزارع
  rationale: اسم الفاعل المعرَّف يدل على الشخص الذي يزرع، و«الزارع» هو المقابل العربي المباشر الطبيعي.
- source_word: τοῦ σπείρειν
  choice: ليزرع
  rationale: ينقل استعمال المصدر الدال على الغرض بصيغة عربية موجزة وطبيعية.
