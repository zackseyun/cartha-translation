source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: ar
  text: أليس هذا ابنَ النجّار؟ أليست أمّه تُدعى مريم، وإخوته يعقوب ويوسف[a] وسمعان ويهوذا؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «يوسي» بدلًا من «يوسف».'
    reason: textual_variant
  - marker: b
    text: يمكن أن يُفهم اللفظ اليوناني هنا بمعنى أوسع، أي «أقاربه» أو «ذوو قرابته»، مع أن معناه المعتاد هو «إخوته».
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτονος
  choice: النجّار
  rationale: يدل اللفظ على صانع يعمل في الخشب أو البناء، و«النجّار» هو المقابل العربي الطبيعي المألوف في هذا السياق، مع بقاء «البنّاء» أو «الحِرَفي» ضمن مداه الدلالي.
- source_word: υἱός
  choice: ابن
  rationale: السياق العائلي المباشر يقتضي معنى البنوة الصريح.
- source_word: λέγεται
  choice: تُدعى
  rationale: ينقل المبني للمجهول في اليونانية نقلًا طبيعيًا وموجزًا، بمعنى «تُسمّى».
- source_word: Μαριὰμ
  choice: مريم
  rationale: الصيغة العربية الكتابية الراسخة للاسم.
- source_word: ἀδελφοὶ
  choice: إخوته
  rationale: المعنى المعجمي المعتاد هو الإخوة؛ ويُحفظ احتمال الاستعمال الأوسع للقرابة في الحاشية من غير حسم الخلاف اللاهوتي في المتن.
- source_word: Ἰάκωβος
  choice: يعقوب
  rationale: المقابل العربي الراسخ للاسم اليوناني Ἰάκωβος، وهو أقرب إلى أصله السامي من التقليد الإنجليزي «James».
- source_word: Ἰωσὴφ
  choice: يوسف
  rationale: هذه هي قراءة SBLGNT، والمقابل العربي القياسي للاسم؛ وتُذكر قراءة «يوسي» في الحاشية.
- source_word: Σίμων
  choice: سمعان
  rationale: المقابل العربي الكتابي التقليدي الواضح للاسم في هذا السياق.
- source_word: Ἰούδας
  choice: يهوذا
  rationale: المقابل العربي الراسخ للاسم، من غير استيراد التفريق الاصطلاحي الإنجليزي بين Judas وJude.
- source_word: οὐχ ... ;
  choice: أليس ...؟ أليست ...؟
  rationale: يحفظ صيغة السؤالين الإنكاريين اللذين يتوقعان جوابًا بالإيجاب، ويأتي بأسلوب عربي طبيعي.
theological_decisions:
- issue: دلالة ἀδελφοὶ αὐτοῦ وعلاقة المذكورين بيسوع
  choice: إخوته
  alternative: أقاربه أو ذوو قرابته
  rationale: المعنى الظاهر والمعتاد للفظ اليوناني هو «الإخوة». لا ينبغي للترجمة أن تحسم الجدل اللاحق بشأن طبيعة صلتهم العائلية أو دوام بتولية مريم؛ لذلك يُثبت اللفظ المباشر في المتن ويُذكر الاحتمال الأوسع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة الاستفهام الإنكاري «أليس/أليست» للمحافظة على بنية الأصل ونبرته. وُضعت علامة اختلاف القراءة بعد «يوسف»، وعلامة البديل الدلالي بعد الجملة التي تذكر الإخوة.
