  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: ar
  text: فاجتمعت إليه جموع كثيرة، حتى إنه ركب قاربًا وجلس، وكان الجمع كله واقفًا على الشاطئ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: فاجتمعت إليه
  rationale: ينقل الفعل المبني للمجهول بصياغة عربية لازمة طبيعية، وتحافظ «إليه» على دلالة الحركة نحو يسوع في πρός مع النصب.
- source_word: ὄχλοι πολλοί
  choice: جموع كثيرة
  rationale: يحافظ على صيغة الجمع وعلى معنى كثرة الجموع، وهو تعبير عربي فصيح وطبيعي.
- source_word: ὥστε
  choice: حتى إن
  rationale: يؤدي معنى النتيجة التي ترتبت على اجتماع الجموع، بسياق عربي سلس.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: ركب قاربًا
  rationale: تعبير عربي طبيعي لدخول القارب واعتلائه، من غير الحرفية الثقيلة في «دخل إلى قارب».
- source_word: καθῆσθαι
  choice: وجلس
  rationale: ينقل فعل الجلوس مباشرة وبوضوح، ولا يلزم في العربية إضافة «جلس نزولًا» أو ما شابه.
- source_word: πᾶς ὁ ὄχλος
  choice: الجمع كله
  rationale: يحافظ على انتقال اليونانية من «جموع» بالجمع إلى النظر إليها جماعة واحدة بصيغة المفرد الجمعي.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: على الشاطئ
  rationale: «الشاطئ» مقابل عربي محايد وطبيعي لـ αἰγιαλός، الذي يدل على شاطئ البحر أو ضفته الرملية.
- source_word: εἱστήκει
  choice: كان واقفًا
  rationale: ينقل الحالة المستمرة الناتجة التي يصورها الماضي التام اليوناني، مع مطابقة «الجمع» المفرد الجمعي نحويًا.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدم «قارب» بدل «سفينة» لأن πλοῖον عام في هذا السياق، وحوفظ على المفرد الجمعي في «الجمع كله فكان واقفًا». لا توجد في الآية مسألة لاهوتية تستدعي حاشية، ولا حاجة إلى حواشٍ معجمية لأن البدائل لا تغيّر المعنى تغييرًا مهمًا.
