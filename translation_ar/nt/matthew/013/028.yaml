  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: ar
  text: 'فقال لهم: «فعل هذا رجلٌ عدوّ». فقال له عبيده: «أفتريد أن نذهب فنجمعها؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: فعل قول مألوف في السرد، والفاء تلائم انتقال الكلام في السياق العربي.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: إنسان عدوّ
  rationale: يحافظ على وجود ἄνθρωπος وعلى وصفه بأنه عدو، بصياغة عربية واضحة دون اختزاله إلى «عدو» فقط.
- source_word: τοῦτο ἐποίησεν
  choice: فعل هذا
  rationale: ينقل اسم الإشارة والفعل الماضي البسيط مباشرة وطبيعيًا.
- source_word: δοῦλοι
  choice: العبيد
  rationale: يحفظ الدلالة الاجتماعية الأساسية للفظ اليوناني في علاقة التبعية لصاحب البيت، مع إثبات البديل السياقي في الحاشية.
- source_word: Θέλεις
  choice: أتريد
  rationale: تعبير عربي معاصر وواضح عن الإرادة أو الرغبة.
- source_word: οὖν
  choice: فـ
  rationale: تفيد هنا نتيجة عملية مترتبة على جواب السيد، وتندمج طبيعيًا في الاستفهام العربي.
- source_word: ἀπελθόντες
  choice: أن نذهب
  rationale: يؤدي معنى الذهاب السابق للجمع بصياغة عربية طبيعية تابعة لفعل الإرادة.
- source_word: συλλέξωμεν
  choice: فنجمع
  rationale: ينقل الجمع المادي للنباتات المقصودة، مع الحفاظ على تسلسل الفعلين.
- source_word: αὐτά
  choice: ها
  rationale: ضمير جمع غير العاقل يعود إلى الزوان المذكور في السياق، ويصح في العربية إفراده مؤنثًا.
theological_decisions:
- issue: ترجمة δοῦλοι في سياق المثل
  choice: العبيد
  alternative: الخدم
  rationale: لفظ «العبيد» يبرز وضع التبعية الذي يحمله δοῦλοι، من غير جعل هذا التفصيل محور المعنى اللاهوتي؛ وتُذكر «الخدم» بوصفها ترجمة سياقية ممكنة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت صياغة حوارية موجزة، مع إبقاء العبارة اليونانية «إنسان عدوّ» وعدم تسوية الفرق الدلالي في δοῦλοι دون حاشية.
