  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: ar
  text: فلمّا امتلأت، سحبوها إلى الشاطئ، ثم جلسوا وجمعوا السمك الجيد في أوعية[a]، أمّا السمك الفاسد[b] فطرحوه خارجًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «آنية». اللفظ اليوناني عام، ويدل على أوعية، وليس بالضرورة على سلال.
    reason: lexical_alternative
  - marker: b
    text: أو «الرديء». قد تعني الكلمة اليونانية «الفاسد» أو «المتعفّن»، وقد تدل بوجه أعم على ما لا قيمة له.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ها في «امتلأت» و«سحبوها»
  rationale: الضمير يعود على الشبكة المذكورة في الآية السابقة، والتأنيث في العربية يوضح هذا العود طبيعيًا من غير تكرار الاسم.
- source_word: ἐπληρώθη
  choice: امتلأت
  rationale: ينقل الفعل المبني للمجهول من حيث المعنى بصياغة عربية طبيعية، أي صارت الشبكة ممتلئة بالسمك.
- source_word: ἀναβιβάσαντες
  choice: سحبوها
  rationale: يفيد رفع الشبكة وإخراجها من الماء إلى اليابسة، و«سحبوها إلى الشاطئ» تعبير واضح وطبيعي في سياق الصيد.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: إلى الشاطئ
  rationale: αἰγιαλός يدل على الشاطئ أو الساحل، و«الشاطئ» دقيق من غير افتراض أنه رملي.
- source_word: καθίσαντες
  choice: ثم جلسوا
  rationale: ينقل الفعل التالي في تسلسل الأحداث، وقد أضيفت «ثم» لإظهار التعاقب الطبيعي الذي تؤديه الأفعال الوصفية اليونانية في السياق.
- source_word: συνέλεξαν
  choice: جمعوا
  rationale: المعنى هو الجمع والضم معًا، وهو ملائم لفرز حصيلة الشبكة.
- source_word: τὰ καλά
  choice: السمك الجيد
  rationale: لفظ «السمك» مفهوم من السياق وإن لم يُذكر صراحة في اليونانية، وإظهاره بالعربية يزيل الالتباس من غير إضافة معنى جديد.
- source_word: εἰς ἄγγη
  choice: في أوعية
  rationale: ἄγγη لفظ عام للأوعية أو الحاويات، لذلك تتجنب الترجمة تخصيصها بسلال.
- source_word: τὰ δὲ σαπρά
  choice: أمّا الفاسد
  rationale: 'يحافظ «الفاسد» على الصورة الحسية لما تلف أو تعفّن، مع بقاء إمكان المعنى الأوسع: الرديء أو غير النافع.'
- source_word: ἔξω ἔβαλον
  choice: فطرحوه خارجًا
  rationale: ينقل قوة النبذ إلى الخارج بعبارة عربية فصيحة واضحة.
theological_decisions:
- issue: تفسير صورة الفرز في المثل
  choice: إبقاء الآية مشهدًا واقعيًا للصيد وفرز السمك
  alternative: صياغتها بألفاظ تفسيرية تستبق دلالة الدينونة الأخيرة
  rationale: هذه الآية تروي صورة المثل نفسها، أمّا شرحها اللاهوتي فيأتي في الآيات التالية؛ لذلك لا تُحمَّل الترجمة هنا تفسيرًا غير مصرح به في النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «أوعية» للمحافظة على عموم اللفظ اليوناني، و«الفاسد» للإبقاء على الصورة الحسية مع توثيق المعنى الأوسع في الحاشية. وُضعت علامتا الحاشيتين عند اللفظين اللذين تخصهما البدائل المعجمية.
