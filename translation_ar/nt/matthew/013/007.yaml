base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: ar
  text: ووقعت بذورٌ أخرى بين الشوك[a]، فنما الشوك وخنقها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا في اليونانية: «على الشوك»؛ وقد تُرجمت هنا «بين الشوك» لتلائم السياق الزراعي في العربية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: بذورٌ أخرى
  rationale: الصفة المحايدة في صيغة الجمع مستعملة استعمال الاسم، ومرجعها الضمني هو البذار في سياق المثل؛ لذلك أُظهر الاسم في العربية للوضوح والطبيعية.
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال خفيفة تتابع سرد أنواع الأرض، ولا تفيد هنا مقابلة قوية تستلزم «لكن».
- source_word: ἔπεσεν
  choice: وقعت
  rationale: يحافظ هذا الاختيار على المعنى المباشر للفعل πίπτω، أي «وقع»، من غير استبداله بتعبير تفسيري مثل «زُرعت».
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: بين الشوك
  rationale: مع أن ἐπί مع النصب تعني حرفيًا «على»، فإن «بين الشوك» تعبير عربي طبيعي في هذا السياق الزراعي، ويفيد وقوع البذار في موضع الشوك دون إيهام استقرارها فوق أغصانه.
- source_word: ἀκάνθας / ἄκανθαι
  choice: الشوك
  rationale: لفظ عربي جامع وطبيعي يحافظ على تكرار الكلمة اليونانية في موضع وقوع البذار وفي وصف النبات الذي نما.
- source_word: ἀνέβησαν
  choice: نما
  rationale: ينقل صورة صعود النبات ونموه بعبارة عربية موجزة وطبيعية؛ وجاء الفعل مفردًا لمعاملة «الشوك» اسم جمع.
- source_word: ἔπνιξαν
  choice: خنقها
  rationale: يحافظ على الصورة الحية في الفعل πνίγω، وهي أن الشوك أحاط بالبذار النامية ومنع نموها.
- source_word: αὐτά
  choice: ها
  rationale: الضمير عائد إلى «بذور»، ويأتي في العربية مفردًا مؤنثًا وفق القاعدة في جمع غير العاقل.
