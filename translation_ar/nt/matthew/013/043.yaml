  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: ar
  text: حينئذ سيضيء[a] الأبرار كالشمس في ملكوت أبيهم. من له أذنان فليسمع.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيتلألأ الأبرار».'
    reason: lexical_alternative
  - marker: b
    text: جاء النداء في اليونانية بصيغة المفرد، وهو نداء تمثيلي موجَّه إلى كل من يسمع لكي ينتبه ويستجيب.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: تفيد الترتيب الزمني المرتبط بما سبق، وتحافظ على الإشارة الأخروية من غير إطالة.
- source_word: οἱ δίκαιοι
  choice: الأبرار
  rationale: مقابل عربي راسخ وواضح للصفة المستعملة اسميًا، ويحفظ دلالتها الأخلاقية والدينية من غير تضييق معناها.
- source_word: ἐκλάμψουσιν
  choice: سيضيء
  rationale: ينقل فعل اللمعان أو الإشراق في صيغة المستقبل، وتأتي مطابقة الفعل مفردًا قبل الفاعل الجمع وفق الأسلوب العربي الفصيح.
- source_word: ὡς ὁ ἥλιος
  choice: كالشمس
  rationale: صياغة عربية طبيعية ومباشرة لأداة التشبيه والصورة الأصلية.
- source_word: ἐν τῇ βασιλείᾳ
  choice: في ملكوت
  rationale: «ملكوت» مقابل عربي كتابي واضح يجمع دلالة سلطان الملك ومجاله، وتلائم العبارة هنا معنى الحيّز من غير نفي معنى الحكم.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: أبيهم
  rationale: يحافظ على الإضافة والضمير كما في اليونانية، من غير إضافة وصف مثل «السماوي» غير موجود في الآية.
- source_word: ὁ ἔχων ὦτα
  choice: من له أذنان
  rationale: ينقل النداء التمثيلي المفرد بصياغة عربية طبيعية، ويعبّر بالمثنى عن جمع «أذنين» اليوناني.
- source_word: ἀκουέτω
  choice: فليسمع
  rationale: يحفظ قوة أمر الغائب المفرد، ويتيح معنى السماع الذي يتضمن الإصغاء والاستجابة في هذا السياق.
theological_decisions:
- issue: صيغة المفرد التمثيلي في النداء الختامي
  choice: من له أذنان فليسمع
  alternative: من له أذنان فليصغِ؛ من كانت له أذنان فليسمع
  rationale: تحفظ الصيغة المفردة في الأصل بوصفها نداءً عامًا لكل سامع، من غير تحويلها إلى جمع أو حصرها في جنس بعينه.
- issue: دلالة βασιλεία في السياق
  choice: ملكوت
  alternative: مملكة؛ مُلك
  rationale: يناسب «ملكوت» العبارة المكانية «في ملكوت أبيهم»، مع إبقاء دلالة السلطان الملكي وعدم فرض تفسير مذهبي خاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة غير متكلّفة. استُعمل «ملكوت» لاتساقه مع السياق الإنجيلي، وصيغت الجملة الأخيرة بالمفرد التمثيلي كما في المصدر.
