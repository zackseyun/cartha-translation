  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: ar
  text: ولمّا أشرقت الشمس، لفحتْه حرارتُها، ولأنه لم يكن له جذر، يبس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: ولمّا أشرقت الشمس
  rationale: تركيب المضاف المطلق يعبّر عن ظرف زمني، و«ولمّا» تنقل التعاقب مع دلالة δέ الانتقالية الخفيفة.
- source_word: ἐκαυματίσθη
  choice: احترق
  rationale: فعل مبني للمجهول في اليونانية يدل على إصابة النبات بحرارة الشمس؛ وصيغة «احترق» العربية طبيعية في هذا السياق ولا تستلزم الاحتراق بالنار.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ولأنه لم يكن له
  rationale: διά مع المصدر المعرّف تفيد السببية، وقد صيغت في العربية جملة سببية واضحة.
- source_word: ῥίζαν
  choice: أصل
  rationale: اللفظة مفردة وتشير إلى جذر النبات؛ و«أصل» فصيحة طبيعية هنا وتحافظ على صورة الافتقار إلى ما يثبّت النبات ويغذّيه.
- source_word: ἐξηράνθη
  choice: يبس
  rationale: في سياق النبات يدل الفعل على الجفاف والذبول؛ و«يبس» ينقل النتيجة مباشرة وبإيجاز.
