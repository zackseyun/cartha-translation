id: MAT.13.12
reference: Matthew 13:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: ar
  text: لأن مَن له سيُعطى ويزداد؛ وأما مَن ليس له، فحتى ما له سيُؤخذ منه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: مَن
  rationale: اسم موصول عام يفيد قاعدة شاملة، وهو المقابل العربي الطبيعي للضمير الموصول غير المحدد من غير حصره في فئة بعينها.
- source_word: γὰρ
  choice: لأن
  rationale: يحفظ وظيفة الأداة في تعليل الكلام السابق، ويأتي طبيعيًا في العربية المعاصرة.
- source_word: ἔχει / οὐκ ἔχει
  choice: له / ليس له
  rationale: صياغة عربية موجزة وطبيعية لمعنى الامتلاك، مع إبقاء المفعول غير مذكور كما في اليونانية.
- source_word: δοθήσεται αὐτῷ
  choice: سيُعطى
  rationale: يحفظ المبني للمجهول ولا يضيف مفعولًا مثل «المزيد» غير مصرح به في النص اليوناني؛ وتدل صيغة «مَن له» على أن العطاء واقع له.
- source_word: περισσευθήσεται
  choice: ويزداد
  rationale: ينقل معنى الصيرورة إلى الوفرة أو الزيادة بعبارة عربية واضحة وموجزة، من غير تحديد الشيء الذي يزداد.
- source_word: δὲ
  choice: وأما
  rationale: يبرز المقابلة بين شطري القول بوضوح وفصاحة في العربية.
- source_word: καὶ ὃ ἔχει
  choice: فحتى ما له
  rationale: 'تؤدي «حتى» وظيفة καί التصاعدية التي تشدد المفارقة: سيُنتزع منه حتى الموجود لديه.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: سيُنتزع منه
  rationale: ينقل معنى الإزالة والأخذ من الشخص بقوة ووضوح، مع الحفاظ على المبني للمجهول.
theological_decisions:
- issue: المفعول المحذوف مع «له» و«سيُعطى»
  choice: إبقاؤه غير مذكور
  alternative: تحديده بأنه الفهم أو قبول التعليم أو معرفة أسرار الملكوت، أو إضافة «المزيد»
  rationale: السياق يتصل بتلقي تعليم يسوع وأسرار الملكوت، لكن النص اليوناني يترك الشيء المقصود ضمنيًا؛ لذلك تحافظ الترجمة على سعة القول وتوتره الدلالي.
- issue: الصيغة المذكرة المفردة ذات الدلالة العامة
  choice: استعمال «مَن» مع أفعال المفرد المذكر بحسب النسق العربي العام
  alternative: تحويل العبارة إلى صيغة جمع أو تكرار «الشخص»
  rationale: «مَن» العربية تؤدي المعنى العام بصورة طبيعية، وتسمح في الوقت نفسه بالمطابقة المفردة التي تقابل بناء المصدر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على إيجاز المثل، وعلى المفعول الضمني، وعلى المقابلة الحادة بين الزيادة والانتزاع، من غير إدخال تفسير مذهبي أو تخصيص غير مصرح به.
