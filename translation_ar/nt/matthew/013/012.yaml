  source_fidelity: يحافظ النص على البنية العامة للقول وعلى إبقاء الشيء المملوك أو المعطى غير مذكور، كما يحفظ المقابلة بين مَن «له» ومَن «ليس له». غير أن «يُنتزع» أقوى دلالةً من αἴρω في هذا الموضع؛ فالفعل اليوناني يفيد الأخذ أو الإزالة ولا يقتضي معنى النزع القسري.
  naturalness: الصياغة فصيحة وواضحة، و«مَن له ... وأما مَن ليس له» طبيعية في العربية المعاصرة. واستعمال الفاصلة المنقوطة يوضح التقابل بين شطري العبارة.
  terminology: لا توجد مصطلحات لاهوتية متخصصة في الآية. «سيُؤخذ منه» مقابل عربي محايد ودقيق لفعل الأخذ/الإزالة، ويحفظ المبني للمجهول في الأصل.
