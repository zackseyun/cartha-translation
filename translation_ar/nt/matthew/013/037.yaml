    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: التعبير اليوناني «أجاب وقال» صيغة مألوفة لتقديم الجواب. جُمعت دلالة الفعلين في «فأجاب» لتكون العربية طبيعية من غير تكرار زائد.
- source_word: Ὁ σπείρων
  choice: الذي يزرع
  rationale: اسم الفاعل المعرّف يحدد الشخص من خلال فعله؛ وهذه الصياغة تحافظ على دلالته المستمرة أو العامة بوضوح.
- source_word: τὸ καλὸν σπέρμα
  choice: البذار الجيد
  rationale: تدل καλόν هنا على الجودة والصلاح، و«البذار» اسم جمع يلائم الاستعمال الجمعي للمفرد اليوناني σπέρμα.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: هذا هو اللقب الإنجيلي الراسخ، ويحفظ صلته بدانيال 7 وما يحمله من أصداء مسيانية وأخروية.
theological_decisions:
- issue: ترجمة اللقب المسيحاني ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: أُبقي اللقب التقليدي لأنه لا يشير هنا إلى إنسان بوجه عام فحسب، بل يستحضر أيضًا صورة دانيال 7 واستعمال يسوع المميز لهذا اللقب، مع ذكر البديل في الحاشية دون فرض تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «البذار» بوصفه اسم جمع طبيعيًا، وحُذف التكرار الاصطلاحي في «أجاب وقال» لصالح صياغة عربية سلسة، مع الحفاظ على لقب «ابن الإنسان».
