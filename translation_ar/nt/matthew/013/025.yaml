id: MAT.13.25
reference: Matthew 13:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: ar
  text: وبينما كان الناس نيامًا، جاء عدوُّه وزرع زُؤانًا بين القمح ثم مضى.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: الناس
  rationale: تشير العبارة في السياق إلى الأشخاص الموجودين، أي عمّال الحقل، لا إلى الذكور بوصفهم ذكورًا؛ و«الناس» عربية طبيعية وتحفظ عموم اللفظ اليوناني.
- source_word: καθεύδειν
  choice: كان ... نيامًا
  rationale: صياغة عربية طبيعية تؤدي معنى النوم الجاري في ذلك الوقت ضمن التركيب الزمني.
- source_word: ὁ ἐχθρός
  choice: عدوُّه
  rationale: يحفظ التعريف وضمير الملكية كما في النص اليوناني، حيث المقصود عدو صاحب الحقل.
- source_word: ἐπέσπειρεν
  choice: زرع
  rationale: ينقل فعل نثر البذار وزرعها بوضوح؛ ودلالة الإضافة أو البذر فوق ما زُرع سابقًا تظهر من السياق ومن عبارة «بين القمح».
- source_word: ζιζάνια
  choice: زُؤانًا
  rationale: اسم معروف لعشب ضار يشبه القمح في طور نموه، وهو أدق من اللفظ العام «أعشابًا ضارة» في هذا المثل.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: بين القمح
  rationale: تعبير عربي موجز وطبيعي يؤدي معنى البذر في وسط القمح وبين نباتاته.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: ينقل معنى الانصراف بعد إتمام الفعل بأسلوب عربي رشيق.
theological_decisions:
- issue: هوية «الناس» النائمين
  choice: الإبقاء على التعبير العام «الناس» دون تحديد أنهم خدم أو عمال
  alternative: الرجال / العمال
  rationale: النص اليوناني يقول ἀνθρώπους ولا يحدد صفتهم هنا؛ لذلك لا ينبغي إدخال تحديد تفسيري غير مصرح به.
- issue: نوع الزؤان
  choice: زُؤانًا
  alternative: أعشابًا ضارة / حشائش
  rationale: يحافظ على الصورة الزراعية الخاصة وعلى إمكان التشابه بين الزؤان والقمح، من غير تحميل اللفظ معنى رمزيًا إضافيًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «نيامًا» لانسياب العبارة، و«ثم مضى» لإبراز تعاقب الفعلين طبيعيًا. لا توجد علامات حواشٍ لأن المسودة لا تحتاج إلى حاشية نصية أو تفسيرية.
