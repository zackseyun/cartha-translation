  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: ar
  text: 'وأمّا بذورٌ أخرى فسقطت على التربة الجيدة، وكانت تُثمر: منها ما أعطى مئة ضعف، ومنها ما أعطى ستين، ومنها ما أعطى ثلاثين.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: البذار الأخرى
  rationale: صفة محايدة جمع مستعملة استعمال الاسم، وتعود في سياق المثل إلى ما بُذر؛ ذُكرت «البذار» صراحة للوضوح.
- source_word: δὲ
  choice: وأمّا
  rationale: تفيد الانتقال مع المقابلة بين هذه البذار وما سبقها من نتائج، وهي صياغة عربية طبيعية.
- source_word: ἔπεσεν
  choice: فسقطت
  rationale: يحافظ على المعنى المباشر للفعل اليوناني «سقط»، من غير استبداله بتفسير مثل «زُرعت».
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: على التربة الجيدة
  rationale: «التربة» أدق في السياق الزراعي، و«الجيدة» تنقل صلاح الأرض وخصوبتها دون زيادة تفسيرية.
- source_word: ἐδίδου καρπόν
  choice: وأخذت تُثمر
  rationale: تنقل دلالة الماضي الناقص على فعل متواصل أو متدرج، مع تعبير عربي سلس يحفظ صورة الثمر.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: بعضها مئة ضعف، وبعضها ستين، وبعضها ثلاثين
  rationale: ينقل التركيب التوزيعي اليوناني بوضوح، مع فهم «ضعفًا» في العددين التاليين من السياق تجنبًا للتكرار الثقيل.
