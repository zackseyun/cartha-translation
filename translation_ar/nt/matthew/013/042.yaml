  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ar
  text: وسيطرحونهم في أتون النار. هناك يكون البكاء وصرير الأسنان.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: يطرحون
  rationale: ينقل معنى الإلقاء بقوة في صيغة المستقبل التي يدل عليها السياق، وهو تعبير عربي فصيح وطبيعي.
- source_word: κάμινον τοῦ πυρός
  choice: أتون النار
  rationale: يحافظ على صورة الأتون وعلى تركيب الإضافة اليوناني من غير تحويله إلى مصطلح عقائدي تفسيري.
- source_word: ἐκεῖ
  choice: هناك
  rationale: مقابل مكاني مباشر وطبيعي يشير إلى الموضع المذكور توًّا.
- source_word: κλαυθμός
  choice: البكاء
  rationale: ترجمة واضحة لا تزيد في شدة اللفظ بتحويله إلى عويل.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: صرير الأسنان
  rationale: تعبير عربي كتابي مفهوم يحفظ الصورة الاصطلاحية من غير حصرها في الحزن أو الغضب وحده.
- source_word: καὶ
  choice: و
  rationale: حُفظ حرف العطف في مطلع الآية لبيان اتصالها بما قبلها.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير المفعول المتصل يعود طبيعيًا إلى الجماعة المذكورة في السياق السابق.
theological_decisions:
- issue: طبيعة صورة الدينونة في «أتون النار»
  choice: الإبقاء على الصورة الحسية كما وردت
  alternative: تفسيرها صراحةً بلفظ «الجحيم» أو توسيعها إلى «أتون النار المتقدة»
  rationale: النص يقدم استعارة حية للدينونة، والترجمة تحفظها من غير تلطيف أو إضافة تحديد عقائدي غير مصرح به.
- issue: دلالة «البكاء وصرير الأسنان»
  choice: الإبقاء على العبارة المركبة من دون تفسير شعوري أحادي
  alternative: جعل الصرير غضبًا وحده أو جعل العبارة حزنًا وحده
  rationale: قد تشمل العبارة الكرب والحزن والسخط، ولذلك ينبغي ألا تحصر الترجمة معناها في انفعال واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُعمل «أتون» لدقته في وصف فرن شديد الحرارة، مع إبقاء ترتيب الجملة قريبًا من اليونانية وطبيعيًا في العربية.
