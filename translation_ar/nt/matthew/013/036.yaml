base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: ar
  text: 'حينئذٍ ترك الجموع ودخل البيت. فتقدّم إليه تلاميذه قائلين: «اشرح لنا مَثَل الزؤان الذي في الحقل[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مَثَل الأعشاب الضارة في الحقل»؛ وقد تشير الكلمة اليونانية تحديدًا إلى الزؤان، وهو عشب يشبه القمح.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: أداة زمنية تنقل السرد إلى الحدث التالي، و«حينئذٍ» واضحة وفصيحة من غير تكلّف.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: ترك الجموع
  rationale: يحافظ على دلالة اسم الفاعل الماضي بوصف الفعل السابق للدخول، مع إبقاء جمع ὄχλοι في «الجموع».
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: دخل البيت
  rationale: يؤدي معنى الحركة إلى داخل البيت بصورة طبيعية وموجزة، ويحفظ تعريف οἰκία.
- source_word: προσῆλθον αὐτῷ
  choice: تقدّم إليه
  rationale: ينقل معنى الاقتراب المقصود من شخص، وهو أدق هنا من مجرد «جاؤوا إليه».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية طبيعية تحافظ على علاقة الإضافة والهوية من غير توسع.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ البنية الحالية التابعة للفعل الرئيس بأسلوب عربي فصيح وطبيعي.
- source_word: Διασάφησον ἡμῖν
  choice: اشرح لنا
  rationale: الأمر يطلب الإيضاح والبيان؛ و«اشرح» هو المقابل العربي الجاري والواضح.
- source_word: τὴν παραβολὴν
  choice: مَثَل
  rationale: «مَثَل» هو المصطلح العربي المألوف لهذا الجنس التعليمي في سياق الأناجيل.
- source_word: τῶν ζιζανίων
  choice: زؤان
  rationale: الزؤان نبات ضار يشبه القمح، وهو أقرب من «الأعشاب» العامة إلى الدلالة النباتية المحتملة للفظ اليوناني.
- source_word: τοῦ ἀγροῦ
  choice: الحقل
  rationale: الإضافة في «زؤان الحقل» تحافظ على تركيب المضاف إليه اليوناني بصورة عربية طبيعية.
