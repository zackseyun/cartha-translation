id: MAT.13.41
reference: Matthew 13:41
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: ar
  text: سيرسل ابن الإنسان ملائكته، فيجمعون من ملكوته كل ما يسبّب العثرة[a] والذين يمارسون مخالفة الشريعة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «كل العثرات». تشير الكلمة اليونانية إلى كل ما يجعل الناس يخطئون أو يرتدّون.'
    reason: lexical_alternative
  - marker: b
    text: 'وحرفيًا: «الذين يفعلون مخالفة الشريعة». توحي الصياغة بسلوك مستمر يميّز أصحابه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: سيرسل
  rationale: فعل مستقبل يدل على إرسال الملائكة بمهمة؛ و«سيرسل» صياغة عربية طبيعية وواضحة، ولا تحتاج دلالة التكليف هنا إلى زيادة تفسيرية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب بصيغته الراسخة، بما فيها صلته بخلفيته الرؤيوية، من غير إعادة تفسيره.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: ملائكته
  rationale: سياق الدينونة الأخروية يدل على الملائكة السماويين، لا على رسل من البشر.
- source_word: συλλέξουσιν
  choice: فيجمعون
  rationale: يناسب صورة الحصاد في سياق المثل، والفاء تربط النتيجة الطبيعية بإرسالهم.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: من ملكوته
  rationale: تنقل الإزالة من داخل نطاق ملكوته بعبارة عربية موجزة وطبيعية.
- source_word: πάντα τὰ σκάνδαλα
  choice: كل ما يسبّب العثرة
  rationale: يحفظ المعنى الفاعل للأشياء أو المؤثرات التي توقع في الخطيئة أو الارتداد، ولا يضيّقه إلى مجرد الإساءة الشعورية.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: الذين يمارسون مخالفة الشريعة
  rationale: «يمارسون» تنقل طابع الفعل المستمر أو المميّز للسلوك، و«مخالفة الشريعة» تحفظ صلة ἀνομία برفض القانون الأخلاقي بدل تعميمها إلى الشر فحسب.
theological_decisions:
- issue: ترجمة لقب ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: الصيغة المختارة تحفظ اللقب المألوف وإيحاءاته الكتابية والرؤيوية من غير حسم تفسيري زائد.
- issue: نطاق معنى σκάνδαλα في سياق الدينونة
  choice: كل ما يسبّب العثرة
  alternative: كل العثرات
  rationale: قد يشمل اللفظ أشخاصًا أو أشياء أو مؤثرات تقود إلى الخطيئة؛ لذا تحافظ الصياغة على اتساع المرجع.
- issue: دلالة ἀνομία
  choice: مخالفة الشريعة
  alternative: الإثم
  rationale: تحفظ الصياغة عنصر التعدي على الشريعة، مع عدم اختزال اللفظ في شر عام؛ ولا تحدد هنا هل المقصود شريعة موسى على وجه الحصر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ لقب «ابن الإنسان» والتصوير القضائي والحصادي، مع تجنب الألفاظ الكنسية الخاصة. وُضع مؤشر الحاشية [a] بعد العبارة التي يشرحها، لا بعد «ملائكته»، تصحيحًا لعدم تطابق موضع المؤشر في طبقة الاستشارة الإنجليزية.
