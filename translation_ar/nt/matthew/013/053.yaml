  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: ar
  text: ولمّا فرغ يسوع من هذه الأمثال، غادر ذلك المكان.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصورة أكثر حرفية: «وحدث أنه حين أتمّ يسوع هذه الأمثال، رحل من هناك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: ولمّا
  rationale: هذا تركيب سردي يربط الحدث بما قبله ويقدّم جملة زمنية؛ «ولمّا» تؤدي المعنى طبيعيًا في العربية من غير نقل حرفي ثقيل لعبارة «وحدث عندما».
- source_word: ἐτέλεσεν
  choice: فرغ من
  rationale: الفعل هنا يدل على إتمام القول وإنهائه، وتعبير «فرغ من» عربي فصيح وطبيعي يوضح سبق انتهاء الأمثال للمغادرة.
- source_word: παραβολὰς
  choice: الأمثال
  rationale: «الأمثال» هو المقابل العربي المألوف لهذا النوع من تعليم يسوع ويحافظ على دلالته الأدبية.
- source_word: ταύτας
  choice: هذه
  rationale: اسم الإشارة يحيل إلى مجموعة الأمثال الواردة مباشرة قبل هذه الآية.
- source_word: μετῆρεν
  choice: غادر
  rationale: ينقل معنى الانتقال بعيدًا عن موضع مع عدم إضافة كيفية أو وجهة غير مذكورة.
- source_word: ἐκεῖθεν
  choice: ذلك المكان
  rationale: يؤدي معنى «من هناك» في صياغة عربية واضحة، مع تجنب الثقل الناتج من الجمع بين «غادر» و«من هناك».
