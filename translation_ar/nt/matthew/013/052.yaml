id: MAT.13.52
reference: Matthew 13:52
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: ar
  text: 'فقال لهم: «لذلك، كل كاتبٍ تدرَّب من أجل ملكوت السماوات[a] يشبه ربَّ بيت[b] يُخرج من كنزه[c] أشياء جديدة وقديمة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «كل كاتبٍ صار تلميذًا لملكوت السماوات». فصيغة الفعل اليوناني قد تدل على أن الشخص صار تلميذًا، كما قد تدل على أنه تلقّى التعليم أو التدريب؛ كما أن علاقته بالملكوت يمكن فهمها بمعنى «من أجل» أو «في ما يخص».'
    reason: alternative_reading
  - marker: b
    text: 'أي: ربّ الأسرة أو رئيس أهل البيت.'
    reason: lexical_alternative
  - marker: c
    text: قد تشير كلمة «الكنز» أيضًا إلى مخزن أو خزانة تُحفَظ فيها الأشياء النفيسة ثم تُخرَج منها.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لذلك
  rationale: أداة استنتاج عربية طبيعية تحفظ الصلة المنطقية بما سبق.
- source_word: πᾶς γραμματεὺς
  choice: كل كاتبٍ
  rationale: يحفظ المعنى المباشر لكلمة γραμματεύς، من غير حصره في دور فقهي أضيق.
- source_word: μαθητευθεὶς
  choice: تدرَّب
  rationale: ينقل معنى التكوين والتعليم في صيغة المبني للمجهول اليونانية بأسلوب عربي طبيعي، مع إثبات دلالة التلمذة المحتملة في الحاشية.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: من أجل ملكوت السماوات
  rationale: يعبّر عن توجّه التدريب إلى الملكوت أو ارتباطه به، مع تجنب حسم وظيفة المجرور اليوناني غير المألوفة أكثر مما يسمح به النص.
- source_word: ὅμοιός ἐστιν
  choice: يشبه
  rationale: صياغة عربية واضحة ومألوفة للتشبيه.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ربَّ بيت
  rationale: ينقل دور صاحب السلطة على البيت بعبارة عربية موجزة ومفهومة، من غير اختزاله في مجرد مالك للعقار.
- source_word: ἐκβάλλει
  choice: يُخرج
  rationale: يناسب سياق إخراج الموجودات من موضع حفظها، ولا يوحي بالطرد أو العنف.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: من كنزه
  rationale: يحفظ دلالتي القيمة والمخزون في θησαυρός، مع بيان احتمال معنى المخزن في الحاشية.
- source_word: καινὰ καὶ παλαιά
  choice: أشياء جديدة وقديمة
  rationale: يصرّح بالموصوف المحذوف الذي تدل عليه الصفتان المحايدتان في اليونانية، ويحفظ ترتيبهما.
theological_decisions:
- issue: دلالة μαθητευθεὶς وصلتها بالكاتب والملكوت
  choice: كاتب تدرَّب من أجل ملكوت السماوات
  alternative: كاتب صار تلميذًا لملكوت السماوات
  rationale: المتن يحفظ معنى التعليم والتكوين، والحاشية تصون احتمال التلمذة الصريح؛ وبذلك لا يُحصر الكلام في الاهتداء وحده ولا في التعليم المهني وحده.
- issue: دلالة οἰκοδεσπότης في التشبيه
  choice: ربّ بيت
  alternative: ربّ أسرة أو رئيس أهل البيت
  rationale: يحفظ معنى الإشراف والسلطة داخل البيت من غير استنتاجات اجتماعية أو عقائدية زائدة.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُعملت «ربّ بيت» بمعناها الأسري والإداري المألوف، ووُضعت علامات الحواشي بجوار الألفاظ التي تشرحها.
