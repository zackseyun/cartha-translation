  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: ar
  text: وأيضًا، يشبه ملكوت السماوات تاجرًا[a] يبحث عن لآلئ نفيسة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إنسانًا تاجرًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: وأيضًا
  rationale: تقدّم تشبيهًا آخر ضمن سلسلة أمثال الملكوت، وتحافظ على ترابط السياق بعبارة عربية طبيعية.
- source_word: ὁμοία ἐστὶν
  choice: يشبه
  rationale: صياغة عربية موجزة ومألوفة للتشبيه، وتحافظ على كون ملكوت السماوات طرف التشبيه.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تنقل تعبير متّى المميز بصياغة عربية راسخة، وتحافظ على صيغة الجمع في τῶν οὐρανῶν.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: تاجرًا
  rationale: لفظ «تاجر» يبيّن هوية الشخص بوضوح، فلا يلزم تكرار «إنسان» في المتن، مع إثبات الصياغة الأقرب إلى الحرفية في الحاشية.
- source_word: ζητοῦντι
  choice: يبحث عن
  rationale: ينقل نشاط التاجر المستمر بلغة عربية واضحة وطبيعية.
- source_word: καλοὺς μαργαρίτας
  choice: لآلئ نفيسة
  rationale: تنقل معنى الجودة والامتياز الذي يحمله καλός في السياق التجاري، من غير قصر الوصف على الجمال الظاهري.
theological_decisions:
- issue: نطاق التشبيه في صيغة المثل
  choice: يُقارَن ملكوت السماوات بالتاجر مباشرةً بحسب التركيب اليوناني.
  alternative: أن يكون التشبيه بالمشهد كله، أي بتاجر يبحث عن لآلئ نفيسة.
  rationale: يجعل تركيب ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ التاجرَ الطرف المباشر للتشبيه، لكن الموقف الأوسع يتكشف في سياق المثل؛ لذلك لا يضيف النص تفسيرًا يحصر دلالة التشبيه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت صيغة «يشبه ملكوت السماوات» المألوفة في لغة الأمثال، مع تجنب التكرار غير الطبيعي في المتن وإبقائه في الحاشية.
