review_pass:
  verdict: revise
  source_fidelity: النص اليوناني في SBLGNT يقرأ ἀπὸ καταβολῆς فقط («منذ/من التأسيس») من دون τοῦ κόσμου («العالم»). لذلك لا يصح إدخال «العالم» في المتن، حتى لو بدا التعبير الاصطلاحي المألوف أوضح. كما أن «لكي يتم ما قيل على لسان النبي» ينقل صيغة الإتمام ووساطة διά τοῦ προφήτου نقلًا سليمًا.
  naturalness: الصياغة عربية فصحى واضحة. واستبدال «بأمثال» بـ«في أمثال» أوثق بالتركيب اليوناني وأشد سلاسة في هذا السياق، و«أتفوه بأمور خفية» تؤدي ἐρεύξομαι أداءً شعريًا مفهومًا وأقرب إلى معنى الإفصاح/التفوه من «أنطق بأمور».
  terminology: «النبي» صحيح، إذ لا يذكر النص اليوناني اسمًا. و«أمور خفية» تحافظ على عدم تفسير κεκρυμμένα بأنها «أسرار». و«التأسيس» ترجمة مناسبة لـκαταβολή مع إبقاء الإضافة التقليدية «العالم» في الحاشية بوصفها قراءة مخطوطية.
