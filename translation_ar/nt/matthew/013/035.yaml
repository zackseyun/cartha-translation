base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: ar
  text: 'لِكَيْ يَتِمَّ ما قيل على لسان النبي القائل: «سأفتح فمي في أمثال، وأتفوه بأمور خفية منذ التأسيس[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «منذ تأسيس العالم».'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: لِكَيْ يَتِمَّ
  rationale: تنقل الغاية/النتيجة في صيغة متى الخاصة بإتمام النبوة، بعبارة عربية واضحة وطبيعية.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: ما قيل على لسان النبي
  rationale: «على لسان» تعبير عربي طبيعي يحفظ معنى الوساطة في διά مع المضاف إليه، دون أن يوحي بأن النبي هو المصدر النهائي للكلام.
- source_word: λέγοντος
  choice: القائل
  rationale: يحفظ اسم الفاعل الذي يقدّم الاقتباس، ويتوافق نحويًا مع «النبي».
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: سأفتح فمي بأمثال
  rationale: يحفظ الصورة الشعرية وصيغة المستقبل، ويؤدي ἐν استعمالًا بأداة عربية طبيعية.
- source_word: ἐρεύξομαι
  choice: أنطق
  rationale: ينقل معنى إخراج الكلام والتفوه به بلفظ عربي فصيح مفهوم، من غير مبالغة تفسيرية مثل «أعلن».
- source_word: κεκρυμμένα
  choice: بأمور مخفية
  rationale: يحفظ كون اسم المفعول مستعملًا استعمال الاسم، وكذلك دلالة الحالة الناتجة في صيغة التمام اليونانية.
- source_word: ἀπὸ καταβολῆς
  choice: منذ تأسيس العالم
  rationale: «التأسيس» يحفظ استعارة καταβολή، وإضافة «العالم» توضّح المصطلح الاصطلاحي الذي يدل عليه السياق، مع توثيق غياب κόσμου في نص SBLGNT في الحاشية.
theological_decisions:
- issue: تحديد النبي مصدر الاقتباس
  choice: النبي
  alternative: آساف النبي / تسمية نبي بعينه
  rationale: النص اليوناني المعطى لا يسمّي النبي، لذلك لا تُضاف هوية تفسيرية أو نصية غير واردة.
- issue: مدى العبارة ἀπὸ καταβολῆς
  choice: منذ تأسيس العالم
  alternative: منذ التأسيس
  rationale: الإضافة تجعل الاصطلاح مفهومًا وطبيعيًا بالعربية، لكنها تُعرض بوصفها إيضاحًا دلاليًا لا كلمة يونانية صريحة؛ لذلك تُذكر حقيقة النص في الحاشية حفاظًا على الشفافية والغموض النصي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. حُفظت الصورة الشعرية في «سأفتح فمي»، واستُعملت «على لسان النبي» لصياغة عربية طبيعية لمعنى الوساطة.
