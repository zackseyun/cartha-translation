  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: ar
  text: 'دَعوهما ينموان معًا إلى الحصاد، وفي وقت الحصاد أقول للحصّادين: «اجمعوا أولًا الزؤان[a] واربطوه حُزَمًا لكي يُحرَق، أمّا القمح فاجمعوه إلى مخزني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: الأعشاب الضارة؛ والزؤان نبات ضار يشبه القمح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: دَعوهما
  rationale: فعل أمر يفيد السماح هنا، والضمير المثنى يستبق «كلاهما» اليونانية طبيعيًا في العربية.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: ينموان معًا
  rationale: يحفظ معنى النمو المشترك وإحالة ἀμφότερα إلى النباتين مع الاستفادة من صيغة المثنى العربية.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: إلى الحصاد
  rationale: تعبير عربي واضح يحفظ بلوغ الحد الزمني المحدد للحصاد.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: في وقت الحصاد
  rationale: يقابل العبارة اليونانية عن وقت الحصاد دون زيادة تفسيرية.
- source_word: τοῖς θερισταῖς
  choice: للحصّادين
  rationale: المقابل الزراعي المباشر والدقيق لفاعلي الحصاد.
- source_word: Συλλέξατε πρῶτον
  choice: اجمعوا أولًا
  rationale: يحفظ فعل الجمع وترتيب العمل الذي تدل عليه πρῶτον.
- source_word: τὰ ζιζάνια
  choice: الزؤان
  rationale: اسم عربي معروف للنبات الضار الذي يشبه القمح، وهو أدق من اللفظ العام «الأعشاب الضارة»؛ وتوضح الحاشية معناه.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: اربطوه حُزَمًا
  rationale: صياغة عربية طبيعية تحافظ على فعل الربط وتكوين الحزم، مع ضمير مفرد جمعي عائد إلى الزؤان.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: لكي يُحرَق
  rationale: يحفظ دلالة الغرض وقوة فعل الإحراق، من غير استباق للتفسير الأخروي للصورة.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: أمّا القمح فاجمعوه إلى مخزني
  rationale: «أمّا... فـ» تُظهر المقابلة التي تؤديها δέ، و«مخزني» مقابل واضح لموضع حفظ الغلال.
theological_decisions:
- issue: الصورة المَثَلية للفصل النهائي
  choice: الإبقاء على لغة الحصاد والجمع والإحراق كما وردت في المثل
  alternative: التصريح بأن الكلام عن الدينونة النهائية أو الهلاك
  rationale: الآية تعرض الصورة الزراعية، ويأتي تفسيرها لاحقًا في الإصحاح؛ لذلك لا ينبغي إدخال التفسير في نص المثل نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم المثنى في «دَعوهما ينموان» مراعاةً لمرجعي الفعل، وحُفظت المقابلة بين الزؤان والقمح دون توسع تفسيري.
