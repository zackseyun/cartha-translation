  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: ar
  text: «وأيضًا، يشبه ملكوت السماوات شبكةَ جرٍّ[a] أُلقيت في البحر وتجمع من كل نوع[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شبكة»؛ واللفظة اليونانية تشير تحديدًا إلى شبكة كبيرة تُجر في الماء.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تجمع من كل نوع»؛ والمقصود أنواع السمك مفهوم من صورة الصيد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: وأيضًا
  rationale: تفيد الانتقال إلى مثل آخر في السلسلة، وهي صياغة عربية طبيعية موجزة.
- source_word: ὁμοία ἐστὶν
  choice: يشبه
  rationale: ينقل صيغة التشبيه بوضوح وطبيعية، مع جعل «ملكوت السماوات» موضوع المقارنة.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: يحفظ التعبير المتّاوي المميز بصيغته المعروفة، من غير استبداله بـ«ملكوت الله» أو تفسيره بـ«حكم السماوات».
- source_word: σαγήνῃ
  choice: شبكة جرّ
  rationale: اللفظة اليونانية تدل على شبكة كبيرة تُجر في الماء، لا على شبكة صيد عامة فحسب.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: أُلقيت في البحر
  rationale: ترجمة مباشرة للمبني للمجهول وللفظ «البحر»، من غير تحويله إلى «البحيرة».
- source_word: καὶ ἐκ παντὸς γένους συναγαγούσῃ
  choice: فجمعت من كل نوع
  rationale: يحفظ غياب المفعول الصريح في اليونانية ولا يضيف «سمكًا» إلى المتن، مع بقاء المقصود مفهومًا من صورة الصيد.
theological_decisions:
- issue: دلالة «ملكوت السماوات»
  choice: الإبقاء على «ملكوت السماوات»
  alternative: ملكوت الله؛ حكم السماوات
  rationale: يحفظ عبارة متّى الخاصة ولا يحسم دلالتها بإعادة صياغة تفسيرية.
- issue: المفعول المحذوف في «جمعت»
  choice: الإبقاء عليه غير مصرّح به في المتن
  alternative: فجمعت سمكًا من كل نوع
  rationale: النص اليوناني لا يذكر «السمك» صراحة، وإن كان مفهومًا بوضوح من صورة الشبكة؛ لذلك تُحفظ هذه السمة مع إيضاحها في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «شبكة جرّ» للدقة المعجمية، وحُفظ إيجاز الأصل وحذف المفعول فيه، مع وضع علامتي الحاشية في موضعهما من المتن.
