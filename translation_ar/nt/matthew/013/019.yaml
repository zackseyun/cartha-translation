id: MAT.13.19
reference: Matthew 13:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: ar
  text: 'متى 13:‏19


    كلُّ من يسمع كلمة الملكوت ولا يفهمها، يأتي الشرير[a] ويختطف ما زُرع في قلبه. فهذا هو المزروع بجانب الطريق[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: الخبيث.'
    reason: بديل معجمي لـ ὁ πονηρός يحافظ كذلك على الدلالة الشخصية.
  - marker: b
    text: 'أو: بمحاذاة الطريق، أو: على جانب الطريق.'
    reason: بدائل عربية ممكنة لحرف الجر παρά مع الطريق، من غير تغيير صورة المثل.
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: كلُّ من يسمع
  rationale: ينقل المعنى العام التوزيعي للتركيب اليوناني بصياغة عربية طبيعية، من غير تقييده بزمن واحد.
- source_word: λόγον τῆς βασιλείας
  choice: كلمة الملكوت
  rationale: يحافظ على لفظ «الكلمة» وعلى صورة البذار في المثل، مع بقاء الإضافة اليونانية كما هي من غير حسمها إلى «عن الملكوت».
- source_word: μὴ συνιέντος
  choice: ولا يفهمها
  rationale: الفعل يدل على الفهم وإدراك المعنى، والضمير المؤنث يعود طبيعيًا في العربية إلى «كلمة».
- source_word: ὁ πονηρὸς
  choice: الشرير
  rationale: أداة التعريف والسياق يرجحان الإشارة إلى فاعل شخصي شرير، من غير تسميته بما يتجاوز نص الآية.
- source_word: ἁρπάζει
  choice: يختطف
  rationale: ينقل معنى الأخذ السريع والقسري الكامن في الفعل اليوناني.
- source_word: τὸ ἐσπαρμένον
  choice: ما زُرع
  rationale: يحافظ على المبني للمجهول وعلى الاستعمال الاسمي لاسم المفعول، بصياغة عربية موجزة.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: في قلبه
  rationale: ترجمة مباشرة تحفظ لفظ «القلب» والضمير المفرد في الأصل.
- source_word: οὗτός ἐστιν
  choice: فهذا هو
  rationale: يقدّم تعيين يسوع لصاحب الحالة مع ربط طبيعي بما سبق.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: المزروع بجانب الطريق
  rationale: يحفظ الاستعارة اللافتة في اليونانية، إذ يوصف الشخص نفسه بأنه «المزروع»، بدل تفسيرها صراحةً على أنها التربة أو البذرة.
theological_decisions:
- issue: هوية ὁ πονηρὸς
  choice: 'فاعل شخصي: «الشرير»'
  alternative: 'معنى مجرد: «الشر»؛ أو وصف شخصي آخر: «الخبيث»'
  rationale: السياق يصوّر من يأتي ويختطف الكلمة كفاعل شخصي، لكن الترجمة لا تضيف اسمًا خاصًا غير مذكور في الآية.
- issue: العلاقة بين السامع والبذار في العبارة الختامية
  choice: «هذا هو المزروع بجانب الطريق»
  alternative: صياغة تفسيرية مثل «هذا هو الذي يمثله البذار المزروع بجانب الطريق»
  rationale: يحافظ الاختيار على الانتقال الاستعاري والتوتر النحوي في الأصل، حيث يدل اسم المفعول المذكر على الشخص مع بقاء صورة الزرع.
- issue: الضمير في αὐτοῦ
  choice: «قلبه» بالمفرد المذكر التمثيلي
  alternative: «قلبهم» أو حذف الضمير
  rationale: يعكس الضمير اليوناني المفرد، بينما تفيد «كل من» شمول الحكم لكل شخص.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعملت «كلمة الملكوت» للمحافظة على ترابط الكلمة بالبذار، و«المزروع» للمحافظة على استعارة الأصل بدل شرحها داخل المتن.
