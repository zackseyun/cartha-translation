  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: ar
  text: فكما تُجمع الأعشاب الضارة[a] وتُحرَق بالنار، هكذا يكون في نهاية العصر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الأعشاب المؤذية، ويُرجَّح أن المقصود هو الزؤان، وهو نبات ضار يشبه القمح في أول نموه.
    reason: lexical_alternative
  - marker: b
    text: أو «نهاية العالم»؛ واليونانية «نهاية العصر».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: فإذًا، كما
  rationale: تحفظ «كما» أداة التشبيه، وتنقل «فإذًا» دلالة الاستنتاج والارتباط بما سبق.
- source_word: συλλέγεται
  choice: تُجمع
  rationale: فعل مبني للمجهول يلائم صورة جمع الأعشاب تمهيدًا لإحراقها. وجاء مفردًا مؤنثًا وفق المطابقة العربية الطبيعية مع جمع غير العاقل.
- source_word: τὰ ζιζάνια
  choice: الأعشاب الضارة
  rationale: تعبير واضح معاصر يدل على الأعشاب المؤذية المقصودة في المثل، من غير إلزام القارئ بالتحديد النباتي المرجح، وهو الزؤان.
- source_word: πυρὶ καίεται
  choice: تُحرق بالنار
  rationale: يحفظ الفعل البسيط والإشارة الصريحة إلى النار، وتنقل الباء الدلالة الآلية المحتملة لحالة المجرور اليونانية.
- source_word: οὕτως ἔσται
  choice: هكذا يكون
  rationale: صياغة عربية موجزة تحفظ المقابلة ومرجعية الفعل المستقبلية في السياق.
- source_word: ἐν τῇ συντελείᾳ
  choice: عند انقضاء
  rationale: «انقضاء» ينقل معنى بلوغ الشيء نهايته واكتماله، و«عند» طبيعية للدلالة الزمنية هنا.
- source_word: τοῦ αἰῶνος
  choice: العصر
  rationale: يحفظ المعنى الزمني لـαἰών ولا يحوله إلى إشارة صريحة إلى الكون المادي.
theological_decisions:
- issue: العبارة الأخروية τοῦ αἰῶνος
  choice: انقضاء العصر
  alternative: نهاية العالم
  rationale: اختيار «العصر» يحفظ البعد الزمني والأخروي للنص من غير مساواته بزوال العالم المادي، ومن غير فرض تصور تفصيلي لنهاية الأزمنة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. وُضعت علامتا الحاشيتين بجوار اللفظين اللذين تشرحانهما مباشرة، مع الحفاظ على بنية التشبيه والاستنتاج في الأصل.
