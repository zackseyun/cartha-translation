  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: ar
  text: ولكن لا أصل له في نفسه، بل لا يدوم إلا إلى حين. فإذا حدث ضيق أو اضطهاد بسبب الكلمة، يتعثر من فوره[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يسقط» أو «ينفر»؛ قد يدل الفعل اليوناني على التعثر أو النفور وأخذ موقف سلبي.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: أصل
  rationale: يحافظ على صورة الجذر الزراعية في المثل، واستعمال «لا أصل له» عربي طبيعي وواضح.
- source_word: ἐν ἑαυτῷ
  choice: في نفسه
  rationale: ترجمة مباشرة تحفظ دلالة الضمير الانعكاسي والمعنى الداخلي من غير تفسير زائد.
- source_word: πρόσκαιρός
  choice: لا يدوم إلا إلى حين
  rationale: صياغة عربية طبيعية تفيد قِصر البقاء، وتتجنب وصف الشخص بلفظ «مؤقت» غير المألوف في هذا السياق.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: فإذا حدث ضيق أو اضطهاد
  rationale: تنقل تركيب المضاف المطلق بوصفه ظرفًا زمنيًا، وتحافظ على جدية الضيق ودقة معنى الاضطهاد.
- source_word: διὰ τὸν λόγον
  choice: بسبب الكلمة
  rationale: تحفظ الصلة اللفظية بكلمة λόγος في المثل، مع بقاء الإشارة إلى الرسالة المعلنة مفهومة من السياق.
- source_word: εὐθὺς
  choice: من فوره
  rationale: تعبير عربي فصيح معاصر ينقل معنى السرعة والمباشرة.
- source_word: σκανδαλίζεται
  choice: يتعثر
  rationale: يحفظ صورة العثرة واتساع الفعل اليوناني، بينما يوضح السياق أن المقصود انهياره عند التعرض للضغط.
theological_decisions:
- issue: دلالة σκανδαλίζεται في سياق التلمذة والمثل
  choice: يتعثر
  alternative: يسقط أو يرتد
  rationale: «يتعثر» يحافظ على الصورة الأصلية وعلى اتساع الدلالة، فلا يحسم ما إذا كان الفعل يعني السقوط النهائي أو النفور أو الانهيار تحت الضغط. وتُذكر البدائل السياقية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُسّمت الآية إلى جملتين لسهولة القراءة، مع إبقاء العلاقة الزمنية والسببية بواسطة «فإذا». استُعمل «لا يدوم إلا إلى حين» بدل «هو مؤقت» طلبًا للطبيعية.
