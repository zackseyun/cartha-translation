  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: ar
  text: ولم يصنع هناك أعمالًا عظيمة كثيرة بسبب عدم إيمانهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «معجزات كثيرة»، أو: «أعمال قوة كثيرة». تشير الكلمة اليونانية إلى أفعال تُظهر القدرة، وهي في هذا السياق أعمال معجزية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: ولم يصنع
  rationale: تحافظ الواو على استمرارية السرد، وينقل «لم يصنع» الفعل العام ποιέω مع النفي، من غير أن يوحي بالعجز.
- source_word: ἐκεῖ
  choice: هناك
  rationale: ظرف مكان مباشر يشير إلى موطنه المذكور في السياق.
- source_word: δυνάμεις πολλὰς
  choice: أعمالًا عظيمة كثيرة
  rationale: يدل δυνάμεις في هذا السياق على أعمال تظهر القدرة؛ وتحفظ «أعمالًا عظيمة» معنى أفعال القوة من غير اختزاله في المصطلح التفسيري «معجزات»، بينما تنقل «كثيرة» πολλὰς.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: بسبب عدم إيمانهم
  rationale: تفيد διά مع النصب السببية هنا، و«عدم إيمانهم» تعبير عربي واضح ينقل ἀπιστία بوصفها غياب الإيمان أو رفضه.
theological_decisions:
- issue: هل تفيد العبارة عجزه عن صنع الأعمال أم مجرد أنه لم يصنعها؟
  choice: ولم يصنع هناك أعمالًا عظيمة كثيرة
  alternative: ولم يستطع أن يصنع هناك معجزات كثيرة
  rationale: يقول النص اليوناني οὐκ ἐποίησεν، أي «لم يصنع»، ولا يستعمل تعبيرًا عن عدم الاستطاعة. لذلك تُحفظ دلالة الفعل كما هي من غير إضافة دعوى العجز.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أعمالًا عظيمة» لصياغة طبيعية تحافظ على صلة اللفظ اليوناني بالقوة، مع بيان البدائل في الحاشية.
