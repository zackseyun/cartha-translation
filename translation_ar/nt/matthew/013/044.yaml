id: MAT.13.44
reference: Matthew 13:44
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: ar
  text: «يُشْبِهُ مَلَكُوتُ السَّمَاوَاتِ كَنْزًا مَخْفِيًّا فِي حَقْلٍ[a]، وَجَدَهُ رَجُلٌ فَأَخْفَاهُ، وَمِنْ فَرَحِهِ[b] يَذْهَبُ وَيَبِيعُ كُلَّ مَا لَهُ، وَيَشْتَرِي ذَلِكَ الْحَقْلَ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَلَكُوتُ السَّمَاوَاتِ مِثْلُ كَنْزٍ مَخْفِيٍّ فِي حَقْلٍ».'
    reason: بديل تركيبي يحفظ إمكان إسناد التشبيه مباشرة إلى الملكوت أو صياغته بجملة اسمية.
  - marker: b
    text: 'أو: «وبسبب فرحه يذهب ويبيع كل ما يملك».'
    reason: يبين القوة السببية لعبارة ἀπὸ τῆς χαρᾶς αὐτοῦ.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: يُشْبِهُ
  rationale: صيغة عربية طبيعية للمقارنة في الأمثال، تحفظ التشبيه من غير حرفية ثقيلة.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: مَلَكُوتُ السَّمَاوَاتِ
  rationale: تعبير عربي راسخ يحفظ الصيغة المتّية وصيغة الجمع في οὐρανῶν، مع بقاء معنى سلطان الله وملكوته مفتوحًا بحسب السياق.
- source_word: θησαυρῷ
  choice: كَنْزًا
  rationale: النكرة ملائمة لبنية التشبيه، إذ المقصود كنز غير معيّن.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: مَخْفِيًّا فِي حَقْلٍ
  rationale: «مخفيًّا» ينقل حالة الكنز الناتجة عن إخفائه، و«في حقل» أنسب لسياق المثل من تعريف الحقل منذ أول ذكر.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: وَجَدَهُ رَجُلٌ
  rationale: ترتيب عربي واضح يحفظ عائد الضمير إلى الكنز، ويترجم الشخصية الذكورية المفردة في السرد.
- source_word: ἔκρυψεν
  choice: فَأَخْفَاهُ
  rationale: الفعل المتعدي مع الضمير يزيل أي التباس في العربية ويعبّر عن الحدث السردي البسيط.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: وَمِنْ فَرَحِهِ
  rationale: 'يحفظ صورة حرف الجر وقوة السببية معًا: كان فرحه هو الدافع إلى ما فعل.'
- source_word: ὑπάγει
  choice: يَذْهَبُ
  rationale: المضارع العربي يحافظ على المضارع السردي الحي في اليونانية من غير زيادة معنى المغادرة.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: وَيَبِيعُ كُلَّ مَا لَهُ
  rationale: صياغة عربية موجزة وطبيعية تحفظ شمول العبارة اليونانية.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: وَيَشْتَرِي ذَلِكَ الْحَقْلَ
  rationale: «ذلك» ينقل اسم الإشارة ويؤكد أن المقصود هو الحقل المحدد الذي وُجد فيه الكنز.
theological_decisions:
- issue: دلالة βασιλεία
  choice: مَلَكُوت
  alternative: حُكْم أو سُلْطَان
  rationale: «ملكوت» يحفظ التعبير المتّي المألوف ولا يحصر اللفظة في معنى المجال أو في فعل الحكم وحده.
- issue: هوية ἄνθρωπος من جهة الجنس
  choice: رَجُل
  alternative: إِنْسَان أو شَخْص
  rationale: السرد يقدم شخصية ذكورية مفردة، و«رجل» أوضح في العربية ولا يبدل صورة المثل.
- issue: القيمة الأخلاقية لإخفاء الكنز وشراء الحقل
  choice: ترجمة السرد من غير تعليق يبرر الفعل أو يدينه
  alternative: إضافة تفسير أخلاقي للفعل
  rationale: النص يبرز قيمة الملكوت وفرح الواجد وتضحيته، لكنه لا يقدّم هنا حكمًا صريحًا على قانونية المعاملة؛ لذلك لا ينبغي للترجمة أن تحسم هذه المسألة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع ضبط كامل للنص الرئيس. استُخدم «ملكوت السماوات» بوصفه التعبير المتّي المألوف، وحوفظ على إيقاع المضارع السردي في الأفعال الأخيرة.
