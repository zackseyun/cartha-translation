  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: ar
  text: وأمّا المزروع على الأرض الصخرية[a]، فهو الذي يسمع الكلمة ويقبلها في الحال بفرح،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أكثر حرفية: «المزروع على المواضع الصخرية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: وأمّا المزروع على الأرض الصخرية
  rationale: تحافظ الصياغة على صورة «المزروع» المضغوطة في اليونانية، وتستعمل «وأمّا» للانتقال الخفيف الذي تؤديه δέ، مع تعبير عربي طبيعي عن نوع الأرض.
- source_word: πετρώδη
  choice: الأرض الصخرية
  rationale: يدل اللفظ على مواضع أو تربة كثيرة الصخر؛ و«الأرض الصخرية» واضحة وطبيعية وتحفظ الصورة الزراعية.
- source_word: σπαρείς
  choice: المزروع
  rationale: اسم مفعول موجز يحفظ المبني للمجهول والاستعارة الزراعية في صيغة اسمية كما في الأصل.
- source_word: οὗτός ἐστιν
  choice: فهو
  rationale: تؤدي معنى التعريف المباشر في العبارة اليونانية بسلاسة عربية، من غير إضافة تفسير مثل «يرمز إلى».
- source_word: ὁ τὸν λόγον ἀκούων
  choice: الذي يسمع الكلمة
  rationale: تحويل اسم الفاعل إلى جملة موصولة هو الأسلوب العربي الطبيعي، مع إبقاء «الكلمة» حفاظًا على التعبير الموضوعي في السياق.
- source_word: εὐθὺς
  choice: في الحال
  rationale: تعبير فصيح واضح ينقل معنى الاستجابة الفورية.
- source_word: μετὰ χαρᾶς
  choice: بفرح
  rationale: صياغة عربية طبيعية تحافظ على الاسم «فرح» بدل تحويله إلى حال مشتقة.
- source_word: λαμβάνων αὐτόν
  choice: ويقبلها
  rationale: «يقبل» مناسب دلاليًا لاستقبال الكلمة وقبولها في هذا السياق، والضمير المؤنث يعود بوضوح إلى «الكلمة».
theological_decisions:
- issue: مرجع «المزروع» في تفسير المثل
  choice: الإبقاء على الصياغة المجازية «المزروع... فهو الذي يسمع»
  alternative: «البذار المزروع على الأرض الصخرية يرمز إلى الشخص الذي...»
  rationale: الأصل اليوناني يضغط الصورة، فيصف «المزروع» ثم يعرّفه بأنه السامع. تحافظ الترجمة على هذا التوتر المجازي ولا تحسمه بإعادة صياغة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وأمّا... فهو» لبناء جملة طبيعية، مع الحفاظ على الاستعارة الزراعية والتوازي بين «المزروع» و«الذي يسمع».
