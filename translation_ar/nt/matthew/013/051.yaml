  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: ar
  text: '«هل فهمتم[a] هذا كله؟» قالوا له: «نعم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هل تفهمون هذا كله؟»'
    reason: بديل معجمي وزمني ممكن؛ فصيغة المضارع ممكنة في العربية، مع أن «هل فهمتم» أقرب إلى دلالة الفعل اليوناني في هذا السياق.
lexical_decisions:
- source_word: Συνήκατε
  choice: هل فهمتم
  rationale: الفعل ماضٍ في اليونانية (أوريست) وموجَّه إلى جماعة؛ وصيغة «هل فهمتم» تنقل بصورة طبيعية فعل الفهم المتحقق حتى هذه اللحظة، مع إبقاء «هل تفهمون» احتمالًا دلاليًا في الحاشية.
- source_word: ταῦτα πάντα
  choice: هذا كله
  rationale: تعبير عربي طبيعي واضح يحيل إجمالًا إلى ما سبق من أمثال وتعاليم، وينقل شمول العبارة اليونانية من غير إضافة تفسيرية.
- source_word: λέγουσιν αὐτῷ
  choice: فقالوا له
  rationale: المضارع اليوناني هنا مضارع تاريخي في سياق السرد؛ لذلك نُقل بالماضي العربي الطبيعي، مع إبقاء الضمير غير المسمّى كما في الأصل.
- source_word: Ναί
  choice: نعم
  rationale: تنقل أداة الإيجاب اليونانية وحدها من غير إضافة لقب غير موجود في النص.
theological_decisions:
- issue: هل يُوسَّع جواب التلاميذ بإضافة لقب توقيري؟
  choice: 'الإبقاء على الجواب البسيط: «نعم».'
  alternative: «نعم، يا رب».
  rationale: النص اليوناني لا يتضمن سوى أداة الإيجاب Ναί؛ وإضافة لقب توقيري تستورد مضمونًا تعبديًا غير وارد في المصدر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة من غير تكلّف. استُخدم الماضي في السرد، وصيغ السؤال والجواب بعبارة مألوفة موجزة. وُضعت علامة الحاشية في موضع الفعل الذي تتعلق به.
