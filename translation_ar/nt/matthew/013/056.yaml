  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: ar
  text: أوليست أخواته كلهن بيننا؟ فمن أين له إذن كل هذه الأمور؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قريباته». غير أن الكلمة اليونانية تعني عادةً «أخوات» هنا، وقد فسّرها بعضهم بمعنى أوسع على ضوء مناقشات لاهوتية لاحقة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: أخواته
  rationale: المعنى العائلي المعتاد للكلمة يلائم حديث أهل البلدة عن أسرة يسوع، وهو أبسط من توسيعها إلى قريبات.
- source_word: οὐχὶ πᾶσαι
  choice: أوليست... كلهن
  rationale: صيغة سؤال بلاغي تتوقع جوابًا بالإيجاب، وتحافظ «كلهن» على توكيد الشمول.
- source_word: πρὸς ἡμᾶς
  choice: بيننا
  rationale: تفيد العبارة وجودهن في جماعة المتكلمين، و«بيننا» عربية طبيعية في هذا السياق.
- source_word: πόθεν οὖν
  choice: فمن أين إذن
  rationale: تحافظ على السؤال عن المصدر وعلى الاستنتاج الذي تؤديه οὖν، مع ربط طبيعي بالسؤال السابق.
- source_word: τούτῳ
  choice: لهذا
  rationale: ينقل اسم الإشارة الدال على يسوع ويحفظ شيئًا من النبرة الانتقاصية في كلام أهل بلدته، من دون إضافة وصف غير موجود.
- source_word: ταῦτα πάντα
  choice: كل هذه الأمور
  rationale: تنقل التعبير الجمعي الذي يشير إجمالًا إلى الحكمة والأعمال المقتدرة المذكورة في السياق.
theological_decisions:
- issue: طبيعة الإشارة إلى أخوات يسوع
  choice: 'ترجمة ἀδελφαὶ بمعناها المعجمي المعتاد: «أخواته».'
  alternative: قريباته أو نسيباته
  rationale: السياق الأسري يؤيد المعنى المباشر، ولا ينبغي للترجمة أن تحسم نقاشات لاهوتية لاحقة بتوسيع مدلول اللفظ من غير قرينة نصية؛ ويُذكر الاحتمال الأوسع في الحاشية فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعملت «بيننا» للدلالة الطبيعية على وجود الأخوات في الجماعة، وحُفظ اسم الإشارة في «لهذا» لنقل النبرة السياقية من غير مبالغة.
