  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: ar
  text: 'فأجابهم: «لأنكم قد مُنحتم معرفة أسرار ملكوت السماوات، أمّا أولئك فلم يُمنحوا ذلك».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجابهم
  rationale: هذا التركيب اليوناني اصطلاح شائع يفيد معنى الإجابة، ولا تستلزم العربية تكرار الفعلين بصيغة «أجاب وقال».
- source_word: ὑμῖν δέδοται
  choice: لقد أُعطي لكم
  rationale: يحافظ على المبني للمجهول وعلى دلالة صيغة التمام، أي إن العطية حدثت وما زالت نتيجتها قائمة، مع تقديم «لكم» معنويًا بوصفهم موضع المقابلة.
- source_word: γνῶναι
  choice: أن تعرفوا
  rationale: ينقل المعنى الأساسي للفعل، وهو المعرفة، من غير تضييقه إلى الفهم وحده.
- source_word: τὰ μυστήρια
  choice: أسرار
  rationale: «أسرار» لفظ عربي طبيعي ذو استعمال كتابي يدل على حقائق إلهية كانت خفية ثم كُشف عنها، ولا يعني مجرد ألغاز مبهمة.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: صياغة عربية راسخة ودقيقة للتعبير المتّى، وتحافظ على جمع «السماوات» في الأصل اليوناني.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: أمّا أولئك فلم يُعطَ لهم
  rationale: «أولئك» يحفظ المقابلة الصريحة بين المخاطَبين والفريق الآخر، وتكرار المبني للمجهول يصون التوازن البلاغي في الأصل.
theological_decisions:
- issue: الفاعل الضمني في المبني للمجهول «أُعطي»
  choice: الإبقاء على المبني للمجهول من غير تسمية الله صراحة
  alternative: أعطاكم الله / وهب الله لكم
  rationale: النص اليوناني لا يذكر الواهب، وإن كان السياق يرجّح أن الله هو المقصود؛ لذلك يحافظ المبني للمجهول على صياغة النص وتوتره اللاهوتي.
- issue: دلالة μυστήρια في سياق الملكوت
  choice: أسرار
  alternative: خفايا / حقائق خفية
  rationale: يحفظ هذا اللفظ فئة الحقائق الإلهية المخفية ثم المعلنة، من غير اختزالها في معلومات غامضة أو إضافة تفسير غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «ملكوت السماوات» لرسوخه في العربية الكتابية، مع تجنّب التراكيب المذهبية أو الشروح المضافة داخل المتن.
