  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: ar
  text: وَبَيْنَمَا هُوَ يَزْرَعُ، وَقَعَ بَعْضُ الْبِذَارِ[a] بِجَانِبِ الطَّرِيقِ، فَجَاءَتِ الطُّيُورُ وَالْتَهَمَتْهَا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا في اليونانية: «وقع بعضُ الأشياء بجانب الطريق»؛ وقد أُضيفت كلمة «البذار» من سياق مَثَل الزارع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: بَيْنَمَا هُوَ يَزْرَعُ
  rationale: تركيب ἐν مع المصدر المحلّى بأداة التعريف يفيد التزامن؛ و«بينما هو يزرع» تعبير عربي طبيعي يحفظ هذا المعنى الزمني.
- source_word: ἃ μὲν
  choice: بَعْضُ الْبِذَارِ
  rationale: الضمير الموصول في اليونانية محايد جمع، ومعناه الحرفي «بعض الأشياء»، ويعود في السياق إلى ما نثره الزارع؛ لذلك صُرِّح بـ«البذار» لوضوح المعنى في العربية.
- source_word: ἔπεσεν
  choice: وَقَعَ
  rationale: الفعل الماضي اليوناني يصف حدثًا سرديًا منجزًا، ويقابله الماضي البسيط «وقع» في العربية.
- source_word: παρὰ τὴν ὁδόν
  choice: بِجَانِبِ الطَّرِيقِ
  rationale: παρά مع النصب هنا تدل على الموضع بمحاذاة الطريق؛ و«بجانب الطريق» تحافظ على هذا المعنى بوضوح.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: فَجَاءَتِ الطُّيُورُ
  rationale: اسم الفاعل الماضي يفيد حدثًا سابقًا للالتهام، ويُصاغ طبيعيًا في العربية بفعل متتابع. وπετεινά تعني الطيور أو المخلوقات الطائرة، فـ«الطيور» هي الأنسب دون إضافة «السماء» غير الموجودة في النص.
- source_word: κατέφαγεν
  choice: الْتَهَمَتْهَا
  rationale: الفعل κατεσθίω أقوى من مجرد الأكل ويدل على الأكل التام أو الشره؛ و«التهمت» تنقل هذه القوة بإيجاز.
- source_word: αὐτά
  choice: هَا
  rationale: الضمير يعود إلى «البذار»، وهي جمع غير عاقل يُعامَل في العربية معاملة المفرد المؤنث.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «البذار» لأنها تدل على ما يُنثر للزرع وتنسجم مع عود الضمير المفرد المؤنث في «التهمتها». أُبقي معنى παρά المكاني بصيغة «بجانب الطريق»، من غير استيراد عبارة «طيور السماء» من نصوص موازية.
