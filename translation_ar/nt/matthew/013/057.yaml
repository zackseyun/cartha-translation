base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: ar
  text: 'فأخذوا عليه مأخذًا[a]. أما يسوع فقال لهم: «لا يكون نبيّ بلا كرامة إلا في بلدته[b] وبين أهل بيته[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استاءوا منه» أو «تعثروا بسببه»؛ وحرفيًا: «كانوا يتعثّرون فيه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «موطنه» أو «وطنه».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «في بيته». يمكن للكلمة اليونانية أن تدل على البيت أو على أهل البيت والدائرة العائلية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: استاءوا منه
  rationale: ينقل المعنى السياقي للتعبير، أي إنهم وجدوا في يسوع ما يثير اعتراضهم ونفورهم، من غير أن يوحي بتعثّر جسدي حرفي. وتوضح الحاشية الصورة الأصلية واحتمال «أخذوا عليه مأخذًا».
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: أما يسوع فقال لهم
  rationale: تعكس «أما... فـ» التحول التقابلي الخفيف الذي تفيده δέ بين موقفهم وجواب يسوع، بصياغة عربية طبيعية.
- source_word: προφήτης
  choice: نبيّ
  rationale: المقابل العربي المباشر والمألوف، ويحافظ على صيغة القول المَثَلي.
- source_word: ἄτιμος
  choice: بلا كرامة
  rationale: يحافظ على بُعد الكرامة/الإهانة في اللفظة وعلى البناء البلاغي المنفي في القول، بدل اختزاله في مجرد عدم القبول.
- source_word: εἰ μὴ
  choice: إلا
  rationale: أداة الاستثناء العربية الطبيعية في هذا التركيب.
- source_word: πατρίδι
  choice: بلدته
  rationale: يشير السياق إلى الموضع الذي نشأ فيه، أي الناصرة، و«بلدته» أوضح للقارئ من «وطنه» التي قد توحي ببلد أو أمة أوسع. وتذكر الحاشية سعة اللفظة.
- source_word: οἰκίᾳ αὐτοῦ
  choice: بين أهل بيته
  rationale: يرجّح المجال الاجتماعي والعائلي المقصود في المثل، مع استعمال «بين» الملائم للأشخاص. وتحفظ الحاشية احتمال دلالة اللفظة على البيت نفسه.
theological_decisions:
- issue: نطاق القول عن رفض النبي
  choice: الإبقاء على صيغة مَثَلية عامة تتعلق بحرمان النبي من الكرامة في محيطه الأصلي والأسري
  alternative: تفسير القول صراحة بأنه حكم خاص بعدم إيمان عائلة يسوع أو بأنه تعميم عقائدي على كل صور رفضه
  rationale: النص يورد قولًا مَثَليًا يطبقه يسوع على الموقف الحاضر؛ لذلك ينبغي الحفاظ على توتر الكرامة والرفض المحلي من غير إضافة تحديد لاهوتي لا تصرح به اليونانية.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. حوفظ على الإيجاز المَثَلي وعلى النفي والاستثناء في «لا يكون... إلا»، مع تقديم البدائل الدلالية الحقيقية في الحواشي من غير حسم زائد.
