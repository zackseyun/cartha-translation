  text: The one who has ears[a], let him hear.
translation:
  language: ar
  text: مَن له أذنان فليسمع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: مَن له
  rationale: التركيب اليوناني، وهو أداة التعريف مع اسم الفاعل، مستعمل استعمالًا اسميًا عامًا. وتؤدي «مَن له» هذا المعنى في عربية طبيعية موجزة، مع إبقاء الإحالة إلى أي شخص تنطبق عليه الصفة.
- source_word: ὦτα
  choice: أذنان
  rationale: اللفظة اليونانية جمع، والمراد في هذا التعبير أذنا الإنسان. والمثنى هو الصياغة العربية الطبيعية والأدق دلالةً هنا، بدل ترجمة الجمع اليوناني حرفيًا بصيغة الجمع العربية.
- source_word: ἀκουέτω
  choice: فليسمع
  rationale: فعل أمر مضارع للغائب المفرد. وتحفظ «فليسمع» قوة الحث وصلة اللفظ بالفعل «يسمع»، من غير أن تحصر المعنى في مجرد الإدراك السمعي أو تستبدله صراحةً بمعنى الطاعة.
theological_decisions:
- issue: الصيغة العامة مع المفرد المذكر
  choice: مَن له أذنان فليسمع
  alternative: كل مَن له أذنان فليسمع
  rationale: «مَن» في العربية عامة شاملة، ويعود إليها فعل مفرد مذكر بحسب الاستعمال النحوي المعتاد، وهو ما يوافق الصيغة اليونانية المفردة من غير تقييد المقصود بالذكور.
- issue: التوتر الدلالي بين السماع والإصغاء المستجيب
  choice: فليسمع
  alternative: فليصغِ
  rationale: يحافظ «يسمع» على الدلالة الأساسية للفعل اليوناني وعلى صيغة القول المأثورة، مع بقاء إيحاء السياق بأن المطلوب سماع متنبّه ومستجيب؛ أما «فليصغِ» فيصرّح بجانب واحد من المعنى ويقطع الصلة اللفظية بفعل السماع.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ومهيبة، تتبع بنية القول اليوناني بقدر ما تسمح به طبيعة العربية. استُعمل المثنى «أذنان» لأن العربية تميّز المثنى، وهو الأنسب طبيعيًا للعضوين المقصودين، بينما صيغة الجمع في اليونانية عادية في هذا الموضع.
