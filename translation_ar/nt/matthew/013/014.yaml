base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: ar
  text: 'وتتمّ فيهم نبوءة إشعياء القائلة: «ستسمعون سماعًا ولن تفهموا أبدًا، وأنتم تنظرون سترون، ولن تبصروا أبدًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بالسماع ستسمعون ... وناظرين سترون». وهذا تركيب توكيدي على أسلوب عبري، منقول في النص اليوناني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: تتمّ
  rationale: فعل مضارع مبني للمجهول في اليونانية، ومعناه أن النبوءة تجد تمامها في حالهم. وصيغة «تتمّ» عربية طبيعية تحفظ الحاضر من غير أن تضيف معنى الحتمية أو الاستكمال المطلق.
- source_word: αὐτοῖς
  choice: فيهم
  rationale: 'يحافظ على الدلالة الاصطلاحية للداتيف: تتحقق النبوءة في هؤلاء الناس وفي حالتهم.'
- source_word: ἡ προφητεία Ἠσαΐου ἡ λέγουσα
  choice: نبوءة إشعياء القائلة
  rationale: صياغة عربية موجزة وطبيعية تحافظ على إضافة النبوءة إلى إشعياء وعلى وظيفة اسم الفاعل المُدخل للاقتباس.
- source_word: Ἀκοῇ ἀκούσετε
  choice: ستسمعون سماعًا
  rationale: ينقل التركيب التوكيدي السامي الذي أبقته اليونانية، ويحافظ على تكرار الجذر بأسلوب عربي مفهوم وفصيح.
- source_word: οὐ μὴ συνῆτε
  choice: ولا تفهمون أبدًا
  rationale: «أبدًا» تنقل قوة النفي المؤكد οὐ μή، مع إبقاء حرف العطف كما في اليونانية بدل تحويله إلى استدراك.
- source_word: βλέποντες βλέψετε
  choice: وستنظرون نظرًا
  rationale: يحافظ على التكرار التوكيدي وعلى التمييز المعجمي بين βλέπω وἴδητε.
- source_word: οὐ μὴ ἴδητε
  choice: ولا تبصرون أبدًا
  rationale: «تبصرون» توحي بالإدراك الباطني إلى جانب الرؤية، وتمنع تسوية الفارق بين فعلي النظر والإبصار، بينما تنقل «أبدًا» النفي المؤكد.
theological_decisions:
- issue: طبيعة إتمام النبوءة
  choice: «فيهم تتمّ نبوءة إشعياء»
  alternative: «تنطبق عليهم نبوءة إشعياء» أو «تكتمل فيهم تمامًا»
  rationale: تُبقي العبارة لغة الإتمام النبوي كما في النص، من غير اختزالها إلى مجرد انطباق أو تحميلها تصورًا محددًا عن التصلب والحتمية أو الاكتمال النهائي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم تكرار الجذر في «ستسمعون سماعًا» و«ستنظرون نظرًا» للمحافظة على البلاغة السامية، مع شرح الصيغة الحرفية في الحاشية.
