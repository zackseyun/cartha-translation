  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: ar
  text: 'قائلًا: «توبوا[a]، لأن ملكوت السماوات قد اقترب[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «غيّروا فكركم وتوجّهكم». يدل الفعل اليوناني على تحوّل في التفكير والتوجّه، لا على مجرد الشعور بالندم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قد صار قريبًا». تفيد صيغة الفعل اليوناني أن الملكوت اقترب وأصبح الآن قريبًا.'
    reason: aspectual_clarification
lexical_decisions:
- source_word: καὶ λέγων
  choice: قائلًا
  rationale: اسم الحال «قائلًا» يصل العبارة بالسياق السابق طبيعيًا في العربية، ولا يحمّل λέγων معنى أكثر تخصّصًا مثل «مناديًا» أو «كارزًا». لم تُفرد καὶ بواو لأن الربط الذي تؤديه يُفهم من صيغة الحال، ولأن «وقائلًا» أقل سلاسة هنا.
- source_word: Μετανοεῖτε
  choice: توبوا
  rationale: فعل أمر للجمع يدعو إلى تحوّل في الفكر والتوجّه والسلوك. «توبوا» هو المقابل العربي الطبيعي الموجز، ولا يحصر المعنى في مجرد الشعور بالذنب، بخلاف صياغة «غيّروا تفكيركم» التي قد توحي بتعديل رأي ذهني فحسب.
- source_word: ἤγγικεν
  choice: قد اقترب
  rationale: '«قد» مع الماضي تنقل بصورة طبيعية دلالة الفعل اليوناني التام: حدث الاقتراب وصار الملكوت قريبًا الآن.'
- source_word: γὰρ
  choice: لأن
  rationale: تبيّن علة الأمر بالتوبة بوضوح في العربية.
- source_word: ἡ βασιλεία
  choice: ملكوت
  rationale: «ملكوت» تعبير عربي كتابي راسخ يتسع لدلالة المُلك والسلطان والمملكة، ويحافظ على الصياغة المميزة في متى.
- source_word: τῶν οὐρανῶν
  choice: السماوات
  rationale: يحافظ الجمع على الصيغة اليونانية الحرفية وعلى تعبير متى المميز، وهو تعبير عربي مفهوم وطبيعي في هذا السياق.
theological_decisions:
- issue: دلالة «ملكوت السماوات»
  choice: الإبقاء على «ملكوت السماوات»
  alternative: مُلك الله / سلطان السماء
  rationale: تحفظ الصياغة تعبير متى نفسه من غير تفسيره مسبقًا على أنه المجال أو السلطان وحده، ومن غير استبداله بالتعبير السينوبتي القريب «ملكوت الله».
- issue: مدى دلالة μετανοεῖτε
  choice: توبوا
  alternative: غيّروا فكركم
  rationale: الدعوة في السياق تتناول إعادة توجيه الإنسان استجابةً لاقتراب الملكوت، ولا ينبغي اختزالها لا في إحساس عاطفي بالندم ولا في تغيير ذهني محض.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وموجزة. استُخدم «ملكوت» للمحافظة على الصياغة الإنجيلية المألوفة، مع تجنب التفسير الطائفي أو تضييق المعنى اللاهوتي.
