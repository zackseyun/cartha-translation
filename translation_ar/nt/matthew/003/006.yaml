  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: ar
  text: وكانوا يُعمَّدون[a] على يده في نهر الأردن، معترفين بخطاياهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «تعمَّدوا»؛ فقد تدل صيغة الماضي الناقص في اليونانية على فعل جارٍ أو متكرر، ومن ثم: «كانوا يُعمَّدون».'
    reason: بديل صرفي يوضح دلالة الفعل اليوناني الناقص.
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: كانوا يُعمَّدون
  rationale: يحافظ المبني للمجهول على كونهم متلقّين لفعل المعمودية، وتنقل صيغة «كانوا» دلالة الماضي الناقص على الفعل الجاري أو المتكرر. وأُبقي مصطلح «المعمودية» دون تحديد كيفيتها.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: في نهر الأردن
  rationale: ترجمة مكانية مباشرة وطبيعية، مع إبقاء الاسم الصريح «نهر» الوارد في اليونانية.
- source_word: ὑπ’ αὐτοῦ
  choice: على يده
  rationale: تعبير عربي طبيعي يدل على أن الفعل تم بواسطته، مع إبقاء الضمير كما في النص بدل التصريح باسم يوحنا.
- source_word: ἐξομολογούμενοι
  choice: معترفين
  rationale: اسم الحال يفيد أن الاعتراف كان مقارنًا للمعمودية، و«معترفين» تعبير واضح ومباشر في سياق التوبة.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: بخطاياهم
  rationale: يحفظ الجمع والملكية في صياغة عربية موجزة وطبيعية.
- source_word: καὶ
  choice: و
  rationale: يحفظ أداة الربط البسيطة واستمرار السرد من الآية السابقة.
theological_decisions:
- issue: دلالة مصطلح المعمودية وكيفيتها
  choice: استخدام «يُعمَّدون» دون تفسير الكيفية
  alternative: كانوا يُغمرون / كانوا يغتسلون
  rationale: يذكر النص أنهم نالوا المعمودية في الأردن على يده، لكنه لا يجعل كيفية إجرائها موضع التصريح في هذه العبارة؛ لذلك يحفظ المصطلح الطقسي المعروف الغموض القائم ولا يفرض استنتاجًا مذهبيًا.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، مع نبرة كتابية رصينة. استُخدم التشكيل الجزئي في «يُعمَّدون» لمنع التباس المبني للمجهول بغيره، ووُضع رمز الحاشية في المتن مباشرة بعد اللفظ المعني.
