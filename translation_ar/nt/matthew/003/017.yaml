base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: ar
  text: 'وَإِذَا صَوْتٌ مِنَ السَّمَاوَاتِ[a] يَقُولُ: «هَذَا هُوَ ابْنِي الْحَبِيبُ، الَّذِي سُرِرْتُ بِهِ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِنَ السَّمَاءِ». جاءت «السماوات» في اليونانية بصيغة الجمع.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «الذي فيه سُررت»؛ أو: «الذي رضيتُ عنه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: وَإِذَا
  rationale: تؤدي «وإذا» وظيفة أداة التنبيه إلى حدث مفاجئ ذي شأن، بصياغة عربية فصيحة وطبيعية، من غير تسطيح قوة ἰδού.
- source_word: φωνὴ
  choice: صَوْتٌ
  rationale: يدل السياق على صوت ناطق لا على مجرد ضجيج، إذ يتبعه قول مباشر.
- source_word: ἐκ τῶν οὐρανῶν
  choice: مِنَ السَّمَاوَاتِ
  rationale: يحافظ الجمع «السماوات» على صيغة النص اليوناني وعلى التعبير السامي المألوف، مع إثبات المفرد بوصفه بديلًا عربيًا شائعًا في الحاشية.
- source_word: λέγουσα
  choice: يَقُولُ
  rationale: صيغ اسم الفاعل اليوناني في العربية فعلًا مضارعًا تابعًا لـ«صوت»، وهو تعبير واضح وطبيعي يحفظ معنى إدخال الكلام المباشر.
- source_word: Οὗτός ἐστιν
  choice: هَذَا هُوَ
  rationale: يحفظ التحديد المباشر والتوكيد التعريفي في الإعلان.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: ابْنِي الْحَبِيبُ
  rationale: «الحبيب» مقابل عربي فصيح وطبيعي لـἀγαπητός، ويحفظ معنى المحبة ونبرة الإعلان المهيبة من غير إضافة تفسير عقائدي إلى النص.
- source_word: ἐν ᾧ
  choice: الَّذِي بِهِ
  rationale: تحافظ الباء على الصلة الوثيقة التي تفيدها ἐν ضمن هذا التركيب، وتأتي سليمة مع «سُررت»؛ وتُذكر صيغة «فيه» الأشد حرفية في الحاشية.
- source_word: εὐδόκησα
  choice: سُرِرْتُ
  rationale: يحفظ الفعل الماضي صيغة الماضي اليونانية ويعبّر عن المسرة والرضا الإلهيين دون تحويلها صراحة إلى زمن حاضر أو إضافة معنى غير ملفوظ.
theological_decisions:
- issue: إعلان بنوّة يسوع
  choice: ابني الحبيب
  alternative: ابني الذي أحبّه
  rationale: يحفظ النص البنوة الصريحة ووصف المحبة كما في اليونانية، من غير إضعافها إلى علاقة وظيفية ولا توسيعها بصياغة مذهبية زائدة.
- issue: دلالة ἐν ᾧ εὐδόκησα
  choice: الذي به سُررت
  alternative: الذي فيه سُررت
  rationale: تبقي الصياغة على رابطة ἐν وعلى دلالة المسرة، ولا تحسم العبارة بتفسير لاهوتي يتجاوز الإعلان نفسه.
- issue: جمع οὐρανῶν
  choice: من السماوات
  alternative: من السماء
  rationale: اختير الجمع لأنه صيغة المصدر، مع إبقاء المفرد المألوف بديلًا مشروعًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تلائم الإعلان السماوي. استُعمل الضبط الجزئي لتفادي التباس المبني للمجهول في «سُرِرتُ»، ووُضعت علامتا الحاشية عند العبارتين اللتين تشرحهما الحاشيتان.
