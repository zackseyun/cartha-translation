  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ar
  text: والفأس قد وُضِعت بالفعل عند جذر الأشجار[a]. لذلك، كل شجرة لا تُنتج ثمرًا جيدًا تُقطَع وتُلقى في النار.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والفأس موضوعة بالفعل عند جذر الأشجار».'
    reason: بديل لفظي يحافظ بصورة أوضح على دلالة κεῖται بوصفها حالة قائمة، في مقابل الصياغة الفعلية الطبيعية «قد وُضعت».
lexical_decisions:
- source_word: ἤδη δὲ
  choice: والفأس قد وُضِعت بالفعل
  rationale: تؤدي الواو وظيفة δέ الوصلية الخفيفة، ويعبّر «قد... بالفعل» عن ἤδη وإلحاح الدينونة الوشيكة بلغة عربية طبيعية.
- source_word: ἡ ἀξίνη
  choice: الفأس
  rationale: المقابل العربي المألوف لأداة القطع في صورة الدينونة.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: وُضِعت ... عند أصل الأشجار
  rationale: يحفظ معنى تموضع الفأس واستعدادها للعمل؛ و«عند» تنقل دلالة القرب في πρός، بينما جاء «أصل» مفردًا وفق صيغة اليونانية.
- source_word: πᾶν οὖν δένδρον
  choice: لذلك، كل شجرة
  rationale: تنقل «لذلك» الاستنتاج الذي تدل عليه οὖν بوضوح، ويحافظ «كل شجرة» على شمول πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: لا تُنتج ثمرًا جيدًا
  rationale: تنقل الصفة المستمرة التي يؤديها اسم الفاعل، وتحفظ التعبير المباشر عن الثمر الجيد دون توسيع تفسيري.
- source_word: ἐκκόπτεται
  choice: تُقطَع
  rationale: صيغة مبني للمجهول واضحة وتلائم قطع الشجرة؛ لم تُضف «إلى أسفل» لأن العربية تعبّر عن الفعل طبيعيًا من دونها.
- source_word: εἰς πῦρ βάλλεται
  choice: تُلقى في النار
  rationale: تعبير عربي طبيعي يحفظ المبني للمجهول وقوة صورة الإلقاء في النار.
theological_decisions:
- issue: طبيعة صورة النار
  choice: النار
  alternative: الدينونة الأخروية؛ دينونة زمنية؛ نار جهنم
  rationale: يبقي النص صورة الدينونة كما وردت من غير حصرها في تفسير عقدي أضيق لا تصرّح به الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم المبني للمجهول حفاظًا على بنية الأفعال اليونانية، مع إبقاء استعارة الشجر والثمر والنار بلا شرح تفسيري داخل المتن.
