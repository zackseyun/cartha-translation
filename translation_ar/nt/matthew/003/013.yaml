  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: ar
  text: حينئذٍ جاء يسوع من الجليل إلى الأردن، إلى يوحنا، لكي يتعمّد على يده.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: أداة زمنية تنقل السرد إلى الحدث التالي، و«حينئذٍ» فصيحة وواضحة وتحفظ تتابع الأحداث.
- source_word: παραγίνεται
  choice: جاء
  rationale: الفعل مضارع تاريخي يُستعمل لاستحضار الحدث في السرد اليوناني. الماضي هو الأسلوب الطبيعي في السرد العربي، أما «يأتي» هنا فقد يوحي بزمن حاضر فعلي لا بمجرد الحيوية السردية.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: من الجليل
  rationale: تفيد ἀπό مصدر الحركة أو منشأها، و«من الجليل» هي الصياغة العربية المباشرة.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: إلى الأردن
  rationale: تفيد ἐπί مع النصب الحركة نحو مكان. والاسم وحده مفهوم في السياق، فلا حاجة إلى إضافة «نهر» غير الموجودة صراحة في النص.
- source_word: πρὸς τὸν Ἰωάννην
  choice: إلى يوحنا
  rationale: تفيد πρός مع النصب التوجه نحو شخص. أبقينا «يوحنا» بلا لقب لأن الآية لا تضيف إليه لقبًا.
- source_word: τοῦ βαπτισθῆναι
  choice: لكي يعتمد
  rationale: المصدر المسبوق بأداة التعريف هنا يفيد الغرض؛ و«لكي يعتمد» يصرّح بعلاقة الغاية بوضوح طبيعي في العربية.
- source_word: ὑπ’ αὐτοῦ
  choice: على يده
  rationale: تفيد ὑπό مع المضاف إليه الفاعل الذي يُجري الفعل. و«على يده» تعبير عربي طبيعي يحفظ إحالة الضمير إلى يوحنا.
theological_decisions:
- issue: المضارع التاريخي في παραγίνεται
  choice: 'صياغته بالماضي العربي: «جاء»'
  alternative: «يأتي» للاحتفاظ بصورة المضارع اليوناني
  rationale: المضارع التاريخي سمة سردية يونانية، ولا يلزم أن يُنقل بزمن مماثل إذا أحدث التباسًا في العربية. «جاء» يحفظ وقوع الحدث وتسلسله من غير أن يضيف دلالة عقائدية.
- issue: تعيين لقب يوحنا
  choice: «يوحنا» فقط
  alternative: «يوحنا المعمدان»
  rationale: النص اليوناني في هذه الآية يذكر الاسم وحده، والسياق السابق يعرّفه؛ لذلك لا يُضاف لقب غير وارد هنا.
- issue: صياغة اعتماد يسوع
  choice: «لكي يعتمد على يده»
  alternative: «لكي يعمّده»
  rationale: الصياغة المختارة تحفظ المبني للمجهول في βαπτισθῆναι وتُبقي يوحنا عاملًا مذكورًا في العبارة التابعة، بدل تحويل التركيب إلى فعل معلوم.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدم الماضي وفق مألوف السرد العربي، وحُفظ تتابع الوجهتين بفاصلة: «إلى الأردن، إلى يوحنا». لا توجد حواشٍ لازمة لهذه الآية، ولذلك لا تظهر علامات حواشٍ في المتن.'
