  terminology: «يتعمّد» هو المصطلح العربي الفصيح الواضح لفعل βαπτισθῆναι، ويحفظ كونه واقعًا على يسوع لا فعلًا صادرًا منه تجاه شخص آخر. و«على يده» تؤدي الوكالة في ὑπ’ αὐτοῦ بصورة طبيعية.
