  to: حينئذٍ جاء يسوع من الجليل إلى الأردن، إلى يوحنا، لكي يتعمّد على يده.
  rationale: استبدلتُ «يعتمد» بـ«يتعمّد» لإزالة اللبس المعجمي وتثبيت مصطلح المعمودية العربي، مع الإبقاء على علاقة الغاية وعلى إحالة «يده» إلى يوحنا. ولا تستلزم الآية حاشية؛ فاختيار الماضي العربي للسرد سليم، واللقب غير مضاف إلى «يوحنا» التزامًا بالنص.
