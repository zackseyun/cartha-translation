  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: ar
  text: مِذراته في يده[a]، وسينقّي بيدره تمامًا، ويجمع قمحه إلى مخزنه[b]، وأما التبن فسيحرقه بنار لا تُطفأ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «مجرفة التذرية».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «مخزن للحبوب» أو «صومعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: مِذراة
  rationale: اسم الأداة الزراعية التي يُذَرّى بها المحصول لفصل الحب عن التبن؛ وهو موجز ودقيق في العربية، مع بيان البديل في الحاشية.
- source_word: διακαθαριεῖ
  choice: سينقّي ... تمامًا
  rationale: يحفظ دلالة الفعل المركب على التنقية الكاملة، ويأتي طبيعيًا في سياق البيدر.
- source_word: ἅλωνα
  choice: بيدره
  rationale: «البيدر» هو الموضع الذي يُدرَس فيه الحب ويُذَرّى، وهو المقابل الزراعي الدقيق للكلمة اليونانية.
- source_word: σῖτον
  choice: قمحه
  rationale: قد تدل الكلمة على الحبوب عمومًا، لكن «القمح» مناسب للصورة التي تقابل بين الحب والتبن ويحافظ على تخصيص شائع للكلمة.
- source_word: ἀποθήκην
  choice: مخزنه
  rationale: ترجمة عامة تحفظ معنى موضع التخزين من غير تقييده بنمط معماري أو ثقافي بعينه.
- source_word: ἄχυρον
  choice: التبن
  rationale: لفظ عربي مألوف للمادة الخفيفة التي تنفصل عن الحب عند التذرية، ويلائم التقابل الزراعي في النص.
- source_word: κατακαύσει
  choice: فسيحرقه
  rationale: يفيد السياق، مع بنية الفعل اليوناني، إحراق التبن واستهلاكه؛ ولا تحتاج العربية إلى تركيب زائد لإيصال النتيجة الكاملة.
- source_word: πυρὶ ἀσβέστῳ
  choice: بنار لا تُطفأ
  rationale: تحفظ الباء دلالة الوسيلة، وتعبّر العبارة بوضوح عن نار لا يمكن إطفاؤها.
- source_word: οὗ
  choice: مِذراته
  rationale: أُدّي ضمير الوصل المضاف بصيغة الملكية الطبيعية في العربية، رابطًا الكلام بالآتي المذكور في الآية السابقة.
theological_decisions:
- issue: صورة الدينونة في فصل القمح عن التبن
  choice: الإبقاء على الاستعارة الزراعية وعلى أفعال المستقبل كما وردت
  alternative: التصريح في المتن بأن القمح والتبن يرمزان إلى الأبرار والأشرار
  rationale: النص نفسه يعرض صورة الفصل ونتيجته الشديدة من غير أن يفسّر طرفي الاستعارة صراحة؛ لذلك تُحفظ الصورة والتوتر اللاهوتي بلا إضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعملت ألفاظ زراعية دقيقة ومألوفة نسبيًا، مع شرح البدائل الأقل شيوعًا في الحواشي. وُضعت جميع علامات الحواشي في المتن.
