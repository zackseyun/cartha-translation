source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ar
  text: 'ولا تظنّوا أن تقولوا في أنفسكم[a]: «أبونا إبراهيم»، فإني أقول لكم إن الله قادر أن يقيم لإبراهيم أولادًا من هذه الحجارة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تقولوا بينكم». قد تشير العبارة اليونانية إلى حديث المرء في نفسه، أو إلى ما يقوله أفراد الجماعة بعضهم لبعض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: ولا تظنّوا
  rationale: يفيد النهي التحذير من تبنّي افتراض واثق لكنه باطل. و«لا تظنّوا» عربية طبيعية تحفظ الفعل الذهني من غير إضافة معنى الغرور صراحةً.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: أن تقولوا في أنفسكم
  rationale: تحفظ هذه الصياغة معنى الحديث الداخلي، مع بقاء إمكان فهمها على أنها مقولة متداولة داخل الجماعة، وهو موضح في الحاشية.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: أبونا إبراهيم
  rationale: صياغة عربية موجزة وطبيعية تعبّر عن دعوى الانتساب إلى إبراهيم والاتكال على هذه البنوة، من غير زيادة تفسيرية.
- source_word: λέγω γὰρ ὑμῖν
  choice: فإني أقول لكم
  rationale: تحفظ γάρ التعليلية وصيغة القول المباشر بنبرة فصيحة واضحة.
- source_word: δύναται
  choice: قادر
  rationale: ينقل معنى القدرة الإلهية صراحةً ويحافظ على النبرة الجليلة.
- source_word: ἐκ τῶν λίθων τούτων
  choice: من هذه الحجارة
  rationale: ينقل حرف الجر والصورة المحسوسة نقلًا مباشرًا وطبيعيًا.
- source_word: ἐγεῖραι
  choice: أن يقيم
  rationale: يحفظ المجال الدلالي للفعل، أي إيجاد ذرية أو إقامتها، من غير حصره في القيامة أو استبداله بتفسير مطوّل.
- source_word: τέκνα
  choice: أولادًا
  rationale: لفظ شامل للجنسين وطبيعي في سياق النسب والذرية، ولا يضيّق المعنى إلى الذكور.
- source_word: τῷ Ἀβραάμ
  choice: لإبراهيم
  rationale: اللام تعبّر طبيعيًا عن علاقة الأولاد بإبراهيم بوصفهم ذريته، مع المحافظة على الداتيف من غير توسع تفسيري.
theological_decisions:
- issue: دلالة الانتساب إلى إبراهيم في تحذير يوحنا
  choice: تحذير من الاتكال على النسب الجسدي إلى إبراهيم بوصفه ضمانًا كافيًا أمام الله، من غير إنكار أبوته التاريخية لإسرائيل.
  alternative: إما اعتبار الكلام مبالغة بلاغية بلا نقد للثقة بامتياز النسب، أو تحميله معنى استبدال إسرائيل العرقية.
  rationale: النص يوبخ الثقة بالانتساب الموروث ويؤكد قدرة الله، لكنه لا يصرّح بإنكار النسب التاريخي ولا بنظرية لاهوتية لاحقة عن الاستبدال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي إبقاء الصورة البلاغية والتوتر بين دعوى النسب وقدرة الله، مع تجنب المصطلحات الطائفية أو الشروح العقائدية المضافة.
