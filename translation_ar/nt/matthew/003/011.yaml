id: MAT.3.11
reference: Matthew 3:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: ar
  text: «أمّا أنا فأعمّدكم في الماء[a] للتوبة[b]، وأمّا الآتي بعدي فهو أقوى مني، ولستُ أهلًا لأن أحمل نعليه. هو سيعمّدكم في الروح القدس والنار[c].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «في الماء» هنا، وكذلك «في الروح القدس والنار» لاحقًا، باستعمال الباء: «بالماء» و«بالروح القدس والنار»؛ فحرف الجر اليوناني ἐν يحتمل الوجهين في هذه العبارات.'
    reason: lexical_alternative
  - marker: b
    text: يمكن فهم «للتوبة» أيضًا بمعنى «إلى التوبة»؛ فالعبارة اليونانية تحمل دلالة الاتجاه أو الغاية، من غير أن تحدد وحدها هل التوبة تسبق المعمودية أم تدل المعمودية عليها.
    reason: lexical_alternative
  - marker: c
    text: قد تشير «النار» إلى التطهير أو إلى الدينونة؛ فالعبارة اليونانية تبقي الصورة مفتوحة هنا، ويوجّه السياق المحيط فهمها.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: أعمّد / سيعمّد
  rationale: يحافظ على الفعل الكنسي العربي المألوف من غير أن يحدّد كيفية المعمودية بالغمر، إذ لا يصرّح السياق هنا بكيفيتها.
- source_word: ἐν ὕδατι
  choice: في الماء
  rationale: ترجمة قريبة من تركيب اليونانية، وتحافظ على التوازي مع «في الروح القدس والنار»، مع الإشارة في الحاشية إلى إمكان ترجمتها «بالماء».
- source_word: εἰς μετάνοιαν
  choice: للتوبة
  rationale: صياغة عربية موجزة وطبيعية تحتفظ بالاتجاه أو الغاية في حرف الجر εἰς من غير أن تحسم العلاقة الزمنية أو اللاهوتية بين التوبة والمعمودية.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: وأمّا الآتي بعدي
  rationale: ينقل اسم الفاعل المعرّف ودلالة التعاقب، ويقابل بناء «أمّا أنا» مقابلة عربية واضحة.
- source_word: ἰσχυρότερός μού ἐστιν
  choice: فهو أقوى مني
  rationale: ترجمة مباشرة ومفهومة لصيغة التفضيل، بلا ألفاظ قديمة أو توسع تفسيري.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: ولستُ أهلًا
  rationale: تؤدي المعنى الاصطلاحي للتواضع؛ فـἱκανός هنا يدل على الأهلية أو الاستحقاق، لا مجرد القدرة الجسدية.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: لأن أحمل نعليه
  rationale: ينقل βαστάσαι بمعنى «أحمل» لا «أخلع»، ويعبّر المثنى «نعليه» طبيعيًا عن الحذاءين المنسوبين إلى الآتي.
- source_word: αὐτός
  choice: هو
  rationale: إبراز الضمير في العربية يحفظ توكيد الفاعل والمقابلة بين عمل يوحنا وعمل الآتي بعده.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: في الروح القدس
  rationale: يحافظ على تكرار ἐν، ويعبّر عن المرجع الشخصي المألوف لعبارة «الروح القدس» في هذا السياق.
- source_word: καὶ πυρί
  choice: والنار
  rationale: ترجمة حرفية موجزة تبقي صورة النار مفتوحة على دلالتي التطهير والدينونة بحسب السياق، من غير حسم تفسيري داخل النص.
theological_decisions:
- issue: معنى «الروح القدس والنار»
  choice: الإبقاء على العبارة «في الروح القدس والنار» من غير إضافة تفسيرية
  alternative: «في الروح القدس والنار المطهِّرة» أو «في الروح القدس ونار الدينونة»
  rationale: تحتمل الصورة في السياق دلالة التطهير أو الدينونة، ولذلك يحافظ النص على التوتر الدلالي ويترك للسياق توجيه الفهم.
- issue: مرجع πνεύματι ἁγίῳ
  choice: الروح القدس
  alternative: «روح قدوس» أو «قوة روحية مقدسة»
  rationale: العبارة في هذا السياق المَتَّاوي تشير على الأرجح إلى الروح القدس، ولا تستدعي تحويلها إلى تأثير غير شخصي أو إضافة شرح عقائدي.
- issue: العلاقة بين المعمودية والتوبة في εἰς μετάνοιαν
  choice: للتوبة، مع توضيح سعة الدلالة في الحاشية
  alternative: «إلى التوبة» أو صياغة تحسم أن المعمودية تُحدث التوبة أو تأتي بعدها فقط
  rationale: يحمل حرف الجر اليوناني اتجاهًا أو غاية، لكن العبارة وحدها لا تحسم بدقة طبيعة العلاقة؛ لذلك تجنبت الترجمة فرض ترتيب أو تفسير لاهوتي بعينه.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل بناء «أمّا… وأمّا…» لإظهار المقابلة، و«نعليه» بدل تعبير مطوّل، مع الحفاظ على المصطلحات الكتابية المألوفة من غير نزعة طائفية أو توسع تفسيري.
