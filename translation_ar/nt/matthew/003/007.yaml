source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ar
  text: 'فلما رأى كثيرين من الفريسيين والصدوقيين قادمين إلى معموديته[a]، قال لهم: «يا نسل الأفاعي[b]، مَن حذّركم أن تهربوا من الغضب الآتي[c]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إلى المعمودية التي كان يوحنا يمارسها؛ ولا تصرّح الآية بأنهم تعمّدوا فعلًا.
    reason: clarification
  - marker: b
    text: 'ويجوز: «يا أولاد الأفاعي».'
    reason: lexical_alternative
  - marker: c
    text: 'ويجوز: «الغضب المزمع أن يأتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: لكنّه لما رأى
  rationale: صيغ اسم الفاعل الماضي مع δέ في جملة زمنية عربية طبيعية، مع إبقاء الانتقال والمقابلة الخفيفة في السياق.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: كثيرين من الفريسيين والصدوقيين
  rationale: يحفظ التركيب التبعيضي في اليونانية، فلا يوحي بأن جميع أفراد الفئتين كانوا حاضرين أو مقصودين بالضرورة.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: مقبلين إلى معموديته
  rationale: ينقل حركة المجيء نحو معمودية يوحنا أو خدمته في التعميد، من غير إضافة القول إنهم تعمدوا فعلًا، وهو ما لا تصرح به الآية.
- source_word: Γεννήματα ἐχιδνῶν
  choice: يا نسل الأفاعي
  rationale: «نسل» يقابل معنى ما وُلد أو نتج، والتعبير العربي واضح وقوي ويحفظ صورة التوبيخ النبوي.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: مَن حذّركم
  rationale: الفعل قد يعني أظهر أو نبّه، لكن سياق الهرب من الغضب يجعل «حذّركم» أنسب مع بقاء معنى التنبيه إلى خطر وشيك.
- source_word: φυγεῖν ἀπὸ
  choice: أن تهربوا من
  rationale: يحفظ صورة الفرار العاجل التي يحملها الفعل، بدل تليينها إلى مجرد النجاة.
- source_word: τῆς μελλούσης ὀργῆς
  choice: الغضب الآتي
  rationale: «الغضب» هو المقابل المباشر لـὀργή، و«الآتي» ينقل دلالة μελλούσης على ما هو مقبل أو وشيك.
theological_decisions:
- issue: نطاق المخاطَبين من الفريسيين والصدوقيين
  choice: كثيرون من الفريسيين والصدوقيين
  alternative: الفريسيون والصدوقيون جميعًا
  rationale: التركيب اليوناني تبعيضي، ولذلك لا ينبغي أن تعمم الترجمة التوبيخ على كل فرد من الفئتين خارج الحاضرين.
- issue: دلالة ὀργή الأخروية
  choice: الغضب
  alternative: الدينونة أو العقاب
  rationale: يحفظ لفظ «الغضب» حدة التعبير وثقله اللاهوتي، من غير أن يحصره تفسيريًا في نتيجة قضائية فحسب.
- issue: غرض مجيء الفريسيين والصدوقيين
  choice: كانوا مقبلين إلى معمودية يوحنا
  alternative: كانوا مقبلين لكي يعتمدوا على يده حتمًا
  rationale: النص يذكر مجيئهم إلى المعمودية، لكنه لا يقرر في هذه الآية أنهم نالوها فعلًا؛ لذا أبقت الصياغة هذا القدر من الغموض.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة نبوية مهيبة. استُعمل «معمودية» بوصفه المصطلح العربي الكتابي الشائع، وحُفظ التوبيخ المباشر من غير تلطيف أو إضافة تفسير مذهبي.
