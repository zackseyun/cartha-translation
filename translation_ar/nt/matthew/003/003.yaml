id: MAT.3.3
reference: Matthew 3:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ar
  text: 'فهذا هو الذي قيل عنه على لسان إشعياء النبي: «صوتُ صارخٍ في البرية: هيِّئوا طريق الرب، واجعلوا سبله مستقيمة».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: فهذا
  rationale: اسم الإشارة يعود إلى يوحنا المعمدان في السياق السابق، ويحفظ قوة الإشارة في اليونانية.
- source_word: γάρ
  choice: فـ
  rationale: تربط الجملة بما قبلها بوصفها تفسيرًا له، بأسلوب عربي طبيعي وموجز.
- source_word: ὁ ῥηθεὶς
  choice: الذي قيل عنه
  rationale: ينقل اسم المفعول اليوناني المستعمل استعمال الاسم، ويوضح أن النبوة تشير إلى هذا الشخص.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: على لسان إشعياء النبي
  rationale: يحفظ معنى الوساطة في διά مع المضاف إليه، وهو تعبير عربي مألوف في سياق النبوة.
- source_word: λέγοντος
  choice: النقطتان قبل الاقتباس
  rationale: أُدّي معنى فعل القول بصيغة تقديم الاقتباس بعد ذكر إشعياء النبي، تجنبًا لتركيب عربي متكلف مثل «القائل».
- source_word: Φωνὴ βοῶντος
  choice: صوتُ صارخٍ
  rationale: يحفظ تركيب «صوتِ واحدٍ يصرخ» في عبارة عربية فصيحة وموجزة، مع إبقاء قوة النداء العلني.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» أنسب للسياق الجغرافي والنبوي من «الصحراء»، مع توضيح احتمال التعلّق النحوي في الحاشية.
- source_word: Ἑτοιμάσατε
  choice: هيِّئوا
  rationale: فعل أمر مباشر يدل على الإعداد، ويلائم النبرة النبوية.
- source_word: τὴν ὁδὸν
  choice: طريق
  rationale: يحفظ الصورة الحرفية والمجازية والصلة بإشعياء 40:3.
- source_word: κυρίου
  choice: الرب
  rationale: هو المقابل العربي الطبيعي لـκύριος في النص اليوناني، مع بيان خلفيته العبرية في الحاشية.
- source_word: εὐθείας ποιεῖτε
  choice: اجعلوا ... مستقيمة
  rationale: ينقل فعل الجعل مع الصفة «مستقيمة» بوضوح، ويحافظ على صورة تسوية الطريق.
- source_word: τὰς τρίβους αὐτοῦ
  choice: سبله
  rationale: «السبل» تلائم الأسلوب الشعري وتحتفظ بضمير الغائب العائد إلى الرب.
theological_decisions:
- issue: ترجمة κυρίου في اقتباس من إشعياء 40:3، حيث يرد في العبرية اسم يهوه
  choice: الرب
  alternative: يهوه
  rationale: يتبع المتن اللفظ اليوناني κύριος من غير أن يحجب أن الاقتباس في أصله العبري يشير إلى الاسم الإلهي يهوه؛ لذلك ذُكرت الخلفية في الحاشية بدل استبدال قراءة المتن اليوناني.
- issue: تعلّق عبارة «في البرية»
  choice: وصلها في المتن بـ«صارخ»
  alternative: وصلها بالأمر «هيِّئوا»
  rationale: الترقيم الشائع في سياق متى يجعلها وصفًا لمكان الصراخ، لكن تركيب الاقتباس نفسه يسمح بقراءتها مع الأمر التالي، ولا سيما في ضوء إشعياء 40:3؛ فحُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة نبوية كريمة. استُعملت «البرية» و«الرب» و«السبل» لما لها من دقة سياقية ورنين كتابي مفهوم، من غير إفراط في التراكيب القديمة.
