  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: ar
  text: وكان يوحنا نفسه يلبس ثوبًا من وبر الإبل، وعلى وسطه حزام من جلد[a][b][c]، وكان طعامه الجراد والعسل البري.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تذكّر هيئة يوحنا هنا بهيئة النبي إيليا في 2 ملوك 1:8، وهي خلفية مهمة لعرض متى لشخصية يوحنا.
    reason: cross_reference
  - marker: b
    text: 'أو: «كان له ثوب من وبر الإبل».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «كان لباسه من شعر الإبل».'
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: وكان يوحنا نفسه
  rationale: حُفظ توكيد αὐτός بلفظ «نفسه»، ونُقلت δέ بواو استئنافية طبيعية في سياق السرد.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: يلبس ثوبًا
  rationale: الفعل يعني حرفيًا «كان له»، لكنه في هذا السياق يصف ما كان يرتديه يوحنا؛ و«يلبس» عربية طبيعية من غير إيحاء بأنه كلّف أحدًا بصنع الثوب.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: من وبر الإبل
  rationale: تفيد ἀπό هنا مادة الثوب. و«وبر الإبل» تعبير عربي واضح للشعر الذي يُنسج منه الثوب.
- source_word: ζώνην δερματίνην
  choice: حزام من جلد
  rationale: ينقل معنى الحزام ومادته بعبارة عربية مباشرة.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: على وسطه
  rationale: «الوسط» مقابل عربي معاصر وطبيعي لموضع الحزام، بعيد عن اللفظ القديم «الحقوين».
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: وكان طعامه
  rationale: صياغة سردية واضحة تحافظ على الجملة الوصفية الثانية.
- source_word: ἀκρίδες
  choice: الجراد
  rationale: المعنى المعجمي المعتاد هو حشرة الجراد، ولا يقتضي السياق صرفه إلى معنى آخر.
- source_word: μέλι ἄγριον
  choice: العسل البري
  rationale: يحافظ على وصف العسل بأنه موجود في البرية أو غير مستأنس الإنتاج.
theological_decisions:
- issue: هيئة يوحنا الزاهدة وصلتها بإيليا
  choice: تُرجمت أوصاف اللباس والطعام مباشرة، مع وضع الصلة بإيليا في حاشية.
  alternative: إدخال ما يصرّح في المتن بأن يوحنا كان شبيهًا بإيليا.
  rationale: النص يصف هيئة يوحنا وطعامه ولا يصرّح بالتفسير؛ لذلك تُحفظ الإشارة الأدبية دون تحويلها إلى تفسير داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «وبر الإبل» في المتن لأنه طبيعي في وصف مادة الثوب، مع إبقاء «شعر الإبل» بديلًا في الحاشية. وُضعت علامات الحواشي كلها بعد وصف اللباس والحزام لأنها تتصل بهذا الجزء من الآية.
