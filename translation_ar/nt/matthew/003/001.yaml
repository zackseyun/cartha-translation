    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: في تلك الأيام
  rationale: تنقل العبارة الزمنية بوضوح، من غير تضخيم دلالة δέ، وهي أداة ربط خفيفة يمكن أن يؤديها الانتقال السردي في العربية من دون إضافة لفظ مستقل.
- source_word: παραγίνεται
  choice: ظهر
  rationale: يفيد دخول يوحنا إلى المشهد السردي، وهو تعبير عربي طبيعي. صيغ الفعل اليوناني بالمضارع التاريخي، لكن الماضي أنسب للسرد العربي هنا.
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية المعيارية للاسم في السياق الكتابي.
- source_word: ὁ βαπτιστὴς
  choice: المعمدان
  rationale: لقب عربي راسخ وطبيعي ليوحنا، مع إثبات البديل الأكثر شفافية من جهة وظيفة اللقب في الحاشية.
- source_word: κηρύσσων
  choice: وهو يكرز
  rationale: ينقل اسم الفاعل اليوناني الدال على فعل متزامن مع ظهور يوحنا، ويحافظ على معنى المناداة العلنية في صياغة عربية واضحة.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: في برية اليهودية
  rationale: «البرية» تدل على المنطقة المقفرة أو قليلة العمران من دون حصرها في صحراء رملية، و«اليهودية» اسم الإقليم التاريخي.
theological_decisions:
- issue: ترجمة لقب يوحنا βαπτιστής
  choice: المعمدان
  alternative: المُعمِّد
  rationale: المسألة معجمية لا مذهبية. يحافظ «المعمدان» على اللقب العربي المعروف، بينما يوضح البديل صلة اللقب بفعل التعميد من غير تحميل النص دلالة طائفية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل الماضي للسرد الطبيعي، مع توثيق المضارع التاريخي في الحاشية، وحُفظت الصلة الزمنية بين ظهور يوحنا وكرازته بصيغة «وهو يكرز».
