  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: ar
  text: 'لكن يسوع أجابه: «اسمح بهذا الآن، لأنه هكذا يليق بنا أن نتمّم كلَّ برّ[a]». حينئذ سمح له يوحنا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كل عدل». يمكن للكلمة اليونانية أن تدل على البر أو العدل؛ و«البر» أنسب هنا لتأكيد متّى على التوافق مع مشيئة الله.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: لكن يسوع أجابه
  rationale: تؤدي «أجابه» معنى التركيب اليوناني الاصطلاحي «أجاب وقال» بصياغة عربية طبيعية، وتفيد «لكن» المقابلة مع اعتراض يوحنا في الآية السابقة.
- source_word: Ἄφες ἄρτι
  choice: اسمح بهذا الآن
  rationale: الفعل هنا بمعنى السماح لا الغفران أو الترك، و«بهذا» تُظهر أن المقصود هو المضي في المعمودية، بينما تحفظ «الآن» الدلالة الزمنية المباشرة.
- source_word: οὕτως γὰρ
  choice: لأنه هكذا
  rationale: تحفظ «هكذا» الإشارة إلى الكيفية المذكورة في السياق، أي أن يعمّد يوحنا يسوع.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: يليق بنا
  rationale: تعبير عربي طبيعي يحفظ معنى الملاءمة والصواب الأدبي والسياقي في πρέπον.
- source_word: πληρῶσαι
  choice: أن نتمّم
  rationale: «نتمّم» تحفظ صدى استعمال πληρόω المتكرر في متّى، بما يشمل إنجاز القصد الإلهي دون حصره في مجرد الإكمال الكمي.
- source_word: πᾶσαν δικαιοσύνην
  choice: كلَّ برّ
  rationale: «البرّ» هو المقابل الكتابي العربي الواضح لـδικαιοσύνη، ويحفظ سعة العبارة وإشارتها إلى موافقة مشيئة الله من غير اختزالها في مطلب قانوني محدد.
- source_word: τότε ἀφίησιν αὐτόν
  choice: حينئذ سمح له
  rationale: يُفهم المضارع اليوناني هنا بوصفه مضارعًا تاريخيًا، لذلك جاء الماضي طبيعيًا في السرد العربي. والسياق يبين أن يوحنا أذعن وسمح ليسوع بالمعمودية.
theological_decisions:
- issue: معنى «كل برّ»
  choice: إشارة واسعة إلى إتمام ما يوافق مشيئة الله البارة في هذا الموقف، ولا سيما قبول يسوع المعمودية من يوحنا.
  alternative: قد تُفهم بمعنى «كل عدل» أو، على نحو أضيق، إتمام جميع المتطلبات الشرعية.
  rationale: تحفظ الصياغة سعة التعبير اليوناني والتوتر اللاهوتي فيه، من غير قصره على حفظ الشريعة ولا توسيعه إلى منظومة عقائدية غير مصرّح بها في الآية.
translation_notes:
  register: العربية فصحى معاصرة واضحة وكريمة النبرة. حافظت الصياغة على إيجاز الأصل وعلى تكرار معنى «السماح» في مطلع القول وخاتمة الآية، ووضعت علامة الحاشية مباشرة بعد اللفظ الذي تشرحه.
