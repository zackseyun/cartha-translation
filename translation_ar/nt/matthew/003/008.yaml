  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: ar
  text: فأثمروا إذًا ثمرًا يليق بالتوبة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثمرًا يتفق مع التوبة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: فأثمروا
  rationale: فعل أمر موجَّه إلى الجمع. ومع أن المعنى الحرفي هو «اصنعوا»، فإن «أثمروا ثمرًا» تعبير عربي طبيعي يحافظ على صورة الثمر وعلى قوة الأمر.
- source_word: οὖν
  choice: إذًا
  rationale: تُظهر النتيجة المترتبة على التحذير والدعوة السابقين، وتؤدي معنى الربط الاستنتاجي بصورة طبيعية.
- source_word: καρπὸν
  choice: ثمرًا
  rationale: يحافظ على الاستعارة الأصلية التي تشير إلى الأثر الظاهر في السلوك، مع إبقاء المفرد بمعناه الجمعي.
- source_word: ἄξιον
  choice: يليق بـ
  rationale: ينقل معنى الملاءمة والتوافق الذي تحمله الصفة مع المضاف إليه، من غير أن يوحي بأن الثمر يستحق التوبة أو يشتريها.
- source_word: μετανοίας
  choice: التوبة
  rationale: المقابل العربي الراسخ والطبيعي هنا، ويدل في السياق على رجوع حقيقي يظهر أثره في الحياة.
theological_decisions:
- issue: معنى العبارة καρπὸν ἄξιον τῆς μετανοίας
  choice: ثمر ظاهر في السلوك يليق بالتوبة ويتوافق معها
  alternative: ثمر يكسب التوبة أو يعادلها قيمةً
  rationale: تركيب ἄξιον مع المضاف إليه يدل هنا على الملاءمة والتوافق، لا على الاستحقاق أو المقايضة. وتُبقي الصياغة مطلب النص الأخلاقي من غير إدخال مفهوم الأعمال المستحقة.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة وذات نبرة أمرية كريمة. استُخدم «أثمروا ثمرًا» بدل «اصنعوا ثمرًا» لطبيعته في العربية، مع الحفاظ على الاستعارة الأصلية.
