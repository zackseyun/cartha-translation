  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: ar
  text: ولما عُمِّدَ يسوعُ، صعد فورًا من الماء[a]. وإذا السماوات قد فُتحت، ورأى روحَ الله نازلًا كحمامة[b] ومُقبِلًا عليه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «صعد خارجًا من الماء». يقول اليوناني حرفيًا: «من الماء» (ἀπὸ τοῦ ὕδατος).'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «نازلًا كما تنزل حمامة». تستعمل اليونانية أداة تشبيه بمعنى «كـ» أو «كما لو أن».'
    reason: alternative_reading
  - marker: c
    text: 'تترجم بعض الصياغات المعنى: «وحالًّا عليه» أو «وحاطًّا عليه»، لكن الفعل اليوناني يعني، على نحو أقرب إلى الحرفية، «مُقبِلًا» أو «آتيًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: وبعد أن عُمِّدَ يسوعُ
  rationale: اسم الفاعل اليوناني ماضٍ مبني للمجهول، ويدل هنا على حدث يسبق الفعل الرئيس. تصون الصياغة العربية المبني للمجهول وتسلسل الحدث من غير إطالة.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: صعد فورًا من الماء
  rationale: تنقل «فورًا» معنى السرعة في εὐθύς، وتحافظ «من الماء» على دلالة ἀπό من غير تقويتها إلى «من داخل الماء».
- source_word: ἰδοὺ
  choice: وإذا
  rationale: أداة عربية فصيحة حية تسترعي الانتباه إلى المشهد المفاجئ، وتؤدي وظيفة ἰδού السردية طبيعيًا.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: السماوات قد فُتحت
  rationale: يحافظ الجمع «السماوات» على صيغة الأصل، ويحافظ المبني للمجهول على البنية اليونانية.
- source_word: πνεῦμα θεοῦ
  choice: روحَ الله
  rationale: نقل مباشر للتركيب الإضافي، من غير استبداله صراحة بلقب «الروح القدس» أو جعله روحًا غير معيّن.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: نازلًا كحمامة
  rationale: يحفظ اسم الفاعل حركة النزول، وتحفظ الكاف أداة التشبيه من غير القول إن الروح كان حمامة حرفيًا.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: وآتيًا عليه
  rationale: تنقل «آتيًا» المعنى العام للفعل ἔρχομαι، و«عليه» اتجاه الحركة، من غير تخصيصها بمعنى «حطّ» الذي لا يصرح به الأصل.
theological_decisions:
- issue: هل πνεῦμα θεοῦ تعبير عام أم إشارة إلى الروح القدس؟
  choice: روح الله
  alternative: الروح القدس؛ روح من الله
  rationale: سياق معمودية يسوع يرجّح الإشارة إلى الروح القدس، لكن الترجمة تبقي عبارة الأصل نفسها ولا تستبدل بها لقبًا تفسيريًا.
- issue: هل كان الروح حمامة حرفيًا أم كان نزوله على نحو يشبه الحمامة؟
  choice: نازلًا كحمامة
  alternative: نازلًا كما تنزل حمامة
  rationale: ὡσεὶ أداة تشبيه، لذلك لا تجزم الصياغة بأن الروح اتخذ بالضرورة هوية حمامة، كما تبقي مجال التشبيه في الهيئة أو كيفية النزول مفتوحًا.
- issue: هل يعني ἐρχόμενον أن الروح حطّ على يسوع؟
  choice: وآتيًا عليه
  alternative: وحالًّا عليه
  rationale: الفعل اليوناني يعني المجيء أو الإتيان، ولا يحدد بذاته فعل الحطّ؛ لذا اختيرت عبارة لا تضيف تفصيلًا حركيًا غير منصوص عليه.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «عُمِّدَ» لإظهار المبني للمجهول بوضوح، و«وإذا» لاستحضار قوة الالتفات في ἰδού. وُضعت علامات الحواشي عند العبارات التي تشرحها مباشرة.
