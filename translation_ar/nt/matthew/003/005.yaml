  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: ar
  text: حينئذ كان الناس يخرجون إليه[a] من أورشليم، ومن كلِّ اليهودية، ومن كلِّ المنطقة المحيطة بنهر الأردن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ظلّ الناس يخرجون إليه»؛ فصيغة الفعل اليونانية تفيد الاستمرار أو التكرار في الماضي.'
    reason: lexical_alternative
  - marker: b
    text: «كل اليهودية» و«كل المنطقة المحيطة بنهر الأردن» تعبيران جغرافيان واسعان يصفان انتشار الإقبال على يوحنا، ولا يلزم أن يقصدا كل فرد من السكان بلا استثناء.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: أداة زمنية تربط الإقبال على يوحنا بخدمته المذكورة في السياق السابق، و«حينئذ» فصيحة وطبيعية.
- source_word: ἐξεπορεύετο
  choice: كان الناس يخرجون
  rationale: صيغة الماضي الناقص اليونانية تدل على فعل مستمر أو متكرر. يحفظ التركيب «كان ... يخرجون» هذا الجانب، وأُظهر «الناس» في العربية لأن أسماء المناطق في الأصل تشير إلى سكانها.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: تدل πρός مع فعل الحركة على الاتجاه نحو شخص، والضمير هنا يعود إلى يوحنا.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الاسم العربي الكتابي الشائع للمدينة.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: كلِّ اليهودية
  rationale: يحافظ على التعبير الجغرافي الشامل من غير أن يفرض أن المقصود كل فرد بلا استثناء.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: كلِّ المنطقة المحيطة بالأردن
  rationale: تنقل περίχωρος بمعنى المنطقة أو الناحية المحيطة، وتحافظ على المرجع الجغرافي لنهر الأردن بصياغة عربية واضحة.
- source_word: καὶ ... καὶ
  choice: ومن ... ومن
  rationale: تكرار حرف العطف مع «من» يوضح في العربية أن الناس خرجوا من المناطق الثلاث، ويحفظ التعداد التراكمي.
theological_decisions:
- issue: مدى الشمول في ذكر أورشليم وكل اليهودية وكل منطقة الأردن
  choice: الإبقاء على الألفاظ الجغرافية الشاملة مع بيان أنها تصف انتشار الاستجابة على نطاق واسع
  alternative: التصريح في المتن بعبارة «جموع كثيرة من» أو فهمها على أنها تشمل كل فرد حرفيًا
  rationale: يستخدم النص أسماء المناطق للدلالة على سكانها وتعبيرات شاملة تصف اتساع الإقبال على يوحنا. لا ينبغي تضييقها بإضافة «كثيرون» إلى المتن ولا تحميلها معنى إحصائيًا صارمًا.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُخدم «الناس ... من» بدل إسناد الخروج حرفيًا إلى المدن والمناطق، لأن هذا هو الأسلوب العربي الطبيعي في نقل المجاز المكاني، مع إبقاء شمول المناطق وترتيبها. وُضع حرف الجر قبل كل منطقة لتجنب توهم أن «كل» تعطف السكان على اسم المدينة بوصفها كيانات تخرج بذاتها.
