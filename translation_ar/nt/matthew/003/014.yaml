review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: «ظلّ يحاول أن يمنعه» ينقل بصورة جيدة دلالة الماضي الناقص في διεκώλυεν، والسؤال الاستنكاري محفوظ. لكن «أن أعتمد على يدك» غير دقيق اصطلاحيًا هنا؛ إذ إن «اعتمد» في الاستعمال العربي المعاصر لا يؤدي بوضوح معنى تلقّي المعمودية، وقد يُفهم بمعانٍ أخرى. يلزم «أن أتعمّد على يدك» لإظهار أن يوحنا هو متلقي المعمودية وأن يسوع هو فاعلها.'
  naturalness: الصياغة فصيحة وطبيعية في معظمها. «أن أتعمّد على يدك» هي العبارة العربية الكتابية الحديثة الأوضح والأكثر رسوخًا من «أن أعتمد على يدك».
  terminology: ينبغي اعتماد «أتعمّد» للمبني للمجهول اليوناني βαπτισθῆναι من حيث الوظيفة والمعنى. و«على يدك» مناسب لترجمة الوكالة الشخصية في ὑπὸ σοῦ. يلزم كذلك تعديل الحاشية كي تطابق البديل الإنجليزي وتعبّر عن معنى المحاولة، لا مجرد وقوع المنع.
  issues:
  - severity: medium
    issue: الفعل «أعتمد» في «أن أعتمد على يدك» لا يعبّر بوضوح عن تلقّي المعمودية.
    rationale: βαπτισθῆναι مصدر مبني للمجهول مع ὑπὸ σοῦ، ومعناه أن يتلقى يوحنا المعمودية من يسوع. «أتعمّد» هو المقابل العربي الطبيعي والمستقر لهذا المعنى.
  - severity: low
    issue: بديل الحاشية «كان يمنعه» لا يحافظ على عنصر المحاولة الظاهر في البديل الإنجليزي المعتمد.
    rationale: يمكن للماضي الناقص أن يدل على فعل مستمر أو متكرر، والسياق يسمح بإبراز محاولة المنع؛ لذا «حاول يوحنا أن يمنعه» أدق بديلًا وأوضح اتصالًا بتفسير الحاشية.
