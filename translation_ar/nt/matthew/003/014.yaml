  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: ar
  text: 'لكن يوحنا ظلَّ يحاول أن يمنعه[a]، قائلًا: «أنا أحتاج أن أتعمّد على يدك، وأنت تأتي إليَّ؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حاول يوحنا أن يمنعه». قد تدل صيغة الفعل اليوناني في الماضي الناقص على محاولة مستمرة أو متكررة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: ظلَّ يحاول أن يمنعه
  rationale: ينقل صيغة الماضي الناقص بوصفها مقاومة مستمرة أو محاولة متكررة، من غير اختزالها في فعل ماضٍ بسيط.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على الصلة الحالية بين محاولة يوحنا منعه وبين الكلام الذي يعلل به موقفه.
- source_word: χρείαν ἔχω
  choice: أنا أحتاج
  rationale: تعبير عربي حديث وطبيعي ينقل معنى العبارة اليونانية «لي حاجة» بوضوح.
- source_word: ὑπὸ σοῦ
  choice: على يدك
  rationale: ينقل فاعل الفعل المبني للمجهول بصياغة عربية طبيعية، ويوضح أن يسوع هو الذي يجري المعمودية، من غير تحديد لطريقتها.
- source_word: βαπτισθῆναι
  choice: أن أعتمد
  rationale: يحافظ على المبني للمجهول وعلى المصطلح الكتابي المستقر، من غير إضافة تصور خاص عن كيفية المعمودية.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: وأنت تأتي إليَّ؟
  rationale: يحفظ السؤال الاستنكاري والمضارع اليوناني من غير إضافة «مع ذلك» أو تفسير زائد لوجه المفارقة.
- source_word: δὲ
  choice: لكن
  rationale: يبين التباين اللطيف مع مجيء يسوع إلى يوحنا في السياق السابق.
theological_decisions:
- issue: اعتراض يوحنا على تعميد يسوع
  choice: إبقاء قول يوحنا اعترافًا بحاجته إلى أن يعتمد على يد يسوع وبالمفارقة في مجيء يسوع إليه، من غير تفسير عقائدي إضافي.
  alternative: تحديد الاعتراض صراحة بأنه راجع إلى عصمة يسوع من الخطية، أو إلى رتبته وسلطانه وحدهما.
  rationale: الآية تقر بحاجة يوحنا وتفوق يسوع، لكنها لا تصرح هنا بالأساس اللاهوتي الكامل لذلك؛ لذا ينبغي حفظ التوتر الذي في النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «ظلَّ يحاول» لإظهار الجانب الاستمراري، و«على يدك» بدل الصياغة الحرفية الجامدة «بواسطتك».
