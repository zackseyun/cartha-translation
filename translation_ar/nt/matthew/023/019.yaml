source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: ar
  text: 'أيها العميان، فأيهما أعظم: القربان[a] أم المذبح الذي يقدِّس القربان[b]؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العطية».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: «يجعل القربان مقدسًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: أيها العميان
  rationale: صفة في صيغة النداء لجمع المذكر استُعملت استعمال الاسم. تحافظ الصياغة على المخاطبة المباشرة والتوبيخ من غير إضافة لفظ «الجهال» غير الموجود في هذه الآية.
- source_word: τί γὰρ μεῖζον
  choice: فأيهما أعظم
  rationale: «أيهما» تلائم المفاضلة بين القربان والمذبح، و«أعظم» تحفظ معنى المقارنة، أما الفاء فتنقل القوة التفسيرية لـγάρ بصورة عربية طبيعية.
- source_word: τὸ δῶρον
  choice: القربان
  rationale: يدل δῶρον في هذا السياق الخاص بالهيكل والمذبح على ما يُقدَّم لله. «القربان» أوضح للقارئ العربي من «العطية» مع إبقاء البديل في الحاشية.
- source_word: θυσιαστήριον
  choice: المذبح
  rationale: المقابل العربي المألوف والدقيق للمذبح في السياق التعبدي.
- source_word: τὸ ἁγιάζον
  choice: الذي يقدِّس
  rationale: ينقل اسم الفاعل اليوناني الدال على أن المذبح يضفي صفة القداسة على القربان، ويحافظ على الثقل الديني للفعل من غير شرح زائد.
theological_decisions:
- issue: لغة القداسة في علاقة المذبح بالقربان
  choice: الذي يقدِّس القربان
  alternative: الذي يجعل القربان مقدسًا
  rationale: تحافظ «يقدِّس» على منطق القداسة التعبدي في حجة يسوع وعلى الصلة المعجمية المباشرة بالفعل ἁγιάζω، من غير حصر المعنى في إجراء طقسي فحسب.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة ومباشرة. استُخدم «أيها العميان» لحفظ صيغة النداء، ووُضعت نقطتان لإبراز السؤال المقارن. جميع علامات الحواشي مثبتة عند الألفاظ التي تشرحها.
