lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يحفظ اتصال القول بما سبقه واستمرار النبرة التوبيخية.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: أُثبت الضمير المنفصل لإبراز التوكيد الموجود في اليونانية، مع صيغة الجمع.
- source_word: πληρώσατε
  choice: املأوا
  rationale: فعل أمر ماضوي الصيغة في اليونانية، للمخاطب الجمع؛ وتحفظ الترجمة صورة ملء مقدار حتى يبلغ غايته.
- source_word: τὸ μέτρον
  choice: مكيال
  rationale: «مكيال» تعبير عربي طبيعي عن مقدار يُملأ، فيحفظ الاستعارة الكمية دون أن يضيف صراحةً كلمة «الخطايا» غير الواردة في النص.
- source_word: τῶν πατέρων ὑμῶν
  choice: آبائكم
  rationale: يحفظ اللفظ الحرفي والامتداد البلاغي للحديث عن الآباء، مع أن المقصود في السياق الأسلاف.
theological_decisions:
- issue: هل العبارة أمر أم تنبؤ، وما قوتها البلاغية؟
  choice: 'صيغة أمر ذات قوة تهكمية قضائية: «املأوا مكيال آبائكم».'
  alternative: «أنتم تملأون» أو «ستملأون مكيال آبائكم».
  rationale: الصيغة اليونانية πληρώσατε أمر للمخاطب الجمع؛ لذلك حُفظ الأمر كما هو، من غير تحويله إلى خبر أو تنبؤ، مع إبقاء التوتر الناتج من كونه توبيخًا يدعوهم بلاغيًا إلى إتمام نهج آبائهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «مكيال» بدل «مقدار» لأن فعل «املأوا» ينسجم معه طبيعيًا ويحافظ على الصورة، وأُبقي «آبائكم» في المتن مع شرح المعنى السياقي في الحاشية.
