  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: ar
  text: ولا تُدعَوا مُرشِدين، لأن مُرشِدكم واحد، وهو المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح.'
    reason: إيضاح المعنى الحرفي للقب اليوناني Χριστός والمقابل العبري له، مع إبقاء اللقب العربي المألوف في المتن.
lexical_decisions:
- source_word: μηδὲ
  choice: ولا
  rationale: تحفظ الصلة بالنواهي السابقة، وتأتي طبيعية في سياق الخطاب العربي.
- source_word: κληθῆτε
  choice: تُدعَوا
  rationale: تنقل صيغة المبني للمجهول والإشارة إلى اتخاذ اللفظ لقبًا يُخاطَبون به.
- source_word: καθηγηταί / καθηγητής
  choice: مُرشِدين / مُرشِدكم
  rationale: تفيد من يقود ويوجّه بالتعليم، مع الحفاظ على تمييزها من لفظ «المعلّم» الوارد في السياق القريب.
- source_word: ὅτι
  choice: لأن
  rationale: تقدّم سبب النهي بوضوح وطبيعية في العربية المعاصرة.
- source_word: ὑμῶν ἐστιν εἷς
  choice: مُرشِدكم واحد
  rationale: تحافظ على تركيب الملكية وعلى التشديد اليوناني على وحدانية المرشد.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: تنقل اللقب اليوناني إلى مقابله العربي الراسخ وتحفظ دلالته المسيانية.
theological_decisions:
- issue: دلالة ὁ χριστός
  choice: المسيح
  alternative: المسيح المنتظر
  rationale: «المسيح» هو المقابل العربي المألوف للقب، ولا تستلزم الآية إضافة تفسيرية مثل «المنتظر» إلى المتن.
- issue: العلاقة بين الواحد والمسيح
  choice: مُرشِدكم واحد، وهو المسيح
  alternative: مُرشِدكم هو الواحد، المسيح
  rationale: يجعل عائد الجملة واضحًا بالعربية من غير أن يغيّر حصر مقام الإرشاد في المسيح.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «مُرشِد» بدل «معلّم» لتجنّب طمس الفرق المعجمي مع διδάσκαλος في الآيات القريبة، مع الإبقاء على صيغة اللقب والنهي عن التسمّي به.
