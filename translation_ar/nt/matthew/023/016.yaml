base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: ar
  text: '«ويلٌ لكم، أيها المرشدون العميان، القائلون: مَن حلف بالهيكل فلا قيمة له[a]، وأما مَن حلف بذهب الهيكل فهو مُلزَم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «لا شيء هو»؛ أي إنهم لا يعتدّون بهذا الحلف على أنه مُلزِم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: ويلٌ لكم
  rationale: صيغة عربية فصيحة مألوفة تحفظ قوة التنديد والتحذير النبوي في الأصل.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: الأدلاء العميان
  rationale: تحفظ صورة مَن يرشد غيره إلى الطريق مع كونه أعمى، وهي أدق من تعبير عام مثل «القادة».
- source_word: οἱ λέγοντες
  choice: القائلون
  rationale: ينقل اسم الفاعل المعرّف في صياغة عربية موجزة وطبيعية.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: مَن حلف
  rationale: يؤدي معنى الشرط العام غير المحدد الذي تفيده الصلة مع ἄν وصيغة الالتزام.
- source_word: ἐν τῷ ναῷ
  choice: بالهيكل
  rationale: حرف الباء هو الصيغة العربية الطبيعية للحلف بشيء، وينقل الوظيفة الاصطلاحية لـἐν في هذا السياق.
- source_word: οὐδέν ἐστιν
  choice: فلا شيء عليه
  rationale: يبيّن الإضمار المتعلق بعدم الإلزام مع الحفاظ على إيجاز العبارة، ويتجنب التعبير العربي الملتبس «فهو لا شيء».
- source_word: χρυσῷ τοῦ ναοῦ
  choice: بذهب الهيكل
  rationale: ينقل الإضافة بوضوح ويحفظ المقابلة بين الهيكل نفسه وذهبه.
- source_word: ὀφείλει
  choice: فهو مُلزَم
  rationale: ينقل معنى الوجوب أو الالتزام في سياق الأيمان دون إضافة مفعول غير مذكور صراحة في اليونانية.
theological_decisions:
- issue: الإضمار في حكمي اليمين
  choice: «فلا شيء عليه ... فهو مُلزَم»
  alternative: «فهو لا شيء ... عليه دَين» أو «فلا يلزمه شيء ... فهو ملزم بيمينه»
  rationale: السياق يتناول التفريق بين يمين تُعَد غير ملزمة وأخرى تُعَد ملزمة. الصياغة المختارة توضّح المقابلة للقارئ العربي، لكنها لا تضيف «بيمينه» إلى الشطر الثاني، لأن الأصل يكتفي بالفعل ὀφείλει.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «الهيكل» للمقدس في أورشليم، و«الأدلاء» للمحافظة على استعارة الإرشاد. وُضعت علامة الحاشية [a] في المتن كما تقتضي الحاشية.
