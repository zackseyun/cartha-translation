  source_fidelity: 'النص العربي ينقل البنية الأساسية للنص اليوناني بأمانة: الشخص الذي يحلف بالهيكل يحلف بالهيكل نفسه وبالساكن فيه. واستعمال الباء في «بالهيكل/به» مناسب لصيغة القسم في السياق، مع أن ἐν معناها الحرفي «في». كما أن «الساكن فيه» يحفظ الإحالة الضمنية إلى الله دون إدخال لفظ غير مذكور صراحة في المتن.'
