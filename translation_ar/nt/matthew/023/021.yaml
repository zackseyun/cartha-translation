  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: ar
  text: ومن حلف بالهيكل، فهو يحلف به وبالساكن فيه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الهيكل... فيه»؛ فحرف الجر اليوناني يعني حرفيًا «في»، لكنه في صيغة القسم هنا يفيد معنى «بـ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: من حلف
  rationale: اسم الفاعل الماضي المعرّف مستعمل استعمالًا اسميًا عامًا؛ وهذه الصياغة العربية طبيعية وتحافظ على معنى كل من يفعل ذلك.
- source_word: ἐν τῷ ναῷ
  choice: بالهيكل
  rationale: مع أن ἐν تعني حرفيًا «في»، فإنها في صيغة القسم هنا تدل على ما يُحلَف به، فتؤديها الباء العربية بوضوح.
- source_word: ναῷ
  choice: الهيكل
  rationale: ναός يشير إلى الهيكل، ولا سيما موضعه المقدس؛ و«الهيكل» هو اللفظ العربي الواضح والمألوف في هذا السياق.
- source_word: ὀμνύει
  choice: فهو يحلف
  rationale: المضارع يقرر النتيجة أو المبدأ العام المترتب على ذلك القسم، وإضافة الضمير تحقق سلاسة الربط بالعربية.
- source_word: ἐν αὐτῷ
  choice: به
  rationale: تتكرر دلالة صيغة القسم نفسها، والضمير يعود إلى الهيكل.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: بالساكن فيه
  rationale: يحافظ اسم الفاعل على الصورة الأصلية لسكنى الله في الهيكل، من غير إضافة تفسير صريح إلى المتن.
theological_decisions:
- issue: هوية الساكن في الهيكل
  choice: الإبقاء على التعبير الضمني «الساكن فيه» الذي يشير في السياق إلى الله
  alternative: «الله الساكن فيه»
  rationale: السياق يوضح أن المقصود هو الله، لكن النص اليوناني لا يذكر لفظ «الله» صراحة؛ لذلك يحفظ المتن ضمنية الأصل ويتجنب الإضافة التفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الهيكل» للمصطلح الديني المألوف، وصيغت الجملة بأسلوب طبيعي مع الحفاظ على تكرار فعل الحلف وعلى ضمنية هوية الساكن.
