id: MAT.23.27
reference: Matthew 23:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: ar
  text: الويل لكم، أيها الكتبة والفريسيون المراؤون! لأنكم تشبهون قبورًا مبيَّضة[a]، تبدو جميلة من الخارج، لكنها من الداخل مملوءة بعظام الموتى وبكل نجاسة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: قبورًا مطلية بالكلس.'
    reason: lexical_alternative
  - marker: b
    text: قد تشمل «النجاسة» هنا كلاً من النجاسة الطقسية والفساد الأخلاقي.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: الويل
  rationale: يحافظ على قوة إعلان الدينونة والتوبيخ النبوي، بخلاف تعبيرات التحسر الأخف.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: التسمية العربية المألوفة والدقيقة لهذه الفئة من علماء الشريعة اليهود.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: النقل العربي المستقر لاسم هذه الجماعة.
- source_word: ὑποκριταί
  choice: المراؤون
  rationale: ينقل معنى التظاهر الديني والأخلاقي الكاذب بوضوح في العربية المعاصرة.
- source_word: παρομοιάζετε
  choice: تشبهون
  rationale: صياغة عربية طبيعية للمقارنة المباشرة، من غير اللجوء إلى مبني للمجهول ثقيل.
- source_word: τάφοις κεκονιαμένοις
  choice: قبورًا مبيَّضة
  rationale: يحافظ على صورة القبور التي غُطيت بالكلس لتبدو بيضاء، مع إيضاح المادة في الحاشية.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: من الخارج ... لكنها من الداخل
  rationale: يحافظ على التضاد البلاغي بين المظهر الخارجي والحقيقة الداخلية.
- source_word: φαίνονται ὡραῖοι
  choice: تبدو جميلة
  rationale: ينقل التركيز على المظهر المرئي لا الحقيقة الباطنة.
- source_word: γέμουσιν
  choice: مملوءة
  rationale: ترجمة طبيعية لفعل الامتلاء مع الحفاظ على وصف الحالة الحاضرة.
- source_word: ὀστέων νεκρῶν
  choice: عظام الموتى
  rationale: صياغة عربية واضحة ودقيقة للإضافة اليونانية.
- source_word: πάσης ἀκαθαρσίας
  choice: كل نجاسة
  rationale: يحافظ على عموم اللفظ، فلا يحصره في النجاسة الطقسية أو الفساد الأخلاقي.
theological_decisions:
- issue: دلالة ἀκαθαρσία في الاستعارة
  choice: كل نجاسة
  alternative: كل دنس طقسي؛ كل فساد أخلاقي
  rationale: صورة القبور تستحضر النجاسة الطقسية في السياق اليهودي، بينما يوجّه التوبيخ أيضًا إلى الفساد الأخلاقي الباطن؛ لذلك تُرك اللفظ واسع الدلالة حفاظًا على هذا التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «المراؤون» لبيان التظاهر الديني الكاذب، و«مبيَّضة» لصون الصورة الموجزة مع شرح الكلس في الحاشية. وُضعت علامتا الحاشيتين بجوار العبارتين اللتين تشرحانهما.
