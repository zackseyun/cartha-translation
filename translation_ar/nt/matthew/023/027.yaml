review_pass:
  verdict: approve
  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني كاملةً: «الويل» للتنديد، وتسمية الكتبة والفريسيين، ووصفهم بالمرائين، وصورة القبور المبيَّضة، والتقابل بين الظاهر والباطن، وعظام الموتى وعموم «كل نجاسة». كما أن «تشبهون» تؤدي المقارنة المباشرة في παρομοιάζετε أداءً سليمًا.'
  naturalness: الصياغة فصيحة معاصرة وواضحة، والتراكيب «تبدو جميلة من الخارج، لكنها من الداخل مملوءة...» طبيعية وتحافظ على قوة المقابلة البلاغية. مطابقة الفعل والضمير المؤنث المفرد مع جمع غير العاقل («قبورًا») سليمة عربيًا.
  terminology: «الكتبة»، «الفريسيون»، و«المراؤون» مناسبة للسجل الكتابي العربي من غير تحميل لفظ «المنافقون» بدلالات لاحقة. و«النجاسة» تحافظ على سعة ἀκαθαρσία، والحاشية تشرح إمكان البعدين الطقسي والأخلاقي دون حسم أحدهما.
