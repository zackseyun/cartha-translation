source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: ar
  text: لذلك، ها أنا أرسل إليكم أنبياء وحكماء وكتبة. فمنهم من ستقتلون وتصلبون، ومنهم من ستجلدون في مجامعكم وتضطهدونهم من مدينة إلى مدينة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها أنا
  rationale: تعبير عربي طبيعي يحافظ على أداة التنبيه مع الضمير ἐγώ، ويبرز ما يوشك المتكلم أن يعلنه.
- source_word: γραμματεῖς
  choice: كتبة
  rationale: المقابل الاصطلاحي المألوف لفئة الكتبة الدينية والمتعلمين بالناموس في سياق متى.
- source_word: μαστιγώσετε
  choice: ستجلدون
  rationale: ينقل بوضوح معنى الضرب بالسوط بوصفه عقوبة.
- source_word: διώξετε
  choice: تطاردون
  rationale: يلائم حركة الاضطهاد المتواصل من مدينة إلى أخرى، ولا يقصر المعنى على ملاحقة عابرة.
theological_decisions:
- issue: هوية المتكلم وسلطته في الإرسال
  choice: ها أنا أرسل
  alternative: ها أنا سأرسل
  rationale: المضارع اليوناني ἀποστέλλω هو «أرسل»، وصياغته كما هي تحفظ قوة إعلان يسوع المباشر من غير تفسير لاهوتي إضافي.
- issue: توزيع الأفعال على المرسلين
  choice: فمنهم من ستقتلون وتصلبون، ومنهم من ستجلدون...
  alternative: ستقتلون بعضهم وتصلبونهم، وتجلدون بعضهم...
  rationale: يحافظ هذا على بنية ἐξ αὐτῶν المتكررة وعلى احتمال أن تصف الأفعال المتعاقبة أفرادًا أو فئات ضمن الجماعة، من غير حسم زائد.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة. استُعملت «ها أنا» بدل ترجمة حرفية ثقيلة لـ«انظر»، وحُفظت المصطلحات السياقية «أنبياء وحكماء وكتبة» والتوازي البلاغي في الآية.
