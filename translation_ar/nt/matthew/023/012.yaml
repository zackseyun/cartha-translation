- source_word: ταπεινώσει ἑαυτὸν
  choice: يضع نفسه
  rationale: ينقل معنى خفض النفس ويحافظ على التضاد التصويري مع الرفع، في عبارة عربية واضحة.
- source_word: ὑψωθήσεται
  choice: سيُرفَع
  rationale: يحفظ المبني للمجهول والتوازي اللفظي مع «يرفع نفسه»، من غير التصريح بالفاعل.
theological_decisions:
- issue: فاعل المبني للمجهول
  choice: إبقاء «سيُوضَع» و«سيُرفَع» مبنيين للمجهول من دون تسمية الفاعل
  alternative: التصريح بأن الله هو الذي يضع ويرفع
  rationale: النص اليوناني لا يسمّي الفاعل صراحة؛ والإبقاء على المبني للمجهول يصون الانفتاح الدلالي مع احتمال الإيحاء بالفاعل الإلهي.
- issue: العموم مع الصيغة المذكرة المفردة
  choice: استعمال «مَن» العامة مع «نفسه»
  alternative: صياغة محايدة بالجمع مثل «أنفسهم»
  rationale: «مَن» العربية عامة بطبيعتها، بينما يحفظ الضمير المفرد المذكر صورة الأصل النحوية التمثيلية من غير حصر المعنى في الرجال.
- issue: دلالة الرفع والخفض
  choice: 'الحفاظ على الصورة المكانية: «يرفع/يضع»'
  alternative: 'التفسير المباشر: «يتكبر/يُذل» و«يتواضع/يُكرم»'
  rationale: الصياغة التصويرية تحفظ التوازي والتوتر الدلالي في الأصل، ولا تختزل المعنى في تفسير أخلاقي واحد.
