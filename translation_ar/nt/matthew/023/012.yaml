- source_word: δὲ
  choice: أمّا
  rationale: تفيد الانتقال مع شيء من المقابلة بالسياق السابق، وتلائم بناء الجملتين المتوازيتين.
- source_word: ὑψώσει ἑαυτὸν
  choice: يرفع نفسه
  rationale: يحافظ على صورة الرفع وعلى الفعل الانعكاسي الدال هنا على تعظيم المرء لنفسه.
- source_word: ταπεινωθήσεται
