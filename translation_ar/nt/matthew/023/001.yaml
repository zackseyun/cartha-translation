  text: حينئذٍ كلَّم يسوع الجموع وتلاميذه،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: ظرف زمان يدل على تتابع أحداث السرد، و«حينئذٍ» صياغة عربية واضحة وموجزة تحافظ على الصلة بما سبق.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: اسم علم؛ أداة التعريف في اليونانية من أساليب السرد المعتادة ولا تُنقل قبل أسماء الأعلام في العربية.
- source_word: ἐλάλησεν
  choice: كلَّم
  rationale: فعل ماضٍ يدل هنا على توجيه الكلام إلى المذكورين بعده. «كلَّم» طبيعية مع المفعول به وتحافظ على بساطة الفعل من غير إضافة معنى الوعظ أو التعليم.
- source_word: τοῖς ὄχλοις
  choice: الجموع
  rationale: يحافظ هذا الاختيار على صيغة الجمع في الأصل، وهو أفصح وأيسر هنا من «جماهير الناس» وأقل إيحاءً بالكتلة الواحدة من «الجمهور».
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل بين الفئتين اللتين وجَّه إليهما يسوع كلامه.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: تلاميذه
  rationale: ينقل جمع μαθηταί مع ضمير الملكية بصورة عربية طبيعية وموجزة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «كلَّم» لتجنب ثقل تكرار حرف الجر في «تكلّم إلى الجموع وإلى تلاميذه»، مع الحفاظ على كون الجموع والتلاميذ متلقّيَي الخطاب.
