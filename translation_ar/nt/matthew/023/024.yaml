base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: ar
  text: أيها المرشدون العميان، تُصفّون الشراب من البعوضة، لكنكم تبتلعون الجمل!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: المرشدون
  rationale: يدل الاسم على من يقودون غيرهم أو يرشدونهم. و«المرشدون» تحافظ على استعارة توجيه الآخرين وتنسجم مع وصفهم بالعمى.
- source_word: τυφλοί
  choice: العميان
  rationale: نُقلت الصورة المجازية مباشرةً حفاظًا على حدّة التوبيخ وعلى معنى العجز عن الإدراك الروحي.
- source_word: διϋλίζοντες
  choice: تُخرجون ... بالتصفية
  rationale: الفعل يدل على تصفية سائل لإزالة شيء منه. وهذه الصياغة العربية توضّح أن البعوضة هي الشيء المُزال، من غير أن تفقد صورة التصفية.
- source_word: τὸν κώνωπα
  choice: البعوضة
  rationale: κώνωψ حشرة صغيرة كالناموس أو البعوض. «البعوضة» لفظ واضح وشائع، ويحفظ المقابلة المبالغ فيها مع الجمل.
- source_word: τὴν δὲ κάμηλον
  choice: لكنكم ... الجمل
  rationale: نقلت «لكن» قوة δέ التقابلية، مع إبقاء «الجمل» كما في الصورة الأصلية.
- source_word: καταπίνοντες
  choice: تبتلعون
  rationale: ترجمة مباشرة تحفظ الصورة الحسية والمبالغة الصادمة من غير إضافة نبرة عامية.
theological_decisions:
- issue: القوة المجازية لصورة النجاسة الطقسية والتفاوت الأخلاقي
  choice: الإبقاء على الصورة الحسية لإزالة بعوضة بالتصفية وابتلاع جمل، بوصفها توبيخًا على اختلال الموازين.
  alternative: شرح المعنى تفسيرًا باعتباره اهتمامًا بالأخطاء الصغيرة مع إهمال الأخطاء الكبيرة.
  rationale: تعتمد قوة القول على التفاوت العبثي بين الحشرة الضئيلة والجمل، وهما من الحيوانات النجسة في سياقهما؛ لذلك يحفظ النص الصورة ولا يستبدل بها تفسيرًا لاهوتيًا مباشرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة توبيخية قوية. استُعمل النداء «أيها المرشدون العميان» بوصفه المقابل العربي الطبيعي للتركيب اليوناني الذي يؤدي وظيفة النداء، وحُفظ التوازي بين الفعلين في خطاب الجمع.
