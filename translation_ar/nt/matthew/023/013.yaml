  source_fidelity: 'النص ينقل عناصر اليونانية الأساسية بأمانة: «الويل»، والمخاطَبين، و«ملكوت السماوات»، وصورة إغلاقه أمام الناس، والتقابل بين عدم دخولهم ومنع الداخلين. لكن «فلا أنتم تدخلون» تجعل الفاء أقرب إلى نتيجة لما قبلها، بينما γὰρ في «ὑμεῖς γὰρ οὐκ εἰσέρχεσθε» تعليلٌ وتوكيد للضمير؛ والأدق والأيسر: «فأنتم لا تدخلون».'
