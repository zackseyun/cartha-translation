source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: ar
  text: لكن ويلٌ لكم، يا كتبة وفريسيين، أيها المراؤون! لأنكم تغلقون ملكوت السماوات أمام الناس؛ فأنتم لا تدخلون، ولا تدعون الداخلين أن يدخلوا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني «الداخلين» أيضًا: «الذين يسعون إلى الدخول»؛ فصيغة اسم الفاعل اليونانية قد تدل على من هم في طور الدخول أو يقصدونه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: لكن الويل لكم
  rationale: يحفظ «الويل» قوة التنديد النبوي، وتؤدي «لكن» وظيفة δὲ الانتقالية ذات التباين الخفيف في سياق سلسلة الويلات.
- source_word: γραμματεῖς
  choice: كتبة
  rationale: المقابل العربي الكتابي المألوف الذي يدل هنا على العارفين بالشريعة وناسخيها ومعلّميها، من غير توسيع تفسيري.
- source_word: Φαρισαῖοι
  choice: فريسيين
  rationale: النقل العربي المستقر لاسم الجماعة.
- source_word: ὑποκριταί
  choice: المراؤون
  rationale: ينقل معنى التظاهر الديني والأخلاقي الكاذب بلفظ عربي فصيح ومفهوم.
- source_word: κλείετε
  choice: تغلقون
  rationale: يحفظ صورة إغلاق طريق الوصول إلى الملكوت، وهو طبيعي مع المفعول به في العربية.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: الصيغة العربية المألوفة لعبارة متى المميزة، وتحفظ جمع οὐρανῶν ولا تفترض فرقًا لاهوتيًا عن «ملكوت الله».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: أمام الناس
  rationale: ينقل المعنى المكاني المجازي بوضوح، و«الناس» يعبر عن الدلالة البشرية العامة لـἀνθρώπων.
- source_word: οὐκ εἰσέρχεσθε
  choice: فلا أنتم تدخلون
  rationale: إبراز الضمير المنفصل يحفظ مقابلة ὑμεῖς وتوبيخ المخاطبين، مع بقاء استعارة الدخول.
- source_word: τοὺς εἰσερχομένους
  choice: الداخلين
  rationale: يحفظ صيغة اسم الفاعل الحاضر، التي قد تشير إلى من هم في طور الدخول أو يقصدونه.
- source_word: ἀφίετε εἰσελθεῖν
  choice: تدعون ... أن يدخلوا
  rationale: «تدعون» هنا بمعنى تسمحون، وتُبقي العربية فعل الدخول الصريح كما في المصدر اليوناني، على الرغم من التكرار المقصود.
theological_decisions:
- issue: صياغة عبارة متى βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  alternative: ملكوت السماء
  rationale: اختير الجمع لأنه يطابق الصيغة اليونانية المميزة في متى وهو تعبير عربي كتابي طبيعي، من غير بناء تمييز عقائدي عن «ملكوت الله».
- issue: دلالة τοὺς εἰσερχομένους
  choice: الداخلين
  alternative: الذين يحاولون الدخول / المقبلين على الدخول
  rationale: يحفظ الاختيار الدلالة الصرفية المباشرة ولا يحسم هل الدخول قد بدأ فعلًا أم أن الأشخاص يسعون إليه؛ وتوضح الحاشية هذا الاحتمال.
- issue: تكرار جذر الدخول في εἰσερχομένους ... εἰσελθεῖν
  choice: تدعون الداخلين أن يدخلوا
  alternative: تسمحون للداخلين بالدخول
  rationale: الإبقاء على الفعل الأخير يصون البنية التوكيدية في الأصل، مع صياغة عربية مفهومة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة نبوية مهيبة. استُعملت ألفاظ كتابية مألوفة مثل «الويل» و«ملكوت السماوات» من غير تراكيب قديمة عسيرة، وحُفظ التوازي والتكرار في خاتمة الآية.
