  terminology: «الويل»، و«الكتبة»، و«الفريسيين»، و«المراؤون»، و«ملكوت السماوات» مصطلحات مناسبة ومألوفة في العربية الكتابية الحديثة. و«تدعون ... أن يدخلوا» تؤدي ἀφίετε εἰσελθεῖν بوضوح من دون اختزال للفعل الأخير.
  issues:
