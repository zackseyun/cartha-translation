source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: ar
  text: الويل لكم، أيها الكتبة والفريسيون المراؤون! لأنكم تنظفون ظاهر الكأس والصحن، لكنهما من الداخل ممتلئان بالطمع والإفراط.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تدل الكلمتان اليونانيتان أيضًا على «السلب أو الابتزاز» و«انعدام ضبط النفس»، فتبرزان الأخذ الاستغلالي والانغماس غير المنضبط.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: الويل لكم
  rationale: يحافظ على قوة الإدانة النبوية في العبارة اليونانية، وهو تعبير عربي فصيح ومألوف.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل الاصطلاحي المباشر والمستقر لهذه الفئة الدينية في سياق الأناجيل.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: النقل العربي القياسي لاسم هذه الجماعة.
- source_word: ὑποκριταί
  choice: المراؤون
  rationale: ينقل معنى التظاهر الديني والأخلاقي الكاذب بوضوح، من غير الاقتصار على النقل اللفظي الدخيل «المنافقون» بما قد يحمله من دلالات اصطلاحية أخرى.
- source_word: καθαρίζετε
  choice: تنظفون
  rationale: فعل عربي طبيعي مباشر ينقل معنى التنظيف في صورة الأواني.
- source_word: τὸ ἔξωθεν
  choice: ظاهر
  rationale: يحافظ بإيجاز على التقابل المكاني مع «من الداخل».
- source_word: ποτηρίου
  choice: الكأس
  rationale: مقابل مباشر لوعاء الشرب المقصود.
- source_word: παροψίδος
  choice: الصحن
  rationale: لفظ عام واضح لوعاء المائدة، من غير تخصيصه بطبق مسطح أو وعاء عميق.
- source_word: ἔσωθεν
  choice: من الداخل
  rationale: تعبير عربي واضح يحافظ على مقابلة الظاهر بالباطن المكاني في الصورة.
- source_word: γέμουσιν
  choice: هما ... ممتلئان
  rationale: يحافظ على صيغة الجمع اليونانية وإحالتها الطبيعية إلى الكأس والصحن مع مراعاة التثنية العربية.
- source_word: ἁρπαγῆς
  choice: الطمع
  rationale: ينقل في المتن نزعة الاستحواذ الجشعة، مع بيان الدلالة الأقوى، أي السلب أو الابتزاز، في الحاشية.
- source_word: ἀκρασίας
  choice: الإفراط
  rationale: تعبير موجز عن الانسياق غير المنضبط وراء الرغبات، مع إبراز معنى انعدام ضبط النفس في الحاشية.
theological_decisions:
- issue: مرجع النجاسة الداخلية في الاستعارة
  choice: 'إبقاء الامتلاء مسندًا إلى الكأس والصحن: «لكنهما من الداخل ممتلئان»'
  alternative: «لكنكم في الداخل ممتلئون بالطمع والإفراط»
  rationale: الفعل اليوناني بصيغة الجمع يعود نحويًا بصورة طبيعية إلى الوعاءين، وإن كان المقصود الأخلاقي بالقادة واضحًا. إبقاء الصورة يمنع إدخال تفسير صريح محل الاستعارة الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة وقوية تناسب التوبيخ النبوي. استُخدمت التثنية العربية لتجسيد صيغة الجمع اليونانية وإبقاء صورة الكأس والصحن من غير شرح تفسيري داخل المتن.
