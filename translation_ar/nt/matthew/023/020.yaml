theological_decisions:
- issue: مرجع «كل ما عليه»
  choice: إبقاء الإشارة عامة إلى كل ما على المذبح
  alternative: كل التقدمات عليه؛ أو كل ما فوقه
  rationale: العبارة اليونانية أوسع من «التقدمة»، مع أن السياق السابق يذكرها. وإبقاء العموم يصون صياغة النص وحجته من غير تضييق تفسيري.
