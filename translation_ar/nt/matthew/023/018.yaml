base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: ar
  text: «ومن حلف بالمذبح، فليس بشيء[b]؛ أما من حلف بالقربان[a] الذي فوقه، فهو مُلزَم» (متى 23:18).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالعطية». تدل الكلمة اليونانية على عطية تُقدَّم لله في الهيكل.'
    reason: lexical_alternative
  - marker: b
    text: أي إن القسم بالمذبح، بحسب التعليم الذي يدينه يسوع، لا يُعتدّ به، أما القسم بالقربان الموضوع عليه فيُعَدّ مُلزِمًا.
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: وأيضًا
  rationale: تصل العبارة بما قبلها وتتابع سلسلة الأقوال التي يقتبسها يسوع لينتقدها؛ و«أيضًا» طبيعية في هذا السياق.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: مَن حلف ... أما مَن حلف
  rationale: ينقل تركيب الشرط العام غير المحدد بصياغة عربية موجزة وطبيعية.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: بالمذبح
  rationale: حرف الجر ἐν يأتي هنا في اصطلاح الحلف للدلالة على ما يُحلَف به، لا على المكان.
- source_word: θυσιαστήριον
  choice: المذبح
  rationale: المقابل العربي الدقيق والشائع لمذبح الذبائح في سياق الهيكل.
- source_word: οὐδέν ἐστιν
  choice: فذلك لا شيء
  rationale: يحافظ على إيجاز اليونانية وعلى صياغتها الحرفية نسبيًا من غير أن يضيف مفعولًا أو تفسيرًا غير مصرح به.
- source_word: ἐν τῷ δώρῳ
  choice: بالقربان
  rationale: δῶρον يعني عطية، لكنه في سياق المذبح يشير إلى ما يُقدَّم لله؛ و«القربان» واضح وطبيعي في العربية.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: الذي فوقه
  rationale: ينقل موضع القربان بالنسبة إلى المذبح ويحافظ على مرجع الضمير.
- source_word: ὀφείλει
  choice: فهو مُلزَم
  rationale: يعبّر عن الالتزام القانوني والأخلاقي الناشئ عن الحلف، مع إبقاء متعلق الالتزام غير مذكور كما في اليونانية.
theological_decisions:
- issue: متعلَّق الإلزام المحذوف في صيغة القسم
  choice: فهو مُلزَم
  alternative: فعليه أن يفي بقسمه
  rationale: النص اليوناني لا يصرّح بمتعلَّق الفعل؛ لذلك تُحفظ صياغته الموجزة بدل إضافة تفسير بأن عليه الوفاء بالقسم.
- issue: مرجع عبارة «لا شيء»
  choice: فذلك لا شيء
  alternative: فلا يلزمه شيء
  rationale: تحافظ الصياغة على التوتر والإيجاز في الأصل، ولا تحوّل العبارة إلى تقرير تفسيري صريح عن عدم الإلزام، مع أن هذا هو المقصود في التعليم الذي يدينه يسوع.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُعملت «أما» لإبراز المقابلة، واحتُفظ بإيجاز عبارتي «لا شيء» و«مُلزَم» تجنبًا لإضافة ما تركه الأصل ضمنيًا.
