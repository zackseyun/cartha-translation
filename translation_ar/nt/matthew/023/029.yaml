source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: ar
  text: ويلٌ لكم، أيها الكتبة والفريسيون المراؤون، لأنكم تبنون قبور الأنبياء وتزيّنون أضرحة الأبرار[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «النُّصُب التذكارية» أو «مدافن الأبرار». فاللفظة اليونانية قد تدل على قبر ذي طابع تذكاري أو على معلم تذكاري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: ويلٌ لكم
  rationale: يحفظ صيغة الإنذار النبوي وإعلان الدينونة، وهو أوضح وأقوى هنا من صيغة التحسر «واحسرتاه».
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المصطلح العربي المألوف والدقيق لفئة الخبراء في الشريعة والنصوص، من غير توسيع تفسيري إلى «معلّمي الشريعة».
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: النقل العربي المستقر لاسم هذه الجماعة.
- source_word: ὑποκριταί
  choice: المراؤون
  rationale: ينقل معنى التظاهر بالصلاح الديني مع فساد الباطن، ويتجنب الإيحاءات الاصطلاحية الزائدة التي قد تحملها كلمة «المنافقون» في السياق العربي.
- source_word: ὅτι
  choice: لأنكم
  rationale: يُظهر بوضوح أن ما يلي هو سبب الويل المعلن عليهم.
- source_word: οἰκοδομεῖτε
  choice: تبنون
  rationale: ترجمة مباشرة للمضارع، من غير افتراض أنهم يعيدون بناء القبور.
- source_word: τάφους
  choice: قبور
  rationale: يدل على مواضع الدفن المبنية، ويناسب فعل «تبنون».
- source_word: προφητῶν
  choice: الأنبياء
  rationale: ترجمة مباشرة للمضاف إليه.
- source_word: κοσμεῖτε
  choice: تزيّنون
  rationale: ينقل معنى التحسين والزخرفة بلغة عربية واضحة ومعاصرة.
- source_word: μνημεῖα
  choice: أضرحة
  rationale: يلائم منشآت القبور التذكارية ويتيح تمييز اللفظ عن τάφους المترجم «قبور»، مع بيان الاحتمال الآخر في الحاشية.
- source_word: δικαίων
  choice: الأبرار
  rationale: ينقل الصفة المستعملة اسماً للدلالة على الأشخاص المتصفين بالبر، ويحافظ على المفردات الأخلاقية واللاهوتية للنص.
theological_decisions:
- issue: دلالة δικαίων في هذا السياق
  choice: الأبرار
  alternative: الصالحين / العادلين
  rationale: «الأبرار» تصف أمناء إسرائيل المستقيمين من غير حصر المعنى في العدالة القضائية أو إدخال تصور مذهبي لاحق.
- issue: وصف ὑποκριταί
  choice: المراؤون
  alternative: المنافقون
  rationale: «المراؤون» يبرز التظاهر الديني المقصود في خطاب متى، بينما قد تُفهم «المنافقون» بوصفها مصطلحاً عقدياً ذا حمولة تتجاوز السياق.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُعمل النداء «أيها» لسلامة التركيب، وحُفظت الجملة في سياق واحد يربط إعلان الويل بسببه. وُضعَت علامة الحاشية بعد «الأبرار» لأنها تتعلق بلفظة «أضرحة» السابقة ضمن العبارة كلها.
