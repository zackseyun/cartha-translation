id: MAT.23.37
reference: Matthew 23:37
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: ar
  text: «يَا أُورُشَلِيمُ، يَا أُورُشَلِيمُ، يَا مَنْ تَقْتُلِينَ الْأَنْبِيَاءَ وَتَرْجُمِينَ الْمُرْسَلِينَ إِلَيْكِ، كَمْ مَرَّةً أَرَدْتُ أَنْ أَجْمَعَ أَوْلَادَكِ كَمَا تَجْمَعُ الدَّجَاجَةُ فِرَاخَهَا تَحْتَ جَنَاحَيْهَا، وَلَمْ تُرِيدُوا!»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاءت «لم تريدوا» بصيغة الجمع في الأصل، بعد مخاطبة أورشليم بصيغة المفرد المؤنث؛ ويشير الانتقال على الأرجح إلى أولادها أو أهلها.
    reason: clarification
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: يَا أُورُشَلِيمُ، يَا أُورُشَلِيمُ
  rationale: يحافظ على النداء المتكرر وما فيه من توكيد ونبرة رثاء.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: يَا مَنْ تَقْتُلِينَ ... وَتَرْجُمِينَ
  rationale: صيغة الموصول مع المضارع المؤنث طبيعية في العربية، وتحفظ وصف المدينة المشخَّصة بسلوكها المتكرر.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: الْمُرْسَلِينَ إِلَيْكِ
  rationale: يحفظ المبني للمجهول واتجاه الإرسال إلى أورشليم المخاطبة بصيغة المؤنث.
- source_word: ποσάκις ἠθέλησα
  choice: كَمْ مَرَّةً أَرَدْتُ
  rationale: تعبير عربي واضح عن تكرر الإرادة أو الرغبة، من غير تقويتها إلى تقرير حتمي أو اختزالها في مجرد عاطفة.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: أَنْ أَجْمَعَ أَوْلَادَكِ
  rationale: يحفظ فعل الجمع وصورة أولاد المدينة، من غير تفسيرهم على أنهم فئة أضيق.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: كَمَا تَجْمَعُ الدَّجَاجَةُ فِرَاخَهَا
  rationale: «كما» تؤدي المقارنة طبيعيًا، و«الدجاجة» تلائم صورة الطائر الأم الذي يجمع فراخه، مع التنبيه إلى السعة المعجمية في الحاشية.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: تَحْتَ جَنَاحَيْهَا
  rationale: المثنى هو التعبير العربي الطبيعي عن جناحي الطائر، مع الحفاظ على صورة الحماية والإيواء.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: وَلَمْ تُرِيدُوا
  rationale: يحفظ التوازي اللفظي مع «أردت» والتباين بين إرادة المتكلم وعدم إرادة المخاطَبين؛ وصيغة الجمع تتبع الأصل اليوناني.
theological_decisions:
- issue: التباين الإرادي بين يسوع وأورشليم
  choice: «أردتُ ... ولم تريدوا»
  alternative: «عزمتُ ... فمنعتموني» أو صياغة تختزل العبارة في الحزن العاطفي
  rationale: يحافظ النص على التوتر الحقيقي بين إرادة يسوع وعدم إرادة المخاطَبين من غير حسم نقاشات الإرادة الإلهية أو المسؤولية البشرية بما يتجاوز العبارة.
- issue: مرجع «أولادك»
  choice: الإبقاء على «أولادك»
  alternative: «سكانك» أو «شعبك»
  rationale: تحفظ العبارة استعارة المدينة الأم، ولا تحصر المرجع في جماعة أضيق مما يحدده النص.
- issue: الانتقال من مخاطبة المدينة بالمفرد إلى الجمع
  choice: «إليكِ ... أولادكِ ... لم تريدوا»
  alternative: 'توحيد الخطاب كله على المفرد: «لم تريدي»'
  rationale: يحفظ التحول الموجود في اليونانية من أورشليم المشخَّصة بالمفرد المؤنث إلى أبنائها أو أهلها بصيغة الجمع، من غير تسوية هذا التوتر النحوي والدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم التشكيل الكامل دعمًا للقراءة الجهرية، وحُفظت صورة أورشليم المؤنثة والتحول المقصود إلى جمع المخاطَبين. وُضعت علامة الحاشية في المتن كما هو مطلوب.
