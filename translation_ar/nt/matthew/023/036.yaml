  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: ar
  text: '«الحق أقول لكم: ستأتي كل هذه الأمور[a] على هذا الجيل[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا كله». والعبارة اليونانية بصيغة الجمع: «كل هذه الأمور».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يفهم بعضهم «هذا الجيل» بمعنى «هؤلاء الناس» أو بمعنى جيل أوسع يتصف بعدم الإيمان، لكن القراءة اليونانية المباشرة هي «هذا الجيل».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي معنى التوكيد الجازم في صيغة يسوع المهيبة «الحق أقول لكم»، وهي عربية طبيعية ومعروفة، من غير مضاعفة لأن اليونانية تورد اللفظة مرة واحدة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة تحفظ الإيقاع الرسمي لصيغة القول.
- source_word: ἥξει
  choice: ستأتي
  rationale: تنقل صيغة المستقبل ومعنى المجيء أو الحلول، وتنسجم مع حرف الجر اللاحق من غير تحويل الفعل إلى تعبير تفسيري مثل «ستحدث».
- source_word: ταῦτα πάντα
  choice: كل هذه الأمور
  rationale: تحفظ صيغة الجمع في اليونانية وتوضح في عربية طبيعية أن الإشارة تعود إلى الأمور المذكورة في السياق السابق.
- source_word: ἐπὶ
  choice: على
  rationale: ينقل الاتجاه أو الحلول على المخاطَبين، ويحافظ على النبرة القضائية من غير زيادة معنى العداء الذي قد توحي به «ضد».
- source_word: γενεὰν ταύτην
  choice: هذا الجيل
  rationale: هو المقابل المباشر الأقرب للتركيب اليوناني، ويترك نطاق الإشارة ليُفهم من السياق بدل حسم الخلاف التفسيري داخل المتن.
theological_decisions:
- issue: مرجع عبارة «هذا الجيل» (γενεὰν ταύτην)
  choice: هذا الجيل
  alternative: هؤلاء الناس؛ جيل أوسع يتصف بعدم الإيمان؛ العصر الحاضر
  rationale: تُحفظ العبارة المباشرة وقوتها الزمنية كما في اليونانية، من غير توسيعها أو تقييدها بحسب قراءة أخروية أو مذهبية بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت صيغة القول التقليدية «الحق أقول لكم»، ووُضعت علامتا الحاشيتين بعد العبارتين اللتين تتعلقان بهما مباشرة.
