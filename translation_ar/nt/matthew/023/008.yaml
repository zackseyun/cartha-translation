  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: ar
  text: أمّا أنتم فلا تُدعَوا «رَبِّي»[a]، لأنّ معلّمكم واحد، وأنتم جميعًا إخوة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «معلّم». «رَبِّي» لقب يهودي معناه المعلّم؛ وقد أُبقي منقولًا صوتيًا للحفاظ على البيئة اليهودية ولتمييزه من لفظ «معلّم» الوارد بعده في الآية.
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني بصيغة الجمع المذكر، ويمكن في هذا السياق أن يشير إلى جماعة التلاميذ مجتمعةً.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: فلا تُدعَوا
  rationale: صيغة نهي مبنية للمجهول تنقل توجيه يسوع مباشرةً وتحافظ على معنى أن يُطلَق عليهم اللقب.
- source_word: Ῥαββί
  choice: «رَبِّي»
  rationale: الإبقاء على اللقب المنقول صوتيًا يحفظ البيئة اليهودية ويميّزه من كلمة «معلّم» اللاحقة في الآية.
- source_word: εἷς
  choice: واحد
  rationale: مقابل مباشر يحفظ التشديد على الوحدانية من غير إضافة لفظ «واحد فقط» التفسيري الأقوى.
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: معلّمكم
  rationale: 'صياغة عربية طبيعية تنقل العلاقة التي تفيدها الإضافة: المعلّم الذي لكم.'
- source_word: πάντες δὲ ὑμεῖς
  choice: وأنتم جميعًا
  rationale: تحفظ التوكيد الجماعي في ترتيب عربي فصيح وطبيعي.
- source_word: ἀδελφοί
  choice: إخوة
  rationale: يحفظ صيغة الجمع المذكر والاستعارة العائلية، مع بيان إمكان الدلالة الجماعية في الحاشية.
theological_decisions:
- issue: هل النهي تحريم مطلق لكل الألقاب البشرية أم معالجة لطلب المكانة داخل جماعة التلاميذ؟
  choice: الإبقاء على النهي المباشر كما ورد من دون توسيع نطاقه العقائدي.
  alternative: فهمه حظرًا مطلقًا لكل استعمال للقب «رَبِّي» وما يماثله، أو قصره على الطموح الريائي وحده.
  rationale: النص اليوناني يورد نهيًا صريحًا وتعليلًا له، لكنه لا يفصّل جميع تطبيقاته اللاحقة؛ لذلك تحافظ الترجمة على التوتر ولا تحسمه بإضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أمّا أنتم» لإبراز المقابلة التي تفيدها ὑμεῖς δὲ، وحُفظ اللقب اليهودي منقولًا صوتيًا مع شرحه في الحاشية.
