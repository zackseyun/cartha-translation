source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: ar
  text: ومَن يحلف بالسماء، فهو يحلف بعرش الله وبالجالس عليه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القاعد عليه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: مَن يحلف
  rationale: اسم الفاعل الماضي المعرَّف بالأداة يُستعمل هنا استعمالًا عامًا، فتنقل صيغة الشرط العربية المبدأ العام طبيعيًا من غير تقييده بزمن ماضٍ.
- source_word: ἐν
  choice: بـ
  rationale: حرف الجر في صيغ القسم يدل على الشيء المحلوف به، ولذلك يقابله في العربية حرف الباء.
- source_word: οὐρανῷ
  choice: السماء
  rationale: السياق الديني وربطها مباشرة بعرش الله يرجح معنى السماء بوصفها المقام السماوي، لا مجرد الجو أو الفضاء المرئي.
- source_word: ὀμνύει
  choice: فهو يحلف
  rationale: المضارع اليوناني يقرر حقيقة عامة؛ وأُضيف ضمير الفصل مع الفاء لبيان نتيجة العبارة ووضوح توازيها في العربية.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: عرش الله
  rationale: إضافة «عرش» إلى «الله» تنقل تركيب المضاف إليه اليوناني بدقة وإيجاز وفخامة طبيعية.
- source_word: τῷ καθημένῳ
  choice: الجالس
  rationale: اسم الفاعل يحافظ على التعبير غير المباشر في الأصل، ويستقيم طبيعيًا مع صورة الجلوس على العرش.
- source_word: ἐπάνω αὐτοῦ
  choice: عليه
  rationale: الضمير يعود إلى العرش، وحرف «على» يدل على الجلوس عليه، لا على وجود منفصل فوقه.
theological_decisions:
- issue: مرجع «الجالس عليه»
  choice: الإبقاء على الكناية الموقرة عن الله الجالس على عرشه
  alternative: التصريح بـ«الله» بدل الكناية، أو إبقاء المرجع أكثر إبهامًا
  rationale: عبارة «عرش الله» السابقة توضح المرجع، لكن الأصل لا يستبدل اسم الفاعل باسم «الله»؛ لذا تحافظ الترجمة على الكناية وعلى منطق أن الحلف بالسماء يتضمن الحلف بصاحب العرش.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «يحلف» لأنها أفصح وأشيع في هذا السياق من «يُقسم»، وحُفظ تكرار الفعل لإبراز منطق القول. وُضع مؤشر الحاشية في المتن كما يلزم.
