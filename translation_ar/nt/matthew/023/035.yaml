id: MAT.23.35
reference: Matthew 23:35
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: ar
  text: لكي يأتي عليكم كلُّ دمٍ بريءٍ يُسفك على الأرض[a]، من دم هابيل البار إلى دم زكريا بن برخيا[b]، الذي قتلتموه بين المقدس والمذبح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «على البلاد». يمكن للكلمة اليونانية أن تعني «الأرض» أو «البلاد».
    reason: lexical_alternative
  - marker: b
    text: هوية «زكريا بن برخيا» موضع خلاف. يربطه بعضهم بزكريا النبي، ويربطه آخرون بزكريا بن يهوياداع (2 أخبار الأيام 24:20–22). وتتبع الترجمة النص اليوناني كما هو مكتوب.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: لكي
  rationale: تؤدي معنى الغاية أو النتيجة الناشئة مما سبق، بصياغة عربية واضحة وموجزة.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: يأتي عليكم
  rationale: تحافظ على صورة مجيء تبعة الدم عليهم وعلى الدلالة القضائية في السياق.
- source_word: πᾶν αἷμα δίκαιον
  choice: كلُّ دمٍ بارٍّ
  rationale: تنقل المفرد اليوناني وصيغة الوصف كما وردا، مع بقاء التعبير المجازي عن دم الأبرار مفهومًا في العربية.
- source_word: ἐκχυννόμενον
  choice: يُسفك
  rationale: فعل مضارع مبني للمجهول يحفظ دلالة اسم الفاعل الحاضر المبني للمجهول، وهو التعبير العربي الطبيعي عن إراقة الدم.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: «الأرض» هي الأنسب للسياق الواسع الممتد من هابيل، مع إثبات احتمال معنى «البلاد» في الحاشية.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: من دم هابيل البار
  rationale: تحافظ على تركيب الإضافة وعلى لقب هابيل «البار» بصياغة كتابية عربية طبيعية.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: إلى دم زكريا بن برخيا
  rationale: تنقل تركيب المدى «من... إلى» وتحافظ على اسم الأب كما يرد في النص اليوناني.
- source_word: ὃν ἐφονεύσατε
  choice: الذي قتلتموه
  rationale: «قتلتموه» اتهام صريح ومباشر، ويلائم الاستعمال العربي الطبيعي؛ والسياق يوضح أن القتل عدواني.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: بين المَقدِس والمذبح
  rationale: «المَقدِس» يميز ναός بوصفه مبنى الحرم نفسه عن مجمّع الهيكل الأوسع، و«المذبح» مقابل مباشر لـ θυσιαστήριον.
theological_decisions:
- issue: هوية زكريا بن برخيا
  choice: إبقاء الاسم كما هو في النص اليوناني دون توفيق أو تصحيح
  alternative: ربطه بزكريا النبي بن برخيا، أو بزكريا بن يهوياداع مع افتراض إشكال نصي أو تقليدي
  rationale: أمانة الترجمة تقتضي نقل النص اليوناني كما هو، مع حفظ الخلاف التاريخي في حاشية بدل حسمه ضمن المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت بنية الجملة وامتدادها البلاغي من هابيل إلى زكريا، واستُعمل «المَقدِس» للدلالة على الحرم الداخلي لا مجمّع الهيكل كله.
