  source_fidelity: 'النص ينقل بنية الآية ومداها ومعظم ألفاظها الأساسية بأمانة: الغاية («لكي»)، ومجيء التبعة «عليكم»، والمدى من هابيل إلى زكريا، والاسم كما في اليونانية، وموضع القتل بين المقدس والمذبح. والحاشيتان تحفظان بدقة بديل γῆ وإشكال هوية زكريا دون حسم تاريخي. غير أن وصف الدم بـ«بارّ» غير مألوف في العربية المعاصرة إلى حد قد يحجب المقصود المجازي، وهو دم الأشخاص الأبرار/الأبرياء.'
