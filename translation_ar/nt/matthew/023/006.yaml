  source_fidelity: 'النص العربي ينقل بدقة البنية والمعنى اليونانيين: «ويحبّون» لـ φιλοῦσι، و«مكان الصدارة» بالمفرد لـ τὴν πρωτοκλισίαν، و«مقاعد الصدارة» بالجمع لـ τὰς πρωτοκαθεδρίας. كما أن «في الولائم» و«في المجامع» تمثلان الظرفين اليونانيين تمثيلًا سليمًا.'
