  text: φιλοῦσι ⸀δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: ar
  text: ويحبّون مكان الصدارة في الولائم[a][c]، ومقاعد الصدارة في المجامع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الموضع الأول عند المائدة»، إذ كان المدعوون في الولائم القديمة يتكئون للطعام، وكان لبعض المواضع منزلة شرف خاصة.'
    reason: lexical_alternative
  - marker: b
    text: أي المقاعد الأعلى منزلةً وأسبقيةً، لا المقاعد الأكثر راحة بالضرورة.
    reason: lexical_alternative
  - marker: c
    text: كانت الولائم في عالم البحر المتوسط القديم تُرتَّب بحسب مراتب شرف ظاهرة؛ لذلك يشير التعبير إلى طلب المكانة أمام الناس، لا إلى تفضيل موضع مريح فحسب.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: يحبّون
  rationale: ينقل الفعل المضارع معنى الميل الشديد والتعلّق بالمكانة، ويحافظ على قوة نقد يسوع من غير إضفاء معنى لاهوتي خاص على المحبة.
- source_word: δὲ
  choice: الواو في «ويحبّون»
  rationale: أداة ربط خفيفة تواصل وصف سلوك الكتبة والفريسيين، والواو هي الأنسب في العربية هنا من غير مبالغة في معنى الاستدراك.
- source_word: τὴν πρωτοκλισίαν
  choice: مكان الصدارة
  rationale: الاسم اليوناني مفرد، ويشير إلى الموضع الأرفع منزلة عند الاتكاء للطعام. «مكان الصدارة» طبيعي ودقيق، مع بيان الخلفية الثقافية في الحاشية.
- source_word: ἐν τοῖς δείπνοις
  choice: في الولائم
  rationale: يدل السياق على وجبات اجتماعية رسمية تُظهر فيها مراتب الشرف؛ و«الولائم» أوضح من «العشاءات» في العربية المعاصرة.
- source_word: τὰς πρωτοκαθεδρίας
  choice: مقاعد الصدارة
  rationale: يدل اللفظ على المقاعد ذات أعلى منزلة وأسبقية، و«مقاعد الصدارة» يحفظ دلالة المكانة الاجتماعية ولا يوحي بمجرد الراحة أو الجودة.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: في المجامع
  rationale: ترجمة مكانية مباشرة تشير إلى مواضع الاجتماع والعبادة اليهودية.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «الصدارة» في الشطرين للحفاظ على التوازي بين موضع الشرف في الولائم والمقاعد ذات المكانة في المجامع، مع إبقاء المفرد في πρωτοκλισία والجمع في πρωτοκαθεδρίας.
