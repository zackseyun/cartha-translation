  source_fidelity: 'النص العربي ينقل بدقة البنية التقابلية في اليونانية: الظهور الخارجي أمام الناس مقابل الحقيقة الداخلية. «تبدون» يحافظ على دلالة φαίνεσθε بوصفها مظهرًا لا برًّا حقيقيًا، و«أبرارًا» مناسب لـ δίκαιοι. كما أن «مملوؤون رياءً وتعدّيًا للشريعة» يؤدي μεστοὶ ὑποκρίσεως καὶ ἀνομίας مع إبقاء صلة ἀνομία بالشريعة.'
