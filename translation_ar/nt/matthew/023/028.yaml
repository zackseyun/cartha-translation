id: MAT.23.28
reference: Matthew 23:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: ar
  text: 'وهكذا أنتم أيضًا: تبدون للناس أبرارًا في الظاهر، لكنكم في الباطن مملوؤون رياءً وتعدّيًا للشريعة.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تربط الآية مباشرة بصورة القبور المبيّضة في الآية السابقة، وتحافظ على القوة المقارِنة والاستنتاجية بعبارة عربية طبيعية.
- source_word: ἔξωθεν ... ἔσωθεν
  choice: في الظاهر ... في الباطن
  rationale: تعبير عربي واضح ومألوف يحفظ التقابل الحاد بين الانطباع الخارجي والحقيقة الداخلية.
- source_word: φαίνεσθε
  choice: تبدون
  rationale: ينقل معنى الظهور في نظر الآخرين من غير أن يثبت أن البر حقيقي.
- source_word: τοῖς ἀνθρώποις
  choice: للناس
  rationale: ينقل اللفظ اليوناني العام الدال على البشر بصياغة عربية طبيعية غير مقصورة على الذكور.
- source_word: δίκαιοι
  choice: أبرارًا
  rationale: يحفظ الدلالة الأخلاقية والدينية للكلمة، مع بقاء البر هنا وصفًا للمظهر في أعين الناس لا للحقيقة الداخلية.
- source_word: μεστοὶ
  choice: مملوؤون
  rationale: ينقل الصفة اليونانية بمعناها المباشر، أي الامتلاء بشيء.
- source_word: ὑποκρίσεως
  choice: رياءً
  rationale: لفظ عربي راسخ وواضح يدل على إظهار الصلاح مع إبطان خلافه، ويلائم سياق التوبيخ الديني والأخلاقي.
- source_word: ἀνομίας
  choice: تعدّيًا للشريعة
  rationale: يُظهر صلة الكلمة بالقانون أو الشريعة، بدل اختزالها في الشر عمومًا، مع صياغة أوضح للقارئ العربي من اللفظ المجرد «اللاقانونية».
theological_decisions:
- issue: هل δίκαιοι يثبت برًا حقيقيًا أم يصف مظهرًا في نظر الناس؟
  choice: بر ظاهري في نظر الناس
  alternative: بر فعلي
  rationale: الفعل «تبدون» والتقابل مع الامتلاء الباطني بالرياء وتعدّي الشريعة يجعلان الكلام عن الانطباع الخارجي، لا إثبات البر الحقيقي.
- issue: مدى التحديد في ترجمة ἀνομίας
  choice: تعدّيًا للشريعة
  alternative: إثمًا أو شرًا
  rationale: يحفظ الاختيار صلة اللفظ اليوناني بالقانون أو الشريعة من غير حصره في تفصيل طائفي أو تفسير مذهبي معين.
translation_notes:
  register: العربية فصحى حديثة، واضحة ومهيبة. حافظت الصياغة على موازاة «في الظاهر/في الباطن» وعلى نبرة التوبيخ المباشر، من غير إضافة حاشية لأن «للناس» تؤدي المعنى البشري العام طبيعيًا في العربية.
