  text: ها إن بيتكم[a] يُترَك لكم خَرِبًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هيكلكم»؛ فقد تشير عبارة «بيتكم» على وجه الخصوص إلى الهيكل، مع أن التعبير اليوناني أوسع دلالة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها إن
  rationale: تعبير عربي فصيح وطبيعي للتنبيه إلى إعلان مهيب، ويحفظ قوة اللفظة اليونانية من غير استعمال صيغة قديمة ثقيلة.
- source_word: ἀφίεται
  choice: يُترَك
  rationale: يحفظ صيغة المبني للمجهول وزمن الفعل الحاضر، من غير أن يصرّح بفاعل لم يذكره النص أو يضيّق المعنى إلى «يُهجَر» فقط.
- source_word: ὑμῖν
  choice: لكم
  rationale: ينقل دلالة المجرور اليوناني بإيجاز، ويحفظ معنى أن البيت متروك لهم أو في حالهم.
- source_word: ὁ οἶκος ὑμῶν
  choice: بيتكم
  rationale: ترجمة مباشرة تحافظ على سعة التعبير المجازي؛ فقد يُراد به الهيكل أو أورشليم في السياق، لكن النص لا يصرّح بذلك.
- source_word: ἔρημος
  choice: خرابًا
  rationale: ينقل في هذا السياق النبوي معنى الخلو والوحشة الناتجين عن الهجر، بصياغة عربية طبيعية قوية.
theological_decisions:
- issue: المراد بعبارة «بيتكم»
  choice: الإبقاء على «بيتكم» في المتن
  alternative: «هيكلكم» أو «أورشليم» أو «بيت إسرائيل»
  rationale: يشير السياق بقوة إلى الهيكل وأورشليم الواقعين تحت الدينونة، لكن العبارة اليونانية أوسع. إبقاء «بيتكم» يصون التوتر الدلالي ولا يفرض تحديدًا تفسيريًا في المتن.
- issue: الفاعل الذي يترك البيت
  choice: 'الإبقاء على المبني للمجهول: «يُترَك»'
  alternative: «يتركه الله» أو «أتركه أنا»
  rationale: لا يذكر النص اليوناني الفاعل صراحة، ولذلك لا تُضاف هوية فاعل على سبيل الحسم اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُعملت «ها إن» للتنبيه، وحُفظ المبني للمجهول واتساع صورة «البيت» من غير تضييق تفسيري.
