  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: ar
  text: 'قائلًا: «جلس الكتبة والفريسيون على كرسي موسى[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اتخذ الكتبة والفريسيون مكانهم على كرسي موسى». قد يشير التعبير إلى شغل موضع التعليم والسلطة المرتبط بموسى، من غير أن يحسم هل كان ذلك ادعاءً منهم أم دورًا معترفًا به.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ اسم الفاعل على الصلة النحوية بالكلام السابق، كما في اليونانية، بدل تحويله إلى فعل مستقل.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: على كرسي موسى
  rationale: يفيد التركيب شغل موضع التعليم والسلطة المنسوب إلى موسى؛ و«كرسي موسى» تعبير عربي واضح يحفظ الصورة المجازية.
- source_word: ἐκάθισαν
  choice: جلس
  rationale: الفعل ماضٍ بسيط في اليونانية، ويمكن أن يدل في السياق على اتخاذ موضع أو شغله، من غير أن يصرّح بأنهم نصّبوا أنفسهم؛ لذلك حُفظت دلالته الأساسية مع بيان الاحتمال في الحاشية.
- source_word: οἱ γραμματεῖς
  choice: الكتبة
  rationale: المصطلح العربي المألوف للفئة المتخصصة في الشريعة والنسخ والتعليم في سياق الأناجيل.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: النقل العربي القياسي لاسم هذه الجماعة اليهودية.
theological_decisions:
- issue: هل يصف ἐκάθισαν مجرد الجلوس أو شغل منصب تعليمي ذي سلطة؟
  choice: جلس
  alternative: اتخذوا لأنفسهم مقاعدهم / أجلسوا أنفسهم
  rationale: لا يتضمن الفعل اليوناني هنا ضميرًا انعكاسيًا صريحًا، ولذلك لا ينبغي إدخال معنى استيلائهم الذاتي على المنصب في المتن. ومع ذلك، قد يحمل السياق معنى شغل موضع السلطة، فذُكر هذا الاحتمال في الحاشية حفاظًا على التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «كرسي موسى» للمحافظة على الاستعارة، ووُضع مؤشر الحاشية بعد العبارة التي تشرحها.
