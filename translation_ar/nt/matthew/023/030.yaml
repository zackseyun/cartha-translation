source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: ar
  text: 'وتقولون: «لو كنا في أيام آبائنا، لما كنا شركاء معهم[a] في دم الأنبياء[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مشاركين معهم»؛ فاللفظ اليوناني قد يدل على الاشتراك أو التورط مع آخرين.
    reason: lexical_alternative
  - marker: b
    text: أي في سفك دم الأنبياء؛ فهم يدّعون أنهم ما كانوا ليشاركوا آباءهم في ذنب دمهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: تقولون
  rationale: فعل مضارع للمخاطب الجمع، ويناسب خطاب يسوع المباشر الجاري في السياق.
- source_word: Εἰ ἤμεθα
  choice: لو كنا
  rationale: «لو» مع الجواب المنفي بـ«لما» تعبّر طبيعيًا في العربية عن شرط ماضٍ مخالف للواقع.
- source_word: ἐν ταῖς ἡμέραις
  choice: في أيام
  rationale: يحفظ التعبير الزمني المألوف في الأصل، وهو واضح وفصيح في العربية المعاصرة.
- source_word: τῶν πατέρων ἡμῶν
  choice: آبائنا
  rationale: ينقل اللفظ اليوناني الدال حرفيًا على الآباء، مع بقاء الإشارة السياقية إلى الأسلاف.
- source_word: οὐκ ἂν ἤμεθα
  choice: لما كنا
  rationale: صيغة جواب «لو» تنقل النتيجة الافتراضية المنفية في الماضي من غير إضافة تفسير.
- source_word: αὐτῶν κοινωνοὶ
  choice: شركاء لهم
  rationale: تحفظ معنى المشاركة والارتباط بهم، بما قد يتضمن التواطؤ، من غير تشديد المعنى إلى «متواطئين» في المتن.
- source_word: ἐν τῷ αἵματι
  choice: في دم
  rationale: يحافظ على صورة الدم الملموسة في اليونانية بدل تحويلها في المتن إلى التفسير الصريح «في سفك دم».
- source_word: τῶν προφητῶν
  choice: الأنبياء
  rationale: المقابل العربي الراسخ والدقيق للفظ اليوناني.
theological_decisions:
- issue: مقدار التورط الذي تدل عليه عبارة κοινωνοὶ ἐν τῷ αἵματι
  choice: شركاء لهم في دم الأنبياء
  alternative: متواطئين معهم في قتل الأنبياء؛ مشاركين لهم في سفك دم الأنبياء
  rationale: الصياغة المختارة تبقي لغة المشاركة وصورة الدم كما في الأصل، وتدع السياق يفيد الاشتراك في ذنب سفك الدم من غير أن تحسم درجة التورط بلفظ أشد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت بنية «لو كنا... لما كنا...» لإبراز الشرط الماضي المخالف للواقع، مع إبقاء «آبائنا» وصورة «الدم» قريبين من صياغة الأصل.
