revisions:
- from: أَيُّهَا الْفَرِّيسِيُّ الْأَعْمَى، نَظِّفْ أَوَّلًا دَاخِلَ الْكَأْسِ وَالصَّحْفَةِ[a]، لِكَيْ يَصِيرَ خَارِجُهَا أَيْضًا نَظِيفًا.
  to: أَيُّهَا الْفَرِّيسِيُّ الْأَعْمَى، نَظِّفْ أَوَّلًا دَاخِلَ الْكَأْسِ وَالصَّحْنِ[a]، لِكَيْ يَصِيرَ خَارِجُهُمَا أَيْضًا نَظِيفًا.
  rationale: التعديل الضروري هو استبدال «خارِجها» بـ«خارِجهما» كي لا يُفهم أن الخارج المقصود هو خارج الصحفة وحدها. كما استُخدم «الصحن» بدل «الصحفة» لسلامة الاستعمال المعاصر، مع حفظ سعة المدلول اليوناني في الحاشية. بقيت الصورة الحسية والمجاز الضمني ودلالة «يصير» كما في الأصل.
