review_pass:
  verdict: revise
  source_fidelity: المسودة تنقل الأمر، والأولوية، وصورة تنظيف الإناء، ودلالة الصيرورة نقلًا جيدًا. لكن «خارجها» يجعل الضمير في العربية عائدًا نحويًا إلى «الصحفة» وحدها، فيضيّق الإحالة التي يعاملها النص اليوناني وسجلّ التدقيق الإنجليزي بوصفها عائدة إلى مركّب الكأس والصحن. لذا يُستحسن استعمال المثنى العربي لإظهار أن الصورة تشمل الإناءين، من غير إضافة تفسير أخلاقي.
  naturalness: الأسلوب فصيح ومباشر. «الصحن» أشيع في العربية المعيارية المعاصرة من «الصحفة» في هذا السياق، ويحافظ على عمومية إناء تقديم الطعام. وصياغة «خارجهما» طبيعية وواضحة.
  terminology: «الفريسي»، و«أعمى»، و«نظّف»، و«الكأس»، و«يصير»، و«نظيفًا» مناسبة وتحافظ على الصورة المجازية من دون تفسيرها. استبدلتُ «الصحفة» بـ«الصحن» لمزيد من الوضوح الحديث، وعدّلت الحاشية لتعرض البدائل المعجمية المناسبة.
  issues:
