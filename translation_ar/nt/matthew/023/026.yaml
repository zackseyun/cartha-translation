    issue: مرجع الضمير في «خارِجُها»
    rationale: المؤنث المفرد في العربية يرجع طبيعيًا إلى «الصحفة» وحدها، بينما العبارة اليونانية تستخدم مفردًا يمكن أن يعامل مجموعة الكأس والصحن كوحدة في الصورة. «خارجهما» ينقل نطاق الصورة المقصود بوضوح في العربية ولا يضيف تفسيرًا لاهوتيًا.
