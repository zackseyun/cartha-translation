  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: ar
  text: أَيُّهَا الْفَرِّيسِيُّ الْأَعْمَى، نَظِّفْ أَوَّلًا دَاخِلَ الْكَأْسِ وَالصَّحْنِ[a]، لِكَيْ يَصِيرَ خَارِجُهُمَا أَيْضًا نَظِيفًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الصَّحْن» بـ«الطَّبَق» أو «الصَّحْفَة» أو «القَصْعَة»؛ فاللفظة اليونانية (παροψίς) تدل على إناء يُقدَّم فيه الطعام.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: أَيُّهَا الْفَرِّيسِيُّ الْأَعْمَى
  rationale: يحافظ على النداء المفرد المباشر وعلى وصف العمى المجازي بقوة ووضوح في العربية.
- source_word: καθάρισον
  choice: نَظِّفْ
  rationale: فعل أمر حاسم يلائم الصورة الحسية للأواني، مع إبقاء الدلالة الأخلاقية المجازية ضمنية.
- source_word: πρῶτον
  choice: أَوَّلًا
  rationale: ينقل أولوية تنظيف الداخل في التسلسل والمنطق.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: دَاخِلَ الْكَأْسِ
  rationale: صياغة عربية طبيعية تحافظ على المقابلة بين الداخل والخارج.
- source_word: καὶ τῆς παροψίδος
  choice: وَالصَّحْفَةِ
  rationale: الصحفة إناء للطعام، وهي مقابل عربي واضح لا يحدد شكل الوعاء أكثر مما يسمح به اللفظ اليوناني.
- source_word: ἵνα γένηται
  choice: لِكَيْ يَصِيرَ
  rationale: يحفظ معنى الصيرورة والنتيجة في γίνομαι، بدل الاكتفاء بحالة ثابتة.
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: خَارِجُهَا أَيْضًا نَظِيفًا
  rationale: يحافظ على التوازي بين الداخل والخارج وعلى دلالة καί الإضافية. استُعمل ضمير المؤنث المفرد وفق المطابقة العربية الطبيعية مع أقرب مرجع، «الصحفة»، مع بقاء الصورة شاملة للإناء المذكور.
theological_decisions:
- issue: الصورة الحسية للأواني أم التصريح بالتفسير الأخلاقي
  choice: الإبقاء على صورة تنظيف داخل الكأس والصحفة وخارجهما من غير شرح المجاز في المتن.
  alternative: 'صياغة تفسيرية مثل: «نقِّ باطنك أولًا لكي يصير ظاهرك أيضًا نقيًّا».'
  rationale: النص اليوناني يقدّم المعنى الأخلاقي من خلال صورة محسوسة؛ والتصريح بمرجع المجاز يضيّق بلاغته ويضيف تفسيرًا إلى المتن.
- issue: مرجع الضمير المفرد αὐτοῦ بعد اسمين
  choice: ترجمته بضمير مفرد مؤنث في «خارجها» بحسب أقرب اسم عربي، مع عدم تحويله إلى مثنى.
  alternative: «خارجهما» لتوضيح رجوع المعنى إلى الكأس والصحفة معًا.
  rationale: يحافظ المفرد على العدد النحوي في النص اليوناني وعلى شيء من توتر الإحالة، بدل تسوية الصياغة إلى مثنى تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع ضبط كامل للنص. استُخدم «نظّف» للمحافظة على صورة الأواني اليومية، و«يصير» لإظهار معنى النتيجة. وُضع مؤشر الحاشية [a] بعد «الصحفة» مباشرة.
