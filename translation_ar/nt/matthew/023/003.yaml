  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: ar
  text: لذلك، كلُّ ما يقولونه لكم فافعلوه والتزموا به، لكن لا تفعلوا بحسب أعمالهم[a]، لأنهم يقولون ولا يفعلون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: لا تفعلوا كما يفعلون.'
    reason: بديل تعبيري طبيعي لمعنى κατὰ τὰ ἔργα αὐτῶν، مع شيء من التفسير الضمني.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: لذلك، كلُّ ما
  rationale: تنقل «لذلك» دلالة οὖν الاستنتاجية، وينقل «كل ما» شمول العبارة اليونانية πάντα ... ὅσα ἐὰν بوضوح وطبيعية.
- source_word: εἴπωσιν ὑμῖν
  choice: يقولونه لكم
  rationale: ترجمة مباشرة لـ λέγω من غير توسيع المعنى إلى «يعلّمونكم» أو إضافة سلطة تعليمية لا يصرّح بها هذا العدد.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: فافعلوه والتزموا به
  rationale: «افعلوه» تحافظ على الفعل المباشر وعلى تكراره لاحقًا، و«التزموا به» تؤدي معنى الحفظ والمراعاة في τηρέω من غير أن توحي بمجرد الحفظ الذهني.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: لكن لا تفعلوا بحسب أعمالهم
  rationale: تحافظ «بحسب» على معنى المطابقة أو اتخاذ المعيار في κατά، وتحافظ «أعمالهم» على ἔργα، بينما يكرر «لا تفعلوا» فعل ποιέω كما في اليونانية.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: لأنهم يقولون ولا يفعلون
  rationale: صياغة موجزة تحفظ المقابلة الحادة والتكرار البلاغي بين القول والفعل، من غير إضافة مفعول غير مذكور.
theological_decisions:
- issue: هل تُصرَّح في العدد سلطة الكتبة والفريسيين التعليمية المستفادة من السياق السابق؟
  choice: 'إبقاء مضمون قولهم عامًا كما في هذا العدد: «كل ما يقولونه لكم».'
  alternative: «كل ما يعلّمونكم إياه» أو «كل ما يقولونه لكم من كرسي موسى».
  rationale: السياق يعيّن المتكلمين، لكن العدد نفسه لا يكرر تلك التفاصيل؛ لذلك لا تُضاف مادة تفسيرية إلى المتن.
- issue: هل يُنوَّع التعبير العربي لتخفيف تكرار فعل ποιέω؟
  choice: الحفاظ على تكرار «افعلوا ... لا تفعلوا ... لا يفعلون».
  alternative: استعمال أفعال متنوعة مثل «مارسوا ... لا تقتدوا ... لا يطبقون».
  rationale: التكرار مقصود بلاغيًا في اليونانية، ويبرز التناقض بين أقوالهم وأفعالهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «التزموا به» بدل «احفظوه» لتجنب احتمال فهم الحفظ على أنه استظهار ذهني، مع إبقاء تكرار «فعل» الذي يحمل البنية البلاغية للآية. وُضع مؤشر الحاشية عند العبارة التي تشرحها الحاشية.
