  verdict: approve
  source_fidelity: 'ينقل النص بدقة البنية الأساسية لليونانية: الشمول في «كل ما»، والاستنتاج في «لذلك»، والأمرين المتعاقبين «فافعلوه والتزموا به»، ثم النهي عن موافقة الأعمال، والتعليل الختامي القائم على المقابلة بين القول والفعل. ولا يضيف إلى الآية تصريحًا بمضمون التعليم أو بسلطة المتكلمين المستفادة من السياق.'
  naturalness: الصياغة فصيحة معاصرة وواضحة. «التزموا به» أداء طبيعي لـ τηρεῖτε في هذا السياق، ويكمل «فافعلوه» من غير إقحام تفسير. كما أن «لا تفعلوا بحسب أعمالهم» مفهومة وتحافظ على الصياغة المعيارية لـ κατά.
  terminology: «أعمالهم» مناسبة لـ ἔργα وتحفظ الصلة المقصودة بالأفعال في الآية. والتقابل «يقولون ولا يفعلون» موجز وطبيعي ويحافظ على الأثر البلاغي للنص اليوناني. موضع علامة الحاشية صحيح، والحاشية تقدم البديل التعبيري من دون تغيير معنى المتن.
