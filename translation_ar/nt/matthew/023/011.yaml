lexical_decisions:
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: ينقل المقابلة التي تفيدها الأداة اليونانية في السياق، بصياغة عربية طبيعية واضحة.
- source_word: μείζων
  choice: أَعْظَمُكُمْ
  rationale: صيغة التفضيل اليونانية قد تؤدي معنى الأعلى منزلة داخل الجماعة؛ وهذه الصياغة تحفظ هذا المعنى مع بقاء الاحتمال الحرفي موضحًا في الحاشية.
- source_word: ὑμῶν (الأولى)
  choice: ـكُمْ في «أَعْظَمُكُمْ»
  rationale: تنقل الإضافة التبعيضية، أي الأعظم من بين المخاطَبين، بأسلوب عربي موجز وطبيعي.
- source_word: ἔσται
  choice: فَسَيَكُونُ
  rationale: ترجمة مباشرة للمستقبل، مع فاء جواب «أمّا» اللازمة في العربية.
- source_word: ὑμῶν (الثانية)
  choice: ـكُمْ في «خَادِمَكُمْ»
  rationale: 'تنقل العلاقة المقصودة بوضوح: يكون خادمًا للمخاطَبين.'
- source_word: διάκονος
  choice: خَادِمَكُمْ
  rationale: يدل اللفظ هنا على من يخدم الآخرين، لا على رتبة كنسية اصطلاحية؛ لذلك تجنبت ألفاظًا قد توحي بمنصب ديني.
theological_decisions:
- issue: العلاقة بين العظمة والخدمة في تعليم يسوع
  choice: «أَمَّا أَعْظَمُكُمْ فَسَيَكُونُ خَادِمَكُمْ»
  alternative: «وأما الأكبر منكم فسيكون خادمكم»
  rationale: 'تحفظ الصياغة قلب مقاييس المنزلة الذي يقرره النص: العظمة الحقيقية تظهر في خدمة الآخرين، من غير إدخال مفهوم منصب كنسي لاحق أو إزالة التوتر بين العظمة والخدمة.'
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة، مع ضبط كامل للنص القصير. استُخدمت بنية «أمّا... فـ» لإظهار المقابلة طبيعيًا، وتُركت الحاشية لبيان الصياغة الأقرب إلى ظاهر المقارنة اليونانية.
