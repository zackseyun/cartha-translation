  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: ar
  text: والتحيات في الأسواق، وأن يناديهم الناس بلقب «رابي».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «رابي» لقب آرامي منقول صوتيًا، معناه «معلّمي»، وكان يُستعمل مخاطبةً لمعلّمي الشريعة باحترام.
    reason: يوضح أن اللفظ لقب آرامي تاريخي ومعناه ووظيفته، مع إزالة الالتباس المحتمل مع «ربّي» العربية.
lexical_decisions:
- source_word: ἀσπασμούς
  choice: التحيات
  rationale: تنقل معنى التحيات العلنية وإظهار التوقير، مع إبقاء العبارة موجزة ومتصلة بسياق الآية السابقة.
- source_word: ἀγοραῖς
  choice: الأسواق
  rationale: المقصود الأماكن العامة التي كانت تُقام فيها الأسواق وتدور فيها الحياة العامة؛ و«الأسواق» هي المقابل المباشر الطبيعي.
- source_word: καλεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: أن يدعوهم الناس
  rationale: صياغة عربية طبيعية تحفظ المبني للمجهول دلاليًا وتترجم ἀνθρώπων هنا ترجمة شاملة إلى «الناس» دون حصرها في الذكور.
- source_word: Ῥαββί
  choice: رَبِّي
  rationale: نقلٌ للقب الآرامي/اليوناني بصيغته العربية الكتابية المألوفة، مع شرح معناه في الحاشية بدل استبداله داخل النص.
theological_decisions:
- issue: هل يُترجم لقب Ῥαββί بمعناه أم يُنقل صوتيًا؟
  choice: الإبقاء على اللقب «رَبِّي» مع حاشية تفسيرية
  alternative: «يا معلّم» أو «معلّم»
  rationale: يحافظ النقل الصوتي على اللقب التاريخي الذي يناقشه السياق، بينما توضح الحاشية معناه من غير حسم الفروق الدلالية الممكنة داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. صيغت العبارة بوصفها استمرارًا نحويًا للآية السابقة، ولذلك لم يُضف فعل مستقل غير موجود في المصدر.
