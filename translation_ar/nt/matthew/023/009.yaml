  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: ar
  text: ولا تَدعوا أحدًا على الأرض أباكم، فإن أباكم واحد، وهو الآب السماوي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فإن أباكم واحد، وهو الذي في السماء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: لا تَدعوا أحدًا أباكم
  rationale: ينقل صيغة النهي ووظيفة «أب» بوصفها تسمية أو لقبًا، مع إظهار المفعول المفهوم في اليونانية بلفظ «أحدًا» وفق العربية الطبيعية.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: تعبير عربي مباشر يحفظ المقابلة بين المجال الأرضي والوصف السماوي.
- source_word: εἷς γάρ ἐστιν ὑμῶν ὁ πατήρ
  choice: لأن أباكم واحد
  rationale: يحفظ العدد الصريح «واحد» وعلاقة المخاطَبين بأبيهم، من غير إضافة «الوحيد» إلى النص.
- source_word: ὁ οὐράνιος
  choice: وهو السماوي
  rationale: يحفظ الاستعمال الاسمي للصفة اليونانية ويجعل مرجعها إلى «أباكم» واضحًا في العربية، من غير تحويلها حتمًا إلى جملة مكانية.
theological_decisions:
- issue: نطاق النهي عن إطلاق لقب «الأب»
  choice: الإبقاء على النهي مباشرًا وصارمًا من غير تفسير يقيّده بالأبوة الروحية أو يوسّعه صراحةً ليشمل كل استعمال بشري لكلمة «أب».
  alternative: صياغته «لا تدعوا أحدًا أباكم الروحي» أو «لا تستعملوا كلمة أب لأي إنسان مطلقًا».
  rationale: اليونانية نفسها تورد نهيًا قاطعًا، لكن الآية لا تضيف قيد «الروحي» ولا تشرح علاقته بالأبوة البيولوجية والاجتماعية؛ لذلك ينبغي حفظ التوتر التفسيري للسياق.
- issue: دلالة ὁ οὐράνιος
  choice: وهو السماوي
  alternative: الآب السماوي؛ أو الذي في السماء
  rationale: الصفة مع أداة التعريف مستعملة استعمالًا اسميًا، وتحتمل وصف الأب بأنه السماوي أو التعبير عنه بأنه في السماء. الصياغة المختارة أقرب إلى البنية المعطاة مع بيان البدائل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «تَدعوا» بمعنى تسمّوا أو تخاطبوا، و«أحدًا» لتجنب إدخال لفظ جنساني غير موجود صراحةً في اليونانية. وُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
