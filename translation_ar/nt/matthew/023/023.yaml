revisions:
- from: '«ويل لكم، أيها الكتبة والفريسيون المراؤون! لأنكم تُعشِّرون النعناع والشِّبِتّ والكمون، وتركتم أثقل ما في الشريعة: العدل والرحمة والإيمان[a]. كان ينبغي أن تعملوا بهذه، من غير أن تهملوا تلك.»'
  to: '«ويل لكم، أيها الكتبة والفريسيون المراؤون! لأنكم تُعشِّرون النعناع والشِّبِتّ والكمون، وتركتم الأمور الأثقل في الشريعة: العدل والرحمة والإيمان[a]. كان ينبغي أن تفعلوا هذه، من غير أن تهملوا تلك.»'
  rationale: 'تقتصر المراجعة على تحسين المطابقة النحوية والدلالية للأصل اليوناني والطبيعية العربية: استُبدلت «تعملوا بهذه» بـ«تفعلوا هذه»، وحُوِّلت العبارة الخاصة بالأمور الأثقل إلى صيغة جمع أوضح. حُفظت الحاشية في موضعها لأنها توثق القراءة البديلة لـπίστις من دون ترجيح حاسم في المتن.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص عناصر اليونانية كلها بأمانة: صيغة «ويل»، وتعيين الكتبة والفريسيين بالمرائين، وتعشير الأعشاب الثلاثة، ومقابلة الأمور الأثقل بالعدل والرحمة والإيمان، مع تأكيد وجوب فعل الأولى وعدم إهمال الأخرى. إلا أن «تعملوا بهذه» لا يؤدي فعل ποιῆσαι («تفعلوا هذه») بأوضح عبارة عربية.'
  naturalness: الصياغة فصيحة ومفهومة عمومًا. لكن «كان ينبغي أن تعملوا بهذه» تركيب غير طبيعي نسبيًا في العربية المعاصرة، وقد يُفهم بمعنى العمل وفق هذه المبادئ لا القيام بهذه الأمور. كما أن «الأمور الأثقل في الشريعة» أوضح من «أثقل ما في الشريعة» في إبراز صيغة الجمع المقصودة.
  terminology: «الكتبة»، «الفريسيون»، «المراؤون»، «تُعشِّرون»، «الشريعة»، «العدل»، و«الرحمة» اختيارات مستقرة ومناسبة. إبقاء «الإيمان» في المتن مع حاشية «الأمانة» يحفظ سعة πίστις والبديل التفسيري في السياق الأخلاقي دون حسم مذهبي.
  issues:
