    issue: «تعملوا بهذه»
    rationale: الأصل يقول «كان ينبغي فعل هذه»، لا «العمل بهذه». استبدالها بـ«تفعلوا هذه» أدق وأفصح في هذا الموضع.
  - severity: low
    issue: «أثقل ما في الشريعة»
    rationale: المعنى صحيح، لكن الأصل جمعٌ يشير إلى مطالب/أمور الشريعة الأشد وزنًا؛ «الأمور الأثقل في الشريعة» يحافظ على ذلك بوضوح أكبر.
