reference: Matthew 23:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: ar
  text: '«ويل لكم، أيها الكتبة والفريسيون المراؤون! لأنكم تُعشِّرون النعناع والشِّبِتّ والكمون، وتركتم الأمور الأثقل في الشريعة: العدل والرحمة والإيمان[a]. كان ينبغي أن تفعلوا هذه، من غير أن تهملوا تلك.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمانة». يمكن للكلمة اليونانية أن تدل على الإيمان أو الثقة أو الوفاء، ويرى كثيرون أن المقصود في هذا السياق الأخلاقي هو الأمانة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: ويل لكم
  rationale: يحفظ قوة صيغة التنديد والإنذار النبوية، ولا يخففها إلى مجرد تعبير عن الأسى.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي المباشر والمستقر لهذه الفئة في سياق الأناجيل، بخلاف «معلّمي الشريعة» الأوسع والأكثر تفسيرًا.
- source_word: ὑποκριταί
  choice: المراؤون
  rationale: ينقل المعنى الأخلاقي المجازي في السياق بلغة عربية فصيحة ومفهومة.
- source_word: ἀποδεκατοῦτε
  choice: تُعشِّرون
  rationale: ينقل بدقة أداء العُشر ويحافظ على الدلالة الشرعية والعبادية للفعل.
- source_word: ἡδύοσμον
  choice: النعناع
  rationale: الاسم العربي الشائع للنبات المقصود.
- source_word: ἄνηθον
  choice: الشِّبِتّ
  rationale: اسم عربي معاصر واضح للنبات المذكور، مع الضبط لتيسير قراءته.
- source_word: κύμινον
  choice: الكمون
  rationale: الاسم العربي المألوف للتابل المذكور.
- source_word: ἀφήκατε
  choice: تركتم
  rationale: يحفظ صورة ترك الأمور جانبًا، ويؤدي معنى الإهمال في هذا السياق من غير مبالغة إلى معنى الهجر التام.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: أثقل ما في الشريعة
  rationale: يحفظ استعارة الثقل الدالة على زيادة الأهمية، بصياغة عربية طبيعية.
- source_word: κρίσιν
  choice: العدل
  rationale: في هذه الثلاثية الأخلاقية يدل اللفظ على إقامة العدل أكثر من مجرد إصدار الحكم.
- source_word: ἔλεος
  choice: الرحمة
  rationale: مقابل كتابي عربي مستقر يلائم البعد الأخلاقي للعطف والرأفة.
- source_word: πίστιν
  choice: الإيمان
  rationale: يحفظ المقابل الأساسي للفظ اليوناني من دون حسم دلالته المحتملة على الأمانة؛ وقد ذُكر البديل في الحاشية.
- source_word: ταῦτα ... κἀκεῖνα
  choice: بهذه ... تلك
  rationale: يحفظ التمييز الإشاري بين الأمور الأثقل المذكورة قريبًا وممارسة التعشير المذكورة قبلها.
theological_decisions:
- issue: دلالة πίστιν ضمن ثلاثية أخلاقية
  choice: الإيمان
  alternative: الأمانة
  rationale: يمكن أن يدل اللفظ على الإيمان أو الثقة أو الأمانة. أُبقي «الإيمان» في المتن محافظةً على سعته الدلالية ومقابله الأساسي، مع إثبات «الأمانة» في الحاشية لأن السياق الأخلاقي قد يرجحها لدى بعض القراء.
- issue: العلاقة بين الواجبات الأثقل وتعشير الأعشاب
  choice: وجوب فعل الأمور الأثقل من غير إهمال التعشير
  alternative: اعتبار العبارة إلغاءً للتعشير
  rationale: النص اليوناني يصرح بأن هذه كان ينبغي فعلها وألا تُترك تلك، ولذلك حُفظ التوتر بين ترتيب الأولويات وعدم إهمال الأمر الآخر من دون إدخال حكم مذهبي لاحق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة إنذارية مهيبة. استُعملت ألفاظ كتابية مستقرة مثل «الكتبة» و«الشريعة»، مع الحفاظ على استعارة «أثقل» وعلى توازي «بهذه... تلك». وُضع رمز الحاشية بعد «الإيمان» لأنه اللفظ الذي تتعلق به القراءة البديلة.
