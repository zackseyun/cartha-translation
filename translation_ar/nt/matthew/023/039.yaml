  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: ar
  text: 'فإني أقول لكم: لن تروني البتة[a] من الآن فصاعدًا حتى تقولوا: «مبارك الآتي باسم الرب».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يستعمل اليوناني نفيًا مؤكدًا (οὐ μή)، وتعبّر «لن ... البتة» عن قوة هذا النفي.
    reason: lexical_alternative
  - marker: b
    text: اقتباس أو تلميح إلى المزمور 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: فإني أقول لكم
  rationale: تحفظ «فـ» القوة التفسيرية لـγάρ وصلتها بما سبق، و«أقول لكم» صيغة عربية طبيعية ومباشرة.
- source_word: οὐ μή ... ἴδητε
  choice: لن تروني
  rationale: «لن» نفي مؤكد للاستقبال في العربية، وتنقل في السياق قوة οὐ μή مع فعل الرؤية دون إثقال العبارة بتوكيد زائد.
- source_word: ἀπ’ ἄρτι
  choice: من الآن فصاعدًا
  rationale: تبيّن ابتداء المدة من اللحظة الحاضرة بعبارة عربية واضحة.
- source_word: ἕως ἂν εἴπητε
  choice: حتى تقولوا
  rationale: تنقل الحد المستقبلي الذي تعبّر عنه ἕως ἄν مع صيغة الالتزام من غير تحديد زمن الحدث أو طبيعته.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: مبارك الآتي
  rationale: تحفظ الصيغة المزمورية الموجزة، و«الآتي» تقابل اسم الفاعل المعرّف من غير فرض دلالة لقبية تتجاوز النص.
- source_word: ἐν ὀνόματι κυρίου
  choice: باسم الرب
  rationale: صياغة عربية مألوفة ودقيقة للعبارة الكتابية، وتحفظ «الرب» مقابلاً لـκύριος.
theological_decisions:
- issue: دلالة عدم الرؤية إلى حين إعلان البركة
  choice: الإبقاء على العبارة باعتبارها تصريحًا مهيبًا بعدم رؤيته من الآن إلى أن ينطق المخاطبون بالاقتباس، من غير تعيين الحدث المقصود.
  alternative: تحديدها في الترجمة بالدخول الظافر، أو بالمجيء الثاني، أو بتوبة إسرائيل في المستقبل.
  rationale: النص اليوناني لا يحدد صراحة الموعد التاريخي أو الأخروي؛ لذلك تُحفظ دلالته المفتوحة والتوتر اللاهوتي فيه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة. استُخدمت «مبارك الآتي باسم الرب» للمحافظة على الإيقاع الكتابي، مع وضع علامتي الحاشية [a] و[b] في المتن.
