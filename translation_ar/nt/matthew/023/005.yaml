  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: ar
  text: لكنهم يفعلون كل أعمالهم لكي يراهم الناس؛ فإنهم يوسِّعون صناديق التِّفِلِّين التي يلبسونها[a] ويكبِّرون أهداب ثيابهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي صناديق جلدية صغيرة تحتوي مقاطع من التوراة، وكان بعض اليهود يلبسونها امتثالًا لنصوص مثل التثنية 6:8. وتُعرف أيضًا باسم «التِّفِلِّين».
    reason: cultural_note
  - marker: b
    text: أو «شراريب ثيابهم». قارن العدد 15:38–39 بشأن الأهداب التي تُجعل على الثياب.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: كل أعمالهم
  rationale: ينقل معنى الشمول في πάντα ويحافظ على الدلالة المباشرة لـἔργα بصياغة عربية واضحة.
- source_word: δὲ
  choice: لكنهم
  rationale: تؤدي معنى المقابلة مع الكلام السابق، مع وصل الضمير بالسياق على نحو طبيعي في العربية.
- source_word: ποιοῦσιν
  choice: يعملون
  rationale: فعل عربي مألوف يلائم المفعول «أعمالهم» ويحافظ على الصلة اللفظية بين الفعل والاسم.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: لكي يراهم الناس
  rationale: يبين غرض أفعالهم صراحة، وينقل المبني للمجهول اليوناني بصياغة عربية طبيعية من غير تقييد ἀνθρώποις بالذكور.
- source_word: πλατύνουσι
  choice: يُعَرِّضون
  rationale: يعني أنهم يجعلون الشيء عريضًا، وهو مقابل عربي موجز ودقيق في هذا السياق المادي.
- source_word: φυλακτήρια
  choice: عُلَب آياتهم
  rationale: يشير في هذا السياق إلى علب جلدية صغيرة تحتوي نصوصًا كتابية وتُلبس على الجسد. هذه العبارة أوضح للقارئ العربي من تعريب غامض، وتتجنب إيحاء «التمائم» بأن الممارسة سحرية.
- source_word: μεγαλύνουσι
  choice: يُكَبِّرون
  rationale: يحافظ على المعنى العام، أي جعل الشيء كبيرًا، من غير تخصيص غير محسوم بالطول وحده.
- source_word: κράσπεδα
  choice: أهداب ثيابهم
  rationale: ينقل المرجع الملموس إلى الأهداب أو الشراريب التي كانت على أطراف الثياب، وإضافة «ثيابهم» توضح المقصود الضمني في السياق.
theological_decisions:
- issue: عرض الأدوات الدينية اليهودية من غير تحميلها دلالة جدلية
  choice: استعمال «عُلَب آياتهم» و«أهداب ثيابهم» مع شرح ثقافي في الحواشي
  alternative: «تمائمهم» و«شراريبهم»
  rationale: النقد في الآية موجَّه إلى التظاهر وتضخيم المظهر، لا إلى الحكم بأن هاتين الممارستين شريرتان في ذاتهما. لذلك تتجنب الصياغة لفظ «تمائم» لما قد يوحي به من ممارسة سحرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يُعَرِّضون» بمعنى يجعلون الشيء عريضًا، وحُفظت علاقة التعليل في γὰρ بصياغة «فهم». وُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما.
