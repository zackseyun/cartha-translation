base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: ar
  text: 'يا أيها الأغبياء والعميان، فأيُّهما أعظم: الذهب أم الهيكل[b] الذي قدَّس الذهب[a]؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي جعل الذهب مقدسًا».'
    reason: lexical_alternative
  - marker: b
    text: قد تدل الكلمة اليونانية المترجمة «الهيكل» بوجه أخص على مقدس الهيكل.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: أغبياء
  rationale: صفة جمع في النداء تحمل توبيخًا قويًّا؛ و«أغبياء» عربية واضحة وطبيعية من غير إدخال لفظ عامي أو أشد مما يقتضيه الأصل.
- source_word: τυφλοί
  choice: عميان
  rationale: صفة جمع في النداء، وتحافظ «عميان» على الصورة المجازية المباشرة وقوة التوبيخ.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: فأيُّهما أعظم
  rationale: السؤال يقارن بين أمرين مذكورين، لذا «أيُّهما» هي الصياغة العربية الطبيعية، والفاء تنقل القوة التفسيرية لـγάρ.
- source_word: ὁ χρυσὸς
  choice: الذهب
  rationale: أداة التعريف تشير إلى الذهب المحدد الجاري الحديث عنه في السياق.
- source_word: ὁ ναὸς
  choice: الهيكل
  rationale: «الهيكل» هو اللفظ العربي المألوف في هذا السياق، مع التنبيه في الحاشية إلى أن ναός قد يدل على حرم الهيكل على وجه أخص.
- source_word: ὁ ἁγιάσας
  choice: الذي قدَّس
  rationale: اسم فاعل ماضٍ يوناني يعدّل «الهيكل»؛ والصياغة تحفظ الهيئة الماضية والمعنى الشعائري من غير شرح زائد.
- source_word: τὸν χρυσόν
  choice: الذهب
  rationale: تكرار الاسم كما في اليونانية يحافظ على التوازي البلاغي ووضوح الحجة.
theological_decisions:
- issue: ترجمة ἁγιάζω في سياق الهيكل
  choice: قدَّس
  alternative: جعل الذهب مقدسًا
  rationale: «قدَّس» يحفظ الدلالة الدينية والشعائرية المتمثلة في إضفاء صفة القداسة، من غير تحديد آلية لاهوتية لا يصرح بها النص.
- issue: القيمة الزمنية لاسم الفاعل الماضي ἁγιάσας
  choice: الذي قدَّس
  alternative: الذي يقدِّس
  rationale: اختير الماضي لمطابقة الصيغة اليونانية مباشرة، مع بقاء إمكان فهم الفعل بوصفه أساسًا ثابتًا لقداسة الذهب؛ أما الحاضر فيبرز حقيقة عامة بصورة أوضح لكنه أقل محافظة على الهيئة الصرفية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ أسلوب النداء التوبيخي والسؤال المقارن، واستُعمل «الهيكل» بوصفه اللفظ الكتابي العربي المألوف، مع شرح الدلالة الأخص في الحاشية.
