base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: ar
  text: يا حيّات، يا نسل الأفاعي! كيف ستفلتون من دينونة جهنم؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄφεις
  choice: أفاعي
  rationale: نداء توبيخي مباشر؛ و«أفاعي» لفظ عربي طبيعي قوي للصورة، مع أن اليونانية هنا أعمّ بمعنى الحيّات.
- source_word: γεννήματα
  choice: نسل
  rationale: ينقل معنى ما وُلِد أو نتج، ويحافظ بوضوح وإيجاز على تركيب الاسم مع المضاف إليه.
- source_word: ἐχιδνῶν
  choice: الأفاعي
  rationale: يدل على الأفاعي السامة تحديدًا؛ وتكرار «الأفاعي» عربيًا يحفظ حدّة التنديد وإن لم يُظهر الفرق الدقيق بين اللفظين اليونانيين.
- source_word: πῶς
  choice: كيف
  rationale: يحفظ صيغة السؤال البلاغي من غير أن يحسمها إلى مجرد القدرة أو مجرد الإخبار بالمستقبل.
- source_word: φύγητε
  choice: تهربون
  rationale: ينقل معنى الفرار والنجاة من الشيء، ويلائم في العربية التركيب «تهربون من الدينونة».
- source_word: κρίσεως
  choice: دينونة
  rationale: تعبير قضائي ديني مفهوم يدل على الحكم، من غير التصريح مسبقًا بـ«الإدانة» بوصفها نتيجة محسومة في ذات اللفظ.
- source_word: γεέννης
  choice: جهنم
  rationale: «جهنم» هي المقابل العربي التاريخي المباشر للاسم المأخوذ من وادي هنوم، وهي طبيعية وواضحة للقارئ العربي.
theological_decisions:
- issue: دلالة γέεννα
  choice: جهنم
  alternative: وادي هنوم؛ الجحيم
  rationale: اختيرت «جهنم» لأنها تنقل المصطلح نفسه في تقليده السامي والعربي وتحفظ دلالته الأخروية، بدل استبداله بتفسير أعم مثل «الجحيم».
- issue: قوة السؤال πῶς φύγητε
  choice: كيف تهربون
  alternative: كيف يمكنكم أن تهربوا؛ كيف ستفلتون
  rationale: الصياغة المختارة تحفظ التوتر البلاغي واحتمال الدلالة المستقبلية أو الاستبعادية من غير تحويل السؤال صراحة إلى تقرير عن العجز.
translation_notes:
  register: عربية فصحى حديثة، مباشرة ومهيبة. لم تُضف حاشية لأن «جهنم» مقابل عربي راسخ للمصطلح اليوناني ولا يحتاج هنا إلى تعريب أجنبي أو شرح بديل.
