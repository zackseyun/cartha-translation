source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: ar
  text: «ويلٌ لكم، أيها الكتبة والفريسيون المراؤون! لأنكم تجوبون البحر والبرّ لتجعلوا شخصًا واحدًا دخيلًا[a]، فإذا صار كذلك تجعلونه ابنًا لجهنم[b] مثلي ما أنتم عليه.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي شخصًا ينضم إلى جماعتهم الدينية؛ ويمكن ترجمتها: «معتنقًا» أو «متهوّدًا».'
    reason: lexical_alternative
  - marker: b
    text: «ابن جهنم» تعبير سامي يدل على من ينتمي إلى جهنم أو يكون مصيره إليها. وتُترجم جهنم أحيانًا بـ«الجحيم».
    reason: idiom_explanation
lexical_decisions:
- source_word: Οὐαὶ
  choice: ويلٌ لكم
  rationale: يحافظ على قوة إعلان الدينونة النبوي، ولا يخففه إلى مجرد أسف.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي المألوف والدقيق لفئة علماء الشريعة اليهودية ونسّاخها، وهو أقل تفسيرًا من «معلّمي الشريعة».
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية القياسية لاسم الجماعة اليهودية المعروفة.
- source_word: ὑποκριταί
  choice: المراؤون
  rationale: ينقل معنى التظاهر الديني والأخلاقي على نحو طبيعي وفصيح في العربية.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: تجوبون البحر والبرّ
  rationale: تعبير عربي طبيعي يصوّر كثرة الترحال وبذل الجهد الواسع، مع الحفاظ على طرفي العبارة اليونانية.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: لتجعلوا شخصًا واحدًا دخيلًا
  rationale: «الدخيل» مصطلح عربي معروف لمن ينضم إلى جماعة دينية لم يولد فيها، وإضافة «شخصًا» توضح المعنى للقارئ المعاصر دون تحديد ما لا يصرح به النص.
- source_word: ὅταν γένηται
  choice: متى صار دخيلًا
  rationale: يصرّح بالمحمول المفهوم من السياق ويجعل الإحالة العربية واضحة.
- source_word: υἱὸν γεέννης
  choice: ابنًا لجهنم
  rationale: يحافظ على الاسم «جهنم» وعلى التعبير السامي «ابنًا لـ» بدل تفسيره داخل المتن.
- source_word: διπλότερον ὑμῶν
  choice: ضعفَي ما أنتم عليه
  rationale: ينقل معنى المقدار المضاعف ويستكمل المقارنة في عربية واضحة من غير تحويلها إلى صيغة مبالغة غير محددة.
theological_decisions:
- issue: دلالة «ابن جهنم»
  choice: الإبقاء على التعبير السامي «ابنًا لجهنم»
  alternative: شخصًا مستحقًا لجهنم أو من أهل جهنم
  rationale: الصياغة الحرفية تحفظ قوة الصورة وإيحاء الانتماء أو المصير، بينما البدائل تحسم دلالتها تفسيرًا.
- issue: هوية προσήλυτος
  choice: دخيلًا
  alternative: متهوّدًا أو معتنقًا
  rationale: «الدخيل» يحافظ على معنى الانضمام الديني والاجتماعي من غير الجزم بأن النشاط الموصوف كان تهويدًا رسميًا بالمفهوم اللاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة وحادة تناسب قول الويل. استُعمل «تجوبون» لتجنب الحرفية المتعثرة، وأُبقيت صورتا «ابن جهنم» و«ضعفَي ما أنتم عليه» لصيانة التوتر البلاغي في الأصل.
