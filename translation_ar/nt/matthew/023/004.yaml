  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: ar
  text: فَهُمْ يَرْبِطُونَ أَحْمَالًا ثَقِيلَةً وَيَضَعُونَهَا عَلَى أَكْتَافِ النَّاسِ، أَمَّا هُمْ فَلَا يُرِيدُونَ أَنْ يُحَرِّكُوهَا بِإِصْبَعِهِمْ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: يَرْبِطُونَ
  rationale: ينقل معنى شدّ الأحمال وربطها، ويحافظ على الصورة المحسوسة في اليونانية.
- source_word: φορτία βαρέα
  choice: أَحْمَالًا ثَقِيلَةً
  rationale: تعبير عربي طبيعي يحفظ معنى الثقل الحرفي وقوة الاستعارة من غير تعيين ماهية الأحمال.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: يَضَعُونَهَا عَلَى أَكْتَافِ
  rationale: يحافظ على صورة وضع الأحمال فوق الأكتاف بعبارة واضحة ومباشرة.
- source_word: τῶν ἀνθρώπων
  choice: النَّاسِ
  rationale: ἄνθρωποι هنا عام يشمل البشر، و«الناس» يؤدي هذا المعنى التمثيلي طبيعيًا في العربية دون حاجة إلى حاشية.
- source_word: αὐτοὶ δὲ
  choice: أَمَّا هُمْ فَـ
  rationale: تركيب المقابلة «أما هم» يُظهر توكيد الضمير والتباين بين ما يفرضونه على الآخرين وما يرفضونه هم.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: بِإِصْبَعِهِمْ
  rationale: يحفظ صيغة المفرد الجمعية في اليونانية والصورة البلاغية الدالة على أقل قدر من الجهد.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: لَا يُرِيدُونَ أَنْ يُحَرِّكُوهَا
  rationale: ينقل عنصر الإرادة في θέλουσιν ومعنى التحريك المباشر في κινῆσαι، من غير تحويله تفسيريًا إلى «يرفعوها».
theological_decisions:
- issue: هل الأحمال حرفية أم مجازية؟
  choice: الإبقاء على الصورة الملموسة «أحمالًا ثقيلة» من غير شرح مرجعها داخل النص.
  alternative: تفسيرها صراحةً بأنها فرائض دينية أو مطالب شرعية.
  rationale: السياق يشير إلى التزامات مُرهِقة، لكن العبارة اليونانية نفسها لا تسمّيها؛ لذا يحفظ النص الاستعارة واتساع دلالتها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «الناس» لأنه المقابل الطبيعي للفظ اليوناني العام في هذا السياق، ولذلك لا توجد حاجة إلى حاشية تخص النوع الاجتماعي. ضُبط النص بالشكل لتيسير القراءة، مع الحفاظ على ترتيب الصورة والمقابلة البلاغية.
