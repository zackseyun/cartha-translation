base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: ar
  text: «ويلٌ لكم يا معلّمي الشريعة والفريسيين المرائين! لأنكم تلتهمون بيوت الأرامل، وتطيلون الصلاة تظاهرًا؛ لذلك ستنالون دينونةً أشدّ».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات القبطية المبكرة؛ لكنها محفوظة في غالبية المخطوطات البيزنطية، وفي اللاتينية القديمة والفولغاتا والسريانية. ويُرجَّح أن نُسّاخًا متأخرين أضافوها للتوفيق بينها وبين العبارتين المشابهتين في مرقس 12:40 ولوقا 20:47. كما تختلف المخطوطات التي توردها في موضعها: قبل الآية 13 أم بعدها.'
    reason: textual_critical
lexical_decisions:
- source_word: γραμματεῖς
  choice: معلّمي الشريعة
  rationale: المقصود خبراء الشريعة ودارسوها، وهذه العبارة أوضح للقارئ المعاصر من النقل الحرفي «الكتبة»، مع إبقاء الوظيفة الدينية والتعليمية.
- source_word: ὑποκριταί
  choice: المرائين
  rationale: يدل السياق على من يُظهرون التقوى ويخفون الاستغلال؛ و«المراؤون» لفظ عربي واضح وديني السياق دون حصر المعنى في التمثيل المسرحي.
- source_word: κατεσθίετε
  choice: تلتهمون
  rationale: يحفظ الصورة المجازية القوية التي تصف الاستغلال القاسي المؤدي إلى الاستيلاء على ممتلكات الأرامل أو إفقارهن.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: بيوت الأرامل
  rationale: أُبقيت الصورة اليونانية كما هي؛ ويمكن أن تشمل البيوت والممتلكات وشؤون الأسرة المالية، دون تضييقها تفسيريًا في المتن.
- source_word: προφάσει
  choice: تظاهرًا
  rationale: يفيد أن الصلاة الطويلة واجهة زائفة تخفي الدافع الحقيقي. الصياغة العربية موجزة وطبيعية وتوافق اتصال اللفظ بالفعل «تطيلون».
- source_word: μακρὰ προσευχόμενοι
  choice: تطيلون الصلاة
  rationale: صياغة عربية طبيعية تنقل معنى أداء صلوات طويلة، لا مجرد وصف الصلاة بأنها طويلة.
- source_word: περισσότερον κρίμα
  choice: دينونةً أشدّ
  rationale: ينقل المزيد في شدة الحكم العقابي، ويجعل المقارنة المفهومة في السياق صريحة من غير تحديد مقياسها أو أطرافها.
theological_decisions:
- issue: دلالة κρίμα في سياق العقاب
  choice: دينونة
  alternative: حكم / إدانة
  rationale: «دينونة» تحتفظ بفكرة الحكم القضائي ذي النتيجة السلبية في هذا السياق، من غير أن تختزل اللفظ في العقوبة وحدها.
- issue: درجة العقاب في περισσότερον κρίμα
  choice: دينونة أشدّ
  alternative: دينونة أعظم / حكم أكبر
  rationale: «أشدّ» تعبّر طبيعيًا عن ثقل الحكم العقابي، مع إبقاء السؤال غير المحسوم عن أساس المقارنة دون شرح مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة إنذارية مهيبة. استُخدم «معلّمي الشريعة» بدل «الكتبة» لبيان الوظيفة للقارئ العام، وحُفظت قوة الاستعارة في «تلتهمون بيوت الأرامل». وُضعت علامة الحاشية بعد الآية كاملة لأنها تتعلق بأصالة الآية وموضعها في التقليد المخطوطي.
