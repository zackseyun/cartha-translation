  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: ar
  text: 'لذلك أقول لكم: كل خطيئة وتجديف يُغفران للناس، أما التجديف على الروح[a] فلن يُغفر.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الروح القدس؛ فالسياق المحيط يحدّد المقصود، مع أن نص هذه الآية يقول ببساطة: «الروح».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تربط القول بما سبقه بوصفه نتيجة أو استنتاجًا، وهي صياغة عربية واضحة وطبيعية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: تحافظ على صيغة الخطاب المباشر وعلى النبرة التقريرية الجادة في الأصل.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: كل خطيئة وتجديف
  rationale: تنقل القوة الاستغراقية لـπᾶσα مع الاسمين المفردين، وتستعمل المصطلحين العربيين المألوفين في هذا السياق.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: يُغفر للناس
  rationale: تحافظ على المبني للمجهول وعلى كون الناس متلقّي المغفرة، بصياغة عربية طبيعية شاملة للذكور والإناث.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: أما التجديف على الروح
  rationale: تفهم المضاف إليه بوصفه مفعول التجديف، وتحافظ على المقابلة التي تفيدها δὲ من غير إضافة كلمة «القدس» إلى المتن.
- source_word: οὐκ ἀφεθήσεται
  choice: فلن يُغفر
  rationale: تنقل النفي مع المستقبل بوضوح، وتحافظ على التوازي مع «يُغفر» في الجملة الأولى.
theological_decisions:
- issue: هل يُترجم πνεύματος بـ«الروح» أم «الروح القدس»؟
  choice: الروح
  alternative: الروح القدس
  rationale: النص اليوناني في هذه الآية يقول «الروح» من دون صفة «القدس». يدل السياق القريب بوضوح على الروح القدس، لكن المتن يحافظ على الصياغة الصريحة للأصل، ويُذكر التفسير الأوضح في الحاشية.
- issue: دلالة إضافة «التجديف» إلى «الروح»
  choice: التجديف على الروح
  alternative: تجديف الروح
  rationale: السياق يبين أن الروح هو الواقع عليه التجديف، لا مصدره؛ وحرف الجر «على» يعبّر عن هذه العلاقة بوضوح في العربية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على المبني للمجهول والتوازي البلاغي في الأصل. استُعملت «الناس» للدلالة الإنسانية العامة، ووُضعت الحركات الجزئية الكاملة هنا لضبط القراءة من غير ألفاظ مذهبية زائدة.
