  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: ar
  text: وَمَنْ يَتَكَلَّمْ بِكَلِمَةٍ ضِدَّ ابْنِ الإِنْسَانِ، فَسَيُغْفَرُ لَهُ؛ وَأَمَّا مَنْ يَتَكَلَّمْ ضِدَّ الرُّوحِ الْقُدُسِ، فَلَنْ يُغْفَرَ لَهُ، لا فِي هَذَا العَصْرِ وَلا فِي العَصْرِ الآتِي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: وَمَنْ ... أَمَّا مَنْ
  rationale: تنقل صيغة الشرط العامة المفتوحة في اليونانية، مع إبراز المقابلة بين شطري القول بعربية طبيعية.
- source_word: εἴπῃ λόγον
  choice: يَقُلْ كَلِمَةً
  rationale: يحافظ على حضور λόγον في النص، وهو تعبير عربي واضح ومباشر في سياق التحذير.
- source_word: κατὰ
  choice: عَلَى
  rationale: تؤدي معنى الكلام العدائي الموجَّه ضد شخص، وهي صياغة عربية مألوفة مع «قال كلمة على»؛ وفي الجملة الثانية يُفهم المفعول المحذوف من الأولى كما في اليونانية.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابْنِ الإِنْسَانِ
  rationale: يحفظ اللقب بصيغته الكتابية المستقرة وما يحمله من دلالة مسيانية وأخروية، من غير تفكيك أو إعادة تفسير.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: يُغْفَرْ لَهُ / فَلَنْ يُغْفَرَ لَهُ
  rationale: يحافظ على المبني للمجهول وعلى التوازي بين المغفرة ونفيها، من غير تعيين فاعل المغفرة الذي لم يُذكر صراحة.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: الرُّوحِ الْقُدُسِ
  rationale: المقابل العربي المعياري الواضح للقب في الاستعمال الكتابي الحديث.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: لَا فِي هَذَا الدَّهْرِ وَلَا فِي الآتِي
  rationale: «الدَّهر» هنا يدل على الحقبة أو العصر، لا على العالم المكاني، و«الآتي» يحفظ الإضمار اليوناني إذ يُفهم منه «الدَّهر الآتي».
theological_decisions:
- issue: المقابلة الزمنية بين αἰών الحاضر والآتي
  choice: لَا فِي هَذَا الدَّهْرِ وَلَا فِي الآتِي
  alternative: لَا فِي هَذَا الدَّهْرِ وَلَا فِي الدَّهْرِ الآتِي
  rationale: تحفظ الصياغة الإطار الأخروي الزمني وتتجنب تحويل αἰών إلى «العالم»، كما تُبقي حذف الاسم في العبارة الثانية على نحو يقارب اليونانية، مع توضيحه في الحاشية.
- issue: ماهية الإساءة التي لا تُغفر
  choice: الإبقاء على التحذير من القول على الروح القدس دون تعريف عقائدي إضافي
  alternative: تفسيره داخل الترجمة بأنه اتهام تاريخي مخصوص أو بأنه عدم التوبة حتى الموت
  rationale: الآية نفسها تقرر النتيجة ولا تقدم تعريفًا لاهوتيًا تفصيليًا لطبيعة هذه الإساءة؛ لذا لا ينبغي للترجمة أن تحسم ما تركه النص هنا دون تفصيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم الضبط الجزئي لتيسير القراءة ومنع اللبس النحوي، مع تجنب الأساليب المذهبية أو الألفاظ القديمة غير الضرورية.
