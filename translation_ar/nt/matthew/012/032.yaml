  to: وَمَنْ يَتَكَلَّمْ بِكَلِمَةٍ ضِدَّ ابْنِ الإِنْسَانِ، فَسَيُغْفَرُ لَهُ؛ وَأَمَّا مَنْ يَتَكَلَّمْ ضِدَّ الرُّوحِ الْقُدُسِ، فَلَنْ يُغْفَرَ لَهُ، لا فِي هَذَا العَصْرِ وَلا فِي العَصْرِ الآتِي.
  rationale: تُظهر المراجعة زمن المستقبل في فعلي المغفرة، وتستبدل تركيبًا أقل سلاسة بتركيب فصيح حديث ينقل معنى الكلام «ضدّ» مع الحفاظ على إيجاز الشطر الثاني. كما يُصرَّح بـ«العصر» في العبارة الأخيرة لأن الإضمار اليوناني لا يستقيم في العربية بالوضوح نفسه. لا تُضاف حاشية لأن النص المنقح يعبّر عن المعنى الزمني مباشرة ولا يفرض تفسيرًا لاهوتيًا للإنذار.
