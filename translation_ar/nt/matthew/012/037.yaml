  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: ar
  text: فبأقوالك تُبرَّأ[a]، وبأقوالك تُدان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُحكَم لك»، أو «تُعلَن بارًّا». يمكن أن يفيد الفعل اليوناني، في السياق القضائي، إعلان أن الشخص على حق أو غير مذنب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: على أساس
  rationale: تفيد ἐκ مع المضاف إليه هنا الأساس أو الدليل الذي يجري الحكم بموجبه. وعبارة «على أساس» عربية طبيعية توضح المعنى القضائي من غير أن تحوّل الكلام نفسه إلى علة استحقاقية صريحة.
- source_word: γάρ
  choice: لأن
  rationale: تربط γάρ الآية بما قبلها بوصفها تعليلًا للتحذير المتعلق بالكلام، و«لأن» تؤدي هذه الوظيفة بوضوح في العربية المعاصرة.
- source_word: λόγων σου
  choice: كلامك
  rationale: تشير صيغة الجمع λόγων إلى الأقوال المنطوقة. و«كلامك» طبيعية وواضحة في العربية، كما تحافظ بتكرارها على التوازي بين شطري الجملة.
- source_word: δικαιωθήσῃ
  choice: تُبرَّأ
  rationale: الفعل مستقبل مبني للمجهول ويحمل في هذا السياق معنى قضائيًا، ولا سيما لمقابلته المباشرة بـ«تُدان». و«تُبرَّأ» تنقل إعلان المرء غير مذنب أو محقًا، مع إثبات البدائل في الحاشية.
- source_word: καταδικασθήσῃ
  choice: تُدان
  rationale: ينتمي الفعل إلى مجال القضاء، ويقف في تضاد مقصود مع δικαιωθήσῃ. و«تُدان» موجزة وطبيعية وتحافظ على المقابلة القضائية.
theological_decisions:
- issue: المعنى القضائي للفعل δικαιόω وصلته بالكلام والدينونة
  choice: «تُبرَّأ» بمعنى صدور حكم يثبت براءتك أو أنك على حق، على أساس كلامك بوصفه دليلًا.
  alternative: «تُعلَن بارًّا» أو «يُحكَم لك»
  rationale: المقابلة الصريحة مع «تُدان» تجعل الإطار القضائي واضحًا. ولا تحدد الترجمة هنا نظرية لاهوتية كاملة عن التبرير، ولا تقول أكثر مما تقوله الآية بشأن دلالة الكلام في الحكم.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي اللفظي بتكرار «على أساس كلامك»، واستُخدمت صيغتا المبني للمجهول «تُبرَّأ» و«تُدان» لتعكسا الصيغتين اليونانيتين من غير تسمية القاضي صراحة.
