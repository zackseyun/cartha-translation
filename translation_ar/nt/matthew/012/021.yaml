  text: وعلى اسمه ترجو الأمم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وعلى اسمه يرجو غير اليهود».'
    reason: يحفظ المعنى البديل الممكن للفظ ἔθνη، مع إبقاء علاقة الرجاء بالاسم كما في الأصل اليوناني.
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يربط هذه العبارة بما قبلها في الاقتباس، فحُفظ الربط بصيغة عربية طبيعية.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: باسمه
  rationale: الباء مع فعل الرجاء تؤدي معنى تعلّق الرجاء به؛ و«اسمه» تحفظ دلالة الاسم بما يمثله من شخص وسلطان وسمعة دون حصرها في تفسير واحد.
- source_word: ἔθνη
  choice: الأمم
  rationale: تعبير عربي مباشر يحفظ أفق الاقتباس الإشعيائي الشامل للشعوب خارج إسرائيل، مع بقاء إمكان فهمه بمعنى غير اليهود.
- source_word: ἐλπιοῦσιν
  choice: ترجو
  rationale: فعل مضارع عربي يحمل دلالة المستقبل بوضوح داخل سياق الوعد النبوي، وينقل المعنى الأساسي للفعل اليوناني، أي الرجاء، دون تحويله إلى «تثق».
theological_decisions:
- issue: دلالة ἔθνη في الاقتباس المسياني
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» تحفظ اتساع الأفق النبوي ودلالة الشعوب، ولا تحصر اللفظ في توصيف إثني أو ديني، بينما تُذكر «غير اليهود» في الحاشية بوصفها معنى سياقيًا ممكنًا.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية كريمة. قُدِّم الجار والمجرور «باسمه» اتباعًا لترتيب الأصل وإبرازًا لمحل الرجاء، واستُعمل المضارع «ترجو» للدلالة المستقبلية في سياق النبوة.
