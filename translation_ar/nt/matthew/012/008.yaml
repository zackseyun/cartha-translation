  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: ar
  text: لأن ابن الإنسان هو ربُّ السبت[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن ابن الإنسان هو صاحب السلطان على السبت».'
    reason: lexical_alternative
  - marker: b
    text: «ابن الإنسان» هو اللقب الذي اعتاد يسوع أن يطلقه على نفسه في الأناجيل. ويمكن فهم العبارة، من حيث أصل ألفاظها، بمعنى أعم هو «الإنسان»، لكن ذلك يضعف على الأرجح دلالتها اللقبية وصداها الكتابي.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: لأن
  rationale: تحفظ الأداة وظيفتها التعليلية، إذ تصل هذا القول بالحجة السابقة ربطًا طبيعيًا وواضحًا في العربية.
- source_word: κύριος
  choice: ربّ
  rationale: تنقل معنى السيادة والسلطان وتحفظ الثقل اللقبي واللاهوتي للكلمة في هذا السياق، من غير إضافة معنى لا يصرّح به النص.
- source_word: τοῦ σαββάτου
  choice: السبت
  rationale: تحافظ الإضافة في «ربّ السبت» على تركيب اليونانية الطبيعي، وتشير «السبت» إلى اليوم والشريعة المرتبطة به، لا إلى الراحة بمعناها العام.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: تحفظ التسمية المميزة التي يستعملها يسوع عن نفسه في الأناجيل، بما لها من صدى كتابي محتمل، ولا تختزلها في تعبير عام مثل «الإنسان».
- source_word: ἐστιν
  choice: هو
  rationale: استُعمل ضمير الفصل لصياغة جملة اسمية عربية واضحة ولإبراز الخبر «ربّ السبت»، وهو يؤدي هنا وظيفة الرابطة التي تؤديها ἐστιν.
theological_decisions:
- issue: قوة عبارة κύριος ... τοῦ σαββάτου من جهة سلطان ابن الإنسان
  choice: ربّ السبت
  alternative: صاحب السلطان على السبت
  rationale: «ربّ السبت» يحفظ صيغة الإضافة وقوة لقب κύριος، ويعرض سلطان ابن الإنسان بالنسبة إلى السبت من غير شرح زائد أو تخفيف للدلالة.
- issue: دلالة ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان بوصفه تسمية لقبية مميزة
  alternative: الإنسان
  rationale: يحفظ الاختيار الصياغة الإنجيلية المعروفة وإيحاءاتها الكتابية المحتملة، مع إبقاء ما في اللقب من سعة وتوتر دلالي بدل حصره في معنى بشري عام.
translation_notes:
  register: العربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية رصينة. حُفظ التركيب اللقبي المألوف «ابن الإنسان» والإضافة الطبيعية «ربّ السبت»، ووُضعت علامتا الحاشيتين في المتن.
