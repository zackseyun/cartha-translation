id: MAT.12.11
reference: Matthew 12:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: ar
  text: 'فقال لهم: «مَن منكم له خروف واحد، فإن وقع في حفرة يوم السبت[a]، أفلا يمسك به ويرفعه[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «في السبوت»، وهو جمع اصطلاحي معناه «يوم السبت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ويقيمه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: مَن منكم
  rationale: صياغة عربية طبيعية للسؤال البلاغي، مع بقاء الإشارة إلى فرد من المخاطَبين من غير تكلّف بترجمة حرفية مثل «أيّ إنسان يكون منكم».
- source_word: ἕξει
  choice: له
  rationale: المستقبل اليوناني واقع في مثال افتراضي؛ والتعبير العربي «له» يؤدي معنى الامتلاك بوضوح وطبيعية.
- source_word: πρόβατον ἕν
  choice: خروف واحد
  rationale: يحفظ العدد الصريح والتوكيد على كون الخروف واحدًا.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: فإن وقع
  rationale: ينقل الشرط اليوناني بصياغة عربية واضحة، والفاعل مفهوم من ذكر الخروف قبله.
- source_word: τοῖς σάββασιν
  choice: يوم السبت
  rationale: الجمع اليوناني تعبير اصطلاحي يُراد به يوم السبت؛ وإضافة «يوم» تمنع التباس السبت بالأسبوع في العربية المعاصرة.
- source_word: εἰς βόθυνον
  choice: في حفرة
  rationale: «حفرة» لفظ عام ودقيق، ولا يحدد نوع الموضع بما يتجاوز النص.
- source_word: οὐχὶ
  choice: أفلا
  rationale: تؤدي الاستفهام الإنكاري الذي يتوقع جوابًا بالإيجاب.
- source_word: κρατήσει αὐτὸ
  choice: يمسك به
  rationale: ينقل معنى القبض عليه بإحكام من غير إيحاء عنيف زائد.
- source_word: ἐγερεῖ
  choice: يرفعه
  rationale: يحفظ المعنى الأساسي للفعل، والسياق يبيّن أن المقصود رفع الخروف من الحفرة، من غير إضافة «إلى خارجها» إلى المتن.
theological_decisions:
- issue: لغة المثال التمثيلية المفردة
  choice: مَن منكم
  alternative: أيّ إنسان منكم
  rationale: العربية لا تحتاج إلى إظهار الاسم المذكر «إنسان» لكي تحافظ على كون المثال موجّهًا إلى فرد من المخاطَبين؛ والصياغة المختارة لا تغيّر نطاق السؤال.
- issue: صيغة σάββασιν بالجمع
  choice: يوم السبت
  alternative: أيام السبت
  rationale: الجمع هنا اصطلاحي، والمفرد العربي ينقل سياق حكم السبت من غير أن يوهم بتعدد الأيام في الواقعة المفترضة.
- issue: مدى التصريح بالخروج من الحفرة في ἐγερεῖ
  choice: يرفعه
  alternative: يرفعه منها
  rationale: الأصل يقول «يرفعه/يقيمه» ولا يذكر أداة الخروج صراحة؛ أبقت الترجمة الدلالة السياقية من غير زيادة تفسيرية في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي إيقاع السؤال البلاغي، ووُضعت علامتا الحاشية عند اللفظين اللذين تشرحهما الحاشيتان.
