id: MAT.12.40
reference: Matthew 12:40
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: ar
  text: فكما كان يونان في جوف الكائن البحري[a] ثلاثة أيام وثلاث ليالٍ[b]، هكذا سيكون ابن الإنسان في قلب الأرض[c] ثلاثة أيام وثلاث ليالٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحوت العظيم». اللفظة اليونانية تدل على كائن بحري كبير، وهي أوسع من اسم نوع حيواني محدد.
    reason: lexical_alternative
  - marker: b
    text: قد تُفهم عبارة «ثلاثة أيام وثلاث ليالٍ» اصطلاحًا على أنها تشمل أجزاءً من ثلاثة أيام، بينما يفهمها آخرون على نحو أكثر حرفية.
    reason: alternative_reading
  - marker: c
    text: قد تشير عبارة «قلب الأرض» إلى الدفن، أو القبر، أو الأعماق أو عالم الأموات؛ وقد أُبقي التعبير الاستعاري في المتن.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: فكما
  rationale: تنقل أداة التعليل γάρ بالفاء الرابطة، وقوة المقارنة في ὥσπερ بلفظ «كما»، في صياغة عربية طبيعية موجزة.
- source_word: Ἰωνᾶς
  choice: يونان
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: ἐν τῇ κοιλίᾳ
  choice: في جوف
  rationale: «جوف» تعبير عربي طبيعي يدل على داخل الكائن، ويحافظ على الصورة من غير صياغة تشريحية متكلفة.
- source_word: τοῦ κήτους
  choice: الكائن البحري
  rationale: κῆτος يدل على مخلوق بحري ضخم، وهو أوسع من مصطلح حيواني محدد؛ لذا تتجنب الصياغة حصره في نوع بعينه.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: ثلاثة أيام وثلاث ليالٍ
  rationale: نقل مباشر للعبارة الزمنية المتكررة، من غير حسم لطبيعة استعمالها الزمني.
- source_word: οὕτως
  choice: هكذا
  rationale: تؤدي المقابلة بين طرفي التشبيه بوضوح وطبيعية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الراسخة لهذا اللقب، وتحفظ صداه الكتابي ولا تختزله في وصف عام.
- source_word: ἔσται
  choice: سيكون
  rationale: ينقل مستقبل فعل الكينونة مباشرة من غير إضافة معنى الاستمرار.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: في قلب الأرض
  rationale: يحافظ على استعارة καρδία ولا يستبدل بها تفسيرًا مثل القبر أو الأعماق.
theological_decisions:
- issue: معنى «قلب الأرض»
  choice: الإبقاء على التعبير الاستعاري «قلب الأرض»
  alternative: القبر، أو أعماق الأرض، أو عالم الأموات
  rationale: العبارة اليونانية لا تحسم وحدها أيًّا من هذه التفسيرات، ولذلك تُحفظ سعتها والتوتر التفسيري فيها.
- issue: دلالة «ثلاثة أيام وثلاث ليالٍ»
  choice: إثبات العبارة الزمنية كما وردت
  alternative: فهمها اصطلاحًا على أنها تشمل أجزاءً من ثلاثة أيام، أو فهمها مدةً صارمة مقدارها اثنتان وسبعون ساعة
  rationale: النص يصرح بالعبارة ولا يفسر طريقة احتسابها، فلا ينبغي للترجمة أن تحسم الجدل الزمني في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ بناء المقارنة والتكرار المقصود، واستُخدمت ألفاظ مألوفة من غير تخصيص علمي أو حسم تفسيري زائد.
