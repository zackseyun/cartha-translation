  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: ar
  text: الإنسان الصالح يُخرج من كنزه الصالح أشياء صالحة[b][a]، والإنسان الشرير يُخرج من كنزه الشرير أشياء شريرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية تستعمل ἄνθρωπος بصيغة المفرد المذكر في معنى تمثيلي عام؛ ويمكن أيضًا ترجمتها: «الشخص».'
    reason: lexical_alternative
  - marker: b
    text: لأن السياق المباشر يتناول الكلام، فقد تشير «الأشياء الصالحة» و«الأشياء الشريرة» بوجه خاص إلى الأقوال.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς
  choice: الصالح
  rationale: يحفظ المعنى الأخلاقي والتكرار المقصود مع ἀγαθά، في صياغة عربية طبيعية.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: يدل هنا على فرد تمثيلي في حكمة عامة، ولفظ «الإنسان» فصيح وشامل من غير أن يضيف تحديدًا غير موجود في المعنى المقصود.
- source_word: θησαυροῦ
  choice: كنزه
  rationale: يحفظ استعارة الرصيد المخزون الذي يخرج منه ما لدى الإنسان؛ وهو أقرب إلى الأصل من «مخزونه» أو «مستودعه».
- source_word: ἐκβάλλει
  choice: يُخرج
  rationale: ينقل صورة الإخراج من الداخل إلى الخارج بوضوح، من غير المبالغة التي قد يوحي بها «يطرح».
- source_word: ἀγαθά
  choice: أشياء صالحة
  rationale: الصفة في اليونانية محايدة جمع ومستعملة استعمال الاسم؛ وإظهار «أشياء» يحفظ اتساع الدلالة والتوازي.
- source_word: πονηρὸς
  choice: الشرير
  rationale: يعكس التقابل الأخلاقي القوي مع «الصالح»، ولا يضعف المعنى إلى مجرد «السيئ».
- source_word: πονηρά
  choice: أشياء شريرة
  rationale: يحفظ التناظر مع «أشياء صالحة» واتساع مدلول صيغة الجمع الاسمية.
- source_word: ἐκ
  choice: من
  rationale: المقابل العربي الطبيعي، فيما يحمل الفعل «يُخرج» معنى الحركة إلى الخارج.
theological_decisions:
- issue: هل تقتصر الأشياء الخارجة على الأقوال أم تشمل كل ما يصدر عن الإنسان؟
  choice: الإبقاء على التعبير العام «أشياء صالحة/شريرة».
  alternative: تفسيرها صراحة بأنها «أقوال صالحة/شريرة».
  rationale: السياق المباشر يتناول الكلام، لكن الأصل لا يذكر اسمًا كـ«أقوال»، بل يستعمل صفتين اسميتين عامتين؛ لذلك تُصان سعة العبارة مع التنبيه إلى دلالة السياق في الحاشية.
- issue: دلالة التقابل الأخلاقي بين الإنسان الصالح والشرير
  choice: عرض التقابل بوصفه حكمة عن صدور الظاهر من الرصيد الباطن، من دون إدخال منظومة عقائدية لاحقة.
  alternative: تقييد الآية بتفسير عقدي مفصل لطبيعة الإنسان أو التجديد.
  rationale: النص يقرر العلاقة التصويرية بين باطن الإنسان وما يخرجه، ولا يفصل هنا الأساس العقدي لذلك الوصف.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع موازاة لفظية مقصودة تحفظ تكرار الصالح/الشرير والكنز/الإخراج في الأصل. وُضعت علامتا الحاشيتين بعد العبارة التي تتصلان بها، مع الحفاظ على ترتيبهما الوارد في طبقة المراجعة الإنجليزية.
