  terminology: «الصالح» و«الشرير» يبرزان المقابلة الأخلاقية بين ἀγαθός وπονηρός بوضوح، و«كنز» يحفظ الاستعارة الأصلية. الحاشية الخاصة بـἄνθρωπος دقيقة، والحاشية السياقية عن إمكان الإشارة الخاصة إلى الأقوال لا تحوّل المعنى العام في المتن إلى تفسير ضيق.
