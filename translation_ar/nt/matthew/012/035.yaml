  source_fidelity: 'الترجمة تحافظ بدقة على البنية المتوازية في اليونانية: «الإنسان الصالح/الإنسان الشرير»، و«كنزه الصالح/كنزه الشرير»، و«أشياء صالحة/أشياء شريرة». وفعل «يُخرج» ينقل بصورة مناسبة ἐκβάλλει، و«من» مع الفعل يحفظان معنى الصدور من الرصيد الداخلي. كما أن «أشياء» تصون عمومية الصفتين الاسميتين المحايدتين الجمع في الأصل، من غير حصرهما في الكلام.'
