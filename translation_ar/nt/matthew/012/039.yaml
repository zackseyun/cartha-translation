  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: ar
  text: 'فأجاب وقال لهم: «جيل شرير وفاسق[a] يطلب آية، ولن تُعطى له آية إلا آية يونان النبي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني معناه الحرفي «زانٍ/زانية»، وقد يستحضر خيانة العهد وعدم الأمانة لله، إلى جانب معناه الحرفي؛ فقد استعمل الأنبياء صورة الزنى للدلالة على الخيانة الروحية.
    reason: cross_reference
  - marker: b
    text: 'ويجوز من حيث ترتيب الكلمات: «آية النبي يونان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب وقال
  rationale: يحافظ على عنصري الصيغة السردية اليونانية، وهي صيغة متأثرة بالأسلوب السامي، مع بقائها مفهومة وطبيعية في العربية الكتابية المعاصرة.
- source_word: Γενεὰ
  choice: جيل
  rationale: ينقل الاسم المفرد الدال على جماعة معاصرة موصوفة وصفًا أخلاقيًا، وهو المقابل العربي المباشر الملائم للسياق.
- source_word: πονηρὰ
  choice: شرير
  rationale: تعبير واضح وقوي عن الإدانة الأخلاقية من غير إضافة تفسير غير موجود في الأصل.
- source_word: μοιχαλὶς
  choice: زانٍ
  rationale: يحفظ صورة الزنى الحادة بدل تسويتها إلى مجرد «غير أمين»، ويتيح أن تُفهم في ضوء الاستعمال النبوي للدلالة على خيانة العهد أيضًا. جاءت الصفة مذكرة لمطابقة «جيل» في العربية.
- source_word: σημεῖον
  choice: آية
  rationale: «آية» هي المقابل العربي المألوف والواسع الدلالة، فتحفظ معنى العلامة أو البرهان المؤيد من غير تقييده صراحة بكونه معجزة.
- source_word: ἐπιζητεῖ
  choice: يطلب
  rationale: ينقل معنى السعي إلى الآية أو التماسها بعبارة عربية مباشرة، من غير تشديد الفعل إلى «يطالب» أو «يتحدى» بما يتجاوز اللفظ اليوناني.
- source_word: δοθήσεται
  choice: ستُعطى
  rationale: ينقل المستقبل المبني للمجهول بوضوح، ويحافظ على عدم التصريح بفاعل العطاء كما في اليونانية.
- source_word: αὐτῇ
  choice: له
  rationale: يعود الضمير على «جيل»، وهو مذكر في العربية، ولذلك يلزم تذكير الضمير مع الحفاظ على مرجعه الجمعي.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تنقل الاستثناء الواقع بعد النفي بأوجز صياغة عربية طبيعية ودقيقة.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: آية يونان النبي
  rationale: صياغة عربية طبيعية قريبة من ترتيب اليونانية، وتترك ماهية الآية دون تفسير سابق لأوانه.
theological_decisions:
- issue: دلالة وصف الجيل بأنه μοιχαλὶς
  choice: إبقاء صورة الزنى في «زانٍ» داخل النص
  alternative: خائن أو غير أمين
  rationale: قد يستحضر اللفظ الزنى الحرفي وصورة الخيانة الروحية أو خيانة العهد في لغة الأنبياء. إبقاء الصورة يحفظ هذا التوتر الدلالي ولا يحصرها في تفسير واحد.
- issue: ماهية «آية يونان»
  choice: إبقاء العبارة على معناها اللفظي دون شرح داخل النص
  alternative: آية مثل اختبار يونان، أو آية قوامها يونان نفسه
  rationale: يفسر السياق اللاحق العبارة بمزيد من التفصيل، أما هذه الآية وحدها فلا ينبغي أن تُحمَّل أحد التفسيرات مقدمًا.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. حُفظت الصيغة السردية «فأجاب وقال»، واستُعملت «آية» بصفتها المصطلح العربي الكتابي الطبيعي. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحهما كل حاشية.
