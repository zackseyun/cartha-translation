  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: ar
  text: 'أما الفريسيون، فلما رأوا ذلك قالوا له: «انظر! تلاميذك يفعلون ما لا يحل فعله يوم السبت[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما لا يجوز فعله يوم السبت».'
    reason: بديل معجمي للفعل ἔξεστιν، الذي يدل على الجواز أو الإباحة.
lexical_decisions:
- source_word: δὲ
  choice: أما
  rationale: تفيد الانتقال مع إبراز المقابلة بين فعل التلاميذ وردّ الفريسيين، بصياغة عربية طبيعية.
- source_word: ἰδόντες
  choice: فلما رأوا ذلك
  rationale: نُقلت صيغة اسم الفاعل اليونانية بمعنى زمني. و«ذلك» مفعول مفهوم من السياق، أي فعل التلاميذ المذكور قبله.
- source_word: εἶπαν αὐτῷ
  choice: قالوا له
  rationale: صيغة مباشرة ومحايدة لنقل فعل القول ومتعلقه.
- source_word: Ἰδοὺ
  choice: انظر!
  rationale: تحافظ على قوة أداة التنبيه ولفت النظر في عربية حديثة واضحة.
- source_word: μαθηταί
  choice: تلاميذك
  rationale: «التلاميذ» هو المقابل المألوف والدقيق في سياق علاقة المعلّم بأتباعه.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: يفعلون ... فعله
  rationale: تحافظ الصياغة على تكرار جذر الفعل في الأصل من غير تكلّف.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ما لا يحل
  rationale: تنقل معنى عدم الإباحة بصبغة قانونية دينية، من غير تحديد مصدر الحكم أو البت في صحة الاعتراض.
- source_word: ἐν σαββάτῳ
  choice: في السبت
  rationale: تعبير عربي موجز يحيل إلى يوم السبت بوصفه زمن الفعل ومحل الاعتراض.
theological_decisions:
- issue: طبيعة اعتراض الفريسيين
  choice: ما لا يحل فعله
  alternative: ما لا يجوز فعله
  rationale: تُبقي الترجمة الاعتراض في إطار الحلّ والمنع، من غير أن تحدد هل يستند إلى نص الشريعة أم إلى تقليد تفسيري، ومن غير أن تحكم مسبقًا بصحته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أما» لإظهار المقابلة، و«انظر!» للمحافظة على قوة التنبيه، مع تجنب الألفاظ القديمة أو التفسير المذهبي.
