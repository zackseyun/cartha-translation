id: MAT.12.42
reference: Matthew 12:42
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ar
  text: مَلِكَةُ الجنوب[a] ستقوم في الدينونة مع هذا الجيل وتدينه، لأنها أتت من أقاصي الأرض لتسمع حكمة سليمان، وها هنا ما هو أعظم من سليمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تشير «مَلِكَةُ الجنوب» إلى ملكة سبأ (1 ملوك 10: 1–13؛ 2 أخبار الأيام 9: 1–12)، مع أن النص اليوناني لا يذكر سبأ بالاسم.'
    reason: cross_reference
  - marker: b
    text: 'أو: «مَن هو أعظم من سليمان هنا». يستعمل اليوناني صيغة محايدة، حرفيًا «ما هو أعظم»، وقد تبرز العظمة الفائقة الحاضرة في يسوع وخدمته.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: مَلِكَةُ الجنوب
  rationale: ترجمة مباشرة للتركيب الإضافي «ملكة الجنوب»، من غير إدخال اسم سبأ الذي لا يرد صراحة في النص اليوناني.
- source_word: ἐγερθήσεται
  choice: ستقوم
  rationale: تحافظ على معنى النهوض أو القيام في مشهد الدينونة، من غير حسم ما إذا كان التركيز على القيامة أو الوقوف للشهادة القضائية.
- source_word: ἐν τῇ κρίσει
  choice: في الدينونة
  rationale: تنقل العبارة اليونانية ذات التعريف بوصفها إشارة إلى الدينونة المحددة.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: مع هذا الجيل
  rationale: تحافظ على المعنى المعتاد لحرف الجر μετά مع المضاف إليه، أي «مع»، بينما يظهر معنى المواجهة من الفعل اللاحق «تدينه».
- source_word: κατακρινεῖ αὐτήν
  choice: وتدينه
  rationale: الفعل يعني الإدانة، والضمير يعود إلى «هذا الجيل»؛ وصيغة العربية واضحة وموجزة.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: من أقاصي الأرض
  rationale: تعبير عربي طبيعي يحفظ صورة المجيء من أبعد الجهات.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: لتسمع حكمة سليمان
  rationale: ينقل مصدر الغرض «لتسمع» والتركيب الإضافي نقلاً مباشرًا واضحًا.
- source_word: ἰδοὺ
  choice: وها
  rationale: أداة تنبيه عربية فصيحة ومفهومة تحفظ قوة لفت الانتباه في النص.
- source_word: πλεῖον Σολομῶνος
  choice: ما هو أعظم من سليمان
  rationale: يحفظ صيغة المقارنة المحايدة في اليونانية باستعمال «ما»، فلا يحولها في المتن إلى مرجع مذكر شخصي صريح.
- source_word: ὧδε
  choice: هنا
  rationale: المقابل العربي المباشر والدقيق للظرف المكاني.
theological_decisions:
- issue: دلالة صيغة المقارنة المحايدة πλεῖον وصلتها بيسوع
  choice: ما هو أعظم من سليمان
  alternative: مَن هو أعظم من سليمان
  rationale: الصيغة اليونانية محايدة نحويًا، ولذلك تحافظ «ما هو أعظم» على سعة القول، الذي قد يشير إلى العظمة الحاضرة في يسوع وخدمته، من غير إنكار أن السياق يتجه إليه. أما «مَن هو أعظم» فتجعل المرجع الشخصي صريحًا وتحسم ما تركته الصيغة اليونانية أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الدينونة» للمشهد الأخروي، و«وها هنا» للحفاظ على أداة التنبيه والظرف معًا. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان مباشرة.
