  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: ar
  text: 'حينئذ أجابه بعض الكتبة والفريسيين قائلين: «يا معلّم، نريد أن نرى منك آيةً[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «آية معجزية». قد تدل الكلمة اليونانية على علامة ذات دلالة خارقة، لكن المتن يحافظ على اللفظ الأوسع «آية».'
    reason: بديل معجمي
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: ظرف زمني طبيعي في السرد، يصل الحدث بما سبقه من غير إطالة.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: أجابه
  rationale: يحافظ على معنى الاستجابة وعلى المخاطَب، وهو تعبير عربي فصيح حتى إن لم يسبقه سؤال مباشر في الآية نفسها.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: بعض الكتبة والفريسيين
  rationale: «بعض» تبين أن المقصود أفراد من هاتين الفئتين لا جميعهم، و«الكتبة» و«الفريسيون» تسميتان موجزتان راسختان.
- source_word: λέγοντες
  choice: قائلين
  rationale: ينقل تركيب اسم الفاعل اليوناني بصورة عربية سليمة تمهّد للكلام المباشر.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ينقل صيغة النداء والمعنى التعليمي مباشرة، من غير إضافة دلالة أقوى مثل «السيد».
- source_word: θέλομεν
  choice: نريد
  rationale: تعبير عربي حديث وواضح عن الإرادة، بلا نبرة قديمة أو متكلفة.
- source_word: ἀπὸ σοῦ
  choice: منك
  rationale: 'يحافظ على دلالة المصدر: آية صادرة من يسوع أو مقدمة منه.'
- source_word: σημεῖον
  choice: آية
  rationale: «آية» تدل على علامة ذات مغزى، ويمكن في السياق أن تحمل دلالة خارقة، فتحفظ سعة اللفظ اليوناني من غير التصريح بما هو أضيق منه.
- source_word: ἰδεῖν
  choice: أن نرى
  rationale: المقابل المباشر والطبيعي لفعل الرؤية، وأقل تفسيرًا من «أن نشهد».
theological_decisions:
- issue: طبيعة σημεῖον في هذا السياق
  choice: آية
  alternative: آية معجزية
  rationale: السياق يوحي بأنهم يطلبون برهانًا خارقًا يثبت سلطان يسوع، لكن اللفظ اليوناني نفسه يعني «آية/علامة» ولا يصرح بصفة «معجزية». لذلك تُحفظ الدلالة الأوسع في المتن، ويُذكر الاحتمال الأضيق في الحاشية.
translation_notes:
  register: العربية فصحى حديثة، واضحة وموقرة. استُخدم تركيب سردي طبيعي، مع إبقاء المصطلحات الإنجيلية المألوفة وتجنب التفسير العقائدي الزائد.
