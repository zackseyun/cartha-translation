source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: ar
  text: 'حينئذ يقول: «سأرجع إلى بيتي الذي خرجت منه». وعندما يأتي، يجده خاليًا[a]، مكنوسًا ومرتَّبًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فارغًا» أو «غير مشغول».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مزيَّنًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني ينقل السرد إلى الفعل التالي، و«حينئذ» صياغة عربية موجزة وطبيعية.
- source_word: λέγει
  choice: يقول
  rationale: حُفظ المضارع السردي الحي في اليونانية، والفاعل المفهوم من السياق هو الروح النجس.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: سأرجع إلى بيتي
  rationale: ينقل معنى الرجوع والاتجاه إلى البيت، ويحفظ ادعاء الروح ملكية البيت بضمير المتكلم.
- source_word: ὅθεν ἐξῆλθον
  choice: الذي خرجت منه
  rationale: صياغة عربية طبيعية تحفظ صورة الخروج المكانية ومرجعها، أي البيت.
- source_word: ἐλθὸν
  choice: عندما يأتي
  rationale: حُوِّل اسم الفاعل الظرفي إلى جملة زمنية عربية واضحة تحفظ تعاقب الحدثين.
- source_word: εὑρίσκει
  choice: يجده
  rationale: يحفظ المضارع السردي ومعنى العثور المباشر.
- source_word: σχολάζοντα
  choice: خاليًا
  rationale: يدل في سياق البيت على كونه فارغًا أو غير مشغول؛ «خاليًا» طبيعية في العربية وتحفظ قابلية المعنى لأن يكون البيت بلا ساكن.
- source_word: σεσαρωμένον
  choice: مكنوسًا
  rationale: ينقل حالة مكتملة ناتجة عن الكنس، كما يدل اسم المفعول التام اليوناني.
- source_word: κεκοσμημένον
  choice: مرتَّبًا
  rationale: ينقل معنى التنظيم والتهيئة في السياق من غير حصر اللفظ في الزينة، مع إثبات احتمال «مزيَّنًا» في الحاشية.
theological_decisions:
- issue: القوة المجازية لكلمة «البيت» في قول الروح النجس العائد
  choice: إبقاء «بيتي» كما وردت، من غير تفسيرها في المتن بأنها الشخص أو حياته.
  alternative: سأرجع إلى الشخص الذي خرجت منه.
  rationale: النص نفسه يستعمل صورة البيت، وإبقاؤها يحفظ بلاغة القول ولا يفرض تفسير المجاز داخل الترجمة.
- issue: دلالة خلو البيت
  choice: ترجمة σχολάζοντα بـ«خاليًا» من غير إضافة تفسير روحي لسبب الخلو أو طبيعته.
  alternative: غير مشغول أو بلا ساكن.
  rationale: اللفظ يحتمل الخلو وعدم الإشغال، ولا يحدد في هذه الآية وحدها هوية من ينبغي أن يشغل البيت.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظ المضارع السردي في «يقول» و«يأتي» و«يجده»، وحُفظت صورة البيت ودرجات أوصافه الثلاثة دون توسع تفسيري.
