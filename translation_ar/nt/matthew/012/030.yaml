  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ar
  text: مَنْ ليس معي فهو عليَّ، ومَنْ لا يجمع معي يبدِّد.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: مَنْ ليس
  rationale: تؤدي «مَنْ» معنى أداة التعريف مع اسم الفاعل المستعمل استعمالًا اسميًّا، وتحافظ على الدلالة العامة المفردة بصياغة عربية طبيعية.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: تنقل معنى المصاحبة والانحياز في μετά مع المضاف إليه، من غير توسيع تفسيري.
- source_word: κατ’ ἐμοῦ
  choice: عليَّ
  rationale: تعبير عربي فصيح ومباشر عن المعارضة التي تدل عليها κατά مع المضاف إليه، ويكوّن مقابلة طبيعية مع «معي».
- source_word: συνάγων
  choice: يجمع
  rationale: يحافظ على الصورة العامة للفعل وعلى تقابلها المقصود مع التبديد، من غير تقييدها بصورة الرعي أو الحصاد.
- source_word: σκορπίζει
  choice: يبدِّد
  rationale: ينقل معنى التفريق والتشتيت، ويقابل «يجمع» بوضوح في العربية.
- source_word: καὶ
  choice: وَ
  rationale: يحافظ على الربط الإضافي بين القولين المتوازيين كما في اليونانية.
theological_decisions:
- issue: حدة التقابل المطلق في قول يسوع
  choice: 'الإبقاء على التقابل الصريح: «معي» أو «عليَّ»، ثم «يجمع» أو «يبدِّد».'
  alternative: إعادة صياغة القول بعبارة تفسيرية تخفف حدة التقابل.
  rationale: النص اليوناني يعرض قولين متوازيين حاسمين بلا قيد يلطّفهما؛ لذلك تُحفظ حدة القول وتوتره اللاهوتي دون استنتاجات عقائدية مضافة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على التوازي البلاغي وحدة المقابلة في الأصل. استُخدمت «مَنْ» في الشطرين لتأدية العموم بصورة طبيعية، و«عليَّ» لمقابلة «معي» مقابلة عربية مألوفة.
