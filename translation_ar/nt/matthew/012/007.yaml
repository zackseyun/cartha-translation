source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: ar
  text: 'ولكن لو كنتم قد عرفتم معنى هذا[a]: «إني أريد رحمةً لا ذبيحةً»، لما أدنتم الأبرياء[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يقتبس يسوع هنا من هوشع 6:6.
    reason: cross_reference
  - marker: b
    text: 'أو: «الذين لا ذنب عليهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: كنتم قد عرفتم
  rationale: ينقل دلالة الماضي الأسبق في الشرط المخالف للواقع، ويُبقي توبيخ يسوع متعلقًا بفهم كان ينبغي أن يكون حاصلًا من قبل.
- source_word: τί ἐστιν
  choice: معنى هذا
  rationale: صياغة عربية طبيعية في سياق تفسير اقتباس كتابي، والمقصود إدراك دلالة القول لا مجرد تعريفه.
- source_word: Ἔλεος
  choice: رحمةً
  rationale: تنقل المعنى المباشر لـἔλεος وتحافظ على البعد العهدي والعملي دون توسيع تفسيري.
- source_word: θέλω
  choice: أريد
  rationale: مقابل عربي واضح وطبيعي يحفظ قوة الإرادة الإلهية في الاقتباس النبوي.
- source_word: θυσίαν
  choice: ذبيحةً
  rationale: المقابل العربي المألوف للمفرد θυσία، ويحفظ المقابلة الحادة في النص النبوي.
- source_word: κατεδικάσατε
  choice: حكمتم على ... بالإدانة
  rationale: يحفظ القوة القضائية للفعل، وتؤدي صيغة «لما حكمتم» مع الشرط معنى النتيجة المخالفة للواقع.
- source_word: ἀναιτίους
  choice: الأبرياء
  rationale: ينقل المعنى القضائي لمن لا ذنب عليهم بلغة عربية طبيعية؛ ويمكن أيضًا ترجمته «الذين لا ذنب عليهم».
theological_decisions:
- issue: صياغة اقتباس هوشع 6:6 بما يحفظ أولوية الرحمة دون أن يضيف حكمًا بإلغاء الذبائح مطلقًا
  choice: «إني أريد رحمةً لا ذبيحةً»
  alternative: «إني أريد الرحمة لا الذبيحة»
  rationale: تحافظ الصياغة على التقابل الصريح في اليونانية وعلى التوتر النبوي بين الرحمة والشعيرة، من غير إدخال تفسير مذهبي يحسم مدى هذا التقابل خارج سياقه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ولكن لو» لتمثيل الشرط المخالف للواقع، و«لما حكمتم» لنتيجته. جُمعت الإحالة والبديل اللفظي في حاشية واحدة لتجنب وضع علامتين متجاورتين، مع ظهور العلامة [a] في المتن.
