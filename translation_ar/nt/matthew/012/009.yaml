lexical_decisions:
- source_word: Καὶ
  choice: ثم
  rationale: أداة ربط تواصل السرد؛ و«ثم» طبيعية في العربية هنا، وتفيد تعاقب الحدثين من غير تحميل العبارة تفصيلًا زمنيًا زائدًا.
- source_word: μεταβὰς ἐκεῖθεν
  choice: انتقل من هناك
  rationale: تنقل معنى اسم الفاعل الدال على مغادرة الموضع السابق والتحول إلى موضع آخر، بصياغة عربية واضحة وموجزة.
- source_word: ἦλθεν
  choice: جاء
  rationale: المقابل المباشر لفعل ἔρχομαι، وهو طبيعي مع ذكر الوجهة التالية، ولا يستلزم افتراض منظور مكاني غير مذكور.
- source_word: εἰς τὴν συναγωγὴν
  choice: إلى مجمعهم
  rationale: تفيد «إلى» الحركة نحو المكان، ويمكن أن يشمل السياق الدخول إليه؛ أما «المجمع» فهو المصطلح العربي المستقر لمكان اجتماع اليهود وعبادتهم.
- source_word: αὐτῶν
  choice: ـهم
  rationale: يحافظ ضمير الجمع على الإحالة العامة في اليونانية من غير تعيين جماعة أكثر تحديدًا مما يسمح به السياق.
theological_decisions:
- issue: مرجع الضمير في «مجمعهم»
  choice: الإبقاء على «مجمعهم» بلا تحديد إضافي
  alternative: مجمع اليهود / مجمع خصومه
  rationale: النص اليوناني لا يحدد مرجع αὐτῶν صراحةً بأكثر من الضمير، لذلك تُصان الإحالة والسمة المحتملة في السياق من غير إدخال نبرة طائفية أو عدائية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على تسلسل الحركة في الأصل، مع تجنب التركيب الحرفي الثقيل «وإذ انتقل».
