  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: ar
  text: فكم الإنسانُ أثمنُ من الخروف! لذلك يجوز فعل الخير في أيام السبت[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير اصطلاحي أكثر سلاسة: «في يوم السبت». تستعمل اليونانية صيغة الجمع من «سبت»، وهي طريقة مألوفة للإشارة إلى السبت أو إلى مراعاته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: فكم إذًا
  rationale: تنقل «كم» قوة المقارنة البلاغية من الأدنى إلى الأعلى، وتحفظ «إذًا» الاستنتاج من المثال السابق.
- source_word: διαφέρει
  choice: يفوق ... قيمةً
  rationale: الفعل هنا يدل على التفوق في القيمة، لا على مجرد الاختلاف؛ وهذه الصياغة العربية واضحة وتحفظ المقارنة.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: اللفظ اليوناني مفرد ذو دلالة عامة، و«الإنسان» هو المقابل العربي الطبيعي الشامل في المقارنة مع الخروف.
- source_word: προβάτου
  choice: الخروفَ
  rationale: المضاف إليه اليوناني يحدد الطرف الثاني في المقارنة؛ ونُقلت العلاقة في العربية بالمفعول بعد «يفوق».
- source_word: ὥστε
  choice: لذلك
  rationale: تُظهر النتيجة المنطقية المستخلصة من تفوق قيمة الإنسان.
- source_word: ἔξεστιν
  choice: يحلّ
  rationale: السياق جدال في مشروعية الفعل يوم السبت، و«يحلّ» تنقل الدلالة القانونية والأخلاقية بإيجاز طبيعي.
- source_word: τοῖς σάββασιν
  choice: في أيام السبت
  rationale: تحفظ الصياغة جمع اللفظ اليوناني بطريقة عربية مفهومة، مع بيان المفرد الاصطلاحي في الحاشية.
- source_word: καλῶς ποιεῖν
  choice: فعل الخير
  rationale: تعبير عربي طبيعي يطابق معنى القيام بما هو صالح ونافع.
theological_decisions:
- issue: الدلالة العامة للفظ ἄνθρωπος
  choice: الإنسان
  alternative: رجل
  rationale: المقصود هنا الإنسان بوصفه إنسانًا في مقابل الخروف، لا شخصًا ذكرًا على وجه التخصيص؛ لذلك تحافظ «الإنسان» على العموم من غير إدخال تخصيص غير موجود في السياق.
- issue: صيغة جمع السبت
  choice: في أيام السبت
  alternative: في يوم السبت
  rationale: أُبقي أثر الجمع اليوناني في المتن، مع التنبيه إلى أن الجمع قد يُستعمل اصطلاحيًا للدلالة على حفظ السبت أو الفعل فيه.
