  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: ar
  text: ومتى خرج الروح النجس من الإنسان، يمرّ عبر أماكن لا ماء فيها[أ]، طالبًا راحة، فلا يجدها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «أماكن جافة». واليونانية حرفيًا: «أماكن بلا ماء».'
    reason: بديل معجمي لـἀνύδρων («بلا ماء/جافة») مع الحفاظ على الصورة الحرفية في المتن.
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: ومتى
  rationale: تفيد ὅταν شرطًا زمنيًا عامًا، وتنقل الواو القوة الانتقالية الخفيفة لـ δέ من غير إدخال معنى «الآن» أو تضاد قوي.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: الروح النجس
  rationale: صياغة عربية واضحة ومألوفة تحفظ لفظ «الروح» وصدى النجاسة في الأصل، من غير استبداله تفسيرًا بـ«الشيطان» أو «العفريت».
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: خرج ... من الإنسان
  rationale: ينقل الخروج والابتعاد عن الإنسان، وتناسب صيغة الماضي بعد «متى» الشرط الزمني العام في العربية.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: يجتاز في أماكن لا ماء فيها
  rationale: «يجتاز» تنقل الحركة عبر نطاق، و«لا ماء فيها» تعبّر مباشرة عن المعنى الحرفي لـ ἀνύδρων بلغة طبيعية واضحة.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: طالبًا راحة
  rationale: يحفظ الحال المتزامنة وغرض البحث، ويبقي «راحة» عامة كما في اليونانية دون تخصيصها بمكان للراحة.
- source_word: καὶ οὐχ εὑρίσκει
  choice: فلا يجدها
  rationale: الفاء طبيعية لبيان النتيجة في العربية، والضمير يعود بوضوح إلى «راحة» مع أن المفعول مفهوم ضمنًا في اليونانية.
theological_decisions:
- issue: دلالة πνεῦμα في سياق إخراج الأرواح
  choice: الروح
  alternative: الشيطان / الروح الشرير
  rationale: النص يقول πνεῦμα موصوفًا بأنه نجس، لا δαιμόνιον؛ لذلك يُحفظ اللفظ الأصلي ولا يُستبدل بتفسير أضيق.
- issue: جنس وصف «الروح»
  choice: الروح النجس
  alternative: الروح النجسة
  rationale: استُعمل التذكير وفق الاستعمال العربي المعياري الغالب لكلمة «روح» في هذا السياق، من غير أن يضيف ذلك تحديدًا لطبيعة الكائن أو جنسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ بناء المثل العام، واستُخدمت عبارة «أماكن لا ماء فيها» بدل «أماكن جافة» لأنها أقرب إلى الصورة اليونانية وأوضح للقارئ المعاصر.
