  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: ar
  text: لا يخاصم ولا يصرخ[a]، ولا يسمع أحد صوته في الشوارع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا ينازع ولا يصيح، ولا يسمع أحد صوته في الساحات العامة».'
    reason: بدائل معجمية ممكنة للأفعال ἐρίζω وκραυγάζω وللاسم πλατεῖαι.
lexical_decisions:
- source_word: ἐρίσει
  choice: يخاصم
  rationale: الفعل يدل على الدخول في خصام أو نزاع؛ و«يخاصم» عربي واضح وطبيعي، ويحفظ وصف العبد بأنه غير ميّال إلى المشاجرة من غير أن يوحي بأنه يمتنع عن كل نقاش.
- source_word: κραυγάσει
  choice: يصرخ
  rationale: يدل على رفع الصوت أو الصياح؛ و«يصرخ» يحفظ التوازي اللفظي وقوة التعبير من غير إضافة دلالة عدوانية غير لازمة.
- source_word: ἀκούσει τις
  choice: ولا يسمع أحد
  rationale: تنقل تركيب النفي مع الضمير غير المحدد بصياغة عربية طبيعية، وتحفظ تراكم النفي في الجملة اليونانية.
- source_word: ἐν ταῖς πλατείαις
  choice: في الشوارع
  rationale: تشير πλατεῖαι إلى الشوارع العريضة أو الطرق العامة؛ و«الشوارع» أوضح في العربية المعاصرة، مع ذكر «الساحات العامة» في الحاشية بوصفه احتمالًا سياقيًا.
- source_word: φωνὴν αὐτοῦ
  choice: صوته
  rationale: φωνή تعني هنا الصوت، ولا سيما صوت الكلام أو النداء العلني؛ فـ«صوته» هو المقابل المباشر والطبيعي.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: لا… ولا… ولا…
  rationale: تحفظ هذه الصياغة العربية البنية الثلاثية التراكمية للنفي بوضوح وسلاسة.
theological_decisions:
- issue: صلة الآية باقتباس عبد الرب من إشعياء وتصوير سلوك المسيح
  choice: تصوّر الآية المسيح غير مخاصم ولا صاخب طلبًا للظهور العلني.
  alternative: يمكن أن تُفهم الألفاظ بصياغة أكثر حرفية مثل «لا ينازع ولا يصيح».
  rationale: يحفظ النص هيئة العبد الهادئة غير المتنازعة، من غير توسيع المعنى إلى القول بأنه لا يتكلم علنًا مطلقًا أو أنه سلبي في كل موقف.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت أفعال مألوفة للقارئ العام، مع الحفاظ على التوازي والنفي المتكرر في الأصل اليوناني، ووُضع احتمال «الساحات العامة» في الحاشية.
