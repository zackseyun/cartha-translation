  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: ar
  text: 'وإذا برجلٍ له يد يابسة. فسألوه قائلين: «هل يحلّ الشفاء في أيام السبت[a]؟» لكي يتهموه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُصاغ العبارة بالعربية على نحو أكثر اصطلاحًا: «هل يحلّ الشفاء يوم السبت؟» جاءت العبارة في اليونانية بصيغة الجمع، حرفيًا «في السبوت»، وهي طريقة مألوفة للإشارة إلى أيام السبت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: أداة سردية عربية طبيعية تلفت النظر إلى ظهور الرجل في المشهد وتحفظ حيوية ἰδού من غير تكلف.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: المقصود هنا فرد ذكر بعينه، لذلك «رجل» أدق من لفظ عام مثل «إنسان».
- source_word: χεῖρα ἔχων ξηράν
  choice: يده يابسة
  rationale: صياغة عربية موجزة وطبيعية تحافظ على صورة ξηράν من غير افتراض تشخيص طبي أدق مما يورده النص.
- source_word: ἐπηρώτησαν αὐτόν λέγοντες
  choice: فسألوه قائلين
  rationale: يحفظ فعل السؤال والبنية الحالية في λέγοντες، مع ربط عربي سلس بالسياق.
- source_word: ἔξεστι
  choice: هل يحلّ
  rationale: ينقل معنى الجواز الشرعي في سياق النزاع حول شريعة السبت، لا مجرد الإذن الاجتماعي.
- source_word: τοῖς σάββασιν
  choice: في أيام السبت
  rationale: ينقل صيغة الجمع اليونانية بمعنى أيام السبت المتكررة، مع تجنب صيغة «السبوت» الأقل شيوعًا في العربية الحديثة.
- source_word: θεραπεύειν
  choice: الشفاء
  rationale: مصدر عربي واضح يدل هنا على فعل المعالجة والشفاء، ويحافظ على عمومية السؤال القانونية من غير إضافة فاعل غير مذكور.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: لكي يتهموه
  rationale: يحفظ دلالة الغاية في ἵνα والمعنى الاتهامي القانوني للفعل κατηγορέω بصياغة عربية مباشرة.
theological_decisions:
- issue: صيغة السبت في سياق السؤال الشرعي
  choice: في أيام السبت
  alternative: في السبت
  rationale: الأصل اليوناني بصيغة الجمع، وهي طريقة مألوفة للإشارة إلى أيام السبت عمومًا. أُثبت معنى الجمع في المتن، مع ذكر الصياغة العربية المفردة الشائعة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «وإذا» بوصفها أداة سردية طبيعية، وحُفظ الطابع الشرعي للسؤال بلفظ «يحلّ»، مع إبقاء جمع السبت دلاليًا في عبارة «أيام السبت».
