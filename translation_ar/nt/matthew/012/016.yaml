lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يواصل السرد ببساطة من غير إضافة دلالة زمنية أو سببية غير مصرَّح بها.
- source_word: ἐπετίμησεν
  choice: حَذَّرَ
  rationale: الفعل يدل هنا على تحذير أو توجيه صارم، كما يتضح من مضمون العبارة التالية. ولفظ «حذَّر» ينقل قوة المنع من غير أن يفترض بالضرورة توبيخ المخاطَبين على ذنب.
- source_word: αὐτοῖς
  choice: هُمْ
  rationale: ضمير جمع يعود إلى المذكورين في السياق السابق، وقد أُدمج طبيعيًّا في الفعل العربي «حذَّرهم».
- source_word: ἵνα μὴ
  choice: أَلَّا
  rationale: تنقل تركيب الغاية أو مضمون التوجيه بعد فعل التحذير، وهي صياغة عربية طبيعية وموجزة.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: يُعَرِّفُوا بِهِ
  rationale: ينقل التعبير الاصطلاحي معنى إشهاره أو جعله معروفًا للناس، مع إبقاء الشخص نفسه موضوعًا للإفصاح.
theological_decisions:
- issue: طبيعة توجيه يسوع بشأن إذاعة أمره
  choice: تحذير قوي من التعريف به علنًا
  alternative: توبيخ المخاطَبين أو إصدار أمر رسمي لهم
  rationale: يسمح الفعل اليوناني بدرجات من التوبيخ والتحذير والأمر، لكن جملة المضمون تؤكد هنا المنع من الإذاعة. لا يذكر النص في هذه الآية سبب المنع، لذلك لا تضيف الترجمة تفسيرًا لاهوتيًّا له.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «يُعَرِّفوا به» بمعنى يجعلوه معروفًا أو يذيعوا أمره، مع حاشية تحفظ شدة الفعل اليوناني واتساعه الدلالي.
