  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: ar
  text: 'لكني أقول لكم: إن شيئًا أعظم من الهيكل هنا[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن شخصًا أعظم من الهيكل هنا»، أو: «إن واحدًا أعظم من الهيكل هنا». تستعمل اليونانية صيغة المحايد لكلمة «أعظم»، فيبقى المرجع غير مصرَّح به من حيث الصيغة.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «في هذا المكان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: لكني أقول لكم
  rationale: صيغة خطاب مباشر؛ وتؤدي «لكن» وظيفة δέ التقابلية الخفيفة مع الحجة السابقة، مع بقاء العبارة طبيعية وفصيحة.
- source_word: ὅτι
  choice: إن
  rationale: تُدخل مضمون القول بوضوح في العربية.
- source_word: τοῦ ἱεροῦ
  choice: من الهيكل
  rationale: ἱερόν يدل عادة على مجمع الهيكل، لا على المقدس الداخلي تحديدًا؛ و«الهيكل» هو المقابل العربي المألوف هنا، وتأتي «من» بعد اسم التفضيل للمقارنة.
- source_word: μεῖζόν
  choice: ما هو أعظم
  rationale: اسم التفضيل اليوناني محايد مفرد ومستعمل استعمالًا اسميًا من غير تصريح بمرجعه؛ وتحافظ الصياغة على عدم التعيين بدل أن تحسمه في شخص بعينه.
- source_word: ἐστιν
  choice: —
  rationale: فعل الكينونة في المضارع لا يلزم إظهاره مستقلًا في الجملة الاسمية العربية؛ ودلالته حاضرة في التركيب.
- source_word: ὧδε
  choice: ههنا
  rationale: ظرف مكان بمعنى «هنا» أو «في هذا المكان». اختيرت «ههنا» لما فيها من فصاحة ووضوح ونبرة تلائم جلال القول.
theological_decisions:
- issue: هوية المرجع غير المصرح به في اسم التفضيل المحايد μεῖζόν
  choice: «ما هو أعظم» من غير تسمية المرجع أو تحويله صراحة إلى شخص
  alternative: «مَن هو أعظم من الهيكل ههنا» أو «واحد أعظم من الهيكل ههنا»
  rationale: ورد μεῖζόν بصيغة المحايد المفرد لا المذكر. ومع أن السياق يشير بقوة إلى يسوع وسلطانه، تحافظ الترجمة على الصيغة اليونانية وعلى التوتر الدلالي واللاهوتي من غير تضييق المرجع في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «ههنا» بوصفها صيغة فصيحة مفهومة، وأُبقي عدم تعيين مرجع μεῖζόν في المتن. تظهر علامتا الحاشيتين [a] و[b] في موضعهما.
