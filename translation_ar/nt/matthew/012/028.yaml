  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ar
  text: ولكن إن كنتُ أنا أُخرج الشياطين بروح الله[a]، فقد بلغكم[b] ملكوت الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في روح الله». يحتمل التركيب اليوناني معنى الوسيلة («بروح الله») أو المجال («في روح الله»).'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «وصل إليكم» أو «حلَّ عليكم». يؤكد الفعل اليوناني أن ملكوت الله قد بلغهم في أعمال يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن
  rationale: تنقل الشرط مع التحول الجدلي الخفيف الذي تفيده δέ، بصياغة عربية واضحة وطبيعية.
- source_word: ἐν πνεύματι θεοῦ
  choice: بروح الله
  rationale: تحتمل ἐν مع المجرور معنى الوسيلة أو المجال؛ و«بروح الله» تؤدي معنى الفاعلية الإلهية بإيجاز، مع بيان البديل الحرفي في الحاشية.
- source_word: ἐγὼ
  choice: أنا
  rationale: أُثبت الضمير المنفصل للمحافظة على التوكيد الذي يحمله وروده الصريح في اليونانية.
- source_word: ἐκβάλλω
  choice: أُخرج
  rationale: تعبير عربي مباشر ومألوف في سياق إخراج الشياطين، ويحفظ قوة الفعل من غير تكلف.
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: المقابل العربي الواضح للكائنات الشيطانية المقصودة، مع نقل أداة التعريف.
- source_word: ἄρα
  choice: فقد
  rationale: الفاء تبين أن الجملة نتيجة للشرط، و«قد» مع الماضي تؤكد تحقق الوصول ونتيجته الحاضرة.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: بلغكم
  rationale: ينقل معنى الوصول إلى المخاطَبين في عبارة عربية طبيعية، من غير تسطيح دلالة الفعل إلى مجرد الاقتراب؛ وتُذكر بدائل الصورة اليونانية في الحاشية.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يحفظ دلالتي سلطان الله الملكي ومملكته، من غير اختزاله في مفهوم مجرد.
theological_decisions:
- issue: دلالة بلوغ ملكوت الله في أعمال يسوع
  choice: تفيد العبارة أن ملكوت الله قد وصل إلى المخاطَبين وصولًا حقيقيًا حاضرًا، كما تشهد أعمال إخراج الشياطين.
  alternative: أن الملكوت اقترب فقط ولم يصل بعد، أو أن العبارة لا تشير إلا إلى اكتمال مستقبلي.
  rationale: الفعل ἔφθασεν يدل هنا على البلوغ أو الوصول، وحجة الآية تقوم على كون إخراج الشياطين دليلًا حاضرًا على عمل سلطان الله، من غير أن تحسم الآية وحدها كل جوانب الاكتمال المستقبلي.
- issue: مرجع «روح الله»
  choice: الإبقاء على «روح الله» بوصفه العامل الإلهي في إخراج الشياطين.
  alternative: فهم العبارة على أنها مجرد قوة إلهية غير مشخصة.
  rationale: النص يسند إخراج الشياطين إلى πνεῦμα θεοῦ، وترجمة «روح الله» تحفظ المرجع كما هو من غير إضافة تفسير مذهبي إلى العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي الضمير «أنا» لإظهار التوكيد اليوناني، واستُعمل «ملكوت الله» لرسوخه ودقته. وُضعت علامتا الحاشيتين بعد الجملة لأن الأولى تشرح «بروح الله» والثانية تشرح «بلغكم»، مع بقاء كلتيهما ظاهرتين في المتن.
