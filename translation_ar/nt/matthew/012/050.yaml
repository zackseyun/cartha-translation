id: MAT.12.50
reference: Matthew 12:50
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: ar
  text: لِأَنَّ مَنْ يَفْعَلُ مَشِيئَةَ أَبِي الَّذِي فِي السَّمَاوَاتِ، فَهُوَ أَخِي وَأُخْتِي وَأُمِّي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: مَنْ
  rationale: اسم شرط/موصول عام يفيد الشمول، وينقل معنى «كل من» بصياغة عربية طبيعية موجزة.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: يحفظ الصلة التفسيرية والتعليلية بما يسبق في السياق.
- source_word: ποιήσῃ
  choice: يَفْعَلُ
  rationale: مع «مشيئة» يقابل التعبير اليوناني مباشرة من غير تضييق المعنى إلى الطاعة وحدها.
- source_word: τὸ θέλημα
  choice: مَشِيئَةَ
  rationale: يحفظ الدلالة الإرادية واللاهوتية للتعبير، وهو تركيب عربي مألوف مع الفعل «يفعل».
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: أَبِي الَّذِي فِي السَّمَاوَاتِ
  rationale: ينقل العبارة الوصفية كاملة، ويحفظ جمع «السماوات» الوارد في اليونانية بدل اختزاله إلى صفة «السماوي».
- source_word: αὐτός
  choice: فَهُوَ
  rationale: الضمير المنفصل يحفظ توكيد اليونانية، والفاء تربط جواب البنية العامة ربطًا عربيًا طبيعيًا.
- source_word: ἀδελφὸς
  choice: أَخِي
  rationale: المقابل المباشر في المفرد، مع إظهار الإضافة إلى المتكلم.
- source_word: ἀδελφὴ
  choice: أُخْتِي
  rationale: المقابل المباشر في المفرد، ويُبقي الدور العائلي المؤنث مذكورًا صراحة.
- source_word: μήτηρ
  choice: أُمِّي
  rationale: المقابل المباشر في المفرد، ويحفظ ثلاثية أفراد الأسرة.
- source_word: ἐστίν
  choice: هو ...
  rationale: تؤدي الجملة الاسمية العربية معنى فعل الكينونة في الحاضر دون حاجة إلى فعل ظاهر.
theological_decisions:
- issue: الصيغة المذكرة في قول عام شامل
  choice: مَنْ ... فَهُوَ أَخِي وَأُخْتِي وَأُمِّي
  alternative: كل من يفعل مشيئة أبي الذي في السماوات، فهو أخي وأختي وأمي
  rationale: «مَنْ» العربية عامة تشمل الذكر والأنثى، بينما يحفظ «فهو» مفردية الصياغة وتوكيد αὐτός. وذكر «أختي» و«أمي» صراحة يبيّن أن المقصود لا يقتصر على الذكور، من غير إضافة تفسير إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة قريبة من بنية الأصل وطبيعية في الوقت نفسه. ضُبط النص ضبطًا جزئيًا لتسهيل القراءة، ولم تُضف حاشية لأن عموم «مَنْ» في العربية واضح ولا يثير الإشكال النحوي نفسه الموجود في الإنجليزية.
