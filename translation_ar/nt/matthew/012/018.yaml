reference: Matthew 12:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: ar
  text: «هُوَذَا عَبْدِي الَّذِي اخْتَرْتُهُ، حَبِيبِي الَّذِي سُرَّتْ بِهِ نَفْسِي[a]. سَأَضَعُ رُوحِي عَلَيْهِ، وَسَيُعْلِنُ الْعَدْلَ[b] لِلْأُمَمِ[c].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي رضيت عنه نفسي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «القضاء» أو «الحكم».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لغير اليهود»؛ فاللفظة اليونانية قد تدل على الأمم عمومًا أو على غير اليهود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: هُوَذَا
  rationale: تحافظ على وظيفة اللفظة في لفت الانتباه وعلى النبرة النبوية المهيبة، وهي مألوفة في العربية الفصحى.
- source_word: παῖς
  choice: عَبْدِي
  rationale: سياق الاقتباس من إشعياء هو سياق عبد الرب؛ لذا فـ«عبدي» أدق من «طفلي» أو «ابني»، ولا تُدخل في هذه اللفظة معنى بنويًا غير مصرَّح به.
- source_word: ὃν ᾑρέτισα
  choice: الَّذِي اخْتَرْتُهُ
  rationale: تنقل فعل الاختيار الإلهي المكتمل بصياغة عربية مباشرة وطبيعية.
- source_word: ὁ ἀγαπητός μου
  choice: حَبِيبِي
  rationale: تعبير عربي موجز وكريم يحفظ معنى المحبة الخاصة في ἀγαπητός دون زيادة تفسيرية.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: الَّذِي سُرَّتْ بِهِ نَفْسِي
  rationale: يحفظ ذكر «نفسي» الصريح في اليونانية، وينقل معنى المسرة والرضا من غير اختزال العبارة إلى «الذي رضيت عنه» فقط.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: سَأَضَعُ رُوحِي عَلَيْهِ
  rationale: صياغة قريبة من تركيب اليونانية وتحافظ على صورة حلول روح الله على العبد وتكليفه.
- source_word: κρίσιν
  choice: الْعَدْلَ
  rationale: في سياق رسالة عبد الرب إلى الأمم، تعبّر «العدل» بوضوح عن النظام الإلهي القويم الذي يعلنه؛ وتُحفظ دلالة «القضاء/الحكم» الممكنة في الحاشية.
- source_word: τοῖς ἔθνεσιν
  choice: لِلْأُمَمِ
  rationale: تحفظ المدى العالمي للاقتباس النبوي، مع الإشارة في الحاشية إلى إمكان فهم اللفظة بمعنى غير اليهود.
- source_word: ἀπαγγελεῖ
  choice: سَيُعْلِنُ
  rationale: تنقل فعل الإبلاغ العلني بصياغة عربية واضحة، وتحفظ زمن الاستقبال.
theological_decisions:
- issue: هوية παῖς في اقتباس عبد الرب
  choice: ترجمتها «عبدي».
  alternative: طفلي؛ ابني.
  rationale: الاقتباس يستحضر نص عبد الرب في إشعياء ويعرض يسوع في هذا الدور. تحافظ «عبدي» على الصلة النصية من غير أن تنفي بنوته أو تستوردها من لفظ آخر.
- issue: دلالة κρίσις في رسالة العبد
  choice: إثبات «العدل» في المتن.
  alternative: القضاء؛ الحكم.
  rationale: اللفظة تحتمل الحكم أو القضاء، لكن «العدل» أنسب هنا لوصف ما يعلنه العبد للأمم من نظام الله القويم. أُبقي البديل في الحاشية حفاظًا على الاتساع الدلالي.
- issue: تعبير εὐδόκησεν ἡ ψυχή μου
  choice: 'إبقاء «نفسي» صريحة: «سُرَّت به نفسي».'
  alternative: رضيت عنه؛ أنا مسرور به.
  rationale: يحفظ التعبير السامي الأصلي وشدته الوجدانية، من غير تحويل «النفس» إلى تقرير عقائدي مستقل أو حذفها بالتفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة نبوية مهيبة. استُخدم الضبط الجزئي لتسهيل القراءة، وحُفظ التوازي بين عبارات القول الإلهي. أُعيد ترتيب علامات الحواشي بحسب مواضعها الطبيعية في النص العربي، مع ظهور كل علامة في المتن.
