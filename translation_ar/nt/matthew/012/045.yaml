reference: Matthew 12:45
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: ar
  text: ثم يذهب ويأخذ معه سبعة أرواح أخرى أشدّ شرًّا منه[a]، فتدخل وتسكن هناك؛ فتصير حالة ذلك الإنسان الأخيرة أسوأ من حالته الأولى[b]. وهكذا سيكون الأمر أيضًا مع هذا الجيل الشرير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سبعة أرواح مختلفة أشدّ شرًّا منه».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «فتصير أواخر ذلك الإنسان أسوأ من أوائله»، أي إن حالته الأخيرة تصير أسوأ من حالته الأولى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: ثم يذهب
  rationale: ينقل الظرف الزمني تتابع الأحداث، ويحافظ المضارع على حيوية السرد.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: يأخذ معه
  rationale: تعبير عربي طبيعي ودقيق يفيد اصطحاب الأرواح الأخرى.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: سبعة أرواح أخرى
  rationale: «أخرى» تدل على أرواح إضافية، من غير أن تفرض اختلافًا في النوع.
- source_word: πονηρότερα ἑαυτοῦ
  choice: أشرّ منه
  rationale: صيغة تفضيل موجزة وطبيعية تنقل ازدياد الشر؛ ويعود الضمير إلى الروح المذكور في السياق.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: فتدخل وتسكن هناك
  rationale: يُصاغ اسم الفاعل اليوناني فعلًا عربيًا متعاقبًا. ومع أن κατοικεῖ مفرد في النص المطبوع، فالسياق يفيد إقامة الأرواح السبعة، ولذلك جاء الفعلان بالجمع.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: أواخر ذلك الإنسان
  rationale: يحافظ على صورة العبارة اليونانية وعلى مقابلتها مع «أوائله»، مع إمكان بيان معناها الاصطلاحي في الحاشية.
- source_word: χείρονα τῶν πρώτων
  choice: أسوأ من أوائله
  rationale: ينقل المقابلة بين النهاية والبداية بعبارة عربية واضحة وموجزة.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: وهكذا سيكون أيضًا لهذا الجيل الشرير
  rationale: يحفظ تطبيق التشبيه على الجيل الحاضر، ويجعل «لهذا الجيل» متعلّقًا طبيعيًا بالفعل في العربية.
theological_decisions:
- issue: تسمية الكائنات الشريرة في πνεύματα
  choice: أرواح
  alternative: شياطين
  rationale: النص اليوناني يقول «أرواح»، والسياق السابق يحدد أنها أرواح نجسة؛ فالإبقاء على اللفظ لا يضيف تخصيصًا غير وارد في هذه العبارة.
- issue: ترجمة ἀνθρώπου
  choice: ذلك الإنسان
  alternative: ذلك الرجل
  rationale: «الإنسان» هو المقابل العربي العام الطبيعي لـἄνθρωπος هنا، ويصلح للمثال التمثيلي من غير أن يغير العدد أو يحصر التطبيق في الذكور.
- issue: إفراد κατοικεῖ مع فاعل جمع في السياق
  choice: فتدخل وتسكن
  alternative: فتدخل، فيسكن هناك
  rationale: القراءة المطبوعة تحمل توترًا نحويًا؛ روعي المعنى السياقي من غير إنشاء فاعل مفرد جديد، مع التصريح بالملاحظة في القرار المعجمي بدل إخفائها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يأخذ معه» بدل صياغة أثقل، وأُبقيت صورة «أواخره/أوائله» في المتن مع شرحها في الحاشية حفاظًا على التعبير اليوناني ووضوح معناه.
