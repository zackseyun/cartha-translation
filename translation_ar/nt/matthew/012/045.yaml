revisions:
- from: ثم يذهب ويأخذ معه سبعة أرواح أخرى أشرّ منه[a]، فتدخل وتسكن هناك؛ فتصير أواخر ذلك الإنسان أسوأ من أوائله[b]. وهكذا سيكون أيضًا لهذا الجيل الشرير.
  to: ثم يذهب ويأخذ معه سبعة أرواح أخرى أشدّ شرًّا منه[a]، فتدخل وتسكن هناك؛ فتصير حالة ذلك الإنسان الأخيرة أسوأ من حالته الأولى[b]. وهكذا سيكون الأمر أيضًا مع هذا الجيل الشرير.
  rationale: تُستبدل الحرفية غير المألوفة في مقابلة «الأواخر/الأوائل» بعبارة عربية واضحة تنقل الاصطلاح اليوناني نفسه، مع إبقاء الصياغة الحرفية وشرحها في الحاشية. كما تُصاغ الجملة الختامية بصيغة فصحى طبيعية تحافظ على انطباق المثال على الجيل المذكور.
