  rationale: استُبدل «يقود» بـ«يُخرج» للمحافظة على دلالة ἐκβάλῃ وعلى صلة العبارة بصياغة اقتباس إشعياء، مع إبقاء التعبير «إلى النصر» الذي ينقل εἰς νῖκος. كما عُدلت الحاشية b لتعرض البديل المعجمي لـκρίσις من دون تغيير الفعل.
