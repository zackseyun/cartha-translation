review_pass:
  verdict: revise
  source_fidelity: الترجمة أمينة في صورتي «القصبة المرضوضة» و«الفتيلة التي تدخّن»، وفي «العدل» مقابل κρίσις. لكن «يقود العدل إلى النصر» تُضعف الدلالة الأساسية لـἐκβάλῃ، وهي الإخراج أو الإبراز/الإظهار، لا القيادة.
  naturalness: الصياغة فصيحة واضحة وتحافظ على التوازي الشعري. و«فتيلة لا تزال تدخّن» عربية طبيعية في وصف فتيلة ضعيفة الاحتراق.
  terminology: «قصبة مرضوضة»، و«فتيلة»، و«يطفئ»، و«العدل» اختيارات سليمة في العربية الفصحى الحديثة. ويُستحسن أن تعكس الحاشية البديلة فعل «يُخرج» أيضًا، لا «يقود».
  issues:
  - severity: medium
    issue: الفعل «يقود» مقابل ἐκβάλῃ
    rationale: ἐκβάλλω في هذا الاقتباس، على الرغم من خلفيته الحرفية «يُخرج»، يفيد إبراز العدل أو إخراجه إلى نتيجته الظافرة. أما «يقود» فيضيف صورة قيادة ليست في الفعل وتبتعد عن بنية المصدر.
  - severity: low
    issue: صياغة البديل في الحاشية b
    rationale: الحاشية الحالية تغيّر الفعل إلى «يقود» مع أنها تعرض بديلًا لمعنى κρίσις. ينبغي أن تحفظ فعل المتن المصحح وتبيّن أن البديل هو «القضاء/الحكم».
