id: MAT.12.20
reference: Matthew 12:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: ar
  text: قَصَبَةً مَرْضُوضَةً لا يَكْسِرُ، وفَتِيلَةً لا تَزالُ تُدَخِّنُ[a] لا يُطْفِئُ، إلى أن يُخْرِجَ العَدْلَ إلى النَّصْرِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «كَتّانًا مُدَخِّنًا»، أي الكتان المستعمل فتيلةً في المصباح.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى أن يُخرج القضاءَ (أو الحُكمَ) إلى النصر».'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: قَصَبَةً
  rationale: يدل اللفظ على القصبة أو ساق القصب، و«قصبة» هي المقابل العربي الطبيعي الملائم للصورة النبوية.
- source_word: συντετριμμένον
  choice: مَرْضُوضَةً
  rationale: يفيد اللفظ شيئًا سُحق أو تضرر. وتحافظ «مرضوضة» على صورة قصبة متضررة لم تنكسر تمامًا، بما ينسجم مع قوله اللاحق «لا يكسر».
- source_word: κατεάξει
  choice: لا يَكْسِرُ
  rationale: ترجمة مباشرة واضحة للفعل الدال على الكسر أو التحطيم، وتحفظ صورة الرفق.
- source_word: λίνον
  choice: فَتِيلَةً
  rationale: اللفظ يعني الكتان حرفيًا، لكنه يشير هنا إلى كتان يُستعمل فتيلةً في المصباح؛ لذلك تنقل «فتيلة» المقصود بوضوح للقارئ المعاصر.
- source_word: τυφόμενον
  choice: لا تَزالُ تُدَخِّنُ
  rationale: يصف اللفظ فتيلةً يخرج منها الدخان وهي على وشك الانطفاء. وهذه الصياغة عربية طبيعية وتحفظ دلالة التدخين الخافت.
- source_word: σβέσει
  choice: لا يُطْفِئُ
  rationale: «يطفئ» هو المقابل العربي المباشر والطبيعي لإخماد النار أو الفتيلة.
- source_word: ἕως ἂν
  choice: إلى أن
  rationale: تنقل العبارة نقطةً مستقبلية تستمر إلى بلوغها الأفعال المنفية السابقة.
- source_word: ἐκβάλῃ
  choice: يَقودَ
  rationale: الفعل يعني أصلًا الإخراج أو الدفع إلى الخارج، لكنه في هذا التركيب يدل على إيصال العدل إلى غايته الحاسمة. و«يقود» تحافظ على حركة العبارة نحو النصر من غير خشونة «يطرح» الحرفية.
- source_word: εἰς νῖκος
  choice: إلى النَّصْرِ
  rationale: تنقل الغاية والنتيجة الناجحة التي تدل عليها العبارة اليونانية.
- source_word: τὴν κρίσιν
  choice: العَدْلَ
  rationale: يمكن أن يعني اللفظ القضاء أو الحكم أو العدل. وفي سياق اقتباس إشعياء، يشير إلى إقامة النظام العادل، ولذلك اختير «العدل» مع إثبات البديل في الحاشية.
theological_decisions:
- issue: معنى κρίσις في اقتباس نشيد العبد من إشعياء
  choice: العَدْلَ
  alternative: القَضاءَ أو الحُكمَ
  rationale: السياق يتناول رسالة العبد التي تُظهر نظام الله العادل وتبلغه غايته، لا مجرد إصدار حكم قضائي. ومع ذلك يبقى معنى «القضاء/الحكم» ممكنًا لغويًا، ولذلك لم يُحذف بل أُثبت في الحاشية.
- issue: درجة حرفية صورة λίνον في المصباح
  choice: فَتِيلَةً ... لا يُطْفِئُ
  alternative: كَتّانًا مُدَخِّنًا ... لا يُخمِدُ
  rationale: يشير النص حرفيًا إلى الكتان، والمقصود به كتان المصباح أي الفتيلة. تُظهر صياغة المتن الشيء المقصود بوضوح، بينما تحفظ الحاشية الصورة اللفظية للمصدر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع إبقاء الإيقاع الشعري المتوازي للصورتين. استُعملت «مرضوضة» بدل «مكسورة» لتجنب الإيحاء بأن القصبة انكسرت بالفعل، واستُعملت صياغة «لا تزال تدخن» لتوضيح حال الفتيلة المحتضرة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
