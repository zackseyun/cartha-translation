  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: ar
  text: 'لكي يتمّ ما قيل على لسان إشعياء النبي القائل:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تربط العبارة بما سبق وتُبقي دلالة الغاية أو النتيجة من غير حسم زائد.
- source_word: πληρωθῇ
  choice: يتمّ
  rationale: ينقل المبني للمجهول وصيغة التتميم المألوفة عند متّى بلغة عربية طبيعية، ويفيد بلوغ القول النبوي تمام تحققه.
- source_word: τὸ ῥηθὲν
  choice: ما قيل
  rationale: يقابل اسم المفعول المعرّف المستعمل استعمال الاسم، ويحافظ على المبني للمجهول بإيجاز طبيعي.
- source_word: διὰ
  choice: على لسان
  rationale: تعبير عربي مألوف عن الوساطة في نقل القول، يحفظ كون إشعياء واسطة نبوية ولا يجعله بالضرورة المصدر النهائي للكلام.
- source_word: Ἠσαΐου
  choice: إشعياء
  rationale: الصيغة العربية الكتابية الراسخة لاسم النبي.
- source_word: τοῦ προφήτου
  choice: النبي
  rationale: يحفظ وصف إشعياء الوارد صراحة في اليونانية.
- source_word: λέγοντος
  choice: القائل
  rationale: اسم فاعل يوافق إشعياء النبي ويمهّد مباشرة للاقتباس الآتي، مع تجنّب الغموض الذي قد ينشأ من «قائلًا».
theological_decisions:
- issue: الوساطة النبوية في صيغة الاقتباس
  choice: على لسان إشعياء النبي
  alternative: بإشعياء النبي / من خلال إشعياء النبي
  rationale: يحفظ معنى διά مع المضاف إليه، أي الوساطة البشرية في نقل الكلام، من غير أن ينص على هوية المتكلم النهائي بما يتجاوز العبارة نفسها.
- issue: دلالة ἵνα بين الغاية والنتيجة
  choice: لكي يتمّ
  alternative: فتمّ بذلك
  rationale: تحافظ «لكي» على صيغة الغاية/النتيجة المفتوحة في الأصل، ولا تختزلها في نتيجة محضة.
translation_notes:
  register: عربية فصحى واضحة وموقّرة. استُعملت «على لسان» بدل النقل الحرفي «من خلال» لأنها أفصح في سياق القول النبوي، واستُعمل «القائل» لربط الآية بالاقتباس التالي بوضوح.
