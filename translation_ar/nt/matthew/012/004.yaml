  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: ar
  text: كَيْفَ دَخَلَ بَيْتَ اللهِ، وَأَكَلُوا[a] خُبْزَ الْحُضُورِ[b]، الَّذِي لَمْ يَكُنْ يَحِلُّ لَهُ أَنْ يَأْكُلَ مِنْهُ، وَلَا لِلَّذِينَ مَعَهُ، بَلْ لِلْكَهَنَةِ وَحْدَهُمْ؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «أَكَلَ» بدلًا من «أَكَلُوا».'
    reason: textual_variant
  - marker: b
    text: أي الخبز المقدس الموضوع أمام الله، ويُسمّى أيضًا «خُبْزَ التَّقْدِمَةِ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: كَيْفَ
  rationale: تنقل أداة الاستفهام التي تُدخل مضمون استشهاد يسوع بقصة داود، بصياغة عربية طبيعية ومباشرة.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: دَخَلَ بَيْتَ اللهِ
  rationale: تحافظ على لفظ «بيت الله» الوارد في اليونانية من غير استبداله بتحديد سياقي مثل «خيمة الاجتماع».
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: خُبْزَ الْحُضُورِ
  rationale: ينقل التعبير الطقسي عن الخبز الموضوع أمام الله، مع إبقاء «خبز التقدمة» بديلًا اصطلاحيًا في الحاشية.
- source_word: ἔφαγον
  choice: أَكَلُوا
  rationale: يتبع صيغة الجمع في نص SBLGNT، وهي تنسجم مع ذكر الذين كانوا مع داود، مع إثبات قراءة المفرد في الحاشية.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: الَّذِي لَمْ يَكُنْ يَحِلُّ لَهُ أَنْ يَأْكُلَ مِنْهُ
  rationale: تفيد «يحل» معنى الجواز الشرعي في السياق الطقسي، و«منه» تلائم كون المرجع خبزًا يتكون من أرغفة متعددة.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: وَلَا لِلَّذِينَ مَعَهُ
  rationale: ترجمة قريبة وطبيعية لا تزيد على دلالة النص بتسمية المرافقين رجالًا أو أصحابًا.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: بَلْ لِلْكَهَنَةِ وَحْدَهُمْ
  rationale: تنقل الاستثناء والحصر بعبارة عربية واضحة، وتحافظ على قصر الإباحة على الكهنة.
theological_decisions:
- issue: القوة الشرعية والطقسية للتعبير ἐξὸν
  choice: لَمْ يَكُنْ يَحِلُّ لَهُ
  alternative: لَمْ يَكُنْ مَسْمُوحًا لَهُ
  rationale: يحفظ فعل «يحل» البعد الشرعي المرتبط بأحكام العبادة والكهنوت، من غير إضافة تفسير مذهبي.
- issue: فاعل ἔφαγον في الاختلاف النصي
  choice: أَكَلُوا في المتن
  alternative: أَكَلَ
  rationale: يتبع المتن صيغة الجمع المطبوعة في SBLGNT، بينما تُذكر قراءة المفرد في الحاشية لأنها تغيّر الفاعل النحوي مباشرة.
- issue: هوية بيت الله في قصة داود
  choice: بَيْتَ اللهِ
  alternative: خَيْمَةَ الِاجْتِمَاعِ
  rationale: يحافظ على تعبير النص اليوناني ويترك تعيين المبنى في سياقه التاريخي دون إدخاله في الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «خبز الحضور» في المتن للمحافظة على صورة الوقوف أمام الله، مع شرح المصطلح الطقسي وذكر البديل الشائع في الحاشية. وُضعت علامتا الحاشيتين عند الموضعين اللذين تتعلقان بهما مباشرة.
