  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: ar
  text: وإن كان الشيطان يطرد الشيطان، فقد انقسم على نفسه[a]. فكيف إذن تثبت مملكته؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فهو منقسم على نفسه»، أو: «فقد أصبح منقسمًا على نفسه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فكيف يمكن لمملكته أن تثبت؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: وإن كان
  rationale: تحفظ الواو صلة الكلام بما قبله، وتنقل أداة الشرط بصياغة عربية طبيعية ملائمة للحجة الافتراضية.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: الشيطان
  rationale: الصيغة العربية المعيارية المعروفة للاسم/اللقب، مع إبقاء تكراره كما في اليونانية لأنه جوهر الحجة.
- source_word: ἐκβάλλει
  choice: يطرد
  rationale: ينقل معنى الإخراج بالقوة بوضوح، ويلائم سياق إخراج الشياطين دون تعبير اصطلاحي متكلف.
- source_word: ἐφ’ ἑαυτὸν
  choice: على نفسه
  rationale: تعبير عربي طبيعي يدل على الانقسام الموجَّه ضد الذات؛ وفعل «انقسم» يتعدى اصطلاحًا بـ«على» في هذا السياق.
- source_word: ἐμερίσθη
  choice: فقد انقسم
  rationale: 'تحفظ الصيغة معنى الماضي اليوناني مع إبراز الحالة الناتجة في الفرض: إذا وقع ذلك، فقد صار منقسمًا على نفسه.'
- source_word: πῶς οὖν
  choice: فكيف إذن
  rationale: تنقل الاستفهام والنتيجة الاستدلالية معًا، والفاء توضح تفرع السؤال عما سبقه.
- source_word: σταθήσεται
  choice: تثبت
  rationale: تحفظ استعارة الوقوف بمعنى البقاء راسخًا والاستمرار، وهي أفصح وأطبع مع «المملكة» من الترجمة الحرفية «تقف».
- source_word: ἡ βασιλεία αὐτοῦ
  choice: مملكته
  rationale: تلائم صورة سلطان منقسم لا يستطيع الثبات، وتحفظ الإحالة المباشرة إلى الشيطان.
theological_decisions:
- issue: قوة الحجة في انقسام الشيطان على نفسه
  choice: 'صيغت الآية بوصفها حجة افتراضية تؤدي إلى نتيجة: إذا طرد الشيطانُ الشيطانَ، فقد انقسم على نفسه، فلا تثبت مملكته.'
  alternative: يمكن توسيع العبارة بإدخال صورة «البيت المنقسم» من السياق السابق.
  rationale: النص اليوناني هنا يذكر انقسام الشيطان ومملكته مباشرة، ولا يكرر صورة البيت؛ لذلك لم تُستورد الصورة من السياق إلى ألفاظ هذه الآية.
- issue: القيمة الزمنية والمبني للمجهول في ἐμερίσθη
  choice: فقد انقسم
  alternative: فهو منقسم / فقد قُسِّم
  rationale: «فقد انقسم» يصون دلالة الحدث/النتيجة من غير أن يوحي بفاعل خارجي غير مذكور، ويحافظ على منطق الشرط دون حسم زائد لطبيعة المبني للمجهول اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «يطرد» لسلاسته في سياق إخراج الشياطين، و«تثبت مملكته» للحفاظ على استعارة الثبات بصياغة عربية طبيعية. جميع علامات الحواشي مثبتة في المتن.
