source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: ar
  text: أمّا يسوع، فعندما علم بذلك، انصرف من هناك.[a] وتبعه كثيرون، فشفاهم جميعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمّا يسوع، فإذ علم، انصرف من هناك». لا تذكر اليونانية مفعول «علم» صراحةً، ويُفهم من سياق الآية السابقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: عندما علم بذلك
  rationale: اسم الفاعل الأوريستي يدل على علم سابق مهّد للفعل الرئيس. و«بذلك» تحيل طبيعيًا إلى تآمر الفريسيين في الآية السابقة، مع بقاء المعلوم غير مصرّح به داخل هذه الآية.
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: يفيد الابتعاد عن المكان في سياق معارضة أو خطر، من غير أن يضيف معنى الخوف. و«انصرف» عربية واضحة وطبيعية وتحفظ هذا الظل الدلالي.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: مقابل عربي موجز وطبيعي للدلالة على الحركة بعيدًا عن موضع سابق.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: تبعه كثيرون
  rationale: تحفظ معنى πολλοί بوصفه «كثيرين» من غير تحويله إلى «جموع» أو «حشود»، وهو ما لا يصرّح به اللفظ اليوناني.
- source_word: ἐθεράπευσεν
  choice: شفا
  rationale: المقابل العربي المألوف والدقيق للفعل في سياقات الشفاء في الأناجيل.
- source_word: αὐτοὺς πάντας
  choice: شفاهم جميعًا
  rationale: تحفظ شمول πάντας في تركيب عربي فصيح وطبيعي.
theological_decisions:
- issue: المفعول المحذوف مع γνοὺς
  choice: عندما علم بذلك
  alternative: وإذ علم، انصرف من هناك
  rationale: اليونانية تترك متعلق العلم ضمنيًا، والسياق السابق يمدّه من مؤامرة الفريسيين. الإحالة بـ«بذلك» توضح الصلة السياقية من غير تسمية مضمون يتجاوز النص.
- issue: دلالة مغادرة يسوع
  choice: انصرف
  alternative: ابتعد / غادر
  rationale: يحفظ اللفظ معنى الانسحاب المقصود استجابةً للمعارضة، من غير إيحاء بالجبن أو إضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «أمّا» لإبراز المقابلة التي تفيدها δέ، وربطت الجملة الأخيرة بالفاء لتوضيح تتابع الحدث طبيعيًا من غير تغيير مضمونه.
