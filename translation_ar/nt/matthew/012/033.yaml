  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: ar
  text: إمّا اجعلوا الشجرةَ جيدةً وثمرَها جيدًا، أو اجعلوا[a] الشجرةَ فاسدةً وثمرَها فاسدًا؛ فمن ثمرها تُعرَف الشجرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «فاسدة» بـ«رديئة» أو «متعفنة»؛ فاللفظ اليوناني قد يدل على ما تلف أو فسد أو صار عديم القيمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: تجعلوا
  rationale: فعل أمر بصيغة الجمع، وترجمته بـ«تجعلوا» تحفظ بنيته الصريحة والتوازي البلاغي، مع احتمال أن تكون له هنا قوة خطابية بمعنى «عدّوا» أو «أظهروا أنها».
- source_word: δένδρον
  choice: الشجرة
  rationale: المقابل العربي الطبيعي المباشر، ويحفظ الصورة المجازية المركزية.
- source_word: καλός
  choice: جيدة / جيدًا
  rationale: «جيد» يحفظ دلالة الصلاح في النوع أو الحال، مع إبقاء إمكان الصدى الأخلاقي في السياق، بخلاف «سليم» الذي قد يضيّق المعنى إلى الصحة.
- source_word: καρπός
  choice: ثمر
  rationale: لفظ عربي طبيعي للصورة المجازية، ويتلاءم مع اسم الجنس في اليونانية.
- source_word: σαπρός
  choice: فاسدة / فاسدًا
  rationale: «فاسد» يلائم الشجرة والثمر معًا، وينقل معنى التلف أو الرداءة أو انعدام النفع دون حصره في التعفن المادي وحده.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: فمن ثمرها
  rationale: الفاء تنقل علاقة التعليل التي تؤديها γάρ، و«من ثمرها» تحافظ بوضوح وطبيعية على دلالة ἐκ.
- source_word: γινώσκεται
  choice: تُعرَف
  rationale: تحفظ صيغة المضارع المبني للمجهول، وهي عبارة عربية موجزة وطبيعية.
- source_word: αὐτοῦ
  choice: ها
  rationale: الضمير يعود إلى «الشجرة»، ويُترجم في العربية بضمير المؤنث المفرد الموافق لها نحويًا.
theological_decisions:
- issue: قوة فعلي الأمر في المثل
  choice: 'الإبقاء على الأمر المباشر: «اجعلوا... اجعلوا»'
  alternative: «عدّوا الشجرة جيدة...» أو «أظهروا أن الشجرة جيدة...»
  rationale: الأصل يكرر فعل أمر ماضيًا في اليونانية، وقد يكون استعماله بلاغيًا للتحدي أو التصنيف. إبقاء صيغة الأمر يحفظ حدة القول والتوتر التفسيري بدل حسمه في إعادة صياغة تقريرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على التوازي بين الشجرة وثمرها وعلى صيغة الأمر في الأصل. وُضعت علامتا الحاشية بعد أول استعمال لـ«فاسدة» وبعد العبارة الثانية كاملة لتمييز الملاحظة المعجمية من الملاحظة النحوية البلاغية.
