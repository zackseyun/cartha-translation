  verdict: approve
  source_fidelity: 'النص العربي ينقل البنية الجدلية للنص اليوناني بأمانة: الشرط («وإن كنت أنا»)، ووسيلة طرد الشياطين («ببعلزبول»)، والسؤال المقارن عن «أبنائكم»، ثم النتيجة المستقبلية بأنهم «قضاتكم». وتحافظ «هم» على توكيد αὐτοὶ دون إضافة تفسيرية.'
  naturalness: الصياغة فصيحة واضحة وطبيعية في العربية المعيارية الحديثة. «أطرد الشياطين» و«فبمن يطردها أبناؤكم؟» سليمتان ومفهومتان، كما أن ترتيب «سيكونون هم قضاتكم» رصين ومناسب للسياق.
  terminology: اختيار «بعلزبول» يتبع صيغة Βεελζεβούλ في النص اليوناني، والحاشية تعرض «بعلزبوب» بوصفها الصيغة التقليدية البديلة. و«الشياطين» مقابل عربي كتابي مألوف لـδαιμόνια، فيما يحافظ «أبناؤكم» على اللفظ المصدرّي من غير تضييق مرجعه إلى أتباع أو جماعة بعينها.
