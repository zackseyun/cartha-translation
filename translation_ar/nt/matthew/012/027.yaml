  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ar
  text: وَإِنْ كُنْتُ أَنَا أَطْرُدُ الشَّيَاطِينَ بِبَعْلَزَبُولَ[a]، فَبِمَنْ يَطْرُدُهَا أَبْنَاؤُكُمْ؟ لِذَلِكَ سَيَكُونُونَ هُمْ قُضَاتَكُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «بعلزبول»؛ وتَرِد في ترجمات كثيرة الصيغة «بعلزبوب».'
    reason: إثبات صيغة الاسم في النص اليوناني والتنبيه إلى الصيغة التقليدية البديلة.
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: بِبَعْلَزَبُولَ
  rationale: حرف الجر ἐν هنا يفيد الوسيلة أو الفاعلية في سياق الاتهام، فالباء العربية تنقل المعنى طبيعيًا. ونُقل الاسم بحسب صورة النص اليوناني Βεελζεβούλ دون استبداله بالصيغة التقليدية البديلة.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: أَطْرُدُ الشَّيَاطِينَ
  rationale: الفعل ἐκβάλλω في سياق إخراج الأرواح الشريرة يعني الطرد والإخراج بالقوة؛ و«أطرد» واضح وطبيعي في العربية المعاصرة. و«الشياطين» مقابل عربي مألوف لـδαιμόνια في هذا السياق.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: أَبْنَاؤُكُمْ
  rationale: يحافظ الاختيار على لفظ القرابة الصريح υἱοί وعلى التوازي البلاغي، دون حسم ما إذا كان المقصود تلاميذ المخاطَبين أو أفراد جماعتهم.
- source_word: ἐν τίνι
  choice: فَبِمَنْ
  rationale: تفيد ἐν هنا الوسيلة أو الفاعلية كما في العبارة السابقة، والاستفهام بـ«مَن» يلائم الإشارة إلى قوة أو فاعل شخصي ويحفظ حجة المقارنة.
- source_word: διὰ τοῦτο
  choice: لِذَلِكَ
  rationale: تنقل «لذلك» دلالة النتيجة والاستنتاج بإيجاز ووضوح.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: سَيَكُونُونَ هُمْ قُضَاتَكُمْ
  rationale: يحافظ هذا التركيب على زمن المستقبل وعلى الاسم الخبري «قضاة»، ويؤدي ضمير الفصل معنى التوكيد الظاهر في αὐτοὶ.
theological_decisions:
- issue: هوية اسم Βεελζεβούλ وصيغته
  choice: بعلزبول
  alternative: بعلزبوب
  rationale: تتبع الترجمة صورة الاسم المطبوعة في SBLGNT، وتنقله صوتيًا بدل مواءمته مع الصيغة التقليدية الأشهر. والحاشية تحفظ الصيغة البديلة المعروفة من غير أن تجعلها متنًا.
- issue: هوية «أبنائكم»
  choice: الإبقاء على التعبير الحرفي «أبناؤكم»
  alternative: أتباعكم أو أفراد جماعتكم
  rationale: قد يشير التعبير سياقيًا إلى أتباع المخاطَبين أو أفراد جماعتهم، لكن النص يستخدم لفظ القرابة؛ لذلك تُحفظ سعة الدلالة ولا تُحسم الهوية تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعمل «أطرد» بدل تعبير أثقل مثل «أُخرج» لإبراز معنى الإبعاد في سياق طرد الشياطين، مع الحفاظ على البنية الجدلية والسؤال البلاغي والتوكيد في «هم قضاتكم».
