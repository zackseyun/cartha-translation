  terminology: «أمي» و«إخوتي» مصطلحان دقيقان وطبيعيان للقرابة هنا. لا تفرض الترجمة أي تفسير مذهبي أو توسعة لمعنى القرابة، وتحافظ على قوة السؤال البلاغي.
