  source_fidelity: النص العربي ينقل بدقة السؤالين الاستفهاميين في اليونانية («مَن هي أمي، ومَن هم إخوتي؟»)، ويحافظ على التمييز المذكر الجمع في «إخوتي». واختزال الصيغة الاصطلاحية ἀποκριθεὶς εἶπεν إلى «فأجاب» سليم ومألوف، والحاشية تبيّن الصياغة الأقرب إلى اللفظ. و«الذي كان يكلّمه» يؤدي بصورة مناسبة اسم الفاعل τῷ λέγοντι αὐτῷ دون تعيين هوية الشخص أو إدخال تفسير سياقي.
