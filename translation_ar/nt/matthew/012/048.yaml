  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: ar
  text: 'فأجاب الذي كان يكلّمه[a]: «مَن هي أمي، ومَن هم إخوتي؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى اللفظ: «فأجاب وقال للذي كان يكلّمه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: التركيب «أجاب وقال» تعبير يوناني متأثر بالأسلوب السامي، ويؤدي «فأجاب» معناه طبيعيًا من غير تكرار ثقيل. والفاء تُظهر انتقال الحديث وصلته بما قبله.
- source_word: τῷ λέγοντι αὐτῷ
  choice: الذي كان يكلّمه
  rationale: اسم الفاعل المضارع معرّف ويشير إلى الشخص الذي كان يوجّه الكلام إلى يسوع؛ وصيغة «كان يكلّمه» واضحة وتحفظ دلالة الفعل الجاري في المشهد.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: مَن هي أمي
  rationale: ينقل الاستفهام عن الهوية نقلًا مباشرًا وطبيعيًا، مع إبقاء السؤال البلاغي بلا تفسير مضاف.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: ومَن هم إخوتي
  rationale: يحافظ على موازاة السؤال الأول، ويترجم ἀδελφοί بصيغة القرابة المذكرة «إخوتي» بحسب مرجعها في سياق الأسرة المباشر.
theological_decisions:
- issue: احتمال تلطيف سؤال يسوع البلاغي عن هوية الأسرة أو شرحه
  choice: الإبقاء على السؤالين المباشرين من غير إضافة تفسيرية
  alternative: مَن تُعَدّ أمي، ومَن يُعَدّون إخوتي؟
  rationale: الآية التالية تبيّن مقصود يسوع من القرابة، أما هذه الآية فتمهّد لذلك بسؤال بلاغي؛ وإضافة «تُعَدّ» قد تستبق الشرح وتخفف التوتر المقصود.
- issue: دلالة ἀδελφοί من جهة الجنس
  choice: إخوتي
  alternative: إخوتي وأخواتي؛ أشقائي
  rationale: اللفظ اليوناني مذكر جمع، ومرجعه المباشر هنا أفراد أسرة يسوع المذكورون في المشهد؛ لذلك لا يُوسَّع إلى صيغة تشمل الأخوات صراحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «يكلّمه» بدل تعبير أثقل مثل «يتحدث إليه»، وحُفظ إيجاز السؤال وقوته البلاغية.
