  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الاستمرار الزمني في «لا يزال»، والتزامن في «وبينما»، وجمع «الجموع»، ووظيفة التنبيه السردي في «إذا»، وموضع الأسرة «في الخارج»، وغرضهم «يطلبون أن يكلّموه». و«واقفون» تؤدي المعنى الحَالِي/الاستمراري لصيغة εἱστήκεισαν من غير إضافة موضع غير مذكور.'
