base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: ar
  text: وبينما كان لا يزال يكلِّم الجموع، إذا أمه وإخوته[a] واقفون في الخارج، يطلبون أن يكلِّموه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية أيضًا أقرباءه المقرَّبين إذا أُخذت بمعنى أوسع؛ وهي هنا بصيغة الجمع المذكر، ولذلك تُرجمت في المتن «إخوته».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: وبينما كان لا يزال يكلِّم
  rationale: ينقل تركيب الحال المطلق الدال على تزامن الحدث، مع معنى الاستمرار في ἔτι والانتقال السردي الخفيف في δέ، بصياغة عربية طبيعية.
- source_word: τοῖς ὄχλοις
  choice: الجموع
  rationale: يحافظ على صيغة الجمع في اليونانية، وهو تعبير عربي واضح ومعاصر.
- source_word: ἰδοὺ
  choice: إذا
  rationale: «إذا» الفجائية تؤدي في السياق السردي وظيفة لفت الانتباه إلى تطور جديد، بصورة طبيعية في العربية من غير تسطيح القوة السردية.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: أمه وإخوته
  rationale: تُفهم الإضافة إلى يسوع مع الاسمين من السياق والتركيب، و«إخوته» تنقل صيغة ἀδελφοί المذكرة الجمع من دون حسم طبيعة القرابة المقصودة.
- source_word: εἱστήκεισαν ἔξω
  choice: واقفون في الخارج
  rationale: ينقل الحالة المستمرة التي تفيدها صيغة الفعل، ولا يضيف مكانًا محددًا كـ«البيت» غير مذكور صراحة في الآية.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: يطلبون أن يكلِّموه
  rationale: يحفظ معنى السعي المقصود في ζητοῦντες، ويعبّر بوضوح عن غرضهم في الكلام إليه.
theological_decisions:
- issue: دلالة ἀδελφοί في وصف أسرة يسوع
  choice: إخوته
  alternative: أقرباؤه أو إخوته وأخواته
  rationale: الصيغة اليونانية جمع مذكر، وأقرب مقابل مباشر لها «إخوته». لا تحسم الترجمة ما إذا كانت القرابة إخوة أشقاء أو نوعًا آخر من القرابة، بل تترك التوتر التفسيري قائمًا وتوضحه الحاشية.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «إذا» الفجائية مقابل ἰδοὺ، وحُفظ جمع «الجموع» وصيغة «إخوته» مع حاشية تبقي احتمال المعنى الأوسع للقرابة من دون فرض موقف مذهبي.
