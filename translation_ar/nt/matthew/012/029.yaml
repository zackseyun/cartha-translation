  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: ar
  text: أو كيف يستطيع أحد أن يدخل بيت الرجل القوي ويستولي على أمتعته[a]، إن لم يربطه[b] أولًا؟ وعندئذ ينهب بيته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مقتنياته»؛ فاللفظة اليونانية قد تعني حرفيًا الأواني أو الأدوات، وقد تدل بوجه أعم على الأمتعة والممتلكات.
    reason: lexical_alternative
  - marker: b
    text: أو «يقيّده».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: أو
  rationale: تقدّم صورة تفسيرية بديلة مرتبطة بالحجة السابقة، وتحافظ «أو» على الإيجاز والترابط.
- source_word: πῶς δύναταί τις
  choice: كيف يستطيع أحد
  rationale: صياغة عربية طبيعية تحافظ على الاستفهام البلاغي وعلى عموم الضمير اليوناني غير المحدد.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ
  choice: أن يدخل بيت الرجل القوي
  rationale: تنقل الصورة الحسية مباشرة، وتستعمل «الرجل القوي» لأن الصفة اليونانية مستعملة استعمال الاسم في صورة مجازية مذكرة.
- source_word: τὰ σκεύη αὐτοῦ
  choice: أمتعته
  rationale: اللفظة قد تدل حرفيًا على الأواني أو الأدوات، لكنها في سياق اقتحام البيت تشمل المقتنيات عمومًا؛ و«أمتعته» واضحة وطبيعية مع إبقاء البديل الحرفي في الحاشية.
- source_word: ἁρπάσαι
  choice: يستولي على
  rationale: يفيد الأخذ بالقوة من غير أن يطابق تمامًا فعل النهب الأقوى الوارد في ختام الآية.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: إن لم يربط أولًا
  rationale: يحافظ على الشرط وعلى الترتيب الزمني، وينقل معنى الربط المباشر في الصورة.
- source_word: καὶ τότε
  choice: وعندئذ
  rationale: يحافظ على العطف والتتابع الزمني بأسلوب عربي فصيح وطبيعي.
- source_word: διαρπάσει
  choice: ينهب
  rationale: ينقل معنى السلب الأوسع أو الأشد الذي يفيده الفعل المركب، ويميّزه من ἁρπάσαι السابق.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: بيته
  rationale: يبقي صورة البيت المقتحم كما هي، من غير تحويلها تفسيريًا إلى مملكة أو نطاق سلطان.
theological_decisions:
- issue: الصيغة المذكرة في صورة الرجل القوي
  choice: الرجل القوي / أحد
  alternative: القوي / أيّ شخص
  rationale: يحافظ النص على الشخصية المذكرة المحسوسة في المثل، مع ترجمة الضمير غير المحدد بصيغة عربية طبيعية لا تحصر فاعل السؤال في شخص بعينه.
- issue: المدى المجازي للبيت والأمتعة
  choice: الإبقاء على صورة اقتحام البيت ونهبه
  alternative: التصريح بالمملكة أو نطاق السلطان والممتلكات
  rationale: السياق يتصل بسلطان يسوع على القوى الشيطانية، لكن الآية نفسها تعرض هذا المعنى في صورة مجازية؛ لذلك لا تُدرج هوية الرجل القوي أو مدلولات عناصر الصورة في متن الترجمة.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. حوفظ على بنية السؤال البلاغي وعلى التدرج بين الاستيلاء على الأمتعة ونهب البيت، مع تجنب إدخال تفسير لاهوتي مباشر في ألفاظ المثل.
