  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: ar
  text: 'أَمَّا الْفَرِّيسِيُّونَ فَلَمَّا سَمِعُوا قَالُوا: «هَذَا لَا يُخْرِجُ الشَّيَاطِينَ إِلَّا بِبَعْلَزَبُولَ[a]، رَئِيسِ الشَّيَاطِينِ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'بَعْلَزَبُول: الصيغة التقليدية «بَعْلَزَبُوب».'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: تنقل المقابلة مع رد فعل الجموع في السياق السابق بأسلوب عربي طبيعي، من غير جعلها مجرد عطف.
- source_word: ἀκούσαντες
  choice: فَلَمَّا سَمِعُوا
  rationale: تنقل اسم الفاعل الماضي بوصفه ظرفًا زمنيًّا سابقًا للقول، وتُبقي مفعول السماع مفهومًا من السياق كما في اليونانية.
- source_word: Οὗτος
  choice: هَذَا
  rationale: يحافظ على الإشارة المباشرة التي قد تحمل نبرة ازدراء في السياق، من غير إضافة «الرجل» غير الموجودة صراحة في الأصل.
- source_word: ἐκβάλλει
  choice: يُخْرِجُ
  rationale: تعبير عربي واضح ومألوف في سياق إخراج الشياطين، وقريب من الدلالة الحرفية للفعل.
- source_word: δαιμόνια
  choice: الشَّيَاطِينَ
  rationale: المقابل العربي الكتابي الشائع والواضح للكائنات الروحية الشريرة المقصودة هنا.
- source_word: εἰ μὴ
  choice: إِلَّا
  rationale: 'تفيد الحصر بوضوح وإيجاز: ينفون أن يكون الإخراج بأي وسيلة سوى الوسيلة التي يزعمونها.'
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: بِبَعْلَزَبُولَ
  rationale: الباء تنقل معنى الوسيلة أو القوة الذي تؤديه ἐν في هذا السياق، من دون توسيع تفسيري مثل «بقوة».
- source_word: Βεελζεβοὺλ
  choice: بَعْلَزَبُولَ
  rationale: نقل صوتي لصيغة الاسم في النص اليوناني SBLGNT، مع إثبات الصيغة التقليدية المألوفة في الحاشية.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: رَئِيسِ الشَّيَاطِينِ
  rationale: «رئيس» تعبير عربي طبيعي يدل على صاحب السلطة والزعامة، ويحافظ على علاقة البدل بالاسم السابق.
theological_decisions:
- issue: نبرة اسم الإشارة Οὗτος
  choice: هَذَا
  alternative: هَذَا الرَّجُلُ / هُوَ
  rationale: «هذا» يلتزم بلفظ الأصل ويحفظ إمكان النبرة الازدرائية من غير أن يفرضها بإضافة وصف غير مصرح به.
- issue: صيغة الاسم Βεελζεβούλ
  choice: بَعْلَزَبُولَ
  alternative: بَعْلَزَبُوبَ
  rationale: المتن يتبع الصيغة اليونانية المثبتة في SBLGNT، بينما تُحفظ الصيغة التقليدية المعروفة في الحاشية.
- issue: طبيعة الاتهام في ἐν τῷ Βεελζεβοὺλ
  choice: بِبَعْلَزَبُولَ
  alternative: بِقُوَّةِ بَعْلَزَبُولَ
  rationale: الباء تُبقي معنى الوسيلة أو الوكالة مفتوحًا كما في العبارة اليونانية، ولا تضيف لفظ «قوة» تفسيرًا ملزمًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم الضبط الكامل لتيسير القراءة، وحُفظ الإيجاز والاتهام المباشر في الأصل من غير شرح زائد.
