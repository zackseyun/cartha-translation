  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: ar
  text: 'فقال لهم: «أما قرأتم ما فعله داود حين جاع هو والذين معه؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم العبارة على أن الجوع شمل داود والذين معه جميعًا. والفعل «جاع» مفرد في اليونانية ويشير صراحةً إلى داود، لكن العبارة اللاحقة قد تُفهم على أنها تشمل الذين معه أيضًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: فقال
  rationale: تفيد δέ انتقالًا خفيفًا إلى جواب يسوع؛ وصيغة «فقال» طبيعية في السرد العربي، ولا يلزم إبراز الاستدراك بأداة مستقلة.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: نقل مباشر ودقيق للفعل λέγω مع ضمير المفعول غير المباشر.
- source_word: Οὐκ ἀνέγνωτε
  choice: أما قرأتم
  rationale: صيغة استفهام إنكاري طبيعية في العربية، تستحضر معرفتهم السابقة بالكتاب من غير تقييد بزمن ماضٍ بعينه.
- source_word: τί ἐποίησεν
  choice: ما فعله
  rationale: يحافظ على المعنى التاريخي البسيط للفعل ποιέω بلا توسع تفسيري.
- source_word: Δαυὶδ
  choice: داود
  rationale: الصيغة العربية المعيارية للاسم الكتابي.
- source_word: ὅτε ἐπείνασεν
  choice: حين جاع
  rationale: ترجمة موجزة وطبيعية للفعل πεινάω، والمفرد في الأصل اليوناني يحيل صراحة إلى داود.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: هو والذين معه
  rationale: تجعل العطف العربي طبيعيًا، مع إبقاء احتمال شمول الجوع لداود ومن معه، دون استبدال العبارة بتوصيف تفسيري مثل «رفاقه».
