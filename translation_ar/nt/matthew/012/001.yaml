  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: ar
  text: في ذلك الوقت، مرَّ يسوع يوم السبت[a] عبر حقول الحبوب، فجاع تلاميذه وبدأوا يقطفون سنابل ويأكلون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا في اليونانية: «في السبوت»، وهي صيغة جمع اصطلاحية تعني هنا «يوم السبت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: في ذلك الوقت
  rationale: ينقل الإشارة الزمنية السردية بوضوح، إذ يدل καιρός هنا على وقت أو مناسبة لا على زمن تقيسه الساعة.
- source_word: ἐπορεύθη
  choice: مرَّ
  rationale: يفيد الفعل الذهاب أو السير، ومع عبارة «بين حقول القمح» تؤدي «مرَّ» المعنى طبيعيًا من غير مبالغة في إبراز هيئة الفعل.
- source_word: τοῖς σάββασιν
  choice: يوم السبت
  rationale: صيغة الجمع اليونانية هنا استعمال اصطلاحي يشير إلى يوم السبت؛ والمفرد هو التعبير العربي الطبيعي.
- source_word: διὰ τῶν σπορίμων
  choice: بين حقول القمح
  rationale: تشير σπόριμα إلى الحقول المزروعة، ولا سيما حقول الحبوب؛ واختيار القمح ملائم للسياق وواضح للقارئ، وإن كان اللفظ اليوناني أعم من القمح وحده.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: فجاع تلاميذه
  rationale: δέ رابط سردي خفيف، والفاء تصل الحدث بما سبقه على نحو عربي طبيعي من غير جعلها أداة استدراك قوية.
- source_word: ἐπείνασαν
  choice: جاع
  rationale: ينقل الفعل وقوع الجوع أو بدايته بإيجاز عربي طبيعي، بدل وصف حالة ساكنة فحسب.
- source_word: ἤρξαντο
  choice: بدأوا
  rationale: يحفظ صراحة معنى الشروع في الفعل.
- source_word: τίλλειν
  choice: يقطفون
  rationale: يدل τίλλω على نزع الشيء أو قطفه باليد، و«يقطفون» واضح ودقيق هنا.
- source_word: στάχυας
  choice: السنابل
  rationale: السنابل هي المقابل العربي الطبيعي لرؤوس الحبوب أو آذانها.
- source_word: καὶ ἐσθίειν
  choice: ويأكلون
  rationale: يحفظ تنسيق الفعلين التابعين لـ«بدأوا» بصياغة عربية سلسة.
theological_decisions:
- issue: صيغة الجمع في σάββασιν
  choice: يوم السبت
  alternative: في السبوت
  rationale: الجمع اليوناني اصطلاحي في هذا الموضع ويشير إلى يوم السبت، فلا ينبغي أن توحي الترجمة بتعدد أيام السبت. أُثبتت الصيغة الحرفية في الحاشية حفاظًا على شفافية النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «مرَّ ... بين» لسلاسة العبارة، و«السنابل» للمقابل العربي المألوف. وُضعت علامة الحاشية [a] مباشرة بعد «يوم السبت».
