  rationale: 'صُحِّحت أداة الربط لتؤدي معنى ἢ، وحُفظ جمع «السبوت» في عبارة عربية طبيعية، واستُبدل التعبير التفسيري «ينتهكون حرمة» بالفعل الأقرب إلى لفظ الأصل «يدنّسون». ولا تحل الصياغة التوتر المقصود: فالكهنة «يدنّسون السبت» من حيث الوصف اللفظي لعملهم، ومع ذلك «هم بلا ذنب».'
