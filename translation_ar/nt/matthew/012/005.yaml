  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: ar
  text: أَوَما قَرَأْتُمْ فِي الشَّرِيعَةِ أَنَّ الْكَهَنَةَ فِي الْهَيْكَلِ يُدَنِّسُونَ السَّبْتَ فِي أَيَّامِ السَّبْتِ، وَهُمْ بِلا ذَنْبٍ؟[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ينتهكون السبت» أو «يخالفون السبت». يدل الفعل اليوناني على معاملة الشيء المقدس كأنه عادي أو غير مقدس.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية حرفيًا: «في أيام السبت» بصيغة الجمع، ويُرجَّح أن الجمع يشير إلى ما يتكرر في أيام السبت، لا إلى واقعة واحدة.'
    reason: lexical_alternative
  - marker: c
    text: تشير «الشريعة» هنا إلى شريعة موسى/الأسفار المقدسة، وعلى الأرجح إلى أحكام خدمة الكهنة يوم السبت (راجع العدد 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: أَمَا... أَيْضًا
  rationale: تُدخل حجة كتابية بديلة في سياق الرد؛ وصيغة «أما... أيضًا» طبيعية في العربية وتحفظ الانتقال البلاغي دون إثقال.
- source_word: οὐκ ἀνέγνωτε
  choice: أَمَا قَرَأْتُمْ
  rationale: صيغة استفهام إنكاري مألوفة وواضحة، تنقل قوة السؤال اليوناني الموجَّه إلى جماعة.
- source_word: ἐν τῷ νόμῳ
  choice: فِي الشَّرِيعَةِ
  rationale: تشير هنا إلى شريعة موسى بوصفها نصًا مقدسًا، لا إلى القانون بمعناه المجرد.
- source_word: τοῖς σάββασιν
  choice: يَوْمَ السَّبْتِ
  rationale: مع أن اليونانية جمع حرفيًا، فالمفرد الجنسي في العربية طبيعي ويدل على ما يقع في أيام السبت مرارًا؛ وتُبيّن الحاشية صيغة الأصل.
- source_word: οἱ ἱερεῖς
  choice: الْكَهَنَةَ
  rationale: المقابل العربي المباشر للكهنة القائمين بخدمة الهيكل.
- source_word: ἐν τῷ ἱερῷ
  choice: فِي الْهَيْكَلِ
  rationale: لفظ ἱερόν يدل على مجمع الهيكل، و«الهيكل» هو التعبير العربي المألوف والمناسب للسياق.
- source_word: τὸ σάββατον
  choice: حُرْمَةَ السَّبْتِ
  rationale: أُضيفت «حرمة» لتكوين عبارة عربية طبيعية مع الفعل «ينتهكون»، مع إبقاء السبت نفسه محور المفعول.
- source_word: βεβηλοῦσιν
  choice: يَنْتَهِكُونَ حُرْمَةَ
  rationale: ينقل معنى معاملة المقدس كأنه غير مقدس، ويحفظ القوة الاستفزازية والتوتر المقصودين أفضل من تعبير مخفف مثل «يعملون».
- source_word: ἀναίτιοί εἰσιν
  choice: وَهُمْ بِلَا ذَنْبٍ
  rationale: تعبير عربي واضح يفيد انتفاء التبعة والجرم، ويحافظ على المقابلة القضائية مع انتهاك حرمة السبت.
theological_decisions:
- issue: هل ينبغي تخفيف قول يسوع كيلا يوحي بأن الكهنة ينتهكون السبت فعلًا؟
  choice: الإبقاء على العبارة القوية «ينتهكون حرمة السبت» مع «وهم بلا ذنب»
  alternative: يعملون يوم السبت ولا يُلامون
  rationale: النص اليوناني يتعمد الجمع بين وصف قوي لعمل الكهنة وانتفاء ذنبهم. الترجمة تحفظ هذا التوتر البلاغي واللاهوتي ولا تحله بتخفيف الفعل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الهيكل» بحسب الاصطلاح الكتابي الشائع، وحُفظ الاستفهام الإنكاري والتوتر بين الانتهاك وانتفاء الذنب. ضُبط النص بالشكل لتيسير القراءة، مع تجنب الأسلوب المذهبي أو التفسيري الزائد.
