review_pass:
  verdict: revise
  source_fidelity: 'تحتاج أداة الربط في صدر الآية إلى تصحيح: «أمّا ... أيضًا» لا تنقل ἢ («أو») على نحو مباشر، وتوحي ببنية تقابلية/استئنافية ليست هي اللفظ اليوناني. كما أن استعمال الجمع «في أيام السبت» في المتن يترجم τοῖς σάββασιν بوضوح أكبر من المفرد مع بقاء سلاسة العربية. أمّا «يُدَنِّسون السبت» فيحفظ قوة βεβηλοῦσιν والتوتر المقصود مع «بلا ذنب».'
  naturalness: الصياغة المقترحة فصحى معاصرة وواضحة. «أوَما قرأتم» استفهام إنكاري طبيعي يؤدي وظيفة «Or have you not read»، و«في أيام السبت» تعبير عربي سليم للجمع التكراري.
  terminology: «الشريعة»، «الكهنة»، «الهيكل»، و«السبت» مصطلحات مناسبة. «بلا ذنب» تؤدي ἀναίτιοι بوضوح في السياق القضائي. ويُفضَّل «يُدَنِّسون» هنا لأنه أقرب إلى المعنى المعجمي للفعل اليوناني من إضافة «حرمة» غير الموجودة صراحة في الأصل.
  issues:
