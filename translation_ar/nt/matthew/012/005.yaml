    rationale: المفرد الجنسي ممكن عربيًا، لكن «في أيام السبت» يحفظ الجمع التكراري الذي يبرزه الأصل والحاشية، بلا تكلّف.
  - severity: low
    issue: «ينتهكون حرمة السبت» يضيف «حرمة» إلى المفعول المباشر.
    rationale: المعنى مقبول، لكن «يدنّسون السبت» أقرب إلى βεβηλοῦσιν («يعاملون المقدس كالمشترك/غير المقدس») ويحفظ الاختصار والقوة البلاغية.
