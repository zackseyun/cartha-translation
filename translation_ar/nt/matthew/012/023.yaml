  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: ar
  text: 'فَدُهِشَتِ الجموعُ كلُّها وقالت: «أيمكن أن يكون هذا هو ابنُ داود؟»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ابن داود» لقب ذو دلالة مسيانية، يشير إلى المنقذ الملكي الموعود به من نسل داود.
    reason: cross_reference
  - marker: b
    text: 'أو، بصياغة أقرب إلى قوة السؤال في الأصل: «ليس هذا هو ابن داود، أليس كذلك؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: دُهِشَت
  rationale: ينقل الفعل قوة الانفعال والاندهاش في سياق المعجزة، بصياغة عربية طبيعية واضحة. ويُفهم امتداد رد الفعل من صيغة الجمع والسياق، من غير إثقال العبارة بمحاكاة زمن الماضي الناقص حرفيًا.
- source_word: πάντες οἱ ὄχλοι
  choice: الجموع كلُّها
  rationale: يحافظ على صيغة الجمع الصريحة في اليونانية وعلى معنى الشمول، مع تركيب عربي فصيح وطبيعي.
- source_word: ἔλεγον
  choice: قالت
  rationale: يوافق «الجموع» غير العاقل في المطابقة العربية، وينقل فعل القول سرديًا بوضوح. أمّا دلالة الاستمرار أو التكرار الممكنة في الماضي الناقص فتظل مفهومة من كون الكلام ردَّ فعل جماعيًا.
- source_word: Μήτι
  choice: أيمكن أن يكون
  rationale: ينقل سؤال التردد والتعجب من غير أن يحوله إلى إنكار جازم، مع بيان القوة السلبية المتوقعة للأداة في الحاشية.
- source_word: ὁ υἱὸς Δαυίδ
  choice: ابن داود
  rationale: يحفظ اللقب بصورته الكتابية والتاريخية ولا يستبدله بتفسير مثل «المسيح» أو «الملك المنتظر».
theological_decisions:
- issue: الدلالة المسيانية للقب «ابن داود»
  choice: الإبقاء على «ابن داود» في المتن
  alternative: المسيح؛ الوارث الموعود لداود
  rationale: النص اليوناني يورد اللقب نفسه، ولذلك ينبغي حفظ دلالته التاريخية واللاهوتية وما فيها من إحالة إلى الرجاء الملكي، من غير حسمها داخل المتن بتفسير مباشر.
- issue: اتجاه السؤال الذي تفتتحه Μήτι
  choice: 'صياغة سؤال متردد: «أيمكن أن يكون…؟»'
  alternative: «ليس هذا ابن داود، أليس كذلك؟»
  rationale: الأداة اليونانية تميل إلى توقع جواب بالنفي، لكن السياق يعرض دهشة الجموع وتساؤلها ولا يقتضي إنكارًا قاطعًا؛ لذلك تُحفظ قوة الاحتمال في المتن وتُذكر الصياغة الأقرب حرفيًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. روعي جمع «الجموع» في الأصل، واستُعملت المطابقة العربية الطبيعية للمؤنث المفرد في الفعل. وُضعت علامتا الحاشيتين بعد السؤال مع ورودهما كلتيهما في المتن.
