  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: ar
  text: 'لكني أقول لكم: إن الناس سيقدّمون يوم الدينونة حسابًا عن كل كلمة غير مسؤولة سيتكلمون بها.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: لكني أقول لكم
  rationale: تنقل العبارة خطاب يسوع المباشر، وتؤدي δέ بوصفها أداة انتقال تحمل هنا مسحة مقابلة مع السياق السابق.
- source_word: πᾶν ῥῆμα
  choice: كل كلمة
  rationale: تفيد πᾶν مع المفرد الاستغراق التوزيعي، وتشير ῥῆμα هنا إلى الكلام المنطوق؛ و«كل كلمة» تعبير عربي طبيعي ودقيق.
- source_word: ἀργὸν
  choice: طائشة
  rationale: تنقل في السياق معنى الكلام غير المنضبط أو غير المسؤول الذي لا يؤدي غرضًا صالحًا، من غير حصره في الكذب أو الشر الصريح. وتوضح الحاشية المدى الدلالي الذي يشمل الخمول وعدم النفع.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: سيتكلم بها الناس
  rationale: يحافظ الفعل المسبوق بالسين على صيغة المستقبل في اليونانية، و«الناس» تؤدي الدلالة البشرية العامة من غير تخصيص بالذكور.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: سيؤدّون عنها حسابًا
  rationale: تؤدي العبارة الاصطلاح القضائي بمعنى تقديم حساب بشأن الكلمة، وتحافظ «عنها» على المرجع الصريح للضمير αὐτοῦ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: يوم الدينونة
  rationale: صياغة عربية مستقرة ومفهومة للزمن المحدد الذي يقع فيه الحكم القضائي.
theological_decisions:
- issue: القوة الأخلاقية والدلالية للصفة ἀργόν
  choice: طائشة
  alternative: عاطلة؛ غير نافعة؛ باطلة
  rationale: «طائشة» تُظهر مسؤولية المتكلم وخطورة الكلام في سياق الدينونة، من غير أن تفسر الكلمة بالضرورة على أنها كاذبة أو خبيثة. ولأن الأصل قد يدل أيضًا على العاطل أو غير المثمر، حُفظ هذا الاتساع في الحاشية.
- issue: عموم οἱ ἄνθρωποι
  choice: الناس
  alternative: البشر؛ الرجال
  rationale: المقصود البشر عمومًا لا الذكور وحدهم، و«الناس» هي الصياغة العربية الطبيعية الجامعة.
- issue: مرجع المحاسبة في περὶ αὐτοῦ
  choice: سيؤدّون عنها حسابًا
  alternative: سيقدّمون حسابًا
  rationale: إثبات «عنها» يحافظ على الضمير اليوناني وعلى الصلة المباشرة بين كل كلمة والمحاسبة، من غير إضافة تفسير عقائدي.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. استُخدم «الدينونة» بوصفه مصطلحًا كتابيًا عربيًا راسخًا، مع تركيب مباشر يسهل فهمه لدى القارئ المعاصر.
