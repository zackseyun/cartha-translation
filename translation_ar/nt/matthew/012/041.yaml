revisions:
- from: رِجَالُ نِينَوَى سَيَقُومُونَ فِي الدَّيْنُونَةِ مَعَ هَذَا الْجِيلِ وَيَحْكُمُونَ عَلَيْهِ، لِأَنَّهُمْ تَابُوا اسْتِجَابَةً لِمُنَادَاةِ يُونَانَ؛ وَهَا هُنَا مَا هُوَ أَعْظَمُ مِنْ يُونَانَ.[a]
  to: رِجَالُ نِينَوَى سَيَقُومُونَ فِي الدَّيْنُونَةِ مَعَ هَذَا الْجِيلِ وَيُدِينُونَهُ، لِأَنَّهُمْ تَابُوا اسْتِجَابَةً لِكِرَازَةِ يُونَانَ؛ وَهَا هُنَا مَا هُوَ أَعْظَمُ مِنْ يُونَانَ.[a]
  rationale: استُبدلت «ويحكمون عليه» بـ«ويدينونه» لإظهار معنى κατακρινοῦσιν الدقيق. واستُبدلت «لمناداة يونان» بـ«لكرازة يونان» لتحسين السلاسة والاصطلاح العربي الكتابي، مع إبقاء معنى التوبة استجابةً لإعلان يونان. وحُفظت حيادية πλεῖον في «ما هو أعظم من يونان»، وكذلك أداة التنبيه في «وها هنا».
  reviewer_model: gpt-5.6-terra
