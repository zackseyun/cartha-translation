  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: ar
  text: رِجَالُ نِينَوَى سَيَقُومُونَ فِي الدَّيْنُونَةِ مَعَ هَذَا الْجِيلِ وَيُدِينُونَهُ، لِأَنَّهُمْ تَابُوا اسْتِجَابَةً لِكِرَازَةِ يُونَانَ؛ وَهَا هُنَا مَا هُوَ أَعْظَمُ مِنْ يُونَانَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن هو أعظم من يونان حاضر هنا». التعبير اليوناني محايد نحويًّا، وحرفيًّا: «ما هو أعظم من يونان»، وقد يشدّد على الحقيقة الأعظم الحاضرة في يسوع، لا على المقارنة بين شخصين فحسب.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: رجال نينوى
  rationale: يحفظ دلالة ἄνδρες المذكرة صراحة، ويعبّر عن نسبة الرجال إلى نينوى بصياغة عربية طبيعية وواضحة.
- source_word: ἀναστήσονται
  choice: سيقومون
  rationale: ينقل معنى النهوض في مشهد الدينونة، مع إبقاء الإيحاء المحتمل بالقيامة من غير زيادة تفسيرية.
- source_word: ἐν τῇ κρίσει
  choice: في الدينونة
  rationale: «الدينونة» تعبير عربي كتابي واضح عن الحدث القضائي الأخروي المقصود هنا.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: مع هذا الجيل
  rationale: يحافظ مباشرة على معنى μετά مع المضاف إليه، أما المواجهة فتظهر من الفعل اللاحق.
- source_word: κατακρινοῦσιν αὐτήν
  choice: ويحكمون عليه
  rationale: الضمير يعود إلى «هذا الجيل»، وصيغة «يحكمون عليه» تؤدي معنى الإدانة القضائية بوضوح في العربية من غير أن توحي بأنهم مصدر الحكم النهائي.
- source_word: μετενόησαν
  choice: تابوا
  rationale: هو المقابل العربي الطبيعي والدقيق للتوبة استجابةً للمناداة النبوية.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: استجابةً لمناداة يونان
  rationale: يبين قوة εἰς الاستجابية بعد μετανοέω، ويترجم κήρυγμα بمناداة علنية نبوية.
- source_word: ἰδοὺ
  choice: ها
  rationale: أداة تنبيه عربية فصيحة تحفظ القوة الخطابية المهيبة من غير تكلف.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ها هنا ما هو أعظم من يونان
  rationale: يحفظ صيغة πλεῖον المحايدة في اليونانية باستعمال «ما هو أعظم»، فلا يحصر العبارة في مقارنة شخصين وحدهما.
theological_decisions:
- issue: دلالة πλεῖον Ἰωνᾶ وعلاقتها بإشارة يسوع إلى نفسه
  choice: ما هو أعظم من يونان
  alternative: مَن هو أعظم من يونان
  rationale: الصيغة اليونانية محايدة نحويًا، ولذلك تحفظ الترجمة إمكان الإشارة إلى الحقيقة الأعظم الحاضرة في شخص يسوع وخدمته، بدل تحويلها بلا ضرورة إلى اسم موصول للعاقل.
- issue: تحديد جنس ἄνδρες
  choice: رجال
  alternative: أهل نينوى
  rationale: النص اليوناني يستعمل اسمًا مذكرًا صريحًا، فحُفظت هذه الدلالة بدل تعميمها إلى جميع السكان.
- issue: دور رجال نينوى في إدانة هذا الجيل
  choice: يحكمون عليه
  alternative: يدينونه
  rationale: كلاهما ممكن، لكن «يحكمون عليه» يحفظ الطابع القضائي ولا يقرر أنهم أصحاب الدينونة النهائية مستقلين عن حكم الله.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «ها هنا» للمحافظة على قوة أداة التنبيه وموقع الحضور، و«استجابةً لمناداة» لإظهار العلاقة الدلالية التي يحملها التركيب اليوناني.
