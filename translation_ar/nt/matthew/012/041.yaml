review_pass:
  verdict: revise
  source_fidelity: 'الترجمة أمينة عمومًا للنص اليوناني: «رجال نينوى»، و«سيقومون»، و«في الدينونة مع هذا الجيل»، و«تابوا استجابةً لكرازة يونان»، و«ما هو أعظم من يونان» تنقل عناصر النص ودلالته جيدًا. لكن κατακρινοῦσιν تعني «سيدينون/سيحكمون بالإدانة على»، لا مجرد «سيحكمون على»؛ فالصياغة الحالية تُضعف معنى الإدانة الصريح.'
  naturalness: الأسلوب فصيح ومفهوم. «استجابةً لكرازة يونان» أكثر سلاسة في العربية الكتابية المعاصرة من «استجابةً لمناداة يونان»، مع حفظ العلاقة الاستجابية التي يفيدها التركيب. «ها هنا» مناسبة للنبرة الكتابية الواضحة.
  terminology: «الدينونة» و«تابوا» و«كرازة» مصطلحات عربية كتابية مستقرة وواضحة. ينبغي استعمال «يدينونه» لترجمة فعل الإدانة القضائية، من دون تقرير أن رجال نينوى هم أصحاب الحكم النهائي استقلالًا عن الله؛ فالسياق القضائي قائم في «يوم الدينونة».
  issues:
  - severity: medium
    issue: «ويحكمون عليه» لا يصرح بمعنى κατακρινοῦσιν.
    rationale: الفعل κατακρίνω يحمل معنى الإدانة أو الحكم بالإدانة، بينما «يحكم على» قد يفيد إصدار حكم عام أو تقييمًا قضائيًا من دون إدانة. «ويدينونه» أدق وأوضح.
  - severity: low
    issue: «مناداة يونان» أقل اصطلاحية من «كرازة يونان» في هذا السياق.
    rationale: κήρυγμα تعني الكرازة/المناداة، وكلاهما جائز، لكن «كرازة» أوضح وأشيع في العربية الكتابية الحديثة، و«استجابةً لكرازة يونان» طبيعي.
  revised_text: رِجَالُ نِينَوَى سَيَقُومُونَ فِي الدَّيْنُونَةِ مَعَ هَذَا الْجِيلِ وَيُدِينُونَهُ، لِأَنَّهُمْ تَابُوا اسْتِجَابَةً لِكِرَازَةِ يُونَانَ؛ وَهَا هُنَا مَا هُوَ أَعْظَمُ مِنْ يُونَانَ.[a]
