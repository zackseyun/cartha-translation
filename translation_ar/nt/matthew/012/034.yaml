id: MAT.12.34
reference: Matthew 12:34
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: ar
  text: يا نسل الأفاعي[a]، كيف تستطيعون أن تتكلموا بما هو صالح وأنتم أشرار؟ فمن فيض[b] القلب يتكلم الفم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا ذرية الأفاعي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وفرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: نسل الأفاعي
  rationale: تنقل «نسل» معنى ما وُلِد أو نتج، وتحافظ مع «الأفاعي» على استعارة الأصل والصفة في صياغة عربية واضحة وقوية.
- source_word: πῶς δύνασθε
  choice: كيف تستطيعون
  rationale: تحافظ على صيغة السؤال التوبيخي الدالة على العجز أو الاستحالة الأخلاقية في السياق.
- source_word: ἀγαθὰ λαλεῖν
  choice: أن تتكلموا بما هو صالح
  rationale: تعكس الصفة اليونانية المستعملة استعمال الاسم، من غير حصرها في نوع معين من الأقوال.
- source_word: πονηροὶ ὄντες
  choice: وأنتم أشرار
  rationale: تنقل التركيب الحالي/الظرفي بسلاسة، وتحافظ على ثقله الأخلاقي من غير تلطيف.
- source_word: ἐκ γὰρ τοῦ περισσεύματος
  choice: فمن فيض
  rationale: «فيض» يصور ما يخرج من الامتلاء والزيادة، ويحافظ على الصورة الحسية المضمرة في اللفظة اليونانية.
- source_word: τῆς καρδίας
  choice: القلب
  rationale: تحافظ على المصطلح الكتابي الدال على باطن الإنسان، بما يشمله من فكر وإرادة وميول، من غير تضييقه إلى العاطفة وحدها.
- source_word: τὸ στόμα λαλεῖ
  choice: يتكلم الفم
  rationale: نقل مباشر يحافظ على الربط التصويري بين باطن الإنسان وكلام فمه.
theological_decisions:
- issue: الدلالة المجازية للقلب
  choice: الإبقاء على «القلب» بوصفه مركز باطن الإنسان
  alternative: الذات الباطنة أو العقل
  rationale: لا يحصر النص اليوناني المعنى في العاطفة أو التفكير وحدهما، لذلك يحفظ اللفظ الكتابي اتساع الدلالة.
- issue: الحكم الأخلاقي في πονηροὶ ὄντες
  choice: وأنتم أشرار
  alternative: وأنتم سيئون
  rationale: «أشرار» تحفظ قوة الحكم الأخلاقي في التوبيخ، بينما قد توحي «سيئون» بمجرد رداءة عامة وتضعف حدة النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على حدة التوبيخ، وعلى صورة النسب إلى الأفاعي، وعلى المقابلة بين القلب والفم، مع ترتيب قريب من اليونانية من غير إخلال بسلامة العربية.
