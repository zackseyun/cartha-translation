  source_fidelity: 'النص العربي أمين للنص اليوناني: «نسل الأفاعي» ينقل γεννήματα ἐχιδνῶν مع قوة الاستعارة، والسؤال التوبيخي «كيف تستطيعون» يعكس πῶς δύνασθε، و«بما هو صالح» ينقل ἀγαθὰ، و«وأنتم أشرار» يحافظ على الحكم الأخلاقي في πονηροὶ ὄντες. كما أن «فمن فيض القلب يتكلم الفم» يحفظ الصورة والعلاقة السببية في ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.'
