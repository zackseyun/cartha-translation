  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: ar
  text: 'ثم يقول للرجل: «مُدَّ يدك». فمدَّها، فأُعيدت سليمةً[a] كالأخرى[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فشُفيت»؛ يشدد الفعل اليوناني على إعادتها إلى حالتها السليمة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «سليمة كالأخرى»، والمقصود بـ«الأخرى» يد الرجل الأخرى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: تفيد تتابع أحداث السرد، و«ثم» واضحة وطبيعية في العربية.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ المضارع على المضارع التاريخي في اليونانية وعلى حيوية السرد.
- source_word: τῷ ἀνθρώπῳ
  choice: للرجل
  rationale: السياق يدل على رجل معيّن، فتؤدي «الرجل» المعنى بدقة.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: مُدَّ يدك
  rationale: صيغة أمر مباشرة وطبيعية، و«يد» هي الدلالة المعتادة لـχείρ في هذا السياق.
- source_word: ἐξέτεινεν
  choice: فمدَّها
  rationale: يكرر الفعل الوارد في الأمر، ويأتي الضمير لتوضيح أن المقصود اليد.
- source_word: ἀπεκατεστάθη
  choice: فأُعيدت
  rationale: يحافظ البناء للمجهول على صيغة الأصل، وينقل معنى ردّ اليد إلى حالتها السليمة دون تعيين الفاعل صراحة.
- source_word: ὑγιὴς
  choice: سليمةً
  rationale: «سليمة» وصف عربي طبيعي لصحة اليد وخلوها من العلة.
- source_word: ὡς ἡ ἄλλη
  choice: كالأخرى
  rationale: يحافظ على الإيجاز في الأصل، حيث يدل التأنيث والسياق على اليد الأخرى.
theological_decisions:
- issue: طبيعة وصف الشفاء
  choice: وُصفت اليد بأنها أُعيدت سليمة من غير إضافة تفسير عقائدي.
  alternative: شُفيت اليد أو صارت صحيحة.
  rationale: يحافظ هذا التعبير على معنى الاستعادة في ἀπεκατεστάθη وعلى وصف الصحة في ὑγιής، من غير تجاوز لما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبقي المضارع التاريخي في «يقول»، واستُخدم البناء للمجهول في «أُعيدت» لصون صيغة الأصل وعدم التصريح بفاعل لم يذكره النص.
