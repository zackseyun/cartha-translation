source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: ar
  text: 'وإذ علم أفكارهم، قال لهم: «كل مملكة منقسمة على نفسها تُخرَّب[a]، وكل مدينة أو بيت[b] منقسم على نفسه لا يثبت».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تصير خرابًا» أو «يحل بها الدمار».'
    reason: lexical_alternative
  - marker: b
    text: قد تعني «بيت» هنا أيضًا «أهل البيت».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: كان يعلم
  rationale: اسم الفاعل الماضي من ὁράω يُستعمل هنا للإدراك الذهني. والتعبير «كان يعلم» طبيعي في العربية، ويقرر العلم من غير أن يحدد كيفيته.
- source_word: δὲ
  choice: لكنه
  rationale: تفيد δέ انتقالًا مع مقابلة خفيفة، و«لكنه» تلائم التحول الحجاجي في السياق.
- source_word: ἐνθυμήσεις
  choice: أفكارهم
  rationale: تشمل اللفظة الأفكار والتفكرات والاستدلالات الباطنية؛ و«أفكارهم» أوضح تعبير عربي عام من غير تضييق الدلالة على النيات وحدها.
- source_word: Πᾶσα βασιλεία
  choice: كل مملكة
  rationale: يحافظ هذا التعبير على صيغة المبدأ العام التي يؤديها πᾶσα مع الاسم المفرد.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: تنقسم على نفسها
  rationale: ينقل الانقسام الداخلي مع القوة التقابلية لعبارة κατά مع الضمير العائد، وهو تعبير عربي واضح ومألوف.
- source_word: ἐρημοῦται
  choice: تُخرَّب
  rationale: ينقل شدة معنى الخراب والدمار ويحافظ على الصيغة المبنية للمجهول، مع بقاء احتمال الدلالة على الصيرورة إلى الخراب مذكورًا في الحاشية.
- source_word: πόλις ἢ οἰκία
  choice: مدينة أو بيت
  rationale: «مدينة» هي المقابل المباشر لـ πόλις، و«بيت» يحافظ على سعة οἰκία التي قد تشير إلى المبنى أو إلى أهل البيت.
- source_word: οὐ σταθήσεται
  choice: لا يثبت
  rationale: ينقل المعنى الاصطلاحي للبقاء قائمًا أو الصمود، في عبارة عربية موجزة وطبيعية.
theological_decisions:
- issue: كيفية معرفة يسوع أفكارهم الباطنة
  choice: إثبات أنه كان يعلم أفكارهم من غير بيان كيفية هذا العلم
  alternative: التصريح بأن علمه كان فائقًا للطبيعة، أو أنه استنتج أفكارهم من كلامهم وسياق الموقف
  rationale: النص يقرر واقع معرفته ولا يشرح وسيلتها؛ لذلك لا تضيف الترجمة تحديدًا عقديًا أو نفسيًا غير مصرح به.
- issue: دلالة οἰκία في المثل
  choice: بيت، مع التنبيه إلى احتمال معنى أهل البيت
  alternative: أسرة أو أهل بيت
  rationale: يحافظ «بيت» على الصورة اللفظية وعلى الاحتمال الدلالي معًا، بدل حصرها في المبنى أو الجماعة المنزلية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع تركيب مألوف للقارئ العام. استُخدم المضارع في الجمل الشرطية الوصفية لإبراز المبدأ العام، وحُفظ التوازي بين المملكة والمدينة والبيت.
