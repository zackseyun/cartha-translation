  rationale: يصحح التعديل قيمة μερισθεῖσα الوصفية، ويجعل صلة εἰδὼς بالفعل «قال» طبيعية في العربية من غير زيادة تفسيرية. كما يفصل الحاشيتين ويربط كلًّا منهما بموضعها المباشر. أما «تُخرَّب» و«لا يثبت» فيحفظان صورة الخراب وعدم البقاء أو الصمود في الأصل.
