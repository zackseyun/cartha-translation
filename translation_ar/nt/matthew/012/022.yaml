id: MAT.12.22
reference: Matthew 12:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: ar
  text: حينئذ أُحضر إليه رجل به شيطان، وكان أعمى وأبكم[a]. فشفاه، حتى إن الرجل الأبكم تكلم وأبصر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أصم». يمكن أن تشير الكلمة اليونانية إلى مَن لا يسمع أو إلى مَن لا يستطيع الكلام؛ ويرجح السياق هنا معنى العجز عن الكلام، لأن نتيجة الشفاء هي أنه تكلم وأبصر.
    reason: بيان البديل المعجمي الحقيقي وسبب ترجيح معنى البكم في هذا السياق.
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية تصل هذا الحدث بما سبقه، و«حينئذ» فصيحة وواضحة وتحافظ على دلالة التعاقب.
- source_word: προσηνέχθη αὐτῷ
  choice: أُحضر إليه
  rationale: يحافظ المبني للمجهول على صيغة الأصل وعلى عدم تعيين مَن أحضر الرجل.
- source_word: δαιμονιζόμενος
  choice: رجل به شيطان
  rationale: ينقل الإسناد الصريح إلى شيطان بعبارة عربية موجزة ومفهومة، من غير تحويله إلى تشخيص طبي حديث ولا إضافة تصور تفصيلي عن كيفية تأثيره.
- source_word: τυφλὸς
  choice: أعمى
  rationale: المقابل العربي المباشر الواضح.
- source_word: κωφός
  choice: أبكم[a]
  rationale: قد تدل اللفظة اليونانية على الصمم أو العجز عن الكلام، لكن جملة النتيجة تذكر أنه تكلم، ولذلك يرجح السياق معنى البكم مع توثيق البديل في الحاشية.
- source_word: ἐθεράπευσεν αὐτόν
  choice: فشفاه
  rationale: ترجمة طبيعية مباشرة لفعل الشفاء، والضمير يعود بوضوح إلى الرجل.
- source_word: ὥστε
  choice: حتى إن
  rationale: تقدم النتيجة الفعلية للشفاء بتركيب عربي طبيعي، لا غاية مقصودة فحسب.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: الرجل الأبكم تكلم وأبصر
  rationale: يحافظ على نتيجتي الشفاء المذكورتين في الأصل، وعلى وصف الرجل باللفظة نفسها، بصياغة عربية واضحة.
theological_decisions:
- issue: لغة التأثير الشيطاني
  choice: 'الإبقاء على الإشارة الصريحة: «رجل به شيطان»'
  alternative: رجل مريض أو مصاب بعلة
  rationale: النص اليوناني ينسب حالة الرجل صراحة إلى شيطان؛ فلا تُستبدل هذه النسبة بتفسير سريري حديث أو تعبير مبهم.
- issue: معنى κωφός في السياق
  choice: «أبكم» أي عاجز عن الكلام
  alternative: «أصم»
  rationale: اللفظة تحتمل المعنيين، لكن النتيجة المذكورة هي أن الرجل تكلم وأبصر، لا أنه سمع؛ لذلك اختير معنى البكم مع حفظ الاحتمال المعجمي في الحاشية.
translation_notes:
  register: العربية فصحى حديثة، واضحة وموجزة وذات نبرة كتابية كريمة. استُخدم المبني للمجهول للمحافظة على عدم ذكر الفاعل، ووُضعت علامة الحاشية مباشرة بعد اللفظة التي تتعلق بها.
