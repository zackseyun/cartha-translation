  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: ar
  text: لكن الفريسيون خرجوا وتشاوروا ضدّه في كيفية إهلاكه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قتله» أو «إماتته». اللفظ اليوناني هو «إهلاكه»، ويمكن أن يتضمن في هذا السياق قصد قتله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: خرجوا
  rationale: اسم الفاعل الأُريستي يفيد هنا حدثًا سابقًا ومتتابعًا؛ وصيغة الفعل الماضي طبيعية في السرد العربي وتحفظ فعل الخروج.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا ذا طابع تقابلي من عمل يسوع إلى ردّ الفريسيين العدائي.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيين
  rationale: الاسم العربي الشائع لهذه الجماعة اليهودية، وجاء منصوبًا بعد «لكن».
- source_word: συμβούλιον ἔλαβον
  choice: تشاوروا معًا
  rationale: ينقل التعبير الاصطلاحي الذي يعني حرفيًا «أخذوا مشورة»، من غير حصره في مجلس رسمي، بينما يبيّن السياق غرض التشاور العدائي.
- source_word: κατ’ αὐτοῦ
  choice: ضدّه
  rationale: تحمل κατά مع المضاف إليه هنا معنى العداء والمواجهة.
- source_word: ὅπως
  choice: في كيفية
  rationale: تُدخل مضمون التشاور وغايته، وتحفظ معنى التداول في الكيفية بدل اختزاله إلى مجرد نتيجة.
- source_word: ἀπολέσωσιν
  choice: إهلاكه
  rationale: يحفظ السعة الدلالية للفعل ἀπόλλυμι، الذي يعني الإهلاك ويمكن أن يدل في هذا السياق على القتل، من غير جعل المعنى الأخص صريحًا في المتن.
theological_decisions:
- issue: مدى تخصيص معنى ἀπολέσωσιν
  choice: إهلاكه
  alternative: قتله أو إماتته
  rationale: السياق يدل على قصد عدائي قاتل على الأرجح، لكن الفعل اليوناني أوسع من فعل صريح خاص بالقتل؛ لذلك حُفظ اللفظ الأوسع في المتن وذُكرت الدلالة الأخص في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تشاوروا معًا ضدّه» لتجنب العبارة الحرفية الثقيلة «أخذوا مشورة عليه»، مع الحفاظ على فعل التشاور وعدائيته، واستُبقي «إهلاكه» صونًا لاتساع اللفظ اليوناني.
