base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: ar
  text: 'ومدَّ يده نحو تلاميذه وقال: «ها أمي وإخوتي[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «إخوتي» بصيغة الجمع المذكر؛ لذلك لم تُوسَّع هنا إلى «إخوتي وأخواتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: مدَّ
  rationale: ينقل فعل البسط أو المدّ السابق للفعل الرئيس بصياغة عربية طبيعية متتابعة.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: يده
  rationale: «اليد» هي الدلالة المباشرة في سياق الإشارة الجسدية، والضمير المتصل أفصح وأطبع بالعربية.
- source_word: ἐπὶ
  choice: نحو
  rationale: مع حالة النصب وفي سياق مدّ اليد تفيد الاتجاه إلى التلاميذ.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: تلاميذه
  rationale: «التلاميذ» المقابل الاصطلاحي الدقيق الذي يحفظ علاقة المعلّم بمن يتعلمون ويتبعون.
- source_word: Ἰδοὺ
  choice: ها
  rationale: أداة تنبيه وإشارة موجزة وطبيعية، وتحفظ القوة الإشارية المرتبطة بمدّ اليد دون تكلف «هوذا».
- source_word: ἡ μήτηρ μου
  choice: أمي
  rationale: نقل مباشر وطبيعي للفظ القرابة.
- source_word: οἱ ἀδελφοί μου
  choice: إخوتي
  rationale: يحفظ لفظ القرابة بصيغة الجمع المذكر كما في اليونانية، من غير توسيعه تفسيريًا إلى الإخوة والأخوات.
theological_decisions:
- issue: ألفاظ القرابة في تعريف يسوع لأسرته
  choice: الإبقاء على اللفظين المحددين «أمي» و«إخوتي»
  alternative: استعمال تعبير أعم مثل «عائلتي» أو توسيع «إخوتي» إلى «إخوتي وأخواتي»
  rationale: تعتمد قوة القول على ألفاظ القرابة المحسوسة نفسها؛ أما التعميم أو التوسيع فيضيف تفسيرًا غير مصرح به في هذا العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ها» بوصفها أداة تنبيه وإشارة طبيعية، مع تركيب فعلي سلس يحافظ على ترتيب الحركة ثم القول.
