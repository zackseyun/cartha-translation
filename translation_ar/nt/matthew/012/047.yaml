lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: فقال له أحدهم
  rationale: تنقل الفاء الانتقال السردي الخفيف الذي تؤديه δέ في السياق، و«أحدهم» تعبير عربي طبيعي عن τις غير المعيَّنة.
- source_word: Ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه عربية فصيحة ومعاصرة تلفت الانتباه إلى الخبر من غير اللجوء إلى صياغة قديمة ثقيلة.
- source_word: ἡ μήτηρ σου
  choice: أمك
  rationale: تنقل تركيب الإضافة والملكية بوضوح وإيجاز طبيعيين في العربية.
- source_word: οἱ ἀδελφοί σου
  choice: إخوتك
  rationale: تحافظ على الدلالة المذكرة للجمع في النص اليوناني، من غير توسيعها إلى «أشقائك وشقيقاتك» أو حسم طبيعة القرابة المقصودة.
- source_word: ἔξω ἑστήκασιν
  choice: واقفون في الخارج
  rationale: تعكس حالة الوقوف الحاضرة التي يفيدها تمام ἵστημι، وتحافظ صراحة على معنى ἔξω.
- source_word: ζητοῦντές
  choice: يطلبون
  rationale: تنقل معنى السعي إلى الفعل في صياغة عربية طبيعية، من غير اختزالها إلى مجرد الرغبة أو إضافة معنى المحاولة الفاشلة.
- source_word: σοι λαλῆσαι
  choice: أن يكلموك
  rationale: صياغة عربية مباشرة وطبيعية للداتيف σοι مع مصدر λαλῆσαι، وتحافظ على اتجاه الكلام إلى المخاطب.
theological_decisions:
- issue: الوضع النقدي النصي لمتى 12:47
  choice: إثبات الآية في المتن وفق نص SBLGNT المزوَّد، مع وضع علامة حاشية عند العبارة الافتتاحية.
  alternative: حذف الآية لأنها غير موجودة في بعض المخطوطات.
  rationale: النص اليوناني المقدَّم يتضمن الآية مع الإشارة النقدية إلى الشك في أصالتها. لذلك يحافظ إثباتها مع حاشية صريحة على شفافية الدليل النصي من غير حسم الخلاف بصمت.
- issue: دلالة οἱ ἀδελφοί على صلة القرابة
  choice: إخوتك
  alternative: أقرباؤك، أو أبناء أمك، أو إخوتك الأشقاء
  rationale: «إخوتك» هي المقابلة المباشرة وتحفظ مجال الدلالة من غير فرض تصور مذهبي عن طبيعة القرابة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ها إن» للتنبيه بأسلوب مفهوم غير متقعّر، وحوفظ على البنية السردية الموجزة وعلى الغموض المشروع في طبيعة صلة «الإخوة».
