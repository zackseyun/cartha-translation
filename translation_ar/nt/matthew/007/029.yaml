  source_fidelity: 'النص يترجم عناصر اليونانية الأساسية بأمانة: «لأنه» تؤدي γάρ التفسيرية، و«كان يعلّمهم» تنقل بصورة مناسبة الاستمرار الماضي في ἦν ... διδάσκων، و«كمن له سلطان» تحفظ المقارنة في ὡς ἐξουσίαν ἔχων دون تفسير لمصدر السلطان، و«لا ككتبتهم» تنقل المقابلة والضمير αὐτῶν.'
  naturalness: الصياغة فصيحة واضحة ومناسبة لسجل إنجيلي حديث. تركيب «كمن له سلطان» سليم ومفهوم، و«لا ككتبتهم» موجز عربي طبيعي في سياق المقابلة.
  terminology: «الكتبة» مقابل اصطلاحي مباشر ومألوف لـ γραμματεῖς في الترجمات والدراسات الكتابية العربية. و«سلطان» يؤدي ἐξουσία بدقة هنا من غير اختزاله إلى مجرد ثقة أو قوة أسلوبية. الحاشية تقدم البديل الاصطلاحي السلس «بسلطان» وتبقى مرتبطة بالموضع الصحيح.
