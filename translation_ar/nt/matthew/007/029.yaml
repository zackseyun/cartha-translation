base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: ar
  text: لِأَنَّهُ كَانَ يُعَلِّمُهُمْ كَمَنْ لَهُ سُلْطَانٌ[a]، لَا كَكَتَبَتِهِمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير أكثر سلاسة: «بِسُلْطَانٍ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: لِأَنَّهُ كَانَ يُعَلِّمُ
  rationale: تحفظ «لأن» وظيفة γάρ التفسيرية وربطها بدهشة الجموع في الآية السابقة، وينقل تركيب «كان يعلّم» صيغة الماضي الناقص المحيطية الدالة على الفعل المستمر في الزمن الماضي.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير مفعول به يعود إلى الجموع أو السامعين.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: كَمَنْ لَهُ سُلْطَانٌ
  rationale: تعكس بنية المقارنة اليونانية وتُبقي السلطان صفة حقيقية في المعلّم، من غير أن تحدد في هذه الآية مصدره اللاهوتي.
- source_word: καὶ οὐχ ὡς
  choice: لَا كَـ
  rationale: صياغة عربية طبيعية تحفظ المقارنة والتباين الصريحين؛ ولا يلزم نقل καί بحرف عطف مستقل في هذا السياق لأن «لا كـ» تؤدي وظيفة «وليس مثل» بوضوح.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: كَتَبَتِهِمْ
  rationale: «الكتبة» المقابل الاصطلاحي المباشر لـ γραμματεῖς في سياق الأناجيل، والضمير يحفظ αὐτῶν ويشير إلى أصحاب المكانة التعليمية المعترف بها لدى السامعين.
theological_decisions:
- issue: طبيعة سلطان يسوع في التعليم
  choice: 'عرضه وصفيًا في المقارنة: «كمن له سلطان»'
  alternative: التصريح بأنه سلطان إلهي، أو اختزاله إلى مجرد الثقة وقوة الخطاب
  rationale: تثبت الآية سلطان يسوع الحقيقي وتباين طريقته مع الكتبة، لكنها لا تحدد هنا الأساس اللاهوتي الكامل لهذا السلطان؛ لذلك تُحفظ دلالة النص وتوتره من غير توسع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الكتبة» بوصفها مصطلحًا كتابيًا دقيقًا، مع إبقاء البناء المقارن قريبًا من اليونانية ووضع البديل العربي الأكثر اصطلاحية في الحاشية.
