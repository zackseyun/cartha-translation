lexical_decisions:
- source_word: ἢ
  choice: أم
  rationale: تصل هذا السؤال البلاغي بما قبله، و«أم» طبيعية في العربية عند الانتقال إلى استفهام بديل أو تالٍ في سياق الحجاج.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: أيُّ إنسانٍ منكم
  rationale: صياغة عربية واضحة تحفظ الاستفهام والعبارة التبعيضية «منكم»، وتنقل ἄνθρωπος دون حصر المعنى في لفظ «رجل».
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον
  choice: إذا طلب منه ابنه خبزًا
  rationale: تعيد الصياغة النحوية بما يلائم العربية، وتحفظ الابن والخبز صراحة. وتؤدي «إذا طلب» وظيفة المستقبل اليوناني في حالة افتراضية عامة من غير إثقال العبارة.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: يعطيه حجرًا؟
  rationale: μή في السؤال البلاغي تتوقع جوابًا بالنفي؛ وصيغة الاستفهام العربية تنقل هذا التوقع طبيعيًا من غير إضافة نفي صريح غير موجود في بنية الجملة الخبرية.
theological_decisions:
- issue: اللغة التمثيلية المذكرة
  choice: أيُّ إنسانٍ منكم
  alternative: أيُّ رجلٍ منكم
  rationale: لفظ ἄνθρωπος مفرد مذكر في هذا التركيب، لكنه يدل هنا على فرد من المخاطَبين تمثيلًا. «إنسان» يحفظ المفرد ولا يضيّق الدلالة إلى الذكر البالغ، مع إبقاء «ابنه» كما في الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت بنية السؤال البلاغي المباشر، مع فاصلة تفصل تحديد الشخص عن الحالة الافتراضية.
