reference: Matthew 7:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: ar
  text: 'أَوْ كَيْفَ تَقُولُ لِأَخِيكَ[a]: «دَعْنِي أُخْرِجْ الْقَذَاةَ[b] مِنْ عَيْنِكَ»، وَهَا هِيَ الْعَارِضَةُ الْخَشَبِيَّةُ[c] فِي عَيْنِكَ أَنْتَ؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «أخيك»؛ وقد يشير المفرد المذكر هنا، على نحو تمثيلي، إلى واحد من رفقاء التلمذة.'
    reason: cultural_note
  - marker: b
    text: '«القذاة» (اليونانية κάρφος) قطعة صغيرة من مادة يابسة؛ ويمكن ترجمتها أيضًا: «شظية صغيرة».'
    reason: lexical_alternative
  - marker: c
    text: '«العارضة الخشبية» (اليونانية δοκός) قطعة كبيرة من الخشب؛ ويمكن ترجمتها أيضًا: «جذع» أو «خشبة ضخمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: أَوْ
  rationale: تربط هذه الجملة بالبديل البلاغي السابق وتحافظ على تتابع حجة يسوع.
- source_word: πῶς ἐρεῖς
  choice: كَيْفَ تَقُولُ
  rationale: ينقل الاستفهام الإنكاري بعبارة عربية طبيعية؛ والمضارع العربي هنا يؤدي معنى المستقبل اليوناني في الموقف المفترض دون تكلّف.
- source_word: τῷ ἀδελφῷ σου
  choice: لِأَخِيكَ
  rationale: يحافظ على المفرد المذكر الصريح في اليونانية، مع بيان إمكان دلالته التمثيلية في الحاشية.
- source_word: Ἄφες ἐκβάλω
  choice: دَعْنِي أُخْرِجِ
  rationale: ينقل صيغة طلب الإذن ومعنى إزالة الشيء من العين بوضوح وطبيعية.
- source_word: τὸ κάρφος
  choice: الْقَذَاةَ
  rationale: القذاة شيء صغير يقع في العين، فتحافظ اللفظة على الصورة وعلى المقابلة المبالغ فيها مع العارضة، من غير حصر المعنى في شظية خشبية تحديدًا.
- source_word: ἐκ τοῦ ὀφθαλμοῦ σου
  choice: مِنْ عَيْنِكَ
  rationale: صياغة عربية مباشرة وطبيعية لصورة إخراج الجسم من العين.
- source_word: καὶ ἰδοὺ
  choice: وَهَا هِيَ
  rationale: تحافظ على أداة لفت الانتباه بأسلوب عربي فصيح مفهوم، من غير استعمال تعبير عتيق أو تفسير زائد.
- source_word: ἡ δοκὸς
  choice: الْعَارِضَةُ الْخَشَبِيَّةُ
  rationale: تدل على قطعة خشب كبيرة تُستعمل عارضةً، وتحفظ التفاوت الهائل المقصود بينها وبين القذاة.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: فِي عَيْنِكَ أَنْتَ
  rationale: يحافظ على موضع العارضة، وتُبرز «أنت» في العربية المفارقة السياقية بين عين المخاطَب وعين أخيه.
theological_decisions:
- issue: دلالة ἀδελφῷ من جهة الجنس والنطاق
  choice: أخيك
  alternative: أخيك أو أختك؛ رفيقك في الإيمان
  rationale: النص اليوناني مفرد مذكر، ولذلك حُفظ في المتن. وقد يُستعمل استعمالًا تمثيليًا لرفيق التلميذ، لكن توسيعه في المتن إلى «أخيك أو أختك» يحسم دلالة لا يصرّح بها التركيب.
- issue: المقابلة التصويرية بين κάρφος وδοκός
  choice: القذاة / العارضة الخشبية
  alternative: الشظية / الخشبة الكبيرة
  rationale: يحفظ الاختيار المبالغة المقصودة والتفاوت بين جسم صغير جدًا وقطعة إنشائية ضخمة، من غير تحويل الصورة إلى تقرير حرفي أو تخفيف حدتها.
translation_notes:
  register: الصياغة عربية فصحى حديثة، واضحة ومهيبة. استُعملت «وها هي» للحفاظ على قوة لفت الانتباه في ἰδού، و«العارضة الخشبية» لتوضيح الصورة للقارئ المعاصر. وُضعت علامات الحواشي مباشرة بعد الألفاظ التي تشرحها.
