source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: ar
  text: وكلُّ مَن يسمع كلماتي هذه ولا يعمل بها سيكون مثلَ رجلٍ أحمقَ، بنى بيته على الرمل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: كلُّ مَن يسمع
  rationale: تركيب اسمي عام يفيد الشمول، وهذه صياغة عربية طبيعية تحفظ معنى «كل من».
- source_word: μου τοὺς λόγους τούτους
  choice: كلماتي هذه
  rationale: تحفظ الإشارة والملكية بترتيب عربي فصيح وطبيعي، و«كلمات» هي المقابل المباشر المناسب لـ λόγοι في السياق.
- source_word: μὴ ποιῶν αὐτούς
  choice: لا يعمل بها
  rationale: المقصود عدم تنفيذ الكلمات أو العمل بمقتضاها؛ واستعمال الباء مع «يعمل» طبيعي في العربية، مع إبقاء العبارة موجزة وقريبة من الأصل.
- source_word: ὁμοιωθήσεται
  choice: يُشبَّه
  rationale: يحفظ صيغة المستقبل المبني للمجهول ودلالة المقارنة في اليونانية، ويصل بوضوح إلى جواب الشرط العام.
- source_word: ἀνδρὶ μωρῷ
  choice: برجلٍ أحمقَ
  rationale: يحفظ الاسم المذكر الصريح ἀνήρ والصفة μωρός دون تحييد الصورة التمثيلية أو تغليظها بلفظ عامي.
- source_word: ὅστις ᾠκοδόμησεν
  choice: بنى
  rationale: يمكن وصل الجملة الوصفية في العربية مباشرة بعد «رجل أحمق» من غير اسم موصول، و«بنى» يؤدي معنى الفعل الماضي ببساطة.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: بيته
  rationale: ينقل معنى البيت المادي وضمير الملكية بإيجاز عربي طبيعي.
- source_word: ἐπὶ τὴν ἄμμον
  choice: على الرمل
  rationale: ينقل موضع البناء أو أساسه بوضوح، ويحافظ على صورة المثل.
theological_decisions:
- issue: اللغة المذكرة ذات الدلالة التمثيلية في التشبيه
  choice: برجلٍ أحمقَ
  alternative: بشخصٍ أحمق
  rationale: النص اليوناني يستعمل ἀνήρ، أي «رجل»، في صورة تمثيلية عامة. تُحفظ ذكورة الشخصية داخل التشبيه من غير حصر انطباق التحذير في الرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختير «يُشبَّه» للمحافظة على المبني للمجهول في الأصل، و«لا يعمل بها» لتجنب العبارة غير الطبيعية «لا يفعلها» مع إبقاء معنى الامتثال العملي.
