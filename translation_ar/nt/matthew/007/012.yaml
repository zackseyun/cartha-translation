  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: ar
  text: فكلُّ ما تريدون أن يفعل الناس بكم، افعلوا أنتم أيضًا بهم؛ لأن هذا هو الناموس والأنبياء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: فكلُّ ما
  rationale: تنقل «فـ» الاستنتاج الذي تفيده οὖν، ويؤدي «كل ما» معنى التعبير الشامل Πάντα ... ὅσα بصياغة عربية طبيعية.
- source_word: ἐὰν θέλητε
  choice: تريدون
  rationale: يفيد التركيب اليوناني تعميم ما يرغب المخاطبون في أن يُفعل بهم، و«تريدون» واضحة ومعاصرة.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: أن يفعل الناس بكم
  rationale: «الناس» تؤدي المعنى العام لـἄνθρωποι من غير قصره على الذكور، و«يفعل ... بكم» تحافظ على عمومية الفعل والعلاقة في الأصل.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: افعلوا أنتم أيضًا بهم
  rationale: صيغة الأمر تنقل ποιεῖτε، وإبراز «أنتم أيضًا» يحفظ المقابلة والتوكيد في οὕτως καὶ ὑμεῖς، بينما يعود «بهم» إلى الناس.
- source_word: οὗτος γάρ ἐστιν
  choice: لأن هذا هو
  rationale: تحفظ العبارة بنية الجملة التعليلية الموجزة من غير تفسير زائد.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: الناموس والأنبياء
  rationale: تُبقي الصيغة الكتابية المعروفة التي تلخص قسمي الشهادة الكتابية، من غير تحويلها إلى شرح لاهوتي.
theological_decisions:
- issue: الدلالة العامة لكلمة ἄνθρωποι
  choice: الناس
  alternative: الرجال
  rationale: السياق يتناول علاقة الإنسان بغيره عمومًا، والكلمة اليونانية مستعملة هنا استعمالًا عامًا لا خاصًا بالذكور.
- issue: مدلول «الناموس والأنبياء»
  choice: الإبقاء على الصيغة الكتابية كما هي
  alternative: خلاصة تعاليم الكتاب أو جوهر تعليم الناموس والأنبياء
  rationale: الأصل يستخدم صيغة يهودية ومَتّاوية ذات صدى كتابي؛ والإبقاء عليها يصون هذا الصدى ولا يحسم مقدار ما يعنيه فعل «هذا هو» بتفسير توسعي.
- issue: قوة العبارة οὗτος γάρ ἐστιν
  choice: لأن هذا هو
  alternative: لأن هذا يلخّص
  rationale: الصياغة الحرفية نسبيًا تحفظ التوتر الدلالي في العبارة ولا تستبدل فعل الكينونة بتفسير يقرر أن المقصود مجرد التلخيص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الناموس» للمحافظة على الصيغة الكتابية الاصطلاحية، مع ترتيب عربي طبيعي وإبراز المقابلة في «أنتم أيضًا».
