  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: ar
  text: 'وحينئذ سأُعلن لهم: «إني لم أعرفكم قط[a]. ابتعدوا عني، يا من تمارسون مخالفة الشريعة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لم أُقِرّ بكم قط». ففعل «عرف» في اليونانية قد يحمل دلالة معرفة علائقية أو إقرار، لا مجرد العلم الذهني.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يا عاملي اللاشرعية». ويمكن أيضًا: «يا فاعلي الإثم» أو «يا من يفعلون الشر». فاللفظ اليوناني يشير إلى مخالفة الشريعة أو النظام الإلهي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: وحينئذ
  rationale: تحفظ أداة الربط والتتابع الزمني بصياغة عربية موجزة وطبيعية.
- source_word: ὁμολογήσω
  choice: سأُعلن
  rationale: يفيد الفعل هنا تصريحًا علنيًا وحاسمًا في سياق قضائي، لا اعترافًا بخطأ.
- source_word: Οὐδέποτε
  choice: قط
  rationale: مع النفي في «لم أعرفكم قط» تنقل النفي المطلق والتوكيد بأسلوب عربي فصيح مألوف.
- source_word: ἔγνων
  choice: أعرفكم
  rationale: تحفظ العبارة المباشرة وإيحاء المعرفة العلائقية من غير تحويلها إلى تفسير عقائدي مثل «أقبلكم» أو «أعترف بكم».
- source_word: ἀποχωρεῖτε
  choice: ابتعدوا
  rationale: تنقل أمر الطرد بوضوح ونبرة جادة، وهي أيسر للقارئ المعاصر من بعض الصيغ التراثية.
- source_word: ἐργαζόμενοι
  choice: تمارسون
  rationale: تدل على فعل متكرر أو سلوك مميز، لا على واقعة منفردة فحسب.
- source_word: ἀνομίαν
  choice: الإثم
  rationale: لفظ عربي واضح ووقور يدل على الشر والمعصية؛ وتوضح الحاشية الدلالة الحرفية الأقرب إلى مخالفة الشريعة أو التعدي عليها.
theological_decisions:
- issue: معنى «لم أعرفكم قط»
  choice: الإبقاء على «لم أعرفكم قط»
  alternative: «لم أعترف بكم قط» أو «لم أقبلكم قط»
  rationale: النص اليوناني يستخدم فعل المعرفة بما قد يحمل معنى علائقيًا أو قضائيًا. إبقاء العبارة كما هي يصون هذا الاتساع ولا يحسم ضمنًا مسألة عقائدية لا يشرحها النص هنا.
- issue: دلالة ἀνομία
  choice: «الإثم» في المتن مع بيان البعد المتصل بمخالفة الشريعة في الحاشية
  alternative: «مخالفة الشريعة» أو «التعدي على الشريعة»
  rationale: «الإثم» أكثر سلاسة ووضوحًا في العربية، بينما تمنع الحاشية ضياع القوة الأخلاقية القانونية في اللفظ اليوناني من غير تضييقه على مفهوم طائفي خاص للشريعة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة، مع الحفاظ على نبرة الحكم والطرد. تجنبت الصياغة المذهبية وحافظت على التوتر الدلالي في عبارة «لم أعرفكم قط».
