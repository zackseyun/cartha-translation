source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: ar
  text: فإن كنتم، وأنتم أشرار، تعرفون كيف تعطون أولادكم عطايا صالحة، فكم بالحري سيعطي أبوكم الذي في السماوات[a] خيراتٍ[b] للذين يسألونه؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تَرِد العبارة اليونانية بصيغة الجمع: «في السماوات». ويشيع تقليديًا: «في السماء».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أمورًا صالحة». ولا تَرِد كلمة «عطايا» في هذا الشطر من النص اليوناني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: وأنتم أشرار
  rationale: يحافظ على الوصف المباشر في اليونانية، مع صياغة عربية طبيعية، من غير تخفيفه إلى مجرد النقص ولا توسيعه إلى تقرير عقائدي أشمل.
- source_word: οἴδατε ... διδόναι
  choice: تعرفون كيف تعطون
  rationale: ينقل اقتران فعل المعرفة بالمصدر بمعنى الدراية العملية أو القدرة، وهو التعبير العربي الطبيعي في السياق.
- source_word: δόματα ἀγαθὰ
  choice: عطايا صالحة
  rationale: «عطايا» تقابل الهبات المعطاة، و«صالحة» تحفظ الوصف العام لما هو جيد ونافع.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: أولادكم
  rationale: لفظ عربي جامع للذكور والإناث، طبيعي في خطاب الآباء عن أبنائهم.
- source_word: πόσῳ μᾶλλον
  choice: فكم بالحري
  rationale: تعبير عربي واضح عن حجة الانتقال من الأدنى إلى الأعلى، ويحفظ قوة المقارنة في الأصل.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: أبوكم الذي في السماوات
  rationale: يحفظ بنية العبارة اليونانية الوصفية وصيغة الجمع في «السماوات»، بدل تحويلها إلى لقب وصفي مثل «أبوكم السماوي».
- source_word: δώσει ἀγαθὰ
  choice: سيعطي ... خيراتٍ
  rationale: «خيرات» تنقل الصفة المستعملة اسميًا في اليونانية؛ فالنص هنا لا يكرر كلمة «عطايا» الواردة في الجملة الأولى.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: للذين يسألونه
  rationale: صياغة عربية طبيعية تحفظ دلالة اسم الفاعل على الفئة التي تتوجه إليه بالسؤال عمومًا.
theological_decisions:
- issue: قوة وصف البشر بأنهم أشرار في المقارنة
  choice: الإبقاء على الوصف المباشر «وأنتم أشرار»
  alternative: «مع أنكم خطاة» أو «على ما فيكم من نقص»
  rationale: يحفظ التوتر الذي يقيمه النص بين شر البشر وصلاح الآب الأعظم، من غير استيراد صياغة عقائدية أوسع أو تلطيف العبارة.
- issue: صياغة ὁ ἐν τοῖς οὐρανοῖς
  choice: «الذي في السماوات» بصيغة الجمع
  alternative: «الذي في السماء» أو «أبوكم السماوي»
  rationale: يعكس التعبير المكاني وصيغة الجمع في الأصل اليوناني بوضوح، من غير حسم دلالة لاهوتية تتجاوز النص.
- issue: عدم تكرار «عطايا» في جواب الشرط
  choice: ترجمة ἀγαθὰ المستقلة بـ«خيرات»
  alternative: «عطايا صالحة»
  rationale: يحافظ على الفرق اللفظي في الأصل، حيث لا تتكرر δόματα في الشطر الثاني، ولا يضيّق مدلول ما يعطيه الآب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «فكم بالحري» للحفاظ على قوة الاستدلال المقارن، و«خيرات» لتجنب تكرار لفظ غير موجود في الشطر الثاني من الأصل. وُضعت علامتا الحاشية عند العبارتين اللتين تشرحهما الحاشيتان مباشرة.
