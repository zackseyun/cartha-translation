  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ar
  text: اِسْأَلُوا[a]، فَيُعْطَى لَكُمْ؛ اطْلُبُوا، فَتَجِدُوا؛ اقْرَعُوا، فَيُفْتَحَ لَكُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قد تُفهم صيغ الأمر في زمن الحاضر في اليونانية أيضًا بدلالة الاستمرار: «داوموا على السؤال... واصلوا الطلب... استمروا في القرع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: اُطْلُبُوا
  rationale: فعل أمر حاضر للمخاطبين بصيغة الجمع. «اطلبوا» تعبير عربي طبيعي يحفظ قوة الأمر من غير أن يفرض في المتن معنى الاستمرار الذي قد يفيده الجانب غير التام.
- source_word: δοθήσεται
  choice: فَيُعْطَى
  rationale: فعل مستقبل مبني للمجهول. تحافظ صيغة «يُعطى» على المبني للمجهول، وتترك هوية المُعطي مضمرة كما في اليونانية؛ والفاء هنا تصل الوعد بالأمر ربطًا طبيعيًا في العربية.
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: ضمير جمع في حالة الداتيف، ويؤديه حرف اللام مع ضمير الجمع بوضوح بعد «يُعطى» و«يُفتح».
- source_word: ζητεῖτε
  choice: ابْحَثُوا
  rationale: فعل أمر حاضر بصيغة الجمع. «ابحثوا» واضح في العربية المعاصرة ويحمل معنى السعي إلى العثور، مع إمكان الاستعمال الحرفي والمجازي.
- source_word: εὑρήσετε
  choice: فَتَجِدُوا
  rationale: فعل مستقبل معلوم. يؤدي «فتجدوا» الوعد بصياغة عربية موجزة وطبيعية، من غير إضافة مفعول غير مذكور في الأصل.
- source_word: κρούετε
  choice: اقْرَعُوا
  rationale: فعل أمر حاضر بصيغة الجمع. «اقرعوا» هو التعبير العربي الفصيح المألوف لقرع الباب، ويحافظ على الصورة المجازية.
- source_word: ἀνοιγήσεται
  choice: فَيُفْتَحَ
  rationale: فعل مستقبل مبني للمجهول. تحافظ «يُفتح» على المبني للمجهول وعلى عدم ذكر الفاعل، ولا تضيف اسم «الباب» غير الوارد صراحة في الأصل.
- source_word: καὶ
  choice: فَـ
  rationale: تربط اليونانية بين كل أمر ووعد بالواو. في العربية، الفاء أكثر طبيعية هنا لإظهار التعاقب المرتبط بالأمر من دون إضافة لفظ «ثم»، مع الحفاظ على التوازي الإيقاعي.
theological_decisions:
- issue: دلالة الجانب في أفعال الأمر الحاضرة الثلاثة
  choice: 'صياغتها أوامر عربية مجردة: «اطلبوا، ابحثوا، اقرعوا»، مع بيان احتمال الاستمرار في الحاشية.'
  alternative: «داوموا على الطلب... واصلوا البحث... استمروا في القرع».
  rationale: قد يحمل الأمر الحاضر اليوناني دلالة متواصلة أو متكررة، لكن الصيغة لا تلزم وحدها بإظهار هذه الدلالة بعبارة تفسيرية في المتن. تحافظ الأوامر العربية المجردة على قوة النص وإيجازه، بينما توثق الحاشية الاحتمال الجانبي الحقيقي.
- issue: هوية المُعطي والفاتح في المبني للمجهول
  choice: 'الإبقاء على المبني للمجهول: «يُعطى لكم» و«يُفتح لكم».'
  alternative: التصريح بأن الله يعطي ويفتح.
  rationale: السياق قد يدل على أن الله هو الفاعل الضمني، لكن النص اليوناني لا يسميه في هذه الجملة. الإبقاء على المبني للمجهول يمنع إدخال تفسير لاهوتي صريح في المتن.
translation_notes:
  register: عربية فصحى معاصرة، موجزة وذات إيقاع ثلاثي يحاكي توازي الأصل. استُعمل «ابحثوا» بدل «التمسوا» لوضوحه للقارئ المعاصر، و«اقرعوا» للمحافظة على صورة قرع الباب. وُضع الضبط الجزئي على أوائل الأفعال وصيغ المبني للمجهول لتفادي الالتباس في القراءة.
