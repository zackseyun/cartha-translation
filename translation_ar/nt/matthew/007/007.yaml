  source_fidelity: المعنى العام والتوازي والمبني للمجهول محفوظة في المسودة. لكن التفريق العربي الأدق بين αἰτεῖτε («اسألوا/اطلبوا طلبًا») وζητεῖτε («اطلبوا/التمسوا») يتحقق بوضوح أكبر باستعمال «اسألوا» للأول و«اطلبوا» للثاني؛ إذ إن «ابحثوا» تميل في الاستعمال المعاصر إلى البحث أو التقصّي، وغالبًا ما تتطلب «عن» عند إرادة معنى طلب شيء مفقود.
