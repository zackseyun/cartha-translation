  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: ar
  text: 'لَيْسَ كُلُّ مَنْ يَقُولُ لِي: «يَا رَبُّ، يَا رَبُّ»، سَيَدْخُلُ مَلَكُوتَ السَّمَاوَاتِ[a]، بَلْ مَنْ يَعْمَلُ إِرَادَةَ أَبِي الَّذِي فِي السَّمَاوَاتِ هُوَ الَّذِي سَيَدْخُلُ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «ملكوت السماوات». وهو تعبير يكثر متّى من استعماله، حيث تَرِد في سياقات أخرى عبارة «ملكوت الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: لَيْسَ كُلُّ مَنْ يَقُولُ لِي
  rationale: 'يحفظ النفي الجزئي في اليونانية: المعنى «ليس كل من»، لا «لا أحد». وصيغ اسم الفاعل الحاضر بجملة موصولة عربية طبيعية تحافظ على الدلالة العامة.'
- source_word: Κύριε κύριε
  choice: يَا رَبُّ، يَا رَبُّ
  rationale: «الرب» المقابل العربي المألوف والدقيق لـ κύριος في هذا السياق، وتكرار النداء محفوظ لإبراز التشديد.
- source_word: εἰσελεύσεται
  choice: سَيَدْخُلُ
  rationale: ينقل صيغة المستقبل بوضوح وطبيعية، ولا تستلزم الصيغة اليونانية المتوسطة زيادة لفظية في العربية.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: مَلَكُوتَ السَّمَاوَاتِ
  rationale: «ملكوت السماوات» تعبير عربي كتابي راسخ، ويحفظ جمع οὐρανῶν المميز لاستعمال متى من غير غموض.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: بَلْ مَنْ يَعْمَلُ
  rationale: ينقل اسم الفاعل المعرف بوصفه مقابلة اسمية عامة، و«يعمل إرادة» تعبير عربي واضح يحفظ التباين بين القول والفعل.
- source_word: τὸ θέλημα
  choice: إِرَادَةَ
  rationale: «إرادة» تؤدي معنى θέλημα هنا بوصفه قصد الآب وما يريده، وتحافظ على الصياغة اللاهوتية دون تفسير زائد.
- source_word: τοῦ πατρός μου
  choice: أَبِي
  rationale: ترجمة مباشرة وموجزة تحفظ لغة يسوع البنوية وضمير المتكلم.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: الَّذِي فِي السَّمَاوَاتِ
  rationale: يحفظ التركيب الوصفي وجمع «السماوات» في الأصل اليوناني، وهو مفهوم وطبيعي ضمن السجل الكتابي العربي.
theological_decisions:
- issue: دخول الملكوت وعلاقته بالإقرار اللفظي والطاعة
  choice: إبقاء المقابلة الصريحة بين مجرد مخاطبة يسوع بلقب «الرب» وبين عمل إرادة الآب، من غير بناء منظومة خلاصية أوسع على هذه الآية وحدها.
  alternative: تفسير الآية إما على أنها تقرر الاستحقاق بالأعمال وحدها، أو على أن الإقرار اللفظي وحده كافٍ.
  rationale: النص اليوناني يقابل بوضوح بين القول والعمل، لكنه لا يعرض هنا وحده عقيدة مكتملة عن التبرير أو الخلاص؛ لذلك تحفظ الترجمة التحذير والتوتر اللاهوتي بلا حسم مذهبي زائد.
- issue: إظهار الفعل المحذوف تقديرًا في الشق الثاني
  choice: إضافة «هُوَ الَّذِي سَيَدْخُلُ» لإتمام المعنى في العربية وإبراز المقابلة.
  alternative: الاكتفاء بقول «بل من يعمل إرادة أبي الذي في السماوات».
  rationale: الفعل مفهوم من الشق الأول في اليونانية. إظهاره في العربية لا يضيف حكمًا جديدًا، بل يمنع تعليق الجملة ويجعل المقابلة واضحة وطبيعية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على المصطلحين المألوفين «الرب» و«ملكوت السماوات». استُخدم التشكيل الجزئي/الكامل في نص الآية لضبط القراءة، وحُفظ تكرار النداء والتوازي البلاغي. وُضعت علامة الحاشية [a] في المتن مطابقة لقائمة الحواشي.
