  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: ar
  text: كل شجرة لا تُنتج ثمرًا جيدًا تُقطع وتُلقى في النار[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تحمل ثمرًا جيدًا».'
    reason: lexical_alternative
  - marker: b
    text: «النار» صورة للدينونة؛ ولا تحدد الآية نفسها بدقة هل المقصود دينونة زمنية أم أخروية أم كلتيهما.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: كل شجرة
  rationale: تفيد πᾶν مع الاسم المفرد معنى توزيعيًا، أي كل شجرة على حدة، وتحافظ هذه الصياغة على قوة القول المَثَلي.
- source_word: μὴ ποιοῦν
  choice: لا تُنتج
  rationale: اسم الفاعل المضارع يصف سلوكًا مستمرًا أو سمة مميزة. و«تُنتج» تعكس معنى ποιέω بوضوح، مع أن «تحمل» تعبير عربي مألوف مع الثمر.
- source_word: καρπὸν καλὸν
  choice: ثمرًا جيدًا
  rationale: تنقل العبارة المعنى المباشر لـκαλός، أي الثمر الجيد أو السليم، وتحفظ الدلالة التقويمية في السياق.
- source_word: ἐκκόπτεται
  choice: تُقطع
  rationale: الفعل مضارع مبني للمجهول ويصف ما يقع على الشجرة. و«تُقطع» طبيعية وواضحة، ولا تضيف تحديدًا غير لازم لكيفية القطع.
- source_word: εἰς πῦρ βάλλεται
  choice: تُلقى في النار
  rationale: تحفظ المبني للمجهول وحركة الإلقاء إلى داخل النار. والتعريف في العربية طبيعي في صورة الدينونة المعروفة من السياق، من غير حصر مدلولها.
theological_decisions:
- issue: صورة النار بوصفها دينونة
  choice: الإبقاء على صورة قطع الشجرة وإلقائها في النار من غير تحديد دقيق لمرجع النار
  alternative: تفسير النار بأنها دينونة زمنية، أو أخروية، أو جهنم تحديدًا
  rationale: تدل الآية بوضوح على الدينونة من خلال صورة زراعية، لكنها لا تحدد في ذاتها توقيت هذه الدينونة أو نطاقها؛ لذلك تحافظ الترجمة على التحذير وعلى التوتر اللاهوتي دون تضييق مدلول النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تُنتج» قربًا من الفعل اليوناني، مع إثبات البديل الاصطلاحي «تحمل» في الحاشية. حُفظ الإيجاز والتوازي في الفعلين المبنيين للمجهول.
