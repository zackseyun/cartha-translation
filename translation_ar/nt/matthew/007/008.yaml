  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ar
  text: لِأَنَّ كُلَّ مَنْ يَطْلُبُ يَنَالُ، وَمَنْ يَبْحَثُ يَجِدُ، وَلِمَنْ يَقْرَعُ سَيُفْتَحُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «وللقارع سيُفتح». لا يذكر النص اليوناني «الباب» صراحة، لكنه مفهوم من صورة القرع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: كل من
  rationale: تؤدي الاستعمال الاسمي العام وتحفظ شمول العبارة بصياغة عربية طبيعية.
- source_word: γὰρ
  choice: لأن
  rationale: تحفظ القوة التعليلية التي تربط الآية بالحث السابق.
- source_word: ὁ αἰτῶν
  choice: من يطلب
  rationale: تنقل اسم الفاعل المعرّف بوصفه فئة عامة، مع إبقاء دلالة الفعل المستمر أو المعتاد بحسب السياق.
- source_word: λαμβάνει
  choice: ينال
  rationale: لفظ عربي فصيح وطبيعي لمعنى التلقي أو الحصول هنا، ويحافظ على إيجاز التوازي.
- source_word: ὁ ζητῶν
  choice: من يبحث
  rationale: يميز بوضوح بين طلب الشيء في الجملة الأولى والبحث عنه في الثانية، ويحفظ التدرج التصويري.
- source_word: εὑρίσκει
  choice: يجد
  rationale: المقابل المباشر والطبيعي الذي يحفظ بساطة القول وإيقاعه.
- source_word: τῷ κρούοντι
  choice: من يقرع ... له
  rationale: تُعبَّر الداتيف اليونانية طبيعيًا في العربية بضمير الجر «له» مع المحافظة على بنية العبارة العامة.
- source_word: ἀνοιγήσεται
  choice: يُفتح له
  rationale: يحفظ المبني للمجهول والمستقبل الدلالي، ولا يضيف «الباب» الذي يفهم من الصورة ولا يرد صراحة في اليونانية.
theological_decisions:
- issue: نطاق الوعد وقوته
  choice: صياغة تأكيد عام بألفاظ شاملة من غير تقييد لاهوتي مضاف
  alternative: اعتباره ضمانًا غير مشروط لكل طلب بعينه كما طُلب، أو قصره ترجميًا على أنواع محددة من الطلبات الروحية
  rationale: النص يستعمل تعميمًا صريحًا، ولذلك تُحفظ سعته كما هي من غير أن تُضاف إليه قيود أو استنتاجات تحسم التوتر التفسيري خارج ألفاظ الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع توازٍ إيقاعي بين الأفعال الثلاثة. استُخدمت «يُفتح له» بدل إضافة «الباب» للمحافظة على عدم تعيين المسند إليه في الأصل.
