  to: لذلك، كل من يسمع هذه الأقوال مني ويعمل بها سيُشبَّه برجل حكيم بنى بيته على الصخر.[a][b]
  rationale: التعديل لازم لتصحيح البديل غير الدقيق في الحاشية (أ)، ولتوضيح طبيعة التذكير في الحاشية (ب). كما استُخدمت «سيُشبَّه» لإظهار مستقبل الفعل المبني للمجهول في الأصل، من غير تغيير المعنى أو إضافة تفسير.
