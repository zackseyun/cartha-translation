  terminology: حُفظت «رجل حكيم» لأن ἀνήρ يدل على رجل، لا مجرد شخص عام. و«الصخر» مقابل مناسب لـπέτρα. وصُححت الحاشية الثقافية لتبيّن أن التذكير دلاليّ ومعجميّ في لفظ «رجل»، لا مجرد تذكير نحوي.
