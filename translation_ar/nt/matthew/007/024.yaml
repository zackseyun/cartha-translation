  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: ar
  text: لذلك، كل من يسمع هذه الأقوال مني ويعمل بها سيُشبَّه برجل حكيم بنى بيته على الصخر.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يكون مثل رجل حكيم» أو «يُقارَن برجل حكيم».'
    reason: lexical_alternative
  - marker: b
    text: 'في اليونانية: «رجل حكيم»؛ فكلمة «رجل» تدل على شخصٍ مذكّر في النص الأصلي.'
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: لذلك، كلُّ من
  rationale: تفيد Πᾶς مع ὅστις معنى توزيعيًّا عامًّا، وتنقله «كل من» بوضوح. وتحفظ «لذلك» دلالة οὖν الاستنتاجية وصلتها بما سبق.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: يسمع أقوالي هذه
  rationale: «أقوالي» تعبير عربي طبيعي يحفظ معنى λόγους وإضافته إلى المتكلم بواسطة μου، من غير تضييق المعنى إلى مجرد أصوات مسموعة.
- source_word: καὶ ποιεῖ αὐτούς
  choice: ويعمل بها
  rationale: يدل ποιεῖ هنا على تنفيذ الأقوال والعمل بمقتضاها. و«يعمل بها» أفصح وأوضح في العربية من الترجمة الحرفية «يفعلها».
- source_word: ὁμοιωθήσεται
  choice: يكون مثل
  rationale: ينقل هذا التعبير المقارنة بصورة عربية طبيعية، مع إبقاء احتمال الصيغة المبنية للمجهول «يُشبَّه بـ» في الحاشية.
- source_word: ἀνδρὶ φρονίμῳ
  choice: رجل حكيم
  rationale: تحفظ «رجل» الدلالة الذكورية المحددة في ἀνήρ، وتنقل «حكيم» معنى φρόνιμος الملائم للسياق، الذي يجمع الحكمة والتعقل العملي.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: بنى بيته
  rationale: ترجمة مباشرة وطبيعية تحفظ فعل البناء وضمير الملكية وصورة البيت.
- source_word: ἐπὶ τὴν πέτραν
  choice: على الصخر
  rationale: تحفظ «الصخر» صورة πέτρα بوصفه أساسًا صلبًا، من غير إضافة تفسير مثل «الصخر الصلب» أو «الصخر الأم».
theological_decisions:
- issue: اللغة المذكرة في شخص المقارنة
  choice: رجل حكيم
  alternative: شخص حكيم
  rationale: النص اليوناني يستعمل ἀνήρ، أي «رجل» تحديدًا، في صورة المثل؛ لذلك حُفظ التذكير في المقارنة، بينما بقيت الدعوة العامة شاملة في «كل من».
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «يعمل بها» بدل الحرفية المتعثرة «يفعلها»، وحُفظت العلاقة الاستنتاجية في «لذلك» وصورة البناء على الصخر من غير توسع تفسيري.
