review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام في المسودة أمين للنص اليوناني: العموم الاستنتاجي، سماع أقوال يسوع والعمل بها، وصورة الرجل الحكيم الذي بنى بيته على الصخر. لكن الحاشية (أ) تتضمن «يُمثَّل برجل حكيم»، وهي ليست بديلاً دقيقًا لـὁμοιωθήσεται؛ إذ تفيد التمثيل أو التصوير لا التشبيه/المقارنة. وتُظهر المراجعة المستقبل المبني للمجهول في الفعل بوضوح في النص المنقح.'
