  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: ar
  text: مِن ثمارهم تعرفونهم[a]. أيَجني الناس من الشوك عناقيدَ عنب، أو من الحَسَك تينًا؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِن ثمارهم تميّزونهم».'
    reason: lexical_alternative
  - marker: b
    text: 'الاستفهام إنكاري، والجواب المتوقع هو: لا؛ فلا يُجنى العنب من الشوك ولا التين من الحَسَك.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: ثمار
  rationale: يحافظ على الجمع الصريح والصورة الزراعية المجازية، من غير اختزالها في الأعمال أو النتائج.
- source_word: ἐπιγνώσεσθε
  choice: تعرفون
  rationale: يدل السياق على معرفتهم وتمييزهم من خلال ما يظهر منهم؛ و«تعرفون» عربية طبيعية وتحفظ سعة الفعل دون المبالغة بمعنى المعرفة الكاملة.
- source_word: μήτι
  choice: أيَجني الناس...؟
  rationale: صيغ الاستفهام الإنكاري بما يدل طبيعيًا في العربية على أن الجواب المتوقع هو النفي.
- source_word: συλλέγουσιν
  choice: يجني
  rationale: فعل عربي مألوف لجمع الثمر، ويلائم العنب والتين ويحفظ الصورة الزراعية.
- source_word: ἀκανθῶν
  choice: الشوك
  rationale: مقابل موجز وواضح يمكن أن يدل على النبات الشائك، ويحافظ على التوازي.
- source_word: σταφυλάς
  choice: عناقيد عنب
  rationale: اللفظة اليونانية جمع يدل على العنب أو عناقيده؛ وهذه الصياغة طبيعية عند الحديث عن الجني وتوضح صورة المحصول.
- source_word: τριβόλων
  choice: الحَسَك
  rationale: اسم عربي فصيح لنبات شوكي مؤذٍ، ويميّزه عن «الشوك» في الشطر الأول مع إبقاء التقابل بين النبات الشائك والثمر المأكول.
- source_word: σῦκα
  choice: تينًا
  rationale: المقابل العربي المباشر، واسم الجنس في العربية طبيعي هنا مع دلالته على الثمر.
- source_word: αὐτῶν / αὐτούς
  choice: ثمارهم / تعرفونهم
  rationale: يحفظ الإحالة الشخصية إلى المذكورين في السياق، أي الأنبياء الكذبة، من غير إدخال هذا التفسير في نص الآية.
theological_decisions:
- issue: الدلالة المجازية للثمار في تمييز الأشخاص
  choice: الإبقاء على لفظ «ثمار»
  alternative: أعمالهم أو النتائج التي يُنتجونها
  rationale: يحافظ ذلك على استعارة يسوع الزراعية وعلى مداها اللاهوتي، من غير حصرها تفسيريًا في نوع واحد من القرائن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «الحَسَك» بدقة نباتية مع الضبط لتسهيل قراءته، وحُفظ الإيجاز والتوازي والصورة الزراعية في الأصل.
