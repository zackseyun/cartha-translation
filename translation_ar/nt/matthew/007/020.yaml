  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: ar
  text: إذًا، من ثمارهم ستعرفونهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وعليه، فمن ثمارهم ستعرفونهم».'
    reason: بديل لفظي يبرز علاقة الاستنتاج التي تفيدها العبارة اليونانية ἄρα γε.
lexical_decisions:
- source_word: ἄρα γε
  choice: فإذًا
  rationale: تفيد العبارة استنتاجًا مؤكدًا تأكيدًا خفيفًا؛ و«فإذًا» تنقل قوة الخلاصة بعبارة عربية واضحة وطبيعية.
- source_word: ἀπὸ
  choice: من
  rationale: تدل هنا على الأساس الذي يتم به التعرّف، وتحافظ «من» على صورة الاستدلال من الثمار كما في الأصل.
- source_word: καρπῶν
  choice: ثمار
  rationale: تحافظ على صيغة الجمع وعلى استعارة الثمر التي تربط الآية بسياقها المباشر، من غير اختزالها في الأعمال أو النتائج.
- source_word: αὐτῶν
  choice: هم (في «ثمارهم»)
  rationale: ضمير الملكية يعود إلى الأشخاص المذكورين في السياق، وتؤديه العربية طبيعيًا بضمير متصل.
- source_word: ἐπιγνώσεσθε
  choice: تعرفون
  rationale: الفعل مستقبل في اليونانية ويدل في السياق على تمييز هوية الأشخاص استنادًا إلى دليل ظاهر. والمضارع العربي بعد السياق الاستنتاجي يفيد الحكم المستقبلي العام بوضوح، مع إمكان التصريح بالمستقبل في الحاشية.
- source_word: αὐτούς
  choice: هم (في «تعرفونهم»)
  rationale: الضمير مفعول به ويعود إلى الأشخاص موضوع التحذير، ويُنقل طبيعيًا بضمير متصل.
theological_decisions:
- issue: استعارة «الثمار» في الحكم على الأشخاص
  choice: الإبقاء على استعارة «ثمارهم»
  alternative: أعمالهم أو نتائجهم
  rationale: الأصل يذكر الثمار بوصفها العلامة الظاهرة التي يُعرف بها الأشخاص، والإبقاء على الاستعارة يصون صلتها بالسياق ولا يفرض تفسيرًا مذهبيًا أضيق.
translation_notes:
  register: عربية فصحى معاصرة، موجزة ووقورة. حوفظ على ترتيب «من ثمارهم» قبل الفعل لإبراز معيار التعرّف كما في اليونانية، وعلى جمع «ثمار» والاستعارة الأصلية.
