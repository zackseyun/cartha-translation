base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: ar
  text: احذروا الأنبياء الكذبة[a]، الذين يأتون إليكم بثياب الخراف[b]، لكنهم في باطنهم ذئاب مفترسة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انتبهوا من الأنبياء الكذبة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في ثياب خراف».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لكنهم في داخلهم ذئاب خاطفة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: احذروا
  rationale: فعل أمر حاضر للجمع يدعو إلى يقظة مستمرة تجاه خطر؛ و«احذروا» تعبير عربي طبيعي موجز يحفظ قوة التحذير، ويتعدى مباشرة إلى المحذور.
- source_word: ψευδοπροφητῶν
  choice: الأنبياء الكذبة
  rationale: ينقل اللفظ المركب الدال على من يدّعون النبوة زورًا أو يتكلمون بالكذب بوصفهم أنبياء، من غير حصره في فئة كنسية لاحقة.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: الذين يأتون إليكم
  rationale: صياغة عربية واضحة تحافظ على وصف الأشخاص المقصودين وعلى دلالة الحاضر.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: بثياب الخراف
  rationale: يحفظ صورة الأصل، أي الظهور في هيئة الخراف أو بما يرتبط بها من لباس، من غير تفسير زائد يحسم كيفية اللباس.
- source_word: ἔσωθεν δέ εἰσιν
  choice: لكنهم في باطنهم
  rationale: يبرز التضاد بين المظهر الخارجي والحقيقة الداخلية، مع صياغة عربية طبيعية.
- source_word: λύκοι ἅρπαγες
  choice: ذئاب خاطفة
  rationale: «خاطفة» تحافظ على معنى ἅρπαγες بوصفها مفترسة منقضة تسلب وتنهب، ولا تختزل المعنى في الجوع وحده.
theological_decisions:
- issue: طبيعة التحذير من القادة الدينيين المخادعين
  choice: إبقاء التحذير في إطاره النبوي الأخلاقي والروحي كما يرد في النص
  alternative: تخصيصه بمعلمين هراطقة أو بفئة كنسية محددة وفق تصنيفات عقائدية لاحقة
  rationale: النص يسمّيهم «أنبياء كذبة» ويكشف التباين بين ظاهرهم وحقيقتهم؛ فلا ينبغي توسيع المصطلح أو تضييقه وفق فئات مؤسسية أو مذهبية غير مصرّح بها.
- issue: دلالة ἅρπαγες في وصف الذئاب
  choice: ذئاب خاطفة
  alternative: ذئاب جائعة أو شرسة
  rationale: اللفظ يدل أساسًا على الافتراس والخطف والجشع؛ و«خاطفة» تبقي هذه الدلالة ولا تجعل الجوع وحده محور الصورة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «الأنبياء الكذبة» لعبارة مألوفة ودقيقة، وحُفظت استعارة ثياب الخراف والذئاب من غير شرح داخل المتن. جميع علامات الحواشي مثبتة في النص.
