source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: ar
  text: ادخلوا من الباب الضيق، لأن الباب واسع والطريق رحب[a]، وهو يؤدي إلى الهلاك[b]، وكثيرون هم الذين يدخلون منه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فسيح». فالصفة اليونانية يمكن أن تعني «رحبًا» أو «فسيحًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الدمار» أو «الضياع». فاللفظ اليوناني يدل على الهلاك أو الخراب، ولا تحدد هذه الآية وحدها كل أبعاد المقصود.'
    reason: lexical_alternative
  - marker: c
    text: 'أي على الأرجح: «من ذلك الباب». ويمكن للضمير في اليونانية من حيث المطابقة النحوية أن يعود إلى الباب أو الطريق، لكن فعل الدخول من شيء يرجح الباب في هذا السياق.'
    reason: source_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: ادخلوا
  rationale: فعل أمر موجَّه إلى الجمع، وتنقل «ادخلوا» قوة الأمر مباشرة وبعبارة عربية طبيعية.
- source_word: διὰ τῆς στενῆς πύλης
  choice: من الباب الضيق
  rationale: تفيد διά مع المضاف إليه المرور عبر مدخل؛ واستعمال «دخل من الباب» هو التعبير العربي الطبيعي، و«الضيق» يحفظ المقابلة المكانية.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم الجملة التالية تعليلًا للأمر، و«لأن» تؤدي هذه العلاقة بوضوح.
- source_word: πλατεῖα ἡ πύλη
  choice: الباب واسع
  rationale: تحفظ «واسع» المعنى المكاني للصفة مع ترتيب عربي طبيعي.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: الطريق رحب
  rationale: تعني الصفة أن الطريق فسيح أو واسع؛ و«رحب» طبيعية وتحافظ على التمييز الأسلوبي بين سعة الباب ورحابة الطريق.
- source_word: ἡ ἀπάγουσα
  choice: وهو يؤدي
  rationale: تصف اسم الفاعل الحاضر الطريق بأنه يقود إلى غاية؛ و«يؤدي» صياغة عربية واضحة تحافظ على هذا الاتجاه.
- source_word: εἰς τὴν ἀπώλειαν
  choice: إلى الهلاك
  rationale: «الهلاك» يقابل معنى الدمار أو الضياع الشديد من غير أن يحدد هنا تفصيلًا عقائديًا لا يصرح به النص.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: وكثيرون هم الذين يدخلون منه
  rationale: تحافظ الصياغة على إبراز «كثيرون» وعلى فعل الدخول مع أداة المرور. والضمير يترجم αὐτῆς مباشرة من غير استبدال مرجعه باسم صريح.
theological_decisions:
- issue: دلالة ἀπώλεια في التحذير
  choice: الهلاك
  alternative: الدمار أو الضياع
  rationale: يشير اللفظ إلى نهاية كارثية، لكن الآية لا تفصل طبيعتها اللاهوتية؛ لذلك تحافظ «الهلاك» على شدة التحذير من غير تضييق المعنى.
- issue: مرجع الضمير αὐτῆς في العبارة الأخيرة
  choice: ضمير في «منه» مع بيان الاحتمال في الحاشية
  alternative: من ذلك الباب
  rationale: يمكن من جهة المطابقة النحوية في اليونانية أن يعود الضمير إلى «الباب» أو «الطريق»، وإن كان معنى الدخول من الباب يرجح الباب. إبقاء الضمير يحفظ صياغة الأصل، والحاشية تعرض الاحتمال من غير حسم زائد.
translation_notes:
  register: صياغة عربية فصحى معاصرة، مباشرة ومهيبة، تحافظ على صورة الباب والطريق وعلى إبراز كثرة الداخلين. استُعمل «الباب» بدل «البوابة» لأنه أفصح وأشيع في هذا السياق المجازي، مع بقاء معنى المدخل واضحًا.
