id: MAT.7.10
reference: Matthew 7:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: ar
  text: أو إن طلب سمكة، أفيعطيه حيّة؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثعبانًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ καὶ
  choice: أو إن
  rationale: تستأنف المثال الثاني في سلسلة استفهامية مترابطة؛ وهذه صياغة عربية طبيعية تحفظ معنى الانتقال من غير تكلّف في ترجمة καί.
- source_word: ἰχθὺν
  choice: سمكة
  rationale: مفعول به مفرد، ومعناه العادي يلائم سياق الطعام المنزلي.
- source_word: αἰτήσει
  choice: طلب
  rationale: المستقبل اليوناني وارد في مثال شرطي عام، والماضي العربي بعد «إن» أسلوب فصيح طبيعي يؤدي معنى الشرط من غير حرفية زمنية.
- source_word: μὴ
  choice: أَ...؟
  rationale: تدل μή في هذا السؤال على توقّع جواب بالنفي؛ ويؤدي الاستفهام الإنكاري العربي هذه القوة بوضوح.
- source_word: ὄφιν
  choice: حيّة
  rationale: لفظ عربي فصيح وشائع للحيوان المقصود، وهو أنسب في هذا السياق من «ثعبان» مع بقاء البديل ممكنًا.
- source_word: ἐπιδώσει
  choice: يعطيه
  rationale: الفعل يعني في السياق أن يعطي أو يقدّم، و«يعطيه» أوضح مقابل عربي طبيعي.
- source_word: αὐτῷ
  choice: ـه
  rationale: أُدّي المفعول غير المباشر بضمير متصل، وهو الأسلوب العربي الطبيعي.
theological_decisions:
- issue: قوة الاستفهام البلاغي
  choice: 'صياغته استفهامًا إنكاريًا يتوقع جوابًا بالنفي: «أفيعطيه حيّة؟»'
  alternative: 'صياغته خبرًا منفيًا: «فلن يعطيه حيّة»'
  rationale: تحفظ هذه الصياغة دلالة μή وقوة الحجة البلاغية في السياق، من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة موجزة وطبيعية. استُخدم الاستفهام الإنكاري بدل سؤال ذي ذيل، لأنه يؤدي توقع الجواب بالنفي على نحو عربي أصيل.
