source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: ar
  text: لا تقدر شجرة جيدة أن تُنتج ثمارًا رديئة، ولا تقدر شجرة فاسدة أن تُنتج ثمارًا حسنة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: شجرة جيدة
  rationale: تحفظ «جيدة» المعنى التقييمي المباشر لـἀγαθός وصورة الشجرة، من غير تضييق المعنى إلى الصحة وحدها.
- source_word: οὐ δύναται ... ποιεῖν
  choice: لا تقدر ... أن تُنتج
  rationale: ينقل هذا التركيب معنى عدم القدرة الصريح، وتؤدي «تُنتج» المعنى الاصطلاحي الطبيعي لفعل ποιεῖν مع الثمار.
- source_word: καρποὺς πονηρούς
  choice: ثمارًا رديئة
  rationale: يمكن أن يدل πονηρός على الشر أو السوء أو الرداءة؛ و«رديئة» طبيعية في وصف الثمار، مع إبقاء الدلالة السلبية الواسعة في الاستعارة.
- source_word: οὐδέ
  choice: ولا
  rationale: تحفظ أداة العطف النفي المتوازي والإيقاع المتوازن بين شطري القول.
- source_word: δένδρον σαπρόν
  choice: شجرة فاسدة
  rationale: تعبّر «فاسدة» عن معنى التعفن أو التلف في σαπρός، وتصلح حرفيًا للشجرة ومجازيًا للفساد من غير حصر الصورة في درجة معينة من التحلل.
- source_word: καρποὺς καλούς
  choice: ثمارًا حسنة
  rationale: تنقل «حسنة» جودة الثمار في καλός، وتحافظ على التقابل التقييمي مع «رديئة».
theological_decisions:
- issue: طبيعة الاستحالة في الاستعارة
  choice: 'صياغة القول بوصفه عدم قدرة قاطعًا: «لا تقدر»'
  alternative: لا تُنتج عادةً / لا ينبغي لها أن تُنتج
  rationale: يفيد δύναται مع النفي عدم القدرة، لا مجرد الندرة أو عدم الملاءمة الأخلاقية؛ وتحفظ الصياغة قوة القول من غير استنباط نتائج عقائدية تتجاوز الاستعارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ التوازي بين الشطرين، واستُخدم «تُنتج ثمارًا» بوصفه تعبيرًا عربيًا طبيعيًا قريبًا من تركيب المصدر، من غير إضافة تفسير مذهبي.
