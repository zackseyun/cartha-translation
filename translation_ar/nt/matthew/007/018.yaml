  terminology: المصطلحات المختارة مناسبة وغير تفسيرية مذهبيًا. «شجرة جيدة» و«شجرة فاسدة» تحافظان على الصورة الحرفية والتقييم المقصود، و«ثمار رديئة/حسنة» تؤديان المقابلة بوضوح.
