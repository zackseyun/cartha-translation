  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: ar
  text: وحدث[b] أنه حين أتمّ يسوع هذه الأقوال[a]، اندهشت الجموع من تعليمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذه الكلمات».'
    reason: lexical_alternative
  - marker: b
    text: 'أو في صياغة سردية تقليدية: «وكان لما أتمّ يسوع هذه الأقوال...»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: وحدث
  rationale: صيغة سردية تفيد الانتقال والاستمرار. تحافظ «وحدث» على حضور العبارة اليونانية من غير اللجوء إلى الصياغة العربية التراثية الأثقل «وكان فيما كان».
- source_word: ὅτε
  choice: أنه حين
  rationale: تدخل ὅτε، مع ἐγένετο السابقة، جملة زمنية تبيّن متى وقع ما يلي؛ وتحافظ «أنه حين» على البنية المتداخلة في الأصل مع بقائها مفهومة بالعربية المعاصرة.
- source_word: ἐτέλεσεν
  choice: أتمّ
  rationale: الفعل يدل هنا على أن يسوع بلغ بهذه الأقوال تمامها ونهايتها؛ و«أتمّ» موجزة وطبيعية وتحفظ معنى الإكمال.
- source_word: τοὺς λόγους τούτους
  choice: هذه الأقوال
  rationale: يمكن أن تعني λόγοι كلمات أو أقوالًا. «الأقوال» أنسب هنا لسلسلة التعليم السابقة، مع إبقاء «الكلمات» بديلًا معجميًا مشروعًا في الحاشية.
- source_word: ἐξεπλήσσοντο
  choice: دُهشت
  rationale: ينقل الفعل شدة تأثر الجموع وتعجبها. صيغة «دُهشت الجموع» عربية طبيعية، ولا يلزم تمثيل صيغة الماضي الناقص اليونانية بتركيب استمراري ثقيل في هذا السياق.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: تحفظ «الجموع» صيغة الجمع في اليونانية، وهي فصيحة ومألوفة في العربية الحديثة.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: من تعليمه
  rationale: تفيد ἐπί مع المجرور هنا أساس الدهشة أو سببها؛ و«من تعليمه» تعبير عربي طبيعي يحفظ هذه الدلالة.
theological_decisions:
- issue: مرجع «هذه الأقوال»
  choice: الإشارة إلى التعليم السابق مباشرة من غير تسميته «موعظة»
  alternative: هذه الكلمات؛ هذه الموعظة
  rationale: النص اليوناني يشير إلى ما قاله يسوع، لكنه لا يستخدم تسمية تفسيرية مثل «الموعظة»، ولذلك تُترك الإشارة على عمومها كما في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الصيغة السردية اليونانية «وحدث أنه حين…» بدل اختزالها إلى «ولما…»، مع تجنب التراكيب العتيقة. وُضعت علامتا الحاشيتين في المتن عند اللفظ الذي تتعلق به كل حاشية.
