source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: ar
  text: وهكذا، كلُّ شجرةٍ صالحةٍ تُثمر ثمارًا جيّدة، أمّا الشجرةُ الفاسدةُ فتُثمر ثمارًا رديئة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الفاسدة» بـ«المتعفنة» أو «غير الصالحة»، و«رديئة» بـ«شريرة». تحافظ الصياغة في المتن على طبيعة الصورة الزراعية، بينما يظل الإيحاء الأخلاقي حاضرًا في السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تفيد الاستنتاج أو بيان الكيفية انطلاقًا من الصورة السابقة، و«وهكذا» عربية طبيعية تحفظ هذا الاتساع.
- source_word: πᾶν δένδρον
  choice: كل شجرة
  rationale: تنقل الدلالة التوزيعية مع الاسم المفرد وتحافظ على الطابع العام للمثل.
- source_word: ἀγαθὸν
  choice: صالحة
  rationale: «صالحة» تصف جودة الشجرة وسلامتها الوظيفية في الصورة الزراعية، مع بقاء الإيحاء الأخلاقي للسياق.
- source_word: καρποὺς καλοὺς
  choice: ثمارًا جيّدة
  rationale: καλός هنا يدل على الجودة والاستحسان؛ و«جيّدة» تعبير طبيعي عند تقويم الثمر.
- source_word: ποιεῖ
  choice: تُثمر
  rationale: مع الشجر والثمر، «تُثمر» هي العبارة العربية المألوفة، وتنقل معنى إنتاج الثمار دون حرفية متكلّفة.
- source_word: τὸ δὲ
  choice: أمّا ... فـ
  rationale: يبين التقابل بين نوعي الشجر بتركيب عربي واضح وطبيعي.
- source_word: σαπρὸν
  choice: الفاسدة
  rationale: تنقل معنى الشيء المتعفن أو المتلف أو غير الصالح، وتلائم وصف الشجرة مع إبقاء البعد المجازي.
- source_word: καρποὺς πονηροὺς
  choice: ثمارًا رديئة
  rationale: «رديئة» طبيعية في الصورة الزراعية، ولا تحصر πονηρός في الشر الأخلاقي الصريح، مع السماح للسياق بأن يضفي ذلك الإيحاء.
theological_decisions:
- issue: القوة الأخلاقية في مقابل الصورة الزراعية المحضة
  choice: الإبقاء على صورة الشجرة والثمر بصياغة عربية عادية دون التصريح بتطبيقها الأخلاقي
  alternative: ترجمة أكثر تفسيرًا مثل «الشجرة المستقيمة تصنع أعمالًا صالحة» أو استعمال «ثمارًا شريرة»
  rationale: النص اليوناني يورد المثل نفسه، بينما يبيّن السياق تطبيقه على الأنبياء الكذبة. إبقاء الصورة دون شرح مضاف يحفظ التوتر بين المعنى الحسي والإيحاء الأخلاقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع استعمال «تُثمر» الطبيعي بدل الترجمة الحرفية لـποιεῖ، وبناء «أمّا... فـ» لإبراز المقابلة.
