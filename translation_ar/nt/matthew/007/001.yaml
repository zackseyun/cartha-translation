  text: Do not judge[a], so that you may not be judged.
translation:
  language: ar
  text: لَا تَحْكُمُوا[a] لِكَيْ لَا يُحْكَمَ عَلَيْكُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تُدينوا، لكي لا تُدانوا». قد يدل الفعل اليوناني في بعض السياقات على الإدانة، لكن «تحكموا» أوسع ويحافظ على تكرار الفعل نفسه في شطري الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: لا
  rationale: مع فعل الأمر المضارع، تفيد μή النهي، و«لا» هي الصياغة العربية الطبيعية للنهي.
- source_word: κρίνετε
  choice: تدينوا
  rationale: للفعل κρίνω مجال دلالي واسع يشمل الحكم والفصل والإدانة. واختيار «تدينوا» هنا يحافظ على جذر واحد مع المبني للمجهول «تُدانوا»، مع إبقاء احتمال معنى الحكم موضحًا في الحاشية.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل «لكي» دلالة الغاية أو النتيجة في ἵνα مع صيغة الالتزام، وتحافظ على الصلة المباشرة بين النهي وما يليه.
- source_word: μὴ
  choice: لا
  rationale: تنفي الفعل التالي في صيغة المبني للمجهول، وتنقلها العربية بوضوح بواسطة «لا».
- source_word: κριθῆτε
  choice: تُدانوا
  rationale: صيغة مبني للمجهول من κρίνω؛ وقد روعيت الموازاة البلاغية بتكرار الجذر العربي نفسه في شطري الآية.
theological_decisions:
- issue: مدى معنى κρίνω في نهي يسوع
  choice: استعمال «تدينوا» مع حاشية تبين إمكان معنى «تحكموا» الأوسع.
  alternative: لا تحكموا، لكي لا يُحكم عليكم.
  rationale: قد يدل الفعل على الحكم عمومًا أو على الإدانة بحسب السياق. لا تحدد هذه الآية وحدها جميع حدود النهي، لذلك تُذكر الدلالة الأوسع في الحاشية، من غير تحويل النص إلى تقرير مذهبي عن كل تقييم أخلاقي.
translation_notes:
  register: عربية فصحى حديثة، موجزة ومهيبة. ضُبط المبني للمجهول بالشكل الجزئي منعًا للالتباس، ووُضعت علامة الحاشية بعد الفعل الذي تتعلق به.
