base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: ar
  text: 'كثيرون سيقولون لي في ذلك اليوم: «يا رب، يا رب، أما تنبأنا باسمك، وباسمك أخرجنا شياطين، وباسمك صنعنا أعمالَ قوةٍ كثيرة[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صنعنا معجزات كثيرة»، أو: «صنعنا أعمالًا عظيمة كثيرة». والعبارة اليونانية تعني حرفيًا «أعمال قوة كثيرة»، وهو تعبير يُستعمل في الأناجيل للدلالة غالبًا على أعمال معجزية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرون
  rationale: الصفة المذكرة الجمع مستعملة استعمال الاسم من غير أداة تعريف؛ و«كثيرون» تنقل ذلك مباشرة من غير إضافة «أناس».
- source_word: ἐροῦσίν μοι
  choice: سيقولون لي
  rationale: تنقل صيغة المستقبل مع ضمير المفعول غير المباشر بوضوح وطبيعية.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير عربي طبيعي يحفظ الإشارة الأخروية الضمنية من غير أن يصرح بما لم يصرح به النص.
- source_word: Κύριε κύριε
  choice: يا رب، يا رب
  rationale: تكرار النداء محفوظ لما فيه من إلحاح، و«الرب» المقابل المعتاد والدقيق للقب κύριος هنا.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: أما تنبأنا
  rationale: استفهام تقريري ينتظر جوابًا مثبتًا؛ و«تنبأنا» هو المقابل العربي المباشر للفعل.
- source_word: τῷ σῷ ὀνόματι
  choice: باسمك
  rationale: تعبير عربي راسخ للعمل استنادًا إلى الاسم أو سلطانه، مع حفظ تكراره ثلاث مرات لقوته البلاغية.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: أخرجنا شياطين
  rationale: صياغة واضحة ومألوفة للدلالة على طرد الشياطين، وتحافظ على صورة فعل الإخراج.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: صنعنا أعمالًا عظيمة كثيرة
  rationale: تحفظ الصلة بالقوة والاقتدار دون حصر العبارة صراحة في «المعجزات»، وتبقى مفهومة للقارئ المعاصر.
theological_decisions:
- issue: ترجمة κύριος في مخاطبة يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ الدلالة العادية للقب وثقله المسيحاني في آن واحد من غير إضافة تفسير عقائدي.
- issue: القوة الأخروية لعبارة «ذلك اليوم»
  choice: في ذلك اليوم
  alternative: في يوم الدينونة
  rationale: السياق يشير إلى الدينونة الأخيرة، لكن اليونانية تقول فقط «ذلك اليوم»؛ لذلك حُفظ الإضمار والتوتر اللاهوتي.
- issue: مدلول δυνάμεις πολλὰς
  choice: أعمالًا عظيمة كثيرة
  alternative: معجزات كثيرة
  rationale: اللفظة قد تدل في الأناجيل على أعمال القوة أو المعجزات؛ فاختيرت عبارة لا تحسم المجال الدلالي أكثر مما يفعل الأصل، مع بيان البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التكرار الثلاثي لعبارة «باسمك» والتكرار الندائي «يا رب، يا رب» لقيمتهما البلاغية، ووُضعت علامة الحاشية [a] في المتن.
