  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: ar
  text: يا مرائي، أخرج أولًا الخشبة[a] من عينك، وعندئذ سترى بوضوح فتُخرج القذى[b] من عين أخيك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: العارضة الخشبية أو الجذع الكبير (δοκός).'
    reason: lexical_alternative
  - marker: b
    text: 'أي: الشظية الدقيقة أو عود القش الصغير (κάρφος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: يا مرائي
  rationale: منادى مفرد يحمل توبيخًا مباشرًا وحادًّا؛ وأداة النداء تجعل الخطاب طبيعيًّا وواضحًا في العربية.
- source_word: ἔκβαλε
  choice: أخرج
  rationale: فعل أمر يفيد نزع الشيء من موضعه، ويحافظ على الصورة الحسية وعلى الصلة بالفعل نفسه لاحقًا في الآية.
- source_word: πρῶτον
  choice: أولًا
  rationale: ينقل بوضوح أولوية الفعل وترتيبه.
- source_word: δοκόν
  choice: الخشبة
  rationale: تدل δοκός على قطعة خشب كبيرة، ولا سيما عارضة البناء. و«الخشبة» واضحة وطبيعية وتحفظ المبالغة المقصودة في مقابل القذى الصغير.
- source_word: ὀφθαλμοῦ
  choice: عين
  rationale: المقابل العربي المباشر والطبيعي في هذه الصورة الجسدية.
- source_word: διαβλέψεις
  choice: سترى بوضوح
  rationale: يحفظ معنى الرؤية الواضحة الذي يحمله الفعل المركب، بدل الاكتفاء بفعل «ترى».
- source_word: ἐκβαλεῖν
  choice: تُخرج
  rationale: يكرر جذر «أخرج» كما يكرر اليوناني فعل ἐκβάλλω، ويحافظ على الترابط البلاغي بين الأمر الأول والفعل اللاحق.
- source_word: κάρφος
  choice: القذى
  rationale: «القذى» شيء دقيق يقع في العين، وهو مقابل عربي موجز يحفظ التباين المقصود مع الخشبة الكبيرة.
- source_word: ἀδελφοῦ
  choice: أخيك
  rationale: ينقل صيغة المفرد المذكر وعلاقة الأخوة في النص من غير تعميم أو تحييد.
theological_decisions:
- issue: دلالة ἀδελφοῦ المذكرة وعلاقة الجماعة
  choice: أخيك
  alternative: عين شخص آخر / عين قريبك
  rationale: النص اليوناني يستعمل المفرد المذكر «الأخ»، فحُفظت الصيغة والعلاقة كما هما من غير توسيع دلالي غير لازم.
- issue: العلاقة بين διαβλέψεις والمصدر ἐκβαλεῖν
  choice: سترى بوضوح كيف تُخرج
  alternative: ستبصر بوضوح لتُخرج
  rationale: الصياغة المختارة عربية طبيعية وتحفظ ارتباط وضوح الرؤية بإخراج القذى، من غير تحويل القول إلى ضمان أخلاقي مستقل أو حصره في مجرد القدرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ومباشرة. حُفظ التوبيخ في «يا مرائي»، والتضاد التصويري الحاد بين «الخشبة» و«القذى»، مع وضع علامتي الحاشيتين عند اللفظين اللذين تشرحانهما.
