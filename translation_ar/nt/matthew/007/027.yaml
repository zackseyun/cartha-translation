    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: نزل المطر
  rationale: ترجمة مباشرة وطبيعية لحركة المطر إلى أسفل، وتحافظ على بساطة العبارة اليونانية.
- source_word: ἦλθον οἱ ποταμοί
  choice: جاءت الأنهار
  rationale: تحافظ على المعنى الأساسي للاسم ποταμοί، أي «الأنهار»، وعلى الفعل البسيط «جاءت»، مع إبقاء احتمال الإشارة السياقية إلى مياه الفيضان في الحاشية.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: هبَّت الرياح
  rationale: تعبير عربي فصيح وطبيعي يقابل هبوب الرياح دون توسع تفسيري.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ضربت ذلك البيت
  rationale: ينقل معنى اصطدام الرياح بالبيت في سياق العاصفة، بصياغة عربية واضحة وموجزة.
- source_word: ἔπεσεν
  choice: فسقط
  rationale: يحافظ على الفعل العام «سقط» بدل تفسيره بلفظ أخص مثل «انهار».
- source_word: ἦν ἡ πτῶσις αὐτῆς μεγάλη
  choice: وكان سقوطه عظيمًا
  rationale: يحافظ على الاسم المشتق من فعل السقوط وعلى وصفه بالعِظَم، من غير تهويل أو شرح زائد.
theological_decisions:
- issue: دلالة صورة سقوط البيت وشدة الدينونة
  choice: وكان سقوطه عظيمًا
  alternative: وكان انهياره كارثيًّا
  rationale: يصرّح النص بعِظَم السقوط، لكنه لا يضيف هنا وصفًا صريحًا لطبيعة الدينونة أو توقيتها؛ لذلك تُحفظ قوة التحذير من غير إدخال تفسير لاهوتي زائد.
