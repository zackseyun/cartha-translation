base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: ar
  text: وهطل المطر، وجاءت الأنهار[a]، وهبّت الرياح وضربت ذلك البيت[b]، فلم يسقط، لأنه كان قد أُسِّس على الصخر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وجاءت السيول»؛ والكلمة اليونانية تعني حرفيًا «الأنهار».
    reason: lexical_alternative
  - marker: b
    text: أو «سقطت على ذلك البيت» أو «ارتطمت بذلك البيت».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: هطل المطر
  rationale: تعبير عربي طبيعي يصوّر نزول المطر، ويحفظ دلالة الحركة إلى أسفل التي يحملها الفعل καταβαίνω دون تكلّف حرفي.
- source_word: οἱ ποταμοί
  choice: الأنهار
  rationale: هذا هو المعنى المعجمي المباشر للكلمة اليونانية، مع إثبات «السيول» في الحاشية لأنها تلائم مشهد العاصفة وقد تكون المراد السياقي.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: هبّت الرياح
  rationale: صياغة عربية معيارية وطبيعية لوصف هبوب الرياح.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: صدمت ذلك البيت
  rationale: ينقل الفعل قوة اندفاع الرياح ووقوعها على البيت في هذا السياق، من غير إضافة معنى الانهيار.
- source_word: οὐκ ἔπεσεν
  choice: فلم يسقط
  rationale: ترجمة مباشرة للفعل ἔπεσεν، وهي أقل تفسيرًا من «لم ينهَر».
- source_word: τεθεμελίωτο
  choice: كان قد أُسِّس
  rationale: 'يحفظ دلالة الماضي التام والمبني للمجهول: كان تأسيس البيت قد تم قبل هبوب العاصفة، وظل قائمًا على ذلك الأساس.'
- source_word: ἐπὶ τὴν πέτραν
  choice: على الصخر
  rationale: يحفظ صورة الصخر بوصفه أساسًا ثابتًا، من غير تخصيصها إلى «الصخر الأم» أو تحميل الصورة تعريفًا لاهوتيًا غير مصرّح به في الآية.
theological_decisions:
- issue: الدلالة المَثَلية للصخر
  choice: على الصخر
  alternative: على الصخر الأم
  rationale: تُبقي الترجمة صورة المثل كما وردت، من غير أن تعيّن في هذه الآية وحدها هوية الصخر لاهوتيًا، ومن غير زيادة تخصيص جيولوجي لا يفرضه النص اليوناني.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات إيقاع سردي مهيب. استُعملت أفعال مألوفة في وصف العاصفة، مع الحفاظ على تتابع الجمل في الأصل اليوناني وعلى صورة البيت المؤسَّس على الصخر.
