base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: ar
  text: لا تعطوا ما هو مقدّس للكلاب[a]، ولا تطرحوا لآلئكم أمام الخنازير، لئلا تدوسها بأقدامها، وتلتفت فتمزّقكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الشيء المقدّس، أو ما هو مكرّس. العبارة اليونانية عامة ولا تعيّن المقصود على وجه الدقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ما هو مقدّس
  rationale: ينقل الصفة المحايدة المستعملة اسميًا بصياغة عامة، من غير حصر المرجع في تعليم مقدّس أو شيء مكرّس بعينه.
- source_word: κυσίν
  choice: للكلاب
  rationale: ترجمة مباشرة تحفظ قوة الصورة المجازية وحدّتها الثقافية من غير تلطيف.
- source_word: βάλητε
  choice: تطرحوا
  rationale: فعل عربي فصيح جارٍ في الاستعمال، يؤدي معنى الإلقاء المقصود في βάλλω ويلائم اللآلئ.
- source_word: μαργαρίτας
  choice: لآلئكم
  rationale: المعنى المعجمي المباشر، مع إبقاء الجمع وضمير المخاطبين كما في الأصل.
- source_word: χοίρων
  choice: الخنازير
  rationale: اللفظ العربي الحديث الواضح الذي يحفظ الصورة المجازية.
- source_word: μήποτε
  choice: لئلا
  rationale: تؤدي التحذير من النتيجة المحتملة بإيجاز طبيعي.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: تدوسها بأقدامها
  rationale: صياغة عربية طبيعية تنقل فعل الدوس والعبارة الصريحة المتعلقة بالأقدام؛ ويعود ضمير المؤنث غير العاقل على اللآلئ جمعًا.
- source_word: στραφέντες
  choice: ثم تلتفت
  rationale: تنقل الحركة التالية للدوس، ويبيّن «ثم» تعاقب الفعلين من غير إثقال بصيغة اسم فاعل.
- source_word: ῥήξωσιν ὑμᾶς
  choice: فتمزّقكم
  rationale: يحفظ عنف الفعل، والفاء تربط الالتفات بما يعقبه من هجوم مباشر.
theological_decisions:
- issue: تفسير صور «ما هو مقدّس» و«الكلاب» و«اللآلئ» و«الخنازير»
  choice: الإبقاء على الصور من غير شرح تفسيري داخل النص
  alternative: تعيين المقدّس بأنه تعليم الملكوت، وتعيين الكلاب والخنازير بأنهم الأشرار أو الرافضون للبشارة
  rationale: لا يحدّد النص نفسه مدلول كل صورة بدقة؛ لذلك يحفظ إبقاؤها اتساع الدلالة والتوتر التفسيري، ويتجنب إدخال قراءة مذهبية أضيق.
- issue: فاعل فعلي الدوس والتمزيق
  choice: إبقاء الخنازير فاعلًا للفعلين كما يقتضي التركيب اليوناني
  alternative: تقسيم الفعلين ضمنيًا بين الخنازير والكلاب
  rationale: الفاعل النحوي الأقرب في الجملة اليونانية هو الخنازير، والضمائر وصيغة الجمع تواصل الإحالة إليها، مع بقاء غرابة الصورة المقصودة.
translation_notes:
  register: 'العربية فصحى حديثة واضحة وذات نبرة وقورة. استُعملت «تطرحوا» بدل صياغة تراثية أثقل، وحُفظت الصور الحادة كما وردت. روعي أن أفعال جمع غير العاقل في العربية تأتي مؤنثة مفردة: «تدوسها... تلتفت... تمزّقكم».'
