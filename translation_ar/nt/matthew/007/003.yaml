  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ar
  text: ولكن لماذا ترى القَذى[a] الذي في عين أخيك، ولا تنتبه إلى الخشبة[b] التي في عينك أنت؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التبنة» أو «الشظية الصغيرة» بدل «القَذى» (κάρφος).'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «العارضة» بدل «الخشبة» (δοκός)، أي خشبة كبيرة من خشب البناء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: ولكن لماذا
  rationale: تؤدي τί هنا معنى «لماذا» في هذا السؤال الإنكاري، وتفيد δέ انتقالًا ذا مسحة من المقابلة؛ وصياغة «ولكن لماذا» طبيعية وتحفظ القوة البلاغية.
- source_word: βλέπεις
  choice: ترى
  rationale: المعنى الأساسي هو الرؤية، واختياره يحفظ الصورة الحسية ويُبقي التمييز عن κατανοεῖς.
- source_word: κάρφος
  choice: القَذى
  rationale: يدل اللفظ على جسم صغير جاف كالتبنة أو الشظية؛ و«القذى» لفظ عربي مألوف لما يقع في العين، ويحفظ التضاد مع الخشبة من غير تحديد مادته أكثر مما يفعل الأصل.
- source_word: ἀδελφοῦ σου
  choice: أخيك
  rationale: يحفظ الاسم اليوناني المفرد المذكر وصلة القرابة الواردة في النص من غير تعميم أو تحييد.
- source_word: τὴν ... δοκόν
  choice: الخشبة
  rationale: δοκός عارضة أو خشبة كبيرة تُستعمل في البناء. «الخشبة» واضحة للقارئ وتحفظ المبالغة والتضاد مع القذى.
- source_word: ἐν τῷ σῷ ὀφθαλμῷ
  choice: في عينك أنت
  rationale: الضمير الملكي σῷ مؤكد في مقابل «عين أخيك»، وإضافة «أنت» تُظهر هذا التوكيد طبيعيًا بالعربية.
- source_word: οὐ κατανοεῖς
  choice: لا تنتبه إلى
  rationale: يفيد κατανοέω الملاحظة الواعية وإمعان النظر. «لا تنتبه إلى» تميّزه عن «ترى» وتحفظ المفارقة في السؤال.
theological_decisions:
- issue: لفظ القرابة المذكر ἀδελφοῦ
  choice: أخيك
  alternative: أخيك أو أختك؛ قريبك
  rationale: الأصل مفرد مذكر، فحُفظ كما هو بدل توسيعه أو تحييده، مع أن المبدأ الأخلاقي في القول قابل للتطبيق العام.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «القذى» لملاءمته الطبيعية لصورة العين، وأُبرز توكيد σῷ بقول «عينك أنت». جميع علامات الحواشي مثبتة في المتن.
