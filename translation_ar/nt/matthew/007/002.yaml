    rationale: المعنى المتبادل مفهوم من السياق، لكن النص اليوناني لا يذكر «نفسه» ولا «يُردّ». ينبغي أن تعرض الحاشية البديل بوصفه توضيحًا للاستلزام لا لفظًا مذكورًا.
