  source_fidelity: يلزم إظهار الاستقبال في الفعلين المبنيين للمجهول، إذ هما في اليونانية بصيغة المستقبل (κριθήσεσθε، μετρηθήσεται). كما أن إضافة «به» بعد الموصول توضح العلاقة الأداتية التي تفيدها ἐν ᾧ من غير زيادة في المعنى.
  naturalness: «الحكم الذي تحكمون به» و«الكيل الذي تكيلون به» أفصح وأوضح من حذف الجار، مع بقاء التوازي البلاغي. و«ستُحكَمون» و«سيُكال لكم» واضحان في العربية الفصحى الحديثة.
  terminology: «الحكم/تحكمون/تُحكَمون» يحافظ على سعة κρίνω وعلى التقارب اللفظي في الأصل، من غير حصره في الإدانة. و«الكيل/تكيلون/يُكال» يحفظ الصورة المثلية والتكرار المرتبط بـ μέτρον/μετρέω.
