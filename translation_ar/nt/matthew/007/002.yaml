  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: ar
  text: لِأَنَّكُمْ بِالْحُكْمِ الَّذِي تَحْكُمُونَ بِهِ سَتُحْكَمُونَ، وَبِالْكَيْلِ الَّذِي تَكِيلُونَ بِهِ سَيُكَالُ لَكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سَيُكالُ لَكُمْ بِالمُقابِلِ». تفيد العبارة معنى المعاملة بالمثل، لكن لفظ «بالمقابل» غير مذكور صراحةً في اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: بِالْحُكْمِ الَّذِي تَحْكُمُونَ تُحْكَمُونَ
  rationale: يحفظ الجذر العربي الواحد تكرار الألفاظ اليونانية المتقاربة، ويبقي معنى κρίνω عامًا من غير حصره في الإدانة.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: بِالْكَيْلِ الَّذِي تَكِيلُونَ يُكَالُ لَكُمْ
  rationale: «الكيل» تعبير عربي طبيعي في هذا القول المثلي، ويحفظ التوازي اللفظي بين الاسم والفعل وصيغة المبني للمجهول.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: بِـ... الَّذِي ... وَبِـ... الَّذِي
  rationale: الباء تعبّر بوضوح عن الأداة أو المعيار، مع الحفاظ على البنية المتوازية في اليونانية.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تبيّن الصلة التعليلية بالنهي الوارد في العدد السابق بصياغة عربية واضحة.
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: ينقل الداتيف كما ورد، من غير إضافة معنى «الردّ» إلى المتن.
theological_decisions:
- issue: فاعل الحكم والكيل المتبادل
  choice: 'الإبقاء على الفعلين بصيغة المبني للمجهول: «تُحْكَمُونَ» و«يُكَالُ لَكُمْ»'
  alternative: سيحكم الله عليكم / سيحكم الناس عليكم
  rationale: النص اليوناني لا يصرّح بالفاعل؛ لذلك لا تحسم الترجمة هل المقصود حكم الله على وجه الخصوص أم مبدأ المقابلة الأوسع.
- issue: مدى معنى κρίνω
  choice: تحكمون / تُحكمون
  alternative: تدينون / تُدانون
  rationale: «الإدانة» أضيق دلالة، بينما «الحكم» يحفظ سعة اللفظ اليوناني والتوتر التحذيري في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت ألفاظ «الحكم» و«الكيل» للحفاظ على التكرار البلاغي والتوازي في الأصل، مع إبقاء الفاعل غير مصرّح به كما في اليونانية.
