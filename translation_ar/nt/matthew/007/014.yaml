  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: ar
  text: لأن الباب ضيّق، والطريق المؤدّي إلى الحياة شاقّ، وقليلون هم الذين يجدونه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: ضيّق
  rationale: ينقل المعنى المكاني المباشر للصفة اليونانية ويحافظ على صورة الباب الضيّق.
- source_word: τεθλιμμένη
  choice: شاقّ
  rationale: تفيد الصيغة اليونانية طريقًا واقعًا تحت الضغط أو التضييق، ومن ثم طريقًا عسيرًا؛ و«شاقّ» عربية طبيعية تنقل أثر الصورة في هذا السياق من غير حصرها في الضيق المكاني.
- source_word: ἀπάγουσα
  choice: المؤدّي
  rationale: تعبير عربي واضح عن الطريق الذي يقود إلى غاية.
- source_word: ζωήν
  choice: الحياة
  rationale: يحافظ على اللفظ المطلق في الأصل ولا يضيف تحديدًا مثل «الأبدية» غير مصرح به هنا.
- source_word: εὑρίσκοντες αὐτήν
  choice: الذين يجدونه
  rationale: مرجع الضمير في اليونانية هو الطريق، ولما كان «الطريق» مذكرًا في العربية لزم تذكير الضمير.
theological_decisions:
- issue: مدلول «الحياة»
  choice: الحياة
  alternative: الحياة الأبدية
  rationale: يُترك مدلول الحياة على سعته السياقية كما في الأصل، من غير إدخال وصف لاهوتي غير مذكور صراحة.
- issue: طبيعة الطريق الموصوف بلفظ τεθλιμμένη
  choice: شاقّ
  alternative: مُضيَّق
  rationale: «شاقّ» يحفظ معنى العسر والضغط المقصود في السياق، بينما «مُضيَّق» قد يوحي في العربية بوصف مكاني محض أو بصياغة غير طبيعية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة، تحافظ على التوازي بين الباب والطريق وعلى نبرة القول الحكمية. استُعملت «وقليلون هم» لإبراز قلة الذين يجدون الطريق كما تفعل البنية اليونانية.
