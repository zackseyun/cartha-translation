id: MAT.9.8
reference: Matthew 9:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: ar
  text: فلما رأت الجموع ذلك، خافت[a] ومجَّدت الله الذي أعطى الناس[b] سلطانًا كهذا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امتلأت رهبة». يدل الفعل اليوناني حرفيًا على الخوف، لكن الخوف هنا قد يتضمن انبهارًا توقيريًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «البشر». اللفظ اليوناني بصيغة المذكر الجمع، ويمكن أن يدل على البشر عمومًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: فلما رأت
  rationale: نُقل اسم الفاعل الأوريستي بصيغة زمنية طبيعية في العربية، مع تأنيث الفعل لأن فاعله جمع تكسير لغير العاقل لفظًا.
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقال السرد وربط رد فعل الجموع بما سبقه، والفاء طبيعية في السياق العربي دون تشديد معنى الاستدراك.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: يحفظ صيغة الجمع في اليونانية، وهو تعبير عربي واضح ومعاصر.
- source_word: ἐφοβήθησαν
  choice: خافت
  rationale: يحفظ المعنى المعجمي المباشر للخوف، مع إبقاء احتمال امتزاجه بالرهبة في الحاشية.
- source_word: ἐδόξασαν
  choice: مجَّدت
  rationale: يحفظ ثقل الفعل اللاهوتي δοξάζω واتساقه، بدل اختزاله في معنى التسبيح وحده.
- source_word: τὸν θεὸν
  choice: الله
  rationale: المفعول به المباشر للفعل، وترجمته العربية المعيارية.
- source_word: τὸν δόντα
  choice: الذي أعطى
  rationale: نُقل اسم الفاعل المعرّف بوصفه جملة صلة تعود إلى الله؛ والماضي العربي يعبّر طبيعيًا عن الفعل السابق لرد الجموع.
- source_word: ἐξουσίαν
  choice: سلطانًا
  rationale: يدل على السلطة أو الحق المخوَّل، و«سلطان» أدق وأرسخ كتابيًا من مجرد القدرة.
- source_word: τοιαύτην
  choice: كهذا
  rationale: ينقل معنى «مثل هذا/من هذا النوع» بصياغة عربية موجزة وطبيعية.
- source_word: τοῖς ἀνθρώποις
  choice: الناس
  rationale: لفظ ἄνθρωποι هنا يمكن أن يدل على البشر عمومًا، و«الناس» يحفظ هذا المعنى الطبيعي من غير حصره في الذكور.
theological_decisions:
- issue: هل يُلطَّف رد فعل الجموع من الخوف إلى الرهبة؟
  choice: خافت
  alternative: امتلأت رهبة
  rationale: الفعل اليوناني يدل مباشرة على الخوف، وإن كان السياق يسمح بخوف مشوب بالرهبة؛ لذلك أُبقي المعنى الأقوى في المتن ولم يُحسم الانفعال تفسيرًا.
- issue: دلالة τοῖς ἀνθρώποις
  choice: الناس
  alternative: البشر أو الرجال
  rationale: الاسم اليوناني مذكر جمع من حيث الصيغة، لكنه شائع للدلالة على البشر عامة. «الناس» هو المقابل العربي الطبيعي ويحفظ التوتر السردي في منح سلطان كهذا للبشر، دون افتراض أنه خاص بالذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ جمع «الجموع»، واستُعمل «سلطان» للدلالة على السلطة المخوَّلة، مع إبقاء غموض طبيعة خوف الجموع ودلالة منح السلطان للناس.
