source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: ar
  text: 'وكان يقول: «ابتعدوا، لأن الصبية لم تمت، بل هي نائمة». وكانوا يضحكون منه[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانوا يسخرون منه». يمكن أن يدل الفعل اليوناني على الضحك من شخص بقصد الاستهزاء به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: وكان يقول
  rationale: صيغة الماضي الناقص تدل على قول جارٍ أو متكرر في المشهد، و«كان يقول» تحفظ هذا الجانب الزمني بصورة طبيعية.
- source_word: Ἀναχωρεῖτε
  choice: ابتعدوا
  rationale: فعل أمر للجمع يطلب من الحاضرين أن يتنحّوا أو يغادروا، و«ابتعدوا» واضحة وطبيعية في السياق.
- source_word: οὐ γὰρ
  choice: لأن ... لم
  rationale: تفيد γάρ تعليل الأمر السابق، و«لأن» تؤدي العلاقة السببية بوضوح في العربية الحديثة.
- source_word: ἀπέθανεν
  choice: لم تمت
  rationale: يحيل الماضي اليوناني إلى وقوع الموت بوصفه حدثًا؛ والنفي بـ«لم تمت» يحفظ ذلك من غير تحويل العبارة إلى مجرد وصف للحالة.
- source_word: τὸ κοράσιον
  choice: الصبية
  rationale: تشير الكلمة إلى فتاة صغيرة أو ناشئة؛ و«الصبية» موجزة وفصيحة من غير إضافة تصغير غير لازم.
- source_word: ἀλλὰ καθεύδει
  choice: بل هي نائمة
  rationale: يحفظ التعبير حالة النوم الحاضرة والمقابلة الصريحة مع الموت، بصياغة عربية طبيعية.
- source_word: κατεγέλων αὐτοῦ
  choice: وكانوا يضحكون منه
  rationale: يحفظ صورة الضحك الموجَّه إليه، كما تعكس «كانوا يضحكون» دلالة الماضي الناقص؛ وقد يحمل الفعل معنى السخرية، وهو مبيّن في الحاشية.
theological_decisions:
- issue: قول يسوع إن الصبية لم تمت بل هي نائمة
  choice: الإبقاء على صورة النوم حرفيًا من غير شرح تفسيري داخل المتن
  alternative: إضافة «إنما» أو تفسير النوم صراحةً بوصفه استعارة عن الموت
  rationale: يحافظ النص بذلك على التوتر السردي واللاهوتي الذي يتركه الأصل قائمًا، من غير حسم لطبيعة هذا القول أو توسيعه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. وُضعت علامة الحاشية بعد عبارة الضحك التي تتعلق بها دلاليًا، لا بعد فعل القول.
