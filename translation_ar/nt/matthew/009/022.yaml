  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: ar
  text: 'أَمَّا يَسُوعُ فَالْتَفَتَ وَرَآهَا، وَقَالَ: «تَشَجَّعِي يَا ابْنَتِي؛ إِيمَانُكِ قَدْ خَلَّصَكِ».[a] فَشُفِيَتِ الْمَرْأَةُ مِنْ تِلْكَ السَّاعَةِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «خَلَّصَكِ»: «شَفَاكِ» أو «جَعَلَكِ مُعَافَاةً». فالفعل اليوناني قد يدل على الخلاص أو الشفاء، والنص يحفظ المعنى الأوسع في كلام يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: الْتَفَتَ
  rationale: ينقل معنى الالتفات هنا بصورة طبيعية من غير تحديد زائد لاتجاه الحركة.
- source_word: ἰδὼν αὐτήν
  choice: رَآهَا
  rationale: صياغة عربية واضحة تؤدي عمل اسم الفاعل اليوناني ضمن تتابع الحدث.
- source_word: Θάρσει
  choice: تَشَجَّعِي
  rationale: أمر مباشر طبيعي في العربية يدل على الثقة والشجاعة؛ ويوافق مخاطبة امرأة.
- source_word: θύγατερ
  choice: يَا ابْنَتِي
  rationale: يحفظ خطاب القرابة وما فيه من رفق، من غير إضافة وصف تفسيري.
- source_word: πίστις
  choice: إِيمَانُكِ
  rationale: يحفظ المصطلح الواسع والمألوف، مع كون معنى الثقة حاضرًا في السياق.
- source_word: σέσωκέν σε
  choice: قَدْ خَلَّصَكِ
  rationale: يحفظ المجال الدلالي الأوسع للفعل σῴζω، الذي قد يدل على الخلاص أو الشفاء، كما ينقل دلالة صيغة التام.
- source_word: ἐσώθη
  choice: شُفِيَتْ
  rationale: السياق السردي يبيّن أن النتيجة المباشرة هي زوال المرض، ولذلك يوضح «شُفيت» المقصود الجسدي هنا.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: مِنْ تِلْكَ السَّاعَةِ
  rationale: ترجمة قريبة من بنية الأصل ومفهومة في العربية الفصحى، وتفيد ابتداء الحالة من ذلك الوقت.
theological_decisions:
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الثقة
  rationale: «الإيمان» يحفظ الاتساع الاصطلاحي، بينما «الثقة» وجه دلالي ممكن في هذا السياق لكنه لا يلزم أن يحل محل اللفظ الأوسع.
- issue: دلالة σῴζω في كلام يسوع وخاتمة الراوي
  choice: «خلَّصكِ» في القول المباشر و«شُفيت» في النتيجة السردية
  alternative: «شفاكِ» في القول المباشر، أو «خُلِّصت» في الخاتمة
  rationale: 'اختلاف الصياغة يحفظ التوتر الدلالي بين الخلاص والشفاء: كلام يسوع يبقى أوسع، وخاتمة الراوي تصرّح بالأثر الجسدي المباشر.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم ترتيب الأفعال العربية الطبيعي بدل محاكاة أسماء الفاعل اليونانية حرفيًا، مع إبقاء المقابلة الدلالية بين «خلّصك» و«شُفيت».
