  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية كاملةً: التفات يسوع ورؤيته للمرأة، وخطابه المشجّع، ونداء «يا ابنتي»، والإيمان، ودلالة σῴζω الواسعة في القول المباشر مقابل نتيجة الشفاء الجسدي في السرد، وابتداء الشفاء «من تلك الساعة». التفريق بين «خلّصكِ» و«شُفيت» يحفظ المقابلة الدلالية المقصودة ولا يفرض تفسيرًا مذهبيًا.'
  naturalness: 'الصياغة فصحى واضحة ورصينة وطبيعية: «أما يسوع فالتفت ورآها، وقال» سليمة في السرد العربي، و«تشجّعي يا ابنتي» خطاب مناسب لمخاطبة امرأة. كما أن «من تلك الساعة» تعبير عربي كتابي مفهوم ومناسب للنبرة.'
  terminology: «إيمانكِ» اختيار ثابت وطبيعي لـπίστις، و«خلّصكِ» يحفظ المجال الأوسع لـσῴζω في كلام يسوع، فيما «شُفيت المرأة» يعبّر بدقة عن النتيجة الجسدية التي يوضحها السياق. الحاشية تشرح البدائل دون أن تزاحم النص أو تحسم اتساع اللفظ.
