  verdict: revise
  source_fidelity: 'النص ينقل تسلسل الصورة ونتيجتها بدقة: لا تُوضَع الخمر الجديدة في القِرَب القديمة، وإلا تمزقت القِرَب وانسكبت الخمر وتلفت القِرَب؛ ثم يرد البديل الذي به يُحفَظ الاثنان. لكن «طريّة» تصف ليونة الجلد، وهي نتيجة أو ملاءمة محتملة في السياق وليست المعنى المعجمي المباشر لـκαινούς، الذي هو «جديدة». كما أن تفسير الحاشية لـκαινός بأنه «غير مستعملة» أضيق من دلالة اللفظ اليوناني.'
