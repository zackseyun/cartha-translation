  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: ar
  text: ولا يضعون خمرًا جديدة في قِرَب بالية؛ وإلا تمزقت القِرَب، وانسكبت الخمر، وتلفت القِرَب. بل يضعون خمرًا جديدة في قِرَب جديدة[a]، فيُصان كلاهما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستعمل اليونانية صفتين مختلفتين: الخمر «جديدة» (νέος)، والقِرَب «جديدة» (καινός). ويمكن أن تشير الثانية إلى جِدّة القِرَب أو حالتها الملائمة، لكن العربية تستعمل هنا اللفظ نفسه.'
    reason: بيان الفرق المعجمي بين الصفتين اليونانيتين من غير تحميل καινός معنى «غير مستعملة» على نحو حصري.
lexical_decisions:
- source_word: οὐδὲ
  choice: ولا
  rationale: تربط هذا المثال المنفي بما سبقه ربطًا طبيعيًا وتحفظ قوة العطف.
- source_word: βάλλουσιν
  choice: يضعون
  rationale: الاختيار العربي المألوف لوضع الخمر في وعائها، من غير الإيحاء بالقذف.
- source_word: οἶνον νέον
  choice: خمرًا جديدة
  rationale: تعبير واضح عن الخمر الحديثة الصنع، ويحفظ وصف νέος الدال على الجِدّة الزمنية.
- source_word: ἀσκούς
  choice: قِرَب
  rationale: القِرَب أوعية جلدية كانت تُستخدم لحفظ الخمر، وهي المقابل العربي الموجز والدقيق.
- source_word: παλαιούς
  choice: بالية
  rationale: يعبّر عن قِرَب قديمة تدهورت حالتها، وهو المقصود في مقابل القِرَب الطرية الصالحة للتمدد.
- source_word: εἰ δὲ μή γε
  choice: وإلا
  rationale: ينقل الشرط التحذيري ونتيجته بأسلوب عربي طبيعي وموجز.
- source_word: ῥήγνυνται
  choice: تمزقت
  rationale: يصف انشقاق القِرَب تحت ضغط الخمر المتخمرة بوضوح.
- source_word: ἐκχεῖται
  choice: انسكبت
  rationale: يبيّن ضياع الخمر نتيجة تمزق القِرَب، لا مجرد سكبها عمدًا.
- source_word: ἀπόλλυνται
  choice: تلفت
  rationale: ينقل معنى صيرورة القِرَب غير صالحة للاستعمال دون مبالغة لفظية.
- source_word: ἀλλὰ
  choice: بل
  rationale: يقدّم الممارسة الصحيحة في مقابلة الحالة المنفية السابقة.
- source_word: καινούς
  choice: طريّة
  rationale: يبرز أن القِرَب جديدة في حالتها، أي ما زالت لينة وقابلة للتمدد، ويحافظ قدر الإمكان على التمييز عن νέος في وصف الخمر.
- source_word: ἀμφότεροι συντηροῦνται
  choice: فيُصان كلاهما
  rationale: يشير بوضوح إلى حفظ الخمر والقِرَب معًا.
theological_decisions:
- issue: التمييز بين νέος وκαινός في الآية نفسها
  choice: ترجمة νέος بـ«جديدة» للخمر، وκαινός بـ«طريّة» للقِرَب
  alternative: ترجمة الصفتين كلتيهما بـ«جديدة»
  rationale: يستعمل النص اليوناني صفتين مختلفتين؛ فالخمر جديدة من حيث الزمن، أما القِرَب فجديدة أو سليمة من حيث الحالة. يحفظ هذا الاختيار الفارق من غير تحميل الصورة تفسيرًا عقائديًا زائدًا.
translation_notes:
  register: صياغة عربية فصحى واضحة ومعاصرة ذات نبرة كريمة. استُعملت «قِرَب» للدلالة على أوعية الخمر الجلدية، و«طريّة» لإيضاح صلاحية الجلد الجديد للتمدد مع إبقاء الحاشية لبيان الفارق اليوناني.
