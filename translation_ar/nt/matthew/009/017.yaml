  terminology: «خمر جديدة» و«قِرَب بالية» مناسبتان. يُستحسن استعمال «قِرَب جديدة» بدل «طريّة»؛ وتشرح الحاشية الفرق بين νέος وκαινός من غير أن تحصر الثاني في معنى «غير مستعملة».
