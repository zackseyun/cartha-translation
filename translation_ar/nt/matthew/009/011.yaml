base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: ar
  text: 'ولمّا رأى الفرّيسيّون ذلك[a]، كانوا يقولون لتلاميذه: «لماذا يأكل معلّمكم مع جُباة الضرائب والخاطئين؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا على نحو أقرب: «وإذ رأى الفرّيسيّون، كانوا يقولون لتلاميذه...». لا تذكر اليونانية مفعول «رأى» صراحة، والمقصود من السياق مشهد تناول الطعام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ولمّا رأى ... ذلك
  rationale: صيغ اسم الفاعل الماضي هنا بوصفه جملة زمنية طبيعية في العربية. وأُضيف اسم الإشارة «ذلك» ليدل على مشهد الطعام المفهوم من السياق، مع التنبيه في الحاشية إلى أن المفعول به غير مذكور صراحة في اليونانية.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: يحافظ هذا التعبير على الجانب الاستمراري أو غير المكتمل للفعل اليوناني بصيغة الماضي الناقص، من غير أن يفرض معنى التكرار حتمًا.
- source_word: μαθηταῖς
  choice: لتلاميذه
  rationale: «تلاميذ» هو المقابل العربي الطبيعي والمستقر في سياق العلاقة بين المعلّم ومن يتعلمون منه ويتبعونه.
- source_word: Διὰ τί
  choice: لماذا
  rationale: استفهام عربي مباشر وطبيعي يؤدي معنى السؤال عن السبب.
- source_word: τελωνῶν
  choice: جُباة الضرائب
  rationale: تعبير واضح للقارئ الحديث يدل على القائمين بتحصيل الضرائب، ويحفظ الدلالة الاجتماعية للمصطلح من غير إثقال تقني.
- source_word: ἁμαρτωλῶν
  choice: الخاطئين
  rationale: مقابل مباشر للمصطلح اليوناني، ويحافظ على كونه وصفًا أخلاقيًا واجتماعيًا في سياق كلام الفرّيسيين.
- source_word: ἐσθίει
  choice: يأكل
  rationale: ينقل المعنى الأساسي للفعل وزمنه الحاضر داخل السؤال، بلا إضافة معنى الوليمة أو المشاركة لمجرد السياق.
- source_word: διδάσκαλος
  choice: معلّمكم
  rationale: ترجمة واضحة ومباشرة للقب، وتحفظ علاقة التعليم القائمة في العبارة.
theological_decisions:
- issue: هل يُصرَّح بمفعول «رأى» المحذوف في اليونانية؟
  choice: إضافة «ذلك» في المتن مع حاشية توضيحية
  alternative: «وإذ رأى الفرّيسيّون، كانوا يقولون...» من غير مفعول صريح
  rationale: اليونانية تترك ما رآه الفرّيسيّون ضمنيًا، أي مشهد تناول الطعام في السياق. تحتاج العربية الطبيعية هنا إلى ما يتمم الفعل غالبًا؛ لذا استُعمل «ذلك» من غير تحديد زائد، مع حفظ الغموض الصوري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع تراكيب سردية طبيعية. استُخدم «كانوا يقولون» لحفظ دلالة الماضي الناقص، و«جُباة الضرائب» للوضوح المعاصر.
