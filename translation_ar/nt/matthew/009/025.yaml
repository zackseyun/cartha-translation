  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: ar
  text: ولمّا أُخرج الجمع، دخل وأمسك بيدها، فقامت الفتاة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُقيمت الفتاة». يمكن أن تُفهم صيغة الفعل اليوناني على الوجهين.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ولمّا
  rationale: تؤدي «لمّا» معنى الظرف الزمني، وتنقل الواو الانتقال السردي الخفيف الذي تؤديه δέ، بصياغة عربية طبيعية.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: أُخرج الجمع
  rationale: يحافظ المبني للمجهول «أُخرج» على صيغة الفعل اليوناني من غير إيحاء غير لازم بالعنف أو بطرد الأرواح، و«الجمع» تعبير عربي واضح عن الحاضرين المحتشدين.
- source_word: εἰσελθὼν
  choice: دخل
  rationale: يُنقل اسم الفاعل الماضي اليوناني بفعل سردي متتابع، وهو الأسلوب الطبيعي الواضح في العربية.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: أمسك بيدها
  rationale: هذا تعبير عربي طبيعي ودقيق لمعنى الإمساك باليد، ويحفظ الفعل المباشر من غير مبالغة في قوة القبض.
- source_word: ἠγέρθη
  choice: قامت
  rationale: «قامت» تنقل النتيجة بصورة طبيعية في السياق، مع إبقاء إمكان فهم الصيغة اليونانية على أنها مبنية للمجهول في الحاشية.
- source_word: τὸ κοράσιον
  choice: الفتاة
  rationale: «الفتاة» لفظ واضح ومعاصر يدل على الأنثى الصغيرة أو الشابة من غير نبرة قديمة.
theological_decisions:
- issue: دلالة ἠγέρθη في سياق إعادة الفتاة إلى الحياة
  choice: قامت
  alternative: أُقيمت الفتاة
  rationale: تتيح «قامت» سرد الحدث طبيعيًا من غير تحديد الفاعل نحويًا، بينما تحفظ الحاشية احتمال المبني للمجهول في اليونانية، فلا تُحسم الدلالة اللاهوتية أو النحوية أكثر مما يسمح به النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات إيقاع سردي طبيعي. وُضعت علامة الحاشية بعد العبارة التي تتعلق بها مباشرة.
