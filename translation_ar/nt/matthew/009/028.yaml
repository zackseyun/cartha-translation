id: MAT.9.28
reference: Matthew 9:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: ar
  text: 'ولمّا دخل البيت[a]، اقترب منه الأعميان، فقال لهما يسوع: «أتؤمنان أني أقدر أن أفعل هذا؟» فقالا له: «نعم، يا رب[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولمّا أتى إلى البيت».'
    reason: صياغة أقرب إلى البنية اللفظية اليونانية، بينما يوضح «دخل البيت» الحركة المقصودة إلى داخله.
  - marker: b
    text: 'أو: «يا سيدي». فالكلمة اليونانية يمكن أن تكون نداء احترام، وقد تدل هنا أيضًا على الإقرار بسلطان يسوع.'
    reason: حفظ مدى دلالة κύριε وعدم حصرها في قراءة لاهوتية واحدة.
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: ولمّا دخل البيت
  rationale: تنقل العبارةُ الحدثَ التمهيدي بصياغة عربية طبيعية؛ و«دخل» يعبّر بوضوح عن الحركة إلى داخل البيت من غير تكرار ثقيل مع الفعل التالي.
- source_word: προσῆλθον αὐτῷ
  choice: اقترب منه
  rationale: يفيد الفعل التقدّم إلى شخص أو الاقتراب منه، وهذه صياغة واضحة وطبيعية في السياق.
- source_word: οἱ τυφλοί
  choice: الأعميان
  rationale: الصفة اليونانية مستعملة استعمال الاسم، والسياق السابق يبيّن أن المقصود رجلان؛ لذلك يحفظ المثنّى العربي العدد والجنس بإيجاز.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: فقال لهما يسوع
  rationale: مع أن اليونانية تستعمل المضارع التاريخي، فإن الماضي هو الأسلوب الطبيعي للسرد العربي هنا، والفاء تصل القول بما سبقه من غير تغيير المعنى.
- source_word: Πιστεύετε
  choice: أتؤمنان
  rationale: ينقل فعل الإيمان في سؤال مباشر، مع مطابقة المخاطبَين في صيغة المثنّى.
- source_word: ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: أني أقدر أن أفعل هذا
  rationale: تحافظ الصياغة على معنى القدرة في δύναμαι وعلى الإشارة المفتوحة في «هذا» إلى الشفاء المطلوب.
- source_word: λέγουσιν αὐτῷ
  choice: فقالا له
  rationale: استُعمل الماضي للسرد العربي الطبيعي، وصيغة المثنّى تطابق الرجلين.
- source_word: Ναί
  choice: نعم
  rationale: المقابل العربي المباشر لأداة الإيجاب.
- source_word: κύριε
  choice: يا رب
  rationale: يحفظ المقابل المعتاد للقب κύριος وإمكان الدلالة على الاعتراف بسلطان يسوع، مع بيان معنى المخاطبة الاحترامية البديل في الحاشية.
theological_decisions:
- issue: دلالة κύριε في مخاطبة يسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: يمكن أن تكون الكلمة نداء احترام بمعنى «يا سيدي»، ويمكن أن تحمل اعترافًا بسلطان يسوع. اختير «يا رب» لحفظ هذا الاحتمال الأوسع من غير الجزم بأن المتكلمين يقدّمون هنا اعترافًا لاهوتيًا مكتملًا.
- issue: المضارع التاريخي في λέγει وλέγουσιν
  choice: 'الماضي: «فقال» و«فقالا»'
  alternative: 'المضارع: «فيقول» و«فيقولان»'
  rationale: الماضي أنسب للسرد العربي الفصيح الطبيعي، ولا يغيّر ترتيب الأحداث أو مضمون الحوار؛ أما حيوية المضارع التاريخي اليوناني فلا يلزم نسخها آليًا إلى العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنّى في «الأعميان» وأفعال الخطاب والجواب لأنه طبيعي في العربية ويعكس أن المقصود رجلان. وُضعت علامتا الحاشيتين في موضعيهما المطابقين لمضمونهما.
