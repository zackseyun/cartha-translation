  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: ar
  text: 'ثم يقول[a] لتلاميذه: «الحصاد كثير[b]، أمّا العمّال فقليلون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستعمل اليونانية المضارع التاريخي: «يقول». ويمكن في العربية أن تُترجم: «قال».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الحصاد وفير».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: تفيد التتابع في السياق السردي، وهي صياغة عربية موجزة وطبيعية.
- source_word: λέγει
  choice: يقول
  rationale: تحافظ صيغة المضارع على المضارع التاريخي في اليونانية وعلى حيوية السرد، مع إمكان التعبير عنها بالماضي في العربية.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: تنقل معنى «التلاميذ» وتحفظ ضمير الملكية الصريح αὐτοῦ في تركيب عربي طبيعي.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: أمّا ... فـ
  rationale: هذا التركيب العربي ينقل المقابلة التي تفيدها μέν...δέ بوضوح ومن غير تكلّف.
- source_word: θερισμός
  choice: الحصاد
  rationale: يحفظ الصورة الزراعية في النص ولا يفسّر مرجعها المجازي داخل الترجمة.
- source_word: πολύς
  choice: كثير
  rationale: وصف مباشر وطبيعي يدل على الكثرة، ويمكن أيضًا ترجمته «وفير».
- source_word: ἐργάται
  choice: العمّال
  rationale: لفظ عربي معاصر وواضح لمن يقومون بالعمل في الحصاد.
- source_word: ὀλίγοι
  choice: قليلون
  rationale: ينقل الوصف الخبري المباشر ويقابل «كثير» من غير إضافة معنى «أقل مما ينبغي» غير المصرّح به.
theological_decisions:
- issue: الدلالة المجازية لقول الحصاد
  choice: الإبقاء على صورة الحصاد الزراعية من غير شرح مرجعها في متن الآية.
  alternative: التصريح بأن الحصاد يشير إلى أناس مهيّئين لتلقّي خدمة يسوع.
  rationale: النص نفسه يورد الصورة المجازية ولا يشرح مرجعها هنا؛ لذلك يحفظ إبقاؤها كما هي مجال الدلالة والتوتر التفسيري في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «أمّا... فـ» لنقل المقابلة اليونانية طبيعيًا، وحُفظت الصورة الزراعية من غير تفسير زائد.
