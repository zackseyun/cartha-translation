translation:
  language: ar
  text: فقام يسوع وتبعه، وكذلك تلاميذه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: فقام
  rationale: اسم فاعل ماضٍ من ἐγείρω مستعمل هنا بمعنى لازم، و«فقام» تنقل النهوض تمهيدًا للفعل التالي بصياغة سردية عربية طبيعية.
- source_word: ἠκολούθει
  choice: وتبعه
  rationale: فعل ماضٍ ناقص من ἀκολουθέω يدل في السياق على شروع يسوع في اتباع الرجل واستمرار سيره وراءه؛ والماضي العربي هو الأنسب للسرد من غير إثقال الصياغة.
- source_word: αὐτῷ
  choice: ـه
  rationale: 'الضمير يعود إلى الرئيس المذكور في الآية السابقة، وتقتضي العربية وصله بالفعل: «تبعه».'
- source_word: μαθηταὶ
  choice: تلاميذه
  rationale: «التلاميذ» هو المقابل العربي المألوف والدقيق في سياق الأناجيل، ويحفظ علاقة التعلّم والاتباع.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: وكذلك تلاميذه
  rationale: يحذف اليوناني الفعل في الجملة المعطوفة اعتمادًا على المذكور قبله؛ وتحافظ «وكذلك تلاميذه» على هذا الإيجاز مع وضوح اشتراكهم في الاتباع.
