id: MAT.9.34
reference: Matthew 9:34
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: ar
  text: 'أمّا الفريسيون فكانوا يقولون: «برئيس الشياطين يطرد الشياطين».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بأمير الشياطين يطرد الشياطين».
    reason: بديل معجمي لـἄρχων؛ «أمير» ممكن، لكن «رئيس» أوضح في العربية المعاصرة من جهة السلطة ولا يوحي بالضرورة بلقب نبالة.
lexical_decisions:
- source_word: δὲ
  choice: أمّا
  rationale: تُظهر التحول التقابلي من تعجب الجموع في السياق السابق إلى تفسير الفريسيين المعادي، بصياغة عربية طبيعية.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: النقل العربي المألوف لاسم هذه الجماعة اليهودية، مع حفظ أداة التعريف.
- source_word: ἔλεγον
  choice: فكانوا يقولون
  rationale: يحفظ صيغة الماضي الناقص دلالة القول المستمر أو المتكرر، بدل تصويره بالضرورة كقول وقع مرة واحدة.
- source_word: Ἐν τῷ ἄρχοντι
  choice: برئيس
  rationale: الباء تعبّر طبيعيًا عن معنى الوسيلة أو القوة التي نُسب إليها طرد الشياطين، و«رئيس» تنقل معنى صاحب السلطة بوضوح.
- source_word: τῶν δαιμονίων
  choice: الشياطين
  rationale: صيغة الإضافة «رئيس الشياطين» طبيعية في العربية وتحفظ معنى كونه متسلطًا عليهم.
- source_word: ἐκβάλλει
  choice: يطرد
  rationale: فعل عربي واضح ومألوف في سياق إخراج الشياطين، وينقل معنى الإبعاد بالقوة.
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: مقابل مباشر للمصطلح اليوناني، ويحفظ الإشارة الصريحة إلى الكائنات الشيطانية دون تلطيفها إلى تعبير أعم.
theological_decisions:
- issue: دلالة ἐν مع اسم رئيس الشياطين
  choice: برئيس الشياطين
  alternative: بواسطة رئيس الشياطين
  rationale: تحفظ الباء اتهام الفريسيين بأن مصدر القدرة أو وسيلتها هو رئيس الشياطين، من غير أن تحسم بأكثر مما يقوله التركيب اليوناني كيفية هذه الوكالة.
- issue: ترجمة δαιμόνια في سياق طرد الأرواح
  choice: الشياطين
  alternative: الأرواح الشريرة
  rationale: النص يستعمل δαιμόνια لا لفظ «أرواح»، ولذلك فـ«الشياطين» أدق ويحفظ الوزن اللاهوتي المباشر للاتهام.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «فكانوا يقولون» لحفظ استمرارية الماضي الناقص، و«يطرد» لتجنب تعبير أثقل مع بقاء معنى إخراج الشياطين بالقوة.
