base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: ar
  text: 'وبينما كان يسوع يمضي من هناك، تبعه رجلان أعمَيان وهما يصرخان ويقولان: «ارحمنا يا ابن داود[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ابن داود» لقب ملكي مسياني، يشير إلى يسوع بوصفه الوارث الموعود من نسل داود.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: وبينما كان يسوع منصرفًا من هناك
  rationale: ينقل تركيب اسم المفعول الحاضر معنى التزامن والحركة بعيدًا عن الموضع السابق، من غير أن يوحي بأن يسوع كان يمر عرضًا بمحاذاة الرجلين.
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعه
  rationale: يعبر بوضوح وطبيعية عن الاتباع الجسدي في سياق السرد.
- source_word: δύο τυφλοὶ
  choice: أعميان
  rationale: صيغة المثنى المذكر العربية تنقل بدقة العدد والجنس المفهومين من اليونانية، ولا تحتاج إلى إضافة «رجلان».
- source_word: κράζοντες καὶ λέγοντες
  choice: وهما يصرخان ويقولان
  rationale: يحافظ على الفعلين وعلى ما في κράζω من ارتفاع الصوت وشدة الاستغاثة، مع صياغة عربية طبيعية.
- source_word: Ἐλέησον ἡμᾶς
  choice: ارحمنا
  rationale: مقابل عربي مباشر ومألوف لصيغة الأمر الدالة على التماس فعل الرحمة.
- source_word: υἱὲ Δαυίδ
  choice: يا ابن داود
  rationale: يحفظ اللقب بصيغته التقليدية ودلالته الملكية المسيانية، ويظهر النداء بأداة النداء العربية.
theological_decisions:
- issue: الدلالة المسيانية لعبارة «ابن داود»
  choice: إبقاء اللقب «ابن داود» في المتن من غير تفسير داخله
  alternative: «يا ابن داود المسيحاني» أو «يا نسل داود»
  rationale: النص اليوناني يورد اللقب التقليدي من غير شرح صريح؛ وإبقاؤه يحفظ دلالته الملكية المسيانية ولا يضيف إلى المتن تفسيرًا غير ملفوظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى الطبيعي، وحُفظ تتابع فعلي الصراخ والقول، ووُضع مؤشر الحاشية بعد اللقب الذي تشرحه مباشرة.
