  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: ar
  text: ولما جاء يسوع إلى بيت الحاكم[a]، ورأى عازفي الناي[b] والجمع يضجّ[c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «صاحب السلطة». وبالمقارنة مع الروايات الموازية: «رئيس المجمع». أما لفظ متى هنا فهو ببساطة «الحاكم».'
    reason: alternative_reading
  - marker: b
    text: كان عازفو الناي من بين النادبين الذين جرت العادة أن يحضروا في المآتم.
    reason: cultural_note
  - marker: c
    text: أو «في جلبة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ولما جاء
  rationale: ينقل القوة الزمنية لاسم الفاعل الماضي في سياق سردي عربي طبيعي، من غير صياغة حرفية ثقيلة.
- source_word: οἰκίαν
  choice: بيت
  rationale: المعنى المباشر في هذا السياق السردي، وهو أوضح من بدائل أكثر تفسيرًا.
- source_word: ἄρχοντος
  choice: الحاكم
  rationale: يحافظ على عموم اللفظ اليوناني الذي يدل على صاحب سلطة أو رئاسة، من غير تخصيصه برئيس المجمع اعتمادًا على الروايات الموازية.
- source_word: ἰδὼν
  choice: رأى
  rationale: فعل سردي مباشر وطبيعي يقابل المعنى البسيط للفعل اليوناني.
- source_word: αὐλητὰς
  choice: عازفي الناي
  rationale: تعبير عربي واضح عن العازفين على آلة النفخ المذكورة، مع بيان السياق الجنائزي في الحاشية دون إدخاله في المتن.
- source_word: ὄχλον
  choice: الجمع
  rationale: مقابل عربي مألوف ومناسب لـὄχλος في السرد.
- source_word: θορυβούμενον
  choice: يضجّ
  rationale: ينقل الاضطراب الصاخب بصياغة موجزة وطبيعية، مع إبقاء «في جلبة» بديلًا معجميًا في الحاشية.
theological_decisions:
- issue: تحديد صاحب البيت
  choice: الحاكم
  alternative: صاحب السلطة؛ أو، بالمقارنة مع الروايات الموازية، رئيس المجمع
  rationale: نص متى يستعمل ἄρχων وحدها، فلا ينبغي أن يضاف إلى المتن تخصيص مستمد من الروايات الموازية. «الحاكم» يبقي الدلالة العامة للفظ، والحاشية تعرض الاحتمالات دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ولما جاء» للسرد الطبيعي، و«يضجّ» لنقل الضوضاء والاضطراب بإيجاز. وُضعت علامات الحواشي بعد الألفاظ التي تشرحها مباشرة، مع إبقاء الفاصلة الختامية لأن الآية تتصل نحويًا بما بعدها.
