  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: ar
  text: 'فانفتحت أعينهما. وحذّرهما يسوع بصرامة[a] قائلاً: «احرصا على ألّا يعلم أحد[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «شدّد عليهما» أو «أنذرهما بشدة». يدل الفعل اليوناني على انفعال قوي وعلى الحزم في التحذير.'
    reason: lexical_alternative
  - marker: b
    text: 'المعنى الحرفي: «انظرا/احرصا ألا يعلم أحد». ومفعول «يعلم» غير مذكور في اليونانية، ويُفهم من السياق أنه ما حدث من شفاء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: انفتحت
  rationale: صيغة ماضٍ مبني للمجهول من ἀνοίγω، والتعبير العربي «انفتحت أعينهما» ينقل الحدث طبيعيًا من غير إضافة فاعل غير مصرّح به.
- source_word: αὐτῶν οἱ ὀφθαλμοί
  choice: أعينهما
  rationale: الضمير في اليونانية للجمع، لكن سياق الرواية المباشر يتحدث عن رجلين؛ لذلك يعبّر المثنى العربي بوضوح وطبيعية عن «أعينهما».
- source_word: ἐνεβριμήθη
  choice: حذّرهما بصرامة
  rationale: الفعل يدل على انفعال قوي يظهر في تحذير أو تكليف حازم. وهذه الصياغة تحفظ قوة الكلام من غير أن تجعله توبيخًا صريحًا أو تضيف سببًا للتحذير.
- source_word: λέγων
  choice: قائلاً
  rationale: اسم الفاعل اليوناني يربط التحذير مباشرة بمضمونه، و«قائلاً» يحافظ على هذه الصلة.
- source_word: Ὁρᾶτε μηδεὶς γινωσκέτω
  choice: إيّاكما أن يعلم أحد
  rationale: Ὁρᾶτε هنا صيغة تنبيه وتحذير، ويتبعها أمر منفي بألا يعلم أحد. الأسلوب التحذيري «إيّاكما» يؤدي القوة المقصودة في عربية واضحة، مع إبقاء مفعول «يعلم» غير مصرّح به كما في اليونانية.
theological_decisions:
- issue: قوة أمر يسوع بالكتمان بعد الشفاء
  choice: صياغة الأمر على أنه تحذير صارم من أن يعلم أحد
  alternative: وبّخهما يسوع؛ أو أمرهما أمرًا مشددًا
  rationale: النص يبرز قوة النهي، لكنه لا يشرح دافع يسوع إلى الكتمان. تحافظ الترجمة على هذه القوة من غير إدخال تفسير لاهوتي للسبب.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُخدم المثنى لأن المخاطَبَين في السياق رجلان، واستُعمل أسلوب التحذير «إيّاكما» لنقل قوة الأمر بصورة طبيعية، مع عدم التصريح في المتن بالمفعول المحذوف في الأصل.
