lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: وبينما هم خارجون
  rationale: ينقل تركيب المضاف المطلق اليوناني بمعناه الزمني، ويجعل δέ انتقالًا سرديًا طبيعيًا من غير إثقال العبارة.
- source_word: ἰδοὺ
  choice: إذا بهم
  rationale: يحفظ عنصر المفاجأة وجذب الانتباه في السياق السردي بصياغة عربية طبيعية.
- source_word: προσήνεγκαν αὐτῷ
  choice: يقدّمون إليه
  rationale: يعكس معنى إحضار الشخص وتقديمه إلى يسوع، كما يحفظ دلالة αὐτῷ الصريحة.
- source_word: ἄνθρωπον
  choice: رجلًا
  rationale: المراد هنا فرد ذكر بالغ، و«رجل» تعبير عربي واضح ودقيق.
- source_word: κωφὸν
  choice: أبكم
  rationale: يمكن أن تعني اللفظة اليونانية أصم أو أبكم بحسب السياق، لكن كلام الرجل في العدد التالي يرجّح العجز عن النطق هنا.
- source_word: δαιμονιζόμενον
  choice: به شيطان
  rationale: صياغة عربية واضحة ومألوفة تنقل حالة التسلط الشيطاني التي يذكرها النص من غير تحديد نظري لكيفيتها.
theological_decisions:
- issue: صياغة حالة التسلط الشيطاني
  choice: به شيطان
  alternative: ممسوسًا بشيطان؛ واقعًا تحت سلطان شيطان
  rationale: يثبت النص وجود بلاء شيطاني حقيقي، لكن اللفظ اليوناني لا يفصّل طبيعة هذا التسلط أو درجته؛ لذلك تحافظ الصياغة المختارة على المعنى من غير إضافة تصور عقدي تفصيلي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «إذا بهم» للمحافظة على حيوية ἰδού دون اللجوء إلى تعبير قديم ثقيل، وحُفظ الغموض المعجمي في κωφός والحذر اللاهوتي في δαιμονίζομαι بواسطة الحواشي.
