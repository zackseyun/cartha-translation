base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: ar
  text: ولمّا رأى الجموع، تحنَّن عليهم، لأنهم كانوا مُرهَقين ومطرَحين[a]، كغنم لا راعي لها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم اللفظين اليونانيين بمعنى «مُضايَقين وعاجزين»؛ فهما يصوّران الجموع أناسًا أضناهم ما أصابهم ولم يعودوا قادرين على تدبير أمرهم.
    reason: بديل معجمي يوضح المجال الدلالي للفظين مع إبقاء الصورة الأقرب في المتن.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ولمّا رأى
  rationale: صيغت العبارة الظرفية بصيغة زمنية عربية طبيعية، مع تمثيل δέ بواو الاستئناف الخفيفة.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: لفظ عربي معاصر وواضح يدل على جماعات الناس المحتشدة، من غير اللجوء إلى تعبير قديم.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: تحنَّن عليهم
  rationale: ينقل معنى الرحمة العميقة والتأثر الوجداني بصياغة عربية موجزة ومألوفة.
- source_word: ὅτι
  choice: لأنهم
  rationale: تُظهر اللام بوضوح أن حال الجموع هو سبب تحننه عليهم.
- source_word: ἐσκυλμένοι
  choice: مُضايَقين
  rationale: يحفظ معنى وقوع الأذى والضغط عليهم، مع تجنب حصر اللفظ في صورة حرفية شديدة مثل السلخ أو التمزيق.
- source_word: καὶ ἐρριμμένοι
  choice: ومطروحين
  rationale: يحافظ على الصورة الأصلية لفعل الإلقاء أو الطرح، بدل تفسيرها مباشرة بالعجز.
- source_word: ὡσεὶ πρόβατα
  choice: كغنم
  rationale: ينقل أداة التشبيه وصورة القطيع بصياغة عربية طبيعية.
- source_word: μὴ ἔχοντα ποιμένα
  choice: لا راعي لها
  rationale: تعبير عربي موجز يحفظ صورة الغنم المحرومة من الراعي، ويطابق «غنم» في التأنيث اللفظي.
theological_decisions:
- issue: لغة تحنن يسوع
  choice: تحنَّن عليهم
  alternative: أشفق عليهم؛ امتلأ قلبه شفقة عليهم
  rationale: يحفظ عمق الرحمة في الفعل اليوناني من غير توسع تفسيري أو صياغة مذهبية.
- issue: وصف حال الجموع
  choice: مُضايَقين ومطروحين
  alternative: مُنهَكين وعاجزين؛ مُتعَبين ومنطرحين
  rationale: يبقي اللفظ الأول دالًا على ما أصابهم من ضغط وأذى، ويحفظ في الثاني صورة الطرح، فلا يحوّل الصورة كلها إلى تفسير مجرد عن العجز.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ التشبيه الرعوي، ووُضعت علامة الحاشية مباشرة بعد الوصف الذي تتعلق به.
