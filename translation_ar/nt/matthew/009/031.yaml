lexical_decisions:
- source_word: δὲ
  choice: أما هما، فـ
  rationale: تفيد انتقالًا مع مقابلة خفيفة لما سبق، إذ أمرهما يسوع بالكتمان ثم فعلا خلاف ذلك؛ وهذه الصياغة عربية طبيعية تربط الحدثين.
- source_word: ἐξελθόντες
  choice: بعدما خرجا
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل هنا على حدث سبق الفعل الرئيس، فحُفظ التتابع الزمني بعبارة واضحة.
- source_word: διεφήμισαν
  choice: أذاعا خبره
  rationale: الفعل يدل على نشر الخبر على نطاق واسع؛ و«أذاعا» موجزة وطبيعية وتحفظ معنى التشهير بالخبر دون إيحاء سلبي لازم.
- source_word: αὐτὸν
  choice: خبره
  rationale: الضمير مفعول مباشر في اليونانية، لكن العربية الطبيعية مع «أذاع» تعبّر عن المقصود بإذاعة خبره، أي نشر الخبر عنه.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: في تلك الناحية كلها
  rationale: γῆ قد تعني الأرض أو البلاد أو الناحية. والسياق المحلي يرجّح «الناحية»، بينما تنقل «كلها» شمول المجال المذكور.
theological_decisions:
- issue: النطاق الجغرافي لكلمة γῆ
  choice: الناحية
  alternative: الأرض أو البلاد
  rationale: السياق يتحدث عن انتشار الخبر محليًا، ولا يقتضي نطاقًا قوميًّا أو عالميًّا؛ وتحفظ الحاشية البديل المعجمي الحقيقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل المثنى في «هما، خرجا، أذاعا» اتساقًا مع الرجلين المذكورين في السياق السابق، وصيغت العبارة بأسلوب طبيعي من غير إزالة المقابلة السردية.
