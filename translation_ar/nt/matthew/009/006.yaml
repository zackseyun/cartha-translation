source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: ar
  text: 'ولكن لكي تعلموا أن لابن الإنسان سلطانًا على الأرض أن يغفر الخطايا»—حينئذ قال للمشلول[a]: «قُم، واحمل فراشك[b]، واذهب إلى بيتك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المفلوج». اللفظ اليوناني صفة مستعملة اسمًا للدلالة على الشخص المصاب بالشلل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سريرك» أو «حصيرك». يمكن أن تدل الكلمة اليونانية κλίνη على سرير أو مضجع أو فراش بسيط.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: ولكن لكي تعلموا
  rationale: تحفظ «لكن» الانتقال التقابلي الخفيف الذي تؤديه δέ، وتنقل «لكي تعلموا» غرض ἵνα بوضوح وطبيعية.
- source_word: ἐξουσίαν ἔχει
  choice: له سلطان
  rationale: «سلطان» يدل على الصلاحية والحق المشروع، لا على مجرد القدرة، وهو ملائم لسياق غفران الخطايا.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المعروف وإيحاؤه المحتمل بدانيال 7، من غير تحويله إلى تفسير.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: هو المقابل العربي المباشر والطبيعي للعبارة في هذا السياق.
- source_word: ἀφιέναι ἁμαρτίας
  choice: أن يغفر الخطايا
  rationale: ينقل المعنى السياقي للفعل ἀφίημι، أي غفر الخطايا ومحوها.
- source_word: τότε λέγει
  choice: حينئذ قال
  rationale: استُعمل الماضي العربي الطبيعي في السرد بدل محاكاة المضارع التاريخي اليوناني على نحو قد يبدو متكلفًا.
- source_word: τῷ παραλυτικῷ
  choice: للمشلول
  rationale: ينقل الصفة المستعملة اسميًا بلفظ عربي واضح وشائع، من غير إضافة «الرجل» غير المذكورة صراحة.
- source_word: Ἐγερθεὶς
  choice: قُم
  rationale: مع أن الصيغة اليونانية اسم فاعل ماضٍ، فإنها تؤدي في تسلسل الأوامر معنى الأمر بالنهوض.
- source_word: ἆρόν
  choice: احمل
  rationale: الفعل هنا يأمره برفع الفراش وأخذه معه؛ و«احمل» موجز وطبيعي.
- source_word: κλίνην
  choice: فراشك
  rationale: «فراش» لفظ واسع يمكن أن يدل على سرير أو مضجع بسيط، ويحفظ عدم التحديد في κλίνη.
- source_word: ὕπαγε
  choice: اذهب
  rationale: ترجمة مباشرة وطبيعية للأمر بالذهاب.
- source_word: εἰς τὸν οἶκόν σου
  choice: إلى بيتك
  rationale: «بيتك» يقابل οἶκόν ويحافظ على الصورة المكانية المباشرة.
theological_decisions:
- issue: اللقب المسيحاني ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: يحفظ «ابن الإنسان» صيغة اللقب وإمكان صلته بدانيال 7، ولا يحسم دلالته بتعبير تفسيري مبسط.
- issue: طبيعة ἐξουσία في غفران الخطايا
  choice: سلطان
  alternative: قدرة أو حق
  rationale: «سلطان» يجمع معنى الصلاحية والحق المشروع، ويحفظ تركيز النص على شرعية غفران الخطايا لا مجرد إمكان فعله.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حُفظ الاقتباس المعلّق الذي يبدأ قبل هذه الآية وينقطع بأمر يسوع للمشلول، واستُعمل الماضي في السرد العربي الطبيعي. تظهر علامتا الحاشيتين [a] و[b] في المتن.
