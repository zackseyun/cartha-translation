base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: ar
  text: وبعد أن ركب قاربًا، عبر وجاء إلى مدينته[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بلدته». تقول اليونانية «مدينته الخاصة»، وقد تشير العبارة إلى المدينة المرتبطة به في هذه المرحلة من السرد، ويُرجَّح أنها كفرناحوم.
    reason: بديل معجمي وتوضيح لاحتمال مرجع العبارة من غير إدخاله في المتن.
lexical_decisions:
- source_word: ἐμβὰς
  choice: بعد أن ركب
  rationale: اسم فاعل ماضٍ يدل على فعل سبق الفعلين الرئيسيين؛ وهذه الصياغة تنقل الترتيب الزمني بلغة عربية طبيعية.
- source_word: πλοῖον
  choice: قاربًا
  rationale: لفظ عام لوسيلة نقل مائية، و«قارب» أنسب من «سفينة» في سياق بحيرة الجليل. وجاء الاسم في اليونانية بلا أداة تعريف.
- source_word: διεπέρασεν
  choice: عبر إلى الضفة الأخرى
  rationale: الفعل يدل على الاجتياز من جانب إلى آخر، ولا سيما عبر الماء؛ وإضافة «إلى الضفة الأخرى» تُظهر الدلالة الاتجاهية المضمَّنة في الفعل.
- source_word: ἦλθεν
  choice: جاء
  rationale: ينقل المعنى الأساسي للفعل ويحافظ على منظور السرد.
- source_word: ἰδίαν πόλιν
  choice: مدينته
  rationale: تؤدي الإضافة معنى الانتماء أو الارتباط الذي يحمله ἰδίαν، من غير أن تحسم أن المقصود مسقط الرأس.
- source_word: Καὶ ... καὶ
  choice: و... و
  rationale: حُفظ الربط السردي البسيط، مع صياغة الجملة على نحو طبيعي بالعربية.
theological_decisions:
- issue: المدينة المشار إليها بعبارة «مدينته»
  choice: الإبقاء على العبارة عامة من غير تسمية المدينة في المتن
  alternative: تحديدها بكفرناحوم، أو تفسيرها عمومًا بأنها مقر إقامته في الجليل
  rationale: النص اليوناني لا يسمّي المدينة. ومع أن السياق يرجّح كفرناحوم، ينبغي ألا يحسم المتن ما تركه المصدر من غير تصريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم تركيب زمني طبيعي للمشاركة اليونانية، مع الحفاظ على تسلسل الأفعال وبقاء هوية المدينة غير مصرَّح بها.
