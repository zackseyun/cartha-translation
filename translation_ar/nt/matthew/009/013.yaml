id: MAT.9.13
reference: Matthew 9:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: ar
  text: 'لكن اذهبوا وتعلَّموا ما معنى هذا: «إني أريد رحمةً لا ذبيحةً».[a] فإني لم آتِ لأدعو الأبرار، بل الخطاة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: مقتبس من هوشع 6:6.
    reason: cross_reference
lexical_decisions:
- source_word: πορευθέντες
  choice: اذهبوا
  rationale: اسم فاعل ماضٍ استُعمل اصطلاحيًا مع فعل الأمر التالي، فتؤدي صيغة الأمر العربية المعنى طبيعيًا وتحافظ على نبرة التوبيخ.
- source_word: μάθετε
  choice: تعلَّموا
  rationale: ينقل الأمر بطلب التعلّم وفهم دلالة النص، مع الحفاظ على الصلة اللفظية المباشرة بالأصل.
- source_word: τί ἐστιν
  choice: ما معنى هذا
  rationale: 'صياغة عربية طبيعية تُظهر أن المطلوب إدراك دلالة الاقتباس؛ ويمكن حرفيًا: «ما هذا».'
- source_word: Ἔλεος
  choice: رحمةً
  rationale: المقابل العربي المألوف الذي يحفظ البعد الأخلاقي والعهدي في اقتباس هوشع.
- source_word: θέλω
  choice: أريد
  rationale: ينقل الإرادة الإلهية مباشرةً وبأسلوب عربي واضح ومهيب، من دون توسيع معنى الفعل.
- source_word: θυσίαν
  choice: ذبيحةً
  rationale: مقابل مباشر ومألوف في سياق العبادة والتقديمات، مع إبقاء المفرد كما في اليونانية.
- source_word: ἦλθον
  choice: لم آتِ
  rationale: ينقل الماضي اليوناني في عبارة تتعلق برسالة يسوع، وهو التعبير العربي الطبيعي.
- source_word: καλέσαι
  choice: لأدعو
  rationale: يحفظ اتساع معنى الدعوة، بما فيه النداء والاستدعاء، من غير تضييقه إلى مجرد دعوة اجتماعية.
- source_word: δικαίους
  choice: الأبرار
  rationale: صفة مستعملة استعمال الاسم، وتحافظ على التقابل الفئوي في النص من غير إضافة تفسير ساخر أو ضمني.
- source_word: ἁμαρτωλούς
  choice: الخطاة
  rationale: المقابل الاصطلاحي المباشر الذي يبقي حدة التقابل الأخلاقي مع «الأبرار».
theological_decisions:
- issue: قوة اقتباس هوشع 6:6
  choice: 'إبقاء المقابلة المباشرة: «أريد رحمةً لا ذبيحةً»'
  alternative: تفسيرها في المتن على أنها رفض مطلق لكل الذبائح، أو تخفيفها إلى مجرد أفضلية ظرفية
  rationale: يحافظ النص على التوتر النبوي وعلى توبيخ ترتيب الأولويات، من غير بناء حكم لاهوتي أوسع مما يقوله الاقتباس.
- issue: المقصود بلفظ «الأبرار»
  choice: 'ترجمة اللفظ كما هو: «الأبرار»'
  alternative: «الذين يظنون أنفسهم أبرارًا» أو «المدّعون البر»
  rationale: قد يوحي السياق بالمفارقة، لكن اليونانية لا تصرّح بها؛ لذلك تُحفظ إمكانية المعنيين ولا يُدرج التفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «لكن» لربط الرد بالسياق، و«ما معنى هذا» بدل الحرفية الخشنة. وُضع دليل الحاشية [a] عقب الاقتباس الذي توثقه.
