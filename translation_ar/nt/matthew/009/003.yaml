  text: 'وإذا ببعض الكتبة يقولون في أنفسهم[a]: «هذا يُجَدِّف».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يقولون فيما بينهم». يمكن أن تدل العبارة اليونانية على حديث النفس أو على كلام خاص متبادل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط سردية بسيطة تصل الآية بما قبلها من غير زيادة تفسيرية.
- source_word: ἰδού
  choice: إذا
  rationale: تؤدي في العربية الفصحى وظيفة التنبيه والمفاجأة السردية بصورة طبيعية، وتحفظ حيوية المشهد من غير استعمال صيغة قديمة ثقيلة مثل «هوذا».
- source_word: τινες τῶν γραμματέων
  choice: بعضُ الكتبة
  rationale: تنقل معنى جماعة غير محددة من الكتبة، وتحافظ على المصطلح الإنجيلي المألوف γραμματεῖς.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: يقولون في أنفسهم
  rationale: تحفظ فعل القول وصورة العبارة اليونانية، مع إبقاء الاحتمال بين حديث النفس والتداول الخفي موضحًا في الحاشية. استُعمل المضارع العربي لاستحضار المشهد السردي.
- source_word: Οὗτος
  choice: هذا
  rationale: ينقل اسم الإشارة مباشرة ويحفظ نبرته المقتضبة، من غير إضافة «الرجل» غير الموجودة صراحة في اليونانية.
- source_word: βλασφημεῖ
  choice: يُجدِّف
  rationale: هو المقابل العربي المباشر للاتهام الديني الذي يدل عليه الفعل، ويحفظ زمن المضارع وقوة الاتهام.
theological_decisions:
- issue: اتهام الكتبة ليسوع
  choice: «هذا يُجدِّف»
  alternative: «إنه ينطق بالتجديف»
  rationale: تحافظ الصياغة على الاتهام المباشر كما يورده النص، من غير تخفيفه أو إضافة تفسير لسبب التجديف أو الحكم على صحة الاتهام.
- issue: طبيعة قول الكتبة
  choice: «يقولون في أنفسهم» مع حاشية توضح الاحتمال
  alternative: «يفكرون» أو «يقولون بعضهم لبعض»
  rationale: العبارة اليونانية يمكن أن تشير إلى حديث داخلي أو كلام خاص؛ لذلك لم يُحسم الغموض لمصلحة أحد الاحتمالين.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعملت «إذا» بوصفها أداة تنبيه سردية طبيعية، و«الكتبة» بوصفها المصطلح الإنجيلي المألوف. وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
