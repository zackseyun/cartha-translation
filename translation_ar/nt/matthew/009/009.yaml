base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: ar
  text: 'وإذ كان يسوع مارًّا من هناك، رأى رجلًا يُدعى متّى جالسًا عند مكان جباية الضرائب، وقال له[a]: «اتبعني». فقام وتبعه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ويقول له»؛ يستعمل اليوناني المضارع الحكائي لإضفاء الحيوية على السرد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: مارًّا من هناك
  rationale: ينقل اسم الفاعل الدال على الحركة الجارية مع ظرف المكان، بصياغة عربية طبيعية لا تزيد على معنى الانتقال من الموضع السابق.
- source_word: ἄνθρωπον
  choice: رجلًا
  rationale: يشير السياق إلى شخص ذكر بعينه، ولذلك فـ«رجلًا» أدق من اللفظ العام «إنسانًا» هنا.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: جالسًا عند مكان جباية الضرائب
  rationale: يصف متّى جالسًا في موضع عمله لتحصيل الضرائب أو الرسوم. ولفظ «مكان» واضح ومحايد، فلا يفترض مبنى إداريًا كبيرًا ولا مقصورة حديثة بعينها.
- source_word: Μαθθαῖον λεγόμενον
  choice: يُدعى متّى
  rationale: ينقل التعبير الذي يعرّف الاسم الذي كان الرجل معروفًا به، وهو أفصح في العربية من الترجمة الحرفية «المقول له متّى».
- source_word: λέγει αὐτῷ
  choice: وقال له
  rationale: صيغ الماضي هي الأسلوب الطبيعي للسرد العربي. أما الأصل اليوناني فيستعمل المضارع الحكائي لإضفاء الحيوية، وقد أُثبت ذلك في الحاشية.
- source_word: Ἀκολούθει μοι
  choice: اتبعني
  rationale: أمر مباشر موجز يحفظ معناه الظاهر وما ينطوي عليه في السياق من دعوة إلى التلمذة، من غير إضافة تفسيرية.
- source_word: ἀναστὰς ἠκολούθησεν αὐτῷ
  choice: فقام وتبعه
  rationale: 'يحفظ تعاقب الاستجابة: قام أولًا ثم تبع يسوع، مع صياغة عربية موجزة وطبيعية.'
theological_decisions:
- issue: طبيعة دعوة يسوع لمتّى
  choice: اتبعني
  alternative: تعال وكن تلميذي
  rationale: السياق يدل على دعوة إلى التلمذة، لكن النص يعبّر عنها بفعل الأمر البسيط «اتبعني». لذلك تُترك دلالتها اللاهوتية ناشئة من السياق بدل إدخال شرح غير مصرح به في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بجمل سردية طبيعية وألفاظ مفهومة للقارئ العام. تجنبت الصياغات الكنسية الاصطلاحية الزائدة، وحُفظ إيجاز دعوة يسوع وسرعة استجابة متّى.
