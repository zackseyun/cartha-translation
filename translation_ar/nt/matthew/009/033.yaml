base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: ar
  text: 'ولمّا أُخرج الشيطان، تكلّم الرجل الأخرس[a]. فتعجّبت الجموع قائلةً: «لم يظهر مثل هذا قطّ في إسرائيل».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرجل الأصم». يمكن أن تعني الكلمة اليونانية «أصم» أو «أخرس»، لكن السياق هنا يرجّح «أخرس» لأن التركيز على أنه تكلّم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: ولمّا أُخرج
  rationale: ينقل اسم الفاعل الماضي المبني للمجهول في التركيب الإضافي المطلق بوصفه حدثًا سابقًا للكلام، بصياغة عربية طبيعية.
- source_word: δαιμονίου
  choice: الشيطان
  rationale: لفظ عربي مألوف في سياقات إخراج الشياطين، ويؤدي معنى الكائن الروحي الشرير المقصود هنا.
- source_word: ἐλάλησεν
  choice: تكلّم
  rationale: ينقل الفعل الماضي البسيط دون إضافة معنى الشروع غير الصريح في اليونانية.
- source_word: ὁ κωφός
  choice: الرجل الأخرس
  rationale: يمكن أن يدل اللفظ على الأصم أو الأخرس، لكن النتيجة المباشرة، وهي أنه تكلّم، ترجّح العجز عن الكلام؛ وأُضيف «الرجل» إيضاحًا طبيعيًا للمرجع من السياق.
- source_word: ἐθαύμασαν
  choice: تعجّبت
  rationale: تعبير عربي واضح عن الدهشة والانبهار اللذين يدل عليهما الفعل.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: يحفظ صيغة الجمع ويأتي طبيعيًا في العربية الفصحى المعاصرة.
- source_word: Οὐδέποτε
  choice: قطّ
  rationale: مع النفي في «لم» يؤدي معنى «أبدًا/لم يحدث من قبل» بإيجاز طبيعي.
- source_word: ἐφάνη
  choice: لم يظهر
  rationale: يحافظ على الدلالة الأساسية للفعل «ظهر»، بدل تحويله إلى المبني للمجهول «شوهد».
- source_word: οὕτως
  choice: مثل هذا
  rationale: ينقل الإشارة إلى حدث من هذا النوع أو على هذه الصورة بصياغة عربية مألوفة.
- source_word: ἐν τῷ Ἰσραήλ
  choice: في إسرائيل
  rationale: مقابل موجز وطبيعي يمكن أن يشير إلى إسرائيل بوصفها الشعب أو المجال الذي وقع فيه الحدث.
theological_decisions:
- issue: المجال الدلالي للفظ κωφός في سياق الشفاء وإخراج الشيطان
  choice: الرجل الأخرس
  alternative: الرجل الأصم
  rationale: اللفظ يحتمل الصمم أو الخرس، لكن قول النص إنه تكلّم يركّز على زوال العجز عن الكلام. تُحفظ الدلالة البديلة في الحاشية دون افتراض عاهة ثانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «الجموع» للمحافظة على الجمع، و«لم يظهر مثل هذا قطّ» للموازنة بين قرب الصياغة من اليونانية وطبيعية التعبير العربي.
