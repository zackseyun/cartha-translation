source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: ar
  text: 'وإذا بهم يُحضرون إليه مشلولًا موضوعًا على سرير. فلما رأى يسوع إيمانهم[a]، قال للمشلول: «تشجَّع يا بُنيّ؛ مغفورة لك خطاياك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يشمل الضمير المشلول والذين أحضروه، أو يشير إلى الذين أحضروه بوصفهم جماعة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بهم
  rationale: تؤدي وظيفة أداة لفت الانتباه وتضفي حيوية على المشهد، بصياغة عربية فصيحة طبيعية دون اللجوء إلى «هوذا» الأشد تقليدية.
- source_word: προσέφερον
  choice: يقدِّمون إليه
  rationale: ينقل المعنى الأساسي للفعل προσφέρω، ويعكس بالمضارع الحكائي الجانب الاستمراري لصيغة الماضي الناقص داخل السرد.
- source_word: παραλυτικὸν
  choice: مشلولًا
  rationale: ترجمة موجزة وواضحة للصفة المستعملة استعمال الاسم، من غير إضافة «رجل» غير المصرح بها في اليونانية.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: مطروحًا على سرير
  rationale: تحافظ على دلالة اسم المفعول التام βεβλημένον، أي كونه موضوعًا أو ملقى على السرير، مع عربية مفهومة.
- source_word: πίστιν
  choice: إيمانهم
  rationale: «إيمان» المقابل الاصطلاحي الطبيعي لـ πίστις، والضمير الجمعي محفوظ دون حسم من يشملهم.
- source_word: Θάρσει
  choice: تشجَّع
  rationale: أمر مباشر للتطمين ومنح الشجاعة، طبيعي في العربية المعاصرة ويحفظ قوة الفعل.
- source_word: τέκνον
  choice: يا بُنيّ
  rationale: صيغة خطاب عربية حانية توافق استعمال τέκνον في مخاطبة هذا الشخص، وتحفظ نبرة المودة دون شرح زائد.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: مغفورة لك خطاياك
  rationale: تحفظ البناء المجهول وترك الفاعل غير مذكور، وتقدم إعلان الغفران بصياغة عربية طبيعية وقريبة من ترتيب اليونانية.
- source_word: ἁμαρτίαι
  choice: خطاياك
  rationale: المقابل العربي المعتاد الذي يحفظ صيغة الجمع ودلالة الذنوب أو الآثام المحددة.
theological_decisions:
- issue: مدلول τὴν πίστιν αὐτῶν
  choice: الإبقاء على الجمع في «إيمانهم» دون تحديد الأشخاص المشمولين به.
  alternative: قصر الإيمان على حاملي المشلول، أو نسبته إلى المشلول وحده.
  rationale: الضمير اليوناني جمع، لكنه لا يحسم هل يشمل المشلول مع مقدِّميه أم يقتصر على المقدِّمين؛ لذلك تُصان مساحة الاحتمال في النص.
- issue: قوة إعلان الغفران والفاعل فيه
  choice: «مغفورة لك خطاياك» بصيغة مجهولة الفاعل.
  alternative: «غفرتُ لك خطاياك» أو «الله غفر لك خطاياك».
  rationale: الفعل اليوناني مبني للمجهول ولا يصرح بالفاعل؛ فالإبقاء على ذلك يتجنب إدخال تفسير لاهوتي غير منطوق به، مع بقاء إعلان يسوع واضحًا في سياقه.
- issue: القيمة الزمنية للفعل ἀφίενται
  choice: 'إعلان حاضر: «مغفورة لك خطاياك».'
  alternative: «قد غُفرت لك خطاياك» بما قد يبرز نتيجة فعل سابق، أو «تُغفر لك خطاياك» بما قد يوحي بعملية جارية.
  rationale: صيغة المضارع اليونانية هنا تلائم إعلان حالة الغفران الحاضرة، والصياغة الاسمية العربية تنقلها دون الإفراط في تحديد زمن وقوع الفعل.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية مهيبة. استُعمل «وإذا بهم» بدل «وهوذا» لطبيعيته المعاصرة، و«يا بُنيّ» لنقل رقة النداء. وُضع مؤشر الحاشية بعد الجملة التي تضم موضع الاحتمال، مع بقاء «إيمانهم» صريحًا في المتن.
