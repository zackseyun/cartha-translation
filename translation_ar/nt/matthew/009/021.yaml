  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: ar
  text: 'لأنها كانت تقول في نفسها: «إن لمستُ ثوبه فحسب، فسأنجو[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سأُشفى» أو «سأتعافى». يستخدم النص اليوناني فعلًا يدل على النجاة أو الإنقاذ، ويمكن أن يدل أيضًا على الشفاء في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: كانت تقول
  rationale: ينقل صيغة الماضي الناقص اليونانية بما تدل عليه من قول داخلي مستمر أو متكرر، بعبارة عربية طبيعية.
- source_word: γὰρ
  choice: لأنها
  rationale: يحفظ القوة التفسيرية للرابط في سياق السرد، وتناسب «لأن» العربية هذا التعليل.
- source_word: ἐν ἑαυτῇ
  choice: في نفسها
  rationale: تعبير عربي فصيح مألوف يدل على الحديث الداخلي ويحفظ صورة الأصل.
- source_word: Ἐὰν μόνον
  choice: إن ... فقط
  rationale: يعبّر عن الشرط مع حصر الأمر في مجرد اللمس، من غير إضافة دلالة غير موجودة في الأصل.
- source_word: ἅψωμαι
  choice: لمستُ
  rationale: الفعل في هذا السياق يعني اللمس، وتأتي صيغة الماضي العربية بعد «إن» طبيعية للدلالة على شرط مستقبل.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ثوبه
  rationale: «الثوب» لفظ واضح واسع الدلالة، فلا يفرط في تحديد نوع الرداء مع إبقاء الإشارة إلى لباسه.
- source_word: σωθήσομαι
  choice: سأخلُص
  rationale: يحفظ المعنى الأساسي الواسع للفعل σῴζω وإمكان صداه الخلاصي، مع بيان معنى الشفاء الذي يقتضيه السياق في الحاشية.
theological_decisions:
- issue: ترجمة σωθήσομαι في سياق شفاء جسدي
  choice: سأخلُص
  alternative: سأُشفى / سأتعافى
  rationale: السياق المباشر يتناول الشفاء، لكن الأصل يستخدم فعلًا أوسع يمكن أن يعني الخلاص أو الإنقاذ أو الشفاء. يحفظ المتن هذا الاتساع والتوتر الدلالي، وتوضح الحاشية المعنى السياقي من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت «كانت تقول في نفسها» لنقل الاستمرار والحديث الداخلي، وحُفظ اتساع فعل الخلاص في المتن مع توضيح دلالة الشفاء في الحاشية.
