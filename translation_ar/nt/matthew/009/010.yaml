  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: ar
  text: وبينما كان متكئًا للطعام[a] في البيت[b]، إذا كثيرون من جُباة الضرائب والخطاة قد جاءوا وكانوا متكئين إلى المائدة مع يسوع وتلاميذه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي، بحسب تعبير أكثر سلاسة: «وبينما كان يتناول الطعام». يدل الأصل بصورة أدق على الاتكاء إلى المائدة، وهي هيئة مألوفة لتناول الطعام آنذاك.'
    reason: lexical_alternative
  - marker: b
    text: يقول الأصل «في البيت» فقط، ولا يحدد هذا العدد وحده صاحب البيت صراحة.
    reason: ambiguity
lexical_decisions:
- source_word: καὶ ἐγένετο αὐτοῦ ἀνακειμένου
  choice: وبينما كان متكئًا للطعام
  rationale: تؤدي العبارة وظيفة الانتقال السردي وتحدد زمن الحدث. و«متكئًا للطعام» تنقل هيئة تناول الطعام التي يدل عليها الفعل، من غير ترجمة حرفية ثقيلة لعبارة «وحدث».
- source_word: ἐν τῇ οἰκίᾳ
  choice: في البيت
  rationale: يحافظ هذا على تعريف البيت في اليونانية من غير تعيين صاحبه، إذ لا يصرح العدد نفسه بهويته.
- source_word: ἰδοὺ
  choice: إذا
  rationale: «إذا» الفجائية أداة عربية طبيعية تسترعي الانتباه إلى المشهد التالي وتحافظ على حيوية أداة التنبيه اليونانية.
- source_word: τελῶναι
  choice: جُباة الضرائب
  rationale: تعبير عربي واضح ومعاصر لمن كانوا يجمعون الضرائب، ويحافظ في السياق على هويتهم الاجتماعية المعروفة.
- source_word: ἁμαρτωλοὶ
  choice: الخطاة
  rationale: ينقل الصفة المستعملة اسمًا ويحافظ على التصنيف الديني والاجتماعي الوارد في النص.
- source_word: ἐλθόντες
  choice: قد جاءوا
  rationale: يحوّل اسم الفاعل اليوناني إلى فعل عربي في تسلسل سردي واضح، مع الإشارة إلى مجيئهم قبل مشاركتهم في المائدة.
- source_word: συνανέκειντο
  choice: واتكأوا إلى المائدة مع
  rationale: ينقل وضع الاتكاء في أثناء الطعام ومعنى مشاركة يسوع وتلاميذه المائدة، بدل اختزال العبارة إلى مجرد الأكل.
- source_word: τῷ Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المعيارية المستقرة للاسم في نصوص العهد الجديد.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: تلاميذه
  rationale: «التلاميذ» المقابل العربي المألوف والدقيق لعلاقة التعلم واتباع المعلم في سياق الأناجيل.
theological_decisions:
- issue: صورة الاتكاء والشركة إلى المائدة
  choice: الإبقاء على «متكئًا للطعام» و«اتكأوا إلى المائدة»
  alternative: كان يأكل؛ تناولوا الطعام
  rationale: يحافظ التعبير على هيئة الطعام التاريخية وعلى صورة المشاركة إلى المائدة ذات الدلالة الاجتماعية في السياق، من غير إضافة تفسير عقائدي.
- issue: هوية صاحب البيت
  choice: «في البيت» من غير تعيين صاحبه
  alternative: في بيته؛ في بيت متّى
  rationale: النص اليوناني في هذا العدد يقول «في البيت» ولا يحدد صراحة صاحبه؛ لذلك تُصان مساحة الإبهام الموجودة في المصدر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «إذا» الفجائية لنقل قوة ἰδού بأسلوب عربي طبيعي، وحُفظت صورة الاتكاء إلى المائدة مع تجنب تعيين صاحب البيت بما يتجاوز نص العدد.
