lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يحافظ على تتابع السرد دون إضافة معنى زمني أو سببي.
- source_word: ἐξῆλθεν
  choice: انتشر
  rationale: المعنى الحرفي هو «خرج»، لكن اقترانه بالخبر يفيد ذيوعه؛ و«انتشر» تعبير عربي طبيعي ينقل الصورة المقصودة دون غموض.
- source_word: ἡ φήμη αὕτη
  choice: هذا الخبر
  rationale: «الخبر» يدل على نبأ متداول من غير الإيحاء بعدم موثوقيته الذي قد تحمله كلمة «إشاعة»، واسم الإشارة يحيل إلى خبر المعجزة المذكورة.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: في تلك الناحية كلها
  rationale: تدل γῆ بحسب السياق على الأرض أو الإقليم أو الناحية. والسياق المحلي يرجح «الناحية»، بينما تنقل «كلها» شمول ὅλην.
