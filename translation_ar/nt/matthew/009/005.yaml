  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: ar
  text: 'فأيّهما أسهل: أن أقول: «مغفورة لك خطاياك»[a]، أم أن أقول: «قم وامشِ»؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد غُفرت لك خطاياك». يمكن فهم المضارع المبني للمجهول في اليونانية على أنه يدل على حالة ناتجة من فعل تمّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: فأيّهما أسهل
  rationale: «أيّهما» تعرض الاختيار بين قولين، والفاء تحفظ الصلة التفسيرية بما سبق، مع صياغة عربية طبيعية.
- source_word: εἰπεῖν
  choice: أن أقول
  rationale: المصدر اليوناني يعني القول ببساطة. أُدخل ضمير المتكلم الذي يقتضيه السياق في العربية، وكُررت العبارة في طرفي المقارنة محافظةً على التوازي.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: مغفورة لك خطاياك
  rationale: صياغة اسمية مبنية للمجهول تعبّر طبيعيًا عن حالة الغفران القائمة، وتحفظ كون «خطاياك» متلقيةً لفعل الغفران من غير تعيين الفاعل.
- source_word: ἁμαρτίαι
  choice: خطاياك
  rationale: «الخطايا» هي المقابل العربي المباشر المعتاد، والضمير المفرد ينقل σου.
- source_word: Ἔγειρε
  choice: قم
  rationale: أمر مباشر طبيعي في سياق شفاء شخص مضطجع، ويؤدي معنى النهوض دون زيادة.
- source_word: καὶ περιπάτει
  choice: وامشِ
  rationale: ينقل الأمر بالمشي بعبارة عربية موجزة وطبيعية، مع إبقاء العطف.
theological_decisions:
- issue: زمن إعلان غفران الخطايا ودلالته
  choice: مغفورة لك خطاياك
  alternative: قد غُفرت لك خطاياك
  rationale: المضارع المبني للمجهول في اليونانية يحتمل دلالة الحالة الناتجة. الصياغة المختارة تحافظ على قوة الإعلان وحال الغفران من غير حسم زائد لتوقيت الفعل أو إدخال تصور لاهوتي غير مصرّح به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «أيّهما» للمفاضلة بين القولين، و«قم وامشِ» لأمر مباشر طبيعي. وُضعت علامة الحاشية مباشرة بعد عبارة الغفران التي تتعلق بها.
