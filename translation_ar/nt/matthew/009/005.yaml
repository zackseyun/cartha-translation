  source_fidelity: ينقل النص بدقة البنية الاستفهامية المقارنة في τί γὰρ ἐστιν εὐκοπώτερον، ويحافظ على رابط γάρ بالفاء السياقية. وترد عبارتا القول على نحو متوازٍ، كما أن «مغفورة لك خطاياك» تحافظ على المبني للمجهول وعلى دلالة الحالة دون تعيين الغافر أو فرض توقيت للفعل. و«قم وامشِ» مقابل دقيق وطبيعي للأمرين Ἔγειρε καὶ περιπάτει.
