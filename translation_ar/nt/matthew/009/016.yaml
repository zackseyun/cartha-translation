  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: ar
  text: لكن لا أحد يضع رقعةً من قماش لم ينكمش بعد على ثوب قديم، لأن الرقعة تُنتزع من الثوب، فيصير التمزق أسوأ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: لكن لا أحد
  rationale: تنقل «لا أحد» النفي العام، وتؤدي «لكن» وظيفة δὲ الانتقالية ذات المقابلة الخفيفة مع السياق السابق.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: يضع رقعةً
  rationale: الفعل يعني يضع أو يطبّق، و«رقعة» هي المقابل الطبيعي لقطعة القماش الموضوعة لإصلاح الثوب، من غير إضافة فعل الخياطة غير المصرح به.
- source_word: ῥάκους ἀγνάφου
  choice: من قماش غير مكمَّش
  rationale: يشير التعبير إلى قماش لم يُعالج بعد معالجة تجعله ينكمش؛ والصياغة توضح الخاصية العملية المقصودة في المثل.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: على ثوب عتيق
  rationale: «ثوب» مقابل عربي عام وطبيعي لـ ἱμάτιον، و«عتيق» يحفظ معنى القِدم في παλαιῷ.
- source_word: αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου
  choice: لأن الرقعة تشدّ الثوب فتنفصل عنه
  rationale: τὸ πλήρωμα هو حرفيًا ما يملأ الموضع، أي الرقعة هنا. وتوضح الصياغة حركة الشد والانفصال التي يدل عليها السياق، مع إبقاء الرقعة مرجع الفعل الأساسي.
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: فيصير التمزق أسوأ
  rationale: تحفظ المقارنة في χεῖρον والنتيجة التي يفيدها γίνεται، بصياغة عربية جارية واضحة.
