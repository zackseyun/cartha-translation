source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: ar
  text: فتضرعوا إذن إلى رب الحصاد أن يبعث عمّالًا إلى حصاده[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يُخرج» العمّال؛ فالفعل اليوناني أقوى من مجرد «يرسل»، لكنه يشير هنا إلى دفع العمّال إلى الحصاد وإيفادهم إليه.
    reason: بديل معجمي يحفظ قوة الفعل ἐκβάλλω.
lexical_decisions:
- source_word: δεήθητε
  choice: تضرعوا
  rationale: الفعل يدل على طلب ملحّ وابتهال؛ و«تضرعوا» يحفظ معنى الصلاة الجادة والإلحاح بصياغة عربية طبيعية وموجزة.
- source_word: οὖν
  choice: إذن
  rationale: تفيد النتيجة المترتبة على القول السابق عن كثرة الحصاد وقلة العمّال، وتحفظ الصلة المنطقية بالسياق.
- source_word: κυρίου
  choice: رب
  rationale: ينقل معنى صاحب السلطان على الحصاد، وهو المقابل العربي المألوف للقب κύριος في هذا السياق.
- source_word: θερισμοῦ
  choice: الحصاد
  rationale: يحفظ صورة الحصاد المجازية كما وردت من غير تفسير زائد.
- source_word: ὅπως
  choice: أن
  rationale: تدخل بصورة طبيعية على مضمون التضرع وغايته في العربية.
- source_word: ἐκβάλῃ
  choice: يبعث
  rationale: السياق يدل على إرسال العمّال إلى الحصاد. «يبعث» تعبير عربي طبيعي للحشد والإرسال، فيما تُذكر قوة الفعل اليوناني في الحاشية.
- source_word: ἐργάτας
  choice: عمّالًا
  rationale: لفظ واضح ومعاصر يدل على الذين يقومون بعمل الحصاد، ويحفظ الصورة من دون شرحها.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: إلى حصاده
  rationale: يحفظ دلالة الحركة نحو الحصاد وضمير الملكية، من غير إضافة «حقل» غير المذكورة صراحة في اليونانية.
theological_decisions:
- issue: هوية «رب الحصاد»
  choice: إبقاء اللقب «رب الحصاد» من غير تعيين مرجعه داخل الترجمة
  alternative: تعيينه بأنه الآب تحديدًا أو يسوع تحديدًا
  rationale: الآية نفسها لا تعيّن المرجع بأكثر من هذا اللقب؛ لذلك يحفظ النص عموم العبارة والتوتر اللاهوتي من غير إدخال تحديد مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «تضرعوا» لإظهار الإلحاح في الصلاة، مع إبقاء استعارة الحصاد والعبارة اللاهوتية غير المعيّنة كما في الأصل.
