  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: ar
  text: 'حينئذ جاء إليه تلاميذ يوحنا قائلين: «لماذا نصوم نحن والفريسيون كثيرًا[a]، وأما تلاميذك فلا يصومون؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «مرات كثيرة»؛ فالكلمة اليونانية πολλά مع فعل «يصوم» تدل على كثرة ممارسة الصوم وتكرارها.'
    reason: بديل معجمي يوضح الدلالة الظرفية للكلمة اليونانية ويحفظ إمكان التعبير عنها بالكثرة أو التكرار.
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية تربط الحدث بما سبقه وتقدّمه بوصفه الخطوة التالية في السرد.
- source_word: προσέρχονται αὐτῷ
  choice: جاء إليه
  rationale: تعبير عربي طبيعي يدل على التوجّه نحو يسوع، مع أن المضارع اليوناني التاريخي يُنقل ماضيًا وفق أسلوب السرد العربي.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: تلاميذ يوحنا
  rationale: إضافة عربية واضحة وطبيعية تحافظ على علاقة التلاميذ بيوحنا.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على صيغة الحال المتزامنة مع فعل المجيء وعلى تدفّق العبارة اليونانية.
- source_word: Διὰ τί
  choice: لماذا
  rationale: المقابل العربي المباشر والطبيعي للسؤال عن السبب.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: نحن والفريسيون
  rationale: إثبات الضمير «نحن» رغم دلالة الفعل عليه يحفظ توكيد الضمير الصريح في اليونانية والمقارنة بين الفريقين.
- source_word: νηστεύομεν
  choice: نصوم
  rationale: المصطلح العربي المألوف والدقيق للامتناع التعبدي عن الطعام، من غير شرح زائد.
- source_word: πολλά
  choice: كثيرًا
  rationale: استعماله هنا حالٌ من الصوم يفيد كثرة الممارسة أو تكرارها؛ و«كثيرًا» تحفظ سعة التعبير اليوناني، مع توضيح دلالة التكرار في الحاشية.
- source_word: οἱ δὲ μαθηταί σου
  choice: وأما تلاميذك
  rationale: «وأما» تبرز المقابلة التي تؤديها δέ بأسلوب عربي فصيح وطبيعي.
- source_word: οὐ νηστεύουσιν
  choice: فلا يصومون
  rationale: المضارع العربي يلائم الحديث عن الممارسة المعتادة، ولا يحصر المعنى في لحظة واحدة.
theological_decisions:
- issue: طبيعة الاعتراض المتعلق بالصوم
  choice: صياغة السؤال بوصفه مقارنة بين عادتين في ممارسة الصوم
  alternative: اعتباره حكمًا صريحًا بأن تلاميذ يسوع أهملوا فريضة واجبة، أو قصره على مناسبة صوم واحدة
  rationale: المضارعان وπολλά يرجّحان الحديث عن نمط متكرر، لكن النص لا يصرّح بحكم شرعي على التلاميذ؛ لذلك تُحفظ حدة السؤال من غير إضافة تفسير عقدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وأما... فلا» لإظهار المقابلة بسلاسة، وحُفظ توكيد «نحن» الوارد صراحة في اليونانية. نُقل المضارع التاريخي في προσέρχονται بصيغة الماضي الملائمة للسرد العربي.
