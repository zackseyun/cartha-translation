  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: ar
  text: وكان يسوع يطوف في جميع المدن والقرى، يعلّم في مجامعهم، ويعلن بشارة الملكوت، ويشفي كل مرض وكل علّة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιῆγεν
  choice: كان يطوف
  rationale: ينقل صيغة الماضي الناقص الدالة على نشاط متواصل أو متكرر، ويحافظ على معنى التنقل في أنحاء المواضع.
- source_word: τὰς πόλεις πάσας καὶ τὰς κώμας
  choice: بجميع المدن والقرى
  rationale: يحفظ التمييز بين المراكز الحضرية والتجمعات الأصغر، مع صياغة عربية طبيعية.
- source_word: διδάσκων
  choice: يعلّم
  rationale: ينقل الفعل المستمر المصاحب لطواف يسوع بصياغة واضحة مباشرة.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: في مجامعهم
  rationale: يحفظ المصطلح التاريخي الديني والضمير الوارد في النص اليوناني.
- source_word: κηρύσσων
  choice: ينادي
  rationale: يعبر عن قوة الإعلان العلني الملازمة لفعل κηρύσσω، من غير قصره على الوعظ الكنسي.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ببشارة الملكوت
  rationale: «البشارة» لفظ عربي واضح ذو دلالة الخبر السار، و«الملكوت» يحفظ المصطلح الكتابي المألوف من غير توسيع تفسيري لعلاقة الإضافة.
- source_word: θεραπεύων
  choice: يشفي
  rationale: هو المقابل الطبيعي الملائم لسياق أعمال الشفاء في الأناجيل.
- source_word: πᾶσαν νόσον
  choice: كل مرض
  rationale: ينقل الدلالة العامة للداء ويحفظ أداة الشمول المكررة.
- source_word: πᾶσαν μαλακίαν
  choice: كل علّة
  rationale: «علّة» تميز اللفظ عن «مرض» وتستوعب معنى السقم أو الوهن الجسدي من غير استعمال لفظ قديم عسير.
theological_decisions:
- issue: دلالة εὐαγγέλιον وصلة الإضافة في «بشارة الملكوت»
  choice: بشارة الملكوت
  alternative: الخبر السار بالملكوت / إنجيل الملكوت
  rationale: تحفظ الصياغة معنى الخبر السار والمصطلح الكتابي، وتبقي علاقة الإضافة على اتساعها بدل حصرها في تفسير واحد.
- issue: شمول خدمة الشفاء في πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: كل مرض وكل علّة
  alternative: كل مرض وكل ضعف
  rationale: يحفظ تكرار «كل» الشمول المصرح به في اليونانية، مع إبقاء التمييز بين الاسمين من غير تحويل العبارة إلى تقرير مذهبي زائد.
translation_notes:
  register: 'عربية فصحى حديثة، واضحة ووقورة. استُخدم «كان يطوف» لإظهار الاستمرار، وأُبقيت الأفعال التابعة متوازية: «يعلّم... وينادي... ويشفي». لا تحتاج الصياغة المختارة إلى حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.'
