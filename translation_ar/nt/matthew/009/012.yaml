  source_fidelity: 'الترجمة أمينة للنص اليوناني: «فلما سمع» تؤدي اسم الفاعل الماضي بظرفية طبيعية، و«قال» لا تضيف معنى «أجاب». و«الأصحاء» و«المرضى» ينقلان المقابلة الطبية الاصطلاحية بين οἱ ἰσχύοντες وοἱ κακῶς ἔχοντες من غير تحويلها إلى تفسير روحي.'
  naturalness: 'الصياغة فصيحة موجزة وطبيعية في العربية المعيارية. الحذف في «بل المرضى» مقبول عربيًا في القول المأثور، إذ يُفهم منه: بل المرضى يحتاجون إليه، ويحاكي إيجاز الأصل.'
