id: MAT.9.12
reference: Matthew 9:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعَ، قَالَ: «لَا يَحْتَاجُ الْأَصِحَّاءُ إِلَى طَبِيبٍ، بَلِ الْمَرْضَى».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: فَلَمَّا سَمِعَ
  rationale: اسم فاعل ماضٍ ذو دلالة زمنية؛ وصيغة «لما سمع» عربية طبيعية تحافظ على التعاقب دون إضافة مفعول غير مصرَّح به في اليونانية.
- source_word: δὲ
  choice: فَـ
  rationale: تفيد الأداة انتقالًا مع مقابلة خفيفة، والفاء تلائم هنا ربط ردّ يسوع بما سمعه في السياق السابق دون مبالغة في معنى الاستدراك.
- source_word: εἶπεν
  choice: قَالَ
  rationale: ترجمة مباشرة لفعل القول، ولا تستبدله بـ«أجاب» لأن الأصل لا يستعمل فعل الإجابة صراحة.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: لَا يَحْتَاجُ
  rationale: تؤدي العبارة الاصطلاحية بوضوح وطبيعية في العربية، مع الاحتفاظ بمعنى انتفاء الحاجة.
- source_word: οἱ ἰσχύοντες
  choice: الْأَصِحَّاءُ
  rationale: مع أن الفعل يدل أصلًا على القوة، فإن المقابلة الطبية الصريحة مع المرضى تجعل «الأصحاء» المقابل الاصطلاحي الأدق والأوضح هنا.
- source_word: ἰατροῦ
  choice: إِلَى طَبِيبٍ
  rationale: «طبيب» المقابل العربي الطبيعي للاسم اليوناني، وحرف الجر «إلى» يلائم تركيب «يحتاج».
- source_word: οἱ κακῶς ἔχοντες
  choice: الْمَرْضَى
  rationale: العبارة اليونانية اصطلاح شائع لمن تكون حالهم الجسدية سيئة؛ و«المرضى» موجزة وواضحة في هذه المقابلة الطبية.
theological_decisions:
- issue: هل يُصرَّح بالتطبيق الروحي للمثل أم تُحفظ صورته الطبية؟
  choice: 'الإبقاء على القول في صورته الطبية المباشرة: الأصحاء والطبيب والمرضى.'
  alternative: تفسير العبارة داخل الترجمة بالإشارة صراحة إلى الخطاة أو المرض الروحي.
  rationale: السياق يبين التطبيق المتعلق بالخطاة، لكن ألفاظ الآية نفسها طبية؛ لذا يحفظ النص الصورة والتوتر اللاهوتي ويترك للسياق بيان التطبيق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، ببناء موجز يحاكي طابع القول المأثور. لم تُضف كلمة «ذلك» بعد «سمع» لأن المفعول محذوف في الأصل ويمكن فهمه من السياق.
