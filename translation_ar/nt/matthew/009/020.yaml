  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: ar
  text: وإذا بامرأةٍ كانت تنزف منذ اثنتي عشرة سنة، اقتربت من خلفه ولمست هدب[a][b] ثوبه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شرّابة» أو «حاشية»؛ فقد تدل الكلمة اليونانية على هدب الثوب أو طرفه، وربما تشمل الشرّابة المرتبطة باللباس اليهودي.
    reason: lexical_alternative
  - marker: b
    text: انظر سفر العدد 15:38 والتثنية 22:12 للاطلاع على خلفية الأهداب أو الشرّابات في شريعة إسرائيل.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: وإذا بامرأةٍ
  rationale: صياغة عربية طبيعية تحفظ وظيفة أداة لفت الانتباه والمفاجأة في السرد، من غير اللجوء إلى تعبير تراثي ثقيل مثل «وهوذا».
- source_word: γυνὴ
  choice: امرأةٍ
  rationale: نكرة كما في اليونانية، ولا يقتضي السياق مزيدًا من التحديد.
- source_word: αἱμορροοῦσα
  choice: كانت تنزف
  rationale: ينقل اسم الفاعل معنى النزف المستمر بوصفه حالة مزمنة، بلغة واضحة غير متكلفة.
- source_word: δώδεκα ἔτη
  choice: منذ اثنتي عشرة سنة
  rationale: تعبير عربي طبيعي عن امتداد الحالة من الماضي إلى زمن الحدث.
- source_word: προσελθοῦσα ὄπισθεν
  choice: اقتربت من خلفه
  rationale: يحفظ حركة الاقتراب وكونها جاءت من الجهة الخلفية، مع إظهار الضمير الذي يفهم من السياق.
- source_word: ἥψατο
  choice: لمست
  rationale: المعنى السياقي هو اللمس، ولا داعي لتقويته إلى الإمساك أو القبض.
- source_word: τοῦ κρασπέδου
  choice: هدب
  rationale: «هدب» يسع معنى طرف الثوب أو حاشيته ذات الخيوط، ولا يحسم وحده هل المقصود شرّابة بعينها أم مجرد الحافة.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ثوبه
  rationale: «الثوب» لفظ عام ملائم لـἱμάτιον، ويتجنب التخصيص الزائد إلى عباءة أو رداء من طراز معين.
theological_decisions:
- issue: الدلالة اليهودية المحتملة لكلمة κράσπεδον بوصفها هدبًا أو شرّابة مرتبطة بأطراف الثياب
  choice: إيراد «هدب» في المتن مع بيان الاحتمالات والخلفية في الحواشي
  alternative: ترجمتها «شرّابة» لإبراز الصلة المحتملة بشريعة أهداب الثياب، أو «حاشية» لإبراز طرف الثوب فحسب
  rationale: اللفظ اليوناني يحتمل الحافة أو الهدب وربما الشرّابة، لكن الآية لا تصرّح بالدلالة الرمزية. لذلك تحافظ «هدب» على الاحتمال من غير فرض تفسير محدد، وتوضح الحاشية الخلفية الممكنة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «وإذا بامرأة» للحفاظ على حيوية الالتفات السردي، و«كانت تنزف» لبيان استمرار الحالة، مع إبقاء دلالة «هدب» غير محسومة وإسناد البدائل والخلفية الثقافية إلى الحواشي.
