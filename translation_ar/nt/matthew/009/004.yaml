  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: ar
  text: 'وإذ كان يسوع عالمًا بأفكارهم، قال: «لماذا تفكرون في أمور شريرة في قلوبكم؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: عالمًا
  rationale: اسم الفاعل يدل هنا على علم يسوع بما يدور في داخلهم؛ و«عالمًا» موجزة وطبيعية وتحفظ دلالة المعرفة من غير توسع عقائدي.
- source_word: ἐνθυμήσεις
  choice: أفكارهم
  rationale: تدل الكلمة على الأفكار أو المداولات الباطنية، و«أفكارهم» أوضح تعبير عربي معاصر في هذا السياق.
- source_word: Ἱνατί
  choice: لماذا
  rationale: أداة استفهام عن السبب أو الدافع، ويقابلها طبيعيًا «لماذا».
- source_word: ἐνθυμεῖσθε
  choice: تفكرون
  rationale: الفعل المضارع يدل على نشاط فكري باطني جارٍ، و«تفكرون» تحافظ على الصلة اللفظية والدلالية بـ«أفكارهم».
- source_word: πονηρὰ
  choice: في الشر
  rationale: الصفة المحايدة المجموعة مستعملة استعمال الاسم، وتشير إلى ما هو شرير في تفكيرهم. صياغة «تفكرون في الشر» عربية طبيعية ولا تضيف اسمًا غير مصرّح به مثل «أمور».
- source_word: καρδίαις
  choice: قلوبكم
  rationale: تحفظ الاستعارة الأصلية للقلب بوصفه باطن الإنسان وموضع الفكر والقصد، بدل اختزالها في «العقول».
theological_decisions:
- issue: علم يسوع بالأفكار غير المنطوقة
  choice: وكان يسوع عالمًا بأفكارهم
  alternative: ولما أدرك يسوع أفكارهم
  rationale: يثبت النص علم يسوع بأفكارهم الباطنية من غير أن يشرح كيفية هذا العلم أو يحوله إلى تقرير عقائدي أوسع؛ لذلك حُفظ التوتر اللاهوتي كما هو.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت صورة «القلوب» الكتابية، واختير تركيب طبيعي غير متكلف للسؤال.
