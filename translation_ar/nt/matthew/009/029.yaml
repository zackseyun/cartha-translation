  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: ar
  text: 'حينئذٍ لمس أعينهما قائلًا: «ليكن لكما بحسب إيمانكما[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليحدث لكما بحسب ثقتكما». ويمكن أن تدل الكلمة اليونانية المترجمة «إيمان» أيضًا على الثقة، وفي بعض السياقات على الأمانة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: ظرف زمني ينقل السرد إلى الحدث التالي، و«حينئذٍ» عربية فصيحة طبيعية.
- source_word: ἥψατο
  choice: لمس
  rationale: يدل الفعل هنا على اللمس الجسدي المباشر في سياق الشفاء.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: أعينهما
  rationale: ضمير الجمع اليوناني يعود في السياق إلى رجلين؛ والتثنية العربية أدق وأطبع.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على الصلة الحالية بين اللمس والقول كما في اسم الفاعل اليوناني.
- source_word: Κατὰ
  choice: بحسب
  rationale: تفيد المطابقة أو المقياس، من غير تحميل العبارة معنى سببيًا أقوى مما يقتضيه الأصل.
- source_word: τὴν πίστιν ὑμῶν
  choice: إيمانكما
  rationale: «الإيمان» المقابل المعتاد لـ πίστις، ويشير هنا إلى ثقة الرجلين بقدرة يسوع؛ واستُعملت التثنية وفق السياق.
- source_word: γενηθήτω
  choice: ليكن
  rationale: صيغة موجزة تحفظ قوة الأمر الغائب في التصريح الأدائي، ولا تحوله إلى مجرد تمنٍّ.
- source_word: ὑμῖν
  choice: لكما
  rationale: الداتيف يفيد هنا ما يحدث لهما أو لمصلحتهما، والتثنية العربية توافق المخاطبَين.
theological_decisions:
- issue: دلالة πίστις في قول عن الشفاء
  choice: إيمانكما
  alternative: ثقتكما
  rationale: «الإيمان» يحفظ المصطلح الكتابي الواسع، بينما يوضح السياق أن المقصود يتضمن ثقتهما بقدرة يسوع. أُبقي البديل في الحاشية من غير حصر معنى اللفظة في أحد وجوهها.
- issue: قوة γενηθήτω وعلاقة النتيجة بالإيمان
  choice: ليكن لكما بحسب إيمانكما
  alternative: ليحدث لكما على قدر ثقتكما
  rationale: تحفظ الصياغة قوة الأمر ومعنى المطابقة أو المقياس في κατά، من غير الجزم بأن الإيمان علة مستقلة للشفاء.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت صيغ التثنية لأن المخاطبَين رجلان، مع الحفاظ على إيجاز القول اليوناني وغموض العلاقة الدقيقة التي تفيدها «بحسب».
