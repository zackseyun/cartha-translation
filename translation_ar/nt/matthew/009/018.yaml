source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: ar
  text: 'وبينما كان يكلّمهم بهذه الأمور، إذا برئيسٍ جاء وسجد له، قائلًا: «لقد ماتت ابنتي للتو؛ لكن تعالَ وضع يدك عليها فتحيا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: إذا بـ
  rationale: صيغة عربية طبيعية تنبّه إلى ظهور الحدث المفاجئ في سياق السرد، من غير ثقل «هوذا».
- source_word: ἄρχων εἷς
  choice: أحد الرؤساء
  rationale: يحافظ على عدم تحديد نوع الرئاسة في النص اليوناني، ولا يستورد من الروايات الموازية وصفًا أكثر تخصيصًا.
- source_word: προσεκύνει
  choice: سجد له
  rationale: ينقل فعل الانحناء أو السجود أمام شخص بوضوح، مع إبقاء الدلالة المقصودة في السياق مفتوحة دون تفسير لاهوتي زائد.
- source_word: ἄρτι ἐτελεύτησεν
  choice: ماتت الآن
  rationale: يعكس وقوع الموت للتو بصياغة عربية مباشرة وطبيعية.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: ضع يدك عليها
  rationale: ترجمة مباشرة واضحة لطلب وضع اليد.
- source_word: ζήσεται
  choice: فتحيا
  rationale: ينقل صيغة المستقبل بثقة الأب في النتيجة، ويربطها طبيعيًا بالفعل السابق.
theological_decisions:
- issue: دلالة السجود في προσεκύνει
  choice: سجد له
  alternative: انحنى أمامه
  rationale: «سجد له» هو المقابل العربي المألوف للفعل، لكنه لا يضيف في ذاته حكمًا تفسيريًا على ما إذا كان الفعل عبادة أم إكرامًا؛ السياق هو الذي يبقي هذا التوتر الدلالي.
- issue: هوية ἄρχων
  choice: أحد الرؤساء
  alternative: رئيس المجمع
  rationale: متى لا يذكر هنا «المجمع»، ولذلك تُحفظ الصياغة العامة ولا تُستكمل من مرقس أو لوقا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، بسرد طبيعي. استُخدمت «إذا بـ» لتنبيه القارئ إلى الحدث الجديد، وحُفظت بساطة كلام الأب وإلحاحه.
