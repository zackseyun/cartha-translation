source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «هل يستطيع رفاق العريس أن يحزنوا ما دام العريس معهم؟ ولكن ستأتي أيام يُؤخذ فيها العريس منهم، وحينئذٍ يصومون».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: أصحاب العريس
  rationale: العبارة حرفيًا «أبناء حجرة العرس»، وهي تعبير اصطلاحي عن رفاق العريس والمشاركين الملازمين له في الاحتفال. «أصحاب العريس» عربية واضحة وطبيعية وتحفظ طبيعة الدور الاجتماعي دون نقل حرفي غامض.
- source_word: πενθεῖν
  choice: أن يحزنوا
  rationale: الفعل يدل على الحزن والحداد، وهو هنا يقابل الصوم. «يحزنوا» واضح في العربية المعاصرة ولا يحصر المعنى في طقس جنائزي صريح.
- source_word: ἐφ’ ὅσον
  choice: ما دام
  rationale: تعبير زمني طبيعي ينقل معنى استمرار الحال طوال مدة وجود العريس معهم.
- source_word: νυμφίος
  choice: العريس
  rationale: اللفظ العربي المألوف والواضح للرجل في سياق العرس، مع إبقاء الصورة المجازية من غير تفسير لاهوتي زائد.
- source_word: ἀπαρθῇ
  choice: يُؤخذ ... من بينهم
  rationale: يحفظ صيغة المبني للمجهول وإيحاء الإبعاد أو الانتزاع، بدل تحويلها إلى مجرد رحيل اختياري.
- source_word: νηστεύσουσιν
  choice: يصومون
  rationale: مقابل مباشر وطبيعي لصيغة المستقبل اليونانية.
- source_word: Μὴ δύνανται ... ;
  choice: ألا يستطيع ...؟
  rationale: يصوغ السؤال البلاغي الذي يتوقع جوابًا بالنفي صياغة عربية طبيعية.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: ولكن ستأتي أيام
  rationale: ينقل التعبير المستقبلي والتباين الذي تفيده δέ بوضوح وسلاسة.
theological_decisions:
- issue: الدلالة المسيحانية المحتملة لصورة العريس
  choice: الإبقاء على «العريس» صورةً مجازية من غير التصريح بأن يسوع هو العريس المسيحاني.
  alternative: إضافة تفسير يعرّف يسوع صراحة بأنه العريس المسيحاني.
  rationale: النص نفسه يترك هوية العريس تُفهم من السياق ولا يشرح كامل دلالتها اللاهوتية؛ لذا ينبغي إبقاء الصورة والتوتر الدلالي كما هما.
- issue: إيحاء المبني للمجهول في ἀπαρθῇ
  choice: «يُؤخذ ... من بينهم» مع الحفاظ على المبني للمجهول.
  alternative: «يرحل عنهم» أو تعيين الفاعل الذي يأخذه.
  rationale: الصياغة اليونانية قد توحي بإبعاد قسري وبما سيحدث ليسوع، لكنها لا تسمّي الفاعل؛ فالترجمة لا تحسم ما تركه النص غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أصحاب العريس» بدل النقل الحرفي الغامض، مع إبقاء السؤال البلاغي وصورة العريس والمبني للمجهول في فعل الأخذ.
