  terminology: «العريس» و«يصومون» مصطلحان مناسبان. «رفاق العريس» ينقل الاصطلاح اليوناني بوصفه جماعة مرتبطة بالعريس في احتفال العرس، من غير ادعاء حصر دقيق لدورهم. «يُؤخذ العريس منهم» يحافظ على المبني للمجهول وعلى الإيحاء بالإبعاد دون تسمية الفاعل.
