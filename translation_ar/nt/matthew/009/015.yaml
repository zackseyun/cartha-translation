  source_fidelity: 'المعنى العام محفوظ، بما في ذلك صورة العريس، والتباين بين الحزن والصوم، والمبني للمجهول في «يُؤخذ». لكن «ألا يستطيع ... أن يحزنوا؟» لا ينقل اتجاه السؤال البلاغي اليوناني على نحو سليم؛ إذ يوحي في العربية بإثبات القدرة، بينما السؤال اليوناني يتوقع جوابًا بالنفي: لا يستطيعون الحزن ما دام العريس معهم.'
