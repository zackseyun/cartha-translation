source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: ar
  text: 'فقال له يسوع: «إن أردت أن تكون كاملًا[a]، فاذهب وبِع ممتلكاتك وأعطِها للفقراء، فيكون لك كنز في السماوات؛ ثم تعال واتبعني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تامًّا» أو «ناضجًا». يمكن للكلمة اليونانية أن تدل على الكمال أو التمام أو النضج.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: فعل قول سردي مألوف، ينقل المعنى بلا تحديد زائد لطريقة الكلام.
- source_word: τέλειος
  choice: كاملًا
  rationale: «كامل» يحفظ مجال اللفظة اليونانية الذي يشمل الكمال والتمام والنضج، ويلائم سياق التكريس غير المنقسم دون أن يحصرها في مفهوم العصمة من الخطأ.
- source_word: τὰ ὑπάρχοντα
  choice: ممتلكاتك
  rationale: يدل التعبير على ما يملكه الإنسان من أموال وأعيان، و«ممتلكاتك» موجزة وطبيعية.
- source_word: δὸς πτωχοῖς
  choice: أعطِ الفقراء
  rationale: الصفة اليونانية مستعملة استعمال الاسم، أي الفقراء، والصياغة العربية مباشرة وواضحة.
- source_word: θησαυρὸν ἐν οὐρανοῖς
  choice: كنز في السماوات
  rationale: يحافظ الجمع «السماوات» على صيغة الأصل اليوناني، وهو تعبير مفهوم وطبيعي في العربية الكتابية المعاصرة.
- source_word: δεῦρο ἀκολούθει μοι
  choice: ثم تعال واتبعني
  rationale: «تعال» تنقل النداء، و«ثم» توضح تتابع الأوامر في السياق، و«اتبعني» تحفظ لغة التلمذة المباشرة.
theological_decisions:
- issue: دلالة τέλειος في علاقتها بالتلمذة
  choice: كاملًا
  alternative: تامًّا؛ ناضجًا
  rationale: تحفظ «كاملًا» مطلب التمام والتكريس الكامل، من غير أن تفرض على النص تفسيرًا مذهبيًا عن كمال أخلاقي منزّه من كل خطيئة. وتُذكر البدائل المعجمية في الحاشية للمحافظة على سعة الدلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت أفعال الأمر المباشرة، وحُفظ جمع «السماوات» موافقةً للأصل، ووُضعت علامة الحاشية عند اللفظة التي تشرحها.
