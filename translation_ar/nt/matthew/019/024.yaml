  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: ar
  text: 'وأقول لكم أيضًا: إن مرور جمل عبر ثقب إبرة أيسر من دخول غني إلى ملكوت الله.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: وأقول لكم أيضًا
  rationale: تنقل «أيضًا» معنى التكرار في πάλιν، وتؤدي الواو وظيفة δέ بوصفها رابطًا خفيفًا، مع الحفاظ على صيغة الخطاب المباشر.
- source_word: εὐκοπώτερόν ἐστιν
  choice: أيسر
  rationale: صيغة تفضيل عربية واضحة ودقيقة للمقارنة التي يعبر عنها النص اليوناني.
- source_word: κάμηλον
  choice: جمل
  rationale: النص اليوناني المثبت يقرأ κάμηλον، أي «جمل»، لا «حبل»، وتحافظ الترجمة على الصورة البلاغية الصادمة.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: من ثقب إبرة
  rationale: τρύπημα هو الثقب أو الفتحة، وῥαφίς إبرة خياطة؛ وهذه صياغة عربية طبيعية لا تفترض تفسيرًا مجازيًا إضافيًا.
- source_word: εἰσελθεῖν
  choice: مرور / دخول
  rationale: استُعمل «مرور» مع الجمل والثقب لسلامة العربية، و«دخول» مع الغني والملكوت، مع أن الفعل اليوناني نفسه يحكم طرفي المقارنة.
- source_word: ἢ πλούσιον
  choice: من دخول غني
  rationale: تحافظ «غني» على المفرد المذكر في πλούσιον وعلى المقارنة المباشرة دون زيادة تفسيرية.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: إلى ملكوت الله
  rationale: تنقل εἰς اتجاه الدخول، وتحافظ «ملكوت الله» على العبارة المركزية في النص وعلى اتساق المصطلح الكتابي.
theological_decisions:
- issue: تفسير صورة الجمل وثقب الإبرة
  choice: 'الإبقاء على المقارنة المفرطة في قوتها كما وردت: جمل وثقب إبرة حقيقية في الصورة البلاغية.'
  alternative: اعتبار «ثقب الإبرة» اسم بوابة مزعومة، أو استبدال «الجمل» بـ«الحبل» لتخفيف حدة الصورة.
  rationale: لا يسند النص اليوناني هنا تفسير البوابة، وهو يقرأ «جمل». والإبقاء على الصورة دون تلطيف يحفظ التوتر المقصود في السياق ولا يستبق قول العدد التالي عن إمكان الأمر عند الله.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. اختير التركيب الاسمي «مرور... دخول...» ليجري طرفا المقارنة بسلاسة، مع إبقاء الصورة الحسية والتعبير «ملكوت الله» دون شرح مذهبي.
