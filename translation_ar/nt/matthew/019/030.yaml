  text: But many who are first will be last[a], and the last first.
translation:
  language: ar
  text: لكن كثيرون من الأوّلين سيكونون آخِرين، ومن الآخِرين أوّلين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أكثر حرفية: «لكن كثيرون أوّلون سيكونون آخِرين، وآخِرون أوّلين». والعبارة اليونانية شديدة الإيجاز وصياغتها مَثَلية.'
    reason: بديل لفظي يحافظ على التركيب اليوناني المقتضب
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرين
  rationale: الصفة مستعملة استعمال الاسم وتشير إلى جماعة واسعة غير محددة؛ وجاءت منصوبة لأنها اسم «سيكونون» مقدَّم.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا ذا مسحة استدراكية في سياق الكلام السابق عن الجزاء والمكانة.
- source_word: ἔσονται
  choice: سيكونون
  rationale: ينقل صيغة المستقبل من فعل الكينونة بعبارة عربية فصيحة وطبيعية.
- source_word: πρῶτοι
  choice: من الأوّلين / أوّلين
  rationale: يحفظ معنى الترتيب أو المنزلة من غير قصره على السبق الزمني.
- source_word: ἔσχατοι
  choice: آخِرين / من الآخِرين
  rationale: يحفظ التضاد المباشر مع «الأوّلين» في الترتيب أو المنزلة، دون تفسيره بمعنى «الأدنى».
- source_word: πολλοὶ ... πρῶτοι ἔσχατοι
  choice: كثيرين من الأوّلين سيكونون آخِرين
  rationale: إدخال «من» يوضح بالعربية أن المقصود كثيرون ضمن فئة الأوّلين، مع إبقاء العبارة موجزة وقريبة من تركيب اليونانية.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: ومن الآخِرين أوّلين
  rationale: حُذف فعل الكينونة في الشطر الثاني كما حُذف في اليونانية، وهو مفهوم من الشطر الأول، حفاظًا على الإيجاز والتوازن المثليين.
theological_decisions:
- issue: طبيعة انقلاب المراتب في القول
  choice: الإبقاء على القول عامًا في انقلاب الترتيب أو المنزلة
  alternative: تخصيصه بالدخول إلى الملكوت، أو بمكافآت التلاميذ، أو بالمنزلة الاجتماعية وحدها
  rationale: الآية نفسها لا تحصر مجال هذا الانقلاب، لذلك لا تضيف الترجمة تحديدًا عقائديًا لا يصرّح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت صياغة موجزة تحافظ على المقابلة بين «الأوّلين» و«الآخِرين»، مع ضبط «آخِرين» بكسر الخاء لتجنب التباسها بـ«الآخرين» بمعنى الغير.
