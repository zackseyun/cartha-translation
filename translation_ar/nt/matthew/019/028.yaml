  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «الحق أقول لكم: أنتم الذين تبعتموني ستجلسون أنتم أيضًا، في التجديد[a]، على اثني عشر عرشًا، حين يجلس ابن الإنسان على عرش مجده، وتدينون أسباط إسرائيل الاثني عشر[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «في إعادة الخلق»، أو «في العالم الجديد»، أو «في الولادة الجديدة». والمقصود هنا، على الأرجح، التجديد الآتي المرتبط بملك ابن الإنسان، لا الولادة الجديدة للفرد.'
    reason: lexical_alternative
  - marker: b
    text: قد يحمل «تدينون» أيضًا معنى «تحكمون» أو «تمارسون السلطان».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: الحق
  rationale: صيغة عربية طبيعية راسخة لتقديم قول مؤكد ذي سلطان، وتحفظ قوة الاستهلال دون إبقاء اللفظة السامية منقولة صوتيًا.
- source_word: ἀκολουθήσαντές μοι
  choice: الذين تبعتموني
  rationale: تحدد المخاطَبين بفعل اتباعهم ليسوع، مع إبقاء ضمير المتكلم صريحًا.
- source_word: παλιγγενεσίᾳ
  choice: التجديد
  rationale: يحفظ معنى التجدد أو النشأة الجديدة دون إضافة «كل الأشياء» غير المذكورة صراحة في اليونانية، ويُلائم السياق الأخروي.
- source_word: ὅταν καθίσῃ
  choice: متى جلس
  rationale: ينقل جملة زمنية تشير إلى حدث مستقبل، وتستعمل العربية الفعل الماضي بعد «متى» استعمالًا طبيعيًا للدلالة على تحققه المستقبلي.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة الاصطلاحية المعروفة للقب، وتحفظ أصداءه الدانيالية والمسيانية.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: على عرش مجده
  rationale: ترجمة قريبة من تركيب الإضافة اليوناني وتحفظ النبرة الرفيعة.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: ستجلسون أنتم أيضًا
  rationale: تنقل المستقبل، وتحفظ التوكيد في الضمير المنفصل ومعنى «أيضًا».
- source_word: ἐπὶ δώδεκα θρόνους
  choice: على اثني عشر عرشًا
  rationale: ترجمة مكانية مباشرة وطبيعية.
- source_word: κρίνοντες
  choice: تدينون
  rationale: تنقل المعنى القضائي المباشر للفعل، مع إبقاء احتمال اشتماله على الحكم أو ممارسة السلطة في الحاشية.
- source_word: φυλὰς τοῦ Ἰσραήλ
  choice: أسباط إسرائيل الاثني عشر
  rationale: تعبير عربي كتابي واضح ودقيق عن التقسيمات القبلية لإسرائيل.
theological_decisions:
- issue: دلالة παλιγγενεσία في هذا السياق
  choice: التجديد الأخروي المرتبط بجلوس ابن الإنسان على العرش
  alternative: الولادة الجديدة الفردية، أو العالم الجديد، أو الدهر الجديد
  rationale: السياق المباشر يتناول الجلوس المستقبلي على العرش والدينونة، لا تجدد الفرد؛ لكن المتن يكتفي بـ«التجديد» كي لا يفرض تصورًا أخرويًا تفصيليًا.
- issue: مدى دلالة κρίνοντες
  choice: تدينون
  alternative: تحكمون أو تتولون السلطان
  rationale: المعنى القضائي هو الأقرب مباشرة، مع إمكان أن يتسع الفعل في هذا السياق للحكم والسلطان؛ لذلك حُفظ اللفظ المباشر ونُبه إلى الاتساع في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على ترتيب المعاني اليوناني قدر الإمكان، مع وضع «في التجديد» بين فواصل لتقليل احتمال ربطها حصريًا بفعل الاتباع، وإبقاء علاقتها بوعد الجلوس والسياق الزمني مفتوحة.
