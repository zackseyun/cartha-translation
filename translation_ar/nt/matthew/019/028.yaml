  to: 'فقال لهم يسوع: «الحق أقول لكم: أنتم الذين تبعتموني ستجلسون أنتم أيضًا، في التجديد[a]، على اثني عشر عرشًا، حين يجلس ابن الإنسان على عرش مجده، وتدينون أسباط إسرائيل الاثني عشر[b].»'
  rationale: أُعيد ترتيب العناصر الزمنية ترتيبًا عربيًا أوضح مع الحفاظ على جميع عناصر اليونانية وعلى عدم حسم تفاصيل التصور الأخروي. وُضعت «في التجديد» بعد فعل الوعد لتظهر إطارًا لجلوس المخاطَبين، ثم صيغت جملة ὅταν بالفعل المضارع بعد «حين» للدلالة الطبيعية على المستقبل. لم تُضف الحواشي تفسيرًا مذهبيًا، وحُفظت بدائل المصطلحات الأساسية.
