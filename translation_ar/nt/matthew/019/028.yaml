  terminology: «ابن الإنسان»، و«عرش مجده»، و«أسباط إسرائيل الاثنا عشر» اختيارات سليمة ومستقرة. «التجديد» يحفظ اتساع παλιγγενεσία ولا يضيف «كل الأشياء». و«تدينون» يقابل κρίνοντες مباشرة، مع بقاء اتساع الحكم/السلطان مذكورًا في الحاشية.
