  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: ar
  text: 'فأجاب: «أما قرأتم[a] أن الذي خلق[b] منذ البدء جعلهم ذكرًا وأنثى؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألم تقرأوا…؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الخالق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: يؤدي المعنى الطبيعي للتركيب اليوناني ذي الفعل المساعد واسم الفاعل من غير تكرار ثقيل مثل «أجاب وقال».
- source_word: Οὐκ ἀνέγνωτε
  choice: أما قرأتم
  rationale: استفهام إنكاري يحتج بما سبق أن قرأه المخاطبون في الكتاب؛ وهذه صياغة عربية طبيعية تحافظ على قوة التحدي.
- source_word: ὁ κτίσας
  choice: الذي خلق
  rationale: يحافظ على صورة اسم الفاعل المعرّف في اليونانية، ولا يحوله إلى لقب صريح مثل «الخالق».
- source_word: ἀπ’ ἀρχῆς
  choice: منذ البدء
  rationale: تعبير عربي واضح يستبقي صدى لغة الخلق في سفر التكوين، ويصل العبارة بفعل الخلق كما يسمح ترتيب اليونانية.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ذكرًا وأنثى
  rationale: نقل مباشر للزوج اللفظي في اليونانية وللإحالة إلى تكوين 1:27، من غير تحويله إلى «رجل وامرأة».
- source_word: ἐποίησεν αὐτούς
  choice: جعلهم
  rationale: يميّز بين ἐποίησεν وκτίσας، ويتجنب تكرار «خلق»، مع الإبقاء على ضمير الجمع الموجود في اليونانية.
theological_decisions:
- issue: صياغة عبارة الخلق وصلتها بتكوين 1:27
  choice: ذكرًا وأنثى
  alternative: رجلًا وامرأة
  rationale: الاختيار ينقل ألفاظ النص اليوناني وإحالته الخَلقية كما هي، من غير إضافة نتائج مذهبية أو استبدال الوصف الخَلقي بتعبير اجتماعي.
- issue: تعلّق عبارة ἀπ’ ἀρχῆς
  choice: ربط «منذ البدء» بفعل «خلق» وفق ترتيب اليونانية
  alternative: 'تقديمها على جملة المضمون: «أن منذ البدء الذي خلق...»'
  rationale: الصياغة المختارة طبيعية في العربية وأقرب إلى ترتيب المصدر، مع الإقرار بأن العبارة تحمل أيضًا صدى بداية الخلق ولا ينبغي تحميلها تحديدًا لاهوتيًا زائدًا.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدمت «أما قرأتم» للاستفهام الإنكاري، و«الذي خلق» بدل تحويل الوصف إلى لقب، و«ذكرًا وأنثى» للمحافظة على صدى نص التكوين.
