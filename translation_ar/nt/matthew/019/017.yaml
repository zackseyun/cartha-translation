source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: ar
  text: 'فقال له[a]: «لماذا تسألني عمّا هو صالح؟ واحدٌ هو الصالح[b]. ولكن إن كنت تريد أن تدخل إلى الحياة، فاحفظ الوصايا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات، وكذلك الروايتان الموازيتان: «لماذا تدعوني صالحًا؟ ليس أحد صالحًا إلا واحد، وهو الله». أمّا نص متّى في SBLGNT فيقرأ: «لماذا تسألني عمّا هو صالح؟ واحدٌ هو الصالح».'
    reason: textual_variant
  - marker: b
    text: 'يمكن أن تُصاغ العبارة بأسلوب عربي أكثر سلاسة: «ليس صالحًا إلا واحد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: لماذا تسألني عمّا هو صالح؟
  rationale: تُفهم صيغة τοῦ ἀγαθοῦ المحايدة هنا على أنها تشير إلى ما هو صالح، لا إلى شخص مذكّر؛ وبذلك تُحفَظ صياغة متّى ولا تُوافَق قسرًا مع الروايتين الموازيتين في مرقس ولوقا.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: واحدٌ هو الصالح
  rationale: تحافظ العبارة على البنية البارزة في اليونانية، حيث «واحد» خبر عددي و«الصالح» صفة مستعملة استعمال الاسم، كما تُبقي الصلة اللفظية بالسؤال السابق عن الصالح.
- source_word: εἰ δὲ θέλεις
  choice: ولكن إن كنت تريد
  rationale: «تريد» تعبير عربي طبيعي عن الرغبة أو القصد، و«ولكن» تنقل الدلالة الاستدراكية الخفيفة للأداة δέ.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: أن تدخل إلى الحياة
  rationale: يحافظ التعبير على حركة الدخول التي تفيدها εἰς، ولا يضيف وصف «الأبدية» غير المذكور صراحة في هذه العبارة.
- source_word: τήρησον τὰς ἐντολάς
  choice: فاحفظ الوصايا
  rationale: «احفظ» هو التعبير العربي المألوف عن الالتزام بالوصايا والعمل بها، و«الوصايا» تنقل ثقل ἐντολάς في هذا السياق الديني.
theological_decisions:
- issue: علاقة قول يسوع بصلاح الله وبالمسيحولوجيا
  choice: تُرجمت صياغة متّى كسؤال عمّا هو صالح، ثم جواب «واحدٌ هو الصالح»، من غير جعلها نفيًا لصلاح يسوع ولا إدخال اسم الله في المتن حيث لا يرد في نص SBLGNT.
  alternative: 'مواءمة العبارة مع مرقس ولوقا: «لماذا تدعوني صالحًا؟ ليس أحد صالحًا إلا واحد، وهو الله».'
  rationale: يختلف نص متّى هنا عن صيغة الروايتين الموازيتين. والأمانة للنص اليوناني تقتضي إبقاء هذا الاختلاف والغموض اللاهوتي المصاحب له من غير تسوية أو استنتاج عقائدي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقيت صياغة «واحدٌ هو الصالح» ذات مسحة مقصودة من البروز الأسلوبي لتجسيد تركيب اليونانية، مع تقديم البديل الأكثر سلاسة في الحاشية. وُضع رمز الحاشية [b] بعد العبارة التي تشرحها، لا بعد «الحياة» كما ظهر على نحو غير متسق في طبقة الاستشارة الإنجليزية.
