base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ar
  text: 'قال له: «أيّ وصايا؟» فقال يسوع: «هذه: لا تقتل، لا تزنِ، لا تسرق، لا تشهد زورًا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: أيّ وصايا؟
  rationale: الصفة الاستفهامية مؤنثة الجمع، وموصوفها المفهوم من السياق هو «الوصايا»؛ أُظهر في العربية للوضوح الطبيعي.
- source_word: Οὐ φονεύσεις
  choice: لا تقتل
  rationale: ينقل النهي عن القتل المتعمد بصيغة عربية مألوفة ومباشرة، من غير توسيعه ليشمل كل إزهاق للحياة.
- source_word: Οὐ μοιχεύσεις
  choice: لا تزنِ
  rationale: «μοιχεύω» يدل على الزنى، وصيغة النهي العربية موجزة وموافقة لأسلوب الوصايا.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: لا تشهد زورًا
  rationale: تعبير عربي طبيعي ودقيق عن الإدلاء بشهادة كاذبة.
theological_decisions:
- issue: وظيفة أداة التعريف Τὸ قبل سلسلة الوصايا
  choice: 'هذه:'
  alternative: حذفها والبدء مباشرةً بـ«لا تقتل...»
  rationale: أُبقي أثر أداة التعريف اليونانية بوصفها مقدمةً للقائمة، من غير تحميلها معنى لاهوتيًا زائدًا؛ و«هذه» تعود طبيعيًا إلى الوصايا المفهومة من السؤال.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، مع استعمال أسلوب الوصايا المألوف. حُوّل المضارع السردي λέγει إلى الماضي «قال» وفق السرد العربي الطبيعي، وحُفظ ترتيب الوصايا في النص اليوناني.
