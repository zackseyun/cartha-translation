base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: ar
  text: فلما سمع الشاب هذا الكلام[a]، انصرف حزينًا[b]، لأنه كانت له ممتلكات كثيرة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا القول». والمقصود في اليونانية كلام يسوع السابق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وهو مغموم». تصف الصيغة اليونانية حاله في أثناء انصرافه.'
    reason: lexical_alternative
  - marker: c
    text: 'تُترجم تقليديًا: «أموال كثيرة». واللفظ اليوناني يدل على الممتلكات أو الأملاك، مع التشديد هنا على كثرتها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: فلما سمع
  rationale: تؤدي اسم الفاعل الماضي بوظيفة زمنية طبيعية في العربية، وتوضح تعاقب السماع ثم الانصراف.
- source_word: δὲ
  choice: فـ
  rationale: تفيد الانتقال والتعقيب في السياق، وهي أيسر عربيًا من إثقال الجملة بأداة استدراك صريحة.
- source_word: ὁ νεανίσκος
  choice: الشاب
  rationale: ينقل معنى اللفظة نفسها من غير استيراد وصف «الرئيس» من رواية موازية.
- source_word: τὸν λόγον
  choice: هذا الكلام
  rationale: يشير في السياق إلى قول يسوع السابق؛ و«الكلام» عربي طبيعي يحفظ الإحالة من غير تضييقها إلى كلمة مفردة.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: فعل سردي عربي واضح يدل على انصرافه وذهابه.
- source_word: λυπούμενος
  choice: حزينًا
  rationale: حال تبين الهيئة الملازمة لانصرافه، وتحفظ معنى الأسى الذي يفيده اسم الفاعل اليوناني.
- source_word: ἦν γὰρ ἔχων
  choice: لأنه كان يملك
  rationale: ينقل الحالة المستمرة التي يفيدها التركيب اليوناني بصياغة عربية طبيعية.
- source_word: κτήματα πολλά
  choice: ممتلكات كثيرة
  rationale: يحفظ دلالة الجمع والكمية في πολλά، ولا يحولها إلى معنى العظمة أو القيمة.
theological_decisions:
- issue: هل يضاف وصف «رئيس» اعتمادًا على الروايات الموازية؟
  choice: الشاب
  alternative: الشاب الرئيس
  rationale: نص متى هنا يسميه شابًا فقط؛ وإضافة «الرئيس» توفيق مع لوقا لا ترجمة مباشرة لهذا النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فلما» للسرد الزمني، و«مضى حزينًا» لصياغة موجزة طبيعية، مع إبقاء جميع علامات الحواشي في مواضعها في المتن.
