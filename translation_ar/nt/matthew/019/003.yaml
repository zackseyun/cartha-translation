base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: ar
  text: 'وجاء إليه فريسيون يمتحنونه، وقالوا: «هل يحلّ للرجل أن يطلّق زوجته لأي سبب[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأي علة» أو «على أي أساس». تشير العبارة اليونانية إلى سؤال قانوني واسع عن الأسباب التي تبيح الطلاق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: جاء إليه
  rationale: ينقل معنى الاقتراب من شخص بعبارة عربية طبيعية واضحة.
- source_word: πειράζοντες
  choice: يمتحنونه
  rationale: يحفظ معنى الاختبار أو الامتحان، ويترك للسياق أن يدل على القصد العدائي من غير تضييقه إلى الإغراء بالخطيئة.
- source_word: ἔξεστιν
  choice: هل يحلّ
  rationale: صياغة عربية مألوفة لسؤال قانوني أو ديني عما هو مباح.
- source_word: ἀνθρώπῳ
  choice: للرجل
  rationale: السياق يحدد المقصود بأنه رجل له زوجة، فتحفظ الترجمة الدلالة الجنسية للنص.
- source_word: ἀπολῦσαι
  choice: أن يطلّق
  rationale: الفعل في السياق الزوجي مصطلح للطلاق، لا لمجرد الإرسال أو الصرف.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: زوجته
  rationale: γυνή تعني هنا الزوجة بوضوح بسبب ضمير الملكية وسياق الطلاق.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: لأي سبب
  rationale: ينقل اتساع السؤال عن مسوغات الطلاق بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: صياغة سؤال الطلاق بما يحفظ خلفيته القانونية في القرن الأول من غير فرض موقف طائفي
  choice: هل يحلّ للرجل أن يطلّق زوجته لأي سبب؟
  alternative: هل يجوز للزوج أن يطلّق زوجته لأي علة؟
  rationale: يبقى النص سؤالًا واسعًا عن مشروعية أسباب الطلاق ولا يستبق جواب يسوع أو يحسم الخلاف اللاهوتي اللاحق.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة. استُعمل «فريسيون» من غير أداة تعريف موافقةً لعدم وجودها في اليونانية، و«هل يحلّ» للحفاظ على طابع الجدل القانوني الديني.
