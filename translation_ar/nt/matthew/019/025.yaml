  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعَ التلاميذُ هذا، دُهِشوا جدًّا وقالوا: «فمَن يستطيعُ إذًا أن يَخلُص؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: فَلَمَّا سَمِعَ ... هذا
  rationale: نُقلت صيغة اسم الفاعل الماضي إلى جملة زمنية طبيعية في العربية، وأُضيف اسم الإشارة «هذا» من السياق إشارةً إلى كلام يسوع السابق.
- source_word: δὲ
  choice: الفاء في «فَلَمَّا»
  rationale: تؤدي الفاء وظيفة الانتقال والاستمرار التي تحملها δέ، من غير إثقال السرد بأداة استدراك صريحة.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: هو المقابل العربي المألوف والدقيق لتلاميذ يسوع في سياق الأناجيل.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: دُهِشوا جدًّا
  rationale: «دُهِشوا» تعبّر بوضوح عن شدة المفاجأة والانفعال، و«جدًّا» تحفظ قوة σφόδρα. ولا تفرض العربية هنا إبراز الاستمرار الذي في صيغة الماضي الناقص اليونانية.
- source_word: λέγοντες
  choice: وقالوا
  rationale: تحويل اسم الفاعل المصاحب إلى فعل معطوف هو الأسلوب الطبيعي في السرد العربي.
- source_word: Τίς ἄρα
  choice: فمَن ... إذًا
  rationale: «مَن» للاستفهام عن الشخص، والفاء مع «إذًا» تنقلان الاستنتاج والدهشة الناشئين من قول يسوع السابق.
- source_word: δύναται
  choice: يستطيع
  rationale: ينقل معنى القدرة بصياغة عربية واضحة وحديثة.
- source_word: σωθῆναι
  choice: أن يَخلُص
  rationale: صيغة «يَخلُص» راسخة في العربية الكتابية، وتحفظ معنى الخلاص والصيغة اللازمة المقابلة للمبني للمجهول اليوناني من غير تحديد آليته.
theological_decisions:
- issue: مدلول σωθῆναι في السياق
  choice: أن يَخلُص
  alternative: أن يُنقَذ
  rationale: السياق المتعلق بدخول الملكوت يشير إلى الخلاص بمعناه الشامل، لا إلى نجاة زمنية فحسب. وتحفظ العبارة الثقل اللاهوتي من غير إدخال تفسير طائفي لكيفية الخلاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ترتيب طبيعي لأدوات الاستنتاج في السؤال. ضُبطت «يَخلُص» جزئيًا لتمييزها من «يُخلِص».
