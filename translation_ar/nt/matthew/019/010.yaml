base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: ar
  text: 'قال له تلاميذه: «إن كان هذا هو حال الرجل مع زوجته، فليس من المفيد الزواج»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان هذا هو وضع الرجل مع زوجته». العبارة اليونانية موجزة، ويمكن أيضًا ترجمة «حال» بـ«أمر» أو «وضع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: فقال له
  rationale: المضارع اليوناني هنا مضارع تاريخي في سياق سردي، فنُقل بالماضي العربي الطبيعي، وأُضيفت الفاء لربط جواب التلاميذ بما سبقه.
- source_word: μαθηταί
  choice: تلاميذه
  rationale: «التلاميذ» هو المصطلح الإنجيلي المألوف، والضمير يوضح أنهم تلاميذ يسوع كما يدل السياق.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: إن كان هذا هو حال
  rationale: صياغة عربية واضحة تحفظ الشرط والإشارة إلى التعليم السابق؛ و«حال» تلائم معنى αἰτία هنا بوصفها الحالة أو الوضع، لا العلة السببية الصارمة.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: الرجل مع زوجته
  rationale: السياق زواجي، لذلك تعني γυνή «زوجة»، ويحفظ «الرجل» التحديد الجنسي الموجود في النص. أُثبت ضمير الملكية لأن العربية الطبيعية تعبّر به عن العلاقة الزوجية في هذا التركيب.
- source_word: οὐ συμφέρει
  choice: فلا جدوى
  rationale: تؤدي معنى انعدام النفع أو المصلحة بعبارة عربية معاصرة موجزة، من غير تحويل القول إلى حكم صريح بأن الزواج غير جائز.
- source_word: γαμῆσαι
  choice: من الزواج
  rationale: مصدر عربي طبيعي يؤدي معنى المصدر اليوناني «أن يتزوج» في تركيب «لا جدوى من».
theological_decisions:
- issue: الدلالة الجندرية في ἀνθρώπου ... γυναικός
  choice: الرجل مع زوجته
  alternative: الشخص مع شريك حياته
  rationale: يحفظ الاختيار الإطار الذكوري-الأنثوي الصريح في السياق اليوناني المتعلق بالزواج، ولا يستبدله بتعبير محايد جندريًا.
- issue: قوة οὐ συμφέρει في تقييم الزواج
  choice: فلا جدوى من الزواج
  alternative: فلا يُنصح بالزواج
  rationale: «لا جدوى» تحفظ معنى النفع والمصلحة في الفعل اليوناني، بينما «لا يُنصح» قد تضيف معنى المشورة أو التوصية غير المصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «حال» لتجنب المعنى السببي الغالب لكلمة «علة»، و«لا جدوى من الزواج» لنقل معنى المنفعة بصياغة طبيعية. وُضع مؤشر الحاشية بعد الاقتباس لأنه يعلّق على العبارة المقتبسة كلها.
