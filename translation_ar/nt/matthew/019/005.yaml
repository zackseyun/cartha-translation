source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: ar
  text: 'وقال: «لذلك يترك الرجل أباه وأمه ويلتصق بزوجته[a]، ويصير الاثنان جسدًا واحدًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتحد بزوجته» أو «يتعلق بزوجته». يدل الفعل اليوناني على ارتباط وثيق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: لذلك
  rationale: تعبير سببي طبيعي وموجز يحفظ معنى الاستدلال في الاقتباس.
- source_word: καταλείψει
  choice: يترك
  rationale: ينقل صيغة المستقبل في سياق القول المأثور بصياغة عربية طبيعية، إذ يدل المضارع هنا على ما سيحدث أو القاعدة المقررة.
- source_word: ἄνθρωπος
  choice: الرجل
  rationale: السياق الزوجي وذكر «زوجته» يحددان أن المراد هو الشريك الذكر، لا الإنسان على وجه العموم.
- source_word: κολληθήσεται
  choice: يلتصق بزوجته
  rationale: يحفظ دلالة الارتباط الوثيق التي يحملها الفعل اليوناني، مع إبقاء البدائل الممكنة في الحاشية.
- source_word: γυναικὶ αὐτοῦ
  choice: بزوجته
  rationale: معنى «الزوجة» هو الذي يقتضيه سياق الزواج.
- source_word: οἱ δύο
  choice: الاثنان
  rationale: يحفظ التصريح بالعدد الموجود في النص اليوناني.
- source_word: εἰς σάρκα μίαν
  choice: جسدًا واحدًا
  rationale: صياغة عربية راسخة ودقيقة لتعبير الاتحاد الزوجي، مع تمثيل معنى النتيجة بواسطة «يصير».
theological_decisions:
- issue: اللغة المحددة للجنس في اقتباس عن الزواج
  choice: الرجل ... زوجته
  alternative: الإنسان ... قرينه
  rationale: يحفظ التكوين الذكري الأنثوي الصريح في الاقتباس ولا يحوله إلى عبارة عامة محايدة الجنس.
- issue: صياغة تعبير الاتحاد الزوجي
  choice: يصير الاثنان جسدًا واحدًا
  alternative: يكون الاثنان جسدًا واحدًا
  rationale: «يصير» تمثل بوضوح معنى الانتقال أو النتيجة في ἔσονται ... εἰς من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على إيقاع الاقتباس الكتابي وتجنب الصياغة القديمة مثل «من أجل هذا» و«يلتصق بامرأته».
