source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: ar
  text: وكلُّ من ترك بيوتًا أو إخوةً أو أخواتٍ أو أبًا أو أمًّا أو زوجةً[a] أو أولادًا أو حقولًا من أجل اسمي، سينال مئة ضعف ما ترك، ويرث الحياة الأبدية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تحذف بعض الشواهد النصية عبارة «أو زوجة».
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: كلُّ من
  rationale: 'تعبير عربي طبيعي يحفظ المعنى التوزيعي العام: كل شخص ينطبق عليه الوصف.'
- source_word: ἀφῆκεν
  choice: ترك
  rationale: ينقل الفعل الماضي من غير إضافة معنى الهجر القاسي الذي قد توحي به ألفاظ مثل «نبذ» أو «تخلّى».
- source_word: οἰκίας
  choice: بيوتًا
  rationale: يحفظ الجمع والدلالة الملموسة على المسكن أو الملك ضمن قائمة الأقارب والممتلكات.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: إخوةً أو أخواتٍ
  rationale: يحافظ على التفريق الصريح في اليونانية بين الذكور والإناث.
- source_word: γυναῖκα
  choice: زوجةً
  rationale: في سياق تعداد علاقات الأسرة، المقصود الطبيعي هو الزوجة لا المرأة بوجه عام.
- source_word: τέκνα
  choice: أولادًا
  rationale: لفظ عربي واضح وشامل للذرية في سياق الأسرة.
- source_word: ἀγρούς
  choice: حقولًا
  rationale: ينقل الدلالة الملموسة على الأراضي الزراعية من غير تخصيصها بمزارع كاملة أو بصيغة ملكية غير مصرّح بها.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: من أجل اسمي
  rationale: يحفظ صورة «الاسم» وما تدل عليه من شخص يسوع وسلطانه والانتماء إليه، بدل اختزالها إلى «من أجلي».
- source_word: ἑκατονταπλασίονα
  choice: مئة ضعف
  rationale: صياغة عربية موجزة ومألوفة تنقل مقدار الوعد المضاعف مئة مرة.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: يرث الحياة الأبدية
  rationale: يحفظ استعارة الميراث وصياغة المصدر مباشرة.
theological_decisions:
- issue: دلالة «الاسم» في سبب الترك
  choice: من أجل اسمي
  alternative: من أجلي
  rationale: إبقاء لفظ «اسمي» يصون التعبير الأصلي وثقله المتعلق بشخص يسوع وسلطانه، من غير شرح عقائدي زائد.
- issue: معنى γυνή في قائمة الأسرة
  choice: زوجة
  alternative: امرأة
  rationale: السياق الأسري يجعل «زوجة» القراءة الدلالية الأنسب، مع التنبيه إلى الاختلاف النصي في وجود العبارة نفسها.
- issue: طبيعة الوعد في ἑκατονταπλασίονα
  choice: سينال مئة ضعف
  alternative: سينال مئة مرة قدر ما ترك
  rationale: يحفظ التعبير المكثف في الأصل من غير أن يحدد كيفية تحقق الوعد أو يحصره في تعويض مادي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت قائمة متوازنة بأداة «أو»، وحُفظت عبارتا «من أجل اسمي» و«يرث الحياة الأبدية» لقيمتهما التصويرية واللاهوتية في النص الأصلي.
