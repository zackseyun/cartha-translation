review_pass:
  verdict: revise
  source_fidelity: 'النص العربي ينقل عناصر الآية الأساسية بأمانة: الشمول في «كل من»، وفعل الترك، وقائمة الأقارب والممتلكات، و«من أجل اسمي»، ووعد المئة والميراث والحياة الأبدية. لكن «سينال مئة ضعف» ناقصة المفعول في العربية وقد توحي بمقدار مجرد؛ والأوضح والأقرب إلى ἑκατονταπλασίονα هو «سينال مئة ضعف ما ترك» أو «سينال مئة ضعف».'
  naturalness: الأسلوب فصيح وواضح عمومًا. «مئة ضعف ما ترك» أكمل وأطبع من «مئة ضعف» وحدها، مع بقاء العبارة موجزة. كما أن «أبًا أو أمًّا» و«زوجة» و«أولادًا» مناسبة للسياق.
  terminology: '«زوجة» مناسبة لـ γυνή في هذه القائمة، و«من أجل اسمي» يحفظ لفظ «الاسم»، و«يرث الحياة الأبدية» ترجمة دقيقة وطبيعية. الحاشية الحالية مضللة من حيث نطاق الشواهد: عبارة «أو زوجة» موجودة في النص اليوناني المعتمد هنا، لكن لها حذف في بعض الشواهد النصية، ولذلك ينبغي أن تصاغ بعبارة محايدة دقيقة لا تدعي قدم المخطوطات المحذوفة على نحو غير مؤهل.'
  issues:
