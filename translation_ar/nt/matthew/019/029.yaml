    rationale: «سينال مئة ضعف» يمكن أن تُفهم كقياس بلا متعلق. إضافة «ما ترك» توضح مقدار الاستقبال من غير تحديد طبيعة العوض أو تحويل الوعد إلى تعويض مادي حصري.
  - severity: low
