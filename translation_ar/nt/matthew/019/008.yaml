  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: ar
  text: 'قال لهم: «بسبب قساوة قلوبكم سمح لكم موسى أن تطلِّقوا[a] زوجاتكم، لكن منذ البدء لم يكن الأمر هكذا».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أن تصرفوا»؛ والمقصود في هذا السياق أن تطلِّقوا زوجاتكم.'
    reason: lexical_alternative
  - marker: b
    text: إشارة إلى الحال الأصلي في سياق حديث يسوع عن الخليقة.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي في السرد العربي الطبيعي.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: بسبب قساوة قلوبكم
  rationale: تنقل العبارة معنى السبب وتحافظ على الصورة الكتابية الملموسة للقلب القاسي.
- source_word: ἐπέτρεψεν
  choice: سمح
  rationale: يدل الفعل على الإذن لا على الأمر أو الاستحسان، و«سمح» واضحة وطبيعية في العربية المعاصرة.
- source_word: ἀπολῦσαι
  choice: أن تطلِّقوا
  rationale: المعنى السياقي في النقاش عن الزواج هو الطلاق، مع بقاء المعنى الحرفي في الحاشية.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: زوجاتكم
  rationale: السياق الزوجي يحدد معنى γυνή هنا بأنه الزوجة لا المرأة عمومًا.
- source_word: ἀπ’ ἀρχῆς
  choice: منذ البدء
  rationale: صياغة عربية مألوفة تحفظ الإحالة السياقية إلى بدء الخليقة.
- source_word: γέγονεν οὕτως
  choice: لم يكن الأمر هكذا
  rationale: تنقل الحالة الواقعة التي يفيدها التام اليوناني بصياغة عربية طبيعية، من دون توسيع تفسيري.
theological_decisions:
- issue: هل يُصاغ فعل موسى أمرًا أم سماحًا استثنائيًا؟
  choice: سمح لكم موسى
  alternative: أمركم موسى
  rationale: ἐπέτρεψεν يفيد الإذن، لا الوصية الإيجابية؛ وبذلك يُحفظ التوتر بين التنظيم الموسوي والحال منذ البدء.
- issue: هل تُصرَّح دلالة البدء بأنها تصميم الله؟
  choice: ولكن لم يكن الأمر هكذا منذ البدء
  alternative: ولكن لم يكن هذا تصميم الله منذ البدء
  rationale: تُحفظ عبارة اليونانية وإحالتها إلى سياق الخليقة من غير إدخال شرح عقائدي في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة؛ استُخدم «قساوة قلوبكم» حفاظًا على التعبير الكتابي، و«تطلِّقوا» لإظهار المعنى القانوني المقصود في السياق.
