base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: ar
  text: «أَكْرِمْ أباك وأمك، وأَحْبِبْ قريبك كنفسك».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أكثر حرفية: «أَكْرِمْ أباك وأمك، وستحب قريبك كنفسك».'
    reason: بديل لفظي يحفظ صيغة المستقبل الخبري في Ἀγαπήσεις.
lexical_decisions:
- source_word: Τίμα
  choice: أَكْرِمْ
  rationale: ينقل فعل τιμάω معنى إظهار الإكرام الواجب، ويوافق الصياغة العربية المألوفة للوصية أكثر من «احترم» التي قد تقتصر على التقدير الباطني.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: أباك وأمك
  rationale: مع أن اليونانية تستعمل أداة التعريف بلا ضمير ملكية صريح، فإن سياق الخطاب وصيغة الوصية يقتضيان في العربية «أباك وأمك».
- source_word: Ἀγαπήσεις
  choice: أَحْبِبْ
  rationale: الصيغة اليونانية مستقبل خبري في اقتباس وصية من التوراة، لكنها تؤدي قوة الأمر؛ لذلك صيغت أمرًا عربيًا واضحًا، مع حفظ الصياغة الحرفية البديلة في الحاشية.
- source_word: τὸν πλησίον σου
  choice: قريبك
  rationale: تعني πλησίον الشخص القريب في دائرة العلاقة الإنسانية، و«قريبك» صياغة عربية كتابية موجزة لا تحصر المعنى في المجاور مكانيًا.
- source_word: ὡς σεαυτόν
  choice: كنفسك
  rationale: تنقل المقارنة بإيجاز وتحافظ على صياغة النص من غير إضافة فعل تفسيري غير مصرّح به.
theological_decisions:
- issue: اختلاف صيغة الفعلين في اقتباس الوصايا
  choice: 'صياغة الفعلين بصيغة الأمر: «أَكْرِمْ ... وأَحْبِبْ»'
  alternative: «أَكْرِمْ أباك وأمك، وستحب قريبك كنفسك»
  rationale: يجمع الأصل بين أمر صريح ومستقبل خبري ذي قوة تشريعية بسبب أسلوب اقتباس التوراة. توحيدهما بصيغة الأمر أوضح في العربية الحديثة ويحفظ القوة الإلزامية، بينما تُذكر البنية الأكثر حرفية في الحاشية دون تفسيرها على أنها وعد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «قريبك» بمعناه الأخلاقي الواسع، ووُضعت الحركات الضرورية على فعلي الأمر لتسهيل القراءة.
