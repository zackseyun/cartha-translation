language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: ar
  text: فإن هناك خِصيانًا وُلدوا هكذا من أرحام أمهاتهم، وهناك خِصيانًا جعلهم الناس خِصيانًا، وهناك خِصيانًا جعلوا أنفسهم خِصيانًا من أجل ملكوت السماوات[a]. فمن استطاع أن يقبل هذا فليقبله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «خصوا أنفسهم». ويفهمها كثير من المفسرين مجازيًا، أي إنهم اختاروا الامتناع عن الزواج من أجل ملكوت السماوات.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «من استطاع أن يتسع لهذا فليتسع له».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: خِصيانًا
  rationale: ينقل الاسم اليوناني بمعناه المباشر ويحافظ على تكراره في الفئات الثلاث، من غير استبداله بتفسير مثل «عُزّاب».
- source_word: ἐκ κοιλίας μητρὸς
  choice: من بطون أمهاتهم
  rationale: يحافظ على صورة الرحم الواردة في الأصل بصياغة عربية واضحة وطبيعية في سياق الجمع.
- source_word: ἐγεννήθησαν οὕτως
  choice: وُلدوا هكذا
  rationale: صياغة عربية معاصرة ومباشرة تنقل الإحالة إلى الحالة المذكورة.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: جعلهم الناس خِصيانًا
  rationale: يحافظ على الصلة اللفظية بين الاسم والفعل، ولا يضيّق العبارة إلى الوصف التشريحي وحده.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: جعلوا أنفسهم خِصيانًا
  rationale: ينقل العبارة الاستفزازية في الأصل من غير حسم ما إذا كانت حرفية أم مجازية عن الامتناع عن الزواج.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: من أجل ملكوت السماوات
  rationale: يعبر عن الدافع أو الغاية، ويحافظ على تعبير متى «ملكوت السماوات».
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: فمن استطاع أن يقبل هذا فليقبله
  rationale: ينقل المعنى الاصطلاحي للفعل χωρέω هنا بوصفه قبولًا لتعليم صعب، مع الحفاظ على قوة الأمر.
theological_decisions:
- issue: هل تعني εὐνούχισαν ἑαυτοὺς إخصاءً حرفيًا أم امتناعًا مجازيًا عن الزواج؟
  choice: الإبقاء على الصياغة الحرفية «جعلوا أنفسهم خِصيانًا» في المتن.
  alternative: «خصوا أنفسهم» أو «اختاروا العزوبة/امتنعوا عن الزواج».
  rationale: لا تحسم الآية نفسها إن كان الكلام حرفيًا أو مبالغة أو مجازًا، ولذلك يحافظ المتن على التوتر، وتوضح الحاشية الفهم المجازي الشائع.
- issue: دلالة χωρεῖν في الخاتمة
  choice: «يقبل هذا»
  alternative: «يتسع لهذا» أو «يتلقى هذا».
  rationale: «يقبل» أوضح في العربية الحديثة للدلالة على استيعاب التعليم الصعب وقبوله، بينما تحفظ الحاشية الصورة الأقرب إلى اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «خِصيان» لأنه اللفظ العربي المباشر المقابل، مع تكراره للمحافظة على البنية البلاغية اليونانية. أُبقيت العبارة الثالثة غير محسومة تفسيريًا، ووُضع البديل في الحاشية.
