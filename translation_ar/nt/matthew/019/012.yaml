- from: فلأن هناك خِصيانًا وُلدوا هكذا من بطون أمهاتهم، وهناك خِصيانًا جعلهم الناس خِصيانًا، وهناك خِصيانًا جعلوا أنفسهم خِصيانًا من أجل ملكوت السماوات[a]. فمن استطاع أن يقبل هذا فليقبله[b].
  to: فإن هناك خِصيانًا وُلدوا هكذا من أرحام أمهاتهم، وهناك خِصيانًا جعلهم الناس خِصيانًا، وهناك خِصيانًا جعلوا أنفسهم خِصيانًا من أجل ملكوت السماوات[a]. فمن استطاع أن يقبل هذا فليقبله[b].
  rationale: يقتصر التعديل على افتتاحية أدق مقابل γάρ، وعلى تحسين التعبير العربي عن الرحم، وعلى توحيد مصطلح «ملكوت السماوات» في الحاشية. وتبقى عبارة «جعلوا أنفسهم خِصيانًا» مقصودةً لإبقاء الغموض التفسيري في الأصل دون فرض قراءة حرفية أو مجازية.
