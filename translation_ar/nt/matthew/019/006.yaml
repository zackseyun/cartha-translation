  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: ar
  text: فَلَمْ يَعُودَا اثْنَيْنِ، بَلْ جَسَدًا وَاحِدًا. فَمَا جَمَعَهُ اللهُ لَا يَفْصِلْهُ إِنْسَانٌ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «إنسان» هنا ذات دلالة عامة؛ أي لا يجوز لأي إنسان أن يفصل ما جمعه الله.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: فَـ
  rationale: تدل على نتيجة الكلام السابق، والفاء تؤدي هذا الاستنتاج بإيجاز وطبيعية في العربية.
- source_word: οὐκέτι εἰσὶν δύο
  choice: فليسَا بعدُ اثنين
  rationale: يحفظ النفي الزمني ومعنى انتقال الاثنين إلى حالة جديدة؛ وأُبقي التثنية ظاهرة في الفعل والخبر.
- source_word: σὰρξ μία
  choice: جسدًا واحدًا
  rationale: يحفظ تعبير سفر التكوين عن اتحاد الزواج وصِلته النصية، من غير تفسيره بعبارة أوسع.
- source_word: ὃ οὖν
  choice: فما
  rationale: تجمع الفاء قوة الاستنتاج في οὖν، ويشير «ما» إلى الاتحاد الذي أحدثه الله من غير تحديد زائد.
- source_word: συνέζευξεν
  choice: جمعه
  rationale: صياغة عربية طبيعية تفيد ضم الطرفين في اتحاد واحد، وتحفظ دلالة الفعل في سياق الزواج.
- source_word: ἄνθρωπος
  choice: إنسان
  rationale: اللفظ اليوناني مفرد ذو دلالة عامة؛ و«إنسان» ينقل العموم بوضوح من غير حصر النهي في الذكر.
- source_word: μὴ χωριζέτω
  choice: لا يفصله
  rationale: صيغة نهي عربية مباشرة تحفظ القوة الأمرية للفعل المضارع اليوناني ومعنى التفريق.
theological_decisions:
- issue: الدلالة العامة للفظ ἄνθρωπος في النهي المتعلق بالزواج
  choice: إنسان
  alternative: رجل أو أحد
  rationale: المقصود أي كائن بشري، لا الذكر وحده؛ لذلك تنقل «إنسان» الدلالة العامة بأمانة ووضوح.
- issue: صدى لغة اتحاد الزواج في سفر التكوين في σὰρξ μία
  choice: جسدًا واحدًا
  alternative: كيانًا واحدًا أو بدنًا واحدًا
  rationale: يحفظ التعبير الموروث والصلة بسفر التكوين، من غير أن يختزل الاتحاد في البدن أو يضيف تفسيرًا لاهوتيًا.
- issue: مرجع الضمير الموصول المحايد ὃ
  choice: ما جمعه الله
  alternative: اللذين جمعهما الله
  rationale: يحافظ «ما» على الإشارة إلى الاتحاد بوصفه واقعًا أو رباطًا، كما يتركها التركيب اليوناني، بدل تحويل المرجع صراحة إلى الزوجين.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «بعدُ» بإيجاز فصيح، وحُفظت عبارة «جسدًا واحدًا» لصداها الكتابي. وُضعت علامة الحاشية بعد الجملة التي تتضمن لفظ «إنسان».
