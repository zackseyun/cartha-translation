  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: ar
  text: حينئذ أُحضِرت إليه أطفال لكي يضع يديه عليهم ويصلّي، لكن التلاميذ انتهروهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يعود الضمير «هم» إلى الأطفال أو إلى الذين أحضروهم.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: تؤدي معنى الظرف الزمني الذي يربط الحدث بما قبله، بصياغة عربية طبيعية موجزة.
- source_word: προσηνέχθησαν αὐτῷ
  choice: أُحضر إليه
  rationale: تحافظ صيغة المبني للمجهول على كون الأطفال متلقّي الفعل، وتعبّر «إليه» بوضوح عن جهة الإحضار.
- source_word: παιδία
  choice: أطفال
  rationale: تنقل الدلالة العامة على الصغار من غير إضافة تصغير أو تحديد للعمر غير مصرّح به في اللفظ اليوناني.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغرض بعبارة عربية واضحة ومألوفة.
- source_word: τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: يضع يديه عليهم
  rationale: تنقل العبارة اليونانية مباشرة، مع إبقاء اليدين بصيغة التثنية الطبيعية في العربية.
- source_word: προσεύξηται
  choice: يصلّي
  rationale: تحفظ الفعل من غير إضافة مفعول أو عبارة «من أجلهم» لا ترد صراحة في الأصل.
- source_word: οἱ δὲ μαθηταὶ
  choice: لكن التلاميذ
  rationale: تُظهر «لكن» المقابلة بين غرض إحضار الأطفال وردّ فعل التلاميذ.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: انتهروهم
  rationale: «انتهر» ينقل قوة التوبيخ، والضمير «هم» يبقي مرجع الضمير اليوناني غير محسوم.
theological_decisions:
- issue: مرجع الضمير الأخير αὐτοῖς
  choice: هم في «انتهروهم»
  alternative: الأطفال، أو الذين أحضروا الأطفال
  rationale: الضمير اليوناني يحتمل المرجعين، لذلك حُفظ الإبهام في المتن بدل حسمه تفسيرياً، مع توضيحه في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المبني للمجهول لموافقة بنية الأصل، وتُرك مفعول الصلاة غير مذكور كما في اليونانية، وحُفظ غموض الضمير الأخير.
