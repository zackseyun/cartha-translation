  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ar
  text: 'لكنني أقول لكم: من طلَّق زوجته إلا بسبب الفجور الجنسي[a] وتزوَّج بأخرى، فإنه يزني؛ ومن تزوَّج بمطلَّقة فإنه يزني[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلا لعِلَّة الفجور الجنسي». ويمكن ترجمة اللفظة اليونانية أيضًا بـ«الفاحشة الجنسية»، أو، على نحو أضيق، بـ«الزنى»؛ ويفسرها بعضهم بمعنى «الخيانة الجنسية».'
    reason: lexical_alternative
  - marker: b
    text: 'لا ترد في بعض المخطوطات عبارة: «ومن تزوَّج بمطلَّقة فإنه يزني».'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: لكنني أقول لكم
  rationale: تنقل δέ بوصفها أداة استدراك خفيفة في السياق، وتحافظ على الصيغة المباشرة والسلطان الخطابي في λέγω ὑμῖν.
- source_word: ὃς ἂν
  choice: من
  rationale: تفيد العموم الشرطي غير المحدد، وهي الصياغة العربية الطبيعية المقابلة لمعنى «كل من» أو «من يفعل».
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: طلَّق زوجته
  rationale: ἀπολύω في سياق الزواج يعني الطلاق لا مجرد الإرسال، وγυνή هنا تعني الزوجة.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: لغير عِلَّة الفجور الجنسي
  rationale: تحافظ الصياغة على تعلق العبارة بسبب الطلاق، بينما ينقل «الفجور الجنسي» المجال الدلالي الواسع نسبيًا لـπορνεία من غير حصره في الزنى وحده.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: وتزوَّج بأخرى
  rationale: ἄλλην مؤنث يدل على امرأة أخرى، ويُفهم ذلك طبيعيًا في العربية من «بأخرى».
- source_word: μοιχᾶται
  choice: فإنه يزني
  rationale: صياغة واضحة ومباشرة للفعل، وتحافظ على تقرير الفعل الأخلاقي بدل تحويله إلى مجرد وصف اسمي.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: ومن تزوَّج بمطلَّقة فإنه يزني
  rationale: تنقل التركيب الاسمي القائم على اسم الفاعل بمعنى عام، وتعبّر «مطلَّقة» عن اسم المفعول التام ἀπολελυμένην.
theological_decisions:
- issue: معنى πορνεία في عبارة الاستثناء
  choice: الفجور الجنسي
  alternative: الزنى؛ العهارة؛ الخيانة الجنسية
  rationale: اللفظة اليونانية أوسع من μοιχεία الدالة تحديدًا على الزنى، لذلك يحفظ التعبير المختار سعتها ولا يفرض تفسيرًا طائفيًا أضيق. وتوضح الحاشية إمكانات الترجمة والتفسير.
- issue: إدراج العبارة الختامية καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: إدراجها في المتن
  alternative: حذفها لغيابها عن بعض المخطوطات
  rationale: النص اليوناني المزوَّد يدرج العبارة مع علامة اختلاف نصي؛ لذلك تُترجم في المتن ويُنبَّه إلى الاختلاف في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «عِلَّة» لإبراز معنى الأساس أو السبب في ἐπί، مع شرح البديل الأبسط في الحاشية. وُضعت علامتا الحاشيتين في المتن، مع إلحاق علامة الاختلاف النصي بالعبارة التي تتناولها.
