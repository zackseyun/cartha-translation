  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: «وإذا» تؤدي قوة Καὶ ἰδού السردية، و«شخص» لا يستورد وصفًا إضافيًا للمتكلم، و«قد تقدَّم إليه وقال» يحفظ ترتيب الاقتراب ثم القول في اسم الفاعل اليوناني. كما أن «أيَّ شيءٍ صالحٍ أعمل» تبقي اتساع τί ἀγαθὸν، و«لكي تكون لي حياة أبدية» تحافظ على غاية ἵνα وعلى معنى σχῶ («تكون لي/أملك») دون تحميل المعنى استحقاقًا أو اكتسابًا صريحًا.'
