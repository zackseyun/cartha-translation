source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: ar
  text: 'وإذا بشخصٍ قد تقدَّم إليه وقال: «يا معلِّم، أيَّ شيءٍ صالحٍ[a] أعمل لكي تكون لي حياة أبدية؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيَّ عملٍ صالح أعمل...؟» فالعبارة اليونانية τί ἀγαθὸν قد تعني «أيَّ شيء صالح»، وقد يُفهم منها مع فعل «أعمل» معنى «أيَّ عمل صالح».'
    reason: بديل معجمي يحفظ اتساع العبارة اليونانية.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: وإذا
  rationale: تنقل التحول السردي وقوة لفت الانتباه في ἰδού بصياغة عربية فصيحة وطبيعية، مع استيعاب καί في الواو.
- source_word: εἷς
  choice: بشخصٍ
  rationale: تحافظ على عدم تحديد هوية القادم أو جنسه في هذه الآية، من غير استباق ما يرد لاحقًا في السياق أو في الروايات الموازية.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: قد تقدَّم إليه وقال
  rationale: تحفظ سبق الاقتراب على القول، وتؤدي علاقة اسم المفعول الأوّلي بالفعل الرئيس في عربية طبيعية.
- source_word: Διδάσκαλε
  choice: يا معلِّم
  rationale: المعنى المباشر للقب هو المعلّم أو المدرّس، والنداء بالياء هو الأسلوب العربي الطبيعي.
- source_word: τί ἀγαθὸν
  choice: أيَّ شيءٍ صالحٍ
  rationale: صياغة قريبة من الحياد النحوي في اليونانية، فلا تحصر السؤال صراحة في «عمل صالح»، مع بقاء معنى الفعل أو الصنيع مفهومًا من أعمل.
- source_word: ποιήσω
  choice: أعمل
  rationale: يؤدي سؤال المداولة بالفعل المضارع العربي؛ وسياق السؤال يمنحه معنى ما ينبغي للمتكلم أن يفعله من غير إضافة لفظ يحمّله تقريرًا لاهوتيًا زائدًا.
- source_word: ἵνα σχῶ
  choice: لكي تكون لي
  rationale: تحفظ دلالة الغاية في ἵνα، وتؤدي معنى امتلاك الحياة تعبيرًا عربيًا طبيعيًا من غير تفسيره صراحة بمعنى الاستحقاق أو الاكتساب.
- source_word: ζωὴν αἰώνιον
  choice: حياة أبدية
  rationale: المقابل العربي الراسخ والدقيق للعبارة في هذا السياق.
theological_decisions:
- issue: تحديد هوية المتكلم أو جنسه
  choice: شخص
  alternative: رجل؛ الشاب الغني
  rationale: تستعمل الآية εἷς وحدها، ولذلك لا تُستورد إليها أوصاف من بقية السياق أو من الروايات الموازية.
- issue: دلالة سؤال الفعل وعلاقته بالحياة الأبدية
  choice: أيَّ شيءٍ صالحٍ أعمل لكي تكون لي حياة أبدية؟
  alternative: أيَّ عمل صالح أعمل لأنال الحياة الأبدية؟
  rationale: تحفظ الصياغة توجه السؤال نحو الفعل والغاية كما في الأصل، من غير أن تحسم ضمنًا مسألة الاستحقاق بالأعمال أو كيفية الخلاص.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعملت «وإذا» للافت السردي، و«شخص» لتجنب إضافة تحديد غير موجود في الآية، مع إبقاء السؤال في صيغة طبيعية لا تزيل توتره اللاهوتي.
