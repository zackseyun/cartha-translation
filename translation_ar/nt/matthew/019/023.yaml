source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: ar
  text: 'ثم قال يسوع لتلاميذه: «الحق أقول لكم[a]: إن رجلًا غنيًّا سيدخل ملكوت السماوات بصعوبة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آمين، أقول لكم».'
    reason: بديل لفظي أقرب إلى نقل Ἀμὴν صوتيًا.
  - marker: b
    text: 'أو: «بعسر».'
    reason: بديل عربي موجز للظرف δυσκόλως.
lexical_decisions:
- source_word: δὲ
  choice: ثم
  rationale: تفيد الانتقال والتقدم في السرد، و«ثم» تؤدي هذا الربط بوضوح من غير حذف الأداة.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: تحافظ على دلالة الملكية الصريحة في αὐτοῦ، وهي صياغة عربية طبيعية.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: تنقل صيغة التوكيد المهيبة التي يستهل بها يسوع كلامه، بلغة عربية واضحة ومألوفة، مع إثبات البديل الحرفي في الحاشية.
- source_word: πλούσιος
  choice: رجلًا غنيًّا
  rationale: الصفة مستعملة استعمال الاسم، وهي مفردة مذكرة؛ وإظهار «رجلًا» يحفظ هذه الصيغة ويجعل التركيب العربي واضحًا.
- source_word: δυσκόλως
  choice: بصعوبة
  rationale: تنقل دلالة الكيفية مباشرة من غير أن تجعل الدخول مستحيلًا أو تكاد تنفي وقوعه؛ ويأتي التشديد الأبلغ في الآية التالية.
- source_word: εἰσελεύσεται
  choice: سيدخل
  rationale: يحفظ صيغة المستقبل في اليونانية ويؤدي فعل الدخول بإيجاز.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: يحفظ التعبير المتاوي وصيغة الجمع في οὐρανῶν، كما أن «ملكوت» تعبير عربي كتابي راسخ يحمل معنى المُلك والسيادة.
theological_decisions:
- issue: صيغة المذكر في πλούσιος
  choice: رجلًا غنيًّا
  alternative: شخصًا غنيًّا؛ الغني
  rationale: اليونانية مفرد مذكر مستعمل استعمال الاسم. تحافظ الترجمة على ذلك من غير أن تضيف تخصيصًا عقائديًا إلى المثل العام.
- issue: ترجمة Ἀμὴν في صيغة كلام يسوع
  choice: الحق
  alternative: آمين
  rationale: «الحق» توصل وظيفة التوكيد السلطاني بوضوح إلى القارئ العربي، بينما تُذكر «آمين» في الحاشية بوصفها نقلًا أقرب إلى اللفظ السامي.
- issue: مدى دلالة δυσκόλως
  choice: بصعوبة
  alternative: بعسر؛ لا يكاد يدخل
  rationale: «بصعوبة» تحافظ على معنى الظرف من غير حسم التوتر باتجاه الاستحالة أو الاحتمال الضئيل جدًا، وهو ما يوضحه السياق اللاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل «ملكوت السماوات» للمحافظة على الصيغة المتاوية المميزة، ووُضعت علامتا الحاشية [a] و[b] في موضعيهما داخل النص.
