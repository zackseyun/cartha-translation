  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: ar
  text: ولمّا أتمّ يسوع هذه الأقوال، غادر الجليل وجاء إلى نواحي اليهودية في ما وراء نهر الأردن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عبر نهر الأردن».'
    reason: بديل لغوي لـπέραν، التي يمكن أن تعني «ما وراء» أو «عبر/على الجانب الآخر من» بحسب زاوية النظر.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: ولمّا
  rationale: صيغة انتقال سردي مألوفة في متّى. تنقل تعاقب الأحداث واكتمال القول قبل الرحيل بعربية طبيعية، من غير تركيب حرفي ثقيل مثل «وحدث أنه عندما».
- source_word: ἐτέλεσεν
  choice: أتمّ
  rationale: يدل الفعل على إكمال الكلام السابق، و«أتمّ» يحافظ على معنى الإنجاز التام وعلى النبرة الفصيحة.
- source_word: τοὺς λόγους τούτους
  choice: هذه الأقوال
  rationale: تشير العبارة إلى الخطاب السابق مباشرة. و«الأقوال» أوضح في هذا السياق من «الكلمات» وأقل تعميمًا من «الأمور».
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: غادر الجليل
  rationale: ينقل فعل الارتحال عن مكان مع التعبير عن نقطة الانطلاق بصياغة عربية موجزة وطبيعية.
- source_word: ἦλθεν εἰς
  choice: وجاء إلى
  rationale: يحافظ على فعل المجيء وعلى اتجاه الحركة الذي تدل عليه εἰς.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: نواحي اليهودية
  rationale: قد تدل ὅρια على الحدود أو التخوم أو المنطقة. و«نواحي» تؤدي المعنى الجغرافي هنا من غير أن توحي بخط حدودي دقيق.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: في ما وراء نهر الأردن
  rationale: تحافظ العبارة على الدلالة المكانية لـπέραν بوصفها الجهة الواقعة وراء النهر، مع إثبات البديل «عبر نهر الأردن» في الحاشية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعيض عن النقل الحرفي لعبارة الانتقال اليونانية بصياغة عربية مألوفة، مع الحفاظ على ترتيب الحدثين وعلى الاحتمال الجغرافي في الحاشية.
