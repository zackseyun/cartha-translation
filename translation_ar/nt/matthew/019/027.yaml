  text: 'حينئذ أجاب بطرس وقال له: «ها نحن قد تركنا كل شيء وتبعناك، فماذا يكون لنا إذن؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: ينقل التتابع الزمني بصياغة عربية فصيحة وطبيعية.
- source_word: Ἰδοὺ
  choice: ها نحن
  rationale: يحافظ على وظيفة التنبيه مع اتصالها الطبيعي بالضمير ἡμεῖς في العربية.
- source_word: ἀφήκαμεν πάντα
  choice: تركنا كل شيء
  rationale: ترجمة مباشرة تحفظ شمول πάντα من غير مبالغة تفسيرية.
- source_word: ἠκολουθήσαμέν σοι
  choice: تبعناك
  rationale: تعبير عربي موجز وطبيعي يقابل فعل الاتباع مع المفعول غير المباشر في اليونانية.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: فماذا يكون لنا؟
  rationale: يحفظ الاستفهام والنتيجة التي تفيدها ἄρα، مع إبقاء طبيعة ما سيكون لهم غير محددة كما في المصدر.
theological_decisions:
- issue: ماهية ما سيكون للتلاميذ
  choice: فماذا يكون لنا؟
  alternative: فماذا ننال؟
  rationale: اختيرت الصياغة الأقرب إلى ἔσται ἡμῖν كي لا يُحسم المقصود على أنه أجر أو مكافأة صراحةً، إذ يتركه النص مفتوحًا.
