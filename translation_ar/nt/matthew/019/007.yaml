  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: ar
  text: 'قالوا له: «فلماذا إذًا أمر موسى بإعطاء وثيقة طلاق وصرفها؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: قالوا له
  rationale: المضارع التاريخي في السرد اليوناني يُنقل طبيعيًا إلى الماضي في العربية.
- source_word: Τί οὖν
  choice: فلماذا إذًا
  rationale: تفيد العبارة هنا الاعتراض على كلام يسوع السابق، ولذلك تنقل «لماذا» قوتها الحجاجية بوضوح.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: أمر موسى
  rationale: الفعل يدل على الأمر، ويجب إبقاء صياغة السائلين كما هي دون استباق تصحيح يسوع في العدد التالي.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: أن تُعطى وثيقة طلاق
  rationale: العبارة تشير إلى وثيقة قانونية للطلاق، و«وثيقة طلاق» تعبير عربي واضح ومعاصر.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: وأن تُطلَّق
  rationale: في هذا السياق الزوجي القانوني يدل ἀπολύω على تطليق المرأة؛ والصياغة العربية المبنية للمجهول طبيعية وتحفظ عدم ذكر الفاعل الصريح في اليونانية.
theological_decisions:
- issue: هل تُخفَّف صياغة السائلين من «أمر» إلى «سمح» انسجامًا مع جواب يسوع التالي؟
  choice: الإبقاء على «أمر»
  alternative: سمح
  rationale: النص اليوناني يقول صراحة إن موسى «أمر» بحسب صياغة السائلين، فلا ينبغي إدخال تصحيح العدد التالي في هذا العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «وثيقة طلاق» للدلالة القانونية، و«تُطلَّق» بدل الترجمة الحرفية «تُصرَف/تُرسَل بعيدًا» لأن السياق يجعل معنى الطلاق صريحًا، ولأن التعبير الحرفي أقل طبيعية وقد يوحي بمجرد الإبعاد.
