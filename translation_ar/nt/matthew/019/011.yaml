base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: ar
  text: 'فقال لهم: «لا يستطيع الجميع تقبّل هذا القول[a]، بل فقط الذين أُعطوه[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هذا الكلام» أو «هذا التعليم».
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن المبني للمجهول «أُعطوه» يشير إلى الله بوصفه الواهب، لكن النص اليوناني لا يذكر الفاعل صراحةً.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: فقال
  rationale: صيغة سردية طبيعية للفعل λέγω في الماضي، وتحافظ على وصله بالسياق السابق.
- source_word: Οὐ πάντες
  choice: ليس الجميع
  rationale: تؤدي معنى نفي الشمول بعبارة عربية واضحة من غير أن توحي بأن أحدًا لا يقبله.
- source_word: χωροῦσι
  choice: قادرين على تقبُّل
  rationale: الفعل يعني حرفيًا إفساح مجال، ويأتي هنا مجازيًا بمعنى استيعاب القول أو قبوله؛ وتعبير «قادرين على تقبُّل» ينقل هذا المعنى بوضوح.
- source_word: τὸν λόγον τοῦτον
  choice: هذا القول
  rationale: يشير λόγος هنا إلى الكلام السابق مباشرة؛ و«القول» طبيعي ودقيق، مع إمكان فهمه بوصفه كلامًا أو تعليمًا.
- source_word: ἀλλ’ οἷς
  choice: بل الذين ... فقط
  rationale: تُظهر «بل» المقابلة، وتوضح «فقط» أن القبول مقصور على الذين أُعطي لهم.
- source_word: δέδοται
  choice: أُعطي لهم ذلك
  rationale: تحافظ صيغة المبني للمجهول على عدم ذكر الواهب في اليونانية، وتفيد العطية التي ما زال أثرها قائمًا.
theological_decisions:
- issue: هوية الواهب المفهوم ضمنًا في δέδοται
  choice: الإبقاء على المبني للمجهول من دون تسمية الله في المتن
  alternative: بل الذين أعطاهم الله ذلك فقط
  rationale: قد تكون الصيغة مبنيًا للمجهول يُفهم منه أن الله هو الواهب، لكن النص اليوناني لا يصرّح بالفاعل؛ لذلك يحفظ المبني للمجهول الغموض المقصود ولا يضيف ما لم يذكره النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختير «تقبُّل» لإفادة الاستيعاب والقبول معًا، وحُفظ المبني للمجهول لصون الغموض الموجود في الأصل.
