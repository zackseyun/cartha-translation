source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: ar
  text: 'أمّا يسوع فقال: «دعوا الأطفال يأتون إليّ، ولا تمنعوهم من أن يأتوا إليّ، فإن ملكوت السماوات لأمثال هؤلاء».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير عبارة «أمثال هؤلاء» إلى الأطفال الحاضرين، كما يمكن أن تشمل أناسًا من هذا القبيل؛ ولا يحدد النص هنا الصفة المقصودة.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφετε
  choice: دعوا
  rationale: الفعل هنا أمر يفيد السماح، و«دعوا» تعبير عربي موجز وطبيعي يؤدي هذا المعنى في السياق.
- source_word: τὰ παιδία
  choice: الأطفال
  rationale: اللفظ يدل على الأطفال، وغالبًا الصغار منهم، لكن «الأطفال» يحافظ على سعة الدلالة من غير إضافة تصغير غير مصرّح به.
- source_word: μὴ κωλύετε
  choice: لا تمنعوهم
  rationale: ينقل معنى المنع أو العرقلة بوضوح، ويلائم في العربية مجيء فعل «يأتون» قبله في صياغة طبيعية.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: يأتون إليّ
  rationale: 'أُدمجت العبارة مع «دعوا الأطفال» لتكوين الأسلوب العربي الطبيعي: «دعوا الأطفال يأتون إليّ»، مع إبقاء جهة المجيء نحو يسوع واضحة.'
- source_word: τῶν γὰρ τοιούτων
  choice: لأن لمثل هؤلاء
  rationale: «مثل هؤلاء» تشير إلى الأطفال الحاضرين وإلى من هم من هذا القبيل، من غير أن تحدد صراحة الصفة المقصودة أو تحصر المرجع في الأطفال أنفسهم.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: تعبير دقيق ومألوف في العربية لعبارة متى المميزة، ويحافظ على صيغة الجمع في «السماوات».
- source_word: ἐστὶν
  choice: مفهوم ضمنًا في الجملة الاسمية «لمثل هؤلاء ملكوت السماوات»
  rationale: العربية لا تحتاج إلى فعل رابط في الزمن الحاضر؛ والصياغة الاسمية تنقل علاقة الاختصاص أو الانتماء من غير توسع تفسيري.
theological_decisions:
- issue: هل يشير يسوع إلى الأطفال أنفسهم وحدهم أم أيضًا إلى أناس من نوعهم؟
  choice: «مثل هؤلاء»
  alternative: «لهؤلاء الأطفال» أو «للذين يشبهون الأطفال»
  rationale: اسم الإشارة النوعي τοιούτων يتجاوز الأفراد الحاضرين إلى فئة يمثلونها، لكنه لا يحدد الصفة المعنية. لذلك تحفظ «مثل هؤلاء» الإحالة المباشرة والامتداد الأوسع معًا من غير حسم تفسيري.
- issue: طبيعة علاقة ملكوت السماوات بـ«مثل هؤلاء»
  choice: «لمثل هؤلاء ملكوت السماوات»
  alternative: «ملكوت السماوات يخص أمثال هؤلاء»
  rationale: تُبقي اللام معنى الاختصاص أو الانتماء الذي تحمله صيغة المضاف إليه اليونانية، من غير أن تحوله إلى شرح عقائدي أوسع.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «أمّا يسوع فقال» لإبراز المقابلة التي تؤديها δέ، وصيغ الأمر مباشرة وبأسلوب طبيعي. حُفظ تعبير «ملكوت السماوات» المميز لإنجيل متى، كما حُفظ غموض «مثل هؤلاء» المقصود في الأصل.
