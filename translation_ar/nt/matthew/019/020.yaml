base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: ar
  text: 'قال له الشاب: «هذه كلها حفظتُها[a]. فما الذي ما زال ينقصني؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذه كلها راعيتُها».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ففي أي شيء ما زلتُ مقصِّرًا؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: استُخدم الماضي العربي الطبيعي في السرد، إذ إن المضارع التاريخي اليوناني لا يلزم نقله حرفيًا إلى العربية.
- source_word: ὁ νεανίσκος
  choice: الشاب
  rationale: ينقل معنى «الشاب» دون استيراد وصف «الرئيس» من سياق موازٍ.
- source_word: Πάντα ταῦτα
  choice: هذه كلها
  rationale: صياغة عربية موجزة وطبيعية تعود إلى الوصايا المذكورة قبلًا.
- source_word: ἐφύλαξα
  choice: حفظتُها
  rationale: الفعل في هذا السياق يعني حفظ الوصايا أو مراعاتها، و«حفظتُها» تعبير عربي واضح ومألوف.
- source_word: ἔτι
  choice: بعدُ
  rationale: تفيد بقاء شيء آخر أو استمرار النقص، وهي ملائمة للسؤال في العربية الفصحى.
- source_word: ὑστερῶ
  choice: ينقصني
  rationale: 'يحافظ على المعنى المباشر: ما الذي لا يزال مفتقدًا لديه، دون تقرير طبيعة ذلك النقص.'
theological_decisions:
- issue: تقييم الشاب لطاعته
  choice: 'نُقل ادعاؤه بصيغة مباشرة ومحايدة: «هذه كلها حفظتُها».'
  alternative: إضافة ما يوحي بأن ادعاءه خاطئ أو مبالغ فيه أو ساخر.
  rationale: النص اليوناني يورد قوله بلا تعليق صريح على صدقه؛ لذلك تُحفظ المسافة والتوتر اللاهوتي للسياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «قال» للسرد الطبيعي، و«بعدُ» بمعنى «إلى الآن/أيضًا» مع الضمة، وأُبقي ادعاء الشاب بلا حكم تفسيري.
