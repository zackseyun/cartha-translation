  text: And after laying his hands on them[a], he went on from there.
translation:
  language: ar
  text: وبعدما وضع يديه عليهم، انصرف من هناك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يصل الحدث بما قبله دون إضافة دلالة تفسيرية.
- source_word: ἐπιθεὶς
  choice: بعدما وضع
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل هنا على فعل سبق الفعل الرئيس، وهذه الصياغة عربية طبيعية تحفظ تعاقب الحدثين.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: يديه عليهم
  rationale: التعبير اليوناني يعني وضع اليدين على أشخاص، وتثنية «يديه» تنقل أداة التعريف والجمع اليونانيين بما يلائم الاستعمال العربي والسياق الذي فاعله يسوع.
- source_word: ἐπορεύθη
  choice: انصرف
  rationale: الفعل يدل على الذهاب أو الرحيل؛ و«انصرف» فصيحة واضحة وتناسب مغادرة المكان في السياق.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: تنقل ظرف المكان الدال على الابتداء من ذلك الموضع بصورة عربية مباشرة.
theological_decisions:
- issue: طبيعة وضع يسوع يديه عليهم
  choice: 'الإبقاء على الفعل الجسدي الصريح: «وضع يديه عليهم»'
  alternative: استبداله بتفسير مثل «باركهم»
  rationale: النص اليوناني يذكر وضع اليدين صراحة، وإن كان السياق يشير إلى البركة؛ لذلك لا تُستبدل العبارة بتفسير لاهوتي أو طقسي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت صياغة موجزة تحافظ على ترتيب الفعل السابق ثم الرحيل، من غير حاجة إلى حاشية لأن البديل «وإذ وضع... انصرف» فرق أسلوبي لا يضيف معنى نصيًا مهمًا.
