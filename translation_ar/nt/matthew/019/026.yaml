source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: ar
  text: 'فنظر يسوع إليهم وقال لهم: «هذا مستحيل عند البشر، ولكن عند الله كل شيء ممكن».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: فنظر ... إليهم
  rationale: يفيد الفعل توجيه النظر إلى أشخاص بعينهم. وهذه صياغة عربية طبيعية تحفظ الحركة السردية من غير مبالغة مثل «حدّق».
- source_word: δὲ
  choice: فـ / ولكن
  rationale: تؤدي الفاء في افتتاح الجملة الاستمرار السردي المرتبط بما سبق، بينما تؤدي «ولكن» في القول نفسه المقابلة الصريحة بين البشر والله.
- source_word: εἶπεν αὐτοῖς
  choice: وقال لهم
  rationale: أُثبت الضمير لأن αὐτοῖς مذكور صراحة في اليونانية، ولأن العبارة سليمة وطبيعية في العربية.
- source_word: παρὰ ἀνθρώποις
  choice: عند البشر
  rationale: παρά مع المجرور هنا تدل على المجال أو ما يكون في مقدور جهة ما. و«البشر» تنقل الدلالة العامة لـἀνθρώποις بوضوح من غير إيحاء بأنها خاصة بالذكور.
- source_word: τοῦτο
  choice: هذا
  rationale: اسم الإشارة يعود إلى الأمر الجاري الحديث عنه، وتكفي ترجمته المباشرة «هذا».
- source_word: ἀδύνατόν ἐστιν
  choice: مستحيل
  rationale: صياغة عربية موجزة ومباشرة للمسند الوصفي مع فعل الكينونة المقدر طبيعيًا في الجملة الاسمية.
- source_word: παρὰ δὲ θεῷ
  choice: ولكن عند الله
  rationale: تحفظ «عند» التوازي البلاغي مع «عند البشر»، وتوضح «ولكن» المقابلة التي تحملها δέ.
- source_word: πάντα δυνατά
  choice: كل شيء ممكن
  rationale: تعبير عربي جامع وطبيعي ينقل معنى πάντα وقوة العبارة الحكمية من غير إضافة أو تقييد.
theological_decisions:
- issue: دلالة ἀνθρώποις في القول العام
  choice: البشر
  alternative: الناس / بنو آدم
  rationale: اللفظ اليوناني جمع مذكر من حيث الصيغة، لكنه يشير هنا إلى البشر جميعًا في مقابل الله؛ لذلك تنقل «البشر» عموم المعنى ولا تحصره في الرجال.
- issue: نطاق عبارة «كل شيء ممكن»
  choice: إبقاء العبارة مطلقة كما وردت في سياقها
  alternative: تقييدها صراحة بالخلاص أو بمشيئة الله
  rationale: النص اليوناني يقول πάντα δυνατά من غير قيد لفظي. يوضح السياق موضوع القول، لكن إدخال القيد في المتن سيحسم دلالة لم يصرح بها النص نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين «عند البشر» و«عند الله»، وتُركت العبارة الختامية على إيجازها وقوتها المأثورتين.
