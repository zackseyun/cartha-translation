  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: ar
  text: وبعدما صلبوه، اقتسموا ثيابه بإلقاء القرعة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: وبعدما صلبوه
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل هنا على فعل سبق الفعل الرئيس؛ وتؤدي «بعدما» هذا التتابع الزمني بعبارة عربية طبيعية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد، وتناسبها الواو في العربية من غير إثقال.
- source_word: διεμερίσαντο
  choice: اقتسموا
  rationale: الفعل يدل على تقسيم الشيء فيما بينهم؛ و«اقتسموا» موجزة وطبيعية في سياق توزيع الثياب.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ثيابه
  rationale: «الثياب» تعبير عربي واضح وفصيح يشمل الملابس من غير تخصيص غير لازم بأنها خارجية.
- source_word: βάλλοντες κλῆρον
  choice: بإلقاء القرعة
  rationale: العبارة تبين الوسيلة التي اقتسموا بها الثياب؛ و«إلقاء القرعة» اصطلاح عربي واضح يحافظ على صورة النص، مع أن «القرعة» مفرد كما في اليونانية.
theological_decisions:
- issue: علاقة العبارة الحالية βάλλοντες κλῆρον بالفعل الرئيس διεμερίσαντο
  choice: 'جُعل إلقاء القرعة وسيلة اقتسام الثياب: «اقتسموا ثيابه بإلقاء القرعة».'
  alternative: «اقتسموا ثيابه وهم يلقون القرعة» أو «اقتسموا ثيابه ملقين القرعة».
  rationale: اسم الفاعل يشرح على نحو طبيعي كيفية الاقتسام، وحرف الباء يوضح هذه العلاقة في العربية من غير إضافة مضمون لاهوتي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على إيجاز الجملة اليونانية وتسلسلها السردي. لم تُضف حاشية لأن البديل الإنجليزي شكلي خاص ببنية الإنجليزية، أما العربية المختارة فتنقل الدلالة الزمنية والوسيلية مباشرة.
