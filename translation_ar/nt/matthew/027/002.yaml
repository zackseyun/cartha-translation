  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: ar
  text: وبعد أن قيَّدوه، ساقوه وسلَّموه إلى بيلاطس الوالي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى بيلاطس الحاكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: بعدما قيَّدوه
  rationale: اسم فاعل ماضٍ يدل هنا على فعل سبق الفعلين الرئيسيين؛ وصيغة «بعدما» تنقل هذا الترتيب بوضوح، و«قيَّدوه» تحفظ المعنى الحسي للفعل.
- source_word: ἀπήγαγον
  choice: ساقوه
  rationale: ينقل معنى اقتياده من المكان في سياق الحراسة والمحاكمة، وهو أوجز وأدق من «أخذوه» العامة.
- source_word: παρέδωκαν
  choice: سلَّموه
  rationale: يعبّر عن نقله إلى سلطة بيلاطس وحراسته، مع إبقاء ما قد يحمله الفعل في سياق الآلام من دلالة أوسع دون تفسير زائد.
- source_word: Πιλάτῳ
  choice: إلى بيلاطس
  rationale: نقل للاسم الشخصي بصيغته العربية الشائعة، مع إظهار جهة التسليم بحرف الجر الملائم.
- source_word: τῷ ἡγεμόνι
  choice: الوالي
  rationale: لفظ عربي واضح ومألوف لمسؤول حاكم، ويحافظ على عموم اللفظ اليوناني دون تخصيص المنصب تاريخيًا بأنه «الحاكم الروماني» أو «المفوَّض».
theological_decisions:
- issue: دلالة παραδίδωμι في رواية الآلام
  choice: سلَّموه
  alternative: دفعوه
  rationale: «سلَّموه» تُبرز المعنى القضائي المباشر، أي نقله إلى سلطة أخرى، ولا تحصر الفعل في معنى الخيانة ولا تلغي صداه اللاهوتي في سياق الآلام.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ساقوه» للدلالة على الاقتياد تحت الحراسة، و«الوالي» بوصفه المقابل الطبيعي غير المفرط في التخصيص لـ ἡγεμών. وُضعت علامة الحاشية في المتن بعد العبارة التي تتعلق بها.
