  terminology: «قائد المئة»، و«الزلزال»، و«ابن الله» اختيارات سليمة وواضحة. في الحاشية، «ابنًا لإله» ممكن من حيث إفادة التنكير، لكنه غير طبيعي في العربية؛ و«ابن إله» أوضح بوصفه مقابلاً احتماليًا، مع التنبيه إلى أن السياق يرجح اللقب في المتن.
