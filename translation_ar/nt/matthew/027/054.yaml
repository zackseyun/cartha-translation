source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: ar
  text: 'عندما رأى قائدُ المئة والذين معه، الذين كانوا يحرسون يسوع، الزلزالَ وما حدث، خافوا جدًا وقالوا: «حقًا كان هذا ابن الله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابن إله». جاءت العبارة اليونانية θεοῦ υἱός بلا أداة تعريف؛ لكن سياق إنجيل متّى يرجّح فهمها لقبًا: «ابن الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: قائد المئة
  rationale: تعبير عربي واضح ودقيق لرتبة الضابط الروماني المسؤول تقليديًا عن مئة جندي.
- source_word: τηροῦντες
  choice: يحرسون
  rationale: السياق العسكري عند موضع الإعدام يقتضي الحراسة لا مجرد المشاهدة.
- source_word: ἰδόντες
  choice: ولمّا رأى
  rationale: نُقل اسم الفاعل الماضي بقيمة زمنية في صياغة عربية طبيعية تربط الرؤية بالفعل الرئيس.
- source_word: σεισμόν
  choice: الزلزال
  rationale: هو المعنى المباشر المعتاد للكلمة في هذا السياق.
- source_word: τὰ γενόμενα
  choice: ما حدث
  rationale: صياغة عربية طبيعية تشمل الوقائع المصاحبة كلها، ولا تحصر الإشارة في الزلزال وحده.
- source_word: ἐφοβήθησαν σφόδρα
  choice: خافوا جدًا
  rationale: تحفظ شدة الخوف التي يدل عليها الظرف σφόδρα بعبارة عربية واضحة.
- source_word: Ἀληθῶς
  choice: حقًا
  rationale: تنقل قوة التأكيد من غير أن تفرض مقدارًا من الفهم اللاهوتي على المتكلمين.
- source_word: θεοῦ υἱὸς
  choice: ابن الله
  rationale: مع أن العبارة اليونانية بلا أداة تعريف، فإن ترتيب المسند وسياق متّى يسمحان بالمعنى اللقبي أو النوعي المحدد، و«ابن الله» في العربية طبيعي ولا يحتاج إلى أداة تعريف مستقلة.
- source_word: οὗτος
  choice: هذا
  rationale: يحفظ اسم الإشارة وصيغة القول المباشرة.
theological_decisions:
- issue: دلالة θεοῦ υἱὸς في اعتراف قائد المئة
  choice: ابن الله
  alternative: ابنٌ لإله
  rationale: سياق إنجيل متّى واستعمال اللقب فيه يرجحان الإشارة إلى هوية يسوع بوصفه ابن الله. ومع ذلك، لأن التركيب اليوناني غير المعرّف يمكن أن يُفهم في بعض القراءات فهمًا نكِرًا أو نوعيًا، أُثبت البديل في الحاشية حفاظًا على موضع الاحتمال دون تسويته صامتًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «قائد المئة» بدل اللفظ المعرّب الأقل شيوعًا، ووُضعت جملة الحراسة اعتراضية لتوضيح أن قائد المئة والذين معه هم جماعة الحراسة. لم تُضف أداة استئناف زمنية لا يقابلها لفظ صريح في المصدر.
