  source_fidelity: يلزم ضبط تعلّق وصف الحراسة. فاسم الفاعل اليوناني τηροῦντες يصف «الذين معه» مباشرةً؛ والصياغة الحالية «وهم يحرسون يسوع» قد تجعل الحراسة وصفًا صريحًا لقائد المئة وللذين معه جميعًا. أما سائر عناصر الآية—الزلزال، وما حدث، وشدة الخوف، والقول الختامي—فمنقولة بأمانة.
