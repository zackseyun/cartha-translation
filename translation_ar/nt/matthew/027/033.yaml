  rationale: «موضع» مقابل عربي واضح وطبيعي لـ τόπος في هذا السياق المكاني، والتنكير محفوظ لعدم وجود أداة تعريف في اليونانية.
- source_word: λεγόμενον
  choice: يُسمّى
  rationale: يفيد الفعل هنا التسمية، وصيغة المبني للمجهول طبيعية وواضحة في العربية.
- source_word: Γολγοθᾶ
  choice: جُلْجُثَة
  rationale: نُقل اسم المكان صوتيًا بدل ترجمته، مع اعتماد الصيغة العربية الكتابية المعروفة.
- source_word: ὅ ἐστιν
  choice: أي
  rationale: «أي» تؤدي بإيجاز ووضوح وظيفة العبارة التفسيرية التي تشرح مدلول اسم جُلْجُثَة.
- source_word: Κρανίου Τόπος
  choice: موضع جمجمة
  rationale: يحافظ التعبير على عدم التعريف في الأصل اليوناني، وينقل علاقة الإضافة بين «جمجمة» و«موضع» بعبارة عربية طبيعية.
- source_word: λεγόμενος
  choice: مفهوم ضمنًا في «أي»
  rationale: التكرار اليوناني في العبارة التفسيرية لا يُعاد حرفيًا تجنبًا للركاكة؛ وتؤدي «أي» معنى الشرح والتسمية في السياق.
