reference: Matthew 27:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: ar
  text: 'فلما اجتمعوا، قال لهم بيلاطس: «مَن تريدون أن أُطلق لكم: يسوع باراباس[a]، أم يسوع الذي يُدعى المسيح[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «باراباس» فقط، من دون «يسوع».'
    reason: textual_variant
  - marker: b
    text: اللفظ اليوناني «خريستوس» لقب يعني «المسيح»، أي «الممسوح».
    reason: lexical_clarification
lexical_decisions:
- source_word: συνηγμένων οὖν αὐτῶν
  choice: فلما اجتمعوا
  rationale: ينقل التركيب الزمني المطلق مع أداة الربط οὖν بعبارة عربية طبيعية، ويدل على أن سؤال بيلاطس جاء عند اجتماعهم.
- source_word: Τίνα θέλετε
  choice: مَن تريدون
  rationale: استفهام عن شخص من بين شخصين، وهذه الصياغة واضحة ومألوفة في العربية.
- source_word: ἀπολύσω ὑμῖν
  choice: أن أُطلق لكم
  rationale: الفعل في هذا السياق القضائي يعني إطلاق سراح سجين، و«أُطلق» يحافظ على هذا المعنى بإيجاز.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: يسوع باراباس
  rationale: يتبع النص اليوناني المطبوع الذي يثبت اسم «يسوع» قبل «باراباس»، فيحفظ المقابلة المقصودة بين شخصين اسمهما يسوع.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: يسوع الذي يُدعى المسيح
  rationale: ينقل λεγόμενον دون إضافة نبرة ازدراء، ويترجم χριστός بوصفه لقبًا إلى «المسيح».
theological_decisions:
- issue: ترجمة χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: الكلمة هنا لقب لا اسم عائلة، و«المسيح» هو المقابل العربي الطبيعي الراسخ، مع بيان معناها الحرفي في الحاشية.
- issue: إثبات «يسوع» قبل باراباس
  choice: يسوع باراباس في المتن
  alternative: باراباس فقط
  rationale: أُثبت الاسم وفق قراءة SBLGNT المقدمة، مع حفظ القراءة الأقصر بوصفها اختلافًا نصيًا في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «فلما» لسلاسة السرد، و«أُطلق لكم» للمحافظة على السياق القضائي دون تكلف.
