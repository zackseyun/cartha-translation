  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: ar
  text: وكانت بينهن مريم المجدلية، ومريم أم يعقوب ويوسف[a]، وأم ابني زبدي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في بعض المخطوطات أو القراءات: «يوسي» بدلًا من «يوسف».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: بينهن
  rationale: تعود العبارة إلى جماعة النساء المذكورة في الآية السابقة، و«بينهن» تؤدي معنى الانتماء إلى تلك الجماعة بوضوح وطبيعية.
- source_word: ἦν
  choice: كانت
  rationale: جاء الفعل اليوناني مفردًا قبل قائمة النساء، والعربية تجيز إفراد الفعل المؤنث إذا تقدم على فاعل مؤنث متعدد معطوف.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة، وهي واضحة وتحفظ دلالة اللقب المكاني.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: مريم أم يعقوب ويوسف
  rationale: تنقل علاقة الأمومة التي تعرّف مريم، بصياغة عربية موجزة وطبيعية.
- source_word: Ἰάκωβος
  choice: يعقوب
  rationale: النقل العربي الكتابي المألوف للاسم اليوناني Ἰάκωβος، وهو يقابل الاسم السامي يعقوب.
- source_word: Ἰωσὴφ
  choice: يوسف
  rationale: قراءة SBLGNT هي Ἰωσήφ، ويقابلها الاسم العربي المألوف «يوسف»؛ أما القراءة الأخرى فتُذكر في الحاشية.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: أم ابني زبدي
  rationale: المقصود ابنا زبدي المعروفان في السياق، وصيغة المثنى العربية طبيعية ودقيقة بدل التعبير الحرفي «أم أبناء زبدي».
- source_word: Ζεβεδαίου
  choice: زبدي
  rationale: الصيغة العربية الكتابية المستقرة للاسم Ζεβεδαῖος.
theological_decisions: []
