  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: ar
  text: وفي العيد[a]، كان الوالي قد اعتاد أن يفرج للحشد عن سجين واحد يختارونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الاحتفال».'
    reason: بديل معجمي؛ يمكن أن يدل ἑορτή على العيد أو الاحتفال الديني.
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: وفي العيد
  rationale: تؤدي «في» المعنى الزمني لحرف الجر κατά مع المنصوب، وتنقل الواو انتقال δέ السردي الخفيف من غير إضافة ظرف مثل «الآن» غير موجود في الأصل.
- source_word: ἑορτὴν
  choice: العيد
  rationale: «العيد» لفظ عربي طبيعي وواضح لاحتفال ديني دوري، ويلائم سياق الفصح مع إبقاء إمكان الترجمة الأعم «الاحتفال» في الحاشية.
- source_word: εἰώθει
  choice: كان ... معتادًا
  rationale: تنقل صيغة الماضي الناقص معنى العادة المتكررة في الماضي، لا مجرد وقوع الفعل مرة واحدة.
- source_word: ὁ ἡγεμὼν
  choice: الوالي
  rationale: يشير اللفظ هنا إلى الحاكم الروماني للإقليم؛ و«الوالي» تعبير عربي واضح ومألوف في هذا السياق.
- source_word: ἀπολύειν
  choice: أن يطلق
  rationale: يؤدي معنى إخراج شخص من الحبس أو الأسر، وهو تعبير عربي طبيعي في السياق القضائي.
- source_word: ἕνα ... δέσμιον
  choice: سجينًا واحدًا
  rationale: يحفظ العدد الصريح ومعنى الشخص الموضوع في القيود أو الحجز.
- source_word: τῷ ὄχλῳ
  choice: للجمع
  rationale: 'تحفظ اللام دلالة المفعول غير المباشر: كان إطلاق السجين يتم للجمع وبناءً على رغبتهم.'
- source_word: ὃν ἤθελον
  choice: يختارونه
  rationale: يعبر التعبير العربي الطبيعي عن كون السجين المطلق هو الذي يريده الجمع، من غير تحديد سبب اختيارهم له.
