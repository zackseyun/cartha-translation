base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: ar
  text: 'فقال لهم بيلاطس: «لديكم حرس[a]. اذهبوا وأمِّنوه كما تعرفون[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خذوا حرسًا»، أو ربما: «لديكم حرسكم الخاص». يمكن فهم اليونانية إما على أن بيلاطس يضع حرسًا تحت تصرفهم، وإما على أنه يشير إلى حرس متاح لهم أصلًا.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «أمِّنوه بقدر ما تستطيعون».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: فعل قول سردي مألوف، واقترانه بالفاء يلائم تتابع أحداث السياق العربي.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ينقل ضمير الجمع في حالة المفعول غير المباشر بإيجاز طبيعي.
- source_word: Ἔχετε
  choice: عندكم
  rationale: يحافظ على المعنى الخبري المباشر «لديكم»، مع إبقاء احتمال أن يكون الكلام إذنًا بأخذ الحرس دون حسمه.
- source_word: κουστωδίαν
  choice: حرسٌ
  rationale: اللفظة اليونانية الدخيلة من اللاتينية تدل على جماعة حراسة أو نوبة حراسة؛ و«حرس» واضحة وطبيعية.
- source_word: ὑπάγετε
  choice: اذهبوا
  rationale: أمر بالحركة والانصراف، وترجمته المباشرة الطبيعية «اذهبوا».
- source_word: ἀσφαλίσασθε
  choice: أحكِموا تأمينه
  rationale: ينقل معنى جعل الشيء محكمًا ومأمونًا، والضمير يعود سياقيًا إلى القبر.
- source_word: ὡς οἴδατε
  choice: كما تعرفون
  rationale: يحفظ الصياغة اليونانية الموجزة التي قد تشير إلى طريقتهم أو مقدار استطاعتهم، من غير توسيع تفسيري.
theological_decisions:
- issue: هل يهب بيلاطس حرسًا رومانيًا أم يشير إلى حرس متاح لديهم؟
  choice: عندكم حرسٌ
  alternative: 'خذوا حرسًا؛ أو: عندكم حرسكم الخاص'
  rationale: الصيغة اليونانية Ἔχετε يمكن فهمها خبرًا أو إذنًا/أمرًا بحسب المقام. أبقت الترجمة الرئيسة الاحتمالين مفتوحين، وذكرت الحاشية البدائل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «عندكم» بدل «لديكم» لأنه طبيعي في الحوار ويحافظ على غموض العبارة. وأُبقي «كما تعرفون» قريبًا من الأصل، مع توضيح الصياغة البديلة في الحاشية.
