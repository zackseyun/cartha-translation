base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: ar
  text: وكان حتى اللصّان المصلوبان معه يعيّرانه[b] بالطريقة نفسها[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الشيء نفسه»؛ فالتركيب اليوناني يعني أنهما أيضًا عاملاه بالطريقة نفسها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يشتمانه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: وبالطريقة نفسها
  rationale: التركيب اليوناني يؤدي هنا وظيفة حالية، فيحيل إلى نوع التعيير المذكور قبلًا. وهذه الصياغة عربية طبيعية مع إبقاء البديل الحرفي في الحاشية.
- source_word: καὶ
  choice: حتى
  rationale: 'تفيد καί هنا التوكيد والتصعيد: انضم إلى التعيير حتى اللصّان المصلوبان مع يسوع.'
- source_word: οἱ λῃσταὶ
  choice: اللصّان
  rationale: لفظة λῃσταί جمع، لكن المقصود في سياق الصلب شخصان؛ والتثنية العربية أدق وأفصح من الجمع هنا. و«لصّان» واضحة ولا تفرض معنى سياسيًا مثل المتمردين.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: المصلوبان معه
  rationale: يحفظ الوصف معنى اسم المفعول المبني للمجهول ويحدد اللصين بأنهما صُلبا إلى جانب يسوع، من غير إثقال العبارة.
- source_word: ὠνείδιζον
  choice: كان ... يعيّرانه
  rationale: صيغة «كان» مع المضارع تنقل دلالة الماضي الناقص على الفعل المستمر أو المتكرر. و«يعيّرانه» تؤدي معنى التوبيخ المهين بصورة واضحة ومباشرة.
- source_word: αὐτόν
  choice: ـه في «يعيّرانه»
  rationale: ضمير المفعول يعود إلى يسوع، وقد أُدمج طبيعيًا في الفعل العربي.
theological_decisions:
- issue: هل تُلطَّف صيغة المثنى توافقًا مع رواية لوقا عن أحد المجرمين؟
  choice: إبقاء الإسناد صريحًا إلى اللصين كليهما في هذا المشهد
  alternative: صياغة مبهمة أو مفردة تخفف التوتر بين الروايات
  rationale: النص اليوناني يستعمل الجمع صراحة، وفي العربية يدل المثنى على الشخصين المذكورين في سياق الصلب. لذلك يُحفظ عرض متى كما هو من غير مواءمة تفسيرية مع رواية لوقا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت صيغة المثنى الطبيعية لأن السياق يحدد لصين، ووُضعت علامتا الحاشيتين في موضعيهما داخل النص.
