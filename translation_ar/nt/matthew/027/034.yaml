  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: ar
  text: أَعْطَوْهُ خَمْرًا مَمْزُوجَةً بِالْمَرَارَةِ لِيَشْرَبَ[a]، وَلَكِنَّهُ لَمَّا ذَاقَهَا لَمْ يُرِدْ أَنْ يَشْرَبَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية المترجمة «المرارة» العصارةَ الصفراويةَ (المرارة)، أو، بوجه أعم، مادةً مُرّة. يُبقي النص «المرارة» ليعكس لفظ متى؛ وقارن الرواية الموازية في مرقس 15:23، حيث يُذكر المُرّ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: أعطوه ... ليشرب
  rationale: ينقل فعل «أعطى» مع ضمير المفعول غير المباشر وغرض العطاء بصياغة عربية واضحة وطبيعية.
- source_word: οἶνον
  choice: خمرًا
  rationale: هو المقابل العربي المباشر للمصطلح اليوناني العادي الذي يدل على الخمر.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: ممزوجةً بالمرارة
  rationale: ينقل اسم المفعول الدال على المزج، ويعبّر عن χολή بلفظ «المرارة» الذي يحتمل العصارة المُرّة أو، على نحو أعم، مادة مُرّة، من غير تعيين ماهيتها بما يتجاوز النص.
- source_word: καὶ γευσάμενος
  choice: ولكنه لما ذاقها
  rationale: «لما ذاقها» تنقل دلالة اسم الفاعل السابق زمنيًا، و«لكن» تُظهر التقابل السياقي مع عدم الشرب، وإن كانت καί في أصلها أعم من ذلك.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: لم يُرِد أن يشرب
  rationale: يحفظ المعنى الإرادي لفعل θέλω من غير تشديده إلى «رفض».
theological_decisions:
- issue: دلالة χολή وصلتها بالروايات الكتابية عن الآلام
  choice: المرارة
  alternative: العَلْقَم؛ الصفراء؛ مادة مُرّة
  rationale: يمكن أن يدل اللفظ اليوناني على الصفراء أو المرارة، أو على مادة مُرّة بوجه أعم. «المرارة» تحافظ على هذا المجال الدلالي وعلى الصدى الكتابي المحتمل، ولا توحّد نص متى قسرًا مع ذكر المُرّ في مرقس 15:23.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُنّثت الصفات والضمائر العائدة إلى «الخمر» وفق الاستعمال العربي، واستُخدمت «لم يُرِد» للمحافظة على دلالة الإرادة في الأصل.
