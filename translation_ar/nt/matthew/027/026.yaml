  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: ar
  text: حينئذٍ أطلق لهم باراباس، وأما يسوع، فجلده[a] ثم سلّمه ليُصلب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: بعدما جَلَد يسوعَ بالسوط. يشير الفعل اليوناني إلى عقوبة الجلد الرومانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: ظرف زمني يحافظ على تتابع أحداث السرد بصياغة عربية طبيعية وفصيحة.
- source_word: ἀπέλυσεν
  choice: أطلق
  rationale: يدل في هذا السياق القضائي على إطلاق سجين، وهو التعبير العربي الموجز والدقيق.
- source_word: αὐτοῖς
  choice: لهم
  rationale: تنقل اللام معنى كون الجمع متلقّي الإطلاق أو المستفيدين منه، مع إبقاء مرجع الضمير كما في السياق.
- source_word: Βαραββᾶν
  choice: باراباس
  rationale: نقل صوتي للاسم بحسب الصيغة العربية الشائعة.
- source_word: δὲ
  choice: وأما
  rationale: تبرز المقابلة بين إطلاق باراباس وما فُعل بيسوع، من غير جعل الرابط أشد من دلالة اليونانية.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم.
- source_word: φραγελλώσας
  choice: فجلده
  rationale: اسم الفاعل الماضي يدل طبيعيًا على فعل سابق للفعل الرئيس؛ وتعاقب «فجلده ثم سلّمه» يوضح هذا الترتيب بلغة عربية جارية. والفعل يشير إلى عقوبة الجلد الرومانية.
- source_word: παρέδωκεν
  choice: سلّمه
  rationale: يحفظ معنى تسليم شخص للسلطة أو للمصير المذكور، ويلائم السياق القضائي.
- source_word: ἵνα σταυρωθῇ
  choice: ليُصلب
  rationale: تنقل لام التعليل مع المبني للمجهول غرض التسليم أو نتيجته المقصودة بإيجاز طبيعي.
theological_decisions:
- issue: ترتيب الجلد والتسليم والفاعل فيهما
  choice: جلد بيلاطس يسوع أولًا، ثم سلّمه ليُصلب.
  alternative: سلّم بيلاطس يسوع، ثم جرى جلده بعد التسليم.
  rationale: صيغة φραγελλώσας، وهي اسم فاعل ماضٍ مرتبط بفاعل παρέδωκεν نفسه، تدل في القراءة الطبيعية على أن الجلد سبق التسليم. تُبقي الترجمة هذا الترتيب والفاعل النحوي من غير إضافة تفصيل عن منفّذي الجلد فعليًا أو الإجراءات الرومانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «وأما» لإظهار المقابلة، و«فجلده ثم سلّمه» لإبراز ترتيب الفعلين من دون تركيب حرفي ثقيل. وُضع مؤشر الحاشية بعد «فجلده» حيث يتصل تفسير المصطلح مباشرة.
