  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: ar
  text: 'أما الباقون فقالوا[a]: «دَعْه وشأنه[b]. لنرَ هل يأتي إيليا لينقذه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأما الآخرون فكانوا يقولون». قد تفيد صيغة الفعل اليوناني استمرار القول أو تكراره.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «دَعْ». والمفعول به مفهوم من السياق. ويمكن ترجمة ما يلي: «لنرَ إن كان إيليا آتيًا لينقذه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: أما الباقون
  rationale: تنقل «الباقون» معنى الذين ظلوا في مقابل الشخص أو الأشخاص المذكورين قبلًا، وتُظهر «أما» الانتقال والمقابلة اللذين تفيدهما δέ بصياغة عربية طبيعية.
- source_word: ἔλεγον
  choice: فقالوا
  rationale: الماضي الناقص اليوناني قد يدل على قول مستمر أو متكرر، لكن «فقالوا» هو الأسلوب القصصي العربي الطبيعي هنا من غير مبالغة في تحديد هيئة الفعل؛ وترد الصيغة البديلة في الحاشية.
- source_word: Ἄφες
  choice: دَعْه وشأنه
  rationale: الفعل أمر للمفرد ومعناه الحرفي «دَعْ/اترك». والمفعول غير مصرّح به في اليونانية، لكن السياق يدل على الكف عن التدخل وترك يسوع، فجاءت العبارة العربية واضحة وطبيعية.
- source_word: ἴδωμεν
  choice: لنرَ
  rationale: صيغة تحضيض للمتكلم الجمع، وتقابلها في العربية صيغة الأمر بلام الأمر «لنرَ».
- source_word: εἰ ἔρχεται
  choice: هل يأتي
  rationale: تدخل εἰ هنا على سؤال غير مباشر، وتقابلها «هل». ويحافظ المضارع «يأتي» على صيغة الحاضر اليونانية مع إمكان دلالته السياقية على المستقبل القريب.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية الكتابية الشائعة لاسم النبي.
- source_word: σώσων αὐτόν
  choice: لينقذه
  rationale: اسم الفاعل الدال على المستقبل يبيّن غرض المجيء. و«ينقذه» يعبّر بوضوح عن النجاة الجسدية المقصودة مباشرة في مشهد الصلب، من غير أن يلغي الصدى الأوسع للفعل اليوناني σῴζω.
theological_decisions:
- issue: الدلالات اللاهوتية المحتملة للفعل σῴζω في سياق الصلب
  choice: لينقذه
  alternative: ليخلّصه
  rationale: يتحدث القائلون في المستوى القصصي المباشر عن إنقاذ يسوع الظاهر من الموت على الصليب، لا عن تقرير عقائدي بشأن الخلاص الأبدي. واختيار «ينقذه» يوضح هذا المعنى المباشر، مع إبقاء مفارقة المشهد قائمة من غير إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية موقرة. استُخدمت «لنرَ» بوصفها صيغة عربية موجزة وطبيعية للتحضيض، وحُفظ السؤال غير المباشر وصيغة المضارع من غير حسم زائد لدلالته الزمنية.
