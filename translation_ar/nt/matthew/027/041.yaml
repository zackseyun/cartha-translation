base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: ar
  text: 'وبالمثل[a]، كان رؤساء الكهنة أيضًا يستهزئون به مع الكتبة والشيوخ، ويقولون:'
  philosophy: optimal-equivalence
  footnotes:
