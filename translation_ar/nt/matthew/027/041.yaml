    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: وعلى النحو نفسه
  rationale: تؤدي معنى المماثلة مع استهزاء المذكورين في السياق السابق، وهي عبارة عربية واضحة وطبيعية.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد إضافة رؤساء الكهنة إلى الذين سبق ذكر استهزائهم، لا مجرد الربط.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للسلطات الكهنوتية العليا بصيغة الجمع، من غير الإيحاء بتعدد شاغلي منصب رئيس كهنة واحد.
- source_word: ἐμπαίζοντες
  choice: يستهزئون به
  rationale: ينقل معنى السخرية المهينة، وقد صُرّح بالمفعول «به» اعتمادًا على السياق المباشر الذي يتحدث عن يسوع.
- source_word: μετὰ
  choice: مع
  rationale: تدل مع المجرور على المصاحبة والاشتراك؛ والتركيب العربي يُفهم منه اشتراك الكتبة والشيوخ في الاستهزاء.
- source_word: γραμματέων
  choice: الكتبة
  rationale: المقابل المباشر والمستقر لهذا المصطلح في سياق الأناجيل، وهو أقل تفسيرًا من «معلمي الشريعة».
- source_word: πρεσβυτέρων
  choice: الشيوخ
  rationale: يحفظ الدلالة المؤسسية على قادة اليهود المعترف بهم، لا مجرد كبار السن.
- source_word: ἔλεγον
  choice: قائلين
  rationale: تركيب عربي طبيعي يربط الاستهزاء بالكلام الآتي، ويؤدي وظيفة الفعل الناقص الدال على الكلام الجاري في السياق.
theological_decisions:
- issue: تحديد المشاركين في الاستهزاء
  choice: يفيد النص أن رؤساء الكهنة والكتبة والشيوخ اشتركوا في الاستهزاء بيسوع.
  alternative: قد تُفهم العبارة فهمًا أضعف، أي إن رؤساء الكهنة استهزؤوا به بحضور الكتبة والشيوخ فحسب.
  rationale: استعمال μετὰ مع المضاف إليه يدل في هذا السياق على المصاحبة والاشتراك على نحو أرجح من مجرد الحضور، من غير إضافة تقرير عقائدي إلى السرد.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة سردية وقورة. حُفظ كل من معنى المماثلة في ὁμοίως والمعنى الإضافي في καὶ، مع تجنب العبارة الثقيلة «وكذلك أيضًا». واستُعمل «قائلين» لصياغة عربية سلسة تمهّد مباشرة للقول الوارد في العدد التالي.
