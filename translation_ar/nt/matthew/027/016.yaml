lexical_decisions:
- source_word: εἶχον
  choice: كان عندهم
  rationale: يحافظ على معنى الحيازة أو الاحتجاز في صيغة الماضي الناقص، مع إبقاء الفاعل الجمع غير المصرّح به كما في اليونانية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تلائم استمرار السرد، من غير تحميلها معنى زمنيًا زائدًا.
- source_word: τότε
  choice: في ذلك الوقت
  rationale: ينقل الدلالة الزمنية الصريحة بوضوح.
- source_word: δέσμιον
  choice: سجين
  rationale: مقابل عربي واضح وطبيعي لمن هو رهن الاحتجاز في هذا السياق القضائي.
- source_word: ἐπίσημον
  choice: سيّئ الصيت
  rationale: ينقل معنى الشهرة السلبية المرجح في سياق الحديث عن السجين، مع أن معنى «مشهور» المحايد ممكن معجميًا.
- source_word: λεγόμενον
  choice: يُدعى
  rationale: تعبير عربي طبيعي لإدخال اسم الشخص.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: يسوع باراباس
  rationale: يتبع نص SBLGNT المعطى، الذي يثبت اسم «يسوع» قبل «باراباس».
theological_decisions:
- issue: الصيغة النصية لاسم باراباس الكامل
  choice: 'إثبات «يسوع» في المتن: «يسوع باراباس».'
  alternative: قراءة «باراباس» وحدها من دون «يسوع».
  rationale: النص اليوناني المعطى يقرأ Ἰησοῦν Βαραββᾶν، ولذلك تُترجم هذه القراءة في المتن، بينما تُحفظ القراءة الأقصر بوصفها اختلافًا نصيًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «سيّئ الصيت» بدل «مشهور» لإظهار الدلالة السلبية المرجحة لـἐπίσημον في السياق، من غير إضافة وصف لا يسنده النص.
