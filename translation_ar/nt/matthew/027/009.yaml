  to: 'حينئذ تمّ ما قيل على لسان إرميا النبي[a]، قائلًا: «وأخذوا الثلاثين قطعةً من الفضة، ثمنَ الشخص الذي قُدِّر له ثمن[b]، الذي قدّروا له ثمنًا من بني إسرائيل».'
