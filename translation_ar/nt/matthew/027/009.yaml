source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: ar
  text: 'حينئذ تمّ ما قيل على لسان إرميا النبي[a]، قائلًا: «وأخذوا الثلاثين قطعةً من الفضة، ثمنَ الشخص الذي قُدِّر له ثمن[b]، الذي قدّروا له ثمنًا من بني إسرائيل».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ينسب متى هذا القول النبوي إلى إرميا. وألفاظه أقرب ما تكون إلى زكريا 11:12–13. وقد فُسِّر ذلك بطرق مختلفة، منها أنه اقتباس مركب، أو إحالة إلى مجموعة نبوية، أو إشكال في انتقال النص.
    reason: textual_variant
  - marker: b
    text: 'يمكن أيضًا فهم العبارة: «ثمنَ الشخص الذي جُعل له ثمن». أما عبارة «من بني إسرائيل» في اليونانية فعسيرة، وقد تُفهم بمعنى «بعض بني إسرائيل» أو «من قِبل بني إسرائيل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني يربط الحدث بما سبقه في السرد، وهو موجز وطبيعي في العربية الفصحى.
- source_word: ἐπληρώθη
  choice: تمّ
  rationale: يحافظ على صيغة الإتمام المألوفة عند متى من غير توسع تفسيري.
- source_word: τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου
  choice: ما قيل على لسان إرميا النبي
  rationale: تعبير عربي طبيعي يحفظ معنى الوساطة النبوية الذي تؤديه διά مع المضاف إليه.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: الثلاثين قطعةً من الفضة
  rationale: يبيّن أن المقصود نقود أو قطع فضية، لا الفضة المجردة.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: ثمنَ من قُدِّر ثمنه
  rationale: يحفظ السياق التجاري وصلة الاشتقاق بين τιμή وτιμάω، مع إبقاء الإشارة إلى الشخص.
- source_word: ὃν ἐτιμήσαντο
  choice: الذي قدَّروا ثمنه
  rationale: يكرر تعبير تقدير الثمن كما يكرر اليوناني فعل τιμάω، محافظًا على المفارقة اللفظية.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: من بني إسرائيل
  rationale: ترجمة قريبة تحافظ على غموض تعلق الجار والمجرور وعلى دلالة ἀπό دون فرض قراءة «بعض» في المتن.
theological_decisions:
- issue: نسبة القول إلى إرميا مع أن صياغته أقرب إلى زكريا 11:12–13
  choice: إبقاء «إرميا النبي» في المتن كما في النص اليوناني
  alternative: تبديل الاسم إلى زكريا، أو شرح الاقتباس المركب داخل المتن
  rationale: يمثل النص اليوناني كما هو، ولا يحسم إشكال النسبة عن طريق التنقيح أو المواءمة.
- issue: تحديد المقصود بعبارة ἀπὸ υἱῶν Ἰσραήλ
  choice: من بني إسرائيل
  alternative: بعض بني إسرائيل؛ أو من قِبل بني إسرائيل
  rationale: التركيب اليوناني عسير ويحتمل أكثر من علاقة نحوية؛ لذلك حُفظ الغموض النسبي في المتن وذُكرت البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «على لسان» للتعبير الطبيعي عن الوساطة النبوية، وحُفظ تكرار معنى تقدير الثمن لإبراز الصلة اللفظية والمفارقة في الأصل. جميع علامتي الحاشية [a] و[b] واردتان في المتن.
