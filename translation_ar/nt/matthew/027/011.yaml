source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: ar
  text: 'وقف يسوع أمام الوالي، فسأله الوالي قائلًا: «أأنت ملك اليهود[a]؟» فقال يسوع: «أنت تقول[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملك أهل اليهودية». فاللفظ اليوناني قد يدل على اليهود عمومًا، وقد يدل في بعض السياقات على أهل منطقة اليهودية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أنت قلت»، أو: «هو كما تقول». جواب يسوع في اليونانية موجز وفيه شيء من الإضمار.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: وقف
  rationale: ينقل الفعل بصيغة لازمة طبيعية في العربية؛ أما «أُوقِف» فتضيف معنى التسبب الذي لا يصرّح به السياق، و«كان واقفًا» توحي باستمرار الحدث أكثر مما تقتضيه صيغة الماضي اليونانية.
- source_word: ἔμπροσθεν
  choice: أمام
  rationale: تعبير موجز وطبيعي يحفظ المشهد الرسمي والقضائي.
- source_word: ἡγεμών / ἡγεμόνος
  choice: الوالي
  rationale: هو المقابل العربي المألوف لمسؤول الحكم الروماني في هذا السياق، وأوضح للقارئ العام من لقب إداري تقني مثل «الحاكم العسكري» أو «المحافظ».
- source_word: ἐπηρώτησεν
  choice: سأله
  rationale: يؤدي معنى توجيه السؤال بوضوح وطبيعية. والسياق القضائي نفسه يبيّن أن السؤال رسمي، فلا حاجة إلى لفظ أقوى مثل «استجوبه».
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ بنية اسم الفاعل اليونانية في صياغة عربية فصيحة وطبيعية.
- source_word: βασιλεὺς
  choice: ملك
  rationale: المقابل المباشر للقب الملكي، من غير إضافة تفسير عقائدي أو سياسي.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: هو المعنى الأشيع والأوضح في صيغة الاتهام السياسية ضمن رواية الآلام، مع إثبات البديل الجغرافي-الإقليمي الممكن في الحاشية.
- source_word: ἔφη
  choice: فقال
  rationale: ينقل فعل القول المباشر، وتربط الفاء الجواب بالسؤال ربطًا عربيًا طبيعيًا دون إضافة معنى زائد مثل «أعلن».
- source_word: Σὺ λέγεις
  choice: أنت تقول
  rationale: يحافظ على إيجاز العبارة اليونانية وإضمارها، فلا يحولها إلى إثبات صريح تمامًا ولا إلى إنكار.
theological_decisions:
- issue: دلالة جواب يسوع Σὺ λέγεις
  choice: 'صياغة مقتضبة تحتفظ بالتوتر: «أنت تقول».'
  alternative: «هو كما تقول» أو «نعم، كما تقول».
  rationale: النص اليوناني يقدّم جوابًا محسوبًا لا ينفي اللقب، لكنه لا يعيد تقريره بصياغة الوالي السياسية تصريحًا كاملًا. لذلك تُركت العبارة موجزة مع توضيح البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أأنت» بدل «هل أنت» للاختصار والمحافظة على حدة السؤال المباشر، وأُبقي جواب يسوع على إيجازه غير المعتاد نسبيًا لأن هذا الإيجاز ذو دلالة في الأصل.
