  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: ar
  text: 'قائلين: «يا سيدي، تذكَّرنا أن ذلك المُضلِّل قال وهو لا يزال حيًّا[b]: ‹بعد ثلاثة أيام أقوم[a]›».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بعد ثلاثة أيام سأقوم» أو «بعد ثلاثة أيام سأُقام». جاء الفعل اليوناني بصيغة المضارع، ويمكن فهمه بمعنى «أقوم» أو «أُقام».'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا ترتيب العبارة: «أن ذلك المُضلِّل، وهو لا يزال حيًّا، قال».'
    reason: previous_rendering
lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي يربط كلام المتحدثين بما قبله، وتحافظ «قائلين» على هذه الصلة النحوية بوضوح.
- source_word: Κύριε
  choice: يا سيدي
  rationale: نداء احترام موجَّه إلى بيلاطس؛ «يا سيدي» عربية طبيعية تنقل اللقب من غير أن توحي هنا بإقرار بألوهيته.
- source_word: ἐμνήσθημεν
  choice: تذكَّرنا
  rationale: يحافظ الماضي على صيغة الفعل اليوناني، مع بقاء أثر التذكّر حاضرًا في الطلب الذي يقدّمونه.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: ذلك المُضلِّل
  rationale: «ذلك» تنقل نبرة الإبعاد، و«المُضلِّل» تدل على من يقود غيره إلى الضلال، بما يلائم لهجة المتكلمين العدائية.
- source_word: ἔτι ζῶν
  choice: وهو لا يزال حيًّا
  rationale: تعبير عربي واضح وطبيعي يحدد أن القول صدر قبل موته.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: بعد ثلاثة أيام
  rationale: ينقل المعنى المعتاد لـ μετά مع النصب كما ورد، من غير مواءمته بصيغة «في اليوم الثالث» الواردة في مواضع أخرى.
- source_word: ἐγείρομαι
  choice: أقوم
  rationale: المضارع اليوناني يحتمل معنى النهوض بصيغة وسطى/لازمة أو معنى الإقامة بصيغة المبني للمجهول. «أقوم» عربية سليمة في الاقتباس النبوي وتحافظ على صيغة المضارع، مع بيان احتمال المبني للمجهول في الحاشية.
theological_decisions:
- issue: صياغة نبوءة يسوع المقتبسة عن القيامة
  choice: بعد ثلاثة أيام أقوم
  alternative: بعد ثلاثة أيام سأُقام / سأقوم
  rationale: حُفظ المضارع الوارد في اليونانية، ولم تُستبدل به صيغة «في اليوم الثالث» توفيقًا مع نصوص أخرى. ولأن ἐγείρομαι يحتمل دلالة وسطى أو مبنية للمجهول، ذُكر الاحتمالان في الحاشية بدل حسمهما لاهوتيًا داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل «يا سيدي» خطابًا محترمًا لبيلاطس، و«المُضلِّل» لإبقاء النبرة العدائية في كلام رؤساء الكهنة والفريسيين. وُضعت علامة الحاشية [a] عند العبارة التي تشرحها مباشرة، لا عند «قائلين».
