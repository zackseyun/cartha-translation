  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: ar
  text: لكن رؤساء الكهنة والشيوخ أقنعوا الجموع بأن يطلبوا باراباس، وأن يُهلكوا يسوع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: يقتلوا يسوع.'
    reason: بديل معجمي يوضح دلالة «يُهلكوا» في السياق القضائي.
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة هنا انتقالًا ذا قوة استدراكية في سياق السرد، و«لكن» تنقل هذا التقابل بوضوح.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: هذا هو التعبير العربي المألوف والدقيق للقيادة الكهنوتية في أورشليم، لا لكاهن أعظم واحد.
- source_word: πρεσβύτεροι
  choice: الشيوخ
  rationale: يشير اللفظ هنا إلى قادة معترف بهم في الجماعة، وتحافظ «الشيوخ» على دلالته التاريخية والمؤسسية.
- source_word: ἔπεισαν
  choice: أقنعوا
  rationale: ينقل الفعل تأثير القادة في الجموع حتى تتبنى الطلب المقصود، وهو تعبير عربي طبيعي مباشر.
- source_word: ὄχλους
  choice: الجموع
  rationale: تحافظ «الجموع» على صيغة الجمع وعلى معنى جماعات الناس المحتشدة.
- source_word: ἵνα
  choice: بأن
  rationale: بعد فعل الإقناع، تقدّم «بأن» مضمون ما أُقنعت الجموع بفعله بسلاسة في العربية.
- source_word: αἰτήσωνται
  choice: يطلبوا
  rationale: ينقل الفعل معنى أن يطلبوا باراباس لأنفسهم أو لمصلحتهم، من غير إضافة لفظ «إطلاق» غير الوارد صراحة في اليونانية.
- source_word: Βαραββᾶν
  choice: باراباس
  rationale: نقل صوتي للاسم وفق صورته العربية الشائعة.
- source_word: ἀπολέσωσιν
  choice: يُهلكوا
  rationale: يحافظ على المعنى الأوسع للفعل، أي التسبب في الهلاك، ولا يضيّقه ابتداءً إلى مصطلح تقني للإعدام؛ ويوضح الهامش المعنى الذي يقتضيه السياق القضائي.
- source_word: τὸν δὲ Ἰησοῦν
  choice: وبأن يُهلكوا يسوع
  rationale: تُظهر الواو المقابلة العملية بين طلب باراباس وإهلاك يسوع، مع تكرار «بأن» لتوضيح أن الفعلين كليهما مضمون الإقناع.
theological_decisions:
- issue: دلالة ἀπολέσωσιν في سياق حكم قضائي
  choice: يُهلكوا يسوع
  alternative: يقتلوا يسوع؛ أو يطلبوا قتل يسوع
  rationale: الفعل اليوناني أوسع من التعبير الاصطلاحي عن الإعدام، ومعناه التسبب في الهلاك. يحافظ المتن على هذا الاتساع، بينما يبيّن الهامش الدلالة الملموسة التي يحملها الفعل في هذا السياق، من غير حسم زائد لطريقة التنفيذ.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. استُخدم «الجموع» بدل «الحشود» لمناسبته للسرد الكتابي المعاصر، وحُفظت دلالة الفعل اليوناني الأوسع في المتن مع توضيحها في الهامش.
