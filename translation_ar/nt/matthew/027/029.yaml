lexical_decisions:
- source_word: πλέξαντες
  choice: بعدما ضفروا
  rationale: ينقل اسم الفاعل اليوناني الدال على فعل سابق للفعل الرئيس، ويعبّر طبيعيًا عن ترتيب الحدثين.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: إكليلًا من شوك
  rationale: «إكليل» ملائم لسياق المحاكاة الساخرة للملوكية، و«من شوك» تحفظ مادة صنعه دون زيادة تفسيرية.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: وضعوه على رأسه
  rationale: ترجمة مباشرة وطبيعية لعبارة الوضع على الرأس.
- source_word: κάλαμον
  choice: قصبةً
  rationale: تحفظ الصورة الحسية للكلمة اليونانية من غير تحويلها تفسيريًا إلى «صولجان»، مع أن السياق يوحي باستعمالها صولجانًا ساخرًا.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: في يده اليمنى
  rationale: صياغة عربية طبيعية تحدد موضع القصبة كما في المصدر.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: جثوا أمامه
  rationale: «جثوا» تنقل الركوع على الركبتين، و«أمامه» تحفظ مشهد التكريم الملكي الزائف.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: هزأوا به
  rationale: تعبير عربي فصيح وواضح ينقل السخرية والازدراء في سياق رسمي.
- source_word: Χαῖρε
  choice: السلام عليك
  rationale: تحية عربية طبيعية ذات نبرة رسمية، وتلائم هنا التحية الملكية الساخرة دون ترجمتها حرفيًا بمعنى «افرح».
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: يا ملك اليهود
  rationale: صيغة النداء تنقل حالة المنادى في اليونانية، و«اليهود» تؤدي المعنى الأوسع للقب في سياق المحاكمة والآلام، مع إثبات البديل الجغرافي في الحاشية.
theological_decisions:
- issue: الحفاظ على مفارقة التحية الملكية الساخرة
  choice: «السلام عليك يا ملك اليهود!»
  alternative: «مرحبًا يا ملك اليهود!»
  rationale: «السلام عليك» تحافظ على وقار التحية الشكلي الذي يستعمله الجنود تهكمًا، فلا تُضعف دلالة المشهد الملكية ولا تشرح المفارقة داخل النص.
- issue: دلالة Ἰουδαίων في اللقب
  choice: «اليهود»
  alternative: «أهل اليهودية»
  rationale: يمكن للفظ اليوناني أن يدل على اليهود أو على أهل اليهودية. وفي صيغة اللقب الواردة في رواية الآلام، تؤدي «اليهود» الدلالة القومية الدينية الأوسع والأشيع، مع إبقاء الاحتمال الجغرافي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «قصبة» بدل «صولجان» للمحافظة على الصورة الأصلية، و«إكليل» لإبراز سياق الملكية الساخرة من غير مبالغة تفسيرية.
