    reason: aspectual_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: في الحال
  rationale: تعبير عربي واضح وطبيعي ينقل معنى المبادرة الفورية.
- source_word: δραμὼν
  choice: ركض
  rationale: حُوِّل اسم الفاعل اليوناني الدال على فعل سابق إلى فعل سردي معطوف، حفاظًا على سلاسة العربية وتسلسل الأفعال.
- source_word: εἷς ἐξ αὐτῶν
  choice: واحد منهم
  rationale: المقابل العربي الطبيعي للتركيب التبعيضي، ويُبقي هوية الجماعة غير محددة كما في اليونانية.
- source_word: λαβὼν σπόγγον
  choice: أخذ إسفنجة
  rationale: صياغة فعلية طبيعية تنقل الفعل السابق في سلسلة الأحداث.
- source_word: πλήσας τε ὄξους
  choice: ملأها خمرًا حامضة
  rationale: ὄξος يدل على خمر حامضة أو خلّ الخمر؛ و«خمرًا حامضة» أوضح للقارئ بوصفها شرابًا، مع إثبات البديل في الحاشية.
- source_word: περιθεὶς καλάμῳ
  choice: وضعها على قصبة
  rationale: ينقل المعنى المباشر لتركيب الإسفنجة على قصبة، من غير استبدال القصبة بعصا عامة.
- source_word: ἐπότιζεν αὐτόν
  choice: جعل يسقيه
  rationale: ينقل صيغة الماضي الناقص اليونانية بوصف الفعل جاريًا أو متكررًا، بدل اختزاله بالضرورة إلى حدث لحظي واحد.
theological_decisions:
- issue: طبيعة الشراب المقدَّم ليسوع
  choice: خمر حامضة
  alternative: خلّ الخمر
  rationale: اللفظة اليونانية ὄξος تحتمل الخمر التي حمضت وخلّ الخمر؛ اختير التعبير الأوضح بوصفه شرابًا، مع إبقاء البديل المعجمي في الحاشية.
- issue: دلالة الماضي الناقص في ἐπότιζεν
  choice: جعل يسقيه
  alternative: سقاه
  rationale: الصيغة المختارة تحفظ المنظور الاستمراري أو المحاولة الجارية الذي قد تدل عليه صيغة الماضي الناقص، من غير الجزم بمدة الفعل أو نجاحه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة سردية كريمة. استُخدمت سلسلة من الأفعال المعطوفة بدل محاكاة أسماء الفاعل اليونانية حرفيًا، مع الحفاظ على ترتيب الأفعال وعلى عدم تحديد هوية الشخص أو الجماعة.
