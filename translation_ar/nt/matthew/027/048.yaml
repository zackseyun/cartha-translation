  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: ar
  text: وفي الحال ركض واحد منهم، وأخذ إسفنجة وملأها خمرًا حامضة[a]، ووضعها على قصبة، وكان يسقيه[b].
