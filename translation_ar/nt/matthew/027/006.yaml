  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: ar
  text: 'أَمَّا رُؤَسَاءُ الْكَهَنَةِ، فَأَخَذُوا قِطَعَ الْفِضَّةِ وَقَالُوا: «لَا يَحِلُّ أَنْ نَضَعَهَا فِي خِزَانَةِ الْهَيْكَلِ[a]، لِأَنَّهَا ثَمَنُ دَمٍ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: κορβανᾶν (كوربان)، والمقصود خزانة الهيكل أو أمواله المقدسة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مالُ دمٍ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: رُؤَسَاءُ الْكَهَنَةِ
  rationale: التعبير العربي المألوف للسلطات الكهنوتية العليا بصيغة الجمع، وهو أدق في هذا السياق من «كبار الكهنة».
- source_word: λαβόντες
  choice: فَأَخَذُوا
  rationale: ينقل اسم الفاعل الماضي اليوناني إلى فعل عربي طبيعي يدل على الفعل المصاحب السابق للقول من غير إثقال الأسلوب.
- source_word: τὰ ἀργύρια
  choice: قِطَعَ الْفِضَّةِ
  rationale: يحافظ على الإشارة المحسوسة إلى المال الفضي المذكور في السياق، من غير افتراض فئة نقدية محددة لا يذكرها النص هنا.
- source_word: Οὐκ ἔξεστιν
  choice: لَا يَحِلُّ
  rationale: يعبر بوضوح عن عدم الجواز الشرعي أو الديني الذي يقصده الكهنة، لا عن مجرد تعذر الفعل.
- source_word: βαλεῖν
  choice: أَنْ نَضَعَهَا
  rationale: «نضع» هو المقابل الطبيعي في سياق إيداع المال في الخزانة، ولا يفرض المعنى الحرفي الأشد لـ«يطرح».
- source_word: κορβανᾶν
  choice: خِزَانَةِ الْهَيْكَلِ
  rationale: يوضح المقصود للقارئ الحديث، أي الخزانة المقدسة التابعة للهيكل، مع حفظ اللفظ اليوناني المنقول في الحاشية.
- source_word: ἐπεὶ
  choice: لِأَنَّهَا
  rationale: ينقل العلاقة السببية المباشرة بين المنع وكون المال ثمن دم.
- source_word: τιμὴ αἵματός
  choice: ثَمَنُ دَمٍ
  rationale: ترجمة قريبة من تركيب الأصل وتحفظ حدته وإيجازه، بدل تفسيره صراحة بأنه أجر على سفك الدم.
theological_decisions:
- issue: كيفية نقل κορβανᾶν مع إبقاء دلالته الدينية واضحة
  choice: خِزَانَةِ الْهَيْكَلِ
  alternative: القُرْبان / الخزانة
  rationale: المقصود هنا موضع الأموال المقدسة في الهيكل. ترجمة الدلالة أوضح من نقل اللفظ صوتيًا، بينما تتيح الحاشية حفظ المصطلح الأصلي من غير تحميله معنى مذهبيًا.
- issue: كيفية نقل τιμὴ αἵματός من غير إزالة غموضه الأخلاقي والقانوني
  choice: ثَمَنُ دَمٍ
  alternative: مالُ دمٍ / ثمنُ سفكِ دمٍ
  rationale: «ثمن دم» يحافظ على صورة الأصل وعلى التوتر في كلام الكهنة؛ أما «ثمن سفك دم» فيصرح بتفسير لا يصرح به التركيب اليوناني نفسه.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «لا يحل» لإبراز الجواز الديني، و«ثمن دم» للمحافظة على إيجاز الأصل وصورته. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحهما مباشرة.
