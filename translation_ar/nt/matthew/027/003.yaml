  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: ar
  text: حينئذ، لما رأى يهوذا، الذي سلّمه، أن يسوع قد حُكم عليه، ندم وأعاد الثلاثين قطعة من الفضة إلى رؤساء الكهنة والشيوخ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية تربط الحدث بما سبقه، و«حينئذ» فصيحة وطبيعية في السرد.
- source_word: ἰδὼν
  choice: لما رأى
  rationale: اسم الفاعل الماضي يفيد هنا الظرف الزمني؛ وتحويله إلى جملة زمنية يجعل العربية واضحة من غير تغيير في تسلسل الحدث.
- source_word: Ἰούδας
  choice: يهوذا
  rationale: الصيغة العربية المألوفة للاسم في التراث الكتابي.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: الذي أسلمه
  rationale: يحافظ على المعنى المباشر لـπαραδίδωμι، أي تسليمه إلى السلطات، من غير أن يفقد دلالة الخيانة التي يوضحها السياق.
- source_word: ὅτι κατεκρίθη
  choice: أنه قد حُكم عليه
  rationale: ينقل مضمون ما رآه يهوذا، ويحافظ على المبني للمجهول وعلى سبق صدور الحكم.
- source_word: μεταμεληθεὶς
  choice: ندم
  rationale: يفيد الأسف والندم، ولا يحمّل اللفظ معنى التوبة الروحية الكاملة التي قد توحي بها ألفاظ أخرى.
- source_word: ἔστρεψεν
  choice: أعاد
  rationale: المعنى السياقي هو ردّ المال إلى من أخذه منهم؛ و«أعاد» طبيعية ومحددة.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: قطع الفضة الثلاثين
  rationale: ἀργύρια تدل على مال فضي أو قطع فضية دون تحديد فئة نقدية بعينها؛ لذا تتجنب الصياغة الجزم بأنها عملات محددة.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: إلى رؤساء الكهنة والشيوخ
  rationale: المقابل العربي المستقر للجماعتين القياديتين في هذا السياق.
theological_decisions:
- issue: دلالة μεταμεληθεὶς في استجابة يهوذا
  choice: ندم
  alternative: تاب؛ غيّر رأيه
  rationale: الفعل يدل على الندم أو الأسف، ولا يقتضي وحده توبة روحية كاملة؛ لذلك تُترك مسألة حال يهوذا اللاهوتية بلا حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت جملة زمنية لتفادي تراكم التراكيب الاعتراضية، مع إبقاء المبني للمجهول والغموض المقصود في هوية من أصدر الحكم ضمن السياق.
