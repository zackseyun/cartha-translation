base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: ar
  text: وإذا حجابُ الهيكل قد انشقَّ إلى قسمين، من أعلى إلى أسفل، واهتزَّت الأرض، وتشقَّقت الصخور.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: تؤدي وظيفة لفت الانتباه إلى حدث مفاجئ في سياق سردي مهيب، وهي أفصح وأطبع هنا من «هوذا» مع الحفاظ على القوة الدرامية.
- source_word: καταπέτασμα
  choice: حجاب
  rationale: «حجاب الهيكل» تعبير عربي واضح ومألوف للحاجز النسيجي داخل المقدس، ويحافظ على دلالة الستار الفاصل.
- source_word: ναοῦ
  choice: الهيكل
  rationale: يدل ναός هنا على المقدس، لا على مجمّع الهيكل كله؛ لكن تركيب «حجاب الهيكل» طبيعي في العربية، مع بيان الدقة الممكنة في الحاشية.
- source_word: ἐσχίσθη
  choice: انشقَّ
  rationale: يحافظ على وقوع الحدث من غير تعيين فاعل صريح، ويلائم الحجاب في العربية.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: من أعلى إلى أسفل
  rationale: مقابل عربي طبيعي ودقيق يحفظ اتجاه الانشقاق المؤكد في النص.
- source_word: εἰς δύο
  choice: إلى اثنين
  rationale: يحفظ صراحةً انقسام الحجاب إلى قسمين، مع تركيب عربي مباشر.
- source_word: ἡ γῆ
  choice: الأرض
  rationale: يحفظ المجال الدلالي الواسع للفظة، وهو ملائم لسياق العلامات المصاحبة لموت يسوع، من دون حصرها في التربة أو المنطقة.
- source_word: ἐσείσθη
  choice: اهتزَّت
  rationale: صياغة عربية طبيعية تصف حركة الأرض وتحفظ معنى الفعل من غير تكلّف المبني للمجهول.
- source_word: πέτραι
  choice: الصخور
  rationale: أنسب من «الحجارة» للدلالة على الكتل الصخرية التي تتشقق في سياق زلزالي.
- source_word: ἐσχίσθησαν
  choice: تشقَّقت
  rationale: يلائم الصخور طبيعيًا، ويعكس تكرار جذر σχίζω دلاليًا من دون فرض تطابق لفظي مصطنع.
theological_decisions:
- issue: دلالة انشقاق حجاب الهيكل
  choice: نقل الحدث كما يورده النص من غير تفسير رمزي مضاف.
  alternative: تفسيره صراحةً بوصفه فتحًا لطريق الوصول إلى الله أو حكمًا على نظام الهيكل.
  rationale: الآية تصف الحدث والعلامات المصاحبة ولا تشرح مدلوله اللاهوتي مباشرة؛ لذلك يحفظ النص التوتر التفسيري ولا يحسمه داخل الترجمة.
- issue: الفاعل في انشقاق الحجاب والصخور
  choice: استعمال صيغة لا تسمّي الفاعل صراحةً.
  alternative: إضافة «شقَّه الله» أو نسبة الأحداث إلى فاعل محدد.
  rationale: الأفعال اليونانية مبنية للمجهول ولا تصرّح بالفاعل؛ وتعيينه في الترجمة يضيف تفسيرًا غير ملفوظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية مهيبة. استُعملت «وإذا» لاستحضار المفاجأة، وحُفظ تتابع الجمل بالواو كما في الأصل، مع تجنب الألفاظ التفسيرية أو المذهبية.
