base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: ar
  text: 'أَمَّا بَعْضُ الْوَاقِفِينَ هُنَاكَ، فَلَمَّا سَمِعُوا، كَانُوا يَقُولُونَ: «هَذَا يُنَادِي إِيلِيَّا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يبدو أن الواقفين فهموا صرخة يسوع في الآية السابقة على أنها نداء لإيليا.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς δὲ
  choice: أَمَّا بَعْضُ
  rationale: تنقل «بعض» معنى الجماعة غير المحددة، وتفيد «أمّا» الانتقال السردي مع مقابلة خفيفة بالسياق السابق.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: الْوَاقِفِينَ هُنَاكَ
  rationale: تحافظ على صورة الوقوف في المشهد وعلى الدلالة المكانية من غير تحويلها إلى مجرد «الحاضرين».
- source_word: ἀκούσαντες
  choice: فَلَمَّا سَمِعُوا
  rationale: تعبير عربي طبيعي يدل على أن السماع سبق القول؛ والمسموع مفهوم من صرخة يسوع في الآية السابقة، فلا حاجة إلى مفعول مصطنع.
- source_word: ἔλεγον
  choice: كَانُوا يَقُولُونَ
  rationale: يحفظ الجانب الاستمراري أو التكراري المحتمل لصيغة الماضي الناقص اليونانية من غير مبالغة.
- source_word: Ἠλίαν
  choice: إِيلِيَّا
  rationale: الصيغة العربية الكتابية المألوفة لاسم النبي.
- source_word: φωνεῖ
  choice: يُنَادِي
  rationale: يقابل الفعل في السياق بصورة طبيعية، ويبقي مفتوحًا هل المقصود النداء إليه أم طلب حضوره، دون إضافة حرف جر يحسم العلاقة.
- source_word: οὗτος
  choice: هَذَا
  rationale: يحفظ قوة اسم الإشارة والنبرة الإشارية المباشرة، من غير إضافة «الرجل» غير الموجودة صراحة في الأصل.
theological_decisions:
- issue: هل يدل كلام الواقفين على أن يسوع نادى إيليا بالفعل أم على ما ظنوا أنهم سمعوه؟
  choice: 'صيغ الكلام بوصفه قول الواقفين: «هذا ينادي إيليا».'
  alternative: «إنه يستغيث بإيليا» أو «هذا يطلب إيليا».
  rationale: النص يورد إدراك الواقفين ولا يقرره بوصفه تفسير الراوي. والصياغة المختارة تحفظ المفارقة وسوء الفهم المحتملين من غير أن تضيف حكمًا لاهوتيًا أو تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع تركيب سردي طبيعي. استُخدم «هذا» بدل «هذا الرجل» التزامًا بالمصدر، و«ينادي إيليا» للمحافظة على إيجاز اليونانية وغموض جهة النداء.
