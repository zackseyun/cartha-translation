  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: ar
  text: ولمّا جاء المساء، جاء رجل غني من الرامة اسمه يوسف، وكان هو أيضًا قد صار تلميذًا ليسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان هو أيضًا تلميذًا ليسوع»، أو: «تتلمذ على يد يسوع».'
    reason: يحمل الفعل اليوناني المبني للمجهول معنى الصيرورة تلميذًا، وقد يُفهم أيضًا بمعنى أن شخصًا جُعل تلميذًا؛ لذا تُذكر البدائل من غير حسم زائد.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: ولمّا جاء المساء
  rationale: ترجمة طبيعية للتركيب المطلق الدال على الانتقال الزمني؛ وتحافظ الواو على الصلة السردية التي تؤديها δέ من غير إضافة ظرف غير موجود في الأصل.
- source_word: ἦλθεν
  choice: جاء
  rationale: المقابل السردي المباشر والطبيعي للفعل ἔρχομαι في صيغة الماضي.
- source_word: ἄνθρωπος πλούσιος
  choice: رجل غني
  rationale: تعبير عربي واضح ومباشر يحفظ دلالة الاسم والصفة.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: من الرامة
  rationale: تحفظ «من» دلالة المنشأ في ἀπό، و«الرامة» هي الصيغة العربية الكتابية الشائعة لاسم الموضع Ἁριμαθαία.
- source_word: τοὔνομα Ἰωσήφ
  choice: اسمه يوسف
  rationale: صياغة عربية موجزة وطبيعية تؤدي وظيفة التعريف بالاسم.
- source_word: ὃς καὶ αὐτὸς
  choice: وكان هو أيضًا
  rationale: تحفظ «هو» توكيد αὐτός، وتحفظ «أيضًا» دلالة καί التي تشير إلى أن يوسف كان بدوره من التلاميذ.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: قد صار تلميذًا ليسوع
  rationale: تنقل المعنى المرجح للمبني للمجهول، أي الدخول في التلمذة ليسوع، من غير الجزم بأن يسوع نفسه هو الذي علّمه مباشرة. وتوضح الحاشية الاحتمالات الأخرى.
theological_decisions:
- issue: دلالة ἐμαθητεύθη وعلاقة يوسف بيسوع
  choice: قد صار تلميذًا ليسوع
  alternative: كان تلميذًا ليسوع؛ أو تتلمذ على يد يسوع
  rationale: قد يدل المبني للمجهول على صيرورة الشخص تلميذًا أو على جعله تلميذًا. يثبت السياق انتماء يوسف إلى تلاميذ يسوع، لكنه لا يحسم طريقة دخوله في التلمذة؛ لذلك يحفظ المتن المعنى الأوسع وتذكر الحاشية الاحتمالات الأخرى.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم ترتيب عربي طبيعي مع الإبقاء على توكيد «هو أيضًا»، وتُرك الغموض المتعلق بالفعل ἐμαθητεύθη ظاهرًا في الحاشية.
