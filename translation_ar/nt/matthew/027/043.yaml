    text: 'أو: «إن كان يرضى عنه». تستدعي العبارة مزمور 22: 8، حيث يبرز معنى رضا الله عنه.'
    reason: alternative_reading
  - marker: b
    text: 'يردد هذا التهكم بوضوح صدى مزمور 22: 8، فيربط السخرية من يسوع بالبار المتألم في ذلك المزمور.'
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν
  choice: قد اتكل
  rationale: صيغة الماضي التام اليونانية تدل على ثقة استقرت نتيجة فعل سابق؛ و«قد اتكل» تنقل هذا المعنى بصورة عربية طبيعية.
- source_word: ἐπὶ τὸν θεόν
  choice: على الله
  rationale: حرف الجر مع فعل الثقة يفيد الاعتماد والاتكال على شخص؛ و«اتكل على الله» هو التعبير العربي المألوف.
- source_word: ῥυσάσθω
  choice: فلينقذه
  rationale: فعل أمر ماضٍ من ῥύομαι بمعنى الإنقاذ أو التخليص من الخطر، و«فلينقذه» واضح ويلائم التحدي الساخر.
- source_word: νῦν
  choice: الآن
  rationale: يحفظ التشديد الزمني على فورية الإنقاذ المطلوب في التهكم.
- source_word: εἰ θέλει αὐτόν
  choice: إن كان يريده
  rationale: ينقل المعنى المباشر الشائع للفعل θέλω، أي الإرادة أو الرغبة، مع إبقاء دلالة الرضا المحتملة بسبب صدى المزمور في الحاشية.
- source_word: εἶπεν γὰρ
  choice: لأنه قال
  rationale: ينقل الماضي البسيط ويبين أن قول يسوع هو تعليل تحدي المستهزئين.
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: أُدخل مضمون القول بصيغة اقتباس مباشر طبيعية في العربية بدل أداة القول غير المباشر، من غير تغيير المعنى.
- source_word: Θεοῦ ... υἱός
  choice: ابن الله
  rationale: السياق المتّاوي يجعل العبارة لقبًا مسيانيًا معروفًا لا وصفًا نكرة؛ و«ابن الله» يحفظ قوة اللقب طبيعيًا في العربية.
theological_decisions:
- issue: ترجمة التعبير المسيحاني Θεοῦ εἰμι υἱός
  choice: أنا ابن الله
  alternative: أنا ابنٌ لله
  rationale: في سياق إنجيل متى تمثل العبارة ادعاءً مسيحانيًا معروفًا، لا مجرد انتساب عام إلى الله؛ وتحفظ الصياغة المختارة قوة اللقب دون إضافة صياغة عقائدية خارجة عن النص.
- issue: مدى تضمين θέλει αὐτόν معنى الرضا أو المسرة
  choice: إن كان يريده
  alternative: إن كان يرضى عنه
  rationale: 'المعنى المباشر للفعل هو الإرادة أو الرغبة، أما معنى الرضا فتقويه الإحالة إلى مزمور 22: 8؛ لذلك حُفظت العبارة المباشرة في المتن وذُكر الاحتمال التفسيري في الحاشية.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «اتكل» لملاءمته الأسلوب الكتابي المفهوم مع بقائه جاريًا في الاستعمال، وصيغ الأمر «فلينقذه» تحفظ نبرة التحدي الساخرة. جميع علامتي الحاشية مثبتتان في المتن.
