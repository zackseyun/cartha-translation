base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: ar
  text: 'قد اتكل على الله؛ فليُنقذه الله الآن إن كان يريده[a]، لأنه قال[b]: «أنا ابن الله».'
  philosophy: optimal-equivalence
  footnotes:
