  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: ar
  text: 'فأجابهم الوالي: «أيَّ الاثنين تريدون أن أُطلق لكم؟» فقالوا: «باراباس».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: فأجابهم الوالي
  rationale: صيغتا اسم الفاعل والفعل في اليونانية تؤديان معًا وظيفة إدخال جواب الوالي؛ وصياغة «فأجابهم» عربية طبيعية تتجنب التكرار الحرفي «أجاب وقال لهم». وتفيد الفاء الانتقال إلى ردّه في سياق الحوار.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: أيَّ الاثنين
  rationale: السؤال يطلب الاختيار بين شخصين محددين، و«أيَّ الاثنين» تعبير عربي واضح يحفظ معنى التبعيض والاختيار.
- source_word: θέλετε
  choice: تريدون
  rationale: يفيد الفعل إرادة الجماعة وتفضيلها، و«تريدون» مباشر وطبيعي في العربية المعاصرة.
- source_word: ἀπολύσω ὑμῖν
  choice: أن أُطلق لكم
  rationale: الفعل في هذا السياق القضائي يعني الإفراج أو الإطلاق، واللام تنقل دلالة ὑμῖν بوصف الإطلاق استجابةً لطلبهم.
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: الفاء تلائم تعاقب السؤال والجواب في العربية، من غير تحميل δέ معنى تضاد قوي.
- source_word: Τὸν Βαραββᾶν
  choice: باراباس
  rationale: نقل صوتي للاسم اليوناني Βαραββᾶς بصيغة عربية واضحة، مع بيان ضبط بديل شائع في الحاشية.
