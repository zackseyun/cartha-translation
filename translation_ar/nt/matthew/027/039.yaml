lexical_decisions:
- source_word: οἱ δὲ
  choice: وكان
  rationale: تؤدي δέ هنا وظيفة رابط سردي خفيف، وتأتي «وكان» عربية طبيعية تصل الحدث بما قبله من غير إبراز مقابلة أقوى مما في الأصل.
- source_word: παραπορευόμενοι
  choice: المارّون به
  rationale: اسم الفاعل اليوناني المسبوق بأداة التعريف مستعمل استعمال الاسم، ويدل على أناس كانوا يمرّون بالمكان. وتحافظ «المارّون به» على معنى الحركة المستمرة وعلى صلة الفعل بموضع الصلب.
- source_word: ἐβλασφήμουν
  choice: يجدّفون عليه
  rationale: يحمل الفعل معنى القول المسيء أو التشهير، وقد يحمل أيضًا معنى التجديف بالمعنى الديني. وصيغة الماضي الناقص تفيد الاستمرار، فنقلتها «كانوا يجدّفون» ضمن تركيب الآية، مع إثبات البديل الدلالي في الحاشية حتى لا يُحصر اللفظ في معناه الديني الضيق.
- source_word: αὐτὸν
  choice: عليه
  rationale: الضمير يعود إلى يسوع، وحرف الجر «على» هو الاستعمال العربي المألوف مع «جدّف» عند توجيه الكلام إلى شخص.
- source_word: κινοῦντες
  choice: وهم يهزّون
  rationale: اسم الفاعل يصف فعلًا متزامنًا مع التجديف؛ وصيغة الحال «وهم يهزّون» واضحة وطبيعية وتحفظ هذا التزامن.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: رؤوسهم
  rationale: حُفظ الجمع كما في اليونانية، والتعبير يدل في السياق على حركة ازدراء وسخرية.
theological_decisions:
- issue: الدلالة المقصودة للفعل βλασφημέω حين يكون يسوع هو الموجَّه إليه الكلام في رواية الآلام
  choice: إبقاء اللفظ الأقوى «يجدّفون عليه» في المتن
  alternative: «يشتمونه» أو «يسيئون إليه»
  rationale: الفعل اليوناني أقوى من مجرد السخرية العامة، واختياره في هذا السياق يحمل وزنًا لاهوتيًا من غير أن يقتضي من المترجم حسم هوية يسوع عن طريق الشرح. أبقى المتن قوة لفظ متّى، وتوضح الحاشية أن الفعل قد يدل أيضًا على الشتم والتشهير، فلا يُفرض عليه المعنى الديني الضيق وحده.
translation_notes:
  register: الصياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «يجدّفون عليه» للمحافظة على قوة اللفظ اليوناني، مع حاشية تمنع فهمه على نحو أضيق من مجاله الدلالي. وتجنبت الصياغة إبراز مقابلة قوية في δέ أو إضافة تفسير عقائدي غير مصرح به في النص.
