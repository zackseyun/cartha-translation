base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: ar
  text: «خَلَّصَ آخرين، ولا يقدر أن يُخَلِّص نفسه. هو ملك إسرائيل؛ فلينزل الآن عن الصليب[a]، وسنؤمن به».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان ملك إسرائيل، فلينزل الآن عن الصليب، وسنؤمن به». تُظهر بعض الترجمات معنى الشرط لتوضيح السخرية، لكن اليونانية تذكر اللقب مباشرة من غير أداة شرط صريحة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: آخرين
  rationale: مفعول به جمع مستعمل استعمال الاسم، ويُبرز بإيجاز المقابلة الساخرة مع «نفسه».
- source_word: ἔσωσεν
  choice: خَلَّصَ
  rationale: يحفظ المدى الدلالي للفعل σῴζω، بما يشمل الإنقاذ والشفاء، من غير تضييق المعنى.
- source_word: ἑαυτὸν
  choice: نفسه
  rationale: ضمير انعكاسي يحفظ المقابلة المباشرة بين الآخرين ويسوع نفسه.
- source_word: οὐ δύναται σῶσαι
  choice: لا يقدر أن يُخَلِّص
  rationale: صياغة عربية طبيعية تحفظ معنى عدم القدرة وقوة التهكم.
- source_word: βασιλεὺς Ἰσραήλ
  choice: ملك إسرائيل
  rationale: ينقل اللقب الملكي كما ورد في الجملة الخبرية اليونانية، من غير إضافة أداة شرط.
- source_word: καταβάτω
  choice: فلينزل
  rationale: صيغة أمر للغائب تلائم التحدي الساخر في السياق.
- source_word: νῦν
  choice: الآن
  rationale: يحفظ الإلحاح الزمني في طلب المستهزئين.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: عن الصليب
  rationale: تعبير عربي فصيح وطبيعي للنزول من موضع التعليق على الصليب.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: سنؤمن به
  rationale: ينقل الإيمان الموجَّه إلى شخص، وهو المقابل العربي الطبيعي للبنية πιστεύω مع ἐπί والمفعول به.
theological_decisions:
- issue: صياغة الادعاء الملكي الذي أورده المستهزئون
  choice: هو ملك إسرائيل
  alternative: إن كان ملك إسرائيل
  rationale: النص اليوناني جملة اسمية خبرية بلا أداة شرط صريحة؛ لذلك تُحفَظ الصياغة المباشرة مع بقاء نبرتها الساخرة مستفادة من السياق، بدل إدخال معنى شرطي في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «خَلَّص» للمحافظة على التكرار اللفظي في اليونانية وعلى اتساع المعنى، وصيغ الأمر للغائب «فلينزل» لنقل التحدي الساخر بإيجاز.
