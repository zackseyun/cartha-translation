  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: ar
  text: 'فأجاب الشعب كله[a] وقال: «دمه علينا وعلى أولادنا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الشعب المجتمع في ذلك المشهد؛ ولا ينبغي أن تُفهم هذه العبارة على أنها تنسب ذنبًا دائمًا إلى جميع اليهود في كل جيل.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: فأجاب ... وقال
  rationale: التركيب اليوناني يجمع اسم الفاعل «مجيبًا» مع «قال» لإدخال الرد. حافظت العربية على عنصري الإجابة والقول بصياغة طبيعية واضحة.
- source_word: πᾶς ὁ λαὸς
  choice: الشعب كله
  rationale: ينقل التعبير القوة الجمعية للاسم المفرد المعرّف مع πᾶς، ويشير في السياق إلى المجتمعين في المشهد، من غير تحويله إلى حكم عرقي أو عابر للأجيال.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: دمه
  rationale: صياغة عربية موجزة وأمينة؛ وتبقي دلالة المسؤولية عن موته ضمنية كما في الأصل، من غير توسيع تفسيري في المتن.
- source_word: ἐφ’ ἡμᾶς
  choice: علينا
  rationale: الأصل عبارة اسمية بلا فعل مصرح به، والعربية تسمح بالحفاظ على هذا الإيجاز مع بقاء معنى تحمّل التبعة مفهومًا من السياق.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: وعلى أولادنا
  rationale: «أولادنا» مقابل طبيعي لـ τέκνα، مع تكرار حرف الجر للمحافظة على التوازي والتوكيد؛ أما «ذريتنا» فتوسع المدلول صراحة إلى الأجيال اللاحقة.
theological_decisions:
- issue: احتمال إساءة فهم πᾶς ὁ λαὸς على نحو معادٍ لليهود
  choice: إبقاء العبارة الجمعية «الشعب كله» مع توضيح أن المقصود هم المجتمعون في المشهد
  alternative: الجمع كله
  rationale: يحافظ هذا على اللفظ السردي وقوته الجمعية من دون أن يجعله إسنادًا لذنب دائم إلى جميع اليهود في كل جيل. وتمنع الحاشية التعميم التاريخي مع عدم تلطيف المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختير «الشعب كله» لقربه من بنية الأصل، و«أولادنا» بدل «ذريتنا» لتجنب توسيع الدلالة المعجمية.
