  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: ar
  text: وفي اليوم التالي[a]، أي بعد يوم الاستعداد، اجتمع رؤساء الكهنة والفريسيون عند بيلاطس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفي الغد، أي بعد الاستعداد». يمكن أن يدل اللفظ اليوناني على يوم الاستعداد السابق للسبت؛ أما ترجمته «الجمعة» فتتضمن تفسيرًا أخص مما يقتضيه النص المصدر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تنقل العبارة التقدم الزمني، وتؤدي الواو وظيفة δέ الرابطة الخفيفة من غير إضافة ظرف مثل «أما الآن» لا يصرح به النص اليوناني.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: أي بعد يوم الاستعداد
  rationale: تؤدي «أي» وظيفة الجملة النسبية التفسيرية، وتحافظ «يوم الاستعداد» على التعبير الزمني اليهودي بوضوح طبيعي.
- source_word: παρασκευήν
  choice: يوم الاستعداد
  rationale: يرجح أن اللفظ يشير إلى اليوم السابق للسبت، لكن ترجمته «الجمعة» أخص مما يقتضيه المصدر.
- source_word: συνήχθησαν
  choice: اجتمع
  rationale: صيغة المبني للمجهول اليونانية مستعملة هنا استعمالًا لازمًا بمعنى اجتمعوا، والصياغة العربية موجزة وطبيعية.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف للسلطات الكهنوتية القيادية، لا لعدة أشخاص يشغلون منصب رئيس كهنة واحدًا.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: النقل العربي القياسي لاسم هذه الجماعة اليهودية.
- source_word: πρὸς Πιλᾶτον
  choice: عند بيلاطس
  rationale: يمكن أن تدل πρός مع فعل الاجتماع على التوجه إلى شخص أو المثول لديه؛ و«عند بيلاطس» طبيعية وتحفظ قدرًا من هذا الاتساع دون تشديد النبرة القضائية.
- source_word: Πιλᾶτον
  choice: بيلاطس
  rationale: الصيغة العربية الراسخة للاسم اليوناني.
theological_decisions: []
