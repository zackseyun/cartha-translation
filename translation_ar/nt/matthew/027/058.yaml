  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: ar
  text: فتقدَّم هذا الرجل إلى بيلاطس وطلب جسد يسوع. حينئذ أمر بيلاطس بأن يُسلَّم جسد يسوع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بأن يُعطى» أو «بأن يُسلَّم». يحتمل الفعل اليوناني هنا هذه الصيغ المتقاربة.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: هذا
  rationale: اسم الإشارة يحيل إلى يوسف الرامي المذكور في الآية السابقة، والإبقاء عليه يحافظ على الصياغة اليونانية من غير غموض في السياق.
- source_word: προσελθὼν
  choice: فتقدَّم إلى
  rationale: ينقل حركة الاقتراب من بيلاطس، وتدل الفاء على أن هذا الفعل سبق الطلب واتصل به في السرد.
- source_word: ᾐτήσατο
  choice: طلب
  rationale: الفعل هنا يعني طلب شيء، ومفعوله الصريح هو جسد يسوع.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: جسد يسوع
  rationale: «جسد» هو المقابل المباشر والطبيعي لـσῶμα، ولا حاجة إلى اللفظ الأشد سريرية «جثة».
- source_word: τότε
  choice: حينئذ
  rationale: تبيّن تتابع الحدث التالي عقب طلب يوسف.
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: ينقل بوضوح معنى إصدار بيلاطس أمرًا رسميًا.
- source_word: ἀποδοθῆναι
  choice: بتسليمه
  rationale: المصدر المؤول المبني للمجهول يفيد إعطاء الجسد أو تسليمه. والضمير يعيد المفعول المحذوف في اليونانية إلى الجسد من غير أن يصرّح بمتسلِّم غير مذكور لفظًا.
