review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: فشل محاولة بيلاطس، ونشوء اضطراب، وغسل اليدين علنًا، وإعلانه الشخصي البراءة، ثم توجيهه الكلام إلى الجمع. لكن «أخذ ينشأ» تركيب ثقيل في العربية الحديثة، ويمكن تحسينه من غير تضييق دلالة θόρυβος. كما أن «تدبّروا الأمر» يفيد المعنى الاصطلاحي المقصود من ὑμεῖς ὄψεσθε، لكنه أمر صريح؛ والأفضل أن تحافظ الصياغة الرئيسة على هيئة المستقبل في اليونانية مع بيان المعنى الاصطلاحي في الحاشية.'
  naturalness: «بل إن اضطرابًا أخذ ينشأ» غير سلس بسبب اجتماع دلالة البدء والنشوء. «بل إن اضطرابًا كان يتصاعد» أفصح وأكثر سلاسة في سياق اضطراب جماهيري آخذ في التكوّن. و«أنتم ستتدبّرون الأمر» عربية واضحة وتحافظ على المستقبل والتوكيد بالضمير، مع أن العبارة تفهم في السياق بوصفها إلقاءً للمسؤولية عليهم.
  terminology: «بيلاطس»، «الجمع»، «بريء من هذا الدم»، و«غسل يديه» مناسبة وواضحة. إبقاء «هذا الدم» يلتزم بالأصل الذي لا يذكر لفظ «رجل» أو اسم يسوع في هذه العبارة. وتشرح الحاشية الاصطلاح المتعلق بالمسؤولية عن الموت دون أن تقرر صحة ادعاء بيلاطس.
