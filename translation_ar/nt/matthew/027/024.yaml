source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: ar
  text: 'فلما رأى بيلاطس أنه لا يُجدي شيئًا، بل إن اضطرابًا كان يتصاعد[a]، أخذ ماءً وغسل يديه أمام الجمع قائلًا: «أنا بريء من هذا الدم[b]؛ وأنتم ستتدبّرون الأمر[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل كان شغبٌ ينشأ»، أو: «بل كان ضجيجٌ يحدث».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أنا بريء من هذا الدم». والمقصود البراءة من المسؤولية عن موت شخص.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «تولَّوا الأمر بأنفسكم»؛ وحرفيًا: «أنتم سترون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: فلما رأى بيلاطس
  rationale: تفيد العبارة انتقال السرد إلى الخطوة التالية، وتؤدي «فلما» هذا الربط طبيعيًا في العربية.
- source_word: οὐδὲν ὠφελεῖ
  choice: أنه لا يحقق شيئًا
  rationale: المعنى أن محاولة بيلاطس لم تكن تجدي أو تحقق نتيجة، فصيغت العبارة بوضوح من غير إثقال حرفي.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: بل إن اضطرابًا أخذ ينشأ
  rationale: يمكن أن يدل θόρυβος على الاضطراب أو الضجيج أو الشغب، وتُبقي «اضطراب» مجال الدلالة، بينما تنقل «أخذ ينشأ» الحدث المتصاعد.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: أخذ ماءً وغسل يديه
  rationale: صياغة عربية طبيعية تحافظ على ترتيب الفعلين وعلى دلالة الفعل الرمزي العلني.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: أمام الجمع
  rationale: تنقل الموقع والعلنية اللذين تفيدهما العبارة اليونانية.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: أنا بريء من هذا الدم
  rationale: تحافظ على صورة الأصل حرفيًا نسبيًا، وهي في السياق تعني ادعاء البراءة من المسؤولية عن الموت.
- source_word: ὑμεῖς ὄψεσθε
  choice: وأنتم تدبّروا الأمر
  rationale: العبارة اصطلاحية بمعنى أن يتولى المخاطبون الأمر أو مسؤوليته، مع إبراز الضمير الصريح ὑμεῖς بواسطة «أنتم».
theological_decisions:
- issue: إعلان بيلاطس براءته
  choice: 'أُبقي الإعلان قولًا منسوبًا إلى بيلاطس: «أنا بريء من هذا الدم»'
  alternative: صياغته على نحو يوحي بأن الراوي يقر فعلًا ببراءته
  rationale: النص يسجل ادعاء بيلاطس ولا يحسم صدقه الأخلاقي أو اللاهوتي، وبذلك يبقى التوتر السردي قائمًا.
- issue: تحميل الجمع المسؤولية في ὑμεῖς ὄψεσθε
  choice: وأنتم تدبّروا الأمر
  alternative: وأنتم تتحملون المسؤولية
  rationale: تؤدي الصياغة القوة الاصطلاحية من غير أن تضيف تصريحًا لاهوتيًا أو أخلاقيًا أوسع من العبارة نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «الجمع» للجموع الحاضرة، و«اضطراب» للمحافظة على سعة دلالة θόρυβος، مع إبقاء استعارة «هذا الدم» كما في الأصل.
