lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط سردية بسيطة تحافظ على تتابع الأحداث من غير إضافة دلالة زمنية صريحة.
- source_word: καθήμενοι
  choice: جلسوا
  rationale: اسم الفاعل من κάθημαι يفيد كونهم في وضع الجلوس؛ وصيغة الفعل هنا طبيعية في العربية وتؤدي الحال المصاحبة للفعل الرئيس.
- source_word: ἐτήρουν
  choice: يراقبونه
  rationale: الفعل في صيغة الماضي الناقص يدل على فعل مستمر، والمضارع العربي بعد «جلسوا» يصور استمرار المراقبة في ذلك المشهد.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير مفعول به يعود إلى يسوع، ويُلحق بالفعل بصورة طبيعية في العربية.
- source_word: ἐκεῖ
  choice: هناك
  rationale: ظرف مكان يحدد موضع جلوسهم ومراقبتهم، ووضعه بعد «جلسوا» واضح وطبيعي.
