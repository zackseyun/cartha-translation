- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: ألبسوه ثيابه
  rationale: ينقل فعل الإلباس وضمير الملكية بوضوح، كما يبرز المقابلة مع الرداء الذي نزعوه عنه.
- source_word: ἱμάτια
  choice: ثيابه
  rationale: «الثياب» مقابل عربي واضح وجامع للجمع اليوناني، وأنسب للسياق من لفظ أشد تخصصًا.
- source_word: ἀπήγαγον
  choice: ساقوه
  rationale: يفيد اقتياد الأسير تحت الحراسة، ويحفظ عنصر الإكراه في السياق، مع بقاء العبارة موجزة وطبيعية.
- source_word: εἰς τὸ σταυρῶσαι
  choice: ليصلبوه
  rationale: تنقل لام التعليل غرض الاقتياد الذي تدل عليه صيغة εἰς مع المصدر المعرّف.
