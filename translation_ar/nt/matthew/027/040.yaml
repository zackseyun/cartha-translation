source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: ar
  text: 'وهم يقولون: «يا من تهدم الهيكل وتبنيه[a] في ثلاثة أيام، خلِّص نفسك! إن كنت ابن الله، فانزل عن الصليب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تعيد بناءه». الفعل اليوناني يعني في ذاته «تبني»، وإن كان سياق التهكم قد يفيد إعادة البناء.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: وهم يقولون
  rationale: اسم فاعل حالي مرتبط بسياق الرواية السابق؛ صيغ بأسلوب عربي طبيعي يحافظ على استمرار فعل الاستهزاء من غير تعيين جديد للفاعل.
- source_word: Ὁ καταλύων
  choice: يا من تهدم
  rationale: أداة التعريف مع اسم الفاعل تؤدي وظيفة النداء هنا؛ وصيغة «يا من» تنقل الخطاب التهكمي مباشرة.
- source_word: καταλύω
  choice: تهدم
  rationale: الفعل في سياق الهيكل يدل على النقض أو الهدم، و«تهدم» لفظ واضح وطبيعي يحافظ على صورة إزالة البناء.
- source_word: ναός
  choice: الهيكل
  rationale: رغم أن اللفظ اليوناني قد يخص موضع المقدس داخل مجمع الهيكل، فإن «الهيكل» هو المقابل العربي الطبيعي في هذا السياق ويجنب التحديد التقني الزائد.
- source_word: ἐν τρισὶν ἡμέραις
  choice: في ثلاثة أيام
  rationale: نقل مباشر وطبيعي للتعبير الزمني اليوناني، مع إبقاء مدى العبارة كما هو.
- source_word: οἰκοδομῶν
  choice: تبنيه
  rationale: المعنى المعجمي المباشر هو «تبني»، والضمير يعود طبيعيًا إلى الهيكل. لم يُجعل «تعيد بناءه» في المتن لأن دلالة الإعادة مفهومة من السياق لكنها غير مصرّح بها في الفعل نفسه.
- source_word: σῶσον σεαυτόν
  choice: خلِّص نفسك
  rationale: ينقل فعل الأمر والضمير الانعكاسي مباشرة، ويحافظ على الصياغة التهكمية في التحدي.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: إن كنت ابن الله
  rationale: يحافظ على الشرط وعلى اللقب المسيحاني من غير إضعاف دلالته أو توسيعها.
- source_word: κατάβηθι
  choice: فانزل
  rationale: فعل أمر بالحركة إلى أسفل؛ والفاء تلائم العربية بوصف النزول تحديًا مترتبًا على الشرط السابق.
- source_word: σταυρός
  choice: الصليب
  rationale: المقابل العربي المألوف والملائم في سياق آلام يسوع.
theological_decisions:
- issue: صياغة اللقب υἱὸς τοῦ θεοῦ في سياق الاستهزاء
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: «ابن الله» تنقل اللقب المعروف بوضوح، مع إبقاء الكلام على لسان المستهزئين وعدم إضافة تفسير إلى طبيعة البنوة.
- issue: القوة الشرطية لعبارة εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: إن كنت ابن الله
  alternative: ما دمت ابن الله
  rationale: اختيرت الصيغة الشرطية المفتوحة كما في اليونانية، من غير حسم ما إذا كان المتكلم يفترض صحة اللقب أو يشكك فيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع خطاب مباشر طبيعي. استُخدمت «يا من» للنداء التهكمي، وحُفظ تتابع الأوامر والشرط وقوة لقب «ابن الله» من غير تفسير مذهبي زائد.
