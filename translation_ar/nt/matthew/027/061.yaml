  language: ar
  text: وكانت هناك مريم المجدلية ومريم الأخرى، جالستين قبالة القبر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: وكانت هناك
  rationale: نُقلت صيغة المفرد اليونانية كما هي لأنها تسبق فاعلين مؤنثين معطوفين، وهو تركيب سائغ في العربية حين يتقدم الفعل على الفاعل. وتؤدي الواو وظيفة δὲ بوصفها رابطًا سرديًا خفيفًا.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة، وهي واضحة وتحافظ على هوية الشخصية.
- source_word: ἡ ἄλλη Μαρία
  choice: مريم الأخرى
  rationale: تحافظ «الأخرى» على التمييز الصريح بينها وبين مريم المجدلية.
- source_word: καθήμεναι
  choice: جالستين
  rationale: حال مثنى مؤنث يصف هيئة المرأتين المستمرة في ذلك الموضع، ويقابل اسم الفاعل اليوناني طبيعيًا.
- source_word: ἀπέναντι
  choice: قبالة
  rationale: تعبير عربي فصيح وواضح يدل على الموضع المقابل أو المواجه.
- source_word: τοῦ τάφου
  choice: القبر
  rationale: «القبر» هو المقابل العربي الطبيعي في سياق دفن يسوع، من غير استعمال لفظ قديم أو متكلف.
