  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: ar
  text: 'قال لهم بيلاطس: «فماذا أفعل بيسوع الذي يُدعى المسيح؟» قالوا جميعًا: «ليُصلب!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: فماذا أفعل
  rationale: ينقل السؤال التداولي بصيغة المضارع العربية الطبيعية، وتؤدي الفاء معنى οὖν الاستنتاجي والانتقالي في السياق.
- source_word: Ἰησοῦν
  choice: بيسوع
  rationale: استُخدمت الصيغة العربية المعيارية للاسم، وسبقتها الباء التي يقتضيها الفعل «أفعل» في هذا التركيب.
- source_word: τὸν λεγόμενον χριστόν
  choice: الذي يُدعى المسيح
  rationale: يحفظ اسم المفعول معنى الوصف المنسوب إليه، وتترجم «المسيح» اللقب Χριστός باللفظ العربي الراسخ الذي يحمل دلالته المسيانية.
- source_word: λέγουσιν πάντες
  choice: قالوا جميعًا
  rationale: صيغ المضارع التاريخي بالماضي وفق السرد العربي الطبيعي، مع إبقاء القوة الجماعية لكلمة πάντες.
- source_word: Σταυρωθήτω
  choice: ليُصلب
  rationale: تحفظ لام الأمر قوة صيغة الأمر، كما يحفظ البناء للمجهول الصيغة اليونانية المبنية للمجهول دون تحويلها إلى أمر مباشر للجموع.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ هنا وظيفته كلقب في عبارة «الذي يُدعى المسيح» من غير معاملته بوصفه مجرد اسم شخصي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة؛ حافظت الصياغة على إيجاز الحوار، وعلى صيغة الأمر المبنية للمجهول في جواب الجموع.
