  naturalness: '«بصوت عظيم» فصيحة ومناسبة للسجل المهيب، وإن كانت أقل معاصرة من «بصوت عالٍ». لا يلزم تغييرها. لكن صياغة الحاشية (أ) الحالية غير سليمة/غير طبيعية: «تردد هذه العبارة صدى...»؛ كما أن الحاشية (ب) توحي خطأً بأن «لِمَ تركتني» بديل زمني لعبارة «لماذا تركتني»، مع أن الفرق بين «لِمَ» و«لماذا» اختصاري فقط في العربية.'
  terminology: «يسوع»، و«إلهي»، و«تركتني» ألفاظ دقيقة ومهيبة. نقل «إيلي، إيلي، لِما سَبَخْتاني» يحافظ على العرض السامي في النص اليوناني وعلى صلته بالسياق التالي.
