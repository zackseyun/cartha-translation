    rationale: «لماذا تركتني» و«لِمَ تركتني» لا تختلفان في زمن الفعل؛ كلتاهما تستعملان الماضي العربي نفسه. ينبغي أن تبيّن الحاشية أن «تركتني» تنقل صيغة الماضي اليونانية، وأن «لِمَ» اختصار لـ«لماذا» إن أريد ذكرها.
