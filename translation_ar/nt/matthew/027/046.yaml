  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: ar
  text: 'ونحو الساعة التاسعة صرخ يسوع بصوت عظيم[a] قائلًا: «إيلي، إيلي، لِما سَبَخْتاني؟» أي: «إلهي، إلهي[b]، لماذا تركتني؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تستحضر هذه العبارة صدى مزمور 22:1.
    reason: cross_reference
  - marker: b
    text: الفعل اليوناني بصيغة الماضي، وتنقله هنا «تركتني». و«لِمَ» صيغة مختصرة من «لماذا».
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: ونحو الساعة التاسعة
  rationale: تفيد περί مع زمن منصوب معنى التقريب، أي «نحو»، وتحمل الواو هنا الربط الخفيف الذي تؤديه δέ من غير إضافة ظرف زمان غير موجود في الأصل.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: صرخ ... بصوت عظيم
  rationale: ينقل «صرخ» قوة الفعل الدال على رفع الصوت، وتحافظ عبارة «بصوت عظيم» على الصورة الملموسة والتوكيد في اليونانية.
- source_word: λέγων
  choice: قائلًا
  rationale: اسم الفاعل الحالي يقدّم مضمون الصرخة ويحافظ على تركيب الأصل بصورة عربية طبيعية.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: إيلي، إيلي، لِما سَبَخْتاني؟
  rationale: أبقى متى ألفاظ الصرخة السامية ثم قدّم ترجمتها؛ لذلك تُحفظ هنا منقولة بحروف عربية وفق صورتها المثبتة في النص اليوناني، من غير استبدالها بالمعنى وحده.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: صيغة عربية موجزة وطبيعية لإدخال الترجمة التفسيرية التي يوردها متى.
- source_word: Θεέ μου θεέ μου
  choice: إلهي، إلهي
  rationale: تحافظ العبارة على النداء المضاف وتكراره، وعلى صدى مزمور 22:1.
- source_word: ἱνατί με ἐγκατέλιπες
  choice: لماذا تركتني؟
  rationale: «لماذا» تقابل أداة الاستفهام عن السبب، و«تركتني» تنقل الفعل اليوناني الماضي بصيغة عربية مباشرة وطبيعية من غير تلطيف لمعنى الترك.
theological_decisions:
- issue: صلة صرخة يسوع بمزمور 22:1
  choice: تُترجم الصرخة مباشرة مع إبقاء صداها المزموري وقوة سؤال الترك من غير شرح عقائدي داخل النص.
  alternative: تقديمها بوصفها مجرد إحالة اقتباسية، أو تخفيف معنى الترك بعبارة تفسيرية.
  rationale: يعرض النص الصرخة وترجمتها بلا قيد تفسيري؛ فالصياغة المباشرة تحفظ حقيقتها والتوتر اللاهوتي فيها ولا تفرض تفسيرًا لكيفية مخاطبة الابن لله في هذه اللحظة.
- issue: إبقاء الصرخة السامية في المتن
  choice: تُحفظ الألفاظ السامية منقولة بحروف عربية، ثم تتبعها ترجمة متى لها.
  alternative: إيراد المعنى العربي وحده.
  rationale: هذا يطابق ترتيب النص اليوناني ويحفظ التفصيل السردي الذي يفسر إمكان إساءة السامعين فهم «إيلي» في السياق اللاحق.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «عظيم» مع «صوت» للمحافظة على التعبير اليوناني الملموس، وأُبقيت الصرخة السامية في المتن كما يفعل متى. تظهر علامتا الحاشيتين [a] و[b] كلتاهما في النص.
