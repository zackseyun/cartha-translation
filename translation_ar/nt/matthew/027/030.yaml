  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: ar
  text: وبعد أن بصقوا عليه، أخذوا القصبة[a] وظلّوا يضربونه بها على رأسه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العصا». قد تعني الكلمة اليونانية قصبة، أو عصًا مصنوعة منها أو شبيهة بها.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «وكانوا يضربونه بها على رأسه». تدل صيغة الفعل اليوناني على فعل متكرر أو مستمر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: وبعدما بصقوا عليه
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل على فعل سابق للأفعال الرئيسة، و«بعدما» تنقل هذا التعاقب بوضوح وطبيعية، أما «عليه» فهي المقابل العربي المألوف مع فعل البصق.
- source_word: ἔλαβον
  choice: أخذوا
  rationale: مقابل مباشر وطبيعي للفعل، من غير إضافة معنى الانتزاع أو الالتقاط الذي لا يفرضه السياق.
- source_word: τὸν κάλαμον
  choice: القصبة
  rationale: تحافظ على الدلالة الأساسية لـκάλαμος وعلى الصلة بالقصبة المذكورة سابقًا في مشهد التهكم الملكي، مع بيان احتمال معنى العصا في الحاشية.
- source_word: ἔτυπτον
  choice: ظلّوا يضربونه
  rationale: صيغة الماضي الناقص اليونانية تعرض الضرب بوصفه متكررًا أو مستمرًا؛ و«ظلّوا يضربونه» تنقل هذا الجانب بوضوح في العربية.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: بها على رأسه
  rationale: «على رأسه» تعبير عربي طبيعي عن موضع الضرب. أُضيف الضمير «بها» لبيان أن القصبة هي أداة الضرب، وهو مفهوم من تعاقب الجملة وسياقها.
theological_decisions:
- issue: تصوير إساءة الجنود إلى يسوع
  choice: نقل الأفعال بوضوح وحسية، مع إبراز استمرار الضرب من غير تهوين أو مبالغة.
  alternative: «وبعدما بصقوا عليه، أخذوا القصبة وضربوه على رأسه» من غير إظهار دلالة الماضي الناقص على التكرار أو الاستمرار.
  rationale: النص سردي، لكنه يشدد بصيغته الفعلية على الإذلال والعنف المتواصل أو المتكرر. تحافظ الصياغة على هذا الأثر من غير إدخال تفسير عقائدي إضافي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، ببناء سردي طبيعي. استُعملت «ظلّوا» لإظهار الاستمرار أو التكرار، وأُبقيت «القصبة» للمحافظة على الرابط اللفظي والسردي مع الآية السابقة.
