  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: ar
  text: فذهبوا وأمَّنوا القبر بختم الحجر مع الحرس.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مع فرقة الحراسة» أو «مع الحرس». وربما: «بختم الحجر وإقامة حرس عليه». فالعبارة اليونانية موجزة، وقد تدل على المصاحبة لا على فعل مستقل.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «بختم الحجر، إلى جانب الحرس».'
    reason: previous_rendering
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: فذهبوا
  rationale: تؤدي الفاء معنى مواصلة السرد والنتيجة السياقية، ويُنقل اسم الفاعل اليوناني هنا بفعل تام طبيعي في العربية.
- source_word: ἠσφαλίσαντο
  choice: أحكموا تأمين
  rationale: يدل الفعل على جعل الشيء مأمونًا من العبث أو محكم الحراسة؛ وهذه العبارة واضحة في سياق اتخاذ تدابير لحماية القبر.
- source_word: τὸν τάφον
  choice: القبر
  rationale: يشير اللفظ إلى موضع دفن يسوع، و«القبر» هو المقابل العربي الواضح والمألوف.
- source_word: σφραγίσαντες
  choice: بختم
  rationale: 'ينقل المصدر المسبوق بالباء المعنى الوسيلي المرجح لاسم الفاعل: كان ختم الحجر وسيلة تأمين القبر.'
- source_word: τὸν λίθον
  choice: الحجر
  rationale: يحافظ على اللفظ الصريح في الأصل من غير إضافة «حجر المدخل»، وهي معلومة يفهمها السياق لكنها غير مذكورة هنا.
- source_word: μετὰ τῆς κουστωδίας
  choice: مع الحرس
  rationale: κουστωδία لفظ دخيل من اللاتينية يدل على جماعة حراسة، وμετά مع المضاف إليه يفيد المصاحبة؛ وتحافظ «مع الحرس» على إيجاز الأصل من غير تحديد هوية الحرس أو جعل إقامتهم فعلًا مستقلًا صريحًا.
theological_decisions:
- issue: صلة عبارة μετὰ τῆς κουστωδίας بتأمين القبر وختم الحجر
  choice: كان الحرس مصاحبين لعملية ختم الحجر وتأمين القبر، من غير تفصيل إضافي لكيفية اشتراكهم.
  alternative: أمّنوا القبر بختم الحجر وإقامة الحرس عليه؛ أو ختموا الحجر بحضور الحرس.
  rationale: التركيب اليوناني موجز ويصرح بالمصاحبة، لكنه لا يصرح بفعل مستقل معناه «أقاموا الحرس». لذلك تُركت العبارة العربية موجزة للمحافظة على الاحتمال بدل فرض تسلسل إجرائي غير مذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «أحكموا تأمين» لتجنب احتمال فهم «أمّنوا» بمعنى منح الأمان فقط، وأُبقيت عبارة «مع الحرس» موجزة للمحافظة على غموض العلاقة النحوية الموجود في الأصل.
