lexical_decisions:
- source_word: ἔδωκαν
  choice: أعطوا
  rationale: يحافظ على المعنى المباشر للفعل δίδωμι، من غير تضييقه إلى «دفعوا»، مع أن السياق يدل على التصرف في قطع الفضة.
- source_word: αὐτὰ
  choice: ها
  rationale: ضمير يعود إلى قطع الفضة في السياق السابق؛ وصيغة غير العاقل في العربية تُحال إليها طبيعيًا بضمير المفرد المؤنث.
- source_word: εἰς τὸν ἀγρὸν
  choice: ثمنًا لحقل
  rationale: يفيد التركيب هنا تخصيص المال لاقتناء الحقل. وإضافة «ثمنًا» تجعل العلاقة طبيعية واضحة بالعربية، بدل الترجمة الحرفية الملتبسة «إلى الحقل».
- source_word: τοῦ κεραμέως
  choice: الخزّاف
  rationale: المضاف إليه يبين نسبة الحقل إلى الخزّاف، فتأتي العبارة العربية الطبيعية «حقل الخزّاف».
- source_word: καθὰ
  choice: كما
  rationale: تنقل معنى المطابقة أو الموافقة بإيجاز طبيعي.
- source_word: συνέταξέν
  choice: أمر
  rationale: ينقل السلطة الكامنة في συντάσσω بوضوح. وتوضح الحاشية البدائل الممكنة الأقل حدة مثل «وجّه» و«أوصى».
- source_word: μοι
  choice: ني
  rationale: يحافظ على المتكلم المفرد الوارد صراحة في النص اليوناني، من غير مواءمته مع سياق الرواية.
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي المألوف لـ κύριος في هذا السياق الكتابي.
theological_decisions:
- issue: مرجع المتكلم في الاقتباس أو التلميح النبوي
  choice: الإبقاء على صيغة المتكلم «أمرني» كما في اليونانية
  alternative: تسوية العبارة مع سياق الرواية أو إعادة صياغتها وفق نص العهد القديم المشار إليه
  rationale: النص اليوناني يثبت μοι، أي «لي/ني»، ولذلك ينبغي حفظ التوتر النصي واللاهوتي بدل حله بالتفسير داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «ثمنًا لحقل» لإظهار دلالة εἰς السياقية في عملية الشراء، مع إبقاء الفعل الأساسي «أعطوا» قريبًا من اليونانية. وُضعت علامة [b] بعد عبارة الحقل حيث تتصل ملاحظتها بالاقتباس كله، وعلامة [a] بعد «أمرني» لاتصالها بالبديل المعجمي.
