source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: ar
  text: حينئذ أخذ جنود الوالي يسوع إلى دار الولاية[a]، وجمعوا حوله الكتيبة كلها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مقر الوالي». يدل المصطلح اليوناني على المقر الرسمي أو العسكري للحاكم الروماني.
    reason: lexical_alternative
  - marker: b
    text: «الكتيبة» ترجمة لمصطلح عسكري روماني يدل على وحدة من الجنود؛ ولا يلزم من العبارة أن يكون كل فرد من أفراد كتيبة كاملة حاضرًا بالفعل.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: حينئذ
  rationale: أداة زمنية تنقل السرد إلى الحدث التالي بعبارة عربية فصيحة وطبيعية.
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: جنود الوالي
  rationale: يحفظ التعبير صلة الجنود بالحاكم الروماني بصياغة عربية موجزة وواضحة.
- source_word: ἡγεμόνος
  choice: الوالي
  rationale: يشير السياق إلى الحاكم الروماني للإقليم، و«الوالي» تعبير عربي واضح من غير تقييد اللفظ بلقب تاريخي أدق مما يقتضيه الأصل.
- source_word: παραλαβόντες
  choice: أخذ
  rationale: ينقل معنى اصطحاب يسوع وهو في قبضتهم، مع تحويل اسم الفاعل اليوناني إلى فعل عربي طبيعي ضمن تسلسل الجملة.
- source_word: εἰς τὸ πραιτώριον
  choice: إلى دار الولاية
  rationale: πραιτώριον هو مقر الوالي الرسمي أو العسكري؛ و«دار الولاية» يحفظ الدلالة التاريخية بلغة عربية مفهومة، مع بيان البديل في الحاشية.
- source_word: συνήγαγον
  choice: جمعوا
  rationale: ترجمة مباشرة للفعل الدال على ضم الأشخاص واجتماعهم.
- source_word: ἐπ’ αὐτὸν
  choice: حوله
  rationale: مع فعل الجمع يدل التركيب في هذا المشهد على تقارب الجنود إلى يسوع وإحاطتهم به، مع بقاء احتمال معنى التوجه إليه قائمًا من جهة التركيب.
- source_word: ὅλην τὴν σπεῖραν
  choice: الكتيبة كلها
  rationale: «الكتيبة» تنقل المصطلح العسكري الروماني σπεῖρα، و«كلها» تقابل ὅλην، مع توضيح الاستعمال العسكري في الحاشية.
theological_decisions: []
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدمت «دار الولاية» بدل نقل اللفظ اللاتيني صوتيًا لتيسير الفهم، مع الحفاظ على خصوصيته التاريخية في الحاشية، واستُعمل «الوالي» بما يلائم السياق الروماني من غير إفراط في التخصيص.
