  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: ar
  text: وبعد أن جرّدوه من ثيابه، ألبسوه رداءً قرمزيًّا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف مباشر يحفظ اتصال الجملة بما قبلها من غير إضافة دلالة زمنية صريحة.
- source_word: ἐκδύσαντες αὐτὸν
  choice: بعد أن جرّدوه من ثيابه
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا سابقًا للفعل الرئيس، ويبيّن المعنى الطبيعي للفعل ἐκδύω في العربية.
- source_word: χλαμύδα
  choice: رداءً
  rationale: يدل اللفظ على كساء خارجي أو عباءة قصيرة، وقد ارتبط أحيانًا بالعسكر أو أصحاب المناصب؛ و«رداء» لفظ عربي واضح لا يفرض تفصيلًا لا يصرّح به النص.
- source_word: κοκκίνην
  choice: قرمزيًّا
  rationale: ينقل اللون الأحمر الزاهي الذي يدل عليه κόκκινος بدقة ووضوح.
- source_word: περιέθηκαν αὐτῷ
  choice: ألبسوه
  rationale: صياغة عربية طبيعية تؤدي معنى وضع الثوب عليه، من دون الإيحاء بأكثر مما يقتضيه السياق.
theological_decisions:
- issue: طبيعة الثوب في مشهد الاستهزاء
  choice: رداءً قرمزيًّا
  alternative: عباءةً قرمزيةً
  rationale: يحفظ «رداء» المعنى العام للكساء الخارجي ولا يضيف دلالة ملكية اصطلاحية غير لازمة، مع بقاء التهكم بالتنصيب مفهومًا من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «جرّدوه من ثيابه» بدل التعبير الحرفي الأقل سلاسة، و«ألبسوه» لإيجاز معنى وضع الرداء عليه. لا حاجة إلى حاشية لأن البديل المعجمي لا يغيّر المعنى هنا.
