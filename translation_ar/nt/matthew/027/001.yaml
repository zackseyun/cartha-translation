  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: ar
  text: ولمّا جاء الصباح، تشاور جميع رؤساء الكهنة وشيوخ الشعب ضد يسوع لكي يميتوه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: ولمّا أصبح الصباح
  rationale: تركيب زمني مطلق يفيد الانتقال إلى الصباح؛ والصياغة عربية واضحة، مع تمثيل δέ تمثيلًا خفيفًا بالواو.
- source_word: συμβούλιον ἔλαβον
  choice: تشاور
  rationale: ينقل معنى المداولة واتخاذ المشورة من غير أن يضيف معنى التآمر الذي لا يصرّح به اللفظ نفسه.
- source_word: πάντες
  choice: جميع
  rationale: يحفظ صراحةً شمول جماعة القادة المشاركين.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف لطبقة القيادة الكهنوتية في أورشليم، ولا يوهم تعدد شاغلي منصب رئيس الكهنة المفرد.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: شيوخ الشعب
  rationale: تعبير عربي طبيعي يحفظ اللقب القيادي وعلاقة الإضافة.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: على يسوع
  rationale: يفيد هنا الاتجاه العدائي في سياق قضائي؛ و«تشاوروا على فلان» تعبير عربي فصيح يدل على التدبير ضده.
- source_word: ὥστε
  choice: لكي
  rationale: ينقل غاية المداولة أو نتيجتها المقصودة، مع بقاء قدر من التداخل بين الغاية والنتيجة في السياق.
- source_word: θανατῶσαι αὐτόν
  choice: يميتوه
  rationale: يحفظ معنى التسبب في موته بصياغة موجزة ورصينة، من غير تخصيص طريقة قانونية بعينها.
theological_decisions:
- issue: طبيعة فعل القادة تجاه يسوع
  choice: 'تصويره مداولة عدائية غايتها إماتة يسوع: «تشاور... على يسوع لكي يميتوه»'
  alternative: «تشاوروا بشأن يسوع» أو «تآمروا على يسوع»
  rationale: κατά مع المضاف إليه يدل في هذا السياق على العداء، وὥστε θανατῶσαι يبيّن القصد القاتل؛ لكن «تشاور» لا يحمّل العبارة معنى المؤامرة بأكثر مما يقوله الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ ترتيب عناصر الجملة وقوتها الدلالية مع تجنب الحرفية المتكلفة والتفسير الزائد.
