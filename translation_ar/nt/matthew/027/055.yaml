source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: ar
  text: وكانت هناك نساء كثيرات يراقبن من بعيد[a]، وهنّ اللواتي تبعن يسوع من الجليل وكنّ يخدمنه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ينظرن من بعيد».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يقمن على خدمته». ويمكن أن يدل الفعل اليوناني على الخدمة العملية أو تقديم الدعم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: وكانت هناك
  rationale: تنقل العبارة وجود النساء في موضع المشهد، مع تمثيل δέ بواو ربط خفيفة من غير إقحام معنى زمني أو تضاد قوي.
- source_word: γυναῖκες πολλαὶ
  choice: نساء كثيرات
  rationale: ترجمة مباشرة تحفظ الجمع والجنس ودلالة الكثرة.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: يراقبن من بعيد
  rationale: تفيد θεωροῦσαι النظر المتواصل باهتمام، وتبيّن العبارة الظرفية المسافة التي كنّ يراقبن منها.
- source_word: αἵτινες
  choice: وهنّ اللواتي
  rationale: تعرّف النساء بوصفهنّ الجماعة التي اتبعت يسوع، وتحفظ النبرة الوصفية في الضمير اليوناني بصورة عربية طبيعية.
- source_word: ἠκολούθησαν τῷ Ἰησοῦ
  choice: تبعن يسوع
  rationale: الفعل العربي يتعدى مباشرة، والماضي مناسب للسرد ويشير في السياق إلى اتباع سبق مشهد الصلب.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: من الجليل
  rationale: تحفظ نقطة الابتداء الجغرافية كما في النص اليوناني.
- source_word: διακονοῦσαι αὐτῷ
  choice: وكنّ يخدمنه
  rationale: تحفظ المعنى الواسع للخدمة العملية والعناية والدعم، من غير حصره في منصب كنسي أو نوع منزلي بعينه.
theological_decisions:
- issue: دلالة خدمة النساء ليسوع
  choice: وكنّ يخدمنه
  alternative: وكنّ يقمن على خدمته
  rationale: يحفظ لفظ «يخدمنه» اتساع διακονέω للخدمة والمساندة العملية، من غير تحميله مفهومًا كنسيًا اصطلاحيًا لاحقًا.
- issue: العلاقة الزمنية بين اتباع النساء ليسوع ومشهد الصلب
  choice: تبعن يسوع من الجليل
  alternative: كنّ قد تبعن يسوع من الجليل
  rationale: الماضي العربي مع السياق يوضح أن الاتباع سبق المشهد الحالي، بينما تجنّب صيغة الماضي الأسبق الأثقل يحافظ على سلاسة العربية من غير تغيير التسلسل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت صيغة التأنيث الجمع اتساقًا مع «نساء»، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما مباشرة.
