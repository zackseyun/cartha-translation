  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: ar
  text: لأنه كان يعلم أنهم أسلموه بدافع الحسد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حسدًا له»، أو «بسبب الغيرة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: كان يعلم
  rationale: ينقل معنى المعرفة بصياغة عربية طبيعية، ويشير السياق إلى بيلاطس.
- source_word: γὰρ
  choice: لأنه
  rationale: تدخل الأداة تعليلًا لما سبق، و«لأنه» توضح الصلة المنطقية بسلاسة.
- source_word: ὅτι
  choice: أنهم
  rationale: تدخل مضمون ما كان بيلاطس يعلمه، لا علة مستقلة ثانية.
- source_word: διὰ φθόνον
  choice: بدافع الحسد
  rationale: تفيد διά مع النصب السبب أو الدافع، و«الحسد» ينقل معنى φθόνος بوصفه استياءً من مكانة الآخر أو ما له.
- source_word: παρέδωκαν
  choice: أسلموه
  rationale: يدل الفعل هنا على تسليم يسوع إلى السلطة، و«أسلموه» موجزة ومألوفة في سياق المحاكمة، من غير حصر المعنى في الخيانة.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول يعود إلى يسوع بوضوح من السياق.
theological_decisions:
- issue: الدافع وراء تسليم يسوع
  choice: كان بيلاطس يعلم أن الحسد هو دافعهم إلى تسليم يسوع.
  alternative: كان يعلم أنهم أسلموه بسبب الغيرة.
  rationale: يحافظ «الحسد» على القوة الأخلاقية والنفسية للفظ φθόνος من غير إضافة تفسير لاهوتي لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «أسلموه» بمعنى سلّموه إلى السلطة، و«بدافع الحسد» لإبراز العلاقة السببية الطبيعية في العربية.
