  source_fidelity: 'النص ينقل بدقة تركيب اليونانية ومعناها: «لأنه» لـγάρ التعليلية، و«كان يعلم أنهم» لمحتوى المعرفة، و«بدافع الحسد» للسبب في διὰ φθόνον، و«أسلموه» لفعل παρέδωκαν في سياق تسليمه إلى السلطة. لا يضيف النص تفسيرًا لدافع الخصوم أو لطبيعة التسليم.'
