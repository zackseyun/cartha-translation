  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: ar
  text: وبينما كانوا خارجين، وجدوا رجلًا قيروانيًّا اسمه سمعان، فسخَّروه[a] ليحمل صليبه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أجبروه» أو «ألزموه بالخدمة». يدل الفعل اليوناني على خدمة إلزامية تفرضها سلطة.
    reason: lexical_alternative
  - marker: b
    text: أي صليب يسوع.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: وبينما كانوا خارجين
  rationale: اسم الفاعل المضارع يفيد حدثًا جاريًا متزامنًا مع الفعل الرئيس، و«وبينما» تنقل هذا المعنى الزمني مع وظيفة δὲ الرابطة في سياق السرد.
- source_word: εὗρον
  choice: وجدوا
  rationale: مقابل مباشر وطبيعي للفعل اليوناني في هذا السياق.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: رجلًا قيروانيًّا
  rationale: ينقل وصف الرجل بحسب موطنه، أي قيروان، بصياغة عربية موجزة وطبيعية.
- source_word: ὀνόματι Σίμωνα
  choice: اسمه سمعان
  rationale: صياغة عربية واضحة للمصطلح اليوناني الدال على الاسم.
- source_word: τοῦτον ἠγγάρευσαν
  choice: فسخَّروه
  rationale: الفعل ἀγγαρεύω يدل على إلزام شخص بخدمة تفرضها سلطة؛ و«سخَّروه» يحفظ معنى الإكراه والتجنيد للخدمة بإيجاز.
- source_word: ἵνα ἄρῃ
  choice: ليحمل
  rationale: اللام تنقل غرض ἵνα مع صيغة الاحتمال، و«يحمل» هو المعنى الأنسب لـαἴρω في موكب الصلب.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: صليبه
  rationale: يحافظ على الضمير الوارد في اليونانية وعلى المصطلح العام «الصليب» من غير تضييقه إلى العارضة.
theological_decisions:
- issue: مرجع الضمير في αὐτοῦ («صليبه»)
  choice: الإبقاء على الضمير في المتن، مع فهمه عائدًا إلى يسوع
  alternative: التصريح بقول «صليب يسوع»
  rationale: السياق يعيّن يسوع بوصفه مرجع الضمير، لكن إبقاء الضمير يصون صياغة المصدر ولا يستبدل بها تفسيرًا صريحًا؛ وتوضح الحاشية المرجع منعًا للالتباس العابر.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة وكريمة النبرة. وُضع كل مؤشر حاشية عند العبارة التي يشرحها: [a] بعد فعل الإلزام، و[b] بعد «صليبه».'
