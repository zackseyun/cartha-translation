  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: ar
  text: فلم يُجِبْهُ ولو بكلمة واحدة، حتى إن الوالي تعجّب جدًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: يُجِبْهُ
  rationale: الفعل اليوناني ذو صيغة المبني للمجهول ومعنى معلوم هنا، ويدل على الإجابة أو الرد؛ و«يُجِبْهُ» ترجمة عربية مباشرة وطبيعية، والضمير ينقل αὐτῷ.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ولو بكلمة واحدة
  rationale: تحافظ العبارة على النفي المؤكد في οὐδὲ ἕν، وتنقل ῥῆμα بمعناه المعتاد «كلمة»، في صياغة عربية طبيعية تفيد أنه لم يصدر عنه أي جواب إطلاقًا.
- source_word: ὥστε
  choice: حتى إن
  rationale: تُظهر نتيجة صمته ورد فعل الوالي، وهو معنى جملة النتيجة التي يدخل عليها ὥστε.
- source_word: θαυμάζειν
  choice: تعجّب
  rationale: ينقل معنى الدهشة والاستغراب من غير إضافة تفسير لسببها.
- source_word: ἡγεμόνα
  choice: الوالي
  rationale: في السياق الروماني تشير الكلمة إلى الحاكم الإقليمي، أي بيلاطس؛ و«الوالي» تعبير عربي واضح ودقيق لهذا المنصب.
- source_word: λίαν
  choice: جدًا
  rationale: تنقل درجة التكثيف القوية بأسلوب عربي معاصر وموجز.
theological_decisions: []
