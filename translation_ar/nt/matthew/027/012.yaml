  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: ar
  text: وبينما كان رؤساء الكهنة والشيوخ يتهمونه، لم يُجِبْ بشيء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يُعطِ أيَّ جواب».'
    reason: بديل تعبيري يوضح أن οὐδὲν مع ἀπεκρίνατο يمكن نقله عربيًا بصياغة اسمية، مع بقاء المتن أقرب إلى البنية المباشرة للنص اليوناني.
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: بينما كان ... يتهمونه
  rationale: ينقل دلالة التزامن والاستمرار في تركيب ἐν مع المصدر المعرّف، ويحافظ على المعنى المبني للمجهول من جهة كون يسوع واقعًا تحت الاتهام، مع صياغة عربية طبيعية.
- source_word: κατηγορεῖσθαι
  choice: يتهمونه
  rationale: «يتهمونه» هو التعبير العربي الواضح المعتاد عن توجيه الاتهامات إليه في هذا السياق القضائي.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: رؤساء الكهنة والشيوخ
  rationale: «رؤساء الكهنة» يدل على قيادة الكهنة، لا على تعدد شاغلي منصب رئيس الكهنة بمعناه الدقيق، و«الشيوخ» هو المقابل المألوف والدقيق لـ πρεσβύτεροι.
- source_word: οὐδὲν
  choice: بشيء
  rationale: مع النفي في «لم يُجِبْ بشيء» ينقل المعنى المباشر لـ οὐδέν، أي إنه لم يقل شيئًا جوابًا على الاتهامات.
- source_word: ἀπεκρίνατο
  choice: يُجِبْ
  rationale: الفعل «أجاب» هو المقابل العربي المباشر والطبيعي، وصيغة الماضي المنفي بـ«لم» تلائم الفعل اليوناني الماضي.
- source_word: καὶ
  choice: و
  rationale: تحافظ الواو على الصلة السردية البسيطة من غير إدخال معنى استدراكي غير مصرح به.
theological_decisions:
- issue: صمت يسوع أمام متهميه
  choice: 'عرض الواقعة سرديًا: «لم يُجِبْ بشيء»'
  alternative: صياغة تفسيرية تُبرز صدى إشعياء 53 أو تصرّح بإتمام النبوة
  rationale: الآية تصف صمته تحت الاتهام، لكنها لا تصرّح هنا بإتمام نبوة؛ لذلك تُحفظ الواقعة كما وردت من غير إضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «بينما كان ... يتهمونه» لصياغة التزامن والاستمرار طبيعيًا، و«رؤساء الكهنة» وفق الاستعمال الإنجيلي العربي المألوف.
