  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: ar
  text: وإذ خرجوا من القبور بعد قيامته[a]، دخلوا المدينة المقدسة[b] وظهروا لكثيرين[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تأتي عبارة «بعد قيامته» في اليونانية بعد «من القبور» وقبل «دخلوا»، ومرجع الضمير هو يسوع. ويمكن أن تُصاغ الجملة بسلاسة أكبر: «وبعد قيامته خرجوا من القبور، ودخلوا المدينة المقدسة...»'
    reason: alternative_reading
  - marker: b
    text: أي أورشليم.
    reason: cross_reference
  - marker: c
    text: 'يمكن أيضًا ترجمتها: «صاروا منظورين لكثيرين» أو «أظهروا أنفسهم لكثيرين».'
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐξελθόντες
  choice: وإذ خرجوا
  rationale: ينقل اسم الفاعل اليوناني ذا الدلالة الظرفية بوصفه حدثًا تابعًا للفعل الرئيس، بصياغة عربية فصيحة وطبيعية، من غير تحويله إلى جملة رئيسة مستقلة.
- source_word: μνημείων
  choice: القبور
  rationale: تشير الكلمة هنا إلى مواضع الدفن التي فُتحت في الآية السابقة؛ و«القبور» أوضح للقارئ العربي المعاصر من ألفاظ أقل تداولًا.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: بعد قيامته
  rationale: تفيد μετά مع المنصوب الترتيب الزمني، وἔγερσις تشير في السياق إلى قيامة يسوع. تحافظ العبارة على موقع القيد الزمني قريبًا من الخروج من القبور.
- source_word: εἰσῆλθον
  choice: دخلوا
  rationale: فعل سردي بسيط يقابل معنى الدخول بإيجاز ووضوح.
- source_word: τὴν ἁγίαν πόλιν
  choice: المدينة المقدسة
  rationale: يحفظ التعبير الكتابي كما هو، بينما يوضح الهامش أن المقصود أورشليم.
- source_word: ἐνεφανίσθησαν
  choice: ظهروا
  rationale: الصيغة تدل في السياق على أنهم صاروا منظورين أو أظهروا أنفسهم؛ و«ظهروا» هي الصياغة العربية الطبيعية دون تحديد كيفية الظهور.
- source_word: πολλοῖς
  choice: لكثيرين
  rationale: يحافظ على الإبهام المقصود في الجمع اليوناني، مع كون «الناس» مفهومة من السياق ولا يلزم إضافتها إلى المتن.
theological_decisions:
- issue: صلة عبارة «بعد قيامته» بالخروج من القبور وترتيب الأحداث
  choice: وُضعت العبارة بعد «خرجوا من القبور» كما في ترتيب اليونانية، فيُفهم طبيعيًا أن خروجهم ثم دخولهم المدينة حدثا بعد قيامة يسوع.
  alternative: 'يمكن صوغ الجملة بسلاسة أكبر: «وبعد قيامته خرجوا من القبور، ودخلوا المدينة المقدسة...»؛ كما قد يُفهم فتح القبور المذكور في الآية السابقة على أنه حدث قبل خروجهم.'
  rationale: يضع النص اليوناني القيد الزمني بعد عبارة الخروج من القبور وقبل الفعل الرئيس «دخلوا». تحافظ الترجمة على هذا الترتيب، ولا تستنتج من الآية توقيت فتح القبور بما يتجاوز ما يقوله السياق.
- issue: مرجع الضمير في αὐτοῦ
  choice: أُبقي الضمير في «قيامته»، ومرجعه يسوع بحسب السياق المباشر.
  alternative: «بعد قيامة يسوع» للتصريح بالمرجع.
  rationale: الضمير واضح في السياق، وإبقاؤه يحافظ على بنية النص من غير إضافة اسم غير مذكور صراحة في هذه الجملة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وإذ» للحفاظ على تبعية اسم الفاعل اليوناني للفعل الرئيس من غير ثقل، وأُبقي التعبير الكتابي «المدينة المقدسة» مع توضيحه في الهامش.
