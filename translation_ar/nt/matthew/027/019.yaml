source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: ar
  text: 'وبينما كان جالسًا على كرسي القضاء، أرسلت إليه زوجته تقول: «لا شأن لك بذلك البارّ[a]، فقد عانيت اليوم كثيرًا في حلم بسببه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «البريء». يمكن أن تعني الكلمة اليونانية «البارّ» أو «العادل»، وفي السياق القضائي «البريء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: وبينما كان جالسًا
  rationale: ينقل تركيب المضاف المطلق والحدث المتزامن المستمر بصياغة عربية طبيعية.
- source_word: ἐπὶ τοῦ βήματος
  choice: على كرسي القضاء
  rationale: يدل βῆμα هنا على المقعد الرسمي الذي يجلس عليه الحاكم لإصدار الأحكام، لا على منصة مادية فحسب.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: أرسلت إليه زوجته تقول
  rationale: صياغة موجزة وطبيعية تفيد إرسال رسالة إليه، وتحافظ على الصلة التي يؤديها اسم الفاعل λέγουσα.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: لا شأن لك بذلك البارّ
  rationale: ينقل التعبير اليوناني الناقص بمعنى عدم التدخل أو التورط في أمره، مع إبقاء الوصف الأخلاقي والقضائي δίκαιος.
- source_word: πολλὰ γὰρ ἔπαθον σήμερον
  choice: فقد عانيت اليوم كثيرًا
  rationale: ينقل شدة التعبير πολλὰ πάσχω، وتفيد «فقد» التعليل والنتيجة الراهنة للتحذير بعبارة عربية سلسة.
- source_word: κατ’ ὄναρ δι’ αὐτόν
  choice: في حلم بسببه
  rationale: «في حلم» هي المقابل العربي الطبيعي للتجربة الحلمية، و«بسببه» تنقل دلالة السبب في διά مع النصب.
theological_decisions:
- issue: دلالة δίκαιος في وصف يسوع
  choice: البارّ
  alternative: البريء
  rationale: «البارّ» يحفظ البعد الأخلاقي الأوسع للكلمة في سياق متى، مع أن السياق القضائي يجيز فهمها بمعنى «البريء»، ولذلك أُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كرسي القضاء» لتوضيح الوظيفة القضائية، و«لا شأن لك» بوصفها عبارة عربية طبيعية للتحذير من التدخل، مع الحفاظ على الغموض الدلالي في δίκαιος بحاشية.
