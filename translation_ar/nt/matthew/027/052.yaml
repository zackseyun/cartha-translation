  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: ar
  text: وفُتحت القبور، وأُقيمت أجساد كثيرة للقديسين الراقدين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الراقدين» تعبير مجازي شائع يُقصد به «الذين ماتوا».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة عطف شائعة تحافظ على تتابع السرد من غير أن تضيف دلالة زمنية غير مصرّح بها.
- source_word: τὰ μνημεῖα
  choice: القبور
  rationale: تشير الكلمة إلى مواضع الدفن؛ و«القبور» تعبير عربي طبيعي وواضح في هذا السياق.
- source_word: ἀνεῴχθησαν
  choice: انفتحت
  rationale: تحافظ الصيغة على معنى المبني للمجهول دلاليًا من غير تحديد الفاعل أو كيفية الفتح.
- source_word: πολλὰ σώματα
  choice: أجساد كثيرة
  rationale: ترجمة مباشرة ومحايدة، وتتجنب التعبير الأشد تفسيرًا مثل «جثث».
- source_word: τῶν κεκοιμημένων
  choice: الراقدين
  rationale: يحفظ «الراقدين» الصورة المجازية الشائعة للموت، بدل إحلال التفسير «الذين ماتوا» محلها.
- source_word: ἁγίων
  choice: القديسين
  rationale: مقابل عربي مألوف للاسم الجمع الذي يدل على المنتمين إلى شعب الله المقدس، من غير تعيين هويتهم بما يتجاوز النص.
- source_word: ἠγέρθησαν
  choice: أُقيمت
  rationale: تنقل صيغة المبني للمجهول ومعنى الإقامة من الموت، مع تجنب حسم طبيعة الحدث بمصطلح أكثر تحديدًا مثل «بُعثت» أو «قامت قيامة نهائية».
theological_decisions:
- issue: طبيعة الحدث الذي يصفه ἠγέρθησαν
  choice: أُقيمت
  alternative: بُعثت؛ قامت من الموت
  rationale: «أُقيمت» تحافظ على لغة النص المحايدة نسبيًا، فلا تحسم في هذه الآية وحدها ما إذا كان الحدث قيامة نهائية أم عودة إلى الحياة من نوع آخر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة الرقاد للموت، كما حُفظ البناء الذي يجعل «أجساد كثيرة» فاعلًا نحويًا مؤخرًا لـ«أُقيمت». وُضعت علامة الحاشية بعد «الراقدين» لأنها اللفظة التي تشرحها الحاشية.
