base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: ar
  text: ومن الساعة السادسة حلَّ ظلامٌ على كلِّ البلاد إلى الساعة التاسعة.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الساعة السادسة توافق نحو الظهر، والساعة التاسعة نحو الثالثة بعد الظهر.
    reason: cultural_note
  - marker: b
    text: 'أو: «على الأرض كلها». فاللفظ اليوناني قد يعني «البلاد» أو «الأرض».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: ومن
  rationale: تنقل «مِن» نقطة ابتداء الزمن، وتحفظ الواو قوة δέ الرابطة الخفيفة من غير أن توحي بتعارض قوي.
- source_word: ἕκτης ὥρας
  choice: الساعة السادسة
  rationale: يحافظ التعبير على طريقة حساب الوقت الواردة في النص، مع توضيح مقابلها التقريبي في الحاشية.
- source_word: σκότος
  choice: ظلام
  rationale: هو المقابل العربي المباشر والطبيعي للفظ الدال على الظلمة هنا.
- source_word: ἐγένετο
  choice: حلَّ
  rationale: يفيد بدء حالة الظلام، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: على الأرض كلها
  rationale: لفظ γῆ يحتمل «الأرض» بمعنى البلاد أو اليابسة، كما يحتمل الأرض بمعناها الأوسع. أبقينا اللفظ العربي «الأرض» لما فيه من سعة دلالية مشابهة، مع بيان الاحتمالين في الحاشية.
- source_word: ἕως ὥρας ἐνάτης
  choice: إلى الساعة التاسعة
  rationale: يحافظ على تعبير الوقت في المصدر، ويُذكر المقابل الحديث التقريبي في الحاشية.
theological_decisions:
- issue: مدى الظلام في لفظ γῆ
  choice: الأرض كلها
  alternative: البلاد كلها، أو العالم كله
  rationale: لا يحسم اليوناني وحده هل المقصود المنطقة أو الأرض بأسرها. والصياغة العربية المختارة تحفظ قدرًا من هذا الاتساع، وتشرح الحاشية الاحتمال الدلالي بدل فرض نطاق جغرافي أو كوني محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ نظام عدّ الساعات القديم في المتن، واستُخدمت الحواشي لتوضيح الزمن ولصون الغموض الحقيقي في مدى لفظ γῆ.
