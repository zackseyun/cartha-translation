  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: ar
  text: 'حينئذ قال له بيلاطس: «أما تسمع كم يشهدون عليك؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: أداة زمنية تنقل السرد إلى الحدث التالي، و«حينئذ» فصيحة وطبيعية.
- source_word: λέγει
  choice: قال
  rationale: هو مضارع تاريخي في اليونانية، لكن الماضي أنسب للسرد العربي الطبيعي من محاكاة المضارع حرفيًا.
- source_word: αὐτῷ
  choice: له
  rationale: يحافظ على الضمير الصريح في الأصل من غير استبداله باسم يسوع، إذ يتضح مرجعه من السياق.
- source_word: ὁ Πιλᾶτος
  choice: بيلاطس
  rationale: الاسم العلم يُذكر في العربية بلا أداة تعريف.
- source_word: Οὐκ ἀκούεις
  choice: أما تسمع
  rationale: يحفظ قوة الاستفهام المنفي مع نبرة الاستنكار أو الحث التي تفيدها الصيغة في السياق.
- source_word: πόσα
  choice: كم
  rationale: تنقل مقدار الأمور الكثيرة المشهود بها من غير إضافة لفظ «اتهامات» غير الموجود صراحة في الأصل.
- source_word: σου ... καταμαρτυροῦσιν
  choice: يشهدون عليك
  rationale: «يشهد على» تعبير عربي طبيعي يحفظ المعنى القضائي للفعل المركب، ولا يختزله في مجرد الاتهام.
