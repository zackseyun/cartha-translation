  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: ar
  text: وبعد أن تشاوروا، اشتروا بها حقل الخزّاف ليكون مقبرةً للغرباء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: بعد أن تشاوروا
  rationale: ينقل معنى التعبير الاصطلاحي «أخذوا مشورة» بصياغة عربية طبيعية، مع الحفاظ على دلالة التشاور السابق للشراء.
- source_word: δὲ
  choice: و
  rationale: تؤدي هنا وظيفة مواصلة السرد، ولا تدل على مقابلة قوية تستلزم «لكن».
- source_word: ἠγόρασαν
  choice: اشتروا
  rationale: مقابل عربي مباشر وطبيعي للفعل الدال على الشراء.
- source_word: ἐξ αὐτῶν
  choice: بها
  rationale: يعود الضمير المحايد في السياق إلى قطع الفضة المذكورة سابقًا؛ و«بها» تحافظ على الإحالة الضميرية وتعبّر طبيعيًا عن وسيلة الدفع.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: حقل الفخّاري
  rationale: ترجمة طبيعية للتركيب الإضافي، وتناسب استعمال العبارة اسمًا معروفًا للمكان في سياق الرواية.
- source_word: εἰς ταφὴν
  choice: ليكون مقبرةً
  rationale: توضح الغرض المقصود من شراء الحقل، وهو تخصيصه مكانًا للدفن، من غير إضافة تفاصيل غير موجودة في النص.
- source_word: τοῖς ξένοις
  choice: للغرباء
  rationale: «الغرباء» تشمل غير المقيمين والوافدين من خارج المكان، وتحافظ أيضًا على مدى اللفظة اليونانية الأوسع من معنى الجنسية وحدها.
theological_decisions:
- issue: مرجع الضمير في ἐξ αὐτῶν
  choice: اعتُبر الضمير عائدًا إلى قطع الفضة التي أعادها يهوذا، وتُرجم «بها».
  alternative: يمكن توضيح المرجع تفسيريًا بعبارة «بذلك المال».
  rationale: السياق السابق يعيّن قطع الفضة مرجعًا للضمير، أما إبقاء الإحالة الضميرية في المتن فيتجنب التوسع التفسيري مع توفير البديل في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت «تشاوروا» بدل النقل الحرفي غير الطبيعي «أخذوا مشورة»، و«مقبرة» لتوضيح أن الحقل خُصص مكانًا للدفن. وُضعت علامتا الحاشيتين عند اللفظتين اللتين تتصل بهما البدائل مباشرة.
