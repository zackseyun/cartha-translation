  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: ar
  text: فطرح قطع الفضة في الهيكل[a]، ثم انصرف وذهب فشنق نفسه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مقدس الهيكل»؛ فاللفظ اليوناني هنا هو ناوُس (naos)، ويشير غالبًا إلى مبنى المقدس نفسه، لا إلى مجمّع الهيكل كله.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: فطرح
  rationale: اسم الفاعل الأوريستي يعبّر عن فعل سبق الفعل الرئيس؛ وصيغة «فطرح» تنقل تتابع الأحداث بإيجاز وطبيعية.
- source_word: τὰ ἀργύρια
  choice: قطع الفضة
  rationale: اللفظ يعني حرفيًا «الفضة»، لكنه يشير في السياق إلى القطع المدفوعة ليهوذا؛ و«قطع الفضة» واضحة وتحافظ على مادة النقد من غير تحويلها إلى لفظ عام مثل «المال».
- source_word: εἰς τὸν ναὸν
  choice: في الهيكل
  rationale: الفعل «طرح» مع «في» يؤدي معنى الإلقاء إلى الداخل طبيعيًا بالعربية، و«الهيكل» هو المصطلح العربي المألوف للمعبد في هذا السياق؛ أما دلالة ναός الأخص فتُبيَّن في الحاشية.
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: ينقل معنى المغادرة أو الانسحاب بعبارة عربية موجزة تلائم النبرة السردية الجادة.
- source_word: ἀπελθὼν
  choice: ذهب
  rationale: يحفظ فعل الحركة الثاني من دون التكرار الثقيل «انصرف وذهب بعيدًا»، ويهيئ طبيعيًا للفعل التالي.
- source_word: ἀπήγξατο
  choice: شنق نفسه
  rationale: الصيغة الوسطى تدل على فعل موجَّه إلى الذات، والسياق يفيد الانتحار شنقًا؛ وهذه العبارة هي المقابل العربي الواضح المعتاد.
theological_decisions:
- issue: الدلالة الخاصة لـ ναός مقارنةً بلفظ عموم مجمّع الهيكل
  choice: «الهيكل» في المتن مع توضيح «المقدس» في الحاشية
  alternative: «المقدس» أو «مقدس الهيكل»
  rationale: قد يدل ναός تحديدًا على مبنى المقدس لا على مجمّع الهيكل كله. يحافظ المتن على التعبير العربي المألوف، فيما تصون الحاشية الدقة المعمارية من غير الجزم بمدى إمكان وصول يهوذا إلى داخل المقدس نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت الفاءات لنقل سرعة تتابع الأفعال، وحُفظ فعلا المغادرة ἀνεχώρησεν وἀπελθὼν بصيغتين عربيتين طبيعيتين من غير ترادف مثقل.
