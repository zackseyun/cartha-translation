lexical_decisions:
- source_word: δὲ
  choice: أما... فـ
  rationale: تؤدي معنى الانتقال مع مقابلة خفيفة في السياق، وهي صياغة عربية فصيحة وطبيعية دون تضخيم قوة الأداة.
- source_word: πάλιν
  choice: أيضًا
  rationale: تدل على تكرار الصرخة، و«أيضًا» واضحة هنا ومتصلة بالسياق السابق.
- source_word: κράξας
  choice: صرخ
  rationale: ينقل قوة الفعل الدال على إطلاق صوت مرتفع، وصيغ الفعلين المتعاطفين طبيعية في العربية مع حفظ تتابع الحدثين.
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عظيم
  rationale: صياغة عربية مفهومة تحفظ الوصف اليوناني حرفيًا نسبيًا، حيث تدل «عظيم» في هذا السياق على شدة الصوت وارتفاعه.
- source_word: ἀφῆκεν
  choice: أسلم
  rationale: مع «الروح» تؤدي العبارة الاصطلاحية المتعلقة بالموت، وتحفظ صورة الإطلاق أو التسليم الكامنة في الفعل بدل استبدالها بتفسير مباشر.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: يحفظ الاسم والتعريف الواردين في اليونانية، كما أن العبارة العربية «أسلم الروح» طبيعية ولا تحتاج إلى إضافة ضمير ملكية غير مصرح به.
theological_decisions:
- issue: ترجمة التعبير ἀφῆκεν τὸ πνεῦμα الدال على الموت
  choice: أسلم الروح
  alternative: لفظ أنفاسه الأخيرة
  rationale: تحفظ «أسلم الروح» لفظ πνεῦμα وصورة الفعل ἀφίημι مع بقاء العبارة مفهومة عربيًا. أما «لفظ أنفاسه الأخيرة» فتوضح معنى الموت، لكنها تحول «الروح» إلى «الأنفاس» وتزيد عنصر «الأخيرة» غير المذكور صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تناسب مشهد الصلب. اختيرت «أما يسوع فـ» لتمثيل δὲ، وحُفظ التعبير «أسلم الروح» لما فيه من قرب إلى الأصل وطبيعية راسخة في العربية.
