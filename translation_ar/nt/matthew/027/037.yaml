  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: ar
  text: 'ووضعوا فوق رأسه التهمة الموجَّهة إليه[a] مكتوبة: «هذا هو يسوع، ملك اليهود[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الاتهام الموجَّه إليه». تحمل الكلمة اليونانية هنا معنى قضائيًّا.
    reason: lexical_alternative
  - marker: b
    text: أو «ملك أهل اليهودية». قد تدل الكلمة اليونانية على اليهود بوصفهم شعبًا أو على أهل منطقة اليهودية، بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: وضعوا
  rationale: ينقل الفعل الماضي الدال على وضع الكتابة فعليًّا، بصياغة عربية طبيعية مباشرة.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: فوق رأسه
  rationale: يعبّر بوضوح عن الموقع الأعلى من الرأس، من غير أن يوحي بأن الكتابة وُضعت على الرأس نفسه.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: التهمة الموجَّهة إليه
  rationale: يحفظ المعنى القضائي لكلمة αἰτία في سياق الإعدام، ويبيّن أن التهمة منسوبة إليه لا صادرة عنه.
- source_word: γεγραμμένην
  choice: مكتوبة
  rationale: ينقل اسم المفعول اليوناني بإيجاز ويحافظ على وصف التهمة بأنها نص مكتوب.
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: هذا هو يسوع
  rationale: ترجمة مباشرة وطبيعية لاسم الإشارة وفعل الكينونة والاسم الشخصي.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ملك اليهود
  rationale: يحفظ صيغة اللقب الملكي المعهودة في رواية الآلام، مع عربية سليمة لا تحتاج إلى أداة تعريف قبل «ملك» في هذا التركيب.
theological_decisions:
- issue: الصياغة القانونية للكتابة فوق الصليب
  choice: التهمة الموجَّهة إليه
  alternative: الاتهام الموجَّه إليه
  rationale: «التهمة» أوضح في العربية الحديثة للدلالة على الجرم الرسمي المنسوب إلى المتهم، من غير إضافة تفسير لاهوتي.
- issue: دلالة Ἰουδαίων في اللقب
  choice: اليهود
  alternative: اليهوديين، أي أهل اليهودية
  rationale: «اليهود» هو المقابل الطبيعي والمتعارف عليه في صيغة اللقب السياسية هنا، مع حفظ الإمكان الجغرافي للكلمة اليونانية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «التهمة الموجَّهة إليه» لإظهار المعنى القضائي وتجنب التباس الإضافة في «تهمته»، وحُفظ البديل الجغرافي لـἸουδαίων في الحاشية.
