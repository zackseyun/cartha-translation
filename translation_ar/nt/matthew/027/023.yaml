base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: ar
  text: 'فقال: «فأيَّ شرٍّ فعل؟»[a] أمّا هم فكانوا يصرخون أكثر فأكثر قائلين: «لِيُصلَبْ!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر سلاسة: «ولماذا؟ ما الشرّ الذي فعله؟»'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُصاغ العبارة بأسلوب مباشر: «اصلِبْه!» أمّا اليونانية فحرفيًّا: «لِيُصلَبْ!»'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: فقال
  rationale: ينقل فعل القول السردي البسيط مع بقاء المقابلة مع ردّ الجموع مفهومة من السياق، من غير إثقال العربية بضمير منفصل غير لازم.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: فأيَّ شرٍّ فعل؟
  rationale: تحافظ الفاء على وظيفة γάρ في التعليل أو الاعتراض، وتنقل κακόν بلفظ «شرّ» ذي القوة الأخلاقية، مع سؤال عربي واضح.
- source_word: περισσῶς ἔκραζον
  choice: صرخوا أكثر فأكثر
  rationale: يفيد التعبير تصاعد صراخهم وإلحاحهم؛ و«أكثر فأكثر» ينقل معنى περισσῶς من غير حصره في علوّ الصوت وحده.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على تزامن القول مع الصراخ وعلى البنية الوصفية للمصدر.
- source_word: Σταυρωθήτω
  choice: لِيُصلَبْ
  rationale: صيغة عربية موجزة تحفظ الأمر للغائب والبناء للمجهول في الأصل اليوناني.
theological_decisions:
- issue: صياغة مطالبة الجموع بالصلب
  choice: لِيُصلَبْ
  alternative: اصلِبْه
  rationale: الأصل يستعمل أمرًا للغائب مبنيًا للمجهول، ولذلك تُحفظ هذه الصيغة بدل تحويلها إلى أمر مباشر مبني للمعلوم، من غير استنتاج لاهوتي إضافي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعمل «شرّ» للمحافظة على القوة الأخلاقية في κακόν، وحُفظ البناء للمجهول في مطلب الجموع. ضُبطت «لِيُصلَبْ» لمنع التباس صيغة الأمر.
