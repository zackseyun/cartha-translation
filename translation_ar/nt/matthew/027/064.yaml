  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: ar
  text: 'فمُرْ، إذن، بأن يُؤمَّن القبر حتى اليوم الثالث، لئلا يأتي[a] تلاميذه فيسرقوه ويقولوا للشعب: «لقد أُقيم من بين الأموات»[b]، فتكون الخدعة الأخيرة أسوأ من الأولى.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف بعض المخطوطات «ليلًا» بعد «يأتي»: «لئلا يأتي تلاميذه ليلًا ويسرقوه». اتُّبعت هنا القراءة الأقصر.'
    reason: textual_variant
  - marker: b
    text: 'أو: «أُقيم من بين الأموات». الفعل اليوناني مبني للمجهول، ويمكن نقله أيضًا بصيغة الماضي البسيط.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: فمُرْ
  rationale: فعل أمر موجَّه إلى صاحب سلطة، و«مُرْ» موجز وطبيعي ويحفظ قوة الطلب الرسمي.
- source_word: οὖν
  choice: إذن
  rationale: يفيد الاستنتاج مما سبق؛ وأُدمج مع الفاء لربط الكلام بالسياق ربطًا عربيًا طبيعيًا.
- source_word: ἀσφαλισθῆναι τὸν τάφον
  choice: أن يُؤمَّن القبر
  rationale: يحفظ المبني للمجهول ويدل على جعل القبر محكم الحماية دون حصر الوسيلة في الحراسة وحدها.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: إلى اليوم الثالث
  rationale: تعبير زمني عربي واضح يحافظ على الصلة بقول يسوع السابق عن اليوم الثالث.
- source_word: μήποτε
  choice: لئلا
  rationale: تنقل معنى التحوّط من احتمال مخوف يراد منعه.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية طبيعية ومباشرة للإضافة اليونانية.
- source_word: κλέψωσιν αὐτὸν
  choice: يسرقوه
  rationale: يحافظ على ضمير الشخص الوارد في اليونانية، ولا يستبدله بتفسير مثل «يسرقوا جسده».
- source_word: τῷ λαῷ
  choice: للشعب
  rationale: λαός يدل هنا على الشعب عامة، لا على جمع حاضر بعينه.
- source_word: Ἠγέρθη
  choice: لقد أُقيم
  rationale: يحفظ المبني للمجهول في اليونانية ولا يصرّح بفاعل لم يذكره النص.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: من بين الأموات
  rationale: ينقل دلالة التعبير اليوناني الجمعي بوضوح في سياق القيامة.
- source_word: ἡ ἐσχάτη πλάνη
  choice: التضليل الأخير
  rationale: في السياق يتحدث المتكلمون عن ادعاء يضلّل الشعب؛ و«التضليل» أوضح عربيًا من «الضلالة» مع إبقاء الحكم صادرًا عنهم.
theological_decisions:
- issue: صياغة خبر القيامة في الكلام المنقول
  choice: لقد أُقيم من بين الأموات
  alternative: قام من بين الأموات
  rationale: اختير المبني للمجهول موافقةً لـἨγέρθη، حفظًا لصيغة النص ولإمكان دلالتها اللاهوتية دون تعيين الفاعل صراحة.
- issue: مرجع الضمير في فعل السرقة
  choice: يسرقوه
  alternative: يسرقوا جسده
  rationale: النص اليوناني يقول حرفيًا «يسرقوه»، ولذلك لم يُستبدل الضمير بتفسير يحدد «الجسد»، مع أن السياق يفهم منه ذلك.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. استُخدم «يُؤمَّن» بمعنى يُجعل محكم الحماية، وحُفظ المبني للمجهول في خبر القيامة. وُضعت علامتا الحاشيتين في المتن كما هو مطلوب.
