reference: Matthew 27:60
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: ar
  text: ووضعه في قبره الجديد الذي كان قد نحته في الصخر، ثم دحرج حجرًا كبيرًا إلى مدخل القبر[a] ومضى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى باب القبر». تستعمل اليونانية لفظًا يمكن أن يعني «الباب» أو «المدخل»؛ واختير «المدخل» للوضوح في سياق قبر منحوت في الصخر.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: وضعه
  rationale: ينقل فعل الوضع البسيط في سياق إيداع جسد يسوع في القبر، بصياغة عربية واضحة وطبيعية.
- source_word: καινῷ αὐτοῦ μνημείῳ
  choice: قبره الجديد
  rationale: يحافظ على معنى الجِدّة والملكية من غير إضافة أن القبر لم يُستعمل، لأن ذلك غير مصرح به في الآية.
- source_word: ἐλατόμησεν
  choice: كان قد نحته
  rationale: الفعل يدل على قطع القبر أو نحته في الصخر، وصيغة «كان قد» توضح أن إعداد القبر سبق وضع الجسد فيه.
- source_word: ἐν τῇ πέτρᾳ
  choice: في الصخر
  rationale: تعبير مباشر وأمين للموقع الذي نُحت فيه القبر، وهو طبيعي في العربية.
- source_word: προσκυλίσας
  choice: ثم دحرج
  rationale: «دحرج» يعبّر بدقة عن تحريك الحجر بالتدوير، و«ثم» تبين سبق هذا الفعل لذهابه.
- source_word: λίθον μέγαν
  choice: حجرًا كبيرًا
  rationale: ترجمة واضحة ومباشرة تحافظ على وصف حجم الحجر بلا مبالغة.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: إلى مدخل القبر
  rationale: يمكن أن تعني θύρα الباب أو المدخل؛ و«المدخل» أوضح في سياق قبر منحوت في الصخر، مع حفظ البديل في الحاشية.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: صياغة عربية موجزة وكريمة تؤدي معنى الانصراف واستمرار الحركة السردية.
theological_decisions: []
