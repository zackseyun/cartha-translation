    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: ظرف زمان ينقل السرد إلى الحدث التالي، و«حينئذٍ» فصيحة وطبيعية في هذا السياق.
- source_word: σταυροῦνται
  choice: صُلِبَ
  rationale: فعل مضارع مبني للمجهول استُعمل مضارعًا تاريخيًا لإضفاء الحيوية على السرد؛ حُوِّل إلى الماضي العربي لأن هذا هو الأسلوب الطبيعي في السرد مع الحفاظ على المبني للمجهول.
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: تفيد σύν مع المجرور المصاحبة، وتؤدي «معه» المعنى بإيجاز ووضوح.
- source_word: δύο λῃσταί
  choice: لِصّان
  rationale: المثنى العربي يعبّر طبيعيًا عن العدد اثنين، و«لِصّ» هو المقابل الواضح العام، مع إثبات احتمال «قاطعَي طريق» في الحاشية.
- source_word: εἷς ἐκ δεξιῶν
  choice: أحدهما عن اليمين
  rationale: تعبير مكاني اصطلاحي يدل على وجود أحدهما في الجانب الأيمن.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: والآخر عن اليسار
  rationale: الصياغة العربية الطبيعية للمقابلة بين الشخصين والجانبين، من غير حاجة إلى تكرار «أحدهما» حرفيًا.
theological_decisions:
- issue: هوية λῃσταί
  choice: لِصّان
  alternative: قاطعَا طريق؛ متمرّدان
  rationale: قد تدل اللفظة على لصوص عنيفين أو قطاع طرق، وقد تتداخل في بعض السياقات مع نشاط تمرّدي، لكن الآية نفسها لا تثبت هوية سياسية أضيق؛ لذلك اختير المقابل العام مع بيان البديل المعجمي في الحاشية.
