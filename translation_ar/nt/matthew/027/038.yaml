  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: ar
  text: حينئذٍ صُلِبَ معه لِصّان[a]، أحدهما عن يمينه والآخر عن يساره.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
