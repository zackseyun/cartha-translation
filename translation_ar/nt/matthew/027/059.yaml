lexical_decisions:
- source_word: λαβὼν
  choice: أخذ
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق الفعل الرئيس؛ وصياغته فعلًا معطوفًا طبيعية في السرد العربي وتحفظ تسلسل الحدث.
- source_word: σῶμα
  choice: الجسد
  rationale: نقل مباشر للاسم اليوناني مع أداة التعريف، من غير إضافة ضمير ملكية غير مصرح به في النص.
- source_word: ἐνετύλιξεν
  choice: لفَّه
  rationale: الفعل يعني لفَّ الشيء أو أحاطه بلفافة، و«لفَّه» تعبير عربي طبيعي ودقيق في سياق الدفن.
- source_word: αὐτό
  choice: ـه في «لفَّه»
  rationale: الضمير اليوناني محايد ويعود نحويًا إلى «الجسد». وفي العربية «الجسد» مذكر، ولذلك يأتي الضمير مذكرًا؛ كما يمكن أن يُفهم طبيعيًا على أنه يشير إلى يسوع، من غير حسم زائد.
- source_word: σινδόνι
  choice: بقطعة كتان
  rationale: يدل اللفظ على قطعة قماش كتانية، وقد تكون في هذا السياق لفافة للدفن. «قطعة كتان» واضحة وتحافظ على عموم اللفظ دون أن تخصّصه حتمًا بكفن.
- source_word: καθαρᾷ
  choice: نظيفة
  rationale: في وصف قطعة القماش، «نظيفة» هي المقابل العربي الطبيعي لـ«نقية/طاهرة» وتناسب السياق المادي.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: وأخذ يوسف
  rationale: تحفظ الواو استمرارية السرد التي تؤديها καί، مع ترتيب عربي واضح وطبيعي.
