  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: ar
  text: 'قائلًا: «قد أخطأتُ إذ أسلمتُ دمًا بريئًا[a]». فقالوا: «ما شأن ذلك بنا؟ أنت تتولّى ذلك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «بعدما أسلمتُ دمًا بريئًا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أنت سترى»؛ وهي هنا عبارة تنصّل بمعنى: «الأمر من مسؤوليتك».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: قد أخطأتُ
  rationale: الماضي اليوناني يعبّر عن إقرار مباشر بفعل تمّ وبقيت تبعته حاضرة؛ و«قد أخطأت» عربية طبيعية تحفظ قوة الاعتراف من غير زيادة تفسيرية.
- source_word: παραδοὺς
  choice: إذ أسلمتُ
  rationale: اسم الفاعل الماضي يبيّن الفعل الذي وقع به الذنب. و«أسلم» يحفظ معنى التسليم إلى الخصوم، مع بقاء دلالة الخيانة مفهومة من السياق من غير أن تُستبدل العبارة بتفسير أضيق.
- source_word: αἷμα ἀθῷον
  choice: دمًا بريئًا
  rationale: يحفظ التعبير الكتابي والقانوني المكثف في اليونانية، ولا يصرّح باسم صاحب الدم لأن الأصل يتركه ضمنيًا.
- source_word: Τί πρὸς ἡμᾶς;
  choice: ما شأننا نحن؟
  rationale: تعبير عربي موجز وطبيعي يؤدي معنى التنصل من الصلة والمسؤولية في العبارة اليونانية.
- source_word: σὺ ὄψῃ
  choice: أنت تتولّى ذلك
  rationale: المستقبل الأوسط يُستعمل هنا استعمالًا اصطلاحيًا زاجرًا بمعنى أن الأمر يقع على عاتق المخاطَب. الصياغة العربية تنقل هذا الرفض، مع توثيق الصورة الأقرب حرفيًا في الحاشية.
theological_decisions:
- issue: هل يُصرَّح بأن الدم البريء هو دم يسوع؟
  choice: إبقاء المرجع ضمنيًا في عبارة «دمًا بريئًا».
  alternative: «دم رجل بريء» أو «دم يسوع البريء».
  rationale: الأصل لا يسمّي يسوع ولا يضيف «رجل»، وإبقاء الإضمار يصون العبارة الكتابية وقوتها الأخلاقية والقانونية دون تجاوز النص.
- issue: 'قوة العبارة σὺ ὄψῃ: خبر مستقبلي أم صرفٌ للمسؤولية؟'
  choice: 'نقلها اصطلاحيًا: «أنت تتولّى ذلك».'
  alternative: «أنت سترى» أو «دبّر أمرك».
  rationale: السياق يدل على تنصّل المتكلمين من المسؤولية، لكن الصيغة اليونانية تحتفظ بصورة المستقبل؛ لذلك يُنقل المعنى الاصطلاحي في المتن وتُذكر الصورة الأقرب حرفيًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «أسلمت» لقربه من παραδίδωμι ولشيوعه في السياق الكتابي، مع تجنب إضافة اسم يسوع أو وصف «رجل». وأُبرز الضمير «أنت» لنقل المقابلة المشددة في σὺ.
