  text: لذلك سُمِّيَ ذلك الحقل «حقل الدم» إلى هذا اليوم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد نتيجةً مترتبة على ما سبق، وتحافظ على الرابط الاستنتاجي بوضوح وطبيعية.
- source_word: ἐκλήθη
  choice: سُمِّيَ
  rationale: تنقل صيغة الماضي المبني للمجهول من καλέω بدقة؛ واستمرار شيوع الاسم يُفهم من العبارة الزمنية اللاحقة.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ذلك الحقل
  rationale: تحافظ «الحقل» على المعنى المعتاد لـἀγρός وعلى تكرار اللفظة نفسها في اسم المكان، وتنقل اسم الإشارة بصياغة عربية طبيعية.
- source_word: Ἀγρὸς Αἵματος
  choice: حقل الدم
  rationale: ترجمة شفافة لاسم المكان، تحافظ على إضافة «حقل» إلى «الدم» وعلى الصلة اللفظية بالحقل المذكور قبلها.
- source_word: αἵματος
  choice: الدم
  rationale: تنقل مضافًا إليه مفردًا من αἷμα ضمن اسم المكان.
- source_word: ἕως τῆς σήμερον
  choice: إلى هذا اليوم
  rationale: 'تعبير عربي واضح يحفظ الدلالة الزمنية: بقاء الاسم متداولًا حتى زمن الكاتب.'
