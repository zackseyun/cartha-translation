source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: ar
  text: ولكن، لئلا نسيء إليهم[a]، اذهب إلى البحر، وألقِ صنّارة، وخذ أول سمكة تخرج. وحين تفتح فمها تجد إستاتيرًا[b]. فخذه وأعطهم إياه عني وعنك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لئلا نجعلهم يعثرون» أو «لئلا نثير استياءهم».'
    reason: lexical_alternative
  - marker: b
    text: الإستاتير عملة تساوي نحو أربع دراخمات، وكانت تكفي لدفع ضريبة الهيكل عن شخصين.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: نسيء إليهم
  rationale: يناسب السياق العملي، إذ المقصود تجنّب إثارة الاستياء أو الاعتراض بلا داعٍ، لا التسبب في سقوط أخلاقي؛ وتوضح الحاشية المعنى الحرفي المحتمل.
- source_word: θάλασσαν
  choice: البحر
  rationale: يحافظ على لفظ الأصل اليوناني، مع أن المقصود جغرافيًا بحر الجليل، وهو بحيرة.
- source_word: ἄγκιστρον
  choice: صنّارة
  rationale: لفظ عربي طبيعي وواضح لأداة صيد السمك المقصودة هنا.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: أول سمكة تصعد
  rationale: يحافظ على صورة الصعود الواردة في اليونانية، والمقصود أول سمكة تُسحب من الماء.
- source_word: ἆρον
  choice: خذ
  rationale: ينقل فعل أخذ السمكة بعد صيدها بإيجاز طبيعي.
- source_word: στατῆρα
  choice: إستاتيرًا
  rationale: يبقي اسم العملة المحددة في النص، ويشرح مقدارها ووظيفتها في الحاشية.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: عني وعنك
  rationale: تعبير عربي موجز وطبيعي يدل على دفع المبلغ نيابة عن كليهما.
- source_word: πορευθεὶς
  choice: اذهب
  rationale: ينقل فعل الحركة المصاحب للأوامر اللاحقة بصيغة عربية طبيعية.
- source_word: δὸς αὐτοῖς
  choice: أعطهم إياه
  rationale: يصرّح بضمير العملة المذكورة، ويظل معنى الدفع واضحًا من السياق.
theological_decisions:
- issue: دلالة σκανδαλίζω وصلتها بدفع ضريبة الهيكل
  choice: توجيه إلى الدفع تجنبًا للإساءة إليهم، من غير إلغاء لما سبق عن حرية الأبناء
  alternative: أن الدفع إقرار بوجوب مطلق، أو أنه مجرد إظهار لمعجزة بلا دلالة سلوكية
  rationale: السياق السابق يقرر حرية الأبناء، ثم يقدم هذا العدد تنازلًا عمليًا لتجنب الإساءة؛ لذلك تحفظ الصياغة هذا التوتر ولا تحسمه مذهبيًا.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. وُضعت علامتا الحاشيتين بحسب مضمونهما الصحيح: البديل المعجمي بعد «نسيء إليهم»، والمعلومة النقدية بعد «إستاتيرًا».'
