  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: ar
  text: ورفعوا أعينهم، فلم يروا أحدًا إلا يسوع وحده.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάραντες
  choice: ورفعوا
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق فعل الرؤية؛ وصيغة العطف بالفعل الماضي تنقل هذا التتابع بوضوح وطبيعية في العربية.
- source_word: δὲ
  choice: الواو
  rationale: أداة وصل سردية خفيفة، والواو أنسب مقابل عربي في هذا السياق من أداة استدراك قوية.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: أعينهم
  rationale: يحافظ التعبير على الصورة الجسدية الملموسة في اليونانية، وهو عربي فصيح مفهوم.
- source_word: οὐδένα
  choice: أحدًا
  rationale: مفعول به منفي، والتعبير «لم يروا أحدًا» هو المقابل العربي الطبيعي المباشر.
- source_word: εἶδον
  choice: لم يروا
  rationale: ينقل فعل الرؤية البسيط، مع النفي العربي الملائم للماضي.
- source_word: εἰ μὴ
  choice: إلا
  rationale: بعد النفي تفيد الاستثناء، و«إلا» هي الصيغة العربية الواضحة الموازية.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: يسوع وحده
  rationale: «وحده» تحصر المرئي في يسوع وتحافظ على التوكيد التراكمي في العبارة اليونانية من غير تركيب عربي متكلف.
theological_decisions:
- issue: التوكيد على أن يسوع هو الشخص الوحيد الباقي ظاهرًا بعد الرؤيا
  choice: إلا يسوع وحده
  alternative: إلا هو، يسوع وحده
  rationale: يحفظ الجمع بين الاستثناء والحصر، فيبيّن أن موسى وإيليا لم يعودا منظورين، من غير إضافة دلالة عقائدية تتجاوز المشهد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدم تركيب موجز يحافظ على تسلسل الحدث وعلى الحصر المؤكد في خاتمة الآية.
