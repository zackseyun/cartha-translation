id: MAT.17.26
reference: Matthew 17:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: ar
  text: 'فلما قال: «من الغرباء[a]»، قال له يسوع: «إذًا الأبناء[c] أحرار[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأجانب» أو «الآخرين». تقابل الكلمة اليونانية هنا بين من هم خارج بيت الحاكم وبين أبنائه، ولا يلزم أن تشير إلى اختلاف الجنسية.
    reason: lexical_alternative
  - marker: b
    text: أو «مُعفَون». والأصل اليوناني يقول حرفيًا «أحرار»، وهو ما يعني في هذا السياق أنهم غير ملزمين بدفع الضريبة.
    reason: lexical_alternative
  - marker: c
    text: أو «الأولاد»، لكن اللفظ اليوناني يعني تحديدًا «الأبناء».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: فلما قال
  rationale: ترجمة طبيعية للتركيب المطلق في اليونانية، تحفظ دلالته الزمنية وتُظهر الانتقال السردي الذي تؤديه δέ.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: من الغرباء
  rationale: تشير الكلمة هنا إلى من ليسوا من بيت الحاكم، في مقابل أبنائه. و«الغرباء» تحفظ هذا التقابل العلاقي من غير أن توحي بالضرورة باختلاف الجنسية.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: قال له يسوع
  rationale: صياغة عربية واضحة وقريبة من ترتيب المعنى في الأصل، وتؤدي الاستعمال السردي المعتاد للفعل φημί.
- source_word: Ἄρα γε
  choice: إذًا
  rationale: تفيد الاستنتاج المبني على جواب بطرس، و«إذًا» تؤدي هذا المعنى بوضوح وإيجاز في العربية المعاصرة.
- source_word: ἐλεύθεροί
  choice: أحرار
  rationale: تحفظ المعنى الحرفي الأوسع، أي عدم الخضوع للالتزام، بينما يُفهم من السياق أن المقصود المباشر هو الإعفاء من الضريبة.
- source_word: οἱ υἱοί
  choice: الأبناء
  rationale: تحفظ الدلالة الصريحة على البنين في تشبيه أبناء الحاكم، كما تصون التقابل الأسري والقانوني مع الغرباء.
theological_decisions:
- issue: دلالة οἱ υἱοί في قول قد يحمل معنى تمثيليًا لمن ينتمون إلى بيت الملك
  choice: الأبناء
  alternative: الأولاد
  rationale: الأصل اليوناني يستعمل صيغة البنين، والسياق المباشر يقارن أبناء الحاكم بمن هم خارج بيته. لذلك حُفظت دلالة البنوة من غير توسيع العبارة أو تحييدها.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كتابية رصينة. حُفظ الاستنتاج في «إذًا»، والتقابل بين «الغرباء» و«الأبناء»، كما أُبقيت «أحرار» في المتن لصون اتساع العبارة الأصلية مع شرح دلالة الإعفاء في الحاشية.
