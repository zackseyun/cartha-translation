  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: ar
  text: فانتهره يسوع، فخرج منه الشيطان، وشُفي الصبي من تلك الساعة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: انتهره
  rationale: ينقل معنى التوبيخ الحازم والسلطان في سياق إخراج الشيطان، من غير تحويل الفعل إلى مجرد «أمره».
- source_word: αὐτῷ
  choice: الضمير المستتر في «انتهره»
  rationale: يبقي الضمير مذكرًا كما في اليونانية، ويُفهم من السياق أن مرجعه الشيطان، مع عدم إضافة اسم صريح غير وارد في هذه الجملة.
- source_word: δαιμόνιον
  choice: الشيطان
  rationale: تعبير عربي واضح ومألوف عن الكائن الشيطاني المقصود؛ أما «روح نجس» فليس هو اللفظ الوارد هنا.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: خرج منه
  rationale: ترجمة مباشرة وطبيعية لعبارة إخراج الشيطان، وتحافظ على صورة الخروج من الصبي.
- source_word: ἐθεραπεύθη
  choice: شُفي
  rationale: ينقل المبني للمجهول ونتيجة الشفاء من غير حصرها في معنى طبي ضيق.
- source_word: ὁ παῖς
  choice: الصبي
  rationale: السياق يتحدث عن ابن الرجل، ولذلك «الصبي» أدق من «الخادم» وأخص من «الطفل».
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: من تلك الساعة
  rationale: يحافظ على التعبير الزمني اليوناني حرفيًا بدرجة طبيعية ومفهومة في العربية الفصحى.
theological_decisions:
- issue: مرجع الضمير αὐτῷ في انتهار يسوع
  choice: الشيطان، مع إبقاء المرجع ضمنيًا في الضمير
  alternative: الصبي
  rationale: الجملة التالية، «فخرج منه الشيطان»، ترجّح بقوة أن الانتهار وُجّه إلى الشيطان لا إلى الصبي. وإبقاء الضمير بدل التصريح بالاسم يحافظ كذلك على صياغة الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع إيقاع سردي كتابي رصين. استُخدمت الفاء لبيان تعاقب الحدث ونتيجته طبيعيًا في العربية.
