base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: ar
  text: ولمّا وصلوا إلى الجمع، تقدَّم إليه[a] رجلٌ جاثيًا على ركبتيه أمامه[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «دنا منه».
    reason: بديل معجمي للفعل προσῆλθεν.
  - marker: b
    text: أو «خارًّا على ركبتيه أمامه».
    reason: بديل يصرّح بالحركة الجسدية التي يدل عليها γονυπετῶν.
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط تواصل السرد السابق من غير إضافة دلالة تفسيرية.
- source_word: ἐλθόντων
  choice: لمّا وصلوا
  rationale: اسم الفاعل الماضي في تركيب المضاف المطلق يفيد الزمن، وفاعله الجمع مفهوم من السياق؛ وهذه صياغة عربية طبيعية تحافظ على معنى الوصول.
- source_word: πρὸς τὸν ὄχλον
  choice: إلى الجمع
  rationale: ὄχλος يدل على جماعة محتشدة؛ و«الجمع» لفظ عربي واضح وموجز يلائم السياق.
- source_word: προσῆλθεν αὐτῷ
  choice: تقدَّم إليه
  rationale: يفيد الفعل الاقتراب من شخص، وتؤدي هذه العبارة اتجاه الحركة نحو يسوع بوضوح.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: يشير الاسم هنا إلى فرد ذكر بالغ بعينه، لا إلى الإنسان على وجه العموم.
- source_word: γονυπετῶν αὐτόν
  choice: جاثيًا أمامه
  rationale: يصف اسم الفاعل هيئة الرجل وهو يتقدم، أي ركوعه على ركبتيه أمام يسوع؛ وتحافظ الصياغة على تزامن الفعلين وإيجاز الأصل.
theological_decisions:
- issue: دلالة ἄνθρωπος في الإشارة السردية إلى فرد
  choice: رجل
  alternative: شخص
  rationale: السياق يشير إلى فرد ذكر بعينه، لذلك تنقل «رجل» المرجع المقصود من غير تعميم أنثروبولوجي.
- issue: دلالة الجثو أمام يسوع
  choice: وصف الهيئة الجسدية من غير تسمية الفعل عبادة
  alternative: ساجدًا له
  rationale: γονυπετέω يصرّح بالجثو على الركبتين أمام شخص، لكنه لا يحسم وحده المقصد اللاهوتي للفعل؛ لذا تجنبت الصياغة أن تضيف حكمًا بأنه سجود تعبدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «لمّا» للصلة الزمنية، وحُفظ البناء الوصفي لاسم الفاعل في «جاثيًا». تُركت الفاصلة الختامية لأن الآية تتصل نحويًا بما يليها.
