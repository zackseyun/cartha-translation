  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: ar
  text: حينئذ فهم التلاميذ أنه كان قد تكلّم إليهم عن يوحنا المعمدان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يوحنا الذي كان يعمّد».
    reason: بديل معجمي يبرز أن اللقب اليوناني βαπτιστής يصف من يقوم بالتعميد.
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني يحدد لحظة فهم التلاميذ، وهو رابط سردي عربي موجز وطبيعي.
- source_word: συνῆκαν
  choice: فهم
  rationale: يدل الفعل على إدراك المعنى، و«فهم» واضحة ومباشرة من غير مبالغة.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: المقابل العربي المألوف في السرد الإنجيلي لتلاميذ يسوع.
- source_word: ὅτι
  choice: أن
  rationale: تدخل على مضمون ما فهمه التلاميذ، لا على جملة سببية.
- source_word: περὶ
  choice: عن
  rationale: تفيد موضوع الكلام مع المضاف إليه، و«عن» هي الصياغة العربية الطبيعية هنا.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: يوحنا المعمدان
  rationale: اللقب العربي التقليدي الواضح ليوحنا، مع إثبات البديل الدلالي في الحاشية.
- source_word: εἶπεν αὐτοῖς
  choice: كان يتحدث إليهم
  rationale: تنقل سبق كلامه على لحظة فهمهم بصياغة عربية طبيعية، وتحافظ على دلالة فعل القول العامة.
theological_decisions:
- issue: تحديد المقصود بشخص إيليا في السياق المباشر
  choice: يصرح النص بأن التلاميذ فهموا أن يسوع كان يتحدث عن يوحنا المعمدان.
  alternative: ترك مرجع الكلام مبهما أو إضافة شرح لاهوتي لعلاقة يوحنا بإيليا.
  rationale: السارد نفسه يحدد المرجع هنا؛ لذلك يُنقل التحديد بوضوح من غير توسيع أو تسوية للتوترات الواردة في السياق الأوسع.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «حينئذ» رابطا سرديا، و«يوحنا المعمدان» بوصفه اللقب العربي الأشهر، مع بيان البديل الوصفي في الحاشية.
