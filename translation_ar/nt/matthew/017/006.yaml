  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: ar
  text: فَلَمَّا سَمِعَ التَّلَامِيذُ ذَلِكَ، سَقَطُوا عَلَى وُجُوهِهِمْ[a] وَخَافُوا خَوْفًا شَدِيدًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «على وجههم»؛ واستُعمل الجمع في العربية لملاءمة تعدد التلاميذ.'
    reason: lexical_alternative
  - marker: b
    text: أي إنهم خافوا خوفًا بالغًا؛ فاللفظة اليونانية σφόδρα تشدد درجة الخوف.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: فَلَمَّا سَمِعَ ... ذَلِكَ
  rationale: حُوِّل اسم الفاعل اليوناني الدال على حدث سابق أو مصاحب إلى جملة زمنية عربية طبيعية. ويعود اسم الإشارة «ذلك» إلى ما سمعه التلاميذ في السياق السابق، أي الصوت، من غير التصريح بما لم يذكره هذا العدد.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: المقابل العربي المألوف في الأناجيل، ويشير هنا إلى تلاميذ يسوع الحاضرين.
- source_word: ἔπεσαν
  choice: سَقَطُوا
  rationale: ينقل الفعل الخبري البسيط من غير إضافة معنى التعمد أو العبادة صراحة.
- source_word: ἐπὶ πρόσωπον αὐτῶν
  choice: عَلَى وُجُوهِهِمْ
  rationale: تعبير عربي طبيعي يصور هيئة الانكباب أرضًا، مع استعمال الجمع الملائم لتعدد الفاعلين، مع أن اليونانية تستعمل «وجه» بالمفرد.
- source_word: ἐφοβήθησαν
  choice: خَافُوا
  rationale: صياغة عربية مباشرة وطبيعية تنقل الخوف من غير حسم طبيعته بوصفه رعبًا أو خشية تعبدية.
- source_word: σφόδρα
  choice: خَوْفًا شَدِيدًا
  rationale: ينقل شدة الخوف بتركيب عربي فصيح واضح؛ فالمصدر المؤكد مع الصفة يؤدي وظيفة الظرف اليوناني المكثِّف.
theological_decisions:
- issue: طبيعة استجابة التلاميذ للصوت الإلهي
  choice: إبقاء السقوط على الوجوه والخوف الشديد كما يصفهما النص، من غير وصفهما صراحة بالعبادة أو بالرعب.
  alternative: يمكن تفسير الهيئة بوصفها سجودًا تعبديًا، أو تفسير الخوف بوصفه رعبًا أمام الظهور الإلهي.
  rationale: يذكر اليوناني الهيئة الجسدية وشدة الخوف، لكنه لا يحدد هنا التوصيف اللاهوتي للاستجابة؛ لذلك تحافظ الترجمة على هذا التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعملت «فلما» لربط السماع بالاستجابة زمنيًا، وتُجنبت ألفاظ مثل «سجدوا» لأنها قد تحسم دلالة الفعل الجسدي لاهوتيًا بأكثر مما يقوله النص.
