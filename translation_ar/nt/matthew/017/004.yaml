  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ar
  text: 'فقال بطرس ليسوع: «يا رب، حسنٌ أن نكون هنا. إن شئت، أصنع هنا ثلاث مظالّ[a]: واحدة لك، وواحدة لموسى، وواحدة لإيليا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خيامًا» أو «أكواخًا». واللفظ اليوناني يدل على مساكن مؤقتة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν
  choice: فقال بطرس
  rationale: الصيغة اليونانية «أجاب وقال» أسلوب سردي اصطلاحي لبدء الكلام، ولا يلزم أن تسبقها مسألة منطوقة. اختصارها إلى «فقال» عربي طبيعي، مع نقل δέ بالفاء الدالة على التعاقب السردي.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ معنى اللقب والاحترام، ولا يحصره في معنى «المعلّم» وحده.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: حسنٌ أن نكون هنا
  rationale: تعبير عربي واضح وقريب من تركيب المصدر اليوناني، ويحفظ دلالة καλόν التقويمية.
- source_word: εἰ θέλεις
  choice: إن شئت
  rationale: صياغة عربية طبيعية ومحترمة تنقل معنى الرغبة أو المشيئة من غير توسع.
- source_word: ποιήσω
  choice: أصنع
  rationale: ينقل صيغة المستقبل في سياق العرض؛ والمضارع العربي بعد الشرط يفيد الجواب المقترح طبيعيًا، من غير تحديد طريقة إقامة المظال.
- source_word: σκηνάς
  choice: مظالّ
  rationale: يدل على مساكن أو أغطية مؤقتة، وهو لفظ عربي مفهوم يحافظ كذلك على إمكان الصلة الدلالية بعيد المظال من غير الجزم بها.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: واحدة لك، وواحدة لموسى، وواحدة لإيليا
  rationale: يحفظ تكرار μίαν والتوزيع الواضح على الأشخاص الثلاثة.
- source_word: ὧδε
  choice: هنا
  rationale: حُفظ اللفظ في موضعيه كما في اليونانية.
theological_decisions:
- issue: ترجمة κύριος في خطاب بطرس ليسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» يحفظ مجال اللقب بين الاحترام والدلالة اللاهوتية الممكنة، فلا يسطّحه إلى مجرد مخاطبة مهذبة.
- issue: دلالة σκηνάς في مشهد التجلي
  choice: مظالّ
  alternative: خيام أو أكواخ
  rationale: لا تصرّح الآية بأن المقصود إحالة إلى عيد المظال؛ لذلك اختير لفظ واسع نسبيًا، مع إبقاء البدائل في الحاشية وعدم حسم الصلة الشعائرية.
- issue: الصيغة الاصطلاحية ἀποκριθεὶς ... εἶπεν
  choice: فقال
  alternative: فأجاب بطرس وقال
  rationale: لم يسبق كلام بطرس سؤال منطوق في السياق المباشر؛ والترجمة العربية الطبيعية لا تحتاج إلى استنساخ الازدواج اليوناني، من غير تغيير مضمون القول.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعملت «حسنٌ» بدل صياغة عامية، و«إن شئت» للمخاطبة المحترمة. وُضع مؤشر الحاشية مباشرة بعد اللفظ المعني.
