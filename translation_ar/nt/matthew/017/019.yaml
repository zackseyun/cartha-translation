  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: ar
  text: 'حينئذٍ تقدّم التلاميذ إلى يسوع على انفراد وقالوا: «لماذا لم نقدر نحن أن نُخرجه[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يعود الضمير إلى الروح الشرير، أو إلى الصبي.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: أداة زمنية تربط الحدث بما سبقه وتقدّمه بعبارة عربية فصيحة وطبيعية.
- source_word: προσελθόντες
  choice: جاء
  rationale: اسم فاعل ماضٍ تابع للفعل الرئيس، ومن الطبيعي في العربية صياغته فعلًا تامًّا مع الفاعل.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: المقابل العربي المألوف في سياق الأناجيل لتلاميذ يسوع.
- source_word: τῷ Ἰησοῦ
  choice: إلى يسوع
  rationale: المجرور في اليونانية متمّم لفعل الاقتراب، وتؤديه العربية طبيعيًا بحرف الجر «إلى».
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: تعبير عربي واضح يفيد أنهم خاطبوه بعيدًا عن الآخرين.
- source_word: εἶπον
  choice: قالوا
  rationale: يحافظ على المعنى المباشر للفعل اليوناني، مع أن مضمون القول سؤال.
- source_word: Διὰ τί
  choice: لماذا
  rationale: الصيغة العربية الطبيعية للسؤال عن السبب.
- source_word: ἡμεῖς
  choice: نحن
  rationale: أُبقي الضمير المنفصل ليعكس بقدر طبيعي توكيد الضمير الصريح في اليونانية.
- source_word: οὐκ ἠδυνήθημεν
  choice: لم نقدر
  rationale: ينقل دلالة العجز بصياغة عربية مباشرة ومفهومة.
- source_word: ἐκβαλεῖν
  choice: أن نُخرجه
  rationale: الفعل «أخرج» هو التعبير العربي المألوف لطرد الروح الشرير في سياق الأناجيل، والضمير المتصل يحافظ على بنية المفعول.
- source_word: αὐτό
  choice: ـه
  rationale: الضمير العربي المذكر لا يحسم وحده هل المرجع هو الصبي أم الروح، وبذلك يحفظ الغموض الحقيقي في النص اليوناني على نحو طبيعي.
theological_decisions:
- issue: مرجع الضمير αὐτό في سياق إخراج الروح
  choice: استعمال الضمير المتصل المذكر في «نُخرجه» من دون تسمية المرجع
  alternative: التصريح بـ«نُخرج الروح» أو «نُخرج الصبي»
  rationale: قد يعود الضمير اليوناني المحايد إلى الروح بحسب السياق، أو يُفهم أنه يعود إلى الصبي. تسمح العربية بضمير مذكر يلائم كليهما، فتحفظ الاحتمالين ولا تفرض تفسيرًا لاهوتيًا أو سرديًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «على انفراد» لصياغة طبيعية، وأُبقي «نحن» لإظهار التوكيد اليوناني. حُفظ غموض مرجع الضمير في المتن، ووُضّح في الحاشية.
