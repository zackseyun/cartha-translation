id: MAT.17.25
reference: Matthew 17:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: ar
  text: 'قال: «نعم». ولما دخل البيت، بادره يسوع قائلاً: «ما رأيك يا سمعان؟ ممّن يأخذ ملوك الأرض الرسوم أو ضريبة الرأس[a]؟ أمن أبنائهم أم من الغرباء[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المكوس أو الجزية». تميّز اليونانية بين الرسوم أو المكوس (τέλη) وضريبة الرأس أو الجزية الضريبية (κῆνσος).
    reason: lexical_alternative
  - marker: b
    text: أي الذين ليسوا من أبناء الملوك ولا من أهل بيتهم، لا الغرباء بمعنى الأجانب حصرًا.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ναί
  choice: نعم
  rationale: جواب إثبات بسيط، وهذه هي الصياغة العربية الطبيعية المباشرة.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: ولما دخل البيت
  rationale: اسم الفاعل في صيغة النصب يعود إلى بطرس بوصفه المفعول المفهوم للفعل التالي؛ وتحويله إلى جملة زمنية يوضح التركيب في العربية.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: بادره يسوع قائلاً
  rationale: يفيد الفعل أن يسوع سبقه إلى الكلام وأخذ زمام المبادرة قبل أن يتكلم بطرس؛ و«بادره» تؤدي هذا المعنى بإيجاز وطبيعية.
- source_word: Τί σοι δοκεῖ
  choice: ما رأيك
  rationale: تعبير عربي مألوف ينقل سؤال يسوع عن تقدير سمعان وحكمه.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ملوك الأرض
  rationale: يحافظ على الدلالة العامة لكلمة γῆ من غير قصرها على أرض أو إقليم بعينه.
- source_word: τέλη
  choice: الرسوم
  rationale: تشير إلى الرسوم والمكوس غير المباشرة، وتتميز بذلك من ضريبة الرأس المذكورة بعدها.
- source_word: κῆνσον
  choice: ضريبة الرأس
  rationale: تدل الكلمة على ضريبة مفروضة على الأشخاص أو جزية ضريبية؛ وهذه الصياغة تحافظ على تمييزها من الرسوم.
- source_word: υἱῶν αὐτῶν
  choice: أبنائهم
  rationale: يحافظ على اللفظ العائلي المحدد وعلى المقابلة التي يقوم عليها سؤال يسوع.
- source_word: ἀλλοτρίων
  choice: الغرباء
  rationale: تعني هنا من ليسوا من أهل الملك وأبنائه، أي الخارجين عن أسرته؛ و«الغرباء» تحفظ المقابلة من غير تحويلها إلى معنى الرعايا عمومًا.
theological_decisions:
- issue: الدلالة اللاهوتية المحتملة للفظ «الأبناء» في تشبيه يسوع
  choice: الإبقاء على اللفظ العائلي «أبنائهم» من غير شرح دلالته المسيحانية داخل المتن
  alternative: أولادهم؛ رعاياهم
  rationale: المعنى المباشر هو إعفاء أبناء الملوك من الضرائب، وهو يمهّد للدلالة اللاهوتية في العدد التالي. والإبقاء على «الأبناء» يصون توتر السرد ولا يسبق النص إلى تفسيره.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بادره» لنقل سبق يسوع إلى الكلام بصياغة طبيعية، وحُفظت المقابلة العائلية بين «أبنائهم» و«الغرباء».
