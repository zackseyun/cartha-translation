  verdict: approve
  source_fidelity: النص العربي ينقل بدقة جواب بطرس الإيجابي، ودخولَه البيت، ومبادرة يسوع بالكلام، ثم السؤال المتعلق بجباية الملوك للرسوم أو ضريبة الرأس من أبنائهم أو من الغرباء. وتحافظ «أبنائهم» على اللفظ العائلي المحدد في اليونانية، فيما يوضح الهامش المقصود السياقي من «الغرباء» دون حصره في الأجانب.
  naturalness: الصياغة فصيحة حديثة وواضحة. «ولما دخل البيت» و«بادره يسوع قائلاً» و«ما رأيك يا سمعان؟» تراكيب سليمة وطبيعية في العربية المعاصرة، مع نبرة مناسبة للسرد الإنجيلي.
  terminology: «الرسوم» مناسبة لـ τέλη، و«ضريبة الرأس» مناسبة لـ κῆνσον وتحفظ التمييز بين نوعي الجباية. «الغرباء» مقبولة في المتن لأن الهامش يرفع احتمال فهمها بمعنى الأجانب وحدهم. اسم «يسوع» و«سمعان» سليم، ولا يوجد تحميل تفسيري أو مذهبي زائد.
