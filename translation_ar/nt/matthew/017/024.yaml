id: MAT.17.24
reference: Matthew 17:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: ar
  text: 'ولمّا وصلوا إلى كفرناحوم، أتى جُباة ضريبة الدرهمين[a] إلى بطرس وقالوا: «أما يدفع معلّمكم ضريبة الدرهمين؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الدرهمين»، أي مبلغ درهمين يونانيين، وهو ضريبة الهيكل.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: ولمّا وصلوا
  rationale: التركيب المطلق بالمضاف إليه يفيد الظرف الزمني. و«لمّا وصلوا» عربية طبيعية تحافظ على هذا المعنى، مع تمثيل δέ تمثيلًا خفيفًا بالواو الانتقالية.
- source_word: Καφαρναοὺμ
  choice: كفرناحوم
  rationale: نقل للاسم الجغرافي بالصيغة العربية الكتابية الشائعة.
- source_word: προσῆλθον
  choice: أتى ... إلى
  rationale: ينقل معنى الاقتراب أو المجيء نحو بطرس بعبارة عربية واضحة وغير متكلفة.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: جُباة ضريبة الدرهمين
  rationale: العبارة الاسمية الموصولة تعرّف جماعة بوظيفتها في تحصيل المبلغ. و«جُباة» موجزة وطبيعية، وذكر «الضريبة» يوضح الدلالة السياقية.
- source_word: δίδραχμα
  choice: ضريبة الدرهمين
  rationale: اللفظة تدل حرفيًا على مبلغ قدره درهمان يونانيان، والسياق يدل على أنه مبلغ مفروض يُحصَّل. تحافظ الصياغة على مقدار المال وتوضح وظيفته.
- source_word: τῷ Πέτρῳ
  choice: إلى بطرس
  rationale: صياغة عربية مباشرة لحركة الجباة نحو بطرس، مع اعتماد الشكل العربي الشائع للاسم.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: معلّمكم
  rationale: ينقل διδάσκαλος بدقة ووضوح، من غير إيحاءات إضافية قد تحملها ألفاظ مثل «سيّدكم».
- source_word: οὐ τελεῖ
  choice: أما يدفع
  rationale: الفعل يعني هنا أداء التزام مالي. وتحافظ صيغة السؤال المنفي «أما يدفع» على بنية اليونانية وعلى إيحائها باحتمال توقّع جواب بالإيجاب، من غير أن تحسمه.
theological_decisions:
- issue: تحديد δίδραχμα بوصفها ضريبة لا مجرد قطع نقدية
  choice: ضريبة الدرهمين في المتن
  alternative: الدرهمان؛ قطع نقدية من فئة الدرهمين
  rationale: السياق يتناول أداء مبلغ واجب، لا مجرد أخذ نقود. وإضافة «ضريبة» توضح المعنى السياقي، بينما تبقي الحاشية على القيمة النقدية والغرض التاريخي.
- issue: القوة التداولية للسؤال المنفي οὐ τελεῖ
  choice: 'الإبقاء على السؤال المنفي: «أما يدفع...؟»'
  alternative: «أيدفع معلّمكم...؟» أو صياغته بما يفرض جوابًا إيجابيًا
  rationale: السؤال اليوناني قد يتوقع جوابًا بالإيجاب، لكن إبقاء النفي يحفظ صيغة الأصل وما فيها من توتر دون تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «جُباة» لأنها مألوفة ودقيقة، وتجنبت الصياغة التقنية «الديدراخما». وُضع مؤشر الحاشية بعد أول ذكر للمصطلح الذي يحتاج إلى إيضاح ثقافي.
