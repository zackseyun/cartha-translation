  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: ar
  text: 'وفيما كانوا ينزلون من الجبل، أمرهم يسوع قائلًا: «لا تخبروا أحدًا بالرؤيا[a] حتى يُقام ابن الإنسان من بين الأموات[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بما رأيتموه». واللفظ اليوناني هو «الرؤيا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو، على نحو أكثر حرفية: «من الأموات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: وفيما كانوا نازلين من الجبل
  rationale: ينقل تركيب المضاف المطلق ودلالة الحدث المتزامن المستمر بصياغة عربية طبيعية، مع إبقاء الجبل معرّفًا كما في السياق.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: أمرهم يسوع قائلًا
  rationale: «أمرهم» يحفظ قوة التكليف في الفعل، و«قائلًا» يقابل اسم الفاعل اليوناني من غير إطالة.
- source_word: Μηδενὶ εἴπητε
  choice: لا تخبروا أحدًا
  rationale: صيغة نهي عربية واضحة تنقل النفي الشامل مع فعل الإخبار الذي يتعدى إلى مضمون الرؤيا.
- source_word: τὸ ὅραμα
  choice: الرؤيا
  rationale: ترجمة مباشرة تحفظ الإيحاء الكشفي في اللفظ اليوناني، بدل اختزاله في مجرد فعل الرؤية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب كما ورد، بما له من صدى كتابي ولاهوتي، من غير تفسيره داخل النص.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل معنى الخروج من وسط الموتى بدقة، وهو تعبير عربي مفهوم في سياق القيامة.
- source_word: ἐγερθῇ
  choice: يُقام
  rationale: يحفظ صيغة المبني للمجهول في اليونانية ولا يصرّح بفاعل لم يذكره النص.
theological_decisions:
- issue: صياغة القيامة وصوت الفعل
  choice: يُقام ابن الإنسان من بين الأموات
  alternative: يقوم ابن الإنسان من الأموات
  rationale: النص اليوناني يستعمل المبني للمجهول؛ لذلك تحافظ «يُقام» على الصيغة وعلى الإيحاء بالفعل الإلهي من غير تسمية الفاعل أو حسمه تفسيريًا.
- issue: دلالة ὅραμα
  choice: الرؤيا
  alternative: ما رأيتموه
  rationale: «الرؤيا» تحفظ الطابع الكشفي المحتمل للفظ، في حين أن البديل أوضح حسيًا لكنه أكثر تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي انسياب الجملة مع الحفاظ على البنية الزمنية، وقوة الأمر، والمبني للمجهول في حديث القيامة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما، لا وفق موضعيهما المختلطين في طبقة الاستشارة الإنجليزية.
