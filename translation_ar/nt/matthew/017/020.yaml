source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: ar
  text: 'فقال لهم: «لقلة إيمانكم.[a] فالحق أقول لكم: إن كان لكم إيمان كحبة خردل، تقولون لهذا الجبل: انتقل من هنا إلى هناك، فينتقل، ولا يكون شيء مستحيلًا عليكم».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لضعف إيمانكم». تشير الكلمة اليونانية إلى قلة الإيمان أو قصوره، لا بالضرورة إلى انعدامه تمامًا.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إن كان لكم إيمان كحبة خردل». والمقارنة بشيء بالغ الصغر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: المضارع التاريخي اليوناني يضفي حيوية على السرد، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي، من غير تغيير في زمن الحدث.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: لقلة إيمانكم
  rationale: تحفظ معنى ὀλιγοπιστία بوصفه إيمانًا قليلًا أو قاصرًا، لا انعدامًا كاملًا للإيمان.
- source_word: ἀμὴν
  choice: الحق
  rationale: صيغة عربية طبيعية مهيبة تؤدي وظيفة اللفظ في توكيد القول الذي يليها.
- source_word: πίστιν
  choice: إيمان
  rationale: المقصود هنا الثقة بقدرة الله، و«إيمان» يحفظ اللفظ اللاهوتي العام من غير حصره في تفسير مذهبي.
- source_word: ὡς κόκκον σινάπεως
  choice: مثل حبة خردل
  rationale: صياغة عربية طبيعية تحفظ التشبيه بشيء بالغ الصغر.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: انتقل من هنا إلى هناك
  rationale: فعل «انتقل» ملائم لمخاطبة الجبل ويحفظ قوة الأمر ومعنى تغيير الموضع.
- source_word: μεταβήσεται
  choice: فينتقل
  rationale: يحفظ الصيغة اللازمة في اليونانية، أي إن الجبل ينتقل، من غير تحويلها إلى مبني للمجهول.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: ولا يكون شيء مستحيلًا عليكم
  rationale: تعبير عربي واضح يحفظ دلالة استحالة الشيء بالنسبة إليهم.
theological_decisions:
- issue: دلالة πίστις في سياق صنع المعجزات
  choice: إيمان
  alternative: ثقة
  rationale: السياق يتناول قصور ثقة التلاميذ بقدرة الله، لكن لفظ «إيمان» يحفظ سعة المصطلح اليوناني ولا يحوله إلى تقرير مذهبي عن الإيمان الخلاصي.
- issue: طبيعة الوعد «لا يكون شيء مستحيلًا عليكم»
  choice: الإبقاء على العبارة المطلقة كما وردت
  alternative: تقييدها صراحة بما يوافق مشيئة الله
  rationale: النص نفسه لا يذكر هذا القيد في الآية، لذلك لا يُضاف تفسير لاهوتي إلى المتن، مع بقاء الكلام في سياقه عن الإيمان.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل الماضي الطبيعي في السرد العربي بدل محاكاة المضارع التاريخي اليوناني، ومُثّل δέ بالانتقال السردي في الفاء من غير تحميله معنى استدراكيًا قويًا.
