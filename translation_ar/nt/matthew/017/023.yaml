  source_fidelity: 'ينقل النص المسار الأساسي بدقة: القتل في المستقبل، واليوم الثالث، والمبني للمجهول في فعل القيامة، ثم حزن التلاميذ الشديد. غير أن «سيُقام» دون مكمّل في العربية قد يُفهم على نحو غير محدد، مثل الإقامة أو التنصيب، ولا يستدعي معنى البعث بوضوح كافٍ خارج اصطلاحات كنسية معيّنة.'
