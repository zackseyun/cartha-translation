  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: ar
  text: وسيقتلونه، وفي اليوم الثالث سيُبعث. وحزنوا حزنًا شديدًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: سيقتلونه
  rationale: ينقل الفعل المستقبل المبني للمعلوم والضمير المفعولي مباشرة، من غير إضافة معنى «الاغتيال» أو «القتل ظلمًا» غير المصرح به في اللفظ.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: في اليوم الثالث
  rationale: تعبير عربي طبيعي ودقيق عن دالّ الزمن في اليونانية، من غير إضافة «بعد ذلك».
- source_word: ἐγερθήσεται
  choice: سيُقام
  rationale: يحافظ على صيغة المستقبل المبني للمجهول في اليونانية، ويُبقي إيحاء الفعل الإلهي من غير التصريح بفاعل لم يذكره النص.
- source_word: ἐλυπήθησαν σφόδρα
  choice: حزنوا حزنًا شديدًا
  rationale: ينقل الحزن مع شدة التأثر بعبارة عربية واضحة وطبيعية؛ والمفعول المطلق يعبّر بجلاء عن تقوية الظرف σφόδρα.
- source_word: καὶ ... καὶ ... καὶ
  choice: و... و... و
  rationale: يحافظ على نسق العطف البسيط المتكرر في النص اليوناني من غير فرض علاقة سببية أو زمنية أدق مما يقوله النص.
theological_decisions:
- issue: 'صياغة التنبؤ بالقيامة: المبني للمجهول أم المعلوم'
  choice: سيُقام
  alternative: سيقوم
  rationale: الفعل اليوناني مستقبل مبني للمجهول؛ لذلك تحافظ الصياغة المختارة على البنية وعلى إمكان فهم الله فاعلًا ضمنيًا، من غير أن تحسم ما لم يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «سيُقام» بدل الصياغة الأثقل «ستتم إقامته»، وحُفظ تكرار الواو وبساطة الجمل في الأصل.
