id: MAT.17.12
reference: Matthew 17:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: ar
  text: لكنني أقول لكم إن إيليا قد جاء بالفعل، ولم يعرفوه، بل فعلوا به كل ما أرادوا.[a] وكذلك ابن الإنسان مزمع أن يتألم على أيديهم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لم يتعرّفوا إليه» أو «لم يعترفوا به». قد يدل الفعل اليوناني على عدم إدراك هويته أو صفته إدراكًا صحيحًا. ويمكن ترجمة الجملة التالية: «عاملوه كما شاؤوا».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «سوف يتألم». تفيد العبارة اليونانية أن ألم ابن الإنسان آتٍ أو وشيك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: لكنني أقول لكم
  rationale: تحافظ «أقول لكم» على صيغة الخطاب المباشر، وتنقل «لكن» قوة δέ التقابلية مع التوقع السابق.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: إيليا قد جاء بالفعل
  rationale: الاسم وفق الصيغة العربية الكتابية المألوفة، و«قد جاء بالفعل» تنقل مجيئًا تمّ وله صلة بالحاضر، مع إبراز ἤδη.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: لم يعرفوه
  rationale: تفيد ἐπιγινώσκω هنا عدم التعرّف إلى هويته أو إدراك صفته، و«لم يعرفوه» عربية طبيعية تحفظ قدرًا من الاتساع الدلالي.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: فعلوا به كل ما أرادوا
  rationale: صياغة عربية اصطلاحية تنقل الفعل غير المقيّد تجاهه من غير إضافة وصف غير مصرّح به.
- source_word: οὕτως καὶ
  choice: وكذلك
  rationale: تبيّن المماثلة بين ما حدث لإيليا وما سيحدث لابن الإنسان بإيجاز طبيعي.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: المقابل العربي الراسخ للقب، ويحفظ أصداءه النصية واللاهوتية دون تفسير زائد.
- source_word: μέλλει πάσχειν
  choice: مزمع أن يتألم
  rationale: تنقل الصيغة أن الألم آتٍ ووشيك دون أن تضيف معنى الضرورة أو التعيين الحتمي صراحة.
- source_word: ὑπ’ αὐτῶν
  choice: على أيديهم
  rationale: تعبير عربي طبيعي يوضح أنهم فاعلو الأذى الواقع عليه.
theological_decisions:
- issue: هوية إيليا الذي جاء
  choice: الإبقاء على «إيليا» دون إدخال اسم يوحنا المعمدان في الآية
  alternative: تفسير إيليا صراحة بأنه يوحنا المعمدان
  rationale: السياق اللاحق يوضح المقصود، أما هذه الجملة نفسها فتقول «إيليا»؛ لذلك يُترك التعيين للسياق ولا يُدرج التفسير في المتن.
- issue: دلالة μέλλει في ألم ابن الإنسان
  choice: «مزمع أن يتألم» بوصف الألم آتيًا ووشيكًا
  alternative: «مقدّر له أن يتألم» بما يفيد حتمية أقوى
  rationale: العبارة اليونانية تفيد أن الألم منتظر أو وشيك، لكنها لا تصوغ في هذا الموضع وحده ضرورة لاهوتية صريحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «مزمع» لدقتها وشيوعها النسبي في السياق الكتابي، مع شرح بديل أبسط في الحاشية. وُضعت علامات الحواشي بعد العبارتين اللتين تشرحهما.
