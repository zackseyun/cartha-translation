  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: ar
  text: وإذا موسى وإيليا قد ظهرا لهم[a]، وهما يتحدثان معه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شوهدَا منهم». الفعل اليوناني مبني للمجهول من حيث الصيغة، لكن «ظهرا لهم» أيسر في العربية.'
    reason: بديل معجمي يحفظ الصيغة اليونانية الممكنة
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: أداة عربية فصيحة وطبيعية تسترعي الانتباه وتبرز المفاجأة والحيوية اللتين تؤديهما ἰδού في السياق السردي.
- source_word: ὤφθη
  choice: ظهرا
  rationale: المبني للمجهول من ὁράω يُستعمل هنا استعمالًا اصطلاحيًا بمعنى الظهور أو صيرورة الشخص مرئيًا؛ و«ظهرا لهم» أيسر وأطبع في العربية من «شوهدَا منهم».
- source_word: αὐτοῖς
  choice: لهم
  rationale: تنقل الداتيف بوصف التلاميذ شهودًا للظهور، من غير إضافة تفسير إلى النص.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية الكتابية الراسخة للاسم.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية الكتابية الشائعة للاسم في العهد الجديد.
- source_word: συλλαλοῦντες
  choice: وهما يتحدثان
  rationale: تفيد المشاركة في الكلام، والمثنى العربي يوافق موسى وإيليا ويجعل تركيب الحال طبيعيًا وواضحًا.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: تنقل معنى المصاحبة في μετά مع المضاف إليه، وتحافظ على الضمير كما في اليونانية.
theological_decisions:
- issue: مرجع الضمير في αὐτοῦ
  choice: الإبقاء على «معه»، ومرجعه يسوع بحسب السياق
  alternative: 'استبدال الضمير بالاسم الصريح: «مع يسوع»'
  rationale: السياق المباشر يجعل المرجع واضحًا، والإبقاء على الضمير يصون صياغة الأصل من غير توسع تفسيري.
- issue: طبيعة ظهور موسى وإيليا
  choice: «ظهرا لهم» بوصفه ظهورًا منظورًا
  alternative: «شوهدَا منهم» أو «صارا مرئيَّين لهم»
  rationale: يثبت النص حدث ظهورهما للتلاميذ، لكنه لا يشرح كيفية حضورهما؛ لذلك لا تضيف الترجمة تحديدًا عقائديًا غير وارد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «وإذا» بدل صيغة تقليدية أثقل مثل «وهوذا»، مع الحفاظ على عنصر لفت الانتباه والمفاجأة. وضُبط الفعل بالمثنى ليتوافق مع موسى وإيليا.
