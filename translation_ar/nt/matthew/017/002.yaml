id: MAT.17.2
reference: Matthew 17:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: ar
  text: وتغيَّرت هيئته أمامهم[a]، وأشرق وجهه كالشمس، وصارت ثيابه بيضاء كالنور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجلّى أمامهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: تغيَّرت هيئته
  rationale: صيغة ماضٍ مبني للمجهول من μεταμορφόω، وتدل هنا على تحوّل ظاهر في الهيئة. هذه الصياغة عربية واضحة وطبيعية، وتحفظ المبني للمجهول من غير أن تحدد الفاعل ضمنًا.
- source_word: ἔμπροσθεν αὐτῶν
  choice: أمامهم
  rationale: تعبير مكاني مباشر يفيد أن الحدث وقع في حضرتهم وعلى مرأى منهم.
- source_word: ἔλαμψεν
  choice: أشرق
  rationale: ينقل معنى اللمعان وإصدار الضوء، ويلائم الوجه في العربية الفصيحة المعاصرة.
- source_word: πρόσωπον
  choice: وجهه
  rationale: المقصود وجه يسوع المادي في هذا السياق، وهو المقابل العربي المباشر.
- source_word: ὡς ὁ ἥλιος
  choice: كالشمس
  rationale: يحفظ التشبيه بصياغة عربية موجزة وطبيعية.
- source_word: ἱμάτια
  choice: ثيابه
  rationale: لفظ عام للملابس، و«ثياب» فصيح وواضح في العربية الحديثة.
- source_word: ἐγένετο λευκὰ
  choice: صارت ... بيضاء
  rationale: ينقل بوضوح التغيّر إلى حالة البياض، مع المطابقة العربية الطبيعية لجمع غير العاقل.
- source_word: ὡς τὸ φῶς
  choice: كالنور
  rationale: يحفظ صورة المقارنة الواردة في اليونانية بدل اختزالها في وصف مثل «مضيئة».
theological_decisions:
- issue: وصف حدث التجلّي
  choice: تغيَّرت هيئته
  alternative: تجلّى
  rationale: «تغيَّرت هيئته» ينقل الدلالة المعجمية للتحول الظاهر بوضوح ويحفظ المبني للمجهول، بينما «تجلّى» هو التعبير الكنسي المألوف لكنه قد يُفهم بوصفه اسمًا اصطلاحيًا للحدث أو ظهورًا لا تحولًا. أُثبت البديل في الحاشية صونًا لكلا البعدين.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إيقاع متوازن وصور التشبيه الأصلية. استُخدم «كالنور» لا «كالضوء» لأن «النور» طبيعي في هذا السياق الأدبي، من غير إضافة معنى لاهوتي غير مصرّح به.
