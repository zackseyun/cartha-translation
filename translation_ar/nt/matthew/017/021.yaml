  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: ar
  text: أمّا هذا النوع فلا يخرج إلا بالصلاة والصوم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات السريانية والقبطية المبكرة؛ لكنها موجودة في غالبية المخطوطات البيزنطية، وفي التقليد اللاتيني، وفي معظم الشواهد السريانية. ويُرجَّح أن نُسّاخًا متأخرين أضافوها لموافقة مرقس 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: النوع
  rationale: يدل في هذا السياق على فئة أو صنف، والأقرب أنه يشير إلى نوع من الشياطين.
- source_word: ἐκπορεύεται
  choice: يخرج
  rationale: يصف خروج الشيطان من الشخص المصاب، و«يخرج» تعبير عربي طبيعي ودقيق في هذا السياق.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تركيب استثنائي يفيد الحصر هنا، وتقابله «إلا» بوضوح وإيجاز.
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: بالصلاة والصوم
  rationale: يحافظ على الاسمين وعلى وسيلة الخروج التي يصرّح بها النص اليوناني البيزنطي.
