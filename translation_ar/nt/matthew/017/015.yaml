base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: ar
  text: 'قائلًا: «يا رب، ارحم ابني، لأنه يُصاب بنوبات تشنّج[a] ويعاني بشدة؛ فكثيرًا ما يسقط في النار، وكثيرًا ما يسقط في الماء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مصاب بالصرع». وحرفيًا: «مضروب بالقمر»؛ إذ يستعمل التعبير اليوناني اصطلاحًا قديمًا لحالة تشبه نوبات التشنّج.'
    reason: بيان البديل المعجمي والمعنى الحرفي القديم، مع تجنب إيحاء «مصروع» بالمسّ أو فرض تشخيص طبي حديث على النص.
lexical_decisions:
- source_word: καὶ λέγων
  choice: قائلًا
  rationale: يحافظ اسم الفاعل على الصلة النحوية بالسياق السابق، وتُفهم الواو بحسب اتصال الآية بما قبلها دون إثقال العربية.
- source_word: Κύριε
  choice: يا رب
  rationale: نداء مباشر محترم ليسوع، وصيغة «يا رب» طبيعية وراسخة في العربية.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: ارحم ابني
  rationale: 'ينقل طلب الرحمة بوضوح، ويحافظ على دلالة υἱός المحددة: الابن.'
- source_word: σεληνιάζεται
  choice: يُصاب بنوبات تشنّج
  rationale: يصف الأعراض الملحوظة بلغة عربية واضحة، من غير فرض تشخيص طبي حديث ولا إثبات علاقة سببية بالقمر.
- source_word: κακῶς πάσχει
  choice: يعاني معاناة شديدة
  rationale: ينقل شدة الألم أو البلاء التي تفيدها κακῶς مع πάσχει، بصياغة عربية طبيعية.
- source_word: πολλάκις
  choice: كثيرًا ما
  rationale: تعبير عربي طبيعي يدل على التكرار، وقد أُبقي تكراره موافقًا للنص اليوناني.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: يسقط في النار
  rationale: ترجمة مباشرة وواضحة للحركة إلى داخل النار.
- source_word: εἰς τὸ ὕδωρ
  choice: في الماء
  rationale: يحافظ على التوازي مع «في النار» ويؤدي المعنى المقصود في العربية الطبيعية.
theological_decisions:
- issue: دلالة σεληνιάζεται في سياق الشفاء وإخراج الأرواح
  choice: 'ترجمتها بوصف ظاهري: «يُصاب بنوبات تشنّج»'
  alternative: «مصروع» أو، حرفيًا، «مضروب بالقمر»
  rationale: كلام الأب يصف حالة الابن، ولا يقدم في هذه الآية تشخيصًا طبيًا تقنيًا أو تفسيرًا سببيًا قمريًا. وتحافظ الصياغة المختارة على الظاهرة الموصوفة من غير حسم العلاقة بين المرض والمسّ في السياق الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على التكرار البلاغي في «كثيرًا ما»، ووُضعت علامة الحاشية عند العبارة التي تشرحها مباشرة.
