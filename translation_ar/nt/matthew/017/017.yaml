base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: ar
  text: 'فأجاب يسوع وقال: «يا أيها الجيل غير المؤمن والمنحرف، إلى متى أكون معكم؟ وإلى متى أحتملكم؟ أحضروه إليَّ هنا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: فأجاب يسوع وقال
  rationale: يحافظ على صيغة «أجاب وقال» ذات النبرة الكتابية الطبيعية في العربية، مع نقل δέ بالفاء الانتقالية الملائمة للسياق.
- source_word: Ὦ γενεὰ
  choice: يا جيلًا
  rationale: «يا» أداة النداء العربية الطبيعية، و«جيل» يحفظ الدلالة الزمنية والجماعية والصدى النبوي لكلمة γενεά.
- source_word: ἄπιστος
  choice: غير مؤمن
  rationale: ينقل معنى انعدام الإيمان في سياق العجز المرتبط بقلة الإيمان، مع إبقاء معنى «عديم الأمانة» احتمالًا معجميًا دون فرضه على المتن.
- source_word: διεστραμμένη
  choice: منحرفًا
  rationale: يفيد حالة الاعوجاج أو الانحراف الأخلاقي الناتجة من الفعل διαστρέφω، وهو واضح وفصيح في العربية المعاصرة دون إيحاءات حديثة ضيقة قد تحملها ألفاظ أخرى.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: إلى متى أكون معكم؟
  rationale: ترجمة مباشرة وطبيعية للاستفهام الإنكاري ولصيغة المستقبل اليونانية، والمضارع العربي بعد «إلى متى» يؤدي المعنى الاستقبالي في هذا السياق.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: وإلى متى أحتملكم؟
  rationale: «أحتملكم» ينقل معنى الصبر على أشخاص أو تحملهم، ويحفظ حدة التوبيخ من غير تعبير عامي.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: أحضروه إليَّ هنا
  rationale: صيغة أمر جمع طبيعية تنقل معنى الإتيان بالصبي إلى يسوع، مع تمثيل كل من μοι وὧδε.
theological_decisions:
- issue: دلالة ἄπιστος في توبيخ يسوع
  choice: غير مؤمن
  alternative: عديم الأمانة
  rationale: السياق المباشر يركز على الإيمان الناقص المرتبط بفشل التلاميذ، ولذلك تُقدَّم دلالة عدم الإيمان في المتن مع عدم إنكار احتمال معنى عدم الأمانة.
- issue: المخاطَب في «معكم» و«أحتملكم»
  choice: الإبقاء على ضمير الجمع بلا تحديد
  alternative: تعيينه بالتلاميذ أو الجموع أو الجميع
  rationale: النص اليوناني لا يحدد صراحة نطاق المخاطَبين، فتعيينهم في الترجمة يحسم غموضًا مقصودًا أو حقيقيًا لا يحسمه العدد نفسه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة وتوبيخية. استُخدمت صيغة «أجاب... وقال» للحفاظ على البنية السامية الظاهرة في اليونانية، وتُرك نطاق المخاطَبين غير محدد كما في الأصل.
