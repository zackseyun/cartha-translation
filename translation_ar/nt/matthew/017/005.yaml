  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: ar
  text: 'وبينما كان لا يزال يتكلم، إذا سحابة مضيئة ظللتهم، وإذا صوت من السحابة قال: «هذا هو ابني الحبيب الذي سُررت به. اسمعوا له[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أصغوا إليه». قد يدل فعل السماع اليوناني هنا على الإصغاء مع الأخذ بالكلام والعمل به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: وبينما كان لا يزال يتكلم
  rationale: ينقل تركيب المضاف إليه المطلق الدال على تزامن الحدثين، ويحفظ معنى ἔτι الذي يبرز وقوع المقاطعة في أثناء كلامه.
- source_word: ἰδοὺ
  choice: إذا
  rationale: تؤدي «إذا» الفجائية وظيفة أداة التنبيه السردية في العربية الفصحى بوضوح وطبيعية، وقد تكررت كما تكررت الأداة اليونانية.
- source_word: νεφέλη φωτεινὴ
  choice: سحابة مضيئة
  rationale: ترجمة مباشرة تحفظ الصورة اللافتة من غير إضافة تفسير رمزي.
- source_word: ἐπεσκίασεν
  choice: ظللتهم
  rationale: يحفظ الفعل صورة إلقاء الظل أو الإحاطة، مع إمكان صدى لغة التجلي الإلهي من غير التصريح به في المتن.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: صوت من السحابة يقول
  rationale: صياغة عربية طبيعية تحافظ على اسم الفاعل اليوناني وعلى صدور الصوت من السحابة.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: ابني الحبيب
  rationale: تعبير عربي موجز وطبيعي يحفظ البنوة والمحبة من دون إدخال مصطلحات عقدية غير واردة في النص.
- source_word: ἐν ᾧ εὐδόκησα
  choice: الذي به سررت
  rationale: يحفظ حرف الجر والمعنى العلاقي للفعل، وينقل صيغة الماضي اليونانية من دون تحويلها إلى زمن حاضر أو توسيعها تفسيريًا.
- source_word: ἀκούετε αὐτοῦ
  choice: له اسمعوا
  rationale: يحفظ فعل السماع وصيغة الأمر، ويتيح في العربية معنى الإصغاء والامتثال معًا؛ وتقديم الجار والمجرور يبرز المرجع المقصود.
theological_decisions:
- issue: صياغة إعلان الآب عن هوية يسوع
  choice: هذا هو ابني الحبيب الذي به سررت
  alternative: هذا هو ابني، الحبيب، الذي رضيت عنه
  rationale: تحفظ الصياغة التعريف المباشر بالابن ولغة المحبة والسرور، من غير استيراد مصطلحات لاهوتية لاحقة أو حسم دلالات تتجاوز النص.
- issue: قوة الأمر ἀκούετε αὐτοῦ
  choice: له اسمعوا
  alternative: أصغوا إليه
  rationale: «اسمعوا» أقرب إلى اللفظ اليوناني وتحتمل السماع بمعنى الإصغاء والعمل، بينما قد توضح «أصغوا» جانب الانتباه لكنها تضيق المجال الدلالي قليلًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «إذا» الفجائية مرتين لحفظ أداة التنبيه اليونانية المتكررة، وحُفظ الإيجاز والتوتر في الإعلان الإلهي.
