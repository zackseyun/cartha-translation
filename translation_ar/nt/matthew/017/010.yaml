id: MAT.17.10
reference: Matthew 17:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ar
  text: 'وسأله التلاميذ قائلين: «فلماذا إذًا يقول الكتبة إن إيليا يجب أن يأتي أولًا؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: سأله
  rationale: فعل ماضٍ يقدّم سؤالًا مباشرًا؛ و«سأل» هو المقابل العربي الطبيعي من غير تكلّف أو مبالغة في الرسمية.
- source_word: μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف اليونانية تشير إلى جماعة معلومة من السياق، ولا حاجة إلى إضافة «تلاميذه» لأن ضمير الملكية غير وارد في النص.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على صيغة اسم الفاعل التي تمهّد لمضمون السؤال، وهو تعبير عربي فصيح ومألوف في السرد الكتابي.
- source_word: Τί οὖν
  choice: فلماذا إذًا
  rationale: تؤدي «لماذا» معنى طلب العلة في هذا التركيب، وتنقل «إذًا» قوة οὖν الرابطة بالسياق السابق.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي المباشر والمستقر للفئة الدينية المعروفة في سياق الأناجيل، بخلاف الصياغة التفسيرية «معلمو الشريعة».
- source_word: λέγουσιν ὅτι
  choice: يقول الكتبة إن
  rationale: ينقل المضارع ومضمون القول بتركيب عربي مباشر وطبيعي.
- source_word: Ἠλίαν
  choice: إيليا
  rationale: الصيغة العربية الكتابية الشائعة للاسم العَلَم.
- source_word: δεῖ ἐλθεῖν
  choice: يجب أن يأتي
  rationale: تحفظ دلالة الضرورة في δεῖ بصياغة عربية واضحة وموجزة.
- source_word: πρῶτον
  choice: أولًا
  rationale: تنقل الدلالة الترتيبية، أي مجيئه قبل غيره ضمن التسلسل المقصود.
theological_decisions:
- issue: الدلالة التفسيرية لسؤال التلاميذ عن مجيء إيليا
  choice: إبقاء السؤال مفتوحًا من غير بيان ما إذا كان التلاميذ يقرّون تعليم الكتبة أو يعترضون عليه أو يطلبون تصحيحه.
  alternative: صياغة توحي بالتشكيك في قول الكتبة، أو إضافة شرح يستحضر نبوة ملاخي أو جواب يسوع في الآيتين التاليتين.
  rationale: النص نفسه يورد السؤال ولا يحسم في هذه الآية وحدها طبيعة موقف التلاميذ أو كيفية تحقق القول؛ لذلك ينبغي حفظ التوتر اللاهوتي إلى أن يأتي الجواب في السياق اللاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ البناء السردي «قائلين» لقربه من الأصل مع بقاء العبارة طبيعية، واستُخدمت علامات اقتباس عربية لتمييز الكلام المباشر.
