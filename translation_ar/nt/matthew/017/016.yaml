  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: ar
  text: وأحضرته إلى تلاميذك، ولم يقدروا على شفائه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: أحضرته إلى
  rationale: الفعل هنا يعني إحضار شخص إلى آخر؛ وهذه الصياغة العربية طبيعية وتحافظ على المفعول به والجهة المقصودة.
- source_word: μαθηταῖς σου
  choice: تلاميذك
  rationale: «التلاميذ» هو المقابل العربي المألوف والدقيق لأتباع المعلّم وطلابه في سياق الأناجيل.
- source_word: οὐκ ἠδυνήθησαν
  choice: لم يقدروا
  rationale: ينقل معنى عدم القدرة بوضوح، من غير أن يضيف سببًا لهذا العجز.
- source_word: θεραπεῦσαι
  choice: أن يشفوه
  rationale: الفعل في هذا السياق يدل على شفاء الصبي، و«يشفوه» هو التعبير العربي الطبيعي الملائم لسياق المعجزات.
- source_word: καὶ ... καὶ
  choice: و... فـ
  rationale: بدأت الجملة بالواو لمواصلة السرد، واستُعملت الفاء قبل النتيجة السلبية لتكون العبارة عربية سلسة، من غير إضافة تفسير سببي.
- source_word: αὐτόν
  choice: ـه
  rationale: يعود الضمير على الابن المذكور في السياق، وحُفظ بضمير المذكر المفرد في الموضعين.
theological_decisions:
- issue: طبيعة إخفاق التلاميذ
  choice: ذكر عدم قدرتهم على شفاء الصبي فقط
  alternative: التصريح بأنهم عجزوا عن إخراج الشيطان أو أن عجزهم كان بسبب ضعف الإيمان
  rationale: الآية نفسها تقرر أنهم لم يقدروا أن يشفوه، ولا تحدد هنا سبب العجز؛ لذلك لا تُستورد تفسيرات من السياق المحيط إلى نص هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختير تركيب موجز وطبيعي، مع الحفاظ على تسلسل الخبر وعدم إضافة تفسير لسبب عجز التلاميذ.
