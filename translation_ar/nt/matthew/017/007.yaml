  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: ar
  text: 'فاقترب يسوع ولمسهم وقال: «قوموا ولا تخافوا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: تقدَّم
  rationale: يفيد الفعل الاقتراب إلى أشخاص، و«تقدَّم» تعبير عربي طبيعي يحفظ حركة يسوع نحو التلاميذ.
- source_word: ἁψάμενος αὐτῶν
  choice: ولمسهم
  rationale: المعنى المباشر هو اللمس، وصيغة العطف العربية تنقل تسلسل الحدث بسلاسة من غير إضافة أن اللمس كان باليد.
- source_word: εἶπεν
  choice: وقال
  rationale: ترجمة مباشرة ومحايدة للفعل الدال على القول.
- source_word: Ἐγέρθητε
  choice: قوموا
  rationale: الأمر هنا يدعو التلاميذ إلى النهوض من وضع سقوطهم على وجوههم؛ و«قوموا» واضحة وطبيعية ولا تحدد هيئة نهائية أكثر مما يقتضيه السياق.
- source_word: μὴ φοβεῖσθε
  choice: لا تخافوا
  rationale: تنقل النهي بصياغة عربية مألوفة، من غير إلزام معنى «كفّوا عن الخوف» الذي قد تفيده الصيغة أحيانًا لكن السياق لا يفرضه.
- source_word: καὶ
  choice: فـ / و
  rationale: استُخدمت الفاء لربط الاقتراب بما سبقه سرديًا، والواو لربط الأفعال والأمرين في تسلسل عربي طبيعي، من غير إضافة تفسير لاهوتي.
theological_decisions:
- issue: نقل أمر يسوع المطمئن دون إضافة دلالة رعوية أو عقائدية
  choice: قوموا ولا تخافوا
  alternative: انهضوا ولا تجزعوا
  rationale: تحفظ الصياغة الفعل الجسدي المطلوب والنهي عن الخوف بوضوح، من غير تشديد غير لازم على استمرار الخوف أو إضافة تفسير لسبب الطمأنة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حُفظ إيجاز الأصل وتسلسل أفعاله، ولم تُضف حواشٍ لأن البدائل المعجمية لا تمثل غموضًا جوهريًا يحتاجه القارئ لفهم الآية.
