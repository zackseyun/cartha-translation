base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: ar
  text: وبعد ستة أيام، أخذ يسوع بطرس ويعقوب ويوحنا أخاه، وصعد بهم إلى جبل عالٍ على انفراد.[a]
  philosophy: optimal-equivalence
  footnotes:
