lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: بعد ستة أيام
  rationale: ينقل التعبير الزمني اليوناني مباشرة وبأسلوب عربي طبيعي، ويحافظ على صلته بما سبقه في السرد.
- source_word: παραλαμβάνει
  choice: أخذ
  rationale: الفعل يعني أن يأخذ أشخاصًا معه. اختير الماضي لأن العربية السردية الحديثة تنقل به الحاضر التاريخي اليوناني على نحو طبيعي.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: بطرس ويعقوب ويوحنا
  rationale: الأسماء العربية الكتابية الشائعة المقابلة للأسماء اليونانية.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: يحافظ على الضمير كما في اليونانية، مع تعلقه الطبيعي في السياق بيوحنا بوصفه أخا يعقوب، من غير إضافة تفسير صريح إلى المتن.
- source_word: ἀναφέρει
  choice: صعد بهم
  rationale: يفيد الفعل هنا الإيصال إلى أعلى. و«صعد بهم» عربي موجز وطبيعي يعبّر عن الحركة صعودًا إلى الجبل.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: إلى جبل عالٍ
  rationale: صياغة عربية طبيعية تفيد جهة الحركة وغايتها.
- source_word: κατ’ ἰδίαν
  choice: منفردين
  rationale: تفيد أنهم كانوا على انفراد بعيدًا عن الآخرين، مع بقاء احتمال التركيز على الخصوصية أو الانفراد.
theological_decisions:
- issue: الحاضر التاريخي في السرد الإنجيلي
  choice: 'نقله بصيغة الماضي العربية: «أخذ... وصعد»'
  alternative: 'إبقاء الحاضر: «يأخذ... ويصعد»'
  rationale: مع أن اليونانية تستعمل الحاضر التاريخي لإضفاء الحيوية، فإن الماضي هو الأسلوب الطبيعي المتسق للسرد في العربية الفصحى الحديثة، من غير تغيير في زمن الحدث أو معناه.
- issue: مرجع الضمير في «τὸν ἀδελφὸν αὐτοῦ»
  choice: «يوحنا أخاه» مع إبقاء الضمير
  alternative: «يوحنا أخا يعقوب»
  rationale: السياق يرجح أن يوحنا هو أخو يعقوب، لكن إبقاء الضمير يصون صورة الأصل ولا يضيف اسمًا غير مذكور في العبارة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل الماضي للسرد الطبيعي، وحُفظ ترتيب الأسماء وبنية العبارة قدر الإمكان من دون تكلف.
