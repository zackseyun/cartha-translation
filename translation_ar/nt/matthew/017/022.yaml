id: MAT.17.22
reference: Matthew 17:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: ar
  text: 'وبينما كانوا مجتمعين في الجليل[a]، قال لهم يسوع: «ابن الإنسان على وشك أن يُسلَّم إلى أيدي الناس[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتجمعون معًا في الجليل».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى أيدي بشر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: كانوا مجتمعين
  rationale: يحفظ المعنى الجماعي لاسم الفاعل من دون أن يحدد حركةً بعينها، ويلائم تركيب الحال المطلق في اليونانية.
- source_word: δὲ
  choice: وبينما
  rationale: يربط الظرف المصاحب بقول يسوع ربطًا طبيعيًا في العربية، مع التعبير عن تركيب الحال المطلق.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: في الجليل
  rationale: ترجمة مكانية مباشرة وواضحة.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: مقابل عربي مباشر وطبيعي للفعل مع المفعول غير المباشر.
- source_word: Μέλλει
  choice: على وشك أن
  rationale: ينقل معنى الحدث الوشيك من غير أن يضيف دلالة الحتم أو القدر.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصيغة العربية الراسخة التي تحفظ بنية اللقب وصداه الكتابي واللاهوتي.
- source_word: παραδίδοσθαι
  choice: يُسلَّم
  rationale: يحفظ صيغة المبني للمجهول واتساع المعنى بين التسليم والخيانة والنقل إلى سلطة آخرين، من غير حصره في فاعل أو إجراء محدد.
- source_word: εἰς χεῖρας
  choice: إلى أيدي
  rationale: يحفظ الصورة المجازية اليونانية، وهي مفهومة وطبيعية في العربية.
- source_word: ἀνθρώπων
  choice: الناس
  rationale: يدل الجمع هنا على البشر الذين سيقع ابن الإنسان في أيديهم؛ و«الناس» تعبير عربي جامع وطبيعي ويحافظ على المقابلة مع لقب «ابن الإنسان».
theological_decisions:
- issue: ترجمة ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: تحفظ الترجمة المختارة العبارة اليونانية بوصفها لقبًا ذا صدى كتابي، ولا تختزلها في وصف تفسيري عام.
- issue: دلالة παραδίδοσθαι في التنبؤ بالآلام
  choice: يُسلَّم
  alternative: يُدفع إلى أيدي
  rationale: «يُسلَّم» تبقي الفعل مبنيًا للمجهول وتحفظ تعدد طبقاته المحتملة، فلا تقصره على خيانة يهوذا ولا على إجراء قضائي محض.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «على وشك أن» لإظهار قرب الحدث، و«يُسلَّم» لصون المبني للمجهول والغموض المقصود في هوية الجهة المسلِّمة.
