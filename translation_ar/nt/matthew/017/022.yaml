  source_fidelity: النص العربي ينقل تركيب الحال المطلق في Συστρεφομένων δέ بوضوح («وبينما كانوا مجتمعين»)، ويحافظ على الظرف المكاني، والخبر الموجّه إلى التلاميذ، ودلالة μέλλει القريبة («على وشك أن»). كما يصون المبني للمجهول في παραδίδοσθαι ولا يحدد الجهة التي تقوم بالتسليم، ويحفظ الصورة الاصطلاحية «إلى أيدي».
