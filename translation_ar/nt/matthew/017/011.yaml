translation:
  language: ar
  text: 'فأجاب: «إيليا آتٍ حقًّا، وسيُعيد كلَّ شيء إلى حاله.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يأتي حقًّا وسيُعيد كلَّ شيء إلى حاله». الفعل اليوناني بصيغة المضارع، لكنه يحمل هنا معنى متجهًا إلى المستقبل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: هذا تركيب يوناني شائع متأثر بالأسلوب السامي، ومعناه الطبيعي في العربية «فأجاب»، من غير تكرار «أجاب وقال».
- source_word: Ἠλίας
  choice: إيليا
  rationale: نقل الاسم بصيغته العربية الكتابية الشائعة.
- source_word: μέν
  choice: حقًّا
  rationale: تفيد التوكيد وتمهّد للمقابلة الآتية في العدد التالي، وتحافظ «حقًّا» على هذه القوة من دون تركيب عربي متكلّف.
- source_word: ἔρχεται
  choice: آتٍ
  rationale: الفعل مضارع في الصيغة لكنه متجه إلى المستقبل في السياق؛ و«آتٍ» تحافظ على حيوية المضارع وعلى معنى التوقع.
- source_word: ἀποκαταστήσει
  choice: سيُعيد ... إلى حاله
  rationale: ينقل معنى الإرجاع أو الرد إلى الحالة السليمة بصياغة عربية طبيعية، مع الحفاظ على دلالة المستقبل من غير تحديد ماهية الاستعادة.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: تحافظ العبارة على الشمول الواسع للمحايد الجمع من غير تعيين أشياء أو أشخاص لم يسمّهم النص.
theological_decisions:
- issue: طبيعة عمل إيليا في الاستعادة ونطاقه
  choice: سيُعيد كلَّ شيء إلى حاله
  alternative: سيُصلح كلَّ شيء / سيردّ كلَّ شيء
  rationale: يصف النص الاستعادة وصفًا شاملًا ولا يحدد نطاقها في هذا العدد؛ لذلك تُترك العبارة عامة، من غير حصرها في تجديد روحي أو إصلاح اجتماعي أو إتمام أخروي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «آتٍ» لإبقاء حيوية المضارع اليوناني ذي الدلالة المستقبلية، وصيغت الاستعادة بعبارة طبيعية لا تضيق نطاق النص.
