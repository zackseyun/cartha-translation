id: MAT.26.26
reference: Matthew 26:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: ar
  text: 'وبينما كانوا يأكلون[a]، أخذ يسوع خبزًا، وبعد أن بارك[b] كسره وأعطاه للتلاميذ، وقال: «خذوا، كلوا[c]؛ هذا هو جسدي[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإذ كانوا يأكلون».'
    reason: lexical_alternative
  - marker: b
    text: أي نطق بالبركة؛ ويفهم بعضهم الفعل بمعنى تقديم الشكر على الخبز.
    reason: lexical_alternative
  - marker: c
    text: 'أو بصياغة عربية أكثر سلاسة: «خذوا وكلوا».'
    reason: lexical_alternative
  - marker: d
    text: 'النص اليوناني حرفيًا: «هذا هو جسدي». ويفسره بعضهم بمعنى «هذا يعني جسدي» أو «هذا يرمز إلى جسدي»، لكن الترجمة تحفظ صياغة المصدر من غير حسم هذا الخلاف.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: وبينما كانوا يأكلون
  rationale: تركيب المضاف المطلق يهيئ الإطار الزمني ويدل على فعل مستمر. و«بينما» صياغة عربية طبيعية، أما δέ فأداة وصل خفيفة لا تقتضي هنا معنى الاستدراك.
- source_word: λαβὼν
  choice: أخذ
  rationale: اسم الفاعل الأوريستي يسبق الأفعال التالية في التسلسل، وتحويله إلى فعل ماضٍ يحافظ على ترتيب الحدث بلغة عربية سليمة.
- source_word: ἄρτον
  choice: خبزًا
  rationale: اللفظة تعني الخبز، وقد تدل في سياق الطعام على رغيف، لكن «خبزًا» أدق في عدم تخصيص ما لم يخصصه النص.
- source_word: εὐλογήσας
  choice: بعد أن بارك
  rationale: تحافظ العبارة على معنى النطق بالبركة وعلى ترتيب الفعل، من غير أن تستبدله صراحةً بفعل «شكر». كما أن عدم ذكر مفعول صريح يوافق عدم وجوده صراحةً في اليونانية.
- source_word: ἔκλασεν
  choice: كسره
  rationale: الفعل يعني «كسر»، والضمير العربي يعود بوضوح إلى الخبز.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: وأعطاه للتلاميذ
  rationale: صيغ اسم الفاعل فعلًا معطوفًا لتتابع السرد طبيعيًا، وحُفظ التعريف في «التلاميذ» من غير إضافة «تلاميذه» غير الصريحة في المصدر.
- source_word: Λάβετε φάγετε
  choice: خذوا، كلوا
  rationale: أمران أوريستيان متتابعان بلا حرف عطف؛ والفاصلة تحفظ هذا التتابع المباشر والنبرة الآمرة.
- source_word: τοῦτό ἐστιν
  choice: هذا هو
  rationale: ينقل فعل الكينونة نقلًا مباشرًا، من غير تحويله تفسيريًا إلى «يعني» أو «يرمز إلى».
- source_word: τὸ σῶμά μου
  choice: جسدي
  rationale: «جسد» المقابل العربي المباشر لـσῶμα، وضمير المتكلم ينقل الإضافة كما هي.
theological_decisions:
- issue: 'صياغة قول يسوع المتعلق بالعشاء: τοῦτό ἐστιν τὸ σῶμά μου'
  choice: هذا هو جسدي
  alternative: هذا يعني جسدي؛ هذا يرمز إلى جسدي
  rationale: يستخدم النص اليوناني فعل الكينونة البسيط ἐστιν. لذلك تُحفظ الصياغة والتوتر اللاهوتي من غير إدخال تفسير مذهبي لطبيعة العلاقة بين الخبز والجسد.
- issue: دلالة εὐλογήσας في سياق الخبز
  choice: بعد أن بارك
  alternative: بعد أن شكر؛ بعد أن بارك الخبز
  rationale: يحفظ هذا الاختيار لفظ البركة ولا يحسم هل المقصود توجيه البركة إلى الله أو النطق بها على الخبز، وهي مسألة لا يصرح بها تركيب المصدر هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. روعي تسلسل الأفعال، وتجنب اللفظ المذهبي التفسيري، واستُخدمت الفاصلة بين الأمرين للمحافظة على غياب حرف العطف في اليونانية.
