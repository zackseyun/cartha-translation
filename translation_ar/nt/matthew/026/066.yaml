    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: فما رأيكم؟
  rationale: تؤدي العبارة اليونانية معنى طلب الرأي أو الحكم. وصيغة «فما رأيكم؟» طبيعية وواضحة، والفاء تلائم اتصال السؤال بالسياق السابق.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: فأجابوا
  rationale: التركيب الحرفي «فأجابوا قائلين» زائد في العربية المعاصرة؛ والفعل «أجابوا» وحده ينقل التعبير السردي اليوناني بوضوح، مع فهم القول من الكلام المنقول بعده.
- source_word: Ἔνοχος
  choice: مستوجب
  rationale: في هذا السياق القضائي تدل الكلمة على الاستحقاق أو الخضوع للعقوبة. و«مستوجب» تحفظ القوة القانونية دون أن تقرر أن الحكم صحيح أمام الله.
- source_word: θανάτου
  choice: الموت
  rationale: المضاف إليه اليوناني يبين ما صار الشخص مستوجبًا له؛ و«مستوجب الموت» تعبير عربي موجز ذو دلالة قضائية، مع إمكان فهمه بمعنى استحقاق عقوبة الموت.
- source_word: ἐστίν
  choice: إنه
  rationale: تنقل «إنه» الإسناد الصريح وتناسب صيغة إعلان الحكم في العربية، مع عودة الضمير إلى يسوع في السياق.
theological_decisions:
- issue: القوة القضائية لحكم المجلس
  choice: إنه مستوجب الموت
  alternative: إنه مذنب يستحق الموت / إنه عرضة للموت
  rationale: تحفظ الصياغة طبيعة القول بوصفه حكم المجلس على يسوع، من غير أن تجعل الحكم تقريرًا إلهيًا عن ذنبه الفعلي أو أن تستورد تفسيرًا لاحقًا لموته.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «مستوجب الموت» للموازنة بين الطبيعة القانونية للتعبير وسلاسة الأسلوب، وأُثبتت علامة الحاشية [a] في المتن.
