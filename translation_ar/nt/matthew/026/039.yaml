base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: ar
  text: 'ثم تقدَّم قليلًا، وخرَّ على وجهه[a] يصلّي قائلًا: «يا أبي، إن كان ممكنًا، فلتَعْبُر عنّي هذه الكأس[b]. ولكن ليس كما أريد أنا، بل كما تريد أنت».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: وقع منكبًّا على وجهه.'
    reason: lexical_alternative
  - marker: b
    text: '«الكأس» صورة كتابية للنصيب المعيَّن للإنسان، ولا سيما الألم؛ قارن متى 20: 22 و26: 42.'
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: تقدَّم قليلًا
  rationale: ينقل حركة يسوع إلى الأمام مسافة قصيرة بصياغة عربية طبيعية، مع إبقاء دلالة الظرف μικρόν من غير إطالة.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: خرَّ على وجهه
  rationale: تعبير عربي فصيح واضح يصوّر السجود والانكباب على الوجه ويحفظ قوة الفعل والمشهد.
- source_word: προσευχόμενος καὶ λέγων
  choice: يصلّي قائلًا
  rationale: يحفظ تزامن الصلاة والقول كما تدل صيغتا اسم الفاعل في اليونانية، ويتجنب العطف الثقيل في العربية.
- source_word: Πάτερ μου
  choice: يا أبي
  rationale: صيغة نداء عربية طبيعية تنقل معنى النداء مع ضمير المتكلم، وتحفظ القرب والوقار بلا إضافة عاطفية غير مصرّح بها.
- source_word: εἰ δυνατόν ἐστιν
  choice: إن كان ممكنًا
  rationale: ترجمة مباشرة وطبيعية للشرط، ولا تضيف مرجعًا غير مذكور صراحة في النص اليوناني.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: فلتَعْبُر عنّي
  rationale: تنقل صيغة الطلب في فعل الأمر الغائب وتحافظ على صورة عبور الكأس وابتعادها عنه.
- source_word: τὸ ποτήριον τοῦτο
  choice: هذه الكأس
  rationale: تحافظ على الاستعارة الكتابية بدل تفسيرها داخل المتن بأنها الألم أو المصير.
- source_word: πλὴν
  choice: ولكن
  rationale: أداة استدراك عربية واضحة تنقل التحول القوي من الطلب إلى التسليم.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: ليس كما أريد أنا، بل كما تريد أنت
  rationale: يحفظ المقابلة والتوكيد الظاهرين من استعمال الضميرين ἐγώ وσύ، ويُظهر الفعل المحذوف في الشطر الثاني بما تقتضيه العربية.
theological_decisions:
- issue: استعارة «الكأس» في صلاة يسوع
  choice: إبقاء «هذه الكأس» في المتن
  alternative: هذا الألم؛ هذا المصير
  rationale: النص يستخدم ποτήριον في صورة مجازية ذات أصداء كتابية عن النصيب المعيَّن، ولا سيما المعاناة؛ تفسيرها في المتن يضيّق دلالتها.
- issue: إرادة يسوع في مقابل إرادة الآب
  choice: ليس كما أريد أنا، بل كما تريد أنت
  alternative: ليس ما أريده أنا، بل ما تريده أنت
  rationale: تحفظ الصياغة المقارنة ὡς والتوتر الصادق بين طلب يسوع وتسليمه من غير تسوية لعمق العبارة أو إدخال مصطلحات مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «خرَّ» لقوة المشهد مع شرحه في الحاشية، وأُبقيت صورة «الكأس» كما في الأصل. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
