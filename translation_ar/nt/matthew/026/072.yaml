  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: ar
  text: 'وأنكر أيضًا بقَسَم: «أنا لا أعرف الرجل».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف بسيط يحفظ تتابع السرد من غير إضافة دلالة زمنية ليست صريحة في اليونانية.
- source_word: πάλιν
  choice: أيضًا
  rationale: يدل على تكرار إنكار بطرس، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: ἠρνήσατο
  choice: أنكر
  rationale: ينقل معنى النفي والإنكار من غير إضافة مفعول غير مصرّح به؛ وتأتي بعده جملة تبيّن مضمون الإنكار.
- source_word: μετὰ ὅρκου
  choice: بقَسَمٍ
  rationale: يفيد أن الإنكار اقترن بقَسَم، من غير الإيحاء بإجراء قضائي رسمي كما قد يفعل تعبير «تحت القَسَم».
- source_word: ὅτι
  choice: 'قائلًا:'
  rationale: يقدّم مضمون الإنكار في اقتباس مباشر بصياغة عربية واضحة، مع إبراز أن ما بعده هو قول بطرس.
- source_word: Οὐκ οἶδα
  choice: أنا لا أعرف
  rationale: ترجمة مباشرة للنفي مع الفعل الدال على المعرفة، وإثبات الضمير يوافق نبرة التصريح المؤكد.
- source_word: τὸν ἄνθρωπον
  choice: ذلك الرجل
  rationale: يحفظ الإشارة إلى شخص ذكر بعينه والتعبير المباعد في كلام بطرس؛ و«الرجل» أدق هنا من اللفظ العام «الإنسان».
theological_decisions:
- issue: مرجع عبارة «ذلك الرجل» في إنكار بطرس
  choice: الإبقاء على «ذلك الرجل» بدل استبدالها بـ«يسوع» أو «إياه».
  alternative: «يسوع» أو «إياه»
  rationale: النص اليوناني يقول حرفيًا «الرجل»، وفي ذلك أثر بلاغي يوحي بتباعد بطرس عمّن ينكره. والتصريح باسم يسوع يفسّر المرجع داخل المتن ويخفف قوة هذا الأسلوب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «بقَسَمٍ» لا «تحت القَسَم» لتجنب إيحاء المحاكمة الرسمية، وحُفظت عبارة «ذلك الرجل» لما فيها من تباعد مقصود في السياق.
