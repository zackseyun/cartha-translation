  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: ar
  text: والذين أمسكوا بيسوع اقتادوه إلى قيافا رئيس الكهنة، حيث كان الكتبة والشيوخ قد اجتمعوا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كانوا قد جُمِعوا». يمكن فهم صيغة الفعل اليوناني هنا بمعنى أنهم اجتمعوا، أو بصيغة المبني للمجهول بمعنى أنهم جُمِعوا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: والذين
  rationale: تنقل الواوُ الربطَ السردي الخفيف الذي تؤديه δέ من غير أن تضيف تعارضًا قويًا، ويُنقل التركيب الاسمي القائم على اسم الفاعل بمعنى «الذين».
- source_word: κρατήσαντες
  choice: أمسكوا يسوع
  rationale: يحفظ معنى الإمساك والسيطرة في κρατέω، ويتجنب جعل العبارة مصطلحًا قانونيًا صريحًا مثل «ألقوا القبض عليه»؛ كما يدل السياق العربي على أن هذا الفعل سبق الاقتياد.
- source_word: ἀπήγαγον
  choice: اقتادوه
  rationale: «اقتادوه» تعبير عربي طبيعي عن قيادة شخص تحت الحراسة إلى مكان آخر، وينقل معنى ἀπάγω بإيجاز.
- source_word: πρὸς Καϊάφαν
  choice: إلى قيافا
  rationale: تنقل «إلى» اتجاه الحركة نحو قيافا من غير إضافة أنه أُحضر إلى بيته أو مَثَل أمامه، إذ لا يصرح النص اليوناني بذلك.
- source_word: τὸν ἀρχιερέα
  choice: رئيس الكهنة
  rationale: هو اللقب العربي الكتابي الواضح والمستقر لمنصب ἀρχιερεύς في هذا السياق.
- source_word: ὅπου
  choice: حيث
  rationale: تنقل الظرف المكاني الموصول مباشرة وبأسلوب عربي فصيح طبيعي.
- source_word: οἱ γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي التقليدي الدقيق لهذه الفئة الدينية والقانونية، من غير تحويل الترجمة إلى شرح وظيفي.
- source_word: οἱ πρεσβύτεροι
  choice: الشيوخ
  rationale: ينقل اللقب المعترف به لقادة الشعب في هذا السياق، وهو أوضح من تعبيرات تفسيرية مثل «كبار القادة».
- source_word: συνήχθησαν
  choice: كانوا قد اجتمعوا
  rationale: يبين أن اجتماعهم كان قد وقع قبل وصول يسوع، وينقل الفعل في معناه اللازم الطبيعي، مع إبقاء احتمال القراءة المبنية للمجهول في الحاشية.
