reference: Matthew 26:35
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: ar
  text: 'قال له بطرس: «حتى لو كان لا بدّ أن أموت معك، فلن أنكرك أبدًا[a]». وقال جميع التلاميذ أيضًا مثل ذلك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن أنكرك قطعًا». يستعمل النص اليوناني صيغة نفي شديدة التوكيد (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: الفعل مضارع تاريخي في اليونانية، لكن الماضي «قال» أنسب للسرد العربي الطبيعي ويحفظ وظيفته الخطابية.
- source_word: Κἂν δέῃ με
  choice: حتى لو كان لا بدّ أن
  rationale: تفيد العبارة شرطًا تنازليًا مقرونًا بالضرورة؛ والصياغة العربية تنقل معنى «حتى إن وجب عليّ» بوضوح وطبيعية.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: أموت معك
  rationale: تنقل المصاحبة ومعنى الموت مباشرة من غير إثقال العبارة.
- source_word: οὐ μή σε ἀπαρνήσομαι
  choice: فلن أنكرك أبدًا
  rationale: تركيب «لن... أبدًا» ينقل النفي المستقبلي المؤكد في οὐ μή، و«أنكرك» هو المقابل الواضح الملائم لسياق إنكار بطرس ليسوع.
- source_word: ὁμοίως
  choice: مثل ذلك
  rationale: تبيّن أن بقية التلاميذ قالوا مضمون القول نفسه، بصياغة عربية طبيعية.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: وقال جميع التلاميذ أيضًا
  rationale: تحفظ شمول «جميع» ومعنى الفعل، كما تنقل «أيضًا» اشتراك سائر التلاميذ في القول.
theological_decisions:
- issue: قوة نفي بطرس
  choice: فلن أنكرك أبدًا
  alternative: لن أنكرك قطعًا
  rationale: يحمل الأصل اليوناني نفيًا قويًا للمستقبل. تحافظ الصياغة المختارة على ثقة بطرس الجازمة من غير إضافة تفسير لاهوتي أو تخفيف التوتر مع ما سيقع لاحقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية موقرة. استُعمل الماضي بدل المضارع التاريخي اليوناني وفق الأسلوب العربي الطبيعي، مع إبقاء توكيد نفي بطرس ظاهرًا.
