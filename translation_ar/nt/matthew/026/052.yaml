source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: ar
  text: 'حينئذ قال له يسوع: «أَعِدْ سيفك إلى مكانه، لأن كل الذين يأخذون السيف[a] بالسيف يهلكون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يلجؤون إلى السيف»؛ ويُرجَّح أن التعبير يعني اللجوء إلى القوة العنيفة، لا مجرد إمساك سلاح.
    reason: بديل معجمي يوضح القوة الاصطلاحية المحتملة لعبارة λαβόντες μάχαιραν.
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: تفيد تتابع الحدث في السياق السردي بعبارة عربية واضحة وفصيحة.
- source_word: λέγει αὐτῷ
  choice: قال له
  rationale: صيغ الفعل اليوناني بالمضارع التاريخي، لكن الماضي أنسب للسرد العربي الطبيعي من غير تغيير للمعنى.
- source_word: Ἀπόστρεψον
  choice: أَعِدْ
  rationale: أمر بالرجوع الفوري عن الفعل؛ وفي السياق يدل على إعادة السيف إلى موضعه.
- source_word: τὴν μάχαιράν σου
  choice: سيفك
  rationale: قد تدل μάχαιρα على نصل أو خنجر أو سيف قصير، لكن «سيف» هو المقابل العربي الواضح والمألوف في هذا المشهد ويحفظ تكرار اللفظ في القول التالي.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: إلى مكانه
  rationale: يحفظ معنى رد السيف إلى الموضع الذي يخصه من غير إضافة «غمده»، وهي غير مذكورة صراحة في اليونانية.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: لأن كل الذين يأخذون السيف
  rationale: يحفظ التعميم الذي تفيده صيغة اسم الفاعل المعرّف، ويبقي قدرًا من اتساع دلالة «الأخذ»؛ وتوضح الحاشية أن التعبير قد يعني اللجوء إلى العنف.
- source_word: ἐν μαχαίρῃ
  choice: بالسيف
  rationale: ينقل دلالة الوسيلة ويحافظ على التوازي الموجز في القول.
- source_word: ἀπολοῦνται
  choice: يهلكون
  rationale: ينقل معنى الموت أو المصير إلى الهلاك مع الحفاظ على قوة العبارة، من غير تضييقها إلى كيفية موت محددة.
theological_decisions:
- issue: مدى قول يسوع عن السيف
  choice: 'صيغ القول مبدأً عامًا: «كل الذين يأخذون السيف... يهلكون».'
  alternative: فهمه حظرًا مطلقًا لكل استعمال للقوة، أو حصره في موقف التلميذ الآني وحده.
  rationale: البناء اليوناني تعميمي، ولذلك تُحفظ سعته من غير إدخال موقف مذهبي في الترجمة أو قصره على هذا الحدث فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ التوازي بين «السيف» و«بالسيف»، وتُجنبت إضافة «الغمد» لأنها تفسير سياقي غير مصرح به في النص اليوناني.
