id: MAT.26.63
reference: Matthew 26:63
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: ar
  text: 'أمّا يسوع فظلّ صامتًا. فقال له رئيس الكهنة: «أستحلفك[a] بالله الحي أن تقول لنا: هل أنت المسيح، ابن الله؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أُلزمك بالقسم بالله الحي. واليونانية تستعمل صيغة استحلاف رسمية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: ظلّ صامتًا
  rationale: صيغة الماضي الناقص تدل على استمرار الصمت، و«ظلّ صامتًا» تنقل هذا الجانب بوضوح وطبيعية.
- source_word: ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للمنصب الكهنوتي الأعلى في هذا السياق القضائي.
- source_word: Ἐξορκίζω
  choice: أستحلفك
  rationale: الفعل هنا صيغة استحلاف رسمية، لا علاقة له بطرد الأرواح؛ و«أستحلفك» يحفظ الإيجاز والقوة القضائية.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: بالله الحي
  rationale: تعبير القسم العربي الطبيعي الذي يحفظ استدعاء الله أساسًا للاستحلاف.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: أن تقول لنا
  rationale: ينقل مضمون الطلب الذي يفرضه الاستحلاف ويحافظ على الصلة النحوية به.
- source_word: ὁ χριστὸς
  choice: المسيح
  rationale: «المسيح» هو اللقب العربي الراسخ للملك الممسوح المنتظر، ويحفظ وظيفته كلقب لا كاسم شخصي.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: يحفظ اللقب المسيحاني كما ورد بلا إضعاف أو توسع تفسيري.
- source_word: ὁ δὲ Ἰησοῦς
  choice: أمّا يسوع
  rationale: «أمّا» تبرز المقابلة بين كلام المحيطين وصمت يسوع بأسلوب عربي طبيعي.
theological_decisions:
- issue: دلالة ὁ χριστός في سؤال رئيس الكهنة
  choice: المسيح
  alternative: الممسوح
  rationale: اللفظ هنا لقب مسيحاني. «المسيح» هو المقابل العربي المفهوم والراسخ، بينما «الممسوح» ترجمة تفسيرية أقل طبيعية وقد توهم مجرد فعل المسح.
- issue: قوة صيغة Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: استحلاف رسمي بالله الحي
  alternative: أطلب منك أو آمرك فقط
  rationale: الصيغة اليونانية تستدعي الله في إلزام رسمي، لذلك لا يصح تخفيفها إلى مجرد طلب أو أمر.
- issue: العلاقة بين لقبي «المسيح» و«ابن الله»
  choice: إبقاؤهما متجاورين كما في السؤال دون تحديد تفسيري للعلاقة بينهما
  alternative: إضافة رابط تفسيري يجعلهما لقبًا واحدًا أو ادعاءين منفصلين صراحة
  rationale: النص يجمع اللقبين مع بقاء العلاقة التركيبية والدلالية بينهما قابلة للنقاش؛ لذا تُحفظ الصياغة الموجزة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ظلّ صامتًا» لإظهار الاستمرار، و«أستحلفك» لحفظ النبرة القضائية المهيبة. لم تُنقل حاشية «المسيح/Christ» الإنجليزية لأن العربية تستخدم «المسيح» لقبًا راسخًا يجمع الدلالة المقصودة ولا يوجد فيها هنا بديل نقل صوتي مماثل يحتاج إلى توضيح.
