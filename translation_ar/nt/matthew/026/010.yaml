  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: ar
  text: 'فَلَمَّا عَلِمَ يَسُوعُ بِذَلِكَ، قَالَ لَهُمْ: «لِمَاذَا تُزْعِجُونَ الْمَرْأَةَ؟ فَقَدْ عَمِلَتْ لِي عَمَلًا جَمِيلًا[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فَقَدْ عَمِلَتْ نَحْوِي عَمَلًا حَسَنًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: فَعَلِمَ بِذَلِكَ
  rationale: اسم فاعل ماضٍ ذو وظيفة ظرفية يسبق الفعل الرئيس؛ وإضافة «بذلك» تُظهر المفعول المفهوم من السياق، أي انتقادهم، من غير إسهاب.
- source_word: δὲ
  choice: فَـ
  rationale: تفيد انتقالًا مع شيء من المقابلة بين تذمّر التلاميذ وردّ يسوع، والفاء طبيعية في تسلسل السرد العربي.
- source_word: Τί κόπους παρέχετε
  choice: لِمَاذَا تُزْعِجُونَ
  rationale: التعبير اليوناني يعني التسبب للمرأة في العناء أو الضيق؛ و«تزعجون» عربية واضحة وطبيعية وتحفظ قوة التوبيخ.
- source_word: τῇ γυναικί
  choice: الْمَرْأَةَ
  rationale: جاءت في اليونانية مفعولًا غير مباشر مع تعبير التسبب بالعناء، لكن الفعل العربي «تزعجون» يتعدى إليها مباشرة.
- source_word: ἔργον καλὸν
  choice: عَمَلًا جَمِيلًا
  rationale: يحفظ وصف καλός دلالة الحسن والجدارة معًا، ولا يقصره على الصلاح الأخلاقي وحده.
- source_word: ἠργάσατο
  choice: عَمِلَتْ
  rationale: صيغة الماضي تلائم الفعل اليوناني المكتمل، وتأتي طبيعيًا مع الاسم «عملًا».
- source_word: εἰς ἐμέ
  choice: لِي
  rationale: تنقل العلاقة المقصودة بالفعل الموجَّه إلى يسوع أو المصنوع لأجله، وهي الصياغة العربية الطبيعية هنا.
theological_decisions:
- issue: تقويم فعل المرأة
  choice: عَمَلًا جَمِيلًا
  alternative: عَمَلًا صَالِحًا
  rationale: تحفظ العبارة المدح ذا البعد الجمالي والأخلاقي في καλός من غير تحميل الفعل مفهومًا مذهبيًا عن الاستحقاق.
- issue: دلالة εἰς ἐμέ
  choice: لِي
  alternative: نَحْوِي
  rationale: «لي» أفصح وأطبع في هذا السياق، مع بقاء احتمال الاتجاه أو التعلّق الذي تفيده اليونانية مبيّنًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «تزعجون» بدل ترجمة حرفية ثقيلة لعبارة التسبب بالعناء، وحُفظت دلالة καλός الواسعة في «جميلًا». تظهر علامة الحاشية [a] في المتن بعد الآية.
