  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: ar
  text: 'فقال: «اذهبوا إلى المدينة، إلى فلان[a]، وقولوا له: يقول المعلّم: «وقتي قريب[b]. أُقيم عندك[c] الفصح[d] مع تلاميذي».»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي شخص معيّن لم يُذكر اسمه؛ ويجوز: «إلى شخص بعينه».'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «موعدي قريب». لا يحدد النص هنا المقصود بهذا الوقت تحديدًا.'
    reason: theological_ambiguity
  - marker: c
    text: 'حرفيًا: «إليك»؛ ويفيد في هذا السياق الإقامة أو الاحتفال لدى المخاطَب، من غير أن يذكر النص بيتًا صراحة.'
    reason: lexical_alternative
  - marker: d
    text: التعبير اليوناني حرفيًا «أصنع الفصح»، أي أمارسه أو أحتفل به.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: اذهبوا
  rationale: فعل أمر للحركة، و«اذهبوا» هو المقابل العربي الطبيعي المباشر من غير إضافة معنى الانصراف أو التشديد.
- source_word: πρὸς τὸν δεῖνα
  choice: إلى فلان
  rationale: «فلان» تعبير عربي فصيح وطبيعي يدل على شخص معيّن تُرك اسمه من دون تصريح، وهو يحفظ قصد اللفظ اليوناني δεῖνα.
- source_word: Ὁ διδάσκαλος
  choice: المعلّم
  rationale: ينقل διδάσκαλος بوصفه لقبًا دالًا على التعليم، من غير خلطه بلقب «الرب» أو إضافة معنى السيادة.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: وقتي قريب
  rationale: يحفظ اتساع معنى καιρός وإيحاءه بوقت ذي شأن، من غير أن يحدده صراحة بأنه ساعة الموت أو موعد العشاء أو تمام الرسالة.
- source_word: πρὸς σὲ
  choice: عندك
  rationale: تعبير عربي موجز يحفظ الإشارة إلى الشخص والمكان أو الضيافة من غير أن يضيف لفظ «البيت» غير الموجود صراحة في اليونانية.
- source_word: ποιῶ τὸ πάσχα
  choice: أُقيم الفصح
  rationale: ترجمة اصطلاحية طبيعية لعبارة «أصنع/أفعل الفصح»، وتفيد ممارسة الفصح أو الاحتفال به مع إبقاء زمن المضارع اليوناني.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: مع تلاميذي
  rationale: «تلاميذي» هو المقابل الإنجيلي المألوف لـ μαθηταί ويحفظ علاقة التتلمذ بيسوع.
theological_decisions:
- issue: مدلول قول يسوع Ὁ καιρός μου ἐγγύς ἐστιν
  choice: وقتي قريب
  alternative: موعدي قريب؛ ساعتي قريبة
  rationale: لا تحدد الآية وحدها هل المقصود موته تحديدًا، أم عشاء الفصح، أم اقتراب ذروة رسالته؛ لذلك تُرك التعبير واسعًا كما في الأصل.
- issue: القوة الزمنية للمضارع ποιῶ
  choice: أُقيم الفصح
  alternative: سأُقيم الفصح
  rationale: حُفظ المضارع اليوناني، الذي قد يؤدي في السياق معنى الترتيب القريب أو النية المقررة، من غير تحويله صراحة إلى مستقبل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة إنجيلية كريمة. استُعمل «فلان» لأنه فصيح وشائع في الإشارة إلى شخص معيّن غير مسمّى، واستُعمل «عندك» بدل «في بيتك» لتجنب إضافة ما لا يصرح به الأصل. ينبغي في التنضيد النهائي توحيد علامة الاقتباس الختامية العربية.
