source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: ar
  text: 'حينئذٍ شقَّ رئيس الكهنة ثيابه[a] وقال: «لقد جدَّف! فأيُّ حاجةٍ لنا بعدُ إلى شهود؟ ها قد سمعتم الآن التجديف.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان شقُّ الثياب علامةً علنية على الصدمة أو الحزن أو الاستنكار.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: أداة زمنية تربط الحدث بما سبقه في سياق السرد، وهذه صياغة عربية واضحة وفصيحة.
- source_word: ὁ ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للمنصب اليهودي المفرد.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: شقَّ ... ثيابه
  rationale: ينقل فعل التمزيق بوضوح، وتبقى «ثيابه» عامة كما في اليونانية من غير تخصيصها بالثياب الكهنوتية.
- source_word: Ἐβλασφήμησεν
  choice: لقد جدَّف
  rationale: يحفظ المصطلح الديني والقانوني وقوة الاتهام الآني الذي أطلقه رئيس الكهنة.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: فأيُّ حاجةٍ لنا بعدُ إلى شهود؟
  rationale: صياغة قريبة من بنية الأصل، وتحفظ معنى ἔτι الدال على الاستمرار أو الزيادة.
- source_word: ἴδε νῦν ἠκούσατε
  choice: ها إنكم قد سمعتم الآن
  rationale: «ها» تلفت الانتباه على نحو طبيعي، و«قد سمعتم الآن» تنقل فورية السماع وقيمته الاستدلالية.
- source_word: τὴν βλασφημίαν
  choice: التجديف
  rationale: يحفظ الاسم المعرّف والمصطلح المقابل للفعل السابق، بوصفه اتهام رئيس الكهنة.
theological_decisions:
- issue: هل يقرر السارد وقوع التجديف أم ينقل اتهام رئيس الكهنة؟
  choice: إبقاء «لقد جدَّف» و«التجديف» داخل كلام رئيس الكهنة المباشر.
  alternative: «قال كلامًا فيه تجديف» أو «ما عدَّه تجديفًا».
  rationale: الأصل ينقل اتهام رئيس الكهنة بصيغة مباشرة؛ ولا ينبغي تخفيف المصطلح أو إضافة تفسير يجعل السارد مؤيدًا للاتهام أو رافضًا له صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظت الصيغة الاستفهامية الرسمية والمصطلحات الدينية من غير إدخال تفسير طائفي. صُحّح اضطراب موضعي الحاشيتين في طبقة المشاورة الإنجليزية؛ فالملاحظة الثقافية تخص شق الثياب، أما صيغة السؤال البديلة فليست لازمة في العربية.
