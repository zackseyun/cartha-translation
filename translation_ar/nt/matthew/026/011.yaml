  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ar
  text: فإنَّ الفقراء معكم دائمًا، أمّا أنا فلستُ معكم دائمًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: دائمًا
  rationale: ينقل معنى الاستمرار والتوافر المتواصل، ويحافظ على تكرار اللفظ في شطري الآية.
- source_word: γὰρ
  choice: فلأنَّ
  rationale: تربط العبارة بما قبلها بوصفها تعليلًا، وصياغة «فلأنَّ» واضحة وطبيعية في العربية المعاصرة.
- source_word: τοὺς πτωχοὺς
  choice: الفقراء
  rationale: جمع معرف يدل على الفقراء بوصفهم جماعة، وهو التعبير العربي الطبيعي المباشر دون حاجة إلى توسيع العبارة.
- source_word: ἔχετε ... μεθ’ ἑαυτῶν
  choice: معكم
  rationale: الفعل هنا يفيد وجود الأشخاص وحضورهم لا امتلاكهم؛ لذلك تؤدي «معكم» المعنى طبيعيًا في العربية، ويُفهم فعل الوجود من التركيب.
- source_word: ἐμὲ
  choice: أنا
  rationale: الضمير المنفصل بعد «أمّا» يبرز المقابلة المقصودة مع الفقراء، مع بقاء الإشارة إلى يسوع واضحة.
- source_word: δὲ
  choice: أمّا
  rationale: تُظهر المقابلة بين دوام وجود الفقراء معهم وعدم دوام وجود يسوع معهم، وهي أنسب عربيًا مع بناء الجملة المتوازي.
- source_word: οὐ πάντοτε ἔχετε
  choice: فلستُ معكم دائمًا
  rationale: صياغة عربية طبيعية تحفظ النفي الزمني والتقابل مع «معكم دائمًا» في الشطر الأول، من غير أن توحي بالامتلاك.
theological_decisions:
- issue: دلالة حضور يسوع
  choice: الحفاظ على المقابلة الزمنية بين استمرار وجود الفقراء مع التلاميذ وعدم استمرار وجود يسوع معهم على هذا النحو.
  alternative: فهم القول على أنه تقليل من شأن العناية بالفقراء.
  rationale: النص اليوناني يقيم مقابلة زمنية ولا يصرّح بانتقاص قيمة الرحمة بالفقراء؛ لذا تُترك دلالة اللحظة الفريدة وقرب موت يسوع قائمة بلا إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم تركيب «أمّا أنا» لإبراز المقابلة، وتُركت العبارة بلا حاشية لأن «الفقراء» تنقل τοὺς πτωχούς طبيعيًا ولا يوجد بديل عربي ذو فرق دلالي يستلزم التنبيه.
