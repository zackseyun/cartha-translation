base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: ar
  text: فكيف إذن تتمّ الكتب المقدسة[a] التي تنصّ على أنه لا بد أن يحدث الأمر هكذا؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فكيف إذن يمكن أن تتمّ الكتب المقدسة، التي تنصّ على أنه لا بد أن يحدث الأمر هكذا؟»'
    reason: بديل يعكس بصورة أوضح إمكان فهم صيغة الاستفهام مع الفعل في اليونانية على نحو احتمالي، مع إبقاء ὅτι مُدخِلًا لمضمون الكتب.
lexical_decisions:
- source_word: πῶς οὖν
  choice: فكيف إذن
  rationale: صياغة استفهامية طبيعية تحفظ قوة السؤال البلاغي، وتُبقي الصلة الاستنتاجية بما سبق.
- source_word: πληρωθῶσιν
  choice: تتمّ
  rationale: الفعل المبني للمجهول في اليونانية يُستعمل اصطلاحيًا لبلوغ ما تقوله الكتب تمامه؛ وفي العربية يؤدي «تتمّ الكتب» هذا المعنى بوضوح ومن غير توسع تفسيري.
- source_word: αἱ γραφαὶ
  choice: الكتب المقدسة
  rationale: يشير الجمع هنا إلى كتابات إسرائيل المقدسة، لا إلى كتابات عامة.
- source_word: ὅτι
  choice: التي تقول إنه
  rationale: يُفهم ὅτι هنا على أنه يُدخل مضمون ما تقوله الكتب؛ وهذه الصياغة العربية توضّح العلاقة النحوية المقصودة من غير إضافة مضمون لاهوتي.
- source_word: οὕτως
  choice: هكذا
  rationale: يحفظ الإشارة إلى الكيفية التي تجري بها أحداث القبض والمعاناة، وهو موجز وطبيعي في العربية.
- source_word: δεῖ γενέσθαι
  choice: لا بد أن يحدث
  rationale: ينقل معنى الضرورة ووقوع الحدث، من غير تحديد صريح لمصدر الضرورة بما يتجاوز النص.
theological_decisions:
- issue: طبيعة الضرورة التي يدل عليها δεῖ
  choice: لا بد أن يحدث
  alternative: لا بد أن يحدث بحسب مشيئة الله
  rationale: يربط السياق الضرورة بإتمام الكتب المقدسة، لكن اليونانية لا تضيف هنا عبارة صريحة مثل «بحسب مشيئة الله»؛ لذلك تُحفظ الدلالة والتوتر اللاهوتي من غير تفسير زائد.
- issue: علاقة ὅτι بما قبلها
  choice: التي تقول إنه لا بد أن يحدث هكذا
  alternative: فكيف إذن تتمّ الكتب المقدسة؟ لأنه لا بد أن يحدث هكذا
  rationale: القراءة المختارة تجعل ὅτι مُدخِلًا لمضمون الكتب، وهي الأنسب سياقيًا، مع إثبات البديل الممكن في الحاشية حفاظًا على قدر من الغموض التركيبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الكتب المقدسة» بوصفها العبارة العربية الطبيعية للإشارة إلى الأسفار، و«لا بد» لنقل قوة الضرورة من غير شرح عقائدي مضاف.
