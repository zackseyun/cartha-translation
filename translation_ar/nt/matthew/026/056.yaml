- source_word: οἱ μαθηταὶ πάντες
  choice: التلاميذ كلهم
  rationale: يحفظ موضع πάντες بعد الاسم وما فيه من توكيد لشمول جميع التلاميذ، من غير إضافة ضمير ملكية غير مصرح به.
- source_word: ἀφέντες αὐτὸν
