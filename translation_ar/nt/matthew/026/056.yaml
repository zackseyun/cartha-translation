  rationale: ينقل المعنى المباشر للفعل في صيغة الحال السابقة للفعل الرئيس، مع إبقاء احتمال الدلالة الأقوى «تخلوا عنه» في الحاشية.
- source_word: ἔφυγον
  choice: هربوا
  rationale: المقابل العربي المباشر والدقيق للفعل، ويحافظ على قوة المشهد السردية.
