review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص مسار الآية ومعظم عناصرها بأمانة: «قد حدث» مناسب لـγέγονεν، و«حينئذ» و«هربوا» دقيقان، كما أن شمول جميع التلاميذ محفوظ. لكن «لكي تتمّ كتب الأنبياء» غير سليم اصطلاحياً في العربية؛ فالكتب لا «تتمّ» بهذا المعنى، بينما المقصود تحقق/إتمام ما تنص عليه الأسفار المقدسة. كما أن الحاشية تصف ἀφέντες خطأً بأنه «اسم الفاعل»، وهو في اليونانية اسم فاعل بصيغة الماضي البسيط (aorist participle).'
  naturalness: الصياغة السردية موجزة وفصيحة عموماً، لكن «تتمّ كتب الأنبياء» ثقيلة وغير طبيعية في الاستعمال العربي الحديث. «تتحقق كتب الأنبياء» أكثر سلاسة في سياق لغة الإتمام، مع بقاء الإشارة إلى النصوص النبوية. ونُقل موضع علامة الحاشية ليقع مباشرة بعد العبارة التي تخصها.
  terminology: «كتب الأنبياء» تحافظ على الجمع وعلى الإضافة الواردة في αἱ γραφαὶ τῶν προφητῶν، في سياق يشير إلى الكتابات المقدسة. و«تتحقق» تنقل لغة الإتمام دون تحويل العبارة إلى تفسير من قبيل «ما كتبه الأنبياء». تحافظ الحاشية على بديل «تخلّوا عنه»، مع تصحيح الوصف النحوي وإيضاح دلالة الهجر في السياق.
  issues:
