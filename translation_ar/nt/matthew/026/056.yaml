    issue: «لكي تتمّ كتب الأنبياء»
    rationale: الفعل «تمّ» لا يسند طبيعياً إلى «الكتب» هنا في العربية؛ والمعنى المقصود هو تحقق ما تشهد به الكتابات النبوية. استبداله بـ«لكي تتحقق كتب الأنبياء» يحفظ البنية والمراد.
  - severity: medium
    issue: وصف ἀφέντες بأنه «اسم الفاعل» في الحاشية
    rationale: ἀφέντες هو اسم فاعل يوناني بصيغة الماضي البسيط، لا «اسم فاعل» بالمعنى العربي المجرد. يلزم وصفه بدقة لتفادي معلومة لغوية خاطئة.
  - severity: low
