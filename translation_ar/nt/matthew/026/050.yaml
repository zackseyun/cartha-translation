  rationale: 'التعديل محدود: يستبدل التعبير الذي قد يحمل إيحاءً قانونيًا بتعبير يطابق تسلسل الأفعال اليونانية، ويصوغ البديل الاستفهامي بما يحفظ دلالة الغرض في الأصل. أما نداء «يا صاحب» والقراءة الرئيسة للعبارة الموجزة فبقيَا كما هما.'
