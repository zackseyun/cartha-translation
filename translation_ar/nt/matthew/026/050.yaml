base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: ar
  text: 'فقال له يسوع: «يا صاحب، افعل ما جئت من أجله».[a] ثم تقدّموا، فوضعوا أيديهم على يسوع وأمسكوا به.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا صاحب، لأي غرض جئت؟» فالعبارة اليونانية مقتضبة، ويمكن فهمها سؤالًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: يا صاحب
  rationale: نداء ليهوذا يتسم بضبط النفس من غير أن يدل بالضرورة على صداقة حميمة؛ و«يا صاحب» عربية واضحة تحفظ هذه المسافة في النبرة.
- source_word: ἐφ’ ὃ πάρει
  choice: افعل ما جئت من أجله
  rationale: العبارة اليونانية مقتضبة، ويمكن فهمها تعبيرًا ذا قوة إيعازية أو سؤالًا. اختير في المتن المعنى السياقي الذي يواجه يهوذا بغرض مجيئه، مع إثبات الاحتمال الاستفهامي في الحاشية.
- source_word: προσελθόντες
  choice: تقدموا
  rationale: ينقل حركة جماعة القبض نحو يسوع بإيجاز طبيعي، ويمهد لتتابع الفعل السردي.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: أمسكوا بيسوع
  rationale: ينقل التعبير الاصطلاحي الدال على وضع الأيدي عليه بقصد السيطرة والقبض، من غير ترجمة حرفية ثقيلة أو إيحاء ديني غير مقصود.
- source_word: ἐκράτησαν αὐτόν
  choice: قبضوا عليه
  rationale: يدل هنا على إحكام السيطرة عليه وأخذه، ويحافظ على التمييز عن فعل الإمساك السابق مع ملاءمة سياق الاعتقال.
- source_word: δὲ
  choice: فـ
  rationale: الفاء تستأنف رد يسوع ضمن تتابع الحدث وتؤدي الانتقال الذي تشير إليه δέ بصورة طبيعية في العربية، من غير تضخيم معنى المقابلة.
theological_decisions:
- issue: تفسير خطاب يسوع لِيهوذا وجوابه له
  choice: «يا صاحب، افعل ما جئت من أجله»
  alternative: «يا صاحب، لماذا جئت؟» أو «يا صاحب، ألهذا جئت؟»
  rationale: تحفظ الصياغة نبرة يسوع المتحفظة والتوتر الكامن في مواجهته ليهوذا، من غير جعل «صاحب» دالًا على مودة حميمة أو تحميله إدانة صريحة. ولأن التركيب اليوناني موجز وملتبس حقًا، أُثبت الفهم الاستفهامي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «يا صاحب» بدل «يا صديق» لتجنب المبالغة في الحميمية، وصيغت أفعال القبض بلغة سردية طبيعية مع الحفاظ على تعاقب الإمساك ثم إحكام السيطرة.
