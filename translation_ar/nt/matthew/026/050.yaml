review_pass:
  verdict: revise
  source_fidelity: 'صيغة «يا صاحب، افعل ما جئت من أجله» تمثّل بأمانة القراءة التفسيرية المعتمدة للتركيب اليوناني الموجز ἐφ’ ὃ πάρει، مع إبقاء القراءة الاستفهامية في الحاشية. وفي مشهد القبض، الأفضل إظهار الفعلين المتعاقبين: وضع الأيدي ثم الإمساك به، بدل «قبضوا عليه» التي قد توحي بإجراء قانوني أكثر من فعل κρατέω الجسدي.'
  naturalness: النص واضح وفصيح وحديث. وتعبير «فوضعوا أيديهم على يسوع وأمسكوا به» طبيعي في السرد العربي، ويبيّن التدرج المقصود من غير تكرار غير لازم.
  terminology: «يا صاحب» اختيار مناسب لـἙταῖρε؛ فهو لا يفرض حميمية «صديق» ولا يحمل إدانة زائدة. وتحسين الحاشية إلى «لأي غرض جئت؟» أقرب إلى دلالة ἐφ’ ὃ («لأي شيء/غرض») من «لماذا جئت؟».
  issues:
  - severity: low
    issue: «قبضوا عليه» بعد «أمسكوا بيسوع»
    rationale: يمكن أن تُفهم «قبضوا عليه» في العربية بوصفها توقيفًا أو إجراءً رسميًا، بينما κρατέω يدل أولًا على الإمساك والسيطرة الجسدية. كما أن إعادة «أمسكوا» لا تُظهر بوضوح أن اليونانية تصف أولًا وضع الأيدي ثم إحكام الإمساك.
  - severity: low
    issue: 'صياغة القراءة البديلة في الحاشية: «لماذا جئت؟»'
    rationale: هي ممكنة، لكن «لأي غرض جئت؟» تحفظ بصورة أدق جهة الغرض التي يعبّر عنها ἐφ’ ὃ، من غير إلغاء إيجاز الأصل أو طابعه الاستفهامي المحتمل.
