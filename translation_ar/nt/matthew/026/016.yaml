lexical_decisions:
- source_word: ἀπὸ τότε
  choice: ومنذ ذلك الحين
  rationale: ينقل ابتداء الفعل من تلك النقطة واستمراره بعدها، بصياغة عربية طبيعية.
- source_word: ἐζήτει
  choice: كان يترقّب
  rationale: الماضي الناقص يدل على فعل مستمر أو متكرر؛ و«كان يترقّب» يلائم انتظار فرصة مواتية ويحافظ على هذا الامتداد.
- source_word: εὐκαιρίαν
  choice: فرصةً
  rationale: تعبير عربي واضح عن مناسبة ملائمة أو وقت مواتٍ، ويُفهم معنى الملاءمة من السياق.
- source_word: ἵνα
  choice: لِـ
  rationale: لام التعليل في «ليسلّمه» تعبّر بإيجاز وطبيعية عن الغرض الذي تفيده ἵνα.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود في السياق إلى يسوع.
- source_word: παραδῷ
  choice: يسلّمه
  rationale: يحافظ على المعنى الأساسي للفعل، أي تسليم شخص إلى آخرين، من غير تضييقه في المتن إلى معنى «يخونه» وحده.
theological_decisions:
- issue: دلالة παραδῷ في سياق يهوذا
  choice: يسلّمه
  alternative: يخونه
  rationale: مع أن الفعل الذي قام به يهوذا خيانة، فإن اللفظ اليوناني أوسع ويدل أساسًا على التسليم. لذلك أُبقي المعنى الأوسع في المتن، وذُكر البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كان يترقّب» لإظهار الاستمرار مع مناسبة السياق، وأُبقي «يسلّمه» في المتن حفاظًا على اتساع اللفظ اليوناني.
