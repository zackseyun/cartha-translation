  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: ar
  text: فتقدَّمت إليه امرأة تحمل قارورةً من المرمر فيها طيب باهظ الثمن[a]، وسكبت الطيب على رأسه بينما كان متكئًا إلى المائدة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي طيب عطري ثمين؛ ويمكن أن تشير الكلمة اليونانية إلى زيت معطّر أو مرهم، لا إلى العطر السائل بالمفهوم الحديث فقط.
    reason: lexical_alternative
  - marker: b
    text: أي متكئًا في الهيئة التي كانت مألوفة لتناول الطعام.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν
  choice: فتقدَّمت إليه
  rationale: ينقل معنى الحركة نحو شخص بعبارة عربية طبيعية، مع فاء تربط الحدث بسياقه السردي.
- source_word: γυνή
  choice: امرأة
  rationale: الاسم نكرة مفردة، ولا يورد النص هنا وصفًا يعرّف المرأة.
- source_word: ἔχουσα
  choice: تحمل
  rationale: حال تصف المرأة، و«تحمل» أنسب للمشهد المادي من الترجمة الحرفية «لها».
- source_word: ἀλάβαστρον μύρου
  choice: قارورة من المرمر فيها طيب
  rationale: ἀλάβαστρον وعاء يُصنع من المرمر أو يُسمّى باسمه، وμύρον مادة عطرية قد تكون زيتًا أو مرهمًا؛ و«طيب» يحفظ هذا الاتساع الدلالي.
- source_word: βαρυτίμου
  choice: باهظ الثمن
  rationale: يعبر عن علو القيمة وشدة الكلفة تعبيرًا عربيًا واضحًا وطبيعيًا.
- source_word: κατέχεεν
  choice: سكبته
  rationale: ينقل فعل الصب، ويعود الضمير على الطيب المذكور في العبارة السابقة.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: على رأسه
  rationale: ترجمة مباشرة وواضحة لدلالة الموضع والملامسة.
- source_word: ἀνακειμένου
  choice: بينما كان متكئًا إلى المائدة
  rationale: يوضح أن الاتكاء هو هيئة تناول الطعام المألوفة آنذاك، لا مجرد الاستلقاء.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «المرمر» بوصفه المقابل العربي المألوف للألباستر، و«طيب» لتجنب تضييق معنى μύρον. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما، مع الحفاظ على ترتيب العلامات تسلسليًا.
