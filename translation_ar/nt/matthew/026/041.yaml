source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ar
  text: اسهروا وصلّوا لئلّا تدخلوا في تجربة[a]. أمّا الروح فمستعدّة، وأمّا الجسد فضعيف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «اختبار» أو «محنة». فاللفظ اليوناني قد يدل على الإغراء إلى الخطيئة أو على اختبار شاق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: فعل أمر للجمع يفيد البقاء يقظين والسهر. وفي سياق جثسيماني يجمع بين اليقظة الجسدية، إذ كان التلاميذ نيامًا، والتنبه الروحي.
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: أمر واضح وطبيعي في العربية، ويحافظ على اقترانه بالأمر بالسهر من غير صياغة تقدمية متكلفة.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: لئلّا تدخلوا
  rationale: يحافظ على غرض الأمر وصورة الدخول الواردة في اليونانية، بدل تفسيرها بعبارة مثل «لئلّا تسقطوا».
- source_word: πειρασμόν
  choice: تجربة
  rationale: اللفظ اليوناني يحتمل الإغراء إلى الخطيئة والاختبار أو المحنة. «تجربة» لفظ عربي موجز يحتفظ بشيء من هذا الاتساع، مع توضيح المعاني في الحاشية.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: أمّا الروح فمستعدّة
  rationale: تقابل «أمّا... وأمّا...» ينقل بناء μέν...δέ، و«مستعدّة» تعبّر عن الاستعداد والرغبة دون المبالغة في معنى الحماسة.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: وأمّا الجسد فضعيف
  rationale: «الجسد» المقابل العربي الطبيعي لـ«الروح» هنا، ويعبّر عن الضعف البشري المتجسد دون إدخال مفهوم تفسيري مثل «الطبيعة الخاطئة».
theological_decisions:
- issue: مرجع πνεῦμα
  choice: الروح البشرية أو الاستعداد الباطني، بصيغة «الروح»
  alternative: الروح القدس
  rationale: المقابلة مع الجسد وسياق رغبة التلاميذ الصادقة مع عجزهم الفعلي يرجّحان الروح البشرية، من غير إضافة وصف يحسم المعنى بما يتجاوز النص.
- issue: دلالة σάρξ
  choice: «الجسد» بوصفه موضع الضعف البشري
  alternative: «البشر» أو «الطبيعة الخاطئة» أو «اللحم»
  rationale: السياق يتحدث عن الوهن البشري المتجسد، لا عن استعمال بولسي مطوّر لمفهوم الطبيعة الخاطئة. «الجسد» يحفظ التقابل مع الروح ويأتي عربيًا طبيعيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «اسهروا» لأنه طبيعي في سياق نوم التلاميذ ويحمل أيضًا معنى اليقظة، وصيغ التقابل بـ«أمّا... وأمّا...» لإبراز بنية العبارة اليونانية.
