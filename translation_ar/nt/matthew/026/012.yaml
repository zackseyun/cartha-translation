  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: ar
  text: لأنها حين سكبت هذا الطيب على جسدي، فعلت ذلك لتهيئني للدفن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فعلت ذلك من أجل دفني». يتضمن الفعل اليوناني معنى تجهيز الجسد للدفن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: حين سكبت
  rationale: اسم الفاعل الأوريستي من βάλλω يدل هنا، بحسب السياق، على سكب الطيب أو وضعه، لا على الرمي حرفيًا. والصياغة الزمنية طبيعية في العربية وتحفظ علاقته بالفعل الرئيس.
- source_word: γὰρ
  choice: لأنها
  rationale: تفيد γάρ التعليل أو التفسير، و«لأن» تنقل بوضوح أن يسوع يفسر مغزى فعل المرأة.
- source_word: μύρον
  choice: الطيب
  rationale: يدل μύρον على زيت أو دهن عطري يُستعمل للمسح. و«الطيب» لفظ عربي واضح ومألوف في هذا السياق، من غير أن يحصر المادة في عطر سائل بالمعنى الحديث.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: على جسدي
  rationale: تفيد ἐπί مع المضاف إليه هنا الملامسة أو الموضع، و«على جسدي» هي المقابلة العربية الطبيعية المباشرة.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: لتهيئني للدفن
  rationale: تركيب πρὸς مع المصدر المحلى بالأداة يفيد الغرض، وفعل ἐνταφιάζω يتضمن إعداد الجسد للدفن، لا مجرد مواراته.
- source_word: ἐποίησεν
  choice: فعلت ذلك
  rationale: يعود الفعل إلى عملية سكب الطيب المذكورة، واسم الإشارة «ذلك» يربط الغرض بالفعل السابق بوضوح.
- source_word: αὕτη
  choice: ها
  rationale: أُدغم مرجع اسم الإشارة المؤنث في ضمير الفاعل المتصل في «لأنها»، لأن المرأة معلومة من السياق؛ ولا تستلزم العربية تكرار «هذه المرأة» هنا.
theological_decisions:
- issue: دلالة ἐνταφιάζω في صلته بموت يسوع
  choice: يُفسَّر فعل المرأة على أنه تهيئة ليسوع للدفن.
  alternative: أن يكون الفعل عمومًا «من أجل دفني» من غير إبراز معنى التهيئة.
  rationale: المعنى المعجمي للفعل يشمل تجهيز الجسد للدفن. تنقل «لتهيئني للدفن» هذا الاستباق الوارد في قول يسوع من غير إضافة دعوى لاهوتية تتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الطيب» للمادة العطرية، وصيغت الجملة صياغة طبيعية مع الحفاظ على التعليل والغرض في الأصل اليوناني.
