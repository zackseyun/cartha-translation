base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: ar
  text: 'وكان الذي يسلّمه[a] قد أعطاهم علامةً، قائلًا: «الذي أقبّله هو؛ فأمسكوه.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الذي يخونه». الفعل اليوناني يعني «يسلّم»، لكنه في هذا السياق يشير إلى خيانة يهوذا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: الذي يسلّمه
  rationale: يحافظ على المعنى المباشر للفعل، «يسلّم»، مع بقاء دلالة الخيانة واضحة من سياق يهوذا وآلام يسوع، من غير أن تُحسم الدلالة المعجمية الأوسع داخل المتن.
- source_word: σημεῖον
  choice: علامةً
  rationale: «علامة» مقابل طبيعي ودقيق لـ σημεῖον، والسياق يبيّن أنها إشارة متفق عليها للتعرّف إلى يسوع.
- source_word: Ὃν ἂν φιλήσω
  choice: الذي أقبّله
  rationale: صياغة عربية طبيعية تحفظ وظيفة جملة الموصول غير المحددة التي تعيّن الشخص بواسطة القبلة.
- source_word: φιλήσω
  choice: أقبّله
  rationale: ينقل فعل التقبيل نفسه بلا إضافة معنى التحية، وهو معنى يظل ضمنيًا في السياق.
- source_word: αὐτός ἐστιν
  choice: هو
  rationale: يحفظ الإيجاز والتوكيد في العبارة اليونانية، وهو تعبير عربي مفهوم في سياق التعيين.
- source_word: κρατήσατε
  choice: فأمسكوه
  rationale: ينقل معنى القبض المحكم أو الإمساك، من غير أن يضيف صراحةً المصطلح الإجرائي «اعتقلوه».
theological_decisions:
- issue: القوة الأخلاقية للفعل παραδιδοὺς في وصف فعل يهوذا
  choice: الذي يسلّمه
  alternative: الذي يخونه
  rationale: اختير المعنى المباشر «يسلّمه» حفاظًا على سعة الفعل اليوناني، بينما يكشف السياق بوضوح أن التسليم خيانة؛ وهذا يتجنب إدخال التفسير الأخلاقي في اللفظ نفسه مع عدم إنكاره.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وكان» لنقل وظيفة δὲ الانتقالية الطبيعية من غير إضافة ظرف زمني صريح. وُضعت علامة الحاشية بعد الجملة التي تتصل بلفظ «يسلّمه» لأن الحاشية تشرح هذا الاختيار المعجمي.
