  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: ar
  text: وإذا بواحدٍ من الذين كانوا مع يسوع مدَّ يده، واستلَّ سيفه، وضرب عبدَ رئيسِ الكهنة[a]، وقطع أذنه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادم رئيس الكهنة» بدلًا من «عبد رئيس الكهنة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: تنقل الالتفات السردي والمفاجأة بصورة عربية فصيحة طبيعية، من غير اللجوء إلى «هوذا» الأشد تقليدية.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: واحدٌ من الذين مع يسوع
  rationale: يحفظ تركيب التبعيض ولا يحدد هوية الشخص بما يتجاوز نص متى.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: مدَّ يده
  rationale: تعبير عربي طبيعي يحفظ الحركة السابقة لاستلال السيف.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: استلَّ سيفه
  rationale: «استلّ» هو التعبير العربي الموجز والطبيعي لإخراج السيف استعدادًا لاستعماله.
- source_word: μάχαιραν
  choice: سيفه
  rationale: «سيف» مقابل عام ودقيق بما يكفي؛ أما «خنجر» أو «سيف قصير» فيضيفان تحديدًا غير لازم.
- source_word: πατάξας
  choice: وضرب
  rationale: ينقل الضربة العنيفة بلفظ عربي واضح، مع وصل الأفعال بحسب تتابع الحدث اليوناني.
- source_word: δοῦλον
  choice: عبدَ
  rationale: يحفظ الوضع الاجتماعي الذي يدل عليه δοῦλος بدل تلطيفه إلى «خادم»، مع بيان البديل في الحاشية.
- source_word: ἀρχιερέως
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للقب المفرد ἀρχιερεύς.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: فقطع أذنه
  rationale: ينقل نتيجة ضربة السيف بوضوح، ويحفظ الفعل المحدود المستقل في اليونانية.
- source_word: ὠτίον
  choice: أذنه
  rationale: الصيغة التصغيرية لا تستلزم هنا «شحمة الأذن»، ولذلك «الأذن» هي المقابل الطبيعي غير المتجاوز للنص.
theological_decisions:
- issue: دلالة δοῦλος في سياق اجتماعي واقعي
  choice: عبد
  alternative: خادم
  rationale: السياق يشير إلى شخص تابع لرئيس الكهنة ضمن بنية اجتماعية منزلية أو مؤسسية؛ «عبد» أقرب إلى دلالة اللفظ اليوناني ولا يلطّف وضعه، مع إبقاء «خادم» بديلًا معجميًا ممكنًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «وإذا» لإبراز المفاجأة السردية، و«استلّ» للتعبير الطبيعي عن إخراج السيف. وُضعت علامة الحاشية بعد الجملة لأنها تتعلق بالبديل المعجمي داخلها.
