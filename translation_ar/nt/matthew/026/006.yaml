  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: ar
  text: وبينما كان يسوع في بيت عنيا[a]، في بيت سمعان الأبرص[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وحين كان يسوع في بيت عنيا». تستعمل اليونانية تركيبًا ظرفيًا يمهّد للمشهد من جهة الزمن.'
    reason: lexical_alternative
  - marker: b
    text: تعكس كلمة «الأبرص» اللفظ اليوناني المستعمل لقبًا تعريفيًا لسمعان؛ ولا يحدد اللفظ في ذاته هل كانت حالته قائمة آنذاك أم كانت قد زالت، كما أن مدلوله أوسع من التشخيص الطبي الحديث لمرض هانسن.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: وبينما كان يسوع
  rationale: تؤدي صيغة المضاف المطلق هنا وظيفة ظرفية تمهّد للمشهد زمنيًا. تنقل «وبينما كان يسوع» هذا المعنى بأسلوب عربي طبيعي، وتحمل الواو قوة δὲ الانتقالية الخفيفة من غير أن تجعلها أداة استدراك قوية.
- source_word: ἐν Βηθανίᾳ
  choice: في بيت عنيا
  rationale: استعمال مكاني مباشر لحرف الجر ἐν مع اسم الموضع، مع اعتماد الصيغة العربية الشائعة للاسم.
- source_word: ἐν οἰκίᾳ
  choice: في بيت
  rationale: السياق يدل على المكان المادي، ولذلك فـ«بيت» أوضح مقابل طبيعي لـοἰκία هنا.
- source_word: Σίμωνος
  choice: سمعان
  rationale: المضاف إليه اليوناني يبيّن أن البيت لسمعان؛ وتؤدي الإضافة العربية هذا المعنى مباشرة في عبارة «بيت سمعان».
- source_word: τοῦ λεπροῦ
  choice: الأبرص
  rationale: نُقلت الصفة التعريفية الملتصقة باسم سمعان بصيغتها العربية الكتابية المألوفة، من غير افتراض أن حالته كانت قائمة آنذاك أو أنه شُفي منها.
theological_decisions:
- issue: ما إذا كانت صفة «الأبرص» تدل على حالة سمعان وقت الحدث
  choice: الإبقاء على المعرّف السردي «سمعان الأبرص» من غير تحديد زمن الحالة
  alternative: سمعان الذي كان أبرص؛ أو سمعان المصاب بمرض جلدي
  rationale: النص اليوناني يورد لقبًا تعريفيًا فقط، ولا يصرّح هل كانت الحالة مستمرة أم سابقة، كما لا يحدد تشخيصًا طبيًا حديثًا؛ لذا لا ينبغي إدخال شفاء غير مذكور أو دقة طبية غير موجودة.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُعملت «وبينما» لتمهيد المشهد زمنيًا، وحُفظت فاصلة ختامية لأن الآية جزء من جملة تمتد إلى ما بعدها.
