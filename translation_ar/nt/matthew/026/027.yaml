  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: ar
  text: 'ثم أخذ كأسًا وشكر، وأعطاهم إياها قائلًا: «اشربوا منها كلكم».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: أخذ
  rationale: اسم فاعل ماضٍ يسبق الفعل الرئيس؛ صيغته فعلًا ماضيًا في العربية تجري طبيعيًا وتحفظ تعاقب الأحداث.
- source_word: ποτήριον
  choice: كأسًا
  rationale: الاسم اليوناني بلا أداة تعريف، فالتنكير هو المقابل الأقرب، مع بقاء إمكان فهم الكأس المعهودة من السياق.
- source_word: εὐχαριστήσας
  choice: وشكر
  rationale: ينقل معنى تقديم الشكر بوضوح، من غير إدخال مصطلح طقسي أو معنى البركة غير المصرح به.
- source_word: ἔδωκεν αὐτοῖς
  choice: وأعطاهم إياها
  rationale: الضمير المؤنث يعود طبيعيًا على «كأس» في العربية، ويبيّن المفعول المفهوم من السياق.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ البناء الحالي الذي يقدّم الكلام المباشر بأسلوب عربي فصيح طبيعي.
- source_word: Πίετε ἐξ αὐτοῦ
  choice: اشربوا منها
  rationale: صيغة أمر للجمع، و«منها» تعبّر عن دلالة المصدر في ἐξ αὐτοῦ وتوافق جنس «كأس» في العربية.
- source_word: πάντες
  choice: كلكم
  rationale: توضح أن الأمر موجّه إلى جميع المخاطَبين، لا أنه يطلب شرب كل محتوى الكأس.
theological_decisions:
- issue: الدلالات الإفخارستية أو الأسرارية المحتملة للفعل εὐχαριστήσας
  choice: وشكر
  alternative: وباركها؛ وقال صلاة الشكر
  rationale: المعنى المعجمي المباشر هو تقديم الشكر؛ والصياغة لا تستبق تفسيرًا طقسيًا لاحقًا ولا تنفيه.
- issue: نطاق πάντες في الأمر
  choice: كلكم
  alternative: جميعًا؛ كلها
  rationale: الكلمة تصف جماعة المخاطَبين، ولذلك تتعلق بمن يشربون لا بمقدار ما يُشرب، من غير استنتاج ممارسة مذهبية تتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم التنكير في «كأسًا» موافقةً لغياب أداة التعريف في اليونانية، وحُوِّل تتابع اسمي الفاعل الماضيين إلى فعلين ماضيين منسقين لسلامة الأسلوب العربي.
