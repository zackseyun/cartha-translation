  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: ar
  text: 'لكنه أنكر أمام الجميع قائلًا: «لا أعرف ما تقولين».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: أنكر
  rationale: جاء الفعل اليوناني بلا مفعول به صريح، و«أنكر» يؤدي معنى رفض قول الجارية من غير أن يحدد ما الذي أنكره تحديدًا زائدًا على النص.
- source_word: ἔμπροσθεν πάντων
  choice: أمام الجميع
  rationale: تعبير عربي طبيعي يحفظ معنى وقوع الإنكار علنًا وفي حضور جميع الموجودين.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ الصيغة الحالية التابعة للفعل الرئيسي، وهو فصيح وطبيعي في السرد العربي.
- source_word: Οὐκ οἶδα
  choice: لا أعرف
  rationale: ترجمة مباشرة لفعل المعرفة المنفي، وتلائم ادعاء بطرس أنه لا يفهم قول مخاطبته.
- source_word: τί λέγεις
  choice: ما تقولين
  rationale: يحفظ المعنى المباشر «ما تقول»، وجاء الخطاب بصيغة المؤنث لأن المخاطَبة في السياق السابق هي الجارية، مع أن صيغة الفعل اليونانية نفسها لا تميز جنس المخاطَب.
theological_decisions:
- issue: ماهية إنكار بطرس
  choice: 'إبقاء متعلق الإنكار غير مذكور صراحة: «أنكر»'
  alternative: «أنكر ذلك» أو «أنكر معرفته بيسوع»
  rationale: النص اليوناني لا يذكر مفعولًا به للفعل، وإن كان السياق يبين أنه يرد على اتهام الجارية. لذلك لا تضيف الترجمة تحديدًا لاهوتيًا أو سرديًا لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة المؤنث في «تقولين» استنادًا إلى هوية المخاطَبة في السياق المباشر، لا إلى علامة صرفية في اليونانية.
