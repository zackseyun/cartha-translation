  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «أنكر» لـἠρνήσατο مع إبقاء متعلَّق الإنكار غير مصرح به، و«أمام الجميع» لـἔμπροσθεν πάντων، و«قائلًا» للمشاركة λέγων، و«لا أعرف ما تقولين» لـΟὐκ οἶδα τί λέγεις. صيغة المؤنث في «تقولين» ملائمة للسياق المباشر، حيث تخاطبه الجارية في الآية السابقة، ولا تضيف مضمونًا غير موجود.'
