base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: ar
  text: 'فحزنوا حزنًا شديدًا، وأخذوا يقولون له، واحدًا واحدًا[a]: «ألستُ أنا، يا رب؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل واحد منهم».'
    reason: lexical_alternative
  - marker: b
    text: 'يفيد الاستفهام اليوناني هنا أن السائل يتوقع جوابًا بالنفي: «ألستُ أنا، يا رب؟».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: فحزنوا حزنًا شديدًا
  rationale: ينقل شدة الحزن التي تفيدها الصيغة الحالية مع الظرف σφόδρα بعبارة عربية طبيعية واضحة، من غير تهوين للانفعال.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: وأخذوا يقولون له
  rationale: «أخذوا يقولون» تركيب عربي فصيح طبيعي يدل على الشروع، ويحافظ على المفعول غير المباشر «له».
- source_word: εἷς ἕκαστος
  choice: واحدًا واحدًا
  rationale: تؤدي العبارة معنى التوزيع الفردي والتتابع الذي في اليونانية، وهي مألوفة وواضحة في العربية المعاصرة.
- source_word: Μήτι ἐγώ εἰμι
  choice: لستُ أنا؟
  rationale: يحافظ الاستفهام المنفي على توقع المتكلم جوابًا بالنفي، وعلى توكيد الضمير ἐγώ، بدل تحويل السؤال إلى استفهام محايد.
- source_word: κύριε
  choice: يا رب
  rationale: «رب» هو المقابل المعتاد للقب κύριος عند مخاطبة يسوع، ويحفظ ثقله السردي واللاهوتي المحتمل.
theological_decisions:
- issue: دلالة κύριε في خطاب يسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: قد تأتي الكلمة اليونانية نداء احترام بمعنى «سيدي»، لكن «يا رب» يحفظ اللقب كما يستعمله متى في مخاطبة يسوع من غير شرح زائد أو حسم لما يتجاوز اللفظ.
- issue: القوة التداولية لأداة الاستفهام Μήτι
  choice: لستُ أنا؟
  alternative: أأنا هو؟
  rationale: الصياغة المنفية تحفظ توقع جواب بالنفي، وتُظهر رجاء كل تلميذ ألا يكون هو المقصود؛ أما البديل فيجعل السؤال محايدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «أخذوا يقولون» للدلالة الطبيعية على الشروع، و«واحدًا واحدًا» لإبراز الاستجابة الفردية المتتابعة. وُضع كل مؤشّر حاشية عند العبارة التي يشرحها.
