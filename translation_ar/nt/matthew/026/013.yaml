source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: ar
  text: 'الحق أقول لكم: حيثما تُعلَن هذه البشارة[a] في العالم كله، سيُروى أيضًا ما فعلته هذه المرأة، تذكارًا لها.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا الإنجيل».'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن ترجمتها: «سيُتحدَّث أيضًا عما فعلته هذه المرأة، إحياءً لذكراها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي قوة التوكيد الجازم في مطلع قول يسوع، ضمن الصيغة العربية المألوفة «الحق أقول لكم».
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية لصيغة الخطاب الشخصي.
- source_word: ὅπου ἐὰν
  choice: حيثما
  rationale: تنقل الدلالة المكانية غير المحددة بإيجاز ودقة.
- source_word: κηρυχθῇ
  choice: تُعلَن
  rationale: تحافظ على معنى الإذاعة العلنية، بلغة عربية معاصرة أوسع من الاستعمال الوعظي الاصطلاحي لكلمة «يُكرَز».
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: هذه البشارة
  rationale: «البشارة» تنقل معنى الخبر السار وتحافظ على الرصيد الكتابي للكلمة، مع إثبات البديل التقليدي «هذا الإنجيل» في الحاشية.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: في العالم كله
  rationale: تقابل العبارة اليونانية بوضوح وتحافظ على مداها الشامل.
- source_word: λαληθήσεται
  choice: سيُروى
  rationale: لأن متعلق الفعل هو ما صنعته المرأة، فـ«سيُروى» تعبير عربي طبيعي يفيد أن فعلها سيُتحدث عنه، من غير تغيير معنى المبني للمجهول.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ما فعلته هذه المرأة
  rationale: يوضح مرجع اسم الإشارة المؤنث من السياق ويحافظ على التركيز على فعلها.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: تذكارًا لها
  rationale: صياغة موجزة وقريبة من الأصل تحتفظ بفكرة التذكار دون تفسير زائد لطبيعته.
theological_decisions:
- issue: ترجمة εὐαγγέλιον
  choice: البشارة
  alternative: الإنجيل
  rationale: 'الاختيار معجمي في المقام الأول: «البشارة» تُظهر معنى الخبر السار بلغة مفهومة، بينما يُحفظ اللفظ التقليدي «الإنجيل» بديلًا مشروعًا في الحاشية.'
- issue: دلالة εἰς μνημόσυνον αὐτῆς
  choice: تذكارًا لها
  alternative: إحياءً لذكراها
  rationale: تُبقي الصياغة المختارة العبارة مفتوحة على معنى الذكر والتذكار كما في اليونانية، ولا تحدد آلية هذا التذكار أو طبيعته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الصيغة الكتابية المألوفة «الحق أقول لكم»، مع ألفاظ معاصرة طبيعية مثل «تُعلَن» و«سيُروى»، وتجنُّب حصر المعنى في اصطلاح كنسي ضيق.
