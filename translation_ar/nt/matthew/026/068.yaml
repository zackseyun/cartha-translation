lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي يقدّم كلام المستهزئين، وصيغة «قائلين» تحافظ على ارتباطه النحوي بالسياق السابق.
- source_word: Προφήτευσον
  choice: تنبأ
  rationale: فعل أمر يُستعمل هنا على سبيل السخرية، ويحافظ «تنبأ» على الصيغة الفعلية وعلى نبرة التحدي.
- source_word: ἡμῖν
  choice: لنا
  rationale: ضمير في حالة المفعول غير المباشر يبيّن الجهة التي يُطلب أن يوجَّه إليها التنبؤ.
- source_word: χριστέ
  choice: أيها المسيح
  rationale: منادى يحمل لقب Χριστός؛ و«أيها المسيح» هو التعبير العربي الطبيعي الذي يحفظ كونه لقبًا في خطاب ساخر.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: من الذي ضربك؟
  rationale: صياغة عربية واضحة تحافظ على طلب تعيين الشخص الذي وجّه الضربة، وعلى دلالة الفعل الماضي.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المشيح؛ الممسوح
  rationale: اللفظ هنا منادى ولقب، لا مجرد جزء من اسم شخصي. «المسيح» هو المقابل العربي الراسخ والمفهوم، بينما توضّح الحاشية صلته بمعنى «الممسوح» وبلفظ «المشيح».
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ تركيب اسم الفاعل «قائلين» لارتباط الآية بما قبلها، واستُخدمت صيغة النداء الطبيعية «أيها المسيح» مع إبقاء السخرية مفهومة من السياق.
