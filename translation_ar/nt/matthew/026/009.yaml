  source_fidelity: 'النص العربي يحافظ على البنية والمعنى الأساسيين في اليونانية: «كان يمكن» ينقل الإمكان الماضي في ἐδύνατο، و«أن يُباع» و«يُعطى» ينقلان المصدرين المبنيين للمجهول، و«بثمن غالٍ» يؤدي دلالة πολλοῦ بوصفها مضافًا إليه للسعر. كما أن «للفقراء» ينقل الجمع الداتي الدال على الأشخاص الفقراء.'
  naturalness: 'الصياغة فصيحة حديثة وواضحة: «لأنه كان يمكن أن يُباع هذا بثمن غالٍ ويُعطى للفقراء» سليمة ومناسبة لسياق الخطاب. والإحالة المختصرة في «يُعطى» تحافظ على إيجاز الأصل ولا تحتاج إلى إدخال «ثمنه».'
  terminology: المصطلحات مستقرة وطبيعية؛ «الفقراء» مناسبة لـ πτωχοῖς، و«ثمن غالٍ» تعبير عربي سليم عن البيع بمبلغ كبير. الحاشية دقيقة ومفهومة وتعرض البدائل دون تغيير المعنى.
