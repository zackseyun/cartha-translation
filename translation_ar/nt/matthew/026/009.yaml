  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: ar
  text: لأنه كان يمكن أن يُباع هذا بثمن غالٍ ويُعطى للفقراء[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بمبلغ كبير» أو «بسعر مرتفع». تستعمل اليونانية صيغة المضاف إليه للدلالة على الثمن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: كان يمكن
  rationale: يفيد الماضي الناقص مع المصدرين إمكانًا كان قائمًا في الماضي ولم يتحقق، وهذه صياغة عربية طبيعية.
- source_word: γὰρ
  choice: لأنه
  rationale: يحفظ المعنى التعليلي الذي يربط القول بالشكوى السابقة.
- source_word: τοῦτο
  choice: هذا
  rationale: يحافظ على اسم الإشارة المحايد في اليونانية وإحالته إلى الشيء المذكور سابقًا دون إضافة اسم صريح.
- source_word: πραθῆναι
  choice: أن يُباع
  rationale: مصدر ماضٍ مبني للمجهول من πιπράσκω، ومع «كان يمكن» يدل على بيع محتمل لم يقع.
- source_word: πολλοῦ
  choice: بثمن غالٍ
  rationale: المضاف إليه الدال على الثمن يفيد البيع بمبلغ كبير؛ والصياغة واضحة وطبيعية من غير تحديد قيمة.
- source_word: δοθῆναι
  choice: ويُعطى
  rationale: مصدر ماضٍ مبني للمجهول معطوف على «أن يُباع»، والمقصود إعطاء ما ينتج من البيع بحسب السياق، مع بقاء إيجاز الأصل.
- source_word: πτωχοῖς
  choice: للفقراء
  rationale: صفة مجموعة مستعملة استعمال الاسم في حالة المجرور غير المباشر، وتشير جماعيًا إلى الأشخاص الفقراء.
theological_decisions:
- issue: المذكور الذي يُعطى للفقراء
  choice: الإبقاء على صيغة «ويُعطى» كما في الأصل
  alternative: «ويُعطى ثمنه للفقراء»
  rationale: البديل يوضح المقصود السياقي، لكنه يضيف لفظ «ثمنه» غير الموجود صراحة في اليونانية؛ فحُفظ إيجاز الأصل وما فيه من إحالة مفهومة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل المبني للمجهول للمحافظة على بنية المصدرين اليونانيين، ووُضع مؤشر الحاشية في المتن.
