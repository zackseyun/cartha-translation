  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: ar
  text: 'ولمّا فرغ يسوع من هذه الأقوال كلها، قال لتلاميذه:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: ولمّا
  rationale: تؤدي «ولمّا» وظيفة الانتقال السردي والظرف الزمني في العبارة اليونانية بصياغة عربية طبيعية، من غير إثقال النص بالترجمة الحرفية «وحدث حين».
- source_word: ἐτέλεσεν
  choice: فرغ من
  rationale: تعبير عربي فصيح وطبيعي يدل على إتمام الكلام قبل الفعل الرئيس «قال».
- source_word: πάντας τοὺς λόγους τούτους
  choice: هذه الأقوال كلها
  rationale: «الأقوال» تنقل λόγους في سياق ختام خطاب، و«كلها» تحفظ معنى πάντας بوضوح وبترتيب عربي طبيعي.
- source_word: εἶπεν
  choice: قال
  rationale: المقابل السردي المباشر والطبيعي للفعل اليوناني، بلا إضافة دلالة غير مصرّح بها.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: تحفظ اللام جهة القول، وتثبت ضمير الملكية الصريح αὐτοῦ في صياغة عربية موجزة.
theological_decisions: []
