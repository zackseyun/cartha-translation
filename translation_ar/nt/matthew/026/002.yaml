  terminology: «الفصح» و«ابن الإنسان» و«يُصلَّم» مصطلحات مناسبة ومتسقة مع الاستعمال الكتابي العربي. الحاشية تبيّن إمكان «يُخان» دون أن تحصر دلالة الفعل في الخيانة، وتحافظ بذلك على اتساع الأصل.
