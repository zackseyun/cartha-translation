  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: «تعلمون» لـ Οἴδατε، و«بعد يومين» لـ μετὰ δύο ἡμέρας، و«يحلّ الفصح» للدلالة على اقتراب/وقوع الفصح، و«ابن الإنسان» للقب ὁ υἱὸς τοῦ ἀνθρώπου. كما يحافظ «يُسلَّم» على اتساع παραδίδοται وصيغته المبنية للمجهول، وتنقل «ليُصلب» بوضوح غاية/نتيجة εἰς τὸ σταυρωθῆναι.'
