source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: ar
  text: تعلمون أنه بعد يومين يحلّ الفصح، وابن الإنسان يُسلَّم[a] ليُصلب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُخان». يمكن أن يدل الفعل اليوناني على الخيانة، لكن معناه الأوسع هو «يُسلَّم» أو «يُدفع إلى أيدي آخرين».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: تعلمون
  rationale: فعل في صيغة المخاطب الجمع، وهو تامّ الصيغة حاضر المعنى؛ و«تعلمون» تعبير عربي مباشر وطبيعي.
- source_word: μετὰ δύο ἡμέρας
  choice: بعد يومين
  rationale: تحافظ العبارة على الدلالة الزمنية المباشرة لحرف الجر μετά مع النصب.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: هو الاسم العربي الكتابي المستقر لعيد الفصح، ولا تستلزم العبارة اليونانية إضافة كلمة «عيد».
- source_word: γίνεται
  choice: يحلّ
  rationale: يدل γίνομαι هنا على وقوع الفصح أو مجيء موعده؛ و«يحلّ» عربية طبيعية تُظهر قرب المناسبة دون إضافة تفسير زائد.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المعروف ودلالاته الكتابية واللاهوتية من غير إعادة صياغة تفسيرية.
- source_word: παραδίδοται
  choice: يُسلَّم
  rationale: يحفظ المعنى الأوسع للفعل، أي التسليم أو الدفع إلى آخرين، من غير حصره في الخيانة، مع إبقاء صيغة المبني للمجهول.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: ليُصلب
  rationale: تنقل لام الغاية مع المبني للمجهول معنى التركيب اليوناني الدال على الغرض أو النتيجة بوضوح وإيجاز.
theological_decisions:
- issue: دلالة παραδίδοται في خبر الآلام
  choice: يُسلَّم
  alternative: يُخان
  rationale: يشمل السياق خيانة يهوذا، لكن الفعل اليوناني أوسع من الخيانة وحدها، وقد يترك مجالًا لتداخل الفعل البشري والتسليم ضمن التدبير الإلهي. لذلك يحفظ «يُسلَّم» التوتر المقصود ولا يضيّق المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «يحلّ الفصح» بدل تعبير حرفي ثقيل، وحُفظت صيغة المضارع والمبني للمجهول في «يُسلَّم» مع وضع علامة الحاشية عند اللفظة التي تشرحها.
