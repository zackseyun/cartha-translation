  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: ar
  text: 'ولمّا خرج إلى البوابة، رأته امرأة أخرى، وتقول للذين هناك: «كان هذا مع يسوع الناصري».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: المدخل
  rationale: يشير هنا إلى موضع البوابة أو دهليزها، و«المدخل» تعبير عربي طبيعي لا يضيّق المعنى إلى باب منفرد.
- source_word: ἄλλη
  choice: خادمة أخرى
  rationale: اللفظة تعني حرفيًا «أخرى»، ويُفهم مرجعها من الخادمة المذكورة في العدد السابق؛ أُظهر المرجع في العربية لوضوح السياق.
- source_word: τοῦ Ναζωραίου
  choice: الناصري
  rationale: نسبة إلى الناصرة، وهي الصياغة العربية المألوفة والموجزة.
- source_word: λέγει
  choice: فقالت
  rationale: المضارع التاريخي اليوناني يؤدي وظيفة سردية؛ حُوّل إلى الماضي الطبيعي في السرد العربي مع الحفاظ على الحدث.
theological_decisions:
- issue: دلالة لقب «الناصري»
  choice: يسوع الناصري
  alternative: يسوع الذي من الناصرة
  rationale: حُفظ اللقب النسبي كما في المصدر، من غير تحميله دلالة لاهوتية إضافية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع تركيب سردي طبيعي وحوار مباشر مفهوم.
