  to: وكان رؤساء الكهنة والمجلس كله[b] يسعون إلى إيجاد شهادة زور[a] ضد يسوع لكي يقتلوه.
  rationale: يُبقي النص على دلالة الاستمرار في «كان ... يسعون»، وعلى غاية الفعل في «لكي»، وعلى العمومية في «المجلس كله». واستُبدل «يميتوه» بـ«يقتلوه» لتحسين السلاسة العربية دون زيادة تفسيرية، كما صُححت مواضع مراجع الحواشي.
