lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: أداة انتقال سردي خفيفة؛ الواو طبيعية في العربية ولا توحي بتعارض حاد أو بزمن غير مصرّح به.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف والدقيق للقيادة الكهنوتية العليا بصيغة الجمع.
- source_word: συνέδριον ὅλον
  choice: المجلس كله
  rationale: يترجم اسم الهيئة بدل نقله صوتيًا، ويحفظ ὅλον الدالة على المجلس بوصفه هيئة كاملة؛ وتوضح الحاشية هويته التاريخية.
- source_word: ἐζήτουν
  choice: كانوا يسعون إلى إيجاد
  rationale: يحفظ الاستمرار الذي يفيده الماضي الناقص، ويبين أنهم كانوا يعملون على تحصيل الشهادة.
- source_word: ψευδομαρτυρίαν
  choice: شهادة زور
  rationale: صياغة عربية قانونية طبيعية تدل على شهادة كاذبة، مع الإشارة في الحاشية إلى إمكان فهم اللفظ بمعنى شاهد زور.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: ضد يسوع
  rationale: ينقل معنى المعارضة والاتهام في السياق القضائي بوضوح.
- source_word: ὅπως
  choice: لكي
  rationale: أداة غرض عربية موجزة تحفظ القوة الغائية للعبارة.
- source_word: αὐτὸν θανατώσωσιν
  choice: يميتوه
  rationale: يحفظ معنى التسبب في موته ضمن السياق القضائي من غير أن يخصص طريقة التنفيذ بما يتجاوز اليونانية.
theological_decisions:
- issue: القصد القضائي لدى القادة
  choice: إظهار سعي متواصل إلى تحصيل شهادة زور بغرض إماتة يسوع
  alternative: اختصار العبارة إلى «طلبوا شهادة زور ليقتلوه»
  rationale: يجمع النص بين الماضي الناقص ἐζήτουν وجملة الغرض ὅπως...θανατώσωσιν، فيصور تدبيرًا متواصلًا ومقصودًا من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «شهادة زور» لسلامته وطبيعته في السياق القانوني، وتُرك اسم «السنهدريم» للحاشية تسهيلًا على القارئ العام.
