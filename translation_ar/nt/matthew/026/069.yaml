  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: ar
  text: 'أَمَّا بُطْرُسُ فَكَانَ جَالِسًا خَارِجًا فِي السَّاحَةِ. فَتَقَّدَمَتْ إِلَيْهِ خَادِمَةٌ وَاحِدَةٌ[a] قَائِلَةً: «وَأَنْتَ أَيْضًا كُنْتَ مَعَ يَسُوعَ الْجَلِيلِيِّ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جارية» أو «فتاة مستعبدة». يمكن أن تدل الكلمة اليونانية παιδίσκη على خادمة شابة، وقد تكون أحيانًا أَمَة.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا
  rationale: أداة انتقال سردي لطيف، وتناسب هنا التحول من مشهد محاكمة يسوع إلى بطرس من غير أن تفرض تضادًا قويًّا أو معنى زمنيًّا غير مصرح به.
- source_word: ἐκάθητο ἔξω
  choice: كَانَ جَالِسًا فِي الْخَارِجِ
  rationale: يحفظ صيغة الماضي المستمر الدالة على حالة قائمة، ويبين أن جلوسه كان خارج موضع الإجراءات الداخلية.
- source_word: ἐν τῇ αὐλῇ
  choice: فِي السَّاحَةِ
  rationale: تشير αὐλή في هذا السياق إلى الساحة المفتوحة التابعة للدار، و«الساحة» تعبير عربي واضح وطبيعي.
- source_word: προσῆλθεν αὐτῷ
  choice: فَتَقَدَّمَتْ إِلَيْهِ
  rationale: ينقل معنى الاقتراب الجسدي بعبارة عربية مألوفة، مع الفاء لاستمرار تسلسل السرد.
- source_word: μία παιδίσκη
  choice: خَادِمَةٌ وَاحِدَةٌ
  rationale: «خادمة» تبين دورها الاجتماعي من غير الجزم بأنها كانت أَمَة، و«واحدة» تحفظ μία التي تقدم شخصية بعينها.
- source_word: λέγουσα
  choice: قَائِلَةً
  rationale: يحافظ على البنية الوصفية للمشاركة اليونانية وعلى تدفق الجملة.
- source_word: Καὶ σὺ
  choice: وَأَنْتَ أَيْضًا
  rationale: يحفظ الواو والتوكيد على أن بطرس كان هو أيضًا ممن ارتبطوا بيسوع.
- source_word: ἦσθα μετὰ
  choice: كُنْتَ مَعَ
  rationale: ينقل المعنى العلاقي المباشر من غير توسيعه تفسيريًّا إلى معنى التلمذة.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: يَسُوعَ الْجَلِيلِيِّ
  rationale: يحفظ الوصف التعريفي «الجليلي» بوصفه لقبًا يحدد يسوع.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «أما» للانتقال السردي، وحُفظ استمرار الفعل في «كان جالسًا». وُضع مؤشر الحاشية بعد «خادمة واحدة» لأن الحاشية تخص معنى παιδίσκη لا معنى «الساحة».
