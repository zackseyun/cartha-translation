    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: ولكن بعد أن
  rationale: تفيد μετά مع المصدر المحلّى بأداة التعريف التعاقب الزمني، أي «بعد»، وتحفظ «لكن» ما في δέ من مقابلة خفيفة مع خبر تعثر التلاميذ السابق.
- source_word: τὸ ἐγερθῆναί με
  choice: بعد أن أُبعث
  rationale: يحفظ الفعل المبني للمجهول في صيغة يونانية ماضية، ويؤدي في العربية تعبيرًا طبيعيًا عن القيامة من غير التصريح بفاعل الإقامة.
- source_word: προάξω
  choice: سأسبقكم
  rationale: ينقل معنى التقدم على الآخرين والذهاب قبلهم بعبارة عربية واضحة، من غير أن يفرض معنى القيادة الرسمية.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير مفعول به لجمع المخاطبين، وهو ظاهر في اللاحقة العربية.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: «إلى» هي الصياغة العربية الطبيعية للدلالة على الحركة نحو إقليم الجليل.
theological_decisions:
- issue: صيغة القيامة في ἐγερθῆναί
  choice: بعد أن أُبعث
  alternative: بعد أن أقوم
  rationale: أُبقيت الصيغة المبنية للمجهول لكيلا تُطمس هيئة الفعل اليوناني وما قد توحي به من فاعلية إلهية من غير أن تصرّح بها الآية؛ وأُثبت البديل المبني للمعلوم في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. اختير «أُبعث» لصون المبني للمجهول بصورة طبيعية، و«سأسبقكم» لنقل معنى الذهاب قبل المخاطبين دون زيادة تفسيرية.
