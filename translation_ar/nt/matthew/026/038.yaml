  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: ar
  text: 'حينئذ يقول لهم: «نفسي حزينة جدًا حتى الموت[a]. ابقوا هنا واسهروا معي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى حد الموت».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يحمل الفعل اليوناني معنى البقاء مستيقظين ومعنى اليقظة والانتباه معًا.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: أداة زمنية تنقل السرد إلى الحدث التالي بعبارة عربية فصيحة وطبيعية.
- source_word: λέγει
  choice: يقول
  rationale: حُفظ المضارع التاريخي اليوناني لما فيه من حيوية سردية.
- source_word: αὐτοῖς
  choice: لهم
  rationale: مفعول غير مباشر للفعل، وترجمته المباشرة الطبيعية «لهم».
- source_word: Περίλυπός
  choice: غارقة في الحزن
  rationale: ينقل شدة الحزن والإحاطة به بلغة عربية واضحة، مع إسناده طبيعيًا إلى «نفسي».
- source_word: ἡ ψυχή μου
  choice: نفسي
  rationale: يحفظ الاسم الصريح ψυχή ولا يختزله في ضمير، من غير فرض تصور تقني للتركيب الإنساني.
- source_word: ἕως θανάτου
  choice: حتى الموت
  rationale: يحفظ إيجاز العبارة وشدتها، مع إبقاء احتمال بلوغ الحزن غايته عند الموت أو إلى حد الموت.
- source_word: μείνατε
  choice: ابقوا
  rationale: أمر بالمكوث في المكان، و«ابقوا» طبيعية وواضحة في العربية المعاصرة.
- source_word: ὧδε
  choice: هنا
  rationale: المقابل المباشر والطبيعي لظرف المكان.
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: يدل في السياق مباشرة على البقاء مستيقظين، ويمكن أن يتضمن أيضًا اليقظة والانتباه؛ وقد أُثبت هذا الاتساع في الحاشية.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: ينقل معنى المصاحبة بوضوح وإيجاز.
theological_decisions:
- issue: ترجمة ψυχή في قول يسوع
  choice: نفسي
  alternative: إنني غارق في الحزن
  rationale: إبقاء «نفسي» يحفظ لفظ النص وصورة عمق كرب يسوع الإنساني، من غير تحميل العبارة تعريفًا مذهبيًا تقنيًا للنفس.
- issue: دلالة γρηγορεῖτε في السياق
  choice: اسهروا
  alternative: كونوا يقظين / راقبوا
  rationale: السهر هو المعنى المباشر الملائم لنوم التلاميذ اللاحق، لكن اللفظ اليوناني يحتمل كذلك اليقظة والانتباه؛ لذلك لم يُطمس المعنى الأوسع وأُشير إليه في الحاشية.
- issue: مدى عبارة ἕως θανάτου
  choice: حتى الموت
  alternative: إلى حد الموت
  rationale: تحفظ الصياغة المختارة توتر العبارة وقوتها من غير الجزم هل المقصود حزن يقود إلى الموت أم تعبير عن أقصى شدة الحزن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المضارع التاريخي في «يقول»، واستُعملت عبارة «غارقة في الحزن» لنقل شدة περίλυπος بصورة طبيعية. وُضعت جميع علامات الحواشي في المتن.
