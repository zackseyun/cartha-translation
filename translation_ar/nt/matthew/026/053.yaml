  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: ar
  text: أم تظن أنني لا أستطيع أن أطلب إلى أبي[a]، فيضع[b] تحت تصرّفي في الحال أكثر من اثني عشر فيلقًا[c] من الملائكة؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أن أدعو أبي» أو «أن أسأل أبي».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يضع بجانبي»؛ أي يجعلها حاضرة ومتاحة لنجدتي.'
    reason: lexical_alternative
  - marker: c
    text: كان الفيلق وحدة عسكرية رومانية كبيرة؛ ويؤكد التعبير ضخامة القوة السماوية.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: أم
  rationale: تدخل استفهامًا بديلًا متصلًا بسياق توبيخ يسوع، وتحافظ على انسياب السؤال البلاغي.
- source_word: δοκεῖς
  choice: تظن
  rationale: تعبير عربي طبيعي ينقل قوة السؤال المباشر.
- source_word: οὐ δύναμαι
  choice: لا أستطيع
  rationale: ينقل معنى القدرة، لا الإذن ولا الإرادة.
- source_word: παρακαλέσαι
  choice: أن أطلب إلى
  rationale: يفيد توجيه طلب للمساعدة، مع إبقاء طبيعة الطلب دون مبالغة في معنى التوسل.
- source_word: τὸν πατέρα μου
  choice: أبي
  rationale: يحافظ على النسبة البنوية المباشرة في اليونانية بصياغة عربية طبيعية.
- source_word: παραστήσει μοι
  choice: فيضع تحت تصرّفي
  rationale: ينقل معنى جعل العون حاضرًا ومتاحًا له، لا مجرد إرساله.
- source_word: ἄρτι
  choice: في الحال
  rationale: ينقل دلالة الفورية في السياق.
- source_word: πλείω δώδεκα
  choice: أكثر من اثني عشر
  rationale: ترجمة مباشرة للمقارنة مع العدد.
- source_word: λεγιῶνας
  choice: فيلقًا
  rationale: يحفظ الصورة العسكرية الرومانية الواردة في الأصل.
- source_word: ἀγγέλων
  choice: من الملائكة
  rationale: السياق يدل على الكائنات السماوية لا الرسل البشر.
theological_decisions:
- issue: هل تتعلق العبارة بقدرة يسوع أم بإذنه أو إرادته في طلب العون الإلهي؟
  choice: لا أستطيع أن أطلب إلى أبي
  alternative: لا يمكنني أن أدعو أبي؛ أو صياغة توحي بأنه لا يريد الطلب
  rationale: الفعل δύναμαι يدل على القدرة. وتحافظ الصياغة على أن القبض على يسوع لم يكن بسبب العجز، من غير إضافة تفسير عقائدي يحسم التوتر في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «فيلق» للإبقاء على الصورة التاريخية العسكرية، و«يضع تحت تصرّفي» لإيضاح الدلالة الاصطلاحية مع توثيق المعنى الحرفي في الحاشية.
