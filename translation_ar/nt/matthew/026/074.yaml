  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: ar
  text: 'حينئذ أخذ يستنزل اللعنات ويحلف[a]: «أنا لا أعرف الرجل». وفي الحال صاح ديك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا: «أخذ يستدعي اللعنات ويحلف». والأرجح أنه استنزل اللعنات على نفسه توكيدًا لإنكاره.'
    reason: بيان الدلالة المحتملة للفعل اليوناني من غير إدخال المفعول غير المذكور صراحة في المتن.
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني يربط الحدث بما سبقه ويبيّن تتابع وقائع الإنكار.
- source_word: ἤρξατο
  choice: أخذ
  rationale: ينقل معنى الشروع مع المصدرين التاليين بأسلوب عربي طبيعي، ويبرز تصاعد إنكار بطرس.
- source_word: καταθεματίζειν
  choice: يستنزل اللعنات
  rationale: يحافظ على معنى استدعاء اللعنة من غير أن يعيّن في المتن مَن تقع عليه، إذ لا يذكر النص اليوناني مفعولًا صريحًا.
- source_word: ὀμνύειν
  choice: يحلف
  rationale: يدل على القسم المؤكد، وهو المقصود في سياق تشديد الإنكار.
- source_word: ὅτι
  choice: علامتا الاقتباس والنقطتان
  rationale: تُقدَّم جملة القسم والإنكار في اقتباس مباشر واضح بدل ترجمة الأداة بحرف مصدري.
- source_word: Οὐκ οἶδα
  choice: أنا لا أعرف
  rationale: ينقل نفي المعرفة أو الصلة نقلًا مباشرًا، مع إظهار الضمير لتأكيد الإنكار.
- source_word: τὸν ἄνθρωπον
  choice: هذا الرجل
  rationale: تعبير عربي طبيعي في مقام الإشارة إلى الشخص موضوع الحديث؛ واسم الإشارة مفهوم من المقام وإن كانت اليونانية حرفيًا «الرجل».
- source_word: καὶ εὐθέως
  choice: وفي الحال
  rationale: يحفظ معنى الوقوع الفوري ويصل الحدث بما قبله بسلاسة.
- source_word: ἀλέκτωρ
  choice: ديك
  rationale: الاسم نكرة في اليونانية، والعربية الطبيعية تقول إن ديكًا صاح دون افتراض ديك معيّن.
- source_word: ἐφώνησεν
  choice: صاح
  rationale: الفعل العربي المألوف لصوت الديك في هذا السياق.
theological_decisions:
- issue: مدلول καταθεματίζειν في إنكار بطرس
  choice: إبقاء استدعاء اللعنات غير محدد المفعول في المتن، مع بيان الاحتمال الأرجح في الحاشية
  alternative: التصريح بأنه أنزل اللعنات على نفسه، أو فهم العبارة على أنه شتم الآخرين أو لعن يسوع
  rationale: الفعل في سياق الحلف يرجح صيغة قسم تتضمن استنزال اللعنة على النفس، لكن النص لا يذكر المفعول صراحة؛ لذلك يحفظ المتن هذا القدر من الإبهام ولا يوحي بأن بطرس لعن يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يستنزل اللعنات» لتجنب فهم العبارة على أنها مجرد ألفاظ نابية، مع حفظ عدم تعيين مَن تقع عليه اللعنة في الأصل.
