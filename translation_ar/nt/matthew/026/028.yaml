  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: ar
  text: لأن هذا هو دمي، دم العهد[a]، الذي يُسكب لأجل كثيرين[b] لمغفرة الخطايا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «دمي، دم العهد الجديد».'
    reason: textual_variant
  - marker: b
    text: 'أو: «نيابة عن كثيرين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: ترجمة مباشرة لاسم الإشارة، وهو يحيل إلى ما يقدّمه يسوع في العشاء. لا يذكر النص اليوناني «الكأس» في هذه الجملة، لذلك لم تُضف إلى المتن.
- source_word: γάρ
  choice: لأن
  rationale: تحفظ الأداة معناها التعليلي الذي يصل القول بالأمر السابق بالشرب، وهي صياغة عربية واضحة وطبيعية.
- source_word: τὸ αἷμά μου
  choice: دمي
  rationale: ترجمة مباشرة تحافظ على الدلالة الذبائحية والعهدية من غير شرح تفسيري داخل المتن.
- source_word: τῆς διαθήκης
  choice: دم العهد
  rationale: صيغ التركيب في العربية على سبيل البدل بعد «دمي» ليكون طبيعيًا وواضحًا. يتبع المتن قراءة SBLGNT التي لا تتضمن صفة «الجديد».
- source_word: περὶ πολλῶν
  choice: لأجل كثيرين
  rationale: ينقل في هذا السياق معنى المنفعة أو النيابة، مع إبقاء لفظ «كثيرين» كما في اليونانية وعدم حسم الجدل اللاهوتي المتعلق بمدى الكفارة.
- source_word: ἐκχυννόμενον
  choice: الذي يُسفك
  rationale: ينقل اسم الفاعل المضارع المبني للمجهول في جملة صلة عربية طبيعية، ويحفظ صورة سكب الدم الذبائحية.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: لمغفرة الخطايا
  rationale: صياغة موجزة وواضحة تنقل دلالة الغاية أو النتيجة في العبارة اليونانية.
theological_decisions:
- issue: إضافة «الجديد» إلى «العهد»
  choice: دم العهد
  alternative: دمي، دم العهد الجديد
  rationale: النص اليوناني المعتمد لا يتضمن καινῆς («الجديد»). لذلك لم تُستورد الكلمة من النصوص الموازية أو من تقليد مخطوطي آخر، مع إثبات القراءة البديلة في الحاشية.
- issue: دلالة «لأجل كثيرين» في لغة الكفارة
  choice: لأجل كثيرين
  alternative: لأجل الجميع
  rationale: يحفظ المتن πολλῶν («كثيرين») كما وردت، من غير توسيعها إلى «الجميع» أو توظيفها لحسم خلاف لاهوتي يتجاوز ألفاظ الآية.
- issue: دلالة περί مع المضاف إليه
  choice: لأجل كثيرين
  alternative: نيابة عن كثيرين
  rationale: اختيرت عبارة عربية طبيعية تتسع لمعنى المنفعة والنيابة، وأُثبت البديل الأكثر تصريحًا بالنيابة في الحاشية حفاظًا على المجال الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل البدل «دمي، دم العهد» لتجنب تركيب عربي ثقيل مع الحفاظ على العلاقة النحوية والمعنى العهدي. وُضعت علامتا الحاشية في موضعيهما من المتن.
