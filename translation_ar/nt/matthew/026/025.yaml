source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: ar
  text: 'فأجاب يهوذا، الذي كان يسلّمه، وقال: «ألستُ أنا، يا معلّم؟» قال له: «أنت قلت».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: عبارة «أنت قلت» جواب موجز يمكن أن يفيد الإقرار بما قاله السائل، لكنها تحافظ هنا على الصياغة غير المباشرة في الأصل.
    reason: توضيح دلالة التعبير اليوناني الاصطلاحي دون إزالة إيجازه أو غموض درجته.
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: الذي كان يسلّمه
  rationale: الفعل παραδίδω يعني حرفيًا «يسلّم»، والسياق يحمل معنى الخيانة دون الحاجة إلى استبدال اللفظ الأصلي بتفسير صريح.
- source_word: Μήτι ἐγώ εἰμι
  choice: ألستُ أنا
  rationale: تحافظ هذه الصياغة على السؤال الذي يتوقع جوابًا بالنفي، بصياغة عربية طبيعية وموجزة.
- source_word: ῥαββί
  choice: يا معلّم
  rationale: ينقل المقصود الوظيفي من اللقب العبري/الآرامي بلفظ عربي واضح للقراء المعاصرين.
- source_word: Σὺ εἶπας
  choice: أنت قلت
  rationale: ترجمة قريبة تحفظ الإيجاز والتلميح في جواب يسوع، من غير أن تحوّله إلى تأكيد تفسيري صريح.
theological_decisions:
- issue: درجة صراحة جواب يسوع ليهوذا
  choice: أنت قلت
  alternative: نعم، أنت هو
  rationale: الأصل اليوناني موجز وغير مباشر؛ لذلك تُحفظ صيغته وما فيها من توتر بدل حسمها بتفسير صريح.
- issue: وصف فعل يهوذا
  choice: الذي كان يسلّمه
  alternative: الذي كان يخونه
  rationale: «يسلّمه» أقرب إلى اللفظ اليوناني، مع بقاء دلالة الخيانة واضحة من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «معلّم» بدل النقل الصوتي «رابي»، وحُفظ جواب يسوع بصيغته المقتضبة. وُضعت علامة الحاشية في المتن كما يلزم.
