base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: ar
  text: 'ومضى مرة أخرى، للمرة الثانية، وصلّى قائلًا: «يا أبي، إن كان هذا[a] لا يمكن أن يمضي ما لم أشربه[b]، فلتكن مشيئتك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي كأس الألم المذكورة في الآية السابقة؛ أما اليونانية هنا فتقول فقط «هذا» و«ـه».
    reason: cross_reference
  - marker: b
    text: 'ويمكن ترجمة الجملة: «إن لم يكن ممكنًا أن يمضي هذا إلا إذا شربته، فلتكن مشيئتك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: من جديد، للمرة الثانية
  rationale: يحفظ عنصري التكرار في اليونانية من غير دمجهما، مع صياغة عربية واضحة وطبيعية.
- source_word: ἀπελθὼν
  choice: مضى
  rationale: اسم الفاعل اليوناني يدل على فعل سابق للصلاة، وصيغ في العربية فعلًا سرديًا متعاقبًا.
- source_word: προσηύξατο λέγων
  choice: وصلّى قائلًا
  rationale: ترجمة مباشرة وطبيعية للفعل واسم الفاعل الذي يقدّم مضمون الصلاة.
- source_word: Πάτερ μου
  choice: يا أبي
  rationale: يحفظ النداء وعلاقة البنوة التي يعبّر عنها ضمير المتكلم.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: إن كان هذا لا يمكن أن يمضي
  rationale: يحفظ اسم الإشارة الصريح ولا يضيف لفظ «الكأس» غير المذكور في هذه الآية؛ و«يمضي» يؤدي معنى العبور أو الزوال في هذا السياق.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: ما لم أشربه
  rationale: صياغة عربية موجزة وطبيعية للشرط الاستثنائي، مع إبقاء الضمير العائد إلى «هذا».
- source_word: γενηθήτω τὸ θέλημά σου
  choice: فلتكن مشيئتك
  rationale: يحفظ قوة صيغة الأمر في صلاة التسليم، ويتسق مع لغة الصلاة في متى 6:10.
theological_decisions:
- issue: هل يُصرَّح بلفظ «الكأس» بدل τοῦτο وαὐτό؟
  choice: إبقاء «هذا» والضمير «ـه» في المتن
  alternative: «إن كانت هذه الكأس لا يمكن أن تمضي ما لم أشربها»
  rationale: السياق السابق يوضح أن المقصود كأس الألم، لكن هذه الآية نفسها لا تكرر لفظ «الكأس». إبقاء الإشارة والضمير يصون دقة النص، مع توضيح المرجع في الحاشية.
- issue: صياغة صلاة يسوع في التسليم
  choice: فلتكن مشيئتك
  alternative: لتتم مشيئتك
  rationale: تحفظ صيغة الطلب وقوة الأمر اليوناني، كما تحافظ على الصدى اللفظي مع متى 6:10 من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي تكرار πάλιν وἐκ δευτέρου ظاهرًا، وحُفظت الإشارة المبهمة نسبيًا إلى الكأس بدل تفسيرها داخل المتن.
