base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: ar
  text: 'فأجابه بطرس: «حتى إن تعثّر الجميع بسببك، فلن أتعثّر أنا أبدًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يزلّ الجميع» أو «ينفر الجميع منك». يمكن أن يدل الفعل اليوناني على التعثّر، أو النفور، أو السقوط والتخلّي.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: فأجابه بطرس
  rationale: يجمع التعبير العربي الطبيعي بين اسم الفاعل والفعل الدالين على القول في اليونانية، ويحفظ ضمير المفعول العائد إلى يسوع. والفاء تلائم الانتقال مع مسحة المقابلة في δέ.
- source_word: Εἰ πάντες
  choice: حتى إن تعثّر الجميع
  rationale: تحفظ «إن» البنية الشرطية، وتؤدي «حتى» القوة التنازلية الناشئة من مقابلة بطرس نفسه بالجميع.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: تعثّر / أتعثّر
  rationale: «تعثّر» يحفظ صورة الفعل اليوناني واتساعه الدلالي، الذي قد يشمل الزلل أو النفور أو الارتداد، من غير أن يحسم هنا أن المقصود ارتداد نهائي.
- source_word: ἐν σοί
  choice: بسببك
  rationale: الباء السببية تعبر طبيعيًا عن معنى التعثر بسبب شخص أو من جرّائه في هذا التركيب.
- source_word: ἐγὼ οὐδέποτε
  choice: فلن أتعثّر أنا أبدًا
  rationale: إظهار «أنا» بعد الفعل يحفظ توكيد الضمير اليوناني ومقابلة بطرس نفسه بالجميع، و«أبدًا» تؤدي النفي الزمني القاطع في οὐδέποτε.
theological_decisions:
- issue: مدى قوة σκανδαλίζω في سياق إخفاق التلاميذ
  choice: تعثّر
  alternative: ارتدّ / تخلّى عنك
  rationale: اختير اللفظ الأوسع والأقرب إلى الصورة اليونانية، مع بيان المدى الدلالي في الحاشية، حفاظًا على احتمال الزلل الشديد أو التخلي من غير استيراد حكم عقدي عن ارتداد نهائي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم تركيب حواري طبيعي، مع إبراز مقابلة «الجميع» بـ«أنا»، والحفاظ على غموض الفعل اللاهوتي والدلالي بواسطة المتن والحاشية.
