  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: ar
  text: 'ويأتي إلى التلاميذ فيجدهم نيامًا، ويقول لبطرس: «أفلم تقدروا، إذن، أن تسهروا معي ساعة واحدة؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: يأتي
  rationale: استُعمل المضارع للمحافظة على المضارع التاريخي اليوناني وحيوية السرد.
- source_word: πρὸς τοὺς μαθητὰς
  choice: إلى التلاميذ
  rationale: تعبير عربي طبيعي يدل على الحركة باتجاه التلاميذ.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: فيجدهم نيامًا
  rationale: ينقل بوضوح أنهم كانوا في حال نوم، بصياغة عربية فصيحة وطبيعية.
- source_word: λέγει τῷ Πέτρῳ
  choice: ويقول لبطرس
  rationale: حُفظ المضارع التاريخي، واستُعمل الاسم العربي المألوف «بطرس».
- source_word: Οὕτως
  choice: أهكذا
  rationale: تنقل الاستفهام المشوب بالعتاب والدهشة، مع إبقاء دلالة «هكذا» القريبة من اللفظ اليوناني.
- source_word: οὐκ ἰσχύσατε
  choice: لم تقدروا
  rationale: ينقل معنى الاستطاعة في السياق، ويحافظ على صيغة الجمع في الفعل اليوناني.
- source_word: μίαν ὥραν
  choice: ساعة واحدة
  rationale: صياغة عربية طبيعية لمدة الزمن، مع إبراز معنى العدد μίαν.
- source_word: γρηγορῆσαι
  choice: أن تسهروا
  rationale: «تسهروا» تجمع في السياق بين عدم النوم واليقظة، بينما يُذكر البديل الأكثر تصريحًا في الحاشية.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: ترجمة مباشرة وطبيعية لمعنى المصاحبة.
theological_decisions:
- issue: توجيه الكلام إلى بطرس مع ورود فعل الاستطاعة بصيغة الجمع
  choice: الإبقاء على المفرد في «لبطرس» وعلى الجمع في «تقدروا» و«تسهروا».
  alternative: تحويل السؤال إلى المفرد وكأنه موجه إلى بطرس وحده، أو إضافة تفسير يصرح بأن بطرس يمثل الجماعة.
  rationale: النص اليوناني يذكر بطرس بوصفه المخاطَب المباشر، لكنه يستعمل صيغة الجمع في التوبيخ؛ لذلك حُفظ هذا التوتر من غير تفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ المضارع التاريخي في السرد، وصيغ الاستفهام العتابي بأسلوب عربي طبيعي، مع تجنب التفسير المذهبي أو توسيع مدلول النص.
