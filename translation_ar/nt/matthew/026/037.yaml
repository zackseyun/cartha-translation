  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: ar
  text: وأخذ معه بطرس وابني زبدي، وبدأ يحزن ويشعر بضيق شديد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبدأ يحزن ويضطرب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: أخذ معه
  rationale: ينقل معنى اصطحاب رفقاء مختارين، وهو تعبير عربي طبيعي يحفظ القوة العلاقية للفعل.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: ابني زبدي
  rationale: يحفظ التحديد الوارد في اليونانية من غير إضافة اسمي يعقوب ويوحنا، غير المذكورين في هذه الآية.
- source_word: ἤρξατο
  choice: بدأ
  rationale: يحفظ صراحة الدلالة الابتدائية للفعل اليوناني مع المصدرين التابعين له.
- source_word: λυπεῖσθαι
  choice: يحزن
  rationale: يعبّر بوضوح ووقار عن اختبار الحزن، من غير تسطيح المعنى أو المبالغة فيه.
- source_word: ἀδημονεῖν
  choice: يشتد كربه
  rationale: ينقل الضيق الداخلي الحاد الذي يفوق مجرد الحزن، بصياغة عربية طبيعية لا توحي باليأس.
- source_word: καὶ ... καὶ
  choice: و... و...
  rationale: يحفظ تنسيق العناصر وتراكم الوصف في النص اليوناني بصياغة عربية سلسة.
theological_decisions:
- issue: وصف الحالة الوجدانية ليسوع في ضوء علم المسيح
  choice: نقل الفعلين بوصفهما حزنًا حقيقيًا وكربًا شديدًا
  alternative: تلطيف الوصف لتقليل شدة التألم، أو تصعيده إلى الرعب أو اليأس
  rationale: النص يصف بوضوح معاناة يسوع الإنسانية الوجدانية الحقيقية؛ لذلك تُحفظ قوة الفعلين من غير إنقاص إنسانيته أو تجاوز الدليل المعجمي إلى معنى اليأس.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ابني زبدي» بدل العبارة الأطول «ابني زبدي الاثنين» لأن التثنية العربية تؤدي معنى العدد صراحة. وُضعت علامة الحاشية بعد الجملة التي تعرض البديل المعجمي.
