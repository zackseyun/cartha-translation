  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: ar
  text: 'وفيما هم يأكلون، قال: «الحق أقول لكم: إن واحدًا منكم سيخونني[a]».


    [a] أو، بحرفية أكثر: «سيسلّمني» أو «سيدفع بي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «سيسلّمني» أو «سيدفع بي».'
    reason: بديل معجمي يحفظ المجال الدلالي الأوسع للفعل اليوناني παραδίδωμι دون إضافة جهةٍ للتسليم غير مذكورة في النص.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: وفيما هم يأكلون
  rationale: تركيب الحال الإضافي يدل على تزامن الأكل مع قول يسوع؛ وهذه صياغة عربية طبيعية تحفظ الدلالة الزمنية.
- source_word: Ἀμὴν
  choice: الحق
  rationale: تؤدي قوة الاستهلال التوكيدي المهيب في أقوال يسوع، وهي أوضح في هذا السياق من نقل اللفظة صوتيًا «آمين».
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: نقل مباشر وطبيعي لصيغة الخطاب، يحفظ فعل القول والمخاطَبين.
- source_word: εἷς ἐξ ὑμῶν
  choice: واحدًا منكم
  rationale: تعبير عربي واضح يحفظ معنى التبعيض في اليونانية.
- source_word: παραδώσει
  choice: سيخونني
  rationale: في سياق تسليم يهوذا ليسوع، تنقل «سيخونني» دلالة الغدر العلائقي المقصودة، مع إثبات المعنى الحرفي الأوسع في الحاشية.
- source_word: με
  choice: ني في «سيخونني»
  rationale: ضمير المفعول به يعود إلى يسوع، وقد أُدمج طبيعيًا في الفعل العربي.
theological_decisions:
- issue: دلالة παραδώσει في سياق آلام يسوع
  choice: سيخونني
  alternative: سيسلّمني
  rationale: الفعل اليوناني أوسع من معنى الخيانة، ويمكن أن يعني التسليم أو الدفع إلى يد آخرين؛ لكن السياق يصور فعل واحد من التلاميذ ضد يسوع بوصفه غدرًا. اختيرت «سيخونني» في المتن لوضوح المعنى السياقي، مع إبقاء المعنى الحرفي البديل في الحاشية دون حسم زائد.
