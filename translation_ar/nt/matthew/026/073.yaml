- source_word: προσελθόντες
  choice: تقدَّم
  rationale: ينقل حركة الواقفين نحو بطرس بإيجاز ووضوح، ويؤدي وظيفة اسم الفاعل اليوناني ضمن تسلسل عربي طبيعي.
- source_word: οἱ ἑστῶτες
  choice: الواقفون هناك
  rationale: يحافظ على الصورة المباشرة لمن كانوا واقفين في الموضع، من غير ضغطها في لفظ أكثر تفسيرًا مثل «الحاضرون».
- source_word: Ἀληθῶς
  choice: حقًّا
  rationale: ينقل نبرة التأكيد الواثق في كلام المتهمين بصياغة عربية واضحة ومألوفة.
- source_word: καὶ σὺ ἐξ αὐτῶν εἶ
  choice: أنت أيضًا واحدٌ منهم
  rationale: صياغة عربية طبيعية تحفظ توكيد شمول بطرس في الجماعة التي يشيرون إليها.
- source_word: καὶ γὰρ
  choice: فـ... نفسها
  rationale: الفاء تؤدي معنى التعليل في γάρ، و«نفسها» تنقل القوة التوكيدية لـ καί من غير تكلف.
- source_word: ἡ λαλιά σου
  choice: لهجتك
  rationale: قد تدل λαλιά على الكلام أو طريقة الكلام أو اللهجة؛ و«لهجتك» أوضح في هذا السياق، حيث يُستدل من نطق بطرس على انتمائه.
- source_word: δῆλόν σε ποιεῖ
  choice: تكشف أمرك
  rationale: تعبير عربي طبيعي يؤدي معنى جعل هوية بطرس أو انتمائه ظاهرًا، مع تجنب التركيب الحرفي غير المألوف «تجعلك ظاهرًا».
