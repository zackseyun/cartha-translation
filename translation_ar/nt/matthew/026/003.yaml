  rationale: أداة زمنية تربط الحدث بما سبقه، وصياغتها فصيحة وطبيعية في السرد.
- source_word: συνήχθησαν
  choice: اجتمع
  rationale: ينقل معنى احتشاد الجماعة بصورة عربية طبيعية؛ وصيغة المبني للمجهول اليونانية لا يلزم أن تدل هنا على فاعل خارجي.
- source_word: ἀρχιερεῖς
