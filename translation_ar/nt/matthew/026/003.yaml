- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: شيوخ الشعب
  rationale: ترجمة مباشرة وطبيعية للتركيب الإضافي، وتشير إلى قادة الشعب المعترف بهم.
- source_word: εἰς τὴν αὐλὴν
  choice: في دار
  rationale: مع فعل الاجتماع يبرز موضع الاجتماع، وαὐλή في هذا السياق قد تشير إلى دار كبيرة أو فنائها؛ و«دار» تتسع للمكان السكني وفنائه دون حسم زائد.
- source_word: τοῦ ἀρχιερέως
  choice: رئيس الكهنة
  rationale: ينقل المنصب المفرد بوضوح.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: المدعو قيافا
  rationale: يحافظ بإيجاز على معنى اسم المفعول اليوناني ويعرّف صاحب المنصب باسمه.
