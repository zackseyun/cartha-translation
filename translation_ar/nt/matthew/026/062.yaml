  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: نهوض رئيس الكهنة، مخاطبته للمسيح بالضمير، السؤال الاستنكاري عن عدم الإجابة، ثم السؤال عن مضمون الشهادة المضادة. وتعبير «يشهد به هؤلاء عليك» يحفظ الطابع القضائي للفعل καταμαρτυροῦσιν وللضمير «عليك».'
  naturalness: 'الصياغة فصحى حديثة واضحة ومناسبة للسرد القضائي: «وقام رئيس الكهنة وقال له» و«ما الذي يشهد به هؤلاء عليك؟» سليمتان وطبيعتان. و«ألا تجيب بشيء؟» سؤال استنكاري عربي مفهوم يعبّر جيدًا عن قوة السؤال اليوناني.'
  terminology: «رئيس الكهنة» مقابل راسخ ودقيق لـ ὁ ἀρχιερεύς في هذا الموضع، و«يشهد ... عليك» يحافظ على الدلالة القانونية من غير تحويل الشهادة إلى اتهام تفسيري. لا توجد مصطلحات لاهوتية أو أسماء تستلزم تعديلًا.
