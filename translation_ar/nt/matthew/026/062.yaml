  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: ar
  text: 'وقام رئيس الكهنة وقال له: «ألا تجيب بشيء؟ ما الذي يشهد به هؤلاء عليك؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: قام
  rationale: ينقل فعل النهوض الجسدي الذي قام به رئيس الكهنة قبل أن يتكلم، بصياغة عربية طبيعية موجزة.
- source_word: ὁ ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للمنصب الديني اليهودي المفرد في هذا السياق.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: يحافظ على الضمير الوارد في اليونانية من غير استبداله باسم يسوع.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: ألا تجيب بشيء؟
  rationale: صياغة عربية طبيعية تنقل السؤال الاستنكاري ومعنى عدم تقديم أي جواب، من غير التزام بحرفية متعثرة.
- source_word: τί
  choice: ما الذي
  rationale: يقدّم مضمون الشهادة في سؤال عربي واضح، مع الحفاظ على الاستفهام المباشر في الأصل.
- source_word: οὗτοί
  choice: هؤلاء
  rationale: يحافظ على اسم الإشارة الجمع من غير إضافة اسم غير مصرّح به مثل «الرجال» أو «الناس»، إذ يتضح مرجعه من السياق.
- source_word: σου
  choice: عليك
  rationale: مع فعل الشهادة المضادة، يدل الضمير على أن الشهادة موجّهة ضد المخاطَب في سياق قضائي.
- source_word: καταμαρτυροῦσιν
  choice: يشهد به ... عليك
  rationale: يحافظ على الدلالة القضائية للشهادة ضد المتهم وعلى زمن المضارع، ولا يختزل المعنى في فعل «يتهم» الأكثر تفسيرًا.
theological_decisions: []
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. استُخدمت صياغة طبيعية للسؤالين مع الحفاظ على التوتر القضائي، وتُرك اسم الإشارة «هؤلاء» كما في الأصل لأن هوية الشهود ظاهرة من السياق.
