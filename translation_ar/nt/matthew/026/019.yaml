base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: ar
  text: وفعل التلاميذ كما أمرهم يسوع، وأعدّوا الفصح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عشاء الفصح»؛ فقد تشير كلمة «الفصح» إلى الاحتفال بالفصح بمعناه الأوسع، بما في ذلك عشاء الفصح.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: فعل
  rationale: ينقل الفعل العام «يفعل»، ومع أداة المطابقة ὡς يؤدي طبيعيًا معنى تنفيذ ما أُمروا به.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: المقابل العربي المألوف في الأناجيل، ويحفظ معنى أتباع يسوع الذين يتعلمون منه.
- source_word: ὡς
  choice: كما
  rationale: 'تفيد المطابقة في الكيفية: فعلوا على النحو الذي أمرهم به يسوع.'
- source_word: συνέταξεν
  choice: أمرهم
  rationale: الفعل يدل على إصدار توجيه ذي سلطة أو أمر؛ و«أمرهم» موجز وطبيعي في السياق ولا يضيف قسوة غير لازمة.
- source_word: ἡτοίμασαν
  choice: أعدّوا
  rationale: مقابل عربي مباشر وطبيعي لمعنى التجهيز والإعداد.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: يحفظ اتساع اللفظ اليوناني، الذي قد يدل على عيد الفصح أو شعيرته وما يتصل بها، بما في ذلك عشاء الفصح، من غير تضييق المعنى في المتن.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية القياسية للاسم في سياق العهد الجديد.
theological_decisions:
- issue: مدى دلالة τὸ πάσχα
  choice: الفصح
  alternative: عشاء الفصح أو ذبيحة الفصح
  rationale: قد يشير اللفظ بحسب السياق إلى العيد أو العشاء أو الذبيحة المرتبطة به. والسياق هنا يتعلق بإعداد العشاء، لكن اليونانية لا تحصر الدلالة صراحة في العشاء أو الذبيحة؛ لذلك أُبقي اللفظ الأوسع في المتن، مع بيان الاحتمال السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُخدم «فعل... كما أمرهم» للمحافظة على بنية المطابقة في الأصل، و«الفصح» للمحافظة على الغموض الدلالي الحقيقي دون زيادة تفسيرية في المتن.
