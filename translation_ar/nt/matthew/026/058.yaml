base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: ar
  text: أَمَّا بُطْرُسُ فَكَانَ يَتْبَعُهُ مِنْ بَعِيدٍ إِلَى سَاحَةِ دَارِ رَئِيسِ الْكَهَنَةِ، وَبَعْدَ أَنْ دَخَلَ إِلَى الدَّاخِلِ، كَانَ جَالِسًا مَعَ الأَعْوَانِ[a] لِيَرَى النِّهَايَةَ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الخدم» أو «الموظفين التابعين». تشير الكلمة اليونانية إلى أشخاص يؤدّون خدمة أو مهمة تابعة، ويتحدد معناها الأدق بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ليرى النتيجة» أو «كيف ستنتهي الأمور». اللفظ اليوناني يعني حرفيًّا «النهاية»، وقد يشير هنا إلى مآل الأحداث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: كان يتبعه
  rationale: ينقل صيغة الماضي الناقص اليونانية بوصفها فعلًا مستمرًّا في خلفية الأحداث.
- source_word: ἀπὸ μακρόθεν
  choice: من بعيد
  rationale: تعبير عربي طبيعي يحفظ معنى المسافة الجسدية.
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: حتى دار رئيس الكهنة
  rationale: تفيد ἕως بلوغ الحد، ويمكن أن تدل αὐλή هنا على الدار ذات الساحة الداخلية؛ وتأتي الإشارة إلى الدخول إلى الساحة في العبارة التالية.
- source_word: εἰσελθὼν ἔσω
  choice: ثم دخل إلى الساحة
  rationale: يحفظ ترتيب الحدث السابق للجلوس، ويجعل المقصود بالدخول واضحًا في العربية ضمن سياق دار رئيس الكهنة.
- source_word: ἐκάθητο
  choice: جلس
  rationale: صياغة عربية طبيعية للسرد؛ والفعل اليوناني ماضٍ ناقص ويمكن أن يدل على بقائه جالسًا، لكن العربية لا تحتاج هنا إلى تركيب استمراري ثقيل.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: مع الحرس
  rationale: تشير الكلمة إلى أعوان أو خدم رسميين تابعين للسلطات، وفي سياق القبض والمحاكمة يلائم «الحرس»، مع إثبات البدائل في الحاشية.
- source_word: ἰδεῖν τὸ τέλος
  choice: ليرى ما ستؤول إليه الأمور
  rationale: يحفظ معنى غرض الجلوس، وينقل τέλος هنا بوصفه نهاية الحدث أو نتيجته بلغة عربية واضحة.
