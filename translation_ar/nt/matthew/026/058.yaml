  to: أَمَّا بُطْرُسُ فَكَانَ يَتْبَعُهُ مِنْ بَعِيدٍ إِلَى سَاحَةِ دَارِ رَئِيسِ الْكَهَنَةِ، وَبَعْدَ أَنْ دَخَلَ إِلَى الدَّاخِلِ، كَانَ جَالِسًا مَعَ الأَعْوَانِ[a] لِيَرَى النِّهَايَةَ.[b]
  rationale: 'عُدِّلت الترجمة لتتبع البنية المكانية والنحوية للأصل: بلغ بطرس ساحة دار رئيس الكهنة، ثم دخل إلى الداخل، وكان جالسًا مع التابعين بغرض رؤية النهاية. واستُبدل «الحرس» بـ«الأعوان» لتفادي التخصيص غير المتيقن، مع إبقاء البدائل المعجمية في الحاشية.'
