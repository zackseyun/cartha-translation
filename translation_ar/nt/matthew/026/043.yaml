  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: ar
  text: ثم جاء ثانيةً فوجدهم نائمين، لأن عيونهم كانت مثقلة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانت عيونهم ثقيلة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: جاء
  rationale: اسم فاعل ماضٍ مستعمل استعمالًا ظرفيًا قبل الفعل الرئيس؛ صيغته العربية فعلًا ماضيًا بعد «ثم» طبيعية وتحفظ تعاقب الحدثين.
- source_word: πάλιν
  choice: ثانيةً
  rationale: يدل على تكرار المجيء، و«ثانيةً» واضحة وموجزة في السياق السردي.
- source_word: εὗρεν
  choice: فوجدهم
  rationale: ينقل المعنى السردي المعتاد للفعل، وتربط الفاء العثور بالمجيء ربطًا طبيعيًا.
- source_word: καθεύδοντας
  choice: نائمين
  rationale: حال تصف وضعهم المستمر حين وجدهم؛ وهي الصياغة العربية الطبيعية.
- source_word: ἦσαν γὰρ
  choice: لأن ... كانت
  rationale: تنقل القوة التفسيرية لأداة γάρ، فتبيّن سبب نومهم.
- source_word: οἱ ὀφθαλμοὶ
  choice: عيونهم
  rationale: المقابل العربي المباشر والطبيعي للتركيب الإضافي اليوناني.
- source_word: βεβαρημένοι
  choice: مثقلة
  rationale: يحفظ دلالة اسم المفعول التام على حالة ناتجة مستمرة، ولا يختزل الصورة إلى مجرد النعاس.
theological_decisions: []
