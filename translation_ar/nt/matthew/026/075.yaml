base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: ar
  text: 'فتذكّر بطرس القول الذي كان يسوع قد قاله: «قبل أن يصيح ديك[a]، ستنكرني ثلاث مرات». ثم خرج إلى الخارج وبكى بمرارة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبل أن يصيح الديك». لا توجد أداة تعريف في اليونانية، ويمكن في العربية استعمال التنكير أو التعريف هنا للدلالة على صياح الديك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: تذكّر
  rationale: ينقل معنى رجوع القول إلى ذاكرة بطرس بعبارة عربية طبيعية، من غير تحميل صيغة الفعل دلالة سببية زائدة.
- source_word: ῥήματος
  choice: قول
  rationale: يدل هنا على كلام منطوق محدد، و«قول» أوضح في العربية من الترجمة الحرفية «كلمة» في هذا السياق.
- source_word: εἰρηκότος
  choice: قول يسوع
  rationale: تُستوعب دلالة الكلام السابق في الإضافة العربية الموجزة؛ فـ«قول يسوع» طبيعي ويحفظ نسبة القول إليه من غير تكرار ثقيل.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: قبل أن يصيح ديك
  rationale: تحويل المصدر اليوناني إلى جملة زمنية هو الأسلوب العربي الطبيعي، وتنكير «ديك» يعكس غياب أداة التعريف ويركز على حدوث الصياح لا على طائر معيّن.
- source_word: τρὶς
  choice: ثلاث مرات
  rationale: تعبير عربي معاصر واضح يحفظ العدد والتكرار.
- source_word: ἀπαρνήσῃ
  choice: ستنكرني
  rationale: «تنكرني» تنقل معنى إنكار الصلة بيسوع في السياق، وتحافظ على خطورة فعل بطرس من غير توسيع تفسيري.
- source_word: ἐξελθὼν ἔξω
  choice: خرج إلى الخارج
  rationale: يحفظ شيئًا من التوكيد المكاني في التركيب اليوناني «خرج خارجًا»، مع صياغة عربية مفهومة.
- source_word: ἔκλαυσεν πικρῶς
  choice: بكى بمرارة
  rationale: ينقل شدة الحزن والندم بعبارة عربية طبيعية ورصينة، من غير إضافة تفسير نفسي صريح.
theological_decisions:
- issue: ذكر يسوع باسمه وحده
  choice: يسوع
  alternative: الرب يسوع
  rationale: النص اليوناني يذكر Ἰησοῦ بلا لقب، لذلك لا يُضاف لقب مسياني أو تعبدي غير موجود في المصدر.
- issue: دلالة إنكار بطرس
  choice: ستنكرني
  alternative: ستتبرأ مني
  rationale: «تنكرني» أقرب إلى المقابل المباشر للفعل اليوناني وتحفظ اتساع دلالته، بينما «تتبرأ مني» قد تشدد معنى قطع الصلة بصورة تفسيرية أكبر.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «قول» بدل «كلمة» لأنه أنسب للكلام المنطوق، وحُفظت نبرة السرد الموجزة وشدة الخاتمة. وُضع مؤشر الحاشية [a] في المتن.
