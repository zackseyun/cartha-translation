revisions:
- from: 'فَلَمَّا رَأَى التَّلَامِيذُ ذَلِكَ، اسْتَاءُوا وَقَالُوا: «لِمَاذَا هَذَا الإِهْدَارُ؟»'
  to: 'فَلَمَّا رَأَى التَّلَامِيذُ ذَلِكَ، اسْتَنْكَرُوا وَقَالُوا: «لِمَاذَا هَذَا التَّبْذِيرُ؟»'
  rationale: 'راجعت النص اليوناني أولًا: ἰδόντες تُنقل زمنيًا بـ«فلما رأى ... ذلك»، و«ذلك» مفعول مفهوم من السياق؛ وδὲ تؤديها الفاء سرديًا. عُدّل «استاءوا» إلى «استنكروا» لتقوية دلالة ἠγανάκτησαν، و«الإهدار» إلى «التبذير» لملاءمة السياق والأسلوب العربي مع الحفاظ على كون العبارة اعتراضًا من التلاميذ. أضيفت حاشية اختيارية للمعنى الغائي في Εἰς τί، توافقًا مع مسار التدقيق الإنجليزي.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: رأى التلاميذ الفعل المفهوم من السياق، فاستنكروا ما عدّوه تبديدًا. لكن «رأى» مفرد مع فاعل جمع («التلاميذ») خطأ نحوي يخلّ بالبنية ولا يطابق الفعل اليوناني الجمع ἰδόντες.'
  naturalness: الصياغة فصيحة وواضحة عمومًا. يلزم تصحيح المطابقة إلى «رأى التلاميذ»؟ لا؛ الصواب «رأى التلاميذ» يمكن في الفصحى إذا تقدّم الفعل والفاعل ظاهرًا جمعًا غير عاقل فقط، أما «التلاميذ» فهو جمع عاقل، والأفصح والأوضح هنا «رأى التلاميذ» ما زال الفعل المفرد جائزًا في العربية الفصحى عند تقدمه على الفاعل الجمع، لذا لا يعد خطأ. ومع ذلك، «فلما رأى التلاميذ ذلك» سليمة. «استاءوا» أضعف قليلًا من ἠγανάκτησαν، الذي يدل على السخط/الاستنكار القوي؛ «استنكروا» أدق وأوضح في هذا السياق.
  terminology: «التلاميذ» مصطلح مألوف ودقيق. «هذا الإهدار» مفهوم، لكن «هذا التبذير» أو «هذا التضييع» أقرب إلى اعتراضهم على إضاعة مورد ثمين؛ «التبذير» قد يحمل إيحاءً أخلاقيًا مناسبًا لقولهم. والأصل يحتمل «الخسارة/التضييع»، فلا ينبغي تضييق المعنى إلى مصطلح إداري حديث مثل «الإهدار».
  issues:
  - severity: low
    issue: حدة الفعل «استاءوا»
    rationale: الفعل ἠγανάκτησαν أقوى من مجرد الاستياء، ويشير إلى سخط أو استنكار. «استنكروا» يحفظ القوة بصورة طبيعية.
  - severity: low
    issue: اختيار «الإهدار»
    rationale: هو مفهوم، لكنه ذو نبرة حديثة إدارية نسبيًا. «التبذير» أقرب في سياق الاعتراض على إتلاف/إنفاق الطيب، مع بقاءه حكمًا صادرًا عن التلاميذ.
  revised_text: 'فَلَمَّا رَأَى التَّلَامِيذُ ذَلِكَ، اسْتَنْكَرُوا وَقَالُوا: «لِمَاذَا هَذَا التَّبْذِيرُ؟»'
  revised_footnotes:
