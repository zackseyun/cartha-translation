  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: ar
  text: 'فَلَمَّا رَأَى التَّلَامِيذُ ذَلِكَ، اسْتَنْكَرُوا وَقَالُوا: «لِمَاذَا هَذَا التَّبْذِيرُ؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: فَلَمَّا رَأَى ... ذَلِكَ
  rationale: 'صيغ اسم الفاعل الماضي هنا بعلاقة زمنية طبيعية في العربية: «فلما رأى». وأضيف اسم الإشارة «ذلك» مفعولًا به يعود إلى فعل المرأة المذكور في السياق، مع أن اليونانية تترك المفعول مفهومًا ضمنًا.'
- source_word: δὲ
  choice: فَـ
  rationale: تدل الأداة على انتقال سردي فيه شيء من المقابلة مع الفعل السابق؛ وتنقل الفاء هذا التحول بسلاسة في العربية من غير تشديد زائد للمقابلة.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: هو المقابل العربي المألوف والدقيق في سياق الأناجيل، من غير إضافة «تلاميذه» لأن ضمير الملكية غير مذكور صراحة في النص اليوناني.
- source_word: ἠγανάκτησαν
  choice: استاءوا
  rationale: ينقل الفعل معنى السخط والاستنكار الشديدين بلغة عربية واضحة وطبيعية، من غير حصره في الغضب وحده.
- source_word: λέγοντες
  choice: وقالوا
  rationale: تحويل اسم الفاعل إلى فعل معطوف أسلوب عربي طبيعي يحافظ على اقتران الكلام باستيائهم.
- source_word: Εἰς τί
  choice: لماذا
  rationale: تؤدي العبارة الاستفهامية معنى «لأي غرض؟» أو «لأي غاية؟»؛ و«لماذا» هي الصياغة العربية الأوجز والأكثر طبيعية هنا.
- source_word: ἡ ἀπώλεια αὕτη
  choice: هذا الإهدار
  rationale: مع أن ἀπώλεια قد تعني الهلاك أو الخسارة، فهي في سياق سكب الطيب الثمين تشير إلى ما عدّه التلاميذ تبديدًا أو إهدارًا؛ و«الإهدار» واضح ويحافظ على نبرة حكمهم السلبي.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «استاءوا» للتعبير عن السخط والاستنكار، و«الإهدار» للدلالة السياقية على عدّ الفعل تبديدًا. لا تستلزم الآية حاشية، لأن البديل «لأي غرض هذا الإهدار؟» لا يضيف غموضًا جوهريًا لا تحمله «لماذا».
