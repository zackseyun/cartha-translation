  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: ar
  text: 'قالا: «هذا الرجل قال: أستطيع أن أهدم هيكل الله[a]، وأن أبنيه في ثلاثة أيام[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يربط يوحنا 2:19–21 قول يسوع عن الهيكل بجسده.
    reason: cross_reference
  - marker: b
    text: 'أو: «في غضون ثلاثة أيام». يمكن أن تدل العبارة اليونانية على إتمام الفعل خلال هذه المدة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν
  choice: قالا
  rationale: الفعل اليوناني جمع، وسياق المحاكمة يحدّد المتكلمين بالشاهدين المذكورين قبل ذلك؛ لذلك يستعمل العربية المثنّى الطبيعي.
- source_word: Οὗτος
  choice: هذا الرجل
  rationale: يحفظ قوة الإشارة في كلام الاتهام بصياغة عربية طبيعية، من غير إضافة حكم غير موجود في النص.
- source_word: ἔφη
  choice: قال
  rationale: ينقل فعل القول ببساطة ولا يضيف معنى الادعاء أو التصريح المشدّد.
- source_word: Δύναμαι
  choice: أستطيع
  rationale: يعبّر بوضوح عن القدرة، وهو المقابل العربي الطبيعي في هذا الاقتباس.
- source_word: καταλῦσαι
  choice: أن أهدم
  rationale: في سياق البناء، يدل الفعل على هدم المبنى، وهو أدق وأطبع من تعبير عام مثل «أدمّر».
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: هيكل الله
  rationale: «هيكل» هو التعبير العربي المألوف عن الناوس في سياق هيكل أورشليم، ويحفظ الإضافة إلى الله.
- source_word: διὰ τριῶν ἡμερῶν
  choice: في ثلاثة أيام
  rationale: تفيد العبارة اليونانية إتمام الفعل عبر هذه المدة أو في غضونها؛ والصياغة المختارة طبيعية مع إبقاء البديل التفسيري في الحاشية.
- source_word: οἰκοδομῆσαι
  choice: أن أبنيه
  rationale: يُفهم مفعول الفعل من «الهيكل»، وإظهار الضمير في العربية يمنع اللبس من غير تحويل الفعل صراحة إلى «أعيد بناءه».
theological_decisions:
- issue: مرجع «هيكل الله» في شهادة الاتهام
  choice: تُترجم الشهادة بحسب ظاهرها عن الهيكل، مع وضع صلة يوحنا 2:19–21 في حاشية.
  alternative: جعل الإشارة إلى جسد يسوع وقيامته تتحكم في صياغة المتن.
  rationale: يعرض متى هنا كلام الشاهدين في المحاكمة؛ فلا ينبغي أن تحسم الترجمة في المتن مدى دقة شهادتهما أو أن تدمج تفسير يوحنا في ألفاظ الاتهام.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل المثنّى تبعًا لسياق الشاهدين، وحُفظ أسلوب الاقتباس داخل الاتهام من غير تشديد جدلي زائد.
