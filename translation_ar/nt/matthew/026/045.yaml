source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ar
  text: 'ثم يأتي إلى التلاميذ ويقول لهم[a]: «ناموا الآن واستريحوا. ها قد اقتربت الساعة[b]، وابن الإنسان يُسلَّم[c] إلى أيدي الخطاة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أما زلتم نائمين ومستريحين؟» يمكن فهم العبارة اليونانية استفهامًا بلاغيًا، وقد تحمل نبرة مفارقة.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «قد حانت الساعة» أو «الساعة قريبة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يُخان». والفعل اليوناني أوسع معنى، ويفيد «يُسلَّم» أو «يُدفع إلى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: أداة ربط زمنية طبيعية تفيد تتابع الأحداث.
- source_word: ἔρχεται
  choice: يأتي
  rationale: يحافظ على المضارع التاريخي الذي يضفي حيوية على السرد.
- source_word: πρὸς τοὺς μαθητάς
  choice: إلى التلاميذ
  rationale: تعبير عربي طبيعي عن التوجه والاقتراب نحوهم.
- source_word: λέγει αὐτοῖς
  choice: يقول لهم
  rationale: يحافظ على المضارع التاريخي ويؤدي المعنى مباشرة.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: ناموا الآن واستريحوا
  rationale: يحافظ على الصيغة الظاهرة بوصفها أمرًا ذا نبرة محتملة من المفارقة أو التسليم، مع بيان القراءة الاستفهامية الممكنة في الحاشية.
- source_word: ἰδοὺ
  choice: ها
  rationale: أداة تنبيه عربية معاصرة وموجزة تلائم جدية الإعلان.
- source_word: ἤγγικεν ἡ ὥρα
  choice: قد اقتربت الساعة
  rationale: ينقل دلالة التمام في الفعل اليوناني وحالة القرب القائمة، من غير حصرها في معنى الوصول التام.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: اللقب المستقر والمهم سياقيًا، ويُترجم دون إعادة صياغة تفسيرية.
- source_word: παραδίδοται
  choice: يُسلَّم
  rationale: يحفظ المعنى الأوسع للفعل، فلا يضيقه إلى الخيانة وحدها، كما يحافظ على المبني للمجهول.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: إلى أيدي الخطاة
  rationale: يحافظ على الصورة الملموسة في اليونانية، وهي واضحة وطبيعية بالعربية.
theological_decisions:
- issue: دلالة «Καθεύδετε ... καὶ ἀναπαύεσθε»
  choice: «ناموا الآن واستريحوا» مع إبقاء احتمال المفارقة أو التسليم
  alternative: «أما زلتم نائمين ومستريحين؟»
  rationale: تسمح العبارة اليونانية بقراءتها قولًا ذا قوة أمرية أو استفهامًا بلاغيًا في السياق. يحافظ المتن على صورتها اللفظية وتوترها مع الإعلان التالي، وتوضح الحاشية القراءة البديلة.
- issue: معنى «παραδίδοται» في سياق الآلام
  choice: «يُسلَّم»
  alternative: «يُخان» أو «يُدفع»
  rationale: «يُسلَّم» يحفظ اتساع الدلالة ليشمل فعل الخيانة والتسليم إلى السلطة، من غير فرض تفسير لاهوتي أضيق.
