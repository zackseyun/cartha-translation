  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على المضارع التاريخي، وعلى التوتر المقصود في العبارة الأولى، وعلى المعنى الواسع لفعل التسليم. وُضعت علامات الحواشي بجوار العبارات التي تشرحها.
