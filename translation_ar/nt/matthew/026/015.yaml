  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: ar
  text: 'قال: «ماذا أنتم مستعدون أن تعطوني، وأنا أسلّمه إليكم؟»[a] فدفعوا له ثلاثين قطعة من الفضة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخونه إليكم». يمكن للفعل اليوناني أن يعني «يُسلِّم» أو «يدفع إلى»، وفي هذا السياق «يخون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: ماذا تريدون أن تعطوني
  rationale: ينقل معنى الإرادة في θέλω نقلًا مباشرًا وطبيعيًا في سياق المساومة، من غير إضافة معنى غير مصرح به.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: وأنا أسلّمه إليكم
  rationale: «أسلّمه» يحفظ المدى الأوسع للفعل παραδίδωμι، أي التسليم أو الدفع إلى يد شخص، من غير إدخال الحكم الأخلاقي الكامن في «أخونه» داخل المتن.
- source_word: οἱ δὲ
  choice: فـ
  rationale: الفاء تلائم تتابع القول والجواب في السرد العربي، ولا تبالغ في إفادة التعارض الذي لا تقتضيه δέ هنا.
- source_word: ἔστησαν αὐτῷ
  choice: دفعوا له
  rationale: الفعل في هذا السياق يدل على تحديد المال أو تقديمه له. «دفعوا له» عربية واضحة وطبيعية، وتتجنب الجزم بأن القطع وُزنت فعليًا، وهو أمر لا يصرح به اللفظ اليوناني وحده.
- source_word: τριάκοντα ἀργύρια
  choice: ثلاثين قطعة من الفضة
  rationale: يحفظ مادة النقود وعددها من غير تعيين فئة نقدية لا يذكرها النص.
theological_decisions:
- issue: دلالة παραδώσω في عرض يهوذا
  choice: أسلّمه
  alternative: أخونه / أدفعه إليكم
  rationale: يحافظ «أسلّمه» على السعة المعجمية للفعل؛ أما معنى الخيانة فصحيح سياقيًا، لكنه يصرح بالتقييم الأخلاقي أكثر مما يفعله اللفظ نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم ترتيب طبيعي في الحوار، مع إبقاء صيغة المساومة وصراحة عرض التسليم. وُضعت علامة الحاشية بعد عبارة «ثلاثين قطعة من الفضة» التي تشرحها.
