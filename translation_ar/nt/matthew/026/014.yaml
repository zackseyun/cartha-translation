lexical_decisions:
- source_word: Τότε
  choice: حينئذٍ
  rationale: أداة زمنية تربط الحدث بما سبقه وتقدّم تسلسل السرد بعبارة عربية فصيحة وطبيعية.
- source_word: πορευθεὶς
  choice: ذهب
  rationale: اسم فاعل فعلي يفيد الحركة نحو رؤساء الكهنة؛ وصيغة الفعل الماضي هي الأنسب للسرد العربي من الترجمة الحرفية الثقيلة «إذ مضى».
- source_word: εἷς τῶν δώδεκα
  choice: واحد من الاثني عشر
  rationale: يحفظ التعبير التبعيضي في اليونانية من غير إضافة تفسيرية، مع إبقاء احتمال فهم العدد بوصفه تسمية للجماعة في الحاشية.
- source_word: ὁ λεγόμενος
  choice: وهو المدعو
  rationale: يحفظ وظيفة العبارة الوصفية الاعتراضية التي تعيّن هوية يهوذا، بصياغة عربية واضحة.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: يهوذا الإسخريوطي
  rationale: نقل للاسم واللقب وفق الصيغة العربية الكتابية الشائعة.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: إلى رؤساء الكهنة
  rationale: تفيد πρός مع النصب الاتجاه نحو جهة، و«رؤساء الكهنة» هو المقابل العربي المألوف للسلطات الكهنوتية العليا المشار إليها بصيغة الجمع.
theological_decisions:
- issue: دلالة التعبير τῶν δώδεκα بوصفه عددًا أو لقبًا للجماعة
  choice: واحد من الاثني عشر
  alternative: واحد من جماعة الاثني عشر
  rationale: الصياغة المختارة أقرب إلى بنية الأصل ولا تفرض تحويل العدد إلى لقب صريح، فيما توضّح الحاشية القراءة الجماعية الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «حينئذٍ» لحركة السرد، و«رؤساء الكهنة» للمصطلح التاريخي المألوف، مع تجنّب الصياغة الحرفية المتكلّفة.
