  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: ar
  text: 'لكنني أقول لكم: لن أشرب بعد الآن من هذا النتاج من الكرمة حتى ذلك اليوم، حين أشربه معكم جديدًا[a] في ملكوت أبي.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من جديد». قد تدل الصفة اليونانية على الجِدّة في النوع أو الصفة، وقد تفيد العبارة أن الشرب سيكون على نحو جديد في الملكوت الآتي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: لكنني أقول لكم
  rationale: تفيد δέ انتقالًا في الكلام مع مسحة خفيفة من الاستدراك؛ و«لكنني» واضحة وطبيعية من غير مبالغة في قوة التضاد.
- source_word: οὐ μὴ πίω
  choice: لن أشرب
  rationale: التركيب οὐ μή مع صيغة الاحتمال نفيٌ مستقبلي مؤكد. وتؤدي «لن» في العربية الفصحى نفي المستقبل بقوة ووضوح، من غير إضافة لفظ قد يوحي بنفي مطلق لا يراعي جملة «إلى ذلك اليوم».
- source_word: ἀπ’ ἄρτι
  choice: من الآن فصاعدًا
  rationale: تحدد العبارة ابتداء الامتناع من اللحظة الحاضرة واستمراره بعدها.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: من نتاج الكرمة هذا
  rationale: γένημα هو الناتج أو الثمر. وتحفظ الصياغة صورة الأصل بدل اختزالها في «الخمر»، مع بقاء الإشارة إلى محتوى الكأس مفهومة.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: إلى ذلك اليوم
  rationale: تحفظ اسم الإشارة الدال على يوم مستقبلي معيّن.
- source_word: ὅταν αὐτὸ πίνω
  choice: حين أشربه
  rationale: تشير العبارة إلى حدث مستقبل في وقته، والضمير يعود إلى نتاج الكرمة أو محتوى الكأس.
- source_word: καινὸν
  choice: جديدًا
  rationale: تحفظ اللفظة المعنى المباشر للجِدّة في النوع أو الصفة، مع بيان احتمال «من جديد» في الحاشية دون حسم الدلالة.
- source_word: μεθ’ ὑμῶν
  choice: معكم
  rationale: ترجمة مباشرة وطبيعية لمعنى المصاحبة.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: في ملكوت أبي
  rationale: صياغة عربية موجزة ومهيبة تحفظ تعبير يسوع «أبي».
theological_decisions:
- issue: هل يُصرَّح بمحتوى الكأس بلفظ «الخمر» أم تُحفظ صورة الأصل؟
  choice: الإبقاء على «نتاج الكرمة» في المتن
  alternative: الخمر
  rationale: النص اليوناني يقول «نتاج/ثمر الكرمة» ولا يستعمل οἶνος. وحفظ التعبير يمنع إضافة تحديد طقسي أو رمزي يتجاوز ألفاظ النص.
- issue: دلالة καινὸν في الوليمة الأخروية
  choice: «جديدًا» في المتن من غير تحديد نوع الجِدّة
  alternative: من جديد؛ على نحو جديد
  rationale: قد تعني الصفة الجِدّة في النوع أو الصفة، وقد تفيد تجدد فعل الشرب. ولأن السياق لا يحسم وجه الدلالة، حُفظت الصياغة المفتوحة ووُضع البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة. روعي ترتيب المعاني في الأصل قدر الإمكان، مع استعمال «من الآن فصاعدًا» للوضوح الزمني، وحُفظت صورة «نتاج الكرمة» ودلالة «جديدًا» المفتوحة.
