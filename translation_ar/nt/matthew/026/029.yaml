  verdict: revise
  source_fidelity: 'المعنى محفوظ إجمالًا: النفي المستقبلي المؤكد، والامتناع ابتداءً من الحاضر، والإشارة إلى «نتاج الكرمة»، واليوم المستقبلي المحدد، والشرب مع التلاميذ في ملكوت الآب. غير أن موضع اسم الإشارة في «نتاج الكرمة هذا» غير طبيعي في العربية المعاصرة وقد يثقل العلاقة التركيبية التي يقصدها اليوناني: «هذا النتاج من الكرمة».'
