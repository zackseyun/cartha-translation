  - severity: low
    issue: «إلى ذلك اليوم» أقل سلاسة بعد النفي المستمر
    rationale: «حتى ذلك اليوم» هو الربط الزمني العربي الأشيع والأوضح لـ ἕως في هذا السياق، من غير تغيير في المعنى.
