  terminology: «الكرمة»، و«ملكوت أبي»، و«جديدًا» ألفاظ مناسبة للنبرة الكتابية الفصحى. أُبقي «نتاج» بدل «الخمر» التزامًا بلفظ γένημα وبترك الصورة الأصلية دون تخصيص.
