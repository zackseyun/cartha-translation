source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: ar
  text: 'قال له يسوع: «الحق أقول لك: في هذه الليلة نفسها، قبل أن يصيح ديك، ستنكرني ثلاث مرات».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: قال له يسوع
  rationale: صياغة سردية عربية طبيعية تحفظ الفعل البسيط والمخاطَب من غير زيادة في القوة الدلالية.
- source_word: Ἀμὴν λέγω σοι
  choice: الحق أقول لك
  rationale: تعبير عربي واضح ومهيب ينقل صيغة التوكيد الرسمية التي يستهل بها يسوع قوله، من غير إبقاء اللفظ السامي على صورته المنقولة.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: في هذه الليلة نفسها
  rationale: يحفظ حرف الجر والإشارة المؤكدة في اليونانية، مع صياغة عربية طبيعية؛ و«نفسها» تُبرز التوكيد في ταύτῃ.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: قبل أن يصيح ديك
  rationale: ينقل تركيب المصدر اليوناني إلى جملة عربية سليمة. وورود ἀλέκτορα بلا أداة تعريف يجعل «ديك» غير المعرّفة اختيارًا مباشرًا.
- source_word: τρὶς
  choice: ثلاث مرات
  rationale: تعبير عربي حديث وواضح يطابق دلالة التكرار العددي.
- source_word: ἀπαρνήσῃ με
  choice: ستنكرني
  rationale: «تنكرني» تنقل معنى إنكار معرفة يسوع أو الصلة به في هذا السياق، وتحفظ صيغة المستقبل والخطاب المباشر بإيجاز.
theological_decisions:
- issue: صيغة الاستهلال Ἀμὴν λέγω σοι وسلطة قول يسوع
  choice: الحق أقول لك
  alternative: آمين أقول لك؛ أؤكد لك
  rationale: يحفظ الاختيار الجلال والتوكيد الذاتي في العبارة من غير تحميلها استعمالًا طقسيًا لاحقًا، ومن غير تحويلها إلى شرح تفسيري.
- issue: مدى دلالة ἀπαρνήσῃ على الإنكار
  choice: ستنكرني
  alternative: ستتبرأ مني
  rationale: «ستنكرني» أقرب إلى اللفظ وأوسع دلالة، فلا تحصر الفعل في صيغة تبرؤ رسمية، مع بقاء قوة النبوءة واضحة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على ترتيب المعنى والتوكيد في الأصل اليوناني. لا حاجة إلى حاشية؛ فصيغة «في هذه الليلة نفسها» تنقل التوكيد، و«ديك» تحفظ عدم التعريف الممكن في الأصل.
