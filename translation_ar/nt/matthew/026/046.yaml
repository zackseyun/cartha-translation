  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: ar
  text: قوموا، لنذهب. ها قد اقترب الذي يسلّمني[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الذي يسلّمني إلى أيدي خصومي؛ ويحمل التعبير هنا معنى الخيانة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: قوموا
  rationale: فعل أمر للجمع موجَّه إلى التلاميذ، و«قوموا» تعبير عربي مباشر وطبيعي في السياق.
- source_word: ἄγωμεν
  choice: لنذهب
  rationale: صيغة حثّ للمتكلم مع الجماعة، ويؤديها «لنذهب» بوضوح وإيجاز.
- source_word: ἰδού
  choice: ها
  rationale: أداة تنبيه تلفت النظر إلى التطور العاجل، و«ها» تحافظ على حيويتها دون أسلوب عتيق.
- source_word: ἤγγικεν
  choice: قد اقترب
  rationale: صيغة التام تدل على أن الاقتراب قد تحقق وصار ذا صلة حاضرة؛ و«قد اقترب» تنقل الحدث ونتيجته الطبيعية.
- source_word: ὁ παραδιδούς με
  choice: الذي يسلّمني
  rationale: 'اسم الفاعل المعرّف يصف الشخص بحسب فعله الجاري: تسليم يسوع إلى خصومه. يحافظ هذا التعبير على الصورة الملموسة في الأصل من غير أن يحصرها في التفسير السياقي «يخونني».'
theological_decisions:
- issue: ترجمة παραδιδούς في سياق الآلام
  choice: الذي يسلّمني
  alternative: خائني / الذي يخونني
  rationale: الفعل في الأصل يعني على نحو ملموس «يسلّم»، ويحمل في هذا السياق دلالة الخيانة. أُبقي الفعل الملموس في المتن حفاظًا على توتر المعنى بين فعل التسليم ودلالته الخيانية، مع بيان الدلالة السياقية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة عاجلة تناسب الخطاب المباشر. استُخدمت «ها قد» لإبراز التنبيه والاقتراب الوشيك، وتُجنب اللفظ الكنسي أو العتيق غير الضروري.
