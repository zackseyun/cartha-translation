base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: ar
  text: 'وتقدّم فورًا إلى يسوع وقال: «سلام لك[a]، يا معلّم»، وقبّله[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مرحبًا». واللفظ اليوناني تحية مألوفة، ومعناه الحرفي «افرح».'
    reason: lexical_alternative
  - marker: b
    text: 'قد يفيد الفعل اليوناني قبلة شديدة أو متكررة: «قبّله بحرارة» أو «قبّله مرارًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: فورًا
  rationale: تنقل معنى السرعة والمباشرة بعبارة عربية معاصرة واضحة، وتحافظ على إلحاح السرد.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: تقدّم إلى يسوع
  rationale: يعبّر عن اقتراب يهوذا من يسوع واتجاهه إليه، بصياغة عربية طبيعية تناسب اسم الفاعل اليوناني الدال على فعل سابق للفعل الرئيس.
- source_word: Χαῖρε
  choice: سلام لك
  rationale: الفعل هنا صيغة تحية مألوفة، لا أمر حرفي بالفرح. و«سلام لك» تحية عربية واضحة وكريمة الأسلوب، مع إثبات البديل في الحاشية.
- source_word: ῥαββί
  choice: يا معلّم
  rationale: ينقل معنى اللقب السامي الذي نقله النص اليوناني صوتيًا، ويتجنب في العربية التباس «رَبِّي» بمعنى «ربي/سيدي الإلهي».
- source_word: κατεφίλησεν
  choice: قبّله
  rationale: يحافظ على بساطة السرد، بينما قد تحمل صيغة الفعل معنى قبلة شديدة أو متكررة؛ لذلك أُثبت هذا الاحتمال في الحاشية دون فرضه في المتن.
theological_decisions:
- issue: دلالة التحية Χαῖρε
  choice: سلام لك
  alternative: 'مرحبًا؛ أو حرفيًا: افرح'
  rationale: السياق يدل على تحية اجتماعية معتادة لا على هتاف لاهوتي أو أمر مقصود بالفرح، مع إبقاء المفارقة الناشئة من خيانة يهوذا ضمن السرد نفسه.
- issue: قوة الفعل κατεφίλησεν
  choice: قبّله
  alternative: قبّله بحرارة؛ أو قبّله مرارًا
  rationale: قد تفيد السابقة في الفعل التكثيف أو التكرار، لكن مقدار هذه القوة غير محسوم. لذا يحافظ المتن على المعنى الأساسي وتعرض الحاشية الاحتمال الدلالي الأوسع.
- issue: نقل اللقب ῥαββί
  choice: يا معلّم
  alternative: يا رابي
  rationale: الترجمة الدلالية مفهومة طبيعيًا للقارئ العربي وتحفظ وظيفة اللقب، في حين أن النقل الصوتي أقل شيوعًا وقد تكون صيغة «رَبِّي» مضللة لاهوتيًا في العربية.
translation_notes:
  register: العربية فصحى حديثة واضحة وكريمة الأسلوب. استُعملت «فورًا» بدل تعبيرات تراثية مثل «للوقت»، وتُرجم اللقب بمعناه الوظيفي لتجنب الالتباس في العربية. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلقان بهما مباشرة.
