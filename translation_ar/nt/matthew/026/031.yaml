id: MAT.26.31
reference: Matthew 26:31
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: ar
  text: 'عندئذ يقول لهم يسوع: «ستتعثرون جميعًا بسببي[a] في هذه الليلة[b]، لأنه مكتوب: ”سأضرب الراعي[c]، فتتشتت خراف القطيع“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ستسقطون» أو «ستُدفَعون إلى التعثر». يشمل الفعل اليوناني معاني التعثر أو السقوط أو النفور؛ ويشير السياق هنا إلى أن التلاميذ سيتركون يسوع ويتفرقون عنه.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: «الليلة».'
    reason: lexical_alternative
  - marker: c
    text: اقتباس من زكريا 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: عندئذ
  rationale: تؤدي معنى الظرف الزمني الذي ينقل السرد إلى الحدث التالي بعبارة عربية واضحة وموجزة.
- source_word: λέγει
  choice: يقول
  rationale: أُبقي المضارع الحكائي اليوناني بصيغة المضارع لإظهار حيوية السرد من غير تغيير المعنى.
- source_word: Πάντες ὑμεῖς
  choice: جميعًا
  rationale: ورود الضمير في الفعل العربي مع «جميعًا» يحفظ توكيد أن الكلام يشمل التلاميذ كلهم.
- source_word: σκανδαλισθήσεσθε
  choice: ستتعثرون
  rationale: يحفظ مجال الصورة اليونانية ومعناها العلاقي، بينما يوضح السياق والحاشية أن المقصود هنا يصل إلى ترك يسوع والتفرق عنه.
- source_word: ἐν ἐμοὶ
  choice: بسببي
  rationale: ينقل الاستعمال السببي أو العلاقي للعبارة بوضوح، من دون أن يجعل يسوع نفسه موضع خطأ.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: في هذه الليلة
  rationale: صياغة مباشرة تحافظ على الإشارة الزمنية الكاملة في الأصل.
- source_word: γέγραπται γάρ
  choice: لأنه مكتوب
  rationale: الصيغة العربية المألوفة والدقيقة لإدخال اقتباس كتابي.
- source_word: Πατάξω τὸν ποιμένα
  choice: سأضرب الراعي
  rationale: ترجمة مباشرة تحفظ صورة الراعي ولا تزيد نتيجة مثل القتل أو الإسقاط ليست مصرّحًا بها في اللفظ نفسه.
- source_word: διασκορπισθήσονται
  choice: فتتشتت
  rationale: تنقل تفرق الخراف بلفظ عربي طبيعي؛ وبنية الفعل العربية تُبقي الحدث واقعًا عليها من غير تسمية فاعل التشتت.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: خراف القطيع
  rationale: تحفظ الاسمين الواردين في اليونانية، «الخراف» و«القطيع»، بدل اختزالهما إلى أحدهما.
theological_decisions:
- issue: مدى معنى σκανδαλισθήσεσθε في علاقة التلاميذ بيسوع
  choice: «ستتعثرون» مع حاشية تبين أن السياق يشير إلى تركهم يسوع والتفرق عنه
  alternative: «ستتركونني» أو «سترتدون» أو «ستستاؤون مني»
  rationale: «ستتعثرون» تحفظ اتساع اللفظ وصورته، والسياق النبوي يبين أن التعثر يتجسد في هجر التلاميذ ليسوع تلك الليلة، من غير تقرير أنه ارتداد نهائي أو مجرد استياء.
- issue: المضارع الحكائي في λέγει
  choice: «يقول»
  alternative: «قال»
  rationale: إبقاء المضارع يعكس النسيج السردي اليوناني، ولا يترتب عليه اختلاف عقائدي.
- issue: هوية الراعي في الاقتباس
  choice: إبقاء «الراعي» كما في الاقتباس من غير إضافة تفسير داخل المتن
  alternative: التصريح داخل النص بأن الراعي هو يسوع
  rationale: السياق يربط الاقتباس بيسوع، لكن المتن المقتبس نفسه يستخدم الصورة؛ لذلك تُحفظ الصورة والتوتر التفسيري من غير إضافة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. حُفظ المضارع الحكائي، وصورة التعثر، والتعبير الكامل «خراف القطيع»، مع تجنب ألفاظ مذهبية قد توحي بارتداد نهائي.
