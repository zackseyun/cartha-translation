  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: ar
  text: 'ثم جاء يسوع معهم إلى موضع يُسمّى جثسيماني، وقال للتلاميذ: «اجلسوا هنا إلى أن أذهب إلى هناك وأصلّي[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «اجلسوا هنا ريثما أذهب إلى هناك وأصلّي». تفيد العبارة اليونانية الانتظار إلى وقت ذهاب يسوع وصلاته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ثم
  rationale: أداة ربط زمنية طبيعية تتابع أحداث السرد من غير إطالة.
- source_word: ἔρχεται
  choice: جاء
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي، وهو الزمن الطبيعي للسرد العربي، مع بقاء تتابع الحدث واضحًا.
- source_word: μετ’ αὐτῶν
  choice: معهم
  rationale: ينقل معنى المصاحبة مباشرة.
- source_word: χωρίον
  choice: موضع
  rationale: لفظ عام لمكان أو قطعة أرض، ويحافظ على صياغة متى من غير إدخال وصف «بستان» الوارد في سياق آخر.
- source_word: λεγόμενον Γεθσημανί
  choice: يُسمّى جثسيماني
  rationale: صياغة عربية طبيعية لتسمية المكان، مع نقل الاسم الأعجمي صوتيًا.
- source_word: λέγει
  choice: وقال
  rationale: نُقل المضارع التاريخي بالماضي بما يلائم السرد العربي ويتسق مع «جاء».
- source_word: Καθίσατε αὐτοῦ
  choice: اجلسوا هنا
  rationale: أمر بسيط مباشر، و«هنا» تقابل ظرف المكان αὐτοῦ.
- source_word: ἕως οὗ
  choice: إلى أن
  rationale: يحافظ على الدلالة الزمنية الأساسية للعبارة اليونانية، وهو تعبير طبيعي في العربية.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: أذهب إلى هناك وأصلّي
  rationale: فُكّ التركيب الاشتقاقي إلى فعلين معطوفين طبيعيين في العربية، مع إبراز المقابلة المكانية بين «هنا» و«هناك».
theological_decisions:
- issue: طبيعة موضع جثسيماني
  choice: موضع
  alternative: بستان
  rationale: يذكر نص متى χωρίον، أي موضعًا أو قطعة أرض، ولا يصفه هنا بأنه بستان؛ لذلك لا يُستورد وصف إنجيل يوحنا إلى صياغة متى.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعمل الماضي بدل المضارع التاريخي اليوناني لأنه الأسلوب الأشيع والأطبع في السرد العربي، مع الحفاظ على ترتيب الأحداث. وُضع مؤشر الحاشية عند العبارة الزمنية التي تتناولها الحاشية.
