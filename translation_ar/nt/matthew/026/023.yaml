  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: ar
  text: 'فأجاب: «الذي غمس يده معي في الطبق[a]، فهو الذي سيخونني[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الوعاء».
    reason: lexical_alternative
  - marker: b
    text: أو «يسلّمني».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: هذا التركيب اليوناني، المتأثر بالأسلوب السامي، يؤدي معنى الجواب أو الرد؛ وصياغته بفعل واحد طبيعية وواضحة في العربية الحديثة.
- source_word: ἐμβάψας
  choice: غمس
  rationale: اسم الفاعل الأوريستي يشير إلى فعل تعريفي تام، و«غمس» ينقل المعنى المباشر بوضوح.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: ينقل معنى المصاحبة الذي تدل عليه μετά مع المضاف إليه.
- source_word: τὴν χεῖρα
  choice: يده
  rationale: تستعمل اليونانية أداة التعريف مع أعضاء الجسد حيث تلائم العربية الإضافة إلى الضمير.
- source_word: ἐν τῷ τρυβλίῳ
  choice: في الطبق
  rationale: تدل τρύβλιον على طبق أو وعاء يوضع فيه الطعام؛ و«الطبق» لفظ عربي حديث واضح، مع إثبات البديل في الحاشية.
- source_word: οὗτός
  choice: فهو الذي
  rationale: تحفظ هذه الصياغة قوة اسم الإشارة التوكيدية، ولا تختزله في ضمير عادي.
- source_word: παραδώσει
  choice: سيخونني
  rationale: في سياق آلام يسوع، يدل الفعل على تسليمه غدرًا؛ لذلك تنقل «سيخونني» القوة السياقية، مع إبقاء المعنى الحرفي الأوسع في الحاشية.
theological_decisions:
- issue: دلالة παραδίδωμι في سياق يهوذا
  choice: سيخونني
  alternative: سيسلّمني
  rationale: يمكن أن يعني الفعل «يسلّم» أو «يدفع إلى أيدي آخرين»، لكن السياق العلاقي والسردي هنا يبرز الغدر. تحافظ الحاشية على البديل الحرفي من غير أن تحسم التوتر المعجمي خفية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «فهو الذي» لإبراز التوكيد في οὗτός، ووُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تتعلقان بهما.
