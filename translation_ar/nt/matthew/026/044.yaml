  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: ar
  text: ثم تركهم ومضى من جديد، وصلّى للمرة الثالثة، قائلًا الكلام نفسه[a] مرة أخرى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القول نفسه» أو «الشيء نفسه». واليونانية: «القول نفسه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: تركهم
  rationale: ينقل اسم الفاعل الماضي الدال على ترك التلاميذ، بصياغة عربية سردية طبيعية من غير إغفال تسلسل الحدث.
- source_word: πάλιν ἀπελθὼν
  choice: ومضى من جديد
  rationale: يُفهم موضع πάλιν هنا على أنه يصف ذهاب يسوع المتكرر، وتحافظ العبارة على هذا التكرار بوضوح.
- source_word: προσηύξατο
  choice: وصلّى
  rationale: ترجمة مباشرة للفعل الدال على الصلاة، ملائمة للسياق السردي.
- source_word: ἐκ τρίτου
  choice: للمرة الثالثة
  rationale: التعبير اليوناني اصطلاح يدل على وقوع الفعل في مناسبة ثالثة.
- source_word: τὸν αὐτὸν λόγον
  choice: الكلام نفسه
  rationale: تحافظ «الكلام» على مفرد λόγον مع نقل معنى مضمون القول أو الصلاة بصورة عربية طبيعية، دون قصره على لفظة مفردة.
- source_word: εἰπὼν πάλιν
  choice: قائلًا ... مرة أخرى
  rationale: تحافظ الصياغة على اسم الفاعل وعلى πάλιν الثانية، فتُظهر أن مضمون الصلاة نفسه قيل مجددًا.
theological_decisions:
- issue: تكرار الصلاة وعبارتي πάλιν
  choice: إظهار أن يسوع مضى من جديد، ثم قال مضمون الصلاة نفسه مرة أخرى في صلاته الثالثة.
  alternative: حذف إحدى عبارتي التكرار لتخفيف الأسلوب، أو فهم πάλιν الأولى مع «تركهم».
  rationale: يحتوي النص اليوناني على موضعين لـπάλιν؛ وإثباتهما يحفظ تأكيد السرد على تكرر الذهاب والصلاة من غير إضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة؛ استُخدم «ثم» لتدفق السرد، وحُفظ التكرار المقصود رغم إمكان شعور القارئ بشيء من التوكيد الأسلوبي.
