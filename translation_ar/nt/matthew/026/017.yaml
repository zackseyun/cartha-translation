  to: 'وفي اليوم الأول من عيد الفطير[a]، جاء التلاميذ إلى يسوع قائلين: «أين تريد أن نُعِدَّ لك الفصح لتأكله[b]؟»'
  rationale: 'عُدّل ترتيب عناصر الشطر الأخير لتحسين العربية وإزالة أي التباس في المفعول، مع المحافظة على المعنى اليوناني: إعداد الفصح ليسوع لكي يأكله. ونُقلت علامة الحاشية (b) إلى «الفصح» بوصفها الكلمة التي تشرحها مباشرة، وصيغت الحاشية بصيغة بديل معجمي لا تفسير إلزامي.'
