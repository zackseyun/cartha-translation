review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص عناصر اليونانية الأساسية بأمانة: الظرف الزمني، واسم عيد الفطير، ومجيء التلاميذ إلى يسوع، وصيغة القول، وسؤال الإرادة، وكون الإعداد لأجل يسوع كي يأكل الفصح. غير أن ترتيب «نُعِدَّ لك لتأكل الفصح» يحاكي اليونانية على حساب وضوح التعلّق النحوي في العربية.'
  naturalness: العبارة الختامية مفهومة، لكنها أقل سلاسة في العربية الفصحى الحديثة وقد توهم بأن «الفصح» مفعول «تأكل» وحده مع بقاء مفعول «نُعِدّ» غير مذكور. تقديم «الفصح» مفعولًا لـ«نُعِدّ» ثم الإحالة إليه بضمير في «لتأكله» أوضح وأفصح.
  terminology: «عيد الفطير» و«الفصح» مصطلحان عربيان راسخان ومناسبان. وتحافظ الحاشية على إمكان أن يكون المقصود في السياق وجبة الفصح دون فرضه في المتن. كما أن الحاشية الزمنية لا تحسم مسألة التسلسل الزمني المتنازَع عليها.
  issues:
