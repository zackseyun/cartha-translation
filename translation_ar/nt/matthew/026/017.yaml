  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: ar
  text: 'وفي اليوم الأول من عيد الفطير[a]، جاء التلاميذ إلى يسوع قائلين: «أين تريد أن نُعِدَّ لك الفصح لتأكله[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تعبير «اليوم الأول من عيد الفطير» ينقل اللفظ اليوناني مباشرة؛ ولا ينبغي حسم المناقشات المتعلقة بالتسلسل الزمني للفصح بالترجمة وحدها.
    reason: cultural_note
  - marker: b
    text: 'أو، بتوضيح أكثر: «وجبة الفصح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: وفي اليوم الأول من عيد الفطير
  rationale: حرف δέ رابط خفيف يناسبه هنا «و»، والتركيب الدالي يفيد الزمن. أُضيفت كلمة «عيد» إيضاحًا طبيعيًا لأن «الفطير» في العربية اسم العيد اليهودي في هذا السياق، من غير تغيير للترتيب الزمني الذي يصرّح به اليوناني.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: جاء التلاميذ إلى يسوع
  rationale: ينقل الفعل معنى المجيء إلى شخص أو الاقتراب منه، وهذه الصياغة واضحة وطبيعية وتحافظ على «التلاميذ» دون إضافة ضمير ملكية غير مصرّح به.
- source_word: λέγοντες
  choice: قائلين
  rationale: تحافظ على صيغة اسم الفاعل وعلى تزامن القول مع المجيء، من غير تخصيص فعل الكلام بأنه سؤال رغم أن المقول استفهامي.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: أين تريد أن نُعِدَّ لك
  rationale: الفعل θέλω يدل على الإرادة أو الرغبة، وصيغة المتكلم الجمع الالتزامية تُنقل طبيعيًا بعد «تريد» بجملة «أن نُعِدَّ»، مع إبقاء σοι في «لك».
- source_word: φαγεῖν τὸ πάσχα
  choice: لتأكل الفصح
  rationale: المصدر يدل على الغرض من الإعداد، و«الفصح» ينقل πάσχα مباشرة. وفي سياق الأكل يشير إلى وجبة الفصح، مع إبقاء اللفظ الأوسع في المتن.
theological_decisions:
- issue: تعبير «اليوم الأول من عيد الفطير» وعلاقته بالتوقيت الزمني لوجبة الفصح
  choice: الإبقاء على التعبير الزمني كما يرد في اليونانية من غير مواءمة تفسيرية
  alternative: صياغته «اليوم السابق لعيد الفطير» أو «اليوم الأول من الفصح»
  rationale: النص اليوناني يقول صراحة «الأول من الفطير». وبما أن مناقشة التسلسل الزمني للفصح موضع بحث، فلا ينبغي للترجمة أن تحسمه بإعادة صياغة تفسيرية.
- issue: دلالة τὸ πάσχα بين العيد والوجبة
  choice: الفصح في المتن مع بيان «وجبة الفصح» في الحاشية
  alternative: وجبة الفصح في المتن
  rationale: سياق فعل الأكل يجعل الوجبة مرادة، لكن اللفظ اليوناني نفسه أوسع؛ لذلك تحفظ «الفصح» الصياغة الأصلية، وتوضح الحاشية المقصود السياقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «عيد الفطير» بوصفه التعبير العربي المألوف للفترة الاحتفالية، و«نُعِدَّ» لضبط القراءة ومنع التباس الفعل. وُضعت كل علامة حاشية عند العبارة التي تشرحها.
