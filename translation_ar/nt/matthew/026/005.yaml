    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: يحفظ صيغة الماضي الناقص دلالة الكلام المستمر أو المتكرر في أثناء التشاور.
- source_word: δέ
  choice: لكنهم
  rationale: تنقل أداة الربط انتقالًا ذا تباين خفيف مع التخطيط المذكور في السياق السابق.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: ليس في أثناء العيد
  rationale: تعبير موجز عن القرار بصيغة إضمارية، وتؤدي «في أثناء» المعنى الزمني لحرف الجر، بينما يلائم «العيد» سياق الفصح.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: تحفظ معنى الغاية المقصود منها تجنب النتيجة.
- source_word: θόρυβος
  choice: اضطراب
  rationale: يدل اللفظ على جلبة أو قلاقل عامة، و«اضطراب» لا يبالغ بحصر المعنى في شغب واسع النطاق.
- source_word: γένηται
  choice: يحدث
  rationale: ينقل معنى النشوء أو الوقوع بصورة عربية طبيعية.
- source_word: ἐν τῷ λαῷ
  choice: بين الشعب
  rationale: تعبير عربي طبيعي يحفظ الإشارة إلى عامة الناس المجتمعين، لا إلى جماعة مبهمة فحسب.
