reference: Matthew 26:64
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: ar
  text: 'فقال له يسوع: «أنت قلتَ[a]. لكني أقول لكم: من الآن سترون ابن الإنسان جالسًا عن يمين القدرة[b] وآتيًا على سحب السماء[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قلتَها أنت». والعبارة اليونانية جواب اصطلاحي يفيد الإقرار.'
    reason: lexical_alternative
  - marker: b
    text: «القدرة» كناية توقيرية عن الله.
    reason: cultural_note
  - marker: c
    text: في الكلام إشارة إلى دانيال 7:13 ومزمور 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: أنت قلت
  rationale: يحافظ على صيغة الجواب اليونانية التي تفيد الإقرار في السياق، من غير تحويلها إلى «نعم» صريحة تمحو أسلوب الأصل.
- source_word: πλὴν
  choice: لكن
  rationale: تنقل الانتقال الاستدراكي القوي إلى الإعلان التالي بلغة عربية طبيعية.
- source_word: ἀπ’ ἄρτι
  choice: من الآن
  rationale: تدل على ابتداء حالة جديدة من هذه النقطة فصاعدًا، من غير حصرها في اللحظة الآنية وحدها.
- source_word: ὄψεσθε
  choice: سترون
  rationale: المقابل المباشر والطبيعي لصيغة المستقبل، مع إبقاء المخاطبين بصيغة الجمع كما في اليونانية.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب الكتابي المتعارف عليه وصلته بدانيال 7.
- source_word: καθήμενον
  choice: جالسًا
  rationale: ترجمة مباشرة للنعت الحالي، ويفهم من السياق معنى الجلوس في مقام السلطان والتكريم.
- source_word: ἐκ δεξιῶν
  choice: عن يمين
  rationale: تعبير عربي كتابي واضح يدل على موضع الكرامة والسلطان.
- source_word: τῆς δυνάμεως
  choice: القدرة
  rationale: يحفظ الكناية التوقيرية في الأصل عن الله، بدل تفسيرها داخل المتن بلفظ «الله».
- source_word: ἐρχόμενον
  choice: آتيًا
  rationale: يحافظ على البنية الحالية الموازية لـ«جالسًا» وعلى صدى دانيال 7.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: على سحب السماء
  rationale: ينقل صورة الأصل بوضوح ويحفظ صداها النصي من دانيال 7:13.
theological_decisions:
- issue: قوة جواب يسوع Σὺ εἶπας لرئيس الكهنة
  choice: 'إقرار بصيغة غير مباشرة: «أنت قلت».'
  alternative: «نعم» الصريحة، أو اعتبار العبارة تهربًا من الجواب.
  rationale: العبارة إقرارية في سياقها، لكن إبقاء ألفاظها يحفظ الفرق بين الصيغة اليونانية والجواب المباشر «نعم».
- issue: مرجع «القدرة»
  choice: الإبقاء على الكناية التوقيرية عن الله بلفظ «القدرة».
  alternative: التصريح بـ«الله» أو استعمال «القدير».
  rationale: الأصل يستخدم اسمًا مجردًا معرفًا بوصفه كناية توقيرية؛ والتصريح بالمرجع يزيل تحفظ النص.
- issue: العلاقة الزمنية بين الجلوس عن اليمين والإتيان على السحب
  choice: الإبقاء على الصورتين معًا من غير فرض مخطط زمني واحد.
  alternative: حصر القول كله في المستقبل القريب، أو حصره كله في المجيء الثاني وحده.
  rationale: يجمع النص النعتين تحت فعل «سترون»، وتظل دلالته الزمنية والاسخاتولوجية موضع توتر مقصود ينبغي ألا تحسمه الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة. حُفظت التعابير الكتابية الأساسية «ابن الإنسان» و«عن يمين» و«سحب السماء»، مع تجنب الألفاظ القديمة غير اللازمة. وُضعت علامات الحواشي جميعها في المتن، ورُتبت قرب المواضع التي تشرحها.
