  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: ar
  text: حينئذ بصقوا في وجهه ولكموه، وآخرون لطموه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني ينقل السرد إلى الحدث التالي، و«حينئذ» فصيحة وواضحة وتحافظ على تتابع الأحداث.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: بصقوا في وجهه
  rationale: التعبير اليوناني يعني توجيه البصاق مباشرة إلى الوجه، و«بصقوا في وجهه» تعبير عربي طبيعي يحفظ شدة الإهانة.
- source_word: ἐκολάφισαν αὐτόν
  choice: لكموه
  rationale: الفعل يدل على الضرب بالقبضة؛ و«لكموه» ينقل طريقة الضرب بإيجاز ووضوح، بدل تعميمها إلى مجرد الضرب.
- source_word: οἱ δὲ ἐράπισαν
  choice: وآخرون لطموه
  rationale: أداة التعريف المستعملة اسميًا تدل على «آخرين»، والفعل يشير غالبًا إلى الضرب بالكف. أُضيف ضمير المفعول به بالعربية اعتمادًا على السياق، كما يقتضيه وضوح العبارة.
- source_word: δέ
  choice: و
  rationale: تفيد هنا انتقالًا خفيفًا إلى فاعلين آخرين وفعل آخر، لا مقابلة قوية؛ لذلك تلائمها الواو.
theological_decisions:
- issue: وصف الإساءة إلى يسوع أمام المجلس
  choice: 'نقل الأفعال بصورة حسية مباشرة: البصق في الوجه، واللكم، واللطم.'
  alternative: استعمال ألفاظ عامة مثل «أساؤوا معاملته» أو «ضربوه».
  rationale: يسرد النص صور الإذلال والاعتداء الجسدي بعبارات محددة؛ والمحافظة عليها تنقل قوة المشهد من غير إضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة، موجزة وكريمة النبرة. استُعمل «لكموه» للدلالة الصريحة على الضرب بالقبضات، و«لطموه» للضرب بالكف، مع الحفاظ على التمييز بين الفعلين في الأصل.
