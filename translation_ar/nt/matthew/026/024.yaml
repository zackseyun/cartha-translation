source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: ar
  text: إنَّ ابنَ الإنسان يمضي كما هو مكتوب عنه، ولكن الويل لذلك الرجل الذي على يده يُسلَّم ابن الإنسان[a]. لكان خيرًا لذلك الرجل لو أن ذلك الرجل لم يولد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُترجم: «يُخان». فالفعل اليوناني يعني في الأصل «يُسلَّم» أو «يُدفَع إلى أيدي آخرين»، وقد يدل في هذا السياق على الخيانة، إذ يشير السياق إلى خيانة يهوذا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: إنَّ ابنَ الإنسان
  rationale: يحفظ اللقب المعروف «ابن الإنسان»، وتؤدي «إنَّ» توكيد μὲν تمهيدًا للمقابلة مع δὲ من غير تكلّف.
- source_word: ὑπάγει
  choice: يمضي
  rationale: ينقل الفعل المضارع من غير حصر دلالته في الموت، مع بقاء هذا المعنى حاضرًا في السياق.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: كما هو مكتوب عنه
  rationale: صياغة عربية مألوفة تحفظ معنى الكتابة القائمة والمرجعية الكتابية، من غير تعيين نص بعينه.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ولكن الويل لذلك الرجل
  rationale: تحفظ المقابلة التي تفيدها δὲ والقوة النبوية والقضائية في οὐαί، مع إبقاء الإشارة المشددة إلى الرجل المعني.
- source_word: δι’ οὗ
  choice: الذي على يده
  rationale: تعبير عربي طبيعي يدل على الوساطة أو الفاعلية من غير أن يطمسها.
- source_word: παραδίδοται
  choice: يُسلَّم
  rationale: يحفظ المعنى الأوسع والأقرب حرفيًا للفعل، أي التسليم أو الدفع إلى أيدي آخرين، مع بيان دلالة الخيانة السياقية في الحاشية.
- source_word: καλὸν ἦν αὐτῷ
  choice: كان خيرًا لذلك الرجل
  rationale: ينقل التعبير الاصطلاحي بوصفه تفضيلًا ضمنيًا في جملة شرطية ممتنعة، وهو أفصح وأوضح عربيًا من «كان حسنًا له».
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: لو لم يُولَد
  rationale: «لو» تؤدي معنى الشرط الممتنع في السياق، والمبني للمجهول يحفظ صيغة الفعل اليوناني، بينما يمنع ذكر «ذلك الرجل» قبلها التباس مرجع الضمير.
theological_decisions:
- issue: العلاقة بين ما هو مكتوب ومسؤولية الخائن
  choice: 'إبقاء الجملتين متجاورتين: مضي ابن الإنسان وفق المكتوب، والويل للوسيط الذي يسلّمه.'
  alternative: صياغة تفسر المكتوب تفسيرًا جبريًا يلغي مسؤولية الخائن، أو صياغة تضعف تحقق المكتوب لصالح الفعل البشري وحده.
  rationale: النص يقرر الأمرين معًا ولا يحسم كيفية علاقتهما فلسفيًا؛ لذلك تُحفَظ حدة التوتر اللاهوتي من غير زيادة تفسيرية.
- issue: قوة القول عن عدم الولادة
  choice: 'صياغته حكمًا شديدًا: «كان خيرًا لذلك الرجل لو لم يُولَد».'
  alternative: اعتباره مجرد مبالغة بلاغية، أو تحويله إلى تقرير تفصيلي عن المصير الأخروي.
  rationale: تحفظ الترجمة جسامة القول، لكنها لا تستنبط منه عقيدة تفصيلية لا يصرح بها النص.
- issue: دلالة παραδίδοται
  choice: «يُسلَّم» في المتن، مع ذكر «يُخان» بوصفه دلالة سياقية في الحاشية.
  alternative: «يُخان» وحدها في المتن.
  rationale: «يُسلَّم» تصون اتساع اللفظ اليوناني وتسمح ببقاء التداخل بين فعل الخيانة وفعل التسليم، بينما يوضح الهامش أن خيانة يهوذا هي المقصودة سياقيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يمضي» بدل تعبير يفسر الفعل صراحة بالموت، و«على يده» لتأدية الوساطة بصورة طبيعية. وُضع مؤشر الحاشية مباشرة بعد الفعل محل البديل الدلالي.
