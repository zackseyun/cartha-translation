  terminology: «ابن الإنسان»، و«الويل»، و«المكتوب»، و«يُسلَّم» اختيارات مناسبة ومحايدة. و«على يده» تؤدي وساطة δι’ οὗ بصورة عربية طبيعية في هذا السياق. ينبغي أن تبقى الحاشية مقيّدة بأن «يُخان» بديل سياقي، لا المعنى الحرفي الوحيد.
