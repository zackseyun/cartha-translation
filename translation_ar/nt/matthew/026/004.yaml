lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: تشاوروا
  rationale: ينقل معنى تداول الرأي والتخطيط المشترك دون إضافة فاعل أو دافع غير مذكور في الآية.
- source_word: δόλῳ
  choice: بمكر
  rationale: يعبر عن الخداع والحيلة المقصودين في اللفظة اليونانية، وهو أوضح وأفصح هنا من ترجمة مكانية مثل «خلسة».
- source_word: κρατήσωσιν
  choice: يقبضوا على
  rationale: في هذا السياق تدل اللفظة على الإمساك بشخص واعتقاله، و«يقبضوا على» تعبير عربي طبيعي ودقيق.
- source_word: ἀποκτείνωσιν
  choice: يقتلوه
  rationale: ترجمة مباشرة واضحة للفعل، مع إبقاء الضمير عائدًا إلى يسوع.
theological_decisions:
- issue: دلالة ἵνα وعلاقتها بالتشاور
  choice: لكي
  alternative: أن
  rationale: 'يحافظ «لكي» على دلالة الغاية الصريحة في النص اليوناني: كان تشاورهم بغرض القبض على يسوع وقتله، من غير تسوية هذا التركيب إلى مجرد مفعول به.'
