  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: ar
  text: وفيما كان لا يزال يتكلم، إذا بيهوذا، واحد من الاثني عشر، قد جاء، ومعه جمع كبير يحمل سيوفًا وهراوات[a]، من عند رؤساء الكهنة وشيوخ الشعب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العصي». تدل الكلمة اليونانية حرفيًا على قطع من الخشب، ويُرجَّح أنها هنا عصي غليظة استُخدمت كهراوات.
    reason: lexical_alternative
  - marker: b
    text: 'أو «مرسل من رؤساء الكهنة وشيوخ الشعب». والنص اليوناني يقول حرفيًا: «من عند رؤساء الكهنة وشيوخ الشعب».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: وبينما كان لا يزال يتكلم
  rationale: ينقل التركيب المطلق الدال على تزامن الحدثين، ويحفظ معنى ἔτι بعبارة عربية طبيعية.
- source_word: ἰδοὺ
  choice: إذا
  rationale: تؤدي هنا وظيفة أداة المفاجأة السردية، فتحفظ حيوية المشهد من غير إضافة معنى «فجأة» على نحو صريح.
- source_word: Ἰούδας
  choice: يهوذا
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: εἷς τῶν δώδεκα
  choice: واحد من الاثني عشر
  rationale: ترجمة مباشرة للتركيب التبعي، من غير تحويل العدد إلى لقب صريح.
- source_word: ἦλθεν
  choice: قد جاء
  rationale: ينقل الفعل الماضي البسيط، وتساعد «قد» على إبراز وقوع الحدث بعد أداة المفاجأة.
- source_word: ὄχλος πολὺς
  choice: جمع كبير
  rationale: يحفظ الدلالة الكمية من غير تحميل كلمة ὄχλος معنى «رعاع» أو «غوغاء» الذي يزيد في وصف عدائية الجمع.
- source_word: μετὰ μαχαιρῶν
  choice: بالسيوف
  rationale: «السيوف» مقابل عربي واسع ومألوف لـ μάχαιραι في سياق القبض المسلح.
- source_word: καὶ ξύλων
  choice: والهراوات
  rationale: مع أن ξύλα تعني حرفيًا قطعًا من الخشب، فإن سياق الأسلحة يدل على عصي غليظة مستخدمة للضرب؛ و«الهراوات» توضح الوظيفة المقصودة.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: من عند رؤساء الكهنة وشيوخ الشعب
  rationale: تحفظ «من عند» دلالة المصدر في ἀπό من غير أن تضيف فعلًا صريحًا مثل «أرسل»، بينما يظل معنى التكليف مفهومًا من السياق.
theological_decisions:
- issue: هل يُصرَّح بأن الجمع أُرسل رسميًا من القيادات الدينية؟
  choice: من عند رؤساء الكهنة وشيوخ الشعب
  alternative: مرسل من رؤساء الكهنة وشيوخ الشعب
  rationale: يدل حرف الجر ἀπό على المصدر أو المنشأ، وقد يفهم من السياق وجود تكليف، لكن اليونانية لا تتضمن فعل إرسال؛ لذلك حُفظ قدر التعبير الأصلي من غير تقويته.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة سردية مهيبة. استُخدمت «إذا» للمفاجأة السردية، و«رؤساء الكهنة» و«شيوخ الشعب» للمصطلحين المؤسسيين المألوفين. وُضعت علامتا الحاشيتين عند العبارتين اللتين تتعلقان بهما مباشرة.
