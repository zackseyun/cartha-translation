  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: ar
  text: 'في تلك الساعة قال يسوع للجموع: «أخرجتم بسيوف وعصيّ لتلقوا القبض عليّ، كما لو كنتُ لصًّا[a]؟ كنت أجلس كل يوم في الهيكل أعلّم، ولم تمسكوا بي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قاطع طريق» أو «متمرّد». قد تدل الكلمة اليونانية على أكثر من لص عادي، ومنها اللص العنيف أو المتمرّد في بعض السياقات.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: في تلك الساعة
  rationale: ينقل العبارة الزمنية بصياغة عربية واضحة، ويحفظ ما في الأصل من تعيين للساعة والمباشرة.
- source_word: τοῖς ὄχλοις
  choice: للجموع
  rationale: يحفظ صيغة الجمع في الأصل، وهو تعبير فصيح ومفهوم في العربية المعاصرة.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: كأنكم خرجتم على لصّ
  rationale: يؤدي معنى معاملته كما يُعامل مجرم خطر، مع إبقاء اللفظ الرئيس واسعًا وعدم حصره في معنى سياسي بعينه.
- source_word: ἐξήλθατε
  choice: أخرجتم
  rationale: صيغة استفهامية عربية طبيعية تصف خروجهم لمواجهته في تلك اللحظة.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: بسيوف وعصيّ
  rationale: السيوف تقابل μάχαιραι، والعصيّ تنقل ξύλα هنا بوصفها أدوات للضرب أو القتال.
- source_word: συλλαβεῖν με
  choice: لتقبضوا عليّ
  rationale: القبض على شخص هو المقابل العربي الطبيعي في سياق الاعتقال.
- source_word: καθ’ ἡμέραν
  choice: كل يوم
  rationale: ينقل بوضوح المعنى التوزيعي، أي الفعل المتكرر يومًا بعد يوم.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: ἱερόν يدل على مجمّع الهيكل، لكن «في الهيكل» هو التعبير العربي المألوف ولا يوهم هنا دخوله إلى القدس الداخلي.
- source_word: ἐκαθεζόμην διδάσκων
  choice: كنت أجلس كل يوم في الهيكل أعلّم
  rationale: «كنت أجلس» يحفظ دلالة الاستمرار أو الاعتياد في صيغة الماضي الناقص، و«أعلّم» ينقل الفعل المصاحب.
- source_word: οὐκ ἐκρατήσατέ με
  choice: ولم تقبضوا عليّ
  rationale: يعطي المعنى السياقي الواضح، مع قبول تكرار «تقبضوا» في العربية لأن التكرار يخدم المقابلة بين الفرصة العلنية والفعل الليلي.
theological_decisions:
- issue: مدى دلالة λῃστής في سؤال يسوع
  choice: لصّ
  alternative: قاطع طريق أو متمرّد
  rationale: قد يدل اللفظ على لص عنيف أو قاطع طريق، وقد يحمل في بعض السياقات إيحاءً بالتمرد؛ لكن السياق هنا لا يوجب تضييق المعنى سياسيًا. لذلك اختير اللفظ الأوسع في المتن، وحُفظت البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على بنية السؤال التوبيخي وعلى الزمن الاستمراري في «كنت أجلس». وُضع مؤشر الحاشية [a] بعد «لصّ»، ومؤشر [b] في نهاية الآية لبيان الاختلاف النصي المتعلق بترتيب عبارة الجلوس والتعليم.
