  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: ar
  text: ولمّا وصل إلى الضفة الأخرى، إلى منطقة الجدريين[a]، لاقاه رجلان بهما شياطين، يخرجان من القبور، وكانا شرسين جدًا حتى إن أحدًا لم يكن يستطيع أن يمرّ عبر ذلك الطريق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «الجرجسيين» أو «الجراسيين» بدلًا من «الجدريين».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: ولمّا وصل
  rationale: نُقلت صيغة المضاف المطلق اليونانية إلى جملة زمنية عربية طبيعية، مع الحفاظ على تعاقب الأحداث.
- source_word: τὸ πέραν
  choice: الضفة الأخرى
  rationale: يدل التعبير في السياق على الجانب المقابل من البحيرة، و«الضفة الأخرى» أوضح في العربية من «الجانب الآخر».
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: كورة الجدريين
  rationale: «كورة» تدل على الإقليم أو الناحية، و«الجدريين» نقل عربي مألوف للنسبة إلى جَدَرة وفق قراءة SBLGNT.
- source_word: δύο δαιμονιζόμενοι
  choice: رجلان تسكنهما الشياطين
  rationale: ينقل العبارة بوضوح عربي مع إبقاء الفاعلية الشيطانية الشخصية، من غير استعمال مصطلح تقني مستحدث أو إضافة تفصيل لا يصرح به النص.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: خارجان من بين القبور
  rationale: ينقل معنى خروجهما من مواضع الدفن، وتفيد «من بين القبور» الارتباط بالمكان من غير إيحاء بأنهما كانا داخل قبر واحد.
- source_word: χαλεποὶ λίαν
  choice: شرسين جدًا
  rationale: «شرسين» تحفظ مجال معنى χαλεποί، الذي يشمل الشراسة والخطورة، من غير حصره في العنف الجسدي وحده؛ و«جدًا» تنقل λίαν.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: حتى لم يكن أحد يستطيع أن يمرّ
  rationale: تحافظ «حتى» على علاقة النتيجة، ويُفهم ἰσχύειν هنا بمعنى القدرة على الفعل.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: من ذلك الطريق
  rationale: استعمال «مرّ من الطريق» عربي طبيعي ويدل على اتخاذ الطريق مسارًا للعبور.
theological_decisions:
- issue: صياغة وصف التأثير الشيطاني
  choice: تسكنهما الشياطين
  alternative: ممسوسان بالشياطين / تحت سلطان الشياطين
  rationale: الصياغة المختارة واضحة للقارئ العربي وتثبت الحضور والسلطان الشيطانيين في سياق الرواية، من غير استيراد إطار مذهبي خاص.
- issue: اختلاف اسم الموضع في الشواهد النصية
  choice: الجدريين
  alternative: الجرجسيين / الجراسيين
  rationale: يتبع المتن قراءة Γαδαρηνῶν في SBLGNT، وتُذكر القراءات الأخرى في الحاشية حفاظًا على الاختلاف النصي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «كورة» لدقتها الجغرافية وشيوعها في الأسلوب الكتابي، مع تجنب التراكيب الحرفية الثقيلة.
