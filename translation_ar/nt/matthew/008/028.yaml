  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك وصول يسوع إلى الجانب الآخر، وقراءة «الجدريين»، وعدد الرجلين، وخروجهما من القبور، وشراستهما التي منعت الناس من سلوك الطريق. لكن «استقبله» أضعف من ὑπήντησαν («لاقياه/التقياه»)، و«من بين القبور» تزيد دلالة «بين» غير لازمة في ἐκ τῶν μνημείων.
  naturalness: الصياغة فصيحة في الجملة، لكن «لاقاه» أنسب من «استقبله» في سياق لقاء مفاجئ، و«يخرجان من القبور» أسلس وأدق من «خارجان من بين القبور». كما أن «منطقة» أوضح في الفصحى المعاصرة من «كورة».
  terminology: «الجدريين» تتبع قراءة النص اليوناني المعتمد، والحاشية تحفظ البدائل على نحو سليم. أما «تسكنهما الشياطين» فتعبير مفهوم، لكنه يوحي بالسكنى حرفيًا؛ «بهما شياطين» تعبير عربي كتابي مألوف ينقل وصف δαιμονιζόμενοι دون زيادة تفسيرية.
  issues:
  - severity: medium
    issue: «استقبله» بدل فعل اللقاء
    rationale: ὑπήντησαν αὐτῷ تعني «لاقياه/التقياه». وقد توحي «استقبله» بالترحيب أو الاستقبال المنظّم، وهو غير ظاهر في السياق.
  - severity: low
    issue: «من بين القبور»
    rationale: النص اليوناني يقول إنهما كانا خارجين «من القبور»؛ وإضافة «بين» ليست لازمة وقد تصف موضعهما بدل منشأ خروجهما.
  - severity: low
    issue: «تسكنهما الشياطين»
    rationale: يمكن أن تُفهم بوصفها سكنًا مكانيًا حرفيًا. التعبير «بهما شياطين» مألوف وواضح في العربية الكتابية، ويحافظ على الوصف من غير تضييق أو توسعة دلالية.
