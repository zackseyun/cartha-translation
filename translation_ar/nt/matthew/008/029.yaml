base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: ar
  text: 'وإذا بهما يصرخان قائلين: «ما لنا ولك[a]، يا ابن الله؟ أجئت إلى هنا قبل الموعد[b] لتعذِّبنا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ما لنا ولك؟» وهو تعبير يفيد هنا الاعتراض أو التنصل: «ما شأننا بك؟»'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا أن تُترجم: «قبل الوقت». واليونانية قد تشير إلى وقت محدد أو معيَّن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: وإذا بهما
  rationale: تنقل أداة لفت الانتباه والمفاجأة بصياغة عربية طبيعية، مع إظهار أن الفاعل هما الرجلان المذكوران في السياق السابق.
- source_word: ἔκραξαν λέγοντες
  choice: يصرخان قائلين
  rationale: يحفظ شدة الصوت في ἔκραξαν ويقابل اسم الفاعل λέγοντες صراحة.
- source_word: Τί ἡμῖν καὶ σοί
  choice: ما لنا ولك
  rationale: 'مقابل عربي موجز ومألوف للتعبير السامي الذي يفيد الاعتراض والتنصل: ما الشأن الذي يجمعنا بك؟'
- source_word: υἱὲ τοῦ θεοῦ
  choice: يا ابن الله
  rationale: ينقل لقب المخاطبة المسيحاني مباشرة دون توسيع أو تخفيف.
- source_word: ἦλθες ὧδε
  choice: أجئت إلى هنا
  rationale: يحفظ فعل المجيء ودلالة المكان في ὧδε ضمن سؤال عربي طبيعي.
- source_word: πρὸ καιροῦ
  choice: قبل الموعد
  rationale: يعبر عن زمن محدد أو ملائم، مع إبقاء احتمال كونه موعدًا إلهيًا دون التصريح بما لا يقوله النص.
- source_word: βασανίσαι
  choice: لتعذِّبنا
  rationale: ينقل معنى الإيلام الشديد والعذاب في سياق الدينونة بلفظ عربي واضح.
theological_decisions:
- issue: إقرار الأرواح بهوية يسوع
  choice: يا ابن الله
  alternative: يا ابنَ الإله
  rationale: الترجمة المباشرة تحفظ قوة اللقب في خطابها ليسوع دون إضافة تفسير عقائدي.
- issue: الدلالة الأخروية لعبارة πρὸ καιροῦ
  choice: قبل الموعد
  alternative: قبل الوقت
  rationale: «الموعد» يوحي بوقت محدد للدينونة كما يسمح السياق، مع إبقاء الجهة التي حددته ضمنية كما في اليونانية.
- issue: هوية المتكلمين بين الصيغة النحوية والسياق
  choice: بهما يصرخان
  alternative: صرخوا
  rationale: الفعل اليوناني جمع لأن الكلام يُنسب سياقيًا إلى الشياطين عبر الرجلين؛ والتثنية العربية تربط الآية طبيعيًا بالرجلين المذكورين، بينما ضمير المتكلمين الجمع داخل القول يحفظ تعدد الشياطين.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «وإذا بهما» بدل «وها» لتأدية المفاجأة طبيعيًا، وحُفظ التعبير «ما لنا ولك» لقربه من الأصل ولشيوعه العربي. وُضع كل مؤشر حاشية في المتن.
