  source_fidelity: 'المسودة أمينة في عناصرها الأساسية: «رجل مصاب بالبرص» تنقل λεπρός دون اختزال، و«يا رب» و«إن شئت» و«قادر أن تطهرني» تحافظ على المعنى اللاهوتي والطقسي للطلب. لكن «قد اقترب وسجد» تجعل الفعلين حدثين تامين متعاقبين، بينما يقدم النص اليوناني الاقتراب بالفعل التام/المنجز ثم يصور السجود بالفعل الناقص، أي فعلًا جارياً أو متصلاً في المشهد.'
