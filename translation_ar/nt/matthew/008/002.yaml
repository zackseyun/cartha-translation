  terminology: «البرص» و«تطهرني» مناسبان للسياق؛ إذ لا يختزلان καθαρίσαι في الشفاء العام. «سجد له» يحافظ على الفعل الجسدي وعلى المجال الدلالي المفتوح لـ προσκυνέω، ولا ينبغي استبداله في المتن بـ«عبده».
