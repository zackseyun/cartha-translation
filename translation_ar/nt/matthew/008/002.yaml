  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: ar
  text: 'وإذا برجلٍ مصابٍ بالبرص قد اقترب وأخذ يسجد له[a] قائلًا: «يا رب، إن شئت فأنت قادر أن تطهرني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني أيضًا: «عبده» أو «قدَّم له الإكرام»؛ فالفعل اليوناني قد يدل على السجود توقيرًا، أو تقديم الولاء والإكرام، أو العبادة، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: تنقل أداة لفت الانتباه وتضفي حيوية على السرد بصياغة عربية فصيحة طبيعية.
- source_word: λεπρὸς
  choice: رجل مصاب بالبرص
  rationale: ينقل الوصف المرضي من غير اختزال الشخص في علته، مع إبقاء المصطلح الكتابي التقليدي «البرص» الذي قد يشمل طيفًا من الأمراض الجلدية.
- source_word: προσελθὼν
  choice: اقترب
  rationale: يعبّر مباشرة عن دنو الرجل من يسوع، وهو أدق هنا من الاكتفاء بالفعل «جاء».
- source_word: προσεκύνει
  choice: سجد له
  rationale: يحفظ الفعل الجسدي الدال على التوقير من غير أن يحسم وحده هل المقصود عبادة بالمعنى الكامل أم إكرام وخضوع.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ مدى اللفظ اليوناني، من خطاب الاحترام والسلطان إلى دلالته المسيحانية المحتملة.
- source_word: ἐὰν θέλῃς
  choice: إن شئت
  rationale: صياغة عربية موجزة وطبيعية تحفظ تعليق الطلب على مشيئة يسوع.
- source_word: δύνασαί
  choice: فأنت قادر
  rationale: يبرز معنى القدرة صراحةً ويحفظ يقين المتكلم بقدرة يسوع.
- source_word: καθαρίσαι
  choice: أن تطهرني
  rationale: يحفظ دلالة التطهير الجسدي والطقسي المرتبطة بالبرص، بدل اختزالها في الشفاء العام.
theological_decisions:
- issue: دلالة προσκυνέω الموجَّه إلى يسوع
  choice: سجد له
  alternative: عبده؛ خرَّ له؛ قدَّم له الإكرام
  rationale: يمكن أن يدل الفعل على السجود توقيرًا أو تقديم الإكرام أو العبادة بحسب السياق. «سجد له» يحفظ الفعل المشهود وتوتره اللاهوتي من غير حسم زائد، وتوضح الحاشية المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «وإذا» للحيوية السردية، و«رجل مصاب بالبرص» لمراعاة الشخص مع حفظ المصطلح التقليدي، ووُضعت علامة الحاشية بعد «سجد له» لأنها تتعلق بدلالة προσκυνέω.
