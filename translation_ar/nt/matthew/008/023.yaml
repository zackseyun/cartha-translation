  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: ar
  text: ولمّا ركب القارب[a]، تبعه تلاميذه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قاربًا». لا ترد أداة تعريف مع كلمة «قارب» في اليونانية، لكن التعريف ملائم أيضًا للسياق السردي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: ولمّا ركب
  rationale: اسم فاعل ماضٍ في تركيب ذي دلالة زمنية، وفعل «ركب» هو التعبير العربي الطبيعي للصعود إلى قارب، و«لمّا» تُظهر أن هذا الفعل سبق الفعل الرئيس.
- source_word: πλοῖον
  choice: القارب
  rationale: يدل اللفظ على قارب أو سفينة؛ و«القارب» أنسب لسياق بحيرة الجليل. استُعمل التعريف وفق السياق السردي، مع إثبات احتمال التنكير في الحاشية لأن اليونانية لا تذكر أداة تعريف.
- source_word: ἠκολούθησαν
  choice: تبعه
  rationale: يحفظ المعنى الحركي المباشر لفعل الاتباع، ويُبقي في الوقت نفسه صداه المتصل بالتلمذة من غير شرح زائد.
- source_word: μαθηταὶ
  choice: تلاميذه
  rationale: «التلاميذ» هو المقابل العربي المألوف والدقيق للمصطلح الإنجيلي، والضمير ينقل αὐτοῦ.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: ضمائر مستترة وبارزة في «ركب... تبعه تلاميذه»
  rationale: تعود الضمائر كلها على يسوع بحسب السياق، وصيغتها العربية تتجنب التكرار الثقيل مع إبقاء الإحالة واضحة.
theological_decisions:
- issue: الإيحاء المحتمل بالتلمذة في ἀκολουθέω
  choice: تبعه
  alternative: ذهبوا معه
  rationale: «تبعه» يصف الحركة الفعلية ويحفظ أيضًا إيحاء التلمذة الممكن في استعمال متّى، من غير تحويل العبارة إلى تفسير لاهوتي صريح.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، بصياغة سردية طبيعية تحفظ ترتيب الحدث وإيحاء فعل الاتباع.
