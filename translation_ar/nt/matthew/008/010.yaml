  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعَ يَسُوعُ ذَلِكَ[a]، تَعَجَّبَ وَقَالَ لِلَّذِينَ كَانُوا يَتْبَعُونَهُ: «الْحَقَّ أَقُولُ لَكُمْ: لَمْ أَجِدْ عِنْدَ أَحَدٍ فِي إِسْرَائِيلَ إِيمَانًا عَظِيمًا كَهَذَا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«ذلك» مفهومة من السياق؛ واليونانية تقول حرفيًا: «ولما سمع يسوع» من غير مفعول به مذكور.'
    reason: implicit_object
  - marker: b
    text: 'ويمكن ترجمتها: «إيمانًا بهذا القدر» أو «مثل هذا الإيمان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: فَلَمَّا سَمِعَ يَسُوعُ ذَلِكَ
  rationale: حُوِّل اسم الفاعل اليوناني الدال على الظرف السابق للفعل الرئيس إلى جملة زمنية عربية طبيعية. وأُضيف «ذلك» لإيضاح أن المسموع هو كلام قائد المئة السابق، مع التنبيه إلى أن المفعول به مفهوم من السياق لا مذكور صراحة في اليونانية.
- source_word: ἐθαύμασεν
  choice: تَعَجَّبَ
  rationale: ينقل معنى الدهشة والإعجاب السردي نقلاً مباشرًا ومألوفًا في العربية، من غير إضافة تفسير لسبب التعجب أو لطبيعته.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: لِلَّذِينَ كَانُوا يَتْبَعُونَهُ
  rationale: يحافظ على كون العبارة وصفًا لمن كانوا يتبعون يسوع في ذلك الموقف، بدل تحويلها إلى لقب مؤسسي مثل «أتباعه».
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الْحَقَّ أَقُولُ لَكُمْ
  rationale: صيغة عربية واضحة ومهيبة تنقل التوكيد الاحتفالي في ἀμήν، مع إبقاء فعل القول وضمير المخاطبين.
- source_word: παρ’ οὐδενὶ
  choice: لَمْ أَجِدْ عِنْدَ أَحَدٍ
  rationale: تعبّر «عند أحد» عن وجود الصفة لدى شخص، ويؤدي النفي السابق معنى «عند لا أحد» بأسلوب عربي طبيعي.
- source_word: τοσαύτην πίστιν
  choice: إِيمَانًا عَظِيمًا كَهَذَا
  rationale: ينقل درجة الإيمان التي يشدد عليها اسم الإشارة الكمي τοσαύτην، مع استعمال «إيمان» مقابلاً مباشرًا لـ πίστις.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: فِي إِسْرَائِيلَ
  rationale: يحافظ على الصياغة المكانية/الجماعية المباشرة، ويمكن أن تشير «إسرائيل» في السياق إلى الشعب ضمن إطاره الجماعي.
- source_word: εὗρον
  choice: لَمْ أَجِدْ
  rationale: الماضي العربي هو المقابل المباشر للماضي اليوناني هنا، ويستقيم طبيعيًا مع النفي بـ«لم».
theological_decisions:
- issue: دلالة πίστις
  choice: إيمان
  alternative: ثقة
  rationale: السياق يبرز ثقة قائد المئة بسلطان يسوع، لكن «إيمان» يحفظ المصطلح الأوسع ولا يحصره في جانب نفسي واحد.
- issue: تعجُّب يسوع في ἐθαύμασεν
  choice: تَعَجَّبَ
  alternative: دُهِشَ
  rationale: أُبقي التعبير السردي كما هو من غير تفسير لاهوتي يخفف التعجب أو يحدّد علاقته بعلم يسوع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية مهيبة. استُخدمت جملة زمنية طبيعية، وحُفظت صيغة التوكيد وكثافة الحكم، مع تجنب تحويل «الذين كانوا يتبعونه» إلى لقب اصطلاحي.
