  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: ar
  text: 'لكي يتم ما قيل على لسان إشعياء النبي القائل: «هو نفسه أخذ أسقامنا وحمل أمراضنا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «أسقامنا»: «ضعفاتنا» أو «اعتلالاتنا». فاللفظة اليونانية قد تدل على الضعف أو الاعتلال أو المرض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: لكي يتم
  rationale: ينقل معنى الغاية/النتيجة وصيغة الإتمام المألوفة في اقتباسات متى بلغة عربية طبيعية.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: ما قيل على لسان إشعياء النبي
  rationale: «على لسان» تعبير عربي واضح يحفظ معنى الوساطة في διά مع المضاف إليه دون الإيحاء بأن إشعياء هو المصدر النهائي للكلام.
- source_word: λέγοντος
  choice: القائل
  rationale: يرتبط بإشعياء بوضوح ويدخل الاقتباس بإيجاز طبيعي.
- source_word: Αὐτὸς
  choice: هو نفسه
  rationale: يحفظ توكيد الضمير اليوناني.
- source_word: ἀσθενείας
  choice: أسقامنا
  rationale: السقم يدل على الاعتلال والمرض، ويلائم سياق الشفاء، مع إثبات اتساع اللفظة اليونانية في الحاشية.
- source_word: ἔλαβεν
  choice: أخذ
  rationale: ترجمة مباشرة للفعل، ولا تضيف معنى «أزال» ولا تدمجه في معنى الفعل التالي.
- source_word: νόσους
  choice: أمراضنا
  rationale: ترجمة دقيقة وطبيعية للفظ الدال بوضوح على المرض.
- source_word: ἐβάστασεν
  choice: حمل
  rationale: يحفظ معنى الحمل/التحمل، كما يبقي الصلة اللفظية والدلالية باقتباس إشعياء من غير حسم كيفية هذا الحمل.
theological_decisions:
- issue: دلالة اقتباس إشعياء 53:4 في سياق أعمال الشفاء
  choice: أسقامنا وحمل أمراضنا
  alternative: 'ضعفاتنا وحمل أمراضنا؛ أو: اعتلالاتنا وتحمّل أمراضنا'
  rationale: السياق المباشر في متى يتناول الشفاء الجسدي، ولذلك تعكس الصياغة الاعتلال والمرض. وفي الوقت نفسه لا تُفسَّر عبارة «حمل» على نحو يضيّق دلالتها إلى تصور لاهوتي بعينه، فتحفظ الصلة بإشعياء والتوتر التفسيري القائم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «على لسان» لإبراز الوساطة النبوية، و«هو نفسه» لحفظ التوكيد، مع إبقاء التوازي بين «أخذ» و«حمل». وُضع مؤشر الحاشية بعد الاقتباس لأنه يخص لفظة داخله.
