base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: ar
  text: وإذا بعاصفة شديدة[a] هبَّت في البحر، حتى راحت الأمواج تغطّي القارب[b]، أمّا هو فكان نائمًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني المترجم «عاصفة» يعني في كثير من المواضع «زلزالًا» أو «اهتزازًا»، لكنه يشير هنا، بحسب السياق، إلى اضطراب عنيف في البحر.
    reason: lexical_alternative
  - marker: b
    text: 'وبصياغة أقرب إلى البناء اليوناني: «حتى كان القارب يُغطّى بالأمواج».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: صيغة عربية فصيحة وطبيعية تسترعي الانتباه وتُبرز مباغتة الحدث من غير اللجوء إلى تعبير تراثي غامض.
- source_word: σεισμὸς μέγας
  choice: عاصفة شديدة
  rationale: مع أن σεισμός يدل غالبًا على الزلزال أو الاهتزاز، فإن سياق البحر والقارب والأمواج يشير هنا إلى اضطراب بحري عنيف؛ و«عاصفة شديدة» تنقل المعنى السياقي بوضوح.
- source_word: ἐγένετο ἐν τῇ θαλάσσῃ
  choice: هبَّت في البحر
  rationale: «هبَّت» تعبير عربي مألوف عن نشوء العاصفة، و«في البحر» يحافظ على لفظ المصدر من غير استبداله بـ«البحيرة».
- source_word: ὥστε
  choice: حتى
  rationale: تدل على النتيجة التي ترتبت على شدة العاصفة بأسلوب عربي موجز وطبيعي.
- source_word: τὸ πλοῖον
  choice: القارب
  rationale: يلائم نوع المركب وسياق بحر الجليل أكثر من «السفينة»، مع بقائه ضمن الدلالة الممكنة للفظ اليوناني.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: راحت الأمواج تغطّي القارب
  rationale: تحافظ «راحت... تغطّي» على استمرارية الفعل في صيغة المضارع المبني للمجهول اليونانية، مع تحويله إلى تركيب عربي طبيعي معلوم الفاعل.
- source_word: αὐτὸς δὲ ἐκάθευδεν
  choice: أمّا هو فكان نائمًا
  rationale: «أمّا هو» تُبرز المقابلة بين اضطراب البحر وحاله، و«كان نائمًا» تنقل استمرار الفعل الماضي.
theological_decisions:
- issue: طبيعة الحدث الذي يدل عليه σεισμός
  choice: ترجمته سياقيًا بـ«عاصفة»
  alternative: «زلزال» أو «اهتزاز»
  rationale: هذا قرار معجمي سياقي لا مذهبي؛ فذكر البحر والقارب والأمواج يدل على اضطراب بحري عنيف، مع بيان الدلالة الحرفية البديلة في الحاشية حفاظًا على خصوصية اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة باعتدال. استُخدم «وإذا بـ» للاحتفاظ بقوة أداة لفت الانتباه، وصيغت صورة الأمواج بأسلوب طبيعي يحافظ على استمرارية الحدث والمقابلة مع نوم يسوع.
