base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ar
  text: أَمَّا أَبْنَاءُ الْمَلَكُوتِ[a] فَسَيُلْقَوْنَ فِي الظُّلْمَةِ الْخَارِجِيَّةِ. هُنَاكَ سَيَكُونُ الْبُكَاءُ وَصَرِيرُ الْأَسْنَانِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أبناء الملكوت»، وهو تعبير عن الذين يُعَدّون من أهل الملكوت أو ممن يُتوقَّع أن يرثوه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: أَمَّا أَبْنَاءُ الْمَلَكُوتِ
  rationale: تحافظ «أبناء الملكوت» على الاستعارة اليونانية والمفارقة في وصف من كان يُتوقَّع انتماؤهم إلى الملكوت ثم يُستبعَدون منه. وتنقل صيغة «أمّا... فـ» المقابلة التي تفيدها δέ في السياق السابق.
- source_word: ἐκβληθήσονται
  choice: فَسَيُلْقَوْنَ
  rationale: صيغة مستقبل مبني للمجهول تنقل معنى الإخراج القسري بعبارة عربية واضحة وفصيحة، من غير تعيين الفاعل الذي لم يذكره النص صراحة.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: الظُّلْمَةِ الْخَارِجِيَّةِ
  rationale: تعبير قريب من تركيب اليونانية، مفهوم في العربية، ويحفظ صورة الظلمة الواقعة في الخارج بدل تحويلها إلى مصطلح عقائدي تفسيري.
- source_word: κλαυθμός
  choice: الْبُكَاءُ
  rationale: «البكاء» المقابل العربي المباشر والطبيعي، ويعبّر عن الحزن والألم من غير زيادة في درجة الشدة.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: صَرِيرُ الْأَسْنَانِ
  rationale: تعبير عربي راسخ ودقيق للصورة اليونانية، ويحفظ دلالتها الحسية من غير شرح تفسيري.
- source_word: ἐκεῖ
  choice: هُنَاكَ
  rationale: وضع الظرف في أول الجملة يحافظ على بروزه في اليونانية ويربط البكاء وصرير الأسنان بمكان الإقصاء المذكور.
theological_decisions:
- issue: صورة الإقصاء والدينونة
  choice: الإبقاء على صور الإلقاء في «الظلمة الخارجية» و«البكاء وصرير الأسنان» كما وردت
  alternative: استبدال الصور بتعبيرات تفسيرية مثل «جهنم» أو «العذاب الأبدي»
  rationale: يعرض النص دينونة وإقصاءً شديدين من خلال صور محددة، لكنه لا يستخدم هنا تلك المصطلحات العقائدية التفسيرية؛ لذا يحفظ النقلُ الصورَ والتوتر اللاهوتي من غير تجاوز ألفاظ الآية.
- issue: ترجمة υἱοὶ في التعبير الاصطلاحي
  choice: أبناء الملكوت
  alternative: أولاد الملكوت؛ ورثة الملكوت؛ أهل الملكوت
  rationale: «أبناء» تحافظ على الصورة المذكرة في اليونانية وعلى التعبير النسبي الذي يدل على من يُعَدّون منتمين إلى الملكوت أو مستحقين له، من غير أن تحصر المعنى في البنوة الجسدية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة. استُخدمت «أمّا... فـ» لإظهار المقابلة، وحُفظت الصور القضائية كما هي من غير إدخال مصطلحات عقائدية غير موجودة في اليونانية.
