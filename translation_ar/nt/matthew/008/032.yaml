  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: ar
  text: 'فقال لهم: «اذهبوا». فخرجوا ودخلوا في الخنازير. وإذا بالقطيع كله ينحدر مسرعًا على المنحدر الشديد[a] إلى البحر، فماتت الخنازير في المياه[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على الجرف». يمكن أن تدل الكلمة اليونانية على منحدر شديد، أو ضفة شديدة الانحدار، أو جرف.'
    reason: lexical_alternative
  - marker: b
    text: 'أو بحسب المعنى المستفاد من السياق: «فغرقت الخنازير في المياه». أما اليونانية فتقول حرفيًا: «ماتت في المياه».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: اذهبوا
  rationale: أمر موجز وطبيعي في العربية، يحفظ مباشرة قول يسوع من غير إضافة معنى مثل الطرد أو الإبعاد.
- source_word: ἐξελθόντες
  choice: فخرجوا
  rationale: ينقل فعل الخروج السابق للدخول، ويُفهم مرجعه من سياق الرواية من غير إقحام اسم الشياطين في النص.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: ودخلوا في الخنازير
  rationale: «دخلوا في» تعبير عربي واضح ينقل اتجاه الحركة إلى داخل الحيوانات، وهو أنسب سياقيًا من الترجمة الحرفية الجامدة «ذهبوا إلى».
- source_word: χοίρους
  choice: الخنازير
  rationale: المقابل العربي المعاصر المباشر للاسم اليوناني.
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: صيغة سردية عربية طبيعية تلفت الانتباه إلى الحدث المفاجئ وتحفظ حيوية أداة التنبيه اليونانية.
- source_word: πᾶσα ἡ ἀγέλη
  choice: القطيع كله
  rationale: يحفظ الاسم الجمعي ودلالة الشمول في عبارة عربية مألوفة.
- source_word: ὥρμησεν
  choice: يندفع
  rationale: ينقل الحركة المفاجئة القوية. وجاء بالمضارع الحكائي بعد «إذا» لتكوين سرد عربي حي وطبيعي.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: على المنحدر الشديد
  rationale: κρημνός قد يدل على منحدر شديد أو ضفة شديدة الانحدار أو جرف؛ والصياغة المختارة واضحة ولا تفترض أنه جرف عمودي.
- source_word: θάλασσαν
  choice: البحر
  rationale: هو المقابل المباشر للفظ اليوناني، ويحافظ على تسمية النص للمسطح المائي من غير استبدالها بتفسير جغرافي مثل «البحيرة».
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: فماتت الخنازير في المياه
  rationale: يحفظ الفعل الصريح «ماتت» وعبارة «في المياه». وذُكرت الخنازير لتوضيح مرجع صيغة الجمع اليونانية وتجنب التباس العربية بعد الاسم الجمعي «القطيع».
theological_decisions:
- issue: مقدار التفسير في وصف موت الخنازير
  choice: ماتت الخنازير في المياه
  alternative: غرقت الخنازير في المياه
  rationale: السياق يدل بقوة على الغرق، لكن اليونانية تقول حرفيًا إنها «ماتت في المياه». لذلك يحافظ النص على العبارة الأصلية ولا يجعل الاستنتاج التفسيري جزءًا من المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُخدمت «وإذا بـ» لإبراز المفاجأة، مع تجنب الألفاظ التراثية غير الضرورية والتفسير الزائد.
