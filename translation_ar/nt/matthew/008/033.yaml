source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: ar
  text: فهرب الرعاة، ومضوا إلى المدينة وأخبروا بكل شيء، بما في ذلك ما يتعلّق بالذين كانت بهم شياطين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «والأمور المتعلّقة بالذين كانت بهم شياطين».'
    reason: يبين التركيب اليوناني الموجز ويحفظ سعته الدلالية.
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: الرعاة
  rationale: اسم الفاعل يعني حرفيًا «الذين كانوا يرعون»، والسياق يبيّن أنهم رعاة قطيع الخنازير. وصيغة «الرعاة» موجزة وطبيعية من غير حاجة إلى تكرار الخنازير المذكورة في السياق.
- source_word: ἔφυγον
  choice: هربوا
  rationale: ينقل الفعل معنى الفرار المباشر بوضوح وحيوية في السرد.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: ومضوا إلى المدينة
  rationale: تحافظ العبارة على تتابع الحدث الذي يدل عليه اسم الفاعل الماضي، وتأتي عربية طبيعية وموجزة.
- source_word: ἀπήγγειλαν πάντα
  choice: وأخبروا بكل شيء
  rationale: «أخبروا» مناسب لنقل الخبر إلى أهل المدينة، و«بكل شيء» تحفظ شمول πάντα.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: بما في ذلك ما يتعلّق بالذين كانت بهم شياطين
  rationale: تفيد العبارة اليونانية على نحو واسع «والأمور المتعلقة بمن بهم شياطين». تحافظ الصياغة العربية على هذا الاتساع، وتوضح أن العبارة جزء مما أخبروا به، من غير حصرها في حادثة محددة.
- source_word: δαιμονιζομένων
  choice: الذين كانت بهم شياطين
  rationale: صياغة واضحة ومألوفة تصف حالتهم كما يعرضها السرد، من غير إدخال تفصيل عقائدي زائد عن دلالة اللفظ.
theological_decisions:
- issue: كيفية نقل δαιμονιζομένων من غير فرض تمييز عقائدي أدق مما يقوله النص
  choice: الذين كانت بهم شياطين
  alternative: الممسوسين بالشياطين؛ الذين تسلّطت عليهم الشياطين
  rationale: تثبت الصياغة حقيقة الأذى الشيطاني في السرد، لكنها لا تحسم بمصطلح تقني طبيعة هذا التسلط أو درجاته.
- issue: دلالة τὰ τῶν δαιμονιζομένων
  choice: ما يتعلّق بالذين كانت بهم شياطين
  alternative: ما حدث للذين كانت بهم شياطين
  rationale: التركيب اليوناني موجز وواسع، وقد يشير إلى أمرهم أو قصتهم عمومًا، لا إلى ما حدث لهم وحده؛ لذلك أُبقي هذا الاتساع في المتن.
