  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعملت «قائد مئة» للمحافظة على خصوصية الرتبة، و«يرجوه» لإبقاء درجة الإلحاح مفتوحة ضمن المجال الدلالي للفعل اليوناني.
