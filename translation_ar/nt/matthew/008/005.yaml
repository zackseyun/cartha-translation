lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: ولمّا دخل
  rationale: صيغ التركيب اليوناني المطلق بالمضاف إليه مع اسم الفاعل الماضي في جملة زمنية عربية طبيعية؛ و«لمّا» تعرض تعاقب الحدثين من غير تشديد غير لازم على معنى «بعدما».
- source_word: εἰς Καφαρναοὺμ
  choice: دخل كفرناحوم
  rationale: نُقل اسم الموضع بصيغته العربية الشائعة، وأُدمج حرف الاتجاه اليوناني في الفعل العربي «دخل» وفق الاستعمال الطبيعي.
- source_word: προσῆλθεν αὐτῷ
  choice: جاء إليه
  rationale: ينقل المعنى المباشر للفعل، أي المجيء إلى شخص أو الاقتراب منه، بعبارة سردية واضحة.
- source_word: ἑκατόνταρχος
  choice: قائد مئة
  rationale: ترجمة دقيقة للرتبة العسكرية التي تدل حرفيًا على قائد مسؤول عن وحدة قوامها الاسمي مئة جندي، من غير استبدالها بالتعبير الأعم «ضابط روماني».
- source_word: παρακαλῶν αὐτὸν
  choice: يرجوه
  rationale: يفيد في هذا السياق طلبًا جادًا وملحًّا، ويحافظ على صيغة الفعل المصاحب للمجيء من غير المبالغة بالضرورة في تصويره استجداءً.
theological_decisions: []
