    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: وظلَّ الشياطين
  rationale: تؤدي الواو معنى استمرار السرد، وتساعد «ظلَّ» مع الفعل المضارع على نقل امتداد الفعل الذي يدل عليه زمن الفعل اليوناني، من غير المبالغة في معنى التضاد الذي قد توحي به «أمّا».
- source_word: δαίμονες
  choice: الشياطين
  rationale: لفظ عربي واضح ومستقر للدلالة على الكائنات الروحية الشريرة الشخصية في هذا السياق، من غير إضافة تفسير عقائدي إلى النص.
- source_word: παρεκάλουν
  choice: يتوسَّلون إليه
  rationale: الفعل يدل هنا على الطلب الملحّ، وصيغة الماضي الناقص اليونانية تفيد فعلاً مستمرًّا أو متكررًا؛ لذلك جاء ضمن تركيب «ظلَّ ... يتوسلون».
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على بنية اسم الفاعل التي تقدم الكلام المباشر، وهو تعبير عربي فصيح وطبيعي.
- source_word: Εἰ
  choice: إن
  rationale: تحافظ أداة الشرط على الصياغة الشرطية من منظور المتكلمين، من غير تحويلها إلى معنى سببي أو يقيني مثل «بما أنك».
- source_word: ἐκβάλλεις
  choice: كنتَ تطردنا
  rationale: «تطردنا» تنقل معنى الإخراج بالقوة في هذا السياق، وإدخالها بعد «إن كنت» يصوغ الشرط الجاري بصيغة عربية طبيعية نسبيًا من غير الجزم بتحققه.
- source_word: ἀπόστειλον ἡμᾶς
  choice: فأرسلنا
  rationale: ينقل فعل الأمر المباشر وضمير المتكلمين بإيجاز ووضوح، والفاء تربط جواب الطلب بالشرط في العربية.
- source_word: ἀγέλην
  choice: قطيع
  rationale: هو المقابل العربي المألوف لجماعة من الحيوانات في سياق السرد.
- source_word: χοίρων
  choice: الخنازير
  rationale: ترجمة مباشرة واضحة ومعاصرة لاسم الحيوان، بلا حاجة إلى لفظ بديل أقدم أو أقل شيوعًا.
theological_decisions:
- issue: تسمية الأرواح الشريرة
  choice: الشياطين
  alternative: الأرواح الشريرة
  rationale: يعرض النص كائنات شريرة شخصية تخاطب يسوع. يحافظ «الشياطين» على هذا العرض مباشرة، بينما «الأرواح الشريرة» تفسير وصفي لا يطابق اللفظ اليوناني هنا تمام المطابقة.
- issue: قوة الشرط في قول الشياطين
  choice: إن كنتَ تطردنا
  alternative: بما أنك تطردنا
  rationale: أُبقي الشرط كما في اليونانية، حتى لا يتحول كلامهم إلى تقرير صريح لنية يسوع أو إلى حسم لدرجة يقينهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية موقرة. استُعمل «ظلَّ ... يتوسلون» لنقل الاستمرار، مع معاملة الشياطين معاملة ذوي الشخصية والعقل في ضمير الجمع، كما يقتضي سياق خطابهم المباشر.
