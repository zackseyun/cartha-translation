  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: ar
  text: 'أما يسوع فيقول له: «اتبعني، ودع الموتى يدفنون موتاهم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُفهم «الموتى» في الموضع الأول غالبًا على سبيل المجاز، أي الذين لا يستجيبون روحيًا، في مقابل الموتى جسديًا في الموضع الثاني.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: أما
  rationale: تفيد انتقالًا مع مقابلة خفيفة لطلب الرجل السابق، من غير مبالغة في حدة الاستدراك.
- source_word: λέγει
  choice: فيقول
  rationale: تحافظ صيغة المضارع العربية على حيوية المضارع التاريخي في النص اليوناني، وتنسجم مع السياق السردي.
- source_word: Ἀκολούθει μοι
  choice: اتبعني
  rationale: أمر مباشر طبيعي في العربية، يحمل معنى السير وراء يسوع ومعنى التلمذة له.
- source_word: ἄφες
  choice: دع
  rationale: تنقل الأمر بترك الأمر للآخرين، وهي موجزة ومباشرة ولا تجعله مجرد إذن محايد.
- source_word: νεκρούς ... νεκρούς
  choice: الموتى ... موتاهم
  rationale: تحافظ على تكرار اللفظ الواحد وعلى المفارقة المقصودة، من غير إضافة «روحيًا» إلى المتن.
- source_word: θάψαι
  choice: يدفنون
  rationale: بعد «دع» تأتي صيغة المضارع العربية على نحو طبيعي للدلالة على الفعل المطلوب تركه لهم.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: موتاهم هم أنفسهم
  rationale: تحافظ «هم أنفسهم» على التوكيد الانعكاسي في ἑαυτῶν، وإن كان الضمير في «موتاهم» يؤدي أصل معنى الملكية.
theological_decisions:
- issue: دلالة «الموتى» في قول يسوع
  choice: إبقاء «الموتى ... موتاهم» في المتن بلا تفسير صريح
  alternative: ترجمة الموضع الأول بـ«الموتى روحيًا» والموضع الثاني بالموتى جسديًا
  rationale: يستعمل اليوناني اللفظ نفسه في الموضعين، وفي القول مفارقة مقصودة وتوتر لاهوتي ينبغي الحفاظ عليهما. إضافة «روحيًا» تحسم ما تركه النص ضمنيًا، لذلك يوضع هذا الفهم المحتمل في الحاشية فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كريمة. استُخدم المضارع السردي «فيقول» للمحافظة على حيوية الأصل، وحُفظ التكرار اللفظي والمفارقة من دون تفسير مذهبي داخل المتن.
