review_pass:
  verdict: revise
  source_fidelity: المتن يحافظ جيدًا على المضارع التاريخي في «فيقول»، وعلى الأمر «اتبعني»، وعلى تكرار «الموتى»، ولا يفرض تفسيرًا على التلاعب المقصود بين الموتين. لكن «موتاهم هم أنفسهم» لا تؤدي موضع ἑαυτῶν بدقة أو بطبيعية عربية؛ إذ تُفهم «هم أنفسهم» بوصفها توكيدًا للفاعلين، بينما المقصود توكيد ملكية الموتى لهم.
  naturalness: «دع الموتى يدفنون موتاهم هم أنفسهم» ثقيلة وملتبسة في العربية الفصحى الحديثة. «دع الموتى يدفنون موتاهم» سليمة وطبيعية، ويظل ضمير الجمع في «موتاهم» كافيًا لنقل الإحالة الانعكاسية في تركيب عربي مألوف.
  terminology: «اتبعني» و«الموتى» مصطلحات سليمة ومناسبة للسجل الكتابي العربي. الحاشية تشرح قراءة محتملة دون إدخالها في المتن، لكنها تستعمل «يمكنهم» بما قد يخفف من حدة الأمر؛ والأفضل صياغتها تفسيرية مباشرة ومحايدة.
  issues:
  - severity: medium
    issue: التوكيد «هم أنفسهم» في «موتاهم هم أنفسهم»
    rationale: ἑαυτῶν توكيد انعكاسي للملكية («موتاهم/موتاهم الخاصون») لا توكيد للفاعل. والإضافة العربية مع الضمير تؤدي المعنى على نحو طبيعي؛ أما «هم أنفسهم» فتوحي بأنهم هم، لا غيرهم، الذين يدفنون.
  - severity: low
    issue: صياغة الحاشية «يمكنهم أن يدفنوا»
    rationale: الحاشية تشرح الاستعارة المحتملة، لا تمنح إذنًا أو إمكانًا؛ فالصياغة المباشرة أدق وأوجز.
