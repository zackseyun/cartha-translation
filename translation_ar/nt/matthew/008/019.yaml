  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: ar
  text: 'فتقدَّم إليه أحدُ الكتبة وقال له: «يا معلِّم، سأتبعك أينما تذهب.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أينما تنصرف» أو «أينما تمضي». قد يدل الفعل اليوناني بصورة أخص على الذهاب أو الانصراف، لكنه يُفهم هنا طبيعيًا بمعنى «تذهب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم إليه
  rationale: ينقل معنى الاقتراب المقصود من يسوع قبل الكلام، بصياغة عربية طبيعية موجزة.
- source_word: εἷς
  choice: أحدُ
  rationale: يحفظ دلالة العدد المستعمل لتقديم شخص بعينه في السرد، من غير إثقال العبارة.
- source_word: γραμματεὺς
  choice: الكتبة
  rationale: «كاتب/الكتبة» هو المقابل الإنجيلي المألوف لفئة العارفين بالشريعة، وهو أقل تفسيرًا من «معلّم الشريعة» أو «خبير الشريعة»؛ وجاءت العبارة «أحد الكتبة» طبيعية في العربية.
- source_word: Διδάσκαλε
  choice: يا معلِّم
  rationale: ترجمة مباشرة للقب في سياق النداء، من غير إضفاء معنى أقوى مثل «يا سيد» ولا استعمال اللقب المنقول «رابي».
- source_word: ἀκολουθήσω
  choice: سأتبعك
  rationale: يحفظ صيغة المستقبل وإعلان المتكلم عزمه، مع بقاء معنى الاتباع الحرفي ومعنى التلمذة ممكنين.
- source_word: ὅπου ἐὰν
  choice: أينما
  rationale: تؤدي معنى الموصول المكاني غير المحدد وتعبّر طبيعيًا عن شمول الوعد لكل وجهة.
- source_word: ἀπέρχῃ
  choice: تذهب
  rationale: صياغة عربية طبيعية في السياق؛ والفعل اليوناني قد يدل بصورة أخص على الانصراف أو الذهاب بعيدًا، ولذلك أُثبت البديل في الحاشية.
theological_decisions:
- issue: ترجمة διδάσκαλος لقبًا ليسوع
  choice: يا معلِّم
  alternative: يا سيد / يا رابي
  rationale: «يا معلِّم» يحفظ المعنى المعجمي والاحترام الظاهر في الخطاب، من غير تحميل اللقب دلالة مسيحية أعلى لا يفرضها هذا الموضع.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. استُعملت «أحد الكتبة» بوصفها العبارة العربية المألوفة لهذه الفئة، مع الحفاظ على ترتيب الحدث: التقدّم أولًا ثم القول. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.'
