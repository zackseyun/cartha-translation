base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: ar
  text: ولمّا حلّ المساء، أحضروا إليه كثيرين ممّن ابتُلوا بالشياطين[a]، فأخرج الأرواح بكلمة، وشفى جميع المرضى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كثيرين ممّن كانوا تحت تأثير الشياطين». يدل التعبير اليوناني على أشخاص واقعين تحت تأثير أو ضيق شيطاني، من غير تحديد كيفية ذلك أو درجته.'
    reason: بديل معجمي يحفظ سعة دلالة التعبير اليوناني.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: ولمّا جاء المساء
  rationale: ترجمة طبيعية للتركيب الزمني المطلق، تحافظ على معنى حلول المساء من غير تكلّف.
- source_word: προσήνεγκαν αὐτῷ
  choice: أحضروا إليه
  rationale: ينقل معنى الإتيان بالأشخاص إلى يسوع بعبارة عربية واضحة وطبيعية.
- source_word: δαιμονιζομένους πολλούς
  choice: كثيرين ممّن تسلَّطت عليهم الشياطين
  rationale: يعبّر عن خضوع هؤلاء لتأثير شيطاني من غير أن يضيّق دلالة اسم المفعول اليوناني على مفهوم تقني واحد.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: أخرج الأرواح
  rationale: يحافظ على الفعل الدال على الطرد وعلى المفعول الصريح «الأرواح»، من غير إضافة وصف غير مذكور، مع أن السياق يبيّن طبيعتها.
- source_word: λόγῳ
  choice: بكلمة
  rationale: ينقل دلالة الوسيلة في صيغة موجزة، ويبرز سلطان الأمر المنطوق من غير إضافة ضمير غير موجود صراحة في اليونانية.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: جميع المرضى
  rationale: العبارة اليونانية اصطلاح يدل هنا على المرض، وهذه الصياغة عربية موجزة وواضحة وتحافظ على الشمول.
- source_word: ἐθεράπευσεν
  choice: شفى
  rationale: المقابل العربي الطبيعي للفعل في سياقات الشفاء في الأناجيل.
theological_decisions:
- issue: طبيعة δαιμονιζομένους وτὰ πνεύματα
  choice: الحفاظ على فئة الضيق الشيطاني بوصفها متميزة عن المرض، بعبارتي «تسلَّطت عليهم الشياطين» و«الأرواح»
  alternative: تفسير الحالة على أنها مرض نفسي، أو استعمال «الممسوسين بالشياطين»
  rationale: يميّز النص نفسه بين إخراج الأرواح وشفاء المرضى؛ لذلك لا تُختزل الفئة الأولى في تشخيص نفسي حديث. وفي الوقت نفسه، تتجنب الصياغة حصر اللفظ اليوناني في تصور تقني أضيق من دلالته.
- issue: دلالة λόγῳ
  choice: بكلمة
  alternative: بكلمته؛ بمجرد أن تكلّم
  rationale: تحافظ هذه الصياغة على الدلالة الآلية وعلى إيجاز الأصل، وتظهر سلطان يسوع من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «تسلَّطت عليهم الشياطين» بدل تعبير اصطلاحي قد يحمل إيحاءات شعبية أضيق، ووُضع مؤشر الحاشية عند العبارة التي تشرحها مباشرة.
