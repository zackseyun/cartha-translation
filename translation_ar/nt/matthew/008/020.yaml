base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ar
  text: 'فيقول له يسوع: «للثعالب جحور[a]، ولطيور السماء[b] أعشاش[c]، أمّا ابن الإنسان[d] فليس له موضع يريح فيه رأسه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أوكار».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «طيور الجو».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أماكن مبيت» أو «مآوٍ».'
    reason: lexical_alternative
  - marker: d
    text: '«ابن الإنسان» لقب يستخدمه يسوع عن نفسه؛ ويترجمه بعضهم ترجمة تفسيرية: «الإنسان».'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: فيقول
  rationale: يحافظ المضارع على المضارع السردي في اليونانية، مع إضافة الفاء لربط القول بسياق السرد ربطًا طبيعيًا في العربية.
- source_word: ἀλώπεκες
  choice: الثعالب
  rationale: المقابل العربي المباشر والواضح لاسم الحيوان في صيغة الجمع.
- source_word: φωλεοὺς
  choice: جحور
  rationale: «جحور» هي العبارة العربية الطبيعية لمساكن الثعالب، وتحفظ الصورة المكانية في النص.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: ترجمة مباشرة وسليمة عربيًا تحفظ صورة السماء، من غير استبدالها بتعبير تفسيري.
- source_word: κατασκηνώσεις
  choice: أعشاش
  rationale: مع الطيور، تؤدي «أعشاش» المعنى المقصود بصورة طبيعية، مع الإشارة في الحاشية إلى الدلالة الأوسع للكلمة، أي أماكن المبيت أو الإيواء.
- source_word: ὁ δὲ υἱὸς τοῦ ἀνθρώπου
  choice: أمّا ابن الإنسان
  rationale: «أمّا» تُظهر المقابلة التي تؤديها δέ، و«ابن الإنسان» يحفظ اللقب وصياغته المألوفة ودلالاته المحتملة.
- source_word: οὐκ ἔχει ποῦ
  choice: فليس له موضع
  rationale: صياغة عربية طبيعية تؤدي معنى عدم وجود مكان، بدل النقل الحرفي المتعثر «ليس له أين».
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: يسند إليه رأسه
  rationale: تعبير عربي واضح يحفظ الصورة الحسية لإمالة الرأس ووضعه طلبًا للراحة.
theological_decisions:
- issue: ترجمة لقب يسوع ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: يحفظ «ابن الإنسان» البنية الأصلية واللقب المعروف، بما فيه من صدى كتابي واحتمالات دلالية، ولا يحسمه بتعبير تفسيري أضيق.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. حُفظ المضارع السردي وصورة المقابلة بين مأوى الحيوانات وافتقار ابن الإنسان إلى موضع يريح فيه رأسه، مع تجنب التفسير العقائدي الزائد.
