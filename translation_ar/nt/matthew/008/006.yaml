  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: ar
  text: 'قائلًا: «يا رب، خادمي[a] مستلقٍ في البيت، مشلولًا، ويتعذّب بشدة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فتاي» أو «ولدي»؛ فاللفظة اليونانية قد تشير إلى خادم أو إلى فتى أو ولد، غير أن «خادمي» أنسب لسياق قائد المئة.
    reason: lexical_alternative
  - marker: b
    text: أو «يعاني معاناة شديدة».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: قائلًا
  rationale: ينقل اسم الفاعل اليوناني الذي يربط الكلام بما قبله، بصياغة عربية طبيعية تناسب كون الآية امتدادًا نحويًا للسياق السابق.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ إمكان فهم النداء بوصفه خطاب احترام أو لقبًا ذا دلالة أرفع، من غير حسم درجة إدراك قائد المئة لهوية يسوع.
- source_word: ὁ παῖς μου
  choice: خادمي
  rationale: يمكن أن تدل παῖς على خادم أو فتى أو ولد. ويوافق «خادمي» سياق قائد المئة، مع إبقاء الاحتمالات الأخرى في الحاشية.
- source_word: βέβληται
  choice: راقدٌ
  rationale: صيغة التام المبني للمجهول تصف الحالة الناتجة؛ و«راقد» تؤدي معنى كونه ملقى أو ملازمًا لموضعه من غير خشونة الترجمة الحرفية.
- source_word: ἐν τῇ οἰκίᾳ
  choice: في البيت
  rationale: ترجمة مكانية مباشرة وطبيعية، ولا تفترض أكثر مما يقوله النص.
- source_word: παραλυτικός
  choice: مشلولًا
  rationale: ينقل الوصف المرضي بصياغة عربية معاصرة واضحة بدل تحويل الصفة إلى اسم للشخص.
- source_word: δεινῶς βασανιζόμενος
  choice: يتعذّب عذابًا شديدًا
  rationale: يحفظ قوة βασανίζω وشدة δεινῶς، مع بقاء العبارة قابلة لأن تشير إلى ألم أو كرب بالغ من غير تحديد سببه.
theological_decisions:
- issue: دلالة Κύριε في خطاب يسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: قد يكون النداء احترامًا اجتماعيًا أو يحمل اعترافًا أعمق. «يا رب» يبقي هذا الانفتاح الدلالي ولا يقصره على المجاملة وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «قائلًا» لأن الآية تواصل تركيب الآية السابقة، ووُضعت علامتا الحاشية عند اللفظتين اللتين تتعلق بهما البدائل.
