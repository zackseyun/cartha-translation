source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: ar
  text: وإذا بأهل المدينة كلهم قد خرجوا للقاء يسوع. ولما رأوه، توسّلوا إليه أن يغادر منطقتهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أرضهم»، وحرفيًا «حدودهم».
    reason: بيان المجال الدلالي لكلمة ὅρια، التي تشير حرفيًا إلى الحدود وقد تدل سياقيًا على الأرض أو المنطقة الواقعة داخلها.
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: وإذا بـ
  rationale: تنقل أداة لفت الانتباه والتحول السردي بصياغة عربية فصيحة وطبيعية، من غير ثقل «وهوذا».
- source_word: πᾶσα ἡ πόλις
  choice: أهل المدينة كلهم
  rationale: المقصود بالمدينة سكانها على نحو جماعي؛ والتصريح بـ«أهل» أوضح في العربية من إسناد الخروج إلى الأبنية، مع إبقاء معنى الشمول الخطابي.
- source_word: ἐξῆλθεν εἰς ὑπάντησιν
  choice: خرجوا للقاء
  rationale: صياغة عربية مباشرة تحفظ حركة الخروج وغرضها، مع مطابقة الجمع الدلالي في «أهل المدينة».
- source_word: ἰδόντες αὐτόν
  choice: ولما رأوه
  rationale: تعبر طبيعيًا عن العلاقة الزمنية التي يؤديها اسم الفاعل اليوناني الماضي.
- source_word: παρεκάλεσαν
  choice: توسّلوا إليه
  rationale: ينقل شدة الطلب وإلحاحه في هذا السياق، ولا يختزله إلى مجرد سؤال أو طلب محايد.
- source_word: ὅπως μεταβῇ
  choice: أن يغادر
  rationale: تنقل مضمون التوسل بإيجاز ووضوح، وتحفظ معنى الانتقال بعيدًا عن المكان.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: منطقتهم
  rationale: ὅρια قد تعني الحدود حرفيًا، لكنها هنا تدل على الرقعة أو الإقليم الواقع داخلها؛ «منطقتهم» طبيعية وواضحة في العربية.
theological_decisions:
- issue: سبب توسّل أهل المدينة إلى يسوع أن يغادر
  choice: إبقاء الدافع غير مذكور، كما في النص اليوناني.
  alternative: التصريح بأنهم فعلوا ذلك خوفًا من قدرته، أو غضبًا لخسارة الخنازير، أو فزعًا عامًا مما حدث.
  rationale: الآية تذكر طلبهم ولا تحدد سببه؛ لذا لا ينبغي إدخال تفسير لاهوتي أو نفسي في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «وإذا بـ» لحيوية السرد، و«توسّلوا» لقوة الطلب، مع تجنب التراكيب القديمة الثقيلة. وُضعت علامة الحاشية بعد «منطقتهم» لأنها تتعلق ببديلها المعجمي.
