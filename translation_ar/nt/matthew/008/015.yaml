source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: ar
  text: ولمس يدها، ففارقتها الحُمّى، فقامت وأخذت تخدمه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانت تخدمه». قد تصف صيغة الفعل اليوناني خدمةً مستمرة فحسب، وقد توحي أيضًا بأنها شرعت في خدمته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: لمس
  rationale: الفعل الأوسط هنا يدل على اللمس أو الاتصال، و«لمس» هو المقابل العربي الواضح من غير مبالغة في طبيعة الفعل.
- source_word: τῆς χειρὸς αὐτῆς
  choice: يدها
  rationale: χείρ تعني «يد»، والإضافة التي يقتضيها الفعل في اليونانية تُصاغ طبيعيًا في العربية مفعولًا به مباشرًا.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: فارقتها الحُمّى
  rationale: يحافظ هذا التعبير على كون الحُمّى فاعلًا في التركيب اليوناني، ويؤدي معنى أنها تركتها بلغة عربية طبيعية.
- source_word: πυρετός
  choice: الحُمّى
  rationale: الاسم يدل مباشرة على الحُمّى، ولا تستدعي العبارة توسيعه إلى وصف مرضي أطول.
- source_word: ἠγέρθη
  choice: قامت
  rationale: الصيغة المبنية للمجهول يمكن أن تُستعمل هنا بمعنى لازم، أي إنها نهضت بعد شفائها؛ و«قامت» واضحة ولا تُدخل إيحاءً لاهوتيًا غير لازم.
- source_word: διηκόνει αὐτῷ
  choice: أخذت تخدمه
  rationale: الفعل يعني الخدمة، وصيغته الناقصة قد تصف فعلًا مستمرًا أو ذا بداية؛ و«أخذت تخدمه» تنقل القراءة الابتدائية مع بيان البديل في الحاشية.
theological_decisions:
- issue: احتمال تحميل ἠγέρθη دلالة القيامة
  choice: قامت
  alternative: أُقيمت
  rationale: السياق المباشر يصف نهوضها بعد زوال الحُمّى، فلا ينبغي أن تفرض الترجمة هنا دلالة القيامة الممكنة للفعل في سياقات أخرى.
- issue: دلالة صيغة διηκόνει الناقصة
  choice: أخذت تخدمه
  alternative: كانت تخدمه / خدمته
  rationale: تحتمل الصيغة وصف بدء الخدمة أو استمرارها؛ اختير التعبير الابتدائي في المتن، مع إبقاء الاحتمال غير الابتدائي ظاهرًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «فارقتها الحُمّى» للمحافظة على صورة النص اليوناني الطبيعية، و«تخدمه» الملائمة للمشهد المنزلي دون استعمال لفظ كنسي متخصص.
