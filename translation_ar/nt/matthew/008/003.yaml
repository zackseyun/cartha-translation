  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: ar
  text: 'ومدَّ يده ولمسه قائلًا: «أريد، فاطهُرْ». وفي الحال طَهُرَ بَرَصُهُ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني المترجم «البرص» قد يشمل أمراضًا جلدية خطيرة متعددة، ولا يقتصر بالضرورة على الجذام المعروف طبيًّا اليوم.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: مدَّ يده
  rationale: ينقل الحركة الجسدية السابقة للمس بعبارة عربية طبيعية ومباشرة.
- source_word: ἥψατο αὐτοῦ
  choice: لمسه
  rationale: الفعل اليوناني مع المجرور يدل هنا بوضوح على اللمس، وهو الملائم لسياق الشفاء.
- source_word: Θέλω
  choice: أريد
  rationale: يجيب اللفظ مباشرة عن قول الرجل السابق «إن أردت»، ويحفظ معنى الإرادة والاستعداد من غير تحويله إلى زمن مستقبل.
- source_word: καθαρίσθητι
  choice: فاطهُرْ
  rationale: يحفظ لغة التطهير بما فيها من بُعدين جسدي وطقسي، ولا يختزلها في مجرد الشفاء.
- source_word: εὐθέως
  choice: للحال
  rationale: تعبير عربي واضح وموجز يؤدي معنى وقوع النتيجة فورًا.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: طَهُرَ بَرَصُهُ
  rationale: يحافظ على كون البرص هو الفاعل النحوي في الأصل، وعلى تكرار جذر التطهير بين الأمر والنتيجة.
theological_decisions:
- issue: لغة التطهير في καθαρίζω
  choice: استعمال «اطهُر» و«طَهُر» في الأمر والنتيجة
  alternative: استعمال «اشفَ» و«شُفي»
  rationale: التطهير هو المعنى الصريح في اليونانية، ويحمل الدلالة الجسدية ودلالة الطهارة معًا؛ أما لغة الشفاء وحدها فتضيّق المعنى.
- issue: دلالة Θέλω في جواب يسوع
  choice: «أريد»
  alternative: «سأفعل» أو «أنا مستعد»
  rationale: «أريد» تقابل سؤال الإرادة في السياق السابق وتحفظ إيجاز الجواب وقوته من دون إضافة معنى زمني أو عاطفي غير مصرح به.
translation_notes:
  register: عربية فصحى واضحة وموقرة. اختير «فاطهُر» للمحافظة على الصلة اللفظية بين الأمر والنتيجة، ووُضعت الحركات الضرورية لتجنب التباس صيغة الأمر والفاعل في «بَرَصُهُ».
