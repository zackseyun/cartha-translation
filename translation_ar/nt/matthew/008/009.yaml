  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ar
  text: 'فأنا أيضًا إنسانٌ تحت سلطة، ولي جنودٌ تحت إمرتي. أقول لهذا: «اذهب»، فيذهب، ولآخر: «تعالَ»، فيأتي، ولعبدي[a]: «افعل هذا»، فيفعله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادمي». والكلمة اليونانية قد تعني عبدًا أو خادمًا بحسب السياق.'
    reason: بديل معجمي للفظ δοῦλος مع حفظ مدى دلالته الاجتماعي.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فأنا أيضًا
  rationale: الفاء تنقل قوة γάρ التفسيرية، و«أيضًا» تنقل καί، فيوضح قائد المئة وجه ثقته بسلطان يسوع.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: أنا أيضًا إنسانٌ تحت سلطة
  rationale: صياغة مباشرة تحفظ كون المتكلم خاضعًا لسلطة أعلى، من غير تعيين صاحبها لأن الأصل لا يعيّنه.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: ولي جنودٌ تحت إمرتي
  rationale: «تحت إمرتي» عربية طبيعية في السياق العسكري، وتحفظ معنى وجود جنود خاضعين لسلطانه المفوَّض.
- source_word: λέγω τούτῳ
  choice: أقول لهذا
  rationale: تحفظ اسم الإشارة والتوزيع الفردي في سلسلة الأمثلة.
- source_word: Πορεύθητι / Ἔρχου
  choice: اذهب / تعالَ
  rationale: أمران مباشران بسيطان يقابلان اللفظ اليوناني بوضوح وطبيعية.
- source_word: δοῦλος
  choice: عبدي
  rationale: «عبد» هو المقابل الأدق الذي يحفظ وضع التبعية الاجتماعية الذي قد تدل عليه δοῦλος، بدل تلطيفه إلى «خادم».
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: افعل هذا، فيفعله
  rationale: تحفظ علاقة الأمر بالاستجابة، ويبيّن ضمير المفعول في «يفعله» أن المقصود تنفيذ الأمر المحدد.
theological_decisions:
- issue: دلالة δοῦλος في مثال قائد المئة
  choice: عبدي
  alternative: خادمي
  rationale: يحفظ «عبدي» الاحتمال الاجتماعي الأقوى للفظ اليوناني ولا يحصره في معنى الخدمة الوظيفية الأخف؛ وتُذكر «خادمي» في الحاشية بوصفها ترجمة ممكنة بحسب السياق.
- issue: تشبيه سلطان قائد المئة بسلطان يسوع
  choice: الإبقاء على عبارة «تحت سلطة» بلا شرح لاهوتي مضاف
  alternative: تعيين من يخضع له يسوع أو تفسير طبيعة سلطانه داخل النص
  rationale: الأصل يعرض القياس من خلال بنية السلطة ولا يصرّح في هذه الآية بهوية السلطة الأعلى المقصودة بالنسبة إلى يسوع؛ لذا ينبغي حفظ التوتر وعدم إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «تحت إمرتي» لطبيعتها في السياق العسكري، مع إبقاء «تحت سلطة» أعمّ وأقرب إلى تركيب الأصل. تكرار الأفعال القصيرة يحفظ إيقاع الأمر والطاعة في اليونانية.
