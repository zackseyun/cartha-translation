  terminology: لا توجد مصطلحات لاهوتية مفروضة أو توسعات تفسيرية. تحافظ العبارة على دهشة السؤال وسلطان يسوع على قوى الطبيعة من غير استنتاج عقائدي زائد. ولا يلزم إدراج حاشية؛ إذ إن دلالة «أيّ» مفهومة في المتن ولا توجد علامة حاشية تحتاج إلى مطابقة.
