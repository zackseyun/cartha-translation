  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: ar
  text: 'فتعجَّب الرجال قائلين: «أيُّ إنسانٍ هذا، حتى إن الرياح والبحر تطيعه؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: فتعجَّب الرجال
  rationale: يشير الاسم الجمع هنا، في سياق القارب، إلى الرجال الحاضرين، وعلى الأرجح التلاميذ؛ و«الرجال» أدق من تعميمه إلى «الناس». ونُقلت δέ بالفاء لربط ردّ فعلهم بما سبقه ربطًا طبيعيًا.
- source_word: ἐθαύμασαν
  choice: تعجَّب
  rationale: ينقل فعل الماضي اليوناني ردَّ فعل الدهشة والتعجب نقلاً موجزًا، وهو تعبير عربي فصيح وواضح.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على الصلة الحالية بين تعجبهم وما نطقوا به، موافقًا لبنية اسم الفاعل في الأصل.
- source_word: Ποταπός ἐστιν οὗτος
  choice: أيُّ إنسانٍ هذا
  rationale: «أيّ» تسأل هنا عن صفة الشخص ونوعه، و«إنسان» يوضح المرجع الشخصي الذي يفهمه التركيب اليوناني من السياق، من غير إضافة تفسير عقائدي.
- source_word: ὅτι
  choice: حتى إن
  rationale: 'ينقل أساس السؤال المندهش ونتيجته اللافتة في عربية طبيعية: بلغ سلطانه حدّ أن الرياح والبحر يطيعانه.'
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: الرياح والبحر
  rationale: تؤدي «حتى إن» قبل العبارة وظيفة καί التشديدية بمعنى «حتى»، بينما تُنقل الرياح بصيغة الجمع والبحر بصيغة المفرد كما في الأصل.
- source_word: αὐτῷ ὑπακούουσιν
  choice: تطيعه
  rationale: «تطيع» تنقل دلالة الخضوع لأمر صاحب سلطة، مع ضمير مفرد يعود إلى يسوع. وجاء الفعل مؤنثًا مفردًا على القياس العربي مع الفاعل غير العاقل.
theological_decisions:
- issue: القوة المسيحانية الكامنة في سؤال التلاميذ
  choice: إبقاء السؤال مفتوحًا ومباشرًا مع إظهار أن الرياح والبحر يطيعانه
  alternative: التصريح بهوية يسوع أو إضافة نتيجة عقائدية لا ينص عليها العدد
  rationale: الأصل يبرز سلطان يسوع على قوى الطبيعة من خلال دهشة الرجال، لكنه يصوغ ذلك سؤالًا لا تقريرًا عقائديًا صريحًا؛ لذا تحفظ الصياغة التوتر اللاهوتي والسردي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «أيُّ إنسانٍ هذا» ليبقى السؤال عن صفة هذا الشخص وهويته الاستثنائية مفهومًا للقارئ المعاصر، من غير تعبير قديم مثل «أيُّ نوع من الناس» أو توسع تفسيري.
