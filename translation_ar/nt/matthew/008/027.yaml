  source_fidelity: 'النص يترجم عناصر اليونانية الأساسية بأمانة: «الرجال» لـ οἱ ἄνθρωποι، و«تعجّب» لـ ἐθαύμασαν، والسؤال عن طبيعة الشخص في «أيّ إنسان هذا»، وخضوع الرياح والبحر له في «تطيعه». و«حتى إن» تؤدي بصورة عربية طبيعية القوة التفسيرية/التعجبية لـ ὅτι مع التشديد الذي يبرزه تكرار καί.'
