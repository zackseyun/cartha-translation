  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: ar
  text: 'فتقدّموا وأيقظوه قائلين: «يا رب، خلّصنا[a]! إننا نهلك!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنقذنا». يمكن للفعل اليوناني أن يدل على النجاة الفورية من الخطر، كما يحمل المعنى الأوسع «خلّص».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: فتقدّموا
  rationale: اسم فعل ماضٍ يدل على اقتراب التلاميذ من يسوع قبل إيقاظه. «فتقدّموا» تعبير عربي طبيعي يحفظ الحركة وتسلسل الحدث من غير زيادة غير لازمة.
- source_word: ἤγειραν
  choice: أيقظوه
  rationale: الفعل ἐγείρω مستعمل هنا بمعناه الحسي، أي إيقاظ النائم، لا بمعنى الإقامة أو النهوض.
- source_word: λέγοντες
  choice: قائلين
  rationale: ينقل اسم الفاعل مضمون كلامهم مباشرة، من غير إضافة انفعال غير مصرّح به في اللفظ اليوناني.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء من κύριος. تحافظ «يا رب» على اللقب وعلى ما قد يحمله في السياق من احترام ودلالة أعمق، من غير حصره في معنى «يا معلّم».
- source_word: σῶσον
  choice: خلّصنا
  rationale: أمر من σῴζω يدل هنا على النجاة الفورية من الخطر، مع إبقاء الصلة بالمدى الأوسع للفعل «خلّص». أُظهر المفعول «نا» لأن السياق والعبارة التالية يحددان المقصود بوضوح، ولأن العربية الطبيعية تقتضيه هنا.
- source_word: ἀπολλύμεθα
  choice: إننا نهلك
  rationale: المضارع يدل على هلاك وشيك جارٍ، وتؤدي «نهلك» هذا المعنى وتحفظ شدة الخطر من غير قصره على مجرد الموت.
theological_decisions:
- issue: دلالة κύριος في خطاب يسوع
  choice: يا رب
  alternative: يا معلّم
  rationale: قد يكون النداء لقب احترام، وقد يحمل دلالة مسيانية أعمق. تبقي «يا رب» هذا المجال الدلالي مفتوحًا ولا تختزله في وظيفة التعليم.
- issue: إظهار مفعول σῶσον
  choice: خلّصنا
  alternative: خلّص
  rationale: المفعول غير ملفوظ به مستقلًا في اليونانية، لكنه مفهوم قطعًا من «إننا نهلك». وإظهاره في العربية لازم للوضوح والسلاسة، ولا يضيف مضمونًا لاهوتيًا.
- issue: المعنى الفوري والواسع للفعل σῴζω
  choice: خلّصنا
  alternative: أنقذنا
  rationale: السياق يتحدث عن إنقاذ عاجل من خطر الغرق، لكن «خلّصنا» يحفظ أيضًا الاتساع المعجمي للفعل من غير فرض معنى خلاصي اصطلاحي على السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. حافظت الصياغة على سرعة الحدث وإلحاح النداء، واستُعملت علامات الترقيم لإبراز الاستغاثة من غير إضافة ألفاظ انفعالية ليست في الأصل.
