source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: ar
  text: 'وقال له يسوع: «إيّاك أن تخبر أحدًا، بل اذهب وأرِ نفسك للكاهن، وقدِّم القربان الذي أمر به موسى[a]، شهادةً لهم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يشير هذا الأمر إلى الإجراء الذي تقضي به شريعة موسى لمن طَهُر من البرص؛ انظر اللاويين 14.
    reason: cross_reference
  - marker: b
    text: 'يمكن أيضًا فهمها: «لتكون دليلًا لهم». وقد تشير العبارة إلى دليل يُقدَّم للكهنة، ويفهمها بعضهم على أنها شهادة ضمنية على الذين يرفضون الإيمان.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: إيّاك أن تخبر أحدًا
  rationale: ينقل التحذير المؤكد الذي تفيده صيغة Ὅρα مع النهي، بعبارة عربية طبيعية، ولا يختزله إلى مجرد نهي محايد.
- source_word: ὕπαγε
  choice: اذهب
  rationale: مقابل عربي مباشر وطبيعي لفعل الحركة بصيغة الأمر.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: أرِ نفسك للكاهن
  rationale: يحافظ على التركيب الانعكاسي وعلى دلالة عرض الشخص نفسه على الكاهن للفحص.
- source_word: τῷ ἱερεῖ
  choice: للكاهن
  rationale: أداة التعريف في اليونانية تشير إلى الكاهن المختص بالإجراء الذي تقضي به الشريعة، لا إلى أي كاهن على نحو عام.
- source_word: προσένεγκον τὸ δῶρον
  choice: قدِّم القربان
  rationale: «قدِّم» تلائم فعل الإتيان بالتقدمة في السياق التعبدي، و«القربان» توضح أن δῶρον هنا عطية مقدمة في سياق شعائري من غير إضافة تفاصيل غير مذكورة.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: الذي أمر به موسى
  rationale: صياغة واضحة تحفظ قوة الأمر وسلطة الوصية الموسوية.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: شهادةً لهم
  rationale: تحفظ إيجاز الأصل وانفتاح «الشهادة» على معنى الإثبات أو الدليل، من غير تعيين مرجع الضمير أو جعلها صراحةً شهادة ضدهم.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: وقال له يسوع
  rationale: صيغ الحاضر التاريخي اليوناني بالماضي العربي الملائم للسرد، مع إبقاء حرف العطف الموجود في الأصل.
theological_decisions:
- issue: مرجع الضمير وقوة عبارة εἰς μαρτύριον αὐτοῖς
  choice: شهادةً لهم
  alternative: دليلًا للكهنة؛ أو شهادةً عليهم
  rationale: لا يصرح النص اليوناني بمرجع αὐτοῖς، كما أن μαρτύριον قد تدل على شهادة أو دليل من غير أن تحسم وحدها إن كان المعنى مؤيدًا أم اتهاميًا؛ لذلك تُرك التوتر الدلالي قائمًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «إيّاك أن» لنقل قوة التحذير، و«القربان» لإظهار السياق التعبدي، مع إبقاء «لهم» بلا مرجع مصرح به حفاظًا على غموض الأصل.
