lexical_decisions:
- source_word: ἦν δὲ
  choice: وكان
  rationale: تفيد δέ انتقالًا سرديًا خفيفًا، وتؤدي الواو هذا الربط طبيعيًا في العربية، بينما تنقل «كان» معنى ἦν الوجودي في السياق.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: بعيدًا عنهم
  rationale: تعبير عربي طبيعي يحافظ على الدلالة المكانية المباشرة للتركيب اليوناني، من غير تحديد مقدار المسافة.
- source_word: ἀγέλη χοίρων πολλῶν
  choice: قطيع كبير من الخنازير
  rationale: «قطيع» المقابل الطبيعي لـἀγέλη، وصياغة «قطيع كبير» تنقل كثرة الخنازير بلغة عربية سلسة.
- source_word: βοσκομένη
  choice: يرعى
  rationale: اسم الفاعل المضارع يصف القطيع وهو يأكل في المرعى؛ و«يرعى» موجزة وطبيعية في العربية ولا تضيف وجود رعاة غير مذكورين.
