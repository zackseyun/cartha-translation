  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: ar
  text: ولمّا رأى يسوع جموعًا كثيرة حوله، أمر بالذهاب إلى الجهة الأخرى.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ولما رأى
  rationale: تنقل اسم الفاعل الظرفي مع أداة الربط δέ بسياق عربي طبيعي، من غير إضافة معنى زمني مثل «الآن» لا يصرّح به الأصل.
- source_word: πολλοὺς ὄχλους
  choice: جموعًا كثيرة
  rationale: تحافظ على صيغة الجمع في ὄχλους وعلى دلالة الكثرة في πολλούς.
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: يعكس فعل إصدار الأمر بوضوح وإيجاز.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: أن يعبروا إلى الضفة الأخرى
  rationale: «الضفة الأخرى» تعبير عربي واضح عن τὸ πέραν في سياق عبور البحيرة، و«يعبروا» يجعل الحركة المقصودة طبيعية بالعربية.
theological_decisions:
- issue: الفاعل الضمني في المصدر ἀπελθεῖν
  choice: أن يعبروا
  alternative: أن يذهب
  rationale: المصدر اليوناني لا يصرّح بفاعله؛ اختير الجمع بحسب السياق، إذ الأمر موجّه إلى المرافقين للانتقال إلى الضفة الأخرى، من غير حصرهم صراحة في التلاميذ.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع إبقاء «جموعًا كثيرة» وفاءً لصيغة الجمع اليونانية وتجنب «الآن» التي لا يقابلها لفظ صريح في المصدر.
