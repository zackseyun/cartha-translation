lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: ولما نزل
  rationale: نُقلت صيغة المضاف المطلق مع اسم الفاعل الماضي إلى جملة زمنية عربية طبيعية. وتؤدي الواو معنى δέ الربطي الخفيف من غير مبالغة في إبراز مقابلة.
- source_word: ἀπὸ τοῦ ὄρους
  choice: من الجبل
  rationale: «الجبل» هو المعنى الطبيعي هنا، مع أل التعريف التي تربط الموضع بسياق الموعظة السابق.
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعته
  rationale: الفعل «تبع» مع ضمير المفعول صياغة عربية موجزة وطبيعية تؤدي معنى الفعل اليوناني ومتممه في حالة المجرور غير المباشر.
- source_word: ὄχλοι πολλοί
  choice: جموع كثيرة
  rationale: يحفظ هذا التعبير جمع ὄχλοι ودلالة πολλοί على الكثرة، وهو عربي فصيح وطبيعي من غير تحويل العبارة إلى المفرد.
