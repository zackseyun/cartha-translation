id: MAT.8.26
reference: Matthew 8:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: ar
  text: 'فقال لهم: «لماذا أنتم خائفون، يا قليلي الإيمان؟» ثم قام وانتهر الرياح والبحر، فحدث هدوء عظيم.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: خائفون
  rationale: تنقل معنى الخوف والجبن في السياق بلفظ عربي طبيعي، من غير أن تضيف حكمًا أخلاقيًا أقوى مما يقتضيه النص.
- source_word: ὀλιγόπιστοι
  choice: قليلي الإيمان
  rationale: ترجمة مباشرة للتعبير اليوناني، وتحافظ على صيغة المخاطبة والتوبيخ.
- source_word: ἐγερθεὶς
  choice: قام
  rationale: صياغة عربية موجزة وطبيعية لاسم الفاعل الظرفي، وتناسب سياق نهوضه من النوم.
- source_word: ἐπετίμησεν
  choice: انتهر
  rationale: يحفظ قوة فعل الزجر الموجَّه إلى الرياح والبحر.
- source_word: γαλήνη μεγάλη
  choice: هدوء عظيم
  rationale: يعكس وصف السكون الشديد بعد اضطراب البحر، ويحافظ على صفة العظمة في الأصل.
theological_decisions:
- issue: وصف التلاميذ بقلة الإيمان
  choice: يا قليلي الإيمان
  alternative: يا ضعيفي الإيمان
  rationale: الخيار المختار أقرب إلى تركيب ὀλιγόπιστοι ولا يحوّل «القلة» إلى مفهوم «الضعف».
- issue: ترتيب قيام يسوع وانتهاره للعاصفة
  choice: ثم قام وانتهر
  alternative: ثم، بعدما نهض، انتهر
  rationale: يحافظ على التعاقب السردي في الأصل بصياغة عربية طبيعية، من غير استنتاجات تفسيرية إضافية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ الاستفهام التوبيخي، والخطاب المباشر، وقوة فعل الانتهار، مع تجنب الحرفية المتعثرة.
