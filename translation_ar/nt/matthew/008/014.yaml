  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: ar
  text: ولمّا جاء يسوع إلى بيت بطرس، رأى حماة بطرس طريحةً ومحمومةً.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: مطروحةً ومصابةً بالحمّى. لا يذكر النص اليوناني السرير صراحةً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ولمّا جاء
  rationale: ينقل قوة اسم الفاعل الماضي الزمنية بصياغة عربية طبيعية، من غير تكلف حرفي مثل «إذ كان قد جاء».
- source_word: οἰκίαν Πέτρου
  choice: بيت بطرس
  rationale: ترجمة مباشرة وطبيعية للإضافة الدالة على الملكية، و«بيت» أوضح وأشيع من بدائل أكثر رسمية.
- source_word: πενθερὰν αὐτοῦ
  choice: حماة بطرس
  rationale: «الحماة» هي أم الزوج أو الزوجة، والسياق يبين أن الضمير يعود إلى بطرس. أُظهر الاسم بدل الضمير لتجنب توهم عوده إلى يسوع.
- source_word: βεβλημένην
  choice: طريحةً
  rationale: يفيد اسم المفعول التام حالة كونها ملقاة أو مضطجعة بسبب المرض. «طريحة» عربية موجزة وطبيعية، ولا تضيف السرير غير المذكور صراحة.
- source_word: πυρέσσουσαν
  choice: محمومةً
  rationale: تنقل بدقة حال إصابتها بالحمى بصياغة عربية موجزة، وتحافظ على توازي الوصفين الحاليين.
theological_decisions:
- issue: مرجع الضمير αὐτοῦ في عبارة «حماته»
  choice: المرأة هي حماة بطرس، ولذلك صيغت «حماة بطرس»
  alternative: «حماته»، وهي أقرب شكليًا إلى الضمير اليوناني لكنها قد توهم القارئ العربي أن المرجع هو يسوع
  rationale: التركيب والسياق يجعلان بطرس مرجع الضمير. إظهار الاسم يزيل غموضًا عربيًا عارضًا من غير إضافة استنتاج لاهوتي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «طريحة» بمعنى مضطجعة بسبب المرض، و«محمومة» للدلالة المباشرة على الحمى، مع تجنب إضافة «في الفراش» لأنها مفهومة من السياق وليست صريحة في الأصل.
