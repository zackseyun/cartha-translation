  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: ar
  text: 'فأجاب قائد المئة: «يا رب، لستُ أهلًا لأن تدخل تحت سقفي. لكن قُلْ كلمةً فقط[a]، فيُشفى خادمي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «قُلِ الكلمة». واليونانية أقرب حرفيًا إلى «قُلْ كلمةً».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية أيضًا «فتاي» أو «صبيي»، بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἔφη
  choice: فأجاب
  rationale: يجمع التعبير العربي الطبيعي بين اسم الفاعل الدال على الرد وفعل القول، ويتجنب التكرار الحرفي الثقيل «أجاب وقال».
- source_word: ἑκατόνταρχος
  choice: قائد المئة
  rationale: تعبير عربي واضح ودقيق للضابط الذي يقود نحو مئة جندي، من غير حاجة إلى تعريب اللقب الروماني.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ معنى الخطاب الاحترامي واحتماله اللاهوتي عند توجيهه إلى يسوع، من غير حصره في مجرد «يا سيدي».
- source_word: ἱκανὸς
  choice: أهلًا
  rationale: «لست أهلًا» تعبير عربي طبيعي عن عدم الاستحقاق أو الجدارة في هذا السياق، لا عن العجز الجسدي.
- source_word: ὑπὸ τὴν στέγην
  choice: تحت سقفي
  rationale: يحافظ على الصورة اليونانية الحية بدل تسويتها إلى «بيتي» فقط.
- source_word: μόνον εἰπὲ λόγῳ
  choice: قُلْ كلمةً فقط
  rationale: صياغة واضحة وقريبة من اليونانية، وتحفظ القوة التقييدية لـ«فقط».
- source_word: ἰαθήσεται
  choice: فيُشفى
  rationale: ينقل المستقبل المبني للمجهول بصياغة عربية موجزة وطبيعية، مع بقاء فاعل الشفاء غير مصرّح به كما في الأصل.
- source_word: παῖς
  choice: خادمي
  rationale: السياق العسكري والمنزلي، مع الرواية الموازية، يرجح معنى الخادم؛ وتُحفظ الدلالات الممكنة الأخرى في الحاشية.
theological_decisions:
- issue: دلالة Κύριε في خطاب يسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» تحفظ القيمة المعجمية وإمكان الصدى المسيحاني، من غير أن تفرض أن المتكلم عبّر هنا عن اعتراف لاهوتي كامل.
- issue: دلالة παῖς
  choice: خادمي
  alternative: فتاي أو صبيي
  rationale: اللفظة اليونانية قد تدل على خادم أو فتى أو طفل. اختير «خادمي» لملاءمته السياق، مع إبقاء الغموض المعجمي الحقيقي في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كتابية كريمة. استُخدم «قائد المئة» بدل اللفظ المعرّب الأقل تداولًا، وحُفظت صورة «تحت سقفي» وغموض παῖς في الحاشية.
