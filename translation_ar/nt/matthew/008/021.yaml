  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: ar
  text: 'وقال له آخرُ من التلاميذ: «يا رب، اسمح لي[a] أن أنصرف أولًا وأدفن أبي».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ائذن لي» أو «دعني».'
    reason: lexical_alternative
  - marker: b
    text: قد يكون المقصود دفن الأب فورًا، وقد يكون أوسع من ذلك، أي البقاء لأداء واجب البنوة إلى أن يموت؛ فالنص اليوناني لا يحدد الأمر.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: وقال له واحدٌ آخر من التلاميذ
  rationale: تنقل العبارة انتماء المتكلم إلى التلاميذ وكونه شخصًا آخر غير المتكلم السابق، مع جعل δέ رابطًا سرديًا طبيعيًا بالواو.
- source_word: Κύριε
  choice: يا رب
  rationale: الصيغة العربية المألوفة للنداء، وتحفظ دلالة الاحترام وما قد يحمله اللقب من وزن لاهوتي.
- source_word: ἐπίτρεψόν μοι
  choice: اسمح لي
  rationale: طلب صريح ومهذب للإذن، وهو طبيعي وواضح في العربية المعاصرة.
- source_word: πρῶτον
  choice: أولًا
  rationale: تحفظ أولوية الفعل في الترتيب من غير زيادة تفسيرية.
- source_word: ἀπελθεῖν
  choice: أن أذهب
  rationale: فعل عربي طبيعي في هذا السياق؛ ولا يلزم إظهار معنى الابتعاد مستقلًا لأن المقام يفيده.
- source_word: θάψαι τὸν πατέρα μου
  choice: وأدفن أبي
  rationale: ترجمة مباشرة وموجزة لطلب دفن الأب.
theological_decisions:
- issue: هل كان الأب قد مات بالفعل أم أن الطلب يشير إلى البقاء معه حتى وفاته؟
  choice: إبقاء العبارة في المتن طلبًا مباشرًا للذهاب ودفن الأب دون تحديد زمن الوفاة
  alternative: تفسيرها إما بدفن عاجل بعد وفاة الأب، وإما بأداء واجب البنوة إلى أن يموت لاحقًا
  rationale: النص اليوناني لا يحسم توقيت وفاة الأب، ولذلك لا ينبغي للترجمة أن تختار أحد التفسيرين ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «اسمح لي» بدل «ائذن لي» لسهولة الفهم مع بقاء الاحترام، وحُفظ الغموض المتعلق بتوقيت دفن الأب في الحاشية.
