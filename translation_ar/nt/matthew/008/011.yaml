  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: ar
  text: وأقول لكم إن كثيرين سيأتون من المشرق والمغرب[b]، ويتكئون إلى المائدة[a] مع إبراهيم وإسحاق ويعقوب في ملكوت السماوات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي يتخذون أماكنهم لتناول الطعام بحسب عادة الولائم القديمة، حيث كان الضيوف يتكئون حول المائدة.
    reason: cultural_note
  - marker: b
    text: يرجح أن عبارة «من المشرق والمغرب» تشير إلى مجيء أناس من مناطق بعيدة، بمن فيهم أناس من خارج إسرائيل.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: وأقول لكم
  rationale: تفيد δέ انتقالًا أو مقابلة خفيفة، وتحافظ الواو على هذا التطور في الكلام من غير تشديد المقابلة أكثر مما يقتضيه النص.
- source_word: πολλοὶ
  choice: كثيرين
  rationale: الصفة مستعملة استعمال الاسم، وصيغة «كثيرين» طبيعية بعد «إن» ولا تستلزم إضافة فئة لم يصرح بها النص.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: من المشرق والمغرب
  rationale: الجمعان اليونانيان تعبيران اصطلاحيان عن الجهات أو الأقاليم الشرقية والغربية؛ والصياغة العربية تنقل المعنى الجغرافي الواسع بوضوح.
- source_word: ἥξουσιν
  choice: سيأتون
  rationale: تنقل معنى المجيء أو الوصول بصياغة عربية مباشرة وطبيعية.
- source_word: ἀνακλιθήσονται
  choice: يتكئون إلى المائدة
  rationale: يحفظ التعبير صورة الاتكاء عند تناول الطعام في الولائم القديمة، مع ذكر المائدة لتوضيح المقصود للقارئ الحديث.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: مع إبراهيم وإسحاق ويعقوب
  rationale: تنقل μετά مع المجرور معنى المصاحبة والمشاركة في الوليمة، مع استعمال الصيغ العربية المألوفة لأسماء الآباء.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: في ملكوت السماوات
  rationale: يحافظ هذا التعبير على صيغة متى المميزة وعلى جمع «السماوات» في الأصل، وهو تعبير عربي كتابي واضح ومألوف.
theological_decisions:
- issue: صورة الوليمة والشركة الأخروية
  choice: الإبقاء على صورة الاتكاء إلى المائدة
  alternative: الجلوس مع إبراهيم وإسحاق ويعقوب
  rationale: يشير الفعل إلى المشاركة في وليمة، لا إلى مجرد الوجود المكاني؛ لذلك حُفظت صورة الطعام من غير إضافة تفاصيل عقائدية لا يذكرها النص.
- issue: هوية الكثيرين الآتين من المشرق والمغرب
  choice: الإبقاء على الوصف الجغرافي من غير التصريح بأنهم من الأمم
  alternative: سيأتي كثيرون من الأمم من المشرق والمغرب
  rationale: قد يدل السياق على شمول أناس من خارج إسرائيل، لكن النص اليوناني يقول «كثيرون» ولا يسميهم صراحة «الأمم»، فبقي الإيحاء دون تحويله إلى تصريح.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «وأقول لكم» للمقابلة الخفيفة، و«يتكئون إلى المائدة» للحفاظ على صورة الوليمة، و«ملكوت السماوات» لموافقة اصطلاح متى وصيغة الأصل.
