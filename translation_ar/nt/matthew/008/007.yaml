  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: ar
  text: 'فقال له[a]: «سآتي وأشفيه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أآتي وأشفيه؟» يفهم بعض المفسرين كلام يسوع سؤالًا بالنظر إلى السياق، لكن الصياغة اليونانية نفسها تُقرأ بطبيعتها على أنها خبر.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: تربط الجملة بسياق السرد ربطًا طبيعيًا من غير إضافة دلالة زمنية أو استنتاجية زائدة.
- source_word: λέγει
  choice: قال
  rationale: هو مضارع تاريخي في السرد اليوناني، والماضي «قال» هو الأسلوب الطبيعي الجاري في السرد العربي مع الحفاظ على الحدث نفسه.
- source_word: αὐτῷ
  choice: له
  rationale: ينقل المفعول غير المباشر بوضوح وإيجاز.
- source_word: Ἐγὼ
  choice: ضمير المتكلم المستتر في «سآتي»
  rationale: الفعل العربي يحدد المتكلم بوضوح؛ ولا يقتضي الضمير اليوناني هنا إضافة «أنا» بتوكيد قد يكون أثقل من الأصل.
- source_word: ἐλθὼν
  choice: سآتي و
  rationale: اسم الفاعل الأوريستي يدل على فعل مصاحب أو سابق للفعل الرئيس؛ وصيغة «سآتي وأشفيه» تنقل التتابع بأسلوب عربي طبيعي.
- source_word: θεραπεύσω
  choice: أشفي
  rationale: في سياق المرض، «أشفي» هو المقابل العربي المباشر والطبيعي للفعل.
- source_word: αὐτόν
  choice: ـه
  rationale: الضمير المتصل يعود بوضوح إلى الغلام المريض المذكور في السياق.
theological_decisions:
- issue: هل تُفهم العبارة خبرًا أم سؤالًا؟
  choice: 'خبر: «سآتي وأشفيه»'
  alternative: 'سؤال: «أآتي وأشفيه؟»'
  rationale: لا تتضمن الصياغة اليونانية أداة استفهام، والقراءة الطبيعية لها خبرية. ومع ذلك، يجيز السياق عند بعض المفسرين فهمها سؤالًا، ولذلك تُذكر هذه الإمكانية في الحاشية من غير فرضها على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل الماضي العربي الطبيعي للسرد، مع إبقاء الجواب مباشرًا وموجزًا، وإثبات علامة الحاشية في المتن.
