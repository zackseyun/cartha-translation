base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: ar
  text: 'وقال يسوع لقائد المئة: «اذهب، وليكن لك كما آمنت». فشُفي الخادم[a] في تلك الساعة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الصبي» أو «الطفل»؛ فالكلمة اليونانية παῖς قد تدل على خادم أو على صغير السن. والأنسب في هذا السياق «الخادم»، لأنه تابع لقائد المئة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: قائد المئة
  rationale: تعبير عربي دقيق ومألوف للضابط الروماني الذي كان يقود وحدة قوامها نحو مئة جندي.
- source_word: Ὕπαγε
  choice: اذهب
  rationale: ينقل فعل الأمر الدال على الانصراف بوضوح، من غير إضافة معنى غير مصرّح به.
- source_word: ὡς ἐπίστευσας
  choice: كما آمنت
  rationale: يحافظ على الصيغة الفعلية الشخصية وعلى دلالة الفعل الماضي، بدل تحويل العبارة إلى اسم مثل «بحسب إيمانك».
- source_word: γενηθήτω σοι
  choice: وليكن لك
  rationale: ينقل قوة صيغة الأمر الغائبة في اليونانية بعبارة عربية طبيعية، مع إبقاء الفعل عامًا كما في الأصل وعدم تحديد كيفية تحققه.
- source_word: παῖς
  choice: الخادم
  rationale: يلائم سياق تابع قائد المئة، ويوافق الإشارة إليه في سياق المقطع، مع حفظ احتمال معنى «الصبي» أو «الطفل» في الحاشية.
- source_word: ἰάθη
  choice: شُفي
  rationale: ينقل المبني للمجهول ودلالة الشفاء أو استعادة العافية بصورة مباشرة.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: في تلك الساعة
  rationale: ترجمة قريبة من التعبير الزمني اليوناني، وتحفظه دون حصره تفسيرًا في لحظة آنية بعينها.
theological_decisions:
- issue: دلالة لغة الإيمان في ἐπίστευσας
  choice: آمنت
  alternative: وثقت؛ كان لك إيمان
  rationale: «آمنت» هو المقابل المباشر المألوف للفعل، ويحفظ كون النص يصف فعل قائد المئة بدل أن يحوله إلى عبارة اسمية أو يضيّق دلالته إلى الثقة وحدها.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على إيجاز الأصل وترتيب عباراته قدر الإمكان. وُضع مؤشر الحاشية بعد «الخادم» لأنه يشرح الكلمة اليونانية παῖς.
