  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ar
  text: بل ماذا خرجتم لتروا؟ أنبيًّا؟ نعم، أقول لكم، وأكثر من نبيّ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأعظم من نبيّ». واليونانية حرفيًّا: «وأكثر من نبيّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الانتقال مع مقابلة السؤال البلاغي السابق، و«بل» فصيحة وطبيعية في هذا السياق.
- source_word: τί ἐξήλθατε
  choice: ماذا خرجتم
  rationale: تحافظ «ماذا» على كون τί استفهامًا عن الشيء الذي خرجوا لرؤيته، لا عن سبب الخروج بصيغة «لماذا».
- source_word: ἰδεῖν
  choice: لتروا
  rationale: تؤدي لام التعليل مع الفعل غرض الخروج الذي يعبّر عنه مصدر الغاية في اليونانية، بصياغة عربية واضحة.
- source_word: προφήτην
  choice: نبيًّا
  rationale: 'النكرة ملائمة للسؤال البلاغي، وحالة النصب تتبع موقعها في الجملة العربية المقدّرة: ألتروا نبيًّا؟'
- source_word: ναί
  choice: نعم
  rationale: جواب إثبات مباشر وطبيعي للسؤال البلاغي.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يحافظ على صيغة الخطاب المباشرة المألوفة في أقوال يسوع دون توسع تفسيري.
- source_word: καὶ περισσότερον προφήτου
  choice: وأكثر من نبيّ
  rationale: يحافظ على المقارنة وعلى الإيجاز البياني في الأصل، حيث لا يُصرَّح بوجه كون يوحنا أكثر من نبي، ولا يُضاف اسم أو تفسير غير موجود.
theological_decisions:
- issue: هوية يوحنا المعمدان ومكانته في قول يسوع
  choice: وأكثر من نبيّ
  alternative: وأعظم من نبيّ
  rationale: الصياغة المختارة تبقي العبارة المقارنة موجزة ومفتوحة كما في اليونانية، فتؤكد أن مكانة يوحنا تتجاوز فئة النبي من غير تحديد وجه ذلك أو إدخال تفسير لاهوتي إضافي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم السؤال المقتضب «أنبيًّا؟» للمحافظة على تتابع الأسئلة البلاغية، وأُبقيت عبارة «وأكثر من نبيّ» على إيجاز الأصل وغموض وجه المقارنة المقصود.
