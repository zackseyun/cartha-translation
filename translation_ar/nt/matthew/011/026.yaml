  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: ar
  text: نَعَمْ، أَيُّهَا الآبُ، لِأَنَّ هَذَا كَانَ مَرْضِيًّا فِي نَظَرِكَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِأَنَّ هَكَذَا كَانَتْ مَسَرَّتُكَ»، أو: «لِأَنَّ هَذَا كَانَ مَوْضِعَ سُرُورِكَ».'
    reason: بدائل لفظية تعكس الصياغة الاسمية في اليونانية وإمكان التعبير عنها بمعنى الرضا أو المسرّة.
lexical_decisions:
- source_word: ναί
  choice: نَعَمْ
  rationale: أداة تصديق وموافقة مباشرة، وهي الأنسب في سياق الصلاة.
- source_word: ὁ πατήρ
  choice: أَيُّهَا الآبُ
  rationale: الاسم مرفوع في اليونانية لكنه مستعمل للنداء؛ وصيغة «أيها الآب» عربية فصيحة وواضحة.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تفيد هنا التعليل، إذ تبيّن أساس هذا الإقرار.
- source_word: οὕτως
  choice: هَذَا
  rationale: تشير إلى طريقة عمل الآب المذكورة في الآية السابقة؛ و«هذا» أوضح في التركيب العربي من النقل الحرفي «هكذا كان».
- source_word: εὐδοκία ἐγένετο
  choice: كَانَ مَرْضِيًّا
  rationale: ينقل معنى ما هو موضع رضا أو سرور، مع تجنب تحميل العبارة معنى «القصد» أو «القرار» وحده.
- source_word: ἔμπροσθέν σου
  choice: فِي نَظَرِكَ
  rationale: تعبير عربي طبيعي يؤدي المعنى الاصطلاحي «أمامك/في حضرتك» بوصفه تقييمًا أو رضا.
theological_decisions:
- issue: هل تدل εὐδοκία هنا على رضا الآب وسروره أم على قصده ومشيئته المقررة؟
  choice: صياغة العبارة بما يدل على أن هذا كان مرضيًا في نظر الآب
  alternative: لأن هكذا كانت مسرّتك؛ أو لأن ذلك كان بمقتضى مشيئتك الصالحة
  rationale: اللفظ اليوناني يحتمل معنى السرور والرضا، وقد يتضمن ما يختاره الآب، لكنه لا يفرض وحده معنى تقنيًا عن قضاء إلهي؛ لذلك تُرك التوتر اللاهوتي دون حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «أيها الآب» للنداء، و«مرضيًّا في نظرك» لتقديم تركيب عربي طبيعي مع حفظ معنى الرضا الإلهي من غير تضييقه إلى مفهوم عقائدي محدد.
