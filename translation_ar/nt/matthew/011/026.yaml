  naturalness: «نَعَمْ، أَيُّهَا الآبُ، لِأَنَّ هَذَا كَانَ مَرْضِيًّا فِي نَظَرِكَ» فصيح وواضح وطبيعي في العربية المعيارية المعاصرة، مع وقار مناسب لسياق الصلاة.
  terminology: «مَرْضِيًّا فِي نَظَرِكَ» يعبر عن εὐδοκία ἐγένετο ἔμπροσθέν σου بوصفه رضا أو استحسانًا، ولا يفرض معنى تقنيًا عن القضاء أو المشيئة المقررة. وموضع الحاشية بعد الجملة سليم، وبدائلها مرتبطة باللفظ اليوناني.
