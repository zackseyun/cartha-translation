lexical_decisions:
- source_word: ὁ ἔχων
  choice: مَنْ لَهُ
  rationale: التركيب اليوناني، وهو أداة تعريف مع اسم فاعل، مستعمل استعمالًا اسميًّا عامًا. وصيغة «مَنْ لَهُ» عربية طبيعية تحفظ المعنى العام والإفراد النحوي من غير تكلّف.
- source_word: ὦτα
  choice: أُذُنانِ
  rationale: الكلمة اليونانية جمع، لكن العربية الفصيحة تستعمل المثنى طبيعيًّا لعضوي الجسد المزدوجين عند الفرد؛ لذلك تنقل «أُذُنانِ» المعنى المقصود بدقة ووضوح.
- source_word: ἀκουέτω
  choice: فَلْيَسْمَعْ
  rationale: فعل أمر للغائب في المضارع، وصيغة «فَلْيَسْمَعْ» تقابله مباشرة وتحفظ سعة معنى السماع الذي قد يتضمن الإصغاء والاستجابة.
theological_decisions:
- issue: العبارة العامة المذكرة المفردة
  choice: مَنْ لَهُ أُذُنانِ فَلْيَسْمَعْ
  alternative: كل من له أذنان فليسمع
  rationale: «مَنْ» تفيد العموم مع بقاء الضمير والفعل في صيغة المفرد المذكر المطابقة للبنية اليونانية، من غير حصر الدعوة في شخص بعينه.
