  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: ar
  text: لِأَنَّ نِيرِي لَطِيفٌ[a]، وَحِمْلِي خَفِيفٌ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: هَيِّن، أي سهل الحمل.'
    reason: توضح الدلالة السياقية الممكنة للكلمة اليونانية χρηστός، التي قد تصف النير بأنه لطيف أو صالح، وقد تفيد أيضًا أنه هين الحمل.
lexical_decisions:
- source_word: ζυγός
  choice: نِير
  rationale: المقابل العربي الدقيق لصورة النير الذي يوضع على الدواب، ويحافظ على الاستعارة التي تصف الخضوع لتعليم يسوع وسلطانه.
- source_word: χρηστός
  choice: لطيف
  rationale: تدل الكلمة على ما هو صالح أو رحيم أو حسن المعاملة، وقد تفيد في هذا السياق أيضًا أن النير هين الحمل. يحفظ «لطيف» وصف النير بطبيعته الخيّرة بدل اختزال المعنى في السهولة وحدها.
- source_word: φορτίον
  choice: حِمل
  rationale: لفظ عربي طبيعي يحافظ على الموازاة بين النير والحمل.
- source_word: ἐλαφρόν
  choice: خفيف
  rationale: المقابل المباشر والطبيعي، وهو يحافظ على التضاد الضمني مع الحمل الثقيل.
theological_decisions:
- issue: دلالة χρηστός في وصف نير يسوع
  choice: لطيف
  alternative: هَيِّن
  rationale: «هَيِّن» يبرز سهولة حمل النير، وهي دلالة سياقية معتبرة، لكن «لطيف» يحافظ بصورة أوضح على معنى الصلاح والرفق الكامن في الكلمة، مع إثبات البديل في الحاشية دون حسم التوتر الدلالي.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة، تحافظ على استعارة النير وعلى التوازي الإيقاعي بين «نيري لطيف» و«حملي خفيف».
