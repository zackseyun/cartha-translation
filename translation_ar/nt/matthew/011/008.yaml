  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: ar
  text: بل ماذا خرجتم لتروا؟ أرجلًا مرتديًا ثيابًا ناعمة[a]؟ ها إن الذين يلبسون الثياب الناعمة هم في بيوت الملوك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مرتديًا ثيابًا فاخرة». تشير اليونانية حرفيًا إلى أشياء أو ثياب «ناعمة»، بما يوحي بلباس رقيق أو مترف.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في القصور الملكية». واليونانية حرفيًا: «في بيوت الملوك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الانتقال إلى سؤال مقابل ضمن سلسلة من الأسئلة البلاغية، و«بل» طبيعية ومباشرة في العربية.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ماذا خرجتم لتروا؟
  rationale: تنقل τί بوصفها سؤالًا عن الشيء المرئي، وتحافظ على تركيب الغرض الذي يؤديه المصدر ἰδεῖν مع فعل الخروج.
- source_word: ἄνθρωπον
  choice: أرجلًا
  rationale: السياق يشير إلى يوحنا، والترجمة بالمذكر المفرد توافق المرجع المباشر وتحافظ على صيغة السؤال البلاغي.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: لابسًا ثيابًا ناعمة
  rationale: تحافظ على الصورة الحرفية للثياب «الناعمة»، مع بقاء دلالة الرقة والترف مفهومة من السياق دون إدخالها في المتن تفسيرًا ملزمًا.
- source_word: ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه عربية معاصرة فصيحة تحفظ القوة الالتفاتية للأصل دون استعمال صيغة مهجورة.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: الذين يلبسون الثياب الناعمة
  rationale: تحافظ على التكرار المعجمي لـ«الناعمة» وعلى دلالة φοροῦντες في الاعتياد على اللبس.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: هم في بيوت الملوك
  rationale: ترجمة قريبة من صيغة الجمع في اليونانية، وتبقي عبارة «القصور الملكية» بوصفها بديلًا تفسيريًا في الحاشية.
