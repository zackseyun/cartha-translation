  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: ar
  text: 'وبينما كان هؤلاء ينصرفون، بدأ يسوع يقول للجموع عن يوحنا: «ماذا خرجتم إلى البرية لتشاهدوا؟[a] أقصبةً تهزّها الريح؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لتروا؟»'
    reason: بديل معجمي مباشر للفعل θεάομαι.
  - marker: b
    text: توحي صورة القصبة التي تهزّها الريح بعدم الثبات أو التردد، والسؤال ينتظر جوابًا بالنفي في شأن يوحنا.
    reason: إيضاح الصورة البلاغية وقوة السؤال الخطابي من غير إدخال التفسير في المتن.
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: وبينما كان هؤلاء منصرفين
  rationale: ينقل تركيب المضاف المطلق الدال على فعل متزامن، ويحافظ على اسم الإشارة «هؤلاء» الذي يعود في السياق السابق إلى تلاميذ يوحنا، من غير إدخال هذا التحديد في متن الآية.
- source_word: ἤρξατο ὁ Ἰησοῦς λέγειν
  choice: بدأ يسوع يتحدث ... فقال
  rationale: يحفظ معنى البدء في الكلام، وتأتي «فقال» تمهيدًا طبيعيًا للاقتباس المباشر في العربية.
- source_word: τοῖς ὄχλοις
  choice: إلى الجموع
  rationale: يحافظ على صيغة الجمع في اليونانية، وهو تعبير عربي فصيح وواضح.
- source_word: περὶ Ἰωάννου
  choice: عن يوحنا
  rationale: ينقل معنى الموضوع أو المرجع الذي تدل عليه περί مع المضاف إليه.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: ماذا خرجتم إلى البرية لتشاهدوا؟
  rationale: «ماذا» تحافظ على السؤال عن الشيء لا عن السبب، و«لتشاهدوا» تنقل دلالة النظر المقصود إلى مشهد، مع إثبات البديل الأبسط في الحاشية.
- source_word: κάλαμον
  choice: أقصبةً
  rationale: المعنى المعجمي المباشر هو نبات القصب، وقد حُفظ الإفراد والنكرة في الصورة البلاغية.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: تهزّها الريح
  rationale: صياغة عربية طبيعية تنقل كون القصبة واقعة تحت تأثير الريح، وتحفظ قوة σαλεύω الدالة على الهز أو الزعزعة.
theological_decisions:
- issue: مرجع اسم الإشارة Τούτων
  choice: الإبقاء على «هؤلاء» في المتن
  alternative: التصريح بقول «تلاميذ يوحنا» اعتمادًا على السياق السابق
  rationale: الإبقاء على الصياغة القريبة من الأصل يمنع إدخال التفسير السياقي في المتن، مع بقاء المرجع واضحًا عند قراءة السياق.
- issue: الدلالة البلاغية لصورة القصبة التي تهزها الريح
  choice: الإبقاء على الصورة في المتن وشرح إيحائها في الحاشية
  alternative: تفسيرها داخل المتن بأنها ترمز إلى شخص متقلب أو متردد
  rationale: الصورة نفسها هي كلام النص، أما دلالة عدم الثبات فهي استنتاج بلاغي قوي ينبغي ألا يحل محل الصورة الأصلية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «البرية» للمكان القفر في السياق اليهودي، و«الجموع» للمحافظة على جمع الأصل. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحهما كل حاشية.
