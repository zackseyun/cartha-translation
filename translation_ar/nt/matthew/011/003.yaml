  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: ar
  text: 'وقال له: «أأنت الآتي[a]، أم ننتظر آخر؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذي يأتي» أو «العتيد أن يأتي». يمكن أن تُستعمل العبارة اليونانية لقبًا مسيانيًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: وقال له
  rationale: الفعل الماضي يعني «قال»، وأُضيفت الواو لربط الكلام بسياقه السردي السابق ربطًا طبيعيًا في العربية.
- source_word: Σὺ εἶ
  choice: أأنت
  rationale: الاستفهام بالهمزة مع الضمير المنفصل يحفظ إبراز الضمير اليوناني ويأتي عربيًا موجزًا وطبيعيًا.
- source_word: ὁ ἐρχόμενος
  choice: الآتي
  rationale: اسم الفاعل المعرّف يحفظ الصياغة الموصولة أو اللقبية في اليونانية من غير أن يستبدلها صراحةً بلقب «المسيح».
- source_word: ἢ
  choice: أم
  rationale: «أم» هي الأنسب في سؤال التعيين الذي يعرض بديلين.
- source_word: ἕτερον
  choice: آخر
  rationale: تحفظ معنى شخص آخر أو مختلف من غير زيادة تفسيرية.
- source_word: προσδοκῶμεν
  choice: ننتظر
  rationale: ينقل معنى الترقب والانتظار في السؤال التداولي؛ والسياق يجعل دلالة التوقع حاضرة أيضًا.
theological_decisions:
- issue: القوة المسيانية أو اللقبية لعبارة ὁ ἐρχόμενος
  choice: الآتي
  alternative: الذي يأتي؛ المنتظر
  rationale: تحفظ «الآتي» احتمال كون التعبير لقبًا معروفًا للشخص المنتظر، مع إبقاء دلالته الحرفية وعدم التصريح بما يتجاوز النص، مثل «المسيح».
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية كريمة. استُعملت «أأنت» لإظهار التوكيد في الضمير، و«أم» لتناسب السؤال البديل.
