lexical_decisions:
- source_word: Τίνι
  choice: بمَن
  rationale: اسم الاستفهام في صيغة الداتيف يبيّن الطرف الذي يُشبَّه به هذا الجيل. واختيار «بمَن» طبيعي في العربية لأن المذكور لاحقًا أطفال، مع بقاء السؤال مفتوحًا حتى يأتي الجواب.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد الأداة انتقالًا فيه شيء من المقابلة؛ و«ولكن» تنقل هذا التحول البلاغي من غير مبالغة.
- source_word: ὁμοιώσω
  choice: أُشبِّه
  rationale: المستقبل اليوناني هنا في سؤال بلاغي تداولي، والمضارع العربي «أُشبِّه» هو التعبير الطبيعي عن هذا التداول.
- source_word: γενεὰν ταύτην
  choice: هذا الجيل
  rationale: تحافظ العبارة على الدلالة المألوفة للفظ γενεά في أقوال يسوع، أي أهل الجيل المعاصر بوصفهم جماعة.
- source_word: ὁμοία ἐστὶν
  choice: إنه يشبه
  rationale: صياغة عربية مباشرة وطبيعية تؤدي معنى المشابهة، ويعود الضمير على «هذا الجيل».
- source_word: παιδίοις
  choice: أطفالًا
  rationale: تدل الكلمة على الأطفال عمومًا، ولا يقتضي السياق إبراز معنى التصغير بعبارة مثل «أطفال صغار».
- source_word: καθημένοις
  choice: جالسين
  rationale: يحفظ اسم الفاعل صورة الأطفال في حال جلوسهم ضمن المشهد.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: في الساحات العامة
  rationale: كانت ἀγορά ساحة عامة يجتمع فيها الناس وتُمارَس فيها التجارة؛ و«الساحات العامة» أوضح عربيًا من «الأسواق» وحدها، التي قد تُفهم بوصفها محالّ تجارية.
- source_word: ἃ
  choice: ــ
  rationale: لا تحتاج العربية إلى اسم موصول مستقل هنا، إذ يتصل الوصف «ينادون» مباشرةً بـ«أطفالًا».
- source_word: προσφωνοῦντα
  choice: ينادون
  rationale: تنقل فعل توجيه النداء بصوت مسموع، وهو الأنسب لمشهد الأطفال في مكان عام.
- source_word: τοῖς ἑτέροις
  choice: الآخرين
  rationale: يحافظ الاختيار على عدم تصريح اليونانية بهوية الآخرين، مع أن سياق التشبيه يرجح أنهم أطفال آخرون.
