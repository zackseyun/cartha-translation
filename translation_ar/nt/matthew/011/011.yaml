  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: ar
  text: '«الحق أقول لكم: لم يَقُمْ[a] بين المولودين من النساء[b] أعظم من يوحنا المعمدان؛ لكن الأصغر[c] في ملكوت السماوات أعظم منه.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم الفعل بمعنى «لم يُبعث» أو «لم يُقَم». وقد يعني الفعل اليوناني «قام/ظهر» أو «بُعث/أُقيم»؛ والمراد هنا على الأرجح ظهور شخص في مجرى التاريخ، لا القيامة من الموت.
    reason: lexical_alternative
  - marker: b
    text: «المولودون من النساء» تعبير سامي يعني البشر.
    reason: cultural_note
  - marker: c
    text: 'يمكن أيضًا: «الأقل شأنًا» أو «الأصغر مرتبة». استُعملت في اليونانية صيغة المقارنة، وقد تشير هنا إلى الأدنى منزلة في ملكوت السماوات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية واضحة ومهيبة تنقل افتتاح القول المؤكد ذي السلطان، من غير الاكتفاء بالنقل الصوتي «آمين».
- source_word: οὐκ ἐγήγερται
  choice: لم يَقُمْ
  rationale: ينقل الفعل بصيغة تدل على أنه لم يظهر أو يبرز في التاريخ أحد بهذه الصفة، مع إبقاء إمكان فهم المبني للمجهول في حاشية، وتجنب حصره في معنى القيامة.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: بين المولودين من النساء
  rationale: يحافظ على التعبير السامي الملموس الذي يعني البشر، وهو مفهوم في العربية الكتابية المعاصرة.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: أعظم من يوحنا المعمدان
  rationale: ينقل المقارنة مباشرة، وتُفهم أداة النفي مع الفعل على معنى عدم قيام أي شخص أعظم منه.
- source_word: τοῦ βαπτιστοῦ
  choice: المعمدان
  rationale: اللقب العربي الشائع والواضح ليوحنا، وهو ينقل وظيفته المعروفة في التعميد.
- source_word: ὁ δὲ μικρότερος
  choice: لكن الأصغر
  rationale: يحافظ على الصيغة المقارنة في اليونانية وعلى احتمال تعلقها بصغر المرتبة أو الشأن، من غير تحويلها حتمًا إلى صيغة التفضيل المطلقة «الأصغر على الإطلاق».
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: في ملكوت السماوات
  rationale: ينقل التعبير المتاوي المميز بصياغته العربية الراسخة، محافظًا على جمع «السماوات» في الأصل.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: أعظم منه
  rationale: مقارنة عربية طبيعية ومباشرة تحفظ المفارقة في القول.
theological_decisions:
- issue: وجه عظمة الأصغر في الملكوت بالنسبة إلى يوحنا
  choice: إبقاء المقارنة كما وردت من غير تفسير سبب كون الأصغر في الملكوت أعظم من يوحنا.
  alternative: تفسيرها صراحة بأنها امتياز عهد جديد، أو منزلة في تاريخ الخلاص، أو تفوق في القداسة الشخصية.
  rationale: النص نفسه لا يشرح أساس المقارنة، لذلك ينبغي الحفاظ على توترها اللاهوتي ومفارقتها بدل حسمها داخل الترجمة.
- issue: هل «الأصغر» صيغة تفضيل مطلقة أم مقارنة في المرتبة
  choice: ترجمة μικρότερος بـ«الأصغر» مع توضيح الاحتمال في الحاشية.
  alternative: «الأقل شأنًا» أو «الأصغر على الإطلاق».
  rationale: الصيغة اليونانية مقارنة، وقد يراد بها صاحب أدنى رتبة أو شأن؛ فلا يصح إخفاء هذا المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تلائم قولًا تعليميًا مؤكدًا. حُفظت التعابير الكتابية المألوفة مثل «الحق أقول لكم» و«ملكوت السماوات»، مع شرح ما قد يلتبس في الحواشي دون إدخال تفسير مذهبي في المتن.
