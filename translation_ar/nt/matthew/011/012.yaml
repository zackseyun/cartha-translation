    rationale: الحاشية تعالج خصوصاً βιάζεται؛ فوضع العلامة بعد «للعنف» يربطها مباشرة بالعبارة ذات القراءة البديلة.
  revised_text: ولكن منذ أيام يوحنا المعمدان إلى الآن، يتعرض ملكوت السماوات للعنف[a]، والعنيفون ينتزعونه.
