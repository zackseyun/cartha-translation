  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: ar
  text: ولكن منذ أيام يوحنا المعمدان إلى الآن، يتعرض ملكوت السماوات للعنف[a]، والعنيفون ينتزعونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملكوت السماوات يتقدم بقوة، وأصحاب القوة يستولون عليه». يمكن أيضاً فهم الفعل اليوناني المترجم «يتعرض للعنف» بمعنى وسطي أو لازم، لا بمعنى المبني للمجهول.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: ولكن منذ
  rationale: تفيد ἀπό ابتداء المدة، أما δέ فأداة انتقال أو استدراك خفيف؛ و«ولكن منذ» تحافظ على الانتقال في السياق من غير مبالغة في قوة التضاد.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: أيام يوحنا المعمدان
  rationale: صياغة عربية طبيعية تحافظ على صورة «الأيام» في التركيب اليوناني بدل تحويلها تفسيرياً إلى «زمن».
- source_word: ἕως ἄρτι
  choice: إلى الآن
  rationale: تعبير عربي مألوف يؤدي امتداد المدة من أيام يوحنا إلى حاضر المتكلم.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ملكوت السماوات
  rationale: يحافظ على تعبير متى المميز وعلى جمع οὐρανῶν، وهو تعبير عربي كتابي راسخ وواضح.
- source_word: βιάζεται
  choice: يُعانَى منه العنف
  rationale: يعكس القراءة المبنية للمجهول للفعل الغامض، أي إن الملكوت يتعرض للعنف، مع تجنب صياغة قد توحي بأن الملكوت نفسه يمارس العنف. وتُذكر القراءة الوسطية/اللازمة الممكنة في الحاشية.
- source_word: βιασταὶ
  choice: العنيفون
  rationale: اسم جمع يدل على أشخاص يتصفون بالقوة أو العنف؛ وهذه الصياغة تحافظ على الصلة اللفظية والدلالية بالفعل السابق من دون إضافة «رجال» غير الصريحة اسمياً في العربية.
- source_word: ἁρπάζουσιν αὐτήν
  choice: ينتزعونه
  rationale: الفعل «ينتزع» ينقل معنى الأخذ بالقوة الكامن في ἁρπάζω، والضمير المذكر يوافق «ملكوت» في العربية.
theological_decisions:
- issue: دلالة βιάζεται وعلاقتها بملكوت السماوات
  choice: 'القراءة المبنية للمجهول في المتن: «ملكوت السماوات يُعانَى منه العنف»'
  alternative: 'القراءة الوسطية/اللازمة: «ملكوت السماوات يتقدم بقوة، والأشداء يستولون عليه»'
  rationale: الصيغة اليونانية تحتمل أن يكون الملكوت متعرضاً للعنف، كما تحتمل أنه يشق طريقه أو يتقدم بقوة. تتناسب القراءة المبنية للمجهول مع ذكر العنيفين الذين ينتزعونه في الجملة التالية، لكن البديل له سند لغوي معتبر؛ لذلك حُفظ في الحاشية ولم تُحسم المسألة تفسيرياً.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. حُفظ التعبير المتّاوي «ملكوت السماوات»، وحُفظ الغموض الحقيقي في βιάζεται بوضع قراءة دفاعية في المتن والقراءة الوسطية في الحاشية.
