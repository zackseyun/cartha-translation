  to: ولكن منذ أيام يوحنا المعمدان إلى الآن، يتعرض ملكوت السماوات للعنف[a]، والعنيفون ينتزعونه.
  rationale: استُبدلت العبارة غير الطبيعية والملتبسة «يُعانَى منه العنف» بـ«يتعرض ... للعنف» لتدل بوضوح على أن الملكوت هو المتلقي للعنف في القراءة السلبية. وحُفظت القراءة الوسطية/اللازمة المتنازع عليها في الحاشية، من غير ترجيح تفسيري زائد، مع إبقاء المصطلحات الأساسية والبنية الزمنية للنص.
