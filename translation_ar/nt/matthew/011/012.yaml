review_pass:
  verdict: revise
  source_fidelity: المعنى العام والاختيارات المعجمية في المسودة أمينة للنص اليوناني، ولا سيما حفظ «ملكوت السماوات» وربط «العنيفون» بـ«ينتزعونه». لكن عبارة «يُعانَى منه العنف» لا تؤدي المبني للمجهول بوضوح؛ فتركيبها يوحي بأن العنف هو الذي يُعانَى من الملكوت، لا بأن الملكوت هو المتعرّض للعنف.
  naturalness: «يتعرض للعنف» فصيحة معاصرة واضحة، وتؤدي المعنى السلبي المقصود من القراءة المختارة. ونقل موضع علامة الحاشية إلى العبارة الملتبسة يجعل إحالتها أدق.
  terminology: «ملكوت السماوات» مصطلح كتابي راسخ ومناسب. و«العنيفون» و«ينتزعونه» يحفظان طابع القوة في βιασταί وἁρπάζουσιν دون تحميل النص تفسيراً مذهبياً.
  issues:
  - severity: medium
    issue: صياغة المبني للمجهول في المتن غير سليمة دلالياً بما يكفي
    rationale: «ملكوت السماوات يُعانَى منه العنف» تجعل الجار والمجرور متعلقاً بالفعل على نحو يوحي بأن المتكلم يعاني العنف من الملكوت. اليونانية، في القراءة السلبية المعتمدة، تفيد أن الملكوت نفسه يقع عليه العنف؛ لذا «يتعرض ملكوت السماوات للعنف» أدق وأوضح.
  - severity: low
