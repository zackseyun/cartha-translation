  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: ar
  text: 'لكنني أقول لكم: إن حال أرض سدوم يوم الدينونة سيكون أهون[a] من حالكِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أكثر احتمالًا».'
    reason: بديل معجمي لـ«أهون» في ترجمة ἀνεκτότερον.
lexical_decisions:
- source_word: πλὴν
  choice: لكنني
  rationale: تفيد هنا الاستدراك القوي والانتقال إلى مقابلة حاسمة؛ وصيغة «لكنني» طبيعية مع فعل القول التالي.
- source_word: λέγω ὑμῖν
  choice: أقول لكِ
  rationale: صيغة خطاب مباشر، والضمير اليوناني جمع، لكن سياق العدد يوجّه القول إلى المدينة المخاطبة؛ استُعمل المؤنث المفرد في العربية لموافقة «كفرناحوم» بوصفها مدينة، مع الحفاظ على المباشرة الخطابية.
- source_word: γῇ Σοδόμων
  choice: أرض سدوم
  rationale: يحافظ على ذكر γῇ الصريح بمعنى الأرض أو الإقليم المرتبط بسدوم، بدل اختزال العبارة إلى اسم المدينة وحده.
- source_word: ἀνεκτότερον
  choice: أهون
  rationale: ينقل معنى المقارنة في احتمال شدة القضاء بصورة عربية واضحة وطبيعية، من غير الإيحاء بأن الدينونة ذاتها يسيرة.
- source_word: ἔσται
  choice: ستكون حالها
  rationale: المستقبل اليوناني رابط اسمي، وإضافة «حالها» تكمل المقارنة العربية الطبيعية بين الطرفين من غير تغيير المقصود.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: يوم الدينونة
  rationale: تعبير عربي واضح يحافظ على الإشارة الزمنية وعلى معنى القضاء الأخروي.
- source_word: ἢ σοί
  choice: من حالكِ
  rationale: يحافظ على المخاطب المفرد في اليونانية، ويُظهر في العربية أن المقارنة بين حال أرض سدوم وحال المدينة المخاطبة.
theological_decisions:
- issue: مرجع ضمير المخاطب المفرد σοί
  choice: 'الإبقاء على خطاب المدينة بالمؤنث المفرد: «حالكِ»'
  alternative: «من حالكم» أو «من حال أهلها»
  rationale: الضمير اليوناني مفرد ويواصل الخطاب النبوي الموجَّه إلى كفرناحوم في السياق. يحافظ المؤنث المفرد على التشخيص البلاغي من غير تحويله إلى تفسير لجماعة السكان.
- issue: طبيعة المقارنة في الدينونة
  choice: «أهون من»
  alternative: «أكثر احتمالًا من»
  rationale: النص يقرر تفاوتًا مقارنًا في شدة ما يُلاقى يوم الدينونة، ولا يشرح أساس هذا التفاوت؛ لذلك تُحفظ المقارنة بلا توسع عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. صيغت المقارنة بإضافة «حالها/حالكِ» لتجنب تركيب عربي ملتبس، مع إبقاء «أرض سدوم» وضمير المدينة المفرد ظاهرين.
