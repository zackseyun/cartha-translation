  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: ar
  text: 'يقولون: «عزفنا لكم بالمزمار[a] فلم ترقصوا، وندبنا[b] فلم تلطموا[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عزفنا لكم بالناي». يدل الفعل اليوناني تحديدًا على العزف بآلة نفخ، كالناي أو المزمار.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «رثينا» أو «أنشدنا مرثاة».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «فلم تضربوا أنفسكم»، في إشارة إلى عادة الحداد التي قد تشمل ضرب الصدر.'
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: يقولون
  rationale: يحافظ المضارع على حيوية المشهد التمثيلي، ويقدّم كلام الصبيان بوصفه قولًا حاضرًا داخل الصورة.
- source_word: Ηὐλήσαμεν
  choice: عزفنا لكم بالمزمار
  rationale: الفعل يدل تحديدًا على العزف بآلة نفخ كالناي أو المزمار؛ وهذه الصياغة واضحة وطبيعية، وتحافظ على ذكر نوع الآلة بدل تعميم المعنى إلى مجرد الموسيقى.
- source_word: ὑμῖν
  choice: لكم
  rationale: تفيد أن العزف كان موجّهًا إليهم، وهي الصياغة العربية الطبيعية في هذا السياق.
- source_word: ὠρχήσασθε
  choice: ترقصوا
  rationale: ينقل المعنى المباشر للفعل من غير تحميل صيغة الوسط دلالة انعكاسية غير لازمة في العربية.
- source_word: ἐθρηνήσαμεν
  choice: ندبنا
  rationale: ينقل فعل الرثاء والنواح، ولا سيما في سياق جنائزي، ويحافظ على المقابلة بين لحن الفرح وفعل الندب.
- source_word: ἐκόψασθε
  choice: تلطموا صدوركم
  rationale: الفعل في هذا السياق يشير إلى ضرب المرء نفسه علامةً على الحزن؛ وإضافة «صدوركم» توضّح العادة المقصودة في عربية طبيعية.
