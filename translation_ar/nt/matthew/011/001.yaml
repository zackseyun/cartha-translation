source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: ar
  text: ولمّا فرغ يسوع من توجيه تلاميذه الاثني عشر[a]، انتقل من هناك ليعلِّم ويكرز في مدنهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: من إصدار أوامره لتلاميذه الاثني عشر.'
    reason: lexical_alternative
  - marker: b
    text: عبارة «مدنهم» مبهمة في اليونانية؛ فقد تشير إلى مدن التلاميذ، أو بوجه أعم إلى مدن أهل المنطقة المحيطة.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: ولمّا
  rationale: صياغة عربية طبيعية تؤدي وظيفة العبارة الانتقالية والزمنية في السرد، من غير إثقالها بترجمة حرفية مثل «وحدث أنه حين».
- source_word: ἐτέλεσεν
  choice: فرغ
  rationale: يفيد إتمام الفعل السابق قبل الانتقال إلى الفعل التالي، وهو تعبير عربي فصيح وطبيعي مع «من توجيه».
- source_word: διατάσσων
  choice: توجيه
  rationale: ينقل معنى إعطاء توجيهات ذات سلطان في سياق إرسال التلاميذ، مع إثبات البديل الأقوى «إصدار الأوامر» في الحاشية.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: تلاميذه الاثني عشر
  rationale: ترجمة عربية مألوفة ودقيقة تحافظ على الملكية وعلى العدد المذكور صراحة في اليونانية.
- source_word: μετέβη ἐκεῖθεν
  choice: انتقل من هناك
  rationale: يعبّر بوضوح عن مغادرة المكان السابق والتوجّه إلى موضع آخر ضمن تتابع السرد.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: ليعلِّم ويكرز
  rationale: لام التعليل تؤدي معنى الغرض في المصدر اليوناني، والفعلان يحافظان على التمييز بين التعليم والمناداة العلنية.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: في مدنهم
  rationale: يحافظ على الضمير المبهم في الأصل ولا يعيّن مرجعه، كما ينقل πόλεσιν بلفظه المباشر «مدن».
theological_decisions:
- issue: مرجع الضمير αὐτῶν في «ἐν ταῖς πόλεσιν αὐτῶν»
  choice: الإبقاء على الصياغة المبهمة «في مدنهم»
  alternative: في مدن التلاميذ؛ أو في مدن اليهود؛ أو في مدن تلك المنطقة
  rationale: لا يصرّح النص اليوناني بمرجع الضمير، ولذلك لا تُحسم هوية أصحاب المدن داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ولمّا فرغ» لتدفق السرد الطبيعي، وأُبقيت «مدنهم» على إبهام الأصل، مع شرح الاحتمالات في الحاشية.
