  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: ar
  text: لِأَنَّ جَمِيعَ الْأَنْبِيَاءِ وَالشَّرِيعَةَ تَنَبَّأُوا حَتَّى يُوحَنَّا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى يوحنا» أو «حتى زمن يوحنا». قد تعرض العبارة يوحنا بوصفه ذروة الشهادة النبوية، أو بوصفه الحد الفاصل الذي يشير إلى انتقال.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: جميع
  rationale: تفيد شمول جماعة الأنبياء كلهم، وهي صياغة عربية طبيعية مع «الأنبياء».
- source_word: γὰρ
  choice: لأنَّ
  rationale: تُبقي وظيفة الأداة في تعليل الكلام السابق وربطه به.
- source_word: οἱ προφῆται
  choice: الأنبياء
  rationale: المقابل العربي المألوف والدقيق لمن يتكلمون بالنبوة عن الله.
- source_word: ὁ νόμος
  choice: الشريعة
  rationale: تشير هنا إلى التوراة بوصفها قسمًا من الأسفار المقدسة، لا إلى قانون عام؛ و«الشريعة» واضحة وشائعة في هذا السياق.
- source_word: ἕως Ἰωάννου
  choice: إلى يوحنا
  rationale: تعبّر عن الحد الزمني بإيجاز، مع إبقاء احتمال كون يوحنا ذروة الشهادة النبوية أو الحد الذي عنده يبدأ انتقالها.
- source_word: ἐπροφήτευσαν
  choice: تنبَّأوا
  rationale: تنقل الفعل اليوناني مباشرة، وتحافظ على إسناد العمل النبوي إلى الأنبياء والشريعة معًا.
theological_decisions:
- issue: هل ὁ νόμος قانون عام أم اسم لمجموعة كتابية؟
  choice: الشريعة
  alternative: الناموس
  rationale: السياق يجمع الأنبياء والشريعة بوصفهما شاهدين كتابيين لإسرائيل. «الشريعة» عربية معاصرة واضحة، ولا تضيف مضمونًا غير موجود في الأصل.
- issue: هل يُدرج يوحنا ضمن الحقبة النبوية أم يمثل نهايتها؟
  choice: إلى يوحنا
  alternative: حتى زمن يوحنا
  rationale: العبارة اليونانية تحدد حدًّا زمنيًّا من غير أن تحسم تمامًا هل يوحنا داخل هذا الحد بوصفه ذروة الشهادة أم عند نقطة الانتقال؛ لذلك تُحفظ مرونة العبارة في المتن وتُشرح في الحاشية.
- issue: إسناد التنبؤ إلى الشريعة مع الأنبياء
  choice: تنبَّأوا
  alternative: كانت لهم شهادة نبوية
  rationale: يحافظ الفعل المباشر على التشخيص البلاغي في الأصل، حيث تُعرض الشريعة نفسها بوصفها حاملة لشهادة نبوية، بدل تخفيف العبارة بتفسيرها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «الشريعة» بدل اللفظ التراثي «الناموس» لسهولة الفهم المعاصر، مع الحفاظ على الإشارة إلى التوراة. وجاء الفعل بصيغة الجمع تبعًا للأنبياء مع الشريعة بوصفهما فاعلًا مركبًا.
