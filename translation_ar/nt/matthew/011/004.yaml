lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: فأجابهم يسوع
  rationale: الصيغة اليونانية السردية تعني حرفيًا «أجاب وقال لهم»، لكن العربية المعاصرة تستغني طبيعيًا عن ازدواج الفعلين، وتؤدي «أجابهم» وظيفة تقديم الرد بوضوح.
- source_word: Πορευθέντες
  choice: اذهبوا
  rationale: اسم الفاعل السابق لفعل الأمر يحمل هنا قوة الأمر المصاحب، فصيغته العربية الطبيعية هي «اذهبوا».
- source_word: ἀπαγγείλατε
  choice: أخبروا
  rationale: يفيد نقل الخبر أو التقرير إلى يوحنا؛ و«أخبروا» واضحة وطبيعية في هذا السياق.
- source_word: Ἰωάννῃ
  choice: يوحنا
  rationale: اسم مجرور دلاليًا بوصفه متلقي الخبر، وتؤدي العربية هذه العلاقة مباشرة بعد «أخبروا».
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: بما تسمعون وترون
  rationale: تحافظ الصياغة على ترتيب السمع ثم الرؤية وعلى دلالة الخبرة الحاضرة، بأسلوب عربي موجز وطبيعي.
- source_word: καὶ
  choice: فـ
  rationale: الفاء تلائم استئناف الجواب في سياق السرد العربي وتبين تعاقبه مع ما سبق من غير إضافة معنى تفسيري زائد.
theological_decisions:
- issue: الصيغة السردية ἀποκριθεὶς ... εἶπεν
  choice: فأجابهم يسوع
  alternative: فأجاب يسوع وقال لهم
  rationale: هذا قرار أسلوبي لا عقائدي؛ الصياغة المختصرة عربية طبيعية وتحفظ فعل الجواب، مع إثبات الصيغة الأقرب إلى الحرفية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة؛ استُخدم «أخبروا» بدل تعبير تقريري أثقل، وحُفظ ترتيب «تسمعون وترون». وُضعت علامة الحاشية بعد الاقتباس الذي تتعلق بصيغة تقديمه.
