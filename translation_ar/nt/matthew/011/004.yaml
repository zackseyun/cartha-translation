  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: ar
  text: 'فأجابهم يسوع: «اذهبوا وأخبروا يوحنا بما تسمعون وترون:»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «وأجاب يسوع وقال لهم».'
