lexical_decisions:
- source_word: οὗτός
  choice: هذا هو الذي
  rationale: صيغة تعريف وتحديد تؤدي توكيد اسم الإشارة، وتأتي طبيعية وفصيحة في العربية.
- source_word: περὶ οὗ
  choice: عنه
  rationale: تؤدي معنى «بشأنه/عنه» بإيجاز طبيعي، مع صلة الموصول في العبارة العربية.
- source_word: γέγραπται
  choice: كُتب
  rationale: صيغة المبني للمجهول الملائمة للاقتباس الكتابي، وتحافظ على دلالة النص المكتوب القائم دون إثقال العبارة.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: لأن ἰδού يعقبها ἐγώ، فالصياغة العربية «ها أنا» تحفظ التنبيه والنبرة النبوية المرفوعة.
- source_word: ἀποστέλλω
  choice: أرسل
  rationale: المضارع العربي صالح للحال والاستقبال في هذا الإعلان النبوي، ويحافظ على حيوية المضارع اليوناني.
- source_word: ἄγγελόν
  choice: رسولي
  rationale: السياق يشير إلى رسول بشري هو يوحنا، لا إلى كائن سماوي؛ و«رسول» تؤدي معنى المبعوث حامل الرسالة.
- source_word: πρὸ προσώπου σου
  choice: أمام وجهك
  rationale: يحفظ الصورة الحسية الصريحة في اليونانية ونسيج الاقتباس الكتابي، مع بيان البديل الأسلس في الحاشية.
- source_word: κατασκευάσει
  choice: يهيّئ
  rationale: يؤدي معنى الإعداد والتجهيز، ويلائم صورة تمهيد الطريق؛ والمضارع العربي بعد الموصول يمكن أن يدل على الفعل الآتي.
- source_word: τὴν ὁδόν σου
  choice: طريقك
  rationale: «طريق» يحفظ الدلالة الحسية والمجازية لكلمة ὁδός، وهو التعبير العربي الطبيعي في هذا السياق.
- source_word: ἔμπροσθέν σου
  choice: قدّامك
  rationale: يؤدي معنى «أمامك» مع إبقاء العبارة الثانية متميزة لفظيًا عن «أمام وجهك»، كما هي متميزة في الأصل.
theological_decisions:
- issue: تكرار عبارتي التقدّم المكاني في الاقتباس
  choice: الإبقاء على «أمام وجهك» و«قدّامك» كلتيهما
  alternative: دمجهما أو تسويتهما في عبارة واحدة مثل «أمامك»
  rationale: يحتوي النص اليوناني على عبارتين، πρὸ προσώπου σου وἔμπροσθέν σου؛ والإبقاء عليهما يصون بنية الاقتباس وتوازيه التوكيدي دون اختزال.
- issue: هوية ἄγγελος في السياق
  choice: رسول
  alternative: ملاك
  rationale: المشار إليه هو الممهّد البشري المذكور في السياق، ولذلك يحفظ «رسول» المعنى السياقي من غير إدخال دلالة الكائن السماوي.
