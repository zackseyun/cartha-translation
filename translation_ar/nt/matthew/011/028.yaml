  terminology: «الكادّين» يحفظ جانب الجهد والعمل في κοπιῶντες، و«المُثقَلين» مناسب لـ πεφορτισμένοι. والحاشيتان تقدّمان البدائل المعجمية الملائمة، وتشرح الأولى دلالة صيغة التام المبني للمجهول دون إضافة تفسير عقائدي.
