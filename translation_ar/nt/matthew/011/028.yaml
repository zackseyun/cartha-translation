id: MAT.11.28
reference: Matthew 11:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: ar
  text: تعالَوا إليَّ، يا جميعَ الكادّين والمُثقَلين[a]، وأنا سأُريحكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المحمَّلين بالأثقال». تدل صيغة اسم المفعول التام في اليونانية على أناس حُمِّلوا أثقالًا وما زالوا في تلك الحالة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سأُنعشكم». يمكن أن يعني الفعل أن يجعل شخصًا يستريح أو أن ينعشه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: تعالَوا
  rationale: صيغة دعوة وأمر موجَّهة إلى جمع؛ وهي العبارة العربية الطبيعية المباشرة في هذا السياق.
- source_word: πρός με
  choice: إليَّ
  rationale: مع فعل المجيء تدل πρός مع النصب على الاتجاه نحو شخص.
- source_word: πάντες
  choice: جميعَ
  rationale: تحفظ شمول الدعوة، وتنسجم نحويًّا مع المنادى المضاف في العربية.
- source_word: οἱ κοπιῶντες
  choice: الكادّين
  rationale: تنقل معنى بذل الجهد والتعب الناتج من الكد، وتحفظ الجانب الفعّال في اسم الفاعل اليوناني.
- source_word: πεφορτισμένοι
  choice: المُثقَلين
  rationale: تنقل حالة من وُضع عليهم حمل وما زالوا رازحين تحته، بما يلائم اسم المفعول التام في اليونانية.
- source_word: κἀγὼ
  choice: وأنا
  rationale: تحفظ العطف وذكر الضمير الصريح وما فيه من إبراز لطيف للمتكلم.
- source_word: ἀναπαύσω
  choice: سأُريحكم
  rationale: صياغة عربية طبيعية لفعل متعدٍّ يعني أن يجعل المخاطَبين يستريحون أو ينالون الانتعاش، مع الحفاظ على صيغة المستقبل.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير مفعول به للجمع، وهو واضح بعد الدعوة الشاملة في أول الجملة.
theological_decisions:
- issue: طبيعة الراحة الموعود بها في ἀναπαύσω
  choice: سأُريحكم
  alternative: سأُنعشكم
  rationale: تُبقي الصياغة معنى الراحة واسعًا من غير حصره في راحة روحية أو أخروية أو نفسية أو جسدية بعينها، فلا تحسم ما تركته الآية مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الكادّين» للمحافظة على معنى العمل المجهد في οἱ κοπιῶντες، و«المُثقَلين» لإبراز الحالة الناتجة المستمرة في πεφορτισμένοι. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما.
