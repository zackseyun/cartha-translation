  to: وأنتِ يا كفرناحوم، أإلى السماء ستُرفعين؟ إلى هادِس[a] ستهبطين. فلو أن الأعمال العظيمة التي حدثت فيكِ حدثت في سدوم، لبقيت إلى اليوم.
  rationale: حُذفت أداة الاستدراك غير الموجودة في الأصل، واستُبدل النقل الصوتي «هادِس» بـ«الهاوية» صونًا للتمييز المصطلحي في اليونانية، وعدِّلت عبارة δυνάμεις إلى تعبير عربي أكثر سلاسة مع بقاء دلالة الأعمال ذات القوة. ولم يُغيَّر معنى السؤال الإنكاري أو الشرط المخالف للواقع.
