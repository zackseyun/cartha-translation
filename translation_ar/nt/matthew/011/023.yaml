  source_fidelity: الصياغة تحافظ على السؤال الإنكاري، والمبني للمجهول في «تُرفعين»، وبنية الشرط المخالف للواقع، وخطاب المدينة بالمؤنث. لكن «بل» ليست في النص اليوناني، و«الهاوية» قد توحي بـ«الهاوية/الجُبّ» أكثر من حفاظها على المصطلح ᾅδης المميَّز في الأصل.
  naturalness: الترجمة مفهومة وفصيحة عمومًا. يُفضَّل «الأعمال العظيمة» على «أعمال القدرة»؛ فالأخيرة مفهومة لكنها أقل سلاسة في العربية المعاصرة. كما أن حذف «بل» يجعل المقابلة البلاغية مباشرة كما في اليونانية.
  terminology: ينبغي نقل ᾅδης في المتن بـ«هادِس» مع حاشية تفسيرية، بدل «الهاوية»، لتجنّب دمجه بمصطلحات عربية ذات إيحاءات مختلفة وللمحافظة على التمييز الصريح عن «جهنم».
