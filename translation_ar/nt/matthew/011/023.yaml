  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: ar
  text: وأنتِ يا كفرناحوم، أإلى السماء ستُرفعين؟ إلى هادِس[a] ستهبطين. فلو أن الأعمال العظيمة التي حدثت فيكِ حدثت في سدوم، لبقيت إلى اليوم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عالم الأموات». «هادِس» هو اللفظ اليوناني هنا، وليس «جهنم».'
    reason: توضيح البديل الدلالي والمحافظة على التمييز بين ᾅδης وγέεννα.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: كفرناحوم
  rationale: نقلٌ صوتي للاسم الجغرافي وفق الصيغة العربية الكتابية الشائعة.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: أإلى السماء ستُرفعين؟
  rationale: تُفهم μή مع الفعل المستقبل المبني للمجهول بوصفها سؤالًا إنكاريًا يُنتظر أن تكون إجابته بالنفي. وتحافظ «ستُرفعين» على المبني للمجهول والصورة المكانية.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: بل إلى الهاوية ستهبطين
  rationale: «ستهبطين» تنقل معنى النزول، و«الهاوية» مقابل عربي معروف لـᾅδης مع إيضاح مدلوله في الحاشية. أُضيفت «بل» لإظهار التضاد الذي تفيده الجملتان المتجاورتان في السياق من غير تغيير مضمونهما.
- source_word: δυνάμεις
  choice: أعمال القدرة
  rationale: يحفظ التعبير دلالة الأعمال المحسوسة ودلالة القوة معًا، ولا يحصر اللفظ في مفهوم حديث أضيق لكلمة «معجزات».
- source_word: γενόμεναι ἐν σοί
  choice: التي حدثت فيكِ
  rationale: صياغة طبيعية تحفظ معنى الحدوث وحرف الظرف، مع تأنيث الخطاب لأن المدينة مخاطبة في العربية.
- source_word: ἐγενήθησαν
  choice: حدثت
  rationale: يناسب فعل «حدث» المعنى الواسع لـγίνομαι، ويُفهم الزمن السابق غير المتحقق من تركيب الشرط بـ«لو».
- source_word: ἔμεινεν ἂν
  choice: لبقيت
  rationale: ينقل جواب الشرط المخالف للواقع، ويعامل سدوم بوصفها مدينة مفردة مؤنثة.
- source_word: μέχρι τῆς σήμερον
  choice: إلى اليوم
  rationale: تعبير عربي واضح ومباشر يحفظ الحد الزمني في الأصل.
theological_decisions:
- issue: ترجمة ᾅδης
  choice: الهاوية
  alternative: هادِس؛ عالم الأموات؛ جهنم
  rationale: اختيرت «الهاوية» بوصفها مقابلًا عربيًا معروفًا، مع حاشية تبيّن أن اللفظ اليوناني هو ᾅδης (هادِس) لا γέεννα (جهنم)، تجنبًا لدمج مصطلحين مختلفين أو حسم طبيعة هذا الموضع لاهوتيًا.
- issue: دلالة السؤال عن الارتفاع إلى السماء
  choice: 'سؤال إنكاري: «أإلى السماء ستُرفعين؟»'
  alternative: 'خبر منفي: «لن تُرفعي إلى السماء»'
  rationale: تحافظ صيغة السؤال على تركيب النص اليوناني وعلى النبرة البلاغية، مع بقاء الجواب السلبي مفهومًا من المقابلة مع الهبوط إلى الهاوية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل خطاب المؤنث لأن كفرناحوم مدينة، وحوفظ على السؤال الإنكاري، والصورة المكانية، وبنية الشرط المخالف للواقع.
