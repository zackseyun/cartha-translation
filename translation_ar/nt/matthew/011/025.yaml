  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: ar
  text: 'في ذلك الوقت أجاب يسوع وقال: «أحمدك[a] يا أبتِ، يا ربَّ السماء والأرض، لأنك أخفيت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال الصغار[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أشكرك». يمكن للفعل اليوناني أن يدل على الشكر، كما يدل على الحمد أو الإقرار العلني.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «للرُّضَّع». ويُحتمل أن تكون العبارة هنا صورةً لمن يتلقون الإعلان ببساطة الأطفال وتواضعهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: في ذلك الوقت
  rationale: تعبير زمني عربي طبيعي يحافظ على الإطار السردي من غير أن يضيف معنى الفورية.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: أجاب ... وقال
  rationale: يحافظ على الفعلين وعلى الصيغة السردية ذات الأثر السامي، رغم عدم ورود سؤال صريح قبلهما.
- source_word: Ἐξομολογοῦμαί σοι
  choice: أحمدك
  rationale: ينقل في هذا السياق معنى الإقرار العلني المصحوب بالحمد والشكر، ويتجنب إيحاء الاعتراف بخطيئة.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: يا أبتِ، يا ربَّ السماء والأرض
  rationale: يحفظ النداءين ويعبّر بوضوح عن الأبوة والسيادة.
- source_word: ὅτι
  choice: لأنك
  rationale: يبين المعنى السببي بوصف ما يلي أساسًا للحمد، مع بقاء احتمال فهمه على أنه يقدّم مضمون الحمد.
- source_word: ἔκρυψας
  choice: أخفيت
  rationale: ترجمة مباشرة للفعل الماضي المبني للمعلوم، وتحافظ على نسبة الفعل إلى الآب.
- source_word: ταῦτα ... αὐτά
  choice: هذه الأمور ... ها
  rationale: يحافظ على الإحالة المفتوحة في اليونانية من غير تحديد تفسيري لطبيعة هذه الأمور.
- source_word: σοφῶν καὶ συνετῶν
  choice: الحكماء والفهماء
  rationale: زوج عربي موجز وطبيعي يحفظ التمييز بين الحكمة والفهم أو الإدراك.
- source_word: ἀπεκάλυψας
  choice: كشفتها
  rationale: ينقل معنى الإظهار بعد الخفاء ويحافظ على فاعلية الإعلان الإلهي.
- source_word: νηπίοις
  choice: للأطفال الصغار
  rationale: يحفظ الصورة الملموسة التي قد تحمل معنى مجازيًا، بدل استبدالها مباشرة بتفسير مثل المتواضعين.
theological_decisions:
- issue: نسبة الإخفاء والكشف إلى الله
  choice: 'الإبقاء على الإسناد المباشر: «أخفيت ... وكشفت»'
  alternative: تخفيف العبارة إلى معنى سماحي مثل «تركتها خافية»
  rationale: الفعلان في اليونانية مبنيان للمعلوم والآب فاعلهما؛ لذلك تُحفظ حدة العبارة ولا تُسوّى بتفسير مذهبي.
- issue: دلالة νηπίοις
  choice: الأطفال الصغار
  alternative: الرُّضَّع أو المتواضعون
  rationale: الاختيار يحفظ الصورة واحتمال دلالتها المجازية على البسطاء أو المتلقين بروح طفولية، من غير حصرها في تفسير واحد.
- issue: دلالة ὅτι بعد فعل الحمد
  choice: لأنك
  alternative: أنك
  rationale: السياق يسمح بدرجة من التداخل بين سبب الحمد ومضمونه؛ اختيرت السببية الطبيعية مع عدم بناء استنتاج لاهوتي زائد عليها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أحمدك» لصيغته التعبدية الطبيعية، وحُفظ التركيب «أجاب ... وقال» لإبقاء نسيج الأصل، كما حُفظت صورة الأطفال بدل تحويلها إلى تجريد تفسيري.
