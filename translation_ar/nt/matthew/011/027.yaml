reference: Matthew 11:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ar
  text: قد سلَّمني أبي كلَّ شيء، ولا أحد يعرف[a] الابنَ إلا الآب، ولا أحد يعرف الآبَ إلا الابن ومَن يشاء الابن أن يكشف له الآب.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يعرف معرفة تامة» أو «يعرف معرفة وثيقة» في العبارتين؛ فقد يدل الفعل اليوناني في بعض السياقات على معرفة كاملة أو عميقة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «ومَن يريد الابن أن يكشف له الآب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: كلَّ شيء
  rationale: ينقل شمول الجمع المحايد اليوناني بصياغة عربية طبيعية، من غير تقييد مجال «كل شيء» بما لا يذكره النص.
- source_word: παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: سلَّمني أبي
  rationale: ينقل معنى تسليم الأشياء إلى الابن بعبارة عربية واضحة. حُوِّل المبني للمجهول اليوناني إلى المبني للمعلوم لأن الفاعل مذكور صراحة، من غير تغيير في المعنى.
- source_word: ἐπιγινώσκει
  choice: يعرف
  rationale: الفعل المركب لا يقتضي في كل استعمال إضافة «تمامًا» أو «حقًّا». تحافظ «يعرف» على المعنى المباشر، وتُذكر دلالة المعرفة التامة أو الوثيقة بوصفها احتمالًا في الحاشية بدل فرضها في المتن.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: الابن / الآب
  rationale: يحافظ اللقبان على المقابلة العلائقية المقصودة في السياق، و«الآب» هو الاستعمال العربي الكتابي الواضح عند الإشارة إلى الله.
- source_word: εἰ μὴ
  choice: إلا
  rationale: هي المقابل العربي الطبيعي لأداة الاستثناء بعد النفي، وتحفظ حصر المعرفة المذكورة.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς
  choice: ومَن يشاء الابن
  rationale: تنقل «يشاء» الإرادة الفعلية للابن من غير اختزالها إلى مجرد رغبة، وتحافظ «مَن» على عدم تعيين الشخص.
- source_word: ἀποκαλύψαι
  choice: أن يكشف له الآب
  rationale: «يكشف» ينقل معنى الإظهار والإعلان. أُعيد الاسم «الآب» بدل ضمير المفعول لتجنب التباس الضمائر في العربية، مع بقاء المرجع مطابقًا للسياق اليوناني.
theological_decisions:
- issue: قوة ἐπιγινώσκω في المعرفة المتبادلة بين الآب والابن
  choice: يعرف في العبارتين
  alternative: يعرف معرفة تامة أو وثيقة
  rationale: السياق يؤكد فرادة معرفة الآب والابن وحصريتها، لكن صيغة الفعل المركبة وحدها لا تلزم بإدخال مقيِّد صريح مثل «تمامًا». لذلك بقي المتن غير متجاوز للدلالة، مع إثبات الاحتمال الدلالي في الحاشية.
- issue: إرادة الابن في الكشف عن الآب
  choice: يشاء الابن أن يكشف
  alternative: يريد الابن أن يكشف؛ يختار الابن أن يكشف
  rationale: تحفظ «يشاء» المبادرة الإرادية المنسوبة إلى الابن، من غير تفسير مذهبي لكيفية هذه المشيئة أو مداها.
- issue: مرجع المفعول في ἀποκαλύψαι
  choice: أن يكشف له الآب
  alternative: أن يكشفه له
  rationale: المفعول المفهوم من السياق هو الآب. التصريح به في العربية يزيل التباس الضمير ولا يضيف مرجعًا جديدًا أو يحسم غموضًا لاهوتيًا غير موجود في السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، مع توازٍ تركيبي بين معرفة الابن ومعرفة الآب. استُعملت «الآب» كلقب إلهي مألوف، وتُجنبت زيادة «تمامًا» في المتن كي لا يُحمَّل الفعل اليوناني تشديدًا غير لازم.
