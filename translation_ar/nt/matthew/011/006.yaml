lexical_decisions:
- source_word: καί
  choice: و
  rationale: تحفظ الصلة المباشرة بالسياق السابق بصياغة عربية طبيعية.
- source_word: μακάριος
  choice: طوبى
  rationale: صيغة عربية راسخة في التطويبات، وتحفظ الدلالة الدينية الأعمق من مجرد السعادة الذاتية.
- source_word: ὃς ἐὰν μὴ
  choice: لمن لا
  rationale: تؤدي معنى الشخص غير المحدد المشروط بصورة موجزة وطبيعية، من غير تقييد الحكم بجنس نحوي ظاهر في العربية.
- source_word: σκανδαλισθῇ
  choice: يعثر
  rationale: تحفظ استعارة التعثر وما قد تتضمنه من نفور أو سقوط بسبب يسوع، بدل حصر المعنى في الشعور بالإهانة.
- source_word: ἐν ἐμοί
  choice: بسببي
  rationale: توضح أن يسوع هو المناسبة أو السبب الذي قد يقع عنده التعثر، وهي صياغة عربية طبيعية في هذا التركيب.
theological_decisions:
- issue: مدى قوة σκανδαλισθῇ في علاقة الشخص بيسوع
  choice: 'الإبقاء على صورة التعثر: «لا يعثر بسببي»'
  alternative: لا يشك فيَّ / لا يجد فيَّ سببًا للعثرة / لا يستاء مني
  rationale: صورة التعثر أوسع من مجرد الاستياء العاطفي، ويمكن أن تشمل النفور أو التراجع عن الإيمان بسبب ما يراه الشخص في يسوع؛ لذلك تُحفظ في المتن مع بيان البدائل في الحاشية.
translation_notes:
