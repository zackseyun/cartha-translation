  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: ar
  text: 'فقد جاء يوحنا لا يأكل ولا يشرب، فيقولون: «به شيطان».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «له شيطان». ويمكن أن تُترجم: «ممسوس بشيطان».'
