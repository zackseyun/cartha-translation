lexical_decisions:
- source_word: ἦλθεν
  choice: جاء
  rationale: ينقل الفعل الماضي وصول يوحنا وظهوره في المشهد بعبارة عربية مباشرة وطبيعية.
- source_word: γὰρ
  choice: فقد
  rationale: تحفظ الأداة التعليلية التي تربط الآية بما قبلها، وتلائم السياق التفسيري في العربية.
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية المألوفة للاسم، والمقصود في السياق يوحنا المعمدان.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: لا يأكل ولا يشرب
  rationale: تحفظ العبارة اليونانية الموجزة ووصف نمط يوحنا النسكي، من غير إدخال الخبز أو الخمر، إذ لا يذكرهما نص هذه الآية.
- source_word: καὶ λέγουσιν
  choice: فيقولون
  rationale: تحفظ المضارع التصويري والفاعل غير المصرح به، وتربط الاتهام بما سبقه ربطًا طبيعيًا.
- source_word: Δαιμόνιον ἔχει
  choice: به شيطان
  rationale: تعبير عربي طبيعي قريب من المعنى الحرفي «له شيطان»، من غير تحويل الاتهام إلى تقرير من الراوي أو زيادة تحديد لا يصرح به النص.
theological_decisions:
- issue: صياغة الاتهام المتعلق بـ δαιμόνιον
  choice: به شيطان
  alternative: ممسوس بشيطان
  rationale: النص ينقل اتهام القائلين ليوحنا، ولا يقرره بوصفه حقيقة. وتحافظ الصياغة المختارة على صورة «وجود شيطان به» القريبة من اليونانية، بينما «ممسوس» أكثر تفسيرًا وقد تحمل إيحاءات ثقافية إضافية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فقد» لإظهار التعليل، و«به شيطان» لقربها من الأصل مع بقاء العبارة طبيعية ومفهومة. وُضع مؤشر الحاشية بعد الاقتباس لأنه يشرح العبارة الأخيرة.
