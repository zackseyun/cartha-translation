  to: الْعُمْيُ يُبْصِرُونَ، وَالْعُرْجُ يَمْشُونَ، وَالْبُرْصُ يُطَهَّرُونَ، وَالصُّمُّ يَسْمَعُونَ، وَالْمَوْتَى يُقَامُونَ، وَيُبَشَّرُ الْفُقَرَاءُ بِالْخَبَرِ السَّارِّ.[a]
  rationale: اقتصر التعديل على إصلاح مطابقة الفعل الأخير للفاعل الظاهر، مع إبقاء المعنى المتلقي للمبني للمجهول وتسلسل الأفعال كما في اليونانية. وعدّلت عبارة الحاشية إلى «عمل المسيح» لتكون أقل تفسيرًا مع بقاء الإحالة التوضيحية إلى إشعياء.
