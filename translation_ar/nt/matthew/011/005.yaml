base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: ar
  text: الْعُمْيُ يُبْصِرُونَ، وَالْعُرْجُ يَمْشُونَ، وَالْبُرْصُ يُطَهَّرُونَ، وَالصُّمُّ يَسْمَعُونَ، وَالْمَوْتَى يُقَامُونَ، وَيُبَشَّرُ الْفُقَرَاءُ بِالْخَبَرِ السَّارِّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تردّد هذه القائمة أصداء إشعياء 35:5–6 و61:1، وتعرض علامات مرتبطة بعمل المسيح. ويمكن أيضًا ترجمة العبارة الأخيرة: «ويُكرَز للفقراء بالإنجيل»؛ فالفعل اليوناني مبني للمجهول، أي إن الفقراء يتلقّون البشارة.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: الْعُمْيُ يُبْصِرُونَ
  rationale: ينقل المعنى في سياق الشفاء بوضوح وإيجاز؛ فالفعل يدل هنا على نوال البصر أو استعادته، لا مجرد رفع النظر.
- source_word: χωλοὶ περιπατοῦσιν
  choice: الْعُرْجُ يَمْشُونَ
  rationale: صياغة عربية طبيعية تحفظ أسلوب القائمة الموجز وزمن المضارع.
- source_word: λεπροὶ καθαρίζονται
  choice: الْبُرْصُ يُطَهَّرُونَ
  rationale: يحفظ «يُطَهَّرون» دلالة التطهير الجسدي والطقسي التي يحملها الفعل، بدل اختزالها في الشفاء وحده.
- source_word: κωφοὶ ἀκούουσιν
  choice: الصُّمُّ يَسْمَعُونَ
  rationale: اقتران الصفة بفعل السماع يحدد معناها هنا بالصمم، لا الخرس.
- source_word: νεκροὶ ἐγείρονται
  choice: الْمَوْتَى يُقَامُونَ
  rationale: يحفظ صيغة المبني للمجهول ودلالة وقوع فعل الإقامة على الموتى.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: الْفُقَرَاءُ تُبَشَّرُونَ بِالْخَبَرِ السَّارِّ
  rationale: يحفظ المبني للمجهول، فيُظهر الفقراء متلقين للبشارة، ويصوغ معنى الخبر السار بلغة عربية واضحة دون حصره في اصطلاح كنسي لاحق.
theological_decisions:
- issue: دلالة εὐαγγελίζονται وصلتها بمصطلح الإنجيل
  choice: تُبَشَّرُونَ بِالْخَبَرِ السَّارِّ
  alternative: يُكْرَزُ لَهُمْ بِالْإِنْجِيلِ
  rationale: يحافظ الاختيار على معنى إعلان الخبر السار وعلى صيغة المبني للمجهول، من غير تضييق العبارة إلى استعمال اصطلاحي كنسي لاحق.
- issue: القائمة بوصفها شاهدًا على عمل المسيح المنتظر
  choice: الإبقاء على الأفعال كما وردت من غير إضافة تصريح بالإتمام
  alternative: إضافة عبارة تشرح أنها إتمام لنبوات إشعياء
  rationale: النص يردد بوضوح أصداء إشعياء، لكنه يعرض الأعمال نفسها ولا يضيف هنا تصريحًا تفسيريًا بالإتمام؛ لذلك تُحفظ الإشارة دون إدخال الشرح في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات إيقاع كتابي رصين. حُفظ التوازي المتتابع وصيغ المبني للمجهول في «يُطَهَّرون» و«يُقَامون» و«تُبَشَّرون»، مع تجنب الإضافات التفسيرية في المتن.
