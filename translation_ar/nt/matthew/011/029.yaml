id: MAT.11.29
reference: Matthew 11:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: ar
  text: احملوا نيري عليكم وتعلَّموا مني، لأني وديع ومتواضع القلب[a]، وستجدون راحةً لنفوسكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لطيف ومتضع القلب».'
    reason: بديل لغوي لـ πραΰς وταπεινὸς τῇ καρδίᾳ.
lexical_decisions:
- source_word: ἄρατε
  choice: احملوا
  rationale: صيغة أمر تفيد اتخاذ النير وحمله؛ و«احملوا نيري عليكم» تحافظ على الصورة المجازية الملموسة في العربية.
- source_word: ζυγόν
  choice: نيري
  rationale: أُبقيت صورة «النير» المركزية، لأنها تدل مجازيًا على قبول سلطان المعلّم وتعليمه، ولا ينبغي تسطيحها بالشرح.
- source_word: ἐφ’ ὑμᾶς
  choice: عليكم
  rationale: تنقل معنى ἐπί مع حالة النصب وتحافظ على صورة وضع النير على الشخص.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: تعلَّموا مني
  rationale: ترجمة مباشرة وطبيعية للأمر، وتصلح لمعنى تلقّي التعليم واتباع المعلّم.
- source_word: ὅτι
  choice: لأني
  rationale: تبيّن أن وصف يسوع لنفسه هو سبب الدعوة إلى التعلّم منه.
- source_word: πραΰς
  choice: وديع
  rationale: «وديع» تعبّر عن اللطف والحلم وعدم القسوة، وهي راسخة وواضحة في السياق الكتابي دون أن تعني الضعف بالضرورة.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: متواضع القلب
  rationale: تحافظ العبارة على وصف الاتضاع بوصفه صفة داخلية راسخة، وهي عربية طبيعية ومفهومة.
- source_word: εὑρήσετε
  choice: ستجدون
  rationale: تنقل صيغة المستقبل بوصفها وعدًا مباشرًا.
- source_word: ἀνάπαυσιν
  choice: راحةً
  rationale: المقابل المباشر الذي يحفظ دلالة الراحة والاستجمام وصداها الكتابي.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: لنفوسكم
  rationale: صياغة عربية طبيعية تحفظ لفظ «النفوس» ودلالته على الحياة الداخلية أو كيان الإنسان.
theological_decisions:
- issue: وصف يسوع لنفسه في πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: وديع ومتواضع القلب
  alternative: لطيف ومتضع القلب
  rationale: تحفظ الصياغة وصف يسوع الشخصي دون إدخال تفسير مذهبي؛ وتعرض الحاشية بدائل لغوية ممكنة من غير أن تحسم الدلالة بأكثر مما يسمح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقيت استعارة النير ولفظ النفوس، واستُخدم «متواضع القلب» بدل تراكيب قد توحي بالذم في الاستعمال العربي المعاصر.
