  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: ar
  text: ثم بدأ يوبّخ المدن التي حدث فيها معظم أعماله العظيمة[a]، لأنها لم تتب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «معجزاته» أو «أعمال قوة». واللفظ اليوناني هو δυνάμεις، ويشير إلى أفعال تتجلى فيها القوة.
    reason: بيان البدائل المعجمية المشروعة مع الحفاظ على دلالة اللفظ اليوناني على القوة.
lexical_decisions:
- source_word: Τότε
  choice: ثم
  rationale: أداة ربط زمنية طبيعية تنقل السرد إلى المرحلة التالية.
- source_word: ἤρξατο ὀνειδίζειν
  choice: بدأ يوبّخ
  rationale: يحفظ معنى الشروع في الفعل، ويؤدي معنى التعيير واللوم الشديد بلغة عربية واضحة من غير مبالغة إلى معنى الإدانة الرسمية.
- source_word: τὰς πόλεις ἐν αἷς
  choice: المدن التي جرت فيها
  rationale: صياغة عربية طبيعية تحافظ على مرجع اسم الموصول وعلاقة المكان.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: جرت فيها أكثر أعماله القديرة
  rationale: «جرت» تلائم وقوع الأعمال في تلك المدن، و«أكثر» تنقل صيغة التفضيل، و«أعماله القديرة» تحفظ صلة δυνάμεις بالقوة من دون حصرها في مصطلح تفسيري أضيق.
- source_word: ὅτι οὐ μετενόησαν
  choice: لأنها لم تتب
  rationale: يبين «لأن» سبب التوبيخ، ويؤدي فعل «تتوب» المعنى الأخلاقي والروحي لـ μετανοέω بإيجاز طبيعي.
theological_decisions:
- issue: دلالة δυνάμεις في سياق أعمال يسوع
  choice: أعماله القديرة
  alternative: معجزاته؛ أعمال قوته
  rationale: يحافظ هذا التعبير على عنصر القوة في اللفظ اليوناني وعلى كونه يشير إلى أفعال، مع إثبات البدائل التفسيرية الصحيحة في الحاشية.
- issue: دلالة μετενόησαν
  choice: لم تتب
  alternative: لم ترجع؛ لم تغيّر فكرها
  rationale: «التوبة» هي المقابل العربي الواضح والمستقر هنا، وتحفظ ثقل الاستجابة الأخلاقية والروحية من غير إضافة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل ضمير جمع غير العاقل المؤنث في «لأنها لم تتب» عائدًا إلى المدن، وهو الأسلوب العربي المعياري.
