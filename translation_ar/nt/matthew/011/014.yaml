  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: ar
  text: وإن كنتم على استعداد لقبول ذلك، فهو إيليا الذي سيأتي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إن العبارة تعرّف يوحنا المعمدان بأنه إيليا الذي سيأتي؛ قارن ملاخي 4:5 ومتى 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ θέλετε δέξασθαι
  choice: إن كنتم مستعدين أن تقبلوا هذا
  rationale: يفيد θέλετε مع المصدر استعداد الإرادة وقبول القول، لا مجرد التمني. وأُضيف اسم الإشارة «هذا» لإظهار المفعول المفهوم من السياق بصورة طبيعية في العربية.
- source_word: αὐτός
  choice: فهو
  rationale: الضمير يعود إلى يوحنا المعمدان، و«فهو» عربية طبيعية وتحفظ قوة الإسناد من غير مبالغة في توكيد الضمير.
- source_word: ἐστιν Ἠλίας
  choice: هو إيليا
  rationale: يحافظ على صيغة التعريف المباشرة في اليونانية، من غير تخفيفها إلى «مثل إيليا» أو تفسيرها بأنها مجرد مماثلة في الدور.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: الآتي
  rationale: اسم الفاعل المعرّف ينقل بإيجاز معنى الشخص المنتظر أن يأتي، ويحافظ على صدى التوقع النبوي من غير حصره في قرب زمني مباشر.
- source_word: καὶ
  choice: و
  rationale: أداة وصل مباشرة تحفظ ارتباط الآية بما قبلها من غير فرض علاقة تفسيرية إضافية.
theological_decisions:
- issue: تعريف يوحنا المعمدان بإيليا
  choice: فهو إيليا الآتي
  alternative: فهو الذي يقوم بدور إيليا؛ أو هو مثل إيليا
  rationale: النص اليوناني يصرح بالتعريف «هو إيليا»، لكنه يسبقه بند شرطي يتعلق بقبول السامعين. لذلك حُفظت قوة العبارة والتوتر التفسيري معًا، من غير تحويل التعريف إلى مجرد تشبيه أو شرح وظيفي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية كريمة. اختير «مستعدين أن تقبلوا» لإبراز الاستعداد الإرادي، و«الآتي» للمحافظة على الإيجاز والصدى النبوي. وُضع مؤشر الحاشية [a] في المتن.
