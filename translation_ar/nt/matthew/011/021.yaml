    rationale: صيغة المثنى المؤنث تجعل المدينتين هما فاعلَي التوبة في العربية، بينما المقصود في النص هم سكانهما. التعبير الصريح عن الأهالي يحفظ المرجع البشري للفعل.
  - severity: low
