source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: ar
  text: «ويل لكِ يا كورزين! ويل لكِ يا بيت صيدا! فلو أن أعمال القوة[a] التي جرت بينكم قد جرت في صور وصيدا، لتاب أهل صور وصيدا منذ زمن بعيد في المسوح والرماد.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المعجزات»؛ والعبارة اليونانية تعني «أعمال قوة» أو «أعمال ذات قوة».
    reason: بيان البديل المعجمي لـ αἱ δυνάμεις مع الحفاظ على صلته بمعنى القوة.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: ويل لك
  rationale: يحفظ قوة العبارة النبوية التي تجمع بين التنديد والأسى والإنذار بالدينونة، مع توجيه الخطاب مباشرة إلى كل مدينة.
- source_word: Χοραζίν
  choice: كورزين
  rationale: نقل صوتي واضح لاسم المكان اليوناني، وفق الصيغة العربية الشائعة.
- source_word: Βηθσαϊδά
  choice: بيت صيدا
  rationale: استخدام الصيغة العربية الكتابية المألوفة لاسم المكان.
- source_word: ὅτι
  choice: لأنه
  rationale: تقدّم العبارة سبب إعلان الويل، وتربط الجملة التعليلية بما قبلها بوضوح.
- source_word: ἐγένοντο ... αἱ γενόμεναι
  choice: جرت ... التي جرت
  rationale: يعبّر الفعل «جرت» طبيعيًا عن وقوع الأعمال في موضع ما، ويحافظ التكرار على الصلة اللفظية الموجودة في اليونانية من غير تكلف.
- source_word: αἱ δυνάμεις
  choice: أعمال القدرة
  rationale: يحفظ الارتباط الدلالي بالقوة الإلهية ولا يحصر المعنى مسبقًا في مصطلح «المعجزات»، مع إثبات البديل في الحاشية.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: المخاطَب لفظًا مدينتان والمقصود من فيهما؛ و«بينكم» تفيد أن الأعمال جرت في وسط السكان لا في داخلهم.
- source_word: πάλαι
  choice: منذ زمن بعيد
  rationale: ينقل الدلالة الزمنية التي تفيد أن التوبة كانت ستحدث قبل وقت طويل.
- source_word: ἂν ... μετενόησαν
  choice: لتابتا
  rationale: صيغة جواب الشرط غير الواقع تنقل معنى النتيجة الافتراضية، والمثنى يعود طبيعيًا في العربية إلى صور وصيدا.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: في المسوح والرماد
  rationale: يحافظ على الصورة الثقافية المألوفة الدالة على الحزن والتوبة العلنية.
theological_decisions:
- issue: طبيعة المقارنة بين صور وصيدا من جهة وكورزين وبيت صيدا من جهة أخرى
  choice: إبقاء العبارة تقريرًا شرطيًا مضادًا للواقع يبرز جسامة مسؤولية المدينتين اللتين شهدتا أعمال القدرة ولم تتوبا.
  alternative: اعتبار المقارنة مجرد مبالغة بلاغية لا تحمل مفاضلة حقيقية في المسؤولية والدينونة.
  rationale: النص نفسه يصوغ مقارنة افتراضية صريحة لتشديد إعلان الويل، لذلك تُحفظ قوة المقارنة من غير إضافة نتائج عقائدية لا يصرح بها.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. استُخدم التعبير الكتابي المألوف «المسوح والرماد»، مع إبقاء أسماء المدن في خطاب مباشر والمحافظة على بنية الشرط الافتراضي وقوة الإنذار النبوي.
