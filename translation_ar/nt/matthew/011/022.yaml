  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: ar
  text: 'لكني أقول لكم: سيكون الأمر أهون على صور وصيدا في يوم الدينونة مما سيكون عليكم.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: لكني
  rationale: تفيد هنا الاستدراك القوي والانتقال إلى مقارنة تُبرز شدة التوبيخ، و«لكني» عربية طبيعية واضحة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: تنقل صيغة الخطاب المباشر الشائعة في متى وتحافظ على نبرتها التوكيدية.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: على صور وصيدا
  rationale: استُعملت «على» في تركيب المقارنة العربي للدلالة على من سيكون احتمال الدين أيسر لهما.
- source_word: ἀνεκτότερον
  choice: احتمال ... أيسر
  rationale: 'صياغة عربية طبيعية تنقل معنى الصفة المقارنة: ما يكون تحمله أهون أو أيسر، من غير تخفيف لجدية الدين.'
- source_word: ἔσται
  choice: سيكون
  rationale: ينقل المستقبل الصريح في الفعل اليوناني.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: يوم الدين
  rationale: تعبير عربي واضح وموقر يدل على زمن القضاء الأخروي، ويحافظ على معنى κρίσις القضائي.
- source_word: ἢ ὑμῖν
  choice: منه عليكم
  rationale: تُتم الصياغة المقارنة بوضوح وتحافظ على جمع المخاطبين في «عليكم».
theological_decisions:
- issue: طبيعة الدين الآتي
  choice: يوم الدين
  alternative: يوم القضاء
  rationale: يشير السياق إلى يوم القضاء الأخروي المعروف، من غير إضافة تفاصيل عقائدية لا يصرح بها النص. و«الدين» هنا بمعنى المحاكمة والحكم، لا مجرد الإدانة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم تركيب «سيكون احتمال يوم الدين أيسر...» لتجنب العبارة المبهمة «سيكون أيسر» وللتعبير طبيعيًا عن الصفة اليونانية المقارنة.
