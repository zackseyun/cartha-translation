base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: ar
  text: 'جاء ابن الإنسان يأكل ويشرب، فيقولون: «انظروا! رجل أكول وسكّير، صديق لجباة الضرائب والخاطئين!» وتبرّرت الحكمة بأعمالها.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات «أولادها» بدلًا من «أعمالها»: «وتبرّرت الحكمة بأولادها». ويمكن أيضًا ترجمة «تبرّرت» هنا: «ثبت صوابها».'
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب بصيغته الكتابية المألوفة وخلفيته السامية ودلالته المسيانية من غير تفسير زائد.
- source_word: ἐσθίων καὶ πίνων
  choice: يأكل ويشرب
  rationale: تعبير مباشر يحفظ المقابلة السياقية مع نهج يوحنا الزاهد من غير مبالغة مثل «يُقيم الولائم».
- source_word: Ἰδοὺ
  choice: انظروا!
  rationale: صيغة عربية حديثة وطبيعية تنقل قوة التنبيه والتشهير العلني في الاتهام.
- source_word: φάγος
  choice: أكول
  rationale: ينقل الاسم القدحي بإيجاز ووضوح بوصفه اتهامًا بالشَّرَه.
- source_word: οἰνοπότης
  choice: سكّير
  rationale: ينقل تهمة الإفراط في شرب الخمر، لا مجرد شربها بصورة محايدة.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: صديق لجباة الضرائب والخاطئين
  rationale: يحفظ تركيب العبارة وقوة التصنيفين الاجتماعية والدينية، مع استعمال «جباة الضرائب» الواضح للقارئ الحديث.
- source_word: ἐδικαιώθη
  choice: تبرّرت
  rationale: يحفظ الصلة اللفظية بمفهوم التبرير، مع إفادة ثبوت صواب الحكمة في هذا السياق.
- source_word: ἡ σοφία
  choice: الحكمة
  rationale: يبقي التشخيص الأدبي للحكمة من غير أن يحدّدها بالمسيح أو بالخطة الإلهية تحديدًا غير مصرّح به.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: بأعمالها
  rationale: ترجمة شفافة لقراءة النص اليوناني «أعمال»، وتحفظ تشخيص الحكمة وما يصدر عنها.
theological_decisions:
- issue: المقصود بالحكمة في العبارة الختامية
  choice: الإبقاء على «الحكمة» مشخَّصة من غير تعيين صريح لهويتها
  alternative: تفسيرها بأنها يسوع نفسه أو حكمة الله وتدبيره الخلاصي
  rationale: النص يصوغ قولًا عن الحكمة المشخَّصة ولا يحسم هويتها صراحة، لذلك تُحفظ دلالته وتوتره اللاهوتي.
- issue: الصيغة النصية للعبارة الختامية
  choice: 'اتباع قراءة SBLGNT: «أعمالها»'
  alternative: «أولادها» وفق بعض المخطوطات وبالموازاة مع لوقا 7:35
  rationale: المصدر المحدد يقرأ ἔργων، ولذلك تُثبت «أعمالها» في المتن، مع توثيق القراءة البديلة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «انظروا» بصيغة الجمع لمخاطبة الجماعة، و«جباة الضرائب» بدل المصطلح التراثي الأقل وضوحًا «العشارين». وُضع مؤشر الحاشية بعد العبارة التي توثق بديلها النصي والدلالي.
