  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: ar
  text: ولمّا سمع يوحنا، وهو في السجن، بأعمال المسيح[a]، أرسل على يد تلاميذه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«المسيح» تعني حرفيًّا: «الممسوح».'
    reason: بيان الدلالة اللقبية لكلمة Χριστός من غير تغيير الترجمة العربية المعيارية.
  - marker: b
    text: 'تقرأ بعض المخطوطات: «أرسل اثنين من تلاميذه».'
    reason: بيان القراءة النصية البديلة δύο τῶν μαθητῶν αὐτοῦ بدل διὰ τῶν μαθητῶν αὐτοῦ.
lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: تفيد انتقالًا سرديًّا خفيفًا؛ دُمجت طبيعيًّا في «ولمّا» من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἀκούσας
  choice: لمّا سمع
  rationale: نُقل اسم الفاعل الماضي بجملة زمنية عربية طبيعية تحافظ على سبق السماع لفعل الإرسال.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: وهو في السجن
  rationale: توضح أن يوحنا هو الذي كان في السجن، وتتجنب احتمال تعلّق العبارة بالسماع نفسه.
- source_word: τὰ ἔργα
  choice: أعمال
  rationale: تحافظ على المعنى الواسع الذي يشمل أفعال يسوع وخدمته وأعمال قدرته، من غير حصرها في المعجزات.
- source_word: τοῦ χριστοῦ
  choice: المسيح
  rationale: Χριστός هنا لقب ذو دلالة مسيانية؛ و«المسيح» هو المقابل العربي الطبيعي الراسخ الذي ينقل معنى الممسوح.
- source_word: πέμψας
  choice: أرسل إليه رسالةً
  rationale: الفعل في اليونانية لا يصرّح بالمفعول، لكن الآية التالية تبين أن التلاميذ حملوا قولًا؛ أُضيفت «رسالةً» لاستقامة العربية مع إبقاء الوساطة صريحة.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: على يد تلاميذه
  rationale: διά مع المضاف إليه تدل على الوساطة؛ و«على يد» تعبير عربي طبيعي يحافظ على كون التلاميذ وسطاء في نقل الرسالة.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: استُعمل اللقب العربي المعروف «المسيح» لأنه ينقل الوظيفة المسيانية في هذا السياق، مع الإشارة في الحاشية إلى الصياغة التفسيرية «الممسوح» حفاظًا على الدلالة الأصلية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «وهو في السجن» لرفع الالتباس التركيبي، و«على يد» للدلالة الطبيعية على الوساطة. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
