  source_fidelity: 'المتن ينقل العناصر الأساسية نقلاً جيدًا: سمع يوحنا وهو في السجن بأعمال المسيح، ثم أرسل بواسطة تلاميذه. لكن «إليه رسالةً» تضيف مفعولًا ومرجعًا («إليه») غير مذكورين في نص الآية اليوناني، وإن كان السياق التالي يبينهما. والأدق إبقاء الإرسال غير مصرَّح بمفعوله كما في الأصل.'
