  to: ولمّا سمع يوحنا، وهو في السجن، بأعمال المسيح[a]، أرسل على يد تلاميذه[b].
  rationale: حُذفت «إليه رسالةً» لأنها تصرّح بما يتركه النص اليوناني في هذه الآية غير مصرّح به، مع الحفاظ على الإحالة الطبيعية إلى وساطة التلاميذ. ونُقحت الحاشية النصية لتعرض القراءة البديلة بدقة وبتحفظ مناسب.
