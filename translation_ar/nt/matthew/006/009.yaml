  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: ar
  text: 'فصلّوا أنتم إذًا هكذا: «أبانا الذي في السماوات[a]، ليتقدّس اسمك[b]،»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تَرِد «السماوات» في اليونانية بصيغة الجمع؛ ويشيع تقليديًا: «الذي في السماء».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: ليُعترَف بقداسة اسمك ويُعامَل على أنه مقدّس.'
    reason: clarification
lexical_decisions:
- source_word: Οὕτως
  choice: هكذا
  rationale: تدل على الكيفية أو النموذج الذي ينبغي أن تكون عليه الصلاة، و«هكذا» تعبير عربي طبيعي ومباشر.
- source_word: οὖν
  choice: إذًا
  rationale: تحفظ صلة الاستنتاج بالتعليم السابق من غير إثقال الأسلوب.
- source_word: προσεύχεσθε ὑμεῖς
  choice: فصلّوا أنتم
  rationale: صيغة الأمر تُنقل بالفعل «صلّوا»، ويُصرَّح بالضمير «أنتم» مراعاةً للتوكيد في النص اليوناني؛ والفاء تصل العبارة بما قبلها اتصالًا طبيعيًا.
- source_word: Πάτερ ἡμῶν
  choice: أبانا
  rationale: نداء عربي موجز وطبيعي يحفظ معنى الأبوة وضمير الجماعة في «ἡμῶν».
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: الذي في السماوات
  rationale: تحفظ «الذي» القوة الوصفية لأداة التعريف اليونانية، وتحافظ «السماوات» على صيغة الجمع في الأصل.
- source_word: ἁγιασθήτω
  choice: ليتقدّس
  rationale: صيغة عربية دعائية موجزة تحفظ قوة الطلب في الأمر الغائب المبني للمجهول، وتبقي فكرة القداسة ظاهرة.
- source_word: τὸ ὄνομά σου
  choice: اسمك
  rationale: نقل مباشر يحافظ على لفظ «الاسم» من غير توسيع تفسيري إلى السمعة أو الشخصية.
theological_decisions:
- issue: صياغة نداء الله مع الإشارة إلى علوّه
  choice: أبانا الذي في السماوات
  alternative: أبانا الذي في السماء؛ أبانا السماوي
  rationale: تُبقي الصياغة على الجمع اليوناني «السماوات»، وتحفظ في آن واحد قرب خطاب الأب وعلوّه، من غير تحويل العبارة إلى صفة تفسيرية.
- issue: دلالة ἁγιασθήτω في الطلبة الأولى
  choice: ليتقدّس اسمك
  alternative: ليُعامَل اسمك على أنه مقدّس؛ ليكن اسمك مقدّسًا
  rationale: «ليتقدّس» تحافظ على الإيجاز والصيغة الطلبية وعلى احتمال شمول الطلب إعلان قداسة اسم الله وإكرامه بوصفه مقدسًا، من غير حصر المعنى في فعل البشر وحدهم.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة موقّرة. حافظت الصياغة على توكيد «أنتم»، وعلى جمع «السماوات»، واستعملت «ليتقدّس» لصون الإيجاز والعمق الدلالي في الطلبة.
