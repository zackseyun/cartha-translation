  text: Give us today our daily bread[a].
translation:
  language: ar
  text: أَعْطِنا اليومَ خُبزَنا اليوميَّ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خُبزَنا لهذا اليوم»، أو «خُبزَنا لليوم الآتي»، أو «الخُبزَ الذي نحتاج إليه». الصفة اليونانية ἐπιούσιον نادرة، ومعناها الدقيق موضع خلاف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: خُبزَنا
  rationale: يحافظ «الخبز» على الصورة الحسية المباشرة في اليونانية، مع إمكان دلالته في السياق على القوت عمومًا؛ وقد أُدمجت معه إضافة ἡμῶν في صيغة عربية طبيعية.
- source_word: ἐπιούσιον
  choice: اليوميَّ
  rationale: الصفة اليونانية نادرة ومختلف في معناها. «اليومي» هو التعبير العربي المألوف في هذه الصلاة، ويؤدي معنى الاحتياج المتجدد دون أن يحسم وحده جميع الاحتمالات؛ لذلك ذُكرت البدائل في الحاشية.
- source_word: δὸς ἡμῖν
  choice: أَعْطِنا
  rationale: صيغة أمر مباشرة وطبيعية تقابل فعل «أعطِ» مع ضمير المتكلمين مفعولًا غير مباشر، ولا تحتاج إلى لفظ أكثر رسمية مثل «امنحنا».
- source_word: σήμερον
  choice: اليومَ
  rationale: ينقل الظرف الزمني بمعناه المباشر والواضح في العربية المعاصرة.
theological_decisions:
- issue: معنى ἐπιούσιον في الصلاة الربانية
  choice: اليوميَّ
  alternative: الذي لهذا اليوم؛ الذي لليوم الآتي؛ الضروري لقوتنا
  rationale: لا يُعرف المعنى الدقيق للصفة النادرة على وجه اليقين. اختير التعبير العربي المألوف والواضح في المتن، مع إبقاء الاحتمالات التفسيرية الحقيقية في الحاشية بدل حسمها مذهبيًا أو لغويًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، بصياغة دعائية مباشرة. حُفظ لفظ «الخبز» بدل تعميمه إلى «القوت»، وأُثبتت علامة الحاشية في المتن.
