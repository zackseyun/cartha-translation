  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: ar
  text: وَمَن منكم يستطيع بقلقه أن يضيف إلى عمره ذراعًا واحدة[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «أن يضيف إلى قامته ذراعًا واحدة»، لأن الكلمة اليونانية قد تعني «العمر/مدة الحياة» أو «القامة».'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: وَمَن منكم
  rationale: تؤدي صيغة السؤال اليونانية بمعنى «مَن منكم»، أما δέ فهي أداة وصل خفيفة يناسبها هنا حرف الواو.
- source_word: μεριμνῶν
  choice: بقلقه
  rationale: 'اسم الفاعل يدل على القلق أو الهم، وصيغة «بقلقه» تنقل دلالة الوسيلة: ماذا يقدر الإنسان أن يحقق عن طريق القلق؟'
- source_word: δύναται προσθεῖναι
  choice: يستطيع ... أن يضيف
  rationale: تحافظ العبارة على معنى القدرة في δύναται وعلى الصورة المحسوسة لفعل الإضافة في προσθεῖναι.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: إلى عمره
  rationale: يمكن أن تدل ἡλικία على العمر أو مدة الحياة، كما يمكن أن تدل على القامة. اختير «عمره» لاتساقه مع سياق القلق على الحياة، مع إبقاء المعنى الآخر في الحاشية.
- source_word: πῆχυν ἕνα
  choice: ذراعًا واحدة
  rationale: الذراع مقياس طول قديم، والإبقاء عليه يصون الصورة البلاغية التي تقيس امتداد العمر بمقياس طول.
theological_decisions:
- issue: دلالة ἡλικία في قول يسوع
  choice: العمر أو مدة الحياة
  alternative: القامة
  rationale: المعنيان ثابتان لغويًا، ولا ينبغي محو هذا الغموض الحقيقي. اختير «العمر» في المتن لملاءمته للسياق الأوسع عن الحياة وعناية الله، وذُكر معنى «القامة» في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع الحفاظ على السؤال البلاغي والصورة القديمة لمقياس الذراع وعلى صيغة المذكر المفرد العامة في الأصل.
