  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: ar
  text: فإن كان الله يكسو عشب الحقل هكذا، وهو موجود اليوم ويُطرَح غدًا في التنور، أفلا يكسوكم بالأحرى بكثير، يا قليلي الإيمان؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: يا من إيمانكم قليل. اللفظة اليونانية نداء مباشر يحمل عتابًا على قلّة الإيمان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: فإن كان
  rationale: تنقل أداة الشرط مع الانتقال الحِجاجي الخفيف، وتنسجم طبيعيًا مع العربية في سياق الاستدلال.
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: عشب الحقل
  rationale: يحافظ على المعنى العام لـχόρτος بوصفه العشب أو الكلأ، من غير تخصيصه بالزهور.
- source_word: σήμερον ὄντα
  choice: وهو موجود اليوم
  rationale: صياغة عربية واضحة تحافظ على معنى الوجود الحاضر المؤقت من غير إضافة معنى «حيّ» غير الصريح.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: ويُطرَح غدًا في التنور
  rationale: κλίβανος فرن للخبز، و«التنور» لفظ عربي مألوف ودقيق للصورة المنزلية؛ والبناء للمجهول يحفظ صيغة النص.
- source_word: οὕτως ἀμφιέννυσιν
  choice: يُلبِس ... هكذا
  rationale: يحفظ استعارة الإلباس في ἀμφιέννυμι وترتيب المقارنة من غير تحويلها إلى مجرد تزيين.
- source_word: οὐ πολλῷ μᾶλλον
  choice: أفلا ... بالأحرى
  rationale: ينقل السؤال البلاغي وحجة الانتقال من الأدنى إلى الأعلى في عربية طبيعية؛ ودلالة التفاضل القوي حاضرة في «بالأحرى».
- source_word: ὑμᾶς
  choice: يُلبِسكم
  rationale: أُعيد الفعل المفهوم من الجملة السابقة في العربية لإتمام المعنى ووضوح المفعول به.
- source_word: ὀλιγόπιστοι
  choice: يا قليلي الإيمان
  rationale: يحفظ النداء الجمعي المباشر ونبرة العتاب على قصور الثقة، من غير صياغة قد توحي بنفي الإيمان كله.
theological_decisions:
- issue: حجة عناية الله من الأدنى إلى الأعلى
  choice: الإبقاء على السؤال البلاغي الذي يؤكد أن الله سيكسو المخاطَبين بالأحرى
  alternative: تحويل السؤال إلى تقرير مباشر بأن الله سيكسوهم
  rationale: صياغة اليونانية استفهامية إنكارية، والنداء الختامي يشدد العتاب والثقة المطلوبة من غير إضافة تقرير عقائدي يتجاوز النص.
- issue: دلالة ὀλιγόπιστοι
  choice: يا قليلي الإيمان
  alternative: يا من إيمانكم قليل / يا ضعاف الإيمان
  rationale: الاختيار يحافظ على الغموض الدلالي بين قلة الإيمان وقصور الثقة في هذا الظرف، ويتجنب أن يفهم منه انعدام الإيمان أو الحكم على الحالة الروحية برمتها.
translation_notes:
  register: 'عربية فصحى معاصرة، واضحة وموقرة. استُخدم «التنور» للدقة الثقافية، وأُبقيت استعارة إلباس العشب والسؤال البلاغي والنداء المباشر. وُضعت علامة الحاشية بعد العبارة التي تشرحها. ملاحظة تدقيقية: الحاشيتان في طبقة الاستشارة الإنجليزية تبدوان متبادلتَي الموضع؛ أُسندت الحاشية المعجمية هنا إلى «يا قليلي الإيمان»، ولم تُضف حاشية للتنور لأن معناه ظاهر في العربية.'
