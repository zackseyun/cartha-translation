base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: ar
  text: وعندما تصلّون، لا تكثروا من الكلام الفارغ[a] مثل غير اليهود[b]، لأنهم يظنون أنهم سيُسمَع لهم بسبب كثرة كلامهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لا تثرثروا» أو «لا تكرّروا كلامًا بلا معنى». الفعل اليوناني نادر، ويُرجَّح أنه يشير إلى الكلام الفارغ أو الآلي أو المفرط، لا إلى كل تكرار صادق في الصلاة.
    reason: lexical_alternative
  - marker: b
    text: أو «الوثنيين». وحرفيًا «الأمميين»، أي الشعوب من خارج الشعب اليهودي.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: وعندما تصلّون
  rationale: صيغ اسم الفاعل اليونانية هنا ظرفية، فتفيد الحال أو الزمن، و«عندما تصلّون» عربية طبيعية في سياق التعليم. ونقلت δέ بالواو لأنها تصل الكلام بما قبله من غير مبالغة في معنى الاستدراك.
- source_word: μὴ βατταλογήσητε
  choice: لا تكدّسوا كلامًا فارغًا
  rationale: الفعل اليوناني نادر، ويرجّح أنه يصف الكلام الفارغ أو الآلي أو المفرط، لا مجرد تكرار ألفاظ الصلاة. وهذه الصياغة تجمع بين كثرة الكلام وخلوّه من المعنى المقصود.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: مثل غير اليهود
  rationale: يشير اللفظ في هذا السياق اليهودي إلى الذين هم من خارج الشعب اليهودي. وهذه العبارة أوضح للقارئ العربي المعاصر من «الأمم»، وأقل تفسيرًا دينيًا من «الوثنيين».
- source_word: δοκοῦσιν
  choice: يظنون
  rationale: ينقل افتراضهم أو اعتقادهم بوضوح وبأسلوب عربي مألوف.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: بسبب كثرة كلامهم
  rationale: تفيد πολυλογία كثرة الكلام والإطناب، والجار والمجرور يبيّن الأساس الذي يظنون أنه سيجعل صلاتهم مسموعة.
- source_word: εἰσακουσθήσονται
  choice: سيُسمَع لهم
  rationale: يحافظ على معنى السماع المؤاتي أو الإصغاء إلى الطلب، من غير أن يستبدله بالمعنى الأقوى «ستُستجاب طلباتهم».
theological_decisions:
- issue: هل ينهى يسوع عن كل تكرار في الصلاة أم عن الكلام الفارغ المفرط؟
  choice: لا تكدّسوا كلامًا فارغًا
  alternative: لا تكرّروا الكلام بلا معنى؛ لا تثرثروا
  rationale: تحافظ الصياغة على دلالة الفعل النادر، وتجنّب أن توحي بأن كل تكرار صادق في الصلاة ممنوع. موضع النقد هو الاتكال على الكلام الفارغ والكثير وسيلةً لضمان سماع الله.
- issue: تحديد هوية οἱ ἐθνικοί
  choice: غير اليهود
  alternative: الأمم؛ الوثنيون
  rationale: «غير اليهود» يبيّن المرجع الاجتماعي والعَهدي في السياق من غير أن يفترض أن المقصود حصراً توصيف عقائدهم الدينية، بينما «الوثنيون» تفسير أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «تكدّسوا كلامًا فارغًا» لتقريب صورة الإفراط الخالي من المضمون، مع إبقاء الإيقاع التعليمي المباشر للآية. أُثبتت علامة الحاشية [a] في المتن.
