id: MAT.6.25
reference: Matthew 6:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: ar
  text: 'لذلك أقول لكم: لا تقلقوا على حياتكم[a] بشأن ما تأكلون، ولا على أجسادكم بشأن ما تلبسون. أليست الحياة أكثر من الطعام، والجسد أكثر من اللباس؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نفوسكم». لكن سياق الأكل واللباس يرجّح هنا معنى «حياتكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق، وتحافظ بوضوح على الصلة المنطقية بالسياق السابق.
- source_word: μεριμνᾶτε
  choice: لا تقلقوا
  rationale: ينقل معنى الانشغال القَلِق، وهو تعبير عربي معاصر واضح من غير أن يجعل كل اهتمام عادي موضع نهي.
- source_word: ψυχῇ
  choice: حياتكم
  rationale: سياق الأكل ومقابلة الحياة بالطعام يرجّح معنى الحياة أو الذات الحية، لا تخصيص النفس غير المادية.
- source_word: τί φάγητε
  choice: بشأن ما تأكلون
  rationale: صياغة عربية طبيعية تعبّر عن موضوع القلق ذي التوجه المستقبلي من غير إثقال العبارة بزمن لا يصرّح به اليوناني صراحة.
- source_word: σώματι
  choice: أجسادكم
  rationale: يشير إلى الجسد المادي في مقابل اللباس؛ واستُعمل الجمع لملاءمة خطاب الجماعة في العربية.
- source_word: τί ἐνδύσησθε
  choice: بشأن ما تلبسون
  rationale: ينقل فعل ارتداء الثياب بعبارة عربية مألوفة ومباشرة.
- source_word: οὐχὶ
  choice: أليست
  rationale: تفتتح سؤالًا بلاغيًا يتوقع جوابًا بالإيجاب.
- source_word: πλεῖόν
  choice: أكثر من
  rationale: يحافظ على المقارنة العامة في الأصل من غير حصرها صراحة في القيمة أو الأهمية وحدهما.
- source_word: τροφῆς
  choice: الطعام
  rationale: يدل هنا على ما يغذي الحياة، و«الطعام» هو المقابل العربي الأوضح والأبسط.
- source_word: ἐνδύματος
  choice: اللباس
  rationale: اسم عام لما يُلبس، ويوازي «الطعام» بإيجاز ووضوح.
theological_decisions:
- issue: دلالة ψυχή في تعليم يسوع
  choice: ترجمتها «الحياة»
  alternative: «النفس»
  rationale: يتناول السياق ضرورات المعيشة المادية، ولا سيما الأكل واللباس؛ لذلك تدل الكلمة هنا على الحياة أو الذات الحية، من غير تقرير ثنائية أنثروبولوجية لا يفرضها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على السؤال البلاغي وعلى المقارنة المفتوحة في «أكثر من»، مع تجنب ألفاظ مذهبية أو تفسيرية زائدة.
