base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: ar
  text: ولكن إن لم تغفروا للناس تعدّياتهم، فأبوكم أيضًا لن يغفر لكم تعدّياتكم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: ولكن إن لم
  rationale: تفيد ἐὰν الشرط، وتفيد δέ مقابلة بما سبق، وينفي μή فعل الشرط؛ وصياغة «ولكن إن لم» واضحة وطبيعية وتحفظ هذه العناصر.
- source_word: ἀφῆτε
  choice: تغفروا
  rationale: الفعل ἀφίημι في سياق إساءات الناس بعضهم إلى بعض يعني الغفران، وتكرار الجذر العربي نفسه لاحقًا يحفظ التوازي في اليونانية.
- source_word: τοῖς ἀνθρώποις
  choice: للناس
  rationale: ἄνθρωποι لفظ عام يشمل البشر ولا يختص بالذكور، و«الناس» هو المقابل العربي الطبيعي المباشر.
- source_word: οὐδὲ
  choice: فلن
  rationale: ينفي οὐδέ الجواب المقابل أيضًا. وتؤدي «فلن» في العربية معنى النتيجة السلبية المستقبلية بوضوح، مع أن دلالة «أيضًا/كذلك» تُفهم من التوازي.
- source_word: ὁ πατὴρ ὑμῶν
  choice: أبوكم
  rationale: النص يقول «أبوكم» دون صفة «السماوي»، لذلك لا تُزاد الصفة من السياق القريب.
- source_word: ἀφήσει
  choice: يغفر
  rationale: حُفظت وحدة اللفظ مع «تغفروا» لأن الأصل يكرر ἀφίημι، كما حُفظ زمن المستقبل بواسطة «لن».
- source_word: τὰ παραπτώματα ὑμῶν
  choice: زلّاتكم
  rationale: παραπτώματα تدل على الزلات أو التجاوزات أو الإسـاءات. و«زلّاتكم» عربية فصيحة مفهومة وتحفظ الثقل الأخلاقي من غير مبالغة أو تفسير زائد.
theological_decisions:
- issue: العلاقة الشرطية بين غفران الإنسان وغفران الآب
  choice: 'الإبقاء على صيغة الشرط والنتيجة مباشرة: «إن لم... فلن...»'
  alternative: تفسير العبارة بأنها مجرد علامة على الغفران، أو قصرها على فقدان الشركة دون الغفران نفسه
  rationale: يعرض النص اليوناني شرطًا مباشرًا ونتيجة مباشرة؛ فلا ينبغي للترجمة أن تخفف هذا التوتر اللاهوتي أو تحسمه بإضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع توازٍ لفظي بين «تغفروا» و«يغفر»، ومن دون إضافة «السماوي» غير الموجودة في نص الآية.
