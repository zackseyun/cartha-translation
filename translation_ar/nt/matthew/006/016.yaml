source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: ar
  text: 'ومتى صمتم، فلا تصيروا عابسي الوجوه كالمرائين؛ فإنهم يشوّهون وجوههم[a] لكي يبدوا للناس صائمين. الحق أقول لكم: لقد استوفوا أجرهم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُفسدون مظهر وجوههم» أو «يُهملون هيئة وجوههم». يحتمل الفعل اليوناني تغيير المظهر أو إهماله بحيث يبدو أثر الصوم ظاهرًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: ومتى صمتم
  rationale: تنقل «متى» الطابع الزمني غير المحدد والمتكرر، وتربط الواو الوصية بما قبلها من تعاليم موازية.
- source_word: μὴ γίνεσθε
  choice: فلا تصيروا
  rationale: تحافظ «تصيروا» على الدلالة التحولية للفعل، أي لا تتخذوا هذه الهيئة.
- source_word: σκυθρωποί
  choice: عابسي الوجوه
  rationale: تعبير عربي واضح عن الهيئة الكئيبة أو المتجهمة المقصودة التي يتعمدها المراؤون.
- source_word: ἀφανίζουσιν τὰ πρόσωπα αὐτῶν
  choice: يشوّهون وجوههم
  rationale: يحفظ الصورة الحسية للفعل والاسم، مع إبقاء احتمال تغيير هيئة الوجه أو إهمال مظهره دون تحديد الوسيلة.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: لكي يبدوا للناس صائمين
  rationale: تحفظ «لكي» دلالة الغاية، ويؤدي «يبدوا» معنى الظهور أمام الناس، و«الناس» هنا عامة البشر.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية مهيبة ومفهومة تنقل التوكيد السلطاني للصيغة اليونانية.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: لقد استوفوا أجرهم
  rationale: «استوفوا» تنقل الاستعمال التجاري الدال على قبض الأجر كاملًا، لا مجرد امتلاكه.
theological_decisions:
- issue: مدلول τοῖς ἀνθρώποις
  choice: للناس
  alternative: للبشر / أمام الناس
  rationale: اللفظ اليوناني جمع مذكر من حيث الصيغة، لكنه يُستعمل هنا بمعنى البشر عمومًا؛ و«الناس» تنقل هذا المعنى طبيعيًا بلا حصر في الذكور.
- issue: دلالة استيفاء الأجر في ἀπέχουσιν
  choice: لقد استوفوا أجرهم
  alternative: لهم أجرهم / قد نالوا أجرهم
  rationale: الصياغة المختارة تحافظ على معنى القبض الكامل الضمني في التعبير، من غير إضافة تقرير عقائدي يتجاوز النص.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم «المراؤون» بدل النقل الحرفي الجامد لـ«المنافقين» لأن السياق يركز على استعراض التقوى أمام الناس، مع تجنب تحميل اللفظ معنى اصطلاحيًا أوسع من المقام.
