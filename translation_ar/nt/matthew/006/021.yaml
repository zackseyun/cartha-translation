  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ar
  text: لِأَنَّهُ حَيْثُ يَكُونُ كَنْزُكَ، هُنَاكَ سَيَكُونُ قَلْبُكَ أَيْضًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: حَيْثُ
  rationale: أداة مكان تربط موضع الكنز بموضع القلب، وهي أفصح مقابل عربي طبيعي في هذا التركيب.
- source_word: γάρ
  choice: لِأَنَّهُ
  rationale: تحفظ الصلة التفسيرية بالتعليم السابق عن ادخار الكنوز، وتوضح أن القول يعلل ذلك التعليم.
- source_word: θησαυρός
  choice: كَنْز
  rationale: المقابل العربي المباشر الذي يحفظ الدلالة الحرفية والمجازية من غير تضييقها إلى المال وحده.
- source_word: σου
  choice: ـكَ
  rationale: ضمير ملكية للمفرد المخاطب، وقد أُلحق بكل من «كنز» و«قلب» وفق النص اليوناني.
- source_word: ἐκεῖ
  choice: هُنَاكَ
  rationale: تقابل «حيث» وتحفظ التوازي المكاني الموجز في العبارة اليونانية.
- source_word: ἔσται
  choice: سَيَكُونُ
  rationale: صيغة مستقبل صريحة في اليونانية، فحُفظت في العربية بدل تحويلها إلى حاضر حكمي.
- source_word: καρδία
  choice: قَلْب
  rationale: المقابل العربي المألوف والدقيق، ويظل واسع الدلالة ليشمل الرغبة والولاء والتوجه الباطني.
- source_word: καὶ
  choice: أَيْضًا
  rationale: تحفظ المعنى الإضافي الذي يربط وجود القلب بموضع الكنز.
theological_decisions:
- issue: القوة الزمنية لصيغة ἔσται في قول ذي طابع حكمي
  choice: 'الإبقاء على المستقبل الصريح: «سيكون»'
  alternative: 'استعمال الحاضر: «يكون» أو «هو» للتعبير عن حقيقة عامة دائمة'
  rationale: الفعل اليوناني بصيغة المستقبل. والإبقاء عليها يحفظ احتمال أن القول لا يصف مجرد تطابق ثابت، بل يشير كذلك إلى أن توجه القلب يتبع موضع الكنز، من غير تحويل هذا الاحتمال إلى تفسير عقائدي ملزم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على التوازي «حيث... هناك» وعلى المستقبل الصريح في الأصل. استُخدم الضبط الكامل لتيسير القراءة، ويمكن حذفه وفق أسلوب النشر العام.
