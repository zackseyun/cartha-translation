  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: ar
  text: فَإِنْ غَفَرْتُمْ لِلنَّاسِ تَعَدِّيَاتِهِمْ[a]، يَغْفِرْ لَكُمْ أَيْضًا أَبُوكُمُ السَّمَاوِيُّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «زلاتهم»، أو «إساءاتهم»، أو «أخطائهم». تشير الكلمة اليونانية إلى تعديات أو إخفاقات أخلاقية.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أبوكم، السماوي»؛ وتُترجم تقليديًا: «أبوكم الذي في السماوات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: لِأَنَّكُمْ إِنْ
  rationale: تُبقي «لأن» القوة التفسيرية لـγάρ وصلتها بالصلاة السابقة، وتنقل «إن» الشرط الذي تدل عليه ἐάν مع صيغة الاحتمال.
- source_word: ἀφῆτε … ἀφήσει
  choice: غَفَرْتُمْ … يَغْفِرْ
  rationale: «غفر» هو المقابل العربي الطبيعي في سياق الإساءة الأخلاقية، وتكرار الجذر نفسه يحفظ الترابط اللفظي في اليونانية.
- source_word: τοῖς ἀνθρώποις
  choice: لِلنَّاسِ
  rationale: يدل اللفظ هنا على البشر عمومًا، لا على الذكور وحدهم، و«الناس» تعبير عربي واضح وطبيعي.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: زَلَّاتِهِمْ
  rationale: «الزلات» تنقل معنى الخطوات الخاطئة والإساءات الأخلاقية الذي يحمله παράπτωμα، مع إبقاء البدائل الممكنة في الحاشية.
- source_word: καὶ ὑμῖν
  choice: لَكُمْ أَيْضًا
  rationale: تعبّر «أيضًا» عن المقابلة التي تنشئها καί بين غفران الناس وغفران الآب.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: أَبُوكُمُ السَّمَاوِيُّ
  rationale: صياغة عربية مباشرة تحافظ على البنية الوصفية «أبوكم، السماوي»، من غير تحويلها إلى تركيب مكاني.
theological_decisions:
- issue: العلاقة الشرطية بين غفران الإنسان وغفران الله
  choice: 'إبقاء العبارة شرطًا حقيقيًا مباشرًا: «إن غفرتم... يغفر لكم أيضًا».'
  alternative: تفسيرها سببيًا على أن الغفران البشري يستحق الغفران الإلهي، أو تفسيريًا صرفًا على أنه مجرد دليل على غفران سابق.
  rationale: النص اليوناني يقرر علاقة شرطية واضحة من غير أن يشرح طبيعتها العقائدية؛ لذلك تُحفظ حدة العبارة وتوترها اللاهوتي بلا حسم مذهبي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الزلات» لقربها من الصورة المعجمية للكلمة اليونانية، مع بيان البدائل في الحاشية. وُضع كل رمز حاشية بعد العبارة التي يشرحها.
