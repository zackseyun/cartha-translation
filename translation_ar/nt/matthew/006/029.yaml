id: MAT.6.29
reference: Matthew 6:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: ar
  text: 'لكنّي أقول لكم: حتى سليمان في كل مجده لم يلبس مثل واحدة من هذه.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في كل بهائه».'
    reason: بديل معجمي يوضح أن «المجد» هنا يعني البهاء والعظمة الملكيين.
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: لكنّي أقول لكم
  rationale: تفيد δέ هنا مقابلة خفيفة بما سبق، و«أقول لكم» تنقل الفعل مع المفعول غير المباشر بوضوح وطبيعية.
- source_word: οὐδὲ
  choice: حتى ... لم
  rationale: هذا التركيب العربي الطبيعي ينقل النفي المؤكد بمعنى «ولا حتى».
- source_word: Σολομὼν
  choice: سليمان
  rationale: استُخدم الاسم العربي الكتابي المستقر.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: في كل مجده
  rationale: يحفظ «مجده» الصدى الكتابي، والمقصود في السياق بهاء سليمان الملكي وعظمته الظاهرة.
- source_word: περιεβάλετο
  choice: يلبس
  rationale: ينقل فعل الاكتساء في صياغة عربية واضحة، من غير إثقال العبارة ببناء مجهول غير لازم.
- source_word: ὡς ἓν τούτων
  choice: مثل واحدة من هذه
  rationale: يحفظ المقارنة والعدد المفرد، مع تأنيث «واحدة» بحسب المرجع السياقي، أي الزهور أو الزنابق.
theological_decisions:
- issue: دلالة δόξα في وصف سليمان
  choice: مجده
  alternative: بهائه
  rationale: اختيرت «مجده» لأنها سليمة معجميًا وتحفظ الرنين الكتابي، من غير أن تجعل المجد هنا إلهيًا؛ فالسياق يتحدث عن العظمة والبهاء الملكيين.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «لكنّي» للمقابلة الخفيفة، وحُفظت صيغة المفرد في «واحدة من هذه». جاءت علامة الحاشية في المتن بعد الجملة.
