  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: ar
  text: 'ولماذا تقلقون بشأن اللباس؟ تأمّلوا زنابق الحقل[a] كيف تنمو: لا تتعب ولا تغزل.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أزهار الحقل البرية». قد يُفهم اللفظ اليوناني هنا بمعنى أوسع من الزنابق تحديدًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: بشأن اللباس
  rationale: الاسم المفرد هنا يدل على اللباس بوصفه فئة عامة من الاحتياجات، لا على ثوب بعينه.
- source_word: τί μεριμνᾶτε
  choice: لماذا تقلقون
  rationale: يحمل الفعل في السياق معنى القلق بشأن الاحتياجات المادية، وصيغة «لماذا» تنقل قوة الاستفهام اليوناني بصورة عربية طبيعية.
- source_word: καταμάθετε
  choice: تأمّلوا
  rationale: يدعو فعل الأمر إلى الملاحظة المتأنية المؤدية إلى الفهم؛ و«تأمّلوا» موجزة وطبيعية وتحفظ هذه الدلالة.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: زنابق الحقل
  rationale: المعنى المعجمي المباشر لـ κρίνα هو الزنابق، مع إمكان فهم اللفظ على نحو أوسع؛ لذلك حُفظ البديل في الحاشية.
- source_word: πῶς αὐξάνουσιν
  choice: كيف تنمو
  rationale: يشير الفعل هنا إلى النمو الطبيعي للنبات، و«تنمو» أوضح مقابل عربي.
- source_word: οὐ κοπιῶσιν
  choice: لا تتعب
  rationale: يدل الفعل على بذل الجهد والتعب في العمل. اختير «تتعب» لأنها طبيعية في العربية وتحفظ المقابلة بين جهد الإنسان ونمو الزنابق.
- source_word: οὐδὲ νήθουσιν
  choice: ولا تغزل
  rationale: الفعل يعني غزل الخيط أو الصوف، ويكفي «تغزل» في السياق مع الحفاظ على إيجاز الأصل وتوازيه.
theological_decisions:
- issue: دلالة μεριμνάω في تعليم يسوع عن عناية الله
  choice: تقلقون
  alternative: تهتمّون / تنشغلون
  rationale: المقصود قلق النفس بشأن توفير اللباس، لا مجرد الاهتمام أو الانتباه؛ لذا تنقل «تقلقون» المعنى السياقي دون إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم خطاب الجمع كما في الأصل، وحُفظ الإيجاز والتوازي في العبارة الختامية.
