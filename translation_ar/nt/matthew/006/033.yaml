  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: ar
  text: لكن اطلبوا أولًا ملكوته وبِرَّهُ[a]، وهذه كلها ستُزاد لكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عدله». يمكن للكلمة اليونانية أن تدل على البِرّ أو العدل؛ وقد اختير «البِرّ» هنا لأنه يشمل الاستقامة أمام الله والسلوك الموافق لإرادته، ولا يقتصر على العدالة القضائية أو الاجتماعية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: اطلبوا
  rationale: صيغة الأمر في المضارع تدعو إلى سعي متواصل؛ و«اطلبوا» عربية طبيعية تحفظ معنى التوجه النشط نحو الغاية دون إطالة تفسيرية.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة هنا انتقالًا تقابليًا من النهي السابق عن القلق والسعي وراء الاحتياجات المادية إلى الأولوية المطلوبة.
- source_word: πρῶτον
  choice: أولًا
  rationale: تحفظ المعنى المباشر للأولوية من غير تحويله إلى شرح مثل «قبل كل شيء».
- source_word: βασιλείαν
  choice: ملكوته
  rationale: «الملكوت» مصطلح عربي راسخ في سياق متى، ويتسع لمعنى مُلك الله وسلطانه ونظام حكمه، كما أن اللاحقة تحافظ على الضمير اليوناني.
- source_word: δικαιοσύνην
  choice: بِرَّهُ
  rationale: «البِرّ» يحفظ اتساع اللفظ اليوناني ليشمل الاستقامة أمام الله والسلوك الموافق لإرادته، من غير قصره على العدالة القضائية أو الاجتماعية وحدها.
- source_word: ταῦτα πάντα
  choice: هذه كلها
  rationale: تعود العبارة على الاحتياجات المادية المذكورة في السياق القريب، وتحفظ اسم الإشارة ومعنى الشمول بإيجاز طبيعي.
- source_word: προστεθήσεται
  choice: ستُزاد
  rationale: تحفظ صيغة المستقبل المبني للمجهول وفكرة الإضافة إلى الغاية الأساسية، دون استبدالها بتفسير أصرح مثل «ستُوفَّر».
- source_word: ὑμῖν
  choice: لكم
  rationale: تمثل دلالة المفعول غير المباشر تمثيلًا عربيًا مباشرًا وطبيعيًا مع الفعل المبني للمجهول.
theological_decisions:
- issue: دلالة δικαιοσύνη
  choice: بِرَّهُ
  alternative: عدله
  rationale: يفيد اللفظ في هذا السياق الاستقامة الموافقة لإرادة الله والعلاقة الصحيحة به والسلوك الناتج عنها؛ أما «عدله» فقد يضيّق المعنى إلى الجانب القضائي أو الاجتماعي. أُثبت البديل في الحاشية حفظًا للاتساع الدلالي.
- issue: مرجع αὐτοῦ
  choice: الضمير في «ملكوته وبِرَّهُ»
  alternative: ملكوت الله وبرّ الله
  rationale: يحافظ الضمير على صياغة الأصل، ومرجعه إلى الله أو الآب واضح من السياق، فلا حاجة إلى التصريح به في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. ضُبطت الباء في «بِرَّهُ» لتجنب التباسها بكلمة «بَرّه» في القراءة غير المشكولة، وحُفظ الإيجاز والتوازي في الأصل.
