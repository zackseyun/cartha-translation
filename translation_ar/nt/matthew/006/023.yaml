id: MAT.6.23
reference: Matthew 6:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: ar
  text: ولكن إن كانت عينك رديئة[a]، فجسدك كله سيكون مظلمًا. فإن كان النور الذي فيك ظلامًا، فما أشد ذلك الظلام!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شريرة» أو «مريضة»، وربما «شحيحة»، بالنظر إلى الاستعمال الاصطلاحي للعين وإلى السياق المحيط.
    reason: بدائل معجمية تحفظ تعدد دلالات πονηρός واحتمالات الاستعارة.
lexical_decisions:
- source_word: πονηρὸς
  choice: رديئة
  rationale: لفظ «رديئة» يحافظ على اتساع الدلالة بين السوء الأخلاقي، واعتلال النظر، والمعنى الاصطلاحي المحتمل للعين الشحيحة، من غير حصر الاستعارة في تفسير واحد.
- source_word: σκοτεινὸν
  choice: مظلمًا
  rationale: ترجمة مباشرة وطبيعية للصفة، وتحافظ على صورة الظلمة من غير إضافة تفسيرية.
- source_word: φῶς
  choice: النور
  rationale: يحافظ على اللفظ المجازي المباشر وعلى مقابلته للظلام، من غير تحويله إلى تفسير مثل البصيرة الداخلية.
- source_word: σκότος
  choice: ظلامًا / الظلام
  rationale: يحفظ التقابل والتكرار البلاغي مع النور، مع مراعاة التركيب العربي في الموضعين.
- source_word: πόσον
  choice: ما أشد
  rationale: ينقل قوة العبارة التعجبية الناقصة في اليونانية ويدل على عظم درجة الظلام بلغة عربية طبيعية.
- source_word: ὀφθαλμός
  choice: عينك
  rationale: الإبقاء على العين حرفيًا ضروري لصورة الجسد ولما تحتمله الاستعارة من الإدراك والتوجه الأخلاقي والسخاء أو الشح.
- source_word: ὅλον τὸ σῶμά σου
  choice: جسدك كله
  rationale: صياغة عربية واضحة تحافظ على التأكيد الشامل في ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: النور الذي فيك
  rationale: قريب من بنية الأصل وواضح بالعربية، ولا يضيف مفهوم «النور الداخلي» بوصفه تفسيرًا محددًا.
theological_decisions:
- issue: دلالة استعارة «العين الرديئة»
  choice: الإبقاء على الاستعارة الواسعة بلفظ «رديئة» في المتن.
  alternative: «شريرة» للتشديد على الفساد الأخلاقي، أو «مريضة» للتشديد على خلل البصر، أو «شحيحة» بحسب الاستعمال الاصطلاحي في سياق المال والعطاء.
  rationale: يسمح سياق متى 6:19–24 بتداخل دلالات الفساد الأخلاقي واختلال الإدراك وربما الشح. لذلك لا يحسم المتن التوتر التفسيري، وتُذكر الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «ولكن» لإظهار المقابلة، وحُفظت استعارتا النور والظلام وتكرارهما. أُثبتت علامة الحاشية [a] في المتن.
