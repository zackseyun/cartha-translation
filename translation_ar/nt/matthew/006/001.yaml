id: MAT.6.1
reference: Matthew 6:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: ar
  text: ولكن احذروا أن تُظهروا بِرَّكم أمام الناس لكي يراكم الناس[a]؛ وإلا فلا أجر لكم عند أبيكم الذي في السماوات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعمال بِرِّكم». وتقرأ مخطوطات أخرى: «صدقتكم».'
    reason: textual_variant
  - marker: b
    text: 'اليونانية بصيغة الجمع: «السماوات»؛ وتترجم أحيانًا بصيغة المفرد: «السماء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: احذروا
  rationale: فعل أمر مضارع للجمع يدعو إلى اليقظة المستمرة، و«احذروا» يحفظ قوة التحذير بعبارة عربية واضحة.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد الانتقال مع نبرة مقابلة وتحذير بالنسبة إلى السياق السابق.
- source_word: δικαιοσύνην
  choice: بِرَّكم
  rationale: يحفظ المعنى الواسع للنص المعتمد، فلا يقصره على الصدقة وحدها، مع بيان الاحتمالات في الحاشية.
- source_word: μὴ ποιεῖν
  choice: أن تمارسوا
  rationale: تؤدي معنى اجتناب ممارسة السلوك الديني، وهي أنسب سياقيًا من «تفعلوا» المجردة.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: أمام الناس
  rationale: تعبير طبيعي يشمل البشر عمومًا ولا يخص الذكور.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: لكي يروكم
  rationale: يحفظ دلالة الغرض في التركيب اليوناني، ويعبّر طبيعيًا عن قصد الظهور أمام الآخرين.
- source_word: εἰ δὲ μή γε
  choice: وإلا
  rationale: مقابل عربي موجز وطبيعي للشرط التحذيري ونتيجته.
- source_word: μισθὸν
  choice: أجر
  rationale: لفظ عربي مألوف للمكافأة أو الجزاء المستحق، ويلائم سياق الجزاء الإلهي دون حصره في الأجرة المادية.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: عند أبيكم
  rationale: يحفظ بصورة مباشرة معنى القرب أو الحضور الذي يمكن أن تدل عليه παρά مع المجرور، من غير أن يلغي احتمال المصدر.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: الذي في السماوات
  rationale: يحفظ صيغة الجمع اليونانية والأسلوب المتّى دون إضافة تفسير عقائدي.
theological_decisions:
- issue: نطاق δικαιοσύνην في الآية
  choice: البِرّ بمعناه الواسع، أي ممارسة السلوك البار، من غير قصره في المتن على الصدقة
  alternative: أعمال البر؛ الصدقة
  rationale: قراءة SBLGNT هي δικαιοσύνην، وهي أوسع دلالة من الصدقة. أما القراءة النصية الأخرى وسياق الصدقة التالي فيُذكران في الحاشية للمحافظة على التوتر التفسيري.
- issue: دلالة παρά في παρὰ τῷ πατρὶ ὑμῶν
  choice: عند أبيكم
  alternative: من أبيكم
  rationale: «عند» تحافظ على صورة الحضور أو المكان القريب التي يتيحها التركيب، بينما «من» تبرز مصدر الأجر؛ ولم يُحسم الاحتمال بعبارة تفسيرية زائدة.
- issue: صيغة τοῖς οὐρανοῖς
  choice: السماوات بصيغة الجمع
  alternative: السماء بصيغة المفرد
  rationale: الجمع هو الصيغة الصريحة في اليونانية، ويحفظ الأسلوب المتّى من غير استنتاجات كونية إضافية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «بِرّ» للمصطلح الأخلاقي الديني الواسع، و«تمارسوا» لإظهار أن الكلام عن سلوك مقصود، مع إبقاء صيغة «السماوات» كما في الأصل.
