language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: ar
  text: وأمّا أنت، فعندما تصلّي، فادخل حجرتك الداخلية[a]، وبعد أن تغلق بابك، صلِّ إلى أبيك الذي في الخفاء؛ وأبوك الذي يرى في الخفاء سيكافئك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حجرتك الخاصة» أو «مخدعك» أو «غرفة للتخزين». تشير الكلمة اليونانية إلى حجرة داخلية تُستعمل للخلوة أو التخزين.
    reason: lexical_alternative
  - marker: b
    text: أو «سيجازيك» أو «يردّ إليك». قد يعني الفعل اليوناني أن يردّ أو يجازي أو يكافئ بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: وأمّا أنت
  rationale: يحفظ إبراز الضمير والتباين مع المرائين المذكورين في السياق السابق.
- source_word: ὅταν προσεύχῃ
  choice: فمتى صلّيت
  rationale: ينقل الدلالة الزمنية العامة مع الفعل في صيغة الاحتمال، أي كلما وقع فعل الصلاة، بصياغة عربية طبيعية.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: فادخل حجرتك الداخلية
  rationale: ταμεῖον يدل على حجرة داخلية منعزلة قد تُستعمل للخلوة أو التخزين؛ وهذه الصياغة تحفظ فكرة الداخل والخصوصية من غير حصرها في استعمال واحد.
- source_word: κλείσας τὴν θύραν σου
  choice: وأغلق بابك
  rationale: يؤدي معنى الفعل السابق للصلاة في تسلسل عربي واضح، من غير تكلّف في ترجمة اسم الفاعل اليوناني حرفيًا.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: وصلِّ إلى أبيك
  rationale: يحفظ الأمر المباشر والعلاقة التي يعبّر عنها النص، من غير إضافة وصف مثل «السماوي» غير موجود هنا.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: الذي في الخفاء
  rationale: يبقي العبارة محتملة للدلالة على الحضور المستور أو المجال الخفي، ويحفظ صلتها بالتكرار اللاحق.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: الذي يرى في الخفاء
  rationale: يحافظ على إيجاز الأصل وعلى تكرار «في الخفاء» بدل تفسيرها تفسيرًا موسعًا مثل «يرى ما يُفعل سرًا».
- source_word: ἀποδώσει σοι
  choice: سيكافئك
  rationale: يلائم السياق الإيجابي لفعل ἀποδίδωμι، مع التنبيه في الحاشية إلى إمكان معنى الجزاء أو الوفاء بما يقابل الفعل.
theological_decisions:
- issue: دلالة التكرار ἐν τῷ κρυπτῷ
  choice: في الخفاء في الموضعين
  alternative: في المكان الخفي؛ أو سرًّا؛ أو يرى ما يحدث في الخفاء
  rationale: يحفظ التكرار البلاغي والتوتر بين الدلالة المكانية والدلالة الحالية، من غير حسم العبارة في تفسير واحد.
- issue: دلالة πατήρ على الله
  choice: أبيك
  alternative: أبيك السماوي
  rationale: ينقل تسمية يسوع لله كما وردت في الآية، من غير إضافة «السماوي» من السياق الأوسع.
- issue: طبيعة ما يمنحه الآب
  choice: سيكافئك
  alternative: سيجازيك؛ أو سيوفيك
  rationale: السياق يرجح معنى المكافأة، لكن النص لا يحدد ماهيتها، ولذلك لم تُضف أي تفاصيل عقائدية أو مادية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «وأمّا أنت» لإظهار المقابلة، و«الحجرة الداخلية» لتجنب الإيحاء الحديث الضيق لكلمة «خزانة»، مع إبقاء «في الخفاء» مكررة كما في اليونانية.
