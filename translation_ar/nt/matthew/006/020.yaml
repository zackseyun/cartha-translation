  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: ar
  text: بل ادَّخروا لأنفسكم كنوزًا في السماء، حيث لا يُتلفها عُثٌّ ولا تآكلٌ[a]، وحيث لا ينقُب اللصوص الجدران[b] ولا يسرقون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صدأ». يمكن أن تدل الكلمة اليونانية بصورة أوسع على ما يستهلك الأشياء أو يُبليها.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «ينقبون». يدل الفعل على الحفر عبر الجدران، في إشارة على الأرجح إلى نقب جدران البيوت للدخول إليها.'
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: ادَّخروا
  rationale: فعل أمر يدل في السياق على الاستمرار في جمع الكنوز وحفظها، و«ادَّخروا» تعبير عربي طبيعي يحافظ على صورة التكديس للمستقبل.
- source_word: δὲ
  choice: بل
  rationale: تفيد المقابلة مع النهي الوارد في الآية السابقة، و«بل» تنقل الانتقال من «لا تدخروا» إلى الأمر المقابل بوضوح.
- source_word: ὑμῖν
  choice: لأنفسكم
  rationale: يحفظ معنى دالّ المنفعة والاهتمام الشخصي في التركيب اليوناني.
- source_word: θησαυροὺς
  choice: كنوزًا
  rationale: يحافظ على صيغة الجمع وعلى استعارة الكنز المتكررة في السياق.
- source_word: ἐν οὐρανῷ
  choice: في السماء
  rationale: ترجمة مكانية طبيعية للمفرد اليوناني، من غير توسع تفسيري.
- source_word: σὴς
  choice: عُثٌّ
  rationale: يدل على العث الذي يفسد الثياب وسائر المتاع المخزون.
- source_word: βρῶσις
  choice: تآكلٌ
  rationale: اللفظة تدل على الأكل أو ما يستهلك الشيء؛ و«تآكل» أوسع من «صدأ» ويلائم صور تلف الممتلكات المختلفة.
- source_word: ἀφανίζει
  choice: يُتلفها
  rationale: ينقل معنى الإهلاك أو الإزالة، مع ضمير يوضح في العربية أن الكنوز هي المتضررة.
- source_word: κλέπται
  choice: اللصوص
  rationale: المقابل العربي المباشر للاسم اليوناني الجمع.
- source_word: διορύσσουσιν
  choice: ينقُب ... الجدران
  rationale: يحفظ الصورة الحرفية للفعل، أي الحفر أو النقب عبر جدار البيت، مع إظهار المفعول المفهوم ثقافيًا لتكون العبارة عربية واضحة.
- source_word: κλέπτουσιν
  choice: يسرقون
  rationale: ترجمة مباشرة وطبيعية للفعل.
theological_decisions:
- issue: طبيعة «الكنوز في السماء»
  choice: الإبقاء على استعارة «كنوزًا في السماء» بلا شرح داخل النص
  alternative: مكافآت سماوية؛ غنى روحي
  rationale: النص لا يحدد ماهية هذه الكنوز هنا، وتفسيرها داخل الترجمة قد يفرض تصورًا لاهوتيًا لا تصرح به الآية.
- issue: مدى معنى βρῶσις
  choice: تآكل
  alternative: صدأ؛ فساد؛ ما يأكل
  rationale: «تآكل» يحفظ المعنى الاستهلاكي الواسع ولا يقصره على أكسدة المعادن، مع إبقاء المقابلة بين ما يتلف على الأرض وما يُدخر في السماء.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «بل» لإبراز المقابلة مع الآية السابقة، وحُفظت استعارة الكنوز من غير تفسير مذهبي. جاءت العلامتان [a] و[b] في موضعيهما في المتن.
