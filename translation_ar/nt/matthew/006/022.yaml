base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: ar
  text: العين هي سراج الجسد. لذلك، إن كانت عينك سليمة[a]، كان جسدك كله منيرًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بسيطة»، أو «صافية»، أو «صحيحة». ويمكن للكلمة اليونانية أن تفيد أيضًا معنى غير المنقسمة، وفي بعض السياقات معنى السخاء.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: سراج
  rationale: يدل اللفظ اليوناني عادةً على أداة الإضاءة، لا على الضوء المجرّد؛ و«سراج» يحفظ الصورة الحسية الطبيعية في العربية.
- source_word: σῶμα
  choice: الجسد
  rationale: المقابل العربي المباشر الملائم للصورة الجسدية في الآية.
- source_word: ὀφθαλμός
  choice: العين
  rationale: ترجمة حرفية تحفظ المعنى الجسدي والاستعمال المجازي معًا.
- source_word: ἐὰν οὖν
  choice: لذلك، إن كانت
  rationale: «لذلك» تحفظ دلالة الاستنتاج في οὖν، و«إن» تؤدي الشرط بصياغة عربية طبيعية.
- source_word: ἁπλοῦς
  choice: سليمة
  rationale: في سياق العين التي تنير الجسد، تفيد «سليمة» حسن أداء العين لوظيفتها، مع إبقاء الاتساع الدلالي للكلمة في الحاشية.
- source_word: ὅλον
  choice: كله
  rationale: يحفظ معنى الشمول بصياغة عربية مألوفة.
- source_word: φωτεινὸν
  choice: منيرًا
  rationale: ينقل صفة الإضاءة مباشرةً ويحافظ على الترابط مع صورة السراج دون إطالة تفسيرية.
- source_word: ἔσται
  choice: كان
  rationale: جواب الشرط العربي بـ«إن» يأتي طبيعيًا بالماضي مع دلالة الاستقبال الشرطي التي يحملها المستقبل اليوناني في هذا التركيب.
theological_decisions:
- issue: دلالة ἁπλοῦς في مجاز العين
  choice: سليمة في المتن
  alternative: بسيطة، أو صافية، أو صحيحة؛ وقد تدل أيضًا على كونها غير منقسمة، وفي بعض السياقات على السخاء
  rationale: تقابل الآية بين عين تؤدي وظيفة الإنارة وعين رديئة في العدد التالي، ولذلك تلائم «سليمة» الصورة المباشرة. لكن اللفظ اليوناني أوسع دلالة، فلا يُحسم البعد الأخلاقي أو معنى وحدة القصد في المتن، بل يُحفظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «سراج» للمجاز الملموس، و«منيرًا» لتجنب العبارة التفسيرية المطوّلة، مع إثبات علامة الحاشية في المتن.
