  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: ar
  text: 'فلا تقلقوا إذًا قائلين: «ماذا نأكل؟» أو: «ماذا نشرب؟» أو: «ماذا نلبس؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: فلا تقلقوا إذًا
  rationale: ينقل «تقلقوا» معنى الانشغال القَلِق بشأن الاحتياجات المادية في هذا السياق، من غير أن يجعل القول نهيًا عن التدبير المسؤول. وتؤدي «إذًا» وظيفة οὖν الاستنتاجية، بينما تربط الفاء النتيجة بما سبق ربطًا عربيًا طبيعيًا.
- source_word: λέγοντες
  choice: قائلين
  rationale: ترجمة مباشرة لاسم الفاعل، وتبيّن الأقوال التي يصاحب بها القلق نفسه من غير زيادة تفسيرية.
- source_word: Τί
  choice: ماذا
  rationale: أداة الاستفهام العربية الطبيعية في الأسئلة المباشرة عن الطعام والشراب واللباس.
- source_word: φάγωμεν
  choice: نأكل
  rationale: المضارع العربي في الاستفهام التداولي «ماذا نأكل؟» ينقل سؤال الحيرة بشأن التدبير الآتي طبيعيًا، من غير حاجة إلى إضافة علامة مستقبل لا يصرّح بها اليوناني.
- source_word: πίωμεν
  choice: نشرب
  rationale: يحافظ على التوازي مع «نأكل» وينقل سؤال الحيرة بشأن الحاجة إلى الشراب بصياغة عربية مألوفة.
- source_word: περιβαλώμεθα
  choice: نلبس
  rationale: الفعل هنا متعلق باللباس؛ و«ماذا نلبس؟» أفصح وأطبع في العربية المعاصرة من الترجمة الحرفية «بماذا نكسو أنفسنا؟».
- source_word: ἤ ... ἤ ... ἤ
  choice: أو ... أو ... أو
  rationale: يحفظ تكرار أداة العطف والفصل في الأسئلة الثلاثة كما في النص اليوناني.
theological_decisions:
- issue: طبيعة نهي يسوع بشأن الاحتياجات المادية
  choice: فهم μεριμνήσητε بوصفه نهيًا عن القلق، لا عن التخطيط المسؤول
  alternative: لا تهتموا مطلقًا بأي شأن من شؤون الاحتياجات المادية
  rationale: السياق القريب يعالج القلق على القوت والكسوة. لذلك تحافظ «لا تقلقوا» على قوة النهي من غير توسيعه إلى منع التدبير أو العناية المسؤولة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم ترتيب «فلا تقلقوا إذًا» لربط النهي استنتاجيًا بما قبله، وحُفظ إيقاع الأسئلة الثلاثة المتوازية. لا توجد حاشية لأن البديل الإنجليزي «لا تكونوا قلقين» يندرج طبيعيًا في معنى «لا تقلقوا» ولا يمثل غموضًا نصيًا يحتاج إلى توثيق.
