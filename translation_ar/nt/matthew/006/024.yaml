  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: ar
  text: لا يقدر أحد أن يخدم سيدين؛ لأنه إما أن يبغض الواحد ويحب الآخر، وإما أن يتمسك بأحدهما ويحتقر الآخر. لا تقدرون أن تخدموا الله ومامون[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المال» أو «الثروة». يستعمل النص اليوناني اللفظة الدخيلة «مامون»، التي يمكن أن تُشخِّص الغنى بوصفه سيدًا منافسًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: لا يقدر أحد
  rationale: صياغة عربية طبيعية تؤدي النفي الشامل مع فعل القدرة الوارد في اليونانية.
- source_word: δύναται / δύνασθε
  choice: يقدر / تقدرون
  rationale: يحافظ على تكرار معنى القدرة والاستطاعة، وعلى الانتقال من المفرد العام إلى خطاب الجمع.
- source_word: δυσὶ κυρίοις
  choice: سيدين
  rationale: السياق هو خدمة مملوك لسيد؛ لذلك «سيدين» أوضح من «ربين» ولا توهم أن اللفظة لقب إلهي هنا.
- source_word: δουλεύειν
  choice: يخدم / تخدموا
  rationale: تعبير عربي واضح وطبيعي في تركيب «يخدم سيدين»، مع بقاء علاقة السيادة والخضوع ظاهرة من لفظ «سيدين».
- source_word: μισήσει / ἀγαπήσει
  choice: يبغض / يحب
  rationale: ينقل التضاد القوي في الأصل من غير تلطيف «يبغض» إلى مجرد تفضيل نسبي.
- source_word: ἑνὸς ἀνθέξεται
  choice: يتمسك بأحدهما
  rationale: يعبر عن التشبث والالتزام بأحد السيدين، ويحافظ على الصورة العلاقية في الفعل اليوناني.
- source_word: καταφρονήσει
  choice: يحتقر
  rationale: ينقل معنى الازدراء والنظر إلى الآخر باستخفاف بقوة مناسبة.
- source_word: θεῷ
  choice: الله
  rationale: المقابل العربي المباشر في هذا السياق.
- source_word: μαμωνᾷ
  choice: مامون
  rationale: الإبقاء على اللفظة الدخيلة يحفظ المقابلة البلاغية التي تعرض الغنى كأنه سيد منافس، مع شرح معناها في الحاشية.
theological_decisions:
- issue: معنى κύριος في سياق اجتماعي غير إلهي
  choice: سيدين
  alternative: ربين
  rationale: صيغة الجمع وصورة الخدمة تدلان على سادة يطالب كل منهم بولاء خادمه، فلا ينبغي الخلط بينها وبين اللقب الإلهي.
- issue: نقل μαμωνᾶς
  choice: مامون
  alternative: المال أو الثروة
  rationale: يحفظ النقل الصوتي احتمال تشخيص المال بوصفه سيدًا منافسًا لله، بينما تُذكر الدلالة المعجمية الواضحة في الحاشية.
- issue: قوة μισήσει في التضاد
  choice: يبغض
  alternative: يحب أقل
  rationale: الأصل يقابل البغض بالمحبة والتمسك بالاحتقار؛ لذا يُحفظ اللفظ القوي بدل تفسيره على أنه مجرد تفضيل نسبي.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كريمة. استُعملت ألفاظ مألوفة مثل «يخدم» و«يتمسك»، مع الحفاظ على التضاد الحاد والبنية المتوازية في القول.
