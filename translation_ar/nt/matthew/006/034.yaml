  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: ar
  text: فلا تقلقوا إذن بشأن الغد، لأن الغد سيقلق بشأن نفسه. يكفي كلَّ يومٍ عناؤه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يكفي كلَّ يومٍ شرُّه». يمكن للكلمة اليونانية أن تعني «الشرّ»، لكنها تشير هنا على الأرجح إلى عناء اليوم أو مشقته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: تقلقوا
  rationale: الفعل في سياق متى 6:25–34 يدل على القلق والانشغال المضطرب، و«تقلقوا» تعبير عربي واضح وطبيعي.
- source_word: εἰς τὴν αὔριον
  choice: بشأن الغد
  rationale: ينقل اتجاه القلق نحو اليوم الآتي بصياغة عربية فصيحة وطبيعية.
- source_word: ἡ αὔριον
  choice: الغد
  rationale: يحفظ تشخيص الغد بوصفه فاعلًا في العبارة التالية.
- source_word: μεριμνήσει αὑτῆς
  choice: سيقلق بشأن نفسه
  rationale: يحافظ على تكرار الفعل وعلى التشخيص البلاغي، ويمثل الضمير الانعكاسي صراحة.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: يكفي كلَّ يومٍ
  rationale: ينقل معنى الكفاية والدلالة التوزيعية لليوم بأسلوب عربي مألوف.
- source_word: ἡ κακία αὐτῆς
  choice: ما فيه من عناء
  rationale: يفيد في هذا السياق ما يحمله اليوم من مشقة ومتاعب، مع إظهار عود الضمير إلى اليوم دون إقحام معنى أخلاقي أضيق.
theological_decisions:
- issue: دلالة κακία في خاتمة القول عن القلق
  choice: عناء
  alternative: شرّ
  rationale: السياق يتناول أعباء كل يوم وما يثير القلق، ولذلك تنقل «عناء» المعنى السياقي المرجح، مع إثبات المعنى الحرفي البديل في الحاشية حفاظًا على الاحتمال المعجمي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «فلا... إذن» لإظهار نتيجة οὖν، وحُفظ تشخيص الغد وتكرار فعل القلق. وُضع مؤشر الحاشية بعد الجملة التي تتضمن اللفظة المختلف في دلالتها.
