  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: ar
  text: ولا تُدخلنا في تجربة[a]، بل نجِّنا من الشرير[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «اختبار» أو «محنة». يمكن للكلمة اليونانية أن تشير إلى الإغراء بالخطية أو إلى اختبار شاق.
    reason: lexical_alternative
  - marker: b
    text: أو «من الشر». يمكن فهم العبارة اليونانية فهمًا شخصيًا («الشرير») أو غير شخصي («الشر»).
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: لا تُدخلنا
  rationale: ينقل الفعل اليوناني بمعناه المباشر «تُدخل/تأتي بنا إلى»، ويحافظ على صيغة الالتماس الصريحة من غير إضافة تفسيرية مثل «لا تسمح».
- source_word: πειρασμόν
  choice: تجربة
  rationale: «تجربة» عربية طبيعية تشمل في الاستعمال إمكان الإغراء بالخطية وإمكان الاختبار أو المحنة؛ وتوضح الحاشية هذا الاتساع الدلالي.
- source_word: ῥῦσαι
  choice: نجِّنا
  rationale: يفيد طلب الإنقاذ الفعّال، وهو تعبير عربي واضح وراسخ يلائم أسلوب الصلاة.
- source_word: τοῦ πονηροῦ
  choice: الشرير
  rationale: الصيغة اليونانية المعرفة تحتمل المذكر الشخصي «الشرير» والمحايد «الشر». اختير المعنى الشخصي في المتن، مع إبقاء المعنى غير الشخصي في الحاشية حفظًا للغموض الحقيقي.
theological_decisions:
- issue: مرجع τοῦ πονηροῦ
  choice: الشرير
  alternative: الشر
  rationale: تحتمل العبارة اليونانية شخصًا شريرًا، أي «الشرير»، كما تحتمل الشر بمعناه غير الشخصي. ينسجم المعنى الشخصي مع سياق التجربة، لكن الاحتمال الآخر أصيل ولذلك يثبت في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع صياغة موجزة تلائم إيقاع الصلاة. وُضعت علامتا الحاشيتين بعد اللفظ الذي تشرحانه مباشرة.
