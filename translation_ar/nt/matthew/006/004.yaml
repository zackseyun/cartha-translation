id: MAT.6.4
reference: Matthew 6:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: ar
  text: لكي يكون عطاؤك للفقراء[a] في الخفاء؛ وأبوك الذي يرى في الخفاء سيكافئك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صدقتك». يدل اللفظ اليوناني تحديدًا على العطاء للفقراء.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سيجازيك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: لكي
  rationale: تفيد الغاية وتربط الآية بالتوجيه السابق ربطًا طبيعيًا واضحًا.
- source_word: ᾖ
  choice: يكون
  rationale: ينقل صيغة المضارع الالتزامي بعد أداة الغاية بصياغة عربية سليمة.
- source_word: ἐλεημοσύνη
  choice: عطاؤك للفقراء
  rationale: يدل اللفظ هنا تحديدًا على تقديم العون المادي للمحتاجين، لا على الرحمة بوجه عام؛ وهذه العبارة أوضح للقارئ المعاصر من اللفظ التقليدي وحده.
- source_word: ἐν τῷ κρυπτῷ
  choice: في الخفاء
  rationale: تعبير عربي طبيعي يدل على البعد عن أنظار الناس، ويحافظ على تكرار العبارة في الجملتين.
- source_word: ὁ πατήρ σου
  choice: أبوك
  rationale: ينقل النص كما هو من غير إضافة «السماوي» غير الواردة صراحة في هذه الآية.
- source_word: ὁ βλέπων
  choice: الذي يرى
  rationale: يترجم اسم الفاعل المعرّف بجملة موصولة عربية واضحة، من غير إضافة معنى المراقبة المستمرة.
- source_word: ἀποδώσει
  choice: سيكافئك
  rationale: يلائم السياق الإيجابي لوعد الله، مع عدم تحديد نوع المكافأة أو زمانها؛ ويُذكر البديل الأقرب إلى معنى المجازاة في الحاشية.
- source_word: σοι
  choice: ـك
  rationale: أُدمج ضمير المخاطب في الفعل «سيكافئك»، وهي الصياغة العربية الطبيعية للمفعول المقصود.
theological_decisions:
- issue: طبيعة الجزاء الإلهي في ἀποδώσει
  choice: سيكافئك
  alternative: سيجازيك
  rationale: تدل الصياغة على استجابة الله الإيجابية للعطاء الخفي، من غير أن تحسم هل المكافأة زمنية أم أبدية، مادية أم روحية. ويحفظ البديل معنى المقابلة والجزاء الأوسع.
translation_notes:
  register: العربية فصحى معاصرة واضحة وموقرة. حوفظ على تكرار «في الخفاء» وعلى بساطة «أبوك» من غير إدخال وصف غير موجود في النص اليوناني.
