id: MAT.6.5
reference: Matthew 6:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: ar
  text: 'ومتى صلّيتم، فلا تكونوا كالمرائين؛ لأنهم يحبّون أن يقفوا ويصلّوا في المجامع وعند زوايا الشوارع الواسعة[a]، لكي يراهم الناس[b]. الحق أقول لكم: إنهم قد استوفوا أجرهم[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند نواصي الطرق». واليونانية حرفيًا: «عند زوايا الشوارع الواسعة».'
    reason: lexical_alternative
  - marker: b
    text: المقصود باللفظ اليوناني الناس عمومًا، لا الرجال وحدهم.
    reason: semantic_clarification
  - marker: c
    text: 'أو: «قد نالوا أجرهم». وقد يحمل الفعل اليوناني معنى استيفاء الأجر أو قبضه كاملًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: ومتى صلّيتم
  rationale: 'تنقل «متى» مع الفعل معنى الزمن غير المحدد المتكرر: كلما وقع منكم فعل الصلاة، بصياغة عربية واضحة وموجزة.'
- source_word: οὐκ ἔσεσθε ὡς
  choice: فلا تكونوا كـ
  rationale: المستقبل اليوناني هنا ذو قوة ناهية؛ والنهي العربي هو الأسلوب الطبيعي الذي يحفظ قوة التوجيه.
- source_word: ὑποκριταί
  choice: المرائين
  rationale: السياق يركّز على إظهار التقوى أمام الناس طلبًا لنظرهم؛ و«المراؤون» أدق في هذا الموضع من اللفظ العربي الأوسع «المنافقون».
- source_word: φιλοῦσιν
  choice: يحبّون
  rationale: يحفظ قوة الفعل الدالة على الميل والرغبة، لا مجرد ممارسة عابرة.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: في المجامع
  rationale: مصطلح عربي كتابي معروف يشير إلى المجامع اليهودية ويحفظ الخصوصية التاريخية.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: عند زوايا الشوارع الواسعة
  rationale: يحافظ على ذكر الزوايا وعلى دلالة πλατεῖα بوصفها طرقًا عامة عريضة، مع تركيب عربي طبيعي.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: أن يقفوا ويصلّوا
  rationale: يبقي الوقوف مرتبطًا بالصلاة ويقارب ترتيب التعبير اليوناني دون إيحاء بأن الوقوف نفسه هو موضع الإدانة.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: لكي يراهم الناس
  rationale: يعبّر بوضوح عن الغاية المقصودة، ويترجم ἀνθρώποις بالمعنى البشري العام.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية راسخة، جليلة ومفهومة، تنقل توكيد العبارة اليونانية.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: قد استوفوا أجرهم
  rationale: «استوفوا» تنقل الدلالة الاصطلاحية التجارية المحتملة للفعل، أي نيل المستحق كاملًا، من غير إضافة عبارة تفسيرية إلى المتن.
theological_decisions:
- issue: تحديد طبيعة ὑποκριταί في هذا السياق
  choice: المرائين
  alternative: المنافقين
  rationale: «المرائين» يبرز قصد الظهور أمام الناس المذكور صراحة، ويتجنب تحميل اللفظ معنى عقديًا أو باطنيًا أوسع مما يقتضيه السياق.
- issue: دلالة الجزاء في ἀπέχουσι
  choice: قد استوفوا أجرهم
  alternative: قد نالوا أجرهم
  rationale: يحفظ احتمال معنى القبض الكامل الملازم للاستعمال التجاري للفعل، ويترك المقابلة الأخلاقية في كلام يسوع قائمة من غير شرح مذهبي زائد.
- issue: عموم ἀνθρώποις
  choice: الناس
  alternative: البشر
  rationale: المراد عموم الناظرين لا الذكور وحدهم؛ و«الناس» أفصح وأطبع في هذا السياق.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة جليلة. استُخدم «المجامع» للمؤسسة اليهودية التاريخية، و«المرائين» لملاءمة محور السياق، مع تجنب الألفاظ الطائفية أو التفسير العقدي الزائد.
