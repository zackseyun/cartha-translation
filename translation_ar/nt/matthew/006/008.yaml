source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: ar
  text: فلا تتشبَّهوا بهم، لأن أباكم يعلم ما تحتاجون إليه قبل أن تطلبوا منه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: فلا
  rationale: تنقل «الفاء» الاستنتاجية صلة النهي بما سبقه، و«لا» تؤدي النهي بوضوح وطبيعية في العربية.
- source_word: ὁμοιωθῆτε
  choice: تتشبَّهوا
  rationale: صيغة عربية طبيعية تعبّر عن مماثلة أولئك الناس واتباع نمطهم، من غير تكلّف في نقل المبني للمجهول اليوناني حرفيًا.
- source_word: αὐτοῖς
  choice: بهم
  rationale: الضمير يحيل بوضوح إلى المذكورين في السياق السابق، ولا حاجة إلى التصريح بهويتهم داخل الآية.
- source_word: οἶδεν
  choice: يعلم
  rationale: الفعل اليوناني ذو صيغة تامة لكنه يؤدي معنى حاضرًا هنا؛ و«يعلم» هو المقابل العربي المباشر.
- source_word: ὁ πατὴρ ὑμῶν
  choice: أباكم
  rationale: يحافظ على عبارة «أبوكم» دون إضافة «السماوي»، لأنها غير موجودة صراحة في النص اليوناني لهذه الآية.
- source_word: ὧν χρείαν ἔχετε
  choice: ما تحتاجون إليه
  rationale: تعبير عربي واضح وطبيعي يؤدي مضمون الاحتياج بدقة.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: قبل أن تطلبوا منه
  rationale: ينقل دلالة السبق الزمني، ويستعمل التعدية العربية الطبيعية للفعل «طلب».
theological_decisions:
- issue: علم الآب السابق وعلاقته بالصلاة
  choice: 'صياغة تقريرية مباشرة: الآب يعلم احتياجات التلاميذ قبل أن يطلبوا منه.'
  alternative: إضافة تفسير يوضح أن الصلاة علاقة لا إخبار، أو صياغة مذهبية توسّع معنى العلم الإلهي.
  rationale: النص يقرر سبق علم الآب باحتياجاتهم دون أن يشرح سبب الصلاة رغم ذلك؛ لذا تُحفظ هذه الموازنة اللاهوتية بلا حل تفسيري مضاف.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. استُعمل «تتشبَّهوا» بدل نقل المبني للمجهول حرفيًا لأنه أفصح في السياق، مع الحفاظ على معنى النهي عن مماثلة المذكورين سابقًا.
