source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: ar
  text: لِيَأْتِ مَلَكُوتُكَ، وَلْتَكُنْ مَشِيئَتُكَ[a]، كَمَا فِي السَّمَاءِ كَذَلِكَ عَلَى الْأَرْضِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما تُفهم العبارة هكذا: «ليأتِ ملكوتك، ولتكن مشيئتك، كما في السماء كذلك على الأرض»، بحيث تنطبق «كما في السماء كذلك على الأرض» على الطلبتين معًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: لِيَأْتِ
  rationale: فعل أمر غائب يُستعمل هنا للدعاء والطلب؛ وصيغة «ليأتِ» طبيعية في العربية الفصحى وتحفظ قوة الالتماس الموجَّه إلى الله.
- source_word: βασιλεία
  choice: مَلَكُوتُكَ
  rationale: يمكن أن تعني الكلمة المُلك أو السلطان أو المملكة. «ملكوتك» تعبير عربي كتابي راسخ، ويحتمل معنى سلطان الله الملكي من غير حصره في مكان.
- source_word: γενηθήτω
  choice: وَلْتَكُنْ
  rationale: فعل أمر غائب مبني للمجهول من γίνομαι. ومع «مشيئتك» تؤدي «ولتكن» معنى تحقُّق المشيئة وصيرورتها واقعًا بصياغة عربية موجزة وطبيعية.
- source_word: θέλημα
  choice: مَشِيئَتُكَ
  rationale: «المشيئة» تنقل ما يريده الله أو يقصده، وتحفظ المجال الدلالي والوزن اللاهوتي للكلمة دون تخصيص زائد.
- source_word: ὡς
  choice: كَمَا
  rationale: أداة مقارنة، و«كما» تقابلها بوضوح وتُبقي وجه المقارنة على انفتاحه في اليونانية.
- source_word: ἐν οὐρανῷ
  choice: فِي السَّمَاءِ
  rationale: ترجمة مباشرة وطبيعية للاسم المفرد مع ἐν، وتشير في السياق إلى المجال السماوي.
- source_word: ἐπὶ γῆς
  choice: عَلَى الْأَرْضِ
  rationale: ينقل حرف الجر ἐπί مع المضاف إليه بمعنى «على»، ويحفظ التقابل بين السماء والأرض.
- source_word: καὶ
  choice: كَذَلِكَ
  rationale: في تركيب المقارنة «كما... كذلك...» تؤدي «كذلك» وظيفة καί الاصطلاحية بإتمام المقابلة، من غير إضافة معنى يتجاوز النص.
theological_decisions:
- issue: نطاق العبارة المقارِنة ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: 'تُقرأ في المتن متصلةً بالطلبة الثانية: «ولتكن مشيئتك... كما في السماء كذلك على الأرض».'
  alternative: 'يمكن أن تُفهم العبارة «كما في السماء كذلك على الأرض» على أنها تتعلق بالطلبتين معًا: مجيء الملكوت وكون المشيئة.'
  rationale: علامات الترقيم في الطبعات اليونانية الحديثة تحريرية، ويحتمل التركيب مناقشة نطاق العبارة. اتصالها النحوي الأقرب هو بالطلبة الثانية، لكن الحاشية تحفظ الاحتمال الأوسع ولا تحسم التوتر التفسيري بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة دعائية مهيبة. استُخدمت صيغتا الأمر للغائب «ليأتِ» و«لتكن» حفاظًا على قوة الالتماس في الأصل، مع تجنّب الألفاظ المذهبية الخاصة. وُضع مؤشر الحاشية بعد «مشيئتك» لإبراز مسألة نطاق العبارة المقارِنة.
