lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: أَمَّا أَنْتَ، فَعِنْدَمَا تُقَدِّمُ
  rationale: ينقل تركيب المضاف المطلق مع أداة المقابلة δέ إلى صياغة عربية طبيعية تُبرز الانتقال والمقابلة، مع إبقاء فعل العطاء مرتبطًا بالاسم التالي.
- source_word: ἐλεημοσύνην
  choice: صَدَقَةً
  rationale: «صدقة» لفظ عربي واضح وشائع يدل على ما يُعطى للمحتاج على سبيل الإحسان، وهو أقرب مقابل موجز لمعنى العطاء الخيري للفقراء.
- source_word: μὴ γνώτω
  choice: فَلَا تَدَعْ ... تَعْرِفُ
  rationale: صياغة نهي عربية طبيعية تحفظ تشخيص اليدين الوارد في اليونانية.
- source_word: ἡ ἀριστερά σου
  choice: يَدَكَ الْيُسْرَى
  rationale: ترجمة مباشرة تحفظ الصورة البلاغية والتوازي.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: مَا تَفْعَلُ يَدُكَ الْيُمْنَى
  rationale: تنقل الفعل المضارع وتحفظ العبارة التصويرية دون تفسير زائد.
theological_decisions:
- issue: دلالة القول عن اليد اليسرى واليمنى
  choice: الإبقاء على الصورة البلاغية بوصفها حثًّا قويًّا على خفاء الصدقة والبعد عن استعراض الذات.
  alternative: تحويل الصورة إلى شرح مباشر عن التواضع، أو اعتبارها حظرًا مطلقًا لكل عطاء علني.
  rationale: النص يستخدم التشخيص والمبالغة التصويرية؛ والإبقاء عليهما يصون قوة القول وغموض مدى تطبيقه، من غير فرض حكم مذهبي أوسع مما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «صدقة» لشيوعها وسهولة فهمها، مع توضيح المجال الدلالي في الحاشية، وحُفظت صورة اليدين كما هي.
