id: MAT.6.18
reference: Matthew 6:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: ar
  text: لكي لا تبدو للناس صائمًا، بل لأبيك الذي في الخفاء؛ وأبوك الذي يرى في الخفاء سيكافئك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: لكي
  rationale: تفيد الغاية، وتحافظ «لكي» على القوة الغائية بعبارة عربية طبيعية.
- source_word: μὴ φανῇς
  choice: لا تبدو
  rationale: تنقل معنى الظهور أمام المراقبين، وهو الأنسب لسياق التحذير من إظهار التقوى.
- source_word: τοῖς ἀνθρώποις
  choice: للناس
  rationale: اللفظ اليوناني يشير هنا إلى البشر عمومًا، لا إلى الذكور وحدهم؛ و«الناس» تؤدي هذا المعنى بوضوح.
- source_word: νηστεύων
  choice: صائمًا
  rationale: حال تصف الهيئة التي قد يبدو عليها المخاطَب، وهي صياغة عربية موجزة وطبيعية.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: بل لأبيك
  rationale: تحافظ «بل» على المقابلة بين الناس والآب، وتحافظ اللام على توازي عبارتي الداتيف في اليونانية.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: الذي في الخفاء
  rationale: تنقل العبارة كما تصف الآب في المجال الخفي من غير تقييدها بمكان مادي محدد.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: الذي يرى في الخفاء
  rationale: تحافظ على التكرار البلاغي لعبارة «في الخفاء» ولا تضيف مفعولًا غير مصرح به مثل «ما يُفعل».
- source_word: ἀποδώσει σοι
  choice: سيكافئك
  rationale: الفعل في هذا السياق يدل على الجزاء الإلهي، و«سيكافئك» واضحة وطبيعية.
theological_decisions:
- issue: عموم دلالة ἀνθρώποις
  choice: الناس
  alternative: الرجال
  rationale: المقصود المراقبون من البشر عمومًا، وليس الذكور على وجه الخصوص.
- issue: دلالة κρυφαίῳ في الموضعين
  choice: في الخفاء في الموضعين
  alternative: في المكان الخفي / سرًّا
  rationale: توحيد الصياغة يحفظ الصلة البلاغية بين خفاء الآب ورؤيته في الخفاء، من غير حسم ما إذا كانت العبارة مكانية أو حالية حسمًا زائدًا.
- issue: طبيعة الجزاء في ἀποδώσει
  choice: سيكافئك
  alternative: سيردّ لك / سيجازيك
  rationale: تدل الكلمة في سياق ممارسة التقوى واستجابة الآب عليها على المكافأة، من غير تحديد شكلها أو توقيتها.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «تبدو» بدل تركيب أثقل مثل «تظهر للناس أنك صائم»، وحُفظ تكرار «في الخفاء» كما في النص اليوناني.
