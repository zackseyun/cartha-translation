  source_fidelity: 'الترجمة أمينة للنص اليوناني: «لكي» تؤدي غاية ὅπως، و«لا تبدو للناس صائمًا» تنقل μὴ φανῇς τοῖς ἀνθρώποις νηστεύων دون إضافة تفسيرية. والمقابلة بـ«بل لأبيك» تحافظ على الإضمار المقصود في الأصل. كما حُفظ تكرار «في الخفاء» في الموضعين، وأُدّيت ἀποδώσει بسياقها الملائم: «سيكافئك».'
