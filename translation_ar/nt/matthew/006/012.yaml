translation:
  language: ar
  text: واغفر لنا ديوننا، كما غفرنا نحن أيضًا للمدينين لنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«الديون» و«المدينون» يحفظان استعارة الدَّين في اليونانية: فـ«ديوننا» تشير هنا إلى خطايانا أو إساآتنا، و«المدينون لنا» إلى الذين أساؤوا إلينا أو عليهم حقّ لنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: اغفر
  rationale: فعل أمر في سياق الصلاة؛ ومع «الديون» الأخلاقية يكون معنى المغفرة هو الأنسب، مع بقاء صورة إسقاط ما هو مستحق.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: ديوننا
  rationale: يحفظ المعنى الحرفي والاستعارة في اليونانية، ويُبقي الصلة اللفظية مع «المدينين» في الشطر التالي.
- source_word: ὡς
  choice: كما
  rationale: تنقل المقارنة بإيجاز ووضوح من غير أن تحدد وحدها طبيعة العلاقة اللاهوتية بين المغفرتين.
- source_word: καὶ ἡμεῖς
  choice: نحن أيضًا
  rationale: يحفظ الضمير الصريح ونبرة الإضافة أو التوكيد في النص اليوناني.
- source_word: ἀφήκαμεν
  choice: غفرنا
  rationale: صيغة الماضي العربية تنقل الماضي اليوناني البسيط بصورة طبيعية، من غير فرض دلالة زمنية أدق مما تسمح به الصيغة.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: للمدينين لنا
  rationale: يحفظ الجذر الدلالي المشترك مع «ديوننا» واستعارة الدَّين، مع تركيب عربي واضح.
theological_decisions:
- issue: استعارة الدَّين الأخلاقي
  choice: الإبقاء على «ديوننا» و«المدينين لنا» في المتن
  alternative: خطايانا / المسيئين إلينا
  rationale: النص يستخدم ألفاظ الدَّين استعمالًا مجازيًا يشير في السياق إلى الخطايا أو الإساءات؛ والإبقاء على الاستعارة أوفى للمصدر ولا يستبدلها بتفسير.
- issue: العلاقة بين طلب مغفرة الله ومغفرة الإنسان
  choice: ترجمة ὡς بـ«كما» من دون شرح سببي أو شرطي
  alternative: لأننا غفرنا / بشرط أن نغفر
  rationale: «كما» تحفظ المقارنة والتوتر اللاهوتي في العبارة ولا تحسم ما إذا كانت مغفرة الإنسان أساسًا أو دليلًا أو نظيرًا للمغفرة المطلوبة.
- issue: القيمة الزمنية لـἀφήκαμεν
  choice: «غفرنا»
  alternative: «قد غفرنا»
  rationale: الماضي البسيط عربي طبيعي ويطابق الصيغة اليونانية؛ وإضافة «قد» ممكنة لإبراز تمام الفعل، لكنها قد تمنحه توكيدًا زائدًا غير لازم.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. حُفظت استعارة الدَّين والربط اللفظي بين «ديوننا» و«المدينين لنا»، ووُضع ضمير «نحن» لإظهار توكيد καὶ ἡμεῖς. جاءت علامة الحاشية في نهاية الجملة لأنها تشرح طرفي الاستعارة معًا.
