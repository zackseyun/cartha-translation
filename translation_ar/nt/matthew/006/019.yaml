  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: ar
  text: لا تَكنِزوا لأنفسكم كنوزًا على الأرض، حيث يُفنيها العُثّ والتآكل[a]، وحيث يَنقُب اللصوص[b] ويسرقون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الصدأ». تدل الكلمة اليونانية على الأكل أو الاستهلاك المؤدي إلى التلف، وقد يكون معناها أوسع من صدأ المعادن وحده.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يحفرون» أو «ينقبون». ولعل الصورة تشير إلى لصوص ينفذون عبر جدران البيوت المصنوعة من الطين أو اللَّبِن.'
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: لا تَكنِزوا
  rationale: صيغة نهي تحافظ على الصلة اللفظية بين فعل «تكنزون» واسم «كنوز»، وتأتي عربية واضحة ومباشرة.
- source_word: ὑμῖν
  choice: لأنفسكم
  rationale: 'تنقل دلالة ضمير المصلحة العائد إلى المخاطَبين: جمع الكنوز لحيازتهم أو منفعتهم الخاصة.'
- source_word: θησαυροὺς
  choice: كنوزًا
  rationale: مقابل مباشر يحفظ الاشتقاق المشترك مع الفعل «تكنزوا»، ولا يقصر المعنى على النقود.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: يحفظ الدلالة المكانية والتقابل الضمني مع السماء في السياق التالي.
- source_word: σὴς
  choice: العُثّ
  rationale: يشير إلى الحشرة التي تفسد الثياب والمواد المخزونة، وهو المقابل العربي الدقيق.
- source_word: βρῶσις
  choice: التآكل
  rationale: ينقل معنى الأكل أو الاستهلاك المؤدي إلى التلف، من غير حصر اللفظة اليونانية في صدأ المعادن.
- source_word: ἀφανίζει
  choice: يُفنيها
  rationale: يفيد إزالة الشيء وإهلاكه، والضمير يوضح في العربية أن الكنوز هي المتضررة.
- source_word: κλέπται
  choice: اللصوص
  rationale: المقابل العربي المباشر والواضح.
- source_word: διορύσσουσιν
  choice: يَنقُب
  rationale: يحفظ الصورة الحرفية لفعل الحفر أو اختراق الجدار، بدل طمسها بتعبير عام مثل «يقتحم».
- source_word: κλέπτουσιν
  choice: يسرقون
  rationale: المقابل العربي المعتاد للفعل الدال على السرقة.
theological_decisions:
- issue: نطاق عبارة ἐπὶ τῆς γῆς
  choice: على الأرض
  alternative: في الأرض / أرضية
  rationale: الصياغة المختارة تحافظ على المجال الأرضي المقابل للسماء في العدد التالي، من غير إضافة تمييز لاهوتي غير مصرّح به.
- issue: دلالة βρῶσις
  choice: التآكل
  alternative: الصدأ
  rationale: «الصدأ» احتمال تقليدي ممكن، لكن اللفظة اليونانية أوسع وتشمل الاستهلاك والتلف؛ لذلك يحفظ «التآكل» اتساع المعنى، مع ذكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي بين «تكنزوا» و«كنوزًا»، كما حُفظت صورة النقب في الأصل مع توضيح خلفيتها الثقافية في الحاشية.
