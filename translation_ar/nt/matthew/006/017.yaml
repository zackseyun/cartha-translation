lexical_decisions:
- source_word: σὺ δὲ
  choice: أمّا أنت
  rationale: يحفظ توكيد الضمير والمقابلة مع المرائين في السياق السابق، بصياغة عربية طبيعية.
- source_word: νηστεύων
  choice: فعندما تصوم
  rationale: اسم الفاعل اليوناني مستعمل استعمالًا ظرفيًّا زمنيًّا، وهذه الصياغة تنقل المعنى بوضوح وطبيعية.
- source_word: ἄλειψαί
  choice: فادهن
  rationale: ينقل فعل وضع الزيت بوصفه من العناية المعتادة بالمظهر، من غير أن يفرض على العبارة معنى طقسيًّا.
- source_word: τὴν κεφαλήν
  choice: رأسك
  rationale: ترجمة مباشرة لكلمة κεφαλή، مع بقاء دلالة العناية بالرأس أو الشعر مفهومة من السياق.
- source_word: καὶ
  choice: و
  rationale: يربط الأمرين ربطًا بسيطًا كما في الأصل.
- source_word: τὸ πρόσωπόν σου
  choice: وجهك
  rationale: تعبير عربي واضح ومعاصر عن الوجه الظاهر.
- source_word: νίψαι
  choice: اغسل
  rationale: الفعل اليوناني يدل عادةً على غسل جزء من الجسد، و«اغسل» هو المقابل الطبيعي هنا.
theological_decisions:
- issue: طبيعة الوصية المتعلقة بمظهر الصائم
  choice: توجّه الوصية الصائم إلى المحافظة على مظهره المعتاد بدل إظهار صومه للناس.
  alternative: قد يُفهم دهن الرأس على أنه مسحة طقسية، أو تُفهم الوصية على أنها منع للصوم العلني في ذاته.
  rationale: السياق المباشر يقابل تشويه المرائين لوجوههم بالعناية المعتادة بالمظهر. ولا تنص الآية على منع الصوم، ولا تستلزم أن يكون دهن الرأس عملًا طقسيًّا.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقّرة. استُعملت «أمّا أنت» لإبراز المقابلة، و«فادهن» للمحافظة على الصورة الثقافية من غير إيحاء طقسي لازم.
