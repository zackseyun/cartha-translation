  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: ar
  text: فإنَّ الأمم[a] تطلب[b] كلَّ هذه الأشياء، لأنَّ أباكم السماوي يعلم أنكم تحتاجون إلى كلِّ هذه الأشياء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «غير اليهود»، وربما «الوثنيون». يمكن أن يدل اللفظ اليوناني على الأمم عمومًا، لكنه يشير هنا على الأرجح إلى من هم خارج شعب العهد.
    reason: alternative_reading
  - marker: b
    text: أو «تسعى إليها»؛ فقد يفيد الفعل اليوناني طلبًا حثيثًا أو متواصلًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: الأمم
  rationale: المقابل العربي الطبيعي للمصطلح اليوناني، ويحفظ دلالته الواسعة على الشعوب مع سماحه، في هذا السياق، بالإشارة إلى غير اليهود من خارج جماعة العهد.
- source_word: ἐπιζητοῦσιν
  choice: يطلبون
  rationale: ينقل معنى السعي وراء الأشياء المذكورة بوضوح ومن غير إضافة درجة من الشدة لا يفرضها السياق؛ وتوضح الحاشية إمكان معنى الطلب الحثيث أو المواظب.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: أباكم السماوي
  rationale: صياغة عربية موجزة وطبيعية تحفظ علاقة الأبوة ووصف الآب بأنه سماوي.
- source_word: οἶδεν
  choice: يعلم
  rationale: الفعل اليوناني ذو صيغة تامة لكنه يؤدي معنى حاضرًا، و«يعلم» هو المقابل العربي الواضح المناسب.
- source_word: χρῄζετε
  choice: تحتاجون إلى
  rationale: تعبير عربي حديث مباشر يؤدي معنى الاحتياج من غير تكلف.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: هذه كلَّها ... هذه كلِّها
  rationale: يحفظ التكرار والتوكيد الموجودين في اليونانية مع تركيب عربي مفهوم.
- source_word: γὰρ ... γὰρ
  choice: فإنَّ ... لأنَّ
  rationale: يحفظ الترابط التفسيري في الموضعين، مع تنويع عربي طبيعي يبين أن الجملة الثانية تعلل الطمأنينة الضمنية في السياق.
theological_decisions:
- issue: مدلول τὰ ἔθνη في تعليم يسوع
  choice: الأمم
  alternative: الوثنيون؛ غير اليهود
  rationale: «الأمم» تحفظ اللفظ التاريخي والعهدي من دون أن تضيف حكمًا قدحيًا؛ وتبيّن الحاشية أن المقصود في السياق غالبًا غير اليهود أو من هم خارج جماعة العهد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «الأمم» للمحافظة على سعة اللفظ اليوناني، ووُضعت البدائل التفسيرية في الحاشية. حُفظ تكرار «هذه كلها» للتوكيد، مع صياغة عربية طبيعية للربط السببي.
