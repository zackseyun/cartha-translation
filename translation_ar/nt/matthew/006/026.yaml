source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: ar
  text: 'انظروا إلى طيور السماء[a]: إنها لا تزرع ولا تحصد ولا تجمع شيئًا في مخازن، وأبوكم السماوي يطعمها. أفَلَستم أنتم أكثر قيمةً منها[b]؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن: «طيور الجو».'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن: «أفلا تفوقونها؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: انظروا إلى
  rationale: صيغة أمر تدعو المخاطَبين إلى توجيه نظرهم وانتباههم؛ والعبارة واضحة وطبيعية من غير مبالغة في معنى التدقيق.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: تنقل صورة الطيور المحلّقة في السماء نقلاً مباشرًا، وتلائم المجال المنظور في السياق.
- source_word: ὅτι
  choice: إنها
  rationale: تُدخل مضمون الملاحظة بعد النقطتين بصورة عربية طبيعية، مع الحفاظ على الصلة التفسيرية بين الأمر بالنظر وما تفعله الطيور أو لا تفعله.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: تزرع ولا تحصد ولا تجمع
  rationale: تحافظ على الأفعال الزراعية المتوازية في اليونانية وعلى تتابعها.
- source_word: εἰς ἀποθήκας
  choice: في مخازن
  rationale: ἀποθήκαι مواضع تخزين المحاصيل؛ و«مخازن» لفظ حديث واضح لا يضيّق المعنى على نوع واحد من الأبنية.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: أبوكم السماوي
  rationale: يحفظ اللفظ العلاقي «الأب» والوصف السماوي في تركيب عربي موجز ومألوف.
- source_word: τρέφει
  choice: يطعمها
  rationale: يدل الفعل هنا على توفير الطعام، و«يطعمها» هو المقابل المباشر والطبيعي.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: أفَلَستم أنتم أثمن منها بكثير؟
  rationale: يحافظ الاستفهام الإنكاري على الجواب الإيجابي المتوقع، وتنقل «أثمن» معنى التفوق في القيمة، فيما تنقل «بكثير» قوة المقارنة.
theological_decisions:
- issue: القيمة النسبية للبشر والطيور في حجة يسوع
  choice: تؤكد الصياغة أن المخاطَبين أثمن من الطيور في سياق عناية الله، من غير تحديد الأساس العقائدي لهذه القيمة.
  alternative: ربط هذه القيمة صراحةً بحمل الإنسان صورة الله أو بالعلاقة العهدية وحدها.
  rationale: تثبت الآية المقارنة في القيمة، لكنها لا تذكر في هذا الموضع سببًا عقائديًا محددًا لها؛ لذلك لا تضيف الترجمة تفسيرًا غير منصوص عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت النقطتان بعد الأمر بالنظر لعرض مضمون الملاحظة بسلاسة، وحُفظ التوازي الزراعي والاستفهام البلاغي في الأصل.
