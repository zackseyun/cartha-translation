language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: ar
  text: 'فمتى أعطيتَ صدقةً[a]، فلا تنفخ في بوق أمامك[b]، كما يفعل المراؤون في المجامع وفي الشوارع، لكي يمجّدهم الناس[c]. الحق أقول لكم: إنهم قد استوفوا أجرهم[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعطيتَ المحتاجين»، أو: «مارستَ أعمالَ رحمة». يشير التعبير اليوناني إلى العطاء الخيري.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا تُعلن عنها بالبوق». وقد تكون العبارة مبالغة أو صورة مجازية للإعلان عن الصدقة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لكي يمدحهم الناس» أو «يكرمهم الناس». والفعل اليوناني يعني حرفيًا «يمجّد».'
    reason: lexical_alternative
  - marker: d
    text: «استوفوا أجرهم» اصطلاح ذو خلفية تجارية، ومعناه أنهم قبضوا أجرهم كاملًا، فلا يبقى لهم منه شيء ينتظرونه.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: فمتى
  rationale: تنقل الفاءُ صلةَ الكلام بما قبله، وتفيد «متى» ظرفًا عامًا متكررًا يوافق ὅταν مع صيغة الاحتمال.
- source_word: ποιῇς ἐλεημοσύνην
  choice: أعطيتَ صدقةً
  rationale: تعبير عربي طبيعي ودقيق عن الاصطلاح اليوناني الدال على العطاء الخيري للمحتاجين.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: فلا تُبَوِّق أمامك
  rationale: يحفظ الصورة الحرفية القوية في النص، سواء فُهمت على سبيل المبالغة أو المجاز، من غير حسم لطبيعتها.
- source_word: οἱ ὑποκριταί
  choice: المراؤون
  rationale: «المراؤون» أوضح في هذا السياق من النقل الحرفي «المنافقون»، إذ يركّز الكلام على إظهار العبادة طلبًا لثناء الناس.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: في المجامع
  rationale: «المجامع» تسمية عربية راسخة لمواضع اجتماع اليهود للعبادة، وتوافق السياق التاريخي.
- source_word: ἐν ταῖς ῥύμαις
  choice: في الشوارع
  rationale: لفظ حديث واضح ينقل معنى الطرق أو الأزقة العامة حيث يراهم الناس.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: لكي يمجّدهم الناس
  rationale: يحفظ غرض الفعل وقوة δοξάζω، مع استعمال «الناس» لأن ἀνθρώπων عام لا يختص بالذكور.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية مهيبة ومفهومة تنقل التوكيد السلطاني في العبارة اليونانية.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: قد استوفوا أجرهم
  rationale: «استوفوا» تنقل الاصطلاح التجاري الذي يفيد قبض الأجر كاملًا، لا مجرد امتلاكه.
theological_decisions:
- issue: دلالة ὑποκριταί في سياق ممارسة الصدقة علنًا
  choice: المراؤون
  alternative: المنافقون
  rationale: الاختيار يبرز التظاهر بالتقوى طلبًا لمدح الناس، وهو محور السياق، من غير إضافة حكم عقدي أوسع مما يقوله النص.
- issue: قوة δοξασθῶσιν
  choice: يمجّدهم الناس
  alternative: يمدحهم الناس / يكرمهم الناس
  rationale: يحافظ «يمجّدهم» على القوة المعجمية للفعل وعلى المفارقة بين المجد البشري والأجر، من غير تخفيفها إلى مجرد الثناء.
- issue: قوة ἀπέχουσιν التجارية
  choice: قد استوفوا أجرهم
  alternative: لهم أجرهم / قد نالوا أجرهم
  rationale: تفيد العبارة أن ما نالوه من الناس هو كامل ما سيحصلون عليه، مع عدم إضافة تفصيل عن طبيعة الأجر الإلهي خارج منطوق الآية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُعملت «صدقة» لشيوعها ووضوحها، و«المراؤون» لإبراز الأداء الديني طلبًا لنظر الناس. حُفظت صورة البوق وقوة «يمجّدهم»، بينما عبّرت «استوفوا» عن الدلالة الاصطلاحية للفعل اليوناني.
