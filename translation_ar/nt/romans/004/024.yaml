review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: الاستدراك والإضافة، والإحالة إلى ما سيُحسب، والإيمان بالله الذي أقام يسوع ربنا من الأموات. لكن تركيب «نحن الذين سيُحسب لنا» يحتاج إلى ضبط نحوي؛ إذ إن ضمير الجر «لنا» لا يقوم مقام العائد المرفوع الذي تتطلبه صلة الموصول في هذه الصياغة.'
  naturalness: الفصحى واضحة في الجملة عمومًا، لكن «إذ نؤمن» بعد «نحن الذين» أقل سلاسة وتوهم بعلاقة سببية أو زمنية، بينما العبارة اليونانية تحدد هوية المخاطَبين/المشار إليهم بوصفهم المؤمنين. الصياغة المنقحة تجعل هذا التحديد مباشرًا وطبيعيًا.
  terminology: «يُحسَب» يحفظ استعارة الحساب في λογίζεσθαι، و«نؤمن بالذي» مناسب لـ πιστεύουσιν ἐπί. و«أقام ... من بين الأموات» تعبير سليم ودقيق. تبقى إحالة «البر» في الحاشية إلى السياق السابق، لا إلى لفظ مصرح به في هذه الآية.
  issues:
  - severity: medium
    issue: صلة الموصول في «نحن الذين سيُحسب لنا» غير محكمة نحويًا.
    rationale: في البناء المبني للمجهول، «لنا» جار ومجرور ولا يربط «الذين» ربطًا نحويًا بوصفه عائدًا مرفوعًا. استعمال «سيُحسَب لهم» يحقق العائد ويصون المعنى.
  - severity: low
    issue: «إذ نؤمن» لا تعكس بوضوح وظيفة «τοῖς πιστεύουσιν» التحديدية.
    rationale: «إذ» قد تفهم سببية أو زمنية، في حين أن اسم الفاعل المعرّف في اليونانية يعرّف الجماعة المقصودة. «وهم الذين يؤمنون» أوضح وأقرب وظيفيًا.
