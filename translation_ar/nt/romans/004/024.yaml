lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: بل من أجلنا أيضًا
  rationale: تحفظ «بل» القوة الاستدراكية، و«أيضًا» القوة الإضافية، مع وصل الكلام بما قبله.
- source_word: δι’ ἡμᾶς
  choice: من أجلنا
  rationale: تنقل دلالة διά مع النصب هنا على أن ما كُتب كان بالنظر إلينا ولأجلنا.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: نحن الذين سيُحسب لنا
  rationale: تحافظ الصياغة على التوجه المستقبلي لـ μέλλει وعلى صورة الحساب في λογίζεσθαι، وتترك المحسوب مضمرًا كما في اليونانية اعتمادًا على السياق السابق.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: إذ نؤمن بالذي
  rationale: توضح العبارة أن المقصود بـ«نحن» هم المؤمنون، وتنقل اتجاه الإيمان نحو شخص؛ وجاءت «إذ» لتجنب ثقل تكرار الموصول في العربية.
- source_word: τὸν ἐγείραντα
  choice: الذي أقام
  rationale: تحفظ وظيفة اسم الفاعل اليوناني المستعمل استعمال الاسم، إذ يُشار إلى الله بفعله.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: يسوع ربنا
  rationale: صياغة عربية طبيعية تحفظ الاسم واللقب وعلاقة الإضافة.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تعبير عربي واضح يحفظ صورة الإقامة من وسط الموتى.
theological_decisions:
- issue: المفعول المضمر للفعل λογίζεσθαι
  choice: 'إبقاؤه مضمرًا: «سيُحسب لنا»'
  alternative: «سيُحسب لنا البر» أو «سيُحسب ذلك لنا»
  rationale: النص اليوناني لا يصرح بالمفعول، وإن كان السياق السابق يدل على البر. إبقاء الإضمار يحفظ ترابط الحجة ولا يضيف لفظًا غير موجود في الآية.
- issue: دلالة πιστεύω ἐπί
  choice: «نؤمن بالذي»
  alternative: «نتكل على الذي»
  rationale: «نؤمن بـ» هي الصياغة العربية الطبيعية للإيمان الموجَّه إلى شخص، مع بقاء معنى الثقة ممكنًا ولذلك أُثبت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. حُفظت بنية الاستدراك والإضافة، وصورة الحساب، وإضمار الشيء المحسوب. وُضعت علامتا الحاشية في موضع صلتهما المباشرة بالنص.
