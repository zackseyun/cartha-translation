  text: بَلْ مِنْ أَجْلِنَا أَيْضًا، نَحْنُ الَّذِينَ سَيُحْسَبُ لَهُمْ[a]، وَهُمْ الَّذِينَ يُؤْمِنُونَ بِالَّذِي أَقَامَ يَسُوعَ رَبَّنَا مِنْ بَيْنِ الْأَمْوَاتِ[b].
