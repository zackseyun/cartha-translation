    issue: التركيب «لِمَنْ هُوَ مِنْ إِيمَانِ إِبْرَاهِيمَ» غير طبيعي وملتبس.
    rationale: التركيب اليوناني المضغوط τῷ ἐκ πίστεως Ἀβραάμ يفيد أشخاصًا ينتمون إلى/يتصفون بإيمان إبراهيم. نقله الحرفي بـ«من إيمان إبراهيم» لا يبين هذه العلاقة في العربية، وقد يُفهم على نحو غير مقصود.
  - severity: low
    issue: إبقاء المفرد في «لِمَنْ هُوَ» لا يخدم الوضوح العربي هنا.
    rationale: المفرد اليوناني ذو قيمة جمعية، واستعمال الجمع العربي ينقل المرجع المقصود بوضوح من غير خسارة دلالية. تُبيّن الحاشية إمكان الصياغة الأقرب إلى ترتيب اليونانية.
