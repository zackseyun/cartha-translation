- issue: المفرد ذو الدلالة الجمعية في طرفي المقابلة
  choice: لِمَنْ هُوَ ... لِمَنْ هُوَ
  alternative: لِلَّذِينَ هُمْ ... لِلَّذِينَ هُمْ
  rationale: حُفظ المفرد اليوناني في المتن، مع بيان إمكان فهمه جمعيًا في الحاشية، تجنبًا لطمس بنية المقابلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «الشريعة» لـ νόμος لأنها أوضح للقارئ المعاصر من «الناموس»، مع إبقاء الصياغة قريبة من تركيب الأصل. وُضعت علامات الحواشي بجوار الألفاظ التي تشرحها، مع تصحيح عدم تطابق مواضعها الظاهر في طبقة الاستشارة الإنجليزية.
