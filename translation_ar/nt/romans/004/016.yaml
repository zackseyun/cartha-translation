  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: الإيمان أساس الأمر، والنعمة غايته، والوعد ثابت لجميع نسل إبراهيم، لا لفئة الشريعة وحدها. لكن عبارة «لِمَنْ هُوَ مِنْ إِيمَانِ إِبْرَاهِيمَ» تحاكي ضغط اليونانية على حساب الدلالة العربية الواضحة؛ والأصل يشير إلى أناس يتصفون بإيمان إبراهيم أو يشاركونه، لا إلى علاقة منشأ مبهمة بـ«إيمان إبراهيم».'
  naturalness: الفصحى في معظم النص سليمة ورصينة. غير أن «مِنْ إِيمَانِ إِبْرَاهِيمَ» غير مألوفة في الاستعمال العربي الحديث وقد تلتبس. كما أن استعمال الجمع في طرفي المقابلة عربيًّا أوضح ولا يبدّل المعنى الجمعي المقصود من المفرد اليوناني.
  terminology: «الإيمان»، «النعمة»، «الوعد»، «النسل»، و«الشريعة» مقابلات مناسبة ومتسقة. تُحفظ إحالة حاشية «النسل» إلى σπέρμα، وإحالة حاشية «الإيمان» إلى πίστις.
  issues:
