  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: ar
  text: لأنه إن كان أهل الشريعة هم الوارثون، فقد أُفرغ الإيمان من مضمونه[a]، وأُبطل الوعد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فقد أُفرغ الإيمان»؛ أي جُعل فارغًا أو عديم الجدوى.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «جُعل الوعد عديم الأثر» أو «أُلغي مفعوله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: أهل الشريعة
  rationale: تعبير عربي موجز وطبيعي يدل على أناس تحددهم صلتهم بالشريعة، من غير حصر المعنى في مجرد حفظ أحكامها.
- source_word: κληρονόμοι
  choice: الوارثين
  rationale: يحافظ على صورة الميراث المركزية في سياق الوعد لإبراهيم، وجاء منصوبًا لأنه خبر «كان».
- source_word: κεκένωται
  choice: فقد أُفرغ ... من مضمونه
  rationale: يحفظ استعارة الإفراغ وقوة صيغة التمام اليونانية، مع بيان المقصود بالعربية الطبيعية دون اختزاله إلى مجرد البطلان.
- source_word: πίστις
  choice: الإيمان
  rationale: اللفظ العربي المعياري في هذا السياق، ويحفظ مقابلة بولس بين الإيمان والشريعة.
- source_word: κατήργηται
  choice: أُبطل
  rationale: يفيد جعل الشيء غير نافذ أو عديم الأثر، دون الإيحاء بإفنائه.
- source_word: ἡ ἐπαγγελία
  choice: الوعد
  rationale: يحيل بوضوح إلى الوعد المحدد الجاري الحديث عنه في السياق.
theological_decisions:
- issue: دلالة πίστις في مقابل νόμος
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: سياق رومية 4 يقابل نيل الميراث على أساس الشريعة بنيله من خلال الإيمان؛ ولذلك يحفظ «الإيمان» خط الحجة من غير إدخال تفسير مذهبي إضافي.
- issue: هوية οἱ ἐκ νόμου
  choice: أهل الشريعة
  alternative: الذين هم من الشريعة؛ الذين يعتمدون على الشريعة
  rationale: يحافظ الاختيار على التعبير البولسي المكثف وعلى شيء من سعته، فلا يحصر الجماعة في تعريف تفسيري مثل «حافظي الشريعة» أو «المعتمدين عليها».
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أهل الشريعة» لتجنب التركيب الحرفي الثقيل، مع إبقاء استعارة الإفراغ في العبارة الأساسية وشرحها بإيجاز.
