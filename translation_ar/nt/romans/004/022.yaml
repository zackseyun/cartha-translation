lexical_decisions:
- source_word: διό
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق، وتحافظ بوضوح وإيجاز على الصلة المنطقية بالسياق.
- source_word: ἐλογίσθη
  choice: حُسِبَ
  rationale: تحافظ صيغة المبني للمجهول على بنية اليونانية، وتبقي صورة الحساب والإسناد المحورية في رومية 4 من غير إضافة تفسير عقائدي.
- source_word: αὐτῷ
  choice: له
  rationale: تنقل الداتيف نقلًا عربيًا طبيعيًا وتحافظ على الإشارة الشخصية إلى إبراهيم في السياق.
- source_word: εἰς
  choice: 'برًّا (في تركيب: حُسِبَ له برًّا)'
  rationale: ينقل هذا التركيب العربي معنى اعتبار الشيء أو إسناده بصفته برًّا، من غير إثقال العبارة بحرف جر غير طبيعي.
- source_word: δικαιοσύνην
  choice: برًّا
  rationale: «البرّ» هو المقابل الأنسب في هذا السياق البولسي، مع إبقاء احتمال «العدل» في الحاشية صونًا للمدى الدلالي للكلمة.
theological_decisions:
- issue: نقل لغة بولس الحسابية/الإسنادية من غير إدخال صياغة عقائدية زائدة
  choice: حُسِبَ له برًّا
  alternative: عُدَّ له برًّا؛ قُيِّد له برًّا
  rationale: تحافظ الصياغة على الاستعارة الحسابية وعلى المبني للمجهول، ولا تحدد أكثر مما يصرح به النص كيفية هذا الإسناد أو طبيعته.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. استُعمل «حُسِبَ» للمحافظة على اللفظ المحوري في سياق رومية 4، ووُضعت علامتا الحاشيتين في المتن.
