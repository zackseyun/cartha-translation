    rationale: 'κατὰ ὀφείλημα تقابل κατὰ χάριν في كيفية معاملة الأجرة: ليست كنعمة، بل كشيء مستحق. و«على أنها دَينٌ مستحقّ» تنقل هذا التقابل بوضوح.'
  - severity: low
