  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: ar
  text: أَمَّا مَنْ يَعْمَلُ، فَلَا تُحْسَبُ لَهُ أُجْرَتُهُ عَلَى أَنَّهَا نِعْمَةٌ، بَلْ عَلَى أَنَّهَا دَيْنٌ مُسْتَحَقٌّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: على أساس ما هو واجب الأداء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: مَنْ يَعْمَلُ
  rationale: اسم الفاعل المضارع المعرّف مستعمل استعمالًا اسميًّا عامًا، فيشير إلى كل من يعمل؛ وهذه الصياغة طبيعية وتحفظ دلالة الاستمرار أو الاتصاف دون حصرها في عامل بعينه.
- source_word: μισθὸς
  choice: أُجْرَتُهُ
  rationale: السياق سياق عمل ومقابل مستحق، ولذلك تعبّر «الأجرة» بدقة عن العوض المكتسب.
- source_word: λογίζεται
  choice: تُحْسَبُ لَهُ
  rationale: يحمل الفعل صورة حسابية هي القيد أو الاحتساب لشخص، و«تُحسب له» عربية واضحة وتحفظ هذه الصورة.
- source_word: κατὰ χάριν
  choice: عَلَى سَبِيلِ النِّعْمَةِ
  rationale: تحفظ «النعمة» اللفظ المحوري في رسالة رومية، بينما يوضح التركيب أن المقصود كيفية احتساب الأجرة، لا أنها عطية مستحقة.
- source_word: ὀφείλημα
  choice: الدَّيْنِ
  rationale: يدل اللفظ على ما هو واجب الأداء أو مستحق، و«الدَّين» يحفظ مجاز الاستحقاق المالي والتقابل المباشر مع النعمة.
- source_word: δὲ
  choice: أَمَّا
  rationale: تؤدي «أما» وظيفة الانتقال والمقابلة مع المثال السابق من غير إدخال دلالة زمنية غير موجودة في الأصل.
theological_decisions:
- issue: ترجمة χάρις في مقابلة الأجرة المستحقة
  choice: على سبيل النعمة
  alternative: على أنها عطية
  rationale: تحفظ الصياغة المصطلح البولسي «النعمة» مع إبقاء التباين بين العطاء غير المستحق والدَّين المستحق، من غير اختزال المعنى اللاهوتي إلى مفهوم الهدية وحده.
- issue: دلالة ὀφείλημα
  choice: الدَّين
  alternative: ما هو مستحق / الالتزام
  rationale: «الدَّين» أقرب إلى الصورة المالية في الأصل، ولا يحسم ما وراءها بألفاظ تفسيرية أوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم البناء «أما... فـ» لإظهار المقابلة، وحُفظت الصورة الحسابية والمالية في «تُحسب»، و«الأجرة»، و«الدَّين».
