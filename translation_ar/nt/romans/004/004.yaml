  to: أَمَّا مَنْ يَعْمَلُ، فَلَا تُحْسَبُ لَهُ أُجْرَتُهُ عَلَى أَنَّهَا نِعْمَةٌ، بَلْ عَلَى أَنَّهَا دَيْنٌ مُسْتَحَقٌّ.[a]
