  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: ar
  text: ولم يُكتَب من أجله وحده أنه حُسِب له،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عُدَّ له» أو «احتُسب له».'
    reason: بدائل معجمية للفعل ἐλογίσθη تُظهر دلالته على العدّ أو الاحتساب.
lexical_decisions:
- source_word: ἐγράφη
  choice: يُكتَب
  rationale: صيغة المبني للمجهول تحافظ على الإشارة المباشرة إلى النص المكتوب، وهي عربية طبيعية في هذا السياق.
- source_word: δὲ
  choice: الواو في «ولم»
  rationale: تؤدي الواو وظيفة الانتقال والربط في السياق من غير أن تفرض معنى استدراكيًا حادًا لا يقتضيه δέ هنا.
- source_word: δι’ αὐτὸν μόνον
  choice: من أجله وحده
  rationale: تنقل معنى διά مع النصب، وتحفظ التشديد على أن الكلام لم يُكتب مراعاةً لإبراهيم وحده.
- source_word: ὅτι
  choice: النقطتان وبداية الاقتباس
  rationale: تقدمان مضمون ما كُتب بصورة طبيعية في العربية، بدل تركيب ثقيل من قبيل «أنه حُسب له».
- source_word: ἐλογίσθη
  choice: حُسِب
  rationale: يحفظ الفعل معنى العدّ أو الاحتساب، ويلائم سياق بولس الحسابي من غير إضافة تفسير عقائدي إلى النص.
- source_word: αὐτῷ
  choice: له
  rationale: ينقل الداتيف بوضوح وإيجاز مع الفعل المبني للمجهول «حُسِب».
theological_decisions:
- issue: دلالة λογίζομαι في سياق التبرير عند بولس
  choice: حُسِب
  alternative: عُدَّ له؛ قُيِّد في حسابه
  rationale: «حُسِب» تعبير واضح وشائع يحافظ على مجال العدّ والاحتساب، ولا يحسم بمفرده كيفية هذا الاحتساب أو يضيف مضمونًا عقديًا غير مصرح به في الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم الاقتباس المباشر مع النقطتين لتوضيح أن «حُسِب له» هو مضمون العبارة المكتوبة، مع إبقاء الآية مفتوحة نحويًا على ما يليها كما في المصدر.
