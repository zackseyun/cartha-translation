base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: ar
  text: فكيف إذن حُسِبَ له ذلك؟ أَحين كان مختونًا[a] أم حين كان غير مختون؟ لم يُحسَب له ذلك وهو مختون، بل وهو غير مختون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اعتُبر له» أو «احتُسب له»، بدلًا من «حُسِبَ له».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: فكيف
  rationale: تنقل أداة الاستفهام مع القوة الاستنتاجية أو الاستئنافية لـοὖν بصورة عربية طبيعية في سياق الحجة.
- source_word: ἐλογίσθη
  choice: حُسِبَ له ذلك
  rationale: صيغة المبني للمجهول تحفظ معنى الاعتبار أو الاحتساب في سياق رومية 4، ويعود اسم الإشارة إلى الأمر المذكور في السياق السابق من غير أن يحدد ما أبهمه النص هنا.
- source_word: ἐν περιτομῇ ὄντι
  choice: حين كان مختونًا
  rationale: تؤدي تركيب الاسم مع اسم الفاعل بوصفه حالة زمنية، بصياغة عربية واضحة وغير حرفية على نحو متكلف.
- source_word: ἐν ἀκροβυστίᾳ
  choice: حين كان غير مختون
  rationale: المقصود هنا حالة عدم الختان؛ والصياغة الوصفية تقابل «مختونًا» بوضوح وتحافظ على البعد الزمني المستفاد من السؤال.
- source_word: οὐκ ... ἀλλ’
  choice: لم يكن ... بل ...
  rationale: تحفظ المقابلة التصحيحية المؤكدة في اليونانية، مع إضمار فعل الاحتساب في الجواب كما يسمح به السياق العربي.
theological_decisions: []
