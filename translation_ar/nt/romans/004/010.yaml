  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت الصياغة الزمنية «حين كان» لإبراز أن السؤال يتعلق بحالة إبراهيم وقت الاحتساب، مع الحفاظ على الإيجاز والمقابلة البلاغية في الأصل.
