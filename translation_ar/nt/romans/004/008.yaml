  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: ar
  text: طُوبَى لِلرَّجُلِ الَّذِي لَنْ يَحْسِبَ الرَّبُّ عَلَيْهِ خَطِيئَةً أَبَدًا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طوبى للشخص»؛ فكلمة «الرجل» هنا ذات دلالة تمثيلية عامة، وليست مقصورة على الذكور.
    reason: lexical_alternative
  - marker: b
    text: أو «لن يحسب الرب عليه خطيئةً بأي حال».
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: طُوبَى
  rationale: تحافظ «طوبى» على معنى البركة الإلهية وثقلها الكتابي، ولا تختزلها في شعور ذاتي بالسعادة.
- source_word: ἀνήρ
  choice: الرجل
  rationale: تحافظ على المفرد المذكر الوارد في اليونانية، وهو هنا ذو دلالة تمثيلية عامة لا تقتصر على الذكور.
- source_word: οὗ
  choice: الذي ... عليه
  rationale: ينقل تركيب الإضافة الموصولية في صياغة عربية طبيعية مع فعل «يحسب عليه».
- source_word: οὐ μὴ
  choice: لن ... أبدًا
  rationale: ينقل النفي اليوناني المؤكد بصياغة عربية واضحة تفيد انتفاء الفعل انتفاءً قاطعًا.
- source_word: λογίσηται
  choice: يحسب
  rationale: يحافظ على صورة الحساب المحورية في سياق رومية 4 من غير إدخال مصطلح لاهوتي تقني زائد.
- source_word: κύριος
  choice: الرَّبّ
  rationale: هو المقابل الكتابي المألوف، ويلائم سياق الاقتباس من الأسفار المقدسة.
- source_word: ἁμαρτίαν
  choice: خطيئةً
  rationale: يحافظ على صيغة المفرد في النص اليوناني وعلى المعنى المباشر للكلمة.
theological_decisions:
- issue: صيغة المذكر التمثيلية
  choice: إبقاء «الرجل» في المتن مع بيان دلالتها العامة في الحاشية.
  alternative: الشخص
  rationale: النص اليوناني يستعمل مفردًا مذكرًا، لكن المقصود حكمي وتمثيلي وليس حصر البركة في الذكور.
- issue: قوة النفي
  choice: لن ... أبدًا
  alternative: لن يحسب عليه خطيئةً بأي حال
  rationale: يحفظ الاختيار قوة οὐ μὴ من دون تحويل العبارة إلى تقرير تقني يتجاوز صيغة النص.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعملت «طوبى» لصداها الكتابي، وجاء تركيب «يحسب ... عليه» طبيعيًا في العربية ومحافظًا على استعارة الحساب.
