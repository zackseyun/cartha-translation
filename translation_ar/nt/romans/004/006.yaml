lexical_decisions:
- source_word: καθάπερ
  choice: كما
  rationale: تُدخل مقارنة بما سبق في الحجة، و«كما» صياغة عربية طبيعية ودقيقة.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد إضافة شهادة داود إلى الحجة السابقة.
- source_word: λέγει
  choice: يتحدث عن
  rationale: يلائم المفعول «غبطة» ويحافظ على المضارع في صيغة الاستشهاد.
- source_word: μακαρισμόν
  choice: غبطة
  rationale: تنقل معنى حال السعادة والهناء الناشئة من نيل رضى الله، وتحافظ على الصيغة الاسمية المجرّدة.
- source_word: ἀνθρώπου
  choice: الإنسان
  rationale: اللفظ اليوناني مفرد ذو دلالة تمثيلية عامة، و«الإنسان» في العربية يشمل الشخص دون قصر المعنى على الذكور.
- source_word: λογίζεται
  choice: يحسب له
  rationale: يحفظ استعارة الحساب والإسناد، وهو تعبير عربي واضح غير مثقل بمصطلح لاهوتي تقني.
- source_word: δικαιοσύνην
  choice: البرّ
  rationale: «البرّ» المقابل العربي الكتابي المألوف في السياق البولسي، ويحفظ البعد العلاقي والقضائي للمصطلح.
- source_word: χωρὶς ἔργων
  choice: بمعزل عن الأعمال
  rationale: يعبّر بوضوح عن انفصال احتساب البر عن الأعمال أساسًا له، دون أن يضيف تحديدًا غير موجود في النص.
theological_decisions:
- issue: الدلالة التمثيلية للمفرد ἀνθρώπου
  choice: الإنسان
  alternative: الرجل
  rationale: السياق عام وتمثيلي، ولفظ «الإنسان» يحفظ المفرد وشمول المقصود بصورة طبيعية في العربية.
- issue: دلالة δικαιοσύνη في السياق البولسي
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» هو التعبير العربي الأرسخ لهذا الاستعمال، مع إبقاء «العدل» احتمالًا معجميًا في الحاشية وعدم اختزال المجال الدلالي.
- issue: العلاقة بين البر والأعمال
  choice: بمعزل عن الأعمال
  alternative: من دون أعمال
  rationale: تحفظ الصياغة التباين الذي يقيمه بولس، من غير أن تشرح على نحو زائد ماهية الأعمال أو طبيعة الاحتساب.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُعمل «غبطة» للمحافظة على الاسم المجرّد، و«يحسب له» لنقل الصورة الحسابية بصورة مفهومة. جميع علامات الحواشي الواردة مثبتة في المتن.
