base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: ar
  text: فماذا نقول إذًا إن إبراهيم، سلفنا بحسب الجسد[a]، قد وجد؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أبانا بحسب الجسد».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا وصل «بحسب الجسد» بالفعل «وجد»، فيكون المعنى: «فماذا نقول إذًا إن إبراهيم قد وجد بحسب الجسد؟» أي بوسائل بشرية أو من منظور بشري محض.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: فماذا نقول إذًا
  rationale: يحفظ الانتقال الاستدلالي والسؤال البلاغي بصياغة عربية طبيعية وواضحة.
- source_word: εὑρηκέναι
  choice: قد وجد
  rationale: ينقل دلالة المصدر التام على نتيجة توصّل إليها إبراهيم، من غير إضافة تفسير مثل «اكتشف» أو «نال».
- source_word: προπάτορα
  choice: أبانا الأول
  rationale: يعبّر عن السلف الأبوي البعيد ويحفظ صيغة المفرد المذكر ودور إبراهيم الأبوي في سياق الحجة، مع بيان البديل الأسلس في الحاشية.
- source_word: ἡμῶν
  choice: نا في «أبانا»
  rationale: يحفظ انتساب المتكلم ومن يشملهم كلامه إلى إبراهيم صراحة.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: يحافظ على العبارة البولسية وعلى إمكان التباس نطاقها، والمقصود في القراءة الأساسية صلة النسب الجسدي لا الطبيعة الخاطئة.
theological_decisions:
- issue: نطاق عبارة κατὰ σάρκα
  choice: جُعلت العبارة وصفًا لعلاقة إبراهيم بمن سماه بولس «أبانا الأول»، أي من جهة النسب الجسدي.
  alternative: 'يمكن وصلها بالفعل «وجد»، فيكون المعنى: ماذا وجد إبراهيم بحسب الجسد، أي بوسائل بشرية أو من منظور بشري محض؟'
  rationale: تركيب البدل «إبراهيم، أبانا الأول» يسمح طبيعيًا بأن تقيد العبارة صلة النسب، وهذا يلائم سياق الحديث عن الهوية والنسب؛ لكن اليونانية تحتمل وصلها بالفعل، ولذلك لم تُحذف القراءة الأخرى بل ذُكرت في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة ذات نبرة كتابية كريمة. استُخدمت الفواصل لإظهار «أبانا الأول بحسب الجسد» بوصفها عبارة بدل تشرح إبراهيم، من غير إخفاء الاحتمال النحوي الآخر، وقد وُضع في الحاشية.
