  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: ar
  text: فماذا يقول الكتاب؟ «آمن إبراهيم بالله، فحُسِبَ[a] له ذلك برًّا[b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فعُدَّ له ذلك برًّا»، أو: «فقُيِّد له ذلك برًّا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عدلًا» بدل «برًّا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: الكتاب
  rationale: أداة التعريف والسياق الاستشهادي يدلان على الكتاب المقدس بوصفه نصًّا ذا سلطان؛ و«الكتاب» تعبير عربي مألوف وموجز.
- source_word: Ἐπίστευσεν
  choice: آمن
  rationale: ينقل الفعل الماضي مباشرة من غير إضافة تفسيرية مثل «وضع ثقته».
- source_word: τῷ θεῷ
  choice: بالله
  rationale: الباء مع «آمن» هي الصياغة العربية الطبيعية لهذه البنية، ويمكن أن تفيد تصديق الله والثقة به من غير تحويلها إلى عبارة وجودية مجردة.
- source_word: ἐλογίσθη
  choice: فحُسِبَ
  rationale: يحفظ المبني للمجهول والدلالة التقديرية للفعل، وهو تعبير عربي واضح في هذا السياق.
- source_word: αὐτῷ
  choice: له
  rationale: يحفظ دلالة المستفيد في الضمير اليوناني.
- source_word: εἰς δικαιοσύνην
  choice: برًّا
  rationale: «برًّا» المقابل العربي الموجز والمألوف لـ δικαιοσύνη في سياق بولس، مع إبقاء «عدلًا» بديلًا معجميًّا في الحاشية.
theological_decisions:
- issue: دلالة δικαιοσύνη في سياق التبرير عند بولس
  choice: برًّا
  alternative: عدلًا
  rationale: يحفظ «البر» المجال الدلالي الأخلاقي والعهدي والقضائي من غير حصره في مفهوم العدالة وحده؛ ومع ذلك يبقى «العدل» بديلًا معجميًّا مشروعًا.
- issue: مرجع الفاعل المستتر في ἐλογίσθη
  choice: له ذلك
  alternative: فحُسب إيمانه له
  rationale: اليونانية لا تصرّح باسم الشيء المحسوب؛ وإضافة «ذلك» توضح العربية مع إبقاء المرجع قريبًا من فعل الإيمان، بدل الجزم تفسيريًّا بأن الاسم المحذوف هو «إيمانه».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. وُضع الاقتباس بين علامتي تنصيص، واستُخدمت الفاء في «فحُسب» لنقل καί طبيعيًّا في العربية مع إبراز نتيجة الإيمان. ظهرت علامتا الحاشية [a] و[b] في المتن.
