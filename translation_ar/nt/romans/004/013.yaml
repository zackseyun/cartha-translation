base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: ar
  text: فإن الوعد لإبراهيم أو لنسله[a] بأن يكون هو وارثًا للعالم لم يأتِ عن طريق الشريعة، بل عن طريق برّ الإيمان.[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «النسل» في اليونانية مفرد، لكنه قد يُستعمل للدلالة الجماعية على الذرية أو المتحدرين.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «برّ الإيمان»: «البرّ الذي يأتي بالإيمان» أو «البرّ القائم على الإيمان».'
    reason: alternative_reading
  - marker: c
    text: يمكن أيضًا ترجمة «البرّ» بـ«العدالة» في بعض السياقات البولسية.
    reason: lexical_alternative
  - marker: d
    text: يمكن أن تحمل الكلمة المترجمة «الإيمان» أيضًا معنى «الثقة» أو «الأمانة»، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: الوعد
  rationale: اللفظ يدل هنا على وعد إلهي، و«الوعد» هو المقابل العربي الطبيعي الذي يحفظ دلالته في سياق بولس.
- source_word: σπέρματι
  choice: نسله
  rationale: الاسم اليوناني مفرد ويمكن أن يُستعمل استعمالًا جمعيًّا؛ و«نسله» يحفظ هذه السمة ويجري طبيعيًّا في العربية.
- source_word: κληρονόμον ... κόσμου
  choice: وارثًا للعالم
  rationale: يحفظ لغة الميراث واتساع دلالة κόσμος من غير تضييق المقصود.
- source_word: διὰ νόμου
  choice: عن طريق الشريعة
  rationale: يعبّر عن الوسيلة بوضوح، و«الشريعة» تلائم الإشارة إلى الناموس في حجة بولس، ولا سيما شريعة موسى.
- source_word: δικαιοσύνης
  choice: برّ
  rationale: «البرّ» هو المقابل الكتابي العربي المألوف، ويحفظ الأبعاد الأخلاقية والقضائية والعلائقية للمصطلح في بولس.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المعنى الأرجح في مقابلة الشريعة هنا، مع إبقاء احتمالي «الثقة» و«الأمانة» في الحاشية.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: عن طريق برّ الإيمان
  rationale: يحفظ التركيب الإضافي المكثف في اليونانية ولا يحسم نوع العلاقة بين البر والإيمان بتفسير زائد.
theological_decisions:
- issue: العلاقة في تركيب δικαιοσύνης πίστεως
  choice: برّ الإيمان
  alternative: البرّ الذي يأتي بالإيمان؛ البرّ القائم على الإيمان
  rationale: التركيب اليوناني موجز ويحتمل أكثر من تحديد للعلاقة. تحافظ الإضافة العربية على هذا الإيجاز والتوتر اللاهوتي بدل حسمه في صياغة تفسيرية.
- issue: مرجع «أن يكون وارثًا للعالم»
  choice: إبقاء الضمير مفردًا كما في المصدر، بما يرجّح عوده إلى إبراهيم من غير شرح داخل المتن
  alternative: أن يرث إبراهيم ونسله العالم
  rationale: المصدر يستعمل ضميرًا مفردًا، والتوسيع ليشمل الطرفين صراحةً يحسم ما لم يصرّح به التركيب.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «الشريعة» بدل «الناموس» لسهولة الفهم المعاصر، و«برّ» للمحافظة على المصطلح البولسي المألوف. وُضعت علامات الحواشي بعد الجملة لئلا تقطع انسياب التركيب.
