  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: ar
  text: الذي أُسلِم بسبب تعدياتنا، وأُقيم لأجل تبريرنا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب تبريرنا».'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا التعبير عن «التبرير» بـ«الحكم ببراءتنا» أو «إعلاننا أبرارًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: أُسلِم
  rationale: يحافظ المبني للمجهول على صيغة اليونانية وما قد تنطوي عليه من فاعل إلهي مفهوم ضمنًا، و«أُسلِم» تعبير عربي كتابي واضح لا يصرّح بمن أسلمه.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: بسبب زلّاتنا
  rationale: διά مع النصب هنا سببية على الأرجح؛ لذلك تنقل «بسبب» العلاقة بوضوح.
- source_word: παραπτώματα
  choice: زلّات
  rationale: تنقل معنى الانحرافات والتعديات الأخلاقية دون تعميمها إلى لفظ «الخطايا» الأوسع دلالة.
- source_word: ἠγέρθη
  choice: أُقيم
  rationale: صيغة مبنية للمجهول موجزة تحافظ على الفعل اليوناني وعلى الإيحاء بأن الله هو الذي أقامه.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: لأجل تبريرنا
  rationale: يحمل «لأجل» المعنى الغائي أو المرتبط بالنتيجة، مع إبقاء القراءة السببية الممكنة في الحاشية.
- source_word: δικαίωσιν
  choice: تبرير
  rationale: هو المقابل العربي الاصطلاحي الأدق في هذا السياق البولسي، ويحفظ القوة القضائية للخلاص، مع توضيحه ببدائل مفهومية في الحاشية.
theological_decisions:
- issue: هل تعني διὰ τὴν δικαίωσιν ἡμῶν الغاية أو النتيجة، أم السبب؟
  choice: لأجل تبريرنا
  alternative: بسبب تبريرنا
  rationale: القراءة الغائية أو المرتبطة بالنتيجة تلائم موازاة تسليم المسيح وإقامته بعلاقتها بخلاص المؤمنين، من غير إنكار أن الصياغة اليونانية تحتمل القراءة السببية؛ ولذلك حُفظت في حاشية.
translation_notes:
  register: العربية فصحى حديثة، واضحة ووقورة. حُفظ التوازي بين «أُسلِم» و«أُقيم»، كما حُفظ المبني للمجهول في الفعلين دون تعيين الفاعل صراحة. استُعمل «لأجل» كي لا تُحسم دلالة العبارة بأكثر مما يسمح به السياق، مع توثيق البديل السببي.
