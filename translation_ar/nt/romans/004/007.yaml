  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: ar
  text: طُوبَى لِلَّذِينَ غُفِرَتْ آثَامُهُمْ[a]، وَسُتِرَتْ خَطَايَاهُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غُفِرَتْ تعدّياتهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: طُوبَى لِلَّذِينَ
  rationale: صيغة عربية كتابية فصيحة وطبيعية تعبّر عن إعلان الغبطة والبركة الإلهية، لا عن مجرد شعور ذاتي بالسعادة.
- source_word: ἀφέθησαν
  choice: غُفِرَتْ
  rationale: المبني للمجهول يحفظ كون الغفران واقعًا على الآثام، ويؤدي معنى الصفح والإعفاء بإيجاز طبيعي.
- source_word: ἀνομίαι
  choice: آثَام
  rationale: تدل «آثام» على الذنوب والتعديات، وتحافظ على تمييز اللفظة عن «خطايا» في الشطر الثاني؛ وتوضح الحاشية البديل الأقرب إلى عنصر مخالفة الشريعة.
- source_word: ἐπεκαλύφθησαν
  choice: سُتِرَتْ
  rationale: يحفظ الفعل صورة الستر الواردة في اقتباس المزمور بدل تفسيرها أو تسويتها بمعنى الغفران.
- source_word: ἁμαρτίαι
  choice: خَطَايَا
  rationale: المقابل العربي القياسي الواضح، مع إبقائه متميزًا عن «آثام» في التوازي الشعري.
theological_decisions:
- issue: العلاقة بين ἀνομίαι وἁμαρτίαι
  choice: 'إبقاء اللفظين متميزين: «آثام» و«خطايا»'
  alternative: ترجمة كليهما بلفظ عام واحد، مثل «خطايا»
  rationale: يحافظ ذلك على التوازي الشعري وعلى وجود لفظين يونانيين متقاربين غير متطابقين، من دون افتراض فرق عقائدي حاد بينهما.
- issue: استعارة ستر الخطايا
  choice: الحفاظ على «سُتِرَتْ»
  alternative: تفسيرها بـ«غُفِرَتْ» أو «مُحِيَتْ»
  rationale: النص يضع الغفران والستر في توازٍ، والحفاظ على الصورة يصون لغة المزمور والتوتر الدلالي فيها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت صيغة «طوبى» المألوفة في التطويبات، مع الحفاظ على التوازي والإيجاز في الأصل اليوناني.
