    text: 'أو: «لم يشكّ بسبب عدم الإيمان».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تقوّى بالإيمان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: أمّا وعدُ الله
  rationale: تؤدي «أمّا» معنى الانتقال مع المقابلة الذي تحمله δέ، وتجعل وعد الله جهة الكلام كما تفيد εἰς هنا، بصياغة عربية طبيعية موجزة.
- source_word: οὐ διεκρίθη
  choice: فلم يتزعزع
  rationale: يدل الفعل في هذا السياق على التردد والانقسام الداخلي، و«يتزعزع» يحفظ هذا المعنى الأوسع من مجرد الشك الذهني.
- source_word: τῇ ἀπιστίᾳ
  choice: بسبب عدم الإيمان
  rationale: تحتمل صيغة المجرور اليونانية معنى السبب أو الوسيلة؛ واختيار «بسبب» واضح ولا يحوّل ἀπιστία إلى مجرد ضعف عابر في الإيمان.
- source_word: ἐνεδυναμώθη
  choice: تقوّى
  rationale: صيغة «تقوّى» عربية طبيعية وتحفظ معنى اكتساب القوة في المبني للمجهول دون تعيين الفاعل صراحة.
- source_word: τῇ πίστει
  choice: في الإيمان
  rationale: يحفظ هذا الاختيار معنى المجال أو الحال، مع إبقاء احتمال الدلالة الوسيلية في الحاشية.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: وأعطى المجد لله
  rationale: العطف بالفعل الماضي يعبّر عربيًا بسلاسة عن الحال المصاحبة التي يؤديها اسم الفاعل اليوناني، من غير حسم دقيق للعلاقة الزمنية أو السببية.
theological_decisions:
- issue: هل يدل موقف إبراهيم على مجرد شك ذهني أم على تزعزع أوسع أمام وعد الله؟
  choice: فلم يتزعزع بسبب عدم الإيمان
  alternative: لم يشكّ لعدم إيمانه
  rationale: «يتزعزع» يعكس دلالة διακρίνω السياقية على التردد أو الانقسام الداخلي، ويحفظ المقابلة مع تقوّيه في الإيمان دون اختزال القضية في نشاط ذهني محض.
- issue: هل الإيمان هو مجال التقوّي أم وسيلته؟
  choice: تقوّى في الإيمان
  alternative: تقوّى بالإيمان
  rationale: صيغة المجرور تحتمل الحال أو المجال كما تحتمل الوسيلة؛ أُبقي «في الإيمان» في المتن للموازاة المفهومية، ووُضع الاحتمال الوسيلي في الحاشية دون حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «أمّا» لافتتاح جهة المقابلة بصورة طبيعية، وحُفظت بدائل دلالة صيغتي المجرور في الحاشيتين.
