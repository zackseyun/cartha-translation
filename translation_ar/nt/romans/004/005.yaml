  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: ar
  text: أَمَّا مَنْ لَا يَعْمَلُ، بَلْ يُؤْمِنُ[a] بِالَّذِي يُبَرِّرُ[b] الْفَاجِرَ، يُحْسَبُ[c] إِيمَانُهُ بِرًّا[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يَتَّكِلُ عَلَى».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يُعْلِنُ بَارًّا».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يُقَيَّدُ» أو «يُعَدُّ».'
    reason: lexical_alternative
  - marker: d
    text: يمكن أن تُترجم الكلمة اليونانية أيضًا «العدالة» بحسب السياق؛ و«البر» هو الأنسب هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: مَنْ لَا يَعْمَلُ
  rationale: ينقل اسم الفاعل المستعمل استعمال الاسم مع النفي، ويحافظ على المقابلة بين عدم العمل والإيمان من غير أن يضيف إلى النص تحديدًا لطبيعة العمل.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: بَلْ يُؤْمِنُ بِـ
  rationale: صياغة عربية طبيعية للإيمان الموجَّه إلى شخص، وتحفظ الصلة اللفظية بين الفعل «يؤمن» والاسم «إيمان» في الجملة نفسها، مع بقاء معنى الاتكال حاضرًا في التركيب.
- source_word: τὸν δικαιοῦντα
  choice: الَّذِي يُبَرِّرُ
  rationale: يحفظ المصطلح البولسي المحوري وصلته الدلالية بـ«البر»، من غير حصر الفعل في تفسير لاهوتي مذهبي واحد.
- source_word: τὸν ἀσεβῆ
  choice: الْفَاجِرَ
  rationale: «الفاجر» لفظ عربي موجز يدل على من لا يتقي الله ويوافق قوة ἀσεβής في السياق، من غير قصره على نوع بعينه من الشر.
- source_word: λογίζεται
  choice: يُحْسَبُ
  rationale: ينقل استعارة الحساب والتقدير بعبارة عربية واضحة، ويلائم استعمال الفعل نفسه في سياق اقتباس تكوين 15:6 ضمن حجة بولس.
- source_word: ἡ πίστις αὐτοῦ
  choice: إِيمَانُهُ
  rationale: يحافظ على الصلة المباشرة بالفعل «يؤمن»؛ والسياق يرجّح فعل الإيمان أو موقف الاتكال، لا معنى الأمانة.
- source_word: εἰς δικαιοσύνην
  choice: بِرًّا
  rationale: يؤدي التركيب الاصطلاحي مع λογίζεται بمعنى أن الإيمان يُعَدّ برًّا، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: دلالة δικαιοῦντα في سياق بولسي لاهوتي
  choice: يُبَرِّرُ
  alternative: يُعْلِنُ بَارًّا
  rationale: «يبرّر» يحفظ المصطلح اللاهوتي وصلته بـ«البر»، لكنه لا يحسم وحده جميع الأسئلة المتعلقة بكيفية التبرير؛ لذلك ذُكر البديل التفسيري في الحاشية.
- issue: دلالة πίστις وπιστεύω
  choice: يُؤْمِنُ / إِيمَانُهُ
  alternative: يَتَّكِلُ / اتِّكَالُهُ
  rationale: يحفظ الاختيار وحدة الجذر الاصطلاحي في العربية ويوافق التقابل المباشر بين الفعل والاسم في اليونانية، بينما توضّح الحاشية أن التركيب يتضمن معنى الاتكال.
- issue: العلاقة بين الإيمان والبر في λογίζεται ... εἰς δικαιοσύνην
  choice: فَيُحْسَبُ إِيمَانُهُ بِرًّا
  alternative: فَيُقَيَّدُ إِيمَانُهُ لَهُ بَرًّا
  rationale: الترجمة المختارة واضحة وتحفظ لغة الحساب من غير أن تضيف آلية لاهوتية غير مصرّح بها، كما لا تحسم ما إذا كان التركيز على إعلان قضائي أو تقدير حسابي أو غير ذلك من ظلال السياق.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «أمّا ... فـ» لإظهار بنية المقابلة والنتيجة، وحُفظت المصطلحات المترابطة «يؤمن/إيمان» و«يبرّر/بر» قدر الإمكان.
