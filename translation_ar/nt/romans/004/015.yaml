base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: ar
  text: لِأَنَّ الشَّرِيعَةَ[a] تَجْلِبُ الْغَضَبَ، أَمَّا حَيْثُ لَا شَرِيعَةَ، وَلَا تَعَدٍّ أَيْضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الناموس».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «مخالفة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: الشريعة
  rationale: اختيرت «الشريعة» لأنها تنقل معنى القاعدة أو الأمر الملزم من غير أن تحصر اللفظ صراحةً في شريعة موسى، مع إبقاء هذا المعنى حاضرًا في سياق رسالة رومية.
- source_word: ὀργή
  choice: الغضب
  rationale: يحفظ «الغضب» الثقل القضائي واللاهوتي المحتمل في الاستعمال البولسي من غير إضافة «غضب الله»، وهي إضافة لا يصرّح بها النص هنا.
- source_word: κατεργάζεται
  choice: تجلب
  rationale: «تجلب» تعبير عربي طبيعي يؤدي المعنى السببي للفعل، أي إن الشريعة تُحدث الغضب أو تؤدي إليه، من غير إيحاء بأن الشريعة نفسها غضب.
- source_word: οὗ δὲ
  choice: أما حيث
  rationale: ينقل هذا التركيب الدلالة المكانية مع قوة δέ التقابلية الخفيفة بين أثر الشريعة والحالة التي لا توجد فيها شريعة.
- source_word: παράβασις
  choice: تعدٍّ
  rationale: يدل «التعدي» على تجاوز حد أو مخالفة أمر معلوم، وهو أدق من لفظ عام مثل «خطيئة» في حجة بولس هنا.
theological_decisions:
- issue: مدى دلالة νόμος في حجة بولس
  choice: الشريعة
  alternative: الناموس، أي شريعة موسى على وجه التحديد
  rationale: تُبقي الصياغة المبدأ عامًا ولا تحسم أن المقصود حصريًا هو شريعة موسى، مع أن السياق اليهودي والشريعة الموسوية يظلان جزءًا من خلفية الحجة.
- issue: هوية صاحب الغضب في ὀργή
  choice: الغضب من غير تعيين صاحبه
  alternative: غضب الله
  rationale: لا يذكر النص اليوناني مضافًا إليه، ولذلك تُحفظ إمكانية فهمه بوصفه غضبًا إلهيًا قضائيًا من غير إدخال هذا التفسير في المتن.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموجزة، تحافظ على التوازي بين ورودَي νόμος وعلى النبرة الاستدلالية في الآية. استُعمل «أما» لإظهار التقابل، وتُرك «الغضب» بلا إضافة حفاظًا على إيجاز الأصل واحتماله الدلالي.
