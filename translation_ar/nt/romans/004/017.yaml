  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: ar
  text: 'كما هو مكتوب: «قد جعلتُك أبًا لأمم كثيرة»[b]—أمام الله الذي آمن به، الذي يحيي الموتى ويدعو ما ليس موجودًا كأنه موجود.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة تفسيرية أكثر: «ويدعو إلى الوجود ما لا وجود له».'
    reason: alternative_reading
  - marker: b
    text: يمكن أن تعني «أمم» هنا أيضًا «غير اليهود»، لكن المعنى الأوسع، أي الشعوب أو الأمم، هو الأرجح في هذا الاقتباس من سفر التكوين.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: 'صيغة عربية مألوفة للاستشهاد بالكتاب، وتحافظ على معنى الفعل التام المبني للمجهول: ما كُتب وما زال ثابتًا.'
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: أبًا لأمم كثيرة
  rationale: ينقل المعنى العام في اقتباس التكوين، حيث تشير ἐθνῶν إلى أمم أو شعوب كثيرة، لا إلى غير اليهود على وجه التخصيص.
- source_word: τέθεικά σε
  choice: قد جعلتُك
  rationale: «قد» مع الماضي تنقل بصورة طبيعية دلالة التمام والنتيجة المستمرة في الوعد المقتبس.
- source_word: κατέναντι
  choice: أمام
  rationale: تعبير موجز وطبيعي يحفظ معنى الحضور أو الوقوف إزاء الله.
- source_word: οὗ ἐπίστευσεν
  choice: الذي آمن به
  rationale: الصياغة العربية الطبيعية للإيمان الموجَّه إلى شخص، مع إبقاء مرجع الفعل إلى إبراهيم واضحًا من السياق.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: الذي يحيي الموتى
  rationale: صياغة عربية مباشرة تحفظ وصف الله بأنه واهب الحياة للموتى.
- source_word: καλοῦντος
  choice: يدعو
  rationale: يحافظ على اللفظ الأساسي المضغوط في اليونانية بدل إدخال تفسير «يوجد» في صلب النص.
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: ما ليس موجودًا كأنه موجود
  rationale: ترجمة قريبة من التركيب اليوناني تحفظ انفتاح العبارة ولا تحسمها في صياغة صريحة عن الإيجاد من العدم.
theological_decisions:
- issue: هل تُفسَّر العبارة الأخيرة صراحةً على أنها إيجاد ما لا وجود له، أم تُترك بصيغتها الأوسع والأقرب إلى النص؟
  choice: ويدعو ما ليس موجودًا كأنه موجود
  alternative: ويدعو إلى الوجود ما لا وجود له
  rationale: تحتمل العبارة اليونانية الإشارة إلى قدرة الله الخالقة، لكنها موجزة ويمكن فهمها بأكثر من وجه؛ لذلك يحفظ المتن التوتر الدلالي، ويورد التفسير الأصرح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أمام الله» بدل تعبير أطول، وحُفظت العبارة الختامية في صياغة قريبة من الأصل مع بيان القراءة التفسيرية في الحاشية. وُضعت علامتا الحاشيتين بعد الجملة التي تتصلان بتفاصيلها الدلالية.
