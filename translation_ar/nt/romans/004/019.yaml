  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: ar
  text: ومن غير أن يضعف في الإيمان، تأمّل جسده الذي صار كالميت[a]، إذ كان عمره نحو مئة سنة، وموات رحم سارة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وفي تقليد نصي آخر: «لم يتأمّل جسده الذي صار كالميت».'
    reason: textual_variant
  - marker: b
    text: 'أو: «عُقم رحم سارة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: يضعف
  rationale: 'صيغة فعلية طبيعية تحفظ معنى اسم الفاعل اليوناني المنفي: لم تفتر قوة إيمان إبراهيم أمام الواقع الجسدي.'
- source_word: πίστει
  choice: في الإيمان
  rationale: المقصود ثقة إبراهيم بوعد الله، و«الإيمان» هو المقابل العربي الواضح والمألوف في هذا السياق.
- source_word: κατενόησεν
  choice: تأمّل
  rationale: ينقل معنى توجيه الذهن إلى الواقع والنظر فيه بوعي، من غير أن يوحي بأن إبراهيم تجاهله أو شكّ في الوعد.
- source_word: νενεκρωμένον
  choice: الذي صار كالميت
  rationale: يحفظ صورة الموت مع بيان أن المقصود عجز الجسد عن الإنجاب، لا موت إبراهيم الجسدي حرفيًا؛ كما تعكس «صار» الحالة الناتجة التي تفيدها صيغة التمام.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: إذ كان عمره نحو مئة سنة
  rationale: «نحو» تنقل التقريب في πού، والصياغة السببية توضح صلة عمره بوصف جسده بأنه صار كالميت.
- source_word: νέκρωσιν
  choice: موت
  rationale: يحفظ لفظ الموت المقصود في الأصل والتوازي مع جسد إبراهيم الذي صار كالميت، بدل استبداله مباشرة بتفسير طبي.
- source_word: μήτρας Σάρρας
  choice: رحم سارة
  rationale: تعبير عربي طبيعي يحفظ الصورة الجسدية الملموسة في العبارة اليونانية.
theological_decisions:
- issue: هل تُلطَّف صورة الموت الإنجابي إلى تعبير تفسيري مثل العقم؟
  choice: الإبقاء على صورة الموت في «صار كالميت» و«موت رحم سارة»
  alternative: عجز جسد إبراهيم عن الإنجاب وعقم سارة
  rationale: يقرن بولس عمدًا بين جسد إبراهيم ورحم سارة بألفاظ الموت، ليبرز استحالة الإنجاب بشريًا في مقابل وعد الله؛ لذلك ينبغي ألا تُزال هذه الحدة اللاهوتية بالتفسير داخل المتن.
- issue: القراءة النصية في وجود أداة نفي قبل «تأمّل»
  choice: 'اتباع نص SBLGNT من دون النفي: «تأمّل جسده»'
  alternative: «لم يتأمّل جسده»
  rationale: النص الأساس المعطى يثبت الفعل بلا أداة نفي، لكن القراءة الأخرى ذات أثر واضح في المعنى، ولذلك حُفظت في حاشية بدل دمجها أو ترجيحها بصمت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تركيب الجملة وتوازي صورتي الموت بقدر ما تسمح به العربية، مع تجنب الألفاظ الكنسية القديمة أو المصطلحات الطبية الثقيلة. وُضع مؤشرا الحاشيتين في موضعيهما الدلاليين داخل المتن.
