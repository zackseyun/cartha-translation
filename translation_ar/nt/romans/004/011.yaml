id: ROM.4.11
reference: Romans 4:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: ar
  text: وقد نال علامة الختان، ختمًا لبرِّ الإيمان الذي كان له وهو غير مختون، لكي يكون أبًا لجميع الذين يؤمنون وهم غير مختونين، لكي يُحسَب لهم البر أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُنسب إليهم البر» أو «يُقيَّد لهم البر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: علامة
  rationale: لفظ عربي واضح يحفظ معنى الدلالة الظاهرة في السياق العهدي.
- source_word: περιτομή
  choice: الختان
  rationale: المقابل العربي القياسي والدقيق للشعيرة المقصودة في حجة بولس.
- source_word: σφραγίς
  choice: ختم
  rationale: يحفظ استعارة التوثيق والتصديق من غير تحويلها إلى شرح تفسيري.
- source_word: δικαιοσύνη
  choice: البر
  rationale: المقابل العربي الكتابي الطبيعي في هذا السياق البولسي، ويحفظ المجال الدلالي المتصل بالمكانة المستقيمة أمام الله.
- source_word: πίστις
  choice: الإيمان
  rationale: يحفظ المعنى الرئيس هنا، إذ تربط العبارة البر بالإيمان الذي كان لإبراهيم قبل الختان.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: وهو غير مختون
  rationale: صياغة عربية طبيعية توضّح حالة إبراهيم حين كان له الإيمان، بدل النقل الحرفي المتعثر «في الغرلة».
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: أبًا لجميع الذين يؤمنون
  rationale: تعبير عربي سلس يحفظ لغة الأبوة التمثيلية في الحجة.
- source_word: δι’ ἀκροβυστίας
  choice: وهم غير مختونين
  rationale: يفيد حالة المؤمنين لا كون عدم الختان وسيلة للإيمان؛ كما يحافظ على الفرق بين هذه العبارة والعبارة السابقة بصورة طبيعية.
- source_word: λογισθῆναι
  choice: يُحسَب
  rationale: يحفظ صورة الاحتساب في كلام بولس بلفظ عربي واضح، مع إثبات البدائل الممكنة في الحاشية.
- source_word: καί
  choice: أيضًا
  rationale: يمثل اللفظ اليوناني الأخير ويبرز شمول غير المختونين باحتساب البر.
theological_decisions:
- issue: علاقة الختان بالبر
  choice: الختان علامة وختم للبر المرتبط بالإيمان الذي كان لإبراهيم وهو غير مختون، لا وسيلة نال بها البر.
  alternative: قد تُصاغ العبارة بما يوحي بأن الختان يمنح البر أو ينشئه.
  rationale: ترتيب العبارة اليونانية يجعل الختان لاحقًا للإيمان في حال عدم الختان، وتصفه بأنه علامة وختم؛ لذلك تحفظ الصياغة هذا التسلسل من غير إدخال تصور مذهبي لاحق.
- issue: إضافة «كان له» مع الإيمان
  choice: «الإيمان الذي كان له وهو غير مختون» لتوضيح أن العبارة تصف إيمان إبراهيم في تلك الحال.
  alternative: «بر الإيمان في عدم الختان»، وهي أقرب شكليًا لكنها غامضة وثقيلة في العربية.
  rationale: سلسلة الإضافات اليونانية تحتمل نقلًا حرفيًا متعثرًا، والسياق يربط الإيمان بإبراهيم قبل ختانه. الإيضاح لا يغيّر العلاقة الأساسية بين البر والإيمان.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «البر» للمصطلح البولسي δικαιοσύνη، و«ختمًا» لإبقاء الاستعارة. وُضعت علامة الحاشية [a] بعد الجملة التي تتناول فعل الاحتساب.
