  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: ar
  text: وكان على يقين تام بأن ما وعد به، هو[a] قادر أيضًا أن يفعله.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفاعل المضمر في «وعد» و«هو قادر» هو الله، كما يتضح من السياق.
    reason: cross_reference
  - marker: b
    text: 'حرفيًا: «ما وعد به، فهو قادر أيضًا أن يفعله».'
    reason: literal_rendering
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: على يقين تام
  rationale: يدل اسم الفاعل على الاقتناع الكامل واليقين الراسخ؛ وهذه صياغة عربية طبيعية تحفظ قوة اللفظ اليوناني.
- source_word: ὅτι
  choice: بأن
  rationale: تُدخل مضمون يقين إبراهيم بوضوح في التركيب العربي.
- source_word: ὃ
  choice: ما
  rationale: تقابل اسم الموصول اليوناني بصياغة عربية موجزة وطبيعية.
- source_word: ἐπήγγελται
  choice: وعد به
  rationale: يحمل الفعل اليوناني التام معنى وعد صدر ولا يزال قائم الأثر، والسياق العربي يؤدي ذلك من غير إثقال زمني.
- source_word: δυνατός ἐστιν
  choice: قادر
  rationale: تحفظ زمن المضارع في اليونانية ومعنى القدرة المستمرة، ولا تحولها إلى الماضي لمجرد سياق السرد.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد أن الذي وعد قادر أيضًا على تنفيذ ما وعد به.
- source_word: ποιῆσαι
  choice: أن يفعله
  rationale: تحفظ عموم فعل ποιέω، ويعود الضمير طبيعيًا إلى ما وُعد به.
theological_decisions:
- issue: فاعل الوعد والقدرة المضمر
  choice: عدم إدراج اسم «الله» في متن الآية، وإبقاء الفاعل مفهومًا من السياق
  alternative: أن الله قادر أيضًا أن يفعل ما وعد به
  rationale: اليونانية لا تصرح بالفاعل في هذه الآية، مع أن السياق السابق يبين أنه الله؛ لذلك تحافظ الصياغة على الإضمار دون حجب المرجع عن القارئ.
- issue: زمن عبارة δυνατός ἐστιν
  choice: قادر
  alternative: كان قادرًا
  rationale: النص اليوناني يستعمل المضارع «هو قادر»، وقد يحمل تقريرًا مستمرًا عن قدرة الله؛ لذا لا ينبغي تسوية هذا التوتر بتحويله إلى الماضي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «على يقين تام» بدل تعبيرات أقل تداولًا مثل «مقتنع تمامًا»، وحُفظ المضارع الدال على القدرة في الأصل اليوناني. جميع علامات الحواشي ظاهرة في المتن.
