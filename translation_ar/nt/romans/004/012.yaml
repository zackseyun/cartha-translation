  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: ar
  text: وأبًا لأهل الختان[a]، للذين لا يكتفون بكونهم من أهل الختان، بل يسيرون أيضًا على خُطى الإيمان الذي كان لأبينا إبراهيم حين كان غير مختون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أبًا للختان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: أبًا لأهل الختان
  rationale: تفيد العبارة أن إبراهيم أبٌ لجماعة المختونين، لا أنه أبٌ لشعيرة الختان نفسها. صيغت بالعربية صياغة طبيعية، مع إثبات اللفظ الحرفي في الحاشية.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: ليسوا من أهل الختان فحسب
  rationale: تحافظ الصياغة على معنى الانتماء إلى جماعة الختان وعلى القيد «فحسب»، من غير أن تختزل العبارة في مجرد وصف جسدي.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: يسيرون على خُطى
  rationale: تحفظ الصورة الأصلية التي تجمع بين السير والاقتفاء، وهي عبارة عربية واضحة ومألوفة.
- source_word: πίστεως
  choice: الإيمان
  rationale: السياق يتناول إيمان إبراهيم بالله، ولذلك «الإيمان» هو المقابل الأنسب، مع إبقاء مضمون الإيمان مستفادًا من السياق السابق.
- source_word: ἐν ἀκροβυστίᾳ
  choice: حين كان غير مختون
  rationale: تعبّر الصياغة بوضوح عن حال إبراهيم الزمنية قبل ختانه، بدل التعبير الحرفي غير الطبيعي «في الغرلة».
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: الذي كان لأبينا إبراهيم
  rationale: 'تفكّ هذه الصياغة الإضافة اليونانية بصورة عربية واضحة، وتحافظ على اللقب الجماعي المهم في حجة بولس: «أبينا إبراهيم».'
theological_decisions:
- issue: هل أبوة إبراهيم هنا تشمل كل المختونين بلا قيد، أم المختونين الذين يقتفون أثر إيمانه؟
  choice: قُيّدت أبوة إبراهيم لأهل الختان بمن لا يكتفون بالانتماء إلى الختان، بل يسيرون أيضًا على خطى إيمانه.
  alternative: اعتبار إبراهيم أبًا لكل المختونين بلا قيد.
  rationale: تركيب οὐκ ... μόνον ἀλλὰ καὶ والعبارة التابعة στοιχοῦσιν يقيدان الجماعة المذكورة، من غير إضافة تفسير عقائدي يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. حُفظت استعارة السير على الخُطى، وتُجنِّب النص ألفاظًا تراثية غامضة مثل «الغرلة» في المتن، مع إبقاء البنية الجدلية للآية وقيدها على أهل الختان.
