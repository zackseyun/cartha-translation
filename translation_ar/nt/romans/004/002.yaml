review_pass:
  verdict: revise
  source_fidelity: النص يحافظ على بنية الشرط التعليلية وعلى المبني للمجهول في «ἐδικαιώθη»، وينقل «ἐξ ἔργων» و«καύχημα» على نحو سليم. لكن الحاشية المعجمية الخاصة بـ«بُرِّرَ» الواردة في سجل التدقيق الإنجليزي غير ممثلة في المسودة، كما أن خاتمة الجملة تحتاج إلى إظهار مرجع النفي في العربية بوضوح.
  naturalness: «ولكن ليس أمام الله» مفهومة في سياقها، لكنها تبدو ناقصة نحويًا في العربية المعاصرة لأن المنفي غير مذكور. إضافة «له ذلك» تجعل المقابلة واضحة وطبيعية دون زيادة تفسيرية.
  terminology: «بُرِّرَ» مصطلح مناسب يحافظ على اتساع الفعل اليوناني وصيغته المبنية للمجهول. وتُضاف حاشية «أُعلِن بارًّا» بوصفها بديلًا دلاليًا لا تفسيرًا ملزمًا. «ما يفتخر به» مناسب لـ«ἔχει καύχημα».
  issues:
