    rationale: سجل التدقيق الإنجليزي يثبت البديل «was declared righteous»، والقرارات العربية نفسها تشير إلى أن الحاشية تبين هذا البديل، لكن مجموعة الحواشي الحالية لا تحتويه.
  - severity: low
    issue: العبارة «ولكن ليس أمام الله» تحذف مرجع النفي.
    rationale: 'الأصل يتيح الإضمار، لكن العربية الفصحى الحديثة أوضح وأطبع بـ«ولكن ليس له ذلك أمام الله»، مع الإبقاء على المعنى المقصود: لا أساس للافتخار في محضر الله.'
  revised_text: فإن كان إبراهيم قد بُرِّرَ[a] بالأعمال، فله ما يفتخر به[b]، ولكن ليس له ذلك أمام الله.
