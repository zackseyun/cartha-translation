lexical_decisions:
- source_word: εἰ γὰρ
  choice: فإن كان
  rationale: تحفظ «فـ» الصلة التعليلية بما سبق، وتؤدي «إن كان» الشرط كما هو من غير أن تحسم هل هو افتراضي أم واقعي.
- source_word: Ἀβραὰμ
  choice: إبراهيم
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: ἐξ ἔργων
  choice: بالأعمال
  rationale: تعبير عربي موجز وطبيعي يدل هنا على أن الأعمال هي الأساس أو الوسيلة المزعومة للتبرير.
- source_word: ἐδικαιώθη
  choice: بُرِّرَ
  rationale: يحفظ المصطلح البولسي وصيغة المبني للمجهول، مع بيان البديل التفسيري في الحاشية.
- source_word: ἔχει καύχημα
  choice: فله ما يفتخر به
  rationale: صياغة عربية طبيعية تؤدي معنى امتلاك أساس أو مدعاة للافتخار، من غير الإيحاء بأن الافتخار نفسه فضيلة.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: ولكن ليس أمام الله
  rationale: تنقل المقابلة وتؤدي πρὸς θεόν في هذا السياق بوصفه منظور الله أو الوقوف في حضرته، مع إبقاء العبارة موجزة.
theological_decisions:
- issue: هل يصاغ الشرط على أنه واقع أم افتراض مخالف للواقع؟
  choice: «فإن كان إبراهيم قد بُرِّرَ بالأعمال»
  alternative: «فلو كان إبراهيم قد بُرِّرَ بالأعمال»
  rationale: الأصل اليوناني يستعمل شرطًا مباشرًا ولا يصرّح بصيغة مخالفة للواقع؛ لذلك تُحفظ بنية الحجة ولا تُستبق نتيجة بولس.
- issue: الدلالة القضائية أو التحويلية للفعل ἐδικαιώθη
  choice: «بُرِّرَ» في المتن
  alternative: «حُسِبَ بارًّا» أو «أُعلِن بارًّا»
  rationale: «بُرِّرَ» يحفظ اتساع المصطلح اللاهوتي في الأصل ولا يحصره في تفسير واحد، بينما تبيّن الحاشية البديل الدلالي الممكن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. اختيرت صياغة موجزة تحافظ على أسلوب بولس الجدلي وعلى التوتر المقصود بين الشرط ونفي الافتخار أمام الله.
