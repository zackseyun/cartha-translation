  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: ar
  text: فإن كان إبراهيم قد بُرِّرَ[a] بالأعمال، فله ما يفتخر به[b]، ولكن ليس له ذلك أمام الله.
