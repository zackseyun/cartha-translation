id: ROM.4.9
reference: Romans 4:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: ar
  text: 'أفهذا التطويب إذًا للمختونين أم لغير المختونين أيضًا؟ فإننا نقول: «حُسِب إيمانُ إبراهيمَ له برًّا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عدلًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: التطويب
  rationale: يشير إلى إعلان حال السعادة والغبطة الوارد في 4:6–8؛ و«التطويب» يحافظ على معنى التصريح بأن شخصًا مغبوط، بدل أن يوحي بعطية مادية.
- source_word: περιτομή
  choice: المختونين
  rationale: الاسم اليوناني يعني حرفيًا «الختان»، لكنه هنا كناية عن جماعة المختونين، فصيغ بصيغة الأشخاص لوضوح المقابلة.
- source_word: ἀκροβυστία
  choice: غير المختونين
  rationale: يأتي هنا كناية عن الأشخاص الذين لم يُختنوا؛ وهذه الصياغة عربية واضحة وطبيعية.
- source_word: πίστις
  choice: إيمان
  rationale: هو المقابل الأنسب في سياق حجة بولس عن إيمان إبراهيم، من غير توسيع المعنى إلى تفسير عقائدي زائد.
- source_word: ἐλογίσθη
  choice: حُسِب
  rationale: يحفظ الاستعارة الحسابية في الفعل λογίζομαι، وهو تعبير عربي موجز ومألوف في هذا السياق.
- source_word: δικαιοσύνη
  choice: برًّا
  rationale: «البر» هو المقابل الأنسب في سياق مكانة إبراهيم أمام الله، مع إثبات البديل الدلالي «عدلًا» في الحاشية.
- source_word: εἰς δικαιοσύνην
  choice: برًّا
  rationale: ينقل الاصطلاح اليوناني بمعنى أن الإيمان حُسب في منزلة البر أو باعتباره برًّا، من دون شرح لاهوتي مضاف.
theological_decisions:
- issue: العلاقة بين إيمان إبراهيم والبر
  choice: حُسِب إيمانُ إبراهيمَ له برًّا
  alternative: حُسِب إيمانُ إبراهيمَ من أجل البر
  rationale: تحافظ الصياغة على توتر العبارة البولسية واستعارتها الحسابية، ولا تحدد داخل الترجمة نظرية لاهوتية تفصيلية لكيفية الاحتساب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «التطويب» للربط بإعلان الغبطة في السياق السابق، وصيغت «الختان/الغرلة» بصيغة الأشخاص لسلامة العربية ووضوح المقابلة.
