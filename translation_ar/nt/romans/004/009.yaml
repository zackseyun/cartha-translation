  source_fidelity: 'النص العربي أمين لليونانية: يحافظ على السؤال المقابل بين المختونين وغير المختونين، وعلى الاستئناف التفسيري «فإننا نقول»، وعلى صياغة الاقتباس التي تنقل فعل الاحتساب وعلاقته بالبر دون إضافة تفسيرية.'
  naturalness: الصياغة فصيحة واضحة ومناسبة للسجل الكتابي العربي الحديث. «أفهذا ... إذًا» و«حُسب إيمان إبراهيم له برًّا» سليمتان ومألوفتان في هذا المقام.
  terminology: '«التطويب» يطابق μακαρισμός في إحالته إلى إعلان الغبطة السابق، لا إلى عطية بركة عامة. و«المختونين/غير المختونين» يبينان الكناية الجماعية في الأصل. كما أن «الإيمان»، و«حُسب»، و«برًّا» تحفظ المصطلحات والحقل التصويري البولسي. الحاشية «أو: عدلًا» تمثل البديل المعجمي المقرر لـ δικαιοσύνη بوضوح.'
