id: ROM.4.18
reference: Romans 4:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: ar
  text: 'وهو، على خلاف الرجاء[a]، آمن مستندًا إلى الرجاء، لكي يصير أبًا لأمم كثيرة[c]، بحسب ما قيل: «هكذا يكون نسلك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متجاوزًا الرجاء» أو «بعكس ما كان يُرجى».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «بذرك»، مع الحفاظ على الصورة الجمعية المفردة في اليونانية.'
    reason: lexical_alternative
  - marker: c
    text: 'اقتباس من التكوين 15: 5؛ وقارن التكوين 17: 5.'
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: على خلاف الرجاء
  rationale: تنقل العبارة معنى مجاوزة ما يُرجى عادةً أو معارضته، وتحافظ على المفارقة مع العبارة التالية من غير أن تفسرها تفسيرًا زائدًا.
- source_word: ἐπ’ ἐλπίδι
  choice: مستندًا إلى الرجاء
  rationale: توضح أن الرجاء هو الأساس الذي آمن عليه إبراهيم، مع إبقاء المقابلة البلاغية بين الرجاء الذي تنفيه الظروف والرجاء الذي يقوم عليه الإيمان.
- source_word: ἐπίστευσεν
  choice: آمن
  rationale: مقابل عربي مباشر وطبيعي للفعل، ويحافظ على ألفاظ الإيمان في سياق بولس من دون توسع تفسيري.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: لكي يصير
  rationale: تحافظ الصياغة على الدلالة الغائية أو الاستشرافية للتركيب، من غير حسم احتمال النتيجة حسمًا كاملًا.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: أبًا لأمم كثيرة
  rationale: «أمم» تلائم صدى وعد إبراهيم في سفر التكوين، ولا تُدخل هنا على نحو مبكر معنى «الأمم غير اليهودية» بوصفه مقابلة مباشرة لليهود.
- source_word: κατὰ τὸ εἰρημένον
  choice: بحسب ما قيل
  rationale: صياغة عربية موجزة ورصينة تشير إلى القول السابق ذي السلطة المستمرة، وتناسب إدخال الاقتباس الكتابي.
- source_word: Οὕτως ἔσται
  choice: هكذا يكون
  rationale: تحافظ على قوة الوعد وعلى الإيقاع الكتابي بلغة عربية حديثة غير متكلفة.
- source_word: τὸ σπέρμα σου
  choice: نسلك
  rationale: «نسل» طبيعي في العربية الكتابية الحديثة، ويحفظ الصورة الجمعية المفردة في اليونانية أفضل من صيغة «ذريتك» إذا فُهمت على أنها جمع أفراد فحسب.
theological_decisions:
- issue: مدلول «أمم كثيرة» في وعد إبراهيم
  choice: أمم كثيرة
  alternative: شعوب كثيرة؛ أو كثير من غير اليهود
  rationale: السياق يستدعي وعد إبراهيم في سفر التكوين، حيث يدل التعبير على أمم كثيرة تنشأ منه أو يشملها الوعد. أما «غير اليهود» فتستبق مقابلة اليهود والأمم وتضيّق الإطار العهدي للنص.
- issue: العلاقة بين الإيمان والرجاء في العبارة المتوازية
  choice: «على خلاف الرجاء… مستندًا إلى الرجاء»
  alternative: «إذ لم يكن هناك رجاء، آمن راجيًا»
  rationale: يحافظ الاختيار على التوتر المقصود بين انعدام الرجاء بحسب الظروف وقيام الإيمان على الرجاء، من غير تحويل المفارقة إلى شرح لاهوتي قاطع.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ورصينة. حُفظت المفارقة البلاغية بين عبارتي الرجاء، واستُعمل «نسل» لصون الصورة الجمعية من غير غرابة لفظ «بذر» في المتن.
