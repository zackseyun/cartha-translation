source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: ar
  text: فالخطيئة، إذ اتخذت فرصةً عن طريق الوصية[a]، خدعتني، وبها[b] قتلتني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ انتهزت فرصةً بواسطة الوصية».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: بالوصية؛ فالضمير يعود إلى «الوصية».'
    reason: pronoun_reference
lexical_decisions:
- source_word: γὰρ
  choice: فَـ
  rationale: تحافظ الفاء على الصلة التفسيرية بما سبق، وتأتي طبيعية في العربية ضمن سياق الحجة.
- source_word: ἡ ἁμαρτία
  choice: الخطيئة
  rationale: تنقل المعنى الاصطلاحي المعتاد عند بولس، مع إبقاء الخطيئة فاعلًا لأفعال متتابعة كما في اليونانية.
- source_word: ἀφορμὴν λαβοῦσα
  choice: إذ اتخذت ... فرصةً
  rationale: تعبير عربي واضح يفيد اتخاذ مناسبة أو منفذ لاستغلاله، من غير المبالغة في معنى الفعل.
- source_word: διὰ τῆς ἐντολῆς
  choice: من الوصية
  rationale: ضمن تركيب «اتخذت من الوصية فرصة» يؤدي المعنى الوسيلي بصورة طبيعية، ويُبقي «الوصية» مفردة.
- source_word: ἐξηπάτησέν με
  choice: خدعتني
  rationale: ترجمة مباشرة واضحة تحافظ على المفعول الشخصي وعلى إسناد الفعل إلى الخطيئة.
- source_word: δι’ αὐτῆς
  choice: وبها
  rationale: الضمير المؤنث يعود إلى «الوصية»، ويعبّر عن الوسيلة بإيجاز كما في الأصل.
- source_word: ἀπέκτεινεν
  choice: قتلتني
  rationale: ينقل الفعل القوي المباشر من غير إضافة تفسير قضائي أو مجازي غير مصرّح به.
theological_decisions:
- issue: درجة تشخيص الخطيئة بوصفها قوة فاعلة
  choice: إبقاء الخطيئة فاعلًا يتخذ الفرصة ويخدع ويقتل
  alternative: تخفيف التشخيص بصياغة مجردة تصف أثر الخطيئة فقط
  rationale: يجعل النص اليوناني الخطيئة فاعلًا نحويًا للأفعال كلها؛ لذلك تحافظ الترجمة على هذه الصورة البلاغية واللاهوتية دون شرح زائد.
- issue: وظيفة الوصية في فعل الخطيئة
  choice: عرض الوصية بوصفها الوسيلة أو المناسبة التي استغلتها الخطيئة
  alternative: صياغة توحي بأن الوصية نفسها هي الفاعل الذي خدع وقتل
  rationale: الأصل يسند الخداع والقتل إلى الخطيئة، مع استعمال الوصية وسيلة؛ والصياغة تحفظ هذا التمييز من غير إزالة التوتر القائم في العبارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل تركيب «اتخذت من الوصية فرصة» لطبيعته في العربية، مع الحفاظ على تشخيص الخطيئة وقوة الأفعال في الأصل.
