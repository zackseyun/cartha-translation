  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: ar
  text: 'فماذا نقول؟ هل الشريعة خطيئة؟ حاشا! بل إنني لم أكن لأعرف الخطيئة إلا بالشريعة؛ فلولا أن الشريعة قالت: «لا تشتهِ»، لما عرفتُ الاشتهاء.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الاشتهاء» بـ«الرغبة»، لكن اقتباس الوصية «لا تشتهِ» يرجّح هنا معنى الرغبة المحرّمة أو الطمع.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: فماذا نقول؟
  rationale: يحافظ على صيغة بولس الانتقالية الاستفهامية بعبارة عربية طبيعية وموجزة.
- source_word: ὁ νόμος
  choice: الشريعة
  rationale: المراد في السياق شريعة موسى، و«الشريعة» هي المقابل العربي الواضح والمألوف.
- source_word: ἁμαρτία
  choice: خطيئة
  rationale: يحافظ على الاسم الخبري في السؤال، فلا يخفف المعنى إلى مجرد وصف الشريعة بأنها خاطئة أو شريرة.
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: تعبير عربي فصيح ومفهوم يؤدي الرفض القاطع والمشحون الذي في اليونانية.
- source_word: ἀλλὰ
  choice: بل
  rationale: ينقل الاستدراك القوي بعد نفي أن تكون الشريعة خطيئة.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: لم أكن لأعرف الخطيئة إلا بالشريعة
  rationale: ينقل معنى القصر والصيغة الافتراضية الطبيعية في السياق، مع إبقاء «أعرف» قريبة من الفعل اليوناني.
- source_word: ἐπιθυμίαν
  choice: الاشتهاء
  rationale: يربط الاسم مباشرة بصيغة الفعل في الوصية المقتبسة، مع بقاء اللفظ قادرًا على حمل معنى الرغبة المحرمة في السياق.
- source_word: οὐκ ᾔδειν
  choice: لما عرفتُ
  rationale: صياغة عربية طبيعية للشرط المخالف للواقع، وتحافظ على التوازي الدلالي مع الجملة السابقة رغم اختلاف الفعلين في اليونانية.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: لا تشتهِ
  rationale: صيغة نهي موجزة تؤدي قوة الوصية، وهي المقابل المباشر للفعل اليوناني.
theological_decisions:
- issue: العلاقة بين الشريعة والخطيئة
  choice: هل الشريعة خطيئة؟ حاشا!
  alternative: هل الشريعة خاطئة؟ كلا!
  rationale: النص اليوناني يستخدم اسمًا خبريًا ويسأل عن مطابقة الشريعة للخطيئة، لا عن اتصافها بصفة الخطأ؛ لذلك حُفظت حدة السؤال اللاهوتية.
- issue: وظيفة الشريعة في معرفة الخطيئة
  choice: لم أكن لأعرف الخطيئة إلا بالشريعة
  alternative: لم أعرف الخطيئة إلا بواسطة الشريعة
  rationale: الصياغة المختارة تُظهر بوضوح العلاقة الافتراضية التي يفيدها السياق من غير أن تجعل الشريعة مصدر الخطيئة؛ فهي أداة كشفها ومعرفتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت «حاشا» لقوة الرفض، وحُفظ التوازي بين معرفة الخطيئة ومعرفة الاشتهاء، مع وضع علامة الحاشية بعد اللفظ الذي تشرحه.
