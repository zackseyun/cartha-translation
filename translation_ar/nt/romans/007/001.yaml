  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: ar
  text: أم تجهلون، أيها الإخوة[a]—فإني أخاطب العارفين بالشريعة—أن للشريعة سلطانًا على الإنسان ما دام حيًّا؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظة «الإخوة» تترجم جمعًا مذكرًا في اليونانية، ويُرجَّح في هذا السياق أنها تشمل النساء أيضًا بين مخاطَبي بولس.
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: أم
  rationale: تحفظ الانتقال الحِجاجي المتصل بما سبق، وتلائم السؤال الإنكاري في العربية.
- source_word: ἀγνοεῖτε
  choice: تجهلون
  rationale: تنقل المضارع في سؤال بلاغي يستند إلى معرفة المخاطَبين المشتركة، بصياغة عربية واضحة وموجزة.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحافظ على صيغة الجمع المذكر في الأصل، مع بيان شمول الخطاب للنساء في الحاشية بحسب السياق.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: فإني أخاطب العارفين بالشريعة
  rationale: تحفظ القوة التفسيرية لـγάρ ومعنى الكلام الموجَّه إلى من يعرفون الشريعة، في تركيب عربي طبيعي.
- source_word: νόμον / ὁ νόμος
  choice: الشريعة
  rationale: اختيار عربي مفهوم لـνόμος يحافظ على وحدة المصطلح في الجملة؛ والسياق يستحضر شريعة موسى من غير أن يضيف النص هذا التحديد صراحة.
- source_word: κυριεύει
  choice: تسود على
  rationale: تنقل معنى السيادة والتسلط الكامن في الفعل، مع إيراد صياغة «لها سلطان» بديلًا في الحاشية.
- source_word: τοῦ ἀνθρώπου
  choice: الإنسان
  rationale: يعكس الاستعمال العام لـἄνθρωπος، فلا يقصر المعنى على الذكر.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: ما دام حيًّا
  rationale: صياغة عربية طبيعية تحفظ المعنى الزمني، وتربط الحياة بالإنسان المذكور.
theological_decisions:
- issue: مدى دلالة νόμος في قول بولس
  choice: تُرجمت بـ«الشريعة» من غير إضافة «شريعة موسى» أو أي تحديد آخر.
  alternative: شريعة موسى تحديدًا؛ أو القانون بوصفه مبدأً قانونيًا عامًا.
  rationale: السياق اللاحق يستحضر شريعة موسى، لكن العبارة هنا لا تحسم نطاق الدلالة صراحة؛ لذلك تُترك سعة اللفظ والتوتر التفسيري قائمين.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت الشرطتان لإبراز الجملة الاعتراضية، ووُضعت علامتا الحاشيتين عند اللفظ الذي تتعلق به كل منهما.
