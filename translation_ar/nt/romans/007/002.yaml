    rationale: لا يبيّن بوضوح أن الزوج هو متعلّق الرباط وأن القانون هو أساسه؛ والصياغة العربية السليمة هي «مرتبطة بزوجها بحكم القانون».
  - severity: medium
    issue: عبارة «من شريعة الزوج» قد تُفهم على أنها شريعة يملكها الزوج أو يضعها.
    rationale: الإضافة في τοῦ νόμου τοῦ ἀνδρός مضغوطة، لكنها في السياق تشير إلى الحكم القانوني الذي يربط المرأة بزوجها، لا إلى تشريع صادر عنه.
