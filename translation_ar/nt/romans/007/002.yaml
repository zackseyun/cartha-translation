  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: ar
  text: فالمرأة المتزوجة مرتبطة بزوجها بحكم القانون ما دام حيًّا؛ ولكن إن مات الزوج، تحررت من الحكم القانوني الخاص بزوجها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صارت في حِلٍّ من قانون زوجها»؛ والأرجح أن اليونانية تعني الرباط القانوني الذي كان يربطها بزوجها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: المرأة المتزوجة
  rationale: تعبير عربي طبيعي ينقل كون المرأة في رابطة الزواج من غير حرفية ثقيلة.
- source_word: τῷ ζῶντι ἀνδρί
  choice: بزوجها ما دام حيًّا
  rationale: يُظهر أن استمرار الرباط مرتبط ببقاء الزوج حيًّا، ويجعل العلاقة المفهومة من السياق صريحة في العربية.
- source_word: δέδεται
  choice: مرتبطة
  rationale: ينقل صيغة التام المبني للمجهول بوصفها حالة قائمة ناتجة عن الربط، ويلائم السياق القانوني الزوجي.
- source_word: νόμῳ
  choice: بالشريعة
  rationale: ينقل معنى القاعدة أو السلطة القانونية هنا، من غير حصرها صراحة في شريعة موسى.
- source_word: κατήργηται
  choice: تحررت
  rationale: يفيد زوال سلطان الالتزام عنها في هذا السياق، بدل المعنى الحرفي غير الملائم مثل «أُبطلت».
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: من شريعة الزوج
  rationale: يحافظ على تركيب الإضافة اليوناني المضغوط وعلى غموضه الحقيقي، مع توضيح الحاشية أن المقصود على الأرجح الرباط القانوني المتعلق بالزوج.
theological_decisions:
- issue: هل تشير νόμῳ / τοῦ νόμου إلى شريعة موسى تحديدًا أم إلى الحكم القانوني للزواج؟
  choice: الإبقاء على لفظ «الشريعة» في المتن ضمن الإطار الزوجي العام
  alternative: «حكم الزواج» أو إحالتها تحديدًا إلى شريعة موسى
  rationale: السياق المباشر هو رابطة الزواج التي ينهيها الموت، وورود νόμῳ بلا أداة تعريف في الجملة الأولى يرجح معنى قانونيًا عامًا؛ لكن تكرار لفظ «الشريعة» يحفظ صلة الحجة بسياق رومية 7 ولا يحسم أكثر مما يحسمه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «مرتبطة» و«تحررت» لإبراز صورة الرباط القانوني، مع إبقاء العبارة المضافة «شريعة الزوج» في المتن وحل ضغطها الدلالي في الحاشية.
