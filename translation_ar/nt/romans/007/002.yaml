revisions:
- from: فالمرأة المتزوجة مرتبطة بالشريعة بزوجها ما دام حيًّا؛ ولكن إن مات الزوج، تحررت من شريعة الزوج.[a]
  to: فالمرأة المتزوجة مرتبطة بزوجها بحكم القانون ما دام حيًّا؛ ولكن إن مات الزوج، تحررت من الحكم القانوني الخاص بزوجها.[a]
  rationale: 'يصحح التعديل علاقة عناصر الجملة وفق اليونانية: المرأة مرتبطة بزوجها، والقانون أساس هذا الرباط. كما يقدّم في المتن تعبيرًا عربيًا واضحًا لـ«قانون الزوج» في السياق، مع إبقاء الصياغة الأقرب حرفيًا بديلًا في الحاشية وبيان المراد القانوني دون فرض قراءة مذهبية.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:47Z'
review_pass:
  verdict: revise
  source_fidelity: يعكس المسودة إطار الزواج القانوني، لكن عبارة «مرتبطة بالشريعة بزوجها» غير سليمة تركيبيًا في العربية؛ فالداتيف اليوناني يقتضي أن تكون المرأة مرتبطة بزوجها بموجب القانون. كما أن «شريعة الزوج» قد توهم أن للزوج شريعةً يسنّها، بدل الحكم القانوني الذي يضبط رابطة الزواج.
  naturalness: «مرتبطة بزوجها بحكم القانون» فصيحة وطبيعية في العربية المعيارية المعاصرة، و«الحكم القانوني الخاص بزوجها» يوضح الإضافة اليونانية المضغوطة دون نسبة تشريع إلى الزوج.
  terminology: استُبدلت «الشريعة» بـ«القانون/الحكم القانوني» لأن المقصود في هذا المثال رابطة قانونية زوجية عامة، ولأن «الشريعة» في العربية قد توحي بلا داعٍ بشريعة دينية محددة. وتبقى صلة اللفظ بسياق حديث بولس عن الناموس محفوظة في المعنى القانوني.
  issues:
