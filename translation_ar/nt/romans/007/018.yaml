  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: ar
  text: فإني أعلم أنه لا يسكن فيَّ، أي في جسدي[a]، شيء صالح. فإن الإرادة متاحة لي، أما العمل بالصالح فليس متاحًا لي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طبيعتي الخاطئة». والترجمة الحرفية للفظ اليوناني: «لحمي».'
    reason: بيان المجال الدلالي للفظ σάρξ والحفاظ على التوتر بين الصياغة الحرفية والتفسير الأخلاقي.
lexical_decisions:
- source_word: οἶδα
  choice: أعلم
  rationale: صيغة الفعل التامة تؤدي معنى حاضرًا، و«أعلم» هي المقابل العربي الطبيعي المباشر.
- source_word: οἰκεῖ
  choice: يسكن
  rationale: يحفظ استعارة السكن أو الحلول في أسلوب بولس، بدل تسطيحها إلى مجرد الوجود.
- source_word: ἀγαθόν
  choice: شيء صالح
  rationale: الصفة المفردة المحايدة مستعملة استعمال الاسم، ومع النفي يكون التعبير العربي الطبيعي «لا... شيء صالح».
- source_word: σάρξ
  choice: جسدي
  rationale: يحفظ الإحالة الجسدية الأساسية للفظ مع صيغة المتكلم التي يقتضيها μου، ولا يحسم سلفًا معناه الأخلاقي إلى «الطبيعة الخاطئة».
- source_word: θέλειν
  choice: الإرادة
  rationale: ينقل المصدر المعرّف المستعمل اسمًا، ويحافظ على التجريد وعلى المقابلة مع الفعل.
- source_word: παράκειταί μοι
  choice: حاضرة لديَّ
  rationale: يعبّر طبيعيًا عن القرب أو التوافر، مع إبقاء الدلالة الشخصية لحرف الجر الضمني في صيغة المجرور اليونانية.
- source_word: κατεργάζεσθαι
  choice: فِعل
  rationale: ينقل المصدر المعرّف بوصفه اسمًا ويحفظ التوازي البلاغي بين الإرادة والفعل.
- source_word: τὸ καλόν
  choice: الصالح
  rationale: ينقل الصفة المعرّفة المستعملة اسمًا بوصفها فئة أخلاقية، بأسلوب عربي موجز.
- source_word: οὔ
  choice: فليس حاضرًا
  rationale: النفي في اليونانية موجز وحذفي؛ أُعيد معنى «حاضر» من الجملة السابقة لتكتمل العبارة عربيًا ويتضح التقابل.
theological_decisions:
- issue: ترجمة σάρξ في سياق بولسي ذي دلالة أخلاقية
  choice: جسدي
  alternative: طبيعتي الخاطئة
  rationale: اختيار «جسدي» يبقي لفظ بولس وصورته من غير أن يساوي الجسد المادي بالشر أو يفرض تفسيرًا عقائديًا بعينه. وتوضح الحاشية البديل التفسيري الممكن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي بين «الإرادة» و«فِعل الصالح»، وأُثبتت علامة الحاشية [a] في المتن.
