  terminology: «أتعس» أنسب هنا من «شقيّ»، إذ تنقل البؤس والضيق من غير الإيحاءات الأوسع المحتملة لكلمة «شقيّ». و«سينقذني» و«جسد» دقيقان. ينبغي أن تعرض الحاشية البديل الحرفي فقط، لا أن تفسر العبارة بأنها تشير إلى جسد «مفضٍ إلى الموت».
