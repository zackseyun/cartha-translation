  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: ar
  text: ما أتعسني، أنا الإنسان! مَن سينقذني من جسد هذا الموت؟[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أكثر سلاسة: «من هذا الجسد، جسد الموت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مَن سيخلّصني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: شقيّ
  rationale: تنقل شدة البؤس والضيق في صيحة بولس، وهي أفصح وأوجز هنا من تعبير تفسيري أطول.
- source_word: ἄνθρωπος
  choice: إنسان
  rationale: تحافظ على الإشارة إلى بولس بوصفه إنسانًا، وتأتي طبيعية في أسلوب التعجب العربي من غير حاجة إلى تضييق دلالة اللفظ إلى «رجل».
- source_word: τίς
  choice: مَن
  rationale: أداة استفهام عن شخص يُنتظر منه الإنقاذ.
- source_word: ῥύσεται
  choice: سينقذني
  rationale: تفيد التخليص من خطر أو قيد، وتحافظ السين على دلالة المستقبل في الفعل اليوناني.
- source_word: ἐκ
  choice: من
  rationale: تؤدي معنى الانفصال أو الخلاص من الشيء في هذا السياق.
- source_word: σώματος
  choice: جسد
  rationale: تحافظ على الصورة الحسية الصريحة في الأصل ولا تستبدل بها تفسيرًا عقائديًا.
- source_word: τοῦ θανάτου τούτου
  choice: هذا الموت
  rationale: يحافظ على الارتباط النحوي الظاهر في اليونانية، حيث يعود اسم الإشارة إلى «الموت»، مع إبقاء غرابة الصورة المقصودة.
theological_decisions:
- issue: تعلّق اسم الإشارة في العبارة الختامية
  choice: جسد هذا الموت
  alternative: هذا الجسد المفضي إلى الموت
  rationale: الصياغة المختارة أقرب إلى البنية اليونانية «جسد هذا الموت» وتحفظ غموض الصورة وتوترها، بدل أن تحسم طبيعة علاقة الجسد بالموت تفسيرًا.
- issue: مدى تفسير المقصود من «الجسد»
  choice: الإبقاء على «جسد» دون شرح داخل النص
  alternative: طبيعتي المائتة أو جسدي الخاضع للموت
  rationale: لا يحدد هذا العدد وحده المقصود العقائدي تحديدًا كاملًا؛ لذلك لا ينبغي إدخال تفسير مذهبي في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة ومشحونة بالعاطفة. استُعمل «يا لي من إنسان شقيّ!» لصوغ التعجب اليوناني صياغة عربية طبيعية، مع إبقاء العبارة الختامية قريبة من الأصل حتى لا يُمحى غموضها.
