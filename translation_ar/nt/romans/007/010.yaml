- from: أَمَّا أَنَا فَمُتُّ، فَإِذَا بِالْوَصِيَّةِ الَّتِي هِيَ لِلْحَيَاةِ تَكُونُ لِي لِلْمَوْتِ.[a]
  to: أما أنا فمتّ، فتبيّن لي أن الوصية التي للحياة هي نفسها للموت بالنسبة إليّ.[a]
