  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: ar
  text: أما أنا فمتّ، فتبيّن لي أن الوصية التي للحياة هي نفسها للموت بالنسبة إليّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أما أنا فمتّ، فوُجدت لي هذه الوصية التي للحياة للموت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: مُتُّ
  rationale: ينقل صيغة الماضي في اليونانية بوصفها حدثًا مباشرًا مكتملًا، من غير تحويلها إلى حالة مستمرة أو عملية تدريجية.
- source_word: εὑρέθη μοι
  choice: فإذا بـ... تكون لي
  rationale: صياغة عربية طبيعية تعبّر عن الانكشاف أو النتيجة التي اختبرها المتكلم، وتحفظ دلالة ضمير المتكلم في μοι من غير ترجمة حرفية ثقيلة مثل «وُجدت لي».
- source_word: ἐντολή
  choice: الوصية
  rationale: المقابل العربي المألوف للأمر الإلهي المفرد في هذا السياق، من غير إضافة «الناموس» وهي غير مذكورة صراحة في الآية.
- source_word: ἡ εἰς ζωὴν
  choice: التي هي للحياة
  rationale: يحفظ تركيب الغاية أو النتيجة المحتملة في εἰς، ويهيئ للموازاة البلاغية مع «للموت».
- source_word: αὕτη
  choice: فإذا بالوصية التي هي للحياة
  rationale: تُفهم الإشارة إلى الوصية نفسها من بنية الجملة العربية؛ ويؤدي تركيب «فإذا بـ» جانبًا من قوة إبراز النتيجة، من غير تكرار ثقيل.
- source_word: εἰς θάνατον
  choice: للموت
  rationale: 'يحافظ على الموازاة المقصودة بين εἰς ζωήν وεἰς θάνατον: «للحياة... للموت»، من غير تفسير زائد لعلاقة السببية.'
theological_decisions:
- issue: هل تُفسَّر الوصية صراحةً بأنها سببت الموت أو جلبته؟
  choice: تكون لي للموت
  alternative: جلبت لي الموت؛ أفضت بي إلى الموت
  rationale: 'الصياغة المختارة تبقي العبارة محايدة نسبيًا وتحفظ التوتر في النص: الوصية المتجهة إلى الحياة انكشفت في خبرة المتكلم على أنها للموت، من غير حسم كيفية السببية بما يتجاوز اليونانية.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظ التقابل اللفظي «للحياة... للموت»، واستُخدم «فإذا بـ» لنقل معنى الانكشاف التجريبي في εὑρέθη μοι بصورة عربية طبيعية.
