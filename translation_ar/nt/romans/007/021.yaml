  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: ar
  text: 'فأجد، إذًا، هذا الناموس[a]: حين أريد أن أفعل الخير، يكون الشر قريبًا مني.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المبدأ» أو «القاعدة».'
    reason: قراءة بديلة تحفظ احتمال أن يكون νόμος هنا بمعنى مبدأ أو قاعدة حاكمة، لا إشارة محددة إلى ناموس موسى.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: أجد
  rationale: يحافظ المضارع على معنى الإدراك الحاضر والمتكرر في سياق حديث بولس عن اختباره.
- source_word: ἄρα
  choice: إذًا
  rationale: تفيد الاستنتاج مما سبق، وهي صياغة عربية طبيعية في هذا الموضع.
- source_word: νόμον
  choice: الناموس
  rationale: يحافظ على لفظ νόμος وعلى صداه في سياق الرسالة، من غير حسم ما إذا كان المراد ناموسًا بالمعنى التشريعي أم مبدأً حاكمًا.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: حين أريد أن أفعل الخير
  rationale: تنقل تركيب الداتيف اليوناني إلى عبارة عربية واضحة، مع إبقاء معنى الإرادة والفعل المقصود.
- source_word: τὸ καλὸν
  choice: الخير
  rationale: مقابل عربي طبيعي للصفة المستعملة استعمال الاسم، ويحافظ على التقابل مع الشر.
- source_word: τὸ κακὸν
  choice: الشر
  rationale: ينقل الصفة الاسمية بإيجاز، ويحافظ على التقابل المباشر مع الخير.
- source_word: παράκειται
  choice: يكون حاضرًا لديّ
  rationale: ينقل معنى وجود الشر قريبًا ومتاحًا إزاء المتكلم، من غير إضافة تفسير لاهوتي.
theological_decisions:
- issue: هل يشير νόμον إلى ناموس موسى أم إلى مبدأ أو قاعدة حاكمة؟
  choice: الناموس في المتن، مع ذكر «المبدأ» و«القاعدة» في الحاشية.
  alternative: المبدأ؛ القاعدة
  rationale: استعمال «الناموس» يحفظ لفظ بولس والتوتر الدلالي في السياق، بينما تمنع الحاشية قصره بلا ضرورة على ناموس موسى.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «الناموس» للمحافظة على المصطلح البولسي، ووُضع تفسير البدائل في الحاشية. أُضيف اسم الإشارة «هذا» لإيضاح أن الجملة التالية تحدد مضمون الناموس الذي يجده المتكلم.
