revisions:
- from: فهل صار ما هو صالح موتًا لي؟ قطعًا لا! بل إن الخطية، لكي تظهر أنها خطية[a]، أحدثت لي الموت بواسطة ما هو صالح، لكي تصير الخطية بواسطة الوصية خاطئة إلى أبعد حد[b].
  to: فهل صار ما هو صالح موتًا لي؟ قطعًا لا! بل الخطيئة هي التي، لكي تظهر خطيئةً، كانت تُحدِث لي الموت بواسطة ما هو صالح، لكي تصير الخطيئة، بواسطة الوصية، خاطئة إلى أبعد حد[b].
  rationale: يحافظ النص المنقح على السؤال البلاغي والرفض القاطع، وينسب إحداث الموت إلى الخطيئة لا إلى ما هو صالح أو الوصية. واستُبدلت صيغة الماضي بوصف مستمرّ («كانت تُحدِث») ليعكس المشاركة اليونانية. حُذف الحاشية [a] لأن العبارة المنقحة «لكي تظهر خطيئةً» تنقل مباشرةً البنية الخبرية لتكرار ἁμαρτία، فلا يلزم بديل لها. وبقيت الحاشية [b] مثبتة عند عبارة الشدة التي تخصها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:54Z'
review_pass:
