    issue: صيغة «أحدثت» الماضية لفعل الخطيئة
    rationale: المشاركة الحاضرة κατεργαζομένη تصف الخطيئة وهي تُنتج الموت في إطار الغاية المذكورة؛ «كانت تُحدِث» أنسب من الماضي المنجز، من غير تغيير المعنى الأساسي.
  - severity: low
