id: ROM.7.13
reference: Romans 7:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: ar
  text: فهل صار ما هو صالح موتًا لي؟ قطعًا لا! بل الخطيئة هي التي، لكي تظهر خطيئةً، كانت تُحدِث لي الموت بواسطة ما هو صالح، لكي تصير الخطيئة، بواسطة الوصية، خاطئة إلى أبعد حد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'أو: «خاطئة إلى درجة فائقة».'
    reason: بديل لغوي لعبارة تدل على الإفراط الشديد أو تجاوز الحد.
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: ما هو صالح
  rationale: ينقل الصفة المحايدة المستعملة استعمال الاسم، ويحافظ على الإشارة المجردة إلى «الصالح» بلغة عربية طبيعية.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: صار ... موتًا لي
  rationale: يحافظ على معنى الصيرورة وعلى دلالة المرجع الشخصي في صيغة السؤال البلاغي.
- source_word: μὴ γένοιτο
  choice: قطعًا لا!
  rationale: رفض قاطع واضح في العربية المعاصرة، ينقل قوة العبارة اليونانية من غير صياغة عتيقة.
- source_word: ἡ ἁμαρτία
  choice: الخطية
  rationale: يحافظ على الاسم المجرّد مع تشخيص الخطية بوصفها العامل الذي يُحدث الموت.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: لكي تظهر أنها خطية
  rationale: يحافظ على جملة الغاية وعلى القوة الخبرية لتكرار «الخطية»، أي انكشافها في حقيقتها.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: بواسطة ما هو صالح
  rationale: يحافظ على المعنى الوسيلي لحرف الجر وعلى التطابق اللفظي مع العبارة الأولى.
- source_word: μοι κατεργαζομένη θάνατον
  choice: أحدثت لي الموت
  rationale: ينقل معنى إحداث النتيجة أو إنجازها، ويجعل فاعلية الخطية واضحة من غير نسبتها إلى الوصية الصالحة.
- source_word: ἵνα γένηται
  choice: لكي تصير
  rationale: يحافظ على جملة الغاية الثانية وعلى معنى الصيرورة.
- source_word: καθ’ ὑπερβολὴν
  choice: إلى أبعد حد
  rationale: تعبير عربي طبيعي يدل على التجاوز الشديد والمبالغة القصوى.
- source_word: ἁμαρτωλὸς
  choice: خاطئة
  rationale: يحافظ على الصفة المسندة إلى الخطية وعلى التكرار البلاغي المقصود في الأصل.
- source_word: διὰ τῆς ἐντολῆς
  choice: بواسطة الوصية
  rationale: ينقل الدلالة الوسيلية ويحافظ على مصطلح «الوصية» في سياق الناموس.
theological_decisions:
- issue: الدفاع البلاغي عن صلاح الصالح أو الوصية مع إسناد إحداث الموت إلى الخطية
  choice: نفي أن يكون ما هو صالح قد صار في ذاته موتًا، وإسناد إحداث الموت إلى الخطية التي تعمل بواسطة الصالح
  alternative: صياغة قد توحي بأن الوصية نفسها هي العامل الأخلاقي المسؤول عن الموت
  rationale: المقابلة بعد الرفض القاطع تجعل «الخطية» محور الفاعلية، بينما تبقى الوصية وسيلة تكشف فداحة الخطية؛ وتحافظ الصياغة على هذا التوتر من غير تبرئة تفسيرية زائدة أو تحميل الوصية ذنبًا لا يسنده التركيب.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ السؤال البلاغي والرفض القاطع، كما حُفظ تشخيص الخطية وتكرار لفظها. أُعيد ترتيب العلاقة النحوية قليلًا بما يلائم العربية، من غير تغيير تسلسل جملتي الغاية أو بنية الفاعلية في الأصل.
