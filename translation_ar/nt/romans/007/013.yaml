  source_fidelity: 'تحتاج الصياغة إلى تعديل محدود: الفعل «أحدثت» بصيغة الماضي يقدّم عمل الخطيئة كحدثٍ منتهٍ، فيما تصف المشاركة اليونانية κατεργαζομένη عملها بوصفه الفاعل/الوسيلة في السياق. الصياغة بالفعل المضارع المستمرّ تحفظ هذا الجانب على نحو أدق. كما أن «الخطيئة» هي الصيغة الأفصح في العربية المعيارية المعاصرة.'
  naturalness: النص واضح في الجملة، لكن «بل إن الخطية ... أحدثت» أقل سلاسة في بناء الاستدراك، ولا يبيّن العلاقة بين غاية انكشاف الخطيئة وفعلها بوضوح كافٍ. إدخال «هي التي كانت تُحدِث» يجعل التركيب العربي طبيعيًا ويحافظ على تشخيص الخطيئة.
  terminology: استُبدلت «الخطية» بـ«الخطيئة» للاتساق مع الفصحى المعاصرة الواضحة. وأُبقيت «الوصية» و«ما هو صالح» لأنهما ينقلان ἐντολή وΤὸ ἀγαθόν دون تفسير زائد.
  issues:
