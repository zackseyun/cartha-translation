  source_fidelity: 'النص العربي ينقل بنية اليونانية ومعناها بأمانة: «لأني» تؤدي γάρ التفسيرية، و«لا أفعل الخير الذي أريده» تقابل οὐ...ποιῶ ἀγαθόν، ثم يحافظ على المقابلة مع «الشر الذي لا أريده» وعلى الإحالة المؤكدة في «فهذا هو ما أمارسه» لـτοῦτο. ولا يضيف تحديدًا تفسيريًا لهوية المتكلم أو لطبيعة الصراع.'
  naturalness: الصياغة فصحى حديثة واضحة ومتماسكة. «الخير/الشر» و«أريد» طبيعيان في هذا السياق، و«أمارسه» مفهوم وسليم مع أن دلالته تتداخل مع «أفعل»، وهو ما توضحه الحاشية دون افتعال فرق حاد بين الفعلين.
  terminology: يحافظ النص على الثقل الأخلاقي المقصود في ἀγαθόν/κακόν بترجمة «الخير/الشر». والتمييز المحدود بين «أفعل» و«أمارس» ملائم لقرار المسار الإنجليزي وللفعلين اليونانيين، مع بقاء الحاشية دقيقة في بيان التداخل الدلالي.
