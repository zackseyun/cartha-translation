  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: ar
  text: لأَنِّي لَا أَفْعَلُ الْخَيْرَ الَّذِي أُرِيدُهُ، بَلِ الشَّرَّ الَّذِي لَا أُرِيدُهُ، فَهَذَا هُوَ مَا أُمَارِسُهُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل اليوناني فِعلين متقاربين في المعنى: «أفعل» أولًا (ποιῶ)، ثم «أمارس» (πράσσω). ويمكن ترجمة الثاني أيضًا: «أفعل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: أريد
  rationale: تعبير عربي طبيعي وواضح عن الإرادة والقصد، من غير تحميل اللفظ معنى فلسفيًا زائدًا.
- source_word: ποιῶ
  choice: أفعل
  rationale: يقابل الفعل اليوناني العام «يفعل» ويحافظ على بساطة العبارة.
- source_word: ἀγαθόν
  choice: الخير
  rationale: يحفظ التقابل الأخلاقي المباشر والثقيل مع «الشر».
- source_word: κακὸν
  choice: الشر
  rationale: ينقل القوة الأخلاقية للكلمة ويحافظ على موازاتها مع «الخير».
- source_word: πράσσω
  choice: أمارس
  rationale: يميّزه بقدر مناسب عن ποιῶ، ويفيد السلوك المنفَّذ أو المتكرر من غير المبالغة في توسيع الفرق بين الفعلين.
- source_word: τοῦτο
  choice: فهذا هو ما
  rationale: يُبقي اسم الإشارة المؤكد ظاهرًا في العربية ويبرز أن الشر المذكور هو بعينه ما يمارسه المتكلم.
- source_word: οὐ γὰρ
  choice: لأني لا
  rationale: تحفظ «لأن» القوة التفسيرية لـγάρ وصلتها بالحجة السابقة.
theological_decisions:
- issue: هل يُخفَّف التقابل الأخلاقي بين ἀγαθόν وκακόν؟
  choice: الخير / الشر
  alternative: الصواب / الخطأ، أو الحسن / السيئ
  rationale: النص يقدم تقابلًا أخلاقيًا قويًا؛ لذلك لا ينبغي تسطيحه إلى لغة عملية أضعف.
- issue: هل يُفسَّر المتكلم أو تُحسم هويته في صياغة الآية؟
  choice: الإبقاء على صيغة المتكلم بلا إضافة تفسيرية
  alternative: إضافة ما يحدد حال بولس أو الإنسان الذي يتحدث عنه
  rationale: الآية نفسها لا تحسم الجدل التفسيري الأوسع بشأن هوية «الأنا»، فتبقى الصياغة محايدة وتحفظ التوتر في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم التشكيل الجزئي في نص الآية لتيسير القراءة، مع الحفاظ على التوازي بين «الخير» و«الشر» وعلى التمييز المحدود بين الفعلين اليونانيين.
