  text: فَإِنِّي أُسَرُّ بِشَرِيعَةِ اللهِ بِحَسَبِ الإِنْسَانِ الْبَاطِنِ،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من جهة ذاتي الباطنة» أو «من جهة كياني الداخلي».'
    reason: بدائل معجمية لعبارة τὸν ἔσω ἄνθρωπον توضّح أن المقصود الإنسان من جهة باطنه، مع إبقاء الاستعارة في المتن.
lexical_decisions:
- source_word: συνήδομαι
  choice: أستلذّ
  rationale: ينقل الفعل معنى السرور والموافقة الوجدانية، لا مجرد الاتفاق الذهني، وهو تعبير عربي طبيعي وموجز.
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: شريعة الله
  rationale: تحفظ «شريعة» الدلالة البولسية القوية لـ νόμος، والإضافة العربية تنقل τοῦ θεοῦ بوضوح وطبيعية.
- source_word: κατὰ
  choice: بحسب
  rationale: تعكس الدلالة الأصلية للحرف بوصفه يحدد جهة الاعتبار أو المقياس، من غير اختزاله إلى دلالة مكانية محضة.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: الإنسان الباطن فيَّ
  rationale: يحفظ الاستعارة البولسية وصيغة «الإنسان» الواردة في اليونانية، بينما يوضح «فيَّ» الإحالة إلى باطن المتكلم التي يقتضيها السياق دون جعلها جزءًا من العبارة اليونانية نفسها.
theological_decisions:
- issue: الدلالة الأنثروبولوجية لعبارة «الإنسان الباطن»
  choice: الإنسان الباطن فيَّ
  alternative: ذاتي الباطنة؛ كياني الداخلي
  rationale: يحافظ النص على صورة بولس المجازية ولا يحولها إلى تقرير تقني عن تركيب الإنسان، كما يتجنب حسم النقاش اللاهوتي الأوسع الذي لا يحسمه العدد نفسه.
translation_notes:
  register: عربية فصحى واضحة وكريمة النبرة. استُخدمت «فإني» لربط γὰρ بالسياق، و«بحسب» لصون بنية κατὰ قدر الإمكان، مع إبقاء «الإنسان الباطن» كتعبير بولسي مميز.
