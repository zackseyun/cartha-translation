    issue: اختيار «أستلذّ»
    rationale: هو ممكن معجميًا، لكنه غير مألوف نسبيًا مع «الشريعة» في الفصحى المعاصرة وقد يحمل إيحاءً حسيًا غير مقصود. «أُسَرّ بـ» ينقل السرور الوجداني والموافقة ويوافق التعدية العربية الطبيعية.
  - severity: low
    issue: إضافة «فيَّ» إلى «الإنسان الباطن»
    rationale: المرجع إلى المتكلم مستفاد من الفعل والسياق، بينما النص اليوناني يورد العبارة معرّفة من دون ضمير ملكية أو شبه جملة. حذفها يحافظ على الاقتصاد النصي مع بقاء المعنى واضحًا.
