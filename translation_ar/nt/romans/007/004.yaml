id: ROM.7.4
reference: Romans 7:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: ar
  text: لذلك، يا إخوتي[a]، أنتم أيضًا أُمِتُّم بالنسبة إلى الشريعة بواسطة جسد المسيح[b]، لكي تصيروا لآخر، للذي أُقيم من بين الأموات، لكي نُثمر لله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يشمل النداء «يا إخوتي» الإخوة والأخوات؛ فاللفظ اليوناني المذكر الجمع قد يُستعمل لمخاطبة جماعة مختلطة.
    reason: lexical_alternative
  - marker: b
    text: «المسيح» لقب معناه «الممسوح».
    reason: lexical_note
lexical_decisions:
- source_word: Ὥστε
  choice: لذلك
  rationale: تنقل قوة الاستنتاج من تشبيه الزواج في السياق السابق بعبارة عربية طبيعية.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: تحافظ على صيغة النداء والجمع المذكر في اليونانية، مع بيان إمكان شمول الجماعة المختلطة في الحاشية.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: أُمِتُّم بالنسبة إلى الشريعة
  rationale: تحافظ صيغة المبني للمجهول على كون المؤمنين قد وقع عليهم الفعل، وتوضح العبارة شبه الجارّة جهة العلاقة بالشريعة من غير تفسيرها بأنها انفصال مكاني.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: بواسطة جسد المسيح
  rationale: تعكس διά مع المضاف إليه معنى الوساطة أو الأداة، وتحافظ «المسيح» في العربية على اللقب الكتابي المألوف ومعناه المسياني.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: لكي تصيروا لآخر
  rationale: صياغة موجزة وقريبة من الأصل تحفظ امتداد تشبيه الزواج وما فيه من انتقال في الانتماء، من غير إضافة «تتزوجوا» أو «تقترنوا» صراحة.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: للذي أُقيم من بين الأموات
  rationale: تحافظ على المبني للمجهول وعلى دلالة ἐκ الحرفية، مع تعيين «الآخر» بالموصول.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: لكي نُثمر لله
  rationale: تحفظ استعارة الإثمار، ودلالة الغاية، والتحول الأصلي من المخاطب «أنتم» إلى المتكلم الجمع «نحن».
theological_decisions:
- issue: دلالة الموت بالنسبة إلى الشريعة
  choice: أُمِتُّم بالنسبة إلى الشريعة
  alternative: مُتُّم عن الشريعة
  rationale: المختار يحفظ المبني للمجهول ودلالة المفعولية التي في ἐθανατώθητε، ولا يحسم بأكثر مما يقوله النص طبيعة انتهاء العلاقة بالشريعة.
- issue: استمرار الاستعارة الزوجية في γενέσθαι ὑμᾶς ἑτέρῳ
  choice: لكي تصيروا لآخر
  alternative: لكي تقترنوا بآخر
  rationale: المختار يبقي تعبير الانتماء مفتوحًا كما في اليونانية ويُبقي صلته بتشبيه الزواج، بينما البديل يصرّح بالاقتران أكثر من لفظ الآية.
- issue: صيغة إقامة المسيح
  choice: أُقيم من بين الأموات
  alternative: قام من بين الأموات
  rationale: تحفظ الصيغة المبنية للمجهول في ἐγερθέντι ولا تستبدلها بصيغة لازمة، من غير تحديد الفاعل الذي لم يُذكر صراحة هنا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي الحفاظ على المبني للمجهول، وتشبيه الزواج، واستعارة الإثمار، والتحول من ضمير المخاطبين إلى المتكلم الجمع. وُضعت جميع علامات الحواشي في المتن.
