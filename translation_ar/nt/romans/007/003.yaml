revisions:
- from: فإذًا، ما دام زوجها حيًّا، تُدعى زانية إن صارت لرجل آخر[a]. أمّا إن مات الزوج، فهي حُرّة من الشريعة[b]، ومن ثم لا تكون زانية إن صارت لرجل آخر.
  to: فإذًا، ما دام زوجها حيًّا، تُدعى زانية إن أصبحت زوجةً لرجل آخر[a]. أمّا إن مات الزوج، فهي حُرّة من الشريعة[b]، ومن ثم لا تُدعى زانية إن أصبحت زوجةً لرجل آخر.
  rationale: استُبدل التعبير الملتبس «صارت لرجل آخر» بعبارة عربية واضحة تؤدي المعنى العلاقي/الزوجي الذي يقتضيه السياق اليوناني. وحُفظ تكرار البنية في شطري الآية، مع جعل النتيجة «لا تُدعى زانية» موافقةً لوصف المرأة في حكم الزواج. بقيت علامتا الحاشيتين في موضعيهما ووُحّدت الحاشية الأولى مع الصياغة الجديدة.
