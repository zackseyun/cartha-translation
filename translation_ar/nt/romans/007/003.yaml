  source_fidelity: ينقل النص بنية الاستنتاج والشرط والمقابلة القانونية على نحو سليم عمومًا. لكن «صارت لرجل آخر» غير طبيعية في العربية المعاصرة وقد لا تُفهم بوضوح على أنها دخول في علاقة زوجية، في حين أن γένηται/γενομένην ἀνδρὶ ἑτέρῳ تعبير اصطلاحي يدل في هذا السياق على أن تصير زوجة رجل آخر أو تقترن به. كما أن «لا تكون زانية» أضعف قليلًا من دلالة χρηματίσει/μοιχαλίδα المتعلقة بالتسمية أو الوصف القانوني؛ والأفضل حفظها بـ«لا تُدعى زانية».
  naturalness: «فإذًا» و«ما دام زوجها حيًّا» و«أمّا» سليمة وطبيعية. أما «إن صارت لرجل آخر» فتركيب مقتضب لكنه ملتبس وأقل سلاسة من «إن أصبحت زوجةً لرجل آخر».
  terminology: «زانية» هي المقابل العربي المألوف لـ μοιχαλίς في هذا السياق الزوجي، و«الشريعة» مقبول لترجمة νόμος مع الحاشية التي تقيّد مرجعه المباشر بالرابطة القانونية للزواج. تُحافظ المراجعة على عمومية «الشريعة» في المتن ولا تفرض فهمًا عقائديًا أوسع أو أضيق.
