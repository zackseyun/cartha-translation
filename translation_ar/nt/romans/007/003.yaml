  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: ar
  text: فإذًا، ما دام زوجها حيًّا، تُدعى زانية إن أصبحت زوجةً لرجل آخر[a]. أمّا إن مات الزوج، فهي حُرّة من الشريعة[b]، ومن ثم لا تُدعى زانية إن أصبحت زوجةً لرجل آخر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن ارتبطت برجل آخر».'
    reason: lexical_alternative
  - marker: b
    text: تشير «الشريعة» هنا مباشرةً إلى الحكم الملزم الذي ينظّم رابطة الزواج.
    reason: contextual_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: فإذًا
  rationale: تنقل أداتا الاستنتاج معًا وتربطان الحكم بما سبق بعبارة عربية موجزة وطبيعية.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: ما دام زوجها حيًّا
  rationale: تنقل تركيب الحال الزمني، وتُظهر من السياق أن الرجل المذكور هو زوج المرأة.
- source_word: μοιχαλὶς
  choice: زانية
  rationale: الاسم اليوناني يخص المرأة التي ترتكب الزنى، و«زانية» مقابله العربي المباشر الواضح.
- source_word: χρηματίσει
  choice: تُدعى
  rationale: يفيد الفعل هنا أنها تُسمّى أو تُوصَف بهذا الاسم، وتحافظ صيغة المبني للمجهول على دلالة الأصل.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: إن صارت لرجل آخر
  rationale: تحافظ العبارة على إيجاز الأصل وعلى طابعه العلاقي من غير أن تضيف لفظ «زوجة» صراحة، مع توضيح المعنى الزوجي المحتمل في الحاشية.
- source_word: ἐλευθέρα
  choice: حُرّة
  rationale: تنقل معنى التحرر من الالتزام أو الرابطة الملزمة بلفظ عربي مباشر.
- source_word: ἀπὸ τοῦ νόμου
  choice: من الشريعة
  rationale: تحافظ على لفظ νόμος العام، بينما يحدد السياق أن المقصود المباشر هو الحكم الملزم في علاقة الزواج.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: ومن ثم لا تكون زانية
  rationale: تصوغ النتيجة المنطقية التي يدل عليها المصدر المعرّف صياغة عربية واضحة، من غير تحويل «تكون» إلى «تُدعى».
theological_decisions:
- issue: نطاق νόμος في التشبيه
  choice: الشريعة
  alternative: شريعة الزواج؛ الحكم الملزم للزواج
  rationale: أُبقي اللفظ عامًا في المتن كما في اليونانية، مع بيان مرجعه المباشر في الحاشية، تجنبًا لحصر دلالة بولس أو توسيعها عقائديًا بلا قرينة.
- issue: دلالة γένηται ἀνδρὶ ἑτέρῳ
  choice: صارت لرجل آخر
  alternative: صارت زوجة لرجل آخر؛ ارتبطت برجل آخر
  rationale: يحفظ هذا الاختيار قدرًا من الإيجاز والغموض الموجودين في التعبير اليوناني، في حين يوضح السياق أنه انتقال إلى علاقة زوجية أو شبيهة بها.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ورصينة. استُعمل «أمّا» لإبراز المقابلة، وحُفظ تكرار «إن صارت لرجل آخر» كما في الأصل. وُضعت علامتا الحاشيتين في المتن عند العبارتين اللتين تفسرانهما.
