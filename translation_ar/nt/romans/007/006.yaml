source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: ar
  text: أمّا الآن فقد تحررنا من الشريعة، إذ متنا عمّا كان يمسكنا[a]، لكي نخدم في جِدّة الروح[b]، لا في قِدَم الحرف[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ متنا بالنسبة إلى ما كنا مقيَّدين به».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في جِدّة روح».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «لا في قِدَم النص المكتوب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν
  choice: تحررنا
  rationale: مع عبارة ἀπὸ τοῦ νόμου يدل المبني للمجهول على التحرر من سلطان الشريعة المُلزِم، لا على أن الشريعة نفسها زالت أو بطلت.
- source_word: νόμου
  choice: الشريعة
  rationale: السياق يشير إلى شريعة موسى، و«الشريعة» هي المقابل العربي الواضح والمألوف هنا.
- source_word: ἀποθανόντες
  choice: إذ متنا
  rationale: يحافظ على كون المؤمنين هم الذين ماتوا، وعلى العلاقة الظرفية بين موتهم وتحررهم من الشريعة.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: عمّا كان يمسكنا
  rationale: صياغة عربية طبيعية تحفظ معنى الاحتجاز أو التقييد في κατέχω من غير أن تحسم التركيب اليوناني بأكثر مما يحتمل.
- source_word: δουλεύειν
  choice: نخدم
  rationale: تنقل معنى أداء الخدمة مع بقاء خلفية العبودية الممكنة في الفعل، وتلائم الحديث عن كيفية الخدمة.
- source_word: καινότητι
  choice: جِدّة
  rationale: تحفظ الاسم المجرّد والمقابلة البلاغية المقصودة مع παλαιότητι.
- source_word: πνεύματος
  choice: الروح
  rationale: يحافظ على التعبير اليوناني وعلى رجحان الإشارة إلى الروح القدس في المقابلة البولسية بين الروح والحرف، مع إبقاء احتمال معنى الروح بوجه أعم في الحاشية.
- source_word: παλαιότητι
  choice: قِدَم
  rationale: يحفظ الاسم المجرّد والتناظر مع «جِدّة».
- source_word: γράμματος
  choice: الحرف
  rationale: هو المقابل المباشر ويحفظ اصطلاح بولس؛ أما «النص المكتوب» أو «الناموس المكتوب» فتفسير أوضح لكنه أضيق.
theological_decisions:
- issue: هل ماتت الشريعة أم مات المؤمنون بالنسبة إلى ما كان يقيدهم؟
  choice: 'المؤمنون هم الذين ماتوا: «إذ متنا عمّا كان يمسكنا».'
  alternative: أن الشريعة هي التي ماتت أو بطل عملها بالنسبة إلى المؤمنين.
  rationale: اسم الفاعل ἀποθανόντες في صيغة جمع المذكر المرفوع يعود إلى فاعل «تحررنا» الضمني، أي «نحن».
- issue: هل πνεύματος يشير إلى الروح القدس أم إلى الروح بمعنى أعم؟
  choice: «الروح»، مع ترجيح الإشارة إلى الروح القدس من السياق.
  alternative: «الروح» بمعنى الحالة أو التوجه الروحي الجديد للإنسان.
  rationale: المقابلة البولسية بين الروح والحرف وسياق العهد الجديد يرجحان الروح القدس، لكن غياب أداة التعريف في اليونانية يترك قدرا من الاحتمال، فتحفظه الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدمت «جِدّة/قِدَم» للمحافظة على التناظر البلاغي في الأصل، مع شرح البدائل المحتملة في الحواشي.
