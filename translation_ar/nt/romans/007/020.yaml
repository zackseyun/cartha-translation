  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: ar
  text: ولكن إن كنتُ أفعل ما لا أريده، فلستُ أنا بعدُ مَن يُنجز ذلك، بل الخطيئة الساكنة فيَّ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن كنت
  rationale: تنقل الشرط مع المقابلة الخفيفة، وتصل الحجة بما سبق بصياغة عربية طبيعية.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: أفعل ما لا أريده
  rationale: تحافظ بوضوح على مضمون التركيب الموصولي التقابلي من غير إثقال العبارة بتكرار غير لازم في العربية.
- source_word: οὐκέτι ἐγώ
  choice: فلست أنا بعدُ
  rationale: تحفظ معنى «لم أعد» وتُبرز الضمير الصريح ἐγώ في موضع المقابلة.
- source_word: κατεργάζομαι αὐτό
  choice: الذي يفعله
  rationale: صياغة عربية جارية تدل على مباشرة الفعل وإحداثه، مع إبقاء الضمير عائدًا إلى الفعل غير المرغوب فيه.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: الخطية الساكنة فيَّ
  rationale: تحفظ اسم «الخطية» وصورة سكناها في المتكلم، من غير استبدالها بتفسير مثل «الطبيعة الخاطئة».
theological_decisions:
- issue: هل تُخفَّف مسؤولية المتكلم أو تُفسَّر «الخطية» على أنها مجرد طبيعة أو نزعة؟
  choice: إبقاء المقابلة كما وردت بين «أنا» و«الخطية الساكنة فيَّ».
  alternative: شرح العبارة تفسيرًا، أو ترجمة «الخطية» بـ«الطبيعة الخاطئة».
  rationale: النص اليوناني يسمّي ἁμαρτία صراحة ويصوغ تمييزًا بلاغيًا متوترًا بين المتكلم والخطية الساكنة فيه؛ لذلك ينبغي ألا تحسم الترجمة آثاره اللاهوتية المتنازع عليها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الخطية» بوصفها المقابل الكتابي المباشر لـἁμαρτία، و«الساكنة» للمحافظة على صورة الإقامة الواردة في οἰκοῦσα.
