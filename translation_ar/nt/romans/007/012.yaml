id: ROM.7.12
reference: Romans 7:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: ar
  text: إذًا، فالشريعة مقدسة، والوصية مقدسة وعادلة وصالحة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: إذًا
  rationale: تفيد نتيجة مستخلصة من الحجة السابقة، و«إذًا» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: νόμος
  choice: الشريعة
  rationale: تشير في السياق إلى الشريعة، على الأرجح شريعة موسى، من غير إضافة تفسيرية إلى نص الآية.
- source_word: ἅγιος / ἁγία
  choice: مقدسة
  rationale: تنقل معنى القداسة، بما فيه الطهارة والتخصيص لله، وتوافق الجنس النحوي لكلمتي «الشريعة» و«الوصية».
- source_word: ἐντολή
  choice: الوصية
  rationale: تلائم الإشارة إلى وصية بعينها ضمن الشريعة، وتحافظ على الصياغة الأخلاقية الرسمية.
- source_word: δικαία
  choice: عادلة
  rationale: تنقل الحكم بأن الوصية موافقة للعدل والاستقامة؛ و«بارّة» بديل ممكن لكنه أقل طبيعية في وصف الوصية بالعربية المعاصرة.
- source_word: ἀγαθή
  choice: صالحة
  rationale: تحفظ معنى الخير في ذات الوصية وما تنطوي عليه من نفع، من دون توسع تفسيري.
- source_word: μὲν
  choice: غير مصرّح بها
  rationale: تفيد توكيدًا خطابيًا خفيفًا، لكن لا يقابلها هنا تركيب δέ صريح، ولذلك يؤدي السياق معناها طبيعيًا من غير لفظ مستقل.
theological_decisions:
- issue: تحديد مدلول νόμος
  choice: الشريعة
  alternative: شريعة موسى
  rationale: السياق يرجح شريعة موسى، لكن النص اليوناني يقول «الشريعة» دون هذا التحديد الصريح، فحُفظت صياغته وتُرك التحديد للسياق.
- issue: معنى δικαία في وصف الوصية
  choice: عادلة
  alternative: بارّة
  rationale: كلاهما ممكن، لكن «عادلة» أوضح للقارئ الحديث وتحفظ كون الوصية موافقة للعدل من غير إضفاء معنى مذهبي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ التوازي والتكرار في وصف الشريعة والوصية، مع استعمال «فـ» لربط النتيجة بمضمونها على نحو طبيعي.
