  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: ar
  text: ولكن إن أفعل ما لا أريده، فإني أوافق الناموس في أنه صالح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن كنتُ
  rationale: يحفظ معنى الشرط في εἰ والقوة الاستدراكية الخفيفة في δέ، مع صياغة عربية طبيعية تلائم الفعل المضارع.
- source_word: ὃ οὐ θέλω τοῦτο
  choice: ما لا أريده
  rationale: ينقل التركيب الترابطي اليوناني بصيغة عربية موجزة وطبيعية من غير فقدان الإحالة إلى الشيء الذي لا يريده المتكلم.
- source_word: ποιῶ
  choice: أفعل
  rationale: مقابل مباشر وبسيط للفعل المضارع، ويحافظ على التباين مع الإرادة.
- source_word: σύμφημι
  choice: أوافق
  rationale: يفيد إقرار المتكلم بصحة حكم الناموس، ويحافظ على دلالة الموافقة دون توسيع المعنى.
- source_word: τῷ νόμῳ
  choice: الناموس
  rationale: مصطلح عربي كتابي واضح ومألوف للإشارة إلى الشريعة المعروفة في سياق الرسالة إلى رومية، مع أداة التعريف التي تقابل التعريف في اليونانية.
- source_word: καλός
  choice: صالح
  rationale: ينقل التقييم الإيجابي الأخلاقي للناموس، وهو تعبير عربي طبيعي في هذا السياق ولا يحصر المعنى في مجرد الصواب.
theological_decisions:
- issue: هل يقرر بولس هنا صلاح الناموس نفسه؟
  choice: أوافق الناموس على أنه صالح
  alternative: أقرّ بأن الناموس صالح
  rationale: تحافظ الصياغة المختارة على بنية الموافقة مع الناموس في σύμφημι τῷ νόμῳ، وعلى التصريح بصلاحه، من غير إضافة تفسير لطبيعة المتكلم أو حالته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الناموس» اتساقًا مع المصطلح الكتابي العربي المألوف في رسائل بولس، وحُفظ التوتر بين فعل ما لا يريده المتكلم وإقراره بصلاح الناموس.
