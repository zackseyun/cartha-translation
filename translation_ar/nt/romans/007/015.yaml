id: ROM.7.15
reference: Romans 7:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: ar
  text: فأنا لا أفهم ما أفعله؛ لأني لا أمارس ما أريده، بل أفعل ما أبغضه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: أفعله
  rationale: الفعل يدل هنا على ما ينجزه المتكلم أو يصدر عنه، وصيغة «ما أفعله» طبيعية وتحافظ على عمومية التعبير.
- source_word: οὐ γινώσκω
  choice: لا أفهم
  rationale: يمكن أن يعني حرفيًا «لا أعرف»، لكنه في هذا السياق يفيد عدم استيعاب السلوك أو إدراك منطقه، لذلك «لا أفهم» أوضح في العربية.
- source_word: πράσσω
  choice: أمارس
  rationale: يحافظ على التمييز اللفظي النسبي بين πράσσω وποιῶ، ويعبّر عن الفعل الذي يسلكه المرء عمليًا.
- source_word: θέλω
  choice: أريده
  rationale: ينقل الإرادة أو الرغبة المقصودة دون إضافة معنى أخلاقي غير مصرح به.
- source_word: μισῶ
  choice: أبغضه
  rationale: «أبغض» تعبير عربي فصيح مباشر عن الكراهية الشديدة التي يدل عليها الفعل.
- source_word: ποιῶ
  choice: أفعل
  rationale: ترجمة طبيعية للفعل العام «يفعل»، مع بقاء المقابلة بين المراد والمبغوض.
theological_decisions:
- issue: هوية المتكلم وزمن الخبرة الموصوفة
  choice: الإبقاء على صيغة المتكلم الحاضر من غير تفسير إضافي
  alternative: تحديد الكلام صراحة بأنه عن بولس قبل الإيمان أو بعده، أو عن الإنسان عمومًا
  rationale: النص نفسه لا يحسم في هذه الآية وحدها هوية الحالة اللاهوتية للمتكلم، لذا ينبغي حفظ التوتر التفسيري وعدم استيراد موقف مذهبي.
- issue: العلاقة المنطقية في γὰρ الثانية
  choice: ترجمتها «لأني» بوصفها تعليلًا لعدم الفهم
  alternative: ترجمتها «فإني» أو «لأن» بصياغة تفسيرية أقل تحديدًا
  rationale: 'التعليل ظاهر في السياق: عدم ممارسة ما يريده وفعل ما يبغضه يفسران قوله إنه لا يفهم ما يفعله، مع بقاء الصياغة موجزة.'
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. حافظت الصياغة على التوازي بين «ما أريده» و«ما أبغضه»، وعلى تنوع الأفعال في اليونانية قدر الإمكان من دون افتعال.
