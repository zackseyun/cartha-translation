  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: ar
  text: أمّا الآن، فلستُ أنا الذي أفعله بعدُ، بل الخطيئة الساكنة فيَّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولكن الآن، فلم أعد أنا أفعله، بل الخطيئة التي تسكن فيَّ».'
    reason: بديل تركيبي يحافظ على معنى الأصل وتوكيد ضمير المتكلم، مع تحويل اسم الفاعل إلى جملة موصولة.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أمّا الآن
  rationale: تنقل الانتقال المقابِل في السياق بصياغة عربية واضحة وطبيعية، مع إبقاء الدلالة الزمنية.
- source_word: οὐκέτι
  choice: بعدُ
  rationale: تفيد معنى «لم أعد» ضمن تركيب «لستُ... بعدُ»، وتحافظ على دلالة الانقطاع أو نفي الاستمرار.
- source_word: ἐγὼ
  choice: أنا
  rationale: أُبقي الضمير المنفصل لإظهار التوكيد الموجود في اليونانية.
- source_word: κατεργάζομαι
  choice: أفعله
  rationale: الفعل هنا يدل على ممارسة الفعل المذكور في السياق؛ وهذه الصياغة مباشرة ومفهومة من غير إثقال.
- source_word: αὐτὸ
  choice: ـه
  rationale: الضمير يعود إلى الفعل السابق ذكره، وإلحاقه بالفعل هو الأسلوب العربي الطبيعي.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: الخطيئة الساكنة فيَّ
  rationale: تحافظ على صورة الخطيئة كشيء يسكن في المتكلم، وعلى القوة الوصفية لاسم الفاعل في الأصل.
- source_word: οἰκοῦσα
  choice: الساكنة
  rationale: «الساكنة» تحفظ استعارة الإقامة والنبرة الأثقل في اليونانية أفضل من «التي تعيش».
theological_decisions:
- issue: قد يُفهم التمييز بين «أنا» و«الخطيئة الساكنة فيَّ» على أنه تنصّل من المسؤولية.
  choice: الإبقاء على التمييز الحاد كما يورده النص من غير شرح أو تلطيف.
  alternative: إعادة الصياغة لإبراز الصراع الداخلي أو إضافة تفسير يمنع سوء الفهم.
  rationale: النص نفسه يعرض هذا التوتر بوضوح، وينبغي للترجمة أن تحفظه بدل أن تحسمه تفسيريًا.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. حُفظ توكيد الضمير واستعارة سكنى الخطيئة، واستُخدم «بعدُ» في موضعه الفصيح الطبيعي.
