  verdict: revise
  source_fidelity: المسودة دقيقة في نقل البنية الأساسية والتقابل بين «روحية» و«جسدي»، وصيغة «مبيع» مناسبة لاسم المفعول التام πεπραμένος. لكن «تحت سلطان الخطية» توسّع تفسيري في المتن للتركيب اليوناني المختصر ὑπὸ τὴν ἁμαρτίαν («تحت الخطية»). والأدق إبقاء علاقة الخضوع في الحاشية، كما يفعل مسار التدقيق الإنجليزي.
  naturalness: النص فصيح وواضح، و«الشريعة روحية، أما أنا فجسدي» طبيعي ذو نبرة كتابية مناسبة. وعبارة «مبيع تحت الخطية» موجزة ومألوفة في الأسلوب الكتابي العربي، فلا تستلزم إضافة «سلطان» إلى المتن.
  terminology: «الشريعة» مقابل مناسب لـνόμος في هذا السياق، و«روحية/جسدي» يحفظان التقابل دون فرض قراءة مذهبية لـσάρκινος. ينبغي أن تظل دلالة الاستعباد أو السلطة توضيحًا في الحاشية لا جزءًا من الترجمة الأساسية لعبارة «تحت الخطية».
  issues:
