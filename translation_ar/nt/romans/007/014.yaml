    issue: زيادة «سلطان» في عبارة «تحت سلطان الخطية».
    rationale: الأصل يقول حرفيًا وباختصار «تحت الخطية»، مع دلالة خضوع مفهومة من السياق ومن صورة البيع. إضافة «سلطان» تشرح المعنى تفسيرًا صحيحًا محتملًا، لكنها تتجاوز درجة التفسير في النص اليوناني ومسار التدقيق الإنجليزي؛ لذا تنقل إلى الحاشية.
