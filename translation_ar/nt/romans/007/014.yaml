  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: ar
  text: فَإِنَّنَا نَعْلَمُ أَنَّ الشَّرِيعَةَ رُوحِيَّةٌ، أَمَّا أَنَا فَجَسَدِيٌّ[a]، مَبِيعٌ تَحْتَ الْخَطِيَّةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِنَ الجسد».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مبيع كالعبد تحت الخطية»، أي خاضع لسلطان الخطية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: نَعْلَمُ
  rationale: ينقل معنى المعرفة المستقرة التي يشترك فيها بولس ومخاطَبوه، وهو التعبير العربي المباشر والطبيعي.
- source_word: ὁ νόμος
  choice: الشَّرِيعَةَ
  rationale: «الشريعة» هي المقابل العربي المألوف للناموس في هذا السياق، وتحيل طبيعيًا إلى شريعة الله من غير زيادة تفسيرية في المتن.
- source_word: πνευματικός
  choice: رُوحِيَّةٌ
  rationale: يحافظ على التقابل الصريح مع σάρκινός، ويدل على ما يتصف بطابع روحي أو ينتمي إلى مجال الروح، من غير حسم ما إذا كانت الإشارة تحديدًا إلى الروح القدس.
- source_word: σάρκινός
  choice: جَسَدِيٌّ
  rationale: يحافظ على الصفة المشتقة من «الجسد» وعلى تقابلها مع «روحية»، ويتجنب إدخال تفسير زائد مثل «خاطئ» أو «ذو طبيعة خاطئة».
- source_word: πεπραμένος
  choice: مَبِيعٌ
  rationale: ينقل اسم المفعول التام الدال على حالة ناتجة من البيع، ويحفظ صورة البيع والاستعباد في العبارة.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: تَحْتَ سُلْطَانِ الْخَطِيئَةِ
  rationale: يبيّن في عربية طبيعية دلالة الخضوع الكامنة في تركيب «تحت الخطية»، مع إبقاء صورة الاستعباد وشرحها في الحاشية.
theological_decisions:
- issue: مدى تفسير لغة الجسد عند بولس
  choice: الإبقاء على «جسدي» في المتن.
  alternative: خاطئ؛ ذو طبيعة خاطئة؛ غير روحي
  rationale: «جسدي» يحفظ لفظ الجسد والتوتر المقصود في التقابل بين الشريعة الروحية والمتكلم الجسدي، ولا يحوّل العبارة إلى صياغة أنثروبولوجية أو مذهبية لاحقة.
- issue: هوية المتكلم وزمن الخبرة في «أما أنا فجسدي»
  choice: عدم تحديد ما إذا كان «أنا» يصف بولس قبل الإيمان أو بعده أو يمثل الإنسان تحت الشريعة.
  alternative: إضافة تفسير يحدد هوية «أنا» أو مرحلتها الروحية
  rationale: الآية نفسها لا تحسم هذا الخلاف التفسيري، لذلك يحافظ النص على صيغة المتكلم كما هي.
- issue: دلالة «روحية»
  choice: ترجمة πνευματικός بـ«روحية» دون إضافة «من الروح القدس».
  alternative: صادرة عن الروح؛ من الروح القدس
  rationale: اللفظ اليوناني يسمح بعلاقة مع الروح، لكن تعيين المرجع صراحةً بوصفه الروح القدس يتجاوز ما تصرح به الصفة وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «الشريعة» بدل «الناموس» لوضوحها للقارئ المعاصر، وحُفظ التقابل اللفظي «روحية/جسدي». وُضعت علامتا الحاشية في المتن عند اللفظين المعنيين.
