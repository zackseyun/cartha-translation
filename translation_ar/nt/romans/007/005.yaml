  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: ar
  text: لأننا حين كنا في الجسد[a]، كانت الأهواء الخاطئة[b] الناشئة عن الناموس تعمل في أعضائنا[c] لتثمر للموت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الطبيعة الخاطئة» أو «في حالتنا البشرية الساقطة».'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًّا: «أهواء الخطايا»؛ أي الأهواء التي تتصف بالخطية أو ترتبط بها.'
    reason: lexical_alternative
  - marker: c
    text: المقصود بـ«الأعضاء» أجزاء الجسد أو قواه بوصفها أدوات للفعل.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: الجسد
  rationale: يحفظ اللفظ البولسي وصورته اللاهوتية من غير حصره في تفسير «الطبيعة الخاطئة»، مع توضيح المعنى المحتمل في الحاشية.
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: أهواء الخطايا
  rationale: «أهواء» تؤدي معنى الدوافع والانفعالات، والإضافة تحافظ على الصياغة اليونانية وعلى التوتر الدلالي بدل اختزالها في صفة تفسيرية.
- source_word: διὰ τοῦ νόμου
  choice: التي بالناموس
  rationale: صياغة موجزة تحفظ القوة الوسيلية أو السببية المحتملة لحرف الجر من غير إضافة فعل مثل «أثارها» لا يرد صراحة في النص.
- source_word: ἐνηργεῖτο
  choice: كانت تعمل
  rationale: تنقل دلالة الماضي المستمر والفعل المؤثر الجاري في الأعضاء.
- source_word: μέλεσιν
  choice: أعضائنا
  rationale: المقابل العربي الطبيعي لأجزاء الجسد أو قواه بوصفها أدوات للفعل، ويحفظ استعمال بولس المتكرر.
- source_word: καρποφορῆσαι τῷ θανάτῳ
  choice: لكي تثمر للموت
  rationale: يحفظ استعارة الإثمار ويترك دلالة اللام متجهة إلى الموت، بما يشمل الغاية أو النتيجة السياقية.
theological_decisions:
- issue: 'دلالة ἐν τῇ σαρκί: هل تُترجم تفسيرياً أم يُحفظ لفظ الجسد؟'
  choice: في الجسد
  alternative: في الطبيعة الخاطئة / في حالتنا البشرية الساقطة
  rationale: يحفظ هذا الاختيار اصطلاح بولس والتوتر بين المعنى الجسدي والمعنى المتعلق بالحالة البشرية القديمة تحت سلطان الخطية، من غير فرض صياغة عقائدية واحدة.
- issue: علاقة الأهواء بالناموس في διὰ τοῦ νόμου
  choice: التي بالناموس
  alternative: التي جاءت بواسطة الناموس / التي أثارها الناموس
  rationale: النص يثبت الصلة الوسيلية أو السببية، لكنه لا يصرح بالفعل «أثار»؛ لذلك تُحفظ العبارة المقتضبة مع غموضها الحقيقي.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية وقورة. استُعمل «الناموس» للمحافظة على الاصطلاح البولسي الشائع والتمييز السياقي، مع إبقاء تراكيب الآية قريبة من الأصل حيث يحمل قربها دلالة لاهوتية.
