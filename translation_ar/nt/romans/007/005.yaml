  to: لأننا حين كنا في الجسد[a]، كانت الأهواء الخاطئة[b] الناشئة عن الناموس تعمل في أعضائنا[c] لتثمر للموت.
  rationale: 'تُستبدل الصياغتان الأشد حرفية والأقل سلاسة بتعبير عربي واضح: «الأهواء الخاطئة» للأهواء الموصوفة بالخطية، و«الناشئة عن الناموس» لصلة الأهواء بالناموس كما يفهمها السياق ومسار التدقيق الإنجليزي. وتبقى استعارة «لتثمر للموت» وسائر المصطلحات الرئيسة محفوظة، كما تبقى البدائل الحرفية والتفسيرية في الحواشي.'
