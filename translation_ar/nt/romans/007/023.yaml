  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: ar
  text: لكني أرى ناموسًا آخر[a] في أعضائي، يحارب ناموس ذهني ويسبيني إلى ناموس الخطيئة[b] الكائن في أعضائي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «ناموس» في هذه الاستعمالات المتكررة: «مبدأ» أو «قوة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يسبيني في ناموس الخطيئة»؛ و«إلى» في المتن تعبّر عن الوقوع في أسره والخضوع لسلطانه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: أرى
  rationale: يحافظ المضارع البسيط على حيوية وصف بولس لإدراكه المباشر.
- source_word: ἕτερον νόμον
  choice: ناموسًا آخر
  rationale: «آخر» تحفظ المقابلة مع الناموس المذكور في السياق، و«ناموس» يبقي التكرار المقصود للفظ νόμος.
- source_word: νόμον / νόμῳ (المتكرر)
  choice: ناموس
  rationale: تكرار اللفظ نفسه يحفظ القوة البلاغية والتوتر بين ناموس الذهن وناموس الخطيئة، بدل تفسيره في المتن على أنه مجرد «مبدأ» أو «قوة».
- source_word: ἐν τοῖς μέλεσίν μου
  choice: في أعضائي
  rationale: تعبير عربي واضح يحفظ الصورة الجسدية الملموسة ولا يختزلها في «جسدي».
- source_word: ἀντιστρατευόμενον
  choice: يحارب
  rationale: يحفظ الصورة العسكرية بعبارة عربية طبيعية ومباشرة.
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: ناموس ذهني
  rationale: «الذهن» ينقل هنا معنى الملكة العاقلة والإرادية بوضوح، مع إبقاء تركيب «ناموس» المتكرر.
- source_word: αἰχμαλωτίζοντά με
  choice: يأسرني
  rationale: يحفظ صورة الحرب والأسر الواردة في اليونانية بصياغة موجزة وقوية.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: لناموس الخطيئة
  rationale: اللام بعد «يأسرني» تعبّر طبيعيًا في العربية عن إخضاع الشخص لسلطان ذلك الناموس، مع بيان الصيغة الحرفية في الحاشية.
- source_word: ἁμαρτίας
  choice: الخطيئة
  rationale: المقابل العربي المعياري الواضح للمصطلح في هذا السياق.
theological_decisions:
- issue: هل يُترجم νόμος إلى «ناموس» أم يُفسَّر بأنه «مبدأ» أو «قوة»؟
  choice: إبقاء «ناموس» في المواضع الثلاثة في المتن.
  alternative: ترجمة موضع أو أكثر بـ«مبدأ» أو «قوة».
  rationale: يحفظ ذلك تكرار بولس المقصود والتوتر اللاهوتي بين ناموس الذهن والقوة المضادة المرتبطة بالخطيئة، من غير حسم طبيعة «الناموس» بتفسير زائد.
- issue: دلالة ἐν مع فعل الأسر
  choice: «يأسرني لناموس الخطيئة».
  alternative: «يأسرني في ناموس الخطيئة» أو «يأسرني تحت ناموس الخطيئة».
  rationale: الصياغة المختارة عربية طبيعية تفيد الوقوع في قبضة ناموس الخطيئة والخضوع له، بينما تُحفظ البنية الحرفية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «ناموس» لصلته الاصطلاحية بالسياق البولسي وللحفاظ على التكرار، مع شرح البدائل في الحاشية. وجاءت الأفعال «يحارب» و«يأسرني» لتحفظ الصورة العسكرية المتصلة.
