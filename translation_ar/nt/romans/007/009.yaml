  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: ar
  text: أَمَّا أَنَا فَكُنْتُ يَوْمًا حَيًّا بِمَعْزِلٍ عَنِ النَّامُوسِ، وَلَكِنْ لَمَّا جَاءَتِ الْوَصِيَّةُ، عَادَتِ الْخَطِيئَةُ إِلَى الْحَيَاةِ[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دبَّتِ الحياةُ في الخطيئة».'
    reason: بديل تعبيري ينقل صورة مجيء الحياة، في حين تحافظ الترجمة الرئيسة على كون الخطيئة هي الفاعل وعلى إيحاء «عادت إلى الحياة» في ἀνέζησεν.
lexical_decisions:
- source_word: ἔζων
  choice: كنتُ يومًا حيًّا
  rationale: يحفظ معنى الحالة «كنت حيًّا» والتقابل مع الموت في السياق، بدل الاقتصار على «كنت أعيش».
- source_word: χωρὶς νόμου
  choice: بمعزل عن الناموس
  rationale: ينقل قوة الانفصال في χωρίς، ويستعمل «الناموس» بوصفه اللفظ الكتابي العربي الواضح في هذا السياق البولسي.
- source_word: ποτέ
  choice: يومًا
  rationale: تعبير زمني عربي طبيعي يفيد «في وقت سابق» من غير إضافة تفسير.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: لما جاءت الوصية
  rationale: يحوّل تركيب المضاف المطلق إلى جملة زمنية عربية طبيعية مع إبقاء مجيء الوصية حدثًا.
- source_word: ἐντολῆς
  choice: الوصية
  rationale: يلائم الاصطلاح الكتابي وصلتها بالناموس وبالسياق اللاحق.
- source_word: ἁμαρτία
  choice: الخطيئة
  rationale: يحفظ المفرد وتشخيص الخطيئة بوصفها فاعلًا في العبارة.
- source_word: ἀνέζησεν
  choice: دبّت الحياة في الخطيئة
  rationale: تعبير عربي واضح يحفظ صورة عودة الحياة أو نشوئها، مع إبقاء احتمال معنى «عاشت من جديد» في الحاشية.
theological_decisions:
- issue: هل قول بولس سيرة ذاتية محضة أم تمثيل لإسرائيل أو للبشرية؟
  choice: الإبقاء على ضمير المتكلم البسيط بلا توسع تفسيري
  alternative: التصريح بأن بولس يتحدث حصريًا عن خبرته الشخصية، أو بأنه يتكلم ممثلًا لإسرائيل أو للبشرية
  rationale: النص اليوناني في هذه الآية وحدها لا يحسم المسألة، لذلك تُصان مساحة الغموض والتوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «الناموس» للمحافظة على التمييز الاصطلاحي بين νόμος وἐντολή («الوصية»)، مع صياغة طبيعية غير مثقلة بالتفسير.
