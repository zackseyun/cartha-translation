- from: أَمَّا أَنَا فَكُنْتُ يَوْمًا حَيًّا بِمَعْزِلٍ عَنِ النَّامُوسِ، وَلَكِنْ لَمَّا جَاءَتِ الْوَصِيَّةُ، دَبَّتِ الْحَيَاةُ فِي الْخَطِيئَةِ[a]،
  to: أَمَّا أَنَا فَكُنْتُ يَوْمًا حَيًّا بِمَعْزِلٍ عَنِ النَّامُوسِ، وَلَكِنْ لَمَّا جَاءَتِ الْوَصِيَّةُ، عَادَتِ الْخَطِيئَةُ إِلَى الْحَيَاةِ[a]،
  rationale: استُبدلت العبارة الأخيرة بصياغة تسند الفعل إلى «الخطيئة» نفسها، وتحفظ تشخيصها في النص اليوناني ومعنى ἀνέζησεν («عادت إلى الحياة/انتعشت»). وبقيت بنية الآية ومصطلحاتها وغموض ضمير المتكلم من دون توسع تفسيري.
