review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تحافظ على ترتيب العبارة وعناصرها الرئيسة: المتكلم بضمير المتكلم، والحياة السابقة بمعزل عن الناموس، ومجيء الوصية، والخطيئة المفردة. لكن «دبّت الحياة في الخطيئة» تجعل الخطيئة وعاءً تدب فيه الحياة، بدل أن تبقى الخطيئة ذاتها الفاعل المشخَّص للفعل ἀνέζησεν. والصياغة المنقحة تعيد الخطيئة فاعلًا وتُظهر بوضوح معنى عودة الحياة الذي يلائمه الفعل اليوناني.'
  naturalness: «عادت الخطيئة إلى الحياة» فصيحة حديثة وواضحة، وتحافظ على الصورة البلاغية دون تركيب غير مألوف. أما «كنت يومًا حيًّا» و«بمعزل عن الناموس» و«لما جاءت الوصية» فطبيعية في سجل عربي كتابي معاصر.
  terminology: «الناموس» مقابل νόμος و«الوصية» مقابل ἐντολή و«الخطيئة» مقابل ἁμαρτία اختيارات متسقة ودقيقة. لا يلزم توسيع العبارة لتقرير ما إذا كان ضمير المتكلم سيرة ذاتية أو تمثيلًا أوسع.
  issues:
  - severity: medium
    issue: تضع العبارة الحالية الحياة «في الخطيئة» بدل أن تسند فعل الحياة إلى الخطيئة.
    rationale: ἡ ἁμαρτία ἀνέζησεν تجعل «الخطيئة» هي الفاعل المشخَّص. «دبّت الحياة في الخطيئة» تغيّر هذه العلاقة النحوية والتصويرية، ولو بقي المعنى العام قريبًا.
  revised_text: أَمَّا أَنَا فَكُنْتُ يَوْمًا حَيًّا بِمَعْزِلٍ عَنِ النَّامُوسِ، وَلَكِنْ لَمَّا جَاءَتِ الْوَصِيَّةُ، عَادَتِ الْخَطِيئَةُ إِلَى الْحَيَاةِ[a]،
