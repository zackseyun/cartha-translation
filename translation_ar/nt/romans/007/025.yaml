    rationale: 'اليونانية تقول: «أنا نفسي ... أخدم شريعة الله بالذهن»، لا «أخدم بنفسي». ينبغي أن يرد التوكيد αὐτὸς ἐγώ في «أنا نفسي»، وأن يرد τῷ νοῒ في «بذهني».'
  - severity: medium
    issue: «بيسوع المسيح» أقل وضوحًا في بيان الوساطة
    rationale: διά مع المضاف إليه تعني «بواسطة/عن طريق». وإظهار ذلك بـ«بواسطة يسوع المسيح» أوضح وأدق في العربية المعاصرة.
