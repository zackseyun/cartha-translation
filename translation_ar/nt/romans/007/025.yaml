- from: الشكر لله بيسوع المسيح ربنا! إذًا، أنا نفسي أخدم بنفسي شريعة الله، وأما بجسدي فأخدم شريعة الخطية.[a][b]
  to: الشكر لله بواسطة يسوع المسيح ربنا! إذًا فأنا نفسي أخدم شريعة الله بذهني، وأخدم بجسدي[a] شريعة الخطية[b].
  rationale: 'صُحح إسناد التوكيد الشخصي وقيد الأداة بحسب النص اليوناني: «أنا نفسي» لـαὐτὸς ἐγώ، و«بذهني» لـτῷ νοῒ. كما أُظهرت دلالة الوساطة في διά بـ«بواسطة»، ووُضعت علامات الحواشي بجوار العبارات التي تشرحها، مع إبقاء الغموض المقصود في «الجسد» و«شريعة الخطية».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:59Z'
review_pass:
  verdict: revise
  source_fidelity: 'المسودة تنقل البنية الأساسية للآية ومقابلة الذهن/الجسد وشريعة الله/شريعة الخطية. لكن «أخدم بنفسي شريعة الله» لا تقابل اليونانية: «أنا نفسي» هي التوكيد الشخصي، بينما «بذهني» هو قيد الأداة؛ وإضافة «بنفسي» تُكرر التوكيد وتُسقط قيد الذهن. كما أن «بواسطة» أوضح في أداء διά الدالة على الوساطة.'
  naturalness: 'الصياغة المنقحة فصحى حديثة واضحة: «أنا نفسي أخدم ... بذهني» تحافظ على التوكيد وعلى التقابل دون تكرار غير طبيعي. ونُقلت مواضع علامات الحواشي إلى الألفاظ التي تتعلق بها.'
  terminology: أُبقي «يسوع المسيح ربنا»، و«شريعة الله»، و«الجسد»، و«شريعة الخطية». وهذه تحافظ على تكرار νόμος وعلى عدم تفسير σάρξ تفسيرًا مذهبيًا في المتن. وتظل «الطبيعة الخاطئة» بديلًا تفسيريًا في الحاشية فقط.
