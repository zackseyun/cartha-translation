  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: ar
  text: الشكر لله بواسطة يسوع المسيح ربنا! إذًا فأنا نفسي أخدم شريعة الله بذهني، وأخدم بجسدي[a] شريعة الخطية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالطبيعة الخاطئة» بدل «بجسدي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مبدأ الخطية» بدل «شريعة الخطية».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: الشكر لله
  rationale: التركيب تعبير اصطلاحي عن حمد الله وشكره، لا استعمال مباشر لكلمة «النعمة».
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: بيسوع المسيح ربنا
  rationale: حرف διά مع المضاف إليه يدل على الوساطة؛ و«المسيح» المقابل العربي الطبيعي للقب Χριστός، مع إبقاء «ربنا» بصياغة عربية مألوفة.
- source_word: Ἄρα οὖν
  choice: إذًا
  rationale: تفيد الأداتان معًا الاستنتاج والتلخيص، وتؤدي «إذًا» هذا المعنى بوضوح من غير حشو.
- source_word: αὐτὸς ἐγώ
  choice: أنا نفسي
  rationale: يحافظ التعبير على التوكيد الشخصي الواضح في اليونانية.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: بذهني ... وبجسدي
  rationale: تحافظ الصياغة على التقابل بين الذهن والجسد وعلى الداتيف الأداتي في طرفي العبارة.
- source_word: δουλεύω
  choice: أخدم
  rationale: «أخدم» عربية طبيعية وتحفظ معنى الخضوع، وإن كان الفعل يحمل أيضًا إيحاء العبودية.
- source_word: νόμῳ θεοῦ
  choice: شريعة الله
  rationale: «شريعة» تحافظ على المصطلح القانوني في سياق رومية 7 وعلى الإضافة إلى الله.
- source_word: σάρξ
  choice: الجسد
  rationale: يحفظ لفظ بولس والتوتر الدلالي فيه بدل تفسيره مباشرة بأنه «الطبيعة الخاطئة».
- source_word: νόμῳ ἁμαρτίας
  choice: شريعة الخطية
  rationale: تكرار «شريعة» يحفظ الموازاة المقصودة مع «شريعة الله»، دون حسم ما إذا كان νόμος يعني هنا قانونًا أم مبدأً فاعلًا.
theological_decisions:
- issue: دلالة σάρξ في السياق الأخلاقي عند بولس
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: النص يقول σάρξ ولا يصرح بتعبير يعني «الطبيعة الخاطئة»؛ لذلك يحفظ «الجسد» الغموض والتوتر الأنثروبولوجي.
- issue: دلالة νόμος في عبارة νόμῳ ἁμαρτίας
  choice: شريعة الخطية
  alternative: مبدأ الخطية
  rationale: إبقاء اللفظ نفسه يصون الموازاة مع «شريعة الله»، بينما «مبدأ» تفسير محتمل لكنه أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الخطية» اتساقًا مع المصطلح الكتابي العربي، وحُفظ التقابل التركيبي بين الذهن والجسد وبين شريعتي الله والخطية.
