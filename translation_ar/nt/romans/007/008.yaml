base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: ar
  text: لكن الخطيئة، إذ اغتنمت، عن طريق الوصية، فرصةً[a]، أنتجت فيَّ كلَّ نوع من الطمع[b]؛ لأن الخطيئة من دون الشريعة ميتة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مناسبةً».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كلَّ نوع من الرغبة»؛ والسياق هنا، في ضوء الوصية «لا تطمع»، يرجّح معنى الطمع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν ... λαβοῦσα
  choice: اتخذت ... فرصةً
  rationale: ينقل هذا التعبير صورة الخطيئة وهي تستغل الوصية نقطةَ انطلاق، وهو عربي طبيعي يحفظ قوة الفعل من غير توسع تفسيري.
- source_word: ἡ ἁμαρτία
  choice: الخطيئة
  rationale: أُبقيت الخطيئة فاعلًا نحويًّا للمحافظة على تشخيصها في النص اليوناني.
- source_word: διὰ τῆς ἐντολῆς
  choice: من الوصية
  rationale: مع تركيب «اتخذت ... فرصة» تؤدي «من» معنى الوسيلة التي استغلتها الخطيئة، وتشير «الوصية» بالمفرد إلى الوصية المذكورة في السياق السابق.
- source_word: κατειργάσατο
  choice: ولَّدت
  rationale: يفيد الفعل إحداث نتيجة وإنتاجها؛ و«ولَّدت» واضحة وقوية في هذا السياق.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: كلَّ نوع من الطمع
  rationale: تحدد الوصية السابقة، «لا تطمع»، المعنى السياقي لـἐπιθυμία، وتوضح عبارة «كل نوع» شمول πᾶσαν بأسلوب عربي سليم.
- source_word: χωρὶς γὰρ νόμου
  choice: لأن ... من دون الشريعة
  rationale: تحفظ «لأن» القوة التفسيرية لـγάρ، وتنقل «من دون الشريعة» معنى χωρὶς νόμου في سياق حديث بولس عن الشريعة.
- source_word: νεκρά
  choice: ميتة
  rationale: أُبقيت الاستعارة الحادة كما هي بدل تفسيرها بلفظ مثل «خامدة» أو «غير فعالة».
theological_decisions:
- issue: تشخيص الخطيئة ومعنى كونها «ميتة» من دون الشريعة
  choice: الإبقاء على الخطيئة بوصفها فاعلًا يتخذ فرصة ويولِّد الطمع، وعلى وصفها بأنها «ميتة».
  alternative: تجريد العبارة من التشخيص أو تفسير «ميتة» بمعنى «غير فعالة».
  rationale: يعرض اليوناني الخطيئة كقوة فاعلة ويستخدم استعارة مقصودة؛ لذا ينبغي حفظ الصورة والتوتر اللاهوتي من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على تشخيص الخطيئة وعلى استعارة الموت، واختارت تركيبًا عربيًّا طبيعيًّا لصورة استغلال الوصية.
