  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: ar
  text: لا يغلبنَّك الشرّ، بل اغلب الشرَّ بالخير.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تدع ما كان شرًّا يغلبك، بل اغلب ما كان شرًّا بما كان خيرًا». تستعمل اليونانية صفاتٍ محايدةً معرّفة، ويمكن فهمها إما على نحوٍ مجرّد («الشرّ» و«الخير») أو بمعنى «ما كان شرًّا» و«ما كان خيرًا».'
    reason: بديل معجمي يحفظ احتمال الصياغة الكيفية في الصفات اليونانية المعرّفة.
lexical_decisions:
- source_word: μὴ νικῶ
  choice: لا يغلبنَّك
  rationale: ينقل النهي بصيغة المبني للمجهول في اليونانية إلى تركيب عربي طبيعي يحافظ على صورة الغلبة، مع بقاء المخاطب مفردًا.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: الشرّ
  rationale: تدل ὑπό مع المضاف إليه على الفاعل في العبارة المبنية للمجهول، والصفة المحايدة المعرّفة تُفهم هنا على نحو جامع بمعنى «الشرّ» أو «ما هو شرّ».
- source_word: ἀλλὰ νίκα
  choice: بل اغلب
  rationale: تحافظ «بل» على المقابلة القوية، و«اغلب» تنقل فعل الأمر المبني للمعلوم وتكرر جذر الغلبة كما في اليونانية.
- source_word: ἐν τῷ ἀγαθῷ
  choice: بالخير
  rationale: الباء العربية تعبّر طبيعيًا عن معنى الوسيلة الذي تؤديه ἐν مع المجرور هنا؛ أي إن الخير هو الوسيلة التي يُغلب بها الشر.
- source_word: τὸ κακόν
  choice: الشرّ
  rationale: تنقل الصفة المحايدة المعرّفة بوصفها فئة أخلاقية عامة، وتحافظ على المقابلة الموجزة بين الشر والخير.
theological_decisions:
- issue: هل يُفهم κακός/ἀγαθός على أنهما فئتان أخلاقيتان أم يُشخَّص الشر في عبارة مثل «الشرير»؟
  choice: 'فئتان أخلاقيتان عامتان: «الشرّ» و«الخير»'
  alternative: تشخيص الشر، مثل «الشرير»
  rationale: الصيغ اليونانية محايدة، ولا يوجب السياق إشارة شخصية إلى الشيطان أو إلى شخص شرير بعينه. كما أن سياق رومية 12 يتناول الاستجابة الأخلاقية للإساءة، لذلك لا تُضاف هوية شخصية لا يصرح بها النص.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة حاثّة. استُخدم جذر «غلب» في الشطرين للمحافظة على التكرار البلاغي في الأصل، وجاءت «بالخير» عربية طبيعية للدلالة على الوسيلة.
