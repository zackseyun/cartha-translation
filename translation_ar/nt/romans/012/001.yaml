reference: Romans 12:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: ar
  text: لذلك أناشدكم، أيها الإخوة[a]، برأفات الله، أن تقدِّموا أجسادكم ذبيحةً حيّةً مقدسةً مرضيةً لله؛ وهذه هي عبادتكم المعقولة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات». يقول اليوناني «الإخوة»، وكثيرًا ما تُستعمل صيغة المذكر لمخاطبة جماعة تضم رجالًا ونساءً.
    reason: alternative_reading
  - marker: b
    text: أو «عبادتكم الروحية» أو «خدمتكم العقلية». يمكن للعبارة اليونانية أن تدل على عبادة أو خدمة عقلية أو لائقة أو روحية.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أناشدكم
  rationale: ينقل قوة الحث الرسولي الجاد، مع بقاء العبارة طبيعية وكريمة في العربية المعاصرة.
- source_word: οὖν
  choice: لذلك
  rationale: يحفظ الاستنتاج المبني على الحجة السابقة في رومية 1–11.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع بيان شمولها المحتمل للمؤمنات في الحاشية.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: برأفات الله
  rationale: يحفظ جمع οἰκτιρμῶν ويعبّر عن أساس المناشدة؛ و«رأفات» لفظ عربي واضح ودال على أوجه رحمة الله وعطفه.
- source_word: παραστῆσαι
  choice: أن تقدِّموا
  rationale: يلائم السياق القرباني ويحفظ معنى وضع الشيء أمام الله وتكريسه له.
- source_word: τὰ σώματα ὑμῶν
  choice: أجسادكم
  rationale: ينقل اللفظ الملموس في المصدر بدل تعميمه إلى «أنفسكم».
- source_word: θυσίαν ζῶσαν
  choice: ذبيحةً حيّةً
  rationale: يحفظ الصورة القربانية والمفارقة المقصودة في وصف الذبيحة بأنها حية.
- source_word: ἁγίαν
  choice: مقدسةً
  rationale: يدل على كون الذبيحة مكرسة لله ومنفصلة له، وهو وصف مباشر ومألوف.
- source_word: εὐάρεστον τῷ θεῷ
  choice: مرضيةً لله
  rationale: ينقل معنى ما يسر الله، لا مجرد ما يقبله بالحد الأدنى.
- source_word: λογικὴν
  choice: المعقول
  rationale: يحافظ على صلة اللفظ بالعقل والمنطق والملاءمة، من غير حسمه في معنى «الروحي»؛ وتُذكر البدائل في الحاشية.
- source_word: λατρείαν
  choice: تعبدكم
  rationale: يعبّر عن العبادة والخدمة المقدمة لله، وينسجم مع الصورة القربانية في السياق.
theological_decisions:
- issue: دلالة ἀδελφοί عند مخاطبة جماعة قد تضم رجالًا ونساءً
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: احتُفظ بالشكل المذكر الصريح في المتن، مع توضيح الاستعمال التمثيلي الشامل المحتمل في الحاشية، تجنبًا لتضييق الجمهور أو تعديل صورة المصدر بلا بيان.
- issue: معنى λογικὴν λατρείαν
  choice: تعبدكم المعقول
  alternative: عبادتكم الروحية؛ أو خدمتكم العقلية
  rationale: العبارة اليونانية تحتمل معنى العبادة الموافقة للعقل أو اللائقة، كما قد تُفهم بمعنى روحي. يحافظ المتن على الصلة اللفظية بالعقل ولا يحسم الجدل، وتعرض الحاشية البدائل الأساسية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. حُفظت الصورة القربانية وألفاظ «الأجساد» و«ذبيحة حية»، كما حُفظ جمع «رأفات». وُضع الفاصل المنقوط قبل الجملة التفسيرية الأخيرة لبيان أن العبارة تصف تقديم الأجساد كله بأنه التعبد المقصود.
