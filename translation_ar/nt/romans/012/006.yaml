  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: ar
  text: 'ولنا مواهب مختلفة بحسب النعمة التي أُعطيت لنا: فإن كانت نبوّة، فلتكن على قدر الإيمان.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بقدر إيمان المرء»؛ ويحتمل أيضًا: «بما يتفق مع الإيمان». فالعبارة اليونانية قد تشير إلى مقدار إيمان المتكلم، أو إلى موافقة النبوّة لمضمون الإيمان المسيحي.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: ولنا
  rationale: صياغة عربية طبيعية تحفظ معنى الحال والاستمرار من السياق السابق، وتجعل δὲ انتقالية دون فرض مقابلة قوية لا يقتضيها النص.
- source_word: χαρίσματα ... διάφορα
  choice: مواهب مختلفة
  rationale: ينقل «مواهب» المعنى البولسي المعتاد لـχαρίσματα، وتحفظ «مختلفة» دلالة التنوع بصياغة عربية موجزة.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: بحسب النعمة التي أُعطيت لنا
  rationale: «بحسب» تعبّر عن المطابقة أو التناسب، و«النعمة» تحفظ دلالة العطية الإلهية المُمكِّنة.
- source_word: εἴτε προφητείαν
  choice: فإن كانت نبوّة
  rationale: تُظهر الصياغة العربية الحذف المفهوم في اليونانية، وتقدّم أول عنصر في تعداد المواهب دون إضافة «موهبة» إلى النص صراحة.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: فبحسب نسبة الإيمان
  rationale: تحفظ «نسبة» معنى التناسب أو العلاقة الملائمة في ἀναλογία، بينما تترك «الإيمان» دون تقييد كي لا يُحسم هل المقصود مقدار إيمان المتكلم أم مضمون الإيمان المسيحي.
theological_decisions:
- issue: دلالة κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: بحسب نسبة الإيمان
  alternative: بقدر إيمان المرء؛ أو بما يتفق مع الإيمان
  rationale: العبارة اليونانية موجزة وتحتمل تعلقها بمقدار الإيمان المعطى للمتنبئ أو بموافقة النبوّة لمضمون الإيمان. أبقى المتن هذا التوتر، وذكرت الحاشية وجهي الفهم الرئيسيين.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «ولنا» بدل ترجمة اسم الفاعل اليوناني ترجمة حرفية ثقيلة، وحُفظ الإيجاز والتوازي تمهيدًا لاستمرار قائمة المواهب في الآيات التالية.
