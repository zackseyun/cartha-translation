lexical_decisions:
- source_word: σπουδῇ
  choice: الاجتهاد
  rationale: يدل اللفظ على الجد والحرص والاجتهاد. واختيار «الاجتهاد» واضح في العربية ويُبقي التضاد المباشر مع التكاسل.
- source_word: ὀκνηροί
  choice: متكاسلين
  rationale: ينقل معنى التراخي والفتور عن أداء الواجب بلغة عربية معاصرة مفهومة، ويناسب اقترانه بالاجتهاد.
- source_word: πνεύματι
  choice: في الروح
  rationale: يحافظ هذا التعبير قدر الإمكان على عدم تعيين المرجع في اليونانية، مع رجحان فهمه هنا على أنه روح المؤمن أو باطنه، دون حذف احتمال الإشارة إلى الروح القدس.
- source_word: ζέοντες
  choice: متّقدين
  rationale: الفعل يعني حرفيًا الغليان ويُستعمل هنا مجازًا للحرارة والحماسة. و«متّقدين» يحفظ الصورة وقوتها بأسلوب عربي طبيعي.
- source_word: κυρίῳ
  choice: الرب
  rationale: الترجمة المألوفة للقب κύριος في هذا السياق البولسي، مع إبقاء اللقب من غير زيادة تفسيرية.
- source_word: δουλεύοντες
  choice: اخدموا
  rationale: مع أن الفعل مرتبط لغويًا بالعبودية، فإن «اخدموا» ينقل هنا معنى الطاعة والتكريس للرب بوضوح، ويلائم صيغة الوصايا المتتابعة.
theological_decisions:
- issue: مرجع πνεύματι في عبارة τῷ πνεύματι ζέοντες
  choice: روح المؤمن أو باطنه
  alternative: الروح القدس
  rationale: سياق الوصايا الأخلاقية المتوازية يرجّح وصف الحالة الباطنية للمؤمن، لكن غياب ما يحسم المرجع في النص اليوناني يقتضي إبقاء احتمال الإشارة إلى الروح القدس في الحاشية.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة، مع جمل أمرية متوازية وفواصل منقوطة تعكس إيقاع العبارات اليونانية الثلاث. أُبقيت العبارة «في الروح» مع حاشية لصون الغموض الحقيقي في المرجع.
