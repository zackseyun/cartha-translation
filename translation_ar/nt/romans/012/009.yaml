- source_word: τῷ ἀγαθῷ
  choice: الْخَيْرِ
  rationale: مقابل عربي موجز للصفة المحايدة المستعملة اسميًا، ويحافظ على الموازاة المباشرة مع «الشر».
theological_decisions:
- issue: قوة العبارة الاسمية واسمَي الفاعل في سياق الوصايا
  choice: 'صياغة الآية كسلسلة من الحثوص: «لتكن... امقتوا... تمسكوا...»'
  alternative: «المحبة بلا رياء، ماقتين الشر، متمسكين بالخير»
  rationale: اليونانية تبدأ بعبارة اسمية بلا فعل، ثم تستعمل اسمَي فاعل، لكن سياق رومية 12 سياق وصايا متتابعة؛ لذلك تُظهر صيغة الحث المقصود الخطابي مع إبقاء الإيجاز والتوازي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، بصياغة موجزة وإيقاع حثّي. استُعمل «امقتوا» للحفاظ على شدة ἀποστυγοῦντες، و«تمسكوا» لبيان قوة الالتصاق في κολλώμενοι. وُضعت علامة الحاشية [a] في المتن.
