  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: ar
  text: لا تردّوا على أحد شرًّا بشرّ، بل اعتنوا بما هو حسن[a] أمام جميع الناس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بما هو مشرّف» أو «بما هو نبيل».'
    reason: بديل معجمي لكلمة καλὰ، التي قد تدل على ما هو حسن أو كريم أو مشرّف.
lexical_decisions:
- source_word: μηδενὶ
  choice: على أحد
  rationale: جاءت نكرة في سياق النفي، فتحفظ شمول النهي، وتنسجم عربيًا مع تركيب «تردّوا على أحد».
- source_word: κακὸν ἀντὶ κακοῦ
  choice: شرًّا بشرّ
  rationale: يحفظ القوة الأخلاقية والتقابل الانتقامي في العبارة اليونانية من غير حصرها في الضرر الشخصي.
- source_word: ἀποδιδόντες
  choice: تردّوا
  rationale: اسم الفاعل اليوناني يحمل في السياق قوة الأمر، و«تردّوا» تعبر طبيعيًا عن مقابلة الفعل بمثله.
- source_word: προνοούμενοι
  choice: اهتمّوا
  rationale: يفيد التفكير المقصود والعناية المسبقة بما ينبغي فعله، وصيغة الأمر تنقل القوة الحثية في السياق.
- source_word: καλὰ
  choice: بما هو حسن
  rationale: «حسن» يستوعب معنى الخير الأخلاقي وما يُعَدّ كريمًا أو مشرّفًا، من غير قصر العبارة على السمعة الاجتماعية.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: في نظر جميع الناس
  rationale: ينقل معنى الظهور أمام الناس وتقييمهم، مع إبقاء ἀνθρώπων عامًا شاملًا للبشر.
theological_decisions:
- issue: الدلالة الأخلاقية والاجتماعية لكلمة καλὰ
  choice: بما هو حسن
  alternative: بما هو مشرّف أو نبيل
  rationale: تحتمل الكلمة الخير في ذاته وما يراه الناس كريمًا وجديرًا بالتقدير. اختير اللفظ الأوسع في المتن، وحُفظت الدلالة البديلة في الحاشية كيلا يُختزل الحث في مجرد المظهر العام.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم خطاب الجمع المباشر لنقل القوة الحثية لاسمي الفاعل في السياق، مع صياغة طبيعية وتجنّب التفسير المذهبي.
