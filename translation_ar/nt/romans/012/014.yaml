  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: ar
  text: بارِكوا الذين يضطهدونكم[a]؛ بارِكوا ولا تلعنوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين يطاردونكم». يمكن أن يعني الفعل اليوناني «يطارد»، لكن الأرجح هنا أنه يشير إلى الاضطهاد العدائي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: بارِكوا
  rationale: فعل أمر للجمع، و«بارِكوا» هو المقابل العربي الطبيعي الموجز الذي يحفظ المعنى الديني والأخلاقي. وأُبقي تكراره حفاظًا على توكيد بولس.
- source_word: τοὺς διώκοντας
  choice: الذين يضطهدونكم
  rationale: اسم الفاعل المعرّف مستعمل استعمال الاسم، أي «الذين يضطهدون». ومع أن διώκω قد يعني «يطارد»، فإن السياق الأخلاقي المتعلق بمواجهة الخصوم يرجّح معنى الاضطهاد. أُضيف ضمير المخاطبين لأنه مفهوم من سياق الخطاب ولازم للوضوح بالعربية.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل الأمر الإيجابي بالنهي، وتحفظ الواو البناء المتعاطف المباشر في اليونانية.
- source_word: μὴ καταρᾶσθε
  choice: لا تلعنوا
  rationale: نهي بصيغة المضارع، و«لا تلعنوا» تعبير عربي واضح ومباشر يحفظ التضاد مع «بارِكوا» من غير توسع تفسيري.
theological_decisions:
- issue: دلالة διώκω في السياق
  choice: فُهمت هنا بمعنى الاضطهاد العدائي
  alternative: الذين يطاردونكم
  rationale: يمكن للفعل أن يعني «يطارد»، لكن استعماله في السياقات الأخلاقية المسيحية المبكرة، مع المقابلة بين البركة واللعن، يرجّح أن المقصود أناس يعاملون المخاطبين بعداء واضطهاد. والبديل محفوظ في الحاشية لإبقاء المجال الدلالي ظاهرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على تكرار فعل الأمر والتقابل البلاغي بين البركة واللعن. استُخدم «يضطهدونكم» في المتن بوصفه الأنسب للسياق، ووُضع المعنى الأوسع في الحاشية.
