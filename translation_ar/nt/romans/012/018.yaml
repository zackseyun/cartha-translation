  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: ar
  text: إِنْ أَمْكَنَ[a]، فَبِقَدْرِ مَا يَتَوَقَّفُ الْأَمْرُ عَلَيْكُمْ، عِيشُوا بِسَلَامٍ مَعَ جَمِيعِ النَّاسِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إِنْ كَانَ ذَلِكَ مُمْكِنًا، فَمِنْ جِهَتِكُمْ سَالِمُوا جَمِيعَ النَّاسِ».'
    reason: بديل لغوي يحافظ بصورة أقرب على ترتيب العبارة اليونانية، ولا سيما «فمن جهتكم» في مقابل τὸ ἐξ ὑμῶν.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: إِنْ أَمْكَنَ
  rationale: صياغة عربية موجزة وطبيعية تحفظ الشرط الواقعي في النص، فلا تجعل الوصية وعدًا بإمكان تحقيق السلام في كل ظرف.
- source_word: τὸ ἐξ ὑμῶν
  choice: فَبِقَدْرِ مَا يَتَوَقَّفُ الْأَمْرُ عَلَيْكُمْ
  rationale: تنقل العبارة الاصطلاحية بمعنى ما يقع ضمن قدرة المخاطَبين ومسؤوليتهم، مع إبقاء الحدّ الذي يضعه بولس للمطالبة.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: مَعَ جَمِيعِ النَّاسِ
  rationale: تفيد كلمة ἀνθρώπων البشر عمومًا لا الذكور وحدهم، و«جميع الناس» واضحة وشائعة في العربية المعاصرة.
- source_word: εἰρηνεύοντες
  choice: عِيشُوا بِسَلَامٍ
  rationale: اسم الفاعل اليوناني يؤدي هنا وظيفة الحث في سياق الوصايا، والصياغة المختارة تعبّر عن سلوك مستمر لا عن حالة عابرة.
theological_decisions:
- issue: مدى الوصية وحدود المسؤولية عنها
  choice: الدعوة إلى السلام تشمل جميع الناس، لكن مسؤولية المؤمنين محدودة بما يمكنهم فعله فعلًا.
  alternative: اعتبار السلام واجبًا مطلقًا يجب أن يتحقق دائمًا متى تصرف المؤمنون تصرفًا صحيحًا.
  rationale: يحفظ النص القيدين εἰ δυνατόν وτὸ ἐξ ὑμῶν معًا، فلا يلغي شمول الدعوة ولا يوحي بأن تحقيق السلام مرهون بطرف واحد على الدوام.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «عيشوا بسلام» لإبراز الاستمرار، و«يتوقف الأمر عليكم» لتفسير التعبير الاصطلاحي من غير إزالة قيده الواقعي.
