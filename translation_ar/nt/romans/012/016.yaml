  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: ar
  text: كونوا على فكر واحد بعضكم نحو بعض؛ لا توجّهوا أذهانكم إلى الأمور العالية، بل خالطوا المتواضعين[a]. لا تصيروا حكماء في أعين أنفسكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انقادوا مع الأمور المتواضعة»؛ فقد تشير العبارة اليونانية إلى أناس متواضعين أو إلى أمور متواضعة.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: كونوا متفقي الفكر بعضكم نحو بعض
  rationale: ينقل التعبير معنى الانسجام في التوجّه المتبادل، لا التطابق الحرفي في كل رأي، ويحافظ على البعد العلائقي في الوصية.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: لا تنشغلوا بالأمور العالية
  rationale: يحافظ على صورة «الأمور العالية» وعلى اتساع العبارة بين الكبرياء والتطلع إلى المكانة أو الشؤون الرفيعة، من غير حصرها في معنى واحد.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: خالطوا المتواضعين
  rationale: «خالطوا» عربية طبيعية تنقل المعنى السياقي للفعل، و«المتواضعين» تقرأ الصفة على أنها تشير إلى أشخاص، مع إثبات احتمال الأشياء أو الشؤون المتواضعة في الحاشية.
- source_word: μὴ γίνεσθε
  choice: لا تصيروا
  rationale: يحفظ الدلالة الصيرورية للفعل γίνομαι والتحذير من اتخاذ هذا الموقف.
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: حكماء في أعين أنفسكم
  rationale: تعبير عربي واضح وقريب من الاصطلاح اليوناني الدال على اعتداد الإنسان بحكمته وفق تقديره الذاتي.
theological_decisions:
- issue: دلالة «الأمور العالية» و«المتواضعين» في سياق الحث على التواضع الاجتماعي
  choice: إبقاء «الأمور العالية» واسعة الدلالة، مع قراءة «المتواضعين» على الأشخاص في المتن وذكر الاحتمال المحايد في الحاشية
  alternative: لا تتكبروا، بل انقادوا إلى الأمور المتواضعة
  rationale: تحتمل اليونانية توبيخ الكبرياء أو التطلع إلى المكانة العالية، كما يمكن أن تدل الصفة الجمع على أناس متواضعين أو أمور متواضعة؛ لذلك لا تُحسم جميع جوانب التوتر التفسيري بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة الجمع المذكر بوصفها الصيغة العربية العامة في الخطاب المختلط، مع تجنب المصطلحات الطائفية.
