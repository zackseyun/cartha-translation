  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: ar
  text: فكما أن لنا في جسد واحد أعضاءً كثيرة[a]، ولكن ليست للأعضاء كلها الوظيفة نفسها[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أجزاءً كثيرة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «العمل نفسه» أو «النشاط نفسه». تدل الكلمة اليونانية على العمل أو النشاط أو الوظيفة، و«الوظيفة» أنسب هنا لصورة الجسد وسياق اختلاف الأدوار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: فكما أن
  rationale: تؤدي الفاء الصلة التفسيرية التي تفيدها γάρ، وتؤدي «كما» قوة المقارنة في καθάπερ، مع إبقاء المقارنة مفتوحة لتكتمل في الآية التالية.
- source_word: ἐν ἑνὶ σώματι
  choice: في جسد واحد
  rationale: ترجمة مكانية مباشرة تحفظ وحدة الجسد في الصورة من غير أن تصرّح بمرجعها الكنسي قبل أن يصرّح به السياق.
- source_word: πολλὰ μέλη
  choice: أعضاءً كثيرة
  rationale: «أعضاء» هي الأنسب لصورة الجسد، وتحفظ كذلك إمكان التطبيق الجماعي؛ أما «أجزاء» فبديل صحيح لكنه أقل تصويرًا للجسد الحي.
- source_word: ἔχομεν
  choice: لنا
  rationale: صياغة عربية طبيعية تؤدي معنى «نملك/لدينا» في هذا التركيب من غير ثقل.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: ولكن ليست للأعضاء كلها
  rationale: تحفظ المقابلة التي تفيدها δέ، وتجعل النفي واقعًا على اشتراك جميع الأعضاء في شيء واحد، لا على كل عضو على حدة.
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: الوظيفة نفسها
  rationale: يمكن أن تدل πρᾶξις على العمل أو النشاط أو الوظيفة؛ و«الوظيفة» تلائم صورة أعضاء الجسد واختلاف أدوارها في السياق، من غير تحويلها إلى مصطلح تقني.
theological_decisions:
- issue: الدلالة الكنسية لصورة الجسد
  choice: إبقاء الصورة بصيغة «جسد واحد» و«أعضاء كثيرة» من غير إضافة «الكنيسة».
  alternative: 'التفسير داخل النص: «جسد واحد، أي الكنيسة».'
  rationale: هذه الآية تعرض طرف التشبيه، ثم يأتي تطبيقه في الآية التالية؛ لذلك يحفظ النص تدرّج بولس ولا يُدخل التفسير في صلب الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «فكما أن» لربط التعليل بما قبله وفتح المقارنة التي تكتمل في الآية التالية، وحُفظت استعارة الجسد بلا شرح مذهبي زائد.
