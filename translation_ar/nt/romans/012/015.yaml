  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: ar
  text: اِفرحوا مع الفرحين، وابكوا مع الباكين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: اِفرحوا
  rationale: المصدر المضارع هنا ذو قوة أمرية في سياق الوصايا، وصيغة الأمر العربية تنقل هذه القوة بوضوح وتحفظ معنى الفرح.
- source_word: μετὰ
  choice: مع
  rationale: تدل μετά مع المضاف إليه على المصاحبة والمشاركة، و«مع» هي المقابل العربي الطبيعي والدقيق.
- source_word: χαιρόντων
  choice: الفرحين
  rationale: اسم فاعل جمع مستعمل استعمالًا اسميًا بعد μετά؛ و«الفرحين» موجز وطبيعي، ويحفظ الدلالة العامة والاستمرار المحتمل في صيغة المضارع.
- source_word: κλαίειν
  choice: ابكوا
  rationale: كالمصدر الأول، يحمل قوة أمرية. و«ابكوا» ينقل معنى κλαίω المباشر، بما فيه التعبير الظاهر عن الحزن، ويحافظ على التوازي.
- source_word: κλαιόντων
  choice: الباكين
  rationale: اسم فاعل جمع مستعمل استعمالًا اسميًا؛ و«الباكين» واضح وموازٍ لـ«الفرحين» من غير توسيع المعنى إلى الحداد وحده.
theological_decisions:
- issue: القوة الأمرية للمصدرين في سلسلة الوصايا
  choice: 'صياغة الفعلين بصيغة الأمر: «اِفرحوا... وابكوا...»'
  alternative: «أن تفرحوا مع الفرحين، وأن تبكوا مع الباكين»
  rationale: 'مع أن اليونانية تستعمل المصدرين، فإن سياق رومية 12: 9–21 سياق وصايا وحث، فتؤدي صيغة الأمر العربية وظيفة الخطاب بوضوح من غير إضافة مضمون عقائدي.'
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كريمة. حُفظ التوازي البلاغي بين شطري الآية، ولم تُضف حاشية لأن البديل الحرفي لا يكشف غموضًا جوهريًا أو فرقًا لازمًا للقارئ العربي.
