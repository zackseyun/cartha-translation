  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: ar
  text: 'ولا تتشكّلوا وفق هذا الدهر[a]، بل تحوّلوا بتجديد أذهانكم، لكي تميّزوا ما هي مشيئة الله: ما هو صالح ومرضيّ وكامل[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا العالم». والكلمة اليونانية تعني على نحو أدق «العصر» أو «الدهر»، وتشير هنا إلى النظام أو الحقبة الحاضرة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكي تفحصوا وتستحسنوا ما هي مشيئة الله». فالفعل اليوناني قد يجمع بين الفحص والتعرّف إلى ما ثبتت قيمته والإقرار به.'
    reason: lexical_alternative
  - marker: c
    text: قد تعني «مرضيّ لله»، ويترجمها بعضهم «مقبول».
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: تتشكّلوا وفق
  rationale: ينقل معنى اتخاذ قالب أو نمط خارجي، ويحافظ على مقابلة الفعل الدال على التحوّل العميق.
- source_word: αἰῶνι τούτῳ
  choice: هذا الدهر
  rationale: يشير αἰών إلى العصر أو النظام الحاضر، لا إلى الخليقة المادية في ذاتها؛ ولفظ «الدهر» عربي فصيح واضح في هذا السياق.
- source_word: μεταμορφοῦσθε
  choice: تغيّروا
  rationale: يفيد تحوّلًا عميقًا في الهيئة أو الحال، وصيغة المبني للمجهول العربية ثقيلة هنا؛ فاختير فعل طبيعي يحتمل الانخراط في التغيّر دون حسم جهة الفاعلية.
- source_word: ἀνακαινώσει
  choice: بتجديد
  rationale: الباء تنقل الداتيف الأداتي، أي إن التغيّر يتم بواسطة التجديد.
- source_word: νοός
  choice: أذهانكم
  rationale: الذهن هو ملكة الفهم والتمييز الأخلاقي والروحي؛ وأضيف ضمير المخاطبين بحسب دلالة السياق، مع الجمع لموافقة المخاطبين.
- source_word: εἰς τὸ δοκιμάζειν
  choice: لكي تميّزوا
  rationale: التركيب يفيد الغاية، والفعل يشمل الفحص المؤدي إلى معرفة المقبول والإقرار به؛ و«تميّزوا» ينقل النتيجة العملية بوضوح.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: ما هي مشيئة الله
  rationale: يحافظ على الاستفهام غير المباشر وعلى إضافة المشيئة إلى الله صراحة.
- source_word: ἀγαθὸν
  choice: صالح
  rationale: ينقل وصف مشيئة الله بأنها خيّرة وصالحة، وهو أنسب هنا من «جيد».
- source_word: εὐάρεστον
  choice: مرضيّ
  rationale: يحفظ معنى ما يبعث على الرضا، مع إبقاء الطرف الذي يرضى به مفهومًا من السياق لا مصرّحًا به.
- source_word: τέλειον
  choice: كامل
  rationale: ينقل معنى التمام والكمال دون أن يفرض معنى النضج، غير المرجح في وصف مشيئة الله.
theological_decisions:
- issue: دلالة αἰών في المقابلة الأخلاقية
  choice: هذا الدهر
  alternative: هذا العالم
  rationale: «الدهر» يحفظ الإطار الزمني والأخلاقي للنظام الحاضر، ويتجنب جعل المقابلة مع العالم المخلوق في ذاته.
- issue: قوة δοκιμάζειν بالنسبة إلى مشيئة الله
  choice: تميّزوا
  alternative: تفحصوا وتستحسنوا
  rationale: لا يوحي النص بأن البشر يحاكمون مشيئة الله، بل إن تجديد الذهن يمكّنهم من فحصها والتعرف إليها والإقرار بصلاحها؛ وتوضح الحاشية المجال الدلالي الأوسع.
- issue: مرجع εὐάρεστον
  choice: مرضيّ
  alternative: مرضيّ لله
  rationale: السياق قد يرجّح أن المعنى هو المرضي لله، لكن اليونانية لا تذكر المفعول له صراحة، لذلك أُبقي الإبهام في المتن وذُكر الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الدهر» للدقة الزمنية الأخلاقية، و«تتشكّلوا وفق» لإبراز القالب الخارجي، مع صياغة طبيعية غير مثقلة بالمصطلحات. وُضعت العلامات [b][c] عند الألفاظ التي تشرحها الحواشي.
