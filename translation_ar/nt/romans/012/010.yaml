  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: المحبة الأخوية
  rationale: ينقل معنى المحبة بين أفراد جماعة المؤمنين مع الحفاظ على صورة الأخوّة في الأصل.
- source_word: φιλόστοργοι
  choice: ذوي مودة
  rationale: يدل اللفظ على الحنان والمودة الوثيقة الشبيهة بمودة أهل البيت؛ وهذه الصياغة طبيعية وتحفظ تميّزه عن لفظ المحبة السابق.
- source_word: τιμῇ
  choice: الإكرام
  rationale: السياق يتناول إظهار التقدير للآخرين، لا مجرد مفهوم الشرف المجرد.
- source_word: προηγούμενοι
  choice: بادروا
  rationale: يحفظ معنى التقدّم أو أخذ السبق في إكرام الآخرين، من غير حصر اللفظ في معنى تفضيلهم أو في منافسة عدائية.
theological_decisions:
- issue: دلالة προηγούμενοι في وصية الإكرام المتبادل
  choice: بادروا بعضكم بعضًا
  alternative: تفوقوا بعضكم على بعض / قدّموا بعضكم بعضًا
  rationale: للفعل مجال دلالي يحتمل التقدّم وأخذ المبادرة، وربما إبداء التقدير. «بادروا» يحفظ فكرة السبق التي تعكسها صياغة POB الإنجليزية، مع تجنب إيحاء المنافسة على المكانة أو حسم الغموض لصالح تقديم الآخرين حصريًا.
