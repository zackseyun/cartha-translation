  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: ar
  text: 'لا تنتقموا لأنفسكم، يا أحبّاء، بل أفسحوا مجالًا للغضب[a]، لأنه مكتوب: «لي الانتقام، وأنا سأجازي، يقول الرب»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: اتركوا مجالًا للغضب؛ ويرجّح السياق أن المقصود غضب الله، بالنظر إلى الاقتباس التالي.'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن ترجمة العبارة: «الانتقام لي، وأنا سأردّ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: لا تنتقموا لأنفسكم
  rationale: يحفظ النهي والقوة الانعكاسية في ἑαυτούς، ويؤدي معنى الانتقام بعبارة عربية واضحة وطبيعية.
- source_word: ἀγαπητοί
  choice: يا أحبّاء
  rationale: ينقل النداء الحميم ودفأه الروحي بلغة عربية فصيحة مألوفة.
- source_word: ἀλλὰ δότε τόπον
  choice: بل أفسحوا مجالًا
  rationale: ينقل الصورة الاصطلاحية، أي إعطاء مجال أو ترك موضع، بصياغة عربية واضحة من غير تحديد ما أبهمه النص.
- source_word: τῇ ὀργῇ
  choice: للغضب
  rationale: يحافظ على إيجاز اليونانية، التي تذكر «الغضب» دون إضافة صريحة مثل «غضب الله»؛ والسياق يرجّح الغضب الإلهي.
- source_word: γέγραπται γάρ
  choice: لأنه مكتوب
  rationale: صيغة عربية معيارية وطبيعية لعبارة الاستشهاد الكتابي في صيغة التام المبني للمجهول.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: لي الانتقام
  rationale: ينقل دلالة الاختصاص أو الملكية في الضمير الدالي، ويحافظ على الإيجاز والنبرة الرسمية.
- source_word: ἐγὼ ἀνταποδώσω
  choice: وأنا سأجازي
  rationale: «أجازي» تؤدي معنى المقابلة بما يستحقه المرء في سياق الدينونة، مع إبراز الضمير ἐγώ بلفظ «أنا».
- source_word: λέγει κύριος
  choice: يقول الرب
  rationale: صياغة عربية مألوفة لعبارة الاقتباس، وترجمة κύριος وفق المقابل التقليدي الواضح «الرب».
theological_decisions:
- issue: مرجع «الغضب» في τῇ ὀργῇ
  choice: إبقاء «الغضب» دون إضافة «الله» في المتن، مع بيان أن السياق يرجّح الغضب الإلهي.
  alternative: التصريح في المتن بعبارة «غضب الله»، أو فهمه على أنه الغضب البشري عمومًا.
  rationale: الاقتباس التالي من تثنية 32:35 يجعل دينونة الله وانتقامه المرجع الأرجح، لكن اليونانية لا تضيف لفظ «الله»، ولذلك لا ينبغي حسم الإضمار داخل المتن.
- issue: اختصاص الرب بالانتقام والمجازاة
  choice: «لي الانتقام، وأنا سأجازي»
  alternative: «الانتقام لي، وأنا سأردّ» أو «النقمة لي وأنا أجازي».
  rationale: تحافظ الصياغة على أن الانتقام القضائي من اختصاص الرب، من غير توسيع العبارة إلى صياغة عقائدية تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يا أحبّاء» للمحافظة على حرارة النداء، وأُبقي «الغضب» موجزًا كما في الأصل. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
