lexical_decisions:
- source_word: ἐλπίδι
  choice: الرَّجَاءِ
  rationale: تدلّ الكلمة على الرجاء والتوقّع، وشبه الجملة «في الرجاء» تنقل تركيب الداتيف بصورة عربية موجزة وطبيعية.
- source_word: χαίροντες
  choice: فَرِحِينَ
  rationale: اسم الفاعل اليوناني حاضر الدلالة ويصف موقفًا مستمرًّا؛ وصيغة الحال العربية تحافظ على التوازي مع العبارتين التاليتين.
- source_word: θλίψει
  choice: الضِّيقِ
  rationale: يدل اللفظ على الضغط والشدة والكرب؛ و«الضيق» عربي واضح يحفظ ثقل المعاناة من غير تقييده باضطهاد أو حدث أخروي بعينه.
- source_word: ὑπομένοντες
  choice: صَابِرِينَ
  rationale: يفيد الثبات والاحتمال تحت المشقة؛ و«صابرين» موجزة وطبيعية في العربية وتحافظ على البنية الثلاثية.
- source_word: προσευχῇ
  choice: الصَّلَاةِ
  rationale: يدل الاسم على الصلاة عمومًا، وحرف الجر «على» يلائم عربيًّا الفعل «واظب» في التعبير عن الاستمرار فيها.
- source_word: προσκαρτεροῦντες
  choice: مُواظِبِينَ
  rationale: يفيد الاستمرار بثبات والتكرّس للأمر؛ و«مواظبين» يجمع معنى المداومة والالتزام ويحافظ على التوازي الاسمي.
