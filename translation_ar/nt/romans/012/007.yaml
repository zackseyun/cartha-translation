    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: وَإِنْ كَانَتْ / وَإِنْ كَانَ
  rationale: تؤدي «إن» البنية الشرطية الموجزة في تعداد المواهب، وأُضيف فعل الكينونة بحسب مقتضى العربية مع إبقاء الإيجاز والتوازي.
- source_word: διακονίαν
  choice: خِدْمَةً
  rationale: «الخدمة» لفظ واسع يشمل القيام بخدمة الآخرين ولا يحصر المعنى في منصب كنسي رسمي، مع إمكان معنى «الوزارة» أو «الخدمة الكنسية» بحسب السياق.
- source_word: ἐν τῇ διακονίᾳ
  choice: فَفِي الْخِدْمَةِ
  rationale: تحافظ الصياغة على تكرار الاسم وعلى تركيب النص اليوناني الإيجازي، من غير أن تصرّح بفعل أمر غير مذكور لفظًا.
- source_word: ὁ διδάσκων
  choice: مَنْ يُعَلِّمُ
  rationale: تنقل اسم الفاعل اليوناني بوصفه نشاطًا ووظيفة يمارسها الشخص، ولا تحوّله بالضرورة إلى لقب منصبي مثل «المعلّم».
- source_word: διδασκαλίᾳ
  choice: التَّعْلِيمِ
  rationale: «التعليم» هو المقابل المباشر الطبيعي الذي يتسع لفعل التعليم ومضمونه، ولا يضيّق اللفظ إلى معنى اصطلاحي مثل «العقيدة».
theological_decisions:
- issue: هل تُترجم διακονία بمصطلح كنسي رسمي؟
  choice: خدمة
  alternative: وزارة / خدمة كنسية
  rationale: السياق يعدد مواهب ووظائف النعمة، ولا يفرض أن المقصود منصب كنسي محدد؛ لذلك تحفظ «خدمة» سعة اللفظ من غير استبعاد استعماله الكنسي.
- issue: هل يُصاغ ὁ διδάσκων كلقب منصبي؟
  choice: مَنْ يُعَلِّمُ
  alternative: المعلِّم
  rationale: اسم الفاعل اليوناني يبرز الشخص القائم بفعل التعليم، ولا يثبت وحده أن العبارة اسم منصب؛ فحُفظ هذا التركيز الوظيفي.
- issue: القوة المقصودة من عبارتي ἐν τῇ διακονίᾳ وἐν τῇ διδασκαλίᾳ
  choice: 'الإبقاء على العبارة الاسمية الموجزة: «ففي...»'
  alternative: فليواظب على الخدمة / فليواظب على التعليم
  rationale: النص اليوناني حذفي، وتُفهم منه الدعوة إلى الانشغال بمجال الموهبة. إبقاء الحذف يحفظ إيجاز الأصل ولا يحسم الفعل المقدّر صراحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي والحذف في الأصل اليوناني، مع ضبطٍ كامل للنص القصير لتيسير القراءة، وتجنُّب المصطلحات التي قد توحي بمنصب طائفي محدد.
