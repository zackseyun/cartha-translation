translation:
  language: ar
  text: أَمَّا الْخِدْمَةُ[a]، فَفِي الْخِدْمَةِ؛ وَأَمَّا مَنْ يُعَلِّمُ[b]، فَفِي التَّعْلِيمِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القيام بالخدمة». يمكن أن تدل الكلمة اليونانية على الخدمة عمومًا أو على خدمة تُؤدَّى في إطار الجماعة، بحسب السياق.'
    reason: lexical_alternative
  - marker: b
