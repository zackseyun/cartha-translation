  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: ar
  text: فإني، بالنعمة التي أُعطيت لي، أقول لكل واحد منكم ألّا يظنَّ في نفسه فوق ما ينبغي أن يظن، بل أن يفكر بتعقّل[a]، بحسب ما قسّم الله لكل واحد مقدارَ الإيمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل أن يفكر لكي يكون متزنًا في فكره».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مقياس الإيمان»، وربما: «مقدار من الثقة أو الأمانة». قد تشير العبارة اليونانية إلى مقدار يمنحه الله ويتصل بالإيمان، من غير أن تحدد وجه هذا الاتصال بدقة.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: بالنعمة التي أُعطيت لي
  rationale: تنقل διά مع المضاف إليه بوصفها وسيلة أو أساسًا للقول، وتحفظ الإشارة إلى النعمة الممنوحة لبولس من غير توسيع تفسيري.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: لكل واحد منكم
  rationale: صياغة عربية طبيعية تحفظ القوة التوزيعية للتعبير اليوناني وتشمل كل فرد في الجماعة.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: لا يظنَّ في نفسه فوق ما ينبغي أن يظن
  rationale: تحفظ صورة التقدير الذهني والتكرار اللفظي المرتبط بجذر φρονέω، وتعبّر بوضوح عن تجاوز الحد اللائق في تقدير النفس.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: بل ليفكر بتعقّل
  rationale: صياغة موجزة وطبيعية تجمع بين التفكير والحكم المتزن، مع الإشارة في الحاشية إلى البنية الغائية الممكنة في اليونانية.
- source_word: ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν
  choice: كلُّ واحد بحسب ما قسَم الله له
  rationale: تحفظ التوزيع الفردي وفعل القسمة أو التخصيص الإلهي، وتأتي سليمة في السياق العربي.
- source_word: μέτρον πίστεως
  choice: مقدار الإيمان
  rationale: تحافظ على إجمال العبارة اليونانية من غير حسم ما إذا كان المقصود مقدارًا موزعًا، أو مقياسًا معياريًا، أو قدرة مرتبطة بالإيمان.
theological_decisions:
- issue: دلالة μέτρον πίστεως
  choice: مقدار الإيمان
  alternative: مقياس الإيمان؛ مقدار من الثقة أو الأمانة
  rationale: السياق اللاحق المتعلق بالمواهب قد يوحي بتوزيع قدرة للخدمة، لكن العبارة نفسها لا تحسم ذلك. لذلك أبقت الترجمة الدلالة واسعة، ووضعت البدائل المعقولة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار فعل الظن/التفكير قدر الإمكان، واستُعمل «بتعقّل» لنقل معنى الحكم الرزين وضبط النفس من غير صياغة ثقيلة. أُبقيت دلالة «مقدار الإيمان» مفتوحة، مع بيان البدائل في الحاشية.
