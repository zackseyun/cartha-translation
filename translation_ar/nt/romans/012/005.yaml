  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: ar
  text: هكذا نحن، على كثرتنا، جسدٌ واحدٌ في المسيح، وكلُّ واحدٍ منا عضوٌ للآخرين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «وأما، من جهة كلِّ واحد، فنحن أعضاءُ بعضِنا لبعض».'
    reason: 'لإظهار البنية اليونانية المكثفة: «كلُّ واحد» قيدٌ توزيعي، والخبر الجمعي يُستكمل من الشطر السابق، مع بيان العلاقة المتبادلة بين الأعضاء.'
lexical_decisions:
- source_word: οὕτως
  choice: هكذا
  rationale: تربط العبارة بتشبيه الجسد الوارد في الآية السابقة، وتحفظ القوة المقارِنة والاستنتاجية للفظ اليوناني.
- source_word: οἱ πολλοὶ
  choice: نحن، على كثرتنا
  rationale: السياق يبيّن أن بولس يتحدث بصيغة شاملة عن نفسه والمؤمنين؛ وهذه الصياغة عربية طبيعية وتحفظ المقابلة بين الكثرة والوحدة.
- source_word: ἓν σῶμά
  choice: جسدٌ واحدٌ
  rationale: تحفظ استعارة الجسد وتبرز وحدة الكثيرين من غير تفسير زائد.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ مدلوله اللقبي كما يحفظ تعبير بولس عن الاتحاد بالمسيح.
- source_word: τὸ δὲ καθ’ εἷς
  choice: وكلُّ واحدٍ منا
  rationale: تنقل القوة التوزيعية للعبارة اليونانية بصياغة واضحة وطبيعية في العربية.
- source_word: μέλη
  choice: عضوٌ
  rationale: المفرد ملائم نحويًا بعد «كل واحد»، ويحفظ صورة أعضاء الجسد التي بدأها بولس.
- source_word: ἀλλήλων
  choice: للآخرين
  rationale: تعبّر عن العلاقة المتبادلة بين المؤمنين، مع إبقاء معنى انتماء كل عضو إلى سائر الأعضاء.
theological_decisions:
- issue: دلالة ἐν Χριστῷ وعلاقة المؤمنين بالمسيح
  choice: في المسيح
  alternative: بالمسيح
  rationale: اختيرت «في» للمحافظة على العبارة البولسية المكانية المجازية وعدم اختزالها في معنى الوسيلة أو السببية.
- issue: طبيعة علاقة المؤمنين بعضهم ببعض في ἀλλήλων μέλη
  choice: كلُّ واحدٍ منا عضوٌ للآخرين
  alternative: نحن أعضاءٌ بعضُنا لبعض
  rationale: الصياغة المختارة تحفظ التوزيع الفردي الذي تدل عليه καθ’ εἷς، مع إبقاء التبادل والانتماء المتبادل من غير حصره في معنى تنظيمي أو طائفي.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «على كثرتنا» لإبراز التوتر المقصود بين تعدد الأشخاص ووحدة الجسد، مع الحفاظ على استعارة الجسد ومصطلح «المسيح» المألوف عربيًا.
