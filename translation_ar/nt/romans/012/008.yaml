base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: ar
  text: أمّا مَن يحثّ[a]، فليحثّ؛ ومَن يشارك غيره، فبسخاء[b]؛ ومَن يقود، فباجتهاد[c]؛ ومَن يرحم، فببشاشة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يشجّع، فليواصل التشجيع». يمكن للكلمتين اليونانيتين المترابطتين هنا أن تدلّا على الحثّ أو التشجيع، وقد تحملان أيضًا معنى التعزية بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تعني العبارة أيضًا: «بإخلاص» أو «ببساطة قلب».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بغيرة» أو «بجدّ». ويمكن ترجمة «مَن يقود» أيضًا: «مَن يدبّر» أو «مَن يرأس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: أمّا مَن
  rationale: تستأنف العبارة تعداد المواهب الناقص نحويًا من الآية السابقة؛ وهذه الصياغة العربية تُظهر بنية التعداد طبيعيًا من غير إضافة شرط مستقل غير صريح.
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: مَن يعظ، فليعظ
  rationale: يحمل اللفظان معنى الحث والتشجيع والتعزية. اختير «يعظ» بوصفه فعلًا عربيًا واضحًا يفيد الحث والإرشاد، مع إثبات البديل في الحاشية.
- source_word: ὁ μεταδιδοὺς
  choice: مَن يشارك غيره
  rationale: يفيد الفعل إشراك الآخرين في ما لدى المرء أو إعطاءهم منه، و«يشارك غيره» يحفظ هذا البعد التشاركي دون حصره في المال.
- source_word: ἐν ἁπλότητι
  choice: بسخاء
  rationale: في سياق المشاركة بالموارد يُرجَّح معنى الجود والسخاء، مع بقاء دلالة الإخلاص أو بساطة القصد ممكنة ومذكورة في الحاشية.
- source_word: ὁ προϊστάμενος
  choice: مَن يقود
  rationale: يدل على التقدم للقيادة أو تولي الرعاية والتدبير. «يقود» تعبير عام لا يحصره في منصب كنسي تقني.
- source_word: ἐν σπουδῇ
  choice: باجتهاد
  rationale: يدل على الجد والحرص والغيرة؛ و«باجتهاد» طبيعي في وصف ممارسة القيادة المسؤولة.
- source_word: ὁ ἐλεῶν
  choice: مَن يرحم
  rationale: يحفظ الصيغة الفعلية النشطة بإيجاز ووضوح.
- source_word: ἐν ἱλαρότητι
  choice: ببشاشة
  rationale: يفيد الفرح وطيب النفس عند ممارسة الرحمة؛ و«ببشاشة» ينقل السلوك الظاهر والروح الطيبة المصاحبة له.
theological_decisions:
- issue: نطاق ὁ προϊστάμενος
  choice: 'صياغته عمومًا: «مَن يقود»'
  alternative: مَن يدبّر، أو مَن يرأس، أو صاحب منصب كنسي محدد
  rationale: يعرض النص مواهب في صيغ اسم فاعل عامة ولا يذكر منصبًا صراحة؛ لذا تحفظ الصياغة العامة اتساع الدلالة وتتجنب إدخال نظام كنسي بعينه.
- issue: دلالة ἁπλότης مع المشاركة
  choice: السخاء
  alternative: الإخلاص أو بساطة القصد
  rationale: يرجح سياق مشاركة الآخرين في الموارد معنى السخاء، لكن تعدد الدلالة حقيقي ولذلك أُثبت البديل في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. حُفظ إيقاع التعداد المقتضب، مع استكمال ما يقتضيه الأسلوب العربي بواسطة «فـ» وصيغة الأمر، من غير تحويل ألفاظ المواهب إلى أسماء مناصب تقنية.
