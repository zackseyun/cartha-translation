translation:
  language: ar
  text: ساهموا في تلبية احتياجات القدّيسين، واسعوا إلى ممارسة الضيافة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: الترحيب بالغرباء؛ فاللفظ اليوناني يعني حرفيًا «محبة الغرباء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: احتياجاتهم
  rationale: تدلّ χρεία هنا على الحاجات العملية أو الضروريات؛ و«احتياجاتهم» تعبير عربي طبيعي واضح في سياق تقديم العون.
- source_word: ἁγίων
  choice: القدّيسين
  rationale: يستعمل بولس اللفظ عادةً للمؤمنين بوصفهم شعب الله المقدّس، لا لفئة محدودة بالمعنى الكنسي المتأخر.
- source_word: κοινωνοῦντες
  choice: شارِكوا ... في
  rationale: يحفظ هذا التعبير معنى المشاركة الفعلية في سدّ الاحتياجات، من غير حصرها في العطاء المالي وحده.
- source_word: φιλοξενίαν
  choice: إكرام الضيف
  rationale: تعبير عربي مألوف يدل على الضيافة، مع بقاء بُعد استقبال الغريب موضحًا في الحاشية.
- source_word: διώκοντες
  choice: اسْعَوا إلى
  rationale: ينقل قوة الفعل الدال على التتبّع والطلب الجاد، لا مجرد ممارسة الضيافة عند تيسّرها.
theological_decisions:
- issue: المقصود بالقدّيسين
  choice: المؤمنون، أي شعب الله المقدّس
  alternative: قدّيسون معترف بهم ضمن فئة كنسية خاصة في استعمال متأخر
  rationale: الاستعمال البولسي يشير إلى جماعة المؤمنين عمومًا؛ لذلك حُفظ المصطلح مع فهمه الجماعي.
translation_notes:
  register: صياغة عربية فصحى حديثة وموجزة، تحافظ على البنية الحثّية للفعلين اليونانيين وعلى قوة διώκοντες. استُعمل «إكرام الضيف» لسلامته وطبيعته عربيًا، مع حاشية تُظهر دلالة φιλοξενία المتعلقة باستقبال الغرباء.
