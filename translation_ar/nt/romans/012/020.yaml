base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: ar
  text: بل «إن جاع عدوك، فأطعمه؛ وإن عطش، فاسقه؛ لأنك بفعلك هذا ستكدّس جمرًا من نار على رأسه».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «جمرًا من نار». وقد توحي الصورة بالخزي المؤدي إلى التوبة، أو بوخز الضمير المؤلم، أو بالدينونة الآتية؛ وقد أُبقيت الاستعارة اليونانية كما هي في المتن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: بل «إن
  rationale: تدل ἀλλά على مقابلة النهي السابق عن الانتقام بما ينبغي فعله بدلًا منه، وتدخل ἐάν جملة شرطية؛ و«بل إن» تحفظ هذا الانتقال بوضوح.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: جاع عدوك
  rationale: تعبير عربي فصيح وطبيعي يحفظ الشرط والمفرد في الأصل اليوناني.
- source_word: ψώμιζε αὐτόν
  choice: فأطعمه
  rationale: فعل الأمر ψώμιζε يعني تقديم الطعام، و«أطعمه» موجز ومباشر.
- source_word: ἐὰν διψᾷ
  choice: وإن عطش
  rationale: يحفظ توازي الشرط الثاني مع الأول بصياغة عربية طبيعية.
- source_word: πότιζε αὐτόν
  choice: فاسقه
  rationale: ينقل معنى إعطائه ما يشرب من غير تخصيص الشراب بالماء.
- source_word: τοῦτο γὰρ ποιῶν
  choice: لأنك بفعلك هذا
  rationale: 'يؤدي γάρ التعليل، وتنقل صياغة اسم الفاعل المعنى الوسيلي: نتيجة القيام بهذا الفعل.'
- source_word: ἄνθρακας πυρὸς
  choice: جمر نار
  rationale: ترجمة قريبة من تركيب الأصل وتحفظ الصورة الملموسة؛ وهي أقل تفسيرًا من صيغ قد تحولها إلى معنى مجازي محدد.
- source_word: σωρεύσεις
  choice: ستكدّس
  rationale: يحفظ صيغة المستقبل وصورة جمع الجمر بعضه فوق بعض.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: على رأسه
  rationale: نقل مباشر وطبيعي لعبارة الجر مع إبقاء الاستعارة كما هي.
theological_decisions:
- issue: دلالة تكديس جمر النار على رأس العدو
  choice: إبقاء الصورة الاستعارية من غير تفسير داخل المتن
  alternative: تفسيرها بالخزي المؤدي إلى التوبة، أو بوخز الضمير، أو بالدينونة الآتية
  rationale: المعنى المقصود من الاستعارة موضع خلاف، والأصل اليوناني لا يحسم أحد هذه التفسيرات؛ لذلك تُصان الصورة والتوتر اللاهوتي، ويُذكر نطاق الاحتمالات في الحاشية.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة ووقورة. استُخدمت أفعال موجزة مألوفة: «أطعمه» و«اسقه»، مع الحفاظ على المفرد وعلى الاستعارة من غير حسم تفسيرها. وُضعت علامات الاقتباس لأن العبارة اقتباس من أمثال 25:21-22، من غير إضافة إحالة غير موجودة في بيانات الحاشية.'
