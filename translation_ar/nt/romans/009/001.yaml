lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: أقول الحق
  rationale: تعبير عربي طبيعي ومباشر ينقل العبارة اليونانية الاصطلاحية التي تؤكد صدق القول.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحافظ على حرف الجر ἐν، وينقل Χριστός باللقب العربي الراسخ «المسيح»، الذي يمكن أن يُفهم لقبًا كما قد يجري مجرى الاسم في الاستعمال البولسي.
- source_word: οὐ ψεύδομαι
  choice: ولا أكذب
  rationale: صياغة عربية واضحة وموجزة تحفظ نفي بولس المؤكد للكذب، مع وصلها بالجملة السابقة على نحو طبيعي.
- source_word: συμμαρτυρούσης μοι
  choice: يشهد معي
  rationale: يحفظ معنى السابقة συν- الدال على المشاركة في الشهادة، ويصوغ التركيب الحالي المطلق بصياغة عربية سلسة.
- source_word: τῆς συνειδήσεώς μου
  choice: ضميري
  rationale: المقابل العربي المعتاد لـ συνείδησις، مع تضمين ضمير الملكية μου في الكلمة.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: في الروح القدس
  rationale: يحافظ على حرف الجر ἐν، ويعكس الفهم الأرجح في الاستعمال البولسي بأن العبارة تشير إلى الروح القدس، من غير تحويلها إلى معنى سببي أو آلي.
theological_decisions:
- issue: دلالة Χριστός في هذا الموضع
  choice: المسيح
  alternative: 'المسيح بوصفه لقبًا صريحًا: «المسيّا»'
  rationale: «المسيح» هو المقابل العربي الطبيعي والراسخ، وهو يحتفظ بأصل اللقب مع إمكان جريانه مجرى الاسم في هذا السياق؛ فلا يُحسم ما إذا كان الاستعمال لقبيًا أو اسميًا صرفًا.
- issue: مرجع πνεύματι ἁγίῳ
  choice: الروح القدس
  alternative: روح مقدس، أو روح بولس المتصف بالقداسة
  rationale: الإشارة إلى الروح القدس هي القراءة الأرجح في لغة بولس وفي سياق توكيد الصدق، لكن غياب أداة التعريف في اليونانية يتيح احتمالًا نحويًا آخر، ولذلك ذُكر في الحاشية.
- issue: طبيعة شهادة الضمير
  choice: ضميري يشهد معي
  alternative: ضميري يشهد لي
  rationale: اختيرت صياغة تحفظ عنصر المشاركة في الفعل المركب συμμαρτυρέω بدل تفسير حرف الجر أو الداتيف تفسيرًا يحصره في شهادة لصالح بولس.
