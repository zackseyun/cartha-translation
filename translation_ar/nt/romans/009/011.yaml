id: ROM.9.11
reference: Romans 9:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: ar
  text: لأنهما لم يكونا قد وُلدا بعد، ولا فعلا شيئًا صالحًا أو رديئًا[a]، لكي يبقى[c] قصد الله بحسب الاختيار[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شيئًا صالحًا أو شريرًا». يمكن للكلمة اليونانية أن تدل على ما هو رديء أو دنيء أو شرير أخلاقيًا.
    reason: lexical_alternative
  - marker: b
    text: 'أو «قصد الله الاختياري»، وحرفيًا: «قصد الله بحسب الاختيار».'
    reason: lexical_alternative
  - marker: c
    text: أو «يثبت». يدل الفعل اليوناني على البقاء أو الاستمرار، وقد يفيد هنا معنى الرسوخ والثبات.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω ... γεννηθέντων
  choice: لم يكونا قد وُلدا بعد
  rationale: ينقل معنى «لم يولدا بعد» في تركيب عربي طبيعي، ويستعمل المثنى لأن السياق يتحدث عن الابنين المذكورين في الآية السابقة.
- source_word: γὰρ
  choice: لأنهما
  rationale: يحفظ الصلة التفسيرية بما قبلها، مع إلحاق الضمير بالفعل الناقص على مقتضى العربية.
- source_word: μηδὲ πραξάντων
  choice: ولا فعلا
  rationale: يحافظ على النفي المنسق، ويعبّر عن صيغة المثنى بوضوح.
- source_word: τι ἀγαθὸν ἢ φαῦλον
  choice: شيئًا صالحًا أو رديئًا
  rationale: «صالحًا أو رديئًا» تقابل طبيعي واضح، و«رديئًا» تتسع لمعاني φαῦλον من السوء والدناءة دون حصرها في أقصى درجات الشر الأخلاقي.
- source_word: ἵνα
  choice: لكي
  rationale: يحفظ دلالة الغرض الأرجح في السياق من غير أن يحمّل العبارة نتائج لاهوتية تتجاوز بنيتها.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: قصد الله بحسب الاختيار
  rationale: يحافظ على البنية الإضافية وشبه الجملة اليونانية، ويتجنب صهرها في تفسير لاهوتي شارح.
- source_word: μένῃ
  choice: يبقى
  rationale: هو المقابل المباشر لمعنى الاستمرار والبقاء، مع الإشارة في الحاشية إلى احتمال معنى الثبات.
theological_decisions:
- issue: دلالة ἵνα في سياق الاختيار الإلهي
  choice: لكي يبقى
  alternative: بحيث يبقى
  rationale: تُرجمت بوصفها أداة غرض، وهو الوجه النحوي الأرجح، من غير حسم الجدالات الأوسع بشأن القضاء والاختيار.
- issue: ترجمة ἐκλογή
  choice: الاختيار
  alternative: الانتخاب
  rationale: «الاختيار» أفصح وأوضح للقارئ العربي المعاصر، ويحفظ المعنى من غير استدعاء الدلالة السياسية الشائعة لكلمة «الانتخاب».
translation_notes:
  register: صياغة عربية فصحى واضحة ورصينة. أُبقيت الجملة معلّقة نحويًا عند آخر الآية لأن تركيبها يكتمل في السياق التالي، كما في النص اليوناني، ولم تُضف عبارة تفسيرية لتسوية هذا التوتر.
