  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: ar
  text: ولكي يُظهِر غنى مجده على أواني الرحمة التي سبق فأعدَّها للمجد،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσῃ
  choice: يُعرِّف
  rationale: ينقل معنى الإظهار والإعلام بوضوح، مع إبقاء الله فاعلًا مفهومًا من السياق السابق.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: غنى مجده
  rationale: صياغة عربية موجزة تحافظ على صورة الغنى وعلى الإضافة في الأصل.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: على أواني الرحمة
  rationale: يحافظ على دلالة ἐπί الأساسية وعلى استعارة الأواني، من غير تحويلها إلى معنى نفعي مثل «لأواني».
- source_word: προητοίμασεν
  choice: سبق فأعدَّها
  rationale: يُظهر عنصر السبق الزمني في السابقة προ- بلغة عربية طبيعية.
- source_word: εἰς δόξαν
  choice: للمجد
  rationale: ينقل الغاية أو المصير المقصود بإيجاز، من غير زيادة تفسيرية.
theological_decisions:
- issue: صلة عبارة «ولكي يُعرِّف» بما قبلها
  choice: الإبقاء على واو العطف ولام الغاية دون استكمال الجملة داخل هذه الآية
  alternative: صياغتها جملة مستقلة مثل «وقد فعل ذلك لكي...»
  rationale: النص اليوناني تابع نحويًا للحجة السابقة، وإكماله تفسيريًا قد يحسم تركيبًا ممتدًا عبر الآيات.
- issue: مرجع الموصول ἃ وجنسه
  choice: «التي ... أعدَّها» عائدًا إلى «أواني الرحمة»
  alternative: 'إعادة الاسم: «أواني الرحمة التي سبق الله فأعدها»'
  rationale: يحافظ على البنية الأصلية، والفاعل الإلهي مفهوم من السياق من غير إدخال اسم غير مصرح به في الآية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة، مع الحفاظ على الاستعارة البولسية «أواني الرحمة» وعلى تعلق الآية بما قبلها نحويًا.
