  to: الذين هم إسرائيليون[a]، ولهم التبنّي[c] والمجد[b] والعهود وإعطاء الشريعة والعبادة[d] والمواعيد.
  rationale: 'التعديل محدود وآمن: استُعيدت جملة الوصل «الذين هم» لتظهر الوظيفة التفسيرية لـοἵτινες، مع الإبقاء على جميع ألفاظ القائمة واختياراتها الاصطلاحية. كما عُدِّلت الحاشية a كي تكون بديلًا فعليًا لا تكرارًا للمتن. ولا توجد مسألة نصية أو لاهوتية تتطلب تنبيهًا بشريًا.'
