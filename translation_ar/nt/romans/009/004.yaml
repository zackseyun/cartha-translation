  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: ar
  text: الذين هم إسرائيليون[a]، ولهم التبنّي[c] والمجد[b] والعهود وإعطاء الشريعة والعبادة[d] والمواعيد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إسرائيليين، الذين لهم التبنّي والمجد والعهود وإعطاء الشريعة والعبادة والمواعيد».'
    reason: بديل تركيبي يحافظ على الصلة التفسيرية بالعبارة السابقة.
  - marker: b
    text: يُرجَّح أن «المجد» يشير إلى حضور الله المتجلّي بين إسرائيل.
    reason: توضيح مرجّح للسياق التاريخي واللاهوتي من غير إدخاله في المتن.
  - marker: c
    text: أو «التبنّي بوصفهم أبناء»، أو «البنوّة».
    reason: بدائل معجمية تعبّر عن منزلة الابن التي يدل عليها اللفظ اليوناني.
  - marker: d
    text: أي عبادة إسرائيل وخدمته المقدسة أمام الله في إطار العهد.
    reason: توضيح للدلالة الشعائرية والعهدية للفظ اليوناني.
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: وهم إسرائيليون
  rationale: تنقل العبارةُ جملةَ الوصل التفسيرية التي تصف أقرباء بولس المذكورين في السياق السابق، بصياغة عربية طبيعية من غير المبالغة في إبراز الدلالة الوصفية للضمير.
- source_word: ὧν
  choice: ولهم
  rationale: الضمير الموصول في صيغة المضاف إليه يفيد الاختصاص أو الملكية؛ و«لهم» أوضح وأفصح في العربية من ترجمة حرفية متكلفة.
- source_word: υἱοθεσία
  choice: التبنّي
  rationale: يحافظ على استعارة إدخال المرء في منزلة الابن، والمقصود هنا امتياز إسرائيل الجماعي في إطار العهد.
- source_word: δόξα
  choice: المجد
  rationale: يبقي اللفظ اليوناني على كثافته الدلالية من غير أن يضيف إلى المتن تفسيرًا صريحًا لحضور الله المتجلّي.
- source_word: διαθῆκαι
  choice: العهود
  rationale: يحافظ على صيغة الجمع الواردة في النص اليوناني وعلى الدلالة التاريخية العهدية.
- source_word: νομοθεσία
  choice: إعطاء الشريعة
  rationale: يفيد المصدر اليوناني منح الشريعة أو سنّها، لا الشريعة وحدها؛ وهذه العبارة واضحة وطبيعية في العربية.
- source_word: λατρεία
  choice: العبادة
  rationale: يدل اللفظ على العبادة أو الخدمة المقدسة المقدَّمة لله، و«العبادة» تحفظ اتساعه من غير حصره صراحة في الهيكل أو الكهنوت.
- source_word: ἐπαγγελίαι
  choice: المواعيد
  rationale: يحافظ على صيغة الجمع ويشير بوضوح إلى مواعيد الله المعطاة لإسرائيل.
theological_decisions:
- issue: دلالة υἱοθεσία بالنسبة إلى إسرائيل
  choice: التبنّي بوصفه منزلة إسرائيل البنوية الجماعية في إطار العهد
  alternative: البنوّة؛ التبنّي بوصفهم أبناء
  rationale: يسرد السياق امتيازات إسرائيل التاريخية بوصفه شعبًا، لذلك حُفظت الاستعارة من غير إسقاط جميع الدلالات الخلاصية الفردية الواردة في مواضع بولسية أخرى عليها.
- issue: مرجع ἡ δόξα
  choice: إبقاء «المجد» في المتن
  alternative: المجد الإلهي؛ حضور المجد
  rationale: يرجّح السياق أن المقصود تجلّي حضور الله بين إسرائيل، لكن اليونانية تقول «المجد» فقط؛ لذا حُفظ الإيجاز والغنى اللاهوتي في المتن ووُضع التوضيح في الحاشية.
- issue: نطاق λατρεία
  choice: العبادة المقررة لإسرائيل في إطار العهد
  alternative: خدمة الهيكل؛ الخدمة الكهنوتية
  rationale: للفظ دلالة عبادية وشعائرية، لكن حصره في الهيكل أو الكهنوت أضيق مما يصرّح به النص.
translation_notes:
  register: الصياغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «إسرائيليون» للدلالة التاريخية القومية في النص، وحُفظ توازي قائمة الامتيازات بأسماء معرفة متعاطفة، مع وضع علامات الحواشي بجوار الألفاظ التي تشرحها.
