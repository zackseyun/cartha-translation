  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: ar
  text: ولكن ليس الأمر كما لو أن كلمة الله قد أخفقت. فليس جميع المنحدرين من إسرائيل[a] هم إسرائيل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الذين يرجع أصلهم إلى إسرائيل؛ فالعبارة اليونانية تدل على الأصل أو النسب.'
    reason: lexical_alternative
  - marker: b
    text: يرد اسم «إسرائيل» هنا بمعنى أضيق من وروده الأول؛ إذ يميّز بولس بين الانحدار الجسدي ومعنى أضيق لـ«إسرائيل». ولا تحدد هذه العبارة وحدها نطاق ذلك المعنى تحديدًا كاملًا.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: ولكن ليس الأمر كأن
  rationale: صياغة عربية طبيعية تنفي الاستنتاج المحتمل من السياق، وتحافظ على وظيفة العبارة اليونانية بوصفها تصحيحًا لما قد يُفهم.
- source_word: ἐκπέπτωκεν
  choice: قد أخفقت
  rationale: ينقل معنى أن كلمة الله لم تفشل أو تفقد فاعليتها، مع مراعاة دلالة صيغة التمام اليونانية على حالة حاضرة ناتجة من فعل سابق.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: ترجمة مباشرة تحفظ سعة لفظ λόγος ولا تحصره تفسيريًا في «وعد الله»، وإن كان الوعد حاضرًا في السياق.
- source_word: οὐ γὰρ πάντες
  choice: لأن ليس جميع
  rationale: 'تحفظ γάρ بوصفها تعليلًا للجملة السابقة، وتعبّر عن النفي الكلي المقصود: ليس كل المنحدرين من إسرائيل إسرائيل.'
- source_word: οἱ ἐξ Ἰσραήλ
  choice: المنحدرين من إسرائيل
  rationale: تُظهر دلالة ἐξ على الأصل والنسب بوضوح في العربية، دون زيادة تحديد لاهوتي.
- source_word: οὗτοι Ἰσραήλ
  choice: هم إسرائيل
  rationale: تكمل الجملة الاسمية الموجزة بضمير فصل طبيعي، وتحافظ على المقابلة الحادة بين الانتساب النسبي ومدلول «إسرائيل» الثاني.
theological_decisions:
- issue: مدلول الورود الثاني لاسم «إسرائيل»
  choice: الإبقاء على «إسرائيل» بلا تفسير داخل المتن، مع الإشارة في الحاشية إلى أن استعماله أضيق من الورود الأول
  alternative: تحديده في المتن بأنه «المختارون من إسرائيل» أو «شعب الله الحقيقي»
  rationale: السياق يميّز بين الانحدار الجسدي والمدلول الأضيق لإسرائيل في قصد الله، لكنه لا يحسم في هذه الجملة وحدها جميع تفاصيل ذلك المدلول؛ لذلك تُحفظ المساحة اللاهوتية والتوتر المقصودان.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «قد أخفقت» بدل التعبير الحرفي «قد سقطت» لأن المقصود في السياق عدم فشل كلمة الله، واختير «المنحدرين من» لإبراز دلالة الأصل والنسب في ἐξ. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تفسرانهما مباشرة.
