  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: ar
  text: لأن الرب سينفّذ كلمته[a] على الأرض[c]، متمّمًا إياها ومختصرًا إياها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سينفّذ الرب الأمر أو الحكم على الأرض».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا فهم «مختصرًا إياها» بمعنى «مقلّصًا لها» أو، بالدلالة السياقية، «منفّذًا إياها سريعًا».
    reason: lexical_alternative
  - marker: c
    text: يترجم بعضهم العبارة «في الأرض»، مراعاةً لصياغة إشعياء في سياقها الأصلي؛ أما نص رومية هنا فيقول «على الأرض».
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: كلمته
  rationale: تحفظ «كلمة» معنى القول أو الإعلان الإلهي الذي يحققه الرب، والضمير مفهوم من كون الرب هو الفاعل، مع إبقاء احتمال معنى «الأمر» أو «الحكم» في الحاشية.
- source_word: γὰρ
  choice: لأن
  rationale: تبيّن الأداة أن العبارة تعليل لما سبق في سياق حجة بولس.
- source_word: συντελῶν
  choice: متمّمًا إياها
  rationale: ينقل معنى بلوغ الكلمة غايتها وإتمامها، ويحافظ على صلة اسم الفاعل بالفعل الرئيس.
- source_word: καὶ συντέμνων
  choice: ومختصرًا لها
  rationale: يحفظ الصورة الحادة في الفعل اليوناني واحتمال الاختصار أو التقصير، من غير حصره في معنى السرعة وحده.
- source_word: ποιήσει
  choice: سينفّذ
  rationale: مع «كلمته» يفيد أن الرب سيجري ما قاله ويحققه؛ وهو أوضح عربيًا من الترجمة الحرفية «سيفعل».
- source_word: κύριος
  choice: الرب
  rationale: هو المقابل العربي المألوف والدقيق للقب الإلهي في الاقتباس.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: يتبع الصياغة اليونانية في رومية ويحفظ دلالتها الأوسع، بدل تضييقها إلى «في الأرض» بمعنى البلاد.
theological_decisions:
- issue: طبيعة فعل الرب في الاقتباس من إشعياء
  choice: يُعرض النص بوصفه تنفيذ الرب الحاسم لكلمته وإتمامها، مع إبقاء دلالة الاختصار مفتوحة.
  alternative: أن يُصرَّح بأنه تنفيذ سريع لحكم قضائي، أو إتمام مختصر لعمل خلاص أو دينونة.
  rationale: للسياق نبرة قضائية محتملة، لكن اليونانية لا تفرض هنا تفصيلًا مذهبيًا بعينه؛ لذلك تحافظ الصياغة على التوتر بين الكلمة والحكم وعلى غموض معنى الاختصار.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ومهيبة. استُخدم تركيب اسم الفاعل للمحافظة على بنية الجملة اليونانية قدر الإمكان، مع حواشٍ تبيّن البدائل المعجمية من غير حسم الغموض الأصيل.
