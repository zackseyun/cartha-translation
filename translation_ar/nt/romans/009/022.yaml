  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: ar
  text: ولكن ماذا إن كان الله[a]، وهو يريد أن يُظهر غضبه ويُعلن قدرته[b]، قد احتمل بصبر عظيم أوانيَ غضبٍ مُهَيَّأةً للهلاك[c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولكن إن كان الله». تبدأ اليونانية جملة شرطية بلاغية تستمر في الآية التالية.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ما هو قادر عليه»؛ والمقصود هنا قدرة الله أو قوته.'
    reason: lexical_alternative
  - marker: c
    text: 'لا تحدد صيغة «مُهَيَّأة» المبنية للمجهول مَن الذي هيَّأ هذه الأواني. وقد اختلف المفسرون: أتشير إلى فعل إلهي، أم إلى أن الإنسان قسّى نفسه، أم ببساطة إلى حالة استعداد للدينونة؟'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن ماذا إن كان
  rationale: يحفظ افتتاح الشرط البلاغي واستمرار تركيبه إلى الآية التالية، من غير تحويله إلى تقرير مباشر.
- source_word: θέλων
  choice: وهو يريد
  rationale: ينقل اسم الفاعل الدال على الإرادة المرتبطة بالفعل الرئيس، مع إبقاء طبيعة العلاقة الظرفية غير محسومة.
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: أن يُظهر غضبه
  rationale: صياغة عربية واضحة تنقل معنى إظهار الغضب الإلهي وإبرازه، وتحفظ دلالة ὀργή القضائية في السياق.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: ويُعرِّف قدرته
  rationale: تنقل المعنى السببي لـγνωρίσαι، وتفهم التعبير الاسمي τὸ δυνατὸν αὐτοῦ سياقيًا على أنه قدرة الله.
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: قد احتمل بصبر عظيم
  rationale: يؤدي معنى الاحتمال المصحوب بطول الأناة، بلغة عربية معاصرة رصينة.
- source_word: σκεύη ὀργῆς
  choice: أوانيَ غضبٍ
  rationale: يحفظ صورة الأواني الفخارية في السياق القريب، كما يبقي علاقة الإضافة مكثفة من غير تفسير زائد.
- source_word: κατηρτισμένα
  choice: مُهيَّأةً
  rationale: يعكس اسم المفعول التام وحالة الاستعداد، من غير تعيين الفاعل الذي لم يذكره النص اليوناني.
- source_word: εἰς ἀπώλειαν
  choice: للهلاك
  rationale: تعبير عربي مباشر يدل على الغاية أو المصير، ويلائم الاستعمال البولسي.
theological_decisions:
- issue: الفاعل المفهوم في صيغة المبني للمجهول κατηρτισμένα
  choice: مُهيَّأةً للهلاك، من غير تسمية من هيَّأها
  alternative: أن الله هيَّأها للهلاك، أو أنها صارت مهيأة بعملها، أو أنها كانت في حالة استعداد للدينونة
  rationale: النص يصف حالة الأواني بصيغة المبني للمجهول ولا يصرح بالفاعل؛ لذلك تُحفظ المسألة اللاهوتية مفتوحة بدل حسمها داخل الترجمة.
- issue: قوة الشرط غير المكتمل في εἰ δὲ
  choice: ولكن ماذا إن كان... مع إبقاء الجملة مستمرة إلى الآية التالية
  alternative: ولكن إن كان، أو تحويل العبارة إلى تقرير مكتمل داخل هذه الآية
  rationale: تركيب بولس الشرطي يمتد إلى الآية التالية؛ والصياغة المختارة تحفظ طابعه البلاغي وتعليق الجواب.
- issue: العلاقة الظرفية لـθέλων بالفعل الرئيس
  choice: وهو يريد
  alternative: لأنه أراد، أو مع أنه أراد
  rationale: اسم الفاعل اليوناني لا يحسم وحده هل العلاقة سببية أم تنازلية؛ لذا تتجنب الترجمة فرض أحد الوجهين.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت صورة «الأواني» واتصال الشرط بالآية التالية، كما تُرك غموض الفاعل والعلاقة الظرفية في النص اليوناني من غير حسم مذهبي.
