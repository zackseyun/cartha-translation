  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: ar
  text: 'وكما سبق أن قال إشعياء: «لو لم يُبقِ لنا ربُّ الجنود[a] نسلًا[b][c]، لصرنا مثل سدوم، ولَجُعِلنا مثل عمورة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «الرب صباؤوت». فالكلمة اليونانية Σαβαώθ نقلٌ صوتي للقب إلهي عبري يُترجم عادةً «الجنود» أو «القوات».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «زرعًا»؛ والمقصود هنا نسل أو ذرية باقية.'
    reason: lexical_alternative
  - marker: c
    text: اقتباس من إشعياء 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: وكما
  rationale: تحفظ أداة التشبيه والربط بالسياق السابق بصياغة عربية طبيعية.
- source_word: προείρηκεν
  choice: سبق أن قال
  rationale: تنقل معنى القول السابق مع بقاء أثره في الاستشهاد الحالي، من غير تحويله إلى تنبؤ.
- source_word: κύριος Σαβαὼθ
  choice: ربُّ الجنود
  rationale: تترجم اللقب الإلهي الذي نقلته اليونانية صوتيًا عن العبرية، وتحافظ على معناه المعروف بدل الاكتفاء بالنقل الصوتي.
- source_word: ἐγκατέλιπεν
  choice: يُبقِ لنا
  rationale: يفيد ترك شيء باقٍ أو إبقاءه، وهو واضح في سياق النجاة من الهلاك.
- source_word: σπέρμα
  choice: نسلًا
  rationale: يعبر طبيعيًا عن معنى «الزرع/النسل» المقصود هنا، أي ذرية باقية، من غير استبداله بالمصطلح التفسيري «بقية».
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: لصرنا مثل سدوم
  rationale: ينقل نتيجة الشرط المخالف للواقع ويحافظ على معنى الصيرورة في ἐγενήθημεν.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: ولَشُبِّهنا بعمورة
  rationale: يحافظ على المبني للمجهول وعلى اختلاف الفعل عن «صرنا» في العبارة الموازية.
theological_decisions:
- issue: ترجمة اللقب الإلهي κύριος Σαβαώθ في اقتباس من العهد القديم
  choice: ربُّ الجنود
  alternative: الرب صباؤوت / ربُّ القوات
  rationale: النص اليوناني يستعمل κύριος مع نقل صوتي للقب العبري. ترجمة اللقب توضح معناه وتحافظ على صورته بوصفه لقبًا إلهيًا، مع إثبات البديل الحرفي في الحاشية.
- issue: هل تُترجم σπέρμα بالمصطلح اللاهوتي «بقية»؟
  choice: نسلًا
  alternative: زرعًا / بقيةً
  rationale: اللفظة اليونانية تعني حرفيًا «زرعًا» وتدل هنا على نسل باقٍ. اختيار «نسل» يصون الدلالة المعجمية ولا يحسمها بالمفهوم التفسيري الأوسع «البقية».
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة كتابية وقورة. استُعمل الشرط بـ«لو» والجواب باللام لنقل المعنى المخالف للواقع، وحُفظ التوازي بين «لصرنا» و«لَشُبِّهنا» دون تسوية الفعلين.
