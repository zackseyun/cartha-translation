reference: Romans 9:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: ar
  text: 'لكنَّ إشعياء يصرخ بشأن إسرائيل: «وإن كان عددُ بني إسرائيل[a] مثلَ رمل البحر،[b] فالبقيّة ستخلُص[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أبناء إسرائيل»؛ ويجوز بحسب الاستعمال العربي: «الإسرائيليين» أو «ذرية إسرائيل». و«بنو إسرائيل» تسمية جماعية عهدية مألوفة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن ترجمة العبارة بصورة أشد حرفية: «إن كان عدد بني إسرائيل مثل رمل البحر». وتحمل الصيغة الشرطية هنا معنى تنازليًّا في السياق.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «ستنجو» أو «سيُنقَذ الباقون». وتردد العبارة صدى نبوءة إشعياء عن البقية التي تنجو.'
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: لكنَّ
  rationale: تفيد انتقالًا فيه مقابلة خفيفة مع الكلام السابق، من غير جعلها استدراكًا حادًّا.
- source_word: κράζει
  choice: يصرخ
  rationale: يحافظ على قوة الفعل وصيغته في المضارع، ويصوّر إعلان إشعياء بوضوح وشدة.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: بشأن إسرائيل
  rationale: السياق هو قول نبوي عن إسرائيل، لا شفاعة أو دفاع بالنيابة عنه.
- source_word: Ἐὰν ᾖ
  choice: وإن كان
  rationale: تؤدي الصيغة العربية معنى الشرط ذي القوة التنازلية هنا، مع إبقاء الصياغة الشرطية الأصلية ظاهرة.
- source_word: ὁ ἀριθμὸς
  choice: عدد
  rationale: المقابل العربي الطبيعي والدقيق.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: بني إسرائيل
  rationale: تعبير عربي كتابي مألوف يحفظ الدلالة الجماعية والتسمية العهدية لعبارة «أبناء إسرائيل».
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: مثل رمل البحر
  rationale: يحفظ التشبيه الكتابي المعروف بصياغة عربية واضحة وطبيعية.
- source_word: τὸ ὑπόλειμμα
  choice: البقيّة
  rationale: مصطلح عربي راسخ ودقيق للجماعة الباقية من مجموع أكبر في السياق النبوي.
- source_word: σωθήσεται
  choice: ستخلُص
  rationale: يحفظ معنى الخلاص ووزنه اللاهوتي في سياق رومية، من غير حصره في نوع محدد من النجاة.
theological_decisions:
- issue: دلالة العبارة الشرطية Ἐὰν ᾖ في الاقتباس النبوي
  choice: «وإن كان عدد...» بمعنى شرطي تنازلي
  alternative: «إن كان عدد...» بوصفه شرطًا مباشرًا، أو «حتى إن كان عدد...» للتنازل المؤكد
  rationale: تُظهر «وإن كان» المفارقة بين كثرة العدد وخلاص البقية، مع الحفاظ على البنية الشرطية وعدم تحويلها إلى تقرير عقائدي زائد.
- issue: دلالة σωθήσεται
  choice: «ستخلُص»
  alternative: «ستنجو» أو «سيُنقَذ»
  rationale: «ستخلُص» أنسب في سياق رومية 9–11 وتحفظ الثقل الخلاصي للنص، بينما تبقى دلالة النجاة التاريخية المحتملة ظاهرة في الحاشية.
- issue: هل تُضاف أداة حصر إلى «البقية»
  choice: عدم إضافة «فقط» أو «وحدها»
  alternative: «فالبقية وحدها ستخلص»
  rationale: النص اليوناني يذكر «البقية» معرّفة ولا يتضمن أداة حصر صريحة؛ والمقابلة تفيد القلة دون الحاجة إلى زيادة تفسيرية في المتن.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة من غير تقعيد قديم ثقيل. استُعمل «بني إسرائيل» لكونه التعبير العربي المألوف المطابق للتسمية الجماعية، و«البقية» للمصطلح النبوي، مع إبقاء الشرط والتوتر بين كثرة إسرائيل وخلاص البقية من غير توسع تفسيري.
