  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: ar
  text: لماذا؟ لأنهم لم يسعوا إليها انطلاقًا من الإيمان[a]، بل كما لو كانت بالأعمال[b]. فعثروا بحجر العثرة[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالإيمان» أو «على أساس الإيمان». والنص اليوناني حرفيًا: «من إيمان».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بل كما لو كانت من الأعمال». وتحافظ العبارة على معنى «كما لو» في الأصل.'
    reason: lexical_alternative
  - marker: c
    text: في العبارة تلميح إلى إشعياء 8:14؛ وقارن أيضًا إشعياء 28:16 في العدد التالي.
    reason: cross_reference
  - marker: d
    text: 'أو: «بحجر العثار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: لماذا؟
  rationale: استفهام موجز يحافظ على القوة البلاغية في سؤال بولس.
- source_word: ὅτι
  choice: لأن
  rationale: أداة تعليل تجيب مباشرة عن السؤال السابق.
- source_word: οὐκ ἐκ πίστεως
  choice: لم يكن من الإيمان
  rationale: يحافظ على معنى ἐκ، أي المصدر أو المنطلق، مع إبقاء «الإيمان» بالمصطلح البولسي المألوف.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: بل كأنه من الأعمال
  rationale: تحافظ «كأنه» على دلالة ὡς ولا تختزل العبارة إلى تقرير مباشر بأن الأمر كان بالأعمال.
- source_word: προσέκοψαν
  choice: فعثروا
  rationale: ينقل صورة التعثر الملموسة ويصلها بالنتيجة في السياق.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: بحجر العثرة
  rationale: صياغة عربية موجزة تحفظ صورة الحجر والصلة اللفظية بين الفعل واسم العثرة.
theological_decisions:
- issue: دلالة πίστις في المقابلة بين الإيمان والأعمال
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: السياق يقابل المنطلق القائم على الإيمان بالمنطلق المتوهم القائم على الأعمال. ولا يقتضي هنا تخصيص المعنى بالأمانة أو حل توتر النص بإضافة تفسير مذهبي.
- issue: قوة ὡς قبل «الأعمال»
  choice: كأنه من الأعمال
  alternative: من الأعمال؛ كما لو كان من الأعمال
  rationale: أُبقيت دلالة التشبيه أو التصور في ὡς، لأن حذفها يحول العبارة إلى تقرير أشد حسمًا من اليونانية.
translation_notes:
  register: فصحى حديثة واضحة وموقرة. أُبقي الإيجاز والحذف النسبي في الجواب باستعمال «ذلك» بدل إدخال تفسير مفصل من السياق السابق، وحُفظت صورة التعثر والحجر.
