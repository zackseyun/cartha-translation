  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: ar
  text: 'فستقول لي إذًا: «فلماذا لا يزال يلوم؟ فمن ذا الذي قاوم مشيئته[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قصده» أو «إرادته». يمكن أن تدل الكلمة اليونانية βούλημα على المشيئة أو القصد أو العزم.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: فستقول
  rationale: صيغة المستقبل هنا استشراف بلاغي لاعتراض متوقَّع في سياق حجاج بولس، و«تقول» أقرب إلى الفعل اليوناني من «تسأل».
- source_word: μοι
  choice: لي
  rationale: تنقل المفعول غير المباشر بوضوح واختصار طبيعيين في العربية.
- source_word: οὖν ... οὖν
  choice: إذًا ... فـ
  rationale: حُفظت الحركة الاستنتاجية التي تؤديها الأداتان، بصياغة عربية طبيعية تتجنب ثقل تكرار «إذًا» حرفيًا.
- source_word: Τί οὖν ἔτι
  choice: فلماذا لا يزال
  rationale: تؤدي «لماذا» معنى τί في هذا التركيب الاستفهامي المتعلق باللوم، وتحفظ «لا يزال» دلالة ἔτι.
- source_word: μέμφεται
  choice: يلوم
  rationale: «يلوم» تعبير عربي مباشر وطبيعي لمعنى توجيه اللوم أو المؤاخذة، من غير توسع تفسيري.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: مشيئته
  rationale: «المشيئة» لفظ عربي واضح وشائع لإرادة مقصودة أو عزم، مع إبقاء البدائل الدلالية مثل «قصده» في الحاشية وعدم حسم التوتر اللاهوتي.
- source_word: τίς
  choice: من ذا الذي
  rationale: صياغة استفهامية بلاغية فصيحة تنقل قوة السؤال من غير إضافة مضمون.
- source_word: ἀνθέστηκεν
  choice: قاوم
  rationale: ينقل معنى الوقوف في وجه الأمر ومقاومته، وتؤدي الصيغة العربية الماضية الأثر السياقي للكمال اليوناني بصورة طبيعية.
theological_decisions:
- issue: دلالة βούλημα في سياق سيادة الله ومسؤولية الإنسان
  choice: مشيئته
  alternative: قصده؛ إرادته؛ عزمه
  rationale: يحافظ «مشيئته» على معنى الإرادة المقصودة من غير شرح كيفية علاقتها بمسؤولية الإنسان. وتذكر الحاشية المجال الدلالي حتى لا تُحسم المسألة اللاهوتية المتنازع عليها بلفظ واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت صياغة حجاجية طبيعية، وحُفظ الاعتراض البلاغي والتوتر بين لوم الإنسان ومشيئة الله دون تفسير مذهبي.
