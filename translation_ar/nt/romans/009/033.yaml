review_pass:
  verdict: revise
  source_fidelity: الترجمة دقيقة في معظم عناصر الآية، بما في ذلك صيغة الاقتباس، وزمن «أضع»، و«في صهيون»، و«حجر عثرة»، وصيغة الوعد المستقبلية المبنية للمجهول. لكن «صخرة سقوط» تنقل النتيجة («السقوط») أكثر مما تنقل معنى σκανδάλου بوصفه عائقًا/سببًا للتعثر أو حجر إساءة؛ والأدق في العربية إبقاء معنى العائق في «صخرة معثرة».
  naturalness: الصياغة فصيحة واضحة ومناسبة للسجل الكتابي الحديث. «ها أنا أضع» عربية طبيعية في هذا الاقتباس، و«من يؤمن به لن يُخزَ» سليمة وموجزة. «صخرة معثرة» طبيعية ومفهومة في السياق، ولا تحتاج إلى شرح معجمي مطوّل.
  terminology: «حجر عثرة» مصطلح راسخ ودقيق لـ λίθον προσκόμματος. واستعمال «صخرة معثرة» لـ πέτραν σκανδάλου يحافظ على الصورة الموازية وعلى دلالة ما يوقع في العثرة، من غير تحويلها إلى «سقوط» بوصفه نتيجة حتمية. الضمير في «به» يبقي الإحالة مفتوحة بين الحجر المصوَّر والتطبيق الشخصي في السياق، فلا يلزم إضافة تفسير مسيحي إلى المتن.
  issues:
  - severity: medium
    issue: «صخرة سقوط» أضيق من دلالة πέτραν σκανδάλου.
    rationale: σκανδάλου يدل أساسًا على عائق أو سبب للتعثر/الإساءة، لا على السقوط نفسه فحسب. «صخرة معثرة» أقرب إلى الصورة السببية في اليونانية وتبقي التوازي البلاغي.
  - severity: low
    issue: الحاشية [a] تجمع بين الإحالة المرجعية والشرح المعجمي الموسع.
    rationale: بعد تعديل المتن إلى «صخرة معثرة» لا تبقى حاجة إلى شرح «فخّ يوقع الإنسان» الذي قد يثقل الحاشية ويعيد توجيه الدلالة نحو السقوط؛ تكفي الإحالة إلى موضعي إشعياء.
