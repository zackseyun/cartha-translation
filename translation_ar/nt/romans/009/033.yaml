  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: ar
  text: 'كما هو مكتوب: «ها أنا أضع في صهيون حجرَ عثرةٍ وصخرةً معثرةً[a]، ومن يؤمن به لن يُخزَ».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يجمع بولس هنا بين إشعياء 8:14 وإشعياء 28:16.
    reason: cross_reference
  - marker: b
    text: 'أو: «لن يُخيَّب»؛ أي لن ينتهي إيمانه إلى الخزي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة وواضحة لتقديم اقتباس كتابي، وتحافظ على دلالة الفعل التام المبني للمجهول.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: تنقل أداة التنبيه بعبارة عربية طبيعية، وتتصل بسلاسة بضمير المتكلم في «أضع».
- source_word: τίθημι
  choice: أضع
  rationale: تحافظ على زمن المضارع وعلى صورة وضع الحجر في موضعه، من غير زيادة تفسيرية.
- source_word: ἐν Σιὼν
  choice: في صهيون
  rationale: تمثل الدلالة المكانية المعتادة لحرف الجر ἐν وتحافظ على اسم المكان بصيغته العربية المعروفة.
- source_word: λίθον προσκόμματος
  choice: حجرَ عثرةٍ
  rationale: تحافظ على التركيب الإضافي وعلى صورة الحجر الذي يؤدي إلى التعثر.
- source_word: πέτραν σκανδάλου
  choice: صخرةَ سقوطٍ
  rationale: تميز العبارة عن «حجر عثرة» وتعبّر عن الشيء الذي يوقع الإنسان؛ وتُذكر دلالة «العائق/الفخ» في الحاشية للمحافظة على سعة اللفظ اليوناني.
- source_word: ὁ πιστεύων
  choice: من يؤمن
  rationale: صياغة عربية طبيعية تنقل اسم الفاعل العام من دون تقييد غير لازم بالجنس.
- source_word: ἐπ’ αὐτῷ
  choice: به
  rationale: الفعل «آمن بـ» هو التعبير العربي الطبيعي، والضمير المذكر يحافظ على صيغة اليونانية وعلى إمكان التطبيق الشخصي في سياق بولس.
- source_word: οὐ καταισχυνθήσεται
  choice: لن يُخزَ
  rationale: يحافظ على المستقبل المبني للمجهول وعلى معنى التعرض للخزي والعار، بدل حصره في مجرد خيبة الأمل.
theological_decisions:
- issue: مرجع الضمير في ἐπ’ αὐτῷ
  choice: «به» بضمير المذكر
  alternative: «بها» عائدًا إلى الصخرة، أو صياغة غير شخصية عائدة إلى الحجر
  rationale: الضمير اليوناني مذكر ويمكن أن يعود نحويًا إلى «الحجر» المذكر، مع بقاء الصورة قابلة للتطبيق الشخصي في سياق رومية على المسيح. تحافظ العربية «به» على هذا التوتر ولا تضيف اسم المسيح إلى نص الاقتباس.
- issue: العلاقة بين إشعياء 8:14 وإشعياء 28:16
  choice: إبقاء الاقتباس المركب كما صاغه بولس والتنبيه إليه في حاشية
  alternative: تحديد كل شطر داخل المتن أو مواءمة الألفاظ مع نص واحد من إشعياء
  rationale: النص اليوناني يجمع عبارتين نبويتين في اقتباس واحد؛ ينبغي ترجمة صياغة بولس نفسها من دون تفكيكها أو تسويتها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع إبقاء الاستعارة الحجرية والتوازي بين «حجر عثرة» و«صخرة سقوط». استُعمل الضبط الجزئي في «يُخزَ» منعًا للالتباس، ووُضعت علامات الحواشي [a] و[b] في مواضعها داخل المتن.
