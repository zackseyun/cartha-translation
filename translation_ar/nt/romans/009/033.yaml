  to: 'كما هو مكتوب: «ها أنا أضع في صهيون حجرَ عثرةٍ وصخرةً معثرةً[a]، ومن يؤمن به لن يُخزَ».[b]'
  rationale: التعديل الوحيد في المتن هو استبدال «صخرة سقوط» بـ«صخرة معثرة» لتقريب σκανδάλου بوصفه عائقًا أو سببًا للتعثر، مع المحافظة على التمييز النسبي عن «حجر عثرة» وعلى الصورة الشعرية المزدوجة. أُبقي «به» لأنه يتيح في العربية، كما في السياق اليوناني، الإحالة إلى الحجر المصوَّر مع قابلية التطبيق الشخصي، من دون حسم تفسيري زائد. ونُقحت الحاشية [a] لتقتصر على وظيفتها المرجعية اللازمة.
