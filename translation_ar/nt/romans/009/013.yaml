  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: ar
  text: 'كما هو مكتوب: «أحببتُ يعقوب،[a] وأما عيسو فأبغضتُه».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'الاقتباس من ملاخي 1: 2–3.'
    reason: cross_reference
  - marker: b
    text: 'أو: «رفضتُ عيسو» أو «أحببتُ عيسو أقل». يفهم بعضهم «أبغضتُه» هنا بمعنى الرفض العهدي أو التفضيل المقارن، لا بمعنى العداوة العاطفية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تقدّم الاقتباس الكتابي بصيغة عربية موجزة وطبيعية تقابل معنى المقارنة في اليونانية.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: صيغة عربية مألوفة لعبارة الاستشهاد الكتابي، وتحافظ مع «كما» على دلالة اليونانية التامة المبنية للمجهول.
- source_word: Ἰακώβ
  choice: يعقوب
  rationale: الاسم العربي الكتابي المستقر.
- source_word: ἠγάπησα
  choice: أحببتُ
  rationale: ينقل المعنى المباشر للفعل وصيغة الماضي في الاقتباس من دون إضافة تفسير زمني.
- source_word: δὲ
  choice: وأما
  rationale: تبرز المقابلة بين يعقوب وعيسو بأسلوب عربي طبيعي، مع الفاء في جواب «أما».
- source_word: Ἠσαῦ
  choice: عيسو
  rationale: الاسم العربي الكتابي المستقر.
- source_word: ἐμίσησα
  choice: أبغضتُه
  rationale: يحفظ الدلالة المباشرة والقوية للفعل اليوناني μισέω ولا يخفف التوتر اللاهوتي داخل المتن.
theological_decisions:
- issue: هل يُخفَّف معنى «أبغضتُه» بسبب الجدل المتعلق بالاختيار الإلهي أو الاستعمال المقارن؟
  choice: الإبقاء على «أبغضتُه» في المتن
  alternative: رفضتُه؛ أو أحببتُه أقل
  rationale: الفعل اليوناني المستشهد به من ملاخي هو μισέω، ودلالته المباشرة «أبغض». إدخال «رفض» أو «أحب أقل» في المتن يحسم احتمالًا تفسيريًا؛ لذلك تُحفظ العبارة الأقوى في النص وتُذكر الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة الاقتباس المألوفة «كما هو مكتوب»، وحُفظت المقابلة البلاغية وقوة الفعل الأخير. وُضعت علامة مرجع الاقتباس بعد الجملة الأولى، وعلامة البدائل التفسيرية بعد العبارة موضع الإشكال.
