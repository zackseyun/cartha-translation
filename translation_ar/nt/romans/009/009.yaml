source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: ar
  text: 'لِأَنَّ كَلِمَةَ الْوَعْدِ هِيَ هذِهِ: «فِي هذَا الْوَقْتِ سَآتِي[a]، وَسَيَكُونُ لِسَارَةَ ابْنٌ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سأعود». يَرِد في اليونانية هنا «سآتي»، لكن بعض الترجمات تستعمل «سأعود» تأثرًا بصياغة النص في سفر التكوين.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: الْوَعْدِ
  rationale: الإضافة في «كَلِمَةَ الْوَعْدِ» تنقل تركيب المضاف إليه بوضوح، وتحافظ على تركيز السياق في الوعد الإلهي من غير افتراض تعريف مستقل زائد.
- source_word: λόγος
  choice: كَلِمَةَ
  rationale: تشير هنا إلى القول المقتبس نفسه؛ و«كلمة» موجزة وطبيعية في العربية الكتابية المعاصرة.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تُظهر أن الآية تعليل للقول السابق، وهو الدور المنطقي الذي تؤديه الأداة اليونانية هنا.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: فِي هذَا الْوَقْتِ
  rationale: صياغة عربية واضحة وقريبة من اليونانية، تشير إلى وقت تحقق الوعد المحدد من غير إضافة معنى «المعيَّن» صراحة.
- source_word: ἐλεύσομαι
  choice: سَآتِي
  rationale: الفعل اليوناني يعني مباشرة «سآتي». أما «سأعود» فتتأثر بصياغة خلفية سفر التكوين في بعض الترجمات، ولذلك تُذكر في الحاشية ولا توضع في المتن.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: سَيَكُونُ لِسَارَةَ ابْنٌ
  rationale: يحافظ على صورة التركيب اليوناني «سيكون لسارة ابن» مع بقائه مفهومًا وطبيعيًا في العربية، ويبرز لفظ «ابن» المحدد جنسيًا.
- source_word: Σάρρᾳ
  choice: سَارَةَ
  rationale: اتباع الصيغة العربية الراسخة للاسم الشخصي سارة.
- source_word: υἱός
  choice: ابْنٌ
  rationale: اللفظ يعني «ابن» تحديدًا، وهذا التحديد مهم في سياق الوعد لإبراهيم وسارة.
theological_decisions:
- issue: اقتباس الوعد لإبراهيم وفاعلية الله
  choice: 'صياغة الوعد بوصفه قولًا إلهيًا مباشرًا: «سآتي»'
  alternative: «سأعود» اتساقًا بصورة أوضح مع بعض تقاليد ترجمة خلفية سفر التكوين
  rationale: حجة بولس تقوم على الوعد الإلهي أساسًا لميلاد إسحاق. يحافظ المتن على قوة هذا المعنى وعلى لفظ النص اليوناني في رومية، من غير إدخال توسع تفسيري أو تغليب صياغة ترجمة سابقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «كلمة الوعد» لصون الصلة اللفظية والبنية الإضافية، وأُبقي تركيب «سيكون لسارة ابن» قريبًا من الأصل من دون ركاكة. وُضع رمز الحاشية [a] مباشرة بعد «سآتي».
