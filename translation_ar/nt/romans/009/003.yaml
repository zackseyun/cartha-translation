  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: ar
  text: فإني كنت أودّ أن أكون أنا نفسي ملعونًا ومقطوعًا عن المسيح[a] من أجل إخوتي[b]، أقاربي بحسب الجسد[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملعونًا، منفصلًا عن المسيح»، أو: «تحت اللعنة، بعيدًا عن المسيح». يجمع التعبير اليوناني بين معنى الوقوع تحت اللعنة والانفصال عن المسيح.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «إخوتي». والمقصود في السياق بنو قوم بولس من الإسرائيليين، أي أقاربه من جهة الأصل العرقي.'
    reason: cultural_note
  - marker: c
    text: تعني عبارة «بحسب الجسد» هنا القرابة بالنسب الجسدي أو الأصل العرقي، لا «الطبيعة الخاطئة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: كنت أودّ لو
  rationale: ينقل صيغة الماضي الناقص مع معنى التمنّي الافتراضي أو المتعذّر، من غير أن يحوّل الكلام إلى صلاة فعلية صريحة.
- source_word: γὰρ
  choice: فإني
  rationale: تحفظ الصلة التفسيرية بما سبق وتلائم تدفّق الحجة في العربية.
- source_word: ἀνάθεμα
  choice: ملعونًا
  rationale: يعبّر بوضوح عن الوقوع تحت اللعنة، مع إبقاء ثقله الديني من غير استعمال لفظ معرّب غامض.
- source_word: αὐτὸς ἐγώ
  choice: أنا نفسي
  rationale: يحفظ توكيد بولس القوي على شخصه.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: مقطوعًا عن المسيح
  rationale: تُظهر «عن» معنى الانفصال الذي تحمله ἀπό، و«مقطوعًا» توضح شدة الإقصاء؛ أما «المسيح» فهي المقابل العربي الطبيعي للقب Χριστός.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: ينقل المعنى النفعي أو التضحيوي في السياق بعبارة عربية طبيعية.
- source_word: τῶν ἀδελφῶν μου
  choice: إخوتي
  rationale: ترجمة مباشرة للجمع المذكر، والسياق يحدده بأنه يشير إلى أبناء قوم بولس.
- source_word: τῶν συγγενῶν μου
  choice: ذوي قرابتي
  rationale: يحفظ معنى القرابة القائمة على الأصل والنسب، ولا يقصرها على دائرة الأسرة القريبة.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: يحافظ على التعبير البولسي وعلى دلالته هنا إلى النسب الجسدي أو العرقي، مع توضيح المعنى في الحاشية.
theological_decisions:
- issue: هل العبارة صلاة فعلية أم تمنٍّ افتراضي؟
  choice: صيغت بعبارة «كنت أودّ لو» لتدل على تمنٍّ افتراضي شديد.
  alternative: «كنت أصلّي» أو «كنت أتمنى» بصيغة تقريرية مباشرة.
  rationale: هذا لا يجزم بأن بولس طلب فعلًا أن يُفصل عن المسيح، لكنه يحفظ قوة استعداده المعبَّر عنه.
- issue: العلاقة بين ἀνάθεμα وἀπὸ τοῦ Χριστοῦ
  choice: «ملعونًا ومقطوعًا عن المسيح» مع حاشية تبين إمكانات تركيب العبارة.
  alternative: «ملعونًا من المسيح» أو «تحت اللعنة، منفصلًا عن المسيح».
  rationale: الصياغة الرئيسة تنقل عنصري اللعنة والانفصال بوضوح، والحاشية تحفظ الإيجاز التركيبي والاحتمال الدلالي في اليونانية.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: لفظ منقول صوتيًا أو معاملته كاسم مجرد بلا دلالة لقبية.
  rationale: «المسيح» هو المقابل العربي الراسخ الذي يحفظ معنى اللقب.
- issue: دلالة σάρξ في κατὰ σάρκα
  choice: النسب الجسدي أو العرقي، بصيغة «بحسب الجسد».
  alternative: الطبيعة الخاطئة.
  rationale: السياق يتحدث عن قرابة بولس ببني قومه من جهة الأصل، لا عن الأنثروبولوجيا الأخلاقية أو الميل إلى الخطية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوكيد في «أنا نفسي»، واستُعملت «كنت أودّ لو» لصون الطابع الافتراضي، مع إبقاء التعبير البولسي «بحسب الجسد» وشرحه في الحاشية.
