  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: ar
  text: فإذًا[a]، لا يتوقف الأمر على من يشاء ولا على من يركض[b]، بل على الله الذي يرحم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى الحرفية: «فإذًا، ليس الأمر لمن يشاء ولا لمن يركض، بل لله الذي يرحم». العبارة اليونانية حذفية، ويُفهم موضوعها من سياق قصد الله ورحمته.'
    reason: lexical_alternative
  - marker: b
    text: قد يُستعمل «يركض» هنا مجازًا بمعنى يبذل الجهد أو يسعى، لكن الفعل اليوناني يعني حرفيًا «يركض».
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: فإذًا
  rationale: تنقل أداتا الاستنتاج معًا خلاصة بولس المنطقية بصياغة عربية طبيعية وموجزة.
- source_word: οὐ ... οὐδὲ
  choice: لا ... ولا
  rationale: تحافظ هذه البنية على النفي المزدوج المتوازي في اليونانية بعبارة عربية سليمة.
- source_word: τοῦ θέλοντος
  choice: من يشاء
  rationale: اسم الفاعل المعرّف في اليونانية مستعمل استعمال الاسم، و«من يشاء» يحفظ معنى الإرادة من غير تلطيفه إلى مجرد رغبة.
- source_word: τοῦ τρέχοντος
  choice: من يركض
  rationale: يحفظ المعنى الحرفي والصورة المجازية للفعل τρέχω، مع بيان دلالته المحتملة في الحاشية.
- source_word: ἀλλὰ
  choice: بل
  rationale: تلائم «بل» الانتقال من النفي إلى الإثبات وتبرز المقابلة القوية في العبارة.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: الله الذي يرحم
  rationale: تحفظ الصياغة الفعلية لاسم الفاعل وتعرض الرحمة بوصفها فعل الله، لا مجرد صفة ساكنة.
- source_word: implied predicate/expression
  choice: لا يتوقف الأمر على
  rationale: النص اليوناني موجز حذفيًا ولا يصرح بالمسند أو بموضوعه؛ و«الأمر» يتيح للسياق أن يحدد المرجع من غير حصره صراحة في الخلاص أو الاختيار.
theological_decisions:
- issue: الموضوع المحذوف ونطاق الاتكال
  choice: لا يتوقف الأمر على
  alternative: 'ليس الأمر لمن يشاء؛ أو: لا يعتمد الخلاص على إرادة الإنسان أو سعيه'
  rationale: يحافظ النص على الإيجاز الحذفي وعلى التوتر اللاهوتي في الأصل، فلا يسمّي الخلاص أو الاختيار في المتن تسمية قد تضيّق دلالة السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقيت صورة الركض كما في الأصل، وحُفظ الحذف الدلالي قدر الإمكان مع استكمال عربي محدود يحقق الوضوح.
