source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: ar
  text: 'لِأَنَّ الْكِتَابَ يَقُولُ لِفِرْعَوْنَ: «لِهَذَا الْغَرَضِ عَيْنِهِ أَقَمْتُكَ[a]، لِكَيْ أُظْهِرَ فِيكَ قُوَّتِي، وَلِكَيْ يُعْلَنَ اسْمِي[b] فِي الأَرْضِ كُلِّهَا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أبقيتك» أو «جعلتك تقوم»؛ فالفعل في سياق الاقتباس من سفر الخروج يحتمل هذه الدلالات الأوسع.'
    reason: lexical_alternative
  - marker: b
    text: لا يدل «اسمي» هنا على مجرد لفظ يُنطق، بل على صيت الله المعلَن وما يُعرَف به.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: لِأَنَّ الْكِتَابَ يَقُولُ لِفِرْعَوْنَ
  rationale: يحفظ «لأن» الصلة التفسيرية بما سبق، ويُبقي المضارع وتشخيص الكتاب بوصفه متكلمًا، وفق صياغة عربية واضحة.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: لِهَذَا الْغَرَضِ عَيْنِهِ
  rationale: تنقل دلالة الغرض والتوكيد في العبارة اليونانية.
- source_word: ἐξήγειρά σε
  choice: أَقَمْتُكَ
  rationale: لفظ عربي واسع نسبيًا يدل على جعل فرعون قائمًا في هذا الموضع أو الدور، من غير حصر المعنى في خلقه أو إبقائه حيًا وحده.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: لِكَيْ أُظْهِرَ فِيكَ قُوَّتِي
  rationale: تحفظ غرض الجملة ودلالة الإظهار العلني، مع إبقاء ἐν σοὶ بصيغة «فيك» بدل تفسيرها بـ«بواسطتك».
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: وَلِكَيْ يُنَادَى بِاسْمِي
  rationale: صيغة المبني للمجهول تحفظ عدم تعيين القائم بالمناداة، و«يُنادى» تنقل معنى الإعلان الواسع.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: فِي الأَرْضِ كُلِّهَا
  rationale: تحفظ المجال العالمي للعبارة، ولا تضيّقه إلى أرض أو بلاد بعينها.
theological_decisions:
- issue: دلالة ἐξήγειρά σε وعلاقتها بسيادة الله ومسؤولية فرعون
  choice: أَقَمْتُكَ
  alternative: أَبْقَيْتُكَ / جَعَلْتُكَ تَقُومُ
  rationale: 'تحافظ «أقمتك» على سعة الفعل في سياق اقتباس الخروج: وضع فرعون أو إبقاؤه قائمًا لهذا الغرض، من غير حسم الجدل اللاهوتي في اتجاه خلقه لهذا الدور أو مجرد حفظ حياته.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الكتاب» مفردًا معرفًا للمحافظة على تشخيص النص المقدس، وحُفظ التوازي بين عبارتي الغرض «لكي... ولكي...». علامات الحواشي [a] و[b] واردة في المتن.
