  rationale: يقتصر التعديل على جعل الإعلان واقعًا صراحةً على «اسمي»، وهو ما يطابق المبني للمجهول في διαγγελῇ ومعنى الإعلان العلني، وعلى تصحيح علامة الوقف. أما «أقمتك» فتُبقى لأنها تنقل بصورة موجزة السعة المقصودة في الاقتباس ولا تحسم آلية الإقامة أو الإبقاء.
