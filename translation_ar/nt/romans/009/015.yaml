  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: ar
  text: 'لأنه يقول لموسى: «سأرحم من أرحم، وأشفق على من أشفق».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن ترجمتها: «سأُظهر رحمةً لمن أُظهر له رحمةً، وسأُبدي شفقةً لمن أُبدي له شفقةً».'
    reason: lexical_alternative
  - marker: b
    text: اقتباس من خروج 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: لموسى
  rationale: صيغة المجرور باليونانية تؤدي وظيفة المفعول غير المباشر بعد «يقول»، و«موسى» هو الرسم العربي المعياري للاسم.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تربط العبارة بما قبلها بوصفها تعليلًا أو إسنادًا للحجة، من غير إضافة تفسير غير موجود في النص.
- source_word: λέγει
  choice: يقول
  rationale: حُفظ زمن المضارع في صيغة الاستشهاد الكتابي، والفاعل المفهوم هو الله المتكلم مع موسى في سياق الخروج.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: سأرحم … أرحم
  rationale: يحفظ الفعل نفسه في طرفي العبارة، ويحافظ على تكرار الأصل وصيغته المكثفة الدالة على حرية الرحمة الإلهية.
- source_word: ὃν ἂν
  choice: مَن
  rationale: اسم الموصول العام «مَن» يؤدي معنى المفعول غير المحدد بصورة طبيعية في العربية، من غير إدخال معنى الاختيار صراحة.
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: أشفق … أشفق
  rationale: «أشفق على» تعبير عربي واضح عن الرأفة والشفقة، ويحفظ التمييز اللفظي عن ἐλεέω مع إبقاء التوازي والتكرار.
theological_decisions:
- issue: تعيين المتكلم في صيغة الاستشهاد
  choice: إبقاء الفاعل مستترًا في «يقول»، بحيث يُفهم من اقتباس الخروج أن الله هو المتكلم
  alternative: 'أن يقال: «فالكتاب يقول لموسى» أو «قال الله لموسى»'
  rationale: اليونانية لا تذكر الفاعل صراحة، مع أن سياق خروج 33:19 يبيّن أن المتكلم هو الله. الصياغة العربية تحفظ هذا القدر من الضمنية ولا تجعل الكتاب هو الفاعل ولا تضيف اسم الله إلى المتن.
- issue: حرية الرحمة والشفقة الإلهيتين
  choice: 'الحفاظ على الصياغة التكرارية: «سأرحم من أرحم، وأشفق على من أشفق»'
  alternative: 'تفسيرها بعبارة مثل: «سأرحم من أختار أن أرحمه»'
  rationale: النص لا يورد فعل «أختار». إبقاء التكرار يحفظ التوتر اللاهوتي وامتناع العبارة عن شرح معيار الرحمة بدل حسم الجدل التفسيري.
translation_notes:
  register: العربية فصحى معاصرة واضحة وموقرة. استُخدم «لأنه» لإبقاء الصلة التعليلية بما قبل الآية، وحُفظ التوازي والتكرار المقصودان في الاقتباس، مع تجنب إدخال لفظ «الاختيار» غير الوارد في اليونانية.
