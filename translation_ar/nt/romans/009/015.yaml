  source_fidelity: 'المتن يحفظ بدقة البنية اليونانية: «لأنه» تؤدي γάρ، و«يقول لموسى» تحفظ المضارع وصيغة المخاطَب غير المباشر، كما يحافظ الاقتباس على التوازي والتكرار والتمييز بين ἐλεέω («أرحم») وοἰκτίρω («أشفق على»). ولا يضيف معيارًا تفسيريًا للرحمة أو الشفقة.'
