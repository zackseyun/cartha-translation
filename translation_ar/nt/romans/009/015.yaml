  terminology: '«أرحم» و«أشفق على» مناسبان ومتمايزان دلاليًا. يلزم أيضًا تصحيح ربط الحواشي: ينبغي أن تكون حاشية البديل المعجمي مرتبطة بالاقتباس، وحاشية الإحالة إلى خروج مرتبطة به كذلك، مع موافقة ترقيم/وظيفة مسار التدقيق الإنجليزي.'
