  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: ar
  text: فإذًا، يرحم من يشاء[a]، ويُقَسِّي من يشاء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتحنّن على من يشاء».'
    reason: بديل معجمي يبرز جانب الشفقة في فعل ἐλεεῖ، مع أن «يرحم» أوجز وأطبع في العربية.
  - marker: b
    text: يمكن أيضًا ترجمة «يُقَسِّي» بـ«يجعل عنيدًا» أو «يجعله متصلبًا»؛ والفعل اليوناني مبني للمعلوم، فلا ينبغي تخفيفه إلى مجرد السماح بالتقسية.
    reason: توضيح المجال الدلالي للفعل والحفاظ على فاعليته النحوية واللاهوتية.
lexical_decisions:
- source_word: ἄρα οὖν
  choice: فإذًا
  rationale: تنقل أداتا الاستنتاج مجتمعتين قوة الخلاصة المترتبة على الكلام السابق، بصياغة عربية واضحة وموجزة.
- source_word: ὃν θέλει
  choice: من يشاء
  rationale: تحافظ هذه الصياغة على دلالة الإرادة الإلهية وعلى التوازي المتعمد بين شطري الآية، وتناسب المقام الجليل دون تكلّف.
- source_word: ἐλεεῖ
  choice: يرحم
  rationale: فعل عربي مباشر وطبيعي يدل على إظهار الرحمة، ويقابل الفعل اليوناني بوضوح.
- source_word: ὃν δὲ θέλει
  choice: من يشاء
  rationale: تكرار العبارة يحفظ تماثل التركيب اليوناني، بينما تؤدي الواو معنى الانتقال المقابل بين الرحمة والتقسية بصورة طبيعية في العربية.
- source_word: σκληρύνει
  choice: يُقَسِّي
  rationale: يحفظ صيغة الفعل المبني للمعلوم وإسناد الفعل مباشرة إلى الفاعل، كما يبقي الصلة اللفظية بسياق تقسية فرعون ولا يحوّل المعنى إلى مجرد السماح.
theological_decisions:
- issue: دلالة المشيئة الإلهية في θέλει
  choice: الإبقاء على العبارة المباشرة «من يشاء» في الشطرين
  alternative: تخفيفها إلى معنى السماح أو إعادة صياغتها بما يحسم العلاقة بين السيادة الإلهية ومسؤولية الإنسان
  rationale: النص اليوناني يصرح بالمشيئة في الحالتين، لذلك تحافظ الترجمة على التوتر اللاهوتي دون إدخال تفسير مذهبي.
- issue: الفاعلية في σκληρύνει
  choice: 'ترجمة الفعل بصيغة المعلوم: «يُقَسِّي»'
  alternative: «يسمح له بأن يقسو» أو «يتركه لقساوته»
  rationale: الفعل اليوناني مبني للمعلوم ويسند التقسية مباشرة إلى الفاعل؛ وتحويله إلى مجرد إذن يتجاوز نص المصدر.
translation_notes:
  register: عربية فصحى حديثة، موجزة وجليلة، تحافظ على التوازي البلاغي بين «يرحم من يشاء» و«يُقَسِّي من يشاء». استُعمل ضبط جزئي في «يُقَسِّي» لمنع التباس القراءة.
