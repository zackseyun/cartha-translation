id: ROM.9.20
reference: Romans 9:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: ar
  text: 'بل[a] مَن أنت، أيها الإنسان[b]، حتى تردَّ على الله معترضًا؟ أفيقول المصنوع لصانعه[c]: «لماذا صنعتني هكذا؟»[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بل على العكس» أو «بل بالأحرى»؛ فالأداة اليونانية تحمل قوة استدراكية مصحِّحة.'
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني مفرد، ومعناه هنا إنسان بوصفه ممثلًا للبشر.
    reason: cultural_note
  - marker: c
    text: 'السؤال في اليونانية يتوقع جوابًا بالنفي: لا يقول المصنوع ذلك لصانعه.'
    reason: lexical_alternative
  - marker: d
    text: 'يمكن أيضًا: «لماذا صنعتني على هذا النحو؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: بل
  rationale: أداة تفيد توكيد الاستدراك والانتقال إلى ردٍّ مصحِّح. و«بل» تؤدي هذا المنعطف بوضوح وإيجاز في العربية المعاصرة.
- source_word: ὦ ἄνθρωπε
  choice: أيها الإنسان
  rationale: نداء مفرد موجَّه إلى إنسان بوصفه ممثلًا للبشر، و«أيها الإنسان» يحفظ قوة الخطاب المباشر من غير قصره على الذكور.
- source_word: σὺ τίς εἶ
  choice: مَن أنت
  rationale: استفهام إنكاري يتحدى أهلية المخاطَب للاعتراض، لا سؤال يطلب التعريف بهويته.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: حتى تردَّ على الله معترضًا
  rationale: الفعل يدل على الردّ المناقض أو المعترض، لا على مجرد الإجابة؛ وإضافة «معترضًا» تُظهر هذه الدلالة طبيعيًا في العربية.
- source_word: μὴ ἐρεῖ
  choice: أفيقول
  rationale: السؤال اليوناني يتوقع جوابًا بالنفي. وصيغة الاستفهام الإنكاري «أفيقول» تنقل هذا التوقع من غير إدخال نفي صريح في نص السؤال.
- source_word: τὸ πλάσμα
  choice: المصنوع
  rationale: يدل اللفظ على الشيء الذي جرى تشكيله أو صنعه، و«المصنوع» موجز ويحفظ المقابلة بين المخلوق وصانعه.
- source_word: τῷ πλάσαντι
  choice: لصانعه
  rationale: اسم الفاعل اليوناني يشير إلى الذي شكّل الشيء. و«صانعه» يحافظ على الصلة اللفظية الواضحة مع «المصنوع».
- source_word: Τί με ἐποίησας οὕτως;
  choice: لماذا صنعتني هكذا؟
  rationale: ترجمة مباشرة وطبيعية تحفظ السؤال ولفظة οὕτως، أي «هكذا» أو «على هذا النحو».
theological_decisions:
- issue: القوة التمثيلية للفظ ἄνθρωπε
  choice: أيها الإنسان
  alternative: أيها الرجل
  rationale: الخطاب موجَّه إلى فرد بوصفه ممثلًا للبشر أمام الله؛ لذلك تعبّر «الإنسان» عن العموم المقصود وتحفظ صيغة النداء المفرد.
- issue: حدة توبيخ بولس وعدم التكافؤ بين الإنسان والله
  choice: حتى تردَّ على الله معترضًا
  alternative: حتى تجيب الله
  rationale: النص يصف ردًّا اعتراضيًا غير لائق من المصنوع تجاه صانعه. والترجمة المختارة لا تخفف هذه المواجهة ولا تزيد عليها تقريرًا لاهوتيًا غير مذكور.
- issue: الاستفهام الذي يتوقع النفي
  choice: أفيقول المصنوع لصانعه
  alternative: ألا يقول المصنوع لصانعه
  rationale: μή مع المستقبل يتوقع جوابًا بالنفي. أما «ألا يقول» فقد تُفهم في العربية على أنها تتوقع الإثبات، لذلك اختير استفهام إنكاري يحفظ اتجاه السؤال.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. حُفظ النداء المباشر والاستفهام الإنكاري، واستُخدمت المقابلة «المصنوع/صانعه» لإبراز الصورة من غير إدخال مصطلحات مذهبية أو حسم ما يتجاوز دلالة الآية.
