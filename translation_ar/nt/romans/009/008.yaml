  terminology: «الجسد» و«الوعد» و«نسلًا» مقابلات مناسبة ومتسقة للمصطلحات البولسية في هذا السياق. لا تُدخل الترجمة تفسيرًا مذهبيًا زائدًا، وتحافظ على تمييز النص بين النسب الجسدي والوعد.
