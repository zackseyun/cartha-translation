id: ROM.9.8
reference: Romans 9:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: ar
  text: أي إن أولاد الجسد ليسوا هم أولاد الله، بل أولاد الوعد يُحسَبون نسلًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: أي إن
  rationale: تؤدي وظيفة العبارة التفسيرية في العربية المعاصرة بوضوح وإيجاز.
- source_word: τέκνα
  choice: أولاد
  rationale: لفظ شامل للجنسين وملائم للحديث عن الذرية، ويحافظ على تكرار اللفظ في المقابلة.
- source_word: σάρξ / τὰ τέκνα τῆς σαρκὸς
  choice: الجسد / أولاد الجسد
  rationale: يحفظ صورة بولس الأصلية والمقابلة مع «أولاد الوعد»، مع دلالة السياق على النسب الطبيعي.
- source_word: τέκνα τοῦ θεοῦ
  choice: أولاد الله
  rationale: صياغة عربية طبيعية تحافظ على علاقة الإضافة في اليونانية.
- source_word: ἐπαγγελία / τὰ τέκνα τῆς ἐπαγγελίας
  choice: الوعد / أولاد الوعد
  rationale: يحفظ التعبير البولسي ويشير إلى الذين يتحدد انتماؤهم بوعد الله.
- source_word: λογίζεται
  choice: يُحسَبون
  rationale: ينقل معنى الاعتبار أو العدّ بصيغة المبني للمجهول دون التصريح بفاعل لم يذكره النص.
- source_word: εἰς σπέρμα
  choice: نسلًا
  rationale: '«نسل» هو المقابل العربي الطبيعي لـσπέρμα حين يدل على الذرية في السياق الإبراهيمي، والنصب يلائم معنى التصنيف: يُحسبون نسلًا.'
theological_decisions:
- issue: المقابلة بين النسب الجسدي والخط الذي يحدده وعد الله
  choice: إبقاء المقابلة بين «أولاد الجسد» و«أولاد الوعد» كما يصوغها النص، من غير تحديد نظام لاهوتي أضيق.
  alternative: تفسير الآية صراحةً تفسيرًا جماعيًا تاريخيًا محضًا، أو فرديًا قدريًا.
  rationale: النص اليوناني يقرر المقابلة، لكنه لا يحسم داخل هذه الآية وحدها الخلافات اللاهوتية الأوسع؛ لذلك تحفظ الترجمة توتر النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت صياغة قريبة من بنية الأصل، مع تجنب الغموض غير الضروري والمحافظة على المصطلحات المتقابلة.
