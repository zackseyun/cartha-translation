  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: ar
  text: ولهم الآباء، ومنهم المسيح بحسب الجسد[a]، وهو فوق الجميع، الله المبارك إلى الأبد[b]. آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: من جهة النسب البشري. وحرفياً: «بحسب الجسد».'
    reason: lexical_alternative
  - marker: b
    text: 'أو، إذا عُدّت العبارة الأخيرة تسبيحاً مستقلاً: «وليكن الله، الذي هو فوق الجميع، مباركاً إلى الأبد. آمين»، بدلاً من اعتبارها وصفاً للمسيح.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: الآباء
  rationale: ترجمة قريبة من اللفظ اليوناني، تشير إلى آباء إسرائيل الموقرين وتحافظ على لغة بولس ذات البعد التاريخي العهدي، من غير حصرها في «الآباء الأولين» بمعنى أضيق.
- source_word: ἐξ ὧν
  choice: ومنهم جاء
  rationale: يعود الضمير إلى بني إسرائيل، وإضافة «جاء» تجعل العبارة سليمة وطبيعية بالعربية من دون تغيير معنى الأصل.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ هنا لقب مرتبط بامتيازات إسرائيل ونسب المسيح، ولذلك تُستعمل الصيغة العربية المألوفة «المسيح».
- source_word: τὸ κατὰ σάρκα
  choice: بحسب الجسد
  rationale: تحافظ العبارة على صياغة بولس، والمقصود هنا النسب البشري أو الأرضي، لا الطبيعة الخاطئة؛ ويُشرح المعنى في الحاشية.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: وهو فوق الجميع
  rationale: تواصل العبارة وصف المسيح على نحو طبيعي، وتحافظ على دلالة اسم الفاعل المعرّف في اليونانية.
- source_word: θεὸς εὐλογητὸς
  choice: الله المبارك
  rationale: تعكس القراءة التي تجعل العبارة بدلاً أو وصفاً للمسيح، بصياغة عربية واضحة ومهيبة، مع إثبات احتمال الفصل وجعلها تسبيحاً مستقلاً في الحاشية.
- source_word: εἰς τοὺς αἰῶνας
  choice: إلى الأبد
  rationale: مقابل عربي مألوف وموجز للعبارة التسبيحية اليونانية.
- source_word: ἀμήν
  choice: آمين
  rationale: الصيغة العربية الليتورجية المألوفة للتوكيد الختامي.
theological_decisions:
- issue: هل تصف العبارة «ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας» المسيح، أم تبدأ تسبيحاً مستقلاً لله؟
  choice: 'اعتُبرت العبارة استمراراً لوصف المسيح: «وهو فوق الجميع، الله المبارك إلى الأبد».'
  alternative: 'يمكن فصل العبارة بوصفها تسبيحاً مستقلاً: «وليكن الله، الذي هو فوق الجميع، مباركاً إلى الأبد. آمين».'
  rationale: السياق النحوي الأقرب يجعل اسم الفاعل المعرّف «ὁ ὢν» تابعاً لـ«ὁ χριστός»، لكن المخطوطات المبكرة لا تتضمن علامات ترقيم تحسم المسألة، والقراءة التسبيحية المستقلة احتمال معروف؛ لذلك حُفظت في الحاشية بدلاً من إلغائها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حوفظ على التعبير البولسي «بحسب الجسد» مع شرحه، وعلى التوتر النحوي واللاهوتي في الجملة الأخيرة بإثبات القراءة البديلة في الحاشية.
