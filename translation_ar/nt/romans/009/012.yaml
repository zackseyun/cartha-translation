  text: 'ليس من أعمال، بل من الذي يدعو، قيل لها: «الأكبر سيخدم الأصغر».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اقتباس من تكوين 25:23. أو: «الأعظم سيخدم الأقل»؛ ويفهم «الأكبر... الأصغر» في سياق يعقوب وعيسو على أنهما الأكبر والأصغر سنًا.'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: 'أو: «ليس على أساس الأعمال، بل على أساس دعوة الداعي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: لا من أعمال
  rationale: تحافظ «من» على دلالة ἐκ الموجزة التي تحتمل المصدر أو الأساس، من غير توسيع تفسيري.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: بل من الذي يدعو
  rationale: تنقل اسم الفاعل المعرّف المستعمل استعمال الاسم، وتحافظ صيغة المضارع على جانب الفعل المستمر من غير إضافة اسم الله غير المذكور صراحة في العبارة.
- source_word: ἐρρέθη αὐτῇ
  choice: قيل لها
  rationale: صياغة عربية طبيعية للمبني للمجهول، تبقي فاعل القول غير مصرّح به كما في اليونانية.
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: تُدخل ὅτι هنا كلامًا مباشرًا، وتؤدي علامات الاقتباس هذه الوظيفة بوضوح في العربية.
- source_word: Ὁ μείζων
  choice: الكبير
  rationale: تنقل اللفظة المقارنة بما يحفظ احتمال معنى الأكبر سنًا أو الأعظم منزلة، بدل حصرها في السن داخل المتن.
- source_word: δουλεύσει
  choice: سيخدم
  rationale: تعبر عن الخضوع في الخدمة من غير المبالغة بإدخال لفظ العبودية الصريح في سياق العلاقة بين الأخوين أو الشعبين.
- source_word: τῷ ἐλάσσονι
  choice: الصغير
  rationale: تقابل «الكبير» طبيعيًا وتحفظ احتمال الأصغر سنًا أو الأقل منزلة الذي تسمح به اللفظة اليونانية.
theological_decisions:
- issue: هل يُوسَّع التضاد بين الأعمال والذي يدعو لشرح عقيدة الاختيار غير المشروط؟
  choice: 'الإبقاء على العبارة الموجزة: «لا من أعمال، بل من الذي يدعو»'
  alternative: «لا بسبب الأعمال، بل بسبب الله الذي يدعو»
  rationale: النص يضع الأعمال في مقابل الداعي، لكن تسمية الله صراحة وتحديد العلاقة بأنها سببية شرحان يفهمان من السياق ولا ينبغي إدخالهما في هذه العبارة المقتضبة.
- issue: هل يُحسم معنى μείζων وἐλάσσων بأنه الأكبر والأصغر سنًا؟
  choice: «الكبير ... الصغير» مع بيان السياق في الحاشية
  alternative: «الأكبر ... الأصغر»
  rationale: السياق في تكوين 25 يتعلق بعيسو ويعقوب، لكن اللفظين نفسيهما يحتملان أيضًا الأكبر/الأعظم والأصغر/الأقل؛ فاختيار «الكبير/الصغير» يحفظ قدرًا من هذا التوتر.
translation_notes:
  register: عربية فصحى معاصرة، موجزة ورصينة. حوفظ على تركيب الآية بوصفها جزءًا من جملة ممتدة من السياق السابق، وعلى المبني للمجهول في «قيل لها». وُضعت علامتا الحاشية في المتن بعد الاقتباس.
