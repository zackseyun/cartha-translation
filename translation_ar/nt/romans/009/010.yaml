  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: ar
  text: وليس هذا فقط، بل إن رفقة أيضًا حبلت من رجل واحد، هو إسحاق أبونا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لها مضجع من واحد، إسحاق أبينا»؛ وهو تعبير يشير هنا إلى الحبل من رجل واحد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: وليس هذا فقط، بل إن... أيضًا
  rationale: ينقل التركيب الترابطي الإضافي بلغة عربية طبيعية، ويحفظ تتابع حجة بولس.
- source_word: Ῥεβέκκα
  choice: رفقة
  rationale: الصيغة العربية الكتابية المألوفة لاسم الأم رفقة.
- source_word: ἐξ ἑνός
  choice: من رجل واحد
  rationale: لفظ «واحد» في اليونانية مذكر، والمقصود به هنا أب واحد؛ والتصريح بكلمة «رجل» يوضح المضمر من غير إضافة معنى عقدي.
- source_word: κοίτην ἔχουσα
  choice: حبلت
  rationale: تعبير يوناني يتصل بالمضجع والعلاقة التي ينتج منها الحبل؛ وصيغة «حبلت» تؤدي المقصود بوضوح واحتشام.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: هو إسحاق أبونا
  rationale: يبيّن أن الرجل الواحد هو إسحاق، ويحفظ الوصف النسبي «أبونا» بعبارة عربية واضحة.
theological_decisions:
- issue: مدى التصريح بمعنى تعبير المضجع/الحبل في سياق حجة الاختيار
  choice: صياغة المعنى على أن رفقة حبلت من رجل واحد، هو إسحاق
  alternative: ترجمة حرفية أقرب إلى «كان لها مضجع من واحد، إسحاق أبينا»
  rationale: السياق يشدد على وحدة الأب للولدين، لكن الآية نفسها لا تصرح بلفظ «ولدين»؛ لذلك توضح الصياغة مدلول التعبير من غير إدخال هذا اللفظ أو حسم ما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «رفقة» و«إسحاق» وفق الصيغ العربية الكتابية المألوفة، ووُضعت الحاشية بعد الجملة لتفسير التعبير اليوناني الاصطلاحي.
