  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: ar
  text: أَمْ لَيْسَ لِلْخَزَّافِ سُلْطَانٌ عَلَى الطِّينِ أَنْ يَصْنَعَ مِنَ الْكُتْلَةِ نَفْسِهَا إِنَاءً لِلْكَرَامَةِ، وَآخَرَ لِلْمَهَانَةِ؟[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أم ليس للخزاف حقٌّ على الطين؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من الخليط نفسه» أو «من العجينة نفسها».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «إناءً لاستعمال كريم، وآخر لاستعمال عادي».'
    reason: alternative_reading
  - marker: d
    text: 'ترد صورة الخزاف والطين أيضًا في إشعياء 29: 16؛ 45: 9؛ وإرميا 18: 1–6.'
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: أَمَا
  rationale: تستأنف سؤالًا بلاغيًا متصلًا بحجة بولس؛ وصيغة «أما...؟» عربية طبيعية تفيد التوقع الإيجابي من غير إضافة توكيد زائد.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: أَلَيْسَ لَهُ سُلْطَانٌ / أَمَا لَهُ سُلْطَانٌ
  rationale: «سلطان» ينقل معنى الصلاحية والحق المشروع في التصرف، لا مجرد القدرة العملية.
- source_word: ὁ κεραμεὺς
  choice: الْخَزَّاف
  rationale: المقابل العربي الدقيق للصانع الذي يشكّل الطين، ويحفظ صورة الخزاف والطين المعروفة في الأنبياء.
- source_word: τοῦ πηλοῦ
  choice: عَلَى الطِّين
  rationale: حرف الجر «على» يلائم «سلطان» في العربية ويبين علاقة التصرف والسيادة التي تفيدها الإضافة اليونانية.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: مِنَ الْعَجِينَةِ نَفْسِهَا
  rationale: φυράμα هو كتلة ممزوجة أو معجونة؛ و«العجينة» مفهومة في سياق الطين وتحافظ على وحدة المادة التي صُنِع منها الإناءان.
- source_word: ποιῆσαι
  choice: أَنْ يَصْنَعَ
  rationale: صياغة مباشرة وطبيعية للفعل العام الدال على الصنع، من غير توسيع تفسيري.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: إِنَاءً ... وَآخَرَ
  rationale: تنقل المقابلة بين الناتجين بوضوح وطلاقة في العربية.
- source_word: εἰς τιμὴν
  choice: لِلْكَرَامَة
  rationale: تحفظ لفظ الكرامة والمكانة في اليونانية، ولا تحصر العبارة في نوع استعمال منزلي معين.
- source_word: σκεῦος
  choice: إِنَاء
  rationale: أنسب مقابل في صورة الخزاف، وهو واضح وشائع في العربية الكتابية المعاصرة.
- source_word: εἰς ἀτιμίαν
  choice: لِلْمَهَانَة
  rationale: تحفظ التضاد المباشر مع «الكرامة» من غير تحويله إلى تفسير وظيفي مثل «للاستعمال العادي».
theological_decisions:
- issue: هل تُترجم ἐξουσία بمعنى السلطان أم الحق أو القدرة؟
  choice: سلطان
  alternative: حق؛ قدرة
  rationale: «سلطان» يجمع معنى الصلاحية والحق في التصرف، ولا يحوّل العبارة إلى مجرد قدرة مادية، كما لا يحمّلها صياغة عقائدية أوسع من النص.
- issue: هل تُفسَّر εἰς τιμὴν / εἰς ἀτιμίαν بحسب الاستعمال الوظيفي؟
  choice: للكرامة ... للمهانة
  alternative: لاستعمال كريم ... لاستعمال عادي
  rationale: الأصل يستعمل ثنائية الكرامة والمهانة صراحة؛ والإبقاء عليها يصون اتساع الاستعارة والتوتر اللاهوتي ولا يقصرها على الأغراض المنزلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ السؤال البلاغي وصورة الخزاف والطين، واستُبقي تضاد الكرامة والمهانة من غير حسم دلالته بوظيفة منزلية أو بإطار عقائدي خاص.
