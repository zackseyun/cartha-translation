  source_fidelity: 'المعنى العام دقيق: الخزاف والطين، السلطان، الكتلة الواحدة، وإناء للكرامة وآخر للمهانة. لكن «أما» لا تُظهر بوضوح وظيفة ἢ الاستئنافية/التخييرية («أم») في سياق الحجة، و«العجينة» قد توحي بالدقيق أو الطعام أكثر من مادةٍ ممزوجة في سياق الطين.'
  naturalness: الصياغة فصيحة وواضحة في معظمها، لكن «أم ليس للخزاف سلطان على الطين» أكثر التصاقًا بسير السؤال اليوناني البلاغي من «أما للخزاف سلطان على الطين». و«الكتلة نفسها» طبيعية ومحايدة في استعارة الفخار.
  terminology: «الخزاف»، «سلطان»، «الطين»، «إناء»، «الكرامة»، و«المهانة» مقابلات سليمة وتحفظ التضاد اليوناني τιμή/ἀτιμία من غير تفسير عقائدي أو وظيفي زائد.
