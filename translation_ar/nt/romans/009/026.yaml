  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: ar
  text: 'وفي الموضع الذي قيل لهم فيه: «لستم شعبي»، سيُدعَون هناك أبناءَ الله الحي[a].[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أولاد الله الحي». اللفظ اليوناني هو «أبناء»، وقد أُبقي في المتن حفاظًا على صياغة المصدر ودلالة البنوة والانتماء.'
    reason: lexical_alternative
  - marker: b
    text: اقتباس أو تلميح إلى هوشع 1:10 (2:1 في السبعينية)، بلغة استرداد علاقة العهد.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἔσται
  choice: وسيكون
  rationale: يحفظ الواو الرابطة ودلالة المستقبل من غير إضافة معنى استنتاجي غير صريح.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: في الموضع نفسه الذي ... فيه
  rationale: «الموضع» مقابل طبيعي لـ τόπος، وإضافة «نفسه» تُبرز التطابق المؤكد بين موضع الرفض وموضع إعلان الاسترداد، وهو مفهوم من تقابل «الموضع» و«هناك».
- source_word: ἐρρέθη αὐτοῖς
  choice: قيل لهم
  rationale: صيغة مبني للمجهول موجزة وطبيعية، وتحفظ عدم التصريح بالفاعل كما في اليونانية.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: لستم شعبي
  rationale: صياغة عربية واضحة تحفظ عبارة العهد «شعبي» والنفي الموجَّه إلى المخاطبين.
- source_word: ἐκεῖ
  choice: هناك
  rationale: يحفظ التوكيد المكاني والمقابلة مع الموضع الذي سبق فيه إعلان الرفض.
- source_word: κληθήσονται
  choice: سيُدعَون
  rationale: يحفظ المستقبل والمبني للمجهول، ولا يصرّح بالفاعل الإلهي الضمني.
- source_word: υἱοὶ
  choice: أبناء
  rationale: يقابل اللفظ اليوناني الدال على البنين/الأبناء ويحفظ صدى البنوة، مع كون «أبناء» في العربية قد يشمل الجماعة المنتمية إلى الله بحسب السياق.
- source_word: θεοῦ ζῶντος
  choice: الله الحي
  rationale: تعبير كتابي عربي طبيعي يحفظ وصف الله بأنه الحي.
theological_decisions:
- issue: دلالة υἱοὶ وصيغة الجمع المذكرة
  choice: أبناء الله الحي
  alternative: أولاد الله الحي
  rationale: «أبناء» أقرب إلى لفظ المصدر ويحفظ دلالة البنوة وما قد يصاحبها من صدى الانتماء والميراث، من غير قصر المقصود لاهوتيًا على الذكور؛ لذلك ذُكر البديل الأوسع لفظًا في الحاشية.
- issue: هوية العهد في λαός μου
  choice: شعبي
  alternative: خاصتي
  rationale: «شعبي» تحفظ صيغة الانتماء العهدي في الاقتباس من هوشع، ولا تستبدلها بتعبير أعم قد يطمس صلتها بسياق الشعب والاسترداد.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. حافظت الصياغة على التوازي المكاني بين «في الموضع نفسه» و«هناك»، وعلى المبني للمجهول في «قيل» و«سيُدعَون». وُضعت علامة الحاشية [b] بعد عبارة القول المتصلة بخلفية هوشع، وعلامة [a] بعد «الله الحي» للبديل المتعلق بعبارة «أبناء الله الحي».
