base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: ar
  text: 'ولا يكونون جميعًا أولادًا لمجرد أنهم نسل إبراهيم[a]، بل: «بإسحاق[b] يُدعى[c] لك نسلٌ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ذرية إبراهيم». واللفظ اليوناني مفرد في صيغته، لكنه يُستعمل هنا بمعنى جمعي للدلالة على النسل أو الذرية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في إسحاق يُدعى لك نسل»، وهي صياغة أقرب حرفيًا إلى اليونانية وترد في اقتباس تكوين 21:12.'
    reason: cross_reference
  - marker: c
    text: «يُدعى» قد تعني أيضًا «يُسمّى»، وقد تُفهم في السياق بمعنى «يُعيَّن» أو «يُحسب».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: ولا يعني كونهم
  rationale: ينقل النفي الإضافي المرتبط بالحجة السابقة، ويُظهر بوضوح أن مجرد الانحدار من إبراهيم لا يستلزم النتيجة المذكورة، من غير توسع تفسيري.
- source_word: σπέρμα Ἀβραάμ
  choice: نسل إبراهيم
  rationale: «نسل» لفظ عربي طبيعي يحافظ على دلالة الاسم اليوناني المفرد ذي المعنى الجمعي، وعلى الصلة اللفظية بتكراره في الاقتباس.
- source_word: πάντες τέκνα
  choice: أنهم جميعًا أولاد
  rationale: «أولاد» تشمل الذكور والإناث هنا، وتحافظ على عمومية τέκνα من غير إدخال وصف لاهوتي غير مصرح به في العبارة.
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد التصحيح والمقابلة الحادة على نحو موجز وطبيعي في العربية.
- source_word: Ἐν Ἰσαὰκ
  choice: في إسحاق
  rationale: يحافظ على الصياغة الأقرب لحرف الجر اليوناني وعلى صدى اقتباس التكوين، مع إثبات البديل الدلالي «بإسحاق/من طريق إسحاق» في الحاشية.
- source_word: κληθήσεταί
  choice: يُدعى
  rationale: ينقل المبني للمجهول ودلالة النداء أو التسمية، ويترك احتمال التعيين أو الاحتساب قائمًا بدل حسمه داخل المتن.
- source_word: σοι
  choice: لك
  rationale: يحافظ على صيغة المجرور اليونانية كما وردت في الاقتباس، بدل تحويلها في المتن إلى ملكية صريحة.
- source_word: σπέρμα
  choice: نسلٌ
  rationale: يحافظ على الاتساق مع اللفظ نفسه في صدر الآية وعلى دلالته الجمعية مع كونه مفردًا في الصيغة.
theological_decisions:
- issue: العلاقة بين الانتساب الجسدي إلى إبراهيم والبنوّة المقصودة
  choice: تُبقي الصياغة التمييز بين كونهم نسل إبراهيم وكونهم جميعًا أولادًا، من غير تحديد آلية هذا التمييز في هذه الآية.
  alternative: التصريح بأن المقصود «أولاد العهد» أو إدخال تفسير كامل للاختيار.
  rationale: الآية تقيم المقابلة، لكن الألفاظ نفسها لا تضيف وصف «العهد» ولا تفصّل هنا كيفية الاختيار؛ لذلك تُصان الحدة اللاهوتية للسياق من غير استباق.
- issue: قوة اقتباس التكوين ومعنى κληθήσεται
  choice: «في إسحاق يُدعى لك نسلٌ»
  alternative: «بإسحاق يُحسب لك نسل» أو «من إسحاق يأتي نسلك».
  rationale: الصياغة المختارة أقرب إلى ألفاظ الاقتباس وتبقي «يُدعى» محتملة للتسمية أو التعيين بحسب السياق، بدل تحويل الاقتباس إلى تفسير صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت صياغة تفسيرية طفيفة في صدر الجملة لتوضيح العلاقة المنطقية التي قد تبدو متعثرة إذا نُقلت حرفيًا، مع إبقاء الاقتباس أقرب إلى بنيته الأصلية وصون غموض «في» و«يُدعى» في الحواشي.
