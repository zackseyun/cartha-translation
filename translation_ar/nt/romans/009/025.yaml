base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: ar
  text: 'كما يقول أيضًا في هوشع: «سأدعو مَن ليس شعبي، “شعبي”، والتي ليست محبوبة، “محبوبة”».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الاقتباس من هوشع 2:23 بحسب الترقيم الشائع؛ وقد يختلف ترقيم الآية في بعض التقاليد. ويطبّق بولس هنا لغة الاسترداد في هوشع على دعوة الله شعبًا لنفسه.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς καὶ
  choice: كما ... أيضًا
  rationale: صيغة عربية طبيعية تُبقي معنى الاستشهاد المؤيد الذي تحمله ὡς مع καί.
- source_word: ἐν τῷ Ὡσηὲ
  choice: في هوشع
  rationale: تحافظ على صيغة الإحالة اليونانية الموجزة، والمقصود ما ورد في سفر هوشع.
- source_word: λέγει
  choice: يقول
  rationale: يبقي الفعل بصيغته الشخصية المفردة من غير إضافة فاعل غير مصرّح به في العبارة اليونانية.
- source_word: Καλέσω
  choice: سأدعو
  rationale: ترجمة مباشرة لـ καλέω، وتحفظ معنى التسمية أو التعيين العهدي في الاقتباس.
- source_word: τὸν οὐ λαόν μου
  choice: الذي ليس شعبي
  rationale: يحفظ المفرد النحوي وصياغة الاقتباس المكثفة، مع بقاء «شعبي» اسم جمع ذي دلالة جماعية.
- source_word: λαόν μου
  choice: شعبي
  rationale: التعبير العربي المألوف المقابل للصيغة العهدية الكتابية.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: التي ليست محبوبة
  rationale: يحفظ التأنيث والمفرد ودلالة اسم المفعول، وهما مهمان لخلفية النص في هوشع.
- source_word: ἠγαπημένην
  choice: محبوبة
  rationale: تنقل دلالة اسم المفعول من ἀγαπάω وتحافظ على تكرار اللفظ بين الوصف والتسمية.
theological_decisions:
- issue: الدلالة الجماعية أم الفردية في اقتباس هوشع
  choice: الإبقاء على صيغة المفرد في العبارتين، مع كون «شعبي» ذا مدلول جماعي.
  alternative: 'صياغة العبارة الأولى بالجمع: «الذين لم يكونوا شعبي سأدعوهم شعبي».'
  rationale: اليونانية تستخدم المفرد في العبارتين، والعربية تستطيع الحفاظ عليه من غير طمس البعد الجماعي لكلمة «شعب» أو تأنيث العبارة الثانية المرتبط بخلفية هوشع.
- issue: هوية فاعل «يقول»
  choice: 'عدم التصريح بالفاعل في العربية: «يقول».'
  alternative: «يقول الله» أو «يقول الكتاب».
  rationale: السياق يفهم منه أن الله هو المتكلم في الاقتباس، لكن النص اليوناني لا يذكر الاسم هنا؛ لذلك لا ينبغي حسم ما تركته صيغة الاستشهاد ضمنيًا.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على الإيجاز النبوي والتوازي بين «ليس شعبي/شعبي» و«ليست محبوبة/محبوبة». وُضعت علامة الحاشية بعد الاقتباس كله لأنها تتعلق بمصدره واستعماله.
