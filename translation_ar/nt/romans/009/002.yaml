  text: ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/002.yaml
  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: ar
  text: إنَّ لي حزنًا عظيمًا وألمًا لا ينقطع في قلبي[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غمًّا» بدلًا من «حزنًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كربًا» بدلًا من «ألمًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: إنَّ
  rationale: تُدخل مضمون تأكيد بولس الوارد في الآية السابقة، وتربط الكلام بها ربطًا طبيعيًا دون إضفاء معنى سببي غير مرجح.
- source_word: λύπη
  choice: حزنًا
  rationale: ينقل معنى الأسى العميق بلفظ عربي واضح ومألوف، مع إبقاء «غمّ» بديلًا معجميًا ممكنًا.
- source_word: μοί ἐστιν
  choice: لي
  rationale: صياغة عربية موجزة وطبيعية تقابل تركيب الداتيف مع فعل الكينونة، وتفيد أن المتكلم يعاني هذا الحزن.
- source_word: μεγάλη
  choice: عظيمًا
  rationale: يحفظ قوة الصفة اليونانية ويأتي طبيعيًا مع «حزن».
- source_word: καὶ
  choice: و
  rationale: يحفظ العطف البسيط بين تعبيري الحزن والألم.
- source_word: ἀδιάλειπτος
  choice: لا ينقطع
  rationale: تعبير عربي طبيعي ودقيق عن الاستمرار بلا انقطاع، ويحفظ شدة الوصف.
- source_word: ὀδύνη
  choice: ألمًا
  rationale: ينقل الضيق الداخلي الشديد بلفظ مباشر، مع إمكان ترجمتها «كربًا» لإبراز المعاناة النفسية.
- source_word: τῇ καρδίᾳ μου
  choice: في قلبي
  rationale: يُبقي الصورة الكتابية الملموسة للقلب بوصفه موضع الحياة الباطنة، ويؤدي الداتيف اليوناني بصياغة عربية اصطلاحية طبيعية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت صيغة «إنَّ لي» للمحافظة على اتصال الآية بما قبلها وعلى شيء من بنية الأصل، مع تجنب الحرفية المتكلفة. لا حاجة إلى حاشية لعبارة «في قلبي»، إذ إن الداتيف اليوناني هنا يُؤدَّى طبيعيًا في العربية بحرف الجر «في».
