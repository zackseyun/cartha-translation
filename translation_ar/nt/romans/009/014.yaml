lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: فماذا نقول إذًا؟
  rationale: صياغة عربية طبيعية تحفظ وظيفة العبارة البولسية في الانتقال إلى نتيجة أو اعتراض متوقَّع، وتنقل دلالة المستقبل التداولية دون تكلّف.
- source_word: μὴ
  choice: أَ...؟
  rationale: تأتي μή في السؤال المباشر بما يفيد توقّع الجواب بالنفي؛ وتؤدي صيغة الاستفهام الإنكاري العربية هذا المعنى بوضوح.
- source_word: ἀδικία
  choice: ظلم
  rationale: «ظلم» لفظ عربي واضح يجمع هنا معنى الجور ومجانبة العدل في معاملة الله، مع إثبات البديل «عدم برّ» في الحاشية لصيانة المجال الدلالي.
- source_word: παρὰ τῷ θεῷ
  choice: عند الله
  rationale: تنقل العبارة معنى وجود الظلم لدى الله أو صدوره من جانبه، وتحافظ على إيجاز الأصل من غير تحويل السؤال إلى صياغة تفسيرية مثل «هل الله ظالم؟».
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: تعبير عربي فصيح ومألوف يفيد الرفض القاطع، ويلائم قوة النفي في العبارة اليونانية المأثورة عند بولس.
theological_decisions:
- issue: هل تُصاغ العبارة بما يفسّر اعتراض بولس وفق مذهب معيّن في الاختيار الإلهي؟
  choice: 'الإبقاء على السؤال المقتضب: «أَعند الله ظلمٌ؟» ثم رفضه بقوة.'
  alternative: صياغة تفسيرية مثل «أفالله غير عادل؟» أو إضافة بيان عن الاختيار والرفض.
  rationale: يحفظ النص اعتراضه البلاغي والتوتر اللاهوتي كما وردا، من غير إدخال شرح مذهبي أو توسيع يتجاوز اليونانية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم «حاشا» لقوة النفي وشيوعه في الأسلوب الكتابي العربي، مع شرح العبارة الحرفية في الحاشية. وُضعت علامتا الحاشيتين في المتن.
