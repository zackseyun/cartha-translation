  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: ar
  text: فماذا نقول إذن؟ إن غير اليهود[a]، الذين لم يكونوا يسعون إلى البر[b]، نالوا البر—البر الذي من الإيمان[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأمم». والمقصود هنا الشعوب غير اليهودية في مقابل إسرائيل.
    reason: lexical_alternative
  - marker: b
    text: أو «العدل» هنا وفي تكرار الكلمة؛ فلفظ δικαιοσύνη يمكن أن يشمل الاستقامة الأخلاقية أو القانونية، والعدل في إطار العهد.
    reason: lexical_alternative
  - marker: c
    text: أو «البر الآتي بالإيمان»، وربما، على احتمال أضعف هنا، «البر الذي من الأمانة».
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: فماذا نقول إذن؟
  rationale: صياغة عربية طبيعية تحفظ الاستفهام الانتقالي التداولي وصيغة المستقبل التداولية في اليونانية من غير تكلّف.
- source_word: ἔθνη
  choice: غير اليهود
  rationale: السياق البولسي يقابل هذه الجماعة بإسرائيل، فالتعبير يوضح المقصود للقارئ العربي، مع إثبات اللفظ الأقرب، «الأمم»، في الحاشية.
- source_word: τὰ μὴ διώκοντα
  choice: الذين لم يكونوا يسعون إلى
  rationale: يحفظ دلالة اسم الفاعل المضارع على السعي المستمر أو الموقف المميز للجماعة.
- source_word: δικαιοσύνην
  choice: البر
  rationale: «البر» هو المقابل العربي اللاهوتي الواسع والطبيعي في هذا السياق، ولا يحصر المعنى في تصور مذهبي بعينه؛ وأُثبت «العدل» بديلًا في الحاشية.
- source_word: κατέλαβεν
  choice: نالوا
  rationale: يفيد هنا الوصول إلى الشيء أو الحصول عليه، وهو أوضح في العربية من صورة الإمساك الحسية.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: بل البر الذي من الإيمان
  rationale: تحفظ «بل» التحول الذي تؤديه δέ، بينما يحدد التكرار نوع البر المقصود. وتحفظ عبارة «من الإيمان» دلالة ἐκ من دون توسيع عقائدي.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المعنى الأرجح لـ πίστις هنا، مع إبقاء احتمال «الأمانة» في الحاشية وعدم إدخاله في المتن.
theological_decisions:
- issue: مدلول δικαιοσύνη في حجة بولس
  choice: البر
  alternative: العدل، أو المكانة المقبولة أمام الله
  rationale: يحفظ «البر» اتساع المصطلح البولسي ولا يقصره على آلية عقائدية محددة لا يصرح بها العدد.
- issue: مدلول ἐκ πίστεως
  choice: من الإيمان
  alternative: بالإيمان، أو من الأمانة
  rationale: تحافظ الصياغة على صورة المصدر في ἐκ وعلى التوتر التفسيري، ولا تضيف عبارات مذهبية مثل «بالإيمان وحده».
- issue: وظيفة δέ في العبارة الختامية
  choice: بل البر الذي من الإيمان
  alternative: أي البر الذي من الإيمان
  rationale: يمكن أن تكون δέ انتقالية أو محدِّدة، واختيار «بل» يبقي قوة التحول البلاغي من غير جعل العبارة تناقضًا بين نوعين من البر.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُخدم «غير اليهود» لرفع الغموض لدى القارئ العام، و«البر» للمحافظة على الاتساع اللاهوتي، مع تجنب أي توسع مذهبي غير موجود في النص اليوناني.
