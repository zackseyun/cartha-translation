    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραὴλ
  choice: إسرائيل
  rationale: النقل العربي المعياري للاسم، ويشير هنا إلى إسرائيل بوصفها جماعة في سياق حجة بولس.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد الانتقال المقابل لما سبق عن الأمم، وتؤدي معنى المقابلة بأسلوب عربي طبيعي.
- source_word: διώκων
  choice: فسعى وراء
  rationale: يدل الفعل على الملاحقة الجادة والسعي الحثيث، من غير إضافة معنى تنازلي غير مصرح به.
- source_word: νόμον δικαιοσύνης
  choice: شريعةٍ للبرّ
  rationale: يحافظ التنكير على عدم وجود أداة تعريف في اليونانية، وتبقي اللام علاقة البر بالشريعة موجزة وغير محسومة تفسيريا.
- source_word: δικαιοσύνης
  choice: البرّ
  rationale: هو المقابل العربي المألوف في سياق بولس، مع إثبات «العدل» بديلا معجميا ممكنا في الحاشية.
- source_word: εἰς νόμον
  choice: تلك الشريعة
  rationale: تفهم العبارة على أنها استئناف للشريعة المذكورة، مع إبقاء الصعوبة التركيبية والبدائل في الحاشية.
- source_word: οὐκ ἔφθασεν
  choice: لم يبلغ
  rationale: ينقل معنى عدم الوصول إلى المقصود، ويلائم استعمال εἰς المكاني المجازي من غير توسع تفسيري.
theological_decisions:
- issue: دلالة δικαιοσύνη في السياق البولسي
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» أنسب لسياق حديث بولس عن علاقة الإنسان الصحيحة بالله، مع بقاء «العدل» احتمالا معجميا لا ينبغي حجبه.
- issue: العلاقة في νόμον δικαιοσύνης
  choice: شريعةٍ للبرّ
  alternative: شريعة البرّ / شريعة تؤدي إلى البرّ
  rationale: الصياغة المختارة تحافظ على إيجاز الإضافة اليونانية ولا تحسم هل الشريعة متصفة بالبر أم متعلقة به أم غايتها البر.
- issue: مرجع εἰς νόμον
  choice: تلك الشريعة
  alternative: إلى شريعة / إلى غاية الشريعة
  rationale: التكرار يرجح الإحالة إلى الشريعة التي كان إسرائيل يسعى وراءها، لكن العبارة اليونانية مكثفة وصعبة، ولذلك تُذكر البدائل دون إدخال «الغاية» في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «أمّا... لكنه» لإبراز المقابلة الطبيعية، و«سعى وراء» لنقل قوة الملاحقة في διώκων، مع تجنب إضافة «مع أنه» لأن الدلالة التنازلية مستفادة من السياق وليست مصرحا بها نحويا.
