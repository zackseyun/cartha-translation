  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: ar
  text: أمّا إسرائيل، وهو يسعى وراء شريعةٍ للبرّ[a]، فلم يبلغ تلك الشريعة[b].
  philosophy: optimal-equivalence
  footnotes:
