translation:
  language: ar
  text: نحن[a] الذين دعاهم أيضًا، ليس من اليهود فقط، بل من الأمم[b] أيضًا—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا، مع ترتيب أقرب إلى اليونانية: «الذين دعاهم أيضًا، أي نحن». يعرّف بولس المذكورين سابقًا، أي آنية الرحمة، بأنهم «نحن».'
    reason: lexical_alternative
  - marker: b
    text: أي الشعوب غير اليهودية. واللفظ اليوناني يعني حرفيًا «الأمم»، ويأتي هنا في مقابلة اليهود.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: نحن الذين دعاهم
  rationale: يحافظ هذا التركيب على كون «نحن» بدلًا يوضح هوية المذكورين سابقًا، وعلى صلة الموصول العائدة إلى «آنية الرحمة» في الآية السابقة، بصياغة عربية واضحة.
- source_word: καὶ ἐκάλεσεν
  choice: دعاهم أيضًا
  rationale: «دعا» هو المقابل الطبيعي ذو الدلالة البولسية المعهودة، و«أيضًا» تنقل القوة الإضافية للأداة καί.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: لا ... فقط، بل ... أيضًا
  rationale: ينقل هذا التركيب العربي الموازنة البلاغية والإضافة في العبارة اليونانية.
- source_word: ἐξ Ἰουδαίων
  choice: من اليهود
  rationale: تفيد ἐξ المصدر أو الانتماء إلى الجماعة، و«اليهود» تسمية مباشرة للمجموعة المقابلة للأمم.
- source_word: ἐξ ἐθνῶν
  choice: من الأمم
  rationale: تلتزم هذه الصياغة بالمعنى الأصلي الحرفي لـἔθνη، مع توضيح المقصود السياقي في الحاشية بأنه غير اليهود.
theological_decisions:
- issue: صلة المدعوين بآنية الرحمة المذكورة في الآية السابقة
  choice: نحن الذين دعاهم أيضًا
  alternative: أي نحن، الذين دعاهم أيضًا
  rationale: تحافظ الصياغة المختارة على استمرارية الجملة وعلى تعريف بولس للمذكورين سابقًا بأنهم «نحن»، من غير أن تحسم مسائل الاختيار والدعوة بأكثر مما يقوله النص.
- issue: دلالة ἐθνῶν في المقابلة الخلاصية التاريخية مع اليهود
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» أقرب إلى اللفظ اليوناني وتحفظ أصداءه الكتابية، بينما تبين الحاشية أن المراد في هذه المقابلة الشعوب غير اليهودية.
translation_notes:
  register: صياغة عربية فصحى حديثة ومهيبة، تحافظ على ارتباط الآية نحويًا بما قبلها وعلى الشرطة الختامية الدالة على استمرار الاستشهاد أو الحجة. استُخدمت «فقط» للوضوح المعاصر، واحتُفظ بـ«الأمم» مع حاشية تشرح المقابلة اليهودية/غير اليهودية.
