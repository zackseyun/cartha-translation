  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: ar
  text: لَمْ يَرْفُضِ اللهُ شَعْبَهُ الَّذِي عَرَفَهُ مِنْ قَبْلُ.[a] أَمْ لَا تَعْلَمُونَ مَاذَا يَقُولُ الْكِتَابُ فِي الْمَقْطَعِ الْمُتَعَلِّقِ بِإِيلِيَّا،[b] كَيْفَ يَتَضَرَّعُ إِلَى اللهِ ضِدَّ إِسْرَائِيلَ؟[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي سبق أن عرفه». ويفسر بعضهم الفعل بمعنى أقوى، مثل «اختاره من قبل»، لكن النص اليوناني لا يحسم هذا التفسير في هذا الموضع.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًّا: «في إيليا»، وهو تعبير يشير إلى الموضع أو المقطع الكتابي المتعلق بإيليا.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «كيف يرفع إلى الله التماسًا ضد إسرائيل» أو «كيف يشكو إسرائيل إلى الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: يَرْفُضِ
  rationale: الفعل في هذا السياق يعني النبذ أو الرفض. واختيار «يرفض» واضح في العربية المعاصرة ويناسب نفي بولس أن يكون الله قد نبذ شعبه.
- source_word: τὸν λαὸν αὐτοῦ
  choice: شَعْبَهُ
  rationale: يحفظ التعبير دلالة الشعب المنسوب إلى الله من غير إضافة «إسرائيل» إلى الجملة الأولى، إذ يَرِد الاسم صراحة في آخر الآية.
- source_word: ὃν προέγνω
  choice: الَّذِي سَبَقَ أَنْ عَرَفَهُ
  rationale: ينقل المعنى المباشر للفعل، أي المعرفة السابقة، من غير تحويله في المتن إلى «اختاره من قبل» أو إلى تفسير مذهبي آخر.
- source_word: ἢ οὐκ οἴδατε
  choice: أَمْ لَا تَعْلَمُونَ
  rationale: صياغة عربية طبيعية تحافظ على الاستفهام البلاغي وعلى صلة السؤال بما سبقه.
- source_word: ἐν Ἠλίᾳ
  choice: فِي الْمَقْطَعِ الَّذِي عَنْ إِيلِيَّا
  rationale: العبارة اليونانية اصطلاح يشير إلى الموضع الكتابي المتعلق بإيليا، لا إلى معنى مكاني حرفي.
- source_word: ἡ γραφή
  choice: الْكِتَابُ
  rationale: يُستعمل اللفظ هنا عن الكتاب المقدس بوصفه النص الذي يستشهد به بولس، و«الكتاب» تعبير عربي كتابي واضح ومألوف.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: كَيْفَ يَرْفَعُ إِلَى اللهِ طَلَبًا
  rationale: الفعل يحتمل معنى الالتماس أو رفع الدعوى. ولأن الطلب موجَّه ضد إسرائيل، تجنبت الصياغة لفظ «يشفع» الذي يوحي عادة بطلب الخير لشخص.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: ضِدَّ إِسْرَائِيلَ
  rationale: حرف الجر مع المضاف إليه ذو معنى مناوئ هنا، ولذلك نُقل بوضوح إلى «ضد» مع إبقاء اسم إسرائيل.
theological_decisions:
- issue: دلالة προέγνω وصلتها بالاختيار الإلهي
  choice: سَبَقَ أَنْ عَرَفَهُ
  alternative: اختاره من قبل / أحبَّه من قبل
  rationale: تدخل الآية ضمن نقاش بولس الأوسع عن الاختيار، لكن اللفظ اليوناني نفسه لا يقتضي إدخال أحد التفسيرين الأقوى في المتن. تحفظ الصياغة معنى المعرفة السابقة والتوتر اللاهوتي القائم.
- issue: دلالة رفع إيليا طلبًا ضد إسرائيل
  choice: يَرْفَعُ إِلَى اللهِ طَلَبًا ضِدَّ إِسْرَائِيلَ
  alternative: يتضرع إلى الله ضد إسرائيل / يشكو إسرائيل إلى الله
  rationale: يحافظ الاختيار على اتجاه الطلب إلى الله وعلى كونه ضد إسرائيل، من غير استعمال «يشفع» بما قد يقلب النبرة المناوئة في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت صياغة مفهومة للاصطلاح «في إيليا»، وحُفظ الاستفهام البلاغي، كما جرى تجنب ألفاظ قد تحسم الجدل اللاهوتي في معنى المعرفة السابقة أو توحي خطأً بالشفاعة لمصلحة إسرائيل.
