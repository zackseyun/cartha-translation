  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: ar
  text: فمَن عرف فكر الرب؟ أو مَن صار له مشيرًا؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يردّد بولس صدى إشعياء 40:13، حيث يسأل النص اليوناني على نحو مماثل: مَن عرف فكر الرب، أو صار له مشيرًا؟'
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: مَن
  rationale: اسم استفهام يفتتح سؤالًا بلاغيًا، وهذه الصياغة العربية موجزة وطبيعية وتحفظ قوة الاقتباس.
- source_word: γὰρ
  choice: فـ
  rationale: تفيد التعليل والربط بما سبق، والفاء هنا تحافظ بإيجاز على الصلة التفسيرية في سياق حجة بولس.
- source_word: ἔγνω
  choice: عرف
  rationale: يحافظ على الدلالة المباشرة لفعل المعرفة في السؤال البلاغي، من غير توسيع تفسيري إلى «فهم».
- source_word: νοῦν
  choice: فكر
  rationale: يشير هنا إلى فكر الرب وقصده وإدراكه؛ و«فكر» تعبير عربي واضح ومألوف في هذا التركيب ويحفظ اتساع الدلالة.
- source_word: κυρίου
  choice: الرب
  rationale: نقل مباشر للفظ κύριος، مع إبقاء الإحالة إلى الله في صدى إشعياء من دون استبداله بالاسم الإلهي في المتن.
- source_word: ἢ
  choice: أو
  rationale: تحفظ أداة العطف الانفصالية وبنية السؤال البلاغي الموازي.
- source_word: σύμβουλος
  choice: مشيرًا
  rationale: يدل على من يقدّم المشورة، وهو مقابل عربي مباشر ذو نبرة لائقة بالاقتباس الكتابي.
- source_word: αὐτοῦ
  choice: له
  rationale: يعبّر طبيعيًا عن علاقة المشير بالرب في العربية، بدل صياغة إضافية أثقل.
- source_word: ἐγένετο
  choice: صار
  rationale: ينقل معنى «أصبح/صار» ويحفظ السؤال عما إذا كان أحد قد شغل هذا المقام بالنسبة إلى الله.
theological_decisions:
- issue: مرجع «الرب» في الاقتباس المستمد من إشعياء
  choice: إبقاء «الرب» من غير تضييق إضافي للمرجع في المتن
  alternative: استعمال صياغة تشير صراحةً إلى الاسم الإلهي في خلفية إشعياء
  rationale: النص اليوناني يقرأ κυρίου، والسياق البولسي يشير إلى الله ويبرز حكمته التي لا تُستقصى. إبقاء «الرب» يصون صياغة العهد الجديد ولا يحمّل المتن تحديدًا يتجاوز لفظه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على الإيجاز والتوازي البلاغي في السؤالين. استُعملت «فكر الرب» بدل تعبيرات تفسيرية أوسع، و«صار له مشيرًا» لصياغة عربية طبيعية قريبة من ترتيب المعنى اليوناني.
