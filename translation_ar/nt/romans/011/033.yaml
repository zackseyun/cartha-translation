  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: ar
  text: يا لَعُمْقِ غِنَى اللهِ وحِكْمَتِهِ ومَعْرِفَتِهِ![a] ما أَعْصَى أحكامَهُ على الاستقصاءِ، وما أَعْصَى طُرُقَهُ على اقتفاءِ الأثر![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «يا لعمق غنى حكمة الله ومعرفته!» فالتركيب اليوناني يحتمل ربط «الغنى» بالحكمة والمعرفة ربطًا أوثق، أما المتن فيعامل الغنى والحكمة والمعرفة بوصفها ثلاثة أمور منسوبة إلى الله.'
    reason: alternative_reading
  - marker: b
    text: يفيد التعبير اليوناني أن طرق الله لا يمكن اقتفاء أثرها أو تتبُّعها إلى غايتها، ولذلك تُرجم بعبارة تختلف عن «الاستقصاء» في العبارة السابقة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: يا لَـ
  rationale: صيغة تعجب عربية طبيعية تنقل الانفعال والدهشة التعبدية من غير لجوء إلى تعبير مهجور.
- source_word: βάθος
  choice: عُمْق
  rationale: يحفظ الاستعارة الدالة على ما لا يُسبر غوره، وهو المقابل العربي المباشر والطبيعي.
- source_word: πλούτου
  choice: غِنَى
  rationale: ينقل معنى الوفرة والثراء المجازي، ويلائم الإضافة إلى الله أكثر من «ثروة» ذات الإيحاء المادي الغالب.
- source_word: σοφίας
  choice: حِكْمَة
  rationale: المقابل المعتاد الذي يدل هنا على حكمة الله في تدبيره وقصده.
- source_word: γνώσεως
  choice: مَعْرِفَة
  rationale: يحفظها مفهومًا مستقلًا عن الحكمة، كما في تراكم الأسماء اليونانية.
- source_word: θεοῦ
  choice: الله
  rationale: جُعل مضافًا إليه للأسماء الثلاثة بحسب القراءة الرئيسة، مع المحافظة على الإيقاع العربي الواضح.
- source_word: ὡς
  choice: ما أَعْسَرَ ... وما أَبْعَدَ
  rationale: نُقلت أداة التعجب بصيغتي «ما أفعل» العربيتين لإبراز قوة التعجب في شطري العبارة.
- source_word: ἀνεξεραύνητα
  choice: أَعْسَرَ استقصاءَ
  rationale: يفيد أن أحكام الله لا يمكن استقصاؤها والبحث فيها إلى نهايتها، بصياغة مفهومة تحفظ صورة البحث.
- source_word: κρίματα
  choice: أحكام
  rationale: لفظ واسع يشمل أحكام الله وقراراته وتقديراته، من غير حصره في المراسيم أو الإدانة القضائية.
- source_word: ἀνεξιχνίαστοι
  choice: أَبْعَدَ ... عن التتبُّع
  rationale: يحفظ صورة اقتفاء الأثر والتتبع، ويميّزه عن لفظ الاستقصاء المقابل للصفة السابقة.
- source_word: ὁδοὶ
  choice: طُرُق
  rationale: يحفظ الاستعارة الكتابية لطريقة الله في العمل ومسالك تدبيره.
- source_word: αὐτοῦ
  choice: ـهِ
  rationale: ضمير الغائب يعود بوضوح إلى الله، مع إبقاء التكرار في «أحكامه» و«طرقه».
theological_decisions:
- issue: 'تعلُّق المضاف إليه θεοῦ بالأسماء: الغنى والحكمة والمعرفة'
  choice: 'اعتبار «الله» مضافًا إليه للأسماء الثلاثة: غناه وحكمته ومعرفته.'
  alternative: «يا لعمق غنى حكمة الله ومعرفته»، أي جعل الغنى وصفًا لوفرة الحكمة والمعرفة أو مرتبطًا بهما ارتباطًا أوثق.
  rationale: يسمح التركيب اليوناني بالوجهين، لكن قراءة الأسماء الثلاثة صفاتٍ أو ممتلكاتٍ لله هي الأيسر في السياق وتلائم التراكم التعجبي؛ وأُثبت الوجه الآخر في الحاشية حفظًا للغموض الحقيقي.
- issue: التمييز بين ἀνεξεραύνητα وἀνεξιχνίαστοι
  choice: «أعسر استقصاء» للأولى و«أبعد عن التتبّع» للثانية.
  alternative: ترجمة الصفتين بلفظين متقاربين مثل «لا تُستقصى» و«لا تُدرَك».
  rationale: استُبقي الفرق التصويري بين البحث حتى الاستقصاء وبين تتبع الطريق أو اقتفاء أثره، من غير بناء فرق لاهوتي تقني لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة تعجبية مهيبة. استُخدمت صيغة «يا لَـ» ثم «ما أفعل» للمحافظة على اندفاع التسبيح، مع ألفاظ واضحة غير طائفية. أُثبتت علامتا الحاشية [a] و[b] في المتن.
