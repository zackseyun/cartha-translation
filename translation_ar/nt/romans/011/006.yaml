  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: ar
  text: ولكن إن كان بالنعمة، فلا يكون بعدُ على أساس الأعمال، وإلا فلا تعود النعمة نعمةً.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: بالنعمة
  rationale: يحافظ على دلالة الوسيلة أو الأساس في صيغة موجزة وطبيعية، مع إبقاء «النعمة» مصطلحًا محوريًا في السياق.
- source_word: ἐξ ἔργων
  choice: على أساس الأعمال
  rationale: ينقل معنى المصدر أو الأساس المقابل للنعمة بوضوح أكبر من الترجمة الحرفية «من أعمال».
- source_word: γίνεται
  choice: تعود ... نعمةً
  rationale: يعكس الفعل «يصير/يكون» في تركيب عربي طبيعي، بدل حذف دلالته تمامًا؛ والمعنى أن النعمة، على ذلك الافتراض، لا تبقى متحققة بوصفها نعمة.
theological_decisions:
- issue: التقابل بين النعمة والأعمال
  choice: 'إبقاء التقابل مطلقًا كما في النص: «بالنعمة» مقابل «على أساس الأعمال»'
  alternative: تقييد الأعمال بأعمال الناموس أو بالأعمال المستحقة للأجر
  rationale: لا يرد في هذه الآية مضاف يحدد نوع الأعمال، ولذلك لا تُستورد هنا قراءة تفسيرية أضيق.
- issue: دلالة «γίνεται χάρις»
  choice: «فلا تعود النعمة نعمةً»
  alternative: «فلا تصير النعمة نعمةً»
  rationale: البديل الحرفي ثقيل وملتبس بالعربية؛ أما الصياغة المختارة فتحفظ المفارقة المنطقية ودلالة الفعل في سياق افتراضي دون تسوية التوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة تقريرية تليق بالحجاج البولسي. استُعمل «بعدُ» بمعنى «بعد الآن»، وحُفظ التوازي بين النعمة والأعمال.
