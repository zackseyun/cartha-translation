id: ROM.11.23
reference: Romans 11:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: ar
  text: وهم أيضًا، إن لم يستمروا في عدم الإيمان[a]، فسيُطعَّمون؛ لأن الله قادر أن يطعّمهم من جديد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في عدم الأمانة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن يعيد تطعيمهم». واليونانية تصرّح بمعنى «من جديد» في هذه الجملة الثانية.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: وهم أيضًا
  rationale: تنقل القوة الإضافية في καί مع الإشارة إلى أولئك المذكورين في السياق، أي الأغصان غير المؤمنة، بعبارة عربية طبيعية دون زيادة معنى غير مصرح به.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: إن لم يستمروا
  rationale: تحافظ على معنى الشرط وعلى الدلالة الاستمرارية للفعل ἐπιμένω، بصياغة عربية واضحة.
- source_word: τῇ ἀπιστίᾳ
  choice: في عدم الإيمان
  rationale: يناسب تركيب الفعل مع حالةٍ مستمرة، ويحفظ التقابل المباشر في رومية 11 بين الإيمان وعدم الإيمان. ويمكن أن يحمل اللفظ اليوناني معنى عدم الأمانة بحسب السياق.
- source_word: ἐγκεντρισθήσονται
  choice: فسيُطعَّمون
  rationale: ينقل المبني للمجهول وصورة تطعيم الأغصان في شجرة الزيتون. ولم تُضف كلمة «ثانية» هنا لأن πάλιν لا ترد إلا في الجملة اللاحقة.
- source_word: δυνατὸς
  choice: قادر
  rationale: المقابل العربي الطبيعي للصفة الخبرية، ويحفظ التركيز على قدرة الله.
- source_word: πάλιν
  choice: من جديد
  rationale: تعبّر صراحة عن معنى التكرار والاستعادة الذي تدل عليه πάλιν.
- source_word: ἐγκεντρίσαι αὐτούς
  choice: أن يطعّمهم
  rationale: يحافظ على اتساق استعارة التطعيم وعلى عودة الضمير إلى الأشخاص الممثَّلين بالأغصان.
- source_word: δὲ
  choice: و
  rationale: تواصل الحجة مع إبقاء المقابلة مفهومة من السياق، من غير تشديد زائد على معنى الاستدراك.
- source_word: ὁ θεὸς
  choice: الله
  rationale: نقل مباشر للفاعل المصرح به في النص.
theological_decisions:
- issue: دلالة ἀπιστία في هذا السياق
  choice: عدم الإيمان
  alternative: عدم الأمانة
  rationale: سياق رومية 11 يقابل الإيمان بعدم الإيمان في الكلام على القطع والتطعيم. ومع ذلك، تُذكر الدلالة البديلة في الحاشية حفاظًا على المجال الدلالي الممكن.
- issue: موضع التصريح بالعودة في استعارة التطعيم
  choice: إبقاء الفعل الأول «سيُطعَّمون» والتعبير عن العودة بعبارة «من جديد» في الجملة الثانية
  alternative: «سيُطعَّمون من جديد» في الجملة الأولى
  rationale: النص اليوناني يصرح بـπάλιν في الجملة الثانية وحدها؛ لذلك لا تُقدَّم دلالة العودة إلى موضع لم تُذكر فيه صراحة، مع بقاء معنى الاستعادة واضحًا في نهاية الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «التطعيم» بوصفه المصطلح الزراعي المألوف الملائم لاستعارة شجرة الزيتون، وحُفظ المبني للمجهول في الجملة الأولى والتكرار اللفظي في الجملة الثانية.
