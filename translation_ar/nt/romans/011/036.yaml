  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: ar
  text: لِأَنَّ مِنْهُ وَبِهِ وَإِلَيْهِ كُلَّ شَيْءٍ. لَهُ الْمَجْدُ إِلَى الْأَبَدِ. آمِينُ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تفيد الأداة التعليل، إذ تقدّم أساس التسبيح السابق، و«لأنّ» تنقل هذه القوة السببية بوضوح.
- source_word: ἐξ αὐτοῦ
  choice: مِنْهُ
  rationale: حرف الجر مع المضاف إليه يدل على المصدر أو المنشأ؛ و«منه» صياغة عربية موجزة وطبيعية.
- source_word: δι’ αὐτοῦ
  choice: بِهِ
  rationale: διά مع المضاف إليه تفيد الواسطة أو الوسيلة؛ و«به» تحافظ على هذا المعنى في تعبير عربي فصيح وموجز.
- source_word: εἰς αὐτὸν
  choice: إِلَيْهِ
  rationale: تفيد εἰς الغاية أو الاتجاه؛ و«إليه» تحفظ هذا الامتداد الغائي من غير حصره في معنى «لأجله».
- source_word: τὰ πάντα
  choice: كُلَّ شَيْءٍ
  rationale: العبارة شاملة، و«كل شيء» تؤدي معناها الكوني بوضوح في العربية المعاصرة.
- source_word: αὐτῷ ἡ δόξα
  choice: لَهُ الْمَجْدُ
  rationale: جملة تسبيحية اسمية لا فعل فيها في اليونانية؛ والصياغة العربية تنقل إسناد المجد إليه طبيعيًا من غير إضافة تفسيرية.
- source_word: εἰς τοὺς αἰῶνας
  choice: إِلَى الْأَبَدِ
  rationale: التعبير اليوناني، وحرفيته «إلى الدهور»، اصطلاح يدل على الدوام؛ و«إلى الأبد» واضح ومهيب في العربية الحديثة.
- source_word: ἀμήν
  choice: آمِينُ
  rationale: أُبقيت اللفظة بصيغتها الليتورجية المألوفة في العربية بوصفها تأكيدًا ختاميًا.
theological_decisions:
- issue: مرجع الضمائر المتكررة αὐτοῦ/αὐτὸν/αὐτῷ
  choice: 'الإبقاء على الضمائر، مع فهم أن مرجعها الله بحسب السياق المباشر في رومية 11: 33–35.'
  alternative: التصريح باسم «الله» في كل موضع.
  rationale: يحفظ الإبقاء على الضمائر البنية البلاغية للنص ولا يضيّق العبارة بأكثر مما يقتضيه السياق، مع بقاء المرجع واضحًا.
- issue: دلالة εἰς αὐτόν الغائية
  choice: «وإليه» بما يحفظ معنى الاتجاه والغاية.
  alternative: «ولأجله» بما يصرّح بمعنى الغرض.
  rationale: تحتمل εἰς الاتجاه والغاية والغرض؛ و«إليه» تحافظ على الاتساع الدلالي ولا تحسمه في معنى سببي أو غرضي واحد.
- issue: صيغة αὐτῷ ἡ δόξα التسبيحية
  choice: «له المجد» بوصفها إسنادًا تسبيحيًا اسميًا.
  alternative: «ليكن له المجد».
  rationale: الأصل اليوناني خالٍ من الفعل، والجملة الاسمية العربية تحافظ على هذا الإيجاز ويمكن أن تؤدي معنى الإقرار والتسبيح معًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على التوازي الثلاثي «منه وبه وإليه» وعلى إيجاز التسبيح الختامي. لا توجد علامات حواشٍ لأن الصياغة لا تستلزم حاشية لازمة للنشر.
