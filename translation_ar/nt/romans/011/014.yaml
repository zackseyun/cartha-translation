  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: ar
  text: لَعَلِّي أُثيرُ غَيْرَةَ بَنِي جِلْدَتِي، وَأُخَلِّصَ بَعْضًا مِنْهُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: قومي من اليهود؛ وحرفيًّا: «جسدي».'
    reason: توضيح الاستعارة العرقية/القرابية في العبارة اليونانية μου τὴν σάρκα.
lexical_decisions:
- source_word: εἴ πως
  choice: لَعَلِّي
  rationale: تفيد العبارة رجاء بولس ومسعاه غير المقطوع بنتيجته. و«لعلّي» عربية طبيعية موجزة تحفظ معنى التطلع والاحتمال في السياق.
- source_word: παραζηλώσω
  choice: أُثيرُ غَيْرَةَ
  rationale: يحفظ هذا التعبير معنى إيقاظ الغيرة، ويربط الآية بموضوع إثارة غيرة إسرائيل في السياق القريب.
- source_word: μου τὴν σάρκα
  choice: بَنِي جِلْدَتِي
  rationale: التعبير العربي «بنو جلدتي» ينقل استعارة القرابة الجسدية بصورة مفهومة وفصيحة، ويشير هنا إلى قوم بولس من اليهود من غير إدخال هذا التفسير صراحة في المتن.
- source_word: σώσω
  choice: أُخَلِّصَ
  rationale: «أخلّص» هو المقابل المألوف الذي يحفظ الدلالة الخلاصية للفعل في استعمال بولس.
- source_word: τινὰς ἐξ αὐτῶν
  choice: بَعْضًا مِنْهُمْ
  rationale: صياغة عربية طبيعية تبين أن المقصود عدد من أفراد الجماعة المذكورة، لا جميعهم.
theological_decisions:
- issue: دلالة σάρξ في إشارة بولس إلى جماعته العرقية
  choice: بَنِي جِلْدَتِي
  alternative: قومي؛ إخوتي اليهود؛ جسدي
  rationale: لا تشير σάρξ هنا إلى الطبيعة الخاطئة، بل إلى رابطة النسب والقومية. تحفظ «بني جلدتي» الصورة الجسدية ومعنى القرابة معًا، وتوضح الحاشية المرجع المقصود.
- issue: إسناد فعل الخلاص إلى بولس
  choice: فأُخَلِّصَ
  alternative: فيخلص بعضهم؛ فأكون سببًا في خلاص بعضهم
  rationale: أُبقي الإسناد المباشر كما في اليونانية من غير تخفيفه أو تفسير آليته، وبذلك يُحفظ التوتر اللاهوتي وصياغة بولس نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «بني جلدتي» لأنه تعبير عربي مفهوم يحفظ مجاز «الجسد» في معنى القرابة، مع حاشية توضيحية. وُضعت علامة الحاشية في المتن كما طُلب.
