  source_fidelity: 'المسودة تنقل المعنى الرئيس بدقة: «بقيّة» لـ λεῖμμα و«بحسب اختيار النعمة» تحافظان على إيجاز العبارة اليونانية وعدم حسم العلاقة بين الاختيار والنعمة. لكن «وهكذا أيضًا» لا تُظهر أداة الاستنتاج οὖν بوضوح؛ فإضافة «إذن» لازمة. كما أن «وُجدت» مقبول في هذا الموضع، وإن كان من الأفضل أن يُدعَم بـ«قد» لإبراز دلالة التام في γέγονεν بوصفها حالة حاضرة ناشئة عن حدوث سابق.'
