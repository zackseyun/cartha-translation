  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: ar
  text: وهكذا إذن، قد وُجدت أيضًا في الزمن الحاضر بقيّة بحسب اختيار النعمة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحسب اختيارٍ بالنعمة»، أو «بحسب اختيارٍ قائم على النعمة».'
    reason: بدائل لفظية تعكس أوجه فهم العلاقة الإضافية في κατ’ ἐκλογὴν χάριτος، من غير حسمها في المتن.
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: وهكذا أيضًا
  rationale: تنقل الاستنتاج من مثال إيليا في السياق السابق، وتحفظ καὶ الدالة على الموازاة بين ذلك الزمان والوقت الحاضر، من غير إثقال العربية بتراكم أدوات الربط.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: في الوقت الحاضر
  rationale: تعبر بوضوح عن الحقبة الراهنة المقابلة لزمن إيليا، وهي صياغة عربية فصيحة وطبيعية.
- source_word: λεῖμμα
  choice: بقيّة
  rationale: مصطلح عربي كتابي راسخ يدل على جماعة قليلة باقية، ويلائم الخلفية النبوية والبولسية.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: بحسب اختيار النعمة
  rationale: تحفظ لفظي الاختيار والنعمة والعلاقة الإضافية الموجزة بينهما، من غير حسم ما إذا كانت الإضافة تفيد المصدر أو الصفة أو الأساس.
- source_word: γέγονεν
  choice: وُجدت
  rationale: تعكس حالة حاضرة نتجت عن حدوث سابق، وتؤدي معنى صيغة التام من γίνομαι بعربية طبيعية، من غير تحويلها إلى معنى «بقيت» الذي لا يصرح به الفعل نفسه.
theological_decisions:
- issue: ترجمة ἐκλογή في سياق بولسي موضع نقاش عقائدي
  choice: اختيار
  alternative: اصطفاء
  rationale: «اختيار» هو المقابل المباشر والواضح في العربية المعاصرة، ويحفظ الثقل اللاهوتي للكلمة من غير استدعاء حمولة اصطلاحية مذهبية زائدة.
- issue: علاقة النعمة بالاختيار في κατ’ ἐκλογὴν χάριτος
  choice: اختيار النعمة
  alternative: اختيار بالنعمة؛ اختيار قائم على النعمة
  rationale: تحفظ الإضافة اليونانية المحتملة الدلالات، فلا تحسم وحدها هل النعمة مصدر الاختيار أم صفته أم أساسه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «بقيّة» حفاظًا على الصدى الكتابي، وأُبقي تركيب «اختيار النعمة» موجزًا ومفتوح الدلالة كما في الأصل.
