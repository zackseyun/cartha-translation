- from: وهكذا أيضًا، في الوقت الحاضر، وُجدت بقيّة بحسب اختيار النعمة.[a]
  to: وهكذا إذن، قد وُجدت أيضًا في الزمن الحاضر بقيّة بحسب اختيار النعمة.[a]
  rationale: أُضيفت «إذن» لتمثيل οὖν، واستُعمل «قد وُجدت» لإبراز دلالة γέγονεν التامة من غير تفسيرها بـ«بقيت». وحُسّنت الحاشية باستبدال صياغة غير مألوفة ببديل عربي طبيعي، مع إبقاء العلاقة بين الاختيار والنعمة غير محسومة في المتن.
