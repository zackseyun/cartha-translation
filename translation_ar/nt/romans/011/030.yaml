  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: الفاء مع «كما» تمثلان ὥσπερ γάρ، و«من قبل/الآن» تحفظان المقابلة الزمنية، و«عصيتم الله» و«عصيانهم» تحافظان على الصلة المعجمية بين ἠπειθήσατε وἀπειθείᾳ. و«بسبب» تمثيل سليم وآمن للداتيف ذي الدلالة السببية/الوسائلية، دون إضافة تفسيرية عن هوية «هؤلاء». كما تُبقي الصياغة المقارنة مفتوحة على ما يتم في الآية التالية.'
