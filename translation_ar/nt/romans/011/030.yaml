base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: ar
  text: فكما أنكم عصيتم الله من قبل[a]، أما الآن فقد نلتم الرحمة بسبب عصيانهم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم تؤمنوا بالله من قبل» و«بسبب عدم إيمانهم»؛ فاللفظان اليونانيان قد يحملان معنى عدم الطاعة وعدم الإيمان معًا في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: فكما أنكم
  rationale: تحفظ الفاء الصلة التفسيرية بما قبلها، وتحفظ «كما» قوة المقارنة التي تكتمل في الآية التالية، مع صياغة عربية طبيعية.
- source_word: ὑμεῖς
  choice: أنكم
  rationale: يمثل ضمير المخاطبين الجمع من غير أن يضيف صراحةً «أيها الأمم»، إذ تُفهم هويتهم من السياق.
- source_word: ποτε
  choice: من قبل
  rationale: تعبير عربي واضح يقابل الزمن الماضي ويبرز التضاد مع «الآن».
- source_word: ἠπειθήσατε
  choice: عصيتم
  rationale: ينقل معنى عدم الطاعة تجاه الله بصيغة فعلية طبيعية، ويحافظ على الصلة اللفظية والدلالية مع «عصيانهم» في آخر العبارة.
- source_word: τῷ θεῷ
  choice: الله
  rationale: مفعول الفعل «عصى» في العربية من غير حاجة إلى حرف جر، وهو المقابل الطبيعي للتركيب اليوناني.
- source_word: νῦν δὲ
  choice: أما الآن
  rationale: يبرز التحول الزمني والتقابل مع حال المخاطبين السابقة بلغة عربية فصيحة جارية.
- source_word: ἠλεήθητε
  choice: فقد نلتم الرحمة
  rationale: ينقل المبني للمجهول دلاليًا بوصف الرحمة عطية نالها المخاطبون، مع وضوح العبارة وطبيعتها في العربية.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: بسبب عصيانهم
  rationale: يعكس الاحتمال السببي للأداة الاسمية في صياغة واضحة، ويعيد ضمير الإشارة اليوناني على الجماعة المذكورة في السياق من غير إضافة تفسيرية داخل النص.
theological_decisions:
- issue: دلالة ἀπειθέω وἀπείθεια في سياق الخلاص عند بولس
  choice: عصى / عصيان
  alternative: لم يؤمن / عدم إيمان
  rationale: يمكن للمفردتين اليونانيتين أن تجمعا معنى العصيان وعدم الإيمان. اختير «العصيان» للمحافظة على الصلة بين الفعل والاسم وعلى البعد الإرادي والعلاقي تجاه الله، مع توثيق احتمال «عدم الإيمان» في الحاشية بدل حسم التوتر الدلالي.
- issue: دلالة اسم المفعول غير المباشر τῇ ... ἀπειθείᾳ
  choice: بسبب عصيانهم
  alternative: من خلال عصيانهم
  rationale: يحتمل التركيب معنى سببيًا أو وسائليًا. «بسبب» واضح في العربية ولا يحمّل العبارة تصورًا آليًا مفصلًا، بينما يبقى «من خلال» بديلًا نحويًا ممكنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على بنية المقارنة المفتوحة التي تستكملها الآية التالية، وعلى تكرار الجذر «ع ص ي» لتمثيل الصلة بين الفعل والاسم في اليونانية. وُضعت علامة الحاشية [a] بعد العبارة الأولى التي ينطبق عليها البديل، مع بيان انطباقه أيضًا على «عصيانهم».
