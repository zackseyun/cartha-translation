  to: وهكذا فإن هؤلاء أيضًا عصوا الآن، لكي ينالوا هم أيضًا الآن رحمةً بفضل الرحمة التي نلتموها.[a]
  rationale: يستبدل التعديل «بسبب» بـ«بفضل» لتفادي نسبة السببية المباشرة للرحمة في عصيان إسرائيل، مع الإبقاء على التفسير السياقي للضمير في المتن وعلى الاحتمال التركيبي الآخر في الحاشية. كما تُنقل علامة الحاشية إلى العبارة المعنية مباشرة.
