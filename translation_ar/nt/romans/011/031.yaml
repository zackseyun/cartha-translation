  source_fidelity: 'يحافظ المسودّ على البنية الأساسية للآية وعلى تكرار «الآن» والتوكيد في «هم أيضًا». لكن «بسبب» تجعل الرحمة علةً مباشرة لعصيانهم، في حين أن الداتيف اليوناني τῷ ὑμετέρῳ ἐλέει أقرب إلى معنى الوسيلة/الظرف: «بالرحمة التي نلتموها»، مع بقاء التحليل السياقي بأن هذه رحمة الله الممنوحة للمخاطَبين.'
  naturalness: الصياغة سليمة في الجملة، لكن «بفضل الرحمة التي نلتموها» أيسر وأدق من «بسبب الرحمة التي نلتموها» في هذا السياق. ووضع علامة الحاشية بجوار العبارة التي تشرحها أوضح من إلحاقها بنهاية الآية.
  terminology: «عصوا»، و«الرحمة»، و«ينالوا» اختيارات فصيحة واضحة وتحافظ على اتساع دلالة ἠπείθησαν وعلى المبني للمجهول في ἐλεηθῶσιν من غير إضافة تفسير عقائدي.
