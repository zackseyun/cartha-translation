    rationale: العبارة اليونانية داتيف موجز، وتقديمها بـ«بسبب» قد يفهم أن رحمة المخاطبين/رحمة الله لهم هي سبب عصيان هؤلاء. «بفضل» أنسب لإبراز علاقة الوسيلة أو التدبير في الحجة، من دون الجزم بالقراءة الحرفية البديلة المذكورة في الحاشية.
