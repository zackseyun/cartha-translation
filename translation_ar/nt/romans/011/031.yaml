base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: ar
  text: وهكذا فإن هؤلاء أيضًا عصوا الآن، لكي ينالوا هم أيضًا الآن رحمةً بفضل الرحمة التي نلتموها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «برحمتكم». يمكن أن يُفهم التعبير اليوناني حرفيًّا على هذا النحو، لكن السياق يرجّح أنه يشير إلى رحمة الله التي نلتموها.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: وهكذا ... أيضًا
  rationale: تحفظ القوة التشبيهية والاستنتاجية التي تربط حال إسرائيل بما سبق، بصياغة عربية طبيعية.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: تحفظ اسم الإشارة العائد في السياق إلى إسرائيل، بدل تحويله إلى ضمير عام.
- source_word: νῦν
  choice: الآن
  rationale: تحفظ الإشارة الزمنية إلى المرحلة الحاضرة في سياق الحجة، وقد أُبقيت في الموضعين كما في النص اليوناني.
- source_word: ἠπείθησαν
  choice: عصى
  rationale: الفعل اليوناني قد يدل على العصيان أو عدم الإيمان؛ واختيار «عصى» يحفظ دلالته الأوسع ولا يقصره على عدم التصديق الذهني.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: بسبب الرحمة التي نلتموها
  rationale: يفهم العبارة على أنها رحمة الله التي نالها المخاطَبون، مع إبقاء القراءة الحرفية البديلة في الحاشية بسبب إيجاز تركيب الداتيف وغموضه الحقيقي.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي علاقة الغاية أو النتيجة المحتملة بوضوح، من غير حسم زائد بينهما.
- source_word: καὶ αὐτοὶ
  choice: هم أيضًا
  rationale: تحفظ توكيد شمول هؤلاء أنفسهم بالرحمة.
- source_word: ἐλεηθῶσιν
  choice: ينالوا ... الرحمة
  rationale: صياغة عربية طبيعية للمبني للمجهول الإلهي، وتدل على أن الرحمة تُمنح لهم.
theological_decisions:
- issue: هل τῷ ὑμετέρῳ ἐλέει تعني رحمة يمارسها المؤمنون من الأمم أم رحمة منحها الله لهم؟
  choice: بسبب الرحمة التي نلتموها
  alternative: برحمتكم
  rationale: تتابع رومية 11:30-32 يقارن بين جماعات كانت عاصية ثم نالت رحمة الله، ولذلك يرجح أن المقصود هو الرحمة الإلهية التي نالها المخاطَبون. ومع ذلك لا يُطمس الاحتمال النحوي الآخر، بل يُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «عصى» بدل «لم يؤمن» للمحافظة على اتساع دلالة الفعل اليوناني، وأُبقيت «الآن» مرتين موافقة لتوكيد النص المصدر.
