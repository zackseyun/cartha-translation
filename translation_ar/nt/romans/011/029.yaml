  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: ar
  text: لِأَنَّ هِبَاتِ اللهِ وَدَعْوَتَهُ لَا رَجْعَةَ فِيهِمَا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يندم الله عليهما»، أو: «لا يستردهما».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: لَا رَجْعَةَ فِيهِمَا
  rationale: تفيد الصفة أن الأمر لا يكون موضع ندم ولا يُستردّ أو يُنقض. وهذا التعبير العربي الطبيعي يحفظ في السياق معنى أن الله لا يرجع في هباته ودعوته، من غير أن يوسّع الدلالة إلى معنى «غير قابلة للتغيير» على نحو مطلق.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تؤدي الأداة وظيفة تعليلية تربط القول بما قبله، و«لأن» تنقل هذه القوة بوضوح وإيجاز.
- source_word: τὰ χαρίσματα
  choice: هِبَاتِ
  rationale: تعني اللفظة عطايا نابعة من النعمة. و«هبات» لفظ عربي واضح يحفظ الجمع ودلالة العطاء المجاني دون إضافة تفسير خاص.
- source_word: ἡ κλῆσις
  choice: دَعْوَتَهُ
  rationale: تحفظ «دعوته» الثقل اللاهوتي للفظة في استعمال بولس، من غير أن تحدد في الترجمة كيفية هذه الدعوة أو نطاقها.
- source_word: τοῦ θεοῦ
  choice: اللهِ ... ـهُ
  rationale: تُسند الإضافة الهبات والدعوة كلتيهما إلى الله، مع إبقاء احتمال المصدر والملكية دون حسم زائد.
theological_decisions:
- issue: نطاق «هبات الله ودعوته» في السياق
  choice: الإبقاء على العبارة بلا تحديد صريح لمتلقي الهبات والدعوة.
  alternative: تفسيرها صراحة بأنها امتيازات إسرائيل ودعوتها في رومية 9–11، أو تعميمها على كل هبات الله ودعوته.
  rationale: السياق القريب يتعلق بقوة بإسرائيل، لكن العبارة اليونانية نفسها لا تعيد ذكر المتلقي؛ لذلك تحافظ الصياغة على كلام بولس وعلى التوتر التفسيري.
- issue: دلالة ἀμεταμέλητα
  choice: «لا رجعة فيهما» مع توضيح البدائل في الحاشية.
  alternative: «لا يندم الله عليهما» أو «لا يستردهما».
  rationale: الأصل يحتمل من جهة الاشتقاق انتفاء الندم، ويؤدي سياقيًا معنى عدم الرجوع أو الاسترداد. الصياغة المختارة طبيعية وموجزة، والحاشية تحفظ البدائل الدلالية الحقيقية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل المثنى في «فيهما» ليعود بدقة إلى «الهبات» بوصفها مجموعة وإلى «الدعوة»، مع الحفاظ على إيجاز الآية وصلتها التعليلية بما قبلها.
