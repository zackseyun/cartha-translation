base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: ar
  text: صحيح؛ هُمْ كُسِرُوا بِسَبَبِ عَدَمِ الإِيمَانِ، أَمَّا أَنْتَ فَثَابِتٌ بِالإِيمَانِ.[a] لَا تَتَكَبَّرْ، بَلْ خَفْ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمّا أنت فتقوم بالإيمان» أو «تثبت بالثقة».'
    reason: alternative_reading
  - marker: b
    text: أي لا تفكر في نفسك بتعالٍ، بل ابقَ في مخافة متواضعة وحذر أمام الله، من غير غرور.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: حَسَنًا
  rationale: تأتي هنا جوابًا بالموافقة على قول المحاور في الآية السابقة، وتحافظ «حسنًا» على الإيجاز وعلى إمكان فهمها بمعنى «هذا صحيح».
- source_word: ἀπιστίᾳ
  choice: بِسَبَبِ عَدَمِ الإِيمَانِ
  rationale: يبين السياق أن عدم الإيمان هو سبب كسر الأغصان، كما يحفظ التعبير المقابلة الصريحة مع «الإيمان».
- source_word: ἐξεκλάσθησαν
  choice: كُسِرُوا
  rationale: يحافظ الفعل على صورة أغصان الزيتونة في السياق، ويؤدي المبني للمجهول في النص اليوناني من غير تعيين الفاعل داخل هذه الجملة.
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: الداتيف يدل هنا على الوسيلة أو الأساس، و«الإيمان» هو المقابل الطبيعي لـ«عدم الإيمان».
- source_word: ἕστηκας
  choice: فَثَابِتٌ
  rationale: ينقل الحالة الحاضرة الناتجة التي يدل عليها التام اليوناني، بصياغة عربية طبيعية وموجزة.
- source_word: ὑψηλὰ φρόνει
  choice: لَا تَتَكَبَّرْ
  rationale: يؤدي معنى التعبير الاصطلاحي، أي التفكير في النفس بتعالٍ أو كبرياء، بلغة عربية واضحة.
- source_word: φοβοῦ
  choice: بَلْ خَفْ
  rationale: يحفظ حدة الأمر والتوتر اللاهوتي في الأصل، من غير تخفيفه إلى مجرد الاحترام أو تضخيمه إلى الذعر.
theological_decisions:
- issue: معنى πίστις في مقابل ἀπιστία
  choice: الإيمان
  alternative: الثقة
  rationale: المقابلة المباشرة مع «عدم الإيمان» ترجح استجابة الإنسان بالإيمان، مع بقاء «الثقة» شرحًا ممكنًا للفظ.
- issue: دلالة φοβοῦ
  choice: خَفْ
  alternative: كُنْ في مخافة
  rationale: يحافظ الأمر المباشر «خف» على التحذير من الغرور والاتكال على النفس، ولا يحسم الخوف في معنى وجداني صرف أو في توقير مخفف.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم المفرد المذكر «أنت» وفق المخاطب المفرد في اليونانية، وحُفظت صورة كسر الأغصان ضمن سياق الزيتونة. وُضعت علامتا الحاشية بعد العبارتين اللتين تشرحانهما.
