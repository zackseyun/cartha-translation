  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: ar
  text: أما من جهة الإنجيل، فهم أعداء لأجلكم[a]؛ وأما من جهة الاختيار، فهم محبوبون من أجل الآباء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «بسببكم». فالعبارة اليونانية يمكن أن تدل على السبب أو على ما كان لفائدتكم.'
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«الآباء» آباء إسرائيل الأوّلون، ولا سيما إبراهيم وإسحاق ويعقوب.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: فمن جهة الإنجيل
  rationale: تفيد κατά مع حالة النصب هنا جهة النظر أو مجال الاعتبار، وتُظهر «فمن جهة» المقابلة التي تنشئها البنية μὲν...δέ، من غير أن توحي بحركة أو اتجاه.
- source_word: εὐαγγέλιον
  choice: الإنجيل
  rationale: «الإنجيل» هو المقابل العربي الراسخ للخبر السار المُعلَن عن المسيح في الاستعمال البولسي، وهو أدق في هذا السياق من العبارة التفسيرية «البشارة السارة».
- source_word: ἐχθροὶ
  choice: أعداء
  rationale: الصفة في اليونانية مستعملة استعمال الخبر، ولذلك تحافظ «هم أعداء» على قوتها العلائقية ولا تحوّلها إلى «مبغَضون» أو تختزلها في مجرد موقف عدائي.
- source_word: δι’ ὑμᾶς
  choice: لأجلكم
  rationale: تعبّر διά مع النصب عن السبب أو ما يعود بالنفع. وتحافظ «لأجلكم» على إمكان المعنيين في سياق دخول الأمم، مع بقاء «بسببكم» احتمالًا لغويًا.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: وأما من جهة الاختيار
  rationale: تواصل العبارة إطار المقابلة من جهة الاعتبار، وتنقل δέ بصيغة «وأما» العربية الواضحة.
- source_word: ἐκλογὴν
  choice: الاختيار
  rationale: «الاختيار» مصطلح عربي موجز ودقيق هنا لغرض الله في الاختيار، من غير إضافة الفاعل «الله» صراحةً حيث لا يذكره النص اليوناني.
- source_word: ἀγαπητοὶ
  choice: محبوبون
  rationale: تنقل الصفة الخبرية كما هي وتحفظ ثقلها العهدي، في موازاة مقصودة مع «أعداء».
- source_word: διὰ τοὺς πατέρας
  choice: من أجل الآباء
  rationale: تنقل سبب المحبة أو أساسها كما تعبّر عنه διά مع النصب، وتحافظ على تعبير بولس الموجز «الآباء» بدل توسيعه داخل المتن إلى «الآباء الأولين» أو «البطاركة».
theological_decisions:
- issue: مرجع الضمير المستتر في «هم»
  choice: يُفهم في سياق رومية 9–11 على أنه إسرائيل أو الشعب اليهودي بوصف جماعي، مع كون كثيرين منهم غير مؤمنين في زمن بولس.
  alternative: قصره على اليهود غير المؤمنين في زمن بولس وحدهم.
  rationale: أبقت الصياغة العربية الضمير من غير إضافة تحدد مداه، محافظةً على المنظور الجماعي وعلى خصوصية الحالة التاريخية في آن واحد.
- issue: دلالة «أعداء»
  choice: تصف وضعهم من جهة الإنجيل، مع إبقاء المقابلة بأنهم محبوبون من جهة الاختيار.
  alternative: أنها تعني أن الله يبغضهم بغضًا مطلقًا، أو أنها لا تعني إلا معارضة اجتماعية ضعيفة.
  rationale: يضع النص «أعداء» و«محبوبون» معًا في توتر مقصود؛ لذلك لم تُخفَّف الأولى ولم تُلغَ الثانية بتفسير زائد.
- issue: المقصود بـ«الآباء»
  choice: الآباء الأوّلون لإسرائيل، ولا سيما إبراهيم وإسحاق ويعقوب، في ضوء وعود الله لهم.
  alternative: الأسلاف عمومًا بمعنى عرقي غير محدد.
  rationale: يحفظ المتن اللفظ الموجز كما ورد، بينما توضح الحاشية مرجعه الطبيعي في سياق رومية 9–11 من غير إدخال التفسير في صلب الآية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ورصينة. استُعملت «من جهة... وأما من جهة...» لإبراز المقابلة المحكمة في الأصل، مع الحفاظ على التوتر اللاهوتي بين «أعداء» و«محبوبون» من غير حسم زائد.
