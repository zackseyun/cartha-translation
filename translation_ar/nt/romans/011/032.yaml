source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: ar
  text: لِأَنَّ اللهَ حَبَسَ الْجَمِيعَ[a][b] فِي الْعِصْيَانِ[c]، لِكَيْ يَرْحَمَ الْجَمِيعَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أغلق على الجميع»، أو «حصر الجميع».'
    reason: lexical_alternative
  - marker: b
    text: تكرار «الجميع» يحفظ صياغة بولس الواسعة، ولا ينبغي تضييقها في الترجمة قبل الأوان؛ وفي السياق يتناول كلامه اليهود والأمم معًا.
    reason: alternative_reading
  - marker: c
    text: يمكن أن تأتي الكلمة بمعنى «عدم الإيمان» في بعض السياقات، لكن المعنى الأوسع، أي رفض الطاعة، هو الأرجح هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: حَبَسَ
  rationale: الفعل يدل على الإغلاق على أشخاص معًا أو حصرهم. واختيار «حَبَسَ» يحفظ الصورة المكانية القوية في الأصل، من غير أن يضيف صراحةً معنى العقوبة الذي قد توحي به ألفاظ مثل «سَجَنَ».
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تقدّم γάρ تعليلًا يشرح ما سبق، و«لأنَّ» تؤدي هذا الربط بوضوح في العربية المعاصرة.
- source_word: τοὺς πάντας
  choice: الْجَمِيعَ
  rationale: تكررت العبارة نفسها في شطري الآية، ولذلك حُفظت بلفظ «الجميع» في الموضعين، من غير تقييد مداها داخل المتن.
- source_word: εἰς ἀπείθειαν
  choice: فِي الْعِصْيَانِ
  rationale: مع فعل الحبس، تؤدي «في» معنى الدخول في نطاق العصيان والبقاء محصورين فيه بصورة عربية طبيعية. و«العصيان» يحفظ المعنى الأوسع للرفض وعدم الطاعة، بدل حصره في عدم التصديق الذهني.
- source_word: ἵνα
  choice: لِكَيْ
  rationale: تحفظ «لكي» القوة الغائية للأداة، مع بقاء العبارة واضحة وطبيعية.
- source_word: ἐλεήσῃ
  choice: يَرْحَمَ
  rationale: الفعل العربي «يرحم» هو المقابل المباشر والطبيعي لمعنى إظهار الرحمة، وصيغة النصب بعد «لكي» لا تفيد الشك في وقوع الفعل.
theological_decisions:
- issue: مدى «الجميع» في الشطرين
  choice: إبقاء «الجميع» في الموضعين كما في التناظر اليوناني
  alternative: تفسيرها في المتن بعبارة «اليهود والأمم جميعًا» أو توسيعها إلى «كل إنسان بلا استثناء»
  rationale: السياق يتناول اليهود والأمم معًا، لكن اللفظ اليوناني نفسه واسع ومتكرر. لذا تحفظ الترجمة التناظر والتوتر الدلالي، ولا تحسم داخل المتن جدلًا لاهوتيًا بشأن مدى الرحمة.
- issue: دلالة ἵνα بين الغاية والنتيجة
  choice: لِكَيْ
  alternative: حتى كانت النتيجة أن يرحم الجميع
  rationale: الأداة تحتمل في الاستعمال الغاية مع تداخل معنى النتيجة، و«لكي» تحفظ البنية الغائية الظاهرة من غير شرح زائد.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ومهيبة. استُخدم «حَبَسَ ... في» للمحافظة على الصورة الأصلية مع وضوحها للقارئ العادي، وحُفظ تكرار «الجميع» حرفيًا لما له من وزن بلاغي ولاهوتي.
