base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: ar
  text: 'ويقول داود: «لِتَصِرْ مائدتهم فخًّا وشَرَكًا، وعَثْرةً وجزاءً لهم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فخًّا ومَصيدةً»؛ فاللفظان اليونانيان متقاربان، وكلاهما يصوّر الاصطياد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: داود
  rationale: الصيغة العربية المعيارية للاسم الكتابي.
- source_word: λέγει
  choice: يقول
  rationale: يحفظ المضارع الأدبي اليوناني الذي يقدّم الاقتباس.
- source_word: Γενηθήτω
  choice: لِتَصِرْ
  rationale: صيغة طلبية طبيعية تحفظ قوة الأمر الغائب في الاقتباس، ولا تحوّله إلى مجرد تنبؤ.
- source_word: τράπεζα
  choice: مائدتهم
  rationale: يحفظ الصورة الحسية المباشرة للمائدة دون تفسيرها على أنها الطعام أو الوليمة.
- source_word: παγίδα
  choice: فخًّا
  rationale: لفظ عربي واضح يدل على أداة الإمساك، مع تمييزه عن اللفظ التالي.
- source_word: θήραν
  choice: شَرَكًا
  rationale: يناسب سياق الصيد والاصطياد ويؤدي وظيفة المرادف القريب المقترن بـ«فخ».
- source_word: σκάνδαλον
  choice: عَثْرةً
  rationale: يحفظ صورة ما يسبب التعثر والسقوط بدل قصر المعنى على الإساءة الشعورية.
- source_word: ἀνταπόδομα
  choice: جزاءً
  rationale: يدل على المقابلة بما يستحقه المرء، ويلائم السياق القضائي دون زيادة تفسيرية مثل «انتقام».
- source_word: αὐτοῖς
  choice: لهم
  rationale: صياغة عربية طبيعية تحفظ دلالة المجرور على جهة الجزاء.
theological_decisions:
- issue: قوة الدعاء القضائي في الاقتباس من المزمور 69:22
  choice: «لِتَصِرْ مائدتهم...»
  alternative: «ستصير مائدتهم...» أو «عسى أن تصير مائدتهم...»
  rationale: يحفظ الأمر اليوناني قوة الطلب أو الدعاء القضائي، بدل تليينه إلى تنبؤ أو تمنٍّ ضعيف.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعمل «لِتَصِرْ» للمحافظة على القوة الطلبية، و«فخًّا وشَرَكًا» للإبقاء على تتابع لفظين متقاربين في الأصل دون دمجهما. وُضع مؤشر الحاشية في المتن بعد الاقتباس.
