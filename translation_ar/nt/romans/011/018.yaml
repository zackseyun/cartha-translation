  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: ar
  text: فلا تفتخر على الأغصان[a]. وإن كنت تفتخر، فلستَ أنت الذي يحمل الجذر، بل الجذر هو الذي يحملك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا تفتخر ضد الأغصان».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فلستَ أنت تحمل الجذر، بل الجذر يحملك». ويمكن أن يُترجم «يحمل» هنا أيضًا: «يسند» أو «يدعم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: تفتخر على / تفتخر
  rationale: يفيد الفعل التفاخر على شخص أو ضده. وتعبير «تفتخر على» عربي واضح يحفظ معنى الاستعلاء العلاقي الذي تفيده κατά، مع إبقاء التكرار في الجملة الشرطية.
- source_word: κλάδων
  choice: الأغصان
  rationale: أُبقي التعريف لأن الكلام على أغصان محددة ضمن استعارة شجرة الزيتون في السياق.
- source_word: ῥίζαν / ῥίζα
  choice: الجذر
  rationale: تُرجم اللفظ على نحو واحد في الموضعين حفاظًا على صورة الشجرة وعلى المقابلة بين الجذر والغصن.
- source_word: βαστάζεις
  choice: يحمل
  rationale: «يحمل» يقابل الفعل اليوناني مباشرة ويحفظ الصورة المادية، مع دلالة ضمنية على الإسناد والإعالة في سياق الشجرة.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: فلستَ أنت الذي يحمل الجذر، بل الجذر هو الذي يحملك
  rationale: تحفظ الصياغة توكيد الضمير والمقابلة الحادة بين «أنت» و«الجذر»، وتبرز انقلاب علاقة الاعتماد.
- source_word: μὴ
  choice: فلا
  rationale: أداة نهي مباشرة وطبيعية مع ربط الكلام بما سبقه في السياق، من غير تحميل صيغة المضارع دلالة استمرارية غير لازمة.
theological_decisions:
- issue: الدلالة المجازية للجذر والأغصان في صورة شجرة الزيتون
  choice: إبقاء الاستعارة كما هي من غير تعيين هوية الجذر أو الأغصان داخل المتن
  alternative: تفسير الجذر صراحةً بأنه الآباء أو إبراهيم أو مواعيد العهد
  rationale: النص اليوناني يورد الصورة من غير تفسير مباشر لهوية عناصرها. والتعيين في الترجمة سيضيف تفسيرًا لاهوتيًا ويحسم انفتاحًا يتركه بولس للسياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «الأغصان» لما يلائم صورة شجرة الزيتون طبيعيًا، وحُفظ تكرار «الجذر» و«يحمل» لإبراز التوازي والمقابلة في الأصل.
