review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي منقول بدقة: المخاطَبون هم الأمم/غير اليهود، وبولس رسول إليهم ويعظّم خدمته. لكن «ما دمتُ» يغلب عليه في العربية معنى الاستمرار الزمني («طوال ما أنا») أكثر من معنى الأساس أو المدى في ἐφ’ ὅσον، فيستحسن استبداله بتعبير يبيّن أن رسوليته هي جهة قوله وأساسه. كما أن «الوثنيين» ليس بديلًا معجميًا محايدًا لـἔθνη هنا، لأنه يضيف دلالة دينية لا يقتضيها اللفظ في هذا السياق.'
  naturalness: الأسلوب فصيح وواضح عمومًا. تركيب «أما أنتم أيها الأمم فأقول لكم» مفهوم، وتساعد الفواصل على وضوحه. والصياغة المنقحة تجعل الربط المنطقي أكثر سلاسة في العربية المعاصرة.
  terminology: «الأمم» مناسب في رومية 9–11 ويحفظ تكرار اللفظ اليوناني، و«رسول» و«خدمتي» و«أعظّم» مناسبة. ينبغي حذف «الوثنيين» من الحاشية؛ فـ«غير اليهود» هو التوضيح السياقي/البديل الأدق، لا سيما أن الأمم لا تعني بالضرورة الوثنيين.
  issues:
  - severity: medium
    issue: «ما دمتُ رسولًا» قد تُفهم زمنيًا.
    rationale: تعبير ἐφ’ ὅσον هنا يحدد جهة الكلام أو أساسه («بما أنني/من حيث إنني رسول للأمم»)، لا مجرد مدة زمنية. «بما أنني» أو «من حيث إنني» أدق عربيًا.
  - severity: medium
    issue: الحاشية (a) تعرض «الوثنيين» بديلًا لـἔθνη.
    rationale: «الوثنيون» أضيق وأثقل دلالة من «الأمم» في هذا السياق البولسي، ويضيف مفهوم العبادة الوثنية. البديل أو الشرح الأدق هو «غير اليهود».
