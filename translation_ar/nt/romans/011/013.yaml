  text: 'أما أنتم، أيها الأمم[a]، فأقول لكم: بما أنني رسولٌ إلى الأمم، فإني أُعظِّم خدمتي[b]،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: غير اليهود. ويمكن ترجمة اللفظ اليوناني في الموضعين: «غير اليهود».'
