  - marker: b
    text: 'أو: «أُمجِّد خدمتي»، أي أرفع شأنها وأكرمها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: أما أنتم أيها الأمم فأقول لكم
  rationale: يجمع تركيب النداء والخطاب المباشر في عربية فصيحة طبيعية، مع نقل δὲ انتقالًا خفيفًا بـ«أما... فـ» دون جعله تضادًا حادًا.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: ما دمتُ
  rationale: يؤدي معنى الاعتبار أو النطاق الذي تقوم عليه العبارة، ويناسب كون بولس يتحدث من جهة رسوليته للأمم، من غير إثقال العربية بنقل كل أداة على حدة.
- source_word: ἐθνῶν ἀπόστολος
  choice: رسولًا إلى الأمم
  rationale: يحفظ دلالة ἀπόστολος الاصطلاحية ويوضح أن الإرسالية متجهة إلى غير اليهود؛ و«الأمم» تبقي الصلة اللفظية بتكرار ἔθνος.
- source_word: τὴν διακονίαν μου
  choice: خدمتي
  rationale: «الخدمة» لفظ عربي واضح وواسع يشمل المهمة الرسولية والعمل الموكل إلى بولس، مع إبقاء معنى الخدمة الكامن في διακονία.
- source_word: δοξάζω
  choice: أُعظِّم
  rationale: ينقل معنى إعلاء شأن الخدمة وتكريمها، ولا يوحي بأن بولس يمجد ذاته.
theological_decisions:
- issue: دلالة تعظيم بولس لخدمته
  choice: يُعلي بولس شأن خدمته الرسولية ويكرمها
  alternative: يمجّد خدمته أو يفتخر بها
  rationale: المفعول به هو الخدمة لا ذات بولس، و«أعظّم» يحفظ القوة البلاغية من غير حسمها في معنى التفاخر الشخصي.
- issue: مرجع ἔθνη / ἐθνῶν
  choice: الأمم، أي غير اليهود في هذا السياق
  alternative: الوثنيون أو الشعوب
  rationale: سياق رومية 9–11 يقابل إسرائيل بغير اليهود. واختيار «الأمم» يحفظ اللفظ الكتابي الواسع، مع توضيح المقصود في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أما... فـ» لنقل الانتقال في الخطاب، وحُفظ تكرار «الأمم» في الموضعين، مع شرح دلالته السياقية في الحاشية.
