  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: ar
  text: لأنه إن كان الله لم يُشفق على الأغصان الطبيعية[a]، فلن يُشفق عليك أنت أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأغصان التي هي بحسب الطبيعة»؛ حرفيًا: «الأغصان بحسب الطبيعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: لأنه إن كان
  rationale: ينقل γάρ التعليلية وεἰ الشرطية في صياغة عربية واضحة، ويحفظ اتصال الحجة بما قبلها.
- source_word: ὁ θεὸς
  choice: الله
  rationale: المقابل العربي المعياري لاسم الجلالة بوصفه فاعل الجملة.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: الأغصان الطبيعية
  rationale: ينقل معنى «الأغصان بحسب الطبيعة» بصياغة عربية موجزة وطبيعية، مع إبقاء استعارة شجرة الزيتون دون تفسير مرجعها داخل النص.
- source_word: οὐκ ἐφείσατο
  choice: لم يُشفق على
  rationale: يؤدي معنى φείδομαι، أي الامتناع عن الإضرار أو الاستبقاء، ويحافظ على التوازي اللفظي مع الجملة التالية.
- source_word: οὐδὲ σοῦ φείσεται
  choice: فلن يُشفق عليك أنت أيضًا
  rationale: ينقل النفي المتصل في οὐδέ، ويحفظ ضمير المخاطب المفرد σοῦ؛ وإبراز «أنت» يوضح المقابلة التي تحملها العبارة اليونانية.
theological_decisions:
- issue: مرجع «الأغصان الطبيعية» في استعارة شجرة الزيتون
  choice: الإبقاء على الاستعارة دون التصريح بمرجع الأغصان في متن الآية.
  alternative: تفسيرها صراحة بأنها إسرائيل بحسب الجسد.
  rationale: السياق يدل بقوة على المرجع، لكن بولس يصوغه هنا استعاريًا؛ لذلك يحفظ النص الاستعارة ويترك تعيين المرجع للسياق.
- issue: قوة التحذير الموجَّه إلى المخاطب
  choice: صياغته تحذيرًا مباشرًا للمخاطب المفرد دون إضافة قيود عقائدية.
  alternative: تفسير التحذير وفق موقف محدد من الثبات أو الارتداد أو الاختيار الجماعي والفردي.
  rationale: اليونانية تقدم تحذيرًا حقيقيًا بصيغة المفرد، لكنها لا تحسم في هذه الآية وحدها تلك المناقشات اللاهوتية الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «يُشفق على» في الشطرين للمحافظة على التوازي، مع «أنت أيضًا» لإبراز المقابلة والتحذير الموجَّه إلى مخاطب مفرد.
