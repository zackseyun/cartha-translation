  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: ar
  text: 'فأقول: أفعثروا لكي يسقطوا؟ حاشا! بل بسبب زلّتهم وصل الخلاص إلى الأمم[a]، لإثارة غيرتهم[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «للشعوب»؛ والمقصود في هذا السياق الشعوب غير اليهودية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ليستثيرهم إلى الغيرة»؛ وقد تتضمن العبارة تحريك رغبتهم في نوال الخلاص نفسه.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: فأقول
  rationale: تؤدي العبارة وظيفة الانتقال الاستدلالي إلى سؤال بلاغي، والفاء تنقل قوة οὖν في عربية طبيعية موجزة.
- source_word: μὴ ἔπταισαν
  choice: أَلَعَلَّهُم عَثَروا؟
  rationale: السؤال اليوناني يتوقع جوابًا بالنفي. وصيغة «ألعلهم» توحي بالاستنكار من غير أن تحول السؤال إلى تقرير صريح.
- source_word: ἵνα πέσωσιν
  choice: لكي يسقطوا
  rationale: تحفظ دلالة الغاية أو النتيجة الممكنة، وتبقي التمييز بين «عثروا» و«يسقطوا» من غير إضافة معنى الهلاك النهائي أو السقوط الذي لا رجعة منه.
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: تعبير عربي فصيح مألوف يفيد الرفض القاطع، ويلائم قوة صيغة التمني اليونانية في هذا الاستعمال البلاغي.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: بزلّتهم
  rationale: «الزلة» تجمع معنى الخطوة الخاطئة والتعدي، وتنسجم مع صورة العثرة من غير أن تخفف المسؤولية الأخلاقية.
- source_word: ἡ σωτηρία
  choice: الخلاص
  rationale: هو المقابل العربي الواضح والمستقر لدلالة σωτηρία الخلاصية في رسالة رومية.
- source_word: τοῖς ἔθνεσιν
  choice: للأمم
  rationale: يحفظ اللفظ اليوناني «الأمم»، ويفهم في سياق رومية 9–11 على الشعوب غير اليهودية؛ وقد وُضّح ذلك في الحاشية.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: لإثارة غيرتهم
  rationale: تنقل الغاية أو النتيجة المقصودة، وتحفظ اتساع παραζηλόω بين إثارة الغيرة وتحريك الرغبة في نوال البركة نفسها.
theological_decisions:
- issue: هل عثرة إسرائيل سقوط نهائي لا رجعة منه؟
  choice: ينفي النص أن تكون عثرتهم لكي يسقطوا، مع إبقاء لفظي العثرة والسقوط متميزين.
  alternative: تفسير السقوط بأنه هلاك نهائي، أو بأنه سقوط كامل لكنه مؤقت.
  rationale: لا يضيف اليوناني ألفاظًا مثل «نهائيًا» أو «بلا رجعة»، ولذلك تمتنع الترجمة عن حسم طبيعة السقوط بما يتجاوز العبارة.
- issue: دلالة إثارة الغيرة في تدبير الخلاص
  choice: خلاص الأمم يثير غيرة المخاطَبين.
  alternative: أن تكون الغيرة حسدًا سلبيًا محضًا، أو محاكاةً إيجابية ورغبةً في الخلاص نفسه.
  rationale: الفعل اليوناني يحتمل إثارة الغيرة بما قد يدفع إلى طلب البركة نفسها، لكن النص لا يصرح بالنتيجة النفسية تصريحًا كاملًا، فحُفظ هذا الاتساع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التقابل التصويري بين العثرة والسقوط، واستُعملت «حاشا» للرفض الشديد. أُبقيت «الأمم» في المتن لقربها من الأصل، مع شرح معناها السياقي في الحاشية.
