source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: ar
  text: وإذا كانت الباكورة مقدَّسة، فكذلك العجين كلُّه[a]؛ وإذا كان الجذر مقدَّسًا، فكذلك الأغصان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كتلة العجين». تشير الكلمة اليونانية إلى كتلة من العجين أو مزيجه.'
    reason: بديل معجمي يوضح معنى φύραμα وصورة العجين.
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: الباكورة
  rationale: تحافظ «الباكورة» على دلالة الجزء الأول المقدَّم لله وعلى صدى لغة البواكير في العهد القديم، من غير اختزالها إلى مجرد «جزء أول».
- source_word: ἁγία
  choice: مقدَّسة
  rationale: تنقل الفئة الكتابية الخاصة بالقداسة وتحافظ على التوازي بين الصورتين، من غير تحديد ما إذا كانت القداسة عهدية أو تمثيلية أو خلاصية.
- source_word: φύραμα
  choice: العجين كلُّه
  rationale: يوضح صورة كتلة العجين أو مزيجه بلغة عربية طبيعية، ويُظهر العلاقة بين الباكورة وبقية العجين.
- source_word: ῥίζα
  choice: الجذر
  rationale: ترجمة مباشرة وطبيعية للاستعارة النباتية.
- source_word: κλάδοι
  choice: الأغصان
  rationale: تعبير عربي مألوف ودقيق في صورة الشجرة، ومتسق مع سياق شجرة الزيتون في رومية 11.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: وإذا كانت ... فكذلك ...؛ وإذا كان ... فكذلك ...
  rationale: تنقل «و» قوة δέ الانتقالية الخفيفة، وتستعمل «فكذلك» لإظهار النتيجة المضمرة في اليونانية مع إبقاء العبارة موجزة ومتوازية.
theological_decisions:
- issue: طبيعة القداسة في صورتي الباكورة والجذر وعلاقتها بالعجين والأغصان
  choice: الإبقاء على لفظ «مقدَّسة/مقدَّسًا» من غير تفسير نوع القداسة
  alternative: «مكرَّسة» بمعنى عهدي، أو صياغة توحي بقداسة خلاصية
  rationale: تثبت الآية علاقة اشتقاق أو تمثيل بين الباكورة والعجين وبين الجذر والأغصان، لكنها لا تحدد بذاتها كيفية هذه القداسة؛ لذا لا تحسم الترجمة التوتر لمصلحة تفسير طقسي أو عرقي أو خلاصي فردي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على التوازي الموجز في الأصل، ووُضع رمز الحاشية بعد «العجين كلُّه» لأنه يشرح لفظ φύραμα تحديدًا.
