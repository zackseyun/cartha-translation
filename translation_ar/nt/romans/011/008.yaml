base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: ar
  text: 'كما هو مكتوب: «أعطاهم الله روح تبلُّد[a]، وعيونًا لا تبصر، وآذانًا لا تسمع، إلى هذا اليوم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «روح سبات عميق». تستحضر العبارة صدى إشعياء 29:10، غير أن اللفظة اليونانية هنا تدل على التبلُّد أو الخَدَر.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية واضحة ومألوفة لإدخال اقتباس كتابي، وتعكس καθώς مع صيغة التمام في γέγραπται.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: أعطاهم الله
  rationale: يحافظ على الفعل الماضي وعلى التصريح بأن الله هو الفاعل، من غير تلطيف العبارة إلى مجرد السماح.
- source_word: πνεῦμα κατανύξεως
  choice: روح تبلُّد
  rationale: ينقل معنى الخَدَر وفتور الإدراك وانعدام الاستجابة الذي تدل عليه κατάνυξις، بعبارة عربية مفهومة، مع إثبات البديل المتأثر بخلفية إشعياء في الحاشية.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: عيونًا لا تبصر
  rationale: يحافظ على الإيقاع الاقتباسي الموجز وعلى دلالة عدم الإبصار، من غير حسم زائد لما قد تفيده صيغة τοῦ μὴ مع المصدر من غاية أو نتيجة.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: آذانًا لا تسمع
  rationale: يوازي العبارة السابقة ويحافظ على المعنى الأساسي للفعل ἀκούω وعلى الصياغة الكتابية الموجزة.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: إلى هذا اليوم
  rationale: تعبير عربي طبيعي ورصين يدل على استمرار الحال حتى يوم المتكلم، ويعكس العبارة اليونانية مباشرة.
theological_decisions:
- issue: فاعلية الله في التبلُّد أو عدم الإحساس القضائي
  choice: أعطاهم الله روح تبلُّد
  alternative: سمح الله بأن يكون فيهم روح تبلُّد
  rationale: النص اليوناني يسمّي الله صراحة فاعل Ἔδωκεν؛ لذلك تُحفظ العبارة المباشرة من غير تحويلها إلى مجرد سماح، مع عدم إضافة بناء عقائدي يتجاوز ألفاظ بولس.
- issue: 'دلالة τοῦ μὴ مع المصدر: الغاية أو النتيجة'
  choice: عيونًا لا تبصر، وآذانًا لا تسمع
  alternative: عيونًا لكي لا تبصر، وآذانًا لكي لا تسمع
  rationale: الصياغة المختارة تحفظ إيجاز الاقتباس ولا تحسم وحدها ما إذا كان التركيب يدل هنا على الغاية أو النتيجة، فتُبقي قدرًا من الغموض الموجود في الأسلوب اليوناني.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ورصينة، مع إيقاع اقتباسي موجز. استُخدم «تبَلُّد» بدل ألفاظ أقل تداولًا مثل «الذهول» أو «الخمول»، وأُبقي «سبات عميق» في الحاشية لصلته بخلفية إشعياء.
