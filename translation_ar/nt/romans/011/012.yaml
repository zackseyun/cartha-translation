  to: وإن كان تعدّيهم غِنىً للعالم، ونقصانهم[a] غِنىً للأمم، فكم بالأحرى يكون اكتمالهم[b]؟
  rationale: استُبدلت «مِلؤهم» بـ«اكتمالهم» لتحسين الوضوح في العربية الفصحى المعاصرة مع إبقاء πλήρωμα غير مفسَّرة على نحو يحسم هل المقصود العدد أو الإدخال أو الاستعادة. وأُبقيت الحواشي ومواقعها العربية بما يطابق الألفاظ اليونانية التي تشرحها.
