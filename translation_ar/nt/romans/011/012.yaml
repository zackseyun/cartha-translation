  - severity: low
    issue: موضع علامة الحاشية a في النص الإنجليزي المرفق لا يطابق موضوع حاشيتها، بينما موضعها في المسودة العربية صحيح.
    rationale: الحاشية أ تشرح ἥττημα، ولذلك ينبغي أن تبقى ملحقة بـ«نقصانهم»، لا بـ«العالم». لا يلزم نقل هذا الخلل إلى العربية.
