source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: ar
  text: وإن كان تعدّيهم غِنىً للعالم، ونقصانهم[a] غِنىً للأمم، فكم بالأحرى يكون اكتمالهم[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خسارتهم» أو «هزيمتهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عددهم الكامل» أو «دخولهم الكامل».'
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: تعدّيهم
  rationale: ينقل المعنى الأخلاقي للزلة أو المخالفة في السياق، من غير أن يحدده بأنه فشل محض.
- source_word: πλοῦτος
  choice: غِنًى
  rationale: يحافظ على استعارة الغنى بوصفه وفرةً في البركة، كما يكررها النص اليوناني في شطري المقابلة.
- source_word: κόσμου
  choice: العالم
  rationale: مقابل طبيعي وواسع لـ κόσμος، ويشمل العالم الذي انتفع من تعدّيهم من غير تضييق المرجع.
- source_word: ἥττημα
  choice: نقصانهم
  rationale: يحافظ على دلالة الخسارة أو التناقص في هذه اللفظة النادرة، ويناسب مقابلتها اللاحقة بالمِلء؛ وتُذكر البدائل الممكنة في الحاشية.
- source_word: ἐθνῶν
  choice: الأمم
  rationale: هو المقابل العربي المألوف لـ ἔθνη في سياق المقابلة بين إسرائيل وسائر الشعوب، ولا يحصر اللفظة في معنى سياسي حديث.
- source_word: πόσῳ μᾶλλον
  choice: فكم بالأحرى
  rationale: تعبير عربي طبيعي ينقل حجة القياس بالأولى الواردة في العبارة اليونانية.
- source_word: πλήρωμα
  choice: مِلؤهم
  rationale: يحافظ على سعة πλήρωμα وغموضها المقصود، فلا يحسم هل المراد العدد الكامل أم الإدخال الكامل أم بلوغ حالة الاكتمال.
theological_decisions:
- issue: مرجع ودلالة «مِلؤهم» (τὸ πλήρωμα αὐτῶν)
  choice: الإبقاء على التعبير الواسع «مِلؤهم» من غير تفسير زائد
  alternative: عددهم الكامل، أو دخولهم الكامل، أو اكتمالهم/ردّهم
  rationale: العبارة اليونانية موجزة وتحتمل جوانب كمية وكيفية وأخروية؛ وتحديد واحد منها في المتن يحسم مسألة لاهوتية لا يحسمها هذا العدد نفسه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي بين «غِنًى للعالم» و«غِنًى للأمم»، كما حُفظ الإيجاز في الجملة الختامية من غير إضافة فعل تفسيري غير موجود صراحةً في اليونانية.
