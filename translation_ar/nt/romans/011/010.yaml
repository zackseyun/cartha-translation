  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: ar
  text: لِتُعَتَّمْ عيونُهم[a] حتى لا يُبصروا، واحْنِ ظهورَهم على الدوام[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِتُعْمَ عيونُهم». يقول اليوناني حرفيًا: «لِتُعَتَّمْ»، محافظًا على صورة الظلمة في النص المقتبس.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «دائمًا». تفيد العبارة الاستمرار أو الدوام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: لِتُعَتَّمْ
  rationale: صيغة طلبية مبنية للمجهول تحفظ صورة الإظلام في اليونانية، ولا تستبدلها مباشرة بتفسير العمى.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: عيونُهم
  rationale: نقل مباشر وواضح يحافظ على الصورة الجسدية المحورية في العبارة.
- source_word: τοῦ μὴ βλέπειν
  choice: حتى لا يُبصروا
  rationale: ينقل تركيب المصدر المنفي بما يتيح دلالة الغاية أو النتيجة من غير حسم إحداهما على حساب الأخرى.
- source_word: τὸν νῶτον
  choice: ظهورَهم
  rationale: استُعمل الجمع في العربية على نحو توزيعي طبيعي مع ضمير الجمع، مع بقاء صورة الظهر الجسدية.
- source_word: διὰ παντός
  choice: على الدوام
  rationale: يفيد الاستمرار والثبات من غير أن يفرض معنى «إلى الأبد» الأقوى.
- source_word: σύγκαμψον
  choice: واحْنِ
  rationale: فعل أمر مباشر يحفظ المخاطبة والقوة الطلبية، ويلائم المفعول «ظهورهم» ويحافظ على صورة الانحناء.
theological_decisions:
- issue: الاقتباس الدعائي ودور الفاعل الإلهي
  choice: 'الإبقاء على القوة الطلبية: «لِتُعَتَّمْ... واحْنِ»'
  alternative: صياغتها خبرًا تنبؤيًا، أو عرضها كنتيجة غير شخصية
  rationale: يحفظ النص صيغة الابتهال القضائي في الاقتباس ولا يخففها إلى مجرد تنبؤ، من غير إضافة تفسير لاهوتي غير مصرح به.
- issue: دلالة τοῦ μὴ βλέπειν بين الغاية والنتيجة
  choice: «حتى لا يُبصروا»
  alternative: «فلا يُبصروا» أو «كيلا يُبصروا»
  rationale: «حتى» في هذا السياق تستوعب تداخل الغاية والنتيجة، فتحفظ مقدارًا من غموض التركيب اليوناني بدل حسمه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي بين الطلبين وصورة الإظلام والانحناء، واستُخدم جمع «ظهورهم» لأنه الأفصح طبيعيًا مع جماعة في العربية.
