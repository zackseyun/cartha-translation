lexical_decisions:
- source_word: τί οὖν
  choice: فماذا إذن؟
  rationale: صيغة استفهامية استنتاجية مألوفة عند بولس، وتحفظ قوتها البلاغية بلغة عربية طبيعية.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: ما يسعى إليه إسرائيل
  rationale: ينقل معنى الطلب الجاد والمستمر، مع إبقاء «إسرائيل» اسمًا جمعيًا كما في السياق.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: لم ينل
  rationale: الفعل يدل هنا على بلوغ الشيء المطلوب أو نيله؛ و«ينل» موجز وطبيعي، مع تكراره في الجملة المقابلة.
- source_word: ἡ δὲ ἐκλογὴ
  choice: أمّا المختارون
  rationale: الاسم المفرد «الاختيار» يُستعمل هنا على الأرجح للدلالة مجازًا على جماعة المختارين، بدليل مقابلتهم بـ«الباقين».
- source_word: οἱ δὲ λοιποὶ
  choice: والباقون
  rationale: يحفظ المقابلة بين الجماعة المختارة وسائر أفراد إسرائيل المقصودين في السياق.
- source_word: ἐπωρώθησαν
  choice: قُسِّيت قلوبهم
  rationale: يعبر عن التبلد والقساوة الروحية تعبيرًا عربيًا واضحًا؛ وقد أضيفت «قلوبهم» لتوضيح المجاز دون تعيين فاعل التَقسية.
theological_decisions:
- issue: دلالة ἡ ἐκλογὴ
  choice: المختارون، أي الأشخاص الذين وقع عليهم الاختيار
  alternative: الاختيار
  rationale: المقابلة مع «الباقين» ترجح أن المراد جماعة من الناس، لكن البديل الحرفي جدير بالتنبيه لأنه يحفظ صيغة الاسم المجرّد في اليونانية.
- issue: الفاعل في ἐπωρώθησαν
  choice: 'صيغة المبني للمجهول: قُسِّيت قلوبهم'
  alternative: قسّى الله قلوبهم / قسّوا هم قلوبهم
  rationale: النص اليوناني لا يصرّح بالفاعل؛ لذلك لا تُحسم هنا العلاقة بين القضاء الإلهي والمسؤولية البشرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «المختارون» بدل «الاختيار» لسلامة الدلالة في السياق، وحُفظ المبني للمجهول في العبارة الأخيرة كي لا يُضاف فاعل لم يصرّح به الأصل.
