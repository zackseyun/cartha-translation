id: ROM.11.22
reference: Romans 11:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: ar
  text: 'فتأمّل إذن لطف الله[a] وشدّته: أمّا الشدّة فعلى الذين سقطوا، وأمّا لطف الله فعليك، إن استمررتَ في لطفه؛ وإلّا فستُقطع أنت أيضًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إحسان الله». فاللفظ اليوناني قد يدل على اللطف أو الصلاح أو الإحسان؛ واختير «لطف» لإبراز التقابل العلائقي مع «الشدّة».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «فستُفصل». والمعنى الحرفي للفعل هو القطع، وهو يلائم صورة غصن الزيتونة في سياق الكلام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: فتأمّل
  rationale: فعل أمر يدعو المخاطب إلى النظر المتدبّر؛ و«تأمّل» ينقل هذه القوة الحثّية بوضوح وطبيعية في العربية المعاصرة.
- source_word: χρηστότητα / χρηστότης
  choice: لطف
  rationale: يدل اللفظ هنا على إحسان الله ورأفته في معاملته؛ و«لطف» يحافظ على البعد العلائقي وعلى التقابل مع «الشدّة».
- source_word: ἀποτομίαν / ἀποτομία
  choice: شدّة
  rationale: يفيد الحزم القاطع في الدينونة. و«شدّة» مقابل عربي واضح وطبيعي، من غير مبالغة في معنى اللفظ.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: أمّا الشدّة فعلى الذين سقطوا
  rationale: تحافظ «على» على اتجاه الشدّة نحو من سقطوا، وتؤدي صيغة «أمّا... وأمّا...» التقابل التوزيعي في اليونانية.
- source_word: ἐπὶ δὲ σὲ
  choice: وأمّا لطف الله فعليك
  rationale: تحافظ الصياغة على التوازي مع العبارة السابقة وعلى توجيه لطف الله إلى المخاطب المفرد.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: إن استمررتَ في لطفه
  rationale: تنقل «استمررت» معنى المداومة، وتفيد «في لطفه» الاستمرار ضمن نطاق لطف الله، مع إظهار مرجع الضمير الواضح من السياق.
- source_word: ἐπεὶ
  choice: وإلّا
  rationale: يُدخل اللفظ هنا النتيجة السلبية المترتبة على عدم تحقق الشرط، ولذلك تؤدي «وإلّا» منطق التحذير بصورة طبيعية.
- source_word: ἐκκοπήσῃ
  choice: فستُقطع
  rationale: ينقل المبني للمجهول المستقبلي المعنى الحرفي للفعل، ويناسب أيضًا صورة أغصان الزيتونة في السياق.
theological_decisions:
- issue: التحذير المشروط وعلاقته بلطف الله ودينونته
  choice: 'الإبقاء على الشرط والتحذير بصورتهما المباشرة: «إن استمررتَ في لطفه؛ وإلّا فستُقطع أنت أيضًا».'
  alternative: تخفيف التحذير بجعله افتراضًا بلاغيًا محضًا، أو صياغته بما يحسم مسبقًا الخلاف حول الثبات والارتداد أو حول كون الخطاب فرديًا أم جماعيًا.
  rationale: النص اليوناني يقدّم شرطًا وتحذيرًا حقيقيين، لكنه لا يحسم في هذه الآية وحدها النقاشات العقائدية اللاحقة؛ لذلك تحفظ الترجمة التوتر اللاهوتي من غير استيراد موقف طائفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم خطاب المفرد المذكر تبعًا لصيغة اليونانية، وحُفظ التقابل البلاغي بين «الشدّة» و«اللطف» بواسطة «أمّا... وأمّا...»، مع إبقاء التحذير الشرطي من دون تفسير مذهبي زائد.
