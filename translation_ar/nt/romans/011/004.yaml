id: ROM.11.4
reference: Romans 11:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: ar
  text: لكن ماذا يقول له جواب الله[a]؟ «أبقيتُ لنفسي[b] سبعة آلاف رجل، لم يحنوا ركبةً للبعل».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الجواب الإلهي» أو «الوحي».
    reason: lexical_alternative
  - marker: b
    text: أو «احتفظتُ لنفسي».
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: جواب الله
  rationale: يدل الاسم في هذا السياق على جواب صادر من الله بسلطان إلى إيليا. وهذه الصياغة واضحة وطبيعية، مع بقاء بديل «الوحي» ممكنًا.
- source_word: Κατέλιπον
  choice: أبقيتُ
  rationale: ينقل الفعل عملًا تمّ ونتيجته باقية، أي إن الله أبقى لنفسه بقية. و«أبقيتُ» أقرب إلى اللفظ اليوناني وأوضح من تعبيرات قد توحي بمجرد الحفظ من الخطر.
- source_word: ἐμαυτῷ
  choice: لنفسي
  rationale: ينقل ضمير الانعكاس في صيغة الداتيف مباشرة، مبينًا أن الله أبقى هؤلاء لنفسه.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: سبعة آلاف رجل
  rationale: يحافظ على العدد وعلى الاسم اليوناني المذكر الصريح ἄνδρας من غير تحويله إلى لفظ عام مثل «شخص».
- source_word: οἵτινες
  choice: لم يحنوا
  rationale: تؤدي الجملة الوصفية وظيفة الموصول في العربية من غير حاجة إلى إثقال العبارة بموصول صريح بعد «رجل» المستعمل تمييزًا للعدد.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: لم يحنوا ركبةً
  rationale: يحافظ على صورة حني الركبة الدالة على الخضوع التعبدي، كما يحافظ على إفراد «ركبة» بحسب التعبير اليوناني.
- source_word: τῇ Βάαλ
  choice: للبعل
  rationale: «البعل» هو الاسم العربي المألوف لهذا المعبود، وحرف اللام ينقل جهة الخضوع أو العبادة في العبارة.
theological_decisions:
- issue: التصريح بأن مصدر الجواب هو الله
  choice: جواب الله
  alternative: الجواب؛ الوحي
  rationale: السياق واقتباس سفر الملوك يبينان أن المتكلم هو الله، ولفظ χρηματισμός يحمل معنى الجواب الإلهي ذي السلطان. لا تضيف الصياغة مضمونًا عقائديًا خارج النص.
- issue: تحديد جنس المذكورين في ἄνδρας
  choice: رجال
  alternative: أشخاص؛ أناس
  rationale: النص اليوناني يستعمل اسمًا مذكرًا صريحًا، ولذلك حُفظ هذا التحديد بدل تعميمه.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «جواب الله» بدل المصطلح الأقل تداولًا «قول الوحي»، وحُفظت صورة حني الركبة والتذكير الصريح في «رجل».
