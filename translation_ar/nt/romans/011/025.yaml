id: ROM.11.25
reference: Romans 11:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: ar
  text: 'فإني لا أريدكم أن تجهلوا، أيها الإخوة[a]، هذا السر، لئلا تكونوا حكماء في أعين أنفسكم: إن تصلّبًا جزئيًا قد أصاب إسرائيل إلى أن يدخل ملء الأمم[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فاللفظ اليوناني يقول «الإخوة»، وقد يُخاطَب به جمع يضم الرجال والنساء.
    reason: lexical_alternative
  - marker: b
    text: 'أي غير اليهود. ويمكن أن تعني العبارة: «العدد الكامل من غير اليهود».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: أن تجهلوا
  rationale: تعبير عربي فصيح وطبيعي لصيغة بولس التي تعني ألا يبقى المخاطبون غير عالمين بالأمر، من غير إيحاء قدحي مقصود.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ صيغة النداء المذكرة في اليونانية، مع بيان إمكان شمولها المؤمنات في الحاشية.
- source_word: μυστήριον
  choice: السر
  rationale: يدل في السياق البولسي على قصد إلهي كان خفيًا ثم كُشف، وهو أوضح للقارئ العربي من لفظ قد يوحي بلغز عصي على الفهم.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: لئلا تكونوا حكماء في أعين أنفسكم
  rationale: يحفظ غرض العبارة وصورتها، وينقل التحذير من الاعتداد بالحكمة الذاتية دون تفسير زائد.
- source_word: πώρωσις
  choice: قساوة
  rationale: تنقل معنى التبلد أو التصلب الروحي في هذا السياق، بصياغة عربية مألوفة كتابيًا وواضحة.
- source_word: ἀπὸ μέρους
  choice: جزئيًا
  rationale: يبقي العبارة متعلقة بمدى القساوة، ولا يحسمها على أنها قيد زمني.
- source_word: τῷ Ἰσραὴλ γέγονεν
  choice: قد أصابت إسرائيل
  rationale: ينقل تمام الفعل اليوناني بوصفه حالة نتجت عن وقوع سابق وما زال أثرها قائمًا، بصياغة عربية طبيعية.
- source_word: πλήρωμα
  choice: ملء
  rationale: يحفظ الاتساع الدلالي للفظ اليوناني ولا يحسم هل المقصود العدد الكامل أم الاكتمال أو الشمول.
- source_word: τῶν ἐθνῶν
  choice: الأمم
  rationale: في المقابلة مع إسرائيل يشير اللفظ إلى غير اليهود، و«الأمم» يحفظ التعبير المصدرّي الشائع مع إيضاح المقصود في الحاشية.
- source_word: εἰσέλθῃ
  choice: يدخل
  rationale: ينقل فعل الدخول عند الحد الذي تشير إليه «إلى أن»، من غير إضافة وجهة غير مذكورة في النص.
theological_decisions:
- issue: معنى «ملء الأمم»
  choice: الإبقاء على «ملء الأمم» دون تحديد المراد
  alternative: العدد الكامل من غير اليهود
  rationale: العبارة محل نقاش لاهوتي، وقد تعني العدد الكامل أو تمام الدخول أو اكتماله؛ لذلك تُحفظ سعتها في المتن ويُذكر بديل شائع في الحاشية.
- issue: نطاق خطاب «الإخوة»
  choice: الإبقاء على «أيها الإخوة»
  alternative: أيها الإخوة والأخوات
  rationale: الصيغة اليونانية مذكرة جمعًا، لكنها قد تخاطب جماعة مختلطة؛ فحُفظ شكلها في المتن وذُكر شمولها المحتمل في الحاشية.
- issue: مدى قساوة إسرائيل
  choice: «أصابت إسرائيل جزئيًا»
  alternative: «أصابت قسمًا من إسرائيل»
  rationale: يحفظ النص كون القساوة جزئية، من غير الجزم هل الجزئية تصف أفراد إسرائيل تحديدًا أم مدى الحالة على نحو أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت بنية الحجة وعلامة النقطتين، وتُركت العبارات المختلف في تفسيرها، ولا سيما «ملء الأمم» و«جزئيًا»، دون حسم تفسيري.
