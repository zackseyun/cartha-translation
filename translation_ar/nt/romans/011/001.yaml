  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: ar
  text: 'فأقول: هل رفض الله شعبه؟ حاشا! فإني أنا أيضًا إسرائيلي، من نسل إبراهيم، من سبط بنيامين.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω οὖν
  choice: فأقول
  rationale: ينقل فعل القول مع قوة الاستنتاج في οὖν، ويمهّد طبيعيًا للسؤال البلاغي من غير تحويله صراحةً إلى «أسأل».
- source_word: μὴ ἀπώσατο
  choice: هل رفض
  rationale: الفعل يدل على الدفع بعيدًا أو الرفض، وصيغة السؤال تتوقع جوابًا بالنفي. «رفض» واضحة وفصيحة وتحافظ على عدم تحديد ما إذا كان الرفض نهائيًا أو كليًا.
- source_word: τὸν λαὸν αὐτοῦ
  choice: شعبه
  rationale: تحافظ على معنى λαός وعلى ضمير الملكية ذي الدلالة العهدية دون توسع تفسيري.
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: تعبير عربي قوي وموجز للإنكار الشديد، أنسب من جواب بسيط مثل «كلا».
- source_word: καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί
  choice: فأنا أيضًا إسرائيلي
  rationale: الفاء تنقل تعليل γάρ، و«أيضًا» تعكس καί مع إبراز بولس نفسه بوصفه شاهدًا على نفي السؤال.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: من نسل إبراهيم
  rationale: «نسل» المقابل العربي الطبيعي لـσπέρμα في سياق النسب، ويحفظ المعنى الجمعي والسلالي دون غرابة «بذرة» الحرفية.
- source_word: φυλῆς Βενιαμίν
  choice: من سبط بنيامين
  rationale: «سبط» هو المقابل العربي المألوف والدقيق للقبيلة الإسرائيلية في هذا السياق النسبي.
theological_decisions:
- issue: هل يدل السؤال على رفض كامل أو نهائي لإسرائيل؟
  choice: هل رفض الله شعبه؟
  alternative: هل رفض الله شعبه نهائيًا؟ / هل نبذ الله شعبه تمامًا؟
  rationale: لا يتضمن النص اليوناني قيدًا بمعنى «نهائيًا» أو «تمامًا»، لذلك تُترك حدود السؤال للسياق اللاحق ولا يُحسم التوتر اللاهوتي داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «حاشا» لقوة النفي البولسي، و«سبط» للمصطلح النسبي الإسرائيلي المألوف. لا تستلزم الآية حاشية لأن البدائل المعجمية لا تضيف غموضًا جوهريًا يحتاجه القارئ هنا.
