  source_fidelity: 'النص العربي ينقل البنية الشرطية والاستفهامية البلاغية في اليونانية بأمانة: «رفضهم» لـἀποβολή، و«مصالحة للعالم» لـκαταλλαγὴ κόσμου، و«قبولهم» لـπρόσλημψις، و«حياة من بين الأموات» لـζωὴ ἐκ νεκρῶν. كما أن «إلا» تؤدي بصورة طبيعية قوة εἰ μὴ في هذا السؤال البلاغي، و«فإن» تحافظ على الصلة التعليلية لـγάρ.'
