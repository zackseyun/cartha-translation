  terminology: «مصالحة» مصطلح بولسي عربي راسخ ومناسب. ويحافظ «العالم» على اتساع κόσμος من غير تضييق تفسيري. وعبارة «حياة من بين الأموات» مألوفة كتابيًا وتحفظ الإيحاء المقصود بلا فرض قراءة لاهوتية بعينها.
