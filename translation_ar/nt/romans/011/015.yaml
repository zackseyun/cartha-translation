id: ROM.11.15
reference: Romans 11:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: ar
  text: فإن كان رفضهم مصالحةً للعالم، فماذا يكون قبولهم[a] إلا حياةً من بين الأموات[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استقبالهم». يقابل اللفظ اليوناني «رفضهم»، ويمكن أن يدل على قبولهم أو استقبالهم من جديد.'
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «حياة من بين الأموات» مجازًا إلى تجدد روحي عظيم، أو بصورة أخص إلى القيامة؛ وقد أبقاها بولس موجزة وموحية.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: رفضهم
  rationale: ينقل معنى الإقصاء أو عدم القبول في هذا السياق، ويقيم مقابلة عربية واضحة مع «قبولهم» من غير حسمٍ زائد لطبيعة هذا الرفض.
- source_word: καταλλαγὴ
  choice: مصالحةً
  rationale: يحفظ المصطلح البولسي الدال على استعادة العلاقة، بصياغة عربية موجزة ومألوفة.
- source_word: κόσμου
  choice: للعالم
  rationale: يبقي مدلول اللفظ واسعًا كما في اليونانية، من غير قصره في المتن على الأمم، وإن كان السياق يشملهم.
- source_word: πρόσλημψις
  choice: قبولهم
  rationale: يعبّر طبيعيًا عن المقابلة مع «رفضهم»، مع إمكان أن يفيد اللفظ اليوناني استقبالهم أو قبولهم من جديد.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: حياةً من بين الأموات
  rationale: ترجمة قريبة وطبيعية تحفظ العبارة المكثفة وإيحاءها بالقيامة أو بالتجدد العظيم، من غير تعيين أحد المعنيين.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تؤدي في السؤال البلاغي معنى الجواب المؤكد المتوقع، وهي أفصح وأطبع هنا من الترجمة الحرفية «إن لم يكن».
- source_word: γὰρ
  choice: فإن
  rationale: تحفظ الصلة التعليلية بما قبل الآية، وتنسجم مع جملة الشرط العربية.
theological_decisions:
- issue: دلالة «حياة من بين الأموات»
  choice: الإبقاء على العبارة مفتوحة الدلالة، بحيث يمكن أن تشير إلى تجدد روحي عظيم أو إلى القيامة.
  alternative: تفسيرها صراحةً بأنها نهضة روحية، أو بأنها القيامة النهائية وحدها.
  rationale: العبارة اليونانية موجزة وموحية ولا تحسم المقصود؛ لذلك ينبغي للترجمة أن تحفظ التوتر الأخروي بدل أن تزيله بالتفسير.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. استُخدمت المقابلة «رفضهم/قبولهم»، وأُبقيت عبارة «حياة من بين الأموات» بلا تفسير داخل المتن حفاظًا على غناها واحتمالها الدلالي.
