  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: ar
  text: 'فستقول إذًا: «كُسِرَت أغصانٌ لكي أُطعَّم أنا»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي يتم تطعيمي أنا».'
    reason: توضح صياغة عربية بديلة للمبني للمجهول في ἐγκεντρισθῶ، مع بقاء المعنى الزراعي والتشديد على ضمير المتكلم.
lexical_decisions:
- source_word: ἐρεῖς
  choice: فستقول
  rationale: فعل مستقبل معلوم للمفرد المخاطب؛ يحافظ على صيغة المستقبل وعلى خطاب المحاوَر المفترض في سياق الحجاج.
- source_word: οὖν
  choice: إذًا
  rationale: أداة استنتاج وانتقال حجاجي، و«إذًا» طبيعية في العربية وتُظهر أن القول نتيجة لما سبق.
- source_word: Ἐξεκλάσθησαν
  choice: كُسِرَت
  rationale: فعل ماضٍ مبني للمجهول، ويحفظ صورة كسر الأغصان في استعارة شجرة الزيتون بدل تحويلها إلى تعبير تجريدي.
- source_word: κλάδοι
  choice: أغصانٌ
  rationale: ترجمة مباشرة للاسم في سياق شجرة الزيتون، مع إبقاء التنكير الموجود لغياب أداة التعريف في اليونانية.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي معنى الغاية أو النتيجة المقصودة في كلام المحاوَر من غير حسم زائد لطبيعة العلاقة المنطقية.
- source_word: ἐγὼ
  choice: أنا
  rationale: أُثبت الضمير المنفصل بعد الفعل المبني للمجهول لإبراز التشديد الذي يحمله الضمير الصريح في اليونانية.
- source_word: ἐγκεντρισθῶ
  choice: أُطعَّم
  rationale: صيغة مبنية للمجهول من مصطلح التطعيم الزراعي؛ وهي عربية حديثة واضحة وتحفظ استعارة إدخال غصن في الشجرة، من غير إضافة «بينها» غير الموجودة في الآية.
theological_decisions:
- issue: هل يُصرَّح بأن المتكلم محاوَر مفترض في حجاج بولس؟
  choice: 'الإبقاء على المخاطب المفرد المباشر: «فستقول»'
  alternative: «فقد يقول قائل» أو «قد تقول»
  rationale: النص اليوناني يقول حرفيًا بصيغة المستقبل للمخاطب «ستقول»؛ فلا تُضاف هوية تفسيرية للمتكلم.
- issue: هل تُعرض جملة الغاية بوصفها تقريرًا معتمدًا لمقصد إلهي؟
  choice: 'نقل قول المحاوَر كما هو: «لكي أُطعَّم أنا»'
  alternative: صياغتها بما يفيد أن الله كسر الأغصان عمدًا لهذا الغرض
  rationale: الآية تعرض استنتاج المحاوَر ضمن الاقتباس، ولا تذكر الفاعل ولا تستلزم أن بولس يقرّ هذا الاستنتاج بصيغته.
- issue: درجة التشديد على ضمير المتكلم
  choice: إظهار الضمير الصريح «أنا»
  alternative: الاكتفاء بـ«لكي أُطعَّم»
  rationale: وجود ἐγὼ صريحًا في اليونانية يحمل بروزًا تقابليًا ملائمًا لنبرة الافتخار التي يعالجها السياق، من غير إضافة لفظ تفسيري مثل «بالذات».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «التطعيم» بمعناه الزراعي الشائع، وحُفظ الإيجاز والحوار المباشر والاستعارة الأصلية.
