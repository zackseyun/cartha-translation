language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: ar
  text: 'وهكذا سيخلُص كل إسرائيل[a]، كما هو مكتوب: «سيأتي من صهيون المنقذ[c]، ويصرف الفجور عن يعقوب»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وعلى هذا النحو سيخلُص كل إسرائيل». والعبارة «كل إسرائيل» موضع خلاف في التفسير؛ لذلك تُركت كما هي من غير تحديد هل يُراد بها إسرائيل بحسب النسب، أم البقية المؤمنة، أم شعب الله بكماله.'
    reason: lexical_alternative_and_interpretive_ambiguity
  - marker: b
    text: الاقتباس في هذه الآية يستند أساسًا إلى إشعياء 59:20، مع صياغة تقارب النص اليوناني للعهد القديم في مواضع وتختلف عن بعض صيغ النص العبري. أمّا صدى إشعياء 59:21 و27:9 فيظهر بوضوح في الآية التالية.
    reason: source_citation
  - marker: c
    text: 'حرفيًا: «خارجًا من صهيون» أو «من صهيون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تنقل معنى الكيفية أو الطريقة في السياق، مع إبقاء احتمال ترجمتها «وعلى هذا النحو» مذكورًا في الحاشية من غير حسم زائد.
- source_word: πᾶς Ἰσραήλ
  choice: كلُّ إسرائيل
  rationale: صياغة عربية طبيعية تحفظ العبارة اليونانية وانفتاحها التفسيري، من غير تحديد المقصود بإسرائيل داخل المتن.
- source_word: σωθήσεται
  choice: سيخلُص
  rationale: يحفظ الدلالة الخلاصية للفعل المبني للمجهول في استعمال بولس، وهو أوجز وأفصح هنا من «سيتم خلاصه».
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة وأمينة لعبارة الاستشهاد الكتابي.
- source_word: Ἥξει
  choice: سيأتي
  rationale: المقابل الطبيعي الملائم لأسلوب النبوة والاستشهاد.
- source_word: ἐκ Σιὼν
  choice: من صهيون
  rationale: ينقل حرف الجر ἐκ بصورة عربية طبيعية، مع إمكان فهمه بمعنى الخروج من صهيون.
- source_word: ὁ ῥυόμενος
  choice: المنقذ
  rationale: ينقل اسم الفاعل المعرّف بوصف لقبي موجز وذي وقع مناسب لسياق الاقتباس.
- source_word: ἀποστρέψει
  choice: سيُبعِد
  rationale: يفيد جعل الفجور منصرفًا عن يعقوب ويحافظ على البنية التي تجعل «الفجور» مفعولًا، من غير تحويلها إلى توبة يعقوب عن الفجور.
- source_word: ἀσεβείας
  choice: الفجور
  rationale: لفظ واضح يجمع البعد الديني والأخلاقي للفظ اليوناني في العربية الكتابية المعاصرة.
- source_word: ἀπὸ Ἰακώβ
  choice: عن يعقوب
  rationale: «عن» تلائم فعل الإبعاد في العربية وتحفظ اسم يعقوب كما ورد في الاقتباس من غير استبداله بإسرائيل.
theological_decisions:
- issue: مدلول «كل إسرائيل»
  choice: الإبقاء على «كل إسرائيل» بلا شرح داخل المتن
  alternative: تحديدها بمجموع إسرائيل العرقي، أو البقية المؤمنة، أو شعب الله الكامل
  rationale: العبارة موضع خلاف تفسيري، والنص اليوناني لا يحسم أحد هذه التحديدات في العبارة نفسها؛ لذلك تُحفظ دلالتها المفتوحة.
- issue: العلاقة المنطقية التي تفيدها οὕτως
  choice: «وهكذا» مع بيان احتمال «وعلى هذا النحو» في الحاشية
  alternative: «وعندئذ» بوصفها ترتيبًا زمنيًا صرفًا
  rationale: اللفظ يدل أساسًا على الكيفية، ولا ينبغي أن تفرض الترجمة مخططًا زمنيًا أو لاهوتيًا غير مصرّح به.
- issue: هوية «المنقذ»
  choice: ترجمة وصفية لقبية بلا إضافة تفسيرية
  alternative: التصريح في المتن بأنه المسيح
  rationale: السياق البولسي يسمح بالقراءة المسيانية، لكن الاقتباس نفسه يقول «المنقذ»؛ لذا لا تُضاف الهوية صراحة إلى المتن.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. استُعمل «سيخلُص» للدلالة الخلاصية، و«المنقذ» بوصف لقبي طبيعي. وُضعت علامات الحواشي [a] و[c] و[b] جميعها في المتن، مع جمع القضايا المتصلة لتجنب إثقال الآية.
