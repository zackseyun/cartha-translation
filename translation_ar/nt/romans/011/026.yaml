  source_fidelity: 'المتن أمين للنص اليوناني: «وهكذا» تحافظ على دلالة οὕτως الكيفية، و«كل إسرائيل» لا تضيّق مدلوله المختلف عليه، و«سيخلُص» ينقل الدلالة الخلاصية لـ σωθήσεται. كما أن «من صهيون»، و«المنقذ»، و«عن يعقوب» توافق ألفاظ الاقتباس. يُستحسن «يصرف» بدل «سيُبعِد» لأنه المقابل العربي الأقرب والأكثر سلاسة لصورة ἀποστρέψει في هذا التركيب.'
