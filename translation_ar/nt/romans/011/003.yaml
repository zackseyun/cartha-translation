  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: ar
  text: «يا رب، قتلوا أنبياءك، وهدموا مذابحك، وبقيت أنا وحدي، وهم يطلبون حياتي[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يطلبون نفسي»؛ والمقصود أنهم يسعون إلى قتلي.'
    reason: بيان البديل الحرفي وشرح التعبير الاصطلاحي اليوناني.
lexical_decisions:
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء موجَّهة إلى الله؛ و«يا رب» هي المقابل العربي الطبيعي المألوف، من غير إدخال تمييز طباعي خاص بالعهد القديم.
- source_word: ἀπέκτειναν
  choice: قتلوا
  rationale: ينقل الفعل مباشرة من غير إضافة دلالة «الاغتيال» أو «القتل ظلمًا» التي لا يصرّح بها اللفظ نفسه.
- source_word: τὰ θυσιαστήριά σου
  choice: مذابحك
  rationale: «المذابح» هو المقابل العربي الواضح للمواضع المخصَّصة لتقديم الذبائح، ولا حاجة إلى زيادة تفسيرية.
- source_word: κατέσκαψαν
  choice: هدموا
  rationale: ينقل معنى التقويض والهدم في سياق المذابح بلغة عربية طبيعية ومحددة.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: وبقيت أنا وحدي
  rationale: يحفظ توكيد المتكلم وانفراده، ويؤدي معنى البقاء بعد الآخرين بأسلوب عربي واضح.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: وهم يطلبون حياتي
  rationale: «حياتي» تؤدي معنى ψυχή في صيغة التهديد هنا، أي السعي إلى قتله، مع الإبقاء على صورة «الطلب» القريبة من الأصل.
theological_decisions:
- issue: دلالة ψυχή في صيغة التهديد
  choice: حياتي
  alternative: نفسي
  rationale: السياق يتحدث عن السعي إلى قتل إيليا، لا عن تقرير يخص طبيعة النفس غير المادية. وتوضح الحاشية الصياغة الحرفية من غير تحميل العبارة قضية أنثروبولوجية لاهوتية غير مقصودة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ توازي الأفعال وتكرار العطف في الاقتباس، ووُضعت علامة الحاشية عند العبارة التي تشرحها.
