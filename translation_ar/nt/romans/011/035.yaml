lexical_decisions:
- source_word: ἢ
  choice: أَوْ
  rationale: تُدخل السؤال البلاغي التالي في السلسلة، وتحافظ على الربط الموجز في اليونانية.
- source_word: τίς
  choice: مَنْ
  rationale: اسم استفهام للعاقل، وهو المقابل العربي الطبيعي في هذا السؤال البلاغي.
- source_word: προέδωκεν
  choice: أَعْطَاهُ أَوَّلًا
  rationale: 'يحفظ معنى السبق في العطاء: أن يكون أحد قد أعطى الله قبلًا بحيث يستحق عوضًا منه.'
- source_word: αὐτῷ
  choice: ـهُ / إِلَيْهِ
  rationale: الضمير يعود إلى الله بحسب السياق، وقد أُبقي ضميرًا كما في اليونانية بدل التصريح باسم الله.
- source_word: καὶ
  choice: فَـ
  rationale: الفاء تُظهر في العربية الصلة الناتجة المقصودة بين الادعاء بالعطاء أولًا واستحقاق الرد، من غير أن تضيف مضمونًا غير حاضر في السؤال البلاغي.
- source_word: ἀνταποδοθήσεται
  choice: يُرَدَّ
  rationale: ينقل المبني للمجهول ومعنى ردّ المقابل أو الوفاء بالعوض، مع بقاء الشيء المردود غير مصرّح به كما في اليونانية.
theological_decisions:
- issue: مرجع الضمير αὐτῷ
  choice: الإبقاء على الضمير العائد إلى الله بحسب السياق
  alternative: التصريح بلفظ «الله»
  rationale: النص اليوناني يستعمل ضميرًا، ومرجعه واضح من السياق؛ لذلك يحفظ الضمير صيغة النص من غير إبهام جوهري.
- issue: دلالة السبق في προέδωκεν وعلاقة ذلك باستحقاق العوض من الله
  choice: «أَعْطَاهُ أَوَّلًا»
  alternative: «أَعْطَاهُ مِنْ قَبْلُ» أو حذف معنى السبق
  rationale: يحفظ التعبير دلالة الفعل المركب على العطاء السابق، من غير أن يحوّل الشرح اللاهوتي إلى جزء صريح من المتن.
- issue: العلاقة بين شطري السؤال
  choice: «فَيُرَدَّ إِلَيْهِ؟»
  alternative: «وَيُرَدَّ إِلَيْهِ؟»
  rationale: 'الفاء أوضح طبيعيًا في العربية في بيان النتيجة المفترضة: إن كان أحد قد أعطى الله أولًا، فهل يستحق أن يُرد إليه؟ وهي لا تحسم أكثر مما يقتضيه السياق البلاغي.'
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. استُعمل البناء للمجهول للمحافظة على صيغة الفعل اليوناني، ووُضعت علامتا الحاشية في المتن كما يلزم.
