id: ROM.11.17
reference: Romans 11:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: ar
  text: ولكن إن كُسِر بعضُ الأغصان، وأنت، مع أنك زيتونةٌ برية، طُعِّمتَ بينها[a]، وصرت شريكًا في الجذر وفي غِنى الزيتونة[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طُعِّمتَ بين تلك الأغصان».'
    reason: بديل يصرّح بمرجع الضمير αὐτοῖς، مع أن المتن يبقيه موجزًا كما في اليونانية.
  - marker: b
    text: 'أو: «وصرت شريكًا في جذر الزيتونة وغناها»، أو: «في جذر الزيتونة الغني». ويمكن ترجمة «غِنى» حرفيًا بـ«دَسَم».'
    reason: تتابع الإضافات اليوناني يسمح بربطٍ مختلف بين الجذر والغنى والزيتونة؛ والحاشية تعرض البدائل من غير حسمٍ تفسيري في المتن.
lexical_decisions:
- source_word: Εἰ δέ
  choice: ولكن إن كان
  rationale: تنقل أداة الشرط مع الاستدراك الخفيف، وتلائم كون الآية جزءًا من جملة ممتدة.
- source_word: τινες τῶν κλάδων
  choice: بعضُ الأغصان
  rationale: تحافظ على معنى البعضية في التركيب اليوناني، لا على أغصان غير محددة فحسب.
- source_word: ἐξεκλάσθησαν
  choice: قد كُسِر
  rationale: الفعل مبني للمجهول ويصف كسر الأغصان وإزالتها ضمن صورة الشجرة؛ والإفراد في العربية لمراعاة فاعل غير العاقل الجمع.
- source_word: ἀγριέλαιος ὢν
  choice: مع أنك زيتونةٌ برية
  rationale: يفيد اسم الفاعل معنى الحال ذي الدلالة التنازلية هنا، وتُبقي الصياغة صورة الزيتونة البرية من غير تحويلها إلى تفسير عن الأمم.
- source_word: ἐνεκεντρίσθης
  choice: قد طُعِّمت
  rationale: مصطلح بستاني دقيق لتطعيم غصن في شجرة، وهو مبني للمجهول كما في اليونانية.
- source_word: ἐν αὐτοῖς
  choice: بينها
  rationale: الضمير يعود على الأغصان الباقية على الأرجح، و«بينها» موجزة وطبيعية وتحفظ مرجع الضمير.
- source_word: συγκοινωνὸς
  choice: شريكًا معها
  rationale: ينقل معنى الاشتراك مع آخرين، لا مجرد الانتفاع الفردي؛ وأُضيف «معها» لإظهار دلالة المشاركة الكامنة في السابقة اليونانية συν-.
- source_word: τῆς ῥίζης
  choice: في الأصل
  rationale: تجعل مجال المشاركة مفهومًا في العربية مع إبقاء استعارة الشجرة.
- source_word: τῆς πιότητος
  choice: في غِنى
  rationale: «الغِنى» ينقل معنى الدسم والخصب والوفرة المغذية بلغة عربية معاصرة، من غير حصره في الشحم الحرفي.
- source_word: τῆς ἐλαίας
  choice: الزيتونة
  rationale: تربط الغنى بالشجرة المزروعة المذكورة في الصورة، ولفظ «الزيتونة» في العربية يدل طبيعيًا على الشجرة.
- source_word: ἐγένου
  choice: وصرت
  rationale: ينقل الدخول في حالة جديدة الذي يدل عليه الماضي اليوناني.
theological_decisions:
- issue: هوية الزيتونة البرية في الاستعارة
  choice: إبقاء التعبير «زيتونة برية» حرفيًا داخل صورة التطعيم.
  alternative: تفسيرها في المتن بأنها شخص من الأمم أو جعلها صراحة غصن زيتون بري.
  rationale: يعتمد الاستدلال على الصورة البستانية وعلاقتها بإسرائيل والأمم؛ لذلك لا ينبغي للترجمة أن تستبدل الصورة بتحديد لاهوتي تفسيري.
- issue: العلاقة النحوية بين الأصل وغِنى الزيتونة
  choice: «في الأصل، في غِنى الزيتونة» مع بيان البدائل في الحاشية.
  alternative: «في أصل الزيتونة الغني» أو «في أصل الزيتونة وغناها».
  rationale: تتابع المضافات في اليونانية مكثف ويحتمل أكثر من تحليل؛ فتحافظ الصياغة على التوتر بين الأصل والغنى، ولا تحسمه بصمت في صفة واحدة أو بعطف صريح.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «طُعِّمت» بالمصطلح البستاني المألوف، وحُفظت صيغة المخاطب المفرد وصورة الزيتونة. تنتهي الآية بفاصلة لأنها مقدمة شرطية يستمر جوابها في السياق التالي.
