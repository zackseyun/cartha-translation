source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: ar
  text: فإن كنتَ أنت قد قُطِعتَ من شجرة زيتون برية بطبيعتها، وطُعِّمتَ، على خلاف الطبيعة، في شجرة زيتون مستزرعة، فكم بالأحرى سيُطعَّم هؤلاء، أي الأغصان الطبيعية[a]، في شجرة زيتونهم الخاصة![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «هؤلاء الذين بحسب الطبيعة»؛ ولفظ «الأغصان» مُقدَّر من صورة شجرة الزيتون في السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن بحسب السياق: «سيُطعَّمون من جديد في شجرة زيتونهم الخاصة». أمّا معنى «من جديد» فمفهوم ضمنًا وليس صريحًا في الفعل اليوناني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: قُطعت
  rationale: ينقل معنى القطع في الفعل ἐκκόπτω ويحافظ على صورة البستنة، من غير تحويله إلى «كُسرت» المتأثرة بسياق الأغصان في الآيات المجاورة.
- source_word: ἀγριελαίου
  choice: زيتونة برية
  rationale: تعبير عربي واضح عن شجرة الزيتون البرية، ويحافظ على مقابلتها بالزيتونة المزروعة.
- source_word: παρὰ φύσιν
  choice: على خلاف الطبيعة
  rationale: يحفظ التقابل البلاغي الصريح مع κατὰ φύσιν، وهو تعبير عربي فصيح ومفهوم.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: طُعِّمتَ / سيُطعَّم
  rationale: «طعَّم الشجر» هو التعبير البستاني العربي المألوف لإدخال غصن في شجرة أخرى، وصيغة المبني للمجهول تطابق اليونانية.
- source_word: καλλιέλαιον
  choice: زيتونة مزروعة
  rationale: يوضح أنها الزيتونة المستزرعة أو البستانية في مقابل الزيتونة البرية، ويتجنب التعبير التقييمي «زيتونة جيدة».
- source_word: πόσῳ μᾶλλον
  choice: فكم بالأحرى
  rationale: ينقل حجة القياس من باب الأولى بصياغة عربية طبيعية وموجزة.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: هؤلاء، أي الأغصان الطبيعية
  rationale: لفظ «الأغصان» مقدر من استعارة الزيتونة في السياق وليس مذكورًا صراحة في العبارة اليونانية؛ وإظهاره يجعل الصورة واضحة للقارئ العربي.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: في زيتونتهم الخاصة
  rationale: يحافظ على دلالة الانتماء المؤكدة في ἰδίᾳ وعلى اتجاه التطعيم إلى داخل الشجرة.
theological_decisions:
- issue: تعيين هوية «هؤلاء» صراحة
  choice: الإبقاء على «هؤلاء» ضمن استعارة الأغصان من غير إضافة «اليهود» أو «بني إسرائيل».
  alternative: هؤلاء اليهود / هؤلاء الإسرائيليون
  rationale: السياق يحدد المرجع، لكن الآية نفسها تستعمل اسم الإشارة ووصف «بحسب الطبيعة» ولا تذكر تسمية عرقية صريحة؛ لذلك تُحفظ صياغتها وتوترها اللاهوتي.
- issue: إضافة لفظ «الأغصان» غير المذكور صراحة
  choice: إضافته إيضاحًا في المتن مع حاشية تبين أنه مقدر من السياق.
  alternative: هؤلاء الذين بحسب الطبيعة
  rationale: استعارة التطعيم والسياق المباشر يجعلان «الأغصان» مفهومًا، وإظهاره يمنع غموضًا أسلوبيًا شديدًا في العربية من غير تغيير المرجع.
- issue: هل يُصرَّح بمعنى العودة في التطعيم
  choice: عدم إضافة «من جديد» أو «ثانيةً» إلى المتن.
  alternative: سيُطعَّمون من جديد في زيتونتهم الخاصة
  rationale: العودة مفهومة من سياق رومية 11، لكنها ليست جزءًا صريحًا من الفعل اليوناني في هذه الآية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «تطعيم» بوصفه المصطلح البستاني الطبيعي، وحُفظ خطاب المفرد في «كنتَ» و«طُعِّمتَ»، كما حُفظ التقابل بين «بحسب الطبيعة» و«على خلاف الطبيعة».
