  source_fidelity: المسودة تنقل بنية الحجة من باب الأولى وصورة القطع والتطعيم بأمانة عامة. لكن عبارة «زيتونة برية أنت منها بحسب الطبيعة» تجعل «بحسب الطبيعة» قابلة للتعلّق بالمخاطَب («أنت») بدل الزيتونة البرية، بينما العبارة اليونانية تصف الزيتونة بأنها برية بحسب الطبيعة.
  naturalness: الأسلوب فصيح ومفهوم، لكن إزالة هذا الالتباس، واستعمال «شجرة زيتون» حيث يلزم، يجعلان الصورة البستانية أوضح في العربية المعاصرة. و«أي الأغصان الطبيعية» مفهومة، لكنها تُصاغ بسلاسة أكبر مع الحفاظ على كون «الأغصان» إضافة تفسيرية من السياق.
