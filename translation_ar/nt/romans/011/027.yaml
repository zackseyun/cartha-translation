  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: ar
  text: وهذا سيكون عهدي معهم[a]، حين أنزع خطاياهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «العهد الصادر مني إليهم».'
    reason: بديل لفظي يوضح أن التعبير اليوناني ينسب مصدر العهد إلى الله ويستعمل ضميرًا يمكن نقله «لهم/إليهم».
lexical_decisions:
- source_word: διαθήκη
  choice: عهد
  rationale: يحفظ معنى العهد الإلهي ووعده الملزم في سياق الاقتباس النبوي، ولا يوحي بمعنى الوصية التي تُنفَّذ بعد الموت.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: عهدي
  rationale: التركيب يدل حرفيًا على العهد الصادر من عند الله؛ و«عهدي» تعبير عربي طبيعي ينقل المصدر والنسبة معًا، مع بيان الصيغة الأقرب إلى اللفظ في الحاشية.
- source_word: αὐτοῖς
  choice: معهم
  rationale: مع أن الضمير في صيغة المجرور ويمكن نقله «لهم»، فإن العربية المألوفة تقول «عهد مع»، وهو الأنسب للتعبير عن علاقة العهد.
- source_word: ὅταν
  choice: حين
  rationale: تفيد هنا الوقت الذي يتحقق فيه الوعد النبوي، لا تكرار الفعل في أزمنة غير محددة.
- source_word: ἀφέλωμαι
  choice: أنزع
  rationale: ينقل معنى إزالة الخطايا وإبعادها، ويحافظ على قوة الصورة الكتابية دون شرح زائد.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: خطاياهم
  rationale: ترجمة مباشرة موجزة تحفظ الجمع والدلالة الأخلاقية واللاهوتية.
- source_word: καὶ αὕτη
  choice: وهذا سيكون
  rationale: العبارة اليونانية اسمية محذوفة الرابط، وإضافة «سيكون» في العربية توضح اتجاه الوعد النبوي إلى المستقبل من غير تحديد توقيته.
theological_decisions:
- issue: دلالة διαθήκη في سياق اقتباس بولس للوعد النبوي
  choice: عهد
  alternative: وصية
  rationale: «عهد» يحفظ خلفية وعود الله النبوية لإسرائيل ولا يُدخل مفهوم الوصية testamentary غير المقصود هنا.
- issue: القوة الزمنية لعبارة ὅταν ἀφέλωμαι
  choice: حين أنزع خطاياهم
  alternative: كلما نزعت خطاياهم
  rationale: السياق يعرض تحققًا موعودًا في تدبير الخلاص، لا فعلًا عامًا متكررًا؛ و«حين» تحفظ اليقين مع إبقاء التوقيت غير محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت صياغة العهد العربية الطبيعية «عهدي معهم»، مع حاشية تحفظ البنية اليونانية الأشد حرفية. وأُبقي الوعد مفتوح التوقيت دون حسم لاهوتي زائد.
