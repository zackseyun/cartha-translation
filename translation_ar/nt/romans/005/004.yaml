lexical_decisions:
- source_word: ὑπομονή
  choice: الثبات
  rationale: ينقل معنى الصمود المستمر تحت الضيق، وهو تعبير عربي واضح وطبيعي يلائم تسلسل الآية.
- source_word: δοκιμή
  choice: شخصية مثبتة بالاختبار
  rationale: يحفظ معنى الصفة التي اجتازت الاختبار وثبتت أصالتها، لا مجرد الخُلُق المجرّد ولا عملية الاختبار نفسها.
- source_word: ἐλπίς
  choice: الرجاء
  rationale: هو المقابل العربي الكتابي والطبيعي، ويحفظ معنى التطلع الواثق من غير إضافة تفسيرية إلى النص.
- source_word: δὲ
  choice: وَ
  rationale: تربط هنا حلقات التسلسل، ولا تدل على تضاد قوي.
- source_word: ellipsis of κατεργάζεται
  choice: يُنتج
  rationale: الفعل محذوف في اليونانية ومفهوم من العبارة السابقة في العدد 3؛ وإظهاره بالعربية يوضح التسلسل ويحافظ على سلاسة الكلام.
theological_decisions:
- issue: دلالة δοκιμή في تسلسل الضيق والثبات والرجاء
  choice: صفة في الشخص ثبتت أصالتها بالاختبار
  alternative: الاختبار نفسه، أو القبول والاستحسان
  rationale: لأن الكلمة تأتي هنا ثمرةً للثبات، فالأرجح أنها تشير إلى الحالة أو الصفة التي برهن عليها الاختبار. وتُذكر الدلالات الأخرى في الحاشية حفاظًا على المجال الدلالي.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، بنبرة كريمة. استُخدم «الثبات» بدل تعبيرات أثقل مثل «الاحتمال بصبر»، واستُبقي تكرار العبارة المحورية ليظهر تسلسل الفكر كما في اليونانية.
