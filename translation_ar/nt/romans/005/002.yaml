  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: ar
  text: الذي به أيضًا صار لنا، بالإيمان، دخولٌ إلى هذه النعمة التي نقف فيها، ونفتخر[a] برجاء مجد الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نبتهج» أو «نتهلل».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: دخول
  rationale: تنقل معنى إتاحة المثول أو الوصول إلى حالة النعمة، وتلائم حرف الجر εἰς الدال على الدخول إلى هذه النعمة.
- source_word: πίστει
  choice: بالإيمان
  rationale: تعكس دلالة المجرور الأداتية في هذا السياق بصياغة عربية موجزة وطبيعية.
- source_word: χάρις
  choice: النعمة
  rationale: هي المقابل العربي المألوف والدقيق في السياق البولسي لعطاء الله وتفضله.
- source_word: ἑστήκαμεν
  choice: نحن قائمون
  rationale: تحافظ على صورة الوقوف وعلى الحالة الحاضرة الناتجة من فعل سابق التي تفيدها صيغة التام، من غير إضافة معنى الثبات الراسخ صراحة.
- source_word: καυχώμεθα
  choice: نفتخر
  rationale: تحافظ على القوة البلاغية المقصودة وعلى الصلة المعجمية باستعمالات بولس القريبة، مع أن الابتهاج ممكن سياقيًا.
- source_word: ἐπ’ ἐλπίδι
  choice: برجاء
  rationale: صياغة عربية طبيعية تحتفظ بإمكان فهم الرجاء بوصفه مجال الافتخار أو أساسه.
- source_word: δόξης τοῦ θεοῦ
  choice: مجد الله
  rationale: نقل مباشر وموجز للتركيب الإضافي، من دون تحديد ما إذا كان الرجاء متعلقًا برؤية المجد أو الاشتراك فيه.
theological_decisions:
- issue: الحفاظ على التوتر الدلالي في καυχώμεθα
  choice: نفتخر
  alternative: نبتهج
  rationale: قد يحمل الافتخار إيحاء سلبيًا في بعض السياقات، لكن بولس يستعمله هنا استعمالًا إيجابيًا مقصودًا؛ وإبقاؤه يحفظ قوة العبارة بدل تلطيفها إلى مجرد الفرح.
- issue: مدلول «رجاء مجد الله»
  choice: رجاء مجد الله
  alternative: رجاء نوال مجد الله
  rationale: تُركت الإضافة على اتساعها كما في اليونانية، لأن إضافة «نوال» تحسم ضمنًا كيفية علاقة المؤمنين بمجد الله.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعمل «صار لنا… دخول» لتجنب جمود النقل الحرفي، مع إبقاء صورة القيام والافتخار والتراكيب اللاهوتية الأساسية دون تفسير زائد.
