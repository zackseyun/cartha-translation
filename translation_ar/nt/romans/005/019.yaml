id: ROM.5.19
reference: Romans 5:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: ar
  text: فكما أنه بمعصية الإنسان الواحد جُعِلَ الكثيرون خطاةً[a]، كذلك أيضًا بطاعة الواحد[b] سيُجعَل الكثيرون أبرارًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُقيم الكثيرون في حال الخطاة».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: «بطاعة الإنسان الواحد»؛ واليونانية تقول هنا حرفيًا: «الواحد»، اعتمادًا على «الإنسان الواحد» في الشطر الأول.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «سيُقام الكثيرون في حال الأبرار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: معصية
  rationale: تعبّر «معصية» بوضوح عن عدم الطاعة، وتحافظ على المقابلة المباشرة مع «طاعة» في الشطر الثاني.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: الإنسان الواحد
  rationale: ينقل الاسم المذكور في اليونانية مع أداة التعريف والعدد، ويحفظ الإشارة السياقية إلى آدم دون إدخال اسمه في النص.
- source_word: ἁμαρτωλοὶ
  choice: خطاةً
  rationale: الصفة مستعملة استعمال الاسم وفي موقع الخبر، و«خطاة» هي المقابل العربي الطبيعي الواضح.
- source_word: κατεστάθησαν
  choice: جُعِلَ
  rationale: ينقل معنى وضع الكثيرين أو إقامة حالهم بوصفهم خطاة، بلغة عربية طبيعية، من غير حصر العبارة في إعلان قضائي.
- source_word: οἱ πολλοί
  choice: الكثيرون
  rationale: يحفظ أداة التعريف ولا يستبدل عبارة بولس التفسيرية بلفظ «الجميع».
- source_word: ὑπακοῆς
  choice: طاعة
  rationale: المقابل الطبيعي لـ«معصية»، ويحفظ التوازي بين آدم والمسيح.
- source_word: τοῦ ἑνὸς
  choice: الواحد
  rationale: يحافظ على الإيجاز اليوناني في الشطر الثاني؛ ومرجع «الواحد» مفهوم من السياق دون إضافة «الإنسان» إلى المتن.
- source_word: δίκαιοι
  choice: أبرارًا
  rationale: ينقل صفة δίκαιοι في سياق بولسي ويحافظ على صلتها اللغوية بحقل البر، دون استبدالها بعبارة تفسيرية مثل «مقبولين عند الله».
- source_word: κατασταθήσονται
  choice: سيُجعَل
  rationale: يحفظ صيغة المستقبل المبني للمجهول والتوازي مع الفعل في الشطر الأول، دون تحويله إلى «سيُعلَن» الذي قد يضيّق المعنى قضائيًا.
theological_decisions:
- issue: 'مدى عبارة οἱ πολλοί: هل تُترجم «الكثيرون» أم تُفسَّر «الجميع»؟'
  choice: الكثيرون
  alternative: الجميع؛ أناس كثيرون
  rationale: النص اليوناني يقول حرفيًا «الكثيرون» مع أداة التعريف. إبقاء العبارة يحفظ التوتر المتعلق بمدى المقصود ولا يحسمه تفسيريًا.
- issue: هل تُصاغ κατασταθήσονται δίκαιοι بلغة الحال أم بلغة الإعلان القضائي؟
  choice: سيُجعَل الكثيرون أبرارًا
  alternative: سيُعلَن الكثيرون أبرارًا؛ سيُقام الكثيرون في منزلة الأبرار
  rationale: الفعل هو καθίστημι لا δικαιόω؛ لذلك تحافظ «سيُجعَل ... أبرارًا» على صياغة الأصل وتترك تحديد طبيعة هذا الجعل للاستنباط اللاهوتي.
- issue: الاسم المحذوف بعد τοῦ ἑνὸς في الشطر الثاني
  choice: بطاعة الواحد
  alternative: بطاعة الإنسان الواحد
  rationale: اليونانية لا تكرر ἀνθρώπου في الشطر الثاني. إبقاء «الواحد» يصون بنية الأصل، مع بيان البديل التوضيحي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي بين «معصية/طاعة» و«جُعِل/سيُجعَل»، كما حُفظت عبارة «الكثيرون» وتجنُّب الألفاظ التي تحسم طبيعة الجعل أو مدى الجماعة لاهوتيًا.
