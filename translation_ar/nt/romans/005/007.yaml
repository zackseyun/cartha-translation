base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: ar
  text: فبالكاد ما يموت أحدٌ من أجل إنسان بارّ[a][b]؛ بل ربما يجرؤ أحدٌ حتى على أن يموت من أجل إنسان صالح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رجل بارّ». الصيغة اليونانية مذكرة نحويًا، ويُرجَّح أن المقصود بها هنا شخص على وجه العموم.'
    reason: lexical_alternative
  - marker: b
    text: قد يكون التقابل بين «البارّ» و«الصالح» مقصودًا، لا مجرد تنويع في الأسلوب.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: بالكاد
  rationale: تنقل معنى أن وقوع الأمر نادر جدًا أو عسير، وتلائم صياغة التعميم في السياق.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: تعبّر طبيعيًا عن الموت لمصلحة شخص أو نيابةً عنه، من غير حصر الدلالة في تفسير واحد.
- source_word: δικαίου
  choice: إنسان بارّ
  rationale: الصفة اليونانية مستعملة استعمال الاسم وتشير إلى شخص يتصف بالبر؛ ولفظ «إنسان» يوضح القوة العامة مع حفظ البديل الأكثر حرفية في الحاشية.
- source_word: ἀποθανεῖται
  choice: يموت
  rationale: يحافظ على دلالة الفعل المستقبلية العامة في اليونانية ضمن قول تقريري عربي طبيعي.
- source_word: τοῦ ἀγαθοῦ
  choice: إنسان صالح
  rationale: يحفظ التمييز اللفظي المحتمل بين «البار» و«الصالح» ولا يسوّي بينهما.
- source_word: τάχα
  choice: ربما
  rationale: تفيد الاحتمال من غير مبالغة في اليقين.
- source_word: καὶ
  choice: حتى
  rationale: تفيد التصعيد هنا، أي إن شخصًا قد يبلغ به الأمر أن يجرؤ على الموت.
- source_word: τολμᾷ
  choice: يجرؤ
  rationale: ترجمة مباشرة تحافظ على معنى الإقدام على فعل استثنائي، وقد صيغت مع «ربما» بما يلائم العبارة العربية.
- source_word: ἀποθανεῖν
  choice: أن يموت
  rationale: تحفظ تكرار فعل الموت في شطري الآية.
theological_decisions:
- issue: هل يُحفظ الفرق بين δικαίου وἀγαθοῦ؟
  choice: 'ترجمتهما بلفظين متميزين: «بارّ» و«صالح».'
  alternative: اعتبارهما مترادفين وتسوية الفرق بينهما في العربية.
  rationale: قد يكون التقابل مقصودًا في حجة بولس؛ وحفظ اللفظين يترك التوتر الدلالي قائمًا من غير فرض تفسير محدد.
- issue: القوة العامة للمذكر المفرد δικαίου
  choice: «إنسان بارّ».
  alternative: «رجل بارّ».
  rationale: الصيغة اليونانية مذكرة نحويًا، لكنها في هذا القول العام قد تشير إلى أي شخص؛ لذلك استُعمل «إنسان» في المتن مع توثيق البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فبالكاد» لربط الآية بحجة السياق، وحُفظ تكرار الموت والتمييز بين البار والصالح. وُضعت علامتا الحاشيتين بعد العبارة التي تتعلقان بها.
