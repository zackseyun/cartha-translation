  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: ar
  text: فبالأولى بكثير، إذ قد بُرِّرنا الآن بدمه[a]، سنخلُص به من الغضب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من خلال دمه».'
    reason: lexical_alternative
  - marker: b
    text: أي الغضب الإلهي الذي يدل عليه السياق.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: فبالأولى كثيرًا
  rationale: تحفظ الفاء دلالة الاستنتاج في οὖν، وتنقل العبارةُ التصاعدَ الحِجاجي في πολλῷ ... μᾶλλον بصياغة عربية واضحة.
- source_word: δικαιωθέντες
  choice: إذ قد بُرِّرنا
  rationale: تنقل اسم الفاعل الماضي المبني للمجهول بوصفه فعلًا تمّ قبل الخلاص المستقبلي، وتحافظ على المصطلح البولسي المتصل بالتبرير.
- source_word: νῦν
  choice: الآن
  rationale: تنقل الدلالة الزمنية المباشرة وتشير إلى الحالة الحاضرة الناتجة من التبرير.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: بدمه
  rationale: تفيد الباء الوسيلة أو الأساس على نحو عربي طبيعي، من غير إلغاء الصورة الدموية القربانية في الأصل.
- source_word: σωθησόμεθα
  choice: سنخلُص
  rationale: تنقل المستقبل المبني للمجهول دلاليًا في صياغة عربية مألوفة، وتحفظ بُعد الخلاص المستقبلي.
- source_word: δι’ αὐτοῦ
  choice: به
  rationale: تنقل معنى الوساطة أو الفاعلية في διά مع المضاف إليه، مع إبقاء الإحالة إلى المسيح واضحة من السياق.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: من الغضب
  rationale: تحافظ على تعريف الغضب من غير إضافة لفظ «الله»، إذ إن المرجع الإلهي مفهوم من السياق لكنه غير مصرّح به في اليونانية.
theological_decisions:
- issue: دلالة δικαιωθέντες
  choice: بُرِّرنا
  alternative: حُسبنا أبرارًا / أُعلن برُّنا
  rationale: يحافظ «بُرِّرنا» على اتساق المصطلح البولسي وعلى سعته القضائية واللاهوتية، من غير حصر كيفية التبرير في شرح مذهبي بعينه.
- issue: دلالة ἐν τῷ αἵματι αὐτοῦ
  choice: بدمه
  alternative: من خلال دمه / في دمه
  rationale: تتيح الباء معنى الوسيلة أو الأساس المحتمل هنا، بينما تسجل الحاشية البديل «من خلال دمه» من غير حسم زائد لطبيعة العلاقة.
- issue: مرجع τῆς ὀργῆς
  choice: الغضب
  alternative: غضب الله
  rationale: السياق يدل على الغضب الإلهي، لكن النص لا يذكر «الله» صراحة؛ لذلك بقي المتن قريبًا من الأصل، ووُضح المرجع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فبالأولى كثيرًا» للحفاظ على الاستنتاج والتصاعد الحِجاجي، و«سنخلُص» لإبراز المستقبل، مع تجنب إضافة «الله» إلى المتن.
