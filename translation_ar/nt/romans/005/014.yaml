  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: ar
  text: لكن الموت ملك من آدم إلى موسى، حتى على الذين لم يخطئوا على مثال تعدّي آدم، الذي هو نموذج[a] للآتي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مثال» أو «صورة استباقية».
    reason: lexical_alternative
  - marker: b
    text: أي الآتي بعده؛ والمقصود في السياق هو المسيح.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكن
  rationale: تفيد مقابلة قوية بما سبق، وهي طبيعية وواضحة في العربية.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: الموت ملك
  rationale: يحفظ صورة الحكم الملكي وتشخيص الموت بوصفه صاحب سلطان.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: من آدم إلى موسى
  rationale: ينقل المدى الزمني بعبارة عربية موجزة وطبيعية.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: حتى على الذين لم يخطئوا
  rationale: تبيّن امتداد سلطان الموت على نحو يبرز عنصر المفاجأة في καί.
- source_word: ἐπὶ τῷ ὁμοιώματι
  choice: على مثال
  rationale: يحفظ معنى المشابهة دون أن يحسم بدقة وجه الشبه أو يفسره تفسيرًا زائدًا.
- source_word: παραβάσεως
  choice: تعدّي
  rationale: يدل على تجاوز حد أو أمر معلوم، ويلائم استعمال بولس في السياق.
- source_word: τύπος
  choice: صورة
  rationale: تنقل معنى النموذج أو المثال الاستباقي بلفظ عربي مفهوم، مع بيان بدائل ممكنة في الحاشية.
- source_word: τοῦ μέλλοντος
  choice: للآتي
  rationale: يحافظ على صيغة النص الموجزة وإشارتها إلى الشخص المزمع أن يأتي، من غير إدخال اسم المسيح في المتن.
theological_decisions:
- issue: مرجع «الآتي»
  choice: الإبقاء على «الآتي» في المتن
  alternative: التصريح بـ«المسيح» أو «الذي سيأتي»
  rationale: السياق يشير إلى المسيح في موازنة آدم بالمسيح، لكن النص نفسه لا يذكر الاسم هنا؛ لذلك تُحفظ صياغته ويُوضَّح المرجع في الحاشية.
- issue: طبيعة مشابهة خطية الآخرين لتعدّي آدم
  choice: «على مثال تعدّي آدم» من دون شرح إضافي
  alternative: «بالطريقة نفسها التي تعدّى بها آدم»
  rationale: العبارة اليونانية تحتمل نقاشًا في وجه المشابهة؛ والصياغة المختارة تصون هذا القدر من الغموض بدل حسمه.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ورصينة. حُفظ تشخيص الموت في فعل «ملك»، كما حُفظت صياغة المقارنة بين آدم والآتي دون توسيع تفسيري.
