  rationale: استُبدلت «صورة» بـ«نموذج» لتقريب الدلالة النمطية لـ τύπος من غير تحويلها إلى تفسير عقائدي أو ذكر مرجع «الآتي» في المتن. وبقيت عبارة «على مثال تعدّي آدم» محافظة على غموض العبارة اليونانية في وجه المشابهة، وحُفظت علامة كل حاشية عند اللفظ الذي تتعلّق به.
