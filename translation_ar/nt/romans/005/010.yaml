  to: فإن كنا، ونحن أعداء، قد صُولِحنا مع الله بموت ابنه، فبالأحرى، بعد أن صُولِحنا، سنخلُص بحياته.[a]
  rationale: يصحح التعديل تركيب الرابط الشرطي التعليلي في أول الآية، ويستبدل تعبير القياس بالأولى بعبارة عربية أفصح وأكثر سلاسة. ولا يغير ذلك ترتيب الأفعال ولا علاقة المصالحة بالخلاص ولا دلالة العبارة ذات الحاشية.
