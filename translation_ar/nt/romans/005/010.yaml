source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: ar
  text: فإن كنا، ونحن أعداء، قد صُولِحنا مع الله بموت ابنه، فبالأحرى، بعد أن صُولِحنا، سنخلُص بحياته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سنخلُص في حياته».'
    reason: يحفظ المعنى الظرفي أو الارتباطي المحتمل لحرف الجر ἐν إلى جانب المعنى الوسيلي المعتمد في المتن.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: لأننا إن كنا
  rationale: يحفظ «لأن» صلة التعليل بما سبق، وتُبقي «إن» الصيغة الشرطية في اليونانية، مع ترتيب عربي طبيعي.
- source_word: ἐχθροὶ ὄντες
  choice: ونحن أعداء
  rationale: ينقل معنى الحال الذي يفيده اسم الفاعل، ويحافظ على الوصف العلائقي المباشر «أعداء» دون تخفيفه إلى مجرد العداوة الشعورية.
- source_word: κατηλλάγημεν
  choice: قد صُولِحنا
  rationale: صيغة المبني للمجهول تحفظ كون المصالحة واقعة علينا، و«قد» تُبرز تحقق الفعل السابق.
- source_word: τῷ θεῷ
  choice: مع الله
  rationale: «صُولِحنا مع الله» هي العبارة العربية الطبيعية للمصالحة بين طرفين، مع بقاء الله الطرف الذي تمت المصالحة معه.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: بموت ابنه
  rationale: الباء تنقل معنى الوسيلة في διά مع المضاف إليه، وتحفظ الإيجاز والمقابلة مع «بحياته».
- source_word: πολλῷ μᾶλλον
  choice: فبالأولى كثيرًا
  rationale: يؤدي حجة القياس بالأولى وقوتها البلاغية، وتربط الفاء النتيجة بالمقدمة الشرطية.
- source_word: καταλλαγέντες
  choice: بعد أن صُولِحنا
  rationale: يبين سبق المصالحة على الخلاص المستقبلي، وهو معنى اسم الفاعل الأوريستي في السياق.
- source_word: σωθησόμεθα
  choice: سنخلُص
  rationale: يحفظ زمن المستقبل ومعنى الخلاص دون توسع تفسيري.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: بحياته
  rationale: تفهم ἐν هنا على معنى الوسيلة أو السبب في ضوء المقابلة بين موت الابن وحياته، مع إثبات البديل الأقرب إلى الدلالة الظرفية في الحاشية.
theological_decisions:
- issue: دلالة ἐν τῇ ζωῇ αὐτοῦ
  choice: بحياته، على المعنى الوسيلي أو السببي
  alternative: في حياته، على المعنى الظرفي أو معنى الاتحاد/الارتباط
  rationale: المقابلة المباشرة مع «بموت ابنه» ترجح أن حياته هي الوسيلة أو الأساس للخلاص المستقبلي، لكن حرف الجر ἐν يحتمل «في»، لذلك تُحفظ هذه الإمكانية في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «صُولِحنا مع الله» بدل تركيب حرفي متعثر، وحُفظت بنية الحجة من الشرط إلى القياس بالأولى. وُضعت علامة الحاشية عقب العبارة التي تتعلق بها.
