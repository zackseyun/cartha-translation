  terminology: «أعداء»، و«صُولِحنا»، و«الله»، و«ابنه»، و«سنخلُص» ألفاظ دقيقة ومحايدة لاهوتيًا. تحافظ «بحياته» على القراءة الوسيلية/السببية المختارة، وتحفظ الحاشية احتمال «في حياته» دون فرض تفسير محدد.
