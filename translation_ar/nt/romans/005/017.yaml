id: ROM.5.17
reference: Romans 5:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: ar
  text: فإن كان الموت قد ملك بزلة الواحد، بواسطة الواحد، فكم بالأولى سيملك في الحياة، بواسطة الواحد، يسوع المسيح، الذين ينالون فيض النعمة وعطية البر[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عطية العدل».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا إبراز «المسيح» بوصفه لقبًا: «يسوع، المسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: زلة
  rationale: تحفظ صورة الانحراف أو الخطوة الخاطئة الكامنة في اللفظ، وتدل في السياق على تعدٍّ من غير صياغة اصطلاحية ثقيلة.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: ملك / سيملكون
  rationale: يحفظ الفعلان الاستعارة الملوكية والتوازي المقصود بين مُلك الموت ومُلك الذين ينالون العطية.
- source_word: περισσείαν
  choice: فيض
  rationale: لفظ عربي طبيعي يدل على الوفرة المتجاوزة للقدر المعتاد، ويلائم اقترانه بالنعمة.
- source_word: χάριτος
  choice: النعمة
  rationale: المقابل العربي الراسخ الذي يجمع معنى العطية والتفضل الإلهي في الاستعمال البولسي.
- source_word: δωρεᾶς
  choice: عطية
  rationale: ينقل معنى الهبة بوضوح، فيما يبيّن ذكر النعمة المجاور أنها ممنوحة بلا استحقاق.
- source_word: δικαιοσύνης
  choice: البر
  rationale: المقابل العربي الأنسب في سياق بولس المتصل بالتبرير، مع إبقاء معنى العدل الممكن في الحاشية.
- source_word: λαμβάνοντες
  choice: ينالون
  rationale: صياغة عربية طبيعية تصف هؤلاء بأنهم متلقّو النعمة والعطية، من غير أن توحي بأنهم يستحقونها.
- source_word: ἐν ζωῇ
  choice: في الحياة
  rationale: يحفظ إيجاز الأصل والمقابلة المباشرة مع الموت.
- source_word: διὰ τοῦ ἑνός
  choice: من خلال الواحد
  rationale: يحافظ على معنى الوساطة وعلى تكرار «الواحد» في طرفي المقابلة بين آدم والمسيح.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: الصياغة العربية المألوفة والطبيعية، وتحفظ «المسيح» بوصفه لقبًا ذا دلالة مع إمكان قراءته ضمن الاسم المركب الشائع.
theological_decisions:
- issue: دلالة δικαιοσύνης في العبارة البولسية
  choice: عطية البر
  alternative: عطية العدل
  rationale: «البر» يلائم سياق المقابلة بين آدم والمسيح والتبرير، لكن اللفظ اليوناني قد يتسع أيضًا لمعنى العدل، ولذلك حُفظ البديل في حاشية.
- issue: وظيفة Χριστός في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع، المسيح
  rationale: «يسوع المسيح» هي العبارة العربية الطبيعية، مع التنبيه إلى أن «المسيح» يمكن فهمه هنا لقبًا لا مجرد جزء من اسم.
- issue: فاعل المُلك في النصف الثاني من الآية
  choice: الذين ينالون... سيملكون في الحياة
  alternative: صياغة تجعل الحياة هي التي تملك
  rationale: التركيب اليوناني يجعل الذين ينالون فيض النعمة وعطية البر فاعل βασιλεύσουσιν، فحُفظ هذا الإسناد من غير تخفيف للتوتر اللاهوتي في صورة مُلك المؤمنين.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظت الاستعارة الملوكية، وتكرار «الواحد»، والمقابلة بين الموت والحياة. وُضعت فواصل حول «بزلة الواحد» لإظهار علاقتها السببية من غير تفكيك بنية الجملة.
