  rationale: عُدّلت أداة المقارنة إلى «فكم بالأولى» لتكون الجملة عربية سليمة وطبيعية مع حفظ قوة πολλῷ μᾶλλον، واستُبدلت «من خلال» بـ«بواسطة» لإبراز معنى الوساطة في διά. ولم يُغيَّر المعنى أو ترتيب العلاقات في النص.
