id: ROM.5.12
reference: Romans 5:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: ar
  text: لذلك، كما دخلت الخطيئة إلى العالم بإنسان واحد، وبالخطيئة دخل الموت، هكذا أيضًا انتشر الموت إلى جميع الناس، لأن الجميع أخطأوا[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب القراءة التقليدية: «إذ أخطأ الجميع فيه».'
    reason: قراءة بديلة لعبارة ἐφ’ ᾧ ذات أهمية تفسيرية ولاهوتية.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لذلك
  rationale: تفيد الانتقال الاستنتاجي من الحجة السابقة، وهذه صياغة عربية موجزة وطبيعية.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: بإنسان واحد
  rationale: تحافظ الباء على معنى الواسطة في διά مع المضاف إليه، و«إنسان» هنا تشير في السياق إلى آدم بوصفه رجلًا واحدًا ممثلًا للبشر.
- source_word: ἡ ἁμαρτία
  choice: الخطيئة
  rationale: تنقل الاسم المعرّف بصيغته البولسية المعتادة من غير توسيع تفسيري.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: دخلت الخطيئة إلى العالم
  rationale: تحفظ دلالة الاتجاه في εἰς وتأتي في عربية واضحة وطبيعية.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: وبالخطيئة دخل الموت
  rationale: 'يُستفاد فعل «دخل» من الشطر السابق، وتُحفظ الموازاة: الخطيئة دخلت بإنسان واحد، والموت دخل بالخطيئة.'
- source_word: οὕτως
  choice: هكذا أيضًا
  rationale: تُظهر المقابلة والنتيجة في بناء بولس المقارن.
- source_word: εἰς πάντας ἀνθρώπους
  choice: إلى جميع الناس
  rationale: تنقل الإحالة الشاملة إلى البشر كافة بصياغة عربية معاصرة لا تقتصر على الذكور.
- source_word: ὁ θάνατος διῆλθεν
  choice: انتشر الموت
  rationale: يفيد الفعل حركة امتدت إلى البشر جميعًا؛ و«انتشر» توضح هذا المدى طبيعيًا.
- source_word: ἐφ’ ᾧ
  choice: لأن
  rationale: 'المعنى السببي هو الأنسب في السياق: انتشر الموت إلى الجميع لأن الجميع أخطأوا، مع إبقاء القراءة التقليدية البديلة في الحاشية.'
- source_word: πάντες ἥμαρτον
  choice: الجميع أخطأوا
  rationale: تنقل صيغة الماضي اليونانية بصيغة ماضٍ عربية من غير تحويلها إلى صيغة تفيد جانبًا زمنيًا آخر.
theological_decisions:
- issue: دلالة ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'قراءة سببية: «لأن الجميع أخطأوا»'
  alternative: 'قراءة تمثيلية أو اندماجية تقليدية: «إذ أخطأ الجميع فيه»؛ وقيل أيضًا إنها تفيد النتيجة: «فكان من نتيجة ذلك أن الجميع أخطأوا»'
  rationale: تحتمل العبارة نقاشًا نحويًا ولاهوتيًا مهمًا في علاقة آدم بالبشرية. اختير المعنى السببي لملاءمته الأقوى للسياق، من غير فرض صياغة عقائدية أخص من النص، وأُبقيت القراءة التقليدية في الحاشية حفاظًا على موضع الخلاف.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت بنية المقارنة غير المكتملة في الآية بوضع الشرطة الطويلة في النهاية، لأن الجملة اليونانية تستمر في السياق اللاحق. وُضع رمز الحاشية عند العبارة المختلف في تفسيرها.
