revisions:
- from: وليست الهبة مثل ما جاء عن طريق الواحد الذي أخطأ[a]؛ لأن الحكم الناتج من زلّة واحدة[b] انتهى إلى الإدانة، أما هبة النعمة الناتجة من زلّات كثيرة فانتهت إلى التبرئة[c].
  to: وليست الهبة مماثلة لما أتى بواسطة الواحد الذي أخطأ[a]؛ لأن الحكم الصادر عن زلّة واحدة أفضى إلى الإدانة[b]، أمّا هبة النعمة فمن زلّات كثيرة أفضت إلى التبرئة[c].
  rationale: 'التعديل أسلوبي محدود لتحسين سلاسة الفصحى وإبراز التوازي القضائي في الأصل: الحكم من زلّة واحدة إلى الإدانة، وهبة النعمة من زلّات كثيرة إلى التبرئة. لا يغيّر التعديل المرجع الشخصي في صدر الآية ولا يحسم أكثر مما يحسمه النص في دلالة δικαίωμα.'
