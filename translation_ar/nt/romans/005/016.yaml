  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: ar
  text: وليست الهبة مماثلة لما أتى بواسطة الواحد الذي أخطأ[a]؛ لأن الحكم الصادر عن زلّة واحدة أفضى إلى الإدانة[b]، أمّا هبة النعمة فمن زلّات كثيرة أفضت إلى التبرئة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وليست الهبة مماثلة لما أتى بواسطة إنسان واحد أخطأ».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «من واحد»؛ وقد يُفهم أيضًا: «من إساءة واحدة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «إلى حكم بالبراءة»، أو «إلى التبرير».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: الهبة
  rationale: يدل اللفظ على عطية ممنوحة؛ و«الهبة» عربية طبيعية تحفظ معنى العطاء من غير إضافة وصف لا يصرّح به الاسم.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: ما جاء عن طريق الواحد الذي أخطأ
  rationale: التركيب اليوناني موجز ومحذوف المتعلَّق؛ وهذه الصياغة تحفظ الإشارة الشخصية إلى آدم ولا تحوّلها صراحةً إلى «خطيئة الرجل الواحد».
- source_word: κρίμα
  choice: الحكم
  rationale: المقصود قرار قضائي، و«الحكم» يلائم المقابلة مع الإدانة والتبرئة.
- source_word: ἐξ ἑνὸς
  choice: الناتج من زلّة واحدة
  rationale: لفظ «واحد» محايد في اليونانية، ويرجّح أن يعود إلى زلّة واحدة في مقابل «زلّات كثيرة» لاحقًا؛ وقد صُرّح بالمحذوف لإيضاح العربية مع إثبات البديل في الحاشية.
- source_word: κατάκριμα
  choice: الإدانة
  rationale: يحمل اللفظ معنى الحكم القضائي بالإدانة، وهذه الصياغة واضحة وتحفظ النبرة القانونية.
- source_word: χάρισμα
  choice: هبة النعمة
  rationale: اللفظ عطية منشؤها النعمة؛ و«هبة النعمة» تحفظ صلته الدلالية بالنعمة وتميّزه من δώρημα في صدر الآية.
- source_word: παραπτωμάτων
  choice: زلّات
  rationale: يشير اللفظ إلى السقطات أو التجاوزات؛ و«زلّات» واضحة وقريبة من صورة الخطوة الخاطئة، من غير إضعاف للمغزى الأخلاقي في السياق.
- source_word: δικαίωμα
  choice: التبرئة
  rationale: في مقابل κατάκριμα يدل هنا على نتيجة قضائية مناقضة للإدانة؛ و«التبرئة» عربية مباشرة، مع حفظ إمكان معنى «حكم بالبر» في الحاشية.
theological_decisions:
- issue: القوة القضائية للفظ δικαίωμα في مقابل κατάκριμα
  choice: التبرئة بوصفها النتيجة القضائية المقابلة للإدانة
  alternative: حكم بالبر؛ أو التبرير
  rationale: بنية العبارة قائمة على مقابلة قضائية بين الحكم والإدانة من جهة، وهبة النعمة وδικαίωμα من جهة أخرى. تنقل «التبرئة» هذه المقابلة بوضوح، فيما تحفظ الحاشية احتمال صياغة اللفظ على أنه حكم بالبر أو تبرير.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. حُفظ الإيجاز والموازاة القضائية في الأصل، مع توضيح المحذوف حيث تقتضيه سلامة العربية، وإبقاء البدائل الدلالية المهمة في الحواشي.
