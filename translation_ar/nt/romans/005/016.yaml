    rationale: العبارة اليونانية تستعمل تركيبًا موجزًا («من واحد/من زلات كثيرة») في مقابلة متوازية. الصياغة المنقحة أوضح وأقرب إلى هذا التوازي دون تغيير المعنى.
  - severity: low
    issue: «حكم بالبر» في الحاشية غير طبيعية
    rationale: لا تؤدي هذه العبارة العربية الحديثة معنى الحكم القضائي المقابل للإدانة بوضوح؛ «حكم بالبراءة» أيسر وأدق في هذا السياق.
