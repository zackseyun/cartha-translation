id: ROM.5.5
reference: Romans 5:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: ar
  text: وَالرَّجَاءُ لَا يُخْزِي[a]، لِأَنَّ مَحَبَّةَ اللهِ[b] قَدْ أُفِيضَتْ فِي قُلُوبِنَا بِالرُّوحِ الْقُدُسِ الَّذِي أُعْطِيَ لَنَا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يُخَيِّب» أو «لا يقود إلى الخيبة».'
    reason: lexical_alternative
  - marker: b
    text: 'وقد تُفهم أيضًا، وإن كان ذلك أقل ترجيحًا: «محبتنا لله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: الرَّجَاء
  rationale: المقابل العربي المعياري الواضح، والتعريف يلائم الاستعمال العام في اليونانية.
- source_word: δέ
  choice: وَ
  rationale: تمثل أداة الربط الخفيفة من غير مبالغة في معنى الاستدراك.
- source_word: καταισχύνει
  choice: لَا يُخْزِي
  rationale: يحفظ دلالة الخزي والعار الأساسية، ولا يختزلها في مجرد خيبة التوقع.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: مَحَبَّةَ اللهِ
  rationale: صياغة عربية مباشرة تحفظ تركيب الإضافة وما فيه من احتمال نحوي، مع ترجيح السياق لمحبة الله لنا.
- source_word: ἐκκέχυται
  choice: قَدْ أُفِيضَتْ
  rationale: الفعل المبني للمجهول مع «قد» ينقل صورة السكب ويدل على فعل وقع وبقي أثره.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: فِي قُلُوبِنَا
  rationale: ترجمة مباشرة وطبيعية لشبه الجملة.
- source_word: διὰ πνεύματος ἁγίου
  choice: بِالرُّوحِ الْقُدُسِ
  rationale: الباء تؤدي معنى الوساطة أو الأداة هنا بصياغة عربية طبيعية.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: الَّذِي أُعْطِيَ لَنَا
  rationale: جملة صلة واضحة تعود على الروح القدس وتحفظ المبني للمجهول.
theological_decisions:
- issue: دلالة الإضافة في «ἡ ἀγάπη τοῦ θεοῦ»
  choice: محبة الله، والمقصود المرجح محبة الله لنا
  alternative: محبتنا لله
  rationale: الصياغة العربية «محبة الله» تحفظ الاحتمال التركيبي، بينما يرجح التعليل اللاحق—إفاضتها في القلوب بالروح القدس—أن المقصود محبة الله المتجهة إلينا. أُبقي البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «لا يُخزي» للمحافظة على بُعد الخزي والكرامة في الأصل، و«أُفيضت» لصورة السكب مع نتيجة باقية. وُضعت علامتا الحاشيتين عند اللفظين اللذين تخصهما الملاحظتان.
