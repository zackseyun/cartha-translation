lexical_decisions:
- source_word: συνίστησιν
  choice: يُظهِرُ
  rationale: ينقل معنى الإظهار والبرهنة العملية بصياغة عربية واضحة، مع الحفاظ على دلالة المضارع.
- source_word: δὲ
  choice: لكنَّ
  rationale: يعكس التحول التقابلي الخفيف في سياق الحجة السابقة.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: محبَّتَهُ هو
  rationale: يحافظ الضمير المنفصل «هو» على توكيد الصيغة الانعكاسية ἑαυτοῦ بصورة عربية طبيعية.
- source_word: εἰς ἡμᾶς
  choice: لنا
  rationale: صياغة عربية موجزة وطبيعية للمحبة المتجهة إلينا، مع إثبات البديل الأدق حرفيًا في الحاشية.
- source_word: ὅτι
  choice: في أنَّ
  rationale: يقدم مضمون الكيفية التي يُظهر بها الله محبته، لا مجرد علة منفصلة.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: ونحنُ ما زلنا خاطئين
  rationale: ينقل التركيب المطلق بالمضاف إليه بوصفه جملة حالية زمنية، ويحفظ قوة ἔτι.
- source_word: Χριστὸς
  choice: المسيحُ
  rationale: «المسيح» المقابل العربي الموروث والواضح للقب Χριστός، ويحافظ على دلالته المسيانية.
- source_word: ὑπὲρ ἡμῶν
  choice: لأجلِنا
  rationale: ينقل المعنى النفعي والنيابي الواسع دون حسم الجدل اللاهوتي في اتجاه «نيابةً عنا» أو «عوضًا عنا».
- source_word: ἀπέθανεν
  choice: ماتَ
  rationale: المقابل المباشر والطبيعي للفعل الماضي اليوناني.
theological_decisions:
- issue: دلالة Χριστός في الخطاب البولسي
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية لقب مترجم لا مجرد نقل صوتي، وهو أوضح وأرسخ لدى القارئ العام مع إبقاء الدلالة المسيانية.
- issue: قوة ὑπὲρ ἡμῶν
  choice: لأجلنا
  alternative: نيابةً عنا؛ عوضًا عنا
  rationale: النص يقرر أن موت المسيح كان لمنفعتنا ومن أجلنا، أما تحديد معنى الاستبدال على نحو أضيق فيتجاوز ما تحسمه العبارة وحدها؛ لذلك حُفظ الاتساع الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت جملة الحال «ونحن ما زلنا خاطئين» لصياغة عربية طبيعية مع إبراز المفارقة، ووُضع توكيد «هو» بعد «محبته» للمحافظة على تشديد الأصل على محبة الله الخاصة.
