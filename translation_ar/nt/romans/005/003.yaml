id: ROM.5.3
reference: Romans 5:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: ar
  text: وليس هذا فقط، بل نبتهج[a] أيضًا وسط الشدائد[b]، عالمين أن الشدة تُنتج الصبر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نفتخر» أو «نعتز».
    reason: lexical_alternative
  - marker: b
    text: أو «الضيقات» أو «الآلام».
    reason: lexical_alternative
  - marker: c
    text: أو «الثبات» أو «المثابرة».
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: نبتهج
  rationale: ينقل الفرح الواثق والاعتزاز في هذا السياق من غير أن يوحي بتفاخر متعجرف، مع إبقاء معنى الافتخار الممكن في الحاشية.
- source_word: θλίψεσιν / θλῖψις
  choice: الشدائد / الشدة
  rationale: يحافظ على دلالة الضغط والضيق، وعلى انتقال اليونانية من الجمع في الخبرة المعيشة إلى المفرد في تقرير المبدأ العام.
- source_word: ὑπομονήν
  choice: الصبر
  rationale: لفظ عربي واضح وشائع يدل هنا على الاحتمال المستمر تحت الضغط، مع بيان دلالتي الثبات والمثابرة في الحاشية.
- source_word: κατεργάζεται
  choice: تُنتج
  rationale: يعبّر بوضوح وطبيعية عن تسبب الشدة في نشوء الصبر بوصفه نتيجة.
- source_word: εἰδότες
  choice: عالمين
  rationale: يحافظ على الصيغة الحالية الرابطة بين الابتهاج والمعرفة من غير تحويل العلاقة صراحة إلى تعليل.
theological_decisions:
- issue: دلالة καυχώμεθα في السياق الروحي الإيجابي
  choice: نبتهج
  alternative: نفتخر أو نعتز
  rationale: السياق يدل على ابتهاج واثق مرتبط بعمل الله وسط الشدائد، لا على مباهاة بالنفس؛ والحاشية تحفظ مجال الدلالة الأصلي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «وسط الشدائد» تعبيرًا طبيعيًا عن ἐν ταῖς θλίψεσιν، وحُفظ اختلاف العدد بين «الشدائد» و«الشدة»، كما حُفظ البناء بالمشاركة في «عالمين».
