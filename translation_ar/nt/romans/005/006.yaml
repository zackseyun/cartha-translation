  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: ar
  text: فبينما كنا لا نزال ضعفاء، مات المسيح في الوقت المناسب من أجل الفُجّار[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نيابةً عن الفُجّار».'
    reason: يبين وجهًا ممكنًا لدلالة ὑπὲρ في هذا السياق، مع إبقاء المتن أوسع دلالة.
lexical_decisions:
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ العربي الطبيعي المقابل للقب اليوناني Χριστός، ويحافظ على دلالته بوصفه «الممسوح» دون تحويله إلى اسم مجرد.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: بينما كنا لا نزال ضعفاء
  rationale: صيغ التركيب المطلق في عبارة زمنية عربية واضحة، وأبقى «ضعفاء» اتساع معنى العجز والوهن من غير تخصيصه بالضعف الجسدي.
- source_word: ἔτι
  choice: لا نزال
  rationale: ينقل استمرار حال الضعف نقلاً عربيًا طبيعيًا، من غير تكرار ثقيل رغم ورود ἔτι مرتين في ترتيب النص اليوناني.
- source_word: κατὰ καιρὸν
  choice: في الوقت المناسب
  rationale: يعبر عن التوقيت الملائم أو المعيّن، مع تجنب التصريح بمن عيّنه لأن ذلك غير مذكور صراحة في العبارة.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: تعبير عربي واسع يدل على أن الموت كان لخير الفجار ولأجلهم، ولا يحسم وحده دقائق النيابة أو الاستبدال.
- source_word: ἀσεβῶν
  choice: الفُجّار
  rationale: ينقل المعنى الديني والأخلاقي لمن لا يتقون الله ولا يوقرونه، وهو تعبير عربي كتابي واضح ومألوف.
- source_word: ἀπέθανεν
  choice: مات
  rationale: مقابل مباشر ودقيق للفعل اليوناني في صيغة الماضي.
theological_decisions:
- issue: دلالة موت المسيح التي تعبّر عنها ὑπὲρ ἀσεβῶν
  choice: من أجل الفُجّار
  alternative: نيابةً عن الفُجّار
  rationale: يثبت النص أن موت المسيح كان لأجل الفجار ومنفعتهم، لكن «من أجل» يحفظ المجال الدلالي لحرف الجر من غير أن يفرض في المتن صياغة مذهبية أدق من اللفظ اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. قُدّمت العبارة الزمنية قبل الفعل لتيسير القراءة، واستُعمل «المسيح» بوصفه اللقب العربي الطبيعي. وُضع مؤشر الحاشية مباشرة بعد العبارة التي تشرحها.
