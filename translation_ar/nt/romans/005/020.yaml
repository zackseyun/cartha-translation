  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: ar
  text: وأمّا الشريعة فدخلت بالإضافة إلى ذلك[a] لكي يزداد التعدّي[b]؛ ولكن حيث ازدادت الخطيئة، فاضت النعمة أكثر بكثير[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دخلت» أو «دخلت إلى جانب ما سبق»؛ يوحي الفعل اليوناني بالدخول إلى جانب شيء قائم أو بالإضافة إليه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الزلّة» أو «الإساءة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ازدادت النعمة أكثر جدًا» أو «فاضت النعمة بوفرة أعظم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: الشريعة
  rationale: التعريف والسياق البولسيان يشيران على الأرجح إلى شريعة موسى، و«الشريعة» هي المقابل العربي الطبيعي المحدد في هذا السياق.
- source_word: παρεισῆλθεν
  choice: دخلت إلى جانب ذلك
  rationale: يحفظ التعبير معنى الدخول إلى جانب أمر قائم أو بالإضافة إليه، لا مجرد الدخول، مع بقاء العبارة واضحة بالعربية.
- source_word: ἵνα πλεονάσῃ
  choice: لكي تزداد
  rationale: تحفظ «لكي» دلالة الغاية في ἵνα مع صيغة الاحتمال/القصد، من غير تحويلها إلى مجرد نتيجة.
- source_word: τὸ παράπτωμα
  choice: الزلّة
  rationale: تدل على فعل تعدٍّ أو سقوط محدد، وتناسب الإشارة السياقية إلى زلّة آدم، مع ذكر البدائل في الحاشية.
- source_word: οὗ
  choice: حيث
  rationale: مقابل عربي موجز وطبيعي للظرف الموصول في بنية المقابلة.
- source_word: ἁμαρτία
  choice: الخطيئة
  rationale: المقابل العربي المألوف للمصطلح البولسي، ويحفظ طابعه الاسمي المفرد.
- source_word: ὑπερεπερίσσευσεν
  choice: فاضت ... فيضًا أعظم بكثير
  rationale: ينقل معنى الوفرة الشديدة المتضمن في الفعل المركب، ويزيد على مجرد «ازدادت» مع صياغة عربية طبيعية.
- source_word: ἡ χάρις
  choice: النعمة
  rationale: المصطلح العربي اللاهوتي المألوف والواضح لـχάρις في هذا السياق.
theological_decisions:
- issue: هل تُفهم ἵνα على أنها غاية أم تُلطَّف إلى مجرد نتيجة تجنبًا للإيحاء بأن الله يقرّ الخطيئة؟
  choice: لكي تزداد الزلّة
  alternative: فكانت النتيجة أن ازدادت الزلّة
  rationale: البنية اليونانية تستخدم ἵνα مع صيغة الالتزام، ولذلك تُحفظ دلالة الغاية والتوتر اللاهوتي في كلام بولس من غير تفسير إضافي يحسمه.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. استُعملت «وأمّا» لنقل قوة δέ الانتقالية/التقابلية، وحُفظ التوازي بين ازدياد الزلّة والخطيئة، مع تعبير أقوى للوفرة الفائقة للنعمة.
