  rationale: لا يلزم تعديل المعنى الأساسي. اقتصر التعديل على ربط الحاشية بتركيبها المقصود، وعلى تقديم بديل عربي مباشر يعكس إمكان فهم ἐν في العبارة اليونانية من غير فرض تفسير مذهبي أو حسم دلالي زائد.
