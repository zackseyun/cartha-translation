source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: ar
  text: لكن الهبة ليست كالتعدّي. فلئن كان بتعدّي الإنسان الواحد قد مات الكثيرون، فكم بالأحرى فاضت على الكثيرين نعمة الله والعطيّة الآتية بنعمة[a] الإنسان الواحد، يسوع المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العطيّة بالنعمة التي للإنسان الواحد، يسوع المسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: التعدّي
  rationale: يدلّ اللفظ هنا على فعل خاطئ أو تجاوز، و«التعدّي» واضح ويحفظ قوته الأخلاقية من غير اصطلاح قانوني ثقيل.
- source_word: χάρισμα
  choice: الهبة
  rationale: يحفظ المقابلة المباشرة بين تعدّي آدم وهبة الله، بينما يبيّن سياق النعمة أن الهبة مجانية.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: الكثيرون / الكثيرين
  rationale: يحفظ أداة التعريف والمقابلة البلاغية بين الواحد والكثيرين، من غير تحويل العبارة إلى «الجميع» أو حسم مداها اللاهوتي.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: نعمة الله
  rationale: صياغة عربية طبيعية ودقيقة تحفظ الإضافة في اليونانية.
- source_word: ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου
  choice: العطيّة الآتية بنعمة الإنسان الواحد
  rationale: تفهم ἐν دالةً على الواسطة أو الملابسة، وتبيّن تعلق «نعمة» بـ«الإنسان الواحد» مع بقاء البديل الحرفي في الحاشية.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: الإنسان الواحد
  rationale: يحفظ التشديد على الواحد في موازاة الكثيرين، و«الإنسان» أوسع وأقرب إلى ἄνθρωπος من «الرجل».
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الطبيعي للقب Χριστός، ويحفظ معناه اللقبي من غير معاملته كلقب عائلي.
- source_word: ἐπερίσσευσεν
  choice: فاضت
  rationale: تنقل معنى الوفرة والزيادة الكثيرة، وتنسجم طبيعيًا مع النعمة والعطية في العربية.
theological_decisions:
- issue: مدى «الكثيرين» في المقابلة بين آدم والمسيح
  choice: الإبقاء على «الكثيرين»
  alternative: «الجميع»
  rationale: النص يستعمل عمدًا مقابلة الواحد بالكثيرين؛ وتحويلها إلى «الجميع» يحسم في هذه الآية وحدها مسألة يتركها التعبير في توترها البلاغي واللاهوتي.
- issue: علاقة العطية بنعمة الإنسان الواحد
  choice: «العطيّة الآتية بنعمة الإنسان الواحد»
  alternative: «العطيّة في نعمة الإنسان الواحد»
  rationale: تسمح ἐν بفهم وسائطي أو ملابسي؛ اختيرت صياغة عربية مفهومة، مع إثبات الأقرب إلى البنية اليونانية في الحاشية وعدم فصل العطية عن نعمة يسوع المسيح.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. استُخدمت «فكم بالأحرى» لنقل πολλῷ μᾶλλον، وحُفظ توازي «الإنسان الواحد/الكثيرون». وُضعت الحاشية بعد العبارة التي تشرحها مباشرة.
