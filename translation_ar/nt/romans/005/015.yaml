    issue: علامة الحاشية بعيدة عن العبارة المشروحة.
    rationale: الحاشية تتناول ἡ δωρεὰ ἐν χάριτι، لكن العلامة وردت بعد نهاية الآية. وضعها بعد «العطية الآتية بنعمة» يثبت مرجعها بوضوح.
  - severity: low
    issue: صياغة الحاشية الحالية تفسيرية أكثر من اللازم.
    rationale: عبارة «على نحو أقرب إلى اللفظ اليوناني» ليست لازمة في نص الحاشية. البديل المباشر «العطية بالنعمة التي للإنسان الواحد» يوضح الإمكان التركيبي مع بقاء المعنى مفتوحًا.
