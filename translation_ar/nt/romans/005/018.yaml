revisions:
- from: فإذًا، كما أن زلّةً واحدة جلبت الدينونة على جميع الناس، كذلك أيضًا عملُ برٍّ واحد جلب لجميع الناس تبريرًا يؤدّي إلى الحياة.[a]
  to: فإذًا، كما أن تعدِّيًا واحدًا جلب الإدانة على جميع الناس، كذلك أيضًا جلب عملُ برٍّ واحد لجميع الناس تبريرًا يؤدّي إلى الحياة.[a]
  rationale: يقتصر التعديل على تقوية المقابل العربي لـπαράπτωμα وتدقيق المقابل القضائي لـκατάκριμα، مع الإبقاء على التوازي، وعلى الشمول المتكرر لعبارة «جميع الناس»، وعلى الصياغة التفسيرية الواضحة لـδικαίωσιν ζωῆς والحاشية الحرفية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:36Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام والبناء المقارن وتكرار «جميع الناس» منقولان بأمانة، كما أن «تبريرًا يؤدّي إلى الحياة» يعبّر بوضوح عن δικαίωσιν ζωῆς. لكن «زلّة» في الاستعمال العربي الحديث قد توحي بهفوة أو خطأ غير مقصود، فتضعف قوة παράπτωμα بوصفه تعدّيًا/ذنبًا. كذلك «الإدانة» أدق من «الدينونة» هنا في نقل القوة القضائية لكلمة κατάκριμα.
  naturalness: الصياغة فصيحة وواضحة، والتوازي بين الشطرين جيد. واستبدال «زلّة» بـ«تعدٍّ» و«الدينونة» بـ«الإدانة» يحسن الدقة من دون أن يثقل العبارة.
  terminology: «عمل برّ واحد» مناسب لـδικαίωμα، و«تبرير» مناسب لـδικαίωσις. تُحافَظ عبارة «جميع الناس» في الموضعين، فلا يُفرض على النص تقييد لاهوتي غير مذكور فيه.
  issues:
