  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: ar
  text: فإذًا، كما أن تعدِّيًا واحدًا جلب الإدانة على جميع الناس، كذلك أيضًا جلب عملُ برٍّ واحد لجميع الناس تبريرًا يؤدّي إلى الحياة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا أكثر: «إلى تبرير الحياة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: فإذًا
  rationale: تنقل أداة الاستنتاج المزدوجة بعبارة عربية موجزة وطبيعية تربط النتيجة بما سبق.
- source_word: παραπτώματος
  choice: زلّة
  rationale: تدل على فعل تعدٍّ محدد، وتحافظ على مقابلة «عمل برّ واحد» من غير تحويلها إلى مفهوم «الخطيئة» الأعم.
- source_word: κατάκριμα
  choice: الدينونة
  rationale: تحفظ الدلالة القضائية للكلمة في سياق المقابلة بين آدم والمسيح.
- source_word: δικαιώματος
  choice: عملُ برٍّ
  rationale: تعكس المفرد اليوناني الدال هنا على فعل بار حاسم، بصياغة عربية واضحة من غير زيادة تفسيرية تحدده صراحةً.
- source_word: δικαίωσιν ζωῆς
  choice: تبريرًا يؤدّي إلى الحياة
  rationale: توضح العلاقة المحتملة بين التبرير والحياة بلغة عربية حديثة، مع إبقاء المعنى القضائي والنتيجة المحيية.
- source_word: πάντας ἀνθρώπους
  choice: جميع الناس
  rationale: تنقل الشمول الظاهر في العبارة اليونانية المتكررة في شطري المقارنة من غير تقييد تفسيري.
theological_decisions:
- issue: هل ينبغي تقييد عبارة «جميع الناس» الثانية لتفادي دلالة شمولية ظاهرة؟
  choice: الإبقاء على «جميع الناس» في الشطرين من غير تقييد.
  alternative: جميع الذين يتبررون؛ جميع الذين يؤمنون
  rationale: يكرر اليوناني العبارة نفسها في طرفي المقارنة؛ وتقييد الثانية داخل الترجمة يحسم توترًا لاهوتيًا يتركه النص للسياق الأوسع.
- issue: كيفية فهم إضافة ζωῆς إلى δικαίωσιν
  choice: تبريرًا يؤدّي إلى الحياة
  alternative: تبرير الحياة
  rationale: الصياغة المختارة تعرض علاقة النتيجة على نحو طبيعي، بينما تُذكر الصياغة الأقرب حرفيًا في الحاشية لأنها قد تحتمل أكثر من تحليل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حوفظ على البناء المتوازي بين الزلّة الواحدة وعمل البر الواحد، وعلى التكرار المقصود لعبارة «جميع الناس».
