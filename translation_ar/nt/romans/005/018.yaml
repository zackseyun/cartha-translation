    rationale: '«الدينونة» قد تدل على فعل القضاء أو الحكم عمومًا، أما κατάκριμα فتعني نتيجة الحكم القضائية: الإدانة.'
  revised_text: فإذًا، كما أن تعدِّيًا واحدًا جلب الإدانة على جميع الناس، كذلك أيضًا جلب عملُ برٍّ واحد لجميع الناس تبريرًا يؤدّي إلى الحياة.[a]
