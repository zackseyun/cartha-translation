  to: فإن الخطيئة كانت في العالم قبل الشريعة، لكن الخطيئة لا تُحسَب[a] حيث لا توجد شريعة.
  rationale: حُذفت إضافة «مجيء» لتجنب إدخال فعل غير مصرّح به في الأصل، واستُبدلت «فقد» بـ«فإن» لإظهار الصلة التفسيرية التي تفيدها γάρ. وبقي التوتر المقصود بين وجود الخطيئة وعدم احتسابها محفوظًا، مع إبقاء الحاشية في موضعها.
