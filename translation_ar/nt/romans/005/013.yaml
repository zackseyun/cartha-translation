source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: ar
  text: فإن الخطيئة كانت في العالم قبل الشريعة، لكن الخطيئة لا تُحسَب[a] حيث لا توجد شريعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تُقيَّد في الحساب»، أو: «لا تُنسب».'
    reason: بدائل معجمية تحفظ الصورة الحسابية للفعل اليوناني وإمكان دلالته على النسبة أو الاحتساب.
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: فقد ... قبل مجيء الشريعة
  rationale: ينقل الحدّ الزمني الذي تشير إليه العبارة اليونانية بصياغة عربية طبيعية، مع إبقاء الشريعة الموسوية مفهومة من سياق الحديث عن المدة من آدم إلى موسى.
- source_word: ἁμαρτία
  choice: الخطيئة
  rationale: يحافظ على المفرد التجريدي عند بولس، من غير حصره في خطايا منفردة أو إزالة إمكان حضوره بوصفه قوة فاعلة في السياق.
- source_word: ἐν κόσμῳ
  choice: في العالم
  rationale: مقابل عربي مباشر وطبيعي يدل على العالم البشري الذي كانت الخطيئة حاضرة فيه.
- source_word: ἐλλογεῖται
  choice: تُحسَب
  rationale: تعبير واضح يحفظ الدلالة الحسابية أو القضائية للفعل من غير إدخال مصطلح لاهوتي تقني في المتن.
- source_word: μὴ ὄντος νόμου
  choice: في غياب الشريعة
  rationale: يؤدي معنى التركيب المطلق الذي يجعل عدم وجود الشريعة ظرفًا أو شرطًا، من غير الجزم بين الدلالة المكانية والزمنية.
theological_decisions:
- issue: المقصود بكلمة νόμος
  choice: الشريعة، مع الإشارة السياقية إلى شريعة موسى
  alternative: شريعة أو قانون بمعنى عام
  rationale: سياق رومية 5، ولا سيما ذكر المدة من آدم إلى موسى، يرجّح شريعة موسى. ومع ذلك لا يضيف المتن اسم موسى، فلا يتجاوز ما يصرح به النص.
- issue: قوة الفعل ἐλλογεῖται
  choice: لا تُحسَب
  alternative: لا تُقيَّد في الحساب؛ لا تُنسب
  rationale: الصياغة المختارة تحفظ الصورة الحسابية والمعنى القضائي المحتمل، ولا تحسم النقاش اللاهوتي المتعلق بنسبة الخطيئة أو احتسابها.
- issue: العلاقة بين وجود الخطيئة وعدم احتسابها
  choice: الإبقاء على التوتر كما هو من غير تفسير
  alternative: تفسير العبارة بأن الخطيئة لم تكن موجودة أو لم تكن تستوجب عقابًا
  rationale: يؤكد النص وجود الخطيئة ثم ينفي احتسابها في غياب الشريعة؛ لذلك ينبغي عدم تسوية هذا التوتر بإضافة تفسير غير مصرّح به.
translation_notes:
  register: العربية فصحى حديثة واضحة ورصينة. استُخدمت «الشريعة» لأنها الأنسب في هذا السياق البولسي للإشارة إلى شريعة موسى، ووضعت علامة الحاشية عند الفعل الذي تشرحه مباشرة.
