  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: ar
  text: لكي، كما ملكت الخطيئة في الموت، كذلك تملك النعمة أيضًا بالبرّ[a] إلى حياة أبدية بيسوع المسيح ربنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالعدل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تنقل دلالة الغاية أو النتيجة التي تحكم فعل الصيغة الاحتمالية، وتصل العبارة بما قبلها على نحو طبيعي.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: ملكت / تملك
  rationale: يحفظ الفعلان استعارة المُلك المتوازية التي يشخّص بها بولس الخطيئة والنعمة، مع مراعاة الماضي في الأول والبنية الغائية في الثاني.
- source_word: ἐν τῷ θανάτῳ
  choice: في الموت
  rationale: يحافظ على الإيجاز وعلى الدلالة الأقرب لحرف الجر ἐν بوصف الموت مجالًا لسيادة الخطيئة، من غير تحويله صراحة إلى وسيلة.
- source_word: ἡ χάρις
  choice: النعمة
  rationale: المقابل العربي المألوف الذي يحفظ التشخيص اللاهوتي والتقابل مع الخطيئة.
- source_word: διὰ δικαιοσύνης
  choice: بالبرّ
  rationale: تنقل διά مع المضاف إليه بوصفها وسيلة، وتستعمل المقابل العربي الراسخ لـ δικαιοσύνη، مع إثبات البعد البديل «العدل» في الحاشية.
- source_word: εἰς ζωὴν αἰώνιον
  choice: فتؤدي إلى حياة أبدية
  rationale: يُظهر هذا التعبير القوة الاتجاهية لـ εἰς بوضوح عربي طبيعي؛ وإضافة «فتؤدي» تفسير نحوي محدود لا يحدد فاعلًا يتجاوز غموض التركيب اليوناني.
- source_word: Ἰησοῦ Χριστοῦ
  choice: بيسوع المسيح
  rationale: «المسيح» في العربية لقب مفهوم وراسخ، ويحافظ على الوظيفة اللقبية لـ Χριστός من غير غرابة أسلوبية.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ربنا
  rationale: صياغة عربية طبيعية ودقيقة للقب κύριος مع ضمير المتكلمين.
theological_decisions:
- issue: دلالة δικαιοσύνη في السياق البولسي
  choice: بالبرّ
  alternative: بالعدل
  rationale: «البرّ» يحفظ الاستعمال البولسي والكتابـي المألوف، بينما تُثبت الحاشية إمكان دلالة «العدل» حتى لا يُطمس المدى الأخلاقي والقضائي للكلمة.
- issue: وظيفة Χριστός أهو لقب أم اسم ذو استعمال شبه عَلَمي
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» هو المقابل العربي الحي للقب «الممسوح»، ويفهمه القارئ بوصفه لقبًا مع بقائه طبيعيًا في العبارة الرسولية.
- issue: تعلّق εἰς ζωὴν αἰώνιον ودلالته
  choice: فتؤدي إلى حياة أبدية
  alternative: إلى حياة أبدية
  rationale: توضح الصياغة الاتجاه أو النتيجة المقصودة من εἰς، من غير الجزم بما إذا كان التعلّق الأقرب هو بملك النعمة وحده أو بالبر بوصفه الوسيلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي البلاغي بين مُلك الخطيئة ومُلك النعمة، وتُركت صورة «في الموت» موجزة كما في اليونانية. وُضعت علامة الحاشية [a] مباشرة بعد «بالبرّ».
