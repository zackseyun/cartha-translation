lexical_decisions:
- source_word: Δικαιωθέντες
  choice: إذ قد بُرِّرنا
  rationale: يحافظ على صيغة المبني للمجهول وعلى المعنى القضائي للفعل δικαιόω، من غير توسيعه إلى صياغة عقائدية أضيق مثل «أُعلِن أننا أبرار» أو «جُعلنا أبرارًا».
- source_word: οὖν
  choice: فـ
  rationale: الفاء في «فإذ» تنقل الاستنتاج المترتب على الحجة السابقة بصورة طبيعية وموجزة في العربية.
- source_word: ἐκ πίστεως
  choice: بالإيمان
  rationale: تؤدي المعنى الاصطلاحي الطبيعي للتركيب اليوناني، مع إثبات البديل الأقرب إلى البنية المصدرية «على أساس الإيمان» في الحاشية.
- source_word: εἰρήνην
  choice: سلام
  rationale: يحفظ سعة الاسم اليوناني ولا يحصره في «المصالحة» أو في شعور نفسي بالطمأنينة.
- source_word: ἔχομεν
  choice: لنا
  rationale: يعبر عن قراءة الخبر ἔχομεν، أي امتلاك السلام في الحاضر؛ أما قراءة الحث «ليكن لنا» فمثبتة في الحاشية بوصفها اختلافًا نصيًا.
- source_word: πρὸς τὸν θεὸν
  choice: مع الله
  rationale: هو التعبير العربي الطبيعي عن علاقة السلام المقصودة في السياق.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: بربنا
  rationale: الباء تؤدي معنى الوساطة في διὰ هنا بإيجاز عربي فصيح، مع إبقاء لقب «ربنا» كما في المصدر.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: ينقل الاسم واللقب بصيغتهما العربية المألوفة، ويبيّن في الحاشية معنى اللقب اليوناني Χριστός.
theological_decisions:
- issue: دلالة δικαιωθέντες في لاهوت بولس
  choice: «بُرِّرنا» من غير شرح عقائدي موسع
  alternative: «أُعلِن أننا أبرار» أو «جُعلنا أبرارًا»
  rationale: النص يقرر وقوع فعل التبرير، لكنه لا يفصل في هذه الآية وحدها كيفية ذلك الفعل؛ لذا تحافظ الصياغة على التوتر الدلالي ولا تحسمه مذهبيًا.
- issue: معنى «سلام مع الله»
  choice: الإبقاء على لفظ «سلام» بوصفه علاقة سلام مع الله
  alternative: «مصالحة مع الله» أو «طمأنينة من الله»
  rationale: الاسم اليوناني هو «سلام»، وهو أوسع من تفسيره بالمصالحة وحدها أو بالشعور الداخلي وحده.
- issue: الاختلاف النصي في ἔχομεν / ἔχωμεν
  choice: 'اتباع قراءة SBLGNT الخبرية: «لنا»'
  alternative: 'القراءة الحثية: «ليكن لنا سلام»'
  rationale: النص المصدر المعطى يقرأ ἔχομεν بصيغة الخبر، مع حفظ القراءة المخالفة في حاشية واضحة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت صياغة موجزة تحافظ على ترتيب الحجة وعلى المبني للمجهول، مع تجنب العبارات الطائفية أو الشروح العقائدية المدرجة في صلب الآية.
