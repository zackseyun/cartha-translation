  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: ar
  text: وليس ذلك فقط، بل نفتخر أيضًا بالله[a] من خلال ربنا يسوع المسيح، الذي به نلنا الآن المصالحة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نبتهج بالله» أو «نعتز بالله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: نفتخر
  rationale: ينقل المعنى المباشر للفعل، أي الاعتزاز أو التباهي الواثق، مع كون الله لا الذات موضع الافتخار؛ ويُذكر «نبتهج» في الحاشية بوصفه احتمالًا سياقيًا.
- source_word: ἐν τῷ θεῷ
  choice: بالله
  rationale: الباء عربية طبيعية للتعبير عن متعلق الافتخار وموضعه، وتحافظ على كون الله موضوع هذا الافتخار.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: بربنا
  rationale: تنقل διά الدالة على الوساطة، وتحافظ «ربنا» على الاستعمال المسيحاني المألوف لكلمة κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويبقى هنا لقبًا ذا دلالة لا مجرد جزء من اسم.
- source_word: τὴν καταλλαγὴν
  choice: المصالحة
  rationale: تنقل استعادة العلاقة التي يعبّر عنها καταλλαγή، مع إثبات التعريف العائد إلى المصالحة المحددة الموصوفة في السياق السابق.
- source_word: νῦν ... ἐλάβομεν
  choice: نلنا الآن
  rationale: يحافظ الماضي «نلنا» على قيمة الفعل اليوناني المنجز، وتفيد «الآن» تحقق المصالحة في الوضع الحاضر.
theological_decisions:
- issue: دلالة الافتخار في الله
  choice: نفتخر بالله
  alternative: نبتهج بالله
  rationale: اختير اللفظ الأقرب إلى καυχάομαι من غير تحويله إلى فرح عام؛ وتمنع عبارة «بالله» فهمه على أنه تعظيم خاطئ للذات.
- issue: ترجمة اللقب Χριστός
  choice: المسيح
  alternative: المسيح الموعود
  rationale: «المسيح» لقب عربي واضح وراسخ يحفظ الدلالة المسيحانية من غير إضافة تفسيرية غير موجودة في النص.
- issue: أداة المصالحة ووسيطها
  choice: الذي به نلنا الآن المصالحة
  alternative: الذي بواسطته نلنا الآن المصالحة
  rationale: يحفظ الضمير عوده إلى يسوع المسيح ودوره الوسيط، من غير توسع تفسيري في كيفية المصالحة.
translation_notes:
  register: 'صياغة عربية فصحى معاصرة وموقرة. استُعملت «بل إننا أيضًا» لاستكمال العبارة اليونانية الموجزة طبيعيًا، وحُفظ تتابع الفكرة: الافتخار بالله، بوساطة الرب يسوع المسيح، ثم تلقي المصالحة الآن.'
