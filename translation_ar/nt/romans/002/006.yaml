translation:
  language: ar
  text: الَّذِي سَيُجَازِي كُلَّ وَاحِدٍ بِحَسَبِ أَعْمَالِهِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفعاله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: الَّذِي
  rationale: اسم موصول يربط العبارة بالله المذكور في السياق السابق، ويحافظ على اتصال الآية بما قبلها.
- source_word: ἀποδώσει
  choice: سَيُجَازِي
  rationale: ينقل معنى إعطاء كل إنسان ما يقابل عمله في سياق الدينونة، بصياغة عربية واضحة ذات قوة قضائية، من غير قصر المعنى على الثواب الإيجابي.
- source_word: ἑκάστῳ
  choice: كُلَّ وَاحِدٍ
  rationale: يحفظ القوة التوزيعية المفردة، ويبرز محاسبة كل شخص على حدة.
- source_word: κατὰ
  choice: بِحَسَبِ
  rationale: تعبير عربي طبيعي ودقيق عن المعيار الذي تتم على أساسه المجازاة.
- source_word: τὰ ἔργα
  choice: أَعْمَالِ
  rationale: المقابل المباشر الذي يحافظ على الاتساق مع استعمال ἔργα في رومية وعلى التوتر اللاهوتي في النص.
- source_word: αὐτοῦ
  choice: ـهِ
  rationale: ضمير المفرد يعود إلى «كل واحد» ويؤدي في العربية معنى كل شخص على نحو طبيعي، من غير حاجة إلى حصره في الذكور.
theological_decisions:
- issue: الدينونة بحسب الأعمال
  choice: الإبقاء على صيغة المجازاة بحسب الأعمال من غير تلطيف أو مواءمة تفسيرية
  alternative: أن يُعامِل كل واحد، أو أن يكافئ كل واحد
  rationale: يصرح النص بأن الله يجازي كل شخص بحسب أعماله؛ لذلك ينبغي الحفاظ على هذا التوتر اللاهوتي وعدم حسم علاقته بتعليم بولس الأوسع عن التبرير داخل الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. اختير «سيجازي» لنقل معنى المقابلة القضائية الكامن في ἀποδώσει، و«أعماله» للمحافظة على المصطلح البولسي. لا تلزم حاشية للجنس النحوي، لأن ضمير المفرد في «كل واحد ... أعماله» يُفهم عربيًا على وجه العموم.
