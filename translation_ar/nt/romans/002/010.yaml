  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: ar
  text: أَمَّا كُلُّ مَنْ يَعْمَلُ الْخَيْرَ[a]، فَلَهُ الْمَجْدُ وَالْكَرَامَةُ وَالسَّلَامُ، لِلْيَهُودِيِّ أَوَّلًا وَلِلْيُونَانِيِّ أَيْضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما هو صالح».'
    reason: lexical_alternative
  - marker: b
    text: يُراد بـ«اليوناني» هنا على الأرجح غير اليهودي عمومًا، أي الأممي.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: الْمَجْدُ
  rationale: المقابل العربي الكتابي المألوف، ويحفظ دلالة التكريم والجزاء الأخروي في السياق.
- source_word: τιμή
  choice: الْكَرَامَةُ
  rationale: تلائم اقتران اللفظة بالمجد، وتنقل معنى التشريف والتقدير بوضوح.
- source_word: εἰρήνη
  choice: السَّلَامُ
  rationale: يحفظ الاتساع الدلالي للفظة اليونانية من غير حصرها في راحة نفسية أو سلام اجتماعي أو خير عهدي بعينه.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: كُلُّ مَنْ يَعْمَلُ
  rationale: صياغة عربية طبيعية تنقل وصف الشخص بالممارسة المستمرة أو المميِّزة له، من غير حرفية ثقيلة.
- source_word: τὸ ἀγαθόν
  choice: الْخَيْرَ
  rationale: تنقل الاسم المعرَّف المشتق من الصفة بمعنى «الخير» أو «ما هو صالح»، وتنسجم طبيعيًا مع الفعل «يعمل».
- source_word: Ἰουδαίῳ
  choice: لِلْيَهُودِيِّ
  rationale: مقابل مباشر يحفظ المفرد التمثيلي في العبارة اليونانية.
- source_word: πρῶτον
  choice: أَوَّلًا
  rationale: يحفظ ترتيب النص الموجز من غير شرح زائد لطبيعة هذه الأولوية.
- source_word: Ἕλληνι
  choice: لِلْيُونَانِيِّ
  rationale: يحفظ اللفظ اليوناني وصيغة التقابل البولسية «اليهودي واليوناني»، مع بيان مدلوله الأوسع المحتمل في الحاشية.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: تؤدي المقابلة مع حكم الغضب والضيق في الآية السابقة بأسلوب عربي طبيعي وواضح.
- source_word: τε ... καὶ
  choice: أَوَّلًا ثُمَّ
  rationale: تُظهر في العربية ترتيب الطرفين بوضوح مع بقاء معنى اشتمالهما كليهما؛ وهي صياغة طبيعية للسياق.
theological_decisions:
- issue: مدلول Ἕλληνι في التقابل بين اليهودي واليوناني
  choice: إبقاء «اليوناني» في المتن، مع توضيح أنه قد يدل هنا على غير اليهودي عمومًا.
  alternative: الأممي
  rationale: الترجمة الحرفية تحفظ التعبير الأصلي، بينما تمنع الحاشية تضييق معناه على ذوي العِرق أو الثقافة اليونانية وحدهم، من غير حسم ما تركه الاستعمال ذا سعة.
- issue: طبيعة الأولوية في πρῶτον
  choice: ترجمة اللفظة «أولًا» بلا تفسير إضافي في المتن.
  alternative: شرحها بأنها أولوية تاريخية خلاصية أو أولوية في المسؤولية
  rationale: الآية تثبت الترتيب لكنها لا تشرح هنا طبيعته، لذلك يحفظ النص التوتر اللاهوتي ولا يفرض تفسيرًا مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل تركيب «أمّا... فـ» لإبراز المقابلة مع الآية السابقة، وقُدِّم «كل من يعمل الخير» لسلامة الجملة العربية، مع الحفاظ على عناصر الجزاء الثلاثة وترتيب اليهودي ثم اليوناني. وُضعت علامتا الحاشيتين عند اللفظتين اللتين تشرحهما كل حاشية.
