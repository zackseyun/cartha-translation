  source_fidelity: 'النص ينقل عناصر الآية الرئيسة بأمانة: المقابلة مع الآية السابقة، والمجد والكرامة والسلام، وفعل الخير، وترتيب اليهودي ثم اليوناني. لكن «ثم» في الخاتمة أقوى من اليونانية في الإيحاء بالتعاقب الزمني، ولا تُظهر بوضوح شمول الطرف الثاني الذي تفيده τε ... καί («وأيضًا»).'
