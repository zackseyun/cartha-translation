  terminology: «المجد والكرامة والسلام»، و«اليهودي»، و«اليوناني» اختيارات مناسبة. تبقى حاشية «اليوناني» مفيدة في بيان الاستعمال الأوسع المحتمل من غير استبدال لفظ النص.
