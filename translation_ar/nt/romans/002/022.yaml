base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: ar
  text: 'يا مَن تقول: «لا تَزْنِ»، أَتَزْني؟ ويا مَن تستقذر الأصنام، أَتَنْهَبُ المعابد؟[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بمعنى أوسع: «أَتَنْتَهِكُ المقدسات؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: يا مَن تقول
  rationale: ينقل اسم الفاعل المعرَّف المستعمل استعمال الاسم إلى خطاب مباشر طبيعي، ويحافظ على أسلوب بولس الجدلي.
- source_word: μὴ μοιχεύειν
  choice: لا تَزْنِ
  rationale: ينقل مضمون القول بوصفه نهيًا، بصياغة عربية موجزة ومألوفة توافق الوصية.
- source_word: μοιχεύεις
  choice: أَتَزْني؟
  rationale: يحافظ على المضارع وعلى قوة السؤال الإنكاري الاتهامي من غير تقييده بواقعة زمنية واحدة.
- source_word: ὁ βδελυσσόμενος
  choice: يا مَن تستقذر
  rationale: الفعل يدل على نفور شديد؛ و«تستقذر» واضحة ومعاصرة وتحفظ قوة الاشمئزاز المقصودة.
- source_word: τὰ εἴδωλα
  choice: الأصنام
  rationale: المقصود في السياق صور العبادة الوثنية، و«الأصنام» هي المقابل العربي الدقيق والمألوف.
- source_word: ἱεροσυλεῖς
  choice: أَتَسْلُب الهياكل؟
  rationale: يُبقي المعنى المحسوس الأرجح، أي نهب المعابد أو ممتلكاتها، ويحفظ المفارقة مع استقذار الأصنام؛ ويُذكر المعنى الأوسع في الحاشية.
theological_decisions:
- issue: مدى دلالة ἱεροσυλεῖς
  choice: أَتَسْلُب الهياكل؟
  alternative: أَتَنتهك المقدسات؟
  rationale: اللفظ قد يدل تحديدًا على سلب المعابد، وقد يتسع لانتهاك المقدسات عمومًا. اختير المعنى المحسوس في المتن مع إبقاء الاحتمال الأوسع في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة خطابية كريمة. استُعمل النداء «يا مَن» لإظهار توازي العبارتين، وحُفظ السؤالان الإنكاريان والإيقاع الموجز للنص اليوناني.
