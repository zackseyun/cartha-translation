  source_fidelity: 'الترجمة تنقل بدقة البنية التابعة لفعل الثقة في اليونانية: المخاطَب واثق بأن له هو نفسه صفة «مرشد للعميان» و«نور للذين في الظلمة»، من غير أن تجعل الوصف تقريرًا مستقلًا يقرّه الكاتب. وحُفظ الربط الاستئنافي في الواو والتوازي بين الوصفين.'
  naturalness: 'الصياغة فصيحة معاصرة وواضحة: «وأنت واثقٌ بأنك أنت مرشدٌ للعميان، ونورٌ للذين في الظلمة» طبيعية وتحافظ على النبرة الجدلية المتصلة بالسياق. والتوكيد في «أنت» مناسب، وإن كان غير لازم نحويًا، لأنه يعكس قوة الضمير الانعكاسي اليوناني.'
  terminology: «مرشد» مقابل مناسب لـ ὁδηγός في الاستعارة، و«العميان» و«الذين في الظلمة» واضحان وأمينان للنص. و«نور» يحافظ على الصورة المجازية الأصلية بلا تحميل تفسيري أو مذهبي.
