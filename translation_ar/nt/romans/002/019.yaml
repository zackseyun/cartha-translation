  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: ar
  text: وأنت واثقٌ بأنك أنت مرشدٌ للعميان، ونورٌ للذين في الظلمة،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: واثقٌ
  rationale: الفعل في صيغة التام يدل على حالة مستقرة من الثقة أو الاقتناع؛ و«واثق» تنقل هذا المعنى بوضوح وتناسب نبرة بولس التي تكشف اعتداد المخاطَب بنفسه.
- source_word: τε
  choice: وَ
  rationale: تربط الأداة هذه العبارة بما قبلها، وتؤدي الواو وظيفتها من غير مبالغة في الترجمة.
- source_word: σεαυτὸν
  choice: بأنك أنت
  rationale: إظهار الضمير المنفصل «أنت» يحفظ توكيد الضمير الانعكاسي اليوناني والتركيز على نظرة المخاطَب إلى نفسه.
- source_word: ὁδηγὸν
  choice: مرشدٌ
  rationale: «مرشد» مقابل عربي طبيعي ودقيق لمن يقود غيره ويوجهه في هذا السياق المجازي.
- source_word: τυφλῶν
  choice: للعميان
  rationale: يحفظ الجمع الاسمي العام ويؤدي علاقة المضاف إليه مع «مرشد» بتعبير عربي واضح.
- source_word: φῶς
  choice: نورٌ
  rationale: «نور» هو المقابل العربي المألوف والدقيق للاستعارة التي تصف من يمنح الهداية أو الاستنارة.
- source_word: τῶν ἐν σκότει
  choice: للذين في الظلمة
  rationale: يحفظ البنية الشخصية والاستعارة الأصلية، مع استعمال عربي فصيح وطبيعي.
theological_decisions:
- issue: هل يقرر بولس حقيقة كون المخاطَب مرشدًا ونورًا أم يصف ثقته بنفسه؟
  choice: ربط الوصف كله بعبارة «واثقٌ بأنك»
  alternative: 'صياغة الوصف كتقرير مستقل: «وأنت مرشد للعميان ونور...»'
  rationale: النص اليوناني يجعل «مرشدًا» و«نورًا» خبرين للمصدر «أن تكون» الواقع تحت فعل الثقة، ولذلك يصف اقتناع المخاطَب بنفسه من غير أن يصادق صراحةً على صحة ادعائه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي البلاغي بين «مرشد للعميان» و«نور للذين في الظلمة»، كما حُفظ توكيد المخاطَب في «بأنك أنت».
