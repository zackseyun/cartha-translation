  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: ar
  text: ومؤدِّبًا للحمقى، ومعلِّمًا للأطفال، وحائزًا في الشريعة تجسيدَ المعرفة والحق[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صورةَ المعرفة والحق».'
    reason: يحمل μόρφωσις معنى التجسيد أو الصورة/الصيغة، ولا يحسم السياق تمامًا بين هذه الدلالات المتقاربة.
lexical_decisions:
- source_word: παιδευτὴν
  choice: مؤدِّبًا
  rationale: يدل اللفظ على من يدرّب ويهذّب، ويحافظ «مؤدِّبًا» على البعد التربوي من غير حصره في العقاب.
- source_word: ἀφρόνων
  choice: للحمقى
  rationale: ينقل معنى انعدام الحكمة ويحفظ النبرة الحادّة في تعداد المتكلم لمزاعمه.
- source_word: διδάσκαλον
  choice: معلِّمًا
  rationale: هو المقابل العربي المباشر والطبيعي للفظ الدال على المعلّم.
- source_word: νηπίων
  choice: للأطفال
  rationale: يحفظ الصورة الحرفية لصغار السن، مع بقاء إمكان استعمالها مجازيًا لغير الناضجين.
- source_word: ἔχοντα
  choice: وحائزًا
  rationale: يحافظ على صيغة الوصف الحالية واتصالها بسلسلة الأوصاف المنصوبة في السياق، وهو أفصح هنا من ترجمة حرفية بـ«لديك».
- source_word: μόρφωσιν
  choice: تجسيدَ
  rationale: ينقل معنى الصيغة أو التحقق الملموس للمعرفة والحق، مع إثبات البديل «صورة» في الحاشية لصون السعة الدلالية.
- source_word: γνώσεως
  choice: المعرفة
  rationale: المقابل الطبيعي للفظ، ويحافظ على اقترانه بالحق.
- source_word: ἀληθείας
  choice: الحق
  rationale: تعبير عربي فصيح ومألوف ينقل معنى الحقيقة والحق في هذا السياق.
- source_word: ἐν τῷ νόμῳ
  choice: في الشريعة
  rationale: يحفظ دلالة حرف الجر ويبيّن أن المقصود هو الشريعة اليهودية من غير إضافة تفسيرية.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى واضحة ذات نبرة تعليمية رصينة. حُفظت بنية التعداد المنصوب واتصال الآية بما قبلها، كما حُفظت الشرطة الختامية الدالة على استمرار الجملة. وُضع مؤشر الحاشية عند العبارة التي تخصها، لا بعد «الحمقى».
