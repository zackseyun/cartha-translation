base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: ar
  text: لأن مَن كان يهوديًا في الظاهر[a] ليس هو اليهودي، ولا الختان الذي في الظاهر في الجسد[b] هو الختان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: خارجيًا، أو بحسب ما هو ظاهر للعيان.'
    reason: lexical_alternative
  - marker: b
    text: تعبير «في الجسد» يشير هنا إلى الختان البدني المحسوس.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: اليهودي
  rationale: يفيد السياق الهوية اليهودية المرتبطة بالعهد والشريعة والختان، لا مجرد الانتساب الجغرافي إلى اليهودية.
- source_word: ἐν τῷ φανερῷ
  choice: في الظاهر
  rationale: تعبير عربي طبيعي يحفظ معنى الأمر الخارجي المرئي، ويهيئ للمقابلة مع الباطن في الآية التالية.
- source_word: περιτομή
  choice: الختان
  rationale: هو المقابل العربي الدقيق والمألوف لعلامة العهد التي يناقشها السياق.
- source_word: ἐν σαρκί
  choice: في الجسد
  rationale: المقصود هنا الختان البدني المحسوس؛ و«الجسد» أوضح في العربية المعاصرة من «اللحم» ويحفظ المعنى الحرفي في هذا السياق.
- source_word: γὰρ
  choice: لأن
  rationale: تحفظ الصلة التفسيرية بالحجة السابقة وتأتي طبيعية في العربية.
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: ولا الختان هو ما كان في الظاهر في الجسد
  rationale: يستكمل الحذف في اليونانية استكمالًا محدودًا يقتضيه وضوح العربية، مع إبقاء النفي منصبًّا على الختان الخارجي البدني بوصفه وحده حقيقة الختان.
theological_decisions:
- issue: دلالة الهوية العهدية في «اليهودي» و«الختان»
  choice: تحفظ الصياغة المفارقة التي تقول إن الهوية أو العلامة الظاهرة وحدها لا تستوفي الحقيقة المقصودة.
  alternative: أن تُفهم الآية على أنها تنفي الهوية اليهودية ذاتها، أو تستبدلها بفئة روحية محضة.
  rationale: النص يقابل بين الظاهر والباطن، ويُتمّ المقابلة في الآية التالية؛ لذلك لا ينبغي أن تضيف الترجمة نفيًا مطلقًا لليهودية أو تقريرًا لاهوتيًا يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «في الظاهر» بصورة متكررة للحفاظ على البنية والمقابلة اللفظية في الأصل، مع تجنب تحميل النص تفسيرًا مذهبيًا زائدًا.
