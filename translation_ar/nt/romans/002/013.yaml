source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: ar
  text: لأن الذين يسمعون الشريعة ليسوا أبرارًا أمام الله، بل الذين يعملون بالشريعة هم الذين سيُبرَّرون.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيُعلَن أنهم أبرار»؛ ويجوز أيضًا: «ستثبت براءتهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: الذين يسمعون
  rationale: صياغة عربية طبيعية تحفظ المقابلة البلاغية بين سماع الشريعة والعمل بها، من غير أن توحي بأن المقصود مجرد المستمعين عمومًا.
- source_word: νόμου
  choice: الشريعة
  rationale: مع أن الاسم بلا أداة تعريف في اليونانية، فإن السياق في رومية يشير إلى الشريعة المعهودة، و«الشريعة» أوضح وأفصح عربيًا من «ناموس» للقارئ المعاصر.
- source_word: δίκαιοι
  choice: أبرارًا
  rationale: يحفظ المصطلح الأخلاقي والقضائي في الاستعمال البولسي، ويلائم وصف مكانة الأشخاص أمام الله.
- source_word: παρὰ τῷ θεῷ
  choice: أمام الله
  rationale: ينقل معنى الوقوف في حضرة الله وتحت حكمه أو تقويمه بصياغة موجزة وطبيعية.
- source_word: ποιηταὶ
  choice: الذين يعملون بالشريعة
  rationale: ينقل القوة الاسمية للفظ اليوناني في عربية طبيعية، ويحفظ التضاد مع «الذين يسمعون الشريعة».
- source_word: δικαιωθήσονται
  choice: سيُبرَّرون
  rationale: يحافظ على المبني للمجهول وعلى الصلة الاصطلاحية بفعل δικαιόω في رسالة رومية، من غير حصر المعنى في تفسير لاهوتي واحد.
theological_decisions:
- issue: دلالة δικαιωθήσονται القضائية واللاهوتية
  choice: سيُبرَّرون
  alternative: 'سيُعلَن أنهم أبرار؛ أو: ستثبت براءتهم'
  rationale: «سيُبرَّرون» يحفظ المصطلح البولسي والمبني للمجهول والتوتر بين إعلان البر وإثباته، بينما تعرض الحاشية البدائل الدلالية من غير أن تجعل أحدها تفسيرًا حصريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «الشريعة» بدل «الناموس» لسهولة الفهم المعاصر، مع الحفاظ على التوازي بين السامعين والعاملين وعلى المصطلح اللاهوتي «يُبرَّرون».
