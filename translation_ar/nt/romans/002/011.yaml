lexical_decisions:
- source_word: γάρ
  choice: لِأَنَّهُ
  rationale: تفيد الأداة تعليل ما سبق وبيان أساسه، و«لأنه» تؤدي هذه القوة التفسيرية بوضوح في العربية.
- source_word: προσωπολημψία
  choice: مُحَابَاةٌ
  rationale: تدل الكلمة على تفضيل شخص بسبب مكانته أو اعتبارات ظاهرية؛ و«محاباة» لفظ عربي طبيعي ودقيق في السياق الأخلاقي والقضائي.
- source_word: παρὰ τῷ θεῷ
  choice: عِنْدَ اللهِ
  rationale: تفيد παρά مع المجرور هنا الحضور أو العلاقة؛ و«عند الله» تقابل التركيب اليوناني بصورة طبيعية وتحافظ على صيغته.
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: لِأَنَّهُ لَيْسَ عِنْدَ اللهِ مُحَابَاةٌ.
  rationale: حُفظ التركيب الوجودي في اليونانية بدل تحويله إلى صياغة فعلية مثل «لأن الله لا يحابي»، مع بقاء العبارة واضحة في العربية المعاصرة.
theological_decisions:
- issue: التعبير عن عدم محاباة الله
  choice: 'صياغة العبارة تقريرًا عامًا: «ليس عند الله محاباة».'
  alternative: «لأن الله لا يحابي أحدًا».
  rationale: كلتا الصياغتين تؤديان المعنى العام، لكن المختارة أقرب إلى التركيب الوجودي اليوناني ولا تضيف مفعولًا به غير مصرح به في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «عند الله» للمحافظة على بنية الأصل، و«محاباة» بوصفها المقابل الطبيعي غير العتيق.
