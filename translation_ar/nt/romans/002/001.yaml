id: ROM.2.1
reference: Romans 2:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: ar
  text: لذلك لا عذر لك، أيها الإنسان، يا كلَّ من يدين؛ لأنك، إذ تدين آخرَ، تدين نفسك، لأنك أنتَ الذي تدين تمارس الأفعال نفسها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: لِذَلِكَ
  rationale: تفيد الاستنتاج المبني على الحجة السابقة، وتحافظ «لذلك» على الترابط المنطقي بصياغة عربية طبيعية.
- source_word: ἀναπολόγητος
  choice: لَا عُذْرَ لَكَ
  rationale: تعبير عربي واضح يحفظ معنى انعدام الحجة أو الدفاع المقبول، مع إيحاء قضائي مناسب للسياق.
- source_word: ὦ ἄνθρωπε
  choice: يَا أَيُّهَا الْإِنْسَانُ
  rationale: يحفظ النداء المفرد المباشر، و«الإنسان» في العربية صالح هنا للخطاب التمثيلي العام من غير حصره في الذكر.
- source_word: πᾶς ὁ κρίνων
  choice: كُلَّ مَنْ يَدِينُ غَيْرَهُ
  rationale: يحفظ قوة التعميم في πᾶς ويبيّن أن المخاطَب هو كل من يمارس إدانة الآخر. أُضيف «غيره» توضيحًا طبيعيًا لمتعلَّق الإدانة الذي يصرّح به السياق التالي.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: حِينَ تَدِينُ آخَرَ
  rationale: ينقل بصورة طبيعية القوة الزمنية للتركيب اليوناني المضغوط، أي إن الحكم على النفس يقع في فعل إدانة الآخر نفسه؛ ويظل احتمال القوة الوسيلية قائمًا في الأصل.
- source_word: τὸν ἕτερον
  choice: آخَرَ
  rationale: صياغة موجزة وطبيعية تحفظ المقابلة بين المخاطَب والشخص الآخر.
- source_word: κατακρίνεις
  choice: تَحْكُمُ عَلَى نَفْسِكَ
  rationale: يميّز عن κρίνεις ويؤدي معنى الحكم بالإدانة على الذات، من غير إيحاء بأن المخاطَب يملك سلطة قضائية نهائية على نفسه.
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: تُمَارِسُ الْأُمُورَ نَفْسَهَا
  rationale: «تمارس» تعكس دلالة πράσσω على السلوك المتكرر أو الجاري، لا مجرد فعل منفرد.
- source_word: ὁ κρίνων
  choice: أَنْتَ الَّذِي تَدِينُ
  rationale: يحفظ التعريف التوكيدي للمخاطَب بواسطة اسم الفاعل اليوناني ويأتي طبيعيًا في العربية.
theological_decisions:
- issue: الخطاب المفرد التمثيلي في ὦ ἄνθρωπε
  choice: يا أيها الإنسان
  alternative: يا أيها الرجل
  rationale: اللفظة اليونانية ἄνθρωπος تشير هنا إلى الإنسان بوصفه إنسانًا، والخطاب مفرد ذو قوة تمثيلية تشمل كل من يدين؛ و«الإنسان» أدق دلاليًا في العربية من «الرجل» التي قد توحي بحصر جنسي غير مقصود.
- issue: العلاقة بين إدانة الآخر والحكم على الذات
  choice: حين تدين آخر تحكم على نفسك
  alternative: بالأمر الذي تدين به الآخر تحكم على نفسك
  rationale: التركيب ἐν ᾧ يحتمل قوة زمنية ووسيلية متداخلة. اختيرت صياغة عربية طبيعية تبرز أن فعل الإدانة نفسه يصير موضع الحكم على الذات، من دون حسم معنى «المعيار الذي به تدين» حسمًا زائدًا.
- issue: سبب الحكم على الذات
  choice: لأن من يدين يمارس الأمور نفسها
  alternative: لأن مجرد إدانة الآخر خطيئة
  rationale: النص يصرّح بأن أساس الحكم على الذات هو ممارسة الأفعال نفسها؛ فلا ينبغي نقل السبب إلى حكم لاهوتي أوسع لا ينص عليه العدد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، مع مخاطبة مفردة مباشرة ومحافظة على التكرار البلاغي لجذر الإدانة. لم تُضف حاشية لأن «الإنسان» ينقل بطبيعته في العربية القوة العامة للفظة ἄνθρωπος، فلا توجد علامة حاشية لازمة في المتن.
