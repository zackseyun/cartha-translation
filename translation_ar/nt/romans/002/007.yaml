  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: ar
  text: أمّا الذين بثباتهم في عمل الخير يطلبون المجد والكرامة وعدم الفساد، فلهم الحياة الأبدية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: بثباتهم في عمل الخير
  rationale: ينقل معنى المثابرة المستمرة في فعل الخير بصياغة عربية طبيعية، من غير تحويل «العمل» إلى استحقاق تقني.
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: المجد والكرامة وعدم الفساد
  rationale: يحافظ على العناصر الثلاثة وترتيبها؛ و«عدم الفساد» يقابل ἀφθαρσία بدقة ويبقي معناه الأخروي الواسع.
- source_word: ζητοῦσιν
  choice: يطلبون
  rationale: ترجمة مباشرة تدل على التطلع الجاد والسعي، مع إبقاء متعلقاته الثلاثة واضحة.
- source_word: ζωὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: المقابل العربي المألوف والدقيق لعبارة الحياة ذات الصفة الأبدية.
theological_decisions:
- issue: العلاقة بين الثبات في عمل الخير والحياة الأبدية
  choice: الإبقاء على صياغة الآية كما هي، من غير إضافة تفسير لأساس الجزاء أو آليته
  alternative: إضافة ألفاظ مثل «يستحقون» أو «ينالون بالإيمان»
  rationale: النص يقرر الجزاء في سياق الجملة الممتدة من الآية السابقة، لكنه لا يشرح هنا وحدها الآلية اللاهوتية؛ لذلك لا ينبغي حسم التوتر بإضافة غير موجودة.
- issue: القيمة النحوية لـ ἀφθαρσία
  choice: عدم الفساد
  alternative: الخلود
  rationale: «الخلود» قد يتداخل دلاليًا مع «الحياة الأبدية» ويضيّق المعنى؛ أما «عدم الفساد» فيحفظ تمييز اللفظ ومعناه المتعلق بعدم البلى أو الفناء.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة. استُخدم التقابل «أمّا ... فلهم» لاستكمال البنية التقابلية المتصلة بالآية 6، مع تقديم وصف الأشخاص ثم بيان الجزاء وفق تركيب عربي طبيعي.
