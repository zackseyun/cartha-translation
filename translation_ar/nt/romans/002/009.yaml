  source_fidelity: 'المعنى الأساسي منقول بأمانة: دينونة مستقبلية تشمل كل نفس إنسان يفعل الشر، مع إبقاء ترتيب «اليهودي أولًا ثم اليوناني». لكن الباء في «باليهودي ... وباليوناني» تجعل الإحالة النحوية أقل وضوحًا وقد توهم أن الفاعلين متعلقان بالفعل «يفعل» أو أن الشدة تحلّ بهما بوصفهما تركيبين مستقلين، بدل كونهما بيانًا لـ«إنسان».'
