  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: ar
  text: ستحل شدة وضيق على كل نفس إنسان يفعل الشر، اليهودي أولًا واليوناني أيضًا.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل شخص» أو «كل إنسان».'
    reason: lexical_alternative
  - marker: b
    text: أي غير اليهودي في هذا التقابل بين اليهودي واليوناني.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: شدة
  rationale: تنقل معنى المحنة والبلاء الشديد بلغة عربية واضحة، وتبقى متميزة عن στενοχωρία في العبارة المزدوجة.
- source_word: στενοχωρία
  choice: ضيق
  rationale: يحفظ صورة الانحصار والكرب، ويقترن طبيعيًا بـ«شدة» من غير دمج اللفظين في معنى واحد.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: بكل نفس إنسان
  rationale: يحافظ على لفظ «النفس» وصورته في الأصل، مع بيان أن المقصود كل إنسان؛ واستعمال الباء مع «تحل» عربي طبيعي يؤدي معنى ἐπί.
- source_word: τοῦ κατεργαζομένου
  choice: يفعل
  rationale: تعبير مباشر وطبيعي عن اسم الفاعل اليوناني في هذا السياق الأخلاقي، من غير أن يضيف معنى الاعتياد صراحة.
- source_word: τὸ κακόν
  choice: الشر
  rationale: ينقل الاستعمال العام للمفرد المحايد المعرّف، أي الشر بوصفه موضوع الفعل.
- source_word: Ἰουδαίου
  choice: اليهودي
  rationale: يلائم التقابل الإثني الديني المتكرر في رومية، لا مجرد الانتساب الجغرافي إلى اليهودية.
- source_word: Ἕλληνος
  choice: اليوناني
  rationale: يحفظ لفظ بولس وتقابله الصريح بين اليهودي واليوناني، مع توضيح دلالته السياقية في الحاشية بدل استبداله بلفظ تفسيري.
- source_word: πρῶτον
  choice: أولًا
  rationale: يحفظ معنى الأولوية أو الترتيب كما في الأصل من غير تحديد طبيعتها بما يتجاوز النص.
theological_decisions:
- issue: الجملة الاسمية الموجزة في اليونانية لا تذكر فعلًا صريحًا
  choice: ستحل شدة وضيق
  alternative: شدة وضيق على كل نفس إنسان
  rationale: إضافة الفعل المستقبلي تجعل العربية مكتملة وطبيعية، ويؤيدها سياق الدينونة المستقبلية، من غير إضافة مضمون عقائدي جديد.
- issue: طبيعة الأولوية في عبارة «اليهودي أولًا»
  choice: اليهودي أولًا
  alternative: اليهودي قبل غيره
  rationale: أُبقيت العبارة موجزة كما في الأصل، كي لا يُحسم هل الأولوية زمنية أم ترتيبية أم مرتبطة بالمسؤولية في الدينونة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ التركيب التصويري «نفس إنسان» مع حاشية توضح معناه، وحُفظ التقابل «اليهودي/اليوناني» كما ورد في الأصل.
