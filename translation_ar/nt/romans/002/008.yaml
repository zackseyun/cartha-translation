lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: تدفعهم الأنانية
  rationale: ينقل معنى صدور موقفهم عن دافع أناني متحزّب، بصياغة عربية طبيعية، من غير حصر اللفظ في مجرد المنافسة.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: لا يطيعون الحق
  rationale: يحفظ القوة الإرادية والأخلاقية للفعل، أي العصيان ورفض الطاعة، لا مجرد عدم التصديق.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: بل يطيعون الإثم
  rationale: يحافظ على المقابلة المباشرة بين عدم طاعة الحق وطاعة الباطل الأخلاقي.
- source_word: ἀδικίᾳ
  choice: الإثم
  rationale: لفظ عربي واضح ذو دلالة أخلاقية ودينية واسعة؛ ويمكن أن يدل الأصل أيضًا على الظلم، ولذلك أُثبت البديل في الحاشية.
- source_word: ὀργὴ
  choice: سخط
  rationale: يناسب سياق الدينونة ويحمل قوة أشد وأفخم من الغضب العادي.
- source_word: θυμός
  choice: غضب
  rationale: يحفظ تراكم اللفظين الدالين على شدة الغضب من غير استعمال تعبير عربي غريب أو مفرط.
- source_word: implicit verbal ellipsis
  choice: فسخط وغضب
  rationale: يحافظ على إيجاز العبارة الاسمية في اليونانية، مع فاء تربط الجزاء بالفئة المذكورة ضمن سياق الجملة.
theological_decisions:
- issue: مدى دلالة ἀδικία في سياق الدينونة
  choice: الإثم
  alternative: الظلم
  rationale: «الإثم» يحفظ البعد الأخلاقي الشامل لمعارضة الحق في هذا السياق، بينما «الظلم» بديل أصيل يبرز جانب انعدام العدل، فأُبقي في الحاشية منعًا لطمس سعة اللفظ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ تقابل طاعة الحق وطاعة الإثم، كما حُفظ الإيجاز الاسمي في خاتمة الآية. وُضع مؤشر الحاشية بعد العبارة الكاملة التي تتصل بها.
