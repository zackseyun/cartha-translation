  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: ar
  text: فهم يُظهرون أن عمل الشريعة مكتوب في قلوبهم[a]، فيما يشهد ضميرهم أيضًا، وتتّهم أفكارهم بعضها بعضًا أو حتى يدافع بعضها عن بعض[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مطالب الشريعة»، أو «ما تطلبه الشريعة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وأفكارهم تتهمهم أو حتى تدافع عنهم». واليونانية تتضمن حرفيًا معنىً تبادليًا: «بعضها بعضًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: يُظهرون
  rationale: تعبير عربي واضح يحفظ الدلالة الإثباتية للفعل من غير المبالغة فيه بمعنى البرهان القاطع.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: عمل الشريعة
  rationale: يحافظ على الاسم المفرد «عمل» وعلى إيجاز العبارة اليونانية، بدل تفسيرها في المتن بأنها مطالب الشريعة.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: مكتوب في قلوبهم
  rationale: صياغة عربية طبيعية تنقل صورة الكتابة الباطنية بأمانة.
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: إذ يشهد ضميرهم أيضًا
  rationale: تنقل التركيب اليوناني بسلاسة، وتحفظ معنى الشهادة المصاحبة أو المؤيدة من خلال «أيضًا».
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: وتتبادل أفكارهم
  rationale: تحفظ الدلالة التبادلية في ἀλλήλων ضمن تركيب عربي مفهوم، مع إبقاء ضغط العبارة اليونانية ظاهرًا في الحاشية.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: الاتهام أو حتى الدفاع
  rationale: «الدفاع» أقرب إلى معنى ἀπολογέομαι من «التبرير»، و«حتى» تنقل قوة καὶ الواقعة بعد ἢ.
theological_decisions:
- issue: هل تشير العبارة إلى الوعي الأخلاقي الباطني عمومًا أم إلى ما تطلبه الشريعة تحديدًا؟
  choice: عمل الشريعة
  alternative: مطالب الشريعة؛ ما تطلبه الشريعة
  rationale: النص اليوناني يقول حرفيًا «عمل الشريعة» بصيغة مفردة وموجزة؛ إبقاء العبارة الأقل تفسيرًا يصون التوتر اللاهوتي ولا يحسم المقصود في المتن.
- issue: مرجع الاتهام والدفاع والعلاقة التبادلية بين الأفكار
  choice: 'صياغة المتن: «وتتبادل أفكارهم الاتهام أو حتى الدفاع»'
  alternative: «وأفكارهم تتهمهم أو حتى تدافع عنهم»
  rationale: الصياغة المختارة تحفظ ἀλλήλων التبادلية، مع بيان البديل الذي يجعل الأشخاص مفعول الاتهام والدفاع في الحاشية، لأن التركيب اليوناني مكثف ويحتمل هذا التوضيح السياقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظت العبارة المصدرية «عمل الشريعة» في المتن، ووُضعت القراءة التفسيرية الشائعة في الحاشية. كما صيغت علاقة الأفكار صياغة عربية طبيعية تحفظ المعنى التبادلي، مع إثبات البديل السياقي في الحاشية.
