  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: ar
  text: في اليوم الذي يدين فيه الله خفايا الناس بالمسيح يسوع، بحسب إنجيلي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: في اليوم الذي ... فيه
  rationale: صياغة عربية طبيعية تحفظ الإشارة الصريحة إلى يوم الدينونة وتؤدي الجملة الزمنية اليونانية.
- source_word: κρίνει
  choice: يدين
  rationale: المضارع العربي يلائم الجملة الزمنية ذات التوجه المستقبلي، ويحفظ صيغة المضارع في اليونانية دون الحاجة إلى التصريح بسين الاستقبال.
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: خفايا الناس
  rationale: «خفايا» تؤدي معنى الأمور المستترة أو الأسرار، و«الناس» تعبر عن الدلالة البشرية العامة للفظ ἀνθρώπων.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: بحسب بشارتي
  rationale: تحفظ الصياغة معنى المعيار أو الموافقة في κατὰ، كما تحفظ ضمير المتكلم في «بشارتي» بأسلوب عربي موجز.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: بالمسيح يسوع
  rationale: الباء تؤدي معنى الواسطة أو الوكالة الذي تحمله διά مع المضاف إليه، و«المسيح» هو المقابل العربي الطبيعي للقب Χριστός.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا أو صيغة شبيهة بالاسم
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: حُفظ ترتيب الأصل «المسيح يسوع»، ولفظ «المسيح» في العربية يحمل الدلالة اللقبية المقصودة من غير حاجة إلى استحداث تمييز اصطلاحي بين Messiah وChrist.
- issue: تعلّق عبارة διὰ Χριστοῦ Ἰησοῦ
  choice: 'تتعلق بفعل دينونة الله: «يدين ... بالمسيح يسوع»'
  alternative: ربطها بما يعلنه الإنجيل
  rationale: موضع العبارة وبنية الجملة يرجحان أن المسيح يسوع هو واسطة الدينونة، مع إبقاء ترتيب العبارة العربية قريبًا من الأصل وعدم التوسع التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. لم تُنقل الحاشية الإنجليزية الخاصة بالتمييز بين «Messiah» و«Christ»، لأن اللفظ العربي «المسيح» يؤدي الكلمتين ولا يوجد في العربية بديل لفظي حقيقي يحتاج إلى حاشية.
