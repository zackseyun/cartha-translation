  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: ar
  text: ولكن، أتحسب هذا، يا إنسان[a]، وأنت تحكم على الذين يمارسون مثل هذه الأمور وتفعلها، أنك ستفلت من حكم الله؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا رجل». اللفظ اليوناني مفرد مذكر، لكنه يخاطب هنا إنسانًا بوصفه ممثلًا للناس.
    reason: ملاحظة لغوية وثقافية
lexical_decisions:
- source_word: λογίζῃ
  choice: أتحسب
  rationale: ينقل فعل التقدير الذهني والافتراض في صيغة سؤال إنكاري، بلغة عربية فصيحة واضحة.
- source_word: ἄνθρωπε
  choice: يا إنسان
  rationale: يحافظ على النداء المفرد لمخاطَب بشري نموذجي، من غير قصر الدلالة العربية على الذكر وحده.
- source_word: κρίνων
  choice: تدين
  rationale: يناسب سياق إصدار حكم أخلاقي على الآخرين، ويحافظ هنا على الصلة اللفظية والدلالية مع دينونة الله.
- source_word: πράσσοντας
  choice: يمارسون
  rationale: يفيد السلوك المتكرر أو المعتاد، ويساعد على إبقاء التنويع اللفظي بين πράσσω وποιέω.
- source_word: ποιῶν
  choice: تفعلها
  rationale: ترجمة مباشرة طبيعية، متميزة عن «يمارسون» من غير افتراض فرق اصطلاحي حاد بين الفعلين.
- source_word: αὐτά
  choice: تفعلها أنت أيضًا
  rationale: يعيد الضمير إلى «مثل هذه الأمور»، ويبرز أن المخاطَب نفسه يرتكبها؛ و«أيضًا» تنقل المقابلة السياقية من غير مبالغة.
- source_word: ἐκφεύξῃ
  choice: ستفلت
  rationale: يعبّر بوضوح عن النجاة أو الهرب من حكم آتٍ، ويحافظ على قوة السؤال الإنكاري.
- source_word: κρίμα
  choice: دينونة
  rationale: يدل في السياق على حكم الله القضائي، وهو تعبير عربي كتابي واضح لا يضيّق المعنى إلى مجرد النطق بالعقوبة.
theological_decisions:
- issue: مدى شمول لفظ ἄνθρωπε
  choice: يا إنسان
  alternative: يا رجل
  rationale: الصيغة اليونانية مفرد مذكر، لكن ἄνθρωπος هنا يخاطب إنسانًا نموذجيًا في أسلوب المحاورة؛ «يا إنسان» تحفظ عموم الخطاب مع بيان الصيغة في الحاشية.
- issue: العلاقة بين حكم الإنسان وحكم الله
  choice: تدين / دينونة الله
  alternative: تحكم / حكم الله
  rationale: يحافظ الاختيار على الصلة القضائية في السياق من غير أن يحسم ما إذا كان فعل المخاطَب مجرد تقييم أو إدانة نهائية؛ السياق هو الذي يمنحه نبرته الشديدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة خطابية مهيبة. حوفظ على السؤال الإنكاري الطويل وعلى انتقال بولس من الحكم على الآخرين إلى مواجهة المخاطَب مباشرة، مع تجنب التفسير المذهبي الزائد.
