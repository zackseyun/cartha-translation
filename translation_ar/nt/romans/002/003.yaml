  rationale: أزيلت الإضافتان التفسيريتان «ثم» و«أيضًا» لئلا يُفهم ترتيب زمني أو دلالة غير مصرّح بها، واستُبدلت «تدين» بـ«تحكم على» لمطابقة κρίνων على نحو أوسع. وحُفظ النداء المفرد والسؤال الإنكاري وحكم الله القضائي.
