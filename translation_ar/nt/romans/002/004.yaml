  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: ar
  text: أم تستهين بغنى لطفه[أ] وإمهاله وطول أناته، غير عالمٍ بأن لطف الله يقودك إلى التوبة؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: أو «صلاح» في الموضعين اللذين ترد فيهما «لطف».
    reason: بديل معجمي لـ χρηστότης / τὸ χρηστόν، موافق لسجل التدقيق الإنجليزي.
lexical_decisions:
- source_word: πλούτου
  choice: غنى
  rationale: يحفظ استعارة الوفرة وصيغة المفرد في اليونانية، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: لطفه / لطف الله
  rationale: «اللطف» ينقل الإحسان العلائقي المقصود، مع الحفاظ على الاتساق المعجمي بين الموضعين.
- source_word: ἀνοχῆς
  choice: إمهاله
  rationale: يدل على كفّ الدينونة وتأخيرها، من غير الإيحاء بمفهوم التسامح النسبي الحديث.
- source_word: μακροθυμίας
  choice: طول أناته
  rationale: تعبير عربي فصيح ومفهوم يدل على الصبر الطويل، ويميّزه عن الإمهال المذكور قبله.
- source_word: καταφρονεῖς
  choice: تستهين
  rationale: ينقل معنى الاحتقار وعدم الاعتداد بقوة توبيخية طبيعية، من غير مبالغة لفظية.
- source_word: ἀγνοῶν
  choice: غير عالم
  rationale: يحفظ معنى اسم الفاعل اليوناني ولا يحمّله بالضرورة دلالة التجاهل المتعمد.
- source_word: εἰς μετάνοιάν
  choice: إلى التوبة
  rationale: «التوبة» هي المقابل العربي الراسخ والشامل لـ μετάνοια، وتحفظ «إلى» القوة الاتجاهية لـ εἰς.
- source_word: ἄγει
  choice: يقودك
  rationale: مضارع عربي طبيعي يحفظ دلالة الفعل الحاضر واتجاه فعل الله نحو المخاطَب.
theological_decisions:
- issue: هل يُترجم χρηστότης / χρηστόν بـ«اللطف» أم «الصلاح»؟
  choice: اللطف في الموضعين
  alternative: الصلاح في أحد الموضعين أو كليهما
  rationale: السياق يبرز إحسان الله الشخصي وإمهاله للخاطئ؛ و«اللطف» يحفظ هذه النبرة مع اتساق اللفظ في الموضعين.
- issue: هل يفيد ἄγει بلوغ التوبة حتمًا أم توجيه المخاطَب نحوها؟
  choice: يقودك إلى التوبة
  alternative: يوصلك حتمًا إلى التوبة
  rationale: الصياغة المختارة تحفظ الفعل والاتجاه كما وردا، من غير حسم جدل لاهوتي لا يحسمه هذا التركيب وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «طول أناته» لتمييز μακροθυμία عن ἀνοχή، مع تجنب الألفاظ الطائفية أو التفسيرية الزائدة.
