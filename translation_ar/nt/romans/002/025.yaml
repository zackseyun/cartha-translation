source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: ar
  text: فالختان نافع حقًّا[a] إن كنت تعمل بالشريعة[b]؛ ولكن إن كنت منتهكًا للشريعة[c]، فقد صار ختانك غُرلةً[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذو قيمة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تحفظ الشريعة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «مخالفًا للشريعة».'
    reason: lexical_alternative
  - marker: d
    text: 'حرفيًّا: «صار ختانك غُرلةً». والغُرلة هي حالة غير المختون؛ والمقصود أن الختان، بوصفه علامة للعهد، يفقد قيمته عند انتهاك الشريعة.'
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: الختان
  rationale: يحافظ على الاسم المجرّد وعلى دلالته العهدية، كما يُبقي المقابلة الصريحة مع الغُرلة.
- source_word: μὲν γὰρ
  choice: فـ... حقًّا
  rationale: تنقل الفاء صلة التعليل بالسياق، وتؤدي «حقًّا» معنى التوكيد التمهيدي قبل الاستدراك، من غير إثقال العبارة بحرفين متتابعين.
- source_word: ὠφελεῖ
  choice: نافع
  rationale: تعبير عربي واضح يدل على المنفعة والقيمة الحقيقية المشروطة، من غير اللجوء إلى صياغة تفسيرية.
- source_word: ἐὰν νόμον πράσσῃς
  choice: إن كنت تعمل بالشريعة
  rationale: يحافظ فعل «تعمل» على معنى الممارسة والفعل في πράσσῃς، وتؤدي «الشريعة» المقصود السياقي من νόμος في خطاب بولس.
- source_word: παραβάτης νόμου
  choice: متعدّيًا على الشريعة
  rationale: يحفظ صورة تجاوز الحد القانوني أو العهدي، ويُبقي ذكر الشريعة صريحًا بدل ضغط العبارة في اسم واحد.
- source_word: ἡ περιτομή σου
  choice: ختانك
  rationale: يحافظ على الإضافة والخطاب المباشر الموجّه إلى المخاطب.
- source_word: ἀκροβυστία
  choice: غُرلةً
  rationale: «الغُرلة» هي المقابل الاصطلاحي للختان، وتحفظ حدّة التضاد العهدي في النص بدل شرحه داخل المتن بعبارة أطول.
- source_word: γέγονεν
  choice: فقد صار
  rationale: تنقل «قد» مع الفعل الماضي الحالة الناتجة التي يدل عليها التام اليوناني، بينما يحفظ «صار» معنى التحول البلاغي.
theological_decisions:
- issue: هل تُفسَّر العبارة الأخيرة على أنها حكم اعتباري أم تُحفظ بصورتها القوية المباشرة؟
  choice: فقد صار ختانك غُرلةً
  alternative: فقد عُدَّ ختانك غُرلةً / صار ختانك كأنه غُرلة
  rationale: النص اليوناني يستعمل γέγονεν، أي «صار»، لا فعلًا بمعنى «عُدَّ». لذلك تُحفظ المفارقة العهدية القوية من غير تحويلها في المتن إلى تفسير تقويمي أضعف.
- issue: دلالة νόμος في السياق
  choice: الشريعة
  alternative: الناموس / القانون
  rationale: «الشريعة» عربية معاصرة واضحة وتلائم الإشارة السياقية إلى شريعة الله التي يخاطب بولس العارفين بها، من غير إضافة وصف غير موجود في اليونانية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. استُعملت «الشريعة» بدل «الناموس» لوضوحها للقارئ الحديث، مع إبقاء المصطلحين العهديين «الختان» و«الغُرلة» والحفاظ على المقابلة البلاغية الحادة بينهما.
