  source_fidelity: 'ينقل النص بدقة البنية المتوازية في اليونانية: «كل الذين... وكل الذين»، ويحافظ على المقابلة بين ἀνόμως («بمعزل عن الناموس») وἐν νόμῳ («في نطاق الناموس»). وترجمة «سيهلكون» لـἀπολοῦνται و«سيُحاكَمون» لـκριθήσονται تحفظان دلالة المستقبل القضائية من غير إضافة تفسيرية تحدد طبيعة الهلاك أو نتيجة المحاكمة. و«بالناموس» تؤدي بصورة عربية موجزة ومقبولة وظيفة διὰ νόμου بوصف الناموس وسيلة/معيارًا للدينونة.'
