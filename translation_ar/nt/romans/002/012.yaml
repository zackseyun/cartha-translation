id: ROM.2.12
reference: Romans 2:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: ar
  text: لأن كلَّ الذين أخطأوا بمعزل عن الناموس[a] سيهلكون أيضًا بمعزل عن الناموس، وكلَّ الذين أخطأوا وهم في نطاق الناموس[b] سيُحاكَمون بالناموس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «من دون الناموس» أو «بلا ناموس» في الموضعين.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في الناموس»؛ والمقصود أنهم داخل نطاق سلطانه.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «من خلال الناموس» أو «بواسطة الناموس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: بمعزل عن الناموس
  rationale: ينقل المعنى العلاقي في مقابلة من هم في نطاق الناموس، بدل أن يحصر اللفظ في معنى ارتكاب الشر عمومًا.
- source_word: ἥμαρτον
  choice: أخطأوا
  rationale: صياغة عربية مباشرة للفعل الماضي، تحافظ على دلالة الخطيئة من غير توسع تفسيري.
- source_word: ἀπολοῦνται
  choice: سيهلكون
  rationale: يحافظ على صيغة المستقبل وعلى معنى الهلاك، من غير تحديد لطبيعته أو كيفيته.
- source_word: ἐν νόμῳ
  choice: وهم في نطاق الناموس
  rationale: يبين وجودهم داخل دائرة الناموس وسلطانه، مع الحفاظ على صورة حرف الجر اليوناني قدر الإمكان في عربية طبيعية.
- source_word: διὰ νόμου
  choice: بالناموس
  rationale: يفيد اتخاذ الناموس وسيلةً أو معيارًا للمحاكمة، ويأتي موجزًا وطبيعيًا في العربية.
- source_word: κριθήσονται
  choice: سيُحاكَمون
  rationale: يحافظ على معنى الخضوع للتقييم القضائي من غير استباق النتيجة بلفظ الإدانة.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: كلَّ الذين ... وكلَّ الذين
  rationale: يحفظ القوة الاستغراقية والتوازي بين الفئتين في تركيب عربي واضح.
- source_word: γὰρ
  choice: لأن
  rationale: يحفظ الصلة التعليلية بما سبق في سياق حجة بولس.
theological_decisions:
- issue: مرجع «الناموس» (νόμος)
  choice: الناموس الموسوي على وجه الخصوص، مع إبقاء اللفظ «الناموس» في المتن
  alternative: القانون الأخلاقي بمعناه العام
  rationale: تقابل اليهود والأمم في السياق يرجح الإشارة إلى ناموس موسى، من غير إدخال هذا التفسير صراحةً في نص الآية.
- issue: دلالة الهلاك وعلاقته بالدينونة النهائية
  choice: سيهلكون، من غير تحديد طبيعة الهلاك
  alternative: سيُدانون أو سيُدمَّرون
  rationale: النص يقرر المصير القضائي لكنه لا يشرح هنا كيفية الهلاك، لذلك تُصان المساحة اللاهوتية التي يتركها اللفظ.
- issue: دلالة κριθήσονται
  choice: سيُحاكَمون بصيغة محايدة من جهة نتيجة الحكم
  alternative: سيُدانون
  rationale: الفعل يدل على إجراء الحكم أو التقييم القضائي، ولا ينبغي أن تستبدل الترجمة به لفظًا يصرح بنتيجة الإدانة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الناموس» بوصفه المصطلح الكتابي العربي المألوف لـ νόμος، وحُفظ التوازي بين الفئتين، مع تجنب ألفاظ تحسم نتيجة المحاكمة أو طبيعة الهلاك بما يتجاوز النص.
