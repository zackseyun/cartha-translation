  to: فكلما عمل غيرُ اليهود[a]، الذين ليست لهم الشريعة، بالطبيعة[b] ما تقضي به الشريعة[c]، كانوا، مع أنهم لا شريعة لهم، شريعةً لأنفسهم.
  rationale: يقتصر التعديل على تصحيح الخلل النحوي وتحسين بناء الشرط المتكرر في العربية. ويحافظ النص المنقح على مقابلة اليهود بغير اليهود، وعلى غموض «بالطبيعة»، وعلى التكرار البلاغي لكلمة «الشريعة» والصورة المجازية «شريعة لأنفسهم».
