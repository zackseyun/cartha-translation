  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: ar
  text: فكلما عمل غيرُ اليهود[a]، الذين ليست لهم الشريعة، بالطبيعة[b] ما تقضي به الشريعة[c]، كانوا، مع أنهم لا شريعة لهم، شريعةً لأنفسهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأمم».
    reason: lexical_alternative
  - marker: b
    text: أو «بالفطرة».
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «أمور الشريعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: غير اليهود
  rationale: يفيد اللفظ هنا الأمم في مقابل اليهود ضمن سياق الحديث عن الشريعة؛ وعبارة «غير اليهود» أوضح للقارئ العربي من «الأمم» التي قد تُفهم بمعناها السياسي الحديث.
- source_word: νόμον / νόμου / νόμος
  choice: الشريعة / شريعة
  rationale: استُعملت «الشريعة» مع أداة التعريف حيث يشير السياق إلى شريعة موسى، واستُعملت نكرة في العبارة الخبرية «هم شريعة لأنفسهم»، مع الحفاظ على تكرار اللفظ والمفارقة البلاغية في اليونانية.
- source_word: φύσει
  choice: بالطبيعة
  rationale: ترجمة مباشرة تحفظ اتساع الدلالة ولا تحسم هل المقصود إدراك فطري أم حال طبيعي أم تصرف تلقائي.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: يعملون ... ما تقضي به الشريعة
  rationale: صياغة عربية طبيعية تنقل معنى فعل الأمور التابعة للشريعة، من غير أن تضيف فكرة الإتمام الكامل لكل أحكامها.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: هم شريعة لأنفسهم
  rationale: تحفظ الصورة الخبرية والمفارقة الأصلية من غير أن توحي صراحة بأنهم يسنّون لأنفسهم شريعة مستقلة.
theological_decisions:
- issue: دلالة φύσει وعلاقتها بالمعرفة الأخلاقية والضمير
  choice: الإبقاء على «بالطبيعة» من غير تفسير إضافي في المتن
  alternative: «بالفطرة» أو «تلقائيًا»
  rationale: اللفظ اليوناني وحده لا يحسم آلية معرفة غير اليهود بما تقضي به الشريعة؛ لذلك تُحفظ المساحة التفسيرية والتوتر اللاهوتي.
- issue: معنى كون غير اليهود «شريعة لأنفسهم»
  choice: الإبقاء على الصورة المجازية كما هي
  alternative: «يقومون مقام الشريعة لأنفسهم»
  rationale: الصياغة المباشرة تحافظ على التوازي اللفظي في النص، ولا تفسر العبارة بأنها تشريع ذاتي مستقل أو بديل كامل لشريعة موسى.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. اختيرت «غير اليهود» لرفع الالتباس الحديث في «الأمم»، وحوفظ على تكرار «الشريعة» وعلى الغموض المقصود في «بالطبيعة».
