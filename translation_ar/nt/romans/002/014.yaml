  source_fidelity: 'المعنى الأساسي منقول بأمانة: «غير اليهود» مناسب لـἔθνη في هذا السياق، و«بالطبيعة» يحافظ على سعة φύσει، كما تُحفظ المفارقة في تكرار «الشريعة». إلا أن التركيب الحالي «مع أنه ليست عندهم الشريعة» غير سليم نحويًا؛ لأن المرجع جمع، ولأن المصدر يضم جملة وصفية مستقلة تفيد: «مع أنهم لا شريعة لهم».'
