lexical_decisions:
- source_word: Εἰ δὲ
  choice: ولكن إن
  rationale: تحفظ أداة الشرط εἰ والقوة الاستدراكية الخفيفة في δέ ضمن سياق حجة بولس المتواصلة.
- source_word: Ἰουδαῖος
  choice: يهوديًّا
  rationale: يدل اللفظ هنا أساسًا على الهوية الإثنية الدينية لا على الانتماء الجغرافي وحده.
- source_word: ἐπονομάζῃ
  choice: تُسمّي نفسك
  rationale: صيغة الوسط تحتمل المعنى الانعكاسي، أي اتخاذ المرء هذا الاسم أو ادعاءه لنفسه، وتحافظ هذه الصياغة على النبرة الخطابية.
- source_word: ἐπαναπαύῃ
  choice: تتّكل على
  rationale: ينقل معنى الاعتماد والثقة، لا الراحة الجسدية، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: νόμῳ
  choice: الشريعة
  rationale: يشير السياق على الأرجح إلى شريعة موسى بوصفها فئة عهدية معروفة، ولفظ «الشريعة» هو المقابل العربي الواضح هنا.
- source_word: καυχᾶσαι
  choice: تفتخر
  rationale: يحفظ معنى التباهي أو الاعتزاز المشحون تقويميًّا في استعمال بولس، من غير حسم كونه محمودًا أو مذمومًا خارج السياق.
- source_word: ἐν θεῷ
  choice: بالله
  rationale: الباء هي الصياغة العربية الطبيعية للافتخار الذي موضوعه أو موضعه الله، وتحفظ المعنى من غير توسيع تفسيري.
