  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: ar
  text: بل اليهودي هو مَن يكون يهوديًا في الباطن، والختان هو ختان القلب، بالروح لا بالحرف[a]؛ ومدحه ليس من الناس بل من الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني «بالروح» عمل روح الله، أو تشير إلى الواقع الروحي الباطني في مقابل الحرف المكتوب.
    reason: غموض دلالي في πνεύματι ومقابلته بـ γράμματι
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: في الباطن
  rationale: ينقل معنى الخفاء والداخل في مقابل الظاهر، بصياغة عربية طبيعية لا توحي بمجرد الكتمان.
- source_word: Ἰουδαῖος
  choice: اليهودي
  rationale: السياق ديني وعهدي لا جغرافي، ولذلك «اليهودي» أدق من نسبة جغرافية مثل «اليهوداني».
- source_word: περιτομὴ καρδίας
  choice: ختان القلب
  rationale: يحفظ استعارة النص بوضوح وإيجاز، ويبيّن أن الختان المقصود باطني لا جسدي فحسب.
- source_word: ἐν πνεύματι
  choice: بالروح
  rationale: الباء العربية تؤدي معنى المجال أو الوسيلة على نحو طبيعي، و«الروح» تبقي الإحالة محتملة بين روح الله والواقع الروحي الباطني، مع بيان ذلك في الحاشية.
- source_word: οὐ γράμματι
  choice: لا بالحرف
  rationale: يحافظ على المقابلة البولسية الموجزة بين الروح والحرف دون توسيع «الحرف» إلى تفسير مثل الشريعة المكتوبة.
- source_word: οὗ ὁ ἔπαινος
  choice: ومدحه
  rationale: يربط الضمير طبيعيًا باليهودي الذي في الباطن، مع المحافظة على معنى الثناء.
- source_word: ἐξ ἀνθρώπων
  choice: من الناس
  rationale: ينقل الجمع العام الشامل للبشر بلغة عربية مألوفة.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: ترجمة مباشرة دقيقة بلا إضافة تفسيرية.
theological_decisions:
- issue: هل تشير πνεύματι إلى الروح القدس أم إلى الروح/الواقع الروحي الباطني؟
  choice: إبقاء «الروح» دون إضافة «القدس» في المتن
  alternative: «بالروح القدس» أو «في الروح» بمعنى الباطن الروحي
  rationale: التركيب اليوناني يحتمل الإحالة إلى الروح القدس، ولا سيما في مقابلة الروح بالحرف عند بولس، لكنه لا يصرّح بلفظ «القدس». لذلك يحفظ المتن الغموض الحقيقي وتوضحه الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التكرار التوضيحي «هو مَن كان يهوديًا» لاستقامة الجملة العربية مع حفظ مقابلة الباطن والظاهر، وقُسّمت الخاتمة إلى جملة مستقلة لتجنب التباس مرجع الضمير.
