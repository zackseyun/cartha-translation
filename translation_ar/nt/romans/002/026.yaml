  terminology: «متطلبات الشريعة» اختيار واضح ومناسب لـ τὰ δικαιώματα τοῦ νόμου، و«يحفظ» ملائم لسياق التزام الشريعة، و«يُحسَب» يصون لغة الاحتساب دون تحميل تفسيري. لا يلزم نقل الحاشية الإنجليزية؛ إذ لا توجد في العربية مشكلة أسلوبية تستدعي بيانًا حرفيًا.
