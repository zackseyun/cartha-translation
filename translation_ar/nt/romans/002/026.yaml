id: ROM.2.26
reference: Romans 2:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: ar
  text: فإذا كان غير المختون يحفظ متطلبات الشريعة، أفلا يُحسَب عدم ختانه ختانًا؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκροβυστία
  choice: غير المختون / عدم ختانه
  rationale: الاسم اليوناني يعني حرفيًا «عدم الختان»، لكنه في وروده الأول يشير إلى الشخص غير المختون، كما يؤكد الضمير αὐτοῦ في الورود الثاني. صيغت الإشارة الأولى بصيغة شخصية طبيعية، والثانية بصيغة الحالة الجسدية، محافظةً على التكرار الدلالي.
- source_word: δικαιώματα
  choice: متطلبات
  rationale: تؤدي معنى ما تفرضه الشريعة وتطلبه، بلغة عربية واضحة، من غير إضافة وصف تفسيري مثل «العادلة» أو استعمال لفظ تقني ثقيل.
- source_word: νόμου
  choice: الشريعة
  rationale: في سياق حجة بولس تشير الكلمة إلى شريعة موسى؛ و«الشريعة» هي الصياغة العربية الطبيعية والدقيقة هنا.
- source_word: φυλάσσῃ
  choice: يحفظ
  rationale: «يحفظ» تعبير عربي مألوف لطاعة أحكام الشريعة والعمل بها، ويحافظ أيضًا على الصورة الأساسية للفعل اليوناني.
- source_word: λογισθήσεται
  choice: يُحسَب
  rationale: يحفظ لغة الاحتساب في حجة بولس، وهو واضح وطبيعي في العربية.
- source_word: εἰς περιτομήν
  choice: ختانًا
  rationale: النصب في العربية يعبّر بإيجاز عن اعتبار عدم الختان في منزلة الختان، بما يلائم دلالة εἰς على النتيجة أو الصفة المحتسبة.
- source_word: οὐχ
  choice: أفلا ...؟
  rationale: ينقل السؤال البلاغي الذي يتوقع جوابًا بالإيجاب، مع وصل النتيجة بما سبق بواسطة الفاء.
theological_decisions:
- issue: هل يقرر النص الخلاص بحفظ الشريعة أم يقيم مقارنة جدلية؟
  choice: الإبقاء على الجملة الشرطية والسؤال البلاغي من دون شرح عقائدي مضاف
  alternative: إضافة قيد يفسر نوع الحفظ أو أثره الخلاصي
  rationale: الآية نفسها تصوغ فرضًا داخل حجة بولس عن الختان والشريعة، ولا تحدد هنا وحدها كل النتائج اللاهوتية؛ لذا ينبغي صون التوتر وعدم حسمه بإضافة تفسير.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «غير المختون» للشخص و«عدم ختانه» للحالة كي تكون العبارة طبيعية مع الحفاظ على تلاعب النص بين الشخص وحالته. لا حاجة إلى حاشية لأن الصياغة العربية تُظهر كلا المعنيين مباشرة.
