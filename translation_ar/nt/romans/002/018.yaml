lexical_decisions:
- source_word: γινώσκεις
  choice: تعرف
  rationale: فعل مضارع يدل على معرفة فعلية مباشرة، و«تعرف» أقرب المقابلات العربية الطبيعية في هذا السياق.
- source_word: τὸ θέλημα
  choice: المشيئة
  rationale: حُفظ التعريف من اليونانية من غير إضافة ضمير ملكية غير مصرّح به؛ والسياق يدل على أن المقصود مشيئة الله.
- source_word: δοκιμάζεις
  choice: تمتحن
  rationale: يحفظ معنى الفحص والاختبار في الفعل، من غير حصره في نتيجة الاستحسان وحدها.
- source_word: τὰ διαφέροντα
  choice: الأمور المختلفة
  rationale: ترجمة قريبة من البنية اليونانية وتحفظ احتمال أن يكون المعنى الأمور المتمايزة أو الأمور الأفضل.
- source_word: κατηχούμενος
  choice: إذ تتلقّى التعليم
  rationale: صياغة عربية طبيعية تحافظ على معنى التلقين والتعليم في اسم المفعول، مع إبقاء الصلة الحالية أو التفسيرية بالسياق دون الجزم بعلّية صريحة.
- source_word: ἐκ τοῦ νόμου
  choice: من الشريعة
  rationale: تحفظ دلالة المصدر في ἐκ، و«الشريعة» هي المقابل العربي الطبيعي للناموس اليهودي في هذا السياق.
theological_decisions:
- issue: مرجع «المشيئة»
  choice: إبقاء «المشيئة» بلا ضمير ملكية
  alternative: مشيئة الله / مشيئته
  rationale: النص اليوناني لا يصرّح بالمضاف إليه، مع أن الله هو المرجع المفهوم من السياق؛ وإبقاء الصياغة يجنّب إضافة ما لم يُذكر صراحة.
- issue: دلالة τὰ διαφέροντα
  choice: الأمور المختلفة
  alternative: ما هو أفضل / الأمور الفاضلة
  rationale: العبارة تحتمل حرفيًا ما يختلف أو يتميّز، واصطلاحيًا ما هو أفضل؛ فحُفظ الاحتمال الأقرب إلى اللفظ في المتن وذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظت صيغة الجملة المتصلة بما قبلها، كما حُفظ غموض العبارة اليونانية الأساسية مع توضيح البديل الاصطلاحي في الحاشية.
