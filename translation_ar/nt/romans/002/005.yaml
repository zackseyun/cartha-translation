  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: ar
  text: لكنّك، بسبب قساوتك وقلبك الذي لا يتوب، تدّخر لنفسك غضبًا في يوم الغضب وظهور دينونة الله العادلة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قضاء الله العادل».'
    reason: بديل معجمي لـδικαιοκρισία يبرز معنى الحكم العادل بصياغة عربية أخرى ممكنة.
lexical_decisions:
- source_word: κατὰ δὲ
  choice: لكنك، بسبب
  rationale: تنقل «لكن» قوة δέ الاستدراكية الخفيفة، ويعبّر «بسبب» بوضوح عن الدلالة السببية لـκατά مع النصب في هذا السياق.
- source_word: σκληρότητά
  choice: قساوتك
  rationale: تحافظ «القساوة» على صورة التصلب وانعدام الحس الأخلاقي، وهي عبارة عربية واضحة ومألوفة.
- source_word: ἀμετανόητον καρδίαν
  choice: قلبك غير التائب
  rationale: يحفظ التعبير صورة القلب في اليونانية، ويبيّن أن المقصود قلب لا يرجع بالتوبة دون استعمال لفظ عربي مهجور.
- source_word: θησαυρίζεις
  choice: تدّخر
  rationale: ينقل فعل جمع الشيء وتخزينه مع مرور الزمن، ويحافظ على الصورة المجازية من غير إيحاء إيجابي لازم.
- source_word: σεαυτῷ
  choice: لنفسك
  rationale: ينقل ضمير الانعكاس في صيغة المفعول غير المباشر، ويبرز أن العاقبة تعود على المخاطَب نفسه.
- source_word: ὀργὴν
  choice: غضبًا
  rationale: «الغضب» هو المقابل العربي المباشر الملائم لسياق الدينونة الإلهية، ويحفظ ثقل العبارة دون زيادة تفسيرية.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: في يوم الغضب وإعلان
  rationale: تحافظ «في يوم» على الدلالة الزمنية لـἐν، وتبقي الاسمين المنسقين «الغضب» و«الإعلان» بدل تحويلهما إلى جملة فعلية تفسيرية.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: دينونة الله العادلة
  rationale: تنقل «دينونة» معنى الحكم القضائي، وتعبّر «العادلة» عن عنصر العدل أو الاستقامة في اللفظ المركب δικαιοκρισία، مع صياغة عربية طبيعية.
theological_decisions:
- issue: هل تتحول العبارة الاسمية «يوم الغضب وإعلان دينونة الله العادلة» إلى جملة تفسيرية مثل «حين يعلن الله دينونته العادلة»؟
  choice: 'الإبقاء على البنية الاسمية: «في يوم الغضب وإعلان دينونة الله العادلة».'
  alternative: «في يوم الغضب، حين يعلن الله دينونته العادلة».
  rationale: النص اليوناني ينسق بين أسماء ولا يصرّح بفعل «يعلن». لذلك تحافظ الصياغة المختارة على بنية المصدر وعلى ما في العبارة من كثافة واحتمال، من غير حسمها بجملة فعلية مضافة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على استعارة القساوة والادخار وعلى البنية الاسمية في ختام الآية، مع تجنب الألفاظ المذهبية أو التفسير الزائد.
