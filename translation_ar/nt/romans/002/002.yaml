id: ROM.2.2
reference: Romans 2:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: ar
  text: ونحن نعلم أن حُكم الله على الذين يمارسون مثل هذه الأمور هو بحسب الحق[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفقًا للحق»؛ أي إن حُكم الله يتوافق مع ما هو حق.'
    reason: بديل معجمي يوضح معنى κατὰ ἀλήθειαν من غير تغيير دلالته.
lexical_decisions:
- source_word: οἴδαμεν
  choice: نعلم
  rationale: صيغة οἶδα التامة تؤدي هنا معنى حاضرًا؛ و«نعلم» ترجمة مباشرة وطبيعية.
- source_word: δέ
  choice: و
  rationale: تفيد أداة الربط هنا مواصلة الكلام أكثر من إفادة تضاد قوي، ولذلك تنقلها الواو بوضوح.
- source_word: κρίμα
  choice: حُكم
  rationale: يدل اللفظ على حكم الله القضائي. و«حُكم» يحافظ على المعنى الواسع من غير حصره في الإدانة وحدها.
- source_word: κατὰ ἀλήθειαν
  choice: بحسب الحق
  rationale: تحافظ العبارة على معنى موافقة حكم الله للحق والواقع، بدل اختزالها في الظرف التفسيري «بعدل».
- source_word: ἐπὶ
  choice: على
  rationale: تبيّن «على» اتجاه الحكم القضائي إلى الأشخاص المذكورين، وهي صياغة عربية طبيعية في هذا السياق.
- source_word: τὰ τοιαῦτα
  choice: مثل هذه الأمور
  rationale: إحالة عربية طبيعية إلى الأفعال والشرور المذكورة في السياق السابق.
- source_word: πράσσοντας
  choice: يمارسون
  rationale: ينقل الفعل المضارع معنى السلوك المستمر أو المعتاد، وهو أوضح هنا من مجرد «يفعلون».
theological_decisions:
- issue: هل تُترجم κατὰ ἀλήθειαν ترجمة تفسيرية بمعنى «بعدل» أم ترجمة شفافة تحافظ على ذكر الحق؟
  choice: بحسب الحق
  alternative: بعدل؛ وفقًا للحق
  rationale: تحافظ «بحسب الحق» على الصلة الصريحة بين حكم الله والحق أو الواقع، ولا تختزل العبارة في وصف عدالة الحكم فحسب.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «حُكم» بدل المصطلح الكنسي الأضيق «دينونة»، و«يمارسون» لإبراز السلوك المتكرر أو المميز لأصحابه.
