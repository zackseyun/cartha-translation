    rationale: صحيحة من حيث المعنى، لكن إدخال «الشخص» وإسناد الظرف إلى الضمير في «بطبيعته» يرفع الالتباس ويجعل العربية أكثر طبيعية، مع الحفاظ على الدلالة الشخصية المجازية لـἀκροβυστία.
  - severity: low
