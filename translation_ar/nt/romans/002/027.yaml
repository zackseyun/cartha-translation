    rationale: «تتعدّى الناموس» ينقل المعنى، لكن الأصل يصف المخاطَب بأنه «متعدٍّ للناموس». الحفاظ على الوصف الاسمي أوفق بالنص وأقل ترهّلًا في هذا التركيب.
