  verdict: revise
  source_fidelity: 'المعنى الأساسي محفوظ: فالشخص غير المختون بطبيعته، إن كان يتمّم الناموس، يدين المخاطَب المتعدّي للناموس رغم امتلاكه الحرف والختان. لكن «إذا أتمَّ الناموس» يوحي بالفعل المنجَز أكثر مما ينقل اسم الفاعل الحاضر τελοῦσα الذي يدل على ممارسة إتمام الناموس، كما أن الصياغة الاسمية في ختام الآية أقرب إلى «παραβάτην νόμου».'
  naturalness: النص مفهوم وفصيح عمومًا، لكن «غير المختون بالطبيعة» أقل سلاسة من «الشخص غير المختون بطبيعته»، و«إذا كان يتمّم الناموس» أوضح في العربية الحديثة في نقل المعنى الشرطي الوصفي. كذلك فإن «متعدٍّ للناموس» أكثر انسيابًا ومطابقة للبناء اليوناني من الجملة الاعتراضية «تتعدّى الناموس».
  terminology: «الناموس» و«الختان» مناسبان وثابتان في السجل الكتابي العربي. و«حرف الناموس» يحافظ على الصورة البولسية مع الإيضاح السياقي المشروع في الحاشية. أبقيت «غير المختون» دون «الأممي» كي لا تُضاف دلالة عرقية غير مصرّح بها.
  issues:
