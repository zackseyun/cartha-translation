  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: ar
  text: وسيدين الشخصُ غير المختون بطبيعته[a]، إذا كان يتمّم الناموس، إياك أنت الذي، مع حرف الناموس والختان[b]، متعدٍّ للناموس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «عدم الختان»؛ والمقصود هنا شخص غير مختون.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «حرف الناموس» بـ«الشريعة المكتوبة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: غير المختون
  rationale: الاسم يعني حرفيًا «عدم الختان»، لكنه مستعمل هنا مجازًا للدلالة على الشخص غير المختون؛ وهذه الصياغة توضّح المرجع الشخصي من غير أن تضيف التسمية العرقية «الأممي».
- source_word: ἐκ φύσεως
  choice: بالطبيعة
  rationale: تحافظ على المقابلة بين حالة عدم الختان الطبيعية وامتلاك الختان، وتبقى قريبة من العبارة اليونانية.
- source_word: τελοῦσα
  choice: إذا أتمَّ
  rationale: اسم الفاعل يصف العمل بالناموس، ويفهم في السياق بقوة شرطية؛ «أتمَّ» يحفظ صلة اللفظ بالفعل τελέω مع صياغة عربية واضحة.
- source_word: νόμον
  choice: الناموس
  rationale: يشير السياق إلى ناموس موسى بوصفه أمرًا معروفًا، و«الناموس» لفظ عربي كتابي واضح يحافظ على خصوصية المرجع.
- source_word: διὰ γράμματος
  choice: مع حرف الناموس
  rationale: تفيد διά هنا الملابسة أو الوسيلة التي في حوزة المخاطَب. أضيف «الناموس» لتوضيح المقصود بالحرف، مع إبقاء الصورة البلاغية البولسية؛ ويمكن أيضًا فهمها بمعنى «الشريعة المكتوبة».
- source_word: περιτομῆς
  choice: الختان
  rationale: نقل مباشر وثابت لعلامة العهد المذكورة في النص.
- source_word: παραβάτην νόμου
  choice: تتعدّى الناموس
  rationale: صياغة فعلية عربية طبيعية تحفظ معنى تجاوز الناموس وعلاقة العبارة الصريحة به.
theological_decisions:
- issue: هل تُترجم ἀκροβυστία ترجمة عرقية صريحة بمعنى «الأممي»؟
  choice: غير المختون
  alternative: الأممي
  rationale: السياق العام يتناول اليهود والأمم، لكن اللفظ نفسه يقيم المقابلة بين الختان وعدم الختان؛ لذلك تُحفظ دلالة النص الأضيق ولا يُستبدل بها توصيف عرقي غير مصرح به.
- issue: القوة الدلالية لاسم الفاعل τελοῦσα
  choice: إذا أتمَّ الناموس
  alternative: وهو يتمّ الناموس
  rationale: تحتمل الصيغة اليونانية وصف الحال أو معنى شرطيًا في السياق. اختيرت الصياغة الشرطية لأنها توضح منطق المقابلة من غير تحويل الكلام إلى تقرير عرقي شامل.
- issue: دلالة διὰ مع γράμματος وπεριτομῆς
  choice: مع حرف الناموس والختان
  alternative: بواسطة حرف الناموس والختان
  rationale: يمكن أن تدل العبارة على الوسيلة، لكن «مع» أنسب عربيًا لوصف المخاطَب الذي يملك النص المكتوب والختان ومع ذلك يتعدى الناموس، من غير حسم زائد لطبيعة العلاقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «الناموس» للمحافظة على المصطلح البولسي المميز، وصيغت الجملة فعليًا في ختامها لتجنب تركيب اسمي ثقيل، مع وضع علامتي الحاشية [a] و[b] في المتن.
