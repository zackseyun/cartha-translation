  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: ar
  text: أنتَ الذي تفتخر بالشريعة، أتهين الله بتعدّيك على الشريعة[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بمخالفتك للشريعة».'
    reason: بديل لفظي أكثر تداولًا لعبارة παράβασις τοῦ νόμου، مع بقاء معنى انتهاك الشريعة.
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: بالشريعة
  rationale: تفيد الباء هنا التعلّق وموضع الافتخار بصورة طبيعية في العربية، مع إبقاء الإشارة السياقية إلى شريعة الله دون تحويل العبارة إلى مجرد «الكلام عن الشريعة».
- source_word: καυχᾶσαι
  choice: تفتخر
  rationale: تنقل النبرة الانتقادية للفعل اليوناني بلفظ عربي واضح وشائع.
- source_word: διὰ τῆς παραβάσεως
  choice: بتعدّيك
  rationale: تحافظ على السببية التي تؤديها διά وعلى الاسم παράβασις، وتُظهر الإضافة إلى المخاطب المفرد التي يقتضيها السياق.
- source_word: παραβάσεως τοῦ νόμου
  choice: تعدّيك على الشريعة
  rationale: صياغة عربية طبيعية تحافظ على معنى تجاوز حدود الشريعة وانتهاكها، مع تكرار «الشريعة» كما في اليونانية.
- source_word: τὸν θεὸν
  choice: الله
  rationale: هو المقابل العربي الطبيعي للاسم المعرّف في هذا السياق.
- source_word: ἀτιμάζεις
  choice: تهين
  rationale: تنقل معنى سلب الكرامة وعدم الإكرام بوضوح، وتحافظ على حدة المقابلة بين الافتخار بالشريعة وإهانة الله.
theological_decisions:
- issue: دلالة νόμος في خطاب بولس
  choice: الشريعة
  alternative: الناموس
  rationale: «الشريعة» لفظ عربي معاصر واضح يدل في السياق على شريعة الله المعطاة لإسرائيل، من غير فرض اصطلاح مذهبي أو استعمال لفظ أقل شيوعًا لدى القارئ الحديث.
- issue: القوة البلاغية للاستفهام
  choice: 'الإبقاء على السؤال الاتهامي: «أتهين الله...؟»'
  alternative: 'صياغته خبرًا: «فأنت تهين الله...»'
  rationale: النص اليوناني يقدّم سؤالًا بلاغيًا مباشرًا، والإبقاء عليه يصون حدة المواجهة والتوتر في كلام بولس.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، بخطاب مفرد مباشر. اختيرت «الشريعة» بدل «الناموس» لوضوحها المعاصر، وحُفظ تكرار اللفظ والاستفهام البلاغي في الأصل.
