  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: ar
  text: 'فأنت إذًا، يا مَن تُعلِّم غيرك، ألا تُعلِّم نفسك؟ ويا مَن تنادي: «لا تسرق»، أتسرق؟'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: إذًا
  rationale: تفيد الانتقال الاستنتاجي من الكلام السابق، وهي طبيعية وواضحة في العربية المعاصرة.
- source_word: διδάσκων
  choice: يا مَن تُعلِّم
  rationale: صيغ اسم الفاعل اليونانية هنا صفةٌ للمخاطَب؛ ونقلها بتركيب النداء والموصول يحفظ المواجهة البلاغية ويأتي طبيعيًا بالعربية.
- source_word: ἕτερον
  choice: غيرك
  rationale: يحفظ معنى تعليم شخص آخر مع إبراز المقابلة الحادة بين الغير والنفس، من غير تحويل المفرد إلى جمع.
- source_word: σεαυτὸν
  choice: نفسك
  rationale: ينقل المفعول الانعكاسي مباشرة ويحافظ على المقابلة البلاغية مع «غيرك».
- source_word: οὐ διδάσκεις;
  choice: ألا تُعلِّم
  rationale: يحفظ صيغة السؤال المنفي ونبرة التوبيخ المتوقعة في السياق.
- source_word: κηρύσσων
  choice: تنادي
  rationale: يؤدي معنى الإعلان العلني بلفظ عربي طبيعي، من غير حصره في الوعظ الديني الاصطلاحي.
- source_word: μὴ κλέπτειν
  choice: لا تسرق
  rationale: ينقل مضمون الإعلان في صورة نهي مباشر واضح كما يقتضيه السياق.
- source_word: κλέπτεις;
  choice: أتسرق؟
  rationale: يحفظ السؤال البلاغي المباشر والمقتضب وقوته الاتهامية.
theological_decisions: []
