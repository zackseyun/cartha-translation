  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: ar
  text: فَإِنَّ اسْمَ اللهِ يُجَدَّفُ عَلَيْهِ بَيْنَ الأُمَمِ بِسَبَبِكُمْ[b][a]، كَمَا هُوَ مَكْتُوبٌ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين غير اليهود».'
    reason: lexical_alternative
  - marker: b
    text: يردّد بولس هنا صدى الكتاب المقدس، ولا سيما إشعياء 52:5، وكذلك موضوعات تظهر في حزقيال 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: فَإِنَّ
  rationale: تربط الآية بما قبلها بوصفها تعليلًا وتفسيرًا للتوبيخ السابق، وهي صياغة عربية طبيعية تحفظ قوة الرابط الخطابي.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: اسْمَ اللهِ
  rationale: ترجمة مباشرة تحفظ تعبير «اسم الله» بما يحمله سياقيًا من دلالة على سمعته ومجده من غير تحويله إلى شرح تفسيري.
- source_word: δι’ ὑμᾶς
  choice: بِسَبَبِكُمْ
  rationale: διά مع حالة النصب تفيد السببية هنا، والسياق يحمّل المخاطَبين مسؤولية ما يحدث.
- source_word: βλασφημεῖται
  choice: يُجَدَّفُ عَلَيْهِ
  rationale: صيغة مبني للمجهول تحفظ زمن الفعل وقوته الدينية؛ وإضافة «عليه» تجعل الاستعمال العربي واضحًا، والضمير يعود إلى اسم الله.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: بَيْنَ الأُمَمِ
  rationale: تحفظ اللفظ الواسع ἔθνη وصدى النص النبوي، ويمكن أن يدل في هذا السياق على غير اليهود؛ لذلك تُذكر هذه الدلالة في الحاشية.
- source_word: καθὼς γέγραπται
  choice: كَمَا هُوَ مَكْتُوبٌ
  rationale: صيغة عربية مألوفة تحفظ العبارة الاصطلاحية التي تُدخل الاستشهاد الكتابي.
theological_decisions:
- issue: دلالة ἔθνη في سياق يهودي-أممي
  choice: الأمم
  alternative: غير اليهود
  rationale: اختيار «الأمم» يحافظ على المجال الدلالي للنص اليوناني وعلى صدى إشعياء، مع بيان الدلالة السياقية المحتملة في الحاشية بدل حسمها داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل التشكيل الجزئي لتوضيح المبني للمجهول، وحُفظ ترتيب علامتي الحاشية [b][a] كما في طبقة المراجعة الإنجليزية.
