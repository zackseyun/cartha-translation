  source_fidelity: 'النص العربي يحافظ بأمانة على عناصر اليونانية: الرابط التعليلي γάρ («فإن»)، و«اسم الله»، والمبني للمجهول في βλασφημεῖται («يُجَدَّف عليه»)، والسببية في δι’ ὑμᾶς («بسببكم»)، وἐν τοῖς ἔθνεσιν («بين الأمم»)، وصيغة الاستشهاد καθὼς γέγραπται («كما هو مكتوب»).'
