base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: ar
  text: 'لكنني أسأل: أَلَمْ يَعْرِفْ إسرائيلُ[a]؟ موسى أولُ من يقول: «سأجعلكم تغارون بما ليس أُمّةً[b]، وبأُمّةٍ لا تفهم سأثير غضبكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَلَمْ يفهم إسرائيل؟» يمكن أن يعني الفعل اليوناني «يعرف» أو «يفهم»، وقد يكون المراد هنا إدراك مغزى ما سمعه.'
    reason: lexical_alternative
  - marker: b
    text: اقتباس من تثنية 32:21. وقد تشير عبارة «ما ليس أُمّةً» إلى شعب لا يُعَدّ أُمّةً حقيقية، أي إلى غير اليهود.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: أَلَمْ يَعْرِفْ إسرائيلُ؟
  rationale: يحافظ على المعنى الأساسي للفعل γινώσκω وعلى صيغة السؤال البلاغي اليونانية، مع الإشارة في الحاشية إلى احتمال معنى «يفهم» في السياق.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: موسى هو أول من يقول
  rationale: صياغة عربية طبيعية تحفظ دلالة πρῶτος على أن موسى أول شاهد كتابي يُستشهد به في هذا التسلسل.
- source_word: παραζηλώσω
  choice: سأجعلكم تغارون
  rationale: ينقل المعنى السببي للفعل، أي إثارة الغيرة، بعبارة عربية واضحة وطبيعية.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: بسبب ما ليس أُمّةً
  rationale: يحفظ المفارقة المقصودة في الاقتباس ولا يستبدل بها تفسيرًا صريحًا مثل «الأمم»؛ وتؤدي «بسبب» معنى الوسيلة أو السبب في هذا السياق.
- source_word: ἔθνει ἀσυνέτῳ
  choice: بأُمّةٍ عديمة الفهم
  rationale: يعكس ἀσύνετος بوصفه افتقارًا إلى الفهم، مع الحفاظ على التوازي مع العبارة السابقة.
- source_word: παροργιῶ
  choice: سأثير غضبكم
  rationale: يحفظ الدلالة السببية، أي جعل المخاطَبين يغضبون، في تعبير عربي موجز.
- source_word: ὑμᾶς
  choice: ـكم
  rationale: تنقل لاحقة جمع المخاطبين عدد الضمير اليوناني بوضوح.
theological_decisions:
- issue: المقصود بعبارتي «ما ليس أُمّةً» و«أُمّة عديمة الفهم»
  choice: الإبقاء على صياغة الاقتباس دون تعيين المرجع في المتن
  alternative: تفسيرهما صراحةً بأنهما الأمم أو شعب لا يعدّه إسرائيل أُمّة حقيقية
  rationale: يستشهد بولس بتثنية 32:21، والنص نفسه يترك هوية الجماعة ضمن الصورة النبوية؛ لذا لا ينبغي إدخال التفسير في المتن.
- issue: دلالة ἔγνω في سؤال بولس
  choice: يعرف
  alternative: يفهم أو يدرك
  rationale: «يعرف» هو المقابل المباشر للفعل ويحفظ الغموض المعجمي، بينما توضّح الحاشية أن السياق قد يدل على إدراك مغزى ما سمعه إسرائيل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدمت «أُمّة» في الاقتباس حفاظًا على وحدة الصورة، وأُبقي السؤال والاقتباس قريبين من البنية اليونانية من غير تكلّف.
