  to: 'لكنني أسأل: أَلَمْ يَعْرِفْ إسرائيلُ[a]؟ موسى أولُ من يقول: «سأجعلكم تغارون بما ليس أُمّةً[b]، وبأُمّةٍ لا تفهم سأثير غضبكم».'
