source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: ar
  text: 'لكن لم يُطع الجميعُ البشارة[a]، لأن إشعياء يقول: «يا رب، مَن آمن بخبرنا[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإنجيل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «برسالتنا»؛ حرفيًا: «بمسموعنا» أو «بسماعنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: أداة استدراك طبيعية تحفظ التعارض مع الكلام السابق.
- source_word: οὐ πάντες
  choice: ليس الجميع
  rationale: تحفظ النفي الجزئي في اليونانية، فلا توحي بأن أحدًا لم يستجب.
- source_word: ὑπήκουσαν
  choice: أطاعوا
  rationale: الفعل يدل على الطاعة، لا على مجرد السماع، ويحفظ قوة الاستجابة المطلوبة للبشارة.
- source_word: τῷ εὐαγγελίῳ
  choice: البشارة
  rationale: تعبير عربي واضح ومألوف يؤدي معنى الخبر السار في استعمال بولس، مع إثبات البديل التقليدي في الحاشية.
- source_word: Ἠσαΐας
  choice: إشعياء
  rationale: الصيغة العربية المعيارية لاسم النبي.
- source_word: γὰρ
  choice: لأن
  rationale: تبيّن أن اقتباس إشعياء يسند القول السابق ويفسره.
- source_word: λέγει
  choice: يقول
  rationale: يحفظ زمن المضارع في استحضار صوت الكتاب المقدس.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة النداء العربية الطبيعية والموقرة للمفرد المنادى.
- source_word: τίς
  choice: مَن
  rationale: المقابل العربي المباشر لاسم الاستفهام العاقل.
- source_word: ἐπίστευσεν
  choice: آمن
  rationale: ينقل الفعل الماضي اليوناني طبيعيًا في العربية ضمن السؤال البلاغي.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: بما سمعه منا
  rationale: يحفظ صلة اللفظ بالسماع، ويؤدي في السياق معنى الخبر أو الرسالة التي سمعها الناس من المتكلمين، من غير حسم زائد لدلالة الاسم.
theological_decisions:
- issue: طبيعة الاستجابة المطلوبة للبشارة في ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: أطاعوا البشارة
  alternative: أصغوا إلى البشارة؛ استجابوا للبشارة
  rationale: اللفظ اليوناني يدل صراحة على الطاعة، وبذلك تُحفظ صلة الإيمان بالاستجابة المطيعة من غير إدخال تصور مذهبي خاص عن الخلاص.
- issue: دلالة ἀκοή في اقتباس إشعياء
  choice: بما سمعه منا
  alternative: بخبرنا؛ برسالتنا؛ بمسموعنا
  rationale: يمكن أن يدل اللفظ على السماع أو على الخبر المسموع. الصياغة المختارة طبيعية وتحفظ التوتر الدلالي بين الفعل ومحتوى الخبر، وتورد البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعملت «البشارة» في المتن لشفافيتها، وحُفظ «الإنجيل» بديلًا تقليديًا في الحاشية. وُضعت علامتا الحاشية [a] و[b] في المتن، مع صياغة الاقتباس كسؤال بلاغي طبيعي.
