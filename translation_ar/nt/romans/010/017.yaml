  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: ar
  text: إذًا، الإيمان يأتي من السماع، والسماع من خلال كلمة المسيح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلمة عن المسيح» أو «الرسالة المتعلقة بالمسيح». يمكن فهم صيغة الإضافة في اليونانية بأكثر من وجه.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: إذًا
  rationale: أداة استنتاج تربط هذه الخلاصة بالحجة السابقة بعبارة عربية طبيعية وواضحة.
- source_word: πίστις
  choice: الإيمان
  rationale: يدل السياق على استجابة الإنسان للخبر المعلَن، لا على الأمانة بوصفها صفة.
- source_word: ἐξ ἀκοῆς
  choice: يأتي من السماع
  rationale: تفيد ἐξ المصدر أو المنشأ، وإضافة «يأتي» تُظهر المعنى الضمني في الجملة اليونانية غير الفعلية.
- source_word: ἀκοή
  choice: السماع
  rationale: قد تعني اللفظة فعل السماع أو ما يُسمع؛ يحافظ «السماع» على الترابط اللفظي بين ورودَيها من غير حسم زائد.
- source_word: δὲ
  choice: و
  rationale: تفيد هنا وصلًا استمراريًا لطيفًا لا تعارضًا قويًا.
- source_word: διὰ
  choice: من خلال
  rationale: تدل διά مع المضاف إليه على الوسيلة؛ وهذه الصياغة تبين الوساطة بوضوح.
- source_word: ῥήματος
  choice: كلمة
  rationale: تشير ῥῆμα إلى كلمة منطوقة أو قول، و«كلمة» تحفظ الصياغة اللفظية والرنين المألوف.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: Χριστός لقب، فيُنقل إلى العربية بلفظه الدال على اللقب «المسيح»؛ وتبقى علاقة المضاف إليه قابلة لأكثر من فهم.
theological_decisions:
- issue: دلالة πίστις في هذا السياق
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: يتناول السياق الاستجابة للكرازة بعد سماعها، ولذلك «الإيمان» هو الأنسب من غير إدخال معنى تخصصي زائد.
- issue: علاقة Χριστοῦ بـ ῥήματος
  choice: كلمة المسيح
  alternative: الكلمة عن المسيح؛ الرسالة المتعلقة بالمسيح
  rationale: يمكن فهم المضاف إليه اليوناني على أنه يدل على المصدر أو الاختصاص، أو على موضوع الكلمة. تحافظ الصياغة الأساسية على هذا التركيب، وتذكر الحاشية القراءة التفسيرية البديلة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «إذًا» لإبراز الاستنتاج، وحُفظ التكرار بين «السماع» في الشطرين، مع إثبات علامة الحاشية في المتن.
