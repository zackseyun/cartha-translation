  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: ar
  text: 'وكيف ينادون إن لم يُرسَلوا؟ كما هو مكتوب: «ما أجمل[a] أقدام الذين يبشّرون بالخيرات[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما أبهى»؛ أو: «ما أطيبَ وقعَ أقدام…». فالصفة اليونانية قد تدل على الجمال، وقد توحي أيضًا بأن وصول حامل الرسالة مرحَّب به وفي وقته المناسب.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «الذين يبشّرون بالأشياء الطيبة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: ينادون
  rationale: يفيد الفعل اليوناني إعلان الرسالة على الملأ كفعل المنادي؛ و«ينادون» يحفظ هذه الصورة من غير حصرها في الوعظ الرسمي.
- source_word: ἀποσταλῶσιν
  choice: يُرسَلوا
  rationale: صيغة المبني للمجهول تدل على أن آخر يرسلهم، والترجمة المباشرة تحافظ على اعتماد المنادي على المُرسِل.
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية واضحة ومألوفة لتقديم اقتباس من الكتاب المقدس.
- source_word: ὡραῖοι
  choice: أجمل
  rationale: ينقل معنى الجمال والبهاء في صورة أقدام الرسل، مع بيان دلالة الترحيب وحسن التوقيت الممكنة في الحاشية.
- source_word: πόδες
  choice: أقدام
  rationale: يحفظ الصورة الجسدية الواردة في الاقتباس، وهي تشير إلى وصول حاملي البشارة.
- source_word: εὐαγγελιζομένων
  choice: الذين يبشّرون
  rationale: ينقل فعل إعلان الخبر السار بلغة عربية طبيعية، ويلائم صورة القادمين برسالة مفرحة.
- source_word: τὰ ἀγαθά
  choice: بالخيرات
  rationale: يحفظ مدلول العبارة اليونانية، أي «الأشياء الطيبة»، ولا يدمجها تمامًا في معنى «البشارة» السابق.
theological_decisions:
- issue: صلة صورة الرسل بإعلان الإنجيل
  choice: الإبقاء على صورة أشخاص مُرسَلين ينادون ويبشّرون بالخيرات، من غير قصر الكلام على الوعظ الكنسي الرسمي.
  alternative: ترجمة κηρύξωσιν وεὐαγγελιζομένων بألفاظ اصطلاحية قد توحي حصرًا بمنصب وعظي أو كنسي.
  rationale: سياق بولس يربط الإرسال بالإعلان، بينما يحتفي الاقتباس بوصول حاملي الخبر السار؛ فتحفظ الصياغة كلا الجانبين من دون إدخال تحديد طائفي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ينادون» لإبراز الإعلان العلني، و«يبشّرون بالخيرات» للحفاظ على التمييز بين فعل حمل البشارة ومضمونها الطيب. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
