source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: ar
  text: أيها الإخوة[a]، إن رغبة قلبي وابتهالي إلى الله من أجلهم هما لخلاصهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ تستعمل اليونانية صيغة الجمع المذكر، وقد تُستعمل لمخاطبة جماعة تضم رجالًا ونساءً.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: أيها الإخوة
  rationale: صيغة نداء جمع مذكر من ἀδελφός؛ حُفظت الصيغة الظاهرة في الأصل، مع بيان شمولها المحتمل للنساء في الحاشية.
- source_word: εὐδοκία
  choice: رغبة
  rationale: تدل هنا على ما يرجوه بولس ويشتاق إليه، لا على مجرد الرضا أو المسرة المجردة.
- source_word: τῆς ἐμῆς καρδίας
  choice: قلبي
  rationale: 'ينقل التركيب الإضافي اليوناني نقلًا عربيًا طبيعيًا ومباشرًا: «رغبة قلبي».'
- source_word: δέησις
  choice: ابتهالي
  rationale: تفيد طلبًا جادًا موجَّهًا إلى الله؛ و«ابتهال» يحفظ معنى التضرع والطلب مع بقاء العبارة واضحة وفصيحة.
- source_word: πρὸς τὸν θεόν
  choice: إلى الله
  rationale: تفيد πρός مع النصب اتجاه الابتهال إلى الله.
- source_word: ὑπὲρ αὐτῶν
  choice: من أجلهم
  rationale: تفيد ὑπέρ هنا النيابة أو طلب الخير لصالحهم، وضمير الغائب محفوظ كما في النص اليوناني.
- source_word: εἰς σωτηρίαν
  choice: أن يَخلُصوا
  rationale: تفيد εἰς الغاية المقصودة من الرغبة والابتهال؛ وصيغة الفعل العربية توضح طبيعيًا أن الخلاص مطلوب لهم من غير إضافة مضمون غير موجود في الأصل.
- source_word: μὲν
  choice: غير مصرَّح بها لفظيًا
  rationale: أداة خطابية خفيفة توحي بتمهيد أو مقابلة، ولا يقابلها δέ صريح في الآية؛ والتصريح بها في العربية قد يثقل الأسلوب أو يوحي بمقابلة أوكد من الأصل.
theological_decisions:
- issue: مدى شمول النداء Ἀδελφοί
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: أُبقيت صيغة الجمع المذكر الواردة في الأصل في المتن، مع التنبيه إلى إمكان استعمالها لمخاطبة جماعة تضم رجالًا ونساءً.
- issue: مرجع الضمير αὐτῶν
  choice: من أجلهم
  alternative: من أجل إسرائيل / من أجل بني إسرائيل
  rationale: حُفظ الضمير كما في اليونانية، لأن مرجعه يُفهم من السياق السابق، وتسمية المرجع صراحةً في هذه الآية تحسم ما تركه النص ضميرًا.
- issue: علاقة εἰς σωτηρίαν بالرغبة والابتهال
  choice: هما أن يَخلُصوا
  alternative: هما لخلاصهم
  rationale: عُبِّر عن الغاية بصياغة عربية طبيعية، من دون حسم زائد لمسائل كيفية الخلاص أو توقيته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ابتهالي» للحفاظ على قوة معنى الطلب في δέησις، وصيغ الخبر بالمثنى «هما» لموافقة «رغبة قلبي وابتهالي».
