base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: ar
  text: فلا فرق بين يهودي ويوناني[a]، لأن الرب نفسه هو رب الجميع[b]، وهو غنيّ لجميع الذين يدعونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «يوناني». وفي هذه المقابلة بين اليهودي واليوناني، يُراد باليوناني غير اليهودي؛ وتترجم بعض الترجمات اللفظة: «أممي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لأن الرب نفسه فوق الجميع».'
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: فرق
  rationale: لفظة عربية طبيعية تدل على انتفاء التفريق بين الجماعتين، من غير إضافة حكم قيمي غير وارد في النص.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: يهودي ويوناني
  rationale: يحافظ على اللفظ اليوناني الصريح «يوناني»، مع توضيح وظيفته السياقية في الحاشية بوصفه مقابلاً لليهودي.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: الرب نفسه هو رب الجميع
  rationale: يُظهر خبر الجملة الاسمية بوضوح، ويحافظ على لقب «الرب» وعلى دلالة πάντων الشاملة.
- source_word: κύριος
  choice: الرب
  rationale: هو المقابل العربي المألوف للقب المسيحاني κύριος، ويحفظ صداه الكتابي واللاهوتي في السياق.
- source_word: πλουτῶν εἰς πάντας
  choice: وهو غنيّ لجميع
  rationale: يحفظ استعارة الغنى، ويؤدي امتداد هذا الغنى إلى المستفيدين بعبارة عربية واضحة غير متكلفة.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: الذين يدعونه
  rationale: يعبّر بوضوح عن دعاء الرب والالتجاء إليه، وينسجم مع الاقتباس الوارد في العدد التالي.
theological_decisions:
- issue: مرجع لقب «الرب» في السياق
  choice: الإبقاء على لقب «الرب» بلا إضافة تفسيرية، بحيث يدل السياق القريب على يسوع المُعترف به ربًّا، مع بقاء الصدى الكتابي لدعاء الرب.
  alternative: تفسيره صراحةً بأنه الله عمومًا أو إضافة اسم يسوع داخل العدد.
  rationale: تتمحور رومية 10:9-13 حول الاعتراف بيسوع ربًّا ثم تستشهد بيوئيل؛ والترجمة لا تحسم هذا الترابط بإضافة كلمات ليست في الأصل.
- issue: نطاق «الجميع»
  choice: الجميع هم هنا جميع الذين يدعونه، بلا تفريق بين اليهودي واليوناني.
  alternative: فهم «الجميع» على أنه تقرير غير مقيّد عن كل إنسان.
  rationale: العبارة الموصولة «الذين يدعونه» تحدد المستفيدين نحويًا، مع الحفاظ على شمول الدعوة لكلا الجماعتين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «فلا فرق» للوصل التعليلي الطبيعي بالسياق السابق، وحُفظت لفظة «يوناني» في المتن للأمانة للمصدر، مع شرح المقصود السياقي في الحاشية.
