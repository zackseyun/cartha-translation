base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: ar
  text: 'أَمَّا إِشَعْيَاءُ فَيَتَجَرَّأُ جِدًّا وَيَقُولُ: «وَجَدَنِي[a] الَّذِينَ لَمْ يَطْلُبُونِي، وَظَهَرْتُ[b] لِلَّذِينَ لَمْ يَسْأَلُوا عَنِّي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وُجِدْتُ بَيْنَ الَّذِينَ لَمْ يَطْلُبُونِي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عَرَّفْتُ بِنَفْسِي لِلَّذِينَ لَمْ يَسْأَلُوا عَنِّي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: يَتَجَرَّأُ جِدًّا
  rationale: ينقل معنى الجرأة الشديدة في الفعل اليوناني، مع الحفاظ على المضارع الحي في تقديم قول إشعياء.
- source_word: Εὑρέθην
  choice: وَجَدَنِي
  rationale: صياغة عربية طبيعية للمبني للمجهول اليوناني «وُجِدتُ»، وتوضح أن غير الطالبين هم الذين وجدوه من غير تغيير للمعنى.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: الَّذِينَ لَمْ يَطْلُبُونِي
  rationale: تؤدي الاستعمال الاصطلاحي لحرف الجر ἐν مع «وُجدت»، مع حفظ احتمال المعنى الأقرب إلى اللفظ في الحاشية.
- source_word: ζητοῦσιν
  choice: يَطْلُبُونِي
  rationale: «يطلبونني» عربية واضحة وتحفظ دلالة السعي والبحث المقصود في ζητέω.
- source_word: ἐμφανὴς ἐγενόμην
  choice: ظَهَرْتُ
  rationale: ينقل معنى الصيرورة ظاهرًا أو جليًّا بعبارة عربية طبيعية، من دون تحويل العبارة صراحةً إلى فعل انعكاسي مثل «عرّفت بنفسي».
- source_word: ἐπερωτῶσιν
  choice: يَسْأَلُوا عَنِّي
  rationale: يحفظ معنى السؤال أو الاستفسار، ولا يستورد معنى «يدعونني» اللاهوتي الأخص.
- source_word: δὲ
  choice: أَمَّا
  rationale: تبيّن الانتقال التقابلي إلى شهادة إشعياء في عربية فصيحة طبيعية.
- source_word: Ἠσαΐας
  choice: إِشَعْيَاءُ
  rationale: الصيغة العربية المعيارية لاسم النبي.
theological_decisions:
- issue: صياغة إعلان الله عن نفسه في اقتباس إشعياء
  choice: ظَهَرْتُ لِلَّذِينَ لَمْ يَسْأَلُوا عَنِّي
  alternative: عَرَّفْتُ بِنَفْسِي لِلَّذِينَ لَمْ يَسْأَلُوا عَنِّي
  rationale: النص اليوناني يصرح بالظهور أو الصيرورة جليًّا، ولا يصرح بالفعل الانعكاسي «عرّفت بنفسي». لذلك تحفظ الصياغة المختارة هيئة النص وتوتره اللاهوتي، مع ذكر البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «وجدني» في المتن لطبيعتها في العربية، مع إبقاء البنية الأقرب إلى اليونانية «وُجدت بين» في الحاشية. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
