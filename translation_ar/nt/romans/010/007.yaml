  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: ar
  text: 'أو: «مَن سينزل إلى الهاوية[a]؟» (أي أن يُصعِدَ المسيحَ[b] من بين الأموات).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «الغمر السحيق». يردد بولس صدى تثنية 30:13، لكنه يستعمل هنا لفظ «الهاوية» ويطبق العبارة على إصعاد المسيح من بين الأموات.'
    reason: lexical_alternative
  - marker: b
    text: اللفظة اليونانية Χριστός، أي «المسيح»، وهي هنا مستعملة كلقب.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: أو
  rationale: أداة عطف تُدخل الشق الثاني من المقابلة في الاقتباس، و«أو» تؤدي معناها بإيجاز ووضوح.
- source_word: Τίς
  choice: مَن
  rationale: تحافظ على صيغة السؤال البلاغي المباشرة.
- source_word: καταβήσεται
  choice: سينزل
  rationale: تنقل صيغة المستقبل وتحفظ الحركة المكانية المقابلة لفعل الإصعاد لاحقًا.
- source_word: εἰς τὴν ἄβυσσον
  choice: إلى الهاوية
  rationale: «الهاوية» تقابل ἄβυσσος وتحفظ صورة العمق السحيق دون اختزالها في القبر أو عالم الأموات.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: صيغة عربية طبيعية موجزة تؤدي وظيفة العبارة التفسيرية اليونانية.
- source_word: Χριστόν
  choice: المسيح
  rationale: تنقل معنى اللقب Χριστός في العربية بدل معاملته اسمًا منقولًا صوتيًا.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تعبير عربي واضح يعكس دلالة الخروج من وسط الأموات ولا يحصرها في معنى مكاني ضيق.
- source_word: ἀναγαγεῖν
  choice: ليُصعِد
  rationale: يحفظ صورة الإتيان بالمسيح إلى أعلى، في مقابلة النزول إلى الهاوية، دون استبداله مباشرة بمصطلح القيامة.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس أو اعتبار اللفظة اسمًا علمًا مجردًا
  rationale: اللفظة هنا لقب ذو مضمون مسياني، والترجمة العربية المألوفة «المسيح» تحفظ هذا المضمون.
- issue: تفسير ἄβυσσος في شرح بولس
  choice: الإبقاء على «الهاوية»
  alternative: الغمر، القبر، عالم الأموات
  rationale: يحفظ هذا الاختيار صورة النص وإحالته التلميحية، ولا يحسم المقصود بتعبير تفسيري أضيق من اللفظ اليوناني.
- issue: العلاقة بين النزول وإصعاد المسيح
  choice: 'الإبقاء على الصورة المكانية: «ينزل» و«يُصعِد»'
  alternative: تفسير العبارة مباشرة بأنها إقامة المسيح من الموت
  rationale: السياق يشير إلى القيامة، لكن الفعل ἀνάγω نفسه يصور الإصعاد؛ لذلك تُحفظ الصورة والتوتر التفسيري في المتن.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «الهاوية» للحفاظ على الصورة الأصلية، و«ليُصعِد» لصون التقابل المكاني مع «سينزل». وُضعت علامتا الحاشيتين عند اللفظتين اللتين تشرحهما الحاشيتان مباشرة.
