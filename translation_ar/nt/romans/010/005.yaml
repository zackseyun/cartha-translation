source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: ar
  text: 'فإن موسى يكتب عن البر الذي من الشريعة: «الإنسان الذي يعمل البر سيحيا فيه».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل» بدلًا من «البر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سيحيا به». واليونانية حرفيًا: «سيحيا فيه». والعبارة تردد صدى لاويين 18:5، حيث ترتبط الحياة بالعمل بفرائض الشريعة.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: فإن
  rationale: تفيد تعليل ما سبق وربطه به ربطًا تفسيريًا طبيعيًا في العربية.
- source_word: γράφει
  choice: يكتب
  rationale: يحافظ المضارع على صيغة الاستشهاد الكتابي الحاضرة في اليونانية.
- source_word: δικαιοσύνην
  choice: البر
  rationale: هو المقابل العربي المألوف في السياق البولسي، ويحفظ الصلة بالمقابلة بين البر من الشريعة والبر من الإيمان.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: الذي من الشريعة
  rationale: ينقل معنى المصدر أو المنشأ في ἐκ ويحافظ على بنية المقابلة في السياق.
- source_word: νόμου
  choice: الشريعة
  rationale: يشير السياق إلى شريعة موسى، و«الشريعة» أوضح من «الناموس» للقارئ العربي المعاصر.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: الإنسان الذي يعمل
  rationale: «الإنسان» ينقل ἄνθρωπος بصيغته المفردة التمثيلية، والمضارع العربي يعبّر طبيعيًا عن المبدأ العام الذي يؤديه اسم الفاعل الأوريستي.
- source_word: ζήσεται
  choice: سيحيا
  rationale: ينقل المستقبل اليوناني مباشرة ويحفظ صدى لاويين 18:5.
- source_word: ἐν αὐτῇ
  choice: به
  rationale: الضمير في النص اليوناني مفرد مؤنث يعود نحويًا إلى «البر»، لذا يحافظ «به» على المفرد وعلى الغموض الدلالي بدل تحويله إلى جمع اعتمادًا على نص لاويين.
theological_decisions:
- issue: ترجمة δικαιοσύνη في مقابلة بولسية
  choice: البر
  alternative: العدل
  rationale: «البر» يحفظ الاستعمال البولسي والصلة الاصطلاحية بالسياق، مع إثبات «العدل» بديلًا معجميًا في الحاشية.
- issue: مرجع ἐν αὐτῇ وصلته باقتباس لاويين 18:5
  choice: به
  alternative: 'فيه؛ أو: بها/فيها، أي بالوصايا'
  rationale: الصيغة اليونانية الموجودة مفردة مؤنثة، وأقرب مرجع نحوي لها هو «البر». لكن العبارة تردد صدى لاويين 18:5، حيث الحياة مرتبطة بالفرائض؛ لذلك تُصان هذه الإمكانية في الحاشية دون تسوية التوتر في المتن.
- issue: القوة التمثيلية لكلمة ἄνθρωπος
  choice: الإنسان
  alternative: الرجل
  rationale: ἄνθρωπος تعني الإنسان أو الشخص، وهي هنا مفردة ذات دلالة عامة؛ «الإنسان» دقيق من غير إدخال تخصيص جنسي لا تفرضه اللفظة نفسها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «الشريعة» بدل «الناموس» لوضوحها العام، وحُفظت صيغة الاقتباس بالمضارع «يكتب». وُضعت علامتا الحاشية في المتن، مع إبقاء غموض الضمير اليوناني وتوتره مع نص لاويين في الحاشية.
