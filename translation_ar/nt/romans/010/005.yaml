  verdict: revise
  source_fidelity: 'يحفظ النص المسودة معظم عناصر اليونانية: أداة التعليل، وصيغة الاستشهاد بالمضارع، و«البر الذي من الشريعة»، والمستقبل «سيحيا». لكن «الإنسان الذي يعمل به» لا يؤدي الفعل ποιήσας أداءً سليمًا؛ فالفعل اليوناني يفترض مفعولًا محذوفًا في صيغة الاقتباس، ولا يفيد «يعمل بواسطة البر».'
  naturalness: «الإنسان الذي يعمل به» ثقيلة وملتبسة في العربية الحديثة، وقد تُفهم على أنها استعمال البر أداةً. إضافة «البر» مفعولًا به تجعل العبارة سليمة وواضحة، مع بقاء الضمير المفرد في «فيه» ذا مرجع محتمل إلى البر، كما في البنية اليونانية.
  terminology: «البر» مقابل راسخ ومناسب لـ δικαιοσύνη في هذا السياق البولسي، و«الشريعة» اختيار فصيح واضح لـ νόμος. والبديل «العدل» مناسب في الحاشية. لا يلزم إدخال قراءة مذهبية لتفسير علاقة الضمير بالاقتباس من اللاويين.
