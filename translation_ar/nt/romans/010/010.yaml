    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: بالقلب
  rationale: تحفظ الدلالة على الإنسان الباطن، وتلائم الموازاة مع «بالفم».
- source_word: γὰρ
  choice: لأنَّ
  rationale: تبيّن أن الآية تعليل وشرح لما قبلها.
- source_word: πιστεύεται
  choice: الإيمان ... يؤدي
  rationale: الصيغة اليونانية عامة وغير شخصية؛ وصياغة المصدر في العربية تنقل العموم بطلاقة من غير تعيين فاعل.
- source_word: εἰς δικαιοσύνην
  choice: يؤدي إلى البرّ
  rationale: تنقل εἰς بوصفها دالة على الغاية أو النتيجة، مع تجنب حسم طبيعة العلاقة حسمًا آليًا.
- source_word: δικαιοσύνην
  choice: البرّ
  rationale: «البرّ» هو المقابل العربي الكتابي الراسخ، ويحفظ المجال القضائي والأخلاقي للمصطلح عند بولس دون قصره على العدالة الاجتماعية.
- source_word: στόματι
  choice: بالفم
  rationale: تحفظ الأداة الظاهرة والموازاة البلاغية مع «بالقلب».
- source_word: δὲ
  choice: و
  rationale: تصل بين الشطرين المتكاملين من غير إيهام بتعارض قوي.
- source_word: ὁμολογεῖται
  choice: الإقرار ... يؤدي
  rationale: «الإقرار» يلائم سياق الإقرار الشفهي بأن يسوع رب في الآية السابقة، وصيغة المصدر تحافظ على العموم.
- source_word: εἰς σωτηρίαν
  choice: يؤدي إلى الخلاص
  rationale: تحفظ التوازي مع «يؤدي إلى البرّ» وتنقل معنى الغاية أو النتيجة من غير شرح زائد.
- source_word: σωτηρίαν
  choice: الخلاص
  rationale: هو التعبير العربي المعياري الملائم للسياق الخلاصي البولسي، ويستوعب أبعاد النجاة الحاضرة والمستقبلية.
theological_decisions:
- issue: علاقة الإيمان والإقرار بالبر والخلاص
  choice: 'الإبقاء على الاقتران الموازي: الإيمان بالقلب يؤدي إلى البر، والإقرار بالفم يؤدي إلى الخلاص.'
  alternative: اعتبار الإقرار مجرد دليل على خلاص سبق، أو شرطًا إضافيًا يستحق به الإنسان الخلاص.
  rationale: يعرض اليوناني عبارتين متوازيتين مع εἰς، ولا يحدّد هنا ترتيبًا آليًا للتبرير والخلاص ولا يجعل الإقرار عملًا استحقاقيًا؛ لذلك تُحفظ حدة العبارة كما هي.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُخدمت صياغة اسمية عامة لتجنب ثقل المبني للمجهول اليوناني في العربية، مع الحفاظ على الموازاة بين القلب والفم وبين البر والخلاص.
