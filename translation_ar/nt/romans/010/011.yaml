  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: ar
  text: 'لِأَنَّ الْكِتَابَ يَقُولُ: «كُلُّ مَنْ يُؤْمِنُ بِهِ لَنْ يُخْزَى».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلُّ من يؤمن به لن يخجل».'
    reason: بديل معجمي يعبّر عن καταισχυνθήσεται بوصفه شعورًا بالخجل، مع أن المتن يحافظ بصورة أوضح على المبني للمجهول ودلالة الخزي.
lexical_decisions:
- source_word: λέγει
  choice: يقول
  rationale: 'المضارع مناسب لصيغة الاستشهاد الحية والمألوفة: «الكتاب يقول».'
- source_word: γὰρ
  choice: لأنَّ
  rationale: تفيد الأداة تعليل ما سبق وربطه بحجة بولس، و«لأنَّ» تؤدي هذا المعنى بوضوح.
- source_word: ἡ γραφή
  choice: الكتاب
  rationale: تشير γραφή هنا إلى الكتاب المقدس بوصفه نصًّا ذا سلطان، و«الكتاب» تعبير عربي كتابي موجز وطبيعي في صيغة الاستشهاد.
- source_word: Πᾶς ὁ πιστεύων
  choice: كلُّ من يؤمن
  rationale: تنقل هذه الصياغة الشمول في التركيب اليوناني من غير أن تحصره في الذكور أو تستخدم تركيبًا حرفيًّا متكلفًا.
- source_word: ἐπ’ αὐτῷ
  choice: به
  rationale: مع فعل الإيمان تفيد ἐπί مع المجرور توجيه الثقة والاتكال إلى شخص؛ و«يؤمن به» هي الصياغة العربية الطبيعية مع إبقاء الضمير دون تفسير زائد.
- source_word: οὐ καταισχυνθήσεται
  choice: لن يُخزى
  rationale: تحافظ «يُخزى» على المبني للمجهول وعلى معنى التعرض للخزي أو انكشاف الخيبة، كما أنها موجزة وملائمة لخلفية الاقتباس من إشعياء.
theological_decisions:
- issue: الدلالة العامة لصيغة Πᾶς ὁ πιστεύων المذكرة نحويًّا
  choice: كلُّ من يؤمن
  alternative: كل رجل يؤمن
  rationale: التذكير هنا نحوي وتمثيلي لا تخصيص فيه للذكور، ولذلك تنقل «كل من» الشمول المقصود بدقة.
- issue: مرجع الضمير αὐτῷ
  choice: به
  alternative: بالمسيح / بالرب
  rationale: أُبقي الضمير كما في الأصل لأن السياق السابق يبين مرجعه، ولتجنب إدخال تفسير صريح في نص الاقتباس.
- issue: قوة المبني للمجهول في καταισχυνθήσεται
  choice: لن يُخزى
  alternative: لن يخجل
  rationale: يحافظ الاختيار على احتمال الخزي الموضوعي أو الخيبة العلنية، بدل قصر العبارة على شعور داخلي بالخجل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم ضبط محدود لتوضيح الإعراب والبناء للمجهول، مع صياغة موجزة تلائم أسلوب الاقتباس الكتابي.
