source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: ar
  text: 'أَمَّا الْبِرُّ الَّذِي مِنَ الإِيمَانِ فَيَقُولُ هَكَذَا: «لَا تَقُلْ فِي قَلْبِكَ: مَنْ سَيَصْعَدُ إِلَى السَّمَاءِ؟» (أَيْ: لِإِنْزَالِ الْمَسِيحِ).[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يردّد بولس هنا صدى تثنية 30:12 ويطبّق الكلام على المسيح.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: الْبِرُّ
  rationale: اللفظ العربي المألوف في السياق البولسي، ويحفظ الدلالة الأخلاقية والقضائية دون قصرها على معنى العدالة وحده.
- source_word: ἐκ πίστεως
  choice: الَّذِي مِنَ الإِيمَانِ
  rationale: يحافظ على دلالة ἐκ المصدرية وعلى مقابلة بولس بين البر من الإيمان والبر المرتبط بالناموس.
- source_word: οὕτως λέγει
  choice: فَيَقُولُ هَكَذَا
  rationale: يحفظ زمن الفعل وتشخيص البر بوصفه متكلمًا، بصياغة عربية واضحة.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: لَا تَقُلْ فِي قَلْبِكَ
  rationale: ترجمة مباشرة للصياغة المقتبسة، وتحفظ معنى الحديث الباطني.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: مَنْ سَيَصْعَدُ إِلَى السَّمَاءِ؟
  rationale: صياغة عربية طبيعية تحافظ على السؤال الاستنكاري واتجاه الحركة في النص اليوناني.
- source_word: Χριστόν
  choice: الْمَسِيحَ
  rationale: Χριστός هنا لقب ذو دلالة مسيانية في شرح بولس للنص الكتابي، ولذلك تُنقل دلالته لا بصيغة اسمية مستعارة.
- source_word: καταγαγεῖν
  choice: لِيُنْزِلَ
  rationale: المصدر يشرح مؤدى السؤال السابق؛ واختيار لام التعليل مع الفعل يحفظ معنى «إنزال المسيح» في عربية موجزة.
theological_decisions:
- issue: تشخيص البر الذي من الإيمان
  choice: 'الإبقاء على البر فاعلًا للفعل: «فيقول هكذا»'
  alternative: «وهذا ما يقوله البر الذي من الإيمان»
  rationale: البنية اليونانية تجعل δικαιοσύνη فاعل λέγει، والإبقاء عليها يحفظ أسلوب بولس والمقابلة مع الآية السابقة.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس أو المسيح بوصفه اسمًا مجردًا
  rationale: يعمل اللفظ هنا كلقب في تطبيق اقتباس تثنية 30:12 على المسيح، فـ«المسيح» ينقل معناه بوضوح.
- issue: صلة المصدر καταγαγεῖν بالسؤال السابق
  choice: «أي لينزل المسيح»
  alternative: «أي أن يُنزِل المسيح»
  rationale: 'تُبقي الصياغة على الغاية الضمنية للسؤال: كأن الصعود إلى السماء مطلوب لإنزال المسيح، دون إضافة فاعل غير مصرّح به.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظ تشخيص «البر» والتعبير «في قلبك». استُخدم الضبط الجزئي الكامل في نص الآية لتيسير القراءة، ووُضعت علامة الحاشية بعد الجملة التفسيرية التي تخصها.
