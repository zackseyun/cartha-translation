id: ROM.10.9
reference: Romans 10:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: ar
  text: لأنك إن اعترفت بفمك بأن يسوع هو الرب[a]، وآمنت بقلبك أن الله أقامه من بين الأموات، تخلُص.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اعترفت بيسوع ربًّا».'
    reason: بديل معجمي وتركيبي لعبارة κύριον Ἰησοῦν، يحافظ على إيجاز الأصل مع بقاء معنى الاعتراف بربوبية يسوع.
lexical_decisions:
- source_word: ὅτι
  choice: لأنك
  rationale: تؤدي الأداة معنى التعليل لما سبق، ومع ضمير المخاطب في الشرط تأتي الصياغة العربية الطبيعية «لأنك إن».
- source_word: ἐὰν
  choice: إن
  rationale: أداة شرط فصيحة وطبيعية تلائم فعلي الشرط والجواب.
- source_word: ὁμολογήσῃς
  choice: اعترفت
  rationale: تحفظ معنى الإقرار اللفظي العلني، من غير حصره في مجرد المعرفة أو التصريح المحايد.
- source_word: ἐν τῷ στόματί σου
  choice: بفمك
  rationale: صياغة عربية موجزة تؤدي الدلالة الوسيلية واللفظية للتعبير اليوناني.
- source_word: κύριον Ἰησοῦν
  choice: بأن يسوع هو الرب
  rationale: تُظهر مضمون الاعتراف بوضوح وتحفظ «الرب» لقبًا ليسوع، بدل أن تجعل العبارة مجرد اسم مركب.
- source_word: πιστεύσῃς
  choice: آمنت
  rationale: المقابل العربي المباشر والطبيعي لفعل الإيمان في جملة يتلوها مضمون الاعتقاد.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: بقلبك
  rationale: تعبير عربي طبيعي يحفظ دلالة الاقتناع الباطني، ويوازي «بفمك» أسلوبيًا.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: أن الله أقامه
  rationale: يحفظ الفاعل الإلهي وضمير المفعول، ويؤدي الماضي اليوناني بصيغة الماضي العربية.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: يعكس بدقة معنى القيامة من وسط الموتى، وهو تعبير عربي واضح ومألوف.
- source_word: σωθήσῃ
  choice: تخلُص
  rationale: ينقل المبني للمجهول ذا الدلالة الخلاصية بصيغة عربية موجزة مألوفة، من غير إضافة فاعل غير مذكور صراحة.
theological_decisions:
- issue: دلالة κύριος في صيغة الاعتراف
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ سلطة اللقب وصدى استعماله الكتابي في السياق القريب، ولا يضيّق المعنى إلى مجرد السيادة البشرية.
- issue: بنية عبارة κύριον Ἰησοῦν
  choice: بأن يسوع هو الرب
  alternative: بيسوع ربًّا
  rationale: الصياغة المختارة توضح مضمون الاعتراف بالعربية وتحفظ القوة الخبرية للعبارة، مع إثبات البديل الأقرب إلى التركيب اليوناني في الحاشية.
- issue: القوة الخلاصية للفعل σωθήσῃ
  choice: تخلُص
  alternative: تُنجَّى
  rationale: «تخلُص» تحافظ على الدلالة الخلاصية في سياق رومية، من غير اختزالها في نجاة عامة أو إضافة تفصيل لاهوتي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الموازاة الطبيعية «بفمك... بقلبك»، وحُفظت الصيغة الشرطية والتوتر اللاهوتي في الربط بين الاعتراف والإيمان والخلاص دون شرح زائد.
