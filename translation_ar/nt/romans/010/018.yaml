  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: ar
  text: 'لكنني أقول: أفلم يسمعوا؟ بلى، لقد سمعوا: «إلى الأرض كلها انطلق صوتهم[a][c]، وبلغت كلماتهم إلى أقاصي المسكونة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «رنينهم».'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز ببساطة: «العالم»؛ واللفظ اليوناني يعني العالم المأهول.'
    reason: lexical_alternative
  - marker: c
    text: يقتبس بولس هنا مزمور 19:4 ويطبّق لغته على انتشار الرسالة.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: ألعلهم لم يسمعوا؟
  rationale: صياغة استفهام إنكاري يتوقع جوابًا مثبتًا، مع إبقاء الفعل في الماضي وفق صيغة الماضي اليونانية.
- source_word: μενοῦνγε
  choice: بلى، لقد سمعوا
  rationale: «بلى» جواب عربي طبيعي عن السؤال المنفي، وإظهار الفعل المضمر ينقل قوة التأكيد بوضوح.
- source_word: φθόγγος
  choice: صوتهم
  rationale: «الصوت» يلائم سياق الاقتباس الشعري ويقيم موازاة طبيعية مع «كلماتهم»، مع إثبات «رنينهم» بديلًا ممكنًا في الحاشية.
- source_word: γῆ
  choice: الأرض
  rationale: السياق الكوني للاقتباس يدل على الأرض كلها، لا على إقليم أو بلاد بعينها.
- source_word: ἐξῆλθεν
  choice: انطلق
  rationale: ينقل صورة خروج الصوت وانتشاره بلغة عربية طبيعية، من غير إضافة تفسيرية تتجاوز الفعل اليوناني.
- source_word: πέρατα
  choice: أقاصي
  rationale: «أقاصي» تعبير عربي موجز وشعري عن الأطراف البعيدة، ويحفظ التوازي في الاقتباس.
- source_word: οἰκουμένης
  choice: المسكونة
  rationale: يحفظ الدلالة الحرفية على العالم المأهول، مع إمكان ترجمتها بسلاسة أكبر إلى «العالم» كما توضح الحاشية.
- source_word: ῥήματα
  choice: كلماتهم
  rationale: المقابل المباشر الذي يحافظ على الموازاة مع «صوتهم»، ولا يحوّل اللفظ تفسيرًا إلى «رسالتهم».
theological_decisions:
- issue: مرجع ضمير الجمع في «صوتهم» و«كلماتهم»
  choice: الإبقاء على الضمير من دون تعيين مرجعه في المتن
  alternative: تعيينه صراحةً بالسموات في سياق المزمور، أو بالمبشرين والرسل في تطبيق بولس
  rationale: يقتبس بولس لغة المزمور ويطبقها في حجته؛ لذلك يحفظ النص توتر الإحالة ولا يحسمها بإضافة تفسيرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «ألعلهم» للاستفهام الإنكاري، و«بلى» للجواب المثبت عن النفي. حُفظ الإيقاع الموازي للاقتباس من غير تعيين مرجع الضمائر.
