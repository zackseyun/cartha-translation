  text: فإني أشهد في شأنهم بأن لهم غيرةً لله[a]، لكنها لا تقوم على معرفة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غيرةَ الله»؛ فالإضافة في اليونانية يمكن ترجمتها حرفيًا هكذا، لكن المرجح هنا أنها تعني غيرةً متجهة إلى الله.'
