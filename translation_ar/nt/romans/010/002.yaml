lexical_decisions:
- source_word: μαρτυρῶ
  choice: أشهد
  rationale: يحافظ على قوة الإفادة المباشرة في صيغة المضارع، وهو تعبير عربي واضح وطبيعي.
- source_word: γὰρ
  choice: فإني
  rationale: الفاء مع «إن» تُظهر الصلة التفسيرية بما قبل الآية وتلائم سياق الحجاج.
- source_word: αὐτοῖς
  choice: لهم
  rationale: اللام هنا بمعنى الشهادة لصالحهم أو في شأنهم، ولا تعني أن الكلام موجَّه إليهم؛ وهذا استعمال عربي طبيعي يلائم السياق.
- source_word: ζῆλον θεοῦ
  choice: غيرةً لله
  rationale: تُفهم الإضافة اليونانية على الأرجح على أن الله هو المتعلَّق الذي تتجه إليه الغيرة، مع الإشارة في الحاشية إلى الاحتمال الحرفي.
- source_word: ἔχουσιν
  choice: عندهم
  rationale: صياغة عربية طبيعية لمعنى الامتلاك، من غير زيادة تفسيرية.
- source_word: ἀλλ’
  choice: لكنها
  rationale: يُبرز الاستدراك بوضوح، ويعيد الضمير على الغيرة لتستقيم العبارة العربية.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: ليست على أساس معرفة
  rationale: يحفظ معنى κατά بوصف المعرفة معيارًا أو أساسًا، ويتجنب حسم ما إذا كانت ἐπίγνωσις تعني المعرفة الكاملة أو الصحيحة.
theological_decisions:
- issue: طبيعة غيرة إسرائيل
  choice: غيرة متجهة إلى الله لكنها ليست قائمة على معرفة
  alternative: غيرة صادرة من الله، أو غيرة دينية من غير تحديد متعلَّقها
  rationale: يرجح السياق أن θεοῦ مضاف إليه موضوعي، إذ يقر بولعهم بالله ثم ينتقد افتقار هذا الولع إلى المعرفة. وتبقى المفارقة بين الإخلاص وصحة الفهم من غير تسويتها.
- issue: دلالة ἐπίγνωσις
  choice: معرفة من غير إضافة وصف تفسيري
  alternative: معرفة كاملة، أو معرفة صحيحة
  rationale: اللفظة قد تحمل إيحاء المعرفة الوافية أو الصحيحة، لكن إدخال «كاملة» أو «صحيحة» في المتن يحسم دلالة لا يصرح بها التركيب وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «غيرة لله» لأنها مفهومة في السياق الديني، واستُعمل «على أساس معرفة» لتقديم معنى طبيعي مع إبقاء مدى دلالة المعرفة مفتوحًا.
