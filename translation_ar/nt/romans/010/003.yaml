review_pass:
  verdict: revise
  source_fidelity: 'المعنى الرئيس محفوظ: الجهل ببرّ الله، والسعي إلى إقامة برّهم الخاص، ثم عدم الخضوع لبرّ الله. لكن «إذ لم يعرفوا» قد توحي بفعل ماضٍ منتهٍ أكثر من دلالة اسم الفاعل المضارع في اليونانية، و«بِرّهم هم» أقل سلاسة من التعبير الطبيعي عن الملكية الخاصة.'
  naturalness: الصياغة المنقحة تحافظ على الفصحى الحديثة الواضحة، وتستعمل «لجهلهم» و«برّهم الخاص» في تركيب عربي أيسر وأدق. كما أن «إقامة» أنسب من «إثبات» في هذا السياق، إذ تنقل معنى جعل البر قائماً أو مُقرّاً.
  terminology: يُحافَظ على «برّ الله» للمصطلح البولسي وعلى غموض الإضافة المقصود. وتبقى «عدل» بديلاً معجميًا في الحاشية دون حسم الدلالة اللاهوتية. وتُصحَّح الحاشية الثانية لتبيّن صراحة أن الملاحظة تخص عبارتي «برّ الله» في الآية.
  issues:
  - severity: medium
    issue: «إذ لم يعرفوا» لا تعكس على نحو أمثل دلالة ἀγνοοῦντες الحاضرة/المستمرة.
    rationale: اسم الفاعل المضارع يصف حالة الجهل التي تفسر الفعل اللاحق؛ و«لجهلهم» يحفظ الوظيفة السببية من غير الإيحاء بأن المعرفة كانت غائبة في لحظة ماضية منتهية.
  - severity: low
    issue: «بِرّهم هم» ثقيلة وأقل طبيعية في العربية المعاصرة.
    rationale: «برّهم الخاص» ينقل ἰδίαν بوضوح وبلا توكيد ضميري غير لازم، مع إبقاء الاسم المحذوف في اليونانية مظهَرًا للعربية.
  - severity: low
    issue: «إثبات برّهم» أضيق وأقل مباشرة من «إقامة برّهم» في السياق.
    rationale: στῆσαι تعني جعل الشيء قائمًا أو راسخًا؛ و«إقامة» تؤدي هذا المعنى العربي الطبيعي دون إضافة تفسيرية.
  - severity: low
    issue: الحاشية [b] لا تصرح بأن ملاحظتها تنطبق على تكرار عبارة «برّ الله» في الآية.
    rationale: لأن العبارة ترد مرتين، يستحسن تحديد نطاق الحاشية كي لا يبدو أنها تخص الموضع الأخير وحده.
