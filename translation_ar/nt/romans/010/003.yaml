  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: ar
  text: فَإِنَّهُمْ، لِجَهْلِهِمْ بِبِرِّ اللهِ[a] وَسَعْيِهِمْ إِلَى إِقَامَةِ بِرِّهِمُ الْخَاصِّ، لَمْ يَخْضَعُوا لِبِرِّ اللهِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «بِرّ» هنا وفي آخر الآية بـ«عدل». وقد يدل اللفظ عند بولس على برّ الله أو عدله، أو على طريقته البارّة في جعل الناس أبرارًا.
    reason: lexical_alternative
  - marker: b
    text: يمكن فهم عبارة «بِرّ الله» في الموضعين أيضًا بمعنى «البر الآتي من الله» أو «برّ الله نفسه». ويسمح التعبير اليوناني بأكثر من دلالة متداخلة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: إذ لم يعرفوا
  rationale: ينقل اسم الفاعل الحالي بوصفه ظرفًا سببيًا يفسّر موقفهم، ويحافظ على معنى عدم المعرفة من غير أن يبالغ فيجعله رفضًا متعمدًا صريحًا.
- source_word: γὰρ
  choice: لأنهم
  rationale: أداة تفسير وتعليل تربط الآية بما قبلها، و«لأن» طبيعية وواضحة في العربية المعاصرة.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: بِرّ
  rationale: «البِرّ» هو المقابل العربي الكتابي والطبيعي هنا، ويمكن أن يشمل استقامة الله وطريقته في جعل الناس أبرارًا، لا مجرد العدالة التوزيعية.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: الإضافة العربية «بِرّ الله» تحافظ بقدر جيد على إمكان فهم العبارة بوصفها بر الله نفسه أو البر الآتي منه، من غير حسم زائد.
- source_word: ἰδίαν
  choice: بِرّهم هم
  rationale: الصفة اليونانية جاءت مع حذف «البر» المفهوم من السياق؛ وإظهاره بالعربية يزيل اللبس، مع «هم» للتوكيد الذي تحمله دلالة «خاصتهم».
- source_word: ζητοῦντες
  choice: سعوا
  rationale: ينقل معنى الطلب والمحاولة المستمرة في تركيب عربي طبيعي، من غير إضافة حكم على دوافعهم.
- source_word: στῆσαι
  choice: إثبات
  rationale: يفيد إقامة برهم وتثبيته بوصفه قائمًا أو معتبرًا، وهو أوضح عربيًا في هذا السياق من الترجمة الحرفية «إيقاف».
- source_word: ὑπετάγησαν
  choice: لم يخضعوا
  rationale: ينقل المبني للمجهول ذا الدلالة الوسطية هنا بصياغة عربية مألوفة تفيد عدم وضع أنفسهم تحت سلطان بر الله.
theological_decisions:
- issue: دلالة «بِرّ الله» في الاستعمال البولسي
  choice: الإبقاء على «بِرّ الله» في المتن من غير تفسير حاسم لنوع الإضافة
  alternative: «البر الآتي من الله» أو «استقامة الله» أو «عمل الله البار الخلاصي»
  rationale: التركيب اليوناني يحتمل أن يشير إلى صفة الله، أو البر الصادر منه، أو فعله البار الخلاصي؛ وتحافظ الإضافة العربية على هذا التوتر اللاهوتي بدل تضييقه إلى قراءة واحدة.
- issue: العلاقة بين عدم المعرفة وعدم الخضوع
  choice: عدم تحويل «لم يعرفوا» إلى «رفضوا أن يعرفوا»
  alternative: صياغة تُصرّح بالجهل المتعمد أو الرفض الواعي
  rationale: النص يذكر عدم المعرفة ثم عدم الخضوع، لكنه لا يعرّف صراحة درجة التعمد في عدم المعرفة؛ لذلك لا ينبغي تحميل الفعل أكثر مما يحتمل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الإضافة «بِرّ الله» لحفظ إيجاز الأصل وغموض نوع الإضافة، وأُظهر الاسم المحذوف في «بِرّهم هم» طلبًا للوضوح. وُضع كل من علامتي الحاشية [a] و[b] في المتن.
