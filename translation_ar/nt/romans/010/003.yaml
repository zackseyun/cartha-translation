revisions:
- from: لِأَنَّهُمْ، إِذْ لَمْ يَعْرِفُوا بِرَّ اللهِ[a]، وَسَعَوْا إِلَى إِثْبَاتِ بِرِّهِمْ هُمْ، لَمْ يَخْضَعُوا لِبِرِّ اللهِ.[b]
  to: فَإِنَّهُمْ، لِجَهْلِهِمْ بِبِرِّ اللهِ[a] وَسَعْيِهِمْ إِلَى إِقَامَةِ بِرِّهِمُ الْخَاصِّ، لَمْ يَخْضَعُوا لِبِرِّ اللهِ.[b]
  rationale: تقتصر المراجعة على تحسين المطابقة لدلالة اسم الفاعل اليوناني وعلى تنقيح الأسلوب العربي. لا تحسم الترجمة نوع الإضافة في «برّ الله»، ولا تضيف حكماً بشأن مدى تعمّد جهلهم أو طبيعة البر الذي سعوا إلى إقامته.
