  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: ar
  text: فكيف إذن يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا عنه؟[a] وكيف يسمعون من دون أن يكرز أحد؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكيف يؤمنون بمن لم يسمعوا خبرَه؟»'
    reason: بديل يوضح أن السماع المقصود يتصل بالخبر أو الرسالة المتعلقة به، من غير افتراض سماع مباشر.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: فكيف إذن
  rationale: تحفظ أداة الاستفهام الاستنكاري وقوة الاستنتاج في οὖν، وتصل الكلام بسياقه السابق بعبارة عربية طبيعية.
- source_word: ἐπικαλέσωνται
  choice: يدعون
  rationale: ينقل معنى التوجّه إلى الرب بالدعاء وطلب العون، ويحافظ على الصلة بالاقتباس السابق عن دعوة اسم الرب.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: من لم يؤمنوا به
  rationale: هذه هي الصياغة العربية المألوفة مع «آمن بـ»، وتحفظ كون الإيمان شرطًا سابقًا للدعاء، من غير تكلّف في نقل حرف الجر اليوناني حرفيًا.
- source_word: πιστεύσωσιν
  choice: يؤمنون
  rationale: يحافظ على لفظ الإيمان في تسلسل حجة بولس، ويؤدي صيغة الاحتمال في السؤال الاستنكاري بمضارع عربي طبيعي.
- source_word: οὗ οὐκ ἤκουσαν
  choice: بمن لم يسمعوا عنه
  rationale: تفيد في العربية سماع الخبر أو الرسالة عن المسيح، وهو معنى محتمل قوي للتركيب؛ وأُبقي احتمال السماع المباشر في الحاشية لأن تركيب اليونانية يحتمله.
- source_word: ἀκούσωσιν
  choice: يسمعون
  rationale: الترجمة المباشرة تحافظ على تكرار جذر السماع وعلى تدرّج الحجة.
- source_word: χωρὶς κηρύσσοντος
  choice: إن لم يكن هناك من يكرز
  rationale: تنقل غياب الشخص القائم بفعل المناداة، وتحافظ على تركيز اسم الفاعل اليوناني على النشاط بدل الإيحاء بمنصب رسمي.
theological_decisions:
- issue: لغة πιστεύω والإيمان
  choice: يؤمنون / يؤمنوا
  alternative: يثقون / يضعون ثقتهم
  rationale: «يؤمن» هو المقابل العربي المباشر والمألوف، ويحفظ السلسلة اللفظية واللاهوتية من غير توسيع تفسيري.
- issue: متعلَّق السماع في οὗ οὐκ ἤκουσαν
  choice: بمن لم يسمعوا عنه
  alternative: بمن لم يسمعوه
  rationale: قد يدل المضاف إليه مع فعل السماع على سماع رسالة عن المسيح، وقد يُفهم على سماع المسيح نفسه متكلمًا بواسطة المنادين. اختيرت القراءة الأولى في المتن لوضوحها العربي، وحُفظت الثانية في الحاشية منعًا لحسم التوتر الحقيقي في اليونانية.
- issue: هوية κηρύσσοντος
  choice: من يكرز
  alternative: كارز
  rationale: الصيغة اليونانية اسم فاعل يبرز فعل الكرازة، لا رتبة كنسية أو منصبًا محددًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت «يكرز» بوصفها لفظة كنسية واسعة التداول ودقيقة لمعنى الإعلان العلني، مع تجنب تحويل اسم الفاعل إلى لقب وظيفي. وُضع مؤشر الحاشية [a] في المتن.
