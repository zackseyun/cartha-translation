  source_fidelity: المتن يحافظ جيدًا على تسلسل الأسئلة الاستنكارية وعلى ألفاظ الدعاء والإيمان والسماع. لكن الحاشية الحالية تجعل البديل «لم يسمعوه» احتمالًا لسماع المسيح مباشرة، وهذا لا يمثّل على نحو دقيق الاستعمال الأرجح للتركيب اليوناني ἀκούω مع المضاف إليه، الذي يشير إلى السماع عنه أو إلى الخبر المتعلق به. كما أن «من دون أن يكرز أحد» أقرب إلى χωρὶς κηρύσσοντος من الشرط «إن لم يكن هناك».
  naturalness: العربية واضحة وفصيحة. وتعبير «من دون أن يكرز أحد» أكثر سلاسة ومباشرة في نقل معنى «من دون شخص يكرز» من «إن لم يكن هناك من يكرز».
  terminology: «يدعون»، و«يؤمنون»، و«يكرز» ألفاظ مناسبة للسياق وللاستعمال الكتابي العربي. ويحافظ «يسمعوا عنه» على المعنى الطبيعي للسماع المتعلق بالمسيح دون افتراض سماع مباشر له.
