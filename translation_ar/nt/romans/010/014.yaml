  to: فكيف إذن يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا عنه؟[a] وكيف يسمعون من دون أن يكرز أحد؟
  rationale: أُبقيت بنية الحجة وتكرار ألفاظ الدعاء والإيمان والسماع كما في اليونانية. وصُحّحت الحاشية كيلا تنسب إلى التركيب اليوناني دلالة السماع المباشر، وعدّلت العبارة الأخيرة إلى مقابل عربي مباشر لـ«من دون شخص يكرز».
