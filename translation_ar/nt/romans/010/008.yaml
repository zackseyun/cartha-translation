  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: ar
  text: بل ماذا يقول؟ «الكلمة قريبة منك، في فمك وفي قلبك»[b]، أي كلمة الإيمان[a] التي نعلنها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «رسالة الإيمان»؛ وقد تدل πίστις في بعض السياقات على «الثقة» أو «الأمانة».'
    reason: lexical_alternative
  - marker: b
    text: يقتبس بولس هنا ألفاظ تثنية 30:14، مطبِّقًا إياها على «كلمة الإيمان» التي نعلنها.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الانتقال الاستدراكي المقابل لما سبق، وهي موجزة وطبيعية في العربية.
- source_word: τί λέγει
  choice: ماذا يقول؟
  rationale: يحافظ على الفاعل المضمر في اليونانية من غير إضافة «الكتاب» إلى المتن، مع أن السياق يدل على القول الكتابي المقتبس.
- source_word: Ἐγγύς σου
  choice: قريبة منك
  rationale: ينقل معنى القرب المكاني والمجازي، مع تأنيث الصفة لموافقة «الكلمة» في العربية.
- source_word: τὸ ῥῆμα
  choice: الكلمة
  rationale: يحافظ على صياغة الاقتباس وعلى التكرار الذي يربط الاقتباس بتفسير بولس له؛ و«الرسالة» معنى ممكن لكنه أكثر تفسيرًا.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: في فمك وفي قلبك
  rationale: ترجمة مباشرة تحفظ الصورتين الجسديتين في النص وموازاتهما.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: أداة تفسير عربية موجزة وطبيعية تؤدي معنى «وهذا هو/أي».
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: كلمة الإيمان
  rationale: تحافظ على الصلة اللفظية بتكرار ῥῆμα وعلى إيجاز الإضافة اليونانية، من غير حسم ما إذا كانت الإضافة تصف مضمون الكلمة أو طابعها أو استجابتها المطلوبة.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المقابل المعتاد لـ πίστις هنا، مع إبقاء احتمالي «الثقة» و«الأمانة» في الحاشية.
- source_word: ὃ κηρύσσομεν
  choice: التي نعلنها
  rationale: ينقل معنى الإعلان العلني في κηρύσσω بلغة عربية واضحة، ويحافظ على كون «الكلمة» مفعول الإعلان.
theological_decisions:
- issue: دلالة πίστις في عبارة τὸ ῥῆμα τῆς πίστεως
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: «الإيمان» هو المعنى الأرجح في هذا السياق البولسي، لكن تركيب الإضافة موجز ودلالة πίστις قد تتسع في بعض السياقات للثقة أو الأمانة؛ لذلك لم يُحسم وجه الإضافة بتفسير مطوّل داخل المتن.
- issue: مرجع الفاعل المضمر في τί λέγει
  choice: 'الإبقاء عليه مضمرًا: «ماذا يقول؟»'
  alternative: «ماذا يقول الكتاب؟» أو «ماذا يقول برّ الإيمان؟»
  rationale: اليونانية لا تصرّح بالفاعل في هذه الجملة، والسياق يسمح بفهمه، لذا يحفظ المتن قدرًا من الغموض الأصلي بدل إدخال مرجع تفسيري.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقرة. حُفظ إيجاز الاقتباس وتكرار «الكلمة»، وتُجنبت الإضافات التفسيرية غير الصريحة في اليونانية.
