  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: ar
  text: لأن المسيح هو نهاية الشريعة، للبرّ لكل من يؤمن[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «غاية» أو «ذروة» أو «تمام». فاللفظة اليونانية المترجمة «نهاية» قد تدل على الانتهاء، أو الغاية، أو بلوغ الشيء تمامه.
    reason: alternative_reading
  - marker: b
    text: أو «العدل» بدلًا من «البرّ» في استعمال بولس.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: نهاية
  rationale: تحفظ «نهاية» الإيجاز والتعدد الدلالي في اللفظة اليونانية، إذ قد تشير إلى الانتهاء، كما يمكن أن تحمل معنى الغاية أو الذروة بحسب السياق؛ وتُذكر البدائل في الحاشية دون حسم التوتر التفسيري.
- source_word: νόμου
  choice: الشريعة
  rationale: يشير السياق البولسي إلى شريعة موسى بوصفها إطارًا عهديًا معلومًا، و«الشريعة» أوضح للقارئ العربي المعاصر من «الناموس» وأقرب إلى الدلالة المقصودة.
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظة هنا لقب ذو دلالة مسيانية في سياق علاقة يسوع بشريعة إسرائيل ورجائها العهدي، ولذلك تُترجم «المسيح» لا بوصفها مجرد اسم منقول.
- source_word: εἰς δικαιοσύνην
  choice: للبرّ
  rationale: تحفظ اللام بإيجاز القوة الاتجاهية لعبارة εἰς، التي قد تفيد الغاية أو النتيجة، من غير إضافة تفسير سببي أو خلاصي غير مصرّح به.
- source_word: δικαιοσύνην
  choice: البرّ
  rationale: «البرّ» هو المقابل العربي الراسخ والملائم هنا للدلالة البولسية، مع إبقاء «العدل» بديلًا معجميًا ممكنًا في الحاشية.
- source_word: παντὶ τῷ πιστεύοντι
  choice: لكل من يؤمن
  rationale: تنقل العبارة الداتيفية والأداة الاسمية مع اسم الفاعل اليوناني بصياغة عربية طبيعية، وتحافظ على شمول «كل» وعلى الفعل المستمر «يؤمن».
- source_word: γὰρ
  choice: لأن
  rationale: تبيّن «لأن» وظيفة γάρ التفسيرية وربط الآية بالحجة السابقة بوضوح في العربية المعاصرة.
theological_decisions:
- issue: معنى τέλος νόμου وعلاقة المسيح بشريعة موسى
  choice: «نهاية الشريعة» في المتن، مع إبقاء معاني الغاية والذروة والتمام في الحاشية
  alternative: «غاية الشريعة» أو «ذروة الشريعة» أو «تمام الشريعة»
  rationale: تحتمل τέλος معنى الانتهاء ومعنى الغاية أو المحصلة والذروة. اختيار «نهاية» يحافظ قدر الإمكان على هذا التوتر، فيما تمنع الحاشية حصر العبارة في معنى إلغاء الشريعة أو في المعنى الغائي وحده.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: المسيح بوصفه استعمالًا اسميًا محضًا
  rationale: السياق يتناول علاقة يسوع بشريعة إسرائيل، فتظل الدلالة اللقبية المسيانية حاضرة بوضوح.
- issue: ترجمة δικαιοσύνη
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» أنسب في المتن للسياق البولسي وللعلاقة بالإيمان، لكن «العدل» احتمال معجمي حقيقي قد يغيّر وجه سماع العبارة، ولذلك يُحفظ في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ووقورة. استُعملت «الشريعة» بدل «الناموس» لوضوحها لدى عامة القراء، وأُبقي التركيب المكثف «للبرّ لكل من يؤمن» قريبًا من بنية الأصل حتى لا يُحسم ما إذا كانت εἰς تفيد الغاية أو النتيجة.
