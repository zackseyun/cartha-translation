  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: ar
  text: 'أَمَّا عَنْ إِسْرَائِيلَ فَيَقُولُ[a]: «طُولَ النَّهَارِ بَسَطْتُ يَدَيَّ إِلَى شَعْبٍ غَيْرِ مُطِيعٍ[b] وَمُقَاوِمٍ[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَمَّا لِإِسْرَائِيلَ فَيَقُولُ». يمكن فهم التركيب اليوناني على أنه كلام موجَّه إلى إسرائيل أو كلام عنه.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن يفيد «غَيْرِ مُطِيعٍ» أيضًا معنى «غير مؤمن» أو «رافض للاقتناع».
    reason: lexical_alternative
  - marker: c
    text: 'أو: «مناقض» أو «متكلم ضدّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: أَمَّا عَنْ إِسْرَائِيلَ
  rationale: تفيد العبارة هنا الانتقال إلى الكلام المتعلق بإسرائيل، مع بقاء احتمال أن يكون القول موجَّهًا إليه مباشرة؛ لذلك أُثبت الاحتمال الآخر في الحاشية.
- source_word: λέγει
  choice: فَيَقُولُ
  rationale: حُفظ المضارع بوصفه صيغة حية لإدخال الاقتباس، ولم يُصرَّح بالفاعل لأن النص اليوناني يتركه مضمرًا.
- source_word: Ὅλην τὴν ἡμέραν
  choice: طُولَ النَّهَارِ
  rationale: تعبير عربي طبيعي يؤدي معنى امتداد الفعل طوال اليوم.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: بَسَطْتُ يَدَيَّ
  rationale: يحفظ الصورة التجسيمية في الاقتباس، وهي صورة توجّه ومناشدة، ويقابل صيغة الماضي في النص اليوناني.
- source_word: πρὸς λαὸν
  choice: إِلَى شَعْبٍ
  rationale: تدل «إلى» على اتجاه اليدين المبسوطتين نحو الشعب، و«شعب» هي المقابل الطبيعي لـλαός في هذا السياق الجماعي.
- source_word: ἀπειθοῦντα
  choice: غَيْرِ مُطِيعٍ
  rationale: يحفظ معنى العصيان ورفض الاستجابة دون حصر اللفظ في عدم التصديق وحده؛ وأُشير إلى التداخل الدلالي مع عدم الإيمان في الحاشية.
- source_word: ἀντιλέγοντα
  choice: وَمُقَاوِمٍ
  rationale: ينقل معنى المعارضة الفاعلة بصياغة عربية واضحة، مع بيان دلالتي المناقضة والكلام ضدّ في الحاشية.
theological_decisions:
- issue: وصف استجابة إسرائيل لمبادرة الله
  choice: شَعْبٍ غَيْرِ مُطِيعٍ وَمُقَاوِمٍ
  alternative: شعب غير مؤمن ومناقض
  rationale: 'يحفظ الوصف شقَّي المقاومة في النص: رفض الطاعة والمعارضة الفاعلة، من غير تحويل الآية إلى حكم أوسع على مكانة إسرائيل أو حسم العلاقة بين العصيان وعدم الإيمان.'
- issue: فاعل «يقول»
  choice: إبقاء الفاعل مضمرًا
  alternative: فيقول الله
  rationale: السياق يفهم منه أن المتكلم في الاقتباس هو الله، لكن الجملة اليونانية نفسها لا تسمّيه؛ فالإبقاء على الإضمار أوفى بالنص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة من غير تراكيب عتيقة. استُخدم «طول النهار» لطبيعته في العربية، وحُفظت صورة بسط اليدين، كما وُضعت علامات الحواشي عقب الألفاظ التي تشرحها مباشرة.
