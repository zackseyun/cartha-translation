lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: كل من
  rationale: 'هذا التركيب يفيد العموم: «كل من» أو «من يفعل كذا كائنًا من كان». و«كل من» صياغة عربية طبيعية تحفظ الشمول من غير تقييد بالجنس.'
- source_word: γὰρ
  choice: لأن
  rationale: تربط γάρ الآية بما قبلها بوصفها تعليلًا أو سندًا كتابيًا؛ و«لأن» تنقل هذه الصلة بوضوح.
- source_word: ἐπικαλέσηται
  choice: يدعو
  rationale: الفعل مع «الاسم» يعني أن يتوجه المرء إلى الرب مناديًا أو مستغيثًا به؛ و«يدعو باسم» يحفظ الاصطلاح الكتابي، مع بيان الدلالة في الحاشية.
- source_word: τὸ ὄνομα
  choice: باسم
  rationale: حُفظ تعبير «الاسم» كما في الأصل، وهو في الاستعمال الكتابي متصل بهوية المدعو وسلطانه، من غير استبداله بتفسير موسع.
- source_word: κυρίου
  choice: الرب
  rationale: ينقل κύριος مباشرة، ويحافظ على صيغة اقتباس يوئيل من غير إدخال اسم «يسوع» في المتن، مع أن السياق يطبّق القول عليه.
- source_word: σωθήσεται
  choice: يخلُص
  rationale: المستقبل المبني للمجهول يفيد أن الشخص سينال الخلاص. والمضارع العربي «يخلُص» في جواب هذا التركيب العام يؤدي معنى النتيجة المؤكدة طبيعيًا، ويحفظ دلالة الخلاص في السياق البولسي.
theological_decisions:
- issue: مرجع «الرب» في اقتباس يوئيل
  choice: الإبقاء على «الرب» في المتن، مع توضيح الصلة بين يهوه في يوئيل ويسوع في سياق رومية في الحاشية.
  alternative: «الرب يسوع» أو «يهوه» في المتن
  rationale: النص اليوناني يقول κυρίου فقط. والاقتباس في يوئيل يشير إلى يهوه، بينما سياق رومية 10 يطبّقه على يسوع. إبقاء «الرب» يصون لفظ المصدر والتوتر الدلالي بين النص المقتبس وتطبيق بولس له، من غير توسع تفسيري داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع نبرة كتابية رصينة. استُعمل «كل من» للتعميم، و«يدعو باسم الرب» للمحافظة على الصياغة الكتابية الموروثة من غير غموض زائد. ضُبطت «يخلُص» بالشكل الجزئي لتمييزها من «يُخلِص».
