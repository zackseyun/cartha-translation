  text: لأن كل من يدعو باسم الرب يخلُص[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يقتبس بولس هنا يوئيل 2:32. وفي يوئيل يعود «الرب» إلى يهوه؛ أما هنا فيطبّق بولس هذا القول على يسوع بحسب السياق.
