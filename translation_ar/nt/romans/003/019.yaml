  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: ar
  text: ونحن نعلم أن كل ما تقوله الشريعة، إنما توجِّهه إلى الذين هم تحت الشريعة، لكي يُسدَّ كل فم، ويصير العالم كله مسؤولًا أمام الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الذين في الشريعة». ويمكن ترجمة «مسؤولًا أمام الله» أيضًا: «خاضعًا للمساءلة أمام الله» أو «معرّضًا للحكم أمام الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: ونحن نعلم
  rationale: تنقل المعرفة المشتركة، وتجعل الواو قوة δέ الانتقالية الخفيفة من غير إدخال ظرف زمني غير موجود في اليونانية.
- source_word: ὁ νόμος
  choice: الشريعة
  rationale: لفظ عربي طبيعي يشير إلى الشريعة بوصفها سلطة معروفة في السياق، من غير زيادة تخصيص لا يصرح به النص.
- source_word: ὅσα ... λέγει ... λαλεῖ
  choice: كل ما تقوله ... إنما تخاطب به
  rationale: يحافظ على التمييز بين فعلي القول والكلام في الأصل، ويبيّن طبيعيًا أن خطاب الشريعة موجَّه إلى فئة معينة.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: الذين هم تحت الشريعة
  rationale: ينقل المعنى الاصطلاحي لمن هم داخل نطاق سلطان الشريعة؛ أما الحرفي فهو «الذين في الشريعة».
- source_word: ἵνα
  choice: لكي
  rationale: أداة غاية واضحة وطبيعية تقابل الاستعمال الغائي في اليونانية.
- source_word: πᾶν στόμα φραγῇ
  choice: يُسدَّ كل فم
  rationale: يحفظ الصورة الحسية والقضائية التي تدل على إسكات كل احتجاج أو دفاع.
- source_word: ὑπόδικος γένηται
  choice: يصير ... مسؤولًا أمام
  rationale: يحفظ دلالة الصيرورة والقوة القانونية للفظ، من غير أن يحسمه بعبارة «يُدان» أو «يثبت ذنبه» الأقوى دلالة.
- source_word: πᾶς ὁ κόσμος
  choice: العالم كله
  rationale: يحفظ الشمول الذي يعبّر عنه النص.
- source_word: τῷ θεῷ
  choice: أمام الله
  rationale: صياغة عربية طبيعية للقيمة القضائية للداتيف مع ὑπόδικος، أي المثول في موضع المساءلة أمام الله.
theological_decisions:
- issue: القوة القانونية للفظ ὑπόδικος في صلته بدينونة الله
  choice: العالم كله مسؤول أمام الله
  alternative: العالم كله مستوجبًا الحكم أمام الله؛ أو مذنبًا أمام الله
  rationale: «مسؤول أمام الله» تبقي معنى الخضوع للمساءلة القضائية من غير أن تستبق الحكم بلفظ أقوى من الصفة اليونانية، مع إثبات النبرة القضائية في الحاشية.
- issue: مدلول τοῖς ἐν τῷ νόμῳ
  choice: الذين هم تحت الشريعة
  alternative: الذين في الشريعة
  rationale: الصياغة المختارة تفيد الخضوع لسلطان الشريعة في الاستعمال البولسي، مع حفظ الصياغة الحرفية البديلة في الحاشية لتجنب طمس الغموض التعبيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حافظت الصياغة على الصورة القضائية في «يُسدَّ كل فم»، وعلى التوتر بين المساءلة وثبوت الذنب، وتجنبت إدخال تحديد مذهبي لمعنى الشريعة.
