  rationale: «طريق» تعبير عربي طبيعي يحفظ صورة المسلك المادي والدلالة المجازية على نهج الحياة أو السلوك.
- source_word: εἰρήνης
  choice: السَّلَامِ
  rationale: «السلام» هو المقابل المباشر والواضح، ويصف الطريق بأنه طريق يتسم بالسلام أو يقود إليه.
- source_word: οὐκ ἔγνωσαν
  choice: لَمْ يَعْرِفُوا
  rationale: صيغة عربية فصيحة وطبيعية تنقل نفي الفعل الماضي، مع إبقاء معنى عدم معرفة هذا الطريق أو اختباره دون زيادة تفسيرية.
