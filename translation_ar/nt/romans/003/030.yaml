  source_fidelity: 'النص العربي ينقل بنية اليونانية ومعناها بأمانة: εἴπερ بصيغة استدلالية («ما دام»)، وإعلان وحدانية الله، والمستقبل في «سيبرِّر»، واستعمال «المختونين» و«غير المختونين» بوصفهما المقصودين بالاسمين المجازيين اليونانيين. كما يحافظ على التمييز اللفظي بين ἐκ πίστεως وδιὰ τῆς πίστεως دون الجزم بفارق لاهوتي حاسم.'
