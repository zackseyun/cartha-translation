  terminology: «سيبرِّر» مقابل راسخ ودقيق لـ δικαιώσει، مع حفظ المستقبل. و«الإيمان» مناسب لـ πίστις في هذا السياق. وتحاشي جعل «غير المختونين» مرادفًا تفسيريًا مباشرًا لـ«الأمم» يحافظ على اتساع اللفظ الأصلي.
