  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: ar
  text: ما دام الله واحدًا[a]، فهو الذي سيبرِّر المختونين على أساس الإيمان، وغير المختونين من خلال الإيمان[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان الله حقًّا واحدًا».'
    reason: alternative_reading
  - marker: b
    text: يقول اليوناني حرفيًا «الختان» و«عدم الختان»، والمقصود المختونون وغير المختونين.
    reason: cultural_note
  - marker: c
    text: 'استعمل بولس تعبيرين مختلفين: «على أساس الإيمان» و«من خلال الإيمان»؛ وقد يكون الاختلاف أسلوبيًا لا تمييزًا حادًّا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: ما دام
  rationale: تفيد هنا بناء الاستدلال على حقيقة توحيد الله المشتركة، من غير أن توحي بأن بولس يشك فيها، مع إثبات الصيغة الشرطية الممكنة في الحاشية.
- source_word: εἷς ὁ θεός
  choice: الله واحد
  rationale: تحافظ على التوكيد التوحيدي وصلة هذه الحقيقة بحجة بولس.
- source_word: δικαιώσει
  choice: سيبرِّر
  rationale: تحافظ على الفعل البولسي وعلى زمن المستقبل، من غير توسيع المعنى داخل المتن.
- source_word: περιτομήν
  choice: المختونين
  rationale: اللفظ اليوناني «الختان» مستعمل مجازًا للدلالة على أهل الختان؛ وصيغة الأشخاص طبيعية وواضحة بالعربية.
- source_word: ἐκ πίστεως
  choice: على أساس الإيمان
  rationale: تنقل دلالة ἐκ بوصف الإيمان أساسًا أو منطلقًا للتبرير، وتحافظ على اختلاف التعبير عن العبارة التالية.
- source_word: ἀκροβυστίαν
  choice: غير المختونين
  rationale: اللفظ اليوناني «الغرلة/عدم الختان» مستعمل مجازًا للدلالة على الأشخاص، من غير حصره تفسيريًا في تسمية عرقية.
- source_word: διὰ τῆς πίστεως
  choice: من خلال الإيمان
  rationale: تحافظ على حرف الجر διά وعلى اختلافه عن ἐκ، من غير افتراض فرق عقائدي حاد.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المقابل العربي الواضح والمألوف لـ πίστις في هذا السياق.
theological_decisions:
- issue: هل يقصد بولس فرقًا لاهوتيًا بين ἐκ πίστεως وδιὰ τῆς πίστεως؟
  choice: 'الحفاظ على اختلاف التعبير: «على أساس الإيمان» و«من خلال الإيمان»، من غير تقرير فرق عقائدي بينهما.'
  alternative: توحيد العبارتين في «بالإيمان»، أو تفسير الأولى أساسًا والثانية وسيلةً تفسيرًا صارمًا.
  rationale: يستعمل النص اليوناني حرفي جر مختلفين، ولذلك ينبغي إظهار الاختلاف، لكن السياق لا يلزم المترجم بتحويله إلى تمييز لاهوتي حاسم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «ما دام» لإبراز قوة الاستدلال، واحتُفظ باختلاف حرفي الجر اليونانيين في صياغة عربية طبيعية نسبيًا. وُضعت علامة الحاشية [a] بعد عبارة الوحدانية، و[b] بعد اكتمال ذكْر الفئتين، و[c] في الموضع نفسه لشرح اختلاف تعبيري الإيمان.
