lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: أمّا الآن
  rationale: تنقل القوة الزمنية والتقابلية في العبارة، وتلائم الانتقال الحاسم في حجة بولس.
- source_word: χωρὶς νόμου
  choice: بمعزلٍ عن الشريعة
  rationale: تعبّر عن الانفصال الذي تفيده χωρίς، لا عن مجرد النفي؛ و«الشريعة» هي الأنسب في السياق للإشارة إلى شريعة موسى.
- source_word: δικαιοσύνη
  choice: بِرّ
  rationale: «البِرّ» هو المقابل العربي الكتابي الواضح الذي يتسع هنا لمعاني الاستقامة والعمل العادل، مع إثبات «عدل» في الحاشية بديلاً معجميًا ممكنًا.
- source_word: θεοῦ
  choice: الله
  rationale: تركيب «بِرّ الله» يحافظ قدر الإمكان على انفتاح الإضافة اليونانية، فلا يحسم هل المقصود برّ الله نفسه وعمله أم البر الآتي منه.
- source_word: πεφανέρωται
  choice: أُظهِرَ
  rationale: يحافظ المبني للمجهول على صيغة اليونانية، وتفيد «قد» المفهومة من السياق مع الفعل الماضي تحقق الإظهار وبقاء نتيجته في الحاضر.
- source_word: μαρτυρουμένη
  choice: الذي تشهد له
  rationale: صياغة عربية طبيعية تنقل معنى الشهادة المستمرة في اسم المفعول اليوناني، مع تحويل البناء إلى جملة فعلية من غير تغيير جهة الشهادة.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: الشريعة والأنبياء
  rationale: تحافظ على التعبير الاصطلاحي الذي يشير إلى شهادة الأسفار المقدسة، لا إلى الأحكام والأنبياء بوصفهم أفرادًا فحسب.
theological_decisions:
- issue: دلالة الإضافة في δικαιοσύνη θεοῦ
  choice: بِرّ الله
  alternative: بِرّ من الله
  rationale: الإضافة تحتمل الإشارة إلى برّ الله وصفته وعمله، كما يمكن أن تُفهم على أنه البر الصادر منه؛ لذلك يحافظ المتن على هذا التوتر ولا يحسمه مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «أمّا الآن» للانتقال الحجاجي، و«بمعزل عن» لتجنب إيحاء أن الشريعة باطلة أو غائبة، مع إبقاء شهادتها الصريحة في ختام الآية.
