  source_fidelity: 'النص الرئيس ينقل عناصر اليونانية الأساسية بدقة جيدة: تقديم الله، وἱλαστήριον بصياغة «ذبيحة كفارة»، والإيمان والدم، وإظهار البر، وتجاوز الخطايا السالفة. لكن حاشية البديل التركيبي تضيف تفسيرًا لاهوتيًا («دم المسيح» و«وسيلة التلقي/التكفير») بدل أن تقتصر على عرض القراءة النحوية البديلة، وهي أوسع من النص المطلوب.'
