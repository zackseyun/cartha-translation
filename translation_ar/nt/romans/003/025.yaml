  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: ar
  text: الذي قدَّمه الله ذبيحةَ كفّارةٍ[a] بالإيمان بدمه[b]، لإظهار برِّه[c]، بسبب تجاوزه عن الخطايا المرتكبة من قبل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استرضاء»؛ أو: «غطاء الكفارة»، أي الغطاء الذهبي لتابوت العهد الذي كان يُرشّ عليه دم التكفير.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بالإيمان، وبدمه»؛ وقد تُفهم «بدمه» على أنها تبين وسيلة التكفير لا موضوع الإيمان.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «عدله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: قدَّمه
  rationale: ينقل معنى العرض أو التقديم في السياق بعبارة عربية طبيعية، من غير حصر اللفظ في معنى التدبير السابق.
- source_word: ἱλαστήριον
  choice: ذبيحةَ كفّارةٍ
  rationale: صياغة واضحة تحفظ المجال التكفيري والذبائحي للمصطلح من غير أن تحسم وحدها بين استرضاء الغضب ومحو الخطيئة ودلالة غطاء تابوت العهد؛ وتُذكر البدائل في الحاشية.
- source_word: διὰ πίστεως
  choice: بالإيمان
  rationale: يحفظ الدلالة المألوفة لـ πίστις ووساطة الإيمان في تركيب عربي موجز وطبيعي.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: بدمه
  rationale: تصلح العربية هنا لقراءة الدم متعلقًا بالإيمان في النص الرئيس، مع بيان احتمال تعلقه بوسيلة التكفير في الحاشية.
- source_word: εἰς ἔνδειξιν
  choice: لإظهار
  rationale: ينقل بوضوح معنى الغاية أو النتيجة الذي يحمله التركيب اليوناني.
- source_word: δικαιοσύνης
  choice: برِّه
  rationale: يحفظ المقابل البولسي المعتاد لـ δικαιοσύνη، مع إبقاء معنى العدل الممكن في الحاشية.
- source_word: πάρεσιν
  choice: تجاوزه عن
  rationale: يميز معنى الإمهال أو عدم المؤاخذة المؤقتة عن الغفران التام، ويحافظ على خصوصية اللفظ في هذا الموضع.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: الخطايا التي ارتُكبت من قبل
  rationale: يعبّر بوضوح عن سبق وقوع الخطايا ويحفظ قوة اسم الفاعل التام في اليونانية.
theological_decisions:
- issue: دلالة ἱλαστήριον المتنازع عليها
  choice: ذبيحة كفارة
  alternative: ما يسترضي الغضب؛ أو غطاء الكفارة
  rationale: النص الرئيس يبقى مفهومًا ويحفظ القوة الذبائحية والتكفيرية من غير فرض تفسير تقني واحد، بينما توثّق الحاشية المجال الدلالي الأوسع.
- issue: تركيب διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι
  choice: بالإيمان بدمه
  alternative: بالإيمان، وبدمه
  rationale: القراءة المختارة طبيعية وتفهم الدم متعلقًا بموضوع الإيمان، لكن اليونانية تسمح بأن يكون الدم وسيلة تقديم الكفارة؛ لذلك يُحفظ الاحتمال الآخر في الحاشية.
- issue: دلالة δικαιοσύνη في السياق البولسي
  choice: برّه
  alternative: عدله
  rationale: «البر» يحفظ المقابل الكتابي الأوسع، بينما قد يبرز «العدل» جانب الإنصاف القضائي؛ وتُذكر هذه الدلالة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «ذبيحة كفارة» لسهولة الفهم مع إبقاء الاحتمالات التفسيرية في الحاشية، و«تجاوزه عن» لعدم تسوية πάρεσις بالغفران الكامل.
