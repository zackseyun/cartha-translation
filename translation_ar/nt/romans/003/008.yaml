  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: ar
  text: 'ولِمَ لا نقول—كما يُفترى علينا، وكما يزعم بعضهم أننا نقول—: «لنفعل الشر لكي يأتي الخير»؟ دينونتهم عادلة.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى اللفظ: «وليس—كما يُفترى علينا، وكما يقول بعضهم إننا نقول—: لنفعل الشر لكي يأتي الخير؟» فالعبارة اليونانية موجزة، ويُفهم استفهامها من سياق الآية السابقة.'
    reason: lexical_alternative
  - marker: b
    text: تشير «دينونتهم» إلى الذين يوجّهون هذا الاتهام أو يتبنّون هذا المنطق.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μὴ
  choice: ولِمَ لا نقول
  rationale: العبارة اليونانية موجزة ومرتبطة بحجة الآية السابقة؛ وهذه الصياغة تُظهر الاستفهام الضمني بوضوح من غير إضافة معنى جديد.
- source_word: βλασφημούμεθα
  choice: يُفترى علينا
  rationale: السياق يتحدث عن تشويه عدائي لتعليم بولس ونسبة قول باطل إليه، و«يُفترى علينا» يؤدي هذا المعنى طبيعيًا.
- source_word: φασίν τινες
  choice: يزعم بعضهم
  rationale: «يزعم» تنقل معنى القول المنسوب مع نبرة الادعاء الملائمة لسياق الاتهام.
- source_word: λέγειν
  choice: أننا نقول
  rationale: ترجمة مباشرة للمصدر، من غير توسيعه إلى «نعلّم».
- source_word: Ποιήσωμεν
  choice: لنفعل
  rationale: صيغة الحث في المتكلم الجمع تُنقل طبيعيًا بصيغة «لنفعل».
- source_word: τὰ κακὰ
  choice: الشر
  rationale: ينقل التركيب اليوناني الدال على الأمور الشريرة بتعبير عربي موجز وطبيعي.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: لكي يأتي الخير
  rationale: يحفظ دلالة الغاية في ἵνα، مع مقابلة واضحة بين الشر والخير.
- source_word: κρίμα
  choice: دينونتهم
  rationale: يدل السياق على حكم قضائي سلبي؛ و«الدينونة» أدق من «الحكم» العام.
- source_word: ἔνδικόν
  choice: عادلة
  rationale: تحفظ الدلالة القضائية والأخلاقية للفظ، وتوافق «الدينونة» في العربية.
theological_decisions:
- issue: مرجع الضمير في ὧν («دينونتهم»)
  choice: الإبقاء على الضمير في النص، مع بيان مرجعه الأرجح في الحاشية
  alternative: 'التصريح في المتن: «دينونة أولئك عادلة»'
  rationale: الصياغة اليونانية تستعمل ضميرًا موصولًا قد يستلزم تحديد المرجع من السياق؛ إبقاء الضمير يحافظ على بنية النص، والحاشية تمنع الالتباس من غير تحميل المتن تفسيرًا زائدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «يُفترى علينا» لتصوير تشويه القول، و«دينونتهم عادلة» للمحافظة على النبرة القضائية. أُبقيت المقابلة الموجزة بين «الشر» و«الخير»، ووُضعت علامتا الحاشية [a][b] في المتن.
