id: ROM.3.4
reference: Romans 3:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: ar
  text: 'حاشا! بل ليكن الله صادقًا، وكلُّ إنسان كاذبًا، كما هو مكتوب: «لكي تُعلَن مُحقًّا[a] في أقوالك، وتغلب حين تُحاكَم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تُبرَّر»، أو «يظهر أنك على حق».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حين تحكم». تعكس هذه الصياغة نص مزمور 51:4 العبري بصورة أوضح، أما صياغة رومية اليونانية فتُقرأ طبيعيًا: «حين تُحاكَم».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: تعبير عربي فصيح ومفهوم يؤدي قوة الرفض القاطع في العبارة اليونانية، من غير إطالة أو تسطيح للنبرة.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: ليكن الله صادقًا
  rationale: يحافظ على صيغة الأمر وعلى المقابلة الحادة بين صدق الله وكذب البشر.
- source_word: πᾶς ... ἄνθρωπος
  choice: كلُّ إنسان
  rationale: ينقل الدلالة البشرية العامة والتوزيعية من غير قصرها على الذكور.
- source_word: ψεύστης
  choice: كاذبًا
  rationale: المقابل العربي المباشر والطبيعي للاسم اليوناني، ويحفظ التضاد مع «صادقًا».
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة اقتباس كتابية عربية مألوفة، موجزة، وتحافظ على الإحالة إلى النص المكتوب ذي الحجية.
- source_word: δικαιωθῇς
  choice: تُعلَن مُحقًّا
  rationale: 'يبيّن المعنى القضائي المقصود في الحديث عن الله: ثبوت أنه على حق، لا انتقاله من عدم البر إلى البر. وتُذكر الصياغة الأقرب لفظًا في الحاشية.'
- source_word: λόγοις
  choice: أقوالك
  rationale: تعبير طبيعي يلائم سياق المحاجّة والاقتباس من المزمور، وينقل معنى الكلام المنطوق أو المصرّح به.
- source_word: νικήσεις
  choice: تغلب
  rationale: يحافظ على صورة الانتصار في سياق القضاء من غير إضافة تفسير غير موجود في النص.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: حين تُحاكَم
  rationale: ينقل القراءة المبنية للمجهول التي يدل عليها النص اليوناني في رومية على نحو طبيعي، مع إبقاء قراءة «حين تحكم» في الحاشية بسبب صياغة المزمور العبرية.
theological_decisions:
- issue: المعنى القضائي للفعل δικαιωθῇς عند إسناده إلى الله
  choice: تُعلَن مُحقًّا
  alternative: تُبرَّر؛ أو يظهر أنك على حق
  rationale: السياق يثبت صدق الله وصواب حكمه في مقابل كذب البشر؛ فلا يعني أن الله يصير بارًّا، بل أن حقه يظهر ويُقضى له به.
- issue: هل الله يحاكم أم يُحاكَم في خاتمة الاقتباس؟
  choice: حين تُحاكَم
  alternative: حين تحكم
  rationale: صيغة اليونانية في رومية تُفهم طبيعيًا على أنها مبنية للمجهول، بينما تعكس «حين تحكم» نص مزمور 51:4 العبري بصورة أوضح؛ لذلك لم تُحسم المفارقة بإخفاء البديل، بل ذُكر في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت «حاشا» لقوة الرفض، وحُفظ الإيجاز والتوازي بين «صادقًا» و«كاذبًا». وُضعت علامتا الحاشيتين عند اللفظين اللذين تفسرانهما مباشرة.
