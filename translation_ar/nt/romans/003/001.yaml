  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: ar
  text: فما ميزةُ اليهودي إذن؟[b] أو ما فائدة الختان؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما قيمة الختان؟»'
    reason: بديل معجمي ممكن لـ ὠφέλεια بحسب السياق.
  - marker: b
    text: لفظ «اليهودي» هنا مفرد تمثيلي، ويشير إلى الشخص اليهودي بوصفه فئة عامة.
    reason: إيضاح الاستعمال اللغوي والثقافي للمفرد المعرّف.
lexical_decisions:
- source_word: Τί οὖν
  choice: فما ... إذن؟
  rationale: يحفظ الانتقال الاستنتاجي الذي تفيده οὖν وبنية السؤال البلاغي، بصياغة عربية طبيعية.
- source_word: τὸ περισσὸν
  choice: مزيّة
  rationale: تؤدي المعنى السياقي لما يتمتع به اليهودي من امتياز أو أفضلية، من غير أن توحي بتفوق عرقي مطلق.
- source_word: τοῦ Ἰουδαίου
  choice: اليهودي
  rationale: يحافظ على المفرد المعرّف المستعمل استعمالًا تمثيليًا في اليونانية، بدل تحويله إلى جمع أو إلى تعبير تفسيري.
- source_word: ἢ τίς
  choice: أو ما
  rationale: يحفظ التوازي المباشر بين السؤالين البلاغيين.
- source_word: ἡ ὠφέλεια
  choice: فائدة
  rationale: لفظ عربي واضح ومعاصر يعبّر عن النفع، ويحافظ على فرق طفيف عن مزيّة في السؤال الأول.
- source_word: τῆς περιτομῆς
  choice: الختان
  rationale: ترجمة مباشرة لاسم الشعيرة التي يذكرها النص، من غير إدخال شرح عهدي في المتن.
theological_decisions:
- issue: هل يُترجم Ἰουδαίου مفردًا تمثيليًا أم يُعاد بصياغة جمعية؟
  choice: اليهودي
  alternative: اليهود أو الإنسان اليهودي
  rationale: المفرد المعرّف في الأصل تمثيلي، والإبقاء عليه يصون أسلوب بولس البلاغي من غير توسيع تفسيري أو تضييق لاهوتي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعملت «مزيّة» و«فائدة» للمحافظة على التوازي مع التمييز الدلالي الطفيف بين περισσόν وὠφέλεια، مع إبقاء السؤالين البلاغيين موجزين.
