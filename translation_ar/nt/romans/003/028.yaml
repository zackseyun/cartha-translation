  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: ar
  text: فإننا نستنتج أن الإنسان[b] يُبَرَّر بالإيمان، بمعزل عن أعمال الشريعة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يُعلَن بارًّا».
    reason: lexical_alternative
  - marker: b
    text: أو «الرجل»؛ فاللفظ اليوناني مذكّر نحويًا، لكنه مستعمل هنا بمعنى عام.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: نستنتج
  rationale: يفيد الفعل هنا حكمًا فكريًا ناتجًا من الحجة السابقة؛ و«نستنتج» تعبير عربي طبيعي يحفظ طابع الاستدلال.
- source_word: γάρ
  choice: لأننا
  rationale: تربط الأداة هذه الخلاصة بما سبقها على جهة البيان والتعليل، وتؤدي «لأن» هذا الربط بوضوح.
- source_word: δικαιοῦσθαι
  choice: يُبَرَّر
  rationale: يحفظ المبني للمجهول والمصطلح البولسي المألوف، من غير حصر الدلالة في شرح لاهوتي واحد؛ ويُذكر البديل التفسيري في الحاشية.
- source_word: πίστει
  choice: بالإيمان
  rationale: الباء صياغة عربية موجزة وطبيعية للأداة أو الوسيلة التي يدل عليها الاسم في صيغة المجرور هنا، مع إبقاء «الإيمان» بمداه الدلالي اللاهوتي.
- source_word: ἄνθρωπον
  choice: الإنسان
  rationale: المراد فرد من البشر على وجه العموم، لا الذكر دون الأنثى؛ و«الإنسان» يؤدي هذا المعنى التمثيلي بوضوح في العربية الفصحى.
- source_word: χωρὶς
  choice: بمعزل عن
  rationale: يعبّر عن الانفصال والاستبعاد في المقابلة بين الإيمان وأعمال الشريعة، من غير أن يضيف تفسيرًا إلى العبارة.
- source_word: ἔργων νόμου
  choice: أعمال الشريعة
  rationale: يحفظ تركيب العبارة البولسية وصلتها بالشريعة، ولا يضيّقها إلى مجرد الأعمال الصالحة أو الجهد الأخلاقي العام.
theological_decisions:
- issue: دلالة δικαιοῦσθαι في الاستعمال البولسي
  choice: يُبَرَّر
  alternative: يُعلَن بارًّا
  rationale: يبقي المتن على المصطلح اللاهوتي العربي الموجز، فيما تحفظ الحاشية الصياغة القضائية التفسيرية من غير فرضها بوصفها المعنى الوحيد.
- issue: المدلول العام لكلمة ἄνθρωπον
  choice: الإنسان
  alternative: الرجل
  rationale: الكلمة اليونانية مذكّرة من جهة الصيغة، لكن سياقها هنا عام يشمل البشر؛ لذلك تنقل «الإنسان» المقصود من غير إيحاء بقصره على الذكور.
- issue: نطاق عبارة ἔργων νόμου
  choice: أعمال الشريعة
  alternative: أعمال يطلبها الناموس
  rationale: تحفظ الصياغة الإضافية الموجزة التوتر التفسيري في العبارة البولسية، ولا تحسم مسبقًا ما إذا كان المقصود جميع الأعمال المطلوبة في الشريعة أو علامات هوية بعينها.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «الإنسان» للدلالة العامة، و«الشريعة» لنقل νόμος في هذا السياق البولسي. وُضعت علامتا الحاشيتين في المتن كما هو مطلوب.
