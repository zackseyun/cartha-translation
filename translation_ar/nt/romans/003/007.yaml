  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: ar
  text: ولكن إن كان صدقُ الله قد ازداد بكذبي لمجده، فلماذا لا يزال يُحكم عليّ أنا أيضًا باعتباري خاطئًا؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια τοῦ θεοῦ
  choice: صدقُ الله
  rationale: يفيد «الصدق» هنا اتصاف الله بالحق في مقابل كذب الإنسان في السياق القريب، وهو تعبير عربي طبيعي يحافظ كذلك على إمكان فهم العبارة بوصفها «حق الله».
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: بسببي كذبي
  rationale: حُمِل حرف الجر ἐν على معنى الوسيلة أو الملابسة السببية؛ والصياغة العربية توضح أن كذب المتكلم هو الوسيلة التي يفترض السؤال الجدلي أن صدق الله ازداد بها.
- source_word: ψεύσματι
  choice: كذبي
  rationale: «الكذب» مقابل مباشر وواضح للفظ اليوناني، ويحافظ على التضاد مع صدق الله.
- source_word: ἐπερίσσευσεν
  choice: قد ازداد
  rationale: ينقل معنى الزيادة والوفرة، مع «قد» للدلالة على وقوع الأمر المفترض وبقاء أثره في الحجة.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: لمجده
  rationale: صياغة عربية موجزة تحتمل الغاية أو النتيجة كما يحتمله حرف الجر εἰς في هذا السياق.
- source_word: τί ἔτι
  choice: فلماذا ... إلى الآن
  rationale: تحافظ العبارة على دلالة ἔτι الزمنية، أي استمرار الحكم حتى الآن.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: أُثبتت الدلالة الإضافية في κἀγώ، بدل حذفها، لما لها من حضور صريح في النص اليوناني.
- source_word: κρίνομαι
  choice: أُدان
  rationale: الفعل المبني للمجهول ينقل وقوع الحكم على المتكلم؛ و«أُدان» طبيعي في العربية دون قصر العبارة صراحة على الدينونة الأخروية.
- source_word: ὡς ἁμαρτωλὸς
  choice: بوصفي خاطئًا
  rationale: ينقل وظيفة ὡς في بيان الصفة التي يُحكم على المتكلم بموجبها، بعبارة عربية واضحة.
theological_decisions:
- issue: هل ἀλήθεια τοῦ θεοῦ تعني «حق الله» على نحو مجرد أم «صدق الله» بوصفه أمانته للحق؟
  choice: صدقُ الله
  alternative: حقُّ الله
  rationale: يقابل السياق بين كون الله صادقًا وكذب الإنسان (رومية 3:4–7)، لذلك يبرز «صدق الله» المعنى الخلقي والشخصي من غير حسم كل أبعاد لفظ ἀλήθεια.
- issue: هل كلام المتكلم تقرير لتبرير الكذب أم سؤال جدلي؟
  choice: الإبقاء على صيغة الشرط والسؤال من غير شرح داخل النص
  alternative: إضافة ما يصرح بأن الاعتراض باطل
  rationale: النص نفسه يعرض اعتراضًا بلاغيًا، والجواب الصريح يأتي في السياق؛ لذا لا ينبغي حل التوتر بإضافة تفسير مذهبي إلى الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت بنية السؤال الجدلي كما في الأصل، مع إبراز «أنا أيضًا» وحفظ دلالة الاستمرار في «إلى الآن». لا توجد حواشٍ لأن البدائل المعجمية لا تستلزم في هذه الآية حاشية للنشر.
