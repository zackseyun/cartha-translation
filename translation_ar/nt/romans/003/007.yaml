  to: ولكن إن كان صدقُ الله قد ازداد بكذبي لمجده، فلماذا لا يزال يُحكم عليّ أنا أيضًا باعتباري خاطئًا؟
  rationale: صُححت أداة التعبير عن كذب المتكلم من صياغة غير سليمة إلى «بكذبي»، وهي تنقل بوضوح الوسيلة المفترضة في الاعتراض. واستُبدل «أُدان» بـ«يُحكم عليّ» لتفادي تضييق معنى κρίνομαι، مع الحفاظ على الاستمرار في «لا يزال» وعلى الدلالة الإضافية في «أنا أيضًا».
