  naturalness: «بكذبي» أفصح وأوجز وأقرب إلى المعنى المقصود. و«لا يزال يُحكم عليّ» تركيب عربي طبيعي يحفظ المبني للمجهول والاستمرار دون افتراض أن الحكم إدانة نهائية.
  terminology: «صدق الله» مناسب في السياق القريب الذي يقابل صدق الله بكذب البشر، مع إبقاء إمكان فهم ἀλήθεια بمعنى حق الله. و«خاطئًا» مقابلة مباشرة لـἁμαρτωλός.
