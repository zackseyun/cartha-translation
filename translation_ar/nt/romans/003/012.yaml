    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: الجميع
  rationale: يحفظ شمول الجمع في اليونانية من غير إضافة اسم صريح غير موجود في النص.
- source_word: ἐξέκλιναν
  choice: زاغوا
  rationale: تعبير عربي فصيح ومألوف يدل على الانحراف عن الطريق، ويلائم المعنى الأخلاقي هنا.
- source_word: ἅμα
  choice: معًا
  rationale: ينقل الدلالة الجماعية، أي اشتراك الجميع في هذه الحال.
- source_word: ἠχρεώθησαν
  choice: صاروا بلا نفع
  rationale: ينقل معنى الصيرورة والنتيجة في الفعل المبني للمجهول، مع إبقاء التقييم السلبي القوي من غير حصره في معنى الفساد الأخلاقي.
- source_word: ποιῶν
  choice: يعمل
  rationale: صياغة عربية طبيعية تحفظ دلالة اسم الفاعل على الفعل المتصف به الشخص.
- source_word: χρηστότητα
  choice: الصلاح
  rationale: ينقل المعنى الأخلاقي العام بوضوح، مع التنبيه في الحاشية إلى احتمال معنى الإحسان أو اللطف.
- source_word: οὐκ ἔστιν
  choice: ليس مَن
  rationale: يحفظ النفي الوجودي الموجز في صياغة عربية واضحة.
- source_word: ἕως ἑνός
  choice: ولا واحد
  rationale: 'ينقل الخاتمة التوكيدية الاصطلاحية: لا يوجد حتى شخص واحد.'
