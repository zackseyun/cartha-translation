lexical_decisions:
- source_word: πάντες
  choice: الْجَمِيعَ
  rationale: تنقل الشمول البشري في السياق بإيجاز، من غير إضافة لفظ غير موجود في اليونانية.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تؤدي الوظيفة التفسيرية للفظ اليوناني وتربط الآية بالحجة السابقة ربطًا طبيعيًا في العربية.
- source_word: ἥμαρτον
  choice: أَخْطَأُوا
  rationale: ينقل الفعل الماضي اليوناني حقيقة وقوع الخطية لدى الجميع، بصياغة عربية واضحة وموجزة.
- source_word: ὑστεροῦνται
  choice: يَعْوِزُهُمْ
  rationale: يحافظ على دلالة النقص أو الافتقار المستمر التي يحملها المضارع اليوناني، من غير حصر المعنى في صورة معيار لا يبلغه البشر.
- source_word: δόξης
  choice: مَجْدُ
  rationale: «المجد» هو المقابل العربي المألوف والملائم للاسم اليوناني، ويحفظ كثافته اللاهوتية.
- source_word: τοῦ θεοῦ
  choice: اللهِ
  rationale: تُحفظ الإضافة اليونانية مباشرة في تركيب «مجد الله»، من غير حسم هل المقصود مجد الله نفسه أم المجد الآتي منه أو الممنوح منه.
theological_decisions:
- issue: معنى «مجد الله»
  choice: إبقاء العبارة المحايدة «مجد الله» بلا توسيع تفسيري.
  alternative: المجد الآتي من الله؛ أو المجد الذي خُلق البشر ليعكسوه؛ أو الاشتراك في المجد الذي يمنحه الله.
  rationale: التركيب اليوناني موجز ويحتمل أكثر من علاقة دلالية، ولذلك تحافظ الصياغة على التوتر اللاهوتي بدل أن تحصره في تفسير واحد.
- issue: دلالة ὑστεροῦνται
  choice: «يعوزهم» للدلالة على أنهم يفتقرون إلى المجد.
  alternative: «يقصرون عن بلوغ» مجد الله.
  rationale: الاختيار يحفظ معنى النقص القائم في الفعل المضارع، بينما قد توحي صياغة «يقصرون عن بلوغ» تحديدًا بأن المجد معيار أو غاية يجب بلوغها، وهو تفسير ممكن لكنه ليس الاحتمال الوحيد.
translation_notes:
  register: 'عربية فصحى واضحة وموجزة ذات نبرة كتابية وقورة. استُخدم «يعوزهم» لأنه طبيعي في السياق ويحفظ معنى الافتقار المستمر، مع شرح البدائل في الحاشية. وُضعت علامتا الحاشيتين بحسب موضع موضوعيهما: [a] بعد العبارة الفعلية و[b] بعد «مجد الله».'
