id: ROM.3.29
reference: Romans 3:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: ar
  text: أَمِ اللهُ لليهودِ وحدهم؟ أليس هو لغيرِ اليهود أيضًا؟ بلى، لغيرِ اليهود أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمة اللفظة اليونانية ἐθνῶν ترجمةً أكثر حرفية: «الأمم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: أَمِ
  rationale: تُدخل احتمالًا استفهاميًّا بديلًا في سياق حجة بولس، وتربط الآية بما قبلها ربطًا طبيعيًّا.
- source_word: Ἰουδαίων
  choice: لليهود
  rationale: تنقل صيغة الإضافة اليونانية إلى تركيب عربي موجز وطبيعي يفيد اختصاص الألوهية بهم في السؤال الجدلي.
- source_word: ὁ θεὸς
  choice: الله
  rationale: الترجمة العربية المعيارية للاسم في هذا السياق، مع إبقائه مذكورًا صراحة في السؤال الأول.
- source_word: μόνον
  choice: وحدهم
  rationale: تؤدي معنى الحصر بوضوح، ويتعلق الضمير باليهود وفق الأسلوب العربي الطبيعي.
- source_word: οὐχὶ καὶ
  choice: أليس هو ... أيضًا؟
  rationale: تحافظ صيغة النفي الاستفهامي على سؤال يتوقع جوابًا بالإيجاب، ويعود الضمير بوضوح إلى الله.
- source_word: ἐθνῶν
  choice: غير اليهود
  rationale: المقصود في التقابل مع اليهود هو الشعوب غير اليهودية؛ وهذه العبارة أوضح للقارئ العربي المعاصر من «الأمم» التي قد تُفهم سياسيًّا.
- source_word: ναὶ
  choice: بلى
  rationale: '«بلى» هي الجواب العربي الفصيح الذي يثبت مضمون السؤال المنفي: الله لغير اليهود أيضًا.'
- source_word: καὶ
  choice: أيضًا
  rationale: 'تحفظ معنى الإضافة والشمول: ليس لليهود وحدهم، بل لغير اليهود كذلك.'
theological_decisions:
- issue: 'دلالة ἐθνῶν: «غير اليهود» أم «الأمم»'
  choice: غير اليهود
  alternative: الأمم
  rationale: التقابل الصريح مع «اليهود» يجعل المقصود الجماعات البشرية غير اليهودية، لا الدول أو الأمم بالمعنى السياسي. تُذكر الصياغة الحرفية البديلة في الحاشية دون حسم ما قد تحمله لفظة «الأمم» من صدى كتابي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أَمِ» لحفظ الانتقال الجدلي، و«بلى» جوابًا دقيقًا عن الاستفهام المنفي. وُضع مؤشر الحاشية بعد الجملة التي يخصها البديل اللفظي.
