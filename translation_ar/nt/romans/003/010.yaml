lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تؤدي معنى المطابقة وتدخل صيغة الاقتباس الكتابي بأسلوب عربي طبيعي.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: تحافظ على صيغة الاقتباس بالمبني للمجهول وعلى دلالة النتيجة المستمرة للفعل التام اليوناني.
- source_word: ὅτι
  choice: ':'
  rationale: تقوم النقطتان مقام أداة إدخال مضمون الاقتباس، وهو الأسلوب العربي الأوضح هنا.
- source_word: Οὐκ ἔστιν
  choice: ليس
  rationale: صياغة عربية موجزة توافق تركيب النفي الوجودي في السياق.
- source_word: δίκαιος
  choice: بارٌّ
  rationale: لفظ كتابي عربي واضح يحفظ الدلالة الأخلاقية والقضائية الواسعة للصفة اليونانية.
- source_word: οὐδὲ εἷς
  choice: ولا واحد
  rationale: يحفظ التشديد اليوناني ويؤكد الاستثناء المنفي من غير إضافة تفسيرية.
theological_decisions:
- issue: هل تُصاغ العبارة بصيغة عامة حرفية أم يُضاف اسم مثل «إنسان»؟
  choice: ليس بارٌّ، ولا واحد
  alternative: ليس أحد بارًّا، ولا واحد
  rationale: الصياغة المختارة تحافظ على إيجاز النص اليوناني وعمومه المطلق، ولا تضيف اسمًا غير مذكور، مع إبقاء حدّة الاقتباس وتوتره اللاهوتي.
