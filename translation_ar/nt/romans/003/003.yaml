  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: ar
  text: فماذا إذًا؟ إن كان بعضهم غير أمناء، أفعدم أمانتهم يُبطل أمانة الله؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إيمان الله»، لكن العبارة هنا يُرجَّح أن تعني أمانة الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: فماذا إذًا؟
  rationale: صيغة موجزة وطبيعية في العربية تنقل التحول الجدلي الذي يفتتح به بولس اعتراضًا أو استنتاجًا.
- source_word: ἠπίστησάν
  choice: خانوا الأمانة
  rationale: يمكن أن يدل الفعل على عدم الإيمان، لكن موازنته مع ἀπιστία ومقابلته بأمانة الله ترجح هنا معنى عدم الوفاء أو الخيانة.
- source_word: τινες
  choice: بعضهم
  rationale: ينقل الضمير غير المحدد بصياغة عربية طبيعية، مع بقاء مرجعه إلى الجماعة المذكورة في السياق السابق.
- source_word: ἀπιστία
  choice: خيانتهم للأمانة
  rationale: يحافظ على الصلة اللفظية بالفعل ἠπίστησάν وعلى التقابل مع أمانة الله؛ ويظل معنى عدم الإيمان ممكنًا من جهة المجال الدلالي.
- source_word: πίστιν τοῦ θεοῦ
  choice: أمانة الله
  rationale: الإضافة اليونانية حرفيًا «إيمان الله»، لكن التقابل السياقي مع خيانة البشر يرجح معنى أمانة الله وثباته وموثوقيته.
- source_word: καταργήσει
  choice: تُبطل
  rationale: فعل عربي واضح ينقل معنى جعل الشيء باطلًا أو عديم الأثر، ويلائم السؤال الإنكاري.
theological_decisions:
- issue: دلالة πίστιν τοῦ θεοῦ في العبارة البولسية المتنازع عليها
  choice: أمانة الله
  alternative: إيمان الله
  rationale: التقابل بين ἀπιστία البشرية وπίστις الإلهية يرجح معنى أمانة الله، مع توثيق الصياغة الحرفية البديلة في الحاشية حتى لا يُطمس الاحتمال اللغوي.
- issue: 'دلالة ἀπιστέω وἀπιστία: عدم الإيمان أم الخيانة'
  choice: خانوا الأمانة / خيانتهم للأمانة
  alternative: لم يؤمنوا / عدم إيمانهم
  rationale: سياق العهد والموثوقية، إلى جانب التقابل مع أمانة الله، يرجح لغة الخيانة وعدم الوفاء؛ إلا أن معنى عدم الإيمان باقٍ في المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «خانوا الأمانة» بدل «كانوا غير أمناء» لطبيعتها في العربية، مع تكرار «الأمانة» للمحافظة على التقابل البلاغي. وُضع رمز الحاشية بعد العبارة التي يشرحها.
