  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: ar
  text: ولكن إن كان إثمُنا يُظهِر برَّ الله[a]، فماذا نقول؟ أفاللهُ ظالمٌ إذ يُنزِل الغضب؟ (أتكلَّم بمنطق البشر.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان ظلمُنا يُظهِر عدلَ الله».'
    reason: بديل معجمي يحفظ الدلالة القضائية الممكنة لكلٍّ من ἀδικία وδικαιοσύνη.
lexical_decisions:
- source_word: ἀδικία
  choice: إثم
  rationale: ينقل معنى الانحراف الأخلاقي في المقابلة مع برّ الله، وهو طبيعي وواضح في العربية؛ ويُحفظ معنى «الظلم» البديل في الحاشية.
- source_word: δικαιοσύνη
  choice: برّ
  rationale: يحافظ على المصطلح البولسي الواسع وعلى المقابلة اللفظية والأخلاقية، مع إثبات «عدل» بوصفه احتمالًا سياقيًا في الحاشية.
- source_word: συνίστησιν
  choice: يُظهِر
  rationale: يؤدي معنى إبانة برّ الله وجعله ظاهرًا من غير أن يضيف معنى البرهنة القطعية.
- source_word: μὴ ἄδικος
  choice: أَلعلَّ الله ظالمٌ
  rationale: يصوغ سؤالًا استنكاريًا يتوقع النفي، مع إبقاء الاعتراض بصورته الاستفهامية وعدم حسم التوتر داخل السؤال نفسه.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: حين يُنزِل الغضب
  rationale: تعبير عربي طبيعي يحفظ فعل إيقاع الغضب القضائي من غير إضافة مفعول غير مصرّح به.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: أتكلَّم بمنطق البشر
  rationale: ينقل بوضوح أن بولس يعرض احتجاجًا أو استدلالًا بشريًا، لا أنه ينسب الظلم إلى الله.
theological_decisions:
- issue: صياغة السؤال البلاغي المتعلق بعدل الله في إنزال الغضب
  choice: أَلعلَّ الله ظالمٌ حين يُنزِل الغضب؟
  alternative: أالله ظالمٌ إذ يُنزِل الغضب؟
  rationale: تؤدي «لعلّ» مع همزة الاستفهام قوة μή التي توجّه إلى جواب بالنفي، مع المحافظة على شكل الاعتراض وسلامة العربية وعدم تحويله إلى تقرير عقائدي صريح.
- issue: العلاقة الدلالية بين ἀδικία وδικαιοσύνη
  choice: إثمُنا / برَّ الله
  alternative: ظلمُنا / عدلَ الله
  rationale: اختيار المتن يحفظ المجال الأخلاقي والعلاقي الأوسع في خطاب بولس، بينما تُثبت الحاشية القراءة القضائية الممكنة من غير ترجيح مذهبي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت ألفاظ مألوفة مع الحفاظ على بنية الحجة والاستفهام الاستنكاري. وُضعت الجملة الاعتراضية بين قوسين كما في طبقة الاستشارة الإنجليزية، وصيغت اصطلاحيًا لتكون مفهومة للقارئ المعاصر.
