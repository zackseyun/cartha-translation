  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: ar
  text: فماذا إذًا؟ هل نحن أفضل حالًا؟ كلا البتة[a]، لأننا سبق أن وجَّهنا التهمة إلى اليهود واليونانيين جميعًا بأنهم تحت الخطية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هل لنا أي امتياز؟»'
    reason: alternative_reading
  - marker: b
    text: 'أو: «تحت سلطان الخطية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: فماذا إذًا؟
  rationale: صياغة استفهامية موجزة تُبقي أداة الاستنتاج ظاهرة وتحافظ على إيقاع حجة بولس من غير إضافة تفسيرية.
- source_word: προεχόμεθα
  choice: هل نحن أفضل حالًا؟
  rationale: الفعل المتوسط مختلف في تفسيره؛ وهذه الصياغة الطبيعية تعبّر عن التساؤل بشأن التفوق أو المكانة الأفضل، مع حفظ معنى «هل لنا امتياز؟» في الحاشية.
- source_word: οὐ πάντως
  choice: كلا البتة
  rationale: نفي قوي وواضح في العربية الفصحى المعاصرة، يحفظ حدة الجواب.
- source_word: προῃτιασάμεθα
  choice: سبق أن وجَّهنا التهمة
  rationale: يحفظ الطابع الاتهامي أو القضائي للفعل، ويبيّن أن هذا الاتهام قد سبق عرضه.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: اليهود واليونانيين
  rationale: ينقل طرفي التركيب كما وردا في المصدر، ويحفظ التقابل البولسي بين اليهود واليونانيين.
- source_word: πάντας
  choice: جميعًا
  rationale: يؤكد شمول الحكم للفئتين كلتيهما بعبارة عربية موجزة.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: بأنهم تحت الخطية
  rationale: صياغة قريبة من استعارة الخضوع في اليونانية، من غير أن تحسم في المتن ما إذا كان المقصود سلطان الخطية؛ ويُذكر هذا التوضيح المحتمل في الحاشية.
theological_decisions:
- issue: مدلول ضمير المتكلمين في προεχόμεθα وطبيعة المقارنة
  choice: هل نحن أفضل حالًا؟
  alternative: هل لنا أي امتياز؟
  rationale: السياق يناقش امتياز اليهود ومسؤوليتهم، لكن الدلالة الدقيقة للفعل موضع خلاف. يحفظ المتن سؤال الأفضلية، وتُثبت قراءة الامتياز الممكنة في الحاشية بدل إلغاء التوتر.
- issue: دلالة «تحت الخطية»
  choice: 'الإبقاء على الاستعارة الموجزة: تحت الخطية'
  alternative: تحت سلطان الخطية
  rationale: النص اليوناني مضغوط ويمكن أن يفيد الخضوع لسلطان الخطية. الإبقاء على العبارة الحرفية نسبيًا يصون اتساعها اللاهوتي، مع توضيح البديل في الحاشية.
translation_notes:
  register: عربية فصحى واضحة ورصينة، مع الحفاظ على الأسلوب الجدلي الموجز وعلى الاستعارة البولسية «تحت الخطية». استُعملت «الخطية» بوصفها اسمًا مفردًا يصوّر الخطية قوةً أو حالةً جامعة، ولم يُستبدل بها جمع يضيّق المعنى إلى أفعال منفردة.
