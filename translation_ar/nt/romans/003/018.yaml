lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: لا خَوْفَ
  rationale: صياغة وجودية عربية طبيعية تنقل نفي وجود الخوف نفيًا قاطعًا.
- source_word: φόβος θεοῦ
  choice: خَوْفَ مِنَ اللهِ
  rationale: تحافظ «خوف» على المعنى المعجمي المباشر، وتوضح «من الله» أن الله هو متعلَّق الخوف، مع إبقاء معنى المهابة احتمالًا مذكورًا في الحاشية.
- source_word: ἀπέναντι
  choice: أَمامَ
  rationale: تنقل المعنى المكاني المجازي بعبارة عربية موجزة ومألوفة.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: عُيونِهِمْ
  rationale: تحافظ على الصورة الحسية في الأصل وعلى دلالتها المتعلقة بالإدراك والتوجه الأخلاقي.
theological_decisions: []
translation_notes:
  register: لغة عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. اختيرت «خوف من الله» بدل «خوف الله» لتجنب احتمال فهم الإضافة على أنها خوف صادر من الله، مع الحفاظ على الصورة الأصلية «أمام عيونهم».
