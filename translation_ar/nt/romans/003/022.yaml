  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: ar
  text: وأمّا بِرُّ الله[a] فبالإيمان بيسوع المسيح[b]، لجميع الذين يؤمنون؛ إذ لا فرق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عدل الله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بأمانة يسوع المسيح».'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: بِرّ
  rationale: «البِرّ» هو المقابل العربي المألوف في السياق البولسي، ويمكن أن يدل على الاستقامة وما يتصل بها من حكم أو مكانة صحيحة، مع إثبات «العدل» بديلًا معجميًا في الحاشية.
- source_word: θεοῦ
  choice: الله
  rationale: جاءت الإضافة «بِرّ الله» محافظةً على صيغة المضاف إليه اليونانية وعلى سعتها الدلالية، من غير حصرها في معنى «البر الآتي من الله».
- source_word: διὰ πίστεως
  choice: بالإيمان
  rationale: صياغة عربية موجزة وطبيعية تعبّر عن الوسيلة التي تدل عليها διά، وتحافظ على المعنى المعتاد لـ πίστις هنا.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ينقل Χριστός بوصفه لقبًا، وصيغة «يسوع المسيح» هي التعبير العربي الطبيعي الواضح.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: لجميع الذين يؤمنون
  rationale: تنقل شمول πάντας واستمرار الوصف في صيغة اسم الفاعل، بلغة عربية جارية وواضحة.
- source_word: διαστολή
  choice: فرق
  rationale: «لا فرق» تعبير عربي طبيعي مباشر يوافق معنى عدم التمييز أو الاختلاف في هذا السياق.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: الإيمان بيسوع المسيح
  alternative: أمانة يسوع المسيح
  rationale: 'تركيب المضاف إليه اليوناني محتمل للخلاف: فقد يدل على الإيمان الموجَّه إلى يسوع، أو على أمانة يسوع نفسه. اختيرت القراءة الأولى في المتن لشيوعها وطبيعتها في العربية، وحُفظت الثانية في الحاشية.'
- issue: δικαιοσύνη θεοῦ
  choice: بِرّ الله
  alternative: عدل الله
  rationale: يحافظ «بِرّ الله» على العبارة الإضافية وعلى سعتها، التي قد تشمل صفة الله وعمله وما يمنحه؛ وأُثبت «عدل الله» بوصفه احتمالًا معجميًا معتبرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «وأمّا» لنقل انتقال δὲ، وحُفظ الإيجاز الاسمي في اليونانية، مع وضع الحواشي عند موضع العبارة التي تشرحها.
