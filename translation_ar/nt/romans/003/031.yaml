id: ROM.3.31
reference: Romans 3:31
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: ar
  text: أفَنُبطِلُ الشريعةَ إذًا بالإيمان؟ حاشا! بل نُثَبِّتُ الشريعةَ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نُقيم الشريعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: الشريعة
  rationale: يشير اللفظ في سياق حجة بولس إلى شريعة الله، ولا سيما التوراة، و«الشريعة» هي المقابل العربي الطبيعي الذي يحفظ هذا المرجع.
- source_word: οὖν
  choice: إذًا
  rationale: تنقل الاستنتاج البلاغي المبني على الكلام السابق، وموضعها بعد المفعول طبيعي في العربية المعاصرة.
- source_word: καταργοῦμεν
  choice: نُبطِل
  rationale: يحفظ معنى جعل الشيء باطل المفعول أو عديم الأثر، ويهيئ للمقابلة مع «نُثبِّت» من غير الإيحاء التشريعي الأقوى الذي قد تحمله «نلغي».
- source_word: διὰ τῆς πίστεως
  choice: بالإيمان
  rationale: الباء تنقل بصورة طبيعية الدلالة الوسيلية لحرف الجر اليوناني مع المضاف إليه، و«الإيمان» هو المقابل الواضح المتسق مع سياق الرسالة.
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: عبارة عربية موجزة وقوية تفيد الرفض القاطع، من غير إدخال اسم الله غير المذكور صراحة في اليونانية.
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد التصحيح والمقابلة الحادة بين إبطال الشريعة وتثبيتها.
- source_word: ἱστάνομεν
  choice: نُثَبِّت
  rationale: يحفظ صورة إقامة الشيء على أساس راسخ، ويفيد هنا تأكيد الشريعة وإبقاء سلطانها بدل إبطالها، مع إبقاء إمكان معنى «نقيم» في الحاشية.
theological_decisions:
- issue: علاقة الإيمان بالشريعة
  choice: بل نُثَبِّتُ الشريعة
  alternative: بل نُقيم الشريعة
  rationale: ينفي بولس أن يكون الإيمان مبطلًا للشريعة. و«نُثبِّت» يعبّر عن تأكيدها وإقرار ثباتها من غير أن يوحي بأن المؤمنين ينشئونها لأول مرة، بينما تحفظ الحاشية المعنى الحرفي البديل الممكن للفعل اليوناني.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة بلاغية تناسب السؤال والرفض القاطع. استُعملت «حاشا» لصون قوة التعبير اليوناني من غير إضافة مرجع لاهوتي غير مصرح به، ووُضعت علامة الحاشية في المتن بعد العبارة التي تتعلق بها.
