  text: أَفْوَاهُهُمْ مَمْلُوءَةٌ بِاللَّعْنِ وَالْمَرَارَةِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: ـهُمْ
  rationale: اسم موصول في صيغة المضاف إليه يعود إلى المذكورين في السياق السابق؛ صيغته العربية الطبيعية هنا ضمير متصل في «أفواههم».
- source_word: τὸ στόμα
  choice: أفواه
  rationale: الأصل اليوناني مفرد ذو دلالة جمعية، أما جمع «أفواههم» فهو التعبير العربي الطبيعي ويحافظ على الإسناد إلى الجماعة.
- source_word: ἀρᾶς
  choice: لعنةً
  rationale: يدل الاسم على اللعن أو كلام اللعنة؛ واختيار «لعنة» يحافظ على قوة اللفظ وعلى صلته المباشرة بما يصدر من الفم.
- source_word: πικρίας
  choice: مرارةً
  rationale: المقابل العربي المباشر الذي يحفظ الدلالة الأخلاقية والمجازية للفظ، من غير قصره تفسيرياً على الكلام القاسي وحده.
- source_word: γέμει
  choice: مملوءة
  rationale: ينقل معنى الامتلاء في الزمن الحاضر بصياغة عربية واضحة، مع مطابقة الخبر لجمع غير العاقل «أفواه».
