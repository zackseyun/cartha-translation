id: ROM.3.6
reference: Romans 3:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: ar
  text: حاشا! وإلا فكيف سيدين الله العالم؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: صيغة رفض شديدة ومألوفة في العربية الكتابية، تنقل قوة التعبير الاصطلاحي اليوناني بإيجاز وكرامة، من غير تحويله إلى تمنٍّ حرفي.
- source_word: ἐπεὶ
  choice: وإلا
  rationale: تُظهر النتيجة المترتبة على الفرضية المرفوضة، وتنسجم طبيعيًا مع السؤال الاستنكاري التالي.
- source_word: κρινεῖ
  choice: سيدين
  rationale: يحافظ على دلالة المستقبل في الفعل اليوناني من غير إدخال معنى الإمكان أو الوجوب.
- source_word: ὁ θεὸς
  choice: الله
  rationale: المقابل العربي الطبيعي والمحدد للاسم مع أداة التعريف في السياق.
- source_word: τὸν κόσμον
  choice: العالم
  rationale: ينقل المعنى الواسع المعتاد لـ κόσμος بوصفه موضوع دينونة الله، من غير تضييقه إلى العالم المأهول أو نظام العالم.
theological_decisions:
- issue: قوة صيغة الرفض μὴ γένοιτο
  choice: رفض قاطع بصيغة «حاشا!»
  alternative: «كلا البتة!» أو الصيغة الحرفية «لا يكن!»
  rationale: «حاشا!» تؤدي وظيفة الصيغة البولسية بوصفها إنكارًا شديدًا للاستنتاج السابق، مع تجنب فرض مضمون عقائدي زائد.
- issue: طبيعة السؤال عن دينونة الله للعالم
  choice: 'الإبقاء على المستقبل المباشر: «كيف سيدين الله العالم؟»'
  alternative: «كيف يمكن لله أن يدين العالم؟»
  rationale: النص يستخدم فعلًا في المستقبل، والصياغة المختارة تحفظ بنيته وتترك القوة الحجاجية للسؤال من غير إضافة دلالة صريحة على الإمكان.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كريمة. استُعملت «حاشا» لأنها مفهومة في السياق الديني وتؤدي الرفض القاطع، بينما جاء «وإلا» لبيان سير الحجة بصورة طبيعية.
