id: ROM.3.20
reference: Romans 3:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: ar
  text: لأنه بأعمال الشريعة لن يُبرَّر أيُّ إنسان أمامه، إذ بالشريعة تأتي معرفة الخطيئة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: بأعمال الشريعة
  rationale: ينقل معنى الاستناد إلى الأعمال التي تطلبها الشريعة، بصياغة عربية موجزة وطبيعية.
- source_word: οὐ δικαιωθήσεται
  choice: لن يُبرَّر
  rationale: يحافظ على الدلالة القضائية للمبني للمجهول وعلى صيغة المستقبل في الأصل.
- source_word: πᾶσα σὰρξ
  choice: أيُّ إنسان
  rationale: التعبير اليوناني السامي يشمل البشر جميعًا هنا؛ والترجمة الوظيفية تمنع فهم «الجسد» بمعناه المادي وحده.
- source_word: ἐνώπιον αὐτοῦ
  choice: أمامه
  rationale: صياغة مباشرة تحفظ منظور الوقوف في حضرة الله ودينونته.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: معرفة الخطيئة
  rationale: يحفظ الاسم المصدري ومعنى إدراك الخطيئة أو التعرف إليها من خلال الشريعة.
theological_decisions:
- issue: دور أعمال الشريعة في التبرير
  choice: لن يُبرَّر أيُّ إنسان بأعمال الشريعة
  alternative: لن يُعلَن بارًّا أيُّ إنسان نتيجة أعمال الشريعة
  rationale: اختير المصطلح الكتابي المألوف «يُبرَّر» مع إبقاء النفي المطلق ودون إضافة تفسير مذهبي لآلية التبرير.
- issue: وظيفة الشريعة تجاه الخطيئة
  choice: بالشريعة تأتي معرفة الخطيئة
  alternative: بالشريعة يُدرَك معنى الخطيئة
  rationale: يحافظ النص على أن الشريعة تكشف الخطيئة، من غير توسيع العبارة إلى ادعاءات إضافية بشأن جميع وظائف الشريعة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «الشريعة» لـ νόμος اتساقًا مع السياق البولسي، و«أي إنسان» لنقل التعبير الاصطلاحي πᾶσα σάρξ بصورة مفهومة للقارئ المعاصر.
