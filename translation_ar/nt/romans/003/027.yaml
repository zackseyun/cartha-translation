id: ROM.3.27
reference: Romans 3:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: ar
  text: فأين الافتخار إذًا؟ قد أُقصي. بأي شريعة؟ أبشريعة الأعمال؟ لا، بل بشريعة الإيمان.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: الافتخار
  rationale: ينقل معنى التباهي أو الاعتزاز الذي يستند إليه الإنسان، وهو تعبير عربي واضح وملائم للسياق الجدلي.
- source_word: ἐξεκλείσθη
  choice: قد أُقصي
  rationale: يحافظ على صورة الاستبعاد والإخراج التي يفيدها الفعل المبني للمجهول، من غير تحديد فاعل لم يذكره النص.
- source_word: νόμος
  choice: شريعة
  rationale: يحافظ على التكرار المقصود للمصطلح اليوناني نفسه، مع إبقاء توتر استعماله هنا بمعنى مبدأ أو نظام محتمل.
- source_word: ἔργων
  choice: الأعمال
  rationale: ترجمة مباشرة لصيغة الجمع المضاف إليها، ضمن العبارة الموجزة «شريعة الأعمال».
- source_word: πίστεως
  choice: الإيمان
  rationale: ترجمة مباشرة تحفظ اتساع الدلالة من غير إضافة مفعول للإيمان أو تفسير مذهبي.
theological_decisions:
- issue: دلالة νόμος في «شريعة الأعمال» و«شريعة الإيمان»
  choice: الإبقاء على «شريعة» في الموضعين
  alternative: مبدأ الأعمال / مبدأ الإيمان
  rationale: تكرار اللفظ الواحد يحفظ التلاعب البلاغي والغموض الدلالي في الأصل، ولا يحسم هل المقصود شريعة بالمعنى المعتاد أم مبدأ حاكمًا.
- issue: أداة διὰ مع المضاف إليه
  choice: 'ترجمتها بالباء: «بأي شريعة... بشريعة الإيمان»'
  alternative: «عن طريق أي شريعة... عن طريق شريعة الإيمان»
  rationale: الباء تؤدي معنى الوسيلة بصورة طبيعية وموجزة في العربية، من غير تحويل العبارة إلى سببية صريحة أو تفسير زائد.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة وجدلية، تحافظ على الأسئلة المتتابعة والتوازي اللفظي في الأصل. لا توجد حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.
