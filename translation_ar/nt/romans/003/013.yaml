  text: حَنْجَرَتُهُمْ قَبْرٌ مَفْتُوحٌ[a]، وَبِأَلْسِنَتِهِمْ كَانُوا يَخْدَعُونَ[b]، وَسُمُّ الْأَفَاعِي[c] تَحْتَ شِفَاهِهِمْ.
