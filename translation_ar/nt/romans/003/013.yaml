  source_fidelity: 'الجملة الأولى تنقل الصورة اليونانية بأمانة: «حَنْجَرَتُهُمْ قَبْرٌ مَفْتُوحٌ» تحفظ الإسناد الاسمي وصيغة الحالة الناتجة في ἀνεῳγμένος. وكذلك «سُمُّ الأفاعي تحت شفاههم» تمثل ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν تمثيلًا واضحًا، مع عدم الجزم بنوع حيواني دقيق. لكن «كانوا يمكرون» يضيّق معنى ἐδολιοῦσαν، الذي يدل على استعمال الخداع أو الغش، ولا سيما في الكلام، أكثر من تدبير المكائد.'
