lexical_decisions:
- source_word: τάφος
  choice: قَبْر
  rationale: مقابل عربي واضح وطبيعي يحفظ صورة الموت والفساد في العبارة.
- source_word: ἀνεῳγμένος
  choice: مَفْتُوح
  rationale: ينقل حالة القبر الناتجة من فتحه، وهي دلالة اسم المفعول اليوناني في صيغة التمام، بصياغة عربية سليمة.
- source_word: λάρυγξ
  choice: حَنْجَرَة
  rationale: لفظ عربي دقيق ومألوف للعضو المقصود، ويحفظ الصورة الجسدية في الأصل.
- source_word: ἐδολιοῦσαν
  choice: كَانُوا يَمْكُرُونَ
  rationale: ينقل ممارسة الخداع بالكلام، وتحفظ «كانوا» دلالة الماضي المستمر في الفعل اليوناني الناقص.
- source_word: ἰός
  choice: سُمّ
  rationale: المقابل العربي الطبيعي للمادة السامة في سياق الحيات، من غير حاجة إلى تمييز اصطلاحي غير مألوف بين السم والسمّ المحقون.
- source_word: ἀσπίδων
  choice: الأَفَاعِي
  rationale: لفظ مفهوم للحيات السامة، ويتجنب الجزم بنوع حيواني لا يحدده الاستعمال القديم بيقين تام.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: تَحْتَ شِفَاهِهِمْ
  rationale: ترجمة مباشرة تحفظ الصورة المكانية والجسدية الحادة في النص.
