lexical_decisions:
- source_word: ὀξεῖς
  choice: سَرِيعَةٌ
  rationale: المعنى الحرفي هو «حادّة»، لكن الكلمة في هذا السياق تصف الأرجل المتهيئة للإسراع إلى العنف؛ لذلك تنقل «سريعة» المعنى الاصطلاحي بوضوح مع الحفاظ على الإلحاح.
- source_word: πόδες
  choice: أَرْجُلُ
  rationale: ترجمة مباشرة وطبيعية تحفظ الصورة الجسدية في النص اليوناني.
- source_word: αὐτῶν
  choice: هُمْ
  rationale: 'أُلحق الضمير بالاسم في العربية للتعبير الطبيعي عن الملكية: «أرجلهم».'
- source_word: ἐκχέαι
  choice: سَفْكِ
  rationale: الفعل يعني حرفيًا «أن يسكب»، لكن «سفك الدم» هو التعبير العربي المألوف عن إراقة الدم بالعنف.
- source_word: αἷμα
  choice: الدَّمِ
  rationale: الترجمة العربية القياسية للاسم، وهي ملائمة للسياق دون حاجة إلى تنويع.
