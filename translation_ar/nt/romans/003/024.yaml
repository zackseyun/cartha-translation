lexical_decisions:
- source_word: δικαιούμενοι
  choice: إذ يُبَرَّرون
  rationale: يحافظ الفعل المبني للمجهول على كون التبرير واقعًا عليهم، وتربط «إذ» العبارة بما قبلها مع نقل وظيفة اسم الفاعل اليوناني بصياغة عربية طبيعية.
- source_word: δωρεὰν
  choice: مجانًا
  rationale: تنقل بوضوح معنى العطية التي لا تُكتسب ولا يُدفع ثمنها.
- source_word: τῇ αὐτοῦ χάριτι
  choice: بنعمته
  rationale: «النعمة» هي المقابل العربي الراسخ والواضح في هذا السياق البولسي، والباء تنقل وسيلة التبرير أو أساسه المعطى.
- source_word: διὰ τῆς ἀπολυτρώσεως
  choice: عن طريق الفداء
  rationale: تنقل «عن طريق» معنى الوساطة، وتحفظ «الفداء» دلالة التحرير المرتبط بدفع ثمن.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: الذي في المسيح يسوع
  rationale: تحافظ الصياغة على تعلق شبه الجملة بـ«الفداء» وعلى حرفية العلاقة «في»، وتترجم Χριστός بلقبه العربي «المسيح».
theological_decisions:
- issue: لغة التبرير عند بولس
  choice: يُبَرَّرون
  alternative: يُعلَنون أبرارًا
  rationale: يحفظ المتن المصطلح البولسي الموجز ودلالته القضائية من غير أن يحصره في شرح تفسيري واحد؛ ويُذكر البديل التوضيحي في الحاشية.
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحفظ ترتيب الأصل اليوناني ويعامل «المسيح» بوصفه لقبًا ذا معنى، لا مجرد اسم شخصي.
translation_notes:
  register: صياغة عربية فصحى حديثة ومهيبة، مرتبطة نحويًا بالآية السابقة. استُعمل «المسيح» لأنه المقابل العربي الطبيعي للقب «المسيا»؛ لذلك لا حاجة إلى حاشية تميّز بين Messiah وChrist، إذ يقابلهما في هذا السياق اللفظ العربي نفسه.
