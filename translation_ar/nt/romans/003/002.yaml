  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: ar
  text: كثيرٌ من كل وجه. فأولًا، لأنهم اؤتمنوا على أقوال الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلمات الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺ
  choice: كثيرٌ
  rationale: استُعملت الكلمة استعمالًا مستقلًا للإجابة عن سؤال الأفضلية المفهوم من السياق، وتحافظ «كثيرٌ» على الإيجاز وقوة الجواب.
- source_word: κατὰ πάντα τρόπον
  choice: من كل وجه
  rationale: تعبير عربي واضح وطبيعي يفيد الشمول من جميع النواحي.
- source_word: πρῶτον μὲν γὰρ
  choice: فأولًا
  rationale: الفاء تنقل وظيفة γὰρ التفسيرية في السياق، و«أولًا» تقدم أول أوجه الأفضلية من غير أن تفترض ضرورة ورود بند ثانٍ مباشرة.
- source_word: ἐπιστεύθησαν
  choice: اؤتمنوا على
  rationale: الفعل هنا مبني للمجهول ويدل على تسليم شيء إلى أمانة أشخاص، لا على أنهم آمنوا به.
- source_word: τὰ λόγια
  choice: أقوال
  rationale: تشير الكلمة إلى أقوال صادرة عن الله؛ و«أقوال» عربية مفهومة وتحافظ على معنى التصريحات الإلهية دون تضييقها إلى مفهوم اصطلاحي زائد.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: أضيفت «أقوال» إلى اسم الجلالة مباشرة، بما ينقل علاقة الإضافة في اليونانية على نحو عربي طبيعي.
theological_decisions:
- issue: مدلول λόγια وحدود الأمانة الموكلة
  choice: أقوال الله
  alternative: وحي الله أو كلمات الله
  rationale: يحافظ التعبير على الإشارة إلى ما نطق به الله من غير حصره صراحة في تعريف مذهبي لنطاق الأسفار أو لطبيعة مهمة المؤتمنين.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ووقورة. حُفظ التركيب الانتقالي «فأولًا» مع أن بندًا ثانيًا لا يرد مباشرة، كما في النص اليوناني.
