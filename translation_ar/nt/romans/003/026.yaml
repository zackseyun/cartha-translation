translation:
  language: ar
  text: في إمهال الله، لإظهار برّه في الزمان الحاضر، لكي يكون هو بارًّا ويُبرِّر مَن يؤمن بيسوع[a].
  philosophy: optimal-equivalence
  footnotes:
