lexical_decisions:
- source_word: ἀνοχῇ
  choice: إمهال
  rationale: ينقل معنى كفّ الحكم أو العقاب مؤقتًا عن قصد، وهو أنسب من «الصبر» العام في هذا السياق.
- source_word: ἔνδειξιν
  choice: إظهار
  rationale: تعبير عربي طبيعي يحفظ معنى إبراز برّ الله وإعلانه على نحو بيّن.
- source_word: δικαιοσύνης
  choice: برّه
  rationale: يحفظ المصطلح البولسي وصلته اللفظية بالجذر نفسه في «بارًّا» و«يبرّر»، مع بقاء دلالة العدل حاضرة في السياق القضائي.
- source_word: νῦν καιρῷ
  choice: الزمان الحاضر
  rationale: صياغة فصيحة واضحة تحافظ على التشديد الزمني في νῦν وκαιρός.
- source_word: δίκαιον
  choice: بارًّا
  rationale: يحافظ على الاشتقاق المشترك مع δικαιοσύνη وδικαιοῦντα، بينما يظل المعنى القضائي مفهومًا من السياق.
- source_word: δικαιοῦντα
  choice: يُبرِّر
  rationale: فعل مضارع ينقل اسم الفاعل اليوناني المستعمل خبريًا، ويحافظ على الصلة اللفظية مع «برّه» و«بارًّا» بصورة طبيعية في العربية.
- source_word: τὸν ἐκ πίστεως Ἰησοῦ
  choice: مَن يؤمن بيسوع
  rationale: تتبنى العبارة في المتن الفهم المفعولي الشائع للإضافة، أي الإيمان الموجّه إلى يسوع، بصياغة عربية واضحة، مع إثبات الاحتمال الآخر في الحاشية.
theological_decisions:
- issue: دلالة ἐκ πίστεως Ἰησοῦ
  choice: مَن يؤمن بيسوع
  alternative: مَن هو من أمانة يسوع
  rationale: الإضافة اليونانية تحتمل أن يكون يسوع مفعول الإيمان أو صاحب الأمانة. اختير الفهم الأول في المتن لوضوح العربية وشيوعه في السياق، وحُفظ الفهم الثاني في الحاشية دون حسم التوتر التفسيري.
- issue: العلاقة بين δικαιοσύνη وδίκαιος وδικαιόω
  choice: برّه، بارًّا، ويُبرِّر
  alternative: عدله، عادلًا، ويعلن بارًّا
  rationale: اختيار ألفاظ من جذر عربي مترابط يحفظ قدر الإمكان التلاعب الاشتقاقي والحجة اللاهوتية في النص، من غير اختزال δικαιοσύνη في معنى قضائي واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على الترابط بين «برّه» و«بارًّا» و«يبرّر»، وعلى تركيب الآية بوصفها امتدادًا نحويًا لما قبلها. وُضع مؤشر الحاشية مباشرة بعد العبارة المختلف في فهمها.
