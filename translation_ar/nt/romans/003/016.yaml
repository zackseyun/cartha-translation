- source_word: σύντριμμα
  choice: الدَّمار
  rationale: ينقل نتيجة التحطيم والخراب بقوة وإيجاز، وهو طبيعي في العربية المعاصرة. ويمكن أيضًا ترجمته بـ«الخراب».
- source_word: ταλαιπωρία
  choice: الشَّقاء
  rationale: يعبّر بوضوح عن البؤس والمعاناة الشديدة، ويحافظ على الإيجاز والتوازي مع الاسم السابق.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: في طُرُقِهِمْ
  rationale: يحافظ على صورة الطرق في اليونانية، مع احتمال دلالتها المجازية على مسالكهم وسيرتهم.
- source_word: καὶ
  choice: و
  rationale: حرف العطف العربي المعتاد الذي يربط الاسمين المتعاطفين.
