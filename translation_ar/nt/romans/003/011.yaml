  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: ar
  text: لَيْسَ مَنْ يَفْهَمُ، وَلَيْسَ مَنْ يَطْلُبُ اللهَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يَجِدُّ في طلب الله» أو «يبحث عن الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: يَفْهَمُ
  rationale: اسم الفاعل اليوناني يدل على الفهم والإدراك، وصيغة «مَنْ يَفْهَمُ» تنقل معناه بعبارة عربية طبيعية واضحة.
- source_word: ἐκζητῶν
  choice: يَطْلُبُ
  rationale: الفعل المركب يفيد طلب الله أو السعي إليه، و«يطلب» هي العبارة العربية الأوضح، مع إثبات دلالة التقصّي الأقوى في الحاشية.
- source_word: οὐκ ἔστιν
  choice: لَيْسَ مَنْ
  rationale: تنقل هذه الصياغة النفي القاطع المتكرر، وتحافظ على التوازي في الأصل دون إضافة تقييد تفسيري.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: مَنْ يَفْهَمُ / مَنْ يَطْلُبُ
  rationale: تؤدي «مَنْ» مع الفعل وظيفة اسمي الفاعل المستعملين استعمال الاسم في اليونانية، بأسلوب عربي موجز وطبيعي.
- source_word: τὸν θεόν
  choice: اللهَ
  rationale: هذا هو المقابل العربي الطبيعي والمحدد للمرجع في السياق.
theological_decisions:
- issue: نطاق النفي في اقتباس بولس المتسلسل
  choice: 'الإبقاء على النفي المطلق مرتين: «ليس من... وليس من...»'
  alternative: ليس من يفهم حقًا، وليس من يطلب الله بصدق
  rationale: النص اليوناني يصوغ نفيًا قاطعًا بلا قيود، ولذلك لا تُضاف إليه أوصاف تفسيرية مثل «حقًا» أو «بصدق».
translation_notes:
  register: فصحى معاصرة واضحة ومهيبة، مع الحفاظ على الإيجاز والتوازي والنفي القاطع في النص اليوناني.
