base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: ar
  text: لأن الخليقة أُخضعت للبُطل[a]، لا بإرادتها، بل بسبب مَن أخضعها[b]، على رجاء[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للعبث» أو «للخواء» أو «للإحباط».'
    reason: lexical_alternative
  - marker: b
    text: لا يصرّح النص اليوناني بهوية «مَن أخضعها».
    reason: alternative_reading
  - marker: c
    text: 'أو: «برجاء» أو «في رجاء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: البُطل
  rationale: يدل اللفظ هنا على حالة العجز عن بلوغ الغاية المقصودة، لا على الشر الأخلاقي. و«البُطل» يحافظ على الإيجاز وعلى دلالة الخواء وعدم الجدوى في السياق.
- source_word: κτίσις
  choice: الخليقة
  rationale: يشير اللفظ في سياق رومية 8:19–22 إلى مجموع العالم المخلوق، ولا سيما ما عدا البشر، لا إلى مخلوق فرد؛ و«الخليقة» تعبير عربي كتابي واضح وموجز.
- source_word: ὑπετάγη
  choice: أُخضعت
  rationale: يحافظ المبني للمجهول على كون الخليقة وقع عليها إخضاع مفروض من خارجها.
- source_word: οὐχ ἑκοῦσα
  choice: لا بإرادتها
  rationale: تعبير طبيعي واضح يبيّن أن إخضاع الخليقة لم يكن اختيارًا منها.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: بسبب الذي أخضعها
  rationale: حُمِل حرف الجر διά مع النصب على السببية، مع إبقاء هوية الفاعل غير مصرّح بها كما في اليونانية.
- source_word: ἐφ’ ἑλπίδι
  choice: على رجاء
  rationale: يحافظ هذا التعبير على تركيب اليونانية الموجز وعلى صلته الرجائية بما يلي، من غير توسيع تفسيري.
theological_decisions:
- issue: هوية «الذي أخضع» الخليقة
  choice: 'أُبقي الوصف عامًا: «الذي أخضعها».'
  alternative: قد يُفهم أنه الله الذي أخضع الخليقة في الدينونة مع قصد خلاصي، أو أن سقوط آدم كان سبب إخضاعها؛ وقد اقترح بعضهم الشيطان، وهو أضعف سياقيًا.
  rationale: النص اليوناني لا يسمّي الفاعل صراحة، لذلك ينبغي ألا تحسم الترجمة ما تركه النص غير مصرّح به.
- issue: تعلّق عبارة ἐφ’ ἑλπίδι
  choice: صيغت «على رجاء» في ختام الآية، محافظةً على إمكان اتصالها بالإخضاع أو بما يأتي بعدها.
  alternative: «برجاء» أو «في رجاء».
  rationale: موضع العبارة وتركيبها يسمحان بشيء من المرونة في تحديد صلتها النحوية؛ فلا ينبغي للترجمة أن تحسم هذا التوتر أكثر من الأصل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُخدم «الخليقة» للمجموع المخلوق، وحُفظ المبني للمجهول والإيجاز والغموض المقصود في هوية المُخضِع وفي تعلّق عبارة الرجاء.
