  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: ar
  text: ولا علوّ، ولا عمق، ولا أيّ شيء آخر مخلوق[a]، سيقدر أن يفصلنا عن محبة الله التي في المسيح يسوع ربنا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيّ شيء آخر في الخليقة»، أو: «أيّ مخلوق آخر».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن المقصود هنا بـ«محبة الله» هو محبة الله لنا.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: علوّ
  rationale: يحفظ المعنى المكاني في مقابل «عمق»، وينقل التضاد البلاغي بوضوح.
- source_word: βάθος
  choice: عمق
  rationale: المقابل المباشر والطبيعي لـ«علوّ» في هذا السياق.
- source_word: κτίσις ἑτέρα
  choice: أيّ شيء آخر مخلوق
  rationale: ينقل معنى وجود شيء آخر ضمن النظام المخلوق، مع إظهار دلالة τις وἑτέρα، من غير حصر κτίσις في الأشخاص أو الكائنات الحية.
- source_word: δυνήσεται
  choice: سيقدر
  rationale: يحفظ دلالة الاستطاعة وصيغة المستقبل في اليونانية.
- source_word: χωρίσαι
  choice: أن يفصلنا
  rationale: تعبير عربي مباشر وطبيعي ينقل معنى إحداث الانفصال.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: محبة الله
  rationale: يحافظ على تركيب الإضافة في الأصل وعلى ما فيه من احتمال نحوي، مع أن السياق يرجّح محبة الله لنا.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، وحرف «في» يحفظ صياغة الأصل.
- source_word: κυρίῳ ἡμῶν
  choice: ربنا
  rationale: صياغة عربية موجزة ومألوفة تنقل معنى «ربّنا» بدقة.
theological_decisions:
- issue: دلالة الإضافة في «محبة الله»
  choice: الإبقاء على «محبة الله» في المتن، مع بيان أن السياق يرجّح محبة الله لنا
  alternative: محبتنا لله، أو إضافة واسعة تشمل المعنيين
  rationale: سياق رومية 8:31–39 يركّز على عمل الله نحو شعبه وضمان عدم فصلهم عن محبته، لكن تركيب الأصل نفسه لا يصرّح باتجاه المحبة، لذلك حُفظ في المتن ووضّح الترجيح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي البلاغي بين «علوّ» و«عمق»، واستُخدمت صيغة المستقبل في «سيقدر». لا حاجة إلى حاشية تميّز بين Messiah وChrist، لأن «المسيح» هو اللقب العربي الطبيعي لكليهما.
