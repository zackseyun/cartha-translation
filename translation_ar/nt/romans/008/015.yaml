source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: ar
  text: 'لِأَنَّكُمْ لَمْ تَنَالُوا رُوحَ عُبُودِيَّةٍ تَقُودُكُمْ مَرَّةً أُخْرَى إِلَى الْخَوْفِ، بَلْ نِلْتُمْ رُوحَ التَّبَنِّي كَأَبْنَاءٍ[a][b]، وَبِهِ نَصْرُخُ[c]: «أَبَّا، أَيُّهَا الْآبُ!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «روح البنوة بالتبنّي». والمقصود منح منزلة الأبناء وحقوقهم، لا مجرد التبنّي بمعناه العام.'
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «روح التبنّي» هنا إلى الروح القدس، كما يرجّح السياق، مع أن تركيبها يقابل عبارة «روح عبودية».
    reason: alternative_reading
  - marker: c
    text: 'حرفيًّا: «فيه نصرخ»؛ ويمكن أن تفيد العبارة اليونانية معنى الوسيلة، أي «به نصرخ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: رُوحَ عُبُودِيَّةٍ
  rationale: يحافظ على صورة العبودية وعلى الموازاة المقصودة مع «روح التبنّي»، من غير أن يفرض منذ البداية معنى نفسيًا أو شخصيًا على كلمة «روح».
- source_word: πάλιν εἰς φόβον
  choice: يُعِيدُكُمْ إِلَى الْخَوْفِ مِنْ جَدِيدٍ
  rationale: صياغة عربية طبيعية تحفظ معنى الرجوع الذي في πάλιν والاتجاه إلى الخوف الذي في εἰς φόβον.
- source_word: πνεῦμα υἱοθεσίας
  choice: رُوحَ التَّبَنِّي كَأَبْنَاءٍ
  rationale: تنقل صورة منح منزلة الأبناء القانونية والوارثة، مع إبقاء لفظ «روح» قابلًا لأن يُفهم في السياق عن الروح القدس دون حسم نحوي زائد.
- source_word: ἐν ᾧ
  choice: وَبِهِ
  rationale: الباء تؤدي المعنى الوسيلي المحتمل بصورة طبيعية، ويمكن أن يعود الضمير على الروح بوصفه شخصًا أو على «روح التبنّي» بوصفها العبارة السابقة؛ أما الصيغة الحرفية فمثبتة في الحاشية.
- source_word: κράζομεν
  choice: نَصْرُخُ
  rationale: يحفظ قوة النداء وحرارته دون إطالة.
- source_word: Αββα ὁ πατήρ
  choice: «أَبَّا، أَيُّهَا الْآبُ!»
  rationale: نُقلت «أبّا» صوتيًا لأنها اللفظة الآرامية التي أبقاها النص اليوناني، وتُرجمت العبارة اليونانية التالية بنداء عربي صريح يحفظ لقب «الآب».
theological_decisions:
- issue: هل πνεῦμα υἱοθεσίας يشير صراحةً إلى الروح القدس أم إلى روح/حال التبنّي؟
  choice: إبقاء «روح التبنّي» في المتن من غير إضافة «القدس»
  alternative: «روح التبنّي، أي الروح القدس» أو «روح البنوة»
  rationale: السياق في رومية 8 يرجّح بقوة الإشارة إلى الروح القدس، لكن بنية العبارة تقابل «روح عبودية» بـ«روح تبنٍّ». لذلك لا يُحسم التوتر بإضافة غير موجودة في النص، وتُذكر القراءة الشخصية في الحاشية.
- issue: الدلالة القانونية والجندرية لكلمة υἱοθεσία
  choice: «التبنّي كأبناء»
  alternative: «التبنّي» أو «البنوة»
  rationale: تحفظ الصياغة منزلة الابن القانونية وارتباطها بالميراث في الاستعمال البولسي، وهي منزلة يشترك فيها جميع المؤمنين، من غير تسطيح اللفظ إلى تبنٍّ عام.
- issue: القيمة الدلالية لعبارة ἐν ᾧ
  choice: «به»
  alternative: «فيه»
  rationale: المعنى الوسيلي مناسب للسياق، لكن الحاشية تحفظ البنية المكانية/العلائقية الأشد حرفية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «نلتم» للموازاة الإيقاعية، وأُبقيت «أبّا» منقولة صوتيًا كما أبقاها الأصل اليوناني، مع تجنّب إضافة «القدس» في المتن حفاظًا على الغموض الحقيقي في التركيب.
