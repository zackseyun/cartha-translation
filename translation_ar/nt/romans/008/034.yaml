id: ROM.8.34
reference: Romans 8:34
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: ar
  text: فمن الذي يدين؟ المسيح هو الذي مات، بل أكثر من ذلك، هو الذي أُقيم[a]، وهو أيضًا عن يمين الله[b]، وهو أيضًا يشفع لنا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي قام». والفعل اليوناني مبني للمجهول حرفيًا: «الذي أُقيم».'
    reason: alternative_reading
  - marker: b
    text: «عن يمين الله» تعبير كتابي يدل على موضع أسمى كرامة وسلطان.
    reason: cultural_note
  - marker: c
    text: 'أي: يشفع من أجلنا أو نيابةً عنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: الذي يدين
  rationale: صيغ اسم الفاعل المعرّف في اليونانية تعبيرًا موصوليًا اسميًا، مع إبقاء معنى إصدار حكم الإدانة وصيغة السؤال البلاغي.
- source_word: Χριστός
  choice: المسيح
  rationale: ينقل اللقب اليوناني مباشرةً بصيغته العربية الكتابية المعروفة، من غير إضافة «يسوع» لأنها غير موجودة في النص اليوناني المقدم.
- source_word: ἀποθανών
  choice: الذي مات
  rationale: تنقل الجملة الموصولة الفعل التاريخي التام بعبارة عربية طبيعية ومباشرة.
- source_word: μᾶλλον δὲ
  choice: بل أكثر من ذلك
  rationale: تحفظ العبارة التدرج التصاعدي من موت المسيح إلى إقامته، بدل فهمها على أنها إلغاء لما سبق.
- source_word: ἐγερθείς
  choice: الذي أُقيم
  rationale: تحفظ صيغة المبني للمجهول في اليونانية ولا تحولها إلى «قام»، مع عدم إضافة فاعل غير مصرّح به في العبارة.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: عن يمين الله
  rationale: هذا هو التعبير العربي الكتابي الطبيعي المقابل للصورة اليونانية الدالة على موضع الكرامة والسلطان.
- source_word: ἐντυγχάνει
  choice: يشفع
  rationale: ينقل معنى التوسط والتضرع لمصلحة آخرين بلفظ عربي واضح ذي وزن لاهوتي مناسب.
- source_word: ὑπὲρ ἡμῶν
  choice: لنا
  rationale: «يشفع لنا» تركيب عربي طبيعي يؤدي معنى العمل لمصلحتنا ونيابةً عنا من غير إطالة.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا مسيانيًا
  choice: المسيح
  alternative: المسيح يسوع
  rationale: النص اليوناني المقدم يقرأ Χριστός وحدها؛ لذلك حُفظ اللقب من غير إضافة اسم «يسوع»، مع إبقاء دلالته المسيانية المعروفة في العربية.
- issue: صيغة ἐγερθείς في الحديث عن القيامة
  choice: الذي أُقيم
  alternative: الذي قام
  rationale: اختير المبني للمجهول وفق الصيغة اليونانية، حفاظًا على عرض القيامة بوصفها فعلًا وقع على المسيح، من غير حسم الفاعل داخل الترجمة.
- issue: دلالة الجلوس عن يمين الله
  choice: عن يمين الله
  alternative: في موضع السلطان الأسمى لدى الله
  rationale: حُفظت الصورة الكتابية نفسها، وأُوضح مدلولها في الحاشية بدل استبدالها بتفسير داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ تتابع السؤال البلاغي والجمل الموصولة، مع تكرار «هو» لتوضيح البنية ومنع التباس تعلق العبارات. لم تُضف كلمة «يسوع» لعدم وجودها في نص SBLGNT المقدم.
