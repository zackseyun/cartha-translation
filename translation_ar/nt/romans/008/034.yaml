  source_fidelity: 'النص العربي أمين لبنية اليونانية ومعناها: السؤال البلاغي، و«المسيح» بلا إضافة «يسوع»، وفعل «مات»، والتصعيد في «بل أكثر من ذلك»، وصيغة المبني للمجهول في «أُقيم»، وصورتا اليمين والشفاعة كلها محفوظة. ولا يقتضي النص تعيين فاعل الإقامة.'
  naturalness: الصياغة فصحى حديثة واضحة ومترابطة. تكرار «وهو أيضًا» يخدم تتابع الجمل الموصولة في الأصل من غير ثقل ملحوظ، و«عن يمين الله» و«يشفع لنا» تعبيران عربيان كتابيان طبيعيان.
  terminology: «المسيح»، و«أُقيم»، و«عن يمين الله»، و«يشفع لنا» خيارات مستقرة ودقيقة في السجل العربي الكتابي، ولا تحمل إضافة تفسيرية أو انحيازًا مذهبيًا. الحواشي مرتبطة بمواضعها وتوضح البديل والصورة الثقافية دون تغيير المعنى.
