  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: ar
  text: أَمَّا الَّذِينَ هُمْ فِي الْجَسَدِ، فَلَا يَسْتَطِيعُونَ أَنْ يُرْضُوا اللهَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الطبيعة الخاطئة». يقول اليوناني حرفيًّا: «في الجسد»، وهو تعبير محوري عند بولس في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: الذين هم
  rationale: أداة التعريف مع اسم الفاعل تؤدي وظيفة اسمية وتشير إلى فئة من الناس في حالة قائمة؛ و«الذين هم» صياغة عربية واضحة تحفظ هذا المعنى.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: تُظهر هذه الصياغة الاستمرار والمقابلة مع السياق السابق بصورة طبيعية في العربية، من غير المبالغة في قوة الاستدراك.
- source_word: ἐν σαρκὶ
  choice: في الجسد
  rationale: تحفظ العبارة اللفظ البولسي المحوري σάρξ وروابطه المفهومية في رومية 8، بدل أن تحسم معناه بتفسير مثل «الطبيعة الخاطئة».
- source_word: ἀρέσαι
  choice: أن يُرضوا
  rationale: المصدر بعد فعل الاستطاعة يعبّر عن القدرة؛ و«أن يُرضوا» هو المقابل العربي الطبيعي المباشر.
- source_word: θεῷ
  choice: اللهَ
  rationale: يناسب الفعل العربي «أرضى» مفعولٌ به مباشر، مع بقاء الدلالة الأصلية للمجرور اليوناني محفوظة معنًى.
- source_word: οὐ δύνανται
  choice: لا يستطيعون
  rationale: تعبير عربي فصيح وواضح عن نفي القدرة، من دون إضافة تفسير إلى النص.
theological_decisions:
- issue: ترجمة σάρξ في سياق بولسي موضع خلاف
  choice: في الجسد
  alternative: في الطبيعة الخاطئة؛ تحت سلطان الجسد
  rationale: الإبقاء على «الجسد» يحفظ غموض المصطلح المقصود وثقله اللاهوتي وصلته بالسياق، ولا يفرض تفسيرًا واحدًا داخل المتن. ويُذكر البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل تركيب «أمّا ... فـ» لإبراز المقابلة السياقية، وأُبقي مصطلح «الجسد» في المتن حفاظًا على الصياغة اليونانية والتوتر الدلالي.
