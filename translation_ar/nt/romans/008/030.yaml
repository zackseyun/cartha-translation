  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: ar
  text: والذين عيّنهم من قبل[a]، دعاهم أيضًا؛ والذين دعاهم، برّرهم أيضًا؛ والذين برّرهم، مجّدهم أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قدّرهم مسبقًا» أو «عيّنهم مسبقًا».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «مجّدهم» بصيغة الماضي؛ ويفهم بعضهم أن الماضي هنا يشير إلى مجد مستقبلي مؤكَّد إلى حدّ أنه يوصف كأنه قد تمّ.'
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: سبق فعيّنهم
  rationale: يفيد الفعل اتخاذ قرار أو تعيينًا من قبل. تحافظ الصياغة على معنى الأسبقية من غير أن تحصره في بناء مذهبي معيّن، كما أنها طبيعية وموجزة في العربية.
- source_word: ἐκάλεσεν
  choice: دعاهم
  rationale: «دعا» هو المقابل العربي المباشر والطبيعي، ويحافظ على ترابط الأفعال في تسلسل بولس من غير تحديد زائد لطبيعة الدعوة.
- source_word: ἐδικαίωσεν
  choice: برّرهم
  rationale: يحافظ «برّر» على الإيجاز وعلى الدلالة القضائية الشائعة للفعل في استعمال بولس، من غير تحويل الترجمة إلى شرح مثل «حسبهم أبرارًا» أو «أعلن براءتهم».
- source_word: ἐδόξασεν
  choice: مجّدهم
  rationale: الصيغة اليونانية ماضٍ بسيط، ولذلك أُبقي الفعل ماضيًا للمحافظة على تسلسل العبارة وقوتها البلاغية، مع بيان الفهم المستقبلي الممكن في الحاشية.
- source_word: οὓς ... τούτους
  choice: الذين ... ـهم
  rationale: تدل البنية الارتباطية المتكررة على بقاء الجماعة نفسها في كل حلقة من السلسلة. صيغت عربيًا بضمير المفعول المتصل لتجنب ثقل الترجمة الحرفية لـ«فهؤلاء» مع الحفاظ على الإحالة نفسها.
- source_word: καὶ
  choice: أيضًا
  rationale: لـ«καί» هنا قوة إضافية تربط كل فعل بما سبقه؛ و«أيضًا» تُظهر هذا التدرج بوضوح.
- source_word: δὲ
  choice: الواو
  rationale: تؤدي δέ هنا وظيفة وصل خفيف لا تضاد قوي، فالواو أنسب للسياق العربي.
theological_decisions:
- issue: هل تُلطَّف دلالة προώρισεν تجنبًا للجدل المذهبي؟
  choice: سبق فعيّنهم
  alternative: قدّرهم مسبقًا؛ عيّنهم من قبل
  rationale: ينص الأصل على تعيين سابق، فينبغي إبقاء هذا المعنى من غير إضافة تحدد أساس التعيين أو كيفيته أو نطاقه بما يتجاوز الآية.
- issue: هل يُترجم ἐδόξασεν بالماضي أم بالمستقبل؟
  choice: مجّدهم
  alternative: سيمجّدهم
  rationale: الفعل في اليونانية ماضٍ بسيط خبري، لذا يعكس المتن صيغته الماضية. ولأن بعضهم يفهمه استباقًا لمجد مستقبلي مؤكَّد، حُفظ هذا الاحتمال في الحاشية بدل إحلاله محل صيغة الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. حافظت الصياغة على التوازي والتدرج في السلسلة، مع تجنب المصطلحات المذهبية الأضيق والتفسير الزائد.
