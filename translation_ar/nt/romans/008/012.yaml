lexical_decisions:
- source_word: Ἄρα οὖν
  choice: فإذًا
  rationale: تفيد الأداتان معًا استنتاجًا مما سبق مع انتقال في سياق الحجة؛ و«فإذًا» تنقل القوتين الاستنتاجية والانتقالية بإيجاز طبيعي.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ هذا على صيغة النداء المذكرة الجمع في اليونانية، مع بيان شمول جماعة المؤمنين كلها في الحاشية.
- source_word: ὀφειλέται ἐσμέν
  choice: نحن مَدينون
  rationale: يحفظ صورة الدَّين في الاسم اليوناني، مع دلالته السياقية على الالتزام لا على مديونية مالية حرفية.
- source_word: τῇ σαρκὶ / σάρκα
  choice: للجسد / بحسب الجسد
  rationale: يحافظ «الجسد» على مصطلح بولس وتكراره في المقابلة بين الجسد والروح، من غير اختزاله في تفسير واحد.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: حتى نعيش بحسب الجسد
  rationale: تنقل العبارة مضمون الالتزام المنفي أو نتيجته المقصودة، وتحافظ على اصطلاح «بحسب الجسد» المتكرر في السياق.
theological_decisions:
- issue: المعنى المجازي لكلمة σάρξ في المقابلة البولسية
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: أُبقي مصطلح «الجسد» في المتن حفاظًا على مفردات بولس وعلى التوتر الدلالي بين البعد البشري الضعيف والميل الخاضع للخطية، بدل حصره في تفسير عقائدي واحد.
- issue: شمول النداء ἀδελφοί للنساء والرجال في الجماعة
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: يحفظ المتن الصيغة النحوية الأصلية، بينما توضّح الحاشية أن النداء موجّه إلى جماعة المؤمنين كلها.
translation_notes:
