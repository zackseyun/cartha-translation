source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: ar
  text: لأن ما لم تستطع الشريعة أن تفعله[a]، إذ كانت ضعيفة بسبب الجسد[b]، فعله الله إذ أرسل ابنه نفسه في شبه جسد الخطيئة[d]، ومن أجل الخطيئة[c]؛ فدان الخطيئة في الجسد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبحرفية أكثر: «عجز الشريعة».'
    reason: lexical_alternative
  - marker: b
    text: 'يرجح أن «الجسد» هنا يشير إلى الوجود البشري في ضعفه الساقط؛ ويترجم بعضهم اللفظ تفسيريًا في بعض المواضع: «الطبيعة الخاطئة».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أن تحمل العبارة اليونانية معنى ذبائحيًا: «ذبيحةً عن الخطيئة».'
    reason: alternative_reading
  - marker: d
    text: تؤكد عبارة «في شبه جسد الخطيئة» إنسانية الابن الحقيقية، مع التمييز بعناية بينه وبين الخطيئة نفسها.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: ما لم تستطع الشريعة أن تفعله
  rationale: يحوّل التركيب الاسمي اليوناني المحايد إلى عبارة عربية طبيعية، مع الحفاظ على معنى عجز الشريعة عن إنجاز الأمر المقصود.
- source_word: νόμος
  choice: الشريعة
  rationale: «الشريعة» أوضح في العربية في هذا السياق البولسي من «القانون»، وتشير طبيعيًا إلى شريعة موسى من غير حاجة إلى شرح داخل النص.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: إذ كانت ضعيفة بسبب الجسد
  rationale: يحافظ على كون العبارة تفسيرًا لعجز الشريعة، ويعبّر «بسبب الجسد» بوضوح عن الوسيط أو العامل الذي من خلاله ظهر ضعفها.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: ابنه بالذات
  rationale: تنقل «بالذات» توكيد ἑαυτοῦ، أي إن الله أرسل ابنه هو، من غير إضافة مضمون عقائدي غير مصرح به.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: في شبه جسد الخطيئة
  rationale: تحافظ الصياغة على «الشبه» وعلى الإضافة المكثفة «جسد الخطيئة»، فلا تنسب الخطيئة إلى الابن ولا تضعف حقيقة مجيئه في الجسد.
- source_word: περὶ ἁμαρτίας
  choice: من أجل الخطيئة
  rationale: هذه الصياغة الأقرب والأوسع دلالة في المتن، وتترك المعنى الذبائحي المحتمل ظاهرًا في الحاشية بدل حسم العبارة لمصلحة تفسير واحد.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: دان الخطيئة
  rationale: «دان» ينقل القوة القضائية للفعل اليوناني بإيجاز ووضوح.
- source_word: ἐν τῇ σαρκί
  choice: في الجسد
  rationale: يحافظ على إيجاز اليونانية ولا يضيف ضميرًا يحدد صراحةً جسد من هو، مع بقاء الإشارة السياقية إلى تجسد الابن.
theological_decisions:
- issue: دلالة σάρξ في الآية
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: يحافظ «الجسد» على صورة بولس وعلى الترابط بين ضعف البشر وتجسد الابن، ولا يحوّل اللفظ المختلف في تفسيره إلى مصطلح عقائدي محدد.
- issue: دلالة περὶ ἁμαρτίας
  choice: من أجل الخطيئة
  alternative: ذبيحةً عن الخطيئة
  rationale: للعبارة اليونانية دلالة عامة ودلالة ذبائحية معروفة من استعمال السبعينية؛ لذلك تُحفظ الصياغة الأوسع في المتن ويُذكر المعنى الذبائحي في الحاشية.
- issue: القوة المسيحانية لعبارة ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: في شبه جسد الخطيئة
  alternative: في جسد خاطئ أو في مجرد شبه جسد
  rationale: 'تحفظ العبارة التوتر النصي: مجيء الابن الحقيقي في الجسد مع عدم نسب الخطيئة إليه، من غير شرح مذهبي زائد.'
- issue: مرجع ἐν τῇ σαρκί
  choice: في الجسد
  alternative: في جسده
  rationale: لا تتضمن اليونانية ضميرًا صريحًا؛ إبقاء العبارة من دون ضمير يصون كثافتها واحتمالها، وإن كان السياق يرجح جسد الابن المتجسد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «الشريعة» للمصطلح البولسي νόμος، و«الجسد» بدل الصياغة التفسيرية «الطبيعة الخاطئة». وُضعت علامات الحواشي عند العبارات التي تشرحها مباشرة، مع إبقاء ترتيب العلامات الأبجدي في جهاز الحواشي.
