- from: أَمَّا أَنْتُمْ فَلَسْتُمْ فِي الْجَسَدِ[a]، بَلْ فِي الرُّوحِ، إِنْ كَانَ رُوحُ اللهِ يَسْكُنُ فِيكُمْ حَقًّا. وَلَكِنْ إِنْ كَانَ أَحَدٌ لَيْسَ لَهُ رُوحُ الْمَسِيحِ، فَهُوَ لَا يَنْتَمِي إِلَيْهِ[b].
  to: أَمَّا أَنْتُمْ فَلَسْتُمْ فِي الْجَسَدِ[a]، بَلْ فِي الرُّوحِ، إِنْ كَانَ رُوحُ اللهِ يَسْكُنُ فِيكُمْ حَقًّا. وَلَكِنْ إِنْ لَمْ يَكُنْ لِأَحَدٍ رُوحُ الْمَسِيحِ، فَهُوَ لَا يَنْتَمِي إِلَيْهِ[b].
  rationale: تقتصر المراجعة على تصحيح التركيب العربي للشرط الثاني، وضبط الحاشية الحرفية بحيث تنقل علاقة الملكية كما في اليونانية، وتبسيط الحاشية الأولى كي لا تحوّل البديل المعجمي إلى تفسير داخل الحاشية. ولم يُحسم في المتن مرجع «إليه» بما يتجاوز غموض الأصل السياقي.
  reviewer_model: gpt-5.6-terra
