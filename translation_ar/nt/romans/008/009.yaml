review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: يحافظ على التقابل بين «في الجسد» و«في الروح»، وعلى شرط سكنى روح الله، وعلى الإشارة إلى روح المسيح والانتساب إليه. لكن تركيب الشرط الثاني في المسودة («إن كان أحد ليس له») غير سليم في العربية، والحاشية ب تنقل العبارة الحرفية على نحو معكوس للمعنى المقصود.'
  naturalness: «أمّا أنتم فلستم...» و«يسكن فيكم» فصيحتان وطبيعيتان. أما «إن كان أحد ليس له روح المسيح» فتركيب متعثر؛ والصياغة «إن لم يكن لأحد روح المسيح» عربية سليمة وواضحة.
  terminology: «الجسد»، «الروح»، «روح الله»، و«روح المسيح» اختيارات مناسبة ومحافظة على مصطلحات النص. «لا ينتمي إليه» يؤدي معنى οὐκ ἔστιν αὐτοῦ طبيعيًا، مع إبقاء مرجع الضمير غير مصرّح به في المتن.
  issues:
  - severity: medium
    issue: تركيب الشرط الثاني غير سليم عربيًا
    rationale: 'العبارة «إن كان أحد ليس له روح المسيح» تجمع «كان» مع جملة اسمية منفية على نحو غير طبيعي. الأصل اليوناني يقول: «إن كان أحد لا يملك/ليس لديه روح المسيح»، ويؤديه بوضوح: «إن لم يكن لأحد روح المسيح».'
  - severity: medium
    issue: الحاشية ب تعرض المعنى الحرفي بصورة مقلوبة
    rationale: '«فهذا ليس له» في العربية يفيد أن الشخص لا يملك شيئًا، بينما οὗτος οὐκ ἔστιν αὐτοῦ تعني حرفيًا: «هذا ليس له/ليس خاصًا به»، أي ليس للمسيح. ينبغي أن تبيّن الحاشية الملكية في الاتجاه الصحيح.'
  - severity: low
    issue: الحاشية أ تتجاوز البديل المعجمي إلى تفسير وجودي في صيغة تقريرية
    rationale: الشرح «ليس وجودكم محكومًا بالجسد» تفسير ممكن، لكنه أوسع من وظيفة حاشية البديل المعجمي وقد يضيّق دلالة العبارة. يكفي بيان البديل «الطبيعة الخاطئة» مع المحافظة على اللفظ اليوناني.
