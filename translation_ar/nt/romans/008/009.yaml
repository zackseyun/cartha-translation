  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: ar
  text: أَمَّا أَنْتُمْ فَلَسْتُمْ فِي الْجَسَدِ[a]، بَلْ فِي الرُّوحِ، إِنْ كَانَ رُوحُ اللهِ يَسْكُنُ فِيكُمْ حَقًّا. وَلَكِنْ إِنْ لَمْ يَكُنْ لِأَحَدٍ رُوحُ الْمَسِيحِ، فَهُوَ لَا يَنْتَمِي إِلَيْهِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الطبيعة الخاطئة». واليونانية: «في الجسد».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «فهذا ليس له»؛ أي ليس للمسيح. ويعود الضمير، على الأرجح، إلى المسيح المذكور قبله مباشرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: الْجَسَد
  rationale: أُبقي مصطلح بولس «الجسد» بدل استبداله بتفسير مثل «الطبيعة الخاطئة»، حفاظًا على التقابل اللاهوتي بين الوجود «في الجسد» والوجود «في الروح».
- source_word: πνεῦμα
  choice: الرُّوح / رُوح
  rationale: السياق يعرّفه بأنه «روح الله» و«روح المسيح»، ولذلك يدل على الروح القدس لا على روح الإنسان أو مجرد نزعة باطنية.
- source_word: οἰκεῖ
  choice: يَسْكُن
  rationale: ينقل معنى الإقامة المستقرة في الفعل اليوناني، وهو تعبير عربي كتابي واضح وطبيعي.
- source_word: Χριστοῦ
  choice: الْمَسِيح
  rationale: «المسيح» المقابل العربي الطبيعي للقب Χριστός، ويحفظ استعماله بوصفه لقبًا.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: لَا يَنْتَمِي إِلَيْهِ
  rationale: صياغة عربية طبيعية تؤدي معنى الملكية أو الانتساب في العبارة اليونانية؛ وأُثبتت الصيغة الحرفية في الحاشية.
- source_word: εἴπερ
  choice: إِنْ كَانَ ... حَقًّا
  rationale: يحفظ صورة الشرط مع الإيحاء التأكيدي أو الافتراضي الذي تحمله εἴπερ.
- source_word: Ὑμεῖς
  choice: أَنْتُمْ
  rationale: إثبات الضمير المنفصل ينقل توكيد الضمير الصريح في اليونانية ويبرز المقابلة.
- source_word: οὗτος
  choice: فَهُوَ
  rationale: يحفظ الإحالة المفردة المذكرة في النص اليوناني بصياغة عربية طبيعية.
theological_decisions:
- issue: التقابل بين «في الجسد» و«في الروح»
  choice: الإبقاء على لغة المجال أو حالة الوجود المرتبطة بسكنى روح الله، من غير تفسير «الجسد» بأنه الطبيعة الخاطئة داخل المتن
  alternative: تفسير التقابل بأنه بين الدوافع الخاطئة والنزعة الروحية، أو ترجمته «في الطبيعة الخاطئة» في مقابل «حياة يقودها الروح»
  rationale: النص يصف وضع المخاطَبين أو مجال وجودهم بالنظر إلى سكنى روح الله؛ والإبقاء على مصطلحي «الجسد» و«الروح» يصون فئات بولس ولا يحصرها في مذهب تفسيري أضيق.
- issue: مرجع الضمير في «إليه»
  choice: ترك الضمير كما في اليونانية، مع كون «المسيح» أقرب مرجع نحوي له
  alternative: التصريح باسم المسيح أو الله بدل الضمير
  rationale: المسيح هو الأقرب في العبارة السابقة «روح المسيح»، لكن السياق يربط أيضًا بين «روح الله» و«روح المسيح»؛ لذلك لا يُزاد في المتن ما لم يصرّح به الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا أنتم» لإظهار المقابلة والتوكيد، وحُفظت مصطلحات بولس الأساسية من غير تفكيكها بتفسير مذهبي داخل المتن.
