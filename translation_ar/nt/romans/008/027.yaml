  to: وأمّا الذي يفحص القلوب فيعرف ما هو توجّه الروح، لأنه يشفع لأجل القديسين بحسب الله[a].
  rationale: صُحِّح حرف الجر المتعلق بالشفاعة ليعبّر عن المعنى النيابي لـὑπὲρ ἁγίων، ونُقلت علامة الحاشية إلى «بحسب الله» وقُصرت الحاشية على البديل التفسيري الخاص بعبارة κατὰ θεὸν. وحُفظت بقية الصياغة، بما فيها إيجاز «بحسب الله» و«توجّه الروح»، لأنها أمينة للنص وقابلة للفهم في العربية الفصحى المعاصرة.
