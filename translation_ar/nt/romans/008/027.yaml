  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: ar
  text: وأمّا الذي يفحص القلوب فيعرف ما هو توجّه الروح، لأنه يشفع لأجل القديسين بحسب الله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفقًا لمشيئة الله».'
    reason: بديل تفسيري لعبارة κατὰ θεὸν؛ فالمعنى المرجح هو موافقة مشيئة الله، مع أن لفظ «المشيئة» غير مذكور صراحة في اليونانية.
lexical_decisions:
- source_word: ἐραυνῶν
  choice: يفحص
  rationale: ينقل معنى البحث المتعمق والفاحص، ويلائم في العربية تعبير فحص القلوب.
- source_word: τὰς καρδίας
  choice: القلوب
  rationale: يحفظ الصورة الكتابية والأنثروبولوجية في النص اليوناني بلا شرح زائد.
- source_word: τί τὸ φρόνημα
  choice: ما هو توجُّه
  rationale: تدل φρόνημα هنا على النزعة أو التوجه الذهني، لا على العقل بوصفه قدرة ذهنية مجردة؛ و«توجّه» صياغة عربية طبيعية تحفظ الصلة بسياق رومية 8.
- source_word: τοῦ πνεύματος
  choice: الروح
  rationale: السياق السابق يتحدث عن الروح القدس، ولذلك يُفهم «الروح» هنا بهذا المعنى.
- source_word: ἐντυγχάνει
  choice: يشفع
  rationale: ينقل معنى التوسّط والالتماس لأجل آخرين في سياق الصلاة.
- source_word: ὑπὲρ ἁγίων
  choice: في القديسين
  rationale: تحفظ الصياغة حرف الجر اليوناني ὑπέρ بمعناه النيابي المقصود؛ ويأتي الإيضاح العربي الطبيعي «لأجل القديسين» في الحاشية ضمن العبارة البديلة الكاملة.
- source_word: κατὰ θεὸν
  choice: بحسب الله
  rationale: يحفظ العبارة اليونانية الموجزة من دون إضافة كلمة «مشيئة» غير المذكورة صراحة.
theological_decisions:
- issue: هل تُصرَّح «مشيئة الله» في ترجمة κατὰ θεὸν؟
  choice: بحسب الله
  alternative: وفقًا لمشيئة الله
  rationale: يفيد السياق على الأرجح موافقة شفاعة الروح لمشيئة الله، لكن النص اليوناني لا يذكر «المشيئة» صراحة؛ لذا حُفظ الإيجاز والتوتر الدلالي في المتن، ووُضعت القراءة التفسيرية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «وأمّا» لإبراز المقابلة التي تحملها δέ، وحُفظت استعارة «القلوب» والعبارة اللاهوتية الموجزة «بحسب الله».
