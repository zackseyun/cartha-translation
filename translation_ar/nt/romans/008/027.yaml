    issue: ترجمة ὑπὲρ ἁγίων بـ«في القديسين»
    rationale: ὑπέρ مع المضاف إليه هنا تعني «لأجل/نيابة عن»، والسياق هو شفاعة الروح لصالح القديسين. أما «في» فتغيّر جهة الفعل ومعناه.
  - severity: medium
    issue: صياغة الحاشية تقدّم جملة كاملة بوصفها بديلًا، مع أن جزء «لأجل القديسين» ليس بديلًا تفسيريًا بل هو النقل الصحيح لـὑπὲρ ἁγίων
    rationale: 'ينبغي أن يكون موضع الحاشية بعد «بحسب الله»، وأن تبيّن البديل الخاص بـκατὰ θεὸν وحدها: «وفقًا لمشيئة الله».'
