review_pass:
  verdict: revise
  source_fidelity: 'المتن يطابق البنية الأساسية للنص اليوناني: فـ«يفحص القلوب» ينقل ἐραυνῶν τὰς καρδίας، و«توجّه الروح» ينقل φρόνημα τοῦ πνεύματος دون اختزاله إلى قدرة عقلية، و«بحسب الله» يحافظ على إيجاز κατὰ θεὸν من غير إدخال «المشيئة» في المتن. لكن «يشفع في القديسين» لا ينقل ὑπὲρ ἁγίων، التي تفيد الشفاعة لأجلهم/نيابةً عنهم، لا الشفاعة فيهم.'
  naturalness: «يشفع لأجل القديسين» فصيحة وطبيعية وواضحة في العربية المعاصرة. و«وأمّا الذي يفحص القلوب» و«ما هو توجّه الروح» سليمتان في سجل كتابي رصين.
  terminology: «القلوب»، و«الروح»، و«القديسين»، و«يشفع» مصطلحات مناسبة ومتسقة. ويجب نقل متعلَّق الشفاعة بحرف الجر «لأجل» بدل «في». كما ينبغي أن تقتصر الحاشية على البديل التفسيري لعبارة «بحسب الله»، إذ إن «لأجل القديسين» تصحيح لازم لا بديل اختياري.
  issues:
