  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: ar
  text: لِأَنَّ تَوَجُّهَ الْجَسَدِ[a] عَدَاوَةٌ لِلَّهِ، فَهُوَ لَا يَخْضَعُ لِشَرِيعَةِ اللهِ، إِذْ إِنَّهُ لَا يَسْتَطِيعُ ذَلِكَ أَيْضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الطبيعة الخاطئة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: لأنَّ
  rationale: تفيد التعليل وتربط الآية بما قبلها بوضوح وطبيعية.
- source_word: τὸ φρόνημα
  choice: توجُّه
  rationale: يدل اللفظ على نزعة الذهن واتجاهه المستقر، لا على الفكر العقلي وحده؛ و«توجّه» عربي واضح يحفظ هذا المعنى الاستعدادي.
- source_word: τῆς σαρκὸς
  choice: الجسد
  rationale: يحافظ على الصورة البولسية واللفظ المصدري بدل استبداله مباشرةً بتفسير مثل «الطبيعة الخاطئة»؛ ويُذكر المعنى التفسيري البديل في الحاشية.
- source_word: ἔχθρα εἰς θεόν
  choice: عداوةٌ لله
  rationale: يحفظ كون ἔχθρα اسمًا يدل على العداوة، ويعبّر حرف الجر عن توجّهها إلى الله؛ وهذه صياغة عربية طبيعية وموجزة.
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: لشريعة الله
  rationale: «شريعة» هي المقابل العربي الطبيعي لـ νόμος في هذا السياق، والإضافة تحفظ نسبة الشريعة إلى الله.
- source_word: οὐχ ὑποτάσσεται
  choice: لا يخضع
  rationale: ينقل معنى عدم الانقياد أو الخضوع لسلطان شريعة الله، بصياغة عربية مباشرة.
- source_word: οὐδὲ γὰρ δύναται
  choice: بل لا يستطيع ذلك
  rationale: يحفظ التصعيد إلى عدم الاستطاعة، لا مجرد الامتناع؛ و«ذلك» يبيّن أن المقصود هو الخضوع المذكور.
theological_decisions:
- issue: هل تُترجم σάρξ ترجمة لفظية أم تفسيرية؟
  choice: «الجسد» في المتن، مع بيان «الطبيعة الخاطئة» بوصفها معنى تفسيريًا محتملًا في الحاشية.
  alternative: الطبيعة الخاطئة
  rationale: السياق مجازي ويتناول التوجّه البشري المتمرد، لكن إبقاء «الجسد» يحفظ مصطلح بولس وصورته ويجنب حسم دلالته اللاهوتية داخل الترجمة.
- issue: هل تُخفَّف العبارة الأخيرة إلى عدم الرغبة أم تُحفظ دلالة العجز؟
  choice: «بل لا يستطيع ذلك».
  alternative: ولا يريد أن يخضع
  rationale: الفعل δύναται يصرّح بالقدرة والاستطاعة؛ لذلك تُحفظ دلالة العجز من غير إدخال تفسير مذهبي أوسع.
- issue: هل تُحوَّل ἔχθρα من اسم إلى صفة؟
  choice: «عداوةٌ لله».
  alternative: معادٍ لله
  rationale: يحفظ البناء الاسمي القوي في اليونانية، الذي لا يصف التوجّه بالعدائي فحسب بل يساويه بالعداوة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «توجّه» لتجنب غموض «ذهن الجسد»، وأُبقي «الجسد» في المتن حفاظًا على المصطلح البولسي، مع شرح البديل التفسيري في الحاشية. حُفظ التوازي السببي والتصعيد من عدم الخضوع إلى عدم الاستطاعة.
