  source_fidelity: المعنى الأساسي محفوظ، بما في ذلك «باكورة الروح» وإبقاء علاقتها بالروح غير محسومة، والانتظار المتشوّق، وفداء الأجساد. لكن النص اليوناني يكرر التوكيد بـ αὐτοὶ مرتين؛ والصياغة المقترحة تُظهر التوكيد الأول بوضوح، لكنها لا تحفظ الثاني عند فعل «نئنّ» على النحو الأمثل.
