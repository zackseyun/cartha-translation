  rationale: تُضيف المراجعة التوكيد الثاني («نحن أنفسنا») المتصل بفعل الأنين، وتستبدل العبارة المحتملة الالتباس الخاصة بالتبنّي بتعبير عربي واضح يحافظ على دلالة التبنّي ومنزلة الأبناء. وتُبقي الحواشي الثلاث مثبتة في مواضعها ووظائفها، من غير حسمٍ للتفسير المختلف عليه في «باكورة الروح».
