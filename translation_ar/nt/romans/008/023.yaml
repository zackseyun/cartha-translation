source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: ar
  text: وليس هذا فقط، بل نحن أنفسنا أيضًا، الذين لنا باكورة الروح[a]، نئنّ نحن أنفسنا في داخلنا، منتظرين بشوق التبنّي إلى منزلة الأبناء[b]، أي فداء أجسادنا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «الروح بصفته الباكورة».'
    reason: alternative_reading
  - marker: b
    text: 'أو ببساطة: «التبنّي». واللفظ اليوناني يتضمن، على نحو أصرح، معنى نيل منزلة الابن.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا في اليونانية: «جسدنا»؛ والمفرد هنا مستعمل استعمالًا توزيعيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: وليس هذا فقط، بل
  rationale: تنقل البنية الاستدراكية المؤكدة، وتربط الكلام طبيعيًا بما سبق.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: نحن أنفسنا أيضًا، نحن
  rationale: تحافظ قدر الإمكان على توكيد الضمائر المتكرر في اليونانية من غير أن يصبح الأسلوب العربي متكلفًا.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: باكورة الروح
  rationale: 'تحفظ صورة أول الحصاد وتُبقي إضافة «الروح» محتملة الدلالة: ما يأتي من الروح أو الروح نفسه بوصفه الباكورة.'
- source_word: ἔχοντες
  choice: الذين لنا
  rationale: تحويل اسم الفاعل إلى جملة صلة واضح وطبيعي في العربية.
- source_word: ἐν ἑαυτοῖς
  choice: في داخلنا
  rationale: يفيد موضع الأنين الباطني بعبارة عربية واضحة من دون توسع تفسيري.
- source_word: στενάζομεν
  choice: نئنّ
  rationale: يحفظ الصلة اللفظية والمعنوية بأنين الخليقة في السياق السابق.
- source_word: υἱοθεσίαν
  choice: التبنّي أبناءً
  rationale: يجمع بين مصطلح التبنّي وبين عنصر البنوّة الذكورية الظاهر في اللفظ اليوناني، مع بقاء جميع المؤمنين داخل دائرة المرجع.
- source_word: ἀπεκδεχόμενοι
  choice: ننتظر بشوق
  rationale: ينقل معنى الانتظار المتطلع المتشوق في صياغة عربية طبيعية.
- source_word: τὴν ἀπολύτρωσιν
  choice: فداء
  rationale: يحفظ المفردة اللاهوتية وسياق التحرير الأخروي.
- source_word: τοῦ σώματος ἡμῶν
  choice: أجسادنا
  rationale: استُعمل الجمع التوزيعي الطبيعي في العربية، مع التنبيه إلى مفرد النص اليوناني في الحاشية.
theological_decisions:
- issue: كيفية نقل υἱοθεσίαν مع حفظ صورة البنوّة والميراث من غير استبعاد النساء من المرجع
  choice: التبنّي أبناءً
  alternative: التبنّي
  rationale: اللفظ اليوناني يتضمن عنصر جعل الشخص ابنًا، وهو مهم لصورة الميراث عند بولس؛ والصياغة تصف المنزلة القانونية ولا تحصر الوعد في الذكور.
- issue: هل «باكورة الروح» تعني عطية من الروح أم الروح نفسه بوصفه الباكورة
  choice: باكورة الروح
  alternative: الروح بصفته الباكورة
  rationale: الإضافة اليونانية تحتمل الوجهين؛ لذلك تُرك التركيب في المتن على اتساعه، وذُكر الوجه البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ تكرار التوكيد بقدر لا يثقل العبارة، واستُعملت «باكورة» لصون صورة الحصاد، و«نئنّ» للاتساق مع أنين الخليقة في السياق. وُضعت علامات الحواشي كلها في المتن.
