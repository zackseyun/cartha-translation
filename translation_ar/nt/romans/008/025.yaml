  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: ar
  text: ولكن إن كنا نرجو ما لا نراه، فإننا ننتظره بصبرٍ ومثابرة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالمثابرة».'
