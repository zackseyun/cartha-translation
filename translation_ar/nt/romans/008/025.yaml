lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن كنا
  rationale: تحفظ أداة الشرط εἰ والقوة الاستدراكية الخفيفة في δέ، وتأتي طبيعية في سياق العربية.
- source_word: ὃ οὐ βλέπομεν
  choice: ما لا نراه
  rationale: تنقل اسم الموصول المحايد بصياغة عربية موجزة، وتحفظ النفي والفعل المضارع من غير إضافة معنى «لا نستطيع أن نراه».
- source_word: ἐλπίζομεν
  choice: نرجو
  rationale: فعل «رجا» يتعدى هنا إلى الموصول مباشرة في العربية، وينقل الرجاء المتجه إلى تحقيق مستقبلي.
- source_word: δι’ ὑπομονῆς
  choice: بثبات وصبر
  rationale: يجمع التعبير بين الصبر تحت التأخير والثبات في المشقة، وهما من الدلالات الأساسية لـὑπομονή.
- source_word: ἀπεκδεχόμεθα
  choice: ننتظره
  rationale: صياغة عربية واضحة تحفظ معنى الترقب، مع بيان دلالة الانتظار المتلهف الممكنة في الحاشية.
theological_decisions:
- issue: متعلَّق الرجاء غير المنظور
  choice: الإبقاء على العبارة العامة «ما لا نراه»
  alternative: تحديده بالخلاص أو الفداء أو القيامة
  rationale: السياق القريب يساعد على فهم المتعلَّق، لكن الآية نفسها لا تسميه؛ لذلك تُحفظ صياغتها المقصودة من غير توسيع عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بثبات وصبر» لتجنب فهم الصبر على أنه انتظار سلبي، مع إبقاء البدائل المعجمية في الحواشي. وُضعت علامتا الحاشيتين بعد العبارة التي تتصل بها دلالتا الانتظار والمثابرة.
