revisions:
- from: لأن الذين سبق فعرفهم[a] سبق أيضًا فعيّنهم أن يكونوا على صورة ابنه، ليكون هو البكر بين إخوة كثيرين[b].
  to: لأن الذين سبق فعرفهم، سبق أيضًا فعيّنهم ليكونوا مشابهين لصورة ابنه، ليكون هو البكر بين إخوة كثيرين[a].
  rationale: عُدّل التعبير الخاص بالتماثل مع صورة الابن إلى «ليكونوا مشابهين لصورة ابنه» لتمثيل συμμόρφους τῆς εἰκόνος بوضوح وطبيعية أكبر. ونُقلت علامة الحاشية الخاصة بـ«إخوة» إلى موضعها الصحيح في المتن، وجُعلت حاشية المعرفة السابقة بالعلامة b لأن العلامة a موضوعة بعد «إخوة». لا يغيّر ذلك معنى النص ولا يحسم دلالة المعرفة السابقة تفسيرًا عقائديًا.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:11Z'
