source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: ar
  text: لأن الذين سبق فعرفهم، سبق أيضًا فعيّنهم ليكونوا مشابهين لصورة ابنه، ليكون هو البكر بين إخوة كثيرين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «إخوة» مذكّر من جهة الصيغة النحوية، وقد يشمل هنا الرجال والنساء في عائلة الله.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تُدخل الأداة تعليلًا لما سبق، و«لأن» تؤدي هذه الصلة بوضوح في العربية.
- source_word: προέγνω
  choice: سبق فعرفهم
  rationale: يحفظ معنى المعرفة السابقة وصيغة الفعل من غير حسم طبيعة هذه المعرفة حسمًا عقائديًا.
- source_word: προώρισεν
  choice: سبق أيضًا فعيّنهم
  rationale: ينقل معنى التعيين السابق الكامن في الفعل، مع موازاة لفظية ظاهرة مع «سبق فعرفهم».
- source_word: συμμόρφους τῆς εἰκόνος
  choice: أن يكونوا على صورة
  rationale: تعبير عربي طبيعي يدل على التشكل وفق الصورة والمشابهة لها، من دون اختزال «الصورة» إلى مجرد شبه.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ابنه
  rationale: يحفظ لقب البنوة الصريح والمرجع المسيحاني مباشرة.
- source_word: εἰς τὸ εἶναι
  choice: ليكون
  rationale: ينقل دلالة الغاية أو النتيجة المقصودة بإيجاز طبيعي، مع إبقاء إمكان التداخل بينهما.
- source_word: πρωτότοκον
  choice: البكر
  rationale: يحفظ استعارة البكورية ودلالتها الكتابية على الأولية والمكانة، بدل استبدالها بتفسير مثل «الأسمى».
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: بين إخوة كثيرين
  rationale: ترجمة مباشرة للجمع المذكر في اليونانية، مع بيان احتمال شموله الرجال والنساء في الحاشية.
theological_decisions:
- issue: هل تُفسَّر προέγνω تفسيرًا إدراكيًا محضًا أم علائقيًا انتخابيًا؟
  choice: سبق فعرفهم
  alternative: عرفهم من قبل؛ أو أولاهم عنايته من قبل
  rationale: الصياغة المختارة تحفظ كثافة اللفظ اليوناني ولا تفرض تفسيرًا مذهبيًا لطبيعة المعرفة السابقة.
- issue: هل προώρισεν تعني التعيين السابق أم تقرير المصير بصياغة اصطلاحية؟
  choice: سبق فعيّنهم
  alternative: قدّر لهم من قبل؛ حدّدهم من قبل
  rationale: «سبق فعيّنهم» واضحة ومعاصرة وتحفظ عنصر السبق والقصد من غير إيحاء حتمي زائد لا يصرّح به اللفظ وحده.
- issue: هل εἰς τὸ εἶναι تعبّر عن الغاية أم النتيجة؟
  choice: ليكون
  alternative: حتى يكون؛ فكان من ذلك أن يكون
  rationale: التركيب اليوناني يحتمل الغاية مع إمكان ظلال النتيجة؛ و«ليكون» تنقل الوجه الأرجح دون شرح زائد.
- issue: هل يُصرَّح بشمول ἀδελφοῖς للنساء في المتن؟
  choice: إخوة كثيرين، مع حاشية توضيحية
  alternative: إخوة وأخوات كثيرين
  rationale: يُحفظ الجمع المذكر كما ورد، مع عدم حجب احتمال أن يكون المرجع شاملًا رجالًا ونساءً في عائلة الله.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على التوازي بين فعلي المعرفة السابقة والتعيين السابق، وعلى ألفاظ «الصورة» و«البكر» و«إخوة» لما لها من صدى كتابي، مع تجنب حسم الخلافات العقائدية في المتن.
