  terminology: يحافظ «الجسد» و«الروح» على المصطلحين الرئيسيين وعلى عدم حسم دلالة πνεῦμα بإضافة «القدس». و«أمور الجسد/الروح» واضح ومناسب للسجل الكتابي الحديث.
