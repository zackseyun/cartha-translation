  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: ar
  text: لِأَنَّ الَّذِينَ يَسْلُكُونَ بِحَسَبِ الْجَسَدِ يَهْتَمُّونَ بِأُمُورِ الْجَسَدِ، أَمَّا الَّذِينَ يَسْلُكُونَ بِحَسَبِ الرُّوحِ فَيَهْتَمُّونَ بِأُمُورِ الرُّوحِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: الذين يسلكون بحسب الجسد
  rationale: التعبير اليوناني يعني حرفيًا «الذين هم بحسب الجسد»، لكنه يصف توجّه الحياة ونمطها في السياق؛ فـ«يسلكون بحسب» عربية طبيعية وتحافظ على المعنى العملي من غير اختزاله في فعل منفرد.
- source_word: φρονοῦσιν
  choice: يهتمون
  rationale: يدل الفعل هنا على توجيه الفكر والاهتمام نحو شيء، لا على مجرد التفكير العابر. «يهتمون بأمور» صياغة واضحة وطبيعية تنقل هذا التوجّه.
- source_word: σάρξ
  choice: الجسد
  rationale: اختير المقابل الاصطلاحي المباشر مع إبقاء التوتر الدلالي في بولس؛ فالمقصود في السياق أوسع من الجسم المادي وحده، لكن لا ينبغي تفسيره داخل المتن بعبارة عقائدية أضيق.
- source_word: πνεῦμα
  choice: الروح
  rationale: يحافظ على المقابلة المقصودة بين الجسد والروح، وعلى إمكان فهم الإشارة إلى روح الله من السياق الأوسع.
theological_decisions:
- issue: دلالة «الروح» وهل المقصود الروح البشرية أم روح الله
  choice: الروح
  alternative: الروح القدس
  rationale: النص اليوناني يقول πνεῦμα بلا نعت هنا. والسياق يرجّح روح الله، لكن إضافة «القدس» في المتن تحسم ما تركه اللفظ نفسه للسياق.
- issue: هل تصف العبارة الهوية أم السلوك
  choice: يسلكون بحسب
  alternative: هم بحسب
  rationale: الصياغة الحرفية «هم بحسب» غير طبيعية بالعربية، بينما «يسلكون بحسب» تبيّن توجه الحياة الذي يدل عليه السياق، من غير تحويل العبارة إلى حكم على أفعال منفصلة فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حوفظ على التوازي بين شطري الآية، وعلى المصطلحين اللاهوتيين «الجسد» و«الروح» بلا شروح تفسيرية داخل المتن.
