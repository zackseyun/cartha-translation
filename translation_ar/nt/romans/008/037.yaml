  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: ar
  text: بل في هذه كلِّها ننتصر انتصارًا فائقًا بالذي أحبَّنا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نغلب غلبةً فائقة».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: المسيح على الأرجح بحسب السياق القريب.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد مقابلة قوية لما سبق من ذكر الشدائد، و«بل» عربية طبيعية تحفظ قوة الاستدراك.
- source_word: ἐν τούτοις πᾶσιν
  choice: في هذه كلِّها
  rationale: صياغة قريبة من تركيب الأصل، وتربط القول بكل الشدائد المذكورة في العدد السابق من غير تحويل حرف الجر إلى معنى سببي.
- source_word: ὑπερνικῶμεν
  choice: ننتصر انتصارًا فائقًا
  rationale: يحفظ الصيغة الفعلية في اليونانية ويعبّر عن قوة السابقة ὑπερ- التي تكثّف معنى الانتصار.
- source_word: διὰ
  choice: بالذي
  rationale: الباء هنا تعبّر طبيعيًا عن الوسيلة أو الواسطة التي تفيدها διά مع المضاف إليه.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: الذي أحبَّنا
  rationale: يحفظ التعبير الاسمي المستفاد من اسم الفاعل المعرّف، من غير أن يضيف إلى المتن اسمًا غير مصرح به.
theological_decisions:
- issue: هوية «الذي أحبَّنا»
  choice: الإبقاء على التعبير «الذي أحبَّنا» من غير تسمية في المتن
  alternative: تفسيره بالمسيح صراحةً
  rationale: يرجّح السياق القريب أن المقصود هو المسيح، ولا سيما رومية 8:35، لكن العبارة اليونانية نفسها لا تذكر الاسم؛ لذلك يُحفظ إبهامها اللفظي وتُذكر الإشارة السياقية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت صياغة فعلية لتطابق ὑπερνικῶμεν، مع تجنّب العبارة الاصطلاحية «أعظم من منتصرين» لأنها أقل طبيعية في العربية.
