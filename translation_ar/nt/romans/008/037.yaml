  terminology: «أحبّنا» ترجمة سليمة لـἀγαπήσαντος وتحفظ دلالة الفعل التام في السياق. والحاشية (ب) تذكر الترجيح السياقي للمسيح بغير تحويله إلى تحديد صريح في المتن أو فرض قراءة مذهبية.
