base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: ar
  text: لِأَنَّ الْخَلِيقَةَ تَنْتَظِرُ بِشَوْقٍ شَدِيدٍ أَنْ يُكْشَفَ أَبْنَاءُ اللهِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أولاد الله». يقول اليوناني «أبناء»، وقد يؤكد اللفظ أيضًا منزلة البنوة والإرث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لأنَّ
  rationale: تحفظ الصلة التفسيرية بما سبق، وتأتي طبيعية في العربية.
- source_word: ἀποκαραδοκία
  choice: بشوق شديد
  rationale: ينقل معنى الترقب المتلهف بصياغة عربية طبيعية مرتبطة بالفعل «تنتظر».
- source_word: κτίσεως
  choice: الخليقة
  rationale: يدل على مجموع العالم المخلوق في السياق، لا على مخلوق منفرد.
- source_word: ἀποκάλυψιν
  choice: أن يُكشَف
  rationale: صياغة فعلية طبيعية تحفظ معنى إظهار ما كان مستورًا.
- source_word: υἱῶν
  choice: أبناء
  rationale: يحفظ اللفظ اليوناني المذكر وما قد يحمله من دلالة البنوة ومكانة الورثة، مع بيان البديل في الحاشية.
- source_word: θεοῦ
  choice: الله
  rationale: 'تأتي في تركيب الإضافة العربي الطبيعي: «أبناء الله».'
- source_word: ἀπεκδέχεται
  choice: تنتظر
  rationale: يحفظ معنى الانتظار المتجه إلى المستقبل، بينما تنقل عبارة «بشوق شديد» عنصر التلهف الموجود في السياق اللفظي.
theological_decisions:
- issue: هل تُترجم υἱῶν θεοῦ بلفظ «أبناء الله» أم بلفظ أشمل مثل «أولاد الله»؟
  choice: أبناء الله
  alternative: أولاد الله
  rationale: النص اليوناني يستعمل جمعًا مذكرًا، وقد يبرز أيضًا منزلة البنوة والإرث في حجة بولس؛ وتوضح الحاشية أن المقصود يمكن أن يشمل جميع أولاد الله.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت صياغة فعلية طبيعية بدل النقل الحرفي للتركيب الاسمي اليوناني، مع إبقاء قوة الترقب وصيغة «أبناء» وإثبات علامة الحاشية في المتن.
