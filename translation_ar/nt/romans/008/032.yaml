source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: ar
  text: هو لم يُشفِق على ابنه بالذات، بل أسلمه[b] من أجلنا جميعًا[a]؛ فكيف لا يهبنا أيضًا معه كلَّ شيء بنعمته[c]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نيابةً عنا جميعًا».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «سلَّمه».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يجود علينا بكل شيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: هو
  rationale: يعود الضمير على الله في السياق السابق. وجاء مستقلًّا في صدر الجملة ليحمل نبرة التوكيد التي تؤديها γε من غير إضافة لفظ ثقيل.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: ابنه نفسه
  rationale: يحفظ «نفسه» قوة ἰδίου في تأكيد خصوصية العلاقة، بصياغة عربية طبيعية، مع كتابة «ابن» وفق قواعد العربية المعتادة.
- source_word: οὐκ ἐφείσατο
  choice: لم يُشفِق على
  rationale: ينقل معنى عدم تجنيب الابن الألم والموت، ويحافظ على الصدى الكتابي، من غير تخفيف الفعل إلى مجرد عدم المنع.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: من أجلنا جميعًا
  rationale: تعبير عربي واضح يحتمل معنى العمل لمصلحتنا أو نيابة عنا، من غير حصر العبارة في صياغة كفارية اصطلاحية أضيق من اليونانية.
- source_word: παρέδωκεν αὐτόν
  choice: أسلمه
  rationale: يدل على تسليمه إلى المعاناة والموت، وهو موجز وقوي ومألوف في العربية الكتابية المعاصرة.
- source_word: πῶς οὐχὶ καὶ
  choice: فكيف لا ... أيضًا
  rationale: يحفظ بنية السؤال البلاغي والاستدلال من العطية العظمى إلى ما يصحبها.
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: ينقل معنى المصاحبة مباشرة من غير توسيع تفسيري.
- source_word: τὰ πάντα
  choice: كلَّ شيء
  rationale: يحفظ شمول التعبير اليوناني، ويترك للسياق تحديد مداه بدل تقييده تفسيرًا.
- source_word: ἡμῖν χαρίσεται
  choice: يهبنا ... بنعمته
  rationale: يجمع «يهب» مع «بنعمته» لإظهار دلالة العطاء المجاني المتفضل بها في χαρίσεται، مع الحفاظ على اتجاه العطية إلينا.
theological_decisions:
- issue: هل تُصاغ ὑπὲρ ἡμῶν πάντων بما يحدد النيابة تحديدًا اصطلاحيًا؟
  choice: من أجلنا جميعًا
  alternative: نيابةً عنا جميعًا
  rationale: تثبت العبارة أن التسليم كان لمصلحتنا، وتسمح بدلالة النيابة، لكنها لا تحسم وحدها كيفية فهمها الكفاري بتعبير تقني أضيق.
- issue: مدى «كل شيء» في τὰ πάντα
  choice: كلَّ شيء
  alternative: كلَّ ما نحتاج إليه
  rationale: أُبقي التعبير واسعًا كما في الأصل، ولم يُقيد بالمنافع الروحية أو الاحتياجات الزمنية؛ فالسياق هو الذي يضبط مداه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ السؤال البلاغي، وتُرك شمول «كل شيء» ودلالة «من أجلنا» منفتحين بحسب الأصل والسياق، من غير إدخال مصطلحات مذهبية.
