  terminology: «الجسد» ترجمة مناسبة ومحافظة لـσάρξ وσῶμα، مع إبقاء التمييز السياقي بينهما دون تفسير مذهبي في المتن. و«بالروح» تحافظ على عدم إضافة «القدس» حيث لا ترد صراحة، مع أن السياق يرجّح روح الله. و«تميتون» مناسبة وقوية لـθανατοῦτε.
