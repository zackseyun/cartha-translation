  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: ar
  text: فَإِنْ كُنْتُمْ تَحْيَوْنَ بِحَسَبِ الْجَسَدِ[a]، فَسَتَمُوتُونَ؛ وَلَكِنْ إِنْ كُنْتُمْ بِالرُّوحِ تُمِيتُونَ أَعْمَالَ الْجَسَدِ، فَسَتَحْيَوْنَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «بحسب الجسد». ويشير «الجسد» هنا، في سياق المقابلة مع الروح، إلى نمط حياة تحكمه الرغبات البشرية.'
    reason: توضيح الدلالة السياقية مع الحفاظ على اللفظ اليوناني المجازي في المتن.
lexical_decisions:
- source_word: γὰρ
  choice: فَإِنْ
  rationale: تنقل الفاء صلة التعليل بما سبق، وتأتي «إن» جوابًا طبيعيًا لبنية الشرط اليونانية.
- source_word: κατὰ σάρκα
  choice: بِحَسَبِ الْجَسَدِ
  rationale: يحافظ على صورة σάρξ وعلى معنى κατά، من غير أن يحسم دلالتها الأخلاقية بتفسير مثل «الطبيعة الخاطئة» داخل المتن.
- source_word: ζῆτε
  choice: تَحْيَوْنَ
  rationale: مضارع عربي مباشر يلائم المضارع اليوناني في الجملة الشرطية.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: مُزْمِعُونَ أَنْ تَمُوتُوا
  rationale: ينقل معنى μέλλω مع المصدر، بما فيه من توقّع أو اقتراب، من غير تحويله إلى مجرد مستقبل محايد.
- source_word: πνεύματι
  choice: بِالرُّوحِ
  rationale: الباء تنقل الدلالة الآلية للأداة، والسياق في رومية 8 يرجّح أن المقصود روح الله.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: أَعْمَالَ الْجَسَدِ
  rationale: «أعمال» تعبير عربي واضح يحفظ المعنى الأخلاقي العملي لـ πράξεις، مع إبقاء إضافة «الجسد» صريحة.
- source_word: θανατοῦτε
  choice: تُمِيتُونَ
  rationale: فعل مباشر يحفظ صورة إيقاع الأعمال في الموت وقوة التعبير اليوناني.
- source_word: ζήσεσθε
  choice: فَسَتَحْيَوْنَ
  rationale: ينقل المستقبل اليوناني بوضوح، والفاء تلائم جواب الشرط في العربية.
theological_decisions:
- issue: 'مرجع πνεύματι: الروح القدس أم روح الإنسان'
  choice: الرُّوح، مع فهمه في السياق على أنه روح الله
  alternative: روح الإنسان، أو إبقاء اللفظ مبهمًا تمامًا
  rationale: تكرار الإشارات إلى روح الله في رومية 8 يرجّح الروح القدس بوصفه العامل الذي به تُميت الجماعة أعمال الجسد؛ ومع ذلك لا تُضاف كلمة «القدس» لأنها غير موجودة صراحة في هذه العبارة.
- issue: الدلالة الأخلاقية لـ σάρξ
  choice: الجسد، مع حاشية توضح الدلالة السياقية
  alternative: الطبيعة الخاطئة
  rationale: يحفظ اللفظ صورة بولس والتوتر بين «الجسد» و«الروح»، ويتجنب إدخال تفسير أنثروبولوجي محدد في صلب النص.
- issue: طبيعة الموت والحياة في الشرطين
  choice: إبقاء «تموتوا» و«ستحيون» بلا تقييد
  alternative: تحديدهما بالموت والحياة الأبديين أو الجسديين
  rationale: الآية نفسها لا تضيف هذا التحديد، ولذلك يُترك اتساع التعبير ليحدده السياق.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة. استُخدمت «مزمعون» لأنها أدق من المستقبل البسيط في نقل μέλλετε، مع بقائها مفهومة في الأسلوب الكتابي العربي. وحُفظ التوازي بين «الجسد» و«الروح» وبين «تموتوا» و«ستحيون».
