  rationale: يقتصر التعديل على استبدال «فأنتم مزمعون أن تموتوا» بـ«فستموتون»، لأن الصياغة الجديدة تنقل النتيجة المستقبلية المؤكدة في الشرط من غير إيهام بأن المخاطبين يعزمون بأنفسهم على الموت. ونُقّحت الحاشية لتجنب الوصف التفسيري الزائد «الإنسان الساقط» مع الإبقاء على بيان المقابلة الأخلاقية السياقية.
