  register: عربية فصحى معاصرة واضحة وموقرة. حافظت الصياغة على البناء التقابلي «جميع الذين... أولئك هم»، وعلى التوتر الدلالي بين اللفظ اليوناني المذكر وشموله السياقي، مع تجنب الصياغة الطائفية أو التفسير الزائد.
