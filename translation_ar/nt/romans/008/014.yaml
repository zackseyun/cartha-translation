  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: ar
  text: فإن كلَّ الذين يقودهم روحُ الله هم أبناءُ الله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن ترجمتها: «أولاد الله». واللفظة اليونانية تعني حرفيًا «أبناء»، وتشمل هنا المؤمنين والمؤمنات، وتحمل في السياق إيحاء التبنّي والميراث.'
    reason: بديل معجمي وبيان الشمول الدلالي
lexical_decisions:
- source_word: ὅσοι
  choice: جميع الذين
  rationale: تؤدي معنى الفئة الشاملة في التركيب اليوناني، بصياغة عربية واضحة وطبيعية.
- source_word: γὰρ
  choice: فإن
  rationale: تحافظ على الصلة التفسيرية بما سبق، وتناسب استئناف التعليل في العربية.
- source_word: πνεύματι θεοῦ
  choice: بروح الله
  rationale: تفهم الداتيف هنا على معنى الوسيلة أو الفاعلية مع الفعل المبني للمجهول، وتحافظ على تركيب «روح الله».
- source_word: ἄγονται
  choice: ينقادون
  rationale: تنقل معنى المضارع المبني للمجهول والدلالة المستمرة دون إضافة تفسير إلى النص.
- source_word: οὗτοι
  choice: أولئك هم
  rationale: تحافظ على توكيد اسم الإشارة في التركيب التقابلي اليوناني، مع تعبير عربي فصيح.
- source_word: υἱοί
  choice: أبناء
  rationale: تحافظ على اللفظ اليوناني المذكر وعلى إيحاء التبنّي والميراث في سياق رومية 8، مع بيان شموله للمؤمنين والمؤمنات في الحاشية.
- source_word: θεοῦ
  choice: الله
  rationale: ترجمة مباشرة للمضاف إليه في الموضعين، مع إبقاء تكرار الإضافة إلى الله في الآية.
theological_decisions:
- issue: هل تترجم عبارة υἱοί θεοῦ بلفظ «أبناء الله» أم بعبارة أشمل صراحة؟
  choice: أبناء الله
  alternative: أولاد الله؛ أو أبناء الله وبناته
  rationale: النص اليوناني يستعمل جمع «ابن» المذكر، كما أن سياق التبنّي والميراث يمنح اللفظ دلالة مهمة. أبقيت «أبناء» في المتن، وأوضحت في الحاشية أن المقصود يشمل المؤمنين والمؤمنات، دون إدخال التوسيع التفسيري «وبناته» في نص الآية.
