  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: ar
  text: لِأَنَّنَا فِي الرَّجَاءِ خُلِّصْنَا[a]. أَمَّا الرَّجَاءُ الَّذِي يُرَى فَلَيْسَ رَجَاءً[b]، فَمَنْ يَرْجُو مَا يَرَاهُ؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِأَنَّنَا بِالرَّجَاءِ خُلِّصْنَا».'
    reason: alternative_reading
