  to: لِأَنَّنَا فِي الرَّجَاءِ خُلِّصْنَا[a]. أَمَّا الرَّجَاءُ الَّذِي يُرَى فَلَيْسَ رَجَاءً[b]، فَمَنْ يَرْجُو مَا يَرَاهُ؟
  rationale: أُبقيت دلالة «في الرجاء» في المتن، بوصفها قراءة ملائمة لداتيف τῇ ἐλπίδι في سياق الرجاء غير المنظور، مع إتاحة «بالرجاء» في الحاشية دون فرض تفسير سببي أو طائفي. واستُبدل الفعل بصيغة المبني للمجهول، وأعيد السؤال الختامي إلى بنيته الدالة على «مَن» كما في اليونانية. الحواشي وعلاماتها محفوظة ومتطابقة.
