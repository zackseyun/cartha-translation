    text: أي إن الرجاء يتعلّق بما لم يُرَ بعد.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: فِي الرَّجَاءِ
  rationale: يحمل الداتيف هنا على معنى المجال أو الحال، فيصون التوتر بين الخلاص الحاضر واكتماله الذي ما زال موضوع رجاء، من غير جعل الرجاء علة الخلاص الفاعلة.
- source_word: ἐσώθημεν
  choice: خَلَصْنَا
  rationale: صيغة ماضٍ مبني للمجهول في اليونانية؛ والتعبير العربي «خلصنا» يؤدي معنى نوال الخلاص بإيجاز طبيعي، مع بقاء الفاعل الإلهي مفهومًا من السياق دون تسميته.
- source_word: ἐλπὶς ... βλεπομένη
  choice: الرَّجَاءُ الَّذِي يُرَى
  rationale: تُرجمت صيغة اسم المفعول بجملة صلة عربية طبيعية، مع الحفاظ على المقابلة المباشرة بين الرجاء والرؤية.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: فَلَيْسَ رَجَاءً
  rationale: يحافظ هذا التعبير على الحكم النوعي الموجز في اليونانية، ويأتي فصيحًا وطبيعيًا في العربية المعاصرة.
- source_word: ὃ ... βλέπει
  choice: مَنْ يَرَى شَيْئًا
  rationale: أُظهر مفعول الرؤية المحايد بكلمة «شيئًا» لتستقيم العربية، دون تخصيص ماهية الشيء المرئي.
- source_word: τίς ἐλπίζει
  choice: فَلِمَاذَا يَرْجُوهُ؟
  rationale: 'ينقل السؤال الإنكاري بصورة عربية واضحة، ويحافظ على المعنى العام: المرئي الحاضر لا يبقى موضوعًا للرجاء.'
theological_decisions:
- issue: علاقة الخلاص بالرجاء في τῇ ἐλπίδι ἐσώθημεν
  choice: «فِي الرَّجَاءِ خَلَصْنَا» بما يدل على المجال أو الحال
  alternative: «بِالرَّجَاءِ خَلَصْنَا» بما قد يُفهم على معنى الوسيلة
  rationale: السياق يتناول واقع الخلاص الحاضر مع انتظار اكتماله غير المنظور. لذلك تحفظ «في الرجاء» هذا التوتر الأخروي، ولا توحي بأن الرجاء هو العلة الفاعلة للخلاص.
- issue: دلالة الرجاء الذي يُرى
  choice: الإبقاء على العبارة المفارِقة «الرَّجَاءُ الَّذِي يُرَى»
  alternative: تفسيرها داخل المتن بأنها «الرجاء في شيء صار منظورًا»
  rationale: يحافظ النص المختار على الإيجاز والتوتر البلاغي في الأصل، بينما يرد الإيضاح في الحاشية دون توسيع المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «أما» لإبراز الانتقال التقابلي، وصيغ السؤال الأخير بأسلوب إنكاري طبيعي. جميع علامات الحواشي مثبتة في المتن.
