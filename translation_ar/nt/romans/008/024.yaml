  terminology: «الرجاء» و«خُلِّصنا» مناسبان للسياق اللاهوتي، مع إبقاء «في الرجاء» في المتن وعدم تقرير أن الرجاء هو وسيلة الخلاص. تُصاغ القراءة البديلة في الحاشية بالمبني للمجهول كذلك.
