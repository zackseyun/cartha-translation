  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: ar
  text: لكي يُستوفى فينا المطلب العادل للشريعة، نحن الذين لا نسلك بحسب الجسد[a]، بل بحسب الروح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'لا يُراد بـ«الجسد» هنا الجسم المادي وحده، بل الإنسان في ضعفه وميوله حين تكون حياته بعيدة عن الله؛ ويترجمه بعضهم: «الطبيعة الخاطئة».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم أيضًا: «الروح» بمعنى أعم؛ لكن السياق في رومية 8 يرجح أن المقصود هو الروح القدس.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة في العبارة اليونانية بصياغة عربية طبيعية.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: المطلب العادل للشريعة
  rationale: تنقل البعد الإلزامي في δικαίωμα مع وصفه بالعدل، وتتجنب حصره في فريضة منفردة.
- source_word: πληρωθῇ
  choice: يُتمَّ
  rationale: تحفظ المبني للمجهول وصيغة الغاية، وتؤدي معنى بلوغ مطلب الشريعة تمامه.
- source_word: ἐν ἡμῖν
  choice: فينا
  rationale: هي المقابل المباشر للتركيب اليوناني، ولا تستبدله بـ«بواسطتنا» فتفرض فاعلية بشرية لا يصرح بها النص.
- source_word: περιπατοῦσιν
  choice: نسلك
  rationale: تحفظ استعارة السير المألوفة كتابيًا للدلالة على نهج الحياة، وهي طبيعية في العربية الفصيحة.
- source_word: σάρξ
  choice: الجسد
  rationale: يحفظ اللفظ البولسي وصورته بدل تفسيره في المتن بـ«الطبيعة الخاطئة»؛ وتوضح الحاشية دلالته السياقية.
- source_word: πνεῦμα
  choice: الروح
  rationale: السياق في رومية 8 يرجح الإشارة إلى الروح القدس، مع بقاء الرسم العربي نفسه صالحًا لغويًا لقراءة «الروح» بمعنى أعم.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: بحسب الجسد ... بحسب الروح
  rationale: صياغة شفافة تحفظ التوازي والتقابل المتكرر عند بولس.
theological_decisions:
- issue: هل πνεῦμα هو الروح القدس أم الروح البشرية؟
  choice: الروح، والمقصود على الأرجح الروح القدس
  alternative: الروح البشرية أو الروح بمعنى أعم
  rationale: سياق رومية 8 يركز بقوة على عمل روح الله ومجاله، لكن اللفظة اليونانية في ذاتها لا تحسم المرجع خارج السياق، لذلك ذُكر الاحتمال في الحاشية.
- issue: هل ἐν ἡμῖν يعني الإتمام فينا أم بواسطتنا؟
  choice: فينا
  alternative: بواسطتنا؛ أو بيننا
  rationale: يحفظ حرف الجر ἐν ولا يبالغ في تحديد الفاعلية البشرية، مع إبقاء البعد التحويلي ممكنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت استعارة «السلوك» والتوازي «بحسب الجسد... بحسب الروح». اختير «المطلب العادل» لتوضيح القوة القانونية والأخلاقية لـδικαίωμα من غير إثقال الأسلوب أو حصر المعنى في وصية واحدة.
