id: ROM.8.21
reference: Romans 8:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: ar
  text: لأن الخليقة نفسها أيضًا ستُحرَّر من عبودية الفساد إلى حرية مجد أولاد الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تُفهم هنا سببية، إذ تبيّن أساس الرجاء المذكور في السياق السابق.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: الخليقة نفسها أيضًا
  rationale: يحفظ «أيضًا» القوة الإضافية لـ καὶ، وتحفظ «نفسها» توكيد αὐτὴ، بينما تشير «الخليقة» هنا إلى العالم المخلوق في مجموعه.
- source_word: ἐλευθερωθήσεται
  choice: ستُحرَّر
  rationale: صيغة المستقبل المبني للمجهول تدل على تحرير آتٍ يقع على الخليقة، وهذه الصياغة العربية واضحة وتحفظ المبني للمجهول.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: من عبودية الفساد
  rationale: «عبودية» تحفظ قوة الاستعارة، و«الفساد» يشمل هنا الانحلال والفناء اللذين تخضع لهما الخليقة دون حصر اللفظ في الفساد الأخلاقي.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: إلى حرية
  rationale: تحفظ «إلى» معنى الانتقال إلى حالة جديدة الذي تؤديه εἰς.
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: مجد أولاد الله
  rationale: تحفظ الصياغة سلسلة الإضافة اليونانية دون تحويل «المجد» إلى صفة تفسيرية، و«أولاد الله» تعكس τέκνα بوصفها لفظًا جامعًا لا يقتصر على الذكور.
theological_decisions:
- issue: كيفية نقل سلسلة الإضافة τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: حرية مجد أولاد الله
  alternative: الحرية المجيدة التي لأولاد الله
  rationale: تحافظ الصياغة المختارة على العلاقة النحوية المفتوحة بين الحرية والمجد وأولاد الله، بدل حسمها بتحويل «المجد» إلى صفة للحرية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ورصينة. استُخدمت «الخليقة» للمجموع المخلوق، و«أولاد الله» للحفاظ على الدلالة العائلية الجامعة. لا توجد علامة حاشية لأن النص المختار ينقل البنية الحرفية المقصودة مباشرة، فلا حاجة إلى بديل في الهامش.
