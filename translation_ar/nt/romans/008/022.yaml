  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: ar
  text: فنحن نعلم أن الخليقة كلها تئن معًا وتعاني آلام المخاض معًا إلى الآن[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الخليقة بأسرها» أو «كل الخليقة»؛ ويحتمل اللفظ «كل مخلوق»، لكن المعنى الكوني الأوسع أرجح في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: يشير تعبير «تعاني آلام المخاض معًا» إلى أوجاع الولادة، فيوحي لا بالألم وحده بل بألم يتجه نحو حياة جديدة.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: نعلم
  rationale: الفعل οἶδα تامّ في صيغته لكنه يُستعمل عادةً بمعنى حاضر، وهنا يدل على معرفة مشتركة مستقرة.
- source_word: γὰρ
  choice: فـ
  rationale: تحفظ الفاء وظيفة الأداة التفسيرية التي تصل الآية بالحجة السابقة، في صياغة عربية طبيعية.
- source_word: πᾶσα ἡ κτίσις
  choice: الخليقة كلها
  rationale: وجود أداة التعريف مع πᾶσα يرجّح المعنى الجمعي الشامل، أي الخليقة بأسرها، لا المعنى التوزيعي «كل مخلوق».
- source_word: συστενάζει
  choice: تئن معًا
  rationale: يحفظ التعبير معنى الأنين المشترك ودلالة السابقة συν-، مع تجسيد الخليقة بصيغة مفهومة وطبيعية.
- source_word: συνωδίνει
  choice: تعاني آلام المخاض معًا
  rationale: ينقل صورة أوجاع الولادة تحديدًا، لا مجرد الألم العام، ويحفظ أيضًا معنى المشاركة في السابقة συν-.
- source_word: ἄχρι τοῦ νῦν
  choice: إلى الآن
  rationale: تعبير عربي واضح يحفظ امتداد الحالة حتى الزمن الحاضر.
theological_decisions:
- issue: هل تُفهم κτίσις بمعنى «الخليقة» أم «كل مخلوق»؟
  choice: الخليقة
  alternative: كل مخلوق / جميع المخلوقات
  rationale: سياق رومية 8:19–23 يصوّر النظام المخلوق غير البشري في نطاق كوني وهو خاضع للبُطل ومنتظر التحرير؛ و«الخليقة» تحفظ هذا الاتساع من غير حصر المعنى في مخلوقات منفردة.
- issue: هل صورة المخاض مجرد تعبير عن الألم أم تحمل إيحاء الولادة؟
  choice: تعاني آلام المخاض
  alternative: تتألم
  rationale: الفعل συνωδίνει يذكر أوجاع الولادة صراحةً، ولذلك ينبغي إبقاء الصورة بما فيها من ألم متجه نحو ولادة، من غير تحويل الإيحاء إلى تصريح تفسيري داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «الخليقة» للمجال المخلوق في مجموعه، و«آلام المخاض» لإبقاء صورة الولادة، مع تكرار «معًا» حفاظًا على البعد المشترك في الفعلين اليونانيين.
