source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: ar
  text: وإن كان روحُ الذي أقام يسوع من بين الأموات ساكنًا فيكم، فالذي أقام المسيحَ يسوع من بين الأموات سيُحيي أيضًا أجسادكم الفانية بسبب روحه الساكن فيكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بواسطة روحه الساكن فيكم».'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: روح
  rationale: يشير السياق في الموضعين إلى روح الله؛ وتحافظ «روح» على الدلالة الشخصية واللاهوتية من غير إضافة تفسيرية إلى المتن.
- source_word: ἐγείραντος / ἐγείρας
  choice: أقام
  rationale: «أقام من بين الأموات» تعبير عربي طبيعي ودقيق للدلالة على القيامة الجسدية.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل حرف الجر وصيغة الجمع بوضوح، ويعبّر طبيعيًا عن الإقامة من جماعة الأموات.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: ساكنًا / الساكن
  rationale: يحافظ هذا الاختيار على الصلة المعجمية بين الفعلين وعلى معنى الحلول والإقامة المستمرة.
- source_word: Χριστὸν Ἰησοῦν
  choice: المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ قوة اللقب بدل معاملته كاسم عائلة.
- source_word: ζῳοποιήσει
  choice: سيُحيي
  rationale: فعل عربي موجز وطبيعي يحفظ صيغة المستقبل ومعنى منح الحياة.
- source_word: θνητὰ σώματα
  choice: أجسادكم المائتة
  rationale: ينقل وصف الأجساد بأنها خاضعة للموت، مع الحفاظ على concreteness الإشارة إلى الجسد.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: بسبب روحه الساكن فيكم
  rationale: تُفهم διά مع صيغة النصب في النص المطبوع فهمًا سببيًا على نحو مباشر، لذلك جاء المتن بـ«بسبب».
theological_decisions:
- issue: 'دلالة διά في العبارة الختامية: سببية أم وسيلية'
  choice: بسبب روحه الساكن فيكم
  alternative: بواسطة روحه الساكن فيكم
  rationale: يتبع المتن قراءة SBLGNT المقدمة، حيث تأتي διά مع صيغة النصب، وهي تؤيد المعنى السببي. ويُذكر المعنى الوسيلي في الحاشية لأنه معروف نصيًا وترجميًا، من غير طمس موضع الاختلاف.
translation_notes:
  register: العربية فصحى معاصرة واضحة ومهيبة. استُخدم «المسيح يسوع» بوصف «المسيح» لقبًا، وحوفظ على التوازي بين «ساكنًا» و«الساكن». وُضعت علامة الحاشية مباشرة بعد العبارة التي تتعلق بها.
