- from: وإن كان روحُ الذي أقام يسوع من بين الأموات ساكنًا فيكم، فالذي أقام المسيحَ يسوع من بين الأموات سيُحيي أيضًا أجسادكم المائتة بسبب روحه الساكن فيكم.[a]
  to: وإن كان روحُ الذي أقام يسوع من بين الأموات ساكنًا فيكم، فالذي أقام المسيحَ يسوع من بين الأموات سيُحيي أيضًا أجسادكم الفانية بسبب روحه الساكن فيكم.[a]
  rationale: أُبقي المعنى السببي في المتن، التزامًا بصيغة διά مع النصب في نص SBLGNT، وصُححت الحاشية لتعرض البديل بوصفه خيارًا ترجميًا لا اختلافًا مخطوطيًا. كما استُبدلت «المائتة» بـ«الفانية» لتأدية θνητά بدقة من غير الإيحاء بأن الأجساد قد ماتت بالفعل.
