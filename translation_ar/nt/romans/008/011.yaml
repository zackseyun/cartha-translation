review_pass:
  verdict: revise
  source_fidelity: 'يحافظ المتن على بنية اليونانية ومعناها: روح الذي أقام يسوع، ثم الذي أقام المسيح يسوع، ووعد إحياء الأجساد. وترجمة διά مع النصب بـ«بسبب» مناسبة للنص المطبوع في SBLGNT وتحفظ القوة السببية.'
  naturalness: الصياغة عربية فصحى واضحة وطبيعية. لكن «أجسادكم المائتة» قد تُفهم على أنها أجساد ماتت بالفعل، في حين أن θνητά تصف الأجساد بأنها فانية/خاضعة للموت؛ لذا «أجسادكم الفانية» أدق وأيسر.
  terminology: «روح»، و«أقام ... من بين الأموات»، و«المسيح يسوع»، و«سيحيي» اختيارات سليمة ومستقرة. الحاشية الحالية غير دقيقة لأنها تنسب «بواسطة» إلى مخطوطات أخرى، مع أنها بديل ترجمي/تفسيري للقوة النحوية لا قراءة مخطوطية مغايرة في النص المقدم.
  issues:
  - severity: medium
    issue: وصف البديل في الحاشية بأنه قراءة «مخطوطات أخرى».
    rationale: لا يعرض النص اليوناني المقدم اختلافًا مخطوطيًا هنا؛ والبديل «بواسطة» يمثل إمكانًا ترجميًا لـδιά، لا قراءة نصية أخرى.
  - severity: low
    issue: «أجسادكم المائتة» أضيق من θνητὰ وقد توحي بأجساد ميتة بالفعل.
    rationale: «الفانية» تنقل وصف القابلية للموت/الموتية بصورة أدق في العربية المعاصرة.
  revised_text: وإن كان روحُ الذي أقام يسوع من بين الأموات ساكنًا فيكم، فالذي أقام المسيحَ يسوع من بين الأموات سيُحيي أيضًا أجسادكم الفانية بسبب روحه الساكن فيكم.[a]
