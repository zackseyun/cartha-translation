lexical_decisions:
- source_word: Οὐδὲν
  choice: لا
  rationale: جاءت مع «إدانة» لتؤدي النفي القاطع في اليونانية بصياغة عربية طبيعية.
- source_word: ἄρα
  choice: فـ
  rationale: تفيد النتيجة والاستنتاج مما سبق، وتربط الآية بسياق الحجة ربطًا عربيًا طبيعيًا.
- source_word: νῦν
  choice: الآن
  rationale: أُثبت الظرف صراحة لأنه يشير إلى الواقع الحاضر الناتج عما صنعه الله في المسيح.
- source_word: κατάκριμα
  choice: إدانة
  rationale: 'تحافظ على الدلالة القضائية: الحكم بالإدانة، لا مجرد الشعور بالذنب.'
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: على الذين هم في المسيح يسوع
  rationale: «على» تلائم «إدانة» في العربية، بينما يُبقي «في» تعبير بولس عن الارتباط بالمسيح والاشتراك فيه دون اختزاله إلى تفسير واحد.
- source_word: Χριστῷ
  choice: المسيح
  rationale: ترجمة للقب اليوناني بمعناه المعروف في العربية، لا معاملته كلقب عائلي مجرد.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم اليوناني.
theological_decisions:
- issue: معنى العبارة «في المسيح يسوع»
  choice: الإبقاء على «في» بوصفها عبارة تحدد المنتمين إلى المسيح والمتحدين به.
  alternative: صياغتها بمعنى سببي أضيق مثل «بسبب المسيح يسوع».
  rationale: الاستعمال البولسي هنا غني بدلالة المشاركة والاتحاد؛ لذلك لا ينبغي حصره في تفسير سببي واحد.
- issue: القراءة النصية الأطول في بعض المخطوطات المتأخرة
  choice: 'اعتماد النص الأقصر: «فلا إدانة الآن على الذين هم في المسيح يسوع».'
  alternative: إضافة «الذين لا يسلكون حسب الجسد».
  rationale: النص المعطى في SBLGNT والشواهد اليونانية الأقدم يؤيدان القراءة الأقصر، مع توثيق البديل في الحاشية.
