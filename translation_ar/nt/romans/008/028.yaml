  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: ar
  text: ونحن نعلم أن كلَّ الأشياء تعمل معًا للخير[a] لأجل الذين يحبّون الله، الذين هم مدعوّون بحسب القصد[b].
  philosophy: optimal-equivalence
  footnotes:
