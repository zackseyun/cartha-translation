    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: نعلم
  rationale: مضارع عربي طبيعي يعبّر عن معرفة ثابتة حاضرة، من غير تحويلها إلى إدراك عابر.
- source_word: δὲ
  choice: و
  rationale: أداة وصل خفيفة تواصل سياق الحجة من غير إقحام معنى استدراكي قوي.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: للذين يحبّون الله
  rationale: تحافظ اللام على دلالة المجرور اليوناني وتحدّد الفئة التي يعود إليها الخير.
- source_word: πάντα
  choice: كلَّ الأشياء
  rationale: يحفظ التعبير صراحةً شمول صيغة الجمع المحايد، ولا يضيّق مداها.
- source_word: συνεργεῖ
  choice: تعمل معًا
  rationale: توافق «كل الأشياء» في العربية، وتحافظ على معنى التآزر من غير إدخال «الله» فاعلًا صريحًا في النص الرئيس.
- source_word: εἰς ἀγαθόν
  choice: للخير
  rationale: صياغة عربية موجزة وطبيعية تفيد الغاية أو النتيجة التي تتجه إليها الأشياء.
- source_word: κλητοῖς οὖσιν
  choice: وهم المدعوون
  rationale: تحفظ الوصف الاسمي والربط بين محبّي الله والمدعوّين، مع صياغة عربية واضحة.
- source_word: κατὰ πρόθεσιν
  choice: بحسب القصد
  rationale: تنقل العبارة كما وردت بلا إضافة ضمير ملكية غير مصرّح به، مع إبقاء الإحالة السياقية مفتوحة.
- source_word: πρόθεσιν
  choice: القصد
  rationale: «القصد» يدل على الغاية والتدبير المقصودين، وهو واضح وموجز في هذا السياق.
theological_decisions:
- issue: فاعل συνεργεῖ الضمني أو الصريح
  choice: 'جعل «كل الأشياء» فاعلًا في النص الرئيس: «كل الأشياء تعمل معًا للخير».'
  alternative: «الله يجعل كل الأشياء تعمل معًا للخير».
  rationale: نص SBLGNT المعطى لا يذكر θεός فاعلًا صريحًا في هذه الجملة؛ لذلك لا يُضاف إلى المتن، مع إثبات القراءة النصية الأخرى في الحاشية.
- issue: إضافة ضمير ملكية إلى πρόθεσιν
  choice: «بحسب القصد» من غير إضافة «قصده».
  alternative: «بحسب قصده».
  rationale: السياق يرجّح أن القصد هو قصد الله، لكن العبارة اليونانية لا تتضمن ضمير ملكية صريحًا؛ لذا يُحفظ ذلك في المتن ويُذكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «تعمل معًا» بدل تعبير اصطلاحي أثقل، وحُفظ تكرار تحديد الجماعة في اليونانية بصيغة «وهم المدعوون» لتكون العبارة طبيعية ومفهومة.
