  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: ar
  text: مَن سيفصلنا عن محبة المسيح؟ أشِدّةٌ أم ضيقٌ أم اضطهادٌ أم مجاعةٌ أم عُريٌ أم خطرٌ أم سيفٌ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن محبتنا للمسيح». تحتمل الإضافة في اليونانية هذا المعنى، لكن السياق يرجّح أن المقصود هو محبة المسيح لنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: مَن
  rationale: اسم استفهام للعاقل، وهو الأنسب مع سؤال بولس البلاغي، مع أن ما يليه يسرد شدائد لا أشخاصًا.
- source_word: χωρίσει
  choice: سيفصلنا
  rationale: 'ينقل الفعل في صيغة المستقبل ومعناه المباشر: إحداث الانفصال.'
- source_word: ἀγάπης
  choice: محبة
  rationale: المقابل العربي الطبيعي والدقيق لـἀγάπη في هذا السياق.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: حُفظ لقب Χριστός بلفظ «المسيح»، وجاء التركيب «محبة المسيح» موافقًا لإضافة الأصل اليوناني مع إبقاء احتمال جهة الإضافة في الحاشية.
- source_word: θλῖψις
  choice: شِدّة
  rationale: لفظ عربي واضح وجاد يدل على البلاء والضغط، ويتميز عن «ضيق» التالية.
- source_word: στενοχωρία
  choice: ضيق
  rationale: ينقل معنى الانحصار والكرب بلفظ عربي مألوف وموجز.
- source_word: διωγμός
  choice: اضطهاد
  rationale: المقابل الاصطلاحي الدقيق والواضح في هذا السياق.
- source_word: λιμός
  choice: مجاعة
  rationale: يدل على النقص الشديد في الطعام، لا على مجرد الجوع الشخصي.
- source_word: γυμνότης
  choice: عُري
  rationale: ترجمة مباشرة تحفظ الصورة الأصلية، وقد تشمل الحرمان من الكساء.
- source_word: κίνδυνος
  choice: خطر
  rationale: المقابل العربي المعاصر الطبيعي.
- source_word: μάχαιρα
  choice: سيف
  rationale: يحفظ الصورة الحرفية والتهديد بالعنف القاتل من غير تفسير زائد.
theological_decisions:
- issue: دلالة المضاف إليه في τοῦ Χριστοῦ
  choice: محبة المسيح، أي محبة المسيح لنا بحسب السياق
  alternative: محبتنا للمسيح
  rationale: صيغة الإضافة اليونانية تحتمل من حيث التركيب أن يكون المسيح مصدر المحبة أو متعلَّقها. ويرجّح سياق رومية 8:31–39 محبة المسيح للمؤمنين، لكن الاحتمال الآخر حُفظ في الحاشية بدل إلغائه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على إيقاع السؤال البلاغي وتتابع ألفاظ الشدائد. استُعملت «شِدّة» و«ضيق» لتمييز θλῖψις عن στενοχωρία، ووُضع التشكيل الجزئي حيث يساعد على القراءة.
