base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: ar
  text: ولكن إن كان المسيح فيكم، فالجسد ميت بسبب الخطيئة[a]، وأما الروح[b] فحياة بسبب البر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فالجسد خاضع للموت»، أو «فالجسد فانٍ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الروح القدس». يمكن أن تشير «الروح» هنا إما إلى روح الإنسان التي أحياها الله، وإما إلى الروح القدس.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «العدل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: المسيح
  rationale: يحفظ اللقب اليوناني بمعناه المسياني في صياغة عربية مألوفة وطبيعية.
- source_word: σῶμα
  choice: الجسد
  rationale: يدل اللفظ على الجسد، لا على «اللحم»، ويحفظ المقابلة المباشرة مع الروح.
- source_word: νεκρὸν
  choice: ميت
  rationale: ينقل المعنى الصريح للصفة اليونانية، مع بيان احتمال دلالتها على الخضوع للموت في الحاشية.
- source_word: διὰ ἁμαρτίαν
  choice: بسبب الخطيئة
  rationale: ينقل الاستعمال السببي لحرف الجر مع صيغة النصب بعبارة عربية واضحة.
- source_word: πνεῦμα
  choice: الروح
  rationale: الصيغة العربية تبقي المرجع محتملًا بين روح الإنسان والروح القدس، ويُشرح هذا الالتباس الأصيل في الحاشية.
- source_word: ζωὴ
  choice: فحياة
  rationale: يحافظ على الاسم «حياة» بدل تحويله إلى الصفة «حي»، وعلى إيجاز العبارة اليونانية.
- source_word: διὰ δικαιοσύνην
  choice: بسبب البر
  rationale: يحفظ القوة السببية ويستعمل المقابل العربي الكتابي الواضح لـ δικαιοσύνη، مع إمكان معنى العدل بحسب السياق.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: الروح
  alternative: روح الإنسان، أو الروح القدس
  rationale: لا يضع النص اليوناني علامة كتابية تحسم المرجع؛ لذلك تُحفظ دلالة العبارة المفتوحة بدل فرض تفسير واحد.
- issue: دلالة νεκρὸν مع σῶμα
  choice: الجسد ميت
  alternative: الجسد خاضع للموت، أو الجسد فانٍ
  rationale: الصياغة الرئيسية تنقل حدة اللفظ اليوناني، بينما تبيّن الحاشية احتمال أن يكون المقصود فناء الجسد أو خضوعه للموت.
- issue: دلالة δικαιοσύνη
  choice: البر
  alternative: العدل
  rationale: «البر» أنسب في هذا السياق البولسي، لكن اللفظ اليوناني قد يحمل أيضًا معنى العدل، ولذلك يُذكر البديل دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت المقابلة «فالجسد... وأما الروح...» لإظهار البناء المتوازن في اليونانية، مع إبقاء العبارة الاسمية المكثفة «الروح فحياة» وعدم إزالة الغموض المقصود في مرجع الروح.
