  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: ar
  text: فإني أرى أن آلام الزمن الحاضر لا تَعدِل شيئًا إذا قورنت بالمجد الآتي الذي سيُعلَن لنا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فينا».'
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: أرى
  rationale: ينقل معنى التقدير العقلي والحكم المدروس، لا مجرد الإحساس، وهو تعبير عربي طبيعي في السياق.
- source_word: γὰρ
  choice: فإني
  rationale: يحفظ الصلة التفسيرية بما سبق، مع صياغة عربية سلسة.
- source_word: οὐκ ἄξια ... πρὸς
  choice: لا تساوي شيئًا إذا قيست بـ
  rationale: يعبّر بوضوح وطبيعية عن عدم التكافؤ الشديد في المقارنة الذي تفيده العبارة اليونانية، من غير أن يوحي بأن المقارنة نفسها غير جائزة.
- source_word: τὰ παθήματα
  choice: آلام
  rationale: لفظ عربي مألوف يشمل ما يُكابَد من معاناة، ويلائم الاستعمال البولسي.
- source_word: τοῦ νῦν καιροῦ
  choice: الزمن الحاضر
  rationale: يحفظ الدلالة الزمنية المباشرة لـκαιρός من غير إضافة معنى «العصر» الأخروي صراحةً.
- source_word: τὴν μέλλουσαν δόξαν
  choice: المجد الآتي
  rationale: يحفظ عنصر الاستقبال الكامن في μέλλουσαν، مع عبارة عربية موجزة وطبيعية.
- source_word: ἀποκαλυφθῆναι
  choice: سيُعلَن
  rationale: يحفظ المبني للمجهول والتوجّه المستقبلي، و«يُعلَن» واضح في معنى إظهار ما كان مستورًا.
- source_word: εἰς ἡμᾶς
  choice: لنا
  rationale: يمثل اتجاه الإعلان إلى المؤمنين أو تعلقه بهم، مع إبقاء احتمال «فينا» في الحاشية بسبب اتساع دلالة حرف الجر.
theological_decisions:
- issue: دلالة εἰς ἡμᾶς في إعلان المجد
  choice: لنا
  alternative: فينا
  rationale: يمكن أن تدل العبارة على إعلان المجد للمؤمنين، أو على ظهوره فيهم. اختيرت «لنا» في المتن لوضوحها، وحُفظ الاحتمال التشاركي «فينا» في الحاشية دون حسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. تجنبت الصياغة الحرفية الثقيلة «ليست جديرة بأن تُقارَن»، واستُعمل تركيب عربي طبيعي يبرز التفاوت الكبير، مع إبقاء العنصر المستقبلي في «المجد الآتي» والمحافظة على غموض εἰς ἡμᾶς في حاشية.
