source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: ar
  text: وكذلك، فإن الروح أيضًا يعيننا في ضعفنا؛ لأننا لا نعرف ما ينبغي أن نصلّي لأجله كما يجب، لكن الروح نفسه يشفع بأنّات يتعذّر التعبير عنها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأنّات لا تنطق بها الكلمات»، أو: «بأنّات لا يُعبَّر عنها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: وكذلك فإن... أيضًا
  rationale: تصل العبارة بما سبق وتُبقي دلالة الإضافة في καί، بصياغة عربية طبيعية.
- source_word: συναντιλαμβάνεται
  choice: يعيننا في
  rationale: الفعل يدل على مؤازرة من يشارك في حمل العبء؛ و«يعيننا» واضحة وطبيعية، وتُستكمل دلالته بعبارة «في ضعفنا».
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: في ضعفنا
  rationale: يحافظ المفرد على الصيغة اليونانية وعلى سعة المعنى، فلا يحصر الضعف في جانب جسدي أو روحي.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: لأننا لا نعرف ما ينبغي أن نصلّي لأجله كما يجب
  rationale: تنقل صيغة التردد في προσευξώμεθα وملاءمة καθὸ δεῖ، مع إظهار متعلَّق الصلاة بأسلوب عربي مفهوم.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: الروح نفسه
  rationale: تنقل الصيغة التوكيدية وتنسجم مع الفاعلية الشخصية التي ينسبها السياق إلى الروح، من غير تحميل الجنس النحوي اليوناني على العربية.
- source_word: ὑπερεντυγχάνει
  choice: يشفع
  rationale: مقابل عربي موجز ودقيق لفعل الالتماس بالنيابة عن آخر.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: بأنّات لا يُعبَّر عنها
  rationale: يحفظ «أنّات» معنى στεναγμοῖς، وتبقي العبارة احتمال كونها غير قابلة للتعبير أو غير منطوقة، مع بيان البديل في الحاشية.
theological_decisions:
- issue: هل تُصاغ الإشارة إلى الروح صياغة شخصية أم محايدة؟
  choice: الروح نفسه
  alternative: الروح ذاته / الروح
  rationale: التركيب αὐτὸ τὸ πνεῦμα توكيدي، والأفعال «يعين» و«يشفع» تعرض فاعلية شخصية. العربية لا تملك هنا نظيرًا محايدًا طبيعيًا للجنس النحوي اليوناني، لذا فـ«نفسه» تنقل التوكيد دون بناء الحكم على الجنس النحوي وحده.
- issue: تحديد صاحب الأنّات أو طبيعتها
  choice: الإبقاء على تعلق «بأنّات» بفعل شفاعة الروح دون تفسير مصدر الأنّات
  alternative: التصريح بأنها أنات الروح أو أنات المؤمنين
  rationale: النص يربط الأنّات بالشفاعة نحويًا، لكنه لا يفصّل صراحةً علاقتها بخبرة المصلّي؛ لذلك لا ينبغي حسم توتر تفسيري لا يحسمه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يُعبَّر عنها» بدل ألفاظ أقدم مثل «لا يُنطق بها»، مع إبقاء الغموض الدلالي في ἀλαλήτοις. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
