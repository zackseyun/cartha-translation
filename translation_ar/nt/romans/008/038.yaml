  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: ar
  text: فإني على يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا السلطات[a]، ولا الأمور الحاضرة ولا الآتية، ولا القوى،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رئاسات»؛ وقد تشير الكلمة إلى سلطات كونية أو روحية.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: إني على يقين
  rationale: صيغة التام تعبّر عن اقتناع راسخ باقٍ؛ وهذا التعبير عربي واضح وطبيعي يحفظ معنى الحالة المستقرة.
- source_word: γὰρ
  choice: فـ
  rationale: الفاء تصل الكلام بما قبله وتفيد التعليل أو التفسير بإيجاز.
- source_word: οὔτε ... οὔτε
  choice: لا ... ولا
  rationale: التكرار يحفظ إيقاع التعداد والنفي المتتابع في اليونانية.
- source_word: θάνατος
  choice: موت
  rationale: مقابل مباشر مألوف، وهو في تضاد مع «حياة».
- source_word: ζωή
  choice: حياة
  rationale: مقابل مباشر مألوف يحفظ التضاد مع «موت».
- source_word: ἄγγελοι
  choice: ملائكة
  rationale: مع أن اللفظ قد يعني رسلًا، فإن سياق القوى والحقائق الكونية يرجّح الملائكة.
- source_word: ἀρχαὶ
  choice: رئاسات
  rationale: يحفظ احتمال الإشارة إلى سلطات حاكمة أو قوى كونية وروحية، من غير حصره في تصور لاهوتي تفصيلي.
- source_word: ἐνεστῶτα
  choice: أمور حاضرة
  rationale: ينقل اسم الفاعل المستعمل اسميًا للدلالة على الحقائق القائمة في الحاضر، ويحافظ على موازاته بما سيأتي.
- source_word: μέλλοντα
  choice: أمور آتية
  rationale: ينقل الحقائق المستقبلية بعبارة موجزة ومتوازية مع «أمور حاضرة».
- source_word: δυνάμεις
  choice: قوات
  rationale: يحفظ الغموض المقصود بين قوى شخصية أو روحية وبين قوى غير شخصية.
theological_decisions:
- issue: هل تُترجم ἀρχαὶ وδυνάμεις بوصفهما أسماء تقنية لفئات من الكائنات الروحية؟
  choice: رئاسات وقوات
  alternative: حكام وقوى؛ سلطات وقوات
  rationale: السياق يرجّح شمول قوى كونية أو روحية، لكن اللفظين اليونانيين أوسع من تصنيف لاهوتي محدد؛ لذلك تحفظ الصياغة قدرًا من الاتساع والغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت بنية التعداد وإيقاع النفي المتكرر، كما حُفظت الفاصلة الختامية لأن الآية جزء من جملة تستمر في العدد التالي.
