  to: فإني على يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا السلطات[a]، ولا الأمور الحاضرة ولا الآتية، ولا القوى،
  rationale: استُبدلت «قوات» بـ«القوى» لتفادي الإيحاء العسكري غير الموجود في δυνάμεις، واستُبدلت «رئاسات» بـ«السلطات» في المتن لمزيد من الوضوح الطبيعي، مع حفظ البديل التقني وإمكان الإشارة الكونية أو الروحية في الحاشية. وأُضيفت أدوات التعريف في عناصر التعداد لأنها أنسب في العربية لتناول هذه الحقائق تناولًا عامًا.
