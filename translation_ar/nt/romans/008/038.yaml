  source_fidelity: المسودة تحافظ على ترتيب عناصر التعداد وعلى قوة الاقتناع المستمرة في πέπεισμαι، كما تحافظ على تعليق الجملة بالفاصلة الختامية. لكن «قوات» لا تنقل δυνάμεις على نحو دقيق في هذا السياق، إذ تدل في العربية المعاصرة غالبًا على قوات عسكرية، بينما اللفظ اليوناني أوسع.
  naturalness: «رئاسات» و«قوات» ثقيلتان أو غير طبيعيتين في العربية الفصحى الحديثة الواضحة. «السلطات» و«القوى» أكثر سلاسة مع إبقاء الإحالة واسعة وغير محسومة.
  terminology: يُستحسن اعتماد «السلطات» لـἀρχαί، مع بيان البديل «رئاسات» في الحاشية، واعتماد «القوى» لـδυνάμεις. بذلك لا يُفرض تصنيف لاهوتي محدد ولا يُقيد المعنى بقوات عسكرية.
