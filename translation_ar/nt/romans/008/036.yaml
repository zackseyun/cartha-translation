  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: ar
  text: 'كما هو مكتوب: «من أجلك نُقتَل طوال النهار؛ وحُسِبنا[a] كغنمٍ للذبح».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اعتُبرنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تقدّم الاقتباس الكتابي بصيغة مقارنة طبيعية ومباشرة، وتحفظ صلته بما قبله.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: صيغة عربية مألوفة لتقديم نص كتابي، وتحفظ دلالة الحالة القائمة التي تفيدها صيغة التمام اليونانية.
- source_word: Ἕνεκεν σοῦ
  choice: من أجلك
  rationale: تحفظ معنى السبب أو الغاية والخطاب المباشر لله، بعبارة عربية واضحة وموجزة.
- source_word: θανατούμεθα
  choice: نُقتَل
  rationale: المضارع المبني للمجهول ينقل التعرض المستمر للقتل دون تحديد الفاعل.
- source_word: ὅλην τὴν ἡμέραν
  choice: طوال النهار
  rationale: تعبير عربي طبيعي يدل على امتداد الزمن واستمرار التعرض للموت.
- source_word: ἐλογίσθημεν
  choice: حُسِبنا
  rationale: يحفظ معنى عدّنا أو اعتبارنا شيئًا، وهو قريب من الفعل اليوناني ومفهوم في العربية الفصحى.
- source_word: ὡς
  choice: كـ
  rationale: أداة تشبيه موجزة وطبيعية تنقل المقارنة مباشرة.
- source_word: πρόβατα σφαγῆς
  choice: غنمٍ للذبح
  rationale: تنقل تركيب الإضافة اليوناني وصورة الغنم المهيأة للذبح من غير توسع تفسيري.
theological_decisions:
- issue: اقتباس مزمور 44:22 في سياق الألم
  choice: 'الإبقاء على المعنى الجماعي والمستمر: جماعة المتكلمين تتعرض للقتل وتُعَدّ مهيأة للذبح.'
  alternative: تفسير العبارة على أنها تشير تحديدًا إلى الاستشهاد الديني.
  rationale: النص اليوناني يورد رثاءً جماعيًا بصورته المباشرة، ولا يضيّق دلالته على تطبيق عقائدي واحد.
- issue: دلالة ἐλογίσθημεν
  choice: حُسِبنا
  alternative: اعتُبرنا
  rationale: كلاهما ممكن، لكن «حُسِبنا» أقرب إلى الصورة اللفظية للنص، مع إثبات البديل في الحاشية حفاظًا على المجال الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حافظت الصياغة على إيقاع الاقتباس وصورته القوية، وعلى الغموض المشروع في فعل «حُسِبنا/اعتُبرنا» دون إضافة تفسير طائفي.
