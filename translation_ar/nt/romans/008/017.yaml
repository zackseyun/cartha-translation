  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: ar
  text: 'فإن كنا أولادًا، فنحن أيضًا ورثة: ورثة الله ووارثون مع المسيح، إن كنا حقًّا نتألم معه لكي نُمجَّد أيضًا معه.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: أولادًا
  rationale: يدل الجمع المحايد على البنوة دون تخصيص الذكور، و«أولاد» تعبير عربي واضح وشامل يلائم سياق الميراث.
- source_word: κληρονόμοι
  choice: ورثة
  rationale: المقابل القانوني والعائلي الطبيعي لمن ينالون ميراثًا.
- source_word: θεοῦ
  choice: ورثة الله
  rationale: نُقل المضاف إليه مباشرة، مع إبقاء احتمال دلالة الإضافة على أن الله صاحب الميراث أو مصدره دون توسع تفسيري.
- source_word: συγκληρονόμοι
  choice: وارثون مع
  rationale: يحفظ معنى المشاركة الذي تفيده السابقة συν- بصياغة عربية طبيعية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب اليوناني Χριστός بالمقابل العربي المألوف ويحافظ على دلالته اللقبية.
- source_word: εἴπερ
  choice: إن كنا حقًّا
  rationale: يحفظ القوة الشرطية مع النبرة التوكيدية، من غير تحويل الشرط إلى تعليل يقيني.
- source_word: συμπάσχομεν
  choice: نتألم معه
  rationale: يُظهر معنى المشاركة في الألم الذي تحمله السابقة συν-، والضمير مفهوم من الإشارة إلى المسيح.
- source_word: ἵνα
  choice: لكي
  rationale: ينقل علاقة الغاية أو النتيجة المقصودة بصياغة عربية موجزة، مع عدم حسم التداخل الممكن بينهما.
- source_word: συνδοξασθῶμεν
  choice: نتمجّد أيضًا معه
  rationale: يحفظ صيغة المبني للمجهول ومعنى الاشتراك الذي تفيده السابقة συν-، كما ينقل καί بـ«أيضًا».
theological_decisions:
- issue: هل يجعل εἴπερ συμπάσχομεν الألم استحقاقًا للتمجيد أم يصف نمط المشاركة مع المسيح؟
  choice: 'الإبقاء على شرط حقيقي: «إن كنا حقًّا نتألم معه».'
  alternative: «بما أننا نتألم معه» أو صياغة توحي بأن الألم يكسب التمجيد استحقاقًا.
  rationale: النص اليوناني يحمل قوة شرطية فعلية، لكنه لا يصرّح بأن الألم ثمنٌ استحقاقي؛ لذلك تُحفظ الموازنة اللاهوتية من غير حسم زائد.
- issue: دلالة «ورثة الله»
  choice: الإبقاء على تركيب الإضافة كما في اليونانية.
  alternative: تفسيرها صراحةً بمعنى «وارثون ما يمنحه الله» أو «الله هو ميراثنا».
  rationale: الإضافة اليونانية موجزة وقابلة لأكثر من تحديد دلالي، فلا ينبغي توسيعها بما يحسم ما لم يحسمه النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. استُخدمت «أولاد» بدل «أبناء» لتجنب إيحاء التخصيص بالذكور، و«وارثون مع المسيح» لإظهار الاشتراك دون تركيب اصطلاحي ثقيل.
