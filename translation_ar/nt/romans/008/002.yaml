  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: ar
  text: لِأَنَّ نَامُوسَ رُوحِ الْحَيَاةِ فِي الْمَسِيحِ يَسُوعَ قَدْ حَرَّرَكَ مِنْ نَامُوسِ الْخَطِيئَةِ وَالْمَوْتِ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «مبدأ»: «مبدأ روح الحياة».'
    reason: lexical_alternative
  - marker: b
    text: تقرأ بعض المخطوطات «حرَّرني» بدلًا من «حرَّرك».
    reason: textual_variant
  - marker: c
    text: 'الترجمة التقليدية: «في المسيح يسوع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: نَامُوس
  rationale: استُعمل «ناموس» في الموضعين للمحافظة على تكرار الاسم نفسه وعلى التوتر في استعارة بولس؛ ويمكن فهمه بمعنى «مبدأ»، لكن إدخال هذا التفسير في المتن يضيّق الدلالة مبكرًا.
- source_word: πνεύματος
  choice: رُوح
  rationale: يشير السياق في رومية 8 على الأرجح إلى الروح القدس بوصفه واهب الحياة، مع بقاء العبارة المضافة موجزة كما في اليونانية.
- source_word: ζωῆς
  choice: الْحَيَاة
  rationale: ترجمة مباشرة تحفظ تركيب «روح الحياة» من غير توسع تفسيري.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: فِي الْمَسِيحِ يَسُوعَ
  rationale: حُفظ حرف الجر «في» لما يحمله تعبير بولس من دلالة الوجود والاتحاد بالمسيح، وتُرجم Χριστός باللقب العربي المألوف «المسيح».
- source_word: ἠλευθέρωσέν
  choice: قَدْ حَرَّرَ
  rationale: صياغة عربية طبيعية تدل على فعل مكتمل ذي نتيجة قائمة، مع الحفاظ على معنى التحرير.
- source_word: σε
  choice: ـكَ
  rationale: اتباع قراءة SBLGNT المطبوعة بصيغة المخاطب المفرد، مع إثبات قراءة «ني» في الحاشية.
- source_word: ἁμαρτίας
  choice: الْخَطِيئَة
  rationale: ترجمة معيارية تحفظ المفرد، وتلائم استعمال بولس للخطيئة واقعًا وقوةً مستعبدة.
- source_word: θανάτου
  choice: الْمَوْت
  rationale: ترجمة مباشرة تحافظ على اقترانه الموجز بالخطيئة.
theological_decisions:
- issue: هل πνεύματος يشير إلى الروح القدس أم إلى روح الإنسان أو مبدأ روحي؟
  choice: الروح القدس، ممثَّلًا في العربية بلفظ «روح» في تركيب «روح الحياة»
  alternative: روح الإنسان أو مبدأ روحي غير شخصي
  rationale: المقابلة في رومية 8 بين الجسد والخطيئة والموت من جهة، والروح الإلهي الواهب الحياة من جهة أخرى، ترجّح الإشارة إلى الروح القدس، من غير إضافة لفظ «القدس» غير الموجود صراحة في الآية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. اختير «ناموس» بدل «قانون» للمحافظة على المصطلح البولسي المألوف وعلى إمكان دلالته على الشريعة أو المبدأ العامل بحسب السياق. وُضعت جميع علامات الحواشي في المتن.
