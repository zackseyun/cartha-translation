lexical_decisions:
- source_word: τίς
  choice: مَن
  rationale: أداة استفهام تُدخل سؤالًا بلاغيًا، وهذه هي الصياغة العربية المباشرة والطبيعية.
- source_word: ἐγκαλέσει
  choice: سيُقيم دعوى
  rationale: للفعل دلالة قضائية هي توجيه اتهام أو إقامة دعوى؛ وتحفظ هذه العبارة جوّ المحكمة في السياق.
- source_word: κατὰ
  choice: على
  rationale: تأتي طبيعية في التعبير القضائي العربي «يُقيم دعوى على»، وتؤدي معنى توجيه الاتهام ضد شخص.
- source_word: ἐκλεκτῶν θεοῦ
  choice: مختاري الله
  rationale: الصفة مستعملة استعمال الاسم، والجمع المضاف يصوغ المعنى بوضوح من غير فرض مصطلح مذهبي لاحق.
- source_word: θεὸς ὁ δικαιῶν
  choice: الله هو الذي يُبرِّر
  rationale: تحفظ الصياغة تقديم «الله» للتوكيد، وتنقل اسم الفاعل المعرّف بعبارة عربية طبيعية ذات دلالة قضائية.
theological_decisions:
- issue: ترجمة ἐκλεκτῶν دون تحميلها نظامًا عقائديًا لاحقًا
  choice: مختاري الله
  alternative: الذين اختارهم الله
  rationale: تُبقي الصياغة حقيقة الاختيار الإلهي ظاهرة، من غير أن تشرح نطاق الاختيار أو أساسه بما يتجاوز النص.
- issue: فهم العبارة الموجزة θεὸς ὁ δικαιῶν
  choice: الله هو الذي يُبرِّر
  alternative: أالله الذي يُبرِّر؟
  rationale: 'يمكن من جهة علامات الترقيم وصل العبارة بسؤال تالٍ، لكن السياق البلاغي وقراءة العبارة تقريرًا مؤكِّدًا يؤيدان جعلها جوابًا: الله نفسه هو الذي يصدر حكم التبرير، مع إبقاء إيجاز الأصل.'
- issue: الدلالة القضائية للفعل δικαιόω
  choice: يُبرِّر
  alternative: يحكم بالبراءة / يعلن بارًّا
  rationale: «يُبرِّر» يقابل اللفظ اليوناني بإيجاز ويحفظ امتداده اللاهوتي، وتوضح الحاشية أن المقصود هنا قضائي لا جعل السلوك مبرَّرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «يُقيم دعوى» لإبراز المشهد القضائي، مع «يُبرِّر» حفاظًا على المصطلح البولسي وشرح دلالته في الحاشية.
