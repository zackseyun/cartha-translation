  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: ar
  text: مَن سيُقيم دعوى على مختاري الله؟ الله هو الذي يُبرِّر.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين اختارهم الله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مَن سيتهم مختاري الله؟».'
    reason: lexical_alternative
  - marker: c
    text: 'الفعل «يُبرِّر» مستعمل هنا بمعنى قضائي: الله هو الذي يحكم بأنهم أبرار.'
