id: ROM.8.31
reference: Romans 8:31
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: ar
  text: فماذا نقول إزاء هذه الأمور[a]؟ إن كان الله معنا[b]، فمن يكون ضدنا؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن هذه الأمور».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بما أن الله معنا، فمن يكون ضدنا؟»'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν
  choice: فماذا
  rationale: تجمع «فـ» قوة الاستنتاج والانتقال في οὖν، وتؤدي «ماذا» وظيفة السؤال البلاغي الذي يستخلص نتيجة مما سبق.
- source_word: ἐροῦμεν
  choice: نقول
  rationale: المستقبل اليوناني هنا ذو معنى تداولي بلاغي؛ والمضارع العربي في «ماذا نقول؟» هو التعبير الطبيعي عن هذا التشاور الاستنكاري.
- source_word: πρὸς ταῦτα
  choice: إزاء هذه الأمور
  rationale: تنقل معنى الكلام بالنظر إلى ما سبق أو استجابة له، بصياغة عربية واضحة من غير حصره في مجرد الحديث «عن» الأمور.
- source_word: εἰ
  choice: إن كان
  rationale: تحافظ «إن» على الصيغة الشرطية الظاهرة في اليونانية وعلى قوة السؤال البلاغي، من غير أن تحولها في المتن إلى تعليل صريح.
- source_word: ὁ θεὸς
  choice: الله
  rationale: المقابل العربي المباشر والطبيعي للاسم الإلهي في هذا السياق.
- source_word: ὑπὲρ ἡμῶν
  choice: معنا
  rationale: في هذا السياق تدل ὑπέρ على التأييد والوقوف لصالحنا؛ و«معنا» تؤدي هذا المعنى بوضوح وإيجاز في العربية، لا معنى المصاحبة المكانية فحسب.
- source_word: τίς καθ’ ἡμῶν
  choice: فمن يكون ضدنا؟
  rationale: تنقل التحدي البلاغي ومعنى المعارضة في κατά مع المضاف إليه. أُثبت الفعل «يكون» لسلامة العبارة العربية ووضوحها، مع بقائها موجزة.
theological_decisions:
- issue: القوة الشرطية لعبارة εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: «إن كان الله معنا» في المتن
  alternative: «بما أن الله معنا»
  rationale: يحافظ المتن على أداة الشرط اليونانية والتوتر البلاغي، بينما يبين السياق أن بولس لا يشك في وقوف الله مع شعبه. وأُدرجت القراءة التعليلية في الحاشية لأنها تجعل الافتراض المؤكد ضمنًا صريحًا.
- issue: دلالة ὑπὲρ ἡμῶν
  choice: «معنا» بمعنى مؤيد لنا
  alternative: «في صفنا» أو «لصالحنا»
  rationale: «معنا» طبيعية وموجزة وذات قوة بلاغية، فيما توضح المقابلة مع «ضدنا» أن المقصود التأييد لا مجرد المصاحبة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وكريمة النبرة. حافظت على بنية السؤالين البلاغيين وعلى الشرط الظاهر في الأصل، مع استعمال «معنا/ضدنا» لإبراز التقابل بصورة طبيعية ومفهومة.
