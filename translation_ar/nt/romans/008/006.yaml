  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: ar
  text: لأن توجّه الجسد[a] موت، أما توجّه الروح[b] فحياة وسلام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الطبيعة الخاطئة».
    reason: lexical_alternative
  - marker: b
    text: أو «روح الإنسان»، أو «الروح» بمعنى عام.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: لأن
  rationale: تنقل وظيفة الأداة التفسيرية التي تربط القول بما قبله بصورة طبيعية في العربية.
- source_word: φρόνημα
  choice: توجّه
  rationale: يدل على النزعة أو الوجهة الذهنية الراسخة، لا على نشاط العقل وحده، ويلائم المقابلة الأخلاقية في السياق.
- source_word: σάρξ
  choice: الجسد
  rationale: يحافظ على مصطلح بولس وصورته المقصودة بدل أن يحسم دلالته التفسيرية داخل المتن؛ وأُثبت البديل في الحاشية.
- source_word: θάνατος
  choice: موت
  rationale: المقابل المباشر الذي يحفظ الإيجاز والثقل اللاهوتي في التضاد.
- source_word: πνεῦμα
  choice: الروح
  rationale: يرجح السياق الإشارة إلى روح الله، لكن العربية لا تميز ذلك بالحرف الكبير؛ لذلك تُبيَّن إمكانية فهمه على روح الإنسان في الحاشية.
- source_word: ζωή
  choice: حياة
  rationale: ترجمة مباشرة تحافظ على المقابلة الموجزة مع الموت.
- source_word: εἰρήνη
  choice: سلام
  rationale: المقابل العربي الطبيعي الذي يحفظ سعة المعنى واقترانه بالحياة.
theological_decisions:
- issue: هل يشير πνεῦμα إلى الروح القدس أم إلى روح الإنسان؟
  choice: الروح، بمعنى روح الله بحسب السياق
  alternative: روح الإنسان، أو الروح بمعنى عام
  rationale: يكرر السياق القريب في رومية 8 المقابلة بين الجسد والروح بوصفه واهب الحياة؛ ومع ذلك لا يُلغى الاحتمال الآخر، بل يُذكر في الحاشية.
- issue: هل تُفسَّر σάρξ صراحة بأنها الطبيعة الخاطئة؟
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: اللفظ الحرفي يحفظ شبكة مصطلحات بولس والتوتر الدلالي، بينما يمثل البديل تفسيرًا مشروعًا لا ينبغي إدخاله في صلب النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة وموجزة ذات إيقاع تقابلي. اختير «توجّه» بدل «ذهنية» أو «اهتمام» لأنه أوضح للقارئ العام في الدلالة على النزعة الراسخة، مع إبقاء «الجسد» و«الروح» حفاظًا على ألفاظ النص وتوتره اللاهوتي.
