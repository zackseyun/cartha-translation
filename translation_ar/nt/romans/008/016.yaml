  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: ar
  text: الرُّوحُ نفسه يشهد مع روحنا بأننا أولادُ الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: الرُّوحُ نفسُه
  rationale: يفيد التركيب اليوناني التوكيد، وتحافظ «نفسه» عليه بصياغة عربية طبيعية، مع استعمال ضمير المذكر الموافق للاستعمال العربي لكلمة «الروح» وللفاعلية الشخصية في السياق.
- source_word: συμμαρτυρεῖ
  choice: يشهد مع
  rationale: الفعل يدل على الشهادة مع آخر أو إلى جانبه؛ و«يشهد مع» واضحة وتحفظ معنى الشهادة المصاحبة أو المشتركة.
- source_word: τῷ πνεύματι ἡμῶν
  choice: مع روحنا
  rationale: تُفهم صيغة المجرور اليونانية هنا على المصاحبة مع الفعل المركب، أي إن الروح يشهد مع روحنا، مع إبقاء احتمال فهمها على أنها جهة تلقّي الشهادة في الحاشية.
- source_word: ὅτι ἐσμὲν
  choice: بأننا
  rationale: تنقل جملة المضمون التي تدخل عليها ὅτι نقلًا عربيًا موجزًا وطبيعيًا من غير إضافة توكيد غير موجود.
- source_word: τέκνα θεοῦ
  choice: أولادُ الله
  rationale: τέκνα لفظ شامل للأبناء من الجنسين ويؤكد العلاقة العائلية؛ و«أولاد الله» تعبير عربي واضح لا يضيّق المعنى إلى الذكور.
theological_decisions:
- issue: طبيعة العلاقة بين شهادة الروح وروحنا
  choice: يشهد مع روحنا
  alternative: يشهد لروحنا
  rationale: سابقة الفعل συν- ترجّح معنى الشهادة المشتركة أو المصاحبة، ولذلك حُفظ هذا المعنى في المتن. لكن صيغة المجرور قد تُفهم عند بعضهم على أن روحنا هي المتلقية للشهادة، فذُكر البديل في الحاشية من غير حسم زائد.
- issue: صيغة الإشارة إلى الروح
  choice: الرُّوحُ نفسُه
  alternative: الروح عينه
  rationale: يحافظ «نفسه» على توكيد αὐτό، وهو طبيعي في العربية ولا يحوّل الروح إلى قوة غير شخصية. أما «عينه» فصحيح لكنه أقل تداولًا في العربية المعاصرة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. أُبقي ترتيب الجملة قريبًا من اليونانية، مع صياغة طبيعية. وُضع ضبط جزئي فقط حيث يساعد على بيان وظيفة «نفسه» و«أولاد» النحوية.
