  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: ar
  text: يُسَلِّمُ عليكم غايس، مُضيفي ومُضيف الكنيسة كلِّها. ويُسَلِّمُ عليكم أراستس، أمينُ خزانة المدينة[a]، وكوارتس الأخ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: وكيل المدينة. يمكن أن تدل الكلمة اليونانية على مسؤول إداري مدني بمعنى أوسع، وإن كان «أمين خزانة» يلائم المنصب البلدي المرجَّح هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: يُسَلِّمُ عليكم
  rationale: تعبير عربي طبيعي في ختام الرسائل، ينقل معنى توجيه التحية مباشرة إلى المخاطَبين.
- source_word: ξένος
  choice: مُضيف
  rationale: السياق، ولا سيما إضافة «الكنيسة كلها»، يدل على من يستقبل الآخرين ويستضيفهم، لا على معنى الغريب أو النزيل.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: الكنيسة كلِّها
  rationale: تحافظ «الكنيسة» على الاستعمال البولسي المعتاد للجماعة المسيحية، وتنقل «كلها» شمول ضيافة غايس.
- source_word: οἰκονόμος τῆς πόλεως
  choice: أمين خزانة المدينة
  rationale: اللفظ يدل على وكيل أو إداري، وفي السياق المدني يُرجَّح أنه منصب مالي بلدي؛ وتوضح الحاشية إمكان المعنى الإداري الأوسع.
- source_word: ἀδελφός
  choice: الأخ
  rationale: يحافظ على الاسم المذكر المفرد المعرّف في اليونانية، من غير إضافة ضمير ملكية غير موجود في المصدر.
theological_decisions:
- issue: دلالة ἐκκλησία في سياق التحية
  choice: الكنيسة
  alternative: الجماعة
  rationale: يشير اللفظ هنا إلى جماعة المؤمنين بحسب الاستعمال البولسي المألوف، و«الكنيسة» واضحة وطبيعية من غير تحميل العبارة تصورًا كنسيًا زائدًا.
- issue: دلالة ἀδελφός على العلاقة بين المؤمنين
  choice: الأخ
  alternative: أخونا أو المؤمن
  rationale: يبقي هذا الاختيار صيغة المصدر المذكرة المعرّفة، ولا يضيف ضمير «نا» ولا يستبدل الصورة العائلية بتفسيرها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة «يُسَلِّمُ عليكم» المألوفة في التحيات الرسولية، وحُفظ تكرار الفعل وبنية الأسماء والألقاب. وُضع مؤشر الحاشية عند العبارة التي تشرحها، أي «أمين خزانة المدينة».
