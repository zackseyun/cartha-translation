  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: ar
  text: يُسَلِّم عليكم تيموثاوس، شريكي في العمل، وكذلك لوكيوس وياسون وسوسيباتروس، وهم ذوو قرابتي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أقاربي»، أو «أبناء قومي اليهود». يمكن أن يدل اللفظ اليوناني على قرابة عائلية أو على صلة قومية أوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται ὑμᾶς
  choice: يُسَلِّمُ عليكم
  rationale: تعبير رسائلي عربي طبيعي ينقل معنى توجيه التحية إلى المخاطَبين، مع بقاء تيموثاوس فاعلًا مفردًا.
- source_word: ὁ συνεργός μου
  choice: شريكي في العمل
  rationale: ينقل معنى العمل المشترك والارتباط ببولس من غير إيحاء مؤسسي حديث أو تخصيص مجال العمل بما لا يصرح به النص.
- source_word: καὶ ... καὶ ... καὶ
  choice: وكذلك ... و... و...
  rationale: يحافظ على عطف بقية مرسلي التحية، مع صياغة عربية واضحة لا توهم أن الفعل المفرد يشمل تيموثاوس وحده دون الآخرين.
- source_word: Λούκιος
  choice: لوكيوس
  rationale: نقل صوتي عربي مباشر للاسم اليوناني.
- source_word: Ἰάσων
  choice: ياسون
  rationale: نقل صوتي عربي مباشر للاسم اليوناني.
- source_word: Σωσίπατρος
  choice: سوسيباتروس
  rationale: يعكس الصيغة الكاملة الواردة في هذا العدد، بدل اختزالها إلى صيغة اسم أخرى.
- source_word: οἱ συγγενεῖς μου
  choice: أنسبائي
  rationale: لفظ عربي موجز يحفظ معنى القرابة، لكنه قد يشمل بحسب السياق قرابة عائلية أو صلة قومية أوسع؛ لذلك تُذكر البدائل في الحاشية.
theological_decisions:
- issue: مدلول συγγενεῖς μου في استعمال بولس
  choice: أنسبائي
  alternative: أقاربي؛ أو أبناء قومي اليهود
  rationale: اللفظ اليوناني لا يحسم هل المقصود أقارب عائليون أم أصحاب صلة قومية أوسع. أبقى المتن هذا القدر من الاتساع، وتوضح الحاشية الاحتمالين دون ترجيح مذهبي أو تاريخي قاطع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة رسائلية كريمة. استُخدم «يُسَلِّم عليكم» بوصفه التعبير العربي الطبيعي للتحية في هذا السياق، وحُفظ غموض لفظ القرابة بحاشية موجزة.
