source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: ar
  text: وأحثكم، أيها الإخوة[a]، أن تنتبهوا إلى الذين يُحدثون الانقسامات ويضعون العثرات خلافًا للتعليم الذي تعلَّمتموه، وأن تبتعدوا عنهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيها الإخوة والأخوات»؛ اللفظ اليوناني هو «الإخوة»، ويُرجَّح أن الخطاب موجَّه إلى الجماعة كلها.'
    reason: بديل معجمي يوضح احتمال الشمول في صيغة النداء.
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أحثكم
  rationale: ينقل قوة النداء الرعوي الجاد بصياغة عربية واضحة، من غير إضافة ظرف زمني غير موجود في اليونانية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في الأصل، مع بيان احتمال شمول الجماعة كلها في الحاشية.
- source_word: σκοπεῖν
  choice: أن تراقبوا
  rationale: يفيد الانتباه المتعمد والحذر من الأشخاص المذكورين، وهو أفصح هنا من تعبير قد يوحي بمجرد النظر.
- source_word: διχοστασίας
  choice: الانقسامات
  rationale: تعبير واضح عن التصدعات والخلافات التي تمزق الجماعة.
- source_word: σκάνδαλα
  choice: يضعون العثرات
  rationale: يحفظ صورة العثرة المجازية ويجعل ποιοῦντας متعلقًا طبيعيًا بكل من الانقسامات والعثرات.
- source_word: παρὰ τὴν διδαχήν
  choice: خلافًا للتعليم
  rationale: ينقل معنى الانحراف عن معيار التعليم أو معارضته.
- source_word: ἐμάθετε
  choice: تعلَّمتموه
  rationale: يحافظ على الصيغة المباشرة في الأصل وعلى الإشارة إلى تعليم سبق أن تلقوه.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: ابتعدوا عنهم
  rationale: ينقل الأمر بالتحول عن هؤلاء وتجنبهم بلغة عربية طبيعية، مع بقاء الدلالة الاتجاهية.
theological_decisions:
- issue: القوة التمثيلية للفظ ἀδελφοί في خطاب جماعة روما
  choice: إبقاء «أيها الإخوة» في المتن، مع توضيح احتمال شمول النساء في الحاشية.
  alternative: ترجمة اللفظ في المتن بـ«أيها الإخوة والأخوات».
  rationale: الصيغة اليونانية مذكرة جمعًا، لكنها في الاستعمال الرسولي قد تخاطب الجماعة المؤمنة كلها؛ لذلك تحفظ الترجمة شكل الأصل وتوضح مدى الخطاب المحتمل دون حسمه داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «وأحثكم» لإظهار δέ بوصفها وصلة خطابية خفيفة دون تحويلها إلى ظرف زمني، وحُفظت استعارة العثرة في صياغة طبيعية.
