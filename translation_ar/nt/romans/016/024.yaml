lexical_decisions:
- source_word: χάρις
  choice: نِعْمَة
  rationale: المقابل العربي المألوف الذي يحفظ معنى الإحسان والعطية الإلهية في البركة البولسية.
- source_word: κυρίου
  choice: رَبِّنَا
  rationale: ينقل لقب السيادة المنسوب إلى يسوع، مع ضمير المتكلمين كما في τοῦ κυρίου ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «يسوع» اسم منقول، و«المسيح» اللقب العربي الراسخ الذي يحفظ دلالة Χριστός بصفته الممسوح.
- source_word: μετὰ πάντων ὑμῶν
  choice: مَعَكُمْ جَمِيعًا
  rationale: صياغة عربية طبيعية تشمل جميع المخاطَبين وتحفظ معنى المصاحبة.
- source_word: Ἀμήν
  choice: آمِين
  rationale: الصيغة العربية الليتورجية الراسخة لهذا الإقرار.
theological_decisions:
- issue: دلالة Χριστός في عبارة Ἰησοῦ Χριστοῦ
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» يترجم معنى اللقب ولا يعامله كاسم علم منقول، وهو التعبير العربي المفهوم والراسخ.
- issue: صيغة البركة الاسمية
  choice: لِتَكُنْ نِعْمَةُ... مَعَكُمْ
  alternative: نِعْمَةُ... مَعَكُمْ
  rationale: إدخال «لتكن» يعبّر طبيعيًا في العربية عن التمني المفهوم من جملة البركة اليونانية الاسمية، دون تغيير مضمونها.
translation_notes:
