  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: ar
  text: سَلِّموا على أَبِلِّيس، المُزَكّى في المسيح. وسَلِّموا على الذين من بيت أَرِسْطُوبُولُس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المرتبطين ببيت أَرِسْطُوبُولُس أو حاشيته؛ ولا يلزم من العبارة أن يكون أَرِسْطُوبُولُس نفسه مشمولًا بالتحية.
    reason: توضيح تركيب يوناني موجز يحتمل الإشارة إلى أهل البيت أو الخدم والحاشية.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: صيغة أمر للجمع تفيد توجيه التحية، وهذه العبارة عربية طبيعية وتحافظ على تكرار الفعل في الآية.
- source_word: Ἀπελλῆν
  choice: أَبِلِّيس
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة.
- source_word: τὸν δόκιμον
  choice: المُزَكّى
  rationale: تدل δόκιμος على مَن ثبتت جدارته بعد الاختبار؛ و«المُزَكّى» تحفظ معنى القبول والاستحسان من غير إضافة تفسيرية مطوّلة.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: تحفظ العبارة البولسية الدالة على المجال أو الاتحاد، ويؤدي «المسيح» في العربية المعنى اللقبي لـΧριστός بصورة طبيعية ومألوفة.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: الذين من بيت أَرِسْطُوبُولُس
  rationale: التركيب اليوناني موجز ويدل على جماعة مرتبطة بأرسطوبولس، ويرجح أنهم أهل بيته أو حاشيته لا أرسطوبولس نفسه.
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: في المسيح بوصفه المؤمن به
  rationale: أُبقي التعبير كما هو لصون اتساع العبارة البولسية؛ فلا يُختزل في مجرد وصف أَبِلِّيس بأنه مؤمن، ولا يُحسم وجه العلاقة التي تعبّر عنها «في».
- issue: مدلول δόκιμος في وصف أَبِلِّيس
  choice: المُزَكّى
  alternative: المُختبَر والمقبول
  rationale: «المُزَكّى» تجمع معنى ثبوت الجدارة والاستحسان، مع تجنب التصريح بتفاصيل اختبار لا يذكرها النص.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُخدم «سَلِّموا على» بوصفه التعبير العربي الجاري للتحية، وحُفظ تكراره للموازاة الأسلوبية. ضُبط الاسمان جزئيًا لتيسير القراءة، وأُبقي التعبير اللاهوتي «في المسيح» بلا تفكيك تفسيري.
