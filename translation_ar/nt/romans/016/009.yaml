base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: ar
  text: سَلِّموا على أُوربانوس، العاملِ معنا في المسيح، وعلى ستاخيس حبيبي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: صيغة أمر للجمع، وهي العبارة العربية الطبيعية في سياق قائمة التحيات.
- source_word: Οὐρβανὸν
  choice: أُوربانوس
  rationale: نقل صوتي للاسم الشخصي اليوناني ذي الأصل اللاتيني.
- source_word: τὸν συνεργὸν ἡμῶν
  choice: شريكِنا في العمل
  rationale: ينقل معنى مَن يعمل مع بولس ورفقائه، مع الحفاظ على دلالة المشاركة لا مجرد المساعدة.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحافظ على العبارة البولسية الموجزة وعلى دلالة المجال أو الاتحاد المرتبط بالمسيح، دون حسمها بتفسير أضيق.
- source_word: Στάχυν
  choice: ستاخيس
  rationale: نقل صوتي للاسم الشخصي بحسب صورته اليونانية.
- source_word: τὸν ἀγαπητόν μου
  choice: حبيبي
  rationale: تعبير عربي موجز ودافئ يؤدي معنى المحبوب العزيز في هذا السياق الشخصي.
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: في المسيا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، كما أن إبقاء حرف الجر «في» يصون الاتساع الدلالي للعبارة من غير تحويلها إلى شرح لاهوتي محدد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وكريمة. استُخدم «شريكنا في العمل» بدل تعبير وظيفي حديث مثل «زميلنا» للمحافظة على معنى συνεργός في سياق الخدمة المشتركة.
