  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: ar
  text: سَلِّموا على أَمْبِلِيَاتُس[a]، حبيبي في الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا نقل صيغة الاسم اليوناني «أَمْبِلِيَاس»؛ لكن قراءة SBLGNT هنا تؤيد «أَمْبِلِيَاتُس».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر موجَّه إلى جماعة، وهو التعبير العربي الطبيعي الموجز لنقل التحية في سياق الرسالة.
- source_word: Ἀμπλιᾶτον
  choice: أَمْبِلِيَاتُس
  rationale: نقل صوتي للاسم بحسب قراءة SBLGNT، مع ردّ صيغة النصب اليونانية إلى صورة الاسم المتداولة في العربية.
- source_word: τὸν ἀγαπητόν μου
  choice: حبيبي
  rationale: ينقل بإيجاز حرارة التعبير وضمير المتكلم في اليونانية؛ وهو هنا وصف لشخص عزيز محبوب، لا مجرد لقب رسمي.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ التعبير البولسي وعلاقته بالشركة المسيحية من غير إضافة اسم «يسوع» غير الموجود في النص اليوناني.
theological_decisions:
- issue: دلالة محبة بولس وقوة عبارة ἐν κυρίῳ
  choice: تتعلق عبارة «في الرب» بوصف أَمْبِلِيَاتُس بأنه حبيب بولس ضمن الشركة في الرب.
  alternative: أن تكون العبارة متعلقة بفعل التسليم، أو أن يكون المقصود مجرد صديق عزيز بلا دلالة لاهوتية خاصة.
  rationale: ترتيب اليونانية يربط «حبيبي» و«في الرب» بالاسم على نحو طبيعي، والإبقاء على العبارة كما هي يحفظ إطار المحبة المسيحية من غير حسم زائد لطبيعة هذه العلاقة.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة رسائلية كريمة. استُعمل «سَلِّموا على» بوصفه التعبير العربي المألوف، وحُفظت العبارة البولسية «في الرب» كما هي.
