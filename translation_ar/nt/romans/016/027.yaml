  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: ar
  text: لِلَّهِ الْحَكِيمِ وَحْدَهُ، بِيَسُوعَ الْمَسِيحِ، لَهُ الْمَجْدُ إِلَى الْأَبَدِ. آمِينَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تختتم هذه الآية تمجيد الختام (رومية 16: 25–27). وكما ذُكر في الحاشية على رومية 16: 25، يختلف موضع هذا التمجيد ووروده اختلافًا ملحوظًا بين المخطوطات القديمة، لكنه محفوظ هنا بحسب تقليد أغلبية المخطوطات البيزنطية.'
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: وَحْدَهُ
  rationale: تفيد حصر الحكمة المطلقة في الله، وصياغة «الحكيم وحده» عربية طبيعية وتحافظ على قوة الحصر.
- source_word: διὰ
  choice: بِـ
  rationale: تحافظ على معنى الوساطة في عبارة «بيسوع المسيح» من غير زيادة تفسيرية.
- source_word: Χριστοῦ
  choice: الْمَسِيحِ
  rationale: اللفظ اليوناني لقب معناه «الممسوح»، والمقابل الكتابي العربي المألوف والطبيعي هو «المسيح».
- source_word: ᾧ
  choice: لَهُ
  rationale: يحافظ الضمير على الإحالة النحوية في اليونانية من غير تسمية المرجع صراحة، وبذلك لا تُحسم قسرًا إمكانية عوده إلى الله أو إلى يسوع المسيح.
- source_word: εἰς τοὺς αἰῶνας
  choice: إِلَى الْأَبَدِ
  rationale: تعبير عربي طبيعي عن الاصطلاح اليوناني الحرفي «إلى الدهور»، ويدل هنا على الدوام.
theological_decisions:
- issue: مرجع الضمير في ᾧ
  choice: «لَهُ» من غير تعيين صريح
  alternative: «لله المجد» أو «ليسوع المسيح المجد»
  rationale: تركيب اليونانية يترك قدرًا من الالتباس النحوي؛ لذا تُحفظ الإحالة بالضمير بدل حسمها تفسيريًا.
translation_notes:
  register: عربية فصحى واضحة ووقورة، مع ترتيب يحافظ قدر الإمكان على بنية التمجيد اليونانية. وُضع رمز الحاشية بعد الآية كلها لأنه يتناول التمجيد الختامي وموضعه النصي، لا لفظة بعينها.
