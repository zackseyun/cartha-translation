  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: ar
  text: فإن أمثال هؤلاء لا يخدمون ربنا المسيح، بل بطونهم[a]؛ وبالكلام المعسول والتملّق يخدعون قلوب البسطاء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بطونهم»؛ وهي صورة حية للانقياد إلى الشهوات والمصالح الذاتية.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «الأبرياء» أو «الذين لا خبث فيهم» أو «غير المتنبّهين للخداع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: أمثال هؤلاء
  rationale: تُحيل العبارة إلى الأشخاص المسبّبين للانقسامات المذكورين في الآية السابقة، وتحافظ على قوة الإشارة في اليونانية بصياغة عربية طبيعية.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: ربنا المسيح
  rationale: تنقل κύριος بلقب «الرب»، وتنقل Χριστός بمعناه اللقبي المألوف في العربية «المسيح»، من غير إضافة اسم غير موجود في النص اليوناني.
- source_word: δουλεύουσιν
  choice: يخدمون
  rationale: الفعل يدل على الخدمة أو العبودية لسيّد. «يخدمون» سليمة في هذا السياق وتحافظ على المقابلة بين خدمة الرب وخدمة البطن.
- source_word: κοιλίᾳ
  choice: بطونهم هم
  rationale: تحافظ الترجمة الحرفية على صورة بولس الحسية، مع ضمير الفصل «هم» لتوكيد المقابلة؛ والمقصود أهواؤهم ومصالحهم الذاتية.
- source_word: χρηστολογίας
  choice: الكلام المعسول
  rationale: يدل اللفظ على كلام لطيف حسن الوقع يُستعمل للاستمالة، و«الكلام المعسول» تعبير عربي واضح يلائم سياق الخداع.
- source_word: εὐλογίας
  choice: التملّق
  rationale: مع أن اللفظ قد يدل في غير هذا السياق على البركة أو المديح، فإن اقترانه بالكلام المعسول والخداع يجعله هنا ثناءً استرضائيًا متملقًا.
- source_word: ἐξαπατῶσι
  choice: يخدعون
  rationale: ينقل المعنى المباشر للفعل المركب، وهو التضليل والخداع، بصياغة عربية طبيعية.
- source_word: καρδίας
  choice: قلوب
  rationale: تحافظ على صورة «القلب» بوصفه باطن الإنسان ومركز استجابته، من غير قصر المعنى على الفكر وحده.
- source_word: ἀκάκων
  choice: البسطاء
  rationale: الصفة تحتمل الأبرياء أو الذين لا خبث فيهم أو غير المتنبهين للخداع. «البسطاء» تحفظ براءتهم وقابليتهم للاستغفال، مع بيان البدائل في الحاشية.
theological_decisions:
- issue: نقل اللقب Χριστός في عبارة بولسية
  choice: المسيح
  alternative: الكريستوس
  rationale: Χριστός لقب معناه «الممسوح»، والمقابل العربي الراسخ والدال على اللقب هو «المسيح»، لا صيغة اسمية منقحرة. لم تُضف الترجمة «يسوع» لأنه غير وارد في النص اليوناني.
- issue: دلالة خدمة البطن
  choice: الإبقاء على الصورة الحرفية «بطونهم»
  alternative: شهواتهم أو مصالحهم الذاتية
  rationale: الصورة تحتمل نطاقًا أوسع من الشهوة الجسدية وحدها، فتشمل الانقياد إلى الرغبات والمصلحة الذاتية؛ لذلك أُبقي التوتر المجازي من غير تضييق لاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صورة «البطن» وقوة المقابلة في الأصل، واستُعمل «الكلام المعسول والتملّق» لنقل النبرة الاستدراجية في اللفظين اليونانيين من غير إطالة تفسيرية داخل المتن.
