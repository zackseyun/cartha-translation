lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر موجَّه إلى جماعة، ويُستعمل في الرسائل لنقل التحية؛ وهذه هي الصياغة العربية الطبيعية الموجزة.
- source_word: Μαριάμ
  choice: مريم
  rationale: الصيغة العربية المألوفة للاسم الكتابي Μαριάμ.
- source_word: ἥτις
  choice: التي
  rationale: تصل جملة وصفية بمريم بصورة طبيعية، من غير تحميل الضمير دلالة زائدة غير لازمة.
- source_word: πολλὰ
  choice: كثيرًا
  rationale: جاءت حالًا للدلالة على مقدار التعب وشدته، وتحافظ «كثيرًا» على التعبير اليوناني الموجز.
- source_word: ἐκοπίασεν
  choice: تعبت
  rationale: يفيد الفعل بذل جهد شاق في العمل؛ و«تعبت» تعبير عربي كتابي واضح يجمع معنى العمل والمشقة.
- source_word: εἰς ὑμᾶς
  choice: لأجلكم
  rationale: ينقل اتجاه العمل نحو المخاطَبين ومنفعتهم، وفق قراءة النص اليوناني المعتمد.
theological_decisions:
- issue: الاختلاف النصي في العبارة الأخيرة
  choice: لأجلكم
  alternative: لأجلنا؛ أو بينكم
  rationale: 'يتبع المتن قراءة SBLGNT: εἰς ὑμᾶς، مع حفظ القراءات الأخرى ذات الدلالة في الحاشية دون ترجيح لاهوتي إضافي.'
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدم «تعبت كثيرًا» للمحافظة على قوة κοπιάω مع إيجاز الأصل، وأُثبتت علامة الحاشية بعد اسم مريم كما في طبقة المراجعة الإنجليزية.
