id: ROM.16.16
reference: Romans 16:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: ar
  text: سلِّموا بعضكم على بعض بقبلة مقدسة.[a] تسلِّم عليكم جميع كنائس المسيح.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كانت «القبلة المقدسة» تحية معروفة ثقافيًا، تعبّر بين المؤمنين عن المودة الطاهرة والشركة.
    reason: cultural_note
  - marker: b
    text: تصف عبارة «كنائس المسيح» الكنائس بأنها منتسبة إلى المسيح وتابعة له.
    reason: translation_note
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: سلِّموا بعضكم على بعض
  rationale: صيغة أمر تدعو المؤمنين إلى تبادل التحية؛ وهذا التعبير عربي طبيعي يحفظ معنى الفعل وضمير التبادل.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: بقبلة مقدسة
  rationale: الباء تؤدي المعنى الوسيلي أو المصاحب لحرف ἐν، و«قبلة مقدسة» تنقل وصف التحية بأنها طاهرة ومكرسة ضمن شركة المؤمنين.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: تسلِّم عليكم
  rationale: صياغة رسائلية عربية طبيعية تؤدي معنى توجيه التحية إلى المخاطبين، وهم جماعة بصيغة الجمع.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: جميع كنائس
  rationale: تحفظ شمول πᾶσαι مع ترتيب عربي واضح وموجز.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي المباشر للقب Χριστός، ويحفظ دلالة الملكية أو الانتساب في «كنائس المسيح».
theological_decisions:
- issue: دلالة τοῦ Χριστοῦ
  choice: كنائس المسيح
  alternative: الكنائس التابعة للمسيح
  rationale: الإضافة العربية تحفظ بإيجاز مجال الدلالة في صيغة المضاف إليه، بما يشمل الانتساب والانتماء، من غير توسيع تفسيري يحسم طبيعة العلاقة أكثر مما يفعل النص.
- issue: طبيعة «القبلة المقدسة»
  choice: الإبقاء على العبارة كما هي مع حاشية ثقافية
  alternative: استبدالها بتحية لائقة أو حميمة
  rationale: النص يذكر قبلة فعلية بوصفها تحية مقدسة؛ لذلك لا تُستبدل بعرف حديث، وتوضح الحاشية وظيفتها الاجتماعية دون تحويلها إلى حكم طقسي أو مذهبي.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وموقرة. استُخدمت «سلِّموا» و«تسلِّم عليكم» بوصفهما تعبيري تحية طبيعيين في العربية الرسائلية، مع إبقاء الصورة الثقافية الأصلية «قبلة مقدسة» وعدم تكييفها إلى عرف حديث.
