base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: ar
  text: فَإِنَّ طَاعَتَكُمْ قَدْ بَلَغَتِ الْجَمِيعَ[a]؛ لِذَلِكَ أَفْرَحُ بِكُمْ[b]. وَلَكِنِّي أُرِيدُ أَنْ تَكُونُوا حُكَمَاءَ فِي الْخَيْرِ، وَأَبْرِيَاءَ مِنَ الشَّرِّ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد صار خبر طاعتكم معروفًا لدى الجميع». واليونانية تقول حرفيًا: «بلغت طاعتكم الجميع».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أفرح بسببكم».'
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا ترجمة «أبرياء» بـ«أنقياء» أو «بلا مكر» في ما يتعلق بالشر.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: طاعتكم
  rationale: يدل الاسم في الاستعمال البولسي هنا على الاستجابة المطيعة، لا على مجرد السماع.
- source_word: ἀφίκετο εἰς πάντας
  choice: قد بلغت الجميع
  rationale: يحافظ هذا التعبير على الصورة اليونانية الحرفية، أي وصول طاعتهم إلى الجميع، مع إمكان فهمه سياقيًا على أنه ذيوع خبرها.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: أفرح بكم
  rationale: الباء العربية طبيعية مع الفرح، وتُبقي العبارة محتملة للفرح بهم أو بسببهم.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: حكماء في ما هو صالح
  rationale: ينقل معنى الحكمة العملية والتمييز الموجَّه إلى مجال الخير، ويحافظ على البنية المتوازية.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: أبرياء مما هو شرير
  rationale: ينقل معنى النقاء وعدم التلوث بالشر، من غير أن يوحي بالسذاجة أو الجهل المحض.
theological_decisions:
- issue: نطاق πάντας
  choice: الجميع
  alternative: جميع الناس؛ صار معروفًا لدى الجميع
  rationale: أُبقي الاتساع البلاغي للنص من غير تقييده بجماعة بعينها أو تحويله إلى تقرير رياضي مطلق.
- issue: التقابل الأخلاقي بين σοφούς وἀκεραίους
  choice: حكماء في ما هو صالح، وأبرياء مما هو شرير
  alternative: فطناء للخير وبسطاء تجاه الشر؛ حكماء للخير وأنقياء من الشر
  rationale: يحفظ الاختيار التوتر بين التمييز الناضج في الخير وعدم التلوث بالشر، من دون استيراد مفهوم السذاجة.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «فإن» لربط γάρ بالسياق السابق، وحُفظ التوازي الأخلاقي مع تلطيف الحرفية حيث تقتضي العربية الطبيعية.
