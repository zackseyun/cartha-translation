revisions:
- from: فَإِنَّ طَاعَتَكُمْ قَدْ بَلَغَتِ الْجَمِيعَ[a]؛ لِذَلِكَ أَفْرَحُ بِكُمْ[b]. وَلَكِنِّي أُرِيدُكُمْ أَنْ تَكُونُوا حُكَمَاءَ فِي مَا هُوَ صَالِحٌ، وَأَبْرِيَاءَ مِمَّا هُوَ شِرِّيرٌ[c].
  to: فَإِنَّ طَاعَتَكُمْ قَدْ بَلَغَتِ الْجَمِيعَ[a]؛ لِذَلِكَ أَفْرَحُ بِكُمْ[b]. وَلَكِنِّي أُرِيدُ أَنْ تَكُونُوا حُكَمَاءَ فِي الْخَيْرِ، وَأَبْرِيَاءَ مِنَ الشَّرِّ[c].
  rationale: استُبدل «ما هو صالح/ما هو شرير» بـ«الخير/الشر» للمحافظة على المقابلة الاسمية المباشرة في اليونانية ولتحقيق عربية معاصرة أوضح. واستُبدل «مما هو شرير» بـ«من الشر» ليعبّر طبيعيًا عن ἀκεραίους εἰς τὸ κακόν دون إضافة معنى أو فقدان الغموض التفسيري. كما سُوِّيت صياغة فعل الإرادة إلى التركيب العربي الأفصح.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: طاعتهم ذاع صيتها، والكاتب يفرح بهم، ويحثهم على الحكمة في الخير والبراءة من الشر. لكن «مِمّا هو شرير» أضيق وأقل طبيعية من المقابل اليوناني الاسمي τὸ κακόν («الشر»)، كما أن «أريدكم أن تكونوا» أقل سلاسة في الفصحى المعاصرة من «أريد أن تكونوا».'
  naturalness: الصياغة فصيحة في معظمها، غير أن «حكماء في ما هو صالح، وأبرياء مما هو شرير» ثقيلة وغير متوازنة. «حكماء في الخير، وأبرياء من الشر» أوضح وأكثر طبيعية، ويحفظ التقابل الأخلاقي المقصود.
  terminology: «طاعتكم» مناسبة لـὑπακοή، و«أفرح بكم» مناسبة لـἐφ’ ὑμῖν χαίρω. ويُفضَّل «الخير/الشر» على «ما هو صالح/ما هو شرير» لأن اليونانية تستعمل الاسمين المعرّفين في تقابل مباشر، ولأنهما المصطلحان العربيان الكتابيان الطبيعيان هنا.
  issues:
  - severity: medium
    issue: التعبير «مما هو شرير»
    rationale: التركيب غير طبيعي نسبيًا، ويحوّل «الشر» اليوناني الاسمي إلى وصف «شرير»؛ كما أن «من الشر» ينقل البراءة وعدم التلوث بالشر بوضوح وسلاسة.
  - severity: low
    issue: التعبير «أريدكم أن تكونوا»
    rationale: مفهوم، لكنه أقل سلاسة في العربية الفصحى المعاصرة من «أريد أن تكونوا»، ولا يلزم إظهار المفعول اليوناني في العربية.
