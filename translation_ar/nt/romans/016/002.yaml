base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: ar
  text: لكي تستقبلوها في الرب استقبالًا يليق بالقديسين، وتقفوا إلى جانبها في أيّ أمر تحتاج فيه إليكم، لأنها هي نفسها كانت محسنةً إلى كثيرين[a]، وإليَّ أنا أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «داعمةً لكثيرين» أو «نصيرةً لكثيرين». يدل اللفظ اليوناني على امرأة كانت تقدّم دعمًا أو إحسانًا للآخرين، وقد يحمل معنى الرعاية الاجتماعية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: تقبلوها
  rationale: يفيد الفعل استقبال فيبي بترحاب وقبول داخل الجماعة؛ و«تقبلوها» يحافظ على معنى الاستقبال الحسن بصياغة عربية طبيعية.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ التعبير البولسي الدال على دائرة الشركة والعلاقة بالرب من غير تفسير زائد.
- source_word: ἀξίως τῶν ἁγίων
  choice: قبولًا يليق بالقديسين
  rationale: ينقل معنى الكيفية في ἀξίως بعبارة عربية سلسة، مع إبقاء المصطلح البولسي «القديسين».
- source_word: παραστῆτε αὐτῇ
  choice: تقفوا إلى جانبها
  rationale: يحفظ الصورة الأصلية ومعنى مؤازرتها عمليًا، من غير تحديد نوع المساعدة.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: في أيّ أمر تحتاج فيه إليكم
  rationale: «أمر» واسع بما يكفي لمعاني πρᾶγμα، والتركيب يبين أن حاجتها متعلقة بمؤازرتهم.
- source_word: προστάτις
  choice: نصيرة
  rationale: ينقل معنى امرأة تنهض بدعم الآخرين ومساندتهم، مع إبقاء احتمال الإعانة والحماية والرعاية الاجتماعية من غير افتراض منصب كنسي.
- source_word: ἐγενήθη
  choice: كانت
  rationale: العربية الطبيعية هنا تعبّر بـ«كانت» عن الدور الذي ثبت أنها اضطلعت به، مع بقاء أثره حاضرًا في سياق التوصية.
- source_word: ἐμοῦ αὐτοῦ
  choice: ولي أنا أيضًا
  rationale: يحفظ توكيد المتكلم في αὐτοῦ والقوة الإضافية لـκαί بتركيب عربي واضح.
theological_decisions:
- issue: وصف فيبي بلفظ προστάτις
  choice: نصيرة
  alternative: محسنة، راعية، حامية
  rationale: اللفظ اليوناني قد يشير إلى دور ذي شأن في الدعم أو الرعاية، وربما إلى الإحسان أو الحماية ضمن العلاقات الاجتماعية. اختيرت «نصيرة» لأنها لا تضعف دور فيبي إلى مجرد مساعدة عابرة، ولا تحسمه في لقب مؤسسي أو كنسي غير مصرّح به.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. حُفظ التعبير البولسي «في الرب» ومصطلح «القديسين»، واستُعملت «تقفوا إلى جانبها» للمحافظة على صورة المؤازرة في الأصل. وُضعت الحاشية عند «نصيرة» لأن المقابل العربي لا يستوعب وحده كامل المجال الاجتماعي للفظ προστάτις.
