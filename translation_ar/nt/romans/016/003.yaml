  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: ar
  text: سَلِّموا على بريسكا[a] وأكيلا، العاملَين معي في المسيح يسوع،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: بريسكا هي صيغة الاسم الواردة هنا؛ أما «بريسكلا» فهي صيغة أخرى أشهر للاسم نفسه، وردت في مواضع أخرى.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر للجمع يُستعمل في الرسائل لطلب إبلاغ السلام، وهذه هي الصياغة العربية الطبيعية الموجزة.
- source_word: Πρίσκαν
  choice: بريسكا
  rationale: نقلٌ للاسم الوارد في النص اليوناني بصيغته «بريسكا»، لا بصيغة «بريسكلا» المعروفة من مواضع أخرى.
- source_word: Ἀκύλαν
  choice: أكيلا
  rationale: النقل العربي المألوف للاسم اليوناني Ἀκύλας.
- source_word: συνεργούς μου
  choice: العاملَين معي
  rationale: يحفظ معنى المشاركة في العمل، وتُظهر صيغة المثنى أن الوصف يعود إلى بريسكا وأكيلا معًا.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: تحفظ العبارة معنى المجال أو الاتحاد الذي يجري فيه العمل المشترك، كما أن «المسيح» تؤدي في العربية معنى اللقب Χριστός بصورة طبيعية.
theological_decisions:
- issue: دلالة Χριστῷ في الصيغة البولسية ἐν Χριστῷ Ἰησοῦ
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός ويحفظ دلالته المسيانية، أما «الممسوح» فحرفي لكنه غير طبيعي هنا وقد يوهم بأنه وصف عام. ولا يلزم هامش يوازن بين Messiah وChrist لأن العربية تعبّر عنهما بلفظ «المسيح» نفسه.
translation_notes:
  register: لغة عربية فصحى واضحة وموجزة. استُخدم المثنى في «العاملَين» لمطابقة الشخصين المذكورين، وحُفظ ترتيب «المسيح يسوع» كما في اليونانية.
