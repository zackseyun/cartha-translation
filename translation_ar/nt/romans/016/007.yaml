id: ROM.16.7
reference: Romans 16:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: ar
  text: سَلِّموا على أندرونيقوس ويونيا[a]، قريبَيَّ[b] ورفيقَيَّ في الأسر. فهما بارزان بين الرسل[c]، وقد كانا في المسيح قبلي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«يونيا»: ويجوز أن يُقرأ الاسم «يونياس» على أنه اسم مذكر، لكن الاسم المؤنث أرجح بحسب الصيغة اليونانية والاستعمال التاريخي.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية قريبين بالنسب أو شخصين من قوم بولس، أي من اليهود.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «مَعروفان لدى الرسل». وقد يُفهم التعبير أيضًا بمعنى «متميّزان بين الرسل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: صيغة أمر رسائلية مباشرة وطبيعية في العربية، تؤدي معنى إبلاغ السلام.
- source_word: Ἀνδρόνικον
  choice: أندرونيقوس
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة.
- source_word: Ἰουνίαν
  choice: يونيا
  rationale: الصيغة اليونانية تُفهم على الأرجح اسمًا مؤنثًا معروفًا تاريخيًا؛ ويُذكر الاحتمال المذكر في الحاشية.
- source_word: συγγενεῖς μου
  choice: قريبَيَّ
  rationale: يحافظ على معنى صلة القربى من غير أن يحسم هل المقصود قرابة عائلية أم انتماء قومي أوسع؛ وقد وُضِّح المجال الدلالي في الحاشية.
- source_word: συναιχμαλώτους μου
  choice: رفيقَيَّ في الأسر
  rationale: تعبير عربي طبيعي ينقل معنى الاشتراك مع بولس في الأسر.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: بارزان بين الرسل
  rationale: ينقل الدلالة الأساسية للمكانة والاشتهار مع إبقاء تركيب «بين الرسل» ظاهرًا؛ وتعرض الحاشية الفهم النحوي البديل.
- source_word: πρὸ ἐμοῦ
  choice: قبلي
  rationale: ينقل بوضوح الأسبقية الزمنية.
- source_word: γέγοναν ἐν Χριστῷ
  choice: كانا في المسيح
  rationale: يحافظ على العبارة البولسية «في المسيح» ولا يحولها إلى شرح تفسيري عن الإيمان أو الاهتداء.
theological_decisions:
- issue: هوية Ἰουνίαν وجنس الاسم
  choice: يونيا، اسم مؤنث
  alternative: يونياس، اسم مذكر
  rationale: الشكل اليوناني والاستعمال التاريخي يرجحان الاسم المؤنث، مع إثبات البديل التاريخي في الحاشية دون جعله قراءة النص الأساسية.
- issue: دلالة ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: بارزان بين الرسل
  alternative: معروفان لدى الرسل
  rationale: التركيب يُفهم بصورة مباشرة على أنه مكانة بارزة بين الرسل، لكنه قد يدل على أنهما معروفان لدى الرسل؛ لذلك لا تُطمس المسألة بل تُعرض في الحاشية.
- issue: دلالة «في المسيح»
  choice: الإبقاء على التعبير «في المسيح»
  alternative: آمنا بالمسيح أو صارا مؤمنين قبلي
  rationale: العبارة ذات حمولة اتحادية ولاهوتية أوسع من مجرد صياغة صريحة للاهتداء، فحُفظت كما هي دون تضييق معناها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغتا المثنى لأن الحديث عن أندرونيقوس ويونيا، وأُبقي التعبير البولسي «في المسيح» على صورته. وُضعت علامات الحواشي كلها في المتن.
