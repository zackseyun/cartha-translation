base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: ar
  text: سَلِّموا على هيروديون، قريبي[a]. وسَلِّموا على الذين من نركسوس[b]، الذين هم في الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني أيضًا «واحدًا من قومي». فاللفظة اليونانية قد تدل على قريب بالنسب أو على شخص من شعب بولس.
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن المقصود أشخاص من أهل بيت نركسوس أو من العاملين في أملاكه، ممن هم مؤمنون.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: صيغة أمر للجمع، وهذا هو التعبير العربي الطبيعي في سياق التحيات الواردة في الرسائل.
- source_word: Ἡρῳδίωνα
  choice: هيروديون
  rationale: نقل صوتي للاسم اليوناني وفق الصيغة العربية الواضحة والمتداولة لأسماء العهد الجديد.
- source_word: συγγενῆ μου
  choice: قريبي
  rationale: تنقل المعنى الأساسي من غير تحديد درجة القرابة، مع بيان إمكان دلالة اللفظة عند بولس على واحد من قومه في الحاشية.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: الذين من جماعة نركسوس
  rationale: تعبير مفهوم يدل على المنتسبين إلى نركسوس أو المرتبطين به، من غير أن يضيف صراحةً كلمة «بيت» أو «أهل بيت» غير الموجودة في اليونانية.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: مَن هم في الرب
  rationale: يحفظ التعبير البولسي «في الرب» ويبيّن أن التحية تخص الذين ينطبق عليهم هذا الوصف من جماعة نركسوس.
- source_word: κυρίῳ
  choice: الرب
  rationale: المقابل العربي المألوف والدقيق للفظ κύριος في هذا التعبير البولسي.
theological_decisions:
- issue: دلالة συγγενής في تحيات بولس
  choice: قريبي
  alternative: واحد من قومي؛ أو نسيبي
  rationale: يمكن أن تشير اللفظة إلى قريب بالنسب، كما يمكن أن تتسع عند بولس لتشير إلى واحد من شعبه. أبقى النص الرئيس على لفظ موجز، وتوضح الحاشية الاحتمال الآخر بدل حسمه.
- issue: هوية المرتبطين بنركسوس
  choice: الذين من جماعة نركسوس
  alternative: الذين من أهل بيت نركسوس؛ أو التابعون لنركسوس
  rationale: يدل التركيب اليوناني على الارتباط بنركسوس، لكنه لا يذكر «البيت» صراحة. لذلك تجنبت الترجمة إضافة هذا التحديد إلى المتن، مع ذكره بوصفه الاحتمال الأرجح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «سَلِّموا على» لصيغة التحية، وحُفظ التعبير اللاهوتي البولسي «في الرب». وُضعت علامتا الحاشيتين في المتن عند العبارتين اللتين تحتاجان إلى بيان.
