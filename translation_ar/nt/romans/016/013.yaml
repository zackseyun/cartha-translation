  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: ar
  text: سَلِّموا على روفُس، المختار في الرب[a]، وعلى أمه وأمي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المتميّز في الرب». ويمكن أن تعني الصفة اليونانية أيضًا «المصطفى» أو «الفاضل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر للجمع يفيد توجيه التحية، وهذه الصياغة هي المقابل العربي الطبيعي الموجز في سياق تحيات بولس الختامية.
- source_word: Ῥοῦφον
  choice: روفُس
  rationale: نقل صوتي للاسم الشخصي اليوناني بصيغة عربية واضحة.
- source_word: τὸν ἐκλεκτὸν
  choice: المختار
  rationale: 'ينقل معنى الصفة المعرفة: المختار أو المصطفى، مع إبقاء إمكان فهمها على أنها وصف للتميّز دون حصرها في اصطلاح لاهوتي تقني.'
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحافظ على حرف الجر وعلى دلالة المجال أو العلاقة بالرب، من غير تحويل العبارة إلى «من الرب» أو إضافة «يسوع» غير المذكورة هنا.
- source_word: τὴν μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: أمه وأمي
  rationale: 'يحافظ على الإيجاز والموازاة في الأصل: حرفيًا «أمه وأمي»، ويترك للقارئ استنتاج معنى الأمومة العاطفية أو الرعائية لبولس.'
theological_decisions:
- issue: دلالة ἐκλεκτὸν ἐν κυρίῳ
  choice: المختار في الرب
  alternative: المتميّز في الرب؛ المصطفى في الرب
  rationale: قد تصف العبارة اختيارًا إلهيًا، وقد تحمل معنى الشخص النفيس أو المتميّز في الجماعة المؤمنة. أبقت الترجمة العبارة واسعة ولم تحصرها في نسق عقائدي محدد، وأثبتت البديل المعجمي في الحاشية.
- issue: معنى «أمه وأمي»
  choice: الإبقاء على الصياغة الحرفية الموجزة
  alternative: أمه التي كانت لي بمنزلة أم
  rationale: السياق يرجّح أن بولس يتحدث عن علاقة مودة ورعاية لا عن أمومة بيولوجية مشتركة، لكن النص اليوناني لا يشرح طبيعة العلاقة؛ لذلك تحافظ الصياغة على الإيجاز والغموض الطبيعيين.
translation_notes:
  register: عربية فصحى واضحة وموقرة، بصيغة التحية الرسولية المألوفة. ضُبط اسم «روفُس» جزئيًا لتيسير النطق، واستُعملت «المختار» لأنها طبيعية وتحفظ التوتر بين معنى الاختيار ومعنى التميّز.
