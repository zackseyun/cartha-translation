  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: ar
  text: وأمّا[a] القادر أن يثبّتكم بحسب بشارتي وكرازة يسوع المسيح، بحسب إعلان السرّ الذي ظلّ مكتومًا على مدى عصور طويلة،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشكّل الآيات 25–27 تمجيدًا ختاميًا يَرِد في مواضع مختلفة في المخطوطات القديمة. ففي تقليد الأغلبية البيزنطية يأتي في نهاية الأصحاح 14، وفي أقدم بردية باقية يأتي بعد الأصحاح 15، ويَرِد هنا في نهاية الأصحاح 16 في مخطوطات كبرى من القرن الرابع وفي التقليد اللاتيني. وتورده بعض المخطوطات في أكثر من موضع، بينما تحذفه مخطوطات قليلة تمامًا. وتُبقيه معظم الترجمات الحديثة هنا خاتمةً لرسالة بولس.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: يثبّتكم
  rationale: ينقل معنى جعل المؤمنين راسخين وتقويتهم في الإيمان، ويحافظ على صورة الثبات الواردة في الفعل اليوناني.
- source_word: εὐαγγέλιόν μου
  choice: بشارتي
  rationale: صياغة عربية طبيعية تعكس حرفيًا إضافة البشارة إلى المتكلم من غير أن توحي بأن مضمونها من اختراعه.
- source_word: κήρυγμα
  choice: الكرازة
  rationale: يدل على إعلان الرسالة علنًا، وهو أدق من ألفاظ قد تُفهم على أنها مجرد وعظ أخلاقي.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب اليوناني إلى مقابله العربي المألوف، لا إلى اسم علم مجرد.
- source_word: ἀποκάλυψιν
  choice: إعلان
  rationale: يعبر عن كشف ما كان مستورًا وإظهاره، وهو مناسب لاقترانه بالسر.
- source_word: μυστηρίου
  choice: السرّ
  rationale: يحافظ على المصطلح البولسي الذي يشير إلى قصد إلهي كان مكتومًا ثم أُعلن، لا إلى لغز يتعذر فهمه.
- source_word: σεσιγημένου
  choice: ظلّ مكتومًا
  rationale: يعكس صيغة التام المبني للمجهول وحالة الكتمان الممتدة إلى وقت الإعلان، مع مراعاة اقترانه بالسر.
- source_word: χρόνοις αἰωνίοις
  choice: طوال أزمنة بعيدة
  rationale: ينقل المعنى الزمني الاصطلاحي لفترات غابرة ممتدة، ويتجنب الإيحاء بأن المقصود أزمنة أزلية حرفيًا.
theological_decisions:
- issue: دلالة عبارة «الكرازة بيسوع المسيح»
  choice: الإبقاء على التركيب «الكرازة بيسوع المسيح»
  alternative: «كرازة يسوع المسيح» بمعنى الكرازة التي قام بها يسوع
  rationale: الإضافة اليونانية تحتمل من حيث التركيب أن يكون المسيح موضوع الكرازة أو صاحبها؛ والصياغة المختارة طبيعية في العربية وتبقي قدرًا من هذا الاحتمال بدل حسمه بتوسّع تفسيري.
- issue: وظيفة «السرّ»
  choice: إبقاء «السرّ» بلا شرح داخل المتن
  alternative: تفسيره في المتن بأنه خطة الله للخلاص
  rationale: النص نفسه لا يحدد هنا مضمون السر كاملًا، وسيأتي استكمال الجملة في الآيتين التاليتين؛ لذلك لا ينبغي إدخال تفسير عقدي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «وأمّا القادر» لافتتاح تركيب التمجيد الذي لا يكتمل نحويًا إلا في الآية 27، مع عدم إضافة ظرف زمني لا أصل صريح له. وُضع دليل الحاشية في نهاية الجزء المترجم تجنبًا لفصل أداة الاستدراك عن صلتها.
