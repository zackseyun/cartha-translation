  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: ar
  text: وأوصيكم بأختنا فيبي، وهي أيضًا خادمة للكنيسة التي في كنخريا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνίστημι
  choice: أوصيكم بـ
  rationale: الفعل في سياق تقديم شخص إلى جماعة يفيد التزكية والتوصية به. وهذه الصياغة عربية طبيعية وتحافظ على وظيفة العبارة في الرسالة.
- source_word: δὲ
  choice: وَ
  rationale: تفيد الأداة هنا انتقالًا لطيفًا لا تضادًّا قويًّا، فحُفظت بواو الاستئناف من غير إضافة ظرف زمني مثل «الآن».
- source_word: Φοίβην
  choice: فيبي
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة وشائعة.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: أختنا
  rationale: يحافظ على لغة القرابة الإيمانية المباشرة من غير إدخال تفسير زائد في المتن.
- source_word: οὖσαν καὶ
  choice: وهي أيضًا
  rationale: صياغة عربية طبيعية للجملة الحالية مع الحفاظ على القوة الإضافية لكلمة καί.
- source_word: διάκονον
  choice: شمّاسة
  rationale: يعكس الاحتمال القوي لكون اللفظ دالًا على خدمة معترف بها في جماعة محلية، من غير تحديد بنية كنسية لاحقة؛ ولأن اللفظ قد يُفهم أيضًا بمعنى أعم، أُثبت ذلك في الحاشية.
- source_word: τῆς ἐκκλησίας
  choice: في الكنيسة
  rationale: «الكنيسة» هي المقابل العربي الواضح المعتاد للجماعة المسيحية هنا، واستُعمل حرف «في» لصياغة علاقة الخدمة بالجماعة على نحو عربي طبيعي.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: التي في كنخريا
  rationale: يحافظ على تركيب تحديد الكنيسة بحسب موضعها، مع نقل اسم المكان Κεγχρεαί إلى «كنخريا».
theological_decisions:
- issue: هل يدل διάκονον على منصب كنسي معترف به أم على الخدمة بمعناها العام؟
  choice: شمّاسة
  alternative: خادمة، أو قائمة بخدمة الكنيسة
  rationale: اقتران اللفظ بكنيسة محددة يرجّح وجود علاقة خدمية معترف بها، لكن الكلمة اليونانية نفسها تستطيع أن تدل على من يخدم بوجه عام. لذلك اختيرت «شمّاسة» في المتن مع إبقاء الاحتمالات الأخرى صريحة في الحاشية، من غير إسقاط نظم طائفية لاحقة على النص.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. حُفظ الانتقال الخفيف في δὲ بالواو، وتُركت دلالة διάκονον المحتملة بين الدور الكنسي والخدمة العامة ظاهرة من خلال المتن والحاشية.
