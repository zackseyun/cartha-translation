  rationale: استُبدلت «شمّاسة» بـ«خادمة» في المتن لصون الغموض الدلالي القائم في διάκονον، مع حفظ احتمال الدور الكنسي المعترف به في الحاشية. كما عُدلت علاقة فيبي بالكنيسة من «في الكنيسة» إلى «للكنيسة» لمطابقة الإضافة اليونانية. أُبقيت الواو الافتتاحية، و«وأوصيكم بأختنا فيبي»، واسم «كنخريا» دون تغيير.
