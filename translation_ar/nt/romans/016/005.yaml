base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: ar
  text: وسلِّموا أيضًا على الكنيسة التي في بيتهما[a]. وسلِّموا على أَبَيْنِتُوس، حبيبي، وهو باكورة آسيا للمسيح[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكنيسة التي تجتمع في بيتهما».'
    reason: lexical_alternative
  - marker: b
    text: أي إنه كان أول من آمن بالمسيح في آسيا.
    reason: alternative_reading
  - marker: c
    text: المقصود «آسيا» الولاية الرومانية القديمة، لا قارة آسيا الحديثة.
    reason: cultural_note
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: الكنيسة التي في بيتهما
  rationale: يحافظ على ارتباط الجماعة بالبيت من غير أن يحسم في المتن ما إذا كان المقصود اجتماعها فيه؛ وتوضح الحاشية هذا المعنى المحتمل. جاء الضمير مثنى لأن المرجع في السياق السابق هو أكيلا وبريسكلا.
- source_word: ἀσπάσασθε
  choice: سلِّموا على
  rationale: الصياغة العربية المألوفة في قوائم التحيات الرسولية، وهي دقيقة وموجزة.
- source_word: Ἐπαίνετον
  choice: أَبَيْنِتُوس
  rationale: نقل صوتي للاسم اليوناني إلى العربية مع ضبط يساعد على قراءته.
- source_word: ἀγαπητόν μου
  choice: حبيبي
  rationale: تعبير عربي طبيعي ودافئ يحفظ دلالة المحبة الشخصية في العبارة اليونانية.
- source_word: ἀπαρχὴ
  choice: باكورة
  rationale: تحفظ صورة الباكورة الزراعية والطقسية التي استعملها بولس، بدل اختزالها إلى «أول من آمن».
- source_word: τῆς Ἀσίας
  choice: آسيا
  rationale: صياغة موجزة تتبع الإضافة اليونانية، مع توضيح المقصود الجغرافي التاريخي في الحاشية.
- source_word: εἰς Χριστόν
  choice: للمسيح
  rationale: تنقل علاقة الباكورة بالمسيح أو اتجاهها إليه من غير توسيع تفسيري، وتلائم تركيب «باكورة ... للمسيح».
theological_decisions:
- issue: دلالة Χριστόν
  choice: المسيح
  alternative: المسيح بصفته لقبًا، أو «كريستوس» بوصفه اسمًا منقولًا
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός ويحفظ دلالته المسيانية.
- issue: معنى ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: وهو باكورة آسيا للمسيح
  alternative: وهو أول من آمن بالمسيح في آسيا
  rationale: يحفظ المتن استعارة «الباكورة» والعلاقة الموجزة التي تفيدها εἰς، بينما تورد الحاشية المعنى السياقي المرجح من غير إحلاله محل الصورة الأصلية.
translation_notes:
  register: 'عربية فصحى واضحة ذات نبرة كتابية كريمة. استُخدم «الكنيسة» بمعنى جماعة المؤمنين، وحُفظت استعارة «الباكورة». رُتبت علامتا الحاشيتين [b][c] بحسب ظهورهما المنطقي: تفسير الباكورة ثم تحديد آسيا.'
