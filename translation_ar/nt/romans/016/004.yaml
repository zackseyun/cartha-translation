  rationale: أُعيدت صياغة الشطر الأخير بإظهار فعل الشكر وفاعله الثاني، ليطابق العلاقة النحوية في اليونانية ويكون أوضح عربيًا. واستُبدلت «كنائس الأمم» في المتن بـ«كنائس غير اليهود» لإظهار المعنى البولسي المقصود من τῶν ἐθνῶν بوضوح، مع حفظ الصياغة الحرفية في الحاشية. وبقيت صورة العنق والتثنية العربية، إذ لا تقتضي صيغة «العنق» المفردة في اليونانية التخلي عن التثنية الطبيعية في العربية عند الإحالة إلى شخصين.
