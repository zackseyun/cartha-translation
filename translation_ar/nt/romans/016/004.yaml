lexical_decisions:
- source_word: οἵτινες
  choice: اللذان
  rationale: ضمير موصول وصفي يعود إلى بريسكا وأكيلا، وهما اثنان؛ والتثنية العربية توضح المرجع طبيعيًا.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: من أجل حياتي
  rationale: تشير ψυχή هنا إلى حياة بولس في سياق التعرض لخطر الموت، لا إلى النفس بمعناها غير المادي.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: عرَّضا عنقيهما للموت
  rationale: يحفظ التعبير صورة العنق مع إظهار دلالته الاصطلاحية، أي تعريض النفس لخطر مميت؛ واستُعمل المثنى وفق نظام العربية.
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: ولا أشكرهما أنا وحدي، بل أيضًا
  rationale: يحافظ على توكيد ἐγώ وعلى مقابلة «ليس... وحده، بل أيضًا» بصياغة عربية واضحة.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: جميع الكنائس
  rationale: ينقل شمول الجمع المعرّف في اليونانية.
- source_word: τῶν ἐθνῶν
  choice: الأمم
  rationale: ترجمة مباشرة تحفظ اللفظ البولسي واتساعه، مع بيان المقصود السياقي في الحاشية.
theological_decisions:
- issue: دلالة ψυχή في قول بولس
  choice: الحياة
  alternative: النفس
  rationale: السياق يتحدث عن خطر مميت وعن عمل تضحية أنقذ حياة بولس، ولذلك تدل الكلمة هنا على حياته.
- issue: دلالة ἐθνῶν
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» يحفظ الصياغة اليونانية والتقابل الكتابي، بينما توضح الحاشية أن المراد هنا جماعات المؤمنين من غير اليهود.
- issue: مدى تفسير العبارة الاصطلاحية عن العنق
  choice: عرَّضا عنقيهما للموت
  alternative: وضعا عنقيهما / خاطرا بحياتهما
  rationale: الصياغة المختارة تحفظ الصورة الأصلية ولا تترك العبارة غامضة، من غير اختزالها إلى تفسير مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت صيغ التثنية لأن المرجع بريسكا وأكيلا، وحُفظت صورة «العنق» اليونانية مع توضيح معناها الاصطلاحي في النص والحاشية.
