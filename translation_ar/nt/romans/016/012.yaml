  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: ar
  text: سَلِّموا على تريفينا وتريفوسا، اللتين اجتهدتا في الرب. سَلِّموا على برسيس المحبوبة، التي اجتهدت كثيرًا في الرب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: صيغة أمر للجمع، وهي العبارة العربية الطبيعية الموجزة في قوائم التحيات الرسولية.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: تريفينا وتريفوسا
  rationale: نقل صوتي لاسمي العلم اليونانيين بدل ترجمة مدلولهما الاشتقاقي.
- source_word: τὰς κοπιώσας
  choice: اللتين تعبتا
  rationale: اسم الموصول المثنى المؤنث يبيّن أن الوصف يعود إلى المرأتين، و«تعبتا» ينقل معنى الجهد الشاق ويحافظ على الصلة اللفظية بالفعل اللاحق.
- source_word: κοπιάω
  choice: تعبتا / تعبت
  rationale: الفعل يدل على بذل جهد شاق؛ وتكرار جذر «تعب» في الموضعين يحفظ التكرار المقصود في اليونانية.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ التعبير البولسي وما فيه من دلالة على العلاقة بالرب والعمل ضمن نطاقها، دون تضييقه إلى معنى «لأجل الرب» فقط.
- source_word: Περσίδα
  choice: برسيس
  rationale: نقل صوتي لاسم العلم اليوناني.
- source_word: τὴν ἀγαπητήν
  choice: المحبوبة
  rationale: ينقل أداة التعريف والصفة دون إضافة ضمير ملكية غير موجود في النص اليوناني.
- source_word: ἥτις
  choice: التي
  rationale: موصول مؤنث طبيعي في العربية يربط الوصف ببرسيس دون المبالغة في إبراز النبرة الوصفية المحتملة.
- source_word: πολλὰ
  choice: كثيرًا
  rationale: حال/مفعول مطلق نيابي يعبّر طبيعيًا عن مقدار الجهد الكبير.
- source_word: ἐκοπίασεν
  choice: تعبت
  rationale: الماضي العربي يلائم صيغة الماضي اليونانية ويلخّص جهدها المعروف، مع الحفاظ على التكرار مع «تعبتا».
theological_decisions:
- issue: دلالة ἐν κυρίῳ في وصف الخدمة
  choice: في الرب
  alternative: لأجل الرب / في خدمة الرب
  rationale: «في الرب» يحفظ سعة التعبير البولسي، الذي قد يشير إلى نطاق العلاقة بالرب والاتحاد به، لا إلى الغاية أو الخدمة وحدهما.
- issue: ترجمة τὴν ἀγαπητήν دون إضافة ملكية
  choice: المحبوبة
  alternative: محبوبتي
  rationale: لا يتضمن اليوناني ضميرًا بمعنى «لي»، ولذلك لا تُضاف ملكية قد توحي بعلاقة خاصة لم يصرّح بها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل المثنى المؤنث «اللتين تعبتا» للدقة النحوية، وحُفظ التعبير اللاهوتي «في الرب» والتكرار المعجمي لجذر التعب.
