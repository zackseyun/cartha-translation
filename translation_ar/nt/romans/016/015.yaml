source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: ar
  text: سَلِّموا على فيلولوغُس ويوليا[a]، وعلى نيريوس وأخته، وعلى أولمباس، وعلى جميع القديسين الذين معهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو ربما «يولياس» إذا فُهم الاسم على أنه مذكر؛ غير أن الصيغة اليونانية تُفهم عادةً على أنها الاسم المؤنث «يوليا».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر موجَّه إلى جماعة، وفي سياق الرسالة يعني إبلاغ التحية؛ وهذه الصياغة عربية طبيعية وموجزة.
- source_word: Φιλόλογον
  choice: فيلولوغُس
  rationale: اسم علم نُقل صوتيًا إلى العربية مع إظهار الضمة للمساعدة على ضبط نطقه.
- source_word: Ἰουλίαν
  choice: يوليا
  rationale: صيغة النصب اليونانية تُفهم على الأرجح على أنها الاسم المؤنث «يوليا»؛ ويُذكر الاحتمال المذكر في الحاشية.
- source_word: Νηρέα
  choice: نيريوس
  rationale: اسم علم نُقل وفق صورته الاسمية اليونانية المتعارف عليها، لا وفق علامة النصب الظاهرة في السياق.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: أخته
  rationale: ترجمة عربية مباشرة وطبيعية، والضمير يعود بحسب السياق إلى نيريوس.
- source_word: Ὀλυμπᾶν
  choice: أولمباس
  rationale: اسم علم نُقل وفق صورته الاسمية اليونانية.
- source_word: τοὺς σὺν αὐτοῖς
  choice: الذين معهم
  rationale: يحافظ على دلالة المصاحبة وعلى كون العبارة تصف جماعة من الأشخاص.
- source_word: πάντας ἁγίους
  choice: جميع القديسين
  rationale: «القديسون» تسمية بولسية مألوفة للمؤمنين، وتحفظ المعنى الكنسي للنص من غير توسع تفسيري.
theological_decisions:
- issue: ترجمة ἅγιοι في قائمة التحيات البولسية
  choice: القديسين
  alternative: المقدسين؛ أهل الله القديسين
  rationale: المقصود المؤمنون المرتبطون بالأشخاص المذكورين. وتحفظ «القديسين» استعمال بولس المألوف من غير أن يقتضي ذلك مفهوم إعلان القداسة اللاحق.
- issue: جنس الاسم Ἰουλίαν
  choice: يوليا
  alternative: يولياس
  rationale: الأرجح لغويًا واسميًا أنه الاسم المؤنث «يوليا»، لكن الاحتمال المذكر الذي طُرح في تاريخ الترجمة يُحفظ في حاشية توثيقية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «سَلِّموا على» المألوفة في سياق تحيات الرسائل، مع نقل الأسماء صوتيًا والحفاظ على المصطلح البولسي «القديسين».
