  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: ar
  text: سَلِّموا على أَسِينْكِرِيتُس، وفِلِيغُون، وهِرْمِس، وبَاتْرُوبَاس، وهِرْمَاس، وعلى الإخوة الذين معهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإخوة الذين هم معهم». ويُرجَّح أن العبارة تشير إلى مؤمنين آخرين مرتبطين بهؤلاء الرجال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر للجمع في سياق تحيات ختامية؛ وهذه هي الصياغة العربية الطبيعية الموجزة للتحية في الرسائل.
- source_word: Ἀσύγκριτον
  choice: أَسِينْكِرِيتُس
  rationale: اسم شخص نُقل صوتيًا إلى العربية من اليونانية.
- source_word: Φλέγοντα
  choice: فِلِيغُون
  rationale: اسم شخص نُقل صوتيًا إلى العربية من اليونانية.
- source_word: Ἑρμῆν
  choice: هِرْمِس
  rationale: اسم شخص نُقل صوتيًا، مع تمييزه من الاسم اللاحق Ἑρμᾶν.
- source_word: Πατροβᾶν
  choice: بَاتْرُوبَاس
  rationale: اسم شخص نُقل صوتيًا إلى العربية من اليونانية.
- source_word: Ἑρμᾶν
  choice: هِرْمَاس
  rationale: اسم شخص نُقل صوتيًا بصيغة تميّزه بوضوح من هِرْمِس المذكور قبله.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: الإخوة الذين معهم
  rationale: يحافظ على صيغة المذكر الجمع في ἀδελφούς، وينقل σὺν αὐτοῖς بصياغة عربية واضحة من غير تحديد زائد لطبيعة ارتباطهم بالأشخاص المذكورين.
theological_decisions:
- issue: دلالة ἀδελφούς في التحية الجماعية
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: اللفظ اليوناني مذكر جمع، ولا يصرّح السياق هنا بأن الجماعة مختلطة؛ لذلك حُفظت الصيغة الظاهرة من غير توسيع تفسيري، مع بقاء احتمال أن المقصود مؤمنون مرتبطون بالرجال المذكورين.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت الصيغة الرسولية الطبيعية «سَلِّموا على»، ونُقلت الأسماء عن اليونانية مع ضبط جزئي لتيسير النطق والتمييز بين هِرْمِس وهِرْمَاس.
