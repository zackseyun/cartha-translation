  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: ar
  text: لكنه[a] أُعلِن الآن، وجَرَى التعريف به لدى جميع الأمم بواسطة الكتابات النبوية، بحسب أمر الله الأزلي، من أجل طاعة الإيمان،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية استمرار لتمجيد الختام في رومية 16:25–27. انظر الحاشية على رومية 16:25 بشأن موضع هذا التمجيد وشواهد المخطوطات.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: أُعلِن
  rationale: يفيد إظهار السر الذي كان مكتومًا بحسب الآية السابقة، وصيغة المبني للمجهول تحفظ التركيب اليوناني وإسناد الإعلان ضمنًا إلى الله.
- source_word: γραφαῖς προφητικαῖς
  choice: الكتابات النبوية
  rationale: يحفظ معنى الجمع اليوناني ويدل في السياق على النصوص المقدسة ذات الطابع النبوي، من غير إضافة لفظ غير صريح في الأصل.
- source_word: ἐπιταγήν
  choice: أمر
  rationale: ينقل معنى التوجيه السلطاني الملزم الصادر عن الله.
- source_word: ὑπακοὴν πίστεως
  choice: يطيعوا الإيمان
  rationale: صياغة عربية طبيعية نسبيًا تحفظ الصلة المقصودة بين الطاعة والإيمان، مع بقاء احتمال أن تكون الإضافة بمعنى الطاعة النابعة من الإيمان أو الطاعة التي تتمثل في الإيمان.
- source_word: ἔθνη
  choice: الأمم
  rationale: يعكس المعنى الشامل للكلمة هنا، حيث يمتد التعريف بالسر إلى جميع الشعوب.
- source_word: αἰωνίου θεοῦ
  choice: الله الأزلي
  rationale: يعبّر عن دوام الله وأزليته بلغة عربية لاهوتية واضحة ومألوفة.
theological_decisions:
- issue: دلالة ὑπακοὴν πίστεως
  choice: يطيعوا الإيمان
  alternative: طاعة الإيمان / الطاعة الناتجة عن الإيمان
  rationale: التعبير اليوناني يحتمل أكثر من علاقة بين الطاعة والإيمان؛ لذلك تجنبتُ حصره صراحة في تفسير سببي واحد، مع اختيار تركيب فعلي مفهوم في العربية.
- issue: مرجع صيغتي اسم المفعول φανερωθέντος وγνωρισθέντος
  choice: إبقاء «السر» مفهومًا من رومية 16:25 دون تكراره
  alternative: ولكن السر أُعلن الآن...
  rationale: الأصل يواصل الجملة السابقة ويعود نحويًا إلى «السر» المذكور فيها؛ عدم تكرار الاسم يحافظ على ترابط التمجيد وبنيته، وإن كانت العربية تعتمد هنا على السياق السابق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على كون الآية جزءًا من جملة ممتدة من الآية 25، وعلى التوازي بين «أُعلن» و«عُرِّف به»، مع وضع علامة الحاشية في نهاية نص الآية.
