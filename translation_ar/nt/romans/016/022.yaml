  source_fidelity: 'ينقل النص عناصر اليونانية كلها بأمانة: فعل التحية، والمخاطَب الجمع، وإبراز المتكلم «أنا ترتيوس»، ووصفه بأنه الذي كتب الرسالة، وعبارة «في الرب». ووضع العبارة الأخيرة بعد الجملة الرئيسة يجعل تعلّقها بالتحية هو الفهم الأرجح، من غير إلغاء إمكان تعلّقها بالكتابة.'
  naturalness: «أُسَلِّمُ عليكم» تعبير فصيح واضح ومناسب لخاتمة رسالة، والتركيب «أنا تَرْتِيُوس، الذي كتب الرسالة» عربي سليم ومقروء. علامات الترقيم تخدم الفهم ولا تثقل العبارة.
  terminology: «الرب» مقابل ثابت ومناسب لـκυρίῳ، و«الرسالة» مقابل طبيعي لـἐπιστολή. ونقل الاسم «تَرْتِيُوس» مناسب للاستعمال العربي وللصيغة اليونانية.
