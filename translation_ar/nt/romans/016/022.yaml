  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: ar
  text: أُسَلِّمُ عليكم أنا تَرْتِيُوس، الذي كتب الرسالة، في الرب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز، وإن كان أقل احتمالًا: «أنا تَرْتِيُوس، الذي كتب الرسالة في الرب، أُسَلِّمُ عليكم». فالعبارة اليونانية «في الرب» قد تتعلق بـ«كتب»، لكنها تتعلق بالتحية على نحو أرجح.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: أُسَلِّمُ عليكم
  rationale: تعبير عربي طبيعي وموجز عن توجيه التحية في خاتمة الرسالة، من غير إضافة معنى الود أو الحرارة غير المصرح به.
- source_word: ὑμᾶς
  choice: عليكم
  rationale: ضمير جمع للمخاطبين، ويتضح عدده في اللاحقة العربية.
- source_word: ἐγὼ Τέρτιος
  choice: أنا تَرْتِيُوس
  rationale: يحفظ الضمير الصريح مع الاسم، فيبرز بوضوح أن ترتيوس نفسه يتكلم.
- source_word: ὁ γράψας
  choice: الذي كتب
  rationale: ينقل اسم الفاعل اليوناني الماضي بصلة موصولية عربية طبيعية، ويعرّف ترتيوس بأنه من تولّى كتابة الرسالة.
- source_word: τὴν ἐπιστολήν
  choice: الرسالة
  rationale: المقابل العربي المعاصر والدقيق، مع الحفاظ على أداة التعريف في الأصل من غير إضافة اسم إشارة.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ العبارة البولسية الموجزة كما هي، ويرجّح تعلقها بالتحية مع إبقاء إمكان تعلقها بالكتابة في الحاشية.
theological_decisions:
- issue: تعلّق عبارة «في الرب»
  choice: 'جُعلت في آخر الجملة بحيث تُفهم على الأرجح وصفًا للتحية: يسلّم ترتيوس عليهم في الرب.'
  alternative: 'يمكن أن تتعلق بعبارة «الذي كتب الرسالة»، أي: «الذي كتب الرسالة في الرب».'
  rationale: السياق الختامي للرسالة يرجّح تعلقها بفعل التحية، لكن ترتيب اليونانية يسمح بتعلقها بالكتابة؛ لذلك لم تُحسم المسألة بتفسير زائد، وذُكر الوجه الآخر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «أُسَلِّمُ عليكم» بوصفه التعبير الرسائلي الطبيعي، وحُفظ الاسم بصيغة «تَرْتِيُوس». وُضعت فاصلتان حول الصلة لتقليل احتمال تعلق «في الرب» بالكتابة في المتن، مع توثيق الاحتمال النحوي الآخر في الحاشية.
