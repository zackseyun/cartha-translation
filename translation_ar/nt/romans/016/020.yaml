  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: ar
  text: وَإِلَهُ السَّلَامِ سَيَسْحَقُ الشَّيْطَانَ تَحْتَ أَقْدَامِكُمْ عَمَّا قَرِيبٍ. لِتَكُنْ نِعْمَةُ رَبِّنَا يَسُوعَ الْمَسِيحِ مَعَكُمْ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: وَإِلَهُ السَّلَامِ
  rationale: يحفظ اللقب الإضافي البولسي بصياغة عربية مألوفة، وتؤدي الواو وظيفة δέ الانتقالية في السياق.
- source_word: συντρίψει
  choice: سَيَسْحَقُ
  rationale: صيغة مستقبلية صريحة تلائم صورة إخضاع العدو تحت الأقدام وتحفظ قوة الفعل اليوناني.
- source_word: τὸν Σατανᾶν
  choice: الشَّيْطَانَ
  rationale: «الشيطان» هو المقابل العربي الكتابي الراسخ للاسم Σατανᾶς، ويحمل أصلًا معنى الخصم من غير حاجة إلى شرح داخل المتن.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: تَحْتَ أَقْدَامِكُمْ
  rationale: يحفظ صورة النصر والإخضاع، كما يحفظ ضمير الجمع الموجَّه إلى جماعة المؤمنين.
- source_word: ἐν τάχει
  choice: عَمَّا قَرِيبٍ
  rationale: تعبير عربي طبيعي يدل هنا على قرب الزمن، مع تجنب حصر العبارة في سرعة كيفية التنفيذ.
- source_word: ἡ χάρις
  choice: نِعْمَةُ
  rationale: يحفظ المصطلح البولسي المركزي في صيغة البركة الختامية.
- source_word: τοῦ κυρίου ἡμῶν
  choice: رَبِّنَا
  rationale: ينقل الإضافة والضمير الجمعي بإيجاز عربي طبيعي.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «المسيح» هو المقابل العربي المعياري Χριστός، ويظل في العربية صالحًا للقب والاستعمال الاسمي معًا من غير افتعال تمييز غير موجود في الصياغة العربية المألوفة.
- source_word: μεθ’ ὑμῶν
  choice: مَعَكُمْ
  rationale: المقابل الطبيعي لعبارة البركة، مع إظهار فعل الدعاء «لتكن» الذي يفهم من الجملة الاسمية اليونانية.
theological_decisions:
- issue: دور جماعة المؤمنين في سحق الشيطان
  choice: «سيسحق الشيطان تحت أقدامكم»
  alternative: «سيسحق الشيطان تحت قدميه» أو صياغة تجعل الله وحده موضع صورة الأقدام
  rationale: النص يجعل الله فاعل السحق، لكنه يقول صراحة «تحت أقدامكم» بالجمع؛ لذلك حُفظ التوتر بين فعل الله ومشاركة الجماعة في صورة الانتصار من غير تفسير زائد.
- issue: دلالة Χριστοῦ في البركة الختامية
  choice: «المسيح»
  alternative: اعتباره اسمًا جامدًا بلا دلالة لقبية، أو شرحه «المسيّا» داخل المتن
  rationale: «المسيح» في العربية المقابل الكتابي الطبيعي الذي يحفظ الدلالة اللقبية ويعمل أيضًا ضمن الاسم المركب المألوف، فلا يلزم حسم وظيفته بأكثر مما يسمح به النص.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، مع ضبط كامل للنص. استُعملت «عمّا قريب» للدلالة الزمنية الطبيعية، وحُفظ خطاب الجمع. لا توجد في بيانات SBLGNT المقدمة ملاحظة نصية تستدعي حاشية عربية؛ والحاشية الإنجليزية المرفقة تبدو مرتبطة بخيار ترجمة Χριστός في الإنجليزية لا بقراءة يونانية بديلة ظاهرة هنا.
