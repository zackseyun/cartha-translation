translation:
  language: ar
  text: بِلَا فَهْمٍ، نَاكِثِينَ لِلْعُهُودِ[a]، بِلَا مَحَبَّةٍ لِأَهْلِهِمْ[b]، بِلَا رَحْمَةٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «غير أوفياء» أو «ناقضين للاتفاقات».
    reason: lexical_alternative
  - marker: b
    text: المقصود على الأرجح انعدام المودة الطبيعية، ولا سيما المحبة بين أفراد الأسرة.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: بِلَا فَهْمٍ
  rationale: يفيد اللفظ انعدام الفهم والتمييز، ولا يقتصر على ضعف الذكاء. وهذه الصياغة موجزة وطبيعية وتحافظ على البعد الأخلاقي والعقلي.
- source_word: ἀσυνθέτους
  choice: نَاكِثِينَ لِلْعُهُودِ
  rationale: يدل اللفظ على من لا يلتزم بالاتفاق أو العهد. واختيار «ناكثين للعهود» يعبّر بوضوح عن عدم الوفاء بالالتزامات من غير حصره في عهد ديني بعينه.
- source_word: ἀστόργους
  choice: بِلَا مَحَبَّةٍ لِأَهْلِهِمْ
  rationale: ينفي اللفظ المودة الطبيعية، ولا سيما المحبة العائلية. والتعبير المختار يوضح هذا المعنى المقصود بلغة عربية مفهومة.
- source_word: ἀνελεήμονας
  choice: بِلَا رَحْمَةٍ
  rationale: يعني اللفظ انعدام الرحمة والشفقة، وهذه العبارة هي المقابل العربي المباشر والطبيعي.
