  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: ar
  text: لِذَلِكَ أَسْلَمَهُمُ اللهُ إِلَى أَهْوَاءٍ مُخْزِيَةٍ؛ فَإِنَّ حَتَّى نِسَاءَهُمْ اسْتَبْدَلْنَ الْعَلَاقَةَ الطَّبِيعِيَّةَ بِمَا هُوَ مُخَالِفٌ لِلطَّبِيعَةِ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «إناثهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو حرفيًّا: «الاستعمال الطبيعي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لذلك
  rationale: أداة سببية استنتاجية واضحة تصل الآية بما سبق وتحفظ معنى «بسبب هذا» بإيجاز طبيعي.
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: أسلمهم الله
  rationale: «أسلم» تعبير عربي فصيح ومفهوم يحفظ معنى التسليم أو الترك لسلطان العواقب من غير إضافة تفسيرية.
- source_word: πάθη ἀτιμίας
  choice: أهواء مهينة
  rationale: «أهواء» تنقل معنى الانفعالات والرغبات القوية، و«مهينة» تحفظ دلالة ἀτιμία التقويمية من غير تشديد أو تلطيف.
- source_word: αἵ ... θήλειαι αὐτῶν
  choice: نساءهم
  rationale: «نساءهم» أنسب في العربية المعاصرة عند الحديث عن البشر، مع إثبات البديل الحرفي «إناثهم» في الحاشية حفاظًا على التقابل اللفظي مع الآية التالية.
- source_word: μετήλλαξαν
  choice: استبدلن بـ
  rationale: صيغة الاستبدال تؤدي معنى مبادلة شيء بآخر وتلائم التركيب العربي الطبيعي.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: العلاقة الطبيعية
  rationale: المعنى السياقي جنسي، و«العلاقة» أوضح وأطبع من الترجمة الحرفية «الاستعمال» التي قد تبدو غامضة أو موهمة في العربية.
- source_word: τὴν παρὰ φύσιν
  choice: ما هو مخالف للطبيعة
  rationale: يحفظ العبارة اليونانية التقابلية بوضوح، من غير اختزالها في وصف قد يحمل إيحاءات تفسيرية إضافية.
theological_decisions:
- issue: هل تُشدَّد أو تُلطَّف القوة الأخلاقية في وصف بولس؟
  choice: الإبقاء على الوصفين التقويميين «مهينة» و«مخالف للطبيعة» من غير شرح زائد.
  alternative: استعمال ألفاظ ألطف مثل «غير لائقة»، أو إضافة تصنيفات اجتماعية وعقائدية حديثة لا تسميها الآية.
  rationale: النص نفسه يتضمن حكمًا تقويميًا، فينبغي حفظه، مع تجنب استيراد فئات أو استنتاجات تتجاوز عبارته.
- issue: دلالة χρῆσις في السياق
  choice: ترجمتها «العلاقة» بحسب السياق، مع توثيق المعنى الحرفي في الحاشية.
  alternative: «الاستعمال الطبيعي».
  rationale: يحفظ الاختيار المعنى الجنسي الذي يقتضيه السياق ويجنب غرابة التعبير الحرفي، من دون تحديد صورة العلاقة بأكثر مما يذكره النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم الضبط الجزئي/الكامل في نص الآية دعمًا للقراءة، مع الحفاظ على التقابل بين «الطبيعية» و«مخالف للطبيعة». جميع علامات الحواشي مثبتة في المتن.
