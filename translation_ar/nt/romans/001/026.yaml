revisions:
- from: لِذَلِكَ أَسْلَمَهُمُ اللهُ إِلَى أَهْوَاءٍ مُهِينَةٍ؛ فَإِنَّ نِسَاءَهُمْ أَيْضًا اسْتَبْدَلْنَ بِالْعَلَاقَةِ الطَّبِيعِيَّةِ مَا هُوَ مُخَالِفٌ لِلطَّبِيعَةِ.[a][b]
  to: لِذَلِكَ أَسْلَمَهُمُ اللهُ إِلَى أَهْوَاءٍ مُخْزِيَةٍ؛ فَإِنَّ حَتَّى نِسَاءَهُمْ اسْتَبْدَلْنَ الْعَلَاقَةَ الطَّبِيعِيَّةَ بِمَا هُوَ مُخَالِفٌ لِلطَّبِيعَةِ.[a][b]
  rationale: 'تعديلان محدودان: استُبدلت «أيضًا» بـ«حتى» لإظهار القوة الاستشهادية في التركيب اليوناني، واستُبدلت «مهينة» بـ«مخزية» لتكون دلالة الوصف الأخلاقي لـἀτιμίας أوضح في العربية. ولم يُضف النص أي تصنيف حديث أو تفسير يتجاوز العبارة اليونانية.'
