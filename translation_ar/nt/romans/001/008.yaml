id: ROM.1.8
reference: Romans 1:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: ar
  text: أولًا، أشكر إلهي بيسوع المسيح من أجل جميعكم، لأن إيمانكم[a] يُعلَن في العالم كله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: ثقتكم؛ وقد تعني أيضًا أمانتكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: أولًا
  rationale: تفتتح العبارة أولى نقاط كلام بولس؛ وتُستوعب أداة الخطاب μὲν طبيعيًّا في الصياغة العربية دون مقابل مستقل.
- source_word: εὐχαριστῶ
  choice: أشكر
  rationale: ينقل فعل الشكر مباشرة ويحافظ على النبرة الشخصية.
- source_word: τῷ θεῷ μου
  choice: إلهي
  rationale: ينقل تركيب الملكية بإيجاز ويحفظ النبرة التعبدية الشخصية.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: بيسوع المسيح
  rationale: الباء تفيد هنا الوساطة أو الوسيلة مع صياغة عربية موجزة وطبيعية، و«المسيح» ينقل اللقب Χριστός بمعناه المتعارف عليه عربيًّا.
- source_word: περὶ πάντων ὑμῶν
  choice: من أجل جميعكم
  rationale: هذا هو التعبير العربي الطبيعي في سياق تقديم الشكر عن المخاطَبين جميعًا.
- source_word: ἡ πίστις ὑμῶν
  choice: إيمانكم
  rationale: «الإيمان» هو المقابل الأنسب في السياق لخبر ذيوع استجابتهم المؤمنة، مع إبقاء احتمال دلالة الثقة أو الأمانة في الحاشية.
- source_word: καταγγέλλεται
  choice: يُعلَن
  rationale: يحافظ على المبني للمجهول وعلى معنى الإعلان الجاري والواسع الانتشار.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: في العالم كله
  rationale: ينقل النطاق البلاغي الواسع بعبارة عربية واضحة وطبيعية.
theological_decisions:
- issue: ترجمة Χριστοῦ في διὰ Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» في العربية لقب ذو معنى راسخ، لا مجرد نقل صوتي، ولذلك يحفظ الدلالة المسيانية دون إدخال تفسير مذهبي زائد.
- issue: ترجمة πίστις في ἡ πίστις ὑμῶν
  choice: إيمانكم
  alternative: ثقتكم، أو أمانتكم
  rationale: الإيمان هو الأرجح في هذا السياق، لكن المجال الدلالي للكلمة اليونانية يسمح أيضًا بالثقة أو الأمانة، فحُفظ ذلك في الحاشية بدل حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة موجزة قريبة من بنية الأصل، مع تجنب التراكيب الحرفية الثقيلة. لا حاجة إلى حاشية تفرّق بين «المسيح» وChrist، لأن «المسيح» هو اللقب العربي الطبيعي الذي ينقل معنى Χριστός.
