  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: ar
  text: لأنهم، مع أنهم عرفوا الله، لم يمجّدوه بوصفه الله ولم يشكروه، بل أصبحوا باطلين في أفكارهم[a]، وأُظلِم قلبهم غير الفهيم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في استدلالاتهم»، أو «في خواطرهم»، أو «في تصوراتهم».'
    reason: lexical_alternative
  - marker: b
    text: «القلب» مفرد في اليونانية، وقد استُعمل هنا استعمالًا جمعيًّا للدلالة على باطنهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: لأنهم
  rationale: تفيد تعليل ما سبق وتحافظ على الصلة المنطقية بالسياق.
- source_word: γνόντες τὸν θεὸν
  choice: مع أنهم عرفوا الله
  rationale: يُفهم اسم الفاعل الماضي هنا على معنى concessive، أي إن تقصيرهم وقع رغم معرفتهم بالله، من غير تحويل المعرفة إلى مجرد معرفة معلومات عنه.
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: لم يمجّدوه بوصفه الله
  rationale: يحفظ ثقل فعل التمجيد، ويبيّن أن الامتناع كان عن إكرامه بما يليق بمقامه الإلهي.
- source_word: ἢ ηὐχαρίστησαν
  choice: ولم يشكروه
  rationale: صياغة عربية طبيعية تؤدي معنى إظهار الشكر، مع إظهار المفعول المفهوم من السياق.
- source_word: ἐματαιώθησαν
  choice: صاروا إلى البُطلان
  rationale: يحافظ على كون الأشخاص هم فاعل التحول الدلالي، وعلى معنى الخواء والعبث، من دون تعيين فاعل سببي غير مذكور في اليونانية.
- source_word: ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: في أفكارهم
  rationale: تؤدي معنى الأفكار أو الاستدلالات الداخلية بعبارة عربية واضحة غير تقنية، مع إبقاء البدائل المعجمية في الحاشية.
- source_word: ἐσκοτίσθη
  choice: أظلم
  rationale: يحفظ صورة الانتقال إلى الظلمة الذهنية والأخلاقية بصياغة عربية موجزة.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: قلبهم الذي بلا فهم
  rationale: يبقي «القلب» مفردًا جمعيّ الدلالة، ويعبّر عن انعدام الفهم بدل الإيحاء بمجرد ضعف الذكاء.
theological_decisions:
- issue: الدلالة التنازلية لاسم الفاعل γνόντες
  choice: مع أنهم عرفوا الله
  alternative: إذ عرفوا الله / بعدما عرفوا الله
  rationale: السياق يبرز مسؤوليتهم لأن إخفاقهم وقع رغم معرفتهم بالله؛ وهذه دلالة سياقية نحوية لا حسمٌ لطبيعة تلك المعرفة بما يتجاوز النص.
- issue: الفاعل الضمني في ἐματαιώθησαν وἐσκοτίσθη
  choice: عدم تعيين من أحدث البطلان أو الإظلام
  alternative: أن الله أبطل أفكارهم أو أظلم قلوبهم
  rationale: الصيغتان اليونانيتان مبنيتان للمجهول، ولا يصرّح العدد بفاعل؛ لذلك لا تُضاف نسبة سببية صريحة ليست في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بوصفه الله» لتجنب غموض «كإله»، وحُفظ القلب بصيغة المفرد كما في الأصل، مع شرح دلالته الجمعية في الحاشية.
