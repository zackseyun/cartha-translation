base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: ar
  text: فإني لا أخجل من الخبر السار[a]، فهو قدرة الله للخلاص لكل من يؤمن، لليهودي أولًا، ولليوناني أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإنجيل».'
    reason: lexical_alternative
  - marker: b
    text: قد يُراد بـ«اليوناني» هنا، بمعنى أوسع، غير اليهودي، أي الأممي.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: لا أخجل
  rationale: ينقل معنى الشعور بالخزي أو الإحجام بسببه، ويحافظ على نبرة بولس العلنية الواثقة بلغة عربية واضحة.
- source_word: εὐαγγέλιον
  choice: البشارة
  rationale: لفظ عربي طبيعي ومفهوم يدل على الخبر السار، مع إثبات البديل التفسيري «الخبر السار» في الحاشية.
- source_word: δύναμις
  choice: قدرة
  rationale: تعبر بوضوح عن فاعلية الله المخلِّصة، وتلائم الإسناد «قدرة الله» في العربية المعاصرة.
- source_word: εἰς σωτηρίαν
  choice: للخلاص
  rationale: تحافظ اللام على دلالة الغاية في εἰς بصياغة عربية موجزة وطبيعية.
- source_word: παντὶ τῷ πιστεύοντι
  choice: لكل من يؤمن
  rationale: تحفظ شمول παντί ودلالة اسم الفاعل اليوناني بصياغة عربية جارية، من غير تحويل العبارة إلى تسمية جامدة.
- source_word: Ἰουδαίῳ
  choice: لليهودي
  rationale: المعنى العرقي الديني هو الأنسب في المقابلة الخلاصية التاريخية مع اليوناني، لا المعنى الجغرافي «اليهوداني».
- source_word: πρῶτον
  choice: أولًا
  rationale: تحفظ ترتيب النص الموجز من غير شرح لطبيعة هذه الأولوية.
- source_word: Ἕλληνι
  choice: لليوناني
  rationale: تحافظ على اللفظ المحدد في الأصل، مع بيان إمكان استعماله بمعنى أوسع لغير اليهود في الحاشية.
- source_word: τε ... καί
  choice: ثم ... أيضًا
  rationale: تفيد إضافة اليوناني بعد أولوية اليهودي، وتأتي طبيعية في العربية؛ ولا يُراد من «ثم» تقرير تأخر زمني مفصل.
theological_decisions:
- issue: دلالة Ἕλληνι في عبارة «لليهودي أولًا ... ولليوناني»
  choice: «اليوناني» في المتن، مع بيان دلالته الأوسع المحتملة في الحاشية
  alternative: «الأممي» في المتن
  rationale: يحفظ الاختيار المعجمي الصريح للنص اليوناني، مع الاعتراف بأن اللفظ في استعمال بولس قد يمثل غير اليهود عمومًا، من غير حسم هذا الاتساع داخل المتن.
- issue: طبيعة أولوية اليهودي في πρῶτον
  choice: إبقاء «أولًا» بلا توسع تفسيري
  alternative: شرحها بأنها أولوية زمنية أو عهدية أو امتيازية
  rationale: النص يثبت الأولوية لكنه لا يحدد في هذه العبارة وحدها طبيعتها كاملة؛ لذلك تُصان المساحة اللاهوتية بدل حسمها بإضافة تفسير.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت «البشارة» لسلامتها وشيوعها الكتابي من غير غموض، مع توضيح معناها المعجمي في الحاشية. حُفظ الإيجاز والحجة السببية المتكررة في γάρ بصيغة «فـ... لأنها»، كما أُبقيت أولوية اليهودي ودلالة «اليوناني» من غير تحميلهما تفسيرًا مذهبيًا.
