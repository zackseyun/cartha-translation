base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: ar
  text: 'إلى جميع الذين في روما، أحباء الله، المدعوين قديسين[a]: نعمة لكم وسلام من الله أبينا والرب يسوع المسيح.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القديسين المدعوين». واليونانية تستعمل صفتين من غير لفظ صريح بمعنى «ليكونوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: إلى جميع الذين في روما
  rationale: ينقل شمول المخاطَبين ومكانهم بصياغة عربية واضحة وطبيعية.
- source_word: ἀγαπητοῖς θεοῦ
  choice: أحباء الله
  rationale: يحافظ على الصفة الدالة على محبة الله لهم، من غير تحويلها إلى جملة فعلية أو إضعاف دلالتها العلاقية.
- source_word: κλητοῖς ἁγίοις
  choice: المدعوين ليكونوا قديسين
  rationale: صياغة عربية مفهومة تعكس الدعوة والقداسة معًا؛ ولأن لفظ «ليكونوا» غير مصرح به في اليونانية، أُثبت البديل الأقرب إلى البنية الأصلية في الحاشية.
- source_word: χάρις
  choice: نعمة
  rationale: المقابل العربي المألوف الذي يحفظ وظيفة التحية وعمق اللفظ اللاهوتي عند بولس.
- source_word: εἰρήνη
  choice: سلام
  rationale: ينقل المعنى المباشر ويحفظ في الوقت نفسه وظيفة التحية وغناها الديني.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: الله أبينا
  rationale: صياغة عربية موجزة وطبيعية تحفظ وصف الله بأنه أبونا.
- source_word: κυρίου
  choice: الرب
  rationale: يحفظ اللقب وسلطانه في هذا السياق المسيحاني.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: يترجم اللقب اليوناني بمعناه المعروف في العربية بدل معاملته بوصفه اسمًا صوتيًا مجردًا.
theological_decisions:
- issue: 'دلالة κλητοῖς ἁγίοις: هل المقصود «مدعوون ليكونوا قديسين» أم «مدعوون قديسون/قديسون مدعوون»؟'
  choice: المدعوين ليكونوا قديسين
  alternative: 'المدعوين قديسين؛ أو: القديسين المدعوين'
  rationale: النص اليوناني يستعمل صفتين بلا فعل مصرح به يقابل «ليكونوا». اختيرت في المتن صياغة عربية واضحة ومألوفة، مع إبقاء البنية الأقرب إلى الأصل في الحاشية حتى لا تُحجب المساحة الدلالية بين الدعوة والهوية المقدسة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صيغة التحية الاسمية «نعمة لكم وسلام» من غير إضافة فعل غير موجود في الأصل، واستُعمل «المسيح» بوصفه ترجمة لقب Χριστός.
