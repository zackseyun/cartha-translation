  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: ar
  text: دائمًا في صلواتي، متضرعًا لعلّه يتيسّر لي[a] الآن، أخيرًا، بمشيئة الله، أن آتي إليكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُمهَّد لي الطريق» أو «تنجح رحلتي» في المجيء إليكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: دائمًا
  rationale: تنقل معنى المواظبة والاستمرار بعبارة عربية مباشرة، مع بقاء تعلقها بالصلوات والتضرع كما في السياق اليوناني.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: في صلواتي
  rationale: تعبير عربي طبيعي يؤدي معنى العبارة الاصطلاحية من غير حرفية ثقيلة.
- source_word: δεόμενος
  choice: متضرعًا
  rationale: يحفظ معنى الطلب الملح في سياق الصلاة، وهو أقوى من مجرد «طالبًا» من غير أن يبالغ في النبرة.
- source_word: εἴ πως
  choice: لعلّه
  rationale: تؤدي في العربية معنى الرجاء المشوب بعدم اليقين، بدل تركيب حرفي غير طبيعي مثل «إن بطريقة ما».
- source_word: ἤδη ποτὲ
  choice: الآن، أخيرًا
  rationale: يحفظ عنصري الزمن وطول الانتظار في العبارة اليونانية، مع فصل خفيف يوضح المعنى في العربية.
- source_word: εὐοδωθήσομαι
  choice: يتيسّر لي
  rationale: ينقل معنى أن يُمهَّد الطريق أو يُمنح النجاح، ويلائم مجيء بولس إلى روما من غير إيحاء مالي قد ينشأ عن «أزدهر».
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: بمشيئة الله
  rationale: صياغة عربية مألوفة تجعل مشيئة الله الإطار الحاكم لإمكان الزيارة، من غير تقرير أن الزيارة ستقع حتمًا.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: أن آتي إليكم
  rationale: ترجمة مباشرة وطبيعية تحفظ فعل المجيء ولا تضيف معنى الزيارة غير المصرح به.
theological_decisions:
- issue: العلاقة بين رجاء بولس ومشيئة الله
  choice: لعلّه يتيسّر لي... بمشيئة الله
  alternative: سأنجح بمشيئة الله في المجيء إليكم
  rationale: الصياغة المختارة تحفظ عدم اليقين في εἴ πως وخضوع الرجاء لمشيئة الله، ولا تحول الطلب إلى وعد أو تقرير مؤكد.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. حُفظ تركيب الآية بوصفه امتدادًا نحويًا للسياق السابق، واستُعمل «متضرعًا» للمشاركة اليونانية، مع تجنب الحرفية المربكة في εἴ πως والإيحاء المالي المحتمل في ترجمة εὐοδωθήσομαι.
