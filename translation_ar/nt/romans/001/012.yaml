  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: ar
  text: أي، أن أتشجّع معكم في وسطكم بوساطة الإيمان المشترك بيننا، إيمانكم وإيماني.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أن نتشجّع معًا». المصدر اليوناني لا يذكر فاعله صراحة، لكن السياق يدعم منظور بولس: «أن أتشجّع معكم». والفعل يفيد تشجيعًا مشتركًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: أي
  rationale: تقدّم العبارة توضيحًا لما سبق، و«أي» تؤدي هذا المعنى بإيجاز وطبيعية في العربية.
- source_word: συμπαρακληθῆναι
  choice: لنتشجّع معًا
  rationale: يحمل الفعل معنى التشجيع أو التعزية المشتركة، وتُظهر صيغة الجمع مع «معًا» دلالة المشاركة التي تفيدها السابقة συν-.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: المقصود أن يحدث التشجيع في وسط المؤمنين في روما، لا أن يكون داخلهم بمعنى حرفي.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: بفضل الإيمان المتبادل بيننا
  rationale: تفيد διά الوسيلة، وتفيد ἐν ἀλλήλοις التبادل بين بولس والمخاطَبين. اختيرت صياغة عربية طبيعية لا تجعل الإيمان مجرد إيمان بعضهم ببعض.
- source_word: πίστεως
  choice: الإيمان
  rationale: السياق يتحدث عن إيمان بولس والمؤمنين، ولا يقتضي معنى «الأمانة».
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: إيمانكم وإيماني
  rationale: تحفظ العبارة التوازن الصريح بين إيمان المخاطَبين وإيمان بولس وتوضح مرجع «الإيمان المتبادل».
theological_decisions:
- issue: هل التشجيع أحادي الاتجاه من الرسول إلى المؤمنين أم متبادل بينهم؟
  choice: تشجيع مشترك ومتبادل بين بولس والمؤمنين
  alternative: أن يكون بولس وحده هو المتشجّع بينهم، أو أن يكون هو وحده من يقوّيهم
  rationale: الفعل المركب συμπαρακληθῆναι والعبارة الختامية «إيمانكم وإيماني» يدلان على المشاركة، فلا ينبغي أن توحي الترجمة بخدمة أحادية الاتجاه.
- issue: الفاعل المفهوم مع المصدر συμπαρακληθῆναι
  choice: 'صيغة الجمع: «لنتشجّع معًا»'
  alternative: 'صيغة المتكلم المفرد: «لأتشجّع معكم»'
  rationale: المصدر اليوناني لا يذكر فاعله صراحة، والسياق يسمح بمنظور بولس المفرد، لكن دلالة المشاركة في الفعل وذكر إيمان الطرفين يجعلان الجمع صياغة عربية طبيعية مع إبقاء البديل في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وكريمة النبرة. استُعمل «التشجيع» بدل «التعزية» لأن السياق أوسع من تسكين الحزن، مع الحفاظ على معنى المشاركة والتبادل. وُضعت علامة الحاشية [a] في المتن عند موضع الاحتمال النحوي.
