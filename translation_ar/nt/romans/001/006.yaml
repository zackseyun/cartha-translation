translation:
  language: ar
  text: وأنتم أيضًا من بينهم، مدعوّون ليسوع المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مدعوّون من يسوع المسيح»، أو بحرفية أشد: «مدعوّو يسوع المسيح».'
    reason: يحمل تركيب المضاف إليه في اليونانية علاقة موجزة يمكن فهمها على أنها انتساب إلى يسوع المسيح أو دعوة صادرة منه.
lexical_decisions:
- source_word: ἐν οἷς
  choice: من بينهم
  rationale: يعود ضمير الوصل الجمع على الأمم المذكورين في الآية السابقة، وتعبير «من بينهم» يبيّن بوضوح اندراج المخاطَبين ضمنهم.
- source_word: ἐστε καὶ ὑμεῖς
  choice: وأنتم أيضًا
  rationale: يحفظ التوكيد الذي في الضمير الصريح ὑμεῖς ومعنى الإدراج الذي تؤديه καί، بصياغة عربية طبيعية.
- source_word: κλητοὶ
  choice: مدعوّون
  rationale: ينقل معنى κλητοί بوصفه وصفًا للمخاطَبين، من غير تحويله إلى فعل ذي فاعل مصرّح به.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «يسوع» هو الاسم الشخصي، و«المسيح» ينقل Χριστός بوصفه لقبًا مفهومًا ومستقرًا في العربية.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: مدعوّون ليسوع المسيح
  rationale: تحافظ اللام على إيجاز العلاقة التي يعبّر عنها المضاف إليه اليوناني، وتوحي بالانتساب أو التوجّه إلى المسيح من غير الجزم بأن المضاف إليه يدل على فاعل الدعوة.
theological_decisions:
- issue: دلالة علاقة المضاف إليه في κλητοὶ Ἰησοῦ Χριστοῦ
  choice: مدعوّون ليسوع المسيح
  alternative: مدعوّون من يسوع المسيح؛ أو، بحرفية أشد، مدعوّو يسوع المسيح
  rationale: التركيب اليوناني موجز ويحتمل علاقة الانتساب أو الصلة، كما يمكن أن يُفهم منه أن يسوع المسيح هو الداعي. اختيرت صياغة عربية موجزة لا تحسم جهة الفاعلية، مع إثبات الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة. قُدِّم «وأنتم أيضًا» لإبراز توكيد الضمير، واستُعملت «من بينهم» بدل تركيب حرفي ثقيل. وُضعت علامة الحاشية في المتن كما يلزم.
