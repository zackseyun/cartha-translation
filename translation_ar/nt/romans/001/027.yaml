  source_fidelity: 'ينقل المسودة ترتيب الحجة وبنية الجملة اليونانية على نحو جيد: تركُ الاستعمال/العلاقة الطبيعية يسبق التأجج، ويُحفظ تكرار ألفاظ الذكور، كما يبقى الجزاء غير محدد الكيفية «في أنفسهم». لكن «إذ تركوا» قد تُفهم سببية، و«بعضهم نحو بعض» أقل سلاسة من التعبير العربي المتبادل المعتاد، كما أن «الجزاء المقابل الذي كان لا بد منه» ثقيل في العربية.'
  naturalness: تحتاج العبارة إلى تهذيب محدود لتكون فصحى معاصرة طبيعية مع المحافظة على المقابلات المصدرية. «العلاقة الطبيعية بالأنثى» أوضح وأقل التباسًا في العربية من «الاستعمال الطبيعي للأنثى» في المتن، مع إبقاء «الاستعمال» في الهامش بوصفه البديل الأقرب حرفيًا. كذلك «ذكورًا مع ذكور» طبيعي ويحفظ التكرار البلاغي.
