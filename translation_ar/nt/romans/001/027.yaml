reference: Romans 1:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: ar
  text: وكذلك الذكور أيضًا، بعد أن تركوا العلاقة الطبيعية بالأنثى[a]، تأجَّجوا في رغبتهم بعضهم نحو بعضهم بعضًا[b]؛ ذكورًا مع ذكور، مرتكبين ما هو مُخزٍ[c]، ومتلقِّين في أنفسهم الجزاء المقابل المستحق لضلالهم[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الاستعمال الطبيعي للأنثى».'
    reason: بديل أقرب حرفيًا لـ χρῆσις («استعمال»)، التي يُفهم منها في السياق استعمال أو علاقة جنسية.
  - marker: b
    text: 'أو: «اشتعلوا شهوةً بعضهم لبعض».'
    reason: يعكس البديل الصورة النارية في الفعل، ويستعمل «الشهوة» بدل «الرغبة» لـ ὄρεξις.
  - marker: c
    text: 'أو: «فاعلين الفحشاء».'
    reason: بديل موجز لـ ἀσχημοσύνη، مع أن «ما هو مُخزٍ» أقل تحديدًا اصطلاحيًا ويحفظ عمومية المصدر.
  - marker: d
    text: 'أو: «الجزاء المستحق لضلالهم»، أو «الجزاء الملائم لضلالهم».'
    reason: تحتمل ἀντιμισθία مع ἔδει معنى الجزاء المقابل، أو المستحق، أو الملائم.
lexical_decisions:
- source_word: ὁμοίως τε καὶ
  choice: وكذلك ... أيضًا
  rationale: ينقل معنى المماثلة والاستمرار في الحجة، بصياغة عربية واضحة.
- source_word: ἄρσενες / θηλείας
  choice: الذكور / الأنثى
  rationale: يحافظ على الألفاظ اليونانية المحددة بحسب الجنس، بدل تحويلها إلى ألفاظ علائقية مثل «الرجال/النساء».
- source_word: ἀφέντες
  choice: إذ تركوا
  rationale: يحفظ دلالة الفعل السابق للفعل الرئيس من غير إثقال العبارة العربية.
- source_word: τὴν φυσικὴν χρῆσιν τῆς θηλείας
  choice: الاستعمال الطبيعي للأنثى
  rationale: ترجمة قريبة من تركيب المصدر، وتحافظ على لفظ χρῆσις «الاستعمال» وعلى الإضافة التي قد تُفهم موضوعية؛ ويبيّن الهامش بديلًا عربيًا أوضح سياقيًا.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: تأجَّجوا في رغبتهم
  rationale: يحفظ الصورة النارية القوية في الفعل، بينما تنقل «رغبتهم» معنى ὄρεξις من غير زيادة تفسيرية غير لازمة.
- source_word: εἰς ἀλλήλους
  choice: بعضهم نحو بعض
  rationale: يحفظ الاتجاه والتبادل في التعبير اليوناني بصياغة عربية طبيعية.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: ذكورًا بذكور
  rationale: يحافظ على تكرار اللفظ المحدد بحسب الجنس وعلى القوة البلاغية للتركيب.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: مرتكبين ما هو مُخزٍ
  rationale: ينقل الحكم الأخلاقي في ἀσχημοσύνη من غير تسمية الفعل تسميةً أكثر تحديدًا مما يورده النص.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: الجزاء المقابل الذي كان لا بدَّ منه
  rationale: «الجزاء المقابل» يحفظ فكرة المقابلة أو العوض في ἀντιμισθία، والعبارة التابعة تبقي معنى الضرورة أو الملاءمة في ἔδει ظاهرًا بدل دمجه كليًا في صفة واحدة.
- source_word: τῆς πλάνης αὐτῶν
  choice: لضلالهم
  rationale: «الضلال» يلائم معنى الانحراف أو التيه في πλάνη ويحافظ على طابعه الأخلاقي والسياقي.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: متلقِّين في أنفسهم
  rationale: يحفظ القوة الانعكاسية للضمير من غير تحديد كيفية تلقي الجزاء، وهي غير مصرَّح بها في النص.
theological_decisions:
- issue: هل تُستبدل الألفاظ المحددة بحسب الجنس بألفاظ علائقية؟
  choice: الذكور ... الأنثى ... ذكورًا بذكور
  alternative: الرجال ... المرأة ... رجالًا برجال
  rationale: اختار النص اليوناني ἄρσην وθῆλυ، لا الألفاظ المعتادة للرجل والمرأة؛ فالحفاظ على ذلك يمنع إدخال معنى علائقي زائد.
- issue: مدى التصريح بطبيعة الفعل الموصوف
  choice: مرتكبين ما هو مُخزٍ
  alternative: مرتكبين أفعالًا مثلية
  rationale: يحمل ἀσχημοσύνη حكمًا أخلاقيًا واضحًا، لكنه لا يورد في هذا الموضع تسمية اصطلاحية للفعل؛ لذلك حُفظ الحكم من غير زيادة تصنيف غير موجود في المصدر.
- issue: تحديد ماهية الجزاء الواقع «في أنفسهم»
  choice: متلقِّين في أنفسهم الجزاء المقابل
  alternative: متلقِّين في أجسادهم عقوبةً محددة
  rationale: لا يحدد النص ماهية الجزاء أو آليته؛ لذا تُرك التعبير عامًا كما في اليونانية، من غير ربطه بمرض أو نتيجة بعينها.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. حُفظ التكرار البلاغي للألفاظ المحددة بحسب الجنس، كما حُفظت صورة التأجج وغموض طبيعة الجزاء، مع تجنب التلطيف أو التحديد العقائدي الزائد.
