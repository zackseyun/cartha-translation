  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: ar
  text: بولس، عبد المسيح يسوع، المدعو رسولًا، المُفرَز لإنجيل الله،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: بولس
  rationale: الصيغة العربية المعيارية الراسخة للاسم الشخصي.
- source_word: δοῦλος
  choice: عبد
  rationale: ينقل معنى الخضوع والانتساب إلى سيد على نحو أدق من «خادم»، مع ملاءمته للسياق العربي الكتابي والفصيح.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: يحافظ على ترتيب الأصل اليوناني ويترجم Χριστός بوصفه لقبًا مسيانيًا.
- source_word: κλητὸς ἀπόστολος
  choice: المدعو رسولًا
  rationale: صياغة عربية طبيعية تحافظ على معنى الدعوة إلى الرسولية من غير توسع تفسيري زائد.
- source_word: ἀφωρισμένος
  choice: المُفرَز
  rationale: يحفظ دلالة اسم المفعول ومعنى التخصيص والتكريس لغرض محدد.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: لبشارة الله
  rationale: اللام تؤدي معنى الغاية أو التخصيص في εἰς، و«بشارة الله» موجزة وتحفظ تركيب الإضافة اليوناني.
theological_decisions:
- issue: دلالة δοῦλος في تعريف بولس بنفسه
  choice: عبد
  alternative: خادم
  rationale: «عبد» يحفظ علاقة الانتماء والخضوع التي يتضمنها اللفظ اليوناني، من غير تخفيفها إلى مجرد أداء خدمة.
- issue: ترجمة Χριστός كلقب
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: اختير «المسيح» ترجمةً للقب، مع إبقاء ترتيب Χριστοῦ Ἰησοῦ كما في النص المصدر.
- issue: العلاقة النحوية في κλητὸς ἀπόστολος
  choice: المدعو رسولًا
  alternative: رسول مدعو
  rationale: الاختيار يبيّن أن الرسولية متصلة بالدعوة، لكنه لا يضيف فاعل الدعوة صراحةً ولا يحسم ما لم يصرح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «عبد» لقوة الدلالة الأصلية، و«المدعو رسولًا» لتجنب تركيب حرفي متعثر. أبقيت الفاصلة الختامية لأن الآية تفتتح جملة تمتد إلى الآيات التالية.
