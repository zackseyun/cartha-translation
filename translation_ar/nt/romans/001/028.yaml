  source_fidelity: المعنى العام محفوظ، بما في ذلك فعل الدينونة «أسلمهم» وتركيب «ما لا يليق». لكن «ذهن فاسد» قد يوحي بفسادٍ أخلاقي أو جوهري أصرح من ἀδόκιμον، التي تدل أساسًا على ذهن غير مقبول بعد الاختبار أو غير صالح. والأدق أن يظهر هذا المعنى دون تحميلٍ لاهوتي زائد.
  naturalness: الصياغة فصيحة ومفهومة. «أن يُبقوا الله في معرفتهم» تحافظ على صورة الأصل، وإن كانت حرفية قليلًا، وهي مقبولة في سجل كتابي معاصر. «ذهن غير صالح» واضح وطبيعي بما يكفي في هذا السياق.
  terminology: «أسلمهم» مناسب لـ παρέδωκεν في سياق التكرار القضائي. و«ما لا يليق» مناسب لـ τὰ μὴ καθήκοντα. استبدال «فاسد» بـ«غير صالح» يترجم ἀδόκιμον بدقة أكبر ويحافظ على الصلة اللفظية بـ«لم يستحسنوا» عبر الحاشية، من غير تبنّي مصطلح عقائدي مثل «مرفوض» أو «هالك».
