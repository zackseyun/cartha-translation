source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: ar
  text: وكما أنهم لم يستحسنوا أن يُبقوا الله في معرفتهم[a]، أسلمهم الله إلى ذهنٍ غير صالح[b]، ليفعلوا ما لا يليق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يعترفوا بالله»، أو «أن يحتفظوا بمعرفة الله».'
    reason: lexical_alternative
  - marker: b
    text: '«غير صالح» تترجم كلمةً يونانية مرتبطة بالفعل المترجم «لم يستحسنوا» في أول الآية؛ وفي الأصل مقابلة لفظية: إذ لم يستحسنوا إبقاء الله في معرفتهم، أسلمهم الله إلى ذهن غير صالح. ويمكن أيضًا ترجمتها: «ذهن فاسد».'
    reason: wordplay
lexical_decisions:
- source_word: καθὼς
  choice: وكما أنهم
  rationale: تحافظ على معنى المقابلة في «كما»، من غير أن تحصر الرابط في السببية وحدها، وهو ما يلائم الصياغة اليونانية وسياق تكرار تسليم الله لهم.
- source_word: οὐκ ἐδοκίμασαν
  choice: لم يستحسنوا
  rationale: ينقل معنى التقييم الذي ينتهي إلى عدم القبول أو الاستحسان، ويهيئ للصدى اللفظي مع ἀδόκιμον، وإن تعذر استنساخ الجناس كاملًا بصورة عربية طبيعية.
- source_word: τὸν θεὸν ἔχειν ἐν ἐπιγνώσει
  choice: أن يُبقوا الله في معرفتهم
  rationale: صياغة قريبة من تركيب الأصل، وتحفظ احتمال معنى إبقاء الله ضمن معرفتهم بدل اختزاله في مجرد الاعتراف اللفظي به.
- source_word: παρέδωκεν αὐτοὺς
  choice: أسلمهم
  rationale: يفيد تسليمهم وتركهم لنتيجة رفضهم، ويحافظ على الطابع القضائي للفعل المتكرر في السياق.
- source_word: ἀδόκιμον νοῦν
  choice: ذهنٍ فاسد
  rationale: تعبير عربي واضح وطبيعي يدل على ذهن أخفق في التمييز وصار غير صالح؛ وتوضح الحاشية صلته اللفظية بالفعل السابق من غير استعمال عبارة عربية متكلفة.
- source_word: ποιεῖν
  choice: ليفعلوا
  rationale: ينقل المصدر بوصفه دالًا على الغاية أو النتيجة التابعة لتسليمهم، من غير حسم زائد بينهما.
- source_word: τὰ μὴ καθήκοντα
  choice: ما لا يليق
  rationale: ينقل بإيجاز ووضوح معنى ما ليس مناسبًا أو واجبًا من الناحية الأخلاقية.
theological_decisions:
- issue: هل تُترجم ἀδόκιμον بلفظ عقائدي مشدد مثل «مرفوض» أو «فاجر»؟
  choice: ذهن فاسد
  alternative: ذهن غير صالح أو عقل مرفوض
  rationale: تصف العبارة دينونة الله بتسليمهم، لكن اللفظ نفسه لا يقتضي إدخال مصطلح عقائدي لاحق أو تقرير معنى الهلاك النهائي. «فاسد» واضح ولا يزيل التوتر بين فساد الذهن وحكم الله.
- issue: هل يعني ἔχειν ἐν ἐπιγνώσει مجرد الإقرار بالله أم الاحتفاظ به في المعرفة؟
  choice: أن يُبقوا الله في معرفتهم
  alternative: أن يعترفوا بالله حق المعرفة
  rationale: تحفظ الصياغة المختارة صورة الأصل واحتماله الأوسع، بينما تذكر الحاشية البديل الاصطلاحي الأكثر سلاسة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية كريمة. استُعمل «ذهن» لـ νοῦς تمييزًا له عن القلب أو الروح، وتُركت علاقة الغاية والنتيجة في «ليفعلوا» على قدر ما يسمح به التركيب العربي، من غير تقرير لاهوتي زائد.
