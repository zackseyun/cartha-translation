  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: ar
  text: فإن صفاته غير المنظورة[a]، أي قدرته الأزلية وألوهيته[b]، تُرى بوضوح منذ خلق العالم، إذ تُدرَك بالعقل من خلال مخلوقاته، حتى إنهم بلا عذر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما هو غير منظور عنه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «طبيعته الإلهية». واللفظ اليوناني هنا هو θειότης، لا اللفظ الأقوى θεότης.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: ما لا يُرى من صفاته
  rationale: يحافظ على صيغة الجمع المحايدة الدالة على الجوانب غير المنظورة المتعلقة بالله، ويعبّر عنها بعربية واضحة دون جعلها أشياء غير مرئية مستقلة.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: منذ خلق العالم
  rationale: ينقل الدلالة الزمنية لـἀπό، أي إن إمكان إدراك هذه الصفات قائم منذ خلق العالم.
- source_word: τοῖς ποιήμασιν
  choice: من خلال مخلوقاته
  rationale: ينقل دلالة وسيلة الإدراك في صيغة الجمع، ويشير طبيعيًا إلى الأشياء التي صنعها الله.
- source_word: νοούμενα
  choice: إذ يُدرَك
  rationale: يُظهر أن رؤية غير المنظور تتم بإدراك عقلي يستدل بالمخلوقات.
- source_word: καθορᾶται
  choice: يُرى بوضوح
  rationale: يحفظ قوة الفعل الدالة على الرؤية الواضحة، مع المبني للمجهول والحقيقة المستمرة.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: أي قدرته الأزلية
  rationale: يعرض العبارة بوصفها تفسيرًا لما لا يُرى، ويترجم ἀΐδιος بما يدل على الدوام الذي لا ابتداء منظورًا له.
- source_word: θειότης
  choice: ألوهيته
  rationale: يدل على الصفة أو الطبيعة الإلهية، مع تجنب صياغة قد تساويه دون تمييز بالمصطلح الأقوى θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: حتى إنهم بلا عذر
  rationale: ينقل نتيجة الإعلان في الخليقة بصياغة عربية طبيعية، دون حسم زائد فيما إذا كانت البنية تحمل غاية إلى جانب النتيجة.
theological_decisions:
- issue: ترجمة θειότης دون المبالغة في قوة اللفظ
  choice: ألوهيته
  alternative: طبيعته الإلهية
  rationale: يثبت اللفظ حقيقة الصفة الإلهية المدركة في الخليقة، لكنه ليس هو اللفظ θεότης؛ وتوضح الحاشية البديل وتحفظ التمييز المعجمي.
- issue: دلالة εἰς τὸ على الغاية أو النتيجة
  choice: حتى إنهم بلا عذر
  alternative: لكي يكونوا بلا عذر
  rationale: السياق يؤيد النتيجة، وهذه الصياغة لا تنسب صراحة إلى الله قصدًا غائيًا أبعد مما تقتضيه العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المبني للمجهول للمحافظة على بنية النص، وجاءت الجملة التفسيرية بعد «أي» لبيان بدل التفصيل في اليونانية. جميع علامات الحواشي مثبتة في المتن.
