  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: ar
  text: 'لِأَنَّ فِيهِ يُعلَنُ بِرُّ اللهِ، مِنْ إِيمَانٍ إِلَى إِيمَانٍ[a][b]، كَمَا هُوَ مَكْتُوبٌ: «وَالْبَارُّ بِالإِيمَانِ يَحْيَا»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عدل الله». ويمكن أيضًا فهم الإضافة بمعنى «بِرّ من الله».'
    reason: lexical_alternative
  - marker: b
    text: 'العبارة اليونانية «مِن إيمان إلى إيمان» شديدة الصعوبة وتحتمل وجوهًا متعددة، منها: «من الإيمان ولأجل الإيمان»، أو «بالإيمان من البداية إلى النهاية». وقد أُبقي حرفا الجر والتكرار في المتن لئلا يُحسَم معناها بتفسير واحد.'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا فهم العبارة هكذا: «الذي هو بارّ بالإيمان يحيا».'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: بِرّ
  rationale: «البِرّ» هو المقابل العربي الكتابي والطبيعي لـδικαιοσύνη، ويحفظ دلالتها الأخلاقية والقضائية واللاهوتية من غير حصرها في معنى «العدل» وحده.
- source_word: θεοῦ
  choice: الله
  rationale: الإضافة في «بِرّ الله» تحافظ على غموض المضاف إليه اليوناني، فلا تحسم هل المقصود برّ الله نفسه أم البر المرتبط به أو الصادر عنه.
- source_word: ἐν αὐτῷ
  choice: به
  rationale: الضمير اليوناني محايد ويعود على الأرجح إلى الإنجيل في الآية السابقة؛ و«به» تربطه بالإنجيل من غير إدخال مرجع شخصي.
- source_word: ἀποκαλύπτεται
  choice: يُعلَن
  rationale: صيغة المضارع المبني للمجهول تُنقل بوضوح وطبيعية إلى «يُعلَن»، مع الحفاظ على معنى الكشف والإظهار.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: مِنْ إِيمَانٍ إِلَى إِيمَانٍ
  rationale: يحفظ هذا النقل حرفي الجر وتكرار πίστις، ويترك العبارة اليونانية الصعبة على غموضها المقصود بدل تفسيرها باتجاه لاهوتي واحد.
- source_word: δίκαιος
  choice: البارّ
  rationale: ينقل الصفة المستعملة اسميًا بصيغة المفرد التمثيلي المذكر، وهو تعبير عربي كتابي واضح.
- source_word: ἐκ πίστεως
  choice: بالإيمان
  rationale: «بالإيمان» صياغة عربية طبيعية تسمح بربط العبارة بالفعل «يحيا»، مع إبقاء احتمال تعلقها بـ«البار» في الحاشية.
- source_word: ζήσεται
  choice: يحيا
  rationale: المضارع العربي في سياق الاقتباس والحكمة يؤدي معنى المستقبل اليوناني بصورة طبيعية ومهيبة.
theological_decisions:
- issue: معنى δικαιοσύνη θεοῦ
  choice: بِرّ الله
  alternative: عدل الله؛ أو بِرّ من الله
  rationale: تحافظ الإضافة العربية على التوتر الدلالي في اليونانية ولا تحسم بين صفة الله وعطيته أو حكمه القضائي.
- issue: دلالة ἐκ πίστεως εἰς πίστιν
  choice: مِنْ إِيمَانٍ إِلَى إِيمَانٍ
  alternative: من الإيمان ولأجل الإيمان؛ أو بالإيمان من البداية إلى النهاية
  rationale: العبارة موضع خلاف حقيقي؛ لذلك يحفظ النص اتجاه حرفي الجر والتكرار من غير فرض تفسير بعينه.
- issue: تعلّق ἐκ πίστεως في اقتباس حبقوق
  choice: البارّ فبالإيمان يحيا
  alternative: الذي يتبرر بالإيمان يحيا
  rationale: الصياغة المختارة طبيعية وتحافظ على القراءة التقليدية التي تربط «بالإيمان» بـ«يحيا»، فيما تُذكر إمكانية تعلقها بـ«البار» في الحاشية.
- issue: نقل δὲ في الاقتباس
  choice: أمّا
  alternative: حذف الأداة؛ أو «لكن»
  rationale: «أمّا» تحفظ حضور δὲ وتناسب أسلوب الاقتباس العربي من غير فرض مقابلة حادة قد توحي بها «لكن».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «البِرّ» للمصطلح اللاهوتي، وحُفظت العبارة المتوازية «من إيمان إلى إيمان» رغم غرابتها النسبية لأنها تعكس غموض الأصل البلاغي. أُثبتت δὲ بصيغة «أمّا» لتجنب تضاد غير لازم.
