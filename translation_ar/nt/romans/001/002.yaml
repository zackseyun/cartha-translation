  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: ar
  text: الذي سبق أن وعد به على ألسنة أنبيائه في الكتب المقدسة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في كتابات مقدسة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: الذي
  rationale: اسم موصول مفرد مذكر في العربية يعود بوضوح إلى «الإنجيل» المذكور في رومية 1:1، مع أن الضمير اليوناني محايد لموافقته εὐαγγέλιον.
- source_word: προεπηγγείλατο
  choice: سبق أن وعد به
  rationale: يحفظ معنى الوعد في الفعل ومعنى السبق الذي تفيده السابقة προ-، بصياغة عربية طبيعية.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: على ألسنة أنبيائه
  rationale: تعبير عربي طبيعي يدل على أن الأنبياء هم وسائط إعلان الوعد، ويحفظ نسبتهم إلى الله.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: في الكتب المقدسة
  rationale: يفيد السياق الكتابات المعترف بها بوصفها مقدسة، و«الكتب المقدسة» هو التعبير العربي الواضح والمألوف، مع إثبات البديل الحرفي في الحاشية.
theological_decisions:
- issue: هل تُترجم γραφαῖς ἁγίαις «الكتب المقدسة» أم «كتابات مقدسة»؟
  choice: الكتب المقدسة
  alternative: كتابات مقدسة
  rationale: استعمال γραφαί في السياق البولسي يرجّح الإشارة إلى الأسفار الكتابية، لكن غياب أداة التعريف في اليونانية يتيح الترجمة الحرفية «كتابات مقدسة»، ولذلك حُفظت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعمل «على ألسنة» بدل «من خلال» لتجنب الصياغة المترجمة حرفيًا مع الحفاظ على معنى الوساطة، وأُبقيت صلة الآية بما قبلها بواسطة «الذي».
