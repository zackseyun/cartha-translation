revisions:
- from: لِأَنَّ غَضَبَ اللهِ يُعْلَنُ مِنَ السَّمَاءِ عَلَى كُلِّ فُجُورِ النَّاسِ وَإِثْمِهِمْ، إِذْ يَكْبِتُونَ الْحَقَّ بِإِثْمِهِمْ.[a][b][c]
  to: لِأَنَّ غَضَبَ اللهِ يُعْلَنُ مِنَ السَّمَاءِ عَلَى كُلِّ فُجُورٍ وَإِثْمٍ مِنَ النَّاسِ الَّذِينَ يَكْبِتُونَ الْحَقَّ بِالإِثْمِ.[a][b][c]
  rationale: 'عُدّل الربط إلى «من الناس الذين» ليقابل بصورة أوضح تركيب «ἀδικίαν ἀνθρώπων τῶν ... κατεχόντων»: الفجور والإثم صادران من الناس، وهؤلاء الناس هم الذين يكبتون الحق. وحُذفت إضافة الضمير في «بالإثم» كي لا يُزاد تخصيص غير مصرح به، مع أن المرجع المفهوم سياقياً يظل الناس أنفسهم. لا تغيّر المراجعة معنى الآية أو تحسم دلالة ἐν ἀδικίᾳ المتنازع عليها؛ لذلك تبقى القراءة الظرفية في الحاشية.'
