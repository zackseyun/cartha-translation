  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: ar
  text: لِأَنَّ غَضَبَ اللهِ يُعْلَنُ مِنَ السَّمَاءِ عَلَى كُلِّ فُجُورٍ وَإِثْمٍ مِنَ النَّاسِ الَّذِينَ يَكْبِتُونَ الْحَقَّ بِالإِثْمِ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُكشَف».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كل عدم تقوى وظلم»؛ فكلمة «الظلم» هنا قد تشمل الإثم والشر على نطاق أوسع، لا الظلم الاجتماعي وحده.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يكبتون الحق في الإثم». وقد تُترجم «يكبتون» أيضاً: «يحجزون» أو «يقمعون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: يُعلَن
  rationale: مضارع مبني للمجهول، ويحافظ «يُعلَن» على دلالة الحاضر من غير فرض أن المقصود عملية متدرجة حصراً.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تفيد تعليل ما سبق وربطه به، وهي طبيعية في العربية.
- source_word: ὀργὴ θεοῦ
  choice: غضب الله
  rationale: نقل مباشر للإضافة، مع إبقاء الغضب استجابة إلهية شخصية وقضائية من غير تلطيفه إلى مجرد عاقبة غير شخصية.
- source_word: ἀπ’ οὐρανοῦ
  choice: من السماء
  rationale: ينقل بوضوح مصدر الإعلان السماوي.
- source_word: πᾶσαν ἀσέβειαν
  choice: كل فجور
  rationale: «الفجور» لفظ عربي واضح يدل هنا على التمرد وقلة التقوى تجاه الله، وإن كان «عدم التقوى» أقرب شكلاً إلى اليونانية.
- source_word: ἀδικίαν
  choice: إثم
  rationale: يحفظ المجال الأخلاقي الواسع للكلمة في هذا السياق، ويتجنب حصرها في الظلم الاجتماعي وحده.
- source_word: ἀνθρώπων
  choice: الناس
  rationale: اللفظ اليوناني عام للبشر هنا، لا للذكور وحدهم.
- source_word: τῶν ... κατεχόντων
  choice: إذ يكبتون
  rationale: يفيد κατέχω في السياق حجز الحق وقمعه؛ و«إذ» تصل الجملة بالناس وتبين وصف فعلهم من غير تثقيل العبارة بموصول ثانٍ.
- source_word: τὴν ἀλήθειαν
  choice: الحق
  rationale: مقابل عربي مباشر وطبيعي يحفظ عموم اللفظ.
- source_word: ἐν ἀδικίᾳ
  choice: بإثمهم
  rationale: 'يفهم ἐν على معنى الوسيلة أو الملابسة: يكبتون الحق بواسطة إثمهم أو في نطاقه؛ وإضافة الضمير توضح عود الإثم إلى الناس من غير تغيير المرجع.'
theological_decisions:
- issue: هل غضب الله استجابة إلهية شخصية أم مجرد نتيجة أخلاقية غير شخصية؟
  choice: الإبقاء على «غضب الله» بوصفه غضبه هو
  alternative: صياغته كعاقبة أخلاقية غير شخصية
  rationale: الإضافة اليونانية وسياق حجة بولس يؤيدان الاستجابة الإلهية القضائية، مع عدم توسيع العبارة بما يتجاوز النص.
- issue: 'دلالة ἐν ἀδικίᾳ: الوسيلة أم المجال/الحال'
  choice: بإثمهم
  alternative: في إثمهم
  rationale: قراءة الوسيلة أو الملابسة راجحة سياقياً، لكن التركيب اليوناني يحتمل المجال أو الحال أيضاً، لذلك تُثبت القراءة البديلة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية كريمة. اختيرت ألفاظ مألوفة مثل «الناس» و«الحق»، وحُفظ تكرار معنى ἀδικία بصيغة «إثمهم» مع تجنب تركيب عربي ملتبس يوحي بأن «فجور الناس وإثمهم» وحده، لا الناس الفاعلين، هو السابق النحوي للموصول.
