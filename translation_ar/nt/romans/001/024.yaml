  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: ar
  text: لذلك أسلمهم الله، في شهوات قلوبهم، إلى النجاسة، لإهانة أجسادهم فيما بينهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيهم»؛ وربما: «في أنفسهم».'
    reason: العبارة اليونانية ἐν αὐτοῖς موجزة، ويمكن أن تُفهم بمعنى تبادلي «فيما بينهم»، أو بمعنى «فيهم»، وربما «في أنفسهم».
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج المترتب على الكلام السابق، وتحافظ على الصلة المنطقية بعبارة عربية واضحة.
- source_word: παρέδωκεν
  choice: أسلمهم
  rationale: تنقل معنى تسليم أشخاص إلى سلطان حالة أو قوة، وتحفظ الثقل القضائي للفعل من غير إضافة تفسير عقائدي مثل «تخلّى عنهم».
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: في شهوات قلوبهم
  rationale: تحافظ على حرف الجر وصورة «القلوب»، وتعرض الشهوات بوصفها المجال الذي وقع فيه التسليم. ولفظ «شهوات» هنا لا يقتصر في ذاته على الرغبة الجنسية.
- source_word: ἀκαθαρσίαν
  choice: النجاسة
  rationale: لفظ عربي كتابي واضح يدل على الدنس الأخلاقي، مع إبقاء قوة الصورة الأصلية.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: لإهانة
  rationale: تحافظ صيغة المصدر مع اللام على البناء المصدري اليوناني وعلى إمكان فهمه غايةً أو نتيجةً، بدل حسمه في جملة فعلية صريحة.
- source_word: τὰ σώματα αὐτῶν
  choice: أجسادهم
  rationale: تنقل الاسم المحسوس مباشرة وتحفظ تأكيد بولس على الجسد.
- source_word: ἐν αὐτοῖς
  choice: فيما بينهم
  rationale: تعبير عربي طبيعي ينقل المعنى التبادلي أو الاجتماعي الأرجح في السياق، مع إثبات الاحتمالات الأخرى في الحاشية.
theological_decisions:
- issue: هل يُزاد في ترجمة παρέδωκεν تفسير صريح مثل «تخلّى عنهم قضاءً»؟
  choice: أسلمهم
  alternative: تخلّى عنهم؛ أو عاقبهم بأن أسلمهم
  rationale: النص يصرّح بفعل الله في تسليمهم، لكنه لا يضمّن هنا شرحًا نظاميًا لطبيعة هذا القضاء؛ لذلك تُحفظ قوة العبارة وتوترها اللاهوتي من غير توسعة تفسيرية.
- issue: 'دلالة τοῦ ἀτιμάζεσθαι: الغاية أم النتيجة'
  choice: لإهانة أجسادهم
  alternative: فأُهينت أجسادهم؛ أو لكي تُهان أجسادهم
  rationale: الصياغة المصدرية العربية أقرب إلى التركيب اليوناني، وتبقي العلاقة قابلة لفهم الغاية أو النتيجة بدل حسمها بلا ضرورة.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت بنية الاستنتاج والمصادر قدر الإمكان، مع تجنب ألفاظ مذهبية أو شروح عقائدية مضافة.
