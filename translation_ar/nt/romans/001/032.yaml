  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: ar
  text: ومع أنهم يعرفون حكم الله العادل[a]، وهو أن الذين يمارسون مثل هذه الأمور يستحقون الموت، فإنهم لا يفعلونها فحسب، بل يستحسنون أيضًا الذين يمارسونها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قضاء الله العادل»، أو «فريضة الله العادلة»، أو «حكم الله» دون وصف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ومع أنهم
  rationale: 'يصل الاسم الموصول الجماعة المذكورة بالسياق السابق، ومع دلالة اسم الفاعل اللاحق تُصاغ العبارة عربيًا صياغة تنازلية طبيعية: «ومع أنهم يعرفون».'
- source_word: δικαίωμα
  choice: حكم الله العادل
  rationale: ينقل المعنى القضائي والأخلاقي للكلمة، كما يوضحه القول إن فاعلي هذه الأمور يستحقون الموت، من غير حصرها في تشريع مدني بعينه.
- source_word: ἐπιγνόντες
  choice: يعرفون
  rationale: يدل على المعرفة والإدراك؛ وتؤدي «مع أنهم» الدلالة التنازلية التي يقتضيها السياق من دون المبالغة بلفظ «يعرفون تمامًا».
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: الذين يمارسون مثل هذه الأمور
  rationale: «يمارسون» تلائم السلوك المتكرر أو المستمر الذي تفيده الصيغة، و«مثل هذه الأمور» تحيل بوضوح إلى ما سبق.
- source_word: ἄξιοι θανάτου
  choice: يستحقون الموت
  rationale: عبارة عربية مباشرة وطبيعية تحفظ القوة القضائية للنص ولا تحدد نوع الموت بما يتجاوز الآية.
- source_word: ποιοῦσιν
  choice: يفعلونها
  rationale: تحافظ على التمييز اللفظي بين ποιέω وπράσσω، وتؤدي المعنى بوضوح في العربية.
- source_word: συνευδοκοῦσιν
  choice: يستحسنون
  rationale: يفيد الرضا بفعل الآخرين وإقراره، لا مجرد العلم به أو المشاركة فيه، مع صياغة عربية موجزة وطبيعية.
- source_word: τοῖς πράσσουσιν
  choice: الذين يمارسونها
  rationale: يحفظ تكرار فعل πράσσω والتوازي مع العبارة السابقة، ويبرز أن الاستحسان موجَّه إلى ممارسي تلك الأفعال.
theological_decisions:
- issue: مدلول «يستحقون الموت»
  choice: الإبقاء على العبارة بوصفها حكمًا إلهيًا قضائيًا من غير تحديد نوع الموت
  alternative: حصرها في عقوبة الإعدام المدنية، أو التصريح بأنها تشير إلى الموت الأخروي
  rationale: لا تحدد الآية نفسها كامل نطاق «الموت»، ولذلك تحفظ الترجمة ثقل العبارة ولا تضيق معناها بتفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت صياغة «ومع أنهم... فإنهم» لإظهار العلاقة التنازلية طبيعيًا، مع الحفاظ على التوازي بين فعل الشر واستحسان فاعليه.
