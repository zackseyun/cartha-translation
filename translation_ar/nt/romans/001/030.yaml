  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: ar
  text: مغتابين، مبغضين لله[a]، معتدين، متكبرين، متفاخرين، مبتدعين للشرور، عاصين لوالديهم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مبغَضين من الله».'
    reason: قراءة بديلة محتملة للفظ اليوناني θεοστυγεῖς.
lexical_decisions:
- source_word: καταλάλους
  choice: مغتابين
  rationale: يدل اللفظ على الذين يتكلمون في الآخرين من ورائهم بما يسيء إليهم؛ و«مغتابين» موجزة وطبيعية في العربية وتحفظ القوة الأخلاقية.
- source_word: θεοστυγεῖς
  choice: مبغضين لله
  rationale: يحفظ هذا التعبير القراءة الفاعلة الأرجح في سياق قائمة الرذائل، أي أناسًا يبغضون الله، من غير إثقال الأسلوب.
- source_word: ὑβριστάς
  choice: معتدين
  rationale: يشمل اللفظ التعالي الذي يظهر في الإساءة والتعدي على الآخرين؛ و«معتدين» أوسع من حصره في الوقاحة اللفظية أو العنف الجسدي وحده.
- source_word: ὑπερηφάνους
  choice: متكبرين
  rationale: ينقل معنى الاستعلاء وارتفاع المرء على غيره، ويميّزه عن التفاخر المذكور بعده.
- source_word: ἀλαζόνας
  choice: متفاخرين
  rationale: يدل على التباهي الادعائي والتبجح؛ و«متفاخرين» واضحة وسلسة ضمن قائمة الصفات.
- source_word: ἐφευρετὰς κακῶν
  choice: مبتدعين للشرور
  rationale: ترجمة قريبة وحية تصف الذين يستحدثون طرائق وأعمالًا شريرة.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: عاصين لوالديهم
  rationale: ينقل بوضوح معنى عدم طاعة الوالدين، ويحافظ على صيغة النعت المتتابعة في القائمة.
theological_decisions:
- issue: دلالة θεοστυγεῖς
  choice: 'القراءة الفاعلة: «مبغضين لله»'
  alternative: 'القراءة المفعولية: «مبغَضين من الله»'
  rationale: القراءة الفاعلة أنسب بسياق قائمة تصف مواقف البشر وأفعالهم، لكن صيغة اللفظ وتاريخ تفسيره يسمحان بالقراءة المفعولية، ولذلك حُفظت في الحاشية دون حسم مصطنع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع المحافظة على إيقاع قائمة الرذائل بصيغة جمع المذكر المنصوب تبعًا للسياق النحوي السابق. استُعملت ألفاظ متمايزة للكبر والتفاخر، وحُفظ الاحتمال الدلالي اللاهوتي في حاشية.
