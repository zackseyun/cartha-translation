  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: ar
  text: والذي أُعلِن أنه ابنُ الله بقوة بحسب روح القداسة بالقيامة من بين الأموات—يسوع المسيح ربنا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρισθέντος
  choice: أُعلِن أنه
  rationale: ينقل معنى التحديد والإظهار العلني بصياغة عربية طبيعية، من غير أن يحسم بأن البنوة بدأت عند القيامة. وتُذكر دلالتا «عُيِّن» و«تعيَّن» في الحاشية لصيانة المجال الدلالي للفعل.
- source_word: υἱοῦ θεοῦ
  choice: ابنُ الله
  rationale: ترجمة مباشرة تحفظ اللقب المسيحاني ومضمونه اللاهوتي.
- source_word: ἐν δυνάμει
  choice: بقوة
  rationale: صياغة عربية موجزة تحتمل أن تتعلق القوة بحال البنوة المعلنة أو بكيفية الإعلان، كما يحتمل التركيب اليوناني.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: بحسب روح القداسة
  rationale: ترجمة شفافة للعبارة اليونانية غير المألوفة، تحفظ غموضها المقصود ولا تساويها تلقائيًا بتعبير «الروح القدس».
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: بالقيامة من بين الأموات
  rationale: تفيد الباء الأساس أو الوسيلة، و«من بين الأموات» تعبير عربي واضح يحفظ دلالة الانبعاث من وسط الموتى.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: الصيغة العربية المألوفة، وفيها يحفظ «المسيح» معنى اللقب لا مجرد نقله صوتيًا.
- source_word: κυρίου ἡμῶν
  choice: ربنا
  rationale: الترجمة العربية الطبيعية المباشرة التي تحفظ الرنين المسيحاني للعقب.
theological_decisions:
- issue: هل يعني ὁρισθέντος أن يسوع لم يصر ابن الله إلا عند القيامة؟
  choice: أُعلِن أنه ابن الله بقوة
  alternative: عُيِّن ابنَ الله بقوة؛ أو تعيَّن ابنَ الله بقوة
  rationale: الصياغة الرئيسة لا تجعل القيامة ابتداء البنوة، لكنها تبقي علاقة الإعلان والقوة والقيامة كما يعرضها النص، من غير شرح عقائدي زائد.
- issue: هل πνεῦμα ἁγιωσύνης إشارة صريحة إلى الروح القدس؟
  choice: روح القداسة
  alternative: الروح القدس؛ أو روحه المقدسة
  rationale: العبارة اليونانية مميزة وغير مطابقة للصيغة المعتادة «الروح القدس»، لذلك تُحفظ غرابتها مع إثبات الاحتمال الأشهر في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. حُفظ تركيب «روح القداسة» غير المألوف عمدًا، واستُخدمت الشرطة الطويلة قبل «يسوع المسيح ربنا» لإبراز أن العبارة تعرّف المذكور في الجملة السابقة.
