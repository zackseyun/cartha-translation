  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: ar
  text: واستبدلوا مجدَ الله غيرِ القابل للفساد بشَبَهِ صورةِ إنسانٍ قابلٍ للفساد، وطيورٍ، وحيواناتٍ ذواتِ أربعٍ، وزواحفَ[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مجد الله الذي لا يفسد».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في شبه صورة إنسان قابل للفساد...»'
    reason: lexical_alternative
  - marker: c
    text: يمكن أن تعني «الزواحف» أيضًا كل ما يدبّ أو يزحف.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: استبدلوا بـ
  rationale: ينقل معنى إحلال شيء محل آخر عمدًا، ويلائم تركيب العربية مع الباء الداخلة على المتروك.
- source_word: δόξαν
  choice: مجد
  rationale: المقابل العربي المألوف والدقيق في هذا السياق، ويحفظ التباين بين جلال الله وصور المخلوقات.
- source_word: ἀφθάρτου
  choice: الذي لا يفسد
  rationale: يحفظ معنى عدم الخضوع للفساد أو الفناء، ويقيم مقابلة لفظية واضحة مع φθαρτοῦ.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: شبهَ صورة
  rationale: يحافظ على تراكب ألفاظ الشبه والصورة في اليونانية وعلى البناء المفرد، من غير تسطيح العبارة إلى مجرد «صور».
- source_word: φθαρτοῦ ἀνθρώπου
  choice: إنسان يفسد
  rationale: يحفظ المفرد والتقابل المباشر مع الله الذي لا يفسد؛ ويمكن فهم الصفة بمعنى الفاني أو القابل للفساد.
- source_word: πετεινῶν
  choice: طيور
  rationale: مقابل عربي طبيعي ودقيق.
- source_word: τετραπόδων
  choice: ذوات أربع
  rationale: يحفظ الدلالة الحرفية على الكائنات ذوات الأربع، بصياغة عربية موجزة ومفهومة.
- source_word: ἑρπετῶν
  choice: زواحف
  rationale: مقابل عربي طبيعي، مع التنبيه إلى أن اللفظ اليوناني قد يشمل ما يدب أو يزحف بوجه أوسع.
theological_decisions:
- issue: المقابلة بين ἀφθάρτου وφθαρτοῦ
  choice: الذي لا يفسد / يفسد
  alternative: الخالد / الفاني
  rationale: اختير التوازي اللفظي للمحافظة على حدة المفارقة في النص من غير حصر ἀφθαρσία في معنى الخلود وحده.
- issue: تعلّق الإضافات بعد «إنسان»
  choice: 'الإبقاء على سلسلة: إنسان، وطيور، وذوات أربع، وزواحف'
  alternative: تكرار «صور» أو «شبه» قبل كل صنف
  rationale: يحفظ إيجاز التركيب اليوناني وغموض نطاق الإضافة الطبيعي من غير فرض تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على تكرار جذر «فسد» لإبراز المقابلة اليونانية، وعلى ازدواج «شبه صورة» رغم ثقله النسبي لأنه سمة دلالية حقيقية في الأصل.
