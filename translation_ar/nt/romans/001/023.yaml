  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما فيه المقابلة بين الله غير القابل للفساد والمخلوقات القابلة للفساد، وسلسلة الإنسان والطيور وذوات الأربع والزواحف. لكن تركيب «استبدلوا بمجد الله» يقلب في الاستعمال العربي المعياري جهة الاستبدال أو يوقع في اللبس؛ فالمتروك هو «مجد الله»، والمأخوذ بدله هو «شبه صورة...». كما أن «إنسان يفسد» قد يُفهم عن فسادٍ فعلي أو أخلاقي، لا عن قابلية الفناء/الفساد التي يدل عليها φθαρτοῦ.
  naturalness: 'الصياغة المعدلة فصيحة واضحة: «استبدلوا مجدَ الله ... بشَبَهِ صورة...» يبيّن علاقة الاستبدال على نحو سليم، و«إنسانٍ قابلٍ للفساد» أدق وأطبع من «إنسان يفسد». وإضافة «الحيوانات» إلى «ذوات الأربع» تمنع غموض العبارة العربية مع إبقاء المعنى اليوناني.'
  terminology: «مجد»، و«غير القابل للفساد/قابل للفساد»، و«شبه صورة»، و«زواحف» اختيارات مناسبة. ويحفظ «شبه صورة» التراكب المقصود في ἐν ὁμοιώματι εἰκόνος دون اختزاله إلى «صور».
