  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: ar
  text: لِأَنَّ ما يمكن أن يُعرَف عن الله واضحٌ بينهم[a]، إذ إنَّ الله أوضحه لهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيهم»، أو «في داخلهم».'
    reason: تحفظ الحاشية الاحتمال الداخلي الحقيقي في العبارة اليونانية ἐν αὐτοῖς.
lexical_decisions:
- source_word: διότι
  choice: لِأَنَّ
  rationale: تفيد تعليل ما سبق، و«لأن» تؤدي الصلة السببية بوضوح في العربية.
- source_word: τὸ γνωστὸν
  choice: ما يمكن أن يُعرَف
  rationale: الصفة المحايدة المعرّفة مستعملة استعمال الاسم، وتشير هنا إلى ما هو متاح للمعرفة، مع بقاء احتمال معنى «ما هو معروف» من حيث الدلالة المعجمية.
- source_word: τοῦ θεοῦ
  choice: عن الله
  rationale: يُفهم المضاف إليه هنا على أنه موضوع المعرفة؛ و«عن الله» هي الصياغة العربية الطبيعية لهذا المعنى.
- source_word: φανερόν
  choice: واضحٌ
  rationale: تنقل معنى الظهور والجلاء بعبارة عربية حديثة وطبيعية.
- source_word: ἐν αὐτοῖς
  choice: بينهم
  rationale: تحفظ المعنى الجماعي أو العلني الملائم للسياق، مع إثبات احتمال المعنى الداخلي في الحاشية.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: إذ إنَّ الله أوضحه لهم
  rationale: «إذ إن» تعليلية، و«أوضحه» تعكس الصلة الدلالية بالفعل السابق «واضح» وتبيّن أن الله هو الذي جعله جليًّا لهم.
theological_decisions:
- issue: دلالة ἐν αὐτοῖς
  choice: بينهم
  alternative: فيهم، أو في داخلهم
  rationale: العبارة اليونانية تحتمل المجال الجماعي العلني كما تحتمل المعنى الداخلي. اختير «بينهم» في المتن لاتساقه مع سياق الإعلان المتاح، مع حفظ الاحتمال الآخر في الحاشية دون حسم التوتر الدلالي.
- issue: دلالة τὸ γνωστὸν
  choice: ما يمكن أن يُعرَف
  alternative: ما هو معروف
  rationale: يمكن أن تدل العبارة على «المعروف» أو «القابل للمعرفة». اختيرت صياغة الإمكان لأنها تعبّر عن نطاق المعرفة المتاح عن الله في هذا السياق من غير ادعاء الإحاطة به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «واضح/أوضحه» للمحافظة على الترابط الدلالي بين φανερόν وἐφανέρωσεν، ووُضعت علامة الحاشية مباشرة بعد العبارة موضع الاحتمال.
