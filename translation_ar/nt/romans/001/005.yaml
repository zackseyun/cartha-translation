  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: ar
  text: الذي به نلنا نعمةً ورسالةً لطاعة الإيمان[a] بين جميع الأمم[b]، لأجل اسمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للطاعة الناشئة من الإيمان»، أو «للطاعة التي هي الإيمان».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «بين جميع الأمم غير اليهودية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: الذي به
  rationale: يحفظ صلة الموصول بما سبق، ويعبّر عن معنى الوساطة في διά مع المضاف إليه.
- source_word: ἐλάβομεν
  choice: نلنا
  rationale: يحفظ صيغة المتكلم الجمع في اليونانية من غير حسم ما إذا كان الجمع حرفيًا أو ذا استعمال بلاغي.
- source_word: χάριν καὶ ἀποστολὴν
  choice: نعمةً ورسالةً
  rationale: يحفظ الاسمين المنسقين في الأصل. و«رسالة» هنا بمعنى الإرسالية أو التكليف الرسولي، وهي أفصح وأيسر من «رسولية» في هذا السياق.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: لكي تطيع ... بالإيمان
  rationale: يبيّن اتجاه الغاية الذي تؤديه εἰς بلغة عربية طبيعية، مع إبقاء العلاقة بين الطاعة والإيمان غير محسومة تمامًا وإيراد البدائل في الحاشية.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: جميع الأمم
  rationale: ينقل المعنى الأشمل لـἔθνη؛ ويمكن أن يدل اللفظ أيضًا على غير اليهود، وهو مذكور في الحاشية.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: من أجل اسمه
  rationale: تعبير عربي طبيعي يحفظ معنى الدافع والغاية المتصلين بكرامة الاسم وصيته.
theological_decisions:
- issue: دلالة ὑπακοὴν πίστεως
  choice: لكي تطيع ... بالإيمان
  alternative: لطاعة الإيمان؛ أو للطاعة الناشئة من الإيمان؛ أو للطاعة التي هي الإيمان
  rationale: الإضافة اليونانية موجزة وتحتمل أن يكون الإيمان مصدر الطاعة أو وصفًا لها أو مضمونًا لها. اختير تركيب عربي مفهوم مع التنبيه إلى الاحتمالات، بدل حصر العبارة في تفسير لاهوتي واحد.
- issue: مدلول صيغة الجمع في ἐλάβομεν
  choice: نلنا
  alternative: نلتُ
  rationale: يحفظ النص صيغة الجمع الصريحة في الأصل، ولا يفترض أن بولس يستعمل جمع التعظيم أو يقصد نفسه وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. قُدِّمت الجملة الفعلية «لكي تطيع جميع الأمم» على إضافة حرفية ثقيلة، مع الحفاظ في الحاشية على الغموض الحقيقي في عبارة «طاعة الإيمان». وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما.
