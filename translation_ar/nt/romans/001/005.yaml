  to: الذي به نلنا نعمةً ورسالةً لطاعة الإيمان[a] بين جميع الأمم[b]، لأجل اسمه.
  rationale: أُعيدت «طاعة الإيمان» إلى المتن لأنها تقابل الإضافة اليونانية الموجزة وتحفظ احتمالاتها دون ترجيح تفسيري. وأُعيد «بين جميع الأمم» إلى وظيفته الظرفية، وصُححت مواضع الحواشي. كما حافظت الصياغة على صيغة الجمع في «نلنا» وعلى الغاية «لأجل اسمه».
