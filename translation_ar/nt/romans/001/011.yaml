  to: فإني أشتاق إلى رؤيتكم، لكي أنقل إليكم عطية روحية ما، لكي تُثبَّتوا.
  rationale: استُبدلت عبارة «أشارككم عطية» بعبارة عربية أوضح تؤدي معنى μεταδίδω، أي نقل شيء أو إيصال نصيب منه إلى الآخرين. كما جُعلت غاية التثبيت في المتن بصيغة المبني للمجهول، المطابقة لبنية اليونانية، فلم تعد الحاشية لازمة. وحُفظ تنكير العطية واتساع وصفها بـ«روحية».
