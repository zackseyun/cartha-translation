source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: ar
  text: فإني أشتاق إلى رؤيتكم، لكي أنقل إليكم عطية روحية ما، لكي تُثبَّتوا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: أشتاق
  rationale: ينقل قوة الرغبة الشخصية بعبارة عربية فصيحة وطبيعية من غير مبالغة.
- source_word: γὰρ
  choice: فإني
  rationale: تحفظ الصلة التفسيرية بما قبلها، وتلائم السياق العربي.
- source_word: ἰδεῖν
  choice: إلى رؤيتكم
  rationale: يحافظ على المعنى المباشر للفعل، من غير تحويله صراحة إلى «زيارتكم».
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر بوضوح عن الغرض المقصود.
- source_word: τι
  choice: ما
  rationale: تحفظ التنكير وعدم التحديد في اليونانية، مع ترتيب عربي طبيعي بعد الاسم.
- source_word: μεταδῶ
  choice: أشارككم
  rationale: يفيد إشراك الآخرين في شيء ومنحهم نصيبًا منه، من غير الإيحاء بأن بولس هو مصدر العطية.
- source_word: χάρισμα
  choice: عطية
  rationale: ترجمة موجزة مألوفة تحفظ معنى الهبة المرتبطة بالنعمة من غير توسع تفسيري.
- source_word: πνευματικὸν
  choice: روحية
  rationale: تحفظ اتساع الوصف اليوناني ولا تحسم إن كان المقصود موهبة مخصوصة من الروح القدس أو نفعًا روحيًا أعم.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: فتتثبّتوا
  rationale: ينقل الغاية أو النتيجة المقصودة بصياغة عربية طبيعية، مع حفظ دلالة التثبيت؛ وتوضح الحاشية البنية المبنية للمجهول في الأصل.
theological_decisions:
- issue: هل تشير عبارة «عطية روحية» إلى موهبة خارقة مخصوصة أم إلى نفع روحي أوسع؟
  choice: عطية روحية ما
  alternative: عطية ما من الروح
  rationale: العبارة اليونانية لا تفرض معنى تقنيًا ضيقًا، لذلك تُركت عامة من غير إدخال تفسير طائفي.
- issue: هل يصوَّر بولس فاعلًا مباشرًا للتثبيت أم يكون المؤمنون هم المتثبّتين؟
  choice: فتتثبّتوا
  alternative: لكي تُثبَّتوا
  rationale: الصياغة المختارة طبيعية وتبقي التركيز على الغاية، بينما تُذكر في الحاشية الصياغة الأقرب إلى المبني للمجهول في الأصل، تجنبًا للمبالغة في نسبة فعل التثبيت إلى بولس.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «أشارككم» بدل «أمنحكم» للحفاظ على معنى المشاركة، و«عطية روحية ما» لصون التنكير والغموض المقصودين. وُضع مؤشر الحاشية بعد العبارة التي يشرحها.
