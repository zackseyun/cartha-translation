lexical_decisions:
- source_word: περὶ
  choice: عن
  rationale: تفيد موضوع البشارة المذكورة في السياق السابق، و«عن» صياغة عربية طبيعية ومباشرة.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ابنه
  rationale: تحافظ على الإضافة الصريحة إلى الله من غير إدخال تفسير زائد.
- source_word: τοῦ γενομένου
  choice: الذي صار
  rationale: تحافظ على القوة اللفظية لاسم الفاعل من γίνομαι وعلى قدر من غموضه المقصود، بدل قصره على معنى نسبي تفسيري مثل «المنحدر» أو «المولود».
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: من نسل داود
  rationale: «نسل» تعبير عربي واضح ذو صدى كتابي، وينقل معنى σπέρμα في سياق الانتماء إلى السلالة الداودية.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: ترجمة قريبة تحفظ اللفظ اللاهوتي المهم σάρξ ولا تستبدله في المتن بتفسير مثل «من جهة نسبه البشري».
theological_decisions:
- issue: العلاقة بين بنوته لله وانتسابه إلى داود
  choice: الإبقاء على «ابنه» و«صار من نسل داود بحسب الجسد» معًا
  alternative: «ابنه الذي، من جهة طبيعته البشرية، كان من ذرية داود»
  rationale: النص يجمع البنوّة الإلهية والانتماء البشري الحقيقي إلى نسل داود من غير أن يشرح كيفية اجتماعهما؛ لذلك تحفظ الترجمة هذا التوتر ولا تحوله إلى صياغة عقائدية لاحقة.
- issue: دلالة «الجسد» في هذا الموضع
  choice: بحسب الجسد
  alternative: بحسب النسب البشري
  rationale: يحافظ الاختيار على عبارة بولس الموجزة، مع بيان المقصود سياقيًا في الحاشية من غير اختزال اللفظ في المتن.
