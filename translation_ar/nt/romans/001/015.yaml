  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: ar
  text: لذلك، فإني من جهتي متشوّق إلى أن أعلن البشارة[a] لكم أيضًا، أنتم الذين في روما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن أبشّركم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تربط العبارة بما سبق وتقدّم النتيجة أو الموقف الناشئ عنه، مع إبقاء المجال الدلالي بين «هكذا» و«لذلك» دون تشديد الاستنتاج أكثر مما يحتمله اليوناني.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: فمن جهتي أنا متشوّق
  rationale: التركيب اليوناني موجز وحذفي، ويدل على الاستعداد المقرون بالرغبة والحماسة. الصياغة العربية تفك الحذف طبيعيًا وتحفظ دلالة πρόθυμον الأقوى من مجرد الجاهزية.
- source_word: καὶ ὑμῖν
  choice: لكم أنتم أيضًا
  rationale: يجعل «أيضًا» متصلًا بالمخاطبين كما يقتضي موضع καὶ، فيبيّن أن أهل روما مشمولون إلى جانب آخرين.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: يا من في روما
  rationale: ينقل تحديد المخاطبين بعبارة عربية مباشرة وطبيعية، مع إبقاء الخطاب بصيغة الشخص الثاني.
- source_word: εὐαγγελίσασθαι
  choice: أن أعلن البشارة
  rationale: ينقل معنى إعلان الخبر السار أو الإنجيل بعبارة مفهومة، ولا يحصر الفعل في صورة الوعظ الرسمي وحده.
theological_decisions:
- issue: توجيه فعل التبشير إلى المؤمنين الموجودين في روما
  choice: الإبقاء على «أن أعلن البشارة لكم»
  alternative: تفسير العبارة على أنها تعني تعليم المؤمنين أو تشجيعهم فقط
  rationale: النص يوجّه εὐαγγελίσασθαι إلى المخاطبين في روما صراحة؛ لذلك حُفظ هذا التوتر دون تضييق دلالة الفعل أو تفسير هوية جميع المخاطبين تفسيرًا زائدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «متشوّق» لإظهار الاستعداد المصحوب بالرغبة، و«أعلن البشارة» لتكون العبارة مفهومة للقارئ العام مع الحفاظ على الصلة بالمصطلح الإنجيلي.
