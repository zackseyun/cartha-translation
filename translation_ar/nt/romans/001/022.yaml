lexical_decisions:
- source_word: φάσκοντες
  choice: وإذ يزعمون
  rationale: اسم فاعل حالي يدل على ادعائهم لأنفسهم؛ و«يزعمون» عربية طبيعية تحفظ معنى التصريح والادعاء والنبرة التهكمية من غير إضافة.
- source_word: εἶναι
  choice: أنهم
  rationale: ينقل مضمون ادعائهم في تركيب عربي سليم، إذ يؤدي تركيب «أنهم حكماء» معنى المصدر اليوناني مع خبره.
- source_word: σοφοὶ
  choice: حكماء
  rationale: يحفظ الصفة الخبرية الموجزة ومعناها التقويمي، ويمهّد للمقابلة البلاغية مع «حمقى».
- source_word: ἐμωράνθησαν
  choice: صاروا حمقى
  rationale: ينقل الدلالة الصيرورية المحتملة وصيغة الجمع الشخصية، ويحفظ المقابلة الحادة بين «حكماء» و«حمقى»؛ أما احتمال «جُعلوا حمقى» فلا يُثبت هنا لأن المبني للمجهول قد يُفهم أيضًا بمعنى صيروري.
theological_decisions:
- issue: هل تُنقل ἐμωράνθησαν بوصفٍ أخلاقي («صاروا جهّالًا/حمقى») أم بتسمية شخصية أقوى («صاروا حمقى»)، وهل تُفهم مبنيًا للمجهول إلهيًا؟
  choice: صاروا حمقى
  alternative: صاروا جاهلين؛ أو جُعلوا حمقى
  rationale: يحفظ هذا الاختيار مفارقة بولس اللاذعة والتوازي بين ادعاء الحكمة والتحول إلى الحماقة، من غير حسم الفاعل على أنه الله أو إدخال تفسير عقدي غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على بنية المقابلة البلاغية في الأصل. استُعملت «حمقى» لا «أغبياء» لملاءمة السجل الكتابي الرصين ولدقة معنى الحماقة المقابل للحكمة.
