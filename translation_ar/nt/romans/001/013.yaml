  to: ولا أريد، أيها الإخوة[a]، أن تجهلوا أنني عزمت مرارًا على أن آتي إليكم، لكنني مُنعت حتى الآن، لكي يكون لي بعض الثمر[b] بينكم أيضًا، كما بين سائر الأمم[c].
