  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: ar
  text: ولا أريد، أيها الإخوة[a]، أن تجهلوا أنني عزمت مرارًا على أن آتي إليكم، لكنني مُنعت حتى الآن، لكي يكون لي بعض الثمر[b] بينكم أيضًا، كما بين سائر الأمم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يشمل هذا النداء الإخوة والأخوات المؤمنين.
    reason: lexical_alternative
  - marker: b
    text: يشير «الثمر» هنا إلى النتائج التي يرجو بولس أن تحققها خدمته بينهم.
    reason: cultural_note
  - marker: c
    text: 'أي: سائر غير اليهود؛ ويمكن ترجمتها أيضًا: «سائر الشعوب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: ولا أريدكم أن تجهلوا
  rationale: يحافظ على صيغة النفي في الأصل، ويؤدي δέ بوصلة عربية طبيعية من غير إدخال معنى زمني.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: ينقل صيغة النداء المذكرة الجمع بصياغة عربية فصيحة، مع بيان شمولها المحتمل للمؤمنات في الحاشية.
- source_word: πολλάκις προεθέμην
  choice: قصدت مرارًا
  rationale: تعبير عربي طبيعي يدل على عزم تكرر في الماضي، من غير أن يوحي بأن الأمر كان مجرد خاطر عابر.
- source_word: ἐκωλύθην
  choice: مُنعت
  rationale: يحفظ المبني للمجهول في اليونانية ولا يحدد جهة المنع، إذ لا يحددها النص هنا.
- source_word: ἄχρι τοῦ δεῦρο
  choice: إلى الآن
  rationale: المقابل العربي الاصطلاحي الواضح للدلالة الزمنية.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: لكي يكون لي بعض الثمر
  rationale: يحفظ استعارة الثمر وصيغة الغاية، ولا يحصر الثمر في معنى لاهوتي واحد لم يصرح به النص.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: أنسب في العربية للسياق الجماعي، مع بقاء معنى تحقق الثمر في وسط المخاطبين.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: سائر الأمم
  rationale: يحفظ المعنى الأساسي لـ ἔθνη ولفظ λοιποῖς، بينما توضح الحاشية أن المراد في السياق قد يكون غير اليهود.
theological_decisions:
- issue: دلالة الثمر في خدمة بولس
  choice: الإبقاء على استعارة «الثمر» في المتن
  alternative: «نتائج خدمتي» أو «حصاد»
  rationale: اللفظ اليوناني مجازي ومفتوح نسبيًا؛ لذلك لا ينبغي للترجمة أن تحصره في الاهتداءات أو في منفعة روحية بعينها، وتكفي الحاشية لبيان المقصود العام.
- issue: دلالة ἔθνη
  choice: «الأمم» في المتن
  alternative: «غير اليهود»
  rationale: «الأمم» يحفظ الصورة الاصطلاحية واللفظية للنص، بينما يبين الهامش الدلالة السياقية المحتملة من غير إلغاء معنى الشعوب أو الأمم تمامًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «قصدت» بدل الألفاظ القديمة الأثقل، وحُفظ المبني للمجهول والاستعارة الزراعية والغموض المتعلق بجهة المنع وطبيعة الثمر. وُضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
