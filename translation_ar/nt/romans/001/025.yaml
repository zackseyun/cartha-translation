source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: ar
  text: هؤلاء استبدلوا حقيقةَ الله بالكذبة، ووقّروا الخليقة وعبدوها بدلًا من الخالق، الذي هو مبارك إلى الأبد. آمين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: استبدلوا ... بـ
  rationale: ينقل فعل المبادلة بوضوح في العربية، مع بيان أنهم تركوا حق الله وأخذوا الكذب مكانه.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: حقَّ الله
  rationale: صياغة عربية طبيعية تحفظ احتمال أن تكون الإضافة بمعنى الحق المتعلق بالله أو الحق الصادر عنه، من غير حسم زائد.
- source_word: ἐν τῷ ψεύδει
  choice: بالكذب
  rationale: يحافظ على التعريف اليوناني من حيث الإشارة إلى الكذب بوصفه نقيض الحق، لكن العربية الطبيعية لا تستلزم قول «الكذبة».
- source_word: ἐσεβάσθησαν
  choice: وقّروا
  rationale: يميّزه عن ἐλάτρευσαν وينقل معنى إبداء التبجيل أو الإجلال.
- source_word: ἐλάτρευσαν
  choice: عبدوها
  rationale: ينقل معنى تقديم العبادة أو الخدمة الدينية، والضمير يوضح أن المفعول هو الخليقة.
- source_word: τῇ κτίσει
  choice: الخليقة
  rationale: يشمل مجموع المخلوقات أو ما هو مخلوق، ويحافظ على المقابلة اللفظية مع الخالق.
- source_word: παρὰ τὸν κτίσαντα
  choice: بدلًا من الخالق
  rationale: 'في هذا السياق تفيد παρά التفضيل الاستبدالي: توجيه التوقير والعبادة إلى الخليقة عوض الخالق.'
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: المبارك إلى الأبد
  rationale: صيغة تسبيح عربية موجزة تحفظ وصف الخالق بالبركة الدائمة.
theological_decisions:
- issue: دلالة «حق الله»
  choice: الإبقاء على تركيب «حق الله»
  alternative: «الحق عن الله» أو «حق الله المعلن»
  rationale: الإضافة اليونانية تحتمل أكثر من علاقة دلالية، فلا ينبغي حصرها في تفسير واحد.
- issue: العلاقة بين توقير الخليقة وعبادتها وبين الخالق
  choice: «بدلًا من الخالق»
  alternative: «أكثر من الخالق»
  rationale: السياق يتحدث عن استبدال الحق بالكذب، ولذلك ترجّح هنا دلالة الإحلال والمقابلة، مع عدم إضافة شرح عقائدي.
- issue: مرجع جملة التسبيح
  choice: ربط «المبارك إلى الأبد» بالخالق
  alternative: 'صياغة تفصل الجملة استئنافًا: «وهو مبارك إلى الأبد»'
  rationale: الضمير الموصول اليوناني يعود مباشرة إلى «الخالق»، والصياغة المختارة تحفظ ذلك بوضوح.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على المقابلة البلاغية بين «الخليقة» و«الخالق»، والتمييز بين التوقير والعبادة دون ألفاظ مذهبية خاصة.
