id: ROM.1.9
reference: Romans 1:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: ar
  text: فإن الله، الذي أعبده بروحي[a] في بشارة ابنه[b]، شاهد لي أنني أذكركم بلا انقطاع[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في روحي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إنجيل ابنه». ويمكن أن تُفهم الإضافة بمعنى «البشارة عن ابنه».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «أصنع ذكرًا لكم بلا انقطاع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: شاهد
  rationale: في هذا الاحتجاج المؤكد، يدل اللفظ على من يشهد بصدق قول بولس؛ و«شاهد» هو المقابل العربي المباشر والطبيعي.
- source_word: λατρεύω
  choice: أعبد
  rationale: يدل الفعل على خدمة دينية موجَّهة إلى الله، و«أعبد» ينقل هذا البعد بوضوح أكبر من «أخدم» في العربية، من غير أن يحصر المعنى في طقس بعينه.
- source_word: ἐν τῷ πνεύματί μου
  choice: بروحي
  rationale: تحتمل ἐν معنى الوسيلة أو المجال؛ و«بروحي» عربية طبيعية تنقل المشاركة الباطنية الشخصية، مع إثبات البديل الأقرب إلى الصيغة اليونانية في الحاشية.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: في بشارة ابنه
  rationale: أُبقي حرف الجر وبنية الإضافة على نحو قريب من اليونانية. و«بشارة» مفهومة في العربية المعاصرة وتحفظ معنى الخبر السار من غير توسع تفسيري إلى «عن ابنه».
- source_word: ἀδιαλείπτως
  choice: بلا انقطاع
  rationale: ينقل الاستمرار المنتظم بعبارة عربية مألوفة ورصينة.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: أذكركم
  rationale: هذا تركيب اصطلاحي معناه الحرفي «أصنع ذكرًا لكم». و«أذكركم» هنا بمعنى أورد ذكركم، وهو أسلس عربيًا، مع توضيح الحرفية في الحاشية.
theological_decisions:
- issue: 'دلالة ἐν τῷ πνεύματί μου: أهي الوسيلة أم المجال الباطني؟'
  choice: بروحي
  alternative: في روحي
  rationale: لا يحسم السياق الدلالة النحوية تمامًا. اختيرت «بروحي» لسلاستها ودلالتها المرجحة على الوسيلة أو الكيفية، مع حفظ البديل في الحاشية.
- issue: علاقة τοῦ υἱοῦ αὐτοῦ بالبشارة
  choice: بشارة ابنه
  alternative: البشارة عن ابنه
  rationale: الإضافة اليونانية يمكن أن تُفهم بوجوه متعددة، منها أن الابن مضمون البشارة. حافظت الترجمة على الإضافة دون حسمها بإدخال «عن».
- issue: ترجمة εὐαγγέλιον بمصطلح كنسي موروث أو بلفظ شفاف
  choice: بشارة
  alternative: إنجيل
  rationale: «بشارة» تنقل معنى الخبر السار بلغة واضحة، في حين قد يُفهم «إنجيل» عند القارئ أساسًا على أنه اسم كتاب؛ ولا يترتب على الخيار تغيير عقائدي.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ورصينة. قُدِّمت جملة الصلة بين فاصلتين للمحافظة على ترابط العبارة، واستُخدم «شاهد لي» بدل تركيب أثقل. جميع بدائل المعنى المهمة المثبتة في الحواشي لها علامات ظاهرة في المتن.
