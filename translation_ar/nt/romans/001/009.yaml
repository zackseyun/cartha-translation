  source_fidelity: 'الترجمة أمينة لبنية النص اليوناني ومعناه: «فإن» تؤدي γάρ، و«شاهد لي» تؤدي صيغة الاحتجاج «الله شاهد لي»، و«أعبده بروحي في بشارة ابنه» تحافظ على علاقات العبارة دون إدخال تفسير حاسم لدلالة ἐν أو للإضافة في «ابنه». كما أن «بلا انقطاع» تنقل ἀδιαλείπτως بدقة.'
