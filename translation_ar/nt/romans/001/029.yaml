lexical_decisions:
- source_word: πεπληρωμένους
  choice: مملوئين
  rationale: يحفظ معنى اسم المفعول التام المبني للمجهول، الدال على حالة قائمة ناتجة عن الامتلاء.
- source_word: πάσῃ ἀδικίᾳ
  choice: بكل نوع من الإثم
  rationale: صياغة عربية طبيعية تنقل الشمول في πάσῃ، وتستعمل «الإثم» للدلالة الأخلاقية الواسعة في ἀδικία دون حصرها في الظلم الاجتماعي.
- source_word: πονηρίᾳ
  choice: الشر
  rationale: لفظ واضح عام يدل على الرداءة الأخلاقية ويميّزه من الخبث المذكور بعده.
- source_word: πλεονεξίᾳ
  choice: الطمع
  rationale: ينقل بوضوح معنى التطلع الجشع إلى المزيد والاستحواذ عليه.
- source_word: κακίᾳ
  choice: الخبث
  rationale: يعكس الجانب المؤذي أو سيئ القصد، مع إبقائه متميزًا من «الشر» الأعم.
- source_word: μεστοὺς
  choice: حافلين بـ
  rationale: ينقل معنى الامتلاء مع الحفاظ على التنويع اللفظي الموجود بين μεστός وπεπληρωμένους.
- source_word: φθόνου
  choice: الحسد
  rationale: المقابل العربي المباشر والدقيق للرذيلة المقصودة.
- source_word: φόνου
  choice: القتل
  rationale: يلائم سياق قائمة الرذائل ويحمل الدلالة الأخلاقية للفعل دون زيادة تفسيرية.
- source_word: ἔριδος
  choice: الخصام
  rationale: لفظ عربي معاصر وموجز يدل على النزاع والتناحر.
- source_word: δόλου
  choice: الخداع
  rationale: ينقل معنى التضليل المتعمد بلغة واضحة.
- source_word: κακοηθείας
  choice: سوء الطوية
  rationale: يعبّر عن فساد النية وسوء النزعة الباطنة، ويحافظ على تمييز الكلمة من κακία المترجمة «الخبث».
- source_word: ψιθυριστάς
  choice: نمّامين في الخفاء
  rationale: ينقل الصورة الحرفية للهمس والوظيفة السياقية، أي نقل الكلام المسيء سرًا، بعبارة مفهومة حديثًا.
