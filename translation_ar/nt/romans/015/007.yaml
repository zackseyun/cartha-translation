source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: ar
  text: لذلك رحِّبوا بعضكم ببعض، كما رحَّب المسيح بكم أيضًا، لمجد الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى مجد الله». وقد تفيد العبارة الغاية أو النتيجة، ويمكن أن تتصل بترحيب المؤمنين بعضهم ببعض أو بترحيب المسيح بهم، أو بكليهما.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق، وتحافظ على الصلة المنطقية بالسياق.
- source_word: προσλαμβάνεσθε
  choice: رحِّبوا
  rationale: صيغة أمر تدعو إلى قبول متبادل فعّال وودّي داخل الجماعة، مع إبقاء التوازي مع فعل المسيح.
- source_word: ἀλλήλους
  choice: بعضكم ببعض
  rationale: تعبير عربي طبيعي يحفظ معنى المعاملة المتبادلة.
- source_word: καθὼς καὶ
  choice: كما ... أيضًا
  rationale: يحفظ دلالة المقارنة في καθὼς والدلالة الإضافية في καί.
- source_word: ὁ Χριστὸς
  choice: المسيح
  rationale: المقابل العربي المألوف للقب Χριστός، ويحفظ دلالته المسيانية من غير تحويله إلى اسم شخصي صرف.
- source_word: προσελάβετο
  choice: رحَّب
  rationale: يكرر الجذر العربي المستخدم للأمر، فيحفظ التوازي المقصود بين عمل المؤمنين وعمل المسيح.
- source_word: ὑμᾶς
  choice: بكم
  rationale: ضمير جمع للمخاطبين، وهو مفعول الفعل في تركيب عربي طبيعي.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: لمجد الله
  rationale: صياغة عربية موجزة تحتمل الغاية أو النتيجة، كما يحتمله تركيب εἰς مع δόξαν.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو اللقب العربي الكتابي الراسخ، ويحفظ المضمون المسياني مع وضوحه للقارئ العام.
- issue: دلالة προσλαμβάνομαι في سياق الجماعة
  choice: رحِّبوا بعضكم ببعض
  alternative: اقبلوا بعضكم بعضًا / استقبلوا بعضكم بعضًا
  rationale: «رحِّبوا» يبرز القبول العلائقي الفعّال في سياق رومية 14–15، من غير حصر المعنى في استقبال مكاني أو إقرار ذهني.
- issue: تعلّق عبارة εἰς δόξαν τοῦ θεοῦ
  choice: 'إبقاؤها في آخر الجملة: لمجد الله'
  alternative: كما رحب بكم المسيح أيضًا لمجد الله
  rationale: موضع العبارة اليونانية يسمح بصلتها بالفعل الرئيس أو بفعل المسيح، وربما بالفعلين؛ إبقاؤها ختامية يحافظ على هذا القدر من الاحتمال ولا يحسم التعلّق نحويًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حوفظ على التوازي اللفظي بين الأمر وفعل المسيح باستعمال «رحِّبوا/رحَّب»، وعلى الغموض الحقيقي في تعلّق العبارة الختامية.
