base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: ar
  text: 'وأن تمجِّد الأمم[a] اللهَ من أجل رحمته، كما هو مكتوب: «لذلك أحمدك بين الأمم، وأرنِّم لاسمك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «الأمم» في صدر الآية بـ«غير اليهود». وفي الاقتباس تحمل الكلمة كذلك المعنى الأوسع: «الشعوب» أو «الأمم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ ἔθνη
  choice: وأن تمجِّد الأممُ
  rationale: «الأمم» هو المقابل العربي الكتابي الطبيعي لغير اليهود، ويحافظ أيضًا على المعنى الأوسع للكلمة في الاقتباس. وصيغة «أن تمجِّد» تُبقي تعلق المصدر بما قبله في الآية السابقة.
- source_word: ὑπὲρ ἐλέους
  choice: من أجل رحمته
  rationale: تفيد ὑπέρ مع المضاف إليه هنا السبب أو الأساس، والضمير يوضح طبيعيًا أن الرحمة رحمة الله.
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة ودقيقة لصيغة الاستشهاد الكتابي.
- source_word: ἐξομολογήσομαί σοι
  choice: أحمدك
  rationale: الفعل في هذا السياق يدل على إعلان الحمد أو الشكر لله، لا الاعتراف بالخطية؛ و«أحمدك» موجزة وتنسجم مع موازاة الترنيم.
- source_word: ἐν ἔθνεσι
  choice: بين الأمم
  rationale: تحفظ الدلالة المكانية لـἐν مع الجمع، كما تحفظ الصلة اللفظية بذكر الأمم في أول الآية.
- source_word: τῷ ὀνόματί σου ψαλῶ
  choice: أرنِّم لاسمك
  rationale: ψάλλω هنا يعني إنشاد التسبيح، و«أرنّم» تعبير عربي كتابي واضح يحفظ صورة العبادة، مع إبقاء العبارة «لاسمك».
theological_decisions:
- issue: تعلّق العبارة الافتتاحية بما قبلها
  choice: صيغت «وأن تمجِّد الأممُ اللهَ» بوصفها استمرارًا نحويًا للآية السابقة.
  alternative: صياغتها جملة مستقلة مثل «أما الأمم فتمجِّد الله».
  rationale: المصدر δοξάσαι متعلق نحويًا بسياق رومية 15:8؛ لذلك لا ينبغي تحويله إلى تقرير مستقل، ولا إضافة فاعل أو علاقة سببية غير مصرّح بها.
- issue: دلالة ἔθνη في كلام بولس والاقتباس
  choice: «الأمم» في الموضعين.
  alternative: «غير اليهود» في صدر الآية و«الشعوب» أو «الأمم» في الاقتباس.
  rationale: «الأمم» تشمل في سياق بولس غير اليهود، وتحافظ في الوقت نفسه على الاتساع الدلالي للاقتباس وعلى تكرار اللفظة اليونانية ذاتها.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظت تبعية صدر الآية للسياق السابق، ووُحِّدت ترجمة ἔθνη في موضعيها مع توضيح البديل في الحاشية.
