  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: ar
  text: إذًا، لديّ سبب للافتخار في المسيح يسوع فيما يختص بالله[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لديّ ما أفتخر به» أو «لديّ أساس للافتخار».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في الأمور المتعلقة بالله» أو «في الأمور التي تخص الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: لي
  rationale: تؤدي معنى الملك أو التوفر في صياغة عربية طبيعية، وتحافظ على كون العبارة تقريرًا شخصيًا في الزمن الحاضر.
- source_word: οὖν
  choice: إذًا
  rationale: تُظهر أن القول نتيجة لما سبقه، من غير إثقال الأسلوب.
- source_word: τὴν καύχησιν
  choice: ما أفتخر به
  rationale: صياغة عربية مألوفة تنقل معنى الافتخار، مع احتمال دلالة الاسم اليوناني على أساس الافتخار أو سببه.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: تحافظ «في» على دلالة المجال أو الاتحاد، ولا تحولها إلى معنى الوسيلة. و«المسيح» هو المقابل العربي المألوف للقب Χριστός.
- source_word: τὰ πρὸς τὸν θεόν
  choice: من جهة ما يختص بالله
  rationale: تنقل سعة التعبير اليوناني، الذي يشير إلى الأمور المتعلقة بالله، من غير حصره في خدمة كهنوتية بعينها.
- source_word: θεόν
  choice: الله
  rationale: المقابل العربي القياسي في هذا السياق.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية ترجمة راسخة للقب وليست مجرد نقل صوتي، وهي واضحة وطبيعية في تركيب «المسيح يسوع».
- issue: طبيعة افتخار بولس
  choice: إبقاء الافتخار مقيدًا بعبارتي «في المسيح يسوع» و«ما يختص بالله»
  alternative: تفسيره صراحةً بأنه ثقة شخصية أو افتخار بالخدمة
  rationale: النص يحدد إطار الافتخار، لكنه لا يشرح في هذه الآية وحدها طبيعته شرحًا كاملًا؛ لذلك لا تضيف الترجمة تفسيرًا مذهبيًا ولا تزيل التوتر القائم في اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت صياغة «لي ما أفتخر به» بدل تركيب اسمي حرفي ثقيل، مع إبقاء «في المسيح يسوع» والتعبير الواسع المتعلق بالله دون تضييق تفسيري.
