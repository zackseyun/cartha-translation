source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: ar
  text: لكي تمجِّدوا، بقلبٍ واحدٍ وفمٍ واحدٍ[a]، إلهَ ربِّنا يسوعَ المسيحِ وأباه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن يقال بأسلوب عربي أكثر اصطلاحية: «وبصوتٍ واحد». أمّا اليونانية فتقول حرفيًا: «وفمٍ واحد»، مشددةً على وحدة التسبيح.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا صياغة العبارة: «اللهَ أبا ربِّنا يسوعَ المسيح». أمّا النص اليوناني فيقرن «الإله» و«الأب» بأداة تعريف واحدة.'
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المتصلة بما سبق، وهي صياغة عربية طبيعية.
- source_word: ὁμοθυμαδόν
  choice: بقلبٍ واحدٍ
  rationale: ينقل وحدة القصد والانسجام الجماعي، مع تمييزه عن صورة «فم واحد» التالية.
- source_word: ἐν ἑνὶ στόματι
  choice: وفمٍ واحدٍ
  rationale: يحفظ الصورة الجسدية الحية في اليونانية، مع إمكان التعبير الاصطلاحي «بصوت واحد» في الحاشية.
- source_word: δοξάζητε
  choice: تمجِّدوا
  rationale: فعل عربي مألوف ورصين في سياق تسبيح الله، ويلائم صيغة الغاية بعد «لكي».
- source_word: τὸν θεὸν καὶ πατέρα
  choice: إلهَ ... وأباه
  rationale: يعكس اشتراك الاسمين في أداة تعريف واحدة، ويفيد أن المشار إليه هو إله الرب يسوع وأبوه، مع تجنب تركيب عربي ثقيل أو ملتبس.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ربِّنا
  rationale: نقل مباشر للقب κύριος ولضمير المتكلمين الجمع.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوعَ المسيحِ
  rationale: «يسوع» اسم منقول، و«المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته المسيانية.
theological_decisions:
- issue: العلاقة النحوية في τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν
  choice: إلهَ ربِّنا يسوعَ المسيحِ وأباه
  alternative: اللهَ أبا ربِّنا يسوعَ المسيح
  rationale: الاختيار يحفظ بصورة طبيعية كون «الإله» و«الأب» وصفين للمرجع نفسه وعلاقتهما بالرب يسوع، من غير تحويل καί إلى تفسير «أي» على نحو يحسم التركيب أكثر مما يقتضيه النص.
- issue: ترجمة Χριστός في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» لقب عربي دلالي راسخ لا مجرد نقل صوتي، وهو أوضح وأكرم أسلوبًا من «الممسوح» في هذا السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. حُفظت صورة «فم واحد» في المتن، واستُعمل «بقلب واحد» لنقل وحدة القصد دون تكرار «بصوت واحد». وُضعت الفواصل لتيسير قراءة العبارة الغائية الطويلة.
