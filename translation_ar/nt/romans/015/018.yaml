base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: ar
  text: فإني لن أجرؤ أن أتكلم إلا عمّا أنجزه المسيح بواسطتي من أجل طاعة الأمم[a]، بالقول والعمل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي غير اليهود؛ ويمكن أيضًا ترجمتها: «الشعوب».'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن صياغة صدر الآية: «فإني لن أجرؤ أن أتكلم إلا بما أنجزه المسيح بواسطتي».'
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: لا أجرؤ
  rationale: ينقل معنى الإقدام والجرأة في صيغة عربية طبيعية، مع بقاء دلالة المستقبل مفهومة بوصفها إعلانًا عن امتناع بولس.
- source_word: τι λαλεῖν ... ὧν οὐ
  choice: أن أتكلم عن شيء إلا
  rationale: 'يصوغ التركيب اليوناني المقيد صياغة عربية واضحة: لا يتحدث بولس عن شيء سوى ما عمله المسيح.'
- source_word: κατειργάσατο
  choice: أنجزه
  rationale: يفيد الفعل إحداث الشيء وإتمامه بفاعلية، و«أنجز» واضحة وموجزة في هذا السياق.
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ العربي المألوف للقب اليوناني Χριστός، ويحافظ هنا على دلالته المسيانية.
- source_word: δι’ ἐμοῦ
  choice: بواسطتي
  rationale: يحفظ كون المسيح هو الفاعل الأساسي وبولس الوسيلة التي جرى العمل من خلالها.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: من أجل طاعة الأمم
  rationale: يحافظ على العبارة الغائية أو الناتجية دون حسم زائد، وعلى اتساع معنى ἔθνη بين الأمم وغير اليهود.
- source_word: λόγῳ καὶ ἔργῳ
  choice: بالقول والعمل
  rationale: تعبير عربي طبيعي يحفظ ازدواج وسيلتي الكلام والفعل، كما يبقي تعلق العبارة بما قبلها قريبًا من مرونة الأصل.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب، ويؤدي المعنى المسياني من غير تحويله إلى اسم شخصي مجرد.
- issue: دلالة ἐθνῶν
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» أقرب إلى اللفظ اليوناني وتحفظ إمكان معنى الشعوب، بينما يفهم السياق البولسي منها خصوصًا غير اليهود؛ وقد بُيّن ذلك في الحاشية.
- issue: تعلق λόγῳ καὶ ἔργῳ
  choice: إبقاء «بالقول والعمل» في آخر الجملة
  alternative: ربطها صراحة بعمل المسيح أو بطاعة الأمم
  rationale: موضع العبارة في الأصل يسمح بشيء من المرونة في التعلق، ولذلك لا تُحسم بإضافة تفسير غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «لا أجرؤ» بدل صياغة مستقبلية ثقيلة، وحُفظ التركيب المقيد «إلا» والتوتر الدلالي في «من أجل طاعة الأمم». جميع علامات الحواشي مثبتة في المتن.
