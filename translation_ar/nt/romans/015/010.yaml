  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: ar
  text: 'ويقول أيضًا: «افرحي يا أيتها الأمم مع شعبه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «افرحي يا أيتها الأمم، أي غير اليهود، مع شعبه».'
    reason: توضيح أن «الأمم» في سياق حجة بولس تشير إلى غير اليهود، مع حفظ اللفظ الأوسع في المتن.
lexical_decisions:
- source_word: πάλιν
  choice: أيضًا
  rationale: في صيغة إيراد اقتباس كتابي إضافي، تؤدي «أيضًا» المعنى الطبيعي لـπάλιν في العربية، من غير إيحاء بضرورة تكرار القول نفسه.
- source_word: λέγει
  choice: يقول
  rationale: أُبقي المضارع وفق صيغة الاقتباس في اليونانية، إذ يُقدَّم النص الكتابي بوصفه متكلمًا في الحاضر، مع إبقاء الفاعل الضمني كما هو.
- source_word: Εὐφράνθητε
  choice: افرحي
  rationale: فعل أمر يدل اصطلاحيًا على الفرح والابتهاج. وجاء مؤنثًا مفردًا مراعاةً لمعاملة «الأمم» جمع غير العاقل في العربية، مع الحفاظ على قوة الأمر.
- source_word: ἔθνη
  choice: الأمم
  rationale: «الأمم» هي المقابل العربي المباشر والطبيعي، وتحفظ صلة الاقتباس بخلفيته الكتابية؛ وفي سياق رومية يُراد بها غير اليهود، وهو موضح في الحاشية.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: مع شعبه
  rationale: تنقل «مع» معنى المصاحبة في μετά مع المضاف إليه، وتحفظ «شعبه» الدلالة العهدية من غير إضافة تفسيرية مثل «إسرائيل».
theological_decisions:
- issue: دلالة ἔθνη في سياق وحدة اليهود وغير اليهود
  choice: الأمم
  alternative: غير اليهود
  rationale: يحفظ اختيار «الأمم» اللفظ الأوسع للاقتباس ولا يحسمه بتفسير سياقي داخل المتن، بينما تبين الحاشية أن المقصود في حجة بولس هم غير اليهود.
- issue: مرجع «شعبه»
  choice: الإبقاء على «شعبه» دون تعيين
  alternative: شعب إسرائيل
  rationale: النص اليوناني يقول «شعبه» فحسب. ومع أن المرجع في خلفية الاقتباس هو إسرائيل، فإن التصريح به في المتن سيكون توسعًا تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل النداء «يا أيتها الأمم» لتوضيح المخاطَب وصوغ الأمر صياغة عربية طبيعية، مع إبقاء الاقتباس موجزًا.
