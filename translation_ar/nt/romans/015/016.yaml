source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: ar
  text: لأكون خادمًا للمسيح يسوع لدى غير اليهود[a]، أؤدي خدمة كهنوتية لإنجيل الله[b]، لكي يصير قربان الأمم[c] مقبولًا، مقدَّسًا بالروح القدس[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى الأمم». والمقصود في هذا السياق: غير اليهود؛ ويمكن ترجمتها أيضًا: «إلى الشعوب».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أقوم بعمل كهنوتي» أو «أخدم خدمة كاهن».'
    reason: lexical_alternative
  - marker: c
    text: 'الأرجح أن المقصود هو الأمم أنفسهم مقدَّمين لله قربانًا؛ ويحتمل أيضًا: «القربان الذي يقدمه الأمم».'
    reason: alternative_reading
  - marker: d
    text: 'ويجوز أيضًا: «مقدَّسًا في الروح القدس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: خادمًا
  rationale: تدل الكلمة على من يؤدي خدمة عامة أو دينية. واختيار «خادم» طبيعي في العربية ويحفظ معنى الخدمة، فيما يوضح الفعل التالي الطابع الكهنوتي للاستعارة.
- source_word: Χριστοῦ Ἰησοῦ
  choice: للمسيح يسوع
  rationale: يحفظ «المسيح» دلالة Χριστός اللقبية المألوفة، مع إبقاء ترتيب العبارة اليونانية.
- source_word: εἰς τὰ ἔθνη
  choice: بين الأمم
  rationale: السياق يتناول رسالة بولس إلى غير اليهود. و«الأمم» هو التعبير العربي الكتابي الواضح الذي يحتمل أيضًا معناه الحرفي؛ وتوضح الحاشية المقصود السياقي.
- source_word: ἱερουργοῦντα
  choice: أؤدي خدمة كهنوتية
  rationale: الفعل ذو دلالة شعائرية وكهنوتية صريحة. تنقل العبارة الاستعارة بوضوح من غير أن تفترض لبولس منصبًا كهنوتيًا مؤسسيًا.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: لإنجيل الله
  rationale: «الإنجيل» مصطلح عربي راسخ للخبر السار، والإضافة تحفظ بنية العبارة اليونانية من غير حسم ما إذا كانت دلالتها المصدر أو الملكية.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: قربان الأمم
  rationale: 'تحفظ العبارة الإضافة اليونانية وغموضها الحقيقي: قد يكون الأمم أنفسهم هم القربان، أو يكون المقصود قربانًا يقدمونه.'
- source_word: εὐπρόσδεκτος
  choice: مقبولًا
  rationale: تعبير عربي طبيعي في سياق القرابين، ويدل على ما يحظى بالقبول عند الله.
- source_word: ἡγιασμένη
  choice: مقدَّسًا
  rationale: ينقل اسم المفعول اليوناني التام حالة ناتجة من فعل التقديس، ويحافظ على صلة اللفظ بحقل القداسة.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: بالروح القدس
  rationale: تفهم الباء معنى الوسيلة أو الفاعلية في ἐν، أي أن الروح القدس هو الذي يتم به التقديس، مع إثبات احتمال معنى «في الروح القدس» في الحاشية.
theological_decisions:
- issue: وصف بولس خدمته بلغة كهنوتية
  choice: الإبقاء على الاستعارة الكهنوتية صريحة في «أؤدي خدمة كهنوتية» ضمن خدمة الإنجيل.
  alternative: فهم العبارة على أنها منصب كهنوتي رسمي، أو تسطيحها إلى مجرد خدمة عامة.
  rationale: اجتماع λειτουργός وἱερουργέω وπροσφορά يكوّن صورة كهنوتية متعمدة، لكن موضوعها خدمة الإنجيل وقربان الأمم، لا ذبيحة تكفيرية أخرى ولا بنية كنسية لاحقة.
- issue: المقصود بقربان الأمم
  choice: إبقاء «قربان الأمم» في المتن، مع بيان أن الأرجح أن الأمم أنفسهم هم القربان.
  alternative: قربان يقدمه الأمم.
  rationale: سياق رسالة بولس إلى الأمم والاستعارة الكهنوتية يرجحان كون المؤمنين من الأمم هم القربان، لكن صيغة المضاف إليه اليونانية لا تلغي احتمال أن يكون القربان مقدمًا منهم.
- issue: دلالة ἐν مع الروح القدس
  choice: «بالروح القدس» للدلالة على الوسيلة أو الفاعلية.
  alternative: «في الروح القدس» للدلالة على المجال أو الحيز.
  rationale: كلا المعنيين ممكن نحويًا؛ ترجمة المتن تقدم القراءة الأرجح سياقيًا، والحاشية تصون البديل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على شبكة الصور الكهنوتية في النص من خلال «خادم»، و«خدمة كهنوتية»، و«قربان»، من غير إثقال العبارة بمصطلحات طقسية غامضة. وُضعت جميع علامات الحواشي في المتن.
