  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: ar
  text: 'فَإِنَّ الْمَسِيحَ أَيْضًا لَمْ يُرْضِ نَفْسَهُ، بَلْ كَمَا هُوَ مَكْتُوبٌ: «إِهَانَاتُ الَّذِينَ يُهِينُونَكَ وَقَعَتْ عَلَيَّ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الاقتباس من مزمور 69:9 بحسب الترقيم العبري، ومن مزمور 68:10 بحسب ترقيم السبعينية.
    reason: تحديد مصدر الاقتباس وبيان اختلاف ترقيم المزامير بدقة.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإنَّ... أيضًا
  rationale: تنقل «فإنَّ» وظيفة الربط التعليلي بما سبق، بينما تحفظ «أيضًا» عنصر التوكيد الدال على أن المسيح نفسه هو المثال المؤيد للوصية.
- source_word: ὁ Χριστός
  choice: المسيح
  rationale: اللفظ هنا ذو قوة لقبيّة، و«المسيح» هو المقابل العربي الطبيعي الراسخ، ويحفظ الدلالة المسيانية من غير تحويله إلى مجرد اسم علم.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: لم يُرضِ نفسه
  rationale: ترجمة قريبة تحفظ فعل الإرضاء والضمير الانعكاسي، من غير إضافة تفسير مثل «لم يسعَ إلى مسرته الخاصة».
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: بل كما هو مكتوب
  rationale: 'صيغة عربية مألوفة للاقتباس الكتابي، وتحافظ على نتيجة صيغة التمام اليونانية: أمر مكتوب قائم.'
- source_word: ὀνειδισμοί
  choice: تعييرات
  rationale: تحفظ الصلة الاشتقاقية بالفعل التالي وتؤدي معنى الإهانات والتقريع مع نبرة كتابية مهيبة.
- source_word: τῶν ὀνειδιζόντων σε
  choice: الذين عيَّروك
  rationale: صياغة عربية طبيعية للمشاركة اليونانية، وتحافظ على تكرار الجذر الدلالي بين الاسم والفعل.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: وقعت عليَّ
  rationale: مقابل مباشر وطبيعي للاستعارة اليونانية، مع إبقاء الفعل في الماضي وفق صيغة المصدر.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح المنتظر، أو كريستوس بوصفه اسمًا
  rationale: «المسيح» في العربية يحمل بذاته معنى اللقب المسياني، ويلائم أداة التعريف والدور التمثيلي في السياق من غير شرح زائد داخل النص.
- issue: هوية المتكلم في اقتباس المزمور
  choice: الإبقاء على ضمير المتكلم «عليَّ» بلا تعريف تفسيري
  alternative: التصريح بأن المتكلم هو المسيح
  rationale: يطبّق بولس الاقتباس على المسيح، لكن نص الاقتباس نفسه لا يصرّح بهوية المتكلم؛ لذلك تُحفظ المسافة والتوتر التفسيري في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُعملت «تعييرات/عيَّروك» للمحافظة على التكرار الاشتقاقي في اليونانية، ووُضعت علامة الحاشية بعد الاقتباس لتوثيق مصدره.
