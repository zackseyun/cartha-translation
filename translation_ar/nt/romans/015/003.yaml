  source_fidelity: 'النص ينقل المعنى الأساسي بأمانة. لكن اسم الفاعل اليوناني τῶν ὀνειδιζόντων («الذين يعيّرونك/يهينونك») حُوِّل إلى فعل ماضٍ في «الذين عيّروك»، والأولى إبقاء الصيغة الجارية. كما أن مرجع السبعينية في الحاشية غير دقيق: موضع العبارة هو مزمور 68:10 في ترقيم السبعينية، لا 69:10.'
