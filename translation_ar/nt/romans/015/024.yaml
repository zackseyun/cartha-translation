id: ROM.15.24
reference: Romans 15:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: ar
  text: متى توجَّهتُ إلى إسبانيا[a]، فإني أرجو، وأنا مارٌّ في طريقي، أن أراكم، وأن تعينوني على متابعة سفري إلى هناك[b]، إن شبعتُ أولًا، إلى حدٍّ ما، من صحبتكم[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين أتوجَّه إلى إسبانيا». يدل التركيب اليوناني على وقت مستقبلي غير محدد.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وأن تشيّعوني إلى هناك». قد يدل الفعل على مساعدة المسافر أو مرافقته في مواصلة رحلته.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «إن امتلأتُ أولًا منكم إلى حدٍّ ما». ويُرجَّح أن المقصود التمتع بصحبتهم أو شركتهم بقدر محدود قبل مواصلة السفر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: متى توجَّهتُ
  rationale: ينقل زمنًا مستقبليًا غير محدد مع بقاء عنصر التوقع، ويأتي طبيعيًا في العربية الفصحى.
- source_word: Σπανίαν
  choice: إسبانيا
  rationale: الاسم الجغرافي العربي المألوف.
- source_word: ἐλπίζω γὰρ
  choice: فإني أرجو
  rationale: تحفظ الفاء وظيفة γάρ التفسيرية، ويعبّر «أرجو» عن توقع تصحبه رغبة.
- source_word: διαπορευόμενος
  choice: وأنا مارٌّ في طريقي
  rationale: يبين أن زيارة روما ستكون في أثناء العبور إلى وجهة أخرى.
- source_word: θεάσασθαι ὑμᾶς
  choice: أن أراكم
  rationale: ترجمة مباشرة وطبيعية للقاء الشخصي المقصود في سياق السفر.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: أن تعينوني على متابعة سفري إلى هناك
  rationale: ينقل معنى تقديم العون للمسافر كي يواصل رحلته، من غير تحديد ما إذا كان العون ماديًا أو بالمرافقة أو بغير ذلك.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: إن شبعتُ
  rationale: تحفظ «إن» معنى الشرط المستقبلي، ويحافظ «شبعت» على استعارة الامتلاء مع صياغة عربية مفهومة.
- source_word: πρῶτον ἀπὸ μέρους
  choice: أولًا، إلى حدٍّ ما
  rationale: ينقل الأولوية الزمنية والقيد الجزئي من غير حسم ما إذا كان القيد متعلقًا بمدة الزيارة أو بمقدار الاكتفاء.
- source_word: ὑμῶν
  choice: من صحبتكم
  rationale: يوضح المعنى العلاقي الذي يقتضيه السياق، بدل الصياغة الحرفية المستغلقة «منكم» وحدها.
theological_decisions:
- issue: طبيعة العون الذي يرجوه بولس من مؤمني روما
  choice: أن تعينوني على متابعة سفري إلى هناك
  alternative: أن تشيّعوني إلى هناك
  rationale: الفعل قد يشمل التجهيز أو المساعدة أو المرافقة، لكن النص لا يحدد صورة العون؛ لذلك أبقت الصياغة المعنى عامًا.
- issue: معنى شبع بولس من الروم
  choice: إن شبعتُ أولًا، إلى حدٍّ ما، من صحبتكم
  alternative: إن اكتفيتُ أولًا بعض الاكتفاء بصحبتكم
  rationale: تحفظ الصياغة استعارة الامتلاء والقيد الجزئي، مع عدم حسم ما إذا كان المقصود الانتعاش العاطفي أو التمتع بالشركة أو قِصر مدة الزيارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الجملة بوصفها جزءًا متصلًا بالسياق اللاحق، ولذلك انتهت بشرطة طويلة. وُضعت علامات الحواشي في المتن بحسب مواضعها.
