lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تُبقي أداة الغاية مرتبطة بطلب بولس السابق، وهي صياغة عربية طبيعية وواضحة.
- source_word: ἐν χαρᾷ
  choice: بفرح
  rationale: تنقل العبارة الظرفية الدالة على الحال مع الحفاظ على اسم «الفرح».
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: آتي إليكم
  rationale: يُصاغ اسم الفاعل اليوناني ضمن جملة الغاية صياغة عربية سلسة، مع إبقاء معنى الوصول إلى المخاطَبين.
- source_word: διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  rationale: تعبير عربي مألوف يحفظ معنى أن المجيء متحقق بواسطة مشيئة الله أو وفقها، من غير حسم زائد لطبيعة العلاقة الدلالية.
- source_word: συναναπαύσωμαι
  choice: فأستريح معكم
  rationale: ينقل معنى نيل الراحة في صحبة المؤمنين؛ وتوضح الحاشية أن الفعل المركب قد يفيد الراحة أو الانتعاش المشترك والمتبادل.
theological_decisions:
- issue: الطابع المشترك لراحة بولس المنشودة مع مؤمني روما
  choice: فأستريح معكم
  alternative: فنتبادل الراحة؛ فأنتعش معكم؛ فأجد الراحة معكم
  rationale: يحافظ المتن على عربية طبيعية من غير تحويل الفعل إلى مفهوم لاهوتي اصطلاحي، بينما تصون الحاشية دلالة المشاركة أو التبادل التي يوحي بها المقطع συν- في الفعل اليوناني.
