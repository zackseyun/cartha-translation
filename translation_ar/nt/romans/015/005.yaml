  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: ar
  text: ولْيَهَبْ لكم إلهُ الثبات والتشجيع أن يكون لكم الفكرُ نفسه فيما بينكم[a]، وفقًا للمسيح يسوع[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تكونوا متّحدي الفكر» أو «أن يكون لكم رأي واحد».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية حرفيًا: «بحسب المسيح يسوع»؛ وقد تفيد أن هذا الفكر منسجم مع المسيح يسوع أو مطابق لمثاله.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: إلهُ
  rationale: جاءت δέ هنا للانتقال اللطيف إلى دعاء، ولا يلزم إظهارها بأداة استدراك عربية قد توحي بتعارض أقوى؛ وصيغة الدعاء ظاهرة في «ولْيَهَبْ».
- source_word: τῆς ὑπομονῆς
  choice: الثبات
  rationale: يدل اللفظ على المثابرة والصمود تحت الضغط، و«الثبات» عربي طبيعي موجز يلائم السياق.
- source_word: τῆς παρακλήσεως
  choice: التشجيع
  rationale: يحفظ المعنى الداعم الواسع للفظ، الذي قد يشمل أيضًا التعزية والحث، ويتوافق مع سياق الآية السابقة.
- source_word: δῴη
  choice: ولْيَهَبْ لكم
  rationale: ينقل صيغة التمني والدعاء في فعل optative، بصياغة عربية فصيحة وطبيعية.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: أن يكون لكم الفكرُ نفسه
  rationale: يحافظ على دلالة وحدة التوجه أو الذهنية من غير أن يفرض تطابقًا في كل رأي أو مسألة.
- source_word: ἐν ἀλλήλοις
  choice: بعضُكم نحو بعض
  rationale: يعبّر عن البعد التبادلي والعلاقاتي في الجماعة، مع إبقاء اتجاه العبارة اليونانية محتملًا.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: وفقًا للمسيح يسوع
  rationale: تنقل κατά بوصفها معيارًا أو توافقًا، وتترجم Χριστός بلقبه الدال «المسيح» مع نقل اسم يسوع.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح / كريستوس يسوع
  rationale: «المسيح» هو المقابل العربي الدال للقب Χριστός، ويحفظ ترتيب الأصل «المسيح يسوع» ودلالته اللقبية.
- issue: مدى وحدة الفكر في τὸ αὐτὸ φρονεῖν
  choice: أن يكون لكم الفكر نفسه
  alternative: أن تكونوا متفقي الفكر
  rationale: الصياغة المختارة تحفظ التوتر بين وحدة الذهنية والتطابق الكامل في الآراء، ولا تحسم العبارة على أنها تماثل في كل مسألة.
- issue: مرجع المعيار في κατὰ Χριστὸν Ἰησοῦν
  choice: وفقًا للمسيح يسوع
  alternative: كما يليق بأتباع المسيح يسوع
  rationale: الإبقاء على العبارة موجزة يحفظ احتمال كون المسيح المعيار أو كون الفكر منسجمًا معه، من غير إضافة تفسير طائفي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة دعائية وقورة. استُعمل «الثبات» بدل «الصبر» لإبراز المثابرة، وأُبقي تركيب «المسيح يسوع» وفق ترتيب الأصل ودلالة اللقب.
