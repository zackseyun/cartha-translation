    text: 'أو: «أن تقوما بمشاركةٍ ما»؛ فالعبارة اليونانية تشدد على المشاركة التي تتجسد في العون المادي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: سُرَّتا
  rationale: ينقل الفعل معنى الرضا والاستعداد الإيجابي، لا مجرد اتخاذ قرار؛ وجاء التثنية لأن اسمي الإقليمين متقدمان في الجملة العربية.
- source_word: γὰρ
  choice: لأن
  rationale: يفيد تعليل الكلام السابق وشرحه، و«لأن» رابط عربي واضح في هذا السياق.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: مكدونية وأخائية
  rationale: أُبقي اسما الإقليمين كما في اليونانية، حيث يُستعملان مجازًا للدلالة على جماعات المؤمنين فيهما، من غير إضافة «الكنائس» أو «المؤمنين» إلى المتن.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: بأن تقدِّما مساهمةً
  rationale: «مساهمة» تؤدي المعنى المادي المقصود في سياق جمع العون، مع بقاء إيحاء المشاركة والتضامن. والتنكير في العربية يلائم τινά من غير العبارة غير الطبيعية «مساهمة ما».
- source_word: εἰς τοὺς πτωχοὺς
  choice: لفقراء
  rationale: تفيد اللام توجيه المساهمة إلى المستفيدين، و«الفقراء» ترجمة مباشرة للاسم الوصفي المستعمل استعمال الاسم.
- source_word: τῶν ἁγίων
  choice: القديسين
  rationale: يحافظ اللفظ على تسمية بولس المعتادة للمؤمنين وعلى الصلة الإضافية في العبارة اليونانية.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: الذين في أورشليم
  rationale: توضح الصلة أن القديسين المعنيين موجودون في أورشليم، مع الحفاظ على البنية الدلالية للمصدر.
theological_decisions:
- issue: ترجمة ἅγιοι في الاستعمال البولسي
  choice: القديسين
  alternative: المقدسين؛ شعب الله
  rationale: «القديسون» تسمية بولسية جماعية للمؤمنين، ولا تقتصر هنا على أشخاص أُعلنت قداستهم في تقاليد لاحقة.
- issue: دلالة أسماء الإقليمين بوصفهما فاعلين
  choice: الإبقاء على «مكدونية وأخائية»
  alternative: مؤمنو مكدونية وأخائية؛ كنائس مكدونية وأخائية
  rationale: يحفظ الاختيار المجاز المكاني في النص اليوناني ولا يضيف تحديدًا كنسيًا غير مصرح به، مع أن الجماعات المؤمنة هي المقصودة سياقيًا.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة. استُعملت «مساهمة» لأنها طبيعية في العربية المعاصرة وتجمع بين معنى العطاء المادي والمشاركة، وأُبقي «أورشليم» و«القديسين» اتساقًا مع السجل الكتابي.
