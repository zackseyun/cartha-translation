source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: ar
  text: فعلينا نحن الأقوياء أن نحتمل أوجه ضعف الضعفاء[a]، وألّا نرضي أنفسنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أوجه قصور الضعفاء». يمكن للكلمة اليونانية أن تدل على مواطن الضعف أو القيود أو أوجه القصور؛ ويبدو أنها تشير هنا إلى تحفظات الضمير أو قيوده التي تناولها الأصحاح السابق.'
    reason: بديل معجمي وتوضيح سياقي
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: فعلينا
  rationale: يفيد التزامًا أخلاقيًا واجبًا، ويؤدي صيغة المضارع الخبرية ذات القوة الحثية من غير تحويلها إلى أمر مباشر.
- source_word: δὲ
  choice: فـ
  rationale: أداة انتقال وربط خفيف بالسياق السابق؛ والفاء العربية طبيعية هنا من غير إقحام معنى زمني أو إبراز تعارض شديد.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: نحن الأقوياء
  rationale: يحفظ توكيد الضمير والتعبير الاسمي، ويواصل تقابل الأقوياء والضعفاء في رومية 14–15.
- source_word: τὰ ἀσθενήματα
  choice: أوجه ضعف
  rationale: تعبير واسع يشمل مواطن الضعف والقيود وأوجه القصور، ولا يوحي بالضرورة بمرض جسدي أو بخطايا متعمدة.
- source_word: τῶν ἀδυνάτων
  choice: الضعفاء
  rationale: يحفظ التقابل السياقي مع الأقوياء، والمقصود أساسًا أصحاب الضمائر الأكثر تقييدًا في المسائل السابقة.
- source_word: βαστάζειν
  choice: أن نحتمل
  rationale: ينقل معنى حمل عبء ضعف الآخرين والتعامل معه بصبر ومساندة، لا مجرد الاعتراف به.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: وألّا نرضي أنفسنا
  rationale: صياغة عربية مباشرة تحفظ المعنى الانعكاسي والتقابل الأخلاقي مع احتمال ضعف الآخرين.
theological_decisions:
- issue: مدلول «الأقوياء» و«الضعفاء»
  choice: يشير التعبيران أساسًا إلى مؤمنين يختلفون في قوة الضمير ومدى الحرية التي يسمحون بها لأنفسهم في مسائل الطعام والأيام الواردة في السياق.
  alternative: القوة والضعف الاجتماعيان أو الجسديان.
  rationale: السياق المباشر في رومية 14 يتناول اختلاف الضمائر بشأن الطعام والأيام، مع بقاء اللفظ العام من غير إضافة تفسيرية إلى صلب الآية.
- issue: طبيعة «أوجه الضعف»
  choice: إبقاء التعبير واسعًا ليشمل القيود والتحفظات وأوجه القصور التي يحملها الضعفاء.
  alternative: ترجمتها «زلات» أو «إخفاقات» بما يرجح دلالة الإدانة الأخلاقية.
  rationale: اللفظ اليوناني يحتمل الضعف والقصور، والسياق لا يقتضي وصف أصحاب الضمير المقيد بأنهم واقعون في خطايا أخلاقية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «أوجه ضعف» بدل «ضعفات» الأثقل أسلوبيًا، وحُفظت صورة احتمال عبء الآخرين من غير شرح زائد داخل النص.
