  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: ar
  text: 'بل كما هو مكتوب: «الذين لم يُخبَروا عنه سيرون[a]، والذين لم يسمعوا سيفهمون».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين لم يُعلَن لهم شيء عنه سيرون».'
    reason: lexical_alternative
  - marker: b
    text: يقتبس بولس هنا من إشعياء 52:15. ويعود الضمير «عنه» في سياق إشعياء إلى شخصية العبد، ويطبّق بولس هذا النص هنا على كرازته بالإنجيل.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد مقابلة ما سبق وتربط الاقتباس بهدف بولس في الخدمة؛ و«بل» عربية طبيعية موجزة هنا.
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة للاقتباس الكتابي، وتنقل دلالة صيغة التمام المبني للمجهول دون تكلّف.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: الذين لم يُخبَروا عنه
  rationale: أُعيدت صياغة الموصول في تركيب عربي طبيعي، مع إبقاء معنى الإعلان أو الإخبار المتعلق به.
- source_word: ὄψονται
  choice: سيرون
  rationale: يحافظ على معنى الرؤية صراحة ولا يفسره مسبقًا بمعنى الإدراك، إذ يرد الفهم في الشطر الموازي.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: الذين لم يسمعوا
  rationale: صياغة عربية واضحة تنقل حالة عدم السماع، ولا تحتاج العربية هنا إلى محاكاة صيغة التمام اليونانية تركيبًا.
- source_word: συνήσουσιν
  choice: سيفهمون
  rationale: ينقل مباشرة معنى الفهم والإدراك في صيغة المستقبل.
theological_decisions:
- issue: مرجع الضمير في περὶ αὐτοῦ ضمن اقتباس إشعياء
  choice: الإبقاء على «عنه» دون التصريح باسم المسيح أو المسيا
  alternative: عن المسيح / عن المسيا
  rationale: النص اليوناني يستعمل ضميرًا، وإبقاؤه يصون صياغة الاقتباس وما فيها من إحالة سياقية، من غير إدخال تفسير عقائدي في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي بين «سيرون» و«سيفهمون»، وأُبقي الضمير غامض المرجع بالقدر الموجود في النص، مع بيان سياقه في الحاشية.
