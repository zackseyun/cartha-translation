  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: ar
  text: لكني كتبت إليكم في بعض المواضع بجرأة أكبر[a]، كمن يذكّركم من جديد، بسبب النعمة التي أعطاني إياها الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كتبت إليكم بجرأة أكبر إلى حدّ ما». تحتمل العبارة اليونانية أن تصف مقدار جرأة بولس، أو أن تشير إلى بعض المواضع التي كتب فيها بجرأة.'
    reason: lexical_alternative
  - marker: b
    text: تشير «النعمة» هنا، في ضوء الآية التالية، إلى ما أنعم الله به على بولس من خدمة وتكليف، لا إلى النعمة بمعناها العام فحسب.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον ... ἀπὸ μέρους
  choice: في بعض المواضع بجرأة أكبر
  rationale: يحفظ هذا التركيب دلالة صيغة المقارنة في τολμηρότερον، ويصل ἀπὸ μέρους ببعض ما كُتب فيه بجرأة. ولأن موقع العبارة اليونانية يحتمل أيضًا معنى «كتبت إليكم بجرأة أكبر إلى حدّ ما»، ذُكر البديل في الحاشية.
- source_word: δὲ
  choice: لكني
  rationale: تفيد انتقالًا ذا مسحة استدراكية بعد كلام بولس السابق عن حال المخاطَبين.
- source_word: ἔγραψα ὑμῖν
  choice: كتبت إليكم
  rationale: ترجمة مباشرة وطبيعية للفعل الماضي مع المفعول غير المباشر في سياق الرسالة.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: كمن يذكّركم من جديد
  rationale: تحفظ ὡς مع اسم الفاعل، وتنقل دلالة الفعل المركب على إعادة التذكير، من غير أن توحي بأنهم كانوا يجهلون الأمر.
- source_word: διὰ τὴν χάριν
  choice: بسبب النعمة
  rationale: تنقل διά مع النصب بوصفها دالة على السبب أو الأساس، مع إبقاء المصطلح البولسي الواسع «النعمة».
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: التي أعطاني إياها الله
  rationale: صياغة عربية طبيعية تحفظ كون الله فاعل العطاء وكون النعمة معطاة لبولس.
theological_decisions:
- issue: دلالة χάρις في السياق
  choice: الإبقاء على «النعمة» في المتن، مع بيان صلتها بخدمة بولس وتكليفه في الحاشية
  alternative: ترجمتها مباشرةً بـ«التكليف» أو «الخدمة»
  rationale: الآية التالية تربط هذه النعمة بخدمة بولس للأمم، لكن اللفظ اليوناني أوسع من «التكليف» وحده؛ لذلك يحفظ المتن اتساعه اللاهوتي، وتوضح الحاشية دلالته السياقية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «في بعض المواضع» لإيضاح أحد وجهي ἀπὸ μέρους مع حفظ الوجه الآخر في الحاشية، و«كمن يذكّركم من جديد» لإبقاء النبرة الرعوية غير الاتهامية.
