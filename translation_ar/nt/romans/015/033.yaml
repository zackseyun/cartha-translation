  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: ar
  text: وليكن إلهُ السلام معكم جميعًا. آمين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط خفيفة وانتقالية في ختام الكلام، فحُمِل معناها على الواو العربية دون إدخال معنى زمني مثل «الآن» أو معنى استدراكي قوي.
- source_word: θεὸς τῆς εἰρήνης
  choice: إلهُ السلام
  rationale: ترجمة مباشرة للتركيب الإضافي، وتحفظ اللقب البولسي المألوف بصياغة عربية طبيعية.
- source_word: εἰρήνης
  choice: السلام
  rationale: المقابل العربي الطبيعي، ويتسع لمعاني السلام والمصالحة والعافية الكاملة دون الحاجة إلى تفسير داخل النص.
- source_word: μετὰ πάντων ὑμῶν
  choice: معكم جميعًا
  rationale: يحفظ شمول πάντων وتركيب المصاحبة بإيجاز عربي واضح.
- source_word: ἀμήν
  choice: آمين
  rationale: أُبقي اللفظ التعبدي المتعارف عليه لما له من قوة ختامية وإقرارية.
theological_decisions:
- issue: هل تُفهم الجملة الاسمية الخالية من فعل صريح خبرًا أم دعاء بركة؟
  choice: 'صيغة دعاء: «وليكن إلهُ السلام معكم جميعًا»'
  alternative: «وإلهُ السلام معكم جميعًا» بوصفها جملة خبرية
  rationale: سياق الخاتمة الرسولية يرجّح وظيفة التمنّي والدعاء، ولذلك أُضيف «ليكن» في العربية لإظهار هذه الوظيفة مع عدم الادعاء بأن الفعل وارد صراحة في اليونانية.
translation_notes:
  register: فصحى معاصرة واضحة ومهيبة. استُخدمت الواو لحمل الانتقال الخفيف الذي تؤديه δὲ، وصيغة «وليكن» لتقديم البركة الختامية بصورة طبيعية. لا توجد حواشٍ في هذا العدد.
