  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: ar
  text: لِيُرْضِ كُلُّ وَاحِدٍ مِنَّا قَرِيبَهُ لِمَا فِيهِ الْخَيْرُ، لِبُنْيَانِهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأجل البنيان». والمقصود بالبنيان هنا تقوية القريب وتنميته، لا البناء الحرفي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: كُلُّ وَاحِدٍ مِنَّا
  rationale: يحفظ التوزيع الفردي في المفرد مع شمول جماعة المتكلمين، وهو تعبير عربي واضح وطبيعي.
- source_word: τῷ πλησίον
  choice: قَرِيبَهُ
  rationale: ينقل معنى القريب أو الإنسان الآخر في السياق الأخلاقي، مع ملاءمة الضمير للمفرد التمثيلي في الأصل.
- source_word: ἀρεσκέτω
  choice: لِيُرْضِ
  rationale: صيغة الأمر بلام الأمر تحفظ قوة الحث في فعل الأمر اليوناني، من غير تحويله إلى مجرد اقتراح.
- source_word: εἰς τὸ ἀγαθὸν
  choice: لِمَا فِيهِ الْخَيْرُ
  rationale: يبقي العبارة موجهة إلى الخير والمنفعة، ولا يحصرها صراحةً في منفعة القريب وحده رغم أن السياق يرجح ذلك.
- source_word: πρὸς οἰκοδομήν
  choice: لِبُنْيَانِهِ
  rationale: يحفظ استعارة البناء المستعملة بمعنى التقوية والنمو، ويجعل مرجعها إلى القريب واضحًا بحسب السياق.
theological_decisions:
- issue: نطاق إرضاء القريب أخلاقيًا
  choice: إرضاؤه مقيد بما فيه الخير وبنيانه، وليس استرضاءً مطلقًا
  alternative: فهم العبارة على أنها دعوة غير مقيدة إلى مسايرة الآخرين
  rationale: عبارتا الغاية في النص تحددان الإرضاء بما يتجه إلى الخير والبنيان، ولذلك أبقتهما الترجمة ظاهرتين.
- issue: مرجع الخير في εἰς τὸ ἀγαθόν
  choice: 'صياغة غير مضافة تحفظ عموم العبارة: «لما فيه الخير»'
  alternative: «لخيره» أي لمنفعة القريب تحديدًا
  rationale: اليونانية تقول حرفيًا «إلى الخير/ما هو خير» بلا ضمير ملكية؛ والسياق يربط الخير بالقريب وبنيانه، لكن الترجمة لا تضيف ما لم يُصرَّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت لام الأمر للمحافظة على قوة الوصية، وحُفظت استعارة البنيان. يظهر مؤشر الحاشية [a] في المتن.
