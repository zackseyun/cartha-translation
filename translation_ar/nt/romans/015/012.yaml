review_pass:
  verdict: revise
  source_fidelity: تُحافظ المسودة على بنية الاقتباس اليوناني المستقبلية وعلى العطف بين «جذر يَسّى» و«الناهض». لكن «أصل يَسّى» يضعف الصورة النباتية المحددة في ῥίζα («جذر») وقد يغيّر الإيحاء النسبي المقصود في الاقتباس.
  naturalness: «عليه ستعلّق الأمم رجاءها» مفهومة، لكنها أقل سلاسة في العربية المعاصرة من «وعليه تضع الأمم رجاءها». كما أن «الذي ينهض ليحكم» أوضح وأفصح من الاسم المفرد «الناهض» في هذا الموضع، مع إبقاء اتساع دلالة اسم الفاعل اليوناني.
  terminology: يُستبدل «أصل» بـ«جذر» للمحافظة على الصورة النبوية والاصطلاح الكتابي. وتبقى «الأمم» مقابلاً مناسبًا لـἔθνη في هذا السياق، ويُضبط الاسم «يَسّى».
  issues:
  - severity: medium
    issue: «أصلُ يَسّى» بدل «جذرُ يَسّى»
    rationale: ῥίζα تعني حرفيًا «جذرًا»، والاقتباس يستدعي صورة إشعياء النباتية. أما «أصل» فيميل إلى معنى المنشأ أو السلف، فيفقد الصورة الحرفية وقد يضيّق الدلالة.
  - severity: low
    issue: صياغة الرجاء غير الأكثر طبيعية
    rationale: «تعلّق رجاءها عليه» ممكنة، لكن «تضع الأمم رجاءها عليه» أفصح وأشيع، وتنقل بوضوح اتكال ἐπ’ αὐτῷ.
  - severity: low
    issue: «الناهض» صياغة مكثفة قد تبدو مبهمة
    rationale: «الذي ينهض ليحكم الأمم» يمثل اسم الفاعل ὁ ἀνιστάμενος بوضوح من غير حصره في معنى القيامة أو إدخال تفسير عقائدي.
