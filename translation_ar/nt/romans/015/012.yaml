  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: ar
  text: 'ويقول إشعياء أيضًا: «سيكون جذرُ يَسّى، والذي ينهض ليحكم الأمم؛ وعليه تضع الأمم رجاءها».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الاقتباس من إشعياء 11:10 بحسب الصياغة اليونانية القديمة للعهد القديم.
    reason: يوضح مصدر الاقتباس وسبب اختلاف بعض ألفاظه عن صيغ عربية مترجمة مباشرة من النص العبري.
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: أصلُ يَسّى
  rationale: ترجمة مباشرة لصورة «الجذر» بمعنى الأصل المنحدر منه، مع إبقاء التعبير النبوي المكثف.
- source_word: ὁ ἀνιστάμενος
  choice: الناهضُ
  rationale: يحفظ معنى القيام أو النهوض في صيغة اسمية، من غير حسم ما إذا كان التركيز على الظهور أم القيامة.
- source_word: ἄρχειν ἐθνῶν
  choice: ليسودَ على الأمم
  rationale: يعبر طبيعيًا عن تولّي الحكم والسلطان، ويترجم ἐθνῶν بـ«الأمم» وفق الاستعمال الكتابي الشائع.
- source_word: ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν
  choice: عليه ستعلّق الأمم رجاءها
  rationale: ينقل اتجاه الرجاء نحو الشخص المقصود، بصياغة عربية واضحة وطبيعية.
theological_decisions:
- issue: العلاقة بين «أصل يَسّى» و«الناهض»
  choice: 'الإبقاء على الواو: «أصل يَسّى، والناهض»'
  alternative: «أصل يَسّى، أي الناهض» أو «أصل يَسّى الذي ينهض»
  rationale: النص اليوناني يستخدم καί، ولا يصرّح نحويًا بأنها تفسيرية؛ لذا تُحفظ البنية والتوتر التعبيري من غير إدخال تفسير زائد.
- issue: دلالة ἀνιστάμενος
  choice: «الناهض»
  alternative: «القائم» أو «الذي يقوم»
  rationale: تتجنب الصياغة حصر اللفظ في إشارة صريحة إلى القيامة، مع إبقاء هذا الصدى الدلالي ممكنًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على التوازي والصورة النبوية في الاقتباس.
