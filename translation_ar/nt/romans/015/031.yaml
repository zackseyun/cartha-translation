  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: ar
  text: لكي أُنقَذ من الذين لا يطيعون في اليهودية[a]، ولكي تصير خدمتي لأورشليم مقبولة لدى القديسين،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من غير المؤمنين في اليهودية». يمكن أن يدل اسم الفاعل اليوناني على رفض الإيمان، ومن ثم عدم الطاعة.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: لكي... ولكي
  rationale: تُدخل غرض طلب بولس للصلاة، وتنسّق بين فعلي الصيغة الاحتمالية الخاضعين لها في اليونانية.
- source_word: ῥυσθῶ
  choice: أُنقَذ
  rationale: يحفظ معنى النجاة من الخطر في صيغة المبني للمجهول من غير إضافة دلالة غير مصرّح بها.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: من الذين لا يطيعون
  rationale: يعكس معنى العصيان أو رفض الانقياد، مع إبقاء احتمال عدم الإيمان في الحاشية.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: في اليهودية
  rationale: الاسم الجغرافي العربي المعياري للمنطقة.
- source_word: διακονία
  choice: خدمتي
  rationale: لفظ واسع يحفظ معنى الخدمة العملية المتجهة إلى أورشليم من غير حصرها صراحة في المعونة أو في منصب ديني.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: لأورشليم
  rationale: ينقل اتجاه الخدمة ووجهتها بصياغة عربية طبيعية.
- source_word: εὐπρόσδεκτος
  choice: مقبولة
  rationale: يحفظ معنى القبول الحسن والتلقي باستحسان.
- source_word: τοῖς ἁγίοις
  choice: لدى القديسين
  rationale: يحافظ على اصطلاح بولس المعتاد للمؤمنين، وتوضح «لدى» أن المقصود قبولهم للخدمة.
- source_word: γένηται
  choice: تصير
  rationale: تعكس معنى الصيرورة في γίνομαι بدل تحويله إلى مجرد حالة ثابتة.
theological_decisions:
- issue: دلالة ἀπειθούντων في وصف معارضي بولس في اليهودية
  choice: الذين لا يطيعون
  alternative: غير المؤمنين
  rationale: قد يدل اللفظ على رفض الإيمان وما ينشأ عنه من عصيان. يحفظ المتن معنى عدم الطاعة، بينما تُذكر دلالة عدم الإيمان الممكنة في الحاشية دون حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أورشليم» بوصفه الاسم الكتابي العربي الشائع، و«القديسين» حفاظًا على المصطلح البولسي. تكرار «لكي» يوضح الغرضين المتوازيين في تركيب الآية.
