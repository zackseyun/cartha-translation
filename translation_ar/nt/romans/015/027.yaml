  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: ar
  text: فقد سَرَّهُم أن يفعلوا ذلك، وهم مدينون لهم. فإذا كان غير اليهود[a] قد شاركوا في أمورهم الروحية[b]، فعليهم أيضًا أن يخدموهم في الأمور المادية[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الأمم»؛ والمقصود هنا غير اليهود.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «خيراتهم الروحية». واليونانية تقول حرفيًا: «أمورهم الروحية».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «الأمور الجسدية»؛ والمقصود في هذا السياق الدعم المادي أو ما يسد الاحتياجات الجسدية، في مقابل الأمور الروحية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: سَرَّهُم أن يفعلوا ذلك
  rationale: ينقل معنى الرضا والسرور بالفعل، مع إبقاء الإشارة السياقية إلى التقدمة المذكورة في الآية السابقة.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: هم مدينون لهم
  rationale: يحافظ على صورة الدَّين وعلى معنى الالتزام الأدبي الذي يقرره بولس.
- source_word: τὰ ἔθνη
  choice: غير اليهود
  rationale: هذا هو المقصود في السياق البولسي، إذ يجري التقابل مع المؤمنين اليهود في أورشليم؛ وأُثبت اللفظ الحرفي في الحاشية.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: أمورهم الروحية
  rationale: يحافظ على الصفة اليونانية المستعملة اسميًا، من غير إضافة كلمة «بركات» غير الموجودة صراحة في النص.
- source_word: ἐκοινώνησαν
  choice: شاركوا في
  rationale: تعبير عربي طبيعي ينقل معنى الاشتراك أو نيل نصيب في شيء.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: في الأمور المادية
  rationale: السياق هو التقدمة المالية، ولذلك تدل العبارة على ما يخص الاحتياجات الجسدية والمادية لا على معنى أخلاقي سلبي.
- source_word: λειτουργῆσαι
  choice: أن يخدموهم
  rationale: ينقل معنى تقديم الخدمة مع بقاء الأسلوب واضحًا، من غير حصر الفعل في خدمة كهنوتية أو طقسية.
theological_decisions:
- issue: معنى σαρκικοῖς في مقابل πνευματικοῖς
  choice: الأمور المادية
  alternative: الأمور الجسدية
  rationale: تدل القرينة المباشرة، وهي جمع التقدمة لفقراء القديسين في أورشليم، على الدعم المادي والجسدي، لا على «الجسد» بمعنى الخطيئة.
- issue: مرجع الضمائر αὐτῶν وαὐτοῖς
  choice: المؤمنون في أورشليم، وهم في السياق مؤمنون يهود
  alternative: إسرائيل بوجه أعم
  rationale: السياق المباشر في رومية 15:25–26 يتحدث عن القديسين في أورشليم، مع أن حجة بولس تقوم أيضًا على ما ناله غير اليهود من خير روحي جاء عن طريق اليهود.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. حافظت الصياغة على صورة الدَّين وعلى التقابل بين الروحي والمادي، وتجنبت أن يوحي وصف «الجسدية» هنا بالخطيئة.
