base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: ar
  text: فإذا أتممتُ هذا، وختمتُ لهم هذه الثمرة[a]، سأسافر عن طريقكم[b] إلى إسبانيا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «وختمتُ لهم هذه الثمرة». وقد يُراد بذلك أن أوصل إليهم هذه التقدمة بأمان، أو أن أثبت تسليمها رسميًا. و«هذه الثمرة» هي التقدمة المالية التي جمعها المؤمنون من الأمم لقديسي أورشليم.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'أو: «عبركم»؛ أي إن بولس يعتزم المرور بروما في طريقه إلى إسبانيا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: فمتى أتممتُ هذا الأمر
  rationale: تنقل «فـ» الانتقال الاستنتاجي في οὖν، وتفيد «متى» أن إتمام المهمة يسبق السفر. وإضافة «الأمر» توضح مرجع اسم الإشارة من غير أن تحصره بأكثر مما يسمح به السياق.
- source_word: σφραγισάμενος αὐτοῖς
  choice: وسلَّمتُ إليهم ... تسليمًا موثَّقًا
  rationale: الفعل يعني حرفيًا «ختم»، لكنه في سياق إيصال التقدمة يرجح معنى تسليمها تسليمًا مأمونًا ومثبتًا. تحافظ الصياغة على دلالة التوثيق الكامنة في صورة الختم من دون تعبير عربي غامض مثل «ختمت لهم الثمرة».
- source_word: τὸν καρπὸν τοῦτον
  choice: هذه الثمرة
  rationale: الإبقاء على استعارة «الثمرة» يحفظ صورة بولس، وهي تشير سياقيًا إلى حصيلة عطاء المؤمنين من الأمم، أي التقدمة لأجل قديسي أورشليم.
- source_word: ἀπελεύσομαι
  choice: سأسافر
  rationale: يعبر الفعل عن انطلاق بولس ومتابعة رحلته إلى وجهته التالية؛ و«سأسافر» طبيعية في العربية ضمن سياق الرحلة.
- source_word: δι’ ὑμῶν
  choice: مارًّا بكم
  rationale: تفيد διά مع المضاف إليه المرور عبر المخاطَبين أو من جهتهم؛ والمقصود سياقيًا المرور بروما، مع إبقاء احتمال معنى «عن طريقكم» في الحاشية.
- source_word: εἰς Σπανίαν
  choice: إلى إسبانيا
  rationale: ترجمة اتجاهية طبيعية لبيان وجهة السفر.
theological_decisions:
- issue: دلالة استعارة الختم في تسليم تقدمة أورشليم
  choice: تسليمًا موثَّقًا
  alternative: وختمتُ لهم هذه الثمرة
  rationale: الترجمة الحرفية لصورة الختم شديدة الغموض في العربية الحديثة، أما الصياغة المختارة فتنقل على الأرجح معنى الإيصال المأمون أو المثبت، مع التنبيه في الحاشية إلى اللفظ الحرفي وعدم ادعاء حسم دلالته الدقيقة.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. روعي تسلسل الأفعال في اليونانية: إتمام المهمة وتسليم التقدمة أولًا، ثم السفر إلى إسبانيا مرورًا بالمخاطَبين. حُفظت استعارة «الثمرة»، بينما نُقلت استعارة «الختم» بصياغة عربية مفهومة وأُثبت حرفها في الحاشية.'
