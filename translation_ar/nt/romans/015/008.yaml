  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: ar
  text: فإني أقول إن المسيح قد صار خادمًا لأهل الختان من أجل صدق الله[a]، لكي يثبّت الوعود التي أُعطيت للآباء،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمانة الله»، أي أمانته في الوفاء بوعود عهده.
    reason: بديل معجمي يحفظ دلالة ἀλήθεια المحتملة على الصدق والأمانة، وهي بارزة في سياق تثبيت الوعود.
lexical_decisions:
- source_word: λέγω γὰρ
  choice: فإني أقول
  rationale: تحفظ «فـ» الصلة التفسيرية التي تؤديها γάρ، وتنقل λέγω بصياغة عربية طبيعية وقريبة من الأصل.
- source_word: Χριστόν
  choice: المسيح
  rationale: اللفظ هنا لقب ذو دلالة خلاصية في سياق يتناول إسرائيل والختان ووعود الآباء، و«المسيح» هو المقابل العربي الواضح والمستقر.
- source_word: διάκονον
  choice: خادمًا
  rationale: يدل اللفظ على من يقوم بالخدمة، ولا يقتضي هنا معنى المنصب الكنسي الاصطلاحي.
- source_word: γεγενῆσθαι
  choice: قد صار
  rationale: تنقل الصيغة التامة حالة نتجت عن الصيرورة، وتأتي طبيعية في العربية بعد «إن».
- source_word: περιτομῆς
  choice: لأهل الختان
  rationale: المضاف إليه يشير مجازيًا إلى جماعة المختونين، أي اليهود؛ و«أهل الختان» واضحة وتحافظ على صورة الأصل دون أن توهم أن المسيح خادم لطقس الختان نفسه.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: من أجل حق الله
  rationale: تنقل ὑπέρ معنى الغاية أو الاعتبار، وتبقي «حق الله» مجالًا لمعنى الحق ومعنى صدق الله وأمانته، مع توضيح الوجه الثاني في الحاشية.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: لكي يثبّت
  rationale: البناء يفيد الغاية، والفعل يعني جعل الوعود ثابتة وإظهار تحققها.
- source_word: τὰς ἐπαγγελίας
  choice: الوعود
  rationale: مقابل عربي مباشر ومألوف في سياق وعود الله العهدية.
- source_word: τῶν πατέρων
  choice: التي أُعطيت للآباء
  rationale: الإضافة اليونانية قد تدل على الوعود المتعلقة بالآباء أو المقدمة إليهم؛ وهذه الصياغة توضح العلاقة المقصودة طبيعيًا في العربية، مع بقاء «الآباء» دالًا على آباء إسرائيل.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح بوصفه لقبًا لا اسمًا مجردًا
  rationale: السياق الخلاصي الذي يجمع الختان ووعود الآباء يرجح الوظيفة اللقبية، ولا تحتاج العربية إلى إضافة تفسيرية داخل النص.
- issue: دلالة ἀλήθεια θεοῦ
  choice: حق الله
  alternative: صدق الله أو أمانة الله
  rationale: يمكن للعبارة أن تشير إلى حق الله بوجه عام أو إلى صدقه وأمانته في الوفاء بوعوده. أبقى المتن العبارة الأوسع، وتعرض الحاشية الدلالة العهدية القوية دون حسم التوتر الدلالي.
- issue: علاقة المسيح بأهل الختان
  choice: خادمًا لأهل الختان
  alternative: خادم الختان
  rationale: الإضافة في اليونانية موجزة، لكن المراد على الأرجح جماعة المختونين لا شعيرة الختان؛ لذلك توضح العربية المرجع البشري من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أهل الختان» لتجنب غموض «الختان» المجرد، و«الآباء» للمحافظة على الخصوصية التاريخية الخلاصية. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
