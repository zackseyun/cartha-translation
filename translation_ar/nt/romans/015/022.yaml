  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: ar
  text: لِذلِكَ أُعِقْتُ أَيْضًا مَرَّاتٍ كَثِيرَةً عَنِ الْمَجِيءِ إِلَيْكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مرارًا» أو «في مناسبات كثيرة»؛ فالعبارة اليونانية τὰ πολλὰ تعبير اصطلاحي يدل على كثرة التكرار.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: تفيد النتيجة المترتبة على كلام بولس السابق، و«لذلك» تربط الآية بسياقها بوضوح وطبيعية.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ القوة الإضافية للأداة، إذ يضيف بولس أثر ما سبق في ظروفه الشخصية.
- source_word: ἐνεκοπτόμην
  choice: أُعِقتُ
  rationale: تنقل معنى المنع أو العرقلة من غير تعيين فاعل، وتحفظ دلالة الصيغة الناقصة على العرقلة المتكررة في الماضي.
- source_word: τὰ πολλὰ
  choice: مرات كثيرة
  rationale: تؤدي المعنى الاصطلاحي الظرفي الدال على التكرار، مع إبقاء الصلة اللفظية بفكرة الكثرة.
- source_word: τοῦ ἐλθεῖν
  choice: عن المجيء
  rationale: المصدر المعرّف بعد فعل العرقلة يبين الفعل الذي مُنع بولس من القيام به؛ وهذه صياغة عربية مباشرة.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: تنقل اتجاه الحركة نحو المخاطَبين بإيجاز، ودلالة المجيء موجودة في العبارة السابقة.
