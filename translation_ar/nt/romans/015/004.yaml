base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: ar
  text: لأن كلَّ ما كُتب من قبل إنما كُتب لتعليمنا، لكي يكون لنا الرجاء[b] بالصبر وبتشجيع الكتب المقدسة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبتعزية الكتب المقدسة»؛ فاللفظ اليوناني قد يعني التشجيع أو التعزية أو الحث.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكي يكون لنا رجاء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: كلَّ ما
  rationale: ينقل الشمول غير المحدد في ضمير الوصل اليوناني بصياغة عربية طبيعية واضحة.
- source_word: προεγράφη
  choice: كُتب من قبل
  rationale: يحفظ الدلالة الزمنية للسابقة προ-، والمقصود هنا ما دُوّن سابقًا.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: لتعليمنا
  rationale: يعبّر بوضوح عن الغرض أو النتيجة، وتفيد «تعليم» هنا التوجيه والتكوين لا مجرد نقل المعلومات.
- source_word: ἐγράφη
  choice: كُتب
  rationale: يحافظ على تكرار فعل الكتابة في اليونانية وعلى توكيده البلاغي.
- source_word: ἵνα
  choice: لكي
  rationale: أداة عربية طبيعية تحفظ دلالة الغرض.
- source_word: διὰ τῆς ὑπομονῆς
  choice: بالصبر
  rationale: «الصبر» لفظ عربي مألوف يدل في السياق على الثبات والاحتمال المستمر تحت المشقة.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: وبتشجيع الكتب المقدسة
  rationale: «تشجيع» ينقل معنى التقوية وبعث العزم في παράκλησις، مع إبقاء احتمال «التعزية» في الحاشية؛ وأُبقيت إضافة التشجيع إلى الكتب كما في ترتيب اليونانية.
- source_word: τῶν γραφῶν
  choice: الكتب المقدسة
  rationale: يدل اللفظ في الاستعمال البولسي على الكتابات المقدسة المعترف بها، وهذه العبارة أوضح في العربية المعاصرة.
- source_word: τὴν ἐλπίδα
  choice: الرجاء
  rationale: يحفظ أداة التعريف اليونانية، و«الرجاء» هو اللفظ العربي الكتابي الطبيعي للأمل الواثق.
- source_word: ἔχωμεν
  choice: يكون لنا
  rationale: صياغة عربية طبيعية للمضارع الالتزامي بعد أداة الغرض، من غير أن تضيف معنى الشك.
theological_decisions:
- issue: كيفية إسهام الكتب المقدسة في إيجاد الرجاء
  choice: أُبقي «تشجيع الكتب المقدسة» مرتبطًا بالكتب وفق تسلسل العبارة اليونانية، مع جعل الصبر والتشجيع وسيلتين إلى الرجاء.
  alternative: قد تُفهم العبارة على أن الصبر والتشجيع كليهما مما تمنحه الكتب المقدسة، أو على أنهما يظهران فيها ويُكتسبان بقراءتها.
  rationale: التركيب اليوناني يسمح بهذه الفروق الدقيقة، لذلك لم تُضف ألفاظ تحسم كيفية العلاقة أو تحصر عمل الكتب في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «كل ما كُتب من قبل» بدل تركيب حرفي أثقل، وحُفظ تكرار «كُتب». وُضعت علامتا الحاشية بعد العبارة التي تتصل بها البدائل، مع إبقاء قدر من غموض علاقة الصبر والتشجيع بالكتب المقدسة.
