  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: ar
  text: وأنا نفسي مقتنع بشأنكم، يا إخوتي[a]، بأنكم أنتم أيضًا مملوؤون صلاحًا، وممتلئون بكل معرفة، وقادرون أيضًا على أن ينصح بعضكم بعضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «إخوتي» يترجم اليونانية ἀδελφοί، وقد يُخاطَب به المؤمنون جماعةً، فيشمل النساء والرجال.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن تنبّهوا بعضكم بعضًا»، أو «أن تحذّروا بعضكم بعضًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: مقتنع
  rationale: ينقل حالة الاقتناع الراسخة التي يدل عليها صيغة التام، بصياغة عربية طبيعية.
- source_word: δέ
  choice: و
  rationale: أداة انتقال لطيف في السياق، لا تفيد هنا استدراكًا قويًا.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: يحافظ على صورة النداء اليونانية المذكرة، مع بيان شمولها لجماعة المؤمنين في الحاشية.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: وأنا نفسي
  rationale: يحفظ توكيد المتكلم من غير إثقال الأسلوب العربي.
- source_word: περὶ ὑμῶν
  choice: من جهتكم
  rationale: تعبير عربي واضح ودقيق لمعنى الكلام المتعلق بالمخاطَبين.
- source_word: καὶ αὐτοὶ
  choice: أنتم أيضًا
  rationale: يجمع بين معنى الإضافة وتوكيد المخاطَبين.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: مملوؤون صلاحًا
  rationale: ينقل معنى الامتلاء بالخير والاستقامة الأخلاقية بلغة عربية مفهومة.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: ممتلئون من كل معرفة
  rationale: يحافظ على شمول πάσης وعلى الحالة القائمة التي تفيدها صيغة التام.
- source_word: δυνάμενοι
  choice: قادرون
  rationale: ترجمة مباشرة للقدرة الناشئة عن الصفات السابقة.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: الصياغة العربية المعيارية للدلالة على التبادل.
- source_word: νουθετεῖν
  choice: أن تنصحوا
  rationale: «تنصحوا» تشمل الإرشاد المقوِّم والتنبيه، وتلائم سياق الثناء، مع توضيح النبرة الأشد في الحاشية.
theological_decisions:
- issue: النداء المذكر ἀδελφοί الموجَّه إلى جماعة مختلطة
  choice: يا إخوتي
  alternative: يا إخوتي وأخواتي
  rationale: أُبقيت صورة اللفظ اليوناني في المتن، مع توضيح أن الاستعمال قد يشمل المؤمنات والمؤمنين جميعًا.
- issue: مدى القوة التقويمية في νουθετεῖν
  choice: أن تنصحوا بعضكم بعضًا
  alternative: أن تنبّهوا بعضكم بعضًا / أن تحذّروا بعضكم بعضًا
  rationale: الفعل يتسع للنصح والتعليم التقويمي والإنذار؛ اختير لفظ طبيعي واسع في المتن، وحُفظت الدلالات الأشد في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ توكيد الضمائر وتوازي عبارتي الامتلاء، مع تجنب المصطلحات المذهبية وإبقاء المدى الدلالي للفعل νουθετεῖν ظاهرًا في الحاشية.
