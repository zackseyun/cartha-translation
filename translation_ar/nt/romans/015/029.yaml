  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: ar
  text: وأعلم أني حين آتي إليكم، سأجيء بملء بركة المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: أعلم
  rationale: ينقل دلالة المعرفة واليقين في قول بولس نقلًا مباشرًا، من غير تليينها إلى مجرد ظن.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل مسار الكلام، ولا يلزم منها هنا تضاد قوي.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: حين آتي إليكم
  rationale: يفيد اسم الفاعل اليوناني معنى الزمن بالنسبة إلى الفعل المستقبل، وهذه صياغة عربية طبيعية.
- source_word: ἐλεύσομαι
  choice: سأجيء
  rationale: ينقل صيغة المستقبل من ἔρχομαι بوضوح، مع تجنب التكرار الأسلوبي للفعل «آتي» في العربية.
- source_word: ἐν πληρώματι
  choice: بملء
  rationale: الباء تعبّر طبيعيًا عن الحال أو المصاحبة، و«ملء» تحفظ صورة الكمال والوفرة في πλήρωμα.
- source_word: εὐλογίας
  choice: بركة
  rationale: 'المضاف إليه يحدد مضمون الملء أو صفته: ملء متصف بالبركة.'
- source_word: Χριστοῦ
  choice: المسيح
  rationale: اللفظ اليوناني لقب يعني «المسيح»، والصيغة العربية المعرفة هي المقابل الطبيعي الراسخ.
theological_decisions:
- issue: دلالة إضافة «بركة المسيح»
  choice: الإبقاء على «بركة المسيح» من غير تفسير إضافي
  alternative: البركة الآتية من المسيح / البركة الخاصة بالمسيح
  rationale: الإضافة اليونانية تحتمل المصدر أو الارتباط والاختصاص؛ لذلك تحفظ الصياغة العربية المضافة هذا الاتساع ولا تحسمه بلا ضرورة.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: المسيّا / مسيح
  rationale: «المسيح» ينقل اللقب في العربية الفصحى الواضحة والمألوفة، ولا يعامله كاسم عائلة أو اسم شخص مجرد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حُفظ التوكيد في «وأنا أعلم»، والعلاقة الزمنية في «حين آتي»، وصورة الوفرة في «ملء بركة المسيح».
