  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: ar
  text: وهكذا أجعل من طموحي أن أبشّر، لا حيث لم يكن اسم المسيح قد ذُكر، لئلا أبني على أساسٍ يخصّ غيري.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως δὲ
  choice: وهكذا
  rationale: تربط العبارة بما سبق وتواصل عرض نهج بولس في خدمته، من غير إبراز تضاد قوي.
- source_word: φιλοτιμούμενον
  choice: أحرص
  rationale: تنقل معنى الطموح الجاد والسعي المقصود بعبارة عربية طبيعية، من غير إدخال معنى الافتخار.
- source_word: εὐαγγελίζεσθαι
  choice: أن أبشّر
  rationale: فعل عربي واضح ومألوف يدل على إعلان البشارة ويحافظ على الصيغة الفعلية في اليونانية.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: لا حيث كان المسيح قد سُمِّي
  rationale: يحافظ على النفي المكاني وعلى المبني للمجهول، وتفيد صيغة «كان قد» سبق تسمية المسيح في تلك المواضع.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: تنقل غرض الفعل المنفي بإيجاز وفصاحة.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: على أساسٍ وضعه غيري
  rationale: يبقي استعارة البناء، ويوضح بصورة طبيعية أن الأساس يعود إلى عامل آخر، من غير إضافة «رجل» غير الواردة في الأصل.
- source_word: οἰκοδομῶ
  choice: أبني
  rationale: يحافظ مباشرة على صورة البناء المتصلة بالأساس.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح المنتظر
  rationale: «المسيح» هو اللقب العربي الراسخ والدقيق لـΧριστός، ويحفظ طابعه اللقبي من غير توسع تفسيري.
- issue: طبيعة مبدأ بولس في الخدمة
  choice: صياغته بوصفه حرص بولس الشخصي
  alternative: صياغته كحظر عام على الخدمة حيث عُرف المسيح
  rationale: صيغة المتكلم والفعل الدال على الطموح تصفان استراتيجية بولس الرسولية، ولا تفرضان في النص قاعدة عامة على جميع الخدام.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختير «أحرص» بدل تعبير أثقل مثل «أجعل طموحي»، وحُفظت استعارة الأساس والبناء مع إيضاح طبيعي لملكية الغير.
