revisions:
- from: وهكذا أحرص على أن أبشّر، لا حيث كان المسيح قد سُمِّي، لئلا أبني على أساسٍ وضعه غيري.
  to: وهكذا أجعل من طموحي أن أبشّر، لا حيث لم يكن اسم المسيح قد ذُكر، لئلا أبني على أساسٍ يخصّ غيري.
  rationale: عدّلتُ التعبير عن الطموح ليعكس قوة φιλοτιμούμενον، وصغتُ المبني للمجهول المتعلق بالمسيح بعبارة عربية طبيعية تحافظ على المقصود السياقي، واستبدلتُ إضافة «وضعه» بعبارة ملكية توافق ἀλλότριον من غير زيادة فعل غير وارد. لا يلزم إدراج حواشٍ لأن هذه الصياغة لا تعتمد قراءة نصية بديلة ولا توسعًا تفسيريًا في المتن.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:37Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، لكن «أحرص» أضعف من φιλοτιμούμενον، التي تفيد جعل الأمر طموحًا أو غايةً شخصية. كما أن «أساسٍ وضعه غيري» تضيف فعل «وضع» غير المصرح به في اليونانية، حيث التعبير هو «أساس يخصّ آخر».
  naturalness: الترجمة مفهومة وفصيحة، غير أن «وهكذا أجعل من طموحي أن أبشّر» أوضح في نقل قوة التعبير اليوناني من «أحرص». وصياغة «حيث لم يكن اسم المسيح قد ذُكر» طبيعية في العربية وتوصل المقصود السياقي من المبني للمجهول دون ادعاء تفسير أوسع.
  terminology: «المسيح» مقابل Χριστός مصطلح راسخ ودقيق في العربية. و«أبشّر» مناسبة لـεὐαγγελίζεσθαι، و«لئلا» تؤدي غرض ἵνα μὴ بوضوح.
  issues:
  - severity: medium
    issue: «أحرص» لا يستوفي دلالة φιλοτιμούμενον.
    rationale: الفعل يدل على طموح جاد أو اتخاذ الأمر غايةً يعتز بها، لا مجرد الحرص أو العناية.
  - severity: low
    issue: «وضعه غيري» يصرح بفعل غير مذكور في الأصل.
    rationale: ἐπ’ ἀλλότριον θεμέλιον تعني حرفيًا «على أساسِ آخر/أساس يخص آخر»، من غير التصريح بفعل وضع الأساس.
  - severity: low
    issue: «كان المسيح قد سُمّي» أقل سلاسة في العربية وقد يوهم بتسمية شخص باسم معين.
    rationale: المقصود في السياق أن اسم المسيح كان قد ذُكر أو أُعلن في تلك المواضع؛ و«اسم المسيح قد ذُكر» عربية طبيعية مع حفظ الإحالة إلى فعل التسمية/الذكر.
  revised_text: وهكذا أجعل من طموحي أن أبشّر، لا حيث لم يكن اسم المسيح قد ذُكر، لئلا أبني على أساسٍ يخصّ غيري.
