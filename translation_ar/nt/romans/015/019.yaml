  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: ar
  text: بقوة آياتٍ وعجائب، وبقوة الروح[a]، حتى إنني، من أورشليم وما حولها إلى إيليريكون، أتممتُ التبشير بإنجيل المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الروح القدس».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «أكملتُ إعلان إنجيل المسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: بقوة
  rationale: تفيد العبارة الوسيلة أو الفاعلية، وتكرار «بقوة» يحفظ تأكيد بولس وبنية النص.
- source_word: σημείων καὶ τεράτων
  choice: آيات وعجائب
  rationale: تعبير كتابي مألوف ودقيق للأعمال الخارقة التي تشهد لعمل الله، من غير إضافة وصف غير مصرح به.
- source_word: πνεύματος
  choice: الروح
  rationale: يرجح السياق أن المقصود هو الروح القدس، لكن اليونانية تقول «الروح» من غير صفة «القدس»، فحُفظ هذا القدر من التصريح.
- source_word: ὥστε με
  choice: حتى إنني
  rationale: تنقل نتيجة ما سبق بصياغة عربية طبيعية، مع إظهار أن بولس هو فاعل الفعل التالي.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: من أورشليم وفي كل ما حولها
  rationale: تنقل نقطة البداية والامتداد في المناطق المحيطة، مع إبقاء التعبير الجغرافي الواسع من غير رسم مسار محدد لا يصرح به النص.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: إلى إيليريكون
  rationale: تدل «إلى» هنا على غاية الامتداد الجغرافي، والاسم منقول بصيغة عربية واضحة.
- source_word: πεπληρωκέναι
  choice: بشّرت ... بشارةً تامة
  rationale: الفعل مع «الإنجيل» يفيد في هذا السياق إيصال الإنجيل أو إعلانه على نحو تام عبر المجال المذكور؛ وهذه الصياغة أوضح عربيًا من النقل الحرفي الملتبس «ملأت الإنجيل».
- source_word: τὸ εὐαγγέλιον
  choice: بإنجيل
  rationale: «الإنجيل» هو المقابل العربي المألوف والموجز في السياق البولسي.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: يحفظ اللقب اليوناني Χριστός بوصفه «المسيح»، وهو الاستعمال العربي الطبيعي هنا.
theological_decisions:
- issue: مرجع πνεύματος
  choice: الروح، والمقصود على الأرجح الروح القدس
  alternative: الروح القدس؛ أو روح بمعنى أعم
  rationale: سياق الآيات والعجائب والخدمة الرسولية يرجح الروح القدس، لكن المتن لا يضيف «القدس»، فتُركت الصياغة الأوجز مع بيان الاحتمال في الحاشية.
- issue: دلالة πεπληρωκέναι τὸ εὐαγγέλιον
  choice: بشّرت بإنجيل المسيح بشارةً تامة
  alternative: أتممت إعلان إنجيل المسيح
  rationale: المقصود على الأرجح إتمام إعلان الإنجيل في النطاق الجغرافي المذكور، لا أن الإنجيل نفسه كان ناقصًا؛ وحُفظ البديل الذي يعكس صورة الإتمام بصورة أوثق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار «بقوة»، وتُجنب النقل الحرفي غير الطبيعي لعبارة «ملأت الإنجيل». وُضع كل مؤشر حاشية في موضعه المباشر داخل المتن.
