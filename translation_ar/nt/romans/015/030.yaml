source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: ar
  text: وأناشدكم، أيها الإخوة[c]، بربنا يسوع المسيح[a] وبمحبة الروح[b]، أن تجاهدوا معي في الصلوات إلى الله من أجلي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح».
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني «محبة الروح» محبة الروح نفسه أو المحبة التي ينشئها الروح.
    reason: alternative_reading
  - marker: c
    text: «الإخوة» صيغة مذكرة في اليونانية، وقد تشمل في هذا السياق جماعة المؤمنين كلها، أي الإخوة والأخوات.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أناشدكم
  rationale: يفيد الفعل هنا التماسًا جادًّا وحثًّا ملحًّا، و«أناشدكم» عربية فصيحة واضحة تحفظ قوة الخطاب.
- source_word: δὲ
  choice: الواو في «وأناشدكم»
  rationale: أداة انتقال خفيفة لا تفيد تضادًّا قويًّا؛ تنقلها الواو طبيعيًّا من غير إضافة ظرف زمني غير موجود في المصدر.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ صيغة النداء المذكرة في اليونانية، ويمكن أن يشمل الخطاب جماعة المؤمنين كلها بحسب الاستعمال السياقي.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: بربنا يسوع المسيح
  rationale: الباء تعبّر طبيعيًّا عن أساس المناشدة أو وساطتها، و«المسيح» ينقل Χριστός بوصفه لقبًا معهودًا بمعنى الممسوح.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: محبة الروح
  rationale: 'يحفظ تركيب الإضافة اليوناني وغموضه: أهي محبة الروح نفسه أم المحبة التي ينشئها الروح.'
- source_word: συναγωνίσασθαί μοι
  choice: أن تجاهدوا معي
  rationale: ينقل معنى الجهد الشديد المشترك مع بولس، مع الحفاظ على دلالة السابقة συν-.
- source_word: ἐν ταῖς προσευχαῖς
  choice: في الصلوات
  rationale: يحافظ على حرفية التركيب من دون إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: إلى الله من أجلي
  rationale: «إلى الله» تحفظ اتجاه الصلاة، و«من أجلي» تعبّر بوضوح عن الشفاعة لصالح بولس.
theological_decisions:
- issue: مرجع «الروح» في «محبة الروح»
  choice: الروح القدس، مع كتابة «الروح» على نحو الاسم اللقبي المألوف
  alternative: الروح البشري أو الروح بمعنى غير شخصي
  rationale: الاستعمال البولسي والسياق يرجحان الإشارة إلى الروح القدس، من غير توسيع النص بإضافة «القدس».
- issue: دلالة إضافة «محبة الروح»
  choice: الإبقاء على تركيب الإضافة المبهم
  alternative: «محبة الروح لنا» أو «المحبة التي ينشئها الروح»
  rationale: المضاف إليه اليوناني يحتمل أن تكون المحبة صادرة من الروح أو ناشئة بعمله، فلا ينبغي حسم الاحتمال في المتن.
- issue: صيغة ἀδελφοί
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: يحفظ المتن الصيغة المذكرة للمصدر، مع احتمال شمولها جماعة المؤمنين كلها بحسب الاستعمال.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» اللقب العربي الكتابي المألوف، وهو يحمل في أصله معنى «الممسوح».
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «أناشدكم» لقوة الالتماس، و«تجاهدوا معي» لحفظ صورة الجهد المشترك. وُضعت علامتا الحاشية في المتن عند موضعيهما.
