  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: ar
  text: أمّا الآن فإني ذاهب إلى أورشليم، وأنا أخدم القديسين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وأنا أخدم المؤمنين المكرسين لله» أو «لأقدّم العون إلى القديسين». يدل الفعل اليوناني هنا على خدمة عملية، ويرجّح السياق أن بولس يقصد إيصال التقدمة إلى المؤمنين في أورشليم (انظر رومية 15:26).'
    reason: بديل معجمي وبيان سياقي
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أَمَّا الآنَ فَإِنِّي
  rationale: تنقل «الآن» الدلالة الزمنية المؤكدة في νυνί، ويعبّر تركيب «أمّا... فـ» عن الانتقال المقابل الخفيف الذي تؤديه δέ، بصياغة عربية واضحة وطبيعية.
- source_word: πορεύομαι
  choice: ذاهِبٌ
  rationale: تؤدي معنى الحركة أو التوجّه الحالي نحو أورشليم من غير إضافة معنى السفر أو بلوغ الوجهة.
- source_word: εἰς Ἰερουσαλὴμ
  choice: إِلى أُورُشَلِيمَ
  rationale: حرف الجر εἰς مع اسم المدينة يدل هنا على وجهة الحركة، وتقابله «إلى» مباشرة.
- source_word: διακονῶν
  choice: لِخِدْمَةِ
  rationale: يحفظ معنى الخدمة العملية في διακονέω، ويبيّن الصياغة الغائية المرجحة في السياق من غير حصرها في منصب كنسي أو في مجرد نقل المال.
- source_word: τοῖς ἁγίοις
  choice: القِدِّيسِينَ
  rationale: هذا هو التعبير البولسي المألوف عن المؤمنين بوصفهم مكرسين لله؛ وهو أدق من تفكيكه في المتن إلى «شعب الله».
theological_decisions:
- issue: المقصود بـ«القديسين»
  choice: الإبقاء على «القديسين» في المتن، مع فهمهم سياقيًا على أنهم المؤمنون في أورشليم، ولا سيما المحتاجين منهم
  alternative: التصريح في المتن بـ«المؤمنين في أورشليم» أو «فقراء المؤمنين»
  rationale: اللفظ اليوناني نفسه عام نسبيًا، وإن كان السياق التالي في رومية 15:26 يحدد جماعة أورشليم وفقراءها. إبقاء اللفظ يحفظ صياغة المصدر ولا يجعل التفسير السياقي جزءًا صريحًا من الآية.
- issue: طبيعة خدمة بولس
  choice: «لخدمة» مع حاشية تذكر احتمال تقديم العون
  alternative: «لأحمل معونة إلى» أو «لأوصل التقدمة إلى»
  rationale: السياق يرجح أن الخدمة هي إيصال العطية، لكن διακονῶν لا يصرح في هذه الآية وحدها بالعطية أو بحملها؛ لذلك لا ينبغي تضييق المعنى في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «القديسين» بوصفه المصطلح البولسي المألوف، وتُجنِّب المتن تفسير διακονῶν تفسيرًا أضيق مما يتيحه اللفظ اليوناني.
