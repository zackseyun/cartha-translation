id: ROM.15.11
reference: Romans 15:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: ar
  text: 'وأيضًا: «سبِّحوا الربَّ[a]، يا جميع الأمم[b]، ولتسبِّحه جميع الشعوب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب الأصل العبري للاقتباس: «يهوه»؛ فاللفظة اليونانية κύριος («الرب») تمثّل هنا الاسم الإلهي الوارد في الأصل العبري.'
    reason: alternative_reading
  - marker: b
    text: أو «الأمميين». يمكن أن تعني اللفظة اليونانية ἔθνη «الأمم» أو «الأمميين»؛ والمعنى هنا شامل، كما أنه ينسجم مع حديث بولس عن الأمميين.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: وأيضًا
  rationale: تحافظ على كون العبارة أداة انتقال إلى اقتباس كتابي آخر، من غير إضافة فعل غير موجود صراحة في اليونانية.
- source_word: Αἰνεῖτε
  choice: سبِّحوا
  rationale: صيغة أمر للجمع، و«سبِّحوا» تعبير عربي طبيعي ومباشر عن تقديم الحمد لله في سياق العبادة.
- source_word: πάντα τὰ ἔθνη
  choice: يا جميع الأمم
  rationale: أُضيف حرف النداء لتوضيح المخاطَب في العربية، و«الأمم» تحفظ المعنى الجماعي الشامل، مع إبقاء احتمال معنى «الأمميين» في الحاشية.
- source_word: τὸν κύριον
  choice: الربَّ
  rationale: ترجمة مباشرة لـκύριος في النص اليوناني، مع التنبيه في الحاشية إلى أن اللفظة تمثّل الاسم الإلهي في أصل الاقتباس العبري.
- source_word: ἐπαινεσάτωσαν
  choice: ولتسبِّحه
  rationale: تحفظ قوة الأمر للغائب بصيغة عربية سليمة، وتلائم التوازي الشعري مع الأمر السابق.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود بوضوح إلى «الرب» ويمنع تكرار الاسم بلا حاجة.
- source_word: πάντες οἱ λαοί
  choice: جميع الشعوب
  rationale: تحافظ على التمييز اللفظي بين λαοί «الشعوب» وἔθνη «الأمم» وعلى التوازي في الاقتباس.
theological_decisions:
- issue: ترجمة κύριος في اقتباس من العهد القديم يشير أصله العبري إلى اسم الله
  choice: الرب
  alternative: يهوه
  rationale: النص اليوناني نفسه يقرأ κύριος، لذلك تُترجم «الرب» في المتن؛ أما صلة اللفظة بالاسم الإلهي في الأصل العبري فتُذكر دون إحلال القراءة العبرية محل نص بولس اليوناني.
- issue: دلالة ἔθνη في سياق حديث بولس عن دخول غير اليهود
  choice: جميع الأمم
  alternative: جميع الأمميين
  rationale: للاقتباس معنى عالمي يدعو الأمم كلها إلى التسبيح، بينما يظل معنى «الأمميين» ممكنًا وملائمًا لحجة بولس في السياق، ولذلك حُفظ في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدم «سبِّحوا» بوصفه التعبير العبادي الطبيعي، وحُفظ التوازي بين «الأمم» و«الشعوب». وُضعت علامتا الحاشيتين عند اللفظتين اللتين تخصهما الملاحظتان.
