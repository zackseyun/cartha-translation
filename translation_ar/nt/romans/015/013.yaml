  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: ar
  text: وليملأكم إلهُ الرجاء بكل فرح وسلام إذ تؤمنون، لكي تفيضوا بالرجاء بقوة الروح القدس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: ولْيملأكم إلهُ الرجاء
  rationale: حُفظت الصلة الخفيفة التي تفيدها δὲ بالواو من غير إضفاء معنى زمني أو تقابلي قوي. و«إله الرجاء» تنقل تركيب الإضافة، مع إبقاء دلالته المحتملة على أن الله مصدر الرجاء وموضوعه.
- source_word: πληρώσαι
  choice: يملأكم
  rationale: صيغة الدعاء في اليونانية تُنقل طبيعيًا بلام الدعاء مع المضارع، وتحافظ «يملأكم» على صورة الامتلاء.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: بكل فرح وسلام
  rationale: توضح الباء مضمون الامتلاء، وتحافظ «كل» على شمول πάσης، مع استعمال لفظي «الفرح» و«السلام» المألوفين بوضوح.
- source_word: ἐν τῷ πιστεύειν
  choice: إذ تؤمنون
  rationale: ينقل التعبير الظرف أو الحال المصاحبة لفعل الإيمان، ويحافظ على كونه فعلًا لا اسمًا مجردًا، بصياغة عربية طبيعية.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: لكي تفيضوا
  rationale: «لكي» تلائم الغاية أو النتيجة المقصودة في سياق الدعاء، و«تفيضوا» تحفظ صورة الوفرة والزيادة في περισσεύειν.
- source_word: ἐν τῇ ἐλπίδι
  choice: في الرجاء
  rationale: نقل مباشر للجار والمجرور، ويحافظ على الصلة اللفظية مع «إله الرجاء» في أول الآية.
- source_word: ἐν δυνάμει
  choice: بقوة
  rationale: 'الباء تعبّر بوضوح وإيجاز عن الوسيلة: يحدث فيضان الرجاء بقوة إلهية.'
- source_word: πνεύματος ἁγίου
  choice: الروح القدس
  rationale: هذه هي الصياغة العربية الطبيعية المعروفة للإشارة إلى روح الله القدوس في السياق البولسي.
theological_decisions:
- issue: مرجع πνεύματος ἁγίου
  choice: الروح القدس
  alternative: روح مقدسة
  rationale: السياق البولسي يشير إلى روح الله القدوس، ولذلك تنقل العبارة العربية المرجع الشخصي المقصود من غير إضافة وصف عقائدي غير مصرّح به في النص.
- issue: دلالة εἰς τὸ على الغاية أو النتيجة
  choice: لكي تفيضوا
  alternative: حتى تفيضوا نتيجةً لذلك
  rationale: يحافظ «لكي» على اتجاه الدعاء نحو الغاية المقصودة، مع عدم إنكار ما في التركيب من إمكان دلالة النتيجة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. استُعملت لام الدعاء لتأدية صيغة التمني البرَكية، وحُفظ تكرار «الرجاء» كما في الأصل، من غير شرح تفسيري داخل النص.
