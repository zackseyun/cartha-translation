  to: وليملأكم إلهُ الرجاء بكل فرح وسلام إذ تؤمنون، لكي تفيضوا بالرجاء بقوة الروح القدس.
  rationale: اقتصر التعديل على استبدال «في الرجاء» بـ«بالرجاء» بعد «تفيضوا»، لتحسين السلاسة العربية وإبراز معنى الوفرة المقصود في اليونانية. وحُفظت صيغة الدعاء، والرابطة الخفيفة في الواو، والاحتمال الغائي في «لكي»، والعلاقة الأداتية في «بقوة الروح القدس». لا توجد حواشٍ في المسودة ولا مواضع إحالة تحتاج إلى معالجة.
