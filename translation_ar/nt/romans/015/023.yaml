lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أمّا الآن
  rationale: تنقل التحول إلى وضع بولس الحاضر بلغة عربية طبيعية، مع إبراز القوة الانتقالية للأداة δέ.
- source_word: μηκέτι τόπον ἔχων
  choice: فإذ لم يَعُد لي مجالٌ
  rationale: يفيد τόπος هنا المجال أو المتسع المتبقي للعمل في السياق التبشيري، لا مجرد مكان مادي؛ وصيغة «لم يَعُد» تنقل μηκέτι بوضوح.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: في هذه الأقاليم
  rationale: «الأقاليم» تعبير عربي واضح عن المناطق الجغرافية التي يشير إليها κλίμασι.
- source_word: ἐπιποθίαν ... ἔχων
  choice: ومع أنني ... أشتاق
  rationale: تنقل معنى الشوق القوي، وتصل بينه وبين العبارة الزمنية الممتدة؛ واستُعملت «مع أن» لإظهار المقابلة الثانية التي تحملها δέ بصورة عربية سليمة.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: إلى أن آتي إليكم
  rationale: صياغة مباشرة تحفظ مضمون المصدر اليوناني دون إضافة معنى الزيارة صراحة.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: منذ سنين كثيرة
  rationale: تعبر «منذ» عن امتداد الشوق من سنوات مضت إلى الحاضر، وتحافظ على صورة ἀπό الزمنية.
theological_decisions:
- issue: دلالة τόπον في سياق خدمة بولس
  choice: مجال
  alternative: مكان
  rationale: السياق يرجح معنى المجال أو المتسع للعمل، لكن الحاشية تحفظ إمكان التعبير الحرفي وتوضح أن المقصود ليس بالضرورة موقعًا جغرافيًا.
