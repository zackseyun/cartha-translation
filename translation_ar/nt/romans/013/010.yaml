  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: ar
  text: المحبّة لا تفعل شرًّا بالقريب[a]؛ فالمحبّة إذن هي إتمام الشريعة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المحبّة لا تصنع شرًّا بالقريب».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تمام الشريعة» أو «ملء الشريعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: المحبّة
  rationale: المقابل العربي الطبيعي لـἀγάπη، ويحافظ تكراره في شطري الآية على التوكيد والترابط اللفظي في اليونانية.
- source_word: τῷ πλησίον
  choice: بالقريب
  rationale: يدل الاسم هنا دلالة عامة على الإنسان القريب من المرء الذي يقع عليه أثر الفعل، وصيغة «بالقريب» تلائم تركيب «يفعل شرًّا بـ» في العربية.
- source_word: κακὸν
  choice: شرًّا
  rationale: يحافظ على المجال الدلالي الواسع للكلمة اليونانية، الذي يشمل الشر والأذى وسوء المعاملة، من غير حصره في الضرر الجسدي.
- source_word: οὐκ ἐργάζεται
  choice: لا تفعل
  rationale: ينقل معنى العمل أو الإتيان بالفعل بصورة عربية واضحة، مع إبقاء «شرًّا» مفعولًا به كما في بنية المعنى الأصلية.
- source_word: πλήρωμα
  choice: إتمام
  rationale: يفيد ما يُتمّ الشريعة ويبلغ بها تمامها، وهو أوضح في العربية المعاصرة من «ملء» مع إبقاء البديل في الحاشية.
- source_word: οὖν
  choice: إذن
  rationale: ينقل الاستنتاج الذي يربط الجملة الثانية بالأولى، مع وضعه في موضع عربي طبيعي.
- source_word: νόμου
  choice: الشريعة
  rationale: يشير السياق إلى شريعة معروفة في حجة بولس، و«الشريعة» تعبير عربي واضح وشائع لهذا المعنى.
theological_decisions:
- issue: علاقة المحبّة بالشريعة
  choice: المحبّة هي إتمام الشريعة
  alternative: 'المحبّة هي ملء الشريعة؛ أو: المحبّة تُتمّ الشريعة'
  rationale: تحافظ الصياغة المختارة على الجملة الاسمية اليونانية وعلى كون πλήρωμα اسمًا، فلا تحول العبارة إلى فعل صريح، ولا تحدد على نحو زائد كيفية إتمام المحبّة للشريعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع نبرة وقورة. حافظت الصياغة على التوازي بتكرار «المحبّة»، وعلى الاستنتاج بأداة «إذن»، وأثبتت البدائل الدلالية في الحواشي دون حسم ما يحتمله الأصل.
