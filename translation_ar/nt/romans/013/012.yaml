id: ROM.13.12
reference: Romans 13:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: ar
  text: قد مضى معظم الليل[a]، واقترب النهار. فلنطرح عنا إذن أعمال الظلمة، ولنلبس سلاح النور[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «تقدَّم الليل»، أي إنه قطع شوطًا بعيدًا ومضى أكثره.'
    reason: بيان الصورة اللفظية التي يحملها الفعل اليوناني.
  - marker: b
    text: 'أو: «أسلحة النور» أو «عُدّة النور». فاللفظة اليونانية قد تشير إلى الأسلحة أو إلى التجهيز الحربي عمومًا.'
    reason: حفظ المدى الدلالي للفظة ὅπλα وعدم حصرها في نوع واحد من العتاد.
lexical_decisions:
- source_word: ἡ νὺξ
  choice: الليل
  rationale: أُبقيت صورة الليل الزمنية كما هي، في مقابل النهار، من غير تحويلها في المتن إلى تفسير أخلاقي أو خلاصي صريح.
- source_word: προέκοψεν
  choice: قد مضى معظمه
  rationale: الفعل يدل حرفيًا على التقدّم؛ والتعبير العربي ينقل المقصود في هذا السياق الزمني، أي أن الليل قطع شوطًا بعيدًا وصار أكثره منقضيًا، مع حفظ الصورة الحرفية في الحاشية.
- source_word: ἡ ἡμέρα
  choice: النهار
  rationale: ترجمة مباشرة تحفظ المقابلة التصويرية بين الليل والنهار.
- source_word: ἤγγικεν
  choice: اقترب
  rationale: ينقل معنى الاقتراب والحالة الراهنة الناتجة عنه في صياغة عربية طبيعية موجزة.
- source_word: ἀποβαλώμεθα
  choice: فلنطرح عنا
  rationale: صيغة حثّ جماعي تحفظ حركة نزع الشيء وإلقائه، وتقابل صورة اللبس في الشطر التالي.
- source_word: τὰ ἔργα
  choice: أعمال
  rationale: لفظ مألوف في العربية الكتابية الحديثة ويحفظ التعبير البولسي من غير تضييقه إلى أفعال منفردة.
- source_word: τοῦ σκότους
  choice: الظلمة
  rationale: ترجمة مباشرة تحفظ الاستعارة الأخلاقية وتوازي النور.
- source_word: ἐνδυσώμεθα
  choice: لنلبس
  rationale: يحفظ استعارة ارتداء العدة ويوازي «لنطرح عنا» بصورة طبيعية.
- source_word: τὰ ὅπλα
  choice: سلاح
  rationale: «سلاح» اسم جنس عربي يشمل العدة الحربية، ويلائم فعل اللبس أكثر من «أسلحة» مع بقاء المعنى البديل موضحًا في الحاشية.
- source_word: τοῦ φωτός
  choice: النور
  rationale: ترجمة مباشرة تحفظ المقابلة الرمزية مع الظلمة.
theological_decisions:
- issue: الصورة الأخروية للّيل والنهار
  choice: الإبقاء على «الليل» و«النهار» مع التعبير عن أن معظم الليل قد مضى
  alternative: تفسير الصورة صراحةً بنحو «هذا الدهر المظلم أوشك أن ينتهي» و«العهد الجديد قريب»
  rationale: النص يجمع بين البعد الزمني والأخلاقي والخلاصي، والتفسير الصريح في المتن كان سيحسم دلالة تركها الأصل غنية ومفتوحة.
- issue: دلالة ὅπλα τοῦ φωτός
  choice: سلاح النور
  alternative: أسلحة النور أو عُدّة النور
  rationale: اللفظة اليونانية قد تدل على الأسلحة أو العدة الحربية عمومًا. واختيار اسم الجنس «سلاح» يحفظ الطابع القتالي ويلائم فعل «نلبس»، من غير قصر الصورة على أداة هجومية بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة وقورة. استُخدم «فلنطرح عنا إذن» و«لنلبس» للمحافظة على الحث الجماعي والتوازي البلاغي، مع وضع علامتي الحاشية في موضعيهما المتصلين بالعبارتين المشروحتين.
