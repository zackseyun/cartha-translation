review_pass:
  verdict: revise
  source_fidelity: النص يحافظ على الأمر وعلى التوازي والتكرار، ويميّز بصورة مناسبة بين φόρος («الضريبة») وτέλος («الرسم»). كما أن ترجمة φόβος بـ«الخوف» مشروعة وتحفظ اللفظ المقصود في الأصل دون اختزاله تفسيريًا إلى «الاحترام». لكن «الكرامة» في الاستعمال العربي المعاصر تدل غالبًا على الكرامة الذاتية أو الإنسانية، لا على الإكرام أو التشريف الواجب إظهاره للغير، فلا تؤدي τιμήν هنا بأفضل دقة.
  naturalness: التركيب الحالي مفهوم، لكن «لمن له الضريبة/الخوف/الكرامة» أقل سلاسة وقد يوهم بأن الشخص يملك هذه الأشياء، لا أنها مستحقة له. صياغة «لمن يستحق...» أوضح مع إبقاء التوازي البلاغي.
  terminology: «الضريبة» و«الرسم» مناسبان. يُستحسن «التكريم» لـτιμή، لأنه يدل على إظهار الإكرام والتشريف المستحق، بخلاف «الكرامة».
  issues:
  - severity: medium
    issue: ترجمة τιμήν بـ«الكرامة»
    rationale: «الكرامة» في العربية الحديثة تشير في المقام الأول إلى dignity، بينما τιμή في هذا السياق هي honor يُمنح أو يُظهر للسلطات أو الأشخاص؛ و«التكريم» أدق وأوضح.
  - severity: low
    issue: تركيب «لمن له...»
    rationale: مفهوم في سياق الآية، لكنه أقل طبيعية من «لمن يستحق...» وقد يضعف دلالة الاستحقاق التي يبرزها النص.
