  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: ar
  text: 'أَدُّوا إلى الجميع ما يستحقّونه: الضريبة لمن يستحق الضريبة، والرسم لمن يستحق الرسم، والخوف لمن يستحق الخوف، والتكريم لمن يستحق التكريم.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: أَدُّوا
  rationale: يفيد ردَّ ما هو مستحق أو واجب، ويحافظ على صيغة الأمر.
- source_word: ὀφειλάς
  choice: ما لهم عليكم
  rationale: صياغة عربية طبيعية توضّح معنى المستحقات الواجبة من غير حصرها في الديون المالية.
- source_word: φόρον
  choice: الضريبة
  rationale: يدل غالبًا على الضريبة المباشرة أو الجزية التي تفرضها السلطة.
- source_word: τέλος
  choice: الرسم
  rationale: يميّزه عن φόρος، إذ يشير إلى رسم أو مكس أو جباية غير مباشرة.
- source_word: φόβον
  choice: الخوف
  rationale: يحافظ على المعنى الصريح للكلمة اليونانية وعلى التوتر المقصود، بدل تخفيفها إلى «الاحترام».
- source_word: τιμήν
  choice: الكرامة
  rationale: تنقل معنى التوقير والتقدير المستحق، مع تمييزها عن «الخوف».
theological_decisions:
- issue: مدى معنى φόβος تجاه أصحاب السلطة
  choice: الخوف
  alternative: الاحترام أو الهيبة
  rationale: النص يستعمل لفظ الخوف صراحة، ولا ينبغي حسمه تفسيريًا بتحويله إلى احترام فقط؛ كما أن السياق السابق يتيح معنى الرهبة من سلطة العقاب.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. حُفظ التوازي البلاغي والتكرار في الأصل، مع تمييز الضريبة عن الرسم والخوف عن الكرامة.
