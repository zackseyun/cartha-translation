base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: ar
  text: 'وافعلوا هذا، إذ تعرفون الوقت: فقد حانت لكم[a] بالفعل الساعة لكي تستيقظوا من النوم، لأن خلاصنا أقرب إلينا الآن مما كان حين آمنا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقرأ بعض المخطوطات «لنا» بدلًا من «لكم».
    reason: textual_variant
  - marker: b
    text: 'أو: «حين آمنا أول مرة». واليونانية تقول ببساطة: «حين آمنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: وافعلوا هذا
  rationale: يشير التعبير إلى الوصايا السابقة ويحمل في السياق قوة فعلية مفهومة، فصيغ بصيغة أمر طبيعية من غير إضافة مضمون جديد.
- source_word: εἰδότες τὸν καιρόν
  choice: وأنتم عارفون الوقت
  rationale: تحافظ الصياغة على البنية الحالية للمشاركة اليونانية، وتُبقي دلالة الوقت الحاسم مفهومة من السياق من غير تضييقها إلى معنى واحد.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: فقد حانت لكم بالفعل الساعة
  rationale: 'تحفظ «الساعة» حدة الاستعجال في النص، وينقل «بالفعل» معنى ἤδη بأن اللحظة قد صارت حاضرة، كما تعكس «لكم» قراءة SBLGNT: ὑμᾶς.'
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: لكي تستيقظوا من النوم
  rationale: صياغة عربية واضحة تحفظ استعارة الخروج من النوم، من غير تحويلها إلى تفسير أخلاقي أو أخروي صريح.
- source_word: νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: لأن خلاصنا الآن أقرب إلينا
  rationale: تنقل «لأن» وظيفة γάρ التعليلية، وتحفظ «الخلاص» مطلقًا مع كونه آتيًا أقرب إلى المؤمنين.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: مما كان حين آمنا
  rationale: تحافظ على بساطة الفعل اليوناني «آمنا» ولا تضيف «أول مرة» أو «بدأنا نؤمن»، مع إدراج «مما كان» لاستقامة المقارنة بالعربية.
theological_decisions:
- issue: الخلاص بوصفه أقرب الآن مما كان عند الإيمان
  choice: خلاصنا الآن أقرب إلينا
  alternative: خلاصنا النهائي أقرب إلينا / اكتمال خلاصنا أقرب
  rationale: يصف النص الخلاص بأنه للمؤمنين، ومع ذلك يقترب منهم؛ لذلك تُرك اللفظ عامًا كي يبقى التوتر بين الحاضر والمستقبل قائمًا من غير حصره في مرحلة عقائدية بعينها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت النقطتان لإبراز شرح معرفة الوقت، وحُفظت استعارتا «الساعة» و«الاستيقاظ من النوم» ودلالة الخلاص الآتي من غير تفسير مذهبي زائد.
