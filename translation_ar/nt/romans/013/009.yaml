source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: ar
  text: 'فإنَّ: «لا تزنِ، لا تقتل[a]، لا تسرق، لا تشتهِ»، وإن كانت ثمّة وصية أخرى، فهي تُجمَل في هذا القول[b]: «أحبب قريبك كنفسك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود القتل المحرَّم أو غير المشروع، لا مطلق إزهاق الحياة.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في هذه الكلمة» أو «في هذه العبارة». فاللفظ اليوناني قد يدل هنا على كلمة أو قول أو عبارة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: لأن هذه الوصايا
  rationale: تُدخل العبارةُ مضمون الوصايا المذكورة بوصفه تعليلًا لما سبق. وهذه الصياغة واضحة في العربية وتحفظ قوة γάρ التفسيرية من غير ترجمة حرفية متعسرة لأداة التعريف المحايدة.
- source_word: Οὐ μοιχεύσεις
  choice: لا تزنِ
  rationale: المستقبل اليوناني في اقتباس الوصايا يؤدي معنى الأمر. وصيغة النهي العربية موجزة وتحافظ على الأسلوب التشريعي المألوف.
- source_word: Οὐ φονεύσεις
  choice: لا تقتل
  rationale: الفعل φονεύω يدل في هذا السياق على القتل المحرَّم أو غير المشروع، لا على كل إزهاق للحياة بلا تمييز. أُبقيت الصيغة العربية المألوفة مع توضيح الدقة المعجمية في الحاشية.
- source_word: Οὐ κλέψεις
  choice: لا تسرق
  rationale: تنقل صيغة النهي العربية الوظيفة الأمرية للمستقبل اليوناني وتحافظ على إيقاع قائمة الوصايا.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: لا تشتهِ
  rationale: في سياق الوصايا العشر يدل ἐπιθυμέω على اشتهاء ما لا يحق للمرء، وصيغة «لا تشتهِ» تحافظ على الارتباط النصي بالوصية.
- source_word: καὶ εἴ τις ἑτέρα ἐντολή
  choice: وأي وصية أخرى إن كانت
  rationale: تحفظ الصياغة معنى الاحتمال وعدم التحديد في εἴ τις، وتوسّع الحكم ليشمل كل وصية أخرى.
- source_word: ἀνακεφαλαιοῦται
  choice: تُختصر
  rationale: الفعل يعني جمع أمور متعددة تحت خلاصة أو عنوان جامع. «تُختصر» عربية طبيعية وتؤدي معنى الجمع في عبارة موجزة.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: في هذه الكلمة
  rationale: تشير λόγος هنا إلى صياغة قولية جامعة، لا إلى مفردة معجمية بالضرورة. أُبقيت «الكلمة» في المتن لقربها من الأصل، مع بيان البديل في الحاشية.
- source_word: Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν
  choice: أحبب قريبك كنفسك
  rationale: تحافظ صيغة الأمر على قوة الاقتباس التشريعية، و«قريبك» تصون الصلة بالاقتباس من اللاويين، و«كنفسك» تنقل المقارنة الموجزة من غير زيادة تفسيرية.
theological_decisions:
- issue: صيغة الوصايا المقتبسة
  choice: 'النهي والأمر المباشران: «لا...»، «أحبب»'
  alternative: صيغة خبرية مستقبلية حرفية
  rationale: المستقبل في اليونانية الكتابية يؤدي هنا وظيفة الأمر ضمن اقتباس الشريعة. صيغة الأمر العربية هي المقابل الوظيفي الطبيعي وتحفظ سلطان الوصية وصلتها بالنص السابق من غير افتعال.
- issue: مدلول λόγος في العبارة الجامعة
  choice: «الكلمة» بمعنى القول أو العبارة الجامعة
  alternative: «القول» أو «العبارة»
  rationale: لا يُراد مجرد لفظ منفرد، بل الصياغة الكتابية التي تجمع الوصايا. أبقت الترجمة اللفظ الأقرب مع حاشية تصون السعة الدلالية.
- issue: مدى النهي في φονεύσεις
  choice: «لا تقتل» مع تقييد معناه في الحاشية بالقتل المحرَّم
  alternative: «لا ترتكب جريمة قتل»
  rationale: تحافظ الصياغة المختارة على اللفظ العربي الكتابي المألوف، بينما تمنع الحاشية فهمه على أنه يحظر كل قتل على الإطلاق، وهو أوسع من دلالة الفعل في هذا السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية كريمة. استُخدم إيقاع موجز ومتوازٍ في الوصايا، مع إبقاء الصلة اللفظية باقتباسي الوصايا العشر واللاويين. وُضعت علامتا الحاشية عند اللفظين اللذين تحتاج دلالتهما إلى توضيح.
