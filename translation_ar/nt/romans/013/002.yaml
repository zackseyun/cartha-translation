id: ROM.13.2
reference: Romans 13:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: ar
  text: لذلك، مَن يقاوم السلطة فقد قاوم ما رتَّبه الله[a]، والذين قاوموا سيجلبون على أنفسهم حكمًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ترتيب الله» أو «ما عيَّنه الله».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «حكمًا» بـ«إدانة» أو «قضاء»، لكن اليونانية هنا لا تقتضي بالضرورة معنى الإدانة النهائية الأقوى.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: لذلك
  rationale: تؤدي معنى النتيجة والاستنتاج مما ورد في الآية السابقة، وهي واضحة وطبيعية في العربية المعاصرة.
- source_word: ὁ ἀντιτασσόμενος
  choice: مَن يقاوم
  rationale: اسم الفاعل المعرَّف في اليونانية يُستعمل استعمالًا عامًا؛ وصيغة «مَن يقاوم» تنقل هذا العموم وتحافظ على معنى المقاومة.
- source_word: τῇ ἐξουσίᾳ
  choice: السلطة
  rationale: يحيل اللفظ إلى السلطة الحاكمة المذكورة في السياق السابق، مع الحفاظ على صيغة المفرد والتعريف في النص.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: ما رتَّبه الله
  rationale: تنقل العبارة معنى ما نظَّمه الله أو عيَّنه، بلغة عربية طبيعية، من غير حصر اللفظ في معنى «مرسوم» أو «أمر» رسمي.
- source_word: ἀνθέστηκεν
  choice: فقد قاوم
  rationale: تحافظ «قد» على دلالة الفعل التام ذي الأثر القائم، كما تُبقي الصلة اللفظية مع فعل المقاومة السابق في الأصل.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: والذين قاوموا
  rationale: تنقل اسم الفاعل التام بصيغة تدل على الذين اتخذوا موقف المقاومة، ويُفهم مفعول المقاومة من السياق.
- source_word: ἑαυτοῖς κρίμα λήμψονται
  choice: سيجلبون على أنفسهم حكمًا
  rationale: صياغة عربية مألوفة تعبّر عن أن عاقبة المقاومة ترتد عليهم هم، وتحافظ على اتساع معنى κρίμα دون قصره على الإدانة الأبدية.
theological_decisions:
- issue: مدى معنى κρίμα
  choice: حكمًا
  alternative: إدانةً أو عقوبةً قضائية
  rationale: اللفظ اليوناني قد يدل على الحكم أو الإدانة بحسب السياق، لكن الآية لا تنص صراحة على الإدانة النهائية؛ لذلك يحفظ «حكمًا» التحذير من غير تشديد غير لازم.
- issue: مرجع ἐξουσία
  choice: السلطة، والمقصود سياقيًا السلطة الحاكمة
  alternative: السلطة بمعناها العام المجرد
  rationale: السياق المباشر في رومية 13:1 يتناول السلطات الحاكمة، لكن إبقاء اللفظ «السلطة» يحافظ على إيجاز الأصل ولا يضيف وصفًا غير مصرح به في هذه الآية.
- issue: طبيعة διαταγή الإلهية
  choice: ما رتَّبه الله
  alternative: أمر الله أو ترتيب الله
  rationale: تحافظ الصياغة على القول إن وجود السلطة داخل ترتيب إلهي، من غير أن توحي بأن كل تصرف للسلطة هو بذاته أمر إلهي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «مَن يقاوم» للعموم، وأُبقيت «السلطة» مفردة كما في الأصل، مع صياغة طبيعية تحفظ التوتر بين ترتيب الله ومسؤولية المقاوم.
