  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: ar
  text: لْيَخْضَعْ كلُّ شخصٍ للسُّلطات الحاكمة[a]، لأنه لا سُلطة إلا من الله، والسُّلطات القائمة قد رتَّبها الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السُّلطات العُليا» أو «السُّلطات الأعلى».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قد أقامها الله» أو «قد عيَّنها الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: كلُّ شخص
  rationale: التعبير يعني اصطلاحيًّا كل إنسان، لا «كل نفس» بمعنى أنثروبولوجي تقني؛ وتحافظ الصياغة على القوة التوزيعية لـ πᾶσα.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: للسُّلطات الحاكمة
  rationale: ἐξουσίαις تدل على أصحاب السلطة أو الجهات ذات السلطان، وὑπερεχούσαις تصفها بأنها في موضع أعلى؛ و«الحاكمة» تنقل الوظيفة السياسية بوضوح مع إثبات البدائل الحرفية في الحاشية.
- source_word: ὑποτασσέσθω
  choice: لْيَخْضَعْ
  rationale: صيغة أمر تدعو إلى الخضوع والترتيب تحت السلطة، من غير إضافة معنى الطاعة المطلقة إلى النص.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: لأنه لا سُلطة إلا من الله
  rationale: تنقل العبارة الله بوصفه المصدر النهائي للسلطة، وتحافظ على إيجاز الأصل من غير زيادة تفسيرية.
- source_word: αἱ δὲ οὖσαι
  choice: والسُّلطات القائمة
  rationale: اسم الفاعل المؤنث الجمع يعود صراحة إلى السلطات؛ وإظهار المرجع في العربية أوضح من استعمال ضمير مبهم.
- source_word: τεταγμέναι
  choice: قد رتَّبها
  rationale: الكمال المبني للمجهول من τάσσω يدل على ترتيب تمّ وما زال أثره قائمًا. «رتَّبها الله» يحفظ معنى التنظيم أو الوضع في ترتيب، ولا يوحي بالضرورة بتزكية كل عمل يصدر عن الحكام.
theological_decisions:
- issue: مدى القول إن السلطات القائمة من الله
  choice: إثبات أن السلطات الحاكمة القائمة تقع ضمن ترتيب الله، من غير توسيع العبارة إلى تأييد غير مشروط لكل نظام أو لكل فعل حكومي.
  alternative: «عيَّنها الله»، وهي أقوى إيحاءً بتعيين كل سلطة بعينها؛ أو قصر الكلام على مبدأ السلطة المجرّد دون السلطات القائمة فعليًّا.
  rationale: النص يعود إلى سلطات قائمة بالفعل ويستعمل τεταγμέναι، ولذلك لا يصح تفريغه إلى مبدأ نظري محض؛ وفي الوقت نفسه لا يصرّح بأن الله يوافق أخلاقيًّا على كل ما تفعله كل سلطة. «رتَّبها» تحفظ هذا التوتر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «كل شخص» بدل «كل نفس» لتجنب الإيحاء الأنثروبولوجي غير المقصود، و«السُّلطات الحاكمة» لبيان السياق المدني. جميع علامات الحواشي مثبتة في المتن.
