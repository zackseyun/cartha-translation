id: ROM.13.3
reference: Romans 13:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: ar
  text: فإن الحكّام ليسوا موضع خوف لمن يعمل الخير، بل لمن يعمل الشر.[a] أتريد ألّا تخاف السلطة؟ افعل الخير، فيكون لك منها مدح.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ليس الحكّام خوفًا للعمل الصالح، بل للعمل الشرير». والمقابلة في اليونانية عامة بين الخير والشر في مجال العمل والسلوك.'
    reason: lexical_alternative
  - marker: b
    text: أي إن المدح يصدر عن السلطة الحاكمة.
    reason: referent_clarification
lexical_decisions:
- source_word: οἱ ἄρχοντες
  choice: الحكّام
  rationale: يدل اللفظ على الذين يتولّون الحكم، وهذه صياغة عربية طبيعية تلائم السياق السياسي من غير تخصيص منصب بعينه.
- source_word: φόβος
  choice: موضع خوف
  rationale: الاسم خبر يفيد ما يبعث على الخوف أو يكون سببًا له؛ و«موضع خوف» تؤدي هذا المعنى بوضوح من غير أن توحي بالإرهاب الحديث.
- source_word: τῷ ἀγαθῷ ἔργῳ
  choice: لمن يعمل الخير
  rationale: التركيب مفرد في اليونانية لكنه عام الدلالة؛ والصياغة العربية تنقل السلوك الأخلاقي العام وتنسجم مع الأمر اللاحق «افعل الخير».
- source_word: τῷ κακῷ
  choice: لمن يعمل الشر
  rationale: الصفة مستعملة استعمال الاسم وتقابل الخير؛ أُكمل المعنى في العربية بما يوضحه السياق من العمل والسلوك.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: أتريد ألّا تخاف
  rationale: تحافظ الصياغة على بنية السؤال البلاغي في اليونانية وعلى اتصال النفي بالفعل «تخاف».
- source_word: τὴν ἐξουσίαν
  choice: السلطة
  rationale: يشير المفرد المعرّف إلى السلطة الحاكمة بوصفها جهة أو مؤسسة، و«السلطة» تحفظ الإفراد والعموم.
- source_word: τὸ ἀγαθὸν ποίει
  choice: افعل الخير
  rationale: الصفة المعرّفة مستعملة اسمًا لفئة الخير الأخلاقية؛ وهذه العبارة موجزة وطبيعية وتحفظ عمومها.
- source_word: ἕξεις ἔπαινον
  choice: فيكون لك منها مدح
  rationale: تنقل «سيكون لك مدح» بأسلوب عربي طبيعي، مع الإبقاء على معنى نيل الثناء لا مجرد تفادي العقوبة.
- source_word: ἐξ αὐτῆς
  choice: منها
  rationale: الضمير المؤنث يعود إلى «السلطة»، وتحفظ العربية هذه الإحالة بوضوح.
theological_decisions:
- issue: مدى انطباق القول عن الحكّام والمدح
  choice: إبقاء العبارة تقريرًا لوظيفة السلطة كما يعرضها السياق، من غير إضافة قيد يهوّنها أو تعميم تفسيري يجعل كل حاكم في كل حال يمدح الخير.
  alternative: صياغتها بوصفها ضمانًا مطلقًا لسلوك جميع الحكّام، أو إدخال دلالة ساخرة أو احتجاجية لا تحملها ألفاظ الآية نفسها.
  rationale: النص يقرر المقابلة مباشرة، والترجمة تحافظ على توترها مع الواقع من غير أن تحسمه بإضافة تفسير مذهبي أو تاريخي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظ السؤال البلاغي اليوناني، واستُعملت «السلطة» بوصفها اسمًا مؤنثًا مؤسسيًا، وتُجنبت ألفاظ قد تستدعي معنى الإرهاب السياسي الحديث.
