source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: ar
  text: بل ارتدوا الرب يسوع المسيح، ولا تُعِدّوا للجسد ما يُشبع شهواته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا تُعِدّوا للطبيعة الخاطئة ما يُشبع شهواتها». يقول النص اليوناني «الجسد»، وهو لفظ يستعمله بولس كثيرًا للدلالة على الميول البشرية الساقطة في مقابل الحياة التي يوجّهها الله.'
    reason: بيان البديل الدلالي التفسيري لـ«الجسد» مع إبقاء لفظ الأصل في المتن.
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: البسوا
  rationale: يحفظ استعارة ارتداء الثوب بصياغة عربية موجزة ومألوفة، ويفيد التلبّس بهوية الرب يسوع المسيح ونهجه.
- source_word: κύριον
  choice: الرب
  rationale: يحفظ اللقب المسيحاني ووزنه اللاهوتي في السياق.
- source_word: Χριστόν
  choice: المسيح
  rationale: اللفظ هنا لقب ليسوع، و«المسيح» هو المقابل العربي الراسخ الذي ينقل معنى اللقب لا اسم عائلة.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: لا تدبّروا
  rationale: تفيد العبارة اليونانية اتخاذ تدبير أو ترتيب مسبق؛ والفعل العربي ينقل معنى التخطيط والتهيئة دون إطالة.
- source_word: σάρξ
  choice: الجسد
  rationale: يحفظ مصطلح بولس وصورته وتوتره الدلالي، بدل حصره تفسيريًا في «الطبيعة الخاطئة».
- source_word: εἰς ἐπιθυμίας
  choice: ما يثير شهواته
  rationale: توضح الصلة الغائية بين التدبير للجسد وشهواته بلغة عربية طبيعية، مع إبقاء مرجع الضمير واضحًا.
theological_decisions:
- issue: دلالة σάρξ في سياق أخلاقي عند بولس
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: مع أن السياق يشير إلى ميول بشرية منحرفة، فإن «الطبيعة الخاطئة» تضيق المجاز وتفصل في معنى أنثروبولوجي يحتمل نقاشًا. لذلك بقي «الجسد» في المتن، ووُضع البديل التفسيري في الحاشية.
- issue: صيغة Χριστός كلقب
  choice: المسيح
  alternative: كريستوس/الممسوح
  rationale: «المسيح» المقابل العربي الطبيعي والراسخ للقب اليوناني، ويحفظ وظيفته بوصفه لقبًا ليسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت استعارة اللباس ولفظ «الجسد»، واستُخدم «تدبّروا» لإبراز معنى التهيئة المسبقة. وُضع مؤشر الحاشية [a] في المتن.
