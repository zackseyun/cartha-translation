  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: ar
  text: لذلك لا بدّ من الخضوع[a]، لا بسبب الغضب[b] وحده، بل بسبب الضمير أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تكونوا خاضعين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «العقاب». يقول اليوناني حرفيًا «الغضب»، وقد يشير إلى إجراء الحاكم العقابي، أو على نحو أوسع إلى غضب الله العامل من خلال السلطة المدنية.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: أداة استنتاج تربط هذه الضرورة بما سبق عن دور السلطات، وتحافظ على قوة الانتقال المنطقي بعبارة عربية طبيعية.
- source_word: ἀνάγκη
  choice: لا بدّ
  rationale: تؤدي معنى الضرورة في التركيب اليوناني غير الشخصي من غير أن تضيف فاعلًا صريحًا غير مذكور في الأصل.
- source_word: ὑποτάσσεσθαι
  choice: من الخضوع
  rationale: مصدر واضح يلائم الكلام عن الموقف تجاه السلطات، ولا يوسّع المعنى إلى وجوب الطاعة المطلقة في كل أمر.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: لا ... وحده، بل ... أيضًا
  rationale: صياغة عربية سليمة تحفظ بنية المقابلة والإضافة في الأصل.
- source_word: διὰ τὴν ὀργὴν
  choice: بسبب الغضب
  rationale: تحفظ القيمة المعجمية لكلمة ὀργή وتترك مرجع الغضب غير محسوم كما في اليونانية، بدل تفسيره مباشرة بالعقاب.
- source_word: διὰ τὴν συνείδησιν
  choice: بسبب الضمير
  rationale: تنقل διά السببية وتحافظ على الضمير بوصفه دافعًا داخليًا للخضوع.
theological_decisions:
- issue: مرجع «الغضب» (ὀργή)
  choice: الغضب
  alternative: العقاب، أو غضب الحاكم، أو غضب الله
  rationale: لا يحدد النص اليوناني صاحب الغضب صراحة. والسياق يتيح فهمه بوصفه الإجراء العقابي الذي تمارسه السلطة، أو على نحو أوسع غضب الله العامل من خلالها؛ لذلك أُبقي الغموض في المتن.
- issue: مدلول ὑποτάσσεσθαι تجاه السلطات
  choice: الخضوع
  alternative: أن تكونوا خاضعين
  rationale: «الخضوع» واضح وموجز وينقل الموقف المطلوب تجاه السلطات، من غير إدخال دعوى عن طاعة مطلقة لا يصرح بها النص.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم التركيب غير الشخصي «لا بدّ من» لمجاراة صيغة الضرورة في الأصل، وحُفظ لفظ «الغضب» في المتن صونًا للغموض الحقيقي في مرجعه.
