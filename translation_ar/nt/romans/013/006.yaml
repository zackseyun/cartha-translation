  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: ar
  text: فلهذا أيضًا تدفعون الضرائب، لأنهم خُدّام الله، مواظبون على هذا الأمر بعينه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: تدفعون الضرائب
  rationale: ينقل المعنى المباشر لأداء الضرائب بلغة عربية معاصرة واضحة.
- source_word: λειτουργοὶ θεοῦ
  choice: خُدّام الله
  rationale: يحفظ معنى القائمين بخدمة عامة بتكليف من الله، من غير حصر اللفظ في خدمة دينية أو طقسية.
- source_word: προσκαρτεροῦντες
  choice: مواظبون
  rationale: يعبر عن الاستمرار والتفرغ المثابر للمهمة.
- source_word: εἰς αὐτὸ τοῦτο
  choice: على هذا الأمر بعينه
  rationale: يحافظ على التوكيد الموجود في النص اليوناني مع إبقاء مرجع «هذا الأمر» مرتبطًا بالسياق.
theological_decisions:
- issue: وصف أصحاب السلطة بأنهم λειτουργοὶ θεοῦ
  choice: خُدّام الله
  alternative: خَدَمٌ لله / قائمون بخدمة الله
  rationale: الصياغة المختارة تثبت نسبتهم إلى الله كما في الأصل، من غير أن توحي بالضرورة بمنصب كهنوتي أو تزكية أخلاقية مطلقة.
- issue: مرجع «هذا الأمر بعينه»
  choice: الإبقاء على الإشارة من غير تفسير زائد
  alternative: تفسيرها بتحصيل الضرائب أو بخدمة الحكم عمومًا
  rationale: التركيب اليوناني يحتمل اتصالها بالمهمة العامة المذكورة في السياق، ولذلك لا يُحسم المرجع داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. حوفظ على تكرار التعليل «لأن» وعلى التوكيد في خاتمة الآية، مع تجنب ألفاظ طقسية قد تضيق دلالة λειτουργοί.
