review_pass:
  verdict: revise
  source_fidelity: يحفظ المسودّة بنية الحث في περιπατήσωμεν وصورة النهار، وتسلسل أزواج الرذائل. لكن «المضاجع المحرمة» صياغة غير طبيعية في العربية وتضيف توصيف «المحرمة» بدل نقل الدلالة الاصطلاحية لكلمة κοίταις بوضوح. كما أن «بلياقة» قد تُفهم في العربية المعاصرة على أنها إتيكيت أو تهذيب اجتماعي، وهي أضيق وأضعف من εὐσχημόνως في هذا السياق الأخلاقي.
  naturalness: «لنسلك سلوكًا لائقًا» فصيحة معاصرة وواضحة وتحافظ على استعارة السلوك. و«الفجور الجنسي والمجون» أوضح وأكثر سلاسة من «المضاجع المحرمة والفجور»، مع إبقاء التمييز بين النشاط الجنسي غير المنضبط والسلوك المنفلت الوقح.
  terminology: تُترجم κοίταις بـ«الفجور الجنسي» ترجمةً بالمعنى، وهو المقابل الواضح للإحالة الاصطلاحية الجنسية في الأصل دون إبقاء استعارة «المضاجع» المبهمة. وتؤدي «المجون» معنى ἀσελγείαις، أي الانفلات الوقح، من غير حصره في معنى جنسي محدد. وتبقى «الغيرة» ممكنة لـζῆλος في السياق السلبي، مع إيراد «الحسد» بديلًا في الحاشية.
  issues:
