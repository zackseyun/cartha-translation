    rationale: κοίταις تعني حرفيًا «مضاجعات/أسرة»، لكنها تستخدم هنا استعمالًا اصطلاحيًا جنسيًا. وإضافة «المحرمة» لا يقابلها لفظ صريح في اليونانية، بينما تبقى العبارة العربية نفسها غير سلسة.
  - severity: low
    issue: «بلياقة» أضعف من المقصود الأخلاقي في εὐσχημόνως.
    rationale: قد تدل في الاستعمال الحديث على حسن التصرف الشكلي أو قواعد الإتيكيت؛ أما السياق فيدعو إلى سلوك لائق/محترم على نحو أوسع.
