  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: ar
  text: لِنَسْلُكْ سُلُوكًا لَائِقًا[a] كَمَا فِي النَّهَارِ، لَا فِي الْعَرْبَدَةِ وَالسُّكْرِ، وَلَا فِي الْفُجُورِ الْجِنْسِيِّ وَالْمُجُونِ، وَلَا فِي الْخِصَامِ وَالْغَيْرَةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «باحتشام».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الحسد»؛ فاللفظ اليوناني قد يدل على الغيرة أو الحسد، وهو هنا ذو معنى سلبي في سياق قائمة الرذائل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: كما في النهار
  rationale: يحفظ صورة النهار في سياق المقابلة بين النور والظلمة، من غير إضافة تفسير عقائدي غير مصرَّح به في العبارة.
- source_word: εὐσχημόνως
  choice: بلياقة
  rationale: تؤدي معنى السلوك المحترم واللائق في عربية فصحى واضحة، مع إثبات البديل «باحتشام» في الحاشية.
- source_word: περιπατήσωμεν
  choice: لنسلك
  rationale: يحفظ استعارة المشي الدالة على نهج الحياة، وينقل قوة صيغة الحث الجماعي في اليونانية.
- source_word: κώμοις
  choice: العربدة
  rationale: يدل اللفظ على اللهو الصاخب المنفلت، ولا يحصر المعنى في الفجور الجنسي كما قد تفعل بعض البدائل.
- source_word: μέθαις
  choice: السكر
  rationale: ترجمة مباشرة وطبيعية لحالات الثمالة أو نوبات الإفراط في الشراب.
- source_word: κοίταις
  choice: المضاجع المحرمة
  rationale: يحافظ على صورة «المضاجع» في الأصل، مع بيان دلالتها الاصطلاحية على العلاقات الجنسية غير المشروعة.
- source_word: ἀσελγείαις
  choice: الفجور
  rationale: ينقل معنى السلوك الوقح المنفلت من الضوابط، وهو كثيرًا ما يحمل دلالة جنسية في مثل هذا السياق.
- source_word: ἔριδι
  choice: الخصام
  rationale: لفظ عربي واضح يعبّر عن النزاع والمشاحنة في سياق قائمة الرذائل.
- source_word: ζήλῳ
  choice: الغيرة
  rationale: يحفظ أحد المعنيين السلبيين المحتملين للفظ في هذا السياق، مع إثبات «الحسد» بديلًا ممكنًا في الحاشية.
theological_decisions:
- issue: الصورة المجازية للنهار في الحث الأخلاقي
  choice: الإبقاء على «كما في النهار» من غير شرح زائد
  alternative: كما لو كنا في وضح النهار
  rationale: العبارة جزء من صورة اليوم والليل في السياق القريب؛ والأولى أن تحفظ الترجمة الصورة والتوتر الأدبي بدل تحويلها إلى تقرير تفسيري.
- issue: الدلالة الجنسية الاصطلاحية للفظ κοίταις
  choice: المضاجع المحرمة
  alternative: المضاجع؛ أو الفجور الجنسي
  rationale: الترجمة الحرفية «المضاجع» وحدها قد تكون مبهمة، أما إضافة «المحرمة» فتوضح الدلالة الأخلاقية الجنسية مع إبقاء صورة الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، تحافظ على استعارة السلوك وصورة النهار، وعلى الإيقاع الثلاثي المتكرر «لا في... ولا في... ولا في...».
