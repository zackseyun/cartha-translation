revisions:
- from: لِنَسْلُكْ بِلِيَاقَةٍ[a] كَمَا فِي النَّهَارِ، لَا فِي الْعَرْبَدَةِ وَالسُّكْرِ، وَلَا فِي الْمَضَاجِعِ الْمُحَرَّمَةِ وَالْفُجُورِ، وَلَا فِي الْخِصَامِ وَالْغَيْرَةِ[b].
  to: لِنَسْلُكْ سُلُوكًا لَائِقًا[a] كَمَا فِي النَّهَارِ، لَا فِي الْعَرْبَدَةِ وَالسُّكْرِ، وَلَا فِي الْفُجُورِ الْجِنْسِيِّ وَالْمُجُونِ، وَلَا فِي الْخِصَامِ وَالْغَيْرَةِ[b].
  rationale: تستبدل المراجعة تعبيرين قد يضعفان الوضوح أو الطبيعية العربية. فـ«سلوكًا لائقًا» ينقل قوة الحث الأخلاقي في εὐσχημόνως بوضوح، و«الفجور الجنسي والمجون» يترجم زوج κοίταις وἀσελγείαις بالمعنى المتاح في العربية المعاصرة، من غير إضافة تعريف فقهي أو تفسير مذهبي. وتبقى الصورة الزمنية، وصيغة الحث، وبنية القائمة، ومواضع الحواشي محفوظة.
