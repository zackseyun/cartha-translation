  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: ar
  text: لا تكونوا مدينين لأحد بشيء، إلا أن تحبوا بعضكم بعضًا؛ لأن من يحب الآخر[a] قد أتمّ الشريعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «شخصًا آخر». واليونانية حرفيًا: «الآخر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: لا تكونوا مدينين لأحد بشيء
  rationale: يحافظ على النفي الشامل في اليونانية، «لا تدينوا لأحد بشيء»، بصياغة عربية واضحة، ويُبقي معنى الدَّين والالتزام من غير أن يحصره في المال وحده.
- source_word: εἰ μὴ
  choice: إلا بأن
  rationale: تُدخل الاستثناء الوحيد مباشرة، وتربطه بالمصدر المؤول الذي يعبّر عن التزام المحبة.
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: بأن يحب بعضكم بعضًا
  rationale: صياغة عربية طبيعية تحفظ معنى التبادل في ἀλλήλους والقوة الفعلية للمصدر اليوناني.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: لأن من يحب
  rationale: تنقل اسم الفاعل المعرّف بصيغة عامة ممثِّلة، من غير تقييدها بجنس أو فئة.
- source_word: τὸν ἕτερον
  choice: الآخر
  rationale: ترجمة مباشرة للتعبير اليوناني «الآخر»، مع إبقاء احتمال «شخص آخر» في الحاشية، بدل إدخال لفظ «القريب» غير الوارد هنا.
- source_word: νόμον
  choice: الشريعة
  rationale: «الشريعة» هي المقابل العربي الواضح للناموس المقصود في السياق، ولا سيما أن الآيات التالية تعرض وصايا منها.
- source_word: πεπλήρωκεν
  choice: قد أتمّ
  rationale: ينقل صيغة التام اليونانية وما تفيده من إنجاز قائم الأثر، ويحافظ على فكرة إتمام مطلب الشريعة.
theological_decisions:
- issue: مدى النهي عن الدَّين
  choice: إبقاء العبارة نهيًا مباشرًا عن أن يكون الإنسان مدينًا بشيء، مع استثناء التزام المحبة المتبادلة.
  alternative: اعتبارها تحريمًا مطلقًا لكل اقتراض، أو قصرها على الالتزامات الأخلاقية المجازية وحدها.
  rationale: النص نفسه يستخدم لغة الدَّين أو الالتزام ثم يستثني المحبة؛ لذلك لا ينبغي للترجمة أن تحسم الجدل الأخلاقي الأوسع بشأن جميع صور الاقتراض.
- issue: هوية «الآخر»
  choice: الآخر
  alternative: القريب أو شخص آخر
  rationale: يحافظ هذا الاختيار على اللفظ اليوناني وعلى سعته، من غير استباق صياغة وصية محبة القريب الواردة في السياق اللاحق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «الشريعة» بدل «الناموس» لسهولة الفهم العام، وحُفظ التوازي بين الدَّين والتزام المحبة، كما وُضع رمز الحاشية بعد «الآخر» لأنه اللفظ الذي تشرحه الحاشية.
