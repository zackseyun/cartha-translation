id: ROM.13.4
reference: Romans 13:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: ar
  text: لأنها خادمةٌ لله لأجل خيرك. ولكن إن فعلتَ الشر، فخَفْ، لأنها لا تحمل السيف عبثًا[a]. فهي خادمةٌ لله، ومنتقمةٌ تُنزِل الغضبَ بمن يمارس الشر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلا غاية».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «منفِّذةٌ للغضب على من يفعل الشر».'
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: خادمةٌ لله
  rationale: ينقل معنى الجهة التي تخدم الله وتنفّذ تكليفًا منه، مع تأنيث الصياغة لأن المرجع في السياق هو «السلطة».
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: لأجل خيرك
  rationale: يعبّر بوضوح وطبيعية عن الغاية النافعة للسلطة بالنسبة إلى المخاطَب.
- source_word: τὸ κακὸν ποιῇς
  choice: فعلتَ الشر
  rationale: يحفظ الدلالة الأخلاقية لـκακόν في عبارة عربية مباشرة ومألوفة.
- source_word: φοβοῦ
  choice: فخَفْ
  rationale: صيغة أمر موجزة تقابل الأمر اليوناني وتحافظ على قوة التحذير.
- source_word: εἰκῇ
  choice: عبثًا
  rationale: تفيد أن حمل السيف ليس بلا غاية أو أثر، وهي مقابلة عربية طبيعية موجزة.
- source_word: μάχαιραν φορεῖ
  choice: تحمل السيف
  rationale: يحفظ الصورة الملموسة للسيف ودلالته العقابية، ويعبّر عن الحمل المعتاد للسلطة.
- source_word: ἔκδικος
  choice: منتقمةٌ
  rationale: يحفظ البعد القصاصي في اللفظ اليوناني من غير تحويله إلى تعبير إداري عام مثل «منفذة للعقوبة».
- source_word: εἰς ὀργὴν
  choice: للغضب
  rationale: يبقي العبارة مقتضبة كما في اليونانية، ولا يصرّح بأن الغضب هو غضب الله مع أن السياق قد يوحي بذلك.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: من الذي يمارس الشر
  rationale: «يمارس» تنقل ما في اسم الفاعل المضارع من دلالة على السلوك المتصف بالاستمرار أو الاعتياد.
- source_word: γὰρ
  choice: لأنها / لأنها / فهي
  rationale: نُقلت الروابط التفسيرية بصيغ عربية طبيعية تحافظ على تسلسل حجة بولس من غير تكرار ثقيل.
theological_decisions:
- issue: صلة دور السلطة العقابي بالغضب الإلهي
  choice: «منتقمةٌ للغضب» من غير إضافة «الله» إلى الغضب
  alternative: «منفِّذةٌ غضب الله» أو «منفِّذةٌ للعقاب»
  rationale: السياق يجعل السلطة خادمة لله، لكن النص اليوناني لا يذكر «الله» صراحةً مع ὀργή؛ لذلك تُحفظ دلالة العبارة وتوترها اللاهوتي من غير تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم تأنيث الضمائر والأوصاف تبعًا لمرجعها السياقي «السلطة»، وحُفظت صورة السيف وقوة العبارة العقابية من غير إدخال تحديد مذهبي لطبيعة الغضب.
