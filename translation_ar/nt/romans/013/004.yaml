  to: لأنها خادمةٌ لله لأجل خيرك. ولكن إن فعلتَ الشر، فخَفْ، لأنها لا تحمل السيف عبثًا[a]. فهي خادمةٌ لله، ومنتقمةٌ تُنزِل الغضبَ بمن يمارس الشر[b].
  rationale: استُبدلت العبارة الأخيرة بصياغة عربية سليمة تحافظ على «منتقمة» مقابِلًا لـἔκδικος، وعلى «الغضب» دون إضافته إلى الله مقابِلًا لـεἰς ὀργήν، وتحدد بوضوح أن الغضب يقع على من يمارس الشر. كما أضيفت الفواصل اللازمة لسلامة القراءة من دون تغيير المعنى.
