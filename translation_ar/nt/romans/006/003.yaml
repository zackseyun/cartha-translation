  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: ar
  text: أم تجهلون أن جميعنا الذين اعتمدنا إلى المسيح يسوع قد اعتمدنا إلى موته؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: أم
  rationale: تحفظ الانتقال الجدلي في سؤال بلاغي متصل بما سبقه، وهي أفصح من «أو» في هذا السياق الاستفهامي.
- source_word: ἀγνοεῖτε
  choice: تجهلون
  rationale: تنقل المضارع في صيغة السؤال البلاغي مباشرة، مع إبقاء نبرة الاحتجاج اللطيف واستدعاء المعرفة المشتركة.
- source_word: ὅσοι
  choice: أننا جميعًا، نحن الذين
  rationale: تُظهر الشمول الذي تفيده اللفظة اليونانية، وتحافظ على ضمير المتكلم الجمع في الفعلين بصياغة عربية واضحة.
- source_word: ἐβαπτίσθημεν
  choice: اعتمدنا
  rationale: تنقل الفعل المبني للمجهول دلاليًا بصيغة «اعتمدنا» الاصطلاحية في العربية، من غير إضافة تفسير لطبيعة المعمودية أو مفاعيلها.
- source_word: εἰς
  choice: إلى
  rationale: تحافظ على صورة الاتجاه أو الإدخال الكامنة في حرف الجر اليوناني، ولا تحسمها تفسيريًا بعبارات مثل «اتحدنا بـ» أو «بالنسبة إلى».
- source_word: Χριστὸν Ἰησοῦν
  choice: المسيح يسوع
  rationale: '«المسيح» المقابل العربي الطبيعي للقب Χριστός، مع الحفاظ على ترتيب الأصل: المسيح يسوع.'
- source_word: τὸν θάνατον αὐτοῦ
  choice: موته
  rationale: صياغة عربية موجزة ومباشرة تنقل الاسم وضمير الملكية بلا توسع تفسيري.
theological_decisions:
- issue: هل يُفسَّر حرف الجر εἰς في لغة المعمودية على أنه فاعلية أسرارية، أو اتحاد رمزي، أو ارتباط عهدي؟
  choice: تُرجم الموضعان بـ«إلى».
  alternative: «في»، أو «لـ»، أو «اتحادًا بـ»
  rationale: «إلى» تبقي قوة الاتجاه والإدخال في التعبير اليوناني، من غير أن تفرض تصورًا مذهبيًا محددًا لكيفية ارتباط المعمودية بالمسيح وموته.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «اعتمدنا» بوصفه المقابل العربي الجاري للفعل، وحُفظ التكرار المقصود في الأصل بين الاعتماد إلى المسيح يسوع والاعتماد إلى موته.
