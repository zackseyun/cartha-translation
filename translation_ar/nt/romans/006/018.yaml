  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: ar
  text: وإذ حُرِّرتم من الخطيئة، استُعبدتم للبرّ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للعدل».'
