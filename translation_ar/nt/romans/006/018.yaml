  - marker: b
    text: 'أو: «جُعلتم عبيدًا للبرّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: وإذ حُرِّرتم
  rationale: اسم فاعل ماضٍ مبني للمجهول يدل على فعل تحرّر تلقّاه المخاطبون؛ والصياغة تحافظ على سبق الفعل وعلى المبني للمجهول في عربية واضحة.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل حجة بولس، والواو تؤدي هذا الربط طبيعيًا من غير إبراز مقابلة أقوى مما يقتضيه السياق.
- source_word: ἁμαρτίας
  choice: الخطيئة
  rationale: المفرد المعرّف يحفظ معنى الخطيئة، بما فيه إمكان تصويرها في السياق كقوة متسلطة.
- source_word: ἐδουλώθητε
  choice: استُعبدتم
  rationale: فعل ماضٍ مبني للمجهول يحافظ على قوة استعارة العبودية وعلى انتقال السيادة، من غير تلطيفها إلى مجرد الخدمة.
- source_word: δικαιοσύνῃ
  choice: للبرّ
  rationale: «البرّ» هو المقابل العربي المألوف الذي يستوعب الأبعاد الأخلاقية والعهديّة والقضائية الممكنة للكلمة البولسية، مع إثبات «العدل» بديلًا معجميًا في الحاشية.
theological_decisions:
- issue: صياغة استعارة العبودية في δουλόω
  choice: استُعبدتم للبرّ
  alternative: صِرتم عبيدًا للبرّ
  rationale: يحفظ الاختيار حدة استعارة العبودية وصيغة الفعل المبني للمجهول، من غير أن يخففها إلى «خدمتم» أو يحسم ما وراء النص من استنتاجات لاهوتية.
- issue: مدى معنى δικαιοσύνη
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» أوسع وأنسب في هذا السياق البولسي، بينما يظل «العدل» احتمالًا معجميًا حقيقيًا لا ينبغي حجبه.
