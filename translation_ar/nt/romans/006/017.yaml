id: ROM.6.17
reference: Romans 6:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: ar
  text: فالشكر لله، لأنكم، مع أنكم كنتم عبيدًا للخطيئة، أطعتم من القلب نموذج التعليم[a] الذي سُلِّمتم إليه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قالب التعليم» أو «معيار التعليم».
    reason: lexical_alternative
  - marker: b
    text: 'وحرفيًا: «الذي سُلِّمتم إلى داخله».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: فالشكر لله
  rationale: هذا تركيب اصطلاحي للتعبير عن الشكر الموجَّه إلى الله، لا عن النعمة بوصفها صفة مجردة. والصياغة العربية موجزة وتحفظ نبرة بولس الحمدية.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: عبيدًا للخطيئة
  rationale: لفظ «عبيد» يحفظ صورة الملكية والسيطرة التي تقوم عليها حجة رومية 6، بخلاف «خدام» التي قد تضعف معنى الاستعباد.
- source_word: ὑπηκούσατε
  choice: أطعتم
  rationale: الفعل يدل على الطاعة الفعلية، لا على مجرد السماع، والصياغة المباشرة تحفظ قوته الأخلاقية.
- source_word: ἐκ καρδίας
  choice: من القلب
  rationale: تحفظ العبارة صورة القلب في الأصل وتدل طبيعيًا في العربية على الطاعة الداخلية الصادقة.
- source_word: τύπον διδαχῆς
  choice: نموذج التعليم
  rationale: «نموذج» ينقل معنى τύπος بوصفه قالبًا أو نمطًا أو معيارًا، و«التعليم» مقابل واضح وطبيعي لـ διδαχή.
- source_word: παρεδόθητε
  choice: سُلِّمتم
  rationale: حُفظ البناء للمجهول والصورة اللافتة التي تجعل المؤمنين هم الذين سُلِّموا إلى التعليم، بدل قلب العبارة إلى أن التعليم سُلِّم إليهم.
- source_word: εἰς ὃν
  choice: الذي ... إليه
  rationale: تحفظ «إليه» اتجاه الحركة في εἰς ضمن تركيب عربي سليم، مع إبقاء احتمال الصورة الأقوى «إلى داخله» في الحاشية.
theological_decisions:
- issue: هل يُلطَّف معنى δοῦλοι إلى «خدام» أم يُنقل بوصفه عبودية؟
  choice: عبيدًا للخطيئة
  alternative: خدامًا للخطيئة
  rationale: سياق رومية 6 مبني على استعارة العبودية والسيادة المتعارضة؛ لذلك تحافظ «عبيد» على حدة الصورة اللاهوتية من غير تلطيف.
- issue: هل يُعاد تركيب المبني للمجهول بحيث يكون التعليم هو الذي سُلِّم إلى المؤمنين؟
  choice: نموذج التعليم الذي سُلِّمتم إليه
  alternative: التعليم الذي سُلِّم إليكم
  rationale: النص اليوناني يجعل المخاطَبين هم موضوع فعل التسليم، ويصور انتقالهم إلى سلطان نموذج التعليم. إبقاء هذا التركيب يمنع تسوية صورة مقصودة ولا يحسم هوية الفاعل غير المذكور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «الخطيئة» و«عبيد» للمحافظة على المصطلح والصورة في السياق، وأُبقي المبني للمجهول بلا تعيين لمن قام بالتسليم. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما مباشرة.
