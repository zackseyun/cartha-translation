source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: ar
  text: فماذا نقول إذًا؟ أَنستمرّ في الخطيئة لكي تزداد النعمة؟[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَنُصِرّ على الخطيئة...؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكي تفيض النعمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: فماذا نقول إذًا؟
  rationale: تحفظ الفاء والإشارة «إذًا» الانتقال الاستنتاجي في حجة بولس، مع صياغة عربية فصيحة وطبيعية.
- source_word: ἐροῦμεν
  choice: نقول
  rationale: المضارع العربي في هذا السؤال التداولي ينقل بصورة طبيعية معنى المستقبل اليوناني المستخدم لطرح ما ينبغي قوله في ضوء ما سبق.
- source_word: ἐπιμένωμεν
  choice: أَنستمرّ
  rationale: ينقل المضارع الشرطي في السؤال التداولي فكرة مواصلة مسار قائم، من غير تحويل السؤال صراحة إلى إذن أو إلزام.
- source_word: τῇ ἁμαρτίᾳ
  choice: في الخطيئة
  rationale: حرف الجر «في» يعبّر بوضوح عن الاستمرار ضمن مجال الخطيئة أو ممارستها، وهو استعمال عربي مألوف.
- source_word: ἵνα
  choice: لكي
  rationale: تُبقي الغاية المقترحة في صياغة السؤال صريحة، كما في اليونانية.
- source_word: ἡ χάρις
  choice: النعمة
  rationale: المقابل العربي الراسخ والدقيق لنعمة الله في سياق حجة بولس.
- source_word: πλεονάσῃ
  choice: تزداد
  rationale: تعبر بوضوح معاصر عن الزيادة في المقدار أو الامتداد، مع إبقاء «تفيض» بديلًا مشروعًا في الحاشية.
theological_decisions:
- issue: هل يُصاغ سؤال بولس بوصفه طلب إذن، أو تعبيرًا عن إلزام، أو سؤالًا تداوليًا؟
  choice: 'سؤال تداولي عن الفعل المقترح: «أَنستمرّ في الخطيئة»'
  alternative: «هل ينبغي أن نستمرّ في الخطيئة؟»
  rationale: صيغة اليونانية تطرح مسارًا ممكنًا للنقاش، أما إدخال «ينبغي» في المتن فقد يرجّح معنى الإلزام الأخلاقي أكثر مما تصرّح به الصيغة الأصلية؛ لذا حُفظ توتر السؤال البلاغي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل الاستفهام المباشر «أَنستمرّ» ليظل السؤال طبيعيًا من دون إضافة «ينبغي»، وحُفظ المصطلح اللاهوتي المألوف «النعمة».
