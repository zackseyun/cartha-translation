  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: ar
  text: لِأَنَّ مَنْ مَاتَ قَدْ بُرِّئَ مِنَ الْخَطِيئَةِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد تبرَّر من الخطيئة»؛ وبحسب السياق أيضًا: «قد تحرر من الخطيئة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: مَنْ مَاتَ
  rationale: أداة التعريف مع اسم الفاعل الأُحادي جاءت بمعنى اسمي عام؛ و«مَنْ مات» صياغة عربية طبيعية تحفظ هذا العموم من غير تقييد غير لازم بالجنس.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تفيد γάρ التعليل أو التفسير لما سبق، و«لأنَّ» تؤدي هذه الصلة بوضوح في العربية.
- source_word: δεδικαίωται
  choice: قَدْ بُرِّئَ
  rationale: الفعل δικαιόω ذو دلالة قضائية أساسًا، وصيغة التام المبني للمجهول تدل على حالة مترتبة على حكم سابق. «قد بُرِّئ» تحفظ النبرة القضائية وتلائم حرف الفصل «مِن»، مع إبقاء احتمال «حُسِب بارًّا» ونتيجة التحرر في الحاشية.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: مِنَ الْخَطِيئَةِ
  rationale: تدل ἀπό هنا على الانفصال أو الخلاص من سلطان أو مطالبة؛ و«من الخطيئة» تحفظ اتساع التعبير ولا تحصره في الذنب وحده أو السلطان وحده.
theological_decisions:
- issue: هل تُفهم δεδικαίωται هنا بمعنى قضائي محض أم بمعنى التحرر من سلطان الخطيئة؟
  choice: قَدْ بُرِّئَ مِنَ الْخَطِيئَةِ
  alternative: قد حُسِب بارًّا من جهة الخطيئة؛ وقد تحرر من الخطيئة
  rationale: سياق رومية 6 يبرز انتهاء سلطان الخطيئة على من مات، لكن بولس استعمل δικαιόω، وهو فعل ذو صبغة قضائية. لذلك يحفظ «بُرِّئ» الدلالة القضائية، فيما تعرض الحاشية الصياغة الأكثر حرفية والنتيجة التحريرية من غير حسم التوتر بينهما.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة كتابية رصينة. استُعمل «مَنْ» للعموم، وأُثبتت علامة الحاشية في المتن بعد الجملة.
