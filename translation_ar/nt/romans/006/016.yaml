source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: ar
  text: 'أما تعلمون أنكم، إذ تقدّمون أنفسكم عبيدًا للطاعة، تكونون عبيدًا لمن تطيعون: إمّا للخطية المؤدية إلى الموت، وإمّا للطاعة المؤدية إلى البرّ[a]؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: العدل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε
  choice: تقدِّمون أنفسكم
  rationale: يحفظ معنى وضع النفس تحت تصرف آخر، وهو تعبير عربي طبيعي وواضح.
- source_word: δούλους / δοῦλοί
  choice: عبيدًا / عبيدًا
  rationale: ينقل بوضوح دلالة الخضوع والملكية الملازمة لصورة العبودية في حجة بولس، بخلاف «خدّام» الأخف دلالة.
- source_word: εἰς ὑπακοήν
  choice: للطاعة
  rationale: يحفظ صيغة الاسم ويعبّر بإيجاز عن الغاية المقصودة.
- source_word: ᾧ ὑπακούετε
  choice: لمن تطيعونه
  rationale: يحافظ على المرجع الشخصي لأداة الوصل من غير إضافة لفظ «سيّد» غير الموجود صراحة في اليونانية.
- source_word: ἁμαρτίας
  choice: للخطية
  rationale: ينقل اللفظ مباشرة، ويترك لصورة العبودية في السياق أن تُظهر تشخيص الخطية بوصفها سيّدًا.
- source_word: εἰς θάνατον
  choice: فتؤول بكم إلى الموت
  rationale: يبيّن القوة الاتجاهية والنتيجية لحرف الجر εἰς بعبارة عربية سليمة.
- source_word: ὑπακοῆς
  choice: للطاعة
  rationale: يحفظ الاسم المجرّد والتناظر المقصود بين الخطية والطاعة.
- source_word: δικαιοσύνην
  choice: البرّ
  rationale: «البرّ» هو المقابل العربي اللاهوتي الراسخ والأوسع دلالة هنا، مع إبقاء «العدل» بديلًا معجميًا في الحاشية.
theological_decisions:
- issue: ترجمة δικαιοσύνη في التقابل البولسي
  choice: البرّ
  alternative: العدل
  rationale: السياق يجمع البعد الأخلاقي واللاهوتي في مقابلة الخطية والموت بالطاعة والبرّ؛ لذلك يحفظ «البرّ» المدى الدلالي الأوسع، مع إثبات «العدل» بوصفه احتمالًا معجميًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقيت صورة العبودية قوية كما في الأصل، وحُفظ توازي «إمّا... وإمّا». استُخدمت «أمَا تعلمون» للسؤال الإنكاري، و«فتؤول بكم إلى» لتوضيح نتيجة كل مسار دون حسم التوتر البلاغي في النص.
