base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: ar
  text: حاشا! نحن الذين متنا عن الخطيئة، كيف نستمر في العيش فيها؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يمكن أن يكون هذا!»؛ وهي عبارة قوية للرفض القاطع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: تعبير عربي فصيح ومفهوم يفيد الرفض القاطع، ويحافظ على قوة العبارة اليونانية دون إطالة تفسيرية.
- source_word: οἵτινες
  choice: نحن الذين
  rationale: يحافظ على صيغة المتكلم الجمع الشاملة، ويصل العبارة بما قبلها على نحو طبيعي.
- source_word: ἀπεθάνομεν
  choice: متنا
  rationale: ينقل الماضي اليوناني بوصفه حدثًا حاسمًا، مع إبقاء استعارة الموت كما هي.
- source_word: τῇ ἁμαρτίᾳ
  choice: عن الخطيئة
  rationale: يعبّر في العربية عن الموت من جهة الخطيئة أو انقطاع الصلة بسلطانها، من غير تحويل الاستعارة إلى شرح عقائدي.
- source_word: πῶς ἔτι
  choice: كيف نستمر
  rationale: ينقل الاستفهام الإنكاري ومعنى مواصلة الحال الذي تفيده ἔτι.
- source_word: ζήσομεν
  choice: في العيش
  rationale: مع «نستمر» تؤدي العبارة معنى المستقبل البلاغي بوصفه استنكارًا لاستمرار العيش.
- source_word: ἐν αὐτῇ
  choice: فيها
  rationale: يعيد الضمير إلى الخطيئة بوصفها نطاقًا يُعاش فيه، ويحافظ على تماسك الصورة اليونانية.
theological_decisions:
- issue: هل يصف «متنا عن الخطيئة» تحسنًا أخلاقيًا تدريجيًا أم قطيعة حاسمة مع سلطان الخطيئة؟
  choice: الإبقاء على استعارة «متنا عن الخطيئة» دون تفسير إضافي.
  alternative: صرنا غير متأثرين بالخطيئة، أو تركنا الخطيئة.
  rationale: النص اليوناني يقرر الاستعارة مباشرة؛ والإبقاء عليها يصون التوتر اللاهوتي ولا يفرض تصورًا مذهبيًا محددًا لآلية التقديس.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُخدمت «حاشا» لقوة الإنكار، و«نستمر في العيش» لإظهار معنى الاستمرار في ἔτι دون إضعاف السؤال البلاغي.
