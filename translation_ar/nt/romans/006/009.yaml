  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: ar
  text: عالِمين أن المسيح[a]، بعدما أُقيم من بين الأموات، لا يموت بعد الآن؛ ولا يعود للموت سلطان عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «الممسوح».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: عالِمين
  rationale: يحفظ صيغة اسم الفاعل واتصالها بحجة السياق، من غير أن يحدد صراحةً معنى سببيًا مثل «لأننا نعلم».
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ العربي المألوف ينقل اللقب المسياني، وهو في الاستعمال العربي يجمع بين دلالة اللقب والاستعمال العَلَمي.
- source_word: ἐγερθεὶς
  choice: بعدما أُقيم
  rationale: يحفظ المبني للمجهول وسبق القيامة زمنيًا على عدم الموت بعد الآن، بصياغة عربية طبيعية.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل معنى الخروج من وسط الموتى بوضوح، مع الحفاظ على التعبير الاصطلاحي عن القيامة.
- source_word: οὐκέτι
  choice: لا ... بعد الآن / لا يعود
  rationale: ينقل معنى الانتهاء والنهائية في الموضعين مع تنويع عربي طبيعي لا يغيّر الدلالة.
- source_word: ἀποθνῄσκει
  choice: يموت
  rationale: المضارع العربي المباشر يعبّر بوضوح عن أن الموت لم يعد يقع عليه.
- source_word: θάνατος
  choice: الموت
  rationale: ترجمة مباشرة تحفظ تشخيص الموت بوصفه صاحب سلطان في العبارة.
- source_word: κυριεύει
  choice: له سلطان عليه
  rationale: ينقل معنى السيادة والتسلط بقوة ووضوح، ويحافظ على صورة خضوع الشخص لسلطان الموت.
theological_decisions:
- issue: دلالة Χριστός في الخطاب البولسي
  choice: المسيح
  alternative: المسيح المنتظر
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ دلالته اللاهوتية من غير إضافة تفسيرية ليست في النص.
- issue: المبني للمجهول في ἐγερθεὶς
  choice: أُقيم
  alternative: قام
  rationale: يحفظ المبني للمجهول في اليونانية، ولا يصرّح بهوية الفاعل مع أن السياق اللاهوتي قد يفهمه على أنه الله.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة. استُعمل «عالِمين» للمحافظة على البنية الحالية، و«بعدما أُقيم» لتجنب الثقل في «إذ أُقيم». وُضعت علامة الحاشية [a] بعد «المسيح» كما يقتضي النص.
