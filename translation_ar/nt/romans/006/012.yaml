source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: ar
  text: لذلك، لا تدعوا الخطيئة تملك في جسدكم المائت، فتطيعوا شهواته[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «فتطيعوا شهوات الخطيئة».'
    reason: قراءة بديلة لمرجع الضمير.
lexical_decisions:
- source_word: οὖν
  choice: لذلك
  rationale: تفيد الاستنتاج من الحجة السابقة، وتحافظ على الصلة المنطقية بوضوح.
- source_word: βασιλευέτω
  choice: لا تدعوا ... تملك
  rationale: تنقل قوة النهي المستمر، وتحفظ صورة الخطيئة بوصفها قوةً مالكةً أو حاكمة، بصياغة عربية طبيعية.
- source_word: ἁμαρτία
  choice: الخطيئة
  rationale: المقابل المباشر، مع إبقاء تشخيص الخطيئة من خلال فعل «تملك» من غير إضافة تفسيرية.
- source_word: θνητῷ
  choice: المائت
  rationale: يحفظ معنى الجسد الخاضع للموت، ويوافق المقابلة السياقية بين حال الجسد الحاضرة والحياة الجديدة.
- source_word: σώματι
  choice: جسدكم
  rationale: ترجمة مباشرة لا توسع اللفظ إلى معنى جسدي أو مجازي غير مصرح به.
- source_word: εἰς τὸ ὑπακούειν
  choice: فتطيعوا
  rationale: الفاء تنقل نتيجة تسلط الخطيئة أو غايته بصياغة عربية موجزة وطبيعية، من غير حسم كامل بين الغاية والنتيجة.
- source_word: ἐπιθυμίαις
  choice: شهواته
  rationale: «الشهوات» هنا أوسع من الرغبة الجنسية وحدها، وتحمل الدلالة الأخلاقية السلبية التي يقتضيها السياق.
- source_word: αὐτοῦ
  choice: ـه في «شهواته»
  rationale: الضمير اليوناني مفرد مذكر/محايد، فيعود نحويًا على «الجسد» المحايد، لا على «الخطيئة» المؤنثة، مع إثبات الاحتمال السياقي الآخر في الحاشية.
theological_decisions:
- issue: هل تُعرض الخطيئة بوصفها أفعالًا فحسب أم قوةً حاكمة؟
  choice: الإبقاء على تشخيص الخطيئة قوةً تملك.
  alternative: تفسير العبارة تفسيرًا مجردًا بمعنى سيطرة السلوك الخاطئ.
  rationale: اختيار الفعل ذو الصورة الملوكية في الأصل يشخص الخطيئة؛ والحفاظ على هذه الصورة يصون التوتر اللاهوتي من غير إدخال شرح عقائدي.
- issue: مرجع الضمير αὐτοῦ
  choice: عودة الضمير في «شهواته» على الجسد المائت.
  alternative: فهم الشهوات على أنها شهوات الخطيئة من جهة المعنى السياقي.
  rationale: المطابقة النحوية اليونانية ترجح «الجسد»، لكن ارتباط الشهوات بالخطيئة مفهوم سياقي ممكن، ولذلك ذُكر في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة ومهيبة. استُخدم «تملك» للحفاظ على الاستعارة الملوكية بصيغة طبيعية، ووُضع مؤشر الحاشية مباشرة بعد موضع الضمير المختلف في مرجعه.
