reference: Romans 6:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: ar
  text: أتكلم بعبارات بشرية بسبب ضعف جسدكم[a]. فكما قدَّمتم أعضاءكم عبيدًا للنجاسة ولانتهاك الشريعة، مما يقود إلى انتهاك الشريعة، كذلك قدِّموا الآن أعضاءكم عبيدًا للبرّ[b]، مما يقود إلى التقديس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا أن تُفهم «الجسد» هنا، على نحو تفسيري أضيق، بمعنى «الطبيعة الخاطئة»، لكن التعبير اليوناني أوسع دلالةً.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «للعدل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: أقول هذا بلغةٍ بشرية
  rationale: ينقل التعبير الاصطلاحي الذي يدل على أن بولس يتكلم بأسلوب ملائم للفهم البشري المعتاد، من غير حصره في معنى «التشبيه».
- source_word: ἀσθένειαν
  choice: ضعف
  rationale: لفظ عربي واضح وواسع يحفظ معنى القصور أو الوهن دون تضييق دلالته.
- source_word: σαρκὸς
  choice: جسدكم
  rationale: يحفظ اتساع التعبير اليوناني وإشارته إلى الوجود البشري الضعيف، من غير تفسيره مباشرةً بأنه «الطبيعة الخاطئة».
- source_word: παρεστήσατε / παραστήσατε
  choice: قدَّمتم / قدِّموا
  rationale: يحافظ على تكرار الفعل وعلى المقابلة بين سلوك المخاطَبين في الماضي وما يُطلب منهم الآن.
- source_word: μέλη
  choice: أعضاءكم
  rationale: يقابل اللفظ اليوناني مباشرةً، ويلائم السياق البولسي الذي يشير إلى أعضاء الجسد بوصفها أدوات للفعل.
- source_word: δοῦλα
  choice: عبيدًا
  rationale: يحفظ قوة صورة العبودية والسيادة التي يقوم عليها سياق رومية 6، بخلاف «خُدّام» الأضعف دلالةً.
- source_word: ἀκαθαρσίᾳ
  choice: النجاسة
  rationale: تعبير عربي مفهوم يحفظ المعنى الأخلاقي للفظ.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: مخالفة الشريعة / مخالفة الشريعة
  rationale: يُظهر عنصر الخروج على الشريعة في ἀνομία، ويحافظ على تكرار اللفظ في الجملة.
- source_word: εἰς τὴν ἀνομίαν
  choice: فأفضى ذلك إلى مخالفة الشريعة
  rationale: يصوغ معنى الاتجاه أو النتيجة الذي تؤديه εἰς بلغة عربية طبيعية، مع إبقاء العلاقة بين مخالفة الشريعة ونتيجتها.
- source_word: δικαιοσύνῃ
  choice: البرّ
  rationale: «البرّ» هو المقابل العربي الراسخ والملائم هنا للمقابلة الأخلاقية مع النجاسة ومخالفة الشريعة، مع إثبات «العدل» بديلًا ممكنًا في الحاشية.
- source_word: εἰς ἁγιασμόν
  choice: فيفضي ذلك إلى التقديس
  rationale: يحفظ معنى الاتجاه أو النتيجة، ويعبّر «التقديس» عن السير نحو حالة مكرسة مقدسة ضمن حجة بولس.
theological_decisions:
- issue: دلالة σάρξ في عبارة «ضعف جسدكم»
  choice: جسدكم
  alternative: طبيعتكم الخاطئة
  rationale: السياق يسمح بفهم الضعف البشري في الحياة الجسدية الساقطة، لكن اليونانية لا تفرض التفسير العقائدي الأضيق «الطبيعة الخاطئة»؛ لذلك حُفظ اتساع التعبير.
- issue: ترجمة δικαιοσύνη في السياق البولسي
  choice: البرّ
  alternative: العدل
  rationale: المقابلة هنا أخلاقية بين النجاسة ومخالفة الشريعة من جهة والبر من جهة أخرى، ولذلك يلائم «البرّ» السياق، مع إبقاء «العدل» احتمالًا معجميًا في الحاشية.
translation_notes:
  register: 'العربية فصحى معاصرة واضحة ووقورة. استُخدم «عبيدًا» للمحافظة على قوة استعارة العبودية، و«مخالفة الشريعة» لإبراز دلالة ἀνομία مع تكرارها، ووُضعت علامتا الحاشيتين في موضعيهما الصحيحين: بعد «جسدكم» وبعد «البرّ».'
