revisions:
- from: أقول هذا بلغةٍ بشرية بسبب ضعف جسدكم[a]. فكما قدَّمتم أعضاءكم عبيدًا للنجاسة ولمخالفة الشريعة، فأفضى ذلك إلى مخالفة الشريعة، كذلك قدِّموا الآن أعضاءكم عبيدًا للبرّ[b]، فيفضي ذلك إلى التقديس.
  to: أتكلم بعبارات بشرية بسبب ضعف جسدكم[a]. فكما قدَّمتم أعضاءكم عبيدًا للنجاسة ولانتهاك الشريعة، مما يقود إلى انتهاك الشريعة، كذلك قدِّموا الآن أعضاءكم عبيدًا للبرّ[b]، مما يقود إلى التقديس.
  rationale: تُصحَّح العبارة الافتتاحية لتؤدي الاصطلاح اليوناني على نحو أدق وأوضح. وتُصاغ عبارتا الغاية/النتيجة بصورة عربية طبيعية، مع إبقائهما مرتبطتين بتقديم الأعضاء كما في الأصل. وتُستبدل «مخالفة الشريعة» بـ«انتهاك الشريعة» لتحسين السلاسة في العربية المعاصرة مع حفظ التكرار والدلالة الأساسية لـἀνομία.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:53Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك المقابلة بين العرض السابق للأعضاء للنجاسة واللاإثم وبين الأمر الحالي بعرضها للبر. لكن «بلغة بشرية» أضيق وأقل دقة من دلالة ἀνθρώπινον λέγω الاصطلاحية، وصياغة «فأفضى ذلك/فيفضي ذلك» تُدخل مرجعًا سببيًا مستقلًا («ذلك») ليس في اليونانية، حيث تتعلق عبارتا εἰς بالعرض نفسه بوصفهما اتجاهًا أو نتيجة.
  naturalness: النص فصيح ومفهوم إجمالًا، لكن «أتكلم بعبارات بشرية» أكثر سلاسة ودقة في هذا السياق، و«مما يقود إلى...» أسلس من جعل «ذلك» فاعلًا مستقلًا. كما أن «انتهاك الشريعة» أوضح في الاستعمال العربي المعاصر من «مخالفة الشريعة» مع المحافظة على تكرار اللفظ.
  terminology: «الجسد»، «أعضاؤكم»، «عبيدًا»، «النجاسة»، «البرّ»، و«التقديس» مناسبة. يُحافظ على «البرّ» لـ δικαιοσύνη، مع بديل «العدل» في الحاشية. وتعكس «انتهاك الشريعة» دلالة ἀνομία دون توسيعها إلى تفسير عقائدي.
