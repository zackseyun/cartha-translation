  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: ar
  text: فإن الخطيئة لن تتسلط عليكم[a]، لأنكم لستم تحت الشريعة[b]، بل تحت النعمة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن تسود عليكم».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تحت شريعة»، وهو تعبير يفيد الخضوع لسلطان الشريعة أو نظامها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: الخطيئة
  rationale: المقابل العربي المعياري الواضح، مع إبقاء الاسم من غير ما يضيف إلى النص تمييزًا طباعيًا خاصًا، بينما يحفظ فعل «تسود» تشخيص الخطيئة بوصفها قوة حاكمة.
- source_word: κυριεύσει
  choice: لن تسود عليكم
  rationale: ينقل معنى ممارسة السيادة والتسلط بلغة عربية طبيعية، ويحفظ صورة الخطيئة التي تحكم دون مبالغة تفسيرية.
- source_word: ὑπὸ νόμον
  choice: تحت الشريعة
  rationale: صياغة عربية مألوفة للتعبير البولسي الدال على الخضوع لسلطان الشريعة أو نظامها. أُدخلت أداة التعريف وفق الاستعمال العربي الطبيعي والسياق، مع بيان الصيغة اليونانية الحرفية في الحاشية.
- source_word: χάριν
  choice: النعمة
  rationale: «النعمة» هي المقابل العربي الراسخ والملائم لقوة المصطلح في مقابلة بولس بين الشريعة والنعمة.
- source_word: γὰρ
  choice: فإن / لأن
  rationale: نُقل γὰρ الأول بـ«فإن» لربط الآية بما قبلها، والثاني بـ«لأن» لإظهار العلاقة التعليلية بوضوح.
theological_decisions:
- issue: مدى إبراز تشخيص الخطيئة بوصفها قوة حاكمة
  choice: إبقاء «الخطيئة» بصيغتها المعتادة وترجمة الفعل «لن تسود عليكم».
  alternative: «لن تتسلط عليكم الخطيئة» أو صياغة تجعل الخطيئة سيدًا صريحًا.
  rationale: اليونانية تشخّص الخطيئة من خلال فعل السيادة، لكن لا تستلزم إضافة وصف عقائدي أو تشخيص أقوى مما في النص؛ وتحفظ الصياغة المختارة الصورة والتوتر اللاهوتي.
- issue: تحديد مدلول νόμος في عبارة ὑπὸ νόμον
  choice: «تحت الشريعة» من غير إضافة «شريعة موسى» داخل المتن.
  alternative: «تحت ناموس» أو «تحت شريعة موسى».
  rationale: السياق البولسي يرجّح نظام الشريعة وسلطانها، لكن إضافة «موسى» ليست صريحة في هذه الآية؛ لذلك تُرك التحديد للسياق ولم يُحسم بإضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «الشريعة» بدل «الناموس» لأنها أيسر للقارئ المعاصر، مع الحفاظ على الإيجاز والبنية التعليلية في الأصل.
