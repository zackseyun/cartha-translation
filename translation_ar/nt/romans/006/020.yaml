  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: ar
  text: لأنكم حين كنتم عبيدًا للخطية، كنتم أحرارًا من جهة البر[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالنسبة إلى البر». ويمكن أن يحمل «البر» هنا أيضًا معنى «العدل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: عبيدًا
  rationale: يحفظ معنى العبودية القوي في سياق رومية 6، حيث يقابل بولس بين عبوديتين متنافستين، ولا يخففه إلى مجرد الخدمة.
- source_word: ἁμαρτίας
  choice: للخطية
  rationale: تؤدي الإضافة اليونانية بمعنى الخضوع والانتماء إلى سلطان الخطية، وهي صياغة عربية طبيعية مع «عبيد».
- source_word: ἐλεύθεροι
  choice: أحرارًا
  rationale: 'تحفظ المفارقة الحادة في كلام بولس: كان المخاطبون، وهم تحت عبودية الخطية، غير خاضعين للبر.'
- source_word: τῇ δικαιοσύνῃ
  choice: من جهة البر
  rationale: تعامل الداتيف بوصفه دالًا على المجال أو الاعتبار، فتحفظ غموض العلاقة المقصودة من غير أن تجعل البر نفسه مستعبِدًا.
- source_word: δικαιοσύνῃ
  choice: البر
  rationale: «البر» هو المقابل العربي المألوف والدقيق في الاستعمال البولسي، مع إمكان دلالة اللفظة أيضًا على العدل بحسب السياق.
- source_word: γὰρ
  choice: لأن
  rationale: تُظهر الصلة التفسيرية بما قبل الآية بوضوح وطبيعية في العربية المعاصرة.
theological_decisions:
- issue: كيفية التعبير عن علاقة الحرية بالبر في مقابلة بولس
  choice: كنتم أحرارًا من جهة البر
  alternative: كنتم أحرارًا من البر
  rationale: الصياغة المختارة تحفظ داتيف المجال أو الاعتبار والتوتر البلاغي، من غير أن تحسمه على أنه انفصال صرف عن البر أو توحي بأن البر قوة مستعبِدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «عبيد» لإبراز صورة العبودية المركزية في السياق، و«من جهة» لصون دلالة الاعتبار في اليونانية مع بقاء العبارة طبيعية ومفهومة.
