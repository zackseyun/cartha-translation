  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: ar
  text: أمّا الآن، فإذ قد تحرّرتم من الخطيئة واستُعبدتم لله[a]، فلكم ثمركم المؤدّي إلى التقديس[b]، والعاقبة[c] هي الحياة الأبدية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وصِرتم عبيدًا لله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «المفضي إلى القداسة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «النهاية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: أمّا الآن
  rationale: يحفظ الانتقال التقابلي القوي مع حال المخاطَبين السابقة، بصياغة عربية طبيعية وفصيحة.
- source_word: ἐλευθερωθέντες
  choice: إذ قد تحرّرتم
  rationale: ينقل اسم الفاعل الماضي المبني للمجهول بوصفه فعلًا تمّ وناله المؤمنون، مع وضوح الأسلوب العربي.
- source_word: ἁμαρτίας
  choice: الخطيئة
  rationale: يحفظ المفرد الذي يصوّر الخطيئة في السياق كقوة أو سلطان، لا كمجموعة خطايا منفردة.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: واستُعبدتم لله
  rationale: يبقي صورة العبودية القوية والمبني للمجهول، ويحفظ المقابلة المقصودة بين سلطان الخطيئة والعبودية لله.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: فلكم ثمركم
  rationale: يحافظ على استعارة الثمر وعلى معنى الامتلاك في ἔχετε دون تحويلها إلى تعبير تفسيري مثل المنفعة.
- source_word: εἰς ἁγιασμόν
  choice: المؤدّي إلى التقديس
  rationale: يعبّر عن اتجاه الثمر إلى نتيجة، ويحفظ البعد العملي أو المتنامي الممكن في ἁγιασμός.
- source_word: τὸ δὲ τέλος
  choice: والعاقبة
  rationale: تنقل τέλος هنا بوصفها النتيجة النهائية المقصودة، مع إثبات البديل الحرفي «النهاية» في الحاشية.
- source_word: ζωὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: ترجمة عربية مستقرة ودقيقة تحافظ على الثقل اللاهوتي للعبارة.
theological_decisions:
- issue: صورة العبودية في علاقة المؤمنين بالله
  choice: استُعبدتم لله
  alternative: صرتم عبيدًا لله
  rationale: يحفظ الاختيار قوة استعارة العبودية والمبني للمجهول، فلا يلطّف حجة بولس إلى مجرد الخدمة أو التكريس.
- issue: دلالة ἁγιασμός
  choice: التقديس
  alternative: القداسة
  rationale: «التقديس» يحفظ بصورة أفضل احتمال العملية أو النتيجة التي يتجه إليها الثمر، فيما تبقى «القداسة» قراءة معجمية معتبرة مثبتة في الحاشية.
- issue: دلالة τέλος
  choice: العاقبة
  alternative: النهاية
  rationale: «العاقبة» توضّح معنى النتيجة النهائية في السياق، بينما تحافظ الحاشية على المقابل الأقرب إلى اللفظ اليوناني دون حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. حُفظت استعارتا العبودية والثمر، ووُضعت علامات الحواشي [a] و[b] و[c] في مواضعها داخل النص.
