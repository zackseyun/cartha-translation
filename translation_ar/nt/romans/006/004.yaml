  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: ar
  text: إذًا دُفِنَّا معه بالمعمودية إلى الموت، لكي، كما أُقيم المسيح من بين الأموات بمجد الآب، نسلك نحن أيضًا في جِدّة الحياة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετάφημεν
  choice: دُفِنَّا معه
  rationale: ينقل الفعل المبني للمجهول والعمل الماضي، ويعبّر «معه» طبيعيًا عن السابقة συν- دون تركيب عربي متكلّف.
- source_word: οὖν
  choice: إذًا
  rationale: تحفظ دلالة الاستنتاج من الحجة السابقة، مع وضعها في موضع طبيعي في العربية.
- source_word: διὰ τοῦ βαπτίσματος
  choice: بالمعمودية
  rationale: تنقل معنى الوسيلة في διά مع المضاف إليه، من غير أن تحسم تفسيرًا طائفيًا محددًا لدور المعمودية.
- source_word: εἰς τὸν θάνατον
  choice: إلى الموت
  rationale: تحافظ على القوة الاتجاهية لحرف الجر εἰς وعلى الارتباط الوثيق بالموت.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي معنى الغاية بوضوح في العربية المعاصرة.
- source_word: Χριστὸς
  choice: المسيح
  rationale: المقابل العربي الراسخ للقب Χριστός، وهو يحفظ دلالته المسيانية ويجري طبيعيًا في العربية.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: يعكس النهوض من وسط الأموات، وهو تعبير عربي واضح ودقيق.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: بمجد الآب
  rationale: يحفظ الاستعمال الوسيلي لـδιά ومعنى δόξα بوصفه «المجد»، من غير اختزاله في «القدرة» وحدها.
- source_word: περιπατήσωμεν
  choice: نسلك
  rationale: يحفظ استعارة السير التي يستخدمها بولس للدلالة على نهج الحياة، بدل تسطيحها إلى «نحيا».
- source_word: ἐν καινότητι ζωῆς
  choice: في حياة جديدة
  rationale: صياغة عربية واضحة وطبيعية تنقل معنى الجِدّة في الحياة، مع تجنب العبارة الاصطلاحية الأثقل «جِدّة الحياة».
theological_decisions:
- issue: هل تُصاغ διὰ τοῦ βαπτίσματος بما يفرض فهمًا أسراريًا محددًا؟
  choice: بالمعمودية
  alternative: من خلال المعمودية / بواسطة المعمودية
  rationale: تحفظ الصياغة دلالة الوسيلة في اليونانية، لكنها لا تضيف شرحًا يقرر كيفية ارتباط المعمودية بالاتحاد بالمسيح.
- issue: هل يشير «مجد الآب» إلى القدرة وحدها؟
  choice: بمجد الآب
  alternative: بقدرة الآب
  rationale: أُبقي اللفظ الأوسع «المجد» كما في الأصل، لكيلا تُحصر دلالته اللاهوتية في القدرة فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارة «السلوك»، واستُخدمت «في حياة جديدة» بدل «في جِدّة الحياة» لتيسير الفهم لدى القارئ العام مع إبقاء المعنى الأساسي.
