  source_fidelity: النص العربي ينقل بنية الشرط في εἰ δέ، وفعل الموت الماضي ἀπεθάνομεν، ومعنى الشركة في σὺν Χριστῷ، ومضمون الإيمان بالمستقبل في πιστεύομεν ὅτι ... συζήσομεν αὐτῷ بأمانة. «قد متنا» مقبول عربيًا في هذا السياق ولا يغيّر دلالة الماضي المنجَز.
