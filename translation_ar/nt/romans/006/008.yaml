  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: ar
  text: وَإِنْ كُنَّا قَدْ مُتْنَا مَعَ الْمَسِيحِ، فَنَحْنُ نُؤْمِنُ أَنَّنَا سَنَحْيَا أَيْضًا مَعَهُ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: وَإِنْ كُنَّا
  rationale: تنقل «إن» الشرط، وتحفظ الواو أثر δέ الانتقالي في سياق الحجة من غير إضافة ظرف زمني غير موجود في اليونانية.
- source_word: ἀπεθάνομεν
  choice: قَدْ مُتْنَا
  rationale: صيغة الماضي تعبّر عن موت وقع، وتساعد «قد» على إبراز سبقه بالنسبة إلى الرجاء المستقبلي من غير تغيير معنى الفعل.
- source_word: σὺν Χριστῷ
  choice: مَعَ الْمَسِيحِ
  rationale: «مع» تقابل معنى المصاحبة والاتحاد في σύν، و«المسيح» المقابل العربي الطبيعي للقب Χριστός.
- source_word: πιστεύομεν
  choice: فَنَحْنُ نُؤْمِنُ
  rationale: «نؤمن» تنقل المعنى المباشر للفعل، والفاء تبيّن جواب الشرط، وإظهار الضمير يمنح العبارة وضوحًا وإيقاعًا طبيعيين.
- source_word: ὅτι
  choice: أَنَّنَا
  rationale: تدخل «أنّ» على مضمون الإيمان كما تفعل ὅτι.
- source_word: καὶ συζήσομεν αὐτῷ
  choice: سَنَحْيَا أَيْضًا مَعَهُ
  rationale: تحفظ العبارة دلالة المستقبل والإضافة في καί، وتنقل معنى الحياة المشتركة في συζάω مع إبقاء «معه» صريحة.
theological_decisions:
- issue: دلالة Χριστῷ
  choice: الْمَسِيحِ
  alternative: كريستوس
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني، ويحفظ طبيعته اللقبية؛ أما النقل الصوتي فغير طبيعي وقد يحوّله إلى اسم مبهم لدى القارئ العربي.
- issue: طبيعة الحياة المستقبلية في συζήσομεν αὐτῷ
  choice: سَنَحْيَا أَيْضًا مَعَهُ
  alternative: سنقوم ونحيا معه
  rationale: يحفظ النص عموم قول بولس عن الحياة المستقبلية مع المسيح، ولا يضيف تحديدًا صريحًا للقيامة أو لآليتها لم يرد في هذه الآية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. لم تُضف حاشية «المسيح/Christ» لأن العربية تستعمل «المسيح» مقابلاً طبيعيًا واحدًا للقب اليوناني، فلا يوجد هنا بديل عربي حقيقي يحتاج إلى تنبيه القارئ.
