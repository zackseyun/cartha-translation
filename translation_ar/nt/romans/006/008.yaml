  terminology: «المسيح» المقابل العربي المألوف والدقيق للقب Χριστός. وتحافظ «معه» على دلالة الحياة المشتركة دون إضافة تفسير عن القيامة أو طبيعتها. لا تستلزم العربية حاشية بديل «Christ»، إذ إن «المسيح» هو المقابل العربي الطبيعي ولا يوجد التباس قارئ مماثل للإنجليزية.
