  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: ar
  text: فماذا إذن؟ أنخطئ لأننا لسنا تحت ناموس، بل تحت نعمة؟ حاشا![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هل لنا أن نخطئ؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كلا البتة!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: فماذا إذن؟
  rationale: ينقل بإيجاز الانتقال الاستدلالي في حجة بولس، من غير إضافة عبارة غير موجودة في اليونانية.
- source_word: ἁμαρτήσωμεν
  choice: أنخطئ
  rationale: 'صيغة الجمع المتكلم في صيغة الاحتمال هنا استفهام تداولي؛ و«أنخطئ» تؤدي معنى الاقتراح البلاغي بوضوح وإيجاز. ويمكن أيضًا فهمها: «هل لنا أن نخطئ؟».'
- source_word: ὅτι
  choice: لأن
  rationale: 'تبيّن العلة المقترحة للسؤال: ارتكاب الخطية بحجة أن المؤمنين ليسوا تحت ناموس بل تحت نعمة.'
- source_word: ὑπὸ νόμον
  choice: تحت ناموس
  rationale: يحافظ التنكير على غياب أداة التعريف في اليونانية، ويترك مدى المقصود بالناموس للسياق بدل حصره صراحة في ناموس موسى.
- source_word: ὑπὸ χάριν
  choice: تحت نعمة
  rationale: «نعمة» المقابل اللاهوتي العربي المألوف والدقيق لـ χάρις هنا، ويحفظ التوازي مع «تحت ناموس» دون إضافة تفسيرية.
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: تعبير عربي راسخ وموجز يؤدي قوة الرفض الشديد في العبارة اليونانية، من غير أن يحولها إلى تقرير تفسيري مطوّل.
theological_decisions:
- issue: مدى νόμος في مقابلة بولس بين الناموس والنعمة
  choice: «ناموس» منكرًا، من غير تحديده في النص الرئيس
  alternative: «الناموس» أو «ناموس موسى»
  rationale: النص اليوناني يخلو من أداة التعريف، وتحديد المقصود بأنه ناموس موسى يحسم مسألة تفسيرية لا تحسمها صياغة هذه الآية وحدها.
- issue: قوة μὴ γένοιτο وطبيعتها
  choice: «حاشا!» بوصفها رفضًا قاطعًا
  alternative: «كلا البتة!»
  rationale: يحفظ الاختيار النبرة البلاغية القوية من غير جعل العبارة دعاءً حرفيًا أو إدخال تعليل غير موجود.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. استُخدم «ناموس» للمحافظة على المصطلح البولسي والتمييز المقصود عن «نعمة»، مع تجنب التحديد التفسيري الزائد. أُثبتت علامتا الحاشيتين في النص الرئيس.
