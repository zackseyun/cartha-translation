source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: ar
  text: لِأَنَّهُ إِنْ كُنَّا قَدْ صِرْنَا مُتَّحِدِينَ مَعَهُ فِي شِبْهِ مَوْتِهِ[a]، فَسَنَكُونُ أَيْضًا مُتَّحِدِينَ مَعَهُ فِي شِبْهِ قِيَامَتِهِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن ترجمة «متحدين»: «نامين معه» أو «ملتحمين معه»؛ فاللفظ اليوناني يوحي باتحاد عضوي أو نمو مشترك.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا، يرد في اليونانية: «فسنكون أيضًا للقيامة». ويُستعاد معنى الاتحاد من الشطر الأول؛ أما «في شبه» وإعادة الضمير في الترجمة فلتوضيح التوازي في العربية.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: مُتَّحِدِينَ مَعَهُ
  rationale: تدل الكلمة على اتصال عضوي أو مشاركة وثيقة. وعبارة «متحدين معه» واضحة في العربية المعاصرة وتحفظ دلالة الاتحاد من غير أن تحصرها في تفسير عقائدي معين.
- source_word: γεγόναμεν
  choice: قَدْ صِرْنَا
  rationale: ينقل هذا التعبير أثر صيغة التام اليونانية، أي حدوث الأمر في الماضي مع بقاء نتيجته في الحاضر.
- source_word: τῷ ὁμοιώματι
  choice: فِي شِبْهِ
  rationale: تحفظ العبارة لفظ «الشبه» وتفهم حالة المجرور اليونانية بوصفها دالة على المجال أو العلاقة، من غير الإفراط في تحديد معناها.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: مَوْتِهِ
  rationale: نقل مباشر وطبيعي للتركيب الإضافي اليوناني.
- source_word: ἀλλὰ καὶ
  choice: فَسَنَكُونُ أَيْضًا
  rationale: الفاء تُظهر الارتباط الاستنتاجي بالسابق، و«أيضًا» تحفظ القوة التصاعدية في الانتقال من الموت إلى القيامة، من غير إضافة لفظ توكيد لا يقابله تعبير مستقل صريح.
- source_word: τῆς ἀναστάσεως
  choice: فِي شِبْهِ قِيَامَتِهِ
  rationale: أُعيد المحذوف المفهوم من الشطر الأول لسلامة العربية ووضوح التوازي، وأُعيد الضمير لأن المقصود في السياق قيامة المسيح.
- source_word: ἐσόμεθα
  choice: فَسَنَكُونُ أَيْضًا مُتَّحِدِينَ مَعَهُ
  rationale: الفعل يعني حرفيًا «سنكون»، لكن خبره مفهوم من «متحدين» في الشطر الأول؛ لذلك أُظهر في المتن لتكتمل الجملة العربية.
theological_decisions:
- issue: كيفية التعبير عن الاتحاد بالمسيح وعلاقته بـ«شبه» موته وقيامته
  choice: الإبقاء على «متحدين معه في شبه موته ... في شبه قيامته»
  alternative: «نامين معه في شبه موته»، أو «مشتركين معه في موته وقيامته»
  rationale: يحفظ النص حقيقة المشاركة مع المسيح، وفي الوقت نفسه يبقي قيد «الشبه» حاضرًا، فلا يحوّل العبارة إلى شرح أسراري أو صوفي أو مجازي محدد.
- issue: هل يصرح الشطر الثاني بالاتحاد والشبه مع أن اليونانية تحذفهما
  choice: إظهار «متحدين معه في شبه» في المتن مع توضيح الإضمار في الحاشية
  alternative: «فسنكون أيضًا من القيامة»
  rationale: الإظهار ضروري لوضوح العربية، لكن الحاشية تحفظ البنية الموجزة والأكثر التباسًا في الأصل اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «شبه» للمحافظة على اللفظ البولسي والتوتر بين المشاركة الحقيقية وعدم المطابقة، وأُظهر المحذوف في الشطر الثاني لتكون العبارة طبيعية ومفهومة.
