  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: ar
  text: فأيَّ ثمرٍ كان لكم حينئذٍ من الأمور التي تخجلون منها الآن؟ فإن نهاية تلك الأمور هي الموت[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عاقبة» بدلًا من «نهاية».
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: فأيَّ
  rationale: تفتتح سؤالًا بلاغيًا عن الثمر الناتج، وتحافظ على قوة الاستفهام في العربية.
- source_word: καρπὸν
  choice: ثمرٍ
  rationale: يحفظ استعارة بولس بدل تسطيحها إلى «فائدة» أو «نتيجة».
- source_word: εἴχετε
  choice: كان لكم
  rationale: تعبير عربي طبيعي عن حالتهم السابقة، ويلائم دلالة الماضي الناقص في السياق.
- source_word: τότε
  choice: حينئذٍ
  rationale: يحافظ بوضوح على المقابلة الزمنية مع «الآن».
- source_word: ἐφ’ οἷς
  choice: من الأمور التي
  rationale: يُظهر المرجع المضمر بصورة طبيعية، ويعبّر عن كون الثمر ناشئًا من ممارساتهم السابقة.
- source_word: νῦν
  choice: الآن
  rationale: ينقل المقابلة الزمنية الحادة مع «حينئذٍ».
- source_word: ἐπαισχύνεσθε
  choice: تخجلون منها
  rationale: ينقل معنى الخزي الأخلاقي بعبارة عربية واضحة وأثقل من مجرد الإحراج.
- source_word: τέλος
  choice: نهاية
  rationale: تحفظ معنى المنتهى مع إمكان فهم العاقبة أو الحصيلة من السياق.
- source_word: ἐκείνων
  choice: تلك الأمور
  rationale: يوضح المرجع إلى الأمور المذكورة في السؤال السابق.
- source_word: θάνατος
  choice: الموت
  rationale: الترجمة المباشرة المألوفة التي تحفظ الثقل اللاهوتي للتحذير.
theological_decisions:
- issue: هل تُترجم τέλος بمعنى «النهاية» أم تفسيرًا بمعنى «العاقبة»؟
  choice: النهاية
  alternative: العاقبة
  rationale: «النهاية» تحفظ اتساع اللفظة بين المنتهى والحصيلة، من غير حسم التوتر الدلالي تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة؛ حُفظت استعارة «الثمر» والمقابلة بين «حينئذٍ» و«الآن»، مع تجنب الصياغة المذهبية أو التفسير الزائد.
