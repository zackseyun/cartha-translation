id: ROM.6.13
reference: Romans 6:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: ar
  text: ولا تُقَدِّموا أعضاءكم للخطيئة أسلحةً للإثم[a]، بل قَدِّموا أنفسكم لله كأحياءٍ من بين الأموات، وأعضاءكم لله أسلحةً للبرّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أدواتٍ للإثم». فاللفظ اليوناني قد يدل على الأسلحة أو الأدوات.
    reason: lexical_alternative
  - marker: b
    text: أو «للعدل».
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: تُقَدِّموا / قَدِّموا
  rationale: يحافظ هذا الاختيار على تكرار الفعل اليوناني وعلى المقابلة بين وضع الأعضاء تحت تصرّف الخطيئة وتقديم النفس لله.
- source_word: μέλη
  choice: أعضاءكم
  rationale: هو المقابل العربي الطبيعي لأجزاء الجسد، ويحافظ على الاستعمال البولسي دون شرح زائد.
- source_word: ὅπλα
  choice: أسلحةً
  rationale: يحفظ صورة الصراع الكامنة في اللفظ اليوناني، مع إثبات البديل الأوسع «أدوات» في الحاشية.
- source_word: ἀδικίας
  choice: للإثم
  rationale: ينقل المعنى الأخلاقي في السياق ويقيم مقابلة عربية واضحة مع «البرّ»، من غير حصر اللفظ في الظلم الاجتماعي وحده.
- source_word: ἁμαρτίᾳ
  choice: للخطيئة
  rationale: ترجمة مباشرة تُبقي تشخيص الخطيئة بوصفها قوةً تطالب بولاء الإنسان من غير إضافة تفسيرية.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: كأحياءٍ من بين الأموات
  rationale: يحفظ قوة التشبيه في ὡσεὶ والتباين بين الموت والحياة، كما ينقل ἐκ بصياغة «من بين» دون تحويل العبارة إلى مبني للمجهول.
- source_word: δικαιοσύνης
  choice: للبرّ
  rationale: «البرّ» هو اللفظ العربي المألوف في هذا السياق البولسي، ويحافظ على البعد الأخلاقي واللاهوتي؛ وأُثبت «العدل» بديلاً ممكنًا في الحاشية.
theological_decisions:
- issue: المقابلة بين الخطيئة والله بوصفهما جهتين متنافستين على ولاء الإنسان
  choice: 'الإبقاء على العلاقتين المباشرتين: «للخطيئة» و«لله»'
  alternative: في خدمة الخطيئة ... في خدمة الله
  rationale: تفيد صيغتا الداتيف في اليونانية الاتجاه ووضع الذات تحت التصرّف، لكن إضافة «في خدمة» تحسم الصورة تفسيرياً؛ لذلك حُفظ التركيب المباشر.
- issue: دلالة عبارة ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: كأحياءٍ من بين الأموات
  alternative: كأنكم أُحييتم من بين الأموات
  rationale: الصياغة المختارة لا تحوّل اسم الفاعل «أحياء» إلى فعل مبني للمجهول، وتُبقي العبارة محتملة لدلالة الحياة الجديدة ذات الأفق القيامي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تكرار «تُقَدِّموا/قَدِّموا» و«أعضاءكم» و«لله» لإبراز البناء المتوازي في الأصل، واستُخدم «الإثم/البرّ» لتكوين مقابلة طبيعية ومفهومة.
