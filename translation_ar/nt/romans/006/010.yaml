  terminology: «الخطية» و«الله» مناسبان للسجل الكتابي العربي، و«للخطية/لله» يحفظان المقابلة الدلالية دون نسبة خطية شخصية إلى المسيح. تُبقي الحاشية البدائل التفسيرية دون ترجيح مذهبي.
