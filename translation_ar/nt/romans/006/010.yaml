  source_fidelity: ينقل النص بوضوح التعليل في γάρ، والتقابل بين الموت «للخطية» والحياة «لله»، ومعنى ἐφάπαξ بوصفه فعلًا واحدًا غير متكرر. غير أن «مرةً واحدةً نهائية» تركيب غير طبيعي في العربية الحديثة، كما أن شرح الحاشية يصف الصيغة اليونانية وصفًا نحويًا غير دقيق.
