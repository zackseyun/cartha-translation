base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: ar
  text: لأن موته كان للخطية مرة واحدة لا تتكرر؛ أما حياته، فيحياها لله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن الخطية»، أو «من أجل الخطية»، أو «من جهة الخطية».'
    reason: صيغة الداتيف اليونانية تحتمل هنا دلالة العلاقة أو المرجع، وتُفهم في بعض الترجمات بمعنى «من أجل»؛ لذا تُذكر البدائل دون حسم زائد.
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: لأن الموت الذي ماته
  rationale: الضمير الموصول المحايد مع تكرار فعل الموت تعبير اصطلاحي يشير إلى واقعة موته؛ وهذه الصياغة العربية تحفظ التوكيد والتوازي، وتُظهر أن γάρ يعلّل ما سبق.
- source_word: τῇ ἁμαρτίᾳ
  choice: للخطية
  rationale: تحفظ اللام دلالة العلاقة أو التوجّه في صيغة موجزة، وتبقي المقابلة مع «لله» من غير أن تحسم هل المعنى «عن الخطية» أم «من أجل الخطية».
- source_word: ἐφάπαξ
  choice: مرةً واحدةً نهائية
  rationale: تنقل وقوع الفعل مرة واحدة وعدم تكراره مع أثر حاسم، بلغة عربية واضحة وطبيعية.
- source_word: ὃ δὲ ζῇ
  choice: وأما الحياة التي يحياها
  rationale: تحفظ البنية الموازية للشطر الأول، وتعبّر طبيعيًا عن الاستعمال الاصطلاحي للموصول المحايد.
- source_word: τῷ θεῷ
  choice: لله
  rationale: تحفظ المقابلة اللفظية والدلالية مع «للخطية»، وتفيد أن حياته متجهة إلى الله ومتعلقة به.
theological_decisions:
- issue: هل تُفهم τῇ ἁμαρτίᾳ على أنها «عن الخطية» أم «من أجل الخطية» أم «من جهة الخطية»؟
  choice: للخطية
  alternative: عن الخطية؛ من أجل الخطية؛ من جهة الخطية
  rationale: الصياغة المختارة تحافظ على غموض المجرور باليونانية وعلى المقابلة مع «لله»، ولا توحي بأن للمسيح خطية شخصية ولا تفرض تفسيرًا كفاريًا بعينه داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين الموت والحياة وبين «للخطية» و«لله»، مع وضع علامة الحاشية [a] في المتن.
