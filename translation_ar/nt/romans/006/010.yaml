revisions:
- from: لأن الموت الذي ماته، ماته للخطية[a] مرةً واحدةً نهائية؛ وأما الحياة التي يحياها، فيحياها لله.
  to: لأن موته كان للخطية مرة واحدة لا تتكرر؛ أما حياته، فيحياها لله.[a]
  rationale: استُبدل التركيب غير الطبيعي «مرة واحدة نهائية» بتعبير عربي واضح ينقل عدم تكرار الفعل، وخُفف التكرار الذي لا يلزم في العربية مع صون التوازي والمعنى. كما صُحح الوصف النحوي في الحاشية من «المجرور» إلى «الداتيف»، وحُفظ موضع علامة الحاشية عند «لله» بوصفها تغطي المقابلة الدلالية في الشطرين.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:43Z'
