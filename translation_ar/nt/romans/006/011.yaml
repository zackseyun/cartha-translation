id: ROM.6.11
reference: Romans 6:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: ar
  text: وهكذا أنتم أيضًا، احسبوا أنفسكم أمواتًا عن الخطيئة، ولكن أحياءً لله في المسيح يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «اعتبروا أنفسكم» أو «عُدّوا أنفسكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: وهكذا ... أيضًا
  rationale: يحفظ الصلة الاستنتاجية بما سبق، بصياغة عربية طبيعية.
- source_word: λογίζεσθε
  choice: احسبوا
  rationale: ينقل معنى عُدّوا الأمر واقعًا واعتبروه كذلك، ويحافظ على القوة الذهنية أو الحسابية للفعل.
- source_word: ἑαυτοὺς εἶναι
  choice: أنفسكم
  rationale: تؤدي العربية بهذا التركيب معنى «أنفسكم أن تكونوا» من غير إثقال غير طبيعي، مع إبقاء الضمير الانعكاسي صريحًا.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: أمواتًا عن الخطيئة
  rationale: «عن» تعبير عربي واضح عن انقطاع الصلة أو الاستجابة للخطيئة، والمقابلة اللاحقة تؤدي قوة μέν ... δέ.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: ولكن أحياءً لله
  rationale: يحفظ التضاد المباشر بين «أمواتًا» و«أحياءً»، ويؤدي دلالة التوجّه أو العلاقة بالله من غير توسع تفسيري.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: يبقي حرف الجر «في» حفاظًا على لغة بولس المميزة من غير حصرها في معنى الوسيلة أو العلة، ويترجم Χριστός بلقبه العربي الراسخ «المسيح».
theological_decisions:
- issue: دلالة ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  alternative: بالمسيح يسوع / بسبب المسيح يسوع
  rationale: إبقاء «في» يصون غموض العلاقة المقصود واتساعها في التعبير البولسي، بدل تفسيرها مسبقًا على أنها وسيلة أو علة.
- issue: صيغة Χριστῷ بوصفها لقبًا
  choice: المسيح
  alternative: مسيّا
  rationale: «المسيح» هو المقابل العربي الواضح والراسخ للقب Χριστός، ويحفظ قوة اللقب في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التقابل المتوازن بين «أمواتًا عن الخطيئة» و«أحياءً لله»، كما حُفظت عبارة «في المسيح يسوع» بلا شرح مذهبي زائد.
