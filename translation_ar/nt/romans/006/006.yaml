  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: ar
  text: عالمين أن إنساننا العتيق قد صُلِب معه، لكي يُعطَّل جسد الخطية[a]، فلا نعود مستعبَدين للخطية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي يُلغى جسد الخطية» أو «لكي يُجعَل جسد الخطية بلا فاعلية».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فلا نعود نخدم الخطية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: عالمين هذا
  rationale: يحافظ على صيغة اسم الفاعل اليونانية وعلى صلتها بما سبق، من غير تحويلها صراحةً إلى جملة سببية.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: إنساننا العتيق
  rationale: ينقل الصورة الأنثروبولوجية البولسية بصياغة عربية مفهومة، ولا يحصر المقصود في الذكور كما قد يوحي لفظ «رجل».
- source_word: συνεσταυρώθη
  choice: قد صُلب معه
  rationale: يُظهر معنى السابقة συν-، أي الاشتراك في الصلب، مع إبقاء مرجع الضمير كما هو مفهوم من السياق.
- source_word: καταργηθῇ
  choice: يُبطَل مفعول
  rationale: ينقل معنى تعطيل الفاعلية أو القوة دون الجزم بالإفناء أو الزوال الوجودي.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: جسد الخطية
  rationale: يحافظ على التركيب الإضافي المكثف ولا يحسم هل المقصود الجسد الخاضع للخطية أم الجسد المتصل بها على نحو آخر.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: فلا نعود مستعبَدين للخطية
  rationale: يحفظ صورة العبودية والسيادة التي يحملها δουλεύω، ويصل الغاية الثانية بالأولى في عربية طبيعية.
theological_decisions:
- issue: دلالة «الإنسان العتيق»
  choice: إنساننا العتيق
  alternative: ذاتنا القديمة
  rationale: الاختيار يحفظ صورة ἄνθρωπος بوصفها تعبيرًا عن الإنسان في حاله السابقة، بينما «الذات» أكثر تفسيرًا وتجريدًا.
- issue: قوة καταργηθῇ في صلتها بجسد الخطية
  choice: يُبطَل مفعول
  alternative: يُباد أو يُلغى
  rationale: العبارة المختارة تفيد تعطيل الفاعلية من غير فرض معنى الإبادة الكاملة الذي لا يلزم من الفعل هنا.
- issue: قوة δουλεύειν
  choice: مستعبَدين للخطية
  alternative: نخدم الخطية
  rationale: السياق قائم على سيادة الخطية، ولذلك تُحفظ صورة الاستعباد دون تحويلها إلى مجرد خدمة طوعية.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية رصينة. استُخدم «العتيق» للمقابلة اللاهوتية مع الجديد، و«الخطية» بوصفها الصيغة العربية الكتابية الشائعة. وُضعت علامتا الحاشية بعد العبارة النهائية لتجنب إثقال الجملة، مع اشتمال كل حاشية على البديل المتعلق بموضعها.
