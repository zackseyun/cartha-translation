  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: ar
  text: لِأَنَّ أُجْرَةَ الْخَطِيئَةِ هِيَ الْمَوْتُ، أَمَّا هِبَةُ اللهِ[a] فَهِيَ حَيَاةٌ أَبَدِيَّةٌ فِي الْمَسِيحِ يَسُوعَ رَبِّنَا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عَطِيَّةٌ كَرِيمَةٌ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بِوَاسِطَةِ الْمَسِيحِ يَسُوعَ رَبِّنَا»؛ غير أن «في» تحفظ بصورة أوضح التعبير البولسي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: أُجْرَة
  rationale: يدل اللفظ على ما يُدفع مقابل خدمة أو عمل. و«أجرة» تعبير عربي طبيعي يحفظ المقابلة بين ما تستحقه الخطية وما يهبه الله.
- source_word: ἁμαρτίας
  choice: الْخَطِيئَةِ
  rationale: تحفظ الإضافة اليونانية بإيجاز، فتُفهم الأجرة على أنها الأجرة التي تخص الخطية أو تدفعها.
- source_word: θάνατος
  choice: الْمَوْتُ
  rationale: ترجمة مباشرة لا تحصر مدلول الموت في تفسير لاهوتي واحد.
- source_word: χάρισμα
  choice: هِبَة
  rationale: تفيد العطية المعطاة بالنعمة، و«هبة» عربية واضحة وتبرز التضاد مع الأجرة المكتسبة.
- source_word: ζωὴ αἰώνιος
  choice: حَيَاةٌ أَبَدِيَّةٌ
  rationale: تنقل المعنى الزمني واللاهوتي للعبارة بصياغة عربية مألوفة ودقيقة.
- source_word: ἐν
  choice: فِي
  rationale: تحفظ دلالة المجال أو الاتحاد التي تتسم بها العبارة البولسية، من غير حصرها في معنى الوسيلة.
- source_word: Χριστῷ Ἰησοῦ
  choice: الْمَسِيحِ يَسُوعَ
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، وترتيب الاسمين يتبع الأصل.
- source_word: κυρίῳ
  choice: رَبِّنَا
  rationale: «الرب» يحفظ الاستعمال الاعترافي والوزن اللاهوتي للفظ κύριος.
theological_decisions:
- issue: دلالة ἐν Χριστῷ Ἰησοῦ
  choice: فِي الْمَسِيحِ يَسُوعَ
  alternative: بواسطة المسيح يسوع / من خلال المسيح يسوع
  rationale: تفيد «في» على الأرجح المجال أو الاتحاد بالمسيح، لكنها لا تلغي تمامًا إمكان فهم صلة الوسيلة؛ لذلك أُبقي التركيب في المتن وأُثبت البديل في الحاشية.
- issue: طبيعة الموت
  choice: الْمَوْتُ من دون تقييد
  alternative: الموت الروحي أو الأبدي
  rationale: النص اليوناني لا يضيف وصفًا للموت، فتقييده في المتن سيحسم توترًا لاهوتيًا لا يحسمه اللفظ نفسه.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. استُعملت «أجرة» و«هبة» لإظهار المقابلة بين الجزاء المكتسب والعطية، وأُبقي حرف الجر «في» حفاظًا على غموض الأصل اللاهوتي المشروع.
