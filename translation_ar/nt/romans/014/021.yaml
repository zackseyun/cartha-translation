source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: ar
  text: حَسَنٌ ألّا تأكل لحمًا، ولا تشرب خمرًا، ولا تفعل شيئًا يتعثّر بسببه أخوك، أو يُدفَع إلى السقوط، أو يضعف[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أيضًا، بمعنى أشمل بحسب السياق: «أخوك أو أختك»، أي مؤمن آخر.'
    reason: بديل معجمي يوضح أن «أخوك» قد تؤدي وظيفة تمثيلية في سياق جماعة المؤمنين.
lexical_decisions:
- source_word: καλὸν
  choice: حَسَنٌ
  rationale: يدلّ هنا على أن هذا المسلك صالح أخلاقيًا وجدير بالاتباع، و«حَسَنٌ» تعبير عربي موجز يحافظ على صيغة التقييم في اليونانية.
- source_word: τὸ μὴ φαγεῖν
  choice: ألّا تأكل
  rationale: ينقل المصدر المنفي إلى تركيب عربي طبيعي من غير تحويله إلى أمر مباشر.
- source_word: κρέα
  choice: لحمًا
  rationale: المراد اللحم بوصفه طعامًا في سياق الأكل، لا الجسد بمعناه الحرفي العام.
- source_word: μηδὲ πιεῖν οἶνον
  choice: ولا تشرب خمرًا
  rationale: تحافظ «ولا» على تراكم صور الامتناع، و«خمرًا» المقابل المباشر الطبيعي لـοἶνον.
- source_word: μηδὲ ἐν ᾧ
  choice: ولا تفعل شيئًا ... بسببه
  rationale: العبارة اليونانية موجزة وفيها فعل مقدّر؛ أُظهر في العربية بعبارة «تفعل شيئًا» لاستقامة المعنى، مع إبقاء علاقة السببية أو الوسيلة في «بسببه».
- source_word: ὁ ἀδελφός σου
  choice: أخوك
  rationale: يحافظ على المفرد المذكر في النص اليوناني، مع بيان شموله السياقي للمؤمن أو المؤمنة في الحاشية.
- source_word: προσκόπτει
  choice: يتعثّر
  rationale: يحفظ صورة الاصطدام أو التعثر المجازية التي تشير في السياق إلى العائق الأخلاقي أو الروحي.
- source_word: σκανδαλίζεται
  choice: يُدفَع إلى السقوط
  rationale: ينقل صيغة المبني للمجهول وفكرة التسبب في الوقوع، ويميّزه بقدر معقول عن προσκόπτει من غير حصره في مجرد الاستياء النفسي.
- source_word: ἀσθενεῖ
  choice: يضعف
  rationale: يحفظ عموم الفعل اليوناني، مع ترك السياق يبيّن أن المقصود ضعف الضمير أو الحالة الروحية والأخلاقية.
theological_decisions:
- issue: الدلالة التمثيلية لكلمة ἀδελφός
  choice: أخوك
  alternative: 'أخوك أو أختك؛ أو: المؤمن الآخر'
  rationale: النص اليوناني مفرد مذكر، لذلك حُفظ في المتن. لكن سياق خطاب الجماعة يرجّح أنه يشمل كل مؤمن، فذُكر ذلك في الحاشية دون تغيير الصيغة الأصلية.
- issue: العلاقة بين προσκόπτει وσκανδαλίζεται
  choice: يتعثّر ... أو يُدفَع إلى السقوط
  alternative: 'يتعثّر ... أو يُعثَر؛ أو: يتعثّر ... أو يستاء'
  rationale: للفعلين مجالان دلاليان متداخلان، لكن الثاني مبني للمجهول ويحمل معنى التسبب في الوقوع أو نصب العثرة. الصياغة المختارة تحافظ على التداخل والتمييز النسبي، وتتجنب اختزال σκανδαλίζεται في الانزعاج العاطفي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. حافظت الصياغة على بنية التقييم «حَسَنٌ ألّا...» وعلى التعداد الثلاثي في خاتمة الآية، مع إظهار الفعل المقدّر في العبارة اليونانية الموجزة لتكون الجملة طبيعية ومفهومة بالعربية.
