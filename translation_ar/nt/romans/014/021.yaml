  source_fidelity: 'النص العربي ينقل البنية الأساسية للنص اليوناني بأمانة: التقييم الأخلاقي في «حَسَنٌ»، والامتناع عن أكل اللحم وشرب الخمر، ثم الإتيان بالفعل المقدَّر في العبارة الأخيرة («ولا تفعل شيئًا»). كما يحافظ على التعداد الثلاثي: التعثّر، والدفع إلى السقوط، والضعف. وعبارة «يُدفَع إلى السقوط» تفسير عربي مشروع لصيغة σκανδαλίζεται المبنية للمجهول، من غير اختزالها إلى مجرد الاستياء.'
