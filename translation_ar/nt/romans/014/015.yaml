  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: ar
  text: فإن كان أخوك يحزن بسبب طعام، فأنت لم تعد تسلك بحسب المحبة. لا تُهلك بطعامك ذلك الذي مات المسيح لأجله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قد يُقصد بـ«أخوك» هنا أخٌ أو أختٌ في الإيمان. ويمكن ترجمة «لا تُهلك» أيضًا: «لا تُفسد» أو «لا تتسبب في هلاكه»؛ فالفعل اليوناني قوي، لكن الآية لا تحدد بدقة طبيعة الهلاك المقصود.'
    reason: lexical_alternative_and_theological_ambiguity
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: طعامك / بطعامك
  rationale: يدل اللفظ على الطعام عمومًا، لا على اللحم تحديدًا. أُضيف ضمير المخاطب في الموضع الأول لأن سبب حزن الأخ هو ما يأكله المخاطب في السياق، وحُفظت دلالة الوسيلة أو السبب في «بطعامك».
- source_word: ἀδελφός
  choice: أخوك
  rationale: يحفظ صيغة المذكر المفرد في اليونانية، ويمكن أن يأتي ممثلًا للمؤمن الشريك في الجماعة.
- source_word: λυπεῖται
  choice: يحزن
  rationale: ينقل معنى الألم أو الحزن من غير تحديد زائد لطبيعة الضرر.
- source_word: κατὰ ἀγάπην
  choice: بحسب المحبة
  rationale: صياغة قريبة من التركيب اليوناني وتحفظ المحبة معيارًا للسلوك.
- source_word: περιπατεῖς
  choice: تسلك
  rationale: يحفظ استعارة المشي الأخلاقية الشائعة عند بولس، وهي طبيعية في العربية الكتابية الواضحة.
- source_word: ἀπόλλυε
  choice: لا تُهلك
  rationale: يحفظ قوة التحذير، من غير حسم ما إذا كان المقصود خرابًا روحيًا شديدًا أم هلاكًا نهائيًا.
- source_word: ἐκεῖνον
  choice: ذلك الذي
  rationale: يحفظ توكيد اسم الإشارة ويربطه طبيعيًا بجملة الصلة التالية.
- source_word: ὑπὲρ οὗ
  choice: لأجله
  rationale: ينقل معنى «من أجله/نيابة عنه» في تركيب عربي موجز وطبيعي.
- source_word: Χριστός
  choice: المسيح
  rationale: اللفظ لقب ذو معنى مسياني، و«المسيح» هو المقابل العربي الطبيعي الراسخ.
- source_word: ἀπέθανεν
  choice: مات
  rationale: مقابل مباشر وطبيعي للفعل اليوناني.
- source_word: εἰ γὰρ
  choice: فإن كان
  rationale: يحفظ الصلة التفسيرية التي تفيدها γάρ والبنية الشرطية التي تفيدها εἰ.
theological_decisions:
- issue: قوة ἀπόλλυε وماهية الهلاك
  choice: لا تُهلك
  alternative: لا تُفسد / لا تتسبب في هلاكه
  rationale: الفعل شديد الدلالة، لكن الآية لا تحسم هل المراد ضرر روحي بالغ في الزمن الحاضر أم الهلاك النهائي؛ لذلك تُحفظ شدة التحذير والتوتر اللاهوتي بلا فرض تفسير مذهبي.
- issue: مرجع ἀδελφός
  choice: أخوك
  alternative: أخوك أو أختك / المؤمن الآخر
  rationale: النص اليوناني مذكر مفرد، فحُفظ في المتن، مع التنبيه إلى إمكان استعماله تمثيليًا لأحد المؤمنين.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: يعمل اللفظ هنا بوصفه لقبًا، و«المسيح» ينقل معناه في العربية بدل الاكتفاء بنقله الصوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت استعارة «السلوك» البولسية، واستُعمل «المسيح» بوصفه اللقب العربي الدال على Χριστός. جُمعت البدائل التفسيرية في حاشية واحدة لتجنب إثقال آية قصيرة.
