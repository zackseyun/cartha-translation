  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: ar
  text: أمّا الضعيف في الإيمان فاقبلوه[a]، لا لكي تتنازعوا بشأن الآراء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فرحّبوا به». يدل الفعل اليوناني على قبول الشخص في الصحبة أو الشركة.'
