    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: الضعيف
  rationale: اسم فاعل مضارع مع أداة التعريف، استُعمل استعمال الاسم. تنقل «الضعيف» المعنى بإيجاز من غير إضافة «في الضمير»، وهي غير مذكورة صراحة.
- source_word: τῇ πίστει
  choice: في الإيمان
  rationale: تفيد صيغة الداتيف المجال أو الناحية التي يظهر فيها الضعف. «الإيمان» أنسب من تخصيص العبارة بالعقيدة الموضوعية أو الأمانة.
- source_word: προσλαμβάνεσθε
  choice: فاقبلوه
  rationale: فعل أمر يفيد أخذ الشخص إلى المرء وقبوله في الصحبة والجماعة. «اقبلوه» طبيعي وشامل، مع بيان «رحّبوا به» في الحاشية.
- source_word: δὲ
  choice: أمّا... فـ
  rationale: أداة انتقال خفيفة إلى وصية جديدة، لا تستلزم تضادًا قويًا ولا معنى زمنيًا مثل «الآن».
- source_word: μὴ εἰς
  choice: لا لكي
  rationale: ينقل الغاية المرفوضة بوضوح في العربية المعاصرة.
- source_word: διακρίσεις
  choice: تتنازعوا
  rationale: يحمل السياق معنى الخلاف التقييمي أو الجدال، لا مجرد التمييز المحايد؛ وصيغة الفعل أكثر سلاسة في العربية.
- source_word: διαλογισμῶν
  choice: الآراء
  rationale: يشير إلى الأفكار أو الاستدلالات المختلف فيها. «الآراء» واضحة للقارئ، مع إبقاء الاحتمالات الأقرب إلى حرفية التركيب في الحاشية.
theological_decisions:
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: السياق يتناول ضعف المؤمن في قناعته بشأن ممارسات مختلف فيها. «الإيمان» يحفظ المصطلح من غير حصره في العقيدة المقررة أو تحويله إلى معنى الأمانة.
- issue: نطاق عبارة διακρίσεις διαλογισμῶν
  choice: التنازع في الآراء
  alternative: الحكم في الأفكار المختلف فيها؛ المشاجرة بشأن الاستدلالات
  rationale: التركيب اليوناني يحتمل خلافات بشأن الأفكار أو أحكامًا تمييزية عليها. اختير تعبير عربي واضح يحفظ البعد الجدلي، وأُثبتت البدائل في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل تركيب «أمّا... فـ» لنقل الانتقال الذي تؤديه δέ من غير إدخال معنى «الآن»، ووُضعت علامتا الحاشية عند اللفظين اللذين تشرحانهما.
