base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: ar
  text: 'لِأَنَّهُ مَكْتُوبٌ: «حَيٌّ أَنَا، يَقُولُ الرَّبُّ، إِنَّ كُلَّ رُكْبَةٍ سَتَنْحَنِي لِي، وَكُلَّ لِسَانٍ سَيَعْتَرِفُ لِلهِ[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «سيُقِرّ لله» أو «سيحمد الله»؛ فالفعل اليوناني قد يدل، بحسب السياق، على الاعتراف أو الإقرار أو الحمد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: مَكْتُوبٌ
  rationale: صيغة عربية مألوفة لإدخال اقتباس كتابي، وتحفظ دلالة الحالة الناتجة عن صيغة التمام المبني للمجهول.
- source_word: Ζῶ ἐγώ
  choice: حَيٌّ أَنَا
  rationale: تحفظ العبارة الإعلانية ذات القوة القَسَمية في الاقتباس الإلهي، من غير تحويلها إلى قسم عربي مضاف من خارج النص.
- source_word: κύριος
  choice: الرَّبُّ
  rationale: المقابل العربي المباشر للفظ اليوناني κύριος، مع إبقاء صيغة الاقتباس كما وردت في النص اليوناني.
- source_word: ἐμοὶ
  choice: لِي
  rationale: ينقل الداتيف نقلًا مباشرًا، ويحافظ على التوازي اللفظي مع «لله» في الشطر التالي.
- source_word: κάμψει πᾶν γόνυ
  choice: كُلَّ رُكْبَةٍ سَتَنْحَنِي
  rationale: تعبير عربي طبيعي يحفظ صورة الركبة وفعل الخضوع أو السجود دون تفكيك الاستعارة الجسدية.
- source_word: πᾶσα γλῶσσα
  choice: كُلَّ لِسَانٍ
  rationale: يحفظ الصورة المجازية والرنين الكتابي بدل استبدالها بتفسير مثل «كل إنسان».
- source_word: ἐξομολογήσεται
  choice: سَيَعْتَرِفُ
  rationale: يحفظ المعنى الأساسي للإقرار العلني، مع التنبيه في الحاشية إلى إمكان دلالته على الإقرار أو الحمد بحسب السياق.
- source_word: τῷ θεῷ
  choice: لِلهِ
  rationale: ينقل الداتيف صراحة، ويحفظ انتقال الصياغة من المتكلم «لي» إلى «لله» من غير تسوية.
theological_decisions:
- issue: العلاقة بين «الرَّبّ» و«الله» داخل الاقتباس
  choice: 'الإبقاء على الصياغة: «يقول الرب ... لي ... لله».'
  alternative: توحيد الضمائر بقول «سيعترف لي»، أو إدخال تفسير عقائدي صريح لهوية المتكلم في متن الترجمة.
  rationale: النص اليوناني نفسه ينتقل من قول الرب بضمير المتكلم «لي» إلى «لله». تُحفظ هذه الصياغة وما فيها من توتر لاهوتي من غير تنعيم أو حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية مهيبة. وُضع مؤشر الحاشية بعد «لله» لأنه يشرح الفعل «سيعترف» والعبارة المتصلة به، لا عبارة «حيّ أنا».
