  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: ar
  text: لا تهدم عمل الله من أجل طعام. كلّ الأشياء طاهرة حقًّا، لكنّه شرٌّ للإنسان الذي يأكل مُسبِّبًا عثرةً.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للإنسان الذي يأكل وهو يتعثّر». يحتمل التركيب اليوناني أيضًا معنى الأكل على نحوٍ يسبّب عثرةً لغيره.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: من أجل طعام
  rationale: تنقل ἕνεκεν مع المضاف إليه بوصفها دالة على الدافع أو السبب، وتحافظ على المفارقة بين أمر الطعام والضرر الواقع بسببه.
- source_word: κατάλυε
  choice: تهدم
  rationale: يحفظ صورة تفكيك ما يبنيه الله، وتلائم العربية صيغة النهي «لا تهدم».
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: عمل الله
  rationale: ترجمة مباشرة تحافظ على سعة العبارة، من غير حصرها في المؤمن الفرد أو الجماعة.
- source_word: πάντα μὲν καθαρά
  choice: كلّ الأشياء طاهرة حقًّا
  rationale: تحافظ على عموم πάντα وعلى لغة الطهارة في καθαρά، مع تمثيل خفيف لقوة μέν بكلمة «حقًّا»؛ والسياق يبيّن أن الحديث عن الأطعمة.
- source_word: κακὸν
  choice: شرّ
  rationale: يحفظ القوة الأخلاقية للكلمة، بدل تخفيفها إلى «خطأ» أو «سيئ».
- source_word: τῷ ἀνθρώπῳ
  choice: للإنسان
  rationale: «الإنسان» مفرد عام طبيعي في العربية، ويؤدي الدلالة التمثيلية للفظ ἄνθρωπος دون تقييدها بجنس بعينه.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: الأكل ... إذا كان سببًا في عثرة
  rationale: يصوغ التركيب اليوناني بوضوح عربي، مع إبقاء معنى πρόσκομμα وصورة العثرة؛ وتوضح الحاشية الاحتمال النحوي المتعلق بمن يتسبب في العثرة.
theological_decisions:
- issue: نطاق عبارة «كلّ الأشياء طاهرة» وصلتها بالأطعمة
  choice: الإبقاء على العموم اللفظي «كلّ الأشياء» مع لفظ «طاهرة»
  alternative: «كلّ الأطعمة طاهرة» أو «كلّ شيء مباح»
  rationale: النص اليوناني لا يذكر «الأطعمة» صراحة، وإن كان السياق يدل عليها؛ كما أن «طاهرة» تحفظ لغة الطهارة ولا تستبدل بها تفسيرًا فقهيًا مثل «مباحة».
- issue: دلالة διὰ προσκόμματος وعلاقتها بفعل الأكل
  choice: «إذا كان سببًا في عثرة»
  alternative: «إذا أكل مع تعثر ضميره» أو «إذا أكل بطريقة تجعل غيره يعثر»
  rationale: التركيب قابل لأن يُفهم من جهة الأكل المرتبط بعثرة، سواء أكانت عثرة الآكل نفسه أم ما يسببه لغيره؛ لذا يحافظ المتن على قدر من الانفتاح وتعرض الحاشية أبرز وجهَي الفهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «طاهرة» للمحافظة على لغة الطهارة، و«للإنسان» للدلالة العامة الطبيعية. وُضعت علامة الحاشية [a] في المتن كما هو مطلوب.
