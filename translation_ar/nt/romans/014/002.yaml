  - marker: b
    text: 'المقصود بـ«الضعيف» في السياق هو الضعيف في الإيمان، في ما يتصل بممارسات الطعام (انظر رومية 14: 1).'
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: أحدهم
  rationale: تقدّم الطرف الأول من المقابلة بصيغة مفردة تمثيلية، وهي صياغة عربية طبيعية لا تخصّ الذكور وحدهم.
- source_word: πιστεύει
  choice: يؤمن
  rationale: تحافظ على الصلة اللفظية بجذر الإيمان، مع كون المصدر التالي يبيّن أن المقصود هنا اعتقاد الشخص أو اقتناعه بشأن ما يجوز أكله.
- source_word: φαγεῖν πάντα
  choice: أن له أن يأكل كلَّ شيء
  rationale: تعبّر «أن له أن» عن معنى الإباحة المفهوم من سياق الخلاف حول الأطعمة، و«كل شيء» تقابل πάντα من غير تقييد.
- source_word: ὁ δὲ
  choice: أمّا ... فـ
  rationale: تنقل الطرف الثاني من تركيب المقابلة اليوناني بأسلوب عربي واضح وطبيعي.
- source_word: ἀσθενῶν
  choice: الضعيف
  rationale: اسم فاعل مستعمل استعمال الاسم، ويحفظ وصف بولس من غير إضافة «في الإيمان» داخل متن هذه الآية.
- source_word: λάχανα
  choice: الخضروات
  rationale: المقابل العربي المعاصر الواضح لمحاصيل البساتين أو الخضر، وهو أدق للقارئ الحديث من «البقول» أو «الأعشاب».
- source_word: ἐσθίει
  choice: يأكل
  rationale: ينقل الفعل كما هو من غير إضافة «فقط»، لأن الحصر مفهوم من المقابلة لكنه غير مصرّح به لفظًا.
theological_decisions:
- issue: طبيعة الضعف في ἀσθενῶν
  choice: الضعيف
  alternative: الضعيف في الإيمان
  rationale: تربط الآية السابقة الضعف بالإيمان وبالضمير تجاه ممارسات الطعام، لكن هذه الآية تقول فقط «الضعيف»؛ لذلك يُحفظ الإيجاز في المتن ويُشرح السياق في الحاشية.
- issue: دلالة πιστεύει مع المصدر
  choice: يؤمن أن له أن يأكل
  alternative: مقتنع بأنه يستطيع أن يأكل
  rationale: تحفظ الصياغة الصلة اللفظية بالإيمان، مع بيان أن الحديث عن قناعة تتعلق بالإباحة، لا عن الإيمان الخلاصي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل تركيب «أمّا ... فـ» لإظهار المقابلة، وحُفظت ألفاظ الآية الموجزة من غير إدخال الحصر أو تقييد الضعف في المتن.
