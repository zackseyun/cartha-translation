  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: ar
  text: يؤمن أحدهم بأن له أن يأكل كلَّ شيء[a]، أمّا الضعيف[b] فيأكل الخضروات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقتنع بأنه يستطيع أن يأكل كلَّ شيء».'
