  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: ar
  text: لأننا إن عشنا، فللرب نعيش، وإن متنا، فللرب نموت. إذن، سواء عشنا أم متنا، فنحن للرب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ننتمي إلى الرب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: لأننا إن
  rationale: حُفظت γάρ تعليليةً بلفظ «لأن»، وصيغ الشرط بـ«إن» على نحو عربي طبيعي، مع إبقاء الصلة بالحجة السابقة.
- source_word: ζῶμεν / ζῶμεν
  choice: عشنا / نعيش
  rationale: فُرّق عربيًا بين فعل الشرط وجوابه بما يلائم الفصحى، مع الحفاظ على معنى ζάω المتكرر.
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: اللام العربية تحتمل جهة العلاقة والتوجّه والمنفعة، فتحفظ سعة دلالة المجرور اليوناني من غير قصرها على الخدمة وحدها.
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب اللاهوتي كما هو، ولا يصرّح بمرجعه أكثر مما يصرّح النص.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: متنا / نموت
  rationale: نُقل الفعل بمعناه المباشر، وصيغ الشرط والجواب وفق الأسلوب العربي الطبيعي.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تفيد هنا النتيجة والاستنتاج بإيجاز طبيعي في العربية.
- source_word: τοῦ κυρίου ἐσμέν
  choice: نحن للرب
  rationale: يحفظ التركيب الموجز معنى الاختصاص والانتماء، من غير أن يضيف فعلًا تفسيريًا إلى المتن.
theological_decisions:
- issue: مرجع κύριος وقوته في الآية
  choice: إبقاء «الرب» لقبًا بلا زيادة تفسيرية
  alternative: التصريح بـ«الرب يسوع» أو استعمال «السيد»
  rationale: يشير السياق القريب إلى المسيح، لكن النص هنا يقول «الرب»؛ وإبقاء اللقب يصون دلالته السياقية واللاهوتية من غير إفراط في التحديد.
- issue: دلالة العيش والموت τῷ κυρίῳ
  choice: «للرب» بما تحتمله من علاقة وتوجّه ومنفعة
  alternative: «من أجل الرب» أو «تحت سلطان الرب»
  rationale: لا ينبغي حصر المجرور اليوناني في غرض الخدمة أو السلطان فقط؛ والعبارة الختامية تؤكد الانتماء مع إبقاء الدلالة الأوسع.
- issue: قوة τοῦ κυρίου ἐσμέν
  choice: «نحن للرب»
  alternative: «نحن ملك للرب» أو «ننتمي إلى الرب»
  rationale: التركيب المختار يحفظ إيجاز الأصل وقوة الاختصاص، فيما تشرح الحاشية البديل الأوضح دلاليًا.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقّرة. استُعمل التوازي «إن عشنا... وإن متنا» وحُفظ تكرار «للرب» لإبراز بنية الأصل. وُضعت علامة الحاشية [a] بعد العبارة التي تشرحها مباشرة.
