source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: ar
  text: لأن ملكوت الله ليس أكلًا وشربًا، بل برٌّ[a] وسلامٌ وفرحٌ في الروح القدس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عدلٌ». يمكن للكلمة اليونانية أن تدل على البر أو العدل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: «ملكوت الله» تعبير عربي كتابي راسخ وطبيعي، ويحفظ سعة معنى βασιλεία الذي قد يدل على المُلك أو السلطان أو نطاقه.
- source_word: βρῶσις καὶ πόσις
  choice: أكلًا وشربًا
  rationale: يحافظ على التوازي بين اسمي النشاط في اليونانية، ويلائم سياق الممارسات المختلف عليها بشأن الطعام والشراب.
- source_word: δικαιοσύνη
  choice: برٌّ
  rationale: «البر» هو المقابل العربي المألوف في الاستعمال البولسي، ويشمل الاستقامة أمام الله وفي السلوك، مع إثبات «العدل» بوصفه احتمالًا دلاليًّا في الحاشية.
- source_word: εἰρήνη
  choice: سلامٌ
  rationale: مقابل واضح يحفظ معنى السلام والوئام، ولا سيما في السياق الجماعي للرسالة.
- source_word: χαρά
  choice: فرحٌ
  rationale: مقابل عربي طبيعي ومباشر للفظ اليوناني.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: في الروح القدس
  rationale: يحفظ حرف الجر «في» وما يتيحه من دلالة على المجال أو الوساطة، ويفهم العبارة وفق الاستعمال البولسي على أنها إشارة إلى الروح القدس.
- source_word: γάρ
  choice: لأن
  rationale: يوضح أن الآية تعليل لما سبق، وهو ربط طبيعي في العربية.
theological_decisions:
- issue: دلالة δικαιοσύνη في هذا الموضع البولسي
  choice: برٌّ
  alternative: عدلٌ
  rationale: يحافظ «البر» على الاستعمال اللاهوتي والأخلاقي الواسع للكلمة في رسائل بولس، بينما تثبت الحاشية إمكان معنى «العدل» دون حصر اللفظ في أحد وجهيه.
- issue: مرجع πνεύματι ἁγίῳ
  choice: الروح القدس
  alternative: روحٍ مقدسة
  rationale: غياب أداة التعريف في اليونانية لا يوجب معنى غير شخصي؛ والاستعمال البولسي والسياق يرجحان الإشارة إلى الروح القدس، مع إبقاء حرف الجر دون تفسيره تفسيرًا أداتيًّا محضًا.
translation_notes:
  register: 'صياغة عربية فصحى حديثة، واضحة ومهيبة، تحافظ على بنية المقابلة اليونانية: «ليس... بل...»، وعلى التوازي الإيقاعي بين «أكلًا وشربًا» و«برّ وسلام وفرح».'
