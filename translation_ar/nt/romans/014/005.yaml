  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: ar
  text: يَعُدُّ أحدُهم يومًا أفضلَ من يومٍ آخر[a]، في حين يَعُدُّ آخرُ الأيامَ كلَّها سواءً[b]. فليكن كلُّ واحدٍ مقتنعًا تمامًا في ذهنه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يميّز أحدُهم يومًا عن يوم»، أو: «يعتبر أحدُهم يومًا أهمَّ من يوم آخر».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «كلَّ يوم»؛ والمفهوم من المقابلة: أن الأيام عنده سواء.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «على يقين تام»، أو: «مطمئنًا تمامًا إلى رأيه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: يَعُدُّ
  rationale: يدل الفعل هنا على إصدار تقدير وتمييز تقويمي، لا على الإدانة. و«يَعُدُّ» عربية طبيعية تؤدي معنى الاعتبار في كلا شطري المقابلة.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: يومًا أفضلَ من يومٍ آخر
  rationale: تُظهر الصياغة قوة المقارنة في παρά من غير أن تحدد ماهية الأيام أو تجعلها أعيادًا أو سبوتًا.
- source_word: πᾶσαν ἡμέραν
  choice: كلَّ يومٍ سواءً
  rationale: '«سواءً» توضح المقابلة المضمرة: الشخص الآخر لا يميز يومًا عن سائر الأيام، مع التنبيه في الحاشية إلى أن اللفظ اليوناني حرفيًا هو «كل يوم».'
- source_word: ἕκαστος
  choice: كلُّ واحدٍ
  rationale: تحافظ العبارة على الإفراد والتوزيع في اليونانية، وهي واضحة وشائعة في العربية الفصحى المعاصرة.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: في ذهنه
  rationale: تنقل νοῦς بمعناه المباشر، أي الذهن أو الفكر، وتحافظ على الضمير المفرد ذي الدلالة التمثيلية العامة.
- source_word: πληροφορείσθω
  choice: فليكن ... مقتنعًا تمامًا
  rationale: تنقل صيغة الأمر ومعنى الاقتناع الراسخ أو اليقين الكامل بلغة عربية طبيعية.
theological_decisions:
- issue: ماهية الأيام المقصودة
  choice: إبقاء الإشارة عامة إلى «يوم» من غير تحديد
  alternative: تفسيرها بالسبوت أو الأعياد اليهودية أو أيام الصوم والتعبد الخاصة
  rationale: لا يحدد بولس في هذه الآية نوع الأيام؛ لذلك يحفظ النص عمومية العبارة ولا يحسم مسألة تفسيرية تركتها الآية مفتوحة.
- issue: دلالة اعتبار «كل يوم»
  choice: إظهار معنى المساواة بين الأيام من خلال المقابلة
  alternative: الاكتفاء بالصياغة الحرفية «يَعُدُّ كل يوم»
  rationale: المساواة ليست لفظًا مستقلًا في اليونانية، لكنها مفهومة من المقابلة مع تفضيل يوم على آخر؛ وقد حُفظ اللفظ الحرفي في الحاشية.
- issue: صيغة المفرد المذكر
  choice: «كل واحد ... في ذهنه» بدلالة تمثيلية عامة
  alternative: استعمال صياغة جمع أو صياغة محايدة تُبعد النص عن بنيته الإفرادية
  rationale: تحافظ الصياغة على المفرد المذكر في الأصل، مع كون الدلالة بحسب السياق شاملة لكل شخص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «يَعُدُّ» بمعنى «يعتبر» لا بمعنى الإحصاء، وحُفظ التوازي بين شطري الجملة. لم يُدخل النص تحديدًا مذهبيًا لطبيعة الأيام، وأُبقيت بدائل الألفاظ ذات الشأن التفسيري في الحواشي.
