source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: ar
  text: فلا نَعُدْ إذن نحكم بعضنا على بعض، بل قرروا بالأحرى ألّا تضعوا أمام الأخ[a] حجر عثرة أو سببًا للسقوط[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمام الأخ أو الأخت»؛ يقول اليوناني «الأخ» بالمفرد، والمقصود هنا المؤمن الآخر.
    reason: alternative_reading
  - marker: b
    text: أي ما يوقع الآخر في الخطيئة أو التعثر الروحي، لا مجرد ما يسيء إلى مشاعره؛ ويمكن أيضًا ترجمته «فخًّا» أو «سببًا للوقوع».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: فلا نَعُدْ، إذن
  rationale: ينقل معنى الكفّ عن ممارسة مستمرة، ويحفظ الاستنتاج الذي تفيده οὖν مع صياغة عربية حثّية طبيعية.
- source_word: ἀλλήλους κρίνωμεν
  choice: نحكم بعضنا على بعض
  rationale: يحفظ صيغة الحث الجماعي والمعنى الأساسي للفعل κρίνω، كما يهيئ للتكرار البلاغي للفعل نفسه في العبارة التالية.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: بل احكموا بالأحرى بهذا
  rationale: 'يحافظ على تكرار جذر الحكم في اليونانية وعلى التحول المقصود: بدل الحكم على الآخرين، يصدر المؤمن حكمًا يوجّه سلوكه هو. وتبقى صيغة المخاطب الجمع كما في المصدر.'
- source_word: τὸ μὴ τιθέναι
  choice: ألّا تضعوا
  rationale: يعبّر عن مضمون الحكم أو القرار، مع إبقاء صورة الوضع الواردة في الفعل اليوناني.
- source_word: πρόσκομμα
  choice: حجر عثرة
  rationale: تعبير عربي واضح يحفظ الصورة المجازية لشيء يعوق الآخر ويجعله يتعثر.
- source_word: τῷ ἀδελφῷ
  choice: أمام الأخ
  rationale: ينقل صيغة المفرد المذكر في النص اليوناني، مع بيان دلالته السياقية العامة في الحاشية.
- source_word: σκάνδαλον
  choice: سببًا للسقوط
  rationale: يوضح أن المقصود ما يوقع الآخر في الخطيئة أو التعثر الروحي، لا مجرد ما يجرح مشاعره، مع المحافظة على صورة السقوط الكامنة في السياق.
theological_decisions:
- issue: دلالة ἀδελφῷ بصيغة المفرد المذكر
  choice: الأخ
  alternative: الأخ أو الأخت؛ المؤمن الآخر
  rationale: أُبقيت الصيغة النحوية للمصدر في المتن، فيما توضّح الحاشية أن الاستعمال هنا يشمل المؤمن الآخر عمومًا.
- issue: القوة الأخلاقية والروحية للفظ σκάνδαλον
  choice: سببًا للسقوط
  alternative: عثرة؛ فخًّا؛ سببًا للوقوع في الخطيئة
  rationale: هذه الصياغة تمنع فهم اللفظ بمعنى مجرد الإساءة إلى المشاعر، وتبقي المقصود الأخلاقي دون حصر كيفية السقوط أكثر مما يسمح به النص.
- issue: التكرار البلاغي للفعل κρίνω
  choice: نحكم... احكموا
  alternative: ندين... قرّروا
  rationale: 'يحفظ التوتر البلاغي في الأصل: النهي عن نوع من الحكم، ثم الأمر بنوع آخر منه موجّه إلى سلوك المرء نفسه، بدل إزالة هذا التلاعب اللفظي بالتفسير.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التكرار البلاغي لجذر «حكم»، وصيغة الانتقال من المتكلم الجمع «نَعُدْ/نحكم» إلى المخاطب الجمع «احكموا/تضعوا» كما في اليونانية. وُضعت علامتا الحاشيتين عقب الجملة لأن الأولى تخص «الأخ» والثانية تخص «سببًا للسقوط».
