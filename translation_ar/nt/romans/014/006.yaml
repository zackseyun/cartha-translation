  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: ar
  text: مَن يراعي اليوم[a] يراعيه للرب. ومَن يأكل يأكل للرب، لأنه يشكر الله؛ ومَن لا يأكل لا يأكل للرب، ويشكر الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يعتبر اليوم» أو «يفكر في اليوم»؛ فالفعل اليوناني قد يدل على توجيه الفكر أو الاعتبار إلى شيء. ويرجح هنا أن المقصود مراعاة يوم بعينه.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: يراعي / يراعيه
  rationale: يفيد الفعل هنا توجيه الاهتمام والاعتبار إلى اليوم بما يظهر في الممارسة، لا مجرد التفكير الذهني فيه. واختيار «يراعي» يحفظ هذا المعنى من غير أن يحدد نوع المراعاة.
- source_word: τὴν ἡμέραν
  choice: ذلك اليوم
  rationale: أداة التعريف تشير إلى اليوم موضع الحديث في السياق. و«ذلك اليوم» عربية طبيعية تحافظ على التعيين من غير تحديده بأنه سبت أو عيد أو يوم صوم.
- source_word: κυρίῳ
  choice: للرب
  rationale: تفيد صيغة المجرور اليونانية جهة الفعل وغايته؛ و«للرب» موجزة وطبيعية، وتحفظ تكرار العبارة وتوازيها.
- source_word: ἐσθίων / ἐσθίει
  choice: يأكل / يأكل
  rationale: صيغة المضارع تصف ممارسة عامة أو معتادة في المسألة المختلف عليها، ولذلك يناسبها المضارع العربي البسيط.
- source_word: εὐχαριστεῖ
  choice: يشكر
  rationale: ينقل الفعل الصريح الموجَّه إلى الله بعبارة عربية طبيعية واضحة، دون تحويله إلى مجرد شعور بالامتنان.
- source_word: τῷ θεῷ
  choice: الله
  rationale: الفعل «يشكر» يتعدى مباشرة في العربية، فتؤدي عبارة «يشكر الله» معنى المجرور اليوناني بوضوح وطبيعية.
- source_word: ὁ μὴ ἐσθίων
  choice: مَن لا يأكل
  rationale: يحفظ البناء المنفي والتوازي المباشر مع «مَن يأكل»، من غير إضافة مفعول غير مذكور أو تفسير الامتناع.
theological_decisions:
- issue: معنى مراعاة «اليوم»
  choice: إشارة عامة إلى إيلاء يوم بعينه اعتبارًا خاصًا في المسألة المختلف عليها في رومية 14.
  alternative: تحديده بأنه السبت، أو أحد الأعياد اليهودية، أو يوم صوم.
  rationale: صياغة بولس عامة، ولا يحدد النص نوع اليوم؛ لذلك تُحفظ سعة العبارة ولا يُدخل فيها تفسير طائفي أو تاريخي أضيق.
- issue: مرجع κύριος
  choice: الرب
  alternative: الله
  rationale: يُبقي النص لقب «الرب» كما ورد، ولا يدمجه مع ذكر «الله» الصريح في فعل الشكر، وبذلك يحفظ التمييز اللفظي والتوتر اللاهوتي في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حُفظ التوازي بين مَن يأكل ومَن لا يأكل، كما حُفظ عموم الإشارة إلى اليوم وعدم تحديد نوع الطعام أو سبب الامتناع.
