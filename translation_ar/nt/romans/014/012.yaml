  text: So then[a], each of us will give an account of himself.
translation:
  language: ar
  text: إذًا، سيقدِّم كلُّ واحدٍ منا حسابًا عن نفسه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بشأن نفسه» أو «لنفسه». واليونانية حرفيًا: «فيما يخص نفسه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: إذًا
  rationale: تفيد الاستنتاج مما سبق، و«إذًا» واضحة وطبيعية في العربية المعاصرة.
- source_word: ἕκαστος ἡμῶν
  choice: كلُّ واحدٍ منا
  rationale: تحفظ القوة التوزيعية لـἕκαστος مع ضمير الجمع في ἡμῶν.
- source_word: περὶ ἑαυτοῦ
  choice: عن نفسه
  rationale: تنقل المعنى المباشر لـπερί مع المضاف إليه، أي «بشأن نفسه/عن نفسه»، بصياغة عربية طبيعية.
- source_word: λόγον δώσει
  choice: سيقدِّم حسابًا
  rationale: تعاملت مع العبارة بوصفها تعبيرًا اصطلاحيًا يعني تقديم حساب أو بيان للمساءلة، لا مجرد إعطاء «كلمة».
theological_decisions:
- issue: المفرد المذكر في العبارة التمثيلية
  choice: عن نفسه
  alternative: عن ذواتهم / عن نفسه أمام الله
  rationale: يحافظ «عن نفسه» على الصيغة التوزيعية المفردة في اليونانية، وهي عامة التطبيق على كل شخص. ولم تُضف عبارة «أمام الله» لأنها غير واردة في نص هذه الآية بحسب SBLGNT، مع أنها مفهومة من السياق السابق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «سيقدِّم حسابًا» بدل «سيعطي حسابًا» لأنه أكثر طبيعية في العربية ويحفظ دلالة المساءلة، مع إبقاء «عن نفسه» لتجنّب حسم الصلة الدلالية بأكثر مما يسمح به الأصل.
