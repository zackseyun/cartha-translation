base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: ar
  text: أمّا الإيمان الذي لك[a]، فاحتفظ به لنفسك أمام الله. طوبى لمن لا يحكم على نفسه بما يستحسنه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمّا القناعة التي لك، فاحتفظ بها لنفسك أمام الله». يمكن أن يدل «الإيمان» هنا على قناعة شخصية بشأن المسائل المختلف فيها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا يدين نفسه بما يقرّه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: الإيمان
  rationale: يحافظ على المقابل العربي المعتاد للمصطلح، مع أن السياق يدل هنا على قناعة شخصية بشأن المسائل المختلف فيها؛ لذلك أُثبت هذا المعنى البديل في الحاشية.
- source_word: κατὰ σεαυτὸν ἔχε
  choice: فاحتفظ به لنفسك
  rationale: صياغة عربية طبيعية تفيد أن يحتفظ المرء بهذه القناعة لنفسه وألا يفرضها على غيره.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: يحفظ معنى الحضور والمساءلة أمام الله، من غير دمجه دلاليًا في العبارة السابقة.
- source_word: μακάριος
  choice: طوبى لمن
  rationale: تعبير عربي كتابي واضح يحفظ البعد الأخلاقي واللاهوتي للكلمة، لا مجرد الشعور بالسعادة.
- source_word: κρίνων ἑαυτὸν
  choice: يدين نفسه
  rationale: مع أن κρίνω قد تعني «يحكم على»، فالسياق يرجح الحكم المؤدي إلى الإدانة الذاتية؛ وهذه الصياغة أوضح بالعربية.
- source_word: ἐν ᾧ δοκιμάζει
  choice: بما يستحسنه
  rationale: يفيد δοκιμάζω هنا الاستحسان أو الإقرار بعد التمييز، وتحفظ الباء المعنى الأداتي المحتمل لـἐν.
theological_decisions:
- issue: دلالة πίστις في سياق المسائل المختلف فيها
  choice: الإيمان، بمعنى يتضمن القناعة الشخصية أمام الله في المسألة المعنية
  alternative: القناعة
  rationale: السياق يتناول الممارسات المختلف فيها والضمير، لكنه لا يقتضي استبدال المصطلح اللاهوتي الرئيس؛ لذا حُفظ «الإيمان» في المتن وذُكر «القناعة» في الحاشية.
- issue: دلالة κρίνων ἑαυτὸν
  choice: يدين نفسه
  alternative: يحكم على نفسه
  rationale: السياق يشير إلى لوم الضمير والإدانة الناشئة من مخالفة ما يراه المرء مقبولًا، مع بقاء البديل الأعم ممكنًا لغويًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ الفصل بين «لنفسك» و«أمام الله»، واستُعملت «طوبى لمن» لصياغة طبيعية راسخة.
