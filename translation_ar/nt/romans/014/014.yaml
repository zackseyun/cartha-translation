source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: ar
  text: أَعْلَمُ، وَأَنَا مُوقِنٌ فِي الرَّبِّ يَسُوعَ، أَنَّهُ لَيْسَ شَيْءٌ نَجِسًا فِي ذَاتِهِ؛ إِلَّا أَنَّ مَنْ يَعُدُّ شَيْئًا نَجِسًا[a]، فَذَلِكَ الشَّيْءُ نَجِسٌ لَهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عَامًّا». فاللفظ اليوناني يعني حرفيًّا «عامًّا» أو «مشتركًا»، ويشير هنا عادةً إلى ما يُعَدّ مُدنَّسًا طقسيًّا أو غير مقدس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: أَعْلَمُ
  rationale: مقابل عربي مباشر وطبيعي للفعل الدال على المعرفة.
- source_word: πέπεισμαι
  choice: وَأَنَا مُوقِنٌ
  rationale: صيغة التمام اليونانية تفيد قناعة راسخة ومستقرة؛ و«موقن» تؤدي هذا المعنى بوضوح وفصاحة.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: فِي الرَّبِّ يَسُوعَ
  rationale: يحافظ على حرف الجر وعلى احتمال دلالته العلاقية أو السلطانية دون حصره في معنى «بواسطة».
- source_word: κοινόν
  choice: نَجِسًا
  rationale: يدل اللفظ في سياق الطهارة على ما يُعَدّ دنسًا أو غير طاهر، لا على مجرد الشيء المشترك أو العادي؛ ويُذكر البديل الحرفي في الحاشية.
- source_word: δι’ ἑαυτοῦ
  choice: فِي ذَاتِهِ
  rationale: تعبير عربي طبيعي يبين أن الحديث عن صفة الشيء الجوهرية لا عن أثر خارجي.
- source_word: τῷ λογιζομένῳ
  choice: مَنْ يَعُدُّ
  rationale: ينقل معنى اعتبار الشيء والحكم عليه بأنه على حال معينة، مع صياغة عربية موجزة.
- source_word: τι
  choice: شَيْئًا
  rationale: نكرة تلائم صياغة المبدأ العام في العربية.
- source_word: ἐκείνῳ κοινόν
  choice: فَهُوَ نَجِسٌ لَهُ
  rationale: 'يحفظ قوة ضمير الإشارة والتطبيق الشخصي: النجاسة قائمة بالنسبة إلى من يراه كذلك.'
theological_decisions:
- issue: دلالة κοινός في سياق الطعام والطهارة
  choice: نَجِس
  alternative: عَامّ أو مُشْتَرَك؛ ودَنِس أو غَيْر طَاهِر
  rationale: المقصود السياقي ما يُعَدّ مدنسًا أو غير صالح بحسب أحكام الطهارة، مع تأكيد بولس أنه ليس كذلك في ذاته. وتحفظ الحاشية المعنى الحرفي والتاريخي للفظ.
- issue: دلالة ἐν في عبارة ἐν κυρίῳ Ἰησοῦ
  choice: فِي الرَّبِّ يَسُوعَ
  alternative: بِالرَّبِّ يَسُوعَ أو بِسُلْطَانِ الرَّبِّ يَسُوعَ
  rationale: الإبقاء على «في» يصون اتساع العبارة اليونانية ولا يحسم إن كانت القناعة ناشئة عن الاتحاد بالرب أو عن سلطانه وتعليمه.
- issue: طبيعة النجاسة بالنسبة إلى الضمير
  choice: فَهُوَ نَجِسٌ لَهُ
  alternative: فَهُوَ يَعُدُّهُ نَجِسًا
  rationale: النص اليوناني يصرح بأنه «نجس له»، لا بمجرد أنه يراه كذلك؛ لذلك حُفظ التوتر بين عدم النجاسة الذاتية وبين واقعها للشخص بحسب اعتقاده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «موقن» للتعبير عن القناعة الراسخة، و«في ذاته» لصياغة طبيعية، مع الحفاظ على التكرار المقصود لكلمة «نجس» وعلى الغموض الدلالي في «في الرب يسوع».
