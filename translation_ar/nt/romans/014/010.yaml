source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: ar
  text: أما أنت، فلماذا تدين أخاك[a]؟ أو أنت أيضًا، لماذا تحتقر أخاك؟ فإننا جميعًا سنقف أمام كرسي قضاء الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أخاك أو أختك»؛ واليونانية حرفيًا: «أخاك».'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات: «كرسي قضاء المسيح».'
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: أما أنت
  rationale: تحفظ أداة الاستدراك والتوكيد الناتج من تقديم الضمير، بصياغة عربية طبيعية.
- source_word: τί κρίνεις
  choice: فلماذا تدين
  rationale: تؤدي τί في السؤال الإنكاري بمعنى «لماذا»، وتحفظ معنى κρίνω المتعلق بإصدار الحكم من غير تضييقه إلى الإدانة النهائية.
- source_word: τὸν ἀδελφόν σου
  choice: أخاك
  rationale: تنقل الاسم اليوناني المفرد المذكر مباشرة، مع بيان إمكان شموله للأخت في الحاشية.
- source_word: ἢ καὶ σὺ
  choice: وأنت أيضًا
  rationale: تحفظ توكيد المخاطب والقوة الإضافية لـ καί بصياغة عربية سلسة؛ وتؤدي الواو هنا الانتقال إلى السؤال المقابل.
- source_word: τί ἐξουθενεῖς
  choice: لماذا تحتقر
  rationale: «تحتقر» تعبر بإيجاز عن معاملة الآخر كأنه بلا قيمة أو النظر إليه باستخفاف.
- source_word: πάντες γὰρ
  choice: فإننا جميعًا
  rationale: الفاء مع «إن» تنقل التعليل الذي تفيده γάρ، وضمير الجمع يحفظ شمول بولس ومخاطبيه.
- source_word: παραστησόμεθα
  choice: سنقف أمام
  rationale: تحفظ صورة المثول واقفين أمام جهة قضائية، وهي طبيعية وواضحة بالعربية.
- source_word: τῷ βήματι
  choice: كرسي قضاء
  rationale: تنقل الصورة القضائية لـ βῆμα، أي المقعد أو المنصة التي يصدر منها الحكم، بلغة مفهومة من غير استبدال الصورة بكلمة عامة مثل «المحكمة».
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: تنقل قراءة النص اليوناني المعطى «لله» مباشرة في تركيب الإضافة العربي.
theological_decisions:
- issue: هوية صاحب كرسي القضاء الذي سيمثل أمامه الجميع
  choice: كرسي قضاء الله
  alternative: كرسي قضاء المسيح
  rationale: النص المعتمد في SBLGNT يقرأ τοῦ θεοῦ، لذلك أُثبتت «الله» في المتن. وحُفظت قراءة «المسيح» الواردة في بعض المخطوطات في الحاشية، من غير مواءمة صامتة مع 2 كورنثوس 5:10.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أما أنت» لإبراز المواجهة الخطابية، و«كرسي قضاء» للحفاظ على الصورة القضائية من غير اللجوء إلى مصطلح غامض أو مذهبي. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلق بهما الملاحظتان.
