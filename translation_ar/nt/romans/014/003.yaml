base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: ar
  text: لا يَحتقِرِ الذي يأكلُ الذي لا يأكل، ولا يَحكُمِ الذي لا يأكلُ على الذي يأكل، لأن الله قد قبله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استقبله» أو «رحّب به»؛ فالفعل يحمل أيضًا معنى ضمّه إلى الشركة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: الذي يأكل
  rationale: يحافظ على وظيفة اسم الفاعل المعرّف بوصفه دالًا على شخص يتميز بهذا الفعل، بصياغة عربية طبيعية.
- source_word: τὸν μὴ ἐσθίοντα
  choice: الذي لا يأكل
  rationale: ينقل المقابلة اللفظية مباشرة من غير أن يضيف تحديدًا لنوع الطعام أو سبب الامتناع.
- source_word: ἐξουθενείτω
  choice: لا يَحتقِرْ
  rationale: الفعل يدل على عدّ الآخر قليل الشأن أو معاملته بازدراء؛ و«يحتقر» موجز ويحفظ قوة النهي.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: ولا يَدِنِ الذي لا يأكل
  rationale: أُعيد ترتيب العبارة في العربية بتقديم فعل النهي، مع إبقاء المقابلة المتبادلة بين الطرفين؛ والواو ملائمة لتوازي النهيين.
- source_word: κρινέτω
  choice: لا يَدِنْ
  rationale: «يدين» هنا ينقل معنى إصدار حكم على الآخر، من غير تضييق المعنى إلى الإدانة القضائية النهائية.
- source_word: γὰρ
  choice: لأن
  rationale: تُظهر بوضوح أن قبول الله هو علة النهيين.
- source_word: αὐτὸν
  choice: ـه
  rationale: يحفظ ضمير المفرد المذكر كما في اليونانية، من غير حسم زائد لهويّة مرجعه ضمن الحجة المتبادلة.
- source_word: προσελάβετο
  choice: قد قبله
  rationale: الفعل يدل على قبول الشخص واستقباله في الشركة؛ و«قبله» طبيعية وموجزة، مع بيان البعد الترحيبي في الحاشية.
theological_decisions:
- issue: نطاق المقابلة بين الأكل وعدم الأكل
  choice: 'الإبقاء على التعبير العام: «يأكل» و«لا يأكل».'
  alternative: التصريح بأنه يأكل كل الأطعمة أو يمتنع عن أطعمة معينة.
  rationale: الآية نفسها لا تحدد نوع الطعام ولا سبب الامتناع، لذلك لا تُستورد تفاصيل السياق إلى متنها.
- issue: مرجع الضمير في «قبله»
  choice: الإبقاء على ضمير المفرد المذكر من غير تفسير داخل المتن.
  alternative: استبداله بـ«ذلك الشخص» أو قصره صراحة على الذي يأكل.
  rationale: أقرب مذكور هو الذي يأكل، لكن الحجة المتبادلة أوسع دلالة؛ والإبقاء على الضمير يصون هذا التوتر النصي.
- issue: دلالة قبول الله
  choice: «قبله» مع حاشية تبين إمكان معنى الاستقبال والترحيب في الشركة.
  alternative: «رحّب به» في المتن.
  rationale: «قبله» يحافظ على سعة الفعل اليوناني، بينما توضح الحاشية بعده العلاقي من غير قصره عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم أسلوب النهي بالمضارع المجزوم، مع الحفاظ على التوازي بين الطرفين وعلى عمومية الأكل وعدم الأكل. تظهر علامة الحاشية [a] في المتن.
