  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: ar
  text: مَن أنت حتى تدين عبدًا من عبيد بيت غيرك؟ إنه يثبت أو يسقط أمام سيده هو[a]، وسيُثبَّت[b]، لأن الرب قادر أن يثبِّته[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: إن ثباته أو سقوطه أمرٌ يرجع إلى سيده هو، لا إلى شخص آخر يدينُه.'
    reason: clarification
  - marker: b
    text: 'أو: «سيثبت». والفعل في اليونانية مبني للمجهول، بما يبرز أن آخر هو الذي يثبِّته.'
    reason: translation_alternative
  - marker: c
    text: يمكن أن تُفهم «الرب» هنا بمعنى «سيده» ضمن صورة العبد، لكن الأرجح أن بولس يشير إلى الرب بالمعنى اللاهوتي.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: مَن أنت حتى تدين
  rationale: صياغة استفهامية توبيخية طبيعية في العربية، تحفظ توكيد الضمير ووظيفة اسم الفاعل اليوناني دون تكلّف.
- source_word: ἀλλότριον οἰκέτην
  choice: عبدًا منزليًّا لغيرك
  rationale: تحفظ «عبدًا» واقع التبعية الاجتماعية الذي قد يدل عليه οἰκέτης، وتوضح «منزليًّا» أنه من خدم البيت، بينما تنقل «لغيرك» علاقة الانتماء إلى شخص آخر.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: أمام سيده هو
  rationale: «أمام» تعبّر طبيعيًّا عن جهة المساءلة التي يفيدها الداتيف هنا، و«هو» تؤكد خصوصية سيده دون أن توحي بأن المخاطَب صاحب الحكم.
- source_word: στήκει ἢ πίπτει
  choice: يثبت أو يسقط
  rationale: تحفظ المقابلة والاستعارة اللفظية، كما تتيح إبقاء الصلة بالفعلين اللاحقين من جذر الثبات.
- source_word: σταθήσεται
  choice: سيُثبَّت
  rationale: المبني للمجهول يحفظ صيغة المستقبل المبني للمجهول والإيحاء بفاعل مُثبِّت، الذي تصرّح به الجملة التالية.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: لأن الرب قادر أن يثبِّته
  rationale: تنقل γάρ تعليلًا، وتحفظ قدرة الرب والعلاقة اللفظية بين الثبات والتثبيت.
theological_decisions:
- issue: مرجع ὁ κύριος في العبارة الأخيرة
  choice: الرب، بالمعنى اللاهوتي المرجح
  alternative: سيده البشري ضمن صورة العبد المنزلي
  rationale: وجود أداة التعريف والاستعمال البولسي وسياق قدرة من يضمن ثبات المؤمن ترجّح الإشارة إلى الرب؛ ومع ذلك تُذكر القراءة الأخرى في الحاشية لأن امتداد صورة السيد والعبد يجعل قدرًا من الالتباس حقيقيًّا.
- issue: دلالة الوقوف والسقوط
  choice: الإبقاء على استعارة «يثبت أو يسقط»
  alternative: التفسير الصريح بالقبول أو الإدانة
  rationale: النص لا يصرّح بطبيعة الثبات والسقوط، ولذلك لا تُحسم دلالتهما القضائية أو الروحية بإضافة تفسير داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «عبد منزلي» بدل «خادم» للمحافظة على علاقة التبعية التي قد يحملها اللفظ اليوناني، مع تجنّب تعبيرات عربية قديمة غامضة. حُفظ تكرار جذر «ثبت» لإظهار الترابط البلاغي في الأصل.
