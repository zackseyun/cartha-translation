  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: ar
  text: لأنَّ مَن يخدم المسيح بهذه الطريقة يكون مرضيًّا عند الله ومقبولًا لدى الناس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذه الطريقة
  rationale: تفيد العبارة، في سياق الكلام السابق، الكيفية أو النهج الذي به يخدم المرء المسيح، مع الإبقاء على إحالتها السياقية.
- source_word: δουλεύων τῷ Χριστῷ
  choice: يخدم المسيح
  rationale: ينقل فعل δουλεύω هنا بمعناه الديني، أي تكريس الخدمة والطاعة للمسيح، بصياغة عربية طبيعية.
- source_word: εὐάρεστος τῷ θεῷ
  choice: مرضيًّا عند الله
  rationale: تعبير عربي واضح يحفظ معنى نيل الرضا والقبول الإلهي.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: مقبولًا لدى الناس
  rationale: δόκιμος يدل على مَن ثبتت جدارته فنال الاستحسان أو القبول؛ و«الناس» تنقل ἀνθρώποις هنا على نحو عام غير مقصور على الذكور.
theological_decisions:
- issue: مرجع ἐν τούτῳ
  choice: بهذه الطريقة
  alternative: في هذا
  rationale: الترجمة المختارة تربط العبارة بنمط الحياة الموصوف في السياق، لكنها لا تحدد عنصرًا عقائديًا واحدًا تحديدًا قاطعًا.
- issue: مدى قبول الناس للخادم
  choice: مقبولًا لدى الناس
  alternative: مُزكًّى من الناس
  rationale: العبارة تصف الاستحسان الإنساني الناتج من السلوك المختبَر، ولا تُفهم على أنها وعد بقبول كل إنسان له بلا استثناء.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع موازاة موجزة بين «مرضيًّا عند الله» و«مقبولًا لدى الناس».
