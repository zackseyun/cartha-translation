  text: إذن، لا تدعوا خيرَكم يُذَمّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُشتم» أو «يُفترى عليه». يدل الفعل اليوناني على كلام مسيء أو تشهيري؛ أما «يُجدَّف عليه» فأقرب حرفيًا، لكنه قد يوحي في العربية بأن المقصود إساءة دينية على وجه الخصوص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... βλασφημείσθω
  choice: فلا تدعوا ... يُذَمّ
  rationale: تفيد μή مع فعل الأمر المبني للمجهول نهيًا. وهذه الصياغة العربية تنقل قوة النهي والمبني للمجهول بوضوح، من غير استعمال «يُجدَّف عليه» التي قد توحي في العربية بسياق ديني أضيق.
- source_word: οὖν
  choice: إذن
  rationale: تفيد نتيجة مترتبة على الحجة السابقة، و«إذن» تحفظ هذا الربط الاستنتاجي في عربية معاصرة واضحة.
- source_word: ὑμῶν
  choice: لكم
  rationale: الضمير في صيغة المضاف إليه يبيّن اختصاص الخير بالمخاطَبين أو ارتباطه بهم؛ و«لكم» تؤدي ذلك طبيعيًا.
- source_word: τὸ ἀγαθόν
  choice: ما هو خيرٌ لكم
  rationale: الصفة المحايدة المعرّفة مستعملة استعمال الاسم، أي «الخير». والصياغة المختارة تحفظ سعة المرجع ولا تحصره في الحرية أو الامتياز.
theological_decisions:
- issue: مرجع «ما هو خيرٌ لكم» (τὸ ἀγαθόν)
  choice: الإبقاء على التعبير عامًا من غير تحديد مرجعه
  alternative: حريتكم؛ امتيازكم؛ تعليمكم أو شهادتكم الحسنة
  rationale: عبارة بولس موجزة، ويمكن أن تشمل الخير المرتبط بقناعة المؤمنين وحريتهم في المسائل المختلف فيها. تعيينها بالحرية أو الامتياز يضيّق ما تركه النص اليوناني مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل جمع المخاطبين في «تدعوا»، وحُفظ إيجاز العبارة واتساع مدلول «الخير» مع تجنب المصطلح الديني الأضيق «التجديف» في المتن.
