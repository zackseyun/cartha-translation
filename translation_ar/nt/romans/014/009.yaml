  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: ar
  text: فلأجل هذا مات المسيح وعاش من جديد[a]، لكي يسود على الأموات والأحياء كليهما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «عاش»؛ أو بصورة أوضح: «عاد إلى الحياة». يدل السياق على حياته بعد الموت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: فلأجل هذا
  rationale: ينقل معنى الغاية المقصودة في العبارة اليونانية، ويرتبط طبيعيًا بأداة التعليل γάρ.
- source_word: γὰρ
  choice: فـ
  rationale: الفاء التعليلية موجزة وطبيعية في العربية، وتصل الحجة بما قبلها.
- source_word: Χριστὸς
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته اللقبية.
- source_word: ἀπέθανεν
  choice: مات
  rationale: نقل مباشر ودقيق للفعل اليوناني دون توسع.
- source_word: ἔζησεν
  choice: عاش من جديد
  rationale: الفعل في ذاته يعني «عاش»، لكن اقترانه بـ«مات» يدل في السياق على الحياة بعد الموت. أضيفت حاشية تحفظ الصياغة الحرفية والبديل الأوضح.
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر بوضوح وطبيعية عن الغاية التي تقدمها أداة ἵνα.
- source_word: κυριεύσῃ
  choice: يسود على
  rationale: يحفظ الفعل معنى ممارسة السيادة والسلطان، من غير تحويله إلى لقب اسمي.
- source_word: νεκρῶν καὶ ζώντων
  choice: الأموات والأحياء كليهما
  rationale: يحفظ التضاد الاسمي بين الفئتين، وتؤكد «كليهما» شمول الاثنين الذي تدل عليه καὶ...καὶ.
theological_decisions:
- issue: دلالة ἔζησεν على القيامة
  choice: عاش من جديد
  alternative: 'عاش؛ أو: عاد إلى الحياة'
  rationale: السياق، إذ يقرن الموت بالحياة ثم يذكر السيادة على الأموات والأحياء، يرجح الحياة بعد الموت. ومع ذلك تحفظ الحاشية أن اللفظ اليوناني نفسه يقول «عاش» ولا يصرّح بفعل «قام».
- issue: دلالة κυριεύσῃ المسيحانية
  choice: يسود على
  alternative: يكون ربًّا على
  rationale: الصياغة الفعلية تقابل الفعل اليوناني مباشرة وتحفظ معنى السلطان، دون أن تحسمه في صيغة لقبية اسمية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فلأجل هذا» لبيان الغاية مع التعليل، و«يسود على» لنقل السلطان بصيغة فعلية طبيعية.
