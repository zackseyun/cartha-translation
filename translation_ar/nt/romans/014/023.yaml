- from: أَمَّا مَنْ يَشُكُّ، فَإِنْ أَكَلَ يُدَانُ، لِأَنَّهُ لَا يَأْكُلُ عَنْ إِيمَانٍ؛ وَكُلُّ مَا لَا يَصْدُرُ عَنْ إِيمَانٍ فَهُوَ خَطِيئَةٌ.[a]
  to: أَمَّا مَنْ يَشُكُّ، فَإِنْ أَكَلَ فَهُوَ مُدَانٌ، لِأَنَّ أَكْلَهُ لَا يَصْدُرُ عَنْ إِيمَانٍ؛ وَكُلُّ مَا لَا يَصْدُرُ عَنْ إِيمَانٍ فَهُوَ خَطِيئَةٌ.[a]
  rationale: استُبدلت «يُدان» بـ«فهو مُدان» لتمثيل حالة الإدانة الناتجة عن κατακέκριται مع إبقاء الفاعل غير مذكور. واستُبدلت «لأنه لا يأكل عن إيمان» بـ«لأن أكله لا يصدر عن إيمان» لتوضيح أن سبب الإدانة هو الأكل الذي لا يصدر عن إيمان، بصياغة عربية فصيحة طبيعية. أُبقيت الحاشية وعلامتها، لأنها تشرح العبارة الختامية ذاتها وتحفظ الدلالة السياقية المحتملة لـπίστις من دون استبدال المصطلح في المتن.
