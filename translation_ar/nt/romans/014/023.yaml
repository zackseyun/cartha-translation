  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: ar
  text: أَمَّا مَنْ يَشُكُّ، فَإِنْ أَكَلَ فَهُوَ مُدَانٌ، لِأَنَّ أَكْلَهُ لَا يَصْدُرُ عَنْ إِيمَانٍ؛ وَكُلُّ مَا لَا يَصْدُرُ عَنْ إِيمَانٍ فَهُوَ خَطِيئَةٌ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكل ما لا يصدر عن اقتناع راسخ فهو خطيئة». يقول اليوناني حرفيًا: «عن إيمان»، وقد يشمل هنا معنى التصرّف وفق اقتناع ثابت أمام الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: مَنْ يَشُكُّ
  rationale: يدل السياق على التردد الداخلي بشأن الأكل، لا على مجادلة الآخرين. وهذه صياغة عربية واضحة تحفظ معنى الشك.
- source_word: ἐὰν φάγῃ
  choice: فَإِنْ أَكَلَ
  rationale: تحفظ أداة الشرط والقوة الاحتمالية الطبيعية للتركيب اليوناني.
- source_word: κατακέκριται
  choice: يُدَانُ
  rationale: تنقل حالة الإدانة الناتجة عن الفعل من غير تعيين فاعل الإدانة، كما في المبني للمجهول اليوناني.
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: لِأَنَّهُ لَا يَأْكُلُ عَنْ إِيمَانٍ
  rationale: أُعيد فعل الأكل المضمَر في اليونانية لتستقيم العربية، مع إبقاء πίστις بمعنى «إيمان» وعدم حصره في الاقتناع الذاتي.
- source_word: πᾶν ... ὃ
  choice: كُلُّ مَا
  rationale: مقابل عربي طبيعي وشامل للتركيب الموصول المحايد.
- source_word: ἁμαρτία ἐστίν
  choice: فَهُوَ خَطِيئَةٌ
  rationale: يحفظ صيغة الاسم الخبرية وقوة تقرير بولس، بدل تخفيفها إلى وصف مثل «خاطئ».
theological_decisions:
- issue: دلالة πίστις في سياق أخلاقي بولسي
  choice: إيمان
  alternative: اقتناع راسخ أمام الله
  rationale: يحفظ لفظ «الإيمان» اتساع المصطلح البولسي، في حين تبيّن الحاشية أن السياق قد يتضمن التصرف وفق اقتناع ثابت أمام الله.
- issue: نطاق الإدانة في κατακέκριται
  choice: يُدَانُ
  alternative: يحكم على نفسه / يُدان أمام الله
  rationale: لا يعيّن المبني للمجهول اليوناني جهة الإدانة؛ لذلك لا تحدد الترجمة هل المقصود حكم الله أو الضمير أو كليهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «عن إيمان» للمحافظة على صورة ἐκ πίστεως، مع إضافة فعل الأكل في الجملة السببية لسلامة الأسلوب العربي. وُضعت علامة الحاشية بعد الجملة التي تشرحها.
