  terminology: «إيمان» مقابل مناسب لـ πίστις، و«خطيئة» يحافظ على قوة ἁμαρτία ἐστίν. و«مُدان» يحفظ المبني للمجهول دون تعيين جهة الإدانة، مع تمثيل أفضل للحالة الناتجة التي يدل عليها الفعل اليوناني التام.
