  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: ar
  text: فلنسعَ إذن إلى ما يحقّق السلام وما يُسهم في بناء بعضنا بعضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «فلنسعَ إذن إلى أمور السلام وأمور البناء لبعضنا بعضًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: إذن
  rationale: تفيد الأداتان معًا استخلاص نتيجة مما سبق، و«إذن» تؤدي هذا المعنى بوضوح وطبيعية في العربية.
- source_word: τὰ τῆς εἰρήνης
  choice: ما يحقّق السلام
  rationale: التركيب اليوناني المحايد الجمعي يشير إلى الأمور التي تخص السلام أو تقود إليه؛ وهذه الصياغة واضحة وتحفظ المعنى العملي.
- source_word: διώκωμεν
  choice: فلنسعَ
  rationale: صيغة الحث في اليونانية تدعو الجماعة إلى عمل مستمر وجاد؛ و«فلنسعَ» طبيعية وتحمل قوة الطلب دون مبالغة.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: ما يبني
  rationale: تحفظ «يبني» استعارة البناء المستعملة عن التقوية والنمو، وتتجنب المصطلحات الكنسية الثقيلة.
- source_word: τῆς εἰς ἀλλήλους
  choice: بعضنا بعضًا
  rationale: تنقل بوضوح التبادلية داخل الجماعة، مع صياغة عربية طبيعية تجعل أفرادها فاعلين في بناء بعضهم بعضًا.
theological_decisions:
- issue: نطاق البناء الجماعي
  choice: تحث الآية المؤمنين جماعيًا على السعي إلى السلام وبناء بعضهم بعضًا.
  alternative: قصر الكلام على التحسن الأخلاقي الفردي وحده.
  rationale: صيغة المتكلم الجمع وعبارة التبادل ἀλλήλους تؤكدان الحياة المشتركة، ولا سيما في سياق الخلافات المتعلقة بالضمير في رومية 14.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. وُضع «إذن» بعد فعل الحث على نحو طبيعي، وحُفظت استعارة البناء مع إبراز المعنى المتبادل.
