  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: ar
  text: فَلَا أَحَدَ مِنَّا يَحْيَا لِنَفْسِهِ، وَلَا أَحَدَ يَمُوتُ لِنَفْسِهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى نفسه». يمكن نقل ضمير الانعكاس في صيغة الداتيف اليونانية بهذه الصورة الحرفية، لكن المقصود هنا على الأرجح أن الإنسان لا يجعل نفسه الغاية النهائية لحياته أو موته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: لا أحد
  rationale: تؤدي النفي العام بوضوح، وتلائم التوازي بين الجملتين.
- source_word: γὰρ
  choice: فَـ
  rationale: تحفظ وظيفة الأداة في تعليل الكلام السابق وشرحه دون إثقال العبارة.
- source_word: ἡμῶν
  choice: منّا
  rationale: تنقل تركيب المضاف إليه التبعي مع «لا أحد» بصياغة عربية طبيعية.
- source_word: ἑαυτῷ
  choice: لنفسه
  rationale: تحفظ دلالة ضمير الانعكاس في المجرور، وتفيد أن الإنسان ليس هو الغاية أو المرجع النهائي لحياته وموته، من غير إضافة تفسير عقائدي إلى المتن.
- source_word: ζῇ
  choice: يحيا
  rationale: المضارع مناسب للحقيقة العامة، ويحافظ على المقابلة الأسلوبية مع «يموت».
- source_word: καὶ
  choice: وَ
  rationale: تربط الجملتين المتوازيتين ربطًا مباشرًا كما في اليونانية.
- source_word: ἀποθνῄσκει
  choice: يموت
  rationale: المضارع ينقل القول العام، ويقابل «يحيا» بوضوح.
theological_decisions:
- issue: دلالة ἑαυτῷ في الجملتين
  choice: لنفسه
  alternative: إلى نفسه؛ لأجل نفسه
  rationale: السياق اللاحق يبيّن توجّه الحياة والموت إلى الرب، ولذلك تنقل «لنفسه» معنى المرجع أو الغاية مع إبقاء سعة الدلالة وعدم تحميل النص شرحًا مذهبيًا.
- issue: صيغة ضمير الانعكاس المفرد المذكر
  choice: نفسه
  alternative: ذاته؛ أنفسنا
  rationale: تحافظ الصيغة العربية المفردة المذكرة على بنية اليونانية واستعمالها العام، بينما يبقى «منّا» شاملًا للمتكلمين جميعًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «يحيا» بدل «يعيش» للمحافظة على التوازي المألوف مع «يموت»، ووُضعت علامة الحاشية بعد الجملة لأنها تشرح «لنفسه» في كلا الموضعين.
