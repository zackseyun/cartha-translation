source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: ar
  text: احفظوا أنفسكم في محبة الله[a]، منتظرين رحمة ربنا يسوع المسيح، إلى الحياة الأبدية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُفهم «محبة الله» بمعنى محبة الله لكم، أو محبتكم لله.
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «للحياة الأبدية»؛ فحرف الجر اليوناني يدل هنا على الغاية أو الاتجاه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: احفظوا أنفسكم
  rationale: فعل أمر مباشر بصيغة الجمع، وهذه العبارة تنقل معنى المواظبة على البقاء من غير أن تضيف وسيلة غير مذكورة.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: في محبة الله
  rationale: 'صياغة طبيعية تحافظ على غموض المضاف إليه في اليونانية: أهي محبة الله للناس أم محبتهم لله.'
- source_word: προσδεχόμενοι
  choice: منتظرين
  rationale: اسم فاعل حالي يصف موقفًا مستمرًا مصاحبًا للأمر، وفيه معنى الترقب والانتظار.
- source_word: τὸ ἔλεος
  choice: رحمة
  rationale: المقابل العربي المألوف الذي ينقل معنى الرأفة والعطاء غير المستحق.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ربنا
  rationale: ينقل κύριος بلقب «الرب» ويحافظ على ضمير الجماعة.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός، لا مجرد نقل صوتي له.
- source_word: εἰς ζωὴν αἰώνιον
  choice: إلى الحياة الأبدية
  rationale: تحافظ «إلى» على دلالة الاتجاه أو الغاية في εἰς من غير حسم العلاقة على أنها نتيجة سببية صريحة.
theological_decisions:
- issue: دلالة المضاف إليه في ἀγάπῃ θεοῦ
  choice: الإبقاء على الغموض بعبارة «محبة الله»
  alternative: «محبة الله لكم» أو «محبتكم لله»
  rationale: التركيب اليوناني يحتمل أن تكون المحبة صادرة من الله أو متجهة إليه، ولا يوجب السياق حصره في أحد الوجهين.
- issue: دلالة εἰς قبل «الحياة الأبدية»
  choice: «إلى الحياة الأبدية»
  alternative: «للحياة الأبدية» أو «المؤدية إلى الحياة الأبدية»
  rationale: «إلى» تنقل دلالة الغاية أو الاتجاه مع إبقاء الصلة النحوية والدلالية موجزة كما في الأصل.
- issue: ترجمة Χριστός
  choice: «المسيح»
  alternative: نقل اللقب صوتيًا بلفظ قريب من «كريستوس»
  rationale: «المسيح» هو المقابل العربي الدلالي الراسخ للقب اليوناني ويحفظ صفته كلقب.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت تراكيب مألوفة في الخطاب الكتابي العربي، مع تجنب الحسم التفسيري حيث يحتمل الأصل أكثر من معنى.
