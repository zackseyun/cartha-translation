lexical_decisions:
- source_word: Προεφήτευσεν
  choice: تنبأ
  rationale: ينقل فعل الكلام النبوي من غير حصره في مجرد الإخبار المسبق.
- source_word: δὲ καὶ
  choice: و... أيضًا
  rationale: الواو تصل الكلام بما قبله، و«أيضًا» تحفظ القوة الإضافية لـ καί.
- source_word: τούτοις
  choice: عن هؤلاء
  rationale: يفهم المجرور هنا على أنه يبين مَن تتعلق بهم النبوة؛ وهذا عربي طبيعي، مع إثبات الاحتمالات الأخرى في الحاشية.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: السابع من آدم
  rationale: يحافظ على صيغة النسب الواردة في اليونانية من غير توسع تفسيري.
- source_word: Ἑνὼχ
  choice: أخنوخ
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: λέγων
  choice: قائلًا
  rationale: مقابل موجز وطبيعي لاسم الفاعل الذي يقدم الاقتباس.
- source_word: Ἰδοὺ
  choice: ها
  rationale: أداة تنبيه عربية واضحة تحفظ النبرة النبوية المهيبة.
- source_word: ἦλθεν
  choice: قد جاء
  rationale: يحفظ صيغة الماضي في اليونانية، من غير تحويلها تفسيريًا إلى مستقبل؛ و«قد» تلائم الإعلان النبوي المؤكد.
- source_word: κύριος
  choice: الرب
  rationale: ينقل اللقب كما هو من غير تعيين مرجعه بما يتجاوز النص.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: مع ربواته المقدسة
  rationale: «مع» تؤدي معنى المصاحبة، و«ربوات» تنقل معنى الجموع التي تبلغ عشرات الآلاف من غير التصريح بأنها ملائكة، وهو ما لا يقوله النص صراحة.
theological_decisions:
- issue: هوية «الرب» في اقتباس أخنوخ
  choice: إبقاء اللقب «الرب» بلا تعيين إضافي
  alternative: تعيينه بالله في سياق سفر أخنوخ، أو بالمسيح في استعمال يهوذا
  rationale: اليونانية تقول κύριος فقط؛ لذلك يحافظ النص على التوتر الدلالي واللاهوتي ولا يحسم المرجع.
- issue: طبيعة الاقتباس من 1 أخنوخ
  choice: عرضه بوصفه نبوة كما يقدمه يهوذا، مع ذكر الصدى النصي في الحاشية
  alternative: التصريح في المتن بأنه اقتباس قانوني أو مجرد تقليد منسوب إلى أخنوخ
  rationale: لا ينبغي أن يضيف المتن حكمًا على الوضع القانوني للكتاب لا يصرح به نص الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «ربوات» للمحافظة على صورة العدد الضخم من غير إضافة «ملائكة»، ووُضعت علامات الحواشي جميعها في المتن.
