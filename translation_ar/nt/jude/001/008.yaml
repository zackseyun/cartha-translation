id: JUD.1.8
reference: Jude 1:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: ar
  text: ومع ذلك، فإن هؤلاء أيضًا، على النحو نفسه، إذ يتّكلون على الأحلام[a]، ينجّسون الجسد، ويرفضون السيادة، ويجدّفون على ذوي المجد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهم يحلمون». يمكن أن يُترجم اسم الفاعل في اليونانية ترجمة أكثر حرفية، لكنه قد يفيد هنا أنهم يتخذون الأحلام أساسًا لسلوكهم.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الأمجاد». والمقصود على الأرجح كائنات سماوية ممجدة، وربما ملائكة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: ومع ذلك، ... على النحو نفسه
  rationale: يحفظ هذا التعبير كلاً من معنى المشابهة في ὁμοίως والقوة الاستدراكية الخفيفة في μέντοι، بصياغة عربية طبيعية.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: اسم الإشارة يعود إلى المتسللين الموصوفين في السياق، ولا يضيف تحديدًا جنسانيًا غير موجود في اللفظ اليوناني.
- source_word: ἐνυπνιαζόμενοι
  choice: متّكلين على الأحلام
  rationale: يفيد اسم الفاعل على الأرجح أساس سلوكهم أو وسيلته، أي استنادهم إلى تجارب حلمية؛ وتُحفظ الترجمة الأكثر حرفية «حالمين» في الحاشية.
- source_word: σάρκα
  choice: الجسد
  rationale: يحفظ المقابل العربي الدلالة الواسعة للفظ اليوناني من غير قصره على الأجساد المادية أو تحميله معنى اصطلاحيًا مثل «الطبيعة الخاطئة».
- source_word: μιαίνουσιν
  choice: ينجّسون
  rationale: ينقل معنى التدنيس الأخلاقي أو الطقسي ويلائم نبرة يهوذا التنديدية.
- source_word: κυριότητα
  choice: السيادة
  rationale: يحفظ دلالة السلطان أو الربوبية بصورة مجردة، من غير حسم ما إذا كان المقصود سيادة إلهية أم سلطة سماوية أم غير ذلك.
- source_word: ἀθετοῦσιν
  choice: يرفضون
  rationale: تعبير موجز وقوي يفيد نبذ ما ينبغي الإقرار به.
- source_word: δόξας
  choice: ذوي المجد
  rationale: صياغة شخصية لكنها غير محددة، تشير على الأرجح إلى كائنات سماوية ممجدة من غير التصريح بأنها ملائكة؛ وتحفظ الحاشية حرفية الجمع «أمجاد».
- source_word: βλασφημοῦσιν
  choice: يجدّفون على
  rationale: الفعل العربي ينقل شدة الكلام المسيء الموجّه إلى ذوي منزلة سماوية، ولا يلزم في العربية أن يكون مفعوله الله وحده.
theological_decisions:
- issue: مرجع δόξας
  choice: تعبير واسع مقصود لذوي منزلة سماوية ومجد
  alternative: الملائكة، أو الكائنات السماوية المجيدة، أو «الأمجاد» حرفيًا
  rationale: يرجّح سياق يهوذا 1:9 الإشارة إلى كائنات ملائكية، لكن اللفظ نفسه غير صريح؛ لذلك تُحفظ سعته في المتن ويُذكر الاحتمال في الحاشية.
- issue: دلالة ἐνυπνιαζόμενοι
  choice: سلوكهم مرتبط باتكالهم على الأحلام
  alternative: حالمين، أو وهم يحلمون
  rationale: يجوز أن يبيّن اسم الفاعل أساس أفعالهم، لكن الصياغة الحرفية تظل ممكنة، ولذلك تُثبت في الحاشية حفظًا للغموض.
- issue: مرجع κυριότητα
  choice: السيادة بصيغة عامة
  alternative: سيادة الرب، أو سلطان كائنات سماوية، أو السلطة عمومًا
  rationale: لا يعيّن النص اليوناني المرجع صراحة، فاختير لفظ عربي يحفظ هذا التوتر ولا يحسمه مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي توازي الأفعال الثلاثة في الجملة، وحُفظ غموض «السيادة» و«ذوي المجد» دون فرض تفسير مذهبي.
