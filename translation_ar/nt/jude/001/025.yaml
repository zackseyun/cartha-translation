source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: ar
  text: لِلإلهِ الوحيدِ مُخلِّصِنا، بيسوعَ المسيحِ ربِّنا، المجدُ والعظمةُ والقوةُ والسلطانُ، قبلَ كلِّ دهر، والآن، وإلى أبدِ الآبدين.[a] آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «قبل كل دهر... وإلى جميع الدهور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: لِلإلهِ الوحيدِ مُخلِّصِنا
  rationale: يحفظ صيغة الاختصاص في التمجيد، ويعبّر «الوحيد» عن تفرد الله، و«مخلّصنا» هو المقابل الطبيعي لـ σωτῆρι ἡμῶν.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: بيسوعَ المسيحِ ربِّنا
  rationale: الباء العربية تعبّر طبيعيًا عن الوساطة أو الوسيلة التي تفيدها διά مع المضاف إليه. و«المسيح» ينقل Χριστός بوصفه لقبًا مفهومًا في العربية، مع إبقاء «ربنا» وصفًا ليسوع.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: المجدُ والعظمةُ والسلطانُ والسيادةُ
  rationale: «المجد» و«العظمة» يحفظان النبرة التسبيحية. واختير «السلطان» لـ κράτος بمعنى القوة الحاكمة، و«السيادة» لـ ἐξουσία بمعنى الحق والسلطة، للحفاظ قدر الإمكان على التمييز بين اللفظين.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: قبلَ كلِّ الدهور
  rationale: صياغة عربية فصيحة تحافظ على صورة αἰών الدهرية، بدل حسم العبارة في مفهوم «الزمن» المجرد وحده.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: والآن، وإلى أبدِ الآبدين
  rationale: «والآن» ينقل νῦν مباشرة، و«إلى أبد الآبدين» تعبير عربي طبيعي راسخ للامتداد عبر جميع الدهور.
theological_decisions:
- issue: تعلّق عبارة الوساطة في التمجيد
  choice: التمجيد موجّه إلى الإله الوحيد مخلّصنا، ويُقدَّم بيسوع المسيح ربنا.
  alternative: يمكن فهم العبارة على تعلق أوسع بالتمجيد كله، لكنها تظل دالة على الوساطة بيسوع.
  rationale: التركيب اليوناني يجعل διὰ Ἰησοῦ Χριστοῦ أقرب إلى بيان الوساطة في إسناد المجد إلى الله، من غير دمج المشار إليهما أو إزالة التوتر اللاهوتي في العبارة.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس أو اعتبار اللفظة اسمًا غير مترجم
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحفظ دلالته اللقبية بدل تحويله إلى اسم مجرد.
- issue: زمن استحقاق صفات التمجيد
  choice: أُبقيت العبارة الاسمية من غير إدخال فعل مثل «ليكن».
  alternative: له المجد... أو ليكن له المجد...
  rationale: النص اليوناني يسرد صفات التمجيد من غير فعل مصرح به؛ والصياغة العربية الاسمية تحافظ على هذا الإيجاز وعلى إمكان فهمها إقرارًا أو دعاءً تمجيديًا.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة تمجيدية رصينة. استُخدمت ألفاظ مألوفة في الخطاب الكتابي من غير إفراط في القِدم، مع ضبط محدود للحركات حيث يفيد في بيان العلاقات النحوية.
