reference: Jude 1:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: ar
  text: فقد تسلَّل أناسٌ خفيةً[a]، الذين سبق أن كُتب عنهم منذ القديم في شأن هذا الحكم[b]؛ وهم أناس غير أتقياء يحوِّلون نعمة إلهنا إلى فجورٍ[c]، وينكرون سيدنا الوحيد وربنا، يسوع المسيح[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اندسَّ أناسٌ من غير أن يُنتبه إليهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عُيِّنوا منذ القديم لهذا الحكم». ويمكن أن تعني العبارة أيضًا أنه سبق أن كُتب عنهم في ما يتصل بهذا الحكم.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «خلاعة» أو «إباحية».'
    reason: lexical_alternative
  - marker: d
    text: 'اليونانية: «يسوع خريستوس»؛ و«المسيح» ترجمة للقب Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: تسلَّل أناسٌ خفيةً
  rationale: ينقل معنى الدخول المتخفي والاندساس من غير أن يُنتبه إليهم، بصياغة عربية طبيعية.
- source_word: πάλαι προγεγραμμένοι
  choice: كُتب عنهم منذ القديم
  rationale: يحافظ على المعنى الحرفي الممكن للفعل، أي سبق أن ورد ذكرهم كتابةً، من غير حسمه في معنى التعيين السابق.
- source_word: κρίμα
  choice: القضاء
  rationale: لفظ قضائي واسع يمكن أن يدل على الحكم أو الإدانة الناتجة عنه، من غير تضييق الدلالة.
- source_word: ἀσεβεῖς
  choice: فُجّار
  rationale: يعبّر بإيجاز عن عدم تقواهم وتمردهم على الله، ويرتبط طبيعيًا بوصف الأشخاص المذكورين.
- source_word: χάριτα
  choice: نعمة
  rationale: المقابل العربي الراسخ والدقيق في هذا السياق اللاهوتي.
- source_word: μετατιθέντες
  choice: يحوِّلون ... إلى
  rationale: يحافظ على صورة تغيير الشيء وصرفه إلى غاية أخرى دون إدخال تفسير زائد مثل «يحرّفون».
- source_word: ἀσέλγειαν
  choice: فجور
  rationale: يدل على الانفلات الأخلاقي الوقح، وغالبًا الجنسي، وهو مفهوم وفصيح في العربية المعاصرة.
- source_word: τὸν μόνον δεσπότην καὶ κύριον ἡμῶν
  choice: سيدنا الوحيد وربنا
  rationale: يمثل اللقبين المتميزين في اليونانية، ويجعل «الوحيد» متعلقًا بالسيد وفق ترتيب النص مع إبقاء اللقبين موصولين.
- source_word: Ἰησοῦν Χριστόν
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة اللقب Χριστός وصيغته العربية الطبيعية والراسخة.
- source_word: ἀρνούμενοι
  choice: ينكرون
  rationale: ينقل معنى الرفض والجحود في الاعتقاد والسلوك بصورة مباشرة.
theological_decisions:
- issue: دلالة προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: كُتب عنهم منذ القديم أنهم لهذا القضاء
  alternative: عُيِّنوا منذ القديم لهذا القضاء
  rationale: الصياغة المختارة تحفظ احتمال الإشارة الكتابية السابقة، ولا تفرض تقريرًا صريحًا بشأن التعيين الفردي السابق، مع إبقاء الصلة بالقضاء واضحة.
- issue: مرجع لقبي δεσπότην وκύριον
  choice: كلا اللقبين يعودان إلى يسوع المسيح
  alternative: «السيد» يعود إلى الله الآب و«الرب» إلى يسوع المسيح
  rationale: التركيب اليوناني يجمع اللقبين قبل الاسم الواحد «يسوع المسيح»، وهذه هي القراءة النحوية الأرجح، من غير الحاجة إلى إضافة تفسير عقائدي إلى المتن.
- issue: مدى ἀσέλγεια
  choice: فجور
  alternative: خلاعة أو إباحية
  rationale: «فجور» يحفظ الاتساع الأخلاقي للكلمة ولا يحصرها في السلوك الجنسي وحده، مع الإشارة إلى البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «فقد» لربط تعليل الآية بما قبلها، وحُفظ تتابع الأوصاف والتوتر الدلالي في عبارة الكتابة السابقة والقضاء.
