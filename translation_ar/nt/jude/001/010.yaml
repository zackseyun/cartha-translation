source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: ar
  text: أَمَّا هَؤُلَاءِ فَيَطْعَنُونَ فِي كُلِّ مَا لَا يَفْهَمُونَهُ[a]، وَأَمَّا مَا يَعْرِفُونَهُ بِالْغَرِيزَةِ، كَالْحَيَوَانَاتِ غَيْرِ الْعَاقِلَةِ[b]، فَفِي هَذِهِ الْأُمُورِ يُفْسَدُونَ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجدّفون على كل ما لا يعرفونه»، أو: «يشتمون كل ما لا يعرفونه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ما يدركونه بطبيعتهم، كالحيوانات التي لا تعقل».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «وبهذه الأمور يهلكون»، أو: «وبها يلحقهم الفساد».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: هؤلاء
  rationale: اسم الإشارة للجمع يحيل إلى المتسللين المذكورين في السياق، ولا يقتضي في ذاته تقييد الإحالة بالذكور.
- source_word: βλασφημοῦσιν
  choice: يطعنون في
  rationale: تعبير عربي طبيعي ينقل معنى الكلام المسيء والازدراء، من غير أن يحصر الفعل في التجديف المباشر على الله أو أن يضيف بالضرورة معنى الادعاء الكاذب.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: كل ما لا يفهمونه
  rationale: يفيد οἴδασιν المعرفة، لكن المقابلة مع المعرفة الفطرية تجعل عدم الفهم الذهني بارزًا هنا.
- source_word: φυσικῶς
  choice: بالفطرة
  rationale: ينقل المعرفة الطبيعية أو الغريزية، وتوضحها المقارنة بالحيوانات غير العاقلة.
- source_word: ἄλογα ζῷα
  choice: الحيوانات غير العاقلة
  rationale: يحافظ على نفي العقل في ἄλογα بلغة عربية واضحة ومعاصرة، من غير استعمال وصف تحقيري زائد.
- source_word: ἐπίστανται
  choice: يعرفونه
  rationale: يشير إلى ما لديهم من إدراك طبيعي محدود، واختيار «يعرفونه» يميز ذلك عن الفهم المنفي في العبارة السابقة.
- source_word: ἐν τούτοις
  choice: في هذه الأمور
  rationale: يحافظ على الصورة الظرفية الأقرب لحرف الجر ἐν، مع بقاء احتمال الصلة السببية أو الوسيلية مفهومًا من السياق.
- source_word: φθείρονται
  choice: يفسدون
  rationale: الفعل اليوناني يحتمل الفساد والانحلال كما يحتمل الخراب والهلاك؛ والصياغة العربية هنا تُبقي معنى الفساد بارزًا من غير نفي دلالة المصير المهلك.
theological_decisions:
- issue: مدى دلالة βλασφημέω حين لا يُذكر مفعول إلهي صراحة
  choice: يطعنون في
  alternative: يجدّفون على؛ يشتمون
  rationale: السياق يدين كلامهم المسيء عن أمور لا يفهمونها، ولا يصرح بأن كل مفعول للفعل هو الله؛ لذلك تتجنب الصياغة حصر المعنى في مفهوم لاهوتي أضيق.
- issue: دلالة φθείρονται بين الفساد والهلاك
  choice: يفسدون
  alternative: يهلكون؛ يلحقهم الفساد
  rationale: الصيغة والسياق يجمعان بين الانحلال الأخلاقي والمصير المهلك. أبقت الترجمة معنى الفساد في المتن، وأثبتت احتمال الهلاك في الحاشية بدل حسم التوتر الدلالي.
- issue: علاقة ἐν τούτοις بالفعل φθείρονται
  choice: في هذه الأمور
  alternative: بهذه الأمور
  rationale: يمكن فهم ἐν على نحو ظرفي أو وسيلي. اختير التعبير الأقرب إلى البنية اليونانية، مع ذكر القراءة الوسيلية في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدمت «أما... وأما...» لإظهار مقابلة μὲν... δὲ، وحُفظت جميع علامات الحواشي في المتن.
