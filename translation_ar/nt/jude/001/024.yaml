  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: ar
  text: وللقادر على أن يحفظكم من العثار[a]، وأن يقيمكم أمام مجده[b] بلا عيب[c] وفي ابتهاج،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من السقوط». تدل الكلمة اليونانية ἀπταίστους على عدم التعثر أو السقوط.'
    reason: lexical_alternative
  - marker: b
    text: 'تورد بعض الترجمات: «أمام حضوره المجيد». أما النص اليوناني فيقول حرفيًا: «أمام مجده».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «بلا لوم». ويمكن للكلمة اليونانية ἀμώμους أيضًا أن تستحضر معنى الخلو من العيب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ δὲ δυναμένῳ
  choice: وأما القادر على أن
  rationale: تؤدي «أما» الانتقال اللطيف الذي تفيده δέ إلى التمجيد الختامي، وتُبقي «القادر» صيغة اسمية موصولة بالفعل اللاحق في العدد 25. وأضيفت «على أن» لتستقيم العبارة العربية مع معنى القدرة.
- source_word: φυλάξαι ὑμᾶς
  choice: يحفظكم
  rationale: «يحفظ» لفظ عربي طبيعي يجمع معنى الحراسة والصون الذي يحمله الفعل اليوناني، والضمير مفعول به لجمع المخاطبين.
- source_word: ἀπταίστους
  choice: من العثار
  rationale: لأن الصفة اليونانية تدل على عدم التعثر، صيغت عربيًا بعد «يحفظكم» بعبارة «من العثار»، محافظةً على الصورة دون حصرها في خطأ عابر أو ارتداد نهائي.
- source_word: καὶ στῆσαι
  choice: وأن يقيمكم
  rationale: يحافظ «يقيمكم» على معنى جعلهم يقفون، ويلائم سياق الوقوف أمام المجد من غير تحويل الفعل كليًا إلى معنى قضائي تفسيري مثل «يقدّمكم».
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: أمام مجده
  rationale: ترجمة قريبة وواضحة تحفظ «المجد» اسمًا كما في اليونانية، ولا توسع العبارة إلى «حضوره المجيد».
- source_word: ἀμώμους
  choice: بلا عيب
  rationale: تحفظ العبارة دلالة انعدام العيب، بما فيها صداها القرباني والأخلاقي، وتبقى مفهومة في العربية المعاصرة.
- source_word: ἐν ἀγαλλιάσει
  choice: وفي ابتهاج
  rationale: «ابتهاج» ينقل معنى الفرح الغامر بصيغة اسمية، من غير إضافة صفة مثل «عظيم» ليست مصرّحًا بها في النص.
theological_decisions:
- issue: 'دلالة ἀπταίστους: الحفظ من التعثر أم من السقوط النهائي'
  choice: من العثار
  alternative: من السقوط
  rationale: تحفظ «العثار» الصورة الأساسية في اللفظ اليوناني، ولا تحسم هل المقصود الزلل الأخلاقي اليومي أم السقوط النهائي.
- issue: ترجمة τῆς δόξης αὐτοῦ
  choice: مجده
  alternative: حضوره المجيد
  rationale: النص يذكر «مجده» صراحة، أما «حضوره المجيد» فتفسير محتمل يضيف مفهوم الحضور إلى العبارة.
- issue: دلالة ἀμώμους الأخلاقية والقربانية
  choice: بلا عيب
  alternative: بلا لوم
  rationale: «بلا عيب» تحتفظ بإمكان الصدى القرباني إلى جانب معنى السلامة الأخلاقية، من غير قصر اللفظ على حكم الناس أو اللوم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تلائم التمجيد الختامي. بقيت الجملة مفتوحة بعلامة الفاصلة لأن تركيب العدد يستمر إلى العدد 25، واستُخدم جمع المخاطبين في «يحفظكم/يقيمكم».
