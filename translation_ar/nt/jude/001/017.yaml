  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: ar
  text: أَمَّا أَنْتُمْ، أَيُّهَا الأَحِبَّاءُ، فَتَذَكَّرُوا الأَقْوَالَ الَّتِي سَبَقَ أَنْ قَالَهَا رُسُلُ رَبِّنَا يَسُوعَ الْمَسِيحِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: أَمَّا أَنْتُمْ ... فَـ
  rationale: تنقل ضمير المخاطبين المؤكد وقوة المقابلة في δέ، وتُبرز الانتقال من المذكورين سابقًا إلى القرّاء بصياغة عربية طبيعية.
- source_word: ἀγαπητοί
  choice: أَيُّهَا الأَحِبَّاءُ
  rationale: نداء جمع حميم يحفظ المودة والنبرة الرسولية الوقورة من غير تكلف.
- source_word: μνήσθητε
  choice: تَذَكَّرُوا
  rationale: فعل أمر مباشر وطبيعي يعبّر عن دعوة القرّاء إلى استحضار تعليم سبق أن تلقّوه.
- source_word: τῶν ῥημάτων
  choice: الأَقْوَالَ
  rationale: يشير السياق إلى أقوال منطوقة؛ و«الأقوال» أدق هنا من «الكلمات» وأكثر سلاسة مع فعل القول.
- source_word: τῶν προειρημένων
  choice: الَّتِي سَبَقَ أَنْ قَالَهَا
  rationale: يحفظ المعنى الزمني، أي أنها قيلت من قبل، من دون حصر اللفظ في معنى النبوءة أو التنبؤ.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: رُسُلُ
  rationale: المقابل العربي الكتابي والطبيعي لـἀπόστολοι، مع إبقاء الرسل فاعلًا صريحًا في البنية العربية.
- source_word: τοῦ κυρίου ἡμῶν
  choice: رَبِّنَا
  rationale: ينقل κύριος باللقب العربي المألوف ويحفظ ضمير الجماعة وعلاقة الرسل بالرب.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: ينقل الاسم يسوع ولقب Χριστός بمعناه العربي الراسخ «المسيح»، مع صياغة طبيعية في العربية.
theological_decisions:
- issue: دلالة Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: الْمَسِيحِ
  alternative: كريستوس
  rationale: «المسيح» ترجمة عربية مباشرة للقب اليوناني Χριστός، وتحفظ دلالته المسيانية مع كونها الصيغة العربية الكتابية الطبيعية، فلا حاجة إلى نقله صوتيًا.
- issue: دلالة προειρημένων
  choice: الَّتِي سَبَقَ أَنْ قَالَهَا
  alternative: التي تنبأ بها
  rationale: الفعل اليوناني يحتمل القول السابق في الزمن، والسياق يتحدث عن تحذير رسولي سابق؛ لذلك لا تُفرض عليه دلالة التنبؤ التي قد تكون أضيق من الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل تركيب «أمّا أنتم... فتذكّروا» لإظهار المقابلة والتوكيد بأسلوب عربي طبيعي، مع تجنب صياغة حرفية ثقيلة. لا توجد حاشية لازمة، لأن «المسيح» ينقل Χριστός معنىً واصطلاحًا في العربية.
