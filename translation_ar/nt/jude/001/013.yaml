  source_fidelity: النص يحفظ الصورتين الرئيسيتين ومعنى الحفظ إلى الأبد على نحو جيد. لكن οἷς ضمير مذكر جمع يشير، عبر استعارة «النجوم التائهة»، إلى الأشخاص الموصوفين؛ وصيغة «لها» تجعل الإحالة في العربية غير عاقلة على النجوم وحدها وتضعف هذا الجانب الموجود في الأصل. كما أن «تُزبد بمخازيها» أقل مطابقة من حيث العلاقة النحوية، إذ إن «المخازي» هي ما تُخرجه الأمواج في الصورة اليونانية لا مجرد ما تصاحبه.
