  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: ar
  text: أَمْوَاجُ بَحْرٍ عَاتِيَةٌ، تَقْذِفُ زَبَدَ مَخَازِيهَا[a]؛ نُجُومٌ تَائِهَةٌ، الَّذِينَ حُفِظَ لَهُمْ دُجَى الظَّلَامِ[b] إِلَى الْأَبَدِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تقذف عارها»، أو: «تُخرج أفعالها المخزية كالزبد». قد يدل جمع الكلمة اليونانية على ألوان العار نفسها أو على أفعال مخزية تفضح أصحابها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حُلْكة الظلام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: أمواج بحر عاتية
  rationale: يحافظ على صورة أمواج البحر وقوتها الجامحة، و«عاتية» عربية واضحة وفصيحة تؤدي معنى ἄγρια في هذا السياق.
- source_word: ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας
  choice: تُزبد بمخازيها
  rationale: يحافظ الفعل «تُزبد» على صورة إخراج الزبد المستمرة، وتؤدي «مخازيها» جمع αἰσχύνας بما يحتمله من ألوان العار أو الأفعال المخزية، من غير حسم هذا الاحتمال.
- source_word: ἀστέρες πλανῆται
  choice: نجوم تائهة
  rationale: ينقل صورة الأجرام التي لا تثبت في مسار ظاهر، من غير إدخال المعنى الفلكي الحديث لكلمة «كواكب».
- source_word: οἷς
  choice: لها
  rationale: يعود الضمير نحويًا إلى «نجوم»، مع بقاء المقصود المجازي أشخاصًا؛ وهذا أنسب لتركيب العربية.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: دجى الظلام
  rationale: «الدجى» ظلمة كثيفة، وإضافتها إلى «الظلام» تحفظ قوة التعبير اليوناني وصورته المكثفة بعبارة عربية موجزة.
- source_word: εἰς αἰῶνα
  choice: إلى الأبد
  rationale: هو المقابل العربي الطبيعي للعبارة في سياق الدينونة، ويحفظ دلالتها على الدوام.
- source_word: τετήρηται
  choice: قد حُفظ
  rationale: يعكس المبني للمجهول وحالة الحفظ القائمة الناتجة من فعل سابق، من غير إضافة فاعل غير مذكور في النص.
theological_decisions:
- issue: مدة صورة الدينونة وقوتها في εἰς αἰῶνα
  choice: إلى الأبد
  alternative: إلى الدهر
  rationale: يفيد السياق دوام المصير المعدّ لهم، و«إلى الأبد» أوضح في العربية المعاصرة من غير توسع عقائدي يتجاوز النص.
- issue: مرجع الضمير في οἷς
  choice: صيغة المؤنث غير العاقل العائدة إلى «نجوم» مع بقاء الإحالة المجازية إلى الأشخاص
  alternative: الذين حُفظ لهم
  rationale: يحفظ الاختيار بنية الاستعارة اليونانية ولا يزيل التوتر بين صورة النجوم والأشخاص الموصوفين بها.
translation_notes:
  register: صياغة عربية فصحى حديثة ذات إيقاع نبوي مهيب. استُعملت «عاتية» و«دجى» للمحافظة على حيوية الصورتين من غير تقعر، وحُفظ جمع «مخازي» والتكثيف في «دجى الظلام» بدل تسطيح الغموض والقوة البلاغية.
