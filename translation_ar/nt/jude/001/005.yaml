id: JUD.1.5
reference: Jude 1:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: ar
  text: وأريد أن أذكّركم، مع أنكم تعرفون هذا كله معرفةً راسخة، بأن يسوع[a]، بعدما خلّص شعبًا من أرض مصر، أهلك بعد ذلك الذين لم يؤمنوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقرأ بعض المخطوطات «الرب» أو «الله» بدلًا من «يسوع».
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: أريد أن أذكّركم
  rationale: ينقل تركيب الإرادة مع المصدر بصورة عربية طبيعية، ويحافظ على معنى إعادة أمر معروف إلى الذهن.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: مع أنكم تعرفون هذا كله معرفةً راسخة
  rationale: يفهم اسم الفاعل على معنى الاستدراك في السياق، ويأخذ πάντα في الإشارة إلى مجمل الحقائق المعروفة هنا. وتؤدي «معرفة راسخة» معنى ἅπαξ بوصف المعرفة مقررة ومكتسبة على نحو ثابت، من غير العبارة العربية الملتبسة «مرة واحدة».
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: هذا هو نص SBLGNT المعطى، ولذلك يُنقل مباشرة مع إبقاء القراءة البديلة في الحاشية.
- source_word: λαὸν
  choice: شعبًا
  rationale: يحافظ على التنكير في الأصل وعلى الإشارة الجماعية إلى إسرائيل من غير زيادة تفسيرية.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: من أرض مصر
  rationale: صياغة عربية واضحة تحفظ صدى لغة الخروج الكتابية.
- source_word: σώσας
  choice: بعدما خلّص
  rationale: يبين أن الخلاص سبق فعل الإهلاك، ويصوغ اسم الفاعل اليوناني بصورة عربية طبيعية.
- source_word: τὸ δεύτερον
  choice: بعد ذلك
  rationale: 'ينقل الدلالة الزمنية الاصطلاحية: الفعل اللاحق بعد الخلاص، من غير حرفية مربكة مثل «في المرة الثانية».'
- source_word: τοὺς μὴ πιστεύσαντας
  choice: الذين لم يؤمنوا
  rationale: ترجمة مباشرة وواضحة للجماعة التي اتسمت بعدم الإيمان.
- source_word: ἀπώλεσεν
  choice: أهلك
  rationale: يحفظ شدة الدينونة في الفعل اليوناني، وهو تعبير عربي كتابي مفهوم وطبيعي.
theological_decisions:
- issue: هوية الفاعل في حدث الخروج
  choice: يسوع في المتن
  alternative: الرب أو الله
  rationale: النص اليوناني المزوَّد يقرأ Ἰησοῦς، فتُحفظ دلالته المسيحانية القوية من غير تخفيف أو مواءمة، مع توثيق القراءات النصية الأخرى في الحاشية.
- issue: دلالة ἅπαξ مع معرفة المخاطبين
  choice: معرفةً راسخة
  alternative: مرة واحدة / منذ زمن
  rationale: يحفظ معنى أن هذه المعرفة قد استقرت لديهم، من غير أن يحسم اللفظ في اتجاه زمني صرف أو يستخدم تركيبًا عربيًا قد يوحي بأنهم عرفوا ثم نسوا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أهلك» لقوته ودقته في سياق الدينونة، وصيغت التراكيب اليونانية بالمصادر والجمل الزمنية الطبيعية في العربية. وُضع مؤشر الحاشية بعد فعل التذكير كما في طبقة الاستشارة الإنجليزية، مع تعلق مضمون الحاشية باسم «يسوع» الوارد لاحقًا.
