id: JUD.1.15
reference: Jude 1:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: ar
  text: ليُجري الدينونة على الجميع، ويُثبت ذنب جميع الفجّار[a] بشأن كل أعمال الفجور التي ارتكبوها بفجور، وبشأن كل الأقوال القاسية[c] التي قالها ضدّه[b] خطاةٌ فجّار.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ويكشف ذنب» أو «ويبرهن على إدانة». قد يدل الفعل اليوناني على كشف الخطأ، لكنه يرد هنا في سياق قضائي إلى جانب «يُجري الدينونة».
    reason: lexical_alternative
  - marker: b
    text: يعود ضمير «ـه» بحسب السياق إلى الرب المذكور في الآية السابقة.
    reason: cross_reference
  - marker: c
    text: 'حرفيًا: «الأشياء القاسية». والمقصود على الأرجح كلام قاسٍ أو متحدٍّ أو متطاول قيل ضدّه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: ليُجري الدينونة
  rationale: ينقل العبارة معنى تنفيذ القضاء، لا مجرد إصدار قرار، ويلائم السياق القضائي الأخروي.
- source_word: κατὰ πάντων
  choice: على الجميع
  rationale: تفيد κατά مع المضاف إليه هنا اتجاه الدينونة إلى الجميع؛ وهذه الصياغة طبيعية في العربية القضائية.
- source_word: ἐλέγξαι
  choice: ويُثبت ذنب
  rationale: السياق قضائي إلى جانب κρίσιν، ولذلك تعبّر الصياغة عن إظهار الذنب وإقامة الحجة على المذنب، لا عن مجرد التوبيخ.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: جميع الفجّار
  rationale: صياغة اسمية جمعيّة موجزة، وتحافظ على الصلة اللفظية المتكررة بجذر الفجور في بقية الآية.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: بشأن كل أعمال الفجور
  rationale: تحافظ على شمول العبارة وعلى معنى الأعمال المتصفة بالفجور بصياغة عربية واضحة.
- source_word: ὧν ἠσέβησαν
  choice: التي ارتكبوها بفجور
  rationale: تحافظ قدر الإمكان على التكرار الاشتقاقي المقصود لمجموعة ἀσεβ-، مع بيان أن الفجور وصف لطريقة ارتكاب الأعمال.
- source_word: σκληρῶν
  choice: الأقوال القاسية
  rationale: الصفة مستعملة استعمالًا اسميًا في سياق الكلام؛ وإضافة «الأقوال» توضح المعنى الضمني، بينما تنقل «القاسية» معنى الكلام الغليظ أو المتحدي دون تضييقه.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: قالها ضدّه
  rationale: تنقل فعل الكلام ومعنى المعارضة الذي تفيده κατά مع المضاف إليه، بصياغة عربية مباشرة.
- source_word: αὐτοῦ
  choice: ـه في «ضدّه»
  rationale: تُبقي ضمير الأصل ولا تستبدله باسم «الرب» أو «الله»، محافظةً على الإحالة السياقية دون تفسير زائد.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: خطاةٌ فجّار
  rationale: تحافظ على الوصفين وعلى نبرة الذروة في ختام العبارة، كما تكرر لفظ الفجور المحوري في الآية.
theological_decisions:
- issue: مرجع الضمير αὐτοῦ في عبارة «قالها ضدّه»
  choice: الإبقاء على الضمير «ـه» في النص
  alternative: قالوها ضدّ الرب؛ أو قالوها ضدّ الله
  rationale: يشير السياق في الآية السابقة إلى الرب، لكن اليونانية تستعمل ضميرًا؛ فالإبقاء عليه يصون صياغة المصدر ولا يحسم الإحالة بأكثر مما يفعله النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة قضائية مهيبة. حوفظ على التكرار البلاغي لجذر الفجور قدر الإمكان، وعلى الضمير المبهم سياقيًا، مع تجنب الألفاظ المذهبية الخاصة.
