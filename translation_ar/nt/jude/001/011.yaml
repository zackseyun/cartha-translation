  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: ar
  text: ويلٌ لهم، لأنهم سلكوا طريق قايين، واندفعوا إلى ضلال بلعام طلبًا للأجر[a]، وهلكوا في تمرّد قورح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وانصبّوا في ضلال بلعام طلبًا للأجر».'
    reason: بديل تعبيري يحافظ على الصورة المجازية لفعل ἐξεχύθησαν، بينما يقدّم النص الرئيس المعنى السياقي الطبيعي في العربية.
lexical_decisions:
- source_word: οὐαὶ
  choice: ويلٌ
  rationale: تحافظ على قوة إعلان الدينونة النبوي، بخلاف «وا أسفاه» الألين دلالة.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: سلكوا طريق قايين
  rationale: تنقل استعارة الطريق بوصفه نهجًا في السلوك، بصياغة عربية واضحة وطبيعية.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: في ضلال بلعام
  rationale: «ضلال» يشمل معنى الخطأ والانحراف الأخلاقي، ويحافظ على الإحالة الكتابية دون زيادة تفسيرية.
- source_word: μισθοῦ
  choice: طلبًا للأجر
  rationale: يبيّن الدافع النفعي الذي يدل عليه الاسم اليوناني، مع إبقاء «الأجر» أقرب إلى المعنى المعجمي من «الربح».
- source_word: ἐξεχύθησαν
  choice: انصبّوا
  rationale: يحافظ على صورة الانصباب الحية، ويؤدي في العربية أيضًا معنى الاندفاع الشديد، دون اختزال الصورة إلى تفسير واحد.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: في تمرّد قورح
  rationale: يناسب سياق حادثة العدد 16، مع أن اللفظة قد تدل أيضًا على المعارضة أو المجادلة.
- source_word: ἀπώλοντο
  choice: هلكوا
  rationale: صياغة عربية موجزة وجليلة تنقل معنى الهلاك دون تحديد كيفيته.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: قايين / بلعام / قورح
  rationale: الأسماء العربية الكتابية المألوفة المقابلة للأشكال اليونانية.
theological_decisions:
- issue: كيفية نقل العبارة المكثفة καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: وانصبّوا طلبًا للأجر في ضلال بلعام
  alternative: واندفعوا طمعًا في الربح إلى ضلال بلعام
  rationale: يحفظ النص الرئيس استعارة الانصباب في الفعل اليوناني، ويصرّح بالدافع المالي الذي يدل عليه μισθοῦ، من غير حسم الصورة المجازية في معنى الاندفاع وحده. وتورد الحاشية بديلًا أكثر تفسيرًا وسلاسة.
translation_notes:
  register: 'عربية فصحى حديثة، واضحة ومهيبة، مع توازٍ ثلاثي في الأفعال: سلكوا، انصبّوا، هلكوا. أُبقيت الإحالات إلى قايين وبلعام وقورح موجزة كما في الأصل.'
