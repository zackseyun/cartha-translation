id: JUD.1.7
reference: Jude 1:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: ar
  text: كما أن سدوم وعمورة والمدن المحيطة بهما، إذ ارتكبت على نحو مماثل[a] الفجور الجنسي وسعت وراء جسد آخر[b]، تُعرَض مثالًا، وهي تتحمل عقوبة نار أبدية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أوفى: «بالطريقة نفسها مثل هؤلاء». وقد يعود «هؤلاء» إلى الملائكة المذكورين في العدد السابق، أو إلى أمثلة العصيان والدينونة السابقة بوجه أعم.'
    reason: alternative_reading
  - marker: b
    text: أو «جسد مختلف»؛ والتعبير التقليدي هو «جسد غريب». أُبقيت العبارة قريبة من اللفظ من غير قصرها على تفسير واحد بعينه.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: كما أن
  rationale: تُظهر أداة التشبيه صلة هذا المثال بالأمثلة السابقة بعبارة عربية طبيعية وواضحة.
- source_word: Σόδομα καὶ Γόμορρα
  choice: سدوم وعمورة
  rationale: الصيغة العربية الكتابية الشائعة لاسمي المدينتين.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: المدن المحيطة بهما
  rationale: تنقل الدلالة المكانية لحرف الجر مع الإشارة بوضوح إلى سدوم وعمورة.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: على نحو مماثل
  rationale: تحفظ معنى المماثلة من غير حسم مرجع اسم الإشارة τούτοις المختلف عليه.
- source_word: ἐκπορνεύσασαι
  choice: ارتكبت الفجور الجنسي
  rationale: تعبير صريح ومفهوم ينقل دلالة الفعل على ممارسة الفجور الجنسي من غير تلطيف.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: سعت وراء
  rationale: ينقل صورة التوجه في طلب شيء وملاحقته، وهو تعبير عربي طبيعي.
- source_word: σαρκὸς ἑτέρας
  choice: جسد آخر
  rationale: ترجمة قريبة من اللفظ تحفظ عمومية العبارة ولا تقصرها على تفسير بعينه.
- source_word: πρόκεινται δεῖγμα
  choice: فهي ماثلة عبرة
  rationale: تعبر عن كونها معروضة أمام الناس مثالًا تحذيريًا، بصياغة عربية موجزة وذات وقار.
- source_word: πυρὸς αἰωνίου
  choice: نار أبدية
  rationale: ترجمة مباشرة تحفظ ثقل وصف αἰωνίου من غير توسع عقائدي.
- source_word: δίκην ὑπέχουσαι
  choice: تتحمل عقاب
  rationale: تنقل المعنى القضائي للعبارة، أي الخضوع للعقوبة ومعاناتها.
theological_decisions:
- issue: مرجع τούτοις في عبارة τὸν ὅμοιον τρόπον τούτοις
  choice: صياغة المقارنة في المتن بعبارة «على نحو مماثل» من غير تعيين المرجع
  alternative: «بالطريقة نفسها مثل هؤلاء»، على أن يعود «هؤلاء» إلى الملائكة في العدد السابق أو إلى أمثلة العصيان والدينونة السابقة عمومًا
  rationale: النص اليوناني يثبت وجود مماثلة، لكن مرجع اسم الإشارة محتمل؛ لذلك لا تحسم الترجمة ما تركه النص ملتبسًا.
- issue: مدلول σαρκὸς ἑτέρας
  choice: «جسد آخر»
  alternative: «جسد مختلف» أو تفسير العبارة صراحة بنوع محدد من التعدي الجنسي أو بتجاوز الحد الفاصل بين الملائكة والبشر
  rationale: الترجمة الحرفية نسبيًا تحفظ العبارة اليونانية ولا تضيف تحديدًا تفسيريًا أو مذهبيًا لا يصرح به العدد.
- issue: قوة πυρὸς αἰωνίου
  choice: «نار أبدية»
  alternative: «نار دائمة»
  rationale: تحافظ العبارة المختارة على الوصف الزمني كما يورده النص، من غير تخفيف أو بناء تقرير عقائدي أوسع من مضمون العدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تسلسل الجملة اليونانية العام، مع استعمال «فهي» لتوضيح الانتقال إلى الخبر، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان مباشرة.
