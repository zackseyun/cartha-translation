  to: كما أن سدوم وعمورة والمدن المحيطة بهما، إذ ارتكبت على نحو مماثل[a] الفجور الجنسي وسعت وراء جسد آخر[b]، تُعرَض مثالًا، وهي تتحمل عقوبة نار أبدية.
