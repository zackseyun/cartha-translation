  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: ar
  text: وَخَلِّصُوا آخَرِينَ، مُنْتَزِعِينَ إِيَّاهُمْ مِنَ النَّارِ[a]؛ وَارْحَمُوا آخَرِينَ بِخَوْفٍ[b]، مُبْغِضِينَ حَتَّى الثَّوْبَ الَّذِي دَنَّسَهُ الْجَسَدُ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنقذوا آخرين منتزعين إياهم من النار». وقد تشير الصورة إلى دينونة وشيكة أو إلى خطر روحي شديد.'
    reason: alternative_reading
  - marker: b
    text: 'قد يعني «بخوف»: بمخافة الله، أو بحذر لئلا يتأثر الراحم نفسه بالفساد.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «الثوب الذي دنسته الطبيعة الخاطئة». واللفظ اليوناني هو «الجسد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: خَلِّصُوا
  rationale: ينقل صيغة الأمر ووزن الفعل الخلاصي، مع ملاءمته لصورة الإنقاذ العاجل في السياق.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: مُنْتَزِعِينَ إِيَّاهُمْ مِنَ النَّارِ
  rationale: يحفظ قوة الفعل الدال على الأخذ السريع والحاسم، ويجعل اسم الفاعل مبينًا لطريقة التخليص.
- source_word: ἐλεᾶτε
  choice: ارْحَمُوا
  rationale: مقابل عربي مباشر وطبيعي لصيغة الأمر، ويحفظ معنى إظهار الرحمة للمخاطَبين.
- source_word: ἐν φόβῳ
  choice: بِخَوْفٍ
  rationale: يحافظ على إيجاز الأصل وغموضه بين مخافة الله والحذر من التأثر بالفساد.
- source_word: μισοῦντες
  choice: مُبْغِضِينَ
  rationale: يحفظ حدة الموقف الأخلاقي في الأصل، مع تمييز بغض الدنس عن الرحمة بالشخص.
- source_word: χιτῶνα
  choice: الثَّوْبَ
  rationale: لفظ عربي واضح يشير إلى اللباس؛ وهو طبيعي للقارئ الحديث من غير تضييق غير لازم لنوع الثوب الداخلي.
- source_word: ἐσπιλωμένον
  choice: الَّذِي دَنَّسَهُ
  rationale: ينقل حالة التلوث الأخلاقي الكامنة في صيغة اسم المفعول، ويلائم صورة الثوب المتنجس.
- source_word: σάρξ
  choice: الْجَسَدُ
  rationale: يبقي اللفظ التصويري قريبًا من σάρξ بدل تفسيره في المتن على أنه الطبيعة الخاطئة، مع توضيح البديل في الحاشية.
theological_decisions:
- issue: مدلول النار في صورة الإنقاذ
  choice: الإبقاء على «النار» بلا تحديد لمرجعها
  alternative: الدينونة الآتية أو الخطر الروحي المهلك الحاضر
  rationale: لا يحدد النص نفسه مدلول الصورة، لذلك تحفظ الترجمة التحذير والتوتر التفسيري من غير حسم زائد.
- issue: معنى σάρξ في عبارة الثوب المدنس
  choice: ترجمتها «الجسد» في المتن
  alternative: الطبيعة الخاطئة
  rationale: يحفظ هذا الاختيار استعارة الأصل ولا يستبدل بها تفسيرًا لاهوتيًا أكثر تحديدًا.
- issue: مدلول «بخوف»
  choice: الإبقاء على العبارة المجملة
  alternative: بمخافة الله أو بحذر من التلوث بالفساد
  rationale: كلا الوجهين ممكن سياقيًا، ولا يقتضي الأصل حصر العبارة في أحدهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت تراكيب اسم الفاعل للحفاظ على علاقة الحال/الكيفية في اسمَي الفاعل اليونانيين، مع ضبط علامات الحواشي بحسب ورودها في المتن.
