  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: ar
  text: 'يهوذا، عبدُ يسوع المسيح وأخو يعقوب، إلى المحبوبين في الله الآب[b]، والمحفوظين ليسوع المسيح[a]، والمدعوين:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «المحفوظين بيسوع المسيح». فصيغة الداتيف اليونانية قد تدل على الفاعل («بـ») أو على الغاية والاختصاص («لـ»).'
    reason: alternative_reading
  - marker: b
    text: 'تقرأ بعض المخطوطات: «المقدَّسين في الله الآب» بدلًا من «المحبوبين في الله الآب».'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: يهوذا
  rationale: الصيغة العربية المألوفة للاسم الكتابي، من غير نقل التمييز الاصطلاحي الخاص بالإنجليزية بين Jude وJudas.
- source_word: δοῦλος
  choice: عبد
  rationale: تنقل معنى الانتماء والخدمة الملزمة في هذا التعريف الرسائلي، وهي أفصح وأطبع عربيًا من «رقيق» هنا.
- source_word: Χριστοῦ / Χριστῷ
  choice: المسيح
  rationale: يحفظ اللقب اليوناني Χριστός ومعناه المسياني، بدل معاملته كجزء اسمي مجرد.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: وأخو يعقوب
  rationale: δέ هنا وصليّة خفيفة، فتؤديها الواو طبيعيًا؛ و«يعقوب» هو المقابل العربي الكتابي للاسم Ἰάκωβος.
- source_word: κλητοῖς
  choice: المدعوين
  rationale: الصفة مستعملة استعمال الاسم للدلالة على متلقي الرسالة؛ وتقديمها بعد «إلى» يجعل التركيب العربي واضحًا ويحفظ ثقل الدعوة الإلهية.
- source_word: ἐν θεῷ πατρὶ
  choice: في الله الآب
  rationale: يحفظ معنى المجال أو العلاقة الذي تدل عليه ἐν من غير تحويله إلى سببية أو فاعلية غير مصرّح بها.
- source_word: ἠγαπημένοις
  choice: المحبوبين
  rationale: يعكس اسم المفعول التام حالة ثابتة ناتجة من المحبة، بصياغة عربية واضحة.
- source_word: τετηρημένοις
  choice: المحفوظين
  rationale: يعبر عن حالة الحفظ المستمرة الناتجة من فعل سابق، من غير زيادة معنى الحراسة أو النجاة.
- source_word: Ἰησοῦ Χριστῷ
  choice: ليسوع المسيح
  rationale: اللام تلائم في المتن قراءة داتيف الغاية أو الاختصاص «لأجل/إلى المسيح»، مع إثبات احتمال الفاعلية في الحاشية.
theological_decisions:
- issue: علاقة Ἰησοῦ Χριστῷ بـ τετηρημένοις
  choice: المحفوظين ليسوع المسيح
  alternative: المحفوظين بيسوع المسيح
  rationale: صيغة الداتيف تحتمل الغاية أو الاختصاص، وتحتمل الفاعلية؛ اختيرت اللام في المتن مع إبقاء الاحتمال الآخر في الحاشية حتى لا يُحسم التوتر النحوي واللاهوتي بلا دليل.
- issue: قراءة ἠγαπημένοις
  choice: المحبوبين
  alternative: المقدَّسين
  rationale: يتبع المتن قراءة SBLGNT، مع توثيق القراءة المخطوطية المهمة الأخرى في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة رسائلية مهيبة. قُدِّم «المدعوين» ليتصل طبيعيًا بحرف الجر «إلى»، مع بقاء الأوصاف الثلاثة متوازية في المعنى. وُضعت علامة الحاشية [a] بعد العبارة التي تخصها، وعلامة [b] في نهاية الآية مع كونها توثق قراءة «المحبوبين».
