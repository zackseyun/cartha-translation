source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: ar
  text: 'أَمَّا مِيخَائِيلُ رَئِيسُ الْمَلَائِكَةِ، فَحِينَ كَانَ يُنَازِعُ إِبْلِيسَ وَيُجَادِلُهُ بِشَأْنِ جَسَدِ مُوسَى، لَمْ يَجْرُؤْ أَنْ يُصْدِرَ عَلَيْهِ حُكْمًا مُسِيئًا[a]، بَلْ قَالَ: «لِيَنْتَهِرْكَ الرَّبُّ!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب ترجمة أقرب إلى اللفظ: «أن يوجّه إليه اتهامًا ينطوي على شتيمة».'
    reason: lexical_alternative
  - marker: b
    text: 'تردّد هذه العبارة صدى زكريا 3: 2، حيث ينتهر الرب الشيطان.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: رئيس الملائكة
  rationale: تعبير عربي راسخ وواضح ينقل معنى لقب الملاك ذي الرتبة العليا دون توسع في تحديد طبيعة الرتبة.
- source_word: διαβόλῳ
  choice: إبليس
  rationale: اللفظة هنا لقب للخصم الروحي الشخصي، و«إبليس» تسمية عربية مألوفة وطبيعية في هذا السياق.
- source_word: διακρινόμενος
  choice: كان ينازع
  rationale: ينقل معنى الخصومة والمنازعة في السياق، مع إبقاء الفعل متميزًا عن فعل المجادلة التالي.
- source_word: διελέγετο
  choice: يجادله
  rationale: يعكس التبادل الكلامي المستمر ذا الطابع الخصامي، ويبيّن أن إبليس هو الطرف المقابل.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: في جسد موسى
  rationale: صياغة عربية طبيعية وموجزة تحفظ المرجع الملموس وتركيب الإضافة.
- source_word: οὐκ ἐτόλμησεν
  choice: لم يجرؤ
  rationale: ينقل مباشرة معنى الإقدام أو التجاسر الذي يفيده الفعل اليوناني.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: أن يصدر عليه حكمًا مهينًا
  rationale: يحفظ المعنى القضائي في «حكم» وقوة الذم في βλασφημία، من غير أن يوحي بالضرورة بأن ميخائيل جدّف على الله؛ وتُذكر الصياغة البديلة في الحاشية لصعوبة التركيب.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: لينتهرك الرب
  rationale: صيغة الدعاء العربية تنقل قوة صيغة التمني اليونانية، مع الحفاظ على العبارة الموجزة والرنانة.
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي المعياري للقب κύριος في هذا السياق الكتابي.
theological_decisions:
- issue: طبيعة امتناع ميخائيل عن إدانة إبليس
  choice: يمتنع ميخائيل عن إصدار حكم مهين من عنده، ويلجأ بدلًا من ذلك إلى انتهار الرب.
  alternative: يمكن فهم العبارة على أنه لم يوجّه إليه اتهامًا شاتمًا أو لم ينطق بحكم تجديفي.
  rationale: التركيب اليوناني κρίσιν ... βλασφημίας محتمل ودقيق المعنى. تحافظ الصياغة على المقابلة الواضحة بين امتناع ميخائيل واحتكامه إلى الرب، من غير بناء تصور تفصيلي عن سلطان الملائكة أو حسم وظيفة المضاف إليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية وقورة. استُعمل «أما... فحين» لتنظيم الجملة الطويلة طبيعيًا، مع الحفاظ على تتابع المنازعة والمجادلة والامتناع ثم القول. تظهر علامتا الحاشية [a] و[b] في المتن.
