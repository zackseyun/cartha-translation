id: JUD.1.20
reference: Jude 1:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: ar
  text: وأما أنتم، أيها الأحباء، فإذ تبنون أنفسكم على إيمانكم الأقدس[a][c]، وتصلّون في الروح القدس[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «في إيمانكم الأقدس». فقد يدل التركيب اليوناني على البناء فوق أساس، أو على البناء والنمو في نطاق الإيمان.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «بالروح القدس». فقد تبرز العبارة مجال الصلاة («في») أو تمكين الروح لها وفاعليته فيها («بـ»).'
    reason: alternative_reading
  - marker: c
    text: يمكن أن يعني «الإيمان» هنا أيضًا الثقة أو الأمانة، لكن سياق رسالة يهوذا يرجح إيمان الجماعة المسيحية المشترك.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: وأما أنتم
  rationale: تنقل «أما» المقابلة مع المذكورين في السياق السابق، ويحفظ الضمير الصريح «أنتم» نبرة التوكيد والخطاب المباشر.
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: صيغة نداء جمع تجمع بين المودة والوقار، وهي طبيعية في العربية الفصحى المعاصرة.
- source_word: ἐποικοδομοῦντες ἑαυτοὺς
  choice: فإذ تبنون أنفسكم
  rationale: تحفظ صورة البناء والقوة الانعكاسية للضمير، كما تُبقي الفعل في صيغة مرتبطة نحويًا بما يتبع في الآية التالية بدل تحويله صراحة إلى أمر مستقل.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: على إيمانكم الأقدس
  rationale: «على» تلائم صورة البناء على أساس، و«الأقدس» تنقل صيغة التفضيل اليونانية، مع إبقاء «الإيمان» بمدلوله الواسع الذي يحدده السياق.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: في الروح القدس
  rationale: تحفظ «في» دلالة المجال أو النطاق دون حصر العبارة في معنى الوسيلة، وتفهم «الروح القدس» على أنه الروح الإلهي مع أن التركيب اليوناني غير معرّف بأداة.
- source_word: προσευχόμενοι
  choice: وتصلّون
  rationale: تنسق فعل الصلاة مع فعل البناء وتحافظ على انفتاح التركيب نحو تتمة الجملة في الآية التالية، بصياغة عربية واضحة.
theological_decisions:
- issue: مرجع πνεύματι ἁγίῳ
  choice: الروح القدس الإلهي
  alternative: روح أو نزعة بشرية مقدسة
  rationale: الاستعمال المسيحي المبكر وسياق يهوذا يرجحان الإشارة إلى الروح القدس، من غير إضافة تفسير عقائدي يتجاوز العبارة.
- issue: دلالة πίστις
  choice: الإيمان المشترك الذي تلقّاه المؤمنون ويعتنقونه
  alternative: فعل الثقة الشخصي أو الأمانة
  rationale: سياق رسالة يهوذا، ولا سيما حديثها عن «الإيمان» المسلَّم للقديسين، يرجح المعنى الجماعي، بينما تبقي الترجمة اللفظ العربي «الإيمان» مفتوحًا لمداه الدلالي.
- issue: العلاقة النحوية بين اسم الفاعل اليوناني والأمر في الآية التالية
  choice: 'الإبقاء على تركيب حالي/تابع: «فإذ تبنون... وتصلّون...»'
  alternative: 'تحويل الفعلين إلى أمرين مستقلين: «ابنوا... وصلّوا...»'
  rationale: الصياغة المختارة تحافظ على تبعية اسمي الفاعل اليونانيين للفعل الرئيس الآتي في العدد 21، فلا تستبدل بالبنية الأصلية سلسلة أوامر مستقلة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ النداء العاطفي وصورة البناء، واستُعمل تركيب «فإذ... وتصلّون» ليبقى العدد مفتوحًا على الفعل الرئيس في العدد التالي. وُضعت علامات الحواشي كلها في المتن، وربطت [a] و[c] بعبارة الإيمان و[b] بعبارة الروح القدس.
