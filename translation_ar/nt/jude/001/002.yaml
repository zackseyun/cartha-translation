lexical_decisions:
- source_word: ἔλεος
  choice: الرحمة
  rationale: المقابل العربي المألوف والدقيق في سياق التحية الرسولية، ويحفظ دلالتي الرأفة والعناية الإلهية.
- source_word: ὑμῖν
  choice: لكم
  rationale: ينقل دلالة المجرور في صيغة التمنّي بصورة عربية طبيعية.
- source_word: εἰρήνη
  choice: السلام
  rationale: يحفظ المدى الدلالي للكلمة، بما فيه السلام والعافية والمصالحة، من غير توسيع تفسيري.
- source_word: ἀγάπη
  choice: المحبة
  rationale: المقابل العربي الحديث والمستقر للكلمة، وهو أوضح من ألفاظ قد تحمل إيحاءات أضيق.
- source_word: πληθυνθείη
  choice: لِتَتَكَاثَرْ
  rationale: صيغة تمنٍّ عربية تنقل قوة صيغة التمني اليونانية وتحفظ صورة الزيادة الوفيرة، مع سلاسة معاصرة.
- source_word: καὶ ... καὶ ... καὶ
  choice: الرحمة والسلام والمحبة
  rationale: حُفظ تكرار أداة العطف بين عناصر البركة الثلاثة بما يلائم الإيقاع العربي.
theological_decisions:
- issue: نقل صيغة التمني في البركة الرسولية
  choice: لِتَتَكَاثَرْ لكم الرحمة والسلام والمحبة.
  alternative: لتزدد لكم الرحمة والسلام والمحبة.
  rationale: استُعملت لام الدعاء مع الفعل لتوضيح أن العبارة تمنٍّ وبركة لا تقرير خبري، مع إبقاء صورة التكاثر في الأصل وعدم تعيين فاعل الزيادة صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة تلائم البركة الافتتاحية. حُفظت بنية العطف الثلاثية، واستُعملت لام الدعاء لنقل صيغة التمني اليونانية.
