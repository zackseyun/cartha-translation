  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: ar
  text: هؤلاء متذمّرون، ساخطون على نصيبهم، يسلكون بحسب رغباتهم[a]، وفمهم ينطق بكلام متعجرف[b]، وهم يحابون الناس[c] ابتغاء منفعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شهواتهم».'
    reason: بديل معجمي يحفظ القوة الأخلاقية الممكنة للفظ ἐπιθυμίαι من غير حصرها في الشهوة الجنسية.
  - marker: b
    text: 'أو: «بكلام متضخّم».'
    reason: ينقل الصورة الحرفية في ὑπέρογκα، أي الأقوال المنتفخة أو المتعالية.
  - marker: c
    text: 'حرفيًا: «يعجبون بالوجوه»، وهو تعبير عن محاباة الأشخاص أو تملقهم.'
    reason: إيضاح الصورة الاصطلاحية اليونانية وراء الترجمة العربية الطبيعية.
lexical_decisions:
- source_word: γογγυσταί
  choice: متذمّرون
  rationale: يدل اللفظ على أناس دأبهم التذمر والشكوى بصوت خافت؛ و«متذمّرون» تعبير عربي معاصر واضح يحفظ هذه السمة المستمرة.
- source_word: μεμψίμοιροι
  choice: ساخطون على نصيبهم
  rationale: اللفظ النادر يصف من يشكو حظه أو نصيبه ويظل غير راضٍ عنه؛ وهذه الصياغة أدق من مجرد «كثيري الشكوى» وتمنع تكرار معنى اللفظ السابق.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: يسلكون بحسب رغباتهم
  rationale: استُعمل «يسلكون» للمجاز الدال على نهج الحياة، و«رغباتهم» تحفظ سعة ἐπιθυμίαι، بينما يبيّن السياق أن المقصود رغبات منحرفة أخلاقيًا.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: وفمهم ينطق بكلام متعجرف
  rationale: حُفظ الإفراد الجماعي في «فمهم» كما في اليونانية، ونُقل ὑπέρογκα بكلام متعجرف لأنه يدل على القول المتضخم المتكبر.
- source_word: θαυμάζοντες πρόσωπα
  choice: يحابون الناس
  rationale: العبارة اصطلاح حرفي معناه «يعجبون بالوجوه»، والمقصود إظهار المحاباة للأشخاص، لا مجرد الإعجاب بهم.
- source_word: ὠφελείας χάριν
  choice: طمعًا في منفعة
  rationale: تبيّن الصياغة الدافع النفعي الذاتي من غير حصر ὠφελεία في الربح المالي وحده.
- source_word: οὗτοί εἰσιν
  choice: هؤلاء
  rationale: افتتاح مباشر ومقتضب يحفظ قوة الإشارة والتعريف في الأصل، مع إمكان الاستغناء عربيًا عن فعل الكينونة في الجملة الاسمية.
theological_decisions:
- issue: القوة الأخلاقية للفظ ἐπιθυμίαι
  choice: «رغباتهم» في المتن، مع دلالة السياق على فسادها
  alternative: «شهواتهم»
  rationale: قد يدل اللفظ على الرغبات القوية عمومًا، والسياق هنا يدينها أخلاقيًا. «رغباتهم» لا تحصر المعنى في الشهوة الجنسية، والحاشية تحفظ البديل الأقوى.
- issue: الدلالة الاصطلاحية لعبارة θαυμάζοντες πρόσωπα
  choice: «يحابون الناس»
  alternative: «يتملقون الناس» أو حرفيًا «يعجبون بالوجوه»
  rationale: المقصود إيثار الأشخاص طلبًا للنفع. «يحابون» يحفظ الاتهام الأخلاقي الأوسع، في حين أن «يتملقون» يضيّق المعنى إلى أسلوب الكلام.
- issue: مدى معنى ὠφελεία
  choice: «منفعة»
  alternative: «ربح»
  rationale: اللفظ يشمل الفائدة أو المزية عمومًا ولا يوجب أن تكون مالية؛ لذلك تجنبت الترجمة تضييقه إلى الكسب المادي.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل «ساخطون على نصيبهم» لشرح اللفظ اليوناني النادر بإيجاز، وحُفظت صورة السلوك وصيغة «فمهم» قدر الإمكان، مع ترجمة اصطلاح محاباة الوجوه بمعناه الطبيعي.
