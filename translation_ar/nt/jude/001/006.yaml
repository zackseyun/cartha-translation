id: JUD.1.6
reference: Jude 1:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: ar
  text: والملائكة الذين لم يحفظوا مقامهم[a]، بل تركوا مسكنهم الخاص، قد حفظهم في قيود أبدية تحت ظلام دامس[b] لدينونة اليوم العظيم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سلطانهم» أو «مجالهم».
    reason: lexical_alternative
  - marker: b
    text: أو «تحت الظلام»؛ فالكلمة اليونانية تدل على ظلمة كثيفة قاتمة، لا على مجرد «الظلام».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: الملائكة
  rationale: السياق سياق دينونة لكائنات سماوية، ولذلك تدل الكلمة هنا على الملائكة لا على الرسل البشر.
- source_word: τηρήσαντας / τετήρηκεν
  choice: لم يحفظوا / قد حفظهم
  rationale: 'تكرار «حفظ» يصون التقابل اللفظي المقصود: هم لم يحفظوا مقامهم، فحفظهم الله للدينونة.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: مقامهم
  rationale: يمكن أن تدل ἀρχή على السلطة أو المرتبة أو المجال المعيَّن. و«مقامهم» تعبر طبيعيًا عن المرتبة أو الحيز المخصص لهم من غير حسم زائد لطبيعة ذلك المقام.
- source_word: ἀπολιπόντας
  choice: تركوا
  rationale: تفيد المغادرة المتعمدة في هذا السياق، مع بقاء العبارة عربية واضحة وغير متكلفة.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: مسكنهم الخاص
  rationale: οἰκητήριον هو موضع السكن، وἴδιον يفيد ما يخصهم؛ والصياغة لا تضيف إلى النص تحديدًا لطبيعة هذا المسكن.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: لدينونة اليوم العظيم
  rationale: تحفظ العبارة غاية الحفظ واتجاهه الأخروي، كما تصون تركيب الإضافة في اليونانية.
- source_word: δεσμοῖς ἀϊδίοις
  choice: في قيود أبدية
  rationale: «قيود» تقابل δεσμοῖς بوضوح، و«أبدية» تؤدي معنى الدوام في ἀϊδίοις.
- source_word: ὑπὸ ζόφον
  choice: تحت الدُّجى
  rationale: ζόφος يدل على ظلمة كثيفة قاتمة لا على مجرد غياب النور؛ و«الدجى» ينقل هذه الصورة بإيجاز ووقار.
- source_word: τε
  choice: و
  rationale: تربط هذه الحادثة بأمثلة الدينونة السابقة ربطًا طبيعيًا.
theological_decisions:
- issue: ماهية خطيئة الملائكة
  choice: إبقاء النص عند أنهم لم يحفظوا مقامهم وتركوا مسكنهم، بلا تعيين إضافي لطبيعة الواقعة.
  alternative: تفسيرها صراحة بتقليد تكوين 6، أو بسقوط ملائكي أول عام.
  rationale: قد يلمح يهوذا إلى تقليد يهودي معروف، لكن الآية نفسها لا تفصّل خلفيته، فلا ينبغي إدخال تفسير بعينه في المتن.
- issue: قوة ἀΐδιος
  choice: أبدية
  alternative: دائمة أو سرمدية
  rationale: «أبدية» المقابل العربي الواضح والمألوف لمعنى الدوام هنا، من غير إضافة تقرير عقدي يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «مقامهم» لصون سعة معنى ἀρχή، و«الدجى» لنقل قتامة ζόφος. وُضع كل من علامتي الحاشية [a] و[b] في المتن.
