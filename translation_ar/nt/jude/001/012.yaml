  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: ar
  text: هؤلاء شعاب خفيّة في ولائم محبتكم[a]، يشتركون في الوليمة بلا خوف، ويرعون أنفسهم[b]؛ غيوم بلا ماء تسوقها الرياح؛ أشجار خريفية بلا ثمر، ماتت مرتين[c] واقتُلعت من جذورها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عيوب» أو «بقع» في ولائم محبتكم. يمكن أن تحمل الكلمة اليونانية معنى أخلاقيًا، لكنها قد تدل أيضًا على شعاب بحرية خفيّة؛ وهذا المعنى الأخير أنسب بسلسلة الصور الحية هنا.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «يطعمون أنفسهم»، في إشارة إلى سلوكهم الأناني. قارن حزقيال 34، حيث يطعم الرعاة أنفسهم بدلًا من الرعية.'
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: «ماتت مرتين» عبارة مقصودة في قوتها البلاغية؛ وقد تُفهم أيضًا على أنها تشديد على موتها التام.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: σπιλάδες
  choice: صخور خفيّة خطرة
  rationale: ينقل معنى الصخور أو الشعاب البحرية المستترة التي تهدد السفن، ويلائم سلسلة الصور الحية في السياق، مع بيان عنصر الخطر طبيعيًا بالعربية.
- source_word: ἀγάπαις
  choice: ولائم محبتكم
  rationale: صيغة الجمع هنا تشير إلى الوجبات الجماعية التي كانت تعبّر عن المحبة المسيحية؛ و«ولائم المحبة» تسمية واضحة وتحفظ الصلة اللفظية بالمحبة.
- source_word: συνευωχούμενοι
  choice: يشتركون في الوليمة
  rationale: ينقل معنى المشاركة مع الآخرين في وليمة، من غير إضافة ضمير غير صريح في اليونانية.
- source_word: ἀφόβως
  choice: بلا خوف
  rationale: يحفظ اتساع الدلالة بين انعدام الخشية والوقاحة وعدم الاكتراث، من غير حسم تفسيري زائد.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: يرعون أنفسهم
  rationale: يحفظ استعارة الرعاية في الفعل اليوناني، ويتيح صداها مع صورة الرعاة الأنانيين بدل اختزالها في الأكل وحده.
- source_word: νεφέλαι ἄνυδροι
  choice: غيوم بلا ماء
  rationale: تعبير عربي مباشر يحفظ صورة الوعد بالمطر من دون عطاء.
- source_word: παραφερόμεναι
  choice: تسوقها
  rationale: يفيد أن الرياح تحمل الغيوم وتحركها بقوة خارجية، وهو تعبير طبيعي في العربية.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: أشجار خريفية بلا ثمر
  rationale: يحفظ الموسم والصورة الملموسة للعقم حين يُنتظر الثمر.
- source_word: δὶς ἀποθανόντα
  choice: ماتت مرتين
  rationale: ترجمة مباشرة تحفظ العبارة البلاغية اللافتة وغموض المقصود من الموت المزدوج.
- source_word: ἐκριζωθέντα
  choice: اقتُلعت من جذورها
  rationale: صياغة عربية حية توضّح الاجتثاث الكامل وتكثّف صورة انعدام الحياة.
theological_decisions:
- issue: تفسير σπιλάδες في وصف المعلّمين الفاسدين
  choice: صخور خفيّة خطرة داخل ولائم المحبة
  alternative: عيوب أو بقع في ولائم المحبة
  rationale: معنى الصخور الخفية يلائم تعاقب الاستعارات الطبيعية وصورة الخطر المستتر، مع إبقاء القراءة الأخلاقية البديلة في الحاشية بسبب إمكانها المعجمي وشيوعها التراثي.
- issue: دلالة ποιμαίνοντες في ἑαυτοὺς ποιμαίνοντες
  choice: 'الإبقاء على استعارة الرعاية: «يرعون أنفسهم»'
  alternative: «يطعمون أنفسهم»
  rationale: المعنى المعتاد للفعل هو الرعاية بوصف الراعي، وهذه الصياغة تحفظ التوتر بين القيادة وخدمة الذات وصدى حزقيال 34.
- issue: دلالة δὶς ἀποθανόντα
  choice: الحفاظ على العبارة «ماتت مرتين» من غير شرح داخل النص
  alternative: «ميتة تمامًا»
  rationale: النص اليوناني متعمّد في صيغته اللافتة، ولا ينبغي للترجمة أن تحسم هل المراد مرحلتان من الموت أم تأكيد الموت الكامل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صور ملموسة وتراكيب موجزة تحاكي توالي الاستعارات في اليونانية، مع تجنّب المصطلحات المذهبية وحفظ مواضع الغموض.
