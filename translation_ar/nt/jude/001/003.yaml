language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: ar
  text: أيها الأحباء، مع أنني كنت أبذل كل جهد لأكتب إليكم عن الخلاص الذي نشترك فيه، رأيت أنه لا بد أن أكتب إليكم لأحثكم على أن تجاهدوا بجدّ من أجل الإيمان[a] الذي سُلِّم إلى القديسين[b] مرة واحدة وإلى الأبد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الإيمان» هنا يُرجَّح أن يعني مضمون الإيمان أو التعليم الذي اؤتمن عليه المؤمنون، لا مجرد فعل الإيمان الشخصي.
    reason: alternative_reading
  - marker: b
    text: «القديسون» هم شعب الله المقدس، أي المؤمنون.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: أيها الأحباء
  rationale: نداء جمع حميم يحفظ معنى المحبة ونبرة الخطاب الرعوية بلغة عربية فصيحة مألوفة.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: مع أنني كنت أبذل كل جهد
  rationale: يفهم اسم الفاعل هنا على معنى التنازل أو المقابلة بحسب السياق؛ والصياغة تنقل الاجتهاد والحرص بصورة طبيعية.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: عن الخلاص الذي نشترك فيه
  rationale: تنقل κοινῆς معنى المشترك بين الكاتب والمخاطبين، وتتجنب ما قد يوحي به «الخلاص العام» من دلالة مغايرة.
- source_word: ἀνάγκην ἔσχον
  choice: رأيت أنه لا بد
  rationale: تعبير عربي طبيعي عن ضرورة نشأت من الظروف، من غير المبالغة التي قد تحملها صيغة «أُجبرت».
- source_word: παρακαλῶν
  choice: لأحثكم
  rationale: ينقل قوة الالتماس الجاد ووظيفة الرسالة الحاثّة، ويربطه طبيعيًا بفعل الكتابة.
- source_word: ἐπαγωνίζεσθαι
  choice: أن تجاهدوا بجدّ
  rationale: يحفظ معنى الكفاح المشدد في الفعل المركب من غير حصره في قتال جسدي.
- source_word: τῇ ... πίστει
  choice: من أجل الإيمان
  rationale: الإيمان هنا، بحكم كونه مسلَّمًا إلى الجماعة، يدل على مضمون الإيمان أو التعليم المؤمن به أكثر من فعل التصديق الشخصي.
- source_word: ἅπαξ
  choice: مرة واحدة نهائية
  rationale: تعبر عن وقوع التسليم مرة واحدة وعن طابعه الحاسم غير المتكرر، مع إبقاء اللفظ مفهومًا للقارئ المعاصر.
- source_word: παραδοθείσῃ
  choice: سُلِّم
  rationale: يحفظ معنى نقل الوديعة أو التعليم إلى المؤمنين؛ ويمكن أيضًا فهمه بمعنى «نُقل» أو «تُوارث» بحسب إبراز جانب الانتقال.
- source_word: τοῖς ἁγίοις
  choice: إلى القديسين
  rationale: يحافظ على المصطلح الكتابي المألوف، مع توضيح في الحاشية أن المراد شعب الله المؤمن لا فئة نالت لقبًا كنسيًا لاحقًا.
theological_decisions:
- issue: دلالة πίστις في «الإيمان»
  choice: مضمون الإيمان أو التعليم المسيحي المسلَّم إلى جماعة المؤمنين
  alternative: فعل الثقة أو التصديق الشخصي
  rationale: وصف الإيمان بأنه سُلِّم مرة واحدة إلى القديسين يرجح معنى الوديعة التعليمية المشتركة، من غير إدخال صياغة مذهبية لاحقة.
- issue: قوة ἅπαξ παραδοθείσῃ
  choice: تسليم حاسم وقع مرة واحدة
  alternative: تسليم وقع في مناسبة واحدة من غير تشديد صريح على النهائية
  rationale: لـἅπαξ في هذا التركيب قوة تدل على المرة الواحدة الحاسمة؛ وصياغة «مرة واحدة نهائية» تظهر ذلك من غير توسيع عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حُفظ تكرار «أكتب إليكم» الوارد في اليونانية لأنه يميز بين قصد الكاتب الأول والضرورة التي استجدت، واستُخدم «تجاهدوا بجدّ» لنقل شدة الفعل من غير نبرة عسكرية مفرطة.
