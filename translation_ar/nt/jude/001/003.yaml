- from: أيها الأحباء، مع أنني كنت أبذل كل جهد لأكتب إليكم عن الخلاص الذي نشترك فيه، رأيت أنه لا بد أن أكتب إليكم لأحثكم على أن تجاهدوا بجدّ من أجل الإيمان الذي سُلِّم إلى القديسين مرة واحدة نهائية[a][b].
