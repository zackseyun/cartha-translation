review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: النداء الحميم، والحرص السابق على الكتابة عن الخلاص المشترك، والضرورة المستجدة للكتابة والحث على المجاهدة من أجل الإيمان، كلها منقولة بوضوح. غير أن «مرة واحدة نهائية» تركيب غير مألوف في العربية ولا ينقل قوة ἅπαξ بسلاسة؛ والأفضل «مرة واحدة وإلى الأبد»، وهو تعبير عربي طبيعي يحافظ على الدلالة الحاسمة غير المتكررة في السياق.'
