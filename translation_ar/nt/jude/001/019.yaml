  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: ar
  text: هؤلاء هم الذين يُحدِثون انقسامات[a]، أناسٌ تحكمهم الطبيعة البشرية[b]، لا روحَ[c] لهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يفصلون أنفسهم» أو «يُحدِثون انقسامات».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «غير روحيين» أو «أناس طبيعيون».'
    reason: lexical_alternative
  - marker: c
    text: الأرجح في السياق أن المقصود هو الروح القدس؛ ويمكن أن تُفهم «روح» أيضًا بمعنى أعم.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: هؤلاء
  rationale: اسم إشارة يعود إلى المتسللين الموصوفين في السياق، ويحافظ بإيجاز على قوة الإشارة في اليونانية.
- source_word: οἱ ἀποδιορίζοντες
  choice: الذين يُحدِثون انقسامات
  rationale: ينعتهم اسم الفاعل بحسب فعلهم التفريقي. وهذه الصياغة تنقل المعنى الأرجح في السياق، مع إبقاء احتمال أنهم يعزلون أنفسهم في الحاشية.
- source_word: ψυχικοί
  choice: أناسٌ نفسانيون
  rationale: تحافظ «نفسانيون» على الصلة بـψυχή وعلى المقابلة المقصودة مع πνεῦμα، وتدل هنا على من تقتصر حياتهم على المستوى الطبيعي البشري ولا يقودهم الروح؛ وتوضح الحاشية هذا المعنى دفعًا لاحتمال فهمها بمعنى نفسي حديث.
- source_word: πνεῦμα
  choice: روح
  rationale: يرجح السياق أن المقصود هو الروح القدس، لكن غياب أداة التعريف وإمكان الدلالة الأوسع يجعلان إبقاء «روح» في المتن وشرح الترجيح في الحاشية أنسب لصون الغموض الحقيقي.
- source_word: μὴ ἔχοντες
  choice: لا روحَ لهم
  rationale: صياغة عربية طبيعية وموجزة تنقل نفي الامتلاك في اسم الفاعل اليوناني من غير زيادة تفسيرية.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: «روح» في المتن، مع ترجيح الروح القدس في الحاشية
  alternative: الروح البشري
  rationale: المقابلة المباشرة مع ψυχικοί ترجح أن يهوذا يقصد افتقارهم إلى الروح القدس، لكن اللفظ اليوناني نفسه غير معرّف ويمكن من حيث اللغة أن يُفهم بمعنى «روح». لذلك لم يُحسم الاحتمال داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «نفسانيون» للمحافظة على المقابلة اللفظية واللاهوتية بين ψυχικοί وπνεῦμα، مع شرحها في الحاشية لأن مدلولها الكتابي أخص من الاستعمال النفسي الحديث. وُضعت جميع علامات الحواشي في المتن.
