  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: ar
  text: كان لديّ أشياء كثيرة لأكتبها إليك، لكنني لا أريد أن أكتب إليك بالحبر والقلم[a]؛
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بالحبر والقصبة»، أي بقلم مصنوع من القصب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: أشياء كثيرة
  rationale: الصفة المحايدة بصيغة الجمع مستعملة استعمال الاسم، و«أشياء كثيرة» تنقل معنى الجمع بوضوح وطبيعية.
- source_word: εἶχον
  choice: كان لديّ
  rationale: يحافظ هذا التعبير على الإطار الماضي للفعل الناقص، ويؤدي معنى وجود أمور كان الكاتب ينوي كتابتها.
- source_word: γράψαι σοι
  choice: لأكتبها إليك
  rationale: ينقل المصدر الأوريستي الفعل المزمع من غير تحميل صيغته دلالة زمنية زائدة، ويصرّح بجهة الكتابة التي يدل عليها ضمير المجرور.
- source_word: ἀλλ’ οὐ θέλω
  choice: لكنني لا أريد
  rationale: صياغة عربية حديثة واضحة تعبّر عن الإرادة أو الرغبة من غير تكلف.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: بالحبر والقلم
  rationale: تدل διά مع المضاف إليه على الوسيلة؛ و«القلم» يبيّن وظيفة القصبة في سياق الكتابة، مع إثبات معناها الحرفي في الحاشية.
- source_word: γράφειν
  choice: أن أكتب
  rationale: صياغة عربية طبيعية للمصدر الحاضر، من غير الإفراط في إبراز دلالته الجهية المحتملة.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة، مع الحفاظ على صيغة الماضي وعلى التكرار المقصود لفعل الكتابة. وُضعت علامة الحاشية بعد «القلم» لأنها تشرح اللفظ اليوناني κάλαμος.
