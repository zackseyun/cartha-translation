  source_fidelity: 'المعنى العام محفوظ: الشرط المستقبلي، كشف أفعال ديوتريفس المستمرة، كلامه العدائي الفارغ، رفضه استقبال الإخوة، منعه الآخرين، وإخراجه لهم من الجماعة. لكن «يهذي» يوحي بالهذيان أو فقدان الاتزان الذهني أكثر من معنى φλυαρῶν، وهو الكلام الفارغ/الثرثرة المؤذية.'
