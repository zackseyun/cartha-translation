  terminology: «الإخوة» و«يستقبل» و«الكنيسة» مناسبة. وحاشية الاستقبال توضّح بأمانة دلالة الضيافة المحتملة. ينبغي أن تظل إحالة «يطردهم» غير محسومة في المتن، لأن اليونانية لا تعيد المفعول صراحة.
