reference: 3 John 1:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: ar
  text: لِذَلِكَ، إِنْ جِئْتُ، فَسَأَلْفِتُ الانْتِبَاهَ إِلَى الأَعْمَالِ الَّتِي يَفْعَلُهَا، إِذْ يَثْرْثِرُ ضِدَّنَا بِكَلِمَاتٍ شِرِّيرَةٍ. وَإِذْ لَا يَكْتَفِي بِهَذِهِ الأُمُورِ، فَهُوَ نَفْسُهُ لَا يَسْتَقْبِلُ الإِخْوَةَ[a]، وَيَمْنَعُ الَّذِينَ يُرِيدُونَ أَنْ يَسْتَقْبِلُوهُمْ، وَيَطْرُدُهُمْ مِنَ الْكَنِيسَةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي الإخوة المسيحيين، ويُرجَّح أنهم خدّام أو مبشّرون جوّالون. ويمكن أن يعني الفعل أيضًا: «يرحّب بالإخوة» أو «يضيفهم».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن الضمير يعود إلى الذين يريدون استقبال الإخوة؛ أي إنه يطردهم من الكنيسة أو يخرجهم من جماعتها.
    reason: ambiguity
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: أداة ربط سببية استنتاجية طبيعية، تحفظ إحالة العبارة إلى ما سبق.
- source_word: ὑπομνήσω
  choice: فسألفت الانتباه إلى
  rationale: يناسب السياق الذي يتجاوز مجرد التذكير إلى إبراز أفعال ديوتريفس ومساءلته عنها.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: أعماله التي يعملها
  rationale: يحفظ الجمع وصيغة المضارع الدالة على السلوك الجاري، مع بقاء الصياغة مفهومة.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: إذ يهذي علينا بكلمات شريرة
  rationale: «يهذي» ينقل معنى الكلام الفارغ أو الأحمق في φλυαρέω، و«علينا» تبين وجهته العدائية، فيما تحفظ «كلمات شريرة» وصف πονηροῖς صراحة.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: وإذ لا يكتفي بهذه
  rationale: يحفظ البناء الحالي ومعنى أن إساءته لا تقف عند الكلام المذكور.
- source_word: ἐπιδέχεται τοὺς ἀδελφούς
  choice: يستقبل الإخوة
  rationale: «يستقبل» طبيعي في العربية ويشمل هنا معنى الترحيب والضيافة دون حصره في لفظ واحد أضيق.
- source_word: τοὺς βουλομένους
  choice: الذين يريدون أن يستقبلوهم
  rationale: يُظهر المفعول المفهوم من السياق مع الحفاظ على معنى الإرادة في βούλομαι.
- source_word: κωλύει
  choice: يمنع
  rationale: ينقل معنى العرقلة أو المنع بوضوح، من غير تحديد وسيلة المنع.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: يطردهم من الكنيسة
  rationale: يحفظ قوة فعل الإخراج ومعنى الاستبعاد من جماعة الكنيسة المحلية.
theological_decisions:
- issue: دلالة τοὺς ἀδελφούς في سياق الضيافة الكنسية
  choice: الإخوة
  alternative: المؤمنين أو الإخوة والأخوات
  rationale: الصيغة اليونانية مذكرة، والسياق يرجح الإشارة إلى إخوة مسيحيين جوّالين؛ لذا لم تُحَيَّد الدلالة، مع توضيح الاحتمال السياقي في الحاشية.
- issue: مرجع ضمير المفعول في ἐκβάλλει
  choice: يطردهم، مع إبقاء المرجع محتملًا في النص
  alternative: يطرد الراغبين في استقبال الإخوة تحديدًا
  rationale: أقرب مرجع نحوي هو «الذين يريدون»، لكن اليونانية لا تكرر مفعولًا صريحًا؛ لذلك تُرك الضمير كما هو، وذُكر الترجيح في الحاشية بدل حسمه داخل المتن.
translation_notes:
  register: عربية فصحى واضحة ورصينة. استُعملت «يهذي» لنقل ازدراء الكاتب للكلام الفارغ المؤذي، و«الكنيسة» للدلالة على الجماعة المحلية. وُضعت علامتا الحاشية في المتن، وحُفظت صلة الأفعال بصيغة المضارع للدلالة على السلوك المستمر.
