base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: ar
  text: نال ديمتريوس شهادةً من الجميع[a]، ومن الحق نفسه[b] أيضًا. ونحن أيضًا نشهد له، وأنت تعلم أن شهادتنا صادقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد شُهد له من الجميع». الفعل اليوناني تام مبني للمجهول من «يشهد»، ويدل على شهادة ثابتة له.'
    reason: lexical_alternative
  - marker: b
    text: قد تعني عبارة «الحق نفسه» أن حياة ديمتريوس توافق الحق، أو، على نطاق أوسع، أن الحق أو الإنجيل يشهد له.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: لديمتريوس
  rationale: نُقل الاسم الشخصي صوتيًا بالصيغة العربية المألوفة، وجاءت اللام لتؤدي معنى المفعول غير المباشر في تركيب الشهادة لشخص.
- source_word: μεμαρτύρηται ὑπὸ πάντων
  choice: يشهد لديمتريوس الجميع
  rationale: صيغ المبني للمعلوم طبيعية في العربية وتحفظ معنى المبني للمجهول اليوناني؛ والمضارع يفيد الشهادة المستقرة الناتجة من صيغة التام اليونانية، من غير إضافة وصف «حسنة» غير المصرح به لفظًا.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: والحق نفسه أيضًا
  rationale: حُفظ التشخيص والتوكيد في العبارة اليونانية من غير تضييق «الحق» إلى الإنجيل أو إلى سلوك ديمتريوس.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: ونحن أيضًا نشهد له
  rationale: تفيد «أيضًا» القوة الإضافية للأداتين، وأُظهر متعلق الشهادة بضمير يعود إلى ديمتريوس لسلامة العربية ووضوحها.
- source_word: οἶδας
  choice: أنت تعلم
  rationale: الفعل اليوناني تام في الصورة لكنه حاضر الدلالة في اليونانية الكوينِية.
- source_word: ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν
  choice: شهادتنا صادقة
  rationale: تعبير عربي طبيعي يحافظ على معنى صدق الشهادة، مع أن «حقيقية» بديل حرفي أقل سلاسة هنا.
theological_decisions:
- issue: دلالة «الحق نفسه» في الاستعمال اليوحناوي
  choice: إبقاء العبارة «الحق نفسه» من دون تفسير مقيد
  alternative: الإنجيل نفسه؛ أو حياة ديمتريوس الموافقة للحق تشهد له
  rationale: العبارة تحتمل أن حياة ديمتريوس تتفق مع الحق، كما قد تشير على نطاق أوسع إلى شهادة الحق أو الإنجيل له؛ وإبقاء الصياغة يحفظ الغنى والتوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. اختير البناء المعلوم لطبيعته في العربية، مع الحفاظ على تكرار ألفاظ الشهادة والحق. وُضع مؤشر الحاشية [a] في المتن، ولم تُضف حاشية ثانية لأن موضع الغموض المتعلق بـ«الحق نفسه» هو العبارة السابقة لا جملة «ونحن أيضًا نشهد».
