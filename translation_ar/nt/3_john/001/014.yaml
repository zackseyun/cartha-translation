lexical_decisions:
- source_word: ἐλπίζω
  choice: أرجو
  rationale: ينقل فعل الرجاء أو التوقع الشخصي في خاتمة الرسالة بلغة عربية طبيعية.
- source_word: δὲ
  choice: لكنني
  rationale: تحفظ أداة الاستدراك الانتقال المقابل للكلام السابق عن الكتابة، مع وصل الضمير بالفعل في أسلوب عربي سليم.
- source_word: εὐθέως
  choice: قريبًا
  rationale: المقصود في سياق الزيارة قرب الوقت، لا وقوع الرؤية في الحال بلا مهلة.
- source_word: σε ἰδεῖν
  choice: أن أراك
  rationale: ترجمة مباشرة وطبيعية تفيد اللقاء الشخصي من غير إضافة معنى الزيارة صراحة.
- source_word: στόμα πρὸς στόμα
  choice: فمًا لفم
  rationale: يحفظ الصورة اليونانية الأصلية الواضحة في العربية، مع شرح دلالتها الاصطلاحية في الحاشية بدل استبدالها بصيغة تفسيرية داخل النص.
- source_word: λαλήσομεν
  choice: فنتحدث
  rationale: صيغة المتكلم الجمع تحفظ معنى المستقبل المتوقع، والفاء تربط الحديث باللقاء المرتقب ربطًا عربيًا طبيعيًا.
