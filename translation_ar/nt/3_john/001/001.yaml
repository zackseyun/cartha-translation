    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: الشيخ
  rationale: تؤدي اللفظة هنا وظيفة تعريف المرسِل بنفسه، و«الشيخ» تحافظ على دلالة المكانة أو الخدمة من غير فرض مصطلح كنسي تقني، ولا تختزلها في مجرد كِبَر السن.
- source_word: Γαΐῳ
  choice: غايوس
  rationale: نقل صوتي عربي شائع للاسم اليوناني Γάϊος.
- source_word: τῷ ἀγαπητῷ
  choice: الحبيب
  rationale: تعبير مودة يحافظ على الصلة اللفظية بالفعل «أحبّه» الوارد بعده.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: الذي أنا أحبّه
  rationale: يعكس ضمير الوصل بوصفه مفعولًا به، ويحافظ بقدر طبيعي على بروز الضمير اليوناني الصريح ἐγώ.
- source_word: ἐν ἀληθείᾳ
  choice: في الحقّ
  rationale: يحافظ على صياغة العبارة وعلى صداها في كتابات يوحنا، ويترك مفتوحًا احتمال الإخلاص في المحبة واحتمال كونها قائمة في حق الإنجيل.
theological_decisions:
- issue: دلالة ἀλήθεια في العبارة الختامية
  choice: في الحقّ
  alternative: حقًّا
  rationale: قد تدل العبارة على صدق المحبة وإخلاصها، أو على محبتها القائمة في الحق الإلهي/حق الإنجيل، أو تجمع المعنيين. لذلك لم يُحسم التوتر الدلالي لصالح معنى واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل تركيب الرسائل «مِنَ الشيخ إلى...» ليكون طبيعيًا بالعربية مع الحفاظ على بنية الافتتاح اليوناني، وحُفظ التكرار بين «الحبيب» و«أحبّه» لما له من أثر مقصود في الأصل.
