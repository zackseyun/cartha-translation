  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: ar
  text: وقد شهدوا أمام الكنيسة بمحبتك، وستُحسن صنعًا إن شيّعتهم في طريقهم[a] بما يليق بالله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أرسلتهم في طريقهم»؛ قد يتضمن الفعل اليوناني أيضًا إعانة المسافرين بما يحتاجون إليه لمواصلة الرحلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: شهدوا
  rationale: ينقل صيغة الماضي اليونانية بوصفها فعلًا تم، ويحفظ معنى الإخبار والشهادة دون إثقال الأسلوب.
- source_word: σου τῇ ἀγάπῃ
  choice: بمحبتك
  rationale: الباء مع «شهدوا» تعبر طبيعيًا عن مضمون الشهادة، أي إنهم أخبروا الكنيسة بمحبة غايس.
- source_word: ἐνώπιον ἐκκλησίας
  choice: أمام الكنيسة
  rationale: ترجمة موجزة وطبيعية تفيد أن الشهادة جرت في حضور جماعة المؤمنين.
- source_word: καλῶς ποιήσεις
  choice: ستُحسن صنعًا
  rationale: تحفظ صيغة المستقبل ونبرة الحث المهذب في التعبير اليوناني الاصطلاحي.
- source_word: προπέμψας
  choice: إن جهزتهم لمواصلة سفرهم
  rationale: يعبّر عن إرسال المسافرين في طريقهم مع ما قد يلزمهم من عون، مع إبقاء مدى هذا العون غير محدد؛ وتوضح الحاشية البديل الأقرب إلى ظاهر الفعل.
- source_word: ἀξίως τοῦ θεοῦ
  choice: بما يليق بالله
  rationale: صياغة عربية واضحة تحفظ كون الله معيارًا للطريقة التي ينبغي أن يُعامَلوا بها.
theological_decisions:
- issue: دلالة προπέμπω في سياق الضيافة المسيحية
  choice: جهزتهم لمواصلة سفرهم
  alternative: شيعتهم في طريقهم؛ أعنتهم في رحلتهم
  rationale: قد يدل الفعل على إرسال المسافرين ومساعدتهم عمليًا لمتابعة الطريق، لا على مجرد توديعهم. تحفظ الصياغة هذا الاتساع، وتبيّن الحاشية إمكان التعبير البديل دون افتراض نوع محدد من الدعم.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «ستُحسن صنعًا» للحفاظ على الحث المهذب، و«الكنيسة» للدلالة على جماعة المؤمنين المجتمعة. وُضع مؤشر الحاشية عند العبارة التي تشرحها، لا عند «محبتك».
