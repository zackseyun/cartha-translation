  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: ar
  text: أيها الحبيب[a]، أصلّي أن تسير أمورك على ما يرام في كل شيء[b]، وأن تكون بصحّة جيدة[c]، كما تسير أمور نفسك على ما يرام[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا حبيبي».
    reason: lexical_alternative
  - marker: b
    text: أو «من جميع الوجوه». والترجمة التقليدية «قبل كل شيء» أقل ترجيحًا، لأن اليونانية تدل على النطاق أكثر مما تدل على الأولوية.
    reason: alternative_reading
  - marker: c
    text: أو «وأن تتمتّع بصحّة جيدة».
    reason: lexical_alternative
  - marker: d
    text: أو «كما أن نفسك في خير»، أو «كما أن إنسانك الباطن يسير على ما يرام».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: يا حبيبي
  rationale: نداء مفرد يحمل المودّة، ويحافظ على صلة اللفظ بالمحبّة، وهو طبيعي وواضح في العربية المعاصرة.
- source_word: περὶ πάντων
  choice: في كل شيء
  rationale: يفيد نطاق الدعاء، أي من جميع الوجوه أو في شتى الأمور، لا معنى الأولوية الذي قد يفهم من «قبل كل شيء».
- source_word: εὔχομαί
  choice: أصلّي
  rationale: الفعل في هذا السياق الرسائلي يجمع معنى التمنّي والدعاء؛ واختيار «أصلّي» يحفظ دلالته الدينية.
- source_word: σε εὐοδοῦσθαι
  choice: أن تكون بخير
  rationale: يفيد أن تسير أمور المخاطَب على ما يرام وأن يحظى بالعافية والنجاح عمومًا، من غير حصره في الازدهار المالي.
- source_word: ὑγιαίνειν
  choice: أن تتمتّع بصحّة جيدة
  rationale: يشير هنا بوضوح إلى الصحة الجسدية، وهذه صياغة عربية طبيعية.
- source_word: καθὼς
  choice: كما
  rationale: أداة مقارنة تصل بين خير حال المخاطَب العام والجسدي وبين خير حال نفسه.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: نفسك بخير
  rationale: يحافظ على تكرار معنى حسن الحال الوارد في الفعل نفسه سابقًا، بصياغة عربية سليمة.
- source_word: ψυχή
  choice: نفسك
  rationale: «النفس» تقابل اللفظ اليوناني مع إبقاء سعته الدلالية بين النفس والحياة والكيان الباطن، من غير فرض تقسيم أنثروبولوجي تقني.
theological_decisions:
- issue: دلالة περὶ πάντων في الدعاء الافتتاحي
  choice: في كل شيء، للدلالة على النطاق
  alternative: قبل كل شيء، للدلالة على الأولوية
  rationale: التركيب اليوناني هنا أرجح في التعبير عن شمول المجالات التي يتناولها الدعاء، لا عن ترتيب الدعاء بوصفه أولوية عليا.
- issue: طبيعة الخير الذي يدل عليه εὐοδοῦσθαι
  choice: أن تكون بخير
  alternative: أن تزدهر أو تنجح
  rationale: يحفظ الاختيار معنى حسن الحال واتساعه، ولا يحصر العبارة في الثراء أو النجاح المادي، وهو حصر لا يقتضيه النص.
- issue: دلالة ψυχή
  choice: النفس
  alternative: الحياة أو الإنسان الباطن
  rationale: «النفس» تحفظ التوتر بين دلالات الحياة والذات الباطنة من غير تقرير مذهب تفصيلي في تكوين الإنسان.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «يا حبيبي» بوصفه نداءً رسائليًا حميمًا، و«أن تكون بخير» لتجنب إيحاء مادي ضيق قد تحمله كلمة «تزدهر»، مع إبقاء المقارنة اللفظية بين حال الشخص وحال نفسه.
