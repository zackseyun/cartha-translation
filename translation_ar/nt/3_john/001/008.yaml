base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: ar
  text: لذلك ينبغي لنا أن نستقبل أمثال هؤلاء[a]، لكي نصير شركاء في العمل لأجل الحق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يدل الفعل أيضًا على الترحيب بأمثال هؤلاء وإعانتهم، بما في ذلك إكرام ضيافتهم وتقديم الدعم العملي لهم.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مع الحق» أو «في الحق». يمكن فهم الداتيف اليوناني بأكثر من وجه؛ وقد اختار المتن معنى الاشتراك في العمل لخدمة قضية الحق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: علينا
  rationale: أُدمج الضمير الصريح في تركيب «علينا» الطبيعي بالعربية، مع بقاء دلالة المتكلمين والتوكيد السياقي في مقابلة موقف ديوتريفس.
- source_word: οὖν
  choice: إذًا
  rationale: تفيد النتيجة المستخلصة مما سبق، وتلائم موقع الأداة بعد صدر الجملة في العربية المعاصرة.
- source_word: ὀφείλομεν
  choice: علينا أن
  rationale: ينقل معنى الالتزام الأخلاقي بوضوح من غير تهويل قوة العبارة أو إضعافها.
- source_word: ὑπολαμβάνειν
  choice: نستقبل
  rationale: يلائم سياق قبول الخدام المتنقلين وإكرام ضيافتهم، ويمكن في هذا السياق أن يشمل إعانتهم عمليًا وماديًا؛ وقد بُيّن هذا الاتساع في الحاشية.
- source_word: τοὺς τοιούτους
  choice: أمثال هؤلاء
  rationale: إحالة عربية طبيعية إلى أشخاص من النوع المذكور في السياق السابق، من غير إضافة تخصيص غير مصرّح به في العبارة نفسها.
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر بوضوح عن الغاية أو النتيجة المقصودة.
- source_word: συνεργοὶ
  choice: عاملين معًا
  rationale: يحفظ معنى المشاركة الفعلية في العمل، وهو تعبير واضح وطبيعي للقارئ العربي.
- source_word: γινώμεθα
  choice: نصير
  rationale: 'يحفظ دلالة الصيرورة: فباستقبال هؤلاء وإعانتهم يدخل المؤمنون في المشاركة بعملهم.'
- source_word: τῇ ἀληθείᾳ
  choice: لأجل الحق
  rationale: يفهم صيغة المجرور اليونانية هنا على أنها تدل على الجهة أو القضية التي يخدمها العمل المشترك، مع إبقاء الاحتمالات النحوية الأخرى في الحاشية.
theological_decisions:
- issue: دلالة τῇ ἀληθείᾳ وعلاقتها بـ συνεργοὶ
  choice: '«لأجل الحق»: المشاركة في العمل الذي يخدم الحق وينصر قضيته'
  alternative: «مع الحق» أو «في الحق»
  rationale: السياق المباشر يتناول إعانة الذين خرجوا من أجل الاسم؛ ومن ثم فاستقبالهم يجعل الداعمين مشاركين في العمل لأجل الحق. لكن صيغة المجرور اليونانية تحتمل أيضًا معنى المصاحبة أو المجال، ولذلك لم تُطمس هذه المرونة بل ذُكرت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «إذًا» للربط الاستنتاجي، و«أمثال هؤلاء» للإحالة الطبيعية، واحتُفظ بالتوتر الدلالي في العبارة الأخيرة بواسطة حاشية صريحة. وُضعت علامتا الحاشيتين في المتن عند اللفظتين المعنيتين.
