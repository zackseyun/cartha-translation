  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: ar
  text: لِأَنَّهُمْ خَرَجُوا مِنْ أَجْلِ الْاِسْمِ، مِنْ غَيْرِ أَنْ يَأْخُذُوا شَيْئًا مِنَ الْأُمَمِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الوثنيين»، أو «غير المؤمنين».'
    reason: بدائل معجمية سياقية للمصطلح اليوناني ἐθνικῶν.
lexical_decisions:
- source_word: ὑπὲρ
  choice: مِنْ أَجْلِ
  rationale: تفيد ὑπέρ مع المضاف إليه هنا السبب أو الغاية، لا النيابة؛ وهذه العبارة تنقل دافع خروجهم بوضوح وطبيعية.
- source_word: τοῦ ὀνόματος
  choice: الِاسْمِ
  rationale: يحافظ التعبير على الصيغة التوقيرية «الاسم» التي تشير ضمنًا إلى يسوع أو الرب، من غير إضافة مرجع صريح غير مذكور في اليونانية.
- source_word: ἐξῆλθον
  choice: خَرَجُوا
  rationale: ينقل الفعل الماضي بصياغة عربية مباشرة، ويلائم سياق انطلاقهم للخدمة أو السفر.
- source_word: μηδὲν λαμβάνοντες
  choice: وَلَمْ يَأْخُذُوا شَيْئًا
  rationale: تحويل اسم الفاعل اليوناني إلى جملة فعلية منفية طبيعي في العربية، مع إبقاء معنى عدم أخذ أي عون مادي.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: مِنَ الْأُمَمِ
  rationale: يحافظ «الأمم» على التلوين القومي والديني للمصطلح في الإطار اليهودي المسيحي المبكر، مع بيان البدائل السياقية في الحاشية.
theological_decisions:
- issue: مرجع «الاسم»
  choice: الإبقاء على الإشارة التوقيرية الضمنية «الاسم»
  alternative: «اسم المسيح» أو «اسمه»
  rationale: لا يصرّح النص اليوناني بالمرجع، وإن كان سياق الرسالة يجعل الإشارة إلى يسوع أو الرب مفهومة؛ لذلك لا تضيف الترجمة اسمًا غير موجود في الأصل.
- issue: دلالة ἐθνικῶν
  choice: «الأمم» في المتن
  alternative: «الوثنيين» أو «غير المؤمنين»
  rationale: «الأمم» أقرب إلى البنية المعجمية والمنظور التاريخي في النص، بينما يبرز البديلان دلالة الغرباء عن الإيمان المسيحي في هذا السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. وُضعت علامة الحاشية بعد «الأمم» لأنها تتعلق بهذا اللفظ، مع الحفاظ على إيجاز الآية وبنيتها السببية.
