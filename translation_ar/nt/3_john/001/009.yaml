  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: ar
  text: كتبتُ شيئًا إلى الكنيسة[a]، لكن ديوتريفس، الذي يحب أن يكون الأول بينهم، لا يقبلنا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كتبتُ رسالة قصيرة إلى الكنيسة». يستعمل النص اليوناني تعبيرًا غير محدد («كتبتُ شيئًا»)، وقد وسّعت بعض المخطوطات العبارة.'
    reason: textual_variant
  - marker: b
    text: 'أو: «لا يرحب بنا» أو «لا يعترف بنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: كتبتُ
  rationale: صيغة الماضي اليونانية تدل هنا بصورة طبيعية على فعل ماضٍ، ولا يقتضي السياق تحويلها إلى «قد كتبتُ».
- source_word: τι
  choice: شيئًا
  rationale: الضمير اليوناني النكرة المحايد يعني في أقرب دلالاته «شيئًا»، وبذلك لا نضيف مفعولًا أكثر تحديدًا مما يورده النص.
- source_word: τῇ ἐκκλησίᾳ
  choice: إلى الكنيسة
  rationale: تشير الكلمة في هذا السياق إلى جماعة المؤمنين المحلية، و«الكنيسة» هي العبارة العربية المألوفة والواضحة.
- source_word: ἀλλ’
  choice: لكن
  rationale: تنقل المقابلة القوية بين كتابة صاحب الرسالة وموقف ديوتريفس بصياغة عربية طبيعية.
- source_word: ὁ φιλοπρωτεύων
  choice: الذي يحب أن يكون الأول
  rationale: تنقل العبارة ميل ديوتريفس إلى طلب المقام الأول، وتحافظ على قوتها الأخلاقية من غير استعمال تعبير كنسي اصطلاحي أو قديم.
- source_word: αὐτῶν
  choice: بينهم
  rationale: تبيّن الجماعة التي يريد ديوتريفس أن يحتل المكان الأول فيها، من غير الجزم بأنه يملك سلطة رسمية عليهم.
- source_word: Διοτρέφης
  choice: ديوتريفس
  rationale: نقل صوتي واضح للاسم اليوناني وفق الاستعمال العربي الشائع في ترجمات الكتاب المقدس.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: لا يقبلنا
  rationale: الفعل يحتمل القبول أو الترحيب أو الاعتراف؛ و«لا يقبلنا» يحافظ على هذا الاتساع الدلالي أكثر من البدائل الأضيق.
theological_decisions:
- issue: طبيعة معارضة ديوتريفس
  choice: لا يقبلنا
  alternative: لا يرحب بنا؛ لا يعترف بنا
  rationale: لا يحسم النص هل المقصود أساسًا رفض الضيافة أم رفض الأشخاص أم عدم الاعتراف بمكانتهم وسلطانهم. لذلك تُرك التعبير واسعًا حفاظًا على التوتر الدلالي واللاهوتي في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت العبارة النكرة «شيئًا» رغم غرابتها النسبية لأنها تعكس قراءة SBLGNT، ووُضع البديل الأكثر سلاسة في الحاشية. كما استُعمل «بينهم» بدل «عليهم» تجنبًا لافتراض بنية سلطة لا يصرح بها النص.
