  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: ar
  text: 'ليس لي فرح أعظم من هذا: أن أسمع أن أولادي يسلكون في الحق[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «ليس لي فرح أعظم من هذه الأمور».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن «أولادي» تشير إلى أبناء الكاتب الروحيين، أي المؤمنين الذين كانوا تحت رعايته.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν ... χαράν
  choice: فرح أعظم
  rationale: يحفظ صيغة المقارنة وتعبير نفي وجود فرح يفوق هذا، بعبارة عربية طبيعية.
- source_word: τούτων
  choice: من هذا
  rationale: هي في اليونانية صيغة جمع حرفيًا، لكن ما يلي يبيّن الأمر الذي يشكّل هذا الفرح؛ لذا جاء المفرد طبيعيًا في العربية، مع إثبات الحرفي في الحاشية.
- source_word: ἵνα ἀκούω
  choice: أن أسمع أن
  rationale: تفيد العبارة هنا مضمون الفرح، لا الغاية على نحو صارم؛ والتركيب المختار واضح وطبيعي.
- source_word: τὰ ἐμὰ τέκνα
  choice: أولادي
  rationale: يحفظ الاستعارة العائلية من غير أن يحسم في المتن هل المقصود أولاد حرفيون أم روحيون.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: في الحق
  rationale: يحفظ التعريف والاتساع اليوحناوي الذي يجمع بين الحق المعلَن والسلوك المتوافق معه، دون اختزاله إلى الصدق أو صحة التعليم وحدها.
- source_word: περιπατοῦντα
  choice: يسلكون
  rationale: يحفظ استعارة المشي للدلالة على نهج الحياة، وهي عبارة كتابية عربية مفهومة وموجزة.
theological_decisions:
- issue: هل τέκνα تعني الأولاد حرفيًا أم الأولاد الروحيين؟
  choice: الإبقاء على «أولادي» في المتن.
  alternative: «أولادي الروحيون» أو «الذين آمنوا على يدي».
  rationale: يرجّح السياق معنى الأولاد الروحيين، لكن اللفظ اليوناني نفسه عائلي عام؛ فالإبقاء عليه يصون الاستعارة ولا يضيّق الدلالة داخل المتن.
- issue: دلالة ἐν τῇ ἀληθείᾳ
  choice: «في الحق».
  alternative: «بصدق» أو «وفق التعليم الحق».
  rationale: يحتمل الاستعمال اليوحناوي البعدين العقائدي والسلوكي معًا؛ وهذه الصياغة تحفظ هذا الاتساع والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يسلكون» حفاظًا على الاستعارة الكتابية، و«في الحق» لصون الاتساع الدلالي في الأصل.
