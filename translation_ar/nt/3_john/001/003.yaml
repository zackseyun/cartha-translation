source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: ar
  text: لأنني فرحتُ جدًا حين جاء إخوةٌ[a] وشهدوا للحق الذي فيك[b][c]، كما أنك تسلك في الحق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تشير كلمة «إخوة» هنا إلى المؤمنين رفاق الإيمان، وربما شملت رجالًا ونساءً؛ واللفظ اليوناني مذكّر جمعًا.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وشهدوا لأمانتك للحق».'
    reason: alternative_reading
  - marker: c
    text: 'حرفيًا: «وشهدوا لحقّك».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: لأنني فرحتُ جدًا
  rationale: ينقل الفعل بمعناه الفاعل وقوة الظرف، ويحفظ وظيفة γὰρ التفسيرية بوصل الآية بما قبلها.
- source_word: ἐρχομένων ἀδελφῶν
  choice: حين جاء إخوةٌ
  rationale: يصوغ تركيب اسم الفاعل في المضاف إليه بوصفه ظرفًا زمنيًا واضحًا، ويحافظ على اللفظ العائلي المسيحي «إخوة».
- source_word: μαρτυρούντων
  choice: وشهدوا
  rationale: يحفظ دلالة الشهادة في الفعل اليوناني، بدل تخفيفها إلى مجرد الإخبار.
- source_word: σου τῇ ἀληθείᾳ
  choice: للحق الذي فيك
  rationale: صياغة عربية طبيعية نسبيًا تحافظ على صلة الحق بالمخاطَب، من غير أن توحي بأن له «حقًا» خاصًا مخالفًا للحق؛ وتُذكر الاحتمالات الأخرى في الحواشي.
- source_word: καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς
  choice: كما أنك تسلك في الحق
  rationale: يحفظ أداة المطابقة، وتوكيد الضمير، واستعارة السلوك الأخلاقي، كما يحافظ على تكرار «الحق» في الأسلوب اليوحناوي.
theological_decisions:
- issue: مدلول «الحق» في السياق الأخلاقي اليوحناوي
  choice: إبقاء «الحق» في الموضعين
  alternative: الأمانة للحق؛ أو الاستقامة
  rationale: لا يحصر النص في صدق العقيدة وحده ولا في السلوك الأخلاقي وحده، بل يحفظ التوتر بين الحق المُعتنَق والحق المَعِيش.
- issue: علاقة ضمير المخاطَب بالحق في σου τῇ ἀληθείᾳ
  choice: الحق الذي فيك
  alternative: 'ثباتك في الحق؛ أو حرفيًا: حقك'
  rationale: يحفظ ارتباط الحق بغايس دون جعله حقيقة ذاتية خاصة به، مع إبقاء القراءة التي تركز على أمانته للحق في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة «تسلك في الحق» لما لها من أهمية أسلوبية ولاهوتية في كتابات يوحنا، مع تجنب التعبير «حقك» في المتن لأنه قد يُفهم عربيًا بمعنى الاستحقاق أو الملكية القانونية.
