lexical_decisions:
- source_word: Ἀγαπητέ
  choice: يا حبيبي
  rationale: نداء مفرد مذكر يحمل المودة. يحفظ «يا حبيبي» دفء الخطاب اليوحناوي، وهو واضح وطبيعي في العربية المعاصرة.
- source_word: μὴ μιμοῦ
  choice: لا تقتدِ
  rationale: فعل أمر منفي يدل على عدم اتخاذ الشيء مثالًا يُتَّبع. «لا تقتدِ» ينقل معنى المحاكاة الأخلاقية بصورة أفصح وأطبع من التعبير الحرفي «لا تقلّد» في هذا السياق.
- source_word: τὸ κακὸν
  choice: بالشر
  rationale: الصفة المحايدة المعرّفة مستعملة استعمال الاسم للدلالة على الشر بوصفه فئة أخلاقية عامة، لا على فعل شرير واحد.
- source_word: τὸ ἀγαθόν
  choice: بالخير
  rationale: يقابل «الشر» ويحفظ التقابل الأخلاقي العام والموجز في اليونانية.
- source_word: ὁ ἀγαθοποιῶν
  choice: من يفعل الخير
  rationale: اسم الفاعل اليوناني حاضر ومستعمل استعمال الاسم. هذه الصياغة تحفظ دلالة السلوك الجاري أو المميّز للشخص من غير أن تحصرها في فعل منفرد.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: فهو من الله
  rationale: تحفظ «من» دلالة المصدر أو الانتماء في التعبير اليوحناوي، مع إضافة فاء الربط لتكون الجملة طبيعية في العربية.
- source_word: ὁ κακοποιῶν
  choice: من يفعل الشر
  rationale: يحافظ على التوازي مع «من يفعل الخير»، وعلى احتمال الدلالة على الممارسة المستمرة أو السلوك المميّز.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: لم يرَ الله
  rationale: ينقل الفعل اليوناني بصورته الصريحة ويحفظ اللغة اللاهوتية اليوحناوية. لم يُستبدل به «لم يعرف الله»، لأن ذلك تفسير يتجاوز اللفظ المباشر.
theological_decisions:
- issue: دلالة ربط السلوك الأخلاقي بالعلاقة بالله في التعبير اليوحناوي
  choice: الإبقاء على عبارتي «من الله» و«لم يرَ الله» كما هما في منطق النص
  alternative: تفسيرهما صراحةً على أنهما يشيران إلى الولادة الجديدة، أو إلى حكم منهجي شامل بشأن كل علاقة سابقة بالله
  rationale: يعرض النص السلوك بوصفه كاشفًا روحيًا، لكنه يفعل ذلك بمصطلحاته اليوحناوية الخاصة. لذلك تحافظ الترجمة على حدة التحذير والتوتر اللاهوتي من غير إدخال صياغة مذهبية لاحقة أو تخفيف العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «يا حبيبي» للمودة الشخصية، و«تقتدِ» لإبراز معنى اتخاذ المثال الأخلاقي، مع الحفاظ على الإيجاز والتوازي في الأصل.
