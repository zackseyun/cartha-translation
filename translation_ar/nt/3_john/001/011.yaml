  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: ar
  text: أيها الحبيب، لا تقتدِ بالشر، بل بالخير. من يفعل الخير[a] فهو من الله؛ ومن يفعل الشر لم يرَ الله.
  philosophy: optimal-equivalence
  footnotes:
