lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: سلام لك
  rationale: يحافظ على إيجاز البركة الختامية اليونانية وعلى دلالة حرف الجر غير المصرّح به في تركيب الداتيف، وهو تعبير عربي واضح ومهيب.
- source_word: ἀσπάζονταί σε
  choice: يسلّم عليك
  rationale: صياغة رسائلية عربية طبيعية تنقل فعل تقديم السلام، وتحافظ على المخاطب المفرد.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: الأصدقاء
  rationale: ينقل φίλοι مباشرةً ويحافظ على تكراره، من غير استبداله بتعبير كنسي مثل «الإخوة» أو إضافة ضمير ملكية غير موجود.
- source_word: κατ’ ὄνομα
  choice: واحدًا واحدًا بأسمائهم
  rationale: يبين أن المقصود تحية شخصية لكل فرد بالاسم، مع إبقاء صورة «الاسم» الواردة في الأصل؛ فالترجمة الحرفية «بحسب الاسم» غير طبيعية في العربية الحديثة.
