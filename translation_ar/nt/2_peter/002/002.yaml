  verdict: approve
  source_fidelity: 'النص العربي ينقل بدقة البنية الأساسية للأصل: الاستقبال في «سيتبع»، والكثرة في «كثيرون»، والتبعية لممارسات الفجور المنسوبة إلى الغير، والسببية في «بسببهم»، ثم المبني للمجهول وقوة βλασφημηθήσεται في «سيُجدَّف على». وتحفظ «بسببهم» عدم الحسم التفسيري في مرجع الضمير، وهو مناسب في ضوء إمكان اتصال المرجع بالمعلمين المذكورين في السياق أو بالذين يتبعونهم.'
  naturalness: 'العبارة فصيحة معاصرة وواضحة: «وسيتبع كثيرون فجورهم، وبسببهم سيُجدَّف على طريق الحق» سليمة التركيب، موجزة، وذات سجل وقور ملائم للنص. واستعمال «سيُجدَّف على» عربي طبيعي في هذا السياق.'
  terminology: «فجورهم» مقابل واسع وجاد لـἀσελγείαις، ولا يقصره على الدلالة الجنسية مع عدم إلغاء إيحاءاتها. و«طريق الحق» يحفظ استعارة الطريق وإضافة الحقيقة/الحق في الأصل بصورة عربية مألوفة، من غير فرض تعريف مذهبي. الحاشية (أ) تقدم بدائل معقولة، والحاشية (ب) تبيّن الدلالة السياقية مع إبقاء البديل الترجمـي.
