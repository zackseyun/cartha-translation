reference: 2 Peter 2:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: ar
  text: وسيتبع كثيرون فجورهم[a]، وبسببهم سيُجدَّف على طريق الحق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خلاعتهم» أو «انحلالهم». يدل اللفظ اليوناني على سلوك وقح منفلت من القيود، وغالبًا ما يحمل إيحاءات جنسية.
    reason: lexical_alternative
  - marker: b
    text: 'أي طريق الإيمان الحق والحياة الموافقة له. ويمكن أيضًا ترجمتها: «طريق الحقيقة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرون
  rationale: مقابل عربي طبيعي يحفظ الدلالة الكمية من غير مبالغة.
- source_word: ἐξακολουθήσουσιν
  choice: سيتبع
  rationale: يحفظ معنى المضي وراء أشخاص أو الاقتداء بمسلكهم، مع إبقاء قوة المستقبل.
- source_word: αὐτῶν ταῖς ἀσελγείαις
  choice: فجورهم
  rationale: «الفجور» يدل على السلوك الوقح المنفلت أخلاقيًا، وقد يشمل الانحلال الجنسي دون حصر اللفظ فيه. وصيغة الجمع اليونانية جُمعت في اسم جنس عربي طبيعي.
- source_word: δι’ οὓς
  choice: بسببهم
  rationale: διά مع النصب تفيد السببية هنا، والضمير يرجع بصورة طبيعية إلى أولئك الذين يتبعون هذا الفجور، مع بقاء احتمال الصلة الأوسع بأصحاب التعليم الكاذب في السياق.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: طريق الحق
  rationale: صياغة عربية فصيحة تحفظ استعارة الطريق والإضافة، وتشير في السياق إلى الإيمان الحق ومسلكه دون تحويل العبارة إلى شرح مذهبي.
- source_word: βλασφημηθήσεται
  choice: سيُجدَّف على
  rationale: مقابل مباشر للفعل اليوناني المبني للمجهول، ويحفظ شدة الكلام المسيء الموجَّه إلى ما هو مقدس؛ والتعدية بـ«على» عربية مألوفة.
theological_decisions:
- issue: مرجع «طريق الحق» ودلالته
  choice: الإبقاء على العبارة الاستعارية «طريق الحق» بوصفها على الأرجح تسمية للإيمان الحق والحياة الموافقة له.
  alternative: «الطريق الحق» أو شرحها بعبارة «الإيمان المسيحي».
  rationale: تحفظ الصياغة بنية الإضافة واتساع التعبير، ولا تختزله في تعريف عقائدي أضيق.
- issue: النطاق الأخلاقي للفظ ἀσέλγεια
  choice: «فجورهم» للدلالة على الانفلات الوقح أخلاقيًا، بما فيه الإيحاء الجنسي المحتمل.
  alternative: «خلاعتهم» أو «انحلالهم».
  rationale: «الفجور» مفهوم وجاد وواسع الدلالة، فلا يقصر اللفظ على السلوك الجنسي وحده ولا يخفف حدته.
- issue: مرجع الضمير في δι’ οὓς
  choice: 'ترجمة الضمير ترجمة غير تفسيرية: «بسببهم».'
  alternative: تعيينه صراحة بأنه يعود إلى المعلمين الكذبة أو إلى أتباعهم.
  rationale: التركيب يسمح بأن يكون الأقرب نحويًا هم الكثيرون الذين يتبعون، بينما يربط السياق الإساءة أيضًا بالمعلمين الكذبة؛ لذلك لم يُحسم المرجع في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «سيُجدَّف على» للمحافظة على قوة اللفظ الديني، و«طريق الحق» بوصفها عبارة عربية طبيعية تحفظ استعارة الأصل. وُضعت علامتا الحاشيتين في المتن بحسب موضعيهما.
