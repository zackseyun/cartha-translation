base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: ar
  text: 'لكنه تلقّى توبيخًا بسبب تعدّيه هو: فقد نطقت دابّةُ حملٍ بكماء[a] بصوت إنسان[b]، فكبحت جنون النبي.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «دابّة حمل»؛ والمقصود أتان بلعام (العدد 22: 28–30).'
    reason: cross_reference
  - marker: b
    text: 'أو: «بصوت رجل». والأرجح أن اليونانية تعني «بصوت إنسان»، في مقابلة بين الحيوان والمتكلم البشري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: توبيخًا
  rationale: ينقل معنى اللوم والتقريع في السياق، وهو تعبير عربي واضح وطبيعي.
- source_word: ἰδίας παρανομίας
  choice: على تعدّيه
  rationale: «التعدّي» يصون دلالة مخالفة الحد أو الشرع، والضمير يعبّر عن ἰδίας الدالة على مسؤوليته الشخصية.
- source_word: ὑποζύγιον
  choice: حيوانُ حملٍ
  rationale: يحافظ على اللفظ اليوناني العام الدال على الحيوان الذي يحمل الأثقال، من غير تخصيصه في المتن بأنه أتان.
- source_word: ἄφωνον
  choice: أبكمُ
  rationale: يدل على انعدام القدرة على الكلام، ويبرز المفارقة في نطق الحيوان.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: بصوت إنسان
  rationale: يعبر عن وسيلة أو هيئة النطق، ويحفظ المقابلة بين الحيوان والإنسان دون تخصيص جنسي غير مقصود.
- source_word: φθεγξάμενον
  choice: نطق
  rationale: يفيد إصدار كلام مفهوم، وهو أدق هنا من مجرد إخراج صوت.
- source_word: ἐκώλυσεν
  choice: فكبح
  rationale: ينقل معنى المنع أو الإيقاف بصورة طبيعية تلائم كبح مسار النبي غير العاقل.
- source_word: παραφρονίαν
  choice: جنون
  rationale: يحفظ قوة اللفظ اليوناني الدال على اختلال الرشد، ولا يضعفه إلى مجرد حماقة.
- source_word: τοῦ προφήτου
  choice: النبي
  rationale: يحافظ على وصف بلعام في النص بصفته النبي، من غير أن يتضمن ذلك تزكية لسلوكه.
theological_decisions:
- issue: هل يُخصَّص ὑποζύγιον بأنه أتان بلعام؟
  choice: الإبقاء على التعبير العام «حيوان حمل» في المتن
  alternative: أتان
  rationale: سياق العدد 22 يبيّن أن المقصود أتان بلعام، لكن اليونانية هنا تستعمل اسمًا عامًا لا اللفظ الخاص بالأتان؛ لذا حُفظ عموم الأصل ووُضح المرجع في الحاشية.
- issue: دلالة ἀνθρώπου في العبارة ἐν ἀνθρώπου φωνῇ
  choice: إنسان
  alternative: رجل
  rationale: المقابلة هنا بين صوت بشري وحيوان أبكم، لا بين الذكر والأنثى؛ ولذلك «إنسان» أدق في نقل المقصود.
translation_notes:
  register: صياغة عربية فصحى حديثة ومهيبة، مع تقديم الفعل «نطق» لتجنب ثقل تراكم الصفات والحال، والإبقاء على المفارقة المركزية بين بكم الحيوان ونطقه البشري.
