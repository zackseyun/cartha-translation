  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: ar
  text: في حين أن الملائكة، مع أنهم أعظم قوةً وقدرةً، لا يصدرون ضدهم[b] حكمًا مسيئًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حكمًا تجديفيًا» أو «حكمًا شاتمًا» أو «حكمًا مفتريًا». يمكن أن تصف الكلمة اليونانية كلامًا مسيئًا أو شاتمًا أو مفتريًا.'
    reason: lexical_alternative
  - marker: b
    text: يرجح أن يعود الضمير «ضدهم» إلى «أصحاب الأمجاد» في الآية السابقة، لكن بطرس لا يحدد هويتهم هنا بمزيد من التصريح.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: في حين أن
  rationale: تؤدي هنا وظيفة الربط التقابلي مع الآية السابقة أكثر من الدلالة المكانية الحرفية.
- source_word: ἄγγελοι
  choice: الملائكة
  rationale: السياق يدل على كائنات سماوية، لا على رسل من البشر.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: قوةً وقدرةً
  rationale: يحافظ اللفظان على التقوية الناتجة من اقتران اسمين متقاربين، ويبينان المجال الذي فيه الملائكة أعظم.
- source_word: μείζονες ὄντες
  choice: مع أنهم أعظم
  rationale: 'يفهم التركيب الوصفي هنا على وجه الاستدراك: فعلى الرغم من عظمة الملائكة، لا يفعلون ما يفعله المذكورون في السياق.'
- source_word: οὐ φέρουσιν
  choice: لا يرفعون
  rationale: الفعل مع «حكم» يفيد تقديم الحكم أو إيراده ضد أحد، وتعبير «يرفعون حكمًا» يحافظ على النبرة القضائية.
- source_word: κατ’ αὐτῶν
  choice: عليهم
  rationale: يحافظ الضمير على الإحالة غير المصرح بتحديدها في اليونانية، من غير تعيين هوية مرجعه داخل النص.
- source_word: βλάσφημον
  choice: ينطوي على افتراء
  rationale: يمكن أن يدل الوصف على الكلام المسيء أو الشاتم أو المفتري؛ واختيار «افتراء» يبرز طابع القول الذي ينال من الآخرين من غير حصره في التجديف على الله.
- source_word: κρίσιν
  choice: حكمًا
  rationale: اللفظ يدل هنا على تقدير أو حكم ذي صبغة قضائية، و«حكم» أوسع المقابلات العربية وأوضحها.
theological_decisions:
- issue: مرجع الضمير في αὐτῶν وصلته بـ«أصحاب الأمجاد» في الآية السابقة
  choice: الإبقاء على الضمير «عليهم» من غير تحديد مرجعه في المتن
  alternative: تعيينه بأنه يشير إلى ملائكة ساقطين، أو أصحاب سلطة من البشر، أو كائنات سماوية مجيدة عمومًا
  rationale: لا تعيّن الآية مرجع الضمير بأكثر مما يتيحه السياق السابق؛ لذلك يحفظ الضمير غموض النص ولا يفرض تفسيرًا عقائديًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ التقابل مع الآية السابقة، كما حُفظ عدم تحديد مرجع الضمير. وُضعت علامتا الحاشيتين عند اللفظين اللذين تفسرهما الحاشيتان.
