base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: ar
  text: وَأَنْقَذَ لُوطًا الْبَارَّ، الَّذِي كَانَ يُرْهَقُ[a] بِسَبَبِ سُلُوكِ الَّذِينَ لَا يَرْعَوْنَ الشَّرِيعَةَ فِي الْفُجُورِ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يُضايَق» أو «كان يُعذَّب».'
    reason: lexical_alternative
  - marker: b
    text: '«الفجور» هنا يدل على الانفلات الأخلاقي الوقح والإفراط الشهواني، ويمكن أيضًا ترجمته: «الخلاعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة عطف تواصل تسلسل الكلام في الآية السابقة.
- source_word: δίκαιον
  choice: الْبَارَّ
  rationale: ينقل بوضوح تقويم النص الأخلاقي للوط، وهو التعبير الكتابي العربي المألوف.
- source_word: Λὼτ
  choice: لُوطًا
  rationale: الصيغة العربية الراسخة للاسم، وجاء منصوبًا لأنه مفعول به.
- source_word: καταπονούμενον
  choice: كَانَ يَتَعَذَّبُ
  rationale: يحفظ معنى المعاناة الشديدة المستمرة في اسم الفاعل المضارع المبني للمجهول، بصياغة عربية طبيعية.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: مِنْ سُلُوكِ ...
  rationale: يبين أن السلوك هو سبب عذاب لوط، وينقل ἀναστροφή بمعنى السيرة أو نمط التصرف.
- source_word: τῶν ἀθέσμων
  choice: الْمُتَعَدِّينَ عَلَى الشَّرِيعَةِ
  rationale: يحفظ الدلالة الأخلاقية القانونية لمن يستخفون بما هو مشروع أو مقرر، مع وضوح أكبر من «عديمي الشريعة».
- source_word: ἐν ἀσελγείᾳ
  choice: فِي الْفُجُورِ
  rationale: ينقل معنى الانفلات الأخلاقي الوقح والإفراط الشهواني بلفظ عربي واضح ومهيب.
- source_word: ἐρρύσατο
  choice: أَنْقَذَ
  rationale: فعل واضح وطبيعي يدل على التخليص من الخطر.
theological_decisions:
- issue: وصف لوط الأخلاقي في ضوء رواية التكوين
  choice: الإبقاء على الوصف الصريح «لوطًا البار» بلا تلطيف أو تقييد.
  alternative: تخفيف الوصف أو تجنبه بسبب الإشكالات التي قد يراها القارئ في أفعال لوط في سفر التكوين.
  rationale: النص اليوناني يصف لوط صراحة بأنه δίκαιος؛ لذلك ينبغي حفظ تقويم النص نفسه دون فرض مصالحة تفسيرية عليه.
- issue: مرجع الفعل ἐρρύσατο
  choice: 'صياغة الفعل بفاعل مستتر يعود إلى الله بحسب السياق السابق: «وأنقذ».'
  alternative: إظهار الاسم «الله» داخل هذه الآية.
  rationale: الفاعل مفهوم من السياق، لكنه غير مذكور صراحة في نص الآية؛ إبقاؤه مستترًا يحفظ بنية الأصل ولا يضيف لفظًا إليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. روعي اتصال الآية بما قبلها بشرطة ختامية، وحُفظ تركيب «سلوك ... في الفجور» لقربه من البنية اليونانية مع بقائه مفهومًا.
