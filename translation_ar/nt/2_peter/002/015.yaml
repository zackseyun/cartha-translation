  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: ar
  text: إذ تركوا الطريق المستقيم، ضلّوا متّبعين طريق بلعام بن بصور[a]، الذي أحبّ أجرة الإثم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «بصور» هي الصيغة الواردة في النص اليوناني؛ أمّا في العهد القديم فيُدعى بلعام عادةً «ابن بعور».
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: إذ تركوا
  rationale: ينقل اسم الفاعل الأوريستي بوصفه فعلًا سابقًا أو مصاحبًا للفعل الرئيس، من غير إضافة معنى «الهجر المتعمّد» بأقوى مما يقتضيه اللفظ.
- source_word: εὐθεῖαν ὁδὸν
  choice: الطريق المستقيم
  rationale: يحفظ صورة الطريق الواردة حرفيًا في اليونانية ودلالتها الأخلاقية الكتابية.
- source_word: ἐπλανήθησαν
  choice: ضلّوا
  rationale: تعبير عربي طبيعي ينقل معنى الانحراف والضلال، من غير افتراض فاعل خارجي أضلّهم.
- source_word: ἐξακολουθήσαντες
  choice: متّبعين
  rationale: يحافظ على الصيغة الحالية التابعة وعلى صلتها الوثيقة بالفعل الرئيس، مع بقاء العلاقة الظرفية أو الوسيلية غير محسومة تمامًا.
- source_word: τῇ ὁδῷ
  choice: طريق
  rationale: يكرر استعارة الطريق كما في العبارة السابقة، بحسب النص اليوناني.
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: بلعام بن بصور
  rationale: يفهم تتابع المضاف إليه على أنه نسبة بنوّة، ويثبت صورة الاسم Βοσόρ الواردة في النص اليوناني.
- source_word: μισθὸν ἀδικίας
  choice: أجرة الإثم
  rationale: «أجرة» تحافظ على معنى المقابل المدفوع، و«الإثم» تنقل الثقل الأخلاقي لـἀδικία بعبارة عربية واضحة وطبيعية.
- source_word: ἠγάπησεν
  choice: أحبّ
  rationale: مقابل مباشر للفعل اليوناني، من غير تخفيف لتعلّقه الأخلاقي بالأجرة المحرّمة.
theological_decisions:
- issue: الصورة الأخلاقية للطريق في εὐθεῖαν ὁδὸν وτῇ ὁδῷ
  choice: الإبقاء على «الطريق المستقيم» و«طريق بلعام»
  alternative: النهج القويم / سلوك بلعام
  rationale: يحفظ الاستعارة الكتابية ولا يحولها إلى تفسير تجريدي.
- issue: هوية Βοσόρ وصيغة الاسم
  choice: بصور في المتن مع بيان «بعور» في الحاشية
  alternative: بعور في المتن
  rationale: أولوية النص اليوناني تقتضي إثبات «بصور»، بينما توضح الحاشية الصيغة المألوفة في العهد القديم دون طمس الاختلاف.
- issue: العلاقة النحوية بين ἐπλανήθησαν وἐξακολουθήσαντες
  choice: ضلّوا متّبعين
  alternative: ضلّوا باتّباعهم
  rationale: الصياغة المختارة تحافظ على مرونة اسم الفاعل اليوناني بين المصاحبة والوسيلة، بدل حصره في معنى سببي أو وسيلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تكرار صورة «الطريق»، وتُجنّبت الألفاظ المذهبية أو الشروح التي تحسم ما تركه التركيب اليوناني محتملًا.
