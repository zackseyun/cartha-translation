  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: ar
  text: فإن كان الله لم يُشفِق على ملائكة حين أخطأوا، بل ألقاهم في تارتاروس[a]، وسلَّمهم إلى سلاسل الظلام، محفوظين للدينونة[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألقاهم في الجحيم». يدل الفعل اليوناني تحديدًا على الإلقاء في «تارتاروس»، ولذلك أُبقي هذا الاسم الأدق في المتن.'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات: «حُفَر الظلام» بدلًا من «سلاسل الظلام».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: لم يُشفِق على
  rationale: تعبير عربي فصيح ينقل معنى الامتناع عن الإعفاء أو الرحمة في سياق العقاب، من غير إضافة تفسير صريح.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: ملائكة حين أخطأوا
  rationale: ينقل تركيب اسم المفعول اليوناني بصيغة زمنية طبيعية، ويحفظ دلالة الحدث في صيغة الماضي.
- source_word: ταρταρώσας
  choice: ألقاهم في تارتاروس
  rationale: الفعل اليوناني النادر يدل تحديدًا على الإلقاء في تارتاروس؛ والإبقاء على الاسم يصون خصوصية الصورة ولا يعممها إلى مفهوم الجحيم.
- source_word: σειραῖς ζόφου
  choice: إلى سلاسل الظلام الدامس
  rationale: «سلاسل» هي الدلالة الأرجح لـσειραῖς، و«الظلام الدامس» ينقل وطأة ζόφος بوصفه ظلامًا كثيفًا كئيبًا.
- source_word: παρέδωκεν
  choice: سلَّمهم
  rationale: يناسب معنى التسليم إلى الحبس أو العهدة في السياق القضائي، ويحافظ على الصلة بالسلاسل والدينونة.
- source_word: εἰς κρίσιν
  choice: للدينونة
  rationale: ينقل معنى الدينونة المنتظرة دون حصر اللفظ في الإدانة أو الحكم السلبي وحده.
- source_word: τηρουμένους
  choice: محفوظين
  rationale: يحفظ دلالة اسم المفعول المضارع على حالة مستمرة من الاحتجاز إلى وقت الدينونة.
theological_decisions:
- issue: نقل ταρταρώσας دون استيراد تحديد عقائدي لاحق
  choice: ألقاهم في تارتاروس
  alternative: ألقاهم في الجحيم
  rationale: يحيل الفعل اليوناني تخصيصًا إلى تارتاروس، بينما «الجحيم» أعم وقد يستدعي تصورات لاحقة لا يحددها اللفظ هنا.
- issue: العلاقة النحوية بين تارتاروس وسلاسل الظلام وكون الملائكة محفوظين
  choice: ألقاهم في تارتاروس، وسلَّمهم إلى سلاسل الظلام الدامس، محفوظين للدينونة
  alternative: ألقاهم في تارتاروس مقيدين بسلاسل الظلام الدامس ليُحفَظوا للدينونة
  rationale: الصياغة المختارة تبقي الصورة اليونانية المكثفة وعناصرها جميعًا، ولا تحسم ما إذا كانت السلاسل أداة أم موضعًا أم صورة مجازية.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «تارتاروس» منقولًا صوتيًا مع شرحه في الحاشية، وحُفظت الجملة بوصفها مقدمة شرطية متصلة بالسياق اللاحق؛ لذلك تنتهي بفاصلة.
