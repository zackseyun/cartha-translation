  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: ar
  text: فإن الرب يعرف كيف ينقذ الأتقياء من المحنة[a]، ويحفظ الظالمين تحت العقاب إلى يوم الدينونة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من التجربة». يمكن للكلمة اليونانية أن تعني الإغراء أو الاختبار والمحنة؛ والسياق هنا يرجّح النجاة من المحنة.
    reason: lexical_alternative
  - marker: b
    text: أو «ويحفظ الظالمين ليعاقَبوا في يوم الدينونة». يمكن فهم صيغة اسم المفعول المضارع في اليونانية على أنها تصف عقابًا جاريًا، أو عقابًا مرتبطًا بالدينونة الآتية.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: يعرف كيف
  rationale: جاء الفعل مع مصدرين، فالتعبير «يعرف كيف» ينقل معنى المعرفة العملية أو القدرة على فعل الأمرين.
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي المألوف والدقيق للقب κύριος في هذا السياق.
- source_word: εὐσεβεῖς
  choice: الأتقياء
  rationale: الصفة مستعملة استعمال الاسم، وتشير إلى أناس يتصفون بالتقوى نحو الله.
- source_word: ἐκ πειρασμοῦ
  choice: من المحنة
  rationale: يمكن أن تعني πειρασμός التجربة بمعنى الإغراء أو الاختبار والمحنة؛ وسياق إنقاذ نوح ولوط يرجح الشدة أو المحنة.
- source_word: ῥύεσθαι
  choice: ينقذ
  rationale: ينقل معنى التخليص من الخطر بلغة عربية واضحة وحية.
- source_word: ἀδίκους
  choice: الأشرار
  rationale: تعبير طبيعي يفيد الذين يتصفون بالظلم وعدم البر، مع الحفاظ على القوة الأخلاقية والقضائية في السياق.
- source_word: εἰς ἡμέραν κρίσεως
  choice: إلى يوم الدينونة
  rationale: مع فعل الحفظ، تفيد العبارة الامتداد أو التوجيه نحو يوم الدينونة، من غير حسم جميع تفاصيل العلاقة الزمنية.
- source_word: κολαζομένους
  choice: تحت العقاب
  rationale: يحافظ على دلالة اسم المفعول المضارع بوصفهم واقعين تحت العقاب، مع إبقاء احتمال تعلق العقاب بيوم الدينونة في الحاشية.
- source_word: τηρεῖν
  choice: يحفظ
  rationale: لفظ واسع يلائم معنى إبقاء الأشخاص أو حجزهم إلى غاية معينة.
theological_decisions:
- issue: دلالة πειρασμός في السياق
  choice: المحنة أو الاختبار الخارجي
  alternative: التجربة بمعنى الإغراء إلى الخطيئة
  rationale: الأمثلة السابقة تتناول النجاة من ظروف الشدة والدينونة؛ لذلك «المحنة» أنسب، مع إثبات البديل المعجمي في الحاشية.
- issue: دلالة κολαζομένους وعلاقتها بيوم الدينونة
  choice: الأشرار محفوظون وهم تحت العقاب إلى يوم الدينونة
  alternative: الأشرار محفوظون ليعاقَبوا في يوم الدينونة
  rationale: صيغة اسم المفعول المضارع تسمح بفهم العقاب على أنه جارٍ، لكن التركيب النحوي يحتمل أيضًا ربط العقاب بالدينونة المقبلة؛ لذلك أُبقي التوتر النصي وذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «المحنة» لتجنب التباس «التجربة» مع الإغراء، وأُبقي الاحتمال النحوي واللاهوتي في العبارة الأخيرة ظاهرًا بالحاشية.
