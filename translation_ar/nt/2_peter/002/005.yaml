- source_word: δικαιοσύνης κήρυκα
  choice: مناديًا بالبر
  rationale: «منادٍ» ينقل وظيفة الكارز أو المنادي العلني، و«البر» هو المقابل العربي الأنسب لـ δικαιοσύνη في هذا السياق.
- source_word: ἐφύλαξεν
  choice: حفظ
  rationale: يلائم النجاة وسط الدينونة من غير حصر المعنى في الحراسة الجسدية.
- source_word: κατακλυσμὸν
  choice: طوفانًا
  rationale: لفظ عربي طبيعي ودقيق للفيضان العظيم المقصود، ويحافظ التنكير على غياب أداة التعريف في اليونانية.
- source_word: κόσμῳ ἀσεβῶν
  choice: على عالم الفجّار
  rationale: صياغة عربية طبيعية تحافظ على بنية العالم الذي يتصف أهله بعدم التقوى.
- source_word: ἐπάξας
  choice: حين جلب
  rationale: يعبّر بسلاسة عن العلاقة الزمنية التي يحملها اسم الفاعل اليوناني مع الفعل الرئيس.
theological_decisions:
