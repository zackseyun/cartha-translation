translation:
  language: ar
  text: لَهُمْ عُيُونٌ مُمْتَلِئَةٌ بِزَانِيَةٍ[a]، لَا تَكُفُّ عَنِ الْخَطِيئَةِ[b]، يَسْتَدْرِجُونَ النُّفُوسَ غَيْرَ الثَّابِتَةِ، وَلَهُمْ قَلْبٌ مُدَرَّبٌ عَلَى الطَّمَعِ، هُمْ أَبْنَاءُ اللَّعْنَةِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير تفسيري: «ممتلئة بالزنى» أو «ممتلئة بشهوة الزنى». واليونانية حرفيًا: «ممتلئة بزانية»، وهي صورة تعبيرية حادة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نهمة إلى الخطيئة». ويمكن فهم العبارة أيضًا بمعنى «عاجزة عن الكف عن الخطيئة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: مملوءة من الزانية
  rationale: يحافظ على الصورة اليونانية المحسوسة، حيث ترد «الزانية» بالمفرد المضاف إليه، بدل تسويتها مباشرة إلى معنى مجرد مثل «الزنى».
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: لا تكف عن الخطيئة
  rationale: ينقل معنى عدم التوقف عن الخطيئة بصورة عربية واضحة، مع بقاء احتمال فهم العبارة بمعنى النهم إلى الخطيئة في الحاشية.
- source_word: δελεάζοντες
  choice: يستدرجون
  rationale: يفيد الإغراء والجذب إلى الفخ، ويحفظ الإيحاء الافتراسي في الفعل اليوناني.
- source_word: ψυχὰς ἀστηρίκτους
  choice: النفوس غير الراسخة
  rationale: «النفوس» تقابل ψυχάς، و«غير الراسخة» تعبّر عن أشخاص لم يثبتوا بعد.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: قلب مدرب على الطمع
  rationale: «مدرب» يحفظ صورة التمرين المتضمنة في γεγυμνασμένην، و«الطمع» تعبير عربي معاصر واضح عن πλεονεξία.
- source_word: κατάρας τέκνα
  choice: أبناء اللعنة
  rationale: يحافظ على تركيب الإضافة وصورته القوية، أي أناس تتسم حالهم باللعنة أو يصيرون إليها.
- source_word: ἔχοντες ... ἔχοντες
  choice: لهم ... ولهم
  rationale: يحافظ على تكرار البنية التراكمية في التنديد، بصياغة عربية طبيعية.
theological_decisions:
- issue: هل تُخفف الصورة الجنسية في μοιχαλίδος؟
  choice: إبقاء الصورة المحسوسة «الزانية» في المتن
  alternative: ترجمتها تفسيريًا بـ«الزنى» أو «شهوة الزنى»
  rationale: النص اليوناني يستعمل اسم «الزانية» بالمفرد، وإبقاء الصورة يصون حدّة التنديد من غير فرض تفسير واحد عليها.
- issue: دلالة ἀκαταπαύστους ἁμαρτίας
  choice: لا تكف عن الخطيئة
  alternative: نهمة إلى الخطيئة
  rationale: الصياغة المختارة أقرب إلى معنى عدم الانقطاع أو العجز عن التوقف، بينما تُثبت الحاشية القراءة التي تبرز الشهوة التي لا تشبع.
- issue: ترجمة πλεονεξία
  choice: الطمع
  alternative: الجشع
  rationale: «الطمع» لفظ عربي واضح وواسع الدلالة يلائم الرذيلة المقصودة من غير تخصيصها بالمال وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة وحادة تناسب سياق التنديد. فُككت سلسلة النعوت اليونانية إلى جمل قصيرة نسبيًا لتحسين المقروئية، مع الحفاظ على تراكم الصور وتكرار «لهم».
