id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: ar
  text: فإنهم، بعد أن أفلتوا من أدناس العالم بمعرفة الرب والمخلّص يسوع المسيح، ثم عادوا فتورّطوا فيها وغُلِبوا، فقد صارت حالهم الأخيرة أسوأ من الأولى.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: كانوا قد أفلتوا
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق التورط والغلبة؛ وهذه الصياغة العربية تُظهر السبق بوضوح.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: أدناس العالم
  rationale: «أدناس» تنقل معنى ما يلوّث ويدنّس أخلاقيًا، مع الحفاظ على الإيجاز والصورة الأصلية.
- source_word: ἐν ἐπιγνώσει
  choice: بمعرفة
  rationale: تفيد ἐν هنا الوسيلة على الأرجح؛ ولم تُضف صفة مثل «كاملة» كيلا يُحمَّل اللفظ أكثر مما يحسمه السياق.
- source_word: τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: الرب والمخلّص يسوع المسيح
  rationale: يحافظ على اللقبين المنسوبين إلى شخص واحد، ويستعمل الصيغة العربية الراسخة والطبيعية لـΧριστός.
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: ثم عادوا فتورّطوا فيها
  rationale: يعيد الضمير على أدناس العالم، وينقل معنى التشابك أو الوقوع مجددًا في قبضتها.
- source_word: ἡττῶνται
  choice: غُلِبوا
  rationale: ينقل معنى الانهزام والخضوع لقوة تلك الأدناس من غير توسيع تفسيري.
- source_word: γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: فقد صارت حالهم الأخيرة أسوأ من الأولى
  rationale: يعبّر عن الحالة الناتجة التي يدل عليها التام، ويجعل التعبير الاصطلاحي «الأواخر/الأوائل» طبيعيًا وواضحًا بالعربية.
theological_decisions:
- issue: طبيعة «المعرفة» وعلاقتها بالارتداد
  choice: «بمعرفة» من دون وصفها بأنها خلاصية أو ظاهرية
  alternative: «بمعرفة خلاصية» أو «بمجرد معرفة ظاهرية»
  rationale: لفظ ἐπίγνωσις لا يحسم وحده الخلاف اللاهوتي بشأن حال هؤلاء الأشخاص؛ لذلك تُحفظ دلالة النص وتوتره من غير فرض قراءة مذهبية.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية لقب مفهوم وراسخ ليسوع، ويحفظ الدلالة اللقبية لـΧριστός في سجل عربي فصيح وطبيعي.
- issue: مرجع τούτοις
  choice: «فيها» عائدًا إلى أدناس العالم
  alternative: «في هذه الأمور»
  rationale: المرجع النحوي الأقرب هو الأدناس؛ والضمير المؤنث المفرد في العربية يوافق جمع غير العاقل ويجنّب شرحًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ترتيب شرطي طبيعي. لم تُضف حواشٍ لأن البدائل المعجمية واللاهوتية لا تستلزم علامة في النص، ولأن «المسيح» هو المقابل العربي الطبيعي واللقبي لـΧριστός.
