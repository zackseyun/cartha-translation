base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: ar
  text: وبدافع الطمع سيستغلونكم بأقوال مختلقة.[a] إن دينونتهم منذ القديم لا تتوانى، وهلاكهم لا يغفو.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيتَّجرون بكم»؛ فالفعل اليوناني يستعمل صورة تجارية، إذ يعاملون الناس كسلعة يربحون منها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: بدافع الطمع
  rationale: يفيد الاسم الطمع والجشع، وتدل ἐν هنا في السياق على الدافع أو المجال الأخلاقي الذي يعمل فيه المعلمون الكذبة.
- source_word: πλαστοῖς λόγοις
  choice: بكلام مختلَق
  rationale: πλαστός هو المصنوع أو الملفق؛ و«كلام مختلَق» ينقل معنى الخطاب المصطنع المتعمد، لا مجرد الكلام الخاطئ.
- source_word: ἐμπορεύσονται
  choice: سيستغلونكم
  rationale: الفعل ذو خلفية تجارية، ويصور معاملة الناس وسيلةً للربح. «سيستغلونكم» واضح وطبيعي، مع حفظ الصورة التجارية في الحاشية.
- source_word: κρίμα
  choice: دينونتهم
  rationale: يشير إلى الحكم القضائي الواقع عليهم؛ و«الدينونة» تحفظ المعنى القضائي ولا تحدد كيفية العقوبة أو مدتها.
- source_word: ἔκπαλαι
  choice: المقررة منذ زمن بعيد
  rationale: ينقل البعد الزمني، مع إظهار أن الدينونة قائمة عليهم منذ القديم؛ وإضافة «المقررة» توضح العلاقة الطبيعية في العربية دون تحديد متى أو كيف صدر الحكم.
- source_word: οὐκ ἀργεῖ
  choice: فلا تتباطأ
  rationale: ἀργέω يفيد الخمول أو عدم الفعل، وقد يحمل في هذا السياق معنى عدم التأخر. «لا تتباطأ» عربية طبيعية وتحافظ على صورة دينونة ماضية نحو التنفيذ.
- source_word: ἀπώλεια
  choice: هلاكهم
  rationale: «الهلاك» مقابل عربي واضح لـἀπώλεια، ويدل على الدمار أو المصير المهلك دون حسم طبيعته أو مدته.
- source_word: οὐ νυστάζει
  choice: لا ينعس
  rationale: يحفظ التشخيص البلاغي الحي؛ فالهلاك مصور كأنه لا يغفو ولا يفتر عن المجيء.
theological_decisions:
- issue: طبيعة العقوبة المعلنة
  choice: صياغة النص بوصفه إعلانًا مؤكدًا للدينونة والهلاك، من غير تحديد كيفية الهلاك أو مدته.
  alternative: تفسير «الهلاك» صراحةً على أنه فناء، أو على أنه خراب زمني فقط.
  rationale: تؤكد الآية حتمية الحكم على المعلمين الكذبة، لكنها لا تشرح في ذاتها آلية العقوبة أو دوامها، ولذلك تُحفظ المساحة الدلالية للنص.
- issue: العلاقة الزمنية في ἔκπαλαι οὐκ ἀργεῖ
  choice: «دينونتهم المقررة منذ زمن بعيد فلا تتباطأ»
  alternative: «دينونتهم منذ القديم ليست خاملة»
  rationale: البديل الحرفي يحفظ استعارة الخمول لكنه ثقيل وملتبس بالعربية. الصياغة المختارة تنقل أن الحكم القديم ليس متوقفًا أو متأخرًا، من دون الادعاء بأن تنفيذه قد وقع بالفعل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «مختلَق» بدل «مزوَّر» لإبراز معنى الكلام المصنوع الملفق، وحُفظ تشخيص الهلاك في عبارة «لا ينعس». وُضعت علامة الحاشية بعد الجملة التي تترجم الاستعارة التجارية.
