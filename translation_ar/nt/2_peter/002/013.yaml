lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: ينالون الضرر أجرةً للإثم
  rationale: يحافظ هذا التعبير على دلالة الجزاء المؤذي في اسم المفعول ἀδικούμενοι، وعلى صورة μισθός بوصفه أجرة أو جزاءً، من غير أن يوحي بأن آخرين يظلمونهم فحسب. واختيار «الإثم» ينقل المعنى الأخلاقي لـἀδικία بلغة عربية واضحة.
- source_word: ἡδονὴν ἡγούμενοι
  choice: ويحسبون ... لذةً
  rationale: ينقل تركيب الفعل مع المفعولين، أي اعتبار شيء ما لذة، بصياغة عربية موجزة وطبيعية.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: الترف في وضح النهار
  rationale: «الترف» ينقل معنى التنعم المفرط والانغماس، و«في وضح النهار» يبرز علنية السلوك ووقاحته من غير زيادة تفسيرية في المتن.
- source_word: σπίλοι καὶ μῶμοι
  choice: أدناس وعيوب
  rationale: يحافظ على الصورتين المتوازيتين للتلوث والنقص الأخلاقي، مع تجنب ترجمة حرفية غامضة في العربية.
- source_word: ἐντρυφῶντες
  choice: ينغمسون
  rationale: يعبر عن التلذذ والانغماس المفرط، ويلائم مجيئه مع «في خدعهم» في العربية.
- source_word: ἐν ταῖς ἀπάταις αὐτῶν
  choice: في خدعهم
  rationale: 'يتبع قراءة SBLGNT: ἀπάταις، ويترجم معنى الخداع بصياغة عربية مباشرة، مع إثبات القراءة البديلة ذات الدلالة في الحاشية.'
- source_word: συνευωχούμενοι ὑμῖν
  choice: وهم يأكلون معكم في الولائم
  rationale: ينقل معنى المشاركة في الوليمة ويُظهر التزامن الذي يفيده اسم الفاعل، من غير تحديد نوع ديني خاص للوجبة.
theological_decisions:
- issue: الاختلاف النصي بين ἀπάταις وἀγάπαις
  choice: 'اعتماد ἀπάταις في المتن: «خدعهم»'
  alternative: 'تقرأ بعض المخطوطات ἀγάπαις: «ولائم المحبة»'
  rationale: النص اليوناني المعطى في SBLGNT يقرأ ἀπάταις، وهي قراءة تلائم سياق المعلمين المخادعين. ولأن القراءة البديلة مؤثرة في فهم نوع الوليمة، حُفظت في حاشية من غير ترجيح مذهبي.
- issue: طبيعة «أجرة الإثم»
  choice: 'صياغتها جزاءً مؤذيًا ينالونه: «ينالون الضرر أجرةً للإثم»'
  alternative: «يُظلَمون أجرةً للإثم» أو «ينالون جزاء فعل الشر»
  rationale: الصياغة المختارة تحافظ على التوتر في العبارة اليونانية بين الضرر والأجرة، ولا تختزلها في مجرد تعرضهم لظلم من الآخرين.
translation_notes:
  register: فصحى معاصرة واضحة وذات نبرة كتابية رصينة. استُعمل «في وضح النهار» لإظهار علنية الترف، و«الولائم» لتوضيح دلالة الفعل المركب من غير افتراض أن كل وجبة مذكورة هي طقس كنسي محدد.
