  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: ar
  text: يَعِدونهم بالحرية، وهم أنفسهم عبيدٌ للفساد؛ لأن الإنسان قد استُعبد أيضًا لما غلبه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن ما غلب الإنسان قد استعبده أيضًا».'
    reason: صياغة بديلة تجعل «ما» فاعلًا في العربية، مع إبقاء معنى الغلبة والاستعباد الناتج عنها.
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: الحرية
  rationale: المعنى المباشر هو الحرية، وهي تقابل بوضوح حالة العبودية المذكورة لاحقًا.
- source_word: ἐπαγγελλόμενοι
  choice: يَعِدونهم
  rationale: يحفظ معنى تقديم وعد، لا مجرد عرض الحرية أو إعلانها.
- source_word: δοῦλοι
  choice: عبيدٌ
  rationale: يحفظ صورة العبودية القوية والتناقض المقصود مع الوعد بالحرية.
- source_word: φθορᾶς
  choice: للفساد
  rationale: لفظ «الفساد» يتسع هنا للانحلال الأخلاقي ولما يقود إليه من خراب، دون حصر المعنى في أحدهما.
- source_word: ᾧ γάρ τις ἥττηται
  choice: لأن ما يغلب الإنسان
  rationale: صياغة عربية طبيعية تحفظ المبدأ العام ومعنى التغلّب أو القهر.
- source_word: τούτῳ καὶ δεδούλωται
  choice: يستعبده أيضًا
  rationale: ينقل المبني للمجهول اليوناني دلاليًا بصيغة عربية فاعلها «ما» السابق، ويحفظ نتيجة العبودية المستمرة التي يفيدها التام.
theological_decisions:
- issue: حدة صورة δοῦλοι/δεδούλωται في مقابلة الحرية بالعبودية
  choice: «عبيدٌ» و«يستعبده»
  alternative: «خَدَم» و«يُخضعه»
  rationale: التقابل الحاد بين الحرية الموعودة والعبودية الفعلية جوهري في حجة الآية، وتخفيف اللفظ يضعف هذه المفارقة.
- issue: مدى معنى φθορά
  choice: «الفساد» مع إبقاء اتساعه الدلالي
  alternative: «الهلاك» أو «الانحلال»
  rationale: السياق يسمح بإيحاء أخلاقي ونتيجة مدمرة معًا؛ لذلك لا ينبغي حصر اللفظ في الهلاك وحده أو الفساد الأخلاقي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «يَعِدونهم» لإزالة أي التباس بصري محتمل في الفعل، وحُفظ التوازي بين الحرية والعبودية بصياغة موجزة طبيعية.
