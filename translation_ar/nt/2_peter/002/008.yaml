  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: ar
  text: لأن ذلك البار، المقيم بينهم، كان يعذّب نفسه البارّة يومًا بعد يوم بما كان يراه ويسمعه من أعمالهم المنافية للشريعة—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترتيب العبارة: «لأن ذلك البار، المقيم بينهم، كان يعذّب نفسه البارّة يومًا بعد يوم بأعمالهم المنافية للشريعة التي كان يراها ويسمعها». في اليونانية ترد عبارة «بالنظر والسمع» أولًا، ثم ترد «بالأعمال المنافية للشريعة» لاحقًا؛ لذلك يحتمل تعلّق العبارات أكثر من ترتيب في العربية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: بما كان يراه ويسمعه
  rationale: ينقل دلالة وسيلتي الإدراك البصري والسمعي بصياغة عربية طبيعية، مع إبقاء صلتهما بسبب العذاب الداخلي.
- source_word: ὁ δίκαιος
  choice: ذلك البار
  rationale: الصفة مع أداة التعريف مستعملة استعمال الاسم وتشير إلى لوط المذكور سابقًا؛ و«ذلك» توضح الإحالة.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: وهو ساكن بينهم
  rationale: يحفظ معنى الإقامة المستمرة في وسطهم وصيغة الحال التي يؤديها اسم الفاعل اليوناني.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: يومًا بعد يوم
  rationale: تعبير عربي واضح عن التكرار والاستمرار المتراكم.
- source_word: ψυχὴν δικαίαν
  choice: نفسه البارة
  rationale: يحفظ تكرار صفة البر في الأصل، وتدل «النفس» هنا على باطن الشخص وذاته دون تقرير تركيب أنثروبولوجي تقني.
- source_word: ἀνόμοις ἔργοις
  choice: من أعمالهم المخالفة للشريعة
  rationale: ينقل القوة الأخلاقية والقانونية للفظ ἄνομος، مع إضافة ضميرهم من السياق لتعيين أصحاب الأعمال.
- source_word: ἐβασάνιζεν
  choice: كان يعذّب
  rationale: يحفظ شدة الفعل وصيغته الناقصة الدالة على فعل مستمر في الماضي، من غير تخفيفه إلى مجرد الحزن أو الضيق.
theological_decisions:
- issue: دلالة ψυχή وعلاقتها بطبيعة الإنسان
  choice: «نفسه» بمعنى ذاته الباطنة موضع الألم الأخلاقي
  alternative: «كيانه الداخلي» أو «ذاته»
  rationale: السياق يصف عذاب لوط الداخلي ولا يقرر مذهبًا تفصيليًا في علاقة النفس بالجسد؛ لذا حُفظ المقابل المباشر بلا توسع عقائدي.
- issue: كون الفاعل يعذّب نفسه بصيغة المبني للمعلوم
  choice: الإبقاء على «كان يعذّب نفسه»
  alternative: «كانت نفسه تتعذب» أو «كان يتعذب»
  rationale: هذا يحفظ المبني للمعلوم في ἐβασάνιζεν والتوتر التعبيري في أن البار يعذّب نفسه بسبب ما يراه ويسمعه، بدل تسوية العبارة إلى صيغة لازمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تكرار «البار/البارة» وشدة «يعذّب»، وصيغت الجملة بما يلائم العربية مع بيان مرونة ترتيب المتعلقات في الحاشية.
