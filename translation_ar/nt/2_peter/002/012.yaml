  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: ar
  text: أَمَّا هَؤُلَاءِ، فَهُمْ كَحَيَوَانَاتٍ غَيْرِ عَاقِلَةٍ[a]، مَوْلُودَةٍ بِحُكْمِ طَبِيعَتِهَا لِلْأَسْرِ وَالْهَلَاكِ[b]. وَإِذْ يُجَدِّفُونَ عَلَى أُمُورٍ يَجْهَلُونَهَا[c]، فَسَيَهْلِكُونَ أَيْضًا فِي هَلَاكِهِمْ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حيوانات لا تعقل».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا صياغة قريبة من: «مولودة طبيعية»؛ أي كائنات تحكمها طبيعتها أو غريزتها.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يشتمون ما لا يعرفونه» أو «يفترون على ما يجهلونه».'
    reason: lexical_alternative
  - marker: d
    text: يكرر اليوناني كلمتين من جذر واحد تدلان على الهلاك، بما يربط بين الخراب والمصير الذي سيصيبهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: حَيَوَانَاتٍ غَيْرِ عَاقِلَةٍ
  rationale: ينفي الوصف امتلاك العقل أو التعقّل، لا مجرد القدرة على النطق. وهذه الصياغة عربية واضحة وتحافظ على المقابلة الأخلاقية التي يقيمها السياق.
- source_word: γεγεννημένα φυσικὰ
  choice: مَخْلُوقَاتٍ تَسُوقُهَا الْغَرِيزَةُ، وُلِدَتْ
  rationale: التركيب اليوناني مكثف، ويفيد كائنات طبيعية محكومة بدافع طبيعتها مع إبقاء صورة الولادة الواردة في اسم المفعول.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: لِلْأَسْرِ وَالْهَلَاكِ
  rationale: تحافظ اللام على دلالة الغاية أو النتيجة، ويعبّر «الأسر» عن وقوع الحيوان في قبضة صائده، بينما يلائم «الهلاك» المصير المذكور لاحقًا.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: عَلَى أُمُورٍ يَجْهَلُونَهَا
  rationale: ضمير الوصل محايد جمعًا، والأرجح أنه يشير إلى أمور أو مسائل لا إلى أشخاص؛ و«يجهلونها» تلتزم بدلالة عدم المعرفة دون توسع تفسيري.
- source_word: βλασφημοῦντες
  choice: يُجَدِّفُونَ
  rationale: يحافظ «يجدّفون» على قوة اللفظ الدال على القول المسيء أو المدنس، من غير تعيين موضوع التجديف بما يتجاوز النص.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: فَسَيَهْلِكُونَ أَيْضًا فِي هَلَاكِهِمْ
  rationale: تكرار الجذر العربي «هلك» يقابل التقارب الاشتقاقي بين φθορά وφθαρήσονται، ويحافظ على العبارة الصادمة «في هلاكهم» بدل تسويتها تفسيريًا.
theological_decisions:
- issue: دلالة βλασφημοῦντες في السياق
  choice: يُجَدِّفُونَ
  alternative: يشتمون / يفترون
  rationale: يبقي الاختيار شدة الإدانة الدينية والأخلاقية في اللفظ اليوناني، لكنه لا يحدد موضوع التجديف، ولذلك لا يحسم ما تركه السياق مفتوحًا.
- issue: دلالة φθορά وφθαρήσονται
  choice: لغة الهلاك مع تكرار الجذر
  alternative: الفساد / الخراب
  rationale: صورة الحيوانات المولودة للأسر والهلاك ترجح معنى الدمار والمصير على معنى الفساد الأخلاقي وحده، وتكرار الجذر يصون التلاعب اللفظي في الأصل من غير إضافة تحديد عقائدي.
- issue: مرجع αὐτῶν في عبارة ἐν τῇ φθορᾷ αὐτῶν
  choice: الإبقاء على «في هلاكهم» دون شرح المرجع داخل المتن
  alternative: في الهلاك المعدّ لهم / بسبب فسادهم
  rationale: للضمير والتركيب قدر من الغموض، والصياغة الحرفية الطبيعية نسبيًا تحفظه بدل تحويله إلى تفسير سببي أو عقابي أكثر تحديدًا.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. استُخدمت «أما هؤلاء، فهم» لتوضيح الانتقال الجدلي، وحوفظ على صورة الحيوان والأسْر والهلاك وعلى التكرار الاشتقاقي، مع تجنب شرح هوية موضوع التجديف أو طبيعة الدينونة داخل المتن.
