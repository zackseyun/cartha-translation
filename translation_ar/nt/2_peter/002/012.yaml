  terminology: «حيوانات غير عاقلة» مناسب لـἄλογα ζῷα، و«يجدفون» يحفظ قوة βλασφημοῦντες من غير تحديد موضوعه. ويحافظ «الهلاك/يهلكون» على التجانس الاشتقاقي المقصود في φθορά/φθαρήσονται. استُبدلت الإحالة إلى الغريزة في المتن بعبارة «بحكم طبيعتها» لأنها أقرب إلى φυσικά، مع إبقاء «الغريزة» بديلًا تفسيريًا في الحاشية.
