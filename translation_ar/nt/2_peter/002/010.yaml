  source_fidelity: 'المعنى العام منقول بأمانة: التخصيص بـ«ولا سيما»، والسير وراء الجسد، وازدراء السيادة، ووصف الجرأة والاستبداد بالرأي، وعدم الارتعاد عند الإساءة إلى «أصحاب المجد». لكن «التنجُّس» يحوّل μιασμοῦ إلى حدث/حالة التلوّث، بينما «النجاسة» أدق وأوضح هنا بوصفها موضوع الشهوة. كما أن «الربوبية» في الحاشية بديل غير مناسب في العربية الحديثة لـκυριότης في هذا السياق وقد يضيّق المرجع أو يحمّله دلالة عقدية غير لازمة.'
