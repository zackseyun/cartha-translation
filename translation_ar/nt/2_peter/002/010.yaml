  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: ar
  text: ولا سيما الذين يسيرون وراء الجسد في شهوةٍ إلى النجاسة، ويحتقرون السيادة[a]. إنهم جريئون، مستبدّون برأيهم، لا يرتعدون وهم يجدّفون على أصحاب المجد[b][c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السلطان» أو «السيادة والهيمنة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الأمجاد»؛ ويُرجَّح أن المقصود كائنات سماوية مجيدة، وربما الملائكة.'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا فهم العبارة: «لا يرتعدون من أن يجدّفوا على أصحاب المجد».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: ولا سيما
  rationale: تؤدي معنى التخصيص والتوكيد داخل الكلام المتصل بحكم الآية السابقة.
- source_word: ὀπίσω σαρκὸς
  choice: وراء الجسد
  rationale: تحافظ على صورة الأصل وعلى لفظ «الجسد» من غير تفسيره تفسيرًا مذهبيًا مثل «الطبيعة الخاطئة».
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: في شهوة التنجُّس
  rationale: «شهوة» تنقل الدلالة السلبية الواضحة لـἐπιθυμία في السياق، و«التنجس» يصون قوة μιασμός الأخلاقية.
- source_word: πορευομένους
  choice: الذين يسيرون
  rationale: ينقل صورة السلوك المستمر، وينسجم طبيعيًا مع «وراء الجسد».
- source_word: κυριότητος
  choice: السيادة
  rationale: يبقي معنى الربوبية أو السلطان مفتوحًا، ولا يحدد المرجع بأنه المسيح أو سلطة بشرية أو رتبة ملائكية.
- source_word: καταφρονοῦντας
  choice: يحتقرون
  rationale: يعبر بوضوح عن الازدراء الفعلي وشدة الإدانة في الأصل.
- source_word: Τολμηταί
  choice: جريئون
  rationale: وصف موجز يوافق الأسلوب المتلاحق في اليونانية، وتحمل الجرأة هنا معنى سلبيًا من السياق.
- source_word: αὐθάδεις
  choice: مستبدّون برأيهم
  rationale: ينقل معنى الإصرار المتعالي على إرادة الذات بصورة أوضح للقارئ المعاصر من لفظ نادر أو غامض.
- source_word: δόξας
  choice: أصحاب المجد
  rationale: صيغة شخصية محتملة بقوة في السياق، لكنها لا تحسم هوية هؤلاء بأنهم ملائكة.
- source_word: οὐ τρέμουσιν
  choice: لا يرتعدون
  rationale: يحافظ على الصورة الجسدية القوية للخوف أو الهيبة.
- source_word: βλασφημοῦντες
  choice: وهم يجدّفون على
  rationale: تعكس صيغة الحال تزامن الفعل مع عدم الارتعاد، و«يجدّفون» تحفظ جسامة الكلام المسيء.
theological_decisions:
- issue: مرجع κυριότητος
  choice: السيادة من دون تعيين المرجع
  alternative: ربوبية الرب، أو السلطان، أو سيادة كائنات سماوية
  rationale: اللفظ يدل على السيادة أو السلطان، ولا تعيّن الآية وحدها المرجع تعيينًا قاطعًا؛ لذلك تُصان مساحة الغموض في المتن.
- issue: مرجع δόξας
  choice: أصحاب المجد من دون تحديد هويتهم
  alternative: الملائكة، أو الكائنات السماوية المجيدة، أو الأمجاد بمعنى مجرد
  rationale: ذكر الملائكة في الآية التالية يرجح مرجعًا سماويًا، لكن δόξας نفسها أعم؛ لذا لا يضاف «الملائكة» إلى المتن.
- issue: علاقة βλασφημοῦντες بالفعل الرئيس
  choice: 'حال متزامنة: «وهم يجدّفون»'
  alternative: 'غاية أو متمم: «أن يجدّفوا»'
  rationale: صيغة اسم الفاعل اليونانية تسمح بإبراز الفعل المصاحب، وهذا يحافظ على التركيب من غير تحويله صراحة إلى غاية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ الإيقاع الاتهامي المتلاحق في «جريئون، مستبدّون برأيهم»، كما حُفظ الغموض المتعلق بالسيادة وأصحاب المجد في المتن، مع بيان البدائل في الحواشي.
