base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: ar
  text: 'قد انطبق عليهم ما يقوله المثل الصادق: «الكلب يعود إلى قيئه»،[a] و«الخنزيرة المغتسلة تعود إلى التمرغ في الوحل».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كلب، بعد أن عاد إلى قيئه». والعبارة الأولى تردد صدى أمثال 26:11.'
    reason: cross_reference
  - marker: b
    text: 'النص اليوناني موجز، وحرفيًا: «وخنزيرة مغتسلة إلى التمرغ في الوحل»؛ وقد أُضيف فعل «تعود» في الترجمة لإتمام المعنى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: قد انطبق عليهم
  rationale: ينقل تحقق مضمون المثل في حالهم مع مراعاة دلالة صيغة التمام على نتيجة قائمة، وهو أسلس عربيًا من التعبير الحرفي «حدث لهم».
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: ما يقوله المثل الحق
  rationale: التركيب اليوناني موجز ومحذوف العنصر، وهذه الصياغة تبيّن أن مضمون المثل هو الذي انطبق عليهم من غير إضافة تفسير عقائدي.
- source_word: ἀληθοῦς
  choice: الحق
  rationale: اختيار طبيعي في عبارة «المثل الحق»، ويحفظ معنى الصدق والثبوت.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: الكلب يعود إلى قيئه
  rationale: صياغة مثلية عربية طبيعية تحافظ على معنى الرجوع وعلى صلة العبارة بأمثال 26:11؛ وتُفهم الإضافة في «قيئه» على أنه قيؤه هو.
- source_word: Ὗς λουσαμένη
  choice: الخنزيرة المغتسلة
  rationale: يحفظ التأنيث المفرد في اليونانية، وتفيد «المغتسلة» حالة الغسل من دون حسم ما إذا كانت اغتسلت بنفسها أو غُسلت.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: إلى التمرغ في الوحل
  rationale: ينقل صورة التدحرج أو التمرغ في الطين القذر بلغة عربية واضحة وحية.
theological_decisions:
- issue: قوة الاقتباس المثلي الموجز
  choice: صياغة الآية بوصف مضمون المثل قد انطبق عليهم
  alternative: 'القول حرفيًا: «قد حدث لهم قول المثل الحق»'
  rationale: يحفظ الاختيار دلالة النص التحذيرية وصورة الانتكاس من غير استنتاج حكم عقائدي أوسع مما تصرح به الآية.
- issue: صيغة λουσαμένη الوسطى أو المبنية للمجهول
  choice: «المغتسلة» من غير تعيين الفاعل
  alternative: «التي اغتسلت» أو «التي غُسلت»
  rationale: الصيغة اليونانية تحتمل في السياق وصف الخنزيرة بأنها صارت مغسولة، لذلك تُركت كيفية الغسل غير محسومة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع إبقاء خشونة الصورتين المقصودة. استُعملت «الخنزيرة» بدل «الخنزير» للمحافظة على التأنيث، و«الوحل» بدل الألفاظ القديمة مثل «الحمأة» لسهولة الفهم.
