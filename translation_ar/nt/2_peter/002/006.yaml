  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: ar
  text: وإن كان قد حوَّل مدينتَي سدوم وعمورة إلى رماد[a]، وحكم عليهما بالدمار، جاعلًا إياهما عبرةً لما سيحل بغير الأتقياء[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «أحرق مدينتَي سدوم وعمورة حتى صارتا رمادًا».'
    reason: بديل معجمي يبرز فعل الإحراق مع الحفاظ على نتيجة التحول إلى رماد.
  - marker: b
    text: 'أو: «عبرةً لغير الأتقياء في المستقبل».'
    reason: صياغة بديلة أقرب إلى البناء اللفظي، مع أن المتن يوضح على نحو أرجح أن المقصود ما سيحل بغير الأتقياء.
lexical_decisions:
- source_word: τεφρώσας
  choice: حوَّل ... إلى رماد
  rationale: يفيد الفعل بلوغ نتيجة التحول إلى رماد، لا مجرد الإحراق؛ وهذه الصياغة عربية طبيعية وتحفظ معنى النتيجة.
- source_word: καταστροφῇ κατέκρινεν
  choice: حكم عليهما بالدمار
  rationale: يحفظ المعنى القضائي للفعل κατέκρινεν، ويفهم اسم الدمار بوصفه مآل الحكم أو مضمونه.
- source_word: ὑπόδειγμα
  choice: عبرةً
  rationale: «عبرة» تنقل معنى المثال ذي الوظيفة التحذيرية الذي يقتضيه سياق الدينونة، من غير إطالة تفسيرية.
- source_word: μελλόντων ἀσεβέσιν
  choice: لمن سيكونون من غير الأتقياء
  rationale: تنقل الصياغة معنى الاستقبال ومعنى الأشخاص المتصفين بعدم التقوى، مع إبقاء العبارة قريبة من تركيب النص المقدم رغم صعوبته النحوية.
- source_word: τεθεικώς
  choice: جاعلًا إياهما
  rationale: ينقل اسم الفاعل التام الدال على وضع المدينتين في حالة ثابتة بوصفهما عبرة.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: مدينتَي سدوم وعمورة
  rationale: المقصود المدينتان المسميتان سدوم وعمورة؛ والتثنية أفصح وأوضح في العربية من إبقاء جمع «مدن» مع اسمين.
theological_decisions:
- issue: الفاعل المضمر في سياق أحكام الله
  choice: إبقاء الفاعل مستترًا في الأفعال العربية
  alternative: التصريح بـ«الله» أو «الرب»
  rationale: الفاعل مفهوم من السياق السابق، والنص في هذه الجملة لا يكرر لقبًا إلهيًا؛ لذا يحفظ الإضمار تدفق الأصل ولا يضيف تعيينًا غير مصرح به هنا.
- issue: دلالة ἀσεβέσιν
  choice: من غير الأتقياء
  alternative: الفجّار؛ الذين سيحيون بلا تقوى
  rationale: يحفظ هذا الاختيار البعد الديني والأخلاقي لعدم التقوى من غير حصره في معنى الفجور السلوكي وحده أو توسيعه إلى وصف طريقة حياة كاملة.
- issue: امتداد الشرط من السياق السابق
  choice: وإن كان قد
  alternative: و
  rationale: الجملة جزء من سلسلة شرطية بدأت في السياق السابق؛ إظهار «إن» في العربية يوضح تعلقها النحوي من غير تغيير مضمون هذه الجملة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُعملت «عبرة» لقوتها الطبيعية في سياق التحذير، وحُفظت صيغة الجملة غير المكتملة بعلامة الفاصلة لأنها جزء من تركيب شرطي يمتد عبر السياق.
