  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: ar
  text: فإنهم يتفوهون بكلام متضخم فارغ[a]، ويستدرجون بشهوات الجسد والفجور[b] أولئك الذين بالكاد يفلتون[c] من الذين يعيشون في الضلال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بكلام متكبر أجوف».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بشهوات الجسد وبالفجور».'
    reason: syntactic_ambiguity
  - marker: c
    text: 'تقرأ مخطوطات أخرى: «حقًا» بدل «بالكاد». ويمكن أيضًا فهم النص المختار بمعنى: «الذين بدأوا للتو يفلتون».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: كلام متعاظم فارغ
  rationale: ينقل الوصف معنى الكلام المتضخم والمتعالي الخالي من المضمون، مع إضافة «كلام» التي يقتضيها فعل النطق والسياق.
- source_word: φθεγγόμενοι
  choice: ينطقون
  rationale: صياغة عربية فصيحة وطبيعية تعبّر عن التلفظ بالكلام، وتحافظ على وظيفة اسم الفاعل اليوناني من غير تعقيد تركيبي.
- source_word: δελεάζουσιν
  choice: يستدرجون
  rationale: الفعل اليوناني يصوّر الإغراء كجذب الفريسة بالطُّعم؛ و«يستدرجون» يحفظ معنى الجذب الماكر والمقصود.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: بشهوات الجسد
  rationale: حُملت ἐν على الوسيلة، وحُفظت استعارة σάρξ بلفظ «الجسد» بدل تفسيرها بعقيدة مثل «الطبيعة الخاطئة».
- source_word: ἀσελγείαις
  choice: الفجور
  rationale: يدل اللفظ على السلوك الحسي المنفلت المتجاوز للحياء؛ و«الفجور» واضح وموجز ويحمل البعد الأخلاقي المقصود.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: الذين بالكاد يفلتون
  rationale: تحافظ العبارة على كون الإفلات جاريًا وهشًّا، من غير الجزم بأنه اكتمل أو تحديد دلالته الخلاصية.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: الذين يعيشون في الضلال
  rationale: ينقل «يعيشون» معنى السلوك وطريقة الحياة المستمرة في ἀναστρεφομένους، بينما يحفظ «الضلال» الدلالة الأخلاقية والروحية لـ πλάνη.
theological_decisions:
- issue: المعنى الأخلاقي لكلمة σάρξ
  choice: شهوات الجسد
  alternative: الشهوات الجسدية؛ شهوات الطبيعة الخاطئة
  rationale: يحفظ «الجسد» الاستعارة اليونانية والتوتر اللاهوتي من غير اختزالها في الجسد المادي وحده أو إدخال مصطلح عقائدي تفسيري.
- issue: حال الذين يُستدرجون
  choice: الذين بالكاد يفلتون من الذين يعيشون في الضلال
  alternative: الذين أفلتوا حقًا؛ الذين بدأوا للتو يفلتون
  rationale: النص المختار يصورهم في أثناء إفلات غير مستقر، ولا يحسم هل تم إفلاتهم أو ما إذا كان ذا معنى خلاصي نهائي. وتُذكر القراءة النصية البديلة في الحاشية.
- issue: العلاقة بين ἐπιθυμίαις σαρκὸς وἀσελγείαις
  choice: بشهوات الجسد والفجور
  alternative: بشهوات الجسد، أي بأعمال الفجور؛ بشهوات الجسد وبأعمال الفجور
  rationale: تبقي الصياغة العلاقة النحوية محتملة بين التنسيق والتخصيص، فلا تجعل «الفجور» بالضرورة تفسيرًا حصريًا للشهوات ولا تفصله عنها فصلًا حادًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت ألفاظ مألوفة مثل «يستدرجون» و«يعيشون في الضلال»، مع إبقاء استعارة «الجسد» والغموض المتعلق بمدى الإفلات والعلاقة النحوية بين الشهوات والفجور.
