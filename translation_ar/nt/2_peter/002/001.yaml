reference: 2 Peter 2:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: ar
  text: 'لكن ظهر أيضًا أنبياء كذبة بين الشعب، كما سيكون بينكم أيضًا معلّمون كذبة، يدسّون بدعًا مهلِكة[a]، وينكرون حتى السيد الذي اشتراهم[b]، فيجلبون على أنفسهم هلاكًا سريعًا.


    [a] أو: «أحزابًا مهلِكة». يمكن للكلمة اليونانية أن تدل على أحزاب أو طوائف، لكنها تشير هنا على الأرجح إلى بدع أو حركات تقود إلى الهلاك.


    [b] أو: «المولى الذي فداهم». يقول اليوناني حرفيًا: «السيد الذي اشتراهم»، فيُبقي على صورة الشراء من غير أن يحسم الخلافات اللاهوتية الأوسع بشأن مداها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أحزابًا مهلِكة». يمكن للكلمة اليونانية أن تدل على أحزاب أو طوائف، لكنها تشير هنا على الأرجح إلى بدع أو حركات تقود إلى الهلاك.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «المولى الذي فداهم». يقول اليوناني حرفيًا: «السيد الذي اشتراهم»، فيُبقي على صورة الشراء من غير أن يحسم الخلافات اللاهوتية الأوسع بشأن مداها.'
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἐγένοντο
  choice: ظهر
  rationale: ينقل نشوء الأنبياء الكذبة وظهورهم وسط الجماعة بصياغة عربية طبيعية، بدل الترجمة الحرفية الثقيلة «صاروا».
- source_word: ψευδοπροφῆται / ψευδοδιδάσκαλοι
  choice: أنبياء كذبة / معلّمون كذبة
  rationale: ترجمة مباشرة وشفافة تحافظ على التوازي بين الفئتين في النص اليوناني.
- source_word: ἐν τῷ λαῷ
  choice: بين الشعب
  rationale: تحافظ على التعبير العام في الأصل، مع أن السياق يُفهم منه شعب العهد في الماضي، من غير إضافة «إسرائيل» إلى المتن.
- source_word: παρεισάξουσιν
  choice: يدسّون
  rationale: يفيد الإدخال الخفي أو المتسلل، وهو معنى الفعل اليوناني، ويأتي موجزًا وطبيعيًا في العربية المعاصرة.
- source_word: αἱρέσεις ἀπωλείας
  choice: بدعًا مهلِكة
  rationale: ينقل معنى الآراء أو الحركات المنحرفة المؤدية إلى الهلاك، مع إثبات احتمال «الأحزاب» في الحاشية.
- source_word: τὸν ... δεσπότην
  choice: السيد
  rationale: يعبّر عن سلطة δεσπότης وملكيته، من غير دمجه صراحة في لفظ «الرب» المعتاد لترجمة κύριος.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: الذي اشتراهم
  rationale: يحافظ على استعارة الشراء الصريحة في ἀγοράζω، ولا يستبدلها بتفسير لاهوتي أضيق مثل «فداهم».
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: فيجلبون على أنفسهم هلاكًا سريعًا
  rationale: يحفظ القوة الانعكاسية ونتيجة أفعالهم، ويترجم ταχινή بمعنى سريع أو وشيك من غير زيادة تفسيرية.
theological_decisions:
- issue: دلالة αἱρέσεις في السياق
  choice: بدعًا
  alternative: أحزابًا أو طوائف
  rationale: يرجّح سياق الإدخال الخفي وإنكار السيد معنى المعتقدات أو الحركات المنحرفة، مع إبقاء الدلالة الاجتماعية الممكنة في الحاشية.
- issue: قوة عبارة τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: السيد الذي اشتراهم
  alternative: المولى الذي فداهم
  rationale: تحافظ الصياغة على استعارة الشراء وعلى التوتر اللاهوتي في كون المعلّمين الكذبة موصوفين بأن السيد اشتراهم، من غير حسم طبيعة هذا الشراء أو مداه.
- issue: تمييز δεσπότης عن κύριος
  choice: السيد
  alternative: المولى أو الرب
  rationale: اختير «السيد» للدلالة على صاحب السلطان والملك، مع تجنب تسوية اللقب تلقائيًا بلفظ «الرب» الذي يترجم عادة κύριος.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تحذيرية رصينة. استُعمل «يدسّون» لإبراز الخفاء بلا عامية، وحوفظ على التوازي بين «أنبياء كذبة» و«معلّمين كذبة». جميع علامتي الحاشية مثبتتان في موضعيهما في المتن.
