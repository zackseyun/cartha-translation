  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: ar
  text: هؤلاء ينابيع بلا ماء، وضباب[c] تسوقه عاصفة[a]، وقد حُفِظ لهم قتام الظلام[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسحاب تسوقه عاصفة». واللفظ اليوناني يعني، على نحو أدق، الضباب أو الغشاوة، لكن بعض الترجمات تنقله بمعنى أوسع: «سحاب».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وقد حُفِظ لهم سواد الظلام».'
    reason: lexical_alternative
  - marker: c
    text: تخلو بعض المخطوطات من «وضباب».
    reason: textual_variant
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: ينابيع بلا ماء
  rationale: تحافظ «ينابيع» على معنى πηγαί بوصفها منابع ماء طبيعية لا آبارًا محفورة، ويُبقي «بلا ماء» المفارقة التصويرية واضحة وطبيعية.
- source_word: ὁμίχλαι
  choice: ضباب
  rationale: يدل اللفظ اليوناني على الضباب أو الغشاوة الجوية، و«ضباب» هو المقابل العربي الطبيعي الأقرب، من غير توسيعه إلى «سحاب» في المتن.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: تسوقه عاصفة
  rationale: تنقل العبارة قوة الريح العنيفة وحركة الضباب المدفوع بها، بصياغة عربية موجزة وتحافظ على كون العاصفة هي المؤثر في الصورة.
- source_word: οἷς
  choice: لهم
  rationale: يعود الضمير إلى المعلّمين الكذبة المشار إليهم بقول الكاتب «هؤلاء»، لا إلى الصور المجازية القريبة؛ لذلك يحافظ ضمير جمع العقلاء على المرجع الشخصي.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: قتام الظلام
  rationale: تنقل «قتام» معنى الدجى الكثيف الكامن في ζόφος، بينما يحافظ تركيب الإضافة على اللفظين وعلى شدة الصورة بدل اختزالهما في وصف واحد.
- source_word: τετήρηται
  choice: حُفِظ
  rationale: يحافظ المبني للمجهول على عدم تسمية الفاعل في اليونانية، وتدل الصيغة مع «قد» على أن هذا المصير قد أُعِدّ وبقي محفوظًا لهم.
theological_decisions:
- issue: لغة الدينونة في الجملة الأخيرة وهوية الفاعل
  choice: 'إبقاء الفعل مبنيًا للمجهول: «قد حُفِظ لهم» من غير إضافة اسم الله.'
  alternative: 'التصريح: «حفظه الله لهم» أو استعمال «أُعِدّ لهم».'
  rationale: النص يوحي بدينونة إلهية لكنه لا يسمّي الفاعل، ولذلك تحافظ الترجمة على المبني للمجهول ولا تضيف تصريحًا عقديًا غير وارد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُعمل «قتام الظلام» للمحافظة على تركيب الصورة المكثفة، مع تجنب العبارات المذهبية أو تسمية فاعل لم يذكره النص.
