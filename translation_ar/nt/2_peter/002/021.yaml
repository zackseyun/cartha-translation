source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: ar
  text: فقد كان خيرًا لهم ألّا يعرفوا طريق البر[a] من أن يعرفوه ثم يرجعوا[b] عن الوصية المقدسة التي سُلِّمت إليهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سبيل البر». ويمكن أن تعني الكلمة المترجمة «البر» أيضًا «العدالة»، لكن «البر» أنسب للسياق هنا.
    reason: lexical_alternative
  - marker: b
    text: أو «يرتدّوا عن» أو «ينصرفوا عن».
    reason: lexical_alternative
  - marker: c
    text: أو «التي نُقلت إليهم».
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: فقد كان خيرًا لهم
  rationale: تنقل «فقد» علاقة التعليل بالسياق السابق، وتحافظ عبارة «كان خيرًا لهم» على قوة المقارنة من غير إثقال الصياغة العربية.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: ألّا يعرفوا / من أن يعرفوه
  rationale: تكرار جذر «عرف» يقابل تكرار الفعل اليوناني ويحفظ المقارنة. ولم تُضف عبارة «معرفة كاملة» لأن صيغة الفعل قد تدل على معرفة محددة أو راسخة، لكنها لا تقتضي هنا هذا التشديد حتمًا.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: طريق البر
  rationale: «طريق» تعبير عربي طبيعي للاستعارة الدالة على نهج الحياة، و«البر» يلائم المعنى الأخلاقي والديني لـ δικαιοσύνη في هذا السياق أكثر من «العدالة».
- source_word: ὑποστρέψαι ἐκ
  choice: يرتدّوا عن
  rationale: يفيد الفعل اليوناني الرجوع إلى الوراء بعد المعرفة، و«يرتدّوا عن» يحفظ معنى الانصراف الرجوعي من غير أن يحدد وحده نتيجة لاهوتية بعينها.
- source_word: παραδοθείσης αὐτοῖς
  choice: التي سُلِّمت إليهم
  rationale: تحافظ الصياغة المبنية للمجهول على كون الوصية قد نُقلت إليهم، من غير إضافة معنى الأمانة أو المسؤولية غير المصرح به.
- source_word: ἁγίας ἐντολῆς
  choice: الوصية المقدسة
  rationale: تحافظ على المفرد وعلى الصفة الدينية الأخلاقية، وهي صياغة واضحة وموقرة في العربية المعاصرة.
theological_decisions:
- issue: هل تُصاغ الآية بما يحسم الجدل بين الارتداد الحقيقي ومجرد الاعتراف الظاهري؟
  choice: إثبات أنهم عرفوا طريق البر ثم ارتدّوا عن الوصية، كما يقول النص، من غير إضافة حكم صريح على حالتهم الخلاصية.
  alternative: تشديد العبارة لتقرر فقدان الخلاص، أو تليين «عرفوا» لتوحي بأن معرفتهم كانت سطحية فقط.
  rationale: النص يقرر معرفة حقيقية بحسب عبارته ورجوعًا عن الوصية، لكنه لا يفصل هنا وحده جميع الأسئلة العقائدية المتعلقة بالمثابرة أو الارتداد؛ لذلك تحفظ الترجمة التوتر اللاهوتي ولا تحسمه مذهبيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة وقورة. حُفظ تكرار «يعرفوا/يعرفوه» وبنية المقارنة، مع تجنب المصطلحات المذهبية أو التفسير الزائد.
