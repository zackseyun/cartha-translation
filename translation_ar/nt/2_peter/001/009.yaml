id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: ar
  text: لأن مَن لا تتوافر فيه هذه الأمور[a] هو أعمى، قصير البصر[b]، وقد نسي تطهيره من خطاياه السابقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: هذه الصفات؛ وتشير العبارة إلى الفضائل المذكورة قبل ذلك.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: لا يرى إلا ما هو قريب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: مَن
  rationale: اسم موصول عام يشير إلى أي شخص تتصف حاله بافتقاد الأمور المذكورة، من غير تقييد بالجنس.
- source_word: μὴ πάρεστιν ταῦτα
  choice: لا تتوافر فيه هذه الأمور
  rationale: ينقل التركيب الدال على عدم وجود هذه الأمور لدى الشخص بصياغة عربية طبيعية، مع إبقاء «هذه الأمور» إحالة واسعة إلى ما سبق.
- source_word: τυφλός
  choice: أعمى
  rationale: يحافظ على الاستعارة المباشرة وعلى التوتر البلاغي بينها وبين وصف قِصَر البصر الآتي.
- source_word: μυωπάζων
  choice: قصير البصر
  rationale: ينقل معنى عدم رؤية البعيد بعبارة عربية مألوفة، من غير دمجه في وصف «أعمى» أو إلغاء أحد الصورتين.
- source_word: λήθην λαβὼν
  choice: وقد نسي
  rationale: صياغة اصطلاحية طبيعية للتعبير اليوناني الحرفي «أخذ نسيانًا».
- source_word: καθαρισμοῦ
  choice: تطهيره
  rationale: يحافظ على الاسم الدال على إزالة الدنس، مع إضافة ضمير المفعول الذي تقتضيه العربية لبيان أن الشخص هو الذي نال التطهير.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: من خطاياه السابقة
  rationale: تعبر «من» عن الانفصال عن الخطايا بالتطهير، وتحفظ «السابقة» الدلالة الزمنية لـπάλαι والضمير المفرد في αὐτοῦ.
theological_decisions:
- issue: طبيعة التطهير المشار إليه
  choice: تطهيره من خطاياه السابقة
  alternative: تطهير خطاياه السابقة
  rationale: الصياغة المختارة تفيد أن الشخص طُهّر من الخطايا، من غير تحديد آلية هذا التطهير أو توقيته على نحو يتجاوز النص.
- issue: الجمع بين العمى وقِصَر البصر
  choice: 'الإبقاء على الصورتين: «أعمى، قصير البصر»'
  alternative: تفسير إحداهما بالأخرى أو الاكتفاء بإحداهما
  rationale: النص اليوناني يجمع الوصفين، وربما كان الثاني شرحًا للأول أو تشديدًا له؛ لذلك تُحفظ العلاقة البلاغية من غير حسم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «تتوافر فيه» بدل الترجمة الحرفية الثقيلة «ليست حاضرة لديه»، وحُفظت الصورتان المتجاورتان «أعمى» و«قصير البصر» من غير تسوية التوتر بينهما.
