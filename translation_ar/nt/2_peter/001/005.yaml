  - marker: c
    text: يمكن ترجمة الفعل «زوِّدوا» أيضًا بـ«أضيفوا» أو «وفِّروا»، وهو يحمل معنى الإمداد، وربما الإمداد بسخاء.
    reason: lexical_alternative
  - marker: d
