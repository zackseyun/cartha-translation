lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: ولهذا السبب عينه
  rationale: تؤدي العبارة وظيفة انتقالية مؤكِّدة تربط الوصية بما سبق، وهذه الصياغة عربية طبيعية تحفظ معنى التعليل والتوكيد.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: باذلين كل جهد
  rationale: تحفظ صيغة الحال التابعة للأمر، وتعبّر بوضوح عن الاجتهاد الكامل المصاحب لتنفيذ الوصية.
- source_word: ἐπιχορηγήσατε
  choice: زوِّدوا
  rationale: يفيد الفعل الإمداد والتوفير، وقد يحمل إيحاءً بالسخاء؛ و«زوِّدوا» يحفظ هذا المعنى أكثر من «أضيفوا» وحدها.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: إيمانكم بالفضيلة
  rationale: 'أعيد تركيب علاقة ἐν في صيغة عربية طبيعية: تزويد الإيمان بالفضيلة، مع حفظ البنية الحرفية البديلة في الحاشية.'
- source_word: πίστει
  choice: إيمانكم
  rationale: «الإيمان» هو المقابل المباشر والأوضح لـ πίστις هنا، مع ذكر «الأمانة» و«الثقة» بوصفهما احتمالين معجميين.
- source_word: ἀρετήν
  choice: الفضيلة
  rationale: لفظ موجز ومألوف يدل على التميز الخلقي أو الخُلُق الفاضل، من غير توسع تفسيري داخل المتن.
- source_word: γνῶσιν
  choice: المعرفة
  rationale: تنقل المعنى المعجمي الأساسي لـ γνῶσις وتحافظ على تسلسل الصفات في العبارة.
theological_decisions:
- issue: دلالة πίστις في سياق سلسلة من الخصال
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: السياق يسمح بتداخل دلالي، لكن «الإيمان» هو القراءة المباشرة الأرجح؛ لذلك أُبقيت البدائل في الحاشية من غير حسم زائد.
- issue: العلاقة بين الإيمان والفضيلة التي تعبّر عنها ἐν
  choice: زوِّدوا إيمانكم بالفضيلة
  alternative: زوِّدوا في إيمانكم الفضيلة
  rationale: الصياغة المختارة توضّح ارتباط الخصال في عربية سليمة، بينما تحفظ الحاشية البنية الأقرب إلى اللفظ اليوناني من غير تقرير ما إذا كانت العلاقة إضافة محضة أو تنمية داخلية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة وقورة. استُعملت صيغة الحال «باذلين» للمحافظة على تبعية الجهد للأمر، وأُعيد تركيب ἐν في المتن تجنبًا لعبارة عربية متكلّفة، مع توثيق الصياغة الحرفية في الحاشية.
