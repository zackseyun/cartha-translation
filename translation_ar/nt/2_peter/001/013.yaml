  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: ar
  text: لكني أرى أنه من الصواب، ما دمت في هذه الخيمة[a]، أن أوقظكم بالتذكير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «المسكن» أو «الجسد». واليونانية حرفيًا: «الخيمة»، وهي صورة لحياة بطرس الفانية في الجسد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: من الصواب
  rationale: تؤدي العبارة معنى ما هو لائق وصحيح في حكم المتكلم، وهي عربية طبيعية مع «أرى».
- source_word: δὲ
  choice: لكنني
  rationale: تفيد انتقالًا مع مقابلة خفيفة بالسياق السابق، و«لكنني» واضحة من غير مبالغة في حدة الاستدراك.
- source_word: ἡγοῦμαι
  choice: أرى
  rationale: تدل هنا على حكم متروٍّ؛ و«أرى» فصيحة وطبيعية، لا على مجرد الرؤية الحسية.
- source_word: ἐφ’ ὅσον
  choice: ما دمت
  rationale: 'تنقل الدلالة الزمنية في التركيب مع فعل الكينونة: طوال المدة التي يكون فيها في هذه الخيمة.'
- source_word: σκηνώματι
  choice: الخيمة
  rationale: تحفظ الصورة المجازية اليونانية لمسكنه الجسدي الزائل، وتمهّد لصورة نزع الخيمة في الآية التالية.
- source_word: διεγείρειν
  choice: أن أنهضكم
  rationale: ينقل معنى الإيقاظ والاستثارة إلى الانتباه والعمل، بصياغة عربية مباشرة تحفظ قوة الفعل.
- source_word: ἐν ὑπομνήσει
  choice: بالتذكير
  rationale: تفيد الباء الوسيلة التي يتم بها إنهاض المخاطبين، مع إيجاز ووضوح.
theological_decisions:
- issue: المرجع المجازي لعبارة «هذه الخيمة»
  choice: 'إبقاء الصورة في المتن: «هذه الخيمة»'
  alternative: «هذا الجسد» أو «هذا المسكن»
  rationale: النص اليوناني يستعمل صورة الخيمة للإقامة الجسدية الفانية. إبقاؤها يصون صورة الكاتب وصلتها بالآية التالية، من غير تحويل التفسير إلى نص صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ مجاز الخيمة، واستُعملت تراكيب مألوفة مثل «أرى أنه من الصواب» و«ما دمت»، مع تجنب الألفاظ القديمة مثل «المسكن الأرضي» أو «الخيمة الجسدية» في المتن.
