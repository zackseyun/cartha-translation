  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: ar
  text: إذ قد وهبت لنا قدرتُه الإلهية كلَّ ما يتعلّق بالحياة والتقوى، بمعرفة الذي دعانا بمجده وفضيلته الخاصَّين به[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى مجده وفضيلته الخاصَّين به». يمكن فهم العبارة اليونانية الواردة بصيغة الداتيف على أكثر من وجه.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: إذ
  rationale: تصل العبارة بما يليها وتعرض أساس الكلام، من غير حصر دلالتها في سببية صريحة تمامًا.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: كلَّ ما يتعلّق بالحياة والتقوى
  rationale: تنقل تركيب τὰ πρὸς بمعنى ما يختص بالحياة والتقوى أو يتصل بهما، من غير إضافة معنى «الاحتياج» غير المصرّح به.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: قدرتُه الإلهية
  rationale: صياغة عربية طبيعية تحفظ نسبة القدرة إليه ودلالة θεῖος.
- source_word: δεδωρημένης
  choice: قد وهبت
  rationale: «وهبت» تحفظ معنى العطاء التفضلي، و«قد» تلائم صيغة التمام الدالة على فعل تمّ وبقي أثره.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: بمعرفة
  rationale: تحفظ دلالة الوسيلة في διά ولا تبالغ في تحميل ἐπίγνωσις معنى اصطلاحيًا مثل «المعرفة الكاملة».
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: الذي دعانا
  rationale: تنقل اسم الفاعل المعرّف بصياغة شخصية واضحة وتحفظ الفعل الماضي.
- source_word: ἰδίᾳ
  choice: الخاصَّين به
  rationale: تُبرز معنى الاختصاص والتوكيد في ἴδιος بدل الاكتفاء بضمير الملكية.
- source_word: δόξῃ
  choice: مجده
  rationale: «المجد» المقابل العربي المألوف الذي يحتفظ بدلالة الجلال الإلهي وظهور العظمة.
- source_word: ἀρετῇ
  choice: فضيلته
  rationale: «الفضيلة» تحفظ مجال معنى ἀρετή بين الصلاح والامتياز، ولا تحصره في التفوق المجرد.
- source_word: ζωὴν
  choice: الحياة
  rationale: تحافظ على اتساع اللفظ اليوناني من غير تقييده بالحياة الحاضرة أو الأبدية وحدها.
- source_word: εὐσέβειαν
  choice: التقوى
  rationale: لفظ عربي واضح يجمع التوجه إلى الله والسلوك الموافق لذلك.
theological_decisions:
- issue: 'دلالة العبارة ἰδίᾳ δόξῃ καὶ ἀρετῇ: أهي وسيلة الدعوة أم غايتها؟'
  choice: بمجده وفضيلته الخاصَّين به
  alternative: إلى مجده وفضيلته الخاصَّين به
  rationale: مع قراءة SBLGNT بصيغة المجرور الداتيفي، يُفهم التركيب على نحو طبيعي بوصفه دالًا على الوسيلة أو الكيفية. ومع ذلك، يبقى فهمه على أنه غاية الدعوة ممكنًا، ولذلك حُفظ في الحاشية بدل حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت بنية الآية بوصفها تمهيدًا نحويًا لما يليها، ولم تُحوَّل إلى جملة مستقلة مكتملة المعنى.
