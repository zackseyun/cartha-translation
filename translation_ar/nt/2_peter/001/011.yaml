  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: ar
  text: فبهذه الطريقة سيُمنَح لكم بسخاءٍ الدخولُ[a] إلى الملكوت الأبدي لربنا ومخلّصنا يسوع المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مدخلٌ». يمكن للكلمة اليونانية أن تدل على الدخول أو المدخل.'
    reason: lexical_alternative
  - marker: b
    text: «المسيح» ترجمة للقب اليوناني Χριστός، ومعناه «الممسوح».
    reason: terminology_note
lexical_decisions:
- source_word: οὕτως
  choice: بهذه الطريقة
  rationale: تحافظ العبارة على قوة الإشارة في اليونانية، وتربط النتيجة بطريقة السلوك المذكورة في السياق السابق.
- source_word: γὰρ
  choice: لأنه
  rationale: تنقل الصلة التفسيرية بالقول السابق بصياغة عربية واضحة.
- source_word: πλουσίως
  choice: بسخاءٍ
  rationale: تؤدي معنى الوفرة والكرم في منح الدخول، من غير توسع تفسيري.
- source_word: ἐπιχορηγηθήσεται
  choice: سيُمنَح
  rationale: يحافظ المبني للمجهول على كون الدخول عطية تُقدَّم للمخاطَبين، وهو أكثر سلاسة في العربية من الترجمة الحرفية «سيُوفَّر» في هذا التركيب.
- source_word: ὑμῖν
  choice: لكم
  rationale: تنقل دلالة المجرور اليوناني على المستفيد نقلاً مباشرًا وطبيعيًا.
- source_word: ἡ εἴσοδος
  choice: دخولٌ
  rationale: ينقل الاسم اليوناني الذي قد يدل على فعل الدخول أو مدخله، ويلائم فعل «يُمنَح» في العربية.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: إلى الملكوت الأبدي
  rationale: ترجمة مباشرة تحافظ على الاتجاه وعلى الوصف الأخروي للملكوت.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: لربنا ومخلّصنا
  rationale: تنقل اللقبين بوصفهما عائدين إلى شخص واحد، مع تكرار ضمير المتكلمين بما يلائم العربية.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ معناه بوصفه لقبًا لا مجرد اسم منقول صوتيًا.
theological_decisions:
- issue: مرجع لقبي «ربنا ومخلّصنا»
  choice: كلا اللقبين يعود إلى شخص واحد هو يسوع المسيح.
  alternative: إمكان قراءة اللقبين على أنهما يعودان إلى مرجعين مختلفين.
  rationale: تجمع البنية اليونانية لقبين شخصيين مفردين تحت أداة تعريف واحدة وتربطهما بالواو، ثم تسمي يسوع المسيح؛ ولذلك ترجح بقوة وحدة المرجع من دون الحاجة إلى إضافة تفسير مذهبي إلى النص.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. حوفظ على المبني للمجهول وعلى صورة منح الدخول بسخاء، مع ترتيب عربي طبيعي وتجنب إضافة فاعل غير مذكور صراحة في اليونانية.
