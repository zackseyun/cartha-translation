  source_fidelity: 'النص العربي ينقل بدقة البنية الأساسية لليونانية: نفي صدور النبوة عن الإرادة البشرية، ثم كلام بشر من عند الله تحت فاعلية الروح القدس. «بإرادة إنسان» مناسبة لـ θελήματι ἀνθρώπου، و«من عند الله» تحافظ على دلالة المصدر في ἀπὸ θεοῦ، و«محمولين بالروح القدس» تعكس φερόμενοι ὑπὸ πνεύματος ἁγίου من غير فرض معنى الإملاء الآلي.'
