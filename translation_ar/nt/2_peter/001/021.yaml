source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: ar
  text: لِأَنَّهُ لَمْ تَصْدُرْ نُبُوَّةٌ قَطُّ بِإِرَادَةِ إِنْسَانٍ[a]، بَلْ تَكَلَّمَ أُنَاسٌ مِنْ عِنْدِ اللهِ، مَحْمُولِينَ بِالرُّوحِ الْقُدُسِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم تُسَقْ نبوّةٌ قط بإرادة إنسان». الفعل اليوناني مبني للمجهول، وهو من الجذر نفسه الذي جاءت منه كلمة «محمولين» في آخر الآية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إذ كان الروح القدس يحملهم». التعبير اليوناني حرفيًا «محمولين»، ويؤكد توجيه الروح وفاعليته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: بِإِرَادَةِ إِنْسَانٍ
  rationale: يحفظ المفرد التمثيلي في اليونانية، ويفيد أن الإرادة البشرية ليست مصدر النبوة، دون حصر المعنى في الذكور.
- source_word: ἠνέχθη
  choice: تَصْدُرْ
  rationale: ينقل معنى نشوء النبوة ومصدرها بصياغة عربية طبيعية. تعذّر الحفاظ الكامل على المبني للمجهول من غير تركيب ثقيل، لكن الصلة الدلالية بالفعل اللاحق تُبيَّن في الحاشية.
- source_word: προφητεία
  choice: نُبُوَّةٌ
  rationale: المقابل العربي المألوف والواضح للكلام أو الإعلان النبوي في هذا السياق.
- source_word: ποτέ
  choice: قَطُّ
  rationale: مع النفي يؤدي معنى «لم يحدث في أي وقت»، وهو تعبير عربي موجز وفصيح.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: بِالرُّوحِ الْقُدُسِ
  rationale: الباء تنقل فاعلية الروح القدس في توجيه المتكلمين، والتعريف مناسب للمرجع المحدد في السياق.
- source_word: φερόμενοι
  choice: مَحْمُولِينَ
  rationale: يحفظ الصورة الحسية للفعل اليوناني ويبرز فاعلية الروح القدس، بدل تعبير أعم مثل «مُلهمين» أو «مدفوعين».
- source_word: ἐλάλησαν
  choice: تَكَلَّمَ
  rationale: مقابل مباشر وطبيعي للفعل اليوناني دون رفع مستوى الأسلوب أو إضافة معنى.
- source_word: ἀπὸ θεοῦ
  choice: مِنْ عِنْدِ اللهِ
  rationale: يحفظ دلالة المصدر والأصل، ويميّزها عن دلالة الفاعلية في عبارة «بالروح القدس».
- source_word: ἄνθρωποι
  choice: أُنَاسٌ
  rationale: ينقل معنى البشر المتكلمين بصيغة عربية طبيعية عامة، ولا يوحي بأن المرجع مقصور على الذكور.
theological_decisions:
- issue: العلاقة بين الفاعلية الإلهية والبشرية في النبوة
  choice: النبوة لم تنشأ بإرادة بشرية، ومع ذلك تكلم أناس حقيقيون من عند الله وهم محمولون بالروح القدس.
  alternative: إما أن يكون الكلام إملاءً آليًا يلغي دور المتكلمين، أو أن تكون النبوة ناشئة جزئيًا من مبادرة بشرية مستقلة.
  rationale: النص يثبت معًا فعل البشر «تكلم» ومصدر الكلام وفاعليته الإلهيين «من عند الله» و«محمولين بالروح القدس»، فلا ينبغي للترجمة أن تلغي أحد الجانبين.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أناس» للمعنى البشري العام، وحُفظ الفرق بين مصدر الكلام «من عند الله» وفاعلية الروح «بالروح القدس». وُضعت علامات الحواشي في المتن بحسب ترتيب ظهورها.
