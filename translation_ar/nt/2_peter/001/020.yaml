  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: ar
  text: 'عالمين هذا أولًا: أن كل نبوءة في الكتاب لا تنشأ من تفسير خاص،'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: عالمين أولًا هذا
  rationale: يحافظ على صيغة اسم الفاعل وترتيب الأولوية في اليونانية، مع تعبير عربي واضح ومهيب.
- source_word: πᾶσα προφητεία γραφῆς
  choice: كل نبوة في الكتاب
  rationale: يفهم المضاف إليه γραφῆς على أنه يحدد مجال النبوة، أي النبوة الواردة في الكتاب المقدس، من دون تحويل πᾶσα إلى نفي شامل بصيغة «لا نبوة».
- source_word: ἰδίας ἐπιλύσεως
  choice: تفسير خاص
  rationale: ينقل ἰδίας بمعنى خاص أو ذاتي، وἐπίλυσις بمعنى تفسير؛ وتظل هوية صاحب التفسير غير مصرّح بها كما في الأصل.
- source_word: οὐ γίνεται
  choice: لا تنشأ
  rationale: تنقل معنى «لا تصير/لا تأتي إلى الوجود» بصورة عربية طبيعية، ولا تختزله إلى «ليست»، مع إبقاء السؤال مفتوحًا عما إذا كان المقصود منشأ النبوة أو كيفية تفسيرها.
theological_decisions:
- issue: هل تتحدث العبارة عن منشأ النبوة أم عن تفسير القارئ لها؟
  choice: لا تنشأ من تفسير خاص
  alternative: لا تقبل تفسيرًا خاصًا
  rationale: الفعل γίνεται يدل على الحدوث أو النشوء، ولذلك لم تُصغ العبارة كحظر مباشر على التفسير الفردي. وفي الوقت نفسه أُبقي لفظ «تفسير» لأن ἐπίλυσις يحمله، فتحفظ الصياغة التوتر القائم في الأصل وسياق الآية التالية.
- issue: دلالة ἰδίας وهوية المرجع
  choice: خاص
  alternative: تفسير النبي نفسه / تفسير المرء نفسه
  rationale: الأصل لا يصرح بصاحب «التفسير»، وقد يعود الوصف إلى النبي أو إلى الإنسان عمومًا؛ لذلك لا تُضاف هوية غير موجودة في النص.
- issue: نطاق النفي مع πᾶσα ... οὐ
  choice: كل نبوة ... لا تنشأ
  alternative: لا تنشأ أية نبوة
  rationale: يحافظ الاختيار على البنية السطحية اليونانية وعلى الصياغة التي تؤكد «كل نبوة»، بدل تسوية النطاق المنطقي إلى صيغة عربية أخرى قد تحجب هذا التركيب.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعمل «الكتاب» للدلالة على الكتاب المقدس بحسب السياق، وحُفظت البنية الموجزة للآية لأنها تتصل نحويًا بما قبلها وبعدها.
