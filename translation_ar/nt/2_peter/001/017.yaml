  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: ar
  text: 'لأنه حين نال من الله الآب كرامةً ومجدًا، جاءه من المجد ذي الجلال[a] صوتٌ كهذا: «هذا هو ابني، حبيبي[b]، الذي سُررتُ به[c]»—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بواسطة المجد ذي الجلال». قد تدل ὑπό اليونانية على الفاعل أو الوسيط؛ وتُظهر «من» مصدر الصوت في العربية على نحو طبيعي.
    reason: lexical_alternative
  - marker: b
    text: 'أو «هذا هو ابني الحبيب». واليونانية، على نحو أقرب إلى الحرفية: «هذا هو ابني، حبيبي».'
    reason: lexical_alternative
  - marker: c
    text: 'أو «الذي أنا راضٍ عنه» أو «الذي سُررتُ به». واليونانية حرفيًا: «إلى/نحو الذي سُررتُ»، وهو تعبير اصطلاحي يرد صداه في روايات المعمودية والتجلي في الأناجيل.'
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν
  choice: حين نال
  rationale: ينقل اسم الفاعل الأوريستي بقيمة زمنية طبيعية في العربية، مع بقاء يسوع هو الفاعل المفهوم من السياق.
- source_word: παρὰ θεοῦ πατρὸς
  choice: من الله الآب
  rationale: تحفظ παρά مع المضاف إليه دلالة المصدر، وتأتي «الله الآب» بصياغة عربية واضحة ومألوفة.
- source_word: τιμὴν καὶ δόξαν
  choice: كرامةً ومجدًا
  rationale: تحفظ الاسمين متميزين، وتؤدي معنى التكريم والبهاء الإلهي دون دمجهما.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: جاءه ... صوتٌ
  rationale: صياغة عربية طبيعية تؤدي وصول الصوت إليه؛ أما النقل الحرفي للمبني للمجهول، «حُمِل إليه صوت»، فثقيل وقد يوحي بحامل مادي.
- source_word: τοιᾶσδε
  choice: كهـذا
  rationale: إشارة استباقية طبيعية إلى مضمون القول المقتبس الذي يليها.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: من المجد ذي الجلال
  rationale: تنقل التعبير التوقيري عن الحضور الإلهي، وتجعل «من» مصدر الصوت في عربية سليمة، مع بقاء احتمال الوكالة النحوي في اليونانية موضحًا في الحاشية [a].
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: هذا هو ابني، حبيبي
  rationale: تحفظ البدل أو العطف البياني في اليونانية وتكرار معنى الملكية، بدل دمجهما مباشرة في «ابني الحبيب».
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: الذي به سُررتُ
  rationale: تحفظ صيغة الماضي في εὐδόκησα وتقدم تركيبًا عربيًا مفهومًا قريبًا من حرف الجر اليوناني؛ ويمكن فهم العبارة أيضًا بصيغة الرضا المستمر كما توضحه الحاشية [c].
theological_decisions:
- issue: التعبير التوقيري τῆς μεγαλοπρεποῦς δόξης
  choice: المجد ذي الجلال
  alternative: المجد العظيم؛ الجلال الإلهي
  rationale: يحافظ على كون العبارة وصفًا توقيريًا لله أو لحضوره المجيد من غير إضافة لفظ «الإلهي» غير الوارد صراحة، ومن غير تحويل الوصف إلى اسم علم على نحو غير لازم في العربية.
- issue: صياغة إعلان الآب عن الابن
  choice: هذا هو ابني، حبيبي، الذي به سُررتُ
  alternative: هذا هو ابني الحبيب، الذي به سُررتُ؛ هذا هو ابني، حبيبي، الذي به أنا راضٍ
  rationale: تحفظ البنية البَدَلية والتوكيد في النص اليوناني، ولا تضيف صياغة عقائدية لاحقة، كما تُبقي زمن الفعل الأوريستي ظاهرًا مع بيان البدائل الاصطلاحية في الحواشي.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. استُخدمت «نال» و«جاءه صوت» لتجنب الثقل الحرفي، مع الحفاظ على التمييز بين «الكرامة» و«المجد» وعلى البنية البَدَلية في قول الآب. يجب إظهار علامات الحواشي في المتن؛ مواضعها الأنسب: [a] بعد «ذي الجلال»، و[b] بعد «حبيبي»، و[c] بعد «سُررتُ».'
