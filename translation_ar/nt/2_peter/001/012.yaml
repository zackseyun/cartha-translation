  terminology: «ثُبِّتُّم» يحافظ جيدًا على المبني للمجهول وعلى دلالة الحالة الناتجة من الفعل التام. و«الحق» مناسب لـἀληθείᾳ. يُستحسن جعل «الحق الذي لديكم الآن» في المتن، وإيراد الصيغة الأقرب حرفيًا «الحق الحاضر» بديلًا في الحاشية.
