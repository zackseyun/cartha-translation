  source_fidelity: 'المعنى العام منقول بأمانة: الاستنتاج، والعزم المستمر على التذكير، ومعرفة المخاطبين السابقة، وحالة تثبيتهم، كلها حاضرة. لكن «بينكم» في «الحق الحاضر بينكم» تضيف تحديدًا مكانيًا/جماعيًا غير منصوص عليه صراحة في اليونانية؛ فـπαρούσῃ تعني «الحاضر/المتاح الآن» ويمكن أن تتصل بما لدى المخاطبين دون الجزم بأنه «بينهم».'
