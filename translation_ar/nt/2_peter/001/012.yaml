  to: لذلك سأحرص دائمًا على أن أذكّركم بهذه الأمور، مع أنكم تعرفونها وقد ثُبِّتُّم في الحق الذي لديكم الآن.[a]
  rationale: تُحذف «بينكم» لأنها توسّع الدلالة المحتملة للعبارة اليونانية، ويُستعمل في المتن تعبير عربي طبيعي يوضح أن الحق حاضر لدى المخاطبين الآن. وتبقى الصياغة الحرفية «الحق الحاضر» في الحاشية للمحافظة على اتساع العبارة الأصلية.
