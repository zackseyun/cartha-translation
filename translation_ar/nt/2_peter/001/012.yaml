  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: ar
  text: لذلك سأحرص دائمًا على أن أذكّركم بهذه الأمور، مع أنكم تعرفونها وقد ثُبِّتُّم في الحق الذي لديكم الآن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الحق الحاضر».'
    reason: بديل لفظي أقرب إلى التعبير اليوناني، الذي يمكن أن يعني الحق الحاضر أو المتاح الآن.
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: أداة استنتاج تربط القول بما سبقه ربطًا واضحًا وطبيعيًا.
- source_word: μελλήσω
  choice: سأحرص
  rationale: يفيد المستقبل هنا القصد والاستعداد المستمر، لا مجرد قرب وقوع الفعل؛ و«سأحرص» تنقل هذا البعد الإرادي دون إثقال.
- source_word: ἀεὶ
  choice: دائمًا
  rationale: تنقل معنى الاستمرار أو التكرار المتواصل بصورة مباشرة.
- source_word: ὑπομιμνῄσκειν
  choice: أن أذكّركم
  rationale: المعنى هو جعل المخاطبين يتذكرون؛ والاستمرار مفهوم أيضًا من «دائمًا».
- source_word: περὶ τούτων
  choice: بهذه الأمور
  rationale: تعبير عربي طبيعي لمعنى «عن/بشأن هذه الأمور».
- source_word: καίπερ
  choice: مع أن
  rationale: 'تحفظ دلالة التنازل: التذكير مستمر رغم معرفتهم السابقة.'
- source_word: εἰδότας
  choice: تعرفونها
  rationale: اسم الفاعل التام يدل على معرفة قائمة، والضمير يعود طبيعيًا إلى «هذه الأمور».
- source_word: ἐστηριγμένους
  choice: قد ثُبِّتُّم
  rationale: يحفظ المبني للمجهول وحالة الثبات الناتجة من فعل سابق، من غير تحديد فاعل لم يصرّح به النص.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: في الحق الحاضر بينكم
  rationale: يحفظ معنى الحضور في παρούσῃ، ويجعل العبارة مفهومة عربيًا مع إبقاء احتمال أن المقصود هو الحق الموجود لديهم أو في وسطهم.
theological_decisions:
- issue: دلالة «الحق الحاضر»
  choice: الحق الحاضر بينكم
  alternative: الحق الذي لديكم الآن؛ الحق الحاضر
  rationale: لا تجعل العبارة مصطلحًا عقائديًا خاصًا أو حقًا مرتبطًا بعصر تدبيري معين، بل تحفظ دلالة الحق الموجود حاليًا لدى القراء أو في وسطهم، مع بيان البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «سأحرص» لنقل قصد المتكلم المستمر، و«ثُبِّتُّم» للمحافظة على المبني للمجهول والنتيجة القائمة. وُضعت علامة الحاشية في المتن بعد العبارة التي تشرحها.
