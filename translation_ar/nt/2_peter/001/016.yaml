reference: 2 Peter 1:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: ar
  text: لأننا لم نُعرِّفكم بقوة ربنا يسوع المسيح ومجيئه[a] باتباع خرافات مصطنعة ببراعة، بل كنا شهود عيان لعظمته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «حضوره» أو «قدومه». فالكلمة اليونانية παρουσία قد تدل على الحضور أو الوصول، وكثيرًا ما تشير في العهد الجديد إلى مجيء المسيح.'
    reason: alternative_reading
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: خرافات مصطنعة ببراعة
  rationale: ينقل وصف الخرافات بأنها صيغت بحذق وتكلّف، مع إبقاء النبرة السلبية في العبارة اليونانية.
- source_word: ἐξακολουθήσαντες
  choice: متَّبعين
  rationale: 'صيغة حالية طبيعية تربط الفعل بوسيلة التعريف المنفية: لم نعرّفكم ذلك باتباع الخرافات.'
- source_word: ἐγνωρίσαμεν
  choice: نُعرِّفكم
  rationale: ينقل معنى جعل الأمر معروفًا مع المفعول غير المباشر ὑμῖν، وهو أفصح هنا من «نخبركم» وأدق من «نبشّركم».
- source_word: δύναμιν
  choice: قدرة
  rationale: مقابل مباشر وطبيعي لـ δύναμις، ويحافظ على دلالتها دون توسيع تفسيري.
- source_word: παρουσίαν
  choice: مجيئه
  rationale: يناسب الاستعمال الأخروي الشائع للكلمة عند الإشارة إلى يسوع، مع توثيق احتمالَي «حضوره» و«قدومه» في الحاشية.
- source_word: κυρίου
  choice: ربنا
  rationale: الصيغة العربية المألوفة للقب κύριος مع ضمير المتكلمين.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب اليوناني بمعناه، وتأتي العبارة العربية الطبيعية «يسوع المسيح».
- source_word: ἐπόπται
  choice: شهود عيان
  rationale: يُبرز أنهم رأوا بأنفسهم، وهو محور المقابلة الاستدلالية مع الخرافات.
- source_word: γενηθέντες
  choice: كنا
  rationale: صياغة عربية طبيعية تؤدي معنى صيرورتهم أو كونهم شهود عيان، من غير الترجمة الحرفية الثقيلة «إذ صرنا».
- source_word: μεγαλειότητος
  choice: عظمته
  rationale: «العظمة» تؤدي معنى μεγαλειότης بوضوح ووقار، مع بقاء الإشارة المحتملة إلى مشهد التجلي ضمنية كما في الأصل.
- source_word: ἐκείνου
  choice: ـه
  rationale: الضمير المتصل يعود بوضوح إلى الرب يسوع المسيح، وهو طبيعي أكثر من نقل اسم الإشارة اليوناني حرفيًا.
theological_decisions:
- issue: دلالة παρουσία في السياق المسيحاني
  choice: مجيئه
  alternative: حضوره أو قدومه
  rationale: قد تعني الكلمة الحضور أو القدوم، وكثيرًا ما تدل في العهد الجديد على مجيء المسيح. اختير «مجيئه» في المتن مع حفظ السعة المعجمية في الحاشية.
- issue: نقل Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: كريستوس/المسيح بوصفه اسمًا جامدًا
  rationale: «المسيح» ينقل معنى اللقب اليوناني في عربية طبيعية ولا يحوله إلى لفظ منقول بلا معنى.
- issue: العلاقة بين الشهادة والمعاينة
  choice: بل كنا شهود عيان على عظمته
  alternative: بل إذ صرنا معاينين لجلاله
  rationale: يحافظ النص على المقابلة بين الخرافات المصطنعة والمعاينة المباشرة، دون أن يحدد صراحة الحدث المقصود أو يضيف «التجلي» إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ ترتيب «قدرة ربنا يسوع المسيح ومجيئه» وقوة المقابلة «لا... بل»، مع تجنب الحرفية الثقيلة في صيغتي اسم الفاعل اليونانيتين.
