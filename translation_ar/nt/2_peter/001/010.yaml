source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: ar
  text: لذلك، يا إخوة[a]، ابذلوا مزيدًا من الجهد لتجعلوا دعوتكم واختياركم ثابتين، لأنكم إن فعلتم هذه الأمور فلن تتعثّروا أبدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فاللفظ اليوناني يعني حرفيًا «الإخوة»، وقد يُستعمل لخطاب جماعة المؤمنين كلها، رجالًا ونساءً.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج المبني على ما سبق، وتحافظ على الصلة المنطقية بوضوح.
- source_word: μᾶλλον
  choice: زيدوا اجتهادًا
  rationale: تنقل القوة المقارِنة التي تشدّد الأمر، بصياغة عربية طبيعية بدل ترجمة حرفية ثقيلة مثل «بالأكثر».
- source_word: ἀδελφοί
  choice: يا إخوة
  rationale: تحافظ على الصيغة اليونانية المذكرة في النداء، مع بيان احتمال شمول جماعة المؤمنين كلها في الحاشية.
- source_word: σπουδάσατε
  choice: زيدوا اجتهادًا
  rationale: تنقل معنى الجدّ وبذل العناية الذي يحمله فعل الأمر، وتندمج طبيعيًا مع μᾶλλον.
- source_word: βεβαίαν
  choice: ثابتين
  rationale: تفيد الرسوخ والتأكيد، وتحافظ على المعنى دون حسم كيفية ارتباط سلوك المؤمن بدعوته واختياره.
- source_word: κλῆσιν
  choice: دعوتكم
  rationale: «الدعوة» هي المقابل العربي المألوف والدقيق لفعل الله الداعي في هذا السياق.
- source_word: ἐκλογὴν
  choice: اختياركم
  rationale: يحافظ على مدلول اختيار الله مع إبقاء تركيب الإضافة الوارد في اليونانية، من غير إدخال صياغة مذهبية تفسيرية.
- source_word: ποιεῖσθαι
  choice: أن تجعلوا
  rationale: 'يحافظ على الصياغة السببية المباشرة في الأصل: جعل الدعوة والاختيار ثابتين، بدل تحويلها صراحةً إلى «تبرهنوا» أو «تتحققوا».'
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تعيد الإشارة بوضوح إلى الصفات والممارسات المذكورة في السياق السابق.
- source_word: ποιοῦντες
  choice: إن فعلتم
  rationale: تُظهر القوة الشرطية للسياق في عربية سليمة، مع بقاء الفعل مرتبطًا بممارسة الأمور السابقة.
- source_word: οὐ μὴ
  choice: لن ... أبدًا
  rationale: تنقل النفي اليوناني المؤكد بقوة ووضوح من غير مبالغة أسلوبية.
- source_word: πταίσητέ
  choice: تتعثّروا
  rationale: تحافظ على صورة التعثر، ولا تحصرها في ارتكاب أي خطيئة أو في السقوط النهائي وحده.
theological_decisions:
- issue: معنى جعل الدعوة والاختيار ثابتين
  choice: الإبقاء على صيغة «تجعلوا دعوتكم واختياركم ثابتين» بوصفها حثًا على تثبيتهما أو تأكيدهما في حياة المؤمن، دون القول إن الجهد البشري يُنشئ اختيار الله.
  alternative: «تبرهنوا على دعوتكم واختياركم» أو «تضمنوا اختيار الله لكم»
  rationale: التركيب اليوناني يحتمل معنى الجعل ثابتًا أو التأكيد العملي. والصياغة المختارة تحفظ توتر النص ولا تفرض عليه تفسيرًا مذهبيًا بعينه.
- issue: مدى الوعد في «لن تتعثّروا أبدًا»
  choice: الإبقاء على استعارة التعثر عامةً ضمن سياق الثبات في الحياة المسيحية.
  alternative: «لن تخطئوا قط» أو «لن ترتدوا نهائيًا»
  rationale: الفعل πταίω يدل على التعثر أو الوقوع في الإخفاق؛ فلا ينبغي تضييقه إلى العصمة من كل خطيئة أو إلى السقوط النهائي وحده.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُخدمت «زيدوا اجتهادًا» لجمع معنى μᾶλλον مع σπουδάσατε بصورة طبيعية، وحُفظت استعارة التعثر والتوتر اللاهوتي في العبارة من غير تفسير مذهبي زائد.
