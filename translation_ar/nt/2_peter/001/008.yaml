source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: ar
  text: لِأَنَّ هذِهِ الأُمُورَ، إِنْ كَانَتْ مَوْجُودَةً فِيكُمْ وَآخِذَةً فِي الازْدِيَادِ[a]، فَلَنْ تَجْعَلَكُمْ خَامِلِينَ وَلَا عَدِيمِي الثَّمَرِ فِي مَعْرِفَةِ[b] رَبِّنَا يَسُوعَ الْمَسِيحِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وافرة».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تحمل كلمة «معرفة» هنا معنى «المعرفة التامة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: هذه
  rationale: اسم الإشارة يعود مباشرة إلى الخصال المذكورة في الآيات 5–7، ويحافظ على الإحالة من غير إضافة تفسيرية مثل «هذه الصفات».
- source_word: ὑμῖν ὑπάρχοντα
  choice: موجودة فيكم
  rationale: ينقل اجتماع ضمير الداتيف مع ὑπάρχω، الذي يدل هنا على وجود هذه الخصال لدى المخاطبين؛ وصيغة «فيكم» عربية طبيعية في هذا السياق.
- source_word: πλεονάζοντα
  choice: آخذة في الازدياد
  rationale: يحفظ معنى النمو أو التزايد المستمر، مع ذكر «وافرة» في الحاشية بوصفها احتمالًا معجميًا معتبرًا.
- source_word: ἀργούς
  choice: خاملين
  rationale: يحفظ صورة عدم النشاط أو عدم الفاعلية، ويقابل «عديمي الثمر» بصورة طبيعية من غير حصر المعنى في الكسل الأخلاقي.
- source_word: ἀκάρπους
  choice: عديمي الثمر
  rationale: يحافظ على استعارة الثمر الواضحة في النص اليوناني.
- source_word: καθίστησιν
  choice: تجعلكم
  rationale: للفعل هنا معنى تصييري أو نتيجي؛ وتركيب النفي اللاحق «غير... ولا...» ينقل البنية اليونانية بوضوح.
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: في معرفة
  rationale: تنقل «في» مجال الفاعلية والإثمار المتصل بمعرفة الرب، وهي صياغة عربية طبيعية لا تحسم ما إذا كان εἰς يدل على المجال أو الغاية.
- source_word: ἐπίγνωσιν
  choice: معرفة
  rationale: «معرفة» هي المقابل العربي الطبيعي؛ أما تشديد المعنى إلى «معرفة تامة» فمحتمل لكنه غير لازم معجميًا، لذلك لم يُفرض في المتن.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός وتحفظ معناه اللقبي، مع أسلوب عربي كتابي طبيعي.
theological_decisions:
- issue: دلالة Χριστός في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» هو المقابل العربي الدلالي والراسخ للقب اليوناني، ويحفظ كونه لقبًا من غير تحويله إلى مجرد اسم أو إدخال تفسير طائفي.
- issue: قوة معنى ἐπίγνωσις
  choice: معرفة
  alternative: معرفة تامة
  rationale: قد توحي الكلمة بمعرفة أكمل أو أعمق، لكن هذا التشديد ليس ثابتًا في كل استعمال؛ لذا حُفظ الاحتمال من غير إدخاله قسرًا في المتن.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت «هذه» للمحافظة على الإحالة إلى الخصال السابقة، و«آخذة في الازدياد» لإبراز الحركة المستمرة. وُضعت علامتا الحاشية [a] و[b] في المتن عند موضعيهما.
