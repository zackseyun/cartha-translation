  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: ar
  text: إذ أعلم أن خلع خيمتي قريب[a][b]، كما بيَّن لي أيضًا ربنا يسوع المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إن بطرس يتحدث عن موته القريب باستعارة خلع الخيمة، إذ يصوَّر الجسد مسكنًا مؤقتًا.
    reason: metaphor_explanation
  - marker: b
    text: 'أو: «سيحدث خلع خيمتي سريعًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: إذ أعلم
  rationale: يحفظ صلة اسم الفاعل بما قبله، من غير حصر العلاقة في التعليل الصريح وحده.
- source_word: ταχινή
  choice: قريب
  rationale: يفيد قرب وقوع الحدث في هذا التركيب، وهو تعبير عربي طبيعي لا يبالغ في معنى الوشيك.
- source_word: ἀπόθεσις
  choice: خلع
  rationale: يحفظ صورة نزع الشيء أو طرحه جانبًا، بدل تفسيرها مباشرة بالموت.
- source_word: σκηνώματός
  choice: خيمتي
  rationale: ينقل صورة المسكن المؤقت بوضوح، ولا يستبدل بها مدلولها، أي الجسد.
- source_word: καθὼς καὶ
  choice: كما... أيضًا
  rationale: ينقل معنى المقارنة والتأييد، مع تمثيل καί في العربية تمثيلًا طبيعيًا.
- source_word: κύριος
  choice: ربنا
  rationale: اللقب العربي المعياري في هذا السياق، مع ضمير الجمع الوارد في اليونانية.
- source_word: Ἰησοῦς Χριστός
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحافظ على دلالته اللقبية.
- source_word: ἐδήλωσέν μοι
  choice: بيَّن لي
  rationale: يعبر عن جعل الأمر واضحًا أو معلومًا من غير زيادة توحي بالضرورة بإعلان رسمي.
theological_decisions:
- issue: استعارة الموت الوشيك بخلع الخيمة
  choice: الإبقاء على العبارة التصويرية «خلع خيمتي»
  alternative: موتي قريب / سأموت قريبًا
  rationale: النص اليوناني لا يذكر الموت مباشرة، بل يصور الجسد كخيمة مؤقتة تُخلع؛ والإبقاء على الصورة يحفظ نسيج النص اللاهوتي والأدبي.
- issue: دلالة ταχινή الزمنية
  choice: «قريب»
  alternative: «سيكون سريعًا»
  rationale: قد تتصل اللفظة بقرب الحدث أو سرعته؛ والسياق يرجح قربه، مع إثبات الوجه الآخر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «خلع خيمتي» للمحافظة على الاستعارة الأصلية، و«إذ أعلم» لربط الآية بسياقها السابق دون إثقال الأسلوب.
