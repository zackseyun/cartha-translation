  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: ar
  text: وسأبذل أيضًا كل جهد لكي تتمكنوا، بعد رحيلي[a]، من أن تتذكروا هذه الأمور في كل حين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بتعبير أكثر صراحة: «بعد موتي». واللفظ اليوناني يعني حرفيًا: «بعد خروجي» أو «بعد رحيلي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: سأبذل كل جهد
  rationale: يفيد الفعل عناية جادة وسعيًا حثيثًا؛ وهذه العبارة عربية طبيعية وتحفظ قوة التعبير.
- source_word: δὲ
  choice: و
  rationale: الأداة هنا للاستمرار والانتقال، لا لإفادة تضاد قوي.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ دلالة الإضافة في اليونانية، بينما تُفهم الغاية طبيعيًا من «لكي» التي تصوغ علاقة المصدرين بالفعل الرئيس بوضوح.
- source_word: ἑκάστοτε
  choice: في كل حين
  rationale: تدل على كل مناسبة أو وقت تدعو فيه الحاجة، لا على التذكر المتواصل بلا انقطاع.
- source_word: ἔχειν ὑμᾶς
  choice: تتمكنوا
  rationale: التركيب يفيد القدرة أو توافر الإمكان، وصياغة «تتمكنوا» واضحة وطبيعية في العربية.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: بعد رحيلي
  rationale: «رحيلي» يحفظ استعارة الخروج أو المغادرة التي تشير هنا إلى الموت، دون أن يستبدلها بالتفسير الصريح في المتن.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: أن تتذكروا هذه الأمور
  rationale: هذا تعبير اصطلاحي معناه استحضار الأمور في الذاكرة؛ والصياغة العربية مباشرة وطبيعية.
- source_word: τούτων
  choice: هذه الأمور
  rationale: يحيل اسم الإشارة إلى ما سبق أن شدد عليه الكاتب في السياق، و«الأمور» أوضح في العربية من «الأشياء» هنا.
theological_decisions:
- issue: دلالة ἔξοδος على نهاية حياة بطرس الوشيكة
  choice: رحيلي
  alternative: موتي
  rationale: يحفظ المتن الاستعارة اليونانية من غير أن يضيف إليها دلالة لاهوتية خاصة، وتوضح الحاشية أن المقصود في السياق هو الموت.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «في كل حين» لتجنب توهم الاستمرارية المطلقة، وحُفظت استعارة الرحيل في المتن مع توضيحها في الحاشية.
