  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: ar
  text: وفي المعرفة ضبط النفس، وفي ضبط النفس الثبات[a]، وفي الثبات التقوى[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الصبر»، أو «المثابرة»، أو «الاحتمال بصبر».
    reason: lexical_alternative
  - marker: b
    text: العبارة اليونانية موجزة بحذف الفعل، وتواصل سلسلة الفضائل من الآية السابقة، بحيث تُقرن كل صفة بالصفة التي تليها.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: المعرفة
  rationale: تنقل المعنى المباشر لـγνῶσις، وتحافظ على ترابط سلسلة الفضائل مع الآية السابقة.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: ضبط النفس
  rationale: تعبير عربي حديث وواضح يدل على التحكم في الرغبات والدوافع، من غير الإيحاء الضيق الذي قد يحمله «الاعتدال».
- source_word: ὑπομονήν / ὑπομονῇ
  choice: الثبات
  rationale: يدل على الاستمرار الراسخ تحت المشقة، ولا يحصر المعنى في الانتظار السلبي؛ ويمكن أيضًا ترجمته بالصبر أو المثابرة.
- source_word: εὐσέβειαν
  choice: التقوى
  rationale: لفظ عربي مألوف يدل هنا على التعبد الموقر لله وما يظهر منه في السلوك.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: وفي ...
  rationale: يحافظ على البناء اليوناني المتكرر والموجز، مع بقاء الفعل المفهوم من سياق الآية السابقة غير مصرّح به.
- source_word: δέ
  choice: الواو
  rationale: تربط عناصر السلسلة ربطًا إضافيًا، ولا تفيد هنا تضادًا قويًا.
theological_decisions:
- issue: صياغة سلسلة الفضائل ذات التركيب المحذوف
  choice: 'الإبقاء على التركيب الموجز: «وفي ...»'
  alternative: «وأضيفوا إلى المعرفة ضبط النفس، وإلى ضبط النفس الثبات، وإلى الثبات التقوى»
  rationale: النص اليوناني يواصل أمر الآية السابقة بحذف الفعل، والإبقاء على هذا الإيجاز يحفظ بنية المصدر ولا يصرّح بما تركه النص مفهومًا من السياق.
- issue: دلالة εὐσέβεια
  choice: التقوى
  alternative: التعبد أو الورع
  rationale: «التقوى» تنقل التوجه الموقر نحو الله والسلوك الناشئ عنه، من غير تقييد المعنى بممارسة طقسية أو تصور مذهبي مخصوص.
translation_notes:
  register: العربية فصحى حديثة، واضحة ووقورة. حُفظ التوازي الإيقاعي والتركيب الموجز في اليونانية، واستُعمل «ضبط النفس» بدل ألفاظ أقدم أو أقل وضوحًا، و«الثبات» لإبراز الاستمرار الراسخ تحت المشقة.
