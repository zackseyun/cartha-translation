  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: ar
  text: وفي التقوى المودّة الأخوية[a]، وفي المودّة الأخوية المحبّة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محبّة الإخوة». يشير اللفظ اليوناني إلى المودّة والمحبة بين الإخوة، ولا سيما بين المؤمنين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: التقوى
  rationale: تدلّ εὐσέβεια على التعبّد الموقّر لله كما يظهر في السلوك. و«التقوى» تعبير عربي واضح يجمع التوجّه إلى الله والأثر الأخلاقي العملي.
- source_word: φιλαδελφίαν
  choice: المودّة الأخوية
  rationale: تشير φιλαδελφία إلى المودّة بين الإخوة، ولا سيما بين المؤمنين. وتحافظ «المودّة الأخوية» على تمييزها من ἀγάπη الواردة بعدها.
- source_word: ἀγάπην
  choice: المحبّة
  rationale: «المحبّة» هي المقابل العربي الطبيعي العام لـἀγάπη، وتحفظ هنا ذروة التدرّج بعد المودّة الأخوية من غير تقييد لنطاقها.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: وفي ... ...
  rationale: تحافظ هذه الصياغة على البنية المتوازية المتكررة في سلسلة الفضائل، مع إبقاء العلاقة الدلالية بين كل فضيلة والتي تليها كما في اليونانية.
- source_word: δέ
  choice: و
  rationale: الأداة هنا للوصل والاستمرار في القائمة، لا للاستدراك، ولذلك تناسبها الواو.
theological_decisions:
- issue: التمييز بين φιλαδελφία وἀγάπη في تسلسل الفضائل
  choice: ترجمة φιλαδελφία بـ«المودّة الأخوية» وἀγάπη بـ«المحبّة»
  alternative: ترجمة φιλαδελφία بـ«محبّة الإخوة» وἀγάπη بـ«المحبّة»
  rationale: يستعمل النص اليوناني لفظين متقاربين لكن متميزين على التوالي. وتحفظ «المودّة الأخوية» هذا التمييز والتدرّج البلاغي من عاطفة القرابة بين المؤمنين إلى المحبّة الأوسع.
translation_notes:
  register: صياغة فصحى حديثة، واضحة وموقّرة. استُبقي التوازي الموجز في الأصل، ووُضع رمز الحاشية بعد «المودّة الأخوية» لأنه اللفظ الذي تشرحه الحاشية.
