source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: ar
  text: ومن خلال ذلك قد وهب لنا مواعيده الثمينة والعظيمة جدًا، لكي تصيروا بها شركاء في الطبيعة الإلهية[a]، وقد أفلتّم من الفساد الذي في العالم بسبب الشهوة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مشاركين في الطبيعة الإلهية». تتحدث العبارة عن الاشتراك في الطبيعة الإلهية، من غير أن تقول إن البشر يصيرون آلهة في الجوهر.
    reason: lexical_alternative
  - marker: b
    text: أو «بسبب الرغبة» أو «بالشهوة». قد تعني الكلمة اليونانية الرغبة عمومًا، لكنها تحمل هنا معنى أخلاقيًا سلبيًا بسبب اقترانها بفساد العالم.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: وبهما
  rationale: تفيد διά مع المضاف إليه الواسطة، وضمير الموصول بصيغة الجمع يعود على الأرجح إلى «المجد والفضيلة» في الآية السابقة. تحافظ «وبهما» على الصلة مع السابق من غير إعادة تفسير المرجع داخل الآية.
- source_word: τίμια καὶ μέγιστα
  choice: الثمينة والعظيمة جدًا
  rationale: «الثمينة» تنقل قيمة τίμια، و«العظيمة جدًا» تؤدي قوة صيغة التفضيل μέγιστα بأسلوب عربي طبيعي من دون الإيحاء بأنها مقارنة صريحة بين مواعيد متعددة.
- source_word: ἐπαγγέλματα
  choice: مواعيده
  rationale: «مواعيد» المقابل العربي الواضح والمألوف، وأضيف ضمير الغائب وفق سياق العطاء الإلهي السابق، مع أن اليونانية لا تتضمن ضمير ملكية صريحًا.
- source_word: δεδώρηται
  choice: قد وهب لنا
  rationale: ينقل فعل الهبة المجانية وأثر صيغة التام المستمر إلى الحاضر. وفاعل الفعل مفهوم من سياق الآية السابقة.
- source_word: διὰ τούτων
  choice: بها
  rationale: تفيد الواسطة، ويعود اسم الإشارة إلى المواعيد المذكورة مباشرة؛ والضمير المؤنث المفرد يوافق جمع غير العاقل في العربية.
- source_word: γένησθε
  choice: تصيروا
  rationale: يحفظ معنى الصيرورة في γίνομαι، لا مجرد الوجود أو الوصف الثابت.
- source_word: θείας κοινωνοὶ φύσεως
  choice: شركاء في الطبيعة الإلهية
  rationale: «شركاء في» تعبر بوضوح عن المشاركة التي يدل عليها κοινωνοί، وتحفظ العبارة اللاهوتية القوية من غير توسيع تفسيري أو تخفيف.
- source_word: ἀποφυγόντες
  choice: بعدما هربتم
  rationale: يعكس اسم الفاعل الماضي فعلًا سابقًا أو مصاحبًا للصيرورة، و«هربتم» تؤدي معنى الإفلات المقصود في ἀποφεύγω بأسلوب عربي مباشر.
- source_word: φθορᾶς
  choice: الفساد
  rationale: «الفساد» يلائم البعد الأخلاقي والروحي في السياق، مع بقائه قادرًا على حمل معنى الانحلال الأوسع.
- source_word: ἐν τῷ κόσμῳ
  choice: الذي في العالم
  rationale: تجعل العبارة صفة واضحة للفساد، موافقة للبنية اليونانية.
- source_word: ἐν ἐπιθυμίᾳ
  choice: بسبب الشهوة
  rationale: يمكن لـἐν أن تفيد المجال أو الوسيلة أو الملابسة؛ «بسبب» تعبر طبيعيًا عن علاقة الشهوة بالفساد، و«الشهوة» هنا تحمل القوة الأخلاقية السلبية التي يحددها السياق.
theological_decisions:
- issue: المشاركة في الطبيعة الإلهية (θείας κοινωνοὶ φύσεως)
  choice: شركاء في الطبيعة الإلهية
  alternative: مشاركين في الطبيعة الإلهية
  rationale: تحفظ الصياغة قوة النص وغموضه اللاهوتي المشروع، من غير أن تساوي المؤمنين بالله في الجوهر أو تحصر العبارة في صياغة مذهبية لاحقة.
- issue: القوة الأخلاقية لـἐπιθυμία
  choice: الشهوة
  alternative: الرغبة
  rationale: الكلمة اليونانية قد تعني الرغبة عمومًا، لكن اقترانها بفساد العالم يمنحها هنا معنى سلبيًا. «الشهوة» تنقل هذا المعنى، مع التنبيه إلى أنها لا تقتصر بالضرورة على الشهوة الجنسية.
- issue: علاقة اسم الفاعل ἀποφυγόντες بالفعل الرئيس
  choice: بعدما هربتم
  alternative: إذ هربتم
  rationale: تُظهر الصياغة احتمال السبق الزمني من غير أن تجعل الهرب أساسًا استحقاقيًا للمشاركة؛ وتبقى العلاقة الدقيقة بين الفعلين غير مفصّلة كما في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «وبهما» لربط الآية بسابقتها، و«مواعيده» وفق الاستعمال العربي المألوف، و«شركاء في الطبيعة الإلهية» للمحافظة على قوة الأصل مع شرح احترازي في الحاشية لا داخل المتن.
