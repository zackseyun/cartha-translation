  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: ar
  text: ولدينا الكلمة النبوية أكثر ثباتًا[a]، وتحسنون إذ تنتبهون إليها كما إلى سراج يضيء في موضع مظلم، إلى أن ينبلج النهار ويطلع كوكب الصبح[b] في قلوبكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولدينا الكلمة النبوية الأثبت». يمكن فهم اليونانية على أن الكلمة النبوية قد تأكدت بالشهادة الرسولية، أو على أنها تشدد على رسوخ الكلمة النبوية وموثوقيتها.'
    reason: alternative_reading
  - marker: b
    text: قد تحمل عبارة «كوكب الصبح» صدى لصورة مسيانية؛ قارن رؤيا 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: أكثر ثباتًا
  rationale: يحفظ صيغة المقارنة من غير أن يضيف معنى «جُعلت» غير المصرح به في اليونانية، ويترك مفتوحًا هل المقصود تأكيد الكلمة النبوية بالشهادة السابقة أم التشديد على رسوخها.
- source_word: προφητικὸν λόγον
  choice: الكلمة النبوية
  rationale: ترجمة موجزة وطبيعية تحافظ على الاسـم والصفة في التركيب اليوناني.
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: وتحسنون إذ تنتبهون إليها
  rationale: ينقل معنى الاستحسان في καλῶς ποιεῖτε ومعنى الإصغاء الواعي في προσέχω بعبارة عربية واضحة.
- source_word: λύχνῳ φαίνοντι
  choice: سراج يضيء
  rationale: يحافظ على صورة السراج وعلى دلالة الفعل المستمرة في السياق.
- source_word: αὐχμηρῷ τόπῳ
  choice: موضع مظلم
  rationale: يلائم صورة السراج ويؤدي دلالة المكان القاتم أو الكئيب بوضوح.
- source_word: ἡμέρα διαυγάσῃ
  choice: ينبلج النهار
  rationale: تعبير عربي طبيعي ودقيق عن ابتداء ظهور ضوء النهار.
- source_word: φωσφόρος
  choice: كوكب الصبح
  rationale: يؤدي الصورة الفلكية المقصودة من غير أن يصرح بهوية الرمز التي لم يصرح بها النص.
- source_word: ἀνατείλῃ
  choice: يطلع
  rationale: الفعل العربي الأنسب لطلوع جرم سماوي، ويحافظ على الصورة الأصلية.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: في قلوبكم
  rationale: ترجمة مباشرة تحفظ دلالة القلب بوصفه باطن الإنسان من غير توسع تفسيري.
theological_decisions:
- issue: دلالة صيغة المقارنة βεβαιότερον وصلتها بالشهادة الرسولية السابقة
  choice: الكلمة النبوية أكثر ثباتًا
  alternative: الكلمة النبوية الأثبت؛ أو الكلمة النبوية التي تأكدت أكثر
  rationale: 'الصياغة تحافظ على المقارنة وعلى الغموض الحقيقي في اليونانية: فقد تفيد أن الشهادة السابقة تؤكد الكلمة النبوية، أو قد تشدد على كونها راسخة وموثوقة، من غير فرض مفاضلة عقائدية بينها وبين شهادة الرسل.'
- issue: هوية «كوكب الصبح»
  choice: إبقاء الصورة من غير تحديد صريح لهويتها في المتن
  alternative: تفسيره صراحة بأنه المسيح، أو بأنه الاستنارة الأخروية
  rationale: قد تحمل الصورة صدى مسيانيًا، لكن الآية لا تعرّف الرمز صراحة؛ لذلك يحفظ النص الصورة والتوتر التفسيري، مع الإشارة إلى الصلة المحتملة في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدمت «ينبلج النهار» للمحافظة على الصورة الشعرية من دون غموض، ووُضع مؤشر الحاشية [b] بعد تمام صورة كوكب الصبح لأن الحاشية تتعلق بها لا بعبارة «موضع مظلم».
