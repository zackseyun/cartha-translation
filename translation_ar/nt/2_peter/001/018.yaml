source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: ar
  text: وقد سمعنا نحن أنفسنا هذا الصوت الذي أُتِيَ به من السماء، حين كنا معه على الجبل المقدس[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محمولًا من السماء».'
    reason: بديل معجمي أقرب إلى الصورة الحرفية لاسم المفعول اليوناني ἐνεχθεῖσαν.
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: هذا الصوت
  rationale: تشير φωνή هنا إلى القول الإلهي المذكور في الآية السابقة، ولذلك فـ«الصوت» أدق من تعبير أعم مثل «دويّ».
- source_word: ἡμεῖς
  choice: نحن أنفسنا
  rationale: ورود الضمير صراحةً مع أن صيغة الفعل تدل على المتكلمين يفيد التوكيد، فتحفظ العبارة التشديد على شهادة المعاينة والسماع.
- source_word: ἠκούσαμεν
  choice: سمعنا
  rationale: الفعل الماضي يدل هنا على واقعة سماع الصوت السماوي، لا على الإصغاء المستمر.
- source_word: ἐξ οὐρανοῦ
  choice: من السماء
  rationale: تعبير عربي طبيعي يحفظ دلالة المصدر في العبارة اليونانية.
- source_word: ἐνεχθεῖσαν
  choice: آتيًا
  rationale: اسم المفعول من φέρω يصف انتقال الصوت من السماء. اختير «آتيًا» لوضوحها وطبيعتها في العربية، مع إثبات الصورة الحرفية الممكنة في الحاشية.
- source_word: σὺν αὐτῷ ὄντες
  choice: حين كنا معه
  rationale: تؤدي العبارة الحالية معنى زمنيًا في السياق، والضمير يعود إلى يسوع.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: على الجبل المقدس
  rationale: حرف «على» هو الأنسب عربيًا مع الوجود فوق الجبل، و«المقدس» يحفظ وصف الجبل دون تسميته.
theological_decisions:
- issue: المقصود بـ«الجبل المقدس»
  choice: إبقاء الوصف إشارةً إلى جبل تجلي يسوع من غير تعيين اسمه
  alternative: تعيينه بجبل طابور أو جبل حرمون
  rationale: النص اليوناني يصفه بأنه «الجبل المقدس» ولا يسميه، فلا تُضاف هوية جغرافية مستمدة من تقليد أو اجتهاد خارج النص.
- issue: كيفية تصوير وصول الصوت من السماء
  choice: «آتيًا من السماء» في المتن مع ذكر «محمولًا من السماء» في الحاشية
  alternative: صياغة العبارة على أنها مجرد صدور الصوت من السماء، أو اعتماد «محمولًا» وحدها في المتن
  rationale: يحافظ هذا على معنى انتقال الصوت في ἐνεχθεῖσαν بلغة عربية مفهومة، من غير حسم زائد لطبيعة هذا الانتقال أو إغفال الصورة اللفظية الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على توكيد «نحن أنفسنا»، وعلى وصف الجبل دون إدخال اسم تقليدي له، واستعملت «وقد» لربط الآية بما قبلها.
