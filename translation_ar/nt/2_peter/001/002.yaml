base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: ar
  text: لِتُضَاعَفْ لكم النعمة والسلام في معرفة الله ويسوع ربنا.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بمعرفة الله ويسوع ربنا» أو «بواسطة معرفة الله ويسوع ربنا». فقد يدل حرف الجر اليوناني على المجال («في») أو على الوسيلة («بـ/بواسطة»).'
    reason: alternative_reading
  - marker: b
    text: 'أو: «المعرفة التامة». فاللفظ اليوناني ἐπίγνωσις قد يفيد معرفة أوفر أو أكمل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: النعمة
  rationale: اللفظ المألوف في البركات الرسولية، ويحفظ معنى الإحسان الإلهي وما في العبارة من مضمون لاهوتي.
- source_word: εἰρήνη
  choice: السلام
  rationale: ترجمة مألوفة وغنية الدلالة، وتحفظ الصدى السامي المحتمل للفظ.
- source_word: πληθυνθείη
  choice: لِتَتَكَاثَرْ
  rationale: صيغة دعاء عربية طبيعية تنقل التمني الذي تؤديه صيغة الاختيار اليونانية المبنية للمجهول، وتحفظ معنى الازدياد الوافر.
- source_word: ἐν
  choice: في
  rationale: تحفظ الدلالة المباشرة وإمكان فهم حرف الجر على أنه يدل على المجال، من غير حسم احتمال دلالته على الوسيلة.
- source_word: ἐπιγνώσει
  choice: معرفة
  rationale: صياغة عربية طبيعية لا تفرض معنى اصطلاحيًا زائدًا، مع إثبات احتمال معنى المعرفة التامة أو الأعمق في الحاشية.
- source_word: θεοῦ
  choice: الله
  rationale: مضاف إليه متعلق بالمعرفة على نحو مباشر.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: النقل العربي المستقر للاسم الشخصي.
- source_word: κυρίου
  choice: ربنا
  rationale: يحفظ اللقب المسيحاني والاستعمال المألوف في العهد الجديد، مع اتصال ضمير المتكلمين به.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: الله ويسوع ربنا
  rationale: يبقي كلا الاسمين متعلقين بـ«معرفة»، وهو واضح طبيعيًا في التركيب العربي من غير تكرار حرف الإضافة.
theological_decisions:
- issue: دلالة ἐπίγνωσις في سياق روحي
  choice: معرفة
  alternative: معرفة تامة؛ معرفة كاملة؛ معرفة أعمق
  rationale: قد يحمل اللفظ معنى المعرفة الأوفر أو الأتم، لكن المتن يتجنب فرض هذا التقوية الدلالية، وتُحفظ في الحاشية.
- issue: دلالة ἐν مع ἐπιγνώσει
  choice: في معرفة الله ويسوع ربنا
  alternative: بمعرفة الله ويسوع ربنا؛ بواسطة معرفة الله ويسوع ربنا
  rationale: يحتمل اليوناني معنى المجال أو الوسيلة؛ لذلك يحفظ المتن الصياغة الأقرب ولا يحسم العلاقة اللاهوتية حسمًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة الدعاء «لِتَتَكَاثَرْ لكم» لنقل البركة الرسولية وصيغة التمني اليونانية، مع إبقاء الغموض الحقيقي في حرف الجر ودلالة «المعرفة» موثقًا في الحواشي.
