source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: ar
  text: 'سِمْعانُ بُطْرُسُ، عبدٌ ورسولٌ ليسوعَ المسيحِ، إلى الذين نالوا إيمانًا مساويًا لإيماننا في القيمة[a]، في برِّ إلهنا ومخلِّصنا يسوعَ المسيحِ[b][c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إيمانًا مساويًا لإيماننا في المنزلة»، أو «إيمانًا ثمينًا مثل إيماننا». يمكن للصفة اليونانية أن تدل على تساوي القيمة أو الكرامة أو الامتياز.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ببرِّ إلهنا ومخلِّصنا» أو «من خلال برِّ إلهنا ومخلِّصنا». قد يدل حرف الجر اليوناني على المجال أو الوسيلة.'
    reason: lexical_alternative
  - marker: c
    text: 'تفيد العبارة اليونانية على الأرجح: «إلهنا ومخلِّصنا، يسوع المسيح»، فتصف يسوع بأنه الإله والمخلِّص معًا. وهناك احتمال أضعف: «إلهنا والمخلِّص يسوع المسيح»، بالإشارة إلى شخصين.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: سِمْعَانُ بُطْرُسُ
  rationale: يعكس «سِمْعَان» صيغة Συμεών في النص اليوناني، و«بطرس» هو المقابل العربي الراسخ للاسم Πέτρος.
- source_word: δοῦλος
  choice: عبد
  rationale: يحفظ معنى الانتماء والخضوع الكاملين، وهو في العربية الكتابية الفصيحة طبيعي في تعريف الرسول بنفسه، ولا يخفف اللفظ إلى مجرد أداء خدمة.
- source_word: ἀπόστολος
  choice: رسول
  rationale: المقابل العربي الراسخ والدقيق للموفَد ذي التكليف الرسولي.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ينقل لقب Χριστός بمعناه، والصيغة العربية المعرّفة هي التعبير الطبيعي الراسخ.
- source_word: τοῖς ... λαχοῦσιν
  choice: إلى الذين نالوا
  rationale: يدل الفعل على نيل شيء مُعطى أو مُخصَّص، لا على تحصيله بالاستحقاق؛ و«نالوا» عربية طبيعية من غير إثقال بصورة القرعة.
- source_word: ἰσότιμον ... πίστιν
  choice: إيمانًا مساويًا لإيماننا في القيمة
  rationale: يحفظ معنى المساواة في القيمة أو المنزلة أو الامتياز، ويتجنب أن توحي «ثمين» بأن المقصود مجرد الشعور بعِظم القيمة.
- source_word: πίστιν
  choice: إيمانًا
  rationale: هو المقابل المباشر والطبيعي في السياق لإيمان المؤمنين المشترك.
- source_word: ἐν δικαιοσύνῃ
  choice: في برِّ
  rationale: يحافظ على حرف الجر ذي الدلالة المحتملة على المجال أو الوسيلة، ويترك هذا التوتر الدلالي مفتوحًا مع إيضاح البديل في الحاشية.
- source_word: δικαιοσύνῃ
  choice: برِّ
  rationale: «البر» هو المقابل العربي الكتابي الموجز والطبيعي لـ δικαιοσύνη هنا، وأليق بالسياق من «العدالة».
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: إلهنا ومخلِّصنا يسوع المسيح
  rationale: 'تعكس العبارة المرجع الواحد الذي ترجحه البنية اليونانية: يسوع المسيح موصوف بأنه إلهنا ومخلّصنا، مع حفظ الاحتمال الأضعف في الحاشية.'
theological_decisions:
- issue: هل تشير عبارة «إلهنا ومخلّصنا يسوع المسيح» إلى شخص واحد أم إلى شخصين؟
  choice: 'مرجع واحد: يسوع المسيح هو «إلهنا ومخلّصنا».'
  alternative: 'مرجعان: «إلهنا» و«المخلّص يسوع المسيح».'
  rationale: وجود أداة تعريف يونانية واحدة تحكم اسمين شخصيين مفردين موصولين بـ καί يرجّح بقوة وحدة المرجع. ولأهمية المسألة لاهوتيًا، ذُكر الاحتمال الآخر الأضعف في الحاشية بدل إغفاله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «عبد» لقوة δοῦλος، و«المسيح» بوصفه اللقب العربي الراسخ، وصيغت العبارة الختامية بحيث تحافظ على القراءة النحوية الأرجح من غير طمس البديل المختلف عليه.
