  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: ar
  text: وأنتم تنتظرون مجيء يوم الله وتُسرِّعون مجيئه[a]؛ فبسببه ستنحلّ السماوات إذ تُضرَم فيها النار، وتذوب العناصر وهي تحترق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأنتم تترقبون بشوق مجيء يوم الله». يمكن أن يعني الفعل اليوناني «تُسرِّعون» أو «تترقبون بشوق».'
    reason: alternative_reading
  - marker: b
    text: قد تشير «العناصر» إلى المكوّنات الأساسية للعالم، أو ربما إلى الأجرام السماوية.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: تنتظرون
  rationale: ينقل معنى الترقب الواثق المستمر، ويرتبط طبيعيًا بالسياق الإرشادي في الآية السابقة.
- source_word: σπεύδοντας
  choice: تُسرِّعون مجيئه
  rationale: يحافظ على المعنى السببي المباشر الممكن للفعل مع مفعوله «المجيء»، مع إثبات معنى «تترقبون بشوق» في الحاشية لصون الغموض اليوناني.
- source_word: παρουσίαν
  choice: مجيء
  rationale: هو التعبير العربي الواضح والمألوف في السياق الأخروي، ويؤدي معنى الحضور أو الوصول المقصود هنا.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: يوم الله
  rationale: يحافظ على العبارة اليونانية غير المعتادة ويميّزها من التعبير الأشهر «يوم الرب».
- source_word: δι’ ἣν
  choice: فبسببه
  rationale: διά مع النصب تفيد السببية على الأرجح هنا، والضمير يعود إلى يوم الله.
- source_word: οὐρανοὶ
  choice: السماوات
  rationale: يحافظ على صيغة الجمع وعلى الدلالة الكونية في السياق.
- source_word: πυρούμενοι
  choice: وهي تشتعل
  rationale: صياغة عربية طبيعية تصف تعرض السماوات للنار، من غير تثقيل العبارة ببناء مجهول حرفي.
- source_word: λυθήσονται
  choice: تنحلّ
  rationale: يفيد التفكك والانحلال، ولا يفرض مفهوم الإبادة التامة.
- source_word: στοιχεῖα
  choice: العناصر
  rationale: مقابل واسع يحفظ احتمال مكوّنات العالم أو الأجرام السماوية دون حسم تفسيري.
- source_word: καυσούμενα
  choice: وهي تحترق
  rationale: ينقل أثر النار والحرارة بعبارة عربية موجزة وطبيعية.
- source_word: τήκεται
  choice: تذوب
  rationale: ينقل المعنى المباشر للذوبان بفعل الحرارة؛ وصيغته الحاضرة ذات قيمة تصويرية حية وسط الأفعال المستقبلة.
theological_decisions:
- issue: معنى σπεύδοντας τὴν παρουσίαν
  choice: تُسرِّعون مجيئه
  alternative: تترقبون مجيء يوم الله بشوق
  rationale: يجيز اليوناني معنى التعجيل ومعنى الترقب المتلهف. أُبقي المعنى السببي المباشر في المتن، ووُضع البديل الأقل دلالة على السببية في الحاشية حفاظًا على التوتر الدلالي واللاهوتي.
- issue: مدلول στοιχεῖα
  choice: العناصر
  alternative: الأجرام السماوية
  rationale: المرجع محل نقاش في هذا السياق الأخروي؛ لذلك يحفظ اللفظ العام الغموض ولا يفرض تصورًا كونيًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت جمل فعلية طبيعية، مع الحفاظ على جمع «السماوات» وعلى العبارة المميزة «يوم الله». جميع علامات الحواشي مثبتة في المتن.
