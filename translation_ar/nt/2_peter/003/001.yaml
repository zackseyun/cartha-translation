  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: ar
  text: أيها الأحباء، هذه هي الرسالة الثانية التي أكتبها إليكم الآن؛ وفي كلتا الرسالتين[a] أوقظ ذهنكم النقي بالتذكير[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فيهما»؛ اللفظ اليوناني بصيغة الجمع، وأقرب ما يعود إليه هو الرسالتان.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «ذهنكم الصادق» أو «الصافي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: نداء جمع يحمل المودة ويحافظ على الوزن الرسائلي واللاهوتي من غير أن يصبح عاميًا.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: أكتب إليكم الآن هذه الرسالة الثانية
  rationale: أُعيد ترتيب الكلمات بما يلائم العربية، مع إبقاء دلالة ἤδη على «الآن» وتحديد الرسالة الحالية بأنها الثانية.
- source_word: γράφω
  choice: أكتب
  rationale: المضارع العربي الطبيعي يؤدي معنى الفعل الحاضر في سياق كتابة الرسالة.
- source_word: ἐν αἷς
  choice: وفي كلتيهما
  rationale: ضمير الموصول اليوناني مؤنث جمع، وأقرب مرجع له الرسالتان؛ و«كلتيهما» توضح المثنى الذي تعبّر عنه اليونانية بصيغة الجمع.
- source_word: διεγείρω
  choice: أوقظ
  rationale: يحفظ صورة الإيقاظ أو الاستنهاض الكامنة في الفعل، وهو واضح وطبيعي مع «الذهن».
- source_word: ἐν ὑπομνήσει
  choice: بالتذكير
  rationale: صياغة عربية موجزة تعبّر عن وسيلة الإيقاظ أو طريقته.
- source_word: εἰλικρινῆ διάνοιαν
  choice: ذهنكم الصادق
  rationale: «الذهن» ينقل معنى διάνοια بوصفه ملكة الفهم والتفكير، و«الصادق» يحفظ دلالة الإخلاص والنزاهة في εἰλικρινής مع إبقاء احتمال معنى النقاء في الحاشية.
- source_word: ὑμῶν
  choice: ـكم
  rationale: ضمير الملكية المتصل هو المقابل العربي الطبيعي للمضاف إليه اليوناني.
theological_decisions:
- issue: مرجع ضمير الموصول الجمع ἐν αἷς
  choice: يشير إلى الرسالتين اللتين كتبهما بطرس إلى المخاطَبين.
  alternative: أن يشير إلى الرسالة الحالية وحدها باستعمال جمع غير محكم أو رسائلي.
  rationale: القراءة النحوية الأوضح تجعل صيغة الجمع عائدة إلى الرسالتين؛ لذلك تُرجمت «وفي كلتيهما» من غير بناء استنتاج عقائدي أوسع على ذلك.
- issue: دلالة εἰλικρινής
  choice: الصادق
  alternative: النقي أو الصافي
  rationale: اللفظة تحتمل النزاهة والإخلاص كما تحتمل النقاء؛ اختير «الصادق» في المتن لسلامة التركيب العربي، مع إثبات البديل الدلالي في الحاشية حفاظًا على سعة المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «أوقظ» للمحافظة على الصورة المجازية في الأصل، و«كلتيهما» لإظهار أن المقصود رسالتان مع بيان الصياغة الحرفية في الحاشية.
