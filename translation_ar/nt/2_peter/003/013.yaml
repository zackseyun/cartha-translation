  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: ar
  text: ولكننا، بحسب وعده، ننتظر سماوات جديدة وأرضًا جديدة، حيث يسكن البرّ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: سماوات جديدة وأرضًا جديدة
  rationale: يحافظ هذا التعبير على الصورة الكونية الكتابية وصدى إشعياء 65:17 و66:22، من غير أن يفسّر καινός تفسيرًا زائدًا بمعنى «مجدَّدة».
- source_word: δὲ
  choice: ولكننا
  rationale: تفيد الأداة مقابلة خفيفة مع زوال السماوات والأرض الحاضرتين في السياق السابق، وتؤدي «لكن» هذا المعنى طبيعيًا، مع إلحاق ضمير المتكلمين بها لاتساق العربية.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: بحسب وعده
  rationale: تفيد κατά مع النصب المطابقة أو الاستناد إلى شيء، وἐπάγγελμα تعني «وعدًا»؛ لذا فالصياغة موجزة وأمينة.
- source_word: προσδοκῶμεν
  choice: ننتظر
  rationale: ينقل المضارع اليوناني انتظارًا وتطلعًا مستمرين إلى المستقبل، والفعل العربي واضح وطبيعي في هذا السياق.
- source_word: ἐν οἷς
  choice: فيها
  rationale: الضمير اليوناني جمع، لكنه يعود إلى السماوات الجديدة والأرض الجديدة بوصفها مجموعًا؛ والضمير العربي «ها» يعود طبيعيًا إلى أقرب مذكور، «أرضًا»، مع شمول المشهد كله بحسب السياق.
- source_word: δικαιοσύνη
  choice: البرّ
  rationale: «البرّ» هو المقابل الكتابي العربي الأوسع، ويشمل الاستقامة وما هو حق أمام الله، مع حفظ معنى «العدل» البديل في الحاشية.
- source_word: κατοικεῖ
  choice: يسكن
  rationale: ينقل معنى الإقامة المستقرة في κατοικέω، ويحافظ على التشخيص البلاغي الموجود في الأصل.
theological_decisions:
- issue: دلالة δικαιοσύνη في سياق الخليقة الآتية
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» يحفظ الاتساع الأخلاقي واللاهوتي للمصطلح، فلا يقصره على الإنصاف الاجتماعي أو القضائي، بينما تبقى دلالة «العدل» احتمالًا معجميًا حقيقيًا تُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة من غير تكلّف. حُفظت العبارة الكونية «سماوات جديدة وأرض جديدة»، كما حُفظ التشخيص في «يسكن فيها البرّ».
