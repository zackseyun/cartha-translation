  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: ar
  text: أن تتذكّروا الكلمات التي سبق أن قالها الأنبياء القدّيسون[b]، ووصية رسلكم الصادرة عن الرب والمخلّص[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ووصية الرب والمخلّص التي نقلها إليكم رسلكم». تحتمل علاقات الإضافة في اليونانية أكثر من صياغة عربية طبيعية.'
    reason: alternative_reading
  - marker: b
