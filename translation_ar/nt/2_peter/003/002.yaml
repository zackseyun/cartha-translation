lexical_decisions:
- source_word: μνησθῆναι
  choice: أن تتذكّروا
  rationale: صيغة عربية طبيعية للمصدر اليوناني، وتحافظ على معنى استحضار ما سبق قوله دون تضييقه إلى مجرد التنبّه.
- source_word: προειρημένων ῥημάτων
  choice: الكلمات التي سبق أن قالها
  rationale: تنقل معنى القول السابق زمنيًا، من غير أن تجعل العبارة بالضرورة نبوءة تنبؤية؛ و«الكلمات» مقابل واضح وشائع لـ ῥήματα.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: التي سبق أن قالها الأنبياء القدّيسون
  rationale: يحافظ على كون الأنبياء هم القائلين وعلى وصفهم بالقداسة، بصياغة عربية واضحة.
- source_word: ἐντολῆς
  choice: وصية
  rationale: تحافظ على المفرد وعلى سلطة الأمر، وهي لفظة عربية كتابية مفهومة وأرفع من «تعليم» العامّة الدلالة.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: رسلكم
  rationale: يربط ضمير المخاطبين بالرسل وفق ترتيب اليونانية، بمعنى الرسل المرتبطين بالمخاطَبين أو المرسلين إليهم، لا بمعنى الملكية الحرفية.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: الصادرة عن الرب والمخلّص
  rationale: يبين أن مصدر الوصية هو الرب والمخلّص، مع إبقاء نقلها بواسطة الرسل مفهومًا من السياق، ومن دون إضافة ضمير غير موجود في اليونانية.
theological_decisions:
- issue: علاقة ὑμῶν بعبارة τῶν ἀποστόλων
  choice: «رسلكم»؛ أي الرسل المرتبطون بالمخاطَبين أو المرسلون إليهم
  alternative: «الوصية التي أعطاها لكم الرسل»
  rationale: ترتيب الكلمات يربط الضمير بالرسل على نحو طبيعي، من غير أن يقتضي معنى الملكية الحديثة.
- issue: تعلّق τοῦ κυρίου καὶ σωτῆρος
  choice: الوصية صادرة عن الرب والمخلّص وقد نقلها الرسل
  alternative: «وصية الرب والمخلّص على أيدي رسلكم»؛ أو تعلّق العبارة بالرسل بوصفهم رسل الرب والمخلّص
  rationale: تعلّق الإضافة بـ«الوصية» هو الأشد تماسكًا، لكن تراكم المضاف إليه في اليونانية يتيح أكثر من تمثيل عربي طبيعي، لذلك ذُكر البديل في الحاشية بدل طمس الاحتمال النحوي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات وقار. استُخدمت «وصية» للمحافظة على سلطة المفرد اليوناني، و«القدّيسون» كوصف طبيعي للأنبياء. وُضعت علامتا الحاشيتين في المتن عند موضعي البديلين.
