id: 2PE.3.4
reference: 2 Peter 3:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: ar
  text: 'ويقولون: «أين وعد مجيئه[a]؟ فمنذ أن رقد الآباء[b]، ما زال كل شيء على حاله منذ بدء الخليقة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة اللفظ اليوناني (παρουσία) بـ«حضوره» أو «وصوله». وهو يشير هنا إلى مجيء المسيح المنتظر في المستقبل.
    reason: lexical_alternative
  - marker: b
    text: «رقد» كناية يونانية عن الموت.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: ويقولون
  rationale: صيغة اسم الفاعل اليونانية مرتبطة بوصف المستهزئين في السياق السابق. صيغت بفعل مضارع مع الواو لأن ذلك أوضح وأطبع في العربية مع الحفاظ على الاستمرار والارتباط.
- source_word: ἐπαγγελία
  choice: وعد
  rationale: ينقل اللفظ اليوناني مباشرة بوصفه الوعد المتعلق بمجيئه، من غير تحويله إلى «إتمام الوعد» أو تفسيره تفسيرًا زائدًا.
- source_word: παρουσίας
  choice: مجيئه
  rationale: في هذا السياق الأخروي يدل اللفظ على المجيء أو الوصول المنتظر. «مجيئه» هو التعبير العربي الطبيعي، مع إثبات البدائل المعجمية في الحاشية.
- source_word: ἀφ’ ἧς
  choice: منذ أن
  rationale: تركيب زمني يحدد نقطة ماضية استمر منها الوضع المزعوم حتى الحاضر.
- source_word: οἱ πατέρες
  choice: الآباء
  rationale: يحافظ على أداة التعريف ولا يضيف ضمير ملكية غير موجود في اليونانية. وقد يُراد به الآباء أو الأجيال السابقة.
- source_word: ἐκοιμήθησαν
  choice: رقد
  rationale: يحافظ على الكناية اليونانية عن الموت بدل استبدالها مباشرة بلفظ «مات».
- source_word: πάντα
  choice: كل شيء
  rationale: ينقل الشمول الذي يفيده جمع المحايد اليوناني بصياغة عربية طبيعية.
- source_word: οὕτως διαμένει
  choice: ما زال ... على حاله
  rationale: يعبّر طبيعيًا عن استمرار الأشياء في الحالة نفسها، وهو لب حجة المستهزئين.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: منذ بدء الخليقة
  rationale: صياغة موجزة وواضحة تحافظ على الدلالة الزمنية وعلى نسبة البدء إلى الخليقة.
theological_decisions:
- issue: دلالة παρουσία في السياق الأخروي
  choice: مجيئه
  alternative: حضوره أو وصوله
  rationale: السياق يتناول استهزاءهم بالوعد المتعلق بعودة المسيح المنتظرة. «مجيئه» يوصل هذه الدلالة من غير أن يلغي المجال المعجمي للفظ، ولذلك ذُكرت البدائل في الحاشية.
- issue: الكناية عن الموت في ἐκοιμήθησαν
  choice: رقد
  alternative: مات
  rationale: يحافظ «رقد» على الصورة المجازية في النص اليوناني، من غير بناء تقرير عقائدي إضافي على هذه الكناية.
- issue: هوية «الآباء»
  choice: الآباء
  alternative: الأجداد أو أسلافنا
  rationale: لم يضف النص اليوناني ضمير ملكية، لذلك تُرك التعبير معرفًا من غير «نا»، حفاظًا على قدر من الانفتاح بشأن الجيل المقصود.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «ويقولون» بدل تركيب اسمي ثقيل، وحُفظت كناية الرقاد وصيغة «الآباء» بلا ضمير ملكية. وُضعت علامة الحاشية [a] عند «مجيئه» لأنها تشرح παρουσία، وعلامة [b] عند «رقد الآباء».
