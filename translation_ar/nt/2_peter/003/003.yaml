- source_word: ἐλεύσονται
  choice: سيأتي
  rationale: ينقل المستقبل من فعل المجيء نقلًا مباشرًا وطبيعيًا.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
