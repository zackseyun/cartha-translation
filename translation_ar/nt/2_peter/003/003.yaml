- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: مستهزئون باستهزاء
  rationale: يحفظ التوكيد الناتج من استعمال لفظين يونانيين من أصل واحد، وإن كان التكرار مقصودًا وغير مألوف قليلًا.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: بحسب شهواتهم الخاصة
  rationale: «شهوات» تنقل الرغبات القوية ذات السياق الأخلاقي السلبي، مع إبقاء معناها أوسع من الرغبة الجنسية وحدها؛ و«الخاصة» تحفظ توكيد ἰδίας.
- source_word: πορευόμενοι
  choice: سالكين
  rationale: يحفظ استعارة السلوك بوصفه نهجًا في الحياة، وهي مفهومة في العربية الكتابية المعاصرة.
theological_decisions:
- issue: مدلول ἐπ’ ἐσχάτων τῶν ἡμερῶν الأخروي
  choice: في الأيام الأخيرة
  alternative: في أواخر الأيام
  rationale: يحفظ التعبير الأخروي العام ووظيفة التحذير، من غير تحديد جدول زمني أو تبنّي إطار طائفي لأحداث النهاية.
- issue: نطاق معنى ἐπιθυμίαι
  choice: شهواتهم
  alternative: رغباتهم
  rationale: السياق يحمل تقويمًا أخلاقيًا سلبيًا، لكن الحاشية توضّح أن اللفظ لا يقتصر على الشهوة الجنسية، وبذلك لا يُضيَّق معناه لاهوتيًا أو أخلاقيًا بلا مسوغ.
