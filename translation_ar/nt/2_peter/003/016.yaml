  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: ar
  text: كما يتكلم أيضًا في جميع رسائله عن هذه الأمور. وفيها بعض الأمور العسيرة الفهم، يحرّفها غير المتعلّمين وغير الراسخين، كما يحرّفون سائر الأسفار المقدسة[a]، لِهلاكهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأسفار المقدسة الأخرى». يمكن أن تعني الكلمة اليونانية «سائر» أو «الأخرى»، لكن «سائر الأسفار المقدسة» أنسب للمقارنة هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: رسائله
  rationale: «رسائل» هو اللفظ العربي الحديث الطبيعي للمكاتبات، ويحفظ المعنى من غير استعمال «رسائل رسولية» أو تعبير اصطلاحي زائد.
- source_word: λαλῶν
  choice: يتكلم
  rationale: يحفظ الدلالة المباشرة للفعل اليوناني، مع وضوح أن الكلام واقع من خلال الرسائل.
- source_word: περὶ τούτων
  choice: عن هذه الأمور
  rationale: صياغة طبيعية تحافظ على الإشارة إلى الموضوعات المذكورة في السياق السابق.
- source_word: δυσνόητά τινα
  choice: بعض الأمور العسيرة الفهم
  rationale: ينقل كلاً من التنكير في τινα ومعنى صعوبة الفهم، بلغة عربية واضحة ورصينة.
- source_word: ἀμαθεῖς
  choice: غير المتعلّمين
  rationale: يعكس معنى الافتقار إلى التعليم أو المعرفة، ويتجنب أن يوحي اللفظ بأن المقصود مجرد الأمية.
- source_word: ἀστήρικτοι
  choice: غير الراسخين
  rationale: ينقل معنى عدم الثبات أو عدم الترسخ، وهو أنسب في هذا السياق الفكري والروحي.
- source_word: στρεβλοῦσιν
  choice: يحرّفها
  rationale: ينقل صورة ليّ الكلام وإخراجه عن وجهه، وهو تعبير عربي طبيعي؛ و«يلوون معناها» بديل أكثر تصويرًا.
- source_word: τὰς λοιπὰς γραφὰς
  choice: سائر الأسفار المقدسة
  rationale: «الأسفار المقدسة» ينقل الاستعمال العهدي لـ γραφαί بوصفها كتابات مقدسة، و«سائر» يحفظ معنى λοιπάς الذي يضع الرسائل في مقارنة مع بقية هذه الأسفار.
- source_word: ἀπώλειαν
  choice: الهلاك
  rationale: لفظ عربي واضح يحفظ جسامة النتيجة من غير تحديد زائد لطبيعتها اللاهوتية.
theological_decisions:
- issue: دلالة τὰς λοιπὰς γραφὰς على منزلة رسائل بولس
  choice: سائر الأسفار المقدسة
  alternative: الأسفار المقدسة الأخرى
  rationale: يحفظ هذا التعبير الدلالة الطبيعية بأن رسائل بولس تقارَن ببقية الكتابات المقدسة، من غير إضافة تقرير عقائدي يتجاوز صياغة النص.
- issue: طبيعة ἀπώλεια
  choice: الهلاك
  alternative: الدمار
  rationale: أُبقي اللفظ عامًا كما في اليونانية، فلا يُحسم هنا وحده هل المقصود دينونة أخروية حصراً أم خراب أوسع، مع الحفاظ على خطورة العاقبة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «رسائل» بدل تعبير تراثي أثقل، و«غير المتعلّمين وغير الراسخين» للمحافظة على التمييز بين الصفتين. وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرح بديلها.
