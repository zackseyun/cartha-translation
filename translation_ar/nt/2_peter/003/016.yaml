  to: كما يتكلم أيضًا في جميع رسائله عن هذه الأمور. وفيها بعض الأمور العسيرة الفهم، يحرّفها غير المتعلّمين وغير الراسخين، كما يحرّفون سائر الأسفار المقدسة[a]، لِهلاكهم.
