source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: ar
  text: لذلك، أيها الأحباء، ما دمتم تنتظرون هذه الأمور، فابذلوا كل جهد لكي يجدكم هو[a] بلا دنس ولا عيب وفي سلام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي تُوجَدوا أمامه بلا دنس ولا عيب». يمكن أن تدل صيغة الداتيف في اليونانية على الفاعل («يجدكم هو») أو على المرجع والحضور («أمامه»).'
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: لذلك
  rationale: أداة استنتاج تربط الوصية بما سبق من الحديث عن يوم الرب والسماوات الجديدة والأرض الجديدة.
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: تحافظ على نبرة الخطاب الودّي والوقور في الرسالة من غير إضافة مرجع للمحبة غير مذكور صراحة.
- source_word: ταῦτα προσδοκῶντες
  choice: ما دمتم تنتظرون هذه الأمور
  rationale: تنقل الاستمرار في الانتظار، وتُظهر الصلة الظرفية السببية بين الانتظار والوصية، مع إبقاء مرجع «هذه الأمور» عامًا كما في اليونانية.
- source_word: σπουδάσατε
  choice: فابذلوا كل جهد
  rationale: تعبير عربي معاصر واضح ينقل معنى الجد والاجتهاد المقصود في صيغة الأمر.
- source_word: ἄσπιλοι
  choice: بلا دنس
  rationale: يحافظ على صورة النقاوة الأخلاقية وعدم التلطخ.
- source_word: ἀμώμητοι
  choice: ولا عيب
  rationale: ينقل معنى انتفاء ما يوجب اللوم، مع إبقاء التوازي والتداخل الدلالي مع «بلا دنس».
- source_word: αὐτῷ εὑρεθῆναι
  choice: لكي يجدكم هو
  rationale: صياغة عربية طبيعية تنقل القراءة التي تفهم ضمير المجرور اليوناني دالًا على فاعل العثور، مع إبقاء هوية المرجع الضميري غير مصرّح بها كما في النص.
- source_word: ἐν εἰρήνῃ
  choice: وفي سلام
  rationale: تحافظ على إجمال العبارة، فلا تحصر السلام في الطمأنينة الداخلية أو المصالحة مع الله أو السلام الجماعي.
theological_decisions:
- issue: دلالة αὐτῷ مع εὑρεθῆναι وهوية مرجع الضمير
  choice: لكي يجدكم هو
  alternative: لكي تُوجَدوا أمامه
  rationale: يمكن فهم حالة المجرور في اليونانية على أنها تدل على الفاعل، أو على المرجع والحضور. اختيرت دلالة الفاعل في المتن، ووُضعت القراءة الأخرى في الحاشية. ولم يُستبدل الضمير باسم «الله» أو «الرب» لأن الآية نفسها لا تصرّح به.
- issue: مدلول السلام في ἐν εἰρήνῃ
  choice: وفي سلام
  alternative: وأنتم في سلام معه
  rationale: النص اليوناني لا يحدد صراحة أن السلام «معه»، ولذلك أُبقيت العبارة مفتوحة لدلالاتها السياقية الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ما دمتم» لبيان الصلة بين الانتظار والوصية بصورة طبيعية، و«ابذلوا كل جهد» لإبراز قوة الأمر. بقيت عبارة «في سلام» غير مقيّدة حفاظًا على سعة الأصل.
