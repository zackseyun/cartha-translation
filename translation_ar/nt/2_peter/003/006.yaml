lexical_decisions:
- source_word: δι’ ὧν
  choice: وبهما
  rationale: تفيد διά مع المجرور الوسيلة، والضمير الموصول في اليونانية جمع. تحافظ صيغة التثنية العربية على الإحالة المفتوحة إلى العنصرين المذكورين في الآية السابقة من غير تعيين زائد.
- source_word: ὁ τότε κόσμος
  choice: عالم ذلك الزمان
  rationale: ينقل التعبير العالم كما كان قائمًا آنذاك، ويحفظ المقابلة الزمنية مع العالم الحاضر في السياق.
- source_word: ὕδατι
  choice: الماء
  rationale: يدل الاسم في حالة الداتيف على الوسيلة التي حدث بها الغمر، وقد نُقل طبيعيًا في تركيب «غمره الماء».
- source_word: κατακλυσθεὶς
  choice: إذ غمره
  rationale: ينقل اسم الفاعل الماضي المبني للمجهول معنى اجتياح الماء للعالم، مع بيان علاقته الظرفية بالفعل الرئيس بلغة عربية طبيعية.
- source_word: ἀπώλετο
  choice: هلك
  rationale: يحفظ المعنى اللازم للفعل، أي وقوع العالم السابق تحت الهلاك، من غير أن يفرض معنى الإبادة المطلقة.
theological_decisions:
- issue: طبيعة دينونة الطوفان
  choice: هلك
  alternative: دُمِّر
  rationale: يفيد الفعل اليوناني الهلاك أو الدمار، لكنه لا يوجب تقرير الإبادة المطلقة؛ لذلك تحافظ «هلك» على شدة الدينونة من غير تجاوز دلالة النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «وبهما» لإبراز تعدد مرجع الضمير اليوناني، و«إذ غمره الماء» لصياغة العلاقة بين اسم الفاعل والفعل الرئيس بصورة طبيعية.
