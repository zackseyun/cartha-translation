id: 2PE.3.5
reference: 2 Peter 3:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: ar
  text: 'لِأَنَّهُمْ يتغافلون عمدًا عن هذه الحقيقة: أن السماوات كانت موجودة منذ القِدَم، وأن الأرض تكوَّنت من الماء وبالماء بكلمة الله[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأمر الله». والنص حرفيًا: «بكلمة الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: لِأَنَّهُمْ يتغافلون عمدًا عن هذه الحقيقة
  rationale: يجمع «يتغافلون عمدًا» بين عدم الالتفات وبين العنصر الإرادي في العبارة اليونانية، بصياغة عربية طبيعية واضحة.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: السماوات كانت موجودة منذ القِدَم
  rationale: يحفظ جمع «السماوات» والدلالة الزمنية لـἔκπαλαι، مع التصريح بالوجود الذي يدل عليه الفعل ἦσαν.
- source_word: γῆ ... συνεστῶσα
  choice: الأرض تكوَّنت
  rationale: «تكوَّنت» تنقل معنى قيام الأرض وتشكّلها في سياق الخلق، من غير تحميل اسم γῆ غير المعرّف في اليونانية نكرة غير طبيعية في العربية.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: من الماء وبالماء
  rationale: يحافظ اختلاف حرفي الجر على التمييز بين المصدر أو المنشأ في ἐξ والواسطة في διά، وهو أوضح عربيًا من تكرار «من خلال».
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: بكلمة الله
  rationale: ينقل الداتيف الأداتي، ويحفظ لفظ λόγος بوصفه «كلمة» من غير حصره في معنى الأمر ولا جعله صراحة لقبًا شخصيًا.
theological_decisions:
- issue: هل تشير كلمة λόγος هنا صراحةً إلى «الكلمة» بوصفه لقبًا شخصيًا؟
  choice: بكلمة الله
  alternative: بأمر الله
  rationale: السياق يتحدث عن فاعلية قول الله في الخلق، لكنه لا يصرّح هنا باستعمال λόγος لقبًا أقنوميًا. لذلك تحفظ الصياغة اللفظ والتوتر الدلالي دون إضافة تحديد لاهوتي.
- issue: دلالة خلو γῆ من أداة التعريف
  choice: الأرض
  alternative: أرض
  rationale: العربية تحتاج هنا إلى التعريف للإحالة الطبيعية إلى العالم المخلوق المقصود، ولا يقتضي غياب الأداة في اليونانية إدخال معنى «أرضٍ ما».
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «يتغافلون عمدًا» لإبراز اجتماع الجهل الظاهري بالإرادة، و«من الماء وبالماء» للمحافظة على اختلاف حرفي الجر في الأصل.
