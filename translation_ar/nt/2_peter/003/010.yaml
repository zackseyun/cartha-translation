  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: ar
  text: لكن يوم الرب سيأتي كاللص، وفيه تزول السماوات بهدير، وتنحلّ العناصر[a] إذ تُحرَق، وتُوجَد الأرض والأعمال التي فيها[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأجرام السماوية» بدل «العناصر»؛ فقد يدل اللفظ اليوناني (στοιχεῖα) في هذا السياق على مكوّنات الكون على نحو أخص.
    reason: lexical_alternative
  - marker: b
    text: يفهم بعضهم «تُوجَد» بمعنى «تنكشف» أو «تُعرّى».
    reason: alternative_reading
  - marker: c
    text: تقرأ مخطوطات كثيرة «ستُحرق» بدل «تُوجَد».
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: سيأتي
  rationale: ينقل صيغة المستقبل ومعنى المجيء نقلًا طبيعيًا في سياق مجيء يوم الرب.
- source_word: ἡμέρα κυρίου
  choice: يوم الرب
  rationale: يحافظ على التعبير الأخروي المألوف في الأسفار النبوية والرسولية، ولا يوحي بيوم عبادة أسبوعي.
- source_word: κλέπτης
  choice: لص
  rationale: يحفظ صورة المجيء المباغت وغير المتوقع من غير تضييقها إلى نوع مخصوص من السرقة.
- source_word: ἐν ᾗ
  choice: وفيه
  rationale: يربط الأحداث الكونية باليوم المذكور ربطًا موجزًا وطبيعيًا في العربية.
- source_word: οἱ οὐρανοὶ
  choice: السماوات
  rationale: يحفظ صيغة الجمع والسياق الكوني للنص.
- source_word: ῥοιζηδόν
  choice: بهدير
  rationale: يعبّر بوضوح عن الصوت المندفع أو المدوّي الذي تدل عليه الحال اليونانية.
- source_word: παρελεύσονται
  choice: تزول
  rationale: ينقل معنى الانقضاء أو الزوال في السياق الأخروي بصياغة عربية طبيعية.
- source_word: στοιχεῖα
  choice: العناصر
  rationale: اختيار واسع ومحايد نسبيًا يحفظ احتمال مكوّنات الكون من غير الجزم بأنها الأجرام السماوية.
- source_word: καυσούμενα
  choice: وهي تحترق
  rationale: يحفظ معنى العملية المصاحبة للانحلال من غير تعيين فاعل الإحراق.
- source_word: λυθήσεται
  choice: تنحلّ
  rationale: ينقل صورة التفكك والانحلال بدقة أكبر من لفظ عام مثل الهلاك.
- source_word: γῆ
  choice: الأرض
  rationale: السياق الكوني يرجّح الأرض كلها لا بقعة محلية أو أرضًا إقليمية.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: الأعمال التي فيها
  rationale: يحافظ على عموم اللفظ، بحيث يظل محتملًا أن يشير إلى الأعمال أو المصنوعات القائمة في الأرض.
- source_word: εὑρεθήσεται
  choice: تُوجَد
  rationale: يحفظ القراءة الصعبة المباشرة للنص اليوناني المعطى، بدل حلّها تفسيريًا في المتن.
theological_decisions:
- issue: معنى العبارة الختامية καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: الإبقاء على «تُوجَد الأرض والأعمال التي فيها» في المتن
  alternative: «تنكشف/تُعرّى الأرض والأعمال التي فيها» أو «تُحرق الأرض والأعمال التي فيها»
  rationale: الفعل في النص المعطى هو εὑρεθήσεται، ومعناه المباشر «تُوجَد». ولأن العبارة موضع خلاف نصي وتفسيري، تُحفظ القراءة الأصعب في المتن وتُذكر البدائل في الحواشي من غير فرض تسوية لاهوتية.
- issue: مرجع στοιχεῖα
  choice: العناصر
  alternative: الأجرام السماوية أو المكوّنات الأساسية للكون
  rationale: اللفظ قد يدل في هذا السياق على مكوّنات الكون أو على الأجرام السماوية؛ لذلك يحافظ المتن على التعبير الأوسع ولا يحسم الصورة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إبقاء الصورة الأخروية والعبارة الختامية الصعبة من غير تبسيط تفسيري. وُضعت علامات الحواشي عند الألفاظ التي تخصها، مع ترتيبها بحسب ظهورها في المتن.
