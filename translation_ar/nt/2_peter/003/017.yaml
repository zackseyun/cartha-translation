  source_fidelity: المسودة تنقل بنية التحذير ومعنى السقوط من الثبات نقلًا جيدًا، لكنها تجعل ἀθέσμων «الخارجين عن الشريعة»، وهو تعبير يوحي بالإخراج من الشريعة أو بالانتماء إليها على نحو لا يقتضيه الأصل. كما أن «ما دمتم تعرفون» أقوى سببيةً واستمراريةً من اسم الفاعل اليوناني الذي يشير إلى معرفة سابقة.
