  terminology: «الأحباء»، «احترسوا»، «ضلال»، و«ثباتكم» مناسبة للسجل الرسائلي. تُحفظ دلالة ἀθέσμων، أي عدم مراعاة الناموس/المعيار المشروع، دون تحويلها إلى توصيف طائفي أو افتراض أنهم كانوا داخل الشريعة ثم خرجوا منها.
