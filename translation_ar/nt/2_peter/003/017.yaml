  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: ar
  text: فأنتم إذًا، أيها الأحباء، إذ تعرفون هذا مسبقًا، احترسوا لئلا تنجرفوا مع ضلال الذين لا يراعون الشريعة، فتسقطوا[a] عن ثباتكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة العبارة بـ«فتفقدوا ثباتكم»، لكن المتن يُبقي صورة السقوط ولا يجعل التحذير أكثر تحديدًا مما تقتضيه اليونانية.
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «ثباتكم» بـ«رسوخكم». فاللفظة اليونانية στηριγμός تدل على الثبات أو الرسوخ أو الاستقرار.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: فأنتم إذًا
  rationale: يحفظ الانتقال الاستنتاجي الذي تفيده οὖν، ويُبقي ضمير المخاطبين الصريح للتوكيد.
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: نداء حميم ذو نبرة رعوية ورسائلية، وهو عربي فصيح واضح من غير زيادة تفسيرية.
- source_word: προγινώσκοντες
  choice: ما دمتم تعرفون هذا مسبقًا
  rationale: ينقل معنى المعرفة السابقة، ويبيّن صلة الحال بالأمر اللاحق في صياغة عربية طبيعية؛ واسم الإشارة مفهوم من السياق.
- source_word: φυλάσσεσθε
  choice: فاحترسوا
  rationale: يؤدي قوة الأمر المستمر باليقظة وحفظ النفس، من غير تركيب ثقيل.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: بضلال الخارجين عن الشريعة
  rationale: «ضلال» ينقل πλάνη بوصفه خطأً وانحرافًا، و«الخارجون عن الشريعة» يبرز استخفاف ἀθέσμος بالضابط الأخلاقي من غير اختزاله في مجرد الشر العام.
- source_word: συναπαχθέντες
  choice: تنجرفوا
  rationale: يحفظ صورة الانسياق القسري في المبني للمجهول ضمنيًا، وهو أنسب بالعربية من ترجمة حرفية ثقيلة؛ وتدل الباء على الضلال الذي يحملهم معه.
- source_word: ἐκπέσητε
  choice: فتسقطوا عن
  rationale: يحفظ استعارة السقوط من موضع ثابت، ولا يخصّص التحذير لاهوتيًا بمعنى الارتداد الكامل.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: عن ثباتكم
  rationale: «ثبات» يقابل معنى الرسوخ والاستقرار في στηριγμός، والضمير المتصل يؤدي معنى الملكية في ἰδίου طبيعيًا.
theological_decisions:
- issue: هل يدل ἐκπέσητε على خسارة الخلاص أو الارتداد، أم على السقوط من حالة الثبات؟
  choice: فتسقطوا عن ثباتكم
  alternative: فتَرتدّوا عن رسوخكم في الإيمان
  rationale: النص يحذّر من الانجراف بالضلال وفقدان الثبات، لكنه لا يحسم بذاته المقصود العقائدي الأخص؛ لذلك حُفظت قوة التحذير من دون تقرير موقف مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع إبقاء نبرة النداء الرعوي والتحذير المباشر. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما بدل ربطهما بألفاظ لا تخصهما.
