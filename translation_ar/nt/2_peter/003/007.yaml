  source_fidelity: 'المعنى العام محفوظ: السماوات والأرض القائمتان الآن في حالة ادخار وحفظ للنار بالكلمة الإلهية نفسها، إلى يوم دينونة وهلاك البشر غير الأتقياء. لكن «بالكلمة نفسها» أقل وضوحًا في العربية من «بذات الكلمة»، إذ قد يُفهم الضمير بوصفه إحالة نحوية فحسب بدل إبراز معنى αὐτῷ الإحالي: «نفس/ذات الكلمة».'
  naturalness: الصياغة فصيحة في الجملة، لكن «ذُخِرَتا» لفظ نادر نسبيًا في الاستعمال العربي المعاصر، ولا سيما في نص موجه للوضوح. «ادُّخِرتا» أوضح وأقرب إلى دلالة τεθησαυρισμένοι. كما أن حذف الضمير في «وهلاكهم» يجعل عطف «الهلاك» على «الدينونة» مع إضافة كليهما إلى «الناس الفاجرين» أكثر مباشرة، وأقرب إلى تركيب اليونانية.
  terminology: «دينونة» مناسبة لـκρίσις في السياق الأخروي، و«هلاك» مناسبة لـἀπώλεια من غير تحميلها تفسيرًا عقائديًا زائدًا. و«الناس الفاجرين» تمثل ἀνθρώπων ἀσεβῶν تمثيلًا طبيعيًا وشاملًا؛ وتفيد الحاشية في بيان الشمول الجنساني.
