  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: ar
  text: أَمَّا السَّمَاوَاتُ الْحَاضِرَةُ وَالْأَرْضُ، فَقَدِ ادُّخِرَتَا بِذَاتِ الْكَلِمَةِ، وَهُمَا مَحْفُوظَتَانِ لِلنَّارِ إِلَى يَوْمِ دَيْنُونَةِ وَهَلَاكِ النَّاسِ الْفَاجِرِينَ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «البشر الفاجرين»؛ والكلمة اليونانية تعني البشر عمومًا، رجالًا ونساءً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: أَمَّا السَّمَاوَاتُ الْحَاضِرَةُ وَالْأَرْضُ
  rationale: تنقل «أمّا» المقابلة مع العالم السابق في السياق، و«الحاضرة» تبيّن أن νῦν يصف نظام الخليقة الموجود الآن، مع إبقاء جمع «السماوات».
- source_word: τῷ αὐτῷ λόγῳ
  choice: بِالْكَلِمَةِ نَفْسِهَا
  rationale: تفيد الباء الوسيلة، وتحفظ «نفسها» الإحالة إلى كلمة الله الفعّالة المذكورة في السياق السابق.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: فَقَدْ ذُخِرَتَا
  rationale: يعكس الفعل مع «قد» الحالة الحاضرة الناتجة من فعل سابق، ويحافظ على صورة الادخار دون الخلط بينها وبين الحفظ الوارد بعده.
- source_word: πυρὶ τηρούμενοι
  choice: وَهُمَا مَحْفُوظَتَانِ لِلنَّارِ
  rationale: «محفوظتان» تقابل معنى الحفظ أو الإبقاء، واللام في «للنار» تعبّر طبيعيًا عن الغاية المقصودة هنا.
- source_word: εἰς ἡμέραν κρίσεως
  choice: إِلَى يَوْمِ دَيْنُونَةِ
  rationale: «إلى» تحفظ الاتجاه الزمني والغاية الأخروية، و«دينونة» لفظ عربي واضح في سياق القضاء الإلهي.
- source_word: καὶ ἀπωλείας
  choice: وَهَلَاكِهِمْ
  rationale: «الهلاك» مقابل مباشر لـἀπώλεια في سياق الدينونة؛ وأضيف الضمير لإيضاح أن المضاف إليه نفسه، أي الناس الفاجرون، يتعلق بالدينونة والهلاك معًا.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: النَّاسِ الْفَاجِرِينَ
  rationale: ἀνθρώπων قد يدل على البشر عمومًا، ولذلك جاءت «الناس» طبيعية وشاملة. و«الفاجرين» تنقل انعدام التقوى والورع في ἀσεβῶν دون تقييد المعنى بجنس بعينه.
theological_decisions:
- issue: طبيعة المصير الناري الآتي
  choice: تقول الآية إن السماوات الحاضرة والأرض محفوظتان للنار، وإن الناس الفاجرين سيواجهون الدينونة والهلاك، من غير تحديد ما إذا كان مصير الكون فناءً تامًا أم تجديدًا تحويليًا.
  alternative: تفسير النار إما بأنها إفناء كامل للكون أو بأنها تطهير وتجديد للخليقة.
  rationale: يرتبط «الهلاك» نحويًا بالناس الفاجرين، بينما تُحفظ السماوات والأرض للنار. لذا لا تحسم الصياغة ما لم تحسمه الآية نفسها في الجدل الأوسع حول مصير الخليقة.
translation_notes:
  register: صياغة عربية فصحى حديثة ذات نبرة كتابية مهيبة وواضحة. استُعمل المثنى في «ذُخرتا» و«محفوظتان» لمعاملة السماوات والأرض طرفين مقترنين، وأُثبتت علامة الحاشية [a] في المتن.
