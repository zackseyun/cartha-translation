reference: 2 Peter 3:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: ar
  text: بل انموا في نعمة ربنا ومخلّصنا يسوع المسيح وفي معرفته. له المجد الآن وإلى يوم الأبد. آمين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐξάνετε
  choice: انموا
  rationale: فعل أمر مضارع موجّه إلى جماعة، و«انموا» ينقل معنى التقدّم المستمر طبيعيًا من غير إضافة تفسيرية.
- source_word: δὲ
  choice: بل
  rationale: يفيد انتقالًا ذا نبرة استدراكية في مقابل التحذير السابق، و«بل» مناسبة للسياق العربي.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: في نعمة ... وفي معرفته
  rationale: تتعلق ἐν بكل من χάριτι وγνώσει. أعيد ذكر «في» وفُكَّ التركيب في العربية لتوضيح أن المعرفة هي معرفة الرب والمخلّص، مع بقاء النعمة منسوبة إليه بالسياق.
- source_word: χάριτι
  choice: نعمة
  rationale: المقابل العربي الراسخ والدقيق لمعنى χάρις اللاهوتي في هذا السياق.
- source_word: γνώσει
  choice: معرفته
  rationale: ينقل معنى المعرفة المتعلقة بيسوع، والضمير يجعل العبارة العربية طبيعية ويتجنب تركيب «نعمة ومعرفة ربنا» الذي قد يوهم بأن الرب هو مفعول «المعرفة» وحدها على نحو ملتبس أسلوبيًا.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: ربنا ومخلّصنا يسوع المسيح
  rationale: أداة التعريف اليونانية الواحدة تربط اللقبين بشخص واحد. «المسيح» يترجم Χριστός بوصفه لقبًا، وهو التعبير العربي الطبيعي الراسخ.
- source_word: αὐτῷ ἡ δόξα
  choice: له المجد
  rationale: صيغة تمجيد عربية موجزة وطبيعية تقابل الإسناد الاسمي اليوناني ذي الفعل المحذوف.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: الآن وإلى يوم الأبد
  rationale: يحافظ على لفظ «يوم» في العبارة اليونانية غير المألوفة ولا يختزلها في «إلى الأبد»، مع صياغة عربية مفهومة.
- source_word: ἀμήν
  choice: آمين
  rationale: النقل الصوتي العربي التقليدي المستقر في الخواتيم التعبدية.
theological_decisions:
- issue: دلالة Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع المسمّى المسيح
  rationale: «المسيح» في العربية ترجمة دلالية راسخة للقب Χριστός وليست مجرد نقل صوتي، وتحافظ على قوة اللقب في صياغة طبيعية.
- issue: مرجع لقبي «ربنا ومخلّصنا»
  choice: كلا اللقبين يعودان إلى شخص واحد، يسوع المسيح
  alternative: صياغة قد تترك المرجع أقل وضوحًا
  rationale: وجود أداة تعريف يونانية واحدة مع κύριος وσωτήρ يدل طبيعيًا على مرجع واحد، وهو ما تعكسه الصياغة العربية من دون زيادة عقائدية.
- issue: مرجع الضمير في αὐτῷ
  choice: يسوع المسيح
  alternative: 'صياغة صريحة: «ليسوع المسيح المجد»'
  rationale: أقرب مرجع نحوي هو الرب والمخلّص يسوع المسيح؛ أُبقي الضمير كما في اليونانية من غير استبداله باسم صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «انموا» للجمع، و«المسيح» بوصفه الترجمة العربية الطبيعية للقب. حُفظ التعبير اللافت «يوم الأبد» في المتن مع بديل أكثر تداولًا في الحاشية.
