source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: ar
  text: لا يتباطأ الرب في شأن الوعد، كما يحسبه بعضٌ تباطؤًا، بل يتأنّى عليكم[a]، إذ لا يريد أن يهلك أحد، بل أن يصل الجميع إلى التوبة.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يطيل أناته عليكم».'
    reason: lexical_alternative
  - marker: b
    text: أُبقي نطاق «أحد» و«الجميع» كما يورده النص اليوناني؛ ويختلف المفسرون في كونه خاصًا بالمخاطَبين أو أوسع نطاقًا ليشمل البشر.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: الترجمة العربية الطبيعية المألوفة للقب الإلهي في هذا السياق.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: لا يتباطأ ... في إنجاز الوعد
  rationale: يحفظ معنى البطء المتعلق بالوعد، مع إظهار المقصود السياقي بصورة عربية واضحة؛ فالإنجاز مفهوم من التركيب وإن لم يكن لفظًا مستقلًا في اليونانية.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: كما يحسب بعض الناس التباطؤ
  rationale: «يحسب» يؤدي معنى ἡγοῦνται، و«التباطؤ» يحافظ على الصلة اللفظية بالفعل السابق.
- source_word: μακροθυμεῖ
  choice: يصبر
  rationale: يدل على طول الأناة وضبط النفس عبر الزمن، و«يصبر» واضح وطبيعي في العربية المعاصرة.
- source_word: εἰς ὑμᾶς
  choice: عليكم
  rationale: تعبير عربي طبيعي عن توجّه الصبر إلى المخاطَبين، مع إثبات البديل الأقرب لفظيًا في الحاشية.
- source_word: μὴ βουλόμενός
  choice: إذ لا يريد
  rationale: يحفظ معنى الإرادة أو الرغبة من غير إدخال تمييز لاهوتي تقني بين أنواع الإرادة.
- source_word: τινας ἀπολέσθαι
  choice: أن يهلك أحد
  rationale: «يهلك» يؤدي المعنى اللازم للفعل هنا، و«أحد» طبيعي في سياق النفي.
- source_word: πάντας εἰς μετάνοιαν χωρῆσαι
  choice: أن يبلغ الجميع إلى التوبة
  rationale: «يبلغ ... إلى» يحفظ قدرًا من صورة الوصول في χωρῆσαι، و«التوبة» هي المقابل الاصطلاحي الواضح لـ μετάνοια.
theological_decisions:
- issue: نطاق «عليكم» و«أحد» و«الجميع»
  choice: إبقاء ألفاظ الآية عامة كما وردت، من غير تقييد «أحد» و«الجميع» بجماعة بعينها أو توسيعهما تفسيرًا.
  alternative: حصرهما في قرّاء الرسالة المؤمنين، أو التصريح بأنهما يشملان البشرية كلها.
  rationale: النص اليوناني لا يصرح بهذا التحديد، ولذلك تُصان مساحة الاحتمال والتوتر اللاهوتي بدل حسمهما داخل الترجمة.
- issue: دلالة βουλόμενος في الكلام عن إرادة الله
  choice: لا يريد
  alternative: لا يشاء؛ لا يقضي؛ لا ينوي
  rationale: «لا يريد» ينقل الدلالة الإرادية المباشرة من غير تحميل اللفظ معنى تقنيًا عن القضاء الإلهي أو إضعافه إلى مجرد تفضيل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «التباطؤ» للمحافظة على التكرار البلاغي في الأصل، و«التوبة» للمصطلح الكتابي المألوف. جميع علامات الحواشي مثبتة في المتن.
