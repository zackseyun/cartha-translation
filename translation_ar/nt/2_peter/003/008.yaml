  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: ar
  text: 'ولكن لا يَغِبْ عنكم هذا الأمر الواحد[a]، أيها الأحباء: أن يومًا واحدًا عند الرب كألف سنة[c][b]، وألف سنة كيوم واحد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تكونوا غافلين عن هذا الأمر الواحد».'
    reason: lexical_alternative
  - marker: b
    text: تستعمل العبارة أداة تشبيه («كـ»)، فتعبّر عن مماثلة لا عن مساواة حرفية بين يوم واحد وألف سنة.
    reason: cultural_note
  - marker: c
    text: في هذا صدى للمزمور 90:4.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν ... τοῦτο
  choice: هذا الأمر الواحد
  rationale: يحفظ قوة اسم الإشارة والتوكيد على نقطة واحدة بعينها، بصياغة عربية واضحة.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: لا يَغِبْ عنكم
  rationale: ينقل معنى ألا يبقى الأمر خارج الانتباه، ويحافظ على قوة صيغة النهي وعلاقة الفعل بالمخاطَبين.
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: يحفظ نبرة الخطاب الودّي والإيماني بصياغة عربية فصيحة مألوفة.
- source_word: παρὰ κυρίῳ
  choice: عند الرب
  rationale: يؤدي معنى الحضور أو المنظور لدى الرب بإيجاز طبيعي، من غير حصر العبارة في تفسير واحد أضيق.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: يومًا واحدًا عند الرب كألف سنة
  rationale: الكاف تنقل ὡς بوصفها أداة تشبيه، لا مساواة حرفية، مع إبقاء ترتيب المقارنة واضحًا.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: وألف سنة كيوم واحد
  rationale: يحافظ على التوازي المتوازن مع الشطر الأول وعلى الإيجاز الذي تسمح به الجملة اليونانية الخالية من فعل مصرح به.
- source_word: χίλια ἔτη
  choice: ألف سنة
  rationale: هو المقابل العددي المباشر والطبيعي، ولا يقتضي السياق إعادة صياغته رمزيًا.
theological_decisions:
- issue: طبيعة المقارنة الزمنية
  choice: صياغة القول بوصفه تشبيهًا يتعلق بمنظور الرب إلى الزمن، لا معادلة حرفية ولا مفتاحًا لحساب الأزمنة النبوية.
  alternative: اعتبار اليوم مساويًا حرفيًا لألف سنة، أو اتخاذ الآية قاعدة زمنية للحسابات الأخروية.
  rationale: تكرار ὡς، المنقول بالكاف، يدل على التشبيه. لذلك تحافظ الترجمة على المقارنة من غير إدخال نظام عقائدي لا تصرّح به العبارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «لا يَغِبْ عنكم» لصياغة طبيعية تحفظ صورة بقاء الأمر خارج الانتباه، و«عند الرب» لتأدية المنظور أو الحضور من غير توسع تفسيري. وُضع هامش التشبيه بعد «ألف سنة» مع الإحالة إلى المزمور كما في طبقة المراجعة الإنجليزية.
