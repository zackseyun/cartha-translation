  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: ar
  text: وبما أن كلَّ هذه الأشياء تنحلّ هكذا[a]، فأيَّ أناسٍ ينبغي أن تكونوا في سلوكٍ مقدّس وتقوى[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تتفكك هكذا»؛ والفعل اليوناني يتحدث حرفيًا عن حلّ الأشياء أو انفكاكها.'
    reason: lexical_alternative
  - marker: b
    text: وردت كلمتا «السلوك» و«التقوى» في اليونانية بصيغة الجمع، ويمكن فهمهما على أنهما أوجه السلوك المقدس وممارسات التقوى.
    reason: grammatical_clarification
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: هذه كلُّها
  rationale: يشير التركيب إلى الموجودات المذكورة في السياق السابق، والضمير الإشاري المؤنث المفرد مع «كلها» تعبير عربي طبيعي عن مجموعها من غير إضافة تفسيرية.
- source_word: οὕτως
  choice: هكذا
  rationale: ينقل معنى الكيفية بإيجاز ووضوح، أي إن الانحلال يقع على النحو الموصوف في السياق.
- source_word: λυομένων
  choice: تنحلّ
  rationale: يحافظ على صورة الفكّ والانحلال في الفعل اليوناني، ولا يقوّيها إلى معنى «تُدمَّر» الأكثر تفسيرًا. وصيغة المضارع العربية تعكس صيغة اسم الفاعل المضارع المبني للمجهول بحسب السياق.
- source_word: ποταποὺς
  choice: أيَّ أناسٍ
  rationale: ينقل السؤال عن صفة المخاطَبين ونوع حياتهم، لا عن هويتهم فحسب، في صياغة عربية واضحة.
- source_word: δεῖ
  choice: ينبغي
  rationale: يعبّر عن الضرورة الأخلاقية الملائمة لسياق الحث، من غير تغليظ غير لازم.
- source_word: ὑπάρχειν
  choice: أن تكونوا
  rationale: هو المقابل العربي الطبيعي للفعل في تركيبه مع «ينبغي» وضمير المخاطبين.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: في سلوكٍ مقدّس
  rationale: «السلوك» يدل على مجمل طريقة الحياة والتصرف، ويؤدي جمع اليونانية بصيغة جمعية طبيعية في العربية.
- source_word: εὐσεβείαις
  choice: تقوى
  rationale: «التقوى» لفظ عربي مفهوم يدل على التعبد الموقر لله وما يظهر منه في الحياة. استُعمل المفرد الجمعي طبيعيًا بدل جمع متكلف.
theological_decisions:
- issue: وصف مصير الموجودات في نهاية الزمن
  choice: تنحلّ
  alternative: تُدمَّر؛ تتفكك
  rationale: الفعل اليوناني يتحدث حرفيًا عن الحلّ أو الانفكاك. يحفظ «تنحلّ» هذه الصورة ولا يحسم ما إذا كان المقصود إبادة كاملة أو تفكك النظام الحاضر.
- issue: طبيعة السؤال الأخلاقي
  choice: فأيَّ أناسٍ ينبغي أن تكونوا
  alternative: فكيف ينبغي أن تكونوا
  rationale: يحافظ هذا على السؤال اليوناني عن نوع الأشخاص الذين ينبغي أن يكونهم المخاطَبون، بدل اختزاله إلى سؤال عن الكيفية فقط.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وكريمة. حُفظت الجملة مفتوحة بفاصلة في آخر العدد لأن تركيبها اليوناني يتصل بما يليه، كما استُعمل «السلوك» و«التقوى» اسمين جمعيين طبيعيين في العربية.
