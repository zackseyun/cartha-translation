lexical_decisions:
- source_word: μακροθυμίαν
  choice: صبر
  rationale: يدل الاسم على طول الأناة والتريث في إنزال الدينونة. و«صبر» تعبير عربي طبيعي يلائم سياق تأخر مجيء الرب، مع بيان دلالته المقصودة في الحاشية.
- source_word: σωτηρίαν
  choice: لخلاصكم
  rationale: يحفظ اللفظ المعنى اللاهوتي للخلاص في السياق الأخروي. وأُدخلت اللام لتؤدي طبيعيًا معنى اعتبار صبر الرب متجهًا إلى الخلاص، وأُضيف ضمير المخاطبين توضيحًا للسياق لا تغييرًا لمرجع الخلاص.
- source_word: ἡγεῖσθε
  choice: احسبوا
  rationale: فعل أمر يطلب من القراء أن يعدّوا الأمر أو ينظروا إليه على نحو معين؛ و«احسبوا أن» صياغة عربية واضحة وتحافظ على قوة الأمر.
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب ودلالته اللاهوتية، والمراد به في السياق الرب يسوع.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: أخونا الحبيب
  rationale: يحفظ المودة في الوصف وصلة الأخوة، مع ترتيب عربي طبيعي.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: بحسب الحكمة التي أُعطيت له
  rationale: تنقل κατά معنى الموافقة أو الاتساق، وتحافظ صيغة المبني للمجهول على عدم تسمية واهب الحكمة كما في اليونانية.
- source_word: ἔγραψεν ὑμῖν
  choice: كتب إليكم
  rationale: ينقل الماضي اليوناني بصيغة ماضٍ عربية بسيطة ومباشرة.
- source_word: καθὼς καὶ
  choice: كما ... أيضًا
  rationale: يحفظ أداة المقارنة ودلالة الإضافة، رابطًا الوصية بما كتبه بولس.
theological_decisions:
- issue: الفاعل الضمني في عبارة «الحكمة التي أُعطيت له»
  choice: الإبقاء على المبني للمجهول من غير إضافة «من الله» في المتن
  alternative: بحسب الحكمة التي أعطاه الله إياها
  rationale: يرجح أن العطاء من الله، لكن النص اليوناني لا يصرح بالفاعل؛ لذلك تُحفظ دلالة النص وحدوده.
- issue: دلالة تريث الرب
  choice: «صبر ربنا هو لخلاصكم»
  alternative: «أناة ربنا فرصة للخلاص»
  rationale: يحفظ النص الصلة المباشرة بين صبر الرب والخلاص من غير توسيع تفسيري يجعله مجرد فرصة، مع صياغة عربية تبين الغاية المقصودة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «صبر» بدل اللفظ الأثقل «طول الأناة» في المتن، وحُفظت صيغة المبني للمجهول والتوتر اللاهوتي في نسبة صبر الرب إلى الخلاص.
