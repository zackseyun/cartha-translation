  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: ar
  text: ولا تتسلّطوا على الذين أُوكلت إليكم رعايتهم[a]، بل صيروا قدوةً للقطيع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الأنصبة» أو «القرعات». ويُرجَّح أن المقصود الأجزاء أو الجماعات من قطيع الله التي أُسندت رعايتها إلى الشيوخ، لا ممتلكات لهم.'
    reason: بديل معجمي وإيضاح للصورة الأصلية في τῶν κλήρων.
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: ولا كأنكم
  rationale: تحافظ العبارة على صلة النفي بما قبلها وعلى معنى الكيفية الذي تفيده ὡς، بصياغة عربية واضحة.
- source_word: κατακυριεύοντες
  choice: تتسلّطون على
  rationale: يدل الفعل على ممارسة السيادة بصورة متغلبة أو متعالية، لا على مجرد القيام بدور قيادي.
- source_word: τῶν κλήρων
  choice: الأنصبة الموكلة إلى رعايتكم
  rationale: تحفظ «الأنصبة» الصورة الحرفية لكلمة κλῆροι، بينما يوضح السياق أن المقصود أقسام الرعية المسندة إلى الشيوخ لا ممتلكات يملكونها.
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد المقابلة القوية بين السلوك المنهي عنه والسلوك المطلوب.
- source_word: τύποι
  choice: قدوةً
  rationale: تنقل معنى المثال أو النموذج الجدير بالاقتداء بصياغة عربية طبيعية.
- source_word: γινόμενοι
  choice: صيروا
  rationale: تحافظ على القوة الحركية للفعل، أي أن يجسّدوا القدوة فعليًا، بدل التعبير الساكن «كونوا».
- source_word: τοῦ ποιμνίου
  choice: للرعية
  rationale: «الرعية» تعبير عربي واضح يحفظ الاستعارة الرعوية للجماعة التي يتولى الشيوخ رعايتها.
theological_decisions:
- issue: دلالة κλήρων في سياق قيادة الكنيسة
  choice: الأنصبة من رعية الله الموكلة إلى رعاية الشيوخ
  alternative: تركها حرفيًا «الأنصبة» من غير إيضاح، أو فهمها بوصفها ممتلكات الشيوخ أو مناطق نفوذهم
  rationale: السياق يتحدث عن رعاية قطيع الله؛ فالإسناد يدل على مسؤولية ائتمانية لا على الملكية، مع إبقاء صورة الأنصبة ظاهرة في النص والحاشية.
- issue: قوة κατακυριεύοντες
  choice: النهي عن التسلط المتغلب والمتعالي
  alternative: فهم العبارة على أنها تنفي كل ممارسة للقيادة أو السلطة
  rationale: الفعل يذم إساءة استعمال السلطة، والمقابلة مع القدوة تبين أن المطلوب قيادة بالمثال لا إلغاء القيادة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. اختيرت «تتسلّطون» لإبراز إساءة استعمال السلطة، و«الرعية» لحفظ الاستعارة الرعوية المألوفة. أُبقيت صورة «الأنصبة» في المتن مع حاشية تشرح مرجعها السياقي من غير حسم زائد.
