  source_fidelity: ينقل المسودّة النهي عن ممارسة سلطة متغلبة والمعارضة الإيجابية المتمثلة في الاقتداء. لكن «ولا كأنكم تتسلّطون» ليست الصياغة العربية الأنسب للبناء اليوناني، و«الرعية» أضعف في إبقاء صورة «القطيع» الصريحة في ποιμνίου.
