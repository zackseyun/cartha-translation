lexical_decisions:
- source_word: φανερωθέντος
  choice: عندما يظهر
  rationale: 'اسم فاعل ماضٍ مبني للمجهول ضمن تركيب مطلق بالمضاف إليه، ودلالته الزمنية هنا: «عندما يظهر». وهذه الصياغة عربية طبيعية وتحفظ معنى الانكشاف والظهور، مع إثبات البديل الأقرب إلى صورة المبني للمجهول في الحاشية.'
- source_word: ἀρχιποίμενος
  choice: رئيس الرعاة
  rationale: لفظ مركب يدل على الراعي الأول أو الأعلى منزلة. و«رئيس الرعاة» واضح وفصيح، ويحفظ قوة اللقب في السياق.
- source_word: κομιεῖσθε
  choice: تنالون
  rationale: فعل مستقبل مبني للمتوسط يدل هنا على تلقي الجزاء أو الحصول عليه. و«تنالون» طبيعي في سياق المكافأة من غير تحويل الفعل إلى صيغة مبنية للمجهول.
- source_word: ἀμαράντινον
  choice: الذي لا يذبل
  rationale: يدل الوصف على ما لا يذوي ولا يفقد نضارته. والصلة «الذي لا يذبل» واضحة للقارئ الحديث وتحافظ على الصورة الحية دون تقويتها إلى معنى أوسع مثل «غير الفاني».
- source_word: τῆς δόξης
  choice: المجد
  rationale: أُبقي تركيب الإضافة في «إكليل المجد»، محافظةً على إيجاز العبارة اليونانية واحتمال علاقتها الدلالية دون اختزالها إلى مجرد صفة مثل «الإكليل المجيد».
- source_word: στέφανον
  choice: إكليل
  rationale: يدل اللفظ على إكليل يُمنح تكريمًا أو جائزةً، لا على التاج الملكي تحديدًا. و«إكليل» يحفظ هذا الفرق في العربية، مع توضيحه في الحاشية.
theological_decisions:
- issue: هوية «رئيس الرعاة»
  choice: إبقاء اللقب دون إضافة تفسيرية، وهو يشير في السياق إلى يسوع المسيح
  alternative: 'التصريح في المتن: «المسيح، رئيس الرعاة»'
  rationale: صورة الرعاية وسياق الظهور الآتي يدلان على المسيح، لكن النص نفسه يورد اللقب وحده؛ لذلك لا تُضاف هوية تفسيرية إلى المتن.
- issue: لغة الظهور الأخروي
  choice: عندما يظهر
  alternative: عندما يُكشَف عنه
  rationale: «يظهر» صياغة عربية طبيعية ضمن هذا السياق وتحفظ حدث التجلي أو الانكشاف، من غير تحديد كيفية الظهور. وتورد الحاشية البديل الذي يبرز صورة المبني للمجهول في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «إكليل» بدل «تاج» للمحافظة على صورة جائزة التكريم، وصيغ «الذي لا يذبل» لتبقى الاستعارة ملموسة ومفهومة.
