  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: ar
  text: سَلِّموا بعضكم على بعض بقبلة المحبة. سلامٌ لكم جميعًا، أنتم الذين في المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا
  rationale: فعل أمر موجَّه إلى جماعة، ويعبّر في ختام الرسالة عن تقديم التحية؛ وهذه الصياغة عربية طبيعية من غير زيادة في المعنى.
- source_word: ἀλλήλους
  choice: بعضكم على بعض
  rationale: تؤدي معنى الضمير التبادلي، وتوضح أن التحية متبادلة بين أفراد الجماعة.
- source_word: ἐν φιλήματι ἀγάπης
  choice: بقبلة المحبة
  rationale: تُترجم ἐν هنا بالباء الدالة على الوسيلة أو الكيفية، وتحافظ «قبلة المحبة» على علاقة الإضافة في اليونانية وعلى اللفظ الصريح ἀγάπη.
- source_word: εἰρήνη
  choice: سلامٌ
  rationale: تحافظ الصيغة الاسمية الموجزة على طابع البركة الختامية من غير إضافة فعل غير موجود في الأصل.
- source_word: ὑμῖν πᾶσιν
  choice: لكم جميعًا
  rationale: تنقل جهة البركة وشمولها لجميع المخاطَبين بعبارة عربية واضحة.
- source_word: τοῖς ἐν Χριστῷ
  choice: أنتم الذين في المسيح
  rationale: التركيب اليوناني وصفي ذو وظيفة اسمية، ولذلك صُرّح في العربية بالضمير والاسم الموصول للوضوح. و«المسيح» ينقل لقب Χριστός طبيعيًا في العربية.
theological_decisions:
- issue: دلالة العبارة ἐν Χριστῷ
  choice: في المسيح
  alternative: متحدون بالمسيح
  rationale: أُبقيت صورة «في المسيح» لأنها تعبّر مباشرة عن العبارة اليونانية وتحافظ على كثافتها ولا تحصرها في تفسير لاهوتي واحد؛ أما «متحدون بالمسيح» فتشرح أحد أبعادها لكنها أضيق من الأصل.
- issue: ترجمة Χριστῷ بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي الراسخ للقب اليوناني Χριστός، ويحتفظ بمعنى الممسوح. ولا تنشأ في العربية هنا المفاضلة الإنجليزية نفسها بين Christ وMessiah.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع الحفاظ على إيجاز البركة الختامية. لم تُدرج حاشية المقابل الإنجليزي «Christ/Messiah» لأن اللفظ العربي «المسيح» يؤدي اللقب نفسه طبيعيًا، فلا يوجد اختلاف عربي حقيقي يحتاج إلى حاشية.
