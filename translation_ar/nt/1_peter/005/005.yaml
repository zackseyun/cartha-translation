id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: ar
  text: وكذلك أنتم أيها الشبان[a]، اخضعوا للشيوخ. والبسوا جميعًا التواضع في معاملتكم بعضكم لبعض[b]، لأن «الله يقاوم المتكبرين، أما المتواضعون فيمنحهم نعمة»[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيها الأصغر سنًا». اللفظ اليوناني مذكر جمع («الشبان»)، لكن بعضهم يفهمه بمعنى أعم يشمل أعضاء الجماعة الأصغر سنًا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل: «تمنطقوا بالتواضع» أو «اربطوا التواضع عليكم». فهو يستحضر ارتداء ثوب أو ربطه، مشددًا على اتخاذ التواضع عمدًا.'
    reason: lexical_alternative
  - marker: c
    text: اقتباس أو تلميح إلى أمثال 3:34 بحسب الترجمة السبعينية.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: وكذلك
  rationale: أداة ربط موجزة وطبيعية تصل الوصية بما سبقها.
- source_word: νεώτεροι
  choice: أيها الشبان
  rationale: يحافظ على صيغة النداء المذكرة الجمع وعلى المقابلة المرجحة مع الشيوخ، مع بيان الاحتمال الأعم في الحاشية.
- source_word: ὑποτάγητε
  choice: اخضعوا
  rationale: أمر واضح وطبيعي يؤدي معنى قبول الخضوع أو وضع النفس تحت سلطة الآخرين دون زيادة تفسيرية.
- source_word: πρεσβυτέροις
  choice: للشيوخ
  rationale: السياق المباشر في 5:1–4 يرجح شيوخ الجماعة، واللفظ العربي يلائم هذا الاستعمال ويحافظ أيضًا على الصلة اللفظية بالعمر.
- source_word: πάντες δὲ
  choice: والبسوا جميعًا
  rationale: ينقل الانتقال إلى وصية تشمل الجماعة كلها، مع تقديم جميعًا في موضع عربي سلس.
- source_word: ἀλλήλοις
  choice: في معاملتكم بعضكم لبعض
  rationale: تعبير عربي طبيعي يوضح الاتجاه المتبادل للتواضع في علاقات الجماعة.
- source_word: ταπεινοφροσύνην
  choice: التواضع
  rationale: المقابل العربي المعاصر الواضح لمعنى اتضاع الفكر أو النفس.
- source_word: ἐγκομβώσασθε
  choice: البسوا
  rationale: يحفظ صورة ارتداء التواضع مع تجنب تعبير حرفي غامض؛ وتوضح الحاشية دلالة الربط أو التمنطق المحتملة.
- source_word: ἀντιτάσσεται
  choice: يقاوم
  rationale: يفيد أن الله يجعل نفسه في مواجهة المتكبرين، وهو قوي وموجز وطبيعي في العربية.
- source_word: δίδωσιν χάριν
  choice: يمنحهم نعمة
  rationale: ينقل العطاء الإلهي والاسم غير المعرف χάριν بعبارة عربية واضحة، والضمير يبين المفعول له دون تغيير المرجع.
theological_decisions:
- issue: مرجع πρεσβυτέροις
  choice: شيوخ الجماعة
  alternative: كبار السن عمومًا
  rationale: الحديث المباشر إلى الشيوخ في 5:1–4 يجعل المعنى الكنسي هو الأرجح، مع بقاء لفظ «الشيوخ» قريبًا من دلالة الأصل.
- issue: دلالة جنس νεώτεροι
  choice: أيها الشبان
  alternative: أيها الأصغر سنًا
  rationale: الصيغة اليونانية مذكرة جمع، فحُفظت في المتن دون الجزم بأن التطبيق محصور في الذكور؛ ثم توسع πάντες الوصية التالية لتشمل الجميع.
- issue: الصورة في ἐγκομβώσασθε
  choice: البسوا التواضع
  alternative: تمنطقوا بالتواضع أو اربطوه عليكم
  rationale: يحفظ الاختيار صورة اللباس المقصودة ويترك الحاشية تبين احتمال صورة الربط الأخص، من غير بناء معنى لاهوتي زائد عليها.
- issue: طبيعة القول الختامي
  choice: صياغته بوصفه اقتباسًا أو تلميحًا كتابيًا
  alternative: عرضه كلامًا غير مقتبس
  rationale: يتوافق القول بوضوح مع أمثال 3:34 في السبعينية، ولذلك وُضع بين علامتي اقتباس مع إحالة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظت صورة اللباس في «البسوا»، وحُفظت صيغة الخطاب المذكرة في «الشبان» مع توضيح البديل في الحاشية. استُعملت «الشيوخ» انسجامًا مع السياق الكنسي السابق، من غير إضافة لقب تفسيري إلى المتن.
