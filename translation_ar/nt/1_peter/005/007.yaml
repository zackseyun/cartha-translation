source:
  edition: SBLGNT
  text: πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπ’ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: ar
  text: ملقين كلَّ قلقكم[a] عليه[b][c]، لأنه يهتم بكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «همّكم»؛ فالكلمة اليونانية تعني هنا الهمّ المقلق أو الانشغال الذي يثقل النفس.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية حرفيًا بصيغة اسم الفاعل: «ملقين عليه»، وهي مرتبطة بالتوجيه الوارد في العدد 6.'
    reason: lexical_alternative
  - marker: c
    text: أي على الله، كما يتضح من السياق المباشر في العدد 6.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: كلَّ قلقكم
  rationale: يحافظ «كلَّ» على القوة الشاملة لـπᾶσαν، ويؤدي «قلقكم» معنى μέριμνα هنا بوصفه همًّا مقلقًا لا مجرد اهتمام محايد. وصيغة الجمع في الضمير تنقل ὑμῶν الموجَّه إلى الجماعة.
- source_word: ἐπιρίψαντες
  choice: ملقين
  rationale: اسم فاعل جمع يحافظ على الصلة النحوية بالتوجيه السابق في العدد 6، وعلى صورة نقل الحمل وإلقائه، من غير تحويل العبارة المستقلة إلى أمر صريح غير موجود في اليونانية.
- source_word: ἐπ’ αὐτόν
  choice: عليه
  rationale: تنقل حركة الإلقاء على شخص وتحافظ على الضمير الذي يعود، بحسب السياق المباشر، إلى الله.
- source_word: ὅτι
  choice: لأنه
  rationale: تبيّن بوضوح أن عناية الله هي سبب إلقاء القلق عليه.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: لأنه يهتم بكم
  rationale: صياغة عربية طبيعية تنقل معنى العناية الفعلية بالأشخاص. و«بكم» أوضح وأفصح هنا من ترجمة حرفية مثل «من جهتكم».
theological_decisions:
- issue: مرجع الضميرين αὐτόν وαὐτῷ
  choice: الضمير يعود إلى الله
  alternative: الرب بمعنى عام، مع استمداد المرجع من السياق
  rationale: السياق المباشر في 1 بطرس 5:6 يذكر «يد الله القديرة»، ولذلك فالله هو المرجع الأرجح. أبقت الترجمة الضمير ولم تستبدله باسم صريح، حفاظًا على صيغة النص اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «قلقكم» لأنه مفهوم للقارئ الحديث ويعبّر عن الهمّ المقلق، مع إبقاء البنية الاسمية «ملقين» لصون ارتباط العدد بما قبله. وُضعت علامات الحواشي بجوار الألفاظ التي تشرحها.
