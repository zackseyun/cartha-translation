  rationale: تُصحَّح صياغة الغرض من الرسالة لتؤدي معنى الحث والشهادة المؤكِّدة في اليونانية بعبارة عربية سليمة وطبيعية. وتبقى الإشارة «هذه» غير مفسَّرة، محافظةً على سعة مرجعها، كما تبقى صيغة الأمر في المتن والقراءة الخبرية البديلة في الحاشية.
