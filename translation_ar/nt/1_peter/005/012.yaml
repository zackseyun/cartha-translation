  terminology: «الأخ الأمين»، «نعمة الله الحقيقية»، و«فاثبتوا فيها» مناسبة. يُحافَظ على «سلوانس» لا «سيلا»، وعلى صيغة الأمر في المتن؛ وتبقى القراءة الخبرية في الحاشية.
