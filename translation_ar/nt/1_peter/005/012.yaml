source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: ar
  text: على يد سلوانس، الأخ الأمين، كما أراه، كتبتُ إليكم بإيجاز، وأنا أحثّكم وأشهد أن هذه هي نعمة الله الحقيقية. فاثبتوا فيها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «التي أنتم ثابتون فيها» بدلًا من «فاثبتوا فيها».'
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: بِيَدِ سِلْوَانُسَ
  rationale: تفيد διά مع المضاف إليه الواسطة أو الوكالة. وتعبير «بيد» عربي طبيعي يترك دور سلوانس مفتوحًا، سواء أكان حامل الرسالة أم كاتبها بإملاء بطرس، من غير تحديد زائد.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: الأخ الأمين
  rationale: تنقل «الأمين» معنى πιστός بوصفه موضع ثقة وثابتًا في أمانته، و«الأخ» مناسب لأن المرجع رجل بعينه وشريك في الإيمان.
- source_word: ὡς λογίζομαι
  choice: كما أَعُدُّه
  rationale: يحفظ العبارة الاعتراضية التي تعبّر عن تقدير الكاتب الشخصي لسلوانس، بصياغة عربية موجزة وطبيعية.
- source_word: δι’ ὀλίγων ἔγραψα
  choice: كتبتُ إليكم بإيجاز
  rationale: العبارة اصطلاحية وتفيد الكتابة بكلمات قليلة أو بإيجاز؛ وهذه الصياغة واضحة في العربية المعاصرة.
- source_word: παρακαλῶν
  choice: مشجِّعًا
  rationale: قد يدل الفعل على الحث أو التشجيع أو المناشدة. يجمع «مشجِّعًا» هنا بين التقوية والحض دون إضفاء نبرة آمرة غير لازمة.
- source_word: ἐπιμαρτυρῶν
  choice: شاهدًا
  rationale: يحفظ قوة الشهادة والتأكيد الجاد في الفعل، ولا يضعفه إلى مجرد إقرار ذهني.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: أن هذه هي نعمة الله الحقيقية
  rationale: يحفظ تركيب الجملة وإسناد صفة الحقيقة إلى نعمة الله، مع إبقاء مرجع «هذه» واسعًا كما في الأصل.
- source_word: εἰς ἣν στῆτε
  choice: فاثبتوا فيها
  rationale: يتبع قراءة الأمر στῆτε في النص المعطى، وينقل معنى الرسوخ والاستمرار ضمن مجال النعمة بصياغة عربية مألوفة.
theological_decisions:
- issue: مرجع اسم الإشارة «هذه»
  choice: أُبقي اسم الإشارة بلا تفسير مضاف، بحيث يمكن أن يشير إلى مضمون الرسالة والشهادة الواردة فيها بوصفه نعمة الله الحقيقية.
  alternative: قد يُفهم على أنه يشير بصورة أضيق إلى خبرة القرّاء للنعمة، أو إلى بشارة بعينها نقلها سلوانس.
  rationale: سياق الكتابة والتشجيع والشهادة يرجّح مضمون الرسالة، لكن الأصل لا يضيّق المرجع صراحة، لذلك ينبغي صون هذا الاتساع.
- issue: صيغة στῆτε في خاتمة الآية
  choice: 'الأمر: «فاثبتوا فيها».'
  alternative: 'قراءة خبرية في بعض المخطوطات: «التي أنتم ثابتون فيها».'
  rationale: النص اليوناني المزوَّد يقرأ صيغة الأمر، لذا تُعتمد في المتن، مع إثبات القراءة الأخرى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بيد سلوانس» لنقل الواسطة من غير حسم وظيفة سلوانس، ووُضعت العبارة الاعتراضية «كما أعدّه» بحيث تبقى صلتها بتزكية سلوانس واضحة. أُثبتت علامة الحاشية [a] في المتن عند الجملة التي تخصها.
