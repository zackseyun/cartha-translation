  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: ar
  text: فقاوموه، راسخين في الإيمان، عالمين أن الآلام نفسها تقع على جماعة المؤمنين، إخوتكم في العالم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن الآلام نفسها تُستكمل في جماعة المؤمنين، إخوتكم في العالم». و«جماعة المؤمنين» تشير إلى جميع المؤمنين، رجالًا ونساءً.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: ـه في «فقاوموه»
  rationale: ضمير موصول في حالة المجرور الإعرابية يعود إلى إبليس في الآية السابقة؛ وإلحاق ضمير المفعول بالفعل هو الأسلوب العربي الطبيعي.
- source_word: ἀντίστητε
  choice: فقاوموا
  rationale: أمر يدعو إلى مواجهة حاسمة؛ و«قاوم» واضح ومباشر ويحفظ معنى الوقوف ضد الخصم.
- source_word: στερεοὶ τῇ πίστει
  choice: راسخين في الإيمان
  rationale: «راسخين» تؤدي معنى الثبات والقوة، و«في الإيمان» تحافظ على إمكان فهم πίστις بوصفه الإيمان المسيحي أو الثقة المؤمنة دون حسم زائد.
- source_word: εἰδότες
  choice: عالمين
  rationale: يحفظ صيغة الحال في اليونانية ويربط المقاومة بالوعي بما يلاقيه سائر المؤمنين.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: الآلام نفسها
  rationale: تعبير عربي موجز يحفظ معنى اشتراك جماعة المؤمنين في الآلام المماثلة، من غير الإيحاء بأنها أحداث متطابقة تفصيلًا.
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: إخوتكم في العالم
  rationale: صياغة عربية طبيعية للمجتمع الأخوي كله، مع بقاء الدلالة الجماعية الشاملة موضحة في الحاشية.
- source_word: ἐπιτελεῖσθαι
  choice: تجري عليهم
  rationale: الفعل المبني للمجهول صعب في هذا السياق؛ و«تجري عليهم» تعبير عربي طبيعي يفيد وقوع الآلام عليهم، مع الإشارة في الحاشية إلى معنى الإتمام الممكن.
theological_decisions:
- issue: دلالة τῇ πίστει
  choice: في الإيمان
  alternative: بالإيمان
  rationale: وجود أداة التعريف والسياق التحريضي يرجحان الرسوخ في الإيمان، لكن العبارة العربية تبقي قدرًا من التداخل بين مضمون الإيمان والثقة المؤمنة.
- issue: دلالة ἀδελφότητι الشاملة
  choice: إخوتكم
  alternative: جماعة المؤمنين / أسرة المؤمنين
  rationale: يحفظ التعبير الصورة العائلية في الأصل، ولا يقصر المرجع على الذكور؛ وقد وُضّح شموله في الحاشية.
- issue: معنى ἐπιτελεῖσθαι
  choice: تجري عليهم
  alternative: تُستكمل فيهم
  rationale: المعنى الدقيق قد يتراوح بين وقوع الآلام واكتمالها؛ اختيرت عبارة سليمة وطبيعية في المتن، مع حفظ احتمال الإتمام في الحاشية بدل فرض تصور لاهوتي عن مقدار مقرر من الألم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت صيغة الجمع المذكر بحسب العرف النحوي العربي مع توضيح الشمول في الحاشية، وحُفظ غموض الفعل ἐπιτελεῖσθαι بإيراد البديل الأقرب إلى معنى الإتمام.
