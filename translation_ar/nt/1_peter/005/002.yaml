source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: ar
  text: ارعوا قطيع الله الذي بينكم، مُشرفين عليه، لا عن إكراه بل طوعًا، بحسب الله[a]، ولا طلبًا لمكسب مُخزٍ بل برغبة صادقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: بحسب إرادة الله، أو كما يريد الله.'
    reason: توضيح بديل للعبارة اليونانية الموجزة κατὰ θεόν، التي تحتمل هذا المعنى من غير أن تصرح به تفصيلًا.
lexical_decisions:
- source_word: ποιμάνατε
  choice: ارعوا
  rationale: فعل أمر يحافظ على صورة الراعي وعمله، من غير تحويل الفعل إلى لقب كنسي اصطلاحي.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: قطيع الله الذي بينكم
  rationale: يحفظ صورة القطيع، ويُظهر أن القطيع لله لا للشيوخ، ويفهم ἐν ὑμῖν فهمًا مكانيًا وعلاقاتيًا.
- source_word: ἐπισκοποῦντες
  choice: مشرفين عليه
  rationale: اسم الفاعل يبين كيفية الرعاية، وينقل معنى الإشراف والعناية من غير جعله اسم منصب كنسي محدد.
- source_word: μὴ ἀναγκαστῶς
  choice: لا عن إكراه
  rationale: ينقل معنى العمل بدافع الاضطرار أو الضغط، ويهيئ المقابلة مع الخدمة الطوعية.
- source_word: ἀλλὰ ἑκουσίως
  choice: بل طوعًا
  rationale: تعبير عربي موجز وطبيعي يدل على الاختيار والاستعداد، في مقابل الإكراه.
- source_word: κατὰ θεόν
  choice: بحسب الله
  rationale: يحافظ على إيجاز العبارة اليونانية واحتمالها الدلالي، من غير حصرها صراحة في إرادة الله أو معياره؛ ويُشرح المعنى الأرجح في الحاشية.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: ولا طلبًا لمكسب مُخزٍ
  rationale: ينقل دافع السعي إلى الربح مع إبقاء الحكم الأخلاقي القوي في الصفة αἰσχρός.
- source_word: ἀλλὰ προθύμως
  choice: بل بحماسة
  rationale: ينقل الاستعداد المتقد والحماسة، ويميز اللفظ عن طوعًا التي تقابل ἑκουσίως.
theological_decisions:
- issue: هل يُترجم ἐπισκοποῦντες بوصفه لقبًا كنسيًا تقنيًا؟
  choice: 'تُرجم وصفيًا: «مشرفين عليه».'
  alternative: قائمين بخدمة الأساقفة / عاملين كنظار
  rationale: السياق يصف عمل الشيوخ في رعاية القطيع، ولا يقتضي فرض بنية كنسية اصطلاحية متأخرة.
- issue: مدى التصريح بمعنى κατὰ θεόν
  choice: أُبقيت العبارة الموجزة «بحسب الله» في المتن، مع تفسير بديل في الحاشية.
  alternative: بحسب إرادة الله / كما يريد الله
  rationale: العبارة اليونانية مكثفة ويمكن أن تشير إلى إرادة الله أو معياره أو ما يوافقه؛ لذلك لا يحسم المتن ما تركه الأصل موجزًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارة الراعي والقطيع، واستُعملت ألفاظ وصفية غير طائفية في الحديث عن الإشراف، مع إبقاء إيجاز العبارة اللاهوتية «بحسب الله» وإيضاحها في الحاشية.
