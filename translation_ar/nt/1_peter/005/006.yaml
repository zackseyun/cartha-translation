  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: ar
  text: فتواضعوا[a] إذن تحت يد الله القديرة، لكي يرفعكم في الوقت المناسب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اتضعوا ... لكي يرفعكم في حينه». صيغة فعل الأمر في اليونانية مبنية للمجهول، لكنها تُفهم هنا عادةً بمعنى انعكاسي: «تواضعوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: فتواضعوا
  rationale: الفعل أمر ماضٍ مبني للمجهول من حيث الصيغة اليونانية، لكنه يُفهم هنا غالبًا بقوة انعكاسية أو وسطية. «تواضعوا» عربية طبيعية تحفظ قوة الوصية، مع بيان البديل الحرفي في الحاشية.
- source_word: οὖν
  choice: إذن
  rationale: تفيد الاستنتاج مما سبق، ولا سيما قول الكاتب إن الله يقاوم المستكبرين ويعطي المتواضعين نعمة.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: تحت يد الله القديرة
  rationale: تحفظ الصورة الكتابية المعروفة التي تشير إلى قدرة الله وسلطانه وعمله الفعال، بصياغة عربية واضحة ومألوفة.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: مضاف إليه يحدد أن اليد هي يد الله؛ أُدمج طبيعيًا في العبارة العربية «يد الله القديرة».
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية، مع احتمال النتيجة الملازم للسياق.
- source_word: ὑμᾶς ὑψώσῃ
  choice: يرفعكم
  rationale: الفاعل المفهوم هو الله. «يرفعكم» تنقل معنى منح المكانة أو الكرامة والتبرئة، وتبقى طبيعية ومفهومة في العربية دون حصر المعنى في رفعة جسدية.
- source_word: ἐν καιρῷ
  choice: في الوقت المناسب
  rationale: تشير καιρός إلى الوقت الملائم أو المعين، لا إلى الزمن الزمني المجرد؛ وهذه العبارة واضحة في العربية الحديثة من غير أن تجزم بأن المقصود موعد محدد مسبقًا.
theological_decisions:
- issue: صيغة Ταπεινώθητε والفاعل في التواضع
  choice: «تواضعوا» بصيغة انعكاسية عملية، مع إبقاء الخضوع «تحت يد الله القديرة» وإثبات البديل المبني للمجهول في الحاشية.
  alternative: «دعوا أنفسكم تُذَل» أو «اخضعوا للتواضع» بمعنى «كونوا مُتواضَعين/مُذلَّلين».
  rationale: تحفظ الصياغة مسؤولية المخاطبين عن اتخاذ موقف التواضع أمام الله، من غير تصويره تواضعًا ذاتيًا مستقلًا عنه؛ كما لا تُخفي الصيغة اليونانية المبنية للمجهول، إذ تُذكر في الحاشية.
- issue: دلالة ὑψώσῃ
  choice: «يرفعكم» بما يسمح بمعاني الإكرام والتبرئة وإعلاء المكانة.
  alternative: «يمجّدكم» أو «يعلي شأنكم».
  rationale: تجنب الترجمة تضييق المعنى إلى تمجيد أخروي حصري أو نجاح دنيوي، وتحفظ الانفتاح الدلالي للنص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «إذن» لإبراز الاستنتاج، و«يد الله القديرة» للمحافظة على الصورة الكتابية، و«في الوقت المناسب» للوضوح المعاصر. وُضعت علامة الحاشية بعد الجملة لأن الحاشية تشرح صيغة فعل الأمر الأول، مع بقاء العلامة ظاهرة في المتن.
