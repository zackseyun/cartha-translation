  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: ar
  text: تُسَلِّمُ عليكم التي في بابل[b]، المختارة معكم[a]، وكذلك مرقس، ابني[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة تفسيرية أكثر: «الكنيسة التي في بابل، المختارة معكم». في اليونانية تعبير بصيغة المؤنث المفرد، والاسم الموصوف محذوف.'
    reason: alternative_reading
  - marker: b
    text: قد تكون «بابل» إشارة رمزية إلى روما في الاستعمال المسيحي المبكر؛ أما النص نفسه فيقول «بابل».
    reason: cultural_note
  - marker: c
    text: يُرجَّح أن «ابني» تعبّر عن علاقة روحية لا عن بنوّة جسدية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: تُسَلِّمُ عليكم
  rationale: تعبير عربي طبيعي يؤدي معنى التحية في سياق الرسائل، ويحافظ على الفعل في صيغة المفرد المؤنث.
- source_word: ἡ ἐν Βαβυλῶνι συνεκλεκτὴ
  choice: التي في بابل، المختارة معكم
  rationale: يحافظ على صيغة المؤنث المفرد وعلى حذف الاسم الموصوف في اليونانية، من غير أن يضيف «الكنيسة» إلى المتن.
- source_word: ἐν Βαβυλῶνι
  choice: في بابل
  rationale: ينقل اسم المكان كما ورد، ولا يستبدله بتفسير محتمل مثل روما.
- source_word: συνεκλεκτὴ
  choice: المختارة معكم
  rationale: ينقل معنى الاشتراك في الاختيار بعبارة عربية واضحة وطبيعية.
- source_word: Μᾶρκος
  choice: مرقس
  rationale: الصيغة العربية الشائعة للاسم اليوناني.
- source_word: ὁ υἱός μου
  choice: ابني
  rationale: يحافظ على اللفظ العائلي الصريح في الأصل، من غير إضافة وصف «الروحي» غير المذكور.
theological_decisions:
- issue: هوية المشار إليها بصيغة المؤنث في ἡ ... συνεκλεκτὴ
  choice: 'إبقاء المرجع المؤنث غير مصرَّح باسمه: «التي ... المختارة معكم»'
  alternative: «الكنيسة التي في بابل، المختارة معكم» أو امرأة مسيحية بعينها
  rationale: ورد في اليونانية تعريف ووصف بصيغة المؤنث المفرد من غير اسم ظاهر؛ لذلك يحفظ المتن هذا الإضمار، وتوضح الحاشية القراءة الكنسية الشائعة.
- issue: المقصود ببابل
  choice: إبقاء «بابل» في المتن
  alternative: فهمها رمزًا إلى روما أو إشارة إلى بابل التاريخية في بلاد الرافدين
  rationale: النص يذكر بابل صراحة، أما تعيين المقصود التاريخي أو الرمزي فموضع نقاش ولا ينبغي حسمه داخل الترجمة.
- issue: طبيعة بنوّة مرقس
  choice: «ابني»
  alternative: «ابني الروحي»
  rationale: يرجح أن العبارة تدل على علاقة روحية، لكن الأصل لا يصرح بذلك، لذا يُحفظ اللفظ المباشر وتوضع دلالته المحتملة في الحاشية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت «التي» و«المختارة» للمحافظة على المؤنث المفرد والإضمار الموجودين في الأصل، مع تجنب إدخال «الكنيسة» أو «روما» أو «الروحي» في المتن.
