  text: لَهُ السُّلْطَانُ إِلَى أَبَدِ الآبِدِينَ[a]. آمِين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى عُصُورِ العُصُورِ».'
    reason: بديل معجمي يبيّن الصورة الحرفية للتعبير اليوناني التوكيدي.
lexical_decisions:
- source_word: αὐτῷ
  choice: لَهُ
  rationale: ضمير مفرد في حالة المجرور غير المباشر يعود في السياق السابق إلى الله. وصيغة «له» تحافظ على أسلوب التمجيد الموجز من غير إضافة فعل غير موجود في اليونانية.
- source_word: κράτος
  choice: السُّلْطَانُ
  rationale: تدل الكلمة هنا، في سياق التمجيد، على القدرة السيادية والحكم، لا على القوة الجسدية المجردة؛ و«السلطان» يؤدي هذا المعنى بوضوح في العربية.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إِلَى أَبَدِ الآبِدِينَ
  rationale: تعبير عربي راسخ يفيد الدوام الذي لا نهاية له، ويحافظ كذلك على قوة الصيغة اليونانية التوكيدية.
- source_word: ἀμήν
  choice: آمِين
  rationale: النقل الصوتي المألوف في الاستعمال الكتابي والعبادي العربي، ويحفظ قوة التصديق الختامي.
theological_decisions:
- issue: المحمول الفعلي المقدَّر في صيغة التمجيد الاسمية
  choice: لَهُ السُّلْطَانُ
  alternative: لِيَكُنْ لَهُ السُّلْطَانُ / لَهُ السُّلْطَانُ بحق
  rationale: النص اليوناني بلا فعل. والجملة الاسمية العربية سليمة وطبيعية، فتحافظ على إيجاز الأصل وغموضه النحوي بين الإقرار والتمنّي التمجيدي، من غير فرض فعل بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة تمجيدية رصينة. استُخدمت الجملة الاسمية لإبقاء بنية الأصل الموجزة، واختير «أبد الآبدين» لكونه مفهومًا وطبيعيًا مع بيان الصورة الحرفية في الحاشية.
