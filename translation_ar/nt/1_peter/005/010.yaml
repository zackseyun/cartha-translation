reference: 1 Peter 5:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: ar
  text: وأمّا إله كل نعمة، الذي دعاكم إلى مجده الأبدي في المسيح، فبعد أن تتألّموا وقتًا قليلًا، هو نفسه سيُصلحكم[a] ويثبّتكم ويقوّيكم ويرسّخكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيُكمّلكم» أو «سيُعِدّكم كما ينبغي». يدل الفعل على جعل الشيء في حال سليمة أو مكتملة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ويضعكم على أساس راسخ». يستعمل الأصل صورة وضع الأساس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: كل نعمة
  rationale: تركيب إضافي طبيعي في العربية يحفظ الشمول من غير أن يقيّده بأنواع محددة من النعمة.
- source_word: καλέσας
  choice: الذي دعاكم
  rationale: تحويل اسم الفاعل اليوناني في صيغة الماضي إلى جملة صلة عربية يوضح الفاعل وتسلسل العبارة.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: إلى مجده الأبدي
  rationale: «إلى» عربية طبيعية تحفظ معنى الاتجاه والغاية في εἰς من غير المبالغة في تصوير الدخول المكاني.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، و«في» تحفظ صيغة الاتحاد أو المجال التي تظل دلالتها مفتوحة بحسب السياق.
- source_word: ὀλίγον παθόντας
  choice: بعد أن تتألّموا وقتًا قليلًا
  rationale: يفهم ὀλίγον على أنه قيد زمني، وتُظهر «بعد أن» العلاقة الزمنية الطبيعية بين الألم وأفعال الله الآتية.
- source_word: αὐτὸς
  choice: هو نفسه
  rationale: يحفظ التوكيد الصريح في الضمير اليوناني على أن الله يتولى الفعل بنفسه.
- source_word: καταρτίσει
  choice: سيُصلحكم
  rationale: «يُصلح» يجمع معنى ردّ الشيء إلى حال سليمة وتهيئته كما ينبغي، مع إبقاء بديل الإكمال في الحاشية.
- source_word: στηρίξει
  choice: ويثبّتكم
  rationale: ينقل معنى جعل المخاطَبين راسخين ثابتين، ويميّزه بقدر الإمكان عن التقوية والترسيخ.
- source_word: σθενώσει
  choice: ويقوّيكم
  rationale: مقابل مباشر وطبيعي لمعنى إكساب القوة.
- source_word: θεμελιώσει
  choice: ويرسّخكم
  rationale: ينقل الثبات العميق المرتبط بصورة الأساس بصياغة عربية موجزة، مع توضيح الصورة في الحاشية.
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: بالمسيح
  rationale: تحفظ «في المسيح» الصيغة اليونانية وتبقي مفتوحة دلالة المجال أو الاتحاد، بدل حصرها في الوسيلة السببية.
- issue: علاقة الألم بفعل الله
  choice: بعد أن تتألّموا وقتًا قليلًا
  alternative: إذ تتألّمون وقتًا قليلًا
  rationale: تعكس الصياغة القراءة الزمنية الأرجح للعبارة، فتبيّن قِصر الألم واتباع أفعال الله له، من غير بناء تصور مذهبي أوسع عن سبب الألم.
- issue: مدى معنى καταρτίσει
  choice: سيُصلحكم
  alternative: سيُكمّلكم
  rationale: «يُصلحكم» تلائم سياق ما بعد الألم وتحفظ معنى الإعادة إلى الحال السليمة، فيما تُذكر دلالة الإكمال الممكنة في الحاشية كي لا تُحسم السعة الدلالية بصمت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «وأمّا» لنقل التحول والتوكيد في ὁ δὲ θεός، وحُفظ إيقاع الأفعال الأربعة المتتابعة مع تجنب الألفاظ المهجورة.
