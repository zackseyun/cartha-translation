  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: ar
  text: تحلّوا بصفاء الذهن[a]، واسهروا. خصمكم، إبليس، يجول كأسد يزأر، ملتمسًا من يبتلعه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كونوا متزنين». أصل الفعل اليوناني يدل حرفيًا على الصحو من الخمر، لكنه مستعمل هنا مجازًا بمعنى صفاء الذهن وضبط النفس، لا أمرًا خاصًا بالامتناع عن الشراب.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يُفهم «يجول» هنا بمعنى «يطوف مترصّدًا»؛ فالفعل اليوناني في أصله يعني يمشي أو يجول، أما معنى الترصّد فيوحي به تشبيه الأسد.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: كونوا صافِي الذهن
  rationale: 'الفعل أمر جمع، ومعناه هنا مجازي: صفاء الذهن وضبط النفس في مواجهة الخطر الروحي، لا الامتناع الحرفي عن الخمر. وصياغة «صافي الذهن» تميّزه من فعل السهر الآتي بعده.'
- source_word: γρηγορήσατε
  choice: اسهروا
  rationale: يدل على اليقظة والانتباه المستمرين. و«اسهروا» تعبير كتابي عربي موجز وطبيعي يحفظ صورة اليقظة.
- source_word: ἀντίδικος
  choice: خصمكم
  rationale: قد يُستعمل اللفظ للخصم في القضاء، لكنه هنا أوسع، فيدل على المعادي والمناوئ؛ و«خصمكم» يحفظ ذلك من غير تقييده بسياق قضائي.
- source_word: διάβολος
  choice: إبليس
  rationale: اللفظ، وإن كان يدل اشتقاقيًا على المفتري، مستعمل هنا لقبًا للكائن الشرير المعروف في العهد الجديد؛ و«إبليس» هو المقابل العربي الواضح المألوف.
- source_word: ὡς λέων ὠρυόμενος
  choice: كأسد زائر
  rationale: يحفظ التشبيه الصريح وصورة الأسد الذي يطلق زئيره مهددًا.
- source_word: περιπατεῖ
  choice: يجول
  rationale: ينقل معنى المشي هنا وهناك أو التجوال، مع ترك صورة الأسد نفسها تحمل معنى التهديد، دون إدخال معنى التربص صراحة في المتن.
- source_word: ζητῶν
  choice: ملتمسًا
  rationale: اسم الفاعل اليوناني يصف بحثًا مقصودًا ملازمًا للتجوال؛ و«ملتمسًا» يحفظ هذا المعنى بإيجاز.
- source_word: τινα
  choice: من
  rationale: ضمير نكرة مفرد غير محدد؛ و«من» العربية تؤدي معنى شخص غير معيّن بصورة طبيعية.
- source_word: καταπιεῖν
  choice: يبتلعه
  rationale: المعنى الحرفي هو الابتلاع، وهو ملائم تمامًا لصورة الأسد ويحفظ عنف الافتراس أكثر مباشرة من صياغة تفسيرية.
theological_decisions:
- issue: هل يُترجم διάβολος وصفًا عامًا بمعنى «المفتري» أم لقبًا شخصيًا؟
  choice: إبليس
  alternative: المفتري
  rationale: السياق يشير إلى الكائن الشرير الشخصي المعادي للمؤمنين، لا إلى شخص مفتَرٍ على وجه العموم. ولا تضيف الترجمة بذلك تفصيلًا عقديًا خارج النص.
- issue: مقدار تقوية معنى περιπατεῖ ضمن صورة الأسد
  choice: يجول
  alternative: يطوف متربصًا
  rationale: «يجول» قريب من الدلالة الأساسية للفعل، بينما يستفاد معنى التربص والافتراس من تشبيه الأسد ومن غاية الابتلاع. تُذكر الصياغة الأقوى في الحاشية بوصفها احتمالًا سياقيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. استُعمل «اسهروا» بمعنى اليقظة، و«أسد زائر» بمعنى أسد يزأر. روعي التفريق بين صفاء الذهن واليقظة، كما حُفظت الصورة الحرفية للابتلاع.
