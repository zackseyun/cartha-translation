source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: ar
  text: 'لذلك أحثّ الشيوخ الذين بينكم، بوصفي شيخًا مثلهم وشاهدًا لآلام المسيح[a]، وشريكًا أيضًا في المجد المزمع أن يُعلَن[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لآلام الممسوح». «المسيح» هنا لقب يقابل اللفظ اليوناني Χριστός.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ولي أيضًا نصيب في المجد الذي سيُعلَن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: الشيوخ
  rationale: يدلّ اللفظ هنا، في سياق الجماعة، على قادتها لا على كبار السن عمومًا. و«الشيوخ» المقابل العربي الواضح الذي لا يفرض مصطلحًا طائفيًا لاحقًا.
- source_word: οὖν
  choice: لذلك
  rationale: تفيد الأداة انتقالًا استنتاجيًا مرتبطًا بما سبق، وتحافظ «لذلك» على هذه الصلة المنطقية بوضوح.
- source_word: ἐν ὑμῖν
  choice: الذين بينكم
  rationale: تعبير عربي طبيعي ينقل معنى وجود هؤلاء الشيوخ في وسط المخاطَبين.
- source_word: παρακαλῶ
  choice: أحثّ
  rationale: ينقل الحث الرعوي الجاد، لا مجرد الطلب ولا معنى التعزية.
- source_word: συμπρεσβύτερος
  choice: شيخًا مثلهم
  rationale: يحفظ معنى مشاركة المتكلم لهم صفة الشيخ، بصياغة عربية طبيعية وواضحة.
- source_word: μάρτυς
  choice: شاهدًا
  rationale: يحفظ مدى اللفظ اليوناني، سواء أكان التركيز على المعاينة أم على أداء الشهادة، من غير تحويله إلى معنى «شهيد» الذي مات لأجل إيمانه.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: لآلام المسيح
  rationale: صياغة عربية موجزة وطبيعية للمضاف إليه، وتشير في السياق إلى الآلام التي احتملها المسيح.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ معناه بوصفه لقبًا للممسوح.
- source_word: κοινωνός
  choice: شريكًا
  rationale: يدل على من له نصيب في شيء ويشارك فيه؛ و«شريك» عربية طبيعية هنا ولا يلزم منها معنى تجاري.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: في المجد المزمع أن يُعلَن
  rationale: تحفظ الصياغة دلالة التوقع المستقبلي في μέλλω وصيغة المبني للمجهول في ἀποκαλύπτεσθαι، من غير تحديد موعد الإعلان.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: اللفظ العربي «المسيح» هو اللقب الكتابي المألوف، ويحمل معنى «الممسوح» من غير أن يعامَل بوصفه مجرد اسم شخصي.
- issue: قوة التعبير μελλούσης ἀποκαλύπτεσθαι
  choice: المزمع أن يُعلَن
  alternative: الذي سيُعلَن
  rationale: تحفظ «المزمع» نبرة التوقع الكامنة في اليونانية، من غير حسم النقاش حول مدى قرب الإعلان زمنيًا.
- issue: طبيعة شهادة الكاتب لآلام المسيح
  choice: شاهدًا لآلام المسيح
  alternative: مَن يشهد لآلام المسيح
  rationale: تُبقي «شاهدًا» الاحتمال قائمًا بين شاهد عيان ومن يؤدي شهادة، ولا تحسم ما لا يحسمه اللفظ اليوناني وحده.
translation_notes:
  register: الصياغة عربية فصحى معاصرة ذات نبرة رعوية مهيبة. استُعملت «الشيوخ» للمسؤولية الكنسية، و«شيخًا مثلهم» لتجنب مصطلح مذهبي تقني. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان مباشرة.
