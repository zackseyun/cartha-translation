  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: ar
  text: فإنه من الأفضل أن تتألّموا وأنتم تفعلون الخير[a]، إن شاءت مشيئة الله ذلك[b]، من أن تتألّموا وأنتم تفعلون الشر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تتألّموا بسبب فعل الخير... من أن تتألّموا بسبب فعل الشر». يمكن فهم اسمي الفاعل في اليونانية سببيًا («بسبب») أو على أنهما يصفان الحال («وأنتم»).'
    reason: lexical_alternative
  - marker: b
    text: 'تقول اليونانية حرفيًا: «إن شاءت مشيئة الله»، وهي صياغة توكيدية حُفظ تقاربها اللفظي هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: الأفضل
  rationale: اسم تفضيل يؤدي وظيفة خبرية بمعنى «من الأفضل»، وهو تعبير عربي طبيعي يحافظ على المقارنة.
- source_word: γὰρ
  choice: فـ
  rationale: تربط الآية بما قبلها على سبيل التعليل أو التفسير، والفاء تؤدي هذا الربط بإيجاز في العربية.
- source_word: ἀγαθοποιοῦντας
  choice: وأنتم تفعلون الخير
  rationale: اسم فاعل مضارع يقابل κακοποιοῦντας. تصوغه الجملة الحالية من غير حسم ما إذا كانت العلاقة سببية («بسبب فعل الخير») أو ظرفية («حال فعل الخير»).
- source_word: εἰ θέλοι
  choice: إن شاءت
  rationale: صيغة التمني مع أداة الشرط تفيد الاحتمال أو الشرط غير المقطوع به؛ و«إن شاءت» تحفظ هذا المعنى بصورة عربية سليمة.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: مشيئة الله
  rationale: تنقل الإضافة اليونانية بعبارة عربية مألوفة ورصينة، مع إبقاء الصلة اللفظية بالفعل «شاءت».
- source_word: πάσχειν
  choice: أن تتألّموا
  rationale: مصدر مكمّل للمقارنة، ويشير في السياق إلى وقوع الألم أو المعاناة على المخاطَبين.
- source_word: ἢ
  choice: من أن
  rationale: الصيغة العربية الطبيعية لإدخال الطرف الثاني بعد اسم التفضيل «الأفضل».
- source_word: κακοποιοῦντας
  choice: وأنتم تفعلون الشر
  rationale: يحافظ على التوازي مع «وأنتم تفعلون الخير» وعلى الدلالة الحالية للمشاركة من غير فرض علاقة سببية.
theological_decisions:
- issue: علاقة الألم بمشيئة الله
  choice: تذكر الآية على نحو شرطي أن التألم مع فعل الخير قد يقع وفق مشيئة الله، من غير تحديد كيفية السببية الإلهية.
  alternative: أن الله يقرّر حتمًا كل حالة من حالات الألم، أو أنه لا يفعل سوى السماح بها من غير أي صلة أخرى.
  rationale: العبارة εἰ θέλοι τὸ θέλημα τοῦ θεοῦ تربط الأمر بمشيئة الله ربطًا شرطيًا، لكنها لا تحسم الجدل الأوسع بين القضاء والإذن؛ لذلك تُترك المسألة على توترها النصي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت الجملة الحالية «وأنتم تفعلون» لصون غموض العلاقة في اسمي الفاعل، وحُفظ التقارب اللفظي بين «شاءت» و«مشيئة» لأنه مقصود في الأصل، مع إبقاء الشرط المحتمل من غير تقرير لاهوتي زائد.
