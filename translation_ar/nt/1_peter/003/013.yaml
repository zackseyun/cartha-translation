lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط محايدة تحفظ صلة السؤال بما سبقه من حثّ.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: من ذا الذي يؤذيكم
  rationale: صياغة عربية طبيعية تحفظ السؤال البلاغي ودلالة اسم الفاعل المستقبلية، ويؤدي «يؤذي» المعنى العام لإيقاع الضرر أو سوء المعاملة.
- source_word: ἐὰν
  choice: إن
  rationale: تلائم الشرط المحتمل مع صيغة الالتزام أو الصيرورة في الجملة التابعة.
- source_word: τοῦ ἀγαθοῦ
  choice: الخير
  rationale: ينقل الصفة المحايدة المستعملة اسميًا بوصفها مجال الغيرة والحرص.
- source_word: ζηλωταὶ γένησθε
  choice: صرتم غيورين على
  rationale: تحفظ البنية الاسمية وشدة الحماس، كما تنقل «صرتم» دلالة الصيرورة في γένησθε دون اختزالها إلى مجرد الكينونة.
theological_decisions:
- issue: قوة السؤال البلاغي وعلاقته بالتألم من أجل البر
  choice: الإبقاء على السؤال بوصفه تأكيدًا بلاغيًا عامًا من غير تحويله إلى وعد مطلق بعدم التعرض للأذى
  alternative: صياغة توحي بأن لا أحد يستطيع أن يلحق بالمؤمنين أي أذى على الإطلاق
  rationale: السياق اللاحق يقر بإمكان التألم بسبب فعل الخير؛ لذلك تُحفَظ المفارقة اللاهوتية ولا تُحسم بإضافة تفسير إلى النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «من ذا الذي» للمحافظة على قوة السؤال البلاغي، و«غيورين على الخير» لنقل حدة ζηλωταί، مع توضيح البديل الأيسر في الحاشية.
