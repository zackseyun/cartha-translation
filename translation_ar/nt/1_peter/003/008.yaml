lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: وأخيرًا
  rationale: تعبير انتقالي اصطلاحي يمهّد لخلاصة الوصايا؛ و«أخيرًا» طبيعية في العربية وتحافظ على وظيفته الخطابية، من غير حمله على معنى النهاية الزمنية الحرفية.
- source_word: πάντες
  choice: جميعًا
  rationale: تدل على توجيه الخطاب إلى الجماعة كلها، ويؤديها الظرف العربي بوضوح بعد فعل الأمر.
- source_word: ὁμόφρονες
  choice: متفقي الفكر
  rationale: تحافظ العبارة على معنى الاشتراك في التوجه الذهني والوحدة في النظرة، من غير أن تختزله في مجرد الانسجام العاطفي.
- source_word: συμπαθεῖς
  choice: متعاطفين
  rationale: تنقل معنى مشاركة الآخرين في مشاعرهم والتجاوب الوجداني معهم بلفظ عربي معاصر واضح.
- source_word: φιλάδελφοι
  choice: متحابين كالإخوة
  rationale: تحفظ صورة المحبة العائلية بين الإخوة، مع صياغة عربية طبيعية؛ ويُبيَّن في الحاشية أن الاستعمال يشمل جماعة المؤمنين كلها.
- source_word: εὔσπλαγχνοι
  choice: رقيقي القلوب
  rationale: تعبّر عن الحنان الداخلي والرحمة العميقة بعبارة عربية مفهومة وكريمة الأسلوب.
- source_word: ταπεινόφρονες
  choice: متواضعي الفكر
  rationale: تعكس معنى التواضع بوصفه توجهًا ذهنيًا وموقفًا داخليًا، وتحافظ على عنصر «الفكر» في اللفظة المركبة.
theological_decisions:
- issue: لغة القرابة المذكرة في φιλάδελφοι
  choice: متحابين كالإخوة
  alternative: متحابين بعضكم لبعض كالإخوة والأخوات
  rationale: أُبقيت صورة الإخوة الواردة في اللفظة اليونانية من غير توسيع داخل المتن، مع توضيح دلالتها الشاملة للرجال والنساء في جماعة المؤمنين بالحاشية.
- issue: القراءة النصية للصفة الأخيرة
  choice: 'ταπεινόφρονες: متواضعي الفكر'
  alternative: 'φιλόφρονες: لطفاء أو ودودين'
  rationale: يتبع المتن قراءة SBLGNT المثبتة في المصدر، بينما تُذكر القراءة المخطوطية البديلة في الحاشية دون إحلالها محل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وصائية كريمة. أُدخل فعل الأمر «كونوا» لأن الجملة اليونانية تسرد صفات خبرية مع فعل مفهوم من السياق، وهو لازم لسلاسة العربية. وحُفظ التوازي بين الصفات بصيغ جمع منصوبة متعاقبة.
