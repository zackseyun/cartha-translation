  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: ar
  text: بَلِ الإنسانُ الخفيُّ في القلب[a]، في زينةِ الروحِ الوديعةِ الهادئةِ التي لا تفنى[b][c]، وهي ثمينةٌ جدًّا أمام الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنسان القلب الخفي». والمقصود الإنسان الباطن؛ فاللفظة اليونانية هنا تعني الإنسان عمومًا، لا الرجل خاصةً.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «في غير الفاسد لروح وديعة هادئة». والتركيب اليوناني إضماري؛ أُضيفت كلمة «زينة» من المقابلة مع الزينة الخارجية في الآية السابقة.'
    reason: lexical_alternative
  - marker: c
    text: «الهادئة» هنا تصف طبعًا ساكنًا مسالمًا، ولا تعني بالضرورة الصمت.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: الإنسان الخفي في القلب
  rationale: ينقل «ἄνθρωπος» بمعناها الإنساني العام لا بمعنى الذكر، ويُبقي صورة الإنسان الخفي والقلب بدل اختزالها إلى «الذات الباطنة».
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: في زينة ... التي لا تفنى
  rationale: التركيب اليوناني موجز وفيه موصوف محذوف؛ أُضيفت «زينة» من المقابلة الصريحة مع الزينة الخارجية في الآية السابقة، مع بيان ذلك في الحاشية.
- source_word: πραέως
  choice: الوديع
  rationale: «وديع» مقابل عربي طبيعي ومألوف للصفة، ويدل على اللطف وضبط النفس من غير إيحاء بالضعف.
- source_word: ἡσυχίου
  choice: الهادئ
  rationale: ينقل معنى السكينة والمسالمة في الطبع، لا مجرد الامتناع عن الكلام.
- source_word: πνεύματος
  choice: الروح
  rationale: يحفظ اللفظ الأنثروبولوجي في الأصل، بدل تفسيره مباشرةً بأنه «الطبع» أو «السجية».
- source_word: ὅ ἐστιν
  choice: وهي
  rationale: أُعيد الضمير إلى «زينة» المضافة تفسيرًا، بما يحفظ الصلة بين الصفة الداخلية وقيمتها أمام الله.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: تعبير عربي موجز وأمين يدل على تقويم الله ونظره.
- source_word: πολυτελές
  choice: ثمينة جدًا
  rationale: ينقل معنى عظيم القيمة، ويلائم المقابلة مع الزينة الخارجية النفيسة أو المكلفة.
theological_decisions:
- issue: التعبير الأنثروبولوجي في سياق يخاطب النساء
  choice: ترجمة ἄνθρωπος بـ«الإنسان» في عبارة «الإنسان الخفي في القلب».
  alternative: الرجل الخفي في القلب؛ الذات الباطنة
  rationale: اللفظة هنا عامة وتشير إلى الإنسان الباطن، لا إلى الذكورة؛ و«الإنسان» يحفظ الصورة الأصلية من غير إحداث إحالة مضللة إلى رجل.
- issue: إكمال المحذوف بعد ἀφθάρτῳ
  choice: إضافة «زينة» في «زينة الروح ... التي لا تفنى».
  alternative: ما لا يفنى من الروح الوديع الهادئ؛ الصفة التي لا تفنى
  rationale: الأصل اليوناني يحتمل صياغة إضمارية، وسياق المقابلة مع الزينة الخارجية في الآية السابقة يرجح فهم الزينة الداخلية، مع إبقاء الإضافة معلنة في الحاشية حتى لا تُعرض كأنها لفظ صريح في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت الصورة اليونانية «الإنسان الخفي في القلب»، واستُعملت «زينة» لإظهار الإضمار السياقي، مع توثيقه في الحاشية. وُضعت علامات الحواشي في المتن بحسب مواضعها الدلالية.
