lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: إذ يرون
  rationale: ينقل معنى المعاينة والملاحظة المباشرة بصياغة عربية طبيعية، مع إبقاء الصلة السياقية بما قبله.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: سيرتكن الطاهرة
  rationale: «السيرة» تؤدي معنى السلوك ونمط العيش، و«الطاهرة» تقابل ἁγνή دون تضييقها إلى معنى واحد.
- source_word: ἐν φόβῳ
  choice: في خوف الله
  rationale: يحافظ على معنى الخوف الموقر في السياق؛ أُظهر متعلق الخوف بالعربية لتجنب فهمه على أنه خوف من الأزواج، مع الإقرار بأن لفظ «الله» غير مذكور صراحة في هذه العبارة اليونانية.
theological_decisions:
- issue: متعلق عبارة ἐν φόβῳ
  choice: في خوف الله
  alternative: في خوف / بخوف
  rationale: التركيب اليوناني لا يذكر متعلق الخوف صراحة، لكن سياق الرسالة، ولا سيما 1 بطرس 2:17، يرجح الخوف المتجه إلى الله. الإظهار بالعربية يمنع نسبة الخوف إلى الأزواج، لكنه يتضمن تفسيرًا سياقيًا محدودًا.
translation_notes:
  register: لغة عربية فصحى واضحة وموجزة. استُخدم ضمير جمع المؤنث لأن المخاطبات في السياق هن الزوجات، وصيغت العبارة بوصفها جزءًا تابعًا للآية السابقة.
