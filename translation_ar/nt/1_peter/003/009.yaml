reference: 1 Peter 3:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: ar
  text: لا تردّوا شرًّا بشرّ، ولا إهانةً بإهانة[a]، بل على العكس[b] بارِكوا، لأنكم دُعيتم إلى هذا[c]، لكي ترثوا بركة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شتيمةً بشتيمة». تدل الكلمة اليونانية على كلام جارح أو مهين.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بل بدلًا من ذلك». يشدد التعبير اليوناني على انقلاب السلوك إلى نقيض الانتقام.'
    reason: lexical_alternative
  - marker: c
    text: قد تشير «هذا» مباشرةً إلى مباركة من يسيء بدل الانتقام منه، وقد تشمل على نحو أوسع السلوك المذكور في السياق، أي احتمال الإساءة وعدم ردّها بالمثل.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: تردّوا
  rationale: ينقل معنى المعاملة بالمثل وردّ ما سبق أن فعله الآخر، وصيغة النهي العربية طبيعية في سياق الوصايا مع احتفاظها بالقوة الإرشادية لاسم الفاعل اليوناني المقترن بالنفي.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: شرًّا بشرّ
  rationale: يحفظ الثقل الأخلاقي لكلمة κακόν وبنية المقابلة الانتقامية التي تؤديها ἀντί.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: إهانةً بإهانة
  rationale: تعبير عربي واضح ومعاصر يدل على الكلام المهين أو المسيء، ويحافظ على التوازي مع «شرًّا بشرّ».
- source_word: τοὐναντίον δὲ
  choice: بل على العكس
  rationale: ينقل التحول القوي من ردّ الإساءة بالمثل إلى السلوك المضاد لها.
- source_word: εὐλογοῦντες
  choice: بارِكوا
  rationale: يحفظ اتساع الفعل بين قول الخير والدعاء بالخير، من غير إضافة مفعول به غير مصرّح به في اليونانية.
- source_word: ὅτι
  choice: لأنكم
  rationale: يبين العلاقة السببية بين الدعوة والوصية بوضوح في العربية الحديثة.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: دُعيتم إلى هذا
  rationale: يحافظ على المبني للمجهول في النص وعلى إمكان فهم «هذا» بوصفه إشارة إلى البركة بدل الانتقام أو إلى نمط السلوك المذكور في السياق الأوسع.
- source_word: ἵνα
  choice: لكي
  rationale: ينقل دلالة الغاية أو النتيجة المقصودة بصورة عربية طبيعية.
- source_word: εὐλογίαν
  choice: بركة
  rationale: صياغة عربية طبيعية بعد فعل «ترثوا»، وتبقي المعنى مفتوحًا على البركة التي ينالها المؤمنون من الله.
- source_word: κληρονομήσητε
  choice: ترثوا
  rationale: يحفظ صورة الميراث وما فيها من معنى نيل نصيب ممنوح للوارث، بدل اختزالها في مجرد الأخذ.
theological_decisions:
- issue: مرجع «هذا» في εἰς τοῦτο ἐκλήθητε
  choice: الإبقاء على العبارة «دُعيتم إلى هذا» دون تحديد مرجعها داخل النص
  alternative: التصريح بأن الدعوة هي إلى مباركة المسيئين، أو توسيعها لتشمل حياة الاحتمال وعدم الانتقام كلها
  rationale: يرجّح السياق القريب الإشارة إلى المباركة بدل الانتقام، لكن العبارة اليونانية تسمح بارتباط أوسع بالسلوك الموصوف في السياق؛ لذلك تُحفظ مساحة الدلالة ولا يُحسم ما لم يحسمه النص.
- issue: فاعل الدعوة في ἐκλήθητε
  choice: الإبقاء على المبني للمجهول «دُعيتم»
  alternative: «دعاكم الله»
  rationale: يُفهم الله عادةً فاعلًا للدعوة في هذا السياق، لكن النص لا يذكره صراحة، فالمبني للمجهول أدق وأقل تفسيرًا.
- issue: العلاقة التي تفيدها ἵνα بين الدعوة وميراث البركة
  choice: «لكي ترثوا بركة» بما يحتمل الغاية أو النتيجة المقصودة
  alternative: صياغتها بوصفها ضمانًا سببيًا مباشرًا أو مكافأة مكتسبة
  rationale: ἵνα تفيد الغاية أو النتيجة، ولا يقتضي النص أن البركة تُكتسب استحقاقًا بمجرد السلوك؛ لذا تجنبت الترجمة فرض تصور لاهوتي زائد.
translation_notes:
  register: العربية فصحى حديثة واضحة وذات نبرة كريمة. استُخدم النهي والأمر المباشران لأنهما طبيعيان في العربية الإرشادية، مع أن اليونانية تستعمل اسمَي فاعل لهما قوة الأمر في السياق. حُفظ الإيجاز والتوازي البلاغي في «شرًّا بشرّ» و«إهانةً بإهانة»، ولم يُضف مفعول صريح إلى «بارِكوا».
