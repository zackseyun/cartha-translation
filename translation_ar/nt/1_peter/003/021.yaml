translation:
  language: ar
  text: نظير ذلك، تخلّصكم المعمودية الآن أيضًا، لا بإزالة وسخٍ عن الجسد، بل بالتماسٍ موجَّه إلى الله من أجل ضمير صالح[a]، بقيامة يسوع المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل تعهُّدٍ يتعلق بضمير صالح تجاه الله». ويمكن أيضًا أن تحمل الكلمة اليونانية معنى «جواب».'
    reason: تحفظ الحاشية الدلالات البديلة الحقيقية للفظة ἐπερώτημα، مع عدم الجزم بعلاقة «الضمير الصالح» المتنازع عليها.
lexical_decisions:
- source_word: ἀντίτυπον
  choice: يرمز إلى
  rationale: تعبّر العبارة عن علاقة المطابقة الرمزية بين ماء الطوفان والمعمودية، بصياغة عربية واضحة من غير استعمال مصطلح تقني غامض.
- source_word: σῴζει
  choice: تخلّصكم
  rationale: يحافظ المضارع العربي على تصريح النص المباشر بأن المعمودية تخلّص، من غير تخفيف أو توسّع مذهبي.
- source_word: βάπτισμα
  choice: المعمودية
  rationale: هو المقابل العربي المعياري، والسياق يميّزها صراحة من مجرد التنظيف الجسدي.
- source_word: σαρκὸς
  choice: الجسد
  rationale: في هذا السياق الحسي تشير الكلمة إلى البدن الذي يعلق به الوسخ؛ و«الجسد» أفصح وأطبع عربيًا هنا.
- source_word: ἀπόθεσις ῥύπου
  choice: إزالة وسخ
  rationale: صياغة طبيعية واضحة تدل على التنظيف الخارجي المادي.
- source_word: συνειδήσεως ἀγαθῆς
  choice: ضمير صالح
  rationale: تحافظ على تركيب النص المكثف من غير حسم زائد لعلاقة المضاف إليه بـ«التماس».
- source_word: ἐπερώτημα
  choice: التماس
  rationale: تلائم اتجاه الالتماس إلى الله، وتبقي معنى الطلب في المتن، مع إثبات معنى «التعهّد» المحتمل في الحاشية.
- source_word: εἰς θεόν
  choice: من الله
  rationale: مع فهم ἐπερώτημα طلبًا لضمير صالح، تؤدي العربية الطبيعية المعنى المقصود بوصف الله جهة الالتماس؛ وتوضح الحاشية إمكان فهم العبارة على نحو آخر.
- source_word: δι’ ἀναστάσεως
  choice: وذلك بقيامة
  rationale: تفيد الباء الوسيلة أو الواسطة التي تفيدها διά مع المضاف إليه، و«وذلك» يوضح تعلّق العبارة بما سبق.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحافظ على دلالته المسيانية.
theological_decisions:
- issue: علاقة المعمودية بالخلاص
  choice: الإبقاء على القول المباشر «المعمودية التي تخلّصكم الآن أيضًا»، مع ترك قيد بطرس اللاحق يبين معناه.
  alternative: تخفيف العبارة إلى أن المعمودية ترمز إلى الخلاص، أو توسيعها بما يفرض لاهوتًا طائفيًا محددًا.
  rationale: ينسب النص الخلاص إلى المعمودية مباشرة، ثم ينفي أن يكون المقصود مجرد تنظيف خارجي ويربط الأمر بالضمير أمام الله وبقيامة يسوع المسيح.
- issue: معنى ἐπερώτημα في سياق المعمودية
  choice: ترجمتها «التماس» في المتن، مع ذكر «تعهّد» و«جواب» في الحاشية.
  alternative: تعهّد أو جواب.
  rationale: اللفظة موضع خلاف حقيقي؛ و«التماس» ينسجم مع توجيه الأمر إلى الله، بينما تُحفظ البدائل المهمة للقارئ من غير حسم مصطنع.
- issue: مرجع ὃ وعلاقة ἀντίτυπον بما قبله
  choice: التصريح بـ«هذا الماء» وربطه بالمعمودية بوصفه رمزًا مطابقًا لها.
  alternative: «والمعمودية، نظير ذلك، تخلّصكم» أو استعمال «المثال المضاد».
  rationale: الضمير المحايد يرجع طبيعيًا إلى الماء المذكور في الآية السابقة، والتصريح به يحقق الترابط في العربية من غير استيراد اصطلاح لاهوتي تقني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «المعمودية» و«المسيح» بصيغتيهما العربيتين الراسختين، مع تجنب المصطلحات التقنية الغامضة والإضافات المذهبية.
