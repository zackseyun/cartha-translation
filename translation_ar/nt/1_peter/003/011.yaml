base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: ar
  text: فليبتعد عن الشر وليفعل الخير[a]، وليطلب السلام وليسعَ إليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فليبتعد الإنسان عن الشر وليفعل الخير؛ وليطلب السلام وليسعَ إليه». تستعمل اليونانية صيغة المذكر المفرد بمعنى تمثيلي عام.'
    reason: بيان البديل اللفظي والقوة العامة لصيغة المذكر المفرد.
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: ليَحِدْ
  rationale: يحفظ معنى التحول والانصراف المقصود عن طريق الشر، ويؤدي قوة صيغة الأمر للغائب المفرد.
- source_word: δὲ
  choice: بل
  rationale: تفيد انتقالًا ذا مقابلة خفيفة مع السياق السابق، وهو الأنسب هنا في سياق الاقتباس الوعظي.
- source_word: ἀπὸ κακοῦ
  choice: عن الشر
  rationale: المعنى أخلاقي في مقابل الخير، لا الضرر أو المصيبة.
- source_word: ποιησάτω ἀγαθόν
  choice: وليفعل الخير
  rationale: تعبير عربي واضح يحفظ الأمر بالعمل الإيجابي، لا بمجرد اتصاف المرء بالصلاح.
- source_word: ζητησάτω
  choice: وليطلب
  rationale: يحفظ معنى السعي إلى العثور على السلام أو تحقيقه، مع إبقاء التدرج الدلالي قبل الفعل الأقوى διωξάτω.
- source_word: εἰρήνην
  choice: السلام
  rationale: المقابل العربي المألوف والواسع الدلالة، ويمكن أن يشمل المسالمة والوفاق دون حصر المعنى فيهما.
- source_word: διωξάτω αὐτήν
  choice: وليسعَ في أثره
  rationale: ينقل قوة الملاحقة الجادة، ويعود الضمير بوضوح إلى السلام، من غير استعمال لفظ قد يوحي بالاضطهاد في العربية.
- source_word: ἐκκλινάτω … ποιησάτω … ζητησάτω … διωξάτω
  choice: ليَحِدْ … وليفعل … وليطلب … وليسعَ
  rationale: تحافظ صيغ الأمر للغائب المفرد على البنية النحوية والإيقاع المتتابع في اليونانية.
theological_decisions:
- issue: القوة التمثيلية لصيغ المذكر المفرد في الاقتباس
  choice: الإبقاء على صيغ الغائب المذكر المفرد في المتن
  alternative: أن يُصرَّح بلفظ «الإنسان»، أو تُستعمل صيغة الجمع
  rationale: اليونانية تستعمل المفرد المذكر بقوة تمثيلية عامة؛ وصيغة العربية المذكرة المفردة تحافظ على شكل المصدر من غير أن تقصر الوصية على الرجال.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حوفظ على تتابع الأوامر وإيجاز الاقتباس، واستُعمل «يسعَ في أثره» لإبراز الانتقال من طلب السلام إلى ملاحقته بجد.
