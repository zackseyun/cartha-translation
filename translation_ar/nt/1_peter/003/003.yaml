review_pass:
  verdict: revise
  source_fidelity: 'المتن يحفظ المعنى الأساسي: النهي عن أن تكون الزينة هي الزينة الخارجية، مع تعداد ضفر الشعر وحلي الذهب ولبس الثياب. لكن صياغة «هي الزينة الخارجية، من...» ثقيلة نحويًا ودلاليًا؛ فـ«من» لا تربط التعداد بوضوح بما قبله. كما أن استبدال ἢ بـ«و» في العنصر الأخير لا يحافظ على أداة العطف الواردة في الأصل، ويمكن نقلها طبيعيًا بـ«أو».'
  naturalness: «ولا تكن زينتكن الزينة الخارجية المتمثلة في...» صياغة فصيحة حديثة، أوضح وأشد سلاسة، وتحافظ على بنية الجملة غير المكتملة عمدًا إلى الآية التالية. و«حُلِيّ من الذهب» تعبير طبيعي يعبّر عن قطع الذهب لا عن الذهب المجرد.
  terminology: «الزينة الخارجية» مناسبة لـὁ ἔξωθεν ... κόσμος، و«ضفر الشعر» و«لبس الثياب» مناسبان. ينبغي أن تبقى الحاشية تفسيرية لا أن تجعل «فحسب» جزءًا غير معلَّم من النص؛ ويمكنها بيان أن الفهم المقارن مستفاد من السياق لا من لفظ يوناني صريح.
  issues:
