  - severity: low
    issue: عدم نقل «ἢ» في العنصر الأخير
    rationale: الأصل اليوناني يستعمل «أو» قبل «لبس الثياب». ورغم إمكان الواو في القوائم العربية، فإن «أو» هنا متاحة وطبيعية وتحافظ على الصياغة المصدرية للأصل.
