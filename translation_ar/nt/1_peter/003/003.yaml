  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: ar
  text: ولا تكن زينتكن الزينةَ الخارجيةَ المتمثلةَ في ضفر الشعر[a]، والتحلّي بحُلِيّ من الذهب، أو لبس الثياب،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يجوز فهم النهي، في ضوء المقابلة في الآية التالية، على أنه نهي عن اقتصار الزينة على المظهر الخارجي: «لا تكن زينتكن مقتصرة على الزينة الخارجية...». ولا ترد في اليونانية كلمة صريحة بمعنى «فحسب» أو «مقتصرة»؛ فالسياق يبرز أولوية الإنسان الباطن على المظهر الخارجي، ولا يقتضي بالضرورة تحريم كل عناية بالشعر أو كل حُلِيّ أو لباس.'
    reason: قراءة بديلة توضّح الفهم المقارن المستفاد من السياق، مع التنبيه إلى أن القيد ليس لفظًا صريحًا في الأصل.
lexical_decisions:
- source_word: ὧν
  choice: زينتكن
  rationale: الضمير الموصول في صيغة المضاف إليه يعود إلى النساء المخاطبات في الآية السابقة؛ وصيغة المخاطب المؤنث الجمع طبيعية في العربية وتحفظ معنى الملكية.
- source_word: ἔστω οὐχ
  choice: ولا تكن
  rationale: تنقل صيغة الأمر للغائب المنفية بأسلوب عربي فصيح مباشر، مع إبقاء القوة الحثية للنص.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: الزينة الخارجية
  rationale: κόσμος هنا بمعنى الزينة أو التزيّن لا «العالم»، وἔξωθεν يحددها بأنها ظاهرة خارجية، تمهيدًا للمقابلة مع الإنسان الباطن في الآية التالية.
- source_word: ἐμπλοκῆς τριχῶν
  choice: ضفر الشعر
  rationale: ينقل اسم الحدث ἐμπλοκή بعبارة عربية مألوفة، ويحافظ على كونه أحد أوجه التزيّن الخارجي المذكورة.
- source_word: περιθέσεως χρυσίων
  choice: التحلي بحليّ الذهب
  rationale: περίθεσις يدل على وضع الشيء حول الجسد أو ارتدائه، وχρυσίων يشير إلى قطع أو حلي من الذهب؛ والصياغة واضحة وطبيعية بالعربية المعاصرة.
- source_word: ἢ ἐνδύσεως ἱματίων
  choice: ولبس الثياب
  rationale: ينقل العبارة المصدرية الموازية بوضوح. استُعملت الواو في تعداد عربي متعاطف، مع أن اليونانية تستعمل ἢ قبل العنصر الأخير، لأن المقصود سرد صور الزينة الخارجية لا إقامة بدائل متعارضة.
theological_decisions:
- issue: هل النهي منع مطلق لضفر الشعر والحلي والثياب، أم تقديم للزينة الباطنة على المظهر الخارجي؟
  choice: أُبقي النهي في المتن بصورته المباشرة، مع بيان القراءة السياقية المقارِنة في الحاشية.
  alternative: 'إدخال «فحسب» في المتن لجعل المعنى صراحةً: لا تكن الزينة خارجية فقط.'
  rationale: لا ترد في اليونانية كلمة صريحة تقابل «فحسب»، ولذلك لا ينبغي إضافتها بلا تنبيه. وفي الوقت نفسه، تقابل الآية التالية الزينة الخارجية بالإنسان الباطن، كما أن عدّ لبس الثياب نفسه ضمن القائمة يجعل فهم النهي كتحريم حرفي مطلق أمرًا إشكاليًا. تحفظ الحاشية هذا التوتر من غير فرض حل مذهبي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل خطاب المؤنث الجمع اتساقًا مع المخاطبات في السياق، وحوفظ على التوازي بين صور الزينة الثلاث. تنتهي العبارة بفاصلة لأن تركيب الجملة يكتمل بالمقابلة في الآية التالية.
