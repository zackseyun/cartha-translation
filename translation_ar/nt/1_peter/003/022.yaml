source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: ar
  text: الذي هو عن يمين الله، وقد مضى إلى السماء[a]، وأُخضعت له الملائكة والسلطات والقوى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى داخل السماء»؛ فحرف الجر اليوناني يدل على الحركة إلى الداخل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς
  choice: الذي
  rationale: اسم موصول يعود إلى يسوع المسيح المذكور في الآية السابقة، ويحافظ على اتصال الجملة بسياقها من غير إضافة توكيد.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: عن يمين الله
  rationale: تعبير عربي كتابي طبيعي يحفظ الصورة المكانية والعلاقية الدالة على مقام الرفعة والكرامة، من غير اختزالها في تفسير معنوي.
- source_word: πορευθεὶς
  choice: وقد مضى
  rationale: ينقل اسم الفاعل اليوناني الدال على فعل سابق، بصياغة عربية واضحة تحافظ على ارتباطه بالفعل الرئيس.
- source_word: εἰς οὐρανόν
  choice: إلى السماء
  rationale: صياغة عربية طبيعية للحركة باتجاه السماء، مع بيان الدلالة الأدق لحرف الجر في الحاشية.
- source_word: ὑποταγέντων
  choice: أُخضعت
  rationale: يحفظ البناء للمجهول ودلالة إخضاع الكائنات المذكورة للمسيح، وتؤدي الواو المصاحبة وظيفة التركيب اليوناني بصورة عربية سليمة.
- source_word: αὐτῷ
  choice: له
  rationale: اللام تبين بوضوح الشخص الذي أُخضعت له الكائنات والقوى.
- source_word: ἀγγέλων
  choice: الملائكة
  rationale: السياق المتعلق بالسماء والقوى الكونية يدل على الكائنات الملائكية لا الرسل البشريين.
- source_word: ἐξουσιῶν
  choice: السلطات
  rationale: يحفظ معنى أصحاب السلطان أو الرتب الكونية، ويميز اللفظة عن δυνάμεων التالية.
- source_word: δυνάμεων
  choice: القوى
  rationale: مقابل موجز وطبيعي في سياق مراتب أو قوى كونية، مع إبقاء التمييز بينها وبين «السلطات».
theological_decisions:
- issue: طبيعة رفعة المسيح عن يمين الله
  choice: الإبقاء على التعبير الكتابي «عن يمين الله»
  alternative: في مقام أسمى كرامة بجوار الله
  rationale: يحمل الأصل صورة مكانية وعلاقية ذات دلالة لاهوتية، وترجمتها بتعبير تفسيري محض تحسم ما أبقاه النص في صورة كتابية غنية.
- issue: هوية «الملائكة والسلطات والقوى»
  choice: الإبقاء على القائمة العامة من الكائنات أو القوى السماوية والكونية
  alternative: تحديدها بأنها ملائكة صالحة فقط، أو قوى روحية معادية فقط
  rationale: لا يصنف النص هذه الفئات أخلاقيًا، لذلك لا ينبغي للترجمة أن تفرض عليها تحديدًا عقائديًا أضيق.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات وقار كتابي. حُفظت صورة «عن يمين الله» والبناء للمجهول في «أُخضعت»، مع تجنب تحديد الطبيعة الأخلاقية للسلطات والقوى.
