revisions:
- from: لأن من يريد أن يحب الحياة ويرى أيامًا صالحة، فليكفف لسانه عن الشر وشفتيه عن التكلم بالغش[a].
  to: لأن من يريد أن يحب الحياة ويرى أيامًا صالحة، فليكفف لسانه عن الشر، وليمنع شفتيه من النطق بالخداع[a].
  rationale: تُصلح المراجعة التوازي النحوي بين كف اللسان ومنع الشفتين من النطق، مع المحافظة على قوة الأمر وعلى ترتيب الصور في النص اليوناني. كما يُستعمل «الخداع» في المتن لاتساعه الدلالي، وتُحفظ البدائل المعجمية في الحاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:16:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: «من يريد»، ومحبة الحياة، ورؤية الأيام الصالحة، وكف اللسان عن الشر. لكن «فليكفف ... وشفتيه» تترك الشفتين بلا فعل محكَم في العربية، ولا تعبّر بوضوح عن منع الشفتين من النطق بالخداع.'
  naturalness: 'الأسلوب فصيح وواضح إجمالًا. وتحتاج الجملة الأخيرة إلى إعادة ترتيب يسيرة لتكون طبيعية وموازية في العربية: «وليمنع شفتيه من النطق بالغش».'
  terminology: «الغش» ممكن، لكنه قد يُفهم في الاستعمال المعاصر على أنه الغش في المعاملات خصوصًا. «الخداع» أوسع وأقرب إلى δόλος في هذا السياق، مع إبقاء «الغش» بديلًا في الحاشية. «أيامًا صالحة» سليمة وتحفظ سعة ἀγαθάς.
  issues:
  - severity: medium
    issue: اختلال التوازي التركيبي في «فليكفف لسانه عن الشر وشفتيه عن التكلم بالغش».
    rationale: الفعل «يكفّ» يتعدى هنا إلى «لسانه»، أما عطف «شفتيه» فلا يستقيم معه التركيب نفسه بوضوح؛ فالشفتان لا تُكفّان «عن التكلم» إلا بتقدير فعل أو بناء مختلف. والأصل اليوناني يورد أمرًا واحدًا يتبعه مفعولان مع عبارتي منع متوازيتين.
  - severity: low
    issue: اختيار «الغش» في المتن أضيق أو أكثر تخصصًا في التداول الحديث من δόλος.
    rationale: δóλος يشمل الخداع والمكر والتضليل، لا الغش في المعاملات فحسب. «الخداع» يحافظ على السعة بصورة أوضح، ويمكن ذكر «الغش» بديلًا معجميًا.
  revised_text: لأن من يريد أن يحب الحياة ويرى أيامًا صالحة، فليكفف لسانه عن الشر، وليمنع شفتيه من النطق بالخداع[a].
