    text: 'أو: «بالغش» أو «بالمكر». يمكن أن تدل الكلمة اليونانية على الخداع أو الغش أو المكر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: من يريد
  rationale: تركيب عربي طبيعي يؤدي معنى اسم الفاعل المعرّف المستعمل استعمالًا اسميًا للدلالة العامة على أي شخص، من غير تخصيص بالجنس.
- source_word: γὰρ
  choice: لأن
  rationale: تربط الآية بما قبلها بوصفها تعليلًا أو سندًا كتابيًا للوصية السابقة.
- source_word: ζωὴν ἀγαπᾶν
  choice: أن يحب الحياة
  rationale: ينقل العبارة اليونانية مباشرة من غير إضافة ضمير ملكية غير موجود في الأصل.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: ويرى أيامًا صالحة
  rationale: يحافظ على الصورة الحسية في فعل «يرى»، وعلى سعة معنى ἀγαθός من غير قصره على الرخاء المادي.
- source_word: παυσάτω
  choice: فليكفف
  rationale: صيغة أمر عربية تؤدي قوة الأمر اليوناني، وتنسجم مع المفعولين «لسانه» و«شفتيه» ومع حرف الجر «عن».
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: لسانه عن الشر
  rationale: إضافة اللسان إلى الشخص طبيعية في العربية، و«الشر» تحفظ عموم التعبير اليوناني.
- source_word: χείλη
  choice: شفتيه
  rationale: يحافظ على صورة الشفتين في صيغة المثنى العربية الطبيعية، مع إضمار الملكية المفهومة من السياق.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: عن التكلم بالغش
  rationale: ينقل معنى المنع أو الكف في المصدر المنفي بعد فعل الكف؛ و«الغش» لفظ واضح معاصر يشمل الخداع وعدم الصدق.
theological_decisions:
- issue: الدلالة العامة للمفرد وجنس المشار إليه
  choice: استعمال «من يريد» مع الضمائر المذكرة المفردة التي تقتضيها العربية في صلة «مَن»
  alternative: صياغة جمع محايدة مثل «الذين يريدون... فليكفوا ألسنتهم»
  rationale: تحفظ الصياغة عدد المفرد التمثيلي في اليونانية، ولا تجعل المقصود مقصورًا على الذكور؛ فالتذكير هنا هو الاستعمال النحوي العام في العربية.
- issue: طبيعة «الأيام الصالحة»
  choice: الإبقاء على العبارة العامة «أيامًا صالحة»
  alternative: تفسيرها بـ«أيام رخاء» أو «حياة سعيدة»
  rationale: النص لا يحصر الخير في الازدهار المادي، ولا يحدد بدقة نوع الاختبار الجيد؛ لذلك تُحفظ سعته الدلالية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة الأمر «فليكفف» للمحافظة على قوة الوصية، مع إبقاء الصور الأصلية: محبة الحياة، ورؤية الأيام الصالحة، وكف اللسان والشفتين.'
