id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: ar
  text: وكذلك أنتم أيها الأزواج، عيشوا مع زوجاتكم بمعرفة[a]، وأعطوا المرأة كرامة باعتبارها إناءً أضعف[b]، وباعتبارهن أيضًا وارثات معكم لنعمة الحياة[c]، لكيلا تُعاق صلواتكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عيشوا معهن بتفهُّم».'
    reason: lexical_alternative
  - marker: b
    text: «إناء أضعف» استعارة قد تشير إلى ضعف جسدي نسبي أو إلى هشاشة اجتماعية، لا إلى نقص في القيمة؛ فالعبارة التالية تؤكد أن الزوجات أيضًا وارثات مع أزواجهن لنعمة الحياة.
    reason: cultural_note
  - marker: c
    text: 'أو: «شريكات في ميراث نعمة الحياة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: أيها الأزواج
  rationale: يشير السياق المنزلي، بعد خطاب الزوجات في 3:1، إلى الأزواج لا إلى الرجال عمومًا.
- source_word: ὁμοίως
  choice: وكذلك
  rationale: تحفظ الصلة الخطابية والمقارنة مع الوصايا السابقة.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: عيشوا مع زوجاتكم عن معرفة
  rationale: تعبير عربي واضح يحفظ معنى الحياة الزوجية المشتركة واتساع عبارة «بحسب معرفة» دون حصرها في التعاطف وحده.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: المرأة ... إناءً أضعف
  rationale: يحفظ الاستعارة وصيغة المقارنة، من غير أن يضيف إلى النص تحديدًا لطبيعة الضعف أو حكمًا بنقص القيمة.
- source_word: ἀπονέμοντες τιμήν
  choice: وأعطوا ... كرامة
  rationale: ينقل معنى منح الكرامة وإيلائها لمن تستحقها بصياغة عربية طبيعية.
- source_word: συγκληρονόμοις
  choice: شريكات في الميراث
  rationale: يعبّر بوضوح عن الاشتراك في الإرث، مع مطابقة المرجع المؤنث في السياق.
- source_word: χάριτος ζωῆς
  choice: نعمة الحياة
  rationale: يحفظ تركيب الإضافة واتساعه، سواء فُهمت النعمة على أنها الحياة أو النعمة المانحة للحياة.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: لكيلا تُعاق صلواتكم
  rationale: ينقل الغاية أو النتيجة ويحفظ المبني للمجهول بإيجاز طبيعي.
theological_decisions:
- issue: معنى «إناء أضعف»
  choice: الإبقاء على الوصف المقارن والاستعارة مع شرح أنه لا يدل بذاته على نقص الكرامة أو المنزلة الروحية.
  alternative: تفسيره في المتن بأنه ضعف جسدي أو هشاشة اجتماعية محددة.
  rationale: النص لا يحدد نوع الضعف، ويوازن العبارة بالأمر بإعطاء الكرامة وبالتأكيد أن الزوجات شريكات في الميراث؛ لذلك لا ينبغي حسم الاستعارة داخل المتن.
- issue: مرجع الاشتراك في الميراث
  choice: الزوجات شريكات مع الأزواج في ميراث نعمة الحياة.
  alternative: قصر العبارة صراحة على الحياة الأبدية أو على هبة الحياة الحاضرة.
  rationale: يحفظ النص المساواة في الاشتراك بالميراث من غير تضييق مدلول «نعمة الحياة» إلى تفسير واحد.
- issue: دلالة ὡς καὶ قبل συγκληρονόμοις
  choice: «وباعتبارهن أيضًا» لا «لأنهن أيضًا».
  alternative: 'صياغة العلاقة بصيغة سببية صريحة: «لأنهن أيضًا».'
  rationale: تحفظ قوة ὡς καὶ ولا تضيف سببية صريحة غير محسومة في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الأزواج» و«زوجاتكم» لإظهار السياق الزوجي، مع إبقاء الاستعارة «إناءً أضعف» والتراكيب اللاهوتية المفتوحة دون تسويتها تفسيريًا.
