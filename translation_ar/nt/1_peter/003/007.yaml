- from: وكذلك أنتم أيها الأزواج، عيشوا مع زوجاتكم عن معرفة[a]، وأعطوا المرأة كرامة باعتبارها إناءً أضعف[b]، وباعتبارهن أيضًا شريكات في ميراث نعمة الحياة[c]، لكيلا تُعاق صلواتكم.
  to: وكذلك أنتم أيها الأزواج، عيشوا مع زوجاتكم بمعرفة[a]، وأعطوا المرأة كرامة باعتبارها إناءً أضعف[b]، وباعتبارهن أيضًا وارثات معكم لنعمة الحياة[c]، لكيلا تُعاق صلواتكم.
  rationale: عُدِّلت «عن معرفة» إلى «بمعرفة» لتحسين السلاسة مع حفظ اتساع العبارة اليونانية، وعُدِّلت «شريكات في ميراث» في المتن إلى «وارثات معكم» لإبراز معنى συγκληρονόμοις بدقة. وحُدِّثت الحاشيتان المتصلتان لتتوافقا مع نص المتن الجديد، مع الإبقاء على الغموض المشروع في طبيعة «الضعف» وفي مدلول «نعمة الحياة».
