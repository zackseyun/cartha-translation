  naturalness: الصياغة عربية فصحى مفهومة ووقورة. «عن معرفة» مفهومة لكنها أقل سلاسة في هذا الموضع من «بمعرفة»، مع بقاء العبارة موجزة وغير مفسِّرة أكثر من الأصل.
