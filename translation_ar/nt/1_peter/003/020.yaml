source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: ar
  text: الذين عصوا من قبل، حين كانت أناة الله تنتظر في أيام نوح، إذ كان الفلك يُهَيَّأ، دخل الفلكَ قليلون، أي ثمانية أشخاص[a]، ونجوا عبر الماء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثمانية أنفس».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أُنقذوا عبر الماء».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: عصوا
  rationale: ينقل معنى الامتناع عن الطاعة أو العصيان، من غير حصره في عدم التصديق الذهني.
- source_word: ποτε
  choice: قديمًا
  rationale: يشير إلى زمن ماضٍ بالنسبة إلى سياق الكلام، وهو تعبير عربي واضح وموجز.
- source_word: ἀπεξεδέχετο
  choice: كانت ... تنتظر
  rationale: صيغة الماضي الناقص تدل على انتظار مستمر، وأُبقي فاعل الفعل كما في اليونانية، أي أناة الله.
- source_word: μακροθυμία
  choice: أناة
  rationale: تعبّر عن طول صبر الله وإمهاله قبل الدينونة، بلغة عربية كتابية مفهومة غير متكلفة.
- source_word: κατασκευαζομένης
  choice: كان ... يُهَيَّأ
  rationale: يحفظ المعنى الأوسع للإعداد والتجهيز، من غير قصره على عملية البناء وحدها.
- source_word: κιβωτοῦ
  choice: الفلك
  rationale: هو اللفظ العربي الراسخ لسفينة نوح، ويؤدي المعنى بوضوح في هذا السياق.
- source_word: εἰς ἣν
  choice: فدخله
  rationale: يحفظ دلالة الحركة إلى داخل الفلك التي تحملها εἰς، بدل الاكتفاء بالدلالة على الوجود فيه.
- source_word: ὀλίγοι
  choice: قليلون
  rationale: ينقل التشديد على قلة عدد الناجين.
- source_word: ψυχαί
  choice: أشخاص
  rationale: ψυχή هنا تُستعمل في عدّ البشر، و«أشخاص» أوضح في العربية الحديثة ولا تفترض تمييزًا أنثروبولوجيًا مقصودًا.
- source_word: διεσώθησαν
  choice: عبروا ... سالمين
  rationale: يبرز معنى الوصول بسلام عبر الخطر، مع إبقاء معنى «أُنقذوا» في الحاشية لما له من أهمية تفسيرية.
- source_word: δι’ ὕδατος
  choice: عبروا الماء
  rationale: يحفظ صورة المرور وسط مياه الطوفان، مع عدم حسم ما إذا كانت διά تُفهم هنا على جهة العبور أو الوسيلة.
theological_decisions:
- issue: الدلالة الخلاصية المحتملة للفعل διεσώθησαν
  choice: عبروا الماء سالمين
  alternative: أُنقذوا عبر الماء
  rationale: الصياغة المختارة تصف النجاة الفعلية من الطوفان وتبرز العبور الآمن، من غير أن تفرض مسبقًا دلالة خلاصية اصطلاحية؛ وتُحفظ الصياغة البديلة في الحاشية لأن الفعل اليوناني يحتملها ولصلتها بما يلي عن المعمودية.
- issue: ترجمة ψυχαί
  choice: أشخاص
  alternative: أنفس
  rationale: المقصود عدّ البشر الذين كانوا في الفلك، لا تقرير تعليم تقني عن النفس؛ لذلك «أشخاص» أوضح، مع حفظ اللفظ الأقرب حرفيًا في الحاشية.
- issue: إسناد الانتظار في عبارة ἡ τοῦ θεοῦ μακροθυμία ... ἀπεξεδέχετο
  choice: كانت أناة الله تنتظر
  alternative: كان الله ينتظر بأناة
  rationale: أُبقي التركيب المجازي اليوناني الذي يجعل أناة الله فاعل الانتظار، حفاظًا على صورة النص وعدم تسويتها تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل «الفلك» لرسوخه في قصة نوح، وحُفظت استمرارية الأفعال في الماضي، كما وُضعت علامتا الحاشية عند اللفظين اللذين تخصهما الحاشيتان فعلًا.
