revisions:
- from: الذين عصوا قديمًا، حين كانت أناة الله تنتظر في أيام نوح، بينما كان الفلك يُهَيَّأ؛ فدخله قليلون، أي ثمانية أشخاص[a]، وعبروا الماء سالمين[b].
  to: الذين عصوا من قبل، حين كانت أناة الله تنتظر في أيام نوح، إذ كان الفلك يُهَيَّأ، دخل الفلكَ قليلون، أي ثمانية أشخاص[a]، ونجوا عبر الماء[b].
  rationale: 'التعديل محدود لتحسين الوضوح النحوي والدقة الأسلوبية: حُوِّل «فدخله» إلى «دخل الفلكَ» لتفادي مرجع ضمير محتمل الالتباس، واستُعمل «ونجوا عبر الماء» ليعكس فعل النجاة في النص المصدر مع المحافظة على دلالة الدخول إلى الفلك. الحواشي مثبتة عند الألفاظ التي تشرحها.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:16:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'المسودة تنقل عناصر النص اليوناني الرئيسة بدقة جيدة: عصيان الناس في الماضي، انتظار أناة الله المستمر في أيام نوح، إعداد الفلك، قلة العدد (ثمانية)، والنجاة المرتبطة بالماء. لكن تركيب «كان الفلك يُهَيَّأ؛ فدخله قليلون ... وعبروا الماء سالمين» يجعل الفاء وتتابع الأفعال يوحيان بأن الدخول والعبور فعلان مستقلان متعاقبان، في حين أن اليونانية تصف دخول القلة إلى الفلك ونجاتهم عبر الماء في بناء واحد. الصياغة المقترحة أوضح وتحافظ على دلالة εἰς («دخل الفلك») وعلى معنى διασῴζω («نجوا») دون تحميل العبارة معنى مذهبيًا.'
  naturalness: «أناة الله» و«الفلك» فصيحان طبيعيان في عربية حديثة ذات سجل كتابي وقور. تُستبدل الصياغة ذات الفاصلة المنقوطة بتركيب أكثر سلاسة وأقل التباسًا في إسناد «فدخله».
  terminology: «عصوا»، «أناة الله»، «الفلك»، و«أشخاص» مناسبة. وتبقى «أنفس» بديلًا حرفيًا مفيدًا في الحاشية. و«نجوا عبر الماء» أقرب إلى الفعل المبني للمجهول διεσώθησαν من «عبروا الماء سالمين»، مع بقاء البديل «أُنقذوا» في الحاشية.
  issues:
  - severity: medium
    issue: التتابع «فدخله ... وعبروا الماء سالمين» يفكك العلاقة النحوية بين الدخول إلى الفلك والنجاة عبر الماء.
    rationale: النص اليوناني يربط «إلى الفلك» مباشرة بالقلة التي «نُجّيت عبر الماء». إعادة الصياغة بـ«دخل الفلكَ قليلون ... ونجوا عبر الماء» تُظهر الحركة إلى الداخل والنجاة من دون جعل عبور الماء فعلًا مستقلاً على نحو قد يوحي بأنهم عبروا المياه بأنفسهم.
