source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: ar
  text: كما أطاعت سارة إبراهيم، وكانت تدعوه «سيدي». وقد صرتنَّ بناتها إن كنتنَّ تفعلن الخير ولا تخفن أيَّ ترهيب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيَّ رعب»، أو «أيَّ شيء مخيف».
    reason: بدائل معجمية تحفظ سعة دلالة πτόησις بين الخوف الشديد وما يسببه.
lexical_decisions:
- source_word: ὡς
  choice: كما
  rationale: تفيد المقارنة وتقدّم سارة مثالًا موازيًا لما سبق، وهي صياغة عربية طبيعية ومباشرة.
- source_word: ὑπήκουσεν
  choice: أطاعت
  rationale: تنقل المعنى المعتاد للفعل ὑπακούω بلا تلطيف أو توسيع عقائدي.
- source_word: κύριον αὐτὸν καλοῦσα
  choice: داعيةً إياه «سيدي»
  rationale: تحفظ معنى النداء أو التسمية بلقب احترام، مع تجنّب فهم الكلمة لقبًا إلهيًا.
- source_word: ἧς ἐγενήθητε τέκνα
  choice: وقد صرتنَّ بناتها
  rationale: تحفظ صورة البنوة المجازية ودلالة الدخول في حالة لها أثر حاضر، كما تحافظ على التأنيث والجمع في المخاطبات.
- source_word: ἀγαθοποιοῦσαι
  choice: إن كنتنَّ تفعلن الخير
  rationale: تُظهر الصيغة الشرطية التي تفيدها قرينة السياق، مع الحفاظ على الطابع العملي المستمر للفعل.
- source_word: μὴ φοβούμεναι
  choice: ولا تخفن
  rationale: صياغة فعلية عربية طبيعية تنقل نفي الخوف بوصفه موقفًا مستمرًا.
- source_word: μηδεμίαν πτόησιν
  choice: أيَّ ترهيب
  rationale: يلائم سياق الضغط أو التخويف، مع إبقاء البدائل الأقرب إلى معنى الرعب أو الشيء المخيف في الحاشية لأن اللفظ اليوناني يحتملها.
theological_decisions:
- issue: دلالة طاعة سارة بوصفها مثالًا للزوجات المؤمنات
  choice: الإبقاء على «أطاعت» بوصفها المعنى المباشر للفعل، من دون تحويل الآية إلى تقرير شامل عن الزواج.
  alternative: تخفيف العبارة إلى «خضعت» أو «استجابت».
  rationale: يحفظ الاختيار قوة اللفظ اليوناني ولا يضيف إلى الآية نتائج مذهبية لا تصرّح بها.
- issue: علاقة اسمي الفاعل ἀγαθοποιοῦσαι وμὴ φοβούμεναι بالفعل الرئيس
  choice: 'صياغتهما في تركيب شرطي: «إن كنتنَّ تفعلن الخير ولا تخفن».'
  alternative: 'صياغتهما وصفيًا: «إذ تفعلن الخير ولا تخفن».'
  rationale: السياق الإرشادي يسمح بدلالة شرطية عملية، لكن الصياغة لا تحوّلها إلى تقرير لاهوتي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعملت علامات التأنيث في «صرتنَّ» و«كنتنَّ» و«تفعلن» و«تخفن» لإبراز أن الخطاب موجّه إلى النساء، ووُضع لقب «سيدي» بين علامتي اقتباس لبيان أنه قول سارة لا لقب إلهي.
