id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: ar
  text: لِأَنَّ[a] عَيْنَيِ الرَّبِّ عَلَى الأَبْرَارِ، وَأُذُنَيْهِ مُصْغِيَتَانِ إِلَى تَضَرُّعِهِمْ[b]، أَمَّا وَجْهُ الرَّبِّ فَضِدُّ الَّذِينَ يَفْعَلُونَ الشَّرَّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فَإِنَّ».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «وأذناه إلى تضرعهم»؛ أُضيفت «مصغيتان» لإيضاح المعنى المضمر في اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تؤدي المعنى السببي الذي يربط هذه العبارة بما قبلها، وتلائم سياق الاستشهاد الكتابي. ويمكن من جهة الأسلوب فهمها أيضًا بمعنى «فإنَّ».
- source_word: ὀφθαλμοὶ κυρίου
  choice: عَيْنَيِ الرَّبِّ
  rationale: ترجمة مباشرة تحفظ الصورة التجسيمية المقصودة في النص وفي المزمور المقتبس منه.
- source_word: ἐπὶ δικαίους
  choice: عَلَى الأَبْرَارِ
  rationale: تفيد توجّه نظر الرب واهتمامه نحو الأبرار، وتحفظ التركيب التصويري بإيجاز عربي واضح.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: وَأُذُنَيْهِ مُصْغِيَتَانِ إِلَى تَضَرُّعِهِمْ
  rationale: أُضيفت «مصغيتان» لإظهار معنى التركيب اليوناني المحذوف منه الخبر، مع حفظ صورة الأذنين واتجاههما إلى التضرع. واختير «تضرع» لأن δέησις يدل على الدعاء الملح أو الالتماس.
- source_word: πρόσωπον δὲ κυρίου
  choice: أَمَّا وَجْهُ الرَّبِّ
  rationale: تحفظ «وجه» الصورة الأصلية، وتُبرز «أما» المقابلة بين عناية الرب بالأبرار وموقفه من فاعلي الشر.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: فَضِدُّ الَّذِينَ يَفْعَلُونَ الشَّرَّ
  rationale: السياق يجعل اتجاه وجه الرب هنا اتجاه مقاومة وعداء؛ لذلك تؤدي «ضد» المعنى الطبيعي، بينما يحفظ «الذين يفعلون الشر» القوة الفعلية للعبارة اليونانية.
theological_decisions:
- issue: اللغة التصويرية عن عيني الرب وأذنيه ووجهه
  choice: الإبقاء على الصور كما وردت
  alternative: تفسيرها بصياغة مثل «يرعى الرب الأبرار ويستمع إليهم ويقاوم الأشرار»
  rationale: تشكّل هذه الصور بنية الآية الأدبية واللاهوتية وتعبّر عن عناية الرب واستجابته ومقاومته، فلا ينبغي إذابتها في شرح تفسيري أو فهمها على نحو جسدي حرفي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. حُفظ التوازي بين العينين والأذنين والوجه، مع ضبط المثنى بعد «إنَّ» وإضافة خبر يوضح العبارة اليونانية الإيجازية.
