  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: ar
  text: بل قدِّسوا المسيحَ الربَّ في قلوبكم[a]، وكونوا دائمًا مستعدين لتقديم دفاع لكل من يطلب منكم بيانًا عن الرجاء الذي فيكم[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي أقرّوا في قلوبكم بقداسة المسيح الرب وأكرموه على هذا الأساس. والترجمة الحرفية: «قدِّسوا المسيحَ الربَّ في قلوبكم».'
    reason: توضيح دلالة الفعل مع الحفاظ على صيغته المباشرة.
  - marker: b
    text: يمكن أن تشير «فيكم» إلى الرجاء الكائن في كل واحد منكم أو الحاضر بينكم بوصفكم جماعة.
    reason: حفظ المدى الدلالي لعبارة الجمع اليونانية.
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: المسيحَ بوصفه الربَّ
  rationale: يحافظ على لقب «المسيح» وعلى «الرب»، ويبيّن العلاقة النحوية بينهما من غير تحويل «المسيح» إلى اسم منقول صوتيًا.
- source_word: ἁγιάσατε
  choice: قدِّسوا
  rationale: ينقل الفعل اليوناني مباشرة ويحفظ صداه المحتمل لإشعياء 8:13، بينما توضّح الحاشية أن المقصود إقرار قداسته وإكرامه لا جعله قدوسًا بفعل البشر.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: في قلوبكم
  rationale: تعبير عربي طبيعي يحفظ دلالة باطن الإنسان وصيغة الجمع.
- source_word: ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν
  choice: وكونوا دائمًا مستعدين للدفاع
  rationale: صياغة عربية واضحة تؤدي معنى الاستعداد المستمر لتقديم دفاع أو جواب مفسِّر.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: أمام كل من يطلب منكم بيانًا
  rationale: «كل من» تحفظ الشمول، و«بيانًا» تؤدي هنا معنى λόγος بوصفه تفسيرًا أو تعليلًا مطلوبًا.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: عن الرجاء الذي فيكم
  rationale: ترجمة قريبة وواضحة تحفظ إمكان فهم ἐν ὑμῖν على نحو فردي أو جماعي.
theological_decisions:
- issue: معنى تقديس المسيح
  choice: قدِّسوا المسيحَ بوصفه الربَّ
  alternative: اعتبروا المسيحَ الربَّ قدوسًا
  rationale: اختيرت الصياغة الأقرب إلى الفعل اليوناني وإلى الصدى الكتابي، مع حاشية تمنع توهّم أن المؤمنين يضفون القداسة على المسيح.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس/المسيح بوصفه اسمًا مجردًا
  rationale: يعمل اللفظ هنا لقبًا مقرونًا بالربوبية، ولذلك تُرجمت دلالته بلقب «المسيح».
- issue: مدى عبارة ἐν ὑμῖν
  choice: الذي فيكم
  alternative: الذي بينكم
  rationale: الصياغة المختارة تحفظ الغموض الحقيقي بين الرجاء الكائن في كل مؤمن والرجاء الحاضر في الجماعة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. استُعمل «بيانًا» بدل ألفاظ أكثر تقنية، وحُفظ تركيب «في قلوبكم» المألوف كتابيًا. انتهى النص بفاصلة لأن المقطع المقدم جزء من جملة تستمر في العدد التالي.
