  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: ar
  text: فَإِنَّ الْمَسِيحَ أَيْضًا تَأَلَّمَ مَرَّةً وَاحِدَةً مِنْ أَجْلِ الْخَطَايَا[a]، الْبَارُّ مِنْ أَجْلِ الْأَثَمَةِ، لِكَيْ يُقَرِّبَكُمْ إِلَى اللهِ، إِذْ أُمِيتَ فِي الْجَسَدِ وَأُحْيِيَ فِي الرُّوحِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «مات» بدلًا من «تألَّم».'
    reason: textual_variant
  - marker: b
    text: 'أو: «أُحييَ بالروح». قد تشير اليونانية إما إلى مجال الروح أو جانبها، وإما إلى عمل الروح القدس بوصفه الفاعل.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: الْمَسِيحَ
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحفظ دلالته المسيانية.
- source_word: ἅπαξ
  choice: مَرَّةً وَاحِدَةً
  rationale: ينقل معنى وقوع الحدث مرة واحدة من غير إضافة «إلى الأبد» أو تقرير دلالة لاهوتية أوسع من لفظ الظرف نفسه.
- source_word: περὶ ἁμαρτιῶν
  choice: مِنْ أَجْلِ الْخَطَايَا
  rationale: تعبير عربي واضح ينقل معنى περί مع المضاف إليه في هذا السياق الفدائي، من غير حصر العلاقة في تفسير أدق مما يصرح به النص.
- source_word: ἔπαθεν
  choice: تَأَلَّمَ
  rationale: هذه هي قراءة SBLGNT، أما «مات» فهي قراءة نصية بديلة تُذكر في الحاشية.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: وَهُوَ الْبَارُّ مِنْ أَجْلِ غَيْرِ الْأَبْرَارِ
  rationale: يحفظ التقابل بين المفرد البار والجمع غير الأبرار، وينقل معنى المنفعة والنيابة في ὑπέρ من غير توسيعه إلى صياغة مذهبية.
- source_word: προσαγάγῃ
  choice: يُقَرِّبَكُمْ إِلَى اللهِ
  rationale: الفعل يدل على الإحضار إلى حضرة شخص أو إتاحة الوصول إليه؛ و«يقربكم إلى الله» تعبير عربي طبيعي يحفظ هذه الدلالة.
- source_word: θανατωθεὶς
  choice: أُمِيتَ
  rationale: يحفظ المبني للمجهول في اسم المفعول اليوناني، وتؤدي جملة «إذ أميت» علاقته بالفعل الرئيس بإيجاز.
- source_word: σαρκὶ
  choice: فِي الْجَسَدِ
  rationale: في هذا السياق يشير اللفظ إلى الوجود الجسدي القابل للموت؛ واختيار «الجسد» أوضح للقارئ العربي من «اللحم» ولا يحوله إلى «الطبيعة الخاطئة».
- source_word: ζῳοποιηθεὶς
  choice: أُحْيِيَ
  rationale: ينقل المبني للمجهول ومعنى إعطاء الحياة بصياغة عربية موجزة وواضحة.
- source_word: πνεύματι
  choice: فِي الرُّوحِ
  rationale: يحافظ على موازاة الداتيف مع «في الجسد» وعلى احتمال دلالة المجال أو الجانب، بينما تُذكر قراءة الوكالة «بالروح» في الحاشية.
theological_decisions:
- issue: دلالة التقابل بين الجسد والروح في العبارة الختامية
  choice: «في الجسد ... في الروح» مع شرح الاحتمال الآخر في الحاشية
  alternative: «أُميت جسديًّا ... وأُحيي بالروح القدس»
  rationale: التركيب اليوناني موجز ومختلف في تفسيره؛ والصياغة المختارة لا تحسم ما إذا كان πνεύματι يدل على مجال الحياة أو جانبها، أم على وكالة الروح القدس.
- issue: قوة النيابة في «البار من أجل غير الأبرار»
  choice: إبقاء «من أجل» من دون توسيع تفسيري
  alternative: «البريء بدلًا من المذنبين»
  rationale: يفيد النص أن آلام المسيح كانت لمنفعة غير الأبرار وبالنيابة عنهم، لكنه لا يفصّل هنا نظرية للكفارة؛ لذلك تُحفظ العبارة الموجزة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ضبط كامل للنص الرئيس. استُعمل «المسيح» بوصفه لقبًا معروفًا، وحُفظ إيجاز الأصل وتوازي عبارتي «في الجسد» و«في الروح» من غير حسم الغموض التفسيري.
