source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: ar
  text: وبالمثل، أيتها الزوجات، كُنَّ خاضعاتٍ لأزواجكن، لكي يُربَحَ، بسيرة زوجاتهم ومن غير كلام، حتى إن كان بعضهم لا يطيعون الكلمة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يطيعون الرسالة»؛ أي إنهم يرفضون كلمة البشارة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοίως
  choice: وبالمثل
  rationale: أداة ربط طبيعية تحفظ صلة الوصية بما سبق من إرشادات.
- source_word: γυναῖκες
  choice: أيتها الزوجات
  rationale: ذكر «أزواجكن» يجعل المعنى العلاقي، أي الزوجات، هو المقصود في السياق.
- source_word: ὑποτασσόμεναι
  choice: اخضعن
  rationale: صيغة أمر عربية واضحة تؤدي قوة اسم الفاعل اليوناني المعتمد على حثّ مفهوم، من غير إضافة معنى الطاعة المطلقة أو الدونية.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: لأزواجكن
  rationale: السياق الأسري يقتضي معنى «الأزواج»؛ والضمير العربي يعبّر طبيعيًا عن اختصاص كل زوجة بزوجها من غير تركيب ثقيل.
- source_word: ἵνα καὶ εἴ τινες
  choice: حتى إن كان بعضهم
  rationale: تحفظ الغاية أو النتيجة مع القوة التنازلية لعبارة «حتى إن».
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: لا يطيعون الكلمة
  rationale: يحفظ التداخل الدلالي بين العصيان وعدم الإيمان، ويُبقي «الكلمة» بوصفها تعبيرًا كتابيًا عن الرسالة المعلنة.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: بسيرة زوجاتهم
  rationale: «السيرة» تعبر بإيجاز ووقار عن أسلوب العيش والسلوك، و«زوجاتهم» توضح العلاقة المقصودة.
- source_word: ἄνευ λόγου
  choice: بلا كلمة
  rationale: يحفظ المفرد والمقابلة البلاغية مع «الكلمة» في أول الآية، والمقصود هنا من غير كلام أو حجة لفظية من الزوجة.
- source_word: κερδηθήσονται
  choice: يُربَحوا
  rationale: يحفظ استعارة الكسب في المبني للمجهول ودلالتها على استمالتهم إلى الإيمان.
theological_decisions:
- issue: دلالة ὑποτασσόμεναι في إرشادات البيت
  choice: اخضعن
  alternative: كُنَّ خاضعات؛ أطعن
  rationale: يحفظ ترتيب العلاقة الذي يفيده الفعل من غير تحويله إلى فعل الطاعة الأقوى دلالة، ومن غير استنتاج دونية أو خضوع مطلق لا تنص عليه الآية.
- issue: دلالة ἀπειθοῦσιν τῷ λόγῳ
  choice: لا يطيعون الكلمة
  alternative: لا يؤمنون بالرسالة؛ يرفضون طاعة البشارة
  rationale: يمكن للفعل أن يجمع بين عدم الإيمان والعصيان؛ والصياغة المختارة تحفظ هذا التوتر، بينما تشرح الحاشية أن «الكلمة» هي الرسالة الإنجيلية.
- issue: دلالة ἄνευ λόγου وعلاقتها بـ τῷ λόγῳ
  choice: بلا كلمة
  alternative: من غير كلام
  rationale: 'الإبقاء على اللفظ نفسه يحفظ المقابلة البلاغية في اليونانية، مع اختلاف المرجع المحتمل: رسالة الإنجيل أولًا، وكلام الزوجة ثانيًا.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الخطاب المباشر «اخضعن» لتجنب ثقل نقل اسم الفاعل اليوناني حرفيًا، مع الحفاظ على بنية الغاية والمقابلة بين «الكلمة» و«بلا كلمة».
