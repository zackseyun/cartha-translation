  to: وبالمثل، أيتها الزوجات، كُنَّ خاضعاتٍ لأزواجكن، لكي يُربَحَ، بسيرة زوجاتهم ومن غير كلام، حتى إن كان بعضهم لا يطيعون الكلمة[a].
  rationale: أُعيدت صياغة الآية بحيث ترتبط الغاية «لكي يُربَح» بوضوح بالحالة التنازلية «حتى إن كان بعضهم لا يطيعون الكلمة»، مع إبقاء «بعضهم» عائدًا إلى الأزواج كما يقتضيه السياق. واستُبدل الأمر المباشر بصيغة «كُنَّ خاضعات» لتقريب وظيفة اسم الفاعل اليوناني في الإرشاد، واستُخدم «من غير كلام» للتعبير العربي الطبيعي عن ἄνευ λόγου. ولم يُضف إلى الخضوع معنى الطاعة المطلقة أو الدونية، ولم تُحسم دلالة ἀπειθοῦσιν بين العصيان وعدم الإيمان خارج ما توضحه الحاشية.
