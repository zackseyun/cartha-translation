  verdict: revise
  source_fidelity: 'المسودة تنقل العناصر الأساسية بأمانة: «وداعة وخوف» تُبقي φόβου غير مقيَّد، و«ذوو ضمير صالح» تعكس الحال المصاحب، و«المسيح» مقابل سليم لـ Χριστῷ. لكن ترتيب الجملة الحالية يفصل «لكي يُخزى» عن فاعله ويجعل نطاق عبارة «في ما يُفترى عليكم فيه» غير واضح.'
  naturalness: العبارة «لكي يُخزى، في ما يُفترى عليكم فيه، الذين...» متعثرة نحويًا في العربية الحديثة بسبب الفصل بالفواصل بين الفعل المبني للمجهول وفاعله المؤخر. إعادة ترتيبها تجعلها سليمة وواضحة من دون زيادة تفسيرية.
  terminology: «وداعة»، «خوف»، «ضمير صالح»، «سيرة صالحة»، و«في المسيح» مناسبة. ويُستبدل «يعيبون» بـ«يطعنون في» لأنه يعبّر طبيعيًا عن التشهير أو الكلام الجارح الموجَّه إلى السيرة، بما يلائم ἐπηρεάζοντες في هذا السياق.
