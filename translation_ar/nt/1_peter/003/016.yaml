source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: ar
  text: بَلْ بِوَدَاعَةٍ وَخَوْفٍ[a]، وَأَنْتُمْ ذَوُو ضَمِيرٍ صَالِحٍ، لِكَيْ يُخْزَى الَّذِينَ يَطْعَنُونَ فِي سِيرَتِكُمُ الصَّالِحَةِ فِي الْمَسِيحِ، فِي مَا يُفْتَرَى عَلَيْكُمْ فِيهِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بتوقير»، أو «باحترام».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في الأمر الذي يُتكلَّم فيه عليكم بالسوء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτητος
  choice: وَدَاعَة
  rationale: تدل الكلمة على التواضع والرفق ونبذ القسوة؛ و«وداعة» تعبير عربي واضح وراسخ يلائم سياق الوصية.
- source_word: φόβου
  choice: خَوْف
  rationale: أُبقي اللفظ عامًا من غير تعيين متعلَّقه، لأن الأصل قد يدل على الخوف أو التوقير أو الاحترام بحسب السياق.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: وَأَنْتُمْ ذَوُو ضَمِيرٍ صَالِحٍ
  rationale: ينقل تركيب الحال ومعنى امتلاك ضمير صالح من غير تحويله إلى أمر صريح بالمحافظة عليه.
- source_word: ἐν ᾧ
  choice: فِي مَا ... فِيهِ
  rationale: يحافظ على إيجاز العبارة اليونانية وانفتاحها على المجال أو الأمر الذي يقع فيه الافتراء.
- source_word: καταλαλεῖσθε
  choice: يُفْتَرَى عَلَيْكُمْ
  rationale: يفيد الكلام العدائي على المخاطَبين بما يشوّه سمعتهم؛ و«يُفترى عليكم» طبيعي في العربية ويحمل قوة الاتهام الباطل.
- source_word: καταισχυνθῶσιν
  choice: يُخْزَى
  rationale: يحافظ على المبني للمجهول وصيغة الغاية بعد ἵνα.
- source_word: ἐπηρεάζοντες
  choice: الَّذِينَ يَعِيبُونَ
  rationale: ينقل الاعتداء الكلامي والانتقاص الموجَّهين إلى سيرة المؤمنين، من غير توسيع المعنى إلى كل أنواع الإساءة.
- source_word: ἀναστροφήν
  choice: سِيرَة
  rationale: «السيرة» تدل بوضوح على نهج الحياة والسلوك الأخلاقي، وهي موجزة وطبيعية في العربية الفصحى.
- source_word: ἐν Χριστῷ
  choice: فِي الْمَسِيحِ
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، وتحافظ العبارة على معنى الوجود أو الحياة في المسيح.
- source_word: ἀγαθὴν
  choice: صَالِح
  rationale: يحافظ على التكرار الدلالي للصفة في «ضمير صالح» و«سيرة صالحة» وعلى بساطتها الأخلاقية.
theological_decisions:
- issue: دلالة φόβου في عبارة «بوداعة وخوف»
  choice: الإبقاء على «خوف» من غير تحديد متعلَّقه
  alternative: توقير؛ احترام؛ مخافة الله
  rationale: لا يصرّح السياق المباشر بمن يقع عليه الخوف؛ لذلك تُحفَظ السعة والتوتر التأويليان بدل حصر المعنى في توقير الله أو احترام الناس.
- issue: دلالة Χριστῷ
  choice: المسيح
  alternative: لا يوجد في العربية تمييز طبيعي مماثل بين Messiah وChrist؛ ويمكن شرح اللقب بأنه «المسيح المنتظر» عند الحاجة
  rationale: «المسيح» ترجمة اللقب اليوناني الطبيعية والراسخة في العربية، ولا يلزم منها التعامل معه بوصفه اسمًا مجردًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «ذوو ضمير صالح» للمحافظة على تركيب الحال، و«السيرة» للدلالة على نهج الحياة. وُضعت جميع علامات الحواشي في المتن.
