    rationale: في الأصل، καταισχυνθῶσιν يتبعه مباشرة الفاعل «الذين يسيئون/يطعنون». أما الصياغة العربية فتضع بينهما عبارة ظرفية، فتضعف الوضوح والترابط النحوي.
  - severity: low
    issue: «الذين يعيبون سيرتكم» أضعف قليلًا من قوة الاعتداء اللفظي في ἐπηρεάζοντες.
    rationale: «يطعنون في سيرتكم» أوضح في الدلالة على الانتقاص والتشهير بالسلوك، من غير توسيع المعنى إلى إساءة جسدية أو عامة.
