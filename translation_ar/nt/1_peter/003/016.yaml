  to: بَلْ بِوَدَاعَةٍ وَخَوْفٍ[a]، وَأَنْتُمْ ذَوُو ضَمِيرٍ صَالِحٍ، لِكَيْ يُخْزَى الَّذِينَ يَطْعَنُونَ فِي سِيرَتِكُمُ الصَّالِحَةِ فِي الْمَسِيحِ، فِي مَا يُفْتَرَى عَلَيْكُمْ فِيهِ[b].
  rationale: 'التعديل نحوي وأسلوبـي أساسًا: قُدِّم فاعل «يُخزى» ليتصل بالفعل كما في اليونانية، وأُبقيت عبارة «في ما يُفترى عليكم فيه» مفتوحة المرجع كما في ἐν ᾧ. واستُخدم «يطعنون في» لتأدية قوة الكلام العدائي ضد السيرة الصالحة. لا تغيّر المراجعة معنى الآية أو تحسم مرجع «الخوف».'
