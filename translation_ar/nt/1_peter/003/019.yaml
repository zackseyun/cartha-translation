lexical_decisions:
- source_word: ἐν ᾧ
  choice: وفيه
  rationale: تحافظ «فيه» على صيغة شبه الجملة وعلى إحالة الضمير المحايدة قدر الإمكان في العربية، من غير حسم ما إذا كان المعنى «في الروح» أو «به». وأُدخلت الواو لربط العبارة بسياقها السابق.
- source_word: καὶ
  choice: أيضًا
  rationale: تنقل القوة الإضافية للأداة، إذ تضيف فعل الإعلان إلى ما سبق.
- source_word: τοῖς ... πνεύμασιν
  choice: للأرواح
  rationale: هي المقابل المباشر لـ πνεύμασιν، ولا تحسم هل المقصود أرواح بشر أموات أم كائنات روحية ساقطة.
- source_word: ἐν φυλακῇ
  choice: التي في السجن
  rationale: تعبير عربي طبيعي ينقل معنى الحبس أو الاحتجاز في φυλακή، مع جعل الصلة واضحة.
- source_word: πορευθεὶς
  choice: ذهب
  rationale: تحويل اسم الفاعل اليوناني إلى فعل ماضٍ معطوف صياغة عربية سلسة، ويحفظ دلالة الانتقال من غير تشديد زائد على الترتيب الزمني.
- source_word: ἐκήρυξεν
  choice: أعلن
  rationale: ينقل معنى المناداة أو الإعلان العلني، ولا يفترض أن مضمون الرسالة كان بشارة خلاصية.
theological_decisions:
- issue: مرجع ἐν ᾧ
  choice: صيغت «وفيه» مع إبقاء مرجع الضمير مفتوحًا في النص والحاشية.
  alternative: «وفي مَن» إذا أُحيل إلى المسيح شخصيًا، أو «وبه» إذا فُهمت العبارة على معنى الوسيلة.
  rationale: التركيب اليوناني يحتمل أكثر من فهم من جهة علاقته بعبارة «بالروح» السابقة، ولذلك لا ينبغي للترجمة أن تحسم الخلاف العقائدي في كيفية الإعلان.
- issue: هوية «الأرواح التي في السجن»
  choice: تُركت الهوية غير محددة.
  alternative: أرواح بشر ماتوا، أو ملائكة/كائنات روحية ساقطة.
  rationale: النص اليوناني يسميهم «أرواحًا» فحسب ولا يحدد هويتهم بما يكفي لتضييق المعنى في المتن.
- issue: طبيعة رسالة المسيح في ἐκήρυξεν
  choice: «أعلن» دون تحديد مضمون الإعلان.
  alternative: «كرز»، مع إمكان فهمه إعلانًا بالبشارة أو بالدينونة أو بالنصرة.
  rationale: الفعل يدل على المناداة والإعلان، لكنه لا يبين هنا مضمون الرسالة، لذا تُحفظ هذه السعة الدلالية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وموقرة. استُخدم «أعلن» بدل «كرز» لتجنب تخصيص مضمون الرسالة، وحُفظت مواطن الغموض الأصلية في الحواشي. رُتبت علامات الحواشي بحسب موضع القضايا في النص: [a] بعد «فيه»، و[b] بعد «أعلن»، و[c] بعد العبارة الخاصة بالأرواح.'
