source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: ar
  text: لكن حتى إن تألَّمتم من أجل البر، فطوبى لكم. فلا تخافوا خوفهم[a] ولا تضطربوا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الخوف منهم»، أو: «ما يخافونه». أُبقيت عبارة «خوفهم» في المتن لأنها تقارب صياغة إشعياء 8:12 وتحفظ احتمالَي المعنى.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ
  choice: لكن حتى إن
  rationale: 'تنقل معنى الشرط التنازلي مع إبقاء المقابلة بما سبق: احتمال الألم قائم، لكنه لا ينقض التطويب.'
- source_word: πάσχοιτε
  choice: تألَّمتم
  rationale: صيغة الشرط مع الفعل اليوناني الاحتمالي تُنقل طبيعيًا بالعربية بواسطة «حتى إن» مع الماضي، من غير تقرير أن الألم واقع حتمًا.
- source_word: διὰ δικαιοσύνην
  choice: من أجل البر
  rationale: تحفظ اللفظ الأخلاقي واللاهوتي δικαιοσύνη، وتفيد هنا سبب التألم، من غير حصر المعنى في العدالة الاجتماعية أو شرحه بأنه مجرد فعل الصواب.
- source_word: μακάριοι
  choice: فطوبى لكم
  rationale: صياغة عربية كتابية واضحة تؤدي معنى نوال البركة والحظوة، لا مجرد الشعور بالسعادة.
- source_word: τὸν ... φόβον αὐτῶν
  choice: خوفهم
  rationale: تحفظ الإضافة الملتبسة في اليونانية وصدى إشعياء 8:12؛ فقد تعني الخوف منهم أو ما يخافونه، ولذلك تُذكر البدائل في الحاشية.
- source_word: μὴ φοβηθῆτε
  choice: فلا تخافوا
  rationale: تحفظ النهي وتكرار جذر الخوف الموجود بين φόβον وφοβηθῆτε.
- source_word: μηδὲ ταραχθῆτε
  choice: ولا تضطربوا
  rationale: تنقل معنى الانزعاج والاضطراب الداخلي بصياغة عربية طبيعية موجزة.
theological_decisions:
- issue: ترجمة δικαιοσύνη
  choice: البر
  alternative: العدل؛ أو فعل ما هو صواب
  rationale: السياق يتناول التألم بسبب السلوك المستقيم أمام الله والناس. «البر» يبقي المجال الأخلاقي واللاهوتي للمصطلح، بينما «العدل» قد يضيّقه، و«فعل ما هو صواب» يفسره بدل أن يترجمه.
- issue: مرجع «خوفهم» ومعناه
  choice: الإبقاء على «خوفهم» في المتن
  alternative: الخوف منهم؛ أو ما يخافونه
  rationale: التركيب اليوناني يحتمل الخوف الذي يثيره الآخرون والخوف الذي يخافونه هم، كما أنه يردد صياغة إشعياء 8:12. لا ينبغي حسم هذا التوتر الدلالي في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «طوبى لكم» لرنينها الكتابي المفهوم، وأُبقي التركيب الموجز «خوفهم» عمدًا مع توضيح غموضه الحقيقي في الحاشية.
