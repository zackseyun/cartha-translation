  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: ar
  text: كأطفالٍ حديثي الولادة، اشتاقوا إلى اللبن الروحي الخالص[a]، لكي تنموا به إلى الخلاص.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «اللبن العقلي الخالص» أو «اللبن الخالص الموافق للعقل». فالصفة اليونانية قد تدل على ما يتعلق بالعقل أو بالحياة الباطنة؛ والمقصود هنا على الأرجح غذاء روحي لا لبن حرفي.'
    reason: بيان البدائل المعجمية المهمة للفظ λογικός والمحافظة على اتساع دلالته.
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: وكأطفالٍ حديثي الولادة
  rationale: تحافظ الصياغة على التشبيه وعلى معنى الولادة الحديثة، بلغة عربية طبيعية واضحة.
- source_word: τὸ λογικὸν
  choice: الروحي
  rationale: في صورة اللبن المجازية يدل اللفظ على غذاء غير مادي يتعلق بالعقل أو بالحياة الباطنة؛ و«الروحي» أوضح للقارئ العربي، مع إثبات الدلالة الأقرب إلى اللفظ في الحاشية.
- source_word: ἄδολον
  choice: الخالص
  rationale: ينقل معنى اللبن غير المغشوش أو غير المخلوط، ويلائم الاسم في العربية.
- source_word: ἐπιποθήσατε
  choice: اشتاقوا إلى
  rationale: يعبر عن الأمر برغبة قوية ومتواصلة من غير تعبير عامي.
- source_word: ἐν αὐτῷ αὐξηθῆτε
  choice: تنموا به
  rationale: تعود الهاء على اللبن، وتبين أنه وسيلة النمو؛ والفعل العربي يؤدي معنى المبني للمجهول اليوناني بصورة طبيعية.
- source_word: εἰς σωτηρίαν
  choice: إلى الخلاص
  rationale: يحفظ اتجاه النمو وغايته دون حصر الخلاص في صيغة لاهوتية زمنية بعينها.
theological_decisions:
- issue: دلالة λογικός في وصف اللبن
  choice: الروحي في المتن
  alternative: العقلي أو الموافق للعقل
  rationale: السياق مجازي ويتحدث عن غذاء المؤمن الباطني، لكن اللفظ اليوناني يرتبط أيضًا بالعقل؛ لذلك أُثبت هذا الاحتمال في الحاشية بدل إخفائه.
- issue: دلالة εἰς σωτηρίαν
  choice: إلى الخلاص
  alternative: لأجل الخلاص أو فتنموا في الخلاص
  rationale: تحافظ «إلى» على معنى الاتجاه نحو غاية الخلاص، من غير أن تحسم العلاقة بين النمو والخلاص وفق تصور مذهبي خاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة الأطفال واللبن، كما حُفظ التعبير الاتجاهي «إلى الخلاص» من غير شرح مذهبي داخل المتن.
