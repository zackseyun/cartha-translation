  terminology: أُبقيت «نعمة» للمحافظة على اللفظ المحوري χάρις، والحاشية تشرح بأمانة دلالتها التقويمية المحتملة. كما أن «وعي بالله» مع البدائل في الحاشية يحفظان الغموض المعجمي المقصود في συνείδησις θεοῦ. لا توجد أسماء أو مصطلحات لاهوتية أخرى تستدعي تعديلًا.
