  source_fidelity: 'الترجمة تنقل البنية والمعنى الأساسيين بأمانة: «لأن هذا نعمة» تقابل τοῦτο γὰρ χάρις، و«أن يحتمل أحد» تقابل εἰ ... ὑποφέρει τις، و«وهو يتألم ظلمًا» تحافظ على الظرف المصاحب في πάσχων ἀδίκως. و«من أجل وعيه بالله» تمثيل مقبول للعبارة الصعبة διὰ συνείδησιν θεοῦ، من غير اختزالها إلى معنى الضمير الأخلاقي وحده أو إضافة تفسير لاهوتي إلى المتن.'
