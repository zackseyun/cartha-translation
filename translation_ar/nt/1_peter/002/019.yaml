  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: ar
  text: 'لِأَنَّ هذَا نِعْمَةٌ: أَنْ يَحْتَمِلَ أَحَدٌ الأَحْزَانَ، وَهُوَ يَتَأَلَّمُ ظُلْمًا، مِنْ أَجْلِ وَعْيِهِ بِاللهِ[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِكَوْنِهِ وَاضِعًا اللهَ نُصْبَ عَيْنَيْهِ»، أو: «مِنْ أَجْلِ ضَمِيرِهِ نَحْوَ اللهِ».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني «نِعْمَة» هنا أمرًا محمودًا أو مستحقًّا للرضا أو الحُظوة.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَةٌ
  rationale: تحافظ «نعمة» على الصلة المعجمية والاستعمال اللاهوتي للكلمة اليونانية، مع أن السياق يسمح أيضًا بمعنى الأمر المحمود أو المستحق للرضا؛ وقد ذُكر ذلك في الحاشية.
- source_word: διὰ συνείδησιν θεοῦ
  choice: مِنْ أَجْلِ وَعْيِهِ بِاللهِ
  rationale: ينقل «وعيه بالله» معنى الإدراك المتجه إلى الله، ولا يحصر συνείδησις في الضمير الأخلاقي وحده. وتبيّن الحاشية البدائل الممكنة.
- source_word: ὑποφέρει
  choice: يَحْتَمِلَ
  rationale: «يحتمل» تعبير عربي طبيعي يدل على الثبات تحت المشقة والصبر عليها.
- source_word: λύπας
  choice: الأَحْزَانَ
  rationale: تنقل «الأحزان» مدى الألم والضيق النفسي الذي تدل عليه صيغة الجمع اليونانية.
- source_word: πάσχων ἀδίκως
  choice: وَهُوَ يَتَأَلَّمُ ظُلْمًا
  rationale: تحافظ الصياغة على العلاقة الظرفية بين الاحتمال والتألم، وتنقل ἀδίκως بمعنى وقوع الألم على المرء بغير حق.
- source_word: τις
  choice: أَحَدٌ
  rationale: «أحد» نكرة مفردة عامة، ولا تضيف تحديدًا جنسانيًا غير لازم.
- source_word: τοῦτο γὰρ
  choice: لِأَنَّ هذَا
  rationale: تحافظ على وظيفة γάρ التفسيرية وعلى إحالة τοῦτο إلى الحالة المذكورة بعده.
theological_decisions:
- issue: دلالة χάρις في السياق
  choice: نِعْمَةٌ
  alternative: أمر محمود؛ أمر مستحق للرضا؛ حُظوة
  rationale: أُبقي اللفظ الأساسي من غير إضافة «عند الله» إلى المتن، لأن هذه العبارة ليست مصرّحًا بها في هذه الجملة، مع توضيح الدلالة التقويمية المحتملة في الحاشية.
- issue: معنى συνείδησις θεοῦ
  choice: وَعْيِهِ بِاللهِ
  alternative: ضميره نحو الله؛ لكونه واضعًا الله نصب عينيه
  rationale: تحافظ الصياغة على التوتر بين معنى الوعي ومعنى الضمير، وتُظهر أن الله هو مرجع هذا الإدراك من غير حسم العبارة في تفسير أخلاقي واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. قُدِّمت عبارة الدافع في آخر الجملة لسلامة الأسلوب العربي، مع استعمال «مِنْ أَجْلِ» لربطها بالاحتمال، وحُفظت البدائل الدلالية الحقيقية في الحواشي.
