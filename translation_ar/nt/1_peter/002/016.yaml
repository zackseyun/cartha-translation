  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: ar
  text: كأحرار، لا كمن يتخذون الحرية ستارًا للشر، بل كعبيد لله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كخدّام لله». يمكن أن تدل الكلمة اليونانية على العبيد أو الخدّام، لكن «عبيد» تحافظ هنا على المقابلة الأقوى مع «أحرار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: أحرار
  rationale: تنقل الصفة معنى الحرية الاجتماعية والشخصية، وتلائم المقابلة المقصودة مع «عبيد لله» من غير تقييد المخاطَبين بالذكور.
- source_word: ἐπικάλυμμα
  choice: ستارًا
  rationale: يحفظ الصورة الملموسة لشيء يُستعمل لحجب الشر، وهو تعبير عربي طبيعي وواضح.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: متخذين الحرية
  rationale: يعبر اصطلاحيًا عن معنى اتخاذ الحرية ستارًا، بدل النقل الحرفي المتعثر «لهم الحرية ستارًا».
- source_word: κακίας
  choice: الشر
  rationale: ينقل المعنى الأخلاقي العام للكلمة في هذا السياق، من غير تضييقه على الحقد أو الخبث وحدهما.
- source_word: δοῦλοι
  choice: عبيد
  rationale: يحفظ دلالة الانتماء والخضوع القوية، ويصون المفارقة المقصودة بين كون المؤمنين أحرارًا وكونهم عبيدًا لله.
- source_word: θεοῦ δοῦλοι
  choice: عبيد لله
  rationale: صياغة عربية واضحة تفيد الانتماء إلى الله والخضوع له، وتحافظ على ترتيب المعنى وعلاقته بالمقابلة السابقة.
theological_decisions:
- issue: دلالة δοῦλοι في وصف هوية المؤمنين
  choice: عبيد لله
  alternative: خدام لله
  rationale: النص يجمع عمدًا بين الحرية والانتماء الكامل إلى الله. «عبيد» يحفظ حدة هذه المفارقة اللاهوتية، بينما «خدام» قد يخففها ويوحي أساسًا بأداء خدمة.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كريمة. حُفظ التركيب المقارن المتكرر «كـ... لا... بل كـ...» مع صياغة طبيعية، وأُبقي التوتر المقصود بين الحرية والعبودية لله.
