  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: ar
  text: فَلَكُمُ إِذًا، أَنْتُمُ الَّذِينَ تُؤْمِنُونَ، الْكَرَامَةُ[a]؛ أَمَّا الَّذِينَ لَا يُؤْمِنُونَ[b] فَـ«الْحَجَرُ الَّذِي رَفَضَهُ الْبَنَّاؤُونَ، هُوَ الَّذِي صَارَ رَأْسَ الزَّاوِيَةِ»[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلكم أنتم الذين تؤمنون النفاسة»، أي إن الحجر نفيس عند المؤمنين.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «الذين يعصون»؛ فقد يحمل الفعل معنى رفض الإيمان وما ينشأ عنه من عصيان.'
    reason: lexical_alternative
  - marker: c
    text: 'تُترجم تقليديًا: «حجر الزاوية» أو «حجر الزاوية الرئيس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: الكرامة
  rationale: تؤدي معنى الكرامة أو الشرف الذي يكون للمؤمنين، وتحافظ على إيجاز العبارة اليونانية، مع إبقاء احتمال دلالة الكلمة على قيمة الحجر ونفاسته في الحاشية.
- source_word: τοῖς πιστεύουσιν
  choice: أنتم الذين تؤمنون
  rationale: صياغة شخصية واضحة تحفظ الخطاب المباشر ودلالة اسم الفاعل في اليونانية.
- source_word: ἀπιστοῦσιν
  choice: الذين لا يؤمنون
  rationale: يقابل الفعلُ مباشرةً «تؤمنون» في السياق؛ أما معنى العصيان الممكن الملازم لرفض الإيمان فمذكور في الحاشية.
- source_word: λίθος
  choice: الحجر
  rationale: اللفظ العربي الطبيعي في صورة البناء، وهو يقابل الاسم اليوناني مباشرة.
- source_word: ἀπεδοκίμασαν
  choice: رفضه
  rationale: تعبير عربي مألوف يؤدي معنى الرفض بعد الفحص أو التقييم دون إثقال العبارة.
- source_word: οἱ οἰκοδομοῦντες
  choice: البناؤون
  rationale: ينقل اسم الفاعل المستعمل اسميًا بصياغة عربية طبيعية ويحفظ صورة البناء.
- source_word: κεφαλὴν γωνίας
  choice: رأس الزاوية
  rationale: ترجمة شفافة للتركيب اليوناني تحفظ صورته المجازية ولا تحصره ابتداءً في تفسير معماري واحد.
theological_decisions:
- issue: دلالة ἡ τιμή وصلتها بالمؤمنين وبالمسيح بوصفه الحجر
  choice: الكرامة للمؤمنين
  alternative: النفاسة لكم، أي إن الحجر نفيس عند المؤمنين
  rationale: التركيب اليوناني يفيد بصورة مباشرة أن الكرامة للمؤمنين، ويناسب سياق عدم الخزي؛ لكن احتمال عود المعنى إلى نفاسة الحجر قائم بسبب الآية السابقة، ولذلك حُفظ في الحاشية.
- issue: دلالة κεφαλὴ γωνίας
  choice: رأس الزاوية
  alternative: حجر الزاوية أو حجر الزاوية الرئيس
  rationale: تحفظ هذه الصياغة الاستعارة كما وردت، من غير حسم الوظيفة المعمارية الدقيقة، مع بيان المقابل التفسيري الشائع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التشكيل الجزئي الكامل في نص الآية لتيسير القراءة، مع تركيب طبيعي يحفظ المقابلة بين المؤمنين وغير المؤمنين وصيغة الاقتباس الكتابي.
