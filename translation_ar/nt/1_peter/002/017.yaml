id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: ar
  text: أكرموا الجميع، وأحبّوا جماعة الإخوة[a]، وخافوا الله، وأكرموا الملك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي جماعة الإخوة والأخوات المؤمنين.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يُقصد به «الإمبراطور»؛ فاللفظ اليوناني يعني «الملك»، لكنه في سياق بطرس الروماني يُرجَّح أن يشير إلى الإمبراطور.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: الجميع
  rationale: اسم واقع مفعولًا به يفيد الشمول؛ و«الجميع» صياغة عربية موجزة وطبيعية تحفظ هذا العموم.
- source_word: τιμήσατε / τιμᾶτε
  choice: أكرموا
  rationale: يحفظ فعل «أكرموا» معنى τιμάω وتكراره في مطلع الآية وخاتمتها، مع إبقاء الفرق بين إكرام البشر ومخافة الله.
- source_word: ἀδελφότητα
  choice: جماعة الإخوة
  rationale: يدل اللفظ على مجموع الإخوة في الإيمان بوصفهم جماعة مترابطة؛ وهذه الصياغة أوضح في العربية المعاصرة من «الأخوّة» التي قد تُفهم على أنها صفة مجردة.
- source_word: ἀγαπᾶτε
  choice: أحبّوا
  rationale: مقابل مباشر وطبيعي للفعل، وصيغة الأمر العربية لا تحتاج إلى إضافة لفظ يدل على الاستمرار.
- source_word: θεὸν
  choice: الله
  rationale: المقابل المباشر للاسم اليوناني في هذا السياق.
- source_word: φοβεῖσθε
  choice: خافوا
  rationale: يحفظ القوة الدلالية المباشرة للفعل ولا يلطّفها إلى «وقّروا»، كما يصون التمييز المقصود بين مخافة الله وإكرام الملك.
- source_word: βασιλέα
  choice: الملك
  rationale: هو المقابل المباشر للفظ اليوناني، مع بيان احتمال الإشارة إلى الإمبراطور الروماني في الحاشية.
theological_decisions:
- issue: التمييز بين ما يجب لله وما يجب للحاكم المدني
  choice: «خافوا الله» و«أكرموا الملك»
  alternative: «وقّروا الله» و«احترموا الملك»
  rationale: 'يحافظ هذا الاختيار على التفاوت المقصود في الأفعال: الإكرام للجميع وللملك، والمحبة لجماعة المؤمنين، والمخافة لله، من غير بناء نظرية سياسية أوسع على العبارة.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. حُفظ الإيقاع المتوازي للأوامر الأربعة، وتكرر «أكرموا» كما تكرر الفعل اليوناني، ووُضعت علامتا الحاشية بعد اللفظ الذي تشرحه كل حاشية.
