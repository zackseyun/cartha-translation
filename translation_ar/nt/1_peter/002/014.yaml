  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: ar
  text: أو للولاة، بوصفهم مُرسَلين من قِبَله[a] لمعاقبة فاعلي الشر ومدح فاعلي الخير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: من قِبَل الملك أو الإمبراطور المذكور في الآية السابقة؛ ويفهم بعضهم العبارة على أنها تشير، على نطاق أوسع، إلى ترتيب الله للسلطة.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: أو
  rationale: 'تواصل بنية التقابل التي بدأت في الآية السابقة: سواء للملك... أو للولاة.'
- source_word: ἡγεμόσιν
  choice: للولاة
  rationale: تدل على أصحاب سلطة حاكمة، وفي هذا السياق المدني تُعبِّر «الولاة» طبيعيًا عن الحكام المفوَّضين من الملك من غير تقييد النص بمنصب روماني أدق.
- source_word: ὡς
  choice: بوصفهم
  rationale: تنقل معنى توصيف الولاة باعتبارهم مرسَلين، وتحافظ على صلة العبارة بما قبلها.
- source_word: δι’ αὐτοῦ
  choice: من قِبَله
  rationale: مع اسم المفعول «مُرسَلين» تُعبِّر طبيعيًا عن الوكالة، ويعود الضمير بحسب أقرب مرجع في السياق إلى الملك المذكور في الآية السابقة، مع إثبات احتمال آخر في الحاشية.
- source_word: πεμπομένοις
  choice: مُرسَلين
  rationale: يحافظ على صورة الإرسال والتفويض من غير تقوية المعنى إلى «مكلَّفين» أو «مفوَّضين».
- source_word: εἰς ἐκδίκησιν
  choice: لمعاقبة
  rationale: في السياق القضائي المدني، تؤدي «المعاقبة» معنى إنزال الجزاء أو تنفيذ العدالة، من غير الإيحاء بانفعال الانتقام الشخصي.
- source_word: κακοποιῶν
  choice: فاعلي الشر
  rationale: يحافظ على الصيغة التي تصف أشخاصًا يمارسون الشر، ويوازي «فاعلي الخير» لفظًا وبنيةً.
- source_word: ἔπαινον
  choice: مدح
  rationale: ينقل المعنى المباشر للثناء العلني أو الإشادة، ويحافظ على التقابل مع المعاقبة.
- source_word: ἀγαθοποιῶν
  choice: فاعلي الخير
  rationale: يحفظ الفكرة الفعلية، أي الذين يفعلون الخير، مع موازاة تعبير «فاعلي الشر».
theological_decisions:
- issue: مرجع الضمير في δι’ αὐτοῦ
  choice: الملك أو الإمبراطور المذكور في الآية السابقة هو المرجع الأقرب
  alternative: قد يُفهم الضمير على أنه عائد إلى الله من جهة ترتيبه الأوسع للسلطة
  rationale: المرجع الأقرب في السياق هو الملك في 2:13، وهذا يلائم فكرة تفويض الولاة مدنيًا؛ لكن الضمير اليوناني لا يصرّح بالمرجع، لذلك حُفظ الاحتمال الآخر في الحاشية بدل حسم التوتر لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «بوصفهم» لبيان وظيفة ὡς، وحُفظ التوازي بين «فاعلي الشر» و«فاعلي الخير». وُضع مؤشر الحاشية بعد الضمير مباشرة لأنه موضع الاحتمال التفسيري.
