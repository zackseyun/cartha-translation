    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: إنْ ... حقًّا
  rationale: يحافظ على الصيغة الشرطية اليونانية، بينما تنقل «حقًّا» قوتها البلاغية التي يُرجَّح أنها تفترض تحقق الشرط دون تحويله صراحةً إلى «بما أن».
- source_word: ἐγεύσασθε
  choice: قد ذقتم
  rationale: يحفظ صورة التذوق الحرفية، وهي ملائمة لصورة الغذاء في السياق القريب وللتلميح إلى مزمور 34:8، كما تشير «قد» إلى خبرة سابقة ذات صلة بالحاضر.
- source_word: ὅτι
  choice: أن
  rationale: تقدّم مضمون ما ذاقه المخاطبون بصورة مباشرة، موافقةً للبنية اليونانية.
- source_word: χρηστὸς
  choice: صالح
  rationale: اختيار واسع الدلالة يشمل الخير والإحسان، ويحفظ صدى عبارة المزمور من غير حصر المعنى في «لطيف» أو «رؤوف».
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب وثقله اللاهوتي، ويُبقي التداخل المقصود بين الإشارة السياقية إلى المسيح وصدى كلام المزمور عن الرب.
theological_decisions:
- issue: قوة جملة الشرط εἰ
  choice: 'الإبقاء على الشرط: «إنْ كنتم قد ذقتم حقًّا»'
  alternative: «بما أنكم قد ذقتم»
  rationale: يُرجَّح أن الشرط يفترض خبرة القراء الحقيقية، لكن النص اليوناني يظل مشروطًا؛ لذلك تحفظ الصياغة العربية الشكل البلاغي والتوتر المقصود.
- issue: مرجع لقب «الرب»
  choice: الرب، من غير إضافة تفسيرية
  alternative: الرب (المسيح)
  rationale: يرتبط المرجع في السياق بيسوع ارتباطًا وثيقًا، لكنه يردد أيضًا مزمور 34:8؛ وعدم التحديد يحفظ كلا البعدين ولا يُدخل شرحًا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «إنْ» الشرطية مع «حقًّا» لنقل القوة البلاغية، وحُفظت استعارة التذوق وصدى المزمور. جميع علامات الحواشي واردة في المتن.
