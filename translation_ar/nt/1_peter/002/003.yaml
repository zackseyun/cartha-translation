  text: إن كنتم قد ذقتم أن الرب صالح[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بما أنكم قد ذقتم». تأتي اليونانية في صيغة شرطية قد تفترض أن الشرط متحقق.'
