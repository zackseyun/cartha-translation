  source_fidelity: المعنى العام محفوظ، بما في ذلك المقابلة بين تحمّل الضرب بسبب الذنب وتحمّل الألم مع فعل الخير. لكن «تخطئون» قد تُفهم في العربية الحديثة على أنها ارتكاب أخطاء غير أخلاقية، فلا تنقل بوضوح دلالة ἁμαρτάνοντες («تذنبون»). كذلك فإن «فهذا نعمة لدى الله» غير مألوفة وملتبسة عربيًا؛ فخاتمة العبارة في سياقها تعني نيل القبول أو الحظوة لدى الله، لا تقرير أن هذا الأمر «نعمة» موجودة عند الله.
