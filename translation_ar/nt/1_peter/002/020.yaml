  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: ar
  text: فما الفضل لكم إن كنتم تذنبون وتُضرَبون فتصبرون؟ أمّا إن كنتم تفعلون الخير وتتألّمون فتصبرون، فهذا يحظى بقبولٍ عند الله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فهذا نعمة لدى الله». أو: «فهذا ينال حظوة عند الله» أو «فهذا ممدوح في نظر الله».'
    reason: توضيح أن χάρις في هذا السياق قد تفيد القبول أو الاستحسان لدى الله، مع الحفاظ على الصدى المعجمي للفظ «نعمة».
lexical_decisions:
- source_word: κλέος
  choice: مديح
  rationale: يدلّ هنا على الثناء أو الاستحسان الذي قد يناله المرء، لا على الشهرة أو المجد بمعناهما الواسع. وصيغة «فأي مديح لكم» تلائم السؤال الإنكاري بوضوح.
- source_word: ἁμαρτάνοντες
  choice: تخطئون
  rationale: يحفظ الدلالة الأخلاقية المباشرة للفعل، مع صياغة عربية طبيعية في هذا السياق.
- source_word: κολαφιζόμενοι
  choice: تُضرَبون
  rationale: الفعل يدل أصلًا على اللكم أو الضرب. واختير «تُضرَبون» لوضوحها وشمولها للإيذاء الجسدي المقصود، من غير استعمال لفظ قد يبدو محصورًا في ضربة واحدة.
- source_word: ὑπομενεῖτε
  choice: تصبرون
  rationale: ينقل معنى الثبات تحت الشدة واحتمالها، ويحافظ على تكرار الفعل في شطري المقابلة.
- source_word: ἀγαθοποιοῦντες
  choice: تفعلون الخير
  rationale: ترجمة مباشرة وطبيعية للفعل الذي يدل على عمل الصلاح أو الإحسان.
- source_word: πάσχοντες
  choice: تتألّمون
  rationale: ينقل المعنى العام للمعاناة، ولا يضيّقه إلى نوع محدد من سوء المعاملة.
- source_word: χάρις
  choice: نعمة
  rationale: يحفظ اللفظ المحوري وما فيه من صدى لاهوتي، مع بيان معنى القبول والاستحسان المحتمل في الحاشية.
- source_word: παρὰ θεῷ
  choice: لدى الله
  rationale: تعبير عربي طبيعي يدل على ما هو عند الله وفي تقديره، ويحفظ المعنى العلاقي لحرف الجر مع المجرور.
theological_decisions:
- issue: معنى χάρις في العبارة الختامية
  choice: «فهذا نعمة لدى الله» في المتن
  alternative: «فهذا ينال حظوة عند الله» أو «فهذا ممدوح في نظر الله»
  rationale: يمكن أن تدل العبارة على النعمة، أو على الحظوة والقبول في تقدير الله. أُبقي لفظ «نعمة» في المتن حفاظًا على الشفافية المعجمية والتوتر الدلالي، ووُضّح المعنى السياقي البديل في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على السؤال الإنكاري، وعلى المقابلة والتكرار بين الخطأ مع الضرب وفعل الخير مع الألم. استُعملت تراكيب المضارع مع «كنتم» لإبراز الطابع المستمر للمشاركات اليونانية من غير تكلف.
