  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: ar
  text: و«حجرَ عثرةٍ وصخرةً تُعثِر». إنهم يعثرون لأنهم لا يطيعون الكلمة، ولهذا أيضًا عُيِّنوا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولذلك أيضًا وُضعوا». قد تشير «لهذا» إلى عثارهم، أو إلى عدم طاعتهم، أو إلى النتيجة المذكورة كلها.'
    reason: لبيان الدلالة الأقرب حرفيًا لـἐτέθησαν، والحفاظ على غموض مرجع εἰς ὅ.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: حجر عثرة
  rationale: تعبير عربي واضح يحافظ على صورة الحجر الذي يتسبب في العثار، ويوافق الاقتباس الكتابي.
- source_word: πέτρα σκανδάλου
  choice: صخرة سقوط
  rationale: يحافظ على التوازي بين الحجر والصخرة، وينقل σκανδάλου هنا بوصفها سببًا للسقوط دون حصرها في معنى الإساءة الشعورية.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: لأنهم لا يطيعون الكلمة
  rationale: ἀπειθέω يدل على عدم الطاعة، ويمكن للتركيب اليوناني أن يبين سبب عثارهم؛ وصياغة «الكلمة» تبقي مدلول λόγος مفتوحًا على الرسالة المعلنة.
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: ولهذا أيضًا عُيِّنوا
  rationale: يحافظ على المبني للمجهول وعلى الإشارة الغامضة نسبيًا في εἰς ὅ، من غير تحديد زائد لما عُيِّنوا له.
theological_decisions:
- issue: مرجع «εἰς ὅ» ونطاق التعيين
  choice: ولهذا أيضًا عُيِّنوا
  alternative: ولعدم الطاعة هذا أيضًا عُيِّنوا / وللعثار أيضًا عُيِّنوا
  rationale: 'النص اليوناني يسمح بنقاش حول ما تشير إليه العبارة: العثار، أو عدم الطاعة، أو النتيجة المذكورة كلها. أبقى المتن الإشارة عامة، وتوضح الحاشية الاحتمال دون حسم لاهوتي زائد.'
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. استُخدم «إنهم» لاستئناف الجملة طبيعيًا، وحُفظ التوازي الشعري في الاقتباس والمبني للمجهول في خاتمة الآية.
