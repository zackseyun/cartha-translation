  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: ar
  text: يا خدم البيوت[a]، اخضعوا لسادتكم بكل توقير[b]، لا للسادة الصالحين الرفقاء فقط، بل للملتويين أيضًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عبيد البيوت». تشير الكلمة اليونانية تحديدًا إلى خدم المنزل أو عبيده، لا إلى الخدم بوجه عام.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في كل خوف». ويفيد اللفظ هنا التوقير أو الاحترام في الخضوع.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «القساة» أو «الظالمين». وتعني الكلمة اليونانية حرفيًا «المعوجّين» أو «الملتويين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: الخدم في البيوت
  rationale: يدل اللفظ تحديدًا على الخدم أو العبيد المنتمين إلى البيت، فحافظت الصياغة على الإطار المنزلي، مع بيان احتمال «عبيد البيوت» في الحاشية كيلا تُخفَّف حقيقة الوضع الاجتماعي.
- source_word: ὑποτασσόμενοι
  choice: اخضعوا
  rationale: اسم الفاعل يؤدي هنا وظيفة الأمر ضمن سياق الوصايا، وصيغة الأمر العربية طبيعية وواضحة وتحفظ معنى الخضوع.
- source_word: ἐν παντὶ φόβῳ
  choice: بكل خوف
  rationale: أُبقي المعنى المباشر لـ φόβος لأن هوية متعلَّق الخوف ليست محسومة تمامًا من العبارة نفسها، مع توضيح إمكان فهمه على أنه توقير أو احترام في الحاشية.
- source_word: δεσπόταις
  choice: لسادتكم
  rationale: «السادة» تعبّر عن أصحاب السلطة على خدم البيت في هذا السياق، من غير حصر المعنى في الملكية وحدها.
- source_word: ἀγαθοῖς
  choice: الصالحين
  rationale: تنقل الوصف الأخلاقي العام في ἀγαθός بوضوح، وتنسجم مع مقابلة الملتوين.
- source_word: ἐπιεικέσιν
  choice: الحلماء
  rationale: تنقل معنى الرفق واللين والمعاملة المتسامحة الذي يحمله ἐπιεικής، بلغة عربية فصيحة ومفهومة.
- source_word: σκολιοῖς
  choice: الملتويين
  rationale: يحفظ اللفظ الصورة المجازية الأصلية، أي الاعوجاج أو الالتواء الخُلقي، من غير تضييقه على القسوة أو الظلم وحدهما.
theological_decisions:
- issue: نقل الوضع الاجتماعي الذي يدل عليه οἰκέται دون تلطيفه أو المبالغة في تعميمه
  choice: الخدم في البيوت، مع ذكر «عبيد البيوت» في الحاشية
  alternative: عبيد البيوت
  rationale: اللفظ خاص بالتابعين العاملين داخل البيت، وقد يشمل من كانوا في وضع العبودية. المتن يحفظ التحديد المنزلي، والحاشية تمنع حجب البعد الاستعبادي المحتمل.
- issue: هل يُفسَّر φόβος في المتن بأنه احترام أم يُحفظ لفظ الخوف
  choice: بكل خوف
  alternative: بكل احترام / بكل توقير
  rationale: الترجمة الحرفية تحافظ على الغموض الحقيقي في العبارة وعلى صلتها باستعمال «الخوف» في السياق القريب، بينما تعرض الحاشية المعنى السياقي المحتمل من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كريمة وواضحة. استُعمل النداء الصريح «أيها» لإظهار المخاطَبين، وصيغة الأمر لتأدية وظيفة اسم الفاعل الأمرية. حُفظت استعارة «الملتويين» مع شرحها في الحاشية.
