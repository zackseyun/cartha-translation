lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: بعد أن تطرحوا عنكم
  rationale: صياغة عربية طبيعية تحفظ كون اللفظة اسم فاعل ظرفيًا يمهّد للأمر الوارد في العدد التالي، كما تعكس دلالة التخلّي والإبعاد من غير تحويلها إلى أمر مستقل.
- source_word: οὖν
  choice: فإذًا
  rationale: تُظهر الفاء الصلة بما سبق، وتبيّن «إذًا» أن الوصية نتيجة لما ورد في 1:‏22–25.
- source_word: πᾶσαν κακίαν
  choice: كل خبث
  rationale: «الخبث» يدل على الشر وسوء القصد، ويلائم سياق قائمة الرذائل من غير حصر المعنى في صورة واحدة.
- source_word: πάντα δόλον
  choice: كل خداع
  rationale: «الخداع» تعبير عربي واضح ومعاصر عن الاحتيال والمكر المقصودين بلفظة δόλος.
- source_word: ὑποκρίσεις
  choice: كل أشكال الرياء
  rationale: تؤدي العبارة معنى الجمع اليوناني، أي صور الرياء المتنوعة أو المتكررة، بأسلوب عربي طبيعي.
- source_word: φθόνους
  choice: الحسد
  rationale: اسم الجنس «الحسد» هو التعبير العربي الطبيعي، ويشمل حالات الحسد المتعددة التي يدل عليها الجمع اليوناني.
- source_word: πάσας καταλαλιάς
  choice: كل كلامٍ مسيء في حق الآخرين
  rationale: يحفظ هذا التعبير المجال الواسع للفظة، وهو الكلام على الآخرين بما يسيء إليهم، من غير تضييقها على الافتراء الكاذب وحده.
theological_decisions:
- issue: صياغة قائمة الرذائل ونطاقها الأخلاقي
  choice: ترجمة كل رذيلة ترجمة ملموسة من غير توسيع عقائدي أو تفسير مذهبي
  alternative: ترجمة κακία بلفظ أوسع مثل «الشر»، وترجمة καταλαλιάς بلفظ أضيق مثل «الافتراءات» أو «الاغتياب»
  rationale: السياق حثّ أخلاقي؛ والصياغة المختارة تحافظ على قوة القائمة العملية وعلى سعة دلالة الكلام المسيء للآخرين.
- issue: العلاقة النحوية بين العددين 1 و2
  choice: 'الإبقاء على العبارة بوصفها تمهيدًا ظرفيًا للأمر في العدد التالي: «بعد أن تطرحوا»'
  alternative: 'تحويلها إلى أمر مستقل: «اطرحوا»؛ أو ترجمتها حرفيًا: «طارحين»'
  rationale: اللفظة اليونانية اسم فاعل ماضٍ مرتبط نحويًا بالفعل الأمري في العدد 2، فلا ينبغي أن تُعرض كأنها أمر مستقل بلا إشارة إلى تلك العلاقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «كل أشكال الرياء والحسد» لتأدية صيغ الجمع اليونانية من دون جمعٍ عربي متكلّف، وبقيت الفاصلة الختامية لأن تركيب العدد يتصل نحويًا بالعدد التالي.
