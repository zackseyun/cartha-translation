base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: ar
  text: أنتم الذين لم تكونوا من قبل شعبًا[a]، أما الآن فأنتم شعب الله؛ وأنتم الذين لم تُظهَر لكم رحمة[b]، أما الآن فقد أُظهرت لكم رحمة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُردِّد بطرس صدى هوشع 1:9-10؛ 2:23، ويطبّق لغة استعادة إسرائيل على هوية قرّائه الحاضرة ضمن شعب الله.
    reason: cross_reference
  - marker: b
    text: 'أو: «أنتم الذين لم تنالوا رحمة، أما الآن فقد نلتم رحمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: أنتم الذين / والذين
  rationale: ضمير الوصل في صيغة الجمع يعود إلى المخاطَبين في الآية السابقة. أُظهر الخطاب في صدر الجملة بعبارة «أنتم الذين»، ثم استُعمل «والذين» في الشطر الموازي تجنبًا للتكلف.
- source_word: ποτε
  choice: من قبل
  rationale: تدل على الحالة السابقة في مقابل νῦν «الآن»، و«من قبل» عربية واضحة وطبيعية.
- source_word: λαὸς
  choice: شعبًا / شعب الله
  rationale: يحمل اللفظ معنى جماعيًا وعهديًا. تُبقي «شعبًا» العبارة الأولى غير مضافة كما في اليونانية، بينما تنقل «شعب الله» تركيب λαὸς θεοῦ بدقة.
- source_word: θεοῦ
  choice: الله
  rationale: نُقل المضاف إليه في العبارة الطبيعية «شعب الله»، بما يحفظ معنى الانتماء دون زيادة تفسيرية.
- source_word: οὐκ ἠλεημένοι
  choice: لم تكونوا قد نلتم رحمة
  rationale: ينقل التركيب حالة سابقة ناتجة عن عدم تلقي الرحمة، ويحافظ «نلتم رحمة» على كون المخاطَبين متلقين لها.
- source_word: ἐλεηθέντες
  choice: فقد نلتم رحمة
  rationale: ينقل المبني للمجهول من جهة المعنى بوصفهم متلقي الرحمة، مع إبراز التحول إلى حالهم الحاضر بواسطة «الآن» و«قد».
- source_word: δὲ
  choice: أما ... فـ
  rationale: هذا التركيب العربي يوضح المقابلة في الموضعين بصورة فصيحة وطبيعية بدل تكرار «لكن».
- source_word: νῦν
  choice: الآن
  rationale: تحفظ الإشارة الزمنية المباشرة إلى وضعهم الحاضر في مقابل حالتهم السابقة.
theological_decisions:
- issue: التلميح إلى هوشع ولغة الهوية العهدية
  choice: 'الإبقاء على التدرج النصي: «لم تكونوا ... شعبًا» ثم «شعب الله».'
  alternative: تفسير الشطر الأول أيضًا بعبارة «لم تكونوا شعب الله».
  rationale: النص اليوناني لا يذكر «الله» في الشطر الأول، لكنه يذكره في الثاني. يحفظ هذا الاختلاف صدى هوشع والتحول الجماعي العهدي دون تضييق المعنى على دعوى عرقية أو طائفية.
- issue: صيغة الرحمة المبنية للمجهول
  choice: «نلتم رحمة» في الشطرين.
  alternative: «لم تُظهَر لكم رحمة ... أُظهرت لكم رحمة».
  rationale: الصياغة المختارة عربية مألوفة وتحفظ دور المخاطَبين بوصفهم متلقي الرحمة، من غير التصريح باسم الفاعل الذي لم يرد في العبارة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل بناء «أما الآن» لإبراز المقابلة المتوازية، وحُفظت العلامتان [a] و[b] في موضعيهما في المتن.
