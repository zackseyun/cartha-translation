source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: ar
  text: حافظوا على سيرة حسنة بين الأمم، لكي يمجّدوا الله في يوم الافتقاد، بسبب أعمالكم الحسنة التي يعاينونها، في ما يتكلمون عليكم بالسوء على أنكم فاعلو شر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي، في ما يتكلمون عليكم بالسوء بوصفكم فاعلي شر، يمجّدوا الله في يوم الافتقاد بسبب أعمالكم الحسنة التي يعاينونها».'
    reason: يبين ترتيبًا عربيًا أقرب إلى تسلسل اليونانية، ويحافظ على صلة عبارة «في ما» بكلامهم المسيء دون تحويلها إلى «مع أنهم».
lexical_decisions:
- source_word: ἀναστροφή
  choice: سيرة
  rationale: تدل هنا على نمط الحياة والسلوك العملي، و«السيرة» عربية فصيحة ومفهومة تؤدي المعنى بإيجاز.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: بين الأمم
  rationale: يحافظ على مدلول ἔθνη بوصفهم غير اليهود المحيطين بالمؤمنين، من غير استبداله بتفسير طائفي أو اجتماعي أضيق.
- source_word: καλήν / καλῶν
  choice: حسنة / الحسنة
  rationale: يحافظ على الصلة اللفظية بين السيرة الحسنة والأعمال الحسنة، وينقل معنى الجودة الأخلاقية الظاهرة.
- source_word: καταλαλοῦσιν
  choice: يفترون فيه عليكم
  rationale: السياق يتضمن كلامًا مسيئًا يتهمهم بفعل الشر؛ «يفترون عليكم» ينقل الاتهام الباطل بعبارة عربية طبيعية.
- source_word: ἐποπτεύοντες
  choice: إذ يرون
  rationale: يفيد المعاينة والملاحظة المباشرة؛ «يرون» واضحة وسلسة، مع بيان العلاقة الظرفية بالسياق.
- source_word: ἡμέρᾳ ἐπισκοπῆς
  choice: يوم الافتقاد
  rationale: يحفظ العبارة الكتابية وعمقها الدلالي، إذ يمكن أن تشير إلى مجيء الله للفحص أو الخلاص أو الدينونة بحسب السياق.
theological_decisions:
- issue: دلالة «يوم الافتقاد»
  choice: الإبقاء على «يوم الافتقاد» من غير تفسير داخل المتن
  alternative: يوم زيارة الله / يوم القضاء
  rationale: لفظ ἐπισκοπή يحتمل زيارة الله التي تحمل عناية أو فحصًا ودينونة، وتحديد معنى واحد في المتن يزيل توترًا مقصودًا.
- issue: العلاقة المنطقية في ἐν ᾧ καταλαλοῦσιν
  choice: «في الأمر الذي يفترون فيه عليكم»
  alternative: «مع أنهم يفترون عليكم»
  rationale: النص اليوناني يقول حرفيًا «في ما/في الأمر الذي»، ولذلك حُفظ هذا التركيب بدل تحويله إلى علاقة تنازلية غير مصرّح بها.
- issue: سبب تمجيد الله
  choice: ربطه برؤية الأعمال الحسنة
  alternative: اعتبار التمجيد صادرًا حصرًا عن اهتدائهم قبل يوم الافتقاد
  rationale: النص يذكر المعاينة والتمجيد ولا يصرّح تفصيلًا بآلية الاهتداء أو توقيته، فلا تُضاف نتيجة عقدية غير منصوص عليها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «سيرة» بمعنى نمط الحياة، وحُفظت العبارة الكتابية «يوم الافتقاد». وُضع الفعل الغائي «يمجّدوا» قريبًا من «لكي»، مع إعادة ترتيب معتدلة تجعل الجملة طبيعية في العربية وتحافظ على الغموض الحقيقي في ἐν ᾧ.
