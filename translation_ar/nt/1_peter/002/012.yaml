  to: حافظوا على سيرة حسنة بين الأمم، لكي يمجّدوا الله في يوم الافتقاد، بسبب أعمالكم الحسنة التي يعاينونها، في ما يتكلمون عليكم بالسوء على أنكم فاعلو شر.[a]
  rationale: تستبقي المراجعة الألفاظ الكتابية الرئيسة والبنية الغائية، لكنها تزيل افتراض الكذب من «يفترون» وتعيد تنظيم الجملة بحيث تكون معاينة الأعمال الحسنة سببًا لتمجيد الله، مع بقاء العلاقة التي تفيدها «في ما» غير محوّلة إلى علاقة تنازلية.
