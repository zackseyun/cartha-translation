  source_fidelity: يحتاج المتن إلى تعديل محدود. الفعل καταλαλοῦσιν يعني التكلّم بالسوء/الافتراء اللفظي ضدّ المخاطَبين، ولا يقتضي بذاته تقرير أن الاتهام كذب؛ لذا «يفترون» أضيق من الأصل. كما أن ترتيب «إذ يرون أعمالكم ... في الأمر الذي» يوهم بأن المعاينة تقع في ذلك الأمر، بينما المعاينة للأعمال الحسنة هي الأساس المذكور لتمجيد الله.
  naturalness: «ولتكن سيرتكم» مفهومة، لكن «حافظوا على سيرة حسنة» أيسر في العربية المعاصرة وأقرب إلى قوة اسم الفاعل اليوناني في هذا السياق. و«يتكلمون عليكم بالسوء، على أنكم فاعلو شر» طبيعي وواضح، مع الحفاظ على علاقة «فيما» دون تحويلها إلى تنازل صريح.
  terminology: «السيرة»، «الأمم»، «الأعمال الحسنة»، و«يوم الافتقاد» اختيارات سليمة. أبقيت «يوم الافتقاد» بلا شرح تفسيري في المتن لصون سعة دلالة ἡμέρα ἐπισκοπῆς. واستبدلت «يفترون» بعبارة لا تفترض كذب الاتهام خارج ما يقتضيه لفظ التشنيع.
