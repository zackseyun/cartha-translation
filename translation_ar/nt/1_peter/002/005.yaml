  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: ar
  text: وأنتم أيضًا، كحجارة حيّة[a]، تُبنَون لتصيروا بيتًا روحيًا[b]، ولتكونوا جماعة كهنوتية مقدّسة[c]، لكي تقدّموا ذبائح روحية مقبولة لدى الله بوساطة يسوع المسيح[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «بوصفكم حجارة حيّة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تُبنَون بيتًا روحيًا»؛ ويجوز: «تُبنَون كبيت روحي».'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أن تفيد العبارة اليونانية أيضًا: «إلى جماعة كهنوتية مقدّسة» أو «لأجل جماعة كهنوتية مقدّسة»؛ فحرف الجر قد يدل على الغاية أو النتيجة. كما يحتمل التركيب وصل العبارة بما قبلها على نحو أوثق: «تُبنَون بيتًا روحيًا إلى جماعة كهنوتية مقدّسة».'
    reason: alternative_reading
  - marker: d
    text: 'اليونانية: «يسوع خريستوس»؛ و«المسيح» هنا لقب معناه «الممسوح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: وأنتم أيضًا
  rationale: يحفظ معنى الإضافة في καί والتوكيد في الضمير αὐτοί، مع مخاطبة القرّاء بصيغة الجمع.
- source_word: ὡς λίθοι ζῶντες
  choice: كحجارة حيّة
  rationale: ينقل التشبيه وصورة الحجارة التي تتصف بالحياة، ويربطها بصورة المسيح بوصفه الحجر الحي في السياق السابق.
- source_word: οἰκοδομεῖσθε
  choice: تُبنَون
  rationale: يحفظ صيغة المضارع المبني للمجهول، فلا يصرّح بفاعل لم تسمّه الآية، ويفيد عملية البناء الجارية.
- source_word: οἶκος πνευματικὸς
  choice: بيتًا روحيًا
  rationale: يحفظ استعارة البناء، ويعرض العبارة بوصفها مكمّلة لفعل البناء دون إضافة فاعل أو تفسير لطبيعة الروحانية.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: لتكونوا جماعة كهنوتية مقدّسة
  rationale: تعبّر لام الغاية عن دلالة الغاية أو النتيجة في εἰς، وتوضح «جماعة كهنوتية» أن ἱεράτευμα يدل على هيئة كهنوتية جماعية لا على أفراد متفرقين فحسب.
- source_word: ἀνενέγκαι
  choice: فتقدّموا
  rationale: ينقل المعنى الاصطلاحي للفعل في سياق تقديم الذبائح، وتفيد الفاء ارتباط هذه الغاية بما قبلها.
- source_word: πνευματικὰς θυσίας
  choice: ذبائح روحية
  rationale: ترجمة مباشرة تحافظ على الصورة التعبدية من غير تحديد ماهية هذه الذبائح بما يتجاوز النص.
- source_word: εὐπροσδέκτους θεῷ
  choice: مقبولة لدى الله
  rationale: يحفظ لغة قبول الذبيحة ودلالة المجرور اليوناني المتجهة إلى الله بأسلوب عربي طبيعي.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: بيسوع المسيح
  rationale: الباء تنقل معنى الوساطة أو الوسيلة في διά مع المضاف إليه، و«المسيح» تنقل Χριστός بوصفه لقبًا معروفًا ليسوع في العربية.
theological_decisions:
- issue: دلالة المبني للمجهول في οἰκοδομεῖσθε
  choice: تُبنَون، من غير تسمية الفاعل
  alternative: ابنوا أنفسكم أو يبنيكم الله
  rationale: الصيغة اليونانية مبنية للمجهول، والسياق يرجّح أن المؤمنين واقع عليهم فعل البناء؛ لذلك لا تُحوَّل إلى أمر انعكاسي ولا يُضاف اسم فاعل غير مذكور صراحة.
- issue: دلالة εἰς قبل ἱεράτευμα ἅγιον
  choice: لتكونوا جماعة كهنوتية مقدّسة
  alternative: إلى جماعة كهنوتية مقدّسة أو لأجل جماعة كهنوتية مقدّسة
  rationale: قد تدل εἰς على الغاية أو النتيجة. اختير تركيب عربي طبيعي يفيد الغاية، مع إثبات البدائل في الحاشية صونًا للاتساع الدلالي.
- issue: العلاقة النحوية بين «بيتًا روحيًا» و«جماعة كهنوتية مقدّسة»
  choice: اعتبارهما صورتين مترابطتين للجماعة المبنية
  alternative: ربط «إلى جماعة كهنوتية» مباشرة بعملية بناء البيت على نحو أوثق
  rationale: تركيب اليونانية موجز ويحتمل اختلافًا في تحديد العلاقة الدقيقة بين العبارتين؛ أبقى المتن الصورتين متتابعتين، وتذكر الحاشية احتمال الربط البديل.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: المسيّا أو الممسوح
  rationale: «المسيح» في العربية الفصحى لقب مفهوم وشائع ينقل الوظيفة اللقبية لـΧριστός من غير معاملته كاسم شخصي صرف.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. استُعمل المبني للمجهول للمحافظة على صوت الأصل، و«جماعة كهنوتية» لتوضيح الدلالة الجماعية للكلمة اليونانية وتجنّب فهمها على أنها منصب فردي فقط. ضُبطت جميع علامات الحواشي في المتن وربطت بمواضعها.
