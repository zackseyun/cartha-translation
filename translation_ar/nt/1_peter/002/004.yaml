  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: ar
  text: وأنتم تأتون إليه[a]، وهو حجرٌ حيّ رفضه الناس، لكنه لدى الله مختارٌ مكرَّم[b].
  philosophy: optimal-equivalence
  footnotes:
