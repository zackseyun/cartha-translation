lexical_decisions:
- source_word: Πρὸς ὃν προσερχόμενοι
  choice: وإذ تأتون إليه
  rationale: ينقل اتجاه الحركة نحو المشار إليه، ويعبّر عن اسم الفاعل المضارع بصيغة زمنية تدل على فعل مستمر مرتبط بسياق الكلام، من غير تحويله إلى أمر صريح.
- source_word: λίθον ζῶντα
  choice: وهو حجر حيّ
  rationale: يحافظ على استعارة حجر البناء وعلى المفارقة المقصودة في وصف الحجر بأنه حيّ، مع إضافة «وهو» لتستقيم العبارة العربية بوصفها بدلًا تفسيريًا.
- source_word: ὑπὸ ἀνθρώπων
  choice: قد رفضه الناس
  rationale: «الناس» هو المقابل العربي الطبيعي الجامع لـἀνθρώπων، ويحفظ المقابلة بين حكم البشر وحكم الله من غير إيحاء بأن الذكور وحدهم هم المقصودون.
- source_word: ἀποδεδοκιμασμένον
  choice: قد رفضه
  rationale: صيغة «قد» مع الماضي تعبّر بوضوح عن حالة ناتجة من رفض سابق، وهو ما يلائم دلالة اسم المفعول التام في اليونانية؛ ولا تُثقَل العبارة بإظهار معنى الفحص السابق الذي يتضمنه اللفظ في هذا السياق.
- source_word: παρὰ δὲ θεῷ
  choice: لكنه لدى الله
  rationale: «لدى الله» تنقل التقييم والمكانة في نظر الله، وتحافظ على المقابلة الصريحة مع رفض الناس.
- source_word: ἐκλεκτὸν
  choice: مختار
  rationale: لفظ عربي واضح يحفظ معنى الاختيار من غير إدخال مصطلح مذهبي زائد.
- source_word: ἔντιμον
  choice: عزيز
  rationale: «عزيز» يفيد علو القيمة والمكانة، ويلائم وصف الحجر؛ وتُذكر دلالة التكريم أو النفاسة البديلة في الحاشية.
theological_decisions:
- issue: مرجع الضمير وصورة الحجر
  choice: الإبقاء على الضمير «إليه» ووصف المشار إليه بأنه حجر حيّ
  alternative: التصريح باسم المسيح أو الرب
  rationale: السياق القريب والاقتباسات المتعلقة بالحجر في 2:6-8 تشير إلى المسيح، لكن النص اليوناني هنا يستعمل ضميرًا، لذلك لا يُضاف الاسم إلى المتن.
- issue: دلالة ἔντιμον
  choice: عزيز
  alternative: نفيس أو مكرَّم
  rationale: يجمع الاختيار قدر الإمكان بين القيمة الرفيعة والمكانة المكرمة، مع إبقاء المجال الدلالي الأوسع ظاهرًا في الحاشية بدل حصره في معنى واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الناس» للدلالة الطبيعية على البشر عمومًا، وحُفظت استعارة «الحجر الحي» من غير تفسير داخل المتن.
