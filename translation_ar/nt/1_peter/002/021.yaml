base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: ar
  text: فَإِنَّكُمْ إِلَى هٰذَا دُعِيتُمْ، لِأَنَّ الْمَسِيحَ أَيْضًا تَأَلَّمَ لِأَجْلِكُمْ، تَارِكًا لَكُمْ مِثَالًا[a] لِكَيْ تَتَّبِعُوا خُطُوَاتِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نموذجًا»؛ تشير الكلمة اليونانية أيضًا إلى نموذجٍ للكتابة يُوضَع أمام المتعلّمين ليتتبّعوا حروفه أو خطوطه.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: فلهذا
  rationale: تشير العبارة إلى ما سبق من احتمال الألم ظلمًا، وتحفظ معنى التوجّه أو الغاية من غير توسّع تفسيري.
- source_word: ἐκλήθητε
  choice: دُعيتم
  rationale: صيغة المبني للمجهول تحفظ دلالة الدعوة الإلهية من غير تحديد مذهبي لطبيعتها.
- source_word: ὅτι
  choice: لأنّ
  rationale: تبيّن الأساس أو السبب الذي يفسّر هذه الدعوة.
- source_word: Χριστὸς
  choice: المسيح
  rationale: المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالته بوصفه الممسوح.
- source_word: ἔπαθεν
  choice: تألّم
  rationale: ينقل الفعل ببساطة من غير إضافة الموت أو نوع الألم، إذ لا يحددهما هذا العدد.
- source_word: ὑπὲρ ὑμῶν
  choice: لأجلكم
  rationale: يحفظ المعنى النفعي والنيابي المحتمل من غير حصر العبارة في تفسير بدلي أضيق.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: تاركًا لكم
  rationale: يحفظ تعلق اسم الفاعل بالمسيح وكون ما تركه موجّهًا إلى المخاطبين.
- source_word: ὑπογραμμὸν
  choice: مثالًا
  rationale: تعبير عربي واضح عن النموذج المحتذى، مع بيان الصورة التعليمية الأخص في الحاشية.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغرض بوضوح وطبيعية.
- source_word: ἐπακολουθήσητε
  choice: تتبعوا
  rationale: ينقل معنى الاقتفاء المقصود في تركيب غائي من غير إثقال الأسلوب العربي بأداة احتمال غير لازمة.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: خطواته
  rationale: يحفظ استعارة اقتفاء آثار المسير في تعبير عربي طبيعي ومفهوم.
theological_decisions:
- issue: دلالة ὑπὲρ ὑμῶν في آلام المسيح
  choice: لأجلكم
  alternative: نيابةً عنكم / عوضًا عنكم
  rationale: السياق يصرّح بأن المسيح تألم لمنفعة المخاطبين ويركّز هنا أيضًا على كونه مثالًا لهم. «لأجلكم» تبقي المجال للدلالة النيابية المحتملة من غير فرض صياغة كفارية أضيق مما يصرح به هذا العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «المسيح» لقبًا، وحُفظت استعارة اقتفاء الخطوات والصورة التعليمية الكامنة في «مثال» بالحاشية.
