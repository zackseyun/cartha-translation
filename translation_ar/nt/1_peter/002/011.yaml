id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: ar
  text: أيها الأحباء، أحثكم، بوصفكم غرباء ونزلاء[a]، على الامتناع عن الرغبات الجسدية[b] التي تشن حربًا على النفس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أجانب ومقيمين مؤقتين». يؤكد اللفظان معًا أن المؤمنين لا ينتمون انتماءً كاملًا إلى هذا العصر أو مجتمعه.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «رغبات الجسد»، أو، على نحو تفسيري أكثر: «الرغبات الخاطئة».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «الحياة» أو «الذات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: أيها الأحباء
  rationale: صيغة نداء جمع تنقل المودة وتحافظ على الصلة اللفظية بالمحبة، بأسلوب عربي فصيح ومألوف.
- source_word: παρακαλῶ
  choice: أحثكم
  rationale: ينقل قوة الالتماس الجاد والحث الأخلاقي في السياق، من غير أن يبدو اصطلاحيًا أو متكلفًا.
- source_word: ὡς
  choice: بوصفكم
  rationale: يحافظ على معنى الصفة أو الهوية التي يخاطبهم الرسول على أساسها، من غير إضافة معنى سببي صريح.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: غرباء ونزلاء
  rationale: يحافظ اللفظان المتجاوران على صورة أناس لا ينتمون انتماءً كاملًا إلى موضع إقامتهم، مع التمييز بين الغربة والإقامة المؤقتة.
- source_word: ἀπέχεσθαι
  choice: على الامتناع
  rationale: يفيد الابتعاد المستمر المقصود عن شيء، ويلائم تركيب «أحثكم على» في العربية الطبيعية.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: الرغبات الجسدية
  rationale: يحافظ على صلة الصفة بالجسد وعلى عموم معنى الرغبات، من غير حصرها في الرغبة الجنسية أو تفسيرها مباشرة بأنها خطايا.
- source_word: αἵτινες
  choice: التي
  rationale: يصل الجملة التفسيرية بمرجعها بصورة طبيعية، ويبين صفة هذه الرغبات.
- source_word: στρατεύονται κατὰ
  choice: تشن حربًا على
  rationale: يحفظ الاستعارة العسكرية وقوة العداء الفاعل في الفعل اليوناني.
- source_word: τῆς ψυχῆς
  choice: النفس
  rationale: يحافظ على الثقل الإنساني واللاهوتي للفظ من غير قصره على الحياة البيولوجية أو فرض ثنائية تقنية بين الجسد والنفس.
theological_decisions:
- issue: دلالة σαρκικῶν في السياق الأخلاقي
  choice: الجسدية
  alternative: الخاطئة؛ أو التي من الجسد
  rationale: يحفظ الاختيار استعارة الجسد والتوتر الدلالي في الأصل، ولا يستبدلها سلفًا بتفسير عقائدي مثل «الطبيعة الخاطئة».
- issue: دلالة ψυχή
  choice: النفس
  alternative: الحياة؛ أو الذات
  rationale: «النفس» تحفظ اتساع اللفظ ووزنه في هذا السياق، مع عدم الجزم بأن المقصود جزء منفصل من الإنسان أو مجرد حياته الجسدية.
- issue: هوية المخاطبين بوصفهم παροίκους καὶ παρεπιδήμους
  choice: غرباء ونزلاء
  alternative: أجانب ومقيمون مؤقتون
  rationale: يبقي النص صورة عدم الانتماء الكامل من دون حسم ما إذا كان الوصف اجتماعيًا حرفيًا أو روحيًا ولاهوتيًا فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أيها الأحباء» للنداء الحميم، و«تشن حربًا» للحفاظ على حيوية الصورة العسكرية. وُضعت علامات الحواشي بعد العبارات التي تشرحها مباشرة.
