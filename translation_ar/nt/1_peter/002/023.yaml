base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: ar
  text: الذي، حين كان يُشتَم، لم يكن يردّ الشتيمة بمثلها[a]؛ وحين كان يتألّم، لم يكن يهدِّد، بل كان يودع نفسه لدى الذي يحكم بالعدل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين كان يُهان، لم يكن يُهين في المقابل».'
    reason: lexical_alternative
  - marker: b
    text: 'لا يذكر الفعل اليوناني مفعوله صراحة؛ أو: «كان يكل أمره إلى الذي يحكم بالعدل».'
    reason: source_ambiguity
lexical_decisions:
- source_word: ὃς
  choice: الذي
  rationale: اسم موصول يعود على المسيح المذكور في السياق السابق، ويحافظ على اتصال الجملة بما قبلها.
- source_word: λοιδορούμενος
  choice: حين كان يُشتَم
  rationale: ينقل الإساءة اللفظية التي يدل عليها الفعل، مع صياغة زمنية طبيعية وموازية لعبارة «حين كان يتألّم».
- source_word: οὐκ ἀντελοιδόρει
  choice: لم يكن يَشتِم ردًّا على الشتم
  rationale: يُظهر الطبيعة اللفظية للإساءة ومعنى المقابلة في السابقة ἀντι-، كما تساعد صيغة «لم يكن» على إبراز الجانب الاستمراري أو السلوك المتكرر في صيغة الماضي الناقص اليونانية.
- source_word: πάσχων
  choice: حين كان يتألّم
  rationale: صياغة زمنية سلسة تحافظ على موازاة الجملة الوصفية السابقة، و«يتألّم» تلائم سياق آلام المسيح.
- source_word: οὐκ ἠπείλει
  choice: لم يكن يهدِّد
  rationale: ينقل معنى التلفظ بالتهديد، مع الحفاظ على الجانب الاستمراري أو السلوكي للفعل في الماضي الناقص.
- source_word: παρεδίδου
  choice: ظلّ يسلِّم نفسه
  rationale: «ظلّ» تعكس الجانب الاستمراري للماضي الناقص. أُضيفت «نفسه» بوصفها المفعول المفهوم من السياق، مع التنبيه في الحاشية إلى أن اليونانية لا تصرّح به.
- source_word: τῷ κρίνοντι δικαίως
  choice: إلى الذي يقضي بالعدل
  rationale: يحافظ على الوصف الفعلي المستمر وعلى كون δικαίως حالًا يصف كيفية القضاء، من غير تحويل العبارة إلى لقب صريح.
- source_word: δὲ
  choice: بل
  rationale: تُبرز المقابلة بين امتناعه عن الانتقام وبين استجابته الإيجابية بتسليم نفسه إلى الديّان العادل.
theological_decisions:
- issue: مرجع عبارة «الذي يقضي بالعدل»
  choice: الإبقاء على المرجع وصفيًّا كما في اليونانية، مع فهم الله ضمنًا من السياق
  alternative: التصريح بعبارة «الله الذي يقضي بالعدل» أو «الآب»
  rationale: السياق يدل على الله، لكن النص اليوناني لا يذكر اسم «الله» ولا لقب «الآب» هنا؛ لذلك تحافظ الصياغة الوصفية على دقة النص ولا تحسم ما لم يصرّح به.
- issue: المفعول المحذوف مع παρεδίδου
  choice: «يسلِّم نفسه» مع حاشية توضّح أن المفعول مفهوم لا مذكور صراحة
  alternative: «يسلِّم أمره» أو ترك الفعل بلا مفعول
  rationale: المعنى الانعكاسي مرجّح في السياق وصياغته طبيعية بالعربية، لكن الحاشية تحفظ غموض التركيب اليوناني ولا تجعله تصريحًا أصليًّا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت تراكيب «كان» و«ظلّ» لإظهار الاستمرار أو السلوك المتكرر الذي توحي به صيغ الماضي الناقص اليونانية، مع تجنّب الألفاظ الكنسية الاصطلاحية غير اللازمة.
