id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: ar
  text: هو نفسه حمل خطايانا في جسده على الخشبة[a]، لكي نموت عن الخطايا فنحيا للبرّ. وبجرحه[b] شُفيتم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «على الصليب». العبارة اليونانية حرفيًا «على الخشبة»، وتحفظ لفظ ξύλον، ويُرجَّح أنها تردّد صدى تثنية 21:23.
    reason: alternative_reading
  - marker: b
    text: أو «برضّته» أو «بأثر ضربه». جاء الاسم مفردًا، وفيه صدى إشعياء 53:5.
    reason: lexical_alternative
  - marker: c
    text: ورد الشفاء هنا بعبارة واسعة. ويربطه السياق بالخطايا والبرّ، من غير أن يقصر معناه صراحةً على الشفاء الجسدي وحده أو الروحي وحده.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: حمل
  rationale: يحفظ معنى حمل الخطايا وصدى إشعياء، من غير حصر اللفظ في معنى تقديم الذبيحة، مع أن السياق يحتمل إيحاءً ذبائحيًا.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: في جسده
  rationale: نقل مباشر ومحسوس للعبارة اليونانية، مع إبقاء توكيد αὐτός في «هو نفسه» بدل تكراره هنا.
- source_word: ἐπὶ τὸ ξύλον
  choice: على الخشبة
  rationale: «الخشبة» عربية طبيعية في سياق الصلب وتحفظ لفظ ξύλον وصدى تثنية 21:23 أكثر من استبداله صراحةً بـ«الصليب».
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: نموت عن الخطايا
  rationale: ينقل معنى الانفصال الحاسم عن الخطايا بصياغة عربية مفهومة، ويحافظ على جمع «الخطايا» وعلى الترابط الغائي مع «فنحيا».
- source_word: τῇ δικαιοσύνῃ
  choice: للبرّ
  rationale: «البرّ» المقابل الكتابي العربي الطبيعي لـδικαιοσύνη هنا، واللام تعبّر عن حياة متجهة إلى البر ومكرسة له.
- source_word: μώλωπι
  choice: جرحه
  rationale: يدل μώλωψ على أثر الضرب من جرح أو رضّة. «جرحه» واضح في العربية المعاصرة ويحفظ المفرد وصدى إشعياء 53:5.
- source_word: ἰάθητε
  choice: شُفيتم
  rationale: ينقل المبني للمجهول الماضي بإيجاز ويحفظ سعة صورة الشفاء من غير قصرها على الشفاء الجسدي أو تفسيرها تفسيرًا روحيًا حصريًا.
- source_word: αὐτὸς
  choice: هو نفسه
  rationale: يُظهر التوكيد الصريح في اليونانية على أن المسيح ذاته هو الذي حمل الخطايا.
theological_decisions:
- issue: مدى الشفاء في العبارة الختامية
  choice: إبقاء «شُفيتم» من غير تقييد نوع الشفاء
  alternative: «شُفيتم من الخطية» أو «شُفيتم جسديًا»
  rationale: السياق يربط الشفاء بالخطايا والبر، مع استدعاء إشعياء 53، لكن النص لا يضيف مفعولًا يحدد الشفاء؛ لذلك تُحفظ سعته وتوتره اللاهوتي.
- issue: ترجمة ξύλον
  choice: الخشبة
  alternative: الصليب
  rationale: المقصود تاريخيًا هو الصلب، لكن اللفظ اليوناني ξύλον لا σταυρός؛ و«الخشبة» تحفظ اللفظ والصدى الكتابي من غير أن تحجب المرجع.
- issue: قوة ἀπογενόμενοι بالنسبة إلى الخطايا
  choice: نموت عن الخطايا
  alternative: ننقطع عن الخطايا أو نكفّ عنها
  rationale: الصياغة بالموت تنقل الانفصال الحاسم وتنسجم بلاغيًا مع «فنحيا»، من غير تقرير مذهب يتجاوز العبارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الخشبة» للمحافظة على الصورة الأصلية، و«للبرّ» بوصفها صياغة كتابية مألوفة ومفهومة. وُضعت علامات الحواشي مباشرة بعد الألفاظ أو الجمل التي تشرحها.
