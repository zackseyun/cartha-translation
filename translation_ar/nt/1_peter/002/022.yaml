  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: ar
  text: الذي لم يرتكب خطيئة[b]، ولم يوجد في فمه خداع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مكر»؛ تدل الكلمة اليونانية على الخداع أو الغش أو الغدر.
    reason: lexical_alternative
  - marker: b
    text: تردد هذه العبارة صدى إشعياء 53:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: الذي
  rationale: اسم موصول يعود على المسيح المذكور في السياق السابق، ويحافظ على اتصال الآية بما قبلها من غير إضافة توكيد غير موجود في اليونانية.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: لم يرتكب خطيئة
  rationale: الفعل ποιέω يعني في أصله «يفعل»، لكنه مع ἁμαρτία يُفهم اصطلاحيًا بمعنى ارتكاب الخطيئة. وأُبقي الاسم مفردًا كما في النص اليوناني.
- source_word: οὐδὲ
  choice: ولم
  rationale: تنقل النفي المنسق إلى العربية بصياغة طبيعية واضحة، من غير تغيير العلاقة بين الجملتين.
- source_word: εὑρέθη
  choice: يوجد
  rationale: صيغة مبني للمجهول تحافظ على معنى «وُجد» وعلى الصدى الكتابي، مع تجنب تحديد فاعل الاكتشاف.
- source_word: δόλος
  choice: خداع
  rationale: لفظ عربي حديث وواضح يدل على التضليل المتعمد، ويؤدي المعنى الأساسي للكلمة اليونانية من غير استعمال تعبير عتيق.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: في فمه
  rationale: ترجمة قريبة من البنية اليونانية تحفظ الصورة الجسدية والصدى المحتمل لإشعياء 53:9.
theological_decisions:
- issue: صدى إشعياء 53:9 في وصف خلو المسيح من الخطيئة والخداع
  choice: الإبقاء على عبارتي «لم يرتكب خطيئة» و«لم يوجد في فمه خداع» بصياغة قريبة من اليونانية.
  alternative: 'صياغة تفسيرية مثل: «لم يخطئ قط، ولم ينطق بكلام خادع».'
  rationale: الصياغة الأقرب تحفظ قوة الشهادة عن المسيح والصلة اللغوية بإشعياء، ولا توسع العبارة أو تحوّلها إلى شرح.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. حُفظ تركيب الاسم الموصول واتصال الآية بسياقها، كما حُفظت صورة «في فمه» بدل تحويلها إلى شرح مثل «في كلامه».
