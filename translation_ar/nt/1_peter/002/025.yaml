base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: ar
  text: لأنكم كنتم كخراف ضالّة[a]، لكنكم الآن رجعتم[b] إلى راعي نفوسكم ومشرفها[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تائهة»، أو: «تُضَلّ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عُدتم»؛ وقد تُفهم الصيغة اليونانية أيضًا بدلالة المبني للمجهول: «أُرجعتم».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «الحارس»؛ وتقليديًا: «الأسقف».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: لأنكم كنتم
  rationale: تربط «لأن» الآية بما قبلها بوصفها تعليلًا، ويعبّر «كنتم» عن حالتهم السابقة المستمرة.
- source_word: ὡς πρόβατα
  choice: مثل خراف
  rationale: تنقل أداة التشبيه ὡς بوضوح، وتحافظ على صورة الخراف الرعوية.
- source_word: πλανώμενοι
  choice: تضلّ
  rationale: يحافظ الفعل المضارع بعد «كنتم» على معنى الحالة المستمرة وصورة الخراف التي تضل الطريق، من غير حسم احتمال معنى التيه أو التعرّض للإضلال.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: لكنكم الآن رجعتم
  rationale: تنقل «لكن» المقابلة القوية، و«رجعتم» صياغة عربية طبيعية للفعل الذي قد يُفهم بمعنى الرجوع، مع إبقاء احتمال الدلالة المبنية للمجهول في الحاشية.
- source_word: ἐπὶ τὸν ποιμένα
  choice: إلى الراعي
  rationale: «الراعي» هو المقابل المباشر لـ ποιμήν، والسياق يطبّقه لقبًا على المسيح دون حاجة إلى إضافة تفسيرية.
- source_word: καὶ ἐπίσκοπον
  choice: والمشرف
  rationale: ينقل معنى من يراقب ويعتني، ويتجنب تحميل النص الدلالة الكنسية الاصطلاحية اللاحقة التي قد يوحي بها «الأسقف».
- source_word: τῶν ψυχῶν ὑμῶν
  choice: على نفوسكم
  rationale: تحافظ «نفوسكم» على المقابل المعجمي التقليدي لـ ψυχαί، وتلائم في العربية تعدية «المشرف على»، مع تعلّق العبارة بالراعي والمشرف معًا من جهة المعنى.
theological_decisions:
- issue: استعمال ἐπίσκοπος لقبًا للمسيح
  choice: المشرف
  alternative: 'الحارس؛ وتقليديًا: الأسقف'
  rationale: «المشرف» يحفظ معنى العناية والمراقبة في اللقب، من غير إدخال تصورات لاحقة عن نظام الوظائف الكنسية.
- issue: دلالة صيغة ἐπεστράφητε من جهة البناء
  choice: رجعتم
  alternative: أُرجعتم
  rationale: قد تؤدي الصيغة اليونانية معنى الرجوع اللازم أو تحمل ملمحًا مبنيًا للمجهول. يقدّم المتن التعبير العربي الطبيعي «رجعتم»، وتثبت الحاشية الاحتمال الآخر كيلا يُحسم التوتر بين فعل الله واستجابة البشر.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ورصينة. استُعملت صورة فعلية في «خراف تضلّ» لإبراز الحالة المستمرة، ووُضعت علامات الحواشي مباشرة بعد الألفاظ التي تتناولها. لم تُستخدم حروف كبيرة للألقاب لعدم وجود هذا التمييز الكتابي في العربية.
