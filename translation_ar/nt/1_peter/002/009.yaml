  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: ar
  text: أما أنتم فجماعة مختارة[a]، وكهنوت ملوكي، وأمة مقدسة، وشعب خاص به، لكي تعلنوا فضائل[b] الذي دعاكم من الظلمة إلى نوره العجيب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نسل مختار» أو «جنس مختار». يمكن للكلمة اليونانية أن تدل على نسل أو جماعة أو جنس؛ واختيرت «جماعة» لتجنب الإيحاء بتصنيفات عرقية حديثة مع الحفاظ على المعنى الجماعي.
    reason: lexical_alternative
  - marker: b
    text: أو «مآثر» أو «أعمال عظيمة». قد يدل اللفظ اليوناني على الصفات الممتازة الجديرة بالمدح أو على تجلياتها في الأعمال.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: أما أنتم فـ
  rationale: تنقل أداة المقابلة δὲ وتُبرز ضمير المخاطبين الصريح، مع صياغة عربية طبيعية تدل على التباين مع الكلام السابق.
- source_word: γένος ἐκλεκτόν
  choice: جماعة مختارة
  rationale: تحفظ المعنى الجماعي والاختيار، وتتجنب أن توحي كلمة «جنس» بتصنيفات عرقية حديثة أو أن توحي «سلالة» بقرابة بيولوجية محضة. أُثبت البديل الأقرب حرفيًا في الحاشية.
- source_word: βασίλειον ἱεράτευμα
  choice: كهنوت ملوكي
  rationale: صياغة موجزة تنقل البعدين الملكي والكهنوتي، وتحافظ على صدى خروج 19:6 من غير تحويل العبارة تفسيرًا إلى «مملكة من الكهنة».
- source_word: ἔθνος ἅγιον
  choice: أمة مقدسة
  rationale: ترجمة مباشرة تحافظ على الدلالة العهدية ومعنى التخصيص لله الكامن في ἅγιον.
- source_word: λαὸς εἰς περιποίησιν
  choice: شعب خاص به
  rationale: صياغة عربية طبيعية تعبّر عن الانتماء الخاص والاقتناء، وتجعل مرجع الملكية الإلهي المفهوم من السياق واضحًا من غير إضافة معنى «الثمين» أو «المحبوب».
- source_word: ὅπως
  choice: لكي
  rationale: تنقل دلالة الغرض بوضوح وإيجاز.
- source_word: τὰς ἀρετὰς
  choice: مآثر
  rationale: تشمل في العربية الصفات الجديرة بالإشادة والأعمال المجيدة، فتحفظ سعة اللفظ اليوناني أكثر من حصره في الفضائل الأخلاقية أو في الأعمال وحدها.
- source_word: ἐξαγγείλητε
  choice: تعلنوا
  rationale: تنقل فعل الإخبار والإشهار العلني المقصود في ἐξαγγέλλω، وتلائم تركيب الغرض بعد «لكي».
- source_word: τοῦ ... καλέσαντος
  choice: الذي دعاكم
  rationale: تحافظ على تعريف الله بفعله في التركيب اليوناني، من غير إدخال اسم صريح غير وارد في النص.
- source_word: ἐκ σκότους
  choice: من الظلمة
  rationale: تحافظ على صورة الانتقال والخروج من سلطان الظلمة أو حالها.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: إلى نوره العجيب
  rationale: ترجمة واضحة ومهيبة تحفظ دلالة θαυμαστός على ما يبعث العجب والإعجاب.
theological_decisions:
- issue: ألقاب الهوية الجماعية المأخوذة من لغة عهد إسرائيل
  choice: 'الإبقاء على الأوصاف الجماعية مباشرة: «جماعة مختارة، وكهنوت ملوكي، وأمة مقدسة».'
  alternative: تجريد الأوصاف أو تخفيفها بوصفها استعارات عامة.
  rationale: يوظف النص عمدًا لغة العهد في وصف المخاطبين؛ لذلك ينبغي الحفاظ على قوتها مع عدم حسم ما يترتب عليها ضمن منظومة لاهوتية أوسع.
- issue: صاحب «الشعب» المفهوم ضمنًا في λαὸς εἰς περιποίησιν
  choice: التصريح بالضمير في «شعب خاص به».
  alternative: «شعب للاقتناء» أو «شعب مقتنًى».
  rationale: السياق يحدد الله بوضوح بوصفه صاحب الشعب، والتصريح بالضمير ضروري لطلاقة العربية ولا يضيف دعوى عقدية مستقلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. روعي الإيقاع المتوازي في الألقاب الأربعة، واستُعملت ألفاظ مفهومة للقارئ العام من غير تسطيح الصدى العهدي أو حسم سعة «مآثر» في الصفات وحدها أو الأعمال وحدها.
