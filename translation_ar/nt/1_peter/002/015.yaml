base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: ar
  text: 'لأن هذه هي مشيئة الله: أن تُسكِتوا بفعل الخير جهلَ أناسٍ حمقى[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تُلجِموا جهلَ أناسٍ حمقى». الفعل يعني حرفيًا وضعَ ما يمنع الفم من الكلام، واستُعمل هنا مجازًا بمعنى إسكات الكلام المعادي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تربط العبارة بما قبلها وتقدّم سبب الخضوع المطلوب في السياق.
- source_word: οὕτως
  choice: هي أن
  rationale: صيغت مع عبارة «مشيئة الله» بأسلوب عربي طبيعي يبيّن مضمون المشيئة، مع إبقاء الإشارة إلى الكيفية في «بفعل الخير».
- source_word: θέλημα
  choice: مشيئة
  rationale: المقابل العربي المألوف والواضح لإرادة الله وقصده في هذا السياق.
- source_word: ἀγαθοποιοῦντας
  choice: بفعل الخير
  rationale: 'ينقل القوة الوسيلية لاسم الفاعل: إسكات الجهل يكون عن طريق السلوك الصالح.'
- source_word: φιμοῦν
  choice: تُسكِتوا
  rationale: ينقل المعنى المجازي المقصود بوضوح، مع بيان المعنى الحرفي «تكمّموا» في الحاشية.
- source_word: ἀγνωσίαν
  choice: جهل
  rationale: مقابل مباشر للاسم اليوناني، ويصف افتقار المعارضين إلى المعرفة أو الفهم.
- source_word: ἀφρόνων ἀνθρώπων
  choice: الناس الحمقى
  rationale: «الناس» يحفظ الدلالة البشرية العامة غير المحصورة في الذكور، و«الحمقى» ينقل معنى انعدام التعقل.
theological_decisions:
- issue: الدلالة الجندرية لكلمة ἀνθρώπων
  choice: الناس
  alternative: الرجال
  rationale: اللفظ اليوناني عام في هذا الموضع ولا يدل على أن المعارضين ذكور وحدهم.
- issue: علاقة فعل الخير بإسكات الجهل
  choice: بفعل الخير
  alternative: وأنتم تفعلون الخير
  rationale: يفهم اسم الفاعل على أنه يبيّن الوسيلة، من دون تحويل فعل الخير إلى استحقاق خلاصي أو حصر أثره في نتيجة مضمونة آليًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «تُسكِتوا» بدل التعبير الحرفي الأثقل، مع حفظ الصورة الأصلية في الحاشية.
