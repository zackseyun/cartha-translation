translation:
  language: ar
  text: اخضعوا لكل نظام بشري من أجل الرب[a]، سواء للملك باعتباره صاحب سلطة أعلى[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لكل خليقة بشرية»، وقيل تقليديًا: «لكل ترتيب بشري». ويتبين من ذكر الملك والولاة أن العبارة تشير هنا إلى الأنظمة أو السلطات المدنية البشرية.'
