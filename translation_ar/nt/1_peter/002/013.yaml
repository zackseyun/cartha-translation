lexical_decisions:
- source_word: Ὑποτάγητε
  choice: اخضعوا
  rationale: صيغة أمر تحث المخاطَبين على قبول الخضوع؛ و«اخضعوا» عربية واضحة ومباشرة وتحفظ قوة الوصية.
- source_word: πάσῃ
  choice: لكل
  rationale: تؤدي المعنى التوزيعي مع الاسم المفرد.
- source_word: ἀνθρωπίνῃ κτίσει
  choice: نظام بشري
  rationale: مع أن κτίσις تعني حرفيًا «خليقة» أو «إنشاء»، فإن ذكر الملك والولاة بعد ذلك يبين أن المقصود هنا نظام أو ترتيب مدني بشري. وتحفظ الحاشية المعنى الحرفي والبديل التراثي.
- source_word: διὰ τὸν κύριον
  choice: من أجل الرب
  rationale: تعبر عن الدافع أو السبب الذي تفيده διά مع حالة النصب، من غير تعيين مرجع «الرب» بما يتجاوز النص.
- source_word: εἴτε
  choice: سواء
  rationale: تمهد للطرف الأول من تركيب «سواء... أم...» الذي يستمر في الآية التالية.
- source_word: βασιλεῖ
  choice: للملك
  rationale: تنقل المعنى المعجمي العام «ملك» دون تضييقه تاريخيًا إلى «الإمبراطور».
- source_word: ὡς ὑπερέχοντι
  choice: بوصفه صاحب السلطة العليا
  rationale: ينقل معنى علو المرتبة أو السلطة في السياق المدني، مع إبقاء البديل الأقرب إلى اللفظ في الحاشية.
theological_decisions:
- issue: دلالة ἀνθρωπίνῃ κτίσει في سياق السلطة المدنية
  choice: نظام بشري
  alternative: كل خليقة بشرية؛ كل ترتيب بشري
  rationale: السياق اللاحق، بذكر الملك والولاة، يرجح أن العبارة تشير إلى أنظمة أو ترتيبات الحكم البشري، لا إلى كل فرد بشري. ولا تضيف الصياغة حكمًا غير مصرح به بشأن المصدر النهائي لسلطة هذه الأنظمة.
- issue: مرجع κύριον
  choice: الرب
  alternative: يسوع؛ الله
  rationale: لم يحدد النص الاسم، لذلك حُفظ اللقب كما هو لتجنب حسم ما تركه اللفظ غير مصرح به.
- issue: مدى علو سلطة الملك في ὑπερέχοντι
  choice: صاحب السلطة العليا
  alternative: المتفوق؛ من هو أعلى مقامًا
  rationale: المقصود علو السلطة ضمن البنية المدنية المذكورة، لا تقرير سيادة مطلقة تنافس سيادة الرب؛ والحاشية تعرض البديل الأقرب إلى الصيغة اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «نظام بشري» بدل «مؤسسة بشرية» لأنه أوسع وأطبع في سياق نظم الحكم، مع حفظ غرابة التعبير اليوناني الحرفي في الحاشية. تنتهي العبارة بفاصلة لأن تركيب «سواء... أم...» يستمر في الآية التالية.
