  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: ar
  text: فبما أن المسيح[a] تألّم في الجسد[b]، فتسلّحوا أنتم أيضًا بالفكر نفسه، لأن من تألّم في الجسد قد كفَّ عن الخطيئة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب؛ ومعناه «الممسوح».
    reason: lexical_alternative
  - marker: b
    text: «في الجسد» تعني هنا في الوجود البشري الجسدي، ولا تعني بالضرورة «الطبيعة الخاطئة».
    reason: lexical_alternative
  - marker: c
    text: عبارة «من تألّم في الجسد قد كفَّ عن الخطيئة» موضع خلاف. فقد تشير خصوصًا إلى المسيح، أو إلى المؤمنين الذين يسيرون في نمط آلامه، أو تعبّر عن مبدأ عام بشأن قطيعة حاسمة مع الخطيئة.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: المسيح
  rationale: يحفظ اللقب المسياني الطبيعي في العربية، وهو المقابل الراسخ لـΧριστός دون تحويله إلى اسم شخصي محض.
- source_word: οὖν
  choice: فإذًا
  rationale: ينقل الاستنتاج المتصل بالسياق السابق، مع فاء تربط الآية بما قبلها.
- source_word: παθόντος
  choice: بما أن ... تألّم
  rationale: يصوغ اسم الفاعل اليوناني صياغة عربية طبيعية تحفظ قوته السببية والسياقية.
- source_word: σαρκὶ
  choice: في الجسد
  rationale: يشير هنا إلى الوجود البشري الجسدي، ولا يفرض معنى «الطبيعة الخاطئة». وقد حُفظ تكراره في شطري الآية.
- source_word: ἔννοιαν
  choice: الفكر
  rationale: لفظ عربي واضح يشمل التوجّه الذهني والقصد، ويلائم صورة التسلّح.
- source_word: ὁπλίσασθε
  choice: تسلّحوا
  rationale: يحفظ الاستعارة العسكرية وصيغة الأمر الانعكاسية الموجّهة إلى المخاطبين.
- source_word: ὅτι
  choice: لأن
  rationale: يبيّن أن الجملة التالية تعليل للوصية.
- source_word: ὁ παθὼν
  choice: من تألّم
  rationale: يحفظ الصياغة العامة الموجزة ولا يعيّن المرجع المختلف عليه.
- source_word: πέπαυται
  choice: قد كفَّ
  rationale: ينقل بلوغ التوقف وحالته الناتجة التي تفيدها صيغة التام اليونانية.
- source_word: ἁμαρτίας
  choice: عن الخطيئة
  rationale: يحفظ المفرد ويعبّر عن الانفصال بعد فعل الكفّ، دون تحويله إلى خطايا منفردة.
theological_decisions:
- issue: مرجع ودلالة عبارة «من تألّم في الجسد قد كفَّ عن الخطيئة»
  choice: أُبقيت العبارة عامة ومكثفة من غير تعيين صريح لمرجعها.
  alternative: قد تُفهم على أنها تشير خصوصًا إلى المسيح، أو إلى المؤمنين السائرين في نمط آلامه، أو إلى مبدأ عام يفيد أن الألم يقترن بقطيعة حاسمة مع الخطيئة.
  rationale: التركيب اليوناني موجز وموضع خلاف تفسيري؛ لذلك تحافظ الترجمة على التوتر اللاهوتي ولا تضيف حسمًا غير موجود في النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظت الاستعارة في «تسلّحوا» وتكرار «في الجسد»، مع تجنّب الألفاظ المذهبية أو الشروح التفسيرية داخل المتن.
