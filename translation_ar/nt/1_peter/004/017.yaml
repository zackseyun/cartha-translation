  source_fidelity: 'المعنى العام أمين للأصل اليوناني: الرابط تعليلي، ووقت بدء κρίμα، وابتداؤه من جماعة الله، والشرط المتعلق بـ«منا»، والسؤال عن عاقبة غير المطيعين للإنجيل كلها محفوظة. لكن «القضاء» في العربية المعاصرة يشيع استعماله للدلالة على السلطة أو الجهاز القضائي، وهو أقل مباشرة هنا من «الدينونة» بوصفها التعامل القضائي/الحكم الإلهي.'
