  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: ar
  text: لأنه قد حان الوقت لأن تبدأ الدينونة من أهل بيت الله[a]؛ فإن كانت تبدأ أولًا منّا، فما عاقبة[b] الذين لا يطيعون[c] إنجيل الله؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بيت الله». يمكن أن تعني الكلمة اليونانية البيت أو أهل البيت؛ ويُرجَّح هنا أنها تشير إلى شعب الله بوصفهم أهل بيته.
    reason: lexical_alternative
  - marker: b
    text: أو «نهاية». يمكن أن تعني الكلمة اليونانية النهاية أو العاقبة أو النتيجة.
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا ترجمة «الذين لا يطيعون» بـ«الذين يرفضون الإيمان»، لأن الفعل اليوناني قد يجمع بين العصيان وعدم الإيمان عند الاستجابة للإنجيل.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأنه
  rationale: أداة تعليل تربط الآية بما قبلها، وتحافظ على وظيفة الجملة السببية.
- source_word: ὁ καιρός
  choice: قد حان الوقت
  rationale: تفيد العبارة وقتًا مناسبًا أو معيّنًا قد أتى، لا مجرد الزمن بمفهومه العام.
- source_word: τοῦ ἄρξασθαι
  choice: ليبدأ
  rationale: صياغة عربية طبيعية تنقل مضمون المصدر المعرّف بعد «الوقت».
- source_word: τὸ κρίμα
  choice: القضاء
  rationale: يحافظ على معنى تعامل الله القضائي وتقييمه من غير حصره في الإدانة النهائية أو تخفيفه إلى مجرد التأديب.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: من أهل بيت الله
  rationale: يبيّن أن المقصود جماعة الله، مع إبقاء صورة البيت التي يحملها اللفظ اليوناني، ويحافظ حرف الجر «من» على معنى نقطة الابتداء.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: فإن كان يبدأ أولًا منا
  rationale: أُضمر فاعل «يبدأ» اعتمادًا على «القضاء» المذكور قبله، كما في ترابط الأصل، وحُفظ تكرار معنى الابتداء من الجماعة.
- source_word: τέλος
  choice: عاقبة
  rationale: تنقل معنى النهاية أو النتيجة المقصودة في السؤال الخطابي، من غير قصره على مجرد الانتهاء الزمني.
- source_word: ἀπειθούντων
  choice: الذين لا يطيعون
  rationale: يحافظ على القوة الفعلية للفظ وعلى معنى العصيان، مع التنبيه في الحاشية إلى إمكان دلالته على رفض الإيمان في سياق الإنجيل.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: إنجيل الله
  rationale: تعبير عربي مألوف يحافظ على الإضافة التي قد تدل على المصدر أو الملكية، وعلى المصطلح المسيحي المعروف «الإنجيل».
theological_decisions:
- issue: طبيعة τὸ κρίμα بالنسبة إلى أهل الله
  choice: القضاء
  alternative: الإدانة؛ التأديب
  rationale: «الإدانة» تحسم المعنى في اتجاه العقوبة النهائية، و«التأديب» يخفف طابعه القضائي. أما «القضاء» فيحفظ التوتر بين بدء تعامل الله القضائي بأهل بيته وبين عاقبة غير المطيعين.
- issue: المقصود ببيت الله
  choice: أهل بيت الله، أي جماعة الله
  alternative: بيت الله بوصفه مبنى أو هيكلًا
  rationale: قول النص بعد ذلك «منا» يرجّح أن المرجع أشخاص وجماعة، كما ينسجم مع وصف المؤمنين بوصفهم بيتًا روحيًا في سياق الرسالة، من غير إلغاء صورة البيت الأصلية.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. استُعمل «قد حان الوقت» لطبيعيته، و«أهل بيت الله» لتوضيح المرجع الجماعي مع إبقاء الصورة الأصلية، و«القضاء» لتجنب حسم التوتر اللاهوتي في اتجاه الإدانة أو التأديب وحدهما.
