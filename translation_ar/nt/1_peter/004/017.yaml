  to: لأنه قد حان الوقت لأن تبدأ الدينونة من أهل بيت الله[a]؛ فإن كانت تبدأ أولًا منّا، فما عاقبة[b] الذين لا يطيعون[c] إنجيل الله؟
  rationale: استُبدلت «القضاء» بـ«الدينونة» لأن الأخيرة أوضح في نقل κρίμα في السياق الكتابي العربي، من غير أن تحسم هل المقصود إدانة نهائية أم تعامل قضائي أوسع. وعُدّلت البنية إلى «لأن تبدأ الدينونة» لتكون طبيعية وواضحة، مع المحافظة على نقطة الابتداء «من أهل بيت الله» وعلى الشرط في الشطر التالي. الحواشي وعلاماتها سليمة ومتوافقة مع مواضعها.
