  source_fidelity: 'الترجمة تنقل بدقة البنية والمعاني الرئيسة في اليونانية: «بل» تؤدي ἀλλά في سياقها الاستدراكي، و«بقدر ما» تحافظ على القوة التناسبية لـ καθὸ، و«تشاركون في» تؤدي κοινωνεῖτε دون تضييق لطبيعة المشاركة. كما يُحفظ تكرار الفرح بين χαίρετε وχαρῆτε، وتؤدي «مبتهجين» قوة ἀγαλλιώμενοι التعزيزية. «عند استعلان مجده» تمثل ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ تمثيلًا سليمًا.'
