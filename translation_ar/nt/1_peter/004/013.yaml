id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: ar
  text: بل بقدر ما تشاركون في آلام المسيح، افرحوا، لكي تفرحوا أيضًا مبتهجين عند استعلان مجده.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὸ
  choice: بقدر ما
  rationale: يحفظ المعنى التناسبي المحتمل في اللفظة اليونانية، ويربط الفرح بمقدار المشاركة في الآلام، من غير تحويلها إلى معنى زمني محض.
- source_word: κοινωνεῖτε
  choice: تشاركون في
  rationale: تعبير عربي طبيعي ينقل معنى الاشتراك الفعلي في الآلام، لا مجرد التعاطف معها.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: في آلام المسيح
  rationale: صياغة عربية موجزة وطبيعية تحفظ علاقة الإضافة في اليونانية من غير أن تحدد على نحو زائد طبيعة هذه المشاركة.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ دلالته اللقبية والمسيانية.
- source_word: χαίρετε
  choice: افرحوا
  rationale: صيغة أمر واضحة تحفظ الدعوة المباشرة إلى الفرح، وتتيح إبقاء الصلة اللفظية بالفعل اللاحق χαρῆτε.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل علاقة الغاية أو النتيجة المقصودة بوضوح ومن غير حسم زائد بينهما.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: عند استعلان
  rationale: «استعلان» ينقل معنى الكشف والظهور ويحافظ على صيغة الاسم، و«عند» تلائم الإشارة إلى الحدث الآتي.
- source_word: τῆς δόξης αὐτοῦ
  choice: مجده
  rationale: إضافة عربية مباشرة وطبيعية تحافظ على نسبة المجد إليه.
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: تفرحوا أيضًا مبتهجين
  rationale: يحافظ على تكرار جذر الفرح بين الأمر والغاية، وينقل اسم الفاعل الدال على الفرح الشديد من غير إطناب.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيا أو الممسوح
  rationale: «المسيح» في العربية لقب مفهوم وراسخ، وينقل الدلالة المسيانية من غير معاملته كاسم علم محض أو إدخال شرح عقائدي في المتن.
- issue: طبيعة المشاركة في آلام المسيح
  choice: تشاركون في آلام المسيح
  alternative: تتألمون لأجل المسيح
  rationale: النص اليوناني يتحدث عن المشاركة في آلام المسيح، ولا يصرح بأنها مجرد آلام تقع لأجله؛ لذلك تُحفظ العبارة الأوسع بما فيها من توتر لاهوتي من غير الإيحاء بتكرار عمله الكفاري.
- issue: العلاقة التي تفيدها ἵνα
  choice: لكي
  alternative: حتى
  rationale: تبقي الصياغة مجال الغاية والنتيجة مفتوحًا، بدل فرض فصل حاد بينهما.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدمت «بقدر ما» للمحافظة على القوة التناسبية، و«استعلان» للمحافظة على صورة الكشف الأخروي، مع تكرار «افرحوا/تفرحوا» إبقاءً للترابط اللفظي في الأصل.
