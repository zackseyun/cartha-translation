  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: ar
  text: لكن نهاية كل شيء قد اقتربت[a]. فكونوا متعقّلين ويقظين لأجل الصلوات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نهاية كل شيء قريبة». تفيد صيغة الفعل اليوناني اقترابًا حدث وصارت نتيجته قائمة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كونوا سليمي الفكر وصاحين لأجل الصلاة». تؤكد الوصيتان حسن التقدير واليقظة الروحية، وجاءت كلمة «الصلوات» في اليونانية بصيغة الجمع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: كل شيء
  rationale: ينقل صيغة الجمع المحايد مع τέλος نقلاً عربيًا طبيعيًا وشاملًا، من غير الحاجة إلى إضافة تفسيرية.
- source_word: δὲ
  choice: لكن
  rationale: تحفظ الانتقال الخفيف ذي النبرة التقابلية مع السياق السابق.
- source_word: τὸ τέλος
  choice: نهاية
  rationale: المعنى الأخروي المباشر هو الأنسب هنا، من غير تحديد لنظام زمني أو مذهبي.
- source_word: ἤγγικεν
  choice: قد اقتربت
  rationale: تحفظ دلالة صيغة التام على اقتراب وقع وتترتب عليه حالة راهنة؛ ويجوز عربيًا التعبير عن الحالة بقولنا «قريبة».
- source_word: σωφρονήσατε
  choice: كونوا متعقّلين
  rationale: يفيد سلامة الحكم واتزان التفكير وضبط النفس، بصياغة عربية واضحة غير محصورة في جانب سلوكي واحد.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تُظهر طبيعيًا في العربية أن الوصية نتيجة للإعلان السابق.
- source_word: νήψατε
  choice: يقظين
  rationale: ينقل الاستعمال المجازي الدال على الصفاء والانتباه الروحي، من غير أن يوهم أن المقصود المباشر هو الامتناع عن المسكر.
- source_word: εἰς προσευχάς
  choice: لأجل الصلوات
  rationale: يحفظ دلالة الغاية ويحافظ على جمع προσευχάς، الذي قد يشير إلى صلوات متكررة.
theological_decisions:
- issue: القوة الأخروية لعبارة «نهاية كل شيء»
  choice: الإبقاء عليها إعلانًا أخرويًا مباشرًا عن اقتراب النهاية
  alternative: فهم τέλος بمعنى «غاية كل شيء» أو تقليل الإشارة إلى المستقبل
  rationale: السياق يربط قرب النهاية بوصية عملية ملحّة، لكن النص لا يحدد جدولًا زمنيًا ولا منظومة أخروية بعينها.
- issue: العلاقة بين التعقل واليقظة والصلاة
  choice: عرضهما وصيتين متكاملتين موجّهتين إلى ممارسة الصلوات
  alternative: دمجهما في صفة واحدة أو جعل إحداهما خاصة بالامتناع عن الخمر
  rationale: الفعلان اليونانيان متميزان ومترابطان، وكلاهما يرتبطان بعبارة الغاية εἰς προσευχάς.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم «متعقّلين» لسلامة الحكم وضبط التفكير، و«يقظين» للانتباه الروحي. حُفظ جمع «الصلوات» مراعاةً للنص اليوناني، مع بيان البديل المفرد في الحاشية.
