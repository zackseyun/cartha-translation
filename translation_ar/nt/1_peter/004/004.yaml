  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: ar
  text: وفي هذا يستغربون[a] أنكم لا تندفعون معهم إلى نفس فيض الفجور[b]، مسيئين إليكم بالقول[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يعدّون الأمر غريبًا» أو «يتعجبون».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى الانسكاب نفسه من الفجور»؛ أو «إلى الفيض نفسه من الفجور».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يشتمونكم» أو «يفترون عليكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: وفي هذا
  rationale: تحافظ العبارة على الصلة بالسياق السابق من غير أن تجعل العلاقة سببية صراحة، وتأتي طبيعية في العربية.
- source_word: ξενίζονται
  choice: يستغربون
  rationale: تنقل معنى عدّ الأمر غريبًا والتعجب منه، وهي واضحة وشائعة في العربية المعاصرة.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: أنكم لا تندفعون معهم
  rationale: تحول التركيب اليوناني المطلق إلى جملة عربية طبيعية، وتحفظ معنى المشاركة في الاندفاع مع الآخرين.
- source_word: εἰς τὴν αὐτὴν
  choice: إلى ... نفسه
  rationale: تنقل اتجاه الحركة إلى النمط ذاته الذي يشارك فيه المخاطَبون سابقًا.
- source_word: τῆς ἀσωτίας
  choice: الفجور
  rationale: يدل هنا على السلوك المنفلت أخلاقيًا والمفرط، و«الفجور» لفظ عربي واضح وموجز ذو ثقل أخلاقي مناسب.
- source_word: ἀνάχυσιν
  choice: فيض
  rationale: يحفظ صورة الانسكاب أو الفيضان مع صياغة عربية موجزة وطبيعية.
- source_word: βλασφημοῦντες
  choice: فيشتمونكم
  rationale: السياق يدل على كلام عدائي موجَّه إلى المؤمنين؛ و«يشتمونكم» ينقل الإساءة اللفظية من غير الإيحاء الحصري بالتجديف على الله.
theological_decisions:
- issue: جهة الكلام العدائي في βλασφημοῦντες
  choice: 'إساءة لفظية موجَّهة إلى المخاطَبين: «فيشتمونكم»'
  alternative: «يجدّفون» أو «يتكلمون بالسوء» دون تعيين المتلقي
  rationale: رد فعل غير المؤمنين في السياق موجَّه إلى أصحاب السلوك المتغير. والتعبير بـ«يجدّفون» قد يُفهم عربيًا على أنه إساءة إلى الله تحديدًا، وهو أضيق من دلالة اللفظ هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت صورة الفيض، وصيغ التركيب السببي/الحالي بصورة طبيعية من دون تحويله إلى تقرير لاهوتي زائد. وُضعت جميع علامات الحواشي في المتن.
