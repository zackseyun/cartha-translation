  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: ar
  text: أما إن كان يتألم بصفته مسيحيًّا، فلا يخجل، بل ليمجِّد الله بهذا الاسم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في هذا الأمر»، أو: «بسبب هذا الاسم». واليونانية حرفيًّا: «في هذا الاسم»، ويُرجَّح أنها تشير إلى اسم «مسيحي».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: أما إن
  rationale: تنقل الشرط مع قوة δέ الانتقالية والمقابِلة بلغة عربية طبيعية، ويرتبط تمام الشرط بسياق التألم في الآية السابقة.
- source_word: ὡς Χριστιανός
  choice: بصفته مسيحيًّا
  rationale: «مسيحي» هو اللقب العربي المستقر المقابل للاسم الدال على من يُنسب إلى المسيح، و«بصفته» تحافظ على معنى ὡς من غير أن تضيف فكرة «مَن يُدعى» غير المصرح بها.
- source_word: μὴ αἰσχυνέσθω
  choice: فلا يخجل
  rationale: صيغة النهي للغائب تؤدي قوة الأمر اليوناني بوضوح وطبيعية، وتحافظ على معنى الخجل دون توسع تفسيري.
- source_word: δοξαζέτω δὲ
  choice: بل ليمجِّد
  rationale: «بل» تُبرز التضاد بين الخجل وتمجيد الله، ولام الأمر تنقل صيغة الأمر للغائب.
- source_word: τὸν θεόν
  choice: الله
  rationale: ترجمة مباشرة للمفعول به في العبارة.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: بهذا الاسم
  rationale: تحافظ على لفظ «الاسم» وعلى صلته المباشرة بلقب «مسيحي»، مع صياغة عربية سليمة؛ وتُذكر الاحتمالات الدلالية الأخرى في الحاشية.
theological_decisions:
- issue: مرجع عبارة ἐν τῷ ὀνόματι τούτῳ
  choice: الإبقاء على «بهذا الاسم»، والأرجح أنها تشير إلى اسم «مسيحي».
  alternative: «في هذا الأمر» أو «بسبب هذا الاسم».
  rationale: أقرب مذكور هو Χριστιανός، وὄνομα يعني طبيعيًّا اسمًا أو لقبًا. إبقاء «الاسم» يصون الرابط النصي والدلالة الاجتماعية والدينية، من غير حسم وظيفة حرف الجر التي تحتمل المصاحبة أو السببية.
- issue: الفعل المفهوم بعد εἰ δὲ ὡς Χριστιανός
  choice: إظهار «كان يتألم» لاستكمال الشرط بالعربية.
  alternative: «أما إن كان بصفته مسيحيًّا» أو «أما إن كان كمسيحي».
  rationale: اليونانية تحذف الفعل اعتمادًا على سياق الآية السابقة («يتألم»). إظهاره ضروري تقريبًا لوضوح العربية، وهو استكمال سياقي لا إضافة تفسيرية مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «بصفته مسيحيًّا» لتجنب غرابة «كمسيحي»، ولام الأمر في «ليمجِّد» للحفاظ على النبرة الحاثّة. أُظهر فعل «يتألم» المفهوم من السياق السابق كي يستقيم الشرط عربيًّا.
