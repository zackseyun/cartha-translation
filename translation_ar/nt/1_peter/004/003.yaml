  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: ar
  text: فإن ما مضى من الزمن يكفي لأن تكونوا قد عملتم بمشيئة غير اليهود، إذ سلكتم في أعمال الفجور[a]، والشهوات، والإفراط في الخمر[b]، والعربدة، ومجالس الشراب، وعبادات الأوثان المحرَّمة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الانحلال»، فاللفظة اليونانية تدل على الانفلات الوقح والإفراط، ولا سيما في السلوك الأخلاقي والجنسي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في نوبات السكر»، مع إبراز معنى التكرار في صيغة الجمع اليونانية.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «عبادات الأوثان غير المشروعة»؛ فالصفة اليونانية تعني ما هو غير مباح أو محرَّم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: فقد كفاكم ما مضى من الزمن
  rationale: ينقل معنى الكفاية في ἀρκετός، ويصوغ العبارة طبيعيًا بالعربية، مع إظهار المخاطَبين المفهومين من سياق الجملة ومن صيغة πεπορευμένους. والفاء تؤدي وظيفة γάρ التفسيرية في السياق.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: إرادة الأمم
  rationale: تحافظ «إرادة» على معنى القصد أو المشيئة في βούλημα، و«الأمم» هي المقابل الكتابي المألوف لغير اليهود في هذا السياق، دون تضييقها صراحة إلى «الوثنيين».
- source_word: κατειργάσθαι
  choice: لتنفيذ
  rationale: يفيد الفعل إنجاز الأمر وممارسته فعليًا. وتُفهم السابقة الزمنية والكفاية من «كفاكم ما مضى من الزمن»، وإن كانت العربية لا تطابق صيغة المصدر التام اليونانية صرفيًا.
- source_word: πεπορευμένους
  choice: إذ سلكتم
  rationale: يحفظ استعارة السلوك الأخلاقي الشائعة كتابيًا، ويبين ارتباط تعداد الرذائل بطريقة حياتهم السابقة.
- source_word: ἐν ἀσελγείαις
  choice: في أعمال الفجور
  rationale: يعبر «الفجور» عن الانفلات الوقح والإفراط الأخلاقي، وإضافة «أعمال» تُظهر دلالة الجمع اليوناني على الممارسات المتكررة.
- source_word: ἐπιθυμίαις
  choice: الشهوات
  rationale: السياق السلبي في قائمة الرذائل يجعل «الشهوات» أدق من «الرغبات» المحايدة.
- source_word: οἰνοφλυγίαις
  choice: الإفراط في الخمر
  rationale: ينقل معنى الإفراط المؤدي إلى السكر في هذا الاسم النادر، بصياغة عربية طبيعية؛ وتذكر الحاشية بديلًا يبرز نوبات السكر المتكررة.
- source_word: κώμοις
  choice: العربدة
  rationale: تدل على اللهو الصاخب المنفلت، وغالبًا المقترن بالشرب، وهو معنى κῶμος في قائمة الرذائل.
- source_word: πότοις
  choice: مجالس الشراب
  rationale: يوضح مناسبات الشرب الاجتماعية أو حفلاته، ويميزها عن الإفراط في الخمر المذكور قبلها.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: عبادات الأوثان المحرَّمة
  rationale: «المحرَّمة» تحفظ القوة المعيارية لـἀθέμιτος، أي ما هو غير مباح ومخالف لما ينبغي، و«عبادات الأوثان» صياغة عربية أوضح من جمع «عبادة» غير المألوف.
theological_decisions:
- issue: دلالة τῶν ἐθνῶν
  choice: الأمم
  alternative: الوثنيين / غير اليهود
  rationale: «الأمم» هو المصطلح الكتابي العربي المألوف ويحفظ امتداد اللفظ اليوناني. والسياق يشير إلى غير اليهود، لكن «الوثنيين» يزيد تفسيرًا دينيًا و«غير اليهود» يشرح بدل أن يترجم.
- issue: القوة الأخلاقية لعبارة ἀθεμίτοις εἰδωλολατρίαις
  choice: عبادات الأوثان المحرَّمة
  alternative: عبادات الأوثان البغيضة / الآثمة
  rationale: يركز الوصف اليوناني على كون هذه الممارسات غير مباحة ومخالفة للمعيار، لا على مجرد إثارة الاشمئزاز؛ لذلك تحافظ «المحرَّمة» على التوتر الأخلاقي والقانوني بلا تهويل.
- issue: إظهار الفاعل في العبارة المصدرية
  choice: كفاكم... إذ سلكتم
  alternative: يكفي ما مضى من الزمن... وقد ساروا
  rationale: المشاركون هم المخاطَبون بحسب صيغة الجمع في πεπορευμένους وسياق الرسالة. إظهار ضمير المخاطبين ضروري لطبيعية العربية، ولا يضيف هوية طائفية أو عقائدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حُفظت استعارة «السلوك»، واستُعملت تراكيب طبيعية بدل جموع عربية ثقيلة، مع إبراز دلالة الجموع اليونانية حيث يفيد ذلك بواسطة «أعمال» والحواشي.
