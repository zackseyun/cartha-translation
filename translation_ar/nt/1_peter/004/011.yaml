  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: ar
  text: إن كان أحد يتكلم، فليكن كلامه كأقوال الله[a]؛ وإن كان أحد يخدم، فليخدم معتمدًا على القوة التي يمدّه الله بها[b]، لكي يتمجد الله في كل شيء بواسطة يسوع المسيح[c]، الذي له المجد والسلطان إلى أبد الآبدين[d][e]. آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كالأقوال الإلهية». تدل الكلمة اليونانية λόγια على أقوال أو كلمات إلهية، لا على كلام عادي فحسب.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «كما من القوة التي يمدّ بها الله»؛ فالتعبير يبين أن الله هو مصدر القوة.'
    reason: previous_rendering
  - marker: c
    text: 'اليونانية: «بواسطة يسوع المسيح»؛ و«المسيح» هنا لقب، أي الممسوح.'
    reason: lexical_alternative
  - marker: d
    text: يعود «الذي له» بحسب أقرب مرجع نحوي إلى يسوع المسيح، لكن بعضهم يفهم عبارة التمجيد على أنها عائدة إلى الله المذكور قبلها.
    reason: alternative_reading
  - marker: e
    text: 'حرفيًا: «إلى دهور الدهور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: يتكلم
  rationale: صياغة عامة مباشرة تحافظ على المضارع في الشرط، ولا تحصر المعنى في الوعظ أو في خدمة كلامية رسمية.
- source_word: λόγια θεοῦ
  choice: أقوال الله
  rationale: «أقوال» عربية واضحة ورفيعة، وتنقل معنى الكلام الإلهي الذي تحمله λόγια دون الاقتصار على معنى الكلمات العادية؛ وتوضح الحاشية البديل «وحي الله/الأقوال الإلهية» من غير أن تزعم أن كل كلام للخادم وحي مباشر.
- source_word: διακονεῖ
  choice: يخدم
  rationale: الفعل يدل على الخدمة بمعناها الواسع، و«يخدم» أوضح من تعبير قد يوحي بمنصب كنسي محدد.
- source_word: ἐξ ἰσχύος
  choice: انطلاقًا من القوة
  rationale: تحافظ «من» في ἐξ على معنى المصدر، وتبيّن أن القدرة على الخدمة مصدرها الله، مع صياغة عربية طبيعية نسبيًا.
- source_word: ἧς χορηγεῖ ὁ θεός
  choice: التي يمدّه بها الله
  rationale: تنقل معنى التزويد والإمداد في χορηγεῖ بصياغة عربية طبيعية، من غير المبالغة بإضافة معنى السخاء صراحة.
- source_word: ἵνα
  choice: لكي
  rationale: تُبقي دلالة الغاية واضحة.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: تحافظ على الشمول الذي في العبارة اليونانية، من غير تقييدها بالأمرين السابقين وحدهما.
- source_word: δοξάζηται
  choice: يتمجد
  rationale: يحافظ المبني للمجهول العربي على صورة الفعل اليوناني وعلى دلالة الغاية بعد ἵνα.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: بيسوع المسيح
  rationale: الباء هنا تؤدي معنى الوساطة في διὰ، و«المسيح» تنقل Χριστός بوصفه لقبًا معروفًا في العربية.
- source_word: κράτος
  choice: السلطان
  rationale: في سياق التمجيد يدل اللفظ على القوة السيادية والحكم، و«السلطان» أنسب من مجرد «القوة» كما أنه يميزه عن ἰσχύς في صدر الآية.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إلى أبد الآبدين
  rationale: تعبير عربي راسخ ينقل دوام العبارة الاصطلاحية، مع بيان صورتها الحرفية في الحاشية.
theological_decisions:
- issue: مرجع الضمير ᾧ في عبارة التمجيد الختامية
  choice: «الذي له» مع إبقاء أقرب مرجع نحوي، يسوع المسيح، ظاهرًا في المتن
  alternative: قد يعود الضمير إلى الله المذكور في جملة الغاية السابقة، أو تحمل العبارة إيجازًا يربط تمجيد الله بيسوع المسيح
  rationale: أقرب سابق نحوي هو يسوع المسيح، لكن سياق «لكي يتمجد الله» يفسر حمل بعض القراء التمجيد على الله. الصياغة العربية لا تحسم ما لا يحسمه السياق، والحاشية تصرح بالاحتمال.
- issue: قوة ὡς في الشرطين
  choice: 'إظهار الحذف اليوناني بصيغة حثية: «فليكن كلامه...» و«فليخدم...»'
  alternative: 'الصياغة الأقرب إلى الحذف: «إن كان أحد يتكلم، فكأقوال الله؛ وإن كان أحد يخدم، فكمن القوة...»'
  rationale: اليونانية موجزة وتحذف فعلًا مفهومًا بعد ὡς. إظهاره ضروري لوضوح العربية، والصيغة الحثية تنقل المقصود من غير إضافة مضمون عقائدي.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة، مع الحفاظ على الإيجاز الحثي والتوازي بين الكلام والخدمة. استُعمل «أقوال الله» بدل لفظ تقني غامض، و«السلطان» في التمجيد لتمييز κράτος عن «القوة» التي تترجم ἰσχύς.
