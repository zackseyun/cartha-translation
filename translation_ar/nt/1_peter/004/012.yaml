source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: ar
  text: يا أحبّائي، لا تستغربوا المحنة النارية القائمة بينكم لامتحانكم، كأنّ أمرًا غريبًا يحدث لكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الحريق القائم بينكم بوصفه امتحانًا». تستحضر الكلمة اليونانية πυρώσει صورة الاحتراق أو النار حرفيًا، ويمكن أن تعني πειρασμός «امتحانًا» أو «محنة»، وفي سياقات أخرى «تجربة» بمعنى الإغراء.'
    reason: بيان البديل المعجمي والمحافظة على صورة النار واتساع دلالة اللفظ اليوناني.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: يا أحبّائي
  rationale: نداء جمع يحمل مودة رعوية واضحة، ويحافظ على صلته الدلالية بالمحبة بلغة عربية طبيعية.
- source_word: μὴ ξενίζεσθε
  choice: لا تستغربوا
  rationale: ينقل معنى الدهشة واعتبار الأمر غريبًا، كما يحافظ على الصلة اللفظية مع ξένου في ختام الآية.
- source_word: τῇ ἐν ὑμῖν πυρώσει
  choice: المحنة النارية القائمة بينكم
  rationale: «المحنة النارية» تحفظ صورة النار المجازية وشدة الألم، و«بينكم» تلائم السياق الجماعي مع عدم نفي الخبرة الفردية.
- source_word: πρὸς πειρασμὸν ὑμῖν γινομένῃ
  choice: القائمة بينكم لامتحانكم
  rationale: يفيد السياق امتحان الإيمان بالمحنة، لا الإغراء بالخطيئة؛ وصيغة الغاية «لامتحانكم» عربية موجزة وواضحة، بينما «القائمة» تنقل وقوع المحنة الجاري.
- source_word: ὡς ξένου ὑμῖν συμβαίνοντος
  choice: كأنّ أمرًا غريبًا يحدث لكم
  rationale: صياغة طبيعية تحفظ تكرار فكرة الغرابة والعلاقة المقصودة بالفعل «لا تستغربوا».
theological_decisions:
- issue: دلالة πειρασμός في سياق الألم
  choice: امتحان
  alternative: تجربة أو إغراء بالخطيئة
  rationale: السياق المباشر يتناول محنة مؤلمة تمتحن المؤمنين، لا إغراءً داخليًا لفعل الشر، مع الإشارة في الحاشية إلى المجال الدلالي الأوسع للكلمة.
- issue: وظيفة πρὸς في العبارة πρὸς πειρασμόν
  choice: 'الغاية: «لامتحانكم»'
  alternative: 'النتيجة أو الوصف العام: «بوصفها امتحانًا»'
  rationale: تفيد العبارة اتجاه المحنة نحو الامتحان أو غرضها، من غير تحديد صريح للفاعل الذي يقصد هذا الامتحان.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «يا أحبّائي» لدفء الخطاب الرعوي، وحُفظ التوازي بين «لا تستغربوا» و«أمرًا غريبًا». وُضع مؤشر الحاشية [a] في المتن.
