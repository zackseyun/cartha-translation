    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: هؤلاء
  rationale: الضمير الموصول يعود إلى المذكورين في الآية السابقة، واستئناف الجملة بـ«هؤلاء» واضح وطبيعي في العربية مع حفظ الإحالة السياقية.
- source_word: ἀποδώσουσιν λόγον
  choice: سيقدّمون حسابًا
  rationale: ينقل التعبير الاصطلاحي معنى المساءلة وتقديم جواب عن الأفعال، مع إبقاء النبرة القضائية.
- source_word: τῷ
  choice: إلى من
  rationale: الأداة مع اسم الفاعل تؤدي وظيفة اسمية؛ و«إلى من» تحفظ عدم التصريح بهوية الديّان في نص الآية.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: هو مستعدّ أن يدين
  rationale: صياغة عربية طبيعية تعبّر عن الاستعداد القائم للدينونة دون الترجمة الحرفية المتكلّفة «يمتلك استعدادًا».
- source_word: ζῶντας καὶ νεκρούς
  choice: الأحياء والأموات
  rationale: تعبير عربي موجز ومألوف يحفظ شمول موضوع الدينونة كما في اليونانية.
theological_decisions:
- issue: هوية من هو مستعد أن يدين الأحياء والأموات
  choice: الإبقاء على «من» دون تسمية الله أو المسيح
  alternative: التصريح بـ«الله» أو «المسيح»
  rationale: النص اليوناني لا يسمّي الديّان صراحة في هذه الآية، لذلك تحفظ الترجمة الصياغة غير المصرّح بها ولا تحسم التوتر اللاهوتي من خارج النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختير «سيقدّمون حسابًا» للمساءلة القضائية، و«يدين» للدينونة القضائية لا لمجرد إصدار تقييم. وُضعت علامة الحاشية في المتن.
