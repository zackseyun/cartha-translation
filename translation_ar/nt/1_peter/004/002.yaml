  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: ar
  text: لكي يعيش ما بقي من زمنه في الجسد[a]، لا بحسب شهوات البشر بعد الآن، بل بحسب مشيئة الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي في حياته الجسدية على الأرض. ولا تعني العبارة اليونانية هنا بالضرورة «الطبيعة الخاطئة».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: لكي
  rationale: تفيد العبارة مع المصدر غايةً أو نتيجةً متصلة بما سبق، و«لكي» تنقل دلالتها الغائية بوضوح وطبيعية.
- source_word: μηκέτι
  choice: لا ... بعد الآن
  rationale: تنقل معنى التوقف عن نمط الحياة السابق، مع وضع «بعد الآن» في موضع عربي طبيعي.
- source_word: ἀνθρώπων
  choice: البشر
  rationale: جمع عام يشمل الناس جميعًا، ولا يقتصر على الذكور.
- source_word: ἐπιθυμίαις
  choice: شهوات
  rationale: تدل هنا على الرغبات التي كانت توجّه السلوك السابق؛ و«شهوات» تلائم السياق الأخلاقي من غير حصرها في المعنى الجنسي.
- source_word: ἀλλὰ
  choice: بل
  rationale: تُظهر المقابلة القوية بعد النفي بين شهوات البشر ومشيئة الله.
- source_word: θελήματι θεοῦ
  choice: بحسب مشيئة الله
  rationale: يبيّن أن مشيئة الله هي المعيار الذي يوجّه الحياة، ويحافظ على التوازي مع «بحسب شهوات البشر».
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: ما بقي من زمنه
  rationale: صياغة عربية طبيعية تنقل الزمن المتبقي في حياة الشخص المشار إليه في السياق السابق.
- source_word: ἐν σαρκὶ
  choice: في الجسد
  rationale: المقصود الوجود البشري الجسدي في هذه الحياة، لا «الطبيعة الخاطئة» بوصفها معنى لاهوتيًا مفترضًا.
- source_word: βιῶσαι
  choice: يعيش
  rationale: ينقل الفعل الدال على عيش الحياة أو قضائها، مع إبقاء عبارة الزمن مفعولًا دلاليًا طبيعيًا في العربية.
theological_decisions:
- issue: معنى σάρξ في عبارة ἐν σαρκὶ
  choice: الحياة الأرضية المتجسدة («في الجسد»)
  alternative: الطبيعة الخاطئة
  rationale: يتحدث السياق عن الزمن الباقي من حياة المؤمن البشرية، لا عن مبدأ خطيئة داخلي؛ لذلك يحافظ النص على المعنى الجسدي من غير تحميل اللفظ تفسيرًا مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التوازي «لا بحسب ... بل بحسب ...» لإبراز المقابلة في اليونانية، مع الحفاظ على اتصال الآية بما قبلها بواسطة «لكي».
