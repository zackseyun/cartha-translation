  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: ar
  text: فلهذا أيضًا أُعلنت البشارة للموتى، لكي يُحكَم عليهم بحسب البشر[a] في الجسد، ويحياوا بحسب الله في الروح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وفقًا لمقاييس البشر». تفيد العبارة اليونانية معيار البشر أو منظورهم في مقابل «بحسب الله».
    reason: lexical_alternative
  - marker: b
    text: أو «بالروح». قد تشير العبارة إلى مجال الحياة الروحية في مقابل «في الجسد»، ويرى بعضهم أنها تعني الحياة بقوة الروح القدس.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: فلهذا
  rationale: تعبير سببي يربط الآية بما قبلها ويبيّن الغاية أو السبب، بصياغة عربية طبيعية موجزة.
- source_word: νεκροῖς
  choice: الموتى
  rationale: صفة في صيغة الجمع استُعملت استعمال الاسم؛ والترجمة تبقي هوية الموتى وتوقيت تبشيرهم دون حسم.
- source_word: εὐηγγελίσθη
  choice: بُشِّر
  rationale: فعل ماضٍ مبني للمجهول من εὐαγγελίζω، و«بُشِّر» ينقل معنى إعلان البشارة مع الحفاظ على المبني للمجهول.
- source_word: ἵνα
  choice: لكي
  rationale: أداة غاية، وتُبقي الصلة بين التبشير والنتيجة المقصودة في الجملة التالية.
- source_word: κριθῶσι
  choice: أُدينوا
  rationale: الفعل مبني للمجهول، وسياق المقابلة مع الحياة يرجّح معنى الحكم المؤدي إلى الإدانة. أُدي المعنى بصيغة اعتراضية تنازلية طبيعية في العربية، دون تحديد صاحب الحكم أو طبيعته.
- source_word: κατὰ ἀνθρώπους
  choice: بحسب البشر
  rationale: تحفظ «بحسب» معنى المعيار أو المنظور، وتحفظ «البشر» المقابلة الجامعة بين الإنسان والله من غير تقييدها بالذكور.
- source_word: σαρκὶ
  choice: في الجسد
  rationale: يدل السياق هنا على مجال الوجود البشري الجسدي في مقابل الروح، لا على «الطبيعة الخاطئة». واختيار «الجسد» أوضح للقارئ العربي في هذا الاستعمال غير الأخلاقي.
- source_word: ζῶσι
  choice: يحيوا
  rationale: فعل مضارع منصوب يدل على الغاية أو النتيجة المقصودة، ويحفظ المقابلة بين الإدانة والحياة.
- source_word: κατὰ θεὸν
  choice: بحسب الله
  rationale: صياغة موازية لـ«بحسب البشر» تحفظ المقابلة المقصودة ولا تفرض تفسيرًا محددًا، مثل «في نظر الله» أو «وفق إرادة الله».
- source_word: πνεύματι
  choice: في الروح
  rationale: تُفهم الداتيف هنا على الأرجح بوصفها مجال الحياة، في موازاة «في الجسد». لا يحدد النص صراحة أن المقصود هو الروح القدس، ولذلك أُبقي التعبير غير حاسم.
theological_decisions:
- issue: هوية «الموتى» وتوقيت تبشيرهم
  choice: الإبقاء على «الموتى» دون شرح داخل النص
  alternative: الذين ماتوا جسديًا بعد أن سمعوا البشارة في حياتهم؛ أو الموتى روحيًا؛ أو موتى يرتبطون بإعلان المسيح للأرواح في السجن
  rationale: العبارة اليونانية لا تحسم وحدها هوية الموتى ولا توقيت إعلان البشارة لهم، ولا سيما في ضوء الخلاف حول صلتها بـ1 بطرس 3:19. لذلك لا تفرض الترجمة تفسيرًا عقائديًا بعينه.
- issue: العلاقة بين «أُدينوا» و«يحيوا»
  choice: صياغة «مع أنهم أُدينوا ... يحيوا» لإظهار المقابلة التنازلية
  alternative: «لكي يُدانوا ... لكن يحيوا»، بما يحافظ بصورة أشد حرفية على خضوع الفعلين لأداة الغاية
  rationale: الفعلان تابعان نحويًا لـἵνα، لكن تركيب μὲν...δὲ يحمل مقابلة قوية، والسياق يسمح بفهم الطرف الأول على نحو تنازلي. الصياغة المختارة طبيعية في العربية، مع عدم تحديد ما إذا كانت الإدانة حكمًا بشريًا أو موتًا جسديًا أو حكمًا إلهيًا في المجال البشري.
- issue: دلالة «الروح»
  choice: كتابتها «الروح» دون تعيين أنها الروح القدس
  alternative: «بالروح»، على فهمها وكالة الروح القدس
  rationale: الموازاة مع «في الجسد» ترجّح معنى المجال أو نمط الحياة، لكن احتمال الإشارة إلى الروح القدس لا يمكن استبعاده تمامًا؛ لذلك حُفظ الغموض وأُشير إلى البديل في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «البشر» بدل «الرجال» لأن ἀνθρώπους هنا اسم تمثيلي للناس عمومًا، واستُخدم «الجسد» بدل «اللحم» لأن المقصود مجال الحياة الجسدية لا المادة الجسدية ولا الطبيعة الخاطئة.
