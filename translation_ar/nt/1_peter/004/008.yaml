  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: ar
  text: وفوق كل شيء، حافظوا على محبة شديدة بعضكم لبعض، لأن المحبة تستر كثرة من الخطايا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تلمّح العبارة إلى أمثال 10:12. وقد يُفهم «تستر» أيضًا بمعنى التغاضي عن الإساءات وعدم إثارة النزاعات بسببها، لكن الصورة في الأصل تحتمل أكثر من وجه.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: πρὸ πάντων
  choice: وقبل كل شيء
  rationale: تعبير يدل في السياق على الأولوية والأهمية القصوى، لا على الترتيب الزمني وحده.
- source_word: τὴν εἰς ἑαυτοὺς ἀγάπην
  choice: محبة ... بعضكم لبعض
  rationale: صياغة عربية طبيعية تنقل المحبة المتبادلة داخل الجماعة.
- source_word: ἐκτενῆ
  choice: حارّة
  rationale: تنقل معنى الشدة والجدية والاستمرار الكامن في صفة ما هو ممدود أو مواظَب عليه.
- source_word: ἔχοντες
  choice: حافظوا على
  rationale: للمشاركة هنا قوة حثّية متصلة بسياق الوصايا، وصيغة الأمر طبيعية بالعربية، مع إبراز دوام المحبة لا مجرد امتلاكها.
- source_word: ὅτι
  choice: لأن
  rationale: تُظهر بوضوح أن العبارة التالية تعليل للحث.
- source_word: καλύπτει
  choice: تستر
  rationale: تحفظ صورة التغطية وصدى المثل دون حصر المعنى في التجاهل أو الإخفاء أو الغفران التلقائي.
- source_word: πλῆθος ἁμαρτιῶν
  choice: كثرة من الخطايا
  rationale: تنقل المعنى الجمعي والثقل البلاغي بصورة عربية واضحة وطبيعية.
theological_decisions:
- issue: معنى أن المحبة تستر كثرة من الخطايا
  choice: الإبقاء على استعارة «تستر» من غير تحديد أصحاب الخطايا أو آلية الستر
  alternative: المحبة تتغاضى عن إساءات كثيرة؛ أو المحبة تؤدي إلى غفران خطايا كثيرة
  rationale: العبارة مثلية وتلمّح إلى أمثال 10:12، والنص اليوناني لا يفرض تفسيرًا عقائديًا واحدًا؛ لذا يحفظ اللفظ توتر المعنى واتساعه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت صيغة الأمر لإظهار قوة الحث في اسم الفاعل اليوناني ضمن سياقه، وحُفظت استعارة الستر دون تفسير مذهبي زائد.
