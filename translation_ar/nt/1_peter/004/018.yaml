  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: ar
  text: «وَإِنْ يَخْلُصُ الْبَارُّ بِمَشَقَّةٍ[a]، فَأَيْنَ سَيَظْهَرُ الْفَاجِرُ وَالْخَاطِئُ؟[b]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعسر يخلص» أو «بالكاد يخلص».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فأين سيوجد الفاجر والخاطئ؟»'
    reason: alternative_rendering
lexical_decisions:
- source_word: δίκαιος
  choice: البارّ
  rationale: صفة محلاة بأداة التعريف ومستعملة استعمال الاسم في المفرد المذكر، فحُفظ المفرد التمثيلي والأسلوب الحكمي الموجز.
- source_word: μόλις
  choice: بمشقة
  rationale: تفيد اللفظة الصعوبة أو اجتياز الأمر بعسر؛ و«بمشقة» عربية واضحة تحفظ المعنى في سياق الألم والدينونة دون أن تقرر أن الخلاص نفسه مشكوك فيه.
- source_word: σῴζεται
  choice: يخلص
  rationale: فعل مضارع مبني للمجهول في اليونانية، وتؤدي صيغة «يخلص» العربية المعنى بصورة طبيعية في العبارة الحكمية، مع إمكان فهم الخلاص في سياقه بوصفه عبورًا وسط الشدائد.
- source_word: ἀσεβής
  choice: الفاجر
  rationale: ينقل المعنى الديني والأخلاقي لمن لا يتقي الله، وهو تعبير كتابي عربي واضح ومتميز عن «الخاطئ».
- source_word: ἁμαρτωλός
  choice: الخاطئ
  rationale: ترجمة مباشرة شائعة تحفظ الوصف الثاني مستقلًا عن «الفاجر»، كما في عطف اللفظتين في اليونانية.
- source_word: ποῦ
  choice: فأين
  rationale: تحفظ أداة الاستفهام المكانية وقوة السؤال البلاغي، مع الفاء التي تلائم نتيجة الشرط في العربية.
- source_word: φανεῖται
  choice: سيظهر
  rationale: يحفظ الدلالة المباشرة للمستقبل «سيظهر»، بدل حسمها تفسيريًا بمعنى «سيوجد» أو «سيكون له مكان».
theological_decisions:
- issue: دلالة μόλις σῴζεται
  choice: «بمشقة يخلص»، أي إن الخلاص يمر في سياق الآلام والامتحان الشديد، مع إبقاء العبارة على توترها البلاغي.
  alternative: «بالكاد يخلص»، بما قد يُفهم منه أن النتيجة النهائية نفسها غير مؤكدة.
  rationale: السياق القريب يتناول الألم وابتداء الدينونة من بيت الله. لذلك تحفظ الصياغة صعوبة الطريق دون إدخال تقرير عقائدي عن عدم يقين الخلاص.
- issue: المفرد المذكر التمثيلي
  choice: «البارّ» بالمفرد، محافظةً على الصيغة الحكمية في الأصل.
  alternative: «الأبرار» أو «الإنسان البار».
  rationale: الأصل اليوناني مفرد مذكر ذو قوة تمثيلية؛ والترجمة بالمفرد أدق وأوجز.
- issue: معنى φανεῖται في السؤال البلاغي
  choice: «سيظهر» للمحافظة على الصورة اللفظية الأصلية.
  alternative: «سيوجد» أو «أين يكون مصيره؟».
  rationale: البدائل ممكنة تفسيريًا، لكن «سيظهر» لا يحسم المقصود، ويحفظ صدى الصياغة الحكمية في خلفية الأمثال اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «بمشقة» بدل «بالكاد» لتجنب إيحاء غير لازم بعدم يقين الخلاص، مع توثيق البديل في الحاشية. وُضعت علامتا الحاشيتين في المتن، وحُفظ التمييز بين «الفاجر» و«الخاطئ».
