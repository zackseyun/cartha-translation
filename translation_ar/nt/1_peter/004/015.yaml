  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: ar
  text: فلا يتألَّمْ أحدٌ منكم بوصفه قاتلًا، أو سارقًا، أو فاعلَ شرٍّ، أو متدخِّلًا فيما لا يعنيه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متطفلًا في شؤون الآخرين». واللفظ اليوناني نادر، ومعناه الحرفي التقريبي: «من يتولّى شؤون غيره» أو «من يشرف على شؤون غيره»، أي من يتدخل فيما ليس من شأنه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: فلا
  rationale: تفيد μὴ مع فعل الأمر الحاضر النهي، وتربط الفاء الجملة بما قبلها ربطًا تفسيريًا طبيعيًا في العربية؛ ولم تُترجم γάρ ترجمة منفصلة ثقيلة.
- source_word: τις ὑμῶν
  choice: أحدٌ منكم
  rationale: مع النفي تؤدي العبارة معنى ألا يقع ذلك من أي فرد من المخاطَبين، وهي صياغة عربية واضحة تحافظ على المعنى التبعيضي.
- source_word: πασχέτω
  choice: يتألَّمْ
  rationale: يحافظ على المعنى العام للفعل، أي معاناة الألم، من غير تخصيصه بالعقوبة التي لا يصرّح بها النص.
- source_word: ὡς
  choice: بوصفه
  rationale: تبيّن الصفة أو الأساس الذي يتألّم الشخص بسببه، وهي أدق هنا من تشبيه قد توحي به «مثل».
- source_word: φονεύς
  choice: قاتلًا
  rationale: في سياق قائمة الجرائم يدل اللفظ على قاتل يرتكب القتل المحرَّم؛ والصياغة العربية الموجزة طبيعية، وإن كان «قاتل نفس» أكثر تصريحًا.
- source_word: κλέπτης
  choice: سارقًا
  rationale: المقابل العربي المباشر والدقيق لمن يسرق، من غير إيحاء بسطو مسلح.
- source_word: κακοποιός
  choice: فاعلَ شرٍّ
  rationale: يحفظ عموم اللفظ ونبرته الأخلاقية، ولا يضيّقه إلى معنى قانوني مثل «مجرم».
- source_word: ἀλλοτριεπίσκοπος
  choice: متدخِّلًا فيما لا يعنيه
  rationale: اللفظ مركّب نادر يشير في هذا السياق إلى التطفل والتدخل في شؤون الغير؛ وهذه العبارة واضحة ومعاصرة من غير إدخال دلالة كنسية من عنصر ἐπίσκοπος.
theological_decisions:
- issue: دلالة ἀλλοτριεπίσκοπος النادر
  choice: متدخِّلًا فيما لا يعنيه
  alternative: متطفلًا في شؤون الآخرين؛ أو متوليًا شؤون غيره
  rationale: السياق يعدد أفعالًا مذمومة تجعل الألم مستحقًا للوم. اختير معنى التدخل غير المشروع، مع التنبيه في الحاشية إلى الصورة الحرفية وإلى ندرة اللفظ، من غير حسم زائد أو تحميله معنى منصب كنسي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بوصفه» لإظهار أن القائمة تحدد سبب الألم أو صفته، و«متدخلًا فيما لا يعنيه» لتوضيح اللفظ النادر مع إبقاء البديل والحرفية في الحاشية.
