base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: ar
  text: لذلك، فليودع أيضًا الذين يتألّمون بحسب مشيئة الله نفوسهم[a] لدى خالق أمين، وهم يعملون الخير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حياتهم» أو «ذواتهم»؛ فاللفظة اليونانية قد تشير إلى النفس أو الحياة أو الذات.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: لذلك
  rationale: تفيد نتيجةً واستنتاجًا مما سبق، و«لذلك» واضحة وطبيعية في العربية المعاصرة.
- source_word: οἱ πάσχοντες
  choice: الذين يتألّمون
  rationale: تنقل اسم الفاعل اليوناني المستعمل استعمال الاسم للدلالة على فئة يتصف أفرادها بالتألّم.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: بحسب مشيئة الله
  rationale: تحافظ على معنى الموافقة أو الاتساق الذي تفيده κατά، من غير أن تحدد كيف يرتبط الألم بمشيئة الله.
- source_word: πιστῷ κτίστῃ
  choice: خالقًا أمينًا
  rationale: «أمينًا» تجمع معنى الأمانة والجدارة بالثقة، و«خالقًا» تقابل κτίστῃ مباشرة. وجاء النصب وفق التركيب العربي «ائتمن فلانًا على شيء».
- source_word: παρατιθέσθωσαν
  choice: فليأتمن
  rationale: ينقل صيغة الأمر ومعنى تسليم شيء إلى رعاية شخص موثوق به. وجاء الفعل مفردًا لتقدمه على الفاعل الجمع الظاهر «الذين».
- source_word: τὰς ψυχὰς αὐτῶν
  choice: نفوسهم
  rationale: تحافظ على المقابل الأساسي لـ ψυχή وعلى دلالته اللاهوتية، مع بيان احتمالي «حياتهم» و«ذواتهم» في الحاشية.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: وهم يعملون الخير
  rationale: تفيد الحال المصاحبة لإيداع نفوسهم لدى الخالق، وتعبّر بوضوح عن استمرارهم في فعل الخير وسط الألم.
theological_decisions:
- issue: علاقة الألم بمشيئة الله
  choice: بحسب مشيئة الله
  alternative: بمشيئة الله
  rationale: النص يقرر أن الألم يقع بحسب مشيئة الله، لكنه لا يفصل هل المقصود الإذن أو التقدير أو وجهًا آخر؛ لذلك تُرك التوتر اللاهوتي بلا حسم تفسيري.
- issue: دلالة ψυχή في السياق
  choice: نفوسهم
  alternative: حياتهم أو ذواتهم
  rationale: «نفوسهم» تحافظ على اللفظ ودلالته، بينما تتيح الحاشية المجال الدلالي الأوسع الممكن في هذا السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل «ائتمن خالقًا أمينًا على نفوسهم» لأنه تركيب عربي طبيعي يحفظ معنى تسليم النفس إلى رعاية الخالق، مع إبقاء «أيضًا» المقابلة لـ καί.
