revisions:
- from: ليخدم كلُّ واحدٍ منكم الآخرين بالموهبة التي نالها، بوصفكم وكلاء صالحين على نعمة الله المتنوّعة.
  to: فليخدم كلُّ واحدٍ منكم الآخرين بالموهبة التي نالها، بوصفه وكيلاً صالحًا على نعمة الله المتنوّعة.
  rationale: صُحِّح عدم اتساق العدد بتوحيد الإسناد إلى المفرد التوزيعي («كل واحد ... بوصفه وكيلاً»)، من دون تغيير المعنى أو تضييق مدلول الموهبة والنعمة. ولا تستلزم الآية حاشية عربية؛ فالبدائل الممكنة لـ εἰς ἑαυτούς لا تؤثر في نص الترجمة المقترح تأثيرًا جوهريًا.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:17:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي محفوظ: كل فرد تلقّى موهبة وعليه أن يستخدمها في خدمة الجماعة، بصفته وكيلاً على نعمة الله المتنوعة. لكن الانتقال من المفرد «كل واحد» إلى الجمع «بوصفكم وكلاء» في الجملة نفسها يضعف الاتساق التركيبي العربي. كما أن «الآخرين» ممكنة، لكنها أقل تحديدًا من الإحالة الجماعية الانعكاسية في εἰς ἑαυτούς.'
  naturalness: 'الترجمة واضحة وفصحى، غير أن توحيد الإسناد إلى المفرد التوزيعي يجعلها أسلس: «بوصفه وكيلاً صالحًا».'
  terminology: «الموهبة» مناسبة لـ χάρισμα ولا تفرض معنى «روحية» الضيق. و«وكيل» مناسب لـ οἰκονόμος، و«نعمة الله المتنوّعة» تنقل ποικίλης χάριτος θεοῦ بوضوح. الإبقاء على «على نعمة الله» يحفظ صورة الأمانة/الوكالة على ما اؤتمن عليه.
  issues:
  - severity: medium
    issue: عدم اتساق العدد بين «كل واحد» و«بوصفكم وكلاء».
    rationale: التركيب اليوناني يجمع مفردًا توزيعيًا مع جمع يخاطب الجماعة، لكن نقله العربي الحالي ينتج انتقالًا غير مستساغ داخل الجملة. يمكن الحفاظ على المعنى التوزيعي بصياغة مفردة متسقة.
  - severity: low
    issue: الإحالة الجماعية في «الآخرين» أقل صراحة من العبارة اليونانية الانعكاسية الجمعيّة.
    rationale: «الآخرين» لا تخطئ المعنى في السياق، لكنها قد تُفهم على أنها تشمل غير الجماعة. الصياغة المقترحة تبقيها لسلامة العربية مع توضيح أن المخاطبين هم الجماعة في «منكم».
  revised_text: فليخدم كلُّ واحدٍ منكم الآخرين بالموهبة التي نالها، بوصفه وكيلاً صالحًا على نعمة الله المتنوّعة.
