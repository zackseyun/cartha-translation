  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: ar
  text: فليخدم كلُّ واحدٍ منكم الآخرين بالموهبة التي نالها، بوصفه وكيلاً صالحًا على نعمة الله المتنوّعة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος
  choice: كلُّ واحدٍ منكم
  rationale: ينقل التوزيع الفردي، مع إظهار الجماعة المخاطَبة التي يدل عليها السياق.
- source_word: καθὼς ἔλαβεν χάρισμα
  choice: بالموهبة التي نالها
  rationale: صياغة عربية طبيعية تحفظ كون كل فرد قد تلقّى موهبة، من غير تقييد χάρισμα اصطلاحيًا بعبارة «موهبة روحية».
- source_word: εἰς ἑαυτοὺς αὐτὸ διακονοῦντες
  choice: ليخدم ... الآخرين بالموهبة
  rationale: ينقل القوة الحثّية لاسم الفاعل، ويجعل الموهبة وسيلة خدمة داخل الجماعة؛ و«الآخرين» أوضح عربيًا في الدلالة التبادلية من ترجمة انعكاسية حرفية.
- source_word: ὡς καλοὶ οἰκονόμοι
  choice: بوصفكم وكلاء صالحين
  rationale: «وكلاء» تحفظ معنى إدارة ما اؤتمن عليه المرء لحساب مالكه، و«صالحين» تقابل καλοί من غير تضييقها إلى «أمناء».
- source_word: ποικίλης χάριτος θεοῦ
  choice: على نعمة الله المتنوّعة
  rationale: «المتنوّعة» تعبّر عن تعدد صور النعمة، وحرف الجر «على» يلائم في العربية مسؤولية الوكيل عما اؤتمن عليه.
theological_decisions:
- issue: هل تُترجم χάρισμα ترجمة اصطلاحية ضيقة؟
  choice: الموهبة
  alternative: الموهبة الروحية؛ عطية النعمة
  rationale: اللفظ يدل على عطية مصدرها النعمة، لكن النص لا يوجب هنا المصطلح الأضيق «موهبة روحية»؛ والسياق اللاحق يبيّن صلتها بنعمة الله.
- issue: القوة الجماعية لعبارة εἰς ἑαυτούς
  choice: الآخرين
  alternative: بعضكم بعضًا؛ فيما بينكم؛ لأجل بعضكم
  rationale: الضمير الانعكاسي الجمعي يحيل إلى أعضاء الجماعة بوصفهم مجال الخدمة والمستفيدين منها. «الآخرين» عربية طبيعية وتحفظ التوجيه المتبادل في الخطاب من غير إثقال.
- issue: وظيفة διακονοῦντες النحوية
  choice: ليخدم
  alternative: خادمين؛ وأنتم تخدمون
  rationale: اسم الفاعل يحمل في السياق قوة حثّية؛ فصيغته بالفعل المضارع المقرون بلام الأمر تنقل الوصية بوضوح في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُدِّمت عبارة الخدمة لتجنب تركيب حرفي متعثر، مع إبقاء صورة الوكالة وتنوّع نعمة الله.
