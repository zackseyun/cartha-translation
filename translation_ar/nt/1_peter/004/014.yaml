  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: ar
  text: إِنْ كُنْتُمْ تُعَيَّرُونَ بِاسْمِ الْمَسِيحِ، فَطُوبَى لَكُمْ، لِأَنَّ رُوحَ الْمَجْدِ وَرُوحَ اللهِ يَسْتَقِرُّ عَلَيْكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة: «روح الله المجيد»؛ أو: «روح المجد، أي روح الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: تُعَيَّرون
  rationale: ينقل الفعل المبني للمجهول معنى التعرّض للإهانة والتشهير اللفظي وما يصاحبهما من إذلال اجتماعي، وهو تعبير عربي واضح وكتابي النبرة دون تقادم شديد.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: باسم المسيح
  rationale: تحافظ الباء على صورة «الاسم» وتفيد هنا الارتباط بالمسيح أو التعرّض للتعيير بسببه، من غير تحويل العبارة إلى تفسير صريح يحصر دلالتها.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: المقابل العربي الطبيعي للقب Χριστός، ويحفظ وظيفته اللقبية بوصفه «الممسوح» بدل معاملته كاسم مجرد.
- source_word: μακάριοι
  choice: طوبى لكم
  rationale: صيغة عربية راسخة في عبارات التطويب، وتعبّر عن المنزلة المباركة لا عن مجرد شعور بالسعادة.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: روح المجد وروح الله
  rationale: تُظهر الصياغة الوصفين المعرّفين اللذين يحيطان بالاسم اليوناني «روح»، وتحافظ قدر الإمكان على إمكان التنسيق أو البيان من غير حسم تفسيري.
- source_word: δόξης
  choice: المجد
  rationale: هو المقابل الكتابي المباشر لـδόξα، ويلائم سياق الحضور الإلهي.
- source_word: ἀναπαύεται
  choice: يستقرّ عليكم
  rationale: ينقل معنى الراحة أو الحلول والاستقرار، ويحافظ مع «على/عليكم» على صدى لغة حلول الروح على الشخص.
theological_decisions:
- issue: كيفية فهم τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: روح المجد وروح الله
  alternative: 'روح الله المجيد؛ أو: روح المجد، أي روح الله'
  rationale: التركيب اليوناني مكثف، وقد يُفهم على أنه وصفان متوازيان للروح الواحد أو أن العبارة الثانية بيان للأولى. أبقت الترجمة الوصفين ظاهرين، وذكرت الحاشية أوجه الفهم دون ترجيح قاطع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «طوبى لكم» لقوة الصيغة التطويبية، و«تُعَيَّرون» للدلالة على الإهانة ذات البعد الاجتماعي. وُضعت الحاشية بعد الجملة التي تتصل بها، مع إبقاء الغموض التركيبي الأصيل في عبارة الروح.
