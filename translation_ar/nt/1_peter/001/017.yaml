source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: ar
  text: وإن كنتم تدعون مَن يدين بلا محاباة بحسب عمل كل واحد أبًا[a]، فاسلكوا بخوف[b] طوال مدة إقامتكم كغرباء[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تدعون الآب» أو «تدعونه أبًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بوقار» أو «بمهابة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «طوال مدة غربتكم». واللفظ اليوناني قد يدل على حياة الغريب أو المقيم مؤقتًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: تدعون
  rationale: يفيد الفعل هنا مخاطبة الله أو دعاءه، ومع «أبًا» يعبّر عن دعوته أبًا، مع إبقاء احتمال معنى الابتهال إليه في الحاشية.
- source_word: πατέρα
  choice: أبًا
  rationale: جاءت الكلمة خبرًا لفعل «تدعون»، أي إن المؤمنين يخاطبون الله بصفته أبًا، من غير إضافة أداة تعريف غير موجودة في الأصل.
- source_word: ἀπροσωπολήμπτως
  choice: بلا محاباة
  rationale: تعبير عربي واضح يدل على القضاء من غير تفضيل للأشخاص بسبب مكانتهم أو مظاهرهم.
- source_word: κρίνοντα
  choice: مَن يدين
  rationale: اسم الفاعل اليوناني يصف الله بصفته الذي يمارس الدينونة، وصيغة الصلة طبيعية في العربية.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: بحسب عمل كل واحد
  rationale: تحافظ العبارة على كون العمل معيارًا مذكورًا للدينونة وعلى مسؤولية كل فرد، من غير فرض تفسير عقائدي زائد.
- source_word: ἐν φόβῳ
  choice: بخوف
  rationale: يحفظ المعنى المباشر والتوتر بين أبوة الله ودينونته، ولا يضيّق الدلالة إلى الوقار وحده.
- source_word: παροικίας
  choice: إقامتكم كغرباء
  rationale: توضح الإقامة بوصف الشخص غريبًا أو مقيمًا مؤقتًا، وتحافظ على صورة الغربة الأساسية في الرسالة.
- source_word: ἀναστράφητε
  choice: فاسلكوا
  rationale: يؤدي المعنى الأخلاقي المتعلق بطريقة العيش والتصرف، بصياغة عربية موجزة ومألوفة.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: طوال مدة إقامتكم كغرباء
  rationale: ينقل مفعول الزمان الدال على امتداد المدة، مع إظهار معنى الإقامة في الغربة بوضوح.
theological_decisions:
- issue: معنى φόβος في سياق الله الآب الديّان
  choice: إبقاء «الخوف» في المتن
  alternative: الوقار أو المهابة
  rationale: يربط النص بين أبوة الله ودينونته بلا محاباة؛ ولفظ «الخوف» يحفظ الجدية الأخلاقية والتوتر اللاهوتي بدل تلطيفه إلى معنى تعبدي واحد.
- issue: مدى الدينونة بحسب الأعمال
  choice: 'ترجمة العبارة مباشرة: «بحسب عمل كل واحد»'
  alternative: تحديدها بأنها الدينونة الأخيرة لأعمال المؤمنين أو مبدأ عام للتقييم الإلهي
  rationale: لا يحدد النص هنا نظامًا عقائديًا للعلاقة بين الأعمال والاستحقاق أو الخلاص، لذلك لا تضيف الترجمة ما يتجاوز العبارة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فاسلكوا» للدلالة على نهج الحياة الأخلاقي، و«إقامتكم كغرباء» لتجنب غموض «النزول» ولإبراز معنى الإقامة المؤقتة من غير حصرها في نفي سياسي.
