review_pass:
  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «إلى» تحافظ على ارتباط العبارة بالسياق السابق وعلى اتجاه εἰς، و«ميراث» يقابل κληρονομίαν، كما يحفظ التوازي الثلاثي لصفات الميراث ومعنى كونه محفوظًا في السماوات للمخاطَبين. لا يضيف فاعلًا للحفظ غير مصرّح به في الأصل.'
  naturalness: 'الصياغة فصيحة واضحة ومترابطة: «إلى ميراثٍ لا يفسد ولا يتدنّس ولا يذبل، محفوظٍ في السماوات لأجلكم». تكرار «لا» طبيعي ويُبرز الإيقاع التعدادي في الأصل، وجرّ «محفوظٍ» سليم تبعًا لـ«ميراثٍ».'
  terminology: «ميراث» مصطلح كتابي عربي راسخ ومناسب. «لا يفسد»، «لا يتدنّس»، و«لا يذبل» تنقل على الترتيب عدم الفساد والدنس والذبول من غير تحميل تفسيري. «السماوات» يحافظ على صيغة الجمع اليونانية، و«لأجلكم» يعبّر طبيعيًا عن εἰς ὑμᾶς في هذا السياق.
