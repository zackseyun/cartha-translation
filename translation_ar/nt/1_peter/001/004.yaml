  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: ar
  text: إلى ميراثٍ لا يفسد ولا يتدنّس ولا يذبل، محفوظٍ في السماوات لأجلكم،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: ميراثٍ
  rationale: المقابل العربي الطبيعي الذي يحفظ معنى النص الكتابي المتعلق بما يناله الوارث.
- source_word: ἄφθαρτον
  choice: لا يفسد
  rationale: ينقل معنى عدم التعرض للفساد أو الفناء بصياغة واضحة.
- source_word: ἀμίαντον
  choice: لا يتدنّس
  rationale: يحفظ دلالة الخلو من الدنس دون تقييدها بتفسير أخلاقي أو طقسي بعينه.
- source_word: ἀμάραντον
  choice: لا يذبل
  rationale: يحافظ على الصورة الحية للشيء الذي لا يفقد نضارته.
- source_word: τετηρημένην
  choice: محفوظٍ
  rationale: صيغة اسم المفعول تعبّر عن الحفظ القائم والمستمر الناتج عن فعل سابق.
- source_word: ἐν οὐρανοῖς
  choice: في السماوات
  rationale: يحفظ صيغة الجمع في اليونانية.
- source_word: εἰς ὑμᾶς
  choice: لأجلكم
  rationale: تعبير عربي طبيعي عن كون الميراث محفوظًا لصالح المخاطَبين ومن أجلهم.
theological_decisions:
- issue: دلالة حرف الجر εἰς في مطلع الآية
  choice: إلى ميراثٍ
  alternative: لميراثٍ
  rationale: يحفظ اتجاه العبارة اليونانية وارتباطها بالسياق السابق دون تحويلها إلى غرض تفسيري صريح.
- issue: هوية فاعل الحفظ
  choice: 'استعمال المبني للمجهول: محفوظٍ'
  alternative: حفظه الله
  rationale: النص اليوناني لا يصرّح بالفاعل، ولذلك تُحفظ هذه الضمنية ولا يُضاف اسم الله إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع تكرار «لا» للمحافظة على التوازي الثلاثي في الأصل. ضُبطت صفات «ميراث» بالجر، وحُفظت صورة الذبول وصيغة جمع «السماوات».
