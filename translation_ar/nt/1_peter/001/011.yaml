base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: ar
  text: باحثين في أيِّ شخصٍ أو أيِّ زمانٍ كان روحُ المسيح الكائنُ فيهم يشير، وهو يشهد مسبقًا بالآلام المتعلقة بالمسيح[a] وبالأمجاد التي تأتي بعد ذلك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آلام المسيح».'
    reason: قراءة بديلة ممكنة للتركيب اليوناني τὰ εἰς Χριστὸν παθήματα.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: باحثين
  rationale: يحافظ على معنى التقصّي والبحث، ويصل الكلام بما قبله بوصفه حالًا للأنبياء.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: عن أيِّ شخصٍ أو أيِّ زمانٍ
  rationale: يحفظ وجهي السؤال في اليونانية، الشخص والزمان، من غير دمجهما في سؤال زمني واحد.
- source_word: ἐδήλου
  choice: كان ... يشير إليه
  rationale: صيغة «كان يشير» تنقل دلالة الماضي الناقص على الإشارة المستمرة، وتبقى طبيعية في العربية.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: روحُ المسيح الذي فيهم
  rationale: يحفظ ارتباط الروح بالمسيح ووجوده في الأنبياء، من غير اختزال تفسيري.
- source_word: προμαρτυρόμενον
  choice: إذ شهد مسبقًا
  rationale: ينقل معنى الشهادة ومعنى السابقة الزمنية اللذين تتضمنهما الكلمة المركبة.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: الآلام المتعلقة بالمسيح
  rationale: تعكس الصلة التي تعبّر عنها εἰς من غير حسمها في ملكية صريحة أو إدخال معنى «المقدَّرة له» غير المنصوص عليه؛ وتُذكر القراءة الأقرب إلى الصياغة التقليدية في الحاشية.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: الأمجاد التي بعدها
  rationale: يحفظ جمع «الأمجاد» والتتابع الزمني بعد الآلام بصياغة عربية موجزة.
theological_decisions:
- issue: دلالة «روح المسيح» وعلاقته بالأنبياء
  choice: الإبقاء على العبارة المباشرة «روح المسيح الذي فيهم»
  alternative: الروح النبوي المتكلم عن المسيح
  rationale: النص اليوناني ينسب الروح إلى المسيح ويصرّح بوجوده في الأنبياء؛ لذلك لا تُخفَّف العبارة إلى تفسير أقل مباشرة.
- issue: قوة εἰς في عبارة τὰ εἰς Χριστὸν παθήματα
  choice: الآلام المتعلقة بالمسيح
  alternative: آلام المسيح
  rationale: التركيب يحتمل صلة عامة بالمسيح كما يحتمل أن يُفهم على أنه آلامه؛ يحافظ المتن والحاشية معًا على هذا التوتر من غير فرض حسم مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «المسيح» ترجمةً للقب Χριστός، وحُفظ جمع «الأمجاد» كما في الأصل.
