  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: ar
  text: الذين يُحرَسون بقدرة الله بالإيمان لخلاصٍ مستعدٍّ لأن يُعلَن في الزمان الأخير[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بالثقة»؛ والأقل احتمالًا هنا: «بالأمانة».'
    reason: lexical_alternative
  - marker: b
    text: أو «عند الزمان الأخير».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: الذين
  rationale: أداة التعريف اليونانية تستأنف الإشارة إلى المخاطَبين في الآية السابقة، ويؤدي اسم الموصول العربي هذا الربط بوضوح وطبيعية.
- source_word: φρουρουμένους
  choice: تحرسهم
  rationale: صيغة المضارع المبني للمجهول في اليونانية تدل على حراسة مستمرة واقعة عليهم. وصيغة «تحرسهم قدرة الله» تحافظ على معنى الحماية والحراسة، وتُظهر أن قدرة الله هي الوسيلة الفاعلة دون افتعال صياغة مبنية للمجهول في العربية.
- source_word: ἐν δυνάμει θεοῦ
  choice: قدرة الله
  rationale: تفيد ἐν هنا الوسيلة مع اسم المفعول؛ فجاءت «تحرسهم قدرة الله» لتبين أن الحراسة تتم بقدرة الله، مع أسلوب عربي طبيعي.
- source_word: διὰ πίστεως
  choice: بالإيمان
  rationale: تفيد διά مع المضاف إليه الوسيلة. و«الإيمان» هو المقابل الأوضح لـ πίστις هنا، مع إثبات احتمال «الثقة» واحتمال «الأمانة» الأضعف في الحاشية.
- source_word: εἰς σωτηρίαν
  choice: لخلاصٍ
  rationale: تدل εἰς على الغاية أو النتيجة، وتحافظ اللام على هذا الاتجاه نحو الخلاص الآتي. وجاء الاسم نكرة كما في اليونانية، وهو موصوف بما بعده.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: مستعدٍّ لأن يُعلَن
  rationale: تنقل العبارة معنى أن الخلاص جاهز للكشف أو الظهور، وتحافظ صيغة «يُعلَن» على المبني للمجهول من غير تعيين من يقوم بالإعلان.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: في الزمان الأخير
  rationale: ينقل «الزمان» معنى καιρός بوصفه وقتًا حاسمًا أو معينًا، ويحافظ «الأخير» على الدلالة الأخروية من غير إدخال مخطط لاهوتي تفصيلي.
theological_decisions:
- issue: العلاقة بين حفظ الله واستجابة الإنسان في διὰ πίστεως
  choice: الله يحرس المخاطَبين بقدرته، والإيمان هو الوسيلة المذكورة في النص.
  alternative: أن تكون الحراسة مستقلة عن الإيمان بوصفه إضافة وصفية فقط، أو أن يكون المقصود الأساسي بـ πίστις هو الأمانة.
  rationale: تبقي الصياغة قدرة الله والإيمان معًا بحسب تركيب النص، ولا تحسم جدلًا مذهبيًا بشأن المثابرة أو الارتداد.
- issue: التوقيت الأخروي للخلاص
  choice: الخلاص هنا متجه إلى إعلان مستقبلي في الزمان الأخير.
  alternative: أن يشير هنا إلى الاهتداء الحاضر وحده، أو أن ينفي كل بُعد حاضر للخلاص في مواضع أخرى.
  rationale: تدل عبارة «مستعد لأن يُعلَن في الزمان الأخير» بوضوح على التوجه المستقبلي، من غير تعميم يتجاوز هذه الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم الفعل «تحرسهم» بدل تركيب اسمي ثقيل لإبراز الحراسة المستمرة ووسيلتها بصورة طبيعية. وحُفظت نكرة «خلاص» والاتجاه المستقبلي للنص، مع وضع علامتي الحاشية [a] و[b] في المتن.
