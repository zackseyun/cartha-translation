translation:
  language: ar
  text: 'لِأَنَّهُ مَكْتُوبٌ: «سَتَكُونُونَ قِدِّيسِينَ[a]، لِأَنِّي أَنَا قُدُّوسٌ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصيغة أمر مباشرة: «كونوا قديسين». يتبع النص اليوناني صياغة الاقتباس الكتابي بالمستقبل: «ستكونون قديسين».'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: لِأَنَّهُ
  rationale: تُدخِل العبارة الأساس الكتابي للحث السابق، وتحفظ دلالتها السببية بوضوح.
- source_word: γέγραπται
  choice: مَكْتُوبٌ
  rationale: صيغة عربية مألوفة لإدخال اقتباس كتابي، وتحفظ معنى الصيغة اليونانية التامة المبنية للمجهول بوصف المكتوب قائمًا ونافذًا.
- source_word: ὅτι
  choice: حُذفت لفظًا وعُبِّر عنها بعلامتي الاقتباس
  rationale: ὅτι الأولى تُدخل القول المقتبس، وعلامتا الاقتباس تؤديان هذه الوظيفة طبيعيًا في العربية الحديثة.
- source_word: Ἅγιοι
  choice: قِدِّيسِينَ
  rationale: تحفظ معنى القداسة الأخلاقي والعهدي، وتلائم وقوع الخبر منصوبًا في جملة «ستكونون قديسين».
- source_word: ἔσεσθε
  choice: سَتَكُونُونَ
  rationale: تحفظ صيغة المستقبل الواردة في نص الاقتباس اليوناني، مع بقاء قوتها الطلبية في السياق الكتابي.
- source_word: ὅτι
  choice: لِأَنِّي
  rationale: ὅτι الثانية سببية، ولذلك تُرجمت بما يبيّن أن قداسة الله هي أساس الدعوة إلى القداسة.
- source_word: ἐγὼ
  choice: أَنَا
  rationale: أُبقي الضمير المنفصل مع ياء المتكلم للمحافظة على التوكيد الصريح في الإشارة الإلهية إلى الذات.
- source_word: ἅγιος
  choice: قُدُّوسٌ
  rationale: «قدوس» هو الوصف العربي الطبيعي الراسخ لقداسة الله، مع الحفاظ على الجذر الدلالي نفسه المستعمل للمخاطَبين.
theological_decisions:
- issue: قوة صيغة المستقبل ἔσεσθε في اقتباس القداسة
  choice: سَتَكُونُونَ قِدِّيسِينَ
  alternative: كُونُوا قِدِّيسِينَ
  rationale: تحفظ الترجمة صيغة المستقبل التي يتبعها النص اليوناني في الاقتباس، من غير أن تلغي ما لها في الأسلوب التشريعي والوعظي الكتابي من قوة الأمر. وتوضح الحاشية إمكان التعبير عنها بأمر مباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «قديسين» للمخاطَبين و«قدوس» لله وفق الاستعمال العربي الطبيعي، مع إبقاء الصلة الدلالية بين اللفظين. وُضع التشكيل بقدر يعين على القراءة ويمنع الالتباس.
