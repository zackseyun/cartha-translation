source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: ar
  text: مباركٌ اللهُ، أبو ربنا يسوع المسيح[a]، الذي بحسب رحمته العظيمة جعلنا نولد من جديد[b] لرجاءٍ حيّ، بقيامة يسوع المسيح من بين الأموات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يسوع المَسيّا». واللفظ اليوناني Χριστός لقبٌ معناه «المسيح» أو «المَسيّا».
    reason: alternative_reading
  - marker: b
    text: أو «وهبنا ولادةً جديدة». ويحافظ الفعل اليوناني على صورة الولادة من جديد.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: مباركٌ
  rationale: صفة خبرية في صيغة تمجيد؛ وتحافظ «مباركٌ» على قوة التطويب والتسبيح من غير تحويلها إلى فعل لا يطابق الصيغة اليونانية.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: الله، أبو
  rationale: 'يحفظ الاسمين والعلاقة التي يعبّر عنها التركيب اليوناني، مع استعمال البدل في عربية طبيعية: «الله، أبو ربنا».'
- source_word: κυρίου
  choice: ربنا
  rationale: ينقل κύριος بوصفه لقبًا، وتلحق به في العربية صيغة المتكلم الجمع كما في ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، وهو يحفظ دلالته اللقبية ولا يعامله كلقب عائلة.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: بحسب رحمته العظيمة
  rationale: «بحسب» تحفظ دلالة المعيار أو المقدار في κατά، و«العظيمة» تنقل وفرة الرحمة بلغة عربية واضحة.
- source_word: ἀναγεννήσας
  choice: جعلنا نولد من جديد
  rationale: يحفظ صورة الولادة المتجددة ويُظهر صراحة أن الله هو الفاعل، كما يقتضي اسم الفاعل اليوناني المتعدي.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: لرجاءٍ حي
  rationale: اللام تعبّر طبيعيًا عن الغاية أو النتيجة التي تفيدها εἰς، مع إبقاء استعارة الرجاء الحي.
- source_word: δι’ ἀναστάσεως
  choice: بقيامة
  rationale: الباء تنقل بإيجاز وطبيعية معنى الوسيلة الذي تؤديه διά مع المضاف إليه.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: صياغة عربية واضحة تحفظ معنى الخروج من وسط الموتى في تعبير القيامة.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا مسيانيًا
  choice: يسوع المسيح
  alternative: يسوع المَسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي والراسخ للقب اليوناني، ويحفظ معناه المسياني من غير أن يحوله إلى اسم عائلة.
- issue: فاعلية الله في ἀναγεννήσας
  choice: جعلنا نولد من جديد
  alternative: وهبنا ولادة جديدة
  rationale: الصياغة المختارة تُبقي الله فاعل الولادة الجديدة صراحة وتحفظ صورة الولادة، من غير بناء منظومة لاهوتية تتجاوز العبارة.
- issue: العلاقة بين الولادة الجديدة والرجاء الحي
  choice: لرجاءٍ حي
  alternative: إلى رجاءٍ حي
  rationale: اللام عربية طبيعية وتبقي دلالة الغاية أو النتيجة في εἰς، من غير حسم زائد لطبيعة العلاقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صيغة التمجيد، وظهر فعل الله في الولادة الجديدة، واستُعمل «المسيح» بوصفه لقبًا عربيًا مفهومًا. وُضعت علامتا الحاشيتين في موضعيهما المتصلين مباشرة بالمسألتين المعجميتين.
