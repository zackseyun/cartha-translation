id: 1PE.1.15
reference: 1 Peter 1:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: ar
  text: بَلْ كَمَا أَنَّ الَّذِي دَعَاكُمْ قُدُّوسٌ، كُونُوا[a] أَنْتُمْ أَيْضًا قِدِّيسِينَ فِي سُلُوكِكُمْ كُلِّهِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صِيرُوا قديسين». قد يفيد الفعل اليوناني الدخول في هذه الحال أو إظهارها، مع أن «كونوا» هي صيغة الحث الأيسر في العربية هنا.
    reason: lexical_alternative
  - marker: b
    text: أو «في طريقة عيشكم كلها». يدل اللفظ اليوناني على السلوك أو مجمل أسلوب الحياة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بَلْ
  rationale: تفيد الانتقال التقابلي عن الشهوات السابقة المذكورة في السياق، و«بل» تؤدي هذا المعنى بوضوح وإيجاز.
- source_word: κατὰ
  choice: كَمَا أَنَّ
  rationale: تفيد المطابقة والاقتداء هنا، وهذه الصياغة العربية تستكمل المقارنة طبيعيًا مع خبر «قدوس».
- source_word: τὸν καλέσαντα ὑμᾶς
  choice: الَّذِي دَعَاكُمْ
  rationale: تنقل اسم الفاعل المعرّف بوصفه جملة موصولة عربية طبيعية، مع الحفاظ على فعل الدعوة والمخاطَبين.
- source_word: ἅγιον
  choice: قُدُّوسٌ
  rationale: صفة لله في هذا السياق؛ و«قدوس» اللفظ العربي المألوف الدال على قداسة الله، من غير تحويل الصفة إلى اسم علم مستقل.
- source_word: καὶ αὐτοὶ
  choice: أَنْتُمْ أَيْضًا
  rationale: الضمير المنفصل يحفظ توكيد αὐτοὶ، و«أيضًا» تنقل καί وتبرز المقابلة بين قداسة الداعي وقداسة المدعوين.
- source_word: ἅγιοι
  choice: قِدِّيسِينَ
  rationale: تنقل وصف المؤمنين بالقداسة، مع استعمال عربي يميّز صرفيًا بين وصف الله «قدوس» ووصف البشر «قديسين» مع بقاء الصلة الدلالية واضحة.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: فِي سُلُوكِكُمْ كُلِّهِ
  rationale: ἀναστροφή تدل على السلوك أو مجمل طريقة العيش؛ و«سلوككم كله» واضحة وطبيعية وتشمل جميع نواحي الحياة.
- source_word: γενήθητε
  choice: كُونُوا
  rationale: أمر عربي طبيعي في الحث على الاتصاف بالقداسة. ويظل معنى «صيروا» الممكن مذكورًا في الحاشية حتى لا يُحسم البعد الدخولي أو الصيروري في الفعل اليوناني.
theological_decisions:
- issue: العلاقة بين قداسة الله ودعوة المؤمنين إلى القداسة
  choice: كَمَا أَنَّ الَّذِي دَعَاكُمْ قُدُّوسٌ ... كُونُوا أَنْتُمْ أَيْضًا قِدِّيسِينَ
  alternative: على مثال القدوس الذي دعاكم، صيروا أنتم أيضًا قديسين
  rationale: تحفظ الصياغة المقابلة المقصودة بين صفة الداعي وصفة المدعوين، من غير إضافة تفسير لاهوتي لطبيعة هذه المشابهة أو مداها.
- issue: دلالة الأمر γενήθητε
  choice: كُونُوا
  alternative: صِيرُوا
  rationale: «كونوا» هي صيغة الحث العربية الأوضح، ولا تفرض تصورًا مذهبيًا معينًا لمسار التقديس؛ أما احتمال الصيرورة الذي قد يحمله الفعل فمحفوظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «قدوس» لله و«قديسين» للمخاطَبين وفق الاستعمال العربي الطبيعي، مع الحفاظ على التوازي الدلالي في الأصل. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما، لا بحسب ترتيب الحواشي الإنجليزية الملتبس.
