id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: ar
  text: 'بحسب معرفة الله الآب السابقة[a]، في تقديس الروح[b]، للطاعة والرشّ بدم يسوع المسيح[c]: لتكثر لكم النعمة والسلام.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المعرفة السابقة» ترجمة للكلمة اليونانية πρόγνωσις. ويختلف المفسرون في كونها تشدد على علم الله السابق، أو اختياره السابق، أو كليهما.
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«الروح» هنا، على الأرجح، الروح القدس. ويمكن فهم الإضافة اليونانية بمعنى التقديس الذي يجريه الروح، لكن الصياغة المختصرة في المتن تحافظ على تركيب الأصل.
    reason: grammatical_ambiguity
  - marker: c
    text: 'يحمل «المسيح» هنا معنى اللقب، أي الممسوح أو المسيّا. ويرجح أن عبارة «الرشّ بالدم» تستحضر صور العهد والتطهير في العهد القديم، ولا سيما خروج 24: 8.'
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: بحسب معرفة ... السابقة
  rationale: تنقل κατά معنى الموافقة أو المعيار، وتحافظ على المعنى المباشر لـ πρόγνωσις من غير أن تحسم هل المقصود مجرد العلم السابق أم الاختيار السابق أم كليهما.
- source_word: θεοῦ πατρός
  choice: الله الآب
  rationale: صياغة عربية طبيعية تحفظ العلاقة التفسيرية في العبارة اليونانية وتشير إلى أن المعرفة السابقة هي لله الآب.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: في تقديس الروح
  rationale: تحافظ على اسم الحدث ἁγιασμός وعلى الإضافة اليونانية دون توسيعها إلى عبارة تفسيرية مثل «بعمل الروح المقدِّس».
- source_word: εἰς ὑπακοὴν
  choice: للطاعة
  rationale: تنقل دلالة εἰς على الغاية أو النتيجة، مع إبقاء الاسم المجرد كما في اليونانية.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: والرشّ بدم
  rationale: صياغة عربية واضحة تنقل فعل الرش بالدم وتحافظ على صدى صور العهد والتطهير.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالته اللقبية مع الصياغة العربية المألوفة.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: لتكثر لكم النعمة والسلام
  rationale: تنقل صيغة التمني في الفعل اليوناني وتقدم بركة رسولية عربية واضحة وكريمة الأسلوب.
theological_decisions:
- issue: دلالة πρόγνωσις وصلتها بالاختيار
  choice: معرفة الله السابقة
  alternative: اختيار الله السابق أو تعيينه السابق
  rationale: اللفظة اليونانية تحتمل نقاشًا حول العلم السابق والاختيار السابق؛ لذلك أبقى المتن على التعبير المعجمي المحايد ولا يفرض مذهبًا تفسيريًا بعينه.
- issue: مرجع πνεύματος
  choice: الروح، أي الروح القدس
  alternative: روح الإنسان أو معنى غير شخصي للروح
  rationale: البنية الثلاثية التي تذكر الله الآب والروح ويسوع المسيح تجعل الإشارة إلى الروح القدس هي الأرجح، من غير إضافة كلمة «القدس» غير الموجودة صراحة في النص.
- issue: العلاقة النحوية في πνεύματος
  choice: تقديس الروح
  alternative: التقديس الذي يعمله الروح أو تقديس روح الإنسان
  rationale: الإضافة اليونانية موجزة؛ فحُفظ إيجازها في المتن، مع بيان الفهم الأرجح في الحاشية بدل إدخال التفسير في النص.
- issue: القوة اللقبية لـ Χριστός
  choice: المسيح
  alternative: اعتباره جزءًا من اسم مركب فحسب
  rationale: يحفظ المقابل العربي معنى اللقب، وهو في الوقت نفسه التعبير العربي الطبيعي الراسخ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية كريمة. حُفظت الأسماء المجردة والتراكيب الموجزة حيث تحمل توترًا لغويًا أو لاهوتيًا حقيقيًا، مع شرح مواضع الالتباس في الحواشي بدل حسمها داخل المتن.
