    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: كان قد عُرِف مسبقًا
  rationale: يحافظ المبني للمجهول على صيغة اليونانية، وتؤدي «مسبقًا» معنى السابقة الزمنية في الفعل προγινώσκω من غير تحويله في المتن إلى الاختيار أو التعيين السابق.
- source_word: πρὸ καταβολῆς κόσμου
  choice: قبل تأسيس العالم
  rationale: تعبير عربي واضح يحفظ صورة إرساء أساس العالم ودلالة الفعل الإلهي السابق للخلق.
- source_word: φανερωθέντος
  choice: أُظهِر
  rationale: يحفظ صيغة المبني للمجهول ودلالة صيرورته ظاهرًا ومعلنًا، من غير قصر المعنى على مجرد الظهور الذاتي.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: عند نهاية الأزمنة
  rationale: ينقل الدلالة الزمنية والأخروية للعبارة من غير إضافة اسم الإشارة «هذه» غير الوارد صراحة في اليونانية.
- source_word: δι’ ὑμᾶς
  choice: من أجلكم
  rationale: ينقل معنى المنفعة أو الغاية الذي تؤديه διά مع النصب في هذا السياق.
theological_decisions:
- issue: دلالة προεγνωσμένου في الحديث عن المسيح قبل خلق العالم
  choice: الإبقاء على معنى «عُرِف مسبقًا» في المتن
  alternative: «اختير مسبقًا» أو «عُيِّن مسبقًا»
  rationale: قد يتضمن العلم السابق في السياق الكتابي قصدًا إلهيًا، لكن اللفظة نفسها لا تُلزم المترجم باستبدالها بلغة الاختيار أو التعيين؛ لذلك يحفظ النص التوتر الدلالي من غير ترجيح مذهبي.
- issue: القوة الزمنية لعبارة ἐπ’ ἐσχάτου τῶν χρόνων
  choice: «عند نهاية الأزمنة»
  alternative: «في هذه الأزمنة الأخيرة»
  rationale: تحفظ الصياغة المختارة العبارة الأخروية كما وردت، ولا تضيف دلالة الإشارة التي لا يصرح بها النص اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المبني للمجهول في الفعلين للمحافظة على بنية الأصل، وأُبقي اتصال الضمير بالمسيح المذكور في السياق السابق من غير إدخال اسمه في الآية.
