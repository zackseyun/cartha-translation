  text: كان قد عُرِف مسبقًا، قبل تأسيس العالم[a]، لكنه أُظهِر في آخر الأزمنة من أجلكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان قد اختير مسبقًا»؛ تقول اليونانية: «كان قد عُرِف مسبقًا». وقد يفيد ذلك القصد الإلهي، لكنه لا يقتضي هذا التفسير الأوسع في المتن.'
    reason: lexical_alternative
