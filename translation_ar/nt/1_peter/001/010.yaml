lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: أمّا هذا الخلاص
  rationale: تنقل περί مع المضاف إليه بوصفها تقديمًا لموضوع الكلام، ويشير «هذا» طبيعيًا إلى الخلاص المذكور في السياق السابق، بدل الصياغة الحرفية الثقيلة «الخلاص الذي».
- source_word: σωτηρίας
  choice: الخلاص
  rationale: «الخلاص» هو المقابل العربي الواضح والمألوف لـσωτηρία، ويحفظ دلالتها اللاهوتية وصلتها بالسياق.
- source_word: ἐξεζήτησαν
  choice: بحث عنه
  rationale: ينقل معنى الطلب والبحث الجاد، والضمير يعود بوضوح إلى «هذا الخلاص».
- source_word: ἐξηραύνησαν
  choice: استقصاه بدقة
  rationale: «استقصى» يعبّر عن الفحص المتعمق، وإضافة «بدقة» تحفظ قوة الفعل وتميّزه عن فعل البحث السابق.
- source_word: προφῆται
  choice: الأنبياء
  rationale: الجملة الوصفية اللاحقة تعيّن الأنبياء المقصودين، والتعريف طبيعي في العربية في هذا السياق.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: الذين تنبأوا بالنعمة التي لكم
  rationale: تحفظ الصلة الوصفية ومضمون النبوة، وتبقي εἰς ὑμᾶς في معنى العلاقة والنفع دون إدخال زمن مستقبل غير مصرّح به.
- source_word: χάριτος
  choice: النعمة
  rationale: «النعمة» هي المقابل المألوف لـχάρις، وتحفظ معنى إحسان الله المجاني في سياق الخلاص.
- source_word: εἰς ὑμᾶς
  choice: التي لكم
  rationale: صياغة موجزة تحفظ اتجاه النعمة إلى المخاطَبين وكونها لصالحهم، من غير إضافة «الآتية» أو «المعدّة».
theological_decisions:
- issue: هل يُصرَّح بالعنصر المستقبلي في «النعمة التي لكم»؟
  choice: الإبقاء على «النعمة التي لكم» من دون إضافة زمن مستقبل
  alternative: النعمة التي كانت ستأتي إليكم
  rationale: السياق النبوي قد يدل على الاستقبال، لكن نص هذه الآية لا يتضمن فعلًا أو وصفًا صريحًا للمستقبل؛ لذلك تُحفظ دلالة النص المباشرة ويُذكر الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت بنية «أمّا... فقد» لتقديم موضوع البحث على نحو طبيعي، مع إبقاء الفعلين المتعاقبين للدلالة على شدة بحث الأنبياء. وُضع مؤشر الحاشية بعد العبارة التي يشرحها.
