  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: ar
  text: بَلْ بِدَمٍ كَرِيمٍ، هُوَ دَمُ الْمَسِيحِ، كَدَمِ حَمَلٍ بِلَا عَيْبٍ وَلَا دَنَسٍ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: بَلْ
  rationale: 'تفيد الإضراب الانتقالي والتقابل القوي مع النفي في الآية السابقة: ليس بأشياء تفنى، بل بدم.'
- source_word: τιμίῳ
  choice: الْكَرِيمِ
  rationale: تنقل معنى علوّ القيمة والقدر، وتحافظ على النبرة الرفيعة من غير إيحاء تجاري قد يصاحب «الثمين».
- source_word: αἵματι
  choice: بِدَمِ
  rationale: ترجمة مباشرة للاسم المحسوس؛ ودلالته على الموت الذبيحي تبقى مستفادة من السياق ولا تحل محل اللفظ.
- source_word: ὡς
  choice: كَدَمِ
  rationale: تُظهر أداة التشبيه، مع تكرار «دم» إيضاحًا طبيعيًا في العربية بأن المقارنة واقعة بين الدم ودم الحمل.
- source_word: ἀμνοῦ
  choice: حَمَلٍ
  rationale: المقابل العربي المباشر، ويحفظ الإيحاء بصورة الذبيحة من غير إضافة تفسيرية.
- source_word: ἀμώμου
  choice: بِلَا عَيْبٍ
  rationale: يحفظ مفردات صلاحية الذبيحة وقبولها، ولا يحصر الوصف في معنى أخلاقي مجرد.
- source_word: καὶ
  choice: وَلَا
  rationale: في التركيب العربي المنفي «بلا عيب ولا دنس» تؤدي التنسيق الطبيعي بين الوصفين.
- source_word: ἀσπίλου
  choice: دَنَسٍ
  rationale: يحفظ تمايز الوصف الثاني عن «عيب» ويعبّر بوضوح عن الخلو من كل ما يشوب.
- source_word: Χριστοῦ
  choice: الْمَسِيحِ
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، وهو هنا مضاف إليه يحدد صاحب الدم.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا مسيانيًا
  choice: الْمَسِيحِ
  alternative: كريستوس
  rationale: «المسيح» ينقل معنى اللقب في العربية بوضوح وهو الاستعمال العربي المعياري، أما النقل الصوتي فلا يبين معناه ولا تدعو إليه القرينة.
- issue: الصورة الذبيحية في وصفي ἀμώμου وἀσπίλου
  choice: بِلَا عَيْبٍ وَلَا دَنَسٍ
  alternative: بريء لا عيب فيه
  rationale: الصياغة المختارة تبقي الوصفين المتميزين وصورة الحمل الصالح للذبيحة، من غير تحويلهما إلى تقرير عقائدي تفسيري عن البراءة الأخلاقية وحدها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. رُتّب المضاف إليه «المسيح» قرب «الدم» وفق الأسلوب العربي الطبيعي، واستُخدم «كَدَمِ» لرفع أي التباس في جهة التشبيه. لا حاجة إلى حاشية مقابلة للحاشية الإنجليزية، لأن «المسيح» هو الترجمة العربية الدلالية والتقليدية المباشرة للقب Χριστός.
