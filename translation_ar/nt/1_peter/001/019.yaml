review_pass:
  verdict: revise
  source_fidelity: 'يستوعب النص عناصر اليونانية الأساسية: التقابل بـ«بل»، والدم، والمسيح، وصورة الحمل الخالي من العيب والدنس. لكن ترتيب «بدم المسيح الكريم» يجعل «الكريم» في العربية أقربَ نحويًا ودلاليًا إلى «المسيح» منه إلى «الدم»، بينما τιμίῳ تصف «الدم» صراحةً في الأصل.'
  naturalness: «كدم حمل» سليمة ومفهومة، و«بلا عيب ولا دنس» فصيحة وطبيعية في السياق الذبيحي. تحتاج عبارة افتتاحية إلى إعادة ترتيب محدودة لإزالة التباس مرجع الصفة مع الحفاظ على الأسلوب العربي الموجز.
  terminology: «المسيح» مقابل راسخ ودقيق لـΧριστοῦ. و«عيب» و«دنس» يحافظان على تمييز الوصفين الذبيحيين ἀμώμου وἀσπίλου. لا تستلزم الآية حاشية عربية؛ إذ لا يوجد خلاف نصي أو بديل ترجمي لازم هنا.
  issues:
  - severity: medium
    issue: التباس نطاق الصفة في «بدم المسيح الكريم».
    rationale: الصفة «الكريم» تأتي بعد المضاف إليه «المسيح»، فيُحتمل بقوة أن تكون نعتًا للمسيح («المسيح الكريم») لا للدم. أما τιμίῳ في اليونانية فنعت لـαἵματι، أي للدم. ينبغي تقديم النعت أو فصل التركيب بحيث ينسب الكرم/الثمن إلى الدم بوضوح.
  revised_text: بَلْ بِدَمٍ كَرِيمٍ، هُوَ دَمُ الْمَسِيحِ، كَدَمِ حَمَلٍ بِلَا عَيْبٍ وَلَا دَنَسٍ.
