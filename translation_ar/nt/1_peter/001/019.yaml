  to: بَلْ بِدَمٍ كَرِيمٍ، هُوَ دَمُ الْمَسِيحِ، كَدَمِ حَمَلٍ بِلَا عَيْبٍ وَلَا دَنَسٍ.
  rationale: قُدِّم وصف «كريم» ليكون نعتًا صريحًا لـ«دم»، ثم أُتبع ببيان «هو دم المسيح» لإبقاء إضافة Χριστοῦ واضحة من غير أن يُفهم الوصف نعتًا للمسيح. وتحافظ الصياغة على التشبيه بدم حمل وعلى الوصفين المتميزين بلا إضافة تفسيرية عقائدية.
