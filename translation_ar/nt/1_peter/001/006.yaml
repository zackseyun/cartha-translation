  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: ar
  text: وفي هذا تبتهجون، مع أن الحزن قد أصابكم الآن قليلًا، إن اقتضت الضرورة، وسط تجارب متنوعة[a].
  philosophy: optimal-equivalence
  footnotes:
