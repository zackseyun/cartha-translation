    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: وفي هذا
  rationale: تحيل العبارة إلى الرجاء والخلاص والميراث المذكورة في السياق السابق، وتحافظ على الإحالة من غير تحويلها صراحة إلى علاقة سببية.
- source_word: ἀγαλλιᾶσθε
  choice: تبتهجون
  rationale: «تبتهجون» عربية واضحة تدل على الفرح القوي الذي يحمله الفعل، وهي أبلغ من «تفرحون» وأيسر من تعبيرات أدبية نادرة.
- source_word: ὀλίγον ἄρτι
  choice: الآن وقتًا قليلًا
  rationale: يحفظ التعبير عنصر الحاضر في ἄρτι وقِصر المدة في ὀλίγον، مع صياغة عربية طبيعية.
- source_word: εἰ δέον
  choice: إن كان لا بد
  rationale: يحافظ على معنى الضرورة وعلى الصيغة الشرطية، من غير بيان مصدر الضرورة أو تفسيرها لاهوتيًا.
- source_word: λυπηθέντες
  choice: الحزن قد أصابكم
  rationale: ينقل كون المخاطبين واقعين تحت الحزن، وهو معنى المبني للمجهول في اسم الفاعل اليوناني، بصياغة عربية طبيعية غير متكلفة.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: بسبب تجارب متنوعة
  rationale: يفيد السياق أن التجارب المتنوعة هي الظروف التي سببت الحزن. و«تجارب» تبقي مجال اللفظة أوسع من «إغراءات» التي تحصرها في الإغراء بالخطيئة.
theological_decisions:
- issue: دلالة πειρασμοῖς في سياق الألم وامتحان الإيمان
  choice: تجارب
  alternative: اختبارات؛ إغراءات
  rationale: يتحدث السياق المباشر عن الحزن وعن امتحان الإيمان في العدد التالي، لذلك تنقل «تجارب» معنى الشدائد والظروف الممتحنة من غير قصر اللفظة على الإغراء بالخطيئة. وتوضح الحاشية المجال الدلالي الأوسع.
- issue: دلالة εἰ δέον على الضرورة
  choice: إن كان لا بد
  alternative: لأنه لا بد؛ إن شاء الله
  rationale: تحفظ العبارة الشرط والضرورة كما يوردهما النص، من غير تحويل الشرط إلى تقرير قاطع أو تعيين فاعل الضرورة بما يتجاوز اللفظ.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعمل «تبتهجون» لإبراز قوة الفرح، و«الحزن قد أصابكم» لتجنب الصياغة المبنية للمجهول المتكلفة، مع إبقاء التوتر بين الابتهاج والحزن والضرورة الشرطية في النص.
