  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: ar
  text: مولودين من جديد، لا من بذرةٍ فانيةٍ بل من بذرةٍ لا تفنى، بكلمة الله الحيّة والباقية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بكلمة الله الحيّ والباقي». يمكن في اليونانية أن يعود الوصفان «الحيّ» و«الباقي» إلى «الكلمة» أو إلى «الله»، لكن السياق يرجّح عودهما إلى «الكلمة».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: مولودين من جديد
  rationale: يحافظ على صورة الولادة وعلى المبني للمجهول في اسم المفعول اليوناني التام، الذي يدل على فعل تمّ وتستمر نتيجته، كما يلائم تعلّقه بسياق الآية السابقة.
- source_word: σπορᾶς
  choice: زرع
  rationale: ينقل صورة الأصل الذي تنشأ منه الولادة، ويستقيم طبيعيًا مع التقابل بين الفاني والذي لا يفنى.
- source_word: φθαρτῆς
  choice: فانٍ
  rationale: تعبير عربي واضح وموجز يدل على ما يلحقه الفساد والزوال، ويحافظ على التقابل اللفظي مع ἀφθάρτου.
- source_word: ἀφθάρτου
  choice: لا يفنى
  rationale: صياغة عربية طبيعية تقابل «فانٍ» بوضوح وتنقل معنى عدم الفساد والزوال.
- source_word: διὰ
  choice: بـ
  rationale: الباء العربية تؤدي معنى الوسيلة الذي تحمله διά مع المضاف إليه هنا بصورة موجزة وطبيعية.
- source_word: λόγου
  choice: كلمة
  rationale: المقابل المباشر لـλόγος في هذا السياق، ويحافظ على الصلة بالسياق اللاحق الذي يتحدث عن كلمة الرب.
- source_word: ζῶντος
  choice: الحيّة
  rationale: ينقل اسم الفاعل الوصفي مباشرة، مع مطابقته لـ«كلمة» في التأنيث بحسب النحو العربي.
- source_word: θεοῦ
  choice: الله
  rationale: يُفهم تركيب الإضافة «كلمة الله» على أنه نسبة الكلمة إلى الله، دون إضافة تفسير زائد مثل «الآتية من الله».
- source_word: μένοντος
  choice: الباقية
  rationale: ينقل معنى الاستمرار والثبات، ويلائم تركيز السياق القريب على دوام الكلمة.
theological_decisions:
- issue: تعلّق ζῶντος وμένοντος بـλόγου أو بـθεοῦ
  choice: 'اعتبار الوصفين عائدين إلى «كلمة»: «كلمة الله الحيّة والباقية»'
  alternative: «كلمة الله الحيّ والباقي»
  rationale: تطابق الصيغ اليونانية يسمح نحويًا بعود الوصفين إلى «الكلمة» أو إلى «الله»، لكن سياق الآيتين 24-25، ولا سيما دوام كلمة الرب، يرجّح وصف الكلمة. حُفظ الوجه الآخر في الحاشية لأنه احتمال نحوي حقيقي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ التركيب الاسمي التابع للسياق السابق بدل تحويله إلى جملة سببية مستقلة، واستُعمل «زرع» للمحافظة على استعارة المنشأ والولادة دون ألفاظ تقنية أو مذهبية.
