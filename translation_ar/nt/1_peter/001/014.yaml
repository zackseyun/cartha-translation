lexical_decisions:
- source_word: ὡς
  choice: كـ
  rationale: تفيد الهيئة أو الصفة التي يُوجَّه بها الحث، وتحافظ على ارتباط العبارة بما قبلها.
- source_word: τέκνα ὑπακοῆς
  choice: أبناء الطاعة
  rationale: يحافظ هذا التعبير على تركيب الإضافة في اليونانية وعلى دلالته الهوياتية والأخلاقية، بدل اختزاله مباشرة إلى مجرد صفة.
- source_word: μὴ συσχηματιζόμενοι
  choice: لا تتشكّلوا بحسب
  rationale: صياغة نهي طبيعية تنقل معنى اتخاذ نمط أو هيئة وفق شيء، وتُبقي مسؤولية المخاطَبين الأخلاقية ظاهرة دون حسم الصيغة الوسطى/المبنية للمجهول بأكثر مما يسمح به السياق.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: بحسب الشهوات
  rationale: «الشهوات» تنقل معنى الرغبات القوية ذات الاتجاه الأخلاقي السلبي في السياق، ولا تقتصر في العربية الكتابية والفصيحة على الدلالة الجنسية.
- source_word: πρότερον
  choice: التي كانت لكم سابقًا
  rationale: توضح الصياغة العربية تعلق الظرف بالشهوات التي ميّزت حياة المخاطَبين الماضية.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: في جهلكم
  rationale: ترجمة مباشرة تحفظ الإيجاز والغموض المقصود بشأن طبيعة الجهل، من غير إضافة تفسير عقائدي غير مصرح به في الآية.
theological_decisions:
- issue: هل يُصاغ التعبير الإضافي τέκνα ὑπακοῆς بعبارة وصفية مألوفة؟
  choice: أبناء الطاعة
  alternative: أبناء مطيعين
  rationale: اختيرت الإضافة للحفاظ على قوة التعبير بوصفه هوية تتسم بالطاعة، مع ذكر البديل العربي الأسلس في الحاشية دون فرضه على المتن.
- issue: مدى تفسير «الجهل» تفسيرًا لاهوتيًا
  choice: في جهلكم
  alternative: حين كنتم تجهلون الله
  rationale: النص اليوناني لا يذكر مفعول الجهل صراحة، لذلك أُبقي التعبير مفتوحًا ولم يُضف «الله» إلى المتن.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. حُفظ تركيب «أبناء الطاعة» لصلته ببنية الأصل، بينما صيغ باقي الكلام على نحو طبيعي ومفهوم للقارئ المعاصر.
