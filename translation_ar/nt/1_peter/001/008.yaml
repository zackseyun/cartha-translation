  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: ar
  text: مع أنكم لم تروه، فإنكم تحبونه. ومع أنكم لا ترونه الآن، فإنكم تؤمنون به وتبتهجون بفرح لا يُعبَّر عنه ومملوء بالمجد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بفرح لا يُعبَّر عنه ومُمجَّد»، أو «بفرح لا يُعبَّر عنه ومجيد».'
    reason: تحفظ الحاشية الاحتمالات المعقولة للفظة δεδοξασμένῃ، بين إبراز بنيتها الفعلية ووصف الفرح بأنه متصف بالمجد.
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: مع أنكم لم تروه
  rationale: ينقل اسم الموصول العائد إلى يسوع المسيح، ويحافظ على دلالة اسم الفاعل الأوريستي على عدم رؤيته سابقًا، بصياغة عربية طبيعية.
- source_word: ἀγαπᾶτε
  choice: فإنكم تحبونه
  rationale: مضارع يدل على محبتهم المستمرة له، مع إظهار المقابلة التنازلية مع عدم الرؤية.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: فإنكم تؤمنون به
  rationale: يفيد تركيب πιστεύω مع εἰς توجيه الإيمان إلى شخص؛ و«تؤمنون به» هو المقابل العربي الواضح والمألوف.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: مع أنكم لا ترونه الآن
  rationale: يحفظ دلالة الحاضر المستمر والظرف الزمني ἄρτι، ويقابل بين عدم الرؤية الراهنة والإيمان.
- source_word: ἀγαλλιᾶσθε
  choice: وتبتهجون
  rationale: يعبر عن الفرح الشديد الذي يدل عليه الفعل، دون الحاجة إلى إضافة ظرف تفسيري.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: بفرح لا يُعبَّر عنه
  rationale: ينقل دلالة الحال أو المصاحبة، ويحافظ على معنى الفرح الذي يتجاوز قدرة الكلام على وصفه.
- source_word: δεδοξασμένῃ
  choice: ومملوء بالمجد
  rationale: صياغة عربية مفهومة تحفظ صلة اللفظة بالمجد وتناسب وصف الفرح، مع إثبات البدائل الأقرب إلى البنية اللفظية في الحاشية.
theological_decisions:
- issue: دلالة الإيمان في πιστεύοντες εἰς ὃν
  choice: تؤمنون به
  alternative: تثقون به
  rationale: «تؤمنون به» تحفظ المصطلح الإيماني وتحدد المسيح بوصفه متعلَّق الإيمان، من غير تضييق المعنى على الثقة وحدها.
- issue: وصف الفرح بلفظة δεδοξασμένῃ
  choice: مملوء بالمجد
  alternative: مُمجَّد؛ مجيد
  rationale: البنية اليونانية اسم فاعل تام مبني للمجهول، لكنها قد تفيد فرحًا متصفًا بالمجد أو ممتلئًا به. تجنبت الصياغة الرئيسية «مُمجَّد» لأنها قد توحي في العربية بأن الفرح نفسه تلقى فعل تمجيد محددًا، وأبقيت الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت جملتان تنازليتان متوازيتان لإبراز المفارقة بين عدم الرؤية والمحبة والإيمان والابتهاج، مع تجنب التراكيب القديمة الثقيلة.
