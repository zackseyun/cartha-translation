base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: ar
  text: لذلك، فشدّوا أحقاء أذهانكم[a]، وكونوا يقظي الذهن[b]، واجعلوا رجاءكم تمامًا في النعمة التي تُحمَل إليكم عند ظهور يسوع المسيح[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «شدّوا أحقاء أذهانكم». وهي صورة مأخوذة من شدّ الثوب عند الحقوين استعدادًا للحركة؛ أي هيّئوا أذهانكم للعمل.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم «تمامًا» مع ما قبلها: «كونوا يقظي الذهن تمامًا»، بدلًا من ربطها بـ«اجعلوا رجاءكم».'
    reason: alternative_reading
  - marker: c
    text: «المسيح» لقب معناه «الممسوح»، وهو المقابل العربي المعتاد للفظ Χριστός اليوناني.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: تفيد الانتقال الاستنتاجي من الكلام السابق، وهي واضحة وطبيعية في العربية المعاصرة.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: شدّوا أحقاء أذهانكم استعدادًا للعمل
  rationale: يحافظ التعبير على صورة شدّ الثياب عند الحقوين استعدادًا للحركة، مع بيان المقصود كي لا تبقى الصورة غامضة للقارئ الحديث.
- source_word: νήφοντες
  choice: كونوا يقظي الذهن
  rationale: الفعل مستعمل هنا مجازيًا للدلالة على صفاء الإدراك والانتباه وضبط الفكر، لا على الامتناع الحرفي عن الخمر؛ والسياق يصرّح بالأذهان والاستعداد.
- source_word: τελείως
  choice: تمامًا / كله
  rationale: يدل على التمام، ويحتمل من جهة التركيب أن يتصل باليقظة الذهنية أو بفعل الرجاء؛ لذلك عُكس صداه في العبارتين وحُفظ الاحتمال في الحاشية.
- source_word: ἐλπίσατε
  choice: اجعلوا رجاءكم
  rationale: ينقل قوة الأمر الداعي إلى توجيه الرجاء توجيهًا حاسمًا، وهو أفصح في العربية من استعمال فعل مجرد قد يُفهم بوصفه تمنّيًا.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: في النعمة التي تُحمَل إليكم
  rationale: يحافظ على صورة الفعل المبني للمجهول في اسم المفعول اليوناني الحاضر، من غير تسطيحه إلى مجرد مستقبل.
- source_word: ἐν ἀποκαλύψει
  choice: عند إعلان
  rationale: يبرز المعنى الزمني في السياق، مع إبقاء معنى الكشف والظهور في لفظ «إعلان».
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» في العربية لقب معرف ظاهر الدلالة، لا اسم عائلة، ولذلك يحفظ الوظيفة اللقبية الطبيعية لـΧριστός.
theological_decisions:
- issue: مدى الحفاظ على استعارة شدّ الأحقاء
  choice: الإبقاء على «شدّوا أحقاء أذهانكم» مع توضيح «استعدادًا للعمل»
  alternative: هيّئوا أذهانكم للعمل
  rationale: النص اليوناني يستخدم صورة جسدية قوية للاستعداد؛ والإبقاء عليها يصون ملمح النص، بينما يمنع التوضيح إساءة فهمها.
- issue: موضع تعلّق τελείως
  choice: إبقاء دلالة التمام مسموعة مع اليقظة ومع توجيه الرجاء، والتنبيه إلى الاحتمال النحوي
  alternative: ربطه حصريًا إما بـ«يقظي الذهن» أو بـ«اجعلوا رجاءكم»
  rationale: موضع الظرف في اليونانية يسمح بسماعه مع العبارة السابقة أو الأمر اللاحق، فلا ينبغي حسم هذا التوتر النحوي بلا ضرورة.
- issue: دلالة Χριστός
  choice: المسيح بوصفه لقبًا
  alternative: نقل اللفظ كما لو كان جزءًا من اسم مركب مجرد
  rationale: السياق الأخروي يبقي دلالة اللقب حاضرة، والصيغة العربية «يسوع المسيح» تؤدي ذلك بصورة مألوفة وواضحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظت الاستعارة الأصلية، لكن أضيف تفسير موجز في المتن والحاشية لتبقى مفهومة. استُعمل «يقظي الذهن» بدل «صاحين» لتجنب إيحاء حصر المعنى في السكر والخمر، واستُعمل «إعلان» بمعنى الكشف والظهور.
