  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك الاستعارة الذهنية في «أحقاء أذهانكم» ودلالة اليقظة الذهنية. لكن إدخال «استعدادًا للعمل» في المتن يضيف تفسيرًا غير وارد لفظًا في اليونانية، وتكرار دلالة τελείως في «تمامًا» و«كله» يحسم/يكرر عنصرًا يونانيًا واحدًا رغم الحاشية التي تقر بإمكان تعلّقه بأحد الموضعين. كما أن «إعلان يسوع المسيح» قد يُفهم في العربية إعلانًا يصدر عن يسوع، بينما المقصود ظهوره/انكشافه.
  naturalness: الصياغة فصيحة في الجملة، لكن «النعمة التي تُحمَل إليكم» ثقيلة قليلًا مع أنها مفهومة وتحافظ على الصورة. و«عند ظهور يسوع المسيح» أوضح وأطبع من «عند إعلان يسوع المسيح» في هذا السياق الأخروي. إسناد الأوامر المتعاطفة في العربية مقبول لنقل المشاركين اليونانيين التابعين للأمر الرئيس.
