  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: ar
  text: عالمين أنكم لم تُفتدَوا[a] بأشياء فانية كالفضة أو الذهب، من سيرتكم الباطلة الموروثة عن آبائكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تُحرَّروا بفدية». يدل الفعل اليوناني على الإطلاق مقابل فدية أو ثمن.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الموروثة عن أسلافكم». وحرفيًا: «المتوارثة من الآباء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: عالمين
  rationale: يحافظ اسم الفاعل على الصلة الحالية بما يحيط بالآية من وصية، من غير تحويلها صراحة إلى جملة سببية.
- source_word: ἐλυτρώθητε
  choice: تُفتدَوا
  rationale: ينقل معنى التحرير بفدية أو ثمن، ويظل منسجمًا مع المقابلة اللاحقة بين الفضة والذهب وثمن الافتداء المذكور في العدد التالي.
- source_word: φθαρτοῖς
  choice: بأشياء فانية
  rationale: الصفة مستعملة استعمال الاسم، وتدل على ما يزول أو يفسد؛ وهذه الصياغة واضحة وتحافظ على مقابلتها بما لا يفنى.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: بفضة أو ذهب
  rationale: ينقل الاسمين بوضوح بوصفهما بيانًا للأشياء الفانية، من دون إضافة تفسير غير لازم.
- source_word: ἐκ
  choice: من
  rationale: تفيد الانفصال والخروج من نمط الحياة السابق.
- source_word: ματαίας
  choice: الباطلة
  rationale: تنقل معنى الخواء وانعدام الجدوى مع دلالة أخلاقية ووجودية طبيعية في العربية الكتابية المعاصرة.
- source_word: ἀναστροφῆς
  choice: سيرتكم
  rationale: «السيرة» تدل طبيعيًا على نهج العيش والسلوك، وهي أوجز من «طريقة حياتكم» مع بقاء المعنى واسعًا.
- source_word: πατροπαραδότου
  choice: الموروثة عن آبائكم
  rationale: يجمع التعبير بين معنى التسليم عبر الأجيال والإشارة الصريحة إلى الآباء في اليونانية.
theological_decisions:
- issue: مصطلح الافتداء
  choice: تُفتدَوا
  alternative: تُحرَّروا بفدية
  rationale: «الافتداء» يحفظ الصورة الكتابية والتحرير المقترن بثمن، من غير أن يفرض في هذا الشطر وحده تفسيرًا تفصيليًا لكيفية الافتداء.
- issue: لغة التقليد الموروث
  choice: عن آبائكم
  alternative: عن أسلافكم
  rationale: يحافظ المتن على الإشارة الأبوية الصريحة في الأصل، بينما تُذكر دلالة «الأسلاف» الأوسع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التركيب الحالي في «عالمين»، واستُعملت «السيرة» للدلالة على نهج الحياة والسلوك. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
