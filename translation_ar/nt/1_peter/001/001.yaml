  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: ar
  text: بطرس، رسول يسوع المسيح، إلى المختارين، المغتربين في الشتات، في بُنطس وغلاطية وكبادوكية وآسيا وبيثينية،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية المعيارية الراسخة للاسم اليوناني، وهي نقل صوتي للاسم لا ترجمة لمعناه.
- source_word: ἀπόστολος
  choice: رسول
  rationale: لفظ عربي واضح وراسخ لهذا اللقب، ويحفظ معنى الموفَد وسلطة الخدمة التي يدل عليها السياق الافتتاحي للرسالة.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالته المسيانية من غير الحاجة إلى شرح داخل النص.
- source_word: ἐκλεκτοῖς
  choice: المختارين
  rationale: ينقل معنى الذين وقع عليهم الاختيار بلفظ عربي مفهوم، من غير تحميل العبارة تفصيلات مذهبية لا يصرح بها النص.
- source_word: παρεπιδήμοις
  choice: المغتربين
  rationale: لفظ طبيعي يدل على الإقامة بعيدًا عن الموطن وعدم الانتماء الكامل إلى مكان الإقامة، مع إبقاء احتمال الدلالة الاجتماعية والمجازية مفتوحًا.
- source_word: διασπορᾶς
  choice: الشتات
  rationale: يحفظ صدى المصطلح المعروف عن الجماعات الموزعة خارج موطنها، ولا يقصره على دلالة إثنية أو مجازية واحدة.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: في بُنطُس وغلاطية وكَبَّدوكية وآسيا وبيثينية
  rationale: استُعملت الأسماء الجغرافية العربية الشائعة، وأضيفت «في» لإظهار العلاقة المكانية التي يفهمها السياق من قائمة الأقاليم.
theological_decisions:
- issue: دلالة ἐκλεκτοῖς
  choice: المختارين
  alternative: المنتخبين
  rationale: «المختارين» أفصح وأوضح في العربية المعاصرة، ويثبت اختيار الله من غير أن يحوله إلى مصطلح مذهبي محمّل بتفاصيل إضافية.
- issue: العلاقة في عبارة παρεπιδήμοις διασπορᾶς
  choice: المختارين المغتربين في الشتات
  alternative: المختارين من غرباء الشتات
  rationale: الصياغة المختارة طبيعية وتحفظ التوتر بين الاغتراب الجغرافي والاجتماعي وبين إمكان صداه اللاهوتي، من غير حسم هوية المخاطبين على أنها يهودية محضة أو مجازية محضة.
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الراسخ، ويحفظ القوة اللقبية والمسيانية للكلمة اليونانية، في حين أن «الممسوح» تفسير حرفي غير طبيعي هنا.
translation_notes:
  register: صياغة عربية فصحى حديثة ذات وقار رسائلي، تبدأ باسم المرسِل كما في الأصل اليوناني. تجنبت التراكيب الإدارية مثل «الأجانب المقيمين»، وحافظت على فاصلة الختام لأن الجملة تمتد إلى الآية التالية.
