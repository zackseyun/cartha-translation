  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: ar
  text: إذ طهَّرتم نفوسكم بطاعة الحق، بغيةَ محبةٍ أخويةٍ بلا رياء[a]، فأحبوا بعضكم بعضًا بحرارة من القلب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محبة للمؤمنين». واللفظ اليوناني «محبة أخوية» يدل على مودة عائلية بين المؤمنين، ويشمل الأخوات كما يشمل الإخوة.'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات: «من قلب طاهر».'
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: إذ طهَّرتم
  rationale: ينقل اسم الفاعل التام بوصفه فعلًا تم قبل الأمر الرئيس ولا تزال نتيجته ذات صلة، من غير الجزم بعلاقة سببية أقوى مما في اليونانية.
- source_word: ψυχὰς
  choice: نفوسكم
  rationale: مقابل عربي مباشر يحفظ الإشارة إلى الأشخاص في حياتهم الباطنة، من غير اختزال اللفظة في معنى الحياة أو الذات فقط.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: بطاعة الحق
  rationale: تفيد الباء معنى الوسيلة الممكن في ἐν مع المجرور، وتربط التطهير بالاستجابة المطيعة للحق.
- source_word: ἀληθείας
  choice: الحق
  rationale: حُفظ التعريف، ويُفهم من السياق أنه الحق المعلن في البشارة لا مجرد الصدق بوصفه مفهومًا مجردًا.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: لتكون لكم محبة أخوية بلا رياء
  rationale: تنقل الغاية أو النتيجة التي تفيدها εἰς، وتحفظ المعنى العائلي للفظة φιλαδελφία ووصفها بأنها خالية من الرياء.
- source_word: φιλαδελφίαν
  choice: محبة أخوية
  rationale: تحفظ الصورة العائلية والتمييز اللفظي بينها وبين فعل المحبة ἀγαπήσατε الآتي بعدها؛ ويوضح الهامش شمولها للمؤمنات والمؤمنين.
- source_word: ἐκ καρδίας
  choice: من القلب
  rationale: ترجمة مباشرة لنص SBLGNT من غير إضافة صفة «طاهر»، التي تنتمي إلى قراءة مخطوطية أخرى.
- source_word: ἀγαπήσατε
  choice: فأحبوا
  rationale: صيغة أمر عربية طبيعية تنقل الحث الحاسم من غير إدخال معنى الاستمرار غير المصرح به.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: تعبير عربي فصيح ومألوف للمبادلة المتبادلة.
- source_word: ἐκτενῶς
  choice: بحرارة
  rationale: تعبّر عن شدة المحبة وجديتها تعبيرًا عربيًا طبيعيًا، من غير حصر اللفظة في الدوام وحده.
theological_decisions:
- issue: التمييز بين φιλαδελφία وἀγαπάω في الآية نفسها
  choice: ترجمة الأولى «محبة أخوية» والثانية بالفعل «أحبوا».
  alternative: ترجمة اللفظين بصيغ مشتقة من «المحبة» من غير إظهار الصورة الأخوية.
  rationale: يحفظ هذا نسيج النص وتدرجه البلاغي من المودة العائلية بين المؤمنين إلى الأمر بالمحبة، من غير افتراض فرق لاهوتي حاد بين اللفظين.
- issue: الدلالة الجندرية للفظة φιλαδελφία
  choice: إبقاء «محبة أخوية» في المتن مع توضيح شمولها للإخوة والأخوات في الهامش.
  alternative: «محبة للمؤمنين» أو «محبة للإخوة والأخوات».
  rationale: يحفظ الاختيار الصورة العائلية والتمييز المعجمي، بينما يمنع الهامش فهمها على أنها مقصورة على الذكور.
- issue: الاختلاف النصي بعد ἐκ καρδίας
  choice: «من القلب» بحسب نص SBLGNT.
  alternative: «من قلب طاهر».
  rationale: لا تُضاف صفة «طاهر» إلى المتن لأنها غير موجودة في النص الأساس المقدم، مع إثبات القراءة الأخرى في الهامش.
