source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: ar
  text: لأن كل جسد كالعشب[a]، وكل مجده[b] كزهر العشب؛ يبس العشب وسقط الزهر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: جميع البشر. تقول اليونانية حرفيًا «كل جسد»، في صدى لإشعياء 40:6 وتأكيد لفناء الإنسان.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: كل بهائه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: لأن
  rationale: تفيد التعليل وتربط الاقتباس بما سبقه بعبارة عربية واضحة.
- source_word: πᾶσα σὰρξ
  choice: كل جسد
  rationale: يحافظ على صورة «الجسد» الواردة في اليونانية وعلى صدى إشعياء 40:6، والمقصود بها البشر في هشاشتهم وفنائهم، لا الطبيعة الخاطئة.
- source_word: ὡς χόρτος
  choice: كالعشب
  rationale: صياغة عربية طبيعية موجزة تحفظ التشبيه وصورة النبات الزائل.
- source_word: πᾶσα δόξα αὐτῆς
  choice: كل مجده
  rationale: تحفظ لفظ «المجد» وصلته بـ«كل جسد»، مع بقاء معنى البهاء أو الرفعة ممكنًا بحسب السياق.
- source_word: ὡς ἄνθος χόρτου
  choice: كزهر العشب
  rationale: تنقل صورة الإضافة في النص اليوناني من غير استبدال العشب بالحقل.
- source_word: ἐξηράνθη
  choice: يبس
  rationale: فعل عربي مألوف ودقيق في وصف جفاف العشب وذبوله.
- source_word: ἐξέπεσεν
  choice: سقط
  rationale: يحفظ معنى سقوط الزهر بصياغة عربية طبيعية من غير إضافة تفصيل غير مصرح به.
theological_decisions:
- issue: دلالة σάρξ في وصف فناء الإنسان
  choice: كل جسد
  alternative: جميع البشر
  rationale: السياق يتحدث عن هشاشة الحياة البشرية وزوالها لا عن الفساد الأخلاقي. والإبقاء على «الجسد» يحفظ استعارة النص وصلته بإشعياء 40:6، مع توضيح المقصود في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ توازي الاقتباس وصور العشب والزهر، واستُعملت الفاصلة المنقوطة لإبقاء العبارة جملة واحدة مترابطة.
