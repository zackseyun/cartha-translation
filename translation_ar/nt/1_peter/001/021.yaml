base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: ar
  text: أنتم الذين تؤمنون بالله من خلاله[a]، بالله الذي أقامه من بين الأموات وأعطاه مجدًا، بحيث يكون إيمانكم ورجاؤكم بالله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأوفياء»؛ لكن العبارة هنا تعني على الأرجح الذين يؤمنون بالله من خلال المسيح.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكانت النتيجة أن إيمانكم ورجاءكم بالله».'
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: بواسطته
  rationale: تنقل معنى الوساطة في διά مع المضاف إليه، أي إن الإيمان بالله صار بواسطة المسيح، من غير المبالغة في معنى الفاعلية المباشرة.
- source_word: πιστοὺς εἰς θεόν
  choice: تؤمنون بالله
  rationale: مع أن πιστός قد يعني «أمينًا»، فإن اقترانه هنا بـ εἰς θεόν يرجّح معنى الإيمان أو الثقة بالله. والصياغة الفعلية طبيعية وواضحة في العربية.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: الذي أقامه من بين الأموات
  rationale: هذه صياغة عربية واضحة لتعبير القيامة، وتحافظ «من بين الأموات» على دلالة ἐκ νεκρῶν.
- source_word: δόξαν αὐτῷ δόντα
  choice: وأعطاه مجدًا
  rationale: 'ترجمة مباشرة تحفظ موازاة الفعلين: أقامه وأعطاه.'
- source_word: ὥστε
  choice: حتى يكون
  rationale: تؤدي معنى النتيجة، مع إبقاء قدر من الانفتاح بين الغاية والنتيجة كما في الأصل.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: إيمانكم ورجاؤكم
  rationale: «الإيمان» و«الرجاء» هما المقابلان العربيان الطبيعيان والدقيقان هنا.
- source_word: εἶναι εἰς θεόν
  choice: يكون ... بالله
  rationale: الباء بعد الإيمان والرجاء صياغة عربية مألوفة للدلالة على تعلقهما بالله واتجاههما إليه، مع تجنب الحرفية غير الطبيعية «إلى الله».
theological_decisions:
- issue: دلالة πιστούς
  choice: الذين يؤمنون بالله
  alternative: الأمناء لله
  rationale: التركيب مع εἰς θεόν يرجّح الإيمان والثقة على صفة الأمانة العامة، من غير إدخال معنى لاهوتي غير لازم.
- issue: دور المسيح في الإيمان بالله
  choice: بواسطته
  alternative: بسببه
  rationale: تحفظ العبارة معنى الوساطة الذي تدل عليه διά مع المضاف إليه، ولا تختزله في مجرد السببية.
- issue: قوة ὥστε
  choice: حتى يكون إيمانكم ورجاؤكم بالله
  alternative: وكانت النتيجة أن إيمانكم ورجاءكم بالله
  rationale: «حتى يكون» تحفظ الصلة المنطقية بين إقامة المسيح وتمجيده وبين تعلق الإيمان والرجاء بالله، من غير حسم زائد بين الغاية والنتيجة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت جملة فعلية بدل الاسم «مؤمنون» لتفادي ثقل التركيب ولتوضيح تعلق الإيمان بالله، مع الحفاظ على تكرار الله في ختام الآية.
