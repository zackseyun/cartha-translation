source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: ar
  text: لكي تتبيّن أصالةُ إيمانكم[a]، وهي أثمن من الذهب الفاني، مع أنه يُمتحن بالنار، مؤديةً إلى المدح والمجد والكرامة[c] عند ظهور يسوع المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امتحان إيمانكم»؛ فاللفظة اليونانية قد تشير إلى عملية الامتحان أو إلى الأصالة التي تثبت نتيجةً له.'
    reason: lexical_alternative
  - marker: b
    text: «المسيح» ترجمة للقب اليوناني Χριστός، ومعناه «الممسوح».
    reason: lexical_alternative
  - marker: c
    text: 'أو، بصياغة أقرب إلى البنية اليونانية: «تُوجَد للمدح والمجد والكرامة».'
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: أصالة
  rationale: يفيد الاسم هنا الصفة الأصيلة التي يكشفها الامتحان ويثبتها، لا مجرد عملية الامتحان؛ وتوضح الحاشية إمكان المعنى الآخر.
- source_word: πίστεως
  choice: إيمان
  rationale: المقصود في السياق إيمان المؤمنين الذي تمتحنه التجارب.
- source_word: πολυτιμότερον
  choice: أثمن
  rationale: ينقل صيغة المقارنة في القيمة بصورة عربية طبيعية، مع إبقاء المقارنة بالذهب.
- source_word: χρυσίου τοῦ ἀπολλυμένου
  choice: الذهب الفاني
  rationale: يحفظ المفارقة بين قيمة الذهب وطبيعته الزائلة.
- source_word: διὰ πυρὸς δὲ δοκιμαζομένου
  choice: مع أنه يُمتحن بالنار
  rationale: يحفظ قوة اسم المفعول والمقابلة الاستدراكية δέ، من غير حصر المعنى في الصهر أو التنقية.
- source_word: εὑρεθῇ εἰς
  choice: يثبت أن ... تؤول إلى
  rationale: صياغة عربية واضحة تحفظ معنى التحقق أو الظهور في المبني للمجهول، والنتيجة التي تدل عليها εἰς؛ ويُذكر البديل الأقرب إلى البنية اليونانية في الحاشية.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: المدح والمجد والكرامة
  rationale: يحفظ الثلاثية وترتيبها دون تحديد صاحبها أو متلقيها، إذ لا يصرح النص بذلك.
- source_word: ἐν ἀποκαλύψει
  choice: عند إعلان
  rationale: ينقل الدلالة الزمنية الطبيعية هنا، أي حين يُعلَن يسوع المسيح.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي المألوف للقب Χριστός ويحفظ دلالته المسيانية في أسلوب عربي طبيعي.
theological_decisions:
- issue: دلالة τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: «أصالة إيمانكم» أي أصالته التي يكشفها الامتحان ويثبتها
  alternative: «امتحان إيمانكم» مع التركيز على عملية الامتحان
  rationale: يرجح السياق المعنى الناتج عن الامتحان، ولا سيما في المقارنة بالذهب الممتحن بالنار، مع حفظ البديل في الحاشية.
- issue: مرجع «المدح والمجد والكرامة»
  choice: إبقاء صاحب هذه الثلاثية أو متلقيها غير مصرح به
  alternative: أن تكون كرامة تُمنح للمؤمنين، أو تسبيحًا موجّهًا إلى الله أو المسيح، أو تبرئة أخروية تجمع الأمرين
  rationale: لا يحدد اليوناني صراحة من يتلقى الثلاثية أو يمنحها، لذلك لا تحسم الترجمة هذا التوتر.
- issue: دلالة Χριστός
  choice: المسيح بوصفه لقبًا
  alternative: كريستوس منقولًا صوتيًا أو اسمًا مجردًا
  rationale: الترجمة الدلالية للقب أوضح للقارئ العربي وتحافظ على معناه دون إضافة تفسير طائفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أصالة» لتجنب العبارة الثقيلة «الأصالة المثبتة»، وحُفظت الجملة الاعتراضية والمقارنة بالذهب، كما حُفظ الغموض في مرجع المدح والمجد والكرامة.
