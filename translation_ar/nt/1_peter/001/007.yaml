  rationale: صُححت البنية النحوية والدلالية الرئيسة لتجعل «أصالة إيمانكم» فاعل «تتبيّن»، وهو المقابل العربي الطبيعي لمعنى εὑρεθῇ في السياق، ولتجعل «مؤديةً إلى» بيانًا لنتيجة εἰς. كما نُقلت الحواشي إلى مواضعها الدلالية المباشرة. لم يُحسم مرجع المدح والمجد والكرامة، وحُفظت المقارنة والالتباس اللاهوتي في الأصل.
