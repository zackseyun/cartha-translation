  rationale: عدِّلت الجملة الأخيرة فقط لكي يبقى «الكلمة» هو موضوع الفعل المبني للمجهول، كما في اليونانية، ويظهر أن مضمون الإعلان قُدِّم للقراء بشارةً. وحُدِّثت الحاشية لتعرض بديلاً عربيًا قريبًا من البنية اللفظية من دون ادعاء أن الصياغة الرئيسة أقلّ محافظة على المبني للمجهول.
