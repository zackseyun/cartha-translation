source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: ar
  text: «أَمَّا كَلِمَةُ الرَّبِّ فَتَبْقَى إِلَى الأَبَدِ». وَهذِهِ هِيَ الْكَلِمَةُ الَّتِي أُعْلِنَتْ لَكُمْ بُشَارَةً[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلمة التي بُشِّر بها إليكم».'
    reason: بديل يصوغ فعل εὐαγγελίζω بالفعل «بشّر» مع المحافظة على كون «الكلمة» هي المعلَنة وعلى توجّه الإعلان إلى المخاطَبين.
lexical_decisions:
- source_word: ῥῆμα
  choice: كلمة
  rationale: تحافظ «كلمة» على الصدى المباشر لاقتباس إشعياء 40:8، وتصلح في الجملتين من غير أن تحصر المعنى في لفظة مفردة بدل الرسالة المنطوقة.
- source_word: κυρίου
  choice: الرَّبّ
  rationale: المضاف إليه κυρίου يعني «الرب»، وهو التعبير المألوف الواضح، مع إبقاء صلة العبارة بنص إشعياء من غير استبداله تفسيريًّا باسم آخر.
- source_word: μένει
  choice: تبقى
  rationale: تنقل «تبقى» معنى الاستمرار والثبات بصياغة عربية طبيعية معاصرة.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: هذا هو المقابل العربي الطبيعي للتعبير الدال على الدوام الذي لا ينتهي.
- source_word: τοῦτο δέ ἐστιν
  choice: وهذه هي
  rationale: تنقل الواو الانتقال الخفيف الذي تؤديه δέ، وتربط الاقتباس بتطبيقه على المخاطَبين.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: الكلمة التي بُشِّرتم بها
  rationale: صياغة عربية طبيعية تُبقي القوة الفعلية لـ εὐαγγελίζω ومعنى إعلان الخبر السار، من غير الاكتفاء بمصطلح كنسي قد لا يوضح الفعل.
- source_word: εἰς ὑμᾶς
  choice: بها (إليكم دلاليًّا)
  rationale: حوّلت العربية البناء إلى «بُشِّرتم بها»، وهو تعبير مألوف يجعل المخاطَبين متلقّي البشارة ويحفظ اتجاه الإعلان نحوهم.
theological_decisions:
- issue: مرجع «كلمة الرب» وصلته باقتباس إشعياء وتطبيق بطرس على البشارة
  choice: الإبقاء على «كلمة الرب» في الاقتباس، ثم تعريفها في الجملة الثانية بأنها الكلمة التي بُشِّر بها القراء.
  alternative: ترجمة تفسيرية مثل «الرسالة الآتية من الرب» في الموضعين.
  rationale: تحفظ الصياغة المختارة ألفاظ الاقتباس وترابطه مع إعلان البشارة، من غير اختزال العلاقة بين النص النبوي وتطبيق بطرس في شرح تفسيري زائد.
- issue: ترجمة εὐαγγελισθέν
  choice: «بُشِّرتم بها» مع إبقاء الدلالة الفعلية للخبر السار.
  alternative: «أُعلنت لكم بوصفها البشارة» أو «كُرز بها لكم».
  rationale: «بُشِّرتم بها» واضحة وطبيعية في العربية الحديثة، وتنقل معنى إعلان الخبر السار من غير إضافة مضمون عقائدي غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «أمّا... فـ» لنقل المقابلة والاستمرار بسلاسة، وأُبقيت «كلمة الرب» للمحافظة على صدى الاقتباس. وُضع رقم الحاشية في المتن كما هو مطلوب.
