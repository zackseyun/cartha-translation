    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: إذ تنالون
  rationale: اسم الفاعل اليوناني متصل بالمخاطَبين في السياق السابق، ويدل هنا على نيل ما يقود إليه الإيمان. وصيغة «إذ تنالون» طبيعية وتحافظ على دلالة الفعل الجارية من غير تحميل صيغة المبني للوسط أو للمجهول ما لا يحتمله السياق.
- source_word: τέλος
  choice: حصيلة
  rationale: تؤدي «حصيلة» معنى النتيجة المتحققة التي يفضي إليها الإيمان. أما «نهاية» فقد تُفهم زمنيًا فقط، و«غاية» قد تبرز المقصد أكثر من النتيجة المحرزة؛ لذلك حُفظت هذه الاحتمالات في الحاشية.
- source_word: πίστεως
  choice: إيمان
  rationale: المضاف إليه هنا يشير على الأرجح إلى إيمان المخاطَبين. و«إيمان» هو المقابل العربي الواضح والمألوف، من غير استبعاد إمكان دلالة اللفظة في سياقات أخرى على الثقة أو الأمانة.
- source_word: ὑμῶν
  choice: كم
  rationale: نُقلت دلالة ضمير الجمع المخاطَب مباشرة بإلحاق ضمير الملكية بكلمة «إيمان».
- source_word: σωτηρίαν
  choice: خلاص
  rationale: «خلاص» هو المقابل المألوف والملائم للسياق، ويحفظ امتداد المعنى بين الاختبار الحاضر والاكتمال الآتي، بينما «نجاة» ممكنة لكنها أضيق في هذا السياق.
- source_word: ψυχῶν
  choice: نفوس
  rationale: «نفوس» ترجمة مباشرة تحفظ صياغة اليونانية، مع إبقاء إمكان أن تدل ψυχή على الحياة أو الشخص بحسب السياق، من غير افتراض ثنائية صارمة بين النفس والجسد.
theological_decisions:
- issue: دلالة πίστις في عبارة «إيمانكم»
  choice: إيمان
  alternative: ثقة أو أمانة
  rationale: يفيد السياق على نحو طبيعي استجابة القراء المؤمنة، ولا يقتضي تحويل اللفظة إلى صفة «الأمانة». وتحافظ الصياغة على المعنى من غير إدخال تمييز مذهبي.
- issue: دلالة ψυχαί في عبارة «خلاص نفوسكم»
  choice: نفوس
  alternative: حياتكم أو أشخاصكم
  rationale: تحافظ الترجمة على التعبير اليوناني ولا تحسم الأنثروبولوجيا التي وراءه. فاختيار «نفوس» لا يعني نفي خلاص الجسد ولا يفرض ثنائية فلسفية بين النفس والجسد.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، مع نبرة وقورة. استُعملت «أي» لإظهار أن «خلاص نفوسكم» يبيّن ماهية «حصيلة إيمانكم»، كما تفيد البنية اليونانية، ووُضعت علامتا الحاشية بعد اللفظتين المعنيتين مباشرة.
