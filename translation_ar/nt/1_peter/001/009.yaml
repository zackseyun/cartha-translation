translation:
  language: ar
  text: إذ تنالون حصيلة إيمانكم[a]، أي خلاص نفوسكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غاية إيمانكم» أو «نهاية إيمانكم» أو «نتيجة إيمانكم».'
    reason: lexical_alternative
  - marker: b
