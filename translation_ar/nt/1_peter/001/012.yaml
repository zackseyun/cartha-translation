source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: ar
  text: وقد أُعلن لهم أنهم لم يكونوا يخدمون أنفسهم، بل كانوا يخدمونكم في شأن هذه الأمور[a] التي أُعلنت لكم الآن بواسطة الذين بشّروكم[b] بالروح القدس المُرسَل من السماء؛ وهي أمور تتوق الملائكة إلى أن تتطلّع إليها[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يكونوا يخدمون لأنفسهم، بل لكم، في هذه الأمور»؛ فصيغة المجرور في اليونانية تدل على مَن تعود إليهم منفعة الخدمة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذين أعلنوا لكم الخبر السار»؛ فاليونانية تستعمل فعلًا معناه التبشير أو إعلان الخبر السار.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا ترجمة العبارة: «أن تُمعن النظر فيها» أو «أن تنحني لتحدّق فيها»، وهي تعبّر عن نظر متلهف ودقيق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: وقد أُعلن لهم
  rationale: يحفظ الضمير العائد إلى الأنبياء وصيغة المبني للمجهول، مع تعبير عربي واضح ذي سجل ديني مناسب.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: لم يكونوا يخدمون أنفسهم، بل إياكم
  rationale: ينقل تقابل المفعول له أو المنتفع به في صيغة عربية طبيعية، مع إبقاء احتمال التعبير «لأنفسهم... لكم» في الحاشية.
- source_word: διηκόνουν
  choice: كانوا يخدمون
  rationale: صيغة الماضي المستمر تلائم دلالة الناقص اليوناني، و«يخدمون» أوضح للقارئ المعاصر من ألفاظ كنسية أخص.
- source_word: αὐτά
  choice: بهذه الأمور
  rationale: يُظهر مرجع الضمير، أي الحقائق النبوية المذكورة في السياق السابق.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: التي أُخبرتم بها الآن
  rationale: يحفظ المبني للمجهول ودلالة الإعلان الذي وصل إلى المخاطَبين، بصياغة عربية سلسة.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: على أيدي الذين بشّروكم
  rationale: «بشّروكم» تنقل الفعل الدال على إعلان الخبر السار بإيجاز طبيعي، و«على أيدي» تعبّر عن الواسطة البشرية.
- source_word: πνεύματι ἁγίῳ
  choice: بالروح القدس
  rationale: 'الباء تحفظ القراءة الآلية المرجحة: تم التبشير بقوة الروح القدس أو بواسطته.'
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: المُرسَل من السماء
  rationale: يحفظ الوصف المبني للمجهول وعلاقته المباشرة بالروح القدس.
- source_word: ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: تتوق الملائكة إلى أن تتطلّع إليها
  rationale: «تتوق» تنقل الرغبة المستمرة القوية، و«تتطلّع إليها» تعبّر عن النظر المتعمق المقصود دون فرض صورة الانحناء في المتن.
theological_decisions:
- issue: مرجع πνεύματι ἁγίῳ وطبيعة دوره
  choice: الروح القدس بوصفه العامل الإلهي في التبشير
  alternative: روح مقدسة بمعنى قوة أو حال روحية عامة
  rationale: السياق الخلاصي وصيغة «المُرسَل من السماء» يرجحان الإشارة الشخصية إلى الروح القدس، من غير إضافة تفسير عقائدي إلى النص.
- issue: صلة خدمة الأنبياء بالمؤمنين اللاحقين
  choice: كان الأنبياء يخدمون المخاطَبين في الأمور التي أُعلنت لهم لاحقًا
  alternative: أن تكون خدمتهم مقصورة على معاصريهم
  rationale: التقابل الصريح بين «أنفسهم» و«إياكم» يربط خدمة الأنبياء بإعلان البشارة للمخاطَبين، مع عدم إنكار انتفاع الأنبياء أنفسهم بوجه آخر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم المبني للمجهول حيث يستعمله الأصل، وحُفظت صورة التوق والنظر المقصود مع بيان اتساع دلالة الفعل في الحاشية.
