source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: ar
  text: 'فإننا نقول لكم هذا بكلمة من الرب[a]: إننا نحن الأحياء الباقون إلى مجيء الرب[b] لن نسبق بأي حال الذين رقدوا[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بكلمة الرب». قد تشير العبارة اليونانية إلى قول صادر عن الرب يسوع، أو إلى إعلان أُعطي بسلطان الرب.
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة الكلمة اليونانية إلى «حضور» أو «وصول».
    reason: lexical_alternative
  - marker: c
    text: «الذين رقدوا» استعارة تشير إلى المؤمنين الذين ماتوا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: بكلمة من الرب
  rationale: يحفظ دلالة الاستناد أو الوسيلة في العبارة اليونانية، من غير أن يحسم هل المقصود قول نطق به الرب يسوع أم إعلان أُعطي بسلطانه.
- source_word: παρουσίαν
  choice: مجيء
  rationale: في هذا السياق الأخروي تدل الكلمة على وصول الرب وحضوره الآتي؛ و«مجيء» هي الصياغة العربية الطبيعية التي تنقل معنى الحدث.
- source_word: οἱ ζῶντες
  choice: نحن الأحياء
  rationale: ينقل اسم الفاعل الحاضر بوضوح وإيجاز، ويحافظ على ضمير المتكلمين الوارد في النص.
- source_word: οἱ περιλειπόμενοι
  choice: الباقين
  rationale: يدل على من يظلون موجودين إلى الوقت المذكور، من غير إضافة معنى النجاة أو البقاء على قيد الحياة قسرًا.
- source_word: οὐ μὴ φθάσωμεν
  choice: لن نسبق بأي حال
  rationale: تنقل «نسبق» معنى التقدم على الآخرين في هذا السياق، وتعكس عبارة «بأي حال» قوة النفي اليوناني المؤكد.
- source_word: τοὺς κοιμηθέντας
  choice: الذين رقدوا
  rationale: يحافظ على استعارة النوم التي يستخدمها النص للمؤمنين الذين ماتوا، بدل تسويتها إلى عبارة تفسيرية مثل «الأموات».
- source_word: κύριος / κυρίου
  choice: الرب
  rationale: الترجمة العربية الراسخة والمناسبة للفظ κύριος، وهو يشير هنا إلى يسوع في سياق مجيئه.
theological_decisions:
- issue: طبيعة الاستناد إلى «كلمة من الرب»
  choice: صياغة تحافظ على سلطان القول من غير تعيين طريقة وصوله
  alternative: أن تكون العبارة اقتباسًا مباشرًا من قول للرب يسوع، أو إعلانًا نبويًا أُعطي لبولس
  rationale: العبارة اليونانية تثبت سلطان الرب، لكنها لا تحدد بذاتها وسيلة نقل الكلمة، لذلك تُترك هذه المسألة مفتوحة.
- issue: دلالة «الذين رقدوا»
  choice: الإبقاء على استعارة الرقاد للمؤمنين الذين ماتوا
  alternative: ترجمتها صراحةً إلى «الأموات»
  rationale: الإبقاء على الصورة يحفظ النسيج اللاهوتي للنص ورجاء القيامة، من غير إنكار حقيقة الموت الجسدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ ترتيب الحجة واستعارة الرقاد وقوة النفي، مع وضع علامات الحواشي عند العبارات التي تشرحها مباشرة.
