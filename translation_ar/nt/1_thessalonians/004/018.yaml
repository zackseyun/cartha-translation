lexical_decisions:
- source_word: ὥστε
  choice: لذلك
  rationale: تفيد الأداة هنا نتيجةً مستخلصة من التعليم السابق عن مجيء الرب وقيامة المؤمنين، و«لذلك» تؤدي هذا الربط الاستنتاجي بوضوح.
- source_word: παρακαλεῖτε
  choice: شجِّعوا
  rationale: يمكن أن يدل الفعل على التشجيع أو التعزية أو الحث. وفي سياق طمأنة المؤمنين بشأن الراقدين واللقاء الآتي، ينقل «شجِّعوا» المعنى الرعوي الواسع، مع بقاء معنى التعزية حاضرًا.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: تعبير عربي طبيعي يحفظ دلالة الضمير التبادلية، ويبيّن أن الأمر موجَّه إلى الجماعة كي يشجّع أفرادها بعضهم بعضًا.
- source_word: ἐν
  choice: بهذه
  rationale: الباء في «بهذه الكلمات» تعبّر طبيعيًا في العربية عن الوسيلة التي يتم بها التشجيع، وهي المقصودة من حرف الجر في هذا السياق.
- source_word: τοῖς λόγοις τούτοις
  choice: هذه الكلمات
  rationale: تشير العبارة إلى الأقوال المحددة الواردة قبلها مباشرة، و«هذه الكلمات» ترجمة مباشرة وشفافة تحافظ على الإحالة النصية.
