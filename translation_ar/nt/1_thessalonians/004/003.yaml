  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: ar
  text: 'فإن هذه هي مشيئة الله: تقديسكم[a]، أي أن تمتنعوا عن الفجور الجنسي[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قداستكم».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية «πορνεία»، وهي لفظ واسع يشمل السلوك الجنسي غير المشروع. وتُترجم تقليديًا: «الزنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: فـ
  rationale: تربط الفاء الآية بما قبلها وتقدّم أساسًا للتوصية السابقة، في صياغة عربية موجزة وطبيعية.
- source_word: θέλημα τοῦ θεοῦ
  choice: مشيئة الله
  rationale: «المشيئة» هي المقابل العربي المألوف والدقيق لإرادة الله المقصودة والملزمة هنا؛ أما «رغبة» فأضعف دلالة، و«قصد» قد يوحي بتخصيص لا يقتضيه السياق.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: تقديسكم
  rationale: يحافظ «تقديسكم» على دلالة ἁγιασμός التي تشمل التكريس لله والقداسة العملية، من غير حصرها في حالة ثابتة أو في عملية زمنية وحدها.
- source_word: ἀπέχεσθαι ὑμᾶς
  choice: أي أن تمتنعوا
  rationale: يفسّر المصدر اليوناني مضمون «تقديسكم». وتُظهر «أي أن» هذه العلاقة التفسيرية بوضوح في العربية من غير تحويلها إلى أمر مستقل.
- source_word: πορνείας
  choice: الفجور الجنسي
  rationale: ينقل التعبير المعنى الواسع للسلوك الجنسي غير المشروع، ولا يحصر اللفظ في الزنا بمعناه الضيق أو في العلاقات السابقة للزواج وحدها.
theological_decisions:
- issue: دلالة ἁγιασμός في الوصية الأخلاقية
  choice: «تقديسكم»، مع بيان مضمونه الأخلاقي في العبارة التالية
  alternative: «قداستكم» أو «أن تتقدسوا»
  rationale: يحفظ الاختيار اتساع اللفظ بين التكريس والقداسة العملية، ولا يحسمه على أنه منزلة ثابتة فقط أو مسار متدرج فقط.
- issue: نطاق πορνεία
  choice: «الفجور الجنسي» بمعناه العام
  alternative: «الزنا»
  rationale: اللفظ اليوناني أوسع من فئة واحدة من المخالفات الجنسية؛ لذلك لا تُفرض عليه دلالة عربية أضيق من النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «أي أن» لإبراز أن الامتناع يشرح مضمون التقديس، مع إبقاء الصلة الاستدلالية بالسياق السابق بواسطة الفاء.
