  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: ar
  text: ولكننا لا نريدكم أن تجهلوا، أيها الإخوة[a]، أمر الذين رقدوا[b]، لكيلا تحزنوا مثل سائر الناس الذين لا رجاء لهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «الإخوة» هنا خطاب للجماعة، ويُرجَّح أنه يشمل الرجال والنساء.
    reason: cultural_note
  - marker: b
    text: 'أو: «الذين ينامون». يستخدم بولس هنا الرقاد استعارةً للمؤمنين الذين ماتوا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: ولكننا لا نريد
  rationale: تفيد δέ انتقالًا خفيفًا قد يحمل شيئًا من المقابلة، و«ولكننا» صياغة عربية طبيعية لا تبالغ في قوة الاستدراك.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: أن تجهلوا
  rationale: ينقل معنى عدم المعرفة أو عدم الإحاطة بالأمر، وهو هنا خالٍ من معنى الإهانة في السياق العربي.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية وعلى أسلوب النداء الرسولي، مع إيضاح نطاق الخطاب في الحاشية.
- source_word: περὶ τῶν κοιμωμένων
  choice: أمر الذين رقدوا
  rationale: يحفظ استعارة النوم للموت بصياغة عربية كتابية مفهومة، من غير استبدالها تفسيرًا بلفظ «ماتوا».
- source_word: ἵνα μὴ λυπῆσθε
  choice: لكيلا تحزنوا
  rationale: ينقل غرض الكلام من دون أن يقتضي منع كل حزن منعًا مطلقًا.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: مثل سائر الناس
  rationale: يوضح أن المقارنة ببقية الناس خارج الجماعة المؤمنة، مع استكمال المقارنة طبيعيًا في العربية.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: الذين لا رجاء لهم
  rationale: ترجمة مباشرة موجزة تحفظ المقابلة الأخروية التي يقيمها بولس.
theological_decisions:
- issue: دلالة κοιμωμένων في السياق الأخروي
  choice: 'الإبقاء على استعارة الرقاد: «الذين رقدوا»'
  alternative: الذين ماتوا
  rationale: الاستعارة جزء من نسيج العبارة في سياق رجاء القيامة؛ وإبقاؤها يتجنب تسطيح الدلالة، مع توضيح المقصود في الحاشية.
- issue: نطاق ἀδελφοί
  choice: «أيها الإخوة» في المتن مع حاشية توضيحية
  alternative: أيها الإخوة والأخوات
  rationale: يحفظ المتن الصيغة اليونانية المذكرة، بينما تبين الحاشية أن النداء موجّه على الأرجح إلى جماعة المؤمنين كلها، رجالًا ونساءً.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم «رقدوا» للمحافظة على استعارة النص، و«أيها الإخوة» للمحافظة على صيغة النداء الأصلية، مع وضع علامتي الحاشيتين في المتن.
