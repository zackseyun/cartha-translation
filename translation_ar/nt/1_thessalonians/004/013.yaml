  source_fidelity: 'الترجمة أمينة للنص اليوناني: «ولكننا لا نريدكم أن تجهلوا» تنقل Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν، و«أيها الإخوة» تقابل ἀδελφοί، و«الذين رقدوا» تحفظ استعارة κοιμωμένων دون تسطيحها إلى «الذين ماتوا». كما أن «لكيلا تحزنوا مثل سائر الناس الذين لا رجاء لهم» تؤدي غرض ἵνα والمقابلة مع «الباقين/الآخرين» الذين لا رجاء لهم.'
