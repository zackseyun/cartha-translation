  terminology: «الإخوة» يحافظ على اللفظ المذكر في المتن، وتوضح الحاشية نطاق الخطاب الجماعي دون فرض قراءة تفسيرية. و«الرجاء» مصطلح مناسب للسياق الأخروي. الحاشيتان مثبتتان عند اللفظين المعنيين وتوافقان المعنى والسجل.
