  - severity: medium
    issue: الحاشية ب تصف المصدر اليوناني بالفعل المبني للمجهول «أن يُكتب إليكم».
    rationale: γράφειν مصدر مبني للمعلوم؛ غير أن فاعله غير مصرّح به. ينبغي أن تقول الحاشية «أن يكتب إليكم».
  - severity: low
