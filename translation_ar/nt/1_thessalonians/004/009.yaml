  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: ar
  text: وأمّا المحبة الأخوية[a]، فلا حاجة لكم إلى أن يكتب إليكم أحد[b]، لأنكم أنتم أنفسكم قد علّمكم الله أن تحبوا بعضكم بعضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي، على وجه أخص: المحبة بين الإخوة والأخوات المؤمنين؛ فاللفظة اليونانية تستعمل صورة القرابة العائلية داخل جماعة المؤمنين.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لا حاجة لكم إلى أن يكتب إليكم»؛ ففاعل الكتابة غير مذكور صراحة في اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: وأمّا
  rationale: تنقل الانتقال إلى موضوع جديد مع إبقاء الصلة اللطيفة بما قبله، من غير إدخال ظرف زمني غير موجود في اليونانية.
- source_word: φιλαδελφίας
  choice: المحبة الأخوية
  rationale: تحافظ على صورة القرابة العائلية الخاصة بالمحبة بين المؤمنين، وتميّز اللفظة عن الفعل ἀγαπᾶν اللاحق.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: فلا حاجة بكم إلى أن يكتب إليكم أحد
  rationale: صياغة عربية طبيعية تُبقي فاعل المصدر اليوناني غير المصرّح به غير محدد، بدل تعيينه بـ«نحن».
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: لأنكم أنتم أنفسكم
  rationale: تنقل توكيد الضميرين في الأصل بوضوح ومن غير تكلّف.
- source_word: θεοδίδακτοί
  choice: قد تعلّمتم من الله
  rationale: تعبير عربي واضح يحفظ كون الله مصدر التعليم، ويؤدي معنى الصفة اليونانية النادرة بصورة طبيعية.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: أن يحب بعضكم بعضًا
  rationale: ينقل الغاية أو النتيجة المحتملة في التركيب اليوناني بصياغة عربية مألوفة، ويحافظ على فعل المحبة العام.
theological_decisions:
- issue: التمييز بين φιλαδελφία وἀγαπᾶν في الآية نفسها
  choice: ترجمة الأولى «المحبة الأخوية» والثانية «يحب بعضكم بعضًا»
  alternative: ترجمة اللفظين بتعبير واحد عام عن المحبة
  rationale: يحفظ التنوع اللفظي في اليونانية وانتقال الكلام من المودة ذات الصورة العائلية بين المؤمنين إلى فعل المحبة المتبادلة.
- issue: فاعل γράφειν الضمني
  choice: إبقاؤه غير محدد بقولنا «أن يكتب إليكم أحد»
  alternative: «أن نكتب إليكم»
  rationale: السياق قد يرجّح بولس وشركاءه، لكن المصدر اليوناني لا يصرّح بفاعل؛ لذلك لا تعيّن الترجمة ما تركه النص ضمنيًا.
- issue: دلالة εἰς مع المصدر
  choice: صياغتها «أن يحب بعضكم بعضًا» من غير حسم صريح بين الغاية والنتيجة
  alternative: «لكي يحب بعضكم بعضًا» أو «بحيث يحب بعضكم بعضًا»
  rationale: التركيب يحتمل توجيه التعليم إلى المحبة أو نتيجته، والصياغة المختارة تحفظ هذا الاتساع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وأمّا» للانتقال الموضوعي، و«المحبة الأخوية» لصون الصورة العائلية، مع إثبات علامتي الحاشيتين في متن الآية.
