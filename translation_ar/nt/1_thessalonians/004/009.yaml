  terminology: «المحبة الأخوية» مناسبة وتحفظ الصورة العائلية في φιλαδελφία، بينما «تحبوا بعضكم بعضًا» تحافظ على الفعل الأعم ἀγαπᾶν. ولا يلزم تغيير اصطلاحي إضافي.
