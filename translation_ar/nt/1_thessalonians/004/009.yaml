  source_fidelity: 'المعنى العام أمين للنص اليوناني: «وأمّا» تؤدي الانتقال في Περὶ δέ، و«المحبة الأخوية» تحفظ تمييز φιλαδελφία عن فعل المحبة اللاحق، وفاعل «يكتب» يبقى غير معيّن. لكن «أن يحب بعضكم بعضًا» تخالف الإحالة النحوية إلى المخاطبين الجمع؛ والصواب «أن تحبوا بعضكم بعضًا». كما أن «قد علّمكم الله» أدق في إبراز صفة θεοδίδακτοι، أي إن الله هو المعلّم.'
