review_pass:
  verdict: revise
  source_fidelity: تحتاج العبارة «عند صدور أمر» إلى تعديل، لأنها تفيد زمن إصدار الأمر لا المصاحبة التي تؤديها ἐν هنا. واستبدالها بـ«بهتافٍ آمر» يحفظ معنى κέλευσμα بوصفه نداءً أو صيحة أمر، ويحافظ على توازي العبارات الثلاث. أما «رئيس ملائكة» و«بوق الله» و«في المسيح» و«سيقومون أولًا» فمطابقة للنص اليوناني وتحفظ عدم تعريف رئيس الملائكة في الأصل.
  naturalness: النص فصيح عمومًا، لكن تكرار «عند» ثقيل ويحوّل الملابسة إلى توقيت. والصياغة «بهتافٍ آمر، وبصوت رئيس ملائكة، وبوق الله» أفصح وأكثر سلاسة في العربية المعاصرة ذات النبرة الكتابية.
  terminology: «الرب نفسه»، «رئيس ملائكة»، «بوق الله»، و«المسيح» مصطلحات سليمة. تُحفظ «المسيح» ترجمةً للقب Χριστός، ولا موجب لإضافة «يسوع» أو لتعريف رئيس الملائكة.
  issues:
  - severity: medium
    issue: «عند صدور أمر» لا يؤدي معنى ἐν κελεύσματι بدقة.
    rationale: التركيب العربي يدل على وقوع النزول عند لحظة إصدار أمر، بينما اليونانية تصف النزول بأنه مصحوب بنداء/هتاف آمر. كما أن «عند» المتكرر في العبارات التالية يضعف التوازي التركيبي المقصود.
