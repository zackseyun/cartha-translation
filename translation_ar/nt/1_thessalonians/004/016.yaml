  to: لِأَنَّ الرَّبَّ نَفْسَهُ سَيَنْزِلُ مِنَ السَّمَاءِ بِهُتَافٍ آمِرٍ[a]، وَبِصَوْتِ رَئِيسِ مَلَائِكَةٍ، وَبُوقِ اللهِ؛ وَالْأَمْوَاتُ فِي الْمَسِيحِ سَيَقُومُونَ أَوَّلًا[b].
  rationale: عُدِّلت أداة المصاحبة في العبارات الثلاث من «عند» إلى الباء، واستُبدلت «صدور أمر» بـ«هتاف آمر» لتفادي تحويل النداء المصاحب إلى حدث زمني ولإبراز دلالة κέλευσμα. وبقيت سائر الألفاظ والهوامش في حدود معنى النص وسياقه.
