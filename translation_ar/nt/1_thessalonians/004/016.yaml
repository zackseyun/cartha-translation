  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: ar
  text: لِأَنَّ الرَّبَّ نَفْسَهُ سَيَنْزِلُ مِنَ السَّمَاءِ بِهُتَافٍ آمِرٍ[a]، وَبِصَوْتِ رَئِيسِ مَلَائِكَةٍ، وَبُوقِ اللهِ؛ وَالْأَمْوَاتُ فِي الْمَسِيحِ سَيَقُومُونَ أَوَّلًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بنداءٍ آمر». فاللفظة اليونانية قد تعني أمرًا أو نداءً آمرًا.'
    reason: lexical_alternative
  - marker: b
    text: أي إنهم يقومون قبل المؤمنين الأحياء المذكورين في الآية التالية؛ وكلمة «أولًا» تدل على الترتيب هنا.
    reason: contextual_clarification
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تؤدي هنا وظيفة تعليلية تشرح أساس التعزية الواردة في السياق السابق.
- source_word: αὐτὸς ὁ κύριος
  choice: الرَّبَّ نَفْسَهُ
  rationale: تحفظ توكيد الضمير αὐτός على أن الرب نفسه هو الذي سينزل.
- source_word: ἐν κελεύσματι
  choice: عِنْدَ صَدُورِ أَمْرٍ
  rationale: ينقل معنى الأمر أو النداء الآمر، ويجعل استعمال ἐν المصاحب طبيعيًّا وواضحًا بالعربية.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: عِنْدَ صَوْتِ رَئِيسِ مَلَائِكَةٍ
  rationale: يحفظ لفظ «صوت» وإضافة المصدر إلى رئيس ملائكة؛ وعدم التعريف في اليونانية لا يقتضي رئيسًا معيّنًا.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: عِنْدَ بُوقِ اللهِ
  rationale: ترجمة مباشرة للإضافة، مع اختيار «بوق» بوصفه اللفظ العربي الواضح للآلة المشار إليها.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: سَيَنْزِلُ مِنَ السَّمَاءِ
  rationale: ينقل اتجاه الحركة ومصدرها بعبارة عربية طبيعية ودقيقة.
- source_word: οἱ νεκροὶ
  choice: الْأَمْوَاتُ
  rationale: المعادل الاسمي الطبيعي للصفة اليونانية المستعملة استعمال الاسم.
- source_word: ἐν Χριστῷ
  choice: فِي الْمَسِيحِ
  rationale: يترجم Χριστός بوصفه لقبًا، ويحفظ الصيغة العلاقية «في المسيح» دون تفسير زائد.
- source_word: ἀναστήσονται
  choice: سَيَقُومُونَ
  rationale: الفعل مستقبل متوسط ويدل في السياق على القيامة؛ «سيقومون» يحفظ الصيغة غير المبنية للمجهول.
- source_word: πρῶτον
  choice: أَوَّلًا
  rationale: يبين ترتيب قيام الأموات بالنسبة إلى ما يرد عن الأحياء في الآية التالية.
theological_decisions:
- issue: ترجمة Χριστῷ في العبارة ἐν Χριστῷ
  choice: فِي الْمَسِيحِ
  alternative: في المسيح يسوع، أو إبقاء اللفظ بصيغة اسمية مألوفة دون إبراز دلالة اللقب
  rationale: النص اليوناني يرد فيه Χριστός وحده بوصفه لقبًا؛ «المسيح» هو المقابل العربي الطبيعي والدقيق ولا يضيف اسمًا غير موجود.
- issue: هوية صاحب الصوت في ἐν φωνῇ ἀρχαγγέλου
  choice: صَوْتِ رَئِيسِ مَلَائِكَةٍ
  alternative: صوت رئيس الملائكة
  rationale: غياب أداة التعريف لا يحسم أن المقصود رئيس ملائكة معيّن، ولذلك تُصان مساحة الغموض بدل تعريفه في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «عند» مع العبارات الثلاث المتوازية لتصوير الملابسة من غير حسم ما إذا كانت الأصوات متزامنة تمامًا، وحُفظت بنية «في المسيح» اللاهوتية الموجزة.
