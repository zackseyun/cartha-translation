  to: وأخيرًا إذن، أيها الإخوة[a]، نسألكم ونحثّكم في الرب يسوع أن تزدادوا أكثر فأكثر في السلوك الذي يرضي الله، كما تسلّمتم منا كيف ينبغي لكم أن تسلكوا وتُرضوا الله، وكما أنكم تسلكون بالفعل.
  rationale: أُبدلت صيغة الأمر «فازدادوا» بـ«أن تزدادوا» لتبقى الجملة تابعة لفعلَي «نسألكم ونحثّكم»، على نحو يعكس جملة ἵνα اليونانية من غير الجزم بأنها أمر مستقل. كما وُضّح أن الازدياد متعلق بالسلوك وإرضاء الله، وهو المضمون الذي تحدده الجملة السابقة، مع الاحتفاظ باستعارة السلوك وبالإقرار بأن المخاطبين يسلكون بالفعل.
