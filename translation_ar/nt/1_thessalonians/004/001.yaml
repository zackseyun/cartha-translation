id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: ar
  text: وأخيرًا إذن، أيها الإخوة[a]، نسألكم ونحثّكم في الرب يسوع أن تزدادوا أكثر فأكثر في السلوك الذي يرضي الله، كما تسلّمتم منا كيف ينبغي لكم أن تسلكوا وتُرضوا الله، وكما أنكم تسلكون بالفعل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فاللفظ اليوناني يعني حرفيًا «الإخوة»، وقد يُستعمل بصيغة المذكر الجمع لمخاطبة جماعة تضم رجالًا ونساءً.
    reason: بديل معجمي وتوضيح نطاق الخطاب
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: وأخيرًا إذن
  rationale: يحفظ معنى الانتقال إلى قسم جديد مع قوة الاستنتاج أو الاستئناف، بصياغة عربية واضحة.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة المذكر الجمع في اليونانية، مع بيان شمول الخطاب للمؤمنات أيضًا في الحاشية.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: نسألكم ونحثّكم
  rationale: ينقل الفعل الأول بوصفه طلبًا والثاني بوصفه حثًّا جادًّا، من غير تليين القوة الإرشادية.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: في الرب يسوع
  rationale: يحافظ على حرف الجر وعلى لقب κύριος المسيحاني، ويترك دلالة المجال أو السلطة قائمة.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: كما تسلّمتم منا
  rationale: يعكس معنى تلقي التعليم أو التقليد من الرسل من دون اختزاله في مجرد التعلّم.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: كيف ينبغي أن تسلكوا
  rationale: يحفظ استعارة السلوك الشائعة عند بولس، وينقل δεῖ بوصفه لزومًا أخلاقيًا.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: وتُرضوا الله
  rationale: ترجمة مباشرة وطبيعية للمصدر المنسق مع «تسلكوا».
- source_word: καθὼς καὶ περιπατεῖτε
  choice: وكما أنكم تسلكون بالفعل
  rationale: يقرّ بسلوكهم الحالي ويحفظ تكرار استعارة السلوك؛ و«بالفعل» تنقل هنا قوة καί التأكيدية على نحو عربي طبيعي.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: فازدادوا في ذلك أكثر فأكثر
  rationale: ينقل غاية الطلب بوصفها حثًّا مباشرًا طبيعيًا في العربية، ويبيّن أن الازدياد متعلق بالسلوك المذكور من غير إضافة مضمون جديد.
theological_decisions:
- issue: الخطاب المذكر لجماعة مؤمني تسالونيكي
  choice: أيها الإخوة في المتن مع حاشية توضح شمول الخطاب
  alternative: أيها الإخوة والأخوات
  rationale: اللفظ اليوناني مذكر جمع، لكنه يُستعمل هنا على الأرجح لمخاطبة الجماعة المؤمنة كلها؛ فحُفظت صيغته في المتن ووُضح نطاقه في الحاشية.
- issue: ترجمة κύριος عند الإشارة إلى يسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ قوة اللقب المسيحاني المألوف في هذا السياق، ولا يضعف الدلالة إلى مجرد علاقة اجتماعية أو إدارية.
- issue: العلاقة بين الطلب وجملة الازدياد
  choice: 'صياغة الغاية حثًّا: «فازدادوا»'
  alternative: «لكي تزدادوا»
  rationale: تكرار ἵνα والبنية اليونانية يسمحان بفهم الجملة الأخيرة مضمونًا أو غاية للطلب؛ صيغة الأمر العربية توضح القوة الحثية من دون حسم دلالة عقائدية متنازع عليها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظت استعارة «السلوك» البولسية، مع إعادة ترتيب محدودة وربط ختامي طبيعي لتجنب ثقل تتابع الجمل الغائية في اليونانية.
