  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: ar
  text: فأنتم تعرفون ما أعطيناكم من وصايا بواسطة الرب يسوع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسلطان الرب يسوع».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδατε
  choice: تعرفون
  rationale: صيغة οἶδα التامة تؤدي معنى حاضرًا في اليونانية الكوينه؛ و«تعرفون» تعبير عربي طبيعي مباشر.
- source_word: γὰρ
  choice: فـ
  rationale: تربط الآية بما قبلها بوصفها تعليلًا أو أساسًا له، وتحافظ الفاء على هذا الترابط بسلاسة.
- source_word: τίνας παραγγελίας
  choice: ما ... من وصايا
  rationale: ينقل التركيب معنى «أيّ وصايا» أو «ما الوصايا التي»، مع إبراز الطابع السلطاني لكلمة παραγγελία دون إغراق في الحرفية.
- source_word: ἐδώκαμεν ὑμῖν
  choice: أعطيناكم
  rationale: ترجمة مباشرة وطبيعية للفعل δίδωμι مع المفعول غير المباشر، وتلائم اقترانه بالوصايا في العربية.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: بواسطة الرب يسوع
  rationale: تحافظ على دلالة الوساطة أو الأداة في διά مع المضاف إليه، من غير حصرها في معنى السلطة وحده.
- source_word: κυρίου
  choice: الرب
  rationale: المقابل العربي الراسخ لكلمة κύριος في هذا السياق.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم الشخصي.
theological_decisions:
- issue: دلالة διὰ τοῦ κυρίου Ἰησοῦ
  choice: بواسطة الرب يسوع
  alternative: بسلطان الرب يسوع
  rationale: قد تدل العبارة على الوساطة أو الأداة، وقد تُفهم في السياق على أن الوصايا صادرة بسلطان الرب يسوع. يبقي المتن الدلالة الأقرب إلى البنية اليونانية، وتورد الحاشية معنى السلطة المحتمل دون حسم التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وصايا» لإبقاء القوة السلطانية في παραγγελίας، مع صياغة طبيعية مفهومة للقارئ العام.
