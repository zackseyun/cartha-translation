language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: ar
  text: وألّا يتجاوز أحدٌ الحدَّ ويستغلَّ أخاه[b] في هذا الأمر[a]، لأن الربَّ هو الذي يُنزل العقاب على كل هذه الأمور، كما سبق أن قلنا لكم وحذّرناكم تحذيرًا جادًّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويغبن أخاه في الأمر». يمكن أن يدل الفعل اليوناني على استغلال شخص أو أخذ حقه، ويفهمه بعضهم بمعنى أضيق هو الغش؛ لكن السياق يرجّح أن التحذير هنا يتعلق بتعدٍّ جنسي.'
    reason: lexical_alternative
  - marker: b
    text: جاءت عبارة «أخاه» في اليونانية بصيغة المفرد المذكر. ويُرجَّح أنها تشير إلى أخ في الإيمان، مع أن التحذير الأخلاقي قد يشمل الآخرين في الجماعة أيضًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: وألّا يتجاوز أحدٌ الحدَّ
  rationale: المصدر المعرّف يواصل مضمون الوصية السابقة، والفعل يصوّر تخطي حد أخلاقي؛ فحافظت الصياغة على الصورة وجعلت دلالتها العامة صريحة.
- source_word: πλεονεκτεῖν
  choice: ويستغلَّ
  rationale: يدل الفعل على الانتفاع على حساب الغير أو أخذ ما ليس بحق، و«يستغل» يحفظ سعته الأخلاقية من غير حصره في الاحتيال المالي.
- source_word: ἐν τῷ πράγματι
  choice: في هذا الأمر
  rationale: تعبير عام يحيل سياقيًا إلى تعليم الآيات السابقة بشأن القداسة والسلوك الجنسي، من غير إضافة تخصيص غير مصرح به في اللفظ نفسه.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: ينقل صيغة المفرد المذكر في اليونانية نقلاً مباشرًا وطبيعيًا، مع احتمال أن يكون المقصود أخًا في جماعة المؤمنين.
- source_word: ἔκδικος κύριος
  choice: الربَّ منتقمٌ
  rationale: يحفظ القوة القضائية للفظ ἔκδικος، أي من يقتص للظلم وينفذ العدل، ويترجم κύριος بالصيغة اللاهوتية المألوفة «الرب».
- source_word: περὶ πάντων τούτων
  choice: من جميع هذه الأمور
  rationale: صياغة عربية طبيعية مع «منتقم» وتحفظ شمول الإشارة إلى الأخطاء التي يدور حولها السياق.
- source_word: προείπαμεν
  choice: سبق أن قلنا لكم
  rationale: يحفظ معنى الإخبار السابق ويميّزه عن فعل التحذير المؤكد اللاحق.
- source_word: διεμαρτυράμεθα
  choice: حذّرناكم تحذيرًا جادًّا
  rationale: ينقل معنى الشهادة المؤكدة أو الإنذار المشدد في هذا السياق الوعظي، بلغة واضحة ومعاصرة.
theological_decisions:
- issue: مرجع «هذا الأمر» وطبيعة التعدي
  choice: تُركت العبارة عامة في النص، مع بيان أن السياق يرجح تعلقها بالسلوك الجنسي.
  alternative: فهم العبارة على أنها تشير إلى الغش أو الاحتيال في المعاملات عمومًا.
  rationale: السياق المباشر في الآيات 3–5 يتناول القداسة والفجور وضبط الجسد، لكن لفظي πρᾶγμα وπλεονεκτεῖν لا يصرحان وحدهما بكل تفاصيل المخالفة؛ لذلك حُفظت سعة العبارة مع توضيح الاحتمال في الحاشية.
- issue: دلالة ἀδελφός
  choice: أخاه
  alternative: أخاه أو أخته؛ أو أخاه في الإيمان
  rationale: الأصل مفرد مذكر، فنُقلت صيغته كما هي، مع الإشارة في الحاشية إلى أن المقصود على الأرجح أحد المؤمنين وأن الحكم الأخلاقي قد يمتد إلى الجماعة عمومًا.
- issue: هوية κύριος ووظيفته القضائية
  choice: الربَّ منتقمٌ
  alternative: الرب يجري العدل؛ أو الرب يعاقب
  rationale: «الرب» تحافظ على الاستمرارية اللاهوتية للفظ κύριος، و«منتقم» تبقي معنى القصاص القضائي في ἔκδικος دون تخفيفه إلى مجرد استنكار.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت الاستعارة في تجاوز الحد، والقوة القضائية في «منتقم»، كما حُفظ العموم المقصود في «هذا الأمر» بدل تفسيره داخل المتن تفسيرًا يزيل الاحتمال.
