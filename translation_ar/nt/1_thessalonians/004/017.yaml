source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: ar
  text: ثُمَّ نَحْنُ الأَحْيَاءُ الْبَاقُونَ سَنُخْتَطَفُ[a] مَعًا مَعَهُمْ فِي السُّحُبِ، لِلِقَاءِ الرَّبِّ فِي الْهَوَاءِ[b]؛ وَهَكَذَا سَنَكُونُ مَعَ الرَّبِّ دَائِمًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «سَنُنْتَزَعُ». يشدد الفعل اليوناني على فعل مفاجئ وقوي.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «إِلَى مُلَاقَاةِ الرَّبِّ فِي الْهَوَاءِ». قد تدل العبارة على الخروج لملاقاة شخص، لكن الآية نفسها لا تحدد ما بعد هذا اللقاء ضمن تسلسل الأحداث الأوسع.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: ثُمَّ
  rationale: تفيد الترتيب الزمني للحدث التالي بعد قيامة الراقدين المذكورة في الآية السابقة.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: الأَحْيَاءُ الْبَاقُونَ
  rationale: تحافظ على الوصفين المتتابعين لمن يكونون أحياء وما زالوا باقين عند ذلك الوقت، من غير أن توحي بأنهم ناجون من خطر بعينه.
- source_word: ἅμα σὺν αὐτοῖς
  choice: مَعَهُمْ جَمِيعًا
  rationale: تعبير عربي طبيعي يبرز اجتماع المؤمنين الأحياء مع الذين أُقيموا، ويحفظ معنى المصاحبة والاجتماع في الحدث.
- source_word: ἁρπαγησόμεθα
  choice: سَنُخْتَطَفُ
  rationale: صيغة مبنية للمجهول تنقل دلالة الفعل على الأخذ المفاجئ القوي إلى فوق، من غير إدخال تصور عقائدي مفصل عن توقيت الحدث أو طبيعته.
- source_word: ἐν νεφέλαις
  choice: فِي السُّحُبِ
  rationale: ترجمة حسية مباشرة لصيغة الجمع، وتحفظ الصورة المرتبطة بالظهور الإلهي.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: لِلِقَاءِ الرَّبِّ
  rationale: تنقل الغاية والاتجاه بعبارة عربية واضحة، من غير أن تحدد ما سيعقب اللقاء مما لا تصرح به الآية.
- source_word: εἰς ἀέρα
  choice: فِي الْهَوَاءِ
  rationale: بعد عبارة «للقاء» يكون التعبير المكاني هو الأفصح والأكثر طبيعية في العربية، مع بقاء معنى الوصول إلى موضع اللقاء.
- source_word: καὶ οὕτως
  choice: وَهَكَذَا
  rationale: 'تدل على النتيجة أو الكيفية: بهذه الصورة تتحقق الإقامة الدائمة مع الرب.'
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: سَنَكُونُ مَعَ الرَّبِّ دَائِمًا
  rationale: تحفظ الوعد المستقبلي ومعنى الاستمرار، وتضع الخاتمة في صياغة عربية واضحة ومهيبة.
theological_decisions:
- issue: دلالة ἁρπαγησόμεθα في سياق الخلافات المتعلقة بما يسمى «الاختطاف»
  choice: سَنُخْتَطَفُ
  alternative: سَنُنْتَزَعُ إِلَى فَوْقُ
  rationale: ينقل الاختيار معنى الفعل اليوناني مباشرة بوصفه فعلًا مفاجئًا وقويًا واقعًا على المؤمنين، من غير تبني ترتيب أخروي خاص بمدرسة عقائدية معينة.
- issue: مدى ما تدل عليه عبارة εἰς ἀπάντησιν τοῦ κυρίου
  choice: لِلِقَاءِ الرَّبِّ
  alternative: إِلَى مُلَاقَاةِ الرَّبِّ
  rationale: تثبت الصياغة حدوث اللقاء واتجاه الحركة نحوه، لكنها لا تستنتج من العبارة وحدها مسارًا لاحقًا أو تسلسلًا أخرويًا أوسع لا تحدده الآية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُعملت ألفاظ مألوفة مثل «السحب» و«الهواء»، وحُفظ البناء المبني للمجهول في «سنُختطف». وُضع هامش [a] عند الفعل الذي يشرحه بدل وضعه بعد «الأحياء»، ووُضع [b] عند عبارة اللقاء ومكانه.
