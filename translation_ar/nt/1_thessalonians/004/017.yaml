  - severity: low
    issue: زيادة «إلى فوق» في بديل الهامش (أ)
    rationale: الفعل ἁρπάζω يدل على الخطف أو الانتزاع بقوة، أما جهة «إلى فوق» فتُستفاد من السياق لا من الفعل نفسه. حذفها يحافظ على الدقة المعجمية.
