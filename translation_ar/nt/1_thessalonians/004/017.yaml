  to: ثُمَّ نَحْنُ الأَحْيَاءُ الْبَاقُونَ سَنُخْتَطَفُ[a] مَعًا مَعَهُمْ فِي السُّحُبِ، لِلِقَاءِ الرَّبِّ فِي الْهَوَاءِ[b]؛ وَهَكَذَا سَنَكُونُ مَعَ الرَّبِّ دَائِمًا.
