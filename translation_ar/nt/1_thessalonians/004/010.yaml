  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: ar
  text: فإنكم تفعلون ذلك فعلًا تجاه جميع الإخوة في مقدونية كلها. ولكننا نحثكم، أيها الإخوة[a]، أن تزدادوا أكثر فأكثر،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير كلمة «الإخوة» هنا إلى رفقاء الإيمان، ويُرجَّح أنها تشمل الرجال والنساء في الكنائس.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإنكم ... فعلًا
  rationale: تنقل «فـ» قوة γάρ التفسيرية الرابطة بما سبق، ويؤدي «فعلًا» معنى التوكيد في καί، بصياغة عربية طبيعية.
- source_word: ποιεῖτε αὐτὸ
  choice: تفعلون ذلك
  rationale: يحيل «ذلك» إلى المحبة الأخوية المذكورة قبلًا، والفعل المضارع يصور ممارستهم المستمرة.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: تجاه جميع الإخوة
  rationale: تفيد «تجاه» اتجاه الفعل والموقف نحو المؤمنين، وتحافظ «الإخوة» على صورة اللفظ اليوناني مع بيان شموله السياقي في الحاشية.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: في مقدونية كلها
  rationale: صياغة عربية واضحة تحافظ على الشمول الجغرافي الذي تفيده العبارة.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: ولكننا نحثكم
  rationale: «نحثكم» تلائم المعنى الاستنهاضي لـ παρακαλέω، و«لكن» تمثل الانتقال الخفيف بـ δέ من الثناء إلى مزيد من الحث.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحافظ على صيغة النداء المذكرة في الأصل، مع توضيح أن الاستعمال السياقي يشمل جماعة المؤمنين في الحاشية.
- source_word: περισσεύειν μᾶλλον
  choice: أن تزدادوا أكثر فأكثر
  rationale: تنقل معنى النمو فوق المستوى القائم والقوة المقارنة لـ μᾶλλον، وهي طبيعية وواضحة بالعربية.
theological_decisions:
- issue: مدى شمول ἀδελφοί/ἀδελφούς في سياق الكنيسة
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: أُبقيت الصيغة المذكرة التي في الأصل، دون حصر مدلولها في الرجال؛ فالسياق يرجح أنها تشمل المؤمنين والمؤمنات، وهو ما توضحه الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على انتقال النص من الإقرار بممارستهم للمحبة إلى حثهم على مزيد منها، وعلى الفاصلة الختامية لأن الآية تتصل نحويًا بما يليها.
