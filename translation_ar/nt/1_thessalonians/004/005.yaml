lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: لا في شهوةٍ جامحةٍ
  rationale: تأتي العبارة مكمّلةً لطريقة السلوك المذكورة في الآية السابقة. ويفيد πάθος انفعالًا قويًّا ذا دلالة سلبية في هذا السياق الجنسي، بينما تحدد ἐπιθυμία طبيعته بوصفه شهوة؛ وصياغة «شهوة جامحة» عربية طبيعية تحفظ اجتماع معنى الرغبة وقوة الانفعال.
- source_word: καθάπερ καὶ
  choice: مثل سائر
  rationale: تفيد العبارة المقارنة والمماثلة. و«مثل سائر» تنقل المقصود في العربية بسلاسة، مع إظهار أن الحديث عن الجماعات الأخرى موضع المقارنة.
- source_word: τὰ ἔθνη
  choice: الأمم
  rationale: اللفظ اليوناني يعني «الأمم»، ويستعمله بولس كثيرًا في غير اليهود. أُبقي اللفظ العربي الواسع في المتن بدل إدخال وصف تفسيري مثل «الوثنيين»، مع بيان الدلالة المحتملة في الحاشية.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: الذين لا يعرفون الله
  rationale: اسم الفاعل المنفي يصف حالة مستمرة، ولذلك تنقلها جملة الصلة العربية بصورة واضحة ومباشرة.
theological_decisions:
- issue: دلالة τὰ ἔθνη في سياق المقابلة الأخلاقية
  choice: الأمم
  alternative: غير اليهود؛ الوثنيون
  rationale: «الأمم» هي المقابل المباشر وتحفظ سعة اللفظ اليوناني. وقد يدل في استعمال بولس على غير اليهود، فيما يكون «الوثنيون» أكثر تفسيرًا وقد يحمل نبرة إضافية لا يصرح بها اللفظ نفسه.
- issue: قوة عبارة πάθει ἐπιθυμίας
  choice: شهوة جامحة
  alternative: انفعال الشهوة؛ هوى شهواني؛ رغبة ملتهبة
  rationale: السياق يتناول السلوك الجنسي المضطرب. تحفظ الصياغة معنى ἐπιθυμία بوصفها شهوة، وتعبّر «جامحة» عن قوة πάθος من غير جعل مجرد الانفعال أو الرغبة في ذاتهما شرًّا خارج هذا السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أبقت الترجمة اتصال العبارة بالآية السابقة، واستعملت «لا في» محافظةً على بنية النهي عن الكيفية. أُدرجت علامتا الحاشيتين [a] و[b] في المتن.
