source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: ar
  text: لِأَنَّ اللهَ لَمْ يَدْعُنَا لِلْعَيْشِ فِي النَّجَاسَةِ[a]، بَلْ فِي الْقَدَاسَةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الدَّنَس». تدل الكلمة اليونانية على النجاسة الأخلاقية، ولا سيما النجاسة الجنسية في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «التقديس». يمكن أن تشير الكلمة اليونانية إلى القداسة بوصفها حالة، أو إلى التقديس بوصفه عملية الصيرورة إلى القداسة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تُبيّن الأداة أن هذه العبارة تعليل للوصية السابقة، و«لأن» تؤدي هذا الربط بوضوح في العربية.
- source_word: ἐκάλεσεν
  choice: دَعَا
  rationale: يحافظ الفعل على صورة الدعوة الإلهية في اليونانية من غير أن يحمّلها تحديدًا مذهبيًا لطبيعة هذه الدعوة.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: لِلْعَيْشِ فِي النَّجَاسَةِ
  rationale: تدل العبارة هنا على الغاية أو مجال الحياة الذي تتصف به الدعوة. وإضافة «للعيش» توضح المقصود الطبيعي في العربية، مع إبقاء معنى النجاسة بوصفها مجالًا أخلاقيًا.
- source_word: ἀκαθαρσίᾳ
  choice: النَّجَاسَةِ
  rationale: تنقل «النجاسة» المجال الدلالي الواسع للكلمة، بما فيه الدنس الأخلاقي، ولا سيما الجنسي في السياق القريب، مع بقاء صداها المرتبط بالطهارة والقداسة.
- source_word: ἐν ἁγιασμῷ
  choice: فِي الْقَدَاسَةِ
  rationale: تحافظ «في» على تصوير القداسة بوصفها المجال أو النمط الذي يحيا فيه المدعوون، بينما تعبّر «القداسة» بوضوح عن الحالة من غير استبعاد معنى التقديس الجاري.
theological_decisions:
- issue: مدلول دعوة الله
  choice: دعوة إلهية حقيقية تؤسس للحياة الأخلاقية المقدسة، من غير تحديد آليتها بمصطلح مذهبي تقني
  alternative: دعوة عامة فحسب، أو دعوة فعّالة بالمعنى اللاهوتي الاصطلاحي الدقيق
  rationale: النص يجعل دعوة الله أساسًا لترك النجاسة والحياة في القداسة، لكنه لا يشرح في هذه الآية كيفية عمل الدعوة؛ لذلك تُحفظ لفظة «دعا» بلا زيادة عقائدية.
- issue: مدلول ἁγιασμός
  choice: القداسة مع التنبيه إلى احتمال معنى التقديس
  alternative: التقديس بوصفه عملية الصيرورة إلى القداسة
  rationale: المقابلة مع النجاسة ترجّح هنا حالة القداسة أو مجال الحياة المقدسة، لكن الاسم اليوناني يحتمل أيضًا عملية التقديس، ولذلك حُفظ البديل في الحاشية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. أُضيفت عبارة «للعيش» لإظهار دلالة الغاية ومجال السلوك بصورة طبيعية، مع الحفاظ على المقابلة بين النجاسة والقداسة وعلى الاحتمال الدلالي بين القداسة والتقديس في الحاشية.
