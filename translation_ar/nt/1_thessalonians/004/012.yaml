  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: ar
  text: لِكَيْ تَسْلُكُوا بِلِيَاقَةٍ أَمَامَ الَّذِينَ هُمْ مِنْ خَارِجٍ، وَلَا تَحْتَاجُوا إِلَى شَيْءٍ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا تحتاجوا إلى أحد». وقد تشدد العبارة على عدم الاتكال على الآخرين.'
    reason: قراءة تفسيرية بديلة لعبارة يونانية يمكن أن تُفهم من جهة عدم العوز أو من جهة عدم الاعتماد على الأشخاص.
lexical_decisions:
- source_word: ἵνα
  choice: لِكَيْ
  rationale: تؤدي معنى الغاية أو النتيجة المتصلة بالوصايا السابقة، بصياغة عربية واضحة ومباشرة.
- source_word: περιπατῆτε
  choice: تَسْلُكُوا
  rationale: تحفظ استعارة المشي للدلالة على نمط الحياة، وهي مألوفة ومفهومة في العربية الكتابية المعاصرة.
- source_word: εὐσχημόνως
  choice: بِلِيَاقَةٍ
  rationale: تنقل معنى التصرف على نحو لائق ومحترم اجتماعيًا، من غير حصره في معنى أخلاقي أضيق أو المبالغة فيه.
- source_word: πρὸς τοὺς ἔξω
  choice: أَمَامَ الَّذِينَ مِنْ خَارِجٍ
  rationale: تعكس البعد العلني والاجتماعي للسلوك في نظر من هم خارج الجماعة، وتحفظ تعبير النص بدل إدخال وصف تفسيري مثل «غير المؤمنين».
- source_word: μηδενὸς χρείαν ἔχητε
  choice: وَلَا تَحْتَاجُوا إِلَى شَيْءٍ
  rationale: هذه هي الدلالة النحوية الأرجح للعبارة، وتشير إلى عدم العوز، مع إبقاء احتمال الإشارة إلى عدم الاعتماد على الأشخاص في الحاشية.
theological_decisions:
- issue: دلالة العبارة الختامية μηδενὸς χρείαν ἔχητε
  choice: عدم الاحتياج إلى شيء
  alternative: عدم الاحتياج إلى أحد
  rationale: صيغة «شيء» أرجح نحويًا وتحفظ عموم العبارة. غير أن سياق العمل باليد وعدم الاتكال على الآخرين يجعل دلالة «أحد» ممكنة، لذلك أُبقيت في الحاشية بدل حسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تسلكوا» للمحافظة على الاستعارة البولسية، و«الذين من خارج» لصون التعبير الجماعي في الأصل من غير إضافة توصيف عقائدي غير مصرح به.
