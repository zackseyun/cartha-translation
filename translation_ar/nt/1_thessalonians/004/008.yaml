  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: ar
  text: لذلك، مَن يرفض هذا[a] لا يرفض إنسانًا، بل الله، الذي يعطيكم أيضًا روحَه القدوس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن يتجاهل هذا لا يتجاهل إنسانًا، بل الله». يمكن أن يعني الفعل اليوناني «يرفض» أو «يتجاهل» أو «يطرح جانبًا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرف الجر اليوناني يعني حرفيًا «إلى داخلكم»، مع أن العربية تقول طبيعيًا هنا: «يعطيكم روحَه القدوس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: لذلك
  rationale: تفيد نتيجة مترتبة على الوصية السابقة، و«لذلك» تؤدي هذا الربط الاستنتاجي بوضوح في العربية المعاصرة.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: مَن يرفض ... يرفض
  rationale: اسم الفاعل المعرّف مستعمل استعمالًا عامًا، و«مَن» تحفظ هذا العموم. والفعل هنا يدل على رفض التوجيه ذي السلطان أو إهماله وإطراحه.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: لا يرفض إنسانًا، بل الله
  rationale: «إنسانًا» مفرد ذو دلالة عامة، ويحفظ المقابلة الموجزة بين الإنسان والله دون حصرها في الذكور.
- source_word: τὸν καὶ διδόντα
  choice: الذي يعطيكم أيضًا
  rationale: حُوِّل اسم الفاعل اليوناني إلى جملة موصولة طبيعية، وحُفظت دلالة καί بـ«أيضًا»، مع بقاء الفعل في صيغة الحاضر.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: روحَه القدوس
  rationale: ترتيب الإضافة والصفة طبيعي في العربية، والعبارة في هذا السياق تشير إلى روح الله القدوس.
- source_word: εἰς ὑμᾶς
  choice: يعطيكم
  rationale: أُديت علاقة العطاء بالمفعول غير المباشر بواسطة اتصال ضمير المخاطبين بالفعل، وهو الأسلوب العربي الطبيعي. أما الدلالة الحرفية المحتملة لـεἰς، أي «فيكم/إليكم»، فذُكرت في الحاشية.
theological_decisions:
- issue: مرجع «روحَه القدوس»
  choice: الإشارة إلى روح الله القدوس الذي يعطيه الله للمؤمنين
  alternative: فهم «الروح المقدس» على أنه عطية أو نزعة غير شخصية
  rationale: التركيب τὸ πνεῦμα αὐτοῦ τὸ ἅγιον في السياق البولسي يدل طبيعيًا على روح الله القدوس، من غير إضافة تفصيل عقائدي لا ينص عليه العدد.
- issue: عموم ὁ ἀθετῶν
  choice: مَن يرفض
  alternative: الذي يرفض / الرجل الذي يرفض
  rationale: صيغة المذكر المفرد اليونانية تمثيلية عامة وليست مقصورة على الذكور، و«مَن» تنقل هذا العموم بوضوح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «مَن» للعموم، وحُفظت المقابلة البلاغية الموجزة بين الإنسان والله، مع توثيق البدائل المعجمية ودلالة حرف الجر في الحواشي.
