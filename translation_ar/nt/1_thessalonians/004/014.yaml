  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: ar
  text: فإن كنا نؤمن أن يسوع مات وقام، فكذلك سيُحضِر الله معه الذين رقدوا[a] بواسطة يسوع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «الذين ماتوا»؛ يستخدم بولس «رقدوا» استعارةً لموت المؤمنين في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذين رقدوا في يسوع». يمكن فهم العبارة اليونانية «διὰ τοῦ Ἰησοῦ» على معنى الوساطة أو الفاعلية، وقد تُفهم أيضًا على معنى الارتباط الوثيق بيسوع، أو: «بسبب يسوع».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: لأننا إن كنا
  rationale: تنقل «لأن» الاستدلالية مع أداة الشرط، وتحافظ على كون الآية تعليلًا للرجاء المذكور في السياق السابق.
- source_word: πιστεύομεν
  choice: نؤمن
  rationale: تؤدي معنى الإيمان المشترك بالمضمون الإقراري المتعلق بموت يسوع وقيامته.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: مات وقام
  rationale: صياغة عربية طبيعية ومباشرة تحافظ على الفعلين بصيغة الحدث الماضي، من غير تحويل «قام» إلى مبني للمجهول.
- source_word: οὕτως καὶ
  choice: فكذلك
  rationale: تحافظ على الرابط المقارن بين موت يسوع وقيامته وبين ما سيفعله الله للراقدين.
- source_word: τοὺς κοιμηθέντας
  choice: الذين رقدوا
  rationale: تُبقي استعارة الرقاد التي يستخدمها بولس للموت في هذا السياق، بدل تسويتها إلى «الذين ماتوا».
- source_word: διὰ τοῦ Ἰησοῦ
  choice: بواسطة يسوع
  rationale: تنقل على نحو مباشر معنى الوساطة أو الفاعلية الممكن في διά مع المضاف إليه، مع إبقاء الاحتمال التركيبي الآخر في الحاشية.
- source_word: ἄξει
  choice: سيُحضِر
  rationale: ينقل معنى الإتيان بأشخاص أو إحضارهم، وهو أنسب هنا من «سيقود».
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: تحافظ على معنى المصاحبة وعلى الضمير اليوناني، ومرجعه الطبيعي في السياق هو يسوع.
theological_decisions:
- issue: استعارة الرقاد في κοιμηθέντας
  choice: الإبقاء على «الذين رقدوا» في المتن
  alternative: الذين ماتوا
  rationale: الاستعارة مقصودة ومهمة في سياق الحزن ورجاء القيامة؛ لذلك لا تُستبدل في المتن بتفسيرها المباشر.
- issue: دلالة διὰ τοῦ Ἰησοῦ وموضع تعلقها
  choice: «بواسطة يسوع» في المتن
  alternative: «الذين رقدوا في يسوع» أو «بسبب يسوع»
  rationale: العبارة اليونانية تحتمل الوساطة أو الفاعلية، كما فهمها بعضهم على معنى الارتباط الوثيق بيسوع. يحافظ المتن على القراءة المباشرة لـδιά مع المضاف إليه، وتعرض الحاشية البديل دون حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. أُبقيت استعارة «الرُّقاد» المألوفة كتابيًا مع شرحها، واستُعمل «سيُحضِر» لتجنب غموض «سيأتي» اللازم، مع الحفاظ على الغموض الحقيقي في علاقة عبارة «بواسطة يسوع» بما قبلها أو بما بعدها.
