  terminology: «شؤونكم الخاصة» و«تعملوا بأيديكم» تعبيران طبيعيان ودقيقان. لا يوجد مصطلح لاهوتي متنازع عليه في الآية. استبدال «أوصيناكم» بـ«أمرناكم» يحفظ النبرة السلطوية للفعل اليوناني دون تحميل النص معنى مذهبيًا.
