  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: ar
  text: وأن تجعلوا من العيش بهدوء[a] طموحًا لكم، وأن تهتموا بشؤونكم الخاصة[b]، وأن تعملوا بأيديكم، كما أمرناكم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تطمحوا إلى الهدوء».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن تنصرفوا إلى أعمالكم الخاصة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: أن تجعلوا من طموحكم
  rationale: ينقل معنى اتخاذ الأمر غايةً مشرفة والسعي الجاد إليه، ويحفظ المفارقة المقصودة في الطموح إلى حياة هادئة.
- source_word: ἡσυχάζειν
  choice: أن تعيشوا بهدوء
  rationale: السياق يحث على نمط حياة هادئ ومستقر، لا على مجرد الصمت أو الامتناع عن الكلام.
- source_word: πράσσειν τὰ ἴδια
  choice: أن تهتموا بشؤونكم الخاصة
  rationale: تعبير عربي طبيعي يؤدي معنى الانشغال بأمور المرء ومسؤولياته، من غير النبرة الجافة التي قد يحملها التعبير الحرفي.
- source_word: ἐργάζεσθαι
  choice: أن تعملوا
  rationale: لفظ عام وطبيعي يطابق معنى العمل في السياق.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: بأيديكم
  rationale: ينقل دلالة الأداة والضمير في اليونانية بعبارة عربية طبيعية؛ وملكية الأيدي ظاهرة في ضمير المخاطبين.
- source_word: καθὼς
  choice: كما
  rationale: أداة المقارنة العربية الطبيعية التي تربط الحث بالتوجيه السابق.
- source_word: παρηγγείλαμεν
  choice: أوصيناكم
  rationale: ينقل التوجيه الرسولي الملزم بلفظ عربي فصيح وطبيعي، مع تجنب إيحاء «أمرناكم» بأنه مجرد إصدار أوامر قاسٍ؛ وتُذكر قوة البديل في الحاشية.
theological_decisions:
- issue: القوة الإلزامية للتوجيه الرسولي
  choice: أوصيناكم
  alternative: أمرناكم
  rationale: يحفظ «أوصيناكم» معنى التكليف والتوجيه الجاد في هذا السياق، بينما يبرز «أمرناكم» السلطان بصورة أشد؛ ولأن παραγγέλλω يحتمل كليهما، أُبقي البديل في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. حوفظ على سلسلة المصادر المعطوفة وعلى المفارقة البلاغية في جعل الهدوء طموحًا. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
