lexical_decisions:
- source_word: ὥστε
  choice: حتى
  rationale: تفيد النتيجة المترتبة على ما سبق، وهي صياغة عربية طبيعية تحافظ على القوة التعاقبية في السياق.
- source_word: γενέσθαι
  choice: صرتم
  rationale: تنقل معنى الصيرورة في المصدر اليوناني الواقع بعد ὥστε، مع تحويله إلى فعل عربي تام ملائم للسياق.
- source_word: ὑμᾶς
  choice: ضمير المخاطبين في «صرتم»
  rationale: الضمير جمعٌ مخاطب، وقد أُدمج طبيعيًا في تصريف الفعل العربي.
- source_word: τύπον
  choice: قدوةً
  rationale: يدل هنا على مثال يُحتذى به؛ و«قدوة» واضحة وطبيعية في العربية لهذا المعنى، مع إثبات البديل الممكن في الحاشية.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: لجميع المؤمنين
  rationale: اسم الفاعل اليوناني مستعمل استعمال الاسم للدلالة على الذين يؤمنون، واللام تبيّن الجهة التي صار التسالونيكيون قدوةً لها.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: في مكدونية
  rationale: نقل مباشر لعبارة المكان واسم الإقليم.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: وفي أخائية
  rationale: يحافظ على عطف الإقليم الثاني وعلى تكرار دلالة الظرف كما في اليونانية.
