source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: ar
  text: ذاكرين عمل إيمانكم[c]، وتعب محبتكم، وثبات رجائكم في ربنا يسوع المسيح[a] أمام إلهنا وأبينا[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» تعني «الممسوح»، وهي هنا لقب ليسوع.
    reason: alternative_reading
  - marker: b
    text: يجوز أن تتعلق عبارة «أمام إلهنا وأبينا» بفعل «ذاكرين» أو بالأوصاف الثلاثة كلها.
    reason: syntactic_ambiguity
  - marker: c
    text: يمكن أن تُفهم «الإيمان» أيضًا بمعنى «الثقة» أو «الأمانة».
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύοντες
  choice: ذاكرين
  rationale: اسم فاعل حالي يتابع تركيب الآية السابقة، ويحافظ على معنى التذكّر المستمر بصياغة عربية موجزة.
- source_word: ἔργου τῆς πίστεως
  choice: عمل إيمانكم
  rationale: يحفظ البنية الإضافية اليونانية وإيقاع الثلاثية، مع إبقاء العلاقة بين العمل والإيمان غير محسومة صراحةً؛ فقد يكون العمل الناشئ عن الإيمان أو المتصف به.
- source_word: κόπου τῆς ἀγάπης
  choice: تعب محبتكم
  rationale: «تعب» ينقل معنى الجهد الشاق في κόπος، ويحافظ على التوازي مع «عمل» و«ثبات».
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: ثبات رجائكم
  rationale: «ثبات» يعبّر عن الصمود والصبر تحت الضغط، مع الحفاظ على الصياغة الإضافية وعلاقة الرجاء به.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: في ربنا يسوع المسيح
  rationale: توضح «في» أن الرب يسوع هو متعلَّق الرجاء أو مجاله، وهو معنى طبيعي محتمل للإضافة. تُرجم Χριστός باللقب العربي المألوف «المسيح».
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: أمام إلهنا وأبينا
  rationale: «أمام» تنقل معنى الحضور لدى الله، وتحافظ «إلهنا وأبينا» على اقتران الاسمين في اليونانية.
theological_decisions:
- issue: دلالة πίστις في «عمل إيمانكم»
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: «الإيمان» هو المقابل الأوسع والأكثر حيادًا في السياق، بينما تبقى دلالتا الأمانة والثقة ممكنتين، ولذلك حُفظتا في الحاشية.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: Χριστός لقب يعني الممسوح، و«المسيح» هو المقابل العربي الطبيعي والراسخ الذي يحفظ وظيفته اللقبية؛ ذُكر المعنى الحرفي في الحاشية.
- issue: تعلّق عبارة ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: أمام إلهنا وأبينا، مع بقاء إمكان تعلّقها بفعل التذكّر أو بالثلاثية كلها
  alternative: أن تُفهم على أنها تصف الرجاء وحده أمام الله
  rationale: موضع العبارة اليونانية يسمح بأكثر من نطاق نحوي؛ أبقت العربية العبارة في آخر الجملة ولم تضف تفسيرًا يحسم تعلقها.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي الثلاثي: «عمل... وتعب... وثبات»، وتُركت الإضافات على قدر من الانفتاح الدلالي بدل تفسيرها كلها بصيغة «الناتج عن». جميع علامات الحواشي الواردة مثبتة في المتن.'
