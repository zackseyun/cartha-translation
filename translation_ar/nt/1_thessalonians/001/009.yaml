  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: ar
  text: فَإِنَّهُمْ هُمْ أَنْفُسُهُمْ يُخْبِرُونَ عَنَّا أَيَّ دُخُولٍ كَانَ لَنَا إِلَيْكُمْ[a]، وَكَيْفَ تَحَوَّلْتُمْ إِلَى اللهِ عَنِ الأَوْثَانِ لِتَخْدِمُوا اللهَ الْحَيَّ الْحَقَّ[b][c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أيَّ دخولٍ كان لنا إليكم»؛ ويشير التعبير اليوناني إلى طبيعة مجيء الرسل إليهم ووقعه.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «لِتَخْدِمُوا» بـ«لِتَعْبُدُوا»؛ فالفعل يدل على خدمة مكرَّسة لله في سياق ديني، وقد يحمل معنى العبودية.
    reason: lexical_alternative
  - marker: c
    text: يُقابِل وصفُ الله بأنه «الحي الحق» الأوثانَ الخالية من الحياة والباطلة؛ قارن إرميا 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: هُمْ أَنْفُسُهُمْ
  rationale: يحفظ توكيد الضمير اليوناني، إذ إن الآخرين أنفسهم ينقلون الخبر.
- source_word: ἀπαγγέλλουσιν
  choice: يُخْبِرُونَ
  rationale: فعل عربي طبيعي يدل على نقل الخبر، ويحفظ دلالة المضارع على الاستمرار.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: كَيْفَ كَانَ دُخُولُنَا إِلَيْكُمْ
  rationale: يحافظ على صورة الدخول في الأصل وعلى وصف طبيعته ووقعه، من غير اختزالها في معنى الاستقبال وحده.
- source_word: πῶς ἐπεστρέψατε
  choice: كَيْفَ رَجَعْتُمْ
  rationale: يحفظ استعارة التحول أو الرجوع في الفعل اليوناني، ويتجنب فرض مصطلح عقائدي تقني.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: إِلَى اللهِ عَنِ الْأَوْثَانِ
  rationale: 'ينقل اتجاهي التحول معًا: إلى الله وبعيدًا عن الأوثان.'
- source_word: εἰδώλων
  choice: الْأَوْثَانِ
  rationale: المقابل العربي المباشر والمألوف للأشياء أو الآلهة التي تُعبد باطلًا.
- source_word: δουλεύειν
  choice: لِتَعْبُدُوا
  rationale: في سياق الانتقال من الأوثان إلى الله يدل الفعل على خدمة دينية مكرسة؛ و«تعبدوا» توضح هذا البعد، مع بيان البديل الحرفي في الحاشية.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: اللهَ الْحَيَّ الْحَقَّ
  rationale: صياغة عربية موجزة تحافظ على الصفتين وعلى المقابلة بين الله الحي الحق والأوثان الجامدة الباطلة.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحفظ الصلة التفسيرية التي تربط الآية بما قبلها.
theological_decisions:
- issue: طبيعة لغة التحول في ἐπεστρέψατε
  choice: رَجَعْتُمْ إِلَى اللهِ عَنِ الْأَوْثَانِ
  alternative: تحولتم إلى الله عن الأوثان / اهتديتم إلى الله وتركتم الأوثان
  rationale: يحفظ حركة الرجوع المقصودة في النص ومسؤولية المخاطبين، من غير حسم أسئلة لاهوتية عن كيفية حدوث التحول.
- issue: دلالة δουλεύειν في العلاقة بالله
  choice: لِتَعْبُدُوا
  alternative: لتخدموا / لتكونوا عبيدًا لله
  rationale: السياق ديني ويقابل عبادة الله بعبادة الأوثان؛ لذلك توصل «تعبدوا» المعنى الطبيعي، بينما تُذكر دلالة الخدمة أو العبودية اللفظية في الحاشية حفظًا للاتساع الدلالي.
- issue: وصف الله بأنه ζῶντι καὶ ἀληθινῷ
  choice: اللهَ الْحَيَّ الْحَقَّ
  alternative: إلهًا حيًّا حقيقيًّا
  rationale: يحافظ على الإشارة إلى الله المعيّن وعلى المقابلة اللاهوتية مع الأوثان التي لا حياة فيها وليست آلهة حقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة «الدخول» بدل تفسيرها في المتن بـ«الاستقبال»، وحُفظت حركة الرجوع إلى الله عن الأوثان. استُعمل الضبط الجزئي الكامل في نص الآية لرفع الالتباس، مع حواشٍ تشرح البدائل المهمة دون إثقال المتن.
