translation:
  language: ar
  text: وأن تنتظروا ابنه الآتي من السماء، الذي أقامه من بين الأموات، يسوع، الذي ينقذنا من الغضب الآتي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμένειν
  choice: تنتظروا
  rationale: ينقل معنى الانتظار المتطلع إلى المجيء، ويواصل صيغة الكلام الموجَّه إلى أهل تسالونيكي في سياق الآية السابقة.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ابنه
  rationale: صياغة مباشرة تحفظ لقب البنوة المسياني من دون شرح زائد.
- source_word: ἐκ τῶν οὐρανῶν
  choice: آتيًا من السماء
  rationale: أُضيف «آتيًا» لإظهار تعلق شبه الجملة بالابن في عربية طبيعية، واستُعمل المفرد «السماء» لأنه التعبير العربي المألوف في هذا المعنى، مع أن اليونانية تستعمل صيغة الجمع.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: ذاك الذي أقامه من بين الأموات
  rationale: يحفظ فعل الإقامة وصورة الخروج من بين جماعة الأموات، مع توضيح مرجع الضمير في العربية.
- source_word: Ἰησοῦν
  choice: أي يسوع
  rationale: يبيّن أن «يسوع» بدل يحدد هوية الابن المذكور، وفق البنية اليونانية، من دون تحويله إلى جملة تفسيرية مستقلة.
- source_word: τὸν ῥυόμενον
  choice: الذي ينقذنا
  rationale: ينقل اسم الفاعل المضارع بصلة موصول طبيعية، ويحافظ على وصف يسوع بأنه المنقذ من غير تقييد الفعل صراحة بزمن المستقبل.
- source_word: ἐκ τῆς ὀργῆς τῆς ἐρχομένης
  choice: من الغضب الآتي
  rationale: يحفظ اللفظ المحدد «الغضب» والقوة الأخروية لاسم الفاعل «الآتي» من غير تفسير ماهية هذا الغضب.
theological_decisions:
- issue: ماهية «الغضب الآتي»
  choice: الغضب الآتي
  alternative: الدينونة الآتية؛ أو تخصيصه بضيق آخر الزمان أو بالدينونة النهائية
  rationale: النص يذكر غضبًا آتيًا من غير أن يحدد هنا نطاقه أو مرحلته؛ لذلك تُحفظ العبارة بلا إدخال مخطط أخروي مذهبي.
- issue: الدلالة الزمنية لاسم الفاعل ῥυόμενον
  choice: الذي ينقذنا
  alternative: الذي سينقذنا؛ الذي يواصل إنقاذنا
  rationale: الصيغة اليونانية تصف يسوع بصفته المنقذ، بينما يجعل «الغضب الآتي» السياق مستقبليًا؛ فلا تُفرض على الفعل صيغة مستقبل صريحة ليست في الأصل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حافظت الصياغة على اتصال المصدر اليوناني بسياق الآية السابقة بواسطة «وأن تنتظروا»، واستعملت «من بين الأموات» لإبراز قوة ἐκ مع الجمع. لا توجد حاشية لازمة في هذا الموضع؛ فالتنويع الإنجليزي المرفق يبدو غير متطابق مع موضع علامته، ولم يُنقل آليًا إلى العربية.
