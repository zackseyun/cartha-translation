id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: ar
  text: لأن بشارتنا لم تصل إليكم بالكلام وحده، بل أيضًا بقوة وبالروح القدس وبيقين عظيم[a]، كما تعلمون أيَّ رجال كنا بينكم لأجلكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «باقتناع شديد»، أو «بملء الثقة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بسببكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: بشارتنا
  rationale: «البشارة» تعبير عربي كتابي راسخ وطبيعي يدل هنا على رسالة الإنجيل التي أعلنها الرسل.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: لم تصل إليكم
  rationale: هذا تعبير اصطلاحي عن وصول البشارة إلى أهل تسالونيكي واختبارهم لها، لا عن مجرد حدوثها.
- source_word: ἐν λόγῳ μόνον
  choice: بالكلام وحده
  rationale: يحفظ المقابلة بين الإعلان اللفظي وحده وبين الإعلان المصحوب بالقوة والروح القدس واليقين.
- source_word: ἐν δυνάμει
  choice: بقوة
  rationale: صياغة عربية طبيعية تحافظ على توازي عبارات ἐν المتتابعة.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: بالروح القدس
  rationale: تشير العبارة بحسب الاستعمال البولسي إلى الروح القدس، لا إلى مجرد حالة روحية بشرية.
- source_word: πληροφορίᾳ πολλῇ
  choice: بيقين عظيم
  rationale: تنقل معنى الامتلاء بالثقة أو اليقين مع إبقاء صاحب هذا اليقين غير مصرح به، كما في اليونانية.
- source_word: καθὼς οἴδατε
  choice: كما تعلمون
  rationale: تقدم معرفة المخاطبين شاهدًا مؤيدًا لما سبق بصياغة عربية واضحة.
- source_word: οἷοι ἐγενήθημεν
  choice: أيَّ رجال كنا
  rationale: تشير إلى صفة بولس ورفقائه وسيرتهم بين المخاطبين؛ و«رجال» دقيقة لأن الحديث عن جماعة المرسلين المعروفة.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: المقصود وجودهم وسلوكهم في وسط أهل تسالونيكي.
- source_word: δι’ ὑμᾶς
  choice: لأجلكم
  rationale: تحفظ دلالة الغاية أو المنفعة، مع احتمال دلالة السببية المذكور في الحاشية.
theological_decisions:
- issue: مرجع عبارة πνεύματι ἁγίῳ
  choice: الروح القدس
  alternative: روح مقدسة أو قوة روحية
  rationale: الاستعمال البولسي والسياق الذي ينسب فاعلية الكرازة إلى مصدر إلهي يرجحان الإشارة إلى الروح القدس.
- issue: دلالة πληροφορίᾳ πολλῇ
  choice: بيقين عظيم مع عدم تعيين صاحب اليقين
  alternative: باقتناع شديد؛ وبملء الثقة
  rationale: النص اليوناني لا يحدد صراحة أكان اليقين لدى المبشرين أم السامعين أم صفةً لمجيء البشارة عمومًا، لذلك لا تحسم الترجمة هذا الاحتمال.
- issue: دلالة οἷοι ἐγενήθημεν
  choice: أيَّ رجال كنا
  alternative: أيَّ أناس كنا؛ كيف أثبتنا ذواتنا
  rationale: العبارة تصف هوية المرسلين وسيرتهم كما عرفها أهل تسالونيكي، من دون إضافة معنى «أثبتنا» غير الصريح في الفعل.
- issue: دلالة δι’ ὑμᾶς
  choice: لأجلكم
  alternative: بسببكم
  rationale: السياق يرجح معنى المنفعة أو الغاية، لكن حرف الجر مع المفعول يحتمل السببية أيضًا، ولذلك أُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. حُفظ توازي العبارات («بالكلام... بقوة... بالروح القدس... بيقين») بقدر ما تسمح به العربية، وأُبقي الغموض الحقيقي في صاحب اليقين. وُضعت علامتا الحاشية في موضعيهما داخل النص.
