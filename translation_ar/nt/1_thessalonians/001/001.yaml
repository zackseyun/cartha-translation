  source_fidelity: 'النص يحافظ على عناصر اليونانية جميعًا: المرسلون الثلاثة، والمخاطَبون، وعلاقة الكنيسة بـ«الله الآب والرب يسوع المسيح»، ثم التحية «نعمة لكم وسلام». و«الكائنة في» توضح تعلّق شبه الجملة بالكنيسة من غير تحويل ἐν إلى ملكية أو تفسير لاهوتي محدد.'
