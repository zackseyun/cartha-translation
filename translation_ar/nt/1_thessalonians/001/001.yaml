  terminology: الأسماء منقولة على نحو مناسب للنص اليوناني، ولا سيما «سلوانس» مقابل Σιλουανός. وتحافظ «الله الآب»، و«الرب»، و«المسيح»، و«نعمة»، و«سلام» على المصطلحات الرئيسة ودلالتها. الحاشية مثبتة بعلامة صحيحة بعد «المسيح» وتقدم إيضاحًا معجميًا غير مذهبي.
