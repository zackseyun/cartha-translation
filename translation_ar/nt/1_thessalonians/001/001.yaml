source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: ar
  text: 'مِن بولس وسلوانس وتيموثاوس، إلى كنيسة أهل تسالونيكي، الكائنة في الله الآب والرب يسوع المسيح[a]: نعمة لكم وسلام.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني «خريستوس» لقب معناه «المسيح»، أي الممسوح.
    reason: lexical_clarification
lexical_decisions:
- source_word: Παῦλος
  choice: بولس
  rationale: الصيغة العربية المألوفة للاسم اليوناني.
- source_word: Σιλουανὸς
  choice: سلوانس
  rationale: نقل مباشر للصيغة الواردة في النص اليوناني، بدل «سيلا» التي تقابل صيغة يونانية أخرى.
- source_word: Τιμόθεος
  choice: تيموثاوس
  rationale: الصيغة العربية المألوفة للاسم اليوناني.
- source_word: ἐκκλησίᾳ
  choice: كنيسة
  rationale: اللفظ العربي الطبيعي للجماعة المسيحية المجتمعة في سياق الرسالة، ولا يقتصر هنا على مبنى.
- source_word: Θεσσαλονικέων
  choice: أهل تسالونيكي
  rationale: تعبير عربي طبيعي ودقيق عن سكان مدينة تسالونيكي أو المنتمين إليها.
- source_word: ἐν
  choice: الكائنة في
  rationale: إضافة «الكائنة» توضح تعلق شبه الجملة بالكنيسة، مع إبقاء «في» وعدم حسم العلاقة إلى معنى تفسيري مثل الملكية.
- source_word: θεῷ πατρὶ
  choice: الله الآب
  rationale: يحفظ التركيب الوصفي من دون إدخال ضمير «أبينا» غير الموجود في اليونانية.
- source_word: κυρίῳ
  choice: الرب
  rationale: المقابل العربي المألوف والدقيق للقب κύριος في هذا السياق.
- source_word: Ἰησοῦ Χριστῷ
  choice: يسوع المسيح
  rationale: «المسيح» ينقل معنى اللقب Χριστός في العربية، وهو أيضًا الاستعمال العربي الراسخ، من غير الحاجة إلى بديل صوتي منقول.
- source_word: χάρις
  choice: نعمة
  rationale: المقابل العربي المألوف الذي يحفظ الدلالة اللاهوتية والتحية الرسولية.
- source_word: εἰρήνη
  choice: سلام
  rationale: مقابل مباشر يحفظ أصداء التحية اليونانية واليهودية.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: نعمة لكم وسلام
  rationale: يحافظ على ترتيب الأصل، حيث يأتي «لكم» عقب «نعمة»، ويبقى عربيًا سليمًا.
theological_decisions:
- issue: دلالة Χριστός في التحية
  choice: المسيح
  alternative: المسيح الممسوح / نقل صوتي للقب
  rationale: «المسيح» في العربية ترجمة دلالية راسخة للقب اليوناني، وتحفظ طابعه اللقبي في عبارة «يسوع المسيح» من غير فرض تفسير طائفي.
- issue: العلاقة التي تفيدها ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: الكنيسة الكائنة «في» الله الآب والرب يسوع المسيح
  alternative: الكنيسة التابعة لله الآب والرب يسوع المسيح
  rationale: الإبقاء على «في» يصون لغة النص وعلاقة الاتحاد أو المجال التي تحتملها، بدل اختزالها في الملكية أو الانتماء، كما يحفظ التوازي بين الله الآب والرب يسوع المسيح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «كنيسة» للدلالة على جماعة المؤمنين لا على المبنى، وصيغت «الكائنة في» لتجنب التباس تعلق عبارة «في الله الآب...» مع الحفاظ على حرف الجر اليوناني ودلالته المفتوحة.
