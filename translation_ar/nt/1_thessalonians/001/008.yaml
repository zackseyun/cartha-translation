  source_fidelity: 'النص يحفظ ترتيب الحجة والمعاني الرئيسة بدقة جيدة: انطلاق كلمة الرب منهم، وعدم اقتصار ذلك على مقدونية وأخائية، وانتشار إيمانهم بالله، والنتيجة المترتبة على ذلك. غير أن عبارة «لم تعد بنا حاجة» لا تعبّر تعبيرًا سليمًا وطبيعيًا عن التركيب اليوناني الحالي «لا حاجة لنا»، وقد توحي بزوال حاجة كانت قائمة على نحو غير ملحوظ في الأصل.'
