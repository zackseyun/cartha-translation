  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: ar
  text: فَمِنْ عِنْدِكُمْ دَوَّتْ كَلِمَةُ الرَّبِّ، لَا فِي مَكِدُونِيَّةَ وَأَخَائِيَةَ فَقَطْ، بَلْ ذَاعَ إِيمَانُكُمْ بِاللهِ[a] فِي كُلِّ مَكَانٍ، حَتَّى لَا حَاجَةَ بِنَا إِلَى أَنْ نَقُولَ شَيْئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «إيمانكم المتجه نحو الله». والتعبير العربي الطبيعي هو «إيمانكم بالله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: دَوَّتْ
  rationale: يحفظ الصورة السمعية القوية للفعل، أي انطلاق الصوت ورنينه من مصدر، ويعبّر السياق العربي بالفعل الماضي عن الحدث الذي ما زال أثره قائمًا.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: كَلِمَةُ الرَّبِّ
  rationale: صياغة مألوفة وأمينة للتعبير البولسي، وتُبقي الإضافة محتملة الدلالة على الكلمة الصادرة عن الرب أو المتعلقة به.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: مَكِدُونِيَّةَ وَأَخَائِيَةَ
  rationale: نقل صوتي عربي واضح للاسمين الجغرافيين.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: بَلْ ... فِي كُلِّ مَكَانٍ
  rationale: يحفظ المقابلة مع «لا ... فقط» والقوة التوزيعية لعبارة «كل مكان».
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: إِيمَانُكُمْ بِاللهِ
  rationale: «الإيمان بالله» هو التعبير العربي الفصيح الطبيعي، مع توثيق الدلالة الحرفية لحرف الجر اليوناني في الحاشية.
- source_word: ἐξελήλυθεν
  choice: ذَاعَ
  rationale: ينقل معنى خروج خبر إيمانهم وانتشاره الواسع بعبارة عربية طبيعية، من غير إضافة الاسم التفسيري «خبر» إلى المتن.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: حَتَّى لَمْ تَعُدْ بِنَا حَاجَةٌ
  rationale: ينقل نتيجة ما سبق بصياغة عربية سلسة، ويحفظ ضمير المتكلمين.
- source_word: λαλεῖν τι
  choice: أَنْ نَقُولَ شَيْئًا
  rationale: ترجمة عربية اصطلاحية مباشرة من غير إضافة توكيد غير موجود في اليونانية.
theological_decisions:
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: يدل السياق على استجابة أهل تسالونيكي المؤمنة والمتجهة إلى الله، لا على صفة الموثوقية في المقام الأول؛ لذلك «الإيمان» هو الأنسب مع بقاء مجال الكلمة الدلالي معروفًا.
- issue: دلالة الإضافة في τοῦ κυρίου
  choice: كلمة الرب
  alternative: رسالة الرب أو الرسالة عن الرب
  rationale: أُبقي تركيب الإضافة من غير حسم ما إذا كان التركيز على مصدر الكلمة أم موضوعها، حفاظًا على سعة التعبير اليوناني.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على الصورتين: دويّ كلمة الرب وذيوع الإيمان. استُعمل الضبط الجزئي الكامل في نص الآية لتيسير القراءة، ووُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.'
