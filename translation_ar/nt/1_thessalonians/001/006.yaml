lexical_decisions:
- source_word: μιμηταὶ
  choice: مقتدين
  rationale: ينقل معنى محاكاة المثال والاقتداء به، وهو أدق من «تابعين» في هذا السياق.
- source_word: ἐγενήθητε
  choice: صرتم
  rationale: يعكس التحول إلى حال جديدة بصياغة عربية طبيعية.
- source_word: τοῦ κυρίου
  choice: بالرب
  rationale: يحفظ اللقب المسيحاني κύριος، وتتطلب العربية الباء مع «مقتدين».
- source_word: δεξάμενοι
  choice: إذ قبلتم
  rationale: يبين الظرف المصاحب الذي يشرح كيف صاروا مقتدين، من غير إثقال العبارة بتركيب اسمي.
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: يحفظ تعبير بولس وإيحاءه بالكرازة الرسولية، مع أن المقصود هو الرسالة المعلنة.
- source_word: ἐν θλίψει πολλῇ
  choice: وسط ضيق شديد
  rationale: يؤدي معنى الشدة والضغط والمعاناة بلغة عربية واضحة، من دون إيحاء أخروي زائد قد تحمله «الضيقة العظيمة».
- source_word: μετὰ χαρᾶς
  choice: بفرح
  rationale: ترجمة مباشرة وطبيعية لعبارة المصاحبة.
- source_word: πνεύματος ἁγίου
  choice: من الروح القدس
  rationale: يفهم المضاف إليه على أنه دال على المصدر، أي إن الفرح صادر من الروح القدس، مع حفظ البديل الأشد حرفية في الحاشية.
theological_decisions:
- issue: علاقة المضاف إليه في χαρᾶς πνεύματος ἁγίου
  choice: بفرح من الروح القدس
  alternative: بفرح الروح القدس
  rationale: يرجح السياق معنى المصدر، إذ يقابل الضيق الشديد بفرح مصدره الروح القدس؛ لكن اليونانية موجزة وتحتمل إبقاء علاقة الإضافة دون تحديد، ولذلك ذُكر البديل في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة وموقرة. استُعمل «مقتدين» للمحافظة على لغة المحاكاة الصريحة، و«وسط ضيق شديد» لتجنب الأسلوب المتكلف أو الإيحاء الاصطلاحي غير اللازم.
