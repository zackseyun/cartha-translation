base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: ar
  text: وأنتم أيضًا صرتم مقتدين بنا وبالرب، إذ قبلتم الكلمة في ضيق شديد بفرح من الروح القدس[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بفرح الروح القدس».'
