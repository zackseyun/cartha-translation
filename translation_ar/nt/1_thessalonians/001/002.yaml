lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: نشكر
  rationale: فعل مضارع مرفوع بصيغة المتكلم الجمع، و«نشكر» هو المقابل العربي الطبيعي المباشر في صيغة الشكر البولسية، مع بقاء متلقّي الشكر مذكورًا صراحةً.
- source_word: τῷ θεῷ
  choice: الله
  rationale: المجرور اليوناني يعيّن متلقّي الشكر؛ وفي العربية يتعدّى «شكر» إلى الشخص مباشرةً، لذلك لا حاجة إلى حرف جر.
- source_word: πάντοτε
  choice: دائمًا
  rationale: ينقل الدلالة الزمنية بعبارة عربية واضحة ومألوفة.
- source_word: περὶ πάντων ὑμῶν
  choice: من أجل جميعكم
  rationale: تنقل περί مع المضاف إليه هنا بوصفها دالة على مَن يتعلّق بهم الشكر، وتحافظ «جميعكم» على شمول πάντων ὑμῶν.
- source_word: μνείαν ποιούμενοι
  choice: إذ نذكركم
  rationale: هذا التعبير الاصطلاحي يعني ذكر الأشخاص في سياق الصلاة. تصوغ «إذ نذكركم» علاقة اسم الفاعل بالفعل الرئيس بصورة عربية طبيعية، وتجعل المفعول المفهوم من السياق صريحًا.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: في صلواتنا
  rationale: مقابل عربي اصطلاحي واضح لمعنى ذكرهم أثناء الصلاة.
- source_word: ἀδιαλείπτως
  choice: بلا انقطاع
  rationale: يحافظ على قوة معنى الاستمرار والمداومة، مع إبقاء احتمال تعلّقه بذكرهم في الصلاة أو بالشكر الأوسع موضحًا في الحاشية.
