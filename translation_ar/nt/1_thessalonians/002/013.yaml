id: 1TH.2.13
reference: 1 Thessalonians 2:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: ar
  text: ولهذا نشكر الله نحن أيضًا بلا انقطاع، لأنكم حين تسلَّمتم منا كلمة الله التي سمعتموها، قبلتموها لا على أنها كلمة بشر، بل على أنها، كما هي حقًّا، كلمة الله[a]، وهي أيضًا تعمل فيكم أنتم المؤمنين.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسالة الله». ويمكن أيضًا فهم التركيب اليوناني المكثف: «الرسالة من الله التي سمعتموها منا».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا فهم الضمير على أنه يعود إلى الله: «وهو أيضًا يعمل فيكم أنتم المؤمنين».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ولهذا
  rationale: يحفظ الصلة السببية بالسياق السابق بصياغة عربية طبيعية وموجزة.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: نشكر الله ... بلا انقطاع
  rationale: ينقل دلالة الفعل الحاضر واستمرار الشكر من غير إيحاء بأنه فعل لا يتوقف لحظةً حرفيًا.
- source_word: παραλαβόντες
  choice: حين تسلَّمتم
  rationale: «تسلَّمتم» تلائم تلقي ما نقله إليهم المرسلون، وتميّز الفعل عن ἐδέξασθε اللاحق.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: كلمة الله التي سمعتموها منا
  rationale: تفكك التركيب اليوناني المكثف بوضوح، مع إبقاء «كلمة الله» محور المقابلة اللاحقة؛ وتُذكر صياغة «رسالة الله» الممكنة في الحاشية.
- source_word: ἐδέξασθε
  choice: قبلتموها
  rationale: يدل على القبول الإيجابي لا مجرد وصول الكلام إليهم، ويحافظ على التمييز عن «تسلَّمتم».
- source_word: οὐ λόγον ἀνθρώπων
  choice: لا على أنها كلمة بشر
  rationale: «بشر» جنس جمعي طبيعي في العربية المعاصرة، ويحفظ المقابلة النوعية مع «كلمة الله».
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν
  choice: بل على أنها، كما هي حقًّا،
  rationale: يحفظ الاعتراض التوكيدي وقوة ἀληθῶς من غير تسوية التوتر البلاغي.
- source_word: λόγον θεοῦ
  choice: كلمة الله
  rationale: يحافظ على تكرار λόγος وعلى المقابلة الصريحة بين كلام البشر وكلمة الله، من غير توسيع الدعوى اللاهوتية خارج الآية.
- source_word: ὃς καὶ ἐνεργεῖται
  choice: وهي أيضًا تعمل
  rationale: يعيد الضمير إلى «كلمة» بوصفها السابقة الأقرب، وينقل العمل المستمر من دون الإفراط في تحديد دلالة صيغة الفعل الوسطى/المبنية للمجهول.
- source_word: ἐν ὑμῖν τοῖς πιστεύουσιν
  choice: فيكم أنتم المؤمنين
  rationale: صياغة عربية واضحة تحفظ التركيز على المخاطبين المتصفين بالإيمان.
theological_decisions:
- issue: مرجع الضمير الموصول ὃς
  choice: 'إرجاعه إلى «كلمة الله»: «وهي أيضًا تعمل فيكم».'
  alternative: 'إرجاعه إلى الله: «وهو أيضًا يعمل فيكم».'
  rationale: الضمير اليوناني يوافق كلًّا من λόγος وθεός في التذكير والإفراد، لكن «الكلمة» هي السابقة النحوية الأقرب ومحور الجملة؛ حُفظ الاحتمال الآخر في حاشية.
- issue: دلالة «كلمة الله» في الكرازة الرسولية
  choice: إبقاء العبارة «كلمة الله» كما هي في المقابلة مع «كلمة بشر».
  alternative: «رسالة الله».
  rationale: يحافظ ذلك على الثقل البلاغي للنص ودعواه المباشرة، من غير إدخال نظرية أوسع عن الوحي لا تصرّح بها الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تسلَّمتم» ثم «قبلتموها» لإظهار الفرق بين مجرد تلقي الرسالة والترحيب بها وقبولها. وُضعت علامتا الحاشية في المتن، وحُفظ الاحتمال النحوي المتعلق بمرجع الضمير دون حسمه صامتًا.
