  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: ar
  text: إذ يمنعوننا من أن نكلّم الأمم لكي يخلصوا، فيُكملوا بذلك خطاياهم على الدوام. لكن الغضب قد حلّ عليهم أخيرًا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني «أخيرًا» أيضًا: «تمامًا» أو «إلى النهاية»؛ فالعبارة اليونانية تحتمل معنى بلوغ الغاية أو التمام.'
    reason: lexical_alternative
  - marker: b
    text: يرجّح أن «الغضب» يشير إلى دينونة إلهية، لكن بولس لا يحدّد هنا هل يقصد دينونة تاريخية حاضرة، أم الدينونة الأخيرة، أم كلتيهما.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: إذ يمنعوننا
  rationale: اسم فاعل حاضر يواصل وصف الفاعلين في السياق السابق، وصيغة «يمنعوننا» تنقل فعل العرقلة المستمر من غير حصره في منع قانوني.
- source_word: τοῖς ἔθνεσιν
  choice: الأمم
  rationale: يشير اللفظ هنا في الاستعمال البولسي إلى غير اليهود؛ و«الأمم» هو المقابل العربي الكتابي الواضح لهذا المعنى.
- source_word: λαλῆσαι
  choice: أن نكلّم
  rationale: مصدر تابع لفعل المنع، وهذه الصياغة تحفظ معنى الكلام الموجّه إلى الأمم، بينما يبيّن السياق مضمونه التبشيري.
- source_word: ἵνα σωθῶσιν
  choice: لكي يخلصوا
  rationale: تحفظ غرض العبارة وصيغة الفعل المبني للمجهول في اليونانية بمعنى نيل الخلاص، دون تضييق مدلوله اللاهوتي.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: فيملأوا
  rationale: تنقل الصياغة نتيجة السلوك أو غايته السياقية من غير أن تجزم بأن ملء الخطايا كان قصدهم الواعي.
- source_word: ἀναπληρῶσαι
  choice: يملأوا
  rationale: يفيد الفعل بلوغ الامتلاء أو الإكمال. أبقيت الصورة كما هي من غير إضافة «مكيال»، لأنها غير مذكورة صراحة في الأصل.
- source_word: πάντοτε
  choice: دائمًا
  rationale: مقابل مباشر للظرف، ويصف نمطًا مستمرًا من ملء الخطايا.
- source_word: ἔφθασεν
  choice: قد حلّ
  rationale: ينقل وصول الغضب ووقوعه عليهم، مع بقاء أثر الفعل المكتمل حاضرًا.
- source_word: ὀργή
  choice: الغضب
  rationale: يحفظ اللفظ اللاهوتي الثقيل من غير استبداله تفسيرًا بكلمة «الدينونة»؛ والسياق يرجّح الغضب الإلهي.
- source_word: εἰς τέλος
  choice: إلى النهاية
  rationale: ترجمة قريبة تحافظ على غموض العبارة بين معنى الغاية الزمنية ومعنى التمام، وتعرض البدائل في الحاشية.
theological_decisions:
- issue: مرجع الغضب وطبيعته
  choice: الإبقاء على «الغضب» من غير تحديد نوع الدينونة أو زمنها
  alternative: تفسيره بدينونة تاريخية محددة، أو بالدينونة الأخيرة وحدها، أو بكليهما
  rationale: لا يعيّن النص الحدث المقصود، لذلك تحفظ الترجمة التوتر بين الدينونة الحاضرة والأخروية.
- issue: دلالة εἰς τὸ ἀναπληρῶσαι
  choice: صياغة تحتمل النتيجة المترتبة ولا تنسب إليهم قصدًا واعيًا صريحًا
  alternative: «لكي يملأوا خطاياهم» بوصفها غاية مقصودة مباشرة
  rationale: البناء اليوناني قد يفيد الغاية أو النتيجة في هذا السياق؛ وربط الجملة بالفاء يحفظ الصلة من غير حسم زائد.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. روعي قرب الصياغة من ترتيب الأصل، مع إبقاء «الأمم» و«الغضب» بوصفهما مصطلحين كتابيين مفهومين، والحفاظ على غموض «إلى النهاية» وطبيعة الدينونة.
