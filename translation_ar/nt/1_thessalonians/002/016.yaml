revisions:
- from: إذ يمنعوننا من أن نكلّم الأمم لكي يخلصوا، فيملأوا خطاياهم دائمًا. لكن الغضب قد حلّ عليهم إلى النهاية[a][b].
  to: إذ يمنعوننا من أن نكلّم الأمم لكي يخلصوا، فيُكملوا بذلك خطاياهم على الدوام. لكن الغضب قد حلّ عليهم أخيرًا[a][b].
  rationale: استبدلت «إلى النهاية» بـ«أخيرًا» في المتن لأن هذه الصياغة العربية الطبيعية تؤدي القراءة الترجيحية لـ εἰς τέλος، مع إبقاء الاحتمالات الأخرى في الحاشية. وعدّلت جملة الامتلاء إلى «فيُكملوا بذلك خطاياهم على الدوام» لتكون مفهومة في العربية وتحافظ على كونها نتيجة سياقية لا غاية واعية مقررة. لم يُضف تحديدٌ لطبيعة الغضب أو لحدث تاريخي بعينه.
