id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: ar
  text: وهكذا، إذ كنا نشتاق إليكم[a]، سررنا أن نشارككم لا إنجيل الله وحده، بل حياتنا أيضًا[b]، لأنكم صرتم أعزاء علينا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إذ كنا نكنّ لكم مودة عميقة» أو «إذ كنا نتحرّق شوقًا إليكم». الفعل اليوناني نادر ويدل على شوق ومودة شديدين.
    reason: lexical_alternative
  - marker: b
    text: أو «نفوسنا» أو «ذواتنا». والمقصود هنا بذل أنفسهم وحياتهم بذلًا شخصيًا، لا مجرد نقل رسالة إليهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تربط العبارة بما سبق وتدل على الكيفية أو النتيجة، مع بقاء الصلة بصورة العناية الحانية في السياق.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: إذ كنا نشتاق إليكم
  rationale: الفعل اليوناني نادر ويدل على حنين ومودة شديدين. تحافظ «نشتاق إليكم» على القوة العاطفية، و«إذ» تُبقي علاقة اسم الفاعل بالفعل الرئيس مفتوحة دون حصرها في السببية.
- source_word: εὐδοκοῦμεν
  choice: سررنا
  rationale: يفيد الفعل الرضا المقرون بالإرادة والسرور، لا مجرد القبول. استُعمل الماضي انسجامًا مع السرد عن خدمة بولس ورفيقيه بينهم.
- source_word: μεταδοῦναι
  choice: أن نشارككم
  rationale: يدل على إعطاء الآخرين نصيبًا مما لدى المتكلم، ويصلح في العربية لكل من الإنجيل والحياة في التركيب المنسق.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: إنجيل الله
  rationale: يحافظ على الإضافة اليونانية المباشرة وعلى المصطلح المسيحي المألوف في العربية.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: حياتنا
  rationale: تشير ψυχή هنا إلى الحياة أو الذات المبذولة، لا إلى تقرير عن تمايز النفس والجسد. وتؤدي «حياتنا» معنى العطاء الشخصي والتضحية بصورة طبيعية.
- source_word: διότι
  choice: لأن
  rationale: تبيّن سبب استعدادهم لمشاركة حياتهم مع المؤمنين.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: صرتم أعزاء علينا
  rationale: تنقل حالة المحبة التي صاروا إليها لدى بولس ورفيقيه، بعبارة عربية طبيعية ودافئة.
theological_decisions:
- issue: دلالة ψυχάς في وصف عطاء الرسل لأنفسهم
  choice: حياتنا
  alternative: نفوسنا؛ ذواتنا
  rationale: السياق يتحدث عن العطاء الشخصي والتضحية في الرعاية، لا عن تحديد أنثروبولوجي لطبيعة النفس. أُبقيت البدائل الحرفية في الحاشية.
- issue: قوة ἀγαπητοὶ
  choice: أعزاء علينا
  alternative: محبوبين منا
  rationale: تنقل العبارة المودة الشخصية من غير أن تضيف دلالة لاهوتية اصطلاحية ليست هي محور السياق.
- issue: علاقة ὁμειρόμενοι بالفعل الرئيس
  choice: إذ كنا نشتاق إليكم
  alternative: لأننا كنا نشتاق إليكم
  rationale: قد يُفهم اسم الفاعل على أنه حالي أو سببي. تحافظ «إذ» على قدر من الانفتاح ولا تحسم العلاقة في السببية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ودافئة، مع الحفاظ على نبرة الحنان الرسولي. استُخدمت «إذ» لصون شيء من غموض علاقة اسم الفاعل بالفعل الرئيس، ووُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما.
