  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: ar
  text: مع أن في وسعنا، بصفتنا رسل المسيح[a]، أن نكون ذوي ثقل عليكم، فإننا صرنا لطفاء بينكم[b]، كما تعتني الأم المرضعة بأولادها هي بحنان[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أن نكون في ثقل». وقد يُفهم المعنى: أن نكون عبئًا عليكم، أو أن نفرض حقنا أو مطالبنا بوصفنا رسلًا.'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ مخطوطات أخرى: «صرنا أطفالًا بينكم».'
    reason: textual_variant
  - marker: c
    text: 'أو: «كما تعتني المرضعة بأولادها هي»؛ والفعل اليوناني يفيد الرعاية الحانية، وأصله يتصل بالتدفئة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι
  choice: مع أنه كان في وسعنا
  rationale: يؤدي اسم الفاعل معنى الاستدراك التنازلي في ضوء ἀλλά، بصياغة عربية طبيعية.
- source_word: ἐν βάρει εἶναι
  choice: أن نُلقي بثقلنا عليكم
  rationale: يحفظ صورة «الثقل» مع إفادة استعمال المكانة أو السلطة الرسولية، من غير قصر المعنى على العبء المالي.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: بصفتنا رسل المسيح
  rationale: صياغة عربية طبيعية تحفظ علاقة الإضافة، و«المسيح» هو المقابل العربي اللقبي المعتاد لـΧριστός.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: فإننا صرنا
  rationale: يحفظ قوة فعل الصيرورة في ἐγενήθημεν، مع إبراز المقابلة.
- source_word: ἤπιοι
  choice: لطفاء
  rationale: ينقل معنى الرفق والوداعة بلفظ عربي واضح ومألوف.
- source_word: ἐν μέσῳ ὑμῶν
  choice: بينكم
  rationale: مقابل عربي موجز وطبيعي للعبارة المكانية.
- source_word: ὡς ἐὰν τροφὸς
  choice: كما تعتني الأم المرضعة
  rationale: يوضح صورة المرأة التي ترضع الأطفال وترعاهم، وتؤيد الإشارة إلى «أولادها هي» فهمها هنا بوصفها أمًّا مرضعة.
- source_word: θάλπῃ
  choice: تعتني ... بحنان
  rationale: ينقل امتداد معنى الفعل من التدفئة إلى الرعاية الحانية، وهو المقصود في التشبيه.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: بأولادها هي
  rationale: يحفظ التوكيد في الضمير الانعكاسي ἑαυτῆς.
theological_decisions:
- issue: دلالة «الثقل» الرسولي
  choice: أن نُلقي بثقلنا عليكم
  alternative: أن نكون عبئًا عليكم؛ أو أن نفرض عليكم مطالبنا
  rationale: المتن يحفظ الاستعارة واتساعها، فلا يحسم إن كان المقصود العبء المادي أم ممارسة الحق والسلطة الرسوليين.
- issue: قراءة ἤπιοι
  choice: لطفاء
  alternative: أطفالًا
  rationale: اعتمدت ترجمة متن SBLGNT، مع إثبات القراءة النصية المهمة νήπιοι في الحاشية دون حسم التوتر النصي خفية.
- issue: هوية τροφός
  choice: الأم المرضعة
  alternative: المرضعة
  rationale: ذكر «أولادها هي» يرجح الصورة الأمومية، لكن اللفظ اليوناني نفسه يمكن أن يدل على مرضعة؛ لذلك أُثبت البديل في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم التعبير الاصطلاحي «نُلقي بثقلنا» للإبقاء على استعارة النص مع تجنب حصرها في العبء المالي، وجاء التشبيه الأمومي بصياغة مفهومة للقارئ المعاصر.
