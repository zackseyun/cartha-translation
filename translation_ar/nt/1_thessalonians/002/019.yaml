source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: ar
  text: فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا—أفلستم أنتم أيضًا—أمام ربنا يسوع عند مجيئه[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عند حضوره» أو «عند قدومه». يمكن للكلمة اليونانية أن تدل على الحضور أو القدوم؛ وهي تشير في هذا السياق إلى مجيء الرب يسوع مستقبلًا.
    reason: بديل معجمي يحفظ المجال الدلالي لكلمة παρουσία.
lexical_decisions:
- source_word: τίς
  choice: مَن
  rationale: الضمير الاستفهامي يمكن أن يعني «مَن» أو «ما». ولأن جواب السؤال أشخاص، أي المؤمنون المخاطَبون، فإن «مَن» طبيعية في العربية وتحافظ على الصياغة الشخصية في اليونانية.
- source_word: γὰρ
  choice: فـ
  rationale: تحافظ الفاء على الصلة التفسيرية بما سبق من غير إثقال العبارة.
- source_word: ἐλπίς
  choice: رجاؤنا
  rationale: «الرجاء» المقابل العربي المباشر، ويدل هنا على التطلع الواثق.
- source_word: χαρά
  choice: فرحنا
  rationale: ترجمة مباشرة وطبيعية تحفظ القوة الوجدانية للكلمة.
- source_word: στέφανος καυχήσεως
  choice: إكليل افتخارنا
  rationale: «إكليل» يصور إكليل التكريم أو الظفر، و«افتخارنا» تحفظ علاقة الإضافة ودلالة καύχησις من غير تحويلها إلى «فرح».
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: أَلستم أنتم أيضًا؟
  rationale: صيغة النفي الاستفهامي تتوقع جوابًا بالإيجاب، و«أيضًا» تحفظ دلالة καί الممكنة بدل اختزالها إلى مجرد توكيد.
- source_word: ἔμπροσθεν
  choice: أمام
  rationale: تؤدي معنى الوقوف في حضرة شخص بعبارة عربية موجزة وطبيعية.
- source_word: κυρίου
  choice: ربنا
  rationale: «الرب» هو المقابل المعياري لـκύριος في هذا السياق، وضمير الجمع وارد في النص.
- source_word: παρουσίᾳ
  choice: مجيئه
  rationale: في هذا السياق الأخروي تشير الكلمة إلى مجيء الرب يسوع مستقبلًا، مع إبقاء معنى الحضور أو القدوم في الحاشية.
theological_decisions:
- issue: دلالة παρουσίᾳ في السياق الأخروي
  choice: مجيئه
  alternative: حضوره أو قدومه
  rationale: «مجيئه» أوضح في الإشارة السياقية إلى مجيء يسوع مستقبلًا، لكن المجال الدلالي للكلمة يشمل الحضور والقدوم، لذلك حُفظ البديل في الحاشية.
- issue: دلالة καί في οὐχὶ καὶ ὑμεῖς
  choice: أيضًا
  alternative: حقًّا
  rationale: إبقاء «أيضًا» يحفظ احتمال أن المخاطَبين ضمن آخرين هم موضع رجاء بولس وفرحه وافتخاره، بدل حسم καί على أنها أداة توكيد فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبقي الاستفهام البلاغي وتقابُل «الرجاء والفرح وإكليل الافتخار»، وأضيفت «وذلك» لربط عبارة «أمام ربنا يسوع» بالسؤال السابق بوضوح من غير تغيير مضمونه.
