  source_fidelity: المسودة تحفظ الألفاظ الرئيسة ومعنى παρουσία الأخروي، لكنها تفصل عبارة «أمام ربنا يسوع عند مجيئه» عن الاستفهام البلاغي بإضافة «وذلك»، وهي إضافة لا مقابل لها في اليونانية وتنتج تركيبًا غير محكم. كما أن τίς، مع أن جوابه المخاطَبون، يقدّم في هذا التركيب السؤال عن ماهية «رجائنا/فرحنا/إكليل افتخارنا»، ولذلك «ما» أدق من «مَن».
