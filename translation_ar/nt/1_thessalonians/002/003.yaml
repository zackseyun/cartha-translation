lexical_decisions:
- source_word: παράκλησις
  choice: دَعْوَتَنَا
  rationale: تؤدي معنى النداء الجاد الموجَّه إلى السامعين، وتلائم سياق دفاع بولس عن كرازته، مع إبقاء «حثّنا» بديلًا ممكنًا في الحاشية.
- source_word: πλάνης
  choice: ضَلَالٍ
  rationale: يدل اللفظ هنا على الخطأ أو الباطل بوصفه مصدر الدعوة. واختيار «ضلال» طبيعي في العربية ويحافظ على تمييزه من δόλος الذي يدل بوضوح أكبر على الخداع المتعمد.
- source_word: ἀκαθαρσίας
  choice: نَجَاسَةٍ
  rationale: يحافظ على الاتساع الأخلاقي للفظ اليوناني من غير قصره على النجاسة الجنسية، إذ لا يحدد السياق هنا نوعها.
- source_word: δόλῳ
  choice: بِخِدَاعٍ
  rationale: ينقل معنى المكر المتعمد، كما تعكس الباء دلالة ἐν على الكيفية أو الوسيلة.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: تَنْبَعُ مِنْ ... وَلَا مِنْ ... وَلَا نُقَدِّمُهَا بِـ...
  rationale: يميّز بين المصدر في ἐκ/ἐξ والكيفية في ἐν، مع صياغة عربية واضحة وطبيعية.
- source_word: γὰρ
  choice: فَإِنَّ
  rationale: تحفظ الصلة التفسيرية بما سبق وتأتي بأسلوب عربي فصيح طبيعي.
theological_decisions:
- issue: مدى دلالة ἀκαθαρσία في نفي بولس
  choice: إبقاء اللفظ عامًا بصيغة «نجاسة»
  alternative: نجاسة جنسية
  rationale: قد يحمل اللفظ إيحاءً جنسيًا في بعض الاستعمالات البولسية، لكن الآية لا تخصصه؛ لذلك تتجنب الترجمة إدخال اتهام أضيق مما يقوله النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على التمييز بين مصدر الدعوة («من») وكيفية تقديمها («بـ»)، وعلى التكرار الثلاثي في نفي بولس من غير تضييق دلالة «نجاسة».
