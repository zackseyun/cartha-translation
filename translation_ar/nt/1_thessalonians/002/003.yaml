revisions:
- from: فَإِنَّ دَعْوَتَنَا[a] لَا تَنْبَعُ مِنْ ضَلَالٍ[b] وَلَا مِنْ نَجَاسَةٍ، وَلَا نُقَدِّمُهَا بِخِدَاعٍ.
  to: فَإِنَّ دَعْوَتَنَا[a] لَيْسَتْ نَابِعَةً مِنْ ضَلَالٍ[b] وَلَا مِنْ نَجَاسَةٍ، وَلَا مَشُوبَةً بِخِدَاعٍ.
  rationale: أزيلت الإضافة التفسيرية «نقدمها» كي يظل موضوع النفي الثلاثي هو «دعوتنا» كما في الأصل. وتؤدي «مشوبة بخداع» دلالة ἐν δόλῳ على الكيفية/الملابسة في عربية طبيعية، من غير تسوية بينها وبين دلالة المصدر في «من ضلال» و«من نجاسة». أُبقيت الحواشي وعلاماتها في مواضعها، إذ تعرض بدائل معجمية مشروعة ولا تفرض تخصيصًا عقائديًا أو أخلاقيًا غير مذكور في النص.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:53Z'
