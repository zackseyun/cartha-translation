  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: ar
  text: فَإِنَّكُمْ أَنْتُمْ تَعْلَمُونَ، أَيُّهَا الْإِخْوَةُ[a]، أَنَّ مَجِيئَنَا إِلَيْكُمْ لَمْ يَكُنْ بِلا جَدْوَى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فالنص اليوناني يقول حرفيًا «الإخوة»، وكثيرًا ما تستعمل صيغة المذكر لمخاطبة جماعة المؤمنين كلها.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: أنتم
  rationale: أُبقي ضمير الفصل للتوكيد، فيحفظ معنى معرفة أهل تسالونيكي الشخصية المباشرة دون إثقال العبارة.
- source_word: γὰρ
  choice: فإنَّ
  rationale: تربط العبارة بما قبلها بوصفها تعليلًا أو تأييدًا، وهي وصلة عربية طبيعية في السياق الحجاجي.
- source_word: οἴδατε
  choice: تعلمون
  rationale: الفعل اليوناني، مع كونه تامّ الصيغة، يؤدي هنا معنى حاضرًا؛ و«تعلمون» ترجمة عربية مباشرة وطبيعية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ صيغة النداء المذكرة في الأصل، مع بيان شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: τὴν εἴσοδον ἡμῶν
  choice: مجيئنا
  rationale: المقصود دخول بولس ورفيقيه ووصولهم إلى أهل تسالونيكي؛ و«مجيئنا» أوضح في العربية المعاصرة من «دخولنا» هنا.
- source_word: τὴν πρὸς ὑμᾶς
  choice: إليكم
  rationale: تنقل اتجاه المجيء نحو المخاطبين مباشرة، من غير تحويله تفسيريًا إلى «بينكم».
- source_word: ὅτι
  choice: أنَّ
  rationale: تُدخل مضمون ما يعلمه المخاطبون.
- source_word: οὐ κενὴ γέγονεν
  choice: لم يكن باطلًا
  rationale: ينقل وصف المجيء بأنه لم يكن فارغًا أو عديم الجدوى، مع الحفاظ على قدر من الاتساع بين معنى عدم الخواء وعدم العبث.
theological_decisions:
- issue: مدلول ἀδελφοί عند مخاطبة جماعة قد تضم رجالًا ونساءً
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: حُفظت الصيغة المذكرة الواردة في النص، ولم يُحسم مدلولها الاجتماعي داخل المتن؛ وتوضح الحاشية أن الاستعمال قد يشمل جماعة المؤمنين كلها.
- issue: مدلول κενή في تقويم مجيء الرسل
  choice: باطلًا
  alternative: بلا ثمر / فارغًا
  rationale: «باطلًا» تحافظ على اتساع العبارة لتشمل انعدام الجدوى أو الخواء، بدل قصرها على الثمر العملي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فإنكم أنتم» لإظهار توكيد Αὐτοὶ مع إبقاء الربط التعليلي، ووُضعت علامة الحاشية بعد لفظ «الإخوة» مباشرة.
