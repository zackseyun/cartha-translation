  text: For you are our glory and joy[a].
translation:
  language: ar
  text: فأنتم مجدُنا وفرحُنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فخرُنا» أو «كرامتُنا» بدلًا من «مجدُنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: أنتم
  rationale: ضمير مخاطب للجمع، وقد أُثبت في اليونانية للتوكيد؛ وإظهاره في العربية يحفظ هذا التوكيد بصورة طبيعية.
- source_word: γάρ
  choice: فـ
  rationale: تفيد تعليل ما سبق أو تفسيره، والفاء هنا تربط الجملة بسياقها بإيجاز ووضوح.
- source_word: ἐστε
  choice: أنتم ... ـنا
  rationale: فعل الكينونة في المضارع لا يُذكر عادةً في الجملة الاسمية العربية، ويؤديه تركيب «أنتم مجدنا وفرحنا» طبيعيًا.
- source_word: ἡ δόξα ἡμῶν
  choice: مجدُنا
  rationale: «مجد» يقابل δόξα مباشرةً ويحفظ سعته الدلالية وقوته البلاغية، مع إمكان فهمه هنا بمعنى موضع الفخر أو الكرامة.
- source_word: καὶ ἡ χαρά
  choice: وفرحُنا
  rationale: «فرح» هو المقابل الاسمي المباشر لـχαρά، ويحافظ على الموازاة بين «مجدنا» و«فرحنا».
theological_decisions:
- issue: دلالة δόξα في وصف علاقة الرسل بالمؤمنين
  choice: مجدنا
  alternative: فخرنا أو كرامتنا
  rationale: يحفظ «مجدنا» اللفظ اليوناني الأوسع وثقله البلاغي من غير حصر المعنى في التباهي أو تفسيره تفسيرًا أضيق، بينما توضح الحاشية البدائل الممكنة في هذا السياق.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ومهيبة. استُخدمت الجملة الاسمية الطبيعية، وأُظهر ضمير الجمع «أنتم» للمحافظة على التوكيد في الأصل.
