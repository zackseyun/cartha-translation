translation:
  language: ar
  text: كما تعلمون، عاملنا كلَّ واحدٍ منكم كما يعامل الأب أولاده.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، أقرب إلى الحرفية: «كما تعلمون كيف [عاملنا] كلَّ واحدٍ منكم، كما [يعامل] الأب أولاده». العبارة اليونانية موجزة وناقصة الفعل في النص الوارد؛ ويُستكمل معناها من الجملة المحيطة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: كما
  rationale: تُدخل أداةُ التشبيه استنادًا إلى معرفة أهل تسالونيكي بسلوك الرسل، و«كما» تؤدي هذه القوة بوضوح وطبيعية.
- source_word: οἴδατε
  choice: تعلمون
  rationale: 'مع أن الصيغة تامة من حيث البناء، فإن معناها هنا حاضر: «تعلمون».'
- source_word: ὡς (الأولى)
  choice: أننا
  rationale: تُدخل مضمون ما يعرفه المخاطبون، ومع استكمال الفعل المحذوف من السياق تصبح «أننا» صياغة عربية طبيعية.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: كلَّ واحد منكم
  rationale: تحفظ التوكيد التوزيعي والاهتمام بكل فرد على حدة.
- source_word: ὡς (الثانية)
  choice: كما
  rationale: تُبيّن المقارنة بين معاملة الرسل ومعاملة الأب لأولاده.
- source_word: πατὴρ
  choice: الأب
  rationale: المقصود أب في صورة تشبيهية عامة؛ والتعريف الجنسي في العربية طبيعي في قولنا «كما يعامل الأب».
- source_word: τέκνα
  choice: أولاده
  rationale: لفظ شامل للأبناء والبنات، ويحفظ الصورة العائلية في عربية واضحة.
- source_word: ἑαυτοῦ
  choice: أولاده
  rationale: الإضافة إلى الضمير تُظهر أنهم أولاد الأب نفسه، فتحفظ دلالة الضمير الانعكاسي من غير إثقال بعبارة غير طبيعية.
- source_word: '[الفكرة الفعلية المحذوفة المفهومة من السياق]'
  choice: عاملنا / يعامل
  rationale: العبارة اليونانية ناقصة نحويًا وتعتمد على السياق المحيط. يوفّر «عاملنا» معنى عامًا لا يحصر الأفعال الرعوية المتعددة في فعل واحد بعينه، ويُعاد الفعل في طرف التشبيه لسلامة العربية.
theological_decisions:
- issue: استكمال الفعل المضمر في العبارة اليونانية الناقصة
  choice: 'استعمال فعل عام: «عاملنا كلَّ واحد منكم كما يعامل الأب أولاده»'
  alternative: 'إبقاء العبارة أقرب إلى تركيبها الناقص: «كما تعلمون كيف كل واحد منكم، كأب أولاده»؛ أو تخصيص الفعل بـ«وعظنا»'
  rationale: لا تستقيم العبارة مستقلةً في العربية من غير استكمال معناها من السياق. والفعل العام يحفظ صورة الأبوة ولا يرجّح واحدًا فقط من الأفعال الرعوية الواردة في الجملة الأوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «عاملنا» لإظهار المعنى المضمر دون تضييقه، و«كلَّ واحد منكم» للمحافظة على التوكيد الفردي. وُضعت علامة الحاشية بعد العبارة التي تشرحها.
