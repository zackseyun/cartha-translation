  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: ar
  text: لِأَنَّنَا أَرَدْنَا أَنْ نَأْتِيَ إِلَيْكُمْ—أَنَا، بُولُسُ، أَكْثَرَ مِنْ مَرَّةٍ[a]—لَكِنَّ الشَّيْطَانَ عَاقَنَا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «مرةً ومرتين»، وهو تعبير اصطلاحي يعني «أكثر من مرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: لِأَنَّنَا
  rationale: تُدخل تعليلًا للكلام السابق، و«لأن» تنقل القوة السببية بوضوح في العربية.
- source_word: ἠθελήσαμεν
  choice: أَرَدْنَا
  rationale: تنقل معنى الإرادة والرغبة بصياغة عربية طبيعية دون تحويلها إلى مجرد نية غير منفذة.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: أَنْ نَأْتِيَ إِلَيْكُمْ
  rationale: تحافظ على معنى الحركة نحو المخاطَبين دون إضافة معنى «نزوركم» أو «نعود إليكم» صراحةً.
- source_word: ἐγὼ μὲν Παῦλος
  choice: وَأَنَا بُولُسُ خَاصَّةً
  rationale: تُبرز بولس من ضمن ضمير الجمع «نحن»، كما يفعل التركيب اليوناني، من غير افتراض مقابل غير مذكور لأداة μέν.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: أَكْثَرَ مِنْ مَرَّةٍ[a]
  rationale: تنقل المعنى الاصطلاحي بوضوح، مع حفظ الصيغة الحرفية «مرة ومرتين» في الحاشية.
- source_word: ἐνέκοψεν
  choice: عَاقَنَا
  rationale: تفيد وضع عائق في الطريق وعرقلة المضي، من غير تشديد المعنى إلى تقرير حتمية مطلقة تتجاوز اللفظ.
- source_word: ὁ Σατανᾶς
  choice: الشَّيْطَانُ
  rationale: هو المقابل العربي الكتابي الشائع للاسم/اللقب الشخصي، ويحفظ الإسناد المباشر إليه.
theological_decisions:
- issue: فاعلية الشيطان في عرقلة سفر بولس
  choice: لَكِنَّ الشَّيْطَانَ عَاقَنَا
  alternative: لكن الخصم منعنا
  rationale: ينسب النص العرقلة صراحةً إلى الشيطان بوصفه فاعلًا شخصيًا؛ وتحفظ «عاقنا» هذا الإسناد من غير تلطيفه إلى ظروف مجهولة أو تقويته إلى حتمية مطلقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت الشرطتان الاعتراضيتان لإبراز انتقال بولس من الجمع «أردنا» إلى تخصيص نفسه، ووُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرةً.
