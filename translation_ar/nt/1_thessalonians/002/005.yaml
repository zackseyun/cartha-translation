id: 1TH.2.5
reference: 1 Thessalonians 2:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: ar
  text: فإننا لم نأتِ قط بكلام تملُّق[a]، كما تعلمون، ولا بذريعةٍ للطمع[b]—الله شاهد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بتملُّق»؛ وحرفيًا: «في كلام تملُّق».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بستارٍ للطمع» أو «بتظاهرٍ يخفي الجشع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: فإننا لم نأتِ قط
  rationale: تربط «فإننا» الكلام بالدفاع السابق، ويعبّر «لم... قط» طبيعيًا وبقوة عن النفي الزمني الذي تفيده οὔτε مع ποτέ.
- source_word: ἐν λόγῳ κολακείας
  choice: بكلام تملُّق
  rationale: يفيد λόγος هنا الكلام لا كلمة مفردة، وتدل κολακεία على التملق؛ والباء تنقل الدلالة الوسيلية لـἐν بعبارة عربية طبيعية.
- source_word: ἐγενήθημεν
  choice: نأتِ
  rationale: في سياق زيارة المرسلين، يدل الفعل على الكيفية التي جاؤوا أو ظهروا بها بينهم، و«نأتِ» تلائم السياق من غير تحميل الفعل معنى أوسع.
- source_word: καθὼς οἴδατε
  choice: كما تعلمون
  rationale: صياغة مباشرة تحفظ احتجاج بولس بمعرفة المخاطَبين أنفسهم لسلوكه.
- source_word: ἐν προφάσει πλεονεξίας
  choice: بذريعةٍ للطمع
  rationale: تدل πρόφασις على الذريعة أو التظاهر الذي يستر الدافع الحقيقي، وتدل πλεονεξία هنا على الرغبة الجشعة في الاقتناء؛ و«الطمع» واضحة وشائعة في العربية المعاصرة.
- source_word: θεὸς μάρτυς
  choice: الله شاهد
  rationale: تحفظ العبارة الموجزة نداء الله شاهدًا على الدوافع الباطنة، ولا تضيف ضمير ملكية غير مصرّح به في اليونانية.
theological_decisions:
- issue: نطاق نفي بولس من جهة الأسلوب والدافع
  choice: تنفي الآية التملق في الكلام والطمع المستتر وراء ذريعة، من غير توسيعها إلى رفض كل بلاغة أو حصر الطمع في الاستغلال المالي وحده.
  alternative: اعتبارها إدانة لكل تنميق بلاغي، أو قصرها حصريًا على تحصيل المال.
  rationale: يسمي النص تحديدًا κολακεία وπλεονεξία؛ لذلك تُحفظ التهمتان المعيّنتان من غير إدخال دعوى عقائدية أوسع أو تضييق دلالة الطمع المحتملة.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وموقرة. اختير «لم نأتِ قط» لمواءمة سياق الزيارة، و«ذريعة» لإبراز معنى التظاهر أو الغطاء، مع إبقاء العبارة الختامية موجزة وقوية: «الله شاهد».'
