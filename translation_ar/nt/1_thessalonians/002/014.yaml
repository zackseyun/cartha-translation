source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: ar
  text: فإنكم، أيها الإخوة، صرتم متمثلين بكنائس الله التي في اليهودية في المسيح يسوع، لأنكم أنتم أيضًا عانيتم الأمور نفسها على أيدي أبناء قومكم، كما عانته تلك الكنائس أيضًا على أيدي اليهود.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة اللفظ اليوناني: «أهل اليهودية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: صرتم متمثلين بـ
  rationale: يحفظ معنى الصيرورة الوارد في ἐγενήθητε ومعنى الاقتداء الصريح في μιμηταί، بصياغة عربية طبيعية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: ترجمة مباشرة لصيغة النداء الجمع، وهي في سياق الرسالة خطاب للجماعة كلها.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: كنائس الله
  rationale: «كنائس» هي العبارة العربية المألوفة والملائمة للجماعات المؤمنة في رسائل بولس.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: التي في اليهودية
  rationale: تنقل الوصف الجغرافي المقيد بإيجاز ووضوح.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» في العربية ينقل اللقب Χριστός بصورة طبيعية ومفهومة، مع إبقاء العبارة البولسية كما هي.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: عانيتم الأمور نفسها
  rationale: ينقل فعل πάσχω بوصفه معاناة، ويحفظ المقارنة المباشرة التي تدل عليها τὰ αὐτά.
- source_word: ὑπὸ τῶν ἰδίων συμφυλετῶν
  choice: على أيدي أبناء قومكم
  rationale: يعبر عن أفراد الجماعة القومية أو الشعبية نفسها، ويحفظ قوة ἰδίων من خلال ضمير المخاطبين.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: على أيدي اليهود
  rationale: ترجمة مباشرة للفظ Ἰουδαίων في هذا السياق، من غير تعميم للمرجع على جميع اليهود.
theological_decisions:
- issue: 'دلالة Χριστός: لقب أم صيغة اسمية ثابتة'
  choice: المسيح يسوع
  alternative: يسوع المسيح / المسيّا يسوع
  rationale: يحفظ ترتيب النص اليوناني ودلالة اللقب، و«المسيح» هو المقابل العربي الراسخ والطبيعي لـΧριστός.
- issue: نطاق مدلول «اليهود»
  choice: الإبقاء على «اليهود» مع حاشية توضح الاحتمال الجغرافي وعدم التعميم
  alternative: أهل اليهودية
  rationale: اللفظ اليوناني يحتمل المعنى الإثني الديني أو الجغرافي؛ يبقي المتن المقابل المباشر، وتحفظ الحاشية الغموض الحقيقي وتمنع فهمه على أنه يشمل كل اليهود بلا استثناء.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فإنكم» لربط γάρ بما قبله، و«على أيدي» للتعبير الطبيعي عن فاعل المعاناة. وُضع ضمير «هي» عائدًا إلى الكنائس بوصفها جمعًا لغير العاقل في الاستعمال العربي.
