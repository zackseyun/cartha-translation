review_pass:
  verdict: revise
  source_fidelity: 'المتن ينقل البنية الأساسية للنص اليوناني بأمانة: الصيرورة إلى الاقتداء، والكنائس الموجودة في اليهودية في المسيح يسوع، والمعاناة المماثلة من أبناء القوم ومن اليهود. لكن الحاشية الحالية تضيف وصف «اضطهدوا» وتقريرًا تفسيريًا عن المقصود لا يصرح به هذا العدد نفسه؛ والأفضل أن تحفظ البديل المعجمي وحده.'
  naturalness: العربية فصيحة وواضحة عمومًا. واستبدال الضمير المفرد «هي» بعبارة صريحة عن الكنائس يجعل طرف المقارنة أوضح وأيسر، ويعيد مفعول «عانى» في الشطر الأخير.
  terminology: «المسيح يسوع»، و«كنائس الله»، و«أبناء قومكم»، و«اليهود» مقابلات سليمة وطبيعية. و«أهل اليهودية» بديل معجمي مناسب في الحاشية لـἸουδαίων، من دون فرض أحد المعنيين في المتن أو الحاشية.
  issues:
  - severity: medium
    issue: الحاشية تتجاوز بيان البديل المعجمي إلى تفسير غير مصرح به في الآية.
    rationale: قولها «الذين اضطهدوا كنائس الله هناك» يضيف فعل الاضطهاد، في حين يذكر النص المعاناة فقط. كما أن عبارة «المقصود» تحسم مرجعًا ينبغي أن يظل محتملًا بين «اليهود» و«أهل اليهودية».
  - severity: low
    issue: مرجع الضمير في «كما عانت هي أيضًا» أقل وضوحًا من اللازم.
    rationale: يجوز نحويًا عود الضمير المفرد المؤنث إلى جمع غير العاقل «الكنائس»، لكنه يضعف وضوح المقارنة. التصريح بـ«تلك الكنائس» أوضح ويحفظ المعنى نفسه.
  revised_text: فإنكم، أيها الإخوة، صرتم متمثلين بكنائس الله التي في اليهودية في المسيح يسوع، لأنكم أنتم أيضًا عانيتم الأمور نفسها على أيدي أبناء قومكم، كما عانته تلك الكنائس أيضًا على أيدي اليهود.[a]
