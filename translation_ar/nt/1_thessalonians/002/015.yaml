id: 1TH.2.15
reference: 1 Thessalonians 2:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: ar
  text: الذين قتلوا أيضًا الرب يسوع والأنبياء[a]، وطردونا[b]، ولا يرضون الله، ويعادون جميع الناس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أماتوا الرب يسوع».'
    reason: lexical_alternative
  - marker: b
    text: أي إنهم «أخرجونا» أو «أبعدونا»؛ فالفعل أخص من المعنى العام للاضطهاد.
    reason: lexical_alternative
  - marker: c
    text: يستمر هذا الوصف نحويًا في الحديث عن الجماعة المذكورة في الآية السابقة؛ فلا ينبغي فهمه على أنه حكم شامل على جميع اليهود في كل زمان ومكان.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: قتلوا
  rationale: ينقل معنى القتل أو الإماتة مباشرة، من غير إضافة دلالة «الاغتيال» أو حكم على الدافع لا يصرّح به الفعل.
- source_word: τὸν κύριον Ἰησοῦν
  choice: الرب يسوع
  rationale: يحافظ على «الرب» بوصفه لقبًا للمسيح، مع الصيغة العربية المألوفة للاسم يسوع.
- source_word: τοὺς προφήτας
  choice: الأنبياء
  rationale: ترجمة معيارية تحافظ على أداة التعريف، إذ يُرجَّح أن المقصود سلسلة الأنبياء المعروفة.
- source_word: ἐκδιωξάντων
  choice: طردونا
  rationale: الفعل أخص من الاضطهاد العام، ويدل على الإخراج أو الطرد.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: لا يرضون الله
  rationale: صياغة عربية طبيعية تحفظ دلالة المضارع المستمرة وعلاقة الفعل بالله.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: يعادون جميع الناس
  rationale: تنقل معنى المعارضة ذات الطابع العدائي بعبارة عربية واضحة، من غير تخفيفها إلى مجرد الاختلاف.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: الذين قتلوا ... وطردونا ... ولا يرضون ... ويعادون
  rationale: تحوّل سلسلة اسم الفاعل اليونانية إلى صلة موصول طبيعية في العربية، مع إبقاء اتصالها النحوي بمرجع الآية السابقة والقوة التراكمية للعبارات.
- source_word: καὶ
  choice: أيضًا / و
  rationale: تُرجمت الأولى بـ«أيضًا» لإبراز الإضافة، وحُفظت سائر الروابط بالواو لتتابع الاتهامات.
theological_decisions:
- issue: مرجع سلسلة الأوصاف
  choice: تستمر الآية في وصف الجماعة المذكورة في الآية السابقة، من غير تعميم القول على جميع اليهود في كل زمان ومكان.
  alternative: اعتبار الكلام إدانة عامة لكل اليهود في جميع الأزمنة.
  rationale: أداة التعريف مع سلسلة أسماء الفاعلين في صيغة المضاف إليه تربط الكلام نحويًا بمرجع الآية السابقة. وتحافظ «الذين» على هذا الاتصال من غير توسيع نطاق القول.
- issue: دلالة «الرب» في «الرب يسوع»
  choice: الإبقاء على اللقب المسيحاني «الرب».
  alternative: ترجمته بمعنى «السيد» أو «المعلّم».
  rationale: κύριος هنا لقب ليسوع، وترجمته بـ«الرب» تحفظ ثقله في هذا السياق من غير إضافة تفسير عقائدي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُخدمت الأفعال المباشرة بدل التراكيب الاسمية الثقيلة، مع الحفاظ على صلة الموصول التي تربط الآية بسياقها السابق وعلى التتابع البلاغي للاتهامات.
