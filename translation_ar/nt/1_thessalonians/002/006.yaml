source:
  edition: SBLGNT
  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: ar
  text: ولا نطلب مجدًا من الناس[a]، لا منكم ولا من غيركم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كرامة» أو «ثناء» بدلًا من «مجد».
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: نطلب
  rationale: اسم الفاعل المضارع مرتبط بسياق الجملة السابقة، وصيغة «نطلب» العربية تنقل الاستمرار بوضوح من غير أن تضيف حكمًا على الدافع.
- source_word: ἐξ ἀνθρώπων
  choice: من الناس
  rationale: اللفظ اليوناني عام يشمل البشر، و«الناس» تعبير عربي طبيعي لا يحصر المعنى في الذكور.
- source_word: δόξαν
  choice: مجدًا
  rationale: يحافظ «مجد» على الصلة المعجمية الواسعة للمصطلح في العهد الجديد، مع أن السياق هنا يدل على التقدير أو الثناء البشري.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ولا ... لا ... ولا
  rationale: تحافظ هذه الصياغة على سلسلة النفي، وتصل العبارة بما قبلها، ثم تعرض التقابل الداخلي بين المخاطَبين وغيرهم بصورة عربية سليمة.
- source_word: ἀφ’ ὑμῶν
  choice: منكم
  rationale: نقل مباشر وموجز لضمير المخاطبين الجمع.
- source_word: ἀπ’ ἄλλων
  choice: من غيركم
  rationale: يوضح في العربية أن المقصود أناس آخرون غير المخاطَبين، من دون إضافة غير موجودة في النص.
theological_decisions:
- issue: طبيعة المجد المطلوب
  choice: مجد بشري صادر من الناس
  alternative: كرامة بشرية أو ثناء بشري
  rationale: تحدد عبارة «من الناس» مصدر المجد بوضوح، فلا يُفهم أنه مجد الله، مع إبقاء المجال الدلالي للمصطلح اليوناني مفتوحًا على الكرامة والثناء.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. أُبقيت الفاصلة الختامية لأن العبارة جزء من جملة ممتدة في السياق، ووُضع مؤشر الحاشية بعد «الناس» كما يقتضي موضع البديل المعجمي.
