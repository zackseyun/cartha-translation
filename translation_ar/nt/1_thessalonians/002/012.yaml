translation:
  language: ar
  text: مشجّعين إياكم، ومعزّين، ومناشدين أن تسلكوا بما يليق بالله، الذي يدعوكم إلى ملكوته ومجده الخاصَّين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الأفعال الثلاثة: «حاثّين إياكم، ومواسِين، ومؤكّدين لكم بشدة». وهي تصف جوانب متداخلة من التشجيع والتعزية والمناشدة الجادّة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: مشجّعين
  rationale: ينقل معنى الحثّ المشجّع في سياق الخدمة الأبوية، مع بقاء «حاثّين» احتمالًا معجميًا صحيحًا.
- source_word: παραμυθούμενοι
  choice: ومعزّين
  rationale: يحفظ دلالة الكلام الذي يواسي ويشدّد القلب، ويميّزه بقدر ممكن عن الفعل السابق.
- source_word: μαρτυρόμενοι
  choice: ومناشدين
  rationale: ينقل قوة الالتماس الجادّ والتوكيد الأخلاقي هنا دون أن يوهم بأن المقصود مجرد أداء شهادة قضائية.
- source_word: εἰς τὸ περιπατεῖν
  choice: أن تسلكوا سلوكًا
  rationale: يحافظ على استعارة السير الكتابية، ويجعل معناها المتعلق بنمط الحياة واضحًا في العربية المعاصرة.
- source_word: ἀξίως τοῦ θεοῦ
  choice: يليق بالله
  rationale: صياغة عربية طبيعية للتركيب الدال على السلوك الجدير بالله، من غير إضافة معنى غير موجود في النص.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: الذي يدعوكم
  rationale: يحفظ زمن اسم الفاعل الحاضر ولا يحسم الدعوة بوصفها حدثًا ماضيًا فقط.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: إلى ملكوته ومجده الخاصَّين
  rationale: يحفظ توكيد ἑαυτοῦ، ويُبقي الملكوت والمجد متعاطفين تحت حرف جر واحد.
theological_decisions:
- issue: هل تُحفظ استعارة περιπατεῖν أم تُفسَّر بمعنى العيش؟
  choice: أن تسلكوا سلوكًا
  alternative: أن تعيشوا / أن تتصرفوا
  rationale: تحفظ الصياغة الاستعارة الكتابية وتوضح في الوقت نفسه أنها تشير إلى نهج الحياة.
- issue: القوة الزمنية واللاهوتية في τοῦ καλοῦντος ὑμᾶς
  choice: الذي يدعوكم
  alternative: الذي دعاكم / الذي لا يزال يدعوكم
  rationale: المضارع العربي يقابل اسم الفاعل الحاضر بصورة طبيعية، من غير فرض موقف بشأن توقيت الدعوة أو آليتها.
- issue: دلالة μαρτυρόμενοι في ثلاثية الخدمة الأبوية
  choice: مناشدين
  alternative: شاهدين لكم / مؤكّدين لكم / مستحلفين
  rationale: «مناشدين» تحافظ على الجدية والإلحاح، بينما قد تجعل «شاهدين» العبارة غامضة، وقد تزيد «مستحلفين» قوة ليست لازمة.
