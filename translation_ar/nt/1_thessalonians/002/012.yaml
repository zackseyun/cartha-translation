  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم الجمع للمخاطَبين، وحُفظ الإيقاع الثلاثي للأفعال، مع توضيح استعارة السير بعبارة «تسلكوا سلوكًا».
