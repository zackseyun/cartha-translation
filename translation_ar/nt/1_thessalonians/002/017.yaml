  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: ar
  text: أمّا نحن، أيها الإخوة[b]، فبعد أن انتُزعنا منكم[a] وقتًا قصيرًا—بالوجه لا بالقلب—بذلنا جهدًا أكبر لنرى وجوهكم، بشوق عظيم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بعد أن صرنا كالأيتام بعيدًا عنكم»؛ تستخدم اليونانية صورة حية للفقد لتصف ألم الانفصال.'
    reason: lexical_alternative
  - marker: b
    text: «الإخوة» هي صيغة بولس في المخاطبة، ويُرجَّح في هذا السياق أنها تشمل جماعة المؤمنين كلها، بمن فيهم النساء.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: أمّا نحن
  rationale: تنقل الضمير المؤكد والانتقال المقترن بمقابلة خفيفة، بصياغة عربية طبيعية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحافظ على صيغة النداء المذكرة في اليونانية، مع بيان شمول الجماعة المؤمنة في الحاشية.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: بعد أن انتُزعنا منكم
  rationale: تنقل ألم الانفصال وقسره بلغة عربية واضحة؛ وتُذكر صورة اليُتم/الفقد الأصلية في الحاشية.
- source_word: πρὸς καιρὸν ὥρας
  choice: وقتًا قصيرًا
  rationale: التركيب يدل اصطلاحيًا على مدة وجيزة، لا بالضرورة على ساعة حرفية.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: بالوجه لا بالقلب
  rationale: تحافظ على تقابل الوجه والقلب وصورته البلاغية دون تحويل «الوجه» إلى مجرد تفسير مثل «الحضور الجسدي».
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: ازددنا اجتهادًا كثيرًا
  rationale: يجمع بين معنى الازدياد في περισσοτέρως ودلالة σπουδάζω على الجِدّ وبذل المسعى، بدل اختزاله في الشعور بالحماسة وحده.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: أن نرى وجوهكم
  rationale: يحفظ التعبير الحرفي الشخصي «رؤية الوجه» ويراعي مطابقة العربية للجمع المخاطب.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: بشوق عظيم
  rationale: ينقل الرغبة العاطفية القوية في هذا السياق الإيجابي بعبارة عربية طبيعية.
theological_decisions:
- issue: مدى شمول النداء ἀδελφοί
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: أُبقيت الصيغة المذكرة الظاهرة في الأصل، مع توضيح أن الاستعمال في السياق يُرجَّح أن يشمل جماعة المؤمنين كلها، بمن فيها النساء.
- issue: قوة معنى σπουδάζω
  choice: ازددنا اجتهادًا كثيرًا
  alternative: اشتقنا بالأكثر
  rationale: يحفظ الاختيار عنصر الجِدّ والسعي الموجود في الفعل، مع إبقاء الشوق العاطفي في العبارة اللاحقة، فلا يُدمج المعنيان في معنى واحد.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كريمة. حُفظت صورتا «الوجه» و«القلب» والتكرار المقصود للوجه، مع تجنب الصياغة المذهبية أو التفسير الزائد.
