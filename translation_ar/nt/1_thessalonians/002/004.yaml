  source_fidelity: 'المسودة تلتقط المعنى العام بدقة: الله هو الذي اختبر/أقرّ الرسل ثم ائتمنهم على الإنجيل، وكلامهم موجَّه لإرضائه لا لإرضاء الناس، وهو الفاحص المستمر للقلوب. لكن افتتاحية «كما اختبرنا اللهُ ورآنا أهلًا» تحتاج ضبطًا تركيبيًا، كما أن «بل اللهَ» لا تستقيم في العربية الفصحى المعاصرة بوصفها مقابلة مكتملة من دون إعادة الفعل المحذوف.'
