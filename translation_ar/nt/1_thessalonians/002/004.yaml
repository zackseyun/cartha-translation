base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: ar
  text: 'بل كما اختبرنا اللهُ وأثبت أهليتنا لأن يعهد إلينا بالإنجيل، هكذا نتكلم: لا نسعى إلى إرضاء الناس، بل إلى إرضاء الله الذي يختبر قلوبنا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لا كمن يُرضون الناس، بل الله». فالنص اليوناني موجز، ويذكر فعل «الإرضاء» صراحة في الطرف الأول من المقابلة فقط.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: اختبرنا اللهُ ورآنا أهلًا
  rationale: صيغة التام المبني للمجهول تدل على اختبار أفضى إلى قبول مستمر الأثر. يجمع التعبير العربي بين عملية الاختبار ونتيجتها، من غير أن يجعل الأهلية استحقاقًا ذاتيًا.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: لأن يأتمننا على الإنجيل
  rationale: المعنى هنا أن الله عهد إليهم بالإنجيل، لا أنهم آمنوا به. وصيغة «يأتمننا على» عربية واضحة تحفظ معنى التكليف والثقة.
- source_word: τὸ εὐαγγέλιον
  choice: الإنجيل
  rationale: هو المقابل العربي الراسخ للمصطلح البولسي، ويحفظ كثافته الدينية أفضل من بسطه هنا إلى «البشارة».
- source_word: οὕτως λαλοῦμεν
  choice: هكذا نتكلم
  rationale: يحفظ الصلة المنطقية بين اختبار الله وائتمانه لهم وبين طريقتهم في الكلام.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: لا كمن يسعون إلى إرضاء الناس
  rationale: ينقل تركيب اسم الفاعل وغايته بعبارة عربية طبيعية، مع تجنب إيحاء أنهم ينجحون فعلًا في إرضاء الناس.
- source_word: ἀλλὰ θεῷ
  choice: بل اللهَ
  rationale: 'يحفظ إيجاز اليونانية، إذ حُذف في طرف المقابلة الثاني ما يُفهم من الأول: «إرضاء».'
- source_word: τῷ δοκιμάζοντι
  choice: الذي يختبر
  rationale: المضارع يدل على الفحص المستمر، كما يحافظ «يختبر» على الصلة اللفظية بالفعل السابق δεδοκιμάσμεθα.
- source_word: τὰς καρδίας ἡμῶν
  choice: قلوبنا
  rationale: يحفظ التعبير الكتابي الأنثروبولوجي من غير اختزاله في العقل أو المشاعر وحدها.
theological_decisions:
- issue: المقابلة الموجزة بين إرضاء الناس وإرضاء الله
  choice: 'إبقاء الحذف في النص: «لا كمن يسعون إلى إرضاء الناس، بل اللهَ»'
  alternative: «لا لِنُرضي الناس، بل لِنُرضي الله»
  rationale: تذكر اليونانية معنى الإرضاء صراحة في الطرف الأول فقط، وتتركه مفهومًا في الثاني. يحفظ النص هذا التوتر الأسلوبي، وتوضح الحاشية الصياغة العربية الأكثر بسطًا.
- issue: دلالة قبول الله للرسل بعد الاختبار
  choice: «اختبرنا الله ورآنا أهلًا»
  alternative: «زكّانا الله» أو «وجدنا مستحقين»
  rationale: المختار يبين أن الأهلية حكم إلهي ناتج عن الاختبار، من غير إدخال مفهوم الاستحقاق الذاتي أو حصر الدلالة في التزكية اللفظية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «الإنجيل» بوصفه المصطلح العربي الراسخ، وحُفظ الإيجاز البلاغي في المقابلة مع شرحه في الحاشية.
