source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: ar
  text: 'فإنكم تذكرون، أيها الإخوة[a]، تعبنا ومشقّتنا: إذ كنا نعمل ليلًا ونهارًا لكيلا نثقل على أحد منكم، أعلنا لكم بشارة الله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فاليونانية تقول حرفيًا «الإخوة»، وقد يكون الخطاب شاملًا للجماعة كلها.
    reason: بديل معجمي يوضح احتمال الاستعمال الشامل لصيغة الجمع المذكر.
lexical_decisions:
- source_word: Μνημονεύετε
  choice: تذكرون
  rationale: فعل مضارع خبري للمخاطب الجمع، يستحضر معرفة التسالونيكيين السابقة بعمل الرسل، لا أمرًا لهم بالتذكّر.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ صيغة الجمع المذكر في اليونانية، مع بيان احتمال شمول الخطاب للجماعة كلها في الحاشية.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: تعبنا ومشقّتنا
  rationale: 'يحافظ على ازدواج اللفظين: التعب يدل على الجهد المضني، والمشقة على ما يصاحبه من عناء.'
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: إذ كنا نعمل ليلًا ونهارًا
  rationale: صياغة عربية طبيعية تنقل الحال والاستمرار في العمل.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: لكيلا نثقل على أحد منكم
  rationale: ينقل تركيب الغاية ودلالة الامتناع عن تحميل أي فرد عبئًا ماديًا أو عمليًا.
- source_word: ἐκηρύξαμεν
  choice: نادينا
  rationale: ينقل معنى الإعلان العلني بوضوح، من غير حصره في مصطلح كنسي تقني.
- source_word: εἰς ὑμᾶς
  choice: بينكم
  rationale: في سياق نشاط بولس التبشيري لدى الجماعة، تفيد العبارة أن المناداة جرت في وسطهم؛ وتظل «إليكم» بديلًا ممكنًا يحفظ الاتجاه الحرفي.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: بشارة الله
  rationale: «بشارة» عربية واضحة ومألوفة للمصطلح، وتحفظ إضافة «الله» من غير حسم أهي للمصدر أم الملكية أم المضمون.
theological_decisions:
- issue: مدى شمول ἀδελφοί
  choice: الإبقاء على «الإخوة» في المتن
  alternative: «الإخوة والأخوات»
  rationale: الصيغة اليونانية جمع مذكر، مع أن النداء في السياق قد يشمل جماعة المؤمنين كلها؛ لذلك حُفظت الصيغة في المتن وبُيّن الاحتمال الشامل في الحاشية.
- issue: دلالة إضافة «بشارة الله»
  choice: الحفاظ على الإضافة من غير تفسير
  alternative: «البشارة الآتية من الله» أو «البشارة عن الله»
  rationale: التركيب اليوناني يحتمل علاقة المصدر أو الملكية أو المضمون، ولا يقتضي السياق حسمها في الترجمة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «فإنكم» لربط γάρ بما قبلها، وحُفظ إيقاع العبارة وتقابل «تعبنا ومشقّتنا» من غير تكلف.
