source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: ar
  text: بل بعدما تألمنا من قبل وأُهِنّا وأُسيئت معاملتنا[a] في فيلبي، كما تعلمون، اجترأنا في إلهنا[b] أن نكلمكم بإنجيل الله وسط صراع شديد[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عوملنا بوقاحة»، أو «عوملنا معاملة مهينة». يتضمن الفعل اليوناني معنى المعاملة المتعجرفة أو الإذلال العلني.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تكلمنا بجرأة في إلهنا». قد يتضمن الفعل اليوناني نفسه فعل الكلام الجريء؛ أما المتن فيفصل الجرأة عن «أن نكلمكم» مراعاةً للمصدر اللاحق.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «في كفاح شديد»، أو «مع مقاومة شديدة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد مقابلة قوية بما سبق، و«بل» أوجز وأفصح في هذا السياق.
- source_word: προπαθόντες
  choice: بعدما تألمنا من قبل
  rationale: ينقل اسم الفاعل الماضي أسبقية الألم على الفعل الرئيس، كما يحفظ دلالة السابقة في البادئة προ-.
- source_word: ὑβρισθέντες
  choice: عوملنا بإهانة
  rationale: الفعل يدل على معاملة متعجرفة مهينة، لا على مجرد شتيمة لفظية؛ والصياغة العربية تجمع سوء المعاملة والمسّ بالكرامة.
- source_word: καθὼς οἴδατε
  choice: كما تعلمون
  rationale: تعبير اعتراضي طبيعي يحفظ استشهاد بولس بمعرفة المخاطَبين.
- source_word: ἐν Φιλίπποις
  choice: في فيلبي
  rationale: الصيغة العربية المألوفة لاسم المدينة.
- source_word: ἐπαρρησιασάμεθα
  choice: اجترأنا
  rationale: ينقل معنى الجرأة والصراحة، ويتيح للمصدر اللاحق λαλῆσαι أن يصرح بفعل الكلام من غير تكرار ثقيل.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: في إلهنا
  rationale: يحفظ حرف الجر وصيغة الإضافة، ويُبقي العبارة مفتوحة على معنى المجال أو الأساس العلاقي للجرأة بدل حصرها في السببية الأداتية.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: أن نكلمكم
  rationale: صياغة عربية مباشرة تنقل فعل الكلام ووجهته إلى المخاطَبين.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: بإنجيل الله
  rationale: يحفظ المصطلح البولسي المألوف وبنية الإضافة من غير تفسير زائد لطبيعة العلاقة في المضاف إليه.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: وسط صراع شديد
  rationale: ἀγών قد يدل على الصراع أو الكفاح أو المواجهة؛ و«وسط صراع شديد» ينقل شدة المقاومة والظرف المحيط بالخدمة.
theological_decisions:
- issue: دلالة ἐν τῷ θεῷ ἡμῶν
  choice: في إلهنا
  alternative: بإلهنا؛ بمعونة إلهنا؛ واثقين بإلهنا
  rationale: تبقي الترجمة على المعنى العلاقي أو المجالي المحتمل في اليونانية، ولا تختزل العبارة في كون الله أداة أو سببًا فحسب.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. اختير «اجترأنا» للمحافظة على تتابع الجرأة ثم الكلام، وأُبقيت عبارة «في إلهنا» على شيء من رسميتها لصون اتساع التعبير اليوناني ولاهوته من غير حسم زائد.
