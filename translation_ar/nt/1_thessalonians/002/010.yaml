  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: ar
  text: أنتم شهود، والله أيضًا، كيف سلكنا نحوكم أيها المؤمنون بتقوى وبرّ وبلا لوم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بينكم أيها المؤمنون» بدلًا من «نحوكم أيها المؤمنون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: أنتم شهود، والله أيضًا
  rationale: يحفظ ترتيب النداء التوكيدي في اليونانية، مع تقدير الخبر المفهوم طبيعيًا في العربية.
- source_word: ὡς
  choice: كيف
  rationale: تدخل على بيان هيئة سلوك بولس ورفيقيه، و«كيف» تنقل هذا المعنى مباشرة.
- source_word: ὁσίως
  choice: بتقوى
  rationale: تنقل بوضوح بُعد السلوك المتعبد لله، بلغة عربية معاصرة وكريمة.
- source_word: δικαίως
  choice: وبرّ
  rationale: تفيد الاستقامة الأخلاقية وفعل ما هو صواب، وتحافظ على تمييزها عن التقوى وعن انتفاء اللوم.
- source_word: ἀμέμπτως
  choice: وبلا لوم
  rationale: تعبير عربي طبيعي يدل على سلوك لا تقوم عليه ملامة معتبرة، من غير أن يفرض معنى العصمة المطلقة.
- source_word: ὑμῖν τοῖς πιστεύουσιν
  choice: بينكم أنتم المؤمنين
  rationale: يفهم الداتيف هنا بوصفه مجال السلوك وعلاقته بالمخاطبين؛ وتوكيد «أنتم» يوضح أن τοῖς πιστεύουσιν وصف لهم. ويمكن أيضًا فهم ὑμῖν بمعنى «نحوكم».
- source_word: ἐγενήθημεν
  choice: سلكنا
  rationale: مع ظروف الهيئة الثلاثة يدل الفعل سياقيًا على كيفية وجود المرسلين وتصرفهم بينهم؛ و«سلكنا» موجز وطبيعي في سياق الحديث عن نهج الحياة.
theological_decisions:
- issue: دلالة أوصاف السلوك الرسولي الثلاثة
  choice: تصف الألفاظ هيئة سلوك المرسلين الفعلية أمام المؤمنين والله، بما لا يتيح لومًا معتبرًا.
  alternative: أن تكون مجرد دفاع بلاغي، أو أن تفيد كمالًا أخلاقيًا مطلقًا وعصمة من كل خطيئة.
  rationale: النص يستشهد بالمخاطبين وبالله على السلوك المشاهد، لكنه لا يشرح هذه الأوصاف بوصفها ادعاءً بالعصمة؛ لذلك تُحفظ قوة الشهادة من غير إضافة حسم عقائدي غير مصرح به.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كريمة. اختير «بتقوى وبرّ وبلا لوم» للموازنة بين الدقة وسلاسة الإيقاع، ووُضعت الحاشية بعد الجملة لأنها تتعلق بوجه ترجمة العلاقة التي يدل عليها ὑμῖν.
