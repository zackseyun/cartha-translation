  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: ar
  text: الذي مات لأجلنا، لكي، سواء كنا مستيقظين أم نائمين، نحيا جميعًا معه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ساهرين أم نائمين». قد يكون في العبارة صدى للحث على السهر في السياق المحيط، وإن كان الأرجح هنا أنها تشير إلى ما إذا كان المؤمنون أحياء أم قد ماتوا.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: الذي مات
  rationale: اسم الفاعل الأُحادي يصف الرب يسوع المذكور في الآية السابقة، وصياغته جملة موصولة طبيعية في العربية وتحفظ ارتباطه بالسابق.
- source_word: περὶ ἡμῶν
  choice: لأجلنا
  rationale: تفيد περί مع المضاف إليه هنا معنى «من أجل/نيابةً عن» في سياق الخلاص؛ و«لأجلنا» واضحة من غير أن تضيف تحديدًا لاهوتيًا لا يصرّح به النص.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المقصودة بصياغة عربية موجزة.
- source_word: γρηγορῶμεν
  choice: كنا مستيقظين
  rationale: تحفظ صورة اليقظة، ويمكن أن تُفهم حرفيًا أو في ضوء معنى السهر الروحي، مع احتمال الإشارة أساسًا إلى كون المؤمنين أحياء.
- source_word: καθεύδωμεν
  choice: نائمين
  rationale: تحفظ استعارة النوم بدل تفسيرها صراحةً بالموت، وتبقي صلتها اللغوية بالسياق القريب وبحديث 4:13–15.
- source_word: ἅμα σὺν αὐτῷ
  choice: معًا معه
  rationale: تنقل ἅμα معنى الاجتماع وتنقل σύν معنى المصاحبة والاتحاد بالمسيح، مع إبقاء العنصرين ظاهرين في العربية.
- source_word: ζήσωμεν
  choice: نحيا
  rationale: فعل مضارع منصوب بعد «لكي» ينقل الغاية التي يعبّر عنها صيغة الاحتمال التابعة لـἵνα بصورة عربية طبيعية.
theological_decisions:
- issue: معنى «مستيقظين أم نائمين» في السياق
  choice: أُبقيت صورة اليقظة والنوم، مع ترجيح الإشارة إلى الأحياء والراقدين بالموت.
  alternative: أن يكون المقصود الساهرين روحيًا والغافلين، استمرارًا للوصية في 5:6–7.
  rationale: تلائم العبارة، في سياق غاية موت المسيح والحياة معه، المقابلة بين المؤمنين الأحياء والذين ماتوا كما في 4:13–15؛ لكن تكرار مفردات اليقظة والنوم من السياق القريب يبقي احتمال الصدى الأخلاقي قائمًا، لذلك لم يُحسم في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حافظت الصياغة على كون الآية جزءًا تابعًا للآية السابقة، وعلى استعارة اليقظة والنوم دون تفسيرها داخل المتن.
