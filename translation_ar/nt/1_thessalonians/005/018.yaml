translation:
  language: ar
  text: اشكروا في كل حال[a]، فإن ذلك هو مشيئة الله لكم في المسيح يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في كل شيء». أي في كل ظرف تمرون به، ولا يلزم من ذلك شكر الله على الشر نفسه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: في كل حال
  rationale: تفيد ἐν مع المجرور المجال أو الظرف الذي يجري فيه الشكر. وهذه الصياغة العربية الطبيعية تحافظ على المعنى من غير أن توحي بوجوب شكر الله على الشر نفسه.
- source_word: εὐχαριστεῖτε
  choice: اشكروا
  rationale: فعل أمر في صيغة الجمع يدعو إلى ممارسة مستمرة. وصيغة «اشكروا» مباشرة وطبيعية، ولا حاجة إلى إضافة ظرف مثل «دائمًا» لأن ذلك غير مصرح به هنا.
- source_word: τοῦτο
  choice: هذه
  rationale: اسم الإشارة يعود في المقام الأول إلى الوصية السابقة، وقد أُنِّث في العربية لموافقته الخبر «مشيئة» مع بقاء العبارة موجزة.
- source_word: γὰρ
  choice: فـ
  rationale: تقدم الفاء التعليل الذي يبيّن أساس الوصية، وهي أنسب في السياق العربي المتصل من افتتاح جملة ثقيلة بـ«لأن».
- source_word: θέλημα θεοῦ
  choice: مشيئة الله
  rationale: ترجمة دقيقة ومألوفة للتركيب الإضافي، وتحافظ على المصطلح اللاهوتي من غير توسع تفسيري.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» ترجمة لقب Χριστός، وحرف «في» يحفظ صياغة بولس ذات الدلالة العلائقية بدل اختزالها في معنى الوساطة أو السببية.
- source_word: εἰς ὑμᾶς
  choice: لكم
  rationale: يفيد التركيب هنا التوجه أو المرجع، أي إن مشيئة الله تخص المخاطبين وتتجه إليهم؛ و«لكم» هي العبارة العربية الأوضح والأوجز.
theological_decisions:
- issue: دلالة الشكر في جميع الأحوال
  choice: الشكر في كل حال
  alternative: الشكر على كل شيء
  rationale: حرف الجر ἐν يحدد المجال أو الظرف الذي يقع فيه الشكر، ولا يلزم منه أن يكون كل ما يحدث، بما فيه الشر، موضوعًا للشكر.
- issue: دلالة عبارة ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  alternative: بواسطة المسيح يسوع
  rationale: أُبقي حرف الجر على اتساعه ليحفظ لغة بولس عن العلاقة بالمسيح، من غير حصرها في الوساطة وحدها.
- issue: مرجع اسم الإشارة τοῦτο
  choice: الإشارة إلى الوصية المباشرة بالشكر
  alternative: الإشارة إلى مجموعة الوصايا في الآيات 16–18
  rationale: أقرب مرجع نحوي هو الأمر السابق مباشرة، مع أن السياق قد يسمح بفهم أوسع يشمل سلسلة الوصايا؛ لذلك لم تُضف عبارة تفسيرية تحسم المسألة.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ووقورة. استُخدم «في كل حال» لطبيعته ووضوحه في العربية، مع إثبات الصياغة الحرفية في الحاشية، وأُبقيت عبارة «في المسيح يسوع» بلا تفكيك تفسيري.
