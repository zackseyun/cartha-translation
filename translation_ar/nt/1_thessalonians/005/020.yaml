  text: Do not despise prophecies[a].
translation:
  language: ar
  text: لا تحتقروا النبوءات[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأقوال النبوية».'
    reason: بديل معجمي يوضح أن الجمع قد يشير إلى تعبيرات أو أقوال نبوية بعينها.
lexical_decisions:
- source_word: προφητείας
  choice: النبوءات
  rationale: جمع في حالة النصب من προφητεία، ويشير إلى نبوءات أو أقوال نبوية متعددة، لا إلى مفهوم النبوة المجرّد وحده. «النبوءات» تعبير عربي واضح يحفظ صيغة الجمع من غير تقييد المصطلح بتفسير مذهبي.
- source_word: μὴ
  choice: لا
  rationale: أداة نهي مع فعل الأمر في اليونانية، ويؤديها النهي العربي بـ«لا» أداءً طبيعيًا من غير إضافة توكيد غير موجود في النص.
- source_word: ἐξουθενεῖτε
  choice: تحتقروا
  rationale: الفعل يعني عدَّ الشيء تافهًا أو معاملته بازدراء. «تحتقروا» موجز وقوي ويحفظ معنى الازدراء، بخلاف «ترفضوا» الذي قد يضيّق الدلالة إلى مجرد عدم القبول.
theological_decisions:
- issue: دلالة «النبوءات» في سياق الجماعة المسيحية الأولى
  choice: الإبقاء على المصطلح العام «النبوءات» من غير تحديد آلية النبوة أو ربطها بموقف مذهبي لاحق.
  alternative: الأقوال النبوية
  rationale: النص يحذّر من احتقار مظاهر النبوة أو تعبيراتها، لكنه لا يحسم هنا الأسئلة المذهبية اللاحقة بشأن طبيعتها أو استمرارها؛ لذلك يحفظ هذا الاختيار عموم اللفظ والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة نهي كريمة ومباشرة. حُفظ جمع «النبوءات»، ووُضعت علامة الحاشية [a] في المتن.
