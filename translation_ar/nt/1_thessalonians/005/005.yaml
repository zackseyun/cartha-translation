source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: ar
  text: فَإِنَّكُمْ جَمِيعًا أَبْنَاءُ النُّورِ وَأَبْنَاءُ النَّهَارِ.[a] وَلَسْنَا مِنَ اللَّيْلِ وَلَا مِنَ الظُّلْمَةِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: المنتمون إلى النور والنهار أو المتصفون بهما. واليونانية تقول حرفيًّا «أبناء»، وهو تعبير اصطلاحي لا يقتصر هنا على الذكور.'
    reason: توضيح المجاز البنوي وقوته التمثيلية مع الحفاظ على اللفظ الأصلي في المتن.
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: فَإِنَّكُمْ جَمِيعًا
  rationale: يحفظ «فإنَّ» وظيفة γάρ التفسيرية وصلتها بالسياق السابق، ويؤدي «جميعًا» قوة πάντες الشاملة والمؤكدة بصياغة عربية طبيعية.
- source_word: υἱοὶ φωτός
  choice: أَبْنَاءُ نُورٍ
  rationale: يحافظ على اللفظ البنوي الصريح في υἱοί وعلى الإضافة المجازية التي تدل على الانتماء إلى النور أو الاتصاف به.
- source_word: υἱοὶ ἡμέρας
  choice: أَبْنَاءُ نَهَارٍ
  rationale: يحفظ التوازي مع «أبناء نور» والمقابلة البلاغية بين النهار والليل دون تفسير المجاز داخل المتن.
- source_word: οὐκ ἐσμὲν
  choice: وَلَسْنَا
  rationale: يحفظ الانتقال المقصود في اليونانية من ضمير المخاطبين «أنتم» إلى ضمير المتكلمين «نحن»، بدل تسوية الضميرين.
- source_word: νυκτὸς οὐδὲ σκότους
  choice: مِنَ اللَّيْلِ وَلَا مِنَ الظُّلْمَةِ
  rationale: تؤدي «من» معنى الانتماء أو المجال الذي تفيده صيغتا المضاف إليه، وتحافظ على التقابل بين الليل والظلمة من جهة والنور والنهار من جهة أخرى.
theological_decisions:
- issue: المجاز البنوي في υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: أبناء نور وأبناء نهار
  alternative: أولاد النور وأولاد النهار؛ أهل النور وأهل النهار
  rationale: «أبناء» تنقل صيغة υἱοί المذكرة بصياغة عربية فصيحة مألوفة في التعبير عن الانتماء والاتصاف، مع إبقاء امتداد الخطاب إلى جماعة المؤمنين مفهومًا من صيغة الجمع والسياق. وتوضح الحاشية طبيعة التعبير الاصطلاحية من غير تحييد المجاز في المتن.
- issue: الانتقال من المخاطب إلى المتكلم الجمع
  choice: فإنكم جميعًا ... ولسنا
  alternative: فإنكم جميعًا ... ولستم
  rationale: النص اليوناني ينتقل فعلًا من ὑμεῖς ἐστε إلى ἐσμέν، فيضم الكاتب نفسه ورفاقه إلى المخاطبين. إبقاء هذا الانتقال يصون السمة الخطابية ولا يوحّد الضمائر تفسيرًا.
- issue: طبيعة الإضافة في «أبناء نور/نهار» و«من الليل/الظلمة»
  choice: الإبقاء على لغة الانتماء المجازية
  alternative: أنتم جميعًا ممن يتصفون بالنور والنهار، ولا ننتمي إلى الليل أو الظلمة
  rationale: الإضافات تحتمل الانتماء والاتصاف والمجال معًا؛ لذلك يحافظ المتن على كثافتها المجازية ولا يحصرها في تفسير لاهوتي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعملت «فإنكم» للربط التفسيري، و«أبناء» لصون المجاز الأصلي، و«لسنا» لإظهار التحول الدقيق في الضمير. وُضعت علامة الحاشية بعد الجملة التي تشرحها.
