  text: ἀπὸ παντὸς εἴδους πονηροῦ ἀπέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: ar
  text: امْتَنِعُوا عَنْ كُلِّ نَوْعٍ مِنَ الشَّرِّ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «كل صورة من الشر»؛ وتقليديًا: «كل مظهر للشر».'
    reason: بديل معجمي
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: امْتَنِعُوا
  rationale: فعل أمر في المضارع موجَّه إلى الجمع، ويدعو إلى مواصلة تجنّب الشر. و«امتنعوا» موجزة وطبيعية وتحفظ قوة الأمر.
- source_word: ἀπὸ
  choice: عَنْ
  rationale: تفيد الانفصال والابتعاد مع فعل الامتناع، وهي الصياغة العربية الطبيعية هنا.
- source_word: παντὸς
  choice: كُلِّ
  rationale: تتصل بـ«نوع» المفرد، فتفيد شمول جميع الأنواع.
- source_word: εἴδους
  choice: نَوْعٍ
  rationale: المعنى الأرجح في السياق هو «نوع» أو «صنف»، لا مجرد المظهر الخارجي. وهذا يتجنب الإيحاء بأن المطلوب هو اجتناب ما يبدو شريرًا فحسب.
- source_word: πονηροῦ
  choice: الشَّرِّ
  rationale: مضاف إليه يبيّن المقصود بالنوع؛ و«الشر» هو المقابل العربي المباشر والطبيعي.
theological_decisions:
- issue: معنى εἴδους في العبارة ἀπὸ παντὸς εἴδους πονηροῦ
  choice: كُلِّ نَوْعٍ مِنَ الشَّرِّ
  alternative: 'كل صورة من الشر؛ وتقليديًا: كل مظهر للشر'
  rationale: يرجّح السياق معنى كل نوع أو صورة من الشر. أما «كل مظهر للشر» فقد تُفهم على أنها توجب اجتناب ما يبدو شريرًا ولو لم يكن شرًا، وهو تحميل للفظ أكثر مما يحتمل على الأرجح. أُثبت البديل في الحاشية حفاظًا على الشفافية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة ذات نبرة لائقة بالنص الكتابي. استُعملت «امتنعوا» للمحافظة على قوة الأمر، و«نوع» لإيصال المعنى السياقي الأرجح دون إلغاء البديل المعجمي المثبت في الحاشية.
