  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: ar
  text: إذًا، لا نَنَمْ كسائر الناس، بل لنبقَ مستيقظين[a] ولنكن متّزنين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لنبقَ متيقظين» أو «لنسهر». يمكن أن يدل الفعل اليوناني على الاستيقاظ أو على السهر والانتباه.
