    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: إذًا
  rationale: تفيد الأداتان معًا استخلاص نتيجة مما سبق. و«إذًا» تؤدي هذا الانتقال الاستنتاجي بصياغة عربية طبيعية موجزة.
- source_word: μὴ καθεύδωμεν
  choice: لا نَنَمْ
  rationale: صيغة حثّ جماعي منفية، وقد حُفظت صورة النوم كما في اليونانية بدل تحويلها إلى شرح أخلاقي مجرد.
- source_word: ὡς οἱ λοιποί
  choice: كسائر الناس
  rationale: تشير العبارة إلى بقية الناس في مقابل المؤمنين في السياق. وإضافة «الناس» توضح المرجع الطبيعي في العربية من غير إدخال تفسير زائد.
- source_word: ἀλλὰ
  choice: بل
  rationale: تُظهر «بل» الانتقال الواضح من النهي إلى البديل الإيجابي المقابل.
- source_word: γρηγορῶμεν
  choice: لنبقَ مستيقظين
  rationale: يحفظ التعبير التضاد المباشر مع النوم، مع بقاء دلالة اليقظة والانتباه التي يحملها الفعل في السياق.
- source_word: νήφωμεν
  choice: ولنكن صاحين
  rationale: «صاحين» تحفظ مجال الدلالة المتصل بالصحو من السُّكر، ويمكن أن تشمل كذلك صفاء الذهن وضبط النفس، فلا تحصر اللفظ في معنى تجريدي واحد.
theological_decisions:
- issue: القوة المجازية للنوم واليقظة
  choice: الإبقاء على صورتي النوم والاستيقاظ في المتن بوصفهما حثًّا أخلاقيًا وروحيًا
  alternative: شرح المعنى مباشرة بأنه الغفلة الأخلاقية في مقابل التيقظ
  rationale: السياق يقابل أبناء النور بمن ينتمون إلى الليل؛ وحفظ الصورة يصون ترابط حجة بولس من غير إفراط في التفسير.
- issue: دلالة νήφω
  choice: «لنكن صاحين» بما يبقي إيحاء الصحو وصفاء الذهن معًا
  alternative: «لنكن ضابطي أنفسنا» أو «صافيي الذهن»
  rationale: قد يجمع اللفظ بين الصحو بالمعنى الحسي والاتزان والانتباه بالمعنى الممتد، ولذلك لم تُحسم الدلالة في فضيلة مجردة واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع نبرة حثّ جماعي كريمة. حُفظت استعارة النوم والاستيقاظ، ووُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحان بدائلهما.
