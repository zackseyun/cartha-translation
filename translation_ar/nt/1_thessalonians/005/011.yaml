lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق، وتحافظ على الصلة المنطقية بعبارة عربية طبيعية.
- source_word: παρακαλεῖτε
  choice: شجِّعوا
  rationale: الفعل قد يدل على التشجيع أو الحث أو التعزية؛ والتشجيع هنا يلائم سياق التقوية المتبادلة من غير تضييق المعنى على التعزية وحدها.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: صياغة عربية مألوفة تعبّر بوضوح عن التبادل بين أفراد الجماعة.
- source_word: οἰκοδομεῖτε
  choice: ابنوا
  rationale: يحافظ على استعارة البناء الواردة في اليونانية بدل استبدالها بتعبير تفسيري مثل «قوّوا».
- source_word: εἷς τὸν ἕνα
  choice: الواحدُ الآخرَ
  rationale: ينقل التركيب المؤكد الذي يركّز على مسؤولية كل واحد تجاه الآخر، مع إبقاء التكرار الدلالي المقصود بعد «بعضكم بعضًا».
- source_word: καθὼς καὶ ποιεῖτε
  choice: كما أنكم تفعلون فعلًا
  rationale: تنقل المقارنة، وتُظهر أن المخاطَبين يمارسون ذلك بالفعل في الوقت الحاضر، وفيها إقرار مشجّع بسلوكهم.
