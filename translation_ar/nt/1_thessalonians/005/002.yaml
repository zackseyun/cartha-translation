  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: ar
  text: لأنكم أنتم أنفسكم تعلمون جيدًا أن يوم الرب يأتي كاللصّ في الليل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: أنتم أنفسكم
  rationale: يحفظ توكيد الضمير اليوناني مع بقاء العبارة طبيعية وواضحة في العربية.
- source_word: γὰρ
  choice: لأنكم
  rationale: تنقل الأداة التعليلية التي تبيّن سبب القول السابق، وقد أُدمجت مع ضمير المخاطبين وفق الأسلوب العربي.
- source_word: ἀκριβῶς
  choice: جيدًا
  rationale: في اقترانها بفعل المعرفة تفيد المعرفة الدقيقة أو المؤكدة؛ و«تعلمون جيدًا» صياغة عربية طبيعية تحفظ هذا المعنى دون تكلّف.
- source_word: οἴδατε
  choice: تعلمون
  rationale: مقابل مباشر وطبيعي لفعل المعرفة في هذا السياق.
- source_word: ὅτι
  choice: أن
  rationale: تدخل على مضمون ما يعلمه المخاطبون.
- source_word: ἡμέρα κυρίου
  choice: يوم الرب
  rationale: يحفظ التعبير الأخروي الراسخ وخلفيته النبوية، ولا يحوّله إلى إشارة إلى يوم عبادة أسبوعي.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: كلصّ في الليل
  rationale: يحفظ صورة التشبيه وترتيب عناصرها في عبارة عربية موجزة ومفهومة.
- source_word: οὕτως
  choice: هكذا
  rationale: يُظهر صراحة عنصر المطابقة في اليونانية بين كيفية مجيء اليوم وصورة اللص في الليل.
- source_word: ἔρχεται
  choice: يأتي
  rationale: يحفظ المضارع اليوناني الحيّ المستخدم عن حدث أخروي آتٍ.
theological_decisions:
- issue: دلالة التعبير الأخروي ἡμέρα κυρίου
  choice: يوم الرب
  alternative: يومٌ للرب / يوم الرب الأسبوعي
  rationale: السياق يتناول مجيء يوم التدخل أو الدينونة الإلهية، والتعبير ذو خلفية نبوية معروفة؛ لذلك لا ينبغي فهمه على أنه اسم ليوم عبادة أسبوعي.
- issue: قوة تشبيه اللص في الليل
  choice: الإبقاء على التشبيه بلا تفسير زائد
  alternative: توسيعه ليصرّح بالسرية أو بنظام أخروي معيّن
  rationale: النص نفسه يصوّر كيفية المجيء بالتشبيه، ولا يحدّد هنا إطارًا أخرويًا تفصيليًا؛ لذا تُصان الصورة والتوتر من غير إضافة مذهبية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أنتم أنفسكم» لحفظ التوكيد، و«هكذا» لإبراز οὕτως بدل امتصاصه ضمنيًا في التشبيه. لا توجد حاجة إلى حاشية في هذه الآية.
