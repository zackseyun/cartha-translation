    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: احرصوا
  rationale: الفعل هنا أمرٌ جمعي بمعنى التيقظ والعناية بمنع السلوك المذكور، لا مجرد الرؤية الحسية.
- source_word: μή τις ... τινι ἀποδῷ
  choice: على ألّا يردَّ أحدٌ على أحدٍ
  rationale: ينقل تركيب الوقاية بعد فعل الأمر، ويحفظ كلاً من الفاعل والمتلقي غير المحددين.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: شرًّا بشرّ
  rationale: يحفظ صيغة المقابلة والتكرار والمجال الأخلاقي الواسع للفظ اليوناني.
- source_word: πάντοτε τὸ ἀγαθὸν διώκετε
  choice: بل اسعوا دائمًا إلى الخير
  rationale: «اسعوا» تعبّر عن الطلب الجاد المتواصل في διώκετε، و«الخير» يقابل الصفة المعرّفة المستعملة استعمال الاسم.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: بعضكم نحو بعض، ونحو الجميع
  rationale: يحفظ اتجاه السلوك في εἰς، والتدرج النصي من العلاقة المتبادلة إلى الدائرة الأوسع دون إضافة قيد غير مصرح به.
theological_decisions:
- issue: نطاق الالتزام الأخلاقي
  choice: الإبقاء على الانتقال من «بعضكم نحو بعض» إلى «نحو الجميع».
  alternative: اعتبار «الجميع» مقصورًا على جميع المؤمنين.
  rationale: العبارتان المتوازيتان توحيان باتساع النطاق من الجماعة المتبادلة إلى الجميع، لكن المتن لا يضيف تحديدًا صريحًا لهوية «الجميع»، لذلك تُحفظ الصياغة المفتوحة ويُذكر الترجيح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «احرصوا» للأمر الجماعي، و«اسعوا» للحفاظ على قوة الحث في الفعل اليوناني، مع تجنب الصياغة المذهبية أو تفسير «الجميع» داخل المتن.
