  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: ar
  text: احرصوا على ألّا يردَّ أحدٌ على أيّ شخصٍ شرًّا بشرّ، بل اسعوا دائمًا إلى الخير، بعضكم لبعض وللجميع.[a]
  philosophy: optimal-equivalence
  footnotes:
