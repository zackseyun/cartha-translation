- source_word: ἀδιαλείπτως
  choice: بلا انقطاع
  rationale: ينقل الظرف معنى الاستمرار والمثابرة من غير أن يفرض بالضرورة صلاة لفظية متواصلة في كل لحظة؛ وهو تعبير عربي واضح وموجز يحفظ قوة الأصل.
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: فعل أمر في صيغة الجمع، وصيغته الحاضرة في اليونانية تدعو إلى عمل مستمر أو معتاد. ويؤدي فعل الأمر العربي «صلّوا» قوة الحث، بينما يبيّن الظرف «بلا انقطاع» جانب الاستمرار.
theological_decisions:
- issue: الدلالة العملية للوصية
  choice: حث عام على المواظبة والمثابرة في الصلاة
  alternative: اشتراط صلاة لفظية صريحة لا تتوقف في أي لحظة
  rationale: يحفظ النص صياغة الوصية وقوتها من دون حصرها في تفسير حرفي مفرط أو إدخال تصور تعبدي خاص؛ فاقتران فعل الأمر بالظرف يفيد دوام التوجه إلى الصلاة والمثابرة عليها.
