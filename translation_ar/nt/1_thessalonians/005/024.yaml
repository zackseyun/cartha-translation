  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: ar
  text: أمينٌ هو الذي يدعوكم[a]، وهو أيضًا سيفعل ذلك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جديرٌ بالثقة هو الذي يدعوكم؛ وهو أيضًا سيُنجز ذلك».'
    reason: بديل معجمي وصياغي يحافظ على معنى موثوقية الداعي، ويبرز دلالة الإنجاز الممكنة في ποιήσει.
lexical_decisions:
- source_word: πιστὸς
  choice: أمينٌ
  rationale: صفة خبرية تصف الله بالثبات والجدارة بالثقة. ولفظ «أمين» موجز وطبيعي في العربية الكتابية، مع بقاء «جدير بالثقة» بديلًا تفسيريًا ممكنًا.
- source_word: ὁ καλῶν
  choice: الذي يدعو
  rationale: اسم فاعل حاضر مع أداة التعريف، مستعمل استعمال الاسم؛ وتحافظ الصياغة على معنى الدعوة الجارية في عربية طبيعية.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير مفعول به للجمع، وتُظهر لاحقة الجمع العربية أن الخطاب موجَّه إلى الجماعة.
- source_word: ὃς καὶ
  choice: وهو أيضًا
  rationale: تنقل صلة الموصول مع دلالة καί على الاستمرار والتوكيد، وتوضح أن الداعي نفسه هو الذي سيعمل.
- source_word: ποιήσει
  choice: سيفعل ذلك
  rationale: فعل مستقبل واسع الدلالة بمعنى «يفعل/ينجز». أُضيف «ذلك» بوصفه مفعولًا مفهومًا يعود إلى ما صلّى به بولس في الآية السابقة، من غير تفصيل زائد.
theological_decisions:
- issue: المفعول المحذوف في ποιήσει
  choice: سيفعل ذلك
  alternative: سيُتمّه / سيُنجز ذلك
  rationale: اليونانية لا تصرّح بالمفعول، والمرجع الأقرب هو عمل التقديس والحفظ المذكور في 5:23. تحافظ «ذلك» على الإيجاز ولا تحدد كيفية إتمام الله لهذا العمل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. قُدِّم الخبر «أمينٌ» للمحافظة على توكيد النص اليوناني، مع استعمال «وهو أيضًا» بدل تركيب موصول ثقيل. علامة الحاشية [a] واردة في المتن.
