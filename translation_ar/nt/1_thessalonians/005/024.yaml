  source_fidelity: 'النص العربي ينقل بدقة البنية والمعنى الأساسيين في اليونانية: «أمينٌ» مقابل πιστός، و«الذي يدعوكم» مقابل ὁ καλῶν ὑμᾶς مع إظهار الجمع، و«وهو أيضًا سيفعل ذلك» مقابل ὃς καὶ ποιήσει. إضافة «ذلك» تعالج المفعول المحذوف في العربية بصورة مقتصدة، وتحيل طبيعيًا إلى مضمون الآية السابقة دون تفصيل تفسيري زائد.'
