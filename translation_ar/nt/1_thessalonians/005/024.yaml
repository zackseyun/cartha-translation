  terminology: «أمين» اختيار سليم لـ πιστός في هذا السياق، ويحافظ على معنى الثبات والموثوقية دون فرض تفسير مذهبي. وتعرض الحاشية «جدير بالثقة» بديلًا معجميًا مناسبًا، كما أن «سيُنجز ذلك» بديل مقبول لـ ποιήσει مع بقاء المتن أوسع دلالة.
