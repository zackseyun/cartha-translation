lexical_decisions:
- source_word: Ἀδελφοί
  choice: أيها الإخوة
  rationale: نداء جمع مذكر من ἀδελφός. يحافظ النص على الصيغة اليونانية المذكرة، مع بيان احتمال شمول النداء للإخوة والأخوات في الحاشية.
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: فعل أمر مضارع للجمع من προσεύχομαι. «صلّوا» هو التعبير العربي الطبيعي المباشر؛ وقد يدل زمن الفعل على الاستمرار، لكن لا يلزم التصريح بذلك هنا.
- source_word: περὶ
  choice: من أجل
  rationale: مع ضمير المضاف إليه ἡμῶν تفيد طلب الصلاة لأجل المتكلمين، و«من أجل» تعبير عربي واضح وطبيعي في هذا السياق.
- source_word: ἡμῶν
  choice: نا
  rationale: ضمير المتكلمين الجمع، ويشير إلى بولس ورفقائه من غير إضافة تحديد لا يصرح به النص.
theological_decisions:
- issue: صيغة النداء المذكرة Ἀδελφοί في جماعة يُرجح أنها مختلطة
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: أُبقيت الصيغة المذكرة المطابقة للفظ اليوناني في المتن، مع حفظ الدلالة الشاملة المرجحة بوصفها احتمالًا في الحاشية، من غير حسم ما تركته الصيغة الأصلية ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كريمة. استُخدم «أيها» لصياغة النداء الطبيعي، و«صلّوا من أجلنا» لطلب الصلاة بصورة مألوفة.
