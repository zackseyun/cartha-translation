  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: ar
  text: ونطلب منكم، أيها الإخوة[a]، أن تقدِّروا[b] الذين يتعبون بينكم، ويقودونكم في الرب[c]، وينذرونكم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ اللفظ اليوناني «الإخوة»، وهو هنا نداء موجَّه إلى جماعة المؤمنين.
    reason: lexical_alternative
  - marker: b
    text: أو «أن تعترفوا بهم» أو «أن تعرفوا قدرهم».
    reason: lexical_alternative
  - marker: c
    text: أو «القائمين عليكم في الرب».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν δὲ
  choice: ونطلب منكم
  rationale: ينقل الفعل بصيغة طلب رعوي لطيف، وتؤدي الواو وظيفة الانتقال الخفيف التي تؤديها δέ من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع توضيح شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: εἰδέναι
  choice: أن تقدِّروا
  rationale: الفعل في هذا السياق لا يقتصر على المعرفة الذهنية، بل يدل على الاعتراف بالخادمين ومعرفة قدرهم. «تقدِّروا» عربية طبيعية تنقل هذا المعنى العلاقي دون أن تضيف وجوب الطاعة أو التبجيل.
- source_word: τοὺς κοπιῶντας ἐν ὑμῖν
  choice: الذين يتعبون في خدمتكم
  rationale: يحفظ معنى العمل الشاق في κοπιάω، ويبيّن أن التعب واقع في وسط الجماعة ولأجل خدمتها. والصياغة العربية أكثر طبيعية من النقل المكاني الحرفي «يتعبون فيكم».
- source_word: προϊσταμένους ὑμῶν
  choice: يقودونكم
  rationale: ينقل معنى القيادة والإشراف في الفعل من غير فرض بنية كنسية هرمية محددة، مع إثبات البديل الأقرب إلى البنية الحرفية في الحاشية.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: صياغة دقيقة وشفافة تحافظ على ارتباط قيادتهم بالرب وعلى ما في العبارة من إيجاز لاهوتي.
- source_word: νουθετοῦντας ὑμᾶς
  choice: ينصحونكم
  rationale: ينقل جانب الإرشاد الرعوي والتصحيح في νουθετέω بلغة عربية واضحة؛ ولا يحصر المعنى في التحذير وحده.
theological_decisions:
- issue: مدى شمول النداء ἀδελφοί
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: أُبقيت الصيغة المذكرة الواردة في الأصل داخل المتن، وأوضحت الحاشية أن النداء موجه إلى جماعة المؤمنين كلها.
- issue: معنى εἰδέναι في الموقف من خدام الجماعة
  choice: أن تقدِّروا
  alternative: أن تعترفوا بهم أو تعرفوا قدرهم
  rationale: السياق يدعو إلى إدراك خدمتهم وتقديرها، لكنه لا يصرح بالطاعة أو التعظيم؛ لذلك تجنبت الصياغة تحميل النص دعوى كنسية أقوى مما يقول.
- issue: دلالة προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: يقودونكم في الرب
  alternative: القائمين عليكم في الرب
  rationale: يحفظ الاختيار معنى القيادة والمسؤولية مع إبقاء طبيعة هذه الرئاسة غير محددة طائفيًا، وتعرض الحاشية الصياغة الأقرب إلى حرفية التركيب.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «في خدمتكم» لتجنب غرابة «فيكم» مع الحفاظ على المعنى الجماعي، وحُفظت العبارة اللاهوتية الموجزة «في الرب». تنتهي الآية بفاصلة لأنها متصلة نحويًا بما يليها في الآية التالية.
