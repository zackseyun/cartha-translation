lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر مباشر لجماعة المخاطَبين، وتعبير «سلّموا على» هو المقابل العربي الطبيعي الموجز للتحية الاجتماعية المقصودة.
- source_word: ἀδελφοὺς
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية، مع بيان احتمال شمول جماعة المؤمنين كلها في الحاشية.
- source_word: πάντας
  choice: جميعًا
  rationale: ينقل توكيد شمول كل الإخوة، ويأتي في موضع عربي طبيعي بعد الاسم.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: بقبلة مقدسة
  rationale: الباء تؤدي معنى الوسيلة أو الكيفية، و«قبلة مقدسة» تنقل دلالة التعبير اليوناني بوضوح وتحافظ على طابعه الديني والاجتماعي.
theological_decisions:
- issue: دلالة ἀδελφοί المذكرة في سياق جماعة المؤمنين
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: النص اليوناني يستخدم جمعًا مذكرًا، لذلك حُفظت صيغته في المتن، مع عدم حسم نطاق الإشارة؛ إذ قد يقصد به جماعة المؤمنين كلها، وهو ما توضحه الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة لائقة بالنص الرسولي. استُخدم «سلّموا على» بوصفه التعبير العربي الطبيعي، مع إبقاء «قبلة مقدسة» قريبًا من الصياغة الأصلية.
