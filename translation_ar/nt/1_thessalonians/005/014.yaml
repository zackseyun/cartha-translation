id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: ar
  text: 'ونحثّكم، أيها الإخوة[a]: نبّهوا غير المنضبطين[b]، وشجّعوا خائري العزيمة[c]، وساندوا الضعفاء[d]، واصبروا على الجميع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الإخوة والأخوات؛ فالخطاب موجّه إلى جماعة المؤمنين كلها.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا: «المتكاسلين» أو «المتمرّدين».'
    reason: lexical_alternative
  - marker: c
    text: 'أي الذين فترت همّتهم أو أصابهم الإحباط؛ ويمكن أيضًا: «عزّوا المحبطين».'
    reason: lexical_alternative
  - marker: d
    text: 'يمكن أيضًا: «تمسّكوا بالضعفاء» أو «أعينوا الضعفاء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: نحثّكم
  rationale: يفيد الفعل هنا طلبًا جادًّا ذا طابع رعوي، و«نحثّكم» واضح وقوي من غير تكلّف.
- source_word: δέ
  choice: و
  rationale: الأداة هنا للاستمرار والانتقال، لا لإبراز تعارض قوي؛ لذلك تلائمها واو العطف.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع بيان شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: νουθετεῖτε
  choice: نبّهوا
  rationale: ينقل معنى الإرشاد التصحيحي والتحذير الهادف إلى تقويم السلوك، بلغة عربية واضحة ومعاصرة.
- source_word: ἀτάκτους
  choice: غير المنضبطين
  rationale: يحفظ المعنى الواسع لمن هم خارج النظام أو لا يسيرون بانضباط، من غير قصره على البطالة وحدها.
- source_word: παραμυθεῖσθε
  choice: شجّعوا
  rationale: يدل على مخاطبة الشخص بلطف لتقويته وطمأنته؛ و«شجّعوا» أنسب في سياق خائري العزيمة.
- source_word: ὀλιγοψύχους
  choice: خائري العزيمة
  rationale: تعبير عربي طبيعي لمن ضعف قلبهم أو وهنت شجاعتهم، ويتجنب الإيحاء السلبي غير المقصود في الترجمة الحرفية «صغار النفوس».
- source_word: ἀντέχεσθε
  choice: ساندوا
  rationale: الفعل مع المضاف إليه يفيد التمسك بالشخص لأجل دعمه ومساعدته؛ و«ساندوا» يحفظ هذا البعد العملي والرعوي.
- source_word: τῶν ἀσθενῶν
  choice: الضعفاء
  rationale: يحافظ على سعة اللفظ، فلا يحدد إن كان الضعف جسديًا أو معنويًا أو اجتماعيًا.
- source_word: μακροθυμεῖτε
  choice: اصبروا
  rationale: يعبر عن طول الأناة في التعامل مع الناس، وهو المقابل العربي الطبيعي الواضح.
- source_word: πρὸς πάντας
  choice: على الجميع
  rationale: مع فعل «اصبروا»، هذا هو التركيب العربي المألوف الذي ينقل توجّه الصبر نحو كل الناس.
theological_decisions:
- issue: شمول ἀδελφοί للنساء في خطاب الجماعة
  choice: إبقاء «الإخوة» في المتن وشرح شمولها في الحاشية
  alternative: «الإخوة والأخوات»
  rationale: تحافظ الصياغة الرئيسية على صورة اللفظ اليوناني المذكر، بينما توضح الحاشية أن بولس يخاطب جماعة المؤمنين كلها، رجالًا ونساءً، من غير حسم المعنى بإضافة لفظ غير مصرح به في المتن.
- issue: نوع الضعف المقصود في τῶν ἀσθενῶν
  choice: «الضعفاء» من غير تحديد
  alternative: المرضى أو الضعفاء روحيًا
  rationale: السياق لا يحدد نوع الضعف تحديدًا قاطعًا، ولذلك تُصان سعة التعبير بدل فرض تفسير جسدي أو روحي بعينه.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدمت أفعال أمر مباشرة بعد نقطتين للمحافظة على قوة سلسلة الوصايا اليونانية. وتجنبت الصياغة ألفاظًا تراثية غامضة مثل «عاتبوا» أو «تأنّوا»، كما تجنبت تحديد نوع الضعف أو قصر عدم الانضباط على الكسل.
