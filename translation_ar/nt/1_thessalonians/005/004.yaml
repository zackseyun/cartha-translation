review_pass:
  verdict: revise
  source_fidelity: 'تحتاج الصياغة إلى تصحيح رابط الجملة التابعة: «حتى يدرككم» تفيد في العربية غايةً زمنيةً مثبتة، فتغيّر المعنى. في اليونانية، عدم كون المخاطَبين في الظلمة يعني أن اليوم لا يدركهم على نحو اللص. وتُحافظ «حتى لا يدرككم» على العلاقة من غير حسم زائد بين الغاية والنتيجة. كما أن «اليوم» يطابق المعرفة في اليونانية من غير إضافة الإشارة «ذلك».'
  naturalness: 'النص بعد التصحيح فصيح وواضح: «أما أنتم، أيها الإخوة... فلستم في ظلمة، حتى لا يدرككم اليوم كلص».'
  terminology: «الإخوة» مع الحاشية مناسب لنقل ἀδελφοί، و«ظلمة» و«يدرككم» و«كلص» تحافظ على الصورة المجازية والتشبيه. الحاشية الخاصة بـ«اليوم» تشرح المرجع السياقي دون إدخال «يوم الرب» في المتن.
  issues:
  - severity: high
    issue: غياب «لا» بعد «حتى»
    rationale: 'الصياغة الحالية «فلستم في ظلمة، حتى يدرككم ذلك اليوم كلص» تجعل إدراك اليوم لهم غايةً زمنيةً مثبتة، ولا تنقل المعنى المقصود في ἵνα ضمن هذا السياق: أن اليوم لا يدركهم كاللص.'
  - severity: low
    issue: إضافة اسم الإشارة في «ذلك اليوم»
    rationale: اليونانية تقول «اليوم» مع أداة التعريف، لا «ذلك اليوم». التعريف العربي في «اليوم» كافٍ لإفادة اليوم المعهود سياقيًا، وتبقى الحاشية لتحديده.
