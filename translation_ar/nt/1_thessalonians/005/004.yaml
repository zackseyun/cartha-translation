  to: أَمَّا أَنْتُمْ، أَيُّهَا الإِخْوَةُ[a]، فَلَسْتُمْ فِي ظُلْمَةٍ، حَتَّى لَا يُدْرِكَكُمُ الْيَوْمُ[b] كَلِصٍّ.
  rationale: أُضيفت «لا» بعد «حتى» لتصحيح العلاقة المعنوية بين عدم كونهم في الظلمة وعدم إدراك اليوم لهم كَلِصّ. واستُبدل «ذلك اليوم» بـ«اليوم» لمطابقة أداة التعريف في الأصل مع إبقاء الإحالة السياقية في الحاشية. ولم تُغيَّر بقية الألفاظ لأنها أمينة وطبيعية في العربية الفصحى.
