  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: ar
  text: أَمَّا أَنْتُمْ، أَيُّهَا الإِخْوَةُ[a]، فَلَسْتُمْ فِي ظُلْمَةٍ، حَتَّى لَا يُدْرِكَكُمُ الْيَوْمُ[b] كَلِصٍّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الإخوة والأخوات؛ فالخطاب يشمل جماعة المؤمنين كلّها.
    reason: lexical_alternative
  - marker: b
    text: أي يوم الرب المذكور في السياق القريب.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: أَمَّا أَنْتُمْ
  rationale: تفيد δέ المقابلة مع المذكورين قبلًا، ويُبرز الضمير الصريح ὑμεῖς المخاطَبين؛ فحافظت «أمّا أنتم» على المقابلة والتوكيد بأسلوب عربي طبيعي.
- source_word: ἀδελφοί
  choice: أَيُّهَا الإِخْوَةُ
  rationale: نقلت صيغة النداء وجاءت بلفظ «الإخوة» المطابق للمذكر الجمع، مع بيان شمول الخطاب للنساء في الحاشية.
- source_word: ἐν σκότει
  choice: فِي ظُلْمَةٍ
  rationale: يحافظ التعبير على صورة الظلمة المجازية وعلى أصدائها الروحية، من غير تحويلها إلى تفسير صريح.
- source_word: ἵνα
  choice: حَتَّى
  rationale: تربط «حتى» عدم كونهم في ظلمة بالنتيجة المنفية التي تليه، مع إبقاء التداخل الممكن بين الغاية والنتيجة في الصياغة اليونانية.
- source_word: ἡ ἡμέρα
  choice: ذَلِكَ الْيَوْمُ
  rationale: السياق يجعل اليوم معيّنًا ومعهودًا، واسم الإشارة طبيعي في العربية، بينما توضّح الحاشية أنه يوم الرب من غير إدخال العبارة الكاملة في المتن.
- source_word: ὡς κλέπτης
  choice: كَلِصٍّ
  rationale: تحافظ الكاف على التشبيه المباشر والطبيعي في العربية.
- source_word: καταλάβῃ
  choice: يُدْرِكَكُمْ
  rationale: «يدرككم» ينقل معنى اللحاق والوصول المفاجئ الكامن في الفعل، ويحافظ على الصورة بدل تفسيرها بعبارة «يفاجئكم».
theological_decisions:
- issue: دلالة ἀδελφοί الجندرية في خطاب جماعة مختلطة
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: أُبقيت الصيغة المذكرة في المتن اتساقًا مع اللفظ اليوناني، مع توضيح دلالتها الشاملة المرجحة في الحاشية.
- issue: المرجع الأخروي لعبارة ἡ ἡμέρα
  choice: ذلك اليوم
  alternative: يوم الرب
  rationale: لم يُدخل المتن عبارة «يوم الرب» لأن اليونانية هنا تقول «اليوم» فحسب، لكن الحاشية تعرّف المرجع بحسب السياق القريب.
- issue: طبيعة العلاقة التي تفيدها ἵνα
  choice: حتى
  alternative: بحيث
  rationale: اختير رابط عربي لا يحسم على نحو زائد هل الدلالة غائية أم نتيجية، وبذلك يُحفظ قدر من التوتر الدلالي في الأصل.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة، تحافظ على مقابلة «أما أنتم» وصورتي الظلمة واللص. استُعمل «يدرككم» لتفادي شرح عنصر المفاجأة داخل المتن، ووُضعت علامتا الحاشية [a] و[b] عند موضعيهما.
