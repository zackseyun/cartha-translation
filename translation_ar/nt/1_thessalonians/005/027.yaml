base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: ar
  text: أستحلفكم بالرب أن تُقرأ هذه الرسالة على الإخوة جميعًا.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة: «أمام الرب»؛ فالتعبير اليوناني يفيد مناشدةً مغلَّظة يُستدعى فيها الرب شاهدًا وصاحبَ سلطة.'
    reason: lexical_alternative
  - marker: b
    text: لفظ «الإخوة» في اليونانية جمع مذكر، ويُرجَّح أنه يشير هنا إلى الجماعة كلها، بمن فيها النساء.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: أستحلفكم
  rationale: الفعل يدل على إلزام المخاطَبين بقَسَم أو مناشدتهم مناشدةً مغلَّظة؛ و«أستحلفكم» تعبير عربي واضح يحفظ قوة الصيغة وإيجازها.
- source_word: τὸν κύριον
  choice: بالرب
  rationale: مع ἐνορκίζω يمكن أن يدل النصب على مَن يُستحلَف به وتُستدعى سلطته؛ و«بالرب» هو التركيب العربي الطبيعي الموافق لهذا المعنى، مع بقاء احتمال فهم الرب شاهدًا وسلطةً للمناشدة.
- source_word: ἀναγνωσθῆναι
  choice: أن تُقرأ
  rationale: يحفظ المبني للمجهول في المصدر اليوناني، والسياق يرجّح قراءة الرسالة على الجماعة من غير حاجة إلى إضافة «علانية» أو «بصوت عالٍ» في المتن.
- source_word: τὴν ἐπιστολήν
  choice: هذه الرسالة
  rationale: المقصود هو الكتاب الحاضر نفسه؛ واسم الإشارة طبيعي في العربية ويوضح الإحالة السياقية، وإن كان اليوناني يستعمل أداة التعريف وحدها.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: على الإخوة جميعًا
  rationale: يحافظ «الإخوة» على صيغة الجمع المذكر في اليونانية، بينما يبيّن الهامش أن الاستعمال قد يشمل جماعة المؤمنين كلها، ومن ضمنها النساء.
theological_decisions:
- issue: مدلول ἀδελφοῖς في جماعة يُرجَّح أنها تضم رجالًا ونساءً
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: النص اليوناني بصيغة الجمع المذكر، لذلك حُفظت في المتن دون حسم دلالتها التمثيلية بتوسيع صريح؛ وأُثبت في الهامش أن الاستعمال البولسي قد يشمل النساء.
- issue: علاقة «الرب» بفعل الاستحلاف
  choice: بالرب
  alternative: أمام الرب
  rationale: النصب اليوناني مع فعل الاستحلاف يحتمل استدعاء الرب بوصفه صاحب السلطة أو مَن يكون به الاستحلاف. اختير التعبير العربي المباشر «بالرب»، مع توضيح البعد الدلالي في الهامش دون إلغاء التوتر المحتمل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أستحلفكم» لصون قوة الأمر الرسمي، وحُفظ المبني للمجهول في «أن تُقرأ»، مع تجنّب إضافة تفسير غير مصرح به مثل «بصوت عالٍ» إلى المتن.
