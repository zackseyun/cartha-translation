  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: ar
  text: ولْيُقَدِّسْكُم إلهُ السلام نفسه تقديسًا كاملًا، ولْتُحفَظْ ذاتُكم كلُّها—روحُكم ونفسُكم وجسدُكم[b]—بلا لوم عند مجيء ربنا يسوع المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: عند حضور ربنا يسوع المسيح؛ فاللفظ اليوناني يمكن أن يدل على المجيء أو الحضور، ويُستعمل هنا عن ظهوره المرتقب.'
    reason: alternative_reading
  - marker: b
    text: 'يذكر بولس «الروح والنفس والجسد». ويختلف المفسرون: هل يقرر بذلك أن الإنسان مكوَّن من ثلاثة أقسام، أم يشدد بهذه العبارة على الإنسان كله؟'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης
  choice: إلهُ السلام نفسه
  rationale: يحفظ اللقب البولسي ويبرز دلالة Αὐτός التوكيدية، بينما يُفهم δέ هنا انتقالًا في السياق ولا يحتاج إلى مقابل مستقل ثقيل في العربية.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: ولْيُقَدِّسْكُم ... تقديسًا كاملًا
  rationale: صيغة الأمر بلام الدعاء تؤدي معنى التمني أو الصلاة في صيغة الاختيار اليونانية، والمفعول المطلق الموصوف ينقل معنى التقديس الكامل بوضوح.
- source_word: ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: روحُكم ونفسُكم وجسدُكم كاملةً
  rationale: يحافظ على العناصر الثلاثة المذكورة صراحةً وعلى معنى الكمال أو السلامة في ὁλόκληρον، من غير دمجها أو بناء مذهب أنثروبولوجي عليها.
- source_word: ἀμέμπτως ... τηρηθείη
  choice: ولْتُحفَظْ ... بلا لوم
  rationale: المبني للمجهول مع لام الدعاء ينقل صيغة التمني، و«بلا لوم» تعبير عربي طبيعي عن الحالة المقصودة.
- source_word: ἐν τῇ παρουσίᾳ
  choice: عند مجيء
  rationale: في السياق الأخروي البولسي تدل παρουσία على المجيء أو الحضور المرتقب؛ و«عند مجيء» واضحة وطبيعية.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته اللقبية من غير الاكتفاء بالنقل الصوتي الأجنبي.
theological_decisions:
- issue: ذكر الروح والنفس والجسد
  choice: إبقاء التعبير الثلاثي كما ورد، مع إسناد معنى الكمال إلى المجموعة كلها
  alternative: فهم العبارة أسلوبًا شموليًا يشير إلى الإنسان كله، أو عدّها تقسيمًا تقنيًا للطبيعة البشرية
  rationale: النص يسمّي العناصر الثلاثة لكنه لا يحسم هل المقصود تقرير تقسيم أنثروبولوجي رسمي أم التشديد البلاغي على الإنسان كله؛ لذلك تُحفظ العبارة والتوتر التفسيري في الحاشية.
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: مسيّا
  rationale: «المسيح» في العربية الفصحى هو اللقب الكتابي الطبيعي والمفهوم، ويؤدي معنى الممسوح الذي يحمله اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة دعائية مهيبة. استُخدمت لام الدعاء مع المضارع في الجملتين لنقل صيغتي التمني اليونانيتين، وحُفظ ترتيب «الروح والنفس والجسد» كما في المصدر.
