  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: ar
  text: لأن الله لم يعيّننا للغضب، بل لنيل الخلاص[a] على يد ربنا يسوع المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تدل العبارة أيضًا على «اقتناء الخلاص» أو «امتلاكه»، وربما «الحفظ المؤدي إلى الخلاص»؛ فللاسم اليوناني περιποίησις مجال دلالي أوسع من «نيل».
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني Χριστός لقب معناه «المسيح»، أي «الممسوح»، وليس اسم عائلة.
    reason: title_clarification
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تؤدي الأداة هنا معنى التعليل، إذ تسند العبارة ما سبقها في السياق.
- source_word: ἔθετο
  choice: يعيّننا
  rationale: يفيد الفعل مع εἰς جعل أشخاص لغاية أو مآل معين. و«يعيّن» يحفظ هذا المعنى دون أن يحمّل العبارة صياغة مذهبية أشد من النص.
- source_word: εἰς ὀργὴν
  choice: للغضب
  rationale: «الغضب» هو المقابل المباشر لـὀργή، ويرجح في هذا السياق الأخروي أن يكون غضب الله، من غير استبداله بتفسير أوسع مثل «الدينونة».
- source_word: περιποίησιν σωτηρίας
  choice: لنيل الخلاص
  rationale: هذه صياغة عربية طبيعية تعبّر عن بلوغ الخلاص بوصفه المآل المقابل للغضب، مع بيان سعة دلالة περιποίησις في الحاشية.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: على يد ربنا يسوع المسيح
  rationale: تدل διά مع المضاف إليه على الوسيلة أو الوكالة؛ و«على يد» تؤدي هذا المعنى بوضوح في العربية. أما Χριστός فترجمته العربية الطبيعية والمستقرة هي «المسيح».
theological_decisions:
- issue: هل يحمل ἔθετο هنا معنى حتميًا أقوى متعلقًا بالتقدير السابق؟
  choice: لم يعيّننا للغضب
  alternative: لم يقدّر لنا الغضب
  rationale: يثبت النص قصد الله أو تعيينه بشأن مآل المؤمنين، لكنه لا يستلزم وحده صياغة مذهبية مفصلة عن التقدير السابق؛ لذلك تحافظ «يعيّن» على قوة القول وعلى التوتر اللاهوتي.
- issue: هل يُعامل Χριστός كلقب ذي معنى أم كاسم مألوف؟
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» في العربية لقب مفهوم ومستقر ليسوع ويقابل Χριστός مباشرة، كما يحفظ دلالته المسيانية من غير غرابة «الممسوح» في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «على يد» لإظهار معنى الوسيلة في διά، ووُضعت الحاشية [a] عند العبارة التي تتعلق بها فعليًا، أي «نيل الخلاص».
