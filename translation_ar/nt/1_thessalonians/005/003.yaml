  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: ar
  text: 'حين يقولون: «سلام وأمان»، عندئذٍ يحلّ بهم هلاك مفاجئ، كما تحلّ آلامُ المخاض بالمرأة الحامل، ولن يفلتوا أبدًا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في اليونانية نفي مؤكَّد، أي: «ولن يفلتوا بأي حال».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: حين يقولون
  rationale: ينقل أداة الزمن مع صيغة الاحتمال في سياق مستقبلي، ويحافظ على الفاعل الجمع غير المعيّن من غير إيحاء بالتكرار المعتاد.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: سلام وأمان
  rationale: «سلام» مقابل طبيعي لـεἰρήνη، و«أمان» ينقل معنى ἀσφάλεια بوصفه حالة من السلامة والاطمئنان، وهو اقتران عربي واضح ومألوف.
- source_word: τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος
  choice: عندئذٍ يحلّ بهم هلاك مفاجئ
  rationale: «عندئذٍ» تحفظ علاقة النتيجة الزمنية، و«يحلّ بهم» تعبر طبيعيًا عن وقوع الحدث عليهم، و«هلاك» يحفظ شدة ὄλεθρος من غير تحديد لطبيعته أو مدته.
- source_word: ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ
  choice: كما تفاجئ آلامُ المخاض المرأةَ الحامل
  rationale: ينقل التشبيه وصورة آلام الولادة بلغة عربية طبيعية؛ وإضافة «تفاجئ» مفهومة من المقابلة مع الهلاك المفاجئ ومن وقوع الآلام على الحامل.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: ولن يفلتوا أبدًا
  rationale: تنقل «لن» مع «أبدًا» النفي اليوناني المؤكد المتجه إلى المستقبل، بصياغة عربية معاصرة قوية.
theological_decisions:
- issue: دلالة ὄλεθρος في سياق الإنذار الأخروي
  choice: هلاك
  alternative: دمار؛ خراب
  rationale: «هلاك» يحفظ جسامة الدينونة من غير أن يحسم هل المقصود فناءً أو نوعًا بعينه من العقاب، وبذلك تبقى حدود الدلالة والتوتر اللاهوتي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أمان» بدل «أمن» لأن العبارة تصف حالة السلامة والاطمئنان بصورة طبيعية، واستُعمل «آلام المخاض» بوصفه التعبير العربي الجاري لصورة الولادة. وُضع مؤشر الحاشية بعد الجملة التي تشرحها.
