lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: تُكْرِموهم
  rationale: 'الفعل هنا ذو معنى تقويمي: أن يعدّهم المؤمنون جديرين بالتقدير والإكرام، لا أن ينسبوا إليهم القيادة؛ و«تكرموهم» تعبير عربي طبيعي يحمل معنى التقدير العملي.'
- source_word: ὑπερεκπερισσοῦ
  choice: غايةَ الإكرام
  rationale: الظرف اليوناني نادر وشديد التوكيد، وهذه الصياغة تنقل المبالغة بوضوح وفصاحة من غير تركيب عربي متكلف.
- source_word: ἐν ἀγάπῃ
  choice: في المحبة
  rationale: تحافظ الصياغة على حرف الجر وعلى لفظ «المحبة»، وتبين المجال أو الكيفية التي يكون فيها الإكرام.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: بسبب عملهم
  rationale: تفيد διά مع النصب هنا العلة أو الأساس، وتحافظ «عملهم» على الاسم الملموس ἔργον.
- source_word: εἰρηνεύετε
  choice: عيشوا بسلام
  rationale: الأمر المضارع يحث على حالة وممارسة مستمرتين؛ و«عيشوا بسلام» عربية واضحة وطبيعية.
- source_word: ἐν ἑαυτοῖς
  choice: فيما بينكم
  rationale: الضمير الانعكاسي الجمعي يشير إلى السلام داخل جماعة المؤمنين، و«فيما بينكم» تنقل هذا المعنى المجتمعي بوضوح.
- source_word: καὶ
  choice: وأن
  rationale: تصل العبارة بالوصية السابقة، ومع المصدر المؤول تستقيم متابعة التركيب العربي في سياقه.
- source_word: αὐτούς
  choice: هم
  rationale: يعود الضمير على الذين يتعبون بين المؤمنين ويرأسونهم وينذرونهم في الآية السابقة.
