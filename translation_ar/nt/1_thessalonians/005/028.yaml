translation:
  language: ar
  text: لِتَكُنْ نِعْمَةُ رَبِّنَا يَسُوعَ الْمَسِيحِ مَعَكُمْ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَة
  rationale: اللفظ اليوناني في بركات بولس الختامية يدل على نعمة الله وإحسانه؛ و«نعمة» هي المقابل العربي الراسخ والدقيق.
- source_word: κυρίου
  choice: رَبّ
  rationale: يَرِد هنا لقبًا ليسوع، وتحافظ «رب» على دلالته وسياقه المسيحاني.
- source_word: Ἰησοῦ
  choice: يَسُوع
  rationale: نقل الاسم بصيغته العربية الكتابية المألوفة.
- source_word: Χριστοῦ
  choice: الْمَسِيح
  rationale: ترجمة اللقب اليوناني بمعناه، وهو «المسيح»، صياغة طبيعية وراسخة في العربية وتحفظ دلالته المسيحانية.
- source_word: μεθ’ ὑμῶν
  choice: مَعَكُمْ
  rationale: مقابل مباشر لعبارة «معكم»، مع إضمار فعل الكينونة في الأصل اليوناني واستحضاره عربيًا بصيغة الدعاء «لتكن».
- source_word: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: نِعْمَةُ رَبِّنَا يَسُوعَ الْمَسِيحِ
  rationale: نُقلت سلسلة المضاف والمضاف إليه بوضوح، مع إبقاء «المسيح» لقبًا ظاهرًا ليسوع.
theological_decisions:
- issue: دلالة Χριστοῦ في صيغة الختام البولسية
  choice: الْمَسِيح
  alternative: كريستوس
  rationale: اللفظ لقب ذو معنى مسيحاني واضح، وترجمته «المسيح» أدق وأطبع في العربية من نقله صوتيًا.
- issue: كيفية تمثيل صيغة البركة الخالية من الفعل في اليونانية
  choice: لِتَكُنْ ... مَعَكُمْ
  alternative: نِعْمَةُ ... مَعَكُمْ
  rationale: الأصل عبارة اسمية موجزة تُفهم بوصفها دعاءً أو بركة. أُضيفت «لتكن» لتوضيح قوة التمني طبيعيًا في العربية من غير تغيير مضمون العبارة.
translation_notes:
  register: عربية فصحى واضحة ومهيبة، بصيغة بركة ختامية طبيعية. لا توجد علامة حاشية لأن النص العربي المقترح لا يحتاج إلى بديل نصي أو ترجمي ذي أثر معتبر.
