  source_fidelity: 'النص العربي ينقل جميع عناصر اليونانية بأمانة: «النعمة» لـ χάρις، و«ربنا يسوع المسيح» لسلسلة الإضافة اليونانية، و«معكم» لـ μεθ’ ὑμῶν. وصيغة «لتكن» تمثيل عربي سليم لقوة الدعاء/البركة المفهومة من العبارة اليونانية الاسمية الخالية من الفعل.'
  naturalness: 'الصياغة فصيحة واضحة وطبيعية بوصفها بركة ختامية: «لِتَكُنْ نِعْمَةُ رَبِّنَا يَسُوعَ الْمَسِيحِ مَعَكُمْ.» وهي موجزة ومهيبة من غير تكلّف.'
  terminology: «نعمة» و«رب» و«يسوع المسيح» مصطلحات عربية كتابية مستقرة، وتحفظ دلالة اللقب المسيحاني ووزنه في الصيغة البولسية. ضبط «يَسُوعَ» منسجم مع موقع الاسم التابع في هذا التركيب.
