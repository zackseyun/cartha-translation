  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: ar
  text: لِأَنَّ الَّذِينَ يَنَامُونَ يَنَامُونَ لَيْلًا، وَالَّذِينَ يَسْكَرُونَ يَسْكَرُونَ لَيْلًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تُدخِل تعليلًا لما سبق، وتحفظ الصلة التفسيرية الطبيعية في العربية.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: الَّذِينَ يَنَامُونَ ... يَنَامُونَ
  rationale: تعبير عام يحفظ تكرار فعل النوم والتوازي البلاغي في اليونانية.
- source_word: νυκτός
  choice: فِي اللَّيْلِ
  rationale: مضاف إليه مستعمل استعمالًا ظرفيًّا؛ وهذه صياغة عربية واضحة وموجزة للدلالة الزمنية.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: الَّذِينَ يَسْكَرُونَ ... يَسْكَرُونَ
  rationale: يحفظ الفعل المباشر والتكرار المقصود والتوازي مع جملة النوم، من غير تحويل الصورة إلى تفسير معنوي.
- source_word: καί
  choice: وَ
  rationale: حرف عطف بسيط يصل بين الجملتين المتوازيتين.
theological_decisions:
- issue: هل يُفهم النوم والسُّكر حرفيًّا أم مجازيًّا في هذا التعليل؟
  choice: الإبقاء على صورتي النوم والسُّكر الحرفيتين في النص
  alternative: التصريح بالغفلة الروحية والانفلات الأخلاقي
  rationale: يستعمل بولس هنا سلوكًا اعتياديًّا مرتبطًا بالليل لتوضيح الحث السابق. وتحفظ الترجمة الحرفية التشبيه والتوتر بين الصورة وتطبيقها الروحي من غير إدخال التفسير في صلب النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُدِّم الظرف «ففي الليل» في كل شطر لإبراز التوازي والتركيز الموجودين في ترتيب النص اليوناني، مع الحفاظ على تكرار الفعلين.
