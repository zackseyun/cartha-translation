  text: لا تُطفئوا الروح،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الروح» بمعنى أعم. يمكن أن يدل اللفظ اليوناني على الروح بوجه عام، لكن الأرجح هنا أنه يشير إلى الروح القدس، ولا سيما في ضوء ذكر النبوّات بعد ذلك.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: الاسم المعرَّف في هذا السياق من وصايا بولس، ولا سيما مع ذكر النبوّات بعده مباشرة، يُرجَّح أن يشير إلى الروح القدس. ولفظ «الروح» في العربية يحافظ أيضًا على قدر من الاحتمال الموجود في اليونانية.
- source_word: μὴ
  choice: لا
  rationale: تأتي μή مع فعل الأمر المضارع لصياغة النهي، وأسلوب «لا» مع المضارع هو المقابل العربي الطبيعي المباشر.
- source_word: σβέννυτε
  choice: تُطفئوا
  rationale: الفعل يعني حرفيًا إخماد النار أو إطفاءها، وهنا يُستعمل مجازًا. يحفظ «تُطفئوا» صورة النص الأصلية بعبارة عربية واضحة ومألوفة.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: الروح القدس
  alternative: الروح بمعنى أعم، مثل روح الإنسان أو النشاط الروحي
  rationale: يرجّح سياق النبوّات والتمييز في الآيتين التاليتين أن المقصود هو الروح القدس، لكن اللفظ اليوناني نفسه يمكن أن يُفهم بمعنى أعم؛ لذلك أُبقيت القراءة المرجّحة في المتن، وذُكر البديل في الحاشية دون حسم زائد.
translation_notes:
  register: صياغة عربية فصحى حديثة موجزة ومهيبة. حُفظ مجاز إطفاء النار كما في الأصل، واستُعمل «الروح» بوصفه التعبير العربي الطبيعي المرجّح للروح القدس، مع توثيق الاحتمال الأعم في الحاشية.
