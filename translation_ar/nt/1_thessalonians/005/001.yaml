lexical_decisions:
- source_word: Περὶ δὲ
  choice: أمّا عن
  rationale: تفتتح موضوعًا جديدًا وتحفظ وظيفة δέ الانتقالية من غير أن تجعلها مقابلة قوية أو تضيف معنى زمنيًا غير موجود.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: الأزمنة والأوقات
  rationale: تحفظ اللفظين المتقاربين وتميّز إجمالًا بين امتداد الزمن والأوقات المحددة أو الملائمة، مع بقاء العبارة طبيعية بالعربية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تنقل صيغة النداء المذكرة في اليونانية، مع بيان شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: οὐ χρείαν ἔχετε
  choice: فلا حاجة بكم
  rationale: تعبير عربي فصيح وطبيعي يؤدي معنى انتفاء الضرورة ويحافظ على توجيه الكلام إلى المخاطبين.
- source_word: ὑμῖν γράφεσθαι
  choice: إلى أن يُكتب إليكم شيء
  rationale: يحفظ المبني للمجهول ولا يفرض فاعلًا غير مصرح به؛ وأضيفت «شيء» لإتمام التركيب العربي طبيعيًا.
theological_decisions:
- issue: الخطاب المذكر الموجه إلى الكنيسة
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: النص اليوناني يستعمل جمعًا مذكرًا، لكنه يُرجح أن يخاطب جماعة المؤمنين كلها؛ لذلك حُفظت صيغة المصدر في المتن ووُضح الشمول في الحاشية.
- issue: دلالة عبارة الأزمنة والأوقات
  choice: إبقاء اللفظين في عبارة مزدوجة
  alternative: المواعيد المحددة
  rationale: السياق الأخروي لا يقتضي دمج اللفظين أو تفسيرهما تفسيرًا أضيق؛ فحُفظ التوتر الدلالي بين الزمن عمومًا والوقت الملائم أو المعين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أمّا عن» للانتقال الموضوعي، وحُفظ المبني للمجهول والغموض في هوية الكاتب المقصود، مع وضع كل علامة حاشية بعد العبارة التي تشرحها.
