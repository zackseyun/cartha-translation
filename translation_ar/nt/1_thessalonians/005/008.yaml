  to: وأما نحن، إذ نحن من أهل النهار، فلنكن متيقظين، لابسين درع الإيمان والمحبة، ومتخذين رجاء الخلاص خوذةً.
  rationale: استُبدلت العبارة الزمنية «ما دمنا من النهار» بـ«إذ نحن من أهل النهار» لصون معنى الانتماء الاستعاري في الأصل مع بيان صلته بالحث. واستُعمل «متيقظين» بوصفه أمتن في سياق السهر والرزانة. وأعيدت صياغة صورة الخوذة إلى «متخذين رجاء الخلاص خوذةً» لتكون عربية واضحة وتبيّن أن رجاء الخلاص هو الخوذة، من غير تغيير في المعنى. حُذفت الحاشية ب لأنها لا تحفظ بديلًا دلاليًا مستقلًا، بل تكرر ترتيبًا أسلوبيًا أقل وضوحًا.
