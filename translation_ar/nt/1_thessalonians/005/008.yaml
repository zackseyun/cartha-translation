  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: ar
  text: وأما نحن، إذ نحن من أهل النهار، فلنكن متيقظين، لابسين درع الإيمان والمحبة، ومتخذين رجاء الخلاص خوذةً.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: وأما نحن
  rationale: تُظهر المقابلة مع المذكورين قبلًا، وتأتي عربيةً طبيعية من غير زيادة تفسيرية.
- source_word: ἡμέρας ὄντες
  choice: ما دمنا من النهار
  rationale: تحفظ صورة الانتماء إلى النهار، وتعبّر طبيعيًا عن صلة العبارة الحالية بالحث اللاحق.
- source_word: νήφωμεν
  choice: فلنكن صاحين
  rationale: تحفظ دلالة الصحو التي تتضمن اليقظة وضبط النفس، وتلائم مقابلة الليل والنهار في السياق.
- source_word: ἐνδυσάμενοι
  choice: لابسين
  rationale: اسم الحال يبيّن أن لبس السلاح يصاحب الصحو ويجسّده، من غير تشديد غير لازم على سبق الفعل زمنيًا.
- source_word: θώρακα
  choice: درع
  rationale: لفظ عسكري عربي واضح يدل هنا على الدرع الواقي للجذع.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المقابل الأرجح في ثلاثية الإيمان والمحبة والرجاء، مع إثبات احتمال «الأمانة» في الحاشية.
- source_word: ἀγάπης
  choice: المحبة
  rationale: المقابل المباشر والطبيعي لفضيلة ἀγάπη في هذا السياق.
- source_word: περικεφαλαίαν
  choice: خوذة
  rationale: المقابل العسكري المباشر والواضح.
- source_word: ἐλπίδα σωτηρίας
  choice: رجاء الخلاص
  rationale: يحفظ تركيب الإضافة واحتمال تعلق الرجاء بالخلاص من غير توسيع تفسيري.
theological_decisions:
- issue: دلالة πίστις في صورة السلاح
  choice: الإيمان
  alternative: الأمانة
  rationale: اقترانها بالمحبة والرجاء يرجّح اسم الفضيلة «الإيمان»، لكن معنى الأمانة ممكن معجميًا ولذلك حُفظ في الحاشية.
- issue: قوة عبارة ἡμέρας ὄντες
  choice: ما دمنا من النهار
  alternative: إذ نحن من أهل النهار
  rationale: الصياغة المختارة تحفظ استعارة النهار وعلاقتها المنطقية بالحث، من غير أن تضيف شرحًا عقديًا لهوية المخاطَبين.
- issue: العلاقة بين الخوذة ورجاء الخلاص
  choice: وخوذةً هي رجاء الخلاص
  alternative: وخوذة رجاء الخلاص
  rationale: توضح الصياغة أن رجاء الخلاص هو الخوذة مع إبقاء الاستعارة نفسها، بينما يظل تركيب الإضافة الأقرب إلى ترتيب اليونانية ممكنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظت صور النهار والصحو والسلاح، مع تجنب المصطلحات الطائفية والتفسير الزائد.
