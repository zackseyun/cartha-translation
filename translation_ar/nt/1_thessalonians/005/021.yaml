translation:
  language: ar
  text: وأما كلُّ شيءٍ فاختبروه، وتمسَّكوا بما هو صالح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأشياء كلَّها». وفي السياق يشمل هذا بوجه خاص تقييم الأقوال النبوية.'
    reason: بديل معجمي وبيان للسياق من غير تقييد سعة اللفظ اليوناني.
lexical_decisions:
- source_word: πάντα
  choice: كلَّ شيء
  rationale: تؤدي العبارة معنى الجمع المحايد الشامل بصياغة عربية طبيعية، من غير تقييد الأمر صراحةً بالنبوات وحدها.
- source_word: δὲ
  choice: بل
  rationale: تفيد انتقالًا ذا مسحة استدراكية بعد النهي السابق، وتربط رفض احتقار النبوات بوجوب اختبارها بدل قبولها أو رفضها بلا تمييز.
- source_word: δοκιμάζετε
  choice: اختبروا
  rationale: تنقل معنى الفحص والتقييم للتحقق من الصحة أو القيمة، وتحافظ على قوة صيغة الأمر المستمر في السياق.
- source_word: τὸ καλὸν
  choice: ما هو صالح
  rationale: صياغة عربية طبيعية للصفة المحايدة المستعملة استعمال الاسم، وتشير إلى ما يثبت صلاحه بعد الاختبار.
- source_word: κατέχετε
  choice: تمسَّكوا
  rationale: تعبر عن الاحتفاظ الراسخ والمداومة على الالتزام، لا مجرد إبقاء الشيء في الحيازة.
theological_decisions:
- issue: نطاق πάντα في سياق النبوة والتمييز
  choice: الإبقاء على النطاق الشامل بعبارة «كل شيء»، مع بيان صلة السياق المباشر بفحص الأقوال النبوية في الحاشية.
  alternative: تقييدها في المتن إلى «كل نبوة» أو «كل ما يُقال».
  rationale: النص اليوناني يستعمل πάντα بلا اسم يقيّده، وإن كان السياق السابق مباشرةً يتناول النبوات؛ لذلك تُصان سعة العبارة في المتن من غير إغفال دلالة السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «صالح» بدل تعبير فلسفي مجرد مثل «الخير»، و«تمسّكوا» لإظهار قوة الالتزام المستمر.
