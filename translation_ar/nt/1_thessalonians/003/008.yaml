- source_word: ζῶμεν
  choice: نحيا
  rationale: ترجمة مباشرة للفعل، مع إبقاء قوته البلاغية في السياق من غير تحويلها في المتن إلى شرح مثل «نشعر بالحياة».
- source_word: ἐὰν
  choice: إن
  rationale: تحفظ صيغة الشرط في اليونانية ولا تحولها إلى تقرير سببي محض.
- source_word: ὑμεῖς
  choice: كنتم
  rationale: ضمير المخاطبين الجمع ظاهر في صيغة الفعل العربية، ويحافظ السياق على توجيه الكلام إليهم.
- source_word: στήκετε
  choice: ثابتين
  rationale: تعبير عربي طبيعي يدل على الرسوخ وعدم التزعزع، ويحافظ على معنى الاستمرار في الثبات.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ التعبير البولسي الموجز والغني دلاليًا دون تضييقه إلى تفسير عقدي بعينه.
theological_decisions:
- issue: قوة قول بولس «الآن نحيا»
  choice: الإبقاء على العبارة الحرفية بوصفها تعبيرًا بلاغيًا عن تجدد التشجيع والحيوية
  alternative: شرحها في المتن بمعنى «نشعر الآن بأننا أحياء حقًا» أو فهمها على أنها بقاء جسدي حرفي
  rationale: النص اليوناني يقول حرفيًا «نحيا»، بينما يشير السياق على الأرجح إلى الانتعاش والتشجيع؛ لذلك تُحفظ العبارة ويُوضح احتمالها البلاغي في الحاشية.
- issue: معنى «في الرب»
  choice: الإبقاء على الصيغة «في الرب»
  alternative: «في اتحادكم بالرب» أو «أمناء للرب»
  rationale: العبارة تصف مجال الثبات وعلاقته بالرب، وهي أوسع من أن تُحصر في صياغة مذهبية محددة.
- issue: الشرط في «إن كنتم ثابتين»
  choice: الحفاظ على البنية الشرطية
  alternative: «ما دمتم ثابتين»
  rationale: «إن» أقرب إلى ἐὰν وتحفظ التوتر البلاغي في العبارة، في حين قد تجعل «ما دمتم» المعنى تقريرًا زمنيًا أو سببيًا أكثر مما يصرح به الأصل.
translation_notes:
