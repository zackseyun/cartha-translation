  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: ar
  text: كي لا يتزعزع أحد[a] بسبب هذه الضيقات[b]. فأنتم أنفسكم تعلمون أننا مُعيَّنون لهذا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يضطرب» أو «يفقد ثباته». والفعل اليوناني نادر، وقد يحمل في سياقات أخرى معنى «يُخدع» أو «يُستمال بالتملق».
    reason: lexical_alternative
  - marker: b
    text: أو «الشدائد».
    reason: lexical_alternative
  - marker: c
    text: أو «مقدَّر لنا هذا» أو «موضوعون لهذا».
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: كي لا يتزعزع أحد
  rationale: تفيد صيغة المصدر المعرّف هنا الغرض أو النتيجة المتصلة بما قبلها. والفعل σαίνεσθαι نادر، ويرجح في السياق معنى الاضطراب وفقدان الثبات تحت وطأة المعاناة؛ لذا ينقل «يتزعزع» المعنى الرعوي بوضوح مع إبقاء البدائل في الحاشية.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: بسبب هذه الضيقات
  rationale: تدل θλίψεις على الضيق والشدائد والضغط. ومع فعل «يتزعزع» تؤدي «بسبب» معنى الظرف أو الوسيلة الذي تعبّر عنه ἐν في هذا السياق بصورة عربية طبيعية.
- source_word: αὐτοὶ
  choice: أنتم أنفسكم
  rationale: يحفظ هذا التعبير توكيد الضمير اليوناني.
- source_word: γὰρ
  choice: فـ
  rationale: الفاء تربط الجملة بتعليل ما سبق ربطًا عربيًا موجزًا وطبيعيًا.
- source_word: οἴδατε
  choice: تعلمون
  rationale: مع أن صيغة οἶδα تامة من حيث الشكل، فإن معناها هنا حاضر، و«تعلمون» هو المقابل العربي الطبيعي.
- source_word: εἰς τοῦτο
  choice: لهذا
  rationale: يشير التعبير بإيجاز إلى الضيقات المذكورة، من غير إضافة تفسير أوسع من النص.
- source_word: κείμεθα
  choice: مُعيَّنون
  rationale: المعنى الحرفي للفعل هو الوجود في موضع أو الحال الموضوعة، لكنه في هذا التركيب يفيد التعيين أو الوضع لأمر ما. و«مُعيَّنون» يحفظ دلالة الحالة الواقعة على المتكلمين من غير إيحاء جبري زائد.
theological_decisions:
- issue: علاقة المؤمنين بالمعاناة في εἰς τοῦτο κείμεθα
  choice: أننا مُعيَّنون لهذا
  alternative: أن هذا هو نصيبنا / أننا موضوعون لهذا
  rationale: يفيد النص أن الضيقات جزء متوقَّع من طريق المؤمنين، لكنه لا يشرح هنا نظرية تفصيلية في القضاء السابق. وتحفظ «مُعيَّنون» ثقل العبارة مع تجنب تحميلها مذهبًا طائفيًا محددًا.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حُفظ توكيد «أنتم أنفسكم»، واستُخدم «يتزعزع» لما فيه من تصوير لفقدان الثبات، مع توثيق ندرة الفعل اليوناني واتساعه الدلالي في الحاشية.
