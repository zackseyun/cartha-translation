base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: ar
  text: لكي يثبّت قلوبكم بلا لوم في القداسة أمام إلهنا وأبينا، عند مجيء ربنا يسوع مع جميع قدّيسيه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مع جميع مقدّسيه». قد تشير الكلمة اليونانية هنا إلى أناس مقدّسين، أو ملائكة، أو كليهما.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: لكي يثبّت
  rationale: تفيد صيغة حرف الجر مع المصدر المعرّف الغاية أو النتيجة المتصلة بما قبلها؛ وصياغة «لكي يثبّت» طبيعية وتحفظ هذه الدلالة.
- source_word: καρδίας
  choice: قلوبكم
  rationale: تحفظ الصورة اليونانية المألوفة، وتشير في السياق البولسي إلى باطن الإنسان لا إلى العواطف وحدها.
- source_word: ἀμέμπτους ἐν ἁγιωσύνῃ
  choice: بلا لوم في القداسة
  rationale: تنقل ἀμέμπτους معنى انتفاء ما يوجب اللوم، وتحفظ ἐν ἁγιωσύνῃ بوصفها حالة أو صفة القداسة.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: أمام إلهنا وأبينا
  rationale: صياغة مباشرة تحفظ البنية المنسقة في اليونانية ومعنى الوقوف في حضرة الله ونظره.
- source_word: ἐν τῇ παρουσίᾳ
  choice: عند مجيء
  rationale: في هذا السياق الأخروي تدل παρουσία على حضور الرب الآتي أو وصوله؛ و«مجيء» أوضح تعبير عربي مألوف.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: مع جميع قدّيسيه
  rationale: «قدّيسيه» مقابل عربي موجز وشائع لـ ἁγίων، مع إبقاء هوية المشار إليهم غير محسومة وشرح اتساع الدلالة في الحاشية.
theological_decisions:
- issue: المقصود بجميع قدّيسيه
  choice: 'أُبقي التعبير عامًا: «جميع قدّيسيه»'
  alternative: جميع ملائكته؛ أو جميع شعبه المقدّس
  rationale: لفظة ἁγίων قد تشير في هذا السياق الأخروي إلى البشر المقدّسين أو الملائكة أو كليهما؛ لذلك لا يحسم المتن ما لم يحسمه النص اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «بلا لوم» بدل صياغة أشد تقنية، وحُفظت صورة «القلوب» والغموض المقصود في «قدّيسيه».
