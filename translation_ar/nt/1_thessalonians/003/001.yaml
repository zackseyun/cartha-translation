lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: تفيد نتيجةً مستخلصة من السياق السابق، وتحافظ «لذلك» على الصلة المنطقية بوضوح.
- source_word: μηκέτι
  choice: لم نعد
  rationale: تعبّر عن بلوغ حدّ لم يعد معه الاستمرار ممكنًا، وهي الصياغة العربية الطبيعية مع فعل الاحتمال.
- source_word: στέγοντες
  choice: نحتمل
  rationale: يحمل الفعل هنا معنى الصبر على وطأة القلق أو تحمّلها، لا معنى الستر الحرفي الممكن في سياقات أخرى.
- source_word: εὐδοκήσαμεν
  choice: رأينا أنه من الحسن
  rationale: تحافظ العبارة على معنى الاستحسان والقبول الإرادي، من غير اختزاله في قرار عملي محض أو الإيحاء بالسرور العاطفي.
- source_word: καταλειφθῆναι
  choice: أن نُترك
  rationale: تحافظ الصياغة على المصدر المبني للمجهول، ولا تضيف معنى «خلف» غير المصرَّح به صراحةً.
- source_word: ἐν Ἀθήναις
  choice: في أثينا
  rationale: ترجمة مكانية مباشرة لاسم المدينة.
- source_word: μόνοι
  choice: وحدنا
  rationale: تنقل وصف جماعة المتكلمين بصيغة الجمع، وتمهّد طبيعيًا لذكر إرسال تيموثاوس في الآية التالية.
theological_decisions:
- issue: مرجع ضمير المتكلمين بصيغة الجمع والتوتر بين الجمع والسياق التاريخي الأوسع
  choice: الإبقاء على صيغة الجمع في «لم نعد» و«رأينا» و«نُترك وحدنا».
  alternative: 'اعتبار الجمع أسلوبًا رسائليًا يقصد به بولس نفسه، وصياغة العبارة بالمفرد: «رأيت أن أبقى وحدي».'
  rationale: النص اليوناني يستعمل صيغ الجمع صراحةً (εὐδοκήσαμεν، μόνοι)، لذلك ينبغي ألا تحسم الترجمة الخلاف حول ما إذا كان بولس يتكلم عن نفسه أم عن فريق الخدمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «رأينا أنه من الحسن» لنقل الاستحسان الإرادي في εὐδοκήσαμεν، مع الحفاظ على المبني للمجهول وصيغة الجمع وعلى قدر الالتباس الموجود في الأصل.
