id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: ar
  text: لِهَذَا، لَمَّا لَمْ أَعُدْ أَحْتَمِلُ، أَرْسَلْتُ لِأَعْرِفَ إِيمَانَكُمْ[a]، خَشْيَةَ أَنْ يَكُونَ الْمُجَرِّبُ قَدْ جَرَّبَكُمْ، وَيُصْبِحَ تَعَبُنَا بِلَا جَدْوَى[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمانتكم» أو «ثقتكم». قد تحمل الكلمة اليونانية معاني متداخلة بحسب السياق.
    reason: alternative_reading
  - marker: b
    text: أو «سُدًى» أو «باطلًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهَذَا
  rationale: تعبير سببي موجز وطبيعي يحافظ على الإحالة إلى ما سبق.
- source_word: κἀγὼ
  choice: لَمَّا لَمْ أَعُدْ أَحْتَمِلُ
  rationale: لم يُفرد عنصر καί بلفظ مستقل لأن العربية لا تحتاج إليه هنا، وبقي المتكلم ظاهرًا في الفعل؛ وصيغ التركيب مع μηκέτι στέγων بأسلوب عربي طبيعي.
- source_word: μηκέτι στέγων
  choice: لَمَّا لَمْ أَعُدْ أَحْتَمِلُ
  rationale: ينقل بلوغ قدرة بولس على الاحتمال حدها، مع حفظ العلاقة الزمنية الظرفية.
- source_word: ἔπεμψα
  choice: أَرْسَلْتُ
  rationale: أُبقي مفعول الإرسال محذوفًا كما في هذه الآية، من غير إدخال اسم تيموثاوس من السياق.
- source_word: εἰς τὸ γνῶναι
  choice: لِأَعْرِفَ
  rationale: ينقل غرض الإرسال بصياغة عربية واضحة ومباشرة.
- source_word: τὴν πίστιν ὑμῶν
  choice: إِيمَانَكُمْ
  rationale: هو المقابل المعتاد والأرجح سياقيًا لـ πίστις، مع إثبات إمكان معنى الأمانة أو الثقة في الحاشية.
- source_word: μή πως
  choice: خَشْيَةَ أَنْ
  rationale: يعبر طبيعيًا عن التخوف الذي يحمله التركيب اليوناني من غير الجزم بوقوع الأمر.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: يَكُونَ الْمُجَرِّبُ قَدْ جَرَّبَكُمْ
  rationale: يحفظ التكرار الاشتقاقي بين الفعل واسم الفاعل، كما يحفظ النظر إلى التجربة بوصفها أمرًا محتمل الوقوع قبل الإرسال.
- source_word: ὁ πειράζων
  choice: الْمُجَرِّبُ
  rationale: ينقل الوصف الاسمي من غير استبداله صراحة باسم الشيطان، وإن كان السياق يشير إليه.
- source_word: εἰς κενὸν γένηται
  choice: فَيَذْهَبَ ... سُدًى
  rationale: تعبير عربي فصيح وطبيعي يفيد انعدام الجدوى، ويحافظ على النتيجة المتخوَّفة.
- source_word: ὁ κόπος ἡμῶν
  choice: تَعَبُنَا
  rationale: يحفظ دلالة κόπος على العمل الشاق والجهد، لا مجرد العمل العام.
theological_decisions:
- issue: الدلالة المحتملة لكلمة πίστις
  choice: إِيمَانَكُمْ
  alternative: أَمَانَتَكُمْ أو ثِقَتَكُمْ
  rationale: السياق يتناول استمرار استجابة أهل تسالونيكي المؤمنة، لذلك «إيمانكم» هو الأرجح، مع عدم إلغاء التداخل الدلالي للكلمة اليونانية.
- issue: هوية ὁ πειράζων
  choice: الْمُجَرِّبُ
  alternative: الشَّيْطَانُ
  rationale: حُفظ الوصف الذي اختاره النص اليوناني بدل التصريح بالهوية المستفادة من السياق.
- issue: درجة اليقين في ἐπείρασεν بعد μή πως
  choice: خَشْيَةَ أَنْ يَكُونَ ... قَدْ جَرَّبَكُمْ
  alternative: لِئَلَّا يَكُونَ ... قَدْ جَرَّبَكُمْ
  rationale: الصياغة المختارة تحفظ قلق بولس واحتمال وقوع التجربة، فلا تقرر وقوعها ولا تنفيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فَيَذْهَبَ تَعَبُنَا سُدًى» بدل تركيب حرفي من قبيل «فيصير فارغًا» لأنه أفصح وأوضح، مع إبقاء العلامتين [a] و[b] في موضعيهما الصحيحين.
