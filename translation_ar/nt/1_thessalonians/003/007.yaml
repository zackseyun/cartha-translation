  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: ar
  text: لذلك تعزَّينا، أيها الإخوة[b]، بشأنكم، في كل ضيق وشدة لنا، بإيمانكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمانتكم». يمكن للكلمة اليونانية أن تدل على الإيمان أو الثقة أو الأمانة؛ ويبدو أنها تتضمن هنا معنى ثبات أهل تسالونيكي في إيمانهم.
    reason: alternative_reading
  - marker: b
    text: «الإخوة» هي صيغة بولس المعتادة في مخاطبة الجماعة، وقد تشمل جماعة المؤمنين كلها، رجالًا ونساءً.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تعبير سببي استنتاجي واضح يصل الآية بما سبقها، ويحافظ على إيجاز اليونانية.
- source_word: παρεκλήθημεν
  choice: تعزَّينا
  rationale: المبني للمجهول من παρακαλέω يدل هنا على نوال العزاء والراحة النفسية من خبر تيموثاوس، لا على الوعظ أو الحث.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في الأصل، وهي الصيغة المعتادة عند بولس في مخاطبة الجماعة.
- source_word: ἐφ’ ὑμῖν
  choice: من جهتكم
  rationale: يبين أن أهل تسالونيكي هم موضوع التعزية والاهتمام، من غير أن يوهم أنهم سبب الشدة والضيق.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: في كل ما نحن فيه من شدة وضيق
  rationale: صياغة عربية طبيعية تحافظ على لفظين متقاربين في وصف المعاناة، وتجعل العبارة ظرفًا للحالة التي نالوا فيها التعزية.
- source_word: ἀνάγκῃ
  choice: شدة
  rationale: ينقل معنى الضغط والضائقة في هذا السياق، ويتجنب معنى «الضرورة» الذي قد يكون مضللًا هنا.
- source_word: θλίψει
  choice: ضيق
  rationale: لفظ عربي مألوف وثقيل الدلالة يناسب معنى الكرب والاضطهاد أو المعاناة.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: بإيمانكم
  rationale: 'الباء تنقل معنى الوسيلة في διά مع المضاف إليه: كان إيمانهم الوسيلة التي نال بها بولس ورفقاؤه التعزية.'
- source_word: πίστεως
  choice: إيمانكم
  rationale: «الإيمان» هو المقابل الأساسي لـ πίστις هنا، مع إبقاء احتمال معنى الأمانة أو الثبات في الحاشية.
theological_decisions:
- issue: دلالة πίστις حيث قد يتضمن السياق معنى الثبات أو الأمانة
  choice: إيمانكم
  alternative: أمانتكم، أو ثباتكم في الإيمان
  rationale: يفيد السياق استمرار أهل تسالونيكي في الإيمان، وهو ما يتضمن الثبات؛ لكن اللفظ اليوناني لا يفرض حصر المعنى في «الأمانة»، لذلك حُفظ «الإيمان» في المتن وذُكر الاحتمال الآخر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. رُتبت العبارات بما يلائم العربية مع إبقاء «من جهتكم» مرتبطة بموضوع التعزية، لا بالشدة والضيق. وُضعت علامتا الحاشيتين عند اللفظين اللذين تفسرانهما مباشرة.
