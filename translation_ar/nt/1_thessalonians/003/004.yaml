  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: ar
  text: فحتى عندما كنا عندكم، كنا نقول لكم مسبقًا إننا سنعاني الضيق[a]، كما حدث بالفعل، وأنتم تعلمون ذلك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نُبتلى» أو «نقاسي الشدة». يدل الفعل اليوناني على التعرّض للضغط أو الكرب أو الاضطهاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فحتى
  rationale: تنقل الفاء القوة التفسيرية لـγάρ، وتؤدي «حتى» معنى التشديد في καί، بعبارة عربية طبيعية مرتبطة بالسياق السابق.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: حين كنا عندكم
  rationale: «عندكم» تعبير عربي طبيعي عن وجود بولس ورفيقيه في حضرتهم وبينهم، من غير تحميل العبارة معنى زائدًا.
- source_word: προελέγομεν ὑμῖν
  choice: كنا نقول لكم مسبقًا
  rationale: صيغة «كنا نقول» تعكس جانب الاستمرار أو التكرار في الماضي الذي يفيده الفعل الناقص، و«مسبقًا» تحفظ معنى القول قبل وقوع الأمر دون تحويله إلى تحذير صريح.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: إننا لا بد أن نعاني الضيق
  rationale: «لا بد أن» تعبّر هنا عن الأمر المنتظر والوشيك بحسب السياق، وتحفظ صيغة المتكلم الجمع؛ و«نعاني الضيق» واضحة ولا تحصر المعنى في الاضطهاد وحده.
- source_word: καθὼς καὶ ἐγένετο
  choice: كما حدث أيضًا
  rationale: تحفظ «كما» المطابقة بين القول السابق ووقوعه، وتُمثّل «أيضًا» καί من غير مبالغة.
- source_word: καὶ οἴδατε
  choice: وأنتم تعلمون ذلك
  rationale: «ذلك» يصرّح في العربية بالمفعول المفهوم من السياق، أي وقوع الضيق كما سبق أن قيل لهم.
theological_decisions:
- issue: طبيعة الضيق الذي يدل عليه θλίβεσθαι
  choice: المعاناة والضيق بمعناهما العام، مع احتمال اشتمالهما على الاضطهاد
  alternative: الاضطهاد تحديدًا، أو «الضيقة» بمعنى تقني أخروي
  rationale: اللفظ اليوناني يدل على التعرض للضغط والشدة والكرب، والسياق قد يشمل الاضطهاد، لكنه لا يوجب حصره فيه ولا إعطاءه معنى أخرويًا تقنيًا.
- issue: دلالة μέλλομεν على المستقبل أو الحتمية
  choice: لا بد أن نعاني
  alternative: كنا مزمعين أن نعاني / كنا على وشك أن نعاني
  rationale: تؤدي العبارة العربية توقع المعاناة التي سبق إخبارهم بها ووقعت فعلًا، من غير تقرير مصدر لاهوتي خاص لهذه الحتمية أو حصرها في مجرد قرب زمني.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «كنا نقول» لإبراز الاستمرار، و«نعاني الضيق» للحفاظ على سعة الدلالة من غير صياغة كنسية تقنية أو تخصيص غير مسوّغ.
