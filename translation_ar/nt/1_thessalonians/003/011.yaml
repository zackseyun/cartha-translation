  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: ar
  text: فليُوَجِّهْ إلهُنا وأبونا نفسُه[a]، وربُّنا يسوع، طريقَنا إليكم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاء الفعل في اليونانية مفردًا، مع أن فاعليه المنسَّقين هما «إلهنا وأبونا» و«ربنا يسوع».
    reason: cross_reference
