lexical_decisions:
- source_word: Αὐτὸς
  choice: نفسُه
  rationale: استعمال توكيدي يبرز أن إلهنا وأبانا هو نفسه الفاعل؛ وهذه الصياغة تحفظ التوكيد طبيعيًّا في العربية.
- source_word: δὲ
  choice: غير ممثَّلة بلفظ مستقل
  rationale: تفيد هنا انتقالًا لطيفًا إلى الدعاء لا تعارضًا قويًّا؛ والسياق العربي يؤدي هذا الانتقال دون الحاجة إلى إضافة «أما» أو «والآن».
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: إلهُنا وأبونا
  rationale: تحفظ اللقبين وضمير المتكلمين، وتدل طبيعيًّا على مرجع واحد.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: ربُّنا يسوع
  rationale: تنقل κύριος بـ«رب» وتحفظ ضمير الملكية والاسم كما في المصدر، من غير إضافة «المسيح».
- source_word: κατευθύναι
  choice: ولْيُقَوِّمْ
  rationale: صيغة الأمر بلام الدعاء تنقل معنى التمني أو الصلاة في صيغة الاختيار اليونانية، و«يقوِّم الطريق» يحفظ معنى جعله مستقيمًا وتهيئته.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: طريقَنا
  rationale: تحفظ إمكان الإشارة إلى طريق السفر نفسه وإلى تيسير الرحلة، من غير حصر المعنى في أحدهما.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: تعبير عربي طبيعي عن الاتجاه نحو المخاطَبين في سياق السفر.
theological_decisions:
- issue: إسناد فعل مفرد إلى «إلهنا وأبونا» و«ربنا يسوع» معًا
  choice: 'الإبقاء على الفاعلين ظاهرين مع فعل واحد مفرد: «ولْيُقَوِّمْ إلهُنا وأبونا نفسه، وربنا يسوع...»'
  alternative: إعادة الصياغة بفعل جمع، أو جعل الفعل متعلقًا بالله وحده
  rationale: النص اليوناني ينسق الآب والرب يسوع بوصفهما فاعلين لفعل دعائي واحد جاء مفردًا. تحفظ الترجمة هذه السمة اللاهوتية والنحوية من غير تفسير زائد أو حسم للتوتر الذي يتضمنه التركيب.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت لام الدعاء لنقل صيغة التمني، وحُفظ الترتيب اليوناني قدر الإمكان من غير الإخلال بطبيعية العربية. وُضع تنبيه الفعل المفرد عند [a]، والبديل المعجمي عند نهاية العبارة [b].
