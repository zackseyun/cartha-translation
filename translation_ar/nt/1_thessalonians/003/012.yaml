lexical_decisions:
- source_word: ὑμᾶς δὲ
  choice: ولْيُنْمِكُمُ
  rationale: تأتي δέ هنا انتقالية، ويؤدي السياق معنى الدعاء والتمني؛ فصيغت العبارة بلام الأمر الدعائية مع إبقاء «كم» مفعولًا به للرب.
- source_word: ὁ κύριος
  choice: الرَّبُّ
  rationale: يحفظ اللقب اليوناني المألوف من غير تعيين مرجعه صراحةً بما يتجاوز نص الآية.
- source_word: πλεονάσαι
  choice: يُنْمِكُم
  rationale: الفعل متعدٍّ هنا و«الرب» فاعله و«كم» مفعوله؛ لذلك تنقل الصياغة العربية المعنى السببي بوضوح.
- source_word: καὶ περισσεύσαι
  choice: ويُفيضْ محبتكم
  rationale: يحفظ فعلًا ثانيًا متميزًا عن النمو ويعبّر طبيعيًا عن الوفرة الشديدة، مع جعل المحبة هي الشيء الفائض بحسب المعنى.
- source_word: τῇ ἀγάπῃ
  choice: محبتكم
  rationale: يبين وجه النمو والفيض بلغة عربية طبيعية، مع الحفاظ على لفظ «المحبة».
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: بعضكم لبعض وللجميع
  rationale: صياغة عربية مألوفة لاتجاه المحبة، وتُبقي «الجميع» واسع الدلالة من غير تقييده بالمؤمنين أو بالناس صراحةً.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: كما نحبكم نحن أيضًا
  rationale: العبارة اليونانية محذوف منها الفعل؛ أُكمل في العربية بأقرب معنى من السياق، مع إبراز «نحن» ونقل καί بـ«أيضًا».
theological_decisions:
- issue: مرجع «الرب»
  choice: الإبقاء على «الرب» بلا تحديد إضافي
  alternative: التصريح بأنه المسيح، أو حمله على إشارة إلهية عامة
  rationale: لفظ κύριος وحده لا يصرح في هذه الآية بالمرجع، فلا ينبغي حسمه داخل الترجمة.
- issue: نطاق πάντας
  choice: الجميع
  alternative: جميع الناس، أو جميع المؤمنين
  rationale: يبقى اللفظ اليوناني مطلقًا وواسعًا؛ و«الجميع» تحفظ هذا الاتساع بلا تضييق تفسيري.
- issue: إكمال العبارة الختامية المحذوفة
  choice: كما نحبكم نحن أيضًا
  alternative: كما تفيض محبتنا لكم نحن أيضًا
  rationale: الإكمال بالفعل «نحب» واضح ومقتصد، لكنه يظل إكمالًا سياقيًا لعبارة يونانية موجزة بلا فعل مصرح به، ولذلك نُبّه إليه في الحاشية.
