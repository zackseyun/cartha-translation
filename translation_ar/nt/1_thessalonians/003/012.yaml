  to: وليُكثِرِ الرَّبُّ محبتَكم ويجعلْها تفيضُ بعضَكم نحوَ بعضٍ ونحوَ الجميع[a]، كما تفيضُ محبتُنا نحن أيضًا نحوَكم[b].
  rationale: تعيد المراجعة صياغة الفعلين بحيث يظهر الرب سببًا في ازدياد المحبة وفَيَضانها، وهو معنى طبيعي وأمين للتركيب اليوناني «يزيدوا ويفيضوا في المحبة». كما يستعيد الشطر الأخير، مع التنبيه في الحاشية، معنى الفيض في المحبة من السياق بدل قصره على فعل الحب وحده. وأُبقيت «نحو الجميع» محافظةً على اتجاه εἰς واتساع πάντας.
