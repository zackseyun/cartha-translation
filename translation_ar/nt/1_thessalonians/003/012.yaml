  register: 'عربية فصحى معاصرة واضحة ذات نبرة دعائية كريمة. استُخدمت لام الأمر في معنى الدعاء، وحُفظ الفعلان المتقاربان بصورتين متميزتين: الإنماء والإفاضة. جميع علامتي الحاشية [a] و[b] مثبتتان في المتن.'
