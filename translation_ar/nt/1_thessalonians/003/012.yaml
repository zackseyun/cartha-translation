  source_fidelity: المسودة تنقل معنى الدعاء و«الرب» واتساع «الجميع» على نحو سليم إجمالًا. لكن «ويُفيضْ محبتكم» تركيب غير سليم دلاليًا ونحويًا في هذا السياق، ولا يعبّر بوضوح عن أن الازدياد والفيض واقعان في المحبة. كما أن «كما نحبكم» يضيّق الإضمار اليوناني إلى فعل الحب وحده، بينما يُفهَم من السياق امتداد الزيادة/الفيض في المحبة.
