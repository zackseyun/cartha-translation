  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: ar
  text: وأرسلنا تيموثاوس، أخانا والعامل مع الله[a] في إنجيل المسيح، لكي يثبّتكم ويشجّعكم في شأن إيمانكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العامل لله». وترد في بعض المخطوطات صيغ مختلفة، منها «خادم الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: أرسلنا
  rationale: فعل ماضٍ سردي بسيط، و«أرسلنا» هو المقابل العربي الطبيعي الواضح.
- source_word: Τιμόθεον
  choice: تيموثاوس
  rationale: النقل العربي المألوف للاسم في الاستعمال الكتابي.
- source_word: ἀδελφὸν ἡμῶν
  choice: أخانا
  rationale: يحفظ الاستعارة العائلية وصيغة الإضافة بإيجاز طبيعي.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: العامل مع الله
  rationale: ينقل العبارة القوية في النص اليوناني ويحفظ دلالتها اللاهوتية من غير تخفيفها إلى «خادم الله»؛ وتُذكر القراءة النصية البديلة في الحاشية.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: في إنجيل المسيح
  rationale: تحفظ «في» مجال العمل، كما تحافظ الإضافة على احتمال أن يكون الإنجيل من المسيح أو عنه من غير حسم زائد.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» في العربية يؤدي معنى اللقب Χριστός أداءً مباشرًا، ولا يحتاج إلى بديل اصطلاحي منفصل كالإنجليزية.
- source_word: εἰς τὸ στηρίξαι
  choice: لكي يثبّتكم
  rationale: يبين غرض الإرسال بوضوح، و«يثبّت» يلائم سياق ترسيخ المؤمنين في مواجهة الضيق.
- source_word: παρακαλέσαι
  choice: يشجّعكم
  rationale: يلتقط المعنى الرعوي الداعم هنا من غير قصر اللفظ على التعزية أو الوعظ.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: في شأن إيمانكم
  rationale: يحفظ معنى التعلّق أو الصلة الممكن في ὑπέρ، مع عدم استبعاد معنى العمل لأجل إيمانهم.
- source_word: πίστεως
  choice: إيمانكم
  rationale: المقابل العربي المعتاد لـ πίστις، وهو الأنسب هنا لإيمان أهل تسالونيكي وثباتهم فيه.
theological_decisions:
- issue: صياغة συνεργὸν τοῦ θεοῦ
  choice: العامل مع الله
  alternative: العامل لله؛ خادم الله في قراءات مخطوطية أخرى
  rationale: الإضافة اليونانية تحتمل من جهة الصياغة وصف تيموثاوس بأنه عامل مرتبط بالله أو عامل معه. اختيرت العبارة الطبيعية التي تحفظ التعبير القوي، مع توثيق اختلاف النص في الحاشية بدل إزالة التوتر اللاهوتي.
- issue: دلالة τοῦ Χριστοῦ في عبارة «إنجيل المسيح»
  choice: المسيح
  alternative: لا يلزم بديل عربي من نوع «كريستوس»
  rationale: اللفظ العربي «المسيح» يحفظ أصلًا معنى اللقب، والإضافة تُترك على اتساعها الدلالي من غير حسم هل الإنجيل صادر عن المسيح أم موضوعه المسيح.
- issue: دلالة ὑπὲρ مع الإيمان
  choice: في شأن إيمانكم
  alternative: لأجل إيمانكم
  rationale: يمكن أن تفيد ὑπέρ التعلّق بالموضوع أو العمل لأجله؛ فالصياغة المختارة تلائم فعل التشجيع ولا تدّعي حسم الاحتمال الآخر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «تيموثاوس» وفق التقليد العربي الشائع، وحُفظ تركيب «إنجيل المسيح» لما فيه من إيجاز واتساع دلالي. جميع علامات الحواشي الواردة مثبتة في المتن.
