  to: فأيَّ شكرٍ نستطيع أن نردَّه إلى الله بشأنكم، من أجل كل الفرح الذي نفرح به بسببكم أمام إلهنا،
  rationale: استُبدلت «لقاء» بـ«من أجل» لتؤدي بوضوح معنى الأساس أو المناسبة في ἐπί مع الداتيف، واستُبدلت «من جهتكم» بـ«بشأنكم» لسلامة الأسلوب. وأُبقيت الفاصلة لأن العبارة تتابع نحويًا في الآية التالية، مع الحفاظ على الاستفهام البلاغي في البنية والمعنى.
