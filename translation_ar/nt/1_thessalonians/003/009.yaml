  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: ar
  text: فأيَّ شكرٍ نستطيع أن نردَّه إلى الله بشأنكم، من أجل كل الفرح الذي نفرح به بسببكم أمام إلهنا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: أيَّ شكرٍ
  rationale: يحافظ على صيغة الاستفهام البلاغي وعلى الاسم «شكر»، ويُبرز عجز المتكلمين عن الإتيان بشكر يوازي فرحهم.
- source_word: δυνάμεθα
  choice: نستطيع
  rationale: تعبير عربي واضح وطبيعي يحفظ معنى القدرة والقوة البلاغية للسؤال.
- source_word: ἀνταποδοῦναι
  choice: أن نردَّه
  rationale: يحفظ معنى تقديم شيء في المقابل أو ردّه، من غير أن يوحي حتمًا بمعاملة مالية أو بسداد دين حرفي.
- source_word: περὶ ὑμῶν
  choice: من جهتكم
  rationale: يدل على أن الشكر متعلق بالمؤمنين، مع تمييزه عن δι’ ὑμᾶς اللاحقة التي تعبّر عن السببية.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: لقاء كل الفرح
  rationale: ينقل أساس الشكر ومناسبته، ويحافظ في الوقت نفسه على صورة الردّ الواردة في الفعل ἀνταποδοῦναι.
- source_word: ᾗ χαίρομεν
  choice: الذي نفرح به
  rationale: يحفظ الصلة الاشتقاقية والتوكيد بين «الفرح» و«نفرح» في اليونانية.
- source_word: δι’ ὑμᾶς
  choice: بسببكم
  rationale: ينقل بوضوح دلالة السببية في διά مع حالة النصب.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: أمام إلهنا
  rationale: يحافظ على الصورة المكانية الدالة على الحضور الإلهي بصياغة عربية موجزة ومفهومة.
theological_decisions:
- issue: القوة البلاغية لصورة ردّ الشكر إلى الله
  choice: الإبقاء على صورة «أن نردَّه إلى الله» داخل سؤال بلاغي
  alternative: «كيف يمكننا أن نشكر الله بما يكفي من أجلكم؟»
  rationale: الفعل اليوناني ἀνταποδοῦναι يتضمن معنى الردّ أو المقابلة. والسؤال البلاغي يبيّن أن المقصود هو قصور الشكر عن موازاة الفرح، لا إمكان سداد حق الله أو إقامة علاقة تبادلية معه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقي التكرار «الفرح الذي نفرح به» لأنه مقصود في الأصل، كما حُفظ الاستفهام البلاغي وصورة ردّ الشكر مع إيضاح الصياغة الاصطلاحية في الحاشية.
