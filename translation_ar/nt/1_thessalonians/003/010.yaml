lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ليلًا ونهارًا
  rationale: تعبير عربي طبيعي يحفظ دلالة الاستمرار أو التكرار في العبادة اليونانية الظرفية.
- source_word: ὑπερεκπερισσοῦ
  choice: بأشد إلحاح
  rationale: ينقل قوة الظرف النادر ذي الدلالة التكثيفية الفائقة، ويرتبط طبيعيًا بفعل التضرع.
- source_word: δεόμενοι
  choice: نتضرع
  rationale: يدل اسم الفاعل اليوناني على الطلب الملح؛ و«نتضرع» أوضح من مجرد «نصلي» في نقل معنى الابتهال دون مبالغة.
- source_word: εἰς τὸ ἰδεῖν
  choice: أن نرى
  rationale: ينقل تركيب حرف الجر مع المصدر المعرّف بوصفه دالًا على الغرض، بصياغة عربية سلسة.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: وجوهكم
  rationale: يحفظ الصورة الحسية في الأصل، والمفرد اليوناني الموزع على جماعة يُعبَّر عنه طبيعيًا في العربية بالجمع.
- source_word: καταρτίσαι
  choice: أن نُكمِل
  rationale: الفعل قد يدل على الإصلاح أو التجهيز أو الإتمام؛ ومع «ما ينقص» تلائم «نُكمِل» التركيب وتحفظ معنى بلوغ ما يحتاج إلى تمام.
- source_word: τὰ ὑστερήματα
  choice: ما ينقص
  rationale: تعبير جمعي عربي طبيعي ينقل أوجه النقص دون الإيحاء بالضرورة بعيوب أخلاقية.
- source_word: τῆς πίστεως ὑμῶν
  choice: إيمانكم
  rationale: الإضافة المباشرة تحفظ تركيب الأصل، ويُفهم منها ما يحتاج إلى استكمال أو تقوية في إيمانهم.
theological_decisions:
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: السياق يتحدث عن إيمان أهل تسالونيكي الذي يحتاج إلى استكمال وتقوية، لا عن غياب الإيمان ولا، في المقام الأول، عن سلوك الأمانة؛ ومع ذلك يبقى عنصر الثقة حاضرًا في المجال الدلالي.
- issue: طبيعة النقص في إيمانهم
  choice: ما ينقص إيمانكم
  alternative: ما يحتاج إلى تقوية أو إتمام في إيمانكم
  rationale: 'الصياغة تحافظ على توتر الأصل: لديهم إيمان حقيقي، لكن فيه أمور لم تكتمل بعد، من غير تحديد ماهية ذلك النقص أو تحميله حكمًا مذهبيًا.'
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختير «نتضرع بأشد إلحاح» لنقل شدة الطلب، و«وجوهكم» للمحافظة على الصورة الأصلية مع سلامة التعبير العربي.
