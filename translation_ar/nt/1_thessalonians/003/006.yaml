revisions:
- from: أمّا الآن، وقد جاءنا تيموثاوس من عندكم وبشّرنا بإيمانكم ومحبتكم[a]، وبأنكم تذكروننا دائمًا بالخير، مشتاقين إلى رؤيتنا كما نشتاق نحن أيضًا إلى رؤيتكم،
  to: أمّا الآن، وقد جاء تيموثاوس إلينا من عندكم، وحمل إلينا بشارةً عن إيمانكم ومحبتكم[a]، وعن أنكم تذكروننا دائمًا بالخير وتشتاقون إلى رؤيتنا، كما نشتاق نحن أيضًا إلى رؤيتكم،
  rationale: استُبدل التركيب الملتبس «وبشّرنا بإيمانكم» بـ«وحمل إلينا بشارةً عن إيمانكم» لإظهار أن الإيمان والمحبة هما مضمون الخبر الذي نقله تيموثاوس. وأُعيدت صياغة الشوق بفعل صريح معطوف لتكون الجملة واضحة في الفصحى المعاصرة، مع إبقاء امتداد الجملة وعلامة الفاصلة النهائية لأن الآية متصلة نحويًا بما بعدها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:03Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك وصول تيموثاوس حديثًا، وخبره عن إيمانهم ومحبتهم، والذكر الحسن والشوق المتبادل. لكن «وبشّرنا بإيمانكم» قد تُفهم في العربية على أن تيموثاوس بشّر بولس ورفاقه بالإيمان، لا أنه نقل إليهم خبرًا سارًا عن إيمان أهل تسالونيكي. الصياغة المنقحة ترفع هذا الالتباس وتحافظ على قوة εὐαγγελισαμένου في هذا السياق الإخباري.
  naturalness: «أمّا الآن، وقد جاءنا...» سليمة، لكن التعبير «وبشّرنا بإيمانكم» غير طبيعي نسبيًا وملتبس التعلّق. كما أن جعل «مشتاقين» حالًا بعد «أنكم تذكروننا» جائز، إلا أن عطف فعل صريح أوضح في العربية المعاصرة.
  terminology: «إيمانكم» و«محبتكم» مناسبان لـ πίστις وἀγάπη. والحاشية التي تثبت احتمال «أمانتكم» مناسبة ولا تفرض تفسيرًا مذهبيًا. استُخدمت «بشارة» في النص المنقح لتحافظ، بقدر طبيعي، على الصلة اللفظية للفعل اليوناني ذي صبغة الخبر السار.
  issues:
  - severity: medium
    issue: التعبير «وبشّرنا بإيمانكم ومحبتكم» ملتبس في العربية.
    rationale: قد يعني أن تيموثاوس نادى بولس ورفاقه بالإيمان والمحبة، بينما اليونانية تعني أنه أبلغهم خبرًا سارًا يتعلق بإيمان أهل تسالونيكي ومحبتهم.
  - severity: low
    issue: «مشتاقين إلى رؤيتنا» أقل وضوحًا من فعل معطوف صريح.
    rationale: المصدر اليوناني يستعمل اسم فاعل، لكن العربية المعاصرة تصبح أوضح بـ«وتشتاقون إلى رؤيتنا» من غير تغيير في المعنى أو الزمن المقصود.
