source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: ar
  text: أمّا الآن، وقد جاء تيموثاوس إلينا من عندكم، وحمل إلينا بشارةً عن إيمانكم ومحبتكم[a]، وعن أنكم تذكروننا دائمًا بالخير وتشتاقون إلى رؤيتنا، كما نشتاق نحن أيضًا إلى رؤيتكم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمانتكم». قد تعني الكلمة اليونانية الإيمان أو الثقة أو الأمانة.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: أمّا الآن
  rationale: تؤدي معنى الانتقال مع مقابلة لطيفة بين قلق بولس السابق والارتياح الذي أحدثه الخبر الجديد.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: وقد جاءنا تيموثاوس من عندكم
  rationale: صياغة عربية طبيعية للمضاف المطلق اليوناني، وتحافظ على دلالة وصول تيموثاوس حديثًا من جهة المخاطَبين.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: وبشّرنا
  rationale: الفعل يدل هنا على نقل خبر سار، واختيار «بشّرنا» موجز وطبيعي ويحفظ الصلة اللفظية بالبشارة من غير أن يجعله تبشيرًا إنجيليًا موجّهًا إلى بولس ورفاقه.
- source_word: τὴν πίστιν
  choice: بإيمانكم
  rationale: «الإيمان» هو المقابل الأساسي لـ πίστις في هذا السياق، مع إبقاء احتمال معنى الأمانة في الحاشية.
- source_word: τὴν ἀγάπην
  choice: ومحبتكم
  rationale: مقابل عربي مباشر وطبيعي لـ ἀγάπη.
- source_word: μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: تذكروننا دائمًا بالخير
  rationale: ينقل العبارة اليونانية بوضوح عربي معاصر، ويعبّر عن الذكر الحسن دون التزام بتركيب اسمي متكلّف.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: مشتاقين إلى رؤيتنا
  rationale: يحفظ قوة الرغبة الودّية التي يدل عليها الفعل ويأتي بأسلوب عربي مألوف.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: كما نشتاق نحن أيضًا إلى رؤيتكم
  rationale: يُظهر الفعل المحذوف المفهوم من السياق، محافظًا على المقابلة التبادلية بوضوح.
theological_decisions:
- issue: دلالة πίστις بين الإيمان والأمانة
  choice: إيمانكم
  alternative: أمانتكم
  rationale: يرجّح السياق خبر ثبات أهل تسالونيكي في إيمانهم، لكن اللفظة اليونانية قد تحمل أيضًا معنى الأمانة أو الثبات، لذلك لم يُلغَ هذا الاحتمال بل أُثبت في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حافظت الصياغة على امتداد الجملة لأنها متصلة نحويًا بما يليها، وعلى حرارة الشوق المتبادل، مع تجنّب التراكيب الحرفية المتكلّفة.
