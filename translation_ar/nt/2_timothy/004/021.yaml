  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: ar
  text: ابذل كل جهدك لتأتي قبل الشتاء. يسلِّم عليك أَفْبُولُس، وكذلك بُودِيس ولِينُس وكَلَوْدِيَا وجميع الإخوة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جميع الإخوة والأخوات»؛ فاليونانية تقول حرفيًا «الإخوة»، لكن اللفظ قد يشير في هذا السياق إلى جماعة المؤمنين الأوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: ابذل كل جهدك
  rationale: فعل أمر يفيد الجدّ والحرص المصحوبين بالعجلة؛ وهذه الصياغة العربية تنقل قوة الطلب وضرورة السعي من غير جمود حرفي.
- source_word: πρὸ χειμῶνος
  choice: قبل الشتاء
  rationale: تفيد πρό مع المضاف إليه الزمن السابق لمجيء فصل الشتاء، و«قبل الشتاء» هي الصياغة العربية الطبيعية المباشرة.
- source_word: ἐλθεῖν
  choice: لتأتي
  rationale: المصدر مكمّل لفعل الأمر، والمراد مجيء تيموثاوس إلى بولس؛ وتحويله إلى لام التعليل مع المضارع فصيح وطبيعي في العربية.
- source_word: Ἀσπάζεταί σε
  choice: يسلِّم عليك
  rationale: هذا التعبير العربي المألوف في سياق التحيات الرسائلية ينقل معنى إبلاغ السلام نقلاً طبيعيًا.
- source_word: Εὔβουλος
  choice: أَفْبُولُس
  rationale: نقل صوتي للاسم اليوناني مع مراعاة صورته المتداولة في التراث الكتابي العربي.
- source_word: Πούδης
  choice: بُودِيس
  rationale: نقل صوتي للاسم الشخصي اليوناني.
- source_word: Λίνος
  choice: لِينُس
  rationale: نقل صوتي مباشر للاسم الشخصي.
- source_word: Κλαυδία
  choice: كَلَوْدِيَا
  rationale: نقل صوتي للاسم الشخصي المؤنث مع إبقاء تميّزه عن الأسماء الأخرى.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: جميع الإخوة
  rationale: يحافظ على الاسم المذكر الجمع الوارد صراحة في اليونانية، مع بيان احتمال شموله جماعة المؤمنين الأوسع في الحاشية.
theological_decisions:
- issue: مدى شمول لفظ ἀδελφοί لجماعة مختلطة من المؤمنين
  choice: جميع الإخوة
  alternative: جميع الإخوة والأخوات؛ أو جميع المؤمنين
  rationale: النص اليوناني يستعمل جمعًا مذكرًا، لذلك أُبقي في المتن دون توسيع تفسيري. ومع ذلك قد يُستعمل اللفظ في سياق الجماعة المسيحية للدلالة على المؤمنين عمومًا، فحُفظ هذا الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، بصياغة رسائلية طبيعية. استُخدم «ابذل كل جهدك» لإبراز الإلحاح، وأُبقي «الإخوة» في المتن حفاظًا على صورة الأصل مع توضيح احتمال الشمول في الحاشية.
