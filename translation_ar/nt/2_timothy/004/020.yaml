  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: ar
  text: بقي أراستس في كورنثوس، وأما تروفيمس فتركته مريضًا في ميليتس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: أراستس
  rationale: اسم علم نُقل إلى العربية بالصيغة الكتابية العربية الشائعة.
- source_word: ἔμεινεν
  choice: بقي
  rationale: ينقل معنى الإقامة أو البقاء في مكان، وهو طبيعي وموجز في سياق أخبار السفر.
- source_word: ἐν Κορίνθῳ
  choice: في كورنثوس
  rationale: استعمال مكاني مباشر لحرف الجر مع اسم المدينة.
- source_word: Τρόφιμον
  choice: تروفيمس
  rationale: اسم علم نُقل إلى العربية بالصيغة الكتابية العربية الشائعة.
- source_word: δὲ
  choice: وأما ... فـ
  rationale: يُظهر المقابلة الخفيفة بين الخبرين في عربية فصيحة طبيعية، من غير جعلها تعارضًا حادًا.
- source_word: ἀπέλιπον
  choice: تركته
  rationale: فعل ماضٍ للمتكلم المفرد، والضمير المتصل يحدد تروفيمس مفعولًا به بوضوح؛ ولا يلزم إدخال معنى «خلّفته وراءي» في المتن.
- source_word: ἐν Μιλήτῳ
  choice: في ميليتس
  rationale: استعمال مكاني مباشر مع اسم المدينة، وفق الصيغة العربية الشائعة للاسم.
- source_word: ἀσθενοῦντα
  choice: مريضًا
  rationale: حال تصف وضع تروفيمس حين تركه بولس؛ وهي أدق سياقيًا من المعنى الأوسع «ضعيفًا».
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، بصياغة موجزة تلائم خبر السفر. حُفظت المقابلة الخفيفة التي تفيدها δὲ، وحُملت العبارة الأخيرة طبيعيًا على أن تروفيمس كان مريضًا وقت تركه.
