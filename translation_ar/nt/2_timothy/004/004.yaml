  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: ar
  text: وسوف يصرفون سمعهم عن الحق، وينحرفون إلى الخرافات.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأساطير».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: الحق
  rationale: يحافظ على أداة التعريف اليونانية وعلى المعنى الواسع للكلمة في السياق، من غير تضييقها إلى «التعليم الصحيح» أو «الإنجيل».
- source_word: ἀκοὴν
  choice: سمعهم
  rationale: يقابل معنى السمع أو الإصغاء، ويحافظ على صورة صرف السمع عن الحق بعبارة عربية فصيحة ومفهومة.
- source_word: ἀποστρέψουσιν
  choice: يصرفون ... عن
  rationale: ينقل دلالة التحويل المتعمد بعيدًا عن شيء، ويلائم تركيب الفعل مع «سمعهم».
- source_word: μύθους
  choice: الخرافات
  rationale: لفظ عربي حديث وواضح للروايات المختلقة أو غير الحقيقية في مقابل الحق.
- source_word: ἐκτραπήσονται
  choice: ينحرفون
  rationale: ينقل الصيغة الوسطى/المبنية للمجهول طبيعيًا بمعنى الاتجاه جانبًا، من غير حسم ما إذا كان التركيز على فاعليتهم أو وقوع الانحراف عليهم.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: عن ... و... إلى
  rationale: يحفظ التقابل الاتجاهي بين الابتعاد عن الحق والتوجه إلى الخرافات بأسلوب عربي طبيعي.
theological_decisions:
- issue: طبيعة «الحق» في السياق
  choice: الحق
  alternative: التعليم الصحيح؛ حق الإنجيل
  rationale: يرتبط اللفظ في السياق بالتعليم الرسولي، لكن النص يستخدم كلمة أوسع؛ لذلك تُحفظ سعته اللاهوتية ولا يُفسَّر داخل الترجمة تفسيرًا أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «سمعهم» بدل «آذانهم» لموافقة اللفظ اليوناني، و«الخرافات» في المتن لكونها أوضح لعامة القراء، مع إثبات «الأساطير» بديلًا في الحاشية.
