  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: ar
  text: لأنه سيأتي وقت لا يحتملون فيه التعليم السليم[a]، بل يكدّسون لأنفسهم معلّمين بحسب رغباتهم الخاصة، وآذانهم تحكّهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التعليم الصحيح» أو «العقيدة السليمة». واللفظ اليوناني يعني حرفيًا تعليمًا «صحيحًا معافى».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «والسمع يحكّهم». وهي صورة مجازية تصف توقًا إلى سماع ما يوافق رغباتهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: وقت
  rationale: يدلّ على زمن أو ظرف آتٍ، و«وقت» تعبير عربي طبيعي يحفظ القوة التنبؤية في السياق.
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: التعليم السليم
  rationale: يحفظ «السليم» استعارة الصحة في ὑγιαινούσης، بينما يعبّر «التعليم» عن διδασκαλία بلغة واضحة غير مثقلة باصطلاح كنسي.
- source_word: οὐκ ἀνέξονται
  choice: لا يحتملون
  rationale: ينقل معنى عدم الصبر على الشيء أو رفض تحمّله، بصياغة عربية فصيحة ومباشرة.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: بحسب رغباتهم الخاصة
  rationale: ينقل المعيار الذي يوجّه اختيارهم، ويحفظ اتساع ἐπιθυμίαι دون حصره في الشهوات الجنسية.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: يكدّسون لأنفسهم معلّمين
  rationale: «يكدّسون» يحفظ صورة الجمع المفرط في ἐπισωρεύσουσιν، و«لأنفسهم» يبرز قوة الضمير الانعكاسي.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: إذ تحكّ آذانهم
  rationale: يحفظ الصورة الحسية الغريبة عمدًا، ويستعمل «إذ» لربط الحال بالفعل من غير الجزم بعلاقة سببية صريحة.
theological_decisions:
- issue: ترجمة διδασκαλία في سياق الرسائل الرعوية
  choice: التعليم
  alternative: العقيدة
  rationale: «التعليم» هو المقابل المباشر والأيسر فهمًا، ولا يفرض على اللفظ درجة اصطلاحية مذهبية لا يقتضيها وحده.
- issue: قوة العبارة الحالية κνηθόμενοι τὴν ἀκοήν
  choice: إذ تحكّ آذانهم
  alternative: لأن آذانهم تحكّهم
  rationale: الصياغة المختارة تحافظ على البناء الحالي واحتمال علاقته الظرفية أو التفسيرية، وتتجنب حسمه كسبب صريح.
