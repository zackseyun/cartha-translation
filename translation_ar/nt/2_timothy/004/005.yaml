id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: ar
  text: أَمَّا أَنْتَ فَكُنْ يَقِظَ الذِّهْنِ فِي كُلِّ شَيْءٍ، وَاحْتَمِلِ الْمَشَقَّةَ، وَقُمْ بِعَمَلِ الْمُبَشِّرِ، وَأَتْمِمْ خِدْمَتَكَ عَلَى أَكْمَلِ وَجْهٍ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ δὲ
  choice: أَمَّا أَنْتَ فَـ
  rationale: يحفظ بروز الضمير والمقابلة مع سلوك المذكورين في السياق السابق، بصياغة عربية طبيعية.
- source_word: νῆφε
  choice: كُنْ يَقِظَ الذِّهْنِ
  rationale: الفعل مستعمل هنا مجازًا للدلالة على صفاء الذهن ورباطة الجأش والانتباه، لا على الامتناع الحرفي عن الخمر.
- source_word: ἐν πᾶσιν
  choice: فِي كُلِّ شَيْءٍ
  rationale: يحفظ شمول العبارة اليونانية من غير حصرها في الأوقات أو الظروف وحدها.
- source_word: κακοπάθησον
  choice: احْتَمِلِ الْمَشَقَّةَ
  rationale: ينقل معنى التعرض للمعاناة مع الثبات فيها، وهو أنسب من صياغة قد تبدو وصفية فقط.
- source_word: ἔργον ποίησον εὐαγγελιστοῦ
  choice: قُمْ بِعَمَلِ الْمُبَشِّرِ
  rationale: صياغة عربية واضحة تنقل الأمر بأداء عمل من يعلن البشارة، وتحافظ على الاسم الوظيفي العام من غير تحميله بنية كنسية مخصوصة.
- source_word: τὴν διακονίαν σου
  choice: خِدْمَتَكَ
  rationale: «الخدمة» تنقل معنى διακονία في هذا السياق الرسولي والرعوي بوضوح، من غير افتراض منصب طائفي محدد.
- source_word: πληροφόρησον
  choice: أَتْمِمْ ... عَلَى أَكْمَلِ وَجْهٍ
  rationale: يبرز معنى إكمال الخدمة وأدائها أداءً تامًا، مع تجنب توهّم معنى الإثبات أو الإقناع الذي قد تحمله مشتقات أخرى في العربية.
theological_decisions:
- issue: طبيعة عمل εὐαγγελιστοῦ
  choice: عَمَلِ الْمُبَشِّرِ
  alternative: عمل من يعلن البشارة
  rationale: يحافظ على دلالة إعلان الخبر السار من غير تحديد ما إذا كان اللفظ لقبًا كنسيًا رسميًا أو وصفًا للعمل.
- issue: مدلول διακονία في تكليف تيموثاوس
  choice: خِدْمَتَكَ
  alternative: مهمتك في الخدمة
  rationale: السياق يشير إلى مسؤولية تيموثاوس الموكلة إليه في إعلان الرسالة ورعاية الجماعة، لكن اللفظ نفسه لا يقتضي منصبًا مذهبيًا بعينه.
- issue: قوة πληροφόρησον
  choice: أَتْمِمْ خِدْمَتَكَ عَلَى أَكْمَلِ وَجْهٍ
  alternative: أكمل خدمتك تمامًا
  rationale: يحفظ معنى بلوغ الخدمة تمامها وأدائها كاملًا، من دون تفسير طبيعة هذا الإتمام تفسيرًا لاهوتيًا زائدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصيغة أوامر مباشرة تناسب الوصية الرسولية الشخصية. استُعمل «يقظ الذهن» لنقل المعنى المجازي الطبيعي، و«المبشّر» بمعنى معلن البشارة لا بمعناه الدعائي الحديث.
