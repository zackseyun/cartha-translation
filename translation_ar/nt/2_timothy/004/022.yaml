  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: ar
  text: لِيَكُنِ الرَّبُّ مَعَ رُوحِكَ.[a] وَلْتَكُنِ النِّعْمَةُ مَعَكُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ينتقل النص اليوناني من المفرد في «روحك» إلى الجمع في «معكم».
    reason: إيضاح انتقال الضمير من مخاطبة تيموثاوس شخصيًا إلى مخاطبة جماعة أوسع.
lexical_decisions:
- source_word: κύριος
  choice: الرَّبّ
  rationale: يحفظ اللقب المعرَّف في اليونانية، وهو التعبير الطبيعي في بركة ختامية بولسية، من غير إضافة اسم «يسوع» غير المذكور صراحةً.
- source_word: μετὰ
  choice: مَعَ / لِيَكُنْ مَعَ
  rationale: لا يرد فعل صريح في اليونانية، لكن صيغة التمنّي والبركة في العربية تستلزم تقديره؛ لذا صيغت العبارة «ليكن ... مع» من غير إضافة مضمون جديد.
- source_word: πνεύματός
  choice: رُوح
  rationale: يدل اقترانه بضمير المخاطب المفرد على روح تيموثاوس البشرية، ولذلك لم يُكتب بما يوحي صراحةً بأنه الروح القدس.
- source_word: σου
  choice: ـكَ
  rationale: حُفظ ضمير المفرد لأن البركة الأولى موجَّهة إلى تيموثاوس شخصيًا.
- source_word: χάρις
  choice: النِّعْمَة
  rationale: «النعمة» هي المقابل العربي الطبيعي ذو الوزن اللاهوتي لصيغة الختام البولسية، وأدق هنا من «الحظوة» أو «الفضل».
- source_word: ὑμῶν
  choice: ـكُمْ
  rationale: حُفظ ضمير الجمع كما في الأصل، ليظهر انتقال الخطاب من تيموثاوس المفرد إلى جماعة أوسع.
theological_decisions:
- issue: مرجع لقب «الرَّبّ»
  choice: الإبقاء على لقب «الرَّبّ»، مع فهمه في سياق الخاتمة البولسية على أنه يشير إلى الرب يسوع.
  alternative: فهم اللقب على أنه إشارة عامة إلى الله.
  rationale: سياق البركات الختامية عند بولس يرجّح الإشارة إلى يسوع، لكن الترجمة لا تضيف اسم «يسوع» لأن النص اليوناني لا يصرّح به، وبذلك تحفظ مقدار التحديد الموجود في الأصل.
- issue: الانتقال من المفرد إلى الجمع
  choice: «روحك» للمفرد، ثم «معكم» للجمع.
  alternative: صياغة العبارتين كلتيهما كما لو كانتا موجَّهتين إلى تيموثاوس وحده.
  rationale: يميّز الأصل بوضوح بين σου المفرد وὑμῶν الجمع؛ فحفظ هذا الانتقال يصون الدلالة الأدبية واللاهوتية للختام.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة الدعاء «ليكن» و«ولتكن» لإظهار معنى البركة الذي تدل عليه الجملتان الاسميتان اليونانيتان، مع الحفاظ على الانتقال المقصود من المفرد إلى الجمع.
