  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: ar
  text: 'إني أوصيك أمام الله والمسيح يسوع، المزمع أن يدين الأحياء والأموات[a]، وبظهوره وملكوته[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي سيدين الأحياء والأموات».'
    reason: بديل لغوي يعبّر عن μέλλω بمستقبل بسيط بدل إبراز معنى الترقب أو الإزماع.
  - marker: b
    text: 'أو، مع إبقاء العلاقة النحوية ضمنية كما في اليونانية: «وظهوره وملكوته».'
    reason: بديل نحوي يحافظ على مجرد العطف من غير إظهار معنى المناشدة بحرف الباء.
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: إني أوصيك وصيةً مشددةً
  rationale: ينقل قوة التكليف الجاد الرسمي في سياق وصية رسولية، لا مجرد الشهادة. أُظهر المفعول «ك» اعتمادًا على السياق والوصايا التالية.
- source_word: ἐνώπιον
  choice: أمام
  rationale: تعبير عربي واضح وموجز يحفظ معنى الحضور وتحت نظر الله والمسيح يسوع.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: يحفظ «المسيح» بوصفه لقبًا ذا دلالة مسيانية، مع ترتيب الاسمين في اليونانية.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: المزمع أن يدين
  rationale: يحفظ دلالة μέλλω التي قد تجمع بين الاستقبال والترقب، من غير اختزالها إلى مستقبل بسيط أو فرض توقيت محدد.
- source_word: ζῶντας καὶ νεκρούς
  choice: الأحياء والأموات
  rationale: صياغة عربية طبيعية ومألوفة تحفظ شمول الدينونة للفئتين.
- source_word: ἐπιφάνειαν
  choice: ظهوره
  rationale: ينقل معنى الظهور أو التجلي المرئي في السياق الأخروي من غير تفسير زائد بأنه مجرد مجيء.
- source_word: βασιλείαν
  choice: ملكوته
  rationale: يحفظ المعنى الأساسي للملكوت مع إمكان اشتماله على السلطان الملكي.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: وبظهوره وملكوته
  rationale: 'يفهم المنصوبين على أنهما امتداد لصيغة المناشدة أو التكليف: «وبظهوره وملكوته»، مع إثبات الوجه الأكثر حرفية في الحاشية.'
theological_decisions:
- issue: دلالة Χριστός كلقب
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: الترتيب المختار يتبع النص اليوناني ويحفظ «المسيح» لقبًا، من غير تحويله إلى اسم مجرد أو إدخال صيغة طائفية.
- issue: قوة μέλλω في خبر الدينونة
  choice: المزمع أن يدين
  alternative: الذي سيدين
  rationale: يحفظ الاختيار عنصر الترقب أو الاستقبال الكامن في الفعل، مع عدم تحديد موعد لا يحدده النص.
- issue: العلاقة النحوية لعبارة الظهور والملكوت بصيغة الوصية
  choice: وبظهوره وملكوته
  alternative: وظهوره وملكوته
  rationale: يفهم حرف العطف الثاني على أنه يمد صيغة التكليف القَسَمية، وهو معنى راجح نحويًا وسياقيًا، بينما تبقى الصلة أكثر ضمنية في ظاهر اليونانية.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ووقورة. استُعملت «وصيةً مشددةً» لنقل جدية التكليف، و«المزمع» للحفاظ على التوتر الدلالي في μέλλω. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما مباشرة.
