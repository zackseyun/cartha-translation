lexical_decisions:
- source_word: Ἀλέξανδρος ὁ χαλκεὺς
  choice: الإسكندر صانع المعادن
  rationale: يدلّ χαλκεύς على الحرفي الذي يعمل في المعادن، ولا سيما النحاس أو البرونز، لكن المعدن المقصود غير محسوم؛ لذلك يتجنب «صانع المعادن» التحديد الزائد، مع حفظ البديل التقليدي في الحاشية.
- source_word: πολλά μοι κακὰ
  choice: أظهر لي شرورًا كثيرة
  rationale: يحافظ هذا التعبير على الجمع والقوة المعجمية لكلمة κακά وعلى اقترانها بالفعل ἐνεδείξατο، بدل اختزال العبارة تفسيرياً إلى مجرد «ألحق بي أذى كثيرًا».
- source_word: ἐνεδείξατο
  choice: أظهر لي
  rationale: يفيد الفعل هنا إظهار الشرور أو إبداءها تجاه شخص. والصياغة العربية قريبة من تركيب اليونانية، وإن كان البديل الدلالي الأسلس مذكورًا في الحاشية.
- source_word: ἀποδώσει
  choice: سيجازيه
  rationale: صيغة مستقبل إخبارية من ἀποδίδωμι تفيد رد الجزاء أو المكافأة بحسب الفعل؛ و«سيجازيه» طبيعية وتحفظ المعنى القضائي.
- source_word: ὁ κύριος
  choice: الرب
  rationale: ترجمة مباشرة للقب κύριος مع تعريفه كما في اليونانية.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: بحسب أعماله
  rationale: صياغة قريبة وواضحة تحفظ العبارة الكتابية عن الجزاء الموافق للأعمال دون تحويلها إلى شرح تفسيري.
theological_decisions:
- issue: هل ἀποδώσει خبر عن المستقبل أم دعاء بطلب الجزاء؟
  choice: سيجازيه الرب
  alternative: ليجازه الرب
  rationale: نص SBLGNT المعطى يقرأ ἀποδώσει، وهي صيغة مستقبل إخبارية، لذلك يحفظ المتن معنى التصريح بالجزاء الإلهي. وتُذكر قراءة الأمر/الدعاء التي تشهد لها بعض المخطوطات في الحاشية من غير طمس للتوتر النصي واللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا» لإبراز الاسم المصدَّر في اليونانية، وحُفظت الصياغة القريبة «أظهر لي شرورًا كثيرة» في المتن مع تقديم البديل العربي الأسلس في الحاشية. وُضعت جميع علامات الحواشي في النص الرئيس.
