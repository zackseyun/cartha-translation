  text: Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: ar
  text: سَلِّمْ على بريسكا[a] وأكيلا، وعلى بيت أُنيسيفورس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «بريسكا»؛ وتُدعى أيضًا «بريسكلا» في مواضع أخرى (مثل أعمال 18: 2، 18، 26).'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: سَلِّمْ على
  rationale: فعل أمر في سياق ختامي رسائلي، ومعناه توجيه التحية إلى المذكورين. وهذه صياغة عربية طبيعية تحفظ قوة الأمر من غير إضافة معنى العناق أو حرارة خاصة غير مصرَّح بها.
- source_word: Πρίσκαν
  choice: بريسكا
  rationale: نقل مباشر لصيغة الاسم الواردة في النص اليوناني، Πρίσκαν، بدل إحلال الصيغة الأخرى «بريسكلا» محلها.
- source_word: Ἀκύλαν
  choice: أكيلا
  rationale: النقل العربي الشائع للاسم اليوناني Ἀκύλας.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: بيت أُنيسيفورس
  rationale: يمكن أن يدل οἶκος على البيت بمعنى أهل الدار أو الأسرة، لا على المبنى وحده. وتعبير «بيت فلان» عربي واضح ومألوف في هذا المعنى، ويحافظ على سعة الدلالة من غير قصرها على الأقارب بالدم.
theological_decisions: []
