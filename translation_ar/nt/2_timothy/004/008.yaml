reference: 2 Timothy 4:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: ar
  text: ومن الآن فصاعدًا، إكليلُ البرّ[a] محفوظٌ لي، وسيمنحني إياه الرب، الديّان العادل، في ذلك اليوم، لا لي وحدي، بل لجميع الذين أحبّوا ظهوره.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إكليل العدل». فاللفظة اليونانية قد تعني «البرّ»، وقد تعني في بعض السياقات «العدل».'
    reason: بديل معجمي يحفظ مدى دلالة δικαιοσύνη والغموض المقصود في تركيب الإضافة.
lexical_decisions:
- source_word: λοιπὸν
  choice: ومن الآن فصاعدًا
  rationale: يفيد هنا ما بقي لبولس في المستقبل بعد أن أكمل السباق، والتعبير العربي ينقل المعنى الزمني بوضوح.
- source_word: ἀπόκειταί
  choice: محفوظٌ لي
  rationale: يدل الفعل على شيء موضوع جانبًا أو مُعَدّ ومحفوظ لصاحبه، ويحافظ هذا التعبير على دلالة الحالة القائمة من غير زيادة تفسيرية.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: إكليلُ البرّ
  rationale: صياغة إضافية طبيعية تحفظ تركيب اليونانية ولا تحسم هل البر وصف للإكليل، أو مضمونه، أو أساس منحه.
- source_word: δικαιοσύνης
  choice: البرّ
  rationale: «البرّ» هو المقابل الكتابي العربي الواضح لـ δικαιοσύνη، مع إثبات احتمال معنى «العدل» في الحاشية.
- source_word: ἀποδώσει
  choice: سيمنحني
  rationale: ينقل إعطاء ما هو مستحق في سياق إكليل الانتصار، من غير الإيحاء العقابي الذي قد يحمله لفظ «يجازيني».
- source_word: κύριος
  choice: الرب
  rationale: المقابل الطبيعي للقب κύριος؛ والسياق، ولا سيما ذكر ظهوره، يشير إلى المسيح من غير إدخال اسمه تفسيرًا في المتن.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير عربي مألوف يحفظ الإشارة الأخروية الموجزة في الأصل.
- source_word: ὁ δίκαιος κριτής
  choice: الديّان العادل
  rationale: «الديّان» لفظ عربي فصيح ومفهوم للقاضي الذي يصدر الحكم، و«العادل» ينقل δίκαιος في هذا السياق القضائي.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: لجميع الذين أحبّوا
  rationale: يحفظ صيغة الماضي دلالة اسم الفاعل التام على محبة ثابتة تحققت واستمرت إلى الحاضر.
- source_word: ἐπιφάνειαν
  choice: ظهوره
  rationale: «الظهور» هو المقابل المباشر ويحفظ معنى التجلي العلني دون اختزاله في مجرد «المجيء».
- source_word: αὐτοῦ
  choice: ـه في «ظهوره»
  rationale: يحفظ الضمير وإحالته الطبيعية إلى الرب، مع سلاسة التركيب العربي.
theological_decisions:
- issue: معنى «إكليل البرّ»
  choice: الإبقاء على تركيب الإضافة من غير حسم نوع العلاقة بين الإكليل والبرّ.
  alternative: إكليل يُمنح جزاءً على البر، أو إكليل قوامه البر، أو إكليل التبرئة والعدل.
  rationale: الإضافة اليونانية تحتمل هذه الدلالات، ولا يجيز النص ترجيح إحداها داخل الترجمة.
- issue: مرجع لقب «الرب»
  choice: الإبقاء على «الرب»، مع فهم السياق على أنه يشير إلى يسوع المسيح.
  alternative: الإشارة إلى الله بوجه عام.
  rationale: عبارة «ظهوره» في الرسائل الرعوية ترجّح الإشارة إلى المسيح، لكن المتن يحافظ على لقب الأصل ولا يضيف اسمًا غير مصرح به.
- issue: وصف الديّان بـ δίκαιος
  choice: الديّان العادل
  alternative: الديّان البار
  rationale: في السياق القضائي، «العادل» أوضح في وصف نزاهة الحكم، مع بقاء «البرّ» في عبارة إكليل البر حفاظًا على تركيبها الاصطلاحي وغموضها الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «إكليل» للمحافظة على صورة إكليل المنتصر، و«الديّان» لإبراز سياق الحكم الأخروي. وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
