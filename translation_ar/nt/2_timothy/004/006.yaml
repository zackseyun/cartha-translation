base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: ar
  text: فإني أُسكَب بالفعل سكيبًا[a]، وقد حان وقتُ رحيلي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُسكَب بالفعل». يوحي الفعل اليوناني بصورة سكيبٍ يُراق تقدمةً.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة أيضًا «انطلاقي» أو «انحلالي». و«رحيلي» تعبير طبيعي هنا عن الموت.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: أُسكَب سكيبًا
  rationale: يحافظ على صورة سكب تقدمة السكيب في سياق الذبيحة، بدل أن يختزلها في عبارة تفسيرية مباشرة عن الموت.
- source_word: ἤδη
  choice: الآن
  rationale: تفيد أن الفعل جارٍ بالفعل في الحاضر، وتلائم إحساس بولس بدنو موته.
- source_word: καιρός
  choice: وقت
  rationale: تدل هنا على اللحظة الحاسمة، ويؤدي «وقت» المعنى بوضوح، فيما تفيد عبارة «قد حان» بلوغ تلك اللحظة.
- source_word: ἀναλύσεώς
  choice: رحيلي
  rationale: ترجمة طبيعية للاستعارة التي تصف الموت بالرحيل، مع إبقاء احتمالي الانطلاق أو الانحلال في الحاشية.
- source_word: ἐφέστηκεν
  choice: قد حان
  rationale: يعبر عن وصول الوقت وبقائه حاضرًا، بما يوافق دلالة صيغة التام في السياق.
- source_word: γὰρ
  choice: فـ
  rationale: تحفظ الصلة التفسيرية بما سبق في صياغة عربية موجزة وطبيعية.
- source_word: Ἐγώ
  choice: ها أنا
  rationale: تبرز الضمير كما في اليونانية، وتؤدي بوضوح انتقال الكلام إلى وضع بولس نفسه.
theological_decisions:
- issue: الوصف المجازي لموت بولس الوشيك
  choice: الإبقاء على صورتي سكب تقدمة السكيب والرحيل
  alternative: 'التصريح مباشرة: «فأنا على وشك أن أموت»'
  rationale: اجتماع σπένδομαι وἀνάλυσις يشير بقوة إلى الموت الوشيك، لكن النص يعبر عنه بصورتين مجازيتين ينبغي عدم تسطيحهما أو حصر دلالتهما بتفسير مباشر.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «سكيبًا» للمحافظة على الصورة الذبيحية، مع حاشية توضحها، واستُعمل «رحيلي» بوصفه تعبيرًا عربيًا طبيعيًا لا يلغي المجاز.
