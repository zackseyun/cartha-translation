base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: ar
  text: جاهدتُ الجهادَ الحسن، وأتممتُ السباق، وحفظتُ الإيمان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حفظتُ الأمانة»، أو: «بقيتُ أمينًا». يمكن أن تشير العبارة اليونانية τὴν πίστιν إلى «الإيمان» بوصفه العقيدة المسيحية، أو أن تحمل معنى الثبات في الأمانة.'
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: الجهاد الحسن
  rationale: يدلّ ἀγών على صراع أو منافسة أو جهاد، وتعبير «الجهاد الحسن» طبيعي وفصيح، ويحفظ قوة الصورة من غير حصرها في قتال عسكري.
- source_word: ἠγώνισμαι
  choice: جاهدتُ
  rationale: الفعل هو صيغة التام من ἀγωνίζομαι، ويشير إلى جهاد أُنجز وبقيت نتيجته قائمة؛ والماضي العربي هو الأنسب هنا ضمن السياق الختامي والبنية الثلاثية.
- source_word: δρόμον
  choice: السباق
  rationale: يدلّ δρόμος على مسار الجري أو السباق؛ و«السباق» يحفظ الصورة الرياضية بوضوح للقارئ المعاصر.
- source_word: τετέλεκα
  choice: أتممتُ
  rationale: يفيد تام τελέω بلوغ الشيء نهايته المقصودة؛ و«أتممت» موجز وطبيعي ويحمل معنى الإكمال.
- source_word: πίστιν
  choice: الإيمان
  rationale: وجود أداة التعريف في τὴν πίστιν يرجّح «الإيمان»، وربما يشير إلى الإيمان المسيحي المودَع، مع بقاء احتمال معنى الأمانة أو الثبات في الإيمان.
- source_word: τετήρηκα
  choice: حفظتُ
  rationale: يدلّ τηρέω على الحفظ والصون والالتزام؛ و«حفظت» يترك مجالًا لمعنى التمسك بالإيمان وصيانته معًا.
theological_decisions:
- issue: معنى τὴν πίστιν
  choice: الإيمان
  alternative: الأمانة؛ أو بقيتُ أمينًا
  rationale: أداة التعريف والسياق الرسولي يؤيدان فهم العبارة بوصفها «الإيمان»، لكن اللفظ اليوناني يمكن أن يحمل أيضًا معنى الأمانة الشخصية؛ لذلك أُبقيت القراءة الأقوى في المتن، وسُجل البديل في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة، ببنية ثلاثية متوازنة تحاكي إيقاع الأصل. استُخدم «الجهاد» بمعنى الكفاح والمجاهدة، لا بوصفه مصطلحًا عسكريًا أو مذهبيًا.
