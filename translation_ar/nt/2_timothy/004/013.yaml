id: 2TI.4.13
reference: 2 Timothy 4:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: ar
  text: متى جئت، فأحضر الرداء[a] الذي تركته في ترواس عند كاربس، والكتب[b]، ولا سيما الرقوق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يفهم بعض المفسرين «الرداء» بمعنى حافظة للكتب أو غلاف لها، لكن المعنى المعتاد للكلمة اليونانية هو ثوب خارجي.
    reason: lexical_alternative
  - marker: b
    text: أو «اللفائف»؛ فقد تشير الكلمة اليونانية إلى لفائف مكتوبة أو مواد كتابية مشابهة.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: الرداء
  rationale: يدل الاسم في الاستعمال الأرجح على ثوب خارجي، و«الرداء» تعبير عربي واضح يحافظ على هذا المعنى دون إضافة وصف غير موجود في النص.
- source_word: ἀπέλιπον
  choice: تركتُه
  rationale: فعل ماضٍ متكلم مفرد، ومعناه المباشر «تركتُ». وأُلحقت به هاء المفعول لتعود إلى الرداء وفق التركيب العربي.
- source_word: ἐν Τρῳάδι
  choice: في ترواس
  rationale: نقل مباشر لاسم المكان مع حرف الظرفية.
- source_word: παρὰ Κάρπῳ
  choice: عند كاربس
  rationale: παρά مع المجرور هنا تفيد وجود الشيء لدى الشخص أو في مكانه؛ و«عند كاربس» طبيعية وتحفظ هذا الاتساع.
- source_word: ἐρχόμενος
  choice: متى جئت
  rationale: اسم الفاعل ذو دلالة ظرفية زمنية متعلقة بالأمر، فصيغ عربيًا بعبارة زمنية طبيعية.
- source_word: φέρε
  choice: فأحضر
  rationale: فعل أمر يطلب نقل الأشياء إلى المتكلم؛ و«أحضر» واضحة في العربية في هذا السياق.
- source_word: τὰ βιβλία
  choice: الكتب
  rationale: لفظة βιβλία قد تشمل الكتب أو اللفائف وغيرها من المواد المكتوبة؛ اختير اللفظ العربي الأوسع والأشيع، مع إثبات البديل في الحاشية.
- source_word: μάλιστα
  choice: ولا سيما
  rationale: تعبّر طبيعيًا عن تخصيص ما يليها بمزيد من التأكيد.
- source_word: τὰς μεμβράνας
  choice: الرقوق
  rationale: تشير μεμβράνα إلى مواد كتابية مصنوعة من جلود مهيأة؛ و«الرقوق» هو المقابل العربي الدقيق والموجز.
theological_decisions: []
