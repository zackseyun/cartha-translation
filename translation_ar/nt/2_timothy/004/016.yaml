id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: ar
  text: في دفاعي الأول، لم يحضر أحد ليؤازرني[a]، بل تركني الجميع. لا يُحسَب ذلك عليهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لم يأتِ أحد ليكون حاضرًا معي»؛ والمعنى أن أحدًا لم يحضر لمساندته في دفاعه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا يُؤاخَذوا به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: دفاعي
  rationale: يدل اللفظ في هذا السياق على الدفاع أو الجواب الرسمي أمام سلطة قضائية، وتحافظ «دفاعي» على المعنى القضائي بلغة عربية طبيعية.
- source_word: πρώτῃ
  choice: الأول
  rationale: ينص اللفظ مباشرة على المناسبة أو المرحلة الأولى من الدفاع من غير حسم طبيعة الإجراء القضائي.
- source_word: οὐδείς μοι παρεγένετο
  choice: لم يحضر أحد ليؤازرني
  rationale: المعنى الحرفي هو أن أحدًا لم يأتِ ليكون حاضرًا معه، والسياق يفيد الحضور دعمًا له؛ وتجمع الصياغة بين الحضور والمؤازرة.
- source_word: πάντες με ἐγκατέλιπον
  choice: تركني الجميع
  rationale: يفيد الفعل التخلي عن شخص في موقف عسير. و«تركني» واضحة وطبيعية، ولا تزيد على النص توصيفًا وجدانيًا أقوى.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: لا يُحسَب ذلك عليهم
  rationale: تحافظ الصياغة على صورة الحساب أو تسجيل الذنب، وتنقل صيغة التمني الدعائية في عبارة عربية موجزة، مع جعل مرجع الضمير الضمني واضحًا بلفظ «ذلك».
theological_decisions:
- issue: نبرة العبارة الختامية تجاه الذين تركوا بولس
  choice: 'صيغة دعاء وتمنٍّ بألا يُحسب فعلهم عليهم: «لا يُحسَب ذلك عليهم».'
  alternative: «لا يُؤاخَذوا به» أو «ليت ذلك لا يُحسب عليهم».
  rationale: صيغة التمني اليونانية مع النفي تعبّر طبيعيًا عن رغبة أو دعاء، لا عن تقرير واقع. وتحافظ الترجمة على لغة عدم احتساب الذنب من غير تحويلها إلى تقرير عقائدي أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «دفاعي» لإبقاء السياق القضائي، و«ليؤازرني» لإظهار دلالة الحضور الداعم من غير استبدال معنى الفعل الحرفي، ولذلك أُثبتت الحاشية. جاءت الخاتمة بصيغة دعائية موجزة تحفظ التمني وعدم احتساب الذنب.
