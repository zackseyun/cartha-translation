base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: ar
  text: أعلن الكلمة، وكن مستعدًّا[a] في الوقت المناسب وغير المناسب؛ وبِّخ، وازجر، وحُثَّ[b]، بكل صبر وتعليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: كن حاضرًا، أو ألحَّ في الأمر. والعبارة التالية تعني: سواء كان الوقت ملائمًا أم غير ملائم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: شجِّع أو عزِّ؛ فالفعل قد يفيد الحث أو التشجيع أو التعزية بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: نادِ
  rationale: فعل أمر يفيد الإعلان العلني على نحو المنادي؛ و«نادِ» عربية واضحة وموجزة وتحفظ قوة التكليف.
- source_word: τὸν λόγον
  choice: بالكلمة
  rationale: تحفظ العبارة سعة λόγος ولا تحصرها صراحةً في «الإنجيل» أو «الكتاب المقدس».
- source_word: ἐπίστηθι
  choice: كن مستعدًّا
  rationale: ينقل معنى الحضور والتأهب والمواظبة على القيام بالمهمة، ويلائم العبارة الزمنية التالية.
- source_word: εὐκαίρως ἀκαίρως
  choice: في الوقت المناسب وغير المناسب
  rationale: صياغة عربية طبيعية تحفظ المقابلة البلاغية، أي سواء بدت الظروف مواتية أم غير مواتية.
- source_word: ἔλεγξον
  choice: وبِّخ
  rationale: يفيد كشف الخطأ ومواجهته بقصد التصحيح، وهو أخف نسبيًّا من الفعل التالي.
- source_word: ἐπιτίμησον
  choice: وازجر
  rationale: يحفظ النبرة الأشد في هذا الأمر، ويميّزه عن فعل التوبيخ السابق.
- source_word: παρακάλεσον
  choice: وشجِّع
  rationale: للفعل مجال دلالي يشمل الحث والتشجيع والتعزية؛ و«شجِّع» يوازن هنا الفعلين التصحيحيين السابقين، مع إثبات البديل في الحاشية.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: بكل صبر
  rationale: تنقل معنى طول الأناة في التعامل مع الناس، وتحفظ شمول πάσῃ.
- source_word: καὶ διδαχῇ
  choice: وتعليم
  rationale: تحفظ الاسم الدال على التعليم أو الإرشاد الذي ينبغي أن يصاحب الأوامر السابقة.
theological_decisions:
- issue: مدى مدلول «الكلمة»
  choice: الإبقاء على «الكلمة» من غير توسيع تفسيري
  alternative: الرسالة، أو الإنجيل، أو الكتاب المقدس
  rationale: السياق يتصل بالإعلان الرسولي والكتب المقدسة، لكن لفظ λόγος في الآية لا يحدّد واحدًا من هذه المعاني صراحةً؛ لذلك تُصان سعته.
- issue: قوة παρακάλεσον
  choice: شجِّع
  alternative: حُثَّ، أو عزِّ
  rationale: اللفظ اليوناني يحتمل الحث والتشجيع والتعزية. اختيار «شجِّع» يحفظ البعد الإيجابي بعد التوبيخ والزجر، فيما تُذكر دلالة الحث في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع الحفاظ على تتابع أفعال الأمر وإيقاع المقابلة في الأصل. وُضعت علامتا الحاشية في المتن، وتُركت «الكلمة» من غير تخصيص مذهبي أو تفسيري.
