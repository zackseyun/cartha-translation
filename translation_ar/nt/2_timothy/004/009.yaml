lexical_decisions:
- source_word: Σπούδασον
  choice: اجتهد
  rationale: فعل أمر يفيد بذل الجهد والحرص، لا مجرد الإسراع؛ و«اجتهد» يحفظ هذا المعنى ويميّزه عن دلالة ταχέως.
- source_word: ἐλθεῖν
  choice: أن تأتي
  rationale: مصدر فعلي تابع لفعل الأمر، ومع πρός με تكون «أن تأتي إليَّ» الصياغة العربية الطبيعية.
- source_word: πρός με
  choice: إليَّ
  rationale: يدل التركيب مع حالة النصب على الحركة باتجاه المتكلم، وتؤديه «إليَّ» بإيجاز ووضوح.
- source_word: ταχέως
  choice: سريعًا
  rationale: ظرف يحتمل معنى السرعة أو قرب الوقت. «سريعًا» يحفظ عنصر الاستعجال مستقلًا عن معنى الاجتهاد في Σπούδασον.
