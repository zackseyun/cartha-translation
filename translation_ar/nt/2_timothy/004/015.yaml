  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: ar
  text: فاحذرْه أنت أيضًا، لأنه قاوم كلامنا بشدة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάσσου
  choice: احذرْه
  rationale: فعل أمر مضارع متوسط يدعو تيموثاوس إلى الحذر الشخصي المستمر من الإسكندر. و«احذره» عربية واضحة وطبيعية وتحفظ قوة التحذير.
- source_word: λίαν
  choice: بشدة
  rationale: تُكثّف اللفظة معنى المقاومة، و«بشدة» تلائم الفعل في العربية وتنقل درجة القوة بوضوح.
- source_word: ἀντέστη
  choice: قاوم
  rationale: يدل الفعل على الوقوف ضد شيء أو مقاومته. و«قاوم» يحفظ صورة المعارضة الفعالة من غير تضييق السياق.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: كلامنا
  rationale: يحافظ «كلامنا» على عمومية λόγοι وقربه من النص اليوناني، من غير حصره في الرسالة أو التعليم أو الشهادة القضائية.
- source_word: ὃν
  choice: ـه
  rationale: ضمير الوصل يعود إلى الإسكندر المذكور في العدد السابق، وتؤديه العربية طبيعيًا بضمير المفعول المتصل في «احذره».
- source_word: καὶ σὺ
  choice: أنت أيضًا
  rationale: إظهار الضمير «أنت» يحفظ توكيد σὺ، و«أيضًا» تنقل καὶ التي تضم تيموثاوس إلى بولس في ضرورة الحذر.
theological_decisions:
- issue: نطاق «كلامنا»
  choice: الإبقاء على «كلامنا» بوصفه كلام بولس ورفقائه دون تحديد نوعه
  alternative: رسالتنا، أو تعليمنا، أو شهادتنا في الدفاع
  rationale: العبارة اليونانية لا تحدد أكان المقصود مرافعة قضائية أم كرازة أم تعليمًا عقائديًا؛ لذلك يحفظ النص العربي هذا الاتساع بدل حسمه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، بنبرة تحذير مباشرة وكريمة. قُدّم الفعل في «فاحذره» لطبيعية الأسلوب، مع إبراز «أنت» للمحافظة على التوكيد اليوناني. لا حاجة إلى حاشية لأن المتن يترجم λόγοι ترجمة قريبة غير تفسيرية.
