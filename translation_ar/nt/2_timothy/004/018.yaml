  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: ar
  text: سينقذني الرب من كل عمل شرير، وسيدخلني سالمًا إلى ملكوته السماوي[a]. له المجد إلى أبد الآبدين[b]. آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسيخلّصني إلى ملكوته السماوي»؛ وهي صياغة أقرب إلى تركيب اليونانية، لكنها أقل سلاسة في العربية.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى دهور الدهور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: سينقذني
  rationale: الفعل ῥύομαι يدل على الإنقاذ أو التخليص من خطر؛ و«سينقذني» عربي واضح يحفظ قوة المعنى.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: من كل عمل شرير
  rationale: يحافظ «عمل» على المقابل الواسع لـἔργον، وتؤدي «شرير» المعنى الأخلاقي لـπονηρός من غير حصره في نوع بعينه من الأفعال.
- source_word: σώσει εἰς
  choice: سيحفظني حتى أدخل
  rationale: تجمع الصياغة بين معنى الخلاص أو الحفظ في σῴζω ودلالة الغاية والدخول في εἰς، مع تجنب التركيب العربي غير المألوف «يخلّصني إلى».
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: حتى أدخل ملكوته السماوي
  rationale: تُظهر العبارة اتجاه الحركة وبلوغ الغاية، وتحفظ وصف الملكوت بأنه سماوي.
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي المألوف الذي يحفظ دلالة السلطان والاستعمال التعبدي في السياق.
- source_word: ᾧ ἡ δόξα
  choice: له المجد
  rationale: صيغة تمجيد عربية طبيعية وأمينة للجملة الاسمية اليونانية.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إلى أبد الآبدين
  rationale: تعبير عربي راسخ ينقل قوة الاستمرار غير المحدود في العبارة اليونانية، مع بقاء صورتها التكثيفية.
- source_word: ἀμήν
  choice: آمين
  rationale: النقل العربي المعياري للتوكيد الليتورجي.
theological_decisions:
- issue: العلاقة بين الإنقاذ من العمل الشرير والخلاص النهائي
  choice: تُبقي الترجمة الإنقاذ من كل عمل شرير متميزًا عن الحفظ المؤدي إلى دخول الملكوت السماوي، من دون أن تعد بالنجاة من الموت الجسدي.
  alternative: فهم الإنقاذ بوصفه ضمانًا للنجاة من الإعدام، أو قصره صراحة على الإنقاذ الروحي وحده.
  rationale: اقتران ῥύσεταί بـσώσει وورود غاية «إلى ملكوته السماوي» يتيح فهم الحفظ النهائي من غير حسم كيفية الإنقاذ الزمني؛ لذلك تُصان الثقة والتوتر اللاهوتي معًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعملت «سيحفظني حتى أدخل» بوصفها مقابلة طبيعية لـσώσει εἰς، مع إثبات البديل الأقرب حرفيًا في الحاشية. جميع علامات الحواشي مثبتة في المتن.
