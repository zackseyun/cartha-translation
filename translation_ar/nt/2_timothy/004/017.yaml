  terminology: «الرب»، و«إعلان البشارة»، و«الأمم»، و«فم الأسد» اختيارات مناسبة. وتحفظ الحاشية البديل الدلالي لـἔθνη دون حسمه داخل المتن، كما تحافظ الحاشية الثانية على غموض صورة الأسد.
