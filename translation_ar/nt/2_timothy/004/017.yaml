base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: ar
  text: أَمَّا الرَّبُّ فوقف إلى جانبي وقوَّاني، لكي يكتمل إعلان البشارة على يدي وتسمع جميع الأمم ذلك[a]، وقد أُنقذت من فم الأسد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية «الأمم» أو «غير اليهود»؛ ويرجَّح هنا أنها تشير إلى الشعوب غير اليهودية التي تسمع البشارة.
    reason: lexical_alternative
  - marker: b
    text: قد يكون التعبير «من فم الأسد» صورةً مجازية للنجاة من خطر مميت، لا إشارةً إلى أسد حرفي.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: أَمَّا الرَّبُّ
  rationale: ينقل «الرَّبّ» الدلالة المعتادة لـκύριος من غير تعيين صريح لهوية المشار إليه، وتُظهر «أمّا» المقابلة مع تخلّي الآخرين المذكور في السياق السابق.
- source_word: μοι παρέστη
  choice: وقف إلى جانبي
  rationale: تعبير عربي طبيعي يحفظ صورة الحضور الشخصي المؤازر، لا مجرد الوجود المكاني.
- source_word: ἐνεδυνάμωσέν με
  choice: قوَّاني
  rationale: ينقل معنى منح القوة بعبارة عربية واضحة وموجزة.
- source_word: ἵνα δι’ ἐμοῦ
  choice: لكي ... على يدي
  rationale: تحفظ «لكي» دلالة الغرض، وتفيد «على يدي» الوساطة أو الأداة التي يدل عليها διά مع المضاف إليه.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: يكتمل إعلان البشارة
  rationale: يجمع هذا التعبير بين مضمون الإعلان وفكرة بلوغه تمام التنفيذ، من غير حصر الفعل في مجرد الكلام أو في نتيجة تفسيرية أضيق.
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: تسمع جميع الأمم
  rationale: تحافظ «الأمم» على السعة الدلالية لـἔθνη، التي قد تشير إلى الشعوب عمومًا أو إلى غير اليهود في السياق الرسولي.
- source_word: ἐρρύσθην
  choice: أُنقذت
  rationale: فعل معاصر واضح ينقل النجاة من خطر شديد، مع المحافظة على صيغة المبني للمجهول في الأصل.
- source_word: ἐκ στόματος λέοντος
  choice: من فم الأسد
  rationale: ترجمة مباشرة تحفظ الصورة ولا تحسم هل الأسد حرفي أم كناية عن خطر أو قوة معادية.
theological_decisions:
- issue: المشار إليه بلقب «الرَّبّ»
  choice: الإبقاء على «الرَّبّ» من غير تحديد إضافي
  alternative: تعيينه صراحةً بأنه يسوع أو الله
  rationale: يسمح السياق بفهم اللقب على أنه يشير إلى الرب يسوع، لكن النص نفسه لا يصرّح بالتعيين هنا، فالأولى حفظ عبارته.
- issue: معنى «من فم الأسد»
  choice: الإبقاء على الصورة كما هي
  alternative: تفسير الأسد بأنه نيرون أو الشيطان أو حيوان حرفي
  rationale: لا يحسم النص واحدًا من هذه التفسيرات؛ لذلك تُحفظ الصورة وما فيها من توتر تاريخي ولاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت «إعلان البشارة» بدل مصطلح كنسي أشد تخصصًا، وحُفظت صورة «فم الأسد» وغموض «الأمم» من غير تفسيرهما داخل المتن.
