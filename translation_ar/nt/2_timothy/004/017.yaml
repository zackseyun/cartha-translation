  source_fidelity: 'المتن ينقل المعنى الأساسي بأمانة: حضور الرب المؤازر، وتقويته لبولس، وغرض إتمام الكرازة ووصول السماع إلى الأمم، ثم النجاة من «فم الأسد». لكن فعل «تسمع» ورد بلا مفعول به في العربية، مع أن المسموع مفهوم من السياق اليوناني بوصفه الكرازة؛ وإظهاره ضروري لسلامة التركيب ووضوح المعنى.'
