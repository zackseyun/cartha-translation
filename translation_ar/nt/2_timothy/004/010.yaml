  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: ar
  text: لأن ديماس تركني، إذ أحبّ العصر الحاضر، وذهب إلى تسالونيكي؛ وذهب كريسكيس إلى غلاطية، وتيطس إلى دلماطية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: تركني
  rationale: ينقل معنى أن ديماس خلّف بولس وراءه في ظرف احتياج، ويحفظ النبرة السلبية من غير أن يصرّح بارتداد عن الإيمان لا يذكره النص صراحة.
- source_word: ἀγαπήσας
  choice: إذ أحبّ
  rationale: يحافظ على الصلة الوثيقة بين محبة ديماس للعصر الحاضر وتركه لبولس، مع إبقاء العلاقة قابلة للفهم بوصفها ظرفية ذات دلالة سببية من غير تحويلها إلى تعليل صريح تمامًا.
- source_word: τὸν νῦν αἰῶνα
  choice: العصر الحاضر
  rationale: يعكس الدلالة الزمنية والأخلاقية لكلمة αἰών، ويتجنب الإيحاء بأن المقصود هو الكون المادي.
- source_word: ἐπορεύθη
  choice: ذهب
  rationale: تعبير عربي طبيعي ومباشر عن الحركة إلى الوجهة المذكورة من غير زيادة في تحديد كيفية الرحيل.
- source_word: Θεσσαλονίκην
  choice: تسالونيكي
  rationale: الصيغة العربية الحديثة الشائعة لاسم المدينة.
- source_word: Κρήσκης
  choice: كريسكيس
  rationale: نقل صوتي واضح للاسم اليوناني.
- source_word: Γαλατίαν
  choice: غلاطية
  rationale: الصيغة العربية الكتابية الشائعة لاسم الإقليم.
- source_word: Τίτος
  choice: تيطس
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: Δαλματίαν
  choice: دلماطية
  rationale: الصيغة العربية الشائعة لاسم الإقليم.
- source_word: γάρ
  choice: لأن
  rationale: يحفظ الصلة التعليلية بالسياق السابق، حيث تفسّر الآية حاجة بولس إلى حضور تيموثاوس.
theological_decisions:
- issue: هل يدل ترك ديماس لبولس على ارتداده عن الإيمان أم على تخليه عنه شخصيًا؟
  choice: «تركني» مع الحفاظ على اللوم الأخلاقي من غير التصريح بالارتداد.
  alternative: «هجرني» أو صياغة أقوى تنص على أنه ترك الإيمان.
  rationale: يذكر النص أن ديماس ترك بولس بسبب محبته للعصر الحاضر، لكنه لا يحكم صراحة على مصيره الإيماني النهائي؛ لذلك تحافظ الصياغة على التوتر اللاهوتي ولا تتجاوز منطوق الآية.
- issue: طبيعة العلاقة التي يفيدها اسم الفاعل ἀγαπήσας بين المحبة والترك
  choice: «إذ أحبّ» لإبقاء الصلة وثيقة مع احتمال الدلالة السببية.
  alternative: «لأنه أحبّ» لتقرير السببية صراحة، أو «بعدما أحبّ» للدلالة الزمنية.
  rationale: الصيغة اليونانية تحتمل فهمًا سببيًا قويًا في السياق، لكنها لا تستعمل أداة سببية صريحة؛ لذا تحفظ «إذ» قدرًا مناسبًا من هذا الاتساع.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة وموقّرة. أُكمل الفعلان المحذوفان في العبارتين الأخيرتين بلفظ «وذهب» بما يلائم الحذف المفهوم في اليونانية ويمنع التباس القائمة على القارئ العربي.
