  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: ar
  text: أَمَّا تِيخِيكُسُ فَقَدْ أَرْسَلْتُهُ إِلَى أَفَسُسَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وقد أرسلتُ تيخيكُس إلى أفسس» أو «لكنني أرسلتُ تيخيكُس إلى أفسس»؛ فأداة الربط اليونانية δέ قد تفيد مجرد الاستمرار أو انتقالًا في الكلام أو مقابلة خفيفة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: تِيخِيكُس
  rationale: اسم شخص في حالة النصب؛ نُقل صوتيًا وفق الصيغة العربية الشائعة للاسم الكتابي.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: أداة ربط قد تدل على انتقال في الكلام أو مقابلة خفيفة. صيغة «أمّا... فـ» طبيعية في العربية وتحفظ هذا الانتقال من غير تشديد التباين.
- source_word: ἀπέστειλα
  choice: أَرْسَلْتُهُ
  rationale: فعل ماضٍ خبري، متكلم مفرد. أُظهر ضمير المفعول «ـه» لأن الاسم المتقدم هو مفعول الفعل في اليونانية، ولتحقيق تركيب عربي طبيعي.
- source_word: εἰς
  choice: إِلَى
  rationale: تفيد الوجهة مع اسم مدينة، والمقابل العربي الطبيعي هو «إلى».
- source_word: Ἔφεσον
  choice: أَفَسُس
  rationale: اسم مكان منقول بالصيغة العربية الكتابية الشائعة.
theological_decisions: []
