reference: 2 Timothy 2:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: ar
  text: 'ومع ذلك، فإن أساس الله الراسخ قائم، وهو يحمل هذا الختم[a]: «الرب يعرف الذين هم له»، و«ليبتعد عن الإثم كل من يذكر اسم الرب[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهو يحمل هذه الكتابة». قد يدل اللفظ المترجم «الختم» على العلامة المميزة أو على الكتابة المنقوشة في الختم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كل من يدعو باسم الرب». يقول اليوناني حرفيًا: «يسمّي اسم الرب»، وهو تعبير قد يدل على الدعاء باسمه أو إعلان الانتساب والولاء له.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: ومع ذلك
  rationale: تفيد انتقالًا استدراكيًا قويًا في مقابل الكلام السابق عن التعليم الكاذب، وتحافظ على الثقل البلاغي دون تكلّف.
- source_word: στερεὸς θεμέλιος
  choice: أساس الله الراسخ
  rationale: ينقل صورة الأساس مع معنى الثبات والمتانة، وهو تعبير عربي واضح وطبيعي.
- source_word: τοῦ θεοῦ
  choice: أساس الله
  rationale: يحافظ على علاقة الإضافة من غير حسم ما إذا كانت تفيد الملكية أو المصدر أو الوصف.
- source_word: ἕστηκεν
  choice: قائم
  rationale: ينقل دلالة صيغة التمام اليونانية على حالة ثابتة ومستقرة في الحاضر.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: وهو يحمل هذا الختم
  rationale: يحافظ على صورة الختم بوصفه علامة تعريف وتصديق، مع صياغة عربية سليمة.
- source_word: Ἔγνω
  choice: يعرف
  rationale: المضارع العربي يلائم الدلالة المستمرة أو المبدئية للعبارة المقتبسة، بدل قصرها على معرفة حدثت في الماضي.
- source_word: κύριος
  choice: الرب
  rationale: يحافظ على اللقب الكتابي وما فيه من ثقل عهدي، من غير تعيين مرجعه بما يتجاوز النص.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: الذين هم له
  rationale: يحفظ تركيب الأصل وعلاقة الانتماء، مع إبقاء العبارة موجزة وواضحة.
- source_word: Ἀποστήτω
  choice: ليبتعد
  rationale: ينقل صيغة الأمر والدعوة إلى انفصال حاسم عن الإثم بلغة عربية طبيعية.
- source_word: ἀπὸ ἀδικίας
  choice: عن الإثم
  rationale: يشمل معنى الفعل الخاطئ والشر الأخلاقي في هذا السياق الديني، دون قصر اللفظ على الظلم الاجتماعي وحده.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: كل من يذكر اسم الرب
  rationale: يقترب من التكرار البلاغي في الأصل مع تجنب تركيب عربي متعثر مثل «يسمّي اسم الرب»، ويبقي احتمال الدعاء بالاسم أو إعلان الانتساب إليه موضحًا في الحاشية.
theological_decisions:
- issue: مرجع لقب «الرب» في عبارتي الختم
  choice: إبقاء «الرب» في الموضعين من غير تحديد صريح للمرجع
  alternative: تفسير اللقب بأنه يشير إلى الله الآب في الموضعين، أو إلى المسيح في الموضعين، أو التفريق بين مرجعه في العبارتين
  rationale: يستعمل النص اليوناني κύριος بلا توضيح صريح، ويجمع بين لغة كتابية سابقة وسياق مسيحي؛ لذلك ينبغي حفظ هذا العمق والاحتمال اللاهوتي بدل حسمه في الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارة الأساس والختم، كما حُفظت صيغة «الذين هم له» والتوتر الدلالي في «الرب» من غير إضافة تفسير طائفي. وُضعت علامتا الحاشية [a] و[b] في موضعيهما المباشرين في المتن.
