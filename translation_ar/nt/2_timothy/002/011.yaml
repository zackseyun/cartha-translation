lexical_decisions:
- source_word: πιστὸς
  choice: جدير بالثقة
  rationale: صفة خبرية تصف «القول»، وهذه العبارة تنقل معنى الاعتماد عليه وقبول صدقه بلغة عربية طبيعية، من غير أن توحي بأن المقصود أمانة شخص.
- source_word: ὁ λόγος
  choice: هذا القول
  rationale: تأتي العبارة في الرسائل الرعوية صيغةً تمهّد لإعلان موجز متداول أو جدير بالحفظ؛ و«هذا القول» أوضح هنا من الترجمة الحرفية «الكلمة».
- source_word: εἰ γὰρ
  choice: فإن كنا
  rationale: تحفظ الفاء قوة γάρ التفسيرية، وتحفظ «إن» بنية الشرط، بينما تلائم «كنا قد متنا» وقوع الفعل الماضي في العربية.
- source_word: συναπεθάνομεν
  choice: كنا قد متنا معه
  rationale: الفعل الماضي المركب بالسابقة συν- يدل على موت مشترك مع آخر. أُظهر الضمير «معه» لأن السياق يجعل المسيح هو المرجع، من غير إضافة وصف لزمن هذا الموت أو كيفيته.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تفيد هنا المقابلة الإضافية بين شطري الشرط: كما شاركناه الموت، سنشاركه الحياة أيضًا.'
- source_word: συζήσομεν
  choice: فسنحيا معه
  rationale: المستقبل في الفعل والسابقة συν- محفوظان بوضوح في «سنحيا معه»، من غير حصر الحياة في الحاضر أو القيامة الآتية.
theological_decisions:
- issue: مرجع السابقة συν- في الفعلين
  choice: إظهار «معه» في الفعلين، والضمير عائد إلى المسيح.
  alternative: 'إبقاء المصاحبة ضمنية: «إن كنا قد متنا، فسنحيا أيضًا».'
  rationale: لا يذكر النص مفعول المصاحبة صراحة، لكن الفعلين المركبين يدلان عليها، والسياق المسيحاني يعيّن المرجع بوضوح. وإظهار الضمير ضروري لسلامة المعنى في العربية.
- issue: المدى الزمني واللاهوتي للحياة مع المسيح
  choice: الإبقاء على العبارة الواسعة «سنحيا معه».
  alternative: تحديدها بالقيامة المستقبلية وحدها، أو بالحياة الروحية الحاضرة وحدها.
  rationale: صيغة المستقبل واضحة، لكن العبارة لا تفصّل طبيعة هذه الحياة. لذلك لا تحصر الترجمة دلالتها في تفسير لاهوتي أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «هذا القول جدير بالثقة» بوصفها تعبيرًا طبيعيًا عن العبارة الاصطلاحية، مع الحفاظ على توازن الشرط والجواب وعلى الغموض المقصود في نطاق الحياة مع المسيح.
