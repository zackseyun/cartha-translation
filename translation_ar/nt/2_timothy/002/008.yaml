  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: ar
  text: اذكر يسوع المسيح[a]، الذي أُقيم من بين الأموات، وهو من نسل داود[b]، بحسب إنجيلي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب؛ والكلمة اليونانية Χριστός تعني «الممسوح».»
    reason: alternative_reading
  - marker: b
    text: 'حرفيًّا: «من زرع داود»، أي من نسله أو ذريته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: اذكر
  rationale: فعل أمر مضارع يفيد إبقاء يسوع حاضرًا في الذهن؛ و«اذكر» صياغة عربية طبيعية تحافظ على قوة الأمر.
- source_word: Ἰησοῦν Χριστόν
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته اللقبية، ولا سيما مع ذكر النسب إلى داود.
- source_word: ἐγηγερμένον
  choice: الذي أُقيم
  rationale: اسم مفعول تام مبني للمجهول يدل على أن يسوع قد أُقيم ولا يزال حيًّا؛ والصياغة تحفظ المبني للمجهول بوضوح.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل التعبير اليوناني في سياق القيامة بدقة وبأسلوب عربي مألوف.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: من نسل داود
  rationale: «نسل» ينقل الاستعمال النسبي لكلمة σπέρμα بصورة طبيعية، مع إبقاء «من ذرية داود» بديلًا ممكنًا.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: بحسب إنجيلي
  rationale: يحافظ على معنى κατά وعلى ضمير المتكلم في العبارة البولسية من غير أن يوحي بأن المقصود إنجيل مختلف.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح المنتظر
  rationale: «المسيح» هو اللقب العربي الكتابي المألوف ويحفظ الصلة المسيانية بنسل داود، أما إضافة «المنتظر» فتشرح أكثر مما يقوله النص.
- issue: قوة ἐγηγερμένον المبني للمجهول
  choice: الذي أُقيم
  alternative: القائم
  rationale: المختار يحافظ على المبني للمجهول وعلى كون القيامة فعلًا وقع على يسوع، بينما قد تُضعف «القائم» هذه الدلالة.
- issue: معنى «إنجيلي»
  choice: بحسب إنجيلي
  alternative: بحسب الإنجيل الذي أبشّر به
  rationale: تُحفظ صيغة الملكية كما في الأصل، من غير تفسيرها على أنها رسالة خاصة مختلفة؛ والبديل يوضح المقصود لكنه توسع تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أُقيم» للمحافظة على المبني للمجهول، و«من نسل داود» لتقديم التعبير النسبي بأسلوب طبيعي. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
