  source_fidelity: تجنّب الأقوال الفارغة المنافية للتقوى ينقل βεβήλους κενοφωνίας مع الحفاظ على بُعدها الديني والأخلاقي. أمّا «ستدفع أصحابها» فتضيف علاقة سببية وفاعلًا («أصحابها») غير مذكورين صراحة في النص اليوناني، وتزيل صيغة الفاعل الجمع المبهمة في προκόψουσιν. كذلك «الفجور» أضيق وأشد اتصالًا بالانحلال الأخلاقي من ἀσέβεια، التي تدل أساسًا على عدم التقوى أو عدم توقير الله.
