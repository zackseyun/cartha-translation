  rationale: يصحح النص الإضافة التفسيرية المتعلقة بـ«أصحاب» الأقوال، ويحافظ على ضمير الفاعل الجمع كما في اليونانية. كما يستعمل مصطلحات عربية واضحة تؤدي الطابع غير المتقي للكلام ونتيجته المتمثلة في مزيد من عدم التقوى، من غير حصر المعنى في الفجور الأخلاقي.
