  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: ar
  text: أمّا الأقوال الفارغة المنافية للتقوى فتجنَّبها[a]، فإنهم سيمضون إلى مزيد من عدم التقوى،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الثرثرة الباطلة المنافية للتقوى»، أو «الكلام الأجوف المنتهك للحرمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: المدنَّسة
  rationale: تدل الكلمة على ما هو غير مقدس أو منتهك للحرمة؛ و«المدنَّسة» تحفظ المقابلة الدينية مع المقدس، ولا تضعفها إلى مجرد كلام دنيوي.
- source_word: κενοφωνίας
  choice: الأقوال الفارغة
  rationale: تنقل معنى الكلام الخالي من المضمون أو القيمة بعبارة عربية طبيعية واضحة.
- source_word: περιΐστασο
  choice: فتجنَّبها
  rationale: صيغة الأمر المتوسطة تدعو تيموثاوس إلى الابتعاد عنها وعدم الانخراط فيها؛ و«تجنّب» موجزة وطبيعية.
- source_word: ἐπὶ πλεῖον
  choice: إلى مزيد من
  rationale: تفيد التقدم إلى درجة أكبر، وهي صياغة عربية سلسة مع «الفجور».
- source_word: προκόψουσιν
  choice: ستدفع أصحابها
  rationale: الفعل جمع، وأقرب مرجع نحوي في اليونانية هو «الأقوال»؛ ولأن إسناد التقدم إلى الأقوال مجازي، توضح العربية الطبيعية أثرها في أصحابها دون حصرهم في فئة مسماة غير مذكورة.
- source_word: ἀσεβείας
  choice: الفجور
  rationale: يفيد انعدام التقوى وعدم توقير الله؛ و«الفجور» لفظ عربي واضح ذو ثقل ديني وأخلاقي، وإن كان «عدم التقوى» بديلاً أكثر تفسيرية.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: ينقل التحول والمقابلة مع الوصية السابقة بأسلوب عربي فصيح طبيعي.
theological_decisions:
- issue: هل الأقوال عديمة النفع فقط أم منتهكة للقداسة أيضًا؟
  choice: الأقوال الفارغة المدنَّسة
  alternative: الثرثرة الباطلة التي لا توقر الله
  rationale: يجمع النص بين خواء κενοφωνίας والطابع غير المقدس في βεβήλους، فلا ينبغي اختزال التحذير في كلام عديم الفائدة فحسب.
- issue: مرجع الفعل الجمع προκόψουσιν
  choice: اعتبار الأقوال فاعلًا نحويًا مجازيًا، مع بيان أنها تدفع أصحابها إلى مزيد من الفجور
  alternative: فإنهم سيتقدمون إلى مزيد من الفجور
  rationale: صيغة الفعل جمع ويمكن نحويًا وصلها بـ«الأقوال» السابقة، بينما قد يُفهم منها ضمنًا المتكلمون. تحافظ الصياغة المختارة على أثر الكلام وعلى حضور أصحابه من غير حسم مفرط للغموض.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعملت «الأقوال» بدل «الثرثرة» في المتن لأنها أوسع وأقل عامية، مع إبقاء البدائل في الحاشية. وُضع الضمير في «فتجنبها» بعد العبارة لتفادي الثقل.
