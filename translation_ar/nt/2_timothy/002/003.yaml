lexical_decisions:
- source_word: συγκακοπάθησον
  choice: شارك في احتمال المشقّات
  rationale: فعل أمر للمفرد، وتدل السابقة συν- على المشاركة في المكابدة مع آخرين. تنقل الصياغة معنى المشاركة من غير أن تضيف مفعولًا غير مصرّح به مثل «معي».
- source_word: ὡς
  choice: كـ
  rationale: أداة تشبيه تبين الصفة أو الكيفية، وقد نُقلت بصياغة عربية طبيعية موجزة.
- source_word: καλὸς
  choice: صالح
  rationale: يدل في هذا التركيب على الجندي الجدير والمحمود في أداء مهمته؛ و«صالح» تعبير عربي واضح يحفظ التقويم الأخلاقي والوظيفي.
- source_word: στρατιώτης
  choice: جندي
  rationale: المقابل العربي المباشر الذي يلائم الصورة العسكرية المجازية في السياق.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: اللفظ لقب معناه «المسيح»، لا مجرد اسم شخصي، لذلك تُرجم دلاليًا مع الحفاظ على ترتيب الأصل.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: النقل العربي المألوف للاسم الشخصي Ἰησοῦς، وهو هنا في تركيب الإضافة مع لقب المسيح.
theological_decisions:
- issue: 'دلالة συγκακοπάθησον: هل يُذكر «معي» صراحة؟'
  choice: شارك في احتمال المشقّات
  alternative: تحمّل المشقّة معي
  rationale: السابقة συν- تفيد المشاركة، لكن «معي» ليست مذكورة صراحة في هذه الصيغة. يحفظ النص الرئيس البعد الجماعي من غير تعيين الطرف الآخر، وتُذكر القراءة السياقية في الحاشية.
- issue: صياغة Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحافظ «المسيح يسوع» على ترتيب الأصل وعلى كون Χριστός لقبًا يسبق الاسم الشخصي، مع بقاء العبارة مفهومة في العربية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «شارك في احتمال المشقّات» لإبراز معنى المشاركة والمكابدة معًا، و«كجندي صالح» للحفاظ على الصورة العسكرية بإيجاز طبيعي.
