  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: ar
  text: لِهٰذَا أَحْتَمِلُ كُلَّ شَيْءٍ مِنْ أَجْلِ الْمُخْتَارِينَ[a]، لِكَيْ يَنَالُوا هُمْ أَيْضًا الْخَلَاصَ الَّذِي فِي الْمَسِيحِ يَسُوعَ، مَعَ مَجْدٍ أَبَدِيٍّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الذين اختيروا». واللفظ اليوناني هو ἐκλεκτούς.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: تنقل الإحالة السببية إلى السياق السابق بعبارة عربية موجزة وطبيعية.
- source_word: πάντα ὑπομένω
  choice: أَحْتَمِلُ كُلَّ شَيْءٍ
  rationale: تحفظ شمول πάντα ودلالة ὑπομένω على الثبات تحت المشقة من غير توسع تفسيري.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: مِنْ أَجْلِ الْمُخْتَارِينَ
  rationale: تفيد العبارة أن الاحتمال لأجل منفعة جماعة موصوفة بأنها مختارة، وتحافظ على لغة الاختيار في الأصل.
- source_word: ἵνα καὶ αὐτοὶ
  choice: لِكَيْ يَنَالُوا هُمْ أَيْضًا
  rationale: «لكي» تحفظ معنى الغاية، وإظهار الضمير «هم» مع «أيضًا» ينقل توكيد αὐτοὶ والقيمة الإضافية لـκαί.
- source_word: σωτηρίας τύχωσιν
  choice: يَنَالُوا الْخَلَاصَ
  rationale: «ينالوا» تعبر طبيعيًا عن معنى الحصول أو الظفر في τυγχάνω، و«الخلاص» يتحدد بالعبارة اللاحقة.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: الَّذِي فِي الْمَسِيحِ يَسُوعَ
  rationale: تجعل العبارة صفةً للخلاص وتحفظ تركيب «في المسيح يسوع» كما هو من غير شرح معنى الاتحاد أو المجال.
- source_word: μετὰ δόξης αἰωνίου
  choice: مَعَ مَجْدٍ أَبَدِيٍّ
  rationale: تحفظ معنى المصاحبة في μετά، ولا تحسم بألفاظ تفسيرية كيفية ارتباط المجد بالخلاص أو نواله.
theological_decisions:
- issue: دلالة ἐκλεκτούς
  choice: الْمُخْتَارِينَ
  alternative: الَّذِينَ اخْتَارَهُمُ اللهُ
  rationale: «المختارين» أقرب إلى الصيغة اليونانية وأقل تفسيرًا؛ فلا يضيف النص هنا شرحًا لهوية الفاعل أو نظامًا عقائديًا للاختيار.
- issue: نقل Χριστῷ بوصفه لقبًا
  choice: الْمَسِيحِ يَسُوعَ
  alternative: يَسُوعَ الْمَسِيحِ
  rationale: «المسيح» هو المقابل العربي المباشر للقب Χριστός، والإبقاء على ترتيب الأصل «المسيح يسوع» يحفظ صيغة بولس في هذا الموضع.
- issue: ارتباط عبارة المجد الأبدي
  choice: مَعَ مَجْدٍ أَبَدِيٍّ
  alternative: مَصْحُوبًا بِمَجْدٍ أَبَدِيٍّ
  rationale: الصياغة المختارة تحافظ على إيجاز الأصل وعلى قدر من الانفتاح النحوي، بدل أن تفسر صراحةً أن المجد وصف لطريقة نوال الخلاص.
translation_notes:
  register: عربية فصحى واضحة وموقرة، بجمل مباشرة وألفاظ كتابية مفهومة. استُعمل «المسيح يسوع» لأن «المسيح» في العربية ينقل معنى اللقب، مع الحفاظ على ترتيب الأصل. وُضعت علامة الحاشية [a] في المتن.
