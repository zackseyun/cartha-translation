translation:
  language: ar
  text: تأمَّلْ ما أقوله[a]، لأن الرب سيعطيك فهمًا في كل شيء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فكِّرْ فيما أقوله». ويمكن أن يحمل الفعل أيضًا معنى «افهم».'
    reason: lexical_alternative
  - marker: b
    text: عبارة «الرب» غير محددة بمزيد من البيان في اليونانية؛ ويختلف المفسرون في كون المقصود تحديدًا الرب يسوع أم الله بوجه أعم.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: تأمَّلْ
  rationale: صيغة الأمر تدعو تيموثاوس إلى إعمال الفكر فيما يقوله بولس. و«تأمَّلْ» طبيعية في العربية وتحفظ الفرق بين فعل التفكير ووعد الرب اللاحق بمنح الفهم.
- source_word: ὃ λέγω
  choice: ما أقوله
  rationale: ترجمة عربية موجزة وطبيعية للموصول المحايد مع الفعل المضارع، وتشير إلى مضمون كلام بولس الحاضر.
- source_word: γάρ
  choice: لأن
  rationale: تُظهر أن وعد الرب هو أساس الدعوة إلى التأمل، بربط سببي واضح في العربية المعاصرة.
- source_word: δώσει σοι
  choice: سيعطيك
  rationale: تنقل المستقبل والوعد، مع التعبير الطبيعي عن المفعول غير المباشر في العربية.
- source_word: ὁ κύριος
  choice: الرب
  rationale: تحفظ تسمية النص من غير أن تحدد صراحة هل المقصود الرب يسوع أم الله بوجه أعم.
- source_word: σύνεσιν
  choice: فهمًا
  rationale: لفظ واضح وشامل يدل على إدراك المعنى، ويلائم نتيجة التأمل المطلوبة في السياق.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: تحفظ الشمول الواسع للعبارة اليونانية من غير قصرها على الأمور العقائدية أو على أقوال بولس وحدها.
theological_decisions:
- issue: مرجع لقب «الرب» (ὁ κύριος)
  choice: الرب
  alternative: الرب يسوع؛ أو الله
  rationale: اليونانية لا تعيّن المرجع بأكثر من لقب «الرب». لذلك تُحفظ الصياغة من غير حسم هوية المرجع بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «تأمَّلْ» لإبراز المشاركة الذهنية التي يأمر بها النص، مع إبقاء «فهمًا» لوعد الرب، وحُفظت سعة «في كل شيء» وغموض مرجع «الرب».
