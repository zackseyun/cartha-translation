translation:
  language: ar
  text: أَمَّا الْجِدَالَاتُ الْحَمْقَاءُ غَيْرُ الْمُسْتَنِيرَةِ[a]، فَارْفُضْهَا، عَالِمًا أَنَّهَا تُوَلِّدُ[b] الْخُصُومَاتِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُترجم العبارة أيضًا: «المسائل الحمقاء وغير المتعلّمة» أو «المباحث الحمقاء غير القائمة على علم». فاللفظ اليوناني قد يدل على الأسئلة أو المباحث، لكنه يشير هنا، على الأرجح، إلى جدالات خلافية لا إلى استفسارات صادقة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «تلد» أو «تنجب»؛ وقد استُعمل الفعل مجازًا بمعنى أنها تتسبّب في نشوء الخصومات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: الحمقاء
  rationale: تنقل معنى انعدام الحكمة أو سلامة الرأي بلفظ عربي واضح ورصين، من غير مبالغة عامية أو إهانة زائدة.
- source_word: ἀπαιδεύτους
  choice: التي تنمّ عن جهل
  rationale: يدل اللفظ على الافتقار إلى التعليم أو التدريب. ولأن وصف «المجادلات» بأنها «غير متعلّمة» غير طبيعي في العربية، صيغ المعنى تعبيرًا عمّا تكشف عنه تلك المجادلات، مع إبقاء معنى الجهل لا الغباء.
- source_word: ζητήσεις
  choice: المجادلات
  rationale: يمكن أن يعني اللفظ مسائل أو مباحث، لكنه في هذا السياق يشير إلى نقاشات خلافية لا إلى استقصاء صادق؛ و«المجادلات» تؤدي هذا المعنى طبيعيًا.
- source_word: παραιτοῦ
  choice: فارفضها
  rationale: يحمل فعل الأمر معنى الامتناع عن قبولها أو الدخول فيها. «ارفضها» موجز ويحفظ قوة الأمر.
- source_word: εἰδὼς
  choice: عالمًا
  rationale: يحافظ على البنية الحالية في اليونانية، ويبيّن أن معرفة نتيجتها أساس الأمر برفضها.
- source_word: γεννῶσι
  choice: تُولِّد
  rationale: يحفظ الصورة المجازية الأصلية، وهي طبيعية في العربية للدلالة على التسبّب والنشوء.
- source_word: μάχας
  choice: الخصومات
  rationale: السياق يتحدث عن نزاع جدلي وعلاقاتي، ولذلك «الخصومات» أنسب من لفظ قد يوحي بعراك جسدي.
- source_word: δὲ
  choice: أمّا
  rationale: تُبرز المقابلة مع الوصية السابقة بأسلوب عربي طبيعي، وتلائم بناء الجملة الذي يعقبه الأمر.
