translation_notes:
  register: صياغة عربية فصحى معاصرة ورصينة. استُخدمت «أما ... فارفضها» لإظهار المقابلة والمحافظة على قوة الأمر، وحُفظت صورة الولادة المجازية في «تُولِّد». أُعيدت صياغة ἀπαιδεύτους وصفيًا لتجنّب التركيب العربي غير الطبيعي «مجادلات غير متعلّمة».
