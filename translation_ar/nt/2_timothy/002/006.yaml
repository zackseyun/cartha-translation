  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: ar
  text: يجب أن يكون الفلّاح الكادح أولَ من ينال نصيبًا من المحصول.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى اللفظ اليوناني: «يجب على الفلّاح الذي يكدّ أن يأخذ أولًا من المحصول».'
    reason: بديل لفظي يحافظ على الصياغة الأقرب إلى ترتيب اليونانية وعلى قدر من الاحتمال في دلالة «أولًا».
lexical_decisions:
- source_word: κοπιῶντα
  choice: الكادح
  rationale: اسم الفاعل يدل على بذل جهد شاق ومتواصل؛ و«الكادح» تعبير عربي واضح وموجز يحفظ التشديد على المشقة.
- source_word: γεωργὸν
  choice: الفلّاح
  rationale: يدل اللفظ على من يزرع الأرض ويعمل فيها، و«الفلّاح» هو المقابل العربي المعاصر الطبيعي.
- source_word: δεῖ
  choice: يجب
  rationale: يحفظ معنى الضرورة أو الإلزام الذي تؤديه الكلمة اليونانية.
- source_word: πρῶτον
  choice: أولَ من
  rationale: يصوغ معنى الأولوية صياغة عربية طبيعية، ويربطها بنيل نصيب من المحصول بحسب التركيب الأرجح.
- source_word: τῶν καρπῶν
  choice: من المحصول
  rationale: المضاف إليه الجمعي يشير في هذا السياق الزراعي إلى غلة الأرض؛ و«المحصول» أوسع وأطبع من حصر المعنى في الثمار.
- source_word: μεταλαμβάνειν
  choice: ينال نصيبًا
  rationale: الفعل يعني المشاركة أو الأخذ من شيء، ومع صيغة المضاف إليه يفيد نيل حصة منه؛ وهذه العبارة واضحة وتحفظ معنى المشاركة.
theological_decisions:
- issue: وجه الأولوية في القول التمثيلي
  choice: الفلّاح الكادح هو أول من ينال نصيبًا من نتاج عمله.
  alternative: يجب على الفلّاح الذي يكدّ أن يأخذ أولًا من المحصول، دون التصريح بأنه يسبق غيره.
  rationale: موضع πρῶτον وتركيب الجملة يرجحان أولوية الفلّاح في الانتفاع بالمحصول، لكن عبارة «يأخذ أولًا» تحافظ بصورة أكثر حرفية على قدر من الاحتمال في جهة هذه الأولوية؛ لذلك ذُكرت في الحاشية بدل إلغاء هذا الفارق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «الفلّاح الكادح» للمحافظة على صورة العامل المجتهد، و«ينال نصيبًا» لإظهار معنى المشاركة الذي يحمله الفعل اليوناني من غير تعبير اصطلاحي أو مذهبي.
