  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: ar
  text: وما سمعته مني بحضور شهود كثيرين[a]، فائتمن عليه أناسًا أمناء[b]، يكونون قادرين أيضًا على تعليم آخرين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمام شهود كثيرين». وقد تحتمل العبارة اليونانية أيضًا: «بواسطة شهود كثيرين»، إلا أن معنى الحضور العلني أرجح في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'العبارة اليونانية بصيغة المذكر الجمع، ويمكن ترجمتها: «رجال أمناء»؛ وقد تُستعمل أيضًا استعمالًا تمثيليًا بمعنى «أناس أمناء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ما
  rationale: اسم موصول يفيد مضمون الأمور التي سمعها تيموثاوس، وصيغة «ما» عربية طبيعية موجزة وتحفظ معنى المفعول به.
- source_word: ἤκουσας
  choice: سمعته
  rationale: الماضي البسيط يلائم صيغة الماضي اليونانية ويشير إلى ما سبق أن تلقّاه تيموثاوس من بولس.
- source_word: παρ’ ἐμοῦ
  choice: مني
  rationale: مع فعل السماع تدل παρά مع المضاف إليه على المصدر، أي إن التعليم صدر من بولس.
- source_word: διὰ πολλῶν μαρτύρων
  choice: بحضور شهود كثيرين
  rationale: تحفظ العبارة المعنى الأرجح، وهو أن التعليم جرى علنًا وشهده كثيرون، مع إثبات احتمال الدلالة على الوساطة في الحاشية.
- source_word: ταῦτα
  choice: به
  rationale: الضمير يعود إلى مضمون «ما سمعته» ويحافظ على الإحالة إلى التعليم المذكور من غير تكرار ثقيل في العربية.
- source_word: παράθου
  choice: عَهِّدْ به إلى
  rationale: ينقل معنى وضع التعليم في عهدة أشخاص موثوقين ليحفظوه وينقلوه، بصياغة عربية واضحة ومعاصرة.
- source_word: πιστοῖς
  choice: أمناء
  rationale: يفيد هنا الثقة والإخلاص في حفظ التعليم ونقله، مع بقاء الصدى الإيماني الممكن للكلمة.
- source_word: ἀνθρώποις
  choice: أناس
  rationale: ἄνθρωπος يدل في الأصل على البشر أو الأشخاص، و«أناس» يحفظ هذه السعة الدلالية، بينما تُذكر صيغة المذكر واحتمال «رجال» في الحاشية.
- source_word: οἵτινες
  choice: سيكونون
  rationale: دُمج معنى الموصول الوصفي في جملة عربية متصلة؛ والمقصود أناس من صفتهم الأهلية للمهمة.
- source_word: ἱκανοὶ
  choice: أكفاء
  rationale: تدل على الكفاية والأهلية للقيام بمهمة التعليم، لا مجرد الإمكان النظري.
- source_word: ἔσονται
  choice: سيكونون
  rationale: تحفظ دلالة المستقبل الصريحة في النص اليوناني.
- source_word: ἑτέρους
  choice: آخرين
  rationale: مقابل عربي مباشر وطبيعي للمفعول به الجمع، ويشير إلى أشخاص غيرهم.
- source_word: διδάξαι
  choice: لتعليم
  rationale: المصدر يبيّن المجال الذي سيكونون أكفاء فيه، وصيغة الغاية العربية واضحة وطبيعية.
theological_decisions:
- issue: الدلالة الجنسية لعبارة πιστοῖς ἀνθρώποις
  choice: أناس أمناء
  alternative: رجال أمناء
  rationale: الاسم ἄνθρωποι قد يُستعمل للبشر عمومًا، مع أن العبارة في صيغة المذكر الجمع. اختيرت «أناس» لعدم حصر الدلالة فيما لا يحسمه اللفظ نفسه، وأُثبت احتمال «رجال» في الحاشية حفاظًا على التوتر الدلالي.
- issue: دلالة διὰ πολλῶν μαρτύρων
  choice: بحضور شهود كثيرين
  alternative: بواسطة شهود كثيرين
  rationale: السياق يرجّح أن التعليم قُدِّم علنًا بحضور شهود، لكن διά مع المضاف إليه قد تدل أيضًا على الوساطة؛ لذلك لم يُحذف البديل بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «عَهِّدْ به إلى» لإبراز معنى الأمانة والمسؤولية في نقل التعليم، مع تجنب تركيب حرفي ثقيل. وُضعت علامتا الحاشية [a] و[b] في المتن عند موضعيهما.
