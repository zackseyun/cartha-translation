  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: ar
  text: إن كنا نصبر، فسنملك أيضًا معه؛ وإن أنكرناه[a]، فهو أيضًا سينكرنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تبرأنا منه، فسيتبرأ هو أيضًا منا».'
    reason: بديل معجمي يبرز معنى النبذ أو قطع الانتساب الممكن في ἀρνέομαι، مع الحفاظ على تكرار الفعل في شطري العبارة.
lexical_decisions:
- source_word: ὑπομένομεν
  choice: نصبر
  rationale: يفيد الفعل الثبات والاحتمال في وجه المحنة أو الألم. ولفظ «نصبر» واضح وموجز، ويحفظ معنى الاستمرار تحت الضيق من غير إدخال مصطلح لاهوتي زائد.
- source_word: συμβασιλεύσομεν
  choice: سنملك أيضًا معه
  rationale: الفعل المركب يعني أن نملك مع شخص آخر. أُظهر الضمير «معه» لأن السياق يشير إلى المسيح، وأُبقيت صورة المُلك الملكية بدل تعميمها إلى مجرد الحكم.
- source_word: ἀρνησόμεθα
  choice: أنكرناه
  rationale: يمكن أن يعني الفعل الإنكار أو التبرؤ. أُضيف ضمير المفعول العائد إلى المسيح، وهو مفهوم من السياق ومن الجملة الموازية، وصيغ الشرط العربي طبيعي مع بقاء دلالة التحذير.
- source_word: κἀκεῖνος
  choice: فهو أيضًا
  rationale: 'اللفظة اختصار لـ καὶ ἐκεῖνος وتحمل معنى المقابلة: «هو أيضًا» أو «هو بدوره». ويحفظ الاختيار التوازي والجزاء المقابل.'
- source_word: ἀρνήσεται ἡμᾶς
  choice: سينكرنا
  rationale: تكرار «أنكر» يحافظ على التكرار المقصود للفعل اليوناني نفسه وعلى القوة البلاغية للتحذير.
theological_decisions:
- issue: طبيعة التحذير في جملة الشرط الثانية
  choice: 'نقل العبارة بوصفها تحذيرًا حقيقيًا ومباشرًا: «وإن أنكرناه، فهو أيضًا سينكرنا».'
  alternative: تفسير إنكاره لنا بأنه خسارة للمكافأة فقط، أو اعتبار الشرط افتراضيًا بلا دلالة واقعية.
  rationale: يعرض النص شرطين متوازيين ضمن القول، وتنسجم عبارته مع تقليد تحذيرات يسوع بشأن إنكاره وإنكار من ينكره. لذلك ينبغي إبقاء شدة التحذير والتوتر اللاهوتي من غير حسم الجدل حول الارتداد أو المثابرة أو المكافأة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «نصبر» للثبات تحت الضيق، و«سنملك معه» للإبقاء على الصورة الملكية، وحُفظ التوازي الحاد بين إنكار المسيح وإنكاره لنا.
