base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: ar
  text: الذي لأجله أُعاني المشقّات، إلى حدّ القيود، كمجرم[a]. لكن كلمة الله لا تُقيَّد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كفاعل شر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: الذي لأجله
  rationale: يعود الضمير على الإنجيل المذكور في الآية السابقة، ويحتمل التعبير اليوناني معنى المجال أو السبب. «الذي لأجله» عربية طبيعية تُبرز هنا معنى المعاناة بسبب الإنجيل من غير أن تغيّر مرجع العبارة.
- source_word: κακοπαθῶ
  choice: أُعاني المشقّات
  rationale: يفيد الفعل التعرّض المستمر للشدائد والمعاناة؛ وصيغة المضارع العربية تحفظ هذا المعنى الجاري.
- source_word: μέχρι δεσμῶν
  choice: حتى القيود
  rationale: تحفظ «القيود» الصورة الحسية في الأصل، بينما تعبّر «حتى» بوضوح عن بلوغ المعاناة هذا الحد.
- source_word: ὡς κακοῦργος
  choice: كأنّي مجرم
  rationale: يفيد اللفظ شخصًا يرتكب الشر أو الجريمة. وفي سياق القيود والسجن، تنقل «مجرم» الدلالة القضائية بوضوح، وتُظهر «كأنّي» أن هذه هي المعاملة أو النظرة الواقعة على بولس لا إقرارًا بأنه مجرم فعلًا.
- source_word: ἀλλὰ
  choice: لكن
  rationale: تنقل المقابلة القوية بين تقييد بولس وعدم إمكان تقييد كلمة الله.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: صياغة عربية مألوفة تحفظ اتساع λόγος، فلا تحصره صراحة في الكتاب المقدس وحده ولا تستبدله بتفسير أضيق مثل «رسالة الإنجيل».
- source_word: οὐ δέδεται
  choice: لا تُقيَّد
  rationale: تحفظ استعارة الربط والتقييد، وتقابل «القيود» الواردة قبلها. والمضارع العربي يعبّر طبيعيًا عن حالة عدم الخضوع للقيد التي تفيدها صيغة التام المبني للمجهول في اليونانية.
theological_decisions:
- issue: مدلول «كلمة الله»
  choice: الإبقاء على «كلمة الله» من غير تحديدها بالإنجيل أو بالكتاب المقدس وحده
  alternative: رسالة الإنجيل؛ الكتاب المقدس
  rationale: يشير السياق القريب خصوصًا إلى الإنجيل المُعلَن، لكن العبارة اليونانية أوسع؛ لذلك يحفظ النص هذا الاتساع ولا يحسم المرجع بما يتجاوز الأصل.
- issue: وصف بولس بأنه κακοῦργος
  choice: «كأنّي مجرم» بوصفها معاملة أو تصنيفًا مفروضًا عليه
  alternative: «كمجرم» أو «كفاعل شر»
  rationale: السياق لا يقرّ بأن بولس ارتكب جرمًا، بل يبيّن أنه يعاني القيود بالطريقة التي يعامل بها المجرم؛ لذا تمنع «كأنّي» التباس الإقرار بالذنب مع إبقاء قوة التشبيه.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «المشقّات» للدلالة على الشدائد، وحُفظ التوازي التصويري بين «القيود» و«لا تُقيَّد». لم تُضف حاشية إلى «الذي لأجله» لأن الصياغة العربية المختارة تنقل المرجع والسبب طبيعيًا، مع تسجيل الاحتمال الدلالي في القرار المعجمي.
