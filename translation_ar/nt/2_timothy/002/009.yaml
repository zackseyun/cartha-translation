  - severity: low
    issue: «حتى القيود» أقل تحديدًا لمدى μέχρι δεσμῶν.
    rationale: «إلى حدّ القيود» يعبّر بوضوح عن بلوغ المعاناة حدّ القيود، مع الإبقاء على الصورة المادية في الأصل.
