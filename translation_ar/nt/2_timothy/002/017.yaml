lexical_decisions:
- source_word: λόγος
  choice: كلام
  rationale: في سياق التعليم الباطل والكلام الدنيوي الفارغ، يدل اللفظ على ما يقولونه وخطابهم، و«كلام» تعبير عربي طبيعي يحفظ سعة المعنى.
- source_word: αὐτῶν
  choice: هم
  rationale: ضمير ملكية يعود إلى أصحاب الكلام المذكورين، وأُدمج طبيعيًا في «كلامهم».
- source_word: ὡς γάγγραινα
  choice: كالغَرْغَرينا
  rationale: مقابل طبي مباشر للصورة الأصلية التي تصف مرضًا يتفشى ويفسد الأنسجة، من غير استبدالها بصورة السرطان التفسيرية.
- source_word: νομὴν ἕξει
  choice: سينتشر
  rationale: التركيب الاصطلاحي يفيد الامتداد أو التفشي، ولا سيما مع صورة الغرغرينا؛ و«سينتشر» ينقل المعنى بوضوح من غير حرفية غامضة.
- source_word: ὧν ἐστιν
  choice: ومنهم
  rationale: يحفظ المعنى التبعيضي، إذ يذكر شخصين من الجماعة المشار إليها.
- source_word: Ὑμέναιος
  choice: هيمينايوس
  rationale: نقل صوتي للاسم اليوناني إلى العربية.
- source_word: Φίλητος
  choice: فيلِيتُس
  rationale: نقل صوتي للاسم اليوناني إلى العربية مع ضبط جزئي يوضح النطق.
theological_decisions:
- issue: دلالة صورة المرض
  choice: تصوير الكلام الفاسد كمرض ينتشر انتشارًا هدّامًا
  alternative: ترجمة حرفية للتركيب بمعنى «سيكون له مرعى/مجال»
  rationale: الفعل الدلالي في السياق هو التفشي، لكن النص يبقي الصورة الطبية نفسها ولا يشرح آثارها العقائدية بما يتجاوز العبارة.
