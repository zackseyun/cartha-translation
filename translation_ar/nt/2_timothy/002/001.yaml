translation:
  language: ar
  text: فأنت إذًا، يا ولدي، تَقَوَّ[a] بالنعمة التي في المسيح يسوع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تشدَّد». وقد يُفهم الفعل بمعنى تلقّي القوة، لا مجرد الأمر بأن يكون المرء قويًّا.'
