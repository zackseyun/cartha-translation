    reason: source_ambiguity
lexical_decisions:
- source_word: Σὺ
  choice: أنت
  rationale: ذُكر الضمير صراحةً في اليونانية لإبراز المخاطَب، فأُثبت في العربية حفاظًا على نبرة التوكيد والمقابلة.
- source_word: οὖν
  choice: فـ... إذًا
  rationale: يجمع هذا التعبير بين الربط بما سبق والدلالة على النتيجة أو الانتقال، بأسلوب عربي واضح وطبيعي.
- source_word: τέκνον μου
  choice: يا ولدي
  rationale: ينقل المودة والعلاقة الروحية التي يدل عليها اللفظ، من غير أن يضيف وصفًا مثل «الحبيب» غير موجود في النص.
- source_word: ἐνδυναμοῦ
  choice: تَقَوَّ
  rationale: صيغة الأمر العربية طبيعية وتفيد اكتساب القوة؛ وأُضيفت حاشية لحفظ احتمال النبرة الاستقبالية في الصيغة اليونانية الوسطى/المبنية للمجهول.
- source_word: ἐν τῇ χάριτι
  choice: بالنعمة
  rationale: الباء عربية طبيعية مع فعل «تقوّى»، وتنقل كون النعمة واسطة القوة أو أساسها، مع التنبيه في الحاشية إلى إمكان معنى المجال في حرف الجر اليوناني.
- source_word: χάριτι
  choice: النعمة
  rationale: «النعمة» هي المقابل العربي الراسخ والدقيق هنا، وتشمل عطاء الله وفضله المُمِدّ بالقوة.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: التي في المسيح يسوع
  rationale: يحافظ التعبير على البنية الوصفية في اليونانية، إذ يعيّن النعمة بأنها كائنة في المسيح يسوع ومرتبطة به.
- source_word: Χριστῷ
  choice: المسيح
  rationale: «المسيح» ينقل معنى اللقب اليوناني Χριστός مباشرةً في العربية، ولا يحتاج إلى مقابلة منفصلة بين «Christ» و«Messiah».
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم في هذا السياق.
theological_decisions:
- issue: دلالة الصيغة في ἐνδυναμοῦ من جهة تلقّي القوة
  choice: تَقَوَّ
  alternative: 'تشدَّد؛ أو: لِتُمنَح قوة'
  rationale: تتجنب الصياغة إسناد القوة إلى اعتماد ذاتي محض، ويبيّن السياق أن مصدرها النعمة؛ لكن العربية الطبيعية لا تسمح هنا بمحاكاة المبني للمجهول حرفيًا من دون ثقل، لذلك حُفظ الاحتمال في الحاشية.
- issue: العلاقة التي يدل عليها ἐν مع النعمة
  choice: بالنعمة
  alternative: في النعمة
  rationale: الباء أنسب في العربية مع «تقوّى»، لكنها قد تبرز الوسيلة أكثر من المجال؛ لذلك ذُكر البديل في الحاشية بدل إلغاء التداخل الدلالي في الأصل.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: لا بديل دلالي لازم في العربية
  rationale: الكلمة العربية «المسيح» نفسها تحفظ معنى اللقب، فلا ينشأ فيها التعارض الإنجليزي بين الصيغة المترجمة والصيغة الموروثة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «يا ولدي» للمودة الطبيعية، و«المسيح يسوع» لحفظ ترتيب اللقب والاسم في الأصل. وُضعت الحركات فقط حيث تساعد على قراءة فعل الأمر «تَقَوَّ» قراءة صحيحة.
