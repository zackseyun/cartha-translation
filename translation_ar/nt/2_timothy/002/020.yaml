source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: ar
  text: وفي بيت كبير، لا توجد آنية من ذهب وفضة فقط، بل من خشب وخزف أيضًا[a]؛ بعضها للكرامة، وبعضها الآخر للهوان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الخزف هو ما صُنع من طين وشُوي بالنار.
    reason: cultural_note
  - marker: b
    text: 'أو: «بعضها لاستعمال كريم، وبعضها الآخر لاستعمال مهين». واليونانية حرفيًا: «للكرامة ... للهوان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: بيت كبير
  rationale: ينقل معنى الحجم أو المكانة من غير أن يحمّل الصفة حكمًا تقويميًا زائدًا، وهو تعبير عربي طبيعي.
- source_word: σκεύη
  choice: آنية
  rationale: لفظ واسع يناسب صورة البيت ويشير إلى الأوعية أو الأدوات المعدّة لغرض، مع إبقاء المجال للاستعارة في السياق التالي.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: من ذهب وفضة
  rationale: يبيّن أن المقصود مادة صنع الآنية، ويجري على الأسلوب العربي الطبيعي.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: من خشب وخزف
  rationale: ὀστράκινα تدل على المصنوع من الطين المحروق؛ و«خزف» دقيقة ومفهومة في العربية المعاصرة.
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: بعضها ... وبعضها الآخر ...
  rationale: ينقل التقابل الذي تعبّر عنه صيغة μέν...δέ بوضوح ومن دون مبالغة في قوة التضاد.
- source_word: εἰς τιμήν
  choice: للكرامة
  rationale: يحافظ على الاسم المجرّد τιμή وعلى دلالته المتعلقة بالتكريم أو المنزلة، بدل حصره في وظيفة عملية.
- source_word: εἰς ἀτιμίαν
  choice: للهوان
  rationale: يحافظ على التضاد اللفظي مع «الكرامة» وينقل معنى ἀτιμία بوصفه انعدام الكرامة أو المهانة.
- source_word: δὲ (initial)
  choice: وَ
  rationale: تؤدي الواو وظيفة الانتقال والربط في العربية بسلاسة، من غير إدخال معنى زمني غير موجود أو تشديد دلالة الاستدراك.
theological_decisions:
- issue: هل تُفسَّر τιμή/ἀτιμία وظيفيًا («لاستعمال كريم/مهين») أم تُنقل بوصفها كرامة وهوانًا؟
  choice: للكرامة ... للهوان
  alternative: لاستعمال كريم ... لاستعمال مهين
  rationale: النص اليوناني يستعمل اسمين مجردين، وقد تحمل الصورة معنى وظيفيًا ومعنى يتعلق بالمكانة أو التقييم. يحفظ النص الرئيس هذا التوتر ولا يحصر الاستعارة في نوع الاستعمال.
translation_notes:
  register: لغة عربية فصحى واضحة وموقّرة. استُخدمت «آنية» للمحافظة على صورة الأوعية المنزلية واتساع الاستعارة، ووُضع البديل التفسيري في الحاشية بدل فرضه على المتن.
