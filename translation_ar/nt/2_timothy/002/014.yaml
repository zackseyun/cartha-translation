base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: ar
  text: داوم على تذكيرهم بهذه الأمور، محذِّرًا إياهم أمام الرب[a] من التنازع حول الكلمات؛ فلا فائدة منه، بل يفضي إلى خراب السامعين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير عبارة «أمام الرب» عمومًا إلى الشهادة الإلهية، من غير أن تعيّن هل المقصود بـ«الرب» هنا الرب يسوع خصوصًا أم الله على نحو أعم.
    reason: قراءة بديلة
lexical_decisions:
- source_word: Ταῦτα
  choice: هذه الأمور
  rationale: اسم إشارة محايد في صيغة الجمع يعود إلى التعاليم السابقة، و«هذه الأمور» تعبير عربي طبيعي يحفظ الإحالة إلى ما سبق.
- source_word: ὑπομίμνῃσκε
  choice: ذَكِّرهم دائمًا
  rationale: فعل أمر مضارع يدل على الاستمرار أو التكرار؛ وأُضيف ضمير المفعول من السياق لأن المخاطَب مأمور بتذكير جماعة محددة.
- source_word: διαμαρτυρόμενος
  choice: وناشدهم
  rationale: يفيد التشديد الجاد والاستحلاف أو الحث المهيب؛ و«ناشدهم» يحفظ قوة العبارة في سياق التكليف الرعوي من غير إطالة.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: أمام الرب
  rationale: يحفظ التعبير الدال على حضور الرب شاهدًا وعلى المسؤولية أمامه، من غير تعيين صريح هل المقصود الله عمومًا أم الرب يسوع خصوصًا.
- source_word: μὴ λογομαχεῖν
  choice: ألا يتنازعوا على الكلمات
  rationale: الفعل يدل على الخصام والمماراة بشأن الألفاظ؛ وهذه الصياغة واضحة وتحفظ دلالته السلبية.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: فهذا لا ينفع بشيء
  rationale: تنقل انعدام الفائدة نقلًا مباشرًا، مع إرجاع اسم الإشارة إلى التنازع على الكلمات.
- source_word: ἐπὶ καταστροφῇ
  choice: بل يؤدي إلى خراب
  rationale: يفيد نتيجة مدمرة أو انقلاب الحال إلى السوء؛ و«خراب» يحفظ شدة اللفظ من غير قصره على الهلاك الأبدي.
- source_word: τῶν ἀκουόντων
  choice: السامعين
  rationale: اسم فاعل جمع يعبر بإيجاز وطبيعية عن الذين يستمعون إلى هذا النزاع.
theological_decisions:
- issue: مرجع κύριος
  choice: الرب
  alternative: الله؛ أو الرب يسوع
  rationale: النص اليوناني يقول «الرب» بلا تعيين إضافي. تحافظ الترجمة على اللقب وعلى الغموض الحقيقي بدل حسم المرجع تفسيريًا.
- issue: مدى دلالة καταστροφή
  choice: خراب
  alternative: هلاك؛ أو تقويض
  rationale: «خراب» يحفظ قوة الضرر البالغ، لكنه لا يقرر أن المقصود بالضرورة هلاك أبدي أو دمار جسدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «دائمًا» لإظهار الاستمرار في فعل الأمر، و«ناشدهم» لنقل جدية التكليف، مع إبقاء «الرب» غير مفسَّرة حفاظًا على الغموض المقصود في الأصل.
