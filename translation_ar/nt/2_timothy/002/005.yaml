  to: وَإِنْ شَارَكَ أَحَدٌ أَيْضًا فِي مُنَافَسَةٍ رِيَاضِيَّةٍ، فَلَا يُكَلَّلُ مَا لَمْ يُشَارِكْ وَفْقَ الْقَوَاعِدِ.[a]
  rationale: حُذف فعل الكون غير الموجود في الأصل، واستُبدلت «سباق» بـ«منافسة رياضية» لتفادي تخصيص غير لازم مع إبقاء الصورة الرياضية. كما استُخدمت «ما لم» بوصفها مقابلاً عربيًا طبيعيًا لـ«إلا إذا/ما لم»، مع الحفاظ على تكرار فعل المشاركة وعلى موضع الحاشية المتصل بعبارة «وفق القواعد».
