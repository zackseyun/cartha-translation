    issue: إدخال «كان» في الشرط
    rationale: 'النص اليوناني يقول مباشرة: «إن/إذا نافس أحد»، لا «إن كان أحد يشارك». حذف «كان» أدق وأفصح.'
  - severity: low
    issue: تقييد المنافسة بـ«سباق»
    rationale: ἀθλέω يستحضر منافسة أو ألعابًا رياضية، لا سباق الجري خاصة؛ لذا «منافسة رياضية» أوسع وأدق.
