  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: ar
  text: وَإِنْ شَارَكَ أَحَدٌ أَيْضًا فِي مُنَافَسَةٍ رِيَاضِيَّةٍ، فَلَا يُكَلَّلُ مَا لَمْ يُشَارِكْ وَفْقَ الْقَوَاعِدِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على نحوٍ قانوني». يمكن أن تعني الكلمة اليونانية «بطريقة قانونية»، ويُرجَّح هنا أنها تشير إلى الالتزام بقواعد المنافسة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: يُشَارِكُ فِي سِبَاقٍ / يُشَارِكْ
  rationale: يحفظ هذا التعبير صورة المنافسة الرياضية التي يحملها الفعل اليوناني، مع تكرار الجذر التعبيري في جملتي الشرط، وبصياغة عربية واضحة.
- source_word: τις
  choice: أَحَدٌ
  rationale: ضمير نكرة ذو دلالة عامة، و«أحد» ينقل هذا العموم طبيعيًا من غير تقييده بجنس معين.
- source_word: στεφανοῦται
  choice: يُكَلَّلُ
  rationale: يحفظ المبني للمجهول وصورة إكليل المنتصر في المسابقات، من غير تعيين معنى روحي خاص للإكليل.
- source_word: νομίμως
  choice: وَفْقَ الْقَوَاعِدِ
  rationale: ينقل معنى التصرف على نحو قانوني أو نظامي في سياق المسابقة، وهو أوضح للقارئ المعاصر من «قانونيًا» وحدها.
- source_word: καὶ
  choice: أَيْضًا
  rationale: يحفظ القوة الإضافية التي تصل هذا المثال بالأمثلة المحيطة.
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال خفيف إلى مثال آخر، وتؤدي الواو هذا الربط بسلاسة في العربية.
theological_decisions:
- issue: طبيعة صورة الإكليل
  choice: الإبقاء على صورة المتسابق الذي يُكلَّل من غير تحديد ماهية المكافأة
  alternative: تفسير الإكليل صراحةً بأنه مكافأة أخروية أو قبول في الخدمة
  rationale: النص يقدم تشبيهًا رياضيًا يشدد على الالتزام بشروط المنافسة، ولا يحدد في هذه الآية المقصود اللاهوتي الدقيق بالإكليل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت «المشاركة في سباق» لإظهار الصورة الرياضية، و«يُكلَّل» لصون استعارة إكليل المنتصر. وُضع مؤشر الحاشية بعد العبارة التي تشرحها.
