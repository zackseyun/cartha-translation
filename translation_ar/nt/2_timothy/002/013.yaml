  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: ar
  text: إِنْ كُنَّا غَيْرَ أُمَنَاءَ[a]، فَهُوَ يَبْقَى أَمِينًا[b]، لِأَنَّهُ لَا يَقْدِرُ أَنْ يُنْكِرَ نَفْسَهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إن كنا لا نؤمن»، أو «إن كنا غير أوفياء». يمكن للفعل اليوناني أن يحمل أيًّا من هذين المعنيين.
    reason: lexical_alternative
  - marker: b
    text: أو «جديرًا بالثقة». أُبقيت «أمينًا» للمحافظة على المقابلة مع «غير أمناء».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: كُنَّا غَيْرَ أُمَنَاءَ
  rationale: يمكن أن يدل الفعل على عدم الإيمان أو عدم الأمانة. ويحافظ هذا التعبير على مقابلته مع «أمينًا»، من غير حصر المعنى في قراءة واحدة.
- source_word: πιστὸς
  choice: أَمِينًا
  rationale: يحفظ الصلة اللفظية والدلالية مع «غير أمناء»، ويفيد الثبات في الأمانة، مع بقاء معنى الجدارة بالثقة ممكنًا.
- source_word: μένει
  choice: يَبْقَى
  rationale: تعبير عربي معاصر وطبيعي ينقل معنى الاستمرار والثبات.
- source_word: ἀρνήσασθαι
  choice: يُنْكِرَ
  rationale: ينقل المعنى المباشر للفعل، بما فيه من قوة علائقية وأخلاقية، من دون توسيعه إلى تفسير خاص.
- source_word: ἑαυτὸν
  choice: نَفْسَهُ
  rationale: المقابل العربي المباشر للضمير الانعكاسي العائد إلى «هو».
- source_word: οὐ δύναται
  choice: لَا يَقْدِرُ
  rationale: ينقل عدم القدرة بوضوح، لا مجرد عدم الرغبة.
theological_decisions:
- issue: دلالة أمانة الله إزاء عدم أمانة البشر
  choice: يقرر النص أن المسيح يبقى أمينًا لأنه لا يقدر أن ينكر نفسه، من دون تحديد ما إذا كانت أمانته هنا تشير أساسًا إلى الخلاص أو الوفاء بالوعود أو تنفيذ التحذير بالدينونة.
  alternative: قد تُفهم أمانته على أنها إنقاذ شعبه رغم ضعفهم، أو وفاؤه بكلمته بما يشمل تحذير المرتدين بالدينونة.
  rationale: اليونانية تؤكد ثباته الذاتي ولا تحسم الأثر الرعوي واللاهوتي موضع النقاش؛ لذلك تُصان دلالة النص المفتوحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «غير أمناء/أمينًا» لصون المقابلة المقصودة في اليونانية، مع بيان الاتساع الدلالي في الحواشي.
