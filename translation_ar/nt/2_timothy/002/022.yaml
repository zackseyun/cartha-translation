source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: ar
  text: أَمَّا رَغَبَاتُ الشَّبَابِ[a] فَاهْرُبْ مِنْهَا، وَاسْعَ إِلَى الْبِرِّ[b] وَالْإِيمَانِ[c] وَالْمَحَبَّةِ وَالسَّلَامِ، مَعَ الَّذِينَ يَدْعُونَ الرَّبَّ مِنْ قَلْبٍ نَقِيٍّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شهوات الشباب». يشمل التعبير اليوناني الرغبات والنزعات التي تميّز سنّ الشباب عمومًا، ولا يقتصر على الشهوة الجنسية.
    reason: lexical_alternative
  - marker: b
    text: أو «العدل». يمكن للكلمة اليونانية أن تحمل دلالات أخلاقية وعلاقية وقضائية.
    reason: alternative_reading
  - marker: c
    text: أو «الأمانة». يمكن للكلمة اليونانية أن تعني الإيمان أو الثقة أو الأمانة بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: شهوات الشباب
  rationale: ينقل التعبير الرغبات والنزعات التي تميّز سن الشباب من غير حصرها في الشهوة الجنسية؛ وتوضح الحاشية هذا الاتساع الدلالي.
- source_word: φεῦγε
  choice: اهرب منها
  rationale: يحفظ قوة فعل الأمر وصورته الحركية، ويقابله بوضوح فعل السعي اللاحق.
- source_word: δίωκε
  choice: اسعَ إلى
  rationale: يفيد الطلب النشط والمستمر للفضائل، وهو تعبير عربي طبيعي يحافظ على المقابلة مع الهرب.
- source_word: δικαιοσύνην
  choice: البر
  rationale: المقابل العربي الكتابي المألوف في قوائم الفضائل البولسية، مع إبقاء معنى العدل الممكن في حاشية.
- source_word: πίστιν
  choice: الإيمان
  rationale: يحفظ المعنى الأساسي الشائع للكلمة، مع التنبيه إلى احتمال معنى الأمانة في هذا السياق الأخلاقي.
- source_word: ἀγάπην
  choice: المحبة
  rationale: مقابل مباشر وطبيعي يحفظ الصلة الاصطلاحية بسائر استعمالات ἀγάπη.
- source_word: εἰρήνην
  choice: السلام
  rationale: مقابل مباشر ملائم لقائمة الفضائل.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: مع الذين يدعون الرب
  rationale: ينقل معنى المصاحبة في μετά، ويصوغ ἐπικαλέω بعبارة عربية مألوفة دون زيادة تفسيرية.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: من قلب نقي
  rationale: يحافظ على دلالة المصدر في ἐκ وعلى الصورة الداخلية للقلب بوصفه منبع الدعاء الصادق.
theological_decisions:
- issue: نطاق «شهوات الشباب»
  choice: رغبات ونزعات مرتبطة بسن الشباب على نحو واسع
  alternative: الشهوات الجنسية بصفة أساسية
  rationale: العبارة اليونانية أوسع من الدلالة الجنسية وحدها، وسياق السلوك والفضائل لا يقتضي تضييقها.
- issue: دلالة δικαιοσύνη
  choice: البر في المتن
  alternative: العدل
  rationale: «البر» يلائم قائمة الفضائل ويحفظ الاستعمال البولسي المألوف، بينما تظل دلالة العدل الأخلاقية والعلاقية ممكنة وتُذكر في الحاشية.
- issue: دلالة πίστις في قائمة الفضائل
  choice: الإيمان في المتن
  alternative: الأمانة
  rationale: يمكن أن تدل الكلمة على الإيمان أو الثقة أو الأمانة؛ اختير المقابل الأعم المألوف مع حفظ الاحتمال الأخلاقي في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. حوفظ على التوازي القوي بين «اهرب» و«اسعَ»، وعلى عمومية «شهوات الشباب» مع إزالة احتمال حصرها جنسيًا في الحاشية. وُضعت علامات الحواشي مباشرة بعد الألفاظ المعنية وبترتيب أبجدي.
