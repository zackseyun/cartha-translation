  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: ar
  text: لا يتورّط مَن يخدم جنديًّا في مشاغل الحياة العادية[a]، لكي يُرضي مَن جنّده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في المشاغل المدنية». تقابل العبارة اليونانية بين الخدمة العسكرية ومشاغل الحياة العادية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: لا... أحد
  rationale: ينقل النفي الشامل بصياغة عربية فصيحة وطبيعية من غير تقييد غير لازم بالجنس.
- source_word: στρατευόμενος
  choice: وهو يخدم جنديًّا
  rationale: يحفظ معنى المشاركة المستمرة في الخدمة العسكرية وصورة الجندي بعبارة عربية واضحة.
- source_word: ἐμπλέκεται
  choice: يتورط
  rationale: يحافظ على صورة التشابك والانشغال المقيِّد الذي يعوق حرية الجندي في أداء مهمته، وهو أقوى من مجرد «ينشغل».
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: في شؤون الحياة العادية
  rationale: تعكس πραγματείαις بوصفها الشؤون أو المشاغل، وβίος بوصفه الحياة اليومية والمعيشية، مع إبراز التضاد مع الخدمة العسكرية من غير تضييق المعنى على الأعمال التجارية.
- source_word: ἵνα
  choice: لكي
  rationale: أداة غاية طبيعية في العربية تنقل بوضوح العلاقة الغرضية.
- source_word: τῷ στρατολογήσαντι
  choice: مَن جنّده
  rationale: ينقل اسم الفاعل الدال على الشخص الذي قام بتجنيده من غير افتراض رتبة عسكرية لا يذكرها النص.
- source_word: ἀρέσῃ
  choice: يُرضي
  rationale: ينقل فعل الغاية بصيغة عربية مباشرة، مع بقاء التركيز على إرضاء صاحب التجنيد.
theological_decisions:
- issue: مدى الاستعارة العسكرية
  choice: الإبقاء على صورة الجندي الذي لا يتورط في شؤون الحياة العادية لكي يرضي من جنّده.
  alternative: تفسير العبارة مباشرة على أنها وصية بشأن أولويات الخدمة، أو ترجمة الشؤون بأنها «أعمال مدنية».
  rationale: النص يقدم صورة عسكرية لتأدية غرضه الإرشادي؛ لذا تحافظ الترجمة على الصورة ولا تستبق تفسير تطبيقها، كما تبقي مجال العبارة أوسع من نشاط مدني محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يتورط» للمحافظة على حيوية استعارة التشابك، و«شؤون الحياة العادية» لتجنب حصر العبارة في التجارة أو كسب الرزق وحدهما.
