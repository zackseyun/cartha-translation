  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: ar
  text: فيستعيدوا صوابهم ويفلتوا من فخ إبليس، إذ قد أسرهم أحياءً[b] ليفعلوا مشيئته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقد أُخذوا أسرى بواسطته ليفعلوا مشيئة ذاك». ويرى بعض المفسرين أن «ذاك» يعود إلى الله لا إلى إبليس.'
    reason: alternative_reading
  - marker: b
    text: 'الفعل اليوناني المترجم «أسرهم أحياءً» يمكن أن يترجم على نحو أعم: «أخذهم أسرى»، لكنه يدل بصورة أخص على القبض عليهم أحياءً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: فيستعيدوا صوابهم
  rationale: يفيد الفعل الرجوع إلى الصحو أو استعادة صفاء التفكير؛ وهذه العبارة تنقل الاستعارة طبيعيًا في سياق الإفاقة من الخداع.
- source_word: παγίδος
  choice: فخ
  rationale: ينقل صورة الأداة التي يُوقع بها ويأسر، وهو تعبير عربي واضح وطبيعي.
- source_word: διαβόλου
  choice: إبليس
  rationale: يُستعمل هنا لقبًا شخصيًا للشرير، و«إبليس» المقابل العربي المألوف الواضح.
- source_word: ἐζωγρημένοι
  choice: قد أمسك بهم أحياءً
  rationale: يحفظ الدلالة الخاصة للفعل، أي القبض على الأشخاص أحياءً، مع الإشارة إلى الحالة الناتجة من فعل سابق التي تفيدها صيغة اسم المفعول التام.
- source_word: ὑπ’ αὐτοῦ
  choice: بهم
  rationale: أُبقي الضمير عائدًا، بحسب أقرب مرجع نحوي، إلى إبليس، من غير تكرار الاسم.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: ليخضعوا لمشيئته
  rationale: يعبّر طبيعيًا عن توجيه الأسر نحو مشيئة الآسر، من غير إخفاء النزاع في مرجع الضمير، وهو مبين في الحاشية.
theological_decisions:
- issue: مرجع ἐκείνου في εἰς τὸ ἐκείνου θέλημα
  choice: 'الضمير يعود إلى إبليس: «لمشيئته»'
  alternative: يمكن أن يعود الضمير إلى الله، فيكون المعنى أنهم يفلتون ليخضعوا لمشيئة الله.
  rationale: إبليس هو المرجع الأقرب نحويًا، وسياق الفخ والأسر يرجّح أن تكون المشيئة مشيئة الآسر. لكن تركيب اليونانية يحتمل فهمًا آخر معروفًا، ولذلك حُفظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «يستعيدوا صوابهم» لنقل استعارة الإفاقة، و«فخ» لصورة الوقوع في الأسر. وُضعت علامتا الحاشيتين بعد الجملة التي تتناول الأسر والمشيئة، مع إبقاء غموض مرجع الضمير موضحًا في الحاشية.
