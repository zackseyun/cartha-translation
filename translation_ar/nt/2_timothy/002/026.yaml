  to: فيستعيدوا صوابهم ويفلتوا من فخ إبليس، إذ قد أسرهم أحياءً[b] ليفعلوا مشيئته.[a]
  rationale: يحافظ التعديل على القراءة التي تجعل الضمير عائدًا إلى إبليس، مع إبقاء القراءة الأخرى في الحاشية. ويزيل معنى «الخضوع» المضاف، ويجعل إسناد فعل الأسر إلى إبليس أوضح، وينقل موضعي الحاشيتين إلى اللفظين المعنيين مباشرة.
