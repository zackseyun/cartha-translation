    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: بوداعةٍ
  rationale: تفيد العبارة الجارّة أسلوب التأديب؛ و«بوداعة» عربية فصيحة واضحة تدل على الرفق وضبط النفس من غير إيحاء بالضعف.
- source_word: παιδεύοντα
  choice: مُؤَدِّبًا
  rationale: الفعل هنا يجمع التعليم والتقويم؛ و«مؤدِّبًا» يحفظ معنى التهذيب التصحيحي، لا العقوبة المجردة.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: الذين يقاومون
  rationale: اسم الفاعل يدل على من يتخذون موقف المعارضة. لم يُضف مفعول غير مذكور في اليونانية، إذ يبيّن السياق جهة مقاومتهم.
- source_word: μήποτε
  choice: لعلَّ
  rationale: تنقل «لعلّ» معنى الاحتمال والرجاء الذي تدل عليه μήποτε مع صيغة الالتزام، من غير الجزم بالنتيجة.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: الله يهبهم
  rationale: «يهب» تؤدي معنى العطاء بوصفه منحة من الله، مع بقاء الاحتمال معبَّرًا عنه بواسطة «لعلّ».
- source_word: μετάνοιαν
  choice: التوبة
  rationale: «التوبة» المقابل العربي الراسخ والدقيق، وتشمل تغيّر الفكر والاتجاه والرجوع، فلا تختزل المعنى في تبدل ذهني محض.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: التي تقود إلى معرفة الحق
  rationale: تفيد εἰς الغاية أو النتيجة؛ وهذه الصياغة توضح أن التوبة تقود إلى إدراك الحق ومعرفته.
theological_decisions:
- issue: فعل الله ومسؤولية الإنسان في التوبة
  choice: لعلَّ الله يهبهم التوبة
  alternative: ربما يمنحهم الله التوبة
  rationale: يُبقي النص الله فاعلًا في هبة التوبة، مع الحفاظ على الاحتمال الذي تعبّر عنه μήποτε، من غير حسم العلاقة الأوسع بين السيادة الإلهية واستجابة الإنسان.
- issue: متعلَّق مقاومة المخالفين
  choice: الذين يقاومون
  alternative: الذين يقاومونه
  rationale: لا يوجد مفعول صريح في اليونانية؛ لذلك تُحفظ الصياغة المطلقة، مع أن السياق قد يفهم منها مقاومة خادم الرب أو تعليمه.
