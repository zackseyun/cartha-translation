  register: لغة عربية فصحى معاصرة ذات نبرة كتابية كريمة. حُفظ تركيب الآية بوصفه تابعًا لما قبله، وتُرك متعلَّق المقاومة غير مصرَّح به وفاءً للنص اليوناني.
