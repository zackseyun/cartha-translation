id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: ar
  text: وأمّا عبدُ الربّ[a] فلا ينبغي له أن يخاصم، بل أن يكون رفيقًا بالجميع، قادرًا على التعليم، صبورًا على الإساءة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادم الربّ». يمكن أن تعني الكلمة اليونانية عبدًا أو خادمًا بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: عبد
  rationale: «عبد» يحفظ دلالة التبعية والخدمة الكامنة في δοῦλος، وهو تعبير عربي كتابي طبيعي في تركيب «عبد الرب»، مع إيضاح البديل «خادم» في الحاشية.
- source_word: κυρίου
  choice: الربّ
  rationale: ترجمة κύριος بـ«الربّ» هي المقابل العربي المألوف، والإضافة في «عبد الربّ» تنقل صيغة المضاف إليه اليونانية بوضوح.
- source_word: οὐ δεῖ
  choice: فلا ينبغي له أن
  rationale: ينقل معنى الالتزام المعياري في δεῖ بصياغة عربية واضحة وطبيعية، من غير تحويل العبارة إلى مجرد احتمال أو نصيحة ضعيفة.
- source_word: μάχεσθαι
  choice: يخاصم
  rationale: الفعل في هذا السياق الرعوي يدل أساسًا على الدخول في الخصومات والمنازعات، لا على القتال الجسدي.
- source_word: ἤπιον
  choice: رفيقًا
  rationale: «رفيق» يعبّر عن الوداعة واللطف في المعاملة، ويقابل سلوك المخاصمة المذكور قبله.
- source_word: πρὸς πάντας
  choice: بالجميع
  rationale: صياغة عربية موجزة وطبيعية تحافظ على شمول السلوك المطلوب تجاه كل الناس.
- source_word: διδακτικόν
  choice: قادرًا على التعليم
  rationale: ينقل معنى الأهلية والكفاءة للتعليم، لا معنى كونه قابلًا للتعلّم.
- source_word: ἀνεξίκακον
  choice: صبورًا على الإساءة
  rationale: يبيّن أن الصبر المقصود هو احتمال الأذى أو المعاملة السيئة دون ردّ انتقامي، وهو أدق من «صبورًا» وحدها.
theological_decisions:
- issue: ترجمة δοῦλος في سياق توجيهات الخدمة
  choice: عبد
  alternative: خادم
  rationale: «عبد الربّ» تركيب عربي راسخ يحفظ قوة الانتماء والطاعة في اللفظ اليوناني، لكن «خادم الربّ» ممكن سياقيًا؛ لذلك أُثبت البديل في الحاشية دون حسم الدلالة المعجمية المتسعة.
- issue: ترجمة κύριος
  choice: الربّ
  alternative: السيّد
  rationale: «الربّ» هو المقابل المعتاد في هذا السياق المسيحي، ولا توجد قرينة تستلزم العدول إلى «السيّد».
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت بنية «وأمّا... فلا... بل...» لإبراز المقابلة في النص اليوناني، مع الحفاظ على سلسلة الصفات الموازية.
