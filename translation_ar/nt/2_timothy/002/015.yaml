  terminology: «كلمة الحق» مناسبة وتحافظ على العبارة الرسولية. و«مقبولًا» مقبول هنا للدلالة على δόκιμον في سياق المثول لدى الله، مع أن فيه ضمنًا معنى الثبوت في الاختبار. وتحافظ الحاشية على الصورة الحرفية للفعل النادر من دون حصره في التعليم.
