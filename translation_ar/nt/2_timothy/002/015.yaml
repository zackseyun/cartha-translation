  to: اجتهد أن تُقدِّم نفسك لله مقبولًا، عاملًا لا موجب للخجل لديه، مُحسنًا التعامل مع كلمة الحق.[a]
  rationale: استُبدلت العبارة غير المألوفة «يتناول ... تناولًا مستقيمًا» بـ«مُحسنًا التعامل مع» لأنها عربية فصحى حديثة طبيعية، وتنقل المعنى المجازي الواسع للفعل من غير قصره على التعليم. وأُعيدت صياغة نفي الخجل إلى «لا موجب للخجل لديه» لتقريب دلالة «لا سبب يدعو إلى الخجل» مع سلامة التعبير.
