  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: ar
  text: اجتهد أن تُقدِّم نفسك لله مقبولًا، عاملًا لا موجب للخجل لديه، مُحسنًا التعامل مع كلمة الحق.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يعلِّم كلمة الحق تعليمًا صحيحًا»؛ وحرفيًا: «يشقّ كلمة الحق في خط مستقيم».'
    reason: بديل معجمي يحفظ دلالة الفعل النادر وصورته الحرفية.
lexical_decisions:
- source_word: σπούδασον
  choice: اجتهد
  rationale: فعل أمر يفيد بذل الجهد بجدية؛ و«اجتهد» عربي واضح يحفظ قوة الطلب من غير تهويل.
- source_word: σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ
  choice: أن تُقدِّم نفسك لله مقبولًا
  rationale: يحفظ تركيب التقديم لله، ويعبّر «مقبولًا» عن الشخص الذي ثبتت صلاحيته بعد الاختبار، من غير إضافة تفسير غير مصرّح به.
- source_word: ἐργάτην ἀνεπαίσχυντον
  choice: عاملًا لا داعيَ له إلى الخجل
  rationale: «عاملًا» يحفظ استعارة العمل، والعبارة التالية تدل على عدم وجود سبب موجب للخجل، لا على مجرد شعور نفسي بعدمه.
- source_word: ὀρθοτομοῦντα
  choice: يتناول ... تناولًا مستقيمًا
  rationale: اختيار واسع يحفظ معنى المعالجة الصحيحة ولا يقصر الفعل على التعليم وحده، كما أن «مستقيمًا» يُبقي صدى الصورة الحرفية، أي الشق أو القطع في خط مستقيم.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: كلمة الحق
  rationale: صياغة عربية موجزة تحفظ الإضافة اليونانية والرنين الرسولي المألوف، من غير تحويل «الكلمة» صراحةً إلى «الرسالة».
theological_decisions:
- issue: دلالة ὀρθοτομοῦντα في سياق خدمة تيموثاوس
  choice: يتناول كلمة الحق تناولًا مستقيمًا
  alternative: 'يعلّم كلمة الحق تعليمًا صحيحًا؛ وحرفيًا: يشقّ كلمة الحق في خط مستقيم'
  rationale: الفعل النادر يحتمل صورة القطع المستقيم، ويُستعمل هنا مجازًا على الأرجح للدلالة على التعامل الدقيق والأمين مع رسالة الحق. أبقى المتن المعنى واسعًا، وتعرض الحاشية البديل التفسيري والصورة الحرفية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «عاملًا» بدل ألفاظ قديمة مثل «فعلة»، وجاءت «لا داعي له إلى الخجل» لتوضيح أن المقصود انتفاء موجب الخزي، مع إبقاء العبارة موجزة وطبيعية.
