base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: ar
  text: اللذان حادا عن الحق[a]، قائلَين إن القيامة قد حدثت بالفعل[b]، ويقوّضان إيمان بعض الناس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخطآ الهدف في ما يخص الحق»، أو «انحرفا عن الحق».'
    reason: lexical_alternative
  - marker: b
    text: أي إنهما كانا يزعمان أن القيامة المنتظرة قد صارت حدثًا ماضيًا؛ ولا تحدد الآية هنا تفاصيل هذا الزعم.
    reason: cross_reference
  - marker: c
    text: 'أو: «يقلبان إيمان بعض الناس»، أو «يزعزعانه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: اللذان
  rationale: ضمير وصل يعود إلى المعلِّمين الكاذبين المذكورين في السياق السابق، وهما شخصان؛ والتثنية العربية تُظهر هذا المرجع بوضوح.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: حادا عن الحق
  rationale: الفعل ἀστοχέω مع هذا التركيب يفيد الإخفاق في إصابة الحق والانحراف عنه. «حادا عن الحق» عربي طبيعي وموجز، مع حفظ الصورة المعجمية البديلة في الحاشية.
- source_word: λέγοντες
  choice: قائلَين
  rationale: يحفظ صيغة اسم الفاعل وعلاقتها بالفعل السابق من غير الجزم هل هي لبيان الوسيلة أم لمجرد وصف مضمون ضلالهما.
- source_word: ἀνάστασιν
  choice: القيامة
  rationale: مع أن الاسم بلا أداة تعريف في اليونانية، فالسياق العقائدي يدل على القيامة المعروفة، والتعريف هو الطبيعي في العربية.
- source_word: ἤδη γεγονέναι
  choice: قد حدثت بالفعل
  rationale: صيغة المصدر التام تدل على حدث مكتمل ذي صلة بالحاضر، وἤδη تفيد أنه وقع قبل الوقت المنتظر؛ وهذا التعبير ينقل المعنى بوضوح.
- source_word: ἀνατρέπουσιν
  choice: يقلبان
  rationale: الفعل يدل على القلب أو التقويض، والمضارع يعبّر عن أثر مستمر. «يقلبان» يحفظ قوة الصورة من غير أن يضيف حكمًا بأن الإيمان قد زال نهائيًا.
- source_word: τήν τινων πίστιν
  choice: إيمان بعض الناس
  rationale: يحفظ «إيمان» بوصفه المقابل المعتاد لـ πίστις، وينقل τινων بعبارة عربية طبيعية غير محددة.
theological_decisions:
- issue: معنى القول إن القيامة قد حدثت بالفعل
  choice: نقل الادعاء كما هو، من غير تحديد الكيفية التي فهم بها المعلّمان القيامة
  alternative: تفسير القول صراحة بأنه قيامة روحية محضة أو إنكار للقيامة الجسدية المستقبلية
  rationale: الآية تعرض مضمون التعليم الكاذب، لكنها لا تشرح نظامه العقائدي بالتفصيل؛ لذلك لا ينبغي إدخال تفسير يتجاوز النص.
- issue: دلالة πίστις
  choice: إيمان
  alternative: ثقة أو أمانة
  rationale: «إيمان» هو المقابل الطبيعي والأقل تقييدًا في هذا السياق، مع بقاء احتمال معنى الثقة ضمن دلالته.
- issue: مدى أثر ἀνατρέπουσιν
  choice: يقلبان إيمان بعض الناس
  alternative: يزعزعان أو يقوّضان إيمان بعض الناس
  rationale: يحفظ الاختيار قوة الفعل اليوناني من غير أن يحسم أن المقصود هلاك الإيمان كليًا؛ وتُذكر البدائل في الحاشية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ومهيبة. استُخدمت صيغة التثنية اتساقًا مع مرجع ضمير الوصل في السياق السابق، وحُفظ التركيب النسبي ذي الفعلين: حادا... ويقلبان. وُضعت جميع علامات الحواشي في المتن.'
