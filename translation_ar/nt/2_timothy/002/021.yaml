id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: ar
  text: لذلك، إن طهَّر أحدٌ نفسه من هذه، فسيكون إناءً للكرامة[a]، مقدَّسًا[b]، نافعًا للسيد، ومهيَّأً لكل عمل صالح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لاستعمال كريم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مجعولًا مقدسًا» أو «مفرزًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: لذلك، إن
  rationale: تحفظ «لذلك» الاستنتاج من السياق السابق، وتحفظ «إن» قوة الشرط، بصياغة عربية واضحة.
- source_word: τις
  choice: أحدٌ
  rationale: تؤدي معنى اسم النكرة العام من غير حصره في شخص معيّن.
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: طهَّر ... نفسه
  rationale: تنقل فعل التطهير والضمير الانعكاسي المفرد، مع بقاء معنى التنقية التامة مفهومًا من السياق.
- source_word: ἀπὸ τούτων
  choice: من هذه
  rationale: تحافظ على الإشارة المبهمة نسبيًا إلى ما سبق، من غير أن تحسم هل المقصود أمور أم أشخاص.
- source_word: σκεῦος εἰς τιμήν
  choice: إناءً للكرامة
  rationale: تحافظ على صورة أواني البيت وعلى المقابلة مع الهوان في العدد السابق، من غير إدخال تفسير «الاستعمال» في المتن.
- source_word: ἡγιασμένον
  choice: مقدَّسًا
  rationale: ينقل حالة ناتجة من فعل التقديس، ويحفظ الصلة اللفظية بمفهوم القداسة.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: نافعًا للسيد
  rationale: «نافعًا» عربية واضحة لمعنى الصلاح للخدمة، و«السيد» تحفظ علاقة السلطة في صورة البيت من غير زيادة تفسيرية.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: مهيَّأً لكل عمل صالح
  rationale: صياغة طبيعية دقيقة تحفظ الشمول في «كل» ومعنى الاستعداد.
theological_decisions:
- issue: مرجع «من هذه»
  choice: الإبقاء على اسم الإشارة من غير تقييده باسم مفسِّر
  alternative: من هذه الأمور / من هؤلاء
  rationale: النص اليوناني يستعمل ضمير إشارة جمعًا محايدًا، وقد يرجع إلى ما سبق من أشياء أو ممارسات أو أشخاص في الصورة والسياق؛ لذلك لا تُحسم الدلالة في المتن.
- issue: معنى εἰς τιμήν
  choice: للكرامة
  alternative: لاستعمال كريم
  rationale: الترجمة المختارة تحفظ المقابلة اللفظية مع الهوان وصورة الإناء، بينما يُذكر التفسير الوظيفي الممكن في الحاشية.
- issue: دلالة ἡγιασμένον
  choice: مقدَّسًا
  alternative: مجعولًا مقدسًا / مفرزًا
  rationale: «مقدَّسًا» تحفظ المجال اللاهوتي وصيغة الحالة الناتجة، من غير حصر التقديس في مجرد التخصيص الوظيفي.
- issue: ترجمة δεσπότης في استعارة البيت
  choice: السيد
  alternative: المالك / الرب
  rationale: «السيد» تحفظ سلطة صاحب البيت في الاستعارة، من غير تحويل اللفظة إلى لقب لاهوتي أكثر تحديدًا مما يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحانهما مباشرة، وصيغت الجملة بالمفرد العام محافظةً على بنية الأصل.
