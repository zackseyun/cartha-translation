  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: ar
  text: والاضطهادات والآلام التي أصابتني في أنطاكية وإيقونية ولِسترة—وأيَّ اضطهاداتٍ احتملتُها![a] وقد أنقذني الرب منها جميعًا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما أشدَّ الاضطهادات التي احتملتُها!»'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن «الرب» يشير إلى الرب يسوع، مع أن النص اليوناني لا يقول إلا «الرب».
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: الاضطهادات
  rationale: يدل الاسم على الملاحقة والظلم العدائيين بسبب الولاء أو الرسالة، و«الاضطهادات» هو المقابل العربي الطبيعي الراسخ في هذا السياق.
- source_word: παθήμασιν
  choice: الآلام
  rationale: يحمل اللفظ معنى واسعًا لتجارب المعاناة، و«الآلام» يحفظ هذا الاتساع من غير حصره في المشقات الخارجية.
- source_word: οἷά μοι ἐγένετο
  choice: التي أصابتني
  rationale: صياغة عربية طبيعية تشير إلى الوقائع التي حلّت ببولس، مع إبقاء صلتها بالاضطهادات والآلام المذكورة.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: في أنطاكية وإيقونية ولِسترة
  rationale: نُقلت أسماء الأماكن صوتيًا بصيغ عربية معروفة؛ وحُذف تكرار «في» لأن العطف العربي يغني عنه بوضوح وطبيعية.
- source_word: οἵους διωγμοὺς
  choice: ما أشدَّ الاضطهادات
  rationale: ينقل الأسلوب التعجبي النوعي في οἵους ويعبّر طبيعيًا عن فداحة الاضطهادات من غير إضافة حدث جديد.
- source_word: ὑπήνεγκα
  choice: احتملتُها
  rationale: يفيد الفعل الثبات تحت الضغط وتحمل المعاناة، و«احتملتُها» موجز وطبيعي في العربية.
- source_word: ἐκ πάντων
  choice: منها جميعًا
  rationale: يعود الضمير إلى الاضطهادات والآلام المذكورة، وتحفظ العبارة معنى الإنقاذ منها كلها.
- source_word: ἐρρύσατο
  choice: أنقذني
  rationale: ينقل معنى النجاة من الخطر بوضوح، من غير تحميل العبارة معنى خلاصيًا اصطلاحيًا أضيق.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحفظ اللقب كما ورد في اليونانية من غير إضافة اسم لم يصرّح به النص.
theological_decisions:
- issue: مرجع لقب «الرب»
  choice: إبقاء «الرب» وحدها في المتن
  alternative: الرب يسوع
  rationale: يرجح في السياق البولسي أن يكون المقصود الرب يسوع، لكن اليونانية تذكر اللقب وحده؛ لذلك تُحفظ صياغة المصدر ولا يُضاف اسم صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع جملة متصلة توافق كون الآية جزءًا من تعداد بدأ قبلها. استُخدم التعجب لنقل القوة النوعية في οἵους، وأُبقي لقب «الرب» بلا تفسير داخل المتن.
