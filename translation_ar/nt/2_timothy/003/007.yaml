translation:
  language: ar
  text: يَتَعَلَّمْنَ دائمًا، ولا يَسْتَطِعْنَ أبدًا أن يَصِلْنَ إلى معرفة الحقّ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «معرفة تامة بالحق». يمكن للكلمة اليونانية أن تدل على معرفة أوفى أو أكمل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: دائمًا
  rationale: تنقل الاستمرار والتكرار، وتحافظ مع «أبدًا» على التقابل البلاغي في العبارة.
- source_word: μανθάνοντα
  choice: يَتَعَلَّمْنَ
  rationale: اسم فاعل مضارع يدل على فعل مستمر، وصيغة جمع المؤنث تعود إلى النساء المذكورات في الآية السابقة.
- source_word: μηδέποτε
  choice: لا... أبدًا
  rationale: تؤدي النفي الزمني القاطع، وهي صياغة عربية طبيعية تقابل «دائمًا» بوضوح.
- source_word: εἰς ἐπίγνωσιν
  choice: إلى معرفة
  rationale: تحفظ صورة الحركة نحو المعرفة أو بلوغها، من غير أن تفرض على المتن معنى «المعرفة الكاملة»؛ وقد ذُكر هذا الاحتمال في الحاشية.
- source_word: ἀληθείας
  choice: الحقّ
  rationale: تعبير عربي طبيعي في الاستعمال البولسي، ويدل هنا على الحق المعروف والمقصود لا على الصدق المجرّد.
- source_word: ἐλθεῖν
  choice: أن يَصِلْنَ
  rationale: «يصلن إلى» تعبير عربي فصيح وطبيعي ينقل استعارة المجيء إلى غاية.
- source_word: δυνάμενα
  choice: يَسْتَطِعْنَ
  rationale: تنقل معنى القدرة، مع مطابقة المرجع المؤنث الجمع في السياق السابق.
theological_decisions:
- issue: دلالة ἐπίγνωσις في الاستعمال البولسي
  choice: معرفة
  alternative: معرفة تامة
  rationale: قد تحمل الكلمة معنى المعرفة الأوفى أو الأكمل، لكن محور العبارة هو العجز عن بلوغ معرفة حقيقية بالحق رغم التعلم الدائم. لذلك يحافظ «معرفة» على طبيعية العربية ولا يحوّل اللفظ إلى مصطلح تقني، مع إثبات الدلالة الأقوى في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. أُبقيت صيغة جمع المؤنث لاتصال العبارة نحويًا بالنساء المذكورات في 3:6، وحُفظ التقابل بين «دائمًا» و«لا... أبدًا».
