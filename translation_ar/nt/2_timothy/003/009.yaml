source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: ar
  text: لكنهم لن يتقدّموا أكثر من ذلك[a]، لأن حماقتهم ستصير واضحة للجميع، كما اتضحت حماقة أولئك أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن يحرزوا مزيدًا من التقدّم».'
    reason: lexical_alternative
  - marker: b
    text: أي حماقة ينيس ويمبريس المذكورين في العدد السابق.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: يتقدّموا
  rationale: يفيد الفعل التقدّم أو إحراز التقدّم، واختيار «يتقدّموا» يحافظ على صورة الحركة إلى الأمام من غير أن يوحي بأن هذا التقدّم محمود.
- source_word: ἐπὶ πλεῖον
  choice: أكثر من ذلك
  rationale: هذا التعبير يعني المضي أبعد أو إلى مدى أكبر، وتأتي «أكثر من ذلك» طبيعية مع النفي.
- source_word: ἄνοια
  choice: حماقتهم
  rationale: تعبّر «الحماقة» بوضوح عن انعدام الفهم وما يصاحبه من طيش فكري وأخلاقي في السياق.
- source_word: ἔκδηλος
  choice: واضحة
  rationale: تنقل معنى الشيء الظاهر البيّن بلغة عربية معاصرة ومفهومة.
- source_word: πᾶσιν
  choice: للجميع
  rationale: تحافظ على الشمول الذي يفيده جمع «كل» في اليونانية.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: كما صارت حماقة أولئك أيضًا
  rationale: يعود الضمير المؤنث المحذوف الموصوف إلى «الحماقة»، ولذلك صُرّح بها في العربية لوضوح العبارة، مع إبقاء «أولئك» إحالةً إلى المذكورين قبلًا والحفاظ على معنى καί بـ«أيضًا».
theological_decisions:
- issue: مرجع ἐκείνων
  choice: «أولئك» تحيل إلى ينيس ويمبريس المذكورين في العدد السابق.
  alternative: إحالة عامة إلى معلمين كذبة سابقين.
  rationale: السياق المباشر في 3:8 يذكر ينيس ويمبريس، ثم يقارن انكشاف حماقة المقاومين الحاليين بانكشاف حماقتهما. أبقت الترجمة الإحالة الضميرية في المتن وبيّنت مرجعها في الحاشية دون إدخاله في النص.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، تحافظ على المقابلة والبنية السببية في الأصل. استُخدمت «لكنهم» للمقابلة، و«حماقة» للمجال الفكري والأخلاقي، مع إبقاء الإحالة «أولئك» في المتن وشرحها في الحاشية.
