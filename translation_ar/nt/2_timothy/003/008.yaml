id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: ar
  text: وكما قاوم يَنِّيس ويَمْبِرِيس موسى[a]، كذلك يقاوم هؤلاء أيضًا الحق؛ أناسٌ فسدت عقولهم، ومرفوضون من جهة الإيمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن: «عارض يَنِّيس ويَمْبِرِيس موسى»؛ وبالمثل: «يعارض هؤلاء الحق».'
    reason: lexical_alternative
  - marker: b
    text: يرجَّح أن «الإيمان» هنا يشير إلى الإيمان المسيحي أو إلى رسالة الرسل، لا إلى مجرد الثقة الشخصية.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: وكما
  rationale: تنقل أداة المقارنة مع الربط الانتقالي الخفيف الذي تؤديه δὲ، من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: يَنِّيس ويَمْبِرِيس
  rationale: نقل صوتي للاسمين بصيغة عربية واضحة ومتداولة في التراث الكتابي العربي.
- source_word: ἀντέστησαν ... ἀνθίστανται
  choice: قاوم ... يقاوم
  rationale: يحافظ تكرار الفعل العربي على التوازي المقصود بين مقاومتهما لموسى ومقاومة هؤلاء المستمرة للحق، مع مراعاة الماضي ثم المضارع في اليونانية.
- source_word: οὕτως καὶ οὗτοι
  choice: كذلك يقاوم هؤلاء أيضًا
  rationale: يحفظ الترابط المقارن ويُبقي معنى «أيضًا» ظاهرًا في عربية طبيعية.
- source_word: τῇ ἀληθείᾳ
  choice: الحق
  rationale: ترجمة مباشرة تحفظ اتساع مدلول العبارة، من غير حصرها صراحة في الإنجيل أو التعليم الرسولي.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: أناسٌ فسدت عقولهم
  rationale: صياغة عربية طبيعية تعبّر عن حالة الفساد الناتجة التي يدل عليها اسم الفاعل التام، وتوضح أن الذهن فاسد لدى كل واحد منهم.
- source_word: ἀδόκιμοι
  choice: مرفوضون
  rationale: ينقل معنى عدم اجتياز الاختبار وعدم نيل القبول، من غير توسيع تفسيري في المتن.
- source_word: περὶ τὴν πίστιν
  choice: من جهة الإيمان
  rationale: تحفظ دلالة المجال أو المرجع في περί، وتترك «الإيمان» محتملًا لدلالة العقيدة المسيحية أو رسالة الإيمان بحسب السياق.
theological_decisions:
- issue: مدلول «الحق» و«الإيمان»
  choice: 'الإبقاء على اللفظين بصيغتهما الواسعة: «الحق» و«الإيمان».'
  alternative: تفسيرهما في المتن صراحة بأنهما الإنجيل أو التعليم الرسولي، أو فهم الإيمان على أنه ثقة شخصية فقط.
  rationale: السياق يرجّح الإشارة إلى الحق الرسولي ومضمون الإيمان المسيحي، لكن اليونانية لا تحصر الدلالة بعبارة تفسيرية؛ لذلك تُحفظ السعة والتوتر الدلالي في المتن، مع إيضاح الاحتمال في الحاشية.
- issue: دلالة ἄνθρωποι على الأشخاص المذكورين
  choice: أناس
  alternative: رجال
  rationale: اللفظ اليوناني ἄνθρωποι يصف أشخاصًا، ولا يقتضي بذاته إبراز جنسهم في هذه الجملة. «أناس» يحافظ على المعنى الوصفي من غير إضافة تحديد غير لازم، مع بقاء ضمير الإشارة المذكر «هؤلاء» وفق العربية والسياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم التوازي «قاوم ... يقاوم» لإظهار بنية المقارنة، ووُضعت حاشية الإيمان عند العبارة التي تشرحها مباشرة.
