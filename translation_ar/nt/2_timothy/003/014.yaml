  - marker: b
    text: تقرأ بعض المخطوطات اليونانية «مِمَّنْ» بصيغة المفرد، وغالبًا ما يُفهم المقصود حينئذٍ أنه بولس؛ أمّا القراءة بصيغة الجمع المعتمدة هنا فقد تشير على نحو أوسع إلى معلّمي تيموثاوس.
