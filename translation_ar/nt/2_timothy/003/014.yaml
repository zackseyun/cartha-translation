lexical_decisions:
- source_word: σὺ δὲ
  choice: أَمَّا أَنْتَ
  rationale: يُبرز الضمير الصريح المقابلة مع المذكورين في السياق السابق، وتنقل «أمّا» هذا الانتقال التقابلي بوضوح طبيعي في العربية.
- source_word: μένε ἐν οἷς
  choice: فَاثْبُتْ فِي مَا
  rationale: يفيد فعل الأمر المضارع الاستمرار والمداومة، ويحافظ «اثبت في» على صورة البقاء ضمن نطاق التعليم الذي تلقّاه تيموثاوس.
- source_word: ἔμαθες
  choice: تَعَلَّمْتَهُ
  rationale: ينقل الفعل الماضي سبق تلقّي التعليم، ويعود ضمير المفعول على مضمون ما تعلّمه من غير إضافة معنى جديد.
- source_word: ἐπιστώθης
  choice: تَيَقَّنْتَ مِنْهُ
  rationale: ينقل بلوغ اليقين والثبات تجاه ما تعلّمه، مع إبقاء البديل «اطمأننت إلى صحته» في الحاشية.
- source_word: εἰδὼς
  choice: عَالِمًا
  rationale: يحافظ اسم الفاعل على إيجاز الصيغة اليونانية وعلى انفتاح العلاقة الظرفية، من غير حصرها في معنى سببي صريح.
- source_word: παρὰ τίνων
  choice: مِمَّنْ
  rationale: تفيد «مِن» المصدر الذي تلقّى منه التعليم. وصيغة «مَن» العربية طبيعية ولا تُقحم تعيينًا لهوية المعلّمين، بينما توضّح الحاشية اختلاف العدد في الشواهد.
theological_decisions:
- issue: مرجع παρὰ τίνων وهوية المعلّمين
  choice: 'صياغته بصيغة عامة: «مِمَّنْ تَعَلَّمْتَهُ» من غير تسمية المعلّمين'
  alternative: تعيينه ببولس وحده، أو توسيعه صراحة ليشمل بولس وأم تيموثاوس وجدته
  rationale: الآية لا تسمّي الأشخاص. والقراءة المعتمدة في SBLGNT جمع، لكن العربية الطبيعية بـ«مَن» لا تفرض هوية بعينها؛ لذلك تُصان مساحة النص التأويلية، ويُذكر اختلاف العدد في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «اثبت» للدلالة على الاستمرار الراسخ، و«تيقنت منه» لتجنّب الغموض غير المقصود مع الحفاظ على معنى الاقتناع. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتصلان بهما مباشرة.
