  text: أَمَّا أَنْتَ، فَاثْبُتْ فِي مَا تَعَلَّمْتَهُ وَتَيَقَّنْتَ مِنْهُ[a]، عَالِمًا مِمَّنْ تَعَلَّمْتَ ذَلِكَ[b].
