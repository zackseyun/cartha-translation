lexical_decisions:
- source_word: ἄστοργοι
  choice: بلا حنانٍ لأهلهم
  rationale: يدل اللفظ على انعدام المودة الطبيعية المتوقعة خصوصًا تجاه الأهل والأقربين؛ وهذه الصياغة توضّح المجال العائلي دون استعمال تعبير عربي ملتبس مثل «بلا عاطفة طبيعية».
- source_word: ἄσπονδοι
  choice: لا يقبلون الصلح
  rationale: يدل على من يرفض المصالحة أو لا يرضى بشروط السلام. والصياغة طبيعية في العربية ولا تحصر المعنى في نقض عهد قائم.
- source_word: διάβολοι
  choice: مفترين
  rationale: الجمع هنا وصف أخلاقي في قائمة رذائل، ومعناه من يوجّهون اتهامات كاذبة أو يشهّرون بالآخرين، لا اسمًا لإبليس أو للشياطين.
- source_word: ἀκρατεῖς
  choice: بلا ضبطٍ للنفس
  rationale: يعني فقدان السيطرة على الرغبات والدوافع، وهذه عبارة عربية واضحة ومعاصرة.
- source_word: ἀνήμεροι
  choice: متوحشين
  rationale: يفيد معنى الشراسة والوحشية وانعدام الرفق والتهذيب.
- source_word: ἀφιλάγαθοι
  choice: لا يحبون الخير
  rationale: يحافظ على القوة السالبة للمركب اليوناني، أي غياب محبة الخير، من غير تشديده إلى معنى البغض الفعّال.
theological_decisions:
- issue: دلالة διάβολοι ضمن قائمة الرذائل
  choice: وصف بشري بمعنى «مفترين»
  alternative: «شياطين» أو «إبليسيين»
  rationale: الصيغة جمع ووظيفتها وصف سلوك أخلاقي بين أوصاف بشرية أخرى؛ وترجمتها باسم كائنات روحية قد توهم معنى وجوديًا لا يقتضيه السياق.
- issue: درجة معنى ἀφιλάγαθοι
  choice: «لا يحبون الخير»
  alternative: «مبغضين للخير»
  rationale: الأصل ينفي محبة الخير، ولا يستلزم وحده إثبات بغض نشط له؛ لذلك تُحفظ الصياغة الأقل تشديدًا في المتن مع إثبات البديل في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ومتوازية لتناسب قائمة الرذائل. استُخدم جمع المذكر السالم منصوبًا تبعًا للسياق النحوي المتصل بالآية السابقة، مع عبارات تفسيرية قصيرة حيث لا يؤدي المقابل المفرد المعنى بوضوح.
