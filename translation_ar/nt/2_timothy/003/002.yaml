  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: ar
  text: لأن الناس سيكونون محبّين لأنفسهم، محبّين للمال، متباهين، متكبّرين، مسيئين بالكلام[a]، غير مطيعين لوالديهم، ناكرين للجميل، عديمي التقوى،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مجدّفين» أو «مفترين». قد تشير الكلمة اليونانية إلى كلام يهين الناس أو الله.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: سيكونون
  rationale: فعل مستقبل من εἰμί، والترجمة العربية الطبيعية في هذا السياق هي «سيكونون».
- source_word: γὰρ
  choice: لأن
  rationale: تفيد تعليل العبارة السابقة، و«لأن» تحافظ على وظيفتها التفسيرية بوضوح.
- source_word: οἱ ἄνθρωποι
  choice: الناس
  rationale: التعبير عام يشمل البشر، لا الرجال وحدهم، و«الناس» أفصح وأوضح في العربية المعاصرة.
- source_word: φίλαυτοι
  choice: محبّين لأنفسهم
  rationale: ينقل معنى الحب الأناني للذات، ويحافظ على التوازي مع «محبّين للمال».
- source_word: φιλάργυροι
  choice: محبّين للمال
  rationale: المركّب يعني حرفيًا محبة الفضة أو المال؛ وهذه الصياغة تحفظ بنيته ولا تختزله في الجشع عمومًا.
- source_word: ἀλαζόνες
  choice: متباهين
  rationale: يدل على المتفاخرين المدّعين؛ و«متباهين» واضحة ومناسبة لإيقاع قائمة الرذائل.
- source_word: ὑπερήφανοι
  choice: متكبّرين
  rationale: ينقل الدلالة الأخلاقية السلبية للغرور والتعالي، ويميّزه عن مجرد الاعتزاز.
- source_word: βλάσφημοι
  choice: مجدّفين
  rationale: اللفظ اليوناني يصف كلامًا مهينًا أو مشهّرًا موجّهًا إلى البشر أو إلى الله؛ «مجدّفين» تحفظ ثقله الديني والأخلاقي، مع بيان اتساع معناه في الحاشية.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: غير مطيعين لوالديهم
  rationale: ترجمة عربية طبيعية للصفة مع المجرور الدال على من يُرفض امتثال أمره.
- source_word: ἀχάριστοι
  choice: ناكرين للجميل
  rationale: تعبير عربي واضح ومعاصر عن انعدام الشكر والامتنان.
- source_word: ἀνόσιοι
  choice: غير أتقياء
  rationale: يدل على فقدان التقوى والاحترام لما هو مقدّس؛ وهذه الصياغة تحفظ البعد الديني الأخلاقي من غير قصره على معنى واحد.
theological_decisions:
- issue: عموم التعبير οἱ ἄνθρωποι
  choice: الناس
  alternative: الرجال؛ البشر
  rationale: الصيغة اليونانية المذكرة هنا عامة الجنس، فلا يصح تقييدها بالذكور.
- issue: مدى معنى βλάσφημοι في قائمة الرذائل
  choice: مجدّفين
  alternative: مفترين؛ شاتمين
  rationale: اللفظ قد يدل على كلام يهين الناس أو يجدّف على الله. أُبقيت هذه السعة الدلالية في الحاشية بدل حصر المقصود في أحد الاتجاهين.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة، مع المحافظة على إيقاع قائمة الرذائل وتوازي عبارتي «محبّين لأنفسهم» و«محبّين للمال». أُثبتت الفاصلة الختامية لأن الآية تستمر نحويًا في السياق التالي.
