  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: ar
  text: كلُّ سِفْرٍ من الأسفار المقدسة[a] موحًى به من الله[b]، ونافعٌ للتعليم، وللتوبيخ، وللتقويم، وللتدريب على البر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل الأسفار المقدسة». فالعبارة اليونانية قد تُفهم توزيعيًّا، أي كل سِفر من الأسفار المقدسة، أو جمعيًّا، أي الأسفار المقدسة كلها.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا فهم العبارة: «كل سِفر موحًى به من الله نافع أيضًا للتعليم والتوبيخ والتقويم والتدريب على البر».'
    reason: alternative_reading
  - marker: c
    text: يمكن أن يدل اللفظ المترجم «البر» على «العدل» في بعض السياقات البولسية؛ أما هنا فالمعنى هو التنشئة على الاستقامة في السلوك.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: كُلُّ الْكِتَابِ
  rationale: تدل γραφή في هذا السياق على الكتاب المقدس، لا على أي كتابة عمومًا. وتحتمل العبارة اليونانية معنى «كل الكتاب» على وجه الجمع الكلي، أو «كل نص من الكتاب» على وجه التوزيع؛ اختيرت الصياغة العربية الطبيعية المألوفة، مع حفظ الاحتمال الآخر في الحاشية.
- source_word: θεόπνευστος
  choice: مِنْ نَفَسِ اللهِ
  rationale: ترجمة شفافة للمركب اليوناني بمعنى أن مصدر الكتاب هو نفَس الله، من غير تحميل اللفظ نظرية لاهوتية لاحقة بعينها. وهي أوضح في العربية من النقل الحرفي غير المألوف «متنفَّس من الله».
- source_word: ὠφέλιμος
  choice: نَافِعٌ
  rationale: لفظ عربي واضح وموجز يؤدي معنى المفيد والنافع للأغراض المذكورة بعده.
- source_word: πρὸς διδασκαλίαν
  choice: لِلتَّعْلِيمِ
  rationale: يحفظ معنى التعليم بوصفه فعلًا ومضمونًا، ويتجنب حصره اصطلاحيًا في العقيدة.
- source_word: ἐλεγμόν
  choice: لِلتَّوْبِيخِ
  rationale: يؤدي معنى كشف الخطأ وإظهار الذنب بقصد التصحيح؛ وهو أفصح وأوجز في هذه السلسلة من بدائل تفسيرية أطول.
- source_word: ἐπανόρθωσιν
  choice: لِلتَّقْوِيمِ
  rationale: يعبر عن إعادة الشيء إلى الصواب والاستقامة، ويحفظ الصلة الدلالية بفكرة الإصلاح لا مجرد الانتقاد.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: لِلتَّدْرِيبِ عَلَى الْبِرِّ
  rationale: تشمل παιδεία التهذيب والتنشئة والتدريب. و«التدريب على البر» صياغة طبيعية تفيد التكوين العملي في الحياة المستقيمة.
- source_word: δικαιοσύνῃ
  choice: الْبِرِّ
  rationale: «البر» هو المقابل الكتابي العربي الطبيعي هنا، والسياق يتناول التنشئة الأخلاقية على الاستقامة، لا العدالة القضائية أو الاجتماعية على وجه الخصوص.
theological_decisions:
- issue: العلاقة النحوية بين θεόπνευστος وὠφέλιμος وبين πᾶσα γραφή
  choice: 'عوملت الصفتان خبريتين: «كل الكتاب هو من نفَس الله، ونافع».'
  alternative: «كل نص من الكتاب هو من نفَس الله، وهو أيضًا نافع» أو «كل نص موحًى به من الله نافع أيضًا».
  rationale: القراءة الخبرية المتوازية أنسب لسياق الآيتين 15–17، لكنها ليست الاحتمال النحوي الوحيد؛ لذلك حُفظ الوجه الوصفي الممكن في الحاشية من غير حسم زائد.
- issue: المعنى الجمعي أو التوزيعي لعبارة πᾶσα γραφή
  choice: «كل الكتاب» بوصفه مجموع الأسفار المقدسة.
  alternative: «كل نص من الكتاب» على وجه التوزيع.
  rationale: كلا الوجهين ممكن في اليونانية. الصياغة الجمعية طبيعية في العربية ويناسبها السياق، مع إثبات الوجه التوزيعي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. استُخدم الضبط الجزئي الكامل في نص الآية لتحسين القراءة، مع تراكيب موجزة متوازية تحافظ على إيقاع الأصل. وُضعت علامات الحواشي جميعًا في نهاية الآية لأنها تتصل بعبارات متداخلة وببنية الجملة كلها.
