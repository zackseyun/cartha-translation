  footnotes:
  - marker: a
    text: أو «مظهر التقوى». يمكن أن تشير اللفظة اليونانية إلى الصورة أو الهيئة الظاهرة؛ واختيرت «صورة» للمحافظة على مقابلتها بـ«القوة».
    reason: lexical_alternative
  - marker: b
