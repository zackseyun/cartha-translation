    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: لَهُمْ
  rationale: تفيد امتلاك الأشخاص المذكورين في السياق السابق لصورة التقوى، وتؤدي وظيفة اسم الفاعل اليوناني بعبارة عربية طبيعية.
- source_word: μόρφωσιν
  choice: صُورَةُ
  rationale: تحافظ «صورة» على المقابلة بين الهيئة الظاهرة والقوة الفاعلة، من غير أن تحسم هل المقصود مجرد مظهر أم صيغة متجسدة.
- source_word: εὐσεβείας
  choice: التَّقْوَى
  rationale: تعبّر «التقوى» عن حياة التوقير والتعبد الموجّهة إلى الله، وهي لفظة عربية واضحة ومألوفة في هذا السياق.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: لَكِنَّهُمْ ... قُوَّتَهَا
  rationale: تحفظ العبارة نسبة القوة إلى التقوى، وتبقي معنى «القوة» واسعًا بوصفه فاعليتها وحقيقتها المؤثرة.
- source_word: ἠρνημένοι
  choice: قَدْ أَنْكَرُوا
  rationale: تنقل «قد» مع الماضي دلالة اسم الفاعل التام على موقف إنكار مستقر ناتج عن فعل سابق، بدل تصويره كفعل عابر فقط.
- source_word: καὶ τούτους ἀποτρέπου
  choice: فَأَعْرِضْ عَنْ هَؤُلَاءِ
  rationale: «أعرض عن» تؤدي معنى الأمر بأن يحوّل المخاطَب نفسه بعيدًا عن هؤلاء ويتجنبهم، والفاء تصل الأمر طبيعيًا بالوصف السابق.
theological_decisions:
- issue: المقابلة بين التدين الظاهر وحقيقته الفاعلة
  choice: صُورَةُ التَّقْوَى ... قُوَّتَهَا
  alternative: مَظْهَرُ التَّقْوَى ... قُوَّتَهَا
  rationale: تحفظ الصياغة التوتر بين الهيئة الدينية والقوة الفاعلة للتقوى الحقيقية، من غير حصر «القوة» في المعجزات أو التغيير الأخلاقي أو عمل الروح القدس وحده، لأن النص اليوناني لا يضيّق معناها إلى واحد من هذه الأمور.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم الماضي مع «قد» لنقل الأثر المستمر لصيغة التمام اليونانية، وحُفظت المقابلة الموجزة بين «صورة التقوى» و«قوتها».
