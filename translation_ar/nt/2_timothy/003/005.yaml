translation:
  language: ar
  text: لَهُمْ صُورَةُ التَّقْوَى[a]، لَكِنَّهُمْ قَدْ أَنْكَرُوا قُوَّةَ التَّقْوَى؛ فَأَعْرِضْ عَنْ هَؤُلَاءِ[b].
