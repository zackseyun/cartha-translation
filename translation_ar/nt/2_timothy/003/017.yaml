lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تُدخل جملة الغاية المترتبة على ما سبق، وتحفظ دلالة القصد بعبارة عربية طبيعية.
- source_word: ἄρτιος
  choice: كاملًا
  rationale: تفيد الأهلية والاكتمال اللازمين للمهمة، من غير أن تعني العصمة من الخطية.
- source_word: ᾖ
  choice: يكون
  rationale: صيغة مناسبة بعد «لكي» لتمثيل المضارع الالتزامي في جملة الغاية.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: إنسانُ اللهِ
  rationale: يحفظ التعبير الكتابي المعروف؛ و«إنسان» في العربية صالح هنا للدلالة على الفرد البشري مع عدم طمس صيغته الإفرادية في اليونانية.
- source_word: πρὸς
  choice: لِـ
  rationale: تعبّر عن التهيئة والملاءمة لأجل كل عمل صالح.
- source_word: πᾶν ἔργον ἀγαθόν
  choice: كلِّ عملٍ صالح
  rationale: ترجمة مباشرة وطبيعية تحفظ القوة الاستغراقية لـπᾶν والصفة الأخلاقية لـἀγαθόν.
- source_word: ἐξηρτισμένος
  choice: مُجَهَّزًا
  rationale: يحفظ معنى اسم المفعول الدال على حالة ناجمة عن إعداد وتجهيز تمّا؛ ويمكن أيضًا إبراز معنى التمام بقول «مُجَهَّزًا تمامًا».
theological_decisions:
- issue: دلالة التعبير ὁ τοῦ θεοῦ ἄνθρωπος
  choice: إنسانُ اللهِ
  alternative: رجلُ اللهِ
  rationale: التعبير اليوناني مفرد مذكر وقد يرد كلقب كتابي معروف، وربما يشير في السياق أولًا إلى خادم الله، مع إمكان انطباق المبدأ بصورة أوسع. «إنسان الله» يحفظ اللفظ الأساسي ἄνθρωπος ولا يحصره بلا ضرورة في الذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ توازي «كاملًا، مُجَهَّزًا» مع وضع الحواشي بعد اللفظين المعنيين، وتُجُنِّب تفسير هوية «إنسان الله» تفسيرًا طائفيًا حاسمًا.
