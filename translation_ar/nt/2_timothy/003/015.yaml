base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: ar
  text: وأنك تعرف، منذ أن كنت رضيعًا، الكتابات المقدسة[a] القادرة أن تمنحك الحكمة التي تقود إلى الخلاص بالإيمان بالمسيح يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكتب المقدسة». والعبارة اليونانية حرفيًا: «الكتابات المقدسة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: منذ طفولتك المبكرة
  rationale: تنقل دلالة βρέφος على السن المبكرة جدًا، مع تجنب إيحاء «منذ الرضاعة» بأن معرفة النصوص بدأت حرفيًا قبل القدرة على التعلم.
- source_word: ἱερὰ γράμματα
  choice: الكتابات المقدسة
  rationale: ترجمة قريبة من التعبير اليوناني الحرفي، وتحافظ على الإشارة إلى النصوص الدينية التي عرفها تيموثاوس دون تحويل العبارة حتمًا إلى مصطلح تقني لاحق.
- source_word: οἶδας
  choice: تعرف
  rationale: الفعل تام في صيغته لكنه حاضر الدلالة؛ ومع «منذ طفولتك المبكرة» يفيد معرفة بدأت قديمًا وما زالت قائمة.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: القادرة أن تمنحك الحكمة
  rationale: يحافظ على قدرة الكتابات بوصفها الفاعل الدلالي، ويؤدي معنى σοφίζω بعربية طبيعية أوضح من التعبير الحرفي المتعثر «تجعلك حكيمًا» في هذا السياق.
- source_word: εἰς σωτηρίαν
  choice: المؤدية إلى الخلاص
  rationale: تُظهر دلالة الغاية أو النتيجة في εἰς، وتربط الحكمة بالخلاص دون القول إن المعرفة وحدها تُخلّص.
- source_word: διὰ πίστεως
  choice: من خلال الإيمان
  rationale: تنقل الوسيلة التي تفيدها διά مع المضاف إليه، وتحافظ على المعنى المعتاد لـ πίστις هنا.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: بالمسيح يسوع
  rationale: حرف الجر العربي «بـ» هو التعبير الطبيعي مع الإيمان بشخص، و«المسيح» ينقل Χριστός بوصفه لقبًا مع الحفاظ على ترتيب «المسيح يسوع».
theological_decisions:
- issue: 'دلالة Χριστῷ: لقب أم عنصر اسمي تقليدي'
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحافظ النص على معنى Χριστός بوصفه لقبًا وعلى ترتيب العبارة اليونانية، مع استعمال المقابل العربي الراسخ «المسيح».
- issue: دلالة πίστεως في διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: من خلال الإيمان بالمسيح يسوع
  alternative: من خلال أمانة المسيح يسوع
  rationale: الأقرب نحويًا وسياقيًا أن المقصود إيمان الشخص الموجَّه إلى المسيح يسوع؛ لكن احتمال دلالة «الأمانة» حُفظ في الحاشية بدل إسقاطه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت «طفولتك المبكرة» بدل الصياغة الحرفية الضيقة «منذ أن كنت رضيعًا»، و«تمنحك الحكمة المؤدية إلى الخلاص» لتأدية المعنى اليوناني بعربية سليمة مع إبقاء العلاقة بين الحكمة والخلاص والإيمان واضحة.
