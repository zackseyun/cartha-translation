  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: ar
  text: 'ولكن اعلم هذا: ستأتي في الأيام الأخيرة أزمنة عصيبة[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أزمنة خطرة» أو «أزمنة شاقة». يمكن أن تدل الصفة اليونانية على أزمنة صعبة أو خطرة أو أليمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: هذا
  rationale: اسم إشارة محايد يتجه إلى مضمون جملة ὅτι اللاحقة، و«هذا» طبيعي ودقيق في العربية.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد الأداة انتقالًا مع مقابلة خفيفة بالسياق السابق، و«ولكن» تحفظ هذا التحول دون مبالغة.
- source_word: γίνωσκε
  choice: اعلم
  rationale: فعل أمر مضارع للمفرد، يفيد الحث على الوعي بحقيقة ينبغي إدراكها؛ و«اعلم» موجز وفصيح.
- source_word: ὅτι
  choice: ':'
  rationale: تدخل على مضمون ما ينبغي معرفته، وتؤدي النقطتان هذه الوظيفة بصورة طبيعية بعد «اعلم هذا».
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: في الأيام الأخيرة
  rationale: تحفظ العبارة الأخروية المعهودة من غير تحديد إضافي لنطاقها الزمني.
- source_word: ἐνστήσονται
  choice: ستأتي
  rationale: المستقبل من ἐνίστημι يدل هنا على حلول الأزمنة أو حضورها؛ و«ستأتي» واضحة وطبيعية مع «أزمنة».
- source_word: καιροὶ
  choice: أزمنة
  rationale: تشير الكلمة إلى فترات أو مواسم ذات طابع معين، و«أزمنة» أنسب في هذا التركيب من مجرد الوقت الزمني.
- source_word: χαλεποί
  choice: عصيبة
  rationale: يمكن أن تصف الكلمة ما هو شاق أو خطير أو أليم؛ و«عصيبة» تجمع معنى الشدة والمشقة بلغة عربية معاصرة رصينة.
theological_decisions:
- issue: مدلول «الأيام الأخيرة»
  choice: الإبقاء على العبارة الأخروية «الأيام الأخيرة» من غير حصرها في المدة السابقة مباشرة لعودة المسيح.
  alternative: فهمها بوصفها الفترة النهائية قبيل النهاية، أو بمعناها الأوسع في منظور أخروي قد بدأ بالفعل.
  rationale: النص نفسه لا يحسم هنا مدى العبارة الزمني، لذلك تحافظ الترجمة على التوتر الدلالي واللاهوتي ولا تفرض نظامًا أخرويًا معينًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «عصيبة» لتوصيل شدة χαλεποί مع إبقاء بدائلها الدلالية في الحاشية، وحُفظت صيغة «الأيام الأخيرة» من غير تفسير مذهبي.
