reference: 2 Timothy 3:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: ar
  text: فَمِنْ هَؤُلَاءِ قَوْمٌ يَتَسَلَّلُونَ إِلَى الْبُيُوتِ وَيَأْسِرُونَ[a] نِسَاءً ضَعِيفَاتٍ[b] مُثْقَلَاتٍ بِالْخَطَايَا[c]، تَسُوقُهُنَّ شَهَوَاتٌ شَتَّى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «يأخذون أسيرات»؛ فالفعل اليوناني يستحضر صورة أسر الناس والاستيلاء عليهم.'
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني صيغة تصغير ذات نبرة انتقاصية، ويشير هنا إلى نساء ضعيفات أو سهل استغلالهن، لا إلى النساء عمومًا.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «مُحَمَّلات بالخطايا»؛ وتشير الصياغة إلى خطايا متراكمة تثقل كاهلهن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: فَمِنْ هَؤُلَاءِ
  rationale: تعبير عربي طبيعي يدل على أن هؤلاء الأشخاص ينتمون إلى الفئة الموصوفة في السياق السابق، مع إبقاء دلالة «مِن» في الأصل.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: يَتَسَلَّلُونَ إِلَى الْبُيُوتِ
  rationale: ينقل معنى الدخول خفيةً وبطريقة ملتوية، ويحافظ «البيوت» على المرجع المكاني والاجتماعي للكلمة اليونانية.
- source_word: αἰχμαλωτίζοντες
  choice: يَأْسِرُونَ
  rationale: يحافظ على صورة أخذ الأسرى الكامنة في الفعل، ويعبّر بوضوح عن إخضاع الضحايا للنفوذ.
- source_word: γυναικάρια
  choice: نِسَاءً ضَعِيفَاتٍ
  rationale: الاسم تصغير ذو نبرة ازدرائية في هذا السياق، ويشير إلى فئة من النساء يسهل استغلالها، لا إلى النساء عمومًا. هذه الصياغة مفهومة في العربية الحديثة، مع بيان الصيغة الأصلية في الحاشية.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: مُثْقَلَاتٍ بِالْخَطَايَا
  rationale: ينقل حالة تراكم الخطايا وما يصاحبها من وطأة، بصياغة عربية طبيعية.
- source_word: ἀγόμενα
  choice: تَسُوقُهُنَّ
  rationale: يعبّر عن وقوعهن تحت تأثير يقودهن، مع الحفاظ على صورة الحركة بفعل قوة مؤثرة.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: شَهَوَاتٌ شَتَّى
  rationale: «شهوات» تنقل البعد الأخلاقي السلبي المحتمل لـἐπιθυμίαι، و«شتى» تعبّر بإيجاز عن تنوعها.
theological_decisions:
- issue: الدلالة الانتقاصية في γυναικάρια
  choice: نِسَاءً ضَعِيفَاتٍ
  alternative: نُسَيّات / نساء تافهات
  rationale: يخص النص نساءً عرضةً للاستغلال ولا يقرر ضعف النساء عمومًا. تجنبت الترجمة الحرفية الغريبة في العربية وكذلك وصف «تافهات» الذي قد يضيف حكمًا عقليًا أو أخلاقيًا أصرح مما يقتضيه اللفظ، وأثبتُّ دلالة التصغير والانتقاص في الحاشية.
- issue: مدلول οἰκίας في سياق التسلل
  choice: الْبُيُوتِ
  alternative: الأُسَر / المنازل
  rationale: «البيوت» أقرب إلى اللفظ اليوناني، وتحتمل المكان والمجال العائلي معًا من غير حصر الدلالة في المبنى أو في أفراد الأسرة وحدهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «يتسللون» لإظهار خفاء الدخول، و«تسوقهن شهوات شتى» للمحافظة على قوة صورة الانقياد مع سلاسة العبارة. وُضعت علامات الحواشي مباشرة بعد الألفاظ التي تشرحها.
