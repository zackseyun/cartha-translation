  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: ar
  text: وإن جميع الذين يريدون أن يعيشوا بالتقوى في المسيح يسوع سيُضطهدون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάντες δὲ
  choice: بل إن جميع
  rationale: ينقل التركيبُ الاتصالَ بالسياق مع نبرة تقريرية مؤكِّدة، ويجعل «جميع» شاملة لكل أفراد الفئة المذكورة، من غير المبالغة في جعل δέ أداة استدراك قوية.
- source_word: οἱ θέλοντες
  choice: الذين يريدون
  rationale: ينقل تركيب أداة التعريف مع اسم الفاعل الحاضر بوصفه فئة محددة تتصف بالإرادة أو الرغبة.
- source_word: ζῆν εὐσεβῶς
  choice: أن يعيشوا بتقوى
  rationale: صياغة عربية طبيعية تحفظ كون εὐσεβῶς حالًا يصف طريقة العيش، ومعناه الديني والأخلاقي المتعلق بالتقوى.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: يحفظ حرف الجر دلالة المجال والعلاقة بالمسيح يسوع، ويترجم Χριστός بلقبه العربي المألوف «المسيح» بدل نقله صوتيًا.
- source_word: διωχθήσονται
  choice: سيُضطهدون
  rationale: ينقل المستقبل المبني للمجهول مباشرة ويحفظ المعنى العدائي للفعل في هذا السياق.
theological_decisions:
- issue: دلالة ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  alternative: بسبب انتمائهم إلى المسيح يسوع
  rationale: أُبقي تركيب «في» على سعته المقصودة، إذ قد يدل على مجال الحياة والعلاقة والاتحاد بالمسيح، دون اختزاله في السببية وحدها.
- issue: ترجمة Χριστός كلقب أو كصيغة شبيهة بالاسم
  choice: المسيح يسوع
  alternative: المسيّا يسوع
  rationale: «المسيح» هو المقابل العربي الواضح والمستقر للقب اليوناني Χριστός ويحفظ صفته اللقبية من غير إدخال تمييز مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل المبني للمجهول «سيُضطهدون» حفاظًا على بنية المصدر، و«بتقوى» لتجنب الصياغة الثقيلة «بطريقة تقية». لا توجد حواشٍ لازمة؛ فاختلاف «المسيح/المسيّا» ترجمي لا قراءة نصية بديلة.
