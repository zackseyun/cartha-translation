lexical_decisions:
- source_word: προδόται
  choice: خائنين
  rationale: يدل اللفظ على من يخون أو يغدر، و«خائنين» تعبير عربي طبيعي موجز يلائم نسق قائمة الرذائل.
- source_word: προπετεῖς
  choice: متهوّرين
  rationale: يصف اللفظ الاندفاع بلا تبصّر؛ و«متهوّرين» واضحة في العربية المعاصرة وتحفظ معنى الطيش والإقدام غير المحسوب.
- source_word: τετυφωμένοι
  choice: منتفخين بالكبرياء
  rationale: يحفظ التعبير صورة الانتفاخ في الفعل اليوناني، مع بيان أن المقصود هو الغرور والكبرياء.
- source_word: φιλήδονοι
  choice: محبّين للملذّات
  rationale: ينقل تركيب اللفظ الدال على حب اللذة، ويحافظ على الموازاة مع محبة الله.
- source_word: μᾶλλον ἢ
  choice: أكثر من
  rationale: يحفظ البناء المقارن في اليونانية وما فيه من تفضيل للملذات على الله، دون تحويله بالضرورة إلى نفي مطلق لكل محبة لله.
- source_word: φιλόθεοι
  choice: محبتهم لله
  rationale: صياغة عربية طبيعية ضمن المقارنة، تنقل معنى محبي الله وتحافظ على التقابل مع محبة الملذات.
theological_decisions:
- issue: حفظ المقابلة بين حب الملذات وحب الله من غير إضافة دلالة عقائدية غير منصوص عليها
  choice: محبّين للملذّات أكثر من محبتهم لله
  alternative: محبّين للملذّات لا لله
  rationale: «أكثر من» تنقل μᾶλλον ἢ بصورتها المقارنة وتحفظ التوتر الدلالي، بينما البديل قد يجعل العبارة نفياً مطلقاً لا يصرّح به التركيب.
- issue: نقل استعارة τετυφωμένοι
  choice: منتفخين بالكبرياء
  alternative: مغرورين
  rationale: المختار يحفظ صورة الانتفاخ ويشرح مجالها الأخلاقي بإيجاز، أما البديل فينقل المعنى فقط ويحذف الصورة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصيغة النصب التابعة لسياق قائمة الصفات في الآيات السابقة. حُفظ الإيقاع التعدادي، واستُعملت «الملذّات» للدلالة الأخلاقية الواضحة، مع إبقاء المقارنة اليونانية «أكثر من».
