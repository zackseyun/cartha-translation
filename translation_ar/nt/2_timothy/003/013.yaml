id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: ar
  text: أمّا الأشرار والدجّالون[a] فسيمضون من سيّئ إلى أسوأ[b]، يُضِلّون ويُضَلّون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المشعوذون» أو «المحتالون»؛ فاللفظ اليوناني يدل على مخادعين محتالين، وقد يحمل في بعض السياقات إيحاءات بالسحر أو الدجل.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «سيتقدّمون إلى ما هو أسوأ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: الأشرار
  rationale: ينقل الفساد الأخلاقي المقصود، لا مجرد كونهم سيئين من حيث الجودة أو الكفاءة.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: صيغة عربية طبيعية تُظهر المقابلة مع الكلام السابق عن تيموثاوس والأمناء.
- source_word: ἄνθρωποι
  choice: الأشرار (أشخاص أشرار مفهومًا من السياق)
  rationale: المراد أناس على وجه العموم، لا الذكور حصرًا؛ وفي العربية يؤدي استعمال الصفة جمعًا للدلالة على الأشخاص هذا المعنى بإيجاز وطبيعية.
- source_word: γόητες
  choice: الدجّالون
  rationale: يدل اللفظ على محتالين مخادعين يدّعون ما ليس لهم؛ وهذه الصياغة تحفظ معنى الزيف والاحتيال دون الجزم بأن السحر هو المقصود في السياق.
- source_word: προκόψουσιν
  choice: سيمضون
  rationale: يحفظ معنى الاستمرار والتقدم، مع ترك العبارة التالية تحدد أن الاتجاه نحو الأسوأ.
- source_word: ἐπὶ τὸ χεῖρον
  choice: من سيّئ إلى أسوأ
  rationale: تعبير عربي واضح وطبيعي عن الانتقال المستمر إلى حال أشد سوءًا.
- source_word: πλανῶντες
  choice: يُضِلّون
  rationale: ينقل اسم الفاعل الدال على نشاط مستمر في خداع الآخرين وقيادتهم إلى الضلال.
- source_word: πλανώμενοι
  choice: يُضَلّون
  rationale: 'يحفظ صيغة المبني للمجهول والتوتر المقصود: فهم يضلّون غيرهم، وفي الوقت نفسه يقع عليهم الإضلال.'
theological_decisions:
- issue: دلالة ἄνθρωποι وصيغته المذكرة
  choice: الأشرار
  alternative: الرجال الأشرار
  rationale: الجمع المذكر في اليونانية عام هنا ويشير إلى أشخاص عمومًا، فلا يصح تقييده بالذكور.
- issue: مدى الإيحاء بالسحر في γόητες
  choice: الدجّالون
  alternative: السحرة
  rationale: قد يحمل اللفظ في بعض الاستعمالات إيحاءات بالسحر أو الشعوذة، لكن السياق يبرز الاحتيال والإضلال؛ لذلك لا تُفرض دلالة سحرية أقوى مما يثبته النص.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة وموقّرة. استُعملت المقابلة «أمّا ... فـ» والعبارة الاصطلاحية «من سيّئ إلى أسوأ»، مع إبقاء التوازي اللاهوتي والبلاغي بين الفعلين المبنيين للمعلوم والمجهول: «يُضِلّون ويُضَلّون».'
