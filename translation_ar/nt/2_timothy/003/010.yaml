id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: ar
  text: أما أنت فقد تتبعتَ عن كثب تعليمي وسيرتي وقصدي وإيماني[a] وصبري ومحبتي وثباتي،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمانتي». يمكن أن تدل الكلمة اليونانية في هذا السياق على الإيمان أو الأمانة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: أما أنت
  rationale: تحفظ أداة المقابلة δέ مع إبراز الضمير Σὺ، وتأتي بصياغة عربية طبيعية تربط الآية بوصف الأشرار السابق.
- source_word: παρηκολούθησάς
  choice: تتبعتَ عن كثب
  rationale: تنقل معنى المتابعة الدقيقة والمعرفة الوثيقة، مع إمكان اشتمالها على الملاحظة والاقتداء.
- source_word: μου
  choice: تعليمي وسيرتي...
  rationale: نُقل المضاف إليه اليوناني بصيغة ضمير المتكلم المتصل بكل عناصر القائمة دلاليًا، من غير تكرار ثقيل في العربية.
- source_word: διδασκαλίᾳ
  choice: تعليمي
  rationale: لفظ واضح ومعاصر ينقل مضمون ما كان بولس يعلّمه من غير نبرة اصطلاحية زائدة.
- source_word: ἀγωγῇ
  choice: سيرتي
  rationale: تدل على نهج الحياة والسلوك، وهي أنسب مع ضمير المتكلم من تعبير أكثر تجريدًا.
- source_word: προθέσει
  choice: قصدي
  rationale: ينقل الغاية أو العزم المستقر الذي وجّه حياة بولس وخدمته.
- source_word: πίστει
  choice: إيماني
  rationale: يحفظ المعنى المعتاد للإيمان، مع إبقاء احتمال الأمانة في الحاشية لأن السياق يحتمله.
- source_word: μακροθυμίᾳ
  choice: صبري
  rationale: ينقل طول الأناة، ولا سيما تجاه الناس والاستفزاز، بلغة مفهومة وموجزة.
- source_word: ἀγάπῃ
  choice: محبتي
  rationale: المقابل العربي المباشر والطبيعي لـἀγάπη.
- source_word: ὑπομονῇ
  choice: ثباتي
  rationale: يبرز الصمود تحت الشدة ويميّزه عن μακροθυμία المترجمة «صبري».
theological_decisions:
- issue: دلالة πίστις في قائمة صفات بولسية
  choice: إيماني
  alternative: أمانتي
  rationale: يمكن أن يدل اللفظ هنا على الثقة الإيمانية أو على الأمانة والثبات؛ اختير «إيماني» في المتن، وحُفظ الاحتمال الآخر في الحاشية من دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدمت قائمة موجزة متوازنة، مع «أما أنت» لإظهار المقابلة، و«ثباتي» للتمييز بين الصمود تحت الشدائد والصبر تجاه الناس.
