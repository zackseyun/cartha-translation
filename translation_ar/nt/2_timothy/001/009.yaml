  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: ar
  text: الذي خلَّصنا ودعانا بدعوةٍ مقدَّسة[a]، لا بحسب أعمالنا، بل بحسب قصده الخاص ونعمته، التي أُعطيت لنا في المسيح يسوع قبل الأزمنة الأزلية[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إلى دعوةٍ مقدَّسة» أو «بواسطة دعوةٍ مقدَّسة». تحتمل صيغة الداتيف في اليونانية أكثر من وجه.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «قبل بدء الأزمنة» أو، بصياغة اصطلاحية، «قبل بدء الزمن». والعبارة اليونانية حرفيًّا قريبة من «قبل أزمنة أزلية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: خلَّصنا
  rationale: يحافظ الفعل «خلَّص» على الدلالة الخلاصية الواضحة للفعل اليوناني، وعلى توازيه مع «دعانا».
- source_word: καλέσαντος
  choice: دعانا
  rationale: «دعا» هو المقابل الطبيعي الذي يحفظ معنى الدعوة الإلهية في الاستعمال البولسي.
- source_word: κλήσει ἁγίᾳ
  choice: بدعوةٍ مقدَّسة
  rationale: صياغة عربية طبيعية وقريبة من تركيب المجرور اليوناني، مع بيان احتمالات دلالته في الحاشية بدل حسمها.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: لا بحسب أعمالنا
  rationale: تنقل «بحسب» معنى المعيار أو الأساس في κατά، وتُبقي «أعمالنا» بوصفها مصطلحًا بولسيًا مهمًّا.
- source_word: ἰδίαν πρόθεσιν
  choice: قصده الخاص
  rationale: «القصد» يلائم πρόθεσις في هذا السياق، والضمير يعود إلى الله المفهوم من السياق السابق.
- source_word: χάριν
  choice: نعمته
  rationale: «النعمة» هي المقابل اللاهوتي العربي الراسخ لـχάρις، والضمير يوضح أنها نعمة الله.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: التي أُعطيت لنا
  rationale: اسم الموصول المؤنث يعود نحويًّا إلى «نعمته»، موافقًا لاتفاق اسم المفعول اليوناني مع χάριν.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» يترجم Χριστός بوصفه لقبًا، و«يسوع» ينقل الاسم؛ كما تحفظ «في» الصيغة البولسية.
- source_word: πρὸ χρόνων αἰωνίων
  choice: قبل الأزمنة الأزلية
  rationale: تحافظ العبارة على الصورة الزمنية غير المألوفة في اليونانية من غير اختزالها تفسيريًّا إلى «قبل بدء الزمن».
theological_decisions:
- issue: دلالة المجرور في κλήσει ἁγίᾳ
  choice: بدعوةٍ مقدَّسة
  alternative: إلى دعوةٍ مقدَّسة؛ أو بواسطة دعوةٍ مقدَّسة
  rationale: يمكن فهم صيغة المجرور اليونانية على أنها للمصاحبة أو الغاية أو الوسيلة؛ فاختيرت صياغة موجزة مع حفظ الاحتمالات في الحاشية.
- issue: ترجمة Χριστός كلقب أم كجزء من اسم مركب
  choice: المسيح يسوع
  alternative: المسيحُ يسوع؛ أو يسوع المسيح (مع تغيير ترتيب الأصل)
  rationale: يحفظ «المسيح» معنى اللقب، ويحافظ ترتيب «المسيح يسوع» على ترتيب النص اليوناني من غير تحويل اللقب إلى لفظ منقول بلا معنى.
- issue: مدى تفسير πρὸ χρόνων αἰωνίων
  choice: قبل الأزمنة الأزلية
  alternative: قبل بدء الأزمنة؛ أو قبل بدء الزمن
  rationale: الصياغة المختارة تحفظ التوتر والتعبير الزمني في الأصل، بينما البدائل الأسلس أكثر تفسيرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حوفظ على بنية الجملة التابعة التي تبدأ بـ«الذي» لارتباط الآية بما قبلها، وعلى المصطلحات البولسية «خلَّص»، «دعا»، «الأعمال»، «القصد»، و«النعمة».
