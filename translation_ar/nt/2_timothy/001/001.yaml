source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: ar
  text: بولس، رسول المسيح يسوع بمشيئة الله، بمقتضى وعد الحياة التي في المسيح يسوع،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: بولس
  rationale: الصيغة العربية المعيارية المستقرة لاسم العلم اليوناني.
- source_word: ἀπόστολος
  choice: رسول
  rationale: يحفظ الدلالة الاصطلاحية لخدمة بولس المفوَّضة، وهو المقابل العربي الكتابي الواضح لـ«رسول» لا مجرد حامل رسالة.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: المسيح يسوع
  rationale: ينقل Χριστός بوصفه لقبًا، مع إبقاء يسوع اسمًا، ويحافظ على ترتيب الأصل في الموضعين.
- source_word: διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  rationale: صياغة عربية طبيعية موجزة تعبّر عن كون رسوليته ناشئة عن مشيئة الله وسلطانه.
- source_word: κατ’ ἐπαγγελίαν
  choice: بمقتضى وعد
  rationale: تحفظ معنى الموافقة أو الارتباط المعبَّر عنه بـκατά، وتبيّن أن الرسولية مرتبطة بالوعد دون حصر العلاقة في غاية واحدة.
- source_word: ζωῆς
  choice: الحياة
  rationale: المضاف إليه يحدّد مضمون الوعد، والعبارة التالية تخصّص هذه الحياة.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: التي في المسيح يسوع
  rationale: ينقل التركيب الوصفي ويحفظ قوة ἐν وعلاقة الحياة بالمسيح دون تفسيرها تفسيرًا أضيق من النص.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» هو المقابل العربي الدلالي الراسخ للقب، ويحفظ صفته اللقبية بدل معاملته اسمًا منقولًا صوتيًا.
- issue: علاقة الرسولية بوعد الحياة في κατ’ ἐπαγγελίαν
  choice: بمقتضى وعد الحياة
  alternative: لأجل وعد الحياة
  rationale: يحفظ احتمال المطابقة أو الارتباط بالمقياس الذي تدل عليه κατά، ولا يحسم العبارة على أنها غاية الرسولية وحدها.
- issue: دلالة ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  alternative: بالاتحاد بالمسيح يسوع
  rationale: أُبقي التعبير المكاني-العلاقي المجازي كما في الأصل، من غير إدخال تفسير لاهوتي شارح في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تركيب التحية بوصفه جملة ممتدة تنتهي بفاصلة لاتصالها بما يلي، مع تجنّب الألفاظ الكنسية الغامضة أو الشروح المضافة.
