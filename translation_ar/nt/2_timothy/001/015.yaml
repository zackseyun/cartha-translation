lexical_decisions:
- source_word: Οἶδας
  choice: أنت تعلم
  rationale: ينقل معنى المعرفة القائمة في الفعل اليوناني بصياغة عربية مباشرة وطبيعية.
- source_word: τοῦτο ὅτι
  choice: 'هذا: إن'
  rationale: يحافظ على اسم الإشارة ويجعل ما بعده مضمونًا لما يعلمه تيموثاوس، مع استعمال النقطتين لتوضيح العلاقة.
- source_word: ἀπεστράφησάν με
  choice: أعرضوا عني
  rationale: يحفظ صورة التحول والابتعاد في الأصل، مع دلالة سياقية على سحب الولاء أو المساندة، من غير حصرها في معنى تفسيري واحد مثل الهجر أو الترك.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: جميع الذين في أَسِيَّا
  rationale: يحافظ على القوة الشاملة للفظ πάντες وعلى التحديد السياقي للجماعة الموجودة في أَسِيَّا، دون أن يضيف قيدًا تفسيريًا إلى المتن.
- source_word: Ἀσίᾳ
  choice: أَسِيَّا
  rationale: نقل للاسم الجغرافي، مع بيان أن المقصود الولاية الرومانية القديمة في الحاشية منعًا للخلط بالقارة الحديثة.
- source_word: ὧν ἐστιν
  choice: ومن بينهم
  rationale: صياغة عربية طبيعية تؤدي المعنى التبعي الذي يذكر شخصين من داخل المجموعة الأوسع.
- source_word: Φύγελος
  choice: فيجلّس
  rationale: نقل صوتي للاسم اليوناني Φύγελος إلى العربية.
- source_word: Ἑρμογένης
  choice: هرموجينس
  rationale: نقل صوتي للاسم اليوناني Ἑρμογένης إلى العربية.
theological_decisions:
- issue: نطاق «جميع الذين في أَسِيَّا»
  choice: إبقاء «جميع» بصيغتها الواسعة مع ترك نطاقها محددًا بالسياق، أي الجماعة المعنية المرتبطة ببولس في أَسِيَّا.
  alternative: اعتبارها حكمًا مطلقًا على كل فرد مسيحي في الولاية، أو تلطيفها صراحة بوصفها مبالغة بلاغية.
  rationale: يمكن أن تكون πάντες شاملة بلاغيًا ضمن نطاق يحدده السياق. لذلك يحفظ المتن توتر العبارة وقوتها من غير تعميم مضاف أو تقييد غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «أعرضوا عني» للحفاظ على الصورة اليونانية وعلى احتمال دلالتها على التخلي عن بولس أو سحب المساندة منه، مع توضيح البدائل في الحاشية. وُضعت علامتا الحاشية في المتن بحسب موضع كل منهما.
