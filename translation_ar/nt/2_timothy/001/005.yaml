  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: ar
  text: إذ تذكّرت إيمانك الصادق، الذي سكن أولًا في جدتك لوئيس وأمك أفنيكي، وأنا واثق بأنه ساكن فيك أيضًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: إذ تذكّرت
  rationale: تعبير عربي طبيعي ينقل معنى تلقّي التذكير أو استحضار الأمر في الذهن، من غير إثقال الصياغة بحرفية غير مألوفة.
- source_word: ἀνυποκρίτου πίστεως
  choice: إيمانك الصادق
  rationale: ἀνυπόκριτος يعني الخالي من الرياء أو التظاهر؛ و«الصادق» واضح وطبيعي في العربية ويحفظ المقابلة الأخلاقية المقصودة.
- source_word: ἐνῴκησεν
  choice: سكن
  rationale: يحفظ صورة الفعل اليوناني الدالة على الإقامة في الشخص، بدل تخفيفها إلى مجرد امتلاك الإيمان.
- source_word: πέπεισμαι
  choice: أنا واثق
  rationale: ينقل حالة الاقتناع الراسخ الناتجة عن الفعل التام اليوناني بصياغة عربية مباشرة.
theological_decisions:
- issue: طبيعة الإيمان وانتقاله بين أفراد الأسرة
  choice: الإبقاء على صورة سكن الإيمان في كل شخص
  alternative: القول إن الإيمان «انتقل» من الجدة إلى الأم ثم إلى تيموثاوس
  rationale: النص يثبت وجود الإيمان فيهم ولا يصرّح بآلية انتقاله أو وراثته، لذلك لا تُضاف دلالة لاهوتية غير موجودة.
- issue: درجة يقين بولس بشأن إيمان تيموثاوس
  choice: «أنا واثق بأنه ساكن فيك أيضًا»
  alternative: «أظن أنه فيك أيضًا»
  rationale: πέπεισμαι يدل على اقتناع وثقة، لا على مجرد الظن، مع بقاء العبارة شهادة بولس لا تقريرًا لنظرية عقدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «جدتك» وفق الاستعمال المعاصر، وحُفظت استعارة «سكن» لأنها مفهومة وتحمل صورة الأصل اليوناني. ضمير المخاطب المضاف إلى «إيمانك» يصوغ طبيعيًا معنى τῆς ἐν σοὶ ... πίστεως.
