  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: ar
  text: لأن الله لم يعطنا روح الجبن[a]، بل روح القوة والمحبة وضبط النفس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الخَوَر» أو «التهيّب»؛ فاللفظ اليوناني يدل على الجبن والخوف المثبط، لا على الخوف العادي بإطلاق.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «التعقّل» أو «الانضباط»؛ فاللفظ يشمل سلامة الحكم وضبط السلوك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: لأن ... لم
  rationale: تؤدي «لأن» وظيفة γάρ التفسيرية وتربط القول بما قبله، بينما تنقل «لم» نفي الفعل الماضي.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: الله لم يعطنا
  rationale: صياغة عربية طبيعية تنقل الفعل الماضي وضمير المفعول غير المباشر بوضوح.
- source_word: πνεῦμα
  choice: روح
  rationale: تحافظ «روح» على سعة اللفظ اليوناني وإمكان فهمه بوصفه روحًا أو نزعةً باطنية، من غير حسم زائد لهويته.
- source_word: δειλίας
  choice: الجبن
  rationale: يدل اللفظ على الجبن والخوف المثبط أكثر من دلالته على الخوف العادي، و«الجبن» أقرب إلى قوته السلبية.
- source_word: δυνάμεως
  choice: القوة
  rationale: مقابل مباشر وواضح لمعنى القدرة والقوة في هذا السياق.
- source_word: ἀγάπης
  choice: المحبة
  rationale: المقابل العربي المألوف والدقيق لـἀγάπη في لغة كتابية معاصرة كريمة.
- source_word: σωφρονισμοῦ
  choice: ضبط النفس
  rationale: تعبير واضح حديث يجسد جانب الانضباط والسيطرة المتزنة على النفس، مع حفظ اتساع اللفظ في الحاشية.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: إبقاء «روح» دون تعريف أو إضافة تفسيرية تحصرها في الروح القدس أو في مجرد نزعة نفسية
  alternative: «الروح القدس» أو «نزعة»
  rationale: غياب أداة التعريف في اليونانية واقتران الكلمة بإضافات وصفية يسمحان بفهم نوع الروح أو التوجه الذي يمنحه الله، لكن اللفظ نفسه قد يحمل دلالة روحية أوسع؛ لذلك تحافظ الصياغة على التوتر ولا تحسمه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل التركيب المتوازي «روح الجبن ... روح القوة» لتوضيح المقابلة، مع إبقاء «روح» واسعة الدلالة. وُضعت علامتا الحاشيتين بعد اللفظين اللذين تشرحان بدائلهما.
