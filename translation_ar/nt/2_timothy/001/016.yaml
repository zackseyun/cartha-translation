  to: ليمنح الرب رحمةً لأهل بيت أونيسيفورس، لأنه أنعشني مرارًا، ولم يستحِ من قيدي.[a]
  rationale: توضح المراجعة أن الرحمة موجَّهة إلى أهل بيت أونيسيفورس لا إلى مبناه، وتستعمل نقلًا أوضح للاسم. كما تستبدل «سلسلتي» بـ«قيدي» لمقابلة المفرد اليوناني بصورة عربية مألوفة في سياق الأسر، وتُبقي الحاشية على المعنى الكنائي المحتمل للسجن.
