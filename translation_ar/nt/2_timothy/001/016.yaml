source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: ar
  text: ليمنح الرب رحمةً لأهل بيت أونيسيفورس، لأنه أنعشني مرارًا، ولم يستحِ من قيدي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «من سجني»؛ وحرفيًا: «من قيدي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: ليمنح
  rationale: صيغة التمني في اليونانية تعبّر عن دعاء أو رجاء؛ وتنقل «ليمنح» هذا المعنى بوضوح وطبيعية.
- source_word: ἔλεος
  choice: رحمةً
  rationale: المقابل العربي المألوف والدقيق للعطف الإلهي الممنوح لمن هو في حاجة.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحفظ اللقب الإلهي كما ورد من غير تعيين مرجعه بما يتجاوز النص.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: لبيت أُنيسيفورس
  rationale: «البيت» في هذا السياق يدل طبيعيًا على أهل البيت أو الأسرة، ويحافظ على صورة الأصل.
- source_word: ὅτι
  choice: لأنه
  rationale: يقدّم سبب الدعاء بالرحمة بوضوح.
- source_word: πολλάκις
  choice: مرارًا
  rationale: تعبير عربي موجز وطبيعي عن تكرار الفعل.
- source_word: ἀνέψυξεν
  choice: أنعشني
  rationale: يحفظ صورة منح الانتعاش والراحة، ويمكن أن يشمل التشجيع والتخفيف.
- source_word: τὴν ἅλυσίν μου
  choice: سلسلتي
  rationale: يحافظ على المفرد والصورة الحسية في الأصل، مع احتمال استعمالها كنايةً عن السجن.
- source_word: οὐκ ἐπαισχύνθη
  choice: لم يخجل
  rationale: ينقل القوة الاجتماعية والأخلاقية للفعل اليوناني بصياغة عربية مباشرة.
theological_decisions:
- issue: مرجع «الرب» في الدعاء
  choice: الإبقاء على «الرب» من غير تحديد إضافي
  alternative: تعيينه بأنه الله الآب أو الرب يسوع
  rationale: النص اليوناني لا يحدد المرجع صراحةً، ولذلك تحفظ الترجمة هذا القدر من الاحتمال.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة؛ صيغ الدعاء والسبب طبيعية، مع إبقاء الصورة الأصلية في «سلسلتي» وشرح دلالتها الكنائية في الحاشية.
