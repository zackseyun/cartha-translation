  source_fidelity: يلزم تعديل «وإنما»، لأنها تفيد الحصر أو الاستدراك التصحيحي ولا تقابل δέ هنا؛ الأنسب «ولكنها». كما أن «أبرز إلى النور» تركيب غير مألوف مع مفعوليه في العربية، بينما «أظهر» ينقل وظيفة φωτίσαντος الكشفية بوضوح. واستبدال «البشارة» بـ«الإنجيل» أدق وأثبت مقابلًا لـεὐαγγέλιον في الاستعمال العربي الكتابي.
