  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: ar
  text: ولكنها قد أُظهرت الآن بظهور مخلّصنا يسوع المسيح، الذي أبطل الموت وأظهر الحياة وعدم الفساد[a] بواسطة الإنجيل،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخلود». يدل اللفظ اليوناني على عدم الفساد أو عدم البلى.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: أُظهرت
  rationale: صيغة مبنية للمجهول تحافظ على معنى الإعلان والإظهار، وتعود نحويًا إلى نعمة الله المذكورة في الآية السابقة.
- source_word: ἐπιφανείας
  choice: ظهور
  rationale: لفظ عربي طبيعي وواضح يدل على ظهور المخلّص في التاريخ، من غير اللجوء إلى تعريب اصطلاحي غامض.
- source_word: σωτῆρος
  choice: مخلِّص
  rationale: المقابل العربي المألوف والدقيق للقب الخلاصي.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ معناه اللقبي مع كونه جزءًا مألوفًا من تسمية يسوع.
- source_word: καταργήσαντος
  choice: أبطل
  rationale: ينقل معنى إبطال الفاعلية والهزيمة الحاسمة، من غير أن يفرض أن الموت قد زال وجوده تمامًا في الزمن الحاضر.
- source_word: φωτίσαντος
  choice: أبرز إلى النور
  rationale: 'تعبير عربي مفهوم يحفظ صورة الكشف والإظهار الكامنة في الفعل، ويلائم مفعوليه: الحياة وعدم الفساد.'
- source_word: ἀφθαρσίαν
  choice: عدم الفساد
  rationale: يحافظ مباشرة على معنى التحرر من الفساد والبلى، بدل حصر اللفظ في معنى دوام الوجود وحده.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: بواسطة البشارة
  rationale: «بواسطة» تُظهر دلالة الوسيلة في διά مع المضاف إليه، و«البشارة» لفظ عربي واضح للخبر السار المعلن.
- source_word: μὲν ... δὲ
  choice: أبطل الموت وأبرز إلى النور
  rationale: العطف يقدّم الفعلين المتكاملين بسلاسة في العربية؛ إبطال الموت من جهة، وإظهار الحياة وعدم الفساد من جهة أخرى، من غير تركيب متكلّف.
theological_decisions:
- issue: قوة καταργήσαντος في وصف ما فعله المسيح بالموت
  choice: أبطل الموت
  alternative: قضى على الموت؛ جرّد الموت من قوته
  rationale: «أبطل» يحفظ قوة الانتصار الحاسم، مع إبقاء التوتر بين هذا الإعلان وبين استمرار اختبار الموت في العصر الحاضر.
- issue: دلالة ἀφθαρσίαν
  choice: عدم الفساد
  alternative: الخلود؛ عدم البلى
  rationale: «عدم الفساد» أقرب إلى التركيب اليوناني وإلى معنى عدم التعرض للفساد أو الفناء، بينما يُذكر «الخلود» في الحاشية بوصفه احتمالًا شائعًا.
- issue: دلالة Χριστός في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع، الممسوح
  rationale: «المسيح» في العربية لقب معروف يحفظ الدلالة المسيانية، ولا يحوّل اللقب إلى اسم عائلة أو يفرض فصلًا حادًا بين استعماله اللقبي واستعماله الشبيه بالاسم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. صيغت العبارة بوصفها استمرارًا للآية السابقة، لذلك جاءت «أُظهرت» مؤنثة عائدة إلى نعمة الله. حُفظت صورة «النور» في φωτίσαντος، وتُرك ادعاء إبطال الموت بقوته وتوتره اللاهوتي من غير شرح زائد داخل المتن.
