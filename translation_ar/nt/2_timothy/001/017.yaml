  rationale: صياغة عربية طبيعية تحفظ معنى وجوده في روما، من غير أن تحسم ما إذا كان اسم الفاعل اليوناني يشدد على الوصول إليها أو مجرد الوجود فيها.
- source_word: σπουδαίως
  choice: باجتهاد
  rationale: ينقل معنى الجدية وبذل الجهد المتعمد في البحث.
- source_word: ἐζήτησέν με
