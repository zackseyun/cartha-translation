id: 2TI.1.14
reference: 2 Timothy 1:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: ar
  text: احفظ الوديعة الصالحة[a] بالروح القدس الساكن فينا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الوديعة الكريمة»، أو: «ما اؤتمنت عليه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بواسطة الروح القدس الذي يسكن فينا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: الوديعة الصالحة
  rationale: «الوديعة» تحافظ على صورة شيء ثمين أُودع لدى شخص ليصونه، و«الصالحة» تنقل الوصف الأخلاقي والجوهري في καλὴν من غير حصره في الجمال أو النفاسة.
- source_word: φύλαξον
  choice: احفظ
  rationale: صيغة الأمر تدعو إلى صيانة يقظة وفاعلة. و«احفظ» عربية طبيعية تشمل الحراسة والحماية من الضياع أو التحريف.
- source_word: διὰ πνεύματος ἁγίου
  choice: بالروح القدس
  rationale: تنقل الباء معنى الوسيلة أو الفاعلية الذي تؤديه διά مع المضاف إليه، مع إبقاء العبارة موجزة وطبيعية.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: الساكن فينا
  rationale: تنقل «الساكن» معنى الإقامة المستمرة في صيغة اسم الفاعل، وتحافظ «فينا» على الضمير والجمع من غير تضييق نطاقه.
theological_decisions:
- issue: مرجع «الوديعة الصالحة»
  choice: 'أُبقي التعبير عامًا ومجازيًا: «الوديعة الصالحة».'
  alternative: تفسيرها صراحة بأنها رسالة الإنجيل أو الخدمة الموكلة إلى تيموثاوس.
  rationale: يرجح السياق صلتها بالتعليم الرسولي، لكن النص اليوناني لا يسمّي محتواها هنا؛ لذلك لا تحسم الترجمة المرجع تفسيريًا.
- issue: دلالة διά في صلة الروح القدس بالحفظ
  choice: «بالروح القدس» بوصفه وسيلة الحفظ أو فاعله.
  alternative: «بمعونة الروح القدس» أو «بواسطة الروح القدس».
  rationale: تحافظ الباء على سعة الدلالة بين الوسيلة والفاعلية، من غير إضافة لفظ «المعونة» غير الموجود صراحة في الأصل.
- issue: نطاق ضمير الجمع في «فينا»
  choice: أُبقي الضمير كما هو من غير تحديد.
  alternative: بولس وتيموثاوس خاصة، أو المؤمنون عامة.
  rationale: يمكن أن يشير الضمير مباشرة إلى بولس وتيموثاوس مع امتداد أوسع إلى جماعة المؤمنين؛ ولا يفرض النص هنا أحد النطاقين صراحة.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة وكريمة النبرة. استُعملت «الوديعة» للمحافظة على الاستعارة القانونية/الائتمانية، و«الساكن فينا» بدل تعبير اصطلاحي تقني. وُضعت كل علامة حاشية عند العبارة التي تشرحها.
