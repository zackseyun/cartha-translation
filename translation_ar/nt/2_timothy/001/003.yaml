id: 2TI.1.3
reference: 2 Timothy 1:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: ar
  text: أشكر الله، الذي أخدمه[a] كما خدمه أجدادي[b]، بضمير طاهر، إذ أذكرك بلا انقطاع[c] في صلواتي ليلًا ونهارًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعبده». يدل الفعل اليوناني على خدمة دينية أو عبادة مقدمة لله.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «من الأجداد». وقد تفيد العبارة: «منذ عهد أجدادي» أو «على نهج أجدادي»، وهي تعبّر عن الاستمرارية مع إيمان الأسلاف وخدمتهم لله.'
    reason: source_ambiguity
  - marker: c
    text: 'حرفيًا: «لي ذكر متواصل بشأنك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: أشكر الله
  rationale: هذا التعبير اليوناني اصطلاح للشكر، وصياغة «أشكر الله» هي المقابل العربي الطبيعي المباشر.
- source_word: ᾧ λατρεύω
  choice: الذي أخدمه
  rationale: الفعل يدل على خدمة دينية مقدمة لله، وقد يشمل معنى العبادة؛ و«أخدمه» يحفظ اتساع الدلالة، مع بيان البديل في الحاشية.
- source_word: ἀπὸ προγόνων
  choice: كما خدمه أجدادي
  rationale: صياغة عربية طبيعية تعبّر عن استمرارية خدمة بولس لله مع خدمة أسلافه، من غير أن تجعل تقليد الأجداد أساسًا مستقلًا للإيمان.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: بضمير طاهر
  rationale: تفيد العبارة كيفية خدمته لله؛ و«ضمير طاهر» تعبير عربي واضح يحفظ الدلالة الأخلاقية لـκαθαρός.
- source_word: ὡς
  choice: إذ
  rationale: تصل «إذ» الشكر بذكر تيموثاوس في الصلاة بوصفه ظرفًا ملازمًا، من غير حسمها على أنها سببية صريحة.
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: أذكرك بلا انقطاع
  rationale: ينقل المعنى المقصود بصياغة عربية طبيعية، بدل الترجمة الحرفية الثقيلة «لي ذكر متواصل بشأنك».
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: في صلواتي
  rationale: δέησις تختص غالبًا بالدعاء والطلب، لكن «صلواتي» أوضح في السياق العربي العام ولا تستبعد معنى التضرع.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ليلًا ونهارًا
  rationale: تعبير عربي مألوف يحفظ ترتيب الأصل ويفيد الاستمرار والمواظبة.
theological_decisions:
- issue: صلة خدمة بولس لله بإيمان أجداده في عبارة ἀπὸ προγόνων
  choice: كما خدمه أجدادي
  alternative: منذ عهد أجدادي؛ أو على نهج أجدادي
  rationale: يرجح السياق معنى الاستمرارية مع إيمان الأسلاف، لكن العبارة اليونانية موجزة ويمكن فهمها من جهة المنشأ أو التقليد أيضًا؛ لذلك تُذكر البدائل في الحاشية من غير تحميل النص دعوى مذهبية إضافية.
- issue: مدى دلالة λατρεύω بين الخدمة والعبادة
  choice: أخدمه
  alternative: أعبده
  rationale: الفعل يصف خدمة دينية لله وقد يحمل معنى العبادة. اختيار «أخدمه» يبقي المجال الدلالي أوسع، والحاشية تحفظ البديل المشروع.
- issue: دلالة ὡς في وصل الشكر بالذكر في الصلاة
  choice: إذ
  alternative: حين؛ أو لأنني
  rationale: الأداة قد تقدم الملابسة أو المحتوى، وربما تفهم سببيًا. «إذ» تحفظ الصلة من غير تقرير أن التذكر هو علة الشكر حصرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أخدمه» و«أذكرك بلا انقطاع» لتجنب التراكيب الحرفية الثقيلة، مع إبقاء البدائل والدلالات المحتملة في الحواشي. جميع علامات الحواشي مثبتة في المتن.
