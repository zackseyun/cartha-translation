id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: ar
  text: ولهذا السبب أيضًا أُعاني هذه الأمور، لكنني لا أخجل، لأنني أعرف مَن آمنتُ به[a]، وأنا على يقين بأنه قادر أن يحفظ وديعتي[b] إلى ذلك اليوم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «مَن وثقتُ به».'
    reason: lexical_alternative
  - marker: b
    text: «وديعتي» تترجم لفظًا يدل على شيء يُوضَع في عهدة شخص ليحفظه. وقد يُراد بها ما أودعه بولس لدى الله، أو ما ائتمن الله بولس عليه.
    reason: alternative_reading
  - marker: c
    text: أي اليوم الآتي للدينونة الإلهية النهائية والتبرئة.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: ولهذا السبب
  rationale: تعبير سببي عربي طبيعي يحفظ الصلة بما سبق.
- source_word: καὶ ταῦτα πάσχω
  choice: أيضًا أُعاني هذه الأمور
  rationale: يحفظ معنى الاستمرار في المعاناة، وأداة الإشارة دون تحديد ماهية الآلام.
- source_word: ἀλλ’ οὐκ ἐπαισχύνομαι
  choice: لكنني لا أخجل
  rationale: صياغة عربية واضحة تلائم موقف بولس الشخصي من معاناته.
- source_word: οἶδα γὰρ ᾧ πεπίστευκα
  choice: لأنني أعرف مَن آمنتُ به
  rationale: يحفظ المفعول الشخصي ودلالة الإيمان المستقر؛ واستعمال «آمن به» هو التعبير العربي الطبيعي.
- source_word: καὶ πέπεισμαι
  choice: وأنا على يقين
  rationale: يعبّر بوضوح عن الاقتناع الراسخ ذي الأثر الحاضر.
- source_word: ὅτι δυνατός ἐστιν
  choice: بأنه قادر
  rationale: يحفظ معنى القدرة وضمير الغائب من غير التصريح بهوية المرجع التي لم تُذكر في العبارة اليونانية.
- source_word: τὴν παραθήκην μου
  choice: وديعتي
  rationale: «الوديعة» هي المقابل العربي الطبيعي لشيء يُوضَع لدى آخر للحفظ، وتحفظ إمكان فهم الإضافة بأكثر من اتجاه.
- source_word: φυλάξαι
  choice: أن يحفظ
  rationale: يلائم مجاز الوديعة ويشمل الحراسة والصون.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: إلى ذلك اليوم
  rationale: يحفظ حرف الجر اليوناني وإشارته الزمنية إلى اليوم الآتي دون توسيع تفسيري في المتن.
theological_decisions:
- issue: مرجع «مَن» والفاعل المستتر في «قادر»
  choice: 'الإبقاء عليه مرجعًا شخصيًا غير مسمّى: «مَن... بأنه»'
  alternative: التصريح بأنه الله أو المسيح يسوع
  rationale: لا تسمّي العبارة اليونانية المرجع صراحة، وإن كان السياق يشير إليه؛ لذا يُحفظ مستوى التحديد الموجود في النص.
- issue: معنى παραθήκην μου
  choice: «وديعتي» مع إبقاء اتجاه الإيداع ملتبسًا
  alternative: ما أودعه بولس لدى الله، أو ما ائتمن الله بولس عليه
  rationale: يمكن أن تدل الإضافة على ما يخص بولس وقد استودعه عند الله، أو على ما عُهد به إلى بولس؛ ولا تحسم العبارة اليونانية وحدها ذلك.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أُعاني» بدل صياغة أقدم مثل «أحتمل الآلام»، و«وديعة» للحفاظ على المجاز والالتباس الحقيقي في الأصل. جميع علامات الحواشي مثبتة في المتن.
