  source_fidelity: 'النص العربي ينقل بدقة البنية والمعاني الأساسية في اليونانية: السببية، المعاناة الحاضرة، عدم الخجل، المعرفة والثقة الراسختان، قدرة المرجع الشخصي غير المسمّى، ومجاز الوديعة المحفوظة إلى ذلك اليوم. ويحافظ على عدم تسمية مرجع الضمائر صراحة وعلى التباس «وديعة/παραθήκη» المقصود.'
  naturalness: 'الصياغة فصيحة معاصرة وسلسة: «ولهذا السبب أيضًا أُعاني هذه الأمور» و«أنا على يقين بأنه قادر أن يحفظ وديعتي» واضحتان وملائمتان للسجل الرسائلي. واستعمال «إلى ذلك اليوم» طبيعي ومقبول للدلالة الزمنية المقصودة هنا.'
  terminology: «آمنتُ به» مقابل طبيعي لـ πεπίστευκα في العربية، مع حفظ بديل «وثقتُ به» في الحاشية. و«وديعتي» مقابل دقيق وطبيعي لـ παραθήκην μου ويحفظ صورة الشيء الموضوع لدى آخر للحفظ. الحواشي الثلاث مثبتة في مواضعها وتعرض البدائل أو الإيضاح دون فرض تفسير مذهبي.
