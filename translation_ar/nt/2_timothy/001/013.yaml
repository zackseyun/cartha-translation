  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: ar
  text: تَمَسَّكْ بنموذجِ الكلماتِ السليمةِ التي سمعتَها مني، بالإيمان[a] والمحبة اللذين في المسيح يسوع.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالأمانة والمحبة». وقد تحمل الكلمة اليونانية المترجمة «الإيمان» معنى الأمانة أو الإخلاص أو الثقة.'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن فهم العبارة أيضًا هكذا: «نموذج الكلمات السليمة التي سمعتَها مني عن الإيمان والمحبة في المسيح يسوع». فالتركيب اليوناني قد يصف كيفية التمسك بالنموذج، أو مضمون الكلمات.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: نموذج
  rationale: تدل الكلمة على مثال أو صيغة يُحتذى بها؛ و«نموذج» عربية واضحة تحفظ معنى الشكل المعياري من غير مبالغة في التحديد.
- source_word: ἔχε
  choice: تَمَسَّكْ بـ
  rationale: الفعل يعني حرفيًا «امتلك»، لكن صيغة الأمر في السياق تفيد الاحتفاظ والالتزام، وهو ما تؤديه «تمسّك بـ» طبيعيًا.
- source_word: ὑγιαινόντων λόγων
  choice: الكلمات الصحيحة
  rationale: يحمل الفعل صورة الصحة والسلامة مجازيًا، و«الصحيحة» تفيد سلامة الأقوال من الخطأ، مع إبقاء λόγων «كلمات» بدل تفسيرها مباشرةً بأنها «تعليم».
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: التي سمعتَها مني
  rationale: παρά مع المضاف إليه يدل هنا على المصدر، أي «مني»، والضمير الموصول يعود طبيعيًا إلى الكلمات.
- source_word: ἐν πίστει
  choice: بالإيمان
  rationale: يفيد حرف الجر هنا المجال أو الكيفية؛ و«بالإيمان» صياغة عربية طبيعية، مع حفظ احتمال «الأمانة/الإخلاص» في الحاشية.
- source_word: καὶ ἀγάπῃ
  choice: والمحبة
  rationale: ترجمة مباشرة وواضحة لـ ἀγάπη.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: اللذين في المسيح يسوع
  rationale: العبارة الموصولة تصف الإيمان والمحبة معًا؛ واستُخدم المثنى المذكر تغليبًا للإيمان والمحبة في العربية.
- source_word: Χριστῷ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته اللقبية بوضوح للقارئ العربي.
theological_decisions:
- issue: تعلّق عبارة ἐν πίστει καὶ ἀγάπῃ
  choice: 'تصف كيفية أو مجال تمسّك تيموثاوس بالنموذج: بالإيمان والمحبة اللذين في المسيح يسوع.'
  alternative: قد تتعلق بالكلمات الصحيحة، فتكون كلمات عن الإيمان والمحبة في المسيح يسوع.
  rationale: يميل سياق الوصية إلى حملها على كيفية التمسك، لكن التركيب اليوناني يسمح بالتعلّق بـ«الكلمات»، لذلك حُفظ البديل في الحاشية.
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الأمانة أو الإخلاص أو الثقة
  rationale: «الإيمان» هو المعنى الأرجح في هذا السياق، مع بقاء المجال الدلالي للكلمة أوسع، ولذلك ذُكر البديل في الحاشية.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية لقب مفهوم وراسخ، لا مجرد اسم، وينقل الدلالة المسيانية دون إدخال صيغة أقل شيوعًا في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «تمسّك» لقوة الأمر، و«نموذج» لبساطتها، مع إبقاء «الكلمات» قربًا من النص اليوناني. وُضعت علامتا الحاشية في ختام الآية لأنهما تتصلان بالعبارة الأخيرة وببنيتها النحوية.
