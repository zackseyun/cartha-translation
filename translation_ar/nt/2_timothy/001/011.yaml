  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: ar
  text: الذي عُيّنتُ أنا لأجله مناديًا ورسولًا ومعلّمًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «واعظًا». يدل اللفظ اليوناني على منادٍ رسمي أو مُعلِن على الملأ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: الذي ... له
  rationale: يحفظ الإحالة إلى الإنجيل المذكور في السياق السابق، ويعبّر في عربية طبيعية عن الغرض أو المجال الذي عُيّن بولس لأجله.
- source_word: ἐτέθην
  choice: عُيّنتُ
  rationale: المبني للمجهول من τίθημι يدل هنا على التعيين لمهام محددة، لا على الوضع المكاني.
- source_word: ἐγὼ
  choice: تاء المتكلم في «عُيّنتُ»
  rationale: العربية تعبّر عن المتكلم في صيغة الفعل نفسها؛ ولا تستلزم دلالة الضمير اليوناني البارز إضافة «أنا» التي قد تبدو ثقيلة هنا.
- source_word: κῆρυξ
  choice: مناديًا
  rationale: ينقل معنى المنادي الرسمي الذي يعلن الرسالة على الملأ، ويتجنب حصر اللفظ في مفهوم كنسي متأخر قد يوحي به «واعظ».
- source_word: ἀπόστολος
  choice: رسولًا
  rationale: هو المقابل العربي الراسخ للقب الرسولي في استعمال بولس عن نفسه، ويحفظ معنى المبعوث المفوّض.
- source_word: διδάσκαλος
  choice: معلّمًا
  rationale: المعنى المباشر والطبيعي للفظ، ويلائم تسلسل المهام الثلاث.
theological_decisions:
- issue: هل يُترجم κῆρυξ بلفظ «منادٍ» أم «واعظ»؟
  choice: منادٍ
  alternative: واعظ
  rationale: «منادٍ» يبرز معنى المكلَّف بالإعلان العلني الذي يحمله اللفظ اليوناني، من غير أن يضيّقه إلى وظيفة الوعظ بمفهومها الكنسي اللاحق.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. حافظت الصياغة على إيجاز الأصل وتسلسل الأدوار الثلاثة، مع تقديم الصلة «الذي» لأن الآية تواصل الجملة السابقة.
