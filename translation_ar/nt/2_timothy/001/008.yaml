source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: ar
  text: فلا تخجل إذن من الشهادة عن ربنا[a]، ولا مني أنا سجينه، بل شارك في احتمال المشقة لأجل الإنجيل[b]، بحسب قدرة الله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شهادة ربنا». فقد تدل الإضافة في اليونانية على الشهادة الصادرة عن الرب، لكن الأرجح هنا أنها الشهادة عنه.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «شارك في المعاناة لأجل الإنجيل». يتضمن الفعل اليوناني معنى الاشتراك مع آخرين في المكابدة، وعلاقة «الإنجيل» بالفعل موجزة في الأصل.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بقدرة الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: فلا ... إذن
  rationale: تنقل οὖν بوصفها استنتاجًا مما سبق، وتحافظ «لا» على قوة النهي في عربية طبيعية.
- source_word: ἐπαισχυνθῇς
  choice: تخجل
  rationale: يفيد الفعل الشعور بالخزي أو التراجع بسببه، و«تخجل» واضحة وطبيعية في السياق.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: الشهادة عن ربنا
  rationale: تُفهم الإضافة على الأرجح فهمًا مفعوليًا، أي الشهادة التي موضوعها الرب، مع إثبات احتمال القراءة الأخرى في الحاشية.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: ولا مني، أنا سجينه
  rationale: تحافظ العبارة على كون بولس موضوعًا ثانيًا للخجل، وعلى نسبة سجنه إلى الرب دون حصر دلالة الإضافة في سبب واحد.
- source_word: συγκακοπάθησον
  choice: شارك في احتمال المشقة
  rationale: تنقل دلالة المشاركة التي تحملها السابقة συν-، إلى جانب معنى مكابدة الألم أو المشقة.
- source_word: τῷ εὐαγγελίῳ
  choice: من أجل الإنجيل
  rationale: الداتيف اليوناني مضغوط الدلالة؛ وهذه الصياغة عربية طبيعية تعبّر عن الارتباط بالإنجيل بوصفه سبب المعاناة، مع ذكر البديل الأقرب إلى البنية في الحاشية.
- source_word: κατὰ δύναμιν θεοῦ
  choice: بحسب قدرة الله
  rationale: تحافظ «بحسب» على دلالة κατά من جهة المعيار أو المقدار أو التوافق، من غير حسمها في معنى الوسيلة وحده.
theological_decisions:
- issue: علاقة «الشهادة» بـ«ربنا»
  choice: الشهادة عن ربنا
  alternative: شهادة ربنا
  rationale: السياق يرجّح الإضافة المفعولية، أي الشهادة المتعلقة بالرب، لكن التركيب اليوناني يحتمل أيضًا أن تكون الشهادة صادرة عنه؛ لذلك حُفظ البديل في حاشية.
- issue: دلالة «سجينه»
  choice: الإبقاء على علاقة الإضافة إلى الرب
  alternative: السجين من أجله
  rationale: «سجينه» تحفظ اتساع αὐτοῦ من جهة الانتماء والارتباط بالرب، ولا تقصرها على معنى السببية فقط.
- issue: دلالة κατὰ δύναμιν θεοῦ
  choice: بحسب قدرة الله
  alternative: بقدرة الله
  rationale: الصياغة المختارة تبقي مفتوحًا كون القدرة معيارًا أو مقدارًا أو أساسًا ممكّنًا، بدل حسمها بوصفها أداة فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «المشقة» لتجنب حصر اللفظ في نوع بعينه من الألم، ووُزعت العلامات [a] و[b] و[c] مباشرة بعد العبارات التي تشرحها الحواشي.
