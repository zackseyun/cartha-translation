  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: ar
  text: مشتاقًا إلى رؤيتك[a]، ومتذكِّرًا دموعك، لكي أمتلئ فرحًا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متلهفًا إلى رؤيتك».'
    reason: بديل معجمي يحفظ شدة ἐπιποθῶν بدرجة أوضح.
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: مشتاقًا
  rationale: اسم فاعل حالي يفيد رغبة شخصية قوية؛ و«مشتاقًا» تعبير عربي طبيعي يحفظ القوة العاطفية.
- source_word: σε ἰδεῖν
  choice: إلى رؤيتك
  rationale: المصدر متمم لمعنى الاشتياق، و«إلى رؤيتك» صياغة عربية مباشرة وسلسة.
- source_word: μεμνημένος
  choice: ومتذكِّرًا
  rationale: اسم فاعل تام يدل على بقاء الذكرى حاضرة؛ وتحافظ الصياغة على موازاة اسم الفاعل السابق.
- source_word: σου τῶν δακρύων
  choice: دموعك
  rationale: الإضافة تشير مباشرة إلى دموع تيموثاوس، من غير تفسير زائد لملابساتها.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ علاقة الغاية، مع بقاء احتمال تداخل الغاية والنتيجة في السياق.
- source_word: χαρᾶς
  choice: فرحًا
  rationale: 'المضاف إليه مع فعل الامتلاء يُعبَّر عنه عربيًا بتمييز منصوب على نحو طبيعي: «أمتلئ فرحًا».'
- source_word: πληρωθῶ
  choice: أمتلئ
  rationale: صيغة المبني للمجهول في اليونانية تُنقل طبيعيًا بالفعل العربي المطاوع «أمتلئ»، مع حفظ صيغة الغاية بعد «لكي».
