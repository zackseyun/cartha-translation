  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: ar
  text: لِهٰذَا السَّبَبِ أُذَكِّرُكَ أَنْ تُؤَجِّجَ مِنْ جَدِيدٍ مَوْهِبَةَ اللهِ الَّتِي فِيكَ، بِوَضْعِ يَدَيَّ عَلَيْكَ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تُضرمها من جديد». فالفعل اليوناني يصوّر إعادة تحريك النار حتى تشتعل بقوة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: لِهٰذَا السَّبَبِ
  rationale: ينقل العبارة السببية والرابط المنطقي بوضوح وبصياغة عربية طبيعية.
- source_word: ἀναμιμνῄσκω
  choice: أُذَكِّرُكَ
  rationale: يعكس المضارع الخبري وبنية الفعل مع المفعول به والمصدر التالي له.
- source_word: σε ἀναζωπυρεῖν
  choice: أَنْ تُضْرِمَ مِنْ جَدِيدٍ
  rationale: يحفظ صورة إحياء النار وإعادتها إلى الاشتعال، مع تعبير عربي واضح؛ ولا يفترض أن الموهبة كانت قد انطفأت تمامًا.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: مَوْهِبَةَ اللهِ
  rationale: ترجمة موجزة وطبيعية لـχάρισμα، وتحافظ على كونها عطية من الله من غير إضافة تخصيص مثل «الموهبة الروحية».
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: الَّتِي فِيكَ
  rationale: يحافظ على دلالة الجملة الموصولة بأن الموهبة موجودة في تيموثاوس.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: بِوَضْعِ يَدَيَّ عَلَيْكَ
  rationale: ينقل اصطلاح وضع اليدين ودلالة διά مع المضاف إليه على الوسيلة، ويصرّح بـ«عليك» بما يلائم الاستعمال العربي من غير تغيير المقصود.
theological_decisions:
- issue: صلة موهبة الله بفعل بولس في وضع اليدين
  choice: بِوَضْعِ يَدَيَّ عَلَيْكَ
  alternative: مِنْ خِلَالِ وَضْعِ يَدَيَّ عَلَيْكَ
  rationale: تحفظ الصياغة دلالة الوسيلة أو التوسّط في النص، من غير أن تحسم طبيعة هذا الفعل ضمن تصور أسراري أو كنسي متطور.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم «تُضْرِمَ مِنْ جَدِيدٍ» لحفظ الصورة المجازية اليونانية، و«موهبة الله» لتجنب الإفراط في التفسير. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
