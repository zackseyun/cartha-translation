    rationale: «أفضل» هنا لا تعمل على نحو سليم مع «تعرف» ثم «مقدار ما». كما أن βέλτιον σὺ γινώσκεις تعبير مقارن يفيد أن المخاطَب أدرى بالأمر، لا أنه «يعرف أفضل مقدارًا». التعديل إلى «وأنت أدرى بقدر ما...» يحل الخلل ويحفظ المقارنة.
