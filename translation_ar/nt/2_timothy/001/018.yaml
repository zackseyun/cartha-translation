  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: ar
  text: ليمنحه الرب أن يجد رحمة من عند الرب في ذلك اليوم[a][b]—وأنت أدرى بقدر ما قدّمه من خدمة في أفسس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لدى الرب»؛ فعبارة «من عند الرب» تفهم παρά κυρίου على أنها تدل على المصدر، بينما يفهمها بعضهم على أنها تشدد على الحضور أمام الرب.'
    reason: lexical_alternative
  - marker: b
    text: «ذلك اليوم» تعبير شائع في العهد الجديد عن اليوم الآتي للدينونة الإلهية أو التبرئة.
    reason: cross_reference
  - marker: c
    text: 'أو: «كل ما قام به من خدمة». فالعبارة اليونانية تلخّص مدى خدمته في أفسس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος
  choice: ليمنحه الرب أن يجد رحمة
  rationale: صيغة التمني في δῴη تعبّر عن دعاء أو رجاء، فحافظت العربية على ذلك بلام الدعاء. كما أُبقي التعبير الكتابي «يجد رحمة» دون تحويله تفسيريًا إلى «ينال الرحمة».
- source_word: παρὰ κυρίου
  choice: من عند الرب
  rationale: تفيد παρά مع المضاف إليه المصدر على نحو طبيعي هنا، و«من عند الرب» عربية واضحة تحفظ تكرار «الرب» الوارد في اليونانية. ويُذكر احتمال دلالة الحضور في الحاشية.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: نقل مباشر وطبيعي للتعبير الزمني، مع إبقاء الإشارة الأخروية الضمنية دون شرحها داخل المتن.
- source_word: ὅσα ... διηκόνησεν
  choice: مقدار ما قدّمه من خدمة
  rationale: يلخّص ὅσα مدى خدمة أنيسيفورس أو كثرتها، بينما تعبّر صياغة «قدّمه من خدمة» عن διακονέω بلغة عربية طبيعية من غير قصرها على منصب ديني رسمي.
- source_word: βέλτιον σὺ γινώσκεις
  choice: وأنت تعرف أفضل
  rationale: تحفظ «أفضل» القوة المقارنة لـ βέλτιον من غير إضافة طرف للمقارنة لا يصرّح به النص.
theological_decisions:
- issue: مرجع لفظ «الرب» المكرر (ὁ κύριος ... παρὰ κυρίου)
  choice: إبقاء اللفظين «الرب» من غير تعيين مختلف لمرجع كل منهما
  alternative: اعتبار الأول المسيح والثاني الآب، أو اعتبار كليهما إشارة إلى المسيح
  rationale: لا تميّز اليونانية صراحة بين المرجعين؛ لذلك يحفظ النص العربي التكرار والغموض اللاهوتي الأصيل.
- issue: الدلالة الأخروية لعبارة «ذلك اليوم»
  choice: إبقاء العبارة «ذلك اليوم» بلا توسيع تفسيري
  alternative: «يوم الدينونة» أو «اليوم الأخير»
  rationale: السياق البولسي يرجّح اليوم الآتي للدينونة أو التبرئة الإلهية، لكن النص نفسه يستعمل العبارة الاصطلاحية الموجزة فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت لام الدعاء لنقل صيغة التمني، وأُبقي تكرار «الرب» وعبارة «ذلك اليوم» كما في المصدر. اختير «قدّمه من خدمة» بدل «خدم» لتجنب احتمال فهم أفسس نفسها مفعولًا للخدمة، وبدل «قام بخدمات» لما قد توحي به من أعمال معدودة منفصلة.
