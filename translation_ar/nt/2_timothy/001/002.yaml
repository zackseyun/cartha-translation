  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ar
  text: 'إلى تيموثاوس، الابن الحبيب: نعمة ورحمة وسلام من الله الآب والمسيح يسوع ربنا.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: الحبيب
  rationale: تنقل معنى المحبة والتقدير في خطاب بولس، وتلائم وصف العلاقة الوثيقة من غير إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: τέκνῳ
  choice: الولد
  rationale: اللفظة اليونانية عامة بمعنى «ولد/طفل» في علاقة بنوية، ولا تختص في ذاتها بلفظ «ابن». واختيار «الولد» يحفظ الاستعارة البنوية من غير إضافة «ابني».
- source_word: χάρις
  choice: نعمة
  rationale: المقابل العربي الدقيق والمألوف في تحيات بولس.
- source_word: ἔλεος
  choice: رحمة
  rationale: يحفظ العنصر المستقل بين النعمة والسلام كما يرد في النص اليوناني.
- source_word: εἰρήνη
  choice: سلام
  rationale: ينقل المعنى العلاقاتي والعهدي للفظة بوضوح.
- source_word: θεοῦ πατρὸς
  choice: الله الآب
  rationale: النص يقول حرفيًا «الله الآب» ولا يشتمل على ضمير «أبينا».
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» ترجمة عربية مستقرة للقب Χριστός وتحفظ دلالته اللقبية، مع إبقاء ترتيب الاسمين كما في اليونانية.
- source_word: κυρίου ἡμῶν
  choice: ربنا
  rationale: صياغة عربية طبيعية ودقيقة تحفظ معنى السيادة وضمير المتكلمين الجمع.
theological_decisions:
- issue: دلالة Χριστός في العبارة Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: اختير «المسيح يسوع» للمحافظة على ترتيب النص اليوناني وعلى كون «المسيح» لقبًا ذا معنى، من غير تحويله إلى مجرد اسم أو تبديل ترتيب العبارة.
- issue: طبيعة العلاقة في τέκνῳ
  choice: الولد الحبيب
  alternative: الابن الحبيب
  rationale: يحفظ «الولد» السعة المعجمية للفظة τέκνον، التي تصف علاقة بنوية أو ذرية روحية ولا تستلزم اللفظ الأخص «ابن»، مع أن هوية تيموثاوس الذكورية معلومة من السياق.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ووقورة، تحافظ على بنية التحية الرسولية وعلى التوازي الثلاثي «نعمة ورحمة وسلام». لم تُضف «ابني» لأن ضمير الملكية غير مصرح به في الأصل. ولا حاجة إلى حاشية تقابل بين Messiah وChrist، إذ إن العربية تستعمل «المسيح» لترجمة اللقب اليوناني نفسه ترجمةً دلالية مستقرة.
