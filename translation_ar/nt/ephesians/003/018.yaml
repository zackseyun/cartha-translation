    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية أو النتيجة المتصلة بالصلاة السابقة، و«لكي» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: ἐξισχύσητε
  choice: تقدروا
  rationale: يدل الفعل على امتلاك القوة أو الكفاية اللازمة؛ و«تقدروا» تنقل معنى التمكن من الفعل التالي من غير إثقال العبارة.
- source_word: καταλαβέσθαι
  choice: أن تدركوا
  rationale: يفيد هنا الإحاطة الذهنية أو الفهم العميق، و«تدركوا» لفظ عربي واضح ورصين يحافظ على قوة المعنى.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: مع جميع القديسين
  rationale: تحافظ العبارة على معنى المشاركة الجماعية وعلى المصطلح البولسي المألوف للدلالة على المؤمنين.
- source_word: τί
  choice: ما هو
  rationale: يقدّم أبعاد الشيء المراد إدراكه من دون أن يضيف مرجعًا لم يصرّح به النص اليوناني.
- source_word: τὸ πλάτος
  choice: العرض
  rationale: هو المقابل العربي المباشر والطبيعي للمصطلح الدال على البعد العرضي.
- source_word: μῆκος
  choice: الطول
  rationale: المقابل المباشر للمصطلح البُعدي اليوناني.
- source_word: ὕψος
  choice: الارتفاع
  rationale: ينقل معنى البعد الرأسي بوضوح، ويتناسق أسلوبيًا مع سائر أسماء الأبعاد.
- source_word: βάθος
  choice: العمق
  rationale: المقابل المباشر والطبيعي للمصطلح اليوناني.
theological_decisions:
- issue: مرجع الأبعاد الأربعة
  choice: إبقاء ما تصفه الأبعاد غير مذكور صراحة في المتن
  alternative: إضافة «محبة المسيح» أو «تدبير الله الخلاصي» بوصفه مرجع الأبعاد
  rationale: النص اليوناني في هذه الآية لا يصرّح بمرجع العرض والطول والارتفاع والعمق. وإضافة مرجع بعينه تحسم احتمالًا تفسيريًا قد يستكمله السياق في الآية التالية، لذلك حُفظ الانفتاح المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. روعي الإيقاع التراكمي للأبعاد الأربعة، مع تجنب إضافة مفعول أو مرجع لا يذكره النص صراحة.
