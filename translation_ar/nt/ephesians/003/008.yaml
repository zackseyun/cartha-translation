  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: ar
  text: 'لي أنا، الأقلّ من جميع القديسين[a]، أُعطيت هذه النعمة: أن أبشّر غير اليهود[b] بغنى المسيح الذي لا يُستقصى.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا، بصياغة يونانية غير مألوفة للمبالغة: «أقلّ من أصغر جميع القديسين». صاغ بولس العبارة لإظهار ضآلته الشديدة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الأمم». والمقصود في هذا السياق الشعوب غير اليهودية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: الذي هو دون أصغر
  rationale: صيغة يونانية بلاغية نادرة، مبنية للمبالغة على معنى «الأصغر»، وتعبّر عن تواضع بولس الشديد. يحافظ هذا التعبير على قوتها غير المألوفة دون تسويتها إلى «أصغر» فقط.
- source_word: ἁγίων
  choice: القديسين
  rationale: تدل في الاستعمال البولسي على المؤمنين بوصفهم شعبًا مكرسًا لله، و«القديسين» المقابل العربي الموجز والمألوف.
- source_word: χάρις
  choice: النعمة
  rationale: تشير هنا إلى عطية الله المجانية التي تجلت في التكليف الممنوح لبولس؛ و«النعمة» تحفظ المعنى والاستمرارية الاصطلاحية.
- source_word: ἔθνεσιν
  choice: غير اليهود
  rationale: مع أن اللفظ يمكن أن يعني «الأمم»، فإن السياق يتناول الشعوب غير اليهودية في مقابل إسرائيل، و«غير اليهود» أوضح للقارئ المعاصر.
- source_word: εὐαγγελίσασθαι
  choice: أن أبشّر
  rationale: الفعل يعني إعلان الخبر السار؛ و«أبشّر» طبيعي وموجز ويحمل هذا المعنى في العربية.
- source_word: ἀνεξιχνίαστον
  choice: الذي لا يُستقصى
  rationale: يدل على ما يتعذر تتبع مداه أو الإحاطة به كاملًا، ويحفظ هذا التعبير صورة عدم إمكان استقصائه.
- source_word: πλοῦτος
  choice: غنى
  rationale: الاسم مفرد في اليونانية ويصف مجازيًا وفرة ما في المسيح؛ لذلك اختير «غنى» بدل تحويله إلى جمع.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: Χριστός لقب يعني الممسوح، و«المسيح» هو المقابل العربي الطبيعي الذي يحفظ وظيفته اللقبية.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: كريستوس
  rationale: ترجمة اللقب إلى «المسيح» تنقل معناه ووظيفته في السياق، من غير جعله اسمًا منقولًا صوتيًا أو تحميله تفسيرًا مذهبيًا خاصًا.
- issue: المقصود بـ ἔθνεσιν
  choice: غير اليهود
  alternative: الأمم
  rationale: السياق في أفسس يركّز على إدخال غير اليهود في الوعد مع اليهود. أُثبت المعنى الأرجح في المتن، مع حفظ المقابل الحرفي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت المبالغة المقصودة في وصف بولس لنفسه، واستُعمل «أبشّر» لإبراز معنى إعلان الخبر السار. وُضع تفسير ἔθνεσιν الأرجح في المتن مع توثيق البديل الحرفي في الحاشية.
