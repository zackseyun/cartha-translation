  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: ar
  text: وأن تعرفوا محبة المسيح[a] التي تفوق المعرفة، لكي تمتلئوا إلى ملء الله كله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يعني تركيب «محبة المسيح» محبة المسيح لنا، أو المحبة الموجَّهة إلى المسيح؛ والسياق يرجّح المعنى الأول.
    reason: preserved_ambiguity
  - marker: b
    text: 'أو: «لكي تمتلئوا بملء الله كله». يقول اليوناني حرفيًا: «إلى ملء الله كله»، وهي عبارة مكثفة قد تشدد على التقدّم نحو ملء الله بوصفه الغاية أو المقياس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: تعرفوا
  rationale: ينقل المعنى المباشر للفعل، مع إبقاء إمكان أن تشمل المعرفة الاختبار الشخصي إلى جانب الإدراك الذهني، ويحافظ على الصلة اللفظية مع «المعرفة» لاحقًا.
- source_word: τε
  choice: و
  rationale: أداة ربط خفيفة تصل هذا الطلب بما سبقه في الصلاة، والواو هي المقابل العربي الطبيعي من غير مبالغة في إبرازها.
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην
  choice: المحبة التي تفوق المعرفة
  rationale: يحافظ على مفارقة معرفة محبة تتجاوز المعرفة، ويصوغ اسم الفاعل اليوناني في جملة صلة عربية واضحة وطبيعية.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو اللقب العربي الراسخ المقابل لـΧριστός، وتركيب «محبة المسيح» يبقي علاقة المضاف إليه غير محسومة كما في اليونانية.
- source_word: ἵνα
  choice: لكي
  rationale: يعبّر بوضوح عن دلالة الغاية أو النتيجة المقصودة في السياق.
- source_word: πληρωθῆτε
  choice: تمتلئوا
  rationale: ينقل المبني للمجهول وصيغة المخاطب الجمع، وهو التعبير العربي الأوضح في هذا السياق.
- source_word: εἰς
  choice: إلى
  rationale: يحافظ على الاتجاه نحو غاية أو مقياس، بدل تسوية العبارة إلى معنى «بـ» وحده.
- source_word: πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: ملء الله كله
  rationale: صياغة عربية مفهومة تحفظ الشمول والإضافة إلى الله من غير تفسير زائد لطبيعة هذا الملء.
theological_decisions:
- issue: دلالة «محبة المسيح»
  choice: 'الإبقاء على تركيب الإضافة: «محبة المسيح»'
  alternative: محبة المسيح لنا؛ أو محبتنا للمسيح
  rationale: التركيب اليوناني لا يصرّح وحده باتجاه المحبة، مع أن السياق يرجّح محبة المسيح للمؤمنين؛ لذلك تُحفظ المرونة في المتن ويُوضَّح الأمر في الحاشية.
- issue: دلالة εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: «إلى ملء الله كله»
  alternative: «بملء الله كله»
  rationale: يحافظ اختيار «إلى» على القوة الاتجاهية والغاية في εἰς وعلى كثافة التعبير اللاهوتي، من غير اختزاله إلى مضمون الامتلاء فحسب أو الإيحاء بالمساواة مع الله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت المفارقة بين «تعرفوا» و«تفوق المعرفة»، كما حُفظت العبارة الاتجاهية المكثفة «إلى ملء الله كله» مع شرح البديل الأكثر سلاسة في الحاشية.
