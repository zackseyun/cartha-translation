source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: ar
  text: الذي صرتُ خادمًا له، وفقًا لعطية نعمة الله المعطاة لي، بحسب فاعلية قدرته—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جُعلتُ خادمًا له».'
    reason: بديل لغوي يحفظ احتمال الإيحاء المبني للمجهول في ἐγενήθην.
lexical_decisions:
- source_word: οὗ
  choice: الذي ... له
  rationale: الضمير الموصول المفرد المحايد يعود في السياق إلى «الإنجيل»، وتعبير «الذي ... له» ينقل علاقة الخدمة به بصورة عربية طبيعية.
- source_word: ἐγενήθην
  choice: صرتُ
  rationale: ينقل المعنى الشائع للفعل، أي الدخول في حال أو دور جديد، من غير أن يحسم ما إذا كانت الصيغة تحمل إيحاءً مبنيًا للمجهول.
- source_word: διάκονος
  choice: خادمًا
  rationale: يدل هنا على من يقوم بالخدمة، ولا يلزم منه منصب كنسي رسمي؛ لذلك تجنبت «شمّاسًا» التي قد تستورد دلالة مؤسسية لاحقة.
- source_word: κατὰ τὴν δωρεὰν
  choice: وفقًا لعطية
  rationale: تحفظ دلالة κατά على الموافقة أو المقياس، مع صياغة عربية واضحة.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: نعمة الله
  rationale: تحافظ على سلسلة الإضافة وعلى كون العطية مرتبطة بنعمة الله، من غير فرض تفسير أضيق للعلاقة بين «العطية» و«النعمة».
- source_word: τῆς δοθείσης μοι
  choice: التي أُعطيت لي
  rationale: الصيغة المؤنثة في اليونانية تصف «النعمة»، فحُفظ هذا الارتباط في العربية، مع إبقاء الواهب غير مصرّح به كما في المبني للمجهول.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: بحسب عمل
  rationale: «عمل» تعبر بوضوح عن القوة وهي فاعلة ومؤثرة، وتحفظ تكرار بنية κατά من غير تعبير تقني ثقيل.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: قدرته
  rationale: «القدرة» المقابل العربي الطبيعي لدلالة القوة الفاعلة هنا، والضمير يعود إلى الله بحسب السياق.
theological_decisions:
- issue: طبيعة دور بولس بوصفه διάκονος
  choice: خادمًا
  alternative: خادمًا في الخدمة / شمّاسًا
  rationale: السياق يتحدث عن خدمة بولس للإنجيل، ولا يصرح بمنصب كنسي رسمي؛ لذا تحافظ «خادمًا» على المعنى الوظيفي من غير إضافة بنية كنسية لاحقة.
- issue: دلالة الفاعل في ἐγενήθην
  choice: صرتُ
  alternative: جُعلتُ
  rationale: «صرتُ» تحافظ على الدلالة المباشرة للفعل وعلى قدر من الغموض في الصيغة، بينما يوضح باقي العدد أن نعمة الله وقدرته هما مصدر هذه الخدمة. وأُثبت البديل المحتمل في الحاشية.
- issue: متعلَّق العبارة τῆς δοθείσης μοι
  choice: التي أُعطيت لي، وصفًا لنعمة الله
  alternative: العطية التي أُعطيت لي
  rationale: المطابقة النحوية في اليونانية تربط اسم المفعول المؤنث بـ«النعمة» لا بـ«العطية»، ولذلك عكست الترجمة هذا التركيب بدل تسويته دلاليًا.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. حُفظ توازي عبارتي κατά بصيغتين عربيتين متقاربتين («وفقًا» و«بحسب») لتجنب الثقل الأسلوبي، وحُفظت الشرطة الختامية لاتصال الجملة بما يليها.
