base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: ar
  text: بمقتضى قصد الدهور[a] الذي حققه في[b] المسيح[c] يسوع ربنا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القصد الأزلي». والعبارة اليونانية حرفيًا: «قصد الدهور».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بالمسيح يسوع» أو «بواسطة المسيح يسوع». حرف الجر اليوناني هو «في»، وقد يُفهم هنا أيضًا بمعنى الوسيلة.'
    reason: alternative_reading
  - marker: c
    text: 'اليونانية: «خريستوس»، أي «المسيح»؛ وقد تُرجم هنا بمعناه لأنه لقب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: بمقتضى
  rationale: تفيد κατά مع المفعول معنى الموافقة والاتساق؛ و«بمقتضى» عربية فصيحة وطبيعية في هذا السياق.
- source_word: πρόθεσιν
  choice: قصد
  rationale: تدل πρόθεσις على نية إلهية متعمدة أو تدبير مقصود، و«قصد» يحفظ دلالة العزم من غير توسع تفسيري.
- source_word: τῶν αἰώνων
  choice: الدهور
  rationale: يحفظ الجمع الإضافي اليوناني حرفيًا («قصد الدهور») بدل اختزاله في الصفة التفسيرية «الأزلي».
- source_word: ἣν
  choice: الذي
  rationale: اسم موصول يعود على «قصد»، وهو مذكر في العربية.
- source_word: ἐποίησεν
  choice: حققه
  rationale: مع «القصد» يفيد الفعل هنا إخراج القصد إلى حيز الإنجاز؛ و«حققه» أوضح من النقل الحرفي «صنعه».
- source_word: ἐν
  choice: في
  rationale: يحفظ المعنى المباشر لحرف الجر اليوناني، مع إبقاء احتمال الدلالة الوسيلية مفتوحًا في الحاشية.
- source_word: Χριστῷ
  choice: المسيح
  rationale: اللفظ لقب ذو دلالة مسيانية، ولذلك نُقل بمعناه «المسيح» لا بوصفه اسمًا مجردًا.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: النقل العربي المعياري للاسم.
- source_word: κυρίῳ
  choice: رب
  rationale: المقابل العربي المألوف للقب κύριος، ويحفظ دلالته في العهد الجديد.
- source_word: ἡμῶν
  choice: نا
  rationale: ضمير المتكلمين المضاف إلى «رب» في عبارة «ربنا».
theological_decisions:
- issue: دلالة τῶν αἰώνων في πρόθεσιν τῶν αἰώνων
  choice: قصد الدهور
  alternative: القصد الأزلي
  rationale: النص اليوناني يقول حرفيًا «قصد الدهور». يحفظ المتن هذه الصورة ويورد الصياغة التفسيرية الطبيعية في الحاشية، فلا يحسم مدى الدلالة الزمنية بصمت.
- issue: دلالة ἐν في ἐν τῷ Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  alternative: بالمسيح يسوع / بواسطة المسيح يسوع
  rationale: قد يحمل ἐν دلالة الوسيلة، لكن «في» يحافظ على الصياغة المباشرة وعلى التوتر النحوي واللاهوتي في الأصل.
- issue: نقل Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: يعمل اللفظ هنا بوصفه لقبًا، و«المسيح» ينقل معناه وخلفيته اليهودية بوضوح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت عبارة «قصد الدهور» للمحافظة على صورة الأصل، مع بيان الصياغة الأكثر سلاسة «القصد الأزلي» في الحاشية. وُضعت جميع علامات الحواشي في المتن بترتيبها.
