lexical_decisions:
- source_word: Τούτου χάριν
  choice: لهذا السبب
  rationale: تعبير عربي طبيعي يحفظ صلة التعليل بالسياق السابق من غير زيادة تفسيرية.
- source_word: κάμπτω
  choice: أحني
  rationale: يحفظ المعنى الحرفي للفعل وصورة ثني الركبتين، بخلاف «أجثو» التي تختزل الفعل ومفعوله في تعبير واحد.
- source_word: τὰ γόνατά μου
  choice: ركبتيَّ
  rationale: يحفظ ذكر عضو الجسد صراحة، مع استعمال صيغة المثنى الطبيعية في العربية.
- source_word: πρὸς
  choice: أمام
  rationale: في سياق الصلاة، تعبّر «أمام» طبيعيًا عن التوجّه والحضور لدى من تُرفع إليه الصلاة، مع أن الأصل يمكن أن يدل حرفيًا على الاتجاه نحوه.
- source_word: πατέρα
  choice: الآب
  rationale: السياق يدل على الله الذي يتوجه إليه بولس بالصلاة، و«الآب» هو اللقب العربي الواضح والمألوف لهذا الاستعمال.
theological_decisions:
- issue: هل تُترجم πατέρα بوصفها لقبًا إلهيًا؟
  choice: الآب
  alternative: الأب
  rationale: بولس يصف صلاة موجهة إلى الله، والآية التالية توسّع لغة الأبوة؛ لذلك يحفظ «الآب» المرجع الإلهي بوضوح من غير إضافة مضمون غير موجود.
- issue: دلالة πρὸς في وصف الصلاة
  choice: أمام
  alternative: إلى
  rationale: «أمام الآب» تعبير عربي فصيح عن الخضوع في الصلاة، لكنه لا يقصد حصر معنى الحرف في مجرد المكان؛ والبديل «إلى الآب» أقرب شكليًا إلى اتجاه الأصل لكنه أقل سلاسة بعد «أحني ركبتيَّ».
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت صورة حني الركبتين، واستُعمل المثنى لأن المقصود ركبتا المتكلم. تنتهي العبارة بفاصلة لأنها تتصل نحويًا بما يليها في الآية التالية.
