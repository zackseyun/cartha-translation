lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تدل على مضمون طلب بولس وغايته، وتحافظ على قوة الربط الغائي في السياق.
- source_word: δῷ
  choice: يمنحكم
  rationale: تلائم صيغة الدعاء والطلب أكثر من «يعطيكم»، من غير إضافة معنى إلى الفعل اليوناني.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: بحسب غنى مجده
  rationale: تنقل κατά بوصفها معيارًا أو مقياسًا، وتحافظ على الثقل اللاهوتي لكل من «الغنى» و«المجد».
- source_word: δυνάμει κραταιωθῆναι
  choice: أن تتقوَّوا بقوة
  rationale: تحافظ على اقتران معنى القوة بالفعل ومعمول الوسيلة، مع صياغة عربية واضحة؛ وصيغة «تتقوَّوا» تؤدي معنى نيل القوة دون جعل المؤمنين مصدرها.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: بروحه
  rationale: تنقل معنى الوسيلة أو الفاعلية في διά مع المضاف إليه، و«روحه» تشير في السياق إلى روح الله.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: في الإنسان الباطن
  rationale: تحافظ على صورة «الإنسان الباطن» بصيغة المفرد التمثيلية، وتعبّر «في» طبيعيًا عن مجال التقوية أو مقصدها.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: روح الله («روحه»)
  alternative: روح أو تأثير إلهي بمعنى عام غير شخصي
  rationale: السياق يتحدث عن فاعلية الله في المؤمنين، واستعمال بولس يرجّح أن المقصود روح الله؛ ولا تضيف العربية هنا لقبًا غير وارد في النص.
- issue: دلالة ἔσω ἄνθρωπον
  choice: الإنسان الباطن
  alternative: الكيان الداخلي أو باطن الإنسان
  rationale: يحفظ الاختيار صورة التعبير اليوناني والمفرد التمثيلي، مع إيضاح المقصود الشامل في الحاشية بدل حصره في الذكور.
- issue: دلالة εἰς مع «الإنسان الباطن»
  choice: في الإنسان الباطن
  alternative: إلى الإنسان الباطن / من جهة الإنسان الباطن
  rationale: قد تشير العبارة إلى مجال التقوية أو مقصدها؛ «في» عربية طبيعية وتحفظ هذا القدر من الاتساع دون حسم زائد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. أُبقيت صورة «الإنسان الباطن» لصلتها المباشرة بالنص اليوناني، ووُضعت علامة الحاشية عند العبارة التي تشرحها.
