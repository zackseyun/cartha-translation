  text: لهذا السبب، أنا بولس، سجين المسيح يسوع لأجلكم، أيها الأمم—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: لهذا السبب
  rationale: تعبير استدلالي يعود إلى الكلام السابق، وهذه صياغة عربية طبيعية تحفظ قوة الربط.
- source_word: ἐγὼ Παῦλος
  choice: أنا بولس
  rationale: إثبات الضمير في اليونانية يبرز المتكلم؛ وأُبقي في العربية للمحافظة على هذا التوكيد.
- source_word: ὁ δέσμιος
  choice: سجين
  rationale: ينقل معنى الشخص المحتجز مباشرة، من غير إضافة صورة القيود غير المصرح بها في اللفظ.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: المسيح هو المقابل العربي الراسخ للقب Χριστός، وترتيب الكلمتين يتبع المصدر.
- source_word: ὑπὲρ ὑμῶν
  choice: لأجلكم
  rationale: يحفظ المعنى النفعي أو السببي في السياق بصياغة عربية موجزة وطبيعية.
- source_word: τῶν ἐθνῶν
  choice: أنتم الأمم
  rationale: العبارة بدل يحدد المخاطبين بأنهم من غير اليهود؛ و«الأمم» هو التعبير الكتابي العربي الواضح في هذا السياق.
theological_decisions:
- issue: دلالة إضافة «سجين» إلى «المسيح يسوع»
  choice: سجين المسيح يسوع
  alternative: السجين من أجل المسيح يسوع
  rationale: أُبقيت الإضافة كما في اليونانية لأنها قد تفيد الانتماء إليه أو السجن في خدمته، ولا ينبغي حصرها في علاقة سببية واحدة.
- issue: دلالة ὑπὲρ مع المخاطبين
  choice: لأجلكم
  alternative: نيابةً عنكم
  rationale: السياق يرجح معنى المنفعة أو أن السجن كان بسبب خدمة الأمم، أما «نيابةً عنكم» فقد توحي بتمثيل بدلي أضيق من دلالة الأصل.
