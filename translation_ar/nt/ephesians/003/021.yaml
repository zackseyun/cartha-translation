source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: ar
  text: له المجد في الكنيسة وفي المسيح يسوع عبر جميع الأجيال، إلى أبد الآبدين. آمين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: له المجد
  rationale: العبارة اليونانية اسمية بلا فعل، والصياغة العربية «له المجد» تنقل إسناد المجد إليه بوضوح وتحافظ على الإيجاز والنسق التسبيحي.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: في الكنيسة
  rationale: «الكنيسة» هي المقابل العربي الراسخ لـἐκκλησία في هذا السياق، وحُفظ حرف الجر «في» مراعاةً لبنية الأصل والتوازي مع العبارة التالية.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: وفي المسيح يسوع
  rationale: «المسيح» ينقل Χριστός بوصفه لقبًا ذا معنى، و«يسوع» هو النقل العربي المألوف للاسم؛ كما حُفظ التوازي بين «في الكنيسة» و«في المسيح يسوع».
- source_word: εἰς πάσας τὰς γενεὰς
  choice: في جميع الأجيال
  rationale: في هذا التعبير الزمني تدل εἰς على الامتداد عبر تعاقب الأجيال؛ و«في جميع الأجيال» عربية طبيعية واضحة تؤدي هذا المعنى.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: إلى أبد الآبدين
  rationale: تعبير يوناني مكثف يدل على الدوام غير المنتهي، و«إلى أبد الآبدين» يحفظ نبرته التسبيحية ويؤدي معناه في العربية المعاصرة الموقرة.
- source_word: ἀμήν
  choice: آمين
  rationale: الصيغة العربية الليتورجية الراسخة للتأكيد الختامي.
theological_decisions:
- issue: هل يُنقل Χριστός بوصفه لقبًا ذا معنى أم بوصفه عنصرًا اسميًا؟
  choice: المسيح يسوع
  alternative: كريستوس يسوع
  rationale: Χριστός لقب معناه «الممسوح/المسيح»، و«المسيح» هو المقابل العربي التاريخي الواضح الذي يحفظ دلالة اللقب دون فرض تفسير مذهبي خاص.
- issue: دلالة المجد «في الكنيسة وفي المسيح يسوع»
  choice: الإبقاء على حرف الجر نفسه في العبارتين
  alternative: تفسير الأولى بـ«بين جماعة الكنيسة» أو إعادة صياغة العلاقة
  rationale: يحفظ هذا الاختيار التوازي والغموض الدلالي المقصودين في الأصل، فلا يحدد على نحو زائد كيفية ظهور المجد في الكنيسة أو في المسيح يسوع.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة ذات نبرة تسبيحية. استُخدمت جملة اسمية موجزة موافقة لطبيعة الأصل، مع تجنب الألفاظ الغامضة لدى القارئ المعاصر مثل «دهر الدهور» حين يمكن نقل المعنى طبيعيًا بعبارة «إلى أبد الآبدين».
