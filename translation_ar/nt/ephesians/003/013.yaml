  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: ar
  text: لذلك أطلب منكم ألّا تفقدوا عزيمتكم[a] بسبب ضيقاتي لأجلكم؛ فهي مجدٌ لكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألّا تُصابوا بالإحباط بسبب ضيقاتي لأجلكم».'
    reason: بديل معجمي لـἐγκακεῖν يبرز معنى فقدان الشجاعة أو التشجّع، مع إبقاء العلاقة السببية بالضيقات.
  - marker: b
    text: يمكن أن تدل «مجد» أيضًا على الكرامة أو ما يكون سببًا للكرامة. ويُفهم المرجع في المقام الأول على أنه ضيقات بولس لأجلهم، مع إمكان شموله خدمته وآلامه لأجلهم على نطاق أوسع.
    reason: يوضح المجال الدلالي لـδόξα ومرجع الجملة النسبية من غير فرض تفسير لاهوتي محدد.
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تُظهر النتيجة المترتبة على الكلام السابق بعبارة عربية موجزة وطبيعية.
- source_word: αἰτοῦμαι
  choice: أطلب إليكم
  rationale: تنقل معنى الالتماس، وتُظهر أن المخاطَبين هم المفهومون من السياق، مع التنبيه في الحاشية إلى أن اليونانية لا تصرّح بهم.
- source_word: μὴ ἐγκακεῖν
  choice: ألّا تفقدوا عزيمتكم
  rationale: تؤدي معنى فقدان الشجاعة أو الوقوع في الإحباط بلغة عربية واضحة، من غير أن تحصر اللفظ في اليأس التام أو مجرد التعب.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: بسبب ضيقاتي
  rationale: تفيد ἐν هنا الملابسة التي تكون سببًا للإحباط؛ وصيغة «بسبب» طبيعية في العربية، و«ضيقاتي» تحفظ شدة θλῖψις.
- source_word: ὑπὲρ ὑμῶν
  choice: لأجلكم
  rationale: تبيّن أن ضيقات بولس مرتبطة بخدمة المخاطَبين ومنفعتهم.
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: فهذا هو مجدكم
  rationale: اسم الإشارة المفرد يستعيد مجمل ما سبق، كما يفعل الضمير الموصول المفرد في اليونانية، من غير حصر المرجع نحويًا في كلمة واحدة؛ و«مجدكم» تحفظ الثقل اللاهوتي والبلاغي لكلمة δόξα.
theological_decisions:
- issue: مرجع العبارة المفردة ἥτις ἐστὶν δόξα ὑμῶν
  choice: «فهذا هو مجدكم»، فيعود «هذا» إلى ضيقات بولس لأجلهم بوصفها واقعًا واحدًا ذا دلالة.
  alternative: أن تعود العبارة على خدمة بولس وآلامه لأجلهم بمعناها الأوسع.
  rationale: أقرب ما يسبق العبارة هو ضيقات بولس، لكن صيغة الإشارة إلى مجمل الكلام تحفظ إمكان المرجع الأوسع ولا تفرض تحديدًا مذهبيًا ضيقًا.
- issue: الفاعل المفهوم مع μὴ ἐγκακεῖν والمفعول غير المصرّح به مع αἰτοῦμαι
  choice: 'يفهم الالتماس موجَّهًا إلى المؤمنين: «أطلب إليكم ألّا تفقدوا عزيمتكم».'
  alternative: 'يمكن من جهة التركيب أن يُفهم: «أطلب [من الله] ألّا أفقد عزيمتي»، أي إن بولس هو فاعل المصدر.'
  rationale: السياق الرعوي وارتباط الضيقات بـ«لأجلكم» يرجحان توجيه الطلب إلى المخاطَبين، لكن النص اليوناني لا يذكر ضمير «أنتم» صراحة، ولذلك أُثبت الاحتمال الآخر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «تفقدوا عزيمتكم» بدل تعبيرات قد تبدو قديمة أو تحمل معنى الفشل العملي، واستُعمل «فهذا» للمحافظة على إحالة العبارة اليونانية إلى مجمل الفكرة السابقة.
