  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: ar
  text: ففيه لنا الجرأة والدخول بثقة، من خلال الإيمان به[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من خلال أمانته». يمكن أن تعني العبارة اليونانية الإيمان الموجَّه إليه أو أمانته هو.'
    reason: قراءة بديلة تحفظ غموض تركيب الإضافة في اليونانية.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ففيه
  rationale: يعود الضمير المذكر إلى المسيح في السياق السابق، وتحافظ الصياغة على معنى الوجود فيه من غير إثقال العبارة العربية بتركيب «في الذي».
- source_word: παρρησίαν
  choice: الجرأة
  rationale: تنقل معنى الصراحة والجرأة في المثول أمام الله، وتبقى متميزة عن الثقة المذكورة لاحقًا.
- source_word: προσαγωγὴν
  choice: الدخول
  rationale: تفيد إمكان الدخول إلى حضرة الله. واختيار «الدخول» واضح وطبيعي، من غير إضافة «حق» غير المصرح بها في النص.
- source_word: ἐν πεποιθήσει
  choice: بثقة
  rationale: صياغة عربية موجزة وطبيعية تبين الكيفية المصاحبة للدخول، وتحفظ تمييزها الدلالي عن «الجرأة».
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: من خلال الإيمان به
  rationale: تفهم الإضافة على أنها موضوعية، أي الإيمان الموجَّه إلى المسيح، مع إبقاء احتمال أن المقصود أمانته في الحاشية.
theological_decisions:
- issue: دلالة διὰ τῆς πίστεως αὐτοῦ
  choice: من خلال الإيمان به
  alternative: من خلال أمانته
  rationale: يحتمل التركيب اليوناني أن يكون المقصود إيمان المؤمنين بالمسيح أو أمانة المسيح نفسه. يوافق المتن القراءة الشائعة الملائمة لسياق دخول المؤمنين، بينما تحفظ الحاشية الاحتمال الآخر من غير حسم مصطنع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كريمة. استُخدمت «ففيه» للربط بالسياق السابق، وحُفظ الفرق بين «الجرأة» و«الثقة»، مع تجنب إدخال ألفاظ تفسيرية غير موجودة صراحة في الأصل.
