source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: ar
  text: لكي يسكن المسيح[a] بالإيمان[b] في قلوبكم، وأنتم متأصّلون ومتأسّسون في المحبة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح».
    reason: بيان دلالة اللقب اليوناني Χριστός.
  - marker: b
    text: 'يمكن أيضًا: «بالثقة»؛ لكن «بالإيمان» أنسب في هذا السياق.'
    reason: بديل معجمي للفظة πίστις.
  - marker: c
    text: الأرجح أن «في المحبة» تتصل بعبارة «متأصّلون ومتأسّسون»؛ ويمكن نحويًا أن تتصل بعبارة «يسكن المسيح في قلوبكم».
    reason: حفظ احتمال التعلّق النحوي في النص اليوناني.
lexical_decisions:
- source_word: κατοικῆσαι
  choice: يسكن
  rationale: يفيد الفعل الإقامة المستقرة، وصيغة «لكي يسكن» تنقل المصدر الدال على الغاية أو النتيجة ضمن سياق الصلاة السابق.
- source_word: τὸν Χριστόν
  choice: المسيح
  rationale: «المسيح» المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحفظ معناه بوصفه لقبًا لا مجرد اسم.
- source_word: διὰ τῆς πίστεως
  choice: بالإيمان
  rationale: الباء تعبّر طبيعيًا عن الوسيلة، و«الإيمان» هو الأنسب لـ πίστις في هذا السياق، مع إثبات احتمال «الثقة» في الحاشية.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: في قلوبكم
  rationale: تعبير عربي كتابي مفهوم يشير إلى باطن الإنسان، لا إلى العواطف وحدها.
- source_word: ἐν ἀγάπῃ
  choice: في المحبة
  rationale: يحفظ حرف الجر وصورة المجال الذي يتأصل فيه المؤمنون ويتأسسون، مع التنبيه إلى احتمال التعلّق النحوي الآخر.
- source_word: ἐρριζωμένοι
  choice: متأصّلون
  rationale: ينقل صورة الجذور والحالة المستمرة الناتجة من فعل سابق، ويأتي طبيعيًا مع «في المحبة».
- source_word: τεθεμελιωμένοι
  choice: متأسّسون
  rationale: يحفظ الصورة المعمارية القائمة على الأساس ويوازي الصورة الزراعية في «متأصّلون».
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الراسخ والدقيق، والحاشية توضّح دلالته الأصلية من غير إدخال تفسير مذهبي.
- issue: دلالة πίστις في διὰ τῆς πίστεως
  choice: بالإيمان
  alternative: بالثقة
  rationale: السياق يرجّح الإيمان بوصفه الوسيلة التي بها يسكن المسيح في القلوب، مع بقاء معنى الثقة احتمالًا معجميًا.
- issue: متعلَّق ἐν ἀγάπῃ
  choice: متعلّقة بـ «متأصّلون ومتأسّسون»
  alternative: متعلّقة بـ «يسكن المسيح في قلوبكم»
  rationale: ترتيب العبارة وتدفّقها يرجّحان وصف المؤمنين بأنهم متأصلون ومتأسسون في المحبة، لكن التركيب اليوناني يسمح بالوجه الآخر، ولذلك حُفظ في الحاشية.
translation_notes:
  register: لغة عربية فصحى واضحة وموقّرة. استُخدمت «وأنتم» لإظهار انتقال المصدر اليوناني إلى اسمَي الفاعل الدالَّين على حال مستمرة، مع إبقاء الصورتين الزراعية والمعمارية.
