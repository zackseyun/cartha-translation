  source_fidelity: 'المعنى الأساسي محفوظ: القادر يفعل بما يتجاوز كل ما نطلبه أو نتصوره، وذلك بحسب القوة العاملة فينا. لكن «وللقادر» أوفى بوظيفة الداتيف اليوناني بوصفه متلقي التمجيد الذي يكتمل في الآية التالية من «وأمّا القادر»، كما أن «أكثر بكثير» أيسر وأوضح في نقل الشدة التوكيدية في ὑπερεκπερισσοῦ.'
