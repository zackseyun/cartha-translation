  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: ar
  text: وللقادر أن يفعل أكثر بكثير من كل ما نطلبه أو نتصوّره[a]، بحسب القوة العاملة فينا[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نفكّر فيه»؛ يدل الفعل اليوناني على ما يدركه الذهن أو يتصوّره.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «العاملة بيننا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: القادر
  rationale: اسم الفاعل المعرّف مستعمل استعمال الاسم، وهو في صيغة المجرور/الداتيف بوصفه متلقّي التمجيد الذي يكتمل في الآية التالية؛ وصياغة «القادر» طبيعية وتحافظ على عدم إدخال لفظ «الله» غير المذكور صراحة هنا.
- source_word: δὲ
  choice: وأمّا
  rationale: تفيد انتقالًا إلى خاتمة تمجيدية من غير دلالة على تضاد قوي، و«وأمّا» تؤدي هذا الانتقال في العربية بوضوح.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: أكثر جدًا من كل
  rationale: يجتمع التعبيران لتوكيد تجاوز كل ما يطلبه المؤمنون أو يتصورونه؛ وهذه الصياغة تنقل المبالغة بقوة مع بقائها مفهومة وطبيعية.
- source_word: ποιῆσαι
  choice: أن يفعل
  rationale: يحافظ على سعة معنى الفعل اليوناني وبساطته من غير تخصيصه بمعنى «ينجز».
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: كل ما نطلب أو نتصوّر
  rationale: «كل ما» تلائم تركيب الموصول بعد معنى التجاوز، و«نتصوّر» تنقل هنا نشاط الذهن وما يمكن أن يدركه أو يتخيله دون حصره في الخيال المحض.
- source_word: κατὰ τὴν δύναμιν
  choice: بحسب القوة
  rationale: تفيد κατά هنا المقياس أو التناسب، ولذلك فـ«بحسب» أدق من صياغة أداتية مثل «بالقوة».
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: العاملة فينا
  rationale: تنقل الفاعلية المستمرة للقوة داخل جماعة المؤمنين، مع إبقاء احتمال المعنى الوسطي/المبني للمجهول في اليونانية دون توسع تفسيري.
theological_decisions:
- issue: مرجع متلقّي التمجيد غير المسمّى في الآية
  choice: القادر
  alternative: الله القادر
  rationale: السياق يدل على الله، لكن النص اليوناني في هذه الآية لا يكرر اسمه؛ لذلك تُحفظ البنية الموصولة بما يلي من التمجيد دون إضافة اسم صريح.
- issue: موضع عمل القوة الإلهية
  choice: القوة العاملة فينا
  alternative: القوة العاملة بيننا
  rationale: «فينا» هي المقابلة المباشرة والأرجح، وتحفظ اتساع العبارة بشأن فاعلية القوة داخل المؤمنين دون فرض تصور مذهبي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تمجيدية رصينة. أُبقيت الجملة غير مكتملة نحويًا في آخرها لأنها تتصل بالآية 21، كما في المصدر اليوناني، ووُضعت جميع علامات الحواشي في المتن.
