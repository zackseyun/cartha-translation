  rationale: تُحسّن المراجعة سلامة البنية العربية في افتتاح جملة التسبيح المتصلة بالعدد التالي، وتوضح شدة معنى التجاوز، من غير تغيير المعنى أو تعيين مرجع غير مصرّح به في النص اليوناني. أبقيت الحاشيتان ومواقع علامتيهما كما هما، إذ هما ملائمتان للبدائل المعجمية المذكورة.
