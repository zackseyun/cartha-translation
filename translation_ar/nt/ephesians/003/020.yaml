  terminology: «القادر»، و«بحسب القوة العاملة فينا» اختيارات دقيقة وطبيعية، وتحافظ على عدم إضافة اسم «الله» غير المذكور في هذا العدد. و«نتصوّر» مناسب لـνοοῦμεν في هذا السياق.
