lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية، وتربط الآية بما قبلها مع الحفاظ على القوة الغائية في اليونانية.
- source_word: γνωρισθῇ
  choice: تُعرَف
  rationale: مبني للمجهول، فيحفظ صورة الفعل اليوناني من غير تعيين الفاعل صراحة.
- source_word: νῦν
  choice: الآن
  rationale: نقل مباشر للظرف الزمني، مع الإبقاء على موضعه البارز نسبيًا.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: لدى الرئاسات والسلطات
  rationale: «الرئاسات» و«السلطات» تعبيران عربيان موجزان يحفظان التمييز بين الاسمين، و«لدى» تؤدي جهة التعريف بوضوح. يحدد السياق السماوي أنها قوى فوق بشرية على الأرجح، من غير إدخال هذا التفسير في صلب الترجمة.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: في العوالم السماوية
  rationale: يؤدي معنى الحيز السماوي في استعمال أفسس بلغة عربية واضحة، مع إثبات البديل الأقرب حرفيًا في الحاشية.
- source_word: διὰ τῆς ἐκκλησίας
  choice: بواسطة الكنيسة
  rationale: يحفظ دلالة الوسيلة في διά مع المضاف إليه، ويبين أن الكنيسة هي الوسيط الذي به تُعرَف الحكمة.
- source_word: ἡ πολυποίκιλος σοφία τοῦ θεοῦ
  choice: حكمةُ الله المتعددةُ الأوجه
  rationale: ينقل πολυποίκιλος بوصفه دالًا على كثرة الجوانب وغنى التنوع، بعبارة مفهومة في العربية المعاصرة.
theological_decisions:
- issue: هوية «الرئاسات والسلطات»
  choice: الإبقاء على التسميتين في المتن، مع الإشارة في الحاشية إلى أن السياق يرجح قوى كونية أو روحية.
  alternative: تفسيرهما صراحةً في المتن بأنهما «القوى الروحية الحاكمة».
  rationale: عبارة «في العوالم السماوية» ترجح المرجع فوق البشري، لكن النص نفسه يستخدم تسميات عامة؛ لذلك تحفظ الترجمة ألفاظه ولا تزيد تحديدًا تفسيريًا.
- issue: وظيفة الكنيسة
  choice: ترجمة διὰ τῆς ἐκκλησίας بعبارة «بواسطة الكنيسة» للدلالة على الوسيلة.
  alternative: «من خلال الكنيسة».
  rationale: المعنى الأداتي واضح في التركيب اليوناني، ولا يلزم منه تحديد الكيفية التفصيلية التي تُظهر بها الكنيسة حكمة الله.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. روعي ترتيب عناصر الجملة اليونانية بقدر لا يخل بالطبيعية، واستُخدم «المتعددة الأوجه» بدل لفظ تراثي غامض لإظهار معنى التنوع الغني في πολυποίκιλος.
