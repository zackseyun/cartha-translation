  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: ar
  text: إن كنتم حقًا قد سمعتم[a] بتدبير[b] نعمة الله التي أُعطيت لي لأجلكم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كنتم قد سمعتم بالفعل». تحتفظ اليونانية بصيغة الشرط، لكن بولس يبدو في السياق مفترضًا أن هذا صحيح.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «تدبير» بـ«وكالة» أو «مسؤولية موكولة»؛ فاللفظ اليوناني يدل على إدارة أمر أو مسؤولية اؤتمن عليها شخص.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: فما دمتم
  rationale: تؤدي العبارة معنى الشرط الذي يفترض بولس تحققه في السياق، بصياغة عربية طبيعية، مع إثبات الصيغة الشرطية الصريحة في الحاشية.
- source_word: ἠκούσατε
  choice: قد سمعتم
  rationale: «قد» مع الماضي تعبّر بوضوح عن وقوع السماع وتلائم السياق الخطابي.
- source_word: οἰκονομίαν
  choice: تدبير
  rationale: يدل هنا على مسؤولية موكولة إلى بولس لإدارة خدمة النعمة، و«تدبير» لفظ عربي واضح يحتمل معنى الإدارة أو الوكالة دون اختزاله في الخطة المجردة.
- source_word: χάριτος τοῦ θεοῦ
  choice: نعمة الله
  rationale: تحافظ العبارة على المصطلح البولسي المألوف وعلى علاقة الإضافة، أي النعمة الصادرة من الله والتابعة له.
- source_word: τῆς δοθείσης
  choice: التي أُعطيت
  rationale: تحفظ صيغة المبني للمجهول ومعنى العطية. وأقرب مرجع نحوي لاسم الموصول هو «نعمة»، مع بقاء ارتباطها الوثيق بالتدبير مفهومًا من التركيب.
- source_word: μοι
  choice: لي
  rationale: مقابل عربي مباشر وطبيعي لدالّ المفعول غير المباشر.
- source_word: εἰς ὑμᾶς
  choice: من أجلكم
  rationale: تبيّن وجهة هذه النعمة وغرضها لفائدة المخاطبين، وهو الأنسب للسياق، مع إمكان ترجمتها «نحوكم» أو «لكم».
theological_decisions:
- issue: مدلول «تدبير نعمة الله»
  choice: مسؤولية أو خدمة تدبيرية ائتمن الله بولس عليها لفائدة المخاطبين
  alternative: خطة الله الخلاصية أو تدبيره بمعنى أكثر تجريدًا
  rationale: يركز السياق القريب على خدمة بولس للأمم، لكن لفظ «تدبير» لا ينفي صلة هذه الخدمة بخطة الله الأوسع.
- issue: قوة εἴ γε الشرطية
  choice: افتراض بلاغي يتوقع بولس صحته
  alternative: شرط صريح قد يوحي باحتمال عدم سماعهم
  rationale: السياق يرجح أن بولس لا يعبّر عن شك حقيقي، ولذلك استُعملت «فما دمتم»، مع حفظ البديل الحرفي في الحاشية.
- issue: مرجع τῆς δοθείσης
  choice: '«النعمة» هي المرجع النحوي المباشر: «نعمة الله التي أُعطيت لي»'
  alternative: المعنى الموسع أن التدبير أو التكليف هو الذي أُعطي لبولس
  rationale: المشاركة المؤنثة المفردة تطابق χάριτος نحويًا، لكن تركيب «تدبير النعمة» يجعل فكرة التكليف الموكول إلى بولس حاضرة أيضًا؛ لذلك لم تُحسم الدلالة الأوسع بما يتجاوز اليونانية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وكريمة النبرة. رُتبت علامتا الحاشية بحسب ظهورهما المنطقي في الآية: [a] للعبارة الشرطية و[b] لمصطلح «تدبير». أبقيت الفاصلة الختامية لأن الآية جزء من جملة ممتدة.'
