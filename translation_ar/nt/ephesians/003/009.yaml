id: EPH.3.9
reference: Ephesians 3:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: ar
  text: وأن أُظهِر للجميع ما هو تدبيرُ[a] السرّ الذي ظلَّ مخفيًّا منذ الدهور[b] في الله، الذي خلق كلَّ الأشياء،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكالة السر»، أو: «خطة السر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «طوال الدهور»؛ وبصياغة أكثر تفسيرًا: «منذ الأزل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: أُظهِر
  rationale: يحافظ على صورة إخراج الأمر إلى النور، ويأتي طبيعيًّا مع الجملة الاستفهامية غير المباشرة التي تليه.
- source_word: πάντας
  choice: للجميع
  rationale: ينقل شمول المقصودين مع صياغة عربية طبيعية.
- source_word: τίς ἡ οἰκονομία
  choice: ما هو تدبيرُ
  rationale: لفظة «تدبير» تستوعب معنى التنظيم والإدارة وإنفاذ المقصد، من غير تحميلها اصطلاحًا لاهوتيًّا متأخرًا.
- source_word: μυστηρίου
  choice: السرّ
  rationale: يدل في السياق البولسي على قصد إلهي كان مخفيًّا ثم أُعلن؛ و«السرّ» أوضح للقارئ العربي المعاصر من «الغموض».
- source_word: τοῦ ἀποκεκρυμμένου
  choice: الذي ظلَّ مخفيًّا
  rationale: تفيد الصياغة حالة الخفاء الناتجة من فعل سابق، بما يلائم قوة اسم الفاعل التام المبني للمجهول.
- source_word: ἀπὸ τῶν αἰώνων
  choice: منذ الدهور
  rationale: تحافظ على ذكر الدهور في اليونانية وعلى امتداد الخفاء زمنًا طويلًا، من غير تحويل العبارة صراحةً إلى «منذ الأزل».
- source_word: ἐν τῷ θεῷ
  choice: في الله
  rationale: ينقل حرف الجر ἐν مباشرةً ويحفظ فكرة كون السر مخفيًّا في الله، لا مجرد كونه عنده.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: الذي خلق كلَّ الأشياء
  rationale: يحوّل اسم الفاعل المعرّف إلى جملة صلة عربية واضحة، ويحافظ على شمول τὰ πάντα.
theological_decisions:
- issue: دلالة οἰκονομία وصلتها بالسر
  choice: تدبير السر
  alternative: وكالة السر أو خطة السر
  rationale: «التدبير» يحفظ معنى ترتيب الأمر وإدارته وإنفاذه، ولا يحصر اللفظة في مضمون السر وحده ولا يستورد إطارًا مذهبيًّا لاحقًا.
- issue: القوة الزمنية لعبارة ἀπὸ τῶν αἰώνων
  choice: منذ الدهور
  alternative: طوال الدهور أو منذ الأزل
  rationale: النص اليوناني يذكر الدهور ولا يصرّح بلفظة تعني الأزل؛ لذلك تحافظ الصياغة المختارة على التوتر الدلالي ولا تبالغ في تفسير المدى الزمني.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «أُظهِر» لصون استعارة النور من غير تعبير متكلّف، و«تدبير» للإبقاء على سعة οἰκονομία. وُضعت علامتا الحاشيتين بعد اللفظتين اللتين تشرحانهما مباشرةً.
