lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: بإعلانٍ
  rationale: تفيد العبارة وسيلة الإظهار أو كيفيته. و«بإعلان» عربية طبيعية موجزة، وتحافظ على معنى الكشف الإلهي من غير تعيين الفاعل صراحة.
- source_word: ἐγνωρίσθη μοι
  choice: أُعرِفَ لي
  rationale: 'يحافظ هذا على البناء للمجهول والمعنى الحرفي للفعل: جُعل السر معروفًا لبولس، من غير استبداله بفعل «أُعلن» الذي قد يكرر لفظ ἀποκάλυψις.'
- source_word: τὸ μυστήριον
  choice: السِّرّ
  rationale: في هذا السياق البولسي يدل اللفظ على قصد إلهي كان خفيًا ثم كُشف. «السِّرّ» واضح في العربية المعاصرة، ولا يضيف إلى الآية شرحًا لمضمون هذا السر.
- source_word: καθὼς
  choice: كما
  rationale: أداة مقارنة طبيعية تصل القول الحالي بما كتبه بولس من قبل.
- source_word: προέγραψα
  choice: كتبتُ سابقًا
  rationale: يناسب السياقَ معنى الكتابة المتقدمة، ويرجح الإشارة إلى ما سبق في الرسالة دون تحميل الفعل معاني أخرى ممكنة خارج هذا السياق.
- source_word: ἐν ὀλίγῳ
  choice: بإيجازٍ
  rationale: تؤدي المعنى الاصطلاحي للعبارة، أي الكتابة باختصار أو في كلمات قليلة، بصياغة عربية سلسة.
theological_decisions:
- issue: دلالة μυστήριον في الاستعمال البولسي
  choice: السِّرّ، بوصفه قصدًا إلهيًا كان خفيًا ثم صار معلومًا، من غير شرح مضمونه داخل هذه الآية
  alternative: السر الإلهي؛ التدبير الخفي؛ الغموض
  rationale: الآية تسمّي المفهوم ولا تعرض هنا مضمونه كاملًا؛ لذا يحافظ «السِّرّ» على الفئة اللاهوتية ويترك بيانها للسياق، من غير إدخال تفسير زائد.
- issue: الفاعل الضمني في ἐγνωρίσθη
  choice: 'الإبقاء على البناء للمجهول: «أُعرِفَ لي»'
  alternative: أعلنه الله لي؛ كُشف لي
  rationale: السياق يفهم منه أن الإعلان إلهي، لكن النص لا يذكر الفاعل صراحة. البناء للمجهول يصون هذا الإبهام الحقيقي ولا يضيف اسم الله إلى صياغة الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «السِّرّ» بدل اللفظ المعرَّب «السرّ/اللغز» بمعنى الغموض، لأن المقصود أمر إلهي مخفي ثم مُعلَن. حافظت الصياغة على المبني للمجهول وعلى إيجاز الأصل، ووُضعت جميع علامات الحواشي في المتن.
