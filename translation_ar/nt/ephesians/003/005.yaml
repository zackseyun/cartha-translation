  to: الذي لم يُكشَف عنه لبني البشر[a] في أجيال أخرى كما أُعلن الآن لرسله وأنبيائه القديسين في الروح[b].
  rationale: يصحح النص فعل الكشف ليؤدي معنى γνωρίζω في سياق السر المعلن، ويعيد ترتيب الصفة العربية لتشمل الرسل والأنبياء، مع الإبقاء على المقارنة الزمنية، والمبني للمجهول، وإبهام علاقة «في الروح» كما في اليونانية.
