    issue: «لم يُعرَّف» لا يؤدي معنى οὐκ ἐγνωρίσθη بدقة في هذا السياق.
    rationale: الفعل عرّف في العربية المعاصرة يدل غالبًا على التعريف بشخص أو شيء أو بيان هويته، لا على كشف سرّ أو إظهاره للناس. «لم يُكشَف عنه» يؤدي معنى جعل الأمر معروفًا مع المحافظة على المبني للمجهول.
  - severity: medium
    issue: نطاق صفة «القديسين» في «لرسله القديسين وأنبيائه» غير واضح وقد يقيّدها بالرسل وحدهم.
    rationale: 'الصفة اليونانية ἁγίοις قبل الاسمين المعطوفين وترجّح وصف الفئتين. وضعها بعد الاسمين في العربية: «لرسله وأنبيائه القديسين» يربطها بالمجموعة المعطوفة.'
