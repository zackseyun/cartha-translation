  timestamp: '2026-07-17T20:16:28Z'
review_pass:
  verdict: revise
  source_fidelity: المسودة تحافظ على البنية الموصولة، والمقارنة في «كما ... الآن»، والمبني للمجهول، و«في الروح». لكن «لم يُعرَّف» غير سليم هنا دلاليًا واستعماليًا؛ إذ يوحي بالتعريف أو التعيين أكثر من إفادة الكشف/الإعلام المقصودة في γνωρίζω. كذلك ترتيب «لرسله القديسين وأنبيائه» يجعل صفة القداسة أقرب نحويًا إلى الرسل وحدهم، بينما ἁγίοις تصف الرسل والأنبياء معًا على الأرجح.
  naturalness: «لم يُكشَف عنه لبني البشر» عربية فصيحة واضحة وتؤدي معنى عدم جعل السر معروفًا. وترتيب «لرسله وأنبيائه القديسين» يتيح في العربية إلحاق الصفة بالمجموع المعطوف، وهو أكثر سلاسة من تكرار الصفة.
  terminology: أُبقي «بني البشر» مع حاشيته، و«أُعلن» في سياق الوحي، و«الروح» مرادًا بها الروح القدس في السياق من غير تحويل «في» إلى «بـ» في المتن. لا يلزم تغيير الحواشي.
  issues:
