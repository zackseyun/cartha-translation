translation:
  language: ar
  text: الذي لم يُكشَف عنه لبني البشر[a] في أجيال أخرى كما أُعلن الآن لرسله وأنبيائه القديسين في الروح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: للبشر أو للناس؛ واليونانية تقول حرفيًا: «لبني البشر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بالروح»؛ فالعبارة اليونانية قد تدل على المجال أو على الوسيلة.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: الذي
  rationale: اسم موصول مذكر يعود إلى «السر» المذكور في السياق السابق، ويحافظ على ارتباط الآية بما قبلها من غير تكرار المرجع داخلها.
- source_word: ἑτέραις γενεαῖς
  choice: في أجيال أخرى
  rationale: تُفهم صيغة المجرور هنا دلالةً على الزمن؛ و«أخرى» تنقل ἑτέραις مباشرة من غير تحويلها إلى «سابقة».
- source_word: οὐκ ἐγνωρίσθη
  choice: لم يُعرَّف
  rationale: 'يحافظ المبني للمجهول على صيغة الأصل، وينقل معنى γνωρίζω السببي: جَعْل الأمر معروفًا، لا مجرد كونه غير معلوم.'
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: لبني البشر
  rationale: يحافظ على صورة التعبير السامية في اليونانية، مع بيان معناه الشامل في الحاشية.
- source_word: ὡς νῦν
  choice: كما ... الآن
  rationale: يحفظ قوة المقارنة الزمنية والكيفية، فلا يحسم أن الأمر كان مجهولًا بصورة مطلقة في الماضي، بل يقارنه بكيفية إعلانه الآن.
- source_word: ἀπεκαλύφθη
  choice: أُعلن
  rationale: لفظ عربي طبيعي مناسب لسياق الوحي والكشف الإلهي، ويحافظ على المبني للمجهول.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: لرسله القديسين وأنبيائه
  rationale: يُنسب كل من الرسل والأنبياء إليه، وتُفهم صفة «القديسين» نحويًا على أنها وصف للرسل؛ أما احتمال شمولها للفئتين فيبقى ممكنًا في تركيب الأصل.
- source_word: ἐν πνεύματι
  choice: في الروح
  rationale: يحافظ على حرف الجر ἐν وعلى إمكان دلالته على المجال أو الوسيلة، ويفهم «الروح» في هذا السياق على أنه الروح القدس.
theological_decisions:
- issue: مرجع πνεύματι ودلالة ἐν
  choice: الروح القدس، بصياغة «في الروح»
  alternative: «بالروح» للدلالة الأوضح على الوسيلة؛ أو فهمه على أنه روح الإنسان
  rationale: سياق الإعلان الإلهي للرسل والأنبياء يرجح الروح القدس. وتحافظ «في الروح» على احتمال المجال أو الوسيلة بدل حسم العلاقة في معنى سببي محض.
- issue: مدى الإعلان في الأجيال الأخرى
  choice: الإبقاء على المقارنة «كما أُعلن الآن»
  alternative: صياغة توحي بأن السر لم يكن معلومًا قط في الماضي
  rationale: ὡς νῦν تقارن الإعلان السابق بالإعلان الحالي من حيث الكيفية أو الدرجة، ولا يلزم منها نفي كل معرفة سابقة نفيًا مطلقًا.
translation_notes:
  register: صياغة عربية فصحى واضحة ومحترمة، تحافظ على بنية الجملة الموصولة لأنها متصلة بالسياق السابق. استُبقي التعبير «بني البشر» لما فيه من نبرة كتابية مفهومة، مع شرح معناه الشامل في الحاشية.
