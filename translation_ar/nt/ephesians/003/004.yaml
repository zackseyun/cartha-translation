lexical_decisions:
- source_word: πρὸς ὃ ... ἀναγινώσκοντες
  choice: وبقراءتكم هذا
  rationale: يربط التعبير بما كتبه بولس قبلًا، وتفيد الصياغة العربية أن القراءة هي الوسيلة التي يدرك بها المخاطَبون فهمه.
- source_word: δύνασθε
  choice: تستطيعون
  rationale: ينقل معنى القدرة بعبارة عربية واضحة وطبيعية.
- source_word: νοῆσαι
  choice: أن تدركوا
  rationale: الفعل يدل هنا على الفهم الذهني والتبيّن.
- source_word: τὴν σύνεσίν μου
  choice: ما لديّ من فهمٍ
  rationale: ينقل معنى فهم بولس أو بصيرته، ويتجنب التركيب العربي المتكلف «تدركوا فهمي» من غير تغيير المعنى.
- source_word: ἐν τῷ μυστηρίῳ
  choice: لسرّ
  rationale: اللام طبيعية في العربية بعد «فهم»، وتبيّن مجال هذا الفهم وموضوعه.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحافظ هنا على وظيفته اللقبية واللاهوتية.
theological_decisions:
- issue: دلالة τοῦ Χριστοῦ وصلته بكلمة «السرّ»
  choice: سرّ المسيح
  alternative: السرّ المتعلق بالمسيح
  rationale: أُبقي تركيب الإضافة موجزًا كما في اليونانية، من غير حسم ما إذا كانت الإضافة تعني أن السرّ يخص المسيح أو أنه متحقق فيه أو منسوب إليه.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقرة. استُعمل «ما لديّ من فهم» لتحقيق السلاسة مع الحفاظ على معنى σύνεσις، وأُبقي «سرّ المسيح» على إيجازه وغموض علاقته الإضافية في الأصل.
