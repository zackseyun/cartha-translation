lexical_decisions:
- source_word: ἐξ οὗ
  choice: الذي منه
  rationale: ينقل معنى المصدر في حرف الجر ἐξ مع اسم الموصول، من غير إضافة تفسيرية مثل «تستمد اسمها» إلى المتن.
- source_word: πᾶσα
  choice: كلُّ
  rationale: تلائم المعنى التوزيعي مع الاسم المفرد، مع إبقاء احتمال المعنى الجمعي في الحاشية.
- source_word: πατριὰ
  choice: أسرة
  rationale: تعبر بوضوح معاصر عن الجماعة العائلية أو السلالة. أما «أبوّة» فتحافظ على الصلة الاشتقاقية بـ«الآب» في العدد السابق، لكنها تجعل الاسم معنى مجردًا على نحو أرجح أنه تفسيري.
- source_word: ἐν οὐρανοῖς
  choice: في السماوات
  rationale: يحافظ على صيغة الجمع في اليونانية، وهي صياغة عربية طبيعية في الأسلوب الكتابي الفصيح.
- source_word: ἐπὶ γῆς
  choice: على الأرض
  rationale: ترجمة مكانية مباشرة وواضحة.
- source_word: ὀνομάζεται
  choice: تُسمَّى
  rationale: تنقل المضارع المبني للمجهول مباشرة، وتحافظ على دلالة الاسم من غير التصريح بأن كل أسرة «تستمد اسمها»، وهو معنى محتمل لكنه أصرح من الأصل.
theological_decisions:
- issue: دلالة πᾶσα πατριὰ وصلتها بـ«الآب» في العدد السابق
  choice: كلُّ أسرة
  alternative: الأسرة كلها؛ أو كل أبوّة
  rationale: تحفظ الترجمة المعنى المعتاد للاسم والمعنى التوزيعي المرجح لـπᾶσα، من غير حسم العبارة على أنها أسرة كونية واحدة أو تقرير مجرد عن مصدر كل أبوّة. وتعرض الحاشية الاحتمالات الأخرى والصلة الاشتقاقية المحتملة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «أسرة» لسهولة فهمها اليوم، مع الحفاظ على جمع «السماوات» وعلى المبني للمجهول في «تُسمَّى». تظهر علامة الحاشية [a] في المتن.
