translation:
  language: ar
  text: أن غير اليهود[a] شركاء في الميراث، وأعضاء معًا في جسد واحد[b]، وشركاء في الوعد في المسيح يسوع، وذلك عن طريق البشارة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمم». والمقصود هنا على وجه التحديد الشعوب من غير اليهود.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أعضاء في الجسد نفسه». يفيد التعبير اليوناني اشتراكهم معًا في جسد واحد.'
    reason: lexical_clarification
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: غير اليهود
  rationale: يدل اللفظ في هذا السياق على الشعوب من غير اليهود، لا على الدول أو الأمم بوصفها كيانات سياسية. وهذه الصياغة واضحة للقارئ العربي وتُظهر المقابلة السياقية مع اليهود من غير إضافة هوية طائفية.
- source_word: συγκληρονόμα
  choice: شركاء في الميراث
  rationale: يحفظ معنى الاشتراك المتكافئ في الميراث الذي تؤديه السابقة اليونانية συν، ويأتي طبيعيًا في العربية.
- source_word: σύσσωμα
  choice: أعضاء في الجسد نفسه
  rationale: اللفظ اليوناني النادر يفيد الانتماء معًا إلى جسد واحد. تفك الصياغة العربية هذا المركب بما يحفظ استعارة الجسد ووضوحها.
- source_word: συμμέτοχα
  choice: شركاء في الوعد
  rationale: يفيد اللفظ المشاركة مع آخرين، وتحافظ الصياغة على التوازي مع «شركاء في الميراث» من غير تثقيل العبارة.
- source_word: τῆς ἐπαγγελίας
  choice: في الوعد
  rationale: يتعلق المضاف إليه اليوناني باسم المشاركة، ولذلك تكون «شركاء في الوعد» صياغة عربية طبيعية، مع إبقاء «الوعد» مفردًا كما في الأصل.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ دلالته المسيانية في هذا السياق.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: عن طريق البشارة
  rationale: تفيد διά مع المضاف إليه الوسيلة. و«البشارة» واضحة وطبيعية وتحفظ معنى الخبر السار المعلَن.
- source_word: εἶναι
  choice: أن ... شركاء
  rationale: المصدر اليوناني يبيّن مضمون السر المذكور في السياق السابق؛ وتؤديه العربية بجملة مصدرية تبدأ بـ«أن».
theological_decisions:
- issue: هوية τὰ ἔθνη في سياق السر المعلَن
  choice: غير اليهود
  alternative: الأمم
  rationale: المقصود هنا إدخال الشعوب غير اليهودية مع شعب إسرائيل في الميراث والجسد والوعد، لا الحديث عن الأمم بمعناها السياسي العام.
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحافظ ترتيب «المسيح يسوع» على ترتيب الأصل، وتظل كلمة «المسيح» في العربية لقبًا ذا دلالة مسيانية واضحة.
- issue: قوة المركبات الثلاثة ذات السابقة συν
  choice: شركاء في الميراث، وأعضاء في الجسد نفسه، وشركاء في الوعد
  alternative: وارثون معًا، ومن جسد واحد، ومشتركون معًا في الوعد
  rationale: تحفظ الصياغة المختارة المساواة والاشتراك والتوازي البلاغي، مع تجنب تركيب عربي متكلف أو إيهام أن «الجسد» مجرد شيء يُقتسم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على الإيقاع الثلاثي في الأصل قدر الإمكان، وعلى استعارة الجسد، وعلى ارتباط الاشتراك بالمسيح يسوع وبالبشارة، من غير إدخال تفسير مذهبي خاص.
