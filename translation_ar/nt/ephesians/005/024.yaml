source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: ar
  text: لكن كما تخضع الكنيسة للمسيح[a]، كذلك أيضًا تخضع الزوجات لأزواجهن في كل شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح».
    reason: إظهار أن Χριστός مستعمل هنا بوصفه لقبًا، مع الحفاظ على المقابل العربي المألوف.
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكن
  rationale: تفيد الاستدراك والانتقال المتصل بما سبق، وهي الصياغة العربية الطبيعية هنا.
- source_word: ὡς ... οὕτως καὶ
  choice: كما ... كذلك أيضًا
  rationale: تحافظ على بنية المقارنة الترابطية في اليونانية وعلى عنصر «أيضًا».
- source_word: ἡ ἐκκλησία
  choice: الكنيسة
  rationale: يدل اللفظ في هذا السياق البولسي على جماعة المؤمنين، و«الكنيسة» هي المقابل العربي المعياري الواضح.
- source_word: ὑποτάσσεται
  choice: تخضع
  rationale: تنقل معنى الخضوع المرتب في الصيغة اليونانية من غير إضافة معنى الإكراه أو تفسير الدافع.
- source_word: τῷ Χριστῷ
  choice: للمسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحافظ على كونه لقبًا لا مجرد اسم.
- source_word: αἱ γυναῖκες
  choice: الزوجات
  rationale: سياق العلاقة الزوجية واقتران اللفظ بـἀνδράσιν يحددان المعنى المقصود، لا معنى النساء عمومًا.
- source_word: τοῖς ἀνδράσιν
  choice: لأزواجهن
  rationale: السياق المنزلي يقتضي معنى الأزواج، والضمير العربي يوضح علاقة كل زوجة بزوجها التي يفهمها السياق اليوناني.
- source_word: ἐν παντί
  choice: في كل شيء
  rationale: ترجمة مباشرة تحفظ شمول العبارة من غير تضييقها أو إضافة قيد تفسيري.
- source_word: '[ellipsis of ὑποτάσσεται in the second clause]'
  choice: حذف الفعل بعد «الزوجات» مع فهمه من المقابلة
  rationale: النص اليوناني لا يكرر الفعل في الشطر الثاني، والعربية تسمح بفهمه من الشطر الأول، فتحافظ هذه الصياغة على الإيجاز والبنية المقابِلة.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الكتابي المعروف ويؤدي دلالة Χριστός؛ وتوضح الحاشية أصله اللقبي من غير استبداله بتعبير غير مألوف في المتن.
- issue: مدى عبارة خضوع الزوجات
  choice: الإبقاء على «في كل شيء» بلا قيد مضاف
  alternative: في كل ما هو لائق أو في كل شيء مناسب
  rationale: يقول النص ἐν παντί بلا تقييد صريح؛ وإضافة قيد في المتن تحسم توترًا تفسيريًا لا يحسمه هذا العدد نفسه.
- issue: الفعل المحذوف في الشطر الثاني
  choice: إبقاء الحذف البلاغي مع فهم «تخضع» من الشطر الأول
  alternative: كذلك أيضًا تخضع الزوجات لأزواجهن
  rationale: يحافظ الحذف على صورة النص اليوناني، ولا يوقع العربية في غموض لأن بنية «كما... كذلك» تحمل الفعل بوضوح إلى الشطر الثاني.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حوفظ على بنية المقارنة وعلى حذف الفعل في الشطر الثاني، كما حوفظ على شمول «في كل شيء» من غير توسع تفسيري.
