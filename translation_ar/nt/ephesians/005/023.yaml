  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: ar
  text: لِأَنَّ[a] الزَّوْجَ هُوَ رَأْسُ[b] الزَّوْجَةِ، كَمَا أَنَّ الْمَسِيحَ[c] أَيْضًا هُوَ رَأْسُ الْكَنِيسَةِ، وَهُوَ نَفْسُهُ مُخَلِّصُ الْجَسَدِ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يجوز أن تُفهم أداة الربط في أول الآية بمعنى: «فإنَّ»، إذ تقدّم تعليلًا لما سبق.'
    reason: lexical_alternative
  - marker: b
    text: تحفظ كلمة «رأس» الاستعارة اليونانية؛ وقد فُهمت على وجوه مختلفة، منها السلطة أو الصدارة أو المصدر.
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية: Χριστός، أي «المسيح»، واللفظة مستعملة هنا بوصفها لقبًا.'
    reason: alternative_reading
  - marker: d
    text: 'العبارة اليونانية موجزة، وحرفيًّا: «هو نفسه مخلِّص الجسد».'
    reason: previous_rendering
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تُبيّن أن الجملة تعليل أو تفسير لما سبق، وتحافظ «لأن» على هذه القوة بوضوح في العربية.
- source_word: ἀνήρ
  choice: الزَّوْج
  rationale: السياق المنزلي، واقتران الكلمة بـγυνή، يقتضيان المعنى الزوجي لا المعنى العام «الرجل».
- source_word: κεφαλή
  choice: رَأْس
  rationale: يحافظ على الاستعارة اليونانية من غير حصرها في معنى خلافي واحد مثل السلطة أو المصدر.
- source_word: γυνή
  choice: الزَّوْجَة
  rationale: المقابلة مع ἀνήρ في سياق الزواج تقتضي «الزوجة».
- source_word: ὡς καὶ
  choice: كَمَا أَنَّ ... أَيْضًا
  rationale: تنقل بنية المقارنة بين علاقة الزوج بالزوجة وعلاقة المسيح بالكنيسة من غير الإيحاء بتطابق العلاقتين في كل وجه.
- source_word: Χριστός
  choice: الْمَسِيح
  rationale: «المسيح» المقابل العربي الراسخ للقب اليوناني، ويحفظ دلالته المسيانية.
- source_word: ἐκκλησία
  choice: الْكَنِيسَة
  rationale: تشير هنا إلى جماعة المؤمنين في الاستعمال البولسي، و«الكنيسة» أوضح مقابل عربي راسخ.
- source_word: αὐτός
  choice: هُوَ نَفْسُهُ
  rationale: يحفظ توكيد الضمير ويربط دور التخليص بالمسيح نفسه.
- source_word: σωτήρ
  choice: مُخَلِّص
  rationale: مقابل عربي طبيعي يحفظ معنى الإنقاذ والخلاص في هذا السياق المسياني.
- source_word: σῶμα
  choice: الْجَسَد
  rationale: يحافظ على استعارة الجسد، ولا يضيف ضمير الملكية «جسده» غير الصريح في اليونانية.
theological_decisions:
- issue: دلالة κεφαλή في المقارنة بين الزوج والزوجة والمسيح والكنيسة
  choice: الإبقاء على الاستعارة «رأس»
  alternative: «مصدر» أو «قائد» أو «صاحب سلطة»
  rationale: اللفظة موضع خلاف تفسيري؛ لذلك تُحفظ الاستعارة والتوتر الدلالي بدل إدخال تفسير واحد في صلب النص.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: نقل صوتي قريب من «كريستوس»
  rationale: الكلمة لقب مسياني هنا، و«المسيح» ينقل معناها في العربية ولا يعاملها كاسم صوتي مجرد.
- issue: مرجع «الجسد»
  choice: إبقاء «الجسد» بلا إضافة ضمير
  alternative: «جسده» أو «جسد الكنيسة»
  rationale: المرجع مفهوم من السياق، لكن ضمير الملكية أو التفسير الصريح غير موجودين في العبارة اليونانية، فحُفظ إيجازها.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة ذات نبرة كتابية مهيبة. أُبقيت استعارتا «الرأس» و«الجسد»، واستُعمل التوكيد «هو نفسه» لنقل αὐτός، مع إضافة حرف العطف والضمير الرابط بما يلائم النحو العربي من غير تغيير المعنى.
