  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: ar
  text: ولا فحشٌ، ولا كلامٌ سخيفٌ، ولا مزاحٌ بذيء[a]، وهي أمورٌ لا تليق[b]، بل بالأحرى الشكرُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مزاح فظ». قد تدل الكلمة اليونانية عمومًا على خفة الظل أو سرعة البديهة، لكنها مستعملة هنا بمعنى سلبي لأنها مقرونة بأمور غير لائقة.
    reason: lexical_alternative
  - marker: b
    text: أو «أمور لا تناسب» أو «أمور غير لائقة».
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: فحش
  rationale: يدل الاسم على ما هو مخزٍ أو قبيح، ويضيّق سياقُ الرذائل الكلامية معناه هنا إلى التعبير الفاحش من غير حصره في نوع واحد من البذاءة.
- source_word: μωρολογία
  choice: كلام أحمق
  rationale: ينقل معنى المركّب اليوناني، أي الكلام المتصف بالحماقة، بعبارة عربية واضحة وطبيعية.
- source_word: ἢ
  choice: ولا
  rationale: مع أن الأصل يفيد «أو»، فإن تتابع المنهيات في العربية بعد النفي يُصاغ طبيعيًا بـ«ولا»، مع بقاء العناصر متعاطفة ضمن قائمة واحدة.
- source_word: εὐτραπελία
  choice: مزاح بذيء
  rationale: قد يدل اللفظ في استعمالات أخرى على خفة الظل أو سرعة البديهة، لكنه هنا واقع ضمن قائمة مذمومة وموصوف بأنه غير لائق، ولذلك يلزم معنى سلبي.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: وهي أمور لا تليق
  rationale: يحيل ضمير الوصل المحايد الجمع إلى العناصر السابقة مجتمعة؛ وهذه الصياغة توضح الإحالة وتحفظ معنى عدم المناسبة الأخلاقية.
- source_word: ἀλλὰ μᾶλλον
  choice: بل بالحري
  rationale: 'تحفظ الصياغة قوة المقابلة ومعنى التفضيل: المطلوب أن يحل الشكر محل أنماط الكلام المذكورة.'
- source_word: εὐχαριστία
  choice: شكر
  rationale: ينقل الاسم الدال على التعبير عن الامتنان، ويحافظ على المقابلة الاسمية مع الرذائل السابقة.
theological_decisions:
- issue: مدى ارتباط αἰσχρότης بالكلام
  choice: صياغته «فحش» في سياق يغلب عليه الكلام، من دون إضافة كلمة «كلام» إلى اللفظ نفسه.
  alternative: «كلام فاحش» أو «قباحة» بمعنى أخلاقي عام.
  rationale: المفردتان التاليتان كلاميتان، والمقابلة مع الشكر ترجح البعد اللفظي؛ لكن «فحش» يحفظ قدرًا من سعة اللفظ اليوناني ولا يحسمه في الكلام وحده.
- issue: التقييم الأخلاقي لـ εὐτραπελία
  choice: 'ترجمته سلبًا: «مزاح بذيء».'
  alternative: «ظرف» أو «خفة ظل» أو «مزاح فظ».
  rationale: قد يكون اللفظ محايدًا أو إيجابيًا خارج هذا السياق، إلا أن جمعه مع الرذائل ووصفها بأنها لا تليق يفرضان هنا دلالة مذمومة، من دون إدانة المزاح في ذاته.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل تكرار «ولا» لتكوين قائمة عربية طبيعية، وحُفظت المقابلة الموجزة مع «الشكر». تظهر علامتا الحاشية [a] و[b] في المتن.
