  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: ar
  text: أيها الأزواج، أحبّوا زوجاتكم، كما أحبّ المسيح[a] أيضًا الكنيسة وبذل نفسه من أجلها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح».
    reason: lexical_clarification
  - marker: b
    text: 'أو: «أسلم نفسه من أجلها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: أيها الأزواج
  rationale: في سياق تعليم الحياة الزوجية، تدل الكلمة على الرجال بوصفهم أزواجًا، لا على الرجال عمومًا؛ وصيغة النداء العربية تنقل الخطاب المباشر بوضوح.
- source_word: ἀγαπᾶτε / ἠγάπησεν
  choice: أحبّوا / أحبّ
  rationale: يحافظ استعمال الجذر العربي نفسه على التوازي المعجمي بين الأمر الموجَّه إلى الأزواج وفعل المسيح الماضي.
- source_word: τὰς γυναῖκας
  choice: زوجاتكم
  rationale: السياق الزوجي يحدد معنى «النساء» هنا بالزوجات، وضمير المخاطبين يوضح العلاقة التي يفيدها التركيب اليوناني في هذا السياق.
- source_word: καθὼς καὶ
  choice: كما ... أيضًا
  rationale: ينقل المقارنة ويُبقي عنصر καί الظاهر في العبارة اليونانية.
- source_word: ὁ Χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ دلالته اللقبية.
- source_word: τὴν ἐκκλησίαν
  choice: الكنيسة
  rationale: تشير الكلمة هنا إلى جماعة المؤمنين بوصفها كيانًا واحدًا، و«الكنيسة» هي العبارة العربية الواضحة والمستقرة في هذا السياق البولسي.
- source_word: ἑαυτὸν παρέδωκεν
  choice: بذل نفسه
  rationale: تعبير عربي طبيعي ينقل معنى تسليم الذات الطوعي ويحفظ الدلالة البذلية من غير إضافة شرح عقائدي غير مصرح به في العبارة.
- source_word: ὑπὲρ αὐτῆς
  choice: من أجلها
  rationale: ينقل معنى العمل لصالح الكنيسة أو نيابة عنها، مع إعادة الضمير المؤنث إلى «الكنيسة» بصورة طبيعية.
theological_decisions:
- issue: دلالة Χριστός في التشبيه بين الزواج والكنيسة
  choice: المسيح
  alternative: الممسوح
  rationale: يحفظ «المسيح» معنى اللقب اليوناني مع استعمال عربي طبيعي وراسخ، من غير تحويله إلى اسم مجرد أو إدخال تمييز مذهبي.
- issue: مدى الدلالة البذلية في παρέδωκεν ὑπὲρ αὐτῆς
  choice: بذل نفسه من أجلها
  alternative: أسلم نفسه من أجلها
  rationale: تُظهر الصياغة عطاء المسيح الطوعي لصالح الكنيسة، لكنها لا تضيف تحديدًا لنظرية كفارية لا تنص عليه هذه الجملة نفسها.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية وقورة. استُعمل «أيها الأزواج» للنداء المباشر، وحُفظ التوازي بين «أحبّوا» و«أحبّ»، مع إبقاء المقارنة وصيغة «أيضًا» دون إثقال الأسلوب.
