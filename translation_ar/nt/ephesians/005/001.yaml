lexical_decisions:
- source_word: γίνεσθε
  choice: صِيرُوا
  rationale: فعل أمر مضارع من γίνομαι، وفيه معنى الصيرورة أو الدخول في مسار مستمر؛ و«صيروا» يحفظ هذا المعنى مع بقاء إمكان فهم الاستمرار.
- source_word: οὖν
  choice: إذًا
  rationale: تفيد الاستنتاج والربط بما سبق، و«إذًا» واضحة وطبيعية في العربية المعاصرة.
- source_word: μιμηταὶ
  choice: متمثّلين
  rationale: يدل الاسم على محاكاة المثال والاقتداء به. «متمثّلين بالله» تؤدي معنى imitation بعبارة عربية طبيعية، دون إضعاف المعنى إلى مجرد الاتباع.
- source_word: τοῦ θεοῦ
  choice: بالله
  rationale: تتطلب صياغة «متمثّلين» العربية حرف الباء، وهي تنقل علاقة المضاف إليه في اليونانية نقلاً طبيعيًا.
- source_word: ὡς
  choice: كـ
  rationale: تحفظ إيجاز أداة التشبيه اليونانية، وتترك مفتوحًا كون العبارة تصف الهيئة أو الأساس دون تحويلها صراحة إلى تعليل.
- source_word: τέκνα
  choice: أولاد
  rationale: لفظ شامل للجنسين ويدل على علاقة البنوة؛ وهو طبيعي وواضح في العربية.
- source_word: ἀγαπητά
  choice: أحبّاء
  rationale: تنقل معنى المحبوبين والأعزاء في سجل عربي كتابي رصين ومفهوم.
theological_decisions:
- issue: علاقة الوصية بهوية المؤمنين أولادًا محبوبين
  choice: تُبقي الصياغة «كأولاد أحبّاء» العبارة مرتبطة بالأمر بوصفها هيئةً أو أساسًا له، من غير أن توحي بأن التمثل بالله هو الذي يجعلهم أولادًا.
  alternative: 'يمكن فهمها على أنها مجرد مقارنة: تمثّلوا بالله مثلما يفعل الأولاد الأحباء.'
  rationale: أداة ὡς موجزة وتحتمل دلالة الهيئة مع أساس الهوية؛ لذلك لم تُضف أداة سببية مثل «لأنكم» تحسم العلاقة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. اختير «متمثّلين بالله» بدل «مقلّدين لله» لأن «التقليد» قد يحمل إيحاءً سلبيًا في الاستعمال الحديث، مع الحفاظ على معنى المحاكاة والاقتداء. وُضعت علامة الحاشية في المتن كما يلزم.
