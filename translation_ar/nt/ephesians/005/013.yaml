lexical_decisions:
- source_word: τὰ ... πάντα
  choice: كلَّ الأشياء
  rationale: تركيب محايد جمعي شامل؛ وتحافظ هذه الصياغة على سعته وصورته أكثر من «كل ما».
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا فيه مقابلة خفيفة مع الكلام السابق عن أعمال الظلمة.
- source_word: ἐλεγχόμενα
  choice: حين يكشفها
  rationale: للفعل معنى الكشف أو التوبيخ بحسب السياق؛ ومع «بالنور» والفعل اللاحق، يبرز هنا معنى إظهار المستور. وصيغة «حين» تنقل العلاقة الظرفية للمشاركة المبنية للمجهول دلاليًا، مع صياغة عربية طبيعية.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: النور
  rationale: ὑπό مع المضاف إليه تدل على الفاعل؛ فجاء النور فاعلًا في المبنى للمعلوم بالعربية، مع إبقاء التعريف الذي يربط العبارة بالسياق السابق.
- source_word: φανεροῦται
  choice: تصير ظاهرةً
  rationale: تنقل معنى الصيرورة إلى الظهور في φανερόω المبني للمجهول، وتحافظ على صورة النور والإبصار.
theological_decisions:
- issue: المقصود بـ«النور» في السياق
  choice: إبقاء «النور» بلا تعيين صريح لمرجعه
  alternative: المسيح، أو الإنجيل، أو الحق الأخلاقي، أو شهادة جماعة المؤمنين
  rationale: السياق يصف المؤمنين بأنهم نور في الرب ويتحدث عن كشف أعمال الظلمة، لكن الآية نفسها لا تحصر مرجع النور في تفسير واحد.
- issue: العلاقة النحوية بين ἐλεγχόμενα وφανεροῦται
  choice: «كل الأشياء، حين يكشفها النور، تصير ظاهرة»
  alternative: «كل ما يكشفه النور يصير ظاهرًا»
  rationale: القراءتان متقاربتان نحويًا ودلاليًا؛ اختيرت الأولى لإبراز شمول «كل الأشياء» ثم فعل كشفها، مع حفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم المبني للمعلوم «يكشفها النور» لتجنب ثقل «تُكشَف بالنور»، مع الحفاظ على كون النور هو عامل الكشف. وُضعت علامة الحاشية بعد الجملة.
