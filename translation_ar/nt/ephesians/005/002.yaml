  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: ar
  text: واسلكوا في المحبة، كما أحبَّنا المسيح أيضًا وأسلم نفسه لأجلنا، تقدمةً وذبيحةً لله، رائحةً عطرةً[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تستعيد عبارة «رائحة عطرة» لغة الذبائح في العهد القديم، حيث تصف تقدمةً مقبولةً ومرضيةً لله.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: اسلكوا
  rationale: يحفظ استعارة السير بوصفها طريقة العيش، وهو تعبير كتابي عربي واضح ومألوف.
- source_word: ἐν ἀγάπῃ
  choice: في المحبة
  rationale: يحافظ على تركيب حرف الجر وعلى دلالة المجال أو الكيفية.
- source_word: ὁ Χριστός
  choice: المسيح
  rationale: ينقل اللقب اليوناني بصيغته العربية الراسخة، وهو هنا معرّف ويؤدي وظيفة اللقب.
- source_word: ἠγάπησεν ἡμᾶς
  choice: أحبَّنا
  rationale: ترجمة مباشرة تحفظ الصلة اللفظية بالمحبة المذكورة في مطلع الآية.
- source_word: παρέδωκεν ἑαυτὸν
  choice: أسلم نفسه
  rationale: يعبّر بدقة وإيجاز عن تسليم الذات الطوعي في السياق القرباني.
- source_word: ὑπὲρ ἡμῶν
  choice: لأجلنا
  rationale: يحفظ المعنى النفعي أو النيابي المحتمل من غير حصره في صياغة لاهوتية أضيق مما يقتضيه حرف الجر.
- source_word: προσφορὰν καὶ θυσίαν
  choice: تقدمةً وذبيحةً
  rationale: يبقي المصطلحين القربانيين متميزين ولا يدمجهما في لفظ واحد.
- source_word: τῷ θεῷ
  choice: لله
  rationale: ينقل المجرور الدال على متلقي التقدمة بصياغة عربية طبيعية.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: رائحةً عطرةً
  rationale: يحفظ الصورة الحسية والصدى القرباني للعهد القديم بلغة عربية واضحة.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح الموعود
  rationale: لفظ «المسيح» هو المقابل العربي الراسخ للقب، وإضافة «الموعود» تفسير زائد لا يصرح به النص.
- issue: قوة ὑπὲρ ἡμῶν في السياق القرباني
  choice: لأجلنا
  alternative: نيابةً عنا
  rationale: «لأجلنا» يبقي المجال مفتوحًا للدلالة النفعية أو النيابية ولا يحسم الغموض المشروع لصالح صياغة بدلية صريحة.
- issue: وظيفة عبارة الرائحة العطرة
  choice: الإبقاء على الصورة القربانية الحسية مع حاشية توضيحية
  alternative: قربانًا مرضيًا لله
  rationale: النص يذكر الرائحة صراحة؛ لذلك تُحفظ الصورة ولا تُستبدل بتفسيرها، مع بيان صداها الكتابي في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة مهيبة. استُخدم «اسلكوا» للمحافظة على استعارة النص، و«تقدمة وذبيحة» لصون ازدواج المصطلحين القربانيين، مع تجنب صياغة مذهبية تحسم معنى ὑπέρ.
