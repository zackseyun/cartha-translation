  timestamp: '2026-07-17T20:17:00Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام منقول، لكن «على أيديهم» ليست المقابل العربي الطبيعي لوكالة ὑπ’ αὐτῶν هنا، وقد توحي بتعبير اصطلاحي أو بنتيجة وقعت «على أيديهم» أكثر من كونهم الفاعلين. والصياغة النشطة «ما يفعلونه» تنقل الوكالة بوضوح من غير إضافة مرجع للضمير. كما أن «حتى الحديث عنه» يؤدي القيمة التصاعدية لـ καὶ λέγειν.
  naturalness: «لأن ما يفعلونه في الخفاء مخجل، حتى الحديث عنه» فصحى واضحة وطبيعية وموجزة. وهي أسلس من تركيب «ما يُفعل على أيديهم ... حتى أن يُذكر»، ولا تفقد المقصود الأخلاقي أو البلاغي.
  terminology: «مخجل» مناسب لـ αἰσχρόν في عربية معاصرة واضحة. و«الخفاء»/«في الخفاء» مناسب لـ κρυφῇ. أبقي الضمير غير مفسَّر، التزامًا بعدم تعيين مرجعه من خارج الآية.
  issues:
  - severity: medium
    issue: «على أيديهم» ترجمة غير طبيعية للفاعل في هذا الموضع.
    rationale: التركيب العربي يمكن أن يفيد أن الأمر جرى بوساطتهم أو على أيديهم، لكنه ليس الصياغة الأوضح لإسناد الأفعال إليهم. ويعالج النص المنقح ذلك بـ«ما يفعلونه».
  - severity: low
    issue: الحاشية الحالية تعيد صياغة المتن مع افتتاح «لأن» بدل أن تعرض بديلًا محددًا للفظ أو للبنية.
    rationale: تُستبدل بحاشية موجزة تبيّن البديل المبني للمجهول، مع المحافظة على الفرق الأسلوبي دون تغيير المعنى.
