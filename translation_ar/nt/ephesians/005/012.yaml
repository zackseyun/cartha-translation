  text: لِأَنَّ مَا يَفْعَلُونَهُ فِي الْخَفَاءِ[a] مُخْجِلٌ، حَتَّى الْحَدِيثُ عَنْهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما يُفْعَلُ مِنْ قِبَلِهِمْ فِي الْخَفَاءِ».'
    reason: بديل أسلوبي يحافظ على صيغة المبني للمجهول في اليونانية، في حين أن المتن يستعمل صيغة المعلوم العربية الأكثر طبيعية.
lexical_decisions:
- source_word: τὰ ... γινόμενα
  choice: مَا يُفْعَلُ
  rationale: يؤدي التركيب المكوَّن من أداة التعريف واسم الفاعل المستعمل استعمال الاسم، فيشير إلى ما يجري من أفعال، ويحافظ على الصياغة غير الشخصية في اليونانية.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تربط العبارة بما قبلها بوصفها تعليلًا أو تفسيرًا للوصية السابقة.
- source_word: κρυφῇ
  choice: فِي السِّرِّ
  rationale: تعبير عربي طبيعي يدل على وقوع الأفعال خفيةً وبعيدًا عن الأنظار.
- source_word: γινόμενα
  choice: يُفْعَلُ
  rationale: يحافظ المبني للمجهول على الصيغة اليونانية وعلى الإشارة إلى الأفعال من غير إبراز الفاعلين في صدر العبارة.
- source_word: ὑπ’ αὐτῶν
  choice: عَلَى أَيْدِيهِمْ
  rationale: يبيّن جهة الفاعل مع بقاء الفعل مبنيًّا للمجهول، ويُبقي الضمير من غير تعيين مرجعه داخل الآية.
- source_word: αἰσχρόν
  choice: مِنَ الْمُخْجِلِ
  rationale: ينقل الحكم الأخلاقي المتضمن في اللفظ بعبارة عربية واضحة معاصرة، من غير مبالغة.
- source_word: καὶ λέγειν
  choice: حَتَّى أَنْ يُذْكَرَ
  rationale: تفيد «حتى» هنا المعنى التصاعدي لـκαί، أي إن الأمر مخجل إلى حد أن مجرد ذكره مخجل؛ والمبني للمجهول طبيعي في العربية في هذا السياق.
theological_decisions:
- issue: مرجع الضمير في ὑπ’ αὐτῶν
  choice: 'الإبقاء على الضمير: «على أيديهم»'
  alternative: التصريح بالمرجع، مثل «على أيدي أهل العصيان» أو «على أيدي فاعلي أعمال الظلمة»
  rationale: لا تعيّن الآية المرجع بالاسم، بل يُفهم من السياق السابق. والتصريح به داخل النص يضيف تفسيرًا لا يقتضيه اللفظ اليوناني نفسه.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة وقورة. اختيرت صيغة المبني للمجهول في المتن لمقاربة البنية اليونانية، مع استعمال «على أيديهم» لإظهار جهة الفعل طبيعيًّا، ووُضع البديل الأكثر مباشرة في الحاشية.
