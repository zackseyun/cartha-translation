  rationale: يستبدل التنقيح التعبير غير المألوف «على أيديهم» بفعلٍ معلوم يسند الأفعال إلى الضمير نفسه من غير توسيع مرجعه. ويصوغ الشطر الأخير بعبارة عربية طبيعية تؤدي معنى أن حتى الكلام عن تلك الأفعال مخجل. والحاشية تبقي بديل البنية المبنية للمجهول، لا بديلًا يغير المعنى.
