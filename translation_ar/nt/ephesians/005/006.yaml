  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: ar
  text: لا يَخْدَعْكُم أحدٌ بكلامٍ فارغ، فلأجل هذه الأمور يأتي غضبُ الله على أبناء العصيان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي الذين يتصفون بالعصيان؛ ويمكن ترجمتها أيضًا: «أولاد العصيان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ὑμᾶς ἀπατάτω
  choice: لا يَخْدَعْكُم أحدٌ
  rationale: ينقل صيغة النهي اليونانية بعبارة عربية طبيعية ومباشرة، ويحافظ «يخدع» على معنى التضليل المتعمد في هذا السياق.
- source_word: κενοῖς λόγοις
  choice: بكلامٍ فارغ
  rationale: يحفظ صورة الفراغ في الأصل، ويشير إلى كلام خالٍ من الحق أو المضمون من غير أن يضيّق المعنى إلى «حجج» فقط.
- source_word: διὰ ταῦτα
  choice: فلأجل هذه الأمور
  rationale: ينقل دلالة السبب في διά مع النصب، ويبقي إحالة «هذه الأمور» إلى الخطايا المذكورة في السياق السابق.
- source_word: ἔρχεται
  choice: يأتي
  rationale: يحافظ على الفعل المضارع في الأصل وعلى انفتاحه من جهة كونه حقيقة واقعة أو أمرًا آتيًا، من غير تحديد زمني زائد.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: غضبُ الله
  rationale: ترجمة مباشرة تحفظ قوة لفظ ὀργή ولا تستبدله بالتعبير الأعم «دينونة الله».
- source_word: ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας
  choice: على أبناء العصيان
  rationale: يحفظ التركيب التصويري «أبناء» ودلالة التوجّه في ἐπί، مع استعمال «العصيان» للدلالة على رفض الطاعة؛ ويُشرح المعنى الاصطلاحي في الحاشية.
theological_decisions:
- issue: لغة غضب الله
  choice: غضبُ الله
  alternative: دينونة الله
  rationale: يذكر الأصل ὀργή تحديدًا؛ لذلك تُحفظ دلالة الغضب الإلهي ولا تُلطَّف إلى مفهوم الدينونة الأعم.
- issue: التعبير τοὺς υἱοὺς τῆς ἀπειθείας
  choice: أبناء العصيان
  alternative: العصاة؛ الذين يتصفون بالعصيان
  rationale: يحافظ النص الرئيس على الصورة السامية في العبارة اليونانية، بينما توضّح الحاشية أنها تصف أناسًا يتسمون بالعصيان، لا نسبًا حرفيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة تحذيرية رصينة. حُفظت الاستعارة «كلام فارغ» والصيغة الاصطلاحية «أبناء العصيان»، ووُضعت علامة الحاشية عند العبارة التي تشرحها.
