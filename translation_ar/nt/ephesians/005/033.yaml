  text: على أيّ حال، فليحبَّ كلُّ واحدٍ منكم، كلٌّ على حدة[a]، زوجتَه هكذا، كما يحبّ نفسَه، ولتَهَبِ الزوجةُ زوجَها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية تؤكّد أن الوصية تنطبق على كل زوج شخصيًا: «كلٌّ على حدة».'
    reason: lexical_alternative
