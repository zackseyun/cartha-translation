lexical_decisions:
- source_word: πλὴν
  choice: على أيّ حال
  rationale: تؤدي وظيفة الانتقال الختامي إلى خلاصة عملية، مع إبقاء مسحة الاستدراك من غير إثقال العربية بصيغة غير طبيعية.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: كلُّ واحدٍ منكم على حدة
  rationale: تنقل القوة التوزيعية المؤكدة للعبارة اليونانية، فتجعل الوصية موجهة إلى كل زوج شخصيًا.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: زوجتَه
  rationale: السياق الزوجي يحدد معنى γυνή، والضمير المتصل يؤدي معنى «زوجته هو» طبيعيًا في العربية.
- source_word: οὕτως ἀγαπάτω ὡς ἑαυτόν
  choice: فليحبَّ ... هكذا كما يحبّ نفسه
  rationale: تحافظ صيغة لام الأمر على قوة الأمر، ويحفظ «هكذا» الإحالة إلى الكيفية المبيّنة في الكلام السابق، بينما يوضح الفعل المقدر في المقارنة المعنى العربي.
- source_word: ἡ δὲ γυνὴ
  choice: والزوجةُ
  rationale: يفيد δέ الانتقال إلى الطرف الثاني من الخلاصة، وتؤديه الواو بسلاسة في العربية؛ وγυνή تعني الزوجة هنا.
- source_word: ἵνα φοβῆται τὸν ἄνδρα
  choice: ولتَهَبِ الزوجةُ زوجَها
  rationale: «تهاب» تحفظ صلة اللفظ بالخوف والرهبة، لكنها في هذا السياق تتسع أيضًا للتوقير والاحترام، فلا تحصر المعنى في الفزع ولا تمحو توتر اللفظ الأصلي. وكُسرت الباء للتخلص من التقاء الساكنين عند وصلها بأداة التعريف.
theological_decisions:
- issue: دلالة φοβῆται في وصية زوجية
  choice: تَهَبْ
  alternative: توقّر / تحترم / تخاف
  rationale: الفعل اليوناني قد يدل على الخوف أو المهابة والتوقير بحسب السياق. «تهاب» تبقي هذا المجال الدلالي مفتوحًا، ولا تختزل العبارة في الرعب أو في الاحترام المجرد، وتشرح الحاشية المقصود السياقي.
- issue: التحديد الجندري المفرد في الوصية
  choice: زوجته ... الزوجة ... زوجها
  alternative: الزوجان / شريك الحياة
  rationale: يحافظ النص على صيغ الزوج والزوجة المحددة في اليونانية، من غير تعميم محايد يطمس بنية العبارة الأصلية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت لام الأمر لتأدية الأمر اليوناني، وأُبقيت الإحالة إلى الكلام السابق في «هكذا». وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان مباشرة.
