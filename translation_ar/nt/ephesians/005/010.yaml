  text: testing what is pleasing to the Lord;[a]
translation:
  language: ar
  text: مُميِّزين ما هو مُرضٍ للرب؛[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فاحصين» أو «متبيّنين» ما هو مُرضٍ للرب.
    reason: بدائل معجمية للفعل δοκιμάζω، تُظهر معنى الاختبار والتبيّن إلى جانب التمييز.
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: مُميِّزين
  rationale: اسم فاعل حالي يواصل سياق الحث، ويفيد الفحص والتبيّن بقصد الحكم على ما يرضي الرب. «مُميِّزين» عربية طبيعية وتحفظ المعنى التقويمي، مع ذكر البدائل في الحاشية.
- source_word: τί
  choice: ما
  rationale: 'تؤدي معنى أداة الاستفهام في سؤال غير مباشر: «ما هو مُرضٍ».'
- source_word: ἐστιν
  choice: هو
  rationale: ضمير فصل يؤدي وظيفة الربط في تركيب عربي واضح وطبيعي.
- source_word: εὐάρεστον
  choice: مُرضٍ
  rationale: ينقل معنى ما يبعث على الرضا أو القبول، وهو تعبير عربي معاصر وموجز يحفظ البعد العلاقي.
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: اللام تلائم تعلق الاسم «مُرضٍ» بمن يقع عليه الرضا، مع إبقاء لقب «الرب» دون تعيين مرجعه بما يتجاوز النص اليوناني.
theological_decisions:
- issue: مرجع κύριος
  choice: الرب
  alternative: الرب يسوع؛ الله
  rationale: يورد اليوناني لقب «الرب» بلا إضافة صريحة. قد يُفهم المرجع مسيانيًا في السياق البولسي، لكن الترجمة تُبقي الصياغة كما هي وتحفظ إمكان التفسير دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التركيب الاسمي المشارك في تدفق الجملة المحيطة، ووُضعت علامة الحاشية [a] في المتن.
