  text: لِكَيْ يُقَدِّسَهَا، بَعْدَ أَنْ طَهَّرَهَا بِغَسْلِ الْمَاءِ مَعَ الْكَلِمَةِ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بِغَسْلِ الْمَاءِ بِالْكَلِمَةِ». قد تدل العبارة اليونانية على الوسيلة أو المصاحبة.'
    reason: alternative_reading
  - marker: b
    text: تستحضر عبارة «غسل الماء مع الكلمة» على الأرجح صورة المعمودية، لكن النص اليوناني لا يحسم وحده مدى التحديد الأسراري في الإشارة.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: لِكَيْ
  rationale: أداة غاية تحفظ بوضوح دلالة القصد في اليونانية.
- source_word: αὐτὴν
  choice: ها / إِيَّاهَا
  rationale: ضمير مؤنث مفرد يعود في السياق إلى الكنيسة؛ أُلحق بالفعل أولًا ثم أُظهر بعد اسم الفاعل لوضوح المفعول المفهوم.
- source_word: ἁγιάσῃ
  choice: يُقَدِّسَهَا
  rationale: يحفظ معنى جعلها مقدسة أو تخصيصها لله، كما يحفظ الصلة اللفظية بمفهوم القداسة.
- source_word: καθαρίσας
  choice: مُطَهِّرًا إِيَّاهَا
  rationale: صيغة الحال العربية تمثل اسم الفاعل اليوناني وتحافظ على علاقته بالفعل الرئيس من غير حسم زائد لدقة الترتيب الزمني.
- source_word: τῷ λουτρῷ
  choice: بِغَسْلِ
  rationale: الباء تؤدي معنى الوسيلة في حالة الداتيف، و«غسل» طبيعي في العربية ويحفظ صورة الاغتسال.
- source_word: τοῦ ὕδατος
  choice: الْمَاءِ
  rationale: الإضافة «غسل الماء» تقابل التركيب الإضافي اليوناني من غير تفسير زائد لطبيعة العلاقة.
- source_word: ἐν ῥήματι
  choice: مَعَ الْكَلِمَةِ
  rationale: «مع» تحفظ احتمال المصاحبة أو الوسيلة ولا تحسم تعلق العبارة أو معناها الطقسي؛ والتعريف ملائم لقول معروف في السياق.
- source_word: ῥήματι
  choice: الْكَلِمَةِ
  rationale: يحفظ اتساع معنى اللفظة، التي قد تدل على كلمة أو قول أو رسالة، من غير تخصيصها بالإنجيل أو بصيغة منطوقة بعينها.
theological_decisions:
- issue: علاقة التطهير وغسل الماء والكلمة في سياق قد يحمل إيحاءً معموديًا
  choice: الإبقاء على صورة «غسل الماء مع الكلمة» من غير تحديد مذهب أسراري بعينه.
  alternative: صياغة تصرّح بأنها المعمودية كسرّ، أو تجعل الغسل مجازًا محضًا.
  rationale: تستدعي العبارة على الأرجح صورة المعمودية، لكن اليونانية وحدها لا تحسم مقدار التحديد الأسراري؛ لذلك تُحفظ الصورة والتوتر اللاهوتي.
- issue: دلالة ῥήματι
  choice: الْكَلِمَةِ
  alternative: الرِّسَالَةِ أو الْقَوْلِ الْمَنْطُوقِ
  rationale: قد يشير السياق إلى رسالة معلنة أو قول مرتبط بالغسل، لكن اللفظة أوسع، واختيار «الكلمة» لا يضيّق معناها بلا مسوغ.
- issue: العلاقة النحوية لعبارة ἐν ῥήματι
  choice: مَعَ الْكَلِمَةِ
  alternative: بِالْكَلِمَةِ
  rationale: يمكن فهم ἐν على أنها وسيلة أو مصاحبة؛ فالمتن يحافظ على الاحتمالين، وتذكر الحاشية البديل الأداتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «يقدسها» للمحافظة على الصلة بمفهوم القداسة، و«مطهرًا إياها» للمحافظة قدر الإمكان على البنية الحالية في الأصل، مع تجنب فرض قراءة طائفية.
