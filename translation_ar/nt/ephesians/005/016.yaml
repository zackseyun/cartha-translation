  rationale: تفيد الصيغة اليونانية حرفيًا الشراء أو الاستنقاذ بالشراء، لكنها في هذا السياق تحث على الانتفاع الكامل بالوقت المتاح. و«مُغتنِمين» تعبير عربي طبيعي يحفظ معنى اقتناص الفرصة من غير أن يوحي خطأً بأن المقصود افتداء خلاصي.
- source_word: καιρόν
  choice: الوقت
  rationale: يدل اللفظ غالبًا على الوقت الملائم أو الفرصة السانحة، لكن «الوقت» يحافظ على الإيجاز والمألوف، بينما ينقل فعل «مُغتنِمين» بُعد الفرصة المناسبة.
- source_word: ὅτι
  choice: لأن
  rationale: تُدخل سبب الوصية بوضوح في العربية المعاصرة.
- source_word: αἱ ἡμέραι
  choice: الأيام
  rationale: نقل مباشر للجمع من غير توسيع تفسيري إلى «العصر» أو «الظروف».
- source_word: πονηραί
  choice: شريرة
  rationale: تحفظ البعد الأخلاقي القوي في اللفظ اليوناني، بخلاف ألفاظ مثل «عصيبة» التي قد تختزله في المشقة.
theological_decisions:
