  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: ar
  text: فانتبهوا إذًا بكل دقة إلى كيفية سلوككم[a]، لا كغير الحكماء بل كالحكماء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «كيف تمشون». يستعمل النص المشي استعارةً لطريقة العيش والسلوك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: فانتبهوا
  rationale: فعل أمر موجَّه إلى جماعة، ويدعو إلى التيقّظ والتدقيق في السلوك؛ و«فانتبهوا» أوضح في العربية الحديثة من الترجمة الحرفية «انظروا» في هذا السياق.
- source_word: οὖν
  choice: إذًا
  rationale: تحفظ معنى الاستنتاج والربط بما سبق، مع ملاءمتها لموضعها في الجملة العربية.
- source_word: ἀκριβῶς πῶς
  choice: بدقّة إلى كيف
  rationale: تحافظ على تشديد النص على التدقيق في كيفية السلوك، ولا تختزل العبارة إلى تحذير عام.
- source_word: περιπατεῖτε
  choice: تسلكون
  rationale: «تسلكون» تعبير عربي مفهوم عن طريقة العيش والتصرّف، ويحفظ استعارة المشي الشائعة في خطاب بولس بدل تسويتها إلى «تعيشون» فقط.
- source_word: μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί
  choice: لا كغير حكماء، بل كحكماء
  rationale: يحفظ التقابل المتوازي بين انعدام الحكمة والحكمة، من غير تقوية ἄσοφοι إلى معنى «الحمقى» الأشد.
theological_decisions:
- issue: الدلالة التمثيلية لصيغتي الجمع المذكر ἄσοφοι وσοφοί
  choice: غير حكماء ... حكماء
  alternative: أناس غير حكماء ... أناس حكماء
  rationale: صيغة جمع المذكر في العربية تؤدي هنا بصورة طبيعية الخطاب الموجَّه إلى جماعة المؤمنين كلها، ولا تستلزم إضافة «رجال» غير الموجودة اسمًا في اليونانية.
- issue: استعارة السير بوصفها طريقة الحياة
  choice: تسلكون
  alternative: تعيشون / تتصرفون
  rationale: يحفظ الاختيار الصورة الأصلية مع بقاء المعنى الأخلاقي والسلوكي واضحًا، من غير حصره في فعل المشي الحرفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت بنية الأمر والتقابل البلاغي، كما حُفظت استعارة السير بصيغة «تسلكون»، مع توضيحها في الحاشية.
