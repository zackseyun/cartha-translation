  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: ar
  text: أَمَّا الفجورُ الجنسيُّ، وأيُّ نجاسةٍ أو طمعٍ[c]، فلا يُذكَرْ حتى بينكم، كما يليق بالقدِّيسين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «القديسون» هنا هم المؤمنون بوصفهم شعب الله المقدس، وليس المقصود فئة أُعلنت قداستها في زمن لاحق.
    reason: cultural_note
  - marker: c
    text: يمكن ترجمة «الطمع» أيضًا بـ«الجشع». ولا يقتضي اللفظ اليوناني حصره في الشهوة الجنسية.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορνεία
  choice: الزِّنى
  rationale: يدل اللفظ اليوناني على السلوك الجنسي غير المشروع بوجه عام. و«الزنى» هو المقابل العربي الكتابي المألوف، ويُفهم هنا بوصفه اسمًا جامعًا للفجور الجنسي، لا مقصورًا على صورة واحدة منه.
- source_word: δὲ
  choice: أَمَّا
  rationale: أداة انتقال ذات مسحة مقابلة مع الكلام السابق؛ و«أمّا» تنقل هذا التحول طبيعيًا في العربية.
- source_word: ἀκαθαρσία πᾶσα
  choice: كلُّ نجاسةٍ
  rationale: تحافظ العبارة على شمول πᾶσα وعلى الدلالة الأخلاقية الواسعة لـἀκαθαρσία، من غير حصرها في النجاسة الطقسية.
- source_word: ἢ
  choice: أو
  rationale: تنقل أداة العطف التفصيلية اليونانية كما هي، من غير تحويلها إلى الواو.
- source_word: πλεονεξία
  choice: طمعٍ
  rationale: يعبر «الطمع» بوضوح عن الرغبة الجشعة في المزيد والاستحواذ، من غير تضييق المعنى إلى الشهوة الجنسية وحدها.
- source_word: μηδὲ ὀνομαζέσθω
  choice: فلا يُذكَرْ حتى
  rationale: صيغة النهي المبني للمجهول مع معنى «حتى/ولا حتى» تفيد منعًا قويًا. و«يُذكر» طبيعية في العربية وتحفظ احتمال الإشارة إلى الحديث عن هذه الرذائل أو وجودها المعروف داخل الجماعة.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: السياق جماعي، فالمراد وسط جماعة المؤمنين، لا مجرد ما في باطن الأفراد.
- source_word: καθὼς πρέπει
  choice: كما يليق
  rationale: صياغة عربية موجزة وطبيعية تنقل معيار الملاءمة الأخلاقية في الأصل.
- source_word: ἁγίοις
  choice: بالقدِّيسين
  rationale: مصطلح رسولي مألوف للمؤمنين بوصفهم شعب الله المكرس له، مع إيضاح مدلوله في الحاشية منعًا لفهمه وفق مفهوم التطويب اللاحق.
theological_decisions:
- issue: دلالة πλεονεξία ضمن قائمة تضم خطايا جنسية
  choice: الطمع بالمعنى الأخلاقي العام
  alternative: الجشع الجنسي أو الشهوة النهمة
  rationale: مع أن السياق يتناول السلوك الجنسي، فإن اللفظ نفسه أوسع في الاستعمال البولسي، ولا يسوغ تقييده بالشهوة الجنسية من دون قرينة نصية صريحة.
- issue: مدلول ἁγίοις
  choice: القديسون، أي المؤمنون بوصفهم شعب الله المقدس
  alternative: المقدسون أو شعب الله المقدس
  rationale: تحافظ «القديسون» على المصطلح اللاهوتي الكنسي الموجز، بينما تمنع الحاشية إسقاط مفهوم طبقة جرى إعلان قداستها في عصور لاحقة.
- issue: قوة μηδὲ ὀνομαζέσθω
  choice: نهي عن أن تُذكر هذه الأمور حتى بين الجماعة
  alternative: نهي عن وجود هذه الأمور أو اشتهار وقوعها بينهم
  rationale: يحمل التعبير معنى لفظيًا يتعلق بالتسمية أو الذكر، وقد يُفهم بلاغيًا أيضًا على أنه نهي عن حضور هذه الرذائل حضورًا يجعلها معروفة بينهم؛ لذلك أُبقي النص قريبًا من اللفظ وأثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «أمّا» للانتقال، و«الزنى» كمصطلح عربي كتابي جامع في هذا السياق، مع حواشٍ تحفظ سعة الألفاظ واحتمال التعبير اليوناني من غير تفسير مذهبي زائد.
