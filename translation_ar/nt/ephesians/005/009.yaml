lexical_decisions:
- source_word: γὰρ
  choice: لأن
  rationale: تفيد الأداة تعليل الحث السابق، و«لأن» تنقل هذه الصلة بوضوح في العربية.
- source_word: καρπὸς
  choice: ثمر
  rationale: يحافظ اللفظ على صورة الثمر التي تعبّر عن النتائج الأخلاقية والروحية.
- source_word: τοῦ φωτός
  choice: النور
  rationale: ترجمة مباشرة للمضاف إليه المعرّف، مع إحالة سياقية إلى وصف المؤمنين بأنهم نور في الرب في الآية السابقة.
- source_word: ἐν
  choice: يكون في
  rationale: أُضيف فعل الكينونة الذي تقتضيه العربية، مع إبقاء معنى «في» الذي يدل هنا على المجال أو المظهر الذي يوجد فيه الثمر.
- source_word: πάσῃ
  choice: كل
  rationale: تفيد الشمول مع الاسم المجرّد، وتشمل الصفات المنسّقة في السياق.
- source_word: ἀγαθωσύνῃ
  choice: صلاح
  rationale: ينقل معنى الخير الأخلاقي والإحسان من غير حصره في اللطف وحده.
- source_word: δικαιοσύνῃ
  choice: برّ
  rationale: «برّ» هو المقابل العربي المألوف للمعنى الأخلاقي الواسع، مع حفظ احتمال «عدل» في الحاشية.
- source_word: ἀληθείᾳ
  choice: حق
  rationale: يحفظ المجال الواسع للكلمة، بما فيه الحقيقة والصدق والاستقامة.
theological_decisions:
- issue: القراءة النصية في عبارة المضاف إليه
  choice: ثمر النور
  alternative: ثمر الروح
  rationale: نص SBLGNT يقرأ φωτός، وهي قراءة تنسجم مع السياق المباشر عن السلوك كأبناء نور؛ وتُذكر قراءة «الروح» في الحاشية لأنها واردة في بعض المخطوطات.
- issue: دلالة δικαιοσύνη
  choice: برّ
  alternative: عدل
  rationale: قد تدل الكلمة البولسية على البر أو العدل؛ اختير «برّ» في المتن مع إبقاء البديل الدلالي المهم في الحاشية.
- issue: دلالة ἐν مع قائمة الصفات
  choice: يكون في
  alternative: يتمثّل في
  rationale: تحافظ الصياغة المختارة على حرف الجر في الأصل ولا تحسم إن كان يدل على المجال أو التجلي، بينما يوضح البديل معنى الظهور في هذه الصفات.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارة «الثمر»، واستُعملت ألفاظ دينية وأخلاقية مألوفة من غير إدخال تفسير طائفي.
