lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: خاضعين
  rationale: اسم فاعل حالي يحافظ على الصيغة الوصفية المتصلة بالسياق السابق، من غير أن يضيف معنى انعكاسيًا صريحًا غير موجود في الصيغة اليونانية.
- source_word: ἀλλήλοις
  choice: بعضكم لبعض
  rationale: تعبير عربي واضح وطبيعي ينقل دلالة ضمير التبادل في صيغة الجمع.
- source_word: ἐν
  choice: في
  rationale: يحافظ على الدلالة الأقرب لحرف الجر، سواء فُهمت على أنها المجال أو الكيفية، وهو تعبير مستقيم في العربية.
- source_word: φόβῳ
  choice: خوف
  rationale: ينقل المعنى المعجمي الأساسي ويحفظ قوة العبارة وتوترها اللاهوتي، بدل تليينها في المتن إلى التوقير وحده.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: المقابل العربي الطبيعي للقب Χριστός، ويحافظ هنا على دلالته اللقبية من غير تحويله إلى اسم منقول صوتيًا.
theological_decisions:
- issue: دلالة «خوف المسيح»
  choice: 'الإبقاء على تركيب الإضافة: «في خوف المسيح»'
  alternative: «في توقير المسيح» أو «في مهابة المسيح»؛ وقد يُفهم أيضًا أنه خوف مصدره المسيح
  rationale: تركيب الإضافة العربي، مثل المضاف إليه اليوناني، لا يحسم وحده هل الخوف موجَّه إلى المسيح أم ناشئ عنه، مع أن الفهم الأرجح سياقيًا هو الخوف التوقيري الموجَّه إليه. وهكذا تُحفظ قوة لفظ «الخوف» والقدر الحقيقي من الغموض.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: لا يوجد في العربية الفصحى مقابل شائع منفصل يطابق التفريق الإنجليزي بين Messiah وChrist
  rationale: «المسيح» هو اللقب العربي الراسخ والمفهوم، ويؤدي معنى Χριστός بوصفه لقبًا من غير استيراد تفريق إنجليزي مصطنع إلى العربية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. أُبقيت صيغة «خاضعين» لتظهر صلة العبارة نحويًا بما قبلها، كما أُبقي تركيب «خوف المسيح» موجزًا وقريبًا من بنية الأصل.
