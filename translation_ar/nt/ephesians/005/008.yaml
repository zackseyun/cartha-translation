- source_word: νῦν δὲ
  choice: أما الآن
  rationale: تُظهر المقابلة القوية بين الحالة السابقة والحاضرة بوضوح.
- source_word: φῶς
  choice: نور
  rationale: حُفظ الاسم الخبري المجازي كما في الأصل، من غير تخفيفه إلى «في النور» أو «مستنيرين».
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحفظ العبارة مجال الهوية الجديدة وعلاقتها بالرب، وتوافق الاستعمال البولسي المألوف.
- source_word: ὡς
  choice: كـ
  rationale: تدل على السلوك الموافق لهويتهم بوصفهم أبناء النور.
- source_word: τέκνα φωτός
  choice: أبناء النور
  rationale: «أبناء» جمع شامل شائع في هذا التركيب العربي ويحفظ الإضافة التصويرية ذات الدلالة الوصفية.
- source_word: περιπατεῖτε
  choice: فاسلكوا
  rationale: فعل أمر حاضر في اليونانية واستعارة أخلاقية بولسية شائعة؛ «اسلكوا» تحفظ الصورة وتُفهم بمعنى عيشوا وتصرفوا.
theological_decisions:
- issue: لغة الهوية المجازية في «كنتم قبلاً ظلمة... فأنتم نور»
  choice: الإبقاء على الاستعارتين الاسميتين «ظلمة» و«نور»
  alternative: كنتم في الظلمة، أما الآن ففي النور؛ أو كنتم مظلمين والآن مستنيرين
  rationale: يستعمل اليوناني اسمي خبر بلا حرف جر، بما يشدد على تحول الهوية والحالة الأخلاقية الروحية، لا على مجرد البيئة أو الخبرة.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ الرنين اللاهوتي والاستعمال المعتاد في العهد الجديد من غير تضييق المعنى.
