- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός، وهي تُبقي دلالته اللقبية ولا تجعله مجرد اسم عائلة.
- source_word: τῷ θεῷ καὶ πατρί
  choice: لله الآب
  rationale: اللام تبيّن متلقّي الشكر، و«الله الآب» صياغة عربية واضحة وطبيعية للعطف اليوناني تحت أداة تعريف واحدة.
theological_decisions:
