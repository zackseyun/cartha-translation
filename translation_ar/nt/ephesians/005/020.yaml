  choice: المسيح
  alternative: الكريستوس / المسيح المنتظر
  rationale: «المسيح» هو المقابل العربي الموروث والدقيق للقب، ويحفظ معناه اللاهوتي دون إدخال شرح تفسيري في المتن.
- issue: 'مرجع πάντων: الأشياء أم الأشخاص'
  choice: كلّ شيء
  alternative: الجميع
  rationale: السياق يرجّح شمول الأحوال والأمور التي يُقدَّم الشكر عليها، مع بقاء احتمال الإشارة إلى الأشخاص قائمًا صرفيًا؛ لذا حُفظ في الحاشية.
