  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف ترجمات كثيرة الفعل المفهوم من الآية 21، فتقرأ: «أيتها الزوجات، اخضعن لأزواجكنّ كما للرب». أمّا النص اليوناني لهذه الآية نفسها فتركيبه ناقص، ويتعلّق نحويًا بالعبارة السابقة.'
    reason: بيان الفعل المقدَّر والقراءة البديلة
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: أَيَّتُهَا الزَّوْجَاتُ
  rationale: في سياق العلاقات الزوجية، تدلّ γυνή هنا على الزوجات لا على النساء عمومًا. وصيغة النداء العربية تنقل توجيه الكلام إليهن بوضوح.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: لِأَزْوَاجِكُنَّ أَنْتُنَّ
  rationale: يدلّ ἀνήρ في هذا السياق على الزوج، وتؤدي اللام معنى صيغة المجرور اليونانية المرتبطة بالفعل المفهوم من الآية السابقة. وأُبقي توكيد ἰδίοις بلفظ «أنتنّ» بعد ضمير الخطاب، أي أزواج كل واحدة منكن، من غير إضافة معنى الملكية المطلقة.
- source_word: ὡς
  choice: كَمَا
  rationale: تنقل أداة المقارنة ببساطة، من غير حسم مدى التشبيه أو طبيعته بما يتجاوز النص.
- source_word: τῷ κυρίῳ
  choice: لِلرَّبِّ
  rationale: يحافظ على لقب «الرب» وعلى التوازي النحوي مع «لأزواجكنّ»، والمقصود في السياق البولسي هو الرب يسوع.
- source_word: implicit verb from context
  choice: حذف الفعل في المتن
  rationale: لا تحتوي صياغة هذه الآية في SBLGNT على فعل صريح، بل تعتمد على ὑποτασσόμενοι في الآية 21؛ لذلك حُفظ التركيب الناقص، مع بيان الفعل المفهوم في الحاشية.
theological_decisions:
- issue: هل يُضاف فعل «اخضعن» في متن الآية مع أنه غير مذكور فيها صراحة؟
  choice: عدم إضافته في المتن، وحفظ اعتماد العبارة على الآية السابقة.
  alternative: أَيَّتُهَا الزَّوْجَاتُ، اخْضَعْنَ لِأَزْوَاجِكُنَّ كَمَا لِلرَّبِّ.
  rationale: إضافة الفعل تجعل العربية مستقلة وأسلس، وهي مفهومة من السياق، لكنها تخفي كون النص اليوناني في هذه الآية تركيبًا ناقصًا يستمد فعله من الآية 21. إبقاء الحذف يحفظ الصلة النحوية والتفسيرية بين الآيتين ولا يجعل اللفظ المقدر صريحًا.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. حُفظ التركيب الناقص عمدًا، ولذلك تبدو العبارة معتمدة على الآية السابقة كما في اليونانية. استُعمل التشكيل لتوضيح الإعراب والقراءة، ويمكن تخفيفه وفق سياسة تنضيد النسخة الكاملة.
