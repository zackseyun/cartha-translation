  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: ar
  text: 'فإنكم تعلمون هذا، وتدركون أن كل زانٍ أو نجس أو طمّاع، أي: عابد أوثان، ليس له ميراث في ملكوت المسيح والله.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: تعلمون هذا وتدركون
  rationale: يحافظ على فعل المعرفة وعلى دلالة اسم الفاعل المؤكِّدة، بصياغة عربية واضحة من غير اختزال العبارة إلى مجرد «تعلمون يقينًا».
- source_word: πόρνος
  choice: زانٍ
  rationale: لفظ عربي واضح يدل هنا على الشخص المتصف بالفجور الجنسي، وهو أنسب من تعبير مطوّل داخل تعداد الرذائل.
- source_word: ἀκάθαρτος
  choice: نجس
  rationale: يحفظ صورة النجاسة الأخلاقية وما فيها من صدى ديني، ولا يحصر المعنى في عدم النظافة الجسدية.
- source_word: πλεονέκτης
  choice: طمّاع
  rationale: يدل على الشخص المتصف بالجشع والطمع، وهو لفظ معاصر ومفهوم.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: وهو عابد للأوثان
  rationale: تُفهم العبارة في السياق وصفًا للشخص المذكور أخيرًا، أي الطمّاع، مع إثبات الاحتمال الأقرب إلى الصيغة اليونانية المحايدة في الحاشية.
- source_word: κληρονομίαν
  choice: ميراث
  rationale: يحفظ الدلالة العهدية والأخروية للمصطلح البولسي أفضل من «نصيب» وحدها.
- source_word: βασιλείᾳ
  choice: ملكوت
  rationale: مصطلح كتابي عربي مألوف يشمل سلطان الملك ومجاله.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب Χριστός بوصفه لقبًا، وهو التعبير العربي الطبيعي والدقيق.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: المسيح والله
  rationale: يحافظ على العطف المباشر في اليونانية من غير فرض نتيجة نحوية أو لاهوتية تتجاوز صياغة النص.
theological_decisions:
- issue: مرجع ὅ ἐστιν εἰδωλολάτρης
  choice: 'صيغت في المتن وصفًا للشخص المذكور، ولا سيما الطمّاع: «وهو عابد للأوثان».'
  alternative: «وهذا هو عبادة الأوثان»، في إشارة إلى الطمع بوجه خاص.
  rationale: ضمير الوصل اليوناني محايد مع أن أسماء الأشخاص السابقة مذكرة، مما يترك توترًا نحويًا حقيقيًا. يؤيد السياق والموازاة في كولوسي 3:5 ربط الطمع بعبادة الأوثان؛ لذلك اختيرت الصياغة الشخصية الطبيعية في المتن، وحُفظ الاحتمال المجرد في الحاشية.
- issue: معنى الحرمان من الميراث
  choice: «ليس له ميراث» بوصفها عبارة حالية.
  alternative: «لن يرث الملكوت».
  rationale: الفعل اليوناني οὐκ ἔχει في الزمن الحاضر، فحُفظت دلالته بدل تحويل التحذير إلى صيغة مستقبلية.
- issue: العلاقة في عبارة «المسيح والله»
  choice: 'الإبقاء على المضافين المعطوفين: «ملكوت المسيح والله».'
  alternative: صياغة تفسيرية تحسم العبارة على أساس دعوى نحوية مسيحية محددة.
  rationale: النص يجمع «المسيح» و«الله» في تركيب وثيق، لكن الترجمة لا ينبغي أن تفرض على القارئ نتيجة خلافية أخص مما تقوله الصياغة اليونانية صراحة.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ووقورة. استُخدم «ملكوت» للمصطلح الكتابي، و«المسيح» للقب Χριστός. حافظت الصياغة على تتابع تعداد الرذائل وعلى قوة التحذير بصيغة الحاضر.
