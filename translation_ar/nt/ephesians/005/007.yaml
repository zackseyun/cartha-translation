id: EPH.5.7
reference: Ephesians 5:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: ar
  text: فلا تصيروا شركاء لهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: لا تشاركوهم أو لا تكونوا من المشتركين معهم. ويشير السياق إلى الاشتراك في سلوكهم الخاطئ أو في عواقبه.'
    reason: بيان البدائل المعجمية والدلالة السياقية من غير إدخالها في المتن.
lexical_decisions:
- source_word: μὴ
  choice: لا
  rationale: أداة نهي مناسبة مع الفعل المضارع، وتنقل المنع بوضوح في العربية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء الاستنتاجية الطبيعية تربط النهي بما سبقه من تحذير في الآيات 3–6، من غير إثقال الأسلوب.
- source_word: γίνεσθε
  choice: تصيروا
  rationale: تحفظ معنى الدخول في حالة أو التحول إليها، وهو أدق من «تكونوا» ذات الدلالة الحالية الأوسع.
- source_word: συμμέτοχοι
  choice: شركاء
  rationale: لفظ عربي واضح ومعاصر يدل على الاشتراك مع آخرين، مع إبقاء مجال الاشتراك غير محدد كما في اليونانية.
- source_word: αὐτῶν
  choice: لهم
  rationale: يتعلق الضمير بـ«شركاء»، والتعبير «شركاء لهم» يحفظ الإحالة إلى الأشخاص من غير إضافة «في أعمالهم» إلى المتن.
theological_decisions:
- issue: نطاق المشاركة التي تفيدها عبارة συμμέτοχοι αὐτῶν
  choice: إبقاء النهي عامًا عن أن يصير المخاطبون شركاء لأولئك الأشخاص، مع عدم تحديد مجال الشراكة في المتن.
  alternative: «لا تشاركوهم في أعمالهم» أو «لا تكونوا مشتركين في هذه الأمور».
  rationale: النص اليوناني يذكر ضمير الأشخاص «لهم/إياهم»، ولا يصرح بـ«أعمالهم» أو «هذه الأمور». والسياق يوحي بالمشاركة في سلوكهم الخاطئ أو في عاقبته، لكن الترجمة لا ينبغي أن تحسم ما أبقاه النص ضمنيًا.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة تحذيرية كريمة. استُخدمت الفاء لربط الاستنتاج بالسياق السابق، و«تصيروا» للمحافظة على دلالة γίνεσθε التحولية.
