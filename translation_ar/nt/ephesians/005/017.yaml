  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: ar
  text: لِذلِكَ، لا تَصيروا حَمْقى، بل افهموا ما هي مشيئةُ الربّ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِذلِكَ
  rationale: تفيد العبارة التعليل أو الاستنتاج بالإحالة إلى الوصية السابقة، و«لذلك» تنقل هذا الربط بوضوح وإيجاز.
- source_word: μὴ γίνεσθε
  choice: لا تَصيروا
  rationale: يحمل الفعل γίνομαι معنى الدخول في حالة أو الصيرورة، ولذلك تحافظ «لا تصيروا» على دلالته الحركية بدل تحويله إلى مجرد حالة ثابتة.
- source_word: ἄφρονες
  choice: حَمْقى
  rationale: تدل الكلمة على الافتقار إلى الفهم وحسن التقدير العملي، و«حمقى» تقابل بوضوح الأمر اللاحق بالفهم.
- source_word: ἀλλὰ
  choice: بل
  rationale: تنقل «بل» التقابل القوي بين النهي والأمر الإيجابي نقلاً عربيًا طبيعيًا.
- source_word: συνίετε
  choice: افهموا
  rationale: يفيد الفعل الفهم والإدراك، و«افهموا» واضحة ومباشرة وتبقي مجال التمييز المتأني الذي يقتضيه السياق.
- source_word: τί τὸ θέλημα
  choice: ما هي مشيئةُ
  rationale: «ما هي» صياغة عربية واضحة لمضمون ما ينبغي فهمه، و«مشيئة» هي المقابل المألوف والدقيق لـ θέλημα في هذا السياق.
- source_word: τοῦ κυρίου
  choice: الربّ
  rationale: تحافظ الترجمة على لقب κύριος كما ورد، من غير أن تعيّن مرجعه باسم غير مذكور صراحة في الآية.
theological_decisions:
- issue: مرجع «الربّ» (τοῦ κυρίου)
  choice: الإبقاء على «الربّ» من غير إضافة اسم يسوع
  alternative: الرب يسوع؛ الله
  rationale: يرجح السياق في أفسس الإشارة إلى يسوع، لكن النص نفسه يذكر «الرب» فقط؛ لذا تحفظ الصياغة مقدار التحديد الموجود في اليونانية.
- issue: قوة النهي μὴ γίνεσθε
  choice: لا تَصيروا
  alternative: لا تكونوا؛ كفّوا عن أن تكونوا
  rationale: تحافظ «لا تصيروا» على معنى الانتقال إلى حالة، ولا تفترض أن المخاطَبين صاروا بالفعل حمقى ولا تجعل النهي أمرًا بالكف بالضرورة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة من غير تكلّف. استُعملت «بل» للمقابلة الطبيعية، وحُفظت بنية الصيرورة في «لا تصيروا». لا توجد حاشية لأن البديل «لا تكونوا» ممكن لكنه لا يقتضي تنبيهًا نصيًا في هذا الموضع.
