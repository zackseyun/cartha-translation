base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: ar
  text: «لهذا السبب[a] سيترك الرجل أباه وأمه، ويلتصق بزوجته، ويصير الاثنان جسدًا واحدًا».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبسبب هذا». تؤدي العبارة اليونانية ἀντὶ τούτου هنا معنى سببيًا في اقتباس سفر التكوين، لا معنى «عوضًا عن هذا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: لهذا السبب
  rationale: تؤدي العبارة في اقتباس تكوين 2:24 وظيفة سببية أو نتيجةً لما سبق، ولذلك فهذه الصياغة العربية أوضح من الترجمة الحرفية التي قد توحي بالاستبدال.
- source_word: καταλείψει
  choice: سيترك
  rationale: يحافظ فعل المستقبل على زمن الأصل، ويدل هنا على مغادرة بيت الوالدين لتكوين رابطة زوجية جديدة، من غير إيحاء بالهجر أو النبذ.
- source_word: ἄνθρωπος
  choice: الرجل
  rationale: مع أن اللفظة قد تعني الإنسان عمومًا، فإن اقترانها هنا بزوجته في سياق الزواج يحدد المقصود بأنه الرجل.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: أباه وأمه
  rationale: صياغة عربية طبيعية تحفظ علاقة النسب التي يفيدها السياق والضمير اللاحق.
- source_word: προσκολληθήσεται
  choice: يلتصق بزوجته
  rationale: ينقل معنى الارتباط الوثيق والثابت، ويحافظ على صدى لغة اقتباس سفر التكوين. وعطفه على «سيترك» يجعل دلالة الاستقبال مفهومة في العربية.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: بزوجته
  rationale: السياق الزوجي يقتضي معنى «الزوجة» لا المعنى العام «المرأة».
- source_word: ἔσονται οἱ δύο
  choice: ويصير الاثنان
  rationale: الفعل اليوناني يعني حرفيًا «سيكونان»، لكن تركيب الغاية مع «جسدًا واحدًا» يدل على الدخول في حالة الاتحاد؛ و«يصير» يؤدي ذلك طبيعيًا، مع بقاء دلالة المستقبل بالعطف على «سيترك».
- source_word: εἰς σάρκα μίαν
  choice: جسدًا واحدًا
  rationale: «الجسد» هو المقابل العربي الطبيعي للفظة σάρξ في هذا الاقتباس العهدي عن الاتحاد الزوجي، ولا تحمل هنا معنى الطبيعة الخاطئة.
theological_decisions:
- issue: اللغة المحددة للجنس في اقتباس الزواج
  choice: الرجل ... زوجته
  alternative: الإنسان ... قرينه
  rationale: يعرض النص زوجًا ذكرًا وزوجةً في اقتباس تكوين 2:24، ولذلك حُفظ التحديد الجنسي في الأصل من غير تعميم أو تحييد.
- issue: دلالة σάρξ في عبارة εἰς σάρκα μίαν
  choice: جسدًا واحدًا
  alternative: كيانًا واحدًا
  rationale: اللفظة هنا من لغة سفر التكوين عن الاتحاد الزوجي، لا عن «الجسد» بوصفه طبيعة خاطئة؛ لذا حُفظ التعبير الجسدي الملموس من غير تسطيحه إلى معنى تجريدي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة، تحافظ على إيقاع الاقتباس الكتابي. وُضع هامش البديل عند العبارة التي يشرحها مباشرة، لا عند «زوجته».
