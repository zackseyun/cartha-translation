  to: لِكَيْ يُقَدِّمَ هُوَ بِنَفْسِهِ الْكَنِيسَةَ لِنَفْسِهِ فِي بَهَاءٍ[a]، لَا بُقْعَةَ فِيهَا وَلَا تَجَعُّدَ وَلَا شَيْئًا مِنْ هَذَا الْقَبِيلِ[b]، بَلْ لِكَيْ تَكُونَ مُقَدَّسَةً وَبِلَا عَيْبٍ[c].
