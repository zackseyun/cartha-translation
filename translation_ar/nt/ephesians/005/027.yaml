  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: ar
  text: لِكَيْ يُقَدِّمَ هُوَ بِنَفْسِهِ الْكَنِيسَةَ لِنَفْسِهِ فِي بَهَاءٍ[a]، لَا بُقْعَةَ فِيهَا وَلَا تَجَعُّدَ وَلَا شَيْئًا مِنْ هَذَا الْقَبِيلِ[b]، بَلْ لِكَيْ تَكُونَ مُقَدَّسَةً وَبِلَا عَيْبٍ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «مَجِيدَةً»؛ فالصفة اليونانية قد تُصاغ صفةً للكنيسة أو حالًا تكون عليها: «في بهاء».'
    reason: lexical_alternative
  - marker: b
    text: أو «ولا أيَّ شيءٍ من أمثال ذلك».
    reason: lexical_alternative
  - marker: c
    text: أو «وبريئةً من اللوم»؛ وقد تدل الكلمة اليونانية على الخلو من العيب أو على عدم استحقاق اللوم.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: يُقَدِّمَ
  rationale: ينقل معنى الإحضار والتقديم في مقام رسمي، ويلائم صورة تقديم العروس من غير زيادة تفسيرية.
- source_word: αὐτὸς
  choice: هُوَ بِنَفْسِهِ
  rationale: يحفظ توكيد الضمير اليوناني الصريح على أن الفاعل يقوم بالأمر بنفسه.
- source_word: ἑαυτῷ
  choice: إِلَى نَفْسِهِ
  rationale: يحفظ القوة الانعكاسية وصورة أن المسيح يقدّم الكنيسة إلى نفسه، من غير حسم الدلالة اللاهوتية الأوسع.
- source_word: ἔνδοξον
  choice: فِي بَهَاءٍ
  rationale: يصوغ الصفة بوصفها حالًا تكون عليها الكنيسة عند تقديمها، مع إبقاء احتمال ترجمتها بصفة مثل «مجيدة».
- source_word: ἐκκλησίαν
  choice: الْكَنِيسَةَ
  rationale: هو المقابل العربي المستقر هنا لجماعة المؤمنين بوصفها كيانًا جامعًا.
- source_word: μὴ ἔχουσαν
  choice: لَا بُقْعَةَ فِيهَا
  rationale: تعبير عربي طبيعي يصف حال الكنيسة مع الحفاظ على النفي الوصفي في العبارة اليونانية.
- source_word: σπίλον
  choice: بُقْعَةَ
  rationale: يحفظ الصورة الحسية المباشرة ويلائم اقترانه بالتجعّد.
- source_word: ῥυτίδα
  choice: تَجَعُّدَ
  rationale: مقابل مباشر يحفظ صورة الجمال الجسدي المرتبطة بسياق العروس.
- source_word: ἤ τι τῶν τοιούτων
  choice: وَلَا شَيْءَ مِنْ هَذَا الْقَبِيلِ
  rationale: يحفظ التعميم المفتوح بعد المثالين بصياغة عربية واضحة.
- source_word: ἀλλ’ ἵνα ᾖ
  choice: بَلْ لِكَيْ تَكُونَ
  rationale: يبيّن المقابلة بين انتفاء النقائص والغاية الإيجابية من غير تحويل الغاية إلى تقرير زمني أو عقائدي زائد.
- source_word: ἁγία
  choice: مُقَدَّسَةً
  rationale: ينقل معنى القداسة بصيغة تلائم الكنيسة، ويحافظ على الثقل الديني للكلمة.
- source_word: ἄμωμος
  choice: بِلَا عَيْبٍ
  rationale: يحفظ معنى الخلو من العيب، بما يشمل صدى لغة الذبيحة والطهارة، مع الإشارة في الحاشية إلى احتمال معنى البراءة من اللوم.
theological_decisions:
- issue: الصورة الانعكاسية لتقديم المسيح الكنيسة إلى نفسه
  choice: الإبقاء على «هو بنفسه... إلى نفسه»
  alternative: تخفيف العبارة إلى «لكي يقدّم الكنيسة» أو تفسيرها صراحة بأنها تقديم أمام الله
  rationale: النص اليوناني يجمع بين الضمير المؤكد αὐτός والضمير الانعكاسي ἑαυτῷ؛ لذلك حُفظت الصياغة بما فيها من توتر لاهوتي وأدبي من غير حسم مرجع التقديم بما يتجاوز الآية.
- issue: اجتماع صور الجمال والطهارة والقداسة
  choice: «بقعة... تجعّد... مقدسة وبلا عيب»
  alternative: صياغة جميع الألفاظ بلغة أخلاقية فقط، مثل «بلا خطيئة ولا لوم»
  rationale: تحافظ الصياغة على تداخل صورة العروس الجميلة مع لغة الطهارة والخلو من العيب، ولا تختزلها في بُعد عقائدي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حُفظ التوكيد والانعكاس في صدر الآية، واستُخدمت تراكيب مألوفة للقارئ المعاصر من غير تسطيح الصور البلاغية أو إضافة تفسير مذهبي.
