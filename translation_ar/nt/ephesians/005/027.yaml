  source_fidelity: 'المعنى العام محفوظ بدقة: الغاية، والتوكيد في αὐτός، والانعكاس في ἑαυτῷ، وصور البقعة والتجعّد، والمقابلة بين نفي العيب والقداسة والخلو من العيب. لكن «إلى نفسه» أقل سلاسة في العربية مع فعل «يقدّم»؛ فـ«لنفسه» تؤدي الداتيف الانعكاسي مباشرة وبطبيعية أكبر، من غير فرض تفسير لاهوتي زائد.'
  naturalness: الفصحى واضحة في الجملة، إلا أن «يقدّم ... إلى نفسه» تركيب متكلّف قليلًا في العربية المعاصرة. واستبداله بـ«يقدّم ... لنفسه» يجعل العبارة طبيعية مع بقاء قوة الانعكاس. كما أن وضع «فيها» بعد قائمة المنفيات يجعل نطاق النفي واضحًا لكل الصور.
  terminology: «الكنيسة»، «في بهاء»، «مقدسة»، و«بلا عيب» ملائمة للسياق وتحفظ تداخل صورة العروس ولغة الطهارة. وتبقى البدائل في الحواشي مشروعة ولا تحسم دلالة ἄμωμος المتنازع بين الخلو من العيب والبراءة من اللوم.
