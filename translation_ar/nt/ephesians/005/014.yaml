  rationale: صُحِّح زمن الفعل الأخير وعلاقته بالمخاطَب ليطابقا المستقبل اليوناني وصورة الإشراق عليه، وحُوّل التقديم إلى صيغة عربية غير شخصية تحافظ على غموض القائل. كما نُقل مرساة حاشية مصدر الاقتباس إلى الموضع الذي تتعلق به.
