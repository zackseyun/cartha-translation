id: EPH.5.14
reference: Ephesians 5:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: ar
  text: لِأَنَّ كُلَّ مَا يُظْهَرُ هُوَ نُورٌ.[a] لِذَلِكَ يُقَالُ:[b] «اسْتَيْقِظْ أَيُّهَا النَّائِمُ، وَقُمْ مِنْ بَيْنِ الْأَمْوَاتِ، وَسَيُشْرِقُ عَلَيْكَ الْمَسِيحُ».[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن كل ما ينكشف هو نور». يمكن أن يعني الفعل اليوناني «يُظهَر» أو «ينكشف/يُكشَف».'
    reason: lexical_alternative
  - marker: b
    text: مصدر هذا القول غير مؤكد؛ فقد يكون صدى لموضوعات كتابية، ولا سيما إشعياء 60:1، أو من ترنيمة مسيحية مبكرة.
    reason: cross_reference
  - marker: c
    text: 'اليونانية: «المسيح»، وهو لقب معناه «الممسوح».'
    reason: title_clarification
lexical_decisions:
- source_word: πᾶν τὸ φανερούμενον
  choice: كُلَّ مَا يُجْعَلُ ظَاهِرًا
  rationale: تركيب محايد عام يشمل كل ما يدخل في حالة الظهور، ويحافظ على المبني للمجهول وعلى احتمال معنى الكشف أو الإظهار.
- source_word: φῶς
  choice: نُورٌ
  rationale: مقابل عربي مباشر يحفظ صورة النور من غير تفسير مجازي زائد.
- source_word: διὸ
  choice: لِذَلِكَ
  rationale: تؤدي معنى الاستنتاج من العبارة السابقة بوضوح وطبيعية.
- source_word: λέγει
  choice: يَقُولُ
  rationale: أُبقي الفاعل غير مصرّح به كما في اليونانية، من غير تعيين المصدر بأنه الكتاب أو الله أو ترنيمة.
- source_word: Ἔγειρε, ὁ καθεύδων
  choice: اسْتَيْقِظْ أَيُّهَا النَّائِمُ
  rationale: صياغة عربية واضحة تحفظ الأمر وصيغة النداء والصورة المجازية للنوم.
- source_word: ἀνάστα ἐκ τῶν νεκρῶν
  choice: قُمْ مِنْ بَيْنِ الْأَمْوَاتِ
  rationale: تحفظ معنى النهوض وتوضح دلالة ἐκ مع جمع «الأموات»، مع إبقاء الصدى المرتبط بالقيامة.
- source_word: ἐπιφαύσει σοι
  choice: فَيُضِيءَ لَكَ
  rationale: تحفظ صورة الإشراق وعلاقة الفعل بالمخاطب؛ وجاء الفعل منصوبًا بعد فاء السببية الواقعة في جواب الأمر.
- source_word: ὁ Χριστός
  choice: الْمَسِيحُ
  rationale: اللفظ هنا معرف ويؤدي وظيفة اللقب؛ و«المسيح» هو المقابل العربي الراسخ والدال على اللقب.
theological_decisions:
- issue: مصدر الاقتباس التمهيدي
  choice: «يقول» من غير تسمية القائل أو المصدر
  alternative: «يقول الكتاب» أو «يقول الله» أو «تقول ترنيمة»
  rationale: النص اليوناني لا يحدد الفاعل، ومصدر القول غير محسوم؛ لذلك تُحفظ هذه المساحة من الاحتمال.
- issue: معنى πᾶν τὸ φανερούμενον
  choice: «كل ما يُجعل ظاهرًا هو نور»
  alternative: «كل ما ينكشف هو نور» أو فهم العبارة بمعنى «كل ما يكشفه النور يصير ظاهرًا»
  rationale: البنية اليونانية تحتمل الإظهار أو الانكشاف، كما أن علاقة المسند «نور» بما قبله تتسم بشيء من الصعوبة؛ فحُفظ التركيب الأقرب دون تسوية التوتر بتفسير إضافي.
- issue: هوية القول المقتبس
  choice: عدم نسبته صراحة إلى نص كتابي بعينه
  alternative: اعتباره اقتباسًا من إشعياء 60:1 أو ترنيمة مسيحية مبكرة
  rationale: قد يكون القول صدى لموضوعات كتابية، ولا سيما إشعياء 60:1، أو مادة ترنيمية مبكرة، لكن الدليل لا يحسم ذلك.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم الضبط الجزئي/الكامل لتفادي التباس الإعراب في الجملة الشعرية، وحُفظت صياغة الاقتباس وإيقاع الأوامر دون ألفاظ قديمة عسيرة.
