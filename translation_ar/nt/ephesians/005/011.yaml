lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: تشاركوا
  rationale: يفيد الفعل الاشتراك مع آخرين في شيء أو الإسهام فيه. و«تشاركوا» تعبير عربي واضح يحافظ على معنى الانخراط الفعلي من غير أن يضيّقه إلى مجرد المصاحبة.
- source_word: ἔργοις
  choice: أعمال
  rationale: «أعمال» المقابل الطبيعي الذي يحافظ على استمرارية مفردات بولس الأخلاقية، مع إمكان «أفعال» من حيث المعنى.
- source_word: ἀκάρποις
  choice: العديمة الثمر
  rationale: يحافظ التعبير على استعارة الثمر الواردة في اليونانية وعلى صلتها بسياق السلوك المثمر في الآيات المحيطة.
- source_word: σκότους
  choice: الظلمة
  rationale: تنقل صيغة الإضافة اليونانية مباشرة في عبارة «أعمال الظلمة»، من غير حسم ما إذا كان المقصود أعمالًا تنتمي إلى الظلمة أو تجري فيها.
- source_word: μᾶλλον δὲ καὶ
  choice: بل بالأحرى ... أيضًا
  rationale: تنقل العبارة الانتقال من مجرد عدم المشاركة إلى الفعل المقابل الإضافي، وتحافظ على قوة كل من الاستدراك والإضافة.
- source_word: ἐλέγχετε
  choice: اكشفوها
  rationale: يلائم «اكشفوها» سياق النور والظلمة، ولا سيما ظهور الأمور في النور في الآيات التالية. ومع ذلك، قد يتضمن الفعل أيضًا التوبيخ وإظهار الخطأ، ولذلك حُفظ هذا الاحتمال في الحاشية.
theological_decisions:
- issue: دلالة ἐλέγχετε تجاه أعمال الظلمة
  choice: اكشفوها
  alternative: وبخوها أو أظهروا خطأها
  rationale: يرجّح سياق النور والظلمة معنى كشف الأعمال وإظهار حقيقتها، من غير إنكار ما في الفعل من تقريع أخلاقي أو تصحيح بالكلام.
- issue: قوة المقابلة في صيغة الأمر
  choice: لا تشاركوا ... بل بالأحرى اكشفوها أيضًا
  alternative: لا تشتركوا ... بل وبخوها
  rationale: 'يحفظ النص الأمرين معًا: الامتناع عن أعمال الظلمة واتخاذ موقف فعّال تجاهها، من غير تحديد وسيلة لذلك لم يحددها اليوناني.'
translation_notes:
