  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: ar
  text: هذا السرّ عظيم[a]، ولكنني أقول هذا عن المسيح وعن الكنيسة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «هذا السرّ جليل». واليونانية حرفيًا «عظيم»، وقد تدل على العظمة أو الأهمية، لا على العمق وحده.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: السرّ
  rationale: يدل اللفظ في استعمال بولس عادةً على حقيقة إلهية كانت خفية ثم أُعلنت، لا على أمر مبهم أو لغز فحسب. و«السرّ» يحافظ على هذا المعنى اللاهوتي المألوف من غير شرح زائد.
- source_word: μέγα
  choice: عظيم
  rationale: هو المقابل المباشر للصفة اليونانية، ويحفظ احتمال دلالتها على العظمة أو الأهمية من غير حصرها في معنى العمق.
- source_word: δὲ
  choice: ولكنني
  rationale: تنقل التحول الاستدراكي الخفيف من تقرير عظمة السر إلى توضيح مرجع كلام بولس.
- source_word: λέγω
  choice: أقول هذا
  rationale: يحافظ على الفعل اليوناني ويجعل مفعول القول المفهوم من السياق صريحًا على نحو طبيعي في العربية، من غير استبداله بالفعل التفسيري «أعني».
- source_word: εἰς
  choice: عن
  rationale: حرف الجر هنا اصطلاحي بعد فعل القول، ويدل على موضوع الكلام أو مرجعه. و«عن» عربية واضحة وطبيعية، مع تكرارها للمسيح والكنيسة بما يقابل تكرار εἰς في الأصل.
- source_word: Χριστόν
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ وظيفته اللقبية في هذا السياق.
- source_word: ἐκκλησίαν
  choice: الكنيسة
  rationale: يشير اللفظ هنا إلى جماعة شعب الله في هويتها الجامعة، و«الكنيسة» هو التعبير العربي الأوضح والأرسخ في السياق البولسي.
theological_decisions:
- issue: مرجع عبارة «هذا السرّ» في علاقة الزواج بالمسيح والكنيسة
  choice: إبقاء العبارة عامة، ثم نقل توضيح بولس بأنه يتكلم عن المسيح والكنيسة، من غير تحديد المرجع تحديدًا أضيق.
  alternative: تفسير السر تحديدًا بأنه اتحاد الجسد الواحد في الزواج، أو نص تكوين 2:24 نفسه، أو الدلالة الرمزية للزواج التي تشير إلى المسيح والكنيسة.
  rationale: لا يحدد النص اليوناني واحدًا من هذه الاحتمالات على نحو صريح، بل يقرر عظمة «هذا السر» ثم يبيّن جهة الكلام. لذلك تحفظ الصياغة حركة النص وغموض المرجع المشروع من غير فرض حسم عقائدي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. اختيرت «أقول هذا عن» بدل «أعني» للمحافظة على فعل القول وعلى الانتقال التفسيري في الأصل، وكُررت «عن» قبل «الكنيسة» مراعاةً لبنية اليونانية مع بقاء العبارة طبيعية في العربية.
