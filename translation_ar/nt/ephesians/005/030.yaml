lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّنَا
  rationale: تُدخل الجملة تعليلًا لما سبق، و«لأننا» تؤدي المعنى السببي بوضوح وطبيعية في العربية المعاصرة.
- source_word: μέλη
  choice: أَعْضَاءُ
  rationale: تنقل صورة أجزاء الجسد، وتحافظ كذلك على الدلالة الجماعية في تصوير بولس للمؤمنين بوصفهم جسد المسيح.
- source_word: ἐσμὲν
  choice: نحن (مضمَّنة في «لأننا» والجملة الاسمية)
  rationale: تؤدي «نا» معنى ضمير المتكلمين، ويُفهم فعل الكينونة في الحاضر طبيعيًّا من الجملة الاسمية العربية من غير حاجة إلى لفظ زائد.
- source_word: τοῦ σώματος
  choice: جَسَدِ
  rationale: ترجمة مباشرة وطبيعية تحفظ استعارة الجسد القائمة في السياق.
- source_word: αὐτοῦ
  choice: ـهِ
  rationale: يعود الضمير بحسب السياق على المسيح، وتؤديه العربية بضمير الغائب المذكر المتصل.
theological_decisions:
- issue: هل تُدرج القراءة الأطول «من لحمه ومن عظامه»؟
  choice: 'اتباع نص SBLGNT الأقصر في المتن: «لأننا أعضاء جسده».'
  alternative: «لأننا أعضاء جسده، من لحمه ومن عظامه».
  rationale: المصدر اليوناني المعطى يثبت القراءة الأقصر. أمّا العبارة الأطول فترد في بعض المخطوطات، وقد تكون توسعًا متأثرًا بلغة التكوين 2:23؛ لذلك تُذكر في الحاشية حفاظًا على الشفافية النصية من غير إدخالها في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع الحفاظ على صورة «أعضاء الجسد» المألوفة في السياق البولسي. ضُبطت أواخر الكلمات لتوضيح التركيب، مع إثبات علامة الحاشية في المتن.
