  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: ar
  text: فما من أحدٍ أبغض جسده قط، بل يغذّيه ويعتني به بحنان، كما أن المسيح أيضًا يغذّي الكنيسة ويعتني بها بحنان.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: فما من أحدٍ ... قط
  rationale: تنقل النفي العام مع معنى ποτέ، وتحفظ γάρ بوصفها أداة تعليل وربط بالسياق السابق.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: جسده
  rationale: المقصود هنا الذات الجسدية الملموسة في سياق تشبيه الزواج بالجسد؛ ولفظ «جسده» طبيعي في العربية ولا يوحي بمعنى الطبيعة الخاطئة.
- source_word: ἐμίσησεν
  choice: أبغض
  rationale: مقابل عربي مباشر وفصيح للفعل μισέω.
- source_word: ἐκτρέφει
  choice: يغذّيه
  rationale: يحفظ معنى الإطعام والإنماء والعناية بالجسد.
- source_word: θάλπει
  choice: يعتني به بحنان
  rationale: ينقل دلالة الرعاية الدافئة الرقيقة بصورة واضحة وطبيعية، بدل الاقتصار على المعنى الحرفي «يدفئ».
- source_word: καθὼς καὶ
  choice: كما ... أيضًا
  rationale: يحفظ قوة المقارنة والإضافة في التعبير اليوناني.
- source_word: ὁ Χριστὸς
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ معناه اللقبي.
- source_word: τὴν ἐκκλησίαν
  choice: بالكنيسة
  rationale: «الكنيسة» المقابل العربي المألوف للجماعة المؤمنة هنا، ودخول الباء يتيح استعادة الفعلين المحذوفين في العبارة اليونانية بصورة عربية سليمة.
theological_decisions:
- issue: دلالة σάρξ في التشبيه
  choice: جسده
  alternative: لحمه
  rationale: اللفظ يشير إلى الكيان الجسدي للشخص، لا إلى «الطبيعة الخاطئة». واختيار «جسده» يحفظ المقصود الطبيعي في العربية ضمن تشبيه الرأس والجسد.
- issue: الفعل المحذوف في العبارة الأخيرة
  choice: كما يفعل المسيح أيضًا بالكنيسة
  alternative: كما يغذّي المسيح الكنيسة ويعتني بها بحنان أيضًا
  rationale: الأصل يحذف الفعلين بعد المقارنة ويعتمد على استحضارهما من العبارة السابقة. حافظت الصياغة على هذا الإيجاز والغموض التركيبي الطبيعي من غير إضافة تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «فما من أحد» لربط التعليل بما قبله، و«يعتني به بحنان» لإظهار الرعاية الدافئة التي يدل عليها θάλπει. لا توجد حواشٍ لازمة في هذه الآية.
