  to: فما من أحدٍ أبغض جسده قط، بل يغذّيه ويعتني به بحنان، كما أن المسيح أيضًا يغذّي الكنيسة ويعتني بها بحنان.
  rationale: أعيد ذكر «يغذّي ... ويعتني ... بحنان» في الشطر الأخير بدل محاكاة الحذف اليوناني بعبارة عربية غير طبيعية. هذه الإضافة تركيبية لازمة في العربية، ومحتواها مستفاد مباشرة من الفعلين السابقين ومن المقارنة καθὼς καὶ، ولا تضيف تفسيرًا عقائديًا أو معنى جديدًا.
