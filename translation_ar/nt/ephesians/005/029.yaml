    rationale: تحذف اليونانية الفعل وتعتمد على الفعلين السابقين، لكن نقل هذا الحذف بهذه الصيغة العربية لا يعطي رابطًا طبيعيًا وواضحًا. إعادة الفعلين المستفادين من السياق تحافظ على المقارنة المقصودة وتمنع الإبهام.
  revised_text: فما من أحدٍ أبغض جسده قط، بل يغذّيه ويعتني به بحنان، كما أن المسيح أيضًا يغذّي الكنيسة ويعتني بها بحنان.
