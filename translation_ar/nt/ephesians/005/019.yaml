lexical_decisions:
- source_word: λαλοῦντες
  choice: مخاطبين
  rationale: يحفظ صيغة اسم الفاعل ومعنى توجيه الكلام في السياق الجماعي، ويرتبط طبيعيًا بما بعده.
- source_word: ἑαυτοῖς
  choice: بعضكم بعضًا
  rationale: للضمير الانعكاسي الجمع هنا معنى تبادلي شائع؛ وهذه الصياغة العربية واضحة وتحفظ إمكان الإشارة في الحاشية إلى المعنى الانعكاسي الحرفي.
- source_word: ψαλμοῖς
  choice: بمزامير
  rationale: المقابل العربي المألوف، ولا يحصر اللفظ بالضرورة في سفر المزامير وحده.
- source_word: ὕμνοις
  choice: وتسابيح
  rationale: تعبير عربي طبيعي للأناشيد المادحة، مع الحفاظ على التعداد الثلاثي وتمييزه من المزامير والأغاني.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: وأغانٍ روحية
  rationale: ينقل صفة πνευματικαῖς كما هي من غير إضافة دعوى أقوى بأن الأغاني موحى بها من الروح.
- source_word: ᾄδοντες
  choice: مرنمين
  rationale: ينقل فعل الغناء بصياغة ملائمة لسياق التسبيح ويحافظ على صيغة اسم الفاعل.
- source_word: ψάλλοντες
  choice: وملحنين
  rationale: يحفظ المعنى الموسيقي للفظ من غير أن يفرض استعمال آلة موسيقية أو ينفيه.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: من قلوبكم
  rationale: صياغة عربية طبيعية تعبّر عن صدور الترنيم والتلحين من الداخل، وتحفظ جمع المخاطبين مع الاسم اليوناني المفرد الجمعي الدلالة.
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: ينقل الداتيف بوصف الرب غاية الترنيم وموضوعه، من غير تحديد مرجعه بما يتجاوز لفظ الآية.
theological_decisions:
- issue: دلالة ψάλλοντες بالنسبة إلى استعمال الآلات الموسيقية
  choice: ملحنين، من غير تحديد مصاحبة آلية
  alternative: مسبحين؛ أو عازفين
  rationale: يمكن أن يحمل الفعل معنى الترنم بالتسبيح أو إحداث اللحن، لكنه في هذا السياق لا يوجب آلة موسيقية ولا يستبعدها؛ لذا تتجنب الصياغة حسم خلاف طائفي.
- issue: مرجع «الرب»
  choice: الإبقاء على «الرب»
  alternative: التصريح بـ«الرب يسوع»
  rationale: السياق الأوسع قد يرجح المسيح، لكن نص الآية يقول κύριος فقط، فحُفظت عبارته من غير توسيع تفسيري.
- issue: دلالة πνευματικαῖς
  choice: روحية
  alternative: موحى بها من الروح
  rationale: الصفة تحتمل صلة بالروح، لكن التصريح بالإيحاء أقوى مما تقوله العبارة نفسها.
