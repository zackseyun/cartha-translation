  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: ar
  text: ولا تسكروا بالخمر، فإن في ذلك انحلالًا، بل امتلئوا بالرُّوح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الرُّوح»؛ ويفهم بعضهم العبارة بمعنى أعم: «في الروح».'
    reason: تبيين احتمال دلالة حرف الجر ومرجع كلمة «روح» من غير حسم ما أبقاه النص اليوناني محتملًا.
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: تسكروا
  rationale: فعل مضارع مسبوق بأداة النهي «لا»، فيؤدي معنى النهي عن الوقوع في السُّكر أو الاستمرار فيه بصياغة عربية طبيعية.
- source_word: οἴνῳ
  choice: بالخمر
  rationale: الباء تعبّر طبيعيًا عن المادة أو الوسيلة التي يحدث بها السُّكر.
- source_word: ἐν ᾧ
  choice: ففي ذلك
  rationale: تحافظ العبارة على الصلة بما سبق من الخمر والسُّكر، من غير أن تحصر الإحالة نحويًا في أحدهما وحده.
- source_word: ἀσωτία
  choice: انحلال
  rationale: تنقل معنى السلوك المنفلت المبدِّد الذي لا يضبطه وازع، بلغة عربية معاصرة واضحة، من غير قصر المعنى على فعل بعينه.
- source_word: πληροῦσθε
  choice: امتلئوا
  rationale: صيغة أمر عربية مباشرة توافق المبني للمجهول في اليونانية من حيث تلقّي الملء، بينما يمكن أن يُفهم الاستمرار من طبيعة الوصية وسياقها.
- source_word: ἐν πνεύματι
  choice: بالرُّوح
  rationale: الباء طبيعية بعد «امتلئوا» ويمكن أن تفيد المحتوى أو الوسيلة، و«الرُّوح» ترجّح الإشارة إلى روح الله مع إبقاء الاحتمالات الأخرى في الحاشية.
theological_decisions:
- issue: مرجع πνεύματι ودلالة ἐν
  choice: بالرُّوح، أي بروح الله على الأرجح
  alternative: 'في الرُّوح؛ أو بمعنى أعم: في الروح/في أرواحكم'
  rationale: يرجّح السياق البولسي الإشارة إلى روح الله، لكن الاسم في اليونانية غير مسبوق بأداة التعريف، كما أن حرف الجر قد يدل على المجال لا على المحتوى أو الوسيلة؛ لذلك حُفظ الاحتمال الآخر في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة وموجزة ذات نبرة كريمة. استُعمل «انحلال» لأنه أوضح للقارئ المعاصر من ألفاظ قديمة مثل «الخلاعة» أو «التبذير»، مع احتفاظه بفكرة السلوك غير المنضبط.
