  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: ar
  text: كذلك ينبغي للأزواج أيضًا[أ] أن يحبّوا زوجاتهم كما يحبّون أجسادهم. فمن يحبّ زوجته يحبّ نفسه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: تخلو بعض المخطوطات من «أيضًا».
    reason: توضح اختلافًا نصيًا يتعلق بكلمة καὶ الواردة بين علامتي شك في نص SBLGNT.
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تربط العبارة الوصية بما سبق وتحافظ على قوة الاستنتاج والمقارنة بصياغة عربية طبيعية.
- source_word: ὀφείλουσιν
  choice: ينبغي
  rationale: تعبّر عن الالتزام الأخلاقي الذي يفيده الفعل في هذا السياق الإرشادي، من غير تحويل الصيغة الخبرية إلى أمر مباشر.
- source_word: καὶ οἱ ἄνδρες
  choice: للأزواج أيضًا
  rationale: تفيد καί الإضافة، ويعني ἄνδρες هنا الأزواج تحديدًا في سياق الحديث عن العلاقة الزوجية.
- source_word: ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας
  choice: أن يحبّوا زوجاتهم
  rationale: تحافظ الصياغة على معنى المحبة وعلى الدلالة الزوجية؛ والإضافة في «زوجاتهم» تؤدي معنى ἑαυτῶν طبيعيًا، بينما ستكون «زوجاتهم هم» ثقيلة بلا حاجة.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: كما يحبّون أجسادهم
  rationale: أُضمر فعل المحبة في اليونانية بعد ὡς، وأُظهر بالعربية لرفع احتمال الفهم الخاطئ بأن الزوجات أجسادهم، مع إبقاء المقارنة صريحة.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: فمن يحبّ زوجته
  rationale: «مَن» تنقل اسم الفاعل المعرّف بوصفه حكمًا عامًا، والسياق يحصره في الزوج من غير حاجة إلى تكرار «الرجل».
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: يحبّ نفسه
  rationale: ترجمة مباشرة للضمير الانعكاسي والفعل المتكرر، وتحفظ منطق العبارة.
theological_decisions:
- issue: اللغة المذكرة في الإرشاد الزوجي
  choice: «الأزواج» في الجملة الأولى، ثم «مَن» مع بقاء المرجع الزوجي واضحًا
  alternative: «الرجال» أو «الذي يحبّ زوجته»
  rationale: السياق خاص بالأزواج لا بالرجال عمومًا. و«مَن» عربية فصيحة طبيعية لا تلغي التحديد، لأن «زوجته» والسياق يبيّنان أن المقصود الزوج.
- issue: طبيعة المقارنة بين الزوجة والجسد
  choice: إظهار فعل المحبة في «كما يحبّون أجسادهم»
  alternative: «كأجسادهم» أو «كما أجسادهم»
  rationale: يحافظ هذا على كون العبارة تشبيهًا في المحبة، ولا يحولها إلى تقرير هوية ميتافيزيقية، من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «وهكذا» للوصل الاستنتاجي، و«ينبغي» للواجب الأخلاقي، مع تجنب التراكيب الحرفية الثقيلة. لا توجد حواشٍ لازمة في هذه الآية.
