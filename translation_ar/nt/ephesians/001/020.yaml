source:
  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: ar
  text: التي أجراها في المسيح[a] حين أقامه من بين الأموات وأجلسه عن يمينه في العوالم السماوية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المسيا».'
    reason: بديل يبرز أن «المسيح» لقب.
  - marker: b
    text: 'أو: «في المواضع السماوية».'
    reason: بديل مكاني أكثر حرفية للصفة اليونانية المستعملة استعمال الاسم.
lexical_decisions:
- source_word: ἣν
  choice: التي
  rationale: اسم موصول مؤنث يعود إلى القوة أو الفاعلية المذكورة في السياق السابق، ويحافظ على اتصال الآية بما قبلها.
- source_word: ἐνήργηκεν
  choice: أجراها
  rationale: يفيد الفعل إعمال القوة وجعلها فاعلة؛ و«أجراها» تعبير عربي واضح يحافظ على كون الفاعلية الإلهية مؤثرة بالفعل.
- source_word: ἐν τῷ Χριστῷ
  choice: في المسيح
  rationale: يحافظ على حرف الجر وعلى لقب Χριστός؛ و«المسيح» هو المقابل العربي الطبيعي الذي يجمع دلالة اللقب والاستعمال الاسمي.
- source_word: ἐγείρας αὐτὸν
  choice: حين أقامه
  rationale: يصوغ اسم الفاعل الماضي بوصفه ظرفًا مصاحبًا للفعل الرئيس دون حسم زائد لما إذا كانت العلاقة زمنية محضة أو بيانية.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل صيغة الجمع ويعبّر بوضوح عن الإقامة من وسط جماعة الأموات.
- source_word: καθίσας
  choice: وأجلسه
  rationale: يحافظ على توازي الفعل مع «أقامه» وعلى كون الله هو الذي أقعد المسيح في موضع التكريم.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: عن يمينه
  rationale: التعبير العربي الاصطلاحي الطبيعي للدلالة على الموضع المكرّم بجانب اليمين، لا داخل اليد.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: في العوالم السماوية
  rationale: ينقل الصفة اليونانية المجموعة والمستعملة استعمال الاسم بوصفها نطاقًا سماويًا، بعبارة عربية مفهومة ومعاصرة.
theological_decisions:
- issue: دلالة Χριστῷ كلقب أو اسم
  choice: المسيح
  alternative: المسيا
  rationale: «المسيح» هو اللقب العربي الراسخ والدقيق، أما «المسيا» فيُذكر بديلًا لإبراز الخلفية اللقبية دون فرض تمييز لا يفرضه النص العربي.
- issue: مدلول ἐν τοῖς ἐπουρανίοις
  choice: في العوالم السماوية
  alternative: في المواضع السماوية
  rationale: التركيب اليوناني لا يذكر اسمًا صريحًا بعد الصفة؛ فالمتن يعبّر عن النطاق السماوي بوضوح، والحاشية تحفظ الاحتمال المكاني الأكثر حرفية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حوفظ على ارتباط الجملة بما قبلها بواسطة «التي»، وعلى التوازي بين «أقامه» و«أجلسه»، مع تجنب إضافة تفسير عقائدي غير مصرح به في المصدر.
