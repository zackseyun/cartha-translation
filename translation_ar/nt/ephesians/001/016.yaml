lexical_decisions:
- source_word: οὐ παύομαι
  choice: لا أكفّ
  rationale: ينقل معنى الاستمرار في عدم التوقف، ويحافظ على إيجاز العبارة ونبرتها البولسية بلغة عربية فصيحة طبيعية.
- source_word: εὐχαριστῶν
  choice: عن شكر الله
  rationale: اسم الجلالة مفعول مفهوم لفعل الشكر في هذا السياق، وإظهاره يجعل العربية طبيعية ويبيّن أن الشكر موجّه إلى الله دون تغيير المقصود.
- source_word: ὑπὲρ ὑμῶν
  choice: لأجلكم
  rationale: تؤدي معنى ὑπέρ مع المضاف إليه، أي إنهم سبب الشكر وموضوعه، بصياغة عربية واضحة.
- source_word: μνείαν ποιούμενος
  choice: ذاكرًا إياكم
  rationale: ينقل الاصطلاح اليوناني «صانعًا ذكرًا» إلى تعبير عربي طبيعي، مع إظهار المفعول المفهوم من السياق.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: في صلواتي
  rationale: يعبّر بوضوح عن المجال أو المناسبة التي يجري فيها ذكرهم، وهو المقابل العربي الطبيعي.
