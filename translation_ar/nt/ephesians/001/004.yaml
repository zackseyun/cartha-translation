  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: ar
  text: كَمَا اخْتَارَنَا فِيهِ قَبْلَ تَأْسِيسِ الْعَالَمِ، أَنْ نَكُونَ[c] قِدِّيسِينَ وَبِلَا لَوْمٍ[b] أَمَامَهُ فِي الْمَحَبَّةِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا وصل عبارة «في المحبة» بما يلي في الآية التالية: «في المحبة سبق فعيّننا...»'
    reason: alternative_reading
  - marker: b
    text: 'أو: «بلا عيب».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لكي نكون»؛ وقد يفيد التركيب الغاية أو النتيجة.'
    reason: translation_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كَمَا
  rationale: تحفظ أداة الربط والمقارنة مع البركة المذكورة في السياق السابق بصياغة عربية طبيعية.
- source_word: ἐξελέξατο
  choice: اخْتَارَنَا
  rationale: ينقل فعل الاختيار الإلهي بوضوح من غير إدخال مصطلح مذهبي تقني زائد على النص.
- source_word: ἐν αὐτῷ
  choice: فِيهِ
  rationale: يحفظ تعبير بولس المكثف وعائده الضميري من غير توسيع تفسيري إلى «في اتحادنا به».
- source_word: πρὸ καταβολῆς κόσμου
  choice: قَبْلَ تَأْسِيسِ الْعَالَمِ
  rationale: ترجمة قريبة وواضحة تحفظ الدلالة الزمنية وصورة وضع أساس العالم.
- source_word: εἶναι ἡμᾶς
  choice: لِنَكُونَ
  rationale: صياغة عربية سلسة تجعل «نا» المفهومة من «اختارنا» فاعلًا للكون، وتحفظ دلالة الغاية أو النتيجة دون تكرار ثقيل.
- source_word: ἁγίους
  choice: قِدِّيسِينَ
  rationale: تحفظ معنى القداسة بما يشمله من التكريس والنقاء الأخلاقي.
- source_word: ἀμώμους
  choice: بِلَا لَوْمٍ
  rationale: تعبير عربي مفهوم ينقل معنى عدم وجود ما يُلام عليه المرء، مع إثبات البديل الأقرب إلى الصورة الذبائحية في الحاشية.
- source_word: κατενώπιον αὐτοῦ
  choice: أَمَامَهُ
  rationale: مقابل موجز وطبيعي يدل على الحضور والمساءلة أمام الله.
- source_word: ἐν ἀγάπῃ
  choice: فِي الْمَحَبَّةِ
  rationale: يحفظ العبارة في موضعها اليوناني ولا يحسم وحده هل تتصل بما قبلها أم بما بعدها.
theological_decisions:
- issue: احتمال تحميل ἐξελέξατο معنى مذهبيًا تقنيًا في سياق الاختيار السابق
  choice: اخْتَارَنَا
  alternative: انْتَخَبَنَا
  rationale: «اختارنا» يثبت فعل الاختيار الوارد في النص، لكنه يتجنب إيحاءات اصطلاحية قد تستدعي منظومة لاهوتية بعينها.
- issue: موضع تعلّق عبارة ἐν ἀγάπῃ
  choice: 'إبقاؤها في ختام الآية: «أمامه في المحبة» مع بيان الاحتمال الآخر في الحاشية'
  alternative: 'وصلها بالآية التالية: «في المحبة سبق فعيّننا...»'
  rationale: التركيب اليوناني يحتمل تعلق العبارة بما قبلها أو بما يليها، لذلك تُحفظ في موضعها ويُذكر الوجه الآخر من غير حسم مصطنع.
- issue: دلالة جملة المصدر εἶναι ἡμᾶς
  choice: لِنَكُونَ
  alternative: لكي نكون
  rationale: تنقل الغاية بصورة طبيعية، مع بقاء احتمال أن يعرض التركيب نتيجة الاختيار أيضًا.
translation_notes:
  register: العربية فصحى حديثة، واضحة وموقرة. حُفظ إيقاع الجملة البولسية المترابطة، مع تجنب الألفاظ المذهبية التقنية، وإثبات الغموض النحوي الحقيقي المتعلق بعبارة «في المحبة» في الحاشية.
