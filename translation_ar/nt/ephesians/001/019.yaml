revisions:
- from: وما عظمة قدرته الفائقة نحونا نحن الذين نؤمن، بحسب فاعلية جبروت قوته.
  to: وما العِظَم الفائق لقدرتِه نحونا نحن الذين نؤمن، بحسب عمل اقتدار قوته.
  rationale: 'يصحح النص نطاق الصفة ليطابق البناء اليوناني: «العِظَم الفائق» هو عِظَم القدرة. كما يستبدل «فاعلية جبروت» بـ«عمل اقتدار» لتكون العبارة العربية أوضح وأقرب إلى معنى ἐνέργεια وκράτος، مع صون التراكم المقصود في ألفاظ القوة وعدم حسم دلالة εἰς تفسيريًا.'
