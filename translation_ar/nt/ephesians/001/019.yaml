translation:
  language: ar
  text: وما العِظَم الفائق لقدرتِه نحونا نحن الذين نؤمن، بحسب عمل اقتدار قوته.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: الفائقة
  rationale: تحفظ معنى التجاوز والتفوق في اسم الفاعل المستعمل وصفًا، من غير المبالغة إلى معنى «غير المحدودة».
- source_word: μέγεθος
  choice: عظمة
  rationale: لفظ عربي طبيعي وفصيح يؤدي معنى المقدار العظيم في التركيب المجرد.
- source_word: δύναμις
  choice: قدرة
  rationale: المقابل الأوضح في الاستعمال البولسي، ويميز هذا اللفظ من بقية ألفاظ القوة المتراكمة في العبارة.
- source_word: εἰς ἡμᾶς
  choice: نحونا
  rationale: يحفظ دلالة الاتجاه في εἰς، ولا يحسمها تفسيريًا إلى «فينا» أو «لأجلنا».
- source_word: τοὺς πιστεύοντας
  choice: نحن الذين نؤمن
  rationale: صياغة عربية طبيعية تحفظ الصفة الفعلية لاسم الفاعل الحاضر بدل تحويلها إلى اسم جامد.
- source_word: κατά
  choice: بحسب
  rationale: تفيد المطابقة أو المقياس هنا، وهي موجزة وطبيعية في العربية الكتابية المعاصرة.
- source_word: ἐνέργεια
  choice: فاعلية
  rationale: تعبر عن العمل المؤثر والناجز، وتتجنب إيحاءات لفظ «طاقة» الحديثة.
- source_word: κράτος
  choice: جبروت
  rationale: يؤدي معنى القوة الظاهرة أو المقتدرة، مع إبقائه متميزًا من ἰσχύς.
- source_word: ἰσχύς
  choice: قوة
  rationale: يؤدي معنى القوة الكامنة أو المتانة، ويحافظ مع «جبروت» على تراكم الألفاظ المتقاربة دون دمجها.
- source_word: καὶ τί
  choice: وما
  rationale: يواصل تركيب الصلاة من السياق السابق؛ وتستقيم العبارة الاسمية في العربية من غير إضافة فعل رابط.
theological_decisions:
- issue: ترجمة التراكم δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: 'الحفاظ على التراكم بألفاظ مترابطة ومتميزة: «قدرة ... فاعلية ... جبروت ... قوة».'
  alternative: اختزالها إلى عبارة أكثر سلاسة مثل «كل قوة قدرته»، أو دمج بعضها في لفظ واحد.
  rationale: يكدّس بولس ألفاظًا متقاربة لتوكيد عظمة قدرة الله وفاعليتها؛ والحفاظ على هذا التعدد يصون القوة البلاغية من غير إنشاء تقسيم لاهوتي تقني بينها.
- issue: اتجاه القدرة الإلهية في εἰς ἡμᾶς
  choice: «نحونا نحن الذين نؤمن»
  alternative: «فينا نحن الذين نؤمن» أو «لنا نحن الذين نؤمن»
  rationale: حرف الجر اليوناني εἰς يدل هنا مباشرة على الاتجاه أو الامتداد نحو المؤمنين، ولا يحدد وحده إن كان التركيز على العمل الداخلي أم المنفعة المقدمة لهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة. حُفظ التركيب المتراكم لألفاظ القوة، واستُعملت «نحونا» للمحافظة على غموض εἰς المشروع دون حاشية، إذ إن النص العربي نفسه ينقل الدلالة الاتجاهية بوضوح.
