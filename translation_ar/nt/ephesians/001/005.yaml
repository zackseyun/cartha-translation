  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: ar
  text: إذ سبق أن عيَّننا للتبنّي أبناءً له بواسطة يسوع المسيح، بحسب مسرّة مشيئته،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προορίσας
  choice: إذ سبق فعيَّننا
  rationale: يحفظ معنى التعيين المسبق في الفعل اليوناني وصيغة اسم الفاعل المرتبطة بسياق البركة، من غير أن يحمّله نظرية لاهوتية تتجاوز النص.
- source_word: εἰς υἱοθεσίαν
  choice: للتبنّي
  rationale: «التبنّي» هو المقابل العربي الطبيعي الدال على منح منزلة الابن وحقوق الوارث؛ وتوضح الحاشية المكوّن البنوي والقانوني في المصطلح اليوناني.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: بواسطة يسوع المسيح
  rationale: تفيد διά مع المضاف إليه الوساطة أو السببية. و«المسيح» ترجمة عربية راسخة للقب Χριστός، لا مجرد نقل صوتي له.
- source_word: εἰς αὐτόν
  choice: له
  rationale: تحفظ العبارة اتجاه التبنّي نحو الله، مع بقاء احتمال معنى الغاية «لنفسه» مذكورًا في الحاشية.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: بحسب مسرّة
  rationale: تنقل κατά معنى المطابقة أو الموافقة، وتنقل εὐδοκία معنى الرضا والمشيئة المستحسنة بلفظ عربي موجز ومهيب.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: مشيئته
  rationale: ترجمة مباشرة للتركيب الإضافي، من غير توسيعه تفسيرًا إلى «قصده».
theological_decisions:
- issue: دلالة προορίσας في سياق خلافي
  choice: إذ سبق فعيَّننا
  alternative: إذ قرر لنا من قبل
  rationale: يبقي عنصر السبق والتعيين الصريحين في الأصل، ولا يخفف العبارة ولا يحدد كيفية التعيين ضمن مذهب بعينه.
- issue: الدلالة البنوية في υἱοθεσία
  choice: التبنّي مع توضيح الحاشية
  alternative: اتخاذنا أبناء
  rationale: الصياغة المختارة طبيعية وشاملة في العربية، بينما تحفظ الحاشية دلالة منح منزلة الابن القانونية وحقوق الإرث التي يحملها اللفظ اليوناني.
- issue: لقب Χριστοῦ
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الدلالي الراسخ للقب اليوناني، ويحفظ كونه لقبًا لا جزءًا غير مترجم من الاسم.
- issue: اتجاه أو غاية εἰς αὐτόν
  choice: له
  alternative: لنفسه
  rationale: «له» تحافظ بإيجاز على الاتجاه نحو الله، وتُترك دلالة الغاية الممكنة ظاهرة في الحاشية بدل حسمها داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «إذ» للمحافظة على اتصال اسم الفاعل بالسياق السابق، وصيغت العبارة بإيجاز لتجنب الثقل الاصطلاحي مع إبقاء مواضع الاحتمال في الحاشية.
