base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: ar
  text: 'بولس، رسولُ المسيح يسوع بمشيئة الله، إلى القديسين الذين هم [في أفسس][a] والمؤمنين بالمسيح يسوع[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تغيب عبارة «في أفسس» عن بعض المخطوطات المبكرة، ولذلك يرى بعضهم أن الرسالة ربما أُعدّت لتُتداول على نطاق أوسع، لا لكنيسة أفسس وحدها.
    reason: textual_variant
  - marker: b
    text: 'أو: «الأوفياء في المسيح يسوع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: رسول
  rationale: يدل هنا على صفة بولس بوصفه مُرسَلًا مفوَّضًا، وهو المقابل العربي الطبيعي للمصطلح في هذا السياق المسيحي المبكر.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: تحافظ «المسيح» على دلالة Χριστός اللقبية، مع إبقاء ترتيب الاسمين كما في اليونانية.
- source_word: διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  rationale: تؤدي الباء معنى διά مع المضاف إليه هنا، أي أن رسوليته قائمة بتدبير الله وإرادته، وهي صياغة عربية طبيعية.
- source_word: ἁγίοις
  choice: القديسين
  rationale: يشير اللفظ إلى جماعة شعب الله المكرَّسين له، و«القديسين» ترجمة عربية موجزة ومستقرة لهذا الوصف الجماعي.
- source_word: τοῖς οὖσιν
  choice: الذين هم
  rationale: ترجمة مباشرة لصيغة اسم الفاعل من فعل الكينونة، من غير إضافة معنى الإقامة أو الحضور الذي لا يصرّح به النص.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[في أفسس]'
  rationale: أُبقيت العبارة بين معقوفين لأن ثبوتها النصي محل خلاف، موافقةً لطريقة عرض النص اليوناني المزوَّد.
- source_word: πιστοῖς
  choice: الأمناء
  rationale: تحافظ هذه الصياغة على معنى الأمانة الممكن في الصفة اليونانية، مع إثبات معنى «المؤمنين» الممكن في الحاشية.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: تحافظ على حرف الجر وعلى دلالة العلاقة أو الاتحاد بالمسيح يسوع من غير تفسير زائد.
theological_decisions:
- issue: دلالة Χριστός في التحية
  choice: المسيح
  alternative: لا بديل عربي ضروري هنا؛ فاللفظ نفسه هو اللقب المعروف
  rationale: «المسيح» في العربية ينقل دلالة اللقب اليوناني مباشرة ولا يحوّله إلى مجرد جزء من اسم شخصي.
- issue: ثبوت عبارة ἐν Ἐφέσῳ
  choice: إثبات «[في أفسس]» بين معقوفين
  alternative: حذف «في أفسس»
  rationale: تغيب العبارة عن بعض الشواهد المبكرة المهمة؛ لذلك تُعرض في المتن مع علامة ظاهرة على عدم اليقين بدل حسم المسألة بصمت.
- issue: معنى πιστοῖς
  choice: الأمناء
  alternative: المؤمنين
  rationale: يمكن للصفة أن تدل على الأمانة أو على الإيمان. يحافظ المتن على المعنى الوصفي، وتثبت الحاشية الاحتمال الآخر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة التحية الرسائلية الموجزة، وأُبقيت المعقوفات لإظهار الاختلاف النصي، مع تجنب الألفاظ الطائفية أو التفسيرية الزائدة.
