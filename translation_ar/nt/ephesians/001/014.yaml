source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: ar
  text: الذي هو عربون ميراثنا، إلى فداء المُقتنى، لمدح مجده.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρραβών
  choice: عربون
  rationale: ينقل معنى الدفعة الضامنة الأولى التي تؤكد تمام ما وُعد به، وهو تعبير عربي موجز ومألوف كتابيًا.
- source_word: κληρονομία
  choice: ميراث
  rationale: المقابل الطبيعي الذي يحفظ دلالة النص على النصيب الموعود للمؤمنين.
- source_word: ἀπολύτρωσις
  choice: فداء
  rationale: يحفظ معنى التحرير بدفع ثمن، ويوافق الاستعمال اللاهوتي العام دون إضافة تفسير خاص.
- source_word: περιποίησις
  choice: المُقتنى
  rationale: يحفظ دلالة ما صار ملكًا أو مقتنى، مع إبقاء الغموض القائم بشأن مرجعه بدل تعيينه تفسيرًا.
- source_word: ἔπαινος
  choice: مدح
  rationale: تعبير عربي واضح عن الثناء والإشادة، ويلائم العبارة الغائية.
theological_decisions:
- issue: مرجع الضمير الموصول ὅ
  choice: الذي
  alternative: الذي هو الروح القدس
  rationale: أُبقي الضمير كما في اليونانية لأنه يعود إلى الروح في الآية السابقة، من غير تكرار تفسيري داخل هذه الآية.
- issue: دلالة εἰς قبل ἀπολύτρωσιν
  choice: إلى فداء
  alternative: لأجل فداء
  rationale: تحافظ «إلى» على الاتجاه أو الغاية المرحلية في العبارة، ولا تحسم العلاقة على أنها سببية محضة.
- issue: مرجع τῆς περιποιήσεως
  choice: المُقتنى
  alternative: ملكية الله / شعب الله المقتنى
  rationale: التركيب اليوناني موجز وقابل لأكثر من فهم؛ لذلك لم يُحدَّد المقتنى بأنه الشعب أو الميراث داخل المتن.
- issue: مرجع αὐτοῦ
  choice: مجده
  alternative: مجد الله
  rationale: حُفظ الضمير كما في الأصل، وسياق المقطع يتيح للقارئ تعيين مرجعه دون زيادة تفسيرية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، ببنية قريبة من الأصل. استُخدم «عربون» لرسوخه ودقته، و«المُقتنى» مع الضبط الجزئي لتجنب التباسه بالفعل وللحفاظ على إيجاز المصدر وغموضه الحقيقي.
