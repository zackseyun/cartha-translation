  verdict: approve
  source_fidelity: 'النص العربي يحافظ بدقة على عناصر اليونانية الأساسية: «عربون» لـἀρραβών، و«ميراثنا» لـκληρονομίας ἡμῶν، و«فداء» لـἀπολύτρωσις، و«المُقتنى» لـπεριποίησις، و«لمدح مجده» لـεἰς ἔπαινον τῆς δόξης αὐτοῦ. كما أن «إلى» تعكس، على نحو محافظ، اتجاه/غاية εἰς في العبارة الوسطى دون تحويلها إلى تفسير سببي حاسم. والموصول «الذي» مناسب عربيًا لأن مرجعه في السياق السابق هو الروح.'
  naturalness: الصياغة فصيحة موجزة ومناسبة لسجل نص كتابي عربي. «إلى فداء المُقتنى» تركيب قريب من الأصل ومقبول في هذا السجل، وإن كان مكثفًا؛ وهذه الكثافة تخدم الحفاظ على إيجاز العبارة اليونانية وغموض مرجع «المُقتنى».
  terminology: 'المصطلحات مستقرة ومفهومة في العربية الفصحى: «عربون»، «ميراث»، و«فداء». واختيار «المُقتنى» يتجنب تعيين المقصود بعبارات تفسيرية مثل «شعب الله» أو «ملكية الله». و«مدح مجده» ينقل العبارة الغائية من غير إضافة لاهوتية.'
