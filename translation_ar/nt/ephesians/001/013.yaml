  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: ar
  text: وفيه أنتم أيضًا، إذ سمعتم كلمة الحق، بشارة خلاصكم، وفيه أيضًا، إذ آمنتم، خُتمتم بالروح القدس الموعود به[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالروح القدس، روح الموعد».'
    reason: يحفظ هذا البديل تركيب الإضافة اليوناني المكثف، الذي يمكن فهمه بمعنى الروح الموعود به أو الروح المرتبط بالوعد.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: وفيه
  rationale: يحفظ إحالة ضمير الوصل إلى المسيح في السياق السابق، وينقل معنى الوجود والاتحاد به بصياغة عربية طبيعية.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: يحفظ التشديد الإضافي الدال على شمول المخاطبين إلى جانب جماعة «نحن» في الآيات السابقة.
- source_word: ἀκούσαντες
  choice: إذ سمعتم
  rationale: ينقل اسم الفاعل الماضي بوصفه حدثًا سابقًا أو مقارنًا للختم، من غير فرض ترتيب لاهوتي أدق مما يسمح به النص.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: كلمة الحق
  rationale: صياغة موجزة ومفهومة تحفظ لفظ λόγος والتعبير البولسي المميز.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: بشارة خلاصكم
  rationale: «بشارة» تنقل معنى الخبر السار بوضوح، والإضافة تحفظ صلة البشارة بخلاص المخاطبين.
- source_word: ἐν ᾧ καὶ πιστεύσαντες
  choice: وفيه أيضًا إذ آمنتم
  rationale: يبقي التكرار المقصود لعبارة «فيه» ويحفظ احتمال تعلقها بالمسيح إطارًا للإيمان، من غير تحويلها صراحة إلى مفعول للفعل «آمن».
- source_word: ἐσφραγίσθητε
  choice: خُتمتم
  rationale: يحفظ المبني للمجهول وصورة الختم التي تفيد الوسم والتوثيق والملكية.
- source_word: τῷ πνεύματι
  choice: بروح
  rationale: الباء تلائم أداة الختم أو الوسيلة في العربية، مع عدم حصر الدلالة النحوية اليونانية في تفسير ضيق.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: الموعد القدوس
  rationale: يحافظ على تركيب «روح الموعد» وعلى صفة القداسة العائدة إلى الروح، مع إيراد الصياغة العربية الأوضح في الحاشية.
theological_decisions:
- issue: العلاقة الزمنية بين السماع والإيمان والختم
  choice: استُعملت «إذ» مع السماع والإيمان، بما يسمح بفهمهما سابقين للختم أو واقعين في إطاره.
  alternative: «بعدما سمعتم... وبعدما آمنتم» التي تصرح بالتعاقب الزمني.
  rationale: اسما الفاعل الماضيان قد يفيدان السبق، لكن السياق لا يقتضي بناء ترتيب مذهبي دقيق لعمل الخلاص وقبول الروح.
- issue: دلالة ἐν ᾧ الثانية
  choice: أُبقيت «وفيه» مستقلة نسبيًا قبل «إذ آمنتم».
  alternative: «وإذ آمنتم به» التي تجعل المسيح مفعول الإيمان صراحة.
  rationale: يحفظ ذلك التوازي مع ἐν ᾧ الأولى ودلالة الاتحاد بالمسيح، ولا يلغي إمكان ارتباط العبارة بالإيمان.
- issue: معنى «روح الموعد»
  choice: 'حُفظ تركيب الإضافة في المتن: «روح الموعد القدوس».'
  alternative: «الروح القدس الموعود به».
  rationale: اليونانية مكثفة وتحتمل أن يكون الروح هو الموعود به أو المرتبط بالموعد؛ المتن يحفظ التكثيف والحاشية توضح القراءة الأشيع.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. أُبقي تكرار «فيه» لأنه بنيوي ولاهوتي في الأصل، واستُعملت «بشارة» بدل اللفظ المعرّب «إنجيل» هنا لإبراز معنى الخبر السار، مع الحفاظ على الإيجاز.
