  to: وفيه أنتم أيضًا، إذ سمعتم كلمة الحق، بشارة خلاصكم، وفيه أيضًا، إذ آمنتم، خُتمتم بالروح القدس الموعود به[a].
  rationale: استُبدل التركيب الملتبس «روح الموعد القدوس» بـ«الروح القدس الموعود به» لأن هذا هو التعبير العربي الطبيعي للقب اليوناني، ولأنه يبيّن أن «القدوس» وصف للروح. وتبقي الحاشية صياغة أقرب إلى البنية اليونانية من غير فرض تفسير مذهبي. كما أُبقي تكرار «وفيه» والإضافة في «أيضًا» محافظةً على بنية النص.
