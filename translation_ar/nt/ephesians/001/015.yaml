    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لذلك
  rationale: تفيد العبارة التعليل والاستنتاج مما سبق، و«لذلك» تؤدي هذا الربط بوضوح وطبيعية.
- source_word: κἀγώ
  choice: أنا أيضًا
  rationale: تحفظ دلالة الإضافة في اندماج καί وἐγώ من غير مبالغة في التوكيد.
- source_word: ἀκούσας
  choice: إذ سمعتُ
  rationale: تنقل اسم الفاعل الماضي بوصفه ظرفًا متعلقًا باستجابة بولس، مع إبقاء الجملة العربية طبيعية.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: إيمانكم
  rationale: التركيب يشير إلى الإيمان القائم لدى المخاطَبين أو الخاص بهم، و«إيمانكم» أوجز وأفصح في العربية.
- source_word: πίστιν
  choice: إيمان
  rationale: هذا هو المعنى الأرجح هنا لأن العبارة تصف علاقة القراء بالرب يسوع، مع إثبات البدائل الممكنة في الحاشية.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: بالرب يسوع
  rationale: الباء هي الصياغة العربية الطبيعية للإيمان بشخص، وتنقل في هذا السياق معنى ἐν من غير تعبير متكلف.
- source_word: κυρίῳ
  choice: الرب
  rationale: يحفظ اللقب المسيحاني الثقل اللاهوتي المعتاد لكلمة κύριος.
- source_word: ἀγάπην
  choice: محبتكم
  rationale: «المحبة» المقابل العربي الطبيعي والواضح لـἀγάπη، والضمير مستفاد من موازاة «إيمانكم» ومن السياق.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: لجميع القديسين
  rationale: اللام تعبّر طبيعيًا عن اتجاه المحبة إلى أشخاص، مع حفظ شمول πάντας.
- source_word: ἁγίους
  choice: القديسين
  rationale: يحفظ التسمية البولسية للمؤمنين ولا يحصرها في مفهوم التكريم الكنسي اللاحق.
theological_decisions:
- issue: دلالة πίστις في وصف علاقة القراء بالرب يسوع
  choice: إيمان
  alternative: ثقة؛ أمانة
  rationale: «إيمان» هو الأرجح مع ذكر الرب يسوع بوصفه متعلق الإيمان؛ لكن اللفظة اليونانية قد تحمل في سياقات أخرى معنى الثقة أو الأمانة، لذلك لم تُطمس إمكاناتها المعجمية.
- issue: ترجمة κύριος كلقب ليسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ الاستعمال المسيحاني المألوف والثقل اللاهوتي للقب، في حين قد تبدو «السيد» أضعف في هذا السياق.
- issue: هوية «القديسين» في πάντας τοὺς ἁγίους
  choice: القديسين
  alternative: المقدسين؛ شعب الله المقدس
  rationale: اللفظ هنا تسمية جماعية للمؤمنين، لا لفئة نالت منزلة خاصة في زمن لاحق؛ والإبقاء على «القديسين» يصون المصطلح البولسي.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. حُفظت بنية الآية بوصفها جزءًا من جملة ممتدة، ولذلك انتهى النص بفاصلة. استُعملت «إذ سمعتُ» بدل تركيب حرفي ثقيل، وحُفظت المصطلحات البولسية الأساسية: الإيمان، الرب، المحبة، والقديسون.'
