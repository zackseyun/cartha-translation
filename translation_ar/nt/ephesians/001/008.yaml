lexical_decisions:
- source_word: ἧς
  choice: التي
  rationale: اسم موصول مؤنث مفرد يعود إلى «نعمته» في السياق السابق، ويحافظ على اتصال الجملة بما قبلها.
- source_word: ἐπερίσσευσεν
  choice: أفاضها
  rationale: ينقل المعنى السببي المتعدي للفعل، أي إن الله جعل نعمته تفيض على المؤمنين، بصياغة عربية طبيعية توحي بالوفرة.
- source_word: εἰς ἡμᾶς
  choice: علينا
  rationale: يعبّر عن اتجاه النعمة إلى متلقيها، ويلائم الفعل «أفاض» في العربية.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: في كل حكمة وفطنة
  rationale: يحافظ على حرف الجر وصياغة الأصل بما يترك الصلة النحوية محتملة، ويميّز «الفطنة» بوصفها إدراكًا عمليًا عن «الحكمة».
theological_decisions:
- issue: متعلَّق عبارة «في كل حكمة وفطنة»
  choice: تُركت العبارة مفتوحة نحويًا دون تعيين صريح لمتعلَّقها.
  alternative: قد تصف حكمة الله وفطنته في إفاضة النعمة، أو الحكمة والفطنة المرتبطتين بما منحه للمؤمنين.
  rationale: يحتمل التركيب اليوناني الوجهين، وتعيين أحدهما في المتن يحسم غموضًا حقيقيًا لا يحسمه الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «أفاضها علينا» بدل التعبير الحرفي الأثقل، مع إبقاء الغموض النحوي الأصيل في العبارة الأخيرة.
