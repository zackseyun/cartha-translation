  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: ar
  text: بكثير فوق كل رئاسة وسلطة وقوة وسيادة[a]، وفوق كل اسم يُسمّى[b]، لا في هذا الدهر وحده، بل في الآتي أيضًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بكثير فوق كل رئاسة وسلطة وقوة وربوبية». وقد تدل الألفاظ اليونانية على رتب أو مجالات للسلطة، بما فيها قوى كونية أو روحية.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «وفوق كل لقب يُمنح».'
    reason: lexical_alternative
  - marker: c
    text: تحذف اليونانية لفظ «الدهر» بعد «الآتي»، وهو مفهوم من العبارة السابقة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: فوق ... بكثير
  rationale: ينقل معنى العلو والتفوّق القوي في اليونانية، ويرتبط طبيعيًا بسياق إعلاء المسيح في الآية السابقة.
- source_word: πάσης ἀρχῆς
  choice: كل رئاسة
  rationale: تحافظ «رئاسة» على معنى مرتبة أو مجال من مجالات الحكم، من غير حصرها صراحةً في حكام بشريين أو كائنات روحية.
- source_word: ἐξουσίας
  choice: سلطان
  rationale: لفظ عربي مألوف للدلالة على السلطة المخوّلة أو الممارسة، ويظل متميزًا عن «قوة».
- source_word: δυνάμεως
  choice: قوة
  rationale: ينقل المعنى المباشر للقدرة أو الاقتدار ويحفظ تمايزه عن السلطان.
- source_word: κυριότητος
  choice: سيادة
  rationale: تعبّر عن مرتبة أو مجال من مجالات السيادة، من غير خلطها بلقب «الرب».
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: كل اسم يُسمّى
  rationale: صياغة قريبة من التركيب اليوناني، تحفظ سعته البلاغية وإمكان دلالته على كل اسم أو لقب معروف من غير تضييق المعنى.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: لا ... وحده، بل ... أيضًا
  rationale: تركيب عربي طبيعي ينقل التقابل والتوكيد في الأصل.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: في هذا الدهر
  rationale: «الدهر» يحفظ الدلالة الزمنية لـ αἰών والتقابل مع الدهر الآتي، بدل تحويلها إلى دلالة مكانية مثل «العالم».
- source_word: ἐν τῷ μέλλοντι
  choice: في الآتي
  rationale: يحافظ على الإيجاز والحذف في اليونانية، إذ يُفهم «الدهر» من العبارة السابقة.
theological_decisions:
- issue: طبيعة الرئاسات والسلطات والقوات والسيادات المذكورة
  choice: إبقاء الألفاظ فئات عامة للحكم والسلطة من غير تحديدها بأنها بشرية أو ملائكية أو كونية في المتن.
  alternative: التصريح بأنها قوات روحية أو رتب ملائكية.
  rationale: قد يشمل السياق قوات كونية أو روحية، لكن اليونانية لا تحدد ماهيتها صراحةً؛ لذلك تحافظ الترجمة على سعة النص وتوتره التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت ألفاظ «رئاسة، سلطان، قوة، سيادة» للمحافظة على تمايز عناصر القائمة، مع تجنب حصرها عقائديًا في نوع بعينه من الكائنات. وُضعت علامات الحواشي [a] و[b] و[c] جميعها في المتن.
