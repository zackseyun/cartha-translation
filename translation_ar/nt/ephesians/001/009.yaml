  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: ar
  text: إذ عرَّفنا سرَّ مشيئته، بحسب مسرَّته التي قصدها فيه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في المسيح»؛ ويفهم بعضهم «فيه» بمعنى انعكاسي: «في نفسه».'
