lexical_decisions:
- source_word: γνωρίσας
  choice: إذ عرَّفنا
  rationale: اسم فاعل ماضٍ تابع للفاعل الإلهي في السياق السابق. تؤدي «إذ عرَّفنا» معنى الكشف والإعلام مع إبقاء الصلة النحوية بالجملة الممتدة، من غير تحويله إلى فعل رئيس مستقل.
- source_word: ἡμῖν
  choice: نا في «عرَّفنا»
  rationale: ضمير الداتيف هو المفعول غير المباشر، وتؤديه العربية طبيعيًا بضمير المتكلمين المتصل بالفعل.
- source_word: τὸ μυστήριον
  choice: سرَّ
  rationale: يدل اللفظ البولسي هنا على تدبير إلهي كان خفيًا ثم أُعلن؛ و«سرّ» عربية واضحة وطبيعية ولا توحي بالضرورة بأنه سيبقى مجهولًا.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: مشيئته
  rationale: تحفظ «مشيئته» الدلالة الإرادية المباشرة للفظ θέλημα وتميزها من فعل القصد اللاحق.
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: بحسب مسرَّته
  rationale: «بحسب» تعبّر عن الموافقة للمعيار، و«مسرّته» تحفظ البعد الشخصي الإرادي في εὐδοκία من غير توسيعه إلى «خطة» أو «نية صالحة».
- source_word: ἣν προέθετο
  choice: التي قصدها
  rationale: الفعل الأوسط يدل في هذا السياق على ما عزم الله عليه أو جعله قصدًا له. «قصدها» موجزة وطبيعية، والضمير المؤنث يعود إلى المسرّة.
- source_word: ἐν αὐτῷ
  choice: في نفسه
  rationale: يمكن أن يعمل الضمير اليوناني هنا عمل المنعكس عائدًا إلى الله، وهو فهم قوي نحويًا وسياقيًا؛ وتُذكر في الحاشية إمكانية عوده إلى المسيح حفاظًا على موضع الاحتمال التفسيري.
theological_decisions:
- issue: مرجع ἐν αὐτῷ
  choice: في نفسه
  alternative: فيه، أي في المسيح
  rationale: يمكن فهم αὐτῷ انعكاسيًا عائدًا إلى الله، فتكون المسرّة مما قصده في نفسه. لكن سياق الأصحاح المتكرر فيه «في المسيح/فيه» يتيح فهم الضمير على أنه عائد إلى المسيح؛ لذلك أُثبت البديل في حاشية بدل إغفاله.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. روعي اتصال الآية بالجملة السابقة باستعمال «إذ»، وتُركت البنية موجزة من غير إضافة شروح عقائدية إلى المتن.
