base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ar
  text: لَكُمُ النِّعْمَةُ وَالسَّلَامُ مِنَ اللهِ أَبِينَا وَالرَّبِّ يَسُوعَ الْمَسِيحِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني Χριστός يعني «المسيح»، وقد يُستعمل لقبًا أو يأتي في بعض السياقات بصيغة قريبة من الاسم العَلَم.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: النِّعْمَةُ
  rationale: تحفظ المعنى اللاهوتي والوظيفة البرَكية في التحية البولسية دون تحويلها إلى مجرد تحية اصطلاحية.
- source_word: ὑμῖν
  choice: لَكُمُ
  rationale: تنقل صيغة الداتيف بوصفها توجيهًا للبركة إلى المخاطَبين، وهي صياغة عربية موجزة وطبيعية.
- source_word: εἰρήνη
  choice: السَّلَامُ
  rationale: يحفظ المعنى المعتاد، مع ما قد يتضمنه من صدى لمفهوم السلام العبري الشامل.
- source_word: ἀπὸ
  choice: مِنَ
  rationale: تفيد مصدر النعمة والسلام كما في النص اليوناني.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: اللهِ أَبِينَا
  rationale: تُفهم العبارة على أن «أبينا» بدل أو وصف بياني لله، من غير إدخال عطف غير موجود في اليونانية.
- source_word: κυρίου
  choice: الرَّبِّ
  rationale: يحفظ قوة اللقب المسيحاني والاستعمال العهدي المألوف لكلمة κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «يسوع» اسم منقول، و«المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالة اللقب مع سلاسة العبارة العربية.
theological_decisions:
- issue: دلالة Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  alternative: يسوعَ المسيحِ، مع إمكان فهم «المسيح» كلقب صار قريبًا من الاسم العَلَم
  rationale: العربية لا تحتاج إلى الاختيار بين نقل صوتي مثل «Christ» وترجمة «Messiah»، لأن «المسيح» هو المقابل العربي التاريخي والطبيعي ويحفظ قابلية اللفظ للفهم كلقب، مع الإقرار بأنه قد يعمل في هذا التركيب عمل الاسم اللقبي.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، قريبة من بنية الأصل من غير تكلّف. ضُبطت أواخر الكلمات لتوضيح تعلق «الرَّبِّ» بحرف الجر «مِنَ» وعطفه على «اللهِ»، ولتجنب قراءة «الرَّبُّ» على أنه مبتدأ جديد.
