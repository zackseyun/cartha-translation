  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: ar
  text: مُبارَكٌ اللهُ أبو ربنا يسوعَ المسيح، الذي باركنا بكل بركة روحية[a] في العوالم السماوية[b] في المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل بركة من الروح». فالصفة اليونانية قد تعني «روحية» بمعنى عام، أو «متعلقة بالروح».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في الأماكن السماوية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: مُبارَكٌ
  rationale: يحافظ على صيغة التسبيح الوصفية في اليونانية، ويصل طبيعيًا بالفعل «باركنا» الوارد لاحقًا من الجذر نفسه.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: اللهُ أبو
  rationale: يحفظ الاسمين المنسَّقين والعلاقة التي تفيد أن الله هو إله ربنا وأبوه، من غير اختزالهما في تعبير تفسيري.
- source_word: κυρίου ἡμῶν
  choice: ربنا
  rationale: «الرب» هو المقابل العربي الطبيعي للقب κύριος هنا، والضمير يحفظ معنى «ربنا».
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوعَ المسيح
  rationale: «يسوع» اسم منقول، و«المسيح» ينقل اللقب Χριστός بمعناه المعروف في العربية من غير تحويله إلى اسم مجرد.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: الذي باركنا
  rationale: ينقل اسم الفاعل اليوناني بوصفه جملة صلة واضحة، ويحفظ الصلة اللفظية بين «مبارك» و«باركنا».
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: بكل بركة روحية
  rationale: الباء عربية طبيعية مع «باركنا» للدلالة على ما أنعم به الله، و«روحية» تحفظ اتساع الصفة من غير حصرها صراحة في معنى «من الروح».
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: في العوالم السماوية
  rationale: تعبير مفهوم ينقل معنى الحيّز أو المجال السماوي في الصيغة اليونانية الجمعية، مع إثبات البديل المكاني في الحاشية.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحفظ العبارة البولسية الموجزة «في المسيح» من غير شرح يضيّق دلالتها.
theological_decisions:
- issue: دلالة πνευματικῇ
  choice: روحية
  alternative: من الروح
  rationale: قد تصف الصفة البركات بأنها روحية عمومًا، وقد تشير إلى علاقتها بالروح؛ أُبقي المعنى الأوسع في المتن وأُثبت الاحتمال الأخص في الحاشية.
- issue: نقل Χριστός
  choice: المسيح في الموضعين
  alternative: كريستوس/اعتباره اسمًا مجردًا
  rationale: «المسيح» في العربية ينقل معنى اللقب اليوناني طبيعيًا ويحفظ طابعه المسياني في «يسوع المسيح» و«في المسيح».
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: بواسطة المسيح
  rationale: لا تُختزل ἐν هنا في معنى الوساطة وحده؛ فالصياغة الحرفية الطبيعية تحفظ سعة علاقة المؤمنين بالمسيح والتوتر اللاهوتي في العبارة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ذات نبرة تسبيحية مهيبة. حُفظ التوازي بين «مبارك» و«باركنا»، واستُعمل «المسيح» بوصفه لقبًا عربيًا طبيعيًا، مع تجنب تفسير عبارة «في المسيح» تفسيرًا مذهبيًا زائدًا.
