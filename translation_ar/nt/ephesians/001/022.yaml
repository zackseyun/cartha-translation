lexical_decisions:
- source_word: πάντα
  choice: كلَّ شيء
  rationale: صيغة الجمع المحايد تدل على مجموع الأشياء، وتعبير «كل شيء» عربي طبيعي يحفظ شمول المعنى.
- source_word: ὑπέταξεν
  choice: أخضع
  rationale: ينقل معنى جعل الأشياء في منزلة خاضعة، مع المحافظة على قوة الفعل وصيغته المباشرة.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: تحت قدميه
  rationale: ترجمة مباشرة تحفظ صورة السيادة والإخضاع، كما تحفظ صدى المزمور.
- source_word: αὐτὸν ἔδωκεν
  choice: أعطاه
  rationale: يحفظ المعنى الأساسي للفعل δίδωμι ولا يستبدله بتفسير مثل «عيّنه».
- source_word: κεφαλὴν
  choice: رأسًا
  rationale: يحفظ الاستعارة التي تعبّر في السياق عن السيادة والمقام المتقدم من غير تفصيل تفسيري زائد.
- source_word: ὑπὲρ πάντα
  choice: فوق كلِّ شيء
  rationale: ينقل معنى السمو والسيادة الشاملة، ويحتفظ بتكرار فكرة «كل شيء» في اليونانية.
- source_word: τῇ ἐκκλησίᾳ
  choice: للكنيسة
  rationale: اللام العربية تلائم المجرور الدال على المتلقي أو المنتفع، وبذلك تحفظ الاحتمالين الدلاليين في الصيغة اليونانية.
theological_decisions:
- issue: علاقة رئاسة المسيح الشاملة بالكنيسة
  choice: أُعطي المسيح للكنيسة بصفته رأسًا فوق كل شيء.
  alternative: جُعل المسيح رأسًا فوق كل شيء لأجل الكنيسة ومنفعتها.
  rationale: وضع «للكنيسة» بعد «أعطاه» يجعل معنى التلقي طبيعيًا، بينما تحافظ اللام أيضًا على احتمال المنفعة، فلا يُحسم ما تسمح به صيغة المجرور اليونانية.
translation_notes:
  register: صياغة عربية فصحى واضحة ورصينة. حُفظت صورة «تحت قدميه» واستعارة «الرأس»، واستُعملت اللام في «للكنيسة» للمحافظة على الغموض الحقيقي بين التلقي والمنفعة.
