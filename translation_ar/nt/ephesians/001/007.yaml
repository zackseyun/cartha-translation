  to: فيه لنا الفداء بدمه، غفران التعديات، بحسب غنى نعمته.
  rationale: أُبقيت البنية والعبارات الأخرى كما هي لأنها أمينة وطبيعية. اقتصر التعديل على «الزلّات» إلى «التعديات» لتفادي التخفيف الدلالي ولمحاكاة παραπτώματα بدقة أكبر. لا تحتاج البدائل المعجمية المذكورة في سجل الإنجليزية إلى حواشٍ عربية هنا.
