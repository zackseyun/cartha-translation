  text: فيه لنا الفداء بدمه، غفران التعديات، بحسب غنى نعمته.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: فيه
  rationale: يعود الضمير الموصول إلى «المحبوب» في الآية السابقة، و«فيه» عربية طبيعية موجزة تحفظ معنى الارتباط بالمسيح.
- source_word: ἔχομεν
  choice: لنا
  rationale: تؤدي معنى الامتلاك الحاضر الذي يفيده المضارع، وتلائم الأسلوب العربي الطبيعي في هذا التركيب.
- source_word: ἀπολύτρωσιν
  choice: الفداء
  rationale: يحفظ معنى التحرير بكلفة أو بثمن، ويحمل الثقل اللاهوتي والاستعمالي للكلمة في رسائل بولس.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: بدمه
  rationale: تفيد الباء الوسيلة كما تفيدها διά مع المضاف إليه، وتحفظ صورة الدم الصريحة بما فيها من دلالة ذبيحية وعهدية.
- source_word: ἄφεσιν
  choice: غفران
  rationale: هو التعبير العربي الواضح والمألوف لرفع الذنب، ويلائم إضافته مباشرة إلى الزلّات.
- source_word: παραπτωμάτων
  choice: الزلّات
  rationale: تنقل معنى الانحرافات والأفعال الخاطئة دون حصر اللفظ في انتهاك وصية مصوغة، وتحافظ على الصورة الاشتقاقية للتعثّر أو السقوط.
- source_word: κατὰ τὸ πλοῦτος
  choice: بحسب غنى
  rationale: «بحسب» تعبّر عن المعيار أو المقدار، لا عن مجرد المصدر، و«غنى» مفرد في النص اليوناني.
- source_word: χάριτος
  choice: نعمته
  rationale: «النعمة» المقابل العربي الراسخ والواضح لمفهوم χάρις البولسي، والضمير يعود إلى الله في السياق.
theological_decisions:
- issue: العلاقة بين «الفداء» و«غفران الزلّات»
  choice: 'الإبقاء على البدل: «الفداء بدمه، غفران الزلّات»'
  alternative: «الفداء بدمه، أي غفران الزلّات»
  rationale: العبارة الثانية في اليونانية بدل أو بيان للأولى، وإبقاء البنية دون إضافة «أي» يحفظ قدر الالتباس والترابط الموجودين في المصدر.
- issue: لغة الكفارة في «بدمه»
  choice: الإبقاء على لفظ الدم الحسي الصريح
  alternative: «بموته» أو «بموته الذبيحي»
  rationale: النص يذكر الدم لا الموت بصيغة تفسيرية؛ واستبداله بالموت يفسر الصورة الذبيحية والعهدية بدل أن يترجمها.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ومهيبة، بصياغة موجزة تحافظ على تتابع العبارات في اليونانية. لم تُضف حاشية لأن البدائل الإنجليزية المذكورة لا تنشئ في العربية غموضًا يحتاج إلى توثيق: «فيه» تقابل المعنى الموصول طبيعيًا، و«الزلّات» تنقل παραπτώματα مباشرة.'
