  source_fidelity: 'التركيب العام أمين للنص اليوناني: «فيه» يحفظ ἐν ᾧ، و«لنا» يؤدي معنى ἔχομεν الحاضر، و«الفداء بدمه» يحافظ على ἀπολύτρωσις ووسيلة διά، كما أن «بحسب غنى نعمته» ينقل κατά بوصفه معيارًا أو مقدارًا. لكن «الزلّات» توحي في الاستعمال العربي الحديث غالبًا بهفوات أو أخطاء يسيرة، وهي أضيق وأخف من παραπτωμάτων في هذا السياق الأخلاقي.'
