  terminology: «الفداء»، «الدم»، «الغفران»، و«النعمة» مقابلات راسخة وملائمة. «التعديات» أدق من «الزلّات» لـπαραπτώματα، من غير أن تفرض تفسيرًا مذهبيًا أو تحوّلها إلى «خطايا» بمعناها الأعم.
