translation:
  language: ar
  text: لِتَدْبِيرِ مِلْءِ الأَزْمِنَةِ، لِيَجْمَعَ[a] كُلَّ شَيْءٍ فِي الْمَسِيحِ، مَا فِي السَّمَاوَاتِ وَمَا عَلَى الأَرْضِ، فِيهِ،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أن يجمع كلَّ شيءٍ تحت رأسٍ واحدٍ في المسيح»؛ فقد يفيد الفعل اليوناني معنى جمع الكل أو توحيده تحت رأس واحد.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: تَدْبِيرِ
  rationale: «تدبير» ينقل معنى الإدارة والترتيب المنظَّم، ويحافظ على دلالة العمل الإلهي المقصود من غير تضييقه إلى مجرد «خطة».
- source_word: πληρώματος τῶν καιρῶν
  choice: مِلْءِ الأَزْمِنَةِ
  rationale: يحافظ على صورة الامتلاء وعلى جمع «الأزمنة»، بما يوحي بالأوقات المعيَّنة وقد بلغت تمامها من غير حصر المعنى في نقطة النهاية وحدها.
- source_word: ἀνακεφαλαιώσασθαι
  choice: أَنْ يَجْمَعَ
  rationale: «يجمع» تعبير عربي طبيعي ينقل فكرة ضم الأشياء كلها معًا، مع إبقاء إيحاء التلخيص أو الجمع تحت رأس واحد في الحاشية تجنبًا لحسم التعدد الدلالي في المتن.
- source_word: τὰ πάντα
  choice: كُلَّ شَيْءٍ
  rationale: صياغة جامعة وطبيعية في العربية، وتلائم النطاق الكوني الذي توضحه العبارتان التاليتان.
- source_word: ἐν τῷ Χριστῷ
  choice: فِي الْمَسِيحِ
  rationale: استُعمل «المسيح» بوصفه لقبًا، وحُفظ تركيب «في» لما له من أهمية في العبارة.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: مَا فِي السَّمَاوَاتِ
  rationale: يحفظ الدلالة المكانية وجمع «السماوات» الوارد في اليونانية.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: مَا عَلَى الأَرْضِ
  rationale: ترجمة مكانية مباشرة تحافظ على المقابلة بين السماوات والأرض.
- source_word: ἐν αὐτῷ
  choice: فِيهِ
  rationale: يحفظ تكرار العبارة اليونانية وإحالتها الطبيعية إلى المسيح من غير إضافة معنى الحصر.
theological_decisions:
- issue: دلالة Χριστῷ
  choice: الْمَسِيحِ
  alternative: المسيح بوصفه اسمًا عَلَمًا صرفًا
  rationale: اللفظ يعمل هنا بوصفه لقبًا ذا دلالة مسيانية، والصياغة العربية نفسها تحفظ هذا اللقب المألوف من غير إضافة تفسير مذهبي.
- issue: دلالة ἀνακεφαλαιώσασθαι
  choice: أَنْ يَجْمَعَ كُلَّ شَيْءٍ
  alternative: أن يجمع كل شيء تحت رأس واحد
  rationale: الفعل يحتمل معنى الجمع أو التلخيص، وقد يتضمن إيحاء الجمع تحت رأس واحد. اختير التعبير الأوسع والأطبع في المتن، وحُفظت دلالة «الرأس» المحتملة في الحاشية صونًا للتوتر الدلالي واللاهوتي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. حُفظ تركيب الآية بوصفه جزءًا متصلًا من الجملة السابقة، كما حُفظ التكرار «في المسيح ... فيه» والنطاق الكوني للعبارة.
