lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: لِمَدْحِ
  rationale: تنقل اللام معنى الغاية أو النتيجة في العبارة اليونانية، و«مدح» لفظ عربي واضح يلائم السياق التسبيحي.
- source_word: δόξης
  choice: مجدِ
  rationale: «المجد» هو المقابل الأنسب في هذا السياق البولسي، ويحفظ الطابع اللاهوتي والتسبيحي للفظ.
- source_word: χάριτος
  choice: نعمته
  rationale: «النعمة» تعبر عن إحسان الله الخلاصي وتحفظ المصطلح اللاهوتي الراسخ.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: التي أنعم بها علينا
  rationale: تحيل «التي» إلى النعمة، وتحفظ صيغة «أنعم» الصلة الاشتقاقية العربية بين الاسم والفعل على نحو طبيعي، بينما توضح الباء وجه الإنعام.
- source_word: ἐν
  choice: في
  rationale: يحفظ حرف الجر الأساسي دون حصر دلالته في الوسيلة أو الاتحاد، فيبقي سعة التعبير اليوناني.
- source_word: τῷ ἠγαπημένῳ
  choice: المحبوب
  rationale: ينقل اسم المفعول المستعمل لقبًا، ويحفظ الإشارة المسيحانية دون إضافة «الابن» غير المذكورة صراحة في الآية.
theological_decisions:
- issue: العلاقة الاشتقاقية بين χάρις وχαριτόω
  choice: نعمته، التي أنعم بها علينا
  alternative: نعمته، التي تفضّل بها علينا
  rationale: يحفظ الاختيار الصلة اللفظية والدلالية بين «النعمة» و«أنعم»، ويبيّن أن الله عاملنا بنعمته دون تفسير زائد.
- issue: الدلالة المسيحانية لعبارة τῷ ἠγαπημένῳ
  choice: المحبوب
  alternative: ابنه المحبوب
  rationale: العبارة تشير إلى المسيح، لكن الأصل لا يذكر «الابن» هنا صراحة؛ لذلك يحفظ «المحبوب» اللقب وغنى دلالة النص بلا توسع.
- issue: دلالة ἐν في العبارة الختامية
  choice: في المحبوب
  alternative: بواسطة المحبوب
  rationale: يحافظ «في» على الغموض الدلالي المقصود بين المجال والاتحاد والوساطة، بدل قصر العبارة على معنى واحد.
