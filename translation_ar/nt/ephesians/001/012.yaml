  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: ar
  text: لكي نكون نحن الذين سبق أن رجوا في المسيح، لمدح مجده.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي نكون نحن الذين كانوا أول من رجوا في المسيح، لمدح مجده».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: لكي نكون
  rationale: التركيب بالجار والمصدر المعرّف يدل على الغاية أو النتيجة، و«لكي نكون» ينقل ذلك بوضوح وطبيعية في العربية.
- source_word: ἡμᾶς
  choice: نحن
  rationale: هو فاعل المصدر في اليونانية، ويُعبَّر عنه في إعادة الصياغة العربية بالفعل وضمير الفصل للتوكيد والمحافظة على بروز الجماعة المقصودة.
- source_word: εἰς ἔπαινον
  choice: لمدح
  rationale: اللام تعبّر بإيجاز وطبيعية عن الغاية أو النتيجة، وتحافظ على صيغة العبارة المتكررة في هذا السياق.
- source_word: δόξης αὐτοῦ
  choice: مجده
  rationale: ترجمة مباشرة تحفظ لفظ «المجد» بما له من ثقل كتابي ولا تحوّله إلى تفسير مثل البهاء أو الجلال.
- source_word: τοὺς προηλπικότας
  choice: الذين سبق أن رجونا
  rationale: تحفظ دلالة السبق في الفعل المركب وصيغة التمام ذات الأثر المستمر، من غير الجزم بأن المقصود أننا كنا أول جماعة آمنت.
- source_word: ἐν τῷ Χριστῷ
  choice: في المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، و«في» تحفظ الصياغة البولسية التي تجعل الرجاء متمركزًا فيه من غير تفكيك معناها إلى عبارة تفسيرية.
theological_decisions:
- issue: هل يصف τοὺς προηλπικότας جماعة كانت أول من رجا في المسيح، أم يصف من كان رجاؤهم فيه سابقًا؟
  choice: الذين سبق أن رجونا في المسيح
  alternative: الذين كنا أول من رجا في المسيح
  rationale: السابقة προ- تدل على الأسبقية، لكن النص لا يحسم وحده هل هي أسبقية زمنية مطلقة لجماعة أولى أم رجاء سابق فحسب. يحفظ المتن القراءة الأشد احتياطًا، وتُذكر القراءة الأقوى في الحاشية.
translation_notes:
  register: عربية فصحى واضحة وموقرة. أُبقيت صيغة «في المسيح» لما لها من أهمية في السياق، واستُعمل «رجونا» بدل «وضعنا رجاءنا» للاختصار والقرب من الفعل اليوناني. وُضع تركيب «الذين سبق أن رجونا» بلا فصل اعتراضي ليحدد المقصود بضمير «نحن».
