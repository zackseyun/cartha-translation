- from: لكي نكون نحن الذين سبق أن رجونا في المسيح، لمدح مجده.[a]
  to: لكي نكون نحن الذين سبق أن رجوا في المسيح، لمدح مجده.[a]
  rationale: 'التعديل نحوي لازم وآمن: استُبدل «رجونا» بـ«رجوا» ليتوافق فعل الصلة مع «الذين»، مع الإبقاء على «نحن» بوصفها الجماعة التي يحددها الوصف. وتعيد الحاشية البديل الذي يفهم προηλπικότας بمعنى «الأول من رجوا»، من غير فرض تحديد تفسيري لهوية هذه الجماعة.'
