review_pass:
  verdict: revise
  source_fidelity: 'المعنى الرئيس محفوظ: «لكي نكون» تنقل غاية εἰς τὸ εἶναι، و«لمدح مجده» تقابل εἰς ἔπαινον δόξης αὐτοῦ، و«في المسيح» مناسبة لـἐν τῷ Χριστῷ. لكن «الذين سبق أن رجونا» غير سليمة نحويًا؛ إذ يعود الضمير في «رجونا» على المتكلمين، بعد اسم موصول جمع، فتختلط البنية الموصولية. يلزم أن يطابق الفعل الاسم الموصول: «الذين سبق أن رجوا»، أو أن يعاد تركيب الجملة بضمير المتكلمين على نحو واضح.'
  naturalness: الصياغة المقترحة «لكي نكون نحن الذين سبق أن رجونا...» متعثرة في العربية الفصحى بسبب عدم اتساق الإحالة والاتفاق. الصياغة «لكي نكون نحن الذين سبق أن رجوا في المسيح، لمدح مجده» سليمة ومفهومة، وتحافظ على كون الوصف محددًا لـ«نحن».
  terminology: '«المسيح» و«المجد» و«الرجاء» ألفاظ راسخة ومناسبة. «لمدح مجده» أمينة، وإن كانت «لتسبيح مجده» ممكنة؛ لا حاجة إلى استبدالها. الحاشية الحالية تكرر الخلل النحوي نفسه في «كنا أول من رجا»؛ والأفصح: «كنا أول من رجا» مقبولة لأن «نحن» هو المرجع، لكن مع البنية الموصولية يلزم ضبطها لتكون «الذين كانوا أول من رجوا».'
  issues:
  - severity: medium
    issue: عدم اتساق الضمير في «الذين سبق أن رجونا».
    rationale: «الذين» اسم موصول لجمع الغائب، ولذلك يقتضي صلةً مثل «رجوا». أما «رجونا» فيجعل الفعل للمتكلمين ويكسر البناء النحوي. لا يطابق هذا تركيب τοὺς προηλπικότας بوصفه وصفًا محددًا لـ«نحن».
  - severity: low
