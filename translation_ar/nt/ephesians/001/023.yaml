translation:
  language: ar
  text: التي هي جسده، ملءُ الذي يملأ[b] كلَّ شيء في الكل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملءُ الذي يملأ الكلَّ في الكل»؛ فالعبارة اليونانية الأخيرة موجزة وتحتمل أكثر من وجه.'
    reason: lexical_alternative
  - marker: b
    text: يمكن من جهة الصيغة النحوية أن تُفهم الكلمة أيضًا بمعنى «الذي يُملأ»، وإن كان معظم المفسرين يفهمونها هنا بمعنى «الذي يملأ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: التي
  rationale: اسم موصول يعود إلى الكنيسة المذكورة في الآية السابقة؛ والصياغة العربية الطبيعية تحفظ الإحالة من غير إثقال الدلالة الوصفية المحتملة.
- source_word: τὸ σῶμα αὐτοῦ
  choice: جسده
  rationale: ينقل مباشرة استعارة الجسد البولسية وعلاقة الكنيسة بالمسيح.
- source_word: τὸ πλήρωμα
  choice: ملءُ
  rationale: يحفظ كثافة اللفظ اليوناني وانفتاحه الدلالي، من غير حسمه إلى «ما يملؤه» أو «ما يكمّله».
- source_word: τοῦ ... πληρουμένου
  choice: الذي يملأ
  rationale: مع أن صيغة اسم الفاعل وسطية/مبنية للمجهول شكليًا، فالمعنى الفاعلي هو الأرجح في السياق؛ وتُذكر القراءة المبنية للمجهول في الحاشية.
- source_word: τὰ πάντα
  choice: كلَّ شيء
  rationale: تعبير عربي جامع وطبيعي ينقل شمول الجمع المحايد اليوناني.
- source_word: ἐν πᾶσιν
  choice: في الجميع
  rationale: صياغة قريبة من اليونانية وتحفظ غموض العبارة بين الأشخاص والأشياء أو المجال الشامل، بدل تقييدها بتفسير واحد.
theological_decisions:
- issue: دلالة πλήρωμα وعلاقتها بالكنيسة والمسيح
  choice: وصف الكنيسة بأنها «ملء» المسيح مع إبقاء طبيعة هذه العلاقة مفتوحة
  alternative: أن تكون الكنيسة ما يملؤه المسيح، أو ما يُتمّه ضمن استعارة الجسد
  rationale: النص اليوناني يحتمل هذه الروابط المتقاربة، ولفظ «ملء» يحفظ التوتر اللاهوتي بدل فضّه بتفسير زائد.
- issue: مبنى ودلالة πληρουμένου
  choice: 'المعنى الفاعلي: «الذي يملأ»'
  alternative: «الذي يُملأ»
  rationale: السياق يرجّح المعنى الفاعلي، لكن الصيغة اليونانية تسمح نحويًا بقراءة مبنية للمجهول، ولذلك تُحفظ في حاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «ملء» للمحافظة على المصطلح اللاهوتي المكثف، و«في الجميع» للمحافظة على الإيجاز والغموض الحقيقي في ἐν πᾶσιν.
