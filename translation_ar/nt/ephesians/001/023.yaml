  source_fidelity: 'المعنى الرئيس محفوظ: تعود «التي» إلى الكنيسة، وتُحفظ استعارة الجسد ولفظ «ملء»، كما أن القراءة الفاعلية لـ πληρουμένου مرجحة ويصح التنبيه إلى البديل المبني للمجهول. لكن «في الجميع» تُفهم في العربية المعاصرة على أنها مقصورة على الأشخاص («among/in everyone») وتضيّق سعة ἐν πᾶσιν، التي تبقى في اليونانية أوسع وموضع نقاش.'
