  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: ar
  text: إذ أُنيرت عيون قلوبكم، لكي تعرفوا ما هو رجاء دعوته، وما هو غنى[a] مجد ميراثه بين القديسين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثراء مجد ميراثه».'
    reason: بديل معجمي لـπλοῦτος، مع الحفاظ على تتابع الإضافات في العبارة اليونانية.
  - marker: b
    text: 'أو: «في القديسين»، أو: «بين شعبه المقدس».'
    reason: حرف الجر اليوناني ἐν يحتمل «في» أو «بين»، و«شعبه المقدس» توضيح ممكن للقديسين دون فرضه في المتن.
lexical_decisions:
- source_word: πεφωτισμένους
  choice: وقد أُنيرت
  rationale: 'صياغة مبنية للمجهول تحفظ معنى اسم المفعول اليوناني في الزمن التام: إنارة حدثت وما زال أثرها قائمًا، مع التعبير عنها بعربية طبيعية.'
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: عيون قلوبكم
  rationale: تحافظ على استعارة «العيون» و«القلب» بدل اختزالها في الذهن أو الفهم.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: لكي تعرفوا
  rationale: تنقل بوضوح دلالة الغاية في التركيب اليوناني.
- source_word: ἡ ἐλπὶς
  choice: رجاء
  rationale: «الرجاء» هو المقابل الكتابي العربي الطبيعي، ويعبّر هنا عن التوقع الواثق.
- source_word: τῆς κλήσεως αὐτοῦ
  choice: دعوته
  rationale: تحفظ الإضافة كما في اليونانية من غير توسيع تفسيري.
- source_word: ὁ πλοῦτος τῆς δόξης
  choice: غنى المجد
  rationale: ينقل معنى الوفرة ويحافظ على تتابع الإضافات في الأصل من غير تسطيح الصورة.
- source_word: τῆς κληρονομίας αὐτοῦ
  choice: ميراثه
  rationale: تبقي العبارة مفتوحة لاحتمال الميراث الذي يخص الله أو الذي يمنحه، من غير حسم تفسيري.
- source_word: ἐν τοῖς ἁγίοις
  choice: بين القديسين
  rationale: صياغة عربية طبيعية تحمل المعنى الجماعي، مع إثبات البديل الحرفي «في القديسين» في الحاشية.
theological_decisions:
- issue: هل «ميراثه» هو شعب الله بوصفهم ميراثه، أم الميراث الذي يمنحه للمؤمنين؟
  choice: ميراثه
  alternative: الميراث الذي يمنحه
  rationale: إضافة الضمير في اليونانية لا تحسم وحدها اتجاه العلاقة؛ لذلك حُفظت الصياغة الموجزة والتوتر اللاهوتي بدل فرض تفسير بعينه.
- issue: 'دلالة ἐν τοῖς ἁγίοις: أهي «بين القديسين» أم «في القديسين»؟'
  choice: بين القديسين
  alternative: في القديسين
  rationale: «بين» أوضح في العربية إذا كان المقصود المجال الجماعي، لكن «في» ممكنة ومهمة تفسيريًا، ولذلك أُثبتت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت استعارة «عيون القلوب» والمصطلحات البولسية «الرجاء» و«الدعوة» و«الميراث» و«القديسون»، مع تجنب الشرح العقائدي داخل المتن.
