  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: ar
  text: كي يمنحكم إلهُ ربنا يسوع المسيح، أبو المجد، روحَ حكمةٍ وإعلانٍ[a] في معرفتكم له[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُفهم «روح حكمة وإعلان» على أنه روح أو استعداد يمنحه الله، أو على أنه الروح القدس الذي يمنح الحكمة والإعلان؛ واللفظ اليوناني πνεῦμα يحتمل الوجهين.
    reason: alternative_reading
  - marker: b
    text: قد تحمل الكلمة اليونانية ἐπίγνωσις معنى المعرفة التامة أو العميقة؛ والترجمة هنا لا تحسم مقدار هذه المعرفة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: كي
  rationale: تفيد الغاية أو مضمون الصلاة، وتصل هذا الطلب بما قبله اتصالًا طبيعيًا.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: إلهُ ربنا يسوع المسيح
  rationale: نقل مباشر وواضح للإضافة في اليونانية، مع إبقاء «المسيح» لقبًا دالًا على المسيا في العربية.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: أبو المجد
  rationale: يحافظ على تركيب الإضافة «أبو/أب المجد» وعلى ثقله اللاهوتي، بدل تحويله في المتن إلى صفة مثل «الأب المجيد».
- source_word: δώῃ
  choice: يمنحكم
  rationale: فعل عربي طبيعي في سياق عطية إلهية، وينقل معنى الإعطاء في صيغة الطلب التابعة لـ«كي».
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: روحَ حكمةٍ وإعلانٍ
  rationale: يحافظ على تركيب المصدر من غير أن يحسم هل المقصود روح أو استعداد يمنحه الله أم الروح القدس؛ وتُذكر القراءتان في الحاشية.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: في معرفتكم له
  rationale: صياغة عربية واضحة تنقل معنى معرفة الشخص، وتتجنب احتمال فهم «معرفته» على أنها المعرفة التي يمتلكها هو، مع عدم المبالغة في تفسير درجة المعرفة التي قد تفيدها ἐπίγνωσις.
theological_decisions:
- issue: 'مرجع πνεῦμα: أهو روح أو استعداد يمنحه الله، أم الروح القدس؟'
  choice: روحَ حكمةٍ وإعلانٍ
  alternative: روحَ الحكمة والإعلان، أي الروح القدس
  rationale: الاسم اليوناني جاء بلا أداة تعريف، ويحتمل الوجهين. والصياغة العربية في المتن تبقي اللفظ غير محسوم، بينما توضح الحاشية موضع الاحتمال.
- issue: دلالة Χριστός في Ἰησοῦ Χριστοῦ
  choice: المسيح
  alternative: المسيا
  rationale: «المسيح» في العربية ترجمة راسخة للقب Χριστός وتحافظ على معناه المسياني، فلا حاجة إلى معاملته كاسم عائلي أو استبداله بلفظ منقول.
- issue: تفسير إضافة «أبو المجد»
  choice: أبو المجد
  alternative: الأب المجيد
  rationale: الإضافة اليونانية قد تُفهم على أكثر من وجه، لذلك حُفظ تركيبها في المتن ولم تُختزل إلى صفة تحسمها.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية رصينة. حُفظ تركيب «أبو المجد» لقربه من الأصل، واستُعملت «في معرفتكم له» منعًا للالتباس النحوي في العربية. جميع علامات الحواشي مثبتة في المتن.
