  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: ar
  text: وفيه أيضًا جُعِلنا ميراثًا[a]، إذ سبق أن عُيِّنّا بحسب قصد ذاك الذي يُجري كلَّ شيء وفق مشورة مشيئته،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نلنا ميراثًا». يمكن أن يدل الفعل اليوناني إما على نيل ميراث، وإما على أن يُجعل المؤمنون نصيب الله المخصص له.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: وفيه
  rationale: يعود الضمير إلى المسيح في السياق السابق، وتحفظ العبارة معنى الارتباط بالمسيح بصياغة عربية طبيعية.
- source_word: ἐκληρώθημεν
  choice: جُعِلنا ميراثًا
  rationale: تحفظ صيغة المبني للمجهول والمعنى المرجح بأن المؤمنين صاروا نصيب الله وميراثه، مع إبقاء المعنى الآخر الممكن في الحاشية.
- source_word: προορισθέντες
  choice: إذ سبق أن عُيِّنّا
  rationale: تنقل معنى التعيين السابق بوضوح من غير تحميل اللفظ منظومة لاهوتية تتجاوز النص.
- source_word: κατὰ πρόθεσιν
  choice: بحسب قصد
  rationale: تنقل معنى القصد الهادف أو التدبير المقصود بصياغة موجزة وطبيعية.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: ذاك الذي يُجري كلَّ شيء
  rationale: تُبقي الله فاعلًا وتعبّر عن فعله المؤثر في كل الأشياء من غير تحديد زائد لطريقة ذلك الفعل.
- source_word: κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ
  choice: وفق مشورة مشيئته
  rationale: تحفظ في βουλή معنى المشورة والتدبير المتعمَّد، كما تحفظ علاقتها الإضافية بالمشيئة.
theological_decisions:
- issue: دلالة ἐκληρώθημεν
  choice: المؤمنون جُعلوا ميراثًا، أي نصيبًا مخصصًا لله.
  alternative: نال المؤمنون ميراثًا.
  rationale: تسمح صيغة الفعل اليوناني المبني للمجهول بالمعنيين. يرجح السياق وخلفية العهد القديم معنى صيرورة شعب الله ميراثًا له، لكن احتمال نيلهم الميراث حقيقي، ولذلك أُثبت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «سبق أن عُيِّنّا» بدل مصطلح مذهبي أثقل، وحُفظ التوتر الدلالي في الفعل ἐκληρώθημεν بحاشية صريحة.
