review_pass:
  verdict: revise
  source_fidelity: 'الترجمة دقيقة في البنية الأساسية: «الذين» تحافظ على صلة الكلام بالسياق السابق، و«أسلموا أنفسهم» تنقل الفعل الانعكاسي الإرادي παρέδωκαν ἑαυτούς، و«كل نوع من النجاسة» تؤدي الشمول في ἀκαθαρσίας πάσης. غير أن «بنهم» يركّز على الشره أو الإفراط، ولا يؤدي بدقة كافية πλεονεξία، التي تدل أساسًا على الطمع والرغبة الجشعة في المزيد. لذلك يُستبدل بـ«بطمع».'
  naturalness: الصياغة فصيحة وواضحة. وعبارة «بعدما تبلّد إحساسهم» مفهومة وطبيعية، وتفيد الحالة الناتجة عن الفعل التام اليوناني في السياق. تعديل العبارة الأخيرة إلى «بطمع» أكثر سلاسة ودقة في هذا السياق.
  terminology: «الفجور» اختيار مقبول لـἀσέλγεια؛ فهو يحافظ على دلالة الانفلات الأخلاقي الوقح من غير حصر المصطلح في ممارسة جنسية محددة. ويُحافَظ على «النجاسة» للمصطلح ἀκαθαρσία. أما πλεονεξία فينبغي أن يكون مقابلها الرئيس «طمع»، مع ذكر «النهم» و«الجشع» بديلين محتملين في الحاشية.
  issues:
  - severity: medium
    issue: المقابل الرئيس لـἐν πλεονεξίᾳ هو «بنهم».
    rationale: «النهم» يدل غالبًا على الشراهة أو الإفراط في التناول، بينما πλεονεξία تعني الطمع أو الجشع، أي الرغبة الاستحواذية في المزيد. «بطمع» أدق، ويحافظ على إمكان فهم شبه الجملة وصفًا لطريقة ممارسة النجاسة.
