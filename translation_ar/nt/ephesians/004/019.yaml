translation:
  language: ar
  text: الَّذِينَ، بَعْدَمَا تَبَلَّدَ إِحْسَاسُهُمْ[a]، أَسْلَمُوا أَنْفُسَهُمْ إِلَى الْفُجُورِ[b] لِيُمَارِسُوا كُلَّ نَوْعٍ مِنَ النَّجَاسَةِ بِطَمَعٍ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بَعْدَمَا فَقَدُوا كُلَّ إِحْسَاسٍ»، أو: «إِذْ صَارُوا عَدِيمِي الإِحْسَاسِ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الانْحِلَالِ»، أو: «الْخَلَاعَةِ».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بِنَهَمٍ»، أو: «فِي جَشَعٍ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: الَّذِينَ
  rationale: اسم موصول يعيد الكلام إلى الأمم المذكورين قبلًا، ويحافظ على اتصال الجملة بسياقها من غير إضافة توكيد غير لازم.
- source_word: ἀπηλγηκότες
  choice: بَعْدَمَا تَبَلَّدَ إِحْسَاسُهُمْ
  rationale: ينقل اسم الفاعل التام الدال على بلوغ حالة من فقدان الحس الأخلاقي مع بقاء نتيجة التحول؛ ولفظ «تبلّد» واضح وطبيعي في العربية المعاصرة.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: أَسْلَمُوا أَنْفُسَهُمْ
  rationale: يعبّر عن التسليم الإرادي للنفس، ويحافظ على دلالة الضمير الانعكاسي وقوة الفعل اليوناني.
- source_word: τῇ ἀσελγείᾳ
  choice: إِلَى الْفُجُورِ
  rationale: «الفجور» يدل على الانفلات الوقح من الضوابط الأخلاقية، وقد يشمل الانحلال الجنسي من غير حصر اللفظ فيه وحده.
- source_word: εἰς ἐργασίαν
  choice: لِيُمَارِسُوا
  rationale: صيغة الغاية تنقل معنى الاتجاه إلى المزاولة أو الممارسة، وهي أوجز وأطبع بالعربية من ترجمة الاسم ترجمة حرفية.
- source_word: ἀκαθαρσίας πάσης
  choice: كُلَّ نَوْعٍ مِنَ النَّجَاسَةِ
  rationale: تنقل الشمول والتنوع اللذين يفيدهما التركيب، بصياغة عربية طبيعية.
- source_word: ἐν πλεονεξίᾳ
  choice: بِنَهَمٍ
  rationale: ينقل معنى الرغبة الشرهة التي لا تشبع، ويصلح بوصفه حالًا يبيّن كيفية ممارسة النجاسة، مع إثبات احتمال «الطمع» في الحاشية.
theological_decisions:
- issue: القوة الأخلاقية والنفسية للفظ ἀπηλγηκότες
  choice: تَبَلَّدَ إِحْسَاسُهُمْ
  alternative: فَقَدُوا كُلَّ إِحْسَاسٍ؛ صَارُوا عَدِيمِي الإِحْسَاسِ
  rationale: السياق يصف فقدان الحس الأخلاقي الذي يفضي إلى الاستسلام للنجاسة، لا مجرد خدر عاطفي أو حالة سريرية.
- issue: مدى دلالة ἀσέλγεια
  choice: الْفُجُورِ
  alternative: الانحلال؛ الخلاعة
  rationale: يحافظ «الفجور» على معنى الانفلات الوقح وغير المنضبط، بما في ذلك الدلالة الجنسية الشائعة، من غير قصره حصرًا على خطيئة جنسية بعينها.
- issue: تعلّق ἐν πλεονεξίᾳ ودلالته
  choice: بِنَهَمٍ، بوصفه وصفًا لكيفية ممارسة النجاسة
  alternative: بِطَمَعٍ؛ فِي جَشَعٍ
  rationale: الأقرب في ترتيب العبارة أن يصف شبه الجملة ممارسة النجاسة بروح لا تشبع، لكن لفظ πλεονεξία يحتمل أيضًا معنى الطمع أو الجشع، لذلك لم يُحسم هذا الاحتمال في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، مع جملة موصولة تتصل بالسياق السابق. استُخدم «أسلموا أنفسهم» للحفاظ على معنى التسليم الإرادي، و«بنهم» لإظهار الشراهة التي لا تشبع من غير إلغاء احتمال معنى الطمع.
