source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: ar
  text: وهو نفسه أعطى بعضًا ليكونوا رسلًا، وبعضًا أنبياء، وبعضًا مبشّرين، وبعضًا رعاةً ومعلّمين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تَرِد في اليونانية أداة تعريف واحدة قبل «رعاة ومعلّمين»، وقد يشير ذلك إلى علاقة وثيقة بوجه خاص بين هذين الدورين، لكنه لا يقتضي بالضرورة أنهما منصب واحد.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: وهو نفسه
  rationale: تحفظ الواو صلة الآية بسياقها، ويؤدي «نفسه» توكيد الضمير اليوناني البارز.
- source_word: ἔδωκεν
  choice: أعطى
  rationale: المعنى المعجمي المباشر للفعل، ويجنب تضييقه إلى «عيّن»؛ فالسياق يعرض هؤلاء الأشخاص بوصفهم عطايا.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: بعضًا ... وبعضًا
  rationale: ينقل التقسيم الذي تصنعه صيغة μέν/δέ المتكررة بأسلوب عربي طبيعي.
- source_word: ἀποστόλους
  choice: رسلًا
  rationale: المقابل العربي المباشر والمستقر للمصطلح اليوناني في هذا السياق.
- source_word: προφήτας
  choice: أنبياء
  rationale: ترجمة مباشرة تحفظ دلالة الدور المذكور بلا زيادة تفسيرية.
- source_word: εὐαγγελιστάς
  choice: مبشّرين
  rationale: لفظ عربي موجز ومألوف لمن يعلنون البشارة، ويناسب تعداد أدوار الخدمة.
- source_word: ποιμένας
  choice: رعاةً
  rationale: يحفظ صورة الرعاية المأخوذة من الراعي، وهو في العربية أيضًا مصطلح كنسي مفهوم من غير إلغاء للاستعارة.
- source_word: καὶ διδασκάλους
  choice: ومعلّمين
  rationale: ترجمة مباشرة، مع إبقاء العطف كما في اليونانية من دون دمج الدورين قسرًا.
theological_decisions:
- issue: هل «الرعاة والمعلّمون» جماعة واحدة ذات دور مركب أم جماعتان بينهما صلة وثيقة؟
  choice: إبقاء الاسمين معطوفين من غير حسم
  alternative: «رعاةً معلّمين» بوصفه دورًا واحدًا مركبًا، أو فصل الدورين فصلًا تامًا
  rationale: ورود أداة تعريف واحدة قبل الاسمين في اليونانية قد يدل على علاقة وثيقة بينهما، لكنه لا يوجب اعتبارهما منصبًا واحدًا؛ لذلك تحفظ الصياغة التوتر النحوي واللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «ليكونوا» مع الفئة الأولى لتوضيح معنى إعطاء أشخاص بهذه الصفات، ويُفهم محذوفًا مع بقية عناصر التعداد تجنبًا للتكرار الثقيل. وُضع تنوين النصب حيث يفيد القراءة السليمة.
