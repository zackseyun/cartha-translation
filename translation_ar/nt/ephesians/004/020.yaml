  text: أَمَّا أَنْتُمْ فَلَمْ تَتَعَلَّمُوا الْمَسِيحَ هَكَذَا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: أَنْتُمْ
  rationale: ضمير جمع المخاطبين مذكور صراحة للتوكيد وإبراز المقابلة مع سلوك الأمم السابق وصفه.
- source_word: δὲ
  choice: أَمَّا
  rationale: تفيد الانتقال التقابلي، ومع الضمير الصريح تصوغ في العربية مقابلة طبيعية واضحة؛ وتأتي الفاء في جواب «أمّا».
- source_word: οὐχ οὕτως
  choice: لَمْ ... هَكَذَا
  rationale: يحافظ «هكذا» على دلالة الكيفية، أي إن تعلُّمهم المسيح لم يكن على النحو الذي وصفه السياق السابق.
- source_word: ἐμάθετε
  choice: تَتَعَلَّمُوا
  rationale: ينقل المعنى المباشر للفعل μανθάνω، من غير تحويله إلى المبني للمجهول «تُعَلَّموا» ولا تفسيره بمعنى «تعرفوا».
- source_word: τὸν Χριστόν
  choice: الْمَسِيحَ
  rationale: يحافظ على اللقب المسياني وعلى التركيب اللافت «تعلّمتم المسيح» دون إضافة «يسوع» أو إعادة صياغة تفسيرية.
theological_decisions:
- issue: هل يُنقل Χριστόν بوصفه لقبًا مسيانيًا أم بصيغة اسمية مألوفة؟
  choice: الْمَسِيحَ
  alternative: المسيحَ بوصفه اسمًا اصطلاحيًا بلا إبراز لدلالة اللقب
  rationale: اللفظ اليوناني يحتفظ هنا بقيمته المسيانية، والعربية «المسيح» طبيعية وتؤدي اللقب والاسم الاصطلاحي معًا من غير إضافة تفسيرية.
- issue: التركيب غير المألوف ἐμάθετε τὸν Χριστόν
  choice: تَتَعَلَّمُوا الْمَسِيحَ
  alternative: تتعلّموا عن المسيح / تعرفوا المسيح
  rationale: أُبقي المفعول شخصًا كما في الأصل، حفاظًا على التوتر الدلالي بين تعلّم التعليم وتعلّم الشخص، بدل حسمه بإضافة «عن» أو باستبدال الفعل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم تركيب «أمّا أنتم» لإظهار المقابلة والتوكيد، مع إبقاء العبارة المقصودة غير المألوفة «تتعلّموا المسيح» كما في اليونانية.
