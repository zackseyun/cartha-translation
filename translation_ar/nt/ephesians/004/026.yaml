- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: على غضبكم
  rationale: «الغضب» أوضح مقابل سياقي، ويتجاوب مع «اغضبوا»، مع الإقرار في الحاشية بأن اللفظ قد يدل أيضًا على الاستفزاز أو حالة السخط.
theological_decisions:
- issue: هل تُفهم العبارة الافتتاحية أمرًا بالغضب أم سماحًا شرطيًا عند وقوعه؟
  choice: 'حُفظت صيغة الأمر: «اغضبوا ولا تخطئوا».'
  alternative: «إذا غضبتم فلا تخطئوا».
  rationale: الصيغة اليونانية أمر، وحفظها يصون التوتر المقصود في النص؛ فالنهي التالي لا يجعل العبارة تأييدًا مطلقًا للغضب، بل يقيّده أخلاقيًا وزمنيًا.
