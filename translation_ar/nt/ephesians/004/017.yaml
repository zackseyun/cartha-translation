  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: ar
  text: 'لذلك أقول هذا وأشهد في الرب: يجب ألّا تسلكوا بعد الآن كما تسلك الأمم[a] أيضًا، في بُطل أذهانهم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «غير اليهود»؛ وتترجم بعض الترجمات هذه الكلمة هنا «الوثنيين».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: لذلك أقول هذا
  rationale: تنقل «لذلك» الاستنتاج من الوصايا السابقة، وتحافظ «هذا» على موقع Τοῦτο بوصفه مفعول القول.
- source_word: μαρτύρομαι
  choice: أشهد
  rationale: تحافظ على معنى الشهادة والتوكيد الشخصي الجاد من غير تحويله إلى مجرد إلحاح.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: ترجمة مباشرة تبقي احتمال دلالة العبارة على المجال أو السلطان اللذين يتكلم فيهما بولس.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: يجب ألّا تسلكوا بعد الآن
  rationale: تُظهر «يجب» قوة الوصية التي يحملها المصدر في هذا السياق، وتحافظ «تسلكوا» على استعارة السلوك الأخلاقي.
- source_word: καθὼς καὶ τὰ ἔθνη περιπατεῖ
  choice: كما تسلك الأمم أيضًا
  rationale: تحافظ على تكرار فعل السلوك وعلى καί، وتترجم ἔθνη بلفظ عربي مباشر لا يضيف حكمًا دينيًا غير مصرح به.
- source_word: ἐν ματαιότητι τοῦ νοὸς αὐτῶν
  choice: في بُطل تفكيرهم
  rationale: «بُطل» ينقل الخواء وعدم الجدوى في ματαιότης، و«تفكيرهم» يؤدي المعنى العقلي لـ νοῦς بعبارة عربية واضحة وطبيعية.
theological_decisions:
- issue: دلالة ἔθνη في مقابلة أخلاقية موجهة إلى كنيسة تضم مؤمنين من الأمم
  choice: الأمم
  alternative: الوثنيون؛ غير اليهود
  rationale: «الأمم» تحفظ الفئة الإثنية والعهدية في استعمال بولس ولا تضيف إلى الاسم إيحاء «الوثنيين» الأقوى، مع إبقاء المقصود الدقيق متاحًا في الحاشية.
- issue: قوة المصدر περιπατεῖν بعد λέγω καὶ μαρτύρομαι
  choice: يجب ألّا تسلكوا
  alternative: ألّا تسلكوا
  rationale: إظهار الوجوب ينقل القوة الوعظية الآمرة في التركيب من غير إضافة مضمون لاهوتي مستقل.
translation_notes:
  register: صياغة عربية فصحى معاصرة ذات نبرة جادة وكريمة. أُبقيت استعارة «السلوك» وتعبير «في الرب»، واستُعمل «بُطل تفكيرهم» بدل تركيب حرفي أثقل مثل «بُطل أذهانهم».
