id: EPH.4.24
reference: Ephesians 4:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: ar
  text: وأن تلبسوا الإنسان الجديد[a]، المخلوق على مثال الله[b] في برّ وقداسة الحق[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الذات الجديدة» أو «الشخص الجديد». واليونانية حرفيًا: «الإنسان الجديد»، بما يوازي «الإنسان العتيق» في السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بحسب الله»؛ أي بما يوافق الله أو على مثاله.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن فهم العبارة أيضًا: «في البر والقداسة الحقيقيين» أو «اللذين يصدران عن الحق». والصياغة في المتن تحافظ على الإضافة في اليونانية.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: أن تلبسوا
  rationale: يحافظ على استعارة خلع الثوب ولبسه في السياق، ويعبّر عن صيغة الوسط اليونانية تعبيرًا عربيًا طبيعيًا.
- source_word: καινὸν
  choice: الجديد
  rationale: ينقل معنى الجِدّة في النوع والصفة، لا مجرد الحداثة الزمنية.
- source_word: ἄνθρωπον
  choice: الإنسان
  rationale: يحفظ اللفظ الأنثروبولوجي المفرد والصلة المقصودة بعبارة «الإنسان العتيق» في السياق، من غير حصره في الذكر.
- source_word: κατὰ θεὸν
  choice: على مثال الله
  rationale: يعبّر بوضوح عن المطابقة لله أو موافقة مثاله التي تفيدها κατά هنا، مع إثبات الصياغة الأقرب إلى المبنى في الحاشية.
- source_word: κτισθέντα
  choice: المخلوق
  rationale: يحفظ المبني للمجهول ولغة الخلق، ويطابق «الإنسان الجديد» نحويًا.
- source_word: δικαιοσύνῃ
  choice: برّ
  rationale: «البرّ» هو المقابل العربي الكتابي الطبيعي الذي يشمل الاستقامة الأخلاقية؛ ويمكن أن يفيد اللفظ اليوناني العدل بحسب السياق.
- source_word: ὁσιότητι
  choice: قداسة
  rationale: ينقل معنى التقوى والقداسة الموافقة لما هو مقدس لدى الله.
- source_word: τῆς ἀληθείας
  choice: الحق
  rationale: تحافظ إضافة «قداسة الحق» ضمن تركيب «برّ وقداسة الحق» على علاقة المضاف إليه واحتمال تعلقه بالصفتين، بدل حسمها إلى الصفة «حقيقي».
theological_decisions:
- issue: التعبير الأنثروبولوجي في «الإنسان الجديد»
  choice: الإنسان الجديد
  alternative: الذات الجديدة / الشخص الجديد
  rationale: اللفظ اليوناني ἄνθρωπος هنا مفرد وموازٍ للإنسان العتيق في السياق؛ واختيار «الإنسان» يحفظ الصورة والربط المعجمي من دون تفسيرها على أنها «الذات» فقط.
- issue: دلالة κατὰ θεὸν
  choice: على مثال الله
  alternative: بحسب الله
  rationale: الصياغة المختارة أوضح في العربية وتفيد التوافق مع الله بوصفه المثال، مع إبقاء البديل الحرفي في الحاشية لأن العبارة اليونانية موجزة وتحتمل هذا العرض.
- issue: علاقة τῆς ἀληθείας بالبر والقداسة
  choice: في برّ وقداسة الحق
  alternative: في البر والقداسة الحقيقيين
  rationale: تحفظ الصياغة الإضافية توتر النص واحتمال أن يصف «الحق» البر والقداسة كليهما أو يبين مصدرهما، بدل حسم الإضافة إلى معنى نوعي واحد.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية معاصرة كريمة. استُعمل «تلبسوا» للمحافظة على استعارة الثوب، و«الإنسان الجديد» للموازاة السياقية، وتُرك تركيب «الحق» قريبًا من الأصل حفاظًا على الغموض النحوي والدلالي الحقيقي.
