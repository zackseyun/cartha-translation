  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: ar
  text: لا تخرج من أفواهكم أي كلمة فاسدة[a]، بل لتكن كلمة صالحة للبنيان بحسب الحاجة[b]، لكي تمنح نعمةً للسامعين[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أي كلمة متعفنة»؛ ويمكن أيضًا: «أي كلام فاسد» أو «كلمة رديئة».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «للبنيان كما تقتضي الحاجة» أو «للبنيان الملائم للحاجة».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «لكي تعود بالنفع على السامعين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: أي كلمة فاسدة
  rationale: مع النهي يفيد التركيب معنى «لا كلمة فاسدة قط». و«فاسدة» تحافظ بقدر معقول على صورة σαπρός، أي المتعفن أو الفاسد، وتؤدي معناها المجازي في الكلام الضار، مع بيان الحرفية في الحاشية.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: لا تخرج من أفواهكم
  rationale: صياغة عربية طبيعية تحفظ صورة خروج الكلام من الفم، وتراعي أن الضمير اليوناني جمع؛ فجاء «أفواهكم» أوضح في العربية.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: بل ما كان صالحًا
  rationale: يكمل المحذوف، أي الكلام أو القول، بصياغة عربية موجزة، ويحفظ المقابلة بين الكلام الفاسد والكلام الصالح دون إضافة «فقط» غير المصرح بها لفظًا.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: للبنيان بحسب الحاجة
  rationale: «البنيان» يحفظ استعارة البناء في οἰκοδομή، و«بحسب الحاجة» يبقي العلاقة الموجزة والملتبسة نسبيًا بين البناء والحاجة بدل حسمها إلى «مناسب للمناسبة».
- source_word: ἵνα δῷ χάριν
  choice: لكي يمنح نعمةً
  rationale: «نعمة» تحافظ على سعة χάρις ورنينها البولسي، مع إمكان دلالتها هنا على الخير أو النفع الذي يصل إلى السامعين؛ وتوضح الحاشية البديل السياقي.
- source_word: τοῖς ἀκούουσιν
  choice: للسامعين
  rationale: ترجمة موجزة وطبيعية لاسم الفاعل الحاضر، وتشمل من يصغون إلى الكلام.
theological_decisions:
- issue: دلالة χάριν في سياق الوصية الأخلاقية
  choice: نعمة
  alternative: نفعًا أو خيرًا
  rationale: يحفظ اختيار «نعمة» اللفظ البولسي واتساعه الدلالي، من غير قصره على المنفعة العملية ولا تحميله هنا معنى عقائديًا تقنيًا لا يفرضه السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارتا الفساد والبنيان، وحُفظت سعة «نعمة» مع توضيح البديل السياقي في الحاشية. جميع علامات الحواشي مثبتة في المتن.
