  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: ar
  text: مَن يسرق فلا يسرق بعد الآن، بل ليكدّ، عاملًا بيديه ما هو صالح[a]، لكي يكون لديه ما يشارك به مَن هو محتاج[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عاملًا بيديه في عملٍ صالح» أو «عاملًا بيديه ما هو نافع».'
    reason: تحتمل العبارة اليونانية معنى فعل ما هو صالح، أو العمل في ما هو نافع، في سياق العمل الشخصي الشريف.
  - marker: b
    text: 'أو: «مَن هو في حاجة».'
    reason: صياغة عربية بديلة للعبارة اليونانية التي تصف الشخص بأنه ذو حاجة.
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: مَن يسرق
  rationale: اسم فاعل مع أداة تعريف استُعمل استعمال الاسم، فيشير إلى الشخص الذي يمارس السرقة من غير أن يحوّله إلى لقب ثابت مثل «السارق».
- source_word: μηκέτι κλεπτέτω
  choice: فلا يسرق بعد الآن
  rationale: ينقل النهي بصيغة الأمر ويدل بوضوح على التوقف عن ممارسة سابقة.
- source_word: μᾶλλον δὲ κοπιάτω
  choice: بل ليكدّ في العمل
  rationale: «بل» تحفظ المقابلة التصحيحية، و«ليكدّ» تنقل معنى العمل ببذل جهد، لا مجرد أداء عمل عادي.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: صانعًا بيديه ما هو صالح
  rationale: تحفظ العبارة معنى العمل الشخصي الشريف والمنتج في مقابل السرقة، مع إبقاء «ما هو صالح» واسع الدلالة بدل حصره في نوع محدد من العمل.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: لكي يكون لديه ما يشارك به
  rationale: تنقل جملة الغرض، وتفهم وجود مورد أو شيء قابل للمشاركة من سياق المصدر اليوناني.
- source_word: τῷ χρείαν ἔχοντι
  choice: مَن هو محتاج
  rationale: ينقل الوصف الاشتقاقي للشخص الذي له حاجة بعبارة عربية واضحة وطبيعية.
theological_decisions:
- issue: الغاية الأخلاقية من العمل
  choice: يُعرض العمل الشريف بديلًا للسرقة ووسيلةً لمشاركة المحتاج.
  alternative: أن يكون التشديد الأساسي على الاكتفاء الذاتي أو ردّ المسروق.
  rationale: جملة الغرض الصريحة تجعل المشاركة مع المحتاج الغاية المذكورة للعمل، من غير إنكار ما قد يفهم ضمنًا من إعالة النفس، ومن غير إدخال أمر بردّ المسروق لا تصرّح به الآية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كريمة. استُعمل «ليكدّ» لإبراز الجهد الكامن في κοπιάω، وحُفظت سعة دلالة τὸ ἀγαθόν في المتن، مع بدائل تفسيرية في الحاشية.
