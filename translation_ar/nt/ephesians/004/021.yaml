translation:
  language: ar
  text: إن كنتم حقًّا قد سمعتموه وعُلِّمتم فيه[a]، كما أن الحق في يسوع[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سمعتم عنه». واليونانية تقول حرفيًّا: «سمعتموه»، ولعلها تشير إلى أن السامعين، في الكرازة الرسولية، سمعوا المسيح نفسه حقًّا.'
    reason: alternative_reading
  - marker: b
    text: قد تدل عبارتا «فيه» و«في يسوع» على المجال أو الاتحاد أو الارتباط الوثيق؛ وتترك اليونانية المعنى أوسع من مجرد «به».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: إن كنتم حقًّا
  rationale: تحافظ «إن» على صيغة الشرط، وتنقل «حقًّا» قوة γε التوكيدية الخفيفة من غير تحويل العبارة إلى تعليل جازم بمعنى «بما أنكم».
- source_word: αὐτὸν ἠκούσατε
  choice: قد سمعتموه
  rationale: الضمير مفعول به مباشر في اليونانية، لذلك تُحفظ الصياغة اللافتة «سمعتموه» بدل تفسيرها في المتن على أنها «سمعتم عنه».
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: تنقل العبارة حرف الجر ἐν من غير حصره في معنى الوساطة «على يده»، وتبقي احتمال الدلالة على المجال أو الاتحاد أو الارتباط الوثيق.
- source_word: ἐδιδάχθητε
  choice: تعلَّمتم
  rationale: الفعل اليوناني مبني للمجهول بمعنى «عُلِّمتم»، لكن «تعلَّمتم فيه» أفصح وأطبع في العربية من «عُلِّمتم فيه»، مع بقاء معنى تلقي التعليم واضحًا.
- source_word: καθώς
  choice: كما أن
  rationale: تحفظ أداة المقارنة والصلة بين ما تلقاه المخاطبون وبين كون الحق في يسوع.
- source_word: ἀλήθεια
  choice: الحقَّ
  rationale: «الحق» هو المقابل العربي الطبيعي الموقر لـἀλήθεια في هذا السياق، ودخول أداة التعريف ملائم للاستعمال العربي ولا يلزم منه حسم دلالة الأداة الغائبة في اليونانية.
- source_word: ἐν τῷ Ἰησοῦ
  choice: في يسوع
  rationale: تحافظ على الاسم الشخصي «يسوع» وعلى حرف الجر «في»، فتترك اتساع الدلالة بين المجال والاتحاد والارتباط أو التجسد الشخصي للحق.
theological_decisions:
- issue: هل تعني αὐτὸν ἠκούσατε أنهم سمعوا المسيح نفسه أم سمعوا عنه؟
  choice: سمعتموه
  alternative: سمعتم عنه
  rationale: تركيب المفعول المباشر يرجح النقل الأقرب «سمعتموه»، ويحفظ فورية حضور المسيح في الكرازة الرسولية من غير تحويل هذا الإيحاء إلى تقرير تفسيري صريح؛ ويُذكر البديل في الحاشية.
- issue: كيفية نقل عبارتي ἐν αὐτῷ وἐν τῷ Ἰησοῦ
  choice: فيه / في يسوع
  alternative: على يده / في اتحاد بيسوع
  rationale: تكرار «في» يحفظ الاتساع والتوتر اللاهوتي في التعبير البولسي، فلا يحصره في الوكالة ولا يفسره صراحةً بالاتحاد.
- issue: العلاقة التي تفيدها καθώς في الجملة الأخيرة
  choice: كما أن الحق كائن في يسوع
  alternative: وفقًا للحق الذي في يسوع
  rationale: الصياغة المختارة تحافظ على البنية المقارِنة وعلى العبارة اليونانية غير المألوفة، بدل تحويلها إلى وصف مباشر لمحتوى التعليم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «كائن» لإبقاء معنى الوجود في ἐστιν ظاهرًا، مع الحفاظ على الصياغة المكثفة وغير المعتادة في الأصل. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
