id: EPH.4.13
reference: Ephesians 4:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: ar
  text: إلى أن نبلغ جميعًا وحدة الإيمان[a] ومعرفة ابن الله[b]، إلى رجل ناضج[c]، إلى مقدار قامة[d] ملء المسيح[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تشير العبارة إلى الإيمان المشترك الذي تعتنقه الجماعة، أو إلى إيمان المؤمنين عمومًا.
    reason: alternative_reading
  - marker: b
    text: أو «المعرفة التامة» أو «المعرفة العميقة».
    reason: lexical_alternative
  - marker: c
    text: أو «إلى الرجولة الناضجة». يقول اليوناني حرفيًا «إلى رجل ناضج»، في صورة مفردة مذكرة تعبّر عن نضج الكنيسة كلها بوصفها جماعة واحدة.
    reason: lexical_alternative
  - marker: d
    text: أو «نضج». ويمكن أن تدل الكلمة اليونانية على القامة أو على بلوغ سن النضج.
    reason: lexical_alternative
  - marker: e
    text: اللفظ اليوناني Χριστός لقب معناه «المسيح»، أي «الممسوح».
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: إلى أن
  rationale: تدل على الغاية التي تستمر إليها عملية البناء المذكورة في السياق السابق، وهي صياغة عربية طبيعية ودقيقة.
- source_word: καταντήσωμεν
  choice: نبلغ
  rationale: تنقل معنى الوصول إلى غاية مقصودة، لا مجرد الانتقال المكاني.
- source_word: οἱ πάντες
  choice: جميعًا
  rationale: تحفظ شمول جماعة المؤمنين كلها، مع دلالة ضمير المتكلمين في «نبلغ».
- source_word: εἰς τὴν ἑνότητα
  choice: وحدة
  rationale: تحفظ معنى بلوغ الوحدة بوصفها غاية، من غير إثقال العربية بتكرار حرف الجر حيث لا يلزم.
- source_word: τῆς πίστεως
  choice: الإيمان
  rationale: يحفظ اللفظ اللاهوتي الأساسي، ويمكن أن يدل في السياق على الإيمان المشترك أو على إيمان المؤمنين عمومًا؛ وقد نُبّه إلى ذلك في الحاشية.
- source_word: ἐπιγνώσεως
  choice: معرفة
  rationale: ترجمة واضحة لا تفرض وحدها معنى «المعرفة الكاملة»، مع حفظ هذا الاحتمال في الحاشية.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: ابن الله
  rationale: نقل مباشر للتركيب الذي يحدد موضوع المعرفة ويحفظ اللقب المسيحاني كما هو.
- source_word: εἰς ἄνδρα τέλειον
  choice: إلى رجل ناضج
  rationale: تحفظ صورة المفرد المذكر في اليونانية، وتترجم τέλειος هنا بالنضج الملائم لسياق النمو، لا بالكمال المطلق.
- source_word: μέτρον
  choice: مقدار
  rationale: يحفظ استعارة القياس ويأتي طبيعيًا مع «قامة» في العربية.
- source_word: ἡλικίας
  choice: قامة
  rationale: تحفظ صورة النمو الجسدي؛ وقد تعني أيضًا النضج في هذا السياق.
- source_word: τοῦ πληρώματος
  choice: ملء
  rationale: يبقي اللفظ البولسي المكثف وما يحمله من سعة دلالية، بدل تسطيحه إلى شرح تفسيري.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: الترجمة العربية المعيارية للقب Χριστός، وتحفظ دلالته اللقبية بوصفه الممسوح.
theological_decisions:
- issue: دلالة τῆς πίστεως
  choice: الإيمان، مع ترجيح معنى الإيمان المشترك الذي تتحد فيه الجماعة
  alternative: إيمان المؤمنين أو ثقتهم عمومًا
  rationale: أداة التعريف والسياق الجماعي يرجحان المعنى المشترك، لكن النص العربي والحاشية يحفظان إمكان الوجه الآخر.
- issue: الصورة الجماعية في εἰς ἄνδρα τέλειον
  choice: إلى رجل ناضج
  alternative: إلى النضج الكامل أو إلى الرجولة الناضجة
  rationale: اليونانية تستعمل مفردًا مذكرًا ممثلًا للجماعة كلها؛ لذلك حُفظت الصورة بدل تحويلها صامتًا إلى تعبير مجرد.
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني، ويجمع بين الرسوخ الاصطلاحي ودلالة اللقب.
- issue: العلاقة في عبارة μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ
  choice: مقدار قامة ملء المسيح
  alternative: مقدار النضج الذي يخص ملء المسيح
  rationale: حُفظ تتابع المضافات وصور القياس والقامة والملء، لأن العبارة تحتمل أكثر من تحديد دقيق للعلاقات بينها ولا ينبغي حسمها بتفسير زائد.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي في عبارات الغاية المتتابعة، مع تجنب الحرفية الثقيلة. استُعمل «رجل ناضج» عمدًا للحفاظ على الصورة اليونانية الجماعية، ووُضحت في الحاشية.
