id: EPH.4.9
reference: Ephesians 4:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: ar
  text: أما عبارة «صَعِدَ»، فما معناها إلا أنه نزل أيضًا إلى الأجزاء السفلى من الأرض؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى المناطق السفلى، أي إلى الأرض». وقد تشير العبارة إلى نزوله إلى الأرض فحسب، أو على نحو أخص إلى عالم الأموات.'
    reason: يحفظ البديل النحوي والتفسيري لعبارة «الأجزاء السفلى من الأرض» من غير ترجيح عقائدي قاطع.
lexical_decisions:
- source_word: Ἀνέβη
  choice: صَعِدَ
  rationale: يحافظ على صورة الحركة إلى أعلى، وعلى الصلة اللفظية بالاقتباس السابق والتقابل مع «نزل».
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: فما معناها إلا أنه
  rationale: صياغة عربية طبيعية تنقل الاستدلال الذي ينطلق من لفظة «صعد»، من غير التزام ببنية يونانية جامدة.
- source_word: καὶ κατέβη
  choice: نزل أيضًا
  rationale: تُبقي «أيضًا» القوة الإضافية للأداة καί، وتحفظ التقابل بين الصعود والنزول.
- source_word: εἰς
  choice: إلى
  rationale: العربية تستعمل «إلى» طبيعيًا مع فعل «نزل» للدلالة على غاية الحركة؛ أما «في» فقد تضعف الاتجاه، و«داخل» قد تزيد تحديدًا مكانيًا غير لازم.
- source_word: τὰ κατώτερα μέρη
  choice: الأجزاء السفلى
  rationale: ترجمة شفافة تحفظ معنى المقارنة في κατώτερα ودلالة μέρη، من غير أن تحسم المقصود بأنه عالم الأموات أو الأرض وحدها.
- source_word: τῆς γῆς
  choice: من الأرض
  rationale: 'تحفظ تركيب الإضافة اليوناني واحتماله: أهي أجزاء سفلى تابعة للأرض، أم المناطق السفلى أي الأرض نفسها.'
theological_decisions:
- issue: دلالة εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: إلى الأجزاء السفلى من الأرض
  alternative: إلى المناطق السفلى، أي إلى الأرض؛ أو إلى عالم الأموات
  rationale: التركيب اليوناني يحتمل أن يشير إلى النزول من السماء إلى الأرض، أو على نحو أخص إلى أعماق الأرض أو عالم الأموات. أبقى المتن هذا التوتر التفسيري ولم يحسمه مذهبيًا، وبيّنت الحاشية أبرز الاحتمالات.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «أما عبارة» لإبراز أن السؤال يتناول لفظة «صعد» نفسها، مع تجنب إضافة ظرف زمني لا يقابله لفظ صريح في الأصل.
