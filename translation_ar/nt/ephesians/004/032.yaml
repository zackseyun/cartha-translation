  to: وكونوا لطفاء بعضكم نحو بعض، ذوي قلوب رقيقة، مسامحين بعضكم بعضًا، كما أن الله غفر لكم أيضًا في المسيح.
  rationale: 'التعديل لازم لتصحيح الإعراب في الوصف الثاني وتحسين سلاسة العبارة العربية. ويحفظ النص المنقح ترتيب المعاني الرئيسة في اليونانية: الأمر، واللطف المتبادل، والشفقة، والغفران المتبادل، ثم نموذج غفران الله في المسيح. ولا توجد في النص اليوناني المعطى مسألة نصية تستلزم حاشية.'
