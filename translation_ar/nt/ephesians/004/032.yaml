base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: ar
  text: وكونوا لطفاء بعضكم نحو بعض، ذوي قلوب رقيقة، مسامحين بعضكم بعضًا، كما أن الله غفر لكم أيضًا في المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνεσθε
  choice: كونوا
  rationale: صيغة أمر حاضرة للجمع تدعو إلى اتصاف مستمر؛ و«كونوا» هي الصياغة العربية الطبيعية المباشرة.
- source_word: εἰς ἀλλήλους
  choice: بعضكم نحو بعض
  rationale: تحفظ معنى الاتجاه العلائقي والتبادل بين المخاطَبين.
- source_word: χρηστοί
  choice: لطفاء
  rationale: تلائم السياق الأخلاقي والعلاقات بين الناس، وتحفظ معنى الإحسان والرفق.
- source_word: εὔσπλαγχνοι
  choice: رقيقي القلوب
  rationale: تنقل البعد الوجداني للكلمة، أي الرحمة النابعة من القلب، مع تمييزها عن «لطفاء».
- source_word: χαριζόμενοι
  choice: غافرين
  rationale: يدل السياق، ولا سيما المقارنة بفعل الله، على الصفح عن الإساءة؛ وتحافظ صيغة اسم الفاعل على صلته بالأمر السابق.
- source_word: ἑαυτοῖς
  choice: بعضكم لبعض
  rationale: الضمير الانعكاسي في هذا السياق الجمعي يؤدي معنى التبادل.
- source_word: καθὼς καὶ
  choice: كما أن ... أيضًا
  rationale: تحفظ أداة المقارنة والقوة الإضافية لـκαί من غير إثقال العبارة.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: تحفظ حرف الجر ἐν وتترجم Χριστός بوصفه لقبًا إلى المقابل العربي المألوف «المسيح».
- source_word: ἐχαρίσατο
  choice: غفر
  rationale: المعنى السياقي هو الغفران والصفح، وهو أوضح مقابل عربي هنا.
- source_word: ὑμῖν
  choice: لكم
  rationale: يحفظ صيغة الجمع ووظيفة المفعول غير المباشر في اليونانية.
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: بالمسيح / من خلال المسيح
  rationale: أُبقيت دلالة ἐν الأوسع من غير حصرها في معنى الوسيلة؛ فالعبارة اليونانية قد تحمل معنى المجال أو الاتحاد أو الواسطة بحسب فهم السياق.
- issue: موضع καί في καθὼς καὶ ὁ θεὸς
  choice: كما أن الله أيضًا غفر لكم
  alternative: مثلما غفر الله لكم
  rationale: أُثبت معنى καί بـ«أيضًا» لإظهار المقابلة بين غفران المؤمنين وغفران الله، مع تجنب تفسير زائد لطبيعة التوكيد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «رقيقي القلوب» بدل تعبير تشريحي حرفي، و«غافرين» للمحافظة على البنية الوصفية المتصلة بالأمر. لا حاجة إلى حواشٍ لأن النص المقدم لا يحدد قراءات بديلة قابلة للنشر، والحاشيتان الإنجليزيتان المرفقتان لا تتوافق علامتاهما مع موضعيهما في النص.
