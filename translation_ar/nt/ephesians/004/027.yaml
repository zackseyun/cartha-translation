lexical_decisions:
- source_word: μηδὲ
  choice: ولا
  rationale: تربط الوصية بما قبلها وتواصل سلسلة النواهي بصياغة عربية طبيعية وموجزة.
- source_word: δίδοτε
  choice: تعطوا
  rationale: ينقل المعنى المباشر للفعل δίδωμι، ويحافظ على صورة العبارة الأصلية «تعطوا ... مكانًا».
- source_word: τόπον
  choice: مكانًا
  rationale: هو المعنى الحرفي للكلمة، وتفيد العبارة في السياق إتاحة مجال لإبليس كي يعمل. أُبقيت الصورة الأصلية بدل استبدالها بتفسير مثل «فرصة».
- source_word: τῷ διαβόλῳ
  choice: إبليس
  rationale: يشير الاسم المعرّف هنا إلى الكائن الشرير الشخصي، و«إبليس» تسمية عربية مألوفة وواضحة في هذا السياق.
theological_decisions:
- issue: هل يدل διάβολος على كائن الشر الشخصي أم على واشٍ بشري؟
  choice: إبليس
  alternative: الواشي
  rationale: ورود الاسم مع أداة التعريف وفي سياق الوصايا البولسية يرجّح الإشارة إلى الخصم الشرير الشخصي، من غير إضافة تفسير يتجاوز النص.
- issue: هل يُفسَّر τόπον صراحةً بأنه «فرصة» أم تُحفظ صورة «المكان»؟
  choice: مكانًا
  alternative: فرصةً
  rationale: تحافظ «مكانًا» على الاستعارة والقدر المتاح من التوتر الدلالي في الأصل، بينما تبيّن الحاشية أن المقصود قد يكون المجال أو الفرصة للعمل.
