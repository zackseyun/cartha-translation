lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: مُظْلَمُو
  rationale: اسم مفعول يدل على حالة ناتجة مستمرة، ويحفظ المعنى المبني للمجهول من غير إثقال العبارة العربية.
- source_word: τῇ διανοίᾳ
  choice: الفهم
  rationale: يدل اللفظ على الذهن أو الإدراك؛ و«الفهم» واضح هنا ويلائم دلالة جهة اتصافهم بالظلمة.
- source_word: ὄντες
  choice: مُضمَّن في التركيب الاسمي «مُظْلَمُو الفهم»
  rationale: الجملة الاسمية العربية تؤدي معنى الحالة الذي يحمله اسم الفاعل اليوناني من غير حاجة إلى ترجمة حرفية مستقلة.
- source_word: ἀπηλλοτριωμένοι
  choice: مغتربون
  rationale: يحفظ معنى الانفصال والاغتراب العلائقي في حالة قائمة، من غير قصره على الاستبعاد القانوني.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: عن حياة الله
  rationale: 'يحافظ التركيب على غموض الإضافة: أهي الحياة الخاصة بالله أم الحياة الآتية منه.'
- source_word: διὰ τὴν ἄγνοιαν
  choice: بسبب الجهل
  rationale: تفيد διά مع النصب السببية، و«بسبب» تعبير عربي مباشر وواضح.
- source_word: τὴν οὖσαν ἐν αὐτοῖς
  choice: الذي فيهم
  rationale: ينقل العبارة الوصفية ببساطة، ويحدد أن الجهل كائن في داخلهم.
- source_word: διὰ τὴν πώρωσιν
  choice: وبسبب قساوة
  rationale: «القساوة» تحفظ استعارة التصلب مع بقاء العبارة مفهومة، وتكرار «بسبب» يعكس تكرار العبارة السببية اليونانية.
- source_word: τῆς καρδίας αὐτῶν
  choice: قلوبهم
  rationale: مع أن اليونانية تستعمل «القلب» مفردًا مع ضمير جمع، فصيغة الجمع هي الأفصح والأطبع في العربية عند الإحالة إلى أفراد متعددين، من غير تغيير في المعنى.
theological_decisions:
- issue: دلالة «حياة الله»
  choice: 'الإبقاء على الإضافة: «حياة الله»'
  alternative: «الحياة الآتية من الله» أو «حياة الله الخاصة»
  rationale: الإضافة اليونانية تحتمل الحياة التي لله والحياة التي مصدرها الله؛ فلا ينبغي حسم هذا الاحتمال في صلب الترجمة.
- issue: إفراد «القلب» في اليونانية مع مرجع جمع
  choice: صيغة الجمع العربية «قلوبهم»
  alternative: «قلبهم»
  rationale: الإفراد في اليونانية استعمال جمعي أو تمثيلي، أما الجمع فأوضح وأطبع في العربية ولا يضيف تمييزًا لاهوتيًا غير موجود.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. استُعمل التركيب الاسمي للحفاظ على وصف الحالة، مع تجنب الترجمة الحرفية المتكلفة، وأُبقي غموض «حياة الله» بلا حسم تفسيري.
