lexical_decisions:
- source_word: εἷς
  choice: واحد
  rationale: 'يحفظ العدد التوكيدي الذي يواصل سلسلة الوحدة في السياق: جسد واحد، وروح واحد، ورب واحد.'
- source_word: θεὸς
  choice: إله
  rationale: المقابل العربي المعياري لـ θεός، وجاء نكرةً لفظًا في تركيب خبري عربي طبيعي، مع دلالته الواضحة على الله الواحد في السياق.
- source_word: πατὴρ
  choice: أب
  rationale: يحفظ اللقب الشخصي والعلاقي المقترن بـ«إله»، من غير تحويله إلى معنى مجرد.
- source_word: πάντων
  choice: الجميع
  rationale: يحفظ اتساع اللفظة اليونانية التي لم يُذكر معها اسم يحدد أناسًا أو أشياء، كما يحافظ على تكرارها البلاغي.
- source_word: ὁ
  choice: وهو
  rationale: ينقل أداة التعريف التي تستهل وصفًا إضافيًا لله بصياغة عربية سلسة وواضحة.
- source_word: ἐπὶ πάντων
  choice: فوق الجميع
  rationale: ينقل معنى العلو والسيادة الذي تؤديه ἐπί مع المضاف إليه، ويحفظ إيجاز الأصل.
- source_word: διὰ πάντων
  choice: يعمل من خلال الجميع
  rationale: تدل διά مع المضاف إليه على الوساطة أو الأداة. أُضيف «يعمل» لإكمال المعنى طبيعيًا بالعربية وتوضيح النشاط الإلهي المفهوم من التركيب، من غير تحديد نوع هذا العمل.
- source_word: ἐν πᾶσιν
  choice: في الجميع
  rationale: هو المقابل المباشر للتركيب، ويحفظ عمدًا عدم تحديد ما إذا كان المقصود جميع الناس أو المؤمنين أو الأشياء.
theological_decisions:
- issue: نطاق πάντων / πᾶσιν المتكررة
  choice: الجميع من غير تعيين اسم محذوف في المتن
  alternative: كل الناس، أو كل المؤمنين، أو كل الأشياء
  rationale: السياق المباشر يتناول وحدة الكنيسة، لكن الصيغ اليونانية واسعة ولا يرد معها اسم صريح يضيّق نطاقها؛ لذلك تُحفظ هذه السعة والتوتر الدلالي بدل حسمهما.
- issue: القراءة النصية في العبارة الأخيرة
  choice: 'في الجميع، وفق نص SBLGNT: ἐν πᾶσιν'
  alternative: فيكم جميعًا، بحسب قراءة ἐν ὑμῖν πᾶσιν في بعض المخطوطات
  rationale: يتبع المتن النص النقدي المحدد في الطلب، وتُذكر القراءة البديلة في الحاشية لأنها تضيق النطاق إلى المخاطَبين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التوازي في تكرار «الجميع»، مع تجنب تقييد مدلوله في المتن. استُعملت «يعمل من خلال» في العبارة الوسطى لتفادي تركيب عربي مبتور، مع إبقاء طبيعة العمل غير محددة.
