base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: ar
  text: جسد واحد وروح واحد[a]، كما دُعيتم أنتم أيضًا في رجاء واحد لدعوتكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «روح» بمعنى روح أو نزعة روحية مشتركة. يمكن للكلمة اليونانية أن تشير إلى الروح أو إلى الروح القدس؛ والأرجح هنا أنها تشير إلى الروح القدس في سياق عبارات الوحدة في هذا المقطع.'
    reason: بديل معجمي وتفسيري
lexical_decisions:
- source_word: ἓν
  choice: واحد
  rationale: حُفظ تكرار العدد لإبراز وحدة الجسد والروح والرجاء.
- source_word: σῶμα
  choice: جسد
  rationale: ينقل الاستعارة كما هي من غير أن يضيف تفسيرًا صريحًا بأنها جماعة المؤمنين.
- source_word: πνεῦμα
  choice: روح
  rationale: اللفظ العربي يحفظ الدلالة الأساسية، مع بيان احتمال الإشارة إلى الروح القدس في الحاشية لأن اليونانية لا تميّز ذلك بحروف كبيرة.
- source_word: καθὼς καὶ
  choice: كما ... أيضًا
  rationale: ينقل المقارنة ويحفظ دلالة καί، مع وضع «أيضًا» في موضع عربي طبيعي.
- source_word: ἐκλήθητε
  choice: دُعيتم
  rationale: يحفظ صيغة المبني للمجهول من غير التصريح بفاعل لم يذكره النص.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: في رجاء ... الواحد
  rationale: يحفظ حرف الجر ἐν ومعنى الوحدة، مع ترتيب عربي طبيعي داخل العبارة المضافة.
- source_word: τῆς κλήσεως ὑμῶν
  choice: دعوتكم
  rationale: يحفظ علاقة الإضافة والصلة اللفظية بين «دُعيتم» و«دعوتكم».
theological_decisions:
- issue: مرجع πνεῦμα
  choice: روح، مع ترجيح الإشارة إلى الروح القدس في الحاشية
  alternative: روح مشتركة أو نزعة روحية واحدة بين المؤمنين
  rationale: سياق صيغة الوحدة في أفسس 4:4–6، حيث يَرِد «رب واحد» و«إله وآب واحد»، يرجّح أن المقصود هو الروح القدس، لكن صياغة الأصل نفسها لا تحسم ذلك بعلامة كتابية، لذلك حُفظ الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. أُضيفت «هناك» لإقامة جملة عربية مستقلة مفهومة، وحُفظ التوازي بين «دُعيتم» و«دعوتكم».
