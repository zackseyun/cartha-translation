  text: لِتُنزَعْ من بينكم كل مرارة وسخط وغضب وصياح وكلام مسيء[a]، مع كل خبث.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «افتراء»؛ وتقليديًا «تجديف». يُرجَّح في هذا السياق أن الكلمة اليونانية تشير إلى كلام مؤذٍ موجَّه إلى الآخرين.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: كل
  rationale: تنقل معنى الشمول في قائمة الرذائل بصياغة عربية موجزة وطبيعية.
- source_word: πικρία
  choice: مرارة
  rationale: المقابل العربي المباشر الذي يدل هنا على مرارة النفس وما يصاحبها من ضغينة.
- source_word: θυμός
  choice: سخط
  rationale: يحافظ على التمييز عن ὀργή، ويمكن أن يدل على الانفعال الحاد المتأجج.
- source_word: ὀργή
  choice: غضب
  rationale: لفظ عربي واضح وشائع، ويتميّز طبيعيًا عن «سخط» السابق.
- source_word: κραυγή
  choice: صياح
  rationale: ينقل معنى رفع الصوت في الخصام بصورة واضحة، من غير اللفظ التقليدي الغامض.
- source_word: βλασφημία
  choice: افتراء
  rationale: في هذا السياق الأخلاقي المتعلق بالعلاقات بين الناس، يرجّح أن يدل على كلام مؤذٍ يمس الآخرين؛ وتُذكر البدائل في الحاشية لأن اللفظ اليوناني أوسع.
- source_word: ἀρθήτω
  choice: لِتُنزَعْ
  rationale: تحافظ الصيغة على الأمر المبني للمجهول وعلى معنى الإزالة.
- source_word: ἀφ’ ὑμῶν
  choice: من بينكم
  rationale: تعبير عربي طبيعي يبرز إزالة هذه الرذائل من حياة الجماعة وسلوك أفرادها.
- source_word: σὺν πάσῃ κακίᾳ
  choice: مع كل خبث
  rationale: يحفظ معنى المصاحبة والشمول، ويعبّر «خبث» عن النزعة الشريرة والإرادة المؤذية في هذا السياق.
theological_decisions:
- issue: دلالة βλασφημία في قائمة رذائل أخلاقية
  choice: افتراء موجَّه إلى الآخرين
  alternative: كلام مسيء؛ تجديف موجَّه إلى الله
  rationale: السياق المباشر يتناول مواقف وأقوالًا تهدم العلاقات البشرية، لذلك يلائم «افتراء» السياق، مع إبقاء الاتساع الدلالي للفظ اليوناني ظاهرًا في الحاشية بدل حسمه ضمنيًا.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «سخط» و«غضب» للمحافظة على التمييز بين اللفظين اليونانيين المتجاورين، ووُضعت علامة الحاشية في المتن بعد «افتراء» مباشرة.
