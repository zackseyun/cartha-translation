lexical_decisions:
- source_word: ἀποθέσθαι
  choice: أن تخلعوا
  rationale: يحفظ صورة خلع الثوب التي تقابل لبس الإنسان الجديد في الآية 24، ويُبقي صيغة المصدر مرتبطة بسياق التعليم السابق دون تحويلها صراحة إلى أمر مستقل.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: من جهة سيرتكم السابقة
  rationale: تفيد العبارة مجال الإحالة إلى نمط السلوك السابق؛ و«السيرة» عربية فصيحة واضحة تدل على طريقة العيش والتصرف.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: الإنسان العتيق
  rationale: يحفظ لفظ ἄνθρωπος وصورته التمثيلية، ولا يقصر المعنى على الذكور. واختيار «العتيق» ينسجم مع التعبير البولسي المألوف ويقابله «الجديد» في السياق.
- source_word: τὸν φθειρόμενον
  choice: الذي يفسد
  rationale: ينقل اسم الفاعل المضارع المبني للمجهول بوصفه عملية مستمرة من التدهور والفساد، مع صياغة عربية طبيعية.
- source_word: κατὰ τὰς ἐπιθυμίας
  choice: وفقًا لشهوات
  rationale: يحفظ دلالة κατά على المعيار أو التأثير المتحكم. و«شهوات» هنا تشمل الرغبات القوية الفاسدة ولا تنحصر في المعنى الجنسي.
- source_word: τῆς ἀπάτης
  choice: الخداع
  rationale: 'يحفظ تركيب الإضافة اليوناني حرفيًا نسبيًا، بما يترك العلاقة الدلالية مفتوحة: شهوات تتسم بالخداع أو يصوغها الخداع.'
theological_decisions:
- issue: دلالة τὸν παλαιὸν ἄνθρωπον
  choice: الإنسان العتيق
  alternative: الذات العتيقة
  rationale: العبارة أنثروبولوجية تمثيلية وليست مقصورة على الرجال. إبقاء «الإنسان» يحفظ اللفظ اليوناني وما قد يحمله من صدى جماعي أو آدمي، بدل اختزاله إلى مفهوم «الذات».
- issue: قوة المصدر ἀποθέσθαι في السياق
  choice: أن تخلعوا
  alternative: اخلعوا
  rationale: يتعلق المصدر بمضمون التعليم الوارد في السياق السابق. صيغة «أن تخلعوا» تحفظ هذا الارتباط ولا تحسم التوتر بين كونه مضمون تعليم أو حثًا مباشرًا أو وصفًا لحدث سابق.
- issue: قوة φθειρόμενον الزمنية والصوت النحوي
  choice: الذي يفسد
  alternative: الذي قد فسد
  rationale: المضارع المبني للمجهول يدل على عملية جارية، لا على حالة اكتملت؛ لذلك حُفظ معنى الفساد المستمر دون تحويله إلى حدث ماضٍ منتهٍ.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. حُفظت استعارة خلع الثوب، واستُعملت «السيرة» للدلالة على نمط العيش والسلوك. وُضعت علامتا الحاشيتين [a] و[b] في المتن عند موضعيهما.
