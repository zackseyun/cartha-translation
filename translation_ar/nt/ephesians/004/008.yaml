lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تحفظ أداة الاستنتاج وصل الاقتباس بالحجة السابقة، وهي صياغة عربية واضحة ومباشرة.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ المضارع على صيغة الاستشهاد في اليونانية من غير تعيين فاعل غير مذكور صراحة؛ ويفهم السياق أن الكلام استشهاد كتابي.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: إذ صعد إلى العلاء
  rationale: تنقل اسم الفاعل الدال على فعل سابق مرتبط بالفعلين الرئيسيين، وتحفظ تعبير الصعود إلى الموضع المرتفع وصدى المزمور.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: سبى سبيًا
  rationale: تحفظ العبارة العربية الموجزة الجناس الاشتقاقي والصورة البلاغية في اليونانية، من غير حصر السبي في تفسير واحد.
- source_word: ἔδωκεν δόματα
  choice: أعطى ... عطايا
  rationale: صياغة مباشرة تحفظ فعل الإعطاء والاسم الدال على الهبات، مع استعمال «عطايا» الطبيعي في العربية.
- source_word: τοῖς ἀνθρώποις
  choice: الناس
  rationale: المراد هنا البشر عمومًا، و«الناس» تعبير عربي جامع ودقيق لا يوحي بأن العطايا مقصورة على الذكور.
theological_decisions:
- issue: هوية فاعل «يقول»
  choice: عدم التصريح بالفاعل في المتن
  alternative: لذلك يقول الكتاب
  rationale: النص اليوناني لا يذكر فاعلًا صريحًا؛ وصيغة «يقول» تبقي هذا الإيجاز، وإن كان السياق يدل على الاستشهاد بالكتاب.
- issue: دلالة صورة السبي
  choice: سبى سبيًا
  alternative: قاد أسرى في السبي / أسر جمعًا من الأسرى
  rationale: العبارة الأصلية كثيفة وذات صدى مزموري، وقد تشير إلى السبي بوصفه جماعة من الأسرى أو إلى فعل الأسر نفسه؛ لذلك لا يُحسم التصوير بتفسير واحد في المتن.
- issue: مدلول τοῖς ἀνθρώποις من جهة الجنس
  choice: الناس
  alternative: البشر / الرجال
  rationale: الاسم اليوناني جمع مذكر من جهة الصيغة، لكنه يُستعمل هنا استعمالًا عامًا للبشر، و«الناس» يؤدي هذا المعنى في العربية بلا تضييق غير مسوّغ.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. حوفظ على إيجاز صيغة الاقتباس وعلى الجناس الاشتقاقي في «سبى سبيًا»، مع تجنب إضافة فاعل صريح أو تفسير لاهوتي للصاعدين والأسرى لا يورده النص نفسه.
