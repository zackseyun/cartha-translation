  text: 'بل، ونحن نتكلّم بالحق في المحبة[a]، لننمُ من كل وجه[b] إلى ذاك الذي هو الرأس: المسيح[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لنكن صادقين في المحبة»، أو «لنعمل بالحق في المحبة»؛ فقد يشمل الفعل اليوناني الكلام الصادق والسلوك بحسب الحق.'
    reason: lexical_alternative
