lexical_decisions:
- source_word: ἀληθεύοντες
  choice: لنتكلّم بالحق
  rationale: الفعل اليوناني قد يشمل قول الحق وممارسته. يبرز السياق القريب التعليم المضلِّل والخداع، ولذلك يعبّر المتن عن دلالة الكلام بعبارة عربية طبيعية، مع حفظ الدلالة الأخلاقية الأوسع في الحاشية.
- source_word: δὲ
  choice: بل
  rationale: تفيد الأداة انتقالًا تقابليًا لطيفًا من الضلال والخداع المذكورين قبلًا إلى السلوك المطلوب.
- source_word: ἐν ἀγάπῃ
  choice: في محبة
  rationale: تحفظ العبارة صورة المجال أو الكيفية في الأصل، وتبقى واضحة ومألوفة في العربية الكتابية المعاصرة.
- source_word: αὐξήσωμεν
  choice: لننمُ
  rationale: صيغة المضارع المنصوب للجمع هنا حثّية، فتؤديها لام الأمر في العربية بوضوح وإيجاز.
- source_word: εἰς αὐτὸν
  choice: نحو ذاك
  rationale: تحفظ «نحو» الاتجاه الذي تفيده εἰς من غير أن تفرض تصورًا مكانيًا حرفيًا غير طبيعي في العربية، و«ذاك» يعود إلى الشخص الذي سيُعرَّف بأنه الرأس.
- source_word: τὰ πάντα
  choice: من كل وجه
  rationale: تؤدي الدلالة الشاملة المحتملة في تركيب النمو بصورة عربية طبيعية، مع إثبات الصياغة الأقرب إلى اللفظ في الحاشية.
- source_word: κεφαλή
  choice: الرأس
  rationale: ترجمة مباشرة تحفظ استعارة الجسد ولا تحسمها بتفسير مثل «المصدر» أو «صاحب السلطان».
- source_word: Χριστός
  choice: المسيح
  rationale: اللفظ هنا لقب تعريفي واقع بعد «الرأس»، و«المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός.
theological_decisions:
- issue: المدى الدلالي للفعل ἀληθεύοντες
  choice: لنتكلّم بالحق في المتن
  alternative: لنكن صادقين؛ أو لنعمل بالحق
  rationale: يرجّح السياق المتعلق بالتعليم المضلِّل دلالة قول الحق، لكن الفعل قد يتناول السلوك الصادق عمومًا؛ لذلك لم تُهمل الدلالة الأوسع بل حُفظت في الحاشية.
- issue: القوة التفسيرية لكلمة κεφαλή
  choice: الرأس
  alternative: المصدر؛ أو صاحب السلطان
  rationale: يحفظ المتن الاستعارة كما وردت ولا يختار بين التفسيرات اللاهوتية المتنازع عليها.
- issue: دلالة τὰ πάντα مع فعل النمو
  choice: من كل وجه
  alternative: 'في كل شيء؛ أو حرفيًا: الأشياء كلها'
  rationale: تفهم العبارة غالبًا على أنها شمول النمو من جميع الوجوه، لكن الحاشية تحفظ احتمال الصياغة الأقرب إلى ظاهر اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدمت «بل» لإبراز المقابلة مع السياق السابق، و«لننمُ» لحفظ قوة الحث، مع تجنب إدخال تفسير مذهبي في استعارة «الرأس».
