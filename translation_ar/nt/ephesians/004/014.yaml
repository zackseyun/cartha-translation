lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: لكي لا نعود
  rationale: ينقل غرض الكلام مع معنى الكف عن حال سابقة؛ وهو أسلس عربيًا من الصياغة الحرفية «لكي لا نكون بعد».
- source_word: νήπιοι
  choice: أطفالًا
  rationale: يحفظ صورة عدم النضج من غير أن يحصرها في الرُّضَّع.
- source_word: κλυδωνιζόμενοι
  choice: تتقاذفنا الأمواج
  rationale: يُظهر الصورة البحرية الكامنة في الفعل ويعبّر عن الاضطراب المتكرر.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: وتحملنا كلُّ ريحٍ من رياح التعليم
  rationale: 'يحفظ المبني للمجهول وصورة الريح، ويؤدي διδασκαλία بمعناه العام: التعليم.'
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: بخداع الناس
  rationale: ينقل المعنى الاصطلاحي للكلمة، أي الغش والحيلة، مع توضيح صورتها الأصلية في الحاشية.
- source_word: ἐν πανουργίᾳ
  choice: ومكرهم
  rationale: يعبر عن الدهاء غير الأخلاقي، ويربطه طبيعيًا بالناس المذكورين من غير تغيير الفاعل المفهوم.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: في سبيل تدبير الضلال
  rationale: يحفظ اتجاه πρός نحو غاية، ويفيد μεθοδεία التخطيط المنظم، مع إبقاء πλάνη على اتساعه بين الضلال والتضليل.
theological_decisions:
- issue: دلالة διδασκαλία
  choice: التعليم
  alternative: العقيدة
  rationale: «التعليم» أوسع وأقرب إلى اللفظ اليوناني، ولا يقصر التحذير على الصياغات العقائدية الرسمية.
- issue: دلالة πλάνη
  choice: الضلال
  alternative: الخداع أو التضليل
  rationale: «الضلال» يحتفظ بإمكان دلالة الخطأ والانحراف، بينما يبيّن السياق نفسه عنصر الخداع المقصود.
- issue: علاقة πρός بعبارة μεθοδεία τῆς πλάνης
  choice: في سبيل تدبير الضلال
  alternative: في تدبير الضلال
  rationale: تُبقي الصياغة معنى الاتجاه أو الغاية الممكن في πρός، بدل إذابته تمامًا في معنى الظرفية، مع الاعتراف بضغط العبارة اليونانية واحتمال تفسيرها بأكثر من وجه.
