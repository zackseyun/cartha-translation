  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت الصورتان البحريتان للأمواج والرياح، وتُرك التوتر الدلالي في خاتمة الآية ظاهرًا عبر المتن والحاشية، من غير فرض تفسير مذهبي.
