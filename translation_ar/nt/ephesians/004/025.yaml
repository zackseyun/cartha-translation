  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: ar
  text: لذلك، اطرحوا عنكم الكذب[a]، وليتكلم كل واحد بالصدق مع قريبه، لأننا أعضاء بعضنا لبعض.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الباطل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: أداة استنتاج تربط الوصية بما سبق، و«لذلك» واضحة وتحفظ القوة المنطقية.
- source_word: ἀποθέμενοι
  choice: اطرحوا عنكم
  rationale: اسم فاعل ماضٍ في سياق أمري، يفيد نزع الكذب والتخلي عنه بوصفه أمرًا ملازمًا للوصية الرئيسة؛ وصيغته العربية الأمرية طبيعية وتحفظ قوة الحث.
- source_word: τὸ ψεῦδος
  choice: الكذب
  rationale: يشير المفرد المعرّف هنا على الأرجح إلى الكذب بوصفه سلوكًا أو رذيلة عامة، لا إلى كذبة بعينها. وتحفظ الحاشية احتمال «الباطل».
- source_word: λαλεῖτε ἀλήθειαν
  choice: وليتكلم ... بالصدق
  rationale: يحفظ الأمر المستمر بالتكلم الصادق، و«بالصدق» تعبير عربي طبيعي في مقابلة «الكذب».
- source_word: ἕκαστος
  choice: كل واحد
  rationale: ينقل القوة التوزيعية للمفرد داخل الخطاب الموجّه إلى الجماعة.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: مع قريبه
  rationale: تفيد μετά مع المضاف إليه المصاحبة، و«قريبه» تنقل πλησίον بمعناه الأخلاقي والاجتماعي من غير تقييده بقرابة النسب.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم العلة الصريحة للوصية.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: لأننا بعضنا أعضاء بعض
  rationale: يحفظ صورة الجسد والتبادل الذي تدل عليه ἀλλήλων، بصياغة عربية موجزة ومألوفة كتابيًا.
theological_decisions:
- issue: الدلالة العامة لصيغ المذكر في ἕκαστος ... αὐτοῦ
  choice: «كل واحد ... قريبه» بصيغة المذكر التمثيلي
  alternative: «كل شخص ... قريبه» أو صياغة جمعية محايدة
  rationale: النص اليوناني يستعمل مفردًا مذكرًا ذا قوة عامة يشمل جماعة المخاطبين؛ وتحفظ العربية هذه الصيغة طبيعيًا من غير قصر المعنى على الرجال.
- issue: نطاق τὸ ψεῦδος
  choice: «الكذب» بوصفه سلوكًا عامًا
  alternative: «الباطل» أو «الكذبة»
  rationale: السياق الأخلاقي المباشر يقابل ممارسة الكذب بالتكلم بالصدق. ومع ذلك، يظل المعنى الأوسع «الباطل» ممكنًا بسبب أداة التعريف والمفرد، ولذلك أُثبت في الحاشية.
- issue: صورة الجسد في ἀλλήλων μέλη
  choice: 'الإبقاء على «أعضاء» وعلى علاقة التبادل: «بعضنا أعضاء بعض»'
  alternative: تفسيرها بعبارة «فنحن ننتمي بعضنا إلى بعض»
  rationale: الصياغة المختارة لا تحصر المعنى في مجرد الانتماء، بل تحفظ استعارة أعضاء الجسد وما تتضمنه من ترابط واعتماد متبادل.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعملت صيغة الأمر «اطرحوا» بدل محاكاة اسم الفاعل اليوناني تركيبًا، لأن ذلك أكثر طبيعية في العربية ويحفظ العلاقة الأمرية. وُضع كل مؤشر حاشية في المتن.
