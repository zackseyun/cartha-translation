translation:
  language: ar
  text: لِتَجْهِيزِ الْقِدِّيسِينَ لِعَمَلِ الْخِدْمَةِ، وَلِبُنْيَانِ جَسَدِ الْمَسِيحِ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «الخدمة»: «الخِدْمة للآخرين»، لأن الكلمة اليونانية διακονία تشمل معنى الخدمة والعمل في خدمة الجماعة، ولا تقتصر على منصب ديني.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن فهم العبارة أيضًا على نحو تدرجي: «لتجهيز القديسين لعمل الخدمة، لبنيان جسد المسيح».'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: لِتَجْهِيزِ
  rationale: تفيد العبارة الغاية، ويدل καταρτισμός على إعداد الأشخاص وجعلهم مؤهلين؛ و«تجهيز» واضحة ومعاصرة وتحفظ هذا المعنى.
- source_word: τῶν ἁγίων
  choice: الْقِدِّيسِينَ
  rationale: هذا هو التعبير البولسي المعتاد عن المؤمنين بوصفهم مكرسين لله، ولا يعني هنا فئة أُعلنت قداستها في زمن لاحق.
- source_word: εἰς ἔργον διακονίας
  choice: لِعَمَلِ الْخِدْمَةِ
  rationale: تحفظ «الخدمة» سعة معنى διακονία ولا تقصره على أصحاب المناصب الدينية، مع إبقاء «عمل» مفردة وفق النص اليوناني.
- source_word: εἰς οἰκοδομὴν
  choice: وَلِبُنْيَانِ
  rationale: يحفظ «البنيان» استعارة البناء التي يستخدمها οἰκοδομή للدلالة على تنمية الجماعة وتقويتها.
- source_word: τοῦ σώματος τοῦ Χριστοῦ
  choice: جَسَدِ الْمَسِيحِ
  rationale: «الجسد» يقابل σῶμα ويحفظ الصورة الجماعية البولسية، و«المسيح» ينقل Χριστός بوصفه لقبًا للممسوح.
theological_decisions:
- issue: العلاقة النحوية بين عبارات الغاية الثلاث
  choice: صيغت «لتجهيز... لعمل... ولبنيان...» بحيث تتبع تتابع حروف الغاية في اليونانية ولا تحسم العلاقة أكثر مما يحسمها النص.
  alternative: 'يمكن فهمها فهمًا تدرجيًا: تجهيز القديسين لعمل الخدمة، وهذا العمل يفضي إلى بنيان جسد المسيح.'
  rationale: تحتمل بنية πρὸς ... εἰς ... εἰς غايات متوازية أو تدرجًا في الغاية والنتيجة؛ لذلك تُذكر الإمكانية التدرجية في الحاشية بدل فرض توزيع طائفي لأدوار الخدمة.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية كريمة. استُخدم «القديسين» بوصفه المصطلح البولسي المألوف، و«المسيح» كلقب، مع تجنب حصر «الخدمة» في الإكليروس. أُثبتت علامتا الحاشيتين في المتن.
