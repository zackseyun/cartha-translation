  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: ar
  text: ولا تُحزِنوا روحَ الله القدوس، الذي فيه خُتِمتم ليوم الفداء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى يوم الفداء». وتفيد العبارة اليونانية (εἰς ἡμέραν ἀπολυτρώσεως) معنى الغاية أو التوجّه إلى المستقبل، ولذلك يمكن فهمها أيضًا بدلالة زمنية مستقبلية.'
    reason: بديل معجمي
lexical_decisions:
- source_word: λυπεῖτε
  choice: تُحزِنوا
  rationale: فعل مضارع مع μή يفيد النهي. «تُحزِنوا» ينقل المعنى العاطفي والعلاقي للفعل λυπέω بوضوح وطبيعية، من غير تخفيفه إلى مجرد الإساءة.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: روحَ الله القدوس
  rationale: يحفظ التركيب الإضافي الصريح «لله» وصفة القداسة، وهو التعبير العربي المعياري الطبيعي عن اللقب الكامل.
- source_word: ἐν ᾧ
  choice: الذي فيه
  rationale: يحافظ على حرف الجر ἐν وعلى الإحالة الشخصية إلى الروح القدس. استُعمل «الذي» لا «التي» بحسب التذكير النحوي لكلمة «روح» في العربية.
- source_word: ἐσφραγίσθητε
  choice: خُتِمتم
  rationale: ينقل الماضي المبني للمجهول بإيجاز، ويحفظ صورة الختم بما تتضمنه من دلالات الإثبات والملكية والحماية من غير شرح زائد داخل المتن.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: ليوم الفداء
  rationale: اللام تنقل بصورة موجزة وطبيعية اتجاه الختم وغايته المستقبلية، وتحافظ على سعة εἰς من غير حصرها في معنى زمني محض مثل «إلى أن يحل».
theological_decisions:
- issue: الإحالة الشخصية إلى الروح القدس في جملة الصلة
  choice: الذي فيه
  alternative: الذي به
  rationale: «فيه» أقرب إلى ἐν ᾧ ويحفظ التعبير كما ورد، بينما «به» يحسمه باتجاه معنى الوساطة أو الفاعلية. كما أن «الذي» يعامل الروح القدس بوصفه مرجعًا شخصيًا لا قوة غير شخصية.
- issue: علاقة الختم بيوم الفداء
  choice: ليوم الفداء
  alternative: إلى يوم الفداء
  rationale: تحفظ اللام معنى الغاية أو التوجّه في εἰς، مع بقاء الدلالة المستقبلية، ولا تفرض استنتاجًا عقائديًا أوسع بشأن آلية الختم أو الاستمرار.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُبقيت صورة «الختم» والتعبير «يوم الفداء» لما لهما من أهمية نصية ولاهوتية، مع تجنب الشرح التفسيري داخل المتن.
