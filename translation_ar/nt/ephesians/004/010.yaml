  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: ar
  text: الذي نزل هو نفسه أيضًا الذي صعد إلى ما فوق جميع السماوات[a]، لكي يملأ كل شيء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فوق جميع السماوات». وقد تشدد العبارة على سموّه فوق كل نطاق سماوي.'
