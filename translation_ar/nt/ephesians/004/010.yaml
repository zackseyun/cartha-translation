  - marker: b
    text: 'أو: «لكي يتمّم كل شيء». يمكن أن يعني الفعل اليوناني «يتمّم» في بعض السياقات، لكن «يملأ» أنسب بالسياق المباشر هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: الذي نزل
  rationale: اسم فاعل ماضٍ مسبوق بأداة التعريف ومستعمل استعمال الاسم؛ وصيغة الموصول مع الفعل الماضي طبيعية في العربية وتحفظ دلالته.
- source_word: αὐτός
  choice: هو نفسه أيضًا
  rationale: تحفظ هذه الصياغة توكيد الهوية بين النازل والصاعد، وهو ما يفيده الضمير المؤكد في اليونانية.
- source_word: ὁ ἀναβὰς
  choice: الذي صعد
  rationale: يحافظ على التوازي مع «الذي نزل» وينقل اسم الفاعل المستعمل استعمال الاسم بصياغة عربية واضحة.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: إلى ما فوق السماوات كلها
  rationale: تنقل معنى العلو المتجاوز لجميع السماوات، مع إبقاء «السماوات» جمعًا كما في الأصل، من غير إضافة تفسير كوني زائد.
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية بوضوح وطبيعية في العربية المعاصرة.
- source_word: πληρώσῃ
  choice: يملأ
  rationale: المعنى المباشر للفعل هنا هو الملء؛ ويظل احتمال معنى «يتمّم» مذكورًا في الحاشية من غير أن يحل محل القراءة الأرجح في السياق.
- source_word: τὰ πάντα
  choice: كل شيء
  rationale: صياغة عربية جامعة تحفظ اتساع العبارة اليونانية ولا تقصرها على الناس أو تفسرها صراحة بالكون كله.
theological_decisions:
- issue: هوية النازل والصاعد
  choice: التصريح بأن الذي نزل هو نفسه الذي صعد
  alternative: صياغة أقل توكيدًا تذكر النزول والصعود من غير إبراز وحدة الشخص
  rationale: الضمير αὐτός وتكرار التركيب الاسمي يؤكدان أن النازل والصاعد شخص واحد؛ فحُفظ هذا التوكيد من دون إضافة شرح عقائدي إلى المتن.
- issue: مدى عبارة τὰ πάντα
  choice: كل شيء
  alternative: كل الناس؛ الكون كله
  rationale: العبارة شاملة ومفتوحة من حيث النطاق؛ لذلك تُرك اتساعها كما هو بدل تقييدها بفئة أو توسيعها بتفسير صريح.
- issue: دلالة πληρώσῃ
  choice: يملأ
  alternative: يتمّم
  rationale: «يملأ» أنسب بالسياق المباشر وتحفظ صورة الامتلاء، مع الإقرار في الحاشية بأن الفعل قد يأتي بمعنى «يتمّم» في سياقات أخرى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين «الذي نزل» و«الذي صعد»، والتوكيد في «هو نفسه أيضًا»، وجمع «السماوات»، واتساع «كل شيء». وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحانهما مباشرة.
