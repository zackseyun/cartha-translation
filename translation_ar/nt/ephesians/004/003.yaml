  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: ar
  text: مجتهدين في حفظ وحدة الروح برباط السلام[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حريصين على المحافظة على» أو «ساعين إلى صون».'
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«الروح» هنا على الأرجح الروح القدس، مع أن بعضهم يفهمه بمعنى أعم، أي الروح المشتركة بين المؤمنين.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: مجتهدين
  rationale: اسم فاعل حالي يفيد بذل الجد والحرص العملي، ويرتبط بسياق الحث في الآيتين السابقتين.
- source_word: τηρεῖν
  choice: في حفظ
  rationale: يفيد صون وحدة قائمة والمحافظة عليها، لا إنشاءها من جديد.
- source_word: τὴν ἑνότητα
  choice: وحدة
  rationale: مقابل عربي واضح ومباشر لـἑνότης، ويحافظ على المعنى الجماعي في السياق.
- source_word: τοῦ πνεύματος
  choice: الروح
  rationale: وجود أداة التعريف والسياق القريب في أفسس يرجحان الإشارة إلى الروح القدس، مع إبقاء اللفظ نفسه دون إضافة «القدس» في المتن.
- source_word: ἐν
  choice: بـ
  rationale: الباء عربية طبيعية هنا، وتنقل احتمال الوسيلة أو الرباط الذي تُصان فيه الوحدة.
- source_word: τῷ συνδέσμῳ
  choice: رباط
  rationale: يحفظ صورة ما يربط الأجزاء بعضها ببعض، وهو تعبير عربي موجز ومفهوم.
- source_word: τῆς εἰρήνης
  choice: السلام
  rationale: 'يحافظ على الإضافة البسيطة في الأصل: «رباط السلام»، دون حسم ما إذا كان السلام هو الرباط نفسه أو ما ينشئه.'
theological_decisions:
- issue: مرجع πνεύματος
  choice: الروح، والمقصود على الأرجح الروح القدس
  alternative: روح مشتركة بين المؤمنين أو الروح البشرية
  rationale: استعمال بولس في السياق القريب، ولا سيما أفسس 4:4 و4:30، يرجح الروح القدس؛ لكن المتن لا يضيف «القدس» صراحة، وتوثق الحاشية الاحتمال الآخر.
- issue: طبيعة الوحدة
  choice: وحدة قائمة ينبغي حفظها
  alternative: وحدة ينشئها المؤمنون
  rationale: الفعل τηρεῖν يعني الحفظ والصون، فيصور الوحدة بوصفها واقعًا قائمًا مطلوبًا الحفاظ عليه، لا صنعه.
- issue: علاقة السلام بالرباط
  choice: الإبقاء على تركيب «رباط السلام»
  alternative: الرباط الذي يصنعه السلام أو الرباط الذي هو السلام
  rationale: الإضافة اليونانية تحتمل أكثر من تحديد دلالي، ولذلك لا ينبغي توسيعها في المتن بما يحسم العلاقة.
translation_notes:
  register: عربية فصحى معاصرة، موجزة ووقورة. اختيرت «مجتهدين» لإبراز الجهد الجاد، و«حفظ» للدلالة على صون ما هو قائم. أُبقيت الصورة المجازية في «رباط السلام»، وحُفظ الغموض المحدود في «الروح» مع بيان الترجيح في الحاشية.
