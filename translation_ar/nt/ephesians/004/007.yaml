  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: ar
  text: وَأَمَّا كُلُّ وَاحِدٍ مِنَّا، فَقَدْ أُعْطِيَتْ لَهُ النِّعْمَةُ بِحَسَبِ مِقْدَارِ عَطِيَّةِ الْمَسِيحِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» ينقل اللقب اليوناني Χριστός، ومعناه «الممسوح».
    reason: توضيح المصطلح
lexical_decisions:
- source_word: Ἑνὶ δὲ ἑκάστῳ ἡμῶν
  choice: أَمَّا كُلُّ وَاحِدٍ مِنَّا
  rationale: يحافظ هذا التركيب على الدلالة التوزيعية المؤكدة في ἑνὶ ... ἑκάστῳ، ويُبرز انتقال الكلام من وحدة الجماعة في السياق السابق إلى ما يُمنح لكل فرد فيها. وتؤدي «أمّا» وظيفة δέ بوصفها انتقالًا ذا مقابلة خفيفة.
- source_word: ἐδόθη
  choice: فَقَدْ أُعْطِيَتْ لَهُ
  rationale: صيغة المبني للمجهول تنقل الماضي اليوناني البسيط وتحافظ على كون النعمة شيئًا ممنوحًا، وإضافة «له» لازمة في العربية مع تقديم «كل واحد منا».
- source_word: ἡ χάρις
  choice: النِّعْمَةُ
  rationale: «النعمة» هي المقابل العربي الطبيعي لمفردات بولس اللاهوتية، وتترك للسياق تحديد كونها هنا نعمة ممنوحة لكل فرد تمكّنه من الخدمة، من غير اختزالها في «موهبة» أو حصرها في معنى الخلاص.
- source_word: κατὰ τὸ μέτρον
  choice: بِحَسَبِ مِقْدَارِ
  rationale: ينقل هذا التعبير معنى المعيار أو التناسب الذي تؤديه κατά مع المنصوب، مع الحفاظ على صورة «المقدار» الواردة في الأصل.
- source_word: τῆς δωρεᾶς
  choice: عَطِيَّةِ
  rationale: «عطية» تعبّر طبيعيًا عن شيء يُمنح مجانًا، وتبقى متميزة لفظيًا عن «النعمة» من غير شرح زائد داخل النص.
- source_word: τοῦ Χριστοῦ
  choice: الْمَسِيحِ
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ معناه اللقبي المتصل بالممسوح دون تحويله إلى اسم مجرد.
theological_decisions:
- issue: دلالة «النعمة» في السياق
  choice: الإبقاء على «النعمة» مع ترك السياق يبيّن أنها موزعة على الأفراد وترتبط بالخدمة داخل الجماعة
  alternative: تفسيرها صراحةً بأنها «موهبة للخدمة» أو حصرها في «نعمة الخلاص»
  rationale: الآيات التالية تتناول تنوع العطايا والخدمات، لكن لفظ χάρις أوسع من «موهبة» وحدها. لذلك يحفظ النص اللفظ اللاهوتي والتوتر الدلالي بدل حسمه تفسيريًا.
- issue: دلالة المضاف في «عطية المسيح»
  choice: الإبقاء على الإضافة العربية «عطية المسيح»
  alternative: «العطية التي يمنحها المسيح» أو «العطية المقدمة للمسيح»
  rationale: الإضافة اليونانية لا تصرّح وحدها بكل تفاصيل العلاقة، مع أن السياق يرجح أن المسيح هو الواهب. وتحافظ الإضافة العربية على الصياغة الموجزة وعلى قدر مناسب من هذا الانفتاح الدلالي.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: الممسوح أو المسيّا
  rationale: «المسيح» لقب عربي مفهوم وراسخ ينقل Χριστός، بينما «الممسوح» تفسير حرفي غير طبيعي في هذا الموضع، و«المسيّا» نقل للفظ السامي لا للفظ اليوناني نفسه.
translation_notes:
  register: صياغة عربية فصحى واضحة ورصينة. استُخدم تركيب «أمّا ... فقد» لإبراز كل فرد على نحو طبيعي، مع تجنب الشرح التفسيري داخل المتن. ضُبط النص ضبطًا كاملًا لملاءمة النشر الكتابي، ووُضع مؤشر الحاشية في المتن كما يلزم.
