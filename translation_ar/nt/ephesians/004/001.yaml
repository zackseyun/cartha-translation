  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: ar
  text: لذلك أحثّكم أنا، السجين في الرب[a]، أن تسلكوا سلوكًا يليق بالدعوة التي دُعيتم بها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سجين الرب»، أو «السجين من أجل الرب».
    reason: alternative_reading
  - marker: b
    text: أو «أن تعيشوا عيشةً تليق بالدعوة التي دُعيتم إليها».
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أحثّكم
  rationale: يفيد الفعل هنا نداءً رعويًا قويًا وحضًّا جادًا، و«أحثّكم» تؤدي هذه القوة بوضوح من غير تكلّف.
- source_word: οὖν
  choice: لذلك
  rationale: تُظهر «لذلك» أن الوصية الآتية مبنية على ما سبق عرضه في الرسالة.
- source_word: δέσμιος
  choice: السجين
  rationale: المعنى المباشر هو الشخص المسجون، و«السجين» تعبير عربي واضح وطبيعي.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحافظ الصياغة على العبارة البولسية وعلى سعتها الدلالية، من غير حصرها في معنى السببية أو الملكية.
- source_word: ἀξίως
  choice: سلوكًا يليق
  rationale: تعبّر هذه الصياغة العربية الطبيعية عن التصرف على نحو يتناسب مع الدعوة، مع ربط الحال بالفعل المجازي «تسلكوا».
- source_word: περιπατῆσαι
  choice: أن تسلكوا
  rationale: يحفظ «تسلكوا» استعارة المشي التي يستخدمها بولس للدلالة على نهج الحياة، وهي مفهومة في العربية الفصحى.
- source_word: κλήσεως
  choice: الدعوة
  rationale: «الدعوة» هي المقابل المألوف في هذا السياق لدعوة الله التي تلقاها المؤمنون.
- source_word: ἧς ἐκλήθητε
  choice: التي دُعيتم بها
  rationale: تحافظ الصياغة على الصلة اللفظية بين «الدعوة» و«دُعيتم»، وتقارب تركيب اليونانية من غير إخلال بالعربية.
theological_decisions:
- issue: 'دلالة وصف بولس لنفسه: ὁ δέσμιος ἐν κυρίῳ'
  choice: السجين في الرب
  alternative: سجين الرب؛ السجين من أجل الرب
  rationale: تُبقي الترجمة حرف الجر «في» ولا تحسم العلاقة على أنها ملكية أو سببية، فتحفظ السعة والتوتر الدلاليين في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت استعارة «السلوك» البولسية، مع صياغة طبيعية هي «تسلكوا سلوكًا يليق»، وحُفظت عبارة «في الرب» دون تفسير زائد.
