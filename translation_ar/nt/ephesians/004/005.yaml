translation:
  language: ar
  text: رَبّ واحد، إيمان واحد[a]، معمودية واحدة؛
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمانة واحدة» أو «ثقة واحدة»؛ غير أن «إيمان واحد» أنسب لتأكيد الوحدة المشتركة في هذا السياق.
    reason: بديل معجمي للكلمة اليونانية πίστις مع بيان الترجيح السياقي.
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: واحد / واحدة
  rationale: صيغ العدد الثلاث توافق أسماء مختلفة الجنس في اليونانية. نُقلت بصيغة «واحد/واحدة» بحسب جنس الاسم العربي، مع الحفاظ على التكرار الثلاثي الذي يشدد على الوحدة.
- source_word: κύριος
  choice: رَبّ
  rationale: الترجمة المعتادة للقب κύριος في هذا السياق البولسي؛ وهو هنا، في سياق أفسس 4:4–6، لقب مسياني يُفهم على الأرجح أنه يشير إلى يسوع، لا مجرد «سيّد» بشري.
- source_word: πίστις
  choice: إيمان
  rationale: يلائم معنى الإيمان المشترك أو استجابة المؤمنين التي تجمع الكنيسة في هذا السياق. ويمكن أن تدل الكلمة أيضًا على «الأمانة» أو «الثقة»، ولذلك ذُكر البديل في الحاشية من غير أن يُفرض على المتن.
- source_word: βάπτισμα
  choice: معمودية
  rationale: المصطلح العربي المألوف والدقيق للشعيرة التي تدل عليها الكلمة، من غير شرح يحدد طريقتها أو فاعليتها اللاهوتية.
theological_decisions:
- issue: مرجع لقب «رَبّ»
  choice: الإبقاء على «رَبّ» بوصفه لقبًا مسيانيًا، والأرجح أنه يشير إلى يسوع في تسلسل أفسس 4:4–6.
  alternative: إشارة عامة إلى الله.
  rationale: يذكر السياق روحًا واحدًا في الآية 4، وربًّا واحدًا في الآية 5، وإلهًا وآبًا واحدًا في الآية 6؛ لذا يُرجح أن «الرَّب» يشير إلى الابن، من غير إضافة تفسير إلى المتن.
- issue: معنى «معمودية واحدة»
  choice: ترجمة العبارة ترجمة محايدة من غير تحديد الكيفية أو الفاعلية أو طبيعة المقصود.
  alternative: تشديد أسراري خاص، أو فهمها أساسًا على أنها معمودية روحية/مجازية.
  rationale: تؤكد الآية الوحدة، لكنها لا تحسم بذاتها الخلافات المذهبية المتعلقة بلاهوت المعمودية؛ لذلك تُحفظ صياغتها وتوترها التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع تنوين الأسماء لإظهار البنية الاسمية المتوازية. استُعملت «معمودية» لأنها الصيغة العربية الشائعة والدقيقة. وُضع مؤشر الحاشية مباشرة بعد «إيمان واحد».
