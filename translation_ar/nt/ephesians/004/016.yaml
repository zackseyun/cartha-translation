  - severity: low
    issue: إضافة معنى «المعيَّن» إلى مقدار كل جزء
    rationale: ἐν μέτρῳ تشير إلى القياس أو المقدار، أما تعيين هذا المقدار فليس مذكورًا صراحة في العبارة.
