  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: ar
  text: فمنه يُنَمِّي الجسدُ كلُّه نفسه، إذ تتآلف أجزاؤه وتتماسك بوساطة كل مفصل يمدّ الجسد[a]، وفقًا لفاعلية كل جزء في حدود مقياسه، لبنيان نفسه في المحبة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بوساطة كل رباط داعم» أو «بوساطة كل وصلة تمدّ الجسد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: فمنه
  rationale: يعود الضمير بحسب السياق إلى المسيح في الآية السابقة، ويحفظ كونه مصدر نمو الجسد.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: إذ يتناسق ويتماسك
  rationale: ينقل الفعلان صورة تركيب الأجزاء معًا وترابطها، بصياغة عربية واضحة تحافظ على المعنيين المتكاملين.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: بواسطة كل مفصل يمدّه
  rationale: يحفظ صورة الجسد الملموسة، ويعبّر عن معنى الإمداد أو الدعم في ἐπιχορηγία من غير حصر ἁφή في توصيف تشريحي دقيق.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: وبحسب عمل كل جزء بالمقدار المعيَّن له
  rationale: يحفظ اقتران العمل بالمقدار الخاص بكل جزء، ويتجنب العبارة العربية المتكلفة «عمل في مقدار»؛ ولفظ «المعيَّن له» يوضح دلالة التناسب السياقية.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: يحقِّق الجسدُ كلُّه نموَّه
  rationale: يحافظ على الجسد فاعلًا نحويًا يحقق نموه، مع تجنب التكرار الثقيل لعبارة «نمو الجسد» في العربية.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: فيبني نفسه
  rationale: ينقل استعارة البناء والقوة الانعكاسية في ἑαυτοῦ بلغة عربية طبيعية.
- source_word: ἐν ἀγάπῃ
  choice: في المحبة
  rationale: ترجمة مباشرة تحفظ موضوع المحبة المتكرر في السياق.
theological_decisions:
- issue: مصدر نمو الكنيسة وفاعليتها
  choice: المسيح هو المصدر الذي منه يتحقق النمو، والجسد كله يحقق نموه من خلال عمل أجزائه.
  alternative: صياغة تجعل المسيح وحده الفاعل المباشر للنمو، أو تجعل الجسد مستقلًا عنه في نموه.
  rationale: تجمع العبارة اليونانية بين ἐξ οὗ الدالة على المصدر وبين الجسد بوصفه فاعل ποιεῖται؛ لذلك تحافظ الترجمة على الطرفين من غير إذابة أحدهما في الآخر.
- issue: دلالة صورة المفاصل والإمداد
  choice: الإبقاء على صورة «كل مفصل يمدّه».
  alternative: «كل رباط داعم» أو «كل وصلة تمدّه».
  rationale: لفظة ἁφή تحتمل نقطة الاتصال أو المفصل، وἐπιχορηγία تدل على الإمداد أو الدعم؛ فاختير تعبير ملموس مع إثبات البدائل في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. رُتبت الجملة بحيث تبقى علاقة المسيح بالمصدر وعمل الجسد وأجزائه ظاهرة، مع تخفيف ثقل التركيب اليوناني الطويل.
