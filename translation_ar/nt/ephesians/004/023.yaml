  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأن تتجدَّدوا بروح أذهانكم»؛ إذ يمكن أن تُفهم العبارة على أن الروح وسيلة التجدّد. لكن الأرجح أنها تشير إلى النزعة أو التوجّه الباطني لأذهانكم، لا إلى الروح القدس مباشرةً.'
