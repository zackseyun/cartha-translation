lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: أن تتجدَّدوا
  rationale: يحفظ صيغة المصدر المبني للمجهول ومعنى التجدّد، وينسجم مع تسلسل الأفعال في السياق. وقد توحي صيغة المضارع اليونانية بعملية مستمرة، من غير حاجة إلى التصريح بذلك في المتن.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة ضمن تسلسل، وليست هنا استدراكًا قويًّا.
- source_word: τῷ πνεύματι
  choice: في روح
  rationale: تفيد العبارة على الأرجح المجال أو الناحية التي يقع فيها التجدّد، وتحافظ كلمة «روح» على صياغة الأصل وعلى شيء من احتماله الدلالي من غير التصريح بأن المقصود هو الروح القدس.
- source_word: τοῦ νοὸς
  choice: أذهان
  rationale: «الذهن» مقابل مباشر وطبيعي لـ νοῦς. وجاء الجمع في العربية مع ضمير المخاطبين الجمع لبيان أن المقصود أذهانهم جميعًا وتجنّب التباس المفرد الجمعي.
- source_word: ὑμῶν
  choice: كم
  rationale: ضمير ملكية للمخاطبين بصيغة الجمع، وهو ملحق بـ«أذهان» في العربية.
theological_decisions:
- issue: هل تشير πνεύματι إلى الروح القدس أم إلى الروح أو التوجّه الباطني للذهن؟
  choice: الإبقاء على «روح أذهانكم» بوصفها على الأرجح التوجّه أو النزعة الباطنية للذهن
  alternative: أن يكون الروح القدس هو الفاعل الذي يجدّد أذهانهم
  rationale: إضافة «أذهانكم» إلى «روح» ترجّح المعنى الإنساني الباطني، لكن تركيب الأصل لا يزيل تمامًا احتمال فهم الروح بوصفه عامل التجدّد؛ لذلك لم يُحسم الاحتمال داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حوفظ على المبني للمجهول وعلى التركيب الإضافي المقصود، مع استعمال «أذهانكم» بدل المفرد الجمعي لتكون الإشارة إلى جماعة المخاطبين طبيعية وواضحة.
