  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: بكل
  rationale: تفيد μετά مع المضاف المصاحبة، وتفيد πάσης الشمول والتوكيد؛ وصيغة «بكل» عربية موجزة وطبيعية تحفظ القوتين.
- source_word: ταπεινοφροσύνης
  choice: تواضع
  rationale: يدل الاسم على اتضاع الفكر والسلوك؛ و«تواضع» لفظ عربي معاصر واضح يحفظ الدلالة الأخلاقية.
- source_word: πραΰτητος
  choice: وداعة
  rationale: يدل اللفظ على اللين وضبط القوة لا الضعف؛ و«وداعة» مصطلح كتابي عربي راسخ ومفهوم في هذا السياق.
- source_word: μακροθυμίας
  choice: طول أناة
  rationale: يفيد الصبر الممتد على الآخرين والبطء في الغضب؛ و«طول أناة» أدق من «صبر» وحدها في إبراز هذا البعد العلاقي.
- source_word: ἀνεχόμενοι
  choice: محتملين
  rationale: اسم فاعل حاضر يفيد الاستمرار في تحمّل الآخرين والصبر عليهم؛ وتحافظ «محتملين» على الصلة النحوية بالوصية المحيطة في السياق.
- source_word: ἀλλήλων
  choice: بعضكم بعضًا
  rationale: ترجمة عربية معيارية واضحة للضمير التبادلي، وتبيّن أن الاحتمال متبادل داخل الجماعة.
- source_word: ἐν ἀγάπῃ
  choice: في المحبة
  rationale: تحفظ حرف الجر ἐν، مع إمكان دلالته هنا على المجال أو الكيفية التي يجري بها الاحتمال المتبادل.
theological_decisions:
- issue: ترجمة ἀγάπη
  choice: المحبة
  alternative: الحب
  rationale: كلاهما صحيح، لكن «المحبة» طبيعية ورصينة في العربية الكتابية الحديثة، ولا تضيف معنى مذهبيًا خاصًا.
- issue: علاقة ἐν ἀγάπῃ بالفعل
  choice: في المحبة
  alternative: بمحبة
  rationale: تُبقي «في» على غموض الأصل بين المجال والكيفية، بدل حصر العبارة في معنى الوسيلة أو الحال فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على البنية التراكمية للنص اليوناني وعلى صيغة اسم الفاعل، من غير إدخال فعل أمر غير موجود في هذه الآية منفردة؛ فالعبارة تتصل نحويًا بسياق الآية السابقة.
