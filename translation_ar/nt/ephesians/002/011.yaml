source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: ar
  text: لذلك اذكروا أنكم أنتم الذين كنتم قبلاً من الأمم في الجسد، المدعوّين «الغرلة» من قِبَل ما يُسمّى «الختان»، الختان المصنوع بالأيدي في الجسد—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الغرلة» و«الختان» هنا تسميتان إثنيتان وعهديتان لجماعتين، لا مجرد وصفين تشريحيين. وتكرار «المدعوّين/ما يُسمّى» قد يتضمن مسافة نقدية من الاتكال على ختان خارجي مصنوع بالأيدي.
    reason: cultural_and_rhetorical_note
lexical_decisions:
- source_word: Διὸ
  choice: لِذَلِكَ
  rationale: تربط الوصية استنتاجيًا بما سبق، بصياغة عربية طبيعية وفصيحة.
- source_word: μνημονεύετε
  choice: اذْكُرُوا
  rationale: فعل أمر للجمع يؤدي معنى استحضار حالتهم السابقة؛ ولا يلزم إثقال العربية بإظهار الاستمرار النحوي.
- source_word: ποτὲ ὑμεῖς
  choice: أَنَّكُمْ أَنْتُمْ ... كُنْتُمْ قَبْلًا
  rationale: يحفظ الدلالة الزمنية ويُبرز ضمير المخاطبين كما يبرزه النص اليوناني.
- source_word: τὰ ἔθνη
  choice: مِنَ الْأُمَمِ
  rationale: يشير في هذا السياق إلى غير اليهود، مع الاحتفاظ بالمصطلح الكتابي العربي الشائع «الأمم».
- source_word: ἐν σαρκί
  choice: حَسَبَ الْجَسَدِ
  rationale: ينقل المعنى الجسدي والاجتماعي-الإثني من غير أن يوحي بالطبيعة الخاطئة؛ وهو أفصح هنا من الترجمة الحرفية «في الجسد».
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: وَيُطْلَقُ عَلَيْكُمْ اسْمُ «الْغُرْلَةِ»
  rationale: يحفظ كون اللفظ تسمية اجتماعية جماعية، لا مجرد وصف تشريحي.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: مِنْ قِبَلِ مَا يُسَمَّى «الْخِتَانَ»
  rationale: يحافظ على تكرار معنى «يُسمّى» وعلى المسافة البلاغية، من غير تضخيم نبرة التهكم.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: الْمَصْنُوعِ بِالْيَدِ فِي الْجَسَدِ
  rationale: يربط الوصف بالختان ويحفظ عبارتي «باليد» و«في الجسد» القريبتين من اليونانية.
theological_decisions:
- issue: دلالة σάρξ في هذا الموضع
  choice: حسب الجسد / في الجسد
  alternative: جسديًا / في البدن
  rationale: السياق يتناول العلامة الجسدية والهوية الإثنية-العهدية، لا الفساد الأخلاقي؛ لذلك لم تُترجم الكلمة بما يفيد «الطبيعة الخاطئة».
- issue: قوة λεγομένης مع περιτομή
  choice: ما يُسمّى «الختان»
  alternative: «الختان» المزعوم / المدعو «الختان»
  rationale: يحفظ التوازي البلاغي بين التسميتين واحتمال نقد الاكتفاء بالعلامة الخارجية، من غير فرض سخرية صريحة أو نبرة معادية لليهود.
- issue: وظيفة «الغرلة» و«الختان»
  choice: الإبقاء عليهما كتسميتين جماعيتين بين علامتي اقتباس
  alternative: غير المختونين / المختونون
  rationale: الأسماء المجرّدة في اليونانية تعمل هنا ألقابًا إثنية-عهدية؛ والإبقاء عليها يصون حدة التعبير وتوتره اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «الأمم» بالمفهوم الكتابي لغير اليهود، وحُفظت بنية الجملة المفتوحة بشرطة طويلة لأنها تستمر في العدد التالي. وُضع التشكيل الجزئي/الكامل هنا لزيادة الوضوح، ويمكن توحيده وفق أسلوب المشروع.
