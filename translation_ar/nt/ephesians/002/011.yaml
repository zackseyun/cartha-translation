review_pass:
  verdict: revise
  source_fidelity: المعنى العام منقول بأمانة، مع الحفاظ على «الأمم» و«الجسد» بوصفهما دالَّين على الهوية الإثنية/الجسدية لا على الفساد الأخلاقي. لكن «يُطلَق عليكم اسم» لا يحافظ بوضوح على تكرار فعل «يُسمّى/يُدعى» في اليونانية، و«باليد» تُضعف صيغة الجمع في χειροποιήτου («بالأيدي»).
  naturalness: الصياغة مفهومة وفصيحة في المجمل، غير أن «مِن قِبَلِ ما يُسمّى الختان، المصنوع...» ثقيلة قليلًا، كما أن إحالة الوصف النعتي بعد علامات الاقتباس تحتاج إلى سبك أوضح. الصياغة المنقحة تبقي البنية المتصلة للآية وتصل الوصف بـ«الختان» بوضوح.
  terminology: «الأمم»، و«الغرلة»، و«الختان»، و«الجسد» مصطلحات مناسبة ومألوفة في العربية الكتابية. تُحفظ علامتا الاقتباس لإبراز أن «الغرلة» و«الختان» تسميتان جماعيتان في السياق.
  issues:
