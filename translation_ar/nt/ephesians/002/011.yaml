  - severity: low
    issue: «باليد» بدل «بالأيدي»
    rationale: χειροποιήτου تعني «مصنوعًا بالأيدي/بيد بشرية». و«بالأيدي» أدق في مقابلة العبارة اليونانية ويظل طبيعيًا بالعربية.
