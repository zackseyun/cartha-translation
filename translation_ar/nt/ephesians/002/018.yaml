  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: ar
  text: لأن لنا كلينا، من خلاله، الوصولَ إلى الآب في روحٍ واحد[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فإنه من خلاله لنا كلينا الوصول…»؛ يمكن أن تفيد ὅτι هنا التفسير أو التعليل.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «الوصول» بـ«الدخول» أو «الاقتراب».
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بروحٍ واحد»؛ وتحافظ «في روحٍ واحد» على حرف الجر اليوناني، الذي قد يدل على الوسيلة أو المجال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تفيد الأداة هنا التعليل أو بيان الأساس لما سبق؛ و«لأن» تنقل هذه الصلة بوضوح، مع إمكان فهمها تفسيريةً بمعنى «فإن».
- source_word: δι’ αὐτοῦ
  choice: من خلاله
  rationale: تحافظ على دلالة الوساطة في διά مع المضاف إليه، وتشير في السياق إلى المسيح بوصفه الذي يتم الوصول من خلاله.
- source_word: ἔχομεν
  choice: لنا
  rationale: تنقل معنى الامتلاك أو التمتع القائم في صياغة عربية موجزة وطبيعية، من غير إضافة معنى الاستحقاق.
- source_word: τὴν προσαγωγὴν
  choice: سبيل الوصول
  rationale: تعبّر عن إمكان الدنو والحضور لدى ذي مقام، وتحافظ على إمكان وجود إيحاء حضوري أو شعائري من غير حصر اللفظ في تقديم رسمي أولي.
- source_word: οἱ ἀμφότεροι
  choice: كلينا
  rationale: تحافظ على صيغة المتكلم الجامعة وعلى الإشارة إلى الطرفين المذكورين في السياق، أي اليهود والأمم، من غير إدخال تسميتهما في الآية.
- source_word: ἐν ἑνὶ πνεύματι
  choice: في روح واحد
  rationale: تحافظ على حرف الجر اليوناني وعلى احتمال دلالته على المجال أو الوسيلة. والسياق يرجّح أن المقصود هو الروح القدس، لكن العربية لا تستخدم الحروف الكبيرة لتمييز هذا الترجيح طباعيًا.
- source_word: πρὸς τὸν πατέρα
  choice: إلى الآب
  rationale: تنقل اتجاه الوصول نحو حضور الآب بألفاظ مباشرة، من غير إضافة كلمة «الله» غير الموجودة صراحة في الأصل.
theological_decisions:
- issue: مرجع «روح واحد»
  choice: يُفهم على الأرجح أنه الروح القدس، مع إبقاء الصياغة «في روح واحد»
  alternative: روح بشرية مشتركة
  rationale: البنية السياقية تجمع الوساطة «من خلاله»، والروح الواحد، والوصول «إلى الآب»، مما يرجّح الإشارة إلى الروح القدس. ومع ذلك، لا تضيف الترجمة لفظ «القدس» غير الوارد هنا، فتحافظ على صياغة الأصل وما فيها من قدر من عدم التصريح.
- issue: دلالة προσαγωγή
  choice: سبيل الوصول المشترك إلى الآب
  alternative: التقديم الرسمي إلى حضرة الآب أو مجرد الاقتراب
  rationale: يحمل اللفظ معنى الوصول أو الإدخال إلى الحضور، وربما إيحاءً بلاطيًا أو شعائريًا. وتعبير «سبيل الوصول» واضح للقارئ الحديث ولا يحصر الصورة في لحظة تقديم أولى ولا يضيف مفهوم «الحق» صراحة.
translation_notes:
  register: الصياغة عربية فصحى معاصرة ذات نبرة كريمة وموجزة. استُعمل «لنا كلينا» للحفاظ على التضامن بصيغة المتكلم، و«سبيل الوصول» لتجنب الغموض غير المقصود في «الدخول» وحدها. وُضعت الفواصل لتوضيح تعلق «من خلاله» بالفعل الضمني من غير تغيير ترتيب الأفكار الأساسي.
