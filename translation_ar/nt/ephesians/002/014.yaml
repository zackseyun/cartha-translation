source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: ar
  text: فهو نفسه سلامنا، إذ جعل الاثنين واحدًا، وهدم في جسده الحائط الفاصل، أي العداوة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا وصل «العداوة» بما يلي: «وأبطل في جسده العداوة...»، إذ يحتمل تركيب العبارة في اليونانية أكثر من وجه.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: αὐτὸς
  choice: هو نفسه
  rationale: يحفظ توكيد الضمير اليوناني ويبرز أن المسيح ذاته هو السلام.
- source_word: γάρ
  choice: فـ
  rationale: تربط الآية بما قبلها بوصفها تعليلًا له، بصياغة عربية طبيعية.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: سلامنا
  rationale: 'ترجمة مباشرة تحافظ على الإسناد القوي: المسيح نفسه هو السلام.'
- source_word: ὁ ποιήσας
  choice: إذ جعل
  rationale: تنقل اسم الفاعل الماضي بوصفه شارحًا لكيفية كونه سلامنا، مع سلاسة عربية.
- source_word: τὰ ἀμφότερα
  choice: الاثنين
  rationale: يحافظ على إجمال الأصل؛ ويتضح من السياق أن المقصود اليهود وغير اليهود.
- source_word: ἓν
  choice: واحدًا
  rationale: يحفظ نتيجة فعل الجمع والوحدة من غير إضافة تفسيرية.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: الحائط الفاصل
  rationale: ينقل صورة الجدار الذي يعمل حاجزًا، ويتجنب الحشو غير الطبيعي في عبارة مثل «حائط الحاجز».
- source_word: λύσας
  choice: هدم
  rationale: فعل عربي طبيعي عند الحديث عن إزالة حائط، ويؤدي معنى التفكيك والإبطال في السياق.
- source_word: τὴν ἔχθραν
  choice: أي العداوة
  rationale: يعرض العداوة تفسيرًا للحائط الفاصل، مع الإبقاء على إمكان التعلق النحوي المختلف في الحاشية.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: في جسده
  rationale: في هذا السياق تشير σάρξ إلى وجود المسيح الجسدي وموته المتجسد؛ و«جسده» أوضح في العربية من «لحمه» من غير إدخال معنى «الطبيعة الخاطئة».
theological_decisions:
- issue: مرجع «الاثنين»
  choice: إبقاء اللفظ مجملًا في المتن
  alternative: تفسيره صراحة بأنه اليهود وغير اليهود
  rationale: الأصل يقول «الاثنين»، والسياق القريب يبين المرجع؛ لذا تحفظ الترجمة الإيجاز ولا تضيف التفسير إلى المتن.
- issue: دلالة σάρξ في وصف المسيح
  choice: في جسده
  alternative: في لحمه
  rationale: المقصود وجود المسيح الجسدي وموته، لا طبيعة خاطئة. «جسده» عربية واضحة وكريمة وتحفظ التجسد المقصود.
- issue: العلاقة النحوية لعبارة «العداوة» وما يليها
  choice: جعل «العداوة» بيانًا للحائط، وربط «في جسده» بفعل الهدم
  alternative: قراءة «العداوة في جسده» أو وصل «العداوة» بما يأتي في الآية التالية
  rationale: ترتيب اليونانية يحتمل قدرًا من التعلق النحوي، لكن هذه الصياغة تتجنب الإيحاء بأن العداوة كامنة في جسد المسيح، مع توثيق الاحتمال البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت «الاثنين» للمحافظة على إجمال الأصل، و«الحائط الفاصل» لصورة طبيعية مفهومة، مع حاشية تحفظ الغموض النحوي الحقيقي في موضع «العداوة».
