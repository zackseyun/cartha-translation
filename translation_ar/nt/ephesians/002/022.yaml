  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: ar
  text: وفيه أنتم أيضًا تُبنَون معًا لتصيروا مسكنًا لله في الروح[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: وقد يُفهَم الضمير في «وفيه» على أنه يعود إلى البناء كله، لا إلى المسيح مباشرةً.
    reason: alternative_reading
  - marker: b
    text: أو «في روح» أو «بالروح». فقد تدل العبارة على مجال سكنى الله أو على عمل الروح القدس.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: وفيه
  rationale: الضمير الموصول يعود، على الأرجح، إلى المسيح في السياق القريب؛ وصيغة «فيه» طبيعية في العربية وتحفظ إمكان عوده نحويًا إلى البناء أيضًا.
- source_word: καὶ
  choice: أيضًا
  rationale: تنقل القوة الإضافية، إذ يضم بولس المخاطَبين إلى جماعة المؤمنين الموصوفة بالبناء.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: إبراز الضمير المنفصل يحفظ توكيد ضمير المخاطبين الجمع الوارد صراحة في اليونانية.
- source_word: συνοικοδομεῖσθε
  choice: تُبنَون معًا
  rationale: صيغة المضارع المبني للمجهول تدل على عملية جارية، و«معًا» تنقل دلالة السابقة σύν ضمن صورة البناء.
- source_word: εἰς
  choice: لتصيروا
  rationale: تنقل غاية البناء أو نتيجته بلغة عربية واضحة، بدل ترجمة حرفية ثقيلة مثل «إلى مسكن».
- source_word: κατοικητήριον
  choice: مسكنًا
  rationale: لفظ عربي واضح وموجز يدل على موضع السكن، ويحفظ صورة الهيكل في السياق.
- source_word: τοῦ θεοῦ
  choice: لله
  rationale: تفيد أن الله هو الساكن المقصود بهذا المسكن، وهي صياغة عربية طبيعية مع بقاء احتمال دلالة الإضافة حاضرًا.
- source_word: ἐν πνεύματι
  choice: في الروح
  rationale: السياق يرجح الإشارة إلى الروح القدس، مع إبقاء حرف الجر «في» حفاظًا على التداخل بين معنى المجال ومعنى الوساطة أو الفاعلية.
theological_decisions:
- issue: مرجع ἐν ᾧ
  choice: «فيه»، على أن المرجع الأرجح هو المسيح.
  alternative: «فيه»، على أن الضمير يعود إلى البناء كله.
  rationale: تتابع العبارة في الآيتين 21 و22 يجعل المسيح المرجع الأقرب والأرجح، لكن العربية لا تضطر إلى إلغاء احتمال عود الضمير إلى البناء.
- issue: دلالة ἐν πνεύματι
  choice: «في الروح»، في إشارة مرجحة إلى الروح القدس.
  alternative: «في روح» أو «بالروح».
  rationale: لغة السكن والهيكل في السياق ترجح الروح القدس، لكن العبارة اليونانية قد تصف مجال سكنى الله أو فاعلية الروح؛ لذلك أُبقي حرف الجر دون حصرها في معنى أداتي صرف.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «لتصيروا» لإظهار غاية البناء ونتيجته طبيعيًا، وحُفظت صورة البناء والعمل الجاري وصيغة المخاطب الجمع المؤكدة.
