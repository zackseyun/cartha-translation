lexical_decisions:
- source_word: ἐλθὼν
  choice: وجاء
  rationale: اسم فاعل ماضٍ يدل هنا على فعل تمهيدي أو مصاحب؛ وصيغة «وجاء» عربية طبيعية وتحافظ على صورة المجيء.
- source_word: εὐηγγελίσατο
  choice: فبشَّر
  rationale: الفعل يعني إعلان خبر سار. و«بشَّر بالسلام» يحافظ على دلالته الخبرية مع إبقاء «السلام» مفعولًا به كما في اليونانية.
- source_word: εἰρήνην
  choice: السلام
  rationale: المقابل المباشر، ويستوعب في السياق دلالات المصالحة والسلام الشامل من غير شرح زائد داخل النص.
- source_word: ὑμῖν
  choice: كم / أنتم
  rationale: نُقل ضمير المخاطبين أولًا متصلًا بالفعل في «بشَّركم»، ثم بُيّنت صفته بعبارة «أنتم الذين كنتم بعيدين» وفق تركيب يوناني طبيعي المعنى في العربية.
- source_word: τοῖς μακρὰν
  choice: الذين كنتم بعيدين
  rationale: يحافظ على استعارة البعد، مع مطابقة المخاطبين الذين يدل عليهم ὑμῖν؛ واستُعمل الماضي انسجامًا مع سياق اغترابهم السابق.
- source_word: τοῖς ἐγγύς
  choice: الذين كانوا قريبين
  rationale: يحافظ على المقابلة البلاغية بين البعيدين والقريبين دون إدخال هويتي الأمم واليهود في صلب النص.
- source_word: καὶ ... καὶ
  choice: و... وبـ
  rationale: حوفظ على تنسيق الفئتين وتكرار السلام، كما في بنية النص اليوناني.
theological_decisions:
- issue: هوية البعيدين والقريبين
  choice: إبقاء تعبيري «بعيدين» و«قريبين» في المتن، مع بيان الإحالة السياقية في الحاشية.
  alternative: التصريح في المتن بأن البعيدين هم الأمم والقريبين هم اليهود.
  rationale: السياق يشير إلى الأمم واليهود، لكن الآية نفسها تستخدم صورتي البعد والقرب؛ والحفاظ عليهما يصون بلاغة بولس ولا يحوّل التفسير إلى جزء من الترجمة.
- issue: دلالة εὐηγγελίσατο
  choice: «بشَّر... بالسلام»
  alternative: «أعلن السلام»
  rationale: «بشَّر» يحفظ دلالة إعلان الخبر السار الملازمة للفعل، بينما تمنع عبارة «بالسلام» من افتراض أن المقصود اسم تقني محدد للإنجيل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختير «بشَّر بالسلام» لصون الصلة اللفظية بالبشارة من غير إضافة «الخبر السار» إلى المتن، وأُبقي تقابل البعيدين والقريبين كما هو.
