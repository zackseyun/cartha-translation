translation:
  language: ar
  text: فيه يُضَمّ البناء كله[a] بعضه إلى بعض وينمو ليصير هيكلًا مقدسًا في الرب،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل بناء». تحتمل العبارة اليونانية المعنى التوزيعي أو معنى البناء الواحد بجملته؛ ويتبع المتن صورة الهيكل الموحَّد في السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: فيه
  rationale: يعود الضمير، بحسب السياق الأقرب، إلى المسيح المذكور بوصفه حجر الزاوية؛ و«فيه» تحفظ المرجع الشخصي وإيجاز العبارة اليونانية.
- source_word: πᾶσα οἰκοδομὴ
  choice: البناء كله
  rationale: تحتمل العبارة اليونانية معنى «كل بناء» أو المعنى الجمعي «البناء كله». اختير المعنى الجمعي لاتساقه مع صورة الهيكل الواحد في السياق، مع إثبات البديل في الحاشية.
- source_word: συναρμολογουμένη
  choice: يتناسق
  rationale: صيغة اسم المفعول المضارع تفيد عملية متواصلة تتآلف فيها أجزاء البناء وتُضم بإحكام. «يتناسق» عربية طبيعية تحافظ على الصورة المعمارية، وإن لم تُظهر المبني للمجهول صراحة.
- source_word: αὔξει
  choice: ينمو
  rationale: يحفظ الفعل صورة النمو المستمر التي يمزج بها بولس بين البناء والكائن الحي.
- source_word: εἰς
  choice: ليصير
  rationale: تُبرز العبارة الغاية أو النتيجة المقصودة من النمو، وهي صيرورة البناء هيكلًا مقدسًا.
- source_word: ναὸν ἅγιον
  choice: هيكلًا مقدسًا
  rationale: «هيكل» هو المقابل العربي الكتابي الطبيعي لـναός، الذي يدل على المقدس نفسه لا على مجمع المعبد الأوسع، و«مقدسًا» تنقل ἅγιον مباشرة.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحفظ الصياغة البولسية الموجزة واتساع دلالتها، سواء أفادت المجال أم الاتحاد، من غير تفسير زائد.
theological_decisions:
- issue: 'مرجع الضمير في ἐν ᾧ: أهو المسيح شخصيًا أم البناء أو حجر الزاوية بوصفه صورة غير شخصية؟'
  choice: 'مرجع شخصي إلى المسيح: «فيه»'
  alternative: 'مرجع غير شخصي: «فيه» عن البناء، أو «الذي فيه» بحسب إعادة الصياغة'
  rationale: المذكور في السياق السابق هو المسيح يسوع نفسه بوصفه حجر الزاوية، كما أن تكرار لغة «فيه» في هذا المقطع يرجح المرجع المسيحاني الشخصي، مع بقاء الصورة المعمارية حاضرة.
- issue: هل πᾶσα οἰκοδομὴ موزعة بمعنى «كل بناء» أم جمعية بمعنى «البناء كله»؟
  choice: 'المعنى الجمعي: «البناء كله»'
  alternative: 'المعنى التوزيعي: «كل بناء»'
  rationale: يشدد السياق على وحدة اليهود والأمم في إنسان جديد واحد وهيكل واحد؛ لذلك يلائم المعنى الجمعي السياق الأدبي واللاهوتي، لكن البنية اليونانية تسمح بالقراءة التوزيعية، فحُفظت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «يتناسق» لتجنب تركيب ثقيل مثل «وهو يُضم بعضه إلى بعض»، واستُخدم «ليصير» لإظهار قوة الغاية أو النتيجة في εἰς. وُضع رمز الحاشية مباشرة بعد العبارة التي تتناولها.
