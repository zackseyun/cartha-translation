  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: ar
  text: أنكم كنتم في ذلك الوقت بلا المسيح[a]، مُبعَدين عن جماعة إسرائيل، وغرباء عن عهود الوعد[b]، لا رجاء لكم ومن دون الله في العالم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «من دون المسيح». اللفظة اليونانية Χριστός لقب معناه «المسيح»، ويبرز هنا سياق إسرائيل والعهود.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا: «العهود المرتبطة بالوعد». يحفظ النص جمع «العهود» ومفرد «الوعد».'
    reason: lexical_alternative
  - marker: c
    text: 'أي: من دون الله الحق؛ ويمكن أن تعني اللفظة أيضًا «عديمي التقوى». ولا يلزم أن تدل هنا على الإلحاد بمعناه الفلسفي الحديث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: بلا المسيح
  rationale: يحفظ «المسيح» معنى اللقب اليوناني Χριστός في السياق اليهودي العهدي، كما أن «بلا» تعبّر طبيعيًا عن الانفصال والحرمان.
- source_word: ἀπηλλοτριωμένοι
  choice: مغتربين عن
  rationale: ينقل حالة الانفصال المستمرة التي يدل عليها اسم الفاعل التام المبني للمجهول، ويلائم المجال الاجتماعي والسياسي للعبارة التالية.
- source_word: πολιτείας τοῦ Ἰσραὴλ
  choice: جماعة إسرائيل
  rationale: تشير πολιτεία هنا إلى الكيان الجماعي المنظَّم لإسرائيل، لا إلى الجنسية الفردية وحدها؛ و«جماعة» واضحة للقارئ العربي من دون إيحاء بنظام سياسي حديث بعينه.
- source_word: ξένοι
  choice: غرباء عن
  rationale: ينقل كون المخاطبين خارج نطاق العهود اجتماعيًا وعهديًا، ويحافظ على التوازي مع «مغتربين».
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: عهود الوعد
  rationale: يحفظ جمع «عهود» ومفرد «الوعد»، ولا يحوّل تركيب الإضافة اليوناني إلى «وعود العهد» أو إلى جمع للوعد.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: لا رجاء لكم
  rationale: صياغة عربية طبيعية تحافظ على وصف حالتهم السابقة بأنها خالية من الرجاء.
- source_word: ἄθεοι
  choice: بلا إله
  rationale: يحفظ دلالة الحرمان أو الوجود من دون الله، بدل فرض المعنى الفلسفي الحديث «ملحدين» أو حصر اللفظة في معنى «فجّار».
- source_word: ἐν τῷ κόσμῳ
  choice: في العالم
  rationale: مقابل مباشر وطبيعي للعالم بوصفه مجال الوجود البشري.
- source_word: ὅτι ... ἦτε
  choice: أنكم كنتم
  rationale: يحافظ على تبعية الجملة لما قبلها وعلى زمن الحالة الماضية، بينما تؤدي عبارة «في ذلك الوقت» معنى التحديد الزمني.
theological_decisions:
- issue: ترجمة Χριστός في هذا السياق البولسي
  choice: المسيح
  alternative: المسيح/كريستوس بوصفه اسمًا منقولًا
  rationale: السياق المرتبط بإسرائيل والعهود يرجّح إبراز اللقب المسياني، و«المسيح» هو المقابل العربي الطبيعي الذي يؤدي معنى اللقب.
- issue: مدلول ἄθεοι
  choice: بلا إله
  alternative: ملحدين أو بلا الله
  rationale: «بلا إله» يحفظ الغموض الدلالي في اللفظة اليونانية ولا يستورد مفهوم الإلحاد الفلسفي الحديث، ولا يحسم في المتن صراحةً الإحالة إلى «الله الحق»؛ وتوضح الحاشية المقصود السياقي المحتمل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختيرت «جماعة إسرائيل» بدل مصطلحات قد توحي حصرًا بالمواطنة القانونية الحديثة، مع الحفاظ على البعد الجماعي. وُضعت علامات الحواشي [a] و[b] و[c] في مواضعها داخل المتن.
