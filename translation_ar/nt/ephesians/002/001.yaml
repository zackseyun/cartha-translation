  to: وَإِذْ كُنْتُمْ أَمْوَاتًا فِي تَعَدِّيَاتِكُمْ وَخَطَايَاكُمْ،
  rationale: استبدلتُ «زلات» بـ«تعديات» لتقوية مقابلة παραπτώματα في العربية الحديثة وتمييزها من «خطايا». وأعيدت صياغة البداية بـ«وإذ كنتم» لتكون طبيعية ولتعكس الوظيفة التمهيدية للمشاركة ὄντας والجملة غير المكتملة. واختيرت «في» بدل الباء للمحافظة على اتساع العلاقة التي يتيحها الداتيف اليوناني، من غير شرح عقائدي زائد.
