  verdict: revise
  source_fidelity: تعبير «أمواتًا» يحفظ الصورة المركزية في νεκρούς، وتبقى العبارة معلّقة بالفاصلة كما في البنية اليونانية التي لا يكتمل فيها الفعل الرئيس إلا لاحقًا. لكن «زلات» قد توحي في الاستعمال العربي الحديث بهفوات أو أخطاء طفيفة، وهي أضعف من παραπτώματα في هذا السياق.
  naturalness: «وأنتم كنتم» تركيب مثقل وغير طبيعي نسبيًا في العربية؛ فضمير المخاطب المنفصل مع «كنتم» يكرر الفاعل بلا حاجة. وصيغة «وإذ كنتم» أنسب للمشاركة ὄντας ولتعليق الجملة، مع بقاء النص مفهومًا.
  terminology: «تعدياتكم» مقابِل أوضح وأقوى لـπαραπτώματα، ويميزه من «خطاياكم» من غير ادعاء فرق اصطلاحي حاد لا يفرضه النص. وتعبير «بسبب» يقدّم العلاقة بوصفها سببية أكثر مما يلزم؛ أما «في» فيحافظ على سعة الداتيف اليوناني، التي يمكن أن تفهم مجاليًا أو على صلة وثيقة بالموت.
