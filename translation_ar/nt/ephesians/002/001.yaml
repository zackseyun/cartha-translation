  - severity: low
    issue: تكرار الضمير في «وأنتم كنتم»
    rationale: الصياغة مفهومة، لكنها أثقل من اللازم؛ «وإذ كنتم» تمثل المشاركة اليونانية وتخدم اتصال الآية بما بعدها.
  - severity: low
