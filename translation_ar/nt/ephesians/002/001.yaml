  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: أمواتًا
  rationale: يحافظ على صورة الموت الصريحة في اليونانية، وهي محورية في سياق المقابلة مع الإحياء في الآية التالية.
- source_word: παραπτώμασιν
  choice: زلّاتكم
  rationale: ينقل معنى التجاوزات والانحرافات مع تمييز معقول عن اللفظة التالية «خطاياكم».
- source_word: ἁμαρτίαις
  choice: خطاياكم
  rationale: المقابل العربي الطبيعي والمألوف للخطايا، مع الحفاظ على الجمع.
- source_word: τοῖς... καὶ ταῖς... ὑμῶν
  choice: بزلّاتكم وخطاياكم
  rationale: الباء تعبّر طبيعيًا عن المجال أو السبب المرتبط بالموت، وضمير المخاطبين موزع على الاسمين في العربية للوضوح.
- source_word: ὄντας
  choice: كنتم
  rationale: صيغت العبارة بوصفها خبرًا تامًا مفهومًا بالعربية، توافقًا مع كون الجملة اليونانية معلّقة نحويًا حتى الفعل الرئيس في الآية 5.
theological_decisions:
- issue: دلالة الموت
  choice: الإبقاء على «أمواتًا» بلا تفسير إضافي
  alternative: «موتى روحيًا»
  rationale: النص يقول «أمواتًا» فقط؛ وإضافة «روحيًا» تفسّر الاستعارة وتحسم مداها بما يتجاوز العبارة الأصلية.
- issue: العلاقة النحوية بين الموت والزلّات والخطايا
  choice: «بزلّاتكم وخطاياكم»
  alternative: «في زلّاتكم وخطاياكم»
  rationale: حالة المجرور اليونانية تحتمل صلة سببية أو مجالية؛ الباء عربية طبيعية وتحافظ على الصلة الوثيقة دون شرح عقائدي زائد.
- issue: الجملة المعلّقة في اليونانية
  choice: صياغتها «وأنتم كنتم...» مع إبقاء الفاصلة
  alternative: «وإذ كنتم...» انتظارًا لاكتمال الجملة في الآية 5
  rationale: تقدّم ترجمة مفهومة على مستوى الآية المنفردة، مع الفاصلة التي تشير إلى استمرار السياق، من غير استيراد الفعل الرئيس قبل وروده.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت صورة الموت، وتميّزت «الزلّات» عن «الخطايا»، ولم تُضف أوصاف تفسيرية غير موجودة في الأصل.
