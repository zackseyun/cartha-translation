base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: ar
  text: أَمَّا الآنَ، فَفِي الْمَسِيحِ يَسُوعَ أَنْتُمُ الَّذِينَ كُنْتُمْ قَبْلًا بَعِيدِينَ، صِرْتُمْ قَرِيبِينَ[a] بِدَمِ الْمَسِيحِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قُرِّبْتُمْ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بِوَاسِطَةِ دَمِ الْمَسِيحِ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أَمَّا الآنَ
  rationale: تنقل التحول المقابل للحالة السابقة مع إبراز الزمن الحاضر، وهي صياغة عربية طبيعية وفصيحة.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: فَفِي الْمَسِيحِ يَسُوعَ
  rationale: تحافظ «في» على لغة بولس الدالة على الاتحاد أو الانتماء، وتترجم Χριστός بوصفه لقبًا إلى «المسيح».
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: أَنْتُمُ الَّذِينَ كُنْتُمْ قَبْلًا
  rationale: صياغة عربية واضحة تحفظ ضمير المخاطبين والحالة الماضية التي يدل عليها ποτε مع اسم الفاعل.
- source_word: μακρὰν
  choice: بَعِيدِينَ
  rationale: تنقل صورة البعد مباشرة، مع إبقاء دلالتها العلاقية والعهدية مفتوحة بحسب السياق.
- source_word: ἐγενήθητε ἐγγὺς
  choice: صِرْتُمْ قَرِيبِينَ
  rationale: تعكس معنى γίνομαι المباشر، «صار»، من غير إدخال فاعل ضمني غير مصرح به في النص.
- source_word: ἐν τῷ αἵματι
  choice: بِدَمِ
  rationale: الباء العربية تعبّر طبيعيًا عن الوسيلة هنا، مع إمكان فهم العبارة بمعنى «بواسطة الدم».
- source_word: τοῦ Χριστοῦ
  choice: الْمَسِيحِ
  rationale: تترجم Χριστός كلقب ذي معنى بدل نقله صوتيًا.
theological_decisions:
- issue: ترجمة Χριστός
  choice: الْمَسِيح
  alternative: كريستوس / المسيح بوصفه اسمًا ثابتًا
  rationale: اللفظ اليوناني يؤدي وظيفة اللقب هنا، وترجمته «المسيح» تحفظ معناه اللاهوتي المعروف عربيًا.
- issue: قوة ἐγενήθητε ἐγγὺς
  choice: صِرْتُمْ قَرِيبِينَ
  alternative: قُرِّبْتُمْ
  rationale: الصياغة المختارة تحافظ على الفعل γίνομαι ولا تحسم في العربية فاعلًا إلهيًا ضمنيًا، مع أن المبني للمجهول ممكن سياقيًا.
- issue: دلالة ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: بِدَمِ الْمَسِيحِ
  alternative: فِي دَمِ الْمَسِيحِ / بِوَاسِطَةِ دَمِ الْمَسِيحِ
  rationale: تؤدي الباء معنى الوسيلة بإيجاز من غير استيراد نظرية كفارية مفصلة لا يصرح بها النص، وتظل الدلالة التصويرية للدم حاضرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أما الآن» لإظهار المقابلة السياقية، و«صرتم قريبين» للمحافظة على البنية اليونانية من دون الإفراط في تفسير الفاعلية. وُضعت علامتا الحاشيتين بعد العبارة التي تتصلان بها في ختام الآية.
