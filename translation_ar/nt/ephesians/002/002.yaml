id: EPH.2.2
reference: Ephesians 2:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: ar
  text: الَّتِي سَلَكْتُمْ فِيهَا قَبْلًا، وَفْقَ دَهْرِ هَذَا الْعَالَمِ[a]، وَفْقَ رَئِيسِ سُلْطَانِ الْهَوَاءِ[b]، الرُّوحِ الَّذِي يَعْمَلُ الآنَ فِي أَبْنَاءِ الْعِصْيَانِ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «وَفْقَ مَسَارِ هَذَا الْعَالَمِ». يستعمل اليوناني كلمة «دَهْر» (αἰών)، فتبرز عصر العالم الحاضر أو نمطه السائد.'
    reason: lexical_alternative
  - marker: b
    text: يعكس تعبير «الهواء» التصور الكوني القديم للمجال المرتبط بالقوى الروحية المعادية.
    reason: cultural_note
  - marker: c
    text: «أبناء العصيان» تعبير سامي معناه أناس يتصفون بالعصيان.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: الَّتِي ... فِيهَا
  rationale: تعود أداة الوصل إلى «الزلات والخطايا» في الآية السابقة، وتحفظ الصياغة معنى الظرفية في الأصل اليوناني.
- source_word: ποτε
  choice: قَبْلًا
  rationale: تدل بوضوح وإيجاز على نمط حياتهم السابق.
- source_word: περιεπατήσατε
  choice: سَلَكْتُمْ
  rationale: يحفظ الفعل الاستعارة الكتابية التي تجعل السلوك مشيًا، وهو تعبير عربي فصيح ومفهوم عن طريقة العيش.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: وَفْقَ دَهْرِ هَذَا الْعَالَمِ
  rationale: يميّز «دَهْر» (αἰών) من «العالَم» (κόσμος)، ويحفظ معنى موافقة الإنسان للعصر أو النمط السائد فيه.
- source_word: ἄρχοντα
  choice: رَئِيسِ
  rationale: ينقل معنى صاحب السيادة أو الحكم بلغة عربية واضحة، من غير الإيحاء بلقب ملكي بشري محدد.
- source_word: τῆς ἐξουσίας
  choice: سُلْطَانِ
  rationale: «سلطان» يؤدي معنى النفوذ والسلطة المخوَّلة، ويلائم تركيب الإضافة في العربية.
- source_word: τοῦ ἀέρος
  choice: الْهَوَاءِ
  rationale: ترجمة مباشرة تحفظ الصورة الكونية القديمة بدل تفسيرها داخل المتن.
- source_word: τοῦ πνεύματος
  choice: الرُّوحِ
  rationale: السياق يدل على روح معادٍ لا على الروح القدس، وتبقي الصياغة صلته بما سبق من غير تحديد ماهيته أكثر مما يحدده النص.
- source_word: τοῦ νῦν ἐνεργοῦντος
  choice: الَّذِي يَعْمَلُ الآنَ
  rationale: ينقل بوضوح الفعل المستمر في اسم الفاعل اليوناني وصيغته الحاضرة.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: فِي أَبْنَاءِ الْعِصْيَانِ
  rationale: يحفظ التعبير السامي وصيغة «الأبناء» في الأصل، بدل اختزاله إلى وصف مجرد للعصاة.
theological_decisions:
- issue: صلة «الروح الذي يعمل الآن» بـ«رئيس سلطان الهواء»
  choice: الإبقاء على «الروح» تابعًا لما قبله في تركيب يمكن فهمه على أنه وصف أو بدل، من غير إضافة تفسير أنطولوجي.
  alternative: اعتباره اسمًا ثانيًا للشيطان نفسه، أو قوة روحية غير شخصية خاضعة له.
  rationale: تسمح سلسلة المضافات اليونانية بعلاقة بيانية أو بدلية، لكن النص لا يحسم بالتفصيل هل «الروح» هو الرئيس نفسه أم القوة المرتبطة بسلطانه؛ لذلك تحافظ العربية على الصلة والتوتر معًا.
- issue: ترجمة υἱοῖς بصيغة المذكر
  choice: أَبْنَاءِ الْعِصْيَانِ
  alternative: أولاد العصيان؛ العصاة؛ الذين لا يطيعون
  rationale: يحفظ الاختيار الصورة السامية والصيغة النحوية المذكرة في المصدر، وتوضح الحاشية أن المقصود أناس يتصفون بالعصيان.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت استعارة «السلوك»، والتمييز بين «الدهر» و«العالم»، والتعبير السامي «أبناء العصيان»، مع تجنب الألفاظ المذهبية أو الشروح العقائدية داخل المتن.
