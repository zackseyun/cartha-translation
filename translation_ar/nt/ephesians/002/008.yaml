  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: ar
  text: فَبِالنِّعْمَةِ قَدْ خُلِّصْتُمْ بِالإِيمَانِ[a]، وَهَذَا[b] لَيْسَ مِنْكُمْ؛ إِنَّهُ عَطِيَّةُ اللهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يدل اللفظ المترجم «الإيمان» أيضًا على «الثقة»، وقد يعني في سياقات أخرى «الأمانة».
    reason: lexical_alternative
  - marker: b
    text: يرجح أن يشير «هذا» إلى حقيقة الخلاص بالنعمة بواسطة الإيمان كلها، لا إلى «الإيمان» وحده؛ لأن اسم الإشارة في اليونانية محايد، في حين أن كلمتي «النعمة» و«الإيمان» مؤنثتان.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: بِالنِّعْمَةِ
  rationale: تنقل «النعمة» معنى إحسان الله وفضله المجاني في الاستعمال البولسي، مع الحفاظ على المصطلح الكتابي المألوف من غير توسع تفسيري.
- source_word: ἐστε σεσῳσμένοι
  choice: قَدْ خُلِّصْتُمْ
  rationale: تفيد الصيغة اليونانية فعل خلاص تمّ وتبقى نتيجته قائمة. وتؤدي «قد خُلِّصتم» تمام الفعل، فيما يوضح السياق أثره المستمر.
- source_word: διὰ πίστεως
  choice: بِالإِيمَانِ
  rationale: الباء العربية تؤدي معنى الوسيلة الذي تحمله διά مع المضاف إليه، و«الإيمان» المقابل الكتابي الطبيعي لـ πίστις في هذا السياق.
- source_word: τοῦτο
  choice: هَذَا
  rationale: يحافظ اسم الإشارة المحايد في المعنى على إيجاز الأصل، ويرجح أن يعود إلى حقيقة الخلاص السابقة كلها، لا إلى «النعمة» أو «الإيمان» وحدهما.
- source_word: οὐκ ἐξ ὑμῶν
  choice: لَيْسَ مِنْكُمْ
  rationale: تعبّر «منكم» بوضوح عن المصدر أو المنشأ، وتنفي أن تكون حقيقة الخلاص المذكورة ناشئة من المخاطَبين.
- source_word: θεοῦ τὸ δῶρον
  choice: بَلْ هُوَ عَطِيَّةُ اللهِ
  rationale: «عطية الله» تنقل الإضافة اليونانية بوضوح، وإدخال «بل هو» يجعل العبارة العربية المكتملة طبيعية ويظهر المقابلة التي يفهمها السياق.
theological_decisions:
- issue: مرجع اسم الإشارة τοῦτο وصلته بالنعمة والإيمان والخلاص
  choice: 'يُفهم «هذا» على أنه يشير إلى حقيقة الخلاص السابقة كلها: الخلاص بالنعمة بواسطة الإيمان.'
  alternative: قد يُفهم على أنه يشير إلى الإيمان وحده بوصفه عطية الله، أو إلى النعمة وحدها.
  rationale: اسم الإشارة في اليونانية محايد، بينما «النعمة» و«الإيمان» مؤنثان في اليونانية؛ لذلك فالأرجح أن الإشارة تعود إلى مضمون العبارة السابقة كله. أبقى النص العربي اسم الإشارة موجزًا، وتوضح الحاشية الاحتمال من غير فرض نتيجة مذهبية تتجاوز دلالة النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقرة. استُعمل المبني للمجهول في «خُلِّصتم» حفظًا لتركيب الأصل، مع «قد» للدلالة على تمام الفعل. ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
