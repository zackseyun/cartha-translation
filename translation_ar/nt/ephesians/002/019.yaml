review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: الاستنتاج، وانتقال المخاطَبين من وضع الغربة وعدم الانتماء إلى المواطنة المشتركة والانتماء إلى بيت الله، كلها ظاهرة. لكن «نزلاء مقيمين» ليست المقابل العربي الأكثر سلاسة أو تحديدًا لـ πάροικοι في هذا السياق المدني؛ إذ قد توحي «نزلاء» بالضيوف. «مقيمين أجانب» أوضح في الدلالة على الإقامة دون الانتماء المدني الكامل.'
  naturalness: التركيب سليم إجمالًا وفصيح. تُحسَّن الطلاقة باستبدال «نزلاء مقيمين» بـ«مقيمين أجانب». و«بل أنتم مواطنون مع القديسين، ومن أهل بيت الله» أسلوب عربي طبيعي ويحفظ التوازي في اليونانية.
  terminology: «القديسين» يحافظ على المصطلح الكتابي وعلى عدم حسم مرجعه تفسيريًا. «أهل بيت الله» مقابل موفق وطبيعي لـ οἰκεῖοι τοῦ θεοῦ. وتوضيح الحاشية ينبغي أن يصاغ بلا إيحاء بأن المعنى الكتابي يُعرَّف من خلال تقليد كنسي بعينه.
  issues:
  - severity: medium
    issue: «نزلاء مقيمين» ترجمة غير مألوفة لـ πάροικοι في العربية المعاصرة.
    rationale: «نزيل» يُستعمل غالبًا للضيف أو المقيم في فندق أو مؤسسة، فلا ينقل بوضوح وضع المقيم الأجنبي غير المتمتع بكامل الانتماء المدني. «مقيمون أجانب» أوضح وأقرب إلى التمييز المقصود عن «غرباء».
  - severity: low
    issue: صياغة الحاشية «فئة خاصة أُعلن تقديسها رسميًا» تحتاج إلى ضبط أسلوبي.
    rationale: إعادة الصياغة إلى «فئة خاصة من الأشخاص الذين أُعلنت قداستهم رسميًا» أفصح، وتبقي الملاحظة تعريفية دون تقرير تفسيري إضافي.
  revised_text: فإذًا، لستم بعدُ غرباءَ ولا مقيمين أجانب، بل أنتم مواطنون مع القديسين[a]، ومن أهل بيت الله.
