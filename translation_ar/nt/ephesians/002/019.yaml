lexical_decisions:
- source_word: ἄρα οὖν
  choice: فإذًا
  rationale: تنقل اجتماع أداتي الاستنتاج وتربط النتيجة بالحجة السابقة بعبارة عربية واضحة وموجزة.
- source_word: οὐκέτι
  choice: لستم بعدُ
  rationale: تعبّر طبيعيًا عن انتهاء الحالة السابقة وتغيّر مكانة المخاطَبين.
- source_word: ξένοι
  choice: غرباء
  rationale: تحافظ على معنى عدم الانتماء، وتُمهّد للمقابلة مع الانتماء إلى بيت الله.
- source_word: πάροικοι
  choice: نزلاء مقيمين
  rationale: تدل على أناس يقيمون في بلد أو موضع من دون أن يتمتعوا بحقوق المواطنة الكاملة، وتُميّز اللفظة من «غرباء».
- source_word: συμπολῖται
  choice: مواطنون مع
  rationale: تنقل معنى المواطنة المشتركة الذي يتضمنه اللفظ المركب، بصياغة عربية مباشرة.
- source_word: τῶν ἁγίων
  choice: القديسين
  rationale: تحافظ على المصطلح الكتابي وعلى سعة مرجعه بدل حصره تفسيريًا في فئة بعينها.
- source_word: οἰκεῖοι
  choice: من أهل بيت
  rationale: تعبّر طبيعيًا عن المنتمين إلى الأسرة أو البيت، وتحفظ الاستعارة العائلية في النص.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: تُصاغ الإضافة اليونانية طبيعيًا في العربية بتركيب «بيت الله».
theological_decisions:
- issue: مرجع «القديسين» (τῶν ἁγίων)
  choice: الإبقاء على «القديسين» في المتن مع توضيح معناها العام في الحاشية
  alternative: تعيينهم في المتن بأنهم جميع المؤمنين، أو المؤمنون اليهود تحديدًا، أو الملائكة
  rationale: السياق يتحدث عن إدماج المخاطَبين في شعب الله، لكن اللفظ نفسه لا يضيّق المرجع إلى إحدى هذه الفئات؛ لذلك تُحفظ سعته والتوتر التفسيري فيه.
- issue: دلالة المضاف إليه في συμπολῖται τῶν ἁγίων
  choice: مواطنون مع القديسين
  alternative: مواطنو القديسين
  rationale: المعنى الأرجح هو الاشتراك معهم في المواطنة، وهذه الصياغة العربية تمنع إيحاء الملكية أو التبعية مع إبقاء العلاقة التي يدل عليها التركيب.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «نزلاء مقيمين» لإبراز الوضع الاجتماعي والقانوني لـπάροικοι، و«أهل بيت الله» لصون الاستعارة المنزلية بصياغة عربية مألوفة.
