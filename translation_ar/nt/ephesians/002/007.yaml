id: EPH.2.7
reference: Ephesians 2:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: ar
  text: لكي يُظهِر في الدهور الآتية غنى نعمته الفائق، بلطفه نحونا في المسيح يسوع[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غنى نعمته الذي لا يُقاس».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في لطفه نحونا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المتفرعة مما سبق، بصياغة عربية طبيعية.
- source_word: ἐνδείξηται
  choice: يُظهِر
  rationale: تنقل معنى الإبراز والإظهار الواضح، وتلائم صيغة الغائب العائدة إلى الله.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: في الدهور الآتية
  rationale: تحفظ جمع αἰῶσιν ودلالة الأزمنة المقبلة بعبارة عربية فصيحة ومألوفة.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: غنى نعمته الفائق
  rationale: «الفائق» ينقل معنى التجاوز والتفوق في ὑπερβάλλον، و«غنى» ملائم للمفرد الجمعي πλοῦτος؛ وقد روعي في العربية ترتيب الإضافة الطبيعي.
- source_word: τῆς χάριτος αὐτοῦ
  choice: نعمته
  rationale: «النعمة» المقابل الراسخ والدقيق لـχάρις في هذا السياق البولسي.
- source_word: ἐν χρηστότητι
  choice: بلطفه
  rationale: تفيد الباء الكيفية أو الوسيلة الممكنة في ἐν، و«اللطف» ينقل إحسان χρηστότης ورقته دون حصره في مجرد الصلاح.
- source_word: ἐφ’ ἡμᾶς
  choice: نحونا
  rationale: تحفظ اتجاه الإحسان إلينا الذي تدل عليه ἐπί مع النصب.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» ترجمة عربية لقب Χριστός، وتحفظ العبارة لغة الاتحاد أو المجال المميزة عند بولس.
theological_decisions:
- issue: دلالة ἐν في ἐν χρηστότητι
  choice: بلطفه
  alternative: في لطفه
  rationale: قد تدل العبارة على الكيفية أو المجال؛ اختيرت الباء لسلاسة العربية مع إبقاء البديل في الحاشية وعدم حسم الدلالة أكثر مما يسمح به الأصل.
- issue: ترجمة Χριστός كلقب
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: حُفظ ترتيب الأصل «المسيح يسوع»، وترجمت Χριστός بوصفها لقبًا لا اسم عائلة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صورة «غنى النعمة» وجمع «الدهور»، مع تجنب التفسير الطائفي أو توسيع معنى النص.
