  terminology: «الرحمة» مقابِل راسخ لـἔλεος و«المحبة» مقابِل مناسب لـἀγάπη في هذا السياق. و«الغنيّ بالرحمة» تعبير عربي واضح يحفظ صورة الوفرة في الرحمة. الحاشية تبيّن الحرفية «في الرحمة» من غير أن تستبدلها في المتن بصياغة غامضة.
