lexical_decisions:
- source_word: δὲ
  choice: لكنَّ
  rationale: تفيد مقابلة قوية مع وصف حال البشر في السياق السابق، وتحافظ على قوة الانتقال الاستدراكي.
- source_word: πλούσιος ὢν
  choice: إذ هو غنيٌّ
  rationale: تحافظ على الصيغة الوصفية في اسم الفاعل، مع إمكان فهمها سببيةً في هذا السياق من غير حسم زائد.
- source_word: ἐν ἐλέει
  choice: بالرحمة
  rationale: تعبير عربي طبيعي ينقل وفرة الرحمة ويحافظ على تمييز الرحمة من المحبة.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: وبسبب محبته العظيمة
  rationale: διά مع النصب تفيد السبب، و«العظيمة» صياغة عربية طبيعية لقوة πολλή مع الاسم المجرّد.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: التي أحبَّنا بها
  rationale: تحافظ على جملة الصلة وعلى التكرار الاشتقاقي المقصود بين «محبته» و«أحبنا».
theological_decisions:
- issue: التكرار الاشتقاقي في ἀγάπην ... ἠγάπησεν
  choice: محبته العظيمة التي أحبَّنا بها
  alternative: محبته العظيمة لنا
  rationale: يحفظ التوكيد البلاغي في اليونانية ولا يختزل الاسم والفعل في عبارة واحدة.
- issue: العلاقة بين الرحمة والمحبة
  choice: إبقاء «الرحمة» و«المحبة» مفهومين متميزين ومترابطين
  alternative: دمجهما في تعبير مثل «محبته الرحيمة»
  rationale: يعرض النص اليوناني الرحمة والمحبة على نحو مترابط من غير أن يجعلهما مفهومًا واحدًا.
- issue: دلالة اسم الفاعل ὢν
  choice: إذ هو غنيٌّ
  alternative: لأنه غنيٌّ
  rationale: تحفظ الصياغة الوصفية وتتيح الدلالة السببية التي يقتضيها السياق، من غير تحويلها صراحةً إلى تعليل محض.
