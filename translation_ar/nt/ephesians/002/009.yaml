  yaml_path: translation/nt/ephesians/002/009.yaml
  text: not from works[a], so that no one may boast.
translation:
  language: ar
  text: لَيْسَ مِنْ أَعْمَالٍ، لِئَلَّا يَفْتَخِرَ أَحَدٌ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: لَيْسَ مِنْ أَعْمَالٍ
  rationale: ينقل النفي مع دلالة ἐξ الأساسية على المصدر أو المنشأ. واختيار «مِنْ» أقرب إلى صياغة اليونانية من تحويلها إلى تعبير سببي أو وسائلي.
- source_word: ἔργων
  choice: أَعْمَالٍ
  rationale: «أعمال» المقابل العربي الطبيعي العام، من غير تقييده بأعمال الشريعة أو الأعمال الصالحة، إذ لا يرد هذا التحديد في النص.
- source_word: ἵνα μή
  choice: لِئَلَّا
  rationale: تؤدي غرض الجملة المنفية بعبارة عربية فصيحة موجزة وطبيعية.
- source_word: τις
  choice: أَحَدٌ
  rationale: ينقل الضمير غير المحدد بلا تقييد جنسي، ويتلاءم طبيعيًا مع النفي في «لئلا يفتخر أحد».
- source_word: καυχήσηται
  choice: يَفْتَخِرَ
  rationale: ينقل معنى التباهي أو الافتخار، ويحفظ صيغة الغرض التابعة لـἵνα μή من خلال الفعل المنصوب بعد «لئلا».
theological_decisions:
- issue: مدلول «الأعمال» في قول بولس
  choice: الإبقاء على اللفظ العام «أعمال» من غير تقييد
  alternative: أعمال الشريعة؛ الجهد البشري؛ الأعمال الصالحة
  rationale: اليونانية تقول ἔργων فقط. وإضافة قيد بعينه تحسم تفسيرًا لا يحسمه هذا التركيب الموجز نفسه.
- issue: دلالة ἐξ في العبارة
  choice: ترجمتها بـ«مِنْ» للدلالة الأساسية على المصدر أو المنشأ
  alternative: «بسبب أعمال» أو «بأعمال» للدلالة الوسائلية
  rationale: يحفظ هذا الاختيار بنية الأصل وتوترها الدلالي، من غير إنكار إمكان فهم ملمح وسائلي في السياق.
translation_notes:
  register: عربية فصحى حديثة، موجزة وكريمة النبرة، مع الإبقاء على تركيب الآية بوصفه تابعًا نحويًا وفكريًا للسياق السابق. لا توجد علامة حاشية لأن الصياغة العربية «مِنْ أَعْمَالٍ» تنقل البديل الحرفي نفسه بوضوح.
