source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: ar
  text: ولكي يصالح كليهما مع الله في جسد واحد بواسطة الصليب، إذ أمات به العداوة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعود عبارة «به» في الأصل إلى الصليب، وهو الأرجح؛ ويحتمل نحويًا أن تكون «فيه» عائدة إلى «الجسد الواحد».
    reason: لإظهار غموض مرجع الضمير اليوناني ἐν αὐτῷ وعدم حسمه بصمت.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: يصالح
  rationale: 'ينقل معنى استعادة العلاقة والمصالحة، وتدل صيغة السياق على الغاية: «ولكي يصالح».'
- source_word: τοὺς ἀμφοτέρους
  choice: كليهما
  rationale: يحافظ على الإشارة إلى الفريقين المذكورين في السياق، اليهود والأمم، من غير إدخال التفسير في متن الآية.
- source_word: ἐν ἑνὶ σώματι
  choice: في جسد واحد
  rationale: ترجمة مباشرة تحفظ صورة الجسد ووحدته، من غير حسم ما إذا كان التركيز على جسد المسيح أو الجماعة المتحدة فيه.
- source_word: διὰ τοῦ σταυροῦ
  choice: بواسطة الصليب
  rationale: يعبر بوضوح عن الوسيلة التي تمت بها المصالحة، مع إبقاء لفظ «الصليب» المحوري.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: إذ أمات ... العداوة
  rationale: يحفظ الاستعارة القوية في الأصل، حيث تُصوَّر العداوة كشيء جرى قتله.
- source_word: ἐν αὐτῷ
  choice: به
  rationale: يحافظ على الإحالة الأرجح إلى الصليب وعلى معنى الوسيلة، مع التنبيه في الحاشية إلى إمكان الإحالة النحوية الأخرى.
theological_decisions:
- issue: مرجع «جسد واحد»
  choice: إبقاء العبارة «في جسد واحد» بلا تفسير إضافي
  alternative: في جسده الواحد / في جماعة واحدة هي جسده
  rationale: الأصل لا يضيف ضميرًا صريحًا ولا يشرح الصورة هنا؛ لذلك ينبغي حفظ كثافتها ولاهوتها من دون حسم تفسيري زائد.
- issue: مرجع ἐν αὐτῷ في ختام الآية
  choice: «به» أي بالصليب، وفق أقرب مرجع وصياغة طبقة المراجعة الإنجليزية
  alternative: «فيه» أي في الجسد الواحد، أو «في ذاته» أي في المسيح
  rationale: الإحالة إلى الصليب هي الأرجح سياقيًا، لكنها ليست خالية تمامًا من الاحتمال؛ لذلك ذُكر البديل في الحاشية بدل إخفائه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «بواسطة الصليب» لتجنب توالي عبارتي «بالصليب» و«به» مع إبقاء علاقة الوسيلة ظاهرة، وحُفظت استعارة إماتة العداوة.
