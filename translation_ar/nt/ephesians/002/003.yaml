source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: ar
  text: ومن بينهم[b] كنا نحن جميعًا أيضًا نسلك قبلاً في شهوات جسدنا، منفذين إرادات الجسد والأفكار، وكنا بالطبيعة أبناء الغضب[a]، كما كان الآخرون أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أبناء الغضب». وقد تُفهم العبارة أيضًا بمعنى «مستحقين للغضب» أو «موضع الغضب»، لكن المتن يحافظ على صورة الأصل.'
    reason: lexical_alternative
  - marker: b
    text: أو «فيها». قد يعود الضمير اليوناني إلى الأشخاص المذكورين في السياق، أو إلى المجال الذي وُصف سابقًا؛ ويرجح السياق المرجع الشخصي.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν οἷς
  choice: فيما بينهم
  rationale: يُفهم الضمير في السياق على أنه عائد إلى «أبناء المعصية» المذكورين قبلاً، مع بقاء إمكان عوده إلى المجال أو السلوك؛ والصياغة العربية تُظهر المرجع الشخصي دون مبالغة في التفسير.
- source_word: ἀνεστράφημέν
  choice: نسلك
  rationale: الفعل يدل على التصرف أو قضاء الحياة على نحو معين. «نسلك» تعبير عربي كتابي واضح يصف نهج الحياة، لا مجرد الوجود.
- source_word: ποτε
  choice: قبلاً
  rationale: تدل على الحالة السابقة، وتأتي «قبلاً» طبيعية وموجزة في هذا السياق.
- source_word: ἐπιθυμίαις
  choice: شهوات
  rationale: «شهوات» تحمل هنا معنى الرغبات الجامحة أو المنحرفة، ولا تحصر الدلالة في الرغبة الجنسية.
- source_word: σάρξ
  choice: الجسد
  rationale: يحافظ «الجسد» على مصطلح بولس وعلى سعته الأنثروبولوجية والأخلاقية، بدل تفسيره سلفًا بأنه «الطبيعة الخاطئة».
- source_word: ποιοῦντες τὰ θελήματα
  choice: عاملين ما يريده
  rationale: تنقل الصياغة ممارسة إرادات الجسد والأفكار بلغة عربية مفهومة، وتحافظ على التمييز عن «الشهوات» السابقة.
- source_word: διανοιῶν
  choice: الأفكار
  rationale: صيغة الجمع تشير إلى الأفكار أو النزعات الذهنية؛ و«الأفكار» موجزة وتحفظ الجمع.
- source_word: τέκνα ὀργῆς
  choice: أبناء الغضب
  rationale: تحافظ العبارة على الصورة السامية في اليونانية ولا تحسمها تفسيرًا إلى «موضع غضب» أو «مستحقين للغضب».
- source_word: φύσει
  choice: بالطبيعة
  rationale: تنقل اللفظ مباشرة وتحفظ التوتر اللاهوتي بشأن الحالة الفطرية من غير قصرها على الولادة البيولوجية.
- source_word: οἱ λοιποί
  choice: سائر الناس
  rationale: توضح المقارنة ببقية البشر بعبارة عربية طبيعية، والسياق يبيّن أن المقصود الآخرون خارج الجماعة المخاطبة.
theological_decisions:
- issue: دلالة σάρξ في السياق الأخلاقي البولسي
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: «الجسد» يحفظ لفظ بولس والتوتر المقصود فيه، بينما «الطبيعة الخاطئة» تفسير لاهوتي أضيق من دلالة الأصل.
- issue: دلالة τέκνα φύσει ὀργῆς
  choice: كنا بالطبيعة أبناء الغضب
  alternative: كنا بالطبيعة موضع الغضب
  rationale: تحفظ الصياغة استعارة الأصل ولا تحسم هل التشديد على الصفة أو الحالة أو استحقاق الدينونة.
- issue: مرجع ἐν οἷς
  choice: فيما بينهم
  alternative: فيها
  rationale: السياق القريب يرجح العودة إلى «أبناء المعصية»، لكن الضمير اليوناني يحتمل الإشارة إلى المجال السابق؛ لذلك أُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «نسلك» للدلالة على نهج الحياة، وحُفظت عبارتا «الجسد» و«أبناء الغضب» لما فيهما من توتر لاهوتي أصيل. وُضعت علامة الحاشية في المتن كما يلزم.
