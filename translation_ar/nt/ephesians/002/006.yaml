  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγειρεν
  choice: أقامنا معه
  rationale: ينقل معنى الإقامة أو الإنهاض، ويُظهر دلالة السابقة συν- على مشاركة المؤمنين للمسيح في الفعل. والضمير «نا» مستفاد من سياق الجملة السابقة.
- source_word: συνεκάθισεν
  choice: أجلسنا معه
  rationale: يحافظ على معنى الإجلاس مع شخص آخر، من غير إضافة معنى التتويج أو التمليك الذي قد يُفهم من السياق لكنه غير مصرح به في الفعل نفسه.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: في العوالم السماوية
  rationale: الصفة اليونانية المجموعة مستعملة استعمال الاسم وتشير إلى الحيز أو المجال السماوي. و«العوالم السماوية» واضحة في العربية المعاصرة، مع إثبات البديل الأقرب إلى البنية الحرفية في الحاشية.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» تنقل اللقب Χριστός بمعناه المسياني، وترتيب «المسيح يسوع» يتبع ترتيب الأصل اليوناني مع بقاء العبارة عربية مفهومة.
- source_word: καὶ
  choice: و
  rationale: تُبقي عطف الفعلين وتتابع العملين الإلهيين كما في الأصل.
theological_decisions:
- issue: دلالة الاتحاد بالمسيح في الفعلين المركبين
  choice: التصريح بعبارة «معه» بعد كل فعل
  alternative: أقامنا وأجلسنا، مع ترك معنى المشاركة ضمنيًا
  rationale: السابقة συν- في كلا الفعلين تدل على المشاركة مع المسيح؛ والتصريح بـ«معه» ينقل هذه الدلالة بوضوح من غير زيادة لاهوتية على النص.
- issue: هل Χριστός لقب أم اسم ثابت
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحفظ هذا الاختيار وظيفة «المسيح» بوصفه لقبًا، ويتبع ترتيب Χριστῷ Ἰησοῦ في الأصل من غير فرض تفسير مذهبي.
- issue: طبيعة ἐπουρανίοις المكانية
  choice: العوالم السماوية
  alternative: المواضع السماوية
  rationale: اللفظ اليوناني صفة اسمية قد تدل على المجال السماوي من غير تحديد ماهية تلك المواضع؛ لذلك تُحفظ سعة الدلالة ويُذكر البديل المكاني في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. أُبقي تكرار «معه» لإظهار دلالة الفعلين اليونانيين المركبين، واستُعملت «المسيح» بوصفها ترجمة للقب Χριστός.
