  source_fidelity: 'المسودة تنقل العناصر الرئيسة للنص اليوناني بأمانة: الإبطال، وشريعة الوصايا، والغاية، و«الاثنين»، والخلق، والصورة المفردة لـἄνθρωπος، وصنع السلام. لكن تركيب «يخلق الاثنين في نفسه إنسانًا واحدًا» غير طبيعي في العربية وقد يوهم بأن «في نفسه» حالٌ من «الاثنين» أو أن «إنسانًا» مفعول ثانٍ غير واضح الصلة. إعادة ترتيبه إلى «يخلق في نفسه من الاثنين إنسانًا واحدًا جديدًا» توضح التحول من الاثنين إلى الواحد وتحفظ تعلق ἐν αὑτῷ بفعل الخلق.'
  naturalness: '«من الاثنين» هو التعبير العربي السليم عن خلق كيان واحد من طرفين، وموضع «في نفسه» قبل العبارة التحويلية أكثر سلاسة وأقل التباسًا. كما أن «المعبَّر عنها بفرائض» أوضح عربيًا من «المعبَّر عنها في فرائض» مع بقاء المعنى المقصود: الوصايا المصاغة في مراسيم/فرائض.'
