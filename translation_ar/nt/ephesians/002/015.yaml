  text: إذ أبطل شريعة الوصايا المعبَّر عنها بفرائض[a]، لكي يخلق في نفسه من الاثنين إنسانًا واحدًا جديدًا[b]، صانعًا السلام،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في فرائض»، أو «المتضمِّنة فرائض»، أو تقليديًا: «في شرائع».'
    reason: lexical_alternative
  - marker: b
    text: '«إنسان واحد جديد» صورة مفردة جامعة؛ ويمكن أن تُترجم أيضًا: «بشرية جديدة واحدة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: شريعة
  rationale: 'تحافظ «شريعة» على الدلالة العهدية في السياق، مع بقاء العبارة مقيَّدة بما يليها: «الوصايا المعبَّر عنها في فرائض».'
- source_word: ἐντολῶν
  choice: الوصايا
  rationale: تنقل المعنى الرسمي العهدي، وتلائم تركيب الإضافة إلى «شريعة».
- source_word: ἐν δόγμασιν
  choice: المعبَّر عنها في فرائض
  rationale: توضح صلة الفرائض بالوصايا في عربية مفهومة من غير حصرها في الشعائر وحدها؛ ويمكن أن تعني العبارة حرفيًا «في فرائض».
- source_word: καταργήσας
  choice: إذ أبطل
  rationale: تنقل قوة الفعل الدال على الإبطال، وتصوغ اسم الفاعل الماضي بما ينسجم مع تركيب الجملة العربية وسياق الآية السابقة.
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية بوضوح.
- source_word: τοὺς δύο
  choice: الاثنين
  rationale: تحافظ على العدد الصريح، في إشارة إلى الفريقين المذكورين في السياق.
- source_word: κτίσῃ
  choice: يخلق
  rationale: تحافظ على معنى الخلق وعلى إيحاء الخليقة الجديدة، بدل لفظ أضعف مثل «يشكّل».
- source_word: ἐν αὑτῷ
  choice: في نفسه
  rationale: تعكس الضمير الانعكاسي في القراءة المعتمدة للنص اليوناني، وتبقي تعلق العبارة التركيبي قابلًا للفهم مع فعل الخلق.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: إنسانًا واحدًا جديدًا
  rationale: «إنسان» هو المقابل العربي الطبيعي لـἄνθρωπος، ويحفظ الصورة المفردة الجامعة من غير تحويلها في المتن إلى مفهوم تفسيري مثل «بشرية جديدة».
- source_word: ποιῶν εἰρήνην
  choice: صانعًا السلام
  rationale: يحافظ على صيغة اسم الفاعل وعلى الصلة المباشرة بين خلق الإنسان الجديد وصنع السلام.
theological_decisions:
- issue: الصورة الجامعة في عبارة εἰς ἕνα καινὸν ἄνθρωπον
  choice: إنسانًا واحدًا جديدًا
  alternative: بشريةً جديدةً واحدةً
  rationale: الصياغة المختارة تحفظ صورة المفرد في اليونانية، بينما يوضح السياق أن المقصود كيان جماعي يضم الفريقين؛ ولا تُحسم هذه الدلالة بتحويل الصورة إلى تجريد في المتن.
- issue: قوة καταργήσας بالنسبة إلى الشريعة
  choice: أبطل
  alternative: عطّل / جعل بلا مفعول
  rationale: تنقل «أبطل» قوة الفعل في هذا السياق، مع إبقاء مفعوله محددًا في نص الآية بأنه «شريعة الوصايا المعبَّر عنها في فرائض»، من غير إضافة تعميم عقائدي لا يصرح به النص هنا.
- issue: موضع ἐν αὑτῷ وتعلقه
  choice: يخلق الاثنين في نفسه إنسانًا واحدًا جديدًا
  alternative: يخلق الاثنين إنسانًا واحدًا جديدًا في نفسه
  rationale: وُضع شبه الجملة وفق ترتيب اليونانية للمحافظة على احتمال تعلقه بفعل الخلق، مع الإقرار بأن نقله إلى آخر العبارة ممكن عربيًا وقد يُفهم على أنه وصف لمجال وجود الإنسان الجديد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ورصينة، تحافظ على بنية الجملة التابعة للسياق السابق وعلى الصورة اللاهوتية المفردة الجامعة. استُخدمت «فرائض» بمعنى الأحكام أو المقررات، لا بقصد قصر العبارة على الطقوس.
