lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: وقد بُنيتم
  rationale: صيغة اسم المفعول اليونانية في الماضي المبني للمجهول تشير إلى المخاطَبين بوصفهم قد أُدخلوا في البناء. صيغت عربيًا بفعل مبني للمجهول مع الواو لإبقاء ارتباطها بالسياق السابق.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: على أساس
  rationale: ينقل المعنى المكاني والتصوير المعماري بوضوح وطبيعية في العربية.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: الرسل والأنبياء
  rationale: أُبقيت إضافة «أساس الرسل والأنبياء» من غير تقييدها بمعنى «الذي وضعه» أو «المكوَّن منهم»، لأن المضاف إليه اليوناني لا يحسم نوع العلاقة.
- source_word: ὄντος
  choice: هو
  rationale: نُقلت الجملة الحالية اليونانية بجملة اسمية عربية طبيعية، من غير إضافة علاقة تفسيرية غير مصرّح بها.
- source_word: ἀκρογωνιαίου
  choice: حجر الزاوية
  rationale: المقابل العربي الواضح والمألوف للمصطلح المعماري، ويحافظ على صورة البناء.
- source_word: αὐτοῦ
  choice: نفسه
  rationale: يحفظ توكيد الضمير العائد إلى المسيح يسوع، ويمنع فهمه على أنه عائد إلى شيء غير عاقل.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: يحافظ على ترتيب الأصل ويعرض «المسيح» بوصفه لقبًا، لا مجرد جزء من اسم مركب.
theological_decisions:
- issue: معنى «أساس الرسل والأنبياء»
  choice: 'الإبقاء على الإضافة الواسعة: «أساس الرسل والأنبياء»'
  alternative: الأساس الذي وضعه الرسل والأنبياء؛ أو الأساس المكوَّن من الرسل والأنبياء
  rationale: صيغة الإضافة في اليونانية تحتمل أن يكون الأساس مرتبطًا بشهادتهم، أو موضوعًا بواسطتهم، أو متمثلًا فيهم؛ لذلك لا تحسم الترجمة ما لم يحسمه النص.
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: ترتيب «المسيح يسوع» يصون ترتيب الأصل ويُبرز أن «المسيح» لقب، مع أن الترتيب الآخر أكثر شيوعًا في العربية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم المبني للمجهول للمحافظة على بنية الأصل، وصيغت العبارة الختامية جملة اسمية طبيعية. وُضعت الحاشيتان عند العبارتين اللتين تشرحانهما، مع إبقاء غموض الإضافة اللاهوتي من غير حسم.
