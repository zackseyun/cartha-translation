  source_fidelity: 'المعنى الرئيس محفوظ: الموت الروحي، والإحياء مع المسيح، والاعتراض الذي يشدد على النعمة. لكن «حتى حين كنا» تركيب غير سليم/غير طبيعي في العربية الفصحى هنا؛ فـ«حتى» لا تؤدي على نحو واضح وظيفة الظرف أو المفارقة التي في καὶ ὄντας. كما أن «في زلاتنا» أقرب إلى صورة النص اليوناني وإلى «in our trespasses» من الباء في «بزلاتنا»، التي تميل في العربية إلى التعليل.'
