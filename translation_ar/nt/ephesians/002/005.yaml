  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: ar
  text: إذ كنا أمواتًا في زلاتنا، أحيانا مع المسيح—بالنعمة أنتم مُخلَّصون—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: حين كنا أمواتًا
  rationale: ينقل التركيب الحالي بوصفه حالة زمنية قائمة، وتضيف «حتى» الدلالة السياقية على المفارقة من غير تحويل العبارة صراحةً إلى تعليل.
- source_word: τοῖς παραπτώμασιν
  choice: بزلاتنا
  rationale: «الزلات» تؤدي معنى παραπτώματα بوصفها تعديات وانحرافات، والباء العربية تحتمل الارتباط بالحالة وسببها دون حسم زائد. أضيف ضمير المتكلمين لأن «نحن» هو المرجع في السياق.
- source_word: συνεζωοποίησεν
  choice: جعلنا أحياء مع
  rationale: يحفظ معنى منح الحياة في الفعل المركب، وتؤدي «مع» عنصر المشاركة الذي يحدده الاسم التالي، مع تجنب التباس «أحيانا» غير المشكولة بكلمة «أحيانًا».
- source_word: τῷ Χριστῷ
  choice: المسيح
  rationale: «المسيح» المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالته المسيانية مع كونه التعبير الكتابي الجاري.
- source_word: χάριτί
  choice: بالنعمة
  rationale: الباء تنقل الدلالة الوسيلية، و«النعمة» مصطلح عربي واضح وراسخ لمعنى χάρις هنا.
- source_word: ἐστε σεσῳσμένοι
  choice: أنتم مُخلَّصون
  rationale: اسم المفعول مع ضمير المخاطبين يصون المبني للمجهول ويبرز الحالة الحاضرة الناتجة من فعل الخلاص المكتمل.
theological_decisions:
- issue: دلالة τῷ Χριστῷ وعلاقته بالفعل
  choice: مع المسيح
  alternative: بالمسيح
  rationale: «مع» تحفظ معنى الاتحاد والمشاركة الذي يدل عليه الفعل المركب والسياق، بينما قد توحي «بالمسيح» بالوسيلة وحدها.
- issue: القوة البلاغية لعبارة χάριτί ἐστε σεσῳσμένοι
  choice: إبقاؤها جملة اعتراضية بين شرطتين
  alternative: دمجها في الجملة من دون إبراز ترقيمي
  rationale: يحفظ ذلك الاعتراض المفاجئ في اليونانية وتشديد بولس على النعمة، من غير إضافة تفسير عقائدي.
- issue: العلاقة الدلالية في τοῖς παραπτώμασιν
  choice: بزلاتنا
  alternative: في زلاتنا أو بسبب زلاتنا
  rationale: الباء أكثر طبيعية في العربية وتبقي قدرًا من الانفتاح بين مجال الحالة وعلاقتها السببية، بدل حسمها في اتجاه واحد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. صيغت العبارة بوصفها امتدادًا نحويًا للفكر السابق، وحُفظ الاعتراض الختامي بين شرطتين. لا حاجة إلى حاشية على «المسيح»، لأن اللفظ العربي نفسه ينقل معنى اللقب Χριστός بصورة طبيعية.
