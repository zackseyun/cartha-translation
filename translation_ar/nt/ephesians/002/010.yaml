  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: ar
  text: فنحن صنيعته[a]، خُلقنا في المسيح يسوع لأعمال صالحة أعدَّها الله من قبل لكي نسلك فيها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عمله» أو «ما صنعه». والكلمة اليونانية تدل على شيء مصنوع أو مُنشأ.'
    reason: lexical_alternative
  - marker: b
    text: «نسلك» هنا استعارة تشير إلى طريقة العيش والتصرّف.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: صنيعته
  rationale: تنقل معنى الشيء الذي صنعه الله، وتحافظ على الصورة الملموسة من غير إيحاء آلي أو صناعي ثقيل.
- source_word: κτισθέντες
  choice: وقد خُلقنا
  rationale: تعكس صيغة اسم المفعول اليونانية ومعنى الخلق، مع صياغة عربية طبيعية تربطها بكون المؤمنين صنيعة الله.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: تحافظ «المسيح» على معنى Χριστός بوصفه لقبًا، بينما تنقل ἐν بصيغة «في» من غير تفسير زائد لطبيعة الاتحاد المقصود.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: لأعمال صالحة
  rationale: تؤدي معنى الغاية أو التوجّه المقصود، وتحافظ على التعبير الأخلاقي المباشر في النص.
- source_word: προητοίμασεν
  choice: سبق الله فأعدَّها
  rationale: تُظهر دلالة السابقة الزمنية في السابقة προ- بعبارة عربية واضحة، من غير تحميلها نظامًا لاهوتيًا أوسع.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل دلالة الغاية المقصودة في الأداة اليونانية بوضوح.
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: لكي نسلك فيها
  rationale: تحافظ على استعارة المشي البولسية من خلال «نسلك»، وعلى رجوع الضمير إلى الأعمال الصالحة بوصفها مجال السلوك ونمط الحياة.
- source_word: γάρ
  choice: فـ
  rationale: تصل الآية بما قبلها بوصفها تعليلًا وتفسيرًا، وهو استعمال عربي طبيعي في السياق.
- source_word: αὐτοῦ
  choice: ـه في «صنيعته»
  rationale: يحافظ ضمير الملكية على الإحالة إلى الله كما في اليونانية، من غير تكرار الاسم حيث لا يلزم.
theological_decisions:
- issue: نقل Χριστῷ بوصفه لقبًا أو عنصرًا شبيهًا بالاسم
  choice: المسيح يسوع
  alternative: يسوع المسيح / في يسوع المسيح
  rationale: تُبقي الصياغة ترتيب الأصل وتُظهر أن «المسيح» لقب ذو معنى، لا مجرد اسم منقول صوتيًا.
- issue: العلاقة بين إعداد الله السابق وسلوك البشر
  choice: سبق الله فأعدَّها، لكي نسلك فيها
  alternative: أعدَّها الله من قبل لنعملها
  rationale: تحافظ الصياغة على مبادرة الله وعلى غاية سلوك المؤمنين في الأعمال الصالحة، من غير حسم جدل لاهوتي يتجاوز منطوق النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «صنيعته» للمحافظة على صورة المصنوع، و«نسلك» للإبقاء على الاستعارة البولسية المألوفة، مع شرحها في الحاشية.
