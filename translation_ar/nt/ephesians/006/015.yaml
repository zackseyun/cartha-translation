lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: احذوا
  rationale: اسم الفاعل اليوناني يدل حرفيًا على انتعال الحذاء أو ربطه تحت القدم. اختير الفعل «احذوا» حفاظًا على صورة انتعال العُدّة ضمن استعارة السلاح، مع صياغة عربية طبيعية منسجمة مع سياق الأوامر المحيط.
- source_word: τοὺς πόδας
  choice: أقدامكم
  rationale: المفعول به هو «الأقدام» نفسها، وإضافة ضمير المخاطبين لازمة طبيعيًا في العربية ويحملها السياق اليوناني.
- source_word: ἐν
  choice: بِـ
  rationale: تفيد هنا الوسيلة أو ما يتجهز به المرء، ولذلك تؤدي الباء المعنى بصورة عربية موجزة وطبيعية.
- source_word: ἑτοιμασίᾳ
  choice: الاستعداد
  rationale: ينقل المعنى المباشر للاسم من غير أن يحسم هل المقصود الاستعداد لإعلان الإنجيل أم الثبات الذي يمنحه الإنجيل.
- source_word: εὐαγγελίου
  choice: إنجيل
  rationale: «الإنجيل» المقابل العربي المألوف للمصطلح البولسي، ويحفظ كثافته اللاهوتية مع بقائه مفهومًا للقارئ المعاصر.
- source_word: εἰρήνης
  choice: السلام
  rationale: نُقلت الإضافة كما في اليونانية بحيث يصف «السلام» الإنجيل أو مضمونه، من غير توسع تفسيري.
theological_decisions:
- issue: معنى العبارة ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: الاستعداد الذي مصدره أو أساسه إنجيل السلام
  alternative: الاستعداد لإعلان إنجيل السلام، أو الثبات الراسخ الذي يمنحه إنجيل السلام
  rationale: التركيب اليوناني مكثف ويحتمل هذه العلاقات الدلالية. أُبقي «الاستعداد» في المتن، مع «الذي من» لبيان صلته بالإنجيل دون قصره صراحةً على التبشير أو على رسوخ الموقف، وأُثبتت الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية كريمة. استُخدم «احذوا أقدامكم» للمحافظة على صورة الحذاء في سياق سلاح الله، وتُركت دلالة «الاستعداد» مفتوحة كما في الأصل.
