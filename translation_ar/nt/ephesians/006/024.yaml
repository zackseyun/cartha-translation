  terminology: «النعمة»، «ربنا»، و«يسوع المسيح» مصطلحات سليمة ومألوفة. ولا يلزم إدخال تفسير مثل «بمحبة لا تفنى» في المتن؛ يبقى ذلك في الحاشية.
