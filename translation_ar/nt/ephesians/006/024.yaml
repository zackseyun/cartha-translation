base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: ar
  text: لِتَكُنِ النِّعْمَةُ مَعَ جَمِيعِ الَّذِينَ يُحِبُّونَ رَبَّنَا يَسُوعَ الْمَسِيحَ فِي عَدَمِ فَسَادٍ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بمحبة لا تفنى»؛ ويمكن أيضًا: «في الإخلاص» أو «بمحبة لا تموت». والعبارة اليونانية «في عدم فساد» موجزة وتحتمل أكثر من معنى.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: النِّعْمَةُ
  rationale: تحافظ «النعمة» على المصطلح البولسي المألوف، وتؤدي هنا وظيفة البركة الختامية.
- source_word: μετὰ πάντων
  choice: مَعَ جَمِيعِ
  rationale: نُقل حرف الجر مع المجرور مباشرة، وأُضيف فعل الدعاء «لتكن» لأن العبارة اليونانية اسمية محذوفة الفعل ولأن العربية تستحسن إظهاره في صيغة البركة.
- source_word: ἀγαπώντων
  choice: الَّذِينَ يُحِبُّونَ
  rationale: صيغ اسم الفاعل المضارع في جملة موصولة عربية طبيعية، مع الحفاظ على دلالة الصفة المستمرة.
- source_word: κύριον
  choice: رَبَّنَا
  rationale: «الرب» المقابل المعتاد للقب κύριος في هذا السياق المسيحاني، والضمير ينقل ἡμῶν.
- source_word: Ἰησοῦν Χριστόν
  choice: يَسُوعَ الْمَسِيحَ
  rationale: تُرجم Χριστός بوصفه لقبًا إلى «المسيح»، وهي الصيغة العربية الطبيعية للاسم واللقب.
- source_word: ἐν ἀφθαρσίᾳ
  choice: فِي عَدَمِ الْفَسَادِ
  rationale: ترجمة قريبة من البنية اليونانية الموجزة، تحفظ الإبهام في تعلّق العبارة ودلالتها بدل حصرها في «محبة لا تزول» أو «إخلاص».
theological_decisions:
- issue: دلالة ἐν ἀφθαρσίᾳ وتعلّقها النحوي
  choice: الإبقاء على الصيغة الحرفية الملتبسة «في عدم الفساد» في المتن
  alternative: بمحبة لا تفنى؛ في الإخلاص؛ بمحبة لا تموت
  rationale: لا يحدد اليوناني بوضوح هل تصف العبارة محبة المؤمنين، أم كيفية المحبة، أم مجال البركة أو صفة عدم الزوال؛ لذلك لا يحسم المتن ما أبقاه الأصل محتملًا، وتُذكر الصيغ التفسيرية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية وقورة وواضحة. استُعملت صيغة الدعاء «لتكن النعمة» طبيعيًا، مع إبقاء العبارة الختامية أقرب إلى الأصل حفاظًا على إبهامها الحقيقي.
