  verdict: revise
  source_fidelity: 'ينقل المتن عناصر اليونانية كلها بأمانة: «النعمة» للدعاء الختامي، و«مع جميع الذين يحبون ربنا يسوع المسيح»، مع إبقاء العبارة الأخيرة ذات التعلّق والدلالة المحتملين دون حسم تفسيري. غير أن «عدم الفساد» معرّفةً أقل سلاسة في العربية وتوحي بتركيب تجريدي حديث أكثر من نقل ἀφθαρσίᾳ بوصفها صفة/حالًا.'
