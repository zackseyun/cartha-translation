  source_fidelity: 'المعنى الأساسي محفوظ: الأمر بأخذ العتاد الكامل، وغرضه المقاومة في يوم الشر والثبات بعد إنجاز كل شيء. لكن تركيب «وبعد أن تُتمّوا كل شيء، تثبتوا» لا يبيّن بوضوح أن «تثبتوا» معطوفة داخل غاية «لكي تقدروا»، وقد يبدو في العربية جملة غير مكتملة أو انتقالًا زمنيًا مستقلًا. إعادة ترتيب العبارة تحفظ علاقة المصدر اليوناني: «وأن تثبتوا بعد أن تُتمّوا كل شيء».'
  naturalness: الصياغة المقترحة أفصح وأكثر سلاسة في العربية الفصحى المعاصرة، مع إبقاء التوازي بين «تقاوموا» و«تثبتوا». واستبدال «احملوا» بـ«خذوا» أنسب لأمر ἀναλάβετε في هذا السياق؛ إذ إن حمل السلاح قد يفيد مجرد حيازته، بينما «خذوا» يفيد التناول استعدادًا.
