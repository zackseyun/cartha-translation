- from: لِذَلِكَ احْمِلُوا سِلَاحَ اللهِ الْكَامِلَ[a]، لِكَيْ تَقْدِرُوا أَنْ تُقَاوِمُوا فِي يَوْمِ الشَّرِّ[b]، وَبَعْدَ أَنْ تُتِمُّوا كُلَّ شَيْءٍ[c]، تَثْبُتُوا[d].
  to: لذلك خذوا سلاحَ اللهِ الكاملَ[a]، لكي تقدروا أن تقاوموا في يوم الشر[b]، وأن تثبتوا بعد أن تُتمّوا كلَّ شيء[c][d].
