source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: ar
  text: لذلك خذوا سلاحَ اللهِ الكاملَ[a]، لكي تقدروا أن تقاوموا في يوم الشر[b]، وأن تثبتوا بعد أن تُتمّوا كلَّ شيء[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي عتاد الله الكامل؛ فاللفظ اليوناني يدل على كامل تجهيز الجندي.
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «يوم الشر» عمومًا إلى زمن يشتد فيه الشر أو الامتحان، وليس بالضرورة إلى حدث أخروي واحد محدد.
    reason: alternative_reading
  - marker: c
    text: 'أو: «تنجزوا كل شيء» أو «تفعلوا كل ما يلزم».'
    reason: lexical_alternative
  - marker: d
    text: 'أي تبقوا ثابتين؛ ويمكن أيضًا ترجمتها: «تقفوا صامدين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: أداة استنتاج طبيعية موجزة تربط الوصية بما سبقها.
- source_word: ἀναλάβετε
  choice: احملوا
  rationale: تفيد أخذ العتاد وحمله استعدادًا للقتال، وتحافظ على الصورة العسكرية أكثر من «البسوا».
- source_word: τὴν πανοπλίαν
  choice: سلاح ... الكامل
  rationale: يدل اللفظ على كامل عتاد الجندي، و«السلاح الكامل» تعبير عربي مفهوم يشمل التجهيز كله لا سلاحًا منفردًا.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: تُركت الإضافة على اتساعها، فلا تحسم هل العتاد مِلك لله أم مقدَّم منه.
- source_word: ἵνα δυνηθῆτε
  choice: لكي تقدروا
  rationale: يحفظ معنى الغاية والقدرة معًا بصياغة عربية طبيعية.
- source_word: ἀντιστῆναι
  choice: أن تقاوموا
  rationale: ينقل معنى الوقوف في وجه الهجوم ومقاومته ضمن السياق العسكري.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: في يوم الشر
  rationale: صياغة قريبة من اليونانية وتحافظ على المرجع المفتوح للعبارة.
- source_word: ἅπαντα κατεργασάμενοι
  choice: بعد أن تتموا كل شيء
  rationale: ينقل معنى إنجاز كل ما يقتضيه الموقف من غير أن يضيف معنى الانتصار الحاسم غير الصريح.
- source_word: στῆναι
  choice: تثبتوا
  rationale: يؤدي في العربية معنى البقاء واقفين والصمود في المقام العسكري، بدل ترجمة حرفية قد تبدو ضعيفة.
theological_decisions:
- issue: دلالة «يوم الشر»
  choice: الإبقاء عليها عامة بوصفها زمنًا للشر أو الصراع الروحي
  alternative: يوم أخروي محدد، أو يوم محنة شخصية بعينه
  rationale: العبارة اليونانية لا تُلزم بمرجع أخروي تقني واحد، لذلك لم تُضيَّق دلالتها.
- issue: قوة الإضافة في «سلاح الله»
  choice: إبقاء الإضافة بلا تفسير زائد
  alternative: سلاح يملكه الله، أو سلاح يمنحه الله
  rationale: الإضافة اليونانية تحتمل هذه الصلات، والترجمة لا تحسم ما تركه النص مفتوحًا.
- issue: دلالة κατεργασάμενοι
  choice: إتمام كل شيء مطلوب
  alternative: التغلب على كل شيء أو إحراز النصر الكامل
  rationale: اختيرت صياغة واسعة لا تستورد إلى الفعل معنى الانتصار الذي لا يصرح به اللفظ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على الصورة العسكرية، وعلى التوازي بين المقاومة والثبات، وتجنب المصطلحات الطائفية أو التفسير الزائد.
