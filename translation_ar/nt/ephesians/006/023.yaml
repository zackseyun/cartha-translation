base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: ar
  text: سَلَامٌ لِلْإِخْوَةِ[a]، وَمَحَبَّةٌ مَعَ إِيمَانٍ[b]، مِنَ اللهِ الآبِ وَمِنَ الرَّبِّ يَسُوعَ الْمَسِيحِ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للإخوة والأخوات». يقول اليوناني «الإخوة» بصيغة جمع مذكر يمكن أن يُخاطَب بها جماعة المؤمنين كلها.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «محبة مع أمانة» أو «محبة مع ثقة». يمكن للكلمة اليونانية أن تحمل هذه المعاني، وإن كان «إيمان» هو المقابل الأرجح هنا.'
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية: «يسوع خريستوس». تُترجم Χριστός هنا باللقب «المسيح» حفاظًا على معناها.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: سَلَامٌ
  rationale: يحافظ على صيغة البركة الاسمية الموجزة في اليونانية من غير إضافة فعل غير موجود في النص.
- source_word: τοῖς ἀδελφοῖς
  choice: لِلْإِخْوَةِ
  rationale: ينقل صيغة الجمع المذكر في الأصل، مع بيان إمكان شمولها جميع المؤمنين في الحاشية.
- source_word: ἀγάπη
  choice: مَحَبَّةٌ
  rationale: هو المقابل العربي الطبيعي والدقيق للمصطلح، ويحافظ على الصلة المعجمية باستعمال بولس المتكرر له.
- source_word: μετὰ πίστεως
  choice: مَعَ إِيمَانٍ
  rationale: تنقل μετά مع المضاف إليه بمعنى المصاحبة، وتختار «إيمان» بوصفه المعنى الافتراضي لـ πίστις مع حفظ البدائل في الحاشية.
- source_word: ἀπὸ
  choice: مِنَ
  rationale: 'تدل على المصدر أو المنشأ: السلام والمحبة المصحوبة بالإيمان مصدرها الله الآب والرب يسوع المسيح.'
- source_word: θεοῦ πατρὸς
  choice: اللهِ الآبِ
  rationale: الأصل لا يتضمن ضمير «نا»، ولذلك لا تُضاف عبارة «أبينا».
- source_word: κυρίου
  choice: الرَّبِّ
  rationale: المقابل العربي الراسخ والدقيق للقب κύριος في هذا السياق.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: يُنقل Ἰησοῦ اسمًا، ويُترجم Χριστοῦ لقبًا بمعناه «المسيح» بدل معاملته كاسم غير مترجم.
theological_decisions:
- issue: ترجمة Χριστοῦ في البركة الختامية
  choice: الْمَسِيحِ
  alternative: كريستوس أو المسيح بوصفه مجرد جزء من الاسم
  rationale: يحمل اللفظ اليوناني قوة اللقب هنا، و«المسيح» هو المقابل العربي الطبيعي الذي يحفظ دلالته المسيانية.
- issue: المخاطَبون بلفظ ἀδελφοῖς
  choice: الإِخْوَةِ
  alternative: الإخوة والأخوات
  rationale: يحافظ المتن على صيغة الجمع المذكر في الأصل، بينما توضح الحاشية أن اللفظ قد يشمل جماعة المؤمنين كلها.
- issue: دلالة πίστις
  choice: إِيمَانٍ
  alternative: أمانة أو ثقة
  rationale: «إيمان» هو المعنى الأرجح والافتراضي هنا، لكن المجال الدلالي للكلمة يسمح أيضًا بالأمانة أو الثقة، لذا تُذكران دون حسم زائد.
