  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت صيغة اسمية موجزة لمضاهاة البركة اليونانية، مع ضبط كامل للنص القصير لتيسير القراءة ومنع الالتباس الإعرابي.
