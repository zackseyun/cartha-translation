id: EPH.6.11
reference: Ephesians 6:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: ar
  text: البسوا عُدَّةَ الله الحربية الكاملة[a]، لكي تقدروا أن تقفوا في وجه مكائد إبليس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سلاح الله الكامل». تشير الكلمة اليونانية إلى كامل تجهيزات الجندي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حِيَل إبليس» أو «أساليبه الماكرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: البسوا
  rationale: فعل أمر موجَّه إلى الجمع، وصيغة «البسوا» طبيعية في سياق ارتداء العُدّة الحربية وتحافظ على قوة الأمر.
- source_word: πανοπλίαν
  choice: عُدَّةَ الله الحربية الكاملة
  rationale: تدل الكلمة على كامل تجهيزات الجندي لا على الدرع وحده؛ لذلك تعبّر «العُدّة الحربية الكاملة» عن الشمول بوضوح.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: أُبقيت الإضافة العربية واسعة الدلالة، فلا تحسم هل المقصود الملكية أم المصدر، وكلاهما ممكن في التركيب اليوناني.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: لكي تقدروا أن تقفوا
  rationale: ينقل الغرض الذي يفيده التركيب اليوناني، مع الحفاظ على معنى القدرة وفعل الوقوف.
- source_word: στῆναι
  choice: أن تقفوا
  rationale: يحافظ على صورة الوقوف في النص؛ وعبارة «في وجه» توضح معنى الصمود في المواجهة من غير تحويل الفعل صراحة إلى «تثبتوا».
- source_word: μεθοδείας
  choice: مكائد
  rationale: تنقل معنى الخطط والأساليب الماكرة الخادعة بلغة عربية واضحة ومعاصرة.
- source_word: τοῦ διαβόλου
  choice: إبليس
  rationale: يُستعمل اللفظ هنا لقبًا للخصم الشرير الشخصي في سياق الحرب الروحية، و«إبليس» هو المقابل العربي الواضح والمألوف لهذا المرجع.
theological_decisions:
- issue: مرجع διάβολος وطريقة نقله
  choice: إبليس، بوصفه الخصم الشرير الشخصي
  alternative: المفتري
  rationale: سياق الحرب الروحية في أفسس 6 يرجّح أن اللفظ لقب للكائن الشرير الشخصي، لا اسمًا عامًا لأي مفتَرٍ، من غير إضافة تفاصيل عقدية لا يذكرها العدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «العُدّة الحربية الكاملة» لتجنب قصر الصورة على الدرع وحده، و«تقفوا في وجه» للإبقاء على صورة الوقوف مع إظهار معنى المواجهة.
