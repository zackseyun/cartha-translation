  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: ar
  text: لا بخدمة العين[a]، كمن يطلبون رضا الناس، بل كعبيد للمسيح، عاملين مشيئة الله من صميم النفس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الخدمة التي لا تُؤدَّى إلا حين يكون المرء تحت نظر من يراقبه؛ والتعبير اليوناني يعني حرفيًا «خدمة العين».
    reason: lexical_alternative
  - marker: b
    text: أو «بكل إخلاص»؛ والعبارة اليونانية حرفيًا «من النفس».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: خدمة العين
  rationale: يحافظ التعبير على الصورة المركبة النادرة في اليونانية، أي الخدمة التي تُؤدَّى لمجرد أن تقع عليها عين الرقيب، مع إيضاح المقصود في الحاشية.
- source_word: ἀνθρωπάρεσκοι
  choice: من يطلبون رضا الناس
  rationale: صياغة عربية طبيعية تنقل معنى السعي إلى استحسان البشر، وتحفظ الدلالة الأخلاقية السلبية دون تقيد بصيغة اسم مركب غير مألوفة.
- source_word: δοῦλοι
  choice: عبيد
  rationale: السياق المباشر يخاطب عبيدًا بالفعل، ثم يعيد تحديد ولائهم بوصفهم عبيدًا للمسيح؛ لذلك تحافظ «عبيد» على دلالة التبعية والملكية الأشد من «خدام».
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ معنى الممسوح مع ملاءمته الطبيعية في السياق.
- source_word: ποιοῦντες
  choice: عاملين
  rationale: ينقل اسم الفاعل المصاحب للفعل الرئيس، ويفيد تنفيذ مشيئة الله بصورة مباشرة وطبيعية في العربية.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: مشيئة الله
  rationale: التعبير العربي المألوف والدقيق لما يريده الله أن يُفعل.
- source_word: ἐκ ψυχῆς
  choice: من صميم النفس
  rationale: يحافظ على لفظ «النفس» في الأصل، وفي الوقت نفسه يعبّر عربيًا عن الصدق الداخلي والانخراط الكامل دون استبداله بصورة «القلب».
theological_decisions:
- issue: دلالة δοῦλοι في سياق تعليم العبيد
  choice: عبيد للمسيح
  alternative: خدام للمسيح
  rationale: لأن المخاطَبين عبيد حرفيون في السياق القريب، ولأن العبارة تقابل خدمتهم لسادتهم بانتمائهم للمسيح، فلفظ «عبيد» يحفظ القوة الاجتماعية واللاهوتية للنص بدل تخفيفها.
- issue: ترجمة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: كريستوس/المسيح باعتباره اسمًا مجردًا
  rationale: الصيغة العربية «المسيح» تحفظ مضمون اللقب اليوناني، وتظل التعبير الطبيعي الراسخ دون حسم زائد لمسألة مدى تحوله إلى اسم عَلَم في الاستعمال البولسي.
- issue: القوة الداخلية لعبارة ἐκ ψυχῆς
  choice: من صميم النفس
  alternative: من القلب / بكل إخلاص
  rationale: الاختيار يحفظ المفردة الأنثروبولوجية ψυχή ولا يحولها إلى «قلب»، مع نقل المعنى السياقي للعمل الصادر عن الداخل بصدق.
translation_notes:
  register: لغة عربية فصحى واضحة وكريمة. أُبقيت صورة «خدمة العين» لما لها من قوة بلاغية في الأصل، وأُتبعت بحاشية تفسيرية. واستُعمل «من صميم النفس» ليكون مفهومًا وطبيعيًا مع الحفاظ على لفظ النفس، كما اختير «عبيد» لا «خدام» بسبب السياق المباشر وقوة δοῦλοι.
