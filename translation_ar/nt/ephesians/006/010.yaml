lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: أخيرًا
  rationale: تؤدي وظيفة علامة انتقال إلى القسم الختامي من الرسالة، و«أخيرًا» تعبير عربي طبيعي وواضح.
- source_word: ἐνδυναμοῦσθε
  choice: تقوَّوا
  rationale: صيغة أمر تحتمل المبني للمجهول أو الوسط، و«تقوَّوا» تحافظ على معنى تلقي القوة مع سلامة الأسلوب العربي، دون جعلها مجرد استجماع ذاتي للعزم.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحافظ حرف الجر «في» على لغة بولس الدالة على المجال أو العلاقة، من غير حصرها في معنى الوسيلة وحده.
- source_word: κράτει
  choice: شدة
  rationale: يدل اللفظ على القوة الفاعلة أو المتجلية؛ و«شدة» تلائم التركيب العربي وتتيح التمييز بينها وبين ἰσχύς.
- source_word: ἰσχύος
  choice: قوته
  rationale: «قوة» مقابل طبيعي للفظ الدال على الاقتدار، وفي تركيب «شدة قوته» تُحفظ كثافة ألفاظ القوة في اليونانية مع وضوح العربية.
- source_word: αὐτοῦ
  choice: ـه
  rationale: الضمير يعود طبيعيًا إلى الرب، وإلحاقه بـ«قوة» هو المقابل العربي المباشر من غير تكرار غير لازم.
theological_decisions:
- issue: صيغة ἐνδυναμοῦσθε ومصدر القوة
  choice: الأمر «تقوَّوا» يفيد أن المؤمنين يتلقون القوة في نطاق علاقتهم بالرب، لا أنهم يستمدونها من عزيمتهم الذاتية وحدها.
  alternative: «كونوا أقوياء»، بما قد يُفهم بوصفه أمرًا بإظهار قوة ذاتية.
  rationale: الصيغة اليونانية المبنية للمجهول/الوسط تدعم إبراز الاعتماد على قوة الرب، مع عدم فرض تحديد لاهوتي أدق مما يقوله النص.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل الطبيعي في هذا السياق البولسي، ويشير إلى المسيح من غير إضافة تفسيرية إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «تقوَّوا» لصيغته الطبيعية في العربية ولحفظ الدلالة الاستقبالية، واختير «شدة قوته» للمحافظة على تراكم ألفاظ القوة في الأصل من غير ركاكة.
