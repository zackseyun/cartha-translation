  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: ar
  text: وَأَنْتُمْ أَيُّهَا الْآبَاءُ، لَا تُثِيرُوا غَضَبَ أَوْلَادِكُمْ[a]، بَلْ رَبُّوهُمْ بِتَأْدِيبِ الرَّبِّ وَإِرْشَادِهِ[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تُغيظوا أولادكم» أو «لا تستفزّوهم». يدل الفعل اليوناني على إثارة الغضب أو دفع الشخص إلى الاستياء.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بتدريب الرب وتنبيهه». يشمل «التأديب» التنشئة والتقويم، ويشير «الإرشاد» إلى التوجيه اللفظي الذي قد يتضمن النصح أو التحذير.'
    reason: lexical_alternative
  - marker: c
    text: قد تدل إضافة «الرب» في عبارة «تأديب الرب وإرشاده» على أن التأديب والإرشاد يأتيان من الرب، أو يخصّانه، أو يجريان بتوجيهه.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: الْآبَاءُ
  rationale: الاسم اليوناني جمع مذكر ويخاطب الآباء تحديدًا، فلا يُوسَّع في المتن إلى «الوالدين».
- source_word: παροργίζετε
  choice: تُثِيرُوا غَضَبَ
  rationale: ينقل المعنى السببي للفعل، أي التسبب في الغضب أو الاستياء، بصياغة عربية واضحة وطبيعية.
- source_word: τέκνα
  choice: أَوْلَادِكُمْ
  rationale: لفظ عربي مألوف يشمل الأبناء والبنات في سياق الأسرة.
- source_word: ἐκτρέφετε
  choice: رَبُّوهُمْ
  rationale: الفعل في سياق تنشئة الأولاد يعني تربيتهم ورعايتهم حتى ينشؤوا، لا مجرد إطعامهم.
- source_word: παιδείᾳ
  choice: تَأْدِيبِ
  rationale: يحفظ معنى التربية التكوينية بما فيها التدريب والتقويم، لا العقوبة وحدها.
- source_word: νουθεσίᾳ
  choice: إِرْشَادِ
  rationale: ينقل معنى التوجيه اللفظي المقوِّم بصورة مفهومة في العربية المعاصرة، مع بيان البديل في الحاشية.
- source_word: κυρίου
  choice: الرَّبِّ / ـهِ
  rationale: تُرجم κύριος بـ«الرب»، وأُبقيت إضافة التأديب والإرشاد إليه من غير حصرها في معنى واحد.
theological_decisions:
- issue: نطاق المخاطَبين بلفظ πατέρες
  choice: الآباء
  alternative: الوالدان
  rationale: النص اليوناني يسمّي الآباء صراحة؛ وتعميم التطبيق لا يبرر توسيع لفظ الترجمة نفسه.
- issue: دلالة المضاف إليه κυρίου في عبارة παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: بتأديب الرب وإرشاده
  alternative: بالتأديب والإرشاد الآتيين من الرب / المتعلقين بالرب / الموافقين للرب
  rationale: الإضافة اليونانية قد تدل على المصدر أو الانتماء أو الصفة أو التوجيه؛ وتحافظ الإضافة العربية على قدر معتبر من هذا الاتساع بدل حسمه.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «ربّوهم» للمألوفية، وحُفظ الخطاب الخاص بالآباء. وُضعت علامات الحواشي بجوار الألفاظ والعبارة التي تشرحها.
