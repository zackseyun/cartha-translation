translation:
  language: ar
  text: وكذلك من أجلي، لكي يُعطى لي كلامٌ حين أفتح فمي، لأجعل سرَّ الإنجيل معروفًا بجرأة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: لأجلي أيضًا
  rationale: في سياق طلب الصلاة تعني العبارة أن يصلّوا من أجل بولس؛ وأُثبتت «أيضًا» لترجمة καί وربط الطلب بما قبله.
- source_word: ἵνα μοι δοθῇ λόγος
  choice: لكي يُعطى لي كلامٌ
  rationale: يحافظ «كلام» على مفرد λόγος وعلى احتمال أن يكون المقصود ما ينبغي قوله أو القدرة على التعبير، من غير تضييقه إلى «رسالة» فقط.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: حين أفتح فمي
  rationale: ترجمة عربية طبيعية تحفظ صورة فتح الفم وتبيّن ظرف بدء الكلام.
- source_word: ἐν παρρησίᾳ
  choice: بجرأة
  rationale: تنقل معنى الصراحة والشجاعة في إعلان الكلام، وهي أنسب هنا من حصر المعنى في الثقة النفسية.
- source_word: γνωρίσαι
  choice: فأُعرِّف
  rationale: تنقل معنى جعل الأمر معروفًا، وتربط الغاية بإعطاء الكلام من غير تحويل الفعل إلى مصطلح أضيق مثل «أكرز».
- source_word: τὸ μυστήριον
  choice: سرَّ
  rationale: «سر» هو المقابل العربي الطبيعي في الاستعمال البولسي لأمر إلهي كان خفيًا ثم صار معلنًا، لا للغز مجهول الحل.
- source_word: τοῦ εὐαγγελίου
  choice: الإنجيل
  rationale: المصطلح العربي الراسخ لـ εὐαγγέλιον، ويحفظ كثافته الاصطلاحية في رسائل بولس.
theological_decisions:
- issue: دلالة λόγος في طلب بولس
  choice: كلامٌ
  alternative: قولٌ؛ رسالةٌ؛ ما أقوله
  rationale: «كلام» يبقي المجال الدلالي مفتوحًا بين مضمون القول والتعبير الممنوح، ولا يضيف نظرية مخصوصة عن الوحي أو يحصره في رسالة مستقلة.
- issue: دلالة παρρησία
  choice: بجرأة
  alternative: بثقة؛ بصراحة
  rationale: تحفظ الجرأة العلنية والصراحة في التبليغ، ولا تختزل المعنى في شعور داخلي بالثقة.
- issue: علاقة γνωρίσαι بما قبله
  choice: فأُعرِّف
  alternative: لأُعرِّف
  rationale: الفاء تُظهر أن تعريف السر هو الغاية أو النتيجة المقصودة من إعطاء الكلام، مع إبقاء تركيب الآية عربيًا سلسًا.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. حافظت الصياغة على صورة «فتح الفم» وعلى المبني للمجهول في «يُعطى»، وتجنبت لغة مذهبية أو تفسيرًا زائدًا لمعنى السر.
