  to: وكذلك من أجلي، لكي يُعطى لي كلامٌ حين أفتح فمي، لأجعل سرَّ الإنجيل معروفًا بجرأة.
  rationale: 'أُبقيت عناصر النص اليوناني كلها: καί («وكذلك»)، وὑπὲρ ἐμοῦ («من أجلي»)، والمبني للمجهول في «يُعطى لي»، وصورة فتح الفم، والجرأة، وسرّ الإنجيل. واستُبدلت الفاء بلام الغاية، وصيغ γνωρίσαι بصيغة عربية صريحة وطبيعية هي «لأجعل ... معروفًا». وحُذفت الحاشية لأن مرساها غير منسجم مع مضمونها ولا تعالج غموضًا نصيًا لازمًا.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:17Z'
