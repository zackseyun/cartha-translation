  text: خادمين بنيّة طيبة، كما تخدمون الرب لا الناس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: بنيّةٍ طيّبة
  rationale: تفيد μετά مع المضاف إليه الهيئة أو الروح المصاحبة للخدمة، وتدل εὔνοια على حسن القصد والرضا. و«بنيّة طيبة» تعبير عربي طبيعي يبرز الاستعداد الداخلي الإيجابي.
- source_word: δουλεύοντες
  choice: خادمينَ
  rationale: اسم الفاعل من δουλεύω يدل في أصله على خدمة العبد. وبما أن المخاطَبين عُرِّفوا صراحةً بأنهم عبيد في سياق الفقرة، تنقل «خادمين» الفعل هنا بوضوح من غير تكرار ثقيل، مع بقاء الواقع الاجتماعي ظاهرًا في السياق.
- source_word: ὡς
  choice: كما
  rationale: 'تدخل ὡς هنا على جهة الخدمة المقصودة: يؤدونها كما يؤدونها للرب. و«كما» تحفظ المقارنة من غير إضافة معنى افتراضي مثل «كأن».'
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: تحفظ «الرب» اللقب المسيحاني في هذا السياق، وتمنع الخلط بين الرب الإلهي والسادة البشريين المذكورين في الفقرة.
- source_word: ἀνθρώποις
  choice: للناس
  rationale: ἀνθρώποις جمع عام يدل هنا على البشر في مقابل الرب، ولذلك تنقل «الناس» المعنى المقصود طبيعيًا من غير حصره في الذكور.
theological_decisions:
- issue: ترجمة κύριος في مقابل السادة البشريين
  choice: الرب
  alternative: السيد
  rationale: المقصود هو الرب الإلهي الذي تُوجَّه إليه الخدمة في غايتها، لا مجرد سيد أرضي؛ وتحفظ «الرب» هذا التمييز واللقب المسيحاني.
- issue: مدى التصريح بدلالة العبودية في δουλεύοντες
  choice: خادمينَ
  alternative: خادمين كعبيد
  rationale: السياق السابق يصرّح بأن المخاطَبين عبيد، أما هذا التركيب فيركّز على كيفية خدمتهم. لذا تحافظ «خادمين» على سلاسة العربية من غير طمس الواقع الذي يبيّنه السياق.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ووقورة، تحافظ على تركيب العبارة اليونانية وعلاقتها بما قبلها. نُصبت «خادمين» لأنها حال متصلة بالسياق السابق، واستُعملت «الناس» لأن ἄνθρωποι هنا عامة وتشمل البشر في مقابل الرب.
