lexical_decisions:
- source_word: ἵνα
  choice: لِكَيْ
  rationale: تُفيد الغاية أو النتيجة، وتحافظ على صلة الوعد بالوصية المذكورة في السياق السابق.
- source_word: εὖ σοι γένηται
  choice: يَكُونَ لَكَ خَيْرٌ
  rationale: صياغة عربية طبيعية وواضحة تنقل معنى أن تسير أحوال المخاطَب على خير، مع إبقاء العبارة عامة كما في اليونانية.
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف بسيط يصل بين نتيجتي الوعد.
- source_word: ἔσῃ μακροχρόνιος
  choice: تَكُونَ طَوِيلَ الْعُمْرِ
  rationale: 'ينقل تركيب فعل الكينونة مع الصفة بمعناه المباشر: أن يكون المخاطَب طويل العمر، من غير تحويل الوعد إلى تقرير قطعي مستقل عن أداة الغاية.'
- source_word: ἐπὶ τῆς γῆς
  choice: عَلَى الْأَرْضِ
  rationale: يتبع اللفظ اليوناني القائم، وهو أوسع من تعبير «في الأرض» بمعنى البلاد؛ وتُذكر دلالة الصدى الوصائي البديلة في الحاشية.
theological_decisions:
- issue: نطاق عبارة ἐπὶ τῆς γῆς وصلتها بوعد الوصية الخامسة
  choice: عَلَى الْأَرْضِ
  alternative: فِي الْأَرْضِ
  rationale: النص اليوناني هنا لا يذكر أرضًا مخصوصة ولا يضيف ضمير ملكية؛ لذلك تُحفظ دلالته الأوسع، مع التنبيه إلى احتمال سماع صدى صياغة الوصية الخامسة في الخروج 20:12 والتثنية 5:16.
translation_notes:
