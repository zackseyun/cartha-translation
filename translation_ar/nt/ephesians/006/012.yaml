  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: ar
  text: فَإِنَّ صِرَاعَنَا لَيْسَ ضِدَّ لَحْمٍ وَدَمٍ[a]، بَلْ ضِدَّ الرِّئَاسَاتِ، وَضِدَّ السُّلُطَاتِ، وَضِدَّ حُكَّامِ عَالَمِ هَذِهِ الظُّلْمَةِ[b]، وَضِدَّ الْقُوَى الرُّوحِيَّةِ لِلشَّرِّ فِي الْعَوَالِمِ السَّمَاوِيَّةِ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فإن مصارعتنا ليست ضد لحم ودم». والمقصود بـ«لحم ودم» البشر.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ضد حكام العالم لهذه الظلمة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «في الأماكن السماوية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: صراعنا
  rationale: تدل الكلمة على المصارعة أو الاشتباك القريب؛ و«صراع» يحفظ صورة المواجهة ويأتي طبيعيًّا في العربية المعاصرة، مع إثبات «مصارعتنا» في الحاشية بوصفها المقابل الأشد حرفية.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: ضد لحم ودم
  rationale: حُفظت العبارة الجسدية دون تحويلها داخل المتن إلى تفسير مثل «البشر»، كما رُوعي ترتيب اليونانية «دم ولحم» من حيث المعنى، لكن استُعمل الترتيب العربي المألوف «لحم ودم» لسلاسة العبارة.
- source_word: ἀρχάς
  choice: الرئاسات
  rationale: يناسب السياق البولسي الذي يشير إلى قوى ذات سيادة، ويحافظ على تمييزها عن ἐξουσίαι «السلطات» دون حصرها في حكام بشريين.
- source_word: ἐξουσίας
  choice: السلطات
  rationale: ينقل معنى السلطان أو الجهة صاحبة السلطة، ويكوّن مع «الرئاسات» زوجًا واضحًا ومتميزًا.
- source_word: κοσμοκράτορας
  choice: حكام العالم
  rationale: يعكس تركيب اللفظة النادرة، أي المتسلطين على العالم، من غير توسيع تفسيري إلى «قوى كونية».
- source_word: τοῦ σκότους τούτου
  choice: التابعين لهذه الظلمة
  rationale: يبيّن تعلق المضاف إليه بـ«حكام العالم» بوصفهم منتمين إلى هذه الظلمة أو متصفين بها، من غير إضافة معنى «الحاضرة» غير الصريح في النص.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: قوى الشر الروحية
  rationale: الصفة المحايدة المجموعة مستعملة استعمال الاسم وتشير في السياق إلى كيانات أو قوى روحية؛ و«قوى الشر الروحية» واضحة ولا تفترض تنظيمًا عسكريًّا مثل «أجناد».
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: في المجالات السماوية
  rationale: ينقل معنى الحيز السماوي في الاستعمال المتكرر في أفسس، مع إبقاء العبارة واسعة وعدم قصرها على موضع مادي محدد.
theological_decisions:
- issue: طبيعة الخصوم المذكورين
  choice: تُظهر الصياغة أنهم قوى روحية فوق بشرية
  alternative: أن تكون الألفاظ عن حكام ومؤسسات بشرية أساسًا، أو أن تشمل القوى الروحية وتجلياتها الأرضية معًا
  rationale: تراكم الألفاظ، ولا سيما κοσμοκράτορας وτὰ πνευματικὰ τῆς πονηρίας، يدل مباشرة على خصوم روحيين؛ لكن الترجمة لا تنفي إمكان ظهور تأثيرهم عبر نظم أرضية.
- issue: دلالة σάρξ في العبارة
  choice: لحم ضمن التعبير «لحم ودم»
  alternative: الطبيعة الخاطئة أو مجرد البشر
  rationale: الكلمة هنا جزء من تعبير يدل على البشر في وجودهم الجسدي، وليست استعمالًا لاهوتيًّا لـ«الجسد» بمعنى الطبيعة الخاطئة.
- issue: تعلق ἐν τοῖς ἐπουρανίοις
  choice: تتعلق العبارة مباشرة بقوى الشر الروحية
  alternative: إمكان فهمها على نطاق أوسع بوصفها مجال الصراع أو مجال جميع القوى المذكورة
  rationale: الموقع النحوي يرجح تعلقها بالمجموعة الأخيرة، مع بقاء قدر من الاتساع الدلالي في سياق الرسالة؛ لذلك لم تُضف عبارة تفسيرية تحسم المسألة أبعد مما يسمح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية كريمة. استُعمل «صراع» بدل اللفظ الأشد تقليدية «مصارعة» في المتن، مع حفظه في الحاشية. وحُفظت مصطلحات «الرئاسات» و«السلطات» للتمييز بين الألفاظ اليونانية المتجاورة، مع توضيح الطبيعة الروحية للخصوم في العبارة الأخيرة من غير إدخال خصوصية مذهبية.
