  - severity: low
    issue: صياغة «قوى الشر الروحية» تحتمل في العربية أن تكون «الشر» هو الموصوف بالروحية.
    rationale: «القوى الروحية للشر» أوضح في أن القوى هي الروحية وأنها متصلة بالشر، وهو ترتيب أقرب إلى البنية الدلالية اليونانية.
  - severity: low
