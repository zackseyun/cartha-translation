  verdict: revise
  source_fidelity: 'الترجمة تنقل بنية التعداد ومعاني الألفاظ الرئيسة بأمانة عامة: «صراعنا»، «لحم ودم»، «الرئاسات»، «السلطات»، و«حكام العالم» تقابل اليونانية على نحو جيد. لكن «التابعين لهذه الظلمة» توسّع علاقة الإضافة في τοῦ σκότους τούτου إلى تبعية صريحة، في حين أن النص يصفهم ببساطة بأنهم «حكام عالم هذه الظلمة» أو «حكام هذا العالم المظلم» مع بقاء الدلالة غير محسومة أكثر من ذلك.'
  naturalness: الفصحى سليمة إجمالًا، لكن «حكام العالم التابعين لهذه الظلمة» أثقل وأقل طبيعية من الإضافة المباشرة. و«العوالم السماوية» أوضح في العربية المعاصرة من «المجالات السماوية» مع احتفاظه باتساع العبارة اليونانية.
  terminology: «الرئاسات» و«السلطات» يحافظان على التمييز المقصود بين ἀρχαί وἐξουσίαι. والأدق والأوضح في العبارة الأخيرة «القوى الروحية للشر»، إذ يجعل «روحية» وصفًا للقوى و«للشر» مضافًا إليه، موافقًا لـ τὰ πνευματικὰ τῆς πονηρίας.
