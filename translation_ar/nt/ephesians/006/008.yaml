    reason: lexical_clarification
lexical_decisions:
- source_word: εἰδότες
  choice: عالمين
  rationale: يحافظ اسم الفاعل الجمع على الصلة النحوية والحجاجية بالوصية السابقة، من غير أن يحوّل العلاقة صراحةً إلى سببية.
- source_word: ἕκαστος
  choice: كلَّ واحد
  rationale: ينقل التشديد التوزيعي على كل فرد، مع إبقاء المفرد كما في اليونانية.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: مهما يعمل من خير
  rationale: تنقل «مهما» عدم التعيين في ὃ ἂν، وتعبير «من خير» عربي طبيعي يحفظ الصفة الأخلاقية للعمل.
- source_word: τοῦτο
  choice: فهذا عينه
  rationale: يشير اسم الإشارة إلى الخير المذكور سابقًا، وتوضح «عينه» معنى المطابقة من غير تحويل العبارة إلى لغة تجارية.
- source_word: κομίσεται
  choice: سيناله
  rationale: الفعل يدل هنا على نيل ما يعود إلى المرء أو ما يقابل عمله. «سيناله» سليمة عربيًا، بينما يبيّن السياق و«هذا عينه» معنى المقابلة.
- source_word: παρὰ κυρίου
  choice: من الرب
  rationale: تنقل «من» معنى المصدر الذي تؤديه παρά مع المضاف إليه، وتحفظ «الرب» الدلالة الراجحة على الرب الإلهي في السياق البولسي.
- source_word: δοῦλος
  choice: عبدًا
  rationale: في المقابلة الصريحة مع الحر يدل اللفظ على الوضع الاجتماعي لمن هو مستعبَد، و«عبد» هو المقابل العربي المباشر المألوف.
- source_word: ἐλεύθερος
  choice: حرًّا
  rationale: يحفظ المقابلة الاجتماعية الموجزة مع «عبدًا».
theological_decisions:
- issue: دلالة δοῦλος في سياق تعليمات العبيد والسادة
  choice: عبدًا
  alternative: خادمًا
  rationale: المقابلة مع ἐλεύθερος تجعل وضع العبودية، لا مجرد الخدمة، عنصرًا أساسيًا في المعنى؛ لذلك لا يُلطَّف اللفظ إلى «خادم» في المتن.
- issue: دلالة κυρίου ومرجعه
  choice: الرب
  alternative: السيد
  rationale: مع أن السياق يتناول سادة بشريين، فالذي يصدر عنه الجزاء هنا هو الرب الإلهي على الأرجح؛ و«الرب» تحفظ هذه الدلالة من غير إدخال تفسير زائد.
- issue: طبيعة ما يناله فاعل الخير
  choice: فهذا عينه سيناله من الرب
  alternative: فسينال جزاءه من الرب
  rationale: الصياغة المختارة تحافظ على اسم الإشارة τοῦτο وعلى التوتر المجازي في أن الفاعل ينال الخير الذي صنعه، بدل أن تحسمه صراحةً بوصفه «جزاءً».
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. حُفظ ترتيب التشديد على «كل واحد»، واستُعملت الفاء في جواب «مهما» لسلامة التركيب العربي، مع إبقاء الصلة باسم الفاعل «عالمين» وسياقه السابق.
