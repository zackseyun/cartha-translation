lexical_decisions:
- source_word: στῆτε
  choice: اثبتوا
  rationale: فعل أمر موجَّه إلى الجمع ويدعو إلى اتخاذ موقف ثابت. «اثبتوا» طبيعي في العربية ويحمل معنى الوقوف والصمود في السياق من غير إضافة ظرف غير موجود صراحة.
- source_word: οὖν
  choice: إذن
  rationale: تُظهر النتيجة المترتبة على الحث السابق بعبارة عربية موجزة وطبيعية.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: وقد شددتم أوساطكم
  rationale: يحافظ على صورة شدّ منطقة الوسط استعدادًا للعمل أو القتال، وعلى دلالة اسم الفاعل اليوناني السابق للفعل الرئيس أو المصاحب له. وجمع «أوساطكم» هو التعبير العربي الملائم لمخاطبة الجماعة.
- source_word: ἐν ἀληθείᾳ
  choice: بالحق
  rationale: تحافظ الباء على احتمال الوسيلة أو الملابسة، ولا تحوّل العبارة صراحة إلى «حزام الحق»، وهو تفسير ممكن لكنه غير منصوص عليه لفظًا.
- source_word: ἐνδυσάμενοι
  choice: ولبستم
  rationale: صياغة عربية طبيعية لفعل ارتداء اللباس أو السلاح، مع الواو التي تنسق اسم الفاعل الثاني على الأول.
- source_word: θώρακα
  choice: درع
  rationale: اللفظ العربي المألوف لواقية الصدر في صورة السلاح، وهو أوضح للقارئ الحديث من ألفاظ تقنية نادرة.
- source_word: δικαιοσύνης
  choice: البر
  rationale: «البر» هو المقابل الكتابي العربي الطبيعي الذي يشمل الاستقامة والحق الأخلاقي، مع إبقاء معنى «العدل» البديل في الحاشية.
theological_decisions:
- issue: دلالة δικαιοσύνη في استعارة سلاح الله
  choice: البر
  alternative: العدل
  rationale: «البر» يلائم الاستعمال البولسي وصورة الدرع، لكنه لا يستنفد وحده المجال الدلالي للكلمة؛ لذلك حُفظ احتمال «العدل» في الحاشية من غير حسم التوتر الدلالي.
- issue: علاقة الحق بصورة شد الوسط
  choice: بالحق
  alternative: بحزام الحق
  rationale: النص اليوناني يقول حرفيًا إن شد الوسط تم «بالحق/في الحق» ولا يذكر اسم الحزام؛ لذلك تجنبت الترجمة إدخال الحزام في المتن، مع الحفاظ على صورة الاستعداد التي يوحي بها الفعل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «اثبتوا» بدل تركيب أطول مثل «قفوا ثابتين»، واستُبقي بناء «وقد...» ليعكس صلة اسمي الفاعل بالفعل الرئيس من غير تكلف شديد.
