  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: ar
  text: بكل صلاة وطلبة، صلّوا في كل وقت بالروح[a]، ولهذا اسهروا بكل مثابرة وطلبة لأجل جميع القديسين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بروح». قد تُفهم اليونانية بمعنى أعم، لكن السياق يرجّح الإشارة إلى الروح القدس.'
    reason: alternative_reading
  - marker: b
    text: «القديسون» هنا هم جميع شعب الله المقدس، أي جميع المؤمنين.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: بكل صلاة وطلبة
  rationale: تنقل «الباء» معنى الوسيلة الذي تؤديه διά مع المضاف إليه، مع التمييز بين الصلاة عامة والطلبة بوصفها التماسًا محددًا.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: صلّوا في كل وقت
  rationale: صيغ اسم الفاعل المتتابعة في اليونانية مرتبطة بسياق الأمر السابق؛ وصيغة الأمر العربية أوضح وأطبع هنا، مع حفظ معنى الاستمرار والشمول.
- source_word: ἐν πνεύματι
  choice: بالروح
  rationale: يرجح السياق الإشارة إلى الروح القدس، ولا سيما بعد ذكر سيف الروح في العدد السابق؛ وتُذكر القراءة الأعم «بالروح» بمعنى روحي في الحاشية.
- source_word: εἰς αὐτὸ ἀγρυπνοῦντες
  choice: واسهروا لهذا بعينه
  rationale: «اسهروا» تحفظ صورة اليقظة وعدم الغفلة، و«لهذا بعينه» تنقل توكيد αὐτό والإشارة إلى غاية الصلاة المذكورة.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: بكل مثابرة وطلبة
  rationale: تحافظ الصياغة على العطف الصريح في اليونانية ولا تحسم احتمال أن تكون المثابرة وصفًا ملازمًا للطلبة.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: لأجل جميع القديسين
  rationale: «القديسون» المقابل الكنسي المألوف لـἅγιοι، ويشير هنا إلى جميع شعب الله المؤمنين لا إلى فئة محدودة لاحقة.
theological_decisions:
- issue: مرجع πνεύματι
  choice: 'الروح القدس: «بالروح»'
  alternative: الروح البشرية أو الصلاة بروح الإنسان
  rationale: يرجح الاستعمال البولسي والسياق المباشر الإشارة إلى الروح القدس، لكن غياب أداة التعريف في اليونانية يترك احتمال القراءة الأعم قائمًا، لذلك أثبت في الحاشية.
- issue: دلالة ἅγιοι
  choice: جميع المؤمنين بوصفهم شعب الله المقدس
  alternative: فئة مخصوصة من القديسين بالمعنى الكنسي المتأخر
  rationale: اللفظ في رسائل بولس اسم معتاد لجماعة المؤمنين كلها، وليس لفئة معترف بها لاحقًا وحدها.
- issue: العلاقة بين προσκαρτερήσει وδεήσει
  choice: 'الإبقاء على العطف: «بكل مثابرة وطلبة»'
  alternative: «بكل مثابرة في الطلبة»
  rationale: وجود καί يسند العطف المباشر، مع إمكان فهم العبارة دلاليًا على أنها مثابرة في الطلبة؛ فحُفظ التركيب دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «اسهروا» بمعنى تيقظوا، وهو مفهوم ويحفظ صورة اليونانية. أُبقيت «طلبة» للتمييز عن «صلاة»، و«القديسين» مع حاشية تمنع الفهم المتأخر المقيّد.
