source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: ar
  text: وأنتم أيها السادة، عاملوا عبيدكم بالمثل[a]، وكفّوا عن تهديدهم[b]، عالمين أن سيدهم وسيدكم هو في السماوات[c]، وأنه لا محاباة عنده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «افعلوا الأمور نفسها تجاههم»؛ والمقصود أن يعاملوهم وفق المبادئ نفسها الواردة في الوصايا السابقة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «اتركوا التهديد»؛ فالعبارة اليونانية تدل على الكف عن ممارسة التهديد.'
    reason: lexical_alternative
  - marker: c
    text: وردت «السماوات» بصيغة الجمع في اليونانية.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: السادة
  rationale: يشير اللفظ في سياق نظام البيت القديم إلى أصحاب السلطة على العبيد؛ و«السادة» يحفظ الدلالة التاريخية والصلة اللفظية بـ«السيد» السماوي.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: عاملوا عبيدكم بالمثل
  rationale: صياغة عربية طبيعية تحافظ على معنى المعاملة المتبادلة والإحالة إلى الوصايا السابقة، مع إظهار مرجع الضمير دفعًا للالتباس.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: وكفّوا عن تهديدهم
  rationale: ينقل معنى ترك ممارسة التهديد أو التوقف عنها، لا مجرد الامتناع عن تهديد منفرد.
- source_word: εἰδότες
  choice: عالمين
  rationale: يحفظ البنية الحالية في اليونانية، ويُفهم منها أن هذه المعرفة أساس للأمر السابق.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: أن سيدهم وسيدكم
  rationale: يحفظ تكرار جذر κύριος والمقابلة البلاغية بين السادة الأرضيين والسيد السماوي، من غير إدخال تمييز معجمي غير موجود في الأصل.
- source_word: ἐν οὐρανοῖς
  choice: في السماوات
  rationale: يحفظ صيغة الجمع اليونانية، وهي تعبير عربي كتابي واضح وطبيعي.
- source_word: προσωπολημψία
  choice: محاباة
  rationale: لفظ عربي فصيح ومفهوم يدل على تفضيل الأشخاص بغير حق.
- source_word: παρ’ αὐτῷ
  choice: عنده
  rationale: يؤدي التعبير الاصطلاحي مباشرة، دالًا على انتفاء المحاباة في حكمه ومعاملته.
theological_decisions:
- issue: استعمال κύριος للسادة البشر وللسيد السماوي في الآية نفسها
  choice: 'ترجمة الموضعين من الجذر العربي نفسه: «السادة» و«سيدهم وسيدكم»'
  alternative: ترجمة الموضع الثاني «ربهم وربكم»
  rationale: 'تكرار الجذر في الأصل مقصود بلاغيًا: السادة الأرضيون أنفسهم خاضعون لسيد في السماوات. وتحافظ «سيد» على هذا التوتر من غير إنكار أن المرجع الإلهي هو المسيح/الله بحسب السياق.'
- issue: تسمية الفئة الخاضعة للسادة في نظام البيت القديم
  choice: إظهار مرجع الضمير بلفظ «عبيدكم» في عبارة «عاملوا عبيدكم بالمثل»
  alternative: الاكتفاء بـ«عاملوهم بالمثل» أو استعمال «خدمكم»
  rationale: السياق السابق يتحدث عن δοῦλοι، وإظهار المرجع يمنع غموض الضمير؛ أما «خدم» فقد يلطّف الواقع الاجتماعي التاريخي ويقربه خطأً من العمل المأجور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعملت «السادة/سيد» للحفاظ على التكرار البلاغي في اليونانية، و«عبيدكم» لإبقاء السياق الاجتماعي القديم ظاهرًا دون تحديثه إلى علاقة عمل مأجور.
