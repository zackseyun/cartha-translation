reference: Ephesians 6:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: ar
  text: ولكي تعرفوا أنتم أيضًا أخباري[a] وما أفعله، سيُطلعكم تيخيكس، الأخ الحبيب والخادم الأمين في الرب[b]، على كل شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الأمور المتعلقة بي»، ويمكن أن تعني: «أحوالي» أو «ظروفي».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «الخادم الأمين» بـ«القائم بالخدمة الأمين»؛ وقد تعني الكلمة اليونانية في بعض السياقات «شماسًا»، لكن المقصود هنا ليس محسومًا بوصفه رتبة كنسية.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: ولكي
  rationale: تنقل ἵνα الدالة على الغرض، مع تمثيل قوة δέ الرابطة تمثيلًا عربيًا طبيعيًا بالواو.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: تعرفوا أنتم أيضًا
  rationale: يحفظ الضمير الصريح مع καί توكيد أن المخاطَبين أيضًا سيعرفون.
- source_word: τὰ κατ’ ἐμέ
  choice: أخباري
  rationale: تعبير عربي موجز وطبيعي يدل على الأمور المتعلقة ببولس، من غير حصره في صحته أو حالته النفسية؛ وتوضح الحاشية الصيغة الأقرب إلى اللفظ اليوناني.
- source_word: τί πράσσω
  choice: ما أفعله
  rationale: ترجمة مباشرة وواضحة لما يقوم به بولس أو ينشغل به.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: سيُطلعكم ... على كل شيء
  rationale: صياغة عربية طبيعية تحافظ على معنى جعل الأمور معلومة للمخاطَبين.
- source_word: Τυχικὸς
  choice: تيخيكس
  rationale: نقل صوتي للاسم اليوناني وفق الصيغة العربية الشائعة في الترجمات الكتابية.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: الأخ الحبيب
  rationale: يحفظ لغة القرابة الإيمانية ومعنى المحبة، بصياغة عربية مألوفة.
- source_word: πιστὸς διάκονος
  choice: الخادم الأمين
  rationale: διάκονος هنا وصف لوظيفة تيخيكس في الخدمة، ولا يثبت بوضوح أنه اسم رتبة كنسية رسمية؛ و«الخادم» يحفظ المدى الدلالي دون استيراد ذلك التحديد.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ التعبير البولسي الموجز ودلالته العلاقية أو المجالية من غير توسيع تفسيري.
theological_decisions:
- issue: دلالة διάκονος في وصف تيخيكس
  choice: الخادم
  alternative: الوزير أو الشماس
  rationale: السياق يصف معاونًا موثوقًا سيبلّغ أخبار بولس، ولا يحسم أن المقصود رتبة «شماس» الرسمية؛ لذلك تحافظ «الخادم» على المعنى الوظيفي وعلى قدر من الانفتاح الدلالي.
- issue: دلالة ἀδελφός
  choice: الأخ
  alternative: القريب أو الرفيق
  rationale: المشار إليه رجل بعينه من رفقاء الخدمة، لذا «الأخ» دقيقة وتحفظ الاستعارة العائلية المسيحية.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «في الرب» هو المقابل العربي الراسخ للتعبير البولسي، ويحفظ اللقب دون شرح مذهبي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «أخباري» لتجنب ثقل الترجمة الحرفية مع إبقاء البديل الحرفي في الحاشية، ووُضع الوصف الاعتراضي لتيخيكس بين فاصلتين لتوضيح تركيب الجملة.
