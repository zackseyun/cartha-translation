id: EPH.6.22
reference: Ephesians 6:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ar
  text: 'أرسلتُه إليكم لهذا الغرض عينه: لكي تعرفوا أخبارنا[a]، ولكي يشجّع قلوبكم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما يختص بنا»، أو: «أحوالنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: أرسلتُه
  rationale: الضمير الموصول في اليونانية يعود إلى تيخيكس المذكور في الآية السابقة، ودمجه ضميرًا متصلًا بالفعل هو الأسلوب العربي الطبيعي.
- source_word: ἔπεμψα
  choice: أرسلتُ
  rationale: الماضي البسيط ينقل صيغة الماضي اليونانية بوضوح وطبيعية.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: يفيد الاتجاه نحو المخاطَبين مع فعل الإرسال.
- source_word: εἰς αὐτὸ τοῦτο
  choice: لهذا الغرض عينه
  rationale: تحفظ العبارة معنى الغرض وقوة التوكيد في αὐτὸ τοῦτο.
- source_word: ἵνα
  choice: لكي
  rationale: تُظهر أداة الغاية بوضوح أن الجملتين التاليتين تبيّنان غرض الإرسال.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: تعرفوا أخبارنا
  rationale: تعبير عربي موجز وطبيعي يشمل ما يتعلق بحال بولس ورفقائه وظروفهم، من غير حصره في الظروف الخارجية وحدها.
- source_word: καὶ
  choice: ولكي
  rationale: تكرار أداة الغاية يوضح عطف الغرض الثاني على الأول.
- source_word: παρακαλέσῃ
  choice: يشجّع
  rationale: الفعل قد يدل على التشجيع أو التعزية أو الحث؛ والتشجيع يلائم هنا تقوية قلوب المخاطَبين مع إبقاء المجال الدلالي مفتوحًا في الحاشية.
- source_word: τὰς καρδίας ὑμῶν
  choice: قلوبكم
  rationale: يحفظ التعبير الكتابي كما هو، وهو مفهوم وطبيعي في العربية ويدل على باطن الإنسان.
theological_decisions:
- issue: دلالة τὰ περὶ ἡμῶν
  choice: أخبارنا
  alternative: ما يختص بنا؛ أحوالنا
  rationale: العبارة اليونانية واسعة، فتشمل أحوال بولس ورفقائه وما يجري معهم. «أخبارنا» صياغة عربية طبيعية لا تقصرها على الظروف الخارجية.
- issue: دلالة παρακαλέσῃ
  choice: يشجّع
  alternative: يعزّي؛ يحثّ
  rationale: السياق الرعوي وذكر القلوب يرجحان معنى التشجيع والتقوية، مع الاعتراف بأن الفعل اليوناني أوسع دلالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «لهذا الغرض عينه» لحفظ التوكيد، و«يشجّع قلوبكم» للإبقاء على الصورة الكتابية دون تجريدها.
