  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: ar
  text: أَيُّهَا الْأَوْلَادُ، أَطِيعُوا وَالِدَيْكُمْ فِي الرَّبِّ[a]، لِأَنَّ هَذَا صَوَابٌ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بوصفكم منتمين إلى الرب» أو «في اتحادكم بالرب». قد تصف عبارة «في الرب» نطاق الطاعة أو كيفيتها، وقد تفيد أيضًا أن هذه الطاعة يحدّها الولاء للرب.'
    reason: بديل معجمي وتوضيح لغموض العبارة في الأصل
lexical_decisions:
- source_word: τέκνα
  choice: الأولاد
  rationale: نداء جمعي مباشر لأبناء الأسرة، ذكورًا وإناثًا؛ و«الأولاد» تعبير عربي طبيعي يحفظ العلاقة الأسرية من غير توسع تفسيري.
- source_word: ὑπακούετε
  choice: أطيعوا
  rationale: صيغة أمر حاضرة تدعو إلى الطاعة والاستجابة، لا إلى مجرد السماع.
- source_word: γονεῦσιν
  choice: والديكم
  rationale: الاسم الجمع يشير إلى الأب والأم معًا، و«والديكم» ترجمة عربية دقيقة وموجزة.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: 'تحفظ العبارة البولسية الموجزة وما فيها من انفتاح دلالي: فقد تصف نطاق الطاعة أو كيفيتها، أو صلة الأولاد بالرب، مع احتمال أن تفيد ضمنًا أن الولاء للرب يحدّ هذه الطاعة.'
- source_word: δίκαιον
  choice: صواب
  rationale: المقصود هنا ما هو صحيح ولائق أخلاقيًا؛ و«صواب» واضحة في العربية المعاصرة، ولا تحصر المعنى في دلالة قضائية أو اصطلاحية.
theological_decisions:
- issue: نطاق عبارة «في الرب»
  choice: 'ربط العبارة بالأمر: «أطيعوا والديكم في الرب»، مع إبقاء معناها مفتوحًا'
  alternative: أيها الأولاد الذين في الرب، أطيعوا والديكم؛ أو أطيعوا والديكم كما يليق في الرب
  rationale: موضع ἐν κυρίῳ يرجّح تعلقها بفعل الأمر، لكن وجه هذا التعلق غير مصرح به تمامًا. لذلك تحافظ الترجمة المباشرة على احتمال أن تشير إلى مجال الطاعة أو كيفيتها أو هوية الأولاد في الرب، وربما إلى تقييد الطاعة بالولاء له.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل النداء «أيها الأولاد» لإظهار صيغة المخاطبة في اليونانية، مع ألفاظ مألوفة وصياغة موجزة.
