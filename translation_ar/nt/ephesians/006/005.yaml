lexical_decisions:
- source_word: δοῦλοι
  choice: العبيد
  rationale: يدل اللفظ في سياق نظام الأسرة القديم على أشخاص واقعين تحت العبودية، لذلك يحافظ «العبيد» على الحقيقة الاجتماعية ولا يلطّفها إلى «الخدم».
- source_word: ὑπακούετε
  choice: أطيعوا
  rationale: فعل أمر يفيد الطاعة، وهذه الصياغة هي الأوضح والأطبع في العربية.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: تحافظ الصياغة على تعبير الأصل وعلى المقابلة الضمنية بين سلطان السادة في المجال البشري الأرضي والعلاقة بالمسيح، مع إيضاح المقصود في الحاشية.
- source_word: κυρίοις
  choice: سادتكم
  rationale: يشير اللفظ هنا إلى سادة العبيد في البنية المنزلية، و«سادتكم» يلائم السياق ويميّزه من الإشارة اللاحقة إلى المسيح.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: بخوف ورعدة
  rationale: ترجمة مباشرة لعبارة بلاغية مترابطة تحافظ على قوتها واتساقها مع استعمال بولس في مواضع أخرى.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: بإخلاص قلوبكم
  rationale: تفيد ἁπλότης هنا صدق القصد وعدم انقسامه، و«إخلاص قلوبكم» تعبير عربي طبيعي ينقل المعنى الداخلي المقصود.
- source_word: ὡς τῷ Χριστῷ
  choice: كما تطيعون المسيح
  rationale: الفعل مفهوم بالحذف من «أطيعوا»، وإظهاره بالعربية يجعل المقارنة طبيعية من غير مساواة السادة بالمسيح. و«المسيح» ترجمة لقب Χριστός المألوفة والدقيقة.
theological_decisions:
- issue: دلالة κατὰ σάρκα
  choice: بحسب الجسد
  alternative: الدنيويين / من جهة الحياة الأرضية
  rationale: أُبقي تعبير الأصل في المتن لأن له مقابلة لاهوتية واجتماعية مقصودة، وأوضحت الحاشية أنه يقيّد سيادة السادة بالمجال البشري الأرضي.
- issue: نقل δοῦλοι في سياق العبودية
  choice: العبيد
  alternative: الخدم
  rationale: السياق يتناول أشخاصًا خاضعين لسادة ضمن نظام العبودية؛ لذلك لا يصح حجب هذه الحقيقة الاجتماعية بلفظ أخف.
- issue: نقل Χριστῷ
  choice: المسيح
  alternative: للمسيح بصياغة حرفية محذوفة الفعل
  rationale: Χριστός مستعمل بوصفه لقبًا، و«المسيح» ينقل اللقب مباشرة. أُظهر فعل الطاعة المفهوم من السياق لتستقيم العربية مع بقاء قوة المقارنة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُعمل النداء «يا أيها» لمخاطبة الجماعة، وحُفظت العبارة الاصطلاحية «بخوف ورعدة»، مع تجنب تلطيف واقع العبودية أو تحميل الآية موقفًا مذهبيًا غير مصرّح به.
