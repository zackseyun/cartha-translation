lexical_decisions:
- source_word: δέξασθε
  choice: تسلَّموا
  rationale: فعل أمر للجمع، و«تسلَّموا» يحفظ معنى أخذ ما يُقدَّم أو يُعطى، ويلائم صورة العُدّة الحربية دون أن يوحي بالانتزاع بالقوة.
- source_word: περικεφαλαίαν
  choice: خوذة
  rationale: المقابل العربي المباشر والطبيعي لغطاء الرأس الواقي في السياق العسكري.
- source_word: τοῦ σωτηρίου
  choice: الخلاص
  rationale: يحفظ تركيب الإضافة واتساع الدلالة، من غير حصرها في نجاة زمنية بعينها.
- source_word: μάχαιραν
  choice: سيف
  rationale: مقابل واضح وطبيعي للسلاح ذي النصل؛ ولا تستلزم اللفظة اليونانية في المتن العربي تحديده بسيف قصير أو خنجر.
- source_word: τοῦ πνεύματος
  choice: الروح
  rationale: السياق البولسي يرجّح الإشارة إلى الروح القدس، وصيغة «الروح» العربية المعرَّفة تحفظ التعبير موجزًا من غير إضافة كلمة غير موجودة صراحة في الأصل.
- source_word: ὅ ἐστιν
  choice: الذي هو
  rationale: يؤدي وظيفة الجملة التفسيرية، ويربط «سيف الروح» بما يأتي بعده على نحو طبيعي في العربية.
- source_word: ῥῆμα θεοῦ
  choice: كلمة الله
  rationale: صياغة عربية مألوفة تحفظ المعنى العام والرنين اللاهوتي، مع بيان احتمال «قول الله» في الحاشية لأن ῥῆμα قد يبرز الكلام المنطوق أو الرسالة المعلنة.
theological_decisions:
- issue: مرجع «الروح»
  choice: الروح القدس
  alternative: الروح البشرية أو معنى روحي عام
  rationale: في صورة سلاح الله عند بولس، الأرجح أن السيف منسوب إلى الروح القدس أو مقدَّم منه، ولا سيما أن العبارة التالية تعرّفه بأنه كلمة الله. ومع ذلك لم يُضف «القدس» إلى المتن لأن النص اليوناني يقول «الروح» فقط.
- issue: علاقة «الذي هو» بما قبله
  choice: تفسير سيف الروح بأنه كلمة الله
  alternative: إرجاع الضمير إلى اسم مفرد سابق على نحو نحوي ضيق
  rationale: الضمير اليوناني المحايد لا يطابق «السيف» المؤنث نحويًا، ولذلك يُفهم طبيعيًا على أنه يفسر صورة السيف أو مضمونها إجمالًا؛ والترجمة العربية تحافظ على المقصود التفسيري بصياغة سليمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «تسلَّموا» بدل «اقبلوا» لأنه أنسب لتناول قطعة من العُدّة، مع إبقاء البديل المباشر في الحاشية. حُفظ الإيقاع المتوازي بين «خوذة الخلاص» و«سيف الروح»، ولم تُضف تعيينات عقائدية إلى المتن.
