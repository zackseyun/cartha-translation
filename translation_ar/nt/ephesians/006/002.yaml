  rationale: تنقل المعنى السياقي بوضوح، أي أن هذه الوصية تصحبها أو تقترن بها عِدة، مع إثبات الصياغة الحرفية البديلة في الحاشية.
theological_decisions:
- issue: علاقة «الوصية الأولى» بترتيب الوصايا ومقصد بولس
  choice: الوصية الأولى المقترنة بوعد
  alternative: الوصية الأولى في وعد؛ أو أولى وصايا اللوح الثاني
  rationale: تفيد العبارة في سياقها أن الوصية متميزة باقترانها بوعد، من غير فرض طريقة طائفية في ترقيم الوصايا أو تفسير «الأولى» بمعنى «الأعظم».
