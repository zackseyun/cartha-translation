  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: ar
  text: في كل الأحوال، احملوا ترس الإيمان، الذي به ستقدرون على إطفاء جميع سهام الشرير الملتهبة.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جميع مقذوفات الشرير الملتهبة»؛ فاللفظ اليوناني قد يشير إلى المقذوفات عمومًا، وإن كانت «السهام» أنسب للصورة هنا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سهام الشر الملتهبة»؛ يمكن أن تدل العبارة اليونانية على «الشرير» شخصيًا أو على «الشر» بمعناه المجرد.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: وفوق هذا كلِّه
  rationale: تحتمل العبارة «في كل الأحوال» أو «مع هذا كلّه/فوق هذا كلّه». وفي سياق تعداد السلاح، تفيد هنا إضافة الترس إلى ما سبق، مع بقاء الاحتمال الظرفي مذكورًا في الحاشية.
- source_word: ἀναλαβόντες
  choice: احملوا
  rationale: اسم الفاعل اليوناني تابع لسلسلة الحثّ في السياق، وصيغة الأمر العربية تنقل قوته بوضوح وطبيعية.
- source_word: θυρεὸν
  choice: ترس
  rationale: يدل اللفظ على ترس كبير، و«ترس» هو المقابل العسكري العربي الواضح من غير إضافة وصف غير مصرح به في النص.
- source_word: τῆς πίστεως
  choice: الإيمان
  rationale: الإضافة تصف الترس مجازيًا بأنه الإيمان؛ وهذا يحفظ المصطلح البولسي المألوف من غير حصره في معنى أضيق.
- source_word: ἐν ᾧ
  choice: الذي به
  rationale: يعود الضمير إلى الترس، وحرف الجر يفيد الوسيلة؛ و«به» تعبير عربي موجز وطبيعي.
- source_word: δυνήσεσθε
  choice: ستقدرون
  rationale: يحفظ زمن المستقبل ومعنى القدرة.
- source_word: βέλη
  choice: سهام
  rationale: اللفظ اليوناني عام للمقذوفات، و«سهام» واضح ويلائم صورة الحرب؛ أما «نبال» فبديل عربي صحيح.
- source_word: τοῦ πονηροῦ
  choice: الشرير
  rationale: الصفة المعرفة المستعملة اسميًا تُفهم على الأرجح إشارةً شخصية في سياق الحرب الروحية، مع إمكان فهمها بمعنى الشر على نحو مجرد.
- source_word: πεπυρωμένα
  choice: المشتعلة
  rationale: ينقل صورة المقذوفات التي أُضرمت فيها النار بلغة عربية حديثة وطبيعية.
- source_word: σβέσαι
  choice: أن تُطفئوا
  rationale: الفعل يعني إخماد النار، و«تطفئوا» يحفظ الصورة بوضوح.
theological_decisions:
- issue: دلالة τοῦ πονηροῦ
  choice: الشرير
  alternative: الشر
  rationale: القراءة الشخصية أنسب لصورة مهاجم في سياق الحرب الروحية، لكن التركيب اليوناني يسمح أيضًا بالدلالة المجردة، ولذلك حُفظ البديل في الحاشية.
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: «الإيمان» هو المقابل الأوسع والأرسخ هنا، ويناسب صورة الاتكال الدفاعي من غير أن يفرض تحديدًا مذهبيًا زائدًا.
- issue: دلالة ἐν πᾶσιν
  choice: وفوق هذا كلِّه
  alternative: في كل الأحوال
  rationale: يمكن أن تُفهم العبارة على أنها انتقال إلى قطعة السلاح التالية بوصفها مضافة إلى الجميع، كما يمكن أن تكون ظرفية بمعنى «في كل حال». اختيرت الأولى للسياق، وحُفظت الثانية في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «ترس» و«سهام» للمحافظة على الصورة العسكرية، وصيغت العبارة في أسلوب حثّي طبيعي متصل بالسياق.
