  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: ar
  text: الذي لأجله أنا سفير في القيود[a]، لكي أتكلّم فيه بجرأة[c]، كما ينبغي لي أن أتكلّم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في قيد» أو «في سلسلة» بالمفرد؛ والمقصود أنه سفير وهو سجين.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «لكي أتكلّم فيه بجرأة». والضمير في اليونانية محايد، ويرجح أنه يشير إلى الإنجيل أو سرّه؛ أي في سياق إعلانه أو الحديث عنه، لا إلى شخص.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: الذي من أجله
  rationale: تفيد ὑπέρ هنا العمل لأجل الأمر السابق ذكره، واسم الموصول اليوناني محايد مفرد، فيرجّح رجوعه إلى «سرّ الإنجيل» في الآية السابقة.
- source_word: πρεσβεύω
  choice: أعمل سفيرًا
  rationale: يحفظ معنى القيام بمهمة سفير أو مبعوث رسمي، مع صياغة عربية طبيعية.
- source_word: ἐν ἁλύσει
  choice: في القيود
  rationale: النص اليوناني يقول حرفيًا «في قيد/سلسلة» بالمفرد، أما الجمع في العربية فيؤدي بصورة طبيعية معنى الأسر والسجن ويحفظ صورة التقييد.
- source_word: ἵνα
  choice: لكي
  rationale: تُظهر أداة الغاية بوضوح، إذ يذكر بولس الغرض من طلب الصلاة السابق.
- source_word: ἐν αὐτῷ
  choice: عنه
  rationale: الضمير اليوناني محايد مفرد، ويرجح رجوعه إلى الإنجيل أو سرّه؛ و«عنه» تنقل المعنى السياقي، أي في شأنه أو عند إعلانه، بصورة عربية واضحة.
- source_word: παρρησιάσωμαι
  choice: أتكلّم عنه بجرأة
  rationale: الفعل يدل على الجهر والانفتاح والشجاعة في القول؛ وإضافة «بجرأة» تحفظ هذا المعنى صراحة.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: كما ينبغي لي أن أتكلّم
  rationale: تنقل δεῖ بوصفه دالًا على ما يلزم أو يجب، وتحافظ على ذكر فعل الكلام الوارد صراحة في اليونانية.
theological_decisions:
- issue: مرجع اسم الموصول والضمير اللاحق
  choice: يُفهم كلاهما على أنه عائد إلى الإنجيل أو «سرّ الإنجيل» المذكور في الآية 19.
  alternative: يمكن فهم الإشارة على نحو أوسع إلى الكرازة بالإنجيل؛ وقد فسر بعضهم ἐν αὐτῷ تفسيرًا شخصيًا بمعنى «فيه» أي في شخص، لكن صيغة الضمير اليونانية المحايدة لا ترجّح ذلك.
  rationale: اسم الموصول οὗ والضمير αὐτῷ محايدان مفردان بحسب الصيغة اليونانية، مما يرجح مرجعًا محايدًا هو السر أو الإنجيل، من غير إدخال مرجع شخصي لا تدل عليه الصيغة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «أعمل سفيرًا» لإبراز مهمة التمثيل، و«في القيود» للتعبير الطبيعي عن السجن مع إبقاء الصورة الأصلية في الحاشية. حُفظ تكرار فعل الكلام في ختام الآية لأنه ظاهر في بنية النص اليوناني.
