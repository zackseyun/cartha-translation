theological_decisions:
- issue: Whether to include Cain's spoken words absent from the Masoretic Text
  chosen_reading: Retain the shorter Masoretic wording in the main text for now, while footnoting the clause 'Let us go out to the field' preserved by ancient witnesses.
  alternative_readings:
  - Retain the shorter MT in the main text without supplied speech
  - Include 'Let us go into the field' as a slightly different English form
  rationale: This is primarily a textual decision rather than a doctrinal one. The shorter MT is abrupt, while multiple ancient witnesses preserve the speech, but coherence by itself does not prove that the longer form is earlier. Direct Hebrew witness 4QGenb (4Q2) demonstrates that the shorter form was already in circulation in the Judean Desert period. The current text therefore retains the shorter wording while image verification and formal adjudication remain outstanding.
  doctrine_reference: Translation philosophy §1 (original-language primacy) and §3 (preserve tension/alternatives in footnotes)
