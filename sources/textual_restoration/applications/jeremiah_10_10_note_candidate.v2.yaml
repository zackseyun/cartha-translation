theological_decisions:
- issue: Rendering the divine name יהוה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Conjunction at verse opening
  chosen_reading: But Yahweh
  alternative_readings:
  - And Yahweh
  rationale: The immediate literary context contrasts Yahweh with idols; 'But Yahweh' expresses that contrast, while 'And Yahweh' preserves the connective alternative noted in footnote a.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
