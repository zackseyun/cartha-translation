  to: 그러면 이 복은 할례받은 사람들에게만 해당합니까, 아니면 할례받지 않은 사람들에게도 해당합니까? 우리가 말하기를, 「아브라함의 믿음이 의로 여겨졌다」 하였기 때문입니다.
