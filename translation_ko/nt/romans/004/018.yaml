  source_fidelity: 초안은 παρ᾽ ἐλπίδα/ἐπ᾽ ἐλπίδι의 역설을 대체로 보존하고 인용문의 의미도 전달합니다. 그러나 「되게 하시려는」은 원문에 없는 행위자(하나님)를 도입하는 사역적 표현입니다. εἰς τὸ γενέσθαι αὐτόν은 아브라함이 많은 민족의 아버지가 되는 목적/결과를 나타내므로, 행위자를 특정하지 않는 표현으로 고쳐야 합니다.
  naturalness: 「소망을 거슬러 소망 가운데 믿었으니」는 직역적이어서 다소 부자연스럽습니다. 「소망이 없는데도 소망을 품고 믿었습니다」는 두 전치사구의 역설을 현대 표준 한국어로 자연스럽게 나타냅니다. 합쇼체 문장으로도 적절합니다.
  terminology: ἐθνῶν은 창세기 약속의 문맥에 맞게 「민족」으로 유지합니다. σπέρμα는 집합적 단수의 이미지를 살리는 「후손」으로 옮기고, 「씨」라는 직역 대안을 각주로 제시합니다. 「믿었습니다」는 πιστεύω에 적절합니다.
