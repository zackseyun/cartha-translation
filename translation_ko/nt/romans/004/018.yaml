base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
  footnotes:
  - marker: a
    text: Or “beyond hope” or “contrary to hope.”
    reason: lexical_alternative
  - marker: b
    text: Or “your seed,” preserving the singular collective image of the Greek.
    reason: lexical_alternative
  - marker: c
    text: Quoted from Genesis 15:5; compare Genesis 17:5.
    reason: cross_reference
translation:
  language: ko
  text: 그는 소망이 없는데도[a] 소망을 품고 믿었습니다. 이는 그가 많은 민족의 아버지가 되도록, 말씀하신 바, 곧 「네 후손[b]이 이와 같을 것이다」 하신 대로였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “소망을 넘어” 또는 “소망에 반하여.”
    reason: παρ’ ἐλπίδα의 가능한 어휘적 뉘앙스를 제시합니다.
  - marker: b
    text: 또는 “네 씨.” 그리스어는 집합적 의미를 지닌 단수형을 사용합니다.
    reason: σπέρμα의 단수 집합적 이미지를 보존하는 직역 대안을 제시합니다.
  - marker: c
    text: 창세기 15:5 인용; 창세기 17:5도 비교하십시오.
    reason: 바울의 성경 인용 출처와 관련 본문을 밝힙니다.
