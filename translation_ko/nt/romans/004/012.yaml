  source_fidelity: 현 초안은 πατέρα περιτομῆς를 ‘할례자의 아버지’로 자연스럽게 풀었으나, ‘되시려는 것입니다’는 원문의 현재 서술(문맥상 4:11에 이어지는 ‘아버지이시다’)과 맞지 않습니다. 또한 ‘...자들에게만이 아니라’는 수식 범위가 다소 불분명합니다. 수정문은 할례만으로 규정되지 않고 아브라함의 믿음을 본받아 걷는 이들에게도 아브라함이 할례의 아버지라는 구조를 보존합니다.
  naturalness: ‘무할례 중에’는 이해 가능하지만 현대 표준어에서는 ‘무할례 상태에 있을 때’가 더 자연스럽고 분명합니다. ‘발자취를 따라 걷는’은 원문의 비유를 잘 살리므로 유지했습니다.
  terminology: περιτομή의 추상명사 표현을 ‘할례의 아버지’로 보존하여 원문의 다소 압축적인 표현을 유지했습니다. πίστις는 문맥에 맞게 ‘믿음’으로, ἀκροβυστία는 ‘무할례 상태’로 옮겼습니다. ‘우리 아버지 아브라함’도 공동체적 호칭을 보존합니다.
  issues:
