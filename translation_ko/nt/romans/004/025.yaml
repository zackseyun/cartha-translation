review_pass:
  verdict: revise
  source_fidelity: 그리스어의 두 수동태(παρεδόθη, ἠγέρθη)와 첫째 διά+대격의 인과적 의미, 둘째 구문의 목적적 해석을 대체로 잘 반영합니다. 다만 「일으킴을 받으셨습니다」는 한국어 문장으로 부자연스럽고, 「의롭게 되심」은 δικαίωσις의 법정적·선언적 뉘앙스를 충분히 드러내지 못합니다. 둘째 διά+대격의 논쟁적인 인과적 가능성은 각주로 보존하는 것이 필요합니다.
  naturalness: 「내어주심을 받으셨고」와 「일으키심을 받으셨습니다」는 수동형을 보존하면서도 현대 표준 한국어에서 더 자연스럽습니다. 「우리의 의롭다 하심」은 바울 서신의 법정적 용례를 자연스럽고 정확하게 전달합니다.
  terminology: παράπτωμα은 여기서 「범죄」로 옮길 수 있습니다. δικαίωσις는 단순한 내적 변화로 읽힐 수 있는 「의롭게 되심」보다 「의롭다 하심」이 법정적 선언의 의미를 더 잘 보존합니다. 특정 교단의 전문어인 「칭의」는 본문에 강제하지 않았습니다.
  issues:
  - severity: medium
    issue: 「일으킴을 받으셨습니다」의 비자연스러운 수동 표현
    rationale: ἠγέρθη의 수동태는 유지되어야 하나, 한국어에서는 「일으키심을 받으셨습니다」가 문법적·문체적으로 더 자연스럽습니다.
  - severity: medium
    issue: 「의롭게 되심」이 δικαίωσις의 법정적 의미를 약화함
    rationale: δικαίωσις는 이 문맥에서 ‘의롭다고 인정/선언됨’이라는 법정적 정당화의 의미를 지니므로 「의롭다 하심」이 더 적절합니다.
  - severity: medium
    issue: 둘째 διά+대격의 대안적 인과 해석에 대한 각주 부재
    rationale: 「~을 위하여」가 문맥상 적절한 본문 선택이지만, 「~ 때문에」라는 문법적으로 가능한 해석은 각주로 보존해야 합니다.
  revised_text: 그분은 우리의 범죄 때문에 내어주심을 받으셨고, 우리의 의롭다 하심을 위하여[a][b] 일으키심을 받으셨습니다.
  revised_footnotes:
