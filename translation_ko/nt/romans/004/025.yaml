    reason: lexical_alternative
  revision_rationale: 그리스어의 수동태와 두 διά 구문의 대조를 보존했습니다. 첫째 구문은 인과적으로 「때문에」, 둘째 구문은 문맥상 목적적 의미로 「위하여」로 옮기되, 논쟁적인 인과 해석은 각주로 남겼습니다. 또한 수동 표현과 δικαίωσις의 법정적 의미를 더 자연스러운 현대 합쇼체로 다듬었습니다.
