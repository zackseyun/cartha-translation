review_pass:
  verdict: revise
  source_fidelity: 첫 번째 διὰ + 대격은 원인으로, 두 번째는 문맥상 목적/지향으로 옮긴 현행 방향이 적절합니다. 다만 「범죄」는 παράπτωμα의 일반적 도덕적 ‘허물/잘못’보다 형사 범죄의 뉘앙스를 강하게 만들며, 「일으킴을 받으셨습니다」는 ἠγέρθη의 수동태를 반영하려 하나 현대 한국어에서 비문에 가깝습니다.
  naturalness: 「일으키심을 받으셨습니다」가 수동태와 합쇼체를 모두 자연스럽게 보존합니다. 「의롭다 하심」은 δικαίωσις의 법정적·관계적 의미를 간결하고 통용되는 한국어로 나타냅니다.
  terminology: παραπτώματα는 「허물」로, δικαίωσιν은 「의롭다 하심」으로 수정하는 것이 본문의 의미 영역과 한국어 성경 문체에 더 충실합니다. 두 번째 διά + 대격의 인과적 가능성은 각주에서 보존해야 합니다.
  issues:
  - severity: medium
    issue: 「일으킴을 받으셨습니다」의 비자연스러운 명사화
    rationale: ἠγέρθη의 수동 의미는 유지하지만, 현대 표준 한국어에서는 「일으키심을 받으셨습니다」가 자연스럽고 문법적으로 명료합니다.
  - severity: low
    issue: παραπτώματα를 「범죄」로 번역
    rationale: 「범죄」는 법적 범죄를 연상시켜 παράπτωμα의 더 넓은 ‘허물, 잘못, 범함’의 의미를 다소 좁힙니다.
  - severity: medium
    issue: 두 번째 διὰ + 대격의 대안적 인과 의미를 보존하는 각주 부재
    rationale: 「우리의 의롭다 하심 때문에」라는 문법적으로 가능한 해석을 각주로 제시하여 본문의 논쟁적 모호성을 보존할 필요가 있습니다.
  revised_text: 그분은 우리의 허물 때문에 넘겨지셨고, 우리의 의롭다 하심을 위하여 일으키심을 받으셨습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “우리의 의롭다 하심 때문에.”
    reason: alternative_reading
  - marker: b
    text: 「의롭다 하심」은 무죄로 선언됨 또는 의로운 사람으로 인정됨으로도 표현할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 수동태 구조와 두 절의 대칭을 유지하되, 한국어에서 어색한 「일으킴을 받으셨습니다」를 자연스러운 「일으키심을 받으셨습니다」로 고쳤습니다. παράπτωμα에는 「허물」을 사용하여 의미를 과도하게 형사화하지 않았고, δικαίωσις에는 「의롭다 하심」을 사용하여 법정적 의미를 보존했습니다. 본문은 문맥상 「~을 위하여」를 유지하고, δεύτερον διά의 인과적 가능성은 각주로 남겼습니다.
