translation:
  language: ko
  text: 그러므로 그것은 믿음에 근거합니다. 이는 은혜에 따라 이루어지게 하려는 것이며, 그리하여 그 약속이 모든 후손에게 확실히 보장되게 하려는 것입니다—율법에 속한 사람들에게만이 아니라 아브라함과 같은 믿음을 가진 사람들에게도 말입니다. 아브라함은 우리 모두의 아버지이십니다.
  philosophy: optimal-equivalence
