revisions:
- from: 이런 까닭에 약속은 믿음을 따른 것이니, 은혜를 따라 임하게 하시려 함이며, 그리하여 약속이 모든 후손에게 — 율법에 속한 자들에게만이 아니라 아브라함의 믿음에 속한 자들에게도 — 확실하게 되게 하시려는 것입니다. 그는 우리 모두의 아버지이십니다.
  to: 그러므로 그것은 믿음에 근거합니다. 이는 은혜에 따라 이루어지게 하려는 것이며, 그리하여 그 약속이 모든 후손에게 확실히 보장되게 하려는 것입니다—율법에 속한 사람들에게만이 아니라 아브라함과 같은 믿음을 가진 사람들에게도 말입니다. 아브라함은 우리 모두의 아버지이십니다.
  rationale: 문맥상 생략된 주어는 ‘그것’으로 보존하고, 목적절의 의미를 현대 한국어로 자연스럽게 재구성했습니다. 또한 약속이 모든 후손에게 확실히 보장된다는 본문의 관계를 명료하게 했으며, 아브라함의 믿음에 속한 사람들은 과도한 교리적 해석 없이 최소한의 명료화로 옮겼습니다.
