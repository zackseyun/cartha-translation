    rationale: ἵνα κατὰ χάριν은 ‘은혜에 따라 [이루어지도록]’이라는 목적을 표현합니다. ‘하시려’는 하나님을 문법적 주체로 암시하므로 피하는 것이 안전합니다.
  - severity: medium
