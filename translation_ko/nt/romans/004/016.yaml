    issue: 첫 구절에서 생략된 주어를 ‘약속’으로 확정함
    rationale: διὰ τοῦτο ἐκ πίστεως는 문맥상 앞선 논의의 ‘그것’(상속/획득의 근거)을 가리키며, 이 절 안에서 약속은 뒤의 ἐπαγγελία로 나타납니다. ‘그것’으로 유지하는 편이 본문의 생략과 문맥 연결을 보존합니다.
  - severity: medium
