  source_fidelity: 그리스어 수동태 ἐλογίσθη를 ‘여겨졌습니다’로, αὐτῷ εἰς δικαιοσύνην을 ‘그에게 의로’로 옮겨 회계·인정의 비유와 결과/지위의 표현을 충실히 보존했습니다. ‘그것’은 바로 앞 문맥에서 말한 아브라함의 믿음을 가리키는 영어 감사본의 ‘it’와 대응하며, 본절만으로는 선행사를 덧붙이지 않아도 됩니다.
  naturalness: ‘그러므로 그것이 그에게 의로 여겨졌습니다’는 현대 표준어 합쇼체로 자연스럽고, 로마서 4장의 반복되는 ‘의로 여김’ 표현과도 잘 어울립니다.
  terminology: δικαιοσύνη는 바울 문맥에서 핵심어인 ‘의’로 일관되게 번역되었고, ἐλογίσθη는 특정 교리적 설명을 첨가하지 않는 ‘여겨졌습니다’로 적절히 처리되었습니다.
