  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
  footnotes:
  - marker: a
    text: 'Or, in another textual tradition: ''he did not consider his own body, which was as good as dead.'''
    reason: textual_variant
  - marker: b
    text: Or 'sterility' for 'deadness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 믿음이 약해지지 않은 채, 거의 백 세가 된 자신의 몸이 죽은 것이나 다름없는 상태와 사라의 태가 죽은 상태를 살펴보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατενόησεν
  english_pob_choice: considered
  chosen_korean: 깊이 살폈습니다
  alternatives_korean:
  - 고려했습니다
  - 주시했습니다
  lexicon: BDAG
  rationale: 강조 κατα-의 「철저히 ~함」을 「깊이 살피다」로 옮긴다. 본 절의 핵심은 그가 현실을 직시했음에도 믿음이 약해지지 않았다는 것.
- source_word: νενεκρωμένον / νέκρωσιν
  english_pob_choice: as good as dead / deadness
  chosen_korean: 이미 죽은 것과 같음 / 죽었음
  alternatives_korean:
  - 죽은 상태 / 죽음의 상태
  lexicon: BDAG
  rationale: 같은 어근의 두 용례를 「죽음」으로 일관 처리해 어휘적 연결을 보존한다.
