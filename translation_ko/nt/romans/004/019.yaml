revisions:
- from: 그는 믿음이 약해지지 않고, 백 세쯤 된 자기 몸이 이미 죽은 것과 같음과, 사라의 태가 죽었음을 깊이 살폈습니다.
  to: 그는 믿음이 약해지지 않은 채, 거의 백 세가 된 자신의 몸이 죽은 것이나 다름없는 상태와 사라의 태가 죽은 상태를 살펴보았습니다.
  rationale: 'The revision preserves the source order and contrast: Abraham did not weaken in faith, yet deliberately considered the humanly impossible circumstances. ‘거의 백 세’ restores πού; the two coordinated expressions are made parallel and idiomatic; and the paired death imagery is retained without replacing it with an interpretive term such as ‘불임.’'
  reviewer_model: gpt-5.6-terra
