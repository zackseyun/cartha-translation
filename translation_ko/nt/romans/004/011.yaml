revisions:
- from: 그리고 그는 할례의 표를 받았으니, 그것은 그가 무할례 중에 가졌던 믿음의 의의 인장이었습니다. 이는 그가 무할례 중에 믿는 모든 자의 아버지가 되어, 그들에게도 의가 여겨지게 하시려는 것이며,
  to: 또한 그는 할례라는 표징을 받았습니다. 그것은 그가 무할례 상태에 있을 때 가졌던 믿음에서 비롯된 의를 확증하는 인이었습니다. 이는 그가 무할례 상태에서 믿는 모든 사람의 아버지가 되고, 그들에게도 의가 여겨지게 하려는 것이었습니다.
  rationale: The revision corrects the purpose-clause subject, clarifies the Greek genitive sequence, preserves circumcision as subsequent sign/seal rather than a means of righteousness, and renders the final passive accounting expression with Korean wording that remains close to the source. No footnote is necessary because the main text adequately conveys the intended sense and no textual ambiguity requires annotation.
