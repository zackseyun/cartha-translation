  - 인친 표
  lexicon: BDAG
  rationale: 인증·확증의 함의를 「인장」으로 옮긴다.
- source_word: πατέρα
  english_pob_choice: father
  chosen_korean: 아버지
  alternatives_korean:
  - 조상
  lexicon: BDAG
  rationale: 4장의 아브라함 논증 핵심어 πατήρ를 일관되게 「아버지」로 옮긴다(4:11-18).
