source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
  footnotes:
  - marker: a
    text: Or, more interpretively, "calls into existence the things that do not exist."
    reason: alternative_reading
  - marker: b
    text: '"Nations" here may also be understood as "Gentiles," but in this Genesis quotation the broader sense is more likely.'
    reason: lexical_alternative
translation:
  language: ko
  text: (기록된 바, “내가 너를 많은 민족의 아버지로 세웠다” 하신 것과 같이) 그가 믿은 하나님, 곧 죽은 이들에게 생명을 주시고 없는 것들을 있는 것처럼 부르시는 분 앞에서 그러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθνῶν
  english_pob_choice: nations
  chosen_korean: 민족
  alternatives_korean:
  - 이방인
  - 열방
  lexicon: BDAG
  rationale: 창 17:5 인용 문맥에서는 「이방인」보다 「민족」이 더 적합하다.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  english_pob_choice: gives life to the dead
  chosen_korean: 죽은 자들에게 생명을 주시며
  alternatives_korean:
  - 죽은 자들을 살리시며
  lexicon: BDAG
  rationale: 동사의 강도를 「생명을 주시다」로 옮긴다.
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  english_pob_choice: calls the things that are not as though they were
  chosen_korean: 없는 것들을 있는 것 같이 부르시는
  alternatives_korean:
  - 존재하지 않는 것들을 존재하는 것처럼 부르시는
  - 무에서 유를 부르시는
  lexicon: BDAG
  rationale: 창조 능력의 함의를 직역으로 보존한다.
