  language: ko
  text: 그러면 그것은 어떤 때에 여겨졌습니까? 그가 할례를 받은 상태에 있을 때입니까, 할례를 받지 않은 상태에 있을 때입니까? 할례를 받은 상태에 있을 때가 아니라 할례를 받지 않은 상태에 있을 때였습니다.
