  to: 그러나 우리를 위해서도 그러합니다. 곧 우리 주 예수를 죽은 사람들 가운데서 일으키신 분을 믿는 우리에게도 그것이 여겨질 것입니다.[a][b]
  rationale: 대조·첨가 접속 표현을 「그러나 ... 위해서도」로 반영하고, 앞 절에서 이어지는 λογίζεσθαι의 목적어는 「그것이」로만 보충하여 문맥상의 생략을 유지했습니다. 부활 관용 표현은 「죽은 사람들 가운데서 일으키신」으로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
