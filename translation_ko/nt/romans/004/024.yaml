    issue: ἀλλὰ καὶ의 대조·첨가 의미가 약화됨
    rationale: 「또한」은 καὶ는 반영하지만 ἀλλά의 ‘그러나/그뿐 아니라’ 기능을 드러내지 못합니다.
  - severity: medium
    issue: λογίζεσθαι의 생략된 목적어가 한국어 문장에서 불분명함
    rationale: 그리스어는 앞 문맥의 ‘의’를 생략하지만, 한국어에서는 「그것이」를 보충해야 ‘무엇이 여겨지는지’가 자연스럽게 연결됩니다. 이는 ‘의’라는 명사를 본문에 과도하게 명시하지 않고 원문의 생략을 보존합니다.
