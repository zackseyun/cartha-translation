  source_fidelity: 원문의 대조 구조(불신앙으로 흔들리지 않음/믿음으로 강해짐)와 하나님께 영광을 돌리는 결말을 충실히 반영합니다. ‘강해져’는 ἐνεδυναμώθη의 수동성을 한국어의 자연스러운 비인칭적 변화 표현으로 무리 없이 옮기며, 강화의 주체를 본문 이상으로 특정하지 않습니다.
