  - severity: high
    issue: 문장 종결 및 부정 구조 미완성
    rationale: ‘단지 그를 위해서만이 아니라,’는 ‘뿐 아니라’의 뒤 절이 없이 끝나며, 원문의 ‘μόνον’에 대한 ‘not ... alone’ 구조도 한국어에서 완결되어야 합니다.
  revised_text: 그러나 “그에게 인정되었다”라고 기록된 것은 그만을 두고 한 말만은 아닙니다.[a]
