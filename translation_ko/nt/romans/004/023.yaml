  verdict: revise
  source_fidelity: 초안의 ‘그를 위해서만’은 δι’ αὐτόν의 문맥상 ‘그만을 두고/그에 관해서’라는 뜻보다 수혜의 의미로 들릴 수 있습니다. 또한 ‘단지 … 아니라’는 문장이 미완성입니다. 수정문은 기록의 대상이 아브라함 한 사람에만 한정되지 않는다는 부정의 범위를 보존합니다.
  naturalness: ‘그만을 두고 한 말만은 아닙니다’는 현대 표준어 합쇼체로 자연스럽고, 절 단위로도 완결됩니다. 인용문의 ‘인정되었다’는 목적어가 문맥상 생략된 원문의 형태를 과도하게 보충하지 않습니다.
  terminology: λογίζομαι는 바울의 논증에서 회계·산정의 뉘앙스를 지니므로 ‘인정되었다’를 사용하고, ‘계산되었다/여겨졌다’를 각주에 제시합니다. 고유명사나 교리적 해석을 추가하지 않았습니다.
