  source_fidelity: 그리스어의 분사 πληροφορηθεὶς는 ‘충분히 확신했습니다’로, ὃ ἐπήγγελται는 ‘하나님께서 약속하신 것’, δυνατός ἐστιν καὶ ποιῆσαι는 ‘또한 능히 이루실 수 있음’으로 충실히 반영되었습니다. 현재형 ‘ἐστιν’의 능력 진술도 한국어 ‘이루실 수 있음을’에 자연스럽게 보존됩니다. 문맥상 암시된 하나님을 명시한 것은 한국어에서 약속과 실행의 주체를 분명히 하는 자연스러운 보충이며 의미를 변경하지 않습니다.
  naturalness: 표준어 합쇼체로 자연스럽고, ‘그리고 그는 … 충분히 확신했습니다’는 앞 절에 이어지는 바울의 문장을 적절히 연결합니다. ‘능히 이루실 수 있음을’은 현대 문어체 성경 번역에 무리 없는 격식 있는 표현입니다.
  terminology: ‘하나님’, ‘약속’, ‘확신’, ‘이루다’는 일반적인 한국어 성경 용례와 현대적 격식에 적합합니다. 특정 교파적 해석을 덧붙이지 않습니다.
