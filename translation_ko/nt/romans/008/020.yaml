review_pass:
  verdict: revise
  source_fidelity: 현안은 수동태와 원인 표현입니다. ὑπετάγη는 창조 세계가 ‘허무에 굴복했다’는 뜻이 아니라 외부에 의해 허무 아래 놓였다는 수동 의미입니다. 또한 διὰ τὸν ὑποτάξαντα는 그분을 본문에서 특정하지 않은 채 원인을 나타내므로, ‘분으로 인하여’보다 ‘분 때문에’가 더 직접적입니다. ἐφ’ ἑλπίδι는 21절과 이어지는 미완결 구문으로 보존했습니다.
  naturalness: ‘창조 세계’는 여기서 집합적으로 사용된 κτίσις, 곧 인간 아닌 피조 질서를 현대 한국어로 분명하게 나타냅니다. ‘허무에 예속되었습니다’는 강요된 수동 상태를 자연스럽게 표현합니다. 절 끝의 줄표는 다음 절에 문법적으로 이어짐을 나타냅니다.
  terminology: ματαιότης는 ‘허무’로 유지했습니다. κτίσις는 문맥상 개별 ‘피조물’보다 집합적 ‘창조 세계’가 적절합니다. ἐλπίς는 용어 관례에 따라 ‘소망’으로 옮겼으며, 주체를 본문에서 하나님 등으로 특정하지 않았습니다.
  issues:
  - severity: high
    issue: ‘허무에 굴복하게 되었습니다’
    rationale: 이는 창조 세계가 스스로 굴복한 듯 들리며, ὑπετάγη의 강제된 수동 의미와 ‘허무에 복속됨’이라는 의미 관계를 충분히 전달하지 못합니다.
  - severity: medium
    issue: ‘굴복하게 하신 분으로 인하여’
    rationale: ‘으로 인하여’는 행위자의 매개·수단으로도 읽힐 수 있습니다. διὰ+대격의 인과적 용법을 ‘때문에’로 명시하고, 그 인물을 특정하지 않아야 합니다.
  - severity: low
    issue: κτίσι스를 ‘피조물’로 단수 표기
    rationale: 문맥의 κτίσις는 개별 생물이 아니라 비인간 창조 질서를 집합적으로 가리킵니다. ‘창조 세계’가 이 범위를 더 명료하게 전달합니다.
  revised_text: 창조 세계는 허무에 예속되었습니다. 그것은 자기 뜻으로 된 것이 아니라, 그것을 예속시키신 분 때문에 소망 가운데서 그렇게 된 것입니다—
  revised_footnotes:
  - marker: a
    text: ‘허무’는 ‘헛됨’, ‘좌절’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것을 예속시키신 분’이 누구인지는 그리스어 본문에서 명시하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: ‘소망 가운데서’는 ‘소망을 가지고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 수동태의 강제성과 허무에 대한 복속 관계를 ‘허무에 예속되었습니다’로 바로잡았습니다. 원인 표현을 ‘분 때문에’로 옮겨 원문의 인과성을 반영했고, 그 주체를 해석적으로 특정하지 않았습니다. 원문이 다음 절로 이어지는 구조이므로 줄표를 유지했습니다.
