review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders κτίσις collectively and retains the unnamed personal agent. However, ‘굴복하게 되었습니다’ can imply that creation itself yielded or surrendered; the Greek passive ὑπετάγη indicates imposed subjection. The causal force of διὰ with the accusative is also more clearly conveyed by ‘~으로 말미암은.’
  naturalness: ‘자기 뜻으로가 아니라’ is understandable but syntactically incomplete in this construction. The revision supplies a natural formal-polite Korean clause while retaining the verse’s deliberately unfinished connection to verse 21 with an em dash.
  terminology: ‘피조물,’ ‘허무,’ and ‘소망’ are suitable established biblical terms. ‘예속되었습니다/예속시키신’ preserves the imposed-subjection sense better than ‘굴복하게 되었습니다.’ The agent remains unidentified, without importing an interpretation.
  issues:
  - severity: medium
    issue: ‘굴복하게 되었습니다’ weakens or changes the passive force of ὑπετάγη.
    rationale: It may suggest voluntary surrender by creation, whereas the Greek explicitly says creation was subjected by another.
  - severity: medium
    issue: The causal phrase and the final hope phrase are awkwardly attached in Korean.
    rationale: The draft’s ‘굴복하게 하신 분으로 인하여, 소망 가운데서’ lacks a fully natural clausal connection. A recast clause preserves both the causal agent and the hope qualification.
  revised_text: 피조물은 허무[a]에 예속되었습니다. 그것은 자기 뜻으로 된 것이 아니라, 그것을 예속시키신 분[b]으로 말미암은 것이며, 소망 가운데서였습니다[c]—
  revised_footnotes:
  - marker: a
    text: 또는 ‘헛됨’, ‘좌절’ 또는 ‘무의미함’.
    reason: lexical_alternative
  - marker: b
    text: ‘그것을 예속시키신 분’이 누구인지는 그리스어 본문에서 명시하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘소망을 가지고’.
    reason: lexical_alternative
  revision_rationale: The revised wording makes the passive, imposed nature of the creation’s subjection explicit, expresses the causal προσωπικός agent without identifying that agent, and keeps ἐφ’ ἑλπίδι as an open-ended qualifier. The dash reflects that the Greek construction continues into the next verse.
