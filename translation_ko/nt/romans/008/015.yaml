    issue: 「아빠」 및 관련 각주
    rationale: Αββα는 아람어 형태를 그리스어로 음역하여 보존한 표현입니다. 「아빠」는 이를 한국어로 뜻번역한 일상 호칭이지 음역이 아닙니다. 또한 ‘1세기 유대 일상에서 자녀가 아버지를 친밀하게 부르는 호칭’이라는 설명은 본문이 보장하지 않는 역사적·정서적 함의를 부과합니다.
  - severity: low
    issue: 「노예의 영」의 소유 관계 모호성
    rationale: 한국어에서 ‘노예의 영’은 노예가 소유한 영으로도 읽힐 수 있습니다. δουλείας의 상태·속박의 의미를 드러내는 「노예 상태의 영」이 문맥상 더 명료합니다.
  - severity: low
    issue: 「양자됨」 표기
    rationale: 명사구로는 「양자 됨」으로 띄어 쓰는 편이 현대 한국어 표기에 더 자연스럽습니다.
