    rationale: 원문은 단순한 입양 일반보다 ‘아들로 세움’을 뜻하는 구성어입니다. 본문에서 그 의미를 반영하되, 대안 역어를 주석으로 남기는 것이 원문과 영어 감사 기록에 부합합니다.
