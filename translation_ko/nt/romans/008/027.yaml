review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the participial description of the one who searches hearts, the Spirit's φρόνημα, and the Spirit's intercession for the saints. However, 「하나님의 뜻을 따라」 makes 'will' explicit although it is not stated in κατὰ θεόν. This is a defensible contextual sense, but the source's more compact wording should be retained in the main text where Korean permits.
  naturalness: The Korean is clear, idiomatic, and consistently formal-polite. 「마음을 살피시는 분께서는」 is slightly more marked than necessary; 「마음을 살피시는 분은」 is smoother in this sentence.
  terminology: 「성령」, 「성도들」, and 「간구하시다」 are appropriate standard biblical terms. 「성령의 생각」 suitably represents φρόνημα and preserves the contextual lexical sense without overinterpreting it.
  issues:
  - severity: medium
    issue: 「하나님의 뜻을 따라」 explicitly supplies ‘뜻’ (‘will’) for κατὰ θεόν.
    rationale: The expression likely denotes conformity to God's will, but the Greek does not include a word for ‘will.’ The English audit trail likewise retains ‘according to God’ in the main text and treats ‘according to God's will’ as an alternative. A closer Korean main-text rendering with a clarifying footnote best preserves the source wording and ambiguity.
  revised_text: 마음을 살피시는 분은 성령의 생각이 무엇인지 아십니다. 성령께서 하나님께 맞게 성도들을 위하여 간구하시기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “하나님의 뜻에 따라.”
    reason: κατὰ θεόν은 문맥상 하나님의 뜻에 따른다는 의미로 이해될 수 있으나, 본문에는 ‘뜻’이라는 말이 명시되어 있지 않다.
  revision_rationale: 「하나님께 맞게」는 κατὰ θεόν의 압축된 표현을 한국어로 가능한 한 가깝게 옮기면서도 자연스럽게 이해됩니다. 각주에서 널리 쓰이는 해석적 표현 「하나님의 뜻에 따라」를 제시하여 의미를 보완하되, 본문에 없는 말을 본문 자체에 추가하지 않았습니다. 문장 첫머리는 현대 표준어 문체에 맞게 약간 다듬었습니다.
