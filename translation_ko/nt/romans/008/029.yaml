id: ROM.8.29
reference: Romans 8:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: ko
  text: 그분께서는 미리 아신 사람들을 또한 자기 아들의 형상을 본받는 이들이 되도록 미리 정하셨습니다.[a] 이는 그 아들이 많은 형제들[b] 가운데 맏아들이 되게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “미리 아셨다.” 여기의 “미리 아신”을 관계적 의미, 곧 미리 특별한 관심을 두셨다는 뜻으로 이해하는 이들도 있습니다.
    reason: alternative_reading
  - marker: b
    text: “형제들”은 문법적으로 남성형이지만, 여기서 가리키는 대상에는 하나님의 가족 안에 있는 남녀 모두가 포함될 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  english_pob_choice: foreknew
  chosen_korean: 미리 아신
  alternatives_korean:
  - 예지하신
  lexicon: BDAG
  rationale: προ- + γινώσκω. 「미리 아시다」.
- source_word: προώρισεν
  english_pob_choice: predestined
  chosen_korean: 미리 정하셨기
  alternatives_korean:
  - 예정하셨기
  lexicon: BDAG
  rationale: προ- + ὁρίζω.
- source_word: συμμόρφους τῆς εἰκόνος
  english_pob_choice: conformed to the image
  chosen_korean: 형상을 본받게
  lexicon: BDAG
  rationale: συν- + μορφή. 같은 형체를 이루다.
- source_word: πρωτότοκον
  english_pob_choice: firstborn
  chosen_korean: 맏아들
  lexicon: BDAG
  rationale: 표준.
