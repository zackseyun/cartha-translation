  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: ko
  text: 예수를 죽은 자들 가운데서 일으키신 분의 영이 여러분 안에 거하신다면, 메시아 예수를 죽은 자들 가운데서 일으키신 그분께서 여러분 안에 거하시는 그분의 영 때문에 여러분의 죽을 몸도 살리실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα ... ἐνοικοῦν αὐτοῦ πνεῦμα
  english_pob_choice: the Spirit ... his Spirit dwelling
  chosen_korean: 영 / 그분의 영
  lexicon: BDAG
  rationale: 부활하신 분의 영 = 성령. 「영」으로 옮기되, 부활의 능력의 영으로서 신적 영임이 분명.
- source_word: ζῳοποιήσει
  english_pob_choice: will ... give life
  chosen_korean: 살리실 것입니다
  lexicon: BDAG
  rationale: 생명을 주다.
- source_word: θνητὰ σώματα
  english_pob_choice: mortal bodies
  chosen_korean: 죽을 몸
  lexicon: BDAG
  rationale: 6:12 일관.
