- from: 자기 아들도 아끼지 아니하시고, 우리 모두를 위하여 그분을 내어주신 분께서, 어찌 그 아들과 함께 모든 것도 우리에게 은혜로이 주지 않으시겠습니까?
  to: 참으로 자신의 아들을 아끼지 않으시고 우리 모두를 위하여 그분을 내어주신 분께서, 어찌 그 아들과 함께 모든 것을 우리에게 은혜로 주지 않으시겠습니까?
  rationale: 원문의 수사적 강조(γε)를 ‘참으로’로, ἴδιος의 강조를 ‘자신의’로 반영했습니다. 나머지 핵심 표현은 초안의 충실한 선택을 유지하되, 현대 합쇼체의 자연스러움을 위해 ‘은혜로이’를 ‘은혜로’로 다듬었습니다. ὑπέρ의 의미는 ‘위하여’로 넓게 보존하여 대속의 특정 이론으로 좁히지 않았습니다.
  reviewer_model: gpt-5.6-terra
