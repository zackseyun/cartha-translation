review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional structure, the unspecified object of hope, and the sense of enduring expectation. However, ‘보지 못하는’ normally suggests inability to see (‘cannot see’), whereas οὐ βλέπομεν straightforwardly says ‘we do not see.’
  naturalness: ‘그러나 우리가 보지 않는 것을 소망한다면, 인내로 그것을 고대합니다’ is natural in modern formal-polite Korean. ‘인내로’ adequately renders the means expressed by διὰ ὑπομονῆς, and ‘고대합니다’ suitably conveys expectant waiting.
  terminology: ‘소망하다’ appropriately renders ἐλπίζω in this Pauline context without expanding its object. ‘인내’ is suitable for ὑπομονή, and ‘고대하다’ preserves the expectant force of ἀπεκδέχομαι.
  issues:
  - severity: medium
    issue: ‘보지 못하는’ can imply inability rather than simple non-seeing.
    rationale: The Greek οὐ βλέπομεν is a present negation, ‘we do not see,’ without stating that seeing is impossible. ‘보지 않는’ preserves this restraint.
  revised_text: 그러나 우리가 보지 않는 것을 소망한다면, 인내로 그것을 고대합니다.
