  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 σάρξ의 비유적 바울 용례를 한국어 성경 문체에서 통상적으로 더 정확하고 자연스럽게 나타내는 말은 ‘육신’이며, φρόνημα의 지시 대상을 후반절에서 분명히 하는 편이 좋습니다. οὐδὲ γὰρ δύναται의 능력 부정도 ‘복종할 수도 없습니다’로 유지됩니다.
