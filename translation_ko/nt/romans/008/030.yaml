  terminology: “미리 정하신” suitably renders προώρισεν without importing a denominational system. “의롭다고 하셨으며” preserves the established Pauline justification terminology. “영화롭게 하셨습니다” is the conventional Korean theological equivalent for ἐδόξασεν and better preserves the compact verbal link with glory than a looser paraphrase.
  issues:
