  source_fidelity: The chained referential structure and the aorist sequence are retained, and the draft correctly renders calling and justification. However, the Korean should more explicitly retain the same referent through each repeated clause, and the source/audit-trail alternatives for προώρισεν and the aorist ἐδόξασεν need anchored footnotes.
