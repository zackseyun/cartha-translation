  lexicon: BDAG
  rationale: 5:16의 δικαίωμα와 어휘 일치하나, 본 문맥은 율법의 요구·규례.
- source_word: πληρωθῇ
  english_pob_choice: might be fulfilled
  chosen_korean: 이루어지게
  lexicon: BDAG
  rationale: 수동 가정법.
- source_word: κατὰ σάρκα / κατὰ πνεῦμα
  english_pob_choice: according to the flesh / according to the Spirit
  chosen_korean: 육체를 따라 / 성령을 따라
  lexicon: BDAG
  rationale: 8장의 핵심 대조. πνεῦμα는 8장 전체에 걸쳐 「성령」으로 일관.
- source_word: περιπατοῦσιν
  english_pob_choice: walk
  chosen_korean: 걷는
  lexicon: BDAG
  rationale: 6:4 일관.
