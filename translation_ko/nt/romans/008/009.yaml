  to: 그러나 하나님의 영께서 여러분 안에 거하신다면, 여러분은 육체 안에 있지 않고 성령 안에 있습니다. 그러나 누구든지 메시아의 영을 가지고 있지 않으면, 그 사람은 그분께 속한 사람이 아닙니다.
