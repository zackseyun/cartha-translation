  terminology: 「사랑하신 분」은 원문의 과거적 사랑의 행위를 보존하면서 지시 대상을 불필요하게 교리적으로 한정하지 않습니다. 「승리합니다」는 νικάω 계열의 핵심 의미를 유지하고, 「압도적으로」는 ὑπέρ-의 강화 의미를 잘 살립니다.
