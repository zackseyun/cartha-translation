  source_fidelity: 원문의 강한 대조를 나타내는 「그러나」, ἐν τούτοις πᾶσιν의 범위를 보존한 「이 모든 것 가운데서」, διά의 매개·수단을 나타내는 「…을 통해」가 정확히 반영되었습니다. 「압도적으로 승리합니다」는 ὑπερνικῶμεν의 강화된 승리 의미와 현재형의 선언적 어조를 자연스럽게 전달합니다. 「우리를 사랑하신 분」은 관사 붙은 부정과거 분사의 명사적 용법을 충실히 옮기며, 본문에 없는 그리스도의 이름을 보충하지 않습니다.
