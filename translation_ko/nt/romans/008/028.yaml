revisions:
- from: 우리는 압니다. 하나님을 사랑하는 사람들, 곧 그 뜻을 따라 부르심을 받은 사람들에게는 모든 일이 함께 선을 이루도록 작용한다는 것을[a].
  to: 우리는 하나님을 사랑하는 사람들, 곧 목적에 따라 부르심을 받은 사람들에게는 모든 일이 함께 선을 이룬다는 것을 압니다[a].
  rationale: 원문의 두 여격구를 「하나님을 사랑하는 사람들, 곧 목적에 따라 부르심을 받은 사람들」로 유지하고, 원문에 없는 「그」를 삭제했습니다. συνεργεῖ와 εἰς ἀγαθόν은 「모든 일이 함께 선을 이룬다」로 자연스럽게 옮겼습니다. 각주는 실제 사본 이문인 명시적 「하나님」 읽기만 제시하여, 본문비평 정보와 해석적 추정을 구별했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:07:42Z'
review_pass:
  verdict: revise
  source_fidelity: 「그 뜻」은 원문 κατὰ πρόθεσιν에 없는 소유·지시 관계를 보충하므로, 이를 「목적에 따라」로 고쳐 원문의 무관사 표현을 보존해야 합니다. 또한 본문의 πάντα συνεργεῖ는 「모든 일이 함께 선을 이룬다」로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: 기존 문장은 문법적으로 가능하나, 「모든 일이 함께 선을 이루도록 작용한다」는 다소 중첩되고 부자연스럽습니다. 「모든 일이 함께 선을 이룬다」가 현대 표준어의 합쇼체 문맥에서 더 간결하고 자연스럽습니다.
  terminology: 「하나님을 사랑하는 사람들」과 「부르심을 받은 사람들」은 적절합니다. πρόθεσις는 여기서 「뜻」보다 「목적」이 원문의 비소유적 표현을 더 잘 보존합니다. 「선」은 εἰς ἀγαθόν의 적절한 번역입니다.
  issues:
  - severity: medium
    issue: 「그 뜻을 따라」가 원문에 없는 소유·지시 관계를 명시합니다.
    rationale: SBLGNT 본문은 κατὰ πρόθεσιν이며, 소유격이나 지시사가 없습니다. 문맥상 하나님의 목적을 가리킬 가능성이 크더라도, 본문에는 이를 보충하지 않는 것이 원문 및 영어 POB의 번역 원칙에 맞습니다.
  - severity: low
    issue: 「선을 이루도록 작용한다」는 협력의 의미와 결과 표현이 중복되어 다소 부자연스럽습니다.
    rationale: συνεργεῖ는 「함께 일하다/작용하다」이고 εἰς ἀγαθόν은 결과인 「선을 이루다」로 자연스럽게 결합될 수 있습니다.
  - severity: medium
    issue: 각주가 성령을 세 번째 가능한 문법적 주어처럼 제시하고, 본문의 모호성이 의도적이라고 단정합니다.
    rationale: 일부 사본의 ὁ θεός는 본문비평상 관련 변이이지만, 성령 주어설은 이 절의 사본 이문이 아니라 문맥에 따른 해석입니다. 또한 저자의 의도적 모호성은 본문만으로 단정하기 어렵습니다. 각주는 실제 사본 이문을 간결하게 밝혀야 합니다.
  revised_text: 우리는 하나님을 사랑하는 사람들, 곧 목적에 따라 부르심을 받은 사람들에게는 모든 일이 함께 선을 이룬다는 것을 압니다[a].
