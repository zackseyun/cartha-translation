review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 그리스어 본문은 Χριστὸς(‘메시아’)만을 쓰며 ‘예수’라는 이름은 없습니다. 따라서 초안의 ‘메시아 예수께서’는 원문에 없는 이름을 보충합니다. 또한 ἐγερθείς의 수동태는 유지되어야 합니다.
  naturalness: 초안은 전반적으로 이해 가능하나, ‘일으킴을 받으셨으며’는 현대 한국어 합쇼체 성경 문장으로 다소 명사화되어 어색합니다. ‘일으키심을 받으셨으며’가 수동 의미를 보존하면서 더 자연스럽습니다.
  terminology: κατακρίνω는 ‘정죄하다’, Χριστός는 칭호 의미를 살려 ‘메시아’, ἐντυγχάνει는 문맥상 ‘간구하시다’로 적절합니다. ‘하나님의 오른편’도 원문의 관용 표현을 충실히 반영합니다.
  issues:
  - severity: high
    issue: ‘예수’의 보충
    rationale: SBLGNT 본문은 Χριστὸς만 읽으며 Ἰησοῦς가 없습니다. 영어 POB의 ‘Messiah Jesus’도 제시된 그리스어 본문과 일치하지 않으므로, 한국어 번역에서 이를 따를 수 없습니다.
  - severity: low
    issue: ‘일으킴을 받으셨으며’의 문체
    rationale: 수동태 자체는 적절하나, ‘일으키심을 받으셨으며’가 현대 표준 한국어의 격식 있는 성경 문장에 더 자연스럽습니다.
