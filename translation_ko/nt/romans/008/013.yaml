  - severity: low
    issue: μέλλετε ἀποθνῄσκειν의 예고적 의미를 더 명시할 필요
    rationale: ‘죽을 것입니다’도 가능한 번역이나, ‘죽게 될 것입니다’가 μέλλω+부정사의 예고적 미래 의미를 좀 더 직접적으로 나타냅니다.
