  terminology: ‘성령’, ‘연약함’, ‘간구’, ‘말로 할 수 없는 탄식’은 현대 표준어 합쇼체에서 자연스럽고 본문의 의미 범위를 적절히 보존합니다. ‘친히’는 αὐτὸ τὸ πνεῦμα의 강조를 잘 반영합니다.
  issues:
