  source_fidelity: 초안은 율법의 무능, 하나님의 아들 보내심, 죄의 정죄라는 핵심 의미를 대체로 보존합니다. 그러나 「그 육체 안에서」의 ‘그’는 그리스어에 없는 지시성을 더하여 ἐν τῇ σαρκί의 의도적인 개방성을 다소 좁힙니다. 또한 περὶ ἁμαρτίας는 ‘죄를 위하여’로 본문에 유지할 수 있으나, 속죄제적 용법이라는 유력한 대안을 각주로 밝혀야 합니다.
