revisions:
- from: 율법이 육체로 인해 연약하여 할 수 없었던 것을, 하나님께서는 자신의 아들을 죄 된 육체의 모양으로 그리고 죄를 위하여 보내심으로써 행하셨습니다. 곧 그 육체 안에서 죄를 정죄하셨습니다.
  to: 율법이 육체로 말미암아 약해져서 할 수 없었던 일을 하나님께서 하셨습니다. 자신의 아들을 죄 있는 육체의 모양으로 보내시고 죄를 위하여[a], 육체 안에서 죄를 정죄하셨습니다.
  rationale: 문장의 주절을 분명히 하면서도 원문의 순서와 도구적 분사(‘보내시고’)를 유지했습니다. 두 σάρξ는 모두 「육체」로 일관되게 번역했고, 마지막 「육체 안에서」에서 원문에 없는 ‘그’를 제거하여 지시 대상을 과도하게 특정하지 않았습니다. περὶ ἁμαρτίας의 논쟁적인 희생제의적 함의는 본문에 강제하지 않고 각주에 보존했습니다.
