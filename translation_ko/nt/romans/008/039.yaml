  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘확신합니다’는 앞 절(롬 8:38)의 πεπείσμαι에 해당하며, 제공된 8:39 원문에는 없습니다. 8:39만의 완결된 본문으로 제시할 경우 이를 유지하면 원문에 없는 화자 진술이 더해집니다. 또한 미래 동사 δυνήσεται는 ‘없을 것입니다’로 명시하는 편이 충실합니다.
  naturalness: ‘높이도, 깊이도’가 ‘높음도, 깊음도’보다 현대 표준어에서 자연스럽습니다. ‘떼어 놓다’는 이 문맥에서 χωρίσαι(분리하다)를 자연스럽고 명료하게 옮깁니다. 합쇼체 종결 ‘없을 것입니다’도 적절합니다.
  terminology: ‘하나님의 사랑’, ‘우리 주 메시아 예수 안에 있는’은 원문의 속격과 ἐν구를 무리 없이 보존합니다. ‘메시아’는 프로젝트의 Χριστός 번역 방침에 부합합니다. κτίσις ἑτέρα는 ‘그 밖의 어떤 피조물’로 옮겨 ‘다른/그 밖의’와 포괄성을 함께 드러냈습니다.
