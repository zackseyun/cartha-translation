base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: ko
  text: 높이도 깊이도, 그 밖의 어떤 피조물도 우리를 우리 주 메시아 예수 안에 있는 하나님의 사랑에서 떼어 놓을 수 없을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘창조 세계 안에 있는 그 밖의 어떤 것’ 또는 ‘그 밖의 어떤 피조물’.
    reason: κτίσις는 ‘피조물’ 또는 ‘창조 세계/창조된 것’으로 이해될 수 있으며, ἑτέρα는 ‘그 밖의/다른’을 뜻합니다.
  - marker: b
    text: ‘메시아 예수’는 전통적으로 ‘그리스도 예수’로 옮깁니다.
    reason: Χριστός는 칭호이며, 본문에서는 그 의미를 번역하여 ‘메시아’로 옮겼습니다.
  - marker: c
    text: 여기서 ‘하나님의 사랑’은 문맥상 하나님께서 우리에게 가지시는 사랑을 가장 잘 가리키는 것으로 보입니다.
    reason: τοῦ θεοῦ는 본문에서 속격 표현으로 유지하되, 문맥상 의미를 주석으로 밝혔습니다.
