  source_fidelity: 원문의 두 명령형 ἀσπάσασθε를 각각 “문안하십시오”로 정확히 옮겼습니다. 드루배나와 드루보사는 여성 복수 분사 τὰς κοπιώσας의 수식을 자연스럽게 받으며, 버시에 대해서는 ‘많이’(πολλά)와 완료된 수고를 나타내는 과거 관점(ἐκοπίασεν)이 충실히 반영되었습니다. ‘주 안에서’는 ἐν κυρίῳ의 표현과 신학적 폭을 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고 간결합니다. 인명 뒤의 ‘에게 문안하십시오’는 서신의 인사 명령에 적절합니다. ‘사랑하는 버시’도 한국어에서 자연스러우며, 원문에 없는 ‘나의’를 보태지 않습니다.
  terminology: ‘주’, ‘문안하십시오’, ‘수고하다’의 선택이 문맥과 한국어 성경 문체에 적절합니다. 인명 음역(드루배나, 드루보사, 버시)도 통용되는 성경식 표기와 부합합니다.
