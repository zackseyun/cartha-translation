    rationale: ὁ ξένος μου καὶ ὅλης τῆς ἐκκλησίας는 가이오가 ‘나의 손님 접대자’이면서 ‘온 교회의 손님 접대자’라는 구조입니다. 초안은 두 대상을 함께 맞아 준 행위로 읽힐 여지가 있습니다.
