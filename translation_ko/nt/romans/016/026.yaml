review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 의미는 대체로 충실합니다. 다만 πάντα τὰ ἔθνη는 여기서 전 세계적 범위를 가리키므로 ‘모든 이방인’보다 ‘모든 민족’이 원문 및 영어 POB의 ‘all nations’에 더 정확합니다. 또한 γραφῶν προφητικῶν은 단순히 예언자들이 쓴 글이라기보다 ‘예언의 성경’(예언적 성경 기록)을 가리킵니다.
  naturalness: 수정문은 한국어에서 긴 분사구문의 수식 관계를 자연스럽게 유지하면서, 앞 절의 ‘비밀’을 이어 받는 종결송의 문장 흐름을 보존합니다. ‘믿음의 순종에 이르게’는 εἰς의 목적을 자연스럽게 드러냅니다.
  terminology: ‘영원하신 하나님’, ‘명령’, ‘믿음의 순종’은 적절합니다. ‘예언의 성경’은 γραφαὶ προφητικαί의 성경적 성격을 보존하며, ‘모든 민족’은 ἔθνη의 보편적 범위를 불필요하게 유대인/이방인의 대조로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘예언자들의 글’
    rationale: 원문의 ‘예언의/예언적인 성경들’은 예언자 개인의 저작이라는 뜻으로 한정되지 않습니다. ‘예언의 성경’이 더 충실합니다.
  - severity: medium
    issue: ‘모든 이방인’
    rationale: ἔθνη와 영어 POB의 ‘all nations’는 이 문맥에서 모든 민족을 향한 보편적 알려짐을 강조합니다. ‘이방인’은 유대인과의 대조를 불필요하게 전면화합니다.
  - severity: low
    issue: 종결송 관련 각주 표지 누락
    rationale: 영어 POB 감사 기록의 본문비평 각주를 한국어에도 표지와 함께 보존하는 것이 적절합니다.
  revised_text: 이제[a] 그 비밀이 나타났으며, 영원하신 하나님의 명령을 따라 예언의 성경을 통하여 모든 민족에게 알려져 믿음의 순종에 이르게 되었습니다.
  revised_footnotes:
