review_pass:
  verdict: revise
  source_fidelity: ‘모든 이방인’은 ἔθνη의 가능한 문맥적 번역이지만, 이 절은 ‘모든’의 보편적 범위를 명시하며 영어 POB도 ‘all nations’를 택합니다. 따라서 ‘모든 민족’이 더 충실합니다. γραφῶν προφητικῶν은 예언자 개인들의 저작이라는 뜻보다 ‘예언의 성경들/예언적 성경’이라는 성격을 가리키므로 이를 반영했습니다.
  naturalness: 수정문은 합쇼체의 현대적 문체를 유지하고, 원문의 종속·연결 구조를 한국어에서 자연스럽게 재현합니다.
  terminology: ‘영원하신 하나님’, ‘믿음의 순종’은 원문의 핵심 표현과 로마서 1:5의 대응을 유지합니다. ‘예언의 성경들’은 성경 문헌을 가리키는 γραφαί를 분명히 합니다.
  issues:
  - severity: medium
    issue: ‘모든 이방인’
    rationale: πάντα τὰ ἔθνη는 여기서 모든 민족을 가리키며, ‘이방인’은 유대인과의 대조를 전면에 내세워 영어 POB의 ‘all nations’보다 범위를 좁히거나 달리 들리게 할 수 있습니다.
  - severity: low
    issue: ‘예언자들의 글’
    rationale: γραφῶν προφητικῶν은 통상 예언의 성경들, 곧 예언적 성경 문헌을 뜻합니다. ‘예언자들의 글’도 가능하나 저자에 초점을 옮길 수 있습니다.
  revised_text: 이제는 그 비밀이 나타났으며, 예언의 성경들을 통하여 영원하신 하나님의 명령에 따라 모든 민족에게 알려져 믿음의 순종을 이루게 되었습니다.
  revised_footnotes:
  - marker: a
    text: 이 절은 송영(로마서 16:25–27)의 계속입니다. 이 송영의 위치와 사본 증거에 대해서는 로마서 16:25 주를 보십시오.
    reason: textual_critical
  revision_rationale: 원문의 ‘모든 민족’이라는 보편 범위와 ‘예언의 성경들’이라는 문헌적 의미를 반영했습니다. 본문은 앞 절의 ‘비밀’을 이어받는 구조이므로 ‘그 비밀’을 유지했으며, 종결부의 목적 표현도 ‘믿음의 순종을 이루게’로 보존했습니다. 영어 POB의 본문 주석에 해당하는 본문비평 각주도 한국어로 제공했습니다.
