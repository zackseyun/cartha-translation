  text: 이제[a] 그 비밀이 나타났으며, 영원하신 하나님의 명령을 따라 예언의 성경을 통하여 모든 민족에게 알려져 믿음의 순종에 이르게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
