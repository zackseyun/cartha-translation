review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 비유(‘우리 주 메시아’/‘자기들의 배’)는 충실합니다. 다만 χρηστολογία는 단순히 부드러운 말이라기보다 듣기 좋고 상대를 끌어들이는 말이므로, ‘그럴듯한 말’이 문맥상 더 정확합니다. ἐξαπατῶσι는 일반적인 기만을 가리키므로 ‘미혹합니다’보다 ‘속입니다’가 현대어에서 더 직접적입니다.
  naturalness: ‘그런 사람들’, ‘그럴듯한 말과 아첨’, ‘속입니다’가 표준 현대 한국어 합쇼체에서 자연스럽고, 원문의 경고하는 어조도 유지합니다.
  terminology: ‘우리 주 메시아’는 Χριστός를 칭호로 옮긴 정책과 일치하며, 예수를 보충하지 않습니다. ‘배’는 자기중심적 욕망을 나타내는 원문의 생생한 비유를 보존합니다. ἀκάκων의 넓은 의미는 ‘순박한 사람들’로 무리 없이 유지합니다.
  issues:
  - severity: low
    issue: ‘부드러운 말’은 χρηστολογία의 아첨적·그럴듯한 설득의 뉘앙스를 충분히 드러내지 못할 수 있습니다.
    rationale: 문맥에서 χρηστολογία는 중립적인 온화한 말이 아니라 사람을 속이기 위한 듣기 좋은 말이며, εὐλογία(아첨)와 병렬을 이룹니다.
  - severity: low
    issue: ‘미혹합니다’는 종교적 유혹이나 그릇된 길로 이끎을 연상시켜 ἐξαπατῶσι의 직접적인 기만보다 다소 해석적입니다.
    rationale: ‘속입니다’는 원문의 기만 행위를 현대어로 더 직접적이고 자연스럽게 표현합니다.
