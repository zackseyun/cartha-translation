  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah, but their own belly, and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: ko
  text: 그런 사람들은 우리 주 메시아를 섬기지 않고 자기들의 배를 섬기며, 그럴듯한 말과 아첨으로 순박한 사람들의 마음을 속입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ κυρίῳ ἡμῶν Χριστῷ
  english_pob_choice: our Lord Messiah
  chosen_korean: 우리 주 메시아
  lexicon: BDAG
  rationale: 정책 정형.
- source_word: δουλεύουσιν
  english_pob_choice: serve
  chosen_korean: 섬기다
  lexicon: BDAG
  rationale: 14:18과 일관.
- source_word: τῇ ἑαυτῶν κοιλίᾳ
  english_pob_choice: their own belly
  chosen_korean: 자기들의 배
  lexicon: BDAG
  rationale: 직역. 욕망의 상징.
- source_word: χρηστολογίας καὶ εὐλογίας
  english_pob_choice: smooth talk and flattery
  chosen_korean: 부드러운 말과 아첨하는 말
  alternatives_korean:
  - 듣기 좋은 말과 칭찬
  lexicon: BDAG
  rationale: 두 어휘의 변별을 「부드러운 말 / 아첨하는 말」로 살린다.
- source_word: ἐξαπατῶσι
  english_pob_choice: deceive
  chosen_korean: 미혹하다
  alternatives_korean:
  - 속이다
  lexicon: BDAG
  rationale: 강한 속임. 「미혹」이 정형.
- source_word: τὰς καρδίας τῶν ἀκάκων
  english_pob_choice: the hearts of the unsuspecting
  chosen_korean: 순박한 자들의 마음
  alternatives_korean:
  - 의심 없는 자들의 마음
  lexicon: BDAG
  rationale: ἄκακος는 「악함이 없는 자·단순한 자」.
