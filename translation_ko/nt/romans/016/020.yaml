base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet. The grace of our Lord Jesus Christ be with you.
translation:
  language: ko
  text: 평화의 하나님께서 속히 사탄을 여러분의 발 아래에서 부수실 것입니다. 우리 주 예수 메시아의 은혜가 여러분과 함께하기를 빕니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς τῆς εἰρήνης
  english_pob_choice: the God of peace
  chosen_korean: 평화의 하나님
  lexicon: BDAG
  rationale: 15:33과 일관.
- source_word: συντρίψει
  english_pob_choice: will ... crush
  chosen_korean: 부수실 것이다
  alternatives_korean:
  - 으스러뜨리실 것이다
  lexicon: BDAG
  rationale: 강한 어휘.
- source_word: τὸν Σατανᾶν
  english_pob_choice: Satan
  chosen_korean: 사탄
  lexicon: BDAG
  rationale: 정형 음역.
- source_word: ἐν τάχει
  english_pob_choice: soon
  chosen_korean: 속히
  lexicon: BDAG
  rationale: 정형.
- source_word: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  english_pob_choice: The grace of our Lord Jesus Christ
  chosen_korean: 우리 주 예수 메시아의 은혜
  alternatives_korean:
  - 우리 주 예수 그리스도의 은혜
  lexicon: BDAG
  rationale: '정책: Χριστός→메시아. 영어 POB가 「Christ」로 두었으나 한국어 정책은 칭호 보존.'
- source_word: μεθ’ ὑμῶν
  english_pob_choice: be with you
  chosen_korean: 여러분과 함께하기를 빕니다
  lexicon: BDAG
  rationale: 기원 형식.
