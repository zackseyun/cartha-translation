  source_fidelity: 본문의 ‘우리의 자매’, 겐그레아의 특정 회중과 관련된 διάκονος라는 핵심 뜻은 대체로 반영합니다. 그러나 기존 각주는 διάκονος의 문법 형태가 ‘여성에게도 해당 직책이 적용됨’을 입증한다고 단정하여, 본문의 어휘·문법이 직접 말하는 범위를 넘습니다. 또한 ἐκκλησία 각주의 ‘16장 전반에 일관된다’는 설명은 이 절의 번역 각주로서 근거와 필요성이 부족합니다.
  naturalness: ‘천거합니다’는 뜻은 맞지만 현대 표준어 합쇼체 성경 문체에서는 ‘추천합니다’가 더 자연스럽습니다. ‘겐그레아에 있는 회중’은 원문의 장소 수식 관계를 분명하고 자연스럽게 드러냅니다.
  terminology: ‘자매’, ‘회중’, ‘집사’는 문맥에 적절합니다. 다만 ‘집사’는 가능한 직무적 번역이지만 διάκονος의 의미 범위가 논의되므로, 영어 POB 감사 기록과 같이 대안 의미를 절제된 각주로 밝혀야 합니다.
