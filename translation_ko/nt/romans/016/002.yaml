  revised_text: 여러분이 그녀를 주 안에서 성도들에게 합당하게 받아들이고, 그녀가 여러분에게서 필요로 하는 어떤 일이든 도와주시기 바랍니다. 그녀는 많은 사람의 후원자[a]가 되었고, 나 자신도 후원해 주었습니다.
