  yaml_path: translation/nt/romans/016/025.yaml
  text: Now to him who is able to strengthen you according to my gospel and the preaching of Jesus Messiah, according to the revelation of the mystery kept secret for long ages,
translation:
  language: ko
  text: '[a] 여러분을 굳건히 하실 수 있는 분께, 곧 나의 복음과 예수 메시아의 선포에 따라, 또한 오랜 세월 동안 감추어져 있던 비밀의 계시에 따라,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 25–27절은 끝맺는 송영을 이루며, 고대 사본들에서는 서로 다른 위치에 나타납니다. 비잔틴 다수 전통에서는 14장 끝에, 현존하는 가장 이른 파피루스에서는 15장 뒤에, 주요 4세기 사본들과 라틴어 전통에서는 여기 16장 끝에 있습니다. 일부 사본은 이것을 여러 위치에 포함하고, 몇몇 사본은 전부 생략합니다. 대부분의 현대 번역본은 이것을 바울의 편지 결론으로 여기 이 위치에 둡니다.
    reason: textual_critical
