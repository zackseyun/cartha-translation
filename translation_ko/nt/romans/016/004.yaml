review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 옮겼습니다. ψυχή를 ‘생명’으로, ἐθνῶν을 ‘이방인’으로, 위험을 무릅쓴 목의 이미지를 ‘목을 내놓은’으로 표현한 것은 원문에 충실합니다. 다만 τράχηλον은 문법상 단수이며 복수 소유대명사와 결합한 관용적 집단 이미지이므로, 이를 설명하는 주석을 보존하는 것이 좋습니다.
  naturalness: 기존의 ‘그들에게 나뿐 아니라’는 현대 한국어에서 다소 어색하고, ‘나만 감사하는 것이 아니라’가 대조 구조를 더 자연스럽고 분명하게 드러냅니다. ‘내 생명을 위해’도 ‘나의 생명을 위하여’보다 자연스러운 현대 표준어입니다.
  terminology: 16장의 정책상 ἐκκλησία를 ‘회중’으로 유지했습니다. ‘이방인의 모든 회중’은 바울의 유대인-이방인 구도를 보존하며, 대안인 ‘민족들’도 주석에서 제시했습니다.
