  source_fidelity: 첫 문장의 ‘나의 친족 헤로디온’은 συγγενής의 넓은 의미를 본문과 주석으로 대체로 보존합니다. 그러나 δεύτε 문장의 ‘나깃수의 집 사람들’은 원문에 없는 ‘집/가정’(household)을 본문에 보태므로, 나깃수와 관련된 이들이라는 원문의 절제된 표현으로 고쳐야 합니다. ‘주 안에 있는’은 ἐν κυρίῳ를 충실히 옮겼습니다.
  naturalness: ‘문안하십시오’는 현대 표준어 합쇼체의 서신 문맥에 자연스럽습니다. ‘나깃수에게 속한 이들 가운데’는 다소 직역적이지만, 소유·가정 관계를 단정하지 않고 원문의 범위를 유지하는 자연스러운 절충입니다.
