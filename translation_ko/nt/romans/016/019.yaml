revisions:
- from: 여러분의 순종이 모든 사람에게 알려졌기 때문입니다. 그러므로 나는 여러분에 관해 기뻐합니다. 다만 여러분이 선한 것에 대해서는 지혜롭고, 악한 것에 대해서는 순결하기를 원합니다.
  to: 여러분의 순종이 모든 사람에게 알려졌기 때문입니다. 그러므로 나는 여러분을 두고 기뻐합니다. 그러나 나는 여러분이 선한 것에는 지혜롭고 악한 것에는 물들지 않기를 원합니다.
  rationale: The revision retains the contextual rendering ‘알려졌기’ for the report of their obedience reaching all, improves the idiomatic expression of Paul’s rejoicing, and replaces a potentially narrowed Korean term with an expression that communicates moral freedom from evil. No footnotes are required for this concise rendering, and no disputed textual matter is introduced.
  reviewer_model: gpt-5.6-terra
