    rationale: τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι는 ‘이것을 결단하라’, 즉 ‘놓지 않기로 결단하라’는 구조입니다. 수정문은 이 관계를 한국어에서 명료하게 합니다.
  revised_text: 그러므로 이제 더 이상 서로를 판단하지 맙시다. 도리어 형제 앞에 걸림돌이나 올무[a]를 놓지 않기로 결단하십시오.
