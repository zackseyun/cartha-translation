- from: 그러므로 우리가 더 이상 서로를 판단하지 맙시다. 도리어 이것을 결단하십시오. 곧 형제 앞에 걸림돌[a]이나 거치는 것을 두지 않는 것입니다.
  to: 그러므로 이제 더 이상 서로를 판단하지 맙시다. 도리어 형제 앞에 걸림돌이나 올무[a]를 놓지 않기로 결단하십시오.
  rationale: ‘거치는 것’을 ‘올무’로 고쳐 σκάνδαλον의 비유적 의미를 자연스럽게 반영했습니다. 또한 ‘형제 앞에 … 놓지 않기로 결단하십시오’로 재구성하여, δεύτερη κρίνατε가 무엇을 결단하라는 명령인지 분명히 했습니다. 첫 번째 κρίνω는 ‘판단’, 두 번째는 ‘결단’으로 번역하여 원문의 의도적인 어휘 반복과 의미 전환을 가능한 범위에서 보존했습니다.
