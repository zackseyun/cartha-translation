review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 반영합니다. 다만 원문의 οἶδα καὶ πέπεισμαι와 그 내용절의 결합을 한국어에서 한 문장으로 자연스럽게 연결하는 편이 더 정확합니다. 공동/의식적 부정의 의미를 나타내는 κοινός의 대안적 직역도 각주에서 명시하는 것이 좋습니다.
  naturalness: 초안의 “무엇이든 그 자체로는 부정한 것이 없다는 것을.”은 문장 조각으로 끝나 현대 표준 합쇼체 문장으로 부자연스럽습니다. “아무것도 그 자체로 부정한 것이 없음을 알고 확신합니다”로 고치면 자연스럽고 원문의 논리도 선명해집니다.
  terminology: “주 예수 안에서”, “부정한”, “여기는”은 문맥상 적절합니다. 다만 κοινός의 문자적 대안은 ‘공동의’보다 이 문맥에서 실제 번역 대안인 ‘속된’으로 제시하는 것이 독자에게 유익합니다.
  issues:
  - severity: medium
    issue: 첫 두 문장이 내용절을 부자연스럽게 분리함
    rationale: “...확신합니다. ...없다는 것을.”은 ‘것을’이 앞의 동사에 문법적으로 매이지 않아 문장 완결성이 떨어집니다. 원문의 ‘알고 확신한다—즉 ...없다’ 구조를 한 문장으로 연결해야 합니다.
  - severity: low
    issue: 각주가 공동/일반이라는 기본 뜻만 설명하고 문맥상 번역 대안을 직접 제시하지 않음
    rationale: 영어 감사 기록은 ‘common’을 대안으로 보존합니다. 한국어에서는 ‘속된’이 이 의식적 문맥에서 더 적절한 문자적 대안이므로 이를 명시하면 어휘 선택의 투명성이 높아집니다.
  revised_text: 나는 주 예수 안에서, 아무것도 그 자체로 부정한 것이 없음을 알고 확신합니다. 다만 어떤 것을 부정하다고 여기는 사람에게는 그것이 부정한 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “속된”. 헬라어 κοινός는 본래 “공동의, 일반의”를 뜻하지만, 유대인의 의식적 정결 문맥에서는 부정하거나 속된 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 내용절을 ‘알고 확신합니다’에 직접 연결하여 원문의 문법과 현대 한국어 문장성을 함께 살렸습니다. 마지막 절은 원문의 생략된 술어를 “부정한 것입니다”로 보완하되, 판단하는 사람에게 적용되는 상대적 성격을 유지했습니다. 각주는 κοινός의 문자적 번역 대안과 문맥상 의미를 함께 제시했습니다.
