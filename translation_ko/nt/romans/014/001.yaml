  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 μὴ εἰς가 받는 목적 금지는 ‘다만’으로 대조를 더하기보다, 받아들임의 잘못된 목적을 명시하는 방식이 더 정확합니다. διακρίσεις διαλογισμῶν은 의견 자체보다 그것을 둘러싼 논쟁·판단을 가리킵니다.
  naturalness: 합쇼체는 적절합니다. 두 번째 문장에서 ‘그리하지 마십시오’의 지시 대상이 다소 느슨하므로 ‘그렇게 받아들이지 마십시오’로 밝혀 주면 자연스럽고 명확합니다.
  terminology: ‘믿음이 약한 사람’, ‘받아들이십시오’는 τῇ πίστει와 προσλαμβάνεσθε를 자연스럽고 일관되게 옮깁니다. ‘의견에 관한 논쟁’은 διακρίσεις διαλογισμῶν의 논쟁적·평가적 뉘앙스를 보존하면서도 현대 한국어에 맞습니다.
  issues:
