  verdict: revise
  source_fidelity: 첫 절의 「당신 자신에게 두십시오」는 κατὰ σεαυτόν ἔχε를 지나치게 직역하여 한국어로 부자연스럽습니다. 「스스로 간직하십시오」로 고치면 개인적으로 간직하라는 명령과 하나님 앞에서의 책임 의식을 자연스럽게 보존합니다. 둘째 절은 ἐν ᾧ의 수단적 용법을 「…것으로」로 옮기는 것이 적절합니다.
  naturalness: 「당신」의 반복과 「당신 자신에게 두십시오」는 현대 표준 한국어 합쇼체 성경 문장으로 어색합니다. 주어를 생략하고 「가지고 있는 믿음」으로 처리하면 자연스럽고, 단수 수신자라는 원문의 범위도 훼손하지 않습니다.
  terminology: πίστις는 본문에서 일관되게 「믿음」으로 유지하되, 논쟁 중인 실천에 관한 개인적 확신이라는 문맥적 의미는 각주로 제시합니다. μακάριος는 「복이 있습니다」로, κρίνων은 본문에서 「판단하지 않는」으로 유지하고 「정죄하지 않는」을 각주 대안으로 둡니다.
