revisions:
- from: 고기를 먹지 않고, 포도주를 마시지 않으며, 또 당신의 형제가 그것으로 걸려 넘어지거나 거치거나 약해질 일을 하지 않는 것이 좋습니다.
  to: 고기를 먹지 않고 포도주를 마시지 않으며, 당신의 형제가 그것 때문에 걸려 넘어지거나 실족하거나 약해지게 하는 어떤 일도 하지 않는 것이 좋습니다[a].
  rationale: ‘거치다’를 ‘실족하다’로 바꾸어 세 동사의 의미를 자연스러운 현대 한국어로 구별했습니다. 또한 원문의 타원적 ‘ἐν ᾧ’를 ‘그것 때문에 … 하게 하는 어떤 일도’로 풀어, 형제에게 해가 되는 모든 행위를 포괄한다는 뜻을 보존했습니다. 본문은 남성 단수 ‘형제’를 유지하고 포괄적 문맥은 각주로 밝혔습니다.
