source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened.
translation:
  language: ko
  text: 고기를 먹지 않고 포도주를 마시지 않으며, 당신의 형제가 그것 때문에 걸려 넘어지거나 실족하거나 약해지게 하는 어떤 일도 하지 않는 것이 좋습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 포괄적으로는 ‘당신의 형제자매’, 곧 함께 믿는 이를 뜻할 수 있습니다.
    reason: ἀδελφός는 문법적으로 남성 단수이므로 본문에서는 ‘형제’로 옮기되, 이 문맥에서 동료 신자를 포괄하여 가리킬 수 있다는 영어 POB 감사 기록의 어휘상 대안을 보존합니다.
lexical_decisions:
- source_word: καλὸν τὸ μὴ φαγεῖν
  english_pob_choice: It is good not to eat
  chosen_korean: 먹지 않는 것이 좋다
  lexicon: BDAG
  rationale: 술어 형용사 + 관형 부정사.
- source_word: κρέα ... οἶνον
  english_pob_choice: meat ... wine
  chosen_korean: 고기 ... 포도주
  lexicon: BDAG
  rationale: 표준 어휘.
- source_word: προσκόπτει ἢ σκανδαλίζεται ἢ ἀσθενεῖ
  english_pob_choice: stumbles or is offended or is weakened
  chosen_korean: 걸려 넘어지거나 거치거나 약해지다
  alternatives_korean:
  - 부딪치거나 시험에 빠지거나 약해지다
  lexicon: BDAG
  rationale: 세 동사의 점층적 의미를 한국어로 구분 보존. 14:13의 「걸림돌·거치는 것」 어휘와 연계.
- source_word: ἐν ᾧ
  english_pob_choice: by which
  chosen_korean: 그것으로
  alternatives_korean:
  - 무엇으로
  lexicon: BDAG
  rationale: 수단·이유의 ἐν.
