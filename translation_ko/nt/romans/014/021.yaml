review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 어휘 선택은 대체로 충실합니다. 다만 ἐν ᾧ의 선행 내용이 포괄적·타원적이므로 ‘그것으로’보다는 ‘그것 때문에 … 하게 하는 어떤 일도’가 한국어에서 더 분명하며, σκανδαλίζεται의 수동적·윤리적 뉘앙스는 ‘거치다’보다 ‘실족하다’가 적절합니다.
  naturalness: ‘형제가 그것으로 걸려 넘어지거나 거치거나 약해질 일을’은 ‘거치다’의 용법과 수식 관계가 부자연스럽습니다. 병렬 동사와 ‘어떤 일도 하지 않는 것’을 사용하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: κρέα/οἶνον은 ‘고기/포도주’가 적절합니다. προσκόπτει, σκανδαλίζεται, ἀσθενεῖ는 각각 ‘걸려 넘어지다, 실족하다, 약해지다’로 구별해 옮깁니다. ἀδελφός의 문맥상 포괄적 적용은 영어 감사 기록과 같이 각주로 보존합니다.
  issues:
  - severity: medium
    issue: ‘거치거나’는 σκανδαλίζεται의 현대 한국어 번역으로 부자연스럽고 의미가 불명확합니다.
    rationale: ‘거치다’는 이 문맥에서 자동사적 결과를 나타내는 자연스러운 표현이 아니며, 윤리적·신앙적 걸림의 의미는 ‘실족하다’가 더 분명합니다.
  - severity: low
    issue: ‘그것으로 … 일을 하지 않는’은 ἐν ᾧ의 포괄적 타원 구조를 충분히 자연스럽게 드러내지 못합니다.
    rationale: 원문은 음식·음주뿐 아니라 형제를 해치게 하는 모든 행위를 포괄합니다. ‘그것 때문에 … 하게 하는 어떤 일도’가 이를 자연스럽게 명시합니다.
  - severity: low
    issue: 영어 감사 기록의 ἀδελφός 관련 각주에 대응하는 한국어 각주와 표지가 없습니다.
    rationale: 본문은 남성 단수 ‘형제’를 유지하되, 문맥상 동료 신자를 포괄할 수 있다는 정보를 각주로 보존하는 것이 감사 기록 및 독자 이해에 유익합니다.
