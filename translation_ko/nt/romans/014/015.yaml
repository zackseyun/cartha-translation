review_pass:
  verdict: revise
  source_fidelity: 초안은 βρῶμα를 ‘음식’으로, ἀπόλλυε의 강한 경고를 ‘파멸시키지 마십시오’로, Χριστός를 ‘메시아’로 옮겨 핵심 의미를 대체로 충실히 반영합니다. 그러나 λυπεῖται를 ‘마음 상한다’로 옮기면 모욕을 받아 불쾌해한다는 뜻으로 좁아질 수 있으므로, 여기의 괴로움·근심을 더 잘 보존하는 표현이 필요합니다. 또한 δεύτε 문장의 ‘죽으셨으니’는 원문의 강조된 목적어와 관계절(‘그를 위하여 메시아께서 죽으신 그 사람’)을 인과절로 재구성합니다.
  naturalness: ‘당신’은 현대 표준 한국어의 성경 문맥에서 불필요하게 직접적이거나 대립적으로 들릴 수 있습니다. 주어를 생략하고 ‘자신의’로 처리하면 합쇼체를 유지하면서도 자연스럽습니다. ‘사랑을 따라 걷고 있는 것이 아닙니다’는 바울의 걷기 은유를 보존하면서 자연스럽습니다.
  terminology: ‘메시아’, ‘사랑’, ‘형제’, ‘음식’, ‘파멸시키다’는 적절합니다. ‘형제’는 그리스어 남성 단수 ἀδελφός를 그대로 반영하며, 공동체 구성원을 대표할 수 있다는 점은 각주로 설명할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘마음 상한다면’의 의미 범위
    rationale: λυπεῖται는 슬픔·근심·괴로움을 겪는다는 뜻이며, ‘마음이 상하다’는 흔히 모욕이나 무례에 대한 기분 상함으로 이해되어 문맥을 다소 좁힐 수 있습니다.
  - severity: low
    issue: ‘당신’의 문체상 어색함
    rationale: 한국어 합쇼체 성경 번역에서 일반적 권면의 단수 대상을 ‘당신’으로 반복하면 지나치게 대면적이거나 공격적으로 들릴 수 있습니다. 주어 생략이 더 자연스럽습니다.
  - severity: low
    issue: 두 번째 문장의 관계절 및 강조 약화
    rationale: ‘메시아께서 그를 위하여 죽으셨으니’는 ἐκεῖνον과 ὑπὲρ οὗ Χριστὸς ἀπέθανεν의 ‘그 사람, 곧 그를 위하여 메시아께서 죽으신 사람’이라는 강조를 인과 연결로 바꿉니다.
  revised_text: 음식 때문에 형제가 근심한다면, 더 이상 사랑을 따라 걷고 있는 것이 아닙니다. 메시아께서 그를 위하여 죽으신 그 사람을 자신의 음식으로 파멸시키지 마십시오.
  revised_footnotes:
  - marker: a
    text: 또는 ‘형제나 자매’. 그리스어 ‘형제’는 동료 신자를 대표하여 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘망하게 하지 마십시오’ 또는 ‘멸하지 마십시오’. 그리스어 동사는 강하며 심각한 영적 해를 뜻할 수 있으나, 이 절 자체가 그 정확한 교리적 함의를 규정하지는 않습니다.
    reason: alternative_reading
  revision_rationale: ‘근심한다’로 λυπεῖται의 고통·슬픔의 범위를 더 정확히 살리고, 불필요한 ‘당신’을 제거했습니다. 또한 원문의 강조된 지시어와 관계절을 ‘메시아께서 그를 위하여 죽으신 그 사람’으로 복원했습니다. ‘파멸시키지 마십시오’는 ἀπόλλυε의 강도를 유지하되 교리 논쟁을 해결하려 하지 않습니다.
