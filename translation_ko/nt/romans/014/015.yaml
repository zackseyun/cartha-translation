review_pass:
  verdict: revise
  source_fidelity: 초안은 조건문, 음식으로 인한 괴로움, 사랑에 따른 행함, 그리고 그리스도의 죽음을 대체로 충실히 옮깁니다. 그러나 δεύτε 문장을 ‘죽으셨으니’라는 인과 구문으로 바꾸면서 원문의 강조된 관계절(‘메시아께서 그를 위하여 죽으신 그 사람’)과 명령의 직접적 연결이 다소 약화되었습니다. 이를 관계 관형절로 회복합니다.
  naturalness: ‘마음 상한다면’은 현대 한국어에서 단순한 불쾌감이나 감정적 상함을 흔히 뜻하여 λυπεῖται의 괴로움·근심의 무게를 충분히 드러내지 못할 수 있습니다. ‘괴로워한다면’이 문맥과 합쇼체에 더 자연스럽고 정확합니다. 주어를 반복하지 않고 ‘자신의 음식’으로 처리하면 존대 문체도 매끄럽습니다.
  terminology: ‘사랑을 따라 걷다’는 바울의 은유를 보존하며 적절합니다. Χριστός는 제목적 용법을 살려 ‘메시아’로 유지합니다. ἀπόλλυε는 ‘파멸시키지 마십시오’로 강도를 보존하되, 그 정확한 교리적 귀결을 본문에서 규정하지 않습니다.
  issues:
  - severity: medium
    issue: λυπεῖται를 ‘마음 상한다면’으로 번역함
    rationale: 이 표현은 ‘기분이 상하다’라는 비교적 약한 현대적 의미로 이해될 수 있습니다. 음식 문제로 양심과 신앙에 관련하여 겪는 괴로움을 나타내는 ‘괴로워한다면’이 더 적절합니다.
  - severity: medium
    issue: ὑπὲρ οὗ Χριστὸς ἀπέθανεν을 ‘메시아께서 그를 위하여 죽으셨으니’로 인과화함
    rationale: 원문은 명령의 목적어를 수식하는 관계절이며 ἐκεῖνον의 개별적 강조를 포함합니다. 인과 접속으로 바꾸지 않고 ‘메시아께서 그를 위하여 죽으신 그 사람’을 사용해 구조와 강조를 보존하는 것이 안전합니다.
  revised_text: 만일 음식 때문에 그대의 형제가 괴로워한다면, 그대는 더 이상 사랑을 따라 걷고 있는 것이 아닙니다. 메시아께서 그를 위하여 죽으신 그 사람을 그대의 음식으로 파멸시키지 마십시오.
  revised_footnotes:
  - marker: a
    text: 그리스어 ‘형제’는 문법적으로 남성 단수이지만, 여기서는 신자 공동체의 한 구성원을 대표하여 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파멸시키지 마십시오’는 ‘망하게 하지 마십시오’ 또는 ‘파괴하지 마십시오’로도 옮길 수 있습니다. 동사는 강한 표현이나, 이 구절 자체는 그 파멸의 정확한 교리적 의미를 규정하지 않습니다.
    reason: alternative_reading
  revision_rationale: λυπεῖται의 의미를 현대 한국어에서 더 정확히 드러내고, 원문의 관계절 및 ἐκεῖνον의 강조를 보존하도록 둘째 문장을 수정했습니다. ‘메시아’, ‘사랑을 따라 걷다’, ‘파멸시키지 마십시오’는 각각 제목적 의미, 바울의 윤리적 은유, ἀπόλλυμι의 강도를 유지합니다. 본문은 논쟁적인 파멸의 범위를 해석으로 한정하지 않으며, 필요한 대안은 각주에 남겼습니다.
