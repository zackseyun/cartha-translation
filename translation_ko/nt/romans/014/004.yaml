  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하나, 「그가 서거나 넘어지거나 하는 것은 그의 주인에게 달려 있습니다」는 τῷ ἰδίῳ κυρίῳ의 관계적·법정적 은유를 ‘주인에게 달려 있다’라는 인과적 표현으로 다소 넓혀 옮깁니다. 또한 σταθήσεται의 미래 수동태는 「서게 될 것입니다」보다 수동성을 드러내는 표현이 더 적절합니다.
  naturalness: 「가복」은 현대 표준어 성경 번역에서 매우 낯설고 사실상 고어적입니다. 「남의 집안 노예」는 οἰκέτης의 가정/가내 소속성과 종속 관계를 자연스러운 현대어로 전달합니다. 「자기 주인 앞에서 서기도 하고 넘어지기도 합니다」는 한국어에서 자연스럽고 원문의 비유적 책임 관계도 유지합니다.
  terminology: οἰκέτης는 이 문맥에서 household slave/servant를 뜻하며, 영어 POB의 선택 및 사회 관계 보존 원칙에 맞추어 「집안 노예」로 옮기는 것이 안전합니다. 첫 번째 κύριος는 비유 속 「주인」, 마지막 ὁ κύριος는 「주」로 구별하되, 두 용어의 그리스어 반복은 각주에서 설명합니다. 마지막 지시 대상에는 해석상 논의가 있으므로 각주는 한 견해를 교리적으로 단정하지 않고 대안도 보존합니다.
  issues:
  - severity: medium
    issue: 「가복」은 현대 표준 한국어에서 고어적이고 불투명합니다.
    rationale: 합쇼체 현대 한국어 번역의 자연스러움과 접근성을 해치며, οἰκέτης의 가내 소속과 노예 신분을 명확히 전달하지 못할 수 있습니다.
  - severity: medium
    issue: 「그가 서거나 넘어지거나 하는 것은 그의 주인에게 달려 있습니다」는 원문의 ‘자기 주인 앞에서/자기 주인과 관련하여 서거나 넘어진다’는 은유를 인과적 의존 관계로 확장합니다.
    rationale: τῷ ἰδίῳ κυρίῳ는 주인에 대한 책임·판정의 관계를 나타냅니다. 「자기 주인 앞에서」는 이를 자연스럽게 보존합니다.
  - severity: low
    issue: 「그는 서게 될 것입니다」는 σταθήσεται의 수동태를 충분히 드러내지 않습니다.
    rationale: 이어지는 「주께서 그를 세우실 수 있으시기 때문입니다」와의 인과적·어휘적 연결을 위해 「세움을 받을 것입니다」가 더 충실합니다.
