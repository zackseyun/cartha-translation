    rationale: οἰκέτης는 δοῦλος와 동일어는 아니지만 가내 노예를 가리킬 수 있습니다. 독자에게 필요한 것은 단어의 가내 소속성과 ‘종/노예’ 범위에 대한 간결한 설명입니다.
