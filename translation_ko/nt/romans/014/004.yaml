revisions:
- from: 당신이 누구이기에 남의 가복[a]을 판단합니까? 그가 서거나 넘어지거나 하는 것은 그의 주인에게 달려 있습니다. 그는 서게 될 것입니다. 주께서 그를 세우실 수 있기 때문입니다[b].
  to: 당신은 누구이기에 남의 집안 노예를 판단하십니까? 그는 자기 주인 앞에서 서기도 하고 넘어지기도 합니다. 그러나 그는 세움을 받을 것입니다. 주께서 그를 세우실 수 있으시기 때문입니다[b].
  rationale: 현대 표준어에 맞지 않는 「가복」을 「남의 집안 노예」로 바꾸어 οἰκέτης의 가내 소속 및 종속 관계를 명료하게 했습니다. ‘서고 넘어짐’은 자기 주인에 대한 책임과 판정의 비유이므로 「자기 주인 앞에서」로 옮겼습니다. 미래 수동태 σταθήσεται는 「세움을 받을 것입니다」로 드러내고, 마지막 능동 표현 「그를 세우실 수 있으시기 때문입니다」와 연결했습니다. 마지막 κύριος의 지시 대상에 관한 각주는 유력한 이해를 제시하되 다른 가능성도 보존하도록 고쳤습니다.
