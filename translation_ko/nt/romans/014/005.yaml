  rationale: 비교 대상인 두 날을 「한 날/다른 날」로 명료하게 하고, 현대적인 「더 중요하게」를 사용했습니다. 마지막 문장은 원문의 분배적 주어와 명령을 자연스러운 합쇼체로 바로 옮겼습니다. 각주는 본문이 날의 성격을 밝히지 않는다는 점과 πληροφορείσθω의 대안을 보존합니다.
