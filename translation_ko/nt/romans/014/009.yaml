review_pass:
  verdict: revise
  source_fidelity: 본문의 「다시 살아나셨다」는 ἔζησεν(직역하면 ‘사셨다’)보다 부활을 더 명시합니다. 문맥상 부활 생명을 가리킬 가능성이 매우 높지만, 본문에서는 그리스어의 간결한 표현을 보존하고 각주에서 문맥적 함의를 밝혀 두는 편이 더 충실합니다. 또한 κυριεύσῃ는 ‘주가 되시다’보다 동사적 의미인 ‘다스리시다’로 옮기는 것이 직접적입니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 바울의 목적 표현을 한국어의 ‘~한 것은 … 위함입니다’ 구문으로 명료하게 전달합니다.
  terminology: Χριστός는 정책에 따라 ‘메시아’로 유지합니다. ‘죽은 자와 산 자’는 대조되는 실체적 복수 표현을 간결하게 보존합니다.
  issues:
  - severity: medium
    issue: ἔζησεν을 본문에서 ‘다시 살아나셨다’로 확정함
    rationale: 문맥은 부활을 강하게 시사하지만, 원문은 ‘죽으셨고 사셨다’라고만 표현합니다. 부활의 명시적 표현은 각주에 두어 원문의 표현 범위와 문맥적 함의를 함께 보존하는 것이 안전합니다.
  - severity: low
    issue: κυριεύσῃ를 ‘주가 되시다’로 번역함
    rationale: ‘주’와의 어근 연결은 있으나, 여기서는 동사로서 ‘다스리다/권세를 행사하다’가 직접적인 의미입니다. ‘다스리시다’가 원문의 동사성을 더 잘 살립니다.
  revised_text: 왜냐하면 메시아께서 죽으셨고 사신 것은 죽은 자와 산 자 모두를 다스리시기 위함입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 「죽으셨다가 다시 살아나셨다」 또는 「부활하여 사셨다」. 헬라어는 「죽으셨고 사셨다」라고 하며, 문맥은 부활 생명을 가리킨다.
    reason: lexical_alternative
  revision_rationale: 원문의 ἀπέθανεν καὶ ἔζησεν이 지닌 간결한 ‘죽으셨고 사셨다’를 본문에 보존하고, 부활적 이해는 각주로 제시했습니다. ‘다스리시다’는 κυριεύσῃ의 동사적 지배·통치 의미를 자연스럽게 반영합니다. ‘왜냐하면’은 γάρ의 앞 절에 대한 설명 기능을, ‘~한 것은 … 위함입니다’는 εἰς τοῦτο와 ἵνα의 목적 관계를 한국어에서 자연스럽게 드러냅니다.
