  to: 음식 때문에 하나님의 일을 허물지 마십시오. 모든 것이 정결하지만, 걸림돌이 되게 하여 먹는 사람에게는 그렇게 먹는 것이 악한 일입니다.
  rationale: The revision preserves the source's broad statement that all things are clean and its warning against eating in a way associated with causing stumbling. It replaces the ambiguous '그것이 악입니다' with an explicit Korean predicate and uses '걸림돌' for πρόσκομμα, without adding a doctrinal interpretation.
