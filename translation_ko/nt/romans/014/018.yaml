  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: ko
  text: 이와 같이 메시아를 섬기는 자는 하나님께 기쁨이 되며 사람들에게도 인정받습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  english_pob_choice: in this way
  chosen_korean: 이와 같이
  alternatives_korean:
  - 이 안에서
  - 이로써
  lexicon: BDAG
  rationale: 앞 절(의·평화·기쁨)을 회수하는 방식적 ἐν. 「이와 같이」가 자연스럽다.
- source_word: δουλεύων τῷ Χριστῷ
  english_pob_choice: serves the Messiah
  chosen_korean: 메시아를 섬기다
  alternatives_korean:
  - 메시아의 노예가 되다
  lexicon: BDAG
  rationale: δουλεύω 동사는 「노예로서 섬기다」 의미를 본디 가지나, 정형화된 「섬기다」가 한국 성경 관행. 정책 글로사리는 δοῦλος→노예를 명사 매임 강조 시에만 적용.
- source_word: εὐάρεστος τῷ θεῷ
  english_pob_choice: pleasing to God
  chosen_korean: 하나님께 기쁨이 되다
  alternatives_korean:
  - 하나님께 기뻐하시는 바가 되다
  lexicon: BDAG
  rationale: 자연스러운 한국어 표현.
- source_word: δόκιμος τοῖς ἀνθρώποις
  english_pob_choice: approved by men
  chosen_korean: 사람들에게 인정받다
  alternatives_korean:
  - 사람들에게 인정되다
  lexicon: BDAG
  rationale: δόκιμος는 시험을 통과해 인정받은 상태.
