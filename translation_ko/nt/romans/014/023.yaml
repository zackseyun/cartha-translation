review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 δεύτε 문장의 ‘그것이’는 무엇을 가리키는지 다소 불분명할 수 있으므로, ὅτι 이하가 앞의 ‘먹음’의 근거를 설명한다는 관계를 더 자연스럽게 드러내는 표현으로 다듬었습니다. κατακέκριται의 수동성과 정죄의 주체에 관한 원문의 비특정성은 ‘정죄받습니다’로 보존됩니다.
  naturalness: ‘의심하는 사람’이 현대 표준어에서 ‘의심하는 자’보다 더 자연스럽고, ‘이는’은 앞 문장 전체의 행위를 받아 정중한 문어체 흐름을 유지합니다. ‘믿음에서 나오지 않는 모든 것’은 πᾶν ... ὃ의 포괄성을 자연스럽게 나타냅니다.
  terminology: πίστις는 본문에서 일관되게 ‘믿음’으로 옮겼습니다. 문맥상 확신의 뉘앙스가 있으나 본문의 바울적 어휘를 ‘확신’으로 한정하지 않도록 각주에서만 가능한 뉘앙스를 제시했습니다. ‘정죄’와 ‘죄’는 각각 κατακρίνω 및 ἁμαρτία의 구별을 유지합니다.
  issues:
  - severity: low
    issue: 둘째 문장의 지시어 ‘그것이’의 선행사가 다소 모호함
    rationale: 원문은 먹는 행위가 믿음에서 나지 않았다는 이유를 제시합니다. 한국어에서는 ‘이는’과 생략된 주어를 사용하면 앞 절 전체를 자연스럽게 받아들이면서 불필요한 해석을 피할 수 있습니다.
  - severity: low
    issue: 영어 POB 감사 기록의 πίστις 관련 각주가 한국어 본문에 반영되지 않음
    rationale: ‘믿음’이라는 본문 번역을 유지하되, 문맥상 ‘확신’이라는 뉘앙스가 가능함을 각주로 밝혀 영어 감사 기록의 어휘적 투명성을 보존하는 것이 좋습니다.
  revised_text: 그러나 의심하는 사람이 먹으면 정죄받습니다. 이는 믿음에서[a] 나온 것이 아니기 때문입니다. 믿음에서 나오지 않는 모든 것은 죄입니다.
  revised_footnotes:
