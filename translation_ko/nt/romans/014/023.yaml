review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δεύτε 문장의 ‘그것’은 선행사가 불분명할 수 있으므로, 먹는 행위가 믿음에서 나오지 않는다는 인과 관계를 명시하는 편이 헬라어 ὅτι οὐκ ἐκ πίστεως를 더 정확히 드러냅니다. κατακέκριται의 완료 수동이 나타내는 결과 상태는 ‘정죄받습니다’로 자연스럽게 전달됩니다.
  naturalness: ‘무엇이든 믿음에서 나오지 않는 것은’도 이해되지만, 현대 표준 한국어에서는 ‘믿음에서 나오지 않는 모든 것은’이 더 간결하고 자연스럽습니다. 합쇼체 문체는 유지됩니다.
  terminology: ‘의심하는 자’, ‘정죄받습니다’, ‘믿음’, ‘죄입니다’는 문맥과 바울의 어휘를 적절히 보존합니다. ἐκ πίστεως는 본문에서 ‘믿음’으로 유지하고, 문맥상 ‘확신’이라는 가능한 뉘앙스는 각주로만 제시합니다.
  issues:
  - severity: low
    issue: ‘그것이 믿음에서 나오지 않기 때문입니다’의 지시 대상이 다소 모호합니다.
    rationale: 헬라어의 이유절은 의심하는 사람이 먹는 행위가 믿음에서 나오지 않음을 가리킵니다. 한국어에서는 ‘그가 믿음에서 나오지 않는 마음으로 먹기 때문입니다’처럼 행위와 주체를 밝혀 주는 것이 더 분명합니다.
  - severity: low
    issue: ‘무엇이든 … 것은’의 표현이 다소 중첩됩니다.
    rationale: πᾶν δὲ ὃ는 ‘… 모든 것’으로 자연스럽게 옮길 수 있으며, 의미의 포괄성도 그대로 보존됩니다.
  revised_text: 그러나 의심하는 자가 먹으면 정죄받습니다. 그가 믿음에서 나오지 않는 마음으로 먹기 때문입니다. 믿음에서 나오지 않는 모든 것은 죄입니다.
  revised_footnotes:
  - marker: a
    text: ‘믿음에서 나오지 않는’은 문맥상 하나님 앞에서 확신을 가지고 행하지 않는다는 뜻을 포함할 수 있습니다.
    reason: ἐκ πίστεως의 기본 번역인 ‘믿음’을 본문에 유지하면서, 음식 문제의 문맥에서 나타나는 확신의 뉘앙스를 제시합니다.
  revision_rationale: 이유절의 지시 관계를 명료하게 하고 마지막 일반 명제를 자연스러운 한국어 어순으로 다듬었습니다. ‘믿음’이라는 핵심 용어와 수동적 ‘정죄받습니다’는 유지하여 원문의 신학적·문법적 여지를 좁히지 않았습니다.
