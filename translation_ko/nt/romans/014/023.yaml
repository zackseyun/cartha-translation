    text: 또는 ‘확신에서.’ 그리스어는 ‘믿음에서’라고 하며, 여기에는 하나님 앞에서 확고한 확신을 따라 행동한다는 뜻이 포함될 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 조건문, 수동태, 인과관계, 그리고 ‘믿음에서 나오지 않는 모든 것’이라는 포괄적 진술을 보존했습니다. 지시어를 다듬어 한국어 문장 연결을 명료하게 했고, 논쟁의 여지가 있는 πίστις의 문맥적 뉘앙스는 본문을 바꾸지 않고 각주로만 제시했습니다.
