  - marker: c
    text: Or 'doing what is shameful.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the fitting recompense' or 'the due recompense' for their error.
    reason: lexical_alternative
translation:
  language: ko
  text: 마찬가지로 남성들도 여성과의 본성적인 관계를 버리고 서로를 향한 욕망에 불타올랐습니다. 남성들이 남성들과 함께 부끄러운 일을 행하며, 자기들 안에서 그들의 그릇됨에 대한 합당한 보응을 받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
