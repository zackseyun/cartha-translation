  source_fidelity: 전반적으로 헬라어 죄목 열거의 구조와 의미를 충실히 옮겼습니다. 다만 ὑβριστάς를 「무례한 자」로 옮기면 단순한 예절상의 무례로 약화될 수 있어, 타인을 오만하고 난폭하게 모욕·학대하는 함의가 충분히 드러나지 않습니다. ἀλαζόνας도 인접한 ὑπερηφάνους(「교만한 자」)와 구별되는 허풍·과장된 자랑의 뉘앙스를 살리는 편이 좋습니다.
