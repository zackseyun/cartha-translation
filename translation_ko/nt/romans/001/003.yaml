  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐκ σπέρματος Δαυὶδ는 ‘다윗의 후손에서’보다 ‘다윗의 혈통에서’가 한국어에서 더 자연스럽고, 다윗에게서 이어지는 계보라는 원문의 의미를 더 정확히 드러냅니다. γενομένου는 여기서 다윗 계통으로 나신 것을 가리키므로 ‘나셨습니다’로 옮길 수 있습니다.
