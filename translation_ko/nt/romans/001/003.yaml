  terminology: ‘그분의 아들’, ‘육신으로는’, ‘다윗’은 적절합니다. ‘육신’은 본문에 보존하되, 각주에서 이 문맥의 혈통·지상적 계보 의미를 설명하는 것이 적절합니다. ‘죄성’을 단정적으로 대비하기보다, 이 구절에서 그 의미가 아니라는 문맥적 설명으로 표현했습니다.
