  source_fidelity: 핵심 구조는 대체로 충실하나, ἐν πᾶσιν τοῖς ἔθνεσιν의 주본문을 「모든 이방인들 가운데서」로 한정하면 ‘모든 민족’이라는 원문의 더 넓은 표현을 본문에서 미리 해석하게 됩니다. 영어 POB와 원문에 맞게 본문은 「모든 민족 가운데서」로 두고 ‘이방인’은 대안으로 처리하는 것이 적절합니다.
  naturalness: 원문의 「받았으니 … 하려 함입니다」는 문법적으로 가능하지만 현대 한국어 합쇼체에서는 다소 문어적이고 부자연스럽습니다. 두 문장으로 나누어 목적 관계를 명확히 하면 자연스럽고 격식도 유지됩니다.
  terminology: 「은혜」, 「사도직」, 「믿음의 순종」은 적절합니다. 「믿음의 순종」은 ὑπακοὴ πίστεως의 속격 모호성을 보존합니다. ἔθνη는 본문에서 「민족」으로 옮기고 「이방인」을 각주 대안으로 제시해야 합니다.
