translation:
  language: ko
  text: 이 때문에 하나님께서는 그들을 수치스러운 욕정에 내버려 두셨습니다. 이는 그들의 여성들이 본성에 맞는 관계를 본성에 반하는 것으로 바꾸었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθη ἀτιμίας
  english_pob_choice: dishonorable passions
  chosen_korean: 욕된 정욕
  alternatives_korean:
  - 욕보이는 정욕
  - 수치스러운 정욕
  lexicon: BDAG
  rationale: 명예 박탈의 속격 ἀτιμίας와 πάθος의 강도를 「욕된 정욕」으로 보존한다.
- source_word: φυσικὴν χρῆσιν
  english_pob_choice: natural relations
  chosen_korean: 본성적인 관계
  alternatives_korean:
  - 자연스러운 사용
  - 본성적 용도
  lexicon: BDAG
  rationale: 문맥상 성적 관계를 가리키며, 「본성」과 「반본성」의 대비를 「본성적/본성을 거스르는」으로 보존한다.
- source_word: παρὰ φύσιν
  english_pob_choice: contrary to nature
  chosen_korean: 본성을 거스르는 것
  alternatives_korean:
  - 자연을 거스르는 것
  - 본성에 반하는 것
  lexicon: BDAG
  rationale: 바울의 도덕적 진단을 완곡화하지 않고 「거스르는」으로 옮긴다.
