  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 μετήλλαξαν의 ‘교환하다’라는 뜻은 ‘바꾸어 버렸다’보다 ‘바꾸었다’가 더 절제되고 정확하며, γάρ가 이끄는 설명의 연결도 문장 안에서 더 분명히 드러낼 수 있습니다.
  naturalness: ‘욕된 정욕’과 ‘본성적인 관계’는 의미는 전달하지만 현대 표준어 합쇼체에서는 다소 중복되거나 어색합니다. ‘수치스러운 욕정’ 및 ‘본성에 맞는 관계’가 더 자연스럽고, 뒤의 ‘본성에 반하는 것’과의 대조도 유지합니다.
  terminology: πάθη ἀτιμίας는 ‘수치스러운 욕정’으로, θήλειαι는 문맥상 ‘여성들’로 옮겼습니다. φυσικὴν/παρὰ φύσιν의 어근 대조는 ‘본성에 맞는/본성에 반하는’으로 보존했습니다. 특정 현대 범주나 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘욕된 정욕’의 현대적 자연스러움과 의미 중첩
    rationale: ‘욕된’과 ‘정욕’의 결합은 현대 한국어에서 다소 부자연스럽고 의미가 겹쳐 들립니다. ἀτιμίας의 평가적 의미를 ‘수치스러운’으로 명확하게 보존할 수 있습니다.
