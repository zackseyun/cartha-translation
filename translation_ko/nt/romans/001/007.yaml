  text: 로마에 있는 하나님께 사랑받고 성도로 부르심을 받은 모든 이에게, 우리 아버지 하나님과 주 예수 메시아께로부터 은혜와 평강이 여러분에게 있기를 바랍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοῖς θεοῦ
  english_pob_choice: beloved by God
