  source_fidelity: The draft conveys the main sense, including Rome's inclusion through ‘여러분에게도’ and εὐαγγελίσασθαι through ‘복음을 전하기.’ However, τὸ κατ’ ἐμὲ πρόθυμον is more specifically Paul’s own eagerness/readiness than a strong wish (‘간절히 원합니다’).
  naturalness: ‘내 편에서는’ is unnatural in this formal Korean context and the comma interrupts the sentence unnecessarily. ‘저는 … 전할 열의가 있습니다’ is clear, modern, and suitably formal-polite.
  terminology: ‘복음’ is the established and appropriate rendering here for εὐαγγελίσασθαι. No doctrinally loaded addition is introduced.
  issues:
  - severity: low
    issue: ‘내 편에서는’ is awkward Korean.
    rationale: It is a too-literal attempt to represent κατ’ ἐμέ. The idiomatic Korean subject ‘저는’ adequately expresses the personal qualification in context.
  - severity: medium
    issue: ‘간절히 원합니다’ weakens the particular nuance of πρόθυμον.
    rationale: The Greek denotes eagerness, willingness, or readiness. ‘전할 열의가 있습니다’ more directly preserves that disposition without implying mere desire.
  revised_text: 그러므로 저는 로마에 있는 여러분에게도 복음을 전할 열의가 있습니다.
