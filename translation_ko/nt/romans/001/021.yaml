base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
  footnotes:
  - marker: a
    text: Or 'in their reasonings,' 'in their thoughts,' or 'in their speculations.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'heart' is singular.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 하나님을 알면서도 하나님을 하나님으로서 영화롭게 하지 않고 감사하지도 않았으며, 오히려 그들은 자기 생각[a] 가운데 허망해졌고 그들의 분별없는 마음[b]은 어두워졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘추론’, ‘사고’, ‘사색’.
    reason: διαλογισμοί의 의미 범위(생각, 추론, 숙고)를 보존합니다.
  - marker: b
    text: 그리스어로는 ‘마음’이 단수입니다.
    reason: καρδία가 단수로 쓰였음을 명시합니다.
