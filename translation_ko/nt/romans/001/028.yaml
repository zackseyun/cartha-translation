review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐδοκίμασαν/ἀδόκιμον의 어근 반복을 ‘합당하게 여기지 않았- / 합당하지 못한’으로 살리고, παρέδωκεν을 ‘내버려 두셨습니다’로 옮긴 점이 대체로 충실합니다. 다만 ἔχειν ἐν ἐπιγνώσει는 단순한 ‘그 지식 가운데’보다 ‘하나님을 아는 지식 가운데’로 밝혀야 하며, ‘합당하지 못한 마음’은 한국어에서 다소 부자연스럽습니다.
  naturalness: ‘하나님을 아는 지식 가운데 두는 것’, ‘합당하지 않은 마음’이 현대 표준어 합쇼체에서 더 자연스럽고 뜻도 분명합니다. ‘마땅하지 못한’보다 ‘마땅하지 않은’이 간결합니다.
  terminology: ‘하나님’, ‘마음’, ‘내버려 두셨습니다’는 문맥과 한국어 성경의 일반적 용례에 적절합니다. ‘합당하다/합당하지 않다’는 원문의 δοκιμ- 말놀이를 어느 정도 보존하지만, 한국어에서 그 연결이 완전히 자명하지 않으므로 주석으로 설명하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ἐν ἐπιγνώσει의 내용이 불명확함
    rationale: ‘하나님을 그 지식 가운데’는 지식의 대상과 성격이 불분명합니다. ‘하나님을 아는 지식 가운데’는 하나님을 인식/알고 있는 지식 안에 두거나 간직한다는 원문의 표현을 더 충실히 드러냅니다.
  - severity: low
    issue: ‘합당하지 못한 마음’의 어색한 결합
    rationale: 의미는 전달되나 현대 한국어에서는 ‘합당하지 않은 마음’이 더 자연스럽습니다. 이 표현은 앞선 ‘합당하다고 여기지 않았다’와의 어휘적 연결도 유지합니다.
  revised_text: 그리고 그들이 하나님을 아는 지식 가운데 두는 것을 합당하다고 여기지 않았으므로, 하나님께서는 그들을 합당하지 않은 마음에 내버려 두셔서 마땅하지 않은 일을 하게 하셨습니다.
  revised_footnotes:
  - marker: a
    text: ‘합당하다고 여기지 않았다’와 ‘합당하지 않은’은 원문에서 같은 어근(δοκιμ-)을 사용한 말놀이를 반영합니다. 후자는 ‘인정받지 못한’, ‘검증을 통과하지 못한’, 또는 ‘타락한’ 마음으로도 옮길 수 있습니다.
    reason: lexical_wordplay_and_alternative
  - marker: b
    text: 직역하면 ‘하나님을 아는 지식 가운데 두는 것’입니다. ‘하나님을 아는 지식 안에 간직하는 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 하나님을 지식 안에 ‘두다/간직하다’는 표현을 명확히 하고, 한국어의 자연스러운 결합을 위해 일부 표현을 다듬었습니다. 하나님의 ‘내어주심/내버려 두심’이라는 사법적 의미와 δοκιμ- 어근의 반복은 유지했으며, 논쟁적 신학 용어를 덧붙이지 않았습니다.
