review_pass:
  verdict: revise
  source_fidelity: 원문의 καθὼς가 나타내는 인과적 연결과 ἐδοκίμασαν/ἀδόκιμον의 어휘적 연결, παρέδωκεν의 ‘내어 줌’, 그리고 마지막 부정법의 결과적 기능을 유지하도록 다듬었습니다. 기존의 ‘행하게 하셨습니다’는 하나님께서 해당 행위를 직접 일으키셨다는 인상을 다소 강하게 줄 수 있어, ‘하도록 내어 주셨습니다’로 수정했습니다.
  naturalness: ‘그 지식 가운데 두기’와 ‘합당하지 못한 마음에 내버려 두다’는 현대 표준 한국어에서 다소 어색합니다. ‘자신들의 지식 안에 두는 것’, ‘부적합한 마음에 내어 주시어’가 원문의 구조를 비교적 보존하면서도 더 자연스럽습니다.
  terminology: ‘적합하다고 여기지 않다/부적합한’으로 δοκιμ- 계열의 말놀이를 살리고, καθήκοντα는 별개의 어휘인 ‘마땅하지 않은 일’로 옮겼습니다. ‘마음’은 νοῦς의 도덕적·판단적 차원을 포괄하는 번역으로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘합당하지 못한 마음’ 및 ‘마음에 내버려 두셔서’의 어색한 결합
    rationale: ἀδόκιμον νοῦν은 ‘부적합한/검증에서 탈락한 마음’이라는 뜻이며, 현행 표현은 현대 한국어에서 자연스럽지 않고 의미가 불분명할 수 있습니다.
  - severity: medium
    issue: ‘마땅하지 못한 일을 행하게 하셨습니다’가 직접적 신적 사역으로 들릴 가능성
    rationale: ποιεῖν은 παρέδωκεν에 딸린 결과/목적 부정법입니다. ‘내어 주시어 … 하도록’은 심판적 방임이라는 문맥을 더 적절히 드러냅니다.
  revised_text: 그리고 그들이 하나님을 자신들의 지식 안에 두는 것을 적합하다고 여기지 않았으므로, 하나님께서는 그들을 부적합한 마음에 내어 주시어 마땅하지 않은 일을 하도록 하셨습니다.
  revised_footnotes:
  - marker: a
    text: ‘부적합한’은 앞의 ‘적합하다고 여기지 않았다’와 같은 어근의 그리스어를 옮긴 말입니다. 또는 ‘인정받지 못한 마음’.
    reason: lexical_wordplay
  revision_rationale: 원문의 인과 관계와 반복되는 ‘내어 주심’의 심판 언어를 유지하되, 한국어의 어색한 결합을 바로잡았습니다. 또한 δοκιμάζω/ἀδόκιμος의 어휘적 연결은 ‘적합하다/부적합하다’로 보존하고, τὰ μὴ καθήκοντα는 그와 구별하여 ‘마땅하지 않은 일’로 번역했습니다.
