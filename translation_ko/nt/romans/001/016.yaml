revisions:
- from: 나는 복음을 부끄러워하지 않습니다. 이는 복음이 모든 믿는 자에게 — 먼저는 유대인에게, 그리고 헬라인에게도 — 구원에 이르게 하는 하나님의 능력이기 때문입니다.
  to: 나는 복음[a]을 부끄러워하지 않습니다. 이는 복음이 믿는 모든 사람에게 구원을 주시는 하나님의 능력이기 때문입니다. 먼저 유대인에게, 그리고 헬라인[b]에게도 그러합니다.
  rationale: 문장의 수식 관계를 원문에 맞게 정리하여, 복음이 믿는 모든 사람에게 구원을 주시는 하나님의 능력이라는 진술을 분명히 했습니다. ‘먼저 유대인에게, 그리고 헬라인에게도’는 원문의 우선성과 추가를 보존합니다. ‘헬라인’은 본문에서 유지하고 의미 범위는 각주에서만 설명하여 해석을 과도하게 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:07:21Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 ‘복음’, ‘하나님의 능력’, ‘구원’, 유대인과 헬라인의 순서는 대체로 충실합니다. 다만 ‘구원에 이르게 하는’은 εἰς σωτηρίαν의 관계를 다소 우회적으로 만들고, ‘모든 믿는 자’는 현대 표준 한국어에서 명사구로 다소 부자연스럽습니다. ‘믿는 모든 사람에게 구원을 주시는’으로 고치면 원문의 분배적 범위와 구원 목적을 자연스럽게 보존합니다.
  naturalness: 합쇼체는 유지되어 있으나, ‘먼저는 유대인에게’보다 ‘먼저 유대인에게’가 현대 문어에서 더 자연스럽습니다. 대시로 삽입한 구절은 문장의 수식 관계를 흐리므로 일반적인 어순으로 정리하는 편이 좋습니다.
  terminology: ‘복음’, ‘하나님의 능력’, ‘구원’, ‘유대인’, ‘헬라인’은 적절합니다. Ἕλλην을 본문에서 ‘헬라인’으로 유지하되, 바울 문맥에서 더 넓게 비유대인을 가리킬 수 있음을 각주로 밝혀야 합니다. 영어 POB의 ‘good news/gospel’ 어휘 선택도 ‘복음’의 대안 각주로 반영할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘모든 믿는 자에게 — 먼저는 유대인에게, 그리고 헬라인에게도 — 구원에 이르게 하는’의 결합 관계가 부자연스럽습니다.
    rationale: παντὶ τῷ πιστεύοντι는 ‘믿는 모든 사람에게’를 뜻하며, εἰς σωτηρίαν은 하나님의 능력의 구원 지향성을 나타냅니다. 현행 문장은 ‘먼저는’과 대시 삽입 때문에 수혜자 및 구원의 관계가 불명료해집니다.
  - severity: low
    issue: 영어 POB 감사 기록에 있는 ‘복음’ 및 ‘헬라인’ 관련 각주가 한국어 본문에 반영되지 않았습니다.
    rationale: ‘헬라인’은 원문의 어휘를 보존하지만 이 문맥에서 더 넓은 비유대인을 가리킬 수 있습니다. 해당 의미 범위는 본문을 바꾸지 않고 각주로 제공하는 것이 적절합니다.
