translation:
  language: ko
  text: 형제 여러분[a], 여러분이 이 사실을 모르기를 나는 원하지 않습니다. 나는 다른 이방인들 가운데서와 마찬가지로 여러분 가운데서도 얼마간의 열매를 얻기 위해 여러 번 여러분에게 가려고 계획했지만, 지금까지 방해를 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
