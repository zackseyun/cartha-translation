  source_fidelity: 원문은 ἀνθρώπων을 τῶν ... κατεχόντων이 수식하므로, ‘진리를 불의로 억누르는 사람들’ 전체가 ‘모든 불경건과 불의’의 소유·행위 주체로 연결되어야 합니다. 현 초안의 뒤 문장 ‘그들은’도 의미는 전달하지만, 분사 수식 관계와 문장 내 논리적 결속을 약화합니다. ἐν ἀδικίᾳ는 ‘불의로’(수단)로 번역할 수 있으나 ‘불의 가운데서/불의 안에서’(영역·상태)라는 여지도 남습니다.
