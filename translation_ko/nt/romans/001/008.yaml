  text: 먼저[a], 나는 메시아이신 예수[b]를 통하여 나의 하나님께 여러분 모두를 두고 감사드립니다. 여러분의 믿음[c]이 온 세상에 널리 전해지고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
