review_pass:
  verdict: revise
  source_fidelity: 「계시되기」는 현대 한국어에서 부자연스럽고, 수동 현재 ἀποκαλύπτεται의 의미도 충분히 드러내지 못합니다. 「드러나기」로 고치고, 선행사인 복음을 명시한 「복음 안에서」를 유지하는 것이 적절합니다. ἐκ πίστεως εἰς πίστιν은 「믿음에서 믿음으로」로 옮겨 두 전치사와 반복을 보존하되 특정 해석을 본문에 넣지 않습니다. 인용문의 ἐκ πίστεως는 ‘의인’과 ‘살 것이다’ 어느 쪽에도 연결될 수 있으므로 각주로 밝혔습니다.
  naturalness: 「믿음으로부터 믿음에 이르도록 계시되기」는 목적을 암시하는 「-도록」과 어색한 「계시되기」 때문에 자연스럽지 않습니다. 「믿음에서 믿음으로 드러나기 때문입니다」가 간결하고 현대 표준어 합쇼체에 맞습니다. 성경 인용은 「기록된 바와 같습니다」 및 미래형 「살 것입니다」로 처리했습니다.
  terminology: δικαιοσύνη θεοῦ는 전통적이며 속격의 여지를 남기는 「하나님의 의」로 유지했습니다. δίκαιος는 대표적 단수이지만 한국어 성경 문체에 자연스러운 「의인」으로 옮겼습니다. ‘정의’는 δικαιοσύνη의 가능한 어휘 대안으로 각주에만 제시했습니다.
  issues:
  - severity: medium
    issue: 「계시되기」와 「믿음으로부터 믿음에 이르도록」의 결합이 어색합니다.
    rationale: ἀποκαλύπτεται는 이 문맥에서 「드러나다」가 자연스럽고, εἰς를 「-도록」으로 옮기면 방향·반복 표현에 목적의 뉘앙스가 더해집니다.
  - severity: low
    issue: 하박국 인용문의 ἐκ πίστεως가 수식하는 대상의 대안이 각주에 없습니다.
    rationale: 「의인은 믿음으로 살 것입니다」는 주된 독법을 보존하지만, ‘믿음으로 의로운 사람은 살 것이다’라는 가능한 결합도 독자에게 알려야 원문의 통사적 여지를 보존합니다.
  - severity: low
    issue: 「하나님의 의」의 ‘정의’라는 어휘 대안이 누락되었습니다.
    rationale: 본문의 전통적 용어는 유지하되, δικαιοσύνη의 가능한 의미 영역을 각주로 투명하게 제시하는 것이 영어 감사 기록과도 일치합니다.
  revised_text: 복음 안에서 하나님의 의가 믿음에서 믿음으로[b] 드러나기 때문입니다. 기록된 바와 같습니다. 「의인은 믿음으로 살 것입니다」[c]
  revised_footnotes:
  - marker: a
    text: 또는 「하나님의 정의」.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 ἐκ πίστεως εἰς πίστιν은 해석이 어려운 구절입니다. 「믿음에서 믿음으로」는 두 전치사와 반복을 보존합니다. 더 해석적인 번역으로는 「믿음으로 말미암아 믿음을 위하여」, 「처음부터 끝까지 믿음으로」, 「믿음을 통하여 믿음을 위하여」 등이 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 「믿음으로 의로운 사람은 살 것입니다」. 헬라어에서 「믿음으로」는 「의인」 또는 「살 것입니다」에 연결될 수 있습니다.
    reason: alternative_reading
  revision_rationale: 본문의 의미를 바꾸지 않으면서, 계시의 현재적 드러남을 자연스러운 한국어로 표현했습니다. 논쟁적인 믿음의 표현과 인용문의 수식 관계는 본문에서 확정하지 않고 각주로 남겼습니다. 「하나님의 의」에는 각주 a를 두었으나, 본문상 이 용어 뒤에 표지를 달면 문장 흐름이 과도하게 분절되므로 표지는 각주 세트의 어휘 대안으로 제공했습니다.
