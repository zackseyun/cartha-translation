review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 문장 구조는 대체로 충실합니다. 그러나 「믿음으로부터 믿음에 이르도록」의 「-도록」은 목적·결과의 뉘앙스를 더할 수 있어, 논쟁적인 ἐκ πίστεως εἰς πίστιν의 열려 있는 관계를 「믿음에서 믿음으로」로 보존하는 편이 더 안전합니다.
  naturalness: 「계시되기」는 현대 한국어에서 다소 부자연스럽고, 성경 번역 문맥에서는 「드러나기」가 자연스럽습니다. 또한 인용 뒤의 「하였습니다」보다 「기록되어 있습니다」가 γέγραπται의 현재적 인용 관습과 합쇼체 문체에 잘 맞습니다.
  terminology: 「하나님의 의」는 δικαιοσύνη θεοῦ의 속격 모호성과 바울 서신의 전통적 핵심 용어를 적절히 보존합니다. 「복음 안에서」도 선행사 εὐαγγέλιον을 정확히 가리킵니다. 「의로운 자」와 「믿음으로 살리라」는 인용문의 격조를 유지하면서 자연스럽습니다.
  issues:
  - severity: medium
    issue: 「믿음으로부터 믿음에 이르도록」의 「-도록」
    rationale: εἰς는 여러 방식으로 이해되는 논쟁적 전치사이나, 「-도록」은 목적 또는 도달 결과를 비교적 강하게 암시합니다. 「믿음에서 믿음으로」는 두 전치사와 반복을 유지하면서 해석을 덜 가합니다.
  - severity: low
    issue: 「계시되기」와 인용 종결 「하였습니다」
    rationale: 「계시되기」는 현대 문장으로 다소 경직되어 있으며, 「드러나기」가 ἀποκαλύπτεται에 자연스럽습니다. γέγραπται는 ‘기록되어 있다’라는 현재적 권위 인용이므로 인용 뒤에 별도로 「하였습니다」를 붙이지 않는 편이 자연스럽습니다.
  revised_text: 이는 복음 안에서 하나님의 의가 믿음에서 믿음으로[a] 드러나기 때문입니다. 기록된 바와 같이, 「의로운 자는 믿음으로 살리라」라고 기록되어 있습니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 ἐκ πίστεως εἰς πίστιν은 해석이 어려운 구절입니다. 「믿음에서 믿음으로」는 두 전치사와 반복을 보존합니다. 「믿음으로 말미암아 믿음을 위하여」, 「처음부터 끝까지 믿음으로」, 「믿음을 통하여 믿음을 위하여」 등으로도 이해됩니다.
    reason: alternative_reading
  revision_rationale: 본문은 δικαιοσύνη θεοῦ를 「하나님의 의」로, ἐν αὐτῷ를 「복음 안에서」로 유지합니다. 논쟁적인 ἐκ πίστεως εἰς πίστιν은 목적성을 덜 암시하는 「믿음에서 믿음으로」로 고쳐 원문의 모호성을 보존했습니다. 아울러 현대적 자연스러움과 합쇼체 문체를 위해 「계시되기」를 「드러나기」로, 성경 인용의 마무리를 「기록되어 있습니다」로 다듬었습니다.
