id: ROM.1.24
reference: Romans 1:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
  footnotes:
  - marker: a
    text: Or 'among them'; possibly 'in themselves.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 하나님께서는 그들을 그들의 마음의 정욕 가운데 부정함에 내어 주셔서, 그들의 몸이 그들 사이에서[a] 욕되게 되도록 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 자신 안에서’.
    reason: ἐν αὐτοῖς는 ‘그들 사이에서/가운데서’로도, ‘그들 자신 안에서’로도 이해될 수 있는 간결하고 논쟁적인 표현이다.
lexical_decisions:
- source_word: παρέδωκεν
  english_pob_choice: gave them over
  chosen_korean: 내버려 두셔서
  alternatives_korean:
  - 넘겨주셔서
  - 방임하셔서
  lexicon: BDAG
  rationale: 심판적 「넘겨줌」의 함의를 「내버려 두다」로 옮긴다. 단순 방치가 아니라 의도적 넘김이다.
- source_word: ἐπιθυμίαις
  english_pob_choice: desires
  chosen_korean: 정욕
  alternatives_korean:
  - 욕망
  - 욕정
  lexicon: BDAG
  rationale: 부정적 강도의 「정욕」을 채택해 본문의 윤리적 무게를 보존한다.
- source_word: ἀκαθαρσίαν
  english_pob_choice: impurity
  chosen_korean: 부정함
  alternatives_korean:
  - 더러움
  lexicon: BDAG
  rationale: 제의·도덕적 함의를 「부정함」으로 옮긴다.
- source_word: ἀτιμάζεσθαι
  english_pob_choice: dishonoring
  chosen_korean: 욕되게 하도록
  alternatives_korean:
  - 욕보이도록
  lexicon: BDAG
  rationale: 명예 박탈의 함의를 「욕되게 하다」로 보존한다.
theological_decisions:
- issue: 1:24-27 단락의 강도 보존 — 완곡어법 회피
  chosen_reading: 정욕, 부정함, 욕되게 함의 직설적 어휘
  alternative_readings:
  - 욕망, 더러움, 명예롭지 못함의 완곡한 어휘
  rationale: 북성 원칙(DOCTRINE.md §1+§5)에 따라 1:24-27의 충격적 강도를 완곡화하지 않는다. 본문이 도덕적 진단을 직설적으로 내리는 부분이므로, 한국 전통 번역의 부드러운 어법보다 강한 어휘를 택한다.
  doctrine_reference: 'DOCTRINE.md §1+§5 — Rom 1:18-32 wrath: preserve specificity and force; do not euphemize'
