  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘자기 몸’은 복수형 τὰ σώματα αὐτῶν(‘그들의 몸들/몸’)을 각 개인의 단수 재귀 표현으로 좁히며, ‘그들 가운데서’는 ἐν αὐτοῖς의 논쟁적인 범위를 충분히 보존하지 못합니다. 또한 ‘욕되게 하도록 하셨습니다’는 하나님이 직접 욕되게 하시는 행위자로 읽힐 수 있어, 수동 부정과거 부정사 ἀτιμάζεσθαι(‘욕되게 됨/욕되게 되는 것’)의 표현을 더 가깝게 반영할 필요가 있습니다.
  naturalness: ‘내어 주셨습니다’는 심판적 넘겨줌을 현대 표준어 합쇼체로 자연스럽게 전달합니다. ‘마음의 정욕 가운데’와 ‘부정함에’는 원문의 두 전치사구를 비교적 충실히 유지하면서도 문장으로 읽힙니다.
  terminology: ‘정욕’, ‘부정함’, ‘욕되게 되다’는 본문의 도덕적·명예훼손적 어조를 과도하게 완화하지 않으면서 자연스럽습니다. ‘욕되게 되도록’은 하나님을 직접적인 욕되게 함의 행위자로 단정하지 않고 원문의 수동태를 반영합니다.
