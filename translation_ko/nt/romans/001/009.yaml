translation:
  language: ko
  text: 하나님께서 나의 증인이십니다. 나는 내 영으로 하나님의 아들의 복음 안에서 그분을 섬기며, 끊임없이 여러분을 언급합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λατρεύω
  english_pob_choice: serve
  chosen_korean: 섬기는
  alternatives_korean:
  - 예배하는
  - 섬김으로 봉사하는
  lexicon: BDAG
  rationale: 제의적 함의를 지닌 헬라어를 한국어 「섬기다」로 옮긴다. 좁은 의미의 「예배」보다 폭넓다.
- source_word: ἐν τῷ πνεύματί μου
  english_pob_choice: in my spirit
  chosen_korean: 나의 영으로
  alternatives_korean:
  - 내 심령으로
  lexicon: BDAG
  rationale: 바울의 인간 영(내적 인격) 용법으로 「나의 영」을 채택한다.
