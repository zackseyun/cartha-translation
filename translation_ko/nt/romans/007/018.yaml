    rationale: ‘…없기 때문입니다’는 후반부가 앞의 지식 진술을 직접 논증하는 구조처럼 들리게 합니다. 원문의 병렬적 설명을 ‘참으로’로 옮겨 더 명확히 반영하는 것이 안전합니다.
  - severity: low
    issue: παράκειταί의 근접성
    rationale: ‘내게 있으나’는 존재·소유의 의미가 강합니다. ‘내 곁에 있으나’는 ‘가까이 놓여 있다/손에 닿아 있다’는 원어의 비유적 근접성을 더 잘 보존합니다.
  - severity: low
    issue: 영어 POB 주석 대응 표지 누락
    rationale: 영어 감사 기록에는 σάρξ의 대안 번역 주석이 있으므로, 한국어 본문에도 해당 표지와 주석을 두어 용어상 해석 가능성을 투명하게 제시하는 것이 좋습니다.
