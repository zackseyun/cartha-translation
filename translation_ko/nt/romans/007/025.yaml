  rationale: 칭호.
- source_word: δουλεύω νόμῳ θεοῦ
  english_pob_choice: serve the law of God
  chosen_korean: 하나님의 율법을 섬기고
  lexicon: BDAG
  rationale: 여기서도 「섬기다」 — 7:6 일관. 본 절은 신자의 마음 차원의 봉사이므로 「섬김」 자연스러움.
- source_word: νόμῳ θεοῦ
  english_pob_choice: law of God
  chosen_korean: 하나님의 율법
  lexicon: BDAG
  rationale: 모세 율법 = 하나님의 율법.
- source_word: νόμῳ ἁμαρτίας
  english_pob_choice: law of sin
  chosen_korean: 죄의 법
  lexicon: BDAG
  rationale: 7:21, 23 일관 — 「법」(원리).
