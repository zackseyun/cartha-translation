  to: 그러므로 남편이 살아 있는 동안에 다른 남자의 아내가 되면[a], 그 여인은 간음한 여인으로 불릴 것입니다. 그러나 남편이 죽으면, 그 여인은 그 법에서 자유롭게 되므로[b], 다른 남자의 아내가 되어도 간음한 여인이 되지 않습니다.
