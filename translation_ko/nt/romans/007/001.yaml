  verdict: revise
  source_fidelity: 현 초안은 κυριεύει를 ‘지배합니다’로 적절히 옮기고, νόμος를 ‘율법’으로 일관되게 번역했습니다. 그러나 문두의 Ἢ(논증을 이어 주는 ‘아니면/혹은’)가 빠져 있으며, γὰρ 이하의 설명이 독립 문장으로 처리되어 원문의 삽입적 설명 구조가 약화되었습니다.
  naturalness: ‘아니면’과 대시로 삽입 설명을 표시하면 현대 표준어 합쇼체에서 자연스러우면서도 바울의 논증 흐름을 보존합니다. ‘살아 있는 동안만’의 ‘만’은 원문에 없는 배타적 뉘앙스를 줄 수 있어 삭제했습니다.
  terminology: ‘형제 여러분’은 ἀδελφοί의 남성 복수 호칭을 보존하는 관례적인 번역이며, 혼합된 수신자 집단을 포함할 수 있음을 각주로 밝혔습니다. ‘율법’과 ‘지배합니다’는 각각 νόμος와 κυριεύει에 적절합니다.
  issues:
