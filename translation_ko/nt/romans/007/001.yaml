    rationale: Ἢ는 앞선 논증과 연결하는 수사적 전환이므로 ‘아니면’으로 드러내는 것이 원문 충실성에 필요합니다.
  - severity: medium
    issue: γὰρ 이하의 삽입 설명 구조가 독립 문장으로 바뀌었습니다.
    rationale: ‘나는 율법을 아는 이들에게 말합니다’는 주절을 설명하는 삽입구이므로 대시로 처리하여 원문의 구문 관계를 보존하는 것이 좋습니다.
  - severity: low
    issue: ‘동안만’이 배타적 강조를 더합니다.
    rationale: ἐφ’ ὅσον χρόνον은 지속 기간을 뜻하므로 ‘살아 있는 동안’이 더 직접적입니다.
  revised_text: 아니면, 형제 여러분[a], 여러분은 알지 못합니까?—나는 율법을 아는 이들에게 말합니다—율법은 사람이 살아 있는 동안 그 사람을 지배합니다.
