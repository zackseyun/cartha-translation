    issue: ‘율법으로’는 νόμῳ의 일반적·법률적 의미를 특정 종교 율법으로 좁혀 들리게 할 수 있습니다.
    rationale: 이 절에서 νόμῳ는 혼인 관계의 법적 구속을 비유적으로 진술하며, 무관사 형태와 직접 문맥은 일반 법적 원리를 지지합니다.
  - severity: low
