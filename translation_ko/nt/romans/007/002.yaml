    rationale: 한국어에서는 소유·관계를 문맥상 자연스럽게 처리할 수 있으며, 원문의 압축된 속격은 본문에서 ‘남편과 관련된 법’으로 풀고 각주에서 대안을 제시하는 것이 명료합니다.
  - severity: low
    issue: 영문 감사 이력의 어휘 대안에 대응하는 각주 앵커가 한국어 초안에 없습니다.
