review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘율법으로’는 여기서 모세 율법을 뜻하는 것으로 오해될 수 있습니다. 문맥과 무관사 νόμῳ는 혼인 관계를 규정하는 일반적인 법적 원리를 가리키므로 ‘법에 의해’가 더 정확합니다. 마지막의 ‘τοῦ νόμου τοῦ ἀνδρός’는 압축된 속격 표현으로, 남편 자신이 제정한 법이라는 뜻이 아니라 남편과의 혼인 관계에 적용되는 법적 구속을 뜻합니다.
  naturalness: ‘그 남편’의 반복은 한국어에서 다소 부자연스럽습니다. ‘법에 의해 남편에게 매여 있지만’ 및 ‘남편과 관련된 법에서 벗어납니다’가 현대 표준어 합쇼체에서 자연스럽고 법적 비유를 유지합니다.
  terminology: ὕπανδρος γυνή는 ‘결혼한 여인’으로 적절합니다. δέδεται는 지속되는 결속을 나타내는 ‘매여 있습니다’로, κατήργηται는 법적 효력으로부터의 해제를 나타내는 ‘벗어납니다’로 옮겼습니다. ‘율법’ 대신 ‘법’을 사용하여 특정한 모세 율법이라는 불필요한 함의를 피했습니다.
  issues:
