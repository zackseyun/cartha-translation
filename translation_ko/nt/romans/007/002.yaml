revisions:
- from: 결혼한 여인은 남편이 살아 있는 동안에는 율법으로 그 남편에게 매여 있으나, 남편이 죽으면 그 남편에 관한 율법에서 풀려납니다.
  to: 결혼한 여인은 남편이 살아 있는 동안 법에 의해 남편에게 매여 있지만, 남편이 죽으면[a] 남편과 관련된 법에서 벗어납니다.
  rationale: 일반적 혼인법을 가리키는 νόμος를 ‘법’으로 옮겨 특정 율법이라는 함의를 피했습니다. 마지막 속격은 한국어에서 오해하기 쉬우므로 본문에서는 관계를 분명히 하고, 직역 가능한 대안과 그 법적 의미를 각주에 보존했습니다. 죽음이 법적 구속으로부터의 해제 근거라는 원문의 논리와 완료 수동의 현재적 결과도 유지했습니다.
