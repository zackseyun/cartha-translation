    issue: ἐπιθυμία를 ‘탐욕’으로 번역함
    rationale: ‘탐욕’은 탐욕스러운 성향 또는 greed의 뜻으로 넓게 들릴 수 있습니다. 여기서는 즉시 ‘탐내지 말라’는 계명을 인용하므로 ‘탐내는 것’이 동사와의 어휘적 대응 및 문맥상 특정한 금지 행위를 더 정확히 나타냅니다.
  - severity: low
