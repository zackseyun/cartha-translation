review_pass:
  verdict: revise
  source_fidelity: 핵심 논지와 조건법적 의미는 대체로 충실합니다. 다만 ἐπιθυμία를 ‘탐욕’으로 옮기면 일반적인 탐욕·탐심의 성향으로 읽힐 수 있어, 곧이어 인용되는 계명의 동사 ‘탐내다’와의 어휘적 연결이 약해집니다. ‘탐내는 것’이 원문의 반복과 구체적 의미를 더 잘 보존합니다.
  naturalness: ‘그렇다면’은 바울의 논증 전환 표현 Τί οὖν ἐροῦμεν을 자연스럽고 격식 있게 옮깁니다. ‘율법을 통하지 않고서는’은 조건절에서 더 매끄럽습니다. ‘결코 그렇지 않습니다!’는 현대 한국어 합쇼체에서 μὴ γένοιτο의 강한 부정을 자연스럽게 전달합니다.
  terminology: ‘율법’, ‘죄’, ‘탐내지 말라’는 적절합니다. ‘탐내는 것’으로 바꾸어 명령 인용과 명사 ἐπιθυμία의 관계를 드러내며, 특정 교리적 해석을 덧붙이지 않습니다.
  issues:
