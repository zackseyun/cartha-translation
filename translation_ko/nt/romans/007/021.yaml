source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: ko
  text: 그러므로 나는 이런 법을 발견합니다. 곧 내가 선한 일을 하려고 할 때 악이 내게 가까이 있다는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원리’ 또는 ‘법칙’.
    reason: νόμος는 본문에서 ‘법’으로 옮겨 원문의 표현과 모호성을 보존하되, 문맥상 지배적인 원리나 법칙을 가리킬 수 있음을 제시합니다.
lexical_decisions:
- source_word: τὸν νόμον
  english_pob_choice: this law
  chosen_korean: 이러한 원리
  alternatives_korean:
  - 이러한 법
  - 이 법칙
  lexicon: BDAG
  rationale: 여기서 νόμος는 모세 율법이 아니라 「작동하는 원리/법칙」을 가리킨다. 본 과제 정책에 따라 「원리」로 옮김.
- source_word: παράκειται
  english_pob_choice: lies close at hand
  chosen_korean: 가까이 있다
  lexicon: BDAG
  rationale: 7:18 「παράκειταί μοι」와 연결.
theological_decisions:
- issue: 7:21의 νόμος를 「율법」 대신 「원리」로 옮김
  chosen_reading: 「원리」
  alternative_readings:
  - 「법」
  - 「율법」
  rationale: 본 절의 νόμος는 모세 율법이 아니라 7:15-20에서 묘사된 인간 내면의 작동 원리·법칙을 지칭한다. 본 과제 정책 — 「Mosaic 율법은 율법, 다른 law는 법/원리」 — 에 따라 「원리」 채택. 7:23과 8:2도 동일 원칙 적용.
  doctrine_reference: 본 과제 용어집
