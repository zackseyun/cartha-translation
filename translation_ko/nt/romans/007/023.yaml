  source_fidelity: 전반적으로 원문의 반복되는 νόμος(‘법’)와 전쟁·포로 은유를 충실히 보존합니다. 다만 ‘죄의 법으로 나를 사로잡는’에서 ‘으로’는 수단·도구의 뜻으로 읽힐 수 있어, ἐν τῷ νόμῳ τῆς ἁμαρτίας가 나타내는 죄의 법 아래로 포로가 되는 상태를 더 분명히 하는 편이 좋습니다.
  naturalness: ‘내 지체 가운데서’, ‘내 마음의 법’, ‘거슬러 싸우고’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. ‘죄의 법의 포로로 삼는’은 군사적 포로 은유를 자연스럽고 분명하게 전달합니다.
  terminology: 세 차례의 νόμος를 모두 ‘법’으로 유지한 것은 원문의 수사적 반복을 잘 보존합니다. ‘지체’, ‘마음’, ‘죄’도 문맥상 적절합니다.
  issues:
