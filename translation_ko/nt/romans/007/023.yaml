    issue: ‘죄의 법으로 나를 사로잡는’의 조사 ‘으로’가 수단을 뜻할 수 있음
    rationale: 원문의 ἐν τῷ νόμῳ τῆς ἁμαρτίας는 포로가 된 결과가 죄의 법의 지배 아래에 놓임을 나타냅니다. 한국어 ‘~으로 사로잡다’는 ‘~을 수단으로 사로잡다’로도 이해될 수 있으므로, ‘죄의 법의 포로로 삼는’으로 옮겨 종속 상태와 αἰχμαλωτίζω의 포로 은유를 함께 드러내는 것이 안전합니다.
