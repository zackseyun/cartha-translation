    rationale: ‘모든 사람이 보기에’는 바울의 권면이 사람들 앞에서 외형적으로 행하는 것만이 아니라, 모든 이가 보기에 선하고 존중할 만한 것을 숙고한다는 뜻을 더 잘 전달합니다.
