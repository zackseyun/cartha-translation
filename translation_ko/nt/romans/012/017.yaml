    issue: καλά의 대안 의미를 보존하는 각주가 없습니다.
    rationale: 원문의 καλὰ는 ‘선한 것’ 외에 ‘명예로운 것’ 또는 ‘고귀한 것’이라는 의미 범위를 지닙니다. 영어 POB의 어휘 대안 각주에 상응하는 한국어 각주를 두는 것이 번역 결정의 투명성을 높입니다.
  - severity: low
