  source_fidelity: 원문의 μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες는 ‘누구에게도 악을 악으로 갚지 말고’로 정확히 옮길 수 있습니다. προνοούμενοι는 신중히 고려하고 미리 마음을 쓰는 뜻이며, ‘선한 일을 도모하십시오’는 이 권면의 지속적·숙고적 성격을 무리 없이 반영합니다. ἐνώπιον πάντων ἀνθρώπων은 단순한 물리적 위치보다 모든 사람이 판단하고 보는 공적 관점을 뜻하므로 ‘모든 사람이 보기에’가 더 자연스럽고 정확합니다.
  naturalness: 초안의 ‘모든 사람 앞에서 선한 것을 도모하십시오’도 이해되지만, ‘모든 사람이 보기에 선한 일을 도모하십시오’가 현대 표준어에서 더 자연스럽고 문맥상 분명합니다. 합쇼체 권면의 격식도 유지됩니다.
  terminology: καλά의 넓은 윤리적 의미를 본문에서는 ‘선한 일’로 유지했습니다. 이 말에는 ‘명예로운 것/고귀한 것’의 뉘앙스도 있으므로 영어 POB 감사 기록에 맞추어 각주로 보존했습니다. ‘악’과 ‘갚다’는 보복의 도덕적 의미를 적절히 유지합니다.
  issues:
