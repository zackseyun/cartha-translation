  source_fidelity: 첫 구절의 ἀνυπόκριτος는 ‘거짓이 없는’보다 ‘위선이 없는/꾸밈이 없는’에 가깝습니다. ‘거짓’은 주로 사실과 다른 말이나 허위를 뜻하여 위선·가식이라는 원문의 윤리적 의미를 충분히 나타내지 못합니다. ἀποστυγοῦντες의 강한 혐오의 뜻도 ‘몹시 미워하고’로 드러내는 것이 적절합니다. ‘선에 굳게 붙어 있으십시오’는 κολλώμενοι의 지속적이고 긴밀한 결속을 잘 반영합니다.
  naturalness: ‘사랑에는 위선이 없게 하십시오’는 현대 표준어 합쇼체로 자연스럽고, 뒤의 권면들과도 잘 연결됩니다. ‘악을 몹시 미워하고, 선에 굳게 붙어 있으십시오’는 병렬된 권면의 흐름과 격식을 유지합니다.
  terminology: ἀγάπη는 ‘사랑’, πονηρόν은 ‘악’, ἀγαθῷ는 ‘선’으로 옮기는 것이 간결하며 원문의 대조를 보존합니다. ἀνυπόκριτος는 ‘위선이 없는’으로 옮겨 ‘거짓이 없는’이 야기할 수 있는 의미 이동을 피합니다.
  issues:
  - severity: medium
    issue: ‘거짓이 없게’는 ἀνυπόκριτος의 의미를 충분히 반영하지 못합니다.
    rationale: ἀνυπόκριτος는 연기하지 않음, 가식·위선이 없음을 뜻합니다. 한국어 ‘거짓이 없다’는 거짓말을 하지 않거나 사실과 다르지 않다는 뜻으로 주로 이해될 수 있습니다.
  - severity: low
    issue: ‘악을 미워하고’는 ἀποστυγοῦντες의 강도를 다소 약하게 나타냅니다.
    rationale: 이 동사는 단순한 미움보다 강한 혐오·배척을 나타내므로 ‘몹시 미워하고’가 그 어감을 더 잘 살립니다.
