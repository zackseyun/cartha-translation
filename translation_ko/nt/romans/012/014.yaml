  source_fidelity: 그리스어의 현재 명령형 복수 εὐλογεῖτε의 반복과, 관사화된 분사 τοὺς διώκοντας(문맥상 ‘여러분을 박해하는 자들’), 그리고 μὴ καταρᾶσθε의 금지 명령을 충실히 옮겼습니다. ‘여러분을’은 한국어에서 대상 관계를 자연스럽게 드러내는 문맥적 보충이며 의미를 과도하게 한정하지 않습니다.
  naturalness: ‘여러분을 박해하는 자들을 축복하십시오. 축복하고 저주하지 마십시오.’는 현대 표준 한국어의 합쇼체로 자연스럽고 간결합니다. 동사의 반복도 원문의 강조를 잘 보존합니다.
  terminology: ‘박해하다’, ‘축복하다’, ‘저주하다’는 신약 문맥과 현대 한국어 성경 문체 모두에서 널리 통용되는 적절한 용어입니다. 특정 교파적 해석을 덧붙이지 않습니다.
