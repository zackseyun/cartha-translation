review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the body/members metaphor and the differentiated πρᾶξις as “기능.” However, it does not explicitly represent γάρ (“for”), and its doubled comparative phrasing (“마치 … 것 같이”) is syntactically awkward. The revised wording retains the verse’s anticipatory comparison, which is completed in v. 5.
  naturalness: “한 몸에 우리가 많은 지체를 가졌지만” is less natural Korean than describing the body as having its members. “왜냐하면 한 몸에는 … 것처럼” is a natural way to preserve both the explanatory and comparative connections while leaving the sentence open for the following verse.
  terminology: “지체” is the established Korean rendering for μέλη in Paul’s body metaphor and is retained. “기능” is a natural, contextually appropriate rendering of πρᾶξις; it does not overdefine the term as a formal office or role.
  issues:
  - severity: medium
    issue: γάρ is unrepresented.
    rationale: The draft begins only with “마치,” which represents καθάπερ but omits the explanatory connective γάρ. “왜냐하면” preserves the connection to the preceding exhortation.
  - severity: medium
    issue: The Korean comparative construction is awkward and redundant.
    rationale: “마치 한 몸에 … 아닌 것 같이” uses two overlapping comparative signals and produces an unnatural clause. A single final “것처럼” naturally represents καθάπερ and preserves the comparison’s continuation into the next verse.
  revised_text: 왜냐하면 한 몸에는 많은 지체가 있으나, 모든 지체가 같은 기능을 하는 것은 아닌 것처럼,
  revised_footnotes:
  - marker: a
    text: 또는 “많은 부분들”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “같은 활동”. 그리스어 낱말은 활동 또는 기능을 뜻할 수 있으나, 여기서는 몸의 비유와 서로 다른 역할의 문맥상 “기능”이 알맞습니다.
    reason: lexical_alternative
  revision_rationale: γάρ를 “왜냐하면”으로, καθάπερ를 절 끝의 “것처럼”으로 옮겨 원문의 논증적·비교적 연결을 보존했습니다. “한 몸에는 많은 지체가 있으나”는 원문의 몸 비유를 자연스러운 한국어로 표현하며, 끝의 쉼표는 비교가 다음 절에서 완성됨을 유지합니다.
