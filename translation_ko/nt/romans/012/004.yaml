review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the body metaphor, πολλὰ μέλη as ‘many members,’ and πρᾶξις as ‘function.’ However, it omits the explanatory γάρ (‘for/because’), and its comparative construction should remain open-ended because Paul completes it in the following verse.
  naturalness: ‘마치 … 아닌 것 같이’ is redundant and less natural in modern Korean. ‘… 아닌 것처럼’ is the idiomatic comparative form. Adding ‘왜냐하면’ naturally represents γάρ while allowing the comparison to continue into verse 5.
  terminology: ‘지체’ is an established and appropriate Korean rendering for μέλη in Paul’s body metaphor. ‘기능’ appropriately conveys πρᾶξις here without importing a more interpretive term such as ‘role.’
  issues:
  - severity: medium
    issue: γάρ is not represented.
    rationale: The Greek explicitly marks this statement as explanatory in relation to the preceding exhortation. ‘왜냐하면’ preserves that connection without adding interpretation.
  - severity: medium
    issue: The Korean comparative phrasing is awkward and redundant.
    rationale: ‘마치 … 것 같이’ duplicates comparison markers. ‘… 아닌 것처럼’ is natural Korean and preserves the source’s unfinished comparison, which continues in the next verse.
  revised_text: 왜냐하면 우리가 한 몸에 많은 지체를 가지고 있지만, 모든 지체가 다 같은 기능을 하는 것은 아닌 것처럼,
  revised_footnotes: []
  revision_rationale: The revision restores γάρ with ‘왜냐하면,’ retains the first-person ‘우리가 … 가지고’ for ἔχομεν, preserves ‘지체’ and ‘기능,’ and uses an idiomatic open comparative construction that correctly carries forward into the next verse.
