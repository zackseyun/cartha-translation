- from: 도리어 「네 원수가 주리거든 그를 먹이고, 목마르거든 그에게 마시게 하라. 이렇게 함으로 네가 그의 머리 위에 숯불을 쌓아 올릴 것이다.」
  to: 그러나 당신의 원수가 배고프거든 그에게 먹을 것을 주십시오. 목마르거든 그에게 마실 것을 주십시오. 이렇게 하면 당신은 그의 머리 위에 불타는 숯을 쌓게 될 것입니다.[a]
  rationale: 명령문과 결과절을 현대 정중체 합쇼체로 통일하고, ‘마실 것을 주십시오’로 ποτίζω의 제공 의미를 명확히 했습니다. ἀλλά의 대조는 ‘그러나’로, ἐάν의 조건은 ‘-거든’으로, σωρεύσεις의 미래 결과는 ‘쌓게 될 것입니다’로 반영했습니다. 비유와 그 해석상의 긴장은 본문과 각주에서 보존했습니다.
