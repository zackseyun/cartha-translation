  verdict: revise
  source_fidelity: 원문의 대조·조건 구조와 명령 및 미래 결과는 대체로 반영되어 있습니다. 그러나 합쇼체 요구에 비해 초안의 명령형(‘먹이고’, ‘마시게 하라’)과 결말(‘네가 … 것이다’)의 높임 종결이 일관되지 않습니다. 또한 πότιζε는 단순히 억지로 마시게 한다는 뜻보다 ‘마실 것을 주다’로 옮기는 편이 정확하고 자연스럽습니다.
  naturalness: ‘마시게 하라’는 현대 한국어에서 다소 강제적인 뉘앙스를 낼 수 있으며 합쇼체도 아닙니다. ‘마실 것을 주십시오’가 자연스럽습니다. 인용부호는 원문에 직접 인용 표지가 없으므로 본문에서는 제거했습니다.
  terminology: ἄνθρακας πυρός의 비유는 ‘불타는 숯’으로 보존했습니다. 그 의미가 회개를 낳는 부끄러움, 도덕적 자각, 심판 가운데 어느 하나로 단정될 수 없으므로 각주에서만 해석 가능성을 제한적으로 밝혔습니다.
