id: ROM.12.20
reference: Romans 12:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
  footnotes:
  - marker: a
    text: Or 'coals of fire.' The image may suggest shame leading to repentance, painful moral conviction, or impending judgment; the Greek metaphor is left intact in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신의 원수가 배고프거든 그에게 먹을 것을 주십시오. 목마르거든 그에게 마실 것을 주십시오. 이렇게 하면 당신은 그의 머리 위에 불타는 숯을 쌓게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불의 숯들’입니다. 이 비유는 회개로 이끄는 부끄러움, 고통스러운 도덕적 자각, 또는 다가올 심판을 가리킬 수 있으나, 본문은 그 비유를 그대로 둡니다.
    reason: ‘불타는 숯을 그의 머리 위에 쌓다’라는 비유의 의미가 논쟁적이므로, 본문에서 특정 해석을 확정하지 않고 원문의 이미지를 보존합니다.
