  - severity: medium
    issue: πότιζε의 번역
    rationale: ‘마시게 하라’는 강제로 마시게 한다는 뜻으로 들릴 수 있습니다. 문맥상 ‘마실 것을 주십시오’가 ‘마실 것을 제공하다’라는 동사의 뜻을 더 잘 전달합니다.
