  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
  footnotes:
  - marker: a
    text: Or 'do not aspire to lofty things' or 'do not be haughty.'
    reason: lexical_alternative
  - marker: b
    text: Or 'associate with the humble'; the Greek may mean either lowly people or lowly things.
    reason: alternative_reading
translation:
  language: ko
  text: 서로에게 같은 마음을 품으십시오. 높은 것을 마음에 두지 말고, 낮은 것들과 함께 이끌려 가십시오[a]. 스스로 지혜로운 자가 되지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “낮은 이들과 어울리십시오.” 그리스어는 낮은 처지의 사람들을 가리킬 수도 있고 낮은 것들이나 낮은 일들을 가리킬 수도 있습니다.
    reason: alternative_reading
