source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
  footnotes:
  - marker: a
    text: Or 'but to think so as to be sober-minded.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the measure of faith' or possibly 'a measure of faithfulness/trust.' The Greek phrase may refer to a God-given measure related to faith without specifying the exact nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 내게 주신 은혜로 말미암아 여러분 가운데 있는 각 사람에게 내가 말합니다. 마땅히 생각해야 할 것 이상으로 자신을 높이 생각하지 말고, 오히려 하나님께서 각 사람에게 나누어 주신 믿음의 분량에 맞추어 분별력 있게 생각하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερφρονεῖν
  english_pob_choice: think of himself more highly
  chosen_korean: 자기를 높이 생각하지
  alternatives_korean:
  - 과대평가하지
  lexicon: BDAG
  rationale: ὑπερ- 접두사의 「지나치게」를 「높이」로 자연스럽게.
- source_word: σωφρονεῖν
  english_pob_choice: sound judgment
  chosen_korean: 절제 있게 생각하십시오
  alternatives_korean:
  - 분별 있게 생각하십시오
  - 건전하게 생각하십시오
  lexicon: BDAG
  rationale: σωφροσύνη의 「자기 절제」 의미를 살린다.
- source_word: μέτρον πίστεως
  english_pob_choice: measure of faith
  chosen_korean: 믿음의 분량
  alternatives_korean:
  - 믿음의 척도
  lexicon: BDAG
  rationale: 전통적 한국어 신학 어휘.
