review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 마지막의 ‘믿음의 분량을 따라서 말입니다’는 ὡς ὁ θεὸς ἐμέρισεν의 수식 관계를 한국어에서 부자연스럽고 불완전하게 처리합니다. 하나님이 각 사람에게 믿음의 분량을 나누어 주셨다는 사실에 맞추어 건전하게 판단하라는 연결을 명시하는 편이 안전합니다.
  naturalness: ‘도리어 절제 있게 생각하십시오’는 가능하지만, 여기서 σωφρονεῖν은 단순한 자기 절제보다 ‘분별력 있고 건전한 판단’을 가리킵니다. 또한 종결부 ‘말입니다’는 현대 정중한 합쇼체 본문 문체에 맞지 않고 문장 구조도 어색합니다.
  terminology: ‘은혜’, ‘믿음’, ‘분량’은 적절합니다. σωφρονεῖν은 ‘분별력 있게 생각하십시오’로 옮겨 판단의 의미와 φρονέω의 반복을 더 잘 반영합니다.
  issues:
  - severity: medium
    issue: 마지막 절의 연결이 불완전하고 어색함
    rationale: ‘하나님께서 각 사람에게 나누어 주신 믿음의 분량을 따라서 말입니다’는 서술어 없이 끝나며, 원문의 ὡς 절이 ‘분별력 있게 생각하라’는 권면을 한정하는 관계를 명료하게 전달하지 못합니다.
  - severity: low
    issue: σωφρονεῖν을 ‘절제 있게 생각하십시오’로 한정함
