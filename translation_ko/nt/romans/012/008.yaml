  naturalness: 「권면하는 자이면」 및 「할 것입니다」의 결합은 현대 표준 한국어 합쇼체에서 어색합니다. 병렬 구조를 유지하면서 마지막에 「하십시오」를 두는 편이 자연스럽고 명료합니다.
  terminology: παρακαλῶν/παρακλήσει는 「권면하는 사람은 권면하는 일에」로 동족어 관계를 살렸습니다. μεταδιδοὺς/ἁπλότης는 문맥상 「나누어 주는 사람은 후히」가 적절하며, προϊστάμενος는 특정 직분을 한정하지 않는 「이끄는 사람」으로, ἐλεῶν/ἱλαρότης는 「자비를 베푸는 사람은 기쁜 마음으로」로 옮겼습니다.
