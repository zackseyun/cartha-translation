  verdict: revise
  source_fidelity: The three coordinated present participles are represented accurately as continuing exhortations. However, ‘항상’ can imply uninterrupted prayer, whereas προσκαρτεροῦντες more specifically calls for steadfast, devoted persistence in prayer. ‘꾸준히 힘쓰십시오’ expresses this sense without imposing an absolute temporal claim.
  naturalness: The compact three-part coordination is natural in modern formal-polite Korean. ‘소망 가운데’ and ‘환난 가운데’ are idiomatic and appropriately parallel.
  terminology: ‘소망,’ ‘환난,’ and ‘기도’ are established, intelligible Korean biblical terms. ‘견디며’ suitably renders ὑπομένοντες.
  issues:
  - severity: low
    issue: ‘항상’ is somewhat stronger and more temporally absolute than the Greek verb.
    rationale: προσκαρτερέω denotes steadfast continuance or devoted persistence, not necessarily praying without interruption. Replacing it with ‘꾸준히’ better preserves the lexical emphasis.
  revised_text: 소망 가운데 기뻐하고, 환난 가운데 견디며, 기도에 꾸준히 힘쓰십시오.
