  source_fidelity: ‘은사’는 χαρίσματα에 알맞고, ‘우리에게 주신 은혜를 따라’도 κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν을 충실히 옮깁니다. 그러나 ‘믿음의 분수’는 현대 한국어에서 자연스럽지 않고, 믿음의 개인적 분량이라는 해석으로 좁혀질 수 있습니다. ἀναλογίαν τῆς πίστεως의 논쟁적인 폭을 유지하려면 ‘믿음에 비례하여’가 더 적절합니다.
