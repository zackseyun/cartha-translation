  to: 여러분은 이 시대를 본받지 말고, 마음을 새롭게 함으로 변화를 받으십시오. 그리하면 여러분은 하나님의 뜻, 곧 선하고 하나님을 기쁘시게 하며 온전한 뜻이 무엇인지 분별하게 될 것입니다.
  rationale: 목적·결과를 나타내는 εἰς τὸ δοκιμάζειν을 한국어에서 자연스러운 귀결 표현인 ‘그리하면 … 분별하게 될 것입니다’으로 옮겼습니다. 세 형용사는 모두 하나님의 뜻을 수식하므로, εὐάρεστον의 수혜자가 하나님이심을 ‘하나님을 기쁘시게 하며’로 밝혔습니다. ‘본받지 말고/변화를 받으십시오’의 명령 및 수동 표현은 유지했습니다.
