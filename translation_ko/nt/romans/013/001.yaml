  source_fidelity: 본문의 주요 의미는 대체로 정확합니다. Πᾶσα ψυχὴ를 「각 사람」으로, ὑποτασσέσθω를 합쇼체 명령 「복종하십시오」로 옮긴 것은 적절합니다. 「하나님으로부터 나오지 않은 권세가 없고」는 οὐ ... εἰ μὴ ὑπὸ θεοῦ의 배타적 근원을 잘 전달하며, 「하나님께서 세우신 것입니다」도 τεταγμέναι의 완료 수동태와 신적 행위자를 무리 없이 반영합니다.
  naturalness: 「현존하는」은 이 문맥에서 지나치게 추상적·철학적으로 들립니다. αἱ οὖσαι가 가리키는 실제로 존재하는 권세들을 자연스러운 현대 한국어로 「있는 권세들은」이라고 하는 것이 좋습니다. 나머지 문장은 현대 합쇼체로 자연스럽습니다.
  terminology: 「위에 있는 권세들」은 ὑπερεχούσαι의 상위 위치와 ἐξουσίαι의 통치적 의미를 보존하는 전통적이면서도 이해 가능한 표현입니다. 다만 각주에는 원문의 실제 형태인 여격 복수 「ἐξουσίαις ὑπερεχούσαις」를 제시하고, 비표준적으로 붙여 쓴 「질서지우신」은 「질서 안에 두신」으로 고치는 것이 정확하고 자연스럽습니다.
