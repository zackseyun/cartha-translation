  source_fidelity: 「그러므로」는 διὸ의 추론적 연결을 정확히 살립니다. 「복종하는 것이 필요하니」는 ἀνάγκη ὑποτάσσεσθαι의 필요·당위와 부정사 구문을 자연스럽게 반영합니다. 「진노 때문만이 아니라 양심 때문이기도 합니다」는 οὐ μόνον … ἀλλὰ καὶ … 및 두 διά 대격의 이유·동기 용법을 충실히 옮기며, ὀργή의 지시 대상도 특정하지 않습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽고 간결합니다. 「필요하니」와 최종 종결 「합니다」의 연결도 문맥상 적절합니다.
  terminology: 「복종」은 이 문맥의 ὑποτάσσεσθαι를 통상적이고 이해하기 쉬운 한국어로 옮깁니다. 「진노」는 「형벌」처럼 해석을 좁히지 않으며, 「양심」도 συνείδησις의 핵심 의미를 잘 전달합니다.
