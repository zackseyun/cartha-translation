  naturalness: 직접 인용의 「~하지 말라」와 「~사랑하라」는 십계명 및 레위기 인용의 정형이므로 현대 합쇼체 본문 안에서도 자연스럽습니다. 본문 서술은 「이는 … 때문입니다」로 매끄럽게 연결하고, 「네 자신과 같이」로 표준적인 띄어쓰기와 표현을 사용했습니다.
