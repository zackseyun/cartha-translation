review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 ἢ ὅτε ἐπιστεύσαμεν에 없는 「처음」을 본문에 보충하며, ὑμᾶς의 본문 읽기와 이문을 설명하는 각주 문구도 부정확합니다. 또한 「때를 알고 있기 때문입니다」는 명령문과 분리되어 εἰδότες의 수식 관계가 다소 흐려집니다.
  naturalness: 「여러분은 때를 알고 있으니, 이렇게 행하십시오」는 현대 표준어 합쇼체에서 자연스럽고, 분사구문의 인과적 기능과 앞 절의 윤리적 권면을 함께 드러냅니다. 「잠에서 깨어날 때가 이미 되었습니다」도 ὥρα와 ἤδη의 긴급성을 자연스럽게 전달합니다.
  terminology: 「구원」은 원문의 종말론적 긴장을 불필요하게 특정하지 않는 적절한 용어입니다. 「우리가 믿었을 때」로 하여 원문에 없는 「처음」을 제거합니다. 이문 각주는 본문 읽기인 「여러분」과 대안 읽기인 「우리」를 정확히 대조하도록 고칩니다.
  issues:
  - severity: medium
    issue: 「처음 믿었을 때보다」에 「처음」이 본문에 추가되어 있습니다.
    rationale: ἐπιστεύσαμεν은 단지 ‘우리가 믿었을 때’를 뜻합니다. ‘처음’은 문맥상 가능한 해석이나 본문에 명시되어 있지 않으므로 본문에 넣지 않아야 합니다.
  - severity: high
    issue: 본문의 ὑμᾶς 이문을 설명하는 각주가 문법적으로 불완전하고 대조 대상이 부정확합니다.
    rationale: 초안 각주는 「여러분이」 대신 「우리가 잠에서 깨어날 시각」으로 읽는다고 하여 대안 읽기를 정확히 제시하지 못합니다. 일부 사본의 대안은 해당 부정사의 의미상 주어를 ‘여러분’에서 ‘우리’로 읽는 것입니다.
  - severity: low
    issue: 「때를 알고 있기 때문입니다」가 독립 문장으로 처리되어 εἰδότες와 명령의 연결이 약합니다.
    rationale: 원문의 분사는 앞선 권면을 수행할 근거를 제시합니다. 한국어에서는 「알고 있으니」로 명령문에 연결하는 것이 더 자연스럽고 충실합니다.
  revised_text: 또한 여러분은 때를 알고 있으니, 이렇게 행하십시오. 이제 여러분이[a] 잠에서 깨어날 때가 이미 되었습니다. 우리가 믿었을 때보다 우리의 구원이 지금 더 가까워졌기 때문입니다.
