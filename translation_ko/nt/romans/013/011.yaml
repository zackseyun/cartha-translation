revisions:
- from: 그리고 이렇게 행하십시오[a]. 때를 알고 있기 때문입니다. 곧 여러분이 잠에서 깨어날 시각이 이미 이르렀습니다. 우리가 처음 믿었을 때보다 우리의 구원이 지금 더 가까워졌기 때문입니다.
  to: 또한 여러분은 때를 알고 있으니, 이렇게 행하십시오. 이제 여러분이[a] 잠에서 깨어날 때가 이미 되었습니다. 우리가 믿었을 때보다 우리의 구원이 지금 더 가까워졌기 때문입니다.
  rationale: 명령과 그 근거를 자연스러운 한국어 문장 구조로 연결하고, 원문에 없는 「처음」을 삭제했습니다. 본문 비평 이문은 ὑμᾶς(여러분)와 ἡμᾶς(우리)의 차이를 정확히 반영하도록 각주를 고쳤습니다. 「우리의 구원」과 「더 가까워졌습니다」는 구원이 이미 관련되어 있으면서도 아직 다가오는 원문의 긴장을 유지합니다.
