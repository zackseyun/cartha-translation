- from: 통치자들은 선한 행실에는 두려움이 되지 아니하고 악한 행실에는 두려움이 됩니다. 권세를 두려워하지 않기를 원합니까? 선을 행하십시오. 그러면 권세[a]로부터 칭찬을 받을 것입니다.
  to: 통치자들은 선한 행위에는 두려움의 대상이 아니지만, 악한 행위에는 두려움의 대상입니다. 권세를 두려워하지 않기를 원합니까? 선을 행하십시오. 그러면 그 권세[a]로부터 칭찬을 받을 것입니다.
