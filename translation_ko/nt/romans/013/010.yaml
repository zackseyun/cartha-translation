  source_fidelity: 본문은 ἡ ἀγάπη의 반복을 모두 ‘사랑’으로 유지하고, τῷ πλησίον을 ‘이웃에게’로, κακὸν οὐκ ἐργάζεται를 자연스러운 한국어인 ‘해를 끼치지 않습니다’로 충실히 옮깁니다. οὖν의 추론적 기능도 ‘그러므로’로 드러납니다. ‘사랑이 율법의 완성입니다’는 πλήρωμα νόμου ἡ ἀγάπη라는 명사 술어 구문과 의미를 잘 보존합니다.
  naturalness: 표준어 현대 합쇼체로 자연스럽고, 짧은 격언적 문맥에 맞는 명료한 문장입니다. ‘이웃에게 해를 끼치지 않습니다’와 ‘율법의 완성입니다’ 모두 현대 한국어 성경 문체에서 무리 없이 이해됩니다.
  terminology: ‘사랑’, ‘이웃’, ‘율법’, ‘완성’은 문맥과 한국어 성경 어휘 관습에 적절합니다. ‘완성’은 13:8의 πληρόω 계열과의 어휘적 연관도 무리 없이 반영합니다. 각주 a와 b는 각각 ‘악을 행하다’ 및 ‘충만함’이라는 가능한 어휘 대안을 적절히 제시합니다.
