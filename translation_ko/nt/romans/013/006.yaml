    text: 또는 「하나님의 공직 수행자들」. 헬라어 λειτουργός는 공적 직무를 수행하는 이를 가리킬 수 있으며, 칠십인역에서는 종교적 봉사와 관련해서도 사용된다.
    reason: lexical_alternative
  revision_rationale: The revision keeps the source’s causal connection and emphasis (διὰ τοῦτο, καί, αὐτὸ τοῦτο), uses idiomatic Korean for tax payment, and avoids the specialized church-ministry implication of 「사역자」 while preserving the λειτουργός word’s public-service and religious-service range in the note.
