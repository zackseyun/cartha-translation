  rationale: 부끄러움 없는 무절제. 「방탕」이 한국 성경 관행상 자연스럽다.
- source_word: ἔριδι
  english_pob_choice: strife
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 싸움
  lexicon: BDAG
  rationale: 「다툼」이 간결.
- source_word: ζήλῳ
  english_pob_choice: jealousy
  chosen_korean: 시기
  alternatives_korean:
  - 질투
  - 열심
  lexicon: BDAG
  rationale: 악행 목록 안에서 부정적 의미. 「시기」로 옮긴다.
