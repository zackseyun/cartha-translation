- from: 낮에 행하는 것처럼 단정히[a] 걸읍시다. 흥청거림과 술 취함에 빠지지 말고, 성적 음란과 방탕에 빠지지 말며, 다툼과 시기[b]에 빠지지 마십시오.
  to: 낮에 하듯이 품위 있게[a] 살아갑시다. 흥청거리거나 술에 취하거나, 음행하거나 방탕하거나, 다투거나 시기[b]하면서 살아가지 맙시다.
