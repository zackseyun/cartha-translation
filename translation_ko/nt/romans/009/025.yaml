  source_fidelity: 초안은 인용의 기본 의미와 호세아 인용을 잘 전달합니다. 그러나 헬라어의 단수 형태와 둘째 구의 여성 단수를 각각 복수 ‘자들’과 성별이 드러나지 않는 ‘자’로 옮겨, 원문의 형식적 대비가 약해졌습니다. 또한 ‘사랑받는’은 완료 수동 분사의 결과 상태보다 현재적 의미로 읽힐 수 있습니다.
