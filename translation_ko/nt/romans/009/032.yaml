  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
  footnotes:
  - marker: a
    text: Or 'not by faith' or 'not on the basis of faith.' The Greek reads 'not from faith.'
    reason: lexical_alternative
  - marker: b
    text: Or 'but as though it were from works.' The wording preserves the nuance of 'as if.'
    reason: lexical_alternative
  - marker: c
    text: An allusion to Isaiah 8:14; compare also Isaiah 28:16 in the next verse.
    reason: cross_reference
  - marker: d
    text: Or 'the stone of offense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 그렇습니까? 그들이 믿음[a]에 근거하여가 아니라 행위에 근거한 것인 양[b] 추구했기 때문입니다. 그들은 걸림돌[d][c]에 걸려 넘어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음으로’, ‘믿음에 기초하여’. 그리스어는 직역하면 ‘믿음에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그러나 마치 행위에 근거한 것처럼’. ‘것인 양’은 그리스어 ὡς(‘마치, ~인 것처럼’)의 뉘앙스를 살립니다.
    reason: lexical_alternative
  - marker: c
    text: 이사야 8:14을 암시하며, 다음 절에서는 이사야 28:16도 비교하십시오.
    reason: cross_reference
  - marker: d
    text: 또는 ‘걸려 넘어지게 하는 돌’, ‘걸림의 돌’.
    reason: lexical_alternative
