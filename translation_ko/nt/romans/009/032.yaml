revisions:
- from: 어찌하여 그렇습니까? 그것은 믿음에서가 아니라, 마치 행위에서 난 것처럼 추구했기 때문입니다. 그들은 그 걸림돌에 걸려 넘어졌습니다.
  to: 왜 그렇습니까? 그들이 믿음[a]에 근거하여가 아니라 행위에 근거한 것인 양[b] 추구했기 때문입니다. 그들은 걸림돌[d][c]에 걸려 넘어졌습니다.
  rationale: 문맥상 생략된 ‘추구하다’는 한국어 문장을 완결하기 위해 유지하되, ‘행위에서 난’이라는 부정확한 표현을 ‘행위에 근거한 것인 양’으로 바꾸어 ὡς ἐξ ἔργων의 완화된 근거·기준의 의미를 보존했습니다. 문체는 현대 표준어 합쇼체로 다듬었고, 관련 각주를 본문에 앵커와 함께 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:36:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands the elliptical clause in light of the preceding context and accurately renders προσέκοψαν as ‘걸려 넘어졌습니다.’ However, ‘행위에서 난 것처럼’ can imply that something originated or was born from works, rather than expressing the Greek ὡς ἐξ ἔργων (‘as if on the basis of works’).
  naturalness: ‘어찌하여 그렇습니까?’ is grammatical but less natural than ‘왜 그렇습니까?’ in contemporary formal Korean. ‘행위에 근거한 것인 양’ is both idiomatic and appropriately preserves the qualifying force of ὡς.
  terminology: ‘믿음,’ ‘행위,’ and ‘걸림돌’ are suitable, consistent renderings. ‘걸림돌’ concisely conveys λίθος τοῦ προσκόμματος; the footnote preserves the more explicit alternative.
  issues:
  - severity: medium
    issue: ‘마치 행위에서 난 것처럼’ is semantically imprecise for ὡς ἐξ ἔργων.
    rationale: In this faith/works contrast, ἐκ denotes basis or source. ‘난’ can suggest birth or production, whereas ‘행위에 근거한 것인 양’ naturally conveys pursuing righteousness as though it rested on works.
  - severity: low
    issue: The lexical and cross-reference notes from the English audit trail are not represented in the Korean draft.
    rationale: Adding anchored Korean notes preserves significant alternatives, the force of ‘as if,’ and the Isaiah allusion without altering the translation.
