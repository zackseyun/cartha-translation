    issue: 권한과 권리의 중복
    rationale: 초안은 ἐξουσία를 ‘권한’으로 옮긴 뒤 동일한 구문 안에서 다시 ‘만들 권리’라고 하여, 한 원어 표현을 중복 번역하고 문장도 어색하게 만듭니다.
  - severity: low
    issue: ‘그 진흙에 대해’의 지시성과 결합
    rationale: 정관사적 ‘그’는 원문에 없는 특정성을 더하며, ‘진흙에 대해 권한’보다 ‘진흙을 두고 권한’이 이 문맥에서 더 자연스럽습니다.
  - severity: medium
    issue: ‘귀히 쓰일/천히 쓰일’의 현대성 및 목적 표현
    rationale: 초안의 표현은 이해되지만 다소 고풍스럽고 수동적입니다. 원문의 εἰς τιμήν / εἰς ἀτιμίαν은 그릇의 목적을 나타내므로 ‘귀하게 쓸/천하게 쓸’이 현대적이면서도 충실합니다.
