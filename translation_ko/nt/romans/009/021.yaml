review_pass:
  verdict: revise
  source_fidelity: 개정안은 ἐξουσία를 ‘권한’으로, τοῦ πηλοῦ를 ‘진흙을 두고’로 옮겨 토기장이와 진흙의 권위 관계를 보존합니다. 또한 ἐκ τοῦ αὐτοῦ φυράματος은 ‘같은 진흙 덩어리로’로, εἰς τιμήν / εἰς ἀτιμίαν은 용도를 과도하게 교리화하지 않는 ‘귀하게 쓸 / 천하게 쓸’의 대조로 옮겼습니다.
  naturalness: 초안의 ‘권한이 있어서 … 만들 권리가 없습니까?’는 한 문장 안에서 권한과 권리를 중복하고, ‘그 진흙에 대해’도 다소 부자연스럽습니다. 개정문은 현대 표준어의 합쇼체 의문문으로 자연스럽게 다듬었습니다.
  terminology: ‘토기장이’와 ‘권한’은 적절합니다. ‘옹기장이’는 κεραμεύς보다 좁은 한국 문화권의 특정 제작자를 연상시킬 수 있으므로 채택하지 않았습니다. ‘귀하게 쓸 그릇/천하게 쓸 그릇’은 honor–dishonor의 대조와 εἰς가 나타내는 목적을 모두 살립니다.
  issues:
