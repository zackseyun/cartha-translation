  rationale: 원문의 수사 의문문과 ‘권한—진흙—같은 덩어리—두 종류의 그릇’이라는 순서를 최대한 유지하되, 한국어에서 중복되는 ‘권한/권리’를 제거했습니다. ‘귀하게 쓸/천하게 쓸’은 명예와 불명예의 대조를 유지하며, 본문이 말하지 않는 구체적 기능이나 교리적 결론을 덧붙이지 않습니다. 영어 감사 기록의 네 주석 기능에 맞추어 앵커와 주석도 정리했습니다.
