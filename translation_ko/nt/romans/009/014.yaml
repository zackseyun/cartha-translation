  source_fidelity: 그리스어의 심의적 전환 표현(Τί οὖν ἐροῦμεν), 부정 답변을 예상하는 수사 의문문(μὴ ἀδικία), ‘하나님께/하나님에게’라는 관계 표현(παρὰ τῷ θεῷ), 그리고 강한 부정(μὴ γένοιτο)을 모두 충실히 옮겼습니다. ‘하나님께 불의가 있습니까?’는 문맥상 ‘하나님 편에 불의가 있는가’를 자연스럽게 표현하며 원문의 수사성을 보존합니다.
