source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
  footnotes:
  - marker: a
    text: 'Or “on him.” Greek: “upon him.”'
    reason: lexical_alternative
  - marker: b
    text: Or “will not be disappointed.”
    reason: lexical_alternative
  - marker: c
    text: Paul combines Isaiah 8:14 and Isaiah 28:16 here.
    reason: cross_reference
  - marker: d
    text: Some translations render “it” instead of “him,” referring back to the stone; Paul’s context applies the image to the Messiah.
    reason: alternative_reading
translation:
  language: ko
  text: 기록된 바와 같이 말씀하신 바, 「보라, 내가 시온에 걸림돌과 걸려 넘어지게 하는 바위를 둔다. 그를 믿는 사람은 수치를 당하지 않을 것입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 위에’입니다. 이 대명사를 앞선 ‘돌’을 가리켜 ‘그것을’으로 옮기는 번역도 있으나, 바울의 문맥에서는 그리스도께 적용됩니다. 바울은 여기서 이사야 8:14와 28:16을 함께 인용합니다.
    reason: alternative_reading
