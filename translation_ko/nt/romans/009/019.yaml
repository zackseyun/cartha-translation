  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
  footnotes:
  - marker: a
    text: Or “his will.” The Greek βούλημα can mean will, intention, or purpose.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 당신은 내게 이렇게 말할 것입니다. “그러면 어찌하여 그분께서는 아직도 책망하십니까? 누가 그분의 뜻[a]을 거역하였습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의지”.
    reason: βούλημα는 문맥에 따라 ‘뜻’, ‘의지’, 또는 ‘목적’을 뜻할 수 있다.
