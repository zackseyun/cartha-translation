    issue: Quoted questions are not in the required 합쇼체 register.
    rationale: ‘책망하시는가’ and ‘거역하였는가’ are formal literary plain-style interrogatives, not modern formal-polite 합쇼체. Revise to ‘책망하십니까’ and ‘거역하였습니까.’
  - severity: low
    issue: The lexical alternative for βούλημα is not retained.
    rationale: The English audit trail explicitly notes ‘will’ as a viable alternative. A brief footnote preserves this lexical range while leaving ‘뜻’ in the text.
