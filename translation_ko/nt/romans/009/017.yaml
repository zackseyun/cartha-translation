    issue: '"너에게서 내 능력을 나타내고" can imply that God''s power originates from Pharaoh.'
    rationale: ἐν σοὶ means that the power is displayed in Pharaoh's case/person. "너를 통해" is idiomatic Korean and suitably conveys the contextual means/location without the misleading source-from sense.
  - severity: low
    issue: '"바로 이 목적을 위함이니" is unnecessarily stiff for the specified modern formal-polite register.'
    rationale: '"바로 이 목적을 위해서다" is current, formal, and maintains the emphatic purpose expression.'
