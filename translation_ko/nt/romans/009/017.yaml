  naturalness: The sentence is generally clear, but "바로 이 목적을 위함이니" is stiff in modern formal Korean. "바로 이 목적을 위해서다" is natural while retaining the emphasis.
  terminology: '"성경," "바로," "능력," "이름," "온 땅" are appropriate standard Korean biblical terms. "일으켜 세웠다" is a natural rendering of ἐξήγειρά σε and retains its broad sense without settling the theological question of how Pharaoh was raised up or preserved.'
  issues:
