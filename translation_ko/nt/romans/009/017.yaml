  to: 성경은 바로에게 이렇게 말합니다. 「내가 너를 일으켜 세운 것은 바로 이 목적을 위해서다. 곧 너를 통해 내 능력을 나타내고, 내 이름이 온 땅에 전파되게 하려는 것이다.」
