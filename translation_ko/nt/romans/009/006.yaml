  source_fidelity: ‘폐하여진’은 ἐκπέπτωκεν의 여기 문맥상 의미인 ‘실패하다/효력을 잃다/헛되게 되다’와 다릅니다. 이는 ‘폐지되다’라는 뜻으로 읽혀 하나님의 말씀 자체가 폐기되었다는 다른 의미를 낳을 수 있습니다. 또한 δεύτερη ‘이스라엘’의 범위를 본문에서 해석적으로 확정하지 않는 것이 적절합니다.
