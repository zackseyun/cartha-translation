  source_fidelity: 초안은 γάρ, κύριος, λόγος, 두 분사, ποιήσει, ἐπὶ τῆς γῆς의 핵심 요소를 대체로 담고 있습니다. 그러나 「말씀을 마치시고 단축하여 ... 행하실」은 λόγον을 '행하다'의 목적어로 처리하여 한국어 결합이 부자연스럽고, 완성과 단축이 말씀의 실행을 설명하는 분사라는 관계도 흐립니다.
  naturalness: 「주께서는 땅 위에서 그 말씀을 완성하고 단축하여 이루실 것이기 때문입니다」가 현대 표준어 합쇼체로 더 자연스럽고, '말씀을 이루다'라는 결합도 적절합니다.
  terminology: κύριος는 신약 본문의 표기를 따라 「주」로 유지하는 것이 적절합니다. 다만 기존 각주는 이사야 히브리어 본문의 신명 표기를 단순히 יהוה라고 한정하여 부정확합니다(이사야 10:23의 마소라 본문은 אדני יהוה צבאות). 따라서 해당 단정은 삭제하거나 정확히 고쳐야 합니다.
  issues:
