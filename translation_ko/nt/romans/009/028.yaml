    rationale: ποιήσει λόγον은 말씀/선언을 실행·성취한다는 뜻입니다. 한국어에서는 '말씀을 행하다'보다 '말씀을 이루다'가 자연스럽고 의미도 정확합니다.
  - severity: medium
