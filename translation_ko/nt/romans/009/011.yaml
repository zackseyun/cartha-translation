    rationale: 원문의 τι ἀγαθὸν ἢ φαῦλον은 ‘선한 일이든 악한 일이든 아무것도’로 표현하는 편이 현대 한국어에서 더 자연스럽고 부정의 범위도 분명합니다.
  - severity: low
