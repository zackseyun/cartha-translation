    rationale: ‘뜻’도 가능하지만, 이 문맥의 πρόθεσις는 하나님의 목적 또는 계획을 가리키므로 ‘목적’이 더 직접적입니다.
  revised_text: 이는 그 아이들이 아직 태어나지도 않았고 선한 일이든 악한 일이든 아무것도 행하지 않았을 때에, 택하심에 따른 하나님의 목적이 계속 남아 있도록 하시려는 것이었습니다.
