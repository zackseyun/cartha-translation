  to: 이는 그 아이들이 아직 태어나지도 않았고 선한 일이든 악한 일이든 아무것도 행하지 않았을 때에, 택하심에 따른 하나님의 목적이 계속 남아 있도록 하시려는 것이었습니다.
  rationale: 원문의 설명적 γάρ를 ‘이는’으로 반영하고, 두 부정 분사를 ‘아직 태어나지도 않았고 … 아무것도 행하지 않았을 때에’로 옮겼습니다. ἵνα 목적절은 ‘… 있도록 하시려는 것’으로, ἐκλογή와 πρόθεσις는 각각 ‘택하심’과 ‘목적’으로, μένῃ는 ‘계속 남아 있도록’으로 번역했습니다. 원문이 앞 문맥과 연결되는 구조이지만, 한국어에서는 완결된 문장으로 제시하되 내용상 앞 문맥을 지시하는 ‘것이었습니다’를 최소한으로 보충했습니다.
