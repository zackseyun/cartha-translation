  source_fidelity: 수정이 필요합니다. 초안은 γάρ의 설명 연결을 드러내지 않고, πρόθεσις를 다소 포괄적인 ‘뜻’으로 옮겼으며, μένῃ의 ‘남아 있다/지속하다’보다 ‘서게 하다’에 가까운 표현을 사용합니다. 또한 ‘하시려고’는 문법상 가능하나 원문의 목적절을 한국어에서 더 직접적으로 반영할 수 있습니다.
  naturalness: ‘아직 태어나지도 않았고 … 행하지 않았을 때에’는 현대 표준어로 자연스럽습니다. 다만 ‘무슨 선이나 악도’는 다소 어색하므로 ‘선한 일이든 악한 일이든 아무것도’가 더 자연스럽습니다. 본문은 앞뒤 절에 이어지는 바울의 긴 문장 구조이므로 한국어에서도 쉼표로 미완결 연결을 보존할 수 있습니다.
