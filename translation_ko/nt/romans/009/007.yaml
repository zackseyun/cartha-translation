review_pass:
  verdict: revise
  source_fidelity: 첫 절의 논지—아브라함의 씨라는 사실이 모두가 자녀임을 뜻하지는 않는다는 것—는 대체로 잘 반영되었습니다. 그러나 인용문의 「이삭에게서 난 자라야」는 원문의 Ἐν Ἰσαὰκ(‘이삭 안에서/이삭을 통해’)를 ‘이삭에게서 태어난 사람’으로 구체화합니다. 문맥상 가까운 뜻일 수 있으나, 원문의 계보·호명 표현보다 한 단계 해석적입니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. 다만 「다 자녀인 것도 아닙니다」보다 「모두가 자녀인 것은 아닙니다」가 더 매끄럽고 논리 관계가 분명합니다. 인용문은 「이삭에게서 네 씨가 불릴 것이다」가 간결하면서도 원문의 수동적 ‘불리다’를 보존합니다.
  terminology: σπέρμα를 「씨」로 일관되게 옮긴 점은 약속 및 인용의 어휘 연결을 잘 보존합니다. τέκνα는 성별을 한정하지 않는 「자녀」가 적절합니다. κληθήσεται는 「일컬어지다」도 가능하지만, 「불릴 것이다」가 현대어에서 자연스럽고 ‘called’의 열린 의미를 유지합니다.
  issues:
  - severity: medium
    issue: 인용문의 「이삭에게서 난 자라야」가 Ἐν Ἰσαὰκ를 해석적으로 구체화합니다.
    rationale: 원문은 ‘이삭 안에서/이삭을 통해 네 씨가 불릴 것이다’라는 인용의 호명·계보 표현입니다. ‘난 자’는 출생한 개인을 전면에 내세워 원문의 표현과 문장 구조를 바꿉니다.
  - severity: low
    issue: 「다 자녀인 것도 아닙니다」의 표현을 다듬을 필요가 있습니다.
    rationale: 「모두가 자녀인 것은 아닙니다」가 πάντες τέκνα의 보편 부정을 더 자연스럽고 명료하게 전달합니다.
  revised_text: 또한 그들이 아브라함의 씨라고 해서 모두가 자녀인 것은 아닙니다. 도리어 「이삭에게서 네 씨가 불릴 것이다」 하셨습니다.
