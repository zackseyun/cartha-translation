id: ROM.9.30
reference: Romans 9:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
  footnotes:
  - marker: a
    text: Or 'justice' for 'righteousness' (δικαιοσύνη) here and in the repeated uses of the term; Paul can use the word with a range that includes both moral/legal rightness and covenantal justice.
    reason: lexical_alternative
  - marker: b
    text: Or 'the nations' for 'the Gentiles.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the righteousness that comes by faith' or, less likely here, 'the righteousness that comes from faithfulness.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 우리는 무엇이라고 말하겠습니까? 의를 추구하지 않던 이방인들[b]이 의[a]를 얻었는데, 그것은 곧 믿음에서 비롯된[c] 의[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 ‘정의’로도 옮길 수 있습니다. 여기서와 반복되는 용례의 δικαιοσύνη는 도덕적·법적 올바름과 언약적 정의를 포함할 수 있는 폭넓은 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이방인들’은 직역하면 ‘민족들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘믿음으로부터의 의’, ‘믿음에서 오는 의’. 여기서는 가능성이 낮지만 ‘신실함에서 비롯된 의’로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  lexicon: BDAG
  rationale: 정책 기본값. 구원론적 문맥에서 「의」를 유지한다.
- source_word: ἐκ πίστεως
  english_pob_choice: from faith
  chosen_korean: 믿음에서 난
  alternatives_korean:
