review_pass:
  verdict: revise
  source_fidelity: ‘의를 따라가지 않던’은 διώκοντα(추구하다, 좇다)의 의미를 충분히 반영하지 못하므로 ‘의를 추구하지 않던’으로 고치는 것이 적절합니다. ‘믿음에서 난 의’는 ἐκ πίστεως를 대체로 잘 옮기지만, 현대 표준어에서는 ‘믿음에서 비롯된 의’가 더 자연스럽고 기원·근원의 뉘앙스를 분명히 합니다. δέ 뒤의 반복 명사는 획득한 의의 성격을 특정하므로 ‘곧’으로 처리하여 불필요한 강한 대조를 피했습니다.
  naturalness: 문장은 현대 표준어 합쇼체에 맞습니다. ‘추구하지 않던’과 ‘비롯된’을 사용하면 문어적이되 과도하게 고어적이지 않으며, 바울의 논증적 문체도 유지됩니다.
  terminology: δικαιοσύνη은 바울 문맥에서 ‘의’로 유지했습니다. ἔθνη은 이스라엘과의 대조 문맥상 ‘이방인들’이 적절합니다. ἐκ πίστεως는 ‘믿음에서 비롯된’으로, ‘믿음만으로’ 같은 교리적 확장을 피했습니다.
  issues:
  - severity: medium
    issue: ‘의를 따라가지 않던’
    rationale: διώκω는 이 문맥에서 ‘따라가다’보다 ‘추구하다/좇다’에 가깝습니다. 기존 표현은 의미가 다소 약하고 자연스럽지 않습니다.
  - severity: low
    issue: ‘믿음에서 난 의’
    rationale: 의미상 가능하지만 현대 표준어의 자연스러움과 ἐκ의 근원 의미를 위해 ‘믿음에서 비롯된 의’가 더 적합합니다.
  revised_text: 그러면 우리가 무엇이라고 말하겠습니까? 의를 추구하지 않던 이방인들은 의를 얻었습니다. 곧 믿음에서 비롯된 의입니다.
  revised_footnotes:
  - marker: a
    text: ‘이방인들’은 ‘민족들’로도 옮길 수 있습니다.
    reason: ἔθνη의 어휘적 대안
  - marker: b
    text: ‘의’는 여기와 이 절에서 반복되는 용례에서 ‘정의’로도 옮길 수 있습니다. 이 말은 도덕적·법적 올바름과 언약적 정의를 포함하는 폭넓은 의미로 쓰일 수 있습니다.
    reason: δικαιοσύνη의 어휘적 대안
  - marker: c
    text: ‘믿음에서 비롯된’은 ‘믿음으로 말미암는’으로도 옮길 수 있으며, 이 문맥에서는 가능성이 낮지만 ‘신실함에서 비롯된’으로 이해할 수도 있습니다.
    reason: ἐκ πίστεως의 대안적 이해
  revision_rationale: διώκοντα의 지속적 ‘추구’ 의미를 살리고, ἐκ πίστεως의 근원 의미를 현대 한국어로 자연스럽게 표현했습니다. 원문의 모호성이나 신학적 함의를 좁히지 않았습니다.
