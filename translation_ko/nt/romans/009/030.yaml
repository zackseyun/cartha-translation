review_pass:
  verdict: revise
  source_fidelity: 그리스어의 논지와 핵심 어휘는 대체로 충실합니다. 다만 διώκοντα는 여기서 ‘따라가다’보다 ‘추구하다’가 더 직접적이고 자연스럽습니다. 또한 ‘믿음에서 난 의입니다’는 앞의 주어·동사와 문법적으로 매끄럽게 연결되지 않으므로, 앞서 얻은 의의 성격을 분명히 하는 표현으로 다듬는 것이 좋습니다.
  naturalness: ‘의를 따라가지 않던’은 현대 한국어에서 다소 어색하며 ‘의를 추구하지 않던’이 자연스럽습니다. ‘의를 얻었으니, 곧 믿음에서 난 의입니다’도 서술의 연결이 불안정하므로 ‘의를 얻었는데, 그것은 곧 … 의입니다’로 고치는 편이 합쇼체 문장으로 명료합니다.
  terminology: δικαιοσύνη는 신학적 의미를 좁히지 않는 ‘의’로 유지했습니다. ἔθνη는 문맥상 ‘이방인들’이 적절하며, ἐκ πίστεως는 ‘믿음에서 비롯된’으로 옮겨 기원·근원의 뉘앙스를 보존했습니다. ‘믿음만으로’처럼 본문에 없는 교리적 한정은 넣지 않았습니다.
  issues:
  - severity: medium
    issue: διώκοντα의 번역
    rationale: ‘의를 따라가지 않던’은 원문의 ‘추구하다, 좇다’라는 비유적 용법을 충분히 자연스럽게 살리지 못합니다. ‘의를 추구하지 않던’이 의미와 현대적 용례에 더 맞습니다.
  - severity: medium
    issue: 마지막 동격구의 문법적 연결
    rationale: ‘이방인들은 의를 얻었으니, 곧 믿음에서 난 의입니다’는 ‘이방인들’과 ‘의입니다’가 직접 이어져 문장 구조가 어색합니다. 그 의를 가리키는 ‘그것은’을 보충하면 원문의 지정·설명 기능을 자연스럽게 드러냅니다.
  revised_text: 그러면 우리는 무엇이라고 말하겠습니까? 의를 추구하지 않던 이방인들[b]이 의[a]를 얻었는데, 그것은 곧 믿음에서 비롯된[c] 의[a]입니다.
  revised_footnotes:
  - marker: a
    text: ‘의’는 ‘정의’로도 옮길 수 있습니다. 여기서와 반복되는 용례의 δικαιοσύνη는 도덕적·법적 올바름과 언약적 정의를 포함할 수 있는 폭넓은 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이방인들’은 직역하면 ‘민족들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘믿음으로부터의 의’, ‘믿음에서 오는 의’. 여기서는 가능성이 낮지만 ‘신실함에서 비롯된 의’로 이해하기도 합니다.
    reason: alternative_reading
  revision_rationale: ‘추구하지 않던’으로 διώκοντα의 의미를 더 정확하고 자연스럽게 옮기고, 마지막 동격구가 앞의 ‘의’를 설명하도록 문장 구조를 바로잡았습니다. ‘의’, ‘이방인들’, ‘믿음에서 비롯된’은 각각 원문의 신학적·문맥적 폭을 유지하며, 관련 대안은 각주에 보존했습니다.
