  source_fidelity: 핵심 대조와 수동태는 대체로 반영되었지만, 「육체의 자녀들」은 현대 한국어에서 다소 부자연스럽고 혈통이라는 문맥적 의미가 충분히 드러나지 않습니다. 또한 「씨로」보다 이 아브라함 언약 문맥의 σπέρμα에 맞는 「자손으로」가 자연스럽습니다.
  naturalness: 「곧」은 τοῦτ’ ἔστιν의 설명적 기능을 잘 살립니다. 다만 「육체의 자녀들이 하나님의 자녀들이 아니라」는 보어 대조의 범위가 다소 불균형하므로, 「하나님의 자녀들인 것이 아니라」로 다듬는 편이 자연스럽습니다.
  terminology: 「약속의 자녀들」과 「하나님의 자녀들」은 적절합니다. σάρξ는 윤리적 의미가 아니라 혈통상의 대조이므로 「육체를 따른」으로 옮기고, σπέρμα는 여기서 후손·계보의 뜻이므로 「자손」으로 옮깁니다.
