  source_fidelity: 「κύριος Σαβαώθ」는 그리스어 본문에서 ‘주’와 히브리어 칭호의 음역인 ‘사바옷’으로 이루어져 있습니다. 본문에 ‘야훼’를 확정적으로 삽입하는 것은 인용의 히브리어 배경을 그리스어 본문보다 앞세우므로 피하는 것이 좋습니다. 또한 두 결과 동사(‘되다’와 ‘닮게 되다’)의 구별을 한국어에서도 살렸습니다.
