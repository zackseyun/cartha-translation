revisions:
- from: 조상들도 그들의 것이며, 육체를 따라서는 메시아께서 그들에게서 나셨습니다. 그분은 만물 위에 계신 분, 영원히 찬송받으실 하나님이십니다. 아멘.[a]
  to: 그들에게는 조상들이 있으며, 육신을 따라 메시아께서도 그들에게서 나셨습니다. 메시아께서는 모든 것 위에 계신, 영원히 찬송받으실 하나님이십니다.[a] 아멘.
