  source_fidelity: 초안은 인용문의 내용과 미래 수동태(‘일컬어질 것입니다’) 및 ‘살아 계신 하나님의 아들들’을 대체로 충실히 옮겼습니다. 그러나 ἐν τῷ τόπῳ οὗ ἐρρέθη αὐτοῖς는 ‘그들에게 …라고 말한 곳’이며, 초안은 인용문을 먼저 놓아 수식 관계가 다소 흐려집니다. 또한 ἐκεῖ는 앞의 ‘그 곳’과 대응하므로 ‘그 곳에서’로 자연스럽게 유지할 수 있습니다.
  naturalness: ‘바로 그 곳’, ‘거기에서’의 중복은 한국어에서 다소 어색합니다. ‘그들이 …이라고 말함을 들은 바로 그 곳에서’는 피동 표현과 인용문의 관계를 분명히 하면서 현대 표준어 합쇼체로 자연스럽습니다. 장소 명사 ‘곳’은 붙여 씁니다.
  terminology: ‘내 백성’, ‘살아 계신 하나님’, ‘아들들’은 언약 및 υἱοὶ의 남성 복수 표현을 보존하는 적절한 용어입니다. ‘일컬어지다’는 κληθήσονται의 수동성을 살립니다.
  issues:
  - severity: low
    issue: 장소 관계절의 수식 관계와 장소 부사의 중복
    rationale: 그리스어는 ‘그들에게 “너희는 내 백성이 아니다”라고 말해진 그 곳에서, 거기서’라는 구조입니다. 초안의 어순은 의미를 전달하지만, ‘바로 그 곳에서, 거기에서’는 중복되어 자연스럽지 않습니다.
  revised_text: 그들이 「너희는 내 백성이 아니다」라는 말을 들은 바로 그곳에서, 그들은 살아 계신 하나님의 아들들이라 일컬어질 것입니다.
  revised_footnotes:
  - marker: a
    text: 호세아 1:10(칠십인역 2:1)을 인용하거나 반영한 말씀입니다.
    reason: cross_reference
  - marker: b
    text: 그리스어는 문자적으로 ‘아들들’입니다. 본문은 이 표현을 보존합니다.
    reason: lexical_alternative
  revision_rationale: ‘그들에게 말해진’이라는 그리스어의 비인칭 수동 구문을 한국어에서 자연스럽게 ‘그들이 …라는 말을 들은’으로 옮겼습니다. ἐκεῖ의 장소 대응은 ‘그곳에서’로 유지하고, 불필요한 장소 표현 중복을 제거했습니다. υἱοὶ의 어휘적 형태를 ‘아들들’로 보존했으며, 본문에 없는 행위 주체는 추가하지 않았습니다.
