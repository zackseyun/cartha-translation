review_pass:
  verdict: revise
  source_fidelity: 개정안은 ἐν τῷ τόπῳ와 ἐκεῖ의 동일 장소에서의 반전을 ‘바로 그곳에서’로 자연스럽게 드러내고, ἐρρέθη αὐτοῖς의 수동 표현을 ‘그들에게 … 말한’으로 보존합니다. κληθήσονται의 수동형도 ‘불릴 것입니다’로 옮겨 행위자를 불필요하게 명시하지 않았습니다. υἱοὶ는 ‘아들들’로 유지했습니다.
  naturalness: 초안의 ‘바로 그 곳에서, 거기에서’는 같은 장소 부사를 중복해 현대 한국어로 다소 부자연스럽습니다. ‘바로 그곳에서’는 같은 강조와 대조를 간결하고 자연스럽게 전달합니다. ‘그들이 … 일컬어질 것입니다’보다 ‘그들은 … 불릴 것입니다’가 현대 합쇼체 문장에 더 자연스럽습니다.
  terminology: ‘내 백성’, ‘살아 계신 하나님’, ‘하나님의 아들들’은 호세아 인용 및 바울의 언약·아들됨 어휘를 충실히 반영합니다. ‘아들들’에 대한 가능한 포괄적 번역은 각주로만 제시하여 본문의 어휘를 바꾸지 않았습니다.
  issues:
  - severity: low
    issue: 장소 표현의 중복
    rationale: 초안의 ‘바로 그 곳에서, 거기에서’는 그리스어의 ἐν τῷ τόπῳ와 ἐκεῖ를 기계적으로 거듭 옮긴 듯하여 한국어 문장 흐름을 저해합니다. ‘바로 그곳에서’가 동일 장소에서 일어나는 반전을 충분히 나타냅니다.
  - severity: low
    issue: 현대적 수동 표현
    rationale: ‘아들들이라 일컬어질 것입니다’도 가능하지만, ‘아들들로 불릴 것입니다’가 κληθήσονται를 더 자연스러운 현대 표준 한국어로 옮깁니다.
  revised_text: 그들에게 “너희는 내 백성이 아니다”라고 말한 바로 그곳에서¹, 그들은 살아 계신 하나님의 아들들로 불릴 것입니다.²
  revised_footnotes:
  - marker: '1'
    text: 호세아 1:10(칠십인역 2:1)을 인용하거나 암시합니다. 언약 관계의 회복을 말하는 표현입니다.
    reason: cross_reference
  - marker: '2'
    text: 그리스어는 ‘아들들’입니다. ‘살아 계신 하나님의 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 장소 표현의 중복을 제거하면서도 ‘바로 그곳에서’로 원문의 동일 장소에 대한 강조와 역전을 유지했습니다. 수동형과 ‘아들들’이라는 어휘를 보존하고, 인용 출처 및 대안적 표현은 각주로 제시했습니다.
