  source_fidelity: 핵심 의미와 문장 구조는 대체로 충실합니다. 다만 ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ는 아담의 범죄와 ‘같은 방식으로’ 죄를 짓는 것을 뜻하므로, 초안의 「아담의 범죄의 모양과 같이」는 한국어로 부자연스럽고 관계가 다소 불분명합니다.
  naturalness: 「왕 노릇 하였습니다」는 죽음의 의인화를 잘 살린 자연스러운 합쇼체입니다. 「아담의 범죄와 같은 방식으로 죄를 짓지 않은」으로 고치면 현대 표준어 문장으로 명료하고 자연스럽습니다.
  terminology: 「범죄」는 παράβασις에 적절하며, 「모형」은 τύπος의 유형론적 의미를 보존합니다. 「오실 분」은 τοῦ μέλλοντος를 본문 이상의 명시적 기독론으로 확장하지 않으면서 자연스럽게 옮깁니다.
  issues:
