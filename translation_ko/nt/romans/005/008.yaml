    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서 우리에 대한 자신의 사랑[a]을 이렇게 보여 주십니다. 곧 우리가 아직 죄인이었을 때에 메시아[b]께서 우리를 위하여[c] 죽으셨다는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리에게’ 또는 ‘우리를 향한’으로도 옮길 수 있습니다. 그리스어 εἰς ἡμᾶς는 하나님의 사랑이 우리를 향함을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘크리스토스’(Χριστός)이며, 전통적으로 ‘그리스도’로도 옮깁니다. 여기서는 칭호로서 ‘메시아’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우리를 위하여’는 ‘우리의 유익을 위하여’ 또는 ‘우리를 대신하여’로도 옮길 수 있으나, 본문은 그 관계를 더 구체적으로 한정하지 않습니다.
    reason: lexical_alternative
