    reason: textual_variant
  revision_rationale: 현재 직설법 ἔχομεν을 단순 현재 「누립니다」로 반영하고, 예수의 이름과 메시아 칭호의 순서를 원문에 맞추었습니다. 본문비평 각주는 두 그리스어 형태와 그에 따른 번역 차이를 분명히 하도록 다듬었습니다.
