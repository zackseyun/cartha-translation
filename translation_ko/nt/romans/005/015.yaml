    rationale: 원문 ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ는 하나님의 은혜와, 한 사람 예수 메시아의 은혜와 관련된 선물을 병렬로 둡니다. 초안은 「하나님의 은혜」를 「한 사람 ...의 은혜를 통한」 것으로 수식하여 원문에 없는 관계를 시사합니다.
  - severity: medium
    issue: 「메시아 예수」의 어순과 직접 결합이 현대 표준 한국어에서 다소 부자연스럽습니다.
    rationale: 그리스어의 이름-칭호 관계를 자연스럽게 드러내려면 「메시아이신 예수」가 더 명료합니다.
