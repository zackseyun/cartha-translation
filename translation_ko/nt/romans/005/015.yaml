revisions:
- from: 그러나 그 은사는 그 범죄와 같지 않습니다. 한 사람의 범죄로 많은 사람이 죽었다면, 한 사람 메시아 예수의 은혜를 통한 하나님의 은혜와 그 선물이 많은 사람에게 넘쳐난 것은 훨씬 더 그러합니다.
  to: 그러나 그 은사는 그 범죄와 같지 않습니다. 한 사람의 범죄로 많은 사람이 죽었다면, 하나님의 은혜와 한 사람, 곧 메시아이신 예수의 은혜로 주어진 선물은 훨씬 더 많은 사람에게 넘쳐났습니다.
  rationale: 문장의 병렬 구조를 원문에 맞게 바로잡아 「하나님의 은혜」와 「예수 메시아의 은혜로 주어진 선물」을 각각 독립된 병렬 항목으로 제시했습니다. 「은혜로 주어진」은 ἐν χάριτι의 수단적·연관적 용법을 자연스러운 한국어로 반영합니다. 「많은 사람」을 유지하여 일대다 대조의 범위를 해석적으로 「모든 사람」으로 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:07:32Z'
