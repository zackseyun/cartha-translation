    rationale: 영어 감사 기록의 대안은 'in whom all sinned'이며, 이는 본문의 인과적 「because all sinned」와 구별되어야 합니다. 「그 안에서 모두가 죄를 지었다」로 제시해야 대안의 문법적·해석적 성격을 정확히 보존합니다.
