revisions:
- from: 그러므로 한 사람을 통해 죄가 세상에 들어오고 또 죄를 통해 죽음이 들어온 것 같이[a], 그렇게 죽음이 모든 사람에게 퍼졌습니다. 모두가 죄를 지었기 때문입니다—
  to: 그러므로 한 사람을 통하여 죄가 세상 안으로 들어오고, 죄를 통하여 죽음이 들어온 것같이, 이와 같이 죽음이 모든 사람에게 퍼졌습니다. 이는 모두가 죄를 지었기 때문입니다[a]—
  rationale: 대안 독법에서 부당하게 보충된 「때문에」를 제거하여 인과적 본문 번역과 대표적/포함적 대안을 구별했습니다. 각주 표지를 해당 헬라어 구절의 번역에 옮기고, 원문의 미완결 비교를 나타내는 끝줄표도 유지했습니다. 「세상 안으로」와 「이와 같이」는 각각 εἰς와 οὕτως의 방향성 및 대응 관계를 자연스럽게 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:07:33Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 의미와 미완결 비교 구조(ὥσπερ ... οὕτως)는 대체로 보존되었습니다. 다만 ἐφ’ ᾧ πάντες ἥμαρτον에 관한 대안 각주가 인과적 표현인 「때문에」를 덧붙여, 전통적 「그 안에서 모두가 죄를 지었다」라는 대안을 정확히 제시하지 못합니다.
  naturalness: 합쇼체는 적절합니다. 그러나 인과절을 앞 문장과 분리하기보다 「이는 ... 때문입니다」로 이어 주고, 대안 독법의 각주 표지는 해당 인과절에 붙이는 편이 자연스럽고 명확합니다.
  terminology: 「한 사람을 통하여」, 「죄」, 「죽음」, 「모든 사람」은 적절합니다. 「그 안에서」라는 대안은 아담을 가리키는 대명사를 보충하지 않고도 원문의 논쟁적 모호성을 보존할 수 있습니다.
  issues:
