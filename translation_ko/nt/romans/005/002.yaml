- from: 그분을 통해 우리는 또한 믿음으로 우리가 서 있는 이 은혜 안으로 들어가는 통로를 얻었으며, 하나님의 영광을 바라는 소망 안에서 자랑합니다[a].
  to: 그분을 통하여 우리는 또한 믿음으로 이 은혜에 나아갈 수 있는 길을 얻었으며, 이 은혜 안에 서 있습니다. 또 우리는 하나님의 영광에 대한 소망을 두고 자랑합니다[a].
  rationale: 원문의 완료형이 나타내는 현재의 상태를 「얻었으며」와 「서 있습니다」로 드러내고, προσαγωγή의 의미를 지나치게 물질화하지 않았습니다. καυχώμεθα의 수사적 어휘는 본문에서 보존하고, 각주는 중립적인 어휘 대안으로 한정했습니다.
  reviewer_model: gpt-5.6-terra
