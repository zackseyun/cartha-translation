review_pass:
  verdict: revise
  source_fidelity: 「들어가는 통로를 얻었으며」는 προσαγωγή(접근, 나아감)를 다소 물리적인 통로로 구체화하며, ‘우리가 서 있는’의 관계가 ‘은혜’에 걸리는 점도 문장상 더 분명히 할 필요가 있습니다. 「하나님의 영광에 대한 소망을 두고 자랑합니다」는 ἐπ’ ἐλπίδι의 의미를 자연스럽게 보존합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬되, 바울의 ‘자랑하다’라는 의도적인 표현은 유지했습니다.
  terminology: προσαγωγή는 「나아갈 수 있는 길」로, χάρις는 「은혜」로, καυχώμεθα는 「자랑합니다」로 옮겼습니다. 각주 대안에서 「자랑스러워합니다」는 본문의 능동적 ‘자랑하다’와 다르므로 삭제했습니다.
  issues:
  - severity: medium
    issue: 「들어가는 통로」
    rationale: προσαγωγή는 하나님께 나아가거나 접근하게 됨을 뜻하며, ‘통로’는 원문에 없는 물리적 이미지를 강화합니다.
  - severity: low
    issue: 각주의 해설 및 「자랑스러워합니다」 대안
    rationale: 영어 감사 기록의 각주는 어휘 대안만 제시합니다. 추가 해설은 번역 선택을 신학적으로 규정하며, 「자랑스러워합니다」는 καυχάομαι의 적절한 동의 대안이 아닙니다.
  revised_text: 그분을 통하여 우리는 또한 믿음으로 이 은혜에 나아갈 수 있는 길을 얻었으며, 이 은혜 안에 서 있습니다. 또 우리는 하나님의 영광에 대한 소망을 두고 자랑합니다[a].
  revised_footnotes:
