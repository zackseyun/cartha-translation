translation:
  language: ko
  text: 이는 죄가 죽음 안에서 왕 노릇한 것처럼, 은혜도 의를 통하여 우리 주 예수 메시아를 통하여 영원한 생명에 이르도록 왕 노릇하도록 하기 위함입니다.
  philosophy: optimal-equivalence
