  to: 우리가 원수였을 때에 그분의 아들의 죽음을 통하여 하나님과 화해하게 되었다면, 화해하게 된 우리는 더욱더 그분의 생명으로[a] 구원을 받을 것입니다.
  rationale: 원문의 조건절(εἰ γάρ)과 그에 따른 미래의 귀결(σωθησόμεθα), 그리고 화해가 구원보다 선행함을 나타내는 분사(καταλλαγέντες)를 자연스러운 한국어로 명확히 옮겼습니다. 수단적 「그분의 생명으로」는 유지하되 해석상 남는 모호성은 각주로 보존했습니다.
