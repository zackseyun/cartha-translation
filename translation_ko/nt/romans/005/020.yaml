  yaml_path: translation/nt/romans/005/020.yaml
  text: Now the law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
  footnotes:
  - marker: a
    text: Or 'came in' or 'slipped in'; the Greek suggests entering alongside or in addition.
    reason: lexical_alternative
  - marker: b
    text: Or 'the transgression' or 'the offense.'
    reason: lexical_alternative
  - marker: c
    text: Or 'grace abounded much more.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 율법은 범죄가 많아지도록 덧붙여 들어왔습니다. 그러나 죄가 많아진 곳에서는 은혜가 더욱 넘쳐났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμος
  english_pob_choice: the law
  chosen_korean: 율법
  lexicon: BDAG
  rationale: 모세 율법 지시. 용어집 표준.
- source_word: παρεισῆλθεν
  english_pob_choice: came in alongside
  chosen_korean: 곁들여 들어왔습니다
  alternatives_korean:
  - 끼어들어 왔습니다
  - 함께 들어왔습니다
  lexicon: BDAG
  rationale: 파라(παρά-) 접두사의 「곁에/곁들임」 의미를 보존.
- source_word: ἵνα πλεονάσῃ
  english_pob_choice: so that ... might increase
  chosen_korean: 더해지도록
  lexicon: BDAG
  rationale: 목적의 ἵνα + 가정법. 「~도록」으로 자연스럽게.
- source_word: παράπτωμα
  english_pob_choice: the trespass
  chosen_korean: 그 범죄
  lexicon: BDAG
  rationale: 5:12-21 정형 유지.
- source_word: ὑπερεπερίσσευσεν
  english_pob_choice: overflowed all the more
  chosen_korean: 더욱 넘쳐났으니
  alternatives_korean:
  - 넘치도록 풍성해졌으니
  lexicon: BDAG
  rationale: 복합 동사 ὑπερ- 의 강조를 「더욱」으로 표현.
