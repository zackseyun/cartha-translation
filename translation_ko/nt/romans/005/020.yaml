review_pass:
  verdict: revise
  source_fidelity: ‘더해지다’는 πλεονάζω(증가하다)의 뜻을 다소 흐리므로 ‘많아지다’가 더 직접적입니다. 또한 οὗ의 관계적·국지적 대조는 ‘곳에서는’으로 자연스럽게 드러낼 수 있습니다. ἵνα의 목적 표현은 ‘~도록’으로 유지하여 본문의 긴장을 해소하지 않았습니다.
  naturalness: ‘곁들여 들어왔습니다’는 이해되지만 현대 표준어에서는 ‘덧붙여 들어왔습니다’가 더 자연스럽고, παρεισῆλθεν의 추가적·곁들어진 دخول의 뉘앙스를 잘 살립니다. 절 끝의 ‘-으니’는 인과를 강하게 보태고 문장이 미완처럼 들리므로 직설 종결로 고쳤습니다.
  terminology: νόμος는 문맥상 모세 율법을 가리키므로 ‘율법’을 유지했습니다. παράπτωμα는 문맥의 용어 일관성을 위해 ‘범죄’, ἁμαρτία는 ‘죄’, χάρις는 ‘은혜’로 유지했습니다. ὑπερεπερίσσευσεν의 강화는 ‘더욱 넘쳐났습니다’로 반영했습니다.
  issues:
  - severity: medium
    issue: ‘더해지도록’과 ‘죄가 더해진’
    rationale: πλεονάζω와 ἐπλεόνασεν은 ‘더해지다’보다 ‘많아지다/증가하다’를 뜻합니다. 기존 표현은 한국어에서 무엇인가가 추가되는 뉘앙스가 강합니다.
  - severity: low
    issue: ‘곁들여 들어왔습니다’의 어색함
    rationale: 의미는 맞지만 ‘덧붙여 들어왔습니다’가 현대 한국어에서 더 자연스러우며, 법이 주된 흐름에 추가되어 들어온다는 의미를 보존합니다.
  - severity: low
    issue: 절 끝 ‘넘쳐났으니,’
    rationale: 원문의 마지막 동사는 직설 과거이며, ‘-으니’는 원문에 없는 인과적 연결을 덧붙입니다. 완결된 합쇼체 종결이 더 적절합니다.
  revised_text: 그런데 율법은 범죄가 많아지도록 덧붙여 들어왔습니다. 그러나 죄가 많아진 곳에서는 은혜가 더욱 넘쳐났습니다.
  revised_footnotes: []
