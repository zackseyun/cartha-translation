- from: 그런데 율법은 그 범죄가 더해지도록 곁들여 들어왔습니다. 그러나 죄가 더해진 곳에 은혜가 더욱 넘쳐났으니,
  to: 그런데 율법은 범죄가 많아지도록 덧붙여 들어왔습니다. 그러나 죄가 많아진 곳에서는 은혜가 더욱 넘쳐났습니다.
  rationale: 원문의 목적절(ἵνα πλεονάσῃ), ‘범죄’와 ‘죄’의 구별, 그리고 은혜의 압도적 풍성함을 유지하면서, 증가를 나타내는 동사를 정확하고 자연스러운 한국어로 바로잡았습니다. 신학적 긴장은 목적절 표현을 통해 보존했습니다.
  reviewer_model: gpt-5.6-terra
