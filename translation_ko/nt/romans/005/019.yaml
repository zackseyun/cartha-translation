  source_fidelity: 핵심 어휘와 수동적 신분 변화의 대조는 충실합니다. 다만 οὕτως καί를 옮긴 현행의 「그렇게 한 사람의」는 한국어에서 수식 범위가 다소 불분명하고 부자연스럽습니다. 비교 구문 자체로 대조를 명료하게 드러내는 것이 적절합니다.
  naturalness: 「한 사람의 불순종을 통하여 … 된 것처럼, 한 사람의 순종을 통하여 … 될 것입니다」는 현대 표준어 합쇼체에서 자연스럽고, 원문의 대칭도 유지합니다.
  terminology: 「불순종/순종」「죄인」「의인」은 παρακοή/ὑπακοή, ἁμαρτωλοί, δίκαιοι의 대조와 한국어 성경 용례에 잘 맞습니다. 「의인이 될 것입니다」는 κατασταθήσονται의 상태 변화 표현을 보존하며 ‘의롭다 선언받다’라는 해석을 부가하지 않습니다. 「많은 사람」은 οἱ πολλοί를 ‘모든 사람’으로 해석적으로 확장하지 않습니다.
  issues:
  - severity: low
    issue: 「그렇게 한 사람의 순종을 통해」의 연결
    rationale: οὕτως καί에 대한 직역적 연결이지만, 한국어에서는 「그렇게」가 뒤의 「한 사람」을 수식하는 듯 읽힐 수 있습니다. 「…것처럼, …」의 비교 구문으로 옮기면 의미와 문체가 모두 더 명료합니다.
  revised_text: 한 사람의 불순종을 통하여 많은 사람이 죄인이 된 것처럼, 한 사람의 순종을 통하여 많은 사람이 의인이 될 것입니다.
