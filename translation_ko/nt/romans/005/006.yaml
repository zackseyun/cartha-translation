    rationale: 그리스어 현재분사 ὄντων과 ἔτι는 당시 계속되고 있던 상태를 가리킵니다. 「아직 연약할 때」가 이를 더 직접적으로 나타냅니다.
  - severity: low
    issue: 「합당한 때」의 자연스러움
    rationale: κατὰ καιρόν은 문맥상 ‘알맞은/적절한 때’를 뜻합니다. 「알맞은 때」가 현대 한국어에서 더 자연스럽고, ‘정해진’처럼 해석을 추가하지 않습니다.
  revised_text: 우리가 아직 연약할 때에, 메시아께서는 알맞은 때에 경건하지 않은 사람들을 위하여 죽으셨습니다.
