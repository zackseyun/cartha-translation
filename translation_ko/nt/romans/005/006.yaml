  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ὄντων ἡμῶν ἀσθενῶν의 계속 중인 상태는 「연약했을 때」보다 「아직 연약할 때」가 더 정확합니다. ὑπὲρ ἀσεβῶν의 열린 의미도 「…을 위하여」로 보존됩니다.
  naturalness: 「합당한 때」는 이해되지만 현대 한국어 성경 문체에서는 「알맞은 때」가 더 자연스럽습니다. 「경건하지 않은 사람들」은 「…자들」보다 현대 표준어에서 자연스럽고 의미 손실이 없습니다.
  terminology: Χριστός는 프로젝트 방침 및 영어 POB의 선택에 따라 「메시아」로 유지합니다. 「연약한」, 「경건하지 않은」, 「위하여」는 본문의 넓은 의미와 신학적 비결정성을 적절히 보존합니다.
  issues:
