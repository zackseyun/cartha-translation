  source_fidelity: 첫 절의 비교 대상은 δι’ ἑνὸς ἁμαρτήσαντος, 곧 ‘죄를 지은 한 사람을 통하여 생긴 것’입니다. 초안의 ‘한 사람이 죄지어 일어난 것’은 이 관계를 다소 불분명하고 비문적으로 만듭니다. 나머지 법정적 대조(심판/정죄, 은혜의 선물/의롭다 하심)는 원문에 충실합니다. ἐξ ἑνός는 문맥상 ‘한 범죄’로 이해할 수 있으나, 문법적으로 ‘한 사람’을 가리킬 가능성도 있어 주석으로 보존했습니다.
  naturalness: ‘한 사람이 죄지어 일어난 것’은 현대 표준 한국어로 어색합니다. ‘한 사람이 죄를 지은 데서 비롯된 것’으로 고치면 원문의 압축된 비교를 자연스럽게 재현합니다. χάρισμα는 여기서 성령의 특별한 능력을 흔히 뜻하는 ‘은사’보다 ‘은혜의 선물’이 자연스럽고 의미도 더 분명합니다.
  terminology: δώρημα는 ‘선물’, χάρισμα는 ‘은혜의 선물’로 구별했습니다. κρίμα/κατάκριμα의 법정적 흐름은 ‘심판’과 ‘정죄’로, δικαίωμα는 그 대조를 살리는 ‘의롭다 하심’으로 유지했습니다.
