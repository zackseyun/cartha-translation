  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
  footnotes:
  - marker: a
    text: Or 'the gift is not like what came through one man who sinned.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from one offense.'
    reason: lexical_alternative
  - marker: c
    text: Or 'led to a righteous verdict' or 'led to acquittal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 이 선물은 한 사람이 죄를 지은 데서 비롯된 것과 같지 않습니다.[a] 심판은 한 범죄에서 나와 정죄에 이르렀으나,[b] 은혜의 선물은 많은 범죄에서 나와 의롭다 하심에 이르렀습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “죄를 지은 한 사람을 통하여 생긴 것.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “한 사람에게서 나와.” 원문의 ‘한’은 문법상 한 사람을 가리킬 수도 있으나, 뒤의 ‘많은 범죄’와의 대조로 보아 한 범죄를 가리키는 것으로 이해할 수 있습니다.
    reason: source_ambiguity
  - marker: c
    text: 또는 “의로운 판결” 또는 “무죄 선고.”
    reason: lexical_alternative
