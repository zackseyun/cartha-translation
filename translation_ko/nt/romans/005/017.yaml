translation:
  language: ko
  text: 한 사람의 범죄로 말미암아 죽음이 그 한 사람을 통해 왕 노릇을 하였다면, 은혜의 풍성함과 의의[a] 선물을 받는 사람들은 한 분, 곧 예수 메시아를 통해 생명 안에서 훨씬 더 왕 노릇을 하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의의 선물’.
    reason: δικαιοσύνης의 어휘적 대안을 보존합니다.
