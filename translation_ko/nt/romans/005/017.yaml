  to: 한 사람의 범죄로 말미암아 죽음이 그 한 사람을 통해 왕 노릇을 하였다면, 은혜의 풍성함과 의의[a] 선물을 받는 사람들은 한 분, 곧 예수 메시아를 통해 생명 안에서 훨씬 더 왕 노릇을 하게 될 것입니다.
  rationale: 원문의 조건절-귀결 구조와 죽음 및 수령자들의 ‘왕 노릇’ 은유를 유지했습니다. 현재분사와 미래 직설법을 구별하고, 예수 메시아라는 칭호를 자연스러운 한국어 어순으로 조정했습니다. ‘한 사람/한 분’은 아담과 예수의 대조를 보존하면서도 예수에 대한 현대 한국어 존칭을 반영합니다.
