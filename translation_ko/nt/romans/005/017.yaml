  source_fidelity: 주절의 미래 동사 βασιλεύσουσιν와 현재분사 λαμβάνοντες의 의미를 각각 분명히 드러내고, 두 번의 διὰ τοῦ ἑνός를 일관되게 옮길 필요가 있습니다. 예수의 이름은 원문의 어순과 메시아 칭호를 반영하여 ‘예수 메시아’로 옮기는 것이 안전합니다.
  naturalness: 초안의 ‘왕 노릇 하였다면/할 것은’은 띄어쓰기와 문장 연결이 다소 부자연스럽습니다. ‘왕 노릇을 하였다면’과 ‘왕 노릇을 하게 될 것입니다’가 현대 표준어 합쇼체에 자연스럽습니다.
  terminology: παράπτωμα는 문맥상 ‘범죄’로 가능하며, χάρις는 ‘은혜’, δικαιοσύνη는 ‘의’, Χριστός는 칭호를 살린 ‘메시아’로 유지합니다. δικαιοσύνη의 ‘정의’ 가능성은 각주로 보존합니다.
