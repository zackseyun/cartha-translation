    rationale: 한국어에서는 인명 뒤에 칭호를 두는 ‘예수 메시아’가 자연스럽고, 원문의 예수-그리스도/메시아 결합도 더 잘 반영합니다.
  - severity: low
    issue: ‘왕 노릇 하다/할’의 조사 및 띄어쓰기, 주절 연결
    rationale: ‘왕 노릇을 하다’가 자연스러운 표기이며, 미래 결과는 ‘하게 될 것입니다’로 명료하게 표현할 수 있습니다.
