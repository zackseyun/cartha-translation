  source_fidelity: ἀποτολμᾷ는 현재형으로 ‘매우 담대하게 말합니다’가 잘 반영합니다. 인용문의 ‘내가 발견되었고’와 ‘내가 나타났다’는 각각 εὑρέθην 및 ἐμφανὴς ἐγενόμην의 수동적·현현적 표현을 적절히 보존합니다. 다만 ἐμέ의 목적어 관계를 한국어에서 ‘나를 묻지 않는’으로 옮기면 어색하고 ‘나에게 질문하지 않는’ 뜻으로도 읽히므로, ‘나에 대하여 묻지 않는’으로 명확히 하는 것이 좋습니다.
  naturalness: ‘나를 묻지 않는 자들’은 현대 표준어에서 자연스럽지 않습니다. ‘나에 대하여 묻지 않는 사람들’은 원문의 평행 구조를 유지하면서 자연스럽고 의미도 분명합니다. ‘자들’보다 ‘사람들’이 현대 합쇼체 본문에서 더 매끄럽습니다.
  terminology: 이사야, 담대하게, 발견되다, 나타나다는 표준 성경 문체와 현대적인 격식에 모두 적합합니다. ἐπερωτῶσιν을 ‘나에 대하여 묻다’로 처리하여 ‘부르다’ 등의 신학적 의미를 과도하게 덧붙이지 않습니다.
