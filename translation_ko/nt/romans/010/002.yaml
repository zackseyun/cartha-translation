  lexicon: BDAG
  rationale: 「열심」은 종교적 헌신을 가리키는 정착된 한국어 신학 어휘.
- source_word: ἐπίγνωσιν
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
