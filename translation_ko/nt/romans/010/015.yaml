  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
  footnotes:
  - marker: a
    text: Or 'How welcome' or 'How timely' are the feet… The Greek adjective can suggest not only beauty but also the welcome, fitting arrival of the messenger.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'those who bring good news of good things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 보내심을 받지 않고서야 어떻게 선포하겠습니까? 기록된 바와 같습니다. “좋은 소식을 전하는 이들[b]의 발이 얼마나 아름다운가[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얼마나 반가운가’, ‘얼마나 알맞은가’. 그리스어 형용사는 아름다움뿐 아니라 전달자의 반가운 도착이나 때에 알맞음을 암시할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘좋은 것들을 좋은 소식으로 전하는 이들’.
    reason: lexical_alternative
