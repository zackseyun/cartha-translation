  text: 그러나 무엇이라고 말합니까? “말씀이 네게 가까이 있다. 네 입에 있고 네 마음에 있다.” 이것은 곧 우리가 선포하는 믿음의 말씀[a]입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
