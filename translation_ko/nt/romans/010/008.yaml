  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
  footnotes:
  - marker: a
    text: Or 'the message of faith'; also, πίστις can in some contexts be rendered 'faithfulness' or 'trust.'
    reason: lexical_alternative
  - marker: b
    text: Paul is echoing Deuteronomy 30:14, applying its language to the proclaimed gospel message.
    reason: cross_reference
