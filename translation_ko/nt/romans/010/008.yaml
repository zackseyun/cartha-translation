  source_fidelity: 그리스어의 인용문과 바울의 해설 구조는 대체로 반영되어 있습니다. 다만 첫 문장의 ‘그것이’는 선행 지시 대상이 한국어 본문 안에서 충분히 드러나지 않아 부자연스럽습니다. 또한 영어 감사 기록의 주석 취지를 반영하려면 ‘믿음의 말씀’에 어휘 주석을 붙이고, 신명기 인용에 대한 교차참조 주석의 위치를 명시하는 것이 적절합니다.
  naturalness: ‘그러나 무엇이라고 말합니까?’가 바울의 인용문을 의인화하여 묻는 원문의 표현을 가장 간결하고 자연스럽게 살립니다. ‘선포하는’은 κηρύσσομεν의 공적 선포라는 뜻을 현대 표준어 합쇼체에서 자연스럽게 전달합니다.
  terminology: ῥῆμα는 두 곳 모두 ‘말씀’으로 일관되게 옮기고, τὸ ῥῆμα τῆς πίστεως는 원문의 압축된 속격 관계를 과도하게 해석하지 않는 ‘믿음의 말씀’으로 유지했습니다. κηρύσσω는 ‘선포하다’로 옮겼습니다.
