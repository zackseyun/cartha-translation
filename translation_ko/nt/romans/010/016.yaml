  source_fidelity: 첫 문장은 οὐ πάντες의 부분 부정과 ὑπήκουσαν의 ‘순종하다’를 잘 반영합니다. 그러나 τῇ ἀκοῇ ἡμῶν을 ‘우리에게서 들은 것’으로 옮기면 ‘우리에게서’라는 전달자 의미가 전면화되고, 인용문의 ‘우리의 소식/전한 소식(보고)’이라는 내용 중심 의미가 약화됩니다.
