review_pass:
  verdict: revise
  source_fidelity: 'The core clauses are accurately represented: public confession of Jesus as Lord, inward belief that God raised him from the dead, and the future passive promise of salvation. However, initial 곧 does not adequately convey ὅτι in its contextual explanatory/causal function.'
  naturalness: The draft is generally fluent in modern formal-polite Korean. Removing repeated 네가/네 and using 고백하다 rather than 시인하다 produces more natural contemporary biblical Korean while retaining the public confessional sense.
  terminology: 주 appropriately renders κύριος, and 구원받다 appropriately renders σωθήσῃ. 죽은 자들 가운데서 preserves the plural expression ἐκ νεκρῶν. No footnote is required in Korean because 예수를 주로 고백하고 naturally expresses the confessional construction without the English ambiguity addressed by its footnote.
  issues:
  - severity: medium
    issue: Initial 곧 is not a sufficiently clear rendering of ὅτι.
    rationale: In context, ὅτι introduces the explanatory ground for the preceding statement. 왜냐하면 clearly retains this connective force; 곧 more often signals apposition, clarification, or consequence.
  - severity: low
    issue: 시인하고 is somewhat less natural than 고백하고 for this Christian confessional formula in current Korean.
    rationale: 시인하다 can mean acknowledge or admit, including an admission of wrongdoing. 고백하다 retains the public verbal sense of ὁμολογέω and is the established natural wording for a faith confession.
  revised_text: 왜냐하면 네가 입으로 예수를 주로 고백하고, 마음으로 하나님께서 그분을 죽은 자들 가운데서 일으키셨음을 믿으면, 구원을 받을 것입니다.
  revised_footnotes: []
