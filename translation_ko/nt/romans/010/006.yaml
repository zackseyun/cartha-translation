review_pass:
  verdict: revise
  source_fidelity: The draft preserves the overall syntax and personification, but its quoted imperative is unidiomatic and shifts the direct command. Its final explanatory clause renders καταγαγεῖν as an intention ('trying to bring down') rather than Paul's explanatory infinitive ('to bring down').
  naturalness: ‘네 마음으로 … 하지 말라’ is not natural modern formal Korean in this construction and does not consistently use 합쇼체. ‘네 마음속으로 …라고 말하지 마십시오’ is clear, idiomatic, and preserves the inward-speech idiom.
  terminology: ‘의’ is the established Korean theological rendering of δικαιοσύνη; ‘믿음에서 비롯된 의’ is more natural than ‘믿음에서 난 의’ while retaining the ἐκ relation. ‘메시아’ appropriately renders titular Χριστός here. The lexical alternative ‘정의’ and the Deuteronomy allusion are retained in footnotes.
  issues:
  - severity: medium
    issue: The quotation uses ‘네 마음으로 … 하지 말라.’
    rationale: The Greek says ‘Do not say in your heart,’ not merely ‘do not do [this] with your heart.’ Korean requires an explicit speech verb (‘…라고 말하지 마십시오’) to convey εἴπῃς, and the revised wording observes the requested formal-polite register.
  - severity: medium
    issue: ‘메시아를 끌어내리려는 것입니다’ renders the explanatory infinitive as purpose or intention.
    rationale: 'τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν explains what the proposed ascent would mean: ‘that is, to bring the Messiah down.’ ‘끌어내리는 것입니다’ preserves this force without adding an intention nuance.'
  - severity: low
    issue: ‘믿음에서 난 의’ is somewhat compressed and less natural in contemporary formal Korean.
    rationale: ‘믿음에서 비롯된 의’ clearly expresses righteousness arising from/from faith and retains the source’s contrast without introducing a stronger instrumental interpretation.
  revised_text: '그러나 믿음에서 비롯된 의[a]는 이렇게 말합니다[c]: “네 마음속으로 ‘누가 하늘에 올라가겠는가?’라고 말하지 마십시오.” (이는 메시아[b]를 끌어내리는 것입니다.)'
