  source_fidelity: 개정이 필요합니다. 초안의 ‘믿는 모든 자에게 의가 되시어’는 그리스어 εἰς δικαιοσύνην을 메시아가 ‘의가 되신다’는 뜻으로 바꾸어, ‘의를 향하여/의에 이르게’라는 구문 관계를 충분히 반영하지 못합니다. 또한 τέλος의 의도적으로 열려 있는 의미는 각주로 보존하는 편이 안전합니다.
  naturalness: ‘믿는 모든 사람을 의에 이르게 하는 율법의 마침’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 압축된 관계를 무리하게 특정 교리로 해설하지 않습니다. ‘모든 자’보다 ‘모든 사람’이 현대적이며 포괄적입니다.
  terminology: Χριστός는 칭호 의미를 살려 ‘메시아’로 유지합니다. νόμος는 이 문맥에서 ‘율법’이 적절합니다. δικαιοσύνη는 기본 번역인 ‘의’로 옮기되, ‘정의’라는 가능한 어휘 대안을 각주에 남깁니다. τέλος는 ‘마침’으로 유지하고 ‘끝, 목표, 완성’의 의미 가능성을 각주로 명시합니다.
