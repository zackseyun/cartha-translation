translation:
  language: ko
  text: 유대인과 헬라인[a] 사이에는 구별이 없습니다. 같은 주께서 모든 이의 주이시며[b], 그분을 부르는 모든 이에게 풍성히 베푸시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘헬라인’입니다. 여기서 유대인과 헬라인의 짝은 유대인과 유대인이 아닌 사람의 대조로 기능합니다. 일부 번역은 ‘이방인’으로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘같은 주께서 모든 이 위에 계시며.’
    reason: alternative_reading
