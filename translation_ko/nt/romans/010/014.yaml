review_pass:
  verdict: revise
  source_fidelity: The threefold rhetorical sequence and the inferential force of οὖν are retained. The draft's present-tense ‘믿지 않는’ weakens the completed prior non-belief expressed by ἐπίστευσαν; ‘믿지 않은’ better reflects the source. The genitive construction οὗ οὐκ ἤκουσαν is retained in a text-near Korean form, with its message-concerning-him sense supplied as a footnoted alternative.
  naturalness: The revision uses idiomatic modern formal-polite Korean and maintains parallel rhetorical questions. ‘전파하는 사람이 없이’ represents κηρύσσοντος as an activity rather than implying a formal office.
  terminology: ‘믿다’ appropriately renders πιστεύω. ‘부르다’ retains the invocation wording of ἐπικαλέω without interpretively expanding it. ‘전파하다’ is a suitable formal rendering of κηρύσσω.
  issues:
  - severity: medium
    issue: The first clause uses ‘믿지 않는’ rather than a completed negative form.
    rationale: ἐπίστευσαν is aorist; in this rhetorical chain, ‘믿지 않은’ more closely preserves the prior non-belief presupposed before calling.
  - severity: medium
    issue: No footnote preserves the lexical alternative for ‘듣지 못한 분’.
    rationale: The Greek genitive relative pronoun can mean hearing concerning the person, not necessarily hearing the person directly. The English audit trail explicitly preserves this with a footnote; Korean should do likewise.
  revised_text: 그러면 그들이 믿지 않은 분을 어떻게 부르겠습니까? 그들이 듣지 못한 분을 어떻게 믿겠습니까?[a] 전파하는 사람이 없이 어떻게 듣겠습니까?
  revised_footnotes:
  - marker: a
    text: 또는 “그분에 관하여 듣지 못한”.
    reason: οὗ after ἀκούω can refer to hearing a message concerning the person; the main text retains the more text-near, formally ambiguous wording.
  revision_rationale: The revision changes the first verb phrase to reflect the Greek aorist and adds the required lexical-alternative footnote for the genitive object of ἀκούω. It otherwise preserves the draft’s concise, parallel structure and avoids doctrinal expansion.
