  source_fidelity: 핵심 뜻은 대체로 전달하지만, 「율법에서 난 의」는 현대 한국어에서 다소 부자연스럽고, 「그것들로 인하여」는 그리스어의 여성 단수 αὐτῇ를 복수로 바꾸어 본문의 문법적 모호성을 없앱니다. 또한 γράφει는 현재형 인용 공식입니다.
  naturalness: 「율법에서 비롯되는 의」와 「그 안에서 살 것입니다」가 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 인용 구조도 분명히 드러냅니다.
  terminology: δικαιοσύνη는 바울 문맥의 연속성을 위해 「의」로 유지합니다. 「정의」라는 가능한 어휘적 대안은 각주에 보존합니다. νόμος는 「율법」, Μωϋσῆς는 「모세」가 적절합니다.
  issues:
