    issue: 「그것들로 인하여」가 αὐτῇ의 단수 및 지시 대상의 모호성을 복수로 평준화함
    rationale: '본문은 ἐν αὐτῇ(직역: ''그 안에서/그것 안에서'')라고 하며, 레위기 18:5의 배경을 고려한 복수적 해석은 가능하지만 본문에서는 각주로 처리하는 편이 안전합니다.'
  - severity: low
