translation:
  language: ko
  text: 혹은 너는 하나님의 인자하심과 관용과 오래 참으심의 풍성함을 멸시하면서, 그분의 인자하심이 너를 회개로 이끌고 있음을 모르느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자하심’은 이 절의 두 용례 모두 ‘선하심’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηστότητος
  english_pob_choice: kindness
  chosen_korean: 인자하심
  alternatives_korean:
  - 선하심
  - 친절하심
  lexicon: BDAG
  rationale: 하나님의 속성으로서의 χρηστότης를 한국어 신학 전통 「인자하심」으로 옮긴다.
- source_word: ἀνοχῆς
