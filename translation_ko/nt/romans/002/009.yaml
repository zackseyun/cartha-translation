  source_fidelity: 초안은 θλῖψις와 στενοχωρία의 짝, 악을 행하는 사람, 유대인이 먼저이고 헬라인도 포함된다는 구조를 대체로 충실히 옮깁니다. 다만 ‘모든 사람의 영혼 위에’는 ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου의 직역투로 한국어에서는 부자연스럽고, 여기서 ψυχή는 관용적으로 사람 전체를 가리키므로 ‘모든 사람에게’가 의미를 더 정확히 전달합니다.
  naturalness: ‘곤고’와 ‘영혼 위에’는 현대 표준어 합쇼체 성경 문장으로 다소 고풍스럽거나 어색합니다. ‘환난과 고통이 닥칠 것입니다’는 원문의 심각성과 병렬을 살리면서도 자연스럽습니다. 생략된 서술어를 후반에 반복하여 수식 범위도 분명히 했습니다.
  terminology: ‘유대인’과 ‘헬라인’은 로마서의 Ἰουδαῖος/Ἕλλην 대조를 보존하는 적절한 용어입니다. θλῖψις는 ‘환난’, στενοχωρία는 현대적으로 이해되는 ‘고통’으로 구별했습니다. ‘헬라인’을 ‘이방인’으로 바꾸지 않아 원문의 표현을 유지했습니다.
