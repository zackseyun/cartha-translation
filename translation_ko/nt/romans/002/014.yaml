  naturalness: 초안의 평서형 ‘된다’는 지정된 현대 합쇼체 문체와 맞지 않습니다. 또한 ‘자기 자신에게’는 이 문맥에서 다소 어색하므로 ‘스스로에게’가 더 자연스럽습니다.
  terminology: ἔθνη는 문맥상 ‘이방인들’, νόμος는 일관되게 ‘율법’, φύσει는 해석을 좁히지 않는 ‘본성으로’로 유지했습니다. 마지막 ‘율법입니다’는 원문의 반복 및 수사적 연결을 보존합니다.
  issues:
