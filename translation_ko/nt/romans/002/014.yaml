    issue: ‘율법의 일을 행하다’
    rationale: τὰ τοῦ νόμου는 직역하면 ‘율법에 속한 것들’이지만, 한국어의 ‘율법의 일’은 율법 자체가 수행하는 일로도 읽힐 수 있습니다. ‘율법이 요구하는 것들’이 문맥상 의미를 정확하고 자연스럽게 전달합니다.
  - severity: low
    issue: ‘자기 자신에게 율법이 된다’
    rationale: ἑαυτοῖς는 복수이며, εἰσιν은 ‘~이다’입니다. ‘자신들에게 율법입니다’가 수 일치와 진술의 성격을 더 잘 살립니다.
  revised_text: 율법이 없는 이방인들이 본성으로 율법이 요구하는 것들을 행할 때마다, 이들은 율법이 없으면서도 자신들에게 율법입니다.
