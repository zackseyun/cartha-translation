  source_fidelity: 개정안은 ὅταν γὰρ의 반복·일반 조건을 ‘~할 때마다’로, φύσει를 해석적으로 좁히지 않는 ‘본성으로’로 유지합니다. τὰ τοῦ νόμου ποιῶσιν은 한국어에서 ‘율법의 일을 행하다’가 무엇을 뜻하는지 불분명해질 수 있으므로 ‘율법이 요구하는 것들을 행하다’로 명료하게 옮겼습니다. νόμον μὴ ἔχοντες의 양보적 분사와 ἑαυτοῖς εἰσιν νόμος의 비유적 진술도 각각 ‘없으면서도’, ‘자신들에게 율법입니다’로 반영했습니다.
  naturalness: 초안의 ‘율법의 일을 행하다’와 ‘자기 자신에게 율법이 된다’는 현대 표준어에서 다소 부자연스럽거나 의미가 모호합니다. ‘율법이 요구하는 것들을 행하다’, ‘자신들에게 율법입니다’가 합쇼체 문체에 더 자연스럽습니다.
  terminology: ‘이방인들’과 ‘율법’은 바울의 유대인/이방인 및 모세 율법이라는 문맥을 적절히 보존합니다. 마지막 ‘율법’은 관사 없는 비유적 용법이므로 대문자화나 교리적 해설을 덧붙이지 않았습니다.
  issues:
