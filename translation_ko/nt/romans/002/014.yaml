    rationale: τὰ τοῦ νόμου는 문자적으로 ‘율법에 속한 것들’이며, ‘율법의 일’은 바울 서신의 별도 표현인 ‘율법의 행위’와 혼동될 수 있습니다.
  - severity: low
    issue: ‘자기 자신에게’의 수 및 자연스러움
    rationale: ἑαυτοῖς는 복수 재귀 여격이므로 ‘스스로에게’가 주어 ‘이들’에 자연스럽게 호응합니다.
  revised_text: 율법이 없는 이방인들이 본성으로 율법에 속한 것들을 행할 때마다, 이들은 율법이 없으면서도 스스로에게 율법입니다.
