  source_fidelity: 초안은 ἐπαναπαύῃ νόμῳ(“율법을 의지하고”)와 καυχᾶσαι ἐν θεῷ(“하나님 안에서 자랑한다면”)를 대체로 충실히 반영합니다. 그러나 ἐπονομάζῃ(유대인이라는 명칭으로 불리다/그 명칭을 지니다)의 의미가 빠져 있어 수정이 필요합니다. 조건절의 마지막 동사를 ‘-한다면’으로 처리하여 εἰ의 조건성을 분명히 했습니다.
