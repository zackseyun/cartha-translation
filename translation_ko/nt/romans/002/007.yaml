    rationale: 그리스어에서는 이 절이 2:6의 동사에 의존하는 병렬 항목이지만, 독립 제시된 한국어 절에서는 연결 어미와 쉼표로 끝내면 불완전합니다. 마침형으로 제시하는 것이 안전합니다.
