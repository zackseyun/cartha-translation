  source_fidelity: 핵심 어휘는 대체로 충실합니다. 다만 καθ’ ὑπομονὴν ἔργου ἀγαθοῦ는 선한 일을 지속적으로 행하는 인내를 뜻하므로, 원문의 관계를 더 직접적으로 드러내도록 다듬었습니다. ζωὴν αἰώνιον은 앞 절의 ‘갚으실 것입니다’에 의존하지만, 이 절만 제시할 때에도 한국어로 자연스럽게 그 보어 관계를 나타낼 수 있습니다.
  naturalness: ‘선한 일에 한결같이 인내하면서’는 다소 추상적이고 결합이 매끄럽지 않습니다. ‘선한 일을 꾸준히 행하면서’가 현대 표준어 합쇼체 문맥에서 자연스럽습니다. 절말의 ‘것이며,’는 뒤 절에 종속되는 미완결 연결형이므로 마침형으로 고쳤습니다.
  terminology: ‘영광’, ‘존귀’, ‘썩지 않음’, ‘영생’은 원문 및 제시된 용어 정책과 부합합니다. ‘썩지 않음’은 다소 문어적이나 ἀφθαρσία의 추상 명사성과 1:23의 일관성 방침을 보존하므로 유지했습니다.
