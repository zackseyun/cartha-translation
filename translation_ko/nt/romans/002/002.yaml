review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders κρίμα as “심판,” κατὰ ἀλήθειαν as “진리를 따라,” and the adverse judicial reference to those who do such things. However, “그러나” overstates the mild connective δέ, which is continuative here rather than adversative.
  naturalness: “우리는 안다” does not maintain the requested modern formal-polite 합쇼체, and the em dash creates an unnecessarily marked Korean sentence structure. A finite formal-polite construction is more natural.
  terminology: “하나님의 심판” is appropriate for κρίμα. “진리에 따른” preserves the phrase’s reference to conformity with truth without reducing it to merely “rightly.”
  issues:
  - severity: medium
    issue: “그러나” for δέ
    rationale: δέ here continues Paul’s argument and does not require a strong contrast. Omitting an explicit connective is natural Korean and avoids adding adversative force.
  - severity: medium
    issue: Non-honorific/non-formal ending “안다”
    rationale: The specified target register is modern formal-polite 합쇼체; “알고 있습니다” is required.
  - severity: low
    issue: Marked dash construction
    rationale: The dash is not represented in the Greek and is less natural than a standard Korean complement clause in this formal register.
  revised_text: 우리는 이런 일을 행하는 자들에게 임하는 하나님의 심판이 진리에 따른 것임을 알고 있습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “진리에 일치하여.” 하나님의 심판이 참된 사실에 부합한다는 뜻입니다.
    reason: κατὰ ἀλήθειαν의 가능한 표현과, 단순한 ‘정당하게’보다 넓은 의미를 보충한다.
  revision_rationale: 'The revision removes the overly adversative rendering of δέ, restores the required 합쇼체 register, and expresses the Greek construction naturally: God’s judgment comes upon those practicing such things and is in accordance with truth. The footnote preserves the lexical nuance of κατὰ ἀλήθειαν without imposing a doctrinal interpretation.'
