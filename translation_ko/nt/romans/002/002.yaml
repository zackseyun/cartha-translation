review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders κρίμα as “심판,” κατὰ ἀλήθειαν as “진리를 따라,” and the adverse direction toward those who do such things. However, “그러나” overstates the weak connective δέ, which is continuative here rather than adversative. The present participle πράσσοντας is adequately conveyed by “행하는.”
  naturalness: The dash and inverted clause order are less natural for modern formal Korean. A direct declarative structure with “압니다” is clearer and maintains an appropriate 합쇼체 register.
  terminology: “하나님의 심판,” “진리,” and “행하다” are appropriate, standard biblical Korean terms. “진리에 따라” preserves the Greek phrase without reducing it to the interpretive adverb “정당하게.”
  issues:
  - severity: medium
    issue: “그러나” for δέ
    rationale: δέ normally continues the discourse in this verse; “그러나” introduces a stronger contrast than the Greek warrants.
  - severity: low
    issue: Dash-separated, inverted construction
    rationale: The construction is understandable but less idiomatic and less polished in modern formal Korean than a direct declarative sentence.
  revised_text: 우리는 하나님의 심판이 그런 일을 행하는 사람들에게 진리에 따라 임한다는 것을 압니다.
  revised_footnotes:
  - marker: a
    text: 또는 “진리에 일치하여.” 곧 하나님의 심판은 참된 사실에 부합합니다.
    reason: lexical_alternative
  revision_rationale: The revision removes the unwarranted adversative connective, uses natural modern formal Korean syntax, retains the judicial direction of ἐπί with “사람들에게,” and preserves the transparent rendering of κατὰ ἀλήθειαν. The footnote retains the audit trail’s lexical clarification without narrowing the phrase to a merely interpretive adverb.
