review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrastive δέ and the threefold nouns, but its closing "그러하다" is an awkward, loosely anaphoric expansion of the Greek dative phrase. A clearer Korean rendering should retain the same implied bestowal for both groups. "선을 행하는" more directly represents τὸ ἀγαθόν than "선한 일을 행하는," while preserving its broad, non-specific sense.
  naturalness: The proposed revision uses modern standard Korean in formal-polite style. Repeating the implied predicate in the second clause makes the sentence clear and idiomatic without adding a theological interpretation.
  terminology: '"영광, 존귀, 평화" naturally render δόξα, τιμή, εἰρήνη. "유대인" and "헬라인" preserve the source wording and the established Jew/Greek pairing. A note clarifies the broader contextual force of "헬라인" without replacing the Greek term in the main text.'
  issues:
  - severity: medium
    issue: The phrase "그리고 헬라인에게도 그러하다" is stylistically awkward and leaves the implied predicate vague.
    rationale: The Greek coordinates recipients of the same three promised realities. In Korean, explicitly repeating "있을 것입니다" is clearer and faithfully expresses the ellipsis.
  - severity: low
    issue: '"선한 일을 행하는" is somewhat more concrete than τὸ ἀγαθόν.'
    rationale: The Greek expression is broadly "the good/what is good." "선을 행하는" is concise and preserves that breadth.
  revised_text: 그러나 선을 행하는 모든 사람에게는 영광과 존귀와 평화가 있을 것입니다. 유대인에게 먼저, 그리고 헬라인에게도 있을 것입니다.[b]
  revised_footnotes:
  - marker: a
    text: 또는 “좋은 것을 행하는 모든 사람에게.”
    reason: lexical_alternative
  - marker: b
    text: 여기서 “헬라인”은 더 넓게 유대인이 아닌 사람, 곧 이방인을 가리킬 수 있습니다.
    reason: cultural_note
  revision_rationale: The wording is revised for directness and natural Korean syntax. The repeated predicate clarifies the Greek ellipsis; "선" retains the broad object of τὸ ἀγαθόν; and the cultural note preserves the contextual breadth of Ἕλληνι. Footnote a is retained as the lexical alternative but has no anchor in the main text because the selected Korean wording does not require it; footnote b is anchored to "헬라인".
