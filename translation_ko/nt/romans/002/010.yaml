  source_fidelity: 원문의 대조 구조(δὲ), 보상 항목(영광·존귀·평강), 선을 행하는 모든 사람, 그리고 유대인 우선 및 헬라인이라는 순서는 대체로 충실합니다. 다만 현행의 ‘있을 것이니’와 ‘그러하다’는 원문에 없는 미래적·추론적 표현을 다소 부각하며, 요청된 현대 합쇼체에도 맞지 않습니다.
  naturalness: ‘유대인에게, 그리고 헬라인에게도 그러하다’는 뜻은 이해되지만 한국어로는 다소 번역투입니다. ‘유대인에게 먼저, 그리고 헬라인에게도’가 더 자연스럽고 원문의 수혜 대상 병렬을 명료하게 드러냅니다.
  terminology: δόξα/τιμή/εἰρήνη은 ‘영광과 존귀와 평강’으로 적절합니다. Ἕλληνι는 본문에서 ‘헬라인’으로 보존하고, 이 문맥에서 더 넓게 이방인을 가리킬 수 있음을 주로 설명하는 것이 적절합니다. τὸ ἀγαθόν은 ‘선’을 기본 번역으로 하되 ‘선한 것’이라는 대안을 각주에 남깁니다.
