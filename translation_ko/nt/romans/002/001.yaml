- from: 그러므로, 판단하는 자, 사람아, 너는 누구든지 변명할 수 없다. 이는 네가 다른 사람을 판단하는 그 일로 자신을 정죄하기 때문이니, 판단하는 네가 같은 일을 행하고 있다.
  to: 그러므로 판단하는 모든 사람이여[a], 당신은 변명할 수 없습니다. 다른 사람을 판단하는 바로 그 일로 당신 자신을 정죄하기 때문입니다. 판단하는 당신이 같은 일을 행하고 있기 때문입니다.
  rationale: 합쇼체 종결로 통일하면서도 「사람이여」라는 호격을 유지하여 원문의 직접적 수사성을 보존했습니다. πᾶς ὁ κρίνων은 「판단하는 모든 사람」으로 명료하게 옮겼고, ἐν ᾧ의 행위-수단 연결은 「바로 그 일로」로, κατακρίνεις는 「정죄하다」로 반영했습니다. 마지막 현재형은 「행하고 있습니다」로 처리해 지속적 행위를 나타냈습니다.
