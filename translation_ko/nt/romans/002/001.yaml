  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 「판단하는 자, 사람아, 너는 누구든지」는 πᾶς ὁ κρίνων의 범위와 호격의 관계가 한국어에서 부자연스럽고, 원문의 직접 호소를 흐립니다. 또한 현재형 πράσσεις의 지속적 뉘앙스는 「행하고 있습니다」로 더 분명히 드러낼 수 있습니다.
  naturalness: 초안은 표준 현대 한국어 합쇼체라는 지정 register와 달리 평어 「없다/있다」를 사용합니다. 호격은 유지하되 문장 종결을 합쇼체로 통일하는 것이 자연스럽고 일관됩니다.
  terminology: 「변명할 수 없습니다」는 ἀναπολόγητος의 법정적 의미를 무리 없이 전달하고, 「정죄하다」는 κατακρίνω의 강화된 유죄 선언의 뜻을 적절히 보존합니다. 「사람이여」는 ἄνθρωπε의 대표적 호격을 살리며, 그 포괄적 지시 대상은 각주로 밝혀 두는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 합쇼체 지정과 평어 종결의 불일치
    rationale: 초안의 「변명할 수 없다」「행하고 있다」는 지정된 modern formal-polite 합쇼체가 아닙니다. 원문의 질책하는 어조는 높임 종결을 버리지 않고도 유지할 수 있습니다.
  - severity: medium
    issue: 「판단하는 자, 사람아, 너는 누구든지」의 어순과 수식 관계가 부자연스러움
    rationale: πᾶς ὁ κρίνων은 ‘판단하는 모든 이’라는 포괄적 지시입니다. 초안의 병렬적 호명은 ‘너는 누구든지’가 앞의 단수 호격과 어색하게 결합되어 한국어 문장 구조를 흐립니다.
  - severity: low
