source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
  footnotes:
  - marker: a
    text: Or 'is of value' for 'is beneficial.'
    reason: lexical_alternative
  - marker: b
    text: Or 'if you keep the law.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a lawbreaker.'
    reason: lexical_alternative
  - marker: d
    text: Lit. 'your circumcision has become uncircumcision'; that is, covenant circumcision loses its value when the law is transgressed.
    reason: cultural_note
translation:
  language: ko
  text: 할례는 참으로 당신이 율법을 행한다면 유익합니다. 그러나 당신이 율법을 범하는 자라면, 당신의 할례는 무할례가 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιτομή
  english_pob_choice: circumcision
  chosen_korean: 할례
  alternatives_korean:
  - 할례 받음
  lexicon: BDAG
  rationale: 용어집 기본값 「할례」를 따른다.
- source_word: ἀκροβυστία
  english_pob_choice: uncircumcision
  chosen_korean: 무할례
  alternatives_korean:
  - 할례 받지 않음
  - 무포피
  lexicon: BDAG
  rationale: 용어집 기본값 「무할례」를 따른다. 「무포피」는 의학적 직역이나 신학 용어로는 「무할례」가 굳어져 있다.
