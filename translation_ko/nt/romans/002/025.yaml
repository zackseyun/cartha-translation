  to: 할례는 참으로 당신이 율법을 행한다면 유익합니다. 그러나 당신이 율법을 범하는 자라면, 당신의 할례는 무할례가 되었습니다.
  rationale: The revision retains the Greek’s direct address, conditional logic, and stark reversal from circumcision to uncircumcision. It adds an appropriate Korean equivalent for the affirming force of μὲν γὰρ (‘참으로’), renders the perfect γέγονεν with ‘되었습니다,’ and regularizes the requested formal-polite style. No footnote is needed because the concrete covenantal contrast is retained in the text without explanatory paraphrase.
