  text: 오히려 속으로 유대인인 사람이 유대인이며, 할례는 마음의 할례로서 영으로 한 것이지 문자로 한 것이 아닙니다. 그 사람이 받는 칭찬은 사람에게서가 아니라 하나님에게서 옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
