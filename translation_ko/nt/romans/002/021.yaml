  source_fidelity: 그리스어의 추론 접속사 οὖν은 ‘그러므로’로 옮기는 편이 ‘그러면’보다 논증적 연결을 더 정확히 드러냅니다. 두 개의 관사+분사 구문과 대조적 수사 의문문, 그리고 μὴ κλέπτειν의 금지 내용을 충실히 보존했습니다.
  naturalness: 초안의 ‘-느냐?’는 현대 표준어 합쇼체 요청과 맞지 않는 해라체입니다. ‘당신은 … 않습니까/합니까?’로 바꾸면 현대의 공식적 문체에서 자연스럽고 직접적인 책망의 어조도 유지됩니다.
  terminology: ‘가르치다’, ‘선포하다’, ‘도둑질하다’는 각각 διδάσκω, κηρύσσω, κλέπτω에 적절합니다. ‘도둑질하지 말라’는 금지의 인용 내용도 유지했습니다.
  issues:
  - severity: medium
    issue: 문체 종결이 합쇼체가 아님
    rationale: ‘가르치지 않느냐?’, ‘도둑질하느냐?’는 해라체 의문형입니다. 지정된 현대 공식적 합쇼체에 맞춰 ‘않습니까?’, ‘합니까?’로 고쳐야 합니다.
  - severity: low
    issue: οὖν의 논증적 연결이 다소 약함
    rationale: ‘그러면’도 문맥상 가능하지만, 앞선 논증으로부터의 결론을 표지하는 οὖν에는 ‘그러므로’가 더 가깝습니다.
  revised_text: 그러므로 다른 사람을 가르치는 당신은 자신을 가르치지 않습니까? “도둑질하지 말라”고 선포하는 당신은 도둑질합니까?
