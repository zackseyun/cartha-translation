  source_fidelity: 「확신한다면」은 이 절의 헬라어 본문에 없으며, 앞 절의 πεποίθησά τε에 속한 조건/확신 표현을 이 절에 다시 도입합니다. 또한 μόρφωσις를 「본체」로 옮기면 지식과 진리의 실체·본질이라는 뜻으로 과도하게 확정됩니다. 여기서는 ‘형상/형식, 구체화된 표현’의 뜻을 유지해야 합니다.
  naturalness: 「…지닌 자로서—」는 앞 절에서 이어지는 바울의 열거를 자연스럽게 보존하며, 본문의 미완결 연결을 대시로 표시합니다. 「훈육자」와 「교사」는 서로 다른 두 직함의 병렬도 살립니다.
  terminology: νόμος는 문맥상 유대 율법을 가리키므로 「율법」으로, μόρφωσις는 「형상」으로 옮깁니다. 각주에서 「형식」 및 구체적 표현이라는 의미 가능성을 밝혀 의미 범위를 보존합니다.
  issues:
  - severity: high
    issue: 「가졌다고 확신한다면」이 원문에 없는 확신/조건 표현을 재도입함
    rationale: ἔχοντα는 ‘지니고 있는’이라는 분사이며, 이 절에는 ‘확신하다’에 해당하는 동사가 없습니다. 이 표현은 앞 절의 문법적 맥락을 중복하고 한국어 문장에 부당한 조건을 만듭니다.
  - severity: medium
    issue: μόρφωσις를 「본체」로 번역함
    rationale: 「본체」는 실체 또는 본질을 뜻하여 원문의 ‘형상, 형식, 구체화된 표현’보다 강한 형이상학적 의미를 부여합니다.
  revised_text: 어리석은 이들의 훈육자요 어린아이들의 교사이며, 율법 안에 지식과 진리의 형상을 지닌 자로서—
