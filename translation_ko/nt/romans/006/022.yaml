  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 두 분사(ἐλευθερωθέντες, δουλωθέντες)는 완료된 수동의 신분 변화를 나타내므로, 초안의 「자유롭게 되고」보다 「해방되고 … 노예가 된」이 더 정확합니다. 또한 ἔχετε는 ‘열매를 얻고 있으며’보다 ‘열매가 있다’로 옮기는 편이 자연스럽고, τέλος와 ζωὴν αἰώνιον의 병렬도 보존됩니다.
  naturalness: 초안의 「그 끝은 영원한 생명입니다」는 자연스럽지만, 앞 절의 「열매를 얻고 있으며」는 한국어에서 다소 부자연스럽고 원문의 현재 직설법 ‘가지고 있다’와도 거리가 있습니다. 관계절 구조로 정리하면 현대 표준어 합쇼체에서 더 매끄럽습니다.
  terminology: 「죄에서 해방되다」는 ἀπὸ τῆς ἁμαρτίας를 자연스럽게 반영하며, 「하나님께 노예가 된」은 δουλωθέντες τῷ θεῷ의 강한 비유를 보존합니다. 「거룩함」과 「영원한 생명」도 적절합니다.
  issues:
  - severity: medium
    issue: 「자유롭게 되고」가 수동 완료 행위의 뉘앙스를 충분히 반영하지 못함
    rationale: ἐλευθερωθέντες는 부정과거 수동 분사로, 신자들이 죄에서 자유롭게 된/해방된 상태를 전제합니다. 「자유롭게 되고」는 진행적 변화처럼 들릴 수 있습니다.
  - severity: medium
    issue: 「열매를 얻고 있으며」의 어법 및 ἔχετε 반영
    rationale: ἔχετε τὸν καρπὸν ὑμῶν은 문자적으로 ‘여러분의 열매를 가지고 있습니다’입니다. 한국어에서는 「열매가 있습니다」가 자연스러우며, 「얻고 있으며」는 ‘획득’ 행위를 덧붙입니다.
  revised_text: 그러나 이제 죄에서 해방되고 하나님께 노예가 된 여러분에게는 거룩함에 이르는 열매가 있으며, 그 끝은 영원한 생명입니다.
  revised_footnotes: []
