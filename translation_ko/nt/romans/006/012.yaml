  terminology: '''죄'', ''죽을 몸'', ''욕망'', ''순종''은 적절합니다. ''왕노릇''은 βασιλευέτω의 왕권 비유를 보존합니다. αὐτοῦ는 본문상 ''몸''을 가리키는 것이 자연스럽지만, 다른 해석/본문 전통의 ''죄의 욕망'' 가능성은 각주로 밝혀야 합니다.'
