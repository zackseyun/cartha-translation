  to: 우리는 이것을 압니다. 우리의 옛 사람이 그분과 함께 십자가에 못 박힌 것은 죄의 몸이 무력화되어, 우리가 더 이상 죄에게 노예 노릇을 하지 않게 하려는 것입니다.
  rationale: 원문의 도입 participle을 독립적인 합쇼체 문장으로 자연스럽게 보완했습니다. 두 목적 표현(ἵνα 및 τοῦ μηκέτι)을 ‘…하려는 것입니다’ 아래에 유지하고, καταργηθῇ의 수동성을 ‘무력화되어’로, δουλεύειν의 예속 이미지를 ‘노예 노릇을 하지’로 보존했습니다.
