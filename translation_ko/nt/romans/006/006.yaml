  terminology: ‘우리의 옛 사람’, ‘죄의 몸’, ‘노예 노릇’은 바울의 표현과 이 절의 지배-예속 어휘를 적절히 보존합니다. ‘그분과 함께’는 συν-의 의미를 자연스럽게 드러냅니다.
  issues:
