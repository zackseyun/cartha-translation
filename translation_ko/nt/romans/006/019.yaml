  - 무법
  - 율법 위반
  lexicon: BDAG
  rationale: 7장 ἁμαρτία와 구별을 위해 「불법」 유지.
- source_word: ἁγιασμόν
  english_pob_choice: sanctification
  chosen_korean: 거룩함
  alternatives_korean:
  - 성화
  lexicon: BDAG
  rationale: 전통 「성화」보다 본문에 충실한 「거룩함」.
