id: ROM.6.5
reference: Romans 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: ko
  text: 우리가 그의 죽음의 모양과 하나가 되었다면, 그의 부활의 모양과도 또한 하나가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 “부활의 것도 될 것이다”이며, 앞 절의 “그의 죽음의 모양과 하나가 되었다면”에서 ‘그의’와 ‘모양과 하나가 되다’를 보충한 것입니다. 「하나가 되다」는 ‘함께 자라나다’ 또는 ‘함께 자라난 것이 되다’로도 옮길 수 있습니다.
    reason: 후반절의 생략된 술어와 소유·평행 표현의 번역상 보충을 밝히고, σύμφυτοι의 어휘적 대안을 제시하기 위함.
lexical_decisions:
- source_word: σύμφυτοι
  english_pob_choice: united with
  chosen_korean: 연합된 자
  alternatives_korean:
  - 접붙임된
  - 함께 자란
  lexicon: BDAG
  rationale: 「함께 자라난/접붙여진」 의미. 「연합된 자」로 신학적 연합 의미를 살림.
- source_word: τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ
  english_pob_choice: in the likeness of his death
  chosen_korean: 그분의 죽음과 같은 모양으로
  lexicon: BDAG
  rationale: ὁμοίωμα를 「같은 모양」으로 그대로 옮김.
- source_word: τῆς ἀναστάσεως
  english_pob_choice: resurrection
  chosen_korean: 부활
  lexicon: BDAG
  rationale: 표준.
