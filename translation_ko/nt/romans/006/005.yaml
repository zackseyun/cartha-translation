  to: 우리가 그의 죽음의 모양과 하나가 되었다면, 그의 부활의 모양과도 또한 하나가 될 것입니다.[a]
  rationale: 수정문은 원문의 완료상(「하나가 되었다면」), 죽음과 부활의 평행, 그리고 후반절의 미래형을 보존합니다. σύμφυτοι를 자연스러운 한국어로 옮기되, 유기적 어휘 뉘앙스와 후반절의 생략은 주석에서 투명하게 처리했습니다. ‘그의 부활의 모양’은 그리스어에 반복되지 않은 요소이지만 앞 절의 병렬에서 보충된 것이므로 주석으로 표시했습니다.
