  source_fidelity: 초안은 σύμφυτοι의 연합 의미와 γεγόναμεν의 완료상을 대체로 반영합니다. 그러나 「죽음과 같은 모양으로」는 τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ를 다소 어색하게 처리하며, 두 절의 평행 구조와 후반절의 생략을 더 분명히 나타낼 필요가 있습니다. 후반절에 '그의'와 '모양'을 보충하는 것은 앞 절에서 자연스럽게 이어지는 의미이나, 그 보충은 주석으로 밝혀 두는 것이 적절합니다.
  naturalness: 「연합된 자가 되었다면」의 명사화는 현대 한국어에서 무겁고 부자연스럽습니다. 「하나가 되었다면」은 합쇼체 문맥에서 더 자연스럽고, 바울의 연합 언어도 과도하게 교리적으로 한정하지 않습니다.
  terminology: ἀνάστασις는 「부활」로 적절합니다. σύμφυτοι의 유기적 뉘앙스는 본문을 부자연스럽게 만들지 않도록 「하나가 되다」로 옮기고, 「함께 자라나다」를 어휘 대안으로 주석에 제시합니다.
