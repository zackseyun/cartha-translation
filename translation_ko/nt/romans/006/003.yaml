  source_fidelity: 초안은 수동 과거형 ‘세례 받은’과 수사 의문문의 기본 의미를 보존합니다. 그러나 εἰς Χριστὸν Ἰησοῦν을 ‘메시아 예수께로’로 옮기면 한국어에서 예수께서 세례를 베푸시는 분이라는 뜻으로도 읽히며, 그리스어의 편입·관계의 방향을 충분히 전달하지 못합니다. 또한 ‘죽음 속으로’는 지나치게 물리적인 공간 이미지를 줄 수 있습니다.
  naturalness: ‘우리 모두가 … 세례 받았다는 것을 여러분은’은 문법적으로 가능하지만 주어와 청자의 대비가 다소 거칩니다. ‘우리가 모두 … 세례를 받은 것이 … 세례를 받은 것임’을 사용하면 바울의 반복과 두 εἰς 구문의 관계를 자연스럽고 명료하게 나타냅니다. 합쇼체 의문 종결도 유지됩니다.
  terminology: ‘메시아 예수’는 제공된 POB의 Χριστός 번역 방침에 부합합니다. ‘세례를 받다’는 표준적인 교회어이며, ‘안으로’는 εἰς의 방향성과 편입 의미를 보존하면서 특정 세례론을 확정하지 않습니다.
