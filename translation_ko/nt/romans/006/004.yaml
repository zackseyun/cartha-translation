  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: ko
  text: 그러므로 우리는 세례를 통하여 그분과 함께 죽음 속으로 장사되었습니다. 그것은 메시아[a]께서 아버지의 영광을 통하여 죽은 자들 가운데서 일으킴을 받으신 것처럼, 이와 같이 우리도 생명의 새로움 가운데서 걸어가게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리스도’.
    reason: Χριστός의 칭호를 한국어에서 음역한 대안 표현.
lexical_decisions:
- source_word: συνετάφημεν
  english_pob_choice: were buried with
  chosen_korean: 함께 ... 장사되었습니다
  lexicon: BDAG
  rationale: συν- 연합 동사. 그분과의 공동 매장.
- source_word: διὰ τοῦ βαπτίσματος
  english_pob_choice: through baptism
  chosen_korean: 세례를 통해
  lexicon: BDAG
  rationale: 수단.
- source_word: ἠγέρθη
  english_pob_choice: was raised
  chosen_korean: 일으킴을 받은
  lexicon: BDAG
  rationale: 수동 부활. 아버지의 영광이 행위주.
- source_word: Χριστὸς
  english_pob_choice: Messiah
  chosen_korean: 메시아
  lexicon: BDAG
  rationale: 칭호.
- source_word: ἐν καινότητι ζωῆς
  english_pob_choice: in newness of life
  chosen_korean: 새 생명 가운데서
  alternatives_korean:
  - 생명의 새로움 안에서
  lexicon: BDAG
  rationale: 속격을 자연스럽게 풀어 「새 생명」.
- source_word: περιπατήσωμεν
  english_pob_choice: walk
  chosen_korean: 걸어가게
  alternatives_korean:
  - 행하게
  - 살아가게
  lexicon: BDAG
  rationale: 바울의 삶의 방식 은유. 「걷다」 원의를 살림.
