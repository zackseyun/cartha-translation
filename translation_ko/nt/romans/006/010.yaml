    reason: τῇ ἁμαρτίᾳ의 여격은 ‘죄에 대하여’라는 관계적 의미로 옮겼으나, 다른 가능한 의미 범위를 밝혀 둡니다.
  revision_rationale: 설명 접속사 γάρ를 ‘이는’으로 반영하고, 원문의 죽음/삶의 병행을 ‘죽으신 것은 / 사시는 것은’으로 자연스럽게 유지했습니다. ‘죄에 대하여’와 ‘하나님을 향하여’는 두 여격의 대조를 보존하며, 죄에 관한 표현의 다른 가능한 이해는 각주로 처리했습니다.
