  to: 여러분이 순종을 위해 자신을 누구에게 노예로 내어주면, 여러분은 여러분이 순종하는 그 대상의 노예가 된다는 것을 알지 못합니까? 곧 죽음에 이르는 죄의 노예이거나, 의[a]에 이르는 순종의 노예입니다.
