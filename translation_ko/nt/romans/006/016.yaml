  source_fidelity: 핵심 어휘(παριστάνετε, δοῦλος, ὑπακοή, ἁμαρτία, θάνατος, δικαιοσύνη)는 대체로 충실하게 옮겼습니다. 그러나 ᾧ ὑπακούετε는 ‘여러분이 순종하는 대상/이’라는 뜻인데, 초안의 ‘그 순종하는 자’는 주체를 바꾸어 ‘순종하는 사람’으로 읽히므로 수정이 필요합니다. 또한 δικαιοσύνη의 어휘 대안에 대한 영어 POB 각주가 한국어 본문에도 반영되어야 합니다.
  naturalness: ‘여러분이 순종하는 그 대상의 노예’는 죄와 순종의 의인화를 유지하면서도 한국어로 명료합니다. ‘곧’ 이하를 독립된 서술로 처리하여 원문의 ‘είτε ... ή’ 양자택일 구조를 자연스럽게 드러냈습니다.
  terminology: δοῦλος는 문맥의 소유·예속 이미지를 살려 ‘노예’로 유지하고, ὑπακοή는 ‘순종’, δικαιοσύνη는 바울 서신의 통상적 신학 용례를 따라 ‘의’로 유지했습니다. ‘정의’는 본문을 대체하지 않고 어휘 대안으로 각주 처리했습니다.
