translation:
  language: ko
  text: 그러나 가지들 가운데 몇 가지가 꺾여 나가고, 야생 올리브나무인 당신이 그들 가운데 접붙임을 받아 올리브나무의 뿌리와 그 풍성함을 함께 누리는 사람이 되었다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “올리브나무의 풍성한 뿌리를 함께 누리는 사람이 되었다면.” 전통적으로는 “올리브나무의 뿌리와 기름짐을 함께 누리는 사람이 되었다면”으로 옮깁니다.
    reason: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας의 연속된 속격 관계는 ‘뿌리와 풍성함’을 각각 함께 누리는 것으로도, ‘풍성한 뿌리’를 함께 누리는 것으로도 옮길 수 있으므로 그 모호성을 보존합니다.
