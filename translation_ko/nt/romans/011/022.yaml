- from: 그러므로 하나님의 인자하심과 엄위하심을 살펴보십시오. 넘어진 자들에게는 엄위하심이, 그러나 당신에게는 하나님의 인자하심이 있습니다 — 당신이 그분의 인자하심에 계속 머무른다면 말입니다. 그렇지 않으면 당신도 잘려나갈 것입니다.
  to: 그러므로 하나님의 인자하심과 준엄하심을 살펴보십시오. 넘어진 사람들에게는 준엄하심이, 당신에게는 하나님의 인자하심이 있습니다. 다만 당신이 그 인자하심 안에 계속 머문다면 그렇습니다. 그렇지 않으면 당신도 잘려 나갈 것입니다.
  rationale: ‘엄위하심’을 ‘준엄하심’으로 바꾸어 ἀποτομία가 가리키는 심판의 엄격하고 단호한 성격을 살렸습니다. 조건절은 하나님의 인자하심이 당신에게 있다는 진술을 한정하도록 문장을 분명히 했으며, 원문의 실제적 조건과 경고를 완화하거나 특정 교리로 해석하지 않았습니다.
