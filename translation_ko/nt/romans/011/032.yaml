  source_fidelity: 개정이 필요합니다. 초안의 ‘모든 사람’은 문맥상 가능한 해석이지만, τοὺς πάντας의 반복적이고 의도적으로 넓은 표현을 ‘사람’으로 명시하여 다소 좁힙니다. ‘모두’를 두 번 반복하여 원문의 대칭성과 범위의 열림을 보존하는 편이 더 충실합니다. 또한 ‘가두신 것은 … 위함입니다’는 γάρ와 ἵνα의 설명·목적 관계를 자연스럽게 반영합니다.
  naturalness: ‘하나님께서 모두를 불순종에 가두신 것은 모두에게 긍휼을 베푸시기 위함입니다’는 현대 표준어 합쇼체로 자연스럽고, 바울의 압축된 논증 문체도 유지합니다.
  terminology: ‘불순종’은 ἀπείθεια에 적절하며, ‘긍휼을 베푸시다’는 ἐλεήσῃ의 공적인 성서 문체와 잘 맞습니다. ‘모두’의 반복은 신학적 범위를 해석으로 확정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘모든 사람’이 τοὺς πάντας의 범위를 명시함
    rationale: 원문은 ‘모두’를 두 번 반복하며, 문맥상 유대인과 이방인을 가리키지만 그 범위를 번역에서 ‘사람’으로 미리 규정하지 않는 편이 원문 및 영어 POB의 번역 방침에 더 부합합니다.
  revised_text: 하나님께서 모두를 불순종에 가두신 것은 모두에게 긍휼을 베푸시기 위함입니다.
  revised_footnotes:
