    reason: lexical_alternative
  - marker: b
    text: ‘불순종’은 문맥에 따라 ‘불신’으로도 옮길 수 있으나, 여기서는 순종을 거부한다는 더 넓은 의미가 의도된 것으로 보입니다.
    reason: lexical_alternative
