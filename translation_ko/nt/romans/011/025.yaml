  rationale: ‘신비’와 ‘완악함’은 유지하되, 부정 구문과 목적절을 현대 한국어에서 명료하게 재구성했습니다. ‘이방인들의 충만함’은 πλήρωμα의 의미를 열어 두며, 양적 해석은 각주에만 제시했습니다. γέγονεν의 결과 상태와 ἄχρι οὗ의 종결점을 ‘일어났으며 … 때까지 계속됩니다’로 드러냈습니다.
