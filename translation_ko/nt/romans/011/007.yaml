revisions:
- from: 그러면 어떻습니까? 이스라엘이 구하던 그것을 얻지 못하였고, 도리어 택하심을 받은 자들이 그것을 얻었으며, 그 나머지는 완악하게 되었습니다.
  to: 그러면 어떻습니까? 이스라엘은 구하는 것을 얻지 못하였으나, 택하심을 받은 사람들은[a] 그것을 얻었고, 나머지는 완악하게 되었습니다.[b]
