    rationale: 문맥상 계속되는 추구를 나타내므로 ‘구하는’이 더 직접적이며 불필요한 과거화도 피합니다.
  - severity: low
    issue: ‘도리어’는 δέ가 표시하는 대조보다 다소 강한 역전·강조를 보탭니다.
    rationale: ‘그러나’는 원문의 대조를 충분히 나타내면서 추가 뉘앙스를 넣지 않습니다.
