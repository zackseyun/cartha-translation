id: ROM.11.7
reference: Romans 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
  footnotes:
  - marker: a
    text: Or 'the election obtained it.' The Greek ἐκλογή is literally 'election' or 'choice,' but here likely stands for the people chosen.
    reason: lexical_alternative
  - marker: b
    text: Or 'were made callous.' The verb can denote being hardened or rendered spiritually insensitive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 어떻습니까? 이스라엘은 구하는 것을 얻지 못하였으나, 택하심을 받은 사람들은[a] 그것을 얻었고, 나머지는 완악하게 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘택하심’. 그리스어 ‘에클로게’는 문자적으로 ‘선택’ 또는 ‘택하심’이지만, 여기서는 택하심을 받은 사람들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘완고하게 되었습니다’, ‘무감각해졌습니다’. 이 동사는 굳어지거나 영적으로 둔감해지는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλογὴ
  english_pob_choice: the elect
  chosen_korean: 택하심을 받은 자들
