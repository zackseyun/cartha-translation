  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
  footnotes:
  - marker: a
    text: Or 'receiving.' The Greek term contrasts with 'rejection' and can denote being received back or accepted.
    reason: lexical_alternative
  - marker: b
    text: '''Life from the dead'' may refer figuratively to extraordinary spiritual renewal, or more specifically to resurrection; Paul leaves the expression compressed and evocative.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 버림을 당한 것이 세상의 화목이라면, 그들이 받아들여지는 것[a]은 죽은 자들 가운데서의 생명[b]이 아니고 무엇이겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “맞아들여짐.” 그리스어는 “버림”과 대조되어, 다시 받아들여짐 또는 영접됨을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “죽은 자들 가운데서의 생명”은 특별한 영적 새로움 또는 부활을 가리킬 수 있습니다. 바울은 이 표현을 압축적이고 여운 있게 남겨 둡니다.
    reason: alternative_reading
