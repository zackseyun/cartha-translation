  - severity: medium
    issue: ‘얼마나 더 쉽겠습니까’
    rationale: πόσῳ μᾶλλον은 논증의 ‘더 큰 정도’를 나타내며, 원문의 미래 수동형 ἐγκεντρισθήσονται를 ‘얼마나 더더욱 … 접붙임을 받겠습니까’로 유지하는 것이 더 직접적입니다.
  - severity: low
    issue: ‘본래의 가지들’의 명시성
    rationale: 그리스어는 ‘이들, 본성에 따른 이들’이라고 하며 ‘가지들’은 직접 명시하지 않습니다. 문맥상 보충은 가능하지만 각주로 밝혀야 합니다.
