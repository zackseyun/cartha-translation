  source_fidelity: 개정이 필요합니다. καλλιέλαιον은 ‘좋은’ 올리브나무가 아니라 야생 올리브나무와 대조되는 ‘재배된 올리브나무’입니다. 또한 πόσῳ μᾶλλον은 단순히 더 ‘쉽다’는 뜻보다, 미래의 결과를 강조하는 ‘얼마나 더더욱 …겠습니까’로 옮기는 편이 충실합니다.
