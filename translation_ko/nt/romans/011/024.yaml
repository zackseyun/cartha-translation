  terminology: ἀγριέλαιος/καλλιέλαιος의 대조는 ‘야생 올리브나무/재배된 올리브나무’로 일관되게 옮겼습니다. οὗτοι οἱ κατὰ φύσιν에는 문맥상 보충되는 ‘가지들’을 본문에 두되, 그것이 그리스어에 명시된 명사가 아님을 각주로 밝혔습니다.
