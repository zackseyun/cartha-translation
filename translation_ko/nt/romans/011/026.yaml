    rationale: 「그리하여」는 주로 결과적 연결을 나타내지만, οὕτως는 이 문맥에서 ‘이와 같이/이러한 방식으로’라는 방식을 가리킵니다.
  - severity: medium
    issue: 인용문의 종결 부호 누락 및 서술 종결 불일치
