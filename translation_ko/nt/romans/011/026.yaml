  source_fidelity: 개정이 필요합니다. 그리스어 οὕτως는 앞 문맥에서 서술된 방식·과정을 가리키므로 결과를 강조하는 「그리하여」보다 「이와 같이」가 적절합니다. 또한 ἀσεβείας는 여기서 집합적으로 쓰인 복수형이므로 「불경건을」로 옮기는 것이 자연스럽고 원문에 가깝습니다.
  naturalness: 원문의 인용문은 문장 종결과 인용 부호를 갖추어야 합니다. 「오실 것이며 … 돌이키실 것입니다」로 시제를 일관되게 하고, 「기록된 바와 같이」를 사용하면 현대 한국어의 격식 있는 성경 문체에 자연스럽습니다.
  terminology: 「구원」, 「구원자」, 「시온」, 「야곱」은 적절합니다. 「경건치 않음」은 현대 표준어 및 본문의 도덕·종교적 의미에 더 잘 맞는 「불경건」으로 고칩니다. 「온 이스라엘」은 해석을 좁히지 않는 번역으로 유지합니다.
  issues:
