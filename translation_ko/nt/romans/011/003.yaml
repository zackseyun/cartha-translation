  source_fidelity: κύριε의 직접적인 호격은 본문의 그리스어 수준에서 「주님」으로 옮기는 것이 적절합니다. 「야훼여」는 열왕기상 인용의 히브리어 배경을 반영하지만, 그리스어 본문 자체의 표현을 특정 신명으로 바꾸며, 영어 POB의 ‘Lord’와도 일치하지 않습니다. ζητοῦσιν τὴν ψυχήν μου는 생명을 빼앗으려 한다는 관용적 뜻이므로 「제 목숨을 노리고 있습니다」가 정확합니다.
  naturalness: 초안의 「제 목숨을 찾고 있습니다」는 한국어에서 목숨을 구하거나 발견한다는 뜻으로도 들려 위협의 의미가 자연스럽지 않습니다. 또한 「남았는데」의 역접·배경 연결은 원문의 단순 접속 καί보다 다소 해석적입니다. 「저만 홀로 남았고」는 원문의 강조와 연결을 자연스럽게 살립니다.
  terminology: 하나님께 드리는 직접 호칭으로 「주님」은 현대 표준어 합쇼체에서 자연스럽고, κύριε의 일반적 신약 번역어에도 부합합니다. 「예언자들」, 「제단들」, 「헐다」는 각각 προφήτας, θυσιαστήρια, κατέσκαψαν을 충실히 반영합니다.
