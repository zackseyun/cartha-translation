    issue: '''돌이킬 수 없는 것'' is semantically and stylistically imprecise in this predicate.'
    rationale: ἀμεταμέλητα denotes what is not regretted or retracted. '돌이킬 수 없는' may imply mere irreversibility and the construction with '것' is awkward with the compound subject.
