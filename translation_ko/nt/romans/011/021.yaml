  verdict: revise
  source_fidelity: The conditional-explanatory force (εἰ γάρ), the verbal parallel of ‘did not spare / will not spare,’ and the olive-tree metaphor are retained. ‘본래의 가지들’ is a workable contextual rendering of κατὰ φύσιν κλάδων, though a lexical footnote should preserve the more literal ‘according to nature.’ The Greek second-person singular is a representative address; Korean ‘여러분’ is more natural in this formal public address and does not add interpretation.
  naturalness: ‘당신’ is often confrontational, marital, or otherwise marked in contemporary Korean and is unsuitable here as a general scriptural address. ‘여러분’ is idiomatic in modern formal-polite Korean.
  terminology: ‘하나님,’ ‘가지들,’ and ‘아끼다’ are appropriate, established biblical Korean terminology. The footnote retains the lexical nuance of κατὰ φύσιν without identifying the branches interpretively.
  issues:
  - severity: medium
    issue: The draft has no Korean footnote anchor corresponding to the lexical note on κατὰ φύσιν.
    rationale: The English audit trail identifies a live lexical alternative (‘according to nature’). Retaining an anchored Korean note supports source transparency without altering the metaphor.
  - severity: low
    issue: ‘당신’ is pragmatically marked in modern Korean.
    rationale: Although it can render a singular ‘you,’ it is not the most natural unmarked public-address form in this register. ‘여러분’ communicates the representative addressee naturally.
