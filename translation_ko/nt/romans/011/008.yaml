review_pass:
  verdict: revise
  source_fidelity: 원문의 세 병렬 목적어(‘혼미한 영’, ‘보지 못하는 눈’, ‘듣지 못하는 귀’)를 모두 유지해야 합니다. 현 번역의 ‘곧’은 뒤의 눈과 귀가 ‘혼미한 영’을 풀어 설명한다는 관계를 만들므로, 원문의 병렬 구조를 흐립니다. 또한 ‘오늘까지’는 ‘오늘에 이르기까지’로 옮겨 ἕως의 지속 범위를 더 분명히 드러낼 수 있습니다.
  naturalness: ‘기록된 바와 같습니다’는 현대의 격식 있는 성경 인용 문맥에서 자연스럽습니다. 인용문은 목표 합쇼체에 맞추어 ‘주셨습니다’로 마무리하는 편이 일관됩니다.
  terminology: ‘혼미한 영’은 πνεῦμα κατανύξεως의 둔감함·혼미함이라는 의미를 무리 없이 보존합니다. ‘깊은 잠의 영’이라는 이사야 배경상의 대안은 각주로 제시할 수 있으나, 본문에는 혼미를 유지하는 것이 그리스어에 더 가깝습니다.
  issues:
  - severity: medium
    issue: ‘곧’이 원문에 없는 설명·동격 관계를 도입합니다.
    rationale: 그리스어는 ‘혼미한 영, 보지 못하는 눈, 듣지 못하는 귀’를 καί로 연결된 병렬 목적어로 제시합니다. ‘곧’을 삭제하여 이 구조를 보존해야 합니다.
  - severity: low
    issue: 인용문 종결이 합쇼체가 아닙니다.
    rationale: 번역의 명시된 목표 문체가 현대 formal-polite 합쇼체이므로 ‘주셨다’보다 ‘주셨습니다’가 적절합니다.
  revised_text: '기록된 바와 같습니다: 「하나님께서 그들에게 혼미한 영과 보지 못하는 눈과 듣지 못하는 귀를 오늘에 이르기까지 주셨습니다.」'
  revised_footnotes:
  - marker: a
    text: 또는 “깊은 잠의 영.” 이 표현은 이사야 29:10을 반영하지만, 여기의 그리스어는 둔감함 또는 혼미함을 뜻하는 단어를 사용합니다.
    reason: alternative_reading
  revision_rationale: ‘곧’을 삭제하여 원문의 병렬 구문을 회복하고, 동사의 존대 종결을 합쇼체로 통일했습니다. ‘혼미한 영’은 원문의 의미를 유지하며, 이사야 배경에 따른 대안은 각주로만 제시했습니다.
