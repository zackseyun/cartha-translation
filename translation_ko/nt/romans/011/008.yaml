source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
  footnotes:
  - marker: a
    text: Or “a spirit of deep sleep.” The phrase echoes Isaiah 29:10, though the Greek here uses a term meaning dullness or stupefaction.
    reason: alternative_reading
translation:
  language: ko
  text: '기록된 바와 같습니다: 「하나님께서 그들에게 혼미의 영[a]과 보지 못하는 눈과 듣지 못하는 귀를 오늘에 이르기까지 주셨습니다.」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “깊은 잠의 영.” 이 표현은 이사야 29장 10절을 반영하지만, 여기의 그리스어는 둔감함 또는 혼미함을 뜻하는 낱말을 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα κατανύξεως
  english_pob_choice: spirit of stupor
  chosen_korean: 혼미한 영
  alternatives_korean:
  - 깊은 잠의 영
  - 마비된 영
  lexicon: BDAG
  rationale: κατάνυξις의 마비·혼미 의미를 자연스럽게 옮긴다.
