  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
  footnotes:
  - marker: a
    text: Or “a spirit of deep sleep.” The phrase echoes Isaiah 29:10, though the Greek here uses a term meaning dullness or stupefaction.
    reason: alternative_reading
translation:
  language: ko
  text: '기록된 바와 같습니다: 「하나님께서 그들에게 혼미한 영, 곧 보지 못하는 눈과 듣지 못하는 귀를 오늘까지 주셨다.」'
  philosophy: optimal-equivalence
