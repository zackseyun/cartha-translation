  - severity: low
    issue: ‘사람’의 반복
    rationale: ‘이스라엘 사람이며’와 ‘지파에 속한 사람입니다’의 반복은 원문의 간결한 계보 진술보다 장황합니다. 병렬 서술로 다듬는 것이 자연스럽습니다.
