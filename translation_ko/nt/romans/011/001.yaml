  - 밀어내셨
  lexicon: BDAG
  rationale: ἀπωθέω의 단호한 거부 의미를 「버리다」로 옮긴다.
- source_word: σπέρματος Ἀβραάμ
  english_pob_choice: offspring of Abraham
  chosen_korean: 아브라함의 씨
  alternatives_korean:
