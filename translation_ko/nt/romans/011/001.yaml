  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐκ σπέρματος Ἀβραάμ은 아브라함에게서 이어진 혈통/후손임을 뜻하므로, 한국어에서 출생 자체를 다소 어색하게 연상시키는 ‘아브라함의 씨에서 났고’보다 ‘아브라함의 후손이고’가 더 정확하고 자연스럽습니다. 질문의 부정적 답을 예상하는 뉘앙스와 μὴ γένοιτο의 강한 부정은 각각 ‘버리셨습니까?’와 ‘결코 그렇지 않습니다!’에 적절히 보존됩니다.
  naturalness: ‘아브라함의 씨에서 났고’는 현대 표준어 문장에서는 부자연스럽고, 이어지는 ‘베냐민 지파에 속한 사람입니다’도 앞의 ‘이스라엘 사람’과 ‘사람’이 반복됩니다. 서술 구조를 평행하게 정리하면 합쇼체 문체에서 더 자연스럽습니다.
  terminology: ‘하나님’, ‘자기 백성’, ‘이스라엘 사람’, ‘베냐민 지파’는 적절합니다. σπέρμα는 여기서 비유적·계보적 의미이므로 ‘후손’이 현대 한국어에서 가장 명확합니다. 본문에 반드시 필요한 각주 사항은 없습니다.
  issues:
