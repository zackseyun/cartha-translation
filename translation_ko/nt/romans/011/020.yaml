  source_fidelity: καλῶς의 승인·동의의 응답을 “옳습니다”로, ἀπιστίᾳ와 πίστει의 대조를 각각 “믿지 않음으로”와 “믿음으로”로 적절히 옮겼습니다. ἐξεκλάσθησαν의 올리브나무 비유는 “꺾였고”로 보존되며, ἕστηκας의 현재적 상태도 “서 있습니다”로 자연스럽게 반영됩니다. 마지막 명령은 교만을 금하고 두려워하라는 원문의 대조와 긴장감을 유지합니다.
  naturalness: 현대 표준 한국어 합쇼체로 일관됩니다. “믿지 않음으로”는 다소 문어적이지만 성서 문맥에 자연스럽고, 바로 뒤의 “믿음으로”와의 어휘적 대조를 효과적으로 보존합니다. “교만한 마음을 품지 말고”도 원문의 관용적 의미를 자연스럽게 전달합니다.
  terminology: “믿음,” “교만,” “두려워하십시오”는 문맥과 한국어 성서 번역 관습에 잘 맞습니다. “두려워하십시오”는 단순한 공포나 교리적 해석으로 축소하지 않고, 원문의 경계와 경외의 긴장을 열어 둡니다.
