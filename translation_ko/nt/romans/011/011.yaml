  source_fidelity: 핵심 논지는 잘 옮겼고, πταίω와 πίπτω를 ‘실족하다/넘어지다’로 구별한 점도 적절합니다. 그러나 παράπτωμα를 ‘범죄’로 번역하면 법적 범죄나 의도적 범행의 뜻이 과도하게 강해질 수 있습니다. 여기서는 ‘허물’ 또는 ‘잘못’이 원문의 의미 범위를 더 충실히 보존합니다. 또한 τοῖς ἔθνεσιν은 복수 여격이므로 ‘이방인들에게’가 더 정확합니다.
  naturalness: ‘그러면 내가 묻습니다’는 바울의 수사적 질문 도입을 현대 한국어 합쇼체로 자연스럽게 표현합니다. ‘넘어지도록 실족한 것입니까?’는 다소 문어적이지만 본문의 의도/결과 뉘앙스와 두 동사의 대비를 유지하며 이해 가능합니다. ‘결코 그럴 수 없습니다!’는 μὴ γένοιτο의 강한 부정을 자연스럽게 전달합니다.
  terminology: ‘구원’, ‘이방인들’, ‘시기하게 하다’는 로마서 9–11장의 문맥에 적합합니다. ‘시기’는 παραζηλόω의 기본 의미를 유지하되, 단순한 악의적 질투만으로 제한되지 않을 수 있으므로 각주에서 ‘시기심을 일으키다/같은 구원을 바라게 하다’의 가능성을 밝혀 두는 것이 좋습니다.
