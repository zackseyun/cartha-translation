id: ROM.11.11
reference: Romans 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
  footnotes:
  - marker: a
    text: Or 'so that they might fall'—the Greek distinguishes 'stumble' from 'fall,' and the question expects the answer no.
    reason: lexical_alternative
  - marker: b
    text: Or 'through their transgression.'
    reason: lexical_alternative
  - marker: c
    text: Greek 'the nations'; in this context, 'Gentiles' means the non-Jewish peoples.
    reason: lexical_alternative
  - marker: d
    text: Or 'to provoke them to jealousy'; the sense may include stirring them to seek the same salvation.
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 내가 묻습니다. 그들이 넘어지도록 실족한 것입니까?[a] 결코 그럴 수 없습니다! 도리어 그들의 허물[b]로 말미암아 구원이 이방인들에게[c] 이르렀으니, 이는 그들을 시기하게 하려는 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 넘어지기 위해서’; 그리스어는 ‘실족하다’와 ‘넘어지다’를 구별하며, 이 수사적 질문은 부정적인 대답을 기대합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 잘못으로 말미암아’ 또는 ‘그들의 범함으로 말미암아’.
    reason: lexical_alternative
  - marker: c
    text: 그리스어로는 ‘민족들에게’. 이 문맥에서 ‘이방인들’은 유대인이 아닌 민족들을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들에게 시기심을 일으키려는 것입니다’. 그들이 이방인들에게 주어진 같은 구원을 바라게 하려는 뜻을 포함할 수 있습니다.
    reason: alternative_reading
