  - severity: low
    issue: τοῖς ἔθνεσιν을 단수처럼 보이는 ‘이방인에게’로 번역함
    rationale: 원문은 복수형이며, 문맥상 비유대 민족들을 가리키므로 ‘이방인들에게’가 형태와 의미를 더 잘 반영합니다.
