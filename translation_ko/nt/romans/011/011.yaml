  to: 그러면 내가 묻습니다. 그들이 넘어지도록 실족한 것입니까?[a] 결코 그럴 수 없습니다! 도리어 그들의 허물[b]로 말미암아 구원이 이방인들에게[c] 이르렀으니, 이는 그들을 시기하게 하려는 것입니다.[d]
  rationale: 원문의 수사적 질문과 ‘실족하다/넘어지다’의 어휘 대비는 유지하되, παράπτωμα의 의미를 지나치게 법죄화하지 않도록 ‘허물’로 바로잡았습니다. 복수형 ‘이방인들에게’를 사용하고, 본문에 남아 있는 어휘적·해석적 여지는 각주로 보존했습니다.
