  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: Now if their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
  footnotes:
  - marker: a
    text: Or 'their defeat' or 'their diminishment' for 'their loss.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their full number' or 'their full inclusion' for 'their fullness.'
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 그들의 범죄가 세상에 풍성함을 가져오고 그들의 손실[a]이 이방인들에게 풍성함을 가져온다면, 그들의 충만함[b]은 얼마나 더 큰 풍성함을 가져오겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘패배’ 또는 ‘감소’.
    reason: ἥττημα는 손실, 패배, 감소를 뜻할 수 있으며, 본문은 문맥상 가장 중립적인 ‘손실’을 유지합니다.
  - marker: b
    text: 또는 ‘그들의 온전한 수’ 또는 ‘그들의 완전한 포함’.
    reason: πλήρωμα는 충만함, 온전한 수, 완전한 포함 등의 뜻을 가질 수 있습니다. 본문은 논쟁된 지시 내용을 특정하지 않는 ‘충만함’을 유지합니다.
lexical_decisions:
- source_word: πλήρωμα
  english_pob_choice: fullness
  chosen_korean: 충만함
  alternatives_korean:
  - 완전함
  lexicon: BDAG
  rationale: πλήρωμα의 「가득함」 의미를 표준 신학 어휘로 옮긴다.
