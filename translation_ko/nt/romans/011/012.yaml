  to: 그런데 그들의 범죄가 세상에 풍성함을 가져오고 그들의 손실[a]이 이방인들에게 풍성함을 가져온다면, 그들의 충만함[b]은 얼마나 더 큰 풍성함을 가져오겠습니까?
  rationale: 수사 의문의 생략된 결과를 ‘더 큰 풍성함을 가져오겠습니까’로 보충하여 한국어 문장을 완결하면서도, 원문의 a fortiori 비교를 보존했습니다. ‘충만함’은 특정한 종말론적 해석을 강요하지 않도록 그대로 두었고, 손실과 충만함의 주요 어휘 대안은 해당 단어에 정확히 연결된 각주로 제시했습니다.
