  source_fidelity: οὕτως καὶ οὗτοι를 ‘이같이 이들도’로, 두 차례의 νῦν을 각각 ‘이제’로 옮겨 앞 절과의 유비 및 현재적 강조를 보존했습니다. ἠπείθησαν은 ‘불순종하게 되었으니’로, ἐλεηθῶσιν은 ‘긍휼을 받게’로 적절히 번역했습니다. τῷ ὑμετέρῳ ἐλέει도 ‘여러분에게 베푸신 긍휼로 말미암아’로 풀어, 독자들이 행한 긍휼이 아니라 독자들에게 베풀어진 하나님의 긍휼이라는 문맥상 의미를 충실히 드러냅니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, ‘이는 … 하려는 것입니다’는 ἵνα 절의 목적 관계를 명료하게 나타냅니다.
  terminology: ‘불순종’과 ‘긍휼’은 로마서 9–11장의 어휘와 신학적 논지를 안정적으로 반영합니다. ‘긍휼’의 반복도 원문의 ἔλεος/ἐλεέω 반복을 보존합니다.
