    rationale: ὑπὲρ ἐλέους는 하나님께 영광을 돌리는 이방인들이 하나님의 자비를 근거로 그렇게 한다는 뜻입니다. 한국어에서는 소유·출처를 밝혀야 의미가 안정됩니다.
