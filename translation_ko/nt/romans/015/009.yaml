  source_fidelity: 첫 절은 앞 절의 그리스도 사역에 종속된 목적/결과 절입니다. 초안의 ‘돌리게 하시려는’은 이 연결을 대체로 반영하지만, ‘자비 때문에’는 자비의 주체가 불분명합니다. 하나님께 영광을 돌리는 근거가 하나님의 자비임을 명시하는 것이 원문과 문맥에 더 충실합니다. 인용문의 ἐξομολογήσομαί와 ψαλῶ는 각각 하나님께 드리는 찬양과 그의 이름을 찬송하는 것으로 자연스럽게 구별할 수 있습니다.
  naturalness: ‘하나님의 자비로 말미암아’와 ‘당신께 찬양을 드리며, 당신의 이름을 찬송하겠습니다’는 현대 표준어 합쇼체 성경 문체에서 자연스럽습니다. ‘또한’은 앞 절에 이어지는 절임을 유지합니다.
  terminology: ἔθνη/ἔθνεσι는 바울의 논증에서는 ‘이방인들’이 적절합니다. 다만 시편 인용 자체에는 ‘민족들/열방’이라는 더 넓은 의미도 있으므로, 영어 POB 감사 기록과 일치하도록 이를 밝히는 각주를 둡니다. ἐξομολογέω는 여기서 죄의 자백이 아니라 찬양/감사의 뜻이므로 ‘찬양을 드리다’가 적절합니다.
