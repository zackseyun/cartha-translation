  verdict: revise
  source_fidelity: The draft accurately renders the moral obligation (ὀφείλομεν), the strong/weak contrast, bearing the weaknesses of others, and the prohibition against self-pleasing. The coordinated Korean obligation and prohibition appropriately reflect the two Greek infinitives governed by ὀφείλομεν.
  naturalness: ‘강한 우리는’ is understandable but marked and less natural in modern Korean prose. ‘강한 사람들인 우리는’ preserves the emphatic identification while reading more smoothly. ‘자기 자신을’ is needlessly heavy here; ‘자신을’ is natural and retains the reflexive meaning.
  terminology: ‘강한/약한’ and ‘약함’ preserve the source’s deliberate related terminology and its connection with the preceding context. ‘짊어져야 하며’ suitably conveys βαστάζειν as more than mere tolerance. No footnote is required in Korean for this concise verse, since the text itself does not require importing the contextual explanation.
  issues:
  - severity: low
    issue: Marked Korean word order in ‘강한 우리는’
    rationale: Although intelligible, this construction is less idiomatic than a phrasing that identifies ‘we’ as the strong people.
  - severity: low
    issue: Overly heavy reflexive phrase ‘자기 자신을’
    rationale: Modern formal Korean normally uses ‘자신을’ in this context without loss of reflexive force.
  revised_text: 강한 사람들인 우리는 약한 사람들의 약함을 짊어져야 하며, 자신을 기쁘게 하려 해서는 안 됩니다.
