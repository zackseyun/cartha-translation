  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it, and they are indebted to them. For if the Gentiles have shared in their spiritual things, they also owe it to minister to them in material things.
translation:
  language: ko
  text: 그들이 기꺼이 그렇게 하였고, 또한 그들에게 빚을 지고 있습니다. 이방인들이 그들의 영적인 것들을 함께 누렸다면, 또한 물질적인 것으로 그들을 섬겨야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφειλέται
  english_pob_choice: indebted
  chosen_korean: 빚진 자
  lexicon: BDAG
  rationale: 명사. 「빚진 자」가 직역.
- source_word: τοῖς πνευματικοῖς
  english_pob_choice: spiritual things
  chosen_korean: 영적인 것들
  lexicon: BDAG
  rationale: 직역.
- source_word: ἐκοινώνησαν
  english_pob_choice: have shared in
  chosen_korean: 동참하다
  alternatives_korean:
  - 함께 나누다
  lexicon: BDAG
  rationale: 15:26의 κοινωνία와 동족어. 「동참」.
- source_word: ἐν τοῖς σαρκικοῖς λειτουργῆσαι
  english_pob_choice: to minister ... in material things
  chosen_korean: 물질적인 것들로 섬기다
  alternatives_korean:
  - 육적인 것들로 봉사하다
  lexicon: BDAG
  rationale: σαρκικός는 여기서 「물질적」이라는 함의. λειτουργέω는 공적 섬김.
