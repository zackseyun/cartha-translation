revisions:
- from: 그들이 기꺼이 결정한 것이며, 또한 그들에게 빚진 자들이기도 합니다. 이방인들이 그들의 영적인 것들에 동참하였다면, 물질적인 것들로 그들을 섬겨야 마땅하기 때문입니다.
  to: 그들이 기꺼이 그렇게 하였고, 또한 그들에게 빚을 지고 있습니다. 이방인들이 그들의 영적인 것들을 함께 누렸다면, 또한 물질적인 것으로 그들을 섬겨야 합니다.
  rationale: 첫 절을 εὐδοκέω의 의미에 맞게 ‘기꺼이 그렇게 하였다’로 바로잡았습니다. ‘그렇게’는 직전 절에 언급된 연보를 자연스럽게 지시하며, 본절에 없는 내용을 구체적으로 삽입하지 않습니다. 이어지는 두 절의 ‘그들’은 문맥상 예루살렘 성도들을 가리키는 대명사 관계를 보존했습니다.
