review_pass:
  verdict: revise
  source_fidelity: 첫 절의 εὐδόκησαν은 ‘결정하다’가 아니라 기꺼이 하다/좋게 여기다라는 뜻입니다. 또한 ὀφείλουσιν은 현재의 의무를 나타내므로 ‘섬겨야 합니다’가 적절합니다. 수정문은 이방인들이 예루살렘 성도들에게 영적인 것들을 함께 누렸으므로 물질적인 것으로 섬길 의무가 있다는 대조를 보존합니다.
  naturalness: ‘그들이 기꺼이 결정한 것이며’는 한국어로도 부자연스럽고 원문의 행위를 ‘결정’으로 바꿉니다. ‘그들이 기꺼이 그렇게 하였고’와 ‘영적인 것들을 함께 누렸다면’은 문맥상 선행절의 헌금을 자연스럽게 가리키면서도 본문의 표현을 과도하게 보충하지 않습니다.
  terminology: πνευματικοῖς와 σαρκικοῖς의 대조는 각각 ‘영적인 것들’과 ‘물질적인 것’으로 유지했습니다. λειτουργῆσαι는 성직 직분에 한정되지 않는 지원의 섬김을 나타내므로 ‘섬기다’가 적절합니다.
  issues:
  - severity: high
    issue: ‘기꺼이 결정한 것’
    rationale: εὐδόκησαν은 ‘기꺼이 하였다/좋게 여겼다’이지 ‘결정하였다’가 아닙니다. 원문이 가리키는 자발적인 실행을 결정 행위로 변경합니다.
  - severity: low
    issue: 의무 표현의 명시
    rationale: ὀφείλουσιν의 현재형 ‘의무가 있다/빚지고 있다’를 한국어에서 분명히 드러내기 위해 ‘섬겨야 합니다’로 옮기는 것이 좋습니다.
