source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: Now I urge you, brothers, through our Lord Jesus Messiah and through the love of the Spirit, to strive together with me in prayers to God for me,
translation:
  language: ko
  text: 형제 여러분[b], 우리 주 예수 메시아[a]를 통하여, 또 성령의 사랑[c]을 통하여 여러분에게 권합니다. 나를 위하여 하나님께 드리는 기도로 나와 함께 힘써 싸워 주시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리스도’. 그리스어 ‘크리스토스’는 ‘기름부음 받은 이’, 곧 ‘메시아’를 뜻하는 칭호입니다.
    reason: alternative_reading
  - marker: b
    text: ‘형제’는 그리스어에서 문법적으로 남성형이며, 형제자매를 포함한 믿는 공동체 전체에게 하는 호칭일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성령께서 주시는 사랑’ 또는 ‘성령을 향한 사랑’. 그리스어 속격은 둘 이상의 의미로 이해될 수 있습니다.
    reason: alternative_reading
