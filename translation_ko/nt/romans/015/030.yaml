  lexicon: BDAG
  rationale: 15:19와 동일한 정책. πνεῦμα가 단순 표기일 때 「영」으로.
- source_word: συναγωνίσασθαί
  english_pob_choice: to strive together
  chosen_korean: 함께 힘써 싸우다
