  source_fidelity: 그리스어의 축복/기원형 무동사 구문을 한국어의 자연스러운 기원 표현인 “계시기를 빕니다”로 옮겼습니다. “평화의 하나님”, “여러분 모두와 함께”, “아멘”은 각각 θεὸς τῆς εἰρήνης, μετὰ πάντων ὑμῶν, ἀμήν에 충실합니다. 약한 연결사 δέ는 한국어 종결 축복문에서 별도 어휘로 반드시 드러낼 필요가 없습니다.
  naturalness: “평화의 하나님께서 여러분 모두와 함께 계시기를 빕니다. 아멘.”은 현대 표준 한국어의 격식 있는 합쇼체이며, 서신 종결 축복문으로 자연스럽습니다.
  terminology: “평화의 하나님”은 바울 서신의 칭호를 투명하게 보존합니다. 전통적 대안인 “평강의 하나님”도 가능하지만, 현행 표현은 현대어로 자연스럽고 의미상 손실이 없습니다. “아멘”도 한국어 예배·성경 용례에 맞습니다.
