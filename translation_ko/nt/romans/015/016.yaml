revisions:
- from: 곧 내가 이방인들을 위한 메시아 예수의 사역자[a]가 되어 하나님의 복음을 위해 제사장의 직무를 수행하게 하시려는 것입니다. 그리하여 이방인들이라는 제물이 성령으로 거룩하게 되어 받아들여지게 하려는 것입니다.
  to: 곧 내가 이방인들을 섬기는 메시아 예수의 사역자가 되어[a], 제사장으로서 하나님의 복음을 섬기며[b], 이방인들의 제물이[c] 성령으로 거룩하게 되어 하나님께 받아들여질 만한 제물이 되도록 하려는 것입니다[d].
  rationale: 개정문은 λειτουργός와 ἱερουργέω 및 προσφορά가 함께 이루는 제사장적 비유를 유지하면서도, 바울이 후대의 제도적 직분을 주장한다고 덧붙이지 않습니다. ‘이방인들의 제물’은 원문의 속격 구조를 보존하고, 가장 유력한 해석과 대안은 각주로 제시했습니다. 수신자는 제사의 맥락상 암시되지만 원문에 명시되지 않았으므로 ‘하나님께’는 ‘받아들여질 만한’의 문맥적 수신자를 밝혀 주는 최소한의 보충입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:37:11Z'
