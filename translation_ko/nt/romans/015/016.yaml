  source_fidelity: 개정이 필요합니다. 초안의 ‘하나님의 복음을 위해’는 ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ에서 복음이 제사장적 섬김의 직접 목적어인 점을 충분히 반영하지 못합니다. 또한 προσφορὰ τῶν ἐθνῶν의 속격이 지닌 해석상 여지를 본문에서 단정적으로 ‘이방인들이라는 제물’로 고정하기보다, 자연스러운 표현 안에서 보존하고 각주로 설명하는 편이 적절합니다.
  naturalness: ‘이방인들을 위한 메시아 예수의 사역자’와 ‘제사장의 직무를 수행하게 하시려는 것입니다’는 다소 무겁고, 절 안에서 목적 표현이 반복됩니다. ‘이방인들을 섬기는 메시아 예수의 사역자가 되어’ 및 ‘제사장으로서 하나님의 복음을 섬기며’가 현대 표준어의 격식 있는 성경 문체로 더 자연스럽습니다.
  terminology: ‘메시아 예수’, ‘사역자’, ‘하나님의 복음’, ‘성령’은 유지할 수 있습니다. ἱερουργέω의 제사장적 비유는 ‘제사장으로서’로 보존해야 하며, ‘성령으로’에는 ‘성령 안에서’라는 가능한 대안을 각주로 남기는 것이 좋습니다.
