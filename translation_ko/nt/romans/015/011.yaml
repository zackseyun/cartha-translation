id: ROM.15.11
reference: Romans 15:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: "Praise the Lord, all the nations, and let all the peoples praise him."'
translation:
  language: ko
  text: 또 이렇게 말합니다. 「모든 민족[a]아, 주[b]를 찬양하십시오. 모든 백성이 그를 찬양하게 하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 이방인”. 그리스어 ἔθνη는 “민족들” 또는 “이방인들”을 뜻할 수 있습니다. 여기서는 인용문의 보편적 호소를 따라 “민족”으로 옮겼지만, 바울의 이방인 포함 논증과도 관련됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “여호와”. 이 인용의 히브리어 시편 본문은 하나님의 이름을 사용하며, 그리스어 성경에서는 이를 κύριος(“주”)로 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Αἰνεῖτε
  english_pob_choice: Praise
  chosen_korean: 찬양하다
  lexicon: BDAG
  rationale: 시편 117:1 인용.
- source_word: πάντα τὰ ἔθνη
  english_pob_choice: all the nations
  chosen_korean: 모든 이방인들
  alternatives_korean:
  - 모든 열방
  - 모든 민족들
  lexicon: BDAG
  rationale: 15:9-10의 「이방인들」과 일관 보존. 인용에서도 같은 어휘 유지.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주
  lexicon: BDAG
  rationale: 시편 인용에서 κύριος. 정책에 따라 「주」.
- source_word: ἐπαινεσάτωσαν
  english_pob_choice: let ... praise
  chosen_korean: 찬송하라
  alternatives_korean:
  - 찬미하라
  lexicon: BDAG
  rationale: 3인칭 명령형. Αἰνεῖτε(찬양)와 어휘 변주.
- source_word: πάντες οἱ λαοί
  english_pob_choice: all the peoples
  chosen_korean: 모든 민족들
  alternatives_korean:
  - 모든 백성들
  lexicon: BDAG
  rationale: λαός는 본래 「백성」이나, 시편 평행 인용에서 「민족들」이 자연스럽다.
