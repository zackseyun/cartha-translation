review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. πάντα τὰ ἔθνη와 πάντες οἱ λαοί는 의도적으로 구별되어 있으므로, 첫 표현을 문맥적 해석인 ‘이방인들’로 확정하면 원문의 보편적 호소와 영어 POB의 주 선택어 ‘nations’를 좁힙니다. ‘민족들’과 ‘백성들’로 구별하는 것이 더 충실합니다. 또한 ἐπαινεσάτωσαν의 3인칭 명령의 청유적 뉘앙스는 한국어에서 ‘찬양하게 하십시오’로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘또 이렇게 말씀하십니다’는 인용을 도입하는 주체가 본문에 명시되지 않아 다소 부자연스럽습니다. ‘또다시 말합니다’가 καὶ πάλιν을 간결하게 반영합니다. 인용문은 현대 합쇼체에 맞추어 ‘찬양하십시오’와 ‘찬양하게 하십시오’로 다듬었습니다.
  terminology: κύριον은 ‘주’로 유지합니다. αὐτόν은 ‘그분’으로 받아 선행하는 ‘주’를 자연스럽게 가리키게 했습니다. ἔθνη의 ‘이방인들’ 및 히브리어 시편 배경의 ‘여호와’는 본문이 아니라 각주에서 대안으로 보존합니다.
  issues:
  - severity: medium
    issue: ‘모든 이방인들’이 πάντα τὰ ἔθνη의 본문 번역으로 채택됨
    rationale: ἔθνη는 문맥상 이방인을 포함할 수 있지만, 이 시편 인용에서는 모든 나라/민족을 향한 보편적 부름입니다. ‘모든 민족들’을 본문으로 하고 ‘모든 이방인들’을 각주 대안으로 두는 편이 원문의 범위를 보존합니다.
  - severity: low
    issue: ἔθνη와 λαοί의 어휘적 구별이 약화됨
    rationale: 초안은 ‘이방인들/민족들’로 옮겨 대조의 방향을 바꿉니다. ‘민족들/백성들’은 원문의 병행 구조와 서로 다른 명사를 더 투명하게 반영합니다.
  - severity: low
    issue: 인용 도입부와 3인칭 명령 표현의 현대 합쇼체 조정 필요
    rationale: ‘또 이렇게 말씀하십니다’에는 원문에 없는 발화 주체가 암시됩니다. 또한 ἐπαινεσάτωσαν은 3인칭 명령이므로 ‘찬양하게 하십시오’가 이를 자연스럽게 드러냅니다.
  revised_text: 또다시 말합니다. “모든 민족들아, 주를 찬양하십시오. 모든 백성은 그분을 찬양하게 하십시오.”
  revised_footnotes:
  - marker: a
    text: 또는 “모든 이방인들아.” 그리스어 에트네(ἔθνη)는 ‘민족들’ 또는 ‘이방인들’을 뜻할 수 있습니다. 여기서는 모든 민족을 향한 보편적 부름이면서, 바울의 이방인 논증에도 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “주님” 또는 “여호와.” 이 인용의 히브리어 시편 원문에서는 하나님의 이름을 사용하며, 그리스어에서는 이를 퀴리오스(κύριος, ‘주’)로 옮깁니다.
    reason: alternative_reading
  revision_rationale: 원문의 어휘 구별(ἔθνη/λαοί)과 명령 방식(2인칭 명령/3인칭 명령)을 보존하면서, 현대 한국어 합쇼체로 자연스럽게 다듬었습니다. 문맥적 해석인 ‘이방인들’과 히브리어 원문에 따른 하나님의 이름 표기는 각주로 보존했습니다.
