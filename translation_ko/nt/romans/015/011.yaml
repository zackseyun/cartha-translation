  verdict: revise
  source_fidelity: 개정이 필요합니다. πάντα τὰ ἔθνη는 이 인용문의 보편적 예배 요청에서는 기본적으로 ‘모든 민족’으로 옮기는 것이 적절하며, 바울의 문맥상 가능한 ‘이방인’은 각주로 보존하는 편이 원문의 폭을 더 잘 살립니다. 또한 πάντες οἱ λαοί는 앞의 ἔθνη와 구별하여 ‘모든 백성’으로 옮겼습니다. ἐπαινεσάτωσαν의 3인칭 명령/권고의 힘은 ‘찬양하게 하십시오’로 반영했습니다.
  naturalness: ‘또 이렇게 말씀하십니다’는 원문에 없는 높임의 발화 주체를 암시하고, 현대 합쇼체 문장으로도 다소 부자연스럽습니다. ‘또 이렇게 말합니다’가 καὶ πάλιν의 인용 도입을 간결하고 자연스럽게 반영합니다. 호격 ‘모든 민족아’와 ‘모든 백성이 … 찬양하게 하십시오’는 시적 인용의 병행을 유지하면서 현대적 존대 명령 표현을 사용합니다.
  terminology: κύριος는 본문에서 일관되게 ‘주’로 유지합니다. 이 구절의 히브리어 시편 배경에서 신명을 반영하는 ‘여호와’는 본문이 아니라 각주의 대안으로 제시합니다. ‘찬양’은 Αἰνεῖτε 및 ἐπαινεσάτωσαν에 적합하며, 한국어에서 불필요한 어휘 변주를 강제하지 않습니다.
