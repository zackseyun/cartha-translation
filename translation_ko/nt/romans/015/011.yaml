  - severity: low
    issue: ἔθνη와 λαοί를 모두 ‘민족들’로 옮겨 원문의 어휘적 병행·구별이 사라집니다.
    rationale: 앞은 ‘민족’, 뒤는 ‘백성’으로 옮기면 두 복수 집단 표현의 구별을 자연스럽게 유지할 수 있습니다.
