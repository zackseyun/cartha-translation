  naturalness: “기록된 바와 같습니다” and a formal-polite future within the citation are natural in modern formal Korean. “알림을 받지 못한 이들” clearly expresses the passive sense without awkwardly treating persons as the thing that was announced.
  terminology: The pronoun is retained as “그,” without interpretive expansion. “깨달을 것입니다” is a suitable rendering of συνήσουσιν in this prophetic citation. Footnote markers are placed at the relevant quoted wording and follow the supplied audit trail.
  issues:
  - severity: medium
    issue: “도리어” for ἀλλά
    rationale: “도리어” commonly signals correction or reversal (“rather”), whereas the Greek here introduces a contrast with the preceding ministry statement. “그러나” is the safer equivalent.
  - severity: medium
    issue: The first and second clauses both use hearing language
    rationale: “그에 관하여 들은 적이 없는” obscures the lexical and syntactic distinction between passive ἀνηγγέλη (“were told/was announced”) and perfect ἀκηκόασιν (“have heard”).
  - severity: low
    issue: The citation uses plain-style future endings despite the requested 합쇼체 register
    rationale: Using “볼 것입니다/깨달을 것입니다” maintains a consistent modern formal-polite presentation.
