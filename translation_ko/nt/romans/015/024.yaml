revisions:
- from: 내가 스페인[a]으로 갈 때에 그렇게 하기를 원합니다. 지나는 길에 여러분을 만나보고, 여러분과 잠시 함께 누린 후에 여러분의 도움으로 그곳까지 전송받기를 소망하기 때문입니다.
  to: 내가 스페인으로 갈 때에는, 지나는 길에 여러분을 만나 보고, 먼저 여러분과 함께하며 어느 정도 만족을 얻은 뒤에 여러분의 도움을 받아 그곳으로 떠나기를 바랍니다.
  rationale: 원문에 없는 「그렇게」를 제거하고, ἐλπίζω에 연결된 ‘만나 보다’와 ‘도움을 받아 떠나다’를 명시했습니다. προπέμπω의 여행 지원 의미는 과도하게 지원 형태를 특정하지 않는 「도움을 받아 … 떠나다」로 옮겼습니다. ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ는 먼저 로마 신자들과의 교제에서 제한된 만족을 얻는다는 뜻으로 번역했습니다. 한국어 문장에서는 조건절을 ‘… 얻은 뒤에’로 자연스럽게 연결했으나, 이 표현은 본문이 명시하는 우선성과 제한성을 보존하며 별도의 신학적 해석을 더하지 않습니다. 불필요한 정책성 지명 각주는 삭제했습니다.
