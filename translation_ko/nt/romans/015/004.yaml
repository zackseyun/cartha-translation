  source_fidelity: 첫 문장은 προεγράφη와 ἐγράφη의 반복 및 εἰς τὴν ἡμετέραν διδασκαλίαν의 목적을 대체로 잘 반영합니다. 그러나 둘째 문장의 ‘가지게 하려는 것입니다’는 목적절을 독립적인 설명문으로 처리하여, 앞의 ‘기록되었습니다’에 걸리는 ἵνα 목적 구문이 다소 흐려집니다. 목적을 ‘기록되었습니다’에 직접 연결하는 편이 원문에 더 충실합니다.
  naturalness: ‘우리의 교훈을 위하여’도 이해 가능하나, 현대 표준어 합쇼체에서는 ‘우리를 가르치기 위하여’가 διδασκαλία의 의미를 더 자연스럽고 명료하게 전달합니다. ‘성경의 인내와 위로’는 다소 압축된 표현이나, 원문의 속격 결합이 지닌 범위를 불필요하게 해석하지 않고 보존합니다.
  terminology: ‘성경’, ‘인내’, ‘위로’, ‘소망’은 적절한 성경적·현대 표준어 용어입니다. παράκλησις의 ‘위로’는 가능한 의미이며 영어 감사 기록의 lexical alternative와도 일치합니다.
  issues:
