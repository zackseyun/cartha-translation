- from: 미리 기록된 모든 것은 우리의 교훈을 위하여 기록된 것이기 때문입니다. 성경의 인내와 위로를 통하여 우리가 소망을 가지게 하려는 것입니다.
  to: 무엇이든지 미리 기록된 것은 우리를 가르치기 위하여 기록되었습니다. 이는 우리가 성경의 인내와 위로를 통하여 소망을 가지게 하려는 것입니다.
  rationale: ὅσα의 포괄성을 ‘무엇이든지’로, προεγράφη와 ἐγράφη의 반복을 ‘미리 기록된 것’과 ‘기록되었습니다’로 보존했습니다. 목적 관계는 ‘이는’으로 앞 문장의 기록 목적에 연결했습니다. ‘성경의 인내와 위로’는 성경이 제공하거나 성경과 관련된 인내와 위로라는 원문의 압축성과 가능한 범위를 유지하며, ‘위로’는 παράκλησις의 정당한 문맥상 번역입니다.
