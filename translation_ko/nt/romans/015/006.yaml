- from: 그리하여 한마음으로 한 입으로 우리 주 예수 메시아의 하나님이시며 아버지이신 분께 영광을 돌리게 하려는 것입니다.
  to: 그리하여 여러분이 한마음과 한 입으로 우리 주 예수 메시아의 하나님이시며 아버지이신 분께 영광을 돌리게 하려는 것입니다.
  rationale: 'The revision preserves the Greek purpose relation, makes the implicit plural addressees explicit as required by natural Korean syntax, and improves the coordination of the two unity expressions. No footnote is necessary: the Korean wording directly retains the source imagery and the translated messianic title.'
