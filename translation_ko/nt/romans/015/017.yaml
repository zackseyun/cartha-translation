  - marker: b
    text: 그리스어 ‘그리스도 예수’; 여기서 그리스도(Χριστός)는 칭호이므로 ‘메시아’로 옮겼습니다.
    reason: Χριστός의 칭호적 의미와 대안적 전통 표기를 드러냅니다.
  - marker: c
    text: 또는 ‘하나님에 관한 일에 관하여’, ‘하나님과 관련된 일에 관하여’.
    reason: τὰ πρὸς τὸν θεόν은 하나님과 관련된 일들을 폭넓게 가리키는 관용 표현입니다.
