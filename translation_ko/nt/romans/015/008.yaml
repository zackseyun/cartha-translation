  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth, in order to confirm the promises to the fathers,
translation:
  language: ko
  text: 내가 말합니다. 메시아께서 하나님의 진리[a]를 위하여 할례받은 이들을 섬기는 이가 되셨습니다. 이는 조상들에게 하신 약속들을 확증하시기 위한 것이며,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 진실하심.” 여기서는 하나님께서 언약의 약속을 지키시는 신실하심을 강조할 수 있습니다.
    reason: ἀλήθεια θεοῦ는 ‘하나님의 진리’와 ‘하나님의 진실하심/신실하심’으로 이해될 수 있으며, 뒤따르는 조상들에게 하신 약속의 확증 문맥이 후자의 뉘앙스를 강하게 뒷받침합니다.
lexical_decisions:
- source_word: διάκονον
  english_pob_choice: a servant
  chosen_korean: 일꾼
  alternatives_korean:
  - 봉사자
  - 사역자
  lexicon: BDAG
  rationale: 본 문맥의 διάκονος는 메시아의 봉사 역할을 가리키므로 교회 직제 「집사」가 아니다. 「일꾼」으로 옮긴다. 13:4와 어휘 일관.
- source_word: περιτομῆς
  english_pob_choice: to the circumcised
  chosen_korean: 할례받은 자들의
  alternatives_korean:
  - 할례자의
  lexicon: BDAG
  rationale: 추상명사로 할례받은 집단(유대인)을 가리킴. 한국어 「할례받은 자들」.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  english_pob_choice: for the sake of God's truth
  chosen_korean: 하나님의 진리를 위하여
  lexicon: BDAG
  rationale: 직역.
- source_word: βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων
  english_pob_choice: confirm the promises to the fathers
  chosen_korean: 조상들에게 주신 약속들을 확증하시다
  alternatives_korean:
  - 조상들에게 한 약속들을 굳건히 하시다
  lexicon: BDAG
  rationale: 속격이 「~에게 주신」 의미로 자연스러움.
