  lexicon: BDAG
  rationale: σφραγίζω는 봉인하여 정당성을 보증함. 「확실히 전하다」로 한국어 자연스러움.
- source_word: εἰς Σπανίαν
  english_pob_choice: to Spain
  chosen_korean: 스페인으로
  lexicon: BDAG
  rationale: 15:24와 일관.
