  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore, when I have completed this and have sealed this fruit to them, I will go on by way of you to Spain.
translation:
  language: ko
  text: 그러므로 내가 이 일을 마치고 이 열매를 그들에게 봉인하여 전달한 뒤에, 여러분을 거쳐 스페인으로 가겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 열매를 그들에게 봉인한 뒤에’입니다. 여기서 ‘열매’는 이방인 신자들이 예루살렘의 성도들을 위해 모은 헌금을 가리키며, ‘봉인하다’는 그 헌금이 수령인들에게 안전하게 전달되거나 공식적으로 확정됨을 뜻할 수 있습니다.
    reason: σφραγίζω의 비유를 보존하면서, 문맥상 가능한 ‘안전한 전달/공식적 확정’의 의미와 ‘열매’의 지시 대상을 설명합니다.
