  lexicon: BDAG
  rationale: 부정 과거 분사.
- source_word: σφραγισάμενος ... τὸν καρπὸν τοῦτον
  english_pob_choice: have sealed this fruit
  chosen_korean: 이 열매를 확실히 전하다
  alternatives_korean:
