review_pass:
  verdict: revise
  source_fidelity: ‘이 일을 마치고’는 τοῦτο ... ἐπιτελέσας를 적절히 옮기며, ‘이 열매를 그들에게 확실히 전달한’은 예루살렘 성도들을 위한 헌금을 확정하여 전달한다는 σφραγισάμενος의 문맥적 의미를 자연스럽게 반영합니다. ‘여러분을 거쳐’는 δι’ ὑμῶν의 경유 의미를 보존합니다. 다만 미래 직설법 ἀπελεύσομαι에는 단순한 의향 표현인 ‘가려고 합니다’보다 미래 사실을 나타내는 표현이 더 충실합니다.
  naturalness: 문장은 현대 표준어 합쇼체로 자연스럽습니다. ‘갈 것입니다’가 바울의 미래 계획을 더 직접적이고 자연스럽게 나타냅니다.
  terminology: ‘열매’는 τὸν καρπὸν τοῦτον의 은유를 보존합니다. ‘확실히 전달한’은 ‘봉인한’의 문자적 이미지를 본문에서 다소 해석하지만, 문맥상 안전한 표현입니다. 해당 어휘의 문자적 표현과 가능한 의미는 각주로 밝혀 두는 것이 바람직합니다.
  issues:
  - severity: medium
    issue: 미래 동사 ἀπελεύσομαι가 ‘가려고 합니다’로 옮겨짐
    rationale: ἀπελεύσομαι는 미래 직설법으로, 단순한 의도나 계획만을 뜻하는 ‘가려고 합니다’보다 ‘갈 것입니다’가 문법적 시간성과 진술의 강도를 더 잘 보존합니다.
  revised_text: 그러므로 내가 이 일을 마치고 이 열매를 그들에게 확실히 전달한 뒤에, 여러분을 거쳐 스페인으로 갈 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘이 열매를 그들에게 봉인한’입니다. 여기서 ‘봉인하다’는 그 헌금이 수령자들에게 확실히 돌아가도록 보증하거나 정식으로 넘기는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 열매’는 이방 신자들이 예루살렘의 성도들을 위해 모은 헌금을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘여러분을 통하여’. 바울은 로마를 경유하여 스페인으로 갈 계획을 말합니다.
    reason: lexical_alternative
  revision_rationale: 미래 직설법을 ‘갈 것입니다’로 수정하여 원문의 문법적 의미를 반영했습니다. 본문은 의미를 바꾸지 않고 유지했으며, ‘봉인하다’의 은유와 ‘여러분을 거쳐’의 경유 의미는 각주에서 명시했습니다.
