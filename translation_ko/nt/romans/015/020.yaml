  lexicon: BDAG
  rationale: 수동태의 자연스러운 한국어 번역.
- source_word: ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  english_pob_choice: build on another's foundation
  chosen_korean: 남의 터 위에 세우다
  lexicon: BDAG
  rationale: 직역. 「터」가 정형.
