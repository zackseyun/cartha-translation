    issue: 「세우지 않기」의 목적어와 건축 비유가 불분명합니다.
    rationale: οἰκοδομῶ는 「기초 위에 건축하다」라는 명시적 건축 비유입니다. 「건축하지 않기」로 옮기면 원문의 비유와 한국어 결합이 자연스럽습니다.
  - severity: low
    issue: 「일컬어진 곳이 아닌 데에서」가 현대 한국어에서 부자연스럽습니다.
    rationale: 원문의 οὐχ ὅπου(이미 그리스도가 불린 곳에서는 아닌)를 「이미 불린 곳에서는」으로 표현하면 부정의 범위와 수동태를 자연스럽게 유지합니다.
