base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
  footnotes:
  - marker: a
    text: Or “our injustice demonstrates God’s justice.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 우리의 불의가 하나님의 의[a]를 드러낸다면, 우리는 무엇이라고 말해야 하겠습니까? 진노를 내리시는 하나님께서 불의하십니까? (나는 인간적인 관점에서 말씀드리는 것입니다.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리의 불의가 하나님의 공의를 드러낸다면.”
    reason: δικαιοσύνη은 문맥상 ‘의’ 외에 ‘공의’로도 옮길 수 있는 어휘 대안이다.
lexical_decisions:
- source_word: συνίστησιν
