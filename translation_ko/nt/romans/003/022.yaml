translation:
  language: ko
  text: 그러나 하나님의 의[a]는 예수 메시아에 대한 믿음[b]을 통하여 믿는 모든 사람에게 미칩니다. 차별이 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 정의’.
    reason: lexical_alternative
  - marker: b
