  source_fidelity: 그리스어의 수사적 질문, ἐξεκλείσθη의 수동 표현, διὰ νόμου의 ‘~을/를 통해’라는 매개 의미, 그리고 ‘행위’와 ‘믿음’의 대조를 충실히 반영합니다. τῶν ἔργων의 생략된 νόμου를 ‘행위의 법’으로 보충한 것은 앞선 질문의 명사를 자연스럽게 이어 주며 의미를 추가하지 않습니다.
