  terminology: νόμος를 일관되게 ‘법’으로 옮겨 ‘행위의 법’과 ‘믿음의 법’의 병행을 보존했습니다. 본문 자체가 의도적으로 사용하는 표현을 유지하므로 ‘원리’나 ‘율법’으로 해석적으로 좁히지 않은 점이 적절합니다.
