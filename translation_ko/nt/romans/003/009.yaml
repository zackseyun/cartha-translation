- from: 그러면 무엇입니까? 우리는 더 낫습니까? 결코 그렇지 않습니다. 왜냐하면 우리는 유대인이나 헬라인이나 모두가 죄 아래 있다고 이미 고발했기 때문입니다.
  to: 그러면 어떻습니까? 우리가 더 낫습니까?[a] 결코 그렇지 않습니다. 우리는 이미 유대인과 헬라인이 모두 죄 아래에 있다고 고발했기 때문입니다.[b]
  rationale: 논증적 전환을 자연스러운 현대 한국어로 다듬고, 민족 집단의 병렬과 ‘모두’의 범위를 원문에 맞게 명료화했습니다. 본문은 ‘죄 아래’라는 은유를 그대로 보존했으며, 논쟁적인 첫 질문과 은유의 해석적 확장은 각주에 남겼습니다.
