  source_fidelity: 그리스어의 논증적 현재형 λογιζόμεθα와 γάρ의 설명적 연결을 직접적으로 드러내는 편이 좋습니다. 현 초안의 ‘이는 … 때문입니다’도 문맥상 가능하지만, 본문 자체에서는 ‘우리는 … 결론짓습니다’가 원문의 발화 구조를 더 충실히 반영합니다. ‘율법의 행위’와 ‘믿음으로’는 원문에 충실합니다.
  naturalness: ‘이는 우리가 … 결론짓기 때문입니다’는 앞 절에 종속되는 설명문처럼 들리고, 단독 절로는 다소 무겁습니다. 현대 한국어 합쇼체로는 ‘우리는 … 결론짓습니다’가 자연스럽습니다. ‘율법의 행위와는 별개로’보다 ‘율법의 행위와 관계없이’가 사람의 의롭다 함과 행위의 배제를 더 매끄럽게 연결합니다.
  terminology: δικαιοῦσθαι는 바울 서신의 관용적 신학 용어인 ‘의롭다 하심을 받다’로 유지합니다. 이는 ‘의롭다고 선언되다’라는 설명적 대안을 각주로 제시할 수 있으나, 본문에서 그 해석적 표현으로 대체하지 않습니다. ἄνθρωπον은 성별 특정이 없는 일반적 용법이므로 ‘사람’이 적절합니다.
