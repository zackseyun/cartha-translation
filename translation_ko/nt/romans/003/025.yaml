- from: 하나님께서는 그분을 속죄소[a]로, 곧 그분의 피 안에서 믿음을 통하여 세워 두셨습니다. 이는 하나님의 의를 드러내시려는 것이었으니, 그분의 인내하심 가운데 이전에 지은 죄들을 간과해 두셨기 때문입니다.
  to: 하나님께서는 오래 참으시는 가운데 전에 지은 죄들을 그냥 넘겨 두신 것 때문에 자신의 의[c]를 나타내시려고, 그분을 그분의 피를 믿음으로[b] 받는 속죄제물[a]로 공개적으로 내세우셨습니다.
  rationale: 수정문은 προέθετο의 공적 제시 의미를 「공개적으로 내세우셨습니다」로 반영하고, ἱλαστήριον의 논쟁된 의미를 본문에서는 영어 POB의 기본 선택에 맞춘 「속죄제물」로, 각주에서는 「화목제물」 및 「속죄소/속죄의 자리」로 보존합니다. πίστις와 ‘그분의 피’의 결속은 자연스러운 한국어 본문으로 옮기되 대안적 구문을 각주에 남겼습니다. πάρεσις는 완전한 용서와 구별되는 유보적 ‘넘김’을 「그냥 넘겨 두심」으로 유지했습니다.
  reviewer_model: gpt-5.6-terra
