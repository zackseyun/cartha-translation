review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes Paul's emphatic repudiation and the Psalm citation, but it does not adequately convey the imperative force of γινέσθω and it omits the significant alternative construal of ἐν τῷ κρίνεσθαί σε.
  naturalness: The draft mixes non-합쇼체 forms ("없다," "거짓되다 하자") with elevated archaic quotation style ("이기시리이다"). "모든 사람은 거짓되다 하자" is not natural Korean and can suggest that people should become false. A modern formal-polite rendering should use consistent 합쇼체 and a more idiomatic expression for the true/liar contrast.
  terminology: '"참되시다" and "의롭다 하심을 받다" are suitable. ψεύστης should be rendered "거짓말쟁이," not the adjective "거짓되다," since the Greek is a noun. The judicial sense of δικαιωθῇς is retained, with a clarifying alternative footnote.'
  issues:
  - severity: high
    issue: '"모든 사람은 거짓되다 하자" is semantically and grammatically unsuitable.'
    rationale: ψεύστης is a noun ('liar'), and γινέσθω expresses the rhetorical imperative that God be acknowledged as true in contrast to every human being as a liar; the draft's wording is unnatural and may imply an injunction to become false.
  - severity: medium
    issue: Register is inconsistent with the required modern formal-polite 합쇼체.
    rationale: '"결코 그럴 수 없다" is plain style, while "이기시리이다" is archaic elevated style. The revised text uses modern formal-polite forms consistently.'
  - severity: medium
    issue: The textual/translation alternative at ἐν τῷ κρίνεσθαί σε is unmarked.
    rationale: Romans' Greek is naturally passive, 'when you are judged,' whereas the Hebrew wording behind Psalm 51:4 is commonly rendered 'when you judge.' This should be preserved in a footnote without deciding the disputed relationship by translation alone.
