- from: 결코 그럴 수 없다! 도리어 하나님은 참되시고 모든 사람은 거짓되다 하자. 기록된 바와 같이, 「주께서 말씀하실 때 의롭다 하심을 얻으시고, 심판받으실 때 이기시리이다.」
  to: 결코 그렇지 않습니다! 오히려 하나님은 참되시고 모든 사람은 거짓말쟁이임이 드러나게 하십시오. 기록된 바와 같습니다. “주께서 말씀하실 때 의롭다 하심을 받으시고[a], 심판받으실 때 이기실 것입니다.[b]”
  rationale: γινέσθω의 수사적 명령을 한국어에서 자연스럽게 나타내기 위해 "…임이 드러나게 하십시오"로 옮겼습니다. 이는 하나님이 참되심과 모든 인간의 거짓됨이라는 대조를 보존하면서, 사람들에게 거짓말쟁이가 되라고 명하는 듯한 오해를 피합니다. ψεύστης는 명사 "거짓말쟁이"로 바로잡고, 인용문은 현대 합쇼체로 통일했습니다. δικαιωθῇς의 법정적 뉘앙스와 κρίνεσθαί의 수동 읽기 및 시편과 관련된 대안은 각주로 보존했습니다.
