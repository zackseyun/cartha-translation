  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
  footnotes:
  - marker: a
    text: Or 'if indeed God is one.'
    reason: alternative_reading
  - marker: b
    text: Greek has 'circumcision' and 'uncircumcision,' meaning the circumcised and the uncircumcised.
    reason: cultural_note
  - marker: c
    text: Paul uses two different expressions, 'by faith' and 'through faith'; the difference may be stylistic rather than a sharp contrast.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 한 분이시므로[a], 할례 받은 이들은 믿음으로 의롭다 하시고[b] 할례 받지 않은 이들은 믿음을 통하여[c] 의롭다 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “참으로 하나님은 한 분이시라면.”
    reason: alternative_reading
  - marker: b
    text: 그리스어는 “할례”와 “무할례”라고 하며, 할례 받은 이들과 할례 받지 않은 이들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 바울은 “믿음으로”와 “믿음을 통하여”라는 서로 다른 표현을 사용합니다. 그 차이는 뚜렷한 대조라기보다 문체상의 차이일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πίστεως ... διὰ τῆς πίστεως
  english_pob_choice: by faith ... through faith
  chosen_korean: 믿음으로 ... 그 믿음을 통하여
  alternatives_korean:
  - 믿음에서 ... 그 믿음으로 말미암아
  lexicon: BDAG
  rationale: 두 전치사의 미세한 차이를 「~으로/~을 통하여」로 보존하되, 정관사 τῆς의 회귀적 함의를 「그」로 옮긴다.
