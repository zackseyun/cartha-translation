  source_fidelity: The draft conveys the conditional argument, the contrast between God's ἀλήθεια and human ψεῦσμα, the increase/abundance verb, and the continuing passive judgment. However, 「하나님의 진실」 is less precise in Korean for the personal/moral sense of ἀλήθεια in this context; 「하나님의 진실하심」 better represents 'God's truthfulness.'
  naturalness: 'A revision is needed for the required modern formal-polite 합쇼체: 「심판을 받느냐?」 is plain-style, whereas 「심판을 받습니까?」 is appropriate. 「어찌하여 내가」 is also smoother than 「어찌 나는」 in this rhetorical question.'
  terminology: Use 「하나님의 진실하심」 to retain the contextual contrast with 「내 거짓말」 without narrowing ἀλήθεια to doctrinal 「진리」. 「죄인으로 심판을 받습니까」 accurately retains ὡς ἁμαρτωλὸς and the present passive κρίνομαι.
  issues:
