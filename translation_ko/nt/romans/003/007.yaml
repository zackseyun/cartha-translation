  - severity: low
    issue: Rendering of ἀλήθεια
    rationale: 「하나님의 진실」 can be read as an abstract truth or fact. In the immediate contrast with human falsehood, 「하나님의 진실하심」 more clearly conveys God's truthfulness while preserving the source sense.
