review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 「그러나 이제는」, 「율법과는 별개로」, 「하나님의 의」는 잘 보존했습니다. 다만 πεφανέρωται의 완료 시제와 μαρτυρουμένη의 현재분사는 원문의 연결된 양상을 나타내는데, 현 초안의 「나타났으니 ... 증언합니다」는 '-으니'로 인과 관계를 암시하고 참여구의 동시적·지속적 증언을 충분히 드러내지 못합니다.
  naturalness: 「율법과 예언자들이 그것을 증언하고 있습니다」는 현대 표준어 합쇼체로 자연스럽고, 원문의 수동 참여구를 한국어에서 자연스러운 능동문으로 옮깁니다. 「드러났으며」는 앞 절과 증언 절의 관계를 인과가 아니라 병렬적 수식 관계로 유지합니다.
  terminology: 「하나님의 의」는 δικαιοσύνη θεοῦ의 속격적 모호성을 보존하는 적절한 바울 서신 용어입니다. 「율법과 예언자들」도 정경적 명칭을 직역으로 유지합니다. 「하나님에게서 오는 의」라는 가능한 해석은 각주로만 제시하여 본문의 모호성을 해소하지 않습니다.
  issues:
