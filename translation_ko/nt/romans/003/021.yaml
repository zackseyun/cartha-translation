  rationale: 본문의 핵심 번역 선택은 유지하되, 완료 주절과 현재분사의 관계를 「드러났으며 ... 증언하고 있습니다」로 옮겼습니다. 이 수정은 원문이 말하는 지속적인 성경의 증언을 보존하고, '-으니'가 유발할 수 있는 인과적 뉘앙스를 피합니다. 속격의 해석 가능성은 본문을 바꾸지 않고 각주로 보존했습니다.
