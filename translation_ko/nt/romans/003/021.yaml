    issue: 「나타났으니」가 συμμε적 연결을 인과적으로 들리게 할 수 있음
    rationale: μαρτυρουμένη는 이미 드러난 하나님의 의가 율법과 예언자들에게 현재 증언받고 있음을 덧붙이는 현재 수동 분사입니다. '-으니'는 한국어에서 흔히 이유나 근거를 나타내므로 원문에 없는 인과를 암시할 수 있습니다.
