    rationale: ἐπίγνωσις ἁμαρτίας는 율법을 통하여 죄를 알게 되는 일을 가리킵니다. ‘인식이 오다’는 어색하며, 원문의 일반적 현재 진술도 충분히 드러나지 않습니다.
