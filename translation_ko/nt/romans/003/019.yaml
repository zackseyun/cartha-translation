  text: 그러나 우리는 율법이 말하는 것은 무엇이든지 율법 아래 있는 사람들에게 말한다는 것을 알고 있습니다.[a] 이는 모든 입이 막히고 온 세상이 하나님께 책임을 져야 할 처지에 놓이게 하려는 것입니다.[b]
