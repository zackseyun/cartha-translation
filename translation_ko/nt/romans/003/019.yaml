    reason: lexical_alternative
  revision_rationale: The revision restores the Greek clause structure, retains δέ with a restrained ‘그러나,’ renders τοῖς ἐν τῷ νόμῳ idiomatically while documenting its literal form, and expresses the purpose clause in natural 합쇼체. It preserves the concrete image of every mouth being stopped and the legal accountability denoted by ὑπόδικος without imposing ‘guilty’ as the sole sense.
