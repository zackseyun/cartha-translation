revisions:
- from: 우리는 알고 있습니다. 율법이 말하는 것은 무엇이든지 율법 안에 있는 자들에게 말한다는 것을, 곧 모든 입이 막히고 온 세상이 하나님께 책임을 지게 되게 하려 함입니다.
  to: 그러나 우리는 율법이 말하는 것은 무엇이든지 율법 아래 있는 사람들에게 말한다는 것을 알고 있습니다.[a] 이는 모든 입이 막히고 온 세상이 하나님께 책임을 져야 할 처지에 놓이게 하려는 것입니다.[b]
  rationale: The revision restores the Greek clause structure, retains δέ with a restrained ‘그러나,’ renders τοῖς ἐν τῷ νόμῳ idiomatically while documenting its literal form, and expresses the purpose clause in natural 합쇼체. It preserves the concrete image of every mouth being stopped and the legal accountability denoted by ὑπόδικος without imposing ‘guilty’ as the sole sense.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:07:29Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the broad sequence and legal thrust, but its first sentence misconstrues the syntax by treating ‘whatever the law says’ as the subject of a clause that redundantly says the law speaks. The Greek says that whatever the law says, it speaks to those within/under the law. The purpose clause should retain the legal sense of ὑπόδικος without prematurely equating it with a verdict of guilt.
  naturalness: 'The draft is not natural Korean: ‘율법이 말하는 것은 무엇이든지 율법 안에 있는 자들에게 말한다는 것을’ is syntactically cumbersome and repetitious, and ‘책임을 지게 되게’ is an unidiomatic double causative. The revision uses modern formal-polite Korean and clear clause boundaries.'
  terminology: ‘율법’ and ‘하나님’ are appropriate. ‘율법 아래 있는 사람들’ naturally conveys legal jurisdiction; a note preserves the literal wording. ‘하나님께 책임을 져야 할 처지에 놓이게’ communicates the forensic force of ὑπόδικος more accurately than a bare ‘책임을 지게 되게,’ while avoiding the stronger, disputed implication ‘유죄 판결을 받게.’
  issues:
  - severity: high
    issue: The syntax of ὅσα ὁ νόμος λέγει ... λαλεῖ is not represented accurately.
    rationale: The draft redundantly renders the law as both saying and speaking within an awkward content clause. The relative expression ‘whatever the law says’ must be the object of ‘speaks,’ not the subject of an independent repeated statement.
  - severity: medium
    issue: ‘책임을 지게 되게’ is unidiomatic and weakens the legal-status nuance of ὑπόδικος.
    rationale: The Greek describes becoming answerable or liable before God. ‘책임을 져야 할 처지에 놓이게’ is idiomatic and retains this judicial accountability without asserting a completed guilty verdict.
  - severity: low
    issue: No note preserves the lexical ambiguity of τοῖς ἐν τῷ νόμῳ.
    rationale: ‘율법 아래 있는’ is idiomatic, but the literal expression is ‘율법 안에 있는.’ A concise note makes the translation choice transparent.
  revised_text: 그러나 우리는 율법이 말하는 것은 무엇이든지 율법 아래 있는 사람들에게 말한다는 것을 알고 있습니다.[a] 이는 모든 입이 막히고 온 세상이 하나님께 책임을 져야 할 처지에 놓이게 하려는 것입니다.[b]
