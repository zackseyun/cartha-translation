base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
  footnotes:
  - marker: a
    text: Or, more formally, 'And not—as we are slanderously reported and as some say that we say—"Let us do evil that good may come"?'
    reason: lexical_alternative
  - marker: b
    text: '''Their condemnation'' refers to those who make or endorse this accusation and reasoning.'
    reason: alternative_reading
translation:
  language: ko
  text: 또 우리가 비방을 받고 어떤 이들은 우리가 그렇게 말한다고 주장하는 대로, “선한 일이 생기도록 악을 행합시다”라고 왜 말하지 않겠습니까? 그들이 받을 심판은 마땅합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들’은 바울이 ‘악을 행하자’라고 말한다고 비방하거나 그와 같은 논리를 주장하는 이들을 가리킵니다.
    reason: alternative_reading
