  source_fidelity: 핵심 구조와 의미는 잘 옮겼습니다. 그러나 ‘하나님께로부터 났는지’는 ἐκ τοῦ θεοῦ(하나님에게서/하나님으로부터 온)의 출처 의미를 전달할 수는 있어도, 한국어에서는 ‘태어나다’의 뜻이 강하게 들려 영들의 기원 또는 출생을 말하는 것처럼 이해될 수 있습니다.
  naturalness: ‘사랑하는 자들이여’와 합쇼체 명령은 문맥과 격식에 맞습니다. 다만 ‘그 영들이 하나님께로부터 났는지’보다 ‘그 영들이 하나님께로부터 온 것인지’가 현대 표준어에서 더 자연스럽고 의미도 명료합니다.
  terminology: ‘영’, ‘시험해 보십시오’, ‘거짓 예언자들’, ‘세상’은 원문의 표현과 현대적인 용어 선택을 적절히 반영합니다. ‘거짓 예언자’는 ψευδοπροφῆται의 충실한 번역입니다.
  issues:
  - severity: medium
    issue: ‘하나님께로부터 났는지’
    rationale: 원문의 전치사구는 하나님을 출처로 제시합니다. ‘나다’는 한국어에서 출생·발생의 뜻을 강하게 띠므로, 영들이 하나님에게서 ‘태어났다’는 식의 불필요한 뉘앙스를 만들 수 있습니다. ‘하나님께로부터 온 것인지’가 출처 의미를 자연스럽게 보존합니다.
  revised_text: 사랑하는 자들이여, 모든 영을 믿지 말고 그 영들이 하나님께로부터 온 것인지 시험해 보십시오. 많은 거짓 예언자들이 세상에 나갔기 때문입니다.
