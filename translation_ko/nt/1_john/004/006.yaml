  source_fidelity: 첫 두 번의 ἐκ τοῦ θεοῦ는 하나님과의 소속 관계만이 아니라 하나님에게서 비롯됨/나옴을 나타냅니다. 초안의 「하나님께 속하였습니다」는 가능한 해석이지만 이 출처·기원 대조를 약화합니다. 「하나님께로부터 왔습니다」가 원문의 대조를 더 직접적으로 보존합니다. γινώσκων, ἀκούει, ἐκ τούτου, γινώσκομεν 및 두 πνεῦμα 구절의 대조는 충실하게 반영됩니다.
  naturalness: 「하나님을 아는 사람」과 「하나님께로부터 오지 않은 사람」은 현대 표준 한국어의 자연스러운 포괄적 표현이며, 합쇼체 문장으로 일관됩니다. 「우리 말을 듣습니다」는 문맥상 사도적 증언을 받아들이는 의미를 자연스럽게 전달합니다.
  terminology: 「진리의 영 / 미혹의 영」은 τὸ πνεῦμα τῆς ἀληθείας와 τὸ πνεῦμα τῆς πλάνης의 평행 및 πλάνη의 미혹·오류 의미를 잘 보존합니다. 한국어에는 영어와 같은 대문자 구별이 없으므로 「진리의 영」으로 두어 성령을 가리킬 가능성을 유지하면서 번역 자체가 그 해석을 과도하게 확정하지 않게 했습니다.
  issues:
