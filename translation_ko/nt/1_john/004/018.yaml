  to: 사랑 안에는 두려움이 없습니다. 도리어 온전한 사랑은 두려움을 내쫓습니다. 두려움에는 형벌이 있기 때문입니다. 그러나 두려워하는 자는 사랑 안에서 온전하게 되지 못하였습니다.
