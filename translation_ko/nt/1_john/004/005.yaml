  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
  footnotes:
  - marker: a
    text: Or 'They are of the world … they speak of the world.' The Greek repeatedly uses 'from/out of the world,' emphasizing source or origin.
    reason: lexical_alternative
  - marker: b
    text: '''The world'' here means the human order opposed to God, not the created universe as such.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 세상에서 왔습니다[a]. 그러므로 세상에서 나온 말을 하고, 세상은[b] 그들의 말에 귀를 기울입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 세상에 속해 있습니다 … 세상에 속한 말을 합니다.” 그리스어는 ‘세상에서/세상으로부터’라는 표현을 반복하여 그들의 근원 또는 출처를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘세상’은 창조된 우주 자체라기보다 하나님께 대립된 인간 질서를 가리킵니다.
    reason: cultural_note
