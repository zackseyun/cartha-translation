  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
  footnotes:
  - marker: a
    text: Or 'his brother or sister.' The Greek says 'his brother' (ἀδελφόν), a masculine singular form that can function representatively in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 누가 「내가 하나님을 사랑한다」고 말하고 자기 형제[a]를 미워한다면, 그는 거짓말쟁이입니다. 이는 그가 본 자기 형제를 사랑하지 않는 사람은 그가 보지 못한 하나님을 사랑할 수 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제나 자매’. 그리스어는 남성 단수 ‘형제’(ἀδελφόν)를 사용하며, 문맥상 대표적으로 쓰였을 수 있습니다.
    reason: lexical_alternative
