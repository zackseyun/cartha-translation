translation:
  language: ko
  text: 이로써[a] 사랑이 우리와 함께[b] 온전하게 된 것은 우리가 심판의 날에 담대함[c]을 가지도록 하기 위함입니다. 이는 그분[d]께서 어떠하신 것처럼 우리도 이 세상에서 그러하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 점에서” 또는 “이 안에서”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리 가운데”.
    reason: lexical_alternative
  - marker: c
    text: 또는 “확신”.
    reason: lexical_alternative
  - marker: d
    text: 그분은 예수를 가리킬 가능성이 크지만, 하나님을 더 일반적으로 가리킨다고 이해하는 견해도 있습니다.
    reason: alternative_reading
