review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly recognizes the main clauses, but its rendering of ἵνα as “그래서 우리가 … 가지게 합니다” changes the construction: it makes an unstated subject actively cause believers to have boldness, rather than expressing the intended result/purpose of love having been perfected. The revision restores the perfect-result sense of τετελείωται and the purpose force of ἵνα. “우리와 함께” retains the deliberately broad μεθ’ ἡμῶν without narrowing it to “in us.”'
  naturalness: The original draft is understandable, but “담대함을 가지게 합니다” is syntactically and semantically unnatural in context. “온전하게 된 것은 … 가지도록 하기 위함입니다” is modern formal-polite Korean and clearly represents the Greek clause relationship. “그분께서 어떠하신 것처럼 우리도 이 세상에서 그러하기 때문입니다” is appropriately formal and retains the compact comparative expression.
  terminology: “사랑,” “온전하게 되다,” “심판의 날,” and “담대함” are suitable established Korean biblical terms. “그분” preserves the Greek’s implicit antecedent rather than inserting “예수님” or “하나님.”
  issues:
  - severity: high
    issue: The purpose clause is mistranslated as an active causal statement.
    rationale: “그래서 우리가 심판의 날에 담대함을 가지게 합니다” lacks a clear subject and renders ἵνα + subjunctive as though someone ‘makes’ us have boldness. The Greek states that love has been perfected with us so that we may have boldness on the day of judgment.
  - severity: low
    issue: No anchors or notes preserve notable lexical and referential alternatives.
    rationale: The source permits alternatives for ἐν τούτῳ and μεθ’ ἡμῶν, and ἐκεῖνος has an implicit referent. Brief notes preserve these without resolving the verse’s ambiguity.
  revised_text: 이로써[a] 사랑이 우리와 함께[b] 온전하게 된 것은 우리가 심판의 날에 담대함[c]을 가지도록 하기 위함입니다. 이는 그분[d]께서 어떠하신 것처럼 우리도 이 세상에서 그러하기 때문입니다.
  revised_footnotes:
