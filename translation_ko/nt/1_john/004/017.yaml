- from: 이로써 사랑이 우리와 함께 온전해졌습니다. 그래서 우리가 심판의 날에 담대함을 가지게 합니다 — 그분이 어떠하신 것처럼 우리도 이 세상에서 그러하기 때문입니다.
  to: 이로써[a] 사랑이 우리와 함께[b] 온전하게 된 것은 우리가 심판의 날에 담대함[c]을 가지도록 하기 위함입니다. 이는 그분[d]께서 어떠하신 것처럼 우리도 이 세상에서 그러하기 때문입니다.
  rationale: 'The revision corrects the mistranslated ἵνα clause while retaining the source’s open expressions: love is perfected “with us,” believers have boldness at judgment, and the comparison with “that one/he” remains implicit. The notes reflect genuine source-level alternatives and do not impose a doctrinal resolution.'
