  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
  footnotes:
  - marker: a
    text: Or 'By this, love has been perfected among us.' The Greek phrase can also be understood as introducing the means or manner, and 'with us' may also be rendered 'among us.'
