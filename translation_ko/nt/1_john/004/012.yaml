- from: 지금까지 하나님을 본 자는 아무도 없습니다. 만일 우리가 서로 사랑하면, 하나님께서 우리 안에 머무시며 그분의 사랑이 우리 안에서 온전해집니다.
  to: 아무도 하나님을 본 적이 없습니다. 우리가 서로 사랑한다면, 하나님께서는 우리 안에 머무르시고 그분의 사랑은 우리 안에서 온전하게 이루어져 있습니다.[a]
