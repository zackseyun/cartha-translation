  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
  footnotes:
  - marker: a
    text: Or, 'our love for God is perfected in us.' The Greek 'his love' can be understood either as God's love for us or our love directed toward God; the context favors God's love.
    reason: alternative_reading
  - marker: b
    text: Or, 'is made complete in us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 하나님을 본 적이 없습니다. 우리가 서로 사랑한다면, 하나님께서는 우리 안에 머무르시고 그분의 사랑은 우리 안에서 온전하게 이루어져 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님을 향한 우리의 사랑이 우리 안에서 온전하게 이루어져 있습니다.” 그리스어 ‘그분의 사랑’은 하나님의 우리를 향한 사랑 또는 하나님을 향한 우리의 사랑으로 이해될 수 있습니다.
    reason: alternative_reading
