    issue: 마지막 ‘알기 때문입니다’가 γινώσκει를 인과절로 바꿈
    rationale: 원문은 ‘사랑하는 사람마다 하나님에게서 태어났으며 하나님을 안다’라고 두 서술을 καί로 연결합니다. 하나님을 아는 것이 앞선 진술의 이유라는 문법적 관계는 원문에 없습니다.
  - severity: medium
    issue: ‘사랑은 하나님께로부터 났고’의 표현
    rationale: ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν은 사랑의 근원·출처를 말합니다. ‘났다’는 뒤의 γεγέννηται(태어났다)와 혼동될 수 있으므로 ‘하나님에게서 옵니다’가 더 정확하고 자연스럽습니다.
