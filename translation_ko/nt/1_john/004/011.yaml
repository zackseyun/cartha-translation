review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional construction (εἰ), God's love for us, the emphatic inclusion of believers ('우리도'), moral obligation (ὀφείλομεν), and reciprocal love. '이처럼' appropriately retains οὕτως without unnecessarily deciding between manner and degree.
  naturalness: '''사랑하는 자들이여'' is understandable but is not idiomatic in contemporary standard Korean and sounds unnecessarily archaic or literalistic. ''사랑하는 여러분'' is a natural formal-polite direct address and retains the affectionate force of ἀγαπητοί.'
  terminology: Use '사랑하는 여러분' for ἀγαπητοί and retain the repeated '사랑' vocabulary. '하나님' and '서로 사랑해야 합니다' are suitable standard Korean renderings in 합쇼체.
  issues:
  - severity: low
    issue: '''사랑하는 자들이여'' is awkward in modern standard Korean.'
    rationale: The expression mirrors the Greek vocative too mechanically. '사랑하는 여러분' functions naturally as a plural direct address in modern formal Korean while preserving the source's affectionate address.
  revised_text: 사랑하는 여러분, 하나님께서 우리를 이처럼 사랑하셨다면, 우리도 서로 사랑해야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 “하나님께서 이처럼 우리를 사랑하셨으므로.” 헬라어는 ‘만일’이라는 조건 형식을 사용하지만, 문맥에서는 그 조건이 참임을 전제합니다.
    reason: alternative_reading
  revision_rationale: The revision replaces only the unnatural vocative with an idiomatic modern Korean equivalent. A footnote preserves the source-form conditional and notes its contextually assumed force, without changing the main text into an explicit causal statement.
