  source_fidelity: 첫 절의 ἐν ἡμῖν은 직역상 ‘우리 안에/우리 가운데’이며, 초안의 ‘우리에게 ... 사랑’은 ‘우리를 향한’이라는 수혜적 의미로 확정하여 원문의 위치적·공동체적 표현을 약화합니다. 또한 ἔχει를 ‘가지고 계신’으로 옮긴 표현은 한국어에서 부자연스럽습니다. 두 완료형은 ‘알게 되었고 믿게 되었습니다’로 과거의 인식과 신뢰가 현재에 이르는 뉘앙스를 무리 없이 반영합니다.
  naturalness: ‘하나님께서 우리 안에 지니신 사랑’은 원문의 표현을 보존하면서도 ‘우리에게 가지고 계신 사랑’보다 자연스럽습니다. 인용 부호는 원문에 없는 강조이므로 제거하는 것이 적절합니다. ‘사랑 안에 머무는 사람’과 ‘그 사람’은 현대 표준어 합쇼체에서 자연스럽고, 단수 남성 대명사의 대표적 용법도 한국어에서 무리 없이 전달합니다.
  terminology: ‘하나님은 사랑이십니다’, ‘사랑 안에 머무르다’, ‘하나님 안에 머무르다’는 요한 문헌의 핵심 표현을 일관되게 보존합니다. 기존 각주처럼 신학적 해설을 본문 선언에 부가하기보다, 논쟁 가능한 ἐν ἡμῖν의 의미 범위를 밝히는 각주가 원문 충실성에 더 적합합니다.
