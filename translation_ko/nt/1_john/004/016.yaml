source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
  footnotes:
  - marker: a
    text: Or 'the love that God has in us.' The Greek phrase can denote love present within believers or manifested among the community.
    reason: alternative_reading
  - marker: b
    text: Greek 'in him' uses a masculine singular form with representative force; that is, the one who remains in love.
    reason: lexical_alternative
  - marker: c
    text: Or 'have come to know and have believed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리는 하나님께서 우리 안에 지니신 사랑을 알게 되었고 믿게 되었습니다.[a] 하나님은 사랑이십니다. 사랑 안에 머무는 사람은 하나님 안에 머무르고, 하나님도 그 사람 안에 머무르십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 우리 가운데 지니신 사랑’. 그리스어 ‘우리 안에’는 신자들 안에 있는 사랑 또는 공동체 가운데 나타난 사랑을 가리킬 수 있습니다.
    reason: alternative_reading
