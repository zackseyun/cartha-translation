source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
  footnotes:
  - marker: a
    text: Or 'In this we know …' The Greek phrase can be rendered more formally that way.
    reason: lexical_alternative
  - marker: b
    text: Or 'abide in him.' The Greek verb μένω is a key Johannine term for continuing relationally in union with God.
    reason: lexical_alternative
  - marker: c
    text: Literally 'from his Spirit,' emphasizing source; many English versions simplify to 'his Spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이로써 우리는 우리가 그분 안에 머물러 있고 그분께서 우리 안에 머물러 계신다는 것을 압니다. 이는 그분께서 그분의 영을[a] 우리에게 주셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그분의 영으로부터’입니다. 그분의 영이 이 선물의 출처임을, 그리고 부분적으로 나누어 주심을 시사할 수 있습니다.
    reason: lexical_alternative
