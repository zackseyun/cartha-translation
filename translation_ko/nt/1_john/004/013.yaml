  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐκ τοῦ πνεύματος αὐτοῦ의 ἐκ가 지닌 출처·부분적 뉘앙스가 본문에서 전혀 드러나지 않으므로 각주로 보완하는 것이 좋습니다. 또한 두 번째 μένω는 첫 번째 동사에서 생략되어 있으나, 한국어에서는 존대 서술을 명시하는 편이 자연스럽습니다.
  naturalness: 초안의 콜론 뒤에 쓰인 ‘곧 … 때문입니다’는 연결이 다소 부자연스럽습니다. 독립 문장으로 ‘이는 … 때문입니다’라고 하는 것이 현대 표준어 합쇼체에 자연스럽습니다. 하나님을 가리키는 표현도 ‘그분도 우리 안에 머무신다’보다 ‘그분께서 우리 안에 머물러 계신다’가 일관된 존대 표현입니다.
  terminology: μένω는 ‘머물러 있다/머물러 계시다’로 일관되게 옮겼습니다. πνεῦμα는 문맥상 성령을 가리키므로 ‘영’으로 두되, 원문의 ἐκ의 뉘앙스는 각주에서 설명합니다. ‘자기 영’은 문법상 가능하지만 현대 한국어에서는 지시 대상이 덜 분명할 수 있어 ‘그분의 영’으로 고쳤습니다.
