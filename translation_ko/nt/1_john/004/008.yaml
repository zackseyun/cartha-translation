  source_fidelity: 첫 절의 ‘알지 못한 것입니다’는 완료된 과거 사건을 가리키는 듯하고, 현재 분사 ὁ μὴ ἀγαπῶν의 일반적·지속적 성격 및 문맥상 귀결을 한국어에서 다소 부자연스럽게 나타냅니다. ‘알지 못합니다’는 한국어 관용상 관계적 앎의 현재 상태를 자연스럽게 전달합니다. ὅτι의 인과 관계와 ‘하나님은 사랑이시다’라는 명사 술어는 보존되었습니다.
  naturalness: ‘사랑하지 않는 사람은 하나님을 알지 못합니다’가 현대 표준 한국어 합쇼체에서 자연스럽습니다. 원문의 인용부호와 조사 결합인 ‘「하나님은 사랑이시기」 때문입니다’는 비문에 가까우므로 제거하고 문장으로 바로 연결했습니다.
  terminology: ‘하나님’, ‘사랑’, ‘알다’를 유지했습니다. 특히 ἀγαπῶν/ἀγάπη의 어휘적 연결을 ‘사랑하지 않는/사랑’으로 보존했습니다. 기존 각주는 ‘하나님은 사랑’이 단순한 속성 진술이 아니라 정체성 진술이라고 단정하여 본문이 명시하는 범위를 해설적으로 확장하므로 삭제하는 것이 안전합니다.
