  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
  footnotes:
  - marker: a
    text: That is, the opponents just mentioned, especially the false prophets.
    reason: cross_reference
  - marker: b
    text: Or 'he who is in you ... he who is in the world.' The Greek leaves both referents implicit; context suggests God or his Spirit for the first, and the evil one behind the world for the second.
    reason: alternative_reading
translation:
  language: ko
  text: 자녀들이여, 여러분은 하나님께 속해 있으며, 그들을[a] 이겼습니다. 여러분 안에 계시는 분이 세상에 있는 자보다 크시기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들’은 앞 절들에서 언급된 거짓 예언자들, 곧 그들과 관련된 대적자들을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 그리스어는 ‘여러분 안에 계시는 분’과 ‘세상에 있는 자’가 누구인지를 명시하지 않습니다. 문맥상 앞의 표현은 하나님 또는 그의 영을, 뒤의 표현은 세상 배후의 악한 자를 가리키는 것으로 이해될 수 있습니다.
    reason: alternative_reading
