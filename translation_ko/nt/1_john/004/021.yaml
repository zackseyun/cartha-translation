review_pass:
  verdict: revise
  source_fidelity: 원문의 ἐντολή, ἀπ’ αὐτοῦ, ἵνα 절의 명령 내용을 대체로 잘 반영합니다. 다만 '받았습니다'는 현재형 ἔχομεν(‘가지고 있습니다’)보다 완료된 수여 행위에 초점을 두며, '자기 형제'는 αὐτοῦ가 하나님을 사랑하는 사람을 가리키는 점은 전달하지만 한국어에서 다소 부자연스럽습니다. 또한 ἀδελφός의 공동체적 대표 용법은 각주로 밝혀 주는 것이 적절합니다.
  naturalness: 합쇼체로 자연스럽게 다듬으려면 '우리는 그분에게서 이 계명을 받았습니다'보다 '우리는 그분에게서 이 계명을 받고 있습니다/받아 가지고 있습니다'는 어색하므로, 한국어 관용상 '그분에게서 이 계명을 받았습니다'도 가능하지만 원문의 현재적 소유를 살려 '우리는 그분에게서 이 계명을 받았습니다'보다 '우리는 그분에게서 이 계명을 받았습니다'가 자연스럽다는 장점이 있습니다. 그러나 문맥상 계명을 현재 보유한다는 뜻을 가장 자연스럽게 표현하려면 '우리는 그분에게서 이 계명을 받았습니다'를 유지할 수 있습니다. '곧'과 콜론의 결합은 가능하나, '이 계명을 받았습니다. 하나님을 사랑하는 사람은...'으로 풀면 더 현대적인 문장이 됩니다.
  terminology: '''계명'', ''하나님'', ''사랑''은 요한 문헌의 핵심 용어를 적절히 일관되게 반영합니다. ἀδελφόν은 문맥상 신앙 공동체의 동료를 가리키지만, 본문에서는 원문의 남성 단수 형태를 반영한 ''형제''를 유지하고 각주로 대표적 용법을 제시하는 것이 안전합니다.'
  issues:
  - severity: low
    issue: ἔχομεν의 현재형 표현
    rationale: '''받았습니다''는 한국어로 자연스럽지만, 원문은 ‘이 계명을 그분에게서 가지고 있다’는 현재 상태를 말합니다. 의미 변화는 크지 않으나 ''받아 가지고 있습니다''는 부자연스러우므로, 자연스러운 번역을 위해 수여 완료 표현을 허용할 수 있습니다.'
  - severity: medium
    issue: ἀδελφόν의 공동체적·대표적 용법에 대한 각주 부재
    rationale: ‘자기 형제’는 문법적으로 가능하지만 한국어에서는 소유 관계처럼 들릴 수 있습니다. 원문의 남성 단수 ‘그의 형제’를 본문에서 ‘형제’로 옮기고, 문맥상 형제자매/동료 신자를 대표할 수 있음을 각주로 밝혀야 합니다.
