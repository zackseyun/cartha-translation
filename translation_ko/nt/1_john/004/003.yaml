  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
  footnotes:
  - marker: a
    text: Some manuscripts read, 'does not confess that Jesus Messiah has come in the flesh.'
    reason: textual_variant
  - marker: b
    text: 'Or, more explicitly, ''this is the spirit of the antichrist.'' The Greek is elliptical: literally, ''this is that of the antichrist.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'this is that of the antichrist'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 예수를 고백하지 않는 모든 영은 하나님께로부터 온 것이 아닙니다.[ㄱ] 이것은 적그리스도의 영[ㄴ]입니다. 여러분은 그것이 오고 있다고 들었으며, 그것은 지금 이미 세상에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 일부 사본에는 ‘예수 그리스도께서 육체로 오신 것을 고백하지 않는’이라고 되어 있습니다.
    reason: textual_variant
  - marker: ㄴ
    text: 직역하면, ‘이것은 적그리스도의 것입니다’입니다. 그리스어에는 ‘영’이 반복되어 있지 않습니다.
    reason: lexical_alternative
