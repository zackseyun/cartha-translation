review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 「머물 수 있겠습니까」는 직설법 μένει를 가능 표현으로 한 단계 해석하여 옮기므로, 수사 의문문의 형태를 더 직접 보존하는 편이 좋습니다. βίος τοῦ κόσμου는 이 문맥에서 물질적 소유·자원을 가리키므로 「이 세상의 재물」이 더 자연스럽고 분명합니다.
  naturalness: 합쇼체의 문장 흐름은 자연스럽습니다. 「그에게 마음을 닫는다면」은 이해 가능하지만 동정의 관용구라는 점을 주석으로 밝혀 두면 σπλάγχνα의 의미를 충분히 전달할 수 있습니다.
  terminology: 「하나님의 사랑」은 τοῦ θεοῦ의 속격이 지닌 ‘하나님께서 주시는 사랑/하나님을 향한 사랑’의 여지를 보존합니다. ἀδελφός는 본문에서 「형제」로 유지하고, 대표적 용법의 가능성은 주석으로 처리합니다.
  issues:
  - severity: low
    issue: 「세상의 생활 수단」
    rationale: 의미상 가능하지만 현대 한국어에서는 다소 행정적·도구적으로 들릴 수 있습니다. 문맥상 필요한 물질적 소유를 뜻하므로 「이 세상의 재물」이 더 관용적입니다.
  - severity: low
    issue: 「머물 수 있겠습니까」
    rationale: 원문의 πῶς ... μένει는 직설법을 사용한 수사 의문입니다. 「어떻게 ... 머물겠습니까?」가 가능 표현을 추가하지 않고 원문의 문법적 힘을 더 가깝게 반영합니다.
  revised_text: 그러나 누구든지 이 세상의 재물을 가지고 있으면서 자기 형제가 궁핍한 것을 보고도 그에게 마음을 닫는다면, 어떻게 하나님의 사랑이 그 사람 안에 머물겠습니까?
  revised_footnotes:
  - marker: a
    text: 또는 ‘형제나 자매’. 그리스어는 ‘형제’라고 하며, 믿는 공동체의 한 지체를 대표하여 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그에게서 자기의 내장을 닫다’. 이는 깊은 동정과 긍휼을 거두어 주지 않는다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하나님의 사랑’은 그 사람 안에 있는 하나님의 사랑을 뜻할 수도 있고, 그 사람이 하나님께 드리는 사랑을 뜻할 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 물질적 소유라는 문맥적 의미를 더 자연스러운 한국어로 드러내고, 마지막 수사 의문문을 원문의 직설법에 가깝게 조정했습니다. 속격의 신학적 모호성과 ‘형제’ 및 σπλάγχνα의 어휘적 뉘앙스는 주석으로 보존했습니다.
