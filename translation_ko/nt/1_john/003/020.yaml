translation:
  language: ko
  text: 이는 만일 우리 마음이 우리를 정죄한다면[a], 하나님은 우리 마음보다 크시고[b] 모든 것을 아십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 마음이 우리를 책망한다면” 또는 “우리에게 잘못이 있다고 한다면.”
    reason: καταγινώσκῃ의 가능한 어휘적 뉘앙스를 제시하되, 본문의 ‘정죄하다’를 유지합니다.
  - marker: b
    text: “하나님은 우리 마음보다 크시고”는 하나님께서 우리 자신에 대한 우리의 판단보다 더 온전하게 아심을 가리킬 수 있으며, 그에 따라 우리의 자기 정죄에 대한 하나님의 권위를 함축할 수 있습니다.
    reason: μείζων의 범위를 자비나 권위나 지식 중 하나로 한정하지 않고, 영어 POB 주석의 해석 가능성을 보존합니다.
