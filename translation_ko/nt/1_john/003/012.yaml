  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
  footnotes:
  - marker: a
    text: Or 'from evil.' The Greek expression can be read more abstractly, but in Johannine usage it commonly refers to the personal evil one.
    reason: alternative_reading
  - marker: b
    text: Or 'murdered.' The Greek verb is more vivid, literally 'slaughtered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가인[a]과 같아서는 안 됩니다. 그는 악한 자에게서 났으며 자기 형제를 살해하였습니다. 그가 왜 자기 형제를 살해하였습니까? 자기 행위들은 악하였고 그의 형제의 행위들은 의로웠기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악에서 났으며.’ 그리스어 표현은 추상적인 ‘악’을 가리킬 수도 있으나, 요한 문헌에서는 흔히 인격적인 ‘악한 자’를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσφαξεν
  english_pob_choice: slaughtered
  chosen_korean: 살해하였습니다
  alternatives_korean:
  - 도살하였습니다
  - 잔혹하게 죽였습니다
  lexicon: BDAG
  rationale: σφάζω는 제물 도살에 쓰이는 강한 어휘 — 잔혹함을 함의. 「살해하였다」로 옮기되, 「죽이다(ἀποκτείνω)」와 구별되는 강도를 보존한다.
