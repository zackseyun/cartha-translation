    issue: The concluding expression is syntactically and idiomatically awkward.
    rationale: ‘그분이 우리에게 명령을 주신 그대로입니다’ is overly literal and does not flow naturally after ‘것이니.’ Greek ἔδωκεν ἐντολὴν ἡμῖν is naturally conveyed here as ‘우리에게 명령하신 대로입니다,’ preserving the comparison and the address to ‘us.’
  revised_text: 그리고 이것이 그분의 계명입니다. 곧 우리가 그분의 아들 예수 메시아의 이름을 믿고 서로 사랑하는 것입니다. 이는 그분이 우리에게 명령하신 대로입니다.
