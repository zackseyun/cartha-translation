  to: 이로써 하나님의 자녀들과 마귀의 자녀들이 분명히 드러납니다. 의를 행하지 않는 사람은 하나님께 속한 사람이 아니며, 자기 형제를 사랑하지 않는 사람도 하나님께 속한 사람이 아닙니다.
