  to: 그리고 그분의 계명들을 지키는 사람은 그분 안에 머무르고, 그분도 그 사람 안에 머무르십니다. 그리고 그분이 우리에게 주신 영으로 우리는 그분이 우리 안에 머무르신다는 것을 압니다.
  rationale: 마지막 절을 재구성하여 ἐκ τοῦ πνεύματος를 「그분이 우리에게 주신 영으로」로 자연스럽게 반영했습니다. 이는 그 영이 하나님께서 우리 안에 머무르심을 아는 근거 또는 수단이라는 원문의 관계를 유지합니다. 「이로써」는 바로 뒤의 영의 선물이라는 설명으로 풀리는 구조이므로, 한국어에서는 중복을 피하여 해당 구를 직접 주절 앞으로 옮겼습니다.
