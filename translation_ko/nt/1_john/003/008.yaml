id: 1JN.3.8
reference: 1 John 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
  footnotes:
  - marker: a
    text: Or 'The one who does sin' / 'whoever commits sin.' The Greek expression uses a present participle, suggesting ongoing or characteristic practice rather than a single isolated act.
    reason: lexical_alternative
  - marker: b
    text: Or 'is of the devil.' The Greek literally uses 'from' (ἐκ), expressing source or moral-spiritual origin/alignment.
    reason: alternative_reading
  - marker: c
    text: Or 'appeared' for 'was revealed.' The Greek emphasizes manifestation or disclosure.
    reason: lexical_alternative
  - marker: d
    text: Or 'to undo the works of the devil.' The verb literally means 'to loose' and by extension 'to break up' or 'destroy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죄를 일삼는 자[a]는 마귀에게서 온 자[b]입니다. 마귀가 처음부터 죄를 짓고 있기 때문입니다. 하나님의 아들이 나타나신 것은 마귀의 일들을 무너뜨리시기 위해서입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄를 행하는 자’. 그리스어 현재분사는 한 번의 고립된 행동보다 계속되거나 특징적인 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마귀에게서’. 여기서는 실제 출생이라기보다 도덕적·영적 출처 또는 소속을 나타냅니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘마귀의 일들을 풀어 없애시기 위해서’. 그리스어 동사는 본래 ‘풀다’라는 뜻이며, 여기서는 해체하고 무효화한다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβόλου
  english_pob_choice: devil
  chosen_korean: 마귀
  alternatives_korean:
  - 참소하는 자
  lexicon: BDAG
  rationale: διάβολος는 「참소자·중상자」. 한국 교회 전통의 「마귀」가 표준 등가어로 본문의 신학적 무게를 담는다.
- source_word: λύσῃ
  english_pob_choice: destroy
  chosen_korean: 멸하시기
  alternatives_korean:
  - 허무시기
  - 파하시기
  lexicon: BDAG
  rationale: λύω는 「풀다·해체하다·무효화하다」. 「멸하다」가 한국어에서 그 결정적 종결을 담는다.
