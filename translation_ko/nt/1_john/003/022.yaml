  to: 그리고 우리가 무엇이든지 구하면, 우리는 그분에게서 받습니다. 우리가 그분의 계명들을 지키고 그분께서 보시기에 기뻐하시는 일을 행하기 때문입니다.
  rationale: 원문의 조건적·불특정 관계절을 ‘무엇이든지 구하면’으로 명료하게 반영하고, 받는 주체가 ‘우리’임을 드러냈습니다. 이어지는 ὅτι의 인과 관계와 계명을 지키고 기쁜 일을 행한다는 두 병렬 동작을 그대로 유지했습니다. ἐνώπιον αὐτοῦ는 ‘그분께서 보시기에’로 옮겨 ‘그분의 시야에서/판단에’라는 뜻을 보존했습니다.
