review_pass:
  verdict: revise
  source_fidelity: 첫 절은 그리스어의 부정 관계절(ὃ ἐὰν αἰτῶμεν)과 주절(λαμβάνομεν)을 분명히 드러내야 합니다. 초안의 ‘우리가 무엇이든지 구하는 것은 ... 받습니다’는 ‘구하는 것’이 받는 것처럼 읽힐 수 있습니다. 또한 ἐνώπιον αὐτοῦ는 ‘그분 보시기에’로 자연스럽게 옮길 수 있으며, ‘기뻐하시는’의 주체는 명시하는 편이 분명합니다. 인과 접속사 ὅτι는 ‘때문입니다’로 잘 보존됩니다.
  naturalness: ‘무엇이든지 구하면, 우리는 ... 받습니다’는 현대 표준 한국어에서 자연스럽고 문장 구조도 명료합니다. ‘그분께서 기뻐하시는 일을 행하기 때문입니다’는 합쇼체의 격식 있는 성경 문체에 맞습니다.
  terminology: ‘계명’을 유지하여 요한 문헌의 ἐντολή 용어를 보존했습니다. τηρέω는 ‘지키고’, ποιέω는 ‘행하고’로 옮겨 원문의 표현을 충실히 반영했습니다. ‘그분’ 및 높임 표현은 존중하는 한국어 성경 문체에 적절합니다.
  issues:
  - severity: medium
    issue: 첫 절의 주어와 목적어 관계가 불명확합니다.
    rationale: ‘우리가 무엇이든지 구하는 것은 그분에게서 받습니다’는 한국어상 ‘구하는 것’이 ‘받습니다’의 주어처럼 해석될 여지가 있습니다. 원문은 ‘우리가 무엇이든지 구하면, [우리가] 그분에게서 받는다’입니다.
  - severity: low
    issue: ‘그분 보시기에 기뻐하시는’의 주체 표지가 다소 불분명합니다.
    rationale: 원문의 ‘그분 앞에서/보시기에 기쁜 것’을 자연스럽고 분명하게 전달하려면 ‘그분께서 기뻐하시는 일’로 표현하는 것이 좋습니다.
