- from: '이로써 우리는 사랑을 알게 되었습니다: 곧 그분이 우리를 위하여 자기 목숨을 내놓으셨다는 것입니다. 그러므로 우리도 형제들을 위하여 우리 목숨을 내놓아야 합니다.'
  to: 우리는 이로써[a] 사랑을 알게 되었습니다. 곧 그분께서 우리를 위하여 자기 목숨을 내놓으셨다는 것입니다. 또한 우리도 형제들을[b] 위하여 우리 목숨을 내놓아야 합니다.
  rationale: 원문 ἐν τούτῳ의 의미 범위를 각주로 보존하고, ἐγνώκαμεν의 완료상은 ‘알게 되었습니다’로 자연스럽게 옮겼습니다. ἐκεῖνος는 본문 문맥에 따라 존칭 대명사 ‘그분’으로 유지하되 명시적으로 이름을 보태지 않았습니다. 가장 필요한 수정은 원문 καὶ에 없는 추론 강도를 지닌 ‘그러므로’를 ‘또한’으로 바꾼 것입니다. ψυχή/τίθημι의 반복은 ‘목숨을 내놓다’로 일관되게 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:11Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 정확합니다. 그러나 헬라어 καὶ는 단순 접속이며, 원문에 없는 추론적 접속사 ‘그러므로’를 사용하면 논리 관계가 강해집니다. 이를 ‘또한’으로 고치는 것이 원문에 더 충실합니다.
  naturalness: 합쇼체는 자연스럽고, ‘목숨을 내놓다’는 ψυχή + τίθημι의 요한적 관용 표현을 현대 한국어로 잘 전달합니다. ‘그분께서’는 존칭 주격을 더 자연스럽게 드러냅니다.
  terminology: ‘사랑’, ‘목숨’, ‘형제들’은 적절합니다. ‘형제들’은 원문의 남성 복수 표현을 보존하되, 문맥상 여성 신자도 포함할 가능성을 각주로 밝혀야 합니다. ‘이로써’의 가능한 대안도 각주로 보완합니다.
  issues:
  - severity: medium
    issue: ‘그러므로’가 원문의 καὶ보다 강한 추론 관계를 도입합니다.
    rationale: καὶ는 여기서 ‘그리고/또한’의 접속으로, 앞선 그리스도의 행위에서 신자의 의무로 이어지지만 원문 자체가 ‘그러므로’라는 명시적 결론 표지를 사용하지는 않습니다.
  - severity: low
    issue: 영어 POB 감사 기록에 있는 ‘이로써’ 및 ‘형제들’ 관련 각주가 한국어 본문에 반영되지 않았습니다.
    rationale: 번역 선택의 대안과 ‘형제들’의 문맥상 포괄적 지시를 독자가 확인할 수 있도록 해당 위치에 각주 표지를 두는 것이 좋습니다.
