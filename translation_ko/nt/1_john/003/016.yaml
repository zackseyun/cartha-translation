source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
  footnotes:
  - marker: a
    text: Or 'In this' or 'By this means.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'the brothers'; in context, this likely refers to fellow believers generally, including sisters.
    reason: cultural_note
translation:
  language: ko
  text: 우리는 이로써[a] 사랑을 알게 되었습니다. 곧 그분께서 우리를 위하여 자기 목숨을 내놓으셨다는 것입니다. 또한 우리도 형제들을[b] 위하여 우리 목숨을 내놓아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 안에서”, “이것을 통해서”.
    reason: lexical_alternative
  - marker: b
    text: 그리스어로는 “형제들”. 문맥상 이는 자매들을 포함한 동료 신자들을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  english_pob_choice: laid down his life
  chosen_korean: 자기 목숨을 내놓으셨다
  alternatives_korean:
  - 자기 생명을 내려놓으셨다
  - 자기 목숨을 바치셨다
  lexicon: BDAG
  rationale: ψυχή + τίθημι는 요한적 표현(요 10:11) — 자발적 희생. 「목숨을 내놓다」가 한국어에서 그 의도적 자기 내어줌을 자연스럽게 담는다.
