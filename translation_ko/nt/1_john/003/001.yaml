id: 1JN.3.1
reference: 1 John 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
  footnotes:
  - marker: a
    text: Or 'what sort of love'; traditionally 'how great a love.' The Greek emphasizes the kind or quality of the Father's love, expressed with astonishment.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts omit 'and we are.'
    reason: textual_variant
  - marker: c
    text: Or 'does not recognize us ... did not recognize him.'
    reason: lexical_alternative
  - marker: d
    text: '''Him'' most naturally refers to the Father in this verse; some understand it as referring to Christ in Johannine context.'
    reason: alternative_reading
  - marker: e
    text: 'Or ''the world does not know us: because it did not know him.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 아버지께서 우리에게 어떠한 사랑을 베푸셔서 우리가 하나님의 자녀라 불리게 하셨는지요. 우리는 참으로 하나님의 자녀입니다[b]. 이 때문에 세상은 우리를 알지 못합니다[c]. 세상이 그분[d]을 알지 못했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 일부 사본에는 “우리는 참으로 하나님의 자녀입니다”가 없습니다.
    reason: textual_variant
  - marker: c
    text: 또는 “우리를 알아보지 못합니다.”
    reason: lexical_alternative
  - marker: d
    text: “그분”은 이 구절에서 가장 자연스럽게 아버지를 가리킵니다. 요한 문헌의 문맥에서 그리스도를 가리킨다고 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ποταπὴν ἀγάπην
  english_pob_choice: what kind of love
  chosen_korean: 어떠한 사랑
  alternatives_korean:
  - 얼마나 큰 사랑
  - 어떤 종류의 사랑
  lexicon: BDAG
  rationale: ποταπός는 「어떤 종류의·얼마나 놀라운」 — 감탄적 함의가 강하다. 「어떠한 사랑」이 한국어에서 그 감탄을 자연스럽게 담는다.
- source_word: τέκνα θεοῦ
  english_pob_choice: children of God
  chosen_korean: 하나님의 자녀
  alternatives_korean:
  - 하나님의 아이들
  lexicon: BDAG
  rationale: 1 요한서의 핵심 정체성 표지. 「하나님의 자녀」가 한국 교회 표준 등가어로 그 신분의 무게를 담는다.
