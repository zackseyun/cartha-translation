  source_fidelity: 그리스어의 목적절(ἵνα)과 복수형 ‘죄들’(ἁμαρτίας), 그리고 ‘그분 안에는 죄가 없다’는 진술은 대체로 충실히 옮겼습니다. 다만 ‘여러분은 … 압니다’는 현대 합쇼체 문장으로는 ‘알고 있습니다’가 더 적절하며, φανερόω와 αἴρω의 가능한 어휘 범위는 각 해당 위치에 주석으로 표시하는 편이 좋습니다.
