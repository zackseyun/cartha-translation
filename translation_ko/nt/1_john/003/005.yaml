base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
  footnotes:
  - marker: a
    text: Or 'to bear away sins.' The Greek verb can mean 'take away,' 'remove,' or 'carry/bear away.'
    reason: lexical_alternative
  - marker: b
    text: Or 'was manifested.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 그분께서 죄들을 없애시려고[b] 나타나셨다는[a] 것을 알고 있습니다. 그분 안에는 죄가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드러나셨다’ 또는 ‘나타내어지셨다’.
    reason: ἐφανερώθη(φανερόω의 수동태)는 문맥상 역사적인 나타나심을 가리키며, ‘드러나다/나타내어지다’도 가능한 번역입니다.
  - marker: b
    text: 또는 ‘죄들을 지고 가시려고’. 그리스어 동사는 ‘없애다’, ‘제거하다’, 또는 ‘지고 가다’를 뜻할 수 있습니다.
    reason: ἄρῃ(αἴρω)는 문맥상 죄를 없애는 뜻으로 자연스럽지만, 동사의 더 넓은 의미 범위를 주석으로 보존합니다.
lexical_decisions:
- source_word: ἄρῃ
  english_pob_choice: take away
  chosen_korean: 없애시려고
  alternatives_korean:
