  text: 만일 우리가 죄를 짓지 않았다고 말하면, 우리는 그분을 거짓말쟁이로 만듭니다. 그리고 그분의 말씀이 우리 안에 있지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
