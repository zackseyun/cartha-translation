  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 κοινωνίαν ἔχομεν은 ‘교제를 누리다’보다 ‘교제하다’ 또는 ‘교제를 나누다’가 관계의 진술을 더 직접적으로 옮깁니다. 또한 두 동사가 함께 조건절을 이루므로 ‘말하면서도 … 걸어간다면’이 원문의 양보적 긴장을 자연스럽게 드러냅니다.
