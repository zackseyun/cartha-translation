- from: 그러나 만일 그분 자신이 빛 가운데 계신 것처럼 우리도 빛 가운데 걸어가면, 우리는 서로 교제를 누리며, 그분의 아들 예수의 피[a]가 우리를 모든 죄에서 깨끗하게 합니다.
