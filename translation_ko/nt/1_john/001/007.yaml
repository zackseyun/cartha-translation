  verdict: revise
  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 κοινωνίαν ἔχομεν은 ‘교제를 누리며’보다 ‘서로 교제하고’가 더 직접적이며, 기존 각주는 원문의 어휘적·문법적 쟁점을 설명하지 않고 십자가 죽음과 희생의 효력을 해설하여 본문을 넘어섭니다.
  naturalness: ‘그분 자신이 빛 가운데 계신 것처럼 우리도’라는 배열도 이해되지만, 조건절의 주어를 먼저 두고 ‘그분께서 빛 가운데 계신 것처럼’으로 옮기면 현대 표준 한국어 합쇼체에서 더 자연스럽고 원문의 비교 구조도 선명합니다. ‘그분의 아들이신 예수’는 동격 관계를 자연스럽게 드러냅니다.
  terminology: ‘빛 가운데’, ‘걸어가다’, ‘교제하다’, ‘피’, ‘정결하게 하다’는 요한 문헌의 비유와 καθαρίζει의 도덕적·제의적 함의를 보존합니다. ‘모든 죄’는 πάσης ἁμαρτίας의 가능한 집합적 이해를 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: 기존 각주가 본문을 넘어서는 신학적 해설을 제공합니다.
