  verdict: revise
  source_fidelity: 개정이 필요합니다. 헬라어는 두 번의 ἐφανερώθη를 모두 비존칭 여성 명사 「생명」에 맞추어 사용하며, 본문은 이를 직접 「아들」이라고 명시하지 않습니다. 초안의 「나타나셨고」 및 「계시다가/나타나신」은 본문의 문법적 표현을 인격적 존칭으로 선결합니다. 또한 첫 「나타남」과 마지막 「우리에게 나타남」을 모두 분명히 살려야 합니다.
  naturalness: 「그리고 그 생명이 나타났고, 우리는 보았으며 증언하고 … 선포합니다」는 현대 표준어 합쇼체 문어에서 자연스럽습니다. 관계절은 「아버지와 함께 있었고 우리에게 나타난」으로 옮기면 원문의 병렬과 시간적 의미를 무리 없이 보존합니다.
  terminology: 「그 생명」과 「그 영원한 생명」은 반복 정관사와 요한의 표현을 잘 보존합니다. 「영생」으로 단순화하지 않는 편이 적절합니다. 「아버지」는 신적 칭호로 대문자 구별이 없는 한국어에서도 자연스럽습니다.
  issues:
  - severity: medium
    issue: 인격적 존칭형 사용
    rationale: 「나타나셨고」「계시다가」「나타나신」은 문맥의 인격적 지시 가능성을 본문 문법보다 앞서 확정합니다. 원문은 여성 명사 ζωὴ를 사용하므로 비존칭 「나타났고/있었고/나타난」이 그 표현 형식을 보존합니다.
  - severity: medium
    issue: 첫 ἐφανερώθη에 대한 각주 누락
    rationale: 영어 POB 감사 기록은 첫 「was revealed」에 어휘 대안 각주를 둡니다. 한국어에서도 해당 위치에 「나타났다」의 대안적 번역을 제시하여 감사 기록과 두 번의 동사 반복을 반영하는 것이 좋습니다.
  - severity: low
    issue: 기존 각주 표지의 대응 불명확
    rationale: 초안의 [a]는 영어 감사 기록상 「the eternal life」에 붙은 설명에 해당하므로, 첫 동사 각주를 [a], 「그 영원한 생명」의 문맥 설명을 [b]로 배치하면 앵커와 내용의 대응이 명료합니다.
  revised_text: 그리고 그 생명이 나타났고[a], 우리는 보았으며 증언하고, 아버지와 함께 있었고 우리에게 나타난 그 영원한 생명[b]을 여러분에게 선포합니다—
  revised_footnotes:
  - marker: a
    text: 또는 “드러났다”, “계시되었다”.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 「그 영원한 생명」은 문법적으로 사물처럼 표현되어 있습니다. 문맥상 이는 아버지와 함께 있었고 사도들에게 나타난 아들을 가리킵니다.
    reason: cross_reference
  revision_rationale: 비존칭 여성 명사 「생명」을 그대로 유지하여 원문의 문법적 표현과 인격적 지시의 긴장을 보존했습니다. 두 차례의 ἐφανερώθη를 모두 「나타나다」로 일관되게 옮겼고, 완료형 ἑωράκαμεν은 「보았으며」로, 현재형 μαρτυροῦμεν과 ἀπαγγέλλομεν은 「증언하고 … 선포합니다」로 반영했습니다. 각주는 본문에 없는 해석을 본문으로 끌어들이지 않으면서 어휘 대안과 문맥상 인격적 지시를 설명합니다.
