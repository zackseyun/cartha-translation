  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 두 번의 ἐφανερώθη는 모두 문법적으로 여성 명사 「생명」을 받으므로, 본문에서 존칭 인격형 「나타나셨고/계시다가/나타나신」을 사용하면 원문이 유지하는 명사적·인격적 긴장을 본문 차원에서 과도하게 해소합니다. 또한 원문의 순서와 동사상(나타남—보았음—증언함—선포함)을 더 직접적으로 반영해야 합니다.
  naturalness: 「그 생명이 나타났고, 우리는 보았으며 증언하고 … 선포합니다」는 현대 표준어 합쇼체의 문어 성경 문맥에서 자연스럽습니다. 「아버지와 함께 있었으며」는 πρὸς τὸν πατέρα의 관계성을 자연스럽게 전달하면서도 본문에 인격 존칭을 부가하지 않습니다.
  terminology: 「그 생명」과 「그 영원한 생명」을 유지하여 반복된 정관사와 요한의 표현을 살렸습니다. 「증언하다」와 「선포하다」는 μαρτυροῦμεν 및 ἀπαγγέλλομεν의 구별을 보존합니다. 각주에서는 문맥상의 인격적 지시를 설명하되 본문에는 직접 명시하지 않았습니다.
  issues:
  - severity: medium
    issue: 「나타나셨고」 및 관계절의 「계시다가 … 나타나신」이 생명을 본문에서 명시적으로 존칭 인격화합니다.
    rationale: 원문은 ζωὴ(생명)라는 여성 명사를 사용하고 관계대명사도 이에 문법적으로 일치시킵니다. 문맥상 아들을 가리키지만, 본문은 그를 직접 인칭 대명사나 이름으로 표기하지 않으므로 한국어 존칭형은 그 긴장을 앞서 해소합니다.
  - severity: medium
    issue: 「아버지와 함께 계시다가」는 ἦν(미완료, ‘있었다’)보다 사건 이전의 상태와 이후 변화라는 뉘앙스를 강하게 낼 수 있습니다.
    rationale: 「아버지와 함께 있었으며」가 원문의 지속적 선재 관계를 더 직접적으로 반영하고, ‘계시다가’가 암시할 수 있는 상태 전환을 피합니다.
  revised_text: 그리고 그 생명이 나타났고, 우리는 보았으며 증언하고 여러분에게 아버지와 함께 있었으며 우리에게 나타난 그 영원한 생명을 선포합니다—
  revised_footnotes:
  - marker: a
    text: 헬라어 「그 영원한 생명」은 문법적으로는 사물처럼 표현되지만, 문맥상 아버지와 함께 있었고 사도들에게 나타난 아들을 인격적으로 가리킨다.
    reason: cross_reference
  revision_rationale: 두 ‘나타남’을 모두 비존칭 명사 표현으로 옮겨 원문의 문법적 표현을 보존했습니다. 보았음(완료)의 결과적 의미는 한국어 완료 연결형 「보았으며」로 자연스럽게 반영했고, 현재형인 「증언하고」와 「선포합니다」를 유지했습니다. 원문의 어순에 따라 ‘아버지와 함께 있었으며 우리에게 나타난’ 관계절을 「그 영원한 생명」에 연결했습니다.
