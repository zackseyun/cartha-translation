review_pass:
  verdict: revise
  source_fidelity: 원문의 대조 구조(예고된 단수 ἀντίχριστος와 현재의 복수 ἀντίχριστοι), νῦν의 강조, γεγόνασιν의 완료상은 대체로 반영되었습니다. 다만 ‘아이들이여’는 수신자에 대한 사목적 호칭 παιδία에 비해 다소 유아적인 인상을 줄 수 있고, ‘일어났습니다’는 인물들을 가리킬 때 한국어에서 자연스럽지 않거나 봉기의 뉘앙스를 낼 수 있습니다.
  naturalness: ‘자녀들이여’가 현대의 격식 있는 성경 문체에서 더 자연스러운 사목적 호칭입니다. ‘많은 적그리스도들이 나타났습니다’는 완료형이 나타내는 현재적 결과를 자연스럽게 전달합니다. 접속사 ‘그리고’는 한국어에서는 생략해도 논리적 연결이 유지됩니다.
  terminology: ‘적그리스도’와 ‘마지막 때’는 한국어 기독교 문헌에서 널리 쓰이는 적절한 용어입니다. 단수와 복수를 각각 유지하여 본문의 긴장을 해소하지 않았습니다.
  issues:
  - severity: low
    issue: Παιδία를 ‘아이들이여’로 번역함
    rationale: παιδία는 여기서 문자적으로 어린아이만을 지칭하기보다 공동체를 향한 사목적 호칭입니다. ‘자녀들이여’가 존중하는 현대 합쇼체 문맥에 더 적합합니다.
  - severity: medium
    issue: γεγόνασιν을 ‘일어났습니다’로 번역함
    rationale: γίνομαι의 완료형은 많은 적그리스도들이 이미 등장하여 현재 존재한다는 뜻입니다. 한국어 ‘일어나다’는 이 문맥에서 다소 부자연스럽고 봉기라는 다른 연상을 줄 수 있으므로 ‘나타났습니다’가 더 정확하고 자연스럽습니다.
  revised_text: 자녀들이여, 지금은 마지막 때입니다. 여러분이 적그리스도가 온다고 들은 것처럼, 지금도 많은 적그리스도들이 나타났습니다[b]. 이로써 우리는 지금이 마지막 때임을 압니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그 적그리스도가 온다.’ 그리스어 명사에는 정관사가 없지만, 예상되는 특정 인물을 가리키는 뜻으로 이렇게 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘생겨났습니다’ 또는 ‘왔습니다.’ 그리스어 완료형은 많은 적그리스도들이 이미 나타나 현재도 존재함을 나타냅니다.
    reason: lexical_alternative
  revision_rationale: 사목적 호칭을 ‘자녀들이여’로 조정하고, 완료형 γεγόνασιν을 ‘나타났습니다’로 옮겨 이미 등장한 자들이 현재 존재한다는 의미를 보존했습니다. 단수 ‘적그리스도’와 복수 ‘적그리스도들’의 대비 및 ‘마지막 때’의 비규정적 종말론적 표현은 유지했습니다. 본문에 단수 명사 뒤 [a] 표지를 넣지 않은 것은 한국어에서 관사의 유무가 표면적으로 드러나지 않기 때문이며, 해당 선택지는 완전한 각주 세트에 보존했습니다.
