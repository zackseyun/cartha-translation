  text: 그러나 자기 형제를 미워하는 자는 어둠 가운데 있고 어둠 가운데 걸어가며, 어디로 가는지 알지 못합니다. 어둠이 그의 눈을 멀게 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
