  source_fidelity: 원문의 현재적 진행성을 한국어 현재형으로 자연스럽게 옮겼으며, κόσμος와 그 욕망의 소멸 및 하나님의 뜻을 행하는 이의 영속이라는 대조를 충실히 보존합니다. 「그 욕망」은 αὐτοῦ가 세상에 연결됨을 적절히 나타내고, 「영원히」는 εἰς τὸν αἰῶνα를 자연스럽게 전달합니다.
  naturalness: 「그리고 세상은 그 욕망과 함께 지나갑니다. 그러나 하나님의 뜻을 행하는 자는 영원히 머뭅니다.」는 현대 표준어 합쇼체로 문법적이고 자연스럽습니다. 「행하는 자」와 「머뭅니다」는 격식을 갖춘 성경 문맥에 적합하며 지나치게 고어적이지 않습니다.
