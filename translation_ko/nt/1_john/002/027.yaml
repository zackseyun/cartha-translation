base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
  footnotes:
  - marker: a
    text: Or, in some manuscripts, 'and just as it taught you, you remain in him.'
    reason: textual_variant
  - marker: b
    text: Or 'abides in you' / 'abide in him'; the same Greek verb is used throughout this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 경우에는, 그분에게서 받은 기름 부으심이 여러분 안에 머물러 있습니다. 여러분에게는 아무에게서든 가르침을 받을 필요가 없습니다. 오히려 그분의 기름 부으심이 여러분에게 모든 것에 관하여 가르치는 대로, 그것은 참되고 거짓이 아닙니다. 그리고 그것이 여러분을 가르친 그대로, 그분 안에 머무르십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “그리고 그것이 여러분을 가르친 그대로, 여러분은 그분 안에 머물러 있습니다”라고 되어 있습니다. 이 절에서는 ‘머물다’에 해당하는 같은 그리스어 동사가 반복됩니다.
    reason: textual_variant; lexical_alternative
