    reason: textual_variant; lexical_alternative
  revision_rationale: The revision corrects the Korean idiom and clarifies the possession of ‘need’ without weakening or interpreting the statement. It preserves χρῖσμα as ‘기름 부으심,’ translates περὶ πάντων as ‘모든 것에 관하여,’ retains the truth/falsehood antithesis, and renders the SBLGNT final μένετε as a plural imperative. The alternate indicative reading is retained in a footnote.
