revisions:
- from: 그리고 여러분으로 말하면, 여러분이 그분에게서 받은 기름 부으심이 여러분 안에 머물러 있어서, 누가 여러분을 가르칠 필요가 없습니다. 그러나 그분의 기름 부으심이 여러분에게 모든 것을 가르치는 그대로 — 그것은 참되며 거짓이 아닙니다 — 그것이 여러분을 가르친 그대로, 여러분은 그분 안에 머무십시오.
  to: 여러분의 경우에는, 그분에게서 받은 기름 부으심이 여러분 안에 머물러 있습니다. 여러분에게는 아무에게서든 가르침을 받을 필요가 없습니다. 오히려 그분의 기름 부으심이 여러분에게 모든 것에 관하여 가르치는 대로, 그것은 참되고 거짓이 아닙니다. 그리고 그것이 여러분을 가르친 그대로, 그분 안에 머무르십시오.[a]
  rationale: The revision corrects the Korean idiom and clarifies the possession of ‘need’ without weakening or interpreting the statement. It preserves χρῖσμα as ‘기름 부으심,’ translates περὶ πάντων as ‘모든 것에 관하여,’ retains the truth/falsehood antithesis, and renders the SBLGNT final μένετε as a plural imperative. The alternate indicative reading is retained in a footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the anointing metaphor and the final imperative, but its opening expression is unnatural and its wording for οὐ χρείαν ἔχετε can imply that no one needs to teach the readers rather than that the readers have no need of such teaching. The revision follows the SBLGNT syntax and preserves the repeated μένω terminology with ‘머물다.’
  naturalness: ‘그리고 여러분으로 말하면’ is not idiomatic modern Korean, and the dash-parenthesis construction interrupts the sentence unnecessarily. The revision uses clear, formal-polite Korean while retaining the verse’s parallelism and emphasis.
  terminology: ‘기름 부으심’ appropriately preserves χρῖσμα without identifying it doctrinally. ‘참되고 거짓이 아닙니다’ conveys the Johannine truth/lie contrast. ‘머물러 있습니다’ and ‘머무르십시오’ consistently render the related occurrences of μένω.
  issues:
  - severity: medium
    issue: Opening phrase is unnatural Korean.
    rationale: ‘그리고 여러분으로 말하면’ is a calque-like construction. ‘여러분의 경우에는’ naturally represents the topical emphasis of καὶ ὑμεῖς.
  - severity: medium
    issue: The expression for ‘you have no need that anyone should teach you’ is semantically unclear.
    rationale: ‘누가 여러분을 가르칠 필요가 없습니다’ can mean that nobody has a need to teach the readers. The Greek expresses that the readers have no need for anyone’s teaching.
  - severity: low
    issue: The parenthetical dashes obscure the Greek clause sequence.
    rationale: The assertions that the anointing teaches, is true, and is not a lie are better presented as coordinated clauses in Korean.
  revised_text: 여러분의 경우에는, 그분에게서 받은 기름 부으심이 여러분 안에 머물러 있습니다. 여러분에게는 아무에게서든 가르침을 받을 필요가 없습니다. 오히려 그분의 기름 부으심이 여러분에게 모든 것에 관하여 가르치는 대로, 그것은 참되고 거짓이 아닙니다. 그리고 그것이 여러분을 가르친 그대로, 그분 안에 머무르십시오.[a]
