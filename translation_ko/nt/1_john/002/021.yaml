  source_fidelity: 핵심 대조와 ‘진리에서’라는 출처의 의미는 대체로 충실합니다. 다만 원문의 두 번째와 세 번째 ὅτι 절은 모두 ‘쓴 이유’를 병렬로 제시하므로, 한국어에서도 이 병렬 관계를 분명히 해야 합니다.
  naturalness: 초안의 ‘여러분이 그것을 알고 있고, 또 어떤 거짓말도 진리에서 나오지 않기 때문입니다’는 ‘알고 있고’와 ‘때문입니다’의 연결이 비대칭이어서 문장 구조가 어색합니다. 두 이유를 각각 ‘때문이며’와 ‘때문입니다’로 연결하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘진리’는 ἀλήθεια에 적절하며, ‘진리에서 나오지 않다’는 ἐκ τῆς ἀληθείας의 출처 의미를 보존합니다. πᾶν ψεῦδος에는 ‘어떠한 거짓도’가 ‘어떤 거짓말도’보다 포괄적이고 문맥에 더 잘 맞습니다.
  issues:
  - severity: medium
    issue: 병렬 이유절의 문법적 연결이 불완전함
    rationale: 원문은 ‘여러분이 진리를 안다’와 ‘어떠한 거짓도 진리에서 나지 않는다’를 모두 γράφω의 이유로 병렬 제시합니다. 초안의 ‘알고 있고’는 뒤의 ‘때문입니다’와 문법적으로 균형을 이루지 못합니다.
  - severity: low
    issue: ψεῦδος의 범위를 ‘거짓말’로 다소 좁힘
    rationale: ψεῦδος는 개별 발화로서의 거짓말뿐 아니라 거짓·허위 일반을 가리킬 수 있습니다. ‘어떠한 거짓도’가 원문의 포괄성을 더 잘 보존합니다.
  revised_text: 내가 여러분에게 쓴 것은 여러분이 진리를 알지 못하기 때문이 아니라, 여러분이 진리를 알고 있기 때문이며, 어떠한 거짓도 진리에서 나오지 않기 때문입니다.
