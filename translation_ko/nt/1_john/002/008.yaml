source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
  footnotes:
  - marker: a
    text: Or 'which is true in it and in you,' taking the pronoun to refer to the commandment rather than to him personally.
    reason: alternative_reading
translation:
  language: ko
  text: 다시, 여러분에게 새 계명을 씁니다. 이것은 그분[a] 안에서도 여러분 안에서도 참된 것입니다. 이는 어둠이 지나가고 참 빛이 이미 비치고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 계명”. 헬라어 대명사는 문맥상 그리스도를 가리키는 것으로 가장 자연스럽게 이해되지만, 앞의 ‘새 계명’을 가리킨다고 이해할 수도 있습니다.
    reason: αὐτῷ의 대안적 지시 대상을 보존하기 위함
lexical_decisions:
- source_word: παράγεται
  english_pob_choice: is passing away
  chosen_korean: 지나가고
  alternatives_korean:
  - 사라지고
  - 물러가고
  lexicon: BDAG
  rationale: παράγω 중수동 — 종말론적 「지나감」. 2:17에서도 동일 어휘. 「지나가다」로 일관 처리한다.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  english_pob_choice: the true light
  chosen_korean: 참 빛
  alternatives_korean:
  - 진정한 빛
  lexicon: BDAG
  rationale: ἀληθινός는 「원형적·실재적」으로 그림자가 아닌 본체를 가리킨다. 「참 빛」으로 간결하게.
