- from: 그들은 우리에게서 나갔으나 우리에게 속한 자들이 아니었습니다. 만일 그들이 우리에게 속해 있었더라면, 우리와 함께 머물러 있었을 것입니다. 그러나 이는 그들 모두가 우리에게 속한 것이 아님이 드러나게 하려 함이었습니다.
  to: 그들은 우리에게서 나갔지만, 우리에게 속한 사람들이 아니었습니다. 그들이 우리에게 속한 사람들이었더라면, 우리와 함께 계속 머물러 있었을 것입니다. 그러나 그들이 모두 우리에게 속한 것은 아니라는 사실이 드러나도록 그렇게 된 것입니다.
  rationale: 첫 ἐξ ἡμῶν은 떠나온 출발점으로 「우리에게서」, 이후 반복은 공동체에 대한 소속으로 「우리에게 속한」으로 유지했습니다. 마지막 문장은 원문의 목적절과 수동적 ‘드러남’을 보존하면서, οὐκ … πάντες의 ‘모두가 … 것은 아니다’라는 범위를 분명하게 했습니다.
