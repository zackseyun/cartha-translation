  text: 그들은 우리에게서 나갔지만, 우리에게 속한 사람들이 아니었습니다. 그들이 우리에게 속한 사람들이었더라면, 우리와 함께 계속 머물러 있었을 것입니다. 그러나 그들이 모두 우리에게 속한 것은 아니라는 사실이 드러나도록 그렇게 된 것입니다.
