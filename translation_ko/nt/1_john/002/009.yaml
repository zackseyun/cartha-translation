  text: 빛 가운데에 있다고 말하고 자기 형제를 미워하는 사람은 지금도 어둠 가운데에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 형제나 자매.” 그리스어는 남성 단수 “형제”를 사용하며, 이 윤리적 문맥에서는 대표적으로 쓰였을 수 있습니다.
    reason: ἀδελφός의 남성 단수 형태를 본문에서 보존하면서, 문맥상 포괄적으로 이해될 수 있는 대안을 제시합니다.
