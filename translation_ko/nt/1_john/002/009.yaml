  source_fidelity: The draft conveys the central contrast accurately. However, the Greek coordinates the person's claim to be in the light with the act of hating, rather than making the latter merely a circumstance introduced by '-면서.' A coordinated Korean expression better reflects this structure. The temporal expression is best rendered '지금도,' preserving ἕως ἄρτι ('until now/still').
