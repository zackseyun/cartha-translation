  source_fidelity: 핵심 의미는 대체로 보존하지만, 본문의 각주 표지가 해당 어구와 맞지 않습니다. 또한 ἐάν τις ἁμάρτῃ의 일반적 조건을 「죄를 짓더라도」로 옮기면 다소 양보적 뉘앙스가 생기므로 「죄를 지으면」이 더 가깝습니다. παράκλητον은 이 문맥에서 아버지 앞에서 신자를 위해 말하는 분이라는 의미가 적절합니다.
  naturalness: 「아버지께 대언자가 계시니」는 한국어에서 관계와 역할이 다소 불분명합니다. 「아버지 앞에서 우리를 변호해 주시는 대언자」로 하면 자연스럽고 문맥상 의미가 드러납니다. 「나의 사랑하는 자녀 여러분」은 현대 합쇼체에서 애정 어린 호칭을 자연스럽게 전달합니다.
