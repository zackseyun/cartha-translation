    rationale: 각주는 독자가 해당 원어 어구와 대안을 식별할 수 있도록 「메시아」에 붙어야 합니다.
  - severity: medium
    issue: a 각주가 παράκλητος를 법정에서 변호하는 자로 단정하고 「보혜사」를 부적절하다고 규정합니다.
    rationale: παράκλητος에는 옹호자·돕는 이·위로자 등을 아우르는 의미 범위가 있으며, 이 절에서 옹호적 의미가 유력하더라도 다른 용례 및 번역어를 배제하는 단정은 본문 충실성을 넘어섭니다.
  - severity: medium
    issue: 「만일 누가 죄를 짓더라도」의 「-더라도」가 조건절에 양보의 뉘앙스를 더합니다.
    rationale: ἐὰν with aorist subjunctive는 여기서 통상적인 미래 조건을 나타내므로 「누가 죄를 지으면」이 더 직접적입니다.
