review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the repeated object, the condition, the future result, and the parallel relation to the Son and the Father. However, the fronted emphatic pronoun is rendered by the unnatural phrase “여러분으로 말하면,” and the repeated μένω wording can be made more idiomatic while preserving its consistency.
  naturalness: “여러분으로 말하면” is not natural contemporary formal Korean in this context. “여러분은” naturally marks the topical/contrastive emphasis. “머물게 하십시오” is a clear formal-polite rendering of the imperative; the conditional and future forms are expressed naturally as “머문다면” and “머물 것입니다.”
  terminology: “아들” and “아버지” appropriately retain the Johannine relational titles without interpretively expanding them. “처음부터 들은 것” preserves the broad neuter relative expression and does not impose “복음” or “사도적 가르침.” The repeated use of “머물다” consistently represents μένω.
  issues:
  - severity: medium
    issue: Unnatural rendering of the fronted pronoun
    rationale: “여러분으로 말하면” is a calque-like expression and is not idiomatic modern formal Korean. “여러분은” preserves the discourse prominence without introducing unnatural phrasing.
  revised_text: 여러분은 여러분이 처음부터 들은 것이 여러분 안에 머물게 하십시오. 여러분이 처음부터 들은 것이 여러분 안에 머문다면, 여러분도 아들 안에, 그리고 아버지 안에 머물 것입니다.
  revised_footnotes:
  - marker: a
    text: “여러분이 처음부터 들은 것”은 “처음부터 여러분이 들은 그것”으로도 옮길 수 있습니다. 문맥상 아들에 관한 처음의 사도적 선포를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: “머물게 하십시오,” “머문다면,” “머물 것입니다”는 모두 같은 그리스어 동사를 옮긴 것입니다. 전통적으로는 “거하다”라고도 번역합니다.
    reason: lexical_alternative
  revision_rationale: The revision replaces the non-idiomatic topical phrase with natural formal Korean, while retaining the source's emphasis, the generality of the repeated object, the conditional structure, the future indicative, and the repeated μένω motif. Footnotes preserve the source-audit lexical observations without narrowing the main text's referent.
