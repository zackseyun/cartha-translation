revisions:
- from: 그리고 이제 자녀들이여, 그분 안에 머무십시오. 그래야 그분이 나타나실 때 우리가 담대함을 가지고, 그분의 오심에서 그분 앞에 부끄러움으로 물러나지 않을 것입니다.
  to: 그러므로 이제, 자녀들이여, 그분 안에 머무르십시오. 그러면 그분께서 나타나실 때 우리가 담대함을 얻고, 그분이 오실 때 그분 앞에서 부끄러워 물러나지 않을 것입니다.
  rationale: The revision retains the pastoral vocative, the Johannine command to remain in Christ, confidence at his manifestation, and the possibility of withdrawing in shame at his coming. It replaces the unidiomatic “오심에서” construction and preserves the source's distinct terms for manifestation and coming without adding doctrinal detail.
  reviewer_model: gpt-5.6-terra
