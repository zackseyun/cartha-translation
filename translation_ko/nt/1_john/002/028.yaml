review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the affectionate address, abiding in Christ, confidence, and Christ's coming. However, it obscures the distinction between Christ's manifestation (φανερωθῇ) and his coming (παρουσίᾳ), and the phrase “그분의 오심에서” does not represent the Greek construction or natural Korean usage. The conditional/future-temporal force of ἐὰν φανερωθῇ should also be retained.
  naturalness: “그분의 오심에서 그분 앞에” is unnatural and syntactically awkward in modern Korean. “부끄러움으로 물러나다” is understandable but less idiomatic than “부끄러워 물러나다.”
  terminology: “담대함” is an appropriate rendering of παρρησία, and “오심” suitably renders παρουσία in this eschatological context. “나타나실 때” appropriately expresses φανερωθῇ without unnecessarily explaining the passive form.
  issues:
  - severity: medium
    issue: “그분의 오심에서” is an inaccurate and unnatural rendering of ἐν τῇ παρουσίᾳ αὐτοῦ.
    rationale: ἐν with παρουσία is best rendered here as “그분이 오실 때” or “그분의 오심 때에,” not “그분의 오심에서.”
  - severity: medium
    issue: The draft collapses φανερωθῇ (“is revealed/appears”) into παρουσία (“coming”).
    rationale: The Greek first speaks of his being revealed and then of shame in connection with his coming. Korean can preserve both naturally with “나타나실 때” and “오실 때.”
  - severity: low
    issue: “부끄러움으로 물러나지” is less natural than “부끄러워 물러나지.”
    rationale: The latter is idiomatic modern formal Korean and conveys the shame-related withdrawal reflected in αἰσχυνθῶμεν ἀπ’ αὐτοῦ.
  revised_text: 그러므로 이제, 자녀들이여, 그분 안에 머무르십시오. 그러면 그분께서 나타나실 때 우리가 담대함을 얻고, 그분이 오실 때 그분 앞에서 부끄러워 물러나지 않을 것입니다.
  revised_footnotes: []
  revision_rationale: The revision retains the pastoral vocative, the Johannine command to remain in Christ, confidence at his manifestation, and the possibility of withdrawing in shame at his coming. It replaces the unidiomatic “오심에서” construction and preserves the source's distinct terms for manifestation and coming without adding doctrinal detail.
