    text: 다른 본문 전통에서는 “여러분은 모든 것을 알고 있습니다”로 읽습니다. SBLGNT 본문은 “여러분은 모두 알고 있습니다”를 지지합니다.
    reason: textual_variant
  revision_rationale: 현재형 ἔχετε의 소유 의미와 ἀπό의 출처를 보존하도록 표현을 다듬고, πάντες/πάντα 이문을 표시하는 각주를 추가했습니다. ‘기름 부으심’과 ‘그 거룩하신 분’의 의도적인 신학적 비결정성은 유지했습니다.
