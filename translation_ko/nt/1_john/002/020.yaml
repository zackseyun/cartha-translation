revisions:
- from: 그러나 여러분에게는 그 거룩하신 분으로부터 받은 기름 부으심이 있고, 여러분은 모두 알고 있습니다.
  to: 그러나 여러분에게는 그 거룩하신 분에게서 온 기름 부으심이 있고, 여러분은 모두 알고 있습니다.[a]
  rationale: 현재형 ἔχετε의 소유 의미와 ἀπό의 출처를 보존하도록 표현을 다듬고, πάντες/πάντα 이문을 표시하는 각주를 추가했습니다. ‘기름 부으심’과 ‘그 거룩하신 분’의 의도적인 신학적 비결정성은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:25Z'
review_pass:
  verdict: revise
  source_fidelity: SBLGNT의 πάντες(주격 복수)는 ‘여러분은 모두 알고 있습니다’로 옮겨야 하며, 초안은 이 점을 정확히 반영합니다. 다만 ‘받은’은 ἔχετε(‘가지고 있다’)에 과거의 수여 사건을 더하여 표현하므로, 현재의 소유를 유지하면서 ἀπό의 출처를 나타내는 표현이 더 직접적입니다. 본문비평상 중요한 ‘모든 것을 안다’ 이문도 주석으로 밝혀야 합니다.
  naturalness: ‘그 거룩하신 분에게서 온 기름 부으심이 있습니다’는 현대 표준어 합쇼체로 자연스럽고, χρῖσμα의 비유적 표현을 보존합니다. ‘여러분은 모두 알고 있습니다’는 πάντες의 범위를 명료하게 드러냅니다.
  terminology: χρῖσμα는 ‘기름 부으심’으로 유지하여 성령 등으로 해석해 좁히지 않았습니다. τοῦ ἁγίου도 ‘그 거룩하신 분’으로 유지하여 하나님 또는 그리스도라는 가능한 지시 대상을 결정하지 않았습니다.
  issues:
  - severity: medium
    issue: 본문비평 각주가 누락되어 있습니다.
    rationale: SBLGNT 본문의 ‘여러분은 모두 알고 있습니다’(πάντες)와 널리 알려진 이문 ‘여러분은 모든 것을 알고 있습니다’(πάντα)의 차이를 독자가 확인할 수 있도록, 영어 POB 감사 기록에 있는 이문 주석에 대응하는 한국어 각주와 표지가 필요합니다.
  - severity: low
    issue: ‘받은 기름 부으심’은 현재형 ἔχετε보다 수여 사건을 다소 앞세웁니다.
    rationale: ἀπό는 출처를 나타내지만 동사는 ‘가지고 있다’입니다. ‘그 거룩하신 분에게서 온 ... 이 있습니다’는 출처와 현재 소유를 함께 더 가깝게 반영합니다.
  revised_text: 그러나 여러분에게는 그 거룩하신 분에게서 온 기름 부으심이 있고, 여러분은 모두 알고 있습니다.[a]
  revised_footnotes:
