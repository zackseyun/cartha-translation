  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
  footnotes:
  - marker: a
    text: Or, in another textual reading, 'and you know all things.' The SBLGNT reading supports 'and you all know.'
    reason: textual_variant
translation:
  language: ko
  text: 그러나 여러분에게는 그 거룩하신 분에게서 온 기름 부으심이 있고, 여러분은 모두 알고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 본문 전통에서는 “여러분은 모든 것을 알고 있습니다”로 읽습니다. SBLGNT 본문은 “여러분은 모두 알고 있습니다”를 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: χρῖσμα
  english_pob_choice: anointing
  chosen_korean: 기름 부으심
  alternatives_korean:
  - 기름부음
  - 도유
  lexicon: BDAG
  rationale: χρῖσμα는 기름 부음의 행위·결과. 본 문맥에서 성령의 임재와 가르치심을 가리킨다. 「기름 부으심」으로 옮겨 행위의 무게를 살린다(2:27에서도 동일).
- source_word: τοῦ ἁγίου
  english_pob_choice: the Holy One
  chosen_korean: 그 거룩하신 분
  alternatives_korean:
  - 거룩하신 자
  lexicon: BDAG
  rationale: 기독론적 칭호 — 그리스도 또는 하나님을 가리킨다. 「그 거룩하신 분」으로 칭호적 무게를 살린다.
