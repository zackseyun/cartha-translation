  source_fidelity: 핵심 의미는 잘 전달합니다. 다만 ὃν ἠκούσατε는 단순 과거이므로 ‘여러분이 들었던 그 말씀’보다 ‘여러분이 들은 말씀’이 더 직접적이며, 본문에 없는 지시성 ‘그’는 피하는 것이 좋습니다. ἀπ’ ἀρχῆς와 미완료 εἴχετε의 지속적 소유는 ‘처음부터 가지고 있던’으로 자연스럽게 보존됩니다.
  naturalness: ‘사랑하는 자들이여’는 전통적 성경 문체로 이해되지만 현대 표준어 합쇼체에서는 다소 문어적이고 어색할 수 있습니다. ‘사랑하는 여러분’이 친밀한 호칭을 자연스럽게 전달합니다. 또한 ‘새 계명이 아니라 … 씁니다’보다 ‘새 계명을 쓰는 것이 아니라’가 병렬 구조를 더 명확히 합니다.
  terminology: ἐντολή는 요한 문헌의 연결성을 살려 ‘계명’으로 유지하고, καινός/παλαιός의 대조도 ‘새/옛’으로 유지합니다. λόγος는 여기서 들은 선포의 내용을 가리키므로 ‘말씀’이 적절합니다. 별도의 각주가 반드시 필요하지는 않습니다.
  issues:
  - severity: low
    issue: ‘그 말씀’의 불필요한 지시성
    rationale: 그리스어는 관계절 ‘ὃν ἠκούσατε’(여러분이 들은)를 사용하며, 한국어의 ‘그’는 원문에 없는 강조 또는 지시성을 더할 수 있습니다.
  - severity: low
    issue: 호칭의 현대적 자연스러움
    rationale: ‘사랑하는 자들이여’는 지나치게 문어적일 수 있으므로, 현대 표준어의 목회적 호칭인 ‘사랑하는 여러분’으로 다듬는 것이 좋습니다.
