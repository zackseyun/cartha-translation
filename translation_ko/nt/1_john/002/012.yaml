  to: 자녀들이여, 그분의[a] 이름을 위하여 여러분의 죄가 용서되었기 때문에[c] 내가 여러분에게 씁니다[b].
  rationale: 「그분의 이름을 위하여」로 διὰ τὸ ὄνομα αὐτοῦ의 '그 이름을 위한/그 이름 때문에'라는 이유·목적의 뉘앙스를 보존했습니다. 죄의 복수형은 자연스러운 한국어 집합 표현으로 다듬었고, 본문이 밝히지 않는 「그분」의 지시 대상은 그대로 열어 두었습니다. 각 주석 표지는 해당 표현에 직접 붙였습니다.
