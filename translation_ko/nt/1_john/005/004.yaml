  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
  footnotes:
  - marker: a
    text: Or 'whatever has been born of God,' with the neuter Greek phrasing expressing the whole class of those born of God.
