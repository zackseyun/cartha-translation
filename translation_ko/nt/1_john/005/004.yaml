translation:
  language: ko
  text: 하나님에게서 태어난 사람은 누구나 세상을 이기기 때문입니다.[a] 그리고 세상을 이긴 승리는 바로 이것입니다. 곧 우리의 믿음입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나님에게서 태어난 것은 모두’입니다. 그리스어는 중성 표현을 사용하지만, 여기서는 하나님에게서 태어난 사람들 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 신실함’. 그리스어 ‘피스티스’는 문맥에 따라 ‘믿음’, ‘신뢰’, 또는 ‘신실함’을 뜻할 수 있습니다.
    reason: alternative_reading
