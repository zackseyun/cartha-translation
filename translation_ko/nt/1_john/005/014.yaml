review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional request clause and God's hearing. However, the phrasing for παρρησία is somewhat awkward in Korean, and rendering ἀκούει ἡμῶν as 'our words' is less precise in this prayer context than 'our prayers.'
  naturalness: ‘우리가 그분 앞에서 가지는 담대함’ is grammatically possible but stilted. Recasting the sentence as ‘우리가 하나님 앞에서 갖는 담대함은 이것입니다’ is natural modern formal Korean while retaining the emphasis.
  terminology: ‘담대함’ is a valid rendering of παρρησία and preserves its openness/boldness nuance; a note supplies ‘확신’ and ‘자유로운 확신’ as contextually viable alternatives. ‘하나님’ is made explicit because the antecedent is unambiguous and avoids repetitive impersonal pronouns.
  issues:
  - severity: low
    issue: Awkward construction for ‘we have before him’
    rationale: ‘그분 앞에서 가지는 담대함’ is less idiomatic than ‘하나님 앞에서 갖는 담대함.’
  - severity: low
    issue: ‘우리의 말을 들으신다’ is imprecise in the immediate prayer context
    rationale: The Greek idiom means that God hears the petitioners/their requests; ‘우리의 기도를 들으신다’ communicates this without implying that every request is granted.
  revised_text: 우리가 하나님 앞에서 갖는 담대함[a]은 이것입니다. 곧 우리가 하나님의 뜻대로 무엇이든지 구하면, 하나님께서 우리의 기도를 들으신다는 것입니다.
