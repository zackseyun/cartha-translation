revisions:
- from: 만일 누가 자기 형제가 죽음에 이르지 않는 죄를 짓고 있는 것을 보면, 그는 구하십시오. 그러면 하나님께서 그에게 — 곧 죽음에 이르지 않는 죄를 짓는 자들에게 — 생명을 주실 것입니다. 죽음에 이르는 죄가 있습니다. 그것에 관하여 구하라고 말하는 것이 아닙니다.
  to: 누구든지 자기 형제[b]가 죽음[a]에 이르지 않는 죄를 짓고 있는 것을 보면, 그는 구해야 합니다. 그러면 하나님께서[c] 그에게 생명을 주실 것입니다—곧 죽음에 이르지 않는 죄를 짓는 이들에게 말입니다. 죽음에 이르는 죄가 있습니다. 그 죄에 관하여 구해야 한다고 말하는 것은 아닙니다.
  rationale: 3인칭 주어와 합쇼체 명령형의 불일치를 바로잡고, 단수 ‘그에게’와 복수 ‘죽음에 이르지 않는 죄를 짓는 이들에게’가 함께 나타나는 원문의 난해한 구문을 대시로 보존했습니다. ‘죽음’의 성격을 특정하지 않았으며, 암시된 동사 주어를 하나님으로 명시한 번역 선택은 주석으로 투명하게 처리했습니다.
