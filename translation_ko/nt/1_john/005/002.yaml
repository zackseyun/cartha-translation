  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
  footnotes:
  - marker: a
    text: Or 'keep his commandments' or 'obey his commandments.' The Greek verb here is literally 'do' (ποιῶμεν), not the more usual 'keep' (τηρέω).
