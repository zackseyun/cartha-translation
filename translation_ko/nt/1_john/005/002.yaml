review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the principal terms, including 'children of God,' love, and commandments. However, its final clause ('곧 ... 때입니다') is syntactically detached and does not naturally express ὅταν with the present subjunctives as the condition/occasion in which this knowledge is recognized.
  naturalness: '''우리가 ... 사랑하는 것을 압니다'' is understandable but less idiomatic than ''... 사랑한다는 것을 압니다.'' The colon followed by ''곧 ... 때입니다'' is awkward in modern formal Korean. Placing the temporal clause first yields a complete, natural sentence in formal-polite register.'
  terminology: '''하나님의 자녀들,'' ''하나님,'' and ''계명'' are appropriate. ''계명들을 행하다'' is a natural biblical Korean expression and usefully reflects ποιῶμεν (''do'') rather than flattening it to the more customary ''지키다.'''
  issues:
  - severity: medium
    issue: 'The clause introduced by ὅταν is rendered as a detached copular fragment: ''곧 우리가 하나님을 사랑하고 그분의 계명들을 행할 때입니다.'''
    rationale: This construction is unnatural and leaves the logical relation unclear. The Greek presents the loving of God and doing his commandments as the temporal/conditional setting by which the stated knowledge is recognized.
  - severity: low
    issue: '''우리가 하나님의 자녀들을 사랑하는 것을 압니다'' is stylistically heavy.'
    rationale: The Korean content-clause form '사랑한다는 것을 압니다' is more idiomatic while preserving the meaning.
  revised_text: 우리가 하나님을 사랑하고 그분의 계명들을 행할 때, 이로써 우리는 하나님의 자녀들을 사랑한다는 것을 압니다.[a]
