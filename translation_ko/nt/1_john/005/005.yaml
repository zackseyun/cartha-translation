  source_fidelity: 초안은 핵심 의미를 대체로 충실히 전달합니다. 다만 원문의 단일 수사의문문(τίς ... εἰ μὴ ...)을 두 문장으로 나누면서, 앞 문장이 독립 질문처럼 들리고 뒤의 배타 조건이 다소 늦게 제시됩니다. 이를 한국어의 자연스러운 '… 외에 누가 있겠습니까?' 구조로 옮기면 εἰ μὴ의 배타성을 더 직접적으로 보존합니다.
  naturalness: '''세상을 이기는 자''와 ''믿는 자''는 이해 가능하나, 현대 표준어 합쇼체에서는 ''이''가 문맥상 더 자연스럽고 격식에도 맞습니다. ''누구이겠습니까?''도 문법상 가능하지만, ''누가 있겠습니까?''가 이 수사적 질문에 더 매끄럽습니다.'
  terminology: '''세상'', ''예수'', ''하나님의 아들''은 원문과 요한 문헌의 핵심 용어를 적절히 반영합니다. ''아들이심을''은 예수가 하나님의 아들이라는 믿음의 내용을 정확히 표현합니다.'
  issues:
  - severity: low
    issue: 원문의 εἰ μὴ(“~ 외에는/제외하고는”)가 두 번째 문장에 뒤늦게 배치되어 수사의문문의 결속이 약해집니다.
    rationale: 한 문장 안에서 '예수가 하나님의 아들이심을 믿는 이 외에'로 처리하면 원문의 배타적 질문 구조와 논리적 강조를 더 명확히 보존합니다.
