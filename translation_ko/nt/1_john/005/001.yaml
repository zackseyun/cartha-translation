review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 반영합니다. ‘예수가 메시아이심을 믿는 사람’, ‘하나님에게서 태어남’, 그리고 낳으신 분을 사랑하는 것이 그분에게서 태어난 이를 사랑함으로 이어진다는 원문의 병행 구조가 유지됩니다. 다만 ‘난 자’는 현대 표준어 산문에서 다소 고풍스럽고 사람을 가리키는 명사가 생략되어 있어, ‘태어난 사람’으로 명시하는 편이 안전합니다.
  naturalness: 합쇼체 종결은 적절하지만, ‘믿는 자마다’와 ‘난 자’는 현대적인 정중 문체보다는 전통 성경체에 가깝습니다. ‘믿는 사람은 모두’, ‘태어난 사람’이 자연스럽고 뜻도 더 분명합니다.
  terminology: ‘메시아’는 Χριστός의 칭호성을 잘 드러냅니다. γεννάω의 능동·수동 대응은 ‘낳으신 분’과 ‘태어난 사람’으로 유지했습니다. ‘하나님에게서’는 ἐκ τοῦ θεοῦ의 출처 의미를 자연스럽게 나타냅니다.
  issues:
  - severity: low
    issue: ‘믿는 자마다’, ‘그분에게서 난 자’의 문체와 지시 대상
    rationale: 의미상 오류는 없으나 ‘자’는 현대 표준어 합쇼체 산문에서 고풍스럽고, 후자의 경우 사람을 가리키는 명사가 드러나지 않습니다. ‘사람은 모두’와 ‘태어난 사람’으로 바꾸면 원문의 포괄적 분사구문과 대상을 더 자연스럽고 명료하게 전달합니다.
  revised_text: 예수께서 메시아이심을 믿는 사람은 모두 하나님에게서 태어났습니다[b]. 또 낳으신 분을 사랑하는 사람은 모두 그분에게서 태어난 사람도 사랑합니다.
  revised_footnotes:
  - marker: b
    text: 또는 “낳으신 분 … 그분에게서 난 사람.” 그리스어는 이 절 전체에서 같은 동사의 여러 형태를 사용합니다.
    reason: lexical_alternative
  - marker: a
    text: 또는 “그리스도.” 그리스어 칭호 Χριστός는 그 의미를 드러내기 위해 여기서 “메시아”로 옮겼습니다.
    reason: alternative_reading
  revision_rationale: 현대 표준어 합쇼체에 맞추어 고풍스러운 ‘자마다/난 자’를 ‘사람은 모두/태어난 사람’으로 조정했습니다. 이로써 원문의 모든 사람을 포괄하는 분사 표현과 γεννάω의 능동·수동 대조를 보존합니다. ‘메시아’ 및 γεννάω 관련 대안은 영어 POB 감사 기록에 맞추어 각주로 제시합니다.
