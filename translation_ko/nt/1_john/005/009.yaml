  text: 우리가 사람들의 증언을 받는다면, 하나님의 증언은 더 큽니다. 이는 하나님께서 자기 아들에 관하여 증언하셨다는 하나님의 증언이기 때문입니다.[a]
  philosophy: optimal-equivalence
