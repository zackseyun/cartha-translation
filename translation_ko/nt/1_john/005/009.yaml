  source_fidelity: 첫 문장의 조건절과 ‘하나님의 증언은 더 크다’는 비교는 대체로 충실합니다. 그러나 현 번역의 ‘이것이 하나님의 증언이기 때문이니’는 뒤의 절과 결합하면서, 원문의 ‘이것은 하나님께서 자기 아들에 관하여 증언하셨다는 하나님의 증언이기 때문이다’라는 설명·내용 구조를 충분히 드러내지 못합니다. 개정문은 두 번의 ‘증언’과 δεύτε ὅτι의 내용절 해석을 보존합니다.
  naturalness: ‘이는 … 때문입니다’와 ‘하나님께서 … 증언하셨다는 하나님의 증언’은 반복을 의도적으로 보존하면서도 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘사람들’은 여기서 하나님과 대조되는 일반적 인간을 자연스럽게 나타냅니다.
  terminology: μαρτυρία는 문맥의 증거·법정적 어감을 살려 일관되게 ‘증언’으로 옮겼습니다. ‘하나님’, ‘자기 아들’, ‘증언하다’는 적절하며, ‘자기 아들’은 주어인 하나님을 가리킵니다.
