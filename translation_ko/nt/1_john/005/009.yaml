  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
  footnotes:
  - marker: a
    text: Or 'the testimony of people.' The Greek says 'men' in a generic sense, contrasting human testimony with God's testimony.
    reason: lexical_alternative
  - marker: b
    text: Or 'has borne witness concerning his Son.'
    reason: lexical_alternative
  - marker: c
    text: 'The final clause may also be understood causally: ''because he has testified concerning his Son.'''
    reason: alternative_reading
translation:
