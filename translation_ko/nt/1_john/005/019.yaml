  source_fidelity: '"하나님께 속하였다는"은 ἐκ τοῦ θεοῦ의 소속·기원 관계를 대체로 전달합니다. 다만 "속해 있다"가 현대 한국어에서 더 자연스럽고, "악한 자 안에"는 ἐν τῷ πονηρῷ를 지나치게 직역하여 뜻이 불명확합니다. 문맥상 προσωπ적 의미가 유력하므로 한국어 관용에 맞게 그 지배 아래 있는 상태를 드러내되, 대안 독해는 각주로 보존하는 것이 적절합니다.'
