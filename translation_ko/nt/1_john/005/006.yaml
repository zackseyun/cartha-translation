  naturalness: ‘이분이 … 오신 분’과 ‘영이 증언하시는 분’은 현대 표준 한국어 합쇼체에서 어색하거나 의미 관계가 잠시 불분명합니다. ‘이분은 … 오신 분’ 및 ‘증언하시는 분은 영이십니다’로 고치면 자연스럽고 원문의 한정·식별 강조도 살아납니다.
