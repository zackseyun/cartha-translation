  source_fidelity: 핵심 의미는 대체로 보존되어 있습니다. 그러나 οὐχί는 문두의 강한 부정이므로 한국어에서도 먼저 독립적으로 제시하는 편이 명확하며, ὁμοίως는 앞 문맥의 재난들과의 비교를 나타내므로 각주로 ‘동일한 방식’을 반드시 뜻하지는 않음을 밝혀 두는 것이 적절합니다.
  naturalness: 현 문안의 ‘내가 너희에게 이르노니’와 ‘아니다’, ‘망하리라’는 현대 표준어 합쇼체에 비해 문어적·고어적입니다. ‘아닙니다. 내가 여러분에게 말합니다’ 및 ‘망할 것입니다’가 현대의 격식 있는 존댓말에 자연스럽습니다.
  terminology: μετανοῆτε는 단순한 사고 변화보다 하나님께 대한 ‘회개’로 옮기는 것이 문맥과 한국어 성경 용례 모두에 충실합니다. ἀπολεῖσθε는 죽음이나 영원한 정죄로 한정하지 않고 ‘망할 것입니다’로 번역하여 원문의 경고 범위를 보존합니다.
