    reason: alternative_reading
  - marker: c
    text: Greek more literally, 'I do not know you, where you are from.'
    reason: lexical_alternative
translation:
  language: ko
  text: 집의 주인이 일어나 문을 닫고 나면, 너희는 밖에 서서 문을 두드리며 ‘주님, 우리에게 문을 열어 주십시오’라고 말하기 시작할 것입니다. 그러면 그가 너희에게 대답하여 말할 것입니다. ‘나는 너희를 알지 못한다. 너희가 어디서 왔는지도 알지 못한다.’
