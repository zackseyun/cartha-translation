  terminology: ‘사탄’, ‘아브라함’, ‘안식일’, ‘매임’은 원문의 주요 용어와 한국어 성서 문체에 부합합니다. ‘아브라함의 딸’은 혈통·언약 공동체 관련 표현을 과도하게 해석하지 않고 그대로 유지합니다.
