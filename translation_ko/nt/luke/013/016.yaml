  source_fidelity: 수정안은 ταύτην ... θυγατέρα Ἀβραὰμ οὖσαν을 ‘아브라함의 딸인 이 여자’로, ἣν ἔδησεν ὁ Σατανᾶς를 ‘사탄이 매어 둔’으로 명시합니다. ἰδού는 ‘보십시오’로 보존하고, δέ는 문맥상 무리한 추론을 피하여 ‘그런데’로 옮깁니다.
