  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
  footnotes:
  - marker: a
    text: Or 'through the narrow gate.' Luke's Greek says 'door' (θύρα), while Matthew's parallel uses 'gate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「좁은 문[a]으로 들어가도록 힘쓰십시오. 내가 여러분에게 말합니다. 많은 사람이 들어가고자 할 것이나, 들어갈 수 없을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “좁은 문을 통하여.” 누가복음의 그리스어는 ‘문’(θύρα)이라고 하며, 마태복음의 병행 구절은 ‘문’과 다른 단어인 ‘문간/대문’(πύλη)을 사용합니다.
    reason: Luke uses θύρα, ordinarily ‘door,’ rather than the term for ‘gate’ used in Matthew’s parallel; the note preserves this lexical distinction.
