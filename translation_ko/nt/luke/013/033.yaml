source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
  footnotes:
  - marker: a
    text: Or 'it cannot be' or 'it is unthinkable' for a prophet to perish outside Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'today and tomorrow and the next day' may function idiomatically for a short, fixed course rather than specifying three literal calendar days.
    reason: cultural_note
translation:
  language: ko
  text: 「그러나 나는 오늘도 내일도 그다음 날도 계속 길을 가야 합니다.[a] 예언자가 예루살렘 밖에서 죽는 일은 있을 수 없기 때문입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오늘과 내일과 그다음 날’입니다. 이 표현은 반드시 달력상의 사흘을 뜻하기보다, 짧고 정해진 앞으로의 과정을 가리키는 관용적 표현일 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘될 수 없습니다’ 또는 ‘상상할 수 없는 일입니다’. 이 표현은 예언자가 예루살렘 밖에서 죽는 일이 불가능하거나 부당하거나 상상할 수 없다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
