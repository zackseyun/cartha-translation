  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
  footnotes:
  - marker: a
    text: Or 'his opponents' for 'those who were opposing him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the wonderful things' or 'all the splendid things.' The Greek says 'the glorious things,' a broad expression that can include his mighty deeds.
    reason: lexical_alternative
