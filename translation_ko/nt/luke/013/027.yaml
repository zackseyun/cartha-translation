    rationale: καί는 여기서 단순 연결(‘그리고/또’)이며, 원문에 없는 역접을 도입하지 않아야 합니다.
  - severity: medium
    issue: 인용부호가 중첩되어 있음
    rationale: 이 절에는 한 겹의 직접 인용만 필요하므로 겹낫표를 제거해야 합니다.
  - severity: low
    issue: 직접 인용의 문체가 목표 합쇼체와 일관되지 않음
    rationale: 목표 변종이 현대 공식-공손체이므로 ‘알지 못합니다’, ‘떠나가십시오’가 일관됩니다.
  revised_text: 그리고 그는 너희에게 이렇게 말할 것입니다. “나는 너희가 어디에서 왔는지 알지 못합니다. 불의를 행하는 모든 자들아, 내게서 떠나가십시오.”
