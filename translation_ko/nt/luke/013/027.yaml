  source_fidelity: 초안의 ‘그러나’는 접속사 καί를 역접으로 바꾸므로 ‘그리고’로 고쳐야 합니다. 또한 ἐρεῖ λέγων은 한국어에서 ‘이렇게 말할 것입니다’로 자연스럽게 반영할 수 있습니다. πόθεν ἐστέ, ἀπόστητε ἀπ’ ἐμοῦ, πάντες ἐργάται ἀδικίας의 의미는 수정문에서 유지했습니다.
  naturalness: 겹낫표와 문장부호가 부자연스럽고, 직접 인용 안의 명령을 합쇼체 기준에 맞추는 것이 좋습니다. ‘불의를 행하는 모든 자들아’는 엄중한 호격을 자연스럽게 살립니다.
  terminology: ἀδικία는 ‘불의’로 옮겨 ‘불의를 행하는 자들’로 표현했습니다. 이는 ‘불의한 자들’보다 ἐργάται(행하는 자들)의 행위·실천의 뉘앙스를 더 잘 보존합니다.
  issues:
