    reason: lexical_alternative
  revision_rationale: 원문의 οὖν을 ‘그래서’로, 미완료 Ἔλεγεν을 ‘말씀하고 계셨습니다’로 반영했습니다. 두 병행 의문문은 현대 합쇼체로 통일하고, δεύτε 번째 질문의 1인칭 화자와 비교 대상(‘그것’)을 명시했습니다. ‘하나님의 나라’는 유지하되 βασιλεία의 통치 의미를 각주에서 열어 두었습니다.
