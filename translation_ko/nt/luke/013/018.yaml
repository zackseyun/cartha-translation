  source_fidelity: 초안은 ‘하나님의 나라’와 두 비교 질문의 기본 의미를 대체로 충실히 옮깁니다. 그러나 Ἔλεγεν의 미완료 과거는 단순한 ‘이르셨습니다’보다 진행적·반복적 발화의 뉘앙스를 지니며, δεύτε 번째 질문의 1인칭 주어와 미래/숙고의 어조를 한국어에서 더 분명히 드러낼 필요가 있습니다.
  naturalness: ‘그리고’보다 문맥 연결을 나타내는 ‘그래서’가 οὖν에 더 알맞고 현대 한국어 합쇼체에도 자연스럽습니다. ‘무엇과 같을까?’와 ‘무엇에 비할까?’는 인용문 안에서 해라체식 독백처럼 들릴 수 있으므로 ‘무엇과 같습니까? … 무엇에 비하겠습니까?’로 통일하는 것이 적절합니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ의 확립된 표준 번역으로 유지합니다. 다만 이 표현이 영토뿐 아니라 하나님의 통치도 가리킬 수 있으므로, 본문의 비유적 용법을 제한하지 않는 대안 번역을 각주로 제시합니다.
  issues:
  - severity: medium
    issue: Ἔλεγεν의 미완료상 누락
    rationale: ‘이르셨습니다’는 단순 과거로 읽혀, 원문의 진행적 또는 반복적 발화 뉘앙스를 충분히 반영하지 못합니다.
  - severity: medium
    issue: 두 번째 질문의 1인칭 및 숙고적 미래 어조가 불명확함
    rationale: ‘내가 무엇에 비할까?’는 문체상 독백처럼 들리고 합쇼체 인용문의 높임말과도 맞지 않습니다. ‘내가 그것을 무엇에 비하겠습니까?’가 주어·목적어와 의문 어조를 명확히 합니다.
  - severity: low
    issue: οὖν의 연결 표현
    rationale: ‘그리고’는 단순 접속에 가깝습니다. ‘그래서’는 앞 문맥을 이어 주는 οὖν의 담화적 기능을 더 잘 살립니다.
  revised_text: 그래서 예수께서는 말씀하고 계셨습니다. “하나님의 나라[a]는 무엇과 같습니까? 내가 그것을 무엇에 비하겠습니까?”
  revised_footnotes:
