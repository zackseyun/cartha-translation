  source_fidelity: 원문의 οὖν, 미완료 과거 Ἔλεγεν, 그리고 두 번째 질문의 목적어 αὐτήν을 더 분명히 반영할 필요가 있습니다. 특히 직접 인용문의 높임말 종결도 초안의 합쇼체 요구와 맞지 않습니다.
  naturalness: ‘무엇과 같습니까? … 무엇에 비하겠습니까?’는 현대 표준 한국어의 자연스러운 비교 질문입니다. ‘말씀하고 계셨습니다’는 Ἔλεγεν의 진행·반복적 서술 배경을 무리 없이 살립니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ의 전통적이고 적절한 번역입니다. 이는 영역과 하나님의 통치라는 의미 범위를 모두 열어 둡니다.
  issues:
  - severity: medium
    issue: 직접 인용문이 합쇼체가 아닙니다.
    rationale: 초안의 ‘같을까?’, ‘비할까?’는 해라체/독백형 종결이며, 지정된 현대 공식 존댓말(합쇼체)에 맞지 않습니다.
  - severity: medium
    issue: 두 번째 비교 질문의 목적어가 명시되지 않았습니다.
    rationale: τίνι ὁμοιώσω αὐτήν에서 αὐτήν은 ‘하나님의 나라’를 가리킵니다. 한국어에서도 ‘그것을’을 넣어 비교 대상이 하나님의 나라임을 명료하게 보존하는 것이 안전합니다.
  - severity: low
    issue: Ἔλεγεν의 미완료상과 οὖν의 연결 기능이 약화되었습니다.
    rationale: ‘이르셨습니다’와 ‘그리고’도 불가능하지는 않지만, ‘말씀하고 계셨습니다’와 ‘그래서’가 각각 진행적 서술과 문맥상 연결을 더 잘 드러냅니다.
  revised_text: 그래서 예수께서 말씀하고 계셨습니다. 「하나님의 나라는 무엇과 같습니까? 내가 그것을 무엇에 비하겠습니까?」
  revised_footnotes:
  - marker: a
    text: 또는 ‘하나님의 통치’. 이는 영토나 영역보다 하나님께서 다스리심을 강조합니다.
    reason: lexical_alternative
  revision_rationale: 원문의 질문 형식과 αὐτήν의 지시 대상을 보존하고, 번역문 전체와 예수의 직접 발화를 현대 공식 존댓말로 통일했습니다. ‘하나님의 나라’는 본문의 비유적 표현과 전통적 용례를 유지하며, 각주에서 ‘통치’라는 의미 가능성을 제시합니다.
