    issue: Register and verbal aspect
    rationale: '"쫓겨난" presents the expulsion as completed, whereas ἐκβαλλομένους is a present passive participle. "-리라" is not the specified modern formal-polite 합쇼체.'
  - severity: low
    issue: Modern terminology and added nuance
    rationale: '"선지자" is an older church-register term; "예언자" is modern standard. "슬피" adds a specific emotive nuance beyond the Greek''s simple "weeping."'
