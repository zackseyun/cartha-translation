  verdict: revise
  source_fidelity: The draft correctly retains the patriarchs, all the prophets, the kingdom of God, exclusion, and the resulting anguish. However, "슬피" adds an intensity not explicitly stated by κλαυθμός, "선지자" is less suitable than modern standard "예언자," and the past participle "쫓겨난" does not reflect the Greek present passive participle ἐκβαλλομένους as closely as "내쫓기는."
  naturalness: The verse is understandable, but the repeated "것을 보고 ... 것을 볼 때에" is heavy, and the -리라 ending is elevated literary style rather than the requested modern formal-polite 합쇼체. A compact future expression with "것입니다" is natural and preserves the prediction.
  terminology: Use "예언자" for προφῆται in modern standard Korean. "하나님의 나라" appropriately preserves βασιλεία τοῦ θεοῦ. "울며 이를 갈 것입니다" is an idiomatic Korean rendering of the fixed expression "weeping and gnashing of teeth" without importing a theological interpretation.
  issues:
