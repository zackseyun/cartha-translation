  naturalness: 합쇼체와 현대 표준어에 맞추어 ‘그런데 보십시오’와 ‘온전히 몸을 펼 수 없었습니다’로 다듬었습니다. ‘연약함의 영’은 다소 낯설 수 있으나 원문의 표현과 의도적 모호성을 보존하며, 각주로 설명할 수 있습니다.
