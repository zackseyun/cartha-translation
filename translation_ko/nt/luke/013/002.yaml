  source_fidelity: The Korean accurately conveys the question’s participants, comparison ('beyond all the Galileans'), and causal connection between their suffering and the supposition that they were exceptional sinners. The Greek aorist ἐγένοντο can be expressed idiomatically here by the Korean predicate '죄인이라고'; forcing '죄인이 되었다고' would be less natural and could misleadingly suggest that suffering caused them to become sinners.
  naturalness: The wording is clear, idiomatic Standard Korean, and consistently uses modern formal-polite 합쇼체. '이런 일을 당하였으니' naturally introduces the stated grounds for the question.
