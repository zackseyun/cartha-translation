review_pass:
  verdict: revise
  source_fidelity: The draft changes the conditional κἂν ... ποιήσῃ ('and if it bears') into a future assertion ('it will bear') and adds 'then' (그때에), which is not in the Greek. It also renders the future indicative ἐκκόψεις as an imperative ('cut it down'). The revision restores the conditional contrast, the general future sense of εἰς τὸ μέλλον, and the future prediction addressed to the owner.
  naturalness: ‘그리고 그것이 앞으로 열매를 맺는다면—그렇지 않으면, 당신이 그것을 베어 버리실 것입니다.’ is natural modern formal-polite Korean. The dash appropriately carries the Greek’s ellip­tical first half of the μέν...δέ contrast without supplying a specific favorable outcome.
  terminology: 열매를 맺다 is the standard Korean agricultural/metaphorical expression for ποιεῖν καρπόν. 베어 버리다 accurately conveys ἐκκόπτω in the image of a tree being cut down. The honorific future ‘버리실 것입니다’ naturally reflects the gardener’s address to the owner; it does not add theological interpretation.
  issues:
  - severity: high
    issue: Conditional verb rendered as a future assertion
    rationale: 'ποιήσῃ is in an ἐάν conditional clause: ‘if it bears fruit,’ not ‘it will bear fruit.’'
  - severity: high
    issue: Future indicative rendered as an imperative
    rationale: ἐκκόψεις means ‘you will cut [it] down,’ whereas ‘잘라 버리십시오’ is a command and reverses the speech act.
  - severity: medium
    issue: Unsupported temporal addition
    rationale: ‘그때에’ adds a temporal element absent from the Greek. εἰς τὸ μέλλον is general, ‘for the future/in the time to come,’ not specifically ‘then.’
  - severity: low
    issue: Duplicated quotation marks
    rationale: The draft has doubled opening and closing quotation marks. The revised verse supplies plain verse text, avoiding a mismatched quotation boundary because the direct speech begins in the preceding verse.
  revised_text: 그리고 그것이 앞으로 열매를 맺는다면—그렇지 않으면, 당신이 그것을 베어 버리실 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘장차’ 또는 ‘다가오는 때에’. 헬라어는 ‘내년’을 명시하지 않으며, 앞 절의 시간 표현을 따라 그렇게 구체화하는 번역도 있습니다.
    reason: alternative_reading
  revision_rationale: The revision corrects the conditional and future verbal force, removes the unsupported ‘then,’ and retains the source’s deliberately non-specific temporal expression. The first conditional outcome remains elliptical, as in the Greek, rather than importing ‘well and good’ or ‘next year’ into the text.
