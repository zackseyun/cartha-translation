review_pass:
  verdict: revise
  source_fidelity: 'The draft does not preserve the conditional construction: ποιήσῃ is rendered as a future assertion (''will bear''), and ἐκκόψεις, a future indicative (''you will cut down''), is changed to an imperative (''cut ... please''). The added ''그때에'' is not expressed in the Greek.'
  naturalness: The revised wording is natural modern formal-polite Korean and retains the concise, elliptical favorable outcome of the first conditional clause.
  terminology: '''열매를 맺다'' appropriately renders ποιεῖν καρπόν, and ''잘라 버리다'' naturally conveys the horticultural force of ἐκκόπτω. ''앞으로'' reflects εἰς τὸ μέλλον without importing a specific ''next year'' into the text.'
  issues:
  - severity: high
    issue: Conditional and verbal mood/aspect are mistranslated.
    rationale: The Greek says, 'if it bears fruit ...; but if not, you will cut it down.' The draft says it will bear fruit and then commands the addressee to cut it down.
  - severity: medium
    issue: The temporal phrase is over-specified.
    rationale: '''그때에'' (''at that time/then'') has no direct basis in εἰς τὸ μέλλον, which more generally refers to the future or coming time.'
  - severity: low
    issue: Duplicated quotation marks.
    rationale: The draft has doubled opening and closing quotation marks.
  revised_text: 「그리고 앞으로[a] 열매를 맺으면 좋습니다. 그러나 그렇지 않으면, 당신이 그것을 잘라 버릴 것입니다.」
  revised_footnotes:
  - marker: a
    text: 또는 ‘내년에’. 그리스어는 직전 절의 ‘올해’를 되풀이하지 않고, 더 일반적으로 ‘앞으로’ 또는 ‘다가오는 때에’를 뜻합니다.
    reason: alternative_reading
  revision_rationale: The revision restores the conditional sense of κἂν ... ποιήσῃ and the future-indicative force of ἐκκόψεις, removes the unsupported temporal addition, and preserves the Greek's non-specific future timeframe with a footnote noting the contextual alternative 'next year.'
