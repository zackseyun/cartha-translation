  source_fidelity: 수정안은 ἢ의 계속되는 대조적 예시를 ‘또’로, ἐκεῖνοι οἱ δεκαοκτώ를 ‘그 열여덟 명’으로, ἔπεσεν ... καὶ ἀπέκτεινεν αὐτούς를 ‘망대가 무너져 그들을 죽였던’으로 충실히 반영합니다. ὀφειλέται의 비유적·도덕적 함의를 본문에서 성급히 ‘죄인’으로 확정하지 않고 ‘빚진 사람들’로 유지하며, ἐγένοντο의 변화 동사도 ‘되었다’로 드러냅니다.
  naturalness: 초안의 ‘망대가 무너져 죽인 그 열여덟 명’은 ‘죽인’의 목적어가 관계절 밖에 놓여 한국어 문장 구조상 부자연스럽고 순간적으로 의미가 걸립니다. ‘망대가 무너져 그들을 죽였던 그 열여덟 명’으로 고치면 수식 관계가 명료합니다. 또한 ‘더 큰 빚진 자’보다 ‘더 큰 빚을 진 사람들’이 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘실로암’, ‘망대’, ‘예루살렘’은 적절합니다. ὀφειλέται는 직역적 표현인 ‘빚진 사람들’을 유지하되, 이 문맥에서 도덕적 책임을 가리킬 수 있다는 대안을 각주로 밝혀 독자가 금융상 채무로만 오해하지 않도록 합니다.
  issues:
  - severity: medium
    issue: 관계절의 목적어가 불명확함
    rationale: ‘망대가 무너져 죽인 그 열여덟 명’은 한국어에서 망대가 누구를 죽였는지가 관계절 안에서 명시되지 않아 문법적 연결이 매끄럽지 않습니다. 헬라어 αὐτούς(그들을)를 ‘그들을’으로 보완해야 합니다.
  - severity: low
    issue: ‘더 큰 빚진 자’의 현대어 자연성
    rationale: 의미는 추정 가능하지만 ‘더 큰 빚진 자’는 비교 대상과 ‘빚진’의 수식 관계가 다소 어색합니다. ‘더 큰 빚을 진 사람들’이 비교와 복수 표현을 자연스럽게 전달합니다.
  revised_text: 「또 실로암에 있던 망대가 무너져 그들을 죽였던 그 열여덟 명이 예루살렘에 사는 모든 사람보다 더 큰 빚을 진 사람들이 되었다고 생각하느냐?」
  revised_footnotes:
  - marker: a
    text: ‘빚진 사람들’은 문자적으로는 채무자를 뜻하지만, 여기서는 도덕적 책임이 더 큰 사람들 또는 더 큰 죄인들이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 한국어 관계절의 목적어를 명시하여 재난으로 망대가 그 열여덟 명을 죽였다는 원문의 관계를 분명히 했습니다. ‘빚진 사람들’은 ὀφειλέται의 표현상 긴장을 보존하고, 각주에서 가능한 도덕적 의미를 제시했습니다. ‘되었다’는 ἐγένοντο를 반영합니다.
