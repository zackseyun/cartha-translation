    issue: ‘망대가 무너져 죽인 그 열여덟 명’의 수식 구조
    rationale: 그리스어는 망대가 그들 위로 무너져 그들을 죽였다는 뜻입니다. 초안의 어순은 ‘무너져 죽인’이 부자연스럽고 사건 관계를 흐립니다.
  - severity: medium
    issue: ‘더 큰 빚진 자라고’
    rationale: 복수 대상에 단수 ‘자’가 결합되고, ‘더 큰 빚진 자’는 현대 한국어에서 자연스럽지 않습니다. 또한 ἐγένοντο의 ‘되었다’가 빠져 있습니다.
  revised_text: 「또 실로암의 망대가 무너져 죽게 된 그 열여덟 사람이 예루살렘에 사는 다른 모든 사람보다 더 큰 빚을 진 자들이 되었다고 생각하느냐?[a][b]」
  revised_footnotes:
