    text: ‘빚을 진 자들’은 문자적으로는 채무자를 뜻합니다. 여기서는 도덕적 책임 또는 죄책의 뜻을 함축할 수 있습니다. 또는 ‘죄인들’이나 ‘더 큰 잘못을 저지른 자들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예루살렘에 사는 모든 이들.’ 그리스어 ἀνθρώπους는 일반적으로 사람들, 곧 인간을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 본문은 망대 붕괴의 피해자들을 가리키는 관계절을 자연스럽게 재구성하고, ὀφειλέται를 ‘빚을 진 자들’로 보존하여 원문의 의도적인 어휘 차이를 유지했습니다. ‘더 큰’은 비교의 강도를, ‘되었다고’는 ἐγένοντο를 반영합니다. 각주는 ‘빚’이 단순한 금전 채무로만 오해되지 않도록 하되, 본문에서 ‘죄인’으로 단정하지 않게 합니다.
