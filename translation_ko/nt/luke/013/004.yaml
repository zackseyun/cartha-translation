source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
  footnotes:
  - marker: a
    text: Or 'sinners' or 'worse offenders' for 'debtors'; the Greek uses ὀφειλέται, literally 'debtors,' likely in a moral sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the people living in Jerusalem.' The Greek ἀνθρώπους can refer to human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 「또 실로암의 망대가 무너져 죽게 된 그 열여덟 사람이 예루살렘에 사는 다른 모든 사람보다 더 큰 빚을 진 자들이 되었다고 생각하느냐?[a][b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빚을 진 자들’은 문자적으로는 채무자를 뜻합니다. 여기서는 도덕적 책임 또는 죄책의 뜻을 함축할 수 있습니다. 또는 ‘죄인들’이나 ‘더 큰 잘못을 저지른 자들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예루살렘에 사는 모든 이들.’ 그리스어 ἀνθρώπους는 일반적으로 사람들, 곧 인간을 가리킬 수 있습니다.
    reason: lexical_alternative
