  verdict: revise
  source_fidelity: The draft retains the repeated lamenting address, the characteristic present-participle portrayal of Jerusalem, the contrast between Jesus' desire and the addressees' refusal, and the maternal bird image. However, its archaic Korean forms obscure the requested modern formal-polite register. The singular address to Jerusalem and plural final addressees should remain distinguishable.
  naturalness: Expressions such as “것이 몇 번이더냐” and “원치 아니하였다” are archaic literary forms rather than contemporary 합쇼체. “돌로 치는” is understandable but less idiomatic and less precise than “돌로 쳐 죽이는” in this judicial-execution context.
  terminology: “예언자들” is standard modern Korean for προφήτας. “암탉” appropriately renders the contextual maternal sense of ὄρνις, while “새끼들” conveys the collective brood image without unwarranted interpretation.
  issues:
