    rationale: “몇 번이더냐” and “원치 아니하였다” do not meet the requested modern formal-polite 합쇼체. Modern forms preserve the rhetoric and verbal contrast more naturally.
  - severity: low
    issue: Rendering of λιθοβολοῦσα
    rationale: “돌로 치는” can be read broadly as striking with stones. “돌로 쳐 죽이는” more clearly conveys the established sense of stoning to death in this context.
  - severity: low
    issue: Singular/plural address should be maintained clearly
    rationale: The city is addressed in the singular (“네게,” “네 자녀들”), but the final Greek verb is plural, referring to its people. The revised text retains this deliberate shift.
