  to: 그러나 주께서 그에게 대답하여 말씀하셨습니다. “위선자들아, 너희 각 사람이 안식일에 자기 소나 나귀를 구유[a]에서 풀어 끌고 가서 물을 마시게 하지 아니하느냐?”
