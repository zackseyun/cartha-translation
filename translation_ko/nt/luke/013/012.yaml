  verdict: revise
  source_fidelity: 초안의 ‘보시고’, ‘부르시어 이르셨습니다’, ‘여자여’는 각각 ἰδών, προσεφώνησεν καὶ εἶπεν, Γύναι를 대체로 충실히 옮깁니다. 그러나 ‘병약함’은 ἀσθένεια의 넓은 의미를 다소 부자연스럽게 좁히며, ‘놓였다’는 완료 수동태 ἀπολέλυσαι의 완료된 해방과 현재의 결과를 한국어에서 충분히 드러내지 못합니다.
  naturalness: ‘예수께서 그 여자를 보시고 불러 말씀하셨습니다’는 현대 표준어 합쇼체에서 자연스럽고, 부름과 이어지는 발화를 매끄럽게 나타냅니다. ‘당신은 당신의 연약함에서 풀려났습니다’는 존중하는 호격과 직접 발화에 어울리며 원문의 넓은 표현도 보존합니다.
  terminology: Γύναι는 직역적이면서 성경 문체에 정착한 ‘여자여’로 유지합니다. ἀσθένεια는 특정 진단이나 장애 범주를 덧붙이지 않는 ‘연약함’으로, ἀπολέλυσαι는 ‘풀려났습니다’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘병약함’은 ἀσθένεια의 의미 범위를 다소 협소하고 어색하게 표현합니다.
    rationale: 문맥상 신체적 고통을 가리키지만, 원어는 질병·허약·연약함을 포괄할 수 있습니다. ‘연약함’이 더 넓고 자연스럽습니다.
  - severity: medium
    issue: ‘놓였다’는 완료 수동태의 완료성과 현재 유효성을 충분히 반영하지 못합니다.
    rationale: ἀπολέλυσαι는 ‘이미 풀려난 상태’라는 뜻입니다. ‘풀려났습니다’가 수동성과 완료된 해방을 더 명확히 드러냅니다.
  - severity: low
    issue: 영어 감사 추적의 각주 위치는 ‘her’에 있으나, 각주의 내용은 ἀπολέλυσαι의 대안 번역에 관한 것입니다.
    rationale: 한국어에서는 대안이 적용되는 ‘풀려났습니다’에 각주를 붙여 의미상 올바른 연결을 제시합니다.
