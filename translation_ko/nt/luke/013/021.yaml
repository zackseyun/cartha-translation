source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
  footnotes:
  - marker: a
    text: Or 'yeast.' The Greek term refers to leavening agent used in dough.
    reason: lexical_alternative
  - marker: b
    text: Greek 'three sata' (about three seahs), a large quantity of flour.
    reason: cultural_note
  - marker: c
    text: Or 'mixed into' for 'hid'; the Greek verb is literally 'hid' or 'concealed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 한 여자가 누룩[a]을 가져다가 가루 세 말[b] 속에 감추어[c], 온통 부풀게 될 때까지 둔 누룩과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스트’. 헬라어는 반죽을 부풀게 하는 발효제를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘가루 세 사타’. 사타는 세아에 해당하는 고대 건량 단위입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘섞어 넣어’. 헬라어 동사는 문자적으로는 ‘감추다’ 또는 ‘숨기다’라는 뜻입니다.
    reason: lexical_alternative
