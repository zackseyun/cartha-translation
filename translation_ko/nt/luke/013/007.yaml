  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
  footnotes:
  - marker: a
    text: Or “Why should it also make the soil useless?” The Greek verb can carry the sense of rendering the ground unproductive, not merely occupying space.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 포도원지기에게 말하였습니다. “보십시오, 내가 삼 년째 이 무화과나무에서 열매를 찾아오지만 찾지 못합니다. 그것을 베어 버리십시오. 왜 이 나무가 땅까지 못 쓰게 합니까?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왜 이 나무가 땅을 쓸모없게 만듭니까?”
    reason: καταργέω는 이 문맥에서 땅을 단지 차지한다는 뜻보다 땅을 쓸모없게 하거나 생산성을 잃게 한다는 뜻을 나타낼 수 있습니다.
