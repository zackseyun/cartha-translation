  terminology: ἔσχατοι/πρῶτοι의 대조는 해석을 덧붙이지 않고 각각 ‘마지막인’/‘먼저인’으로 유지했습니다. ‘사람들’을 보충하지 않아 원문의 포괄성과 간결성도 보존했습니다.
