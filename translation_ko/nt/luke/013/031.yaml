  verdict: revise
  source_fidelity: 초안은 전체 의미를 충실히 옮겼습니다. 그러나 ‘다른 곳으로’는 ἐντεῦθεν(‘여기서/이곳을 떠나’)에 없는 목적지 정보를 보태므로 삭제하는 것이 안전합니다. 또한 θέλει는 단순한 미래 의도보다 ‘원하다’의 뜻을 유지하는 표현이 더 적절합니다.
  naturalness: ‘바로 그 시각에’, ‘다가와서’, ‘말하였습니다’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. 명령문은 ‘이곳을 떠나 가십시오’로 간결하고 자연스럽게 표현할 수 있습니다.
  terminology: ‘바리새인들’과 ‘헤롯’은 통용되는 표준 성경 인명·집단명 표기입니다. 화자를 명확히 하는 ‘예수께’는 한국어 문맥상 자연스러우며 의미를 변경하지 않습니다.
  issues:
