    rationale: ἐντεῦθεν은 현재 장소로부터 떠남을 뜻할 뿐, ‘다른 곳’이라는 목적지를 명시하지 않습니다. 번역은 ‘이곳을/여기를 떠나’로 제한해야 합니다.
  - severity: low
    issue: ‘죽이려 합니다’가 θέλει의 ‘원하다’보다 의도·계획의 뉘앙스를 다소 강하게 할 수 있음
    rationale: θέλει의 기본 의미인 의지·바람을 ‘죽이고자 합니다’로 옮기면 원문의 의미를 더 직접적으로 보존합니다.
