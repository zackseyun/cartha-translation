  source_fidelity: 초안의 ‘안나스와 가야바가 대제사장으로 있을 때’는 단수 ἀρχιερέως를 두 사람이 각각 대제사장이었던 것처럼 평탄화합니다. 또한 광야가 요한의 위치/상황을 나타내는 연결을 더 분명히 할 수 있습니다.
  naturalness: ‘안나스와 가야바의 대제사장직 때에’는 다소 문어적이지만, 누가의 연대기적 서술과 원문의 단수 표현을 보존하는 데 적절합니다. 나머지 문장은 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘대제사장직’, ‘하나님의 말씀’, ‘광야’, ‘스가랴’, ‘요한’은 적절합니다. ῥῆμα θεοῦ의 예언적 관용 표현은 ‘하나님의 말씀이 … 임했습니다’로 잘 옮겨집니다.
  issues:
  - severity: medium
    issue: 단수 ‘대제사장직’의 평탄화
    rationale: 원문은 단수 ἀρχιερέως와 안나스·가야바 두 이름을 함께 제시합니다. 초안의 ‘안나스와 가야바가 대제사장으로 있을 때’는 이 긴장을 해소하여 두 사람이 동등하게 재직한 듯 표현합니다. 단수 제도적 표현을 유지하고 주석으로 설명하는 편이 안전합니다.
  - severity: low
    issue: ‘광야에서’의 수식 관계
    rationale: 초안도 가능한 번역이지만, ‘광야에 있던’으로 옮기면 요한이 광야에 있던 상황에서 말씀이 그에게 임했다는 원문의 연결을 한국어에서 더 분명히 드러냅니다.
  revised_text: 안나스와 가야바[a]의 대제사장직 때에, 하나님의 말씀이 광야에 있던 스가랴의 아들 요한에게 임했습니다.
