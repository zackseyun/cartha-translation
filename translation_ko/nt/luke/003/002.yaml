  source_fidelity: 초안의 ‘안나스와 가야바가 대제사장으로 있을 때’는 단수 ἀρχιερέως(‘대제사장직/대제사장 재임’)를 복수 인물의 동시 직임으로 평탄화합니다. 본문은 단수 표현을 유지하면서 두 사람을 함께 언급하므로, 한국어도 이 긴장을 보존해야 합니다. 나머지 ‘하나님의 말씀이 … 요한에게 임했습니다’와 ‘광야에서’는 원문의 예언자적 관용구와 장소 표현을 충실히 옮깁니다.
  naturalness: ‘안나스와 가야바의 대제사장직 때에’는 현대 표준 한국어로 이해 가능하며, 본문의 연대기적 도입에 어울리는 격식 있는 합쇼체 문장입니다. ‘스가랴의 아들 요한에게 광야에서’는 요한과 계시 사건의 광야 배경을 자연스럽게 제시합니다.
  terminology: 안나스, 가야바, 스가랴는 통용되는 한국어 성경식 인명 표기입니다. ‘대제사장직’은 단수 ἀρχιερέως를 제도적으로 보존하고, ‘하나님의 말씀’ 및 ‘임했습니다’는 ῥῆμα θεοῦ의 예언자적 표현에 적절합니다.
