    reason: lexical_alternative
  - marker: b
    text: 일부 전승은 구약의 특정 계보 형태와 더 가깝게 맞추기 위해 여기서 가이난을 생략합니다.
    reason: textual_variant
  - marker: c
    text: ‘아르박삿’은 누가복음의 그리스어 형태를 따른 표기입니다. 구약의 이름은 흔히 ‘아르박삿’과 다소 다른 형태로 음역되기도 합니다.
    reason: cross_reference
