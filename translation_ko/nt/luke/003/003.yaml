  source_fidelity: '''요단강 주변 온 지역을 다니며''는 해당 지역을 두루 다녔다는 뜻은 전달하지만, ἦλθεν εἰς(그 지역에 왔다/들어갔다)를 별도로 나타내지 않고 ''다니다''로 바꿉니다. 이를 보완하는 것이 원문에 더 충실합니다. ''죄 사함을 위한 회개의 세례''는 βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν의 관계를 과도하게 해석하지 않고 잘 보존합니다.'
