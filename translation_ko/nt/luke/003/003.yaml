  terminology: '''세례'', ''회개'', ''죄 사함''은 통용되는 성경 번역 용어이며, 교파적 해석을 덧붙이지 않습니다. ''선포하였습니다''는 κηρύσσων의 공적 고지/선포의 뉘앙스를 적절히 살립니다.'
