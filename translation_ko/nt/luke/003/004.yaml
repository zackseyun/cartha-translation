    rationale: ‘광야에서’는 ‘외치는 이’를 수식하는 것이 자연스럽지만, 이어지는 명령에 연결하는 해석도 가능하므로 각주로 보존하는 것이 적절합니다.
  - severity: low
    issue: βίβλῳ λόγων의 ‘λόγων’ 의미가 약화됨
    rationale: ‘예언자 이사야의 말씀을 담은 책’은 두 명사를 자연스러운 한국어로 반영합니다.
