source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
  footnotes:
  - marker: a
    text: Or 'winnowing shovel' or, traditionally, 'winnowing fan.' The Greek term refers to the implement used to toss grain into the air for separation.
    reason: lexical_alternative
  - marker: b
    text: Or 'barn' or 'granary' for 'storehouse.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with inextinguishable fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 손에는 키[a]가 들려 있고, 그분께서는 자신의 타작마당을 말끔히 정리하여 알곡을 자신의 곳간[b]에 모아들이시고, 쭉정이는 꺼지지 않는 불[c]에 태워 버리실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘까부르는 삽’; 전통적으로 ‘까부르는 부채’. 곡식을 공중에 던져 알곡과 쭉정이를 가르는 데 쓰는 도구를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘창고’ 또는 ‘곡물 창고’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘꺼지지 않을 불’ 또는 ‘끌 수 없는 불’.
    reason: lexical_alternative
