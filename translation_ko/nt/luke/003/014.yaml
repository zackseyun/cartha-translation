  to: 군인들도 그에게 물었습니다. 「우리도 무엇을 해야 합니까?」 그가 그들에게 말했습니다. 「아무에게도 강탈하여 빼앗지 말고, 아무도 거짓으로 고발하지 말며, 여러분의 봉급에 만족하십시오.」
