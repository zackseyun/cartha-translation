review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the speakers as soldiers and preserves the ethical commands and the instruction to be content with their pay. However, "그러면" introduces an inferential nuance not expressed by καὶ ἡμεῖς, and the universal object of the second prohibition (μηδένα) should be explicit in Korean as it is for the first.
  naturalness: The narrative is clear, but "거짓 고발하지 말며" is slightly elliptical without an object. A modern formal-polite rendering of the direct commands is more consistent with the requested 합쇼체 register.
  terminology: '"봉급" is an appropriate rendering of ὀψώνια in this military context. "강탈하여 빼앗다" conveys coercive extortion without narrowing the sense to a particular monetary transaction.'
  issues:
  - severity: medium
    issue: '"그러면" adds an unwarranted inferential sense.'
    rationale: The Greek καὶ ἡμεῖς emphasizes that the soldiers ask what they too should do; it does not mean "then" or draw an explicit inference.
  - severity: medium
    issue: The second prohibition lacks an explicit equivalent for μηδένα ("anyone").
    rationale: The Greek gives the universal object with both διασείσητε and συκοφαντήσητε. Korean should explicitly prohibit falsely accusing anyone.
  - severity: low
    issue: The quoted imperatives do not consistently use the requested modern formal-polite register.
    rationale: '"만족하십시오" provides a natural plural formal imperative in the target register.'
  revised_text: 군인들도 그에게 물었습니다. 「우리도 무엇을 해야 합니까?」 그가 그들에게 말했습니다. 「아무에게도 강탈하여 빼앗지 말고, 아무도 거짓으로 고발하지 말며, 여러분의 봉급에 만족하십시오.」
