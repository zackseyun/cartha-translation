  source_fidelity: 수정이 필요합니다. 초안의 ‘비둘기 같은 형체’는 성령의 현현이 ‘몸의 형체로’ 나타났고 그것이 비둘기에 비유된다는 σωματικῷ εἴδει ὡς περιστερὰν의 두 요소를 충분히 드러내지 못합니다. 또한 εὐδόκησα는 아오리스트이므로 한국어 본문에서는 과거형으로 옮기는 것이 안전합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서도, ‘한 음성이 하늘에서 들려왔습니다’와 같이 자연스러운 서술을 사용합니다. 직접 인용에서는 하나님이 예수님께 말씀하시는 장면에 맞게 ‘너’라는 2인칭을 유지했습니다.
  terminology: ‘성령’, ‘사랑하는 아들’은 적절합니다. ‘비둘기와 같은 몸의 형체’는 성령이 실제 비둘기가 되었다고 단정하지 않고 비교 표현 ὡς를 보존합니다.
  issues:
