    issue: ‘비둘기 같은 형체’가 ‘몸의 형체로’라는 표현을 생략합니다.
    rationale: σωματικῷ εἴδει는 보이는 신체적/물리적 형태의 현현을 명시하며, ὡς περιστερὰν은 그 형태에 대한 비교입니다. 두 요소를 모두 번역해야 합니다.
  - severity: low
    issue: ‘내가 너를 기뻐한다’가 εὐδόκησα의 아오리스트 형태를 현재형으로 바꿉니다.
