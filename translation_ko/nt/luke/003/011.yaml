review_pass:
  verdict: revise
  source_fidelity: '''겉옷''은 χιτών(몸에 가깝게 입는 기본 의복, 튜닉)을 외투로 오해하게 하므로 수정이 필요합니다. 또한 μεταδότω와 ποιείτω의 3인칭 명령형 권고를 ''해야 합니다''로 옮겨 그 명령력을 보존했습니다.'
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽게 다듬었으며, 대표적 단수 표현은 '사람'으로 명료하게 처리했습니다.
  terminology: χιτών은 본문에서 포괄적으로 '옷'으로 번역하고, 고대 의복의 성격은 각주에서 '튜닉'으로 설명했습니다. βρώματα는 '음식'으로 적절합니다.
  issues:
  - severity: medium
    issue: '''겉옷 두 벌'''
    rationale: 그리스어 χιτών은 일반적으로 겉옷이 아니라 몸에 가깝게 입는 튜닉/기본 의복을 가리킵니다. '겉옷'은 의복 종류를 반대로 특정합니다.
  - severity: low
    issue: 명령형의 표현
    rationale: '''나누어 주라/하라''는 인용문 안에서 반말 명령으로 들릴 수 있습니다. 합쇼체 목표에 맞추어 일반적 의무를 나타내는 ''해야 합니다''로 옮기는 것이 자연스럽고 원문의 3인칭 명령형에도 가깝습니다.'
  revised_text: 그가 그들에게 대답하여 말했습니다. “두 벌의 옷을 가진 사람은 옷이 없는 사람에게 나누어 주어야 합니다. 음식을 가진 사람도 그렇게 해야 합니다.”
  revised_footnotes:
  - marker: a
    text: ‘옷’으로 번역한 그리스어는 χιτών으로, 몸에 가깝게 입는 기본 의복인 튜닉을 가리킵니다.
    reason: cultural_note
  revision_rationale: 의복 명칭의 역사적 의미를 바로잡고, 현대 합쇼체와 원문의 일반적 3인칭 명령형을 함께 반영했습니다. 원문의 병렬 구조와, 부족한 사람이 무엇을 갖지 못했는지 문맥상 암시하는 표현도 유지했습니다.
