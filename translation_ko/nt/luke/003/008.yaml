  source_fidelity: 핵심 명령과 논지는 잘 옮겼습니다. 다만 ἐν ἑαυτοῖς의 복수 재귀 표현은 ‘너희 속으로’보다 ‘너희끼리’가 본문의 집단 내 발화를 더 자연스럽게 반영하며, 이 표현에는 ‘속으로/스스로에게’라는 해석 가능성도 있으므로 각주로 보존하는 것이 적절합니다. 또한 ἐκ τῶν λίθων τούτων은 수단을 나타내기 쉬운 ‘이 돌들로도’보다 출처를 나타내는 ‘이 돌들로부터’가 더 가깝습니다.
  naturalness: ‘너희 속으로’와 ‘우리에게 아브라함이 조상이 있다’는 현대 표준어에서 다소 부자연스럽습니다. ‘너희끼리’ 및 ‘우리 조상은 아브라함이다’가 합쇼체 문맥에서 자연스럽고, 인용문의 혈통 의존 주장을 명료하게 전달합니다.
  terminology: ‘회개’, ‘합당한 열매’, ‘하나님’, ‘아브라함’, ‘자녀’는 적절합니다. Πατέρα를 한국어에서 문자적으로 ‘아버지’로 하면 오히려 개인적 친부 관계로 오해될 수 있으므로, 혈통상 선조라는 뜻의 ‘조상’이 자연스럽습니다. τῷ Ἀβραάμ의 ‘for Abraham’은 ‘아브라함을 위하여’로 반영했습니다.
