  naturalness: 현대 표준어 합쇼체로 ‘강보에 싸여 구유에 누워 있는 아기를 찾게 될 것입니다’가 자연스럽고 명확합니다. 원문의 미래 예고와 아기의 상태를 잘 드러냅니다.
