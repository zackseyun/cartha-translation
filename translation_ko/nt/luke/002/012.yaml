  - severity: low
    issue: ‘보게 될 것입니다’
    rationale: εὑρήσετε의 기본 의미는 ‘찾다/발견하다’입니다. ‘보다’도 문맥상 결과를 전달할 수 있으나, 직접적 어휘 대응은 ‘찾게 될 것입니다’입니다.
