  source_fidelity: 초안의 ‘올라갔으며’는 현재분사 ἀναβαινόντων이 나타내는 동시적·진행적 상황을 단순 완료 행동으로 바꾸며, 문장 끝의 ‘-며’도 원문의 시간적 연결을 부정확하게 처리합니다. ‘올라가고 있었습니다’가 이 진행성을 더 잘 반영합니다. ‘그’의 선행사는 문맥상 예수이므로 한국어의 존대 서술로 자연스럽게 명시할 수 있습니다.
  naturalness: ‘명절의 관례대로’는 ‘절기의 관례에 따라’보다 현대 표준 한국어에서 더 자연스럽고 뜻도 유지합니다. 완결된 한국어 문장으로 옮기되, 목적지인 예루살렘은 이 절에 반복되어 있지 않으므로 보충하지 않았습니다.
  terminology: ἑορτή는 문맥상 유월절을 가리키지만 본문에는 ‘명절’로 유지했습니다. 이는 앞절의 정보를 본문에 과도하게 삽입하지 않으며, ‘관례’는 ἔθος에 적절합니다.
  issues:
