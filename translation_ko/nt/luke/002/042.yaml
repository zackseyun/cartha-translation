    issue: ‘올라갔으며’가 현재분사의 진행적·동시적 뉘앙스를 단순 과거로 바꿈
    rationale: ἀναβαινόντων αὐτῶν은 주절의 시간 설정 안에서 ‘그들이 올라가고 있을 때/올라가고 있었다’를 나타냅니다. ‘올라갔으며’는 이 상을 보존하지 못합니다.
  - severity: low
    issue: 문장 종결 ‘-며’의 연결 관계가 원문의 시간 관계와 맞지 않음
    rationale: καὶ ὅτε 및 속격절대구문은 시간적 배경을 형성합니다. 한국어에서는 독립적으로 ‘-고 있었습니다’로 종결하는 편이 자연스럽고 의미가 분명합니다.
