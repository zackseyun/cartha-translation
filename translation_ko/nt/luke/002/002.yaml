  source_fidelity: ‘총독으로 있을 때’는 ἡγεμονεύοντος의 동사적 표현보다 특정 관직을 다소 강하게 확정합니다. ‘시리아를 다스리고 있을 때’가 원문의 동사와 동시적 속격절을 더 직접적으로 반영합니다. πρώτη의 통상적 순서수 의미는 본문에 유지하되, 논쟁적인 비교·시간적 이해는 각주로 보존하는 것이 적절합니다.
  naturalness: ‘이 호적 등록은 … 처음으로 이루어졌습니다’는 현대 표준어 합쇼체에서 자연스럽고, 행정적 등록 사건을 가리키는 문맥에도 맞습니다. ‘구레뇨’는 한국어 성경 전통에서 널리 쓰이는 이름이므로 유지할 수 있습니다.
  terminology: ἀπογραφή에는 ‘호적 등록’을 사용하여 공식 등록의 행정적 성격을 드러냈습니다. Κυρήνιος는 관용 표기인 ‘구레뇨’를 유지하고 각주에서 퀴리니우스와 동일 인물임을 밝혔습니다.
  issues:
