source:
  edition: SBLGNT
  text: (⸀αὕτη ἀπογραφὴ πρώτη ἐγένετο ἡγεμονεύοντος τῆς Συρίας Κυρηνίου·)
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
  footnotes:
  - marker: a
    text: Or, 'This registration took place before Quirinius was governing Syria.' Some understand πρώτη here in a comparative temporal sense.
    reason: alternative_reading
  - marker: b
    text: Or, 'census' for 'registration.' The Greek term refers to an official enrollment, often connected with taxation.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 호적 등록은 구레뇨[a]가 시리아를 다스리고 있을 때 처음으로 이루어졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 구레뇨는 퀴리니우스(푸블리우스 술피키우스 퀴리니우스)를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 “이 호적 등록은 구레뇨가 시리아를 다스리기 전에 이루어졌습니다.” πρώτη를 비교·시간적 의미로 이해하는 견해가 있습니다. ‘호적 등록’은 세금과 관련되기도 한 공식 등록을 뜻하며, ‘인구 조사’로도 옮길 수 있습니다.
    reason: alternative_reading
