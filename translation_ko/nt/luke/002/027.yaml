translation:
  language: ko
  text: 그는 성령[a] 안에서 성전에 들어왔으며, 부모[b]가 아이 예수를 위해 율법의 관례대로 행하려고 그를 데리고 들어올 때에,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성령의 인도하심으로.’ 그리스어 표현은 직역하면 ‘성령 안에서’이며, 이 문맥에서는 성령을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그 부모’를 뜻합니다. 누가는 여기서 마리아와 요셉을 예수를 돌보는 가족으로서 일반적인 표현으로 부릅니다.
    reason: alternative_reading
