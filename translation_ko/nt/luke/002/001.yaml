  source_fidelity: 초안은 칙령의 발령과 등록 명령이라는 핵심 뜻을 대체로 담았으나, “온 세상에 호적을 등록하게 하였습니다”는 등록의 대상과 행위가 불분명합니다. ἀπογράφεσθαι는 ‘호적 자체를 등록하다’라기보다 사람들이 공식적으로 등록되도록 하는 것을 뜻합니다. 또한 πᾶσαν τὴν οἰκουμένην의 범위는 본문에서 단정하지 않고 주석으로 보완하는 편이 적절합니다.
