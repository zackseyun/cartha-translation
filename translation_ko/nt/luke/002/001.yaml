  terminology: ‘가이사 아우구스투스’는 현대 한국어의 일반적인 역사·고전어 표기와 잘 맞습니다. ‘호적’은 현대 행정 제도를 연상시킬 수 있으므로 본문에서는 넓은 뜻의 ‘등록’을 사용했습니다. ‘온 세상’에는 로마 제국적 문맥을 설명하는 주석을 붙였습니다.
