    rationale: 기존 각주는 ‘야훼’에 붙어 있으나, 해당 본문에서 독자에게 필요한 설명은 ‘태를 여는’이 맏아들을 뜻하는 관용구라는 점입니다. 또한 LXX와 히브리어 양식에 관한 단정은 정확성과 관련성이 부족합니다.
  revised_text: 이는 주님의 율법에 「태를 여는[a] 모든 남자는 주님께 거룩한 자로 불릴 것이다」라고 기록되어 있는 대로입니다.
