- from: 이는 야훼의 율법에 「태를 여는 모든 남자는 야훼[a]께 거룩한 자라 일컬어질 것이다」라고 기록된 그대로입니다.
  to: 이는 주님의 율법에 「태를 여는[a] 모든 남자는 주님께 거룩한 자로 불릴 것이다」라고 기록되어 있는 대로입니다.
  rationale: 그리스어 κύριος를 ‘주님’으로 일관되게 바로잡고, ἅγιον과 κληθήσεται의 의미를 ‘거룩한 자로 불릴 것이다’로 유지했습니다. 각주는 본문 이해에 직접 필요한 ‘태를 여는’의 관용적 의미를 설명하도록 교체했습니다.
