translation:
  language: ko
  text: 이는 주님의 율법에 「태를 여는[a] 모든 남자는 주님께 거룩한 자로 불릴 것이다」라고 기록되어 있는 대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘태를 여는’은 맏아들, 곧 어머니에게서 처음 난 남자 아이를 가리키는 관용적 표현입니다. 출애굽기 13:2, 12을 보십시오.
    reason: lexical_alternative
