  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
  footnotes:
  - marker: a
    text: Or, 'and as a widow for eighty-four years.' The Greek can be understood as giving either Anna's age or the length of her widowhood.
    reason: alternative_reading
  - marker: b
    text: The Greek word here refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: c
    text: Or 'supplications' or 'petitions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 여든네 살 된 과부였습니다.[a] 그녀는 성전[b]을 떠나지 않고, 밤낮으로 금식과 기도로 예배드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘과부가 된 지 여든네 해가 되었습니다.’ 헬라어 표현은 안나의 나이를 가리킬 수도 있고, 과부로 지낸 기간을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘성전’은 성소 내부만이 아니라 성전 경내 전체를 가리킵니다.
    reason: cultural_note
