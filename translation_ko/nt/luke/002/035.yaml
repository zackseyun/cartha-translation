review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sword image, the direct address, and the disclosure of what is in many hearts. However, '꿰뚫을' alone narrows διελεύσεται ('will pass through') to piercing, and '이는 ... 하려는 것입니다' turns the prophetic clause into an explanatory statement rather than retaining its future-oriented purpose/result.
  naturalness: The revised wording uses natural modern formal Korean and makes the relation between the two clauses clear without the stilted explanatory construction.
  terminology: '''영혼'' appropriately renders ψυχή in this figurative context, and ''마음속 생각'' naturally renders ''thoughts of many hearts.'' ''칼'' is an adequate idiomatic rendering of ῥομφαία.'
  issues:
  - severity: medium
    issue: '''꿰뚫을'' does not fully express διελεύσεται.'
    rationale: The Greek verb means 'pass through.' With a sword, piercing is implied, but adding '지나가다' preserves the lexical image more closely.
  - severity: medium
    issue: '''이는 많은 사람의 마음의 생각이 드러나게 하려는 것입니다'' is an overly explanatory and temporally weakened rendering of ὅπως ἂν ... ἀποκαλυφθῶσιν.'
    rationale: The Greek presents the disclosure as the purpose/intended result connected with the preceding prophecy. A future clause in Korean retains this force more directly and naturally.
  - severity: low
    issue: '''마음의 생각'' is grammatically possible but less idiomatic than ''마음속 생각.'''
    rationale: The latter clearly and naturally conveys thoughts arising from within many hearts.
  revised_text: 칼이 당신 자신의 영혼도 꿰뚫고 지나갈 것입니다. 그리하여 많은 사람의 마음속 생각이 드러나게 될 것입니다.」
