  source_fidelity: 초안은 SBLGNT의 속격 εὐδοκίας를 '그분께서 기뻐하시는 사람들'로 자연스럽게 풀어, 평화가 별도의 '선의' 항목이 아니라 하나님의 호의와 관련된 사람들에게/가운데 선포된다는 본문 구조를 잘 반영합니다. 다만 ἐν ἀνθρώποις는 '사람들에게'보다 '사람들 가운데'가 더 직접적이며, 두 전치사구의 병렬도 보완할 수 있습니다.
  naturalness: '''지극히 높은 곳에서는 하나님께 영광이요''는 이해되지만, 현대 표준어 합쇼체에서는 서술 구조를 갖춘 ''영광이 있고 … 평화가 있습니다''가 더 매끄럽고 병렬적입니다.'
  terminology: '''하나님'', ''영광'', ''평화''는 적절합니다. ''그분께서 기뻐하시는 사람들''은 하나님의 호의를 지나치게 교리적으로 확정하지 않으면서 εὐδοκίας를 관용적으로 옮깁니다.'
