  source_fidelity: 「야훼」는 본문의 헬라어 κύριος에 대한 프로젝트 기본 번역 및 영어 POB의 ‘Lord’와 맞지 않으며, 구약 신현 양식의 반향만으로 하나님의 이름을 본문에 명시하는 것은 번역 이상의 해석입니다. ἐπέστη는 천사가 갑자기 곁에 서거나 나타난 뜻을 지니므로 「그들 곁에 섰습니다」가 구체성과 자연스러움을 함께 보존합니다. περιέλαμψεν은 주위를 둘러 비추었다는 뜻으로 옮겼습니다.
