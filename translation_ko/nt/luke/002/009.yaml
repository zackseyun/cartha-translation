  to: 주의 천사가 그들 곁에 섰고, 주의 영광이 그들 주위를 비추자, 그들은 크게 두려워하였습니다.
  rationale: 「야훼」를 원문의 κύριος에 충실한 「주」로 바로잡고, 이에 의존하던 해석적 각주를 삭제했습니다. ἐπέστη의 현장감은 「그들 곁에 섰고」로, περιέλαμψεν의 포위하는 빛은 「그들 주위를 비추자」로 반영했습니다. 「크게 두려워하였습니다」는 동족목적어가 나타내는 강한 두려움을 자연스러운 한국어로 보존합니다.
