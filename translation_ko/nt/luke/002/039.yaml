translation:
  language: ko
  text: 그들은 주님의 율법에 따라 모든 것을[a] 마친 뒤 갈릴리, 곧 자기들의 동네[b] 나사렛으로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 율법이 요구하는 모든 것을’.
    reason: ‘율법에 따라 모든 것’이라는 원문의 표현이 율법에 의해 요구된 일을 가리킬 수 있음을 밝힙니다.
  - marker: b
    text: 그리스어는 ‘도시’입니다. 나사렛의 규모를 고려하여 ‘동네’로 옮겼습니다.
    reason: πόλις의 기본 의미와 한국어 번역 선택을 설명합니다.
