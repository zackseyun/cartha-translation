  rationale: 원문의 계시 수여, 성령의 행위자성, ‘죽음을 보다’라는 관용 표현, 그리고 τὸν χριστὸν κυρίου의 ‘주의 메시아’라는 관계를 보존했습니다. 원문에 없는 ‘보내신’과 부정확한 시편 직접 인용 주석은 제거하고, 전통적 번역어는 각주로 유지했습니다.
