    rationale: 본문에는 ‘보내신’에 해당하는 동사나 분사가 없으며, κύριος는 여기서 ‘주’로 번역하는 것이 직접적입니다.
  - severity: medium
    issue: 각주의 시편 2:2 LXX 직접 반영 주장이 부정확합니다.
    rationale: 시편 2:2 LXX의 표현은 본문의 τὸν χριστὸν κυρίου와 동일한 정형이 아니므로, 직접 반영이라는 단정은 본문 주석으로 적절하지 않습니다.
  - severity: low
    issue: 성령의 행위자성을 더 분명히 드러낼 필요가 있습니다.
    rationale: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου는 계시가 성령에 의해 주어진 것임을 나타냅니다.
