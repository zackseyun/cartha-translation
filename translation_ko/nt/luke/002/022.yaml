  source_fidelity: 수정안은 αὐτῶν의 복수형을 본문에서 '그들의'로 유지하고, ἀνήγαγον의 상행 방향을 '데리고 올라갔습니다'로, παραστῆσαι τῷ κυρίῳ를 '주님께 드리기 위하여'로 옮깁니다. 원문 κύριος는 '주님'으로 번역해야 하며, 본문 자체가 야훼라는 신명을 사용하지 않습니다.
  naturalness: '''그들의 정결 기간이 ... 차자''는 의례·법률 문맥을 유지하면서 현대 한국어 성경 문체에 자연스럽습니다. 문장 전체는 현대 합쇼체로 통일됩니다.'
  terminology: καθαρισμός은 '정결'로, νόμος Μωϋσέως는 '모세의 율법'으로, κύριος는 '주님'으로 번역합니다. 사본상의 단수 대안은 본문이 아니라 각주에 보존합니다.
  issues:
  - severity: high
    issue: κύριος를 '야훼'로 번역함
    rationale: 제시된 그리스어 본문은 τῷ κυρίῳ이며, 번역 원칙상 '주님'으로 옮겨야 합니다. 출애굽기와의 연관을 근거로 신명을 본문에 삽입하면 원문의 표현을 넘어섭니다.
  - severity: medium
    issue: 각주가 원문 사본 변이를 보존하지 않고 해석적 설명을 제공함
    rationale: 영어 감사 기록과 제공된 본문은 αὐτῶν('그들의') 및 일부 사본의 단수 대안('그녀의')을 각주로 보존하도록 요구합니다. 기존 각주는 이 변이를 누락하고 있으며 alternative_reading의 내용에도 부합하지 않습니다.
  revised_text: 그들의 정결 기간이 모세의 율법에 따라 차자, 그들은 그를 주님께 드리기 위하여 예루살렘으로 데리고 올라갔습니다.
  revised_footnotes:
  - marker: a
    text: 일부 사본에는 ‘그들의 정결’ 대신 ‘그녀의 정결’로 되어 있습니다.
    reason: textual_variant
  revision_rationale: 원문을 따라 복수 소유대명사와 예루살렘으로 올라가는 동작을 보존했습니다. '야훼'라는 해석적 대체를 '주님'으로 바로잡고, 해당 각주는 원문 전승의 단수 대안을 정확히 제시하도록 교체해야 합니다. 개정 본문에 각주 표지가 필요한 경우 ‘그들의 정결[a] 기간’으로 배치합니다.
