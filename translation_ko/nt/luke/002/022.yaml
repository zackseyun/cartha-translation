  verdict: revise
  source_fidelity: 수정이 필요합니다. κύριος는 이 절에서 ‘주님’으로 옮겨야 하며, ἀνήγαγον의 ‘올라가다’라는 방향성을 반영해야 합니다. 또한 본문은 ‘그들의 정결’이라는 복수 대명사를 유지해야 합니다.
  naturalness: ‘정결의 날이 차자’보다 ‘정결 기간이 ... 끝나자’가 현대 표준 한국어에서 자연스럽고, 의례적 맥락도 분명히 드러냅니다.
  terminology: ‘주님’은 κύριος에 대한 일관된 한국어 대응어입니다. ‘야훼’는 여기의 그리스어 본문이 사용하는 κύριος를 불필요하게 특정한 신명으로 바꾸므로 피합니다.
  issues:
  - severity: high
    issue: ‘야훼’로 번역함
    rationale: 원문은 τῷ κυρίῳ(‘주님께’)이며, 제공된 번역 원칙도 κύριος를 ‘Lord’로 옮깁니다. ‘야훼’는 원문의 표현을 좁히는 번역입니다.
  - severity: medium
    issue: ‘데려갔습니다’가 ἀνήγαγον의 상행 방향을 반영하지 못함
    rationale: 예루살렘을 향한 ‘올라감’을 나타내므로 ‘데리고 올라갔습니다’가 적절합니다.
  - severity: high
    issue: 각주가 본문의 사본 이문을 제시하지 않고 다음 절 및 출애굽기와 관련된 해석을 단정함
    rationale: 이 절의 관련 각주는 αὐτῶν(‘그들의’)에 대해 일부 사본이 단수 ‘그녀의’를 읽는다는 이문을 알려야 합니다. 현 각주는 이 절만으로 첫아들의 봉헌을 단정하며, 앵커의 기능에도 맞지 않습니다.
  revised_text: 모세의 율법에 따라 그들의 정결 기간이 끝나자, 그들은 그 아기를 주님께 드리려고 예루살렘으로 데리고 올라갔습니다.
  revised_footnotes:
  - marker: a
    text: 일부 사본에는 ‘그녀의 정결’이라고 되어 있습니다.
    reason: textual_variant
  revision_rationale: 원문의 복수형 ‘그들의 정결’을 본문에 보존하고, 단수형 사본 이문은 각주로 처리했습니다. κύριος는 ‘주님’으로, 예루살렘을 향한 ἀνάγω의 방향성은 ‘데리고 올라갔습니다’로 반영했습니다. 본문 범위를 넘어선 해석적 각주는 이문 각주로 교체했습니다.
