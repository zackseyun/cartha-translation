  source_fidelity: ‘부모는’은 문맥상 가리키는 대상을 자연스럽게 밝혀 주지만, ὀδυνώμενοι(정신적 고통 가운데)의 의미와 ἐζητοῦμεν(지속적 과거의 찾음)이 현재 번역의 ‘근심하며 … 찾았단다’에서는 다소 약화되고 완료된 행동처럼 들립니다. 이를 ‘몹시 괴로워하며 … 찾고 있었단다’로 옮기면 원문의 정서와 미완료 시제를 더 충실히 반영합니다.
  naturalness: 전반적으로 자연스럽고, 어머니가 자녀에게 쓰는 직접화법 ‘얘야’, ‘보아라’, ‘-단다’도 문맥에 맞습니다. 다만 ‘어찌 우리에게 이렇게 하였느냐’보다 ‘왜 우리에게 이렇게 하였느냐’가 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘네 아버지’는 그리스어 ὁ πατήρ σου를 해석적으로 한정하지 않고 충실히 옮깁니다. ‘얘야’는 애정 어린 호격 τέκνον에 적절합니다. ‘몹시 괴로워하며’는 ὀδυνώμενοι의 고통·번민의 함의를 보존합니다.
