    issue: '''다윗의 동네인 베들레헴이라 불리는 곳'' has an unclear modifier structure.'
    rationale: It can sound as though an unspecified place is called 'Bethlehem, David's town,' rather than stating that the city of David is called Bethlehem. The Greek explicitly modifies 'city of David' with the relative clause 'which is called Bethlehem.'
