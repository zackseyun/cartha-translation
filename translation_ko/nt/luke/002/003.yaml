  source_fidelity: 개정이 필요합니다. 초안의 ‘그래서’는 단순 접속사 καί보다 인과 관계를 강하게 만들며, ‘본 동네’는 πόλις(도시)를 ‘고향’ 또는 출신지로 해석하여 범위를 좁힙니다. 또한 미완료 시제 ἐπορεύοντο의 진행적 서술은 ‘가고 있었습니다’로 더 잘 드러납니다.
  naturalness: ‘모든 사람이 저마다 자신의 도시로 등록하러 가고 있었습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 공식 등록을 위한 이동이라는 문맥도 명료합니다.
  terminology: ἀπογράφεσθαι는 여기서 인구 조사와 관련된 공식 등록을 가리키므로 ‘등록하러’가 적절합니다. πόλις는 ‘동네’나 ‘고향’으로 의역하지 않고 ‘도시’로 옮깁니다. ἕκαστος ... ἑαυτοῦ의 분배적·재귀적 의미는 ‘저마다 자신의’으로 보존합니다.
  issues:
