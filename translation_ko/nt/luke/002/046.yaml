  verdict: revise
  source_fidelity: 핵심 장면과 시간 표현은 대체로 충실합니다. 다만 εὗρον은 이 문맥에서 단순한 관찰의 ‘발견했습니다’보다, 찾던 끝에 ‘찾았습니다’로 옮기는 편이 자연스럽고 정확합니다. ἱερόν은 내전만이 아니라 성전 경내를 가리키므로 주석으로 범위를 밝혔습니다.
  naturalness: ‘그가 … 것을 발견했습니다’는 문법적으로 가능하지만 현대 한국어 서사에서는 다소 번역투입니다. ‘그가 … 있는 것을 찾았습니다’가 더 자연스럽고, 현재분사 καθεζόμενον의 진행 중인 모습을 잘 드러냅니다. ‘질문하는’은 ἐπερωτῶντα의 능동적 질문을 자연스럽게 반영합니다.
  terminology: ‘성전’과 ‘선생들’은 문맥상 적절합니다. 다만 ‘성전’이 한국어에서 건물 내부를 연상시킬 수 있어 ἱερόν의 경내/구역 의미를 주석으로 보완했습니다. 교사들과의 관계를 논쟁이나 심문으로 과장하지 않았습니다.
  issues:
  - severity: medium
    issue: ἱερόν의 범위에 관한 주석이 없습니다.
    rationale: ἱερόν은 특별히 성소 내부(ναός)가 아니라 성전의 경내·구역을 뜻할 수 있습니다. 본문의 ‘성전’은 유지하되 독자가 범위를 알 수 있도록 주석을 다는 것이 좋습니다.
  - severity: low
    issue: ‘발견했습니다’가 문맥상 다소 부자연스럽습니다.
    rationale: εὗρον은 ‘찾아 찾았습니다’라는 서사적 발견을 뜻하며, 앞뒤 문맥에서 부모가 예수를 찾고 있습니다. ‘… 있는 것을 찾았습니다’가 자연스러운 한국어입니다.
  revised_text: 사흘 뒤에 그들은 그가 성전[a]에서 선생들 가운데 앉아 그들의 말을 듣고 그들에게 질문하는 것을 찾았습니다.
