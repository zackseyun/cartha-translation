  source_fidelity: 핵심 의미는 잘 반영합니다. 다만 ἐπ’ αὐτόν의 지속적 임재를 ‘그 위에 계셨습니다’로 옮기면 한국어에서 다소 부자연스럽고 물리적 위치로 들릴 수 있으므로 ‘그에게 임해 계셨습니다’가 더 정확하고 자연스럽습니다. 또한 무관사 πνεῦμα ἅγιον의 해석상 대안을 각주로 남기는 것이 감사 기록과 원문의 여지를 보존합니다.
  naturalness: ‘보십시오’는 ἰδοὺ의 주의 환기 기능을 현대 합쇼체에서 자연스럽게 살립니다. ‘의롭고 경건한 자로서’보다 ‘의롭고 경건했으며’가 서술 문맥에 더 매끄럽습니다.
  terminology: ‘시므온’, ‘의롭고 경건한’, ‘이스라엘의 위로’, ‘성령’은 적절합니다. ‘성령’은 누가복음의 문맥상 정관사 형태로 번역하되, 원문의 무관사 표현이 허용하는 대안은 각주로 처리합니다.
