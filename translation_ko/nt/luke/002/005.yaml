review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys accompaniment, formal betrothal, and pregnancy. However, “호적을 등록하러” is not idiomatic Korean for the administrative act expressed by ἀπογράψασθαι; Korean normally says “호적에 등록하다.”
  naturalness: “자기와 정혼한” is understandable but less natural in this narrative context, and the clause joined by “갔으며” is slightly awkward. Separating Mary’s condition into a second sentence gives clear, formal-polite Korean while retaining the source meaning.
  terminology: “정혼” appropriately preserves the formal, socially binding character of ἐμνηστευμένῃ better than ordinary modern “약혼.” “호적에 등록하다” naturally represents census registration in this context.
  issues:
  - severity: medium
    issue: Administrative-registration idiom
    rationale: “호적을 등록하다” treats 호적 as the object being registered. The intended Korean expression is “호적에 등록하다,” meaning to enter one’s name in the registration/census record.
  - severity: low
    issue: Betrothal phrasing and sentence flow
    rationale: “그와 정혼한” is more natural than “자기와 정혼한” here. Rendering the pregnant participial clause as a separate sentence avoids an awkward coordination without adding information.
  revised_text: 그는 그와 정혼한[a] 마리아와 함께 호적에 등록하려고 갔습니다. 마리아는 임신 중이었습니다.
  revised_footnotes:
