    text: 또는 「그리스도이신 주님」. 그리스어 χριστὸς κύριος는 직역하면 「메시아 주」이며, 본문에서는 두 칭호를 「메시아이신 주님」으로 옮겼습니다.
    reason: lexical_alternative
