  to: 천사가 그녀에게 대답했습니다. “성령께서 당신 위에 임하시고, 지극히 높으신 분의 능력이 당신을 덮을 것입니다. 그러므로 태어날 거룩한 이는 하나님의 아들이라 불릴 것입니다.”
  rationale: 원문에 있는 수신자 αὐτῇ를 보충하고, 누락된 닫는 인용부호를 바로잡았습니다. 또한 ‘능력’을 주어로 한 문장의 높임을 자연스러운 현대 한국어로 조정했습니다. τὸ γεννώμενον ἅγιον은 ‘태어날 거룩한 이’로, υἱὸς θεοῦ는 문맥상 칭호인 ‘하나님의 아들’로 옮겨 원문의 의미와 절제된 표현을 보존했습니다.
