  source_fidelity: 수정이 필요합니다. 원문의 ἡ δούλη는 여성형이므로 ‘여종’으로 성별 정보를 살리는 것이 적절하며, ἀπ’ αὐτῆς는 ‘그녀에게서’입니다. 초안의 ‘그에게서’는 마리아를 남성으로 가리키는 부정확한 대명사입니다. γένοιτό μοι의 희망·수락의 뉘앙스는 ‘이루어지기를 바랍니다’로 자연스럽게 나타납니다.
