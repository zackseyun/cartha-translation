- from: 내 주의 어머니께서 내게 오시다니, 이런 영광이 내게 어찌 주어졌는지요?
  to: 그런데 내 주님의 어머니께서 저에게 오시다니, 어찌하여 이런 일이 저에게 있습니까?[a]
  rationale: 원문의 καὶ를 ‘그런데’로, ἡ μήτηρ τοῦ κυρίου μου를 ‘내 주님의 어머니’로, πρὸς ἐμέ를 ‘저에게’로 반영했습니다. πόθεν μοι τοῦτο의 관용적 감탄은 자연스러운 한국어 의문문으로 옮기고, 직역 가능성은 각주에 보존했습니다. ἵνα ἔλθῃ의 놀라운 사건 내용은 ‘오시다니’로 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:14:53Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 엘리사벳의 놀라움과 ‘내 주’라는 고백을 대체로 전달합니다. 그러나 ‘이런 영광’은 그리스어의 중성 지시어 τοῦτο(‘이런 일/이것’)보다 구체적이고 해석적인 보충입니다. 또한 ‘어찌 주어졌는지요’는 πόθεν의 ‘어디서/어찌하여’라는 관용적 놀라움을 어느 정도 반영하지만, 원문의 직접 의문과 ἵνα절의 내용을 더 명료하게 보존하는 편이 좋습니다.
  naturalness: ‘내 주의 어머니’는 이해되지만 현대 표준어 합쇼체에서는 ‘내 주님의 어머니’가 더 자연스럽고 경어법에도 맞습니다. ‘저에게 오시다니, 어찌하여 이런 일이 저에게 있습니까?’는 원문의 감탄적 질문을 자연스럽게 살립니다.
  terminology: κύριος는 ‘주님’으로, μήτηρ는 ‘어머니’로 옮겼습니다. ‘영광’처럼 원문에 없는 신학적·평가적 명사는 넣지 않았습니다.
  issues:
  - severity: medium
    issue: ‘이런 영광’이 τοῦτο를 해석적으로 확대합니다.
    rationale: τοῦτο는 ‘이것/이런 일’을 가리킬 뿐 ‘영광’이라는 명사를 명시하지 않습니다. 문맥상 특권의 의미는 있으나 본문에는 중립적인 표현을 유지하는 것이 좋습니다.
  - severity: low
    issue: ‘내 주의 어머니’의 표현이 현대 한국어 경어 관습상 다소 어색합니다.
    rationale: 존칭 명사 ‘주님’과 소유격 ‘내 주님의’가 현대 표준어에서 더 자연스럽습니다.
  revised_text: 그런데 내 주님의 어머니께서 저에게 오시다니, 어찌하여 이런 일이 저에게 있습니까?[a]
