  source_fidelity: 개정이 필요합니다. κύριος를 ‘야훼’로 특정하는 것은 본문이 직접 요구하는 범위를 넘습니다. 본문은 ‘주’라는 칭호를 사용하며, 문맥상 하나님을 가리키지만 한국어에서도 ‘주께서’로 옮기는 것이 원문의 표현과 영어 POB 감사 기록에 더 충실합니다. 또한 ἐν ἡμέραις αἷς의 복수 ‘날들’과 ὄνειδος의 사회적 불명예 의미를 반영해야 합니다.
  naturalness: 개정문은 현대 표준 한국어의 합쇼체로 자연스럽습니다. ‘나를 돌아보신 날들에’는 원문의 시간 관계를 유지하고, ‘내게 이렇게 행하셨습니다’는 οὕτως μοι πεποίηκεν의 강조와 완료적 결과를 무리 없이 전달합니다.
  terminology: κύριος는 ‘주’로, ὄνειδός는 외부적·사회적 치욕을 나타내는 ‘수치’로 옮겼습니다. ‘야훼’ 및 사라·라헬 반향에 관한 주석은 본 절의 명시적 어휘를 넘어 특정 해석을 부과하므로 삭제합니다.
  issues:
