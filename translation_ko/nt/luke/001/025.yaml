    issue: κύριος를 ‘야훼’로 번역함
    rationale: κύριος는 여기서 하나님을 가리키지만, 그리스어 본문은 ‘주’라는 칭호를 사용합니다. ‘야훼’는 번역어를 불필요하게 특정하며 영어 POB의 ‘the Lord’와도 일치하지 않습니다.
  - severity: low
    issue: ‘돌아보신 날’이 원문의 복수 ἡμέραις를 단수로 옮김
    rationale: ‘날들’로 옮겨 원문의 복수형을 보존하는 것이 안전합니다.
  - severity: medium
    issue: 현 주석이 특정 본문 간 반향과 신명 사용을 단정함
    rationale: 사라와 라헬의 언어 반향은 해석상 논의될 수 있으나, κύριος를 ‘야훼’로 번역해야 한다는 근거가 되지 않습니다. 본문에 필요한 어휘 주석도 아니므로 삭제합니다.
