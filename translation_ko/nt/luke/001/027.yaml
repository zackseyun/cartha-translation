- from: 그는 다윗의 가문에 속한 요셉이라는 사람과 정혼한 한 처녀에게로 갔으며, 그 처녀의 이름은 마리아였습니다.
  to: 그는 다윗의 집안 출신인 요셉이라는 사람과 정혼한 처녀에게로 갔습니다. 그리고 그 처녀의 이름은 마리아였습니다.
