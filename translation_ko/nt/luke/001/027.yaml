    issue: ‘다윗의 가문에 속한’의 의미 범위
    rationale: ἐξ οἴκου Δαυίδ는 다윗의 집안에서 나온, 곧 그 가문 출신이라는 뜻입니다. ‘속한’도 가능하지만 현재 소속처럼 읽힐 여지가 있어 ‘출신인’이 더 직접적입니다.
  revised_text: 그는 다윗의 집안 출신인 요셉이라는 사람과 정혼한 처녀에게로 갔습니다. 그리고 그 처녀의 이름은 마리아였습니다.
