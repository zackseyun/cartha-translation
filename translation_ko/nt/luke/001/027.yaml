  source_fidelity: ‘정혼한’은 ἐμνηστευμένην의 정식 혼인 약속 상태를 적절히 나타냅니다. 다만 ‘다윗의 가문에 속한’은 ἐξ οἴκου Δαυίδ의 ‘다윗의 집안/가문 출신’이라는 출신·계보 표현보다 다소 소속 관계처럼 들릴 수 있어 조정하는 것이 좋습니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. 두 절을 분리하고 ‘그리고’를 사용하면 원문의 병렬과 한국어 문장 흐름이 더 분명해집니다.
  terminology: παρθένος는 ‘처녀’, ἐμνηστευμένην은 ‘정혼한’, Μαριάμ은 관용 한국어 이름인 ‘마리아’로 옮기는 것이 적절합니다. ‘다윗의 집안 출신’은 οἶκος의 왕조·가문 언어를 보존합니다.
  issues:
