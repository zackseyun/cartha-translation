  source_fidelity: 초안은 καθὼς의 앞 절 연결, ἀπ’ ἀρχῆς의 시간 표현, αὐτόπται, γενόμενοι, παρέδοσαν의 전승 의미를 대체로 충실히 반영합니다. 다만 καὶ를 ‘또’로 옮기면 원문에 없는 부가·열거의 뉘앙스가 생길 수 있어, 단순 병렬로 처리하는 편이 더 정확합니다. ‘말씀의 일꾼이 된’은 γενόμενοι의 변화·됨의 의미를 잘 살립니다.
