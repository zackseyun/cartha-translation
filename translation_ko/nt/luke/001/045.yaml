    text: 또는 ‘주님께서 그녀에게 말씀하신 것들이 이루어질 것이기 때문에 믿은 그 여자는 복이 있습니다.’ ὅτι는 때때로 이유를 나타낼 수 있으나, 여기서는 믿음의 내용을 이끄는 ‘…할 것을’로 이해하는 것이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
