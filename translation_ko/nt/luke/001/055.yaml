  verdict: revise
  source_fidelity: 원문의 καθὼς ἐλάλησεν은 앞 절의 하나님의 행위를 ‘말씀하신 대로’라는 비교·일치 구문으로 연결합니다. 초안은 이 핵심을 대체로 보존하지만, ‘영원토록 말씀하신’은 하나님께서 영원히 계속 말씀하셨다는 뜻으로 읽힐 수 있어 εἰς τὸν αἰῶνα가 아브라함과 그의 σπέρμα를 향한 약속의 지속성을 나타내는 원문의 결속을 충분히 드러내지 못합니다. 끝의 닫는 인용 부호도 근거 없이 남아 있습니다.
  naturalness: ‘우리 조상들에게, 곧 아브라함과 그의 후손에게’는 한국어에서 조상들과 아브라함 및 그의 후손을 완전한 동격으로 처리하는 듯하여 다소 어색합니다. ‘우리 조상들인 아브라함과 그의 후손에게’로 하면 원문의 관계를 더 자연스럽게 나타낼 수 있습니다.
  terminology: ‘아브라함’과 ‘후손’은 적절합니다. πατέρας의 남성·족장적 표현은 한국어에서 통상 ‘조상들’로 자연스럽게 옮길 수 있으며, 직역적 대안은 각주로 보존합니다. σπέρμα의 단수 집합명사 및 ‘씨’라는 성서적 대안도 각주로 보존합니다.
  issues:
  - severity: medium
    issue: εἰς τὸν αἰῶνα의 수식 관계가 불명확함
    rationale: ‘영원토록 말씀하신’은 발화 행위의 지속으로 읽힐 수 있습니다. 원문은 아브라함과 그의 씨/후손을 향한 약속의 영속성을 가리키므로, ‘영원히 이어질’로 그 관계를 명확히 하는 것이 안전합니다.
  - severity: low
    issue: 근거 없는 닫는 인용 부호
    rationale: 초안 끝의 ‘」’는 이 절의 원문이나 제시된 문맥에서 뒷받침되지 않으므로 삭제해야 합니다.
  revised_text: 우리 조상들인 아브라함과 그의 후손에게 영원히 이어질 약속을 말씀하신 그대로입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리 조상들에게’. 그리스어는 직역하면 ‘우리의 아버지들에게’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 씨에게’. 그리스어는 단수 집합명사로, ‘씨’, ‘후손’, 또는 ‘자손들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 비교 구문은 유지하면서, ‘영원토록’이 하나님의 계속된 발화가 아니라 아브라함과 그의 후손을 향한 약속의 영속성과 연결됨을 한국어로 분명히 했습니다. 불필요한 닫는 인용 부호를 삭제하고, ‘아브라함과 그의 후손’의 관계를 ‘우리 조상들’과 자연스럽게 연결했습니다.
