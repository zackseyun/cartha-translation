revisions:
- from: 그러자 즉시 그의 입이 열리고 그의 혀가 풀려, 그가 말하며 하나님을 송축하기 시작했습니다.
  to: 그러자 그의 입이 곧 열리고 그의 혀도 열렸습니다. 그는 하나님을 찬송하며 말하기 시작했습니다.
  rationale: 혀가 ‘풀렸다’는 추가 표현을 제거하고, 그리스어의 병렬 구조가 뜻하는 바를 한국어 문법상 필요한 범위에서 ‘혀도 열렸습니다’로 보충했습니다. 사건 직후 발화가 시작되는 문맥을 따라 미완료 과거는 ‘말하기 시작했습니다’로 옮겼으며, 현재분사는 ‘찬송하며’로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:14:57Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그의 혀가 풀려’는 SBLGNT 본문이 혀에 관하여 명시하지 않은 술어를 보충합니다. 본문은 입이 열렸다고 한 뒤 혀를 병렬하여 언급하므로, 한국어에서는 공유된 ‘열리다’를 보충하되 ‘풀리다’라는 해석적 표현은 피하는 것이 안전합니다. ἐλάλει의 문맥상 시작 용법은 ‘말하기 시작했습니다’로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘그러자 곧’은 다소 중복되어 ‘그러자’와 ‘곧’을 분리해 자연스러운 서술로 다듬었습니다. 두 문장으로 나누어 현대 표준어 합쇼체 문장을 명료하게 했습니다.
  terminology: θεόν은 ‘하나님’, εὐλογῶν은 하나님을 향한 문맥에서 자연스러운 ‘찬송하며’로 옮겼습니다. ‘송축’도 가능하지만, 여기서는 말의 내용/동반 방식을 드러내는 ‘찬송하며’가 더 자연스럽습니다.
  issues:
  - severity: medium
    issue: ‘그의 혀가 풀려’라는 보충
    rationale: 제시된 그리스어 본문은 ‘그의 혀도’라고만 병렬 언급하며 ‘풀리다’에 해당하는 동사를 명시하지 않습니다. 해당 표현은 번역 전통에는 있으나 이 본문에 없는 내용을 확정적으로 더합니다.
  - severity: low
    issue: ‘그러자 즉시’의 중복적 연결
    rationale: δέ의 서사 연결과 παραχρῆμα의 시간 부사를 모두 반영할 수 있으나, 한국어에서는 ‘그러자 곧’ 또는 ‘그러자 즉시’ 중 한 결합이 더 자연스럽습니다.
  revised_text: 그러자 그의 입이 곧 열리고 그의 혀도 열렸습니다. 그는 하나님을 찬송하며 말하기 시작했습니다.
