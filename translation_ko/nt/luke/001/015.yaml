- from: 이는 그가 야훼[a] 앞에서 큰 자가 될 것이며, 포도주나 독한 술을 마시지 아니하고, 어머니의 태에서부터 성령으로 충만하게 될 것이기 때문입니다.
  to: 이는 그가 주님 앞에서 큰 사람이 될 것이며, 포도주나 독한 술을 결코 마시지 않을 것이고, 자기 어머니의 태에서부터 성령으로 충만할 것이기 때문입니다.
