  source_fidelity: 초안은 ὅρκον을 ‘맹세’로 옮긴 점과 아브라함을 언급한 점은 적절합니다. 그러나 ‘~을 따라’는 원문에 없는 관계를 더하며, τοῦ δοῦναι ἡμῖν(‘우리에게 주시려고’)의 목적 표현을 빠뜨립니다.
  naturalness: ‘우리 조상 아브라함’은 현대 표준 한국어 성서 문맥에서 자연스럽습니다. 다만 원문의 문장 연결과 미완의 목적절을 반영하도록 ‘우리에게 주시려고 하신’으로 옮기는 것이 더 정확하고 자연스럽습니다.
  terminology: ‘맹세’는 ὅρκος에 알맞습니다. ‘조상’은 자연스러운 번역이나, 원문의 ‘우리의 아버지’라는 언약적·성서적 표현은 각주로 밝혀 두는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘따라’가 원문에 없는 관계를 첨가함
    rationale: ὅρκον은 앞 절의 언약을 기억하심과 연결되는 목적어/동격 요소이며, ‘맹세를 따라’라는 수단·기준의 의미는 본문에 명시되어 있지 않습니다.
  - severity: high
    issue: τοῦ δοῦναι ἡμῖν의 목적 표현 누락
    rationale: 원문은 하나님께서 우리에게 주시려는 목적을 명시합니다. 초안은 이 내용을 전하지 않습니다.
  revised_text: 곧 우리 조상 아브라함에게 맹세하시고 우리에게 주시려고 하신 맹세입니다.
  revised_footnotes:
  - marker: a
    text: ‘우리 조상’은 직역하면 ‘우리의 아버지’입니다. 이는 아브라함을 언약 공동체의 조상으로 부르는 성서적 표현입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 ‘맹세’를 유지하고, ‘우리에게 주시려고’라는 목적을 보완했습니다. 문맥상 앞 절에 이어지는 구절이지만, 한국어에서는 이해 가능한 완결 문장으로 구성했습니다. ‘우리 조상’의 자연스러운 표현을 유지하면서 원문의 ‘우리의 아버지’는 각주로 보존했습니다.
