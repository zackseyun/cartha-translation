  source_fidelity: 초안의 ‘이는’과 ‘…을 따라’는 그리스어 본문에 없으며, 특히 τοῦ δοῦναι ἡμῖν(‘우리에게 주시기 위하여/주시겠다고’)의 내용을 ‘맹세를 따라’로 바꾸어 의미 관계를 달리합니다. ‘우리 조상’은 πατέρα ἡμῶν의 문맥상 가능한 번역입니다.
  naturalness: ‘맹세하신 그 맹세를 따라’는 한국어로도 어색하고, 맹세의 내용을 나타내야 할 자리에 근거나 방식의 뜻을 넣습니다. ‘우리에게 주시겠다고 … 맹세하신 맹세’가 현대 표준어에서 자연스럽습니다.
  terminology: ‘아브라함’, ‘맹세’, ‘우리 조상’은 적절합니다. ‘우리 조상’은 원문의 문자적 표현인 ‘우리 아버지’보다 자연스러우나, 그 번역 선택은 각주로 밝혀 두는 것이 좋습니다.
  issues:
  - severity: high
    issue: ‘맹세를 따라’
    rationale: 원문은 아브라함에게 하신 맹세의 내용/목적을 ‘우리에게 주심’으로 이어 가지만, 초안은 이를 ‘그 맹세를 따라’라는 근거나 방식의 표현으로 바꾸었습니다.
  - severity: medium
    issue: ‘이는’의 첨가
    rationale: 원문은 앞 절의 ‘기억하셨으니’에 이어지는 대격 명사구이며, ‘이는’은 원문에 없는 설명적 연결을 더합니다.
  revised_text: 우리 조상 아브라함에게 우리에게 주시겠다고 맹세하신 그 맹세를
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘우리 아버지 아브라함’입니다. 여기서 ‘아버지’는 아브라함을 이스라엘 백성의 조상으로 부르는 성경적 표현입니다.
    reason: lexical_alternative
  revision_rationale: 앞 절에 이어지는 원문의 미완결 구문(‘…맹세를’)을 유지하되, τοῦ δοῦναι ἡμῖν의 의미를 한국어에서 자연스럽게 드러내기 위해 ‘우리에게 주시겠다고’로 옮겼습니다. 다음 절에서 주어질 내용이 계속되므로 문장을 인위적으로 종결하지 않았습니다.
