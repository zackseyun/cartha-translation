  terminology: ‘예수’는 표준적인 신약 인명 표기입니다. 기존 주석은 예슈아를 단정적으로 ‘히브리어’라고만 규정하고 의미를 ‘YHWH는 구원이시다’로 제시해 언어사와 의미를 다소 단순화합니다. 그리스어 Ἰησοῦς가 히브리어 이름 여호수아/예슈아에 해당한다는 형태로 정확히 고칩니다.
