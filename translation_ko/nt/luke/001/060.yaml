  verdict: revise
  source_fidelity: The draft incorrectly renders καὶ ('and') as '그러나' ('however'). It also shifts the passive future κληθήσεται ('he will be called') to an awkward construction in which 'his name' appears to be the thing called. The correction retains the direct corrective force of οὐχί, ἀλλά.
