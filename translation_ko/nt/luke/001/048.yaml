review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal clause, God's favorable regard, Mary's lowly condition, the forward-looking temporal phrase, and the future acknowledgment by all generations. However, '비천함' can suggest personal baseness as well as low social condition; '비천한 처지' more clearly represents ταπείνωσις here. '자기 여종' is also less clear than an explicitly God-referential possessive in this context.
  naturalness: The register is appropriately modern formal-polite. '보십시오' fittingly renders the emphatic ἰδού. Recasting the first clause with '그분의 여종인 저' is more natural and removes possessive-reference ambiguity; '복되다고 할 것입니다' is standard contemporary quoted-predicate syntax.
  terminology: '''여종'' is an appropriate gender-specific Korean rendering of δούλη and preserves the belonging relation without importing later doctrinal claims. ''비천한 처지'' conveys low status/lowly condition rather than merely an inward virtue.'
  issues:
  - severity: low
    issue: '''비천함'' may be read as personal baseness rather than a lowly social condition.'
    rationale: ταπείνωσιν in this context concerns Mary's lowly condition; '비천한 처지' states this more precisely.
  - severity: low
    issue: '''자기 여종'' has a potentially less immediate possessive reference in Korean.'
    rationale: The Greek αὐτοῦ refers to God. '그분의 여종인 저' makes the referent and Mary's self-designation explicit without adding meaning.
  revised_text: 그분께서 그분의 여종인 저의 비천한 처지를 돌아보셨기 때문입니다. 보십시오, 이제부터 모든 세대가 나를 복되다고 할 것입니다.
