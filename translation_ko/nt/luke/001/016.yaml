  to: 또 그는 이스라엘 자손 가운데 많은 사람을 그들의 주 하나님께로 돌아오게 할 것입니다.
  rationale: Replaced “야훼 하나님” with “주 하나님” to follow the Greek κύριον τὸν θεὸν αὐτῶν directly, retained the covenantal expression “이스라엘 자손,” and used natural formal Korean for the causative sense of ἐπιστρέψει. The unnecessary and overly specific footnote has been removed.
