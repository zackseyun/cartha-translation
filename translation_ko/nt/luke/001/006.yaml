    rationale: 원문은 θεοῦ(‘하나님’)라고 하며, 이 어휘만으로 신명 יהוה를 번역문에 삽입할 수는 없습니다. 문맥상 이스라엘의 하나님을 가리킨다는 점과 특정한 신명을 본문에 명시하는 일은 구별되어야 합니다.
