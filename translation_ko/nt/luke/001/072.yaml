  source_fidelity: 그리스어의 두 부정사는 앞 절의 구원 목적을 이어 줍니다. 초안은 ‘자비를 베푸시고’와 ‘거룩한 언약을 기억하시려는’이라는 핵심 의미를 대체로 전달하지만, ‘그분께서는’과 ‘하시려는 것이며’의 결합은 문체상 다소 부자연스럽습니다. 또한 πατέρων은 문맥상 이스라엘의 선조들을 가리키므로 ‘조상들’은 자연스럽고 의미상 적절합니다.
