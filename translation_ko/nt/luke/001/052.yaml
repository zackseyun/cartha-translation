    reason: lexical_alternative
  revision_rationale: ‘보좌’를 ‘왕좌’로 바꾸어 θρόνων의 정치적 이미지를 분명히 하고, 원문에 없는 ‘그’를 제거했습니다. ταπεινούς는 ‘낮은 자들’로 옮기고 각주에서 ‘겸손한 자들’이라는 가능한 뜻을 제시하여 해석적 축소를 피했습니다.
