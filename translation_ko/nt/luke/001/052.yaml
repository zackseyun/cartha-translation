  source_fidelity: ‘권세자들’은 δυνάστας의 문맥상 의미를 잘 살리지만, ‘그 보좌’는 원문에 없는 지시·소유의 뉘앙스를 더하고 ‘보좌’는 한국어에서 하나님의 보좌를 연상시키기 쉽습니다. ‘왕좌에서’가 θρόνων의 구체적 정치·왕권 이미지를 더 직접적으로 보존합니다. ταπεινούς는 겸손함과 낮은 사회적 처지를 함께 가리킬 수 있으므로, ‘비천한 자들’보다 ‘낮은 자들’이 덜 낙인적이며 문맥상 사회적 낮음을 자연스럽게 나타냅니다. 각주로 ‘겸손한 자들’이라는 가능성을 밝혀 원문의 의미 폭을 보존합니다.
  naturalness: ‘권세자들을 왕좌에서 끌어내리시고 낮은 자들을 높이셨으며,’는 현대 표준 한국어의 성경적 합쇼체 문체에 자연스럽습니다. ‘높이셨으며’는 원문의 병렬 구조와 주어에 대한 높임을 유지합니다.
  terminology: ‘권세자들’은 ‘왕좌’와 결합하여 통치자·권력자라는 δυνάστας의 문맥적 뜻을 적절히 전달합니다. ‘낮은 자들’은 ταπεινούς의 사회적 낮음에 적합하며, 각주가 겸손이라는 병행 의미를 보완합니다.
  issues:
  - severity: low
    issue: ‘그 보좌에서’가 원문에 없는 지시·소유성을 암시함
    rationale: ἀπὸ θρόνων에는 정관사나 소유사가 없습니다. 한국어에서 ‘왕좌에서’라고 하면 자연스럽게 원문의 무관사·복수 일반성을 전달하면서 보좌의 대상을 불필요하게 특정하지 않습니다.
  - severity: medium
    issue: ‘비천한 자들’이 ταπεινούς의 의미 폭을 충분히 보존하지 못함
    rationale: ταπεινούς는 낮은 처지의 사람들과 겸손한 사람들을 모두 가리킬 수 있습니다. ‘낮은 자들’과 대안 각주가 사회적·인격적 의미의 긴장을 보존합니다.
  revised_text: 권세자들을 왕좌에서 끌어내리시고 낮은 자들을 높이셨으며,
