  text: 유대의 왕 헤롯[a] 시대에 아비야 반열에 속한 스가랴라는 한 제사장이 있었습니다. 그에게는 아론의 딸들 가운데 한 사람인 아내가 있었으며, 그 아내의 이름은 엘리사벳이었습니다.
  philosophy: optimal-equivalence
  footnotes:
