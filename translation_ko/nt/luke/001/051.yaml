review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ는 직역하면 ‘그의 팔로 능력을 행하셨다’라는 셈어적 관용구로, 하나님의 능력을 드러내신다는 뜻입니다. 초안의 ‘자기 팔로 능력을 베푸시고’는 ‘능력을 베풀다’가 다소 부자연스럽고 원문의 ‘능력을 나타내다’라는 표현을 충분히 살리지 못합니다. 후반절은 ‘교만한 자들’을 수식하는 ‘그들의 마음의 생각’이라는 관계를 더 분명히 해야 합니다.
  naturalness: ‘그분의 팔로 능력을 나타내시고’는 현대 표준어 합쇼체에서 자연스럽고, 성경의 시적·격조 있는 문맥에도 맞습니다. ‘그들의 마음속 생각이 교만한 자들’은 원문의 다소 압축된 표현을 한국어에서 자연스럽게 유지합니다.
  terminology: ‘팔’은 하나님의 능력을 나타내는 원문의 비유를 보존하며, ‘능력’은 κράτος에 적절합니다. ὑπερήφανοι는 ‘교만한 자들’로, διάνοια καρδίας는 해석적으로 축소하지 않고 ‘마음속 생각’으로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘능력을 베푸시고’
    rationale: 한국어에서 능력을 ‘베풀다’는 결합이 어색하며, κράτος를 ‘드러내다/나타내다’라는 원문의 관용적 의미가 더 잘 전달되도록 고쳐야 합니다.
  - severity: medium
    issue: ‘마음의 생각이 교만한 자들’의 수식 관계
    rationale: 현재 표현은 ‘생각’ 자체가 교만하다는 뜻으로도 읽히며, 소유자 ‘그들의’가 드러나지 않습니다. 원문의 ‘그들의 마음의 생각에서 교만한 자들’이라는 의미를 더 명확히 해야 합니다.
  revised_text: 그분께서 그분의 팔로 능력을 나타내시고, 그들의 마음속 생각이 교만한 자들을 흩으셨습니다.
