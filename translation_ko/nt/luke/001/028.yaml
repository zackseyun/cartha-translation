  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
  footnotes:
  - marker: a
    text: Or “Rejoice” or traditionally “Hail.” The Greek word is an idiomatic greeting, though it is formally an imperative meaning “rejoice.”
    reason: lexical_alternative
  - marker: b
    text: Or “highly favored,” “graced one,” or traditionally “full of grace.” The Greek indicates one who has been shown grace or favor.
    reason: alternative_reading
translation:
  language: ko
  text: 천사가 그녀가 있는 곳으로 들어가 말했습니다. 「안녕하십니까[a], 은혜를 입은 이여[b]. 주께서 당신과 함께 계십니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기뻐하십시오.” 전통적으로는 “문안하노라” 또는 “만세”로 옮기기도 합니다. 그리스어 단어는 형태상 ‘기뻐하다’에서 온 명령형이지만, 여기서는 관용적인 인사입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “크게 은혜를 받은 이,” “은총을 입은 이,” 또는 전통적으로 “은총이 가득한 이.” 그리스어는 은혜 또는 호의를 받은 이를 가리킵니다.
    reason: alternative_reading
