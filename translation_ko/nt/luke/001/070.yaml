  terminology: ‘거룩한 예언자들’, ‘입을 통하여’, ‘옛적부터’는 각각 ἁγίων προφητῶν, διὰ στόματος, ἀπ’ αἰῶνος를 적절히 반영합니다. ‘자신의’는 예언자들이 하나님께 속함을 자연스럽게 나타냅니다.
