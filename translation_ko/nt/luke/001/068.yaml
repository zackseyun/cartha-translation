  text: 「이스라엘의 하나님이신 주님은 찬송받으실 분이십니다. 이는 그분께서 자기 백성을 돌보시고 그들에게 속량을 이루어 주셨기 때문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ
  english_pob_choice: Blessed is the Lord, the God of Israel
  chosen_korean: 찬송하리로다, 이스라엘의 야훼 하나님이시여
  alternatives_korean:
