review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘그분 앞서 나아가’는 한국어에서 부자연스럽고, προελεύσεται ἐνώπιον αὐτοῦ의 ‘그분보다 앞서 가다’라는 선행·준비의 의미를 분명히 하기 위해 고칠 필요가 있습니다. 또한 ἐν φρονήσει δικαίων은 단순한 일반 지식보다는 의인들의 분별력/통찰을 가리킵니다.
  naturalness: 현대 표준어 합쇼체로 ‘그분보다 앞서 나아가’, ‘의인들의 분별력으로 돌이키고’, ‘주님을 위하여’가 더 자연스럽고 명료합니다. 병렬된 두 목적 부정사와 미래 서술도 유지했습니다.
  terminology: ‘엘리야의 영과 능력’, ‘의인’, ‘주님’, ‘백성’은 본문의 어휘와 한국어 성경적 문체에 잘 맞습니다. ‘주님’은 κυρίῳ를 존칭으로 자연스럽게 옮기며, 본문이 남기는 지시 대상의 명시성은 추가하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그분 앞서 나아가’의 문법·표현
    rationale: 조사 없이 ‘앞서’를 연결한 표현은 어색합니다. 또한 ‘그분보다 앞서’는 그분에 앞서 가며 길을 준비한다는 προελεύσεται ἐνώπιον αὐτοῦ의 기능적 의미를 자연스럽게 드러냅니다.
  - severity: low
    issue: ‘의인의 지혜’의 의미 범위
    rationale: φρόνησις는 지혜 일반보다 실천적 이해·분별력의 뜻이 두드러집니다. 복수 δικαίων에 맞춰 ‘의인들의 분별력’으로 옮기면 원문의 형태와 의미를 더 잘 반영합니다.
  revised_text: 그가 엘리야의 영과 능력으로 그분보다 앞서 나아가, 아버지들의 마음을 자녀들에게로 돌이키고 거역하는 사람들을 의인들의 분별력으로 돌이켜, 잘 준비된 백성을 주님을 위하여 예비할 것입니다.
  revised_footnotes:
  - marker: a
    text: ‘자녀들에게로’는 ‘자녀들을 향하여’로도 옮길 수 있습니다. 이 표현은 말라기 4:6을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의인들의 분별력’은 ‘의인들의 지혜로운 생각’ 또는 ‘의인들의 통찰’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘엘리야의 영과 능력으로’는 엘리야와 같은 예언자적 사명과 능력을 가리키며, 엘리야 자신이 문자적으로 돌아왔다는 뜻을 반드시 포함하지는 않습니다.
    reason: cross_reference
  revision_rationale: 원문의 미래 동사와 목적을 나타내는 두 부정사의 병렬을 보존했습니다. ‘그분보다 앞서’로 선행하여 준비하는 의미를 자연스럽게 했고, φρόνησις를 ‘분별력’으로 옮겨 윤리적·실천적 이해의 뉘앙스를 반영했습니다. 본문이 명시하지 않는 ‘그분’의 정체는 확정하지 않았습니다.
