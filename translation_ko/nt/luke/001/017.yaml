review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 두 목적 부정사는 대체로 반영되어 있습니다. 그러나 ‘그분 앞서 나아가’는 한국어 문법상 조사가 빠져 있고, ἐνώπιον αὐτοῦ의 선행 의미를 분명히 하려면 ‘그분보다 앞서’가 적절합니다. 또한 ἐν φρονήσει δικαίων은 ‘의인들의 지혜로’라는 방향적 결과가 드러나도록 보완하는 것이 좋습니다.
  naturalness: ‘그분 앞서 나아가’는 비문에 가깝습니다. ‘그분보다 앞서 가서’, ‘돌아오게 하며’, ‘주님을 위하여’로 고치면 현대 표준어 합쇼체 문장으로 자연스럽고 문장 구조도 명료해집니다.
  terminology: ‘엘리야’, ‘의인’, ‘백성’, ‘주님’은 적절합니다. ‘주님’은 κυρίῳ를 자연스러운 한국어 존칭으로 옮기며, 본문이 남기는 지시 대상의 명시성도 보존합니다. ‘엘리야의 영과 능력으로’는 동일 인물이라는 뜻을 부가하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그분 앞서 나아가’에 필요한 조사와 선행 의미가 불분명합니다.
    rationale: ἐνώπιον αὐτοῦ와 προελεύσεται는 그분보다 앞서 감을 나타냅니다. 한국어에서는 ‘그분보다 앞서 가서’처럼 표현해야 문법적이고 자연스럽습니다.
  - severity: low
    issue: ‘거역하는 자들을 의인의 지혜로 돌이켜’는 목적지와 변화의 의미가 다소 압축되어 있습니다.
    rationale: ἐπιστρέψαι ἀπειθεῖς ἐν φρονήσει δικαίων은 거역하는 이들이 의인들의 분별/지혜로 돌아오게 되는 뜻입니다. ‘돌아오게 하며’가 이를 더 명확히 합니다.
  revised_text: 그가 엘리야의 영과 능력으로 그분보다 앞서 가서, 아버지들의 마음을 자녀들에게로 돌이키고 거역하는 사람들을 의인들의 지혜로 돌아오게 하며, 주님을 위하여 잘 준비된 백성을 마련할 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘자녀들을 향하여’. 이 표현은 말라기 4:6을 반영하며, 깨어진 가족 관계의 회복을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의인들의 분별로’ 또는 ‘의인들의 생각으로’.
    reason: lexical_alternative
  - marker: c
    text: ‘엘리야의 영과 능력으로’는 엘리야와 같은 예언자적 사명과 능력을 가리키며, 반드시 엘리야가 문자 그대로 돌아온다는 뜻은 아닙니다.
    reason: cross_reference
  revision_rationale: 문법상 불완전한 ‘그분 앞서’를 ‘그분보다 앞서 가서’로 고쳐 원문의 선행 의미를 살렸습니다. 거역하는 이들이 의인들의 지혜를 향해 전환되는 의미를 자연스럽게 밝혔고, 두 목적 부정사의 병렬 및 ‘준비된 백성’의 결과 상태를 유지했습니다. 각주에서는 말라기 반향, φρόνησις의 어휘 범위, 엘리야 표현의 비동일시적 의미를 본문에 과도한 해석을 넣지 않고 제시했습니다.
