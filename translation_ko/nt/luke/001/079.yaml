    rationale: Replacing ‘자들’ with ‘이들’ improves contemporary readability without weakening the literal seated/sitting imagery.
  - severity: low
    issue: The English audit trail documents a lexical alternative for ‘shadow of death,’ but the Korean draft has no corresponding anchored note.
    rationale: A brief note can preserve awareness that ‘death’s shadow’ is an equally viable Korean phrasing, while the main text correctly retains the explicit ‘death.’
