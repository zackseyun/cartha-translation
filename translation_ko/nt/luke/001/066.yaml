base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
  footnotes:
  - marker: a
    text: Or, 'will this child be?' The Greek verb is simply 'will be,' but in context it asks about the child's future identity or role.
    reason: lexical_alternative
  - marker: b
    text: '''The hand of the Lord'' is a biblical idiom for God''s active power, favor, or guidance.'
    reason: cultural_note
translation:
  language: ko
  text: 이를 들은 사람들은 모두 그것을 마음에 간직해 두고 말했습니다. “그러면 이 아이는 장차 어떻게 되겠는가?” 실제로 주의 손[a]이 그와 함께 계셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「주의 손」은 하나님의 능력, 은총 또는 인도하심을 나타낼 수 있는 성경의 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: χεὶρ κυρίου
  english_pob_choice: the hand of the Lord
  chosen_korean: 야훼의 손
  alternatives_korean:
