id: LUK.16.6
reference: Luke 16:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
  footnotes:
  - marker: a
    text: A bath was an ancient liquid measure. The Greek reads ‘a hundred baths of olive oil.’
    reason: cultural_note
  - marker: b
    text: Or ‘your written contract’ or ‘your documents’; Greek ‘your writings.’ In context this refers to the debtor’s written bill or debt record.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “기름 백 밧[a]입니다.” 그러자 청지기가 그에게 말했습니다. “당신의 문서[b]를 받아 앉아서, 속히 오십이라고 쓰십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밧’은 고대의 액량 단위입니다. 그리스어는 ‘기름 백 밧’이라고 합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘당신의 증서’ 또는 ‘당신의 기록’. 그리스어는 복수형 ‘글들/문서들’이며, 문맥에서는 채무를 적은 문서를 가리킵니다.
    reason: lexical_alternative
