  source_fidelity: 핵심 의미는 대체로 반영했으나, ‘엄히 증언하여’는 이 문맥에서 경고의 기능을 충분히 드러내지 못하며, 겹친 인용부호는 구조상 오류입니다. διαμαρτύρηται는 엄숙한 증언과 강한 경고의 양쪽 뉘앙스를 지니지만, 뒤의 ‘오지 않게’ 목적절 때문에 ‘엄중히 경고하다’가 본문에 가장 자연스럽습니다.
