- from: 「그가 부르짖어 말하였다. 「아버지 아브라함이여, 나를 긍휼히 여기시어 나사로를 보내, 그의 손가락 끝에 물을 찍어 내 혀를 시원하게 하여 주십시오. 제가 이 불꽃 가운데서 괴로움을 받습니다.」」
  to: 그가 큰 소리로 외쳐 말했습니다. “아버지 아브라함이여, 저에게 자비를 베풀어 주시고 나사로를 보내어 그의 손가락 끝을 물에 적셔 제 혀를 식혀 주십시오. 제가 이 불꽃 속에서 고통을 겪고 있습니다.”
  rationale: φωνήσας의 긴급하고 큰 소리의 호소를 「큰 소리로 외쳐」로, βάψῃ의 구체적 동작을 「손가락 끝을 물에 적셔」로 바로잡았습니다. καταψύξῃ는 ‘식혀’로, ὀδυνῶμαι는 강도를 약화하거나 교리적으로 확대하지 않는 「고통을 겪고 있습니다」로 옮겼습니다. 원문의 청원문 구조와 단수 「이 불꽃」도 유지했습니다.
  reviewer_model: gpt-5.6-terra
