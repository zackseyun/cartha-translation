  source_fidelity: 수정이 필요합니다. 초안의 「그의 손가락 끝에 물을 찍어」는 βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος(그의 손가락 끝을 물에 담그다/적시다)의 동작과 문법적 관계를 충분히 재현하지 못합니다. 또한 ὀδυνῶμαι는 중간태 동사로, 수동적인 「괴로움을 받습니다」보다 ‘고통을 겪고 있습니다’가 직접적입니다.
  naturalness: 합쇼체는 대체로 유지되었으나, 겹따옴표와 「손가락 끝에 물을 찍어」는 현대 표준어 문장으로 부자연스럽습니다. 직접 인용문을 한 쌍의 따옴표로 처리하고, ‘손가락 끝을 물에 적셔’로 고치면 자연스럽고 명료합니다.
  terminology: 「아버지 아브라함이여」는 Πάτερ Ἀβραάμ에 충실합니다. ἐλέησόν με는 현대적이면서도 격식 있는 「저에게 자비를 베풀어 주시고」로 옮겼습니다. φλόξ의 단수·구체성은 「이 불꽃 속에서」로, καταψύξῃ의 냉각 행위는 「제 혀를 식혀」로 보존했습니다.
