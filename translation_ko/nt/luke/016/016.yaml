id: LUK.16.16
reference: Luke 16:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
  footnotes:
  - marker: a
    text: Or 'everyone is pressing into it.' The Greek verb can convey forceful movement; the wording here reflects the sense of urgent entry into the kingdom.
    reason: lexical_alternative
  - marker: b
    text: Some understand the final clause more negatively in light of a similar saying in Matthew 11:12, but here the Greek subject is 'everyone,' not 'the kingdom.'
    reason: alternative_reading
translation:
  language: ko
  text: 「율법과 예언자들은 요한 때까지였습니다. 그때부터 하나님 나라는 좋은 소식으로 선포되며, 모든 사람이 그 나라로 힘을 다해 밀고 들어갑니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람이 그 나라로 밀고 들어갑니다.’ 그리스어 동사는 힘이나 격렬한 움직임을 나타낼 수 있습니다. 이 절에서는 주어가 ‘모든 사람’이며, 어떤 이들은 마태복음 11:12의 비슷한 말씀에 비추어 이 표현을 더 부정적으로 이해하기도 합니다.
    reason: lexical_alternative
