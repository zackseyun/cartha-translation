translation:
  language: ko
  text: 「어떤 부자가 있었습니다. 그는 자색 옷과 고운 베옷을 입고, 날마다 호화롭게 잔치를 벌이며 지냈습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “날마다 화려하게 즐겼다.” 그리스어 εὐφραινόμενος는 즐거워하다, 축제를 벌이다, 잔치를 즐기다 등의 뜻을 낼 수 있으며, 여기서는 사치스러운 생활의 문맥상 잔치를 벌이는 뜻으로 옮겼습니다.
    reason: lexical_alternative
