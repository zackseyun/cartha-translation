  yaml_path: translation/nt/luke/016/019.yaml
  text: Now there was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
  footnotes:
  - marker: a
    text: Or 'feasting sumptuously every day.' The participle εὐφραινόμενος can suggest festive enjoyment or feasting, and λαμπρῶς can emphasize luxurious magnificence.
