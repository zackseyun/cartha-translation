  source_fidelity: 핵심 의미는 대체로 반영되었으나, ἵνα ὅταν의 목적과 미래 조건의 관계가 더 분명해야 합니다. 또한 μετασταθῶ는 관리 직분을 자발적으로 ‘물러나는’ 것이 아니라 그 직분에서 제거되는 뜻입니다.
  naturalness: 합쇼체 본문으로 자연스럽게 다듬을 수 있습니다. 겹친 인용 부호는 제거해야 하며, ‘영접하게 하리라’는 현대 한국어에서 다소 부자연스럽고 타인에게 그렇게 하도록 강제하는 뉘앙스를 줄 수 있습니다.
  terminology: οἰκονομία는 이 비유의 문맥에서 ‘청지기 직분’으로 옮기는 것이 직무에서 해임되는 의미를 명료하게 합니다. δέξωνταί는 거처로 받아 주는 문맥이므로 ‘맞아들이도록’이 적절합니다.
  issues:
  - severity: medium
    issue: ‘청지기 직분에서 물러날 때’
    rationale: μετασταθῶ는 수동태로, 직분에서 제거되거나 해임되는 것을 가리킵니다. ‘물러나다’는 자발적 사임으로 이해될 수 있습니다.
  - severity: medium
    issue: ‘사람들이 나를 자기 집으로 영접하게 하리라’
    rationale: ἵνα는 그가 세운 계획의 목적을 나타냅니다. 한국어에서는 ‘맞아들이도록 하겠다’가 목적 관계를 더 자연스럽게 드러내며, ‘영접하게 하리라’의 강제적·고풍스러운 뉘앙스를 피합니다.
  - severity: low
    issue: 겹친 인용 부호
    rationale: 본문에 「「와 」」가 사용되어 있으므로 한 쌍의 인용 부호로 정리해야 합니다.
  revised_text: 「내가 무엇을 해야 할지 알겠다. 내가 청지기 직분에서 쫓겨날 때에 사람들이 나를 자기들의 집으로 맞아들이도록 하겠다.」
  revised_footnotes: []
  revision_rationale: ἔγνων τί ποιήσω의 숙고 끝에 이른 결정을 ‘무엇을 해야 할지 알겠다’로, 수동태 μετασταθῶ를 ‘청지기 직분에서 쫓겨날 때’로 옮겼습니다. ἵνα ὅταν의 목적과 미래 조건은 ‘…때에 …맞아들이도록 하겠다’로 보존했습니다. ἑαυτῶν의 재귀적 강조도 ‘자기들의 집’에 반영했습니다.
