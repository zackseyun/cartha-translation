  verdict: revise
  source_fidelity: 초안의 ‘물러날’은 μετασταθῶ의 수동태 및 직위에서 제거·해임되는 문맥을 자발적 사임처럼 바꾸므로 수정이 필요합니다. 또한 ἵνα ὅταν의 목적과 미래 조건은 ‘…때, …하도록 하겠다’로 보존했습니다.
  naturalness: ‘이제 내가 무엇을 할지 알았다’는 ἔγνων의 깨달음·결심의 뉘앙스를 자연스럽게 드러냅니다. ‘자기들의 집으로 맞아들이도록 하겠다’는 환대의 뜻을 살리면서 현대 표준어 합쇼체 서술에 맞습니다.
  terminology: οἰκονομία는 비유의 직접 문맥에서 ‘청지기 직분’으로 옮겼습니다. 이는 추상적 의미의 ‘경제’나 교리화된 용법을 피하면서 관리자로서의 직분을 나타냅니다.
  issues:
  - severity: high
    issue: ‘청지기 직분에서 물러날 때’
    rationale: μετασταθῶ는 수동태로, 관리 직위에서 제거되거나 해임되는 것을 뜻합니다. ‘물러나다’는 자발적으로 사임하는 의미를 암시할 수 있습니다.
  - severity: medium
    issue: ‘사람들이 … 영접하게 하리라’
    rationale: δέξωνταί의 주어는 문맥상 그가 계획으로 도움을 얻게 하려는 사람들입니다. 막연한 ‘사람들’보다 ‘그들’을 쓰고, ἵνα의 목적을 ‘…하도록 하겠다’로 나타내는 편이 더 충실합니다.
  revised_text: “이제 내가 무엇을 할지 알았다. 내가 청지기 직분에서 쫓겨날 때, 그들이 나를 자기들의 집으로 맞아들이도록 하겠다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘내가 청지기 직분에서 해임될 때.’
    reason: μετασταθῶ ἐκ τῆς οἰκονομίας의 직위 상실을 나타내는 수동 표현에 대한 어휘적 대안입니다.
  revision_rationale: 수동적 해임의 의미를 바로잡고, 목적절과 미래 조건을 유지했으며, 불필요하게 일반화된 주어를 문맥에 맞게 조정했습니다. 인용부호도 표준 한국어 인용부호 한 쌍으로 정리했습니다.
