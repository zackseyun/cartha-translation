review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하나, 현대 합쇼체 기준에서 ‘이르노니’와 ‘하려 함이다’는 문체가 고풍스럽습니다. 또한 ἐκλίπῃ의 주어와 σκηναί의 비유적·문자적 범위를 본문만으로 다소 확정하므로, 원문의 남아 있는 모호성은 각주로 보존하는 편이 좋습니다.
  naturalness: ‘내가 너희에게 말합니다’와 ‘…하려는 것입니다’가 현대 표준 한국어의 격식 있는 합쇼체에 더 자연스럽습니다. ‘너희 자신을 위하여’는 문법적으로 가능하지만 ‘너희를 위해’가 더 자연스럽습니다.
  terminology: ‘불의한 재물’은 ἀδικίας의 넓은 의미를 유지하며, 부정하게 취득한 재물로 한정하지 않습니다. σκηναί는 본문에서 ‘거처’로 자연스럽게 옮기되, ‘장막’이라는 직역 가능성은 각주에 남깁니다. δέξωνται의 주체는 그대로 ‘그들이’로 남겨 정체를 해석적으로 보충하지 않습니다.
