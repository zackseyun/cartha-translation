review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative, the instrumental use of 'unrighteous wealth,' the implicit subject of 'they,' and the eternal dwelling-place imagery. Its explicit subject '그 재물' for ἐκλίπῃ follows the most natural contextual referent, but the viable alternative that the hearers themselves 'fail' (die) should be retained in a note.
  naturalness: The use of '이르노니' and '함이다' is archaic and does not meet the requested modern formal-polite 합쇼체. '영접하다' is understandable but '맞아들이다' is more natural for reception into a dwelling in contemporary Korean.
  terminology: '''불의한 재물'' preserves the breadth of μαμωνᾶς τῆς ἀδικίας without limiting it to fraudulently acquired money. ''영원한 거처'' naturally renders σκηνάς as places of abode; the Korean collective singular is idiomatic while preserving the sense.'
  issues:
  - severity: medium
    issue: Archaic register
    rationale: '''이르노니'' and ''하려 함이다'' are not natural modern 합쇼체 and should be modernized.'
  - severity: low
    issue: Disputed implicit subject of ἐκλίπῃ is unnoted
    rationale: Rendering the verb with '그 재물이 다할 때' is contextually sound, but the alternative reading 'when you fail/die' remains possible and should be marked in a footnote.
  - severity: low
    issue: Purpose/result clause is stiff
    rationale: The phrase '그들이 ... 영접하게 하려 함이다' is grammatically interpretable but unnatural Korean. A result formulation following the imperative communicates the Greek ἵνα clause idiomatically.
  revised_text: 「내가 너희에게 말합니다. 불의한 재물로 너희 자신을 위해 친구를 사귀십시오. 그리하면 그 재물이 다할 때에 그들이 너희를 영원한 거처로 맞아들일 것입니다.」
  revised_footnotes:
  - marker: a
    text: 또는 “너희가 다할 때에” 또는 “너희가 죽을 때에.” 그리스어 동사의 주어는 명시되어 있지 않습니다. 많은 이들은 재물이 다하는 것을 가리킨다고 보지만, 사람의 죽음을 가리킨다고 이해하는 이들도 있습니다.
    reason: alternative_reading
  revision_rationale: 현대 합쇼체로 고치고, 원문의 불의한 재물·암시된 ‘그들’·영원한 거처의 표현을 유지했습니다. ἐκλίπῃ의 문맥상 자연스러운 해석인 ‘재물이 다할 때’를 본문에 두되, 주어가 문법적으로 명시되지 않은 점과 대안적 해석을 각주로 보존했습니다.
