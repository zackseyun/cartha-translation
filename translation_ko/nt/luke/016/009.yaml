    rationale: ‘이르노니’와 ‘하려 함이다’는 현대 표준어의 formal-polite register보다 문어적·고전 번역체에 가깝습니다.
  - severity: low
    issue: ἐκλίπῃ의 해석상 대안 및 σκηναί의 문자적 이미지를 각주로 보존할 필요
    rationale: ‘그 재물이 다할 때’는 문맥상 타당하지만, 동사의 주어는 그리스어에서 명시되지 않았고 일부는 사람의 죽음으로 이해합니다. ‘처소’는 자연스럽지만 σκηναί의 ‘장막’ 이미지를 각주로 남기는 것이 최적 등가에 부합합니다.
