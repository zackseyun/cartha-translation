  text: Now it happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
  footnotes:
  - marker: a
    text: Or 'to Abraham’s side.' The Greek expression is literally 'to the bosom of Abraham,' an image of closeness, honor, and fellowship.
