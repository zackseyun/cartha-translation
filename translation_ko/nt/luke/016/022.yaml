translation:
  language: ko
  text: 「그 가난한 사람이 죽어 천사들에게 아브라함의 품으로[a] 옮겨졌습니다. 그 부자도 죽어 장사되었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함 곁으로’. 직역하면 ‘아브라함의 품으로’이며, 친밀함과 존귀한 교제를 나타내는 비유적 표현입니다.
    reason: lexical_alternative
