review_pass:
  verdict: revise
  source_fidelity: 초안은 두 주인을 섬길 수 없다는 핵심과 두 대조 구절을 대체로 반영합니다. 그러나 οὐδεὶς의 보편 부정은 ‘한 집의 종’보다 ‘어떤 집안 종도’로 옮기는 편이 정확하며, μαμωνᾷ를 단순히 ‘재물’로 옮기면 하나님과 경쟁하는 주인으로 제시된 의인화된 대조가 약화됩니다.
  naturalness: ‘한 집의 종’, ‘혹 이를 … 혹 이를 …’은 현대 표준 한국어 합쇼체에서 다소 부자연스럽습니다. ‘어떤 집안 종도’, ‘한 주인을 … 다른 주인을 … 하거나’의 구성이 자연스럽고 명료합니다.
  terminology: οἰκέτης는 ‘집안 종’으로 घरेलestic/household의 범위를 살렸습니다. ἀνθέξεται는 단순 추종보다 충성·애착의 뜻이므로 ‘충성하고’로 수정했습니다. μαμωνᾷ는 ‘맘몬’으로 음역하고 각주에서 재물 또는 돈이라는 뜻과 수사적 의인화를 설명하는 것이 원문의 긴장을 보존합니다.
  issues:
  - severity: medium
    issue: ‘한 집의 종’은 οὐδεὶς οἰκέτης의 보편 부정을 충분히 드러내지 못하고 한국어로도 어색합니다.
    rationale: 원문은 특정 ‘한’ 종이 아니라 ‘어떤 집안 종도’ 두 주인을 섬길 수 없다는 일반 명제를 말합니다.
  - severity: medium
    issue: ἀνθέξεται를 ‘따르고’로 옮기면 충성하여 굳게 붙드는 뜻이 약해집니다.
    rationale: 이 문맥에서 ἀντέχομαι는 한 주인에게 붙들려 충성하는 태도를 뜻하며, ‘충성하고’가 대조되는 ‘업신여기다’와도 잘 어울립니다.
  - severity: medium
    issue: μαμωνᾷ를 ‘재물’로만 번역하여 원문의 ‘맘몬’ 표현이 지닌 경쟁하는 주인으로서의 의인화가 약화됩니다.
    rationale: 하나님과 맘몬의 병치는 부를 경쟁적 주인처럼 제시하는 수사입니다. ‘맘몬’과 설명 각주가 이를 보존합니다.
