source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
  footnotes:
  - marker: a
    text: Or 'wealth' or 'money.' The Greek uses Mammon, a term for riches treated here as a rival master.
    reason: lexical_alternative
translation:
  language: ko
  text: 「어떤 집안 종도 두 주인을 섬길 수 없습니다. 한 주인을 미워하고 다른 주인을 사랑하거나, 한 주인에게 충성하고 다른 주인을 업신여길 것이기 때문입니다. 너희는 하나님과 맘몬[a]을 섬길 수 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맘몬’은 재물 또는 돈을 가리키는 말입니다. 여기서는 하나님과 대조되어, 사람의 충성을 요구하는 경쟁하는 주인처럼 표현됩니다.
    reason: lexical_alternative
