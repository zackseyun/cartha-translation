- from: 「한 집의 종이 두 주인을 섬길 수 없으니, 혹 이를 미워하고 저를 사랑하거나, 혹 이를 따르고 저를 업신여길 것이기 때문이다. 너희가 하나님과 재물을 함께 섬길 수 없다.」
  to: 「어떤 집안 종도 두 주인을 섬길 수 없습니다. 한 주인을 미워하고 다른 주인을 사랑하거나, 한 주인에게 충성하고 다른 주인을 업신여길 것이기 때문입니다. 너희는 하나님과 맘몬[a]을 섬길 수 없습니다.」
  rationale: 보편 부정, 집안 종이라는 사회적 배경, 두 병행 대조의 충성 관계를 더 정확하고 자연스러운 현대 한국어 합쇼체로 반영했습니다. ‘맘몬’을 보존하되 각주로 어휘 의미와 수사적 의인화를 설명했으며, 이를 별도의 실제 신격에 관한 주장으로 확대하지 않았습니다.
