base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
  footnotes:
  - marker: a
    text: Or 'in the least.' The Greek expression refers to what is very small or insignificant.
    reason: lexical_alternative
  - marker: b
    text: Or 'dishonest' or 'unjust' for 'unrighteous.' The Greek term is broader than financial dishonesty, though that nuance fits the surrounding context.
    reason: lexical_alternative
