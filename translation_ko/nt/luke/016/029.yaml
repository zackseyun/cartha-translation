  source_fidelity: 그리스어의 대화 전환(δὲ), ‘모세와 예언자들’이라는 관용적 표현, 그리고 3인칭 복수 명령법(ἀκουσάτωσαν)을 반영해야 합니다. 초안의 ‘그들의 말을 들으라’는 명령의 대상이 불분명하고 2인칭 명령으로 읽힐 수 있습니다.
  naturalness: 초안은 겹낫표가 잘못 배치되어 있으며, ‘말하였다/들으라’는 요구된 현대 합쇼체와 맞지 않습니다. ‘말했습니다’ 및 ‘듣게 하십시오’가 현대적이고 문맥상 자연스럽습니다.
  terminology: ‘모세와 예언자들’은 원문의 표현을 보존하면서 성경의 증언을 가리키는 관용적 용법을 유지합니다. ‘선지자들’보다 현대 표준 성경 용례에도 널리 쓰이는 ‘예언자들’을 사용했습니다.
  issues:
