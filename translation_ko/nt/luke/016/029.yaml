review_pass:
  verdict: revise
  source_fidelity: The draft conveys the basic meaning, but its rendering of the third-person plural imperative (ἀκουσάτωσαν) as “들으라” changes the addressee to a second-person command. The revised wording preserves the request/command that the brothers listen to Moses and the prophets. The mild connective δέ is represented by “그러나.”
  naturalness: The draft has malformed nested quotation marks and mixes a past declarative ending (“말하였다”) with the required modern formal-polite 합쇼체. The revision uses standard Korean quotation marks and consistent formal-polite narrative style.
  terminology: “모세와 예언자들” accurately retains the Greek expression and its conventional scriptural sense without expanding it into an interpretation. “예언자들” is natural modern standard Korean. The pronoun’s referent is made clear in the imperative clause without adding theological content.
  issues:
  - severity: medium
    issue: Imperative person is mistranslated
    rationale: '“그들의 말을 들으라” is a second-person plural command, whereas ἀκουσάτωσαν is a third-person plural imperative: “let them listen/hear.”'
  - severity: medium
    issue: Quotation punctuation is malformed
    rationale: The draft begins two opening quotation marks and closes them in an irregular nested pattern, although there is only one level of direct speech.
  - severity: low
    issue: Register is inconsistent with the requested 합쇼체
    rationale: “말하였다” is plain narrative style; “말하였습니다” consistently uses the requested formal-polite register.
  revised_text: 그러나 아브라함이 말하였습니다. “그들에게는 모세와 예언자들이 있으니, 그들이 모세와 예언자들의 말을 듣게 하십시오.”
  revised_footnotes: []
  revision_rationale: The revision corrects the grammatical force of the Greek third-person plural imperative, regularizes quotation punctuation, and uses modern formal-polite Korean. Repeating “모세와 예언자들” in place of the pronoun removes avoidable Korean ambiguity while retaining the source’s intended referent and meaning.
