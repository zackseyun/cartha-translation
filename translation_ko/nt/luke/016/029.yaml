    rationale: 한 화자의 발화이므로 한 쌍의 한국어 인용 부호로 처리해야 합니다.
  - severity: medium
    issue: ‘그들의 말을 들으라’가 3인칭 복수 명령법을 충분히 드러내지 못하고 합쇼체도 아닙니다.
    rationale: ἀκουσάτωσαν은 ‘그들이 듣게 하십시오’라는 3인칭 복수 명령입니다. 이 문맥에서는 ‘그들이 그들의 말을 듣게 하십시오’가 수신자와 실제로 들어야 할 사람들을 구별합니다.
  - severity: low
    issue: ‘말하였다/들으라’는 지정된 현대 합쇼체와 일치하지 않습니다.
    rationale: ‘말했습니다/듣게 하십시오’로 고치면 요구된 문체를 충족합니다.
  revised_text: 그러나 아브라함이 말했습니다. “그들에게는 모세와 예언자들이 있으니, 그들이 그들의 말을 듣게 하십시오.”
  revised_footnotes:
  - marker: a
    text: ‘모세와 예언자들’은 모세의 글과 예언서들에 관련된 성경의 증언을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 직역하면, ‘그들이 그들의 말을 듣게 하십시오.’
    reason: lexical_alternative
  revision_rationale: 원문의 δὲ를 ‘그러나’로, 역사적 현재 λέγει를 자연스러운 한국어 서사 과거 ‘말했습니다’로 옮겼습니다. ‘모세와 예언자들’을 본문에서 보존하고, αὐτῶν의 지시 대상을 ‘그들의 말’로 명시했습니다. 3인칭 복수 명령법의 힘과 합쇼체를 함께 살리기 위해 ‘그들이 … 듣게 하십시오’를 사용했으며, 인용 부호를 바로잡았습니다.
