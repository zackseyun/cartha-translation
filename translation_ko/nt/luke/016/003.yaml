review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the manager's inward deliberation, the removal of his office, and his shame at begging. However, "땅을 팔 힘" means "strength to sell land," whereas σκάπτειν means "to dig" (as hard manual labor). The present force of ἀφαιρεῖται is also better represented explicitly.
  naturalness: The nested Korean quotation marks are unnecessary, and "빌어먹기" is colloquial and does not fit the requested modern formal-polite biblical register. "구걸하기" is natural and suitably neutral.
  terminology: '"주인" appropriately renders κύριος for the human superior in this parable. "관리인" and "관리 맡은 일을" preserve the related sense of οἰκονόμος and οἰκονομία in clear contemporary Korean without importing theological overtones.'
  issues:
  - severity: high
    issue: '"땅을 팔 힘도 없고" mistranslates σκάπτειν.'
    rationale: The Greek infinitive means to dig, not to sell land. This changes the stated alternative livelihood and must be corrected.
  - severity: medium
    issue: The wording does not clearly convey the ongoing/present removal in ἀφαιρεῖται.
    rationale: '"거두어 가고 있으니" naturally reflects that the master is taking the managerial responsibility away from him.'
  - severity: low
    issue: The quotation formatting and "빌어먹기" are unsuitable for the requested register.
    rationale: A single direct-speech quotation is standard Korean usage here; "구걸하기" is formal-neutral and faithful to ἐπαιτεῖν.
  revised_text: 청지기는 속으로 말하였다. “내가 어떻게 할까? 주인이 내게서 관리 맡은 일을 거두어 가고 있으니, 땅을 팔 힘도 없고 구걸하기는 부끄럽다.”
  revised_footnotes: []
  revision_rationale: Corrected the substantive error in σκάπτειν, made the ongoing removal of the office explicit, and adjusted diction and punctuation to standard modern formal Korean. No footnote is needed because the Korean rendering does not depend on a disputed or obscured alternative.
