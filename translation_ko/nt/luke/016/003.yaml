  verdict: revise
  source_fidelity: 초안은 οἰκονόμος/οἰκονομία를 각각 ‘청지기/청지기 직분’으로 옮겨 핵심 역할을 대체로 보존했습니다. 그러나 σκάπτειν은 ‘땅을 파다’라는 육체노동을 가리키므로, ‘땅을 팔 힘’은 형태상 해석될 수 있어도 현대 한국어에서는 뜻이 불필요하게 모호합니다. 또한 원문의 현재적 상황과 독백의 흐름을 더 분명히 드러낼 필요가 있습니다.
  naturalness: ‘땅을 팔 힘’은 ‘토지를 매각하다’로도 즉시 읽힐 수 있으므로 ‘땅을 파는 힘’이 자연스럽고 명료합니다. 초안의 겹따옴표도 같은 「 」를 중첩하여 사용해 인용 구조가 어색합니다. 합쇼체 요청에 맞추어 서술과 독백을 현대적 격식체로 정리했습니다.
  terminology: ‘청지기’와 ‘관리하는 일’은 οἰκονόμος와 οἰκονομία의 사람/직무라는 연관성을 유지합니다. 비유 속 인간 상급자인 κύριος는 ‘주인’으로 옮겨 신적 칭호를 함의하지 않게 했습니다. ‘구걸하다’는 ἐπαιτεῖν의 의미를 정확하고 현대적으로 전달합니다.
  issues:
  - severity: medium
    issue: ‘땅을 팔 힘’의 의미 모호성
    rationale: σκάπτειν은 ‘파다, 땅을 파다’입니다. ‘땅을 팔’은 현대 한국어에서 ‘토지를 매각할’로 읽힐 가능성이 커서 원문의 육체노동 의미를 흐립니다.
  - severity: low
    issue: 중첩 인용부호의 부자연스러움
    rationale: ‘「… 「…」」’는 같은 인용부호를 중첩해 사용하여 한국어 문장부호 관행상 어색합니다. 독백을 별도 문장과 큰따옴표로 처리하는 편이 명료합니다.
  - severity: low
    issue: 영어 감사 기록의 사람/직무 어휘 연관성 주석 미반영
    rationale: 원문은 οἰκονόμος와 οἰκονομία를 동계어로 연결합니다. 한국어에서는 ‘청지기’와 ‘관리하는 일’이 완전한 동계어는 아니므로, 대안 및 원문의 연결을 밝히는 주석이 유익합니다.
  revised_text: 청지기가 속으로 말했습니다. “내가 어떻게 해야 하겠습니까? 주인이 내게서 관리하는 일을 빼앗아 가고 있습니다. 땅을 파는 힘도 없고, 구걸하기에는 부끄럽습니다.”
  revised_footnotes:
  - marker: a
    text: ‘청지기’는 ‘관리인’으로도 옮길 수 있으며, ‘관리하는 일’은 ‘청지기 직분’으로도 옮길 수 있습니다. 그리스어는 사람과 그 직무에 동계어를 사용합니다.
    reason: lexical_alternative
  revision_rationale: σκάπτειν의 구체적 의미를 ‘땅을 파는’으로 명료화하고, 합쇼체에 맞추어 문장을 정리했습니다. οἰκονόμος와 οἰκονομία의 어휘적 연관성은 주석으로 보완했습니다. 본문에 주석 표지를 넣지 않은 이유는 제공된 초안의 구조에 표지 필드가 없기 때문이며, 조판 시 ‘청지기’ 또는 ‘관리하는 일’ 뒤에 a를 붙일 수 있습니다.
