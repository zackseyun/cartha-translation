  to: 아브라함이 그에게 말했습니다. “그들이 모세와 예언자들의 말을 듣지 않는다면[a], 누군가 죽은 사람들 가운데서[b] 살아난다 해도 그들은 설득되지 않을 것입니다[c].”
  rationale: 원문의 조건 구조(‘만일 … 않는다면 … 않을 것이다’), 부정의 강조, ‘죽은 자들 가운데서’라는 부활 표현, 그리고 πεισθήσονται의 일반적 설득/확신 의미를 유지했습니다. 문장부호를 바로잡고 현대 표준어 합쇼체로 다듬었으며, 어휘 대안은 해당 위치에 올바르게 연결했습니다.
