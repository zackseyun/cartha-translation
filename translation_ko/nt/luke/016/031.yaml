id: LUK.16.31
reference: Luke 16:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
  footnotes:
  - marker: a
    text: Or 'hear' or 'heed' for 'listen.' The Greek verb can include both hearing and responsive attention.
    reason: lexical_alternative
  - marker: b
    text: Or 'from among the dead.'
    reason: lexical_alternative
  - marker: c
    text: Or 'will be convinced.' The Greek means 'will be persuaded' or 'convinced,' not necessarily 'will believe' in a narrower theological sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함이 그에게 말했습니다. “그들이 모세와 예언자들의 말을 듣지 않는다면[a], 누군가 죽은 사람들 가운데서[b] 살아난다 해도 그들은 설득되지 않을 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘듣거나 귀 기울이지 않는다면’. 그리스어 동사는 단순히 듣는 것뿐 아니라 반응하여 주의를 기울이는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽은 자들 가운데서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘확신하게 되지 않을 것입니다’. 그리스어는 ‘설득되다’ 또는 ‘확신하게 되다’라는 뜻이며, 더 좁은 신학적 의미의 ‘믿다’를 반드시 뜻하지는 않습니다.
    reason: lexical_alternative
