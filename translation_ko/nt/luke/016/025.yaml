  to: 그러나 아브라함이 말했습니다. “얘야, 네가 살아 있는 동안 좋은 것들을 받았고[a], 나사로도 마찬가지로 나쁜 것들을 받았다는 것을 기억하여라. 이제 그는 여기서 위로를 받고 있지만, 너는 괴로워하고 있다.[b]”
  rationale: 문장부호를 정상화하고, 한국어의 현대적 자연스러움을 위해 서술을 합쇼체로 정리했습니다. 원문의 대구와 복수형을 보존했으며, 사후 고통에 관한 표현은 ‘괴로워하고 있다’로만 옮겨 특정 교리적 해석을 덧붙이지 않았습니다. 영어 감사 기록의 두 어휘 대안은 적절한 위치의 각주로 옮겼습니다.
