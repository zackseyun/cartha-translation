review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘버리고’는 ἀπολύων의 이혼이라는 혼인·법률 문맥의 뜻을 충분히 드러내지 못하며, ‘다른 여자에게 장가드는’은 현대 표준어에서 자연스럽지 않고 결혼 상대를 나타내는 조사도 부정확합니다. 두 번째 절의 수동 완료분사 ἀπολελυμένην은 이혼된 상태의 여자를 가리키므로 이를 반영했습니다.
  naturalness: ‘아내와 이혼하고 다른 여자와 결혼하는 사람은 누구나’ 및 ‘…여자와 결혼하는 사람도’는 현대 표준어 합쇼체로 자연스럽고, 원문의 일반적 진술 형식을 유지합니다.
  terminology: ἀπολύω는 이 문맥에서 ‘이혼하다’, γαμέω는 ‘결혼하다’, μοιχεύω는 ‘간음하다’로 옮겼습니다. ‘남편에게서 이혼당한’은 원문의 수동형과 ἀπὸ ἀνδρός가 나타내는 남편으로부터의 이혼을 보존하려는 표현입니다.
  issues:
  - severity: medium
    issue: ‘버리고’
    rationale: 혼인 관계의 단순한 유기처럼 들릴 수 있어, 이 문맥에서 ἀπολύω가 뜻하는 ‘이혼하다’를 명시하는 편이 정확합니다.
  - severity: medium
    issue: ‘다른 여자에게 장가드는’
    rationale: ‘장가들다’는 현대 공적 번역문에서 성별 표지가 강하고, 결혼 상대에는 통상 ‘~와 결혼하다’를 사용합니다. 원문의 일반적 진술에는 ‘다른 여자와 결혼하는’이 더 정확하고 자연스럽습니다.
  - severity: low
    issue: 두 번째 절의 수동성
    rationale: ‘남편에게서 버려진’은 이혼의 법적·혼인적 의미를 흐립니다. 수동 완료분사가 가리키는 이혼된 상태를 ‘남편에게서 이혼당한’으로 분명히 했습니다.
