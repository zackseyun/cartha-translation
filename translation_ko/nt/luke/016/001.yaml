  language: ko
  text: 예수께서는 또한 제자들에게 말씀하셨습니다. 「어떤 부자에게 청지기가 한 사람 있었는데, 그 청지기가 주인의 재산을 낭비하고 있다는 고발이 그 부자에게 들어갔습니다.」
  philosophy: optimal-equivalence
