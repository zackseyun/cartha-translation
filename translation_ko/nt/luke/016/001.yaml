  source_fidelity: 첫 문장은 예수께서 제자들에게 말씀하신다는 뜻을 충실히 옮겼고, ‘청지기’와 ‘재산’도 각각 οἰκονόμος와 τὰ ὑπάρχοντα에 적절합니다. 그러나 ‘그에게 고발당하였다’는 한국어에서 그 부자가 고발의 행위자인 듯 들릴 수 있으며, διεβλήθη αὐτῷ가 나타내는 ‘그 부자에게 불리한 고발/보고가 들어갔다’는 방향을 명확히 하지 못합니다.
  naturalness: ‘그에게 고발당하였다’는 지시 대상도 다소 모호하고 수동 표현도 자연스럽지 않습니다. ‘…고발이 그 부자에게 들어갔습니다’는 고발·불리한 보고의 내용과 수신자를 자연스럽게 드러냅니다.
  terminology: ‘청지기’는 οἰκονόμος의 전통적이면서도 이해 가능한 번역이며 유지할 수 있습니다. ‘고발’은 법적으로 확정된 사실이 아니라 제기된 불리한 주장이라는 문맥에서 사용하되, ‘고발이 들어갔다’라는 구성으로 आरोप의 미확정성을 보존합니다.
  issues:
