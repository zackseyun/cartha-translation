  terminology: ‘아버지 아브라함이여’ suitably renders the vocative πάτερ Ἀβραάμ in a biblical register without treating it as a doctrinal title. ‘회개할 것입니다’ accurately preserves the established biblical-theological meaning of μετανοέω and is modern formal-polite Korean.
  issues:
