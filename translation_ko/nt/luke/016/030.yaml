  source_fidelity: The draft accurately conveys the contrast, the movement ‘from among the dead’ to the rich man’s brothers, and the moral-spiritual sense of μετανοήσουσιν (‘will repent’). The Korean plural ‘죽은 자들 가운데서’ appropriately reflects νεκρῶν. The conditional-future relation is retained.
