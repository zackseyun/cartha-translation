  text: 그 뒤에 그는 또 다른 사람에게 말했습니다. “당신은 얼마를 빚졌습니까?” 그가 말했습니다. “밀 백 코르[a]입니다.” 그가 그에게 말합니다. “당신의 문서들[b]을 받아 팔십이라고 쓰십시오.”
  philosophy: optimal-equivalence
  footnotes:
