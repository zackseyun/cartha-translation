    text: 또는 ‘당신의 증서’ 또는 ‘당신의 장부’. 그리스어는 문자적으로 ‘당신의 문서들’입니다(τὰ γράμματα). 여기서는 채무와 관련된 작성된 문서를 가리킵니다.
    reason: lexical_alternative
