  to: 예수께서 그들에게 이르셨습니다. “너희는 사람들 앞에서 스스로를 의롭다고 하는 자들이나, 하나님께서는 너희 마음을 아신다. 사람들 사이에서 높은 것은 하나님 앞에서 가증한 것이다.”
