  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
  footnotes:
  - marker: a
    text: Or "hell"; more precisely, "Hades," the realm of the dead, not the final place of judgment implied by "Gehenna."
    reason: lexical_alternative
  - marker: b
    text: Literally, "in his bosom"; traditionally, "in Abraham's bosom."
    reason: lexical_alternative
translation:
  language: ko
  text: 「그가 하데스[a]에서 고통을 겪으면서 눈을 들어, 멀리 있는 아브라함과 아브라함의 품[b]에 있는 나사로를 봅니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음부’. 더 정확히는 ‘하데스’, 곧 죽은 이들의 영역을 가리키며, ‘게헨나’가 암시하는 최종 심판의 장소와는 구별됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 품들에’. 전통적으로 ‘아브라함의 품에’라고 합니다.
