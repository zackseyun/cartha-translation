  rationale: The revision preserves the discourse-additive force of ἐν πᾶσι τούτοις, the perfect passive sense of a permanently established chasm, and the two explicit impossibility clauses. It retains 'wishing to cross' only in the first clause, where the Greek has it, and supplies the explicit crossing verb in the second clause. It also corrects the quotation punctuation and provides the lexical-alternative footnote anchor.
