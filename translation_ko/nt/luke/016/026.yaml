  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
  footnotes:
  - marker: a
    text: Or 'besides all this.' The Greek phrase can introduce an additional consideration in a more idiomatic way.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그뿐 아니라[a], 우리와 너희 사이에는 큰 틈이 굳게 정해져 있습니다. 그래서 여기서 너희에게로 건너가려는 사람들도 갈 수 없고, 거기서 우리에게로 건너올 수도 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 일 가운데서도.’ 그리스어 표현은 문맥상 추가 사항을 도입하는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
