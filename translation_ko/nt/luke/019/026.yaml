  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
  footnotes:
  - marker: a
    text: Or simply, 'will be given.' The Greek does not explicitly include 'more,' though the sense of increase is widely understood in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러분에게 말합니다. 가진 사람마다 더[a] 주어질 것이지만, 가지고 있지 않은 사람에게서는 그가 가진 것마저 빼앗길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 ‘더’가 명시되어 있지 않습니다. 그러나 문맥상 증가의 뜻이 널리 이해됩니다.
    reason: 원문의 δοθήσεται(‘주어질 것이다’)에 대한 문맥상 보완을 투명하게 밝힙니다.
