    text: 또는 “손수건.” 그리스어 수다리온(σουδάριον)은 흔히 얼굴을 닦거나 땀을 닦는 데 쓰는 천을 가리킵니다.
    reason: σουδάριον의 가능한 더 구체적인 의미를 보존하면서, 본문의 중립적인 ‘천’이라는 번역을 설명합니다.
