  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked slave. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
  footnotes:
  - marker: a
    text: Or “By your own words I will judge you.”
    reason: lexical_alternative
  - marker: b
    text: 'Or “wicked servant.” Greek: δοῦλος; rendered “slave” here because the bonded status is contextually salient.'
    reason: alternative_reading
  - marker: c
    text: Or “taking what I did not deposit” for “lay down.”
    reason: lexical_alternative
  - marker: d
    text: Some English versions render the final clause “reaping where I did not sow,” but the Greek here is more literally “reaping what I did not sow.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「악한 종아, 네 입에서 나온 말로 너를 심판하겠다. 너는 내가 두지 않은 것을 가져가고 뿌리지 않은 것을 거두는 엄한 사람인 줄 알고 있었느냐?」
  philosophy: optimal-equivalence
