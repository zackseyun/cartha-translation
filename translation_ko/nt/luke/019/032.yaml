  source_fidelity: 원문의 ἀπελθόντες δὲ οἱ ἀπεσταλμένοι는 ‘그래서/그리하여 보냄을 받은 이들이 가서’로 자연스럽게 옮길 수 있습니다. εὗρον은 목적어가 문맥상 생략되어 있으므로, 한국어에서 목적어 없이 ‘발견했습니다’라고 하면 다소 불완전합니다. ‘말씀하신 그대로인 것을 발견했습니다’는 문맥상 대상은 보완하되 구체적으로 ‘나귀 새끼’를 본문에 삽입하지 않아 원문의 생략을 보존합니다.
  naturalness: 초안의 ‘그분께서 말씀하신 대로 발견했습니다’는 ‘발견하다’의 목적어가 없어 현대 한국어 문장으로는 어색합니다. ‘말씀하신 그대로인 것을 발견했습니다’가 합쇼체 문체에 자연스럽습니다.
  terminology: ‘보내심을 받은 자들’도 이해 가능하지만, 현대 표준어에서는 ‘보냄을 받은 이들’이 더 자연스럽고 원문의 수동 분사 의미를 유지합니다. 본 절에는 별도의 신학 용어 문제나 이름 표기의 변경이 없습니다.
  issues:
  - severity: medium
    issue: ‘발견했습니다’의 목적어가 한국어 문장에서 부자연스럽게 생략되어 있습니다.
    rationale: 그리스어 εὗρον은 문맥상 목적어를 생략할 수 있으나, 한국어 ‘발견하다’는 일반적으로 목적어 또는 이를 받는 구성 요소를 필요로 합니다. ‘그대로인 것을’으로 보완하면 문맥상 의미를 전달하면서도 원문이 직접 명시하지 않은 대상을 단정적으로 삽입하지 않습니다.
