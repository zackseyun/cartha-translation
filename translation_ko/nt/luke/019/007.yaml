revisions:
- from: 그런데 모든 사람들이 이것을 보고 수군거리며 말했습니다. 「그분이 죄인의 집에 들어가 묵으려 하신다.」
  to: 모두가 이것을 보고 수군거렸습니다. “그분이 죄인인 사람의 집에 들어가 묵으려고 하셨다.”
  rationale: The revision preserves the universal reaction, the imperfect grumbling, and the completed entry for the purpose of lodging. It uses natural modern formal-polite Korean and retains the crowd's disparaging designation without adding interpretive theology.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the crowd's negative reaction and Jesus' lodging with a person they label a sinner. However, '묵으려 하신다' shifts the completed aorist action (εἰσῆλθεν) and its purpose infinitive into an unrealized present intention. The Greek presents the complaint as referring to his having gone in to lodge.
  naturalness: The wording is generally natural, but '모든 사람들이' is heavier than needed, and '수군거리며 말했습니다' weakens the imperfect's continuing grumbling. '모두가 ... 수군거렸습니다' is concise, idiomatic, and preserves the ongoing response.
  terminology: '''죄인'' is the established natural Korean rendering for ἁμαρτωλός. Adding ''사람'' retains the explicitly masculine noun ἀνήρ without forcing the unnatural expression ''죄인인 남자.'' ''집'' is idiomatically supplied in Korean to express entering and lodging παρά with a person.'
  issues:
  - severity: medium
    issue: 'The quotation uses a present/prospective expression: ''들어가 묵으려 하신다.'''
    rationale: εἰσῆλθεν is aorist and καταλῦσαι states the purpose of that entry. The crowd complains that Jesus has gone in/entered to lodge, not merely that he now intends to do so.
  - severity: low
    issue: '''수군거리며 말했습니다'' does not clearly reflect the imperfect διεγόγγυζον.'
    rationale: Using '수군거렸습니다' more directly expresses the crowd's ongoing murmuring; the following quotation naturally supplies the content of their speech.
  revised_text: 모두가 이것을 보고 수군거렸습니다. “그분이 죄인인 사람의 집에 들어가 묵으려고 하셨다.”
  revised_footnotes: []
