  verdict: revise
  source_fidelity: 초안은 예루살렘을 향한 2인칭 단수 호칭과 그 안의 ‘자녀들’, 그리고 돌 하나도 남지 않는 파괴의 이미지를 대체로 보존합니다. 그러나 마지막 절을 별도의 ‘이는’ 문장으로 시작하면서 앞 문장의 ‘것이기 때문이다’와 중복되어, 원문의 단일 인과 구조(ἀνθ’ ὧν)를 훼손합니다. 또한 ‘너를 돌보신 때’는 ἐπισκοπή의 방문/감찰이라는 폭넓은 의미를 ‘돌보심’으로 좁힙니다.
  naturalness: ‘땅에 메어치고’는 현대 표준어 합쇼체 성경 문맥에서 다소 거칠고 덜 자연스럽습니다. ‘땅에 내동댕이치고’가 ἐδαφίζω의 파괴적 뜻을 자연스럽게 드러냅니다. 인과절을 하나로 정리하고 종결을 ‘때문입니다’로 하면 합쇼체 문장으로 매끄럽습니다.
  terminology: ἐπισκοπή는 본문에서 신적 방문의 함의를 지니지만, 그 방문이 은혜인지 심판인지 또는 감찰인지 본래 어휘만으로 좁혀지지 않습니다. ‘네게 임한 방문의 때’와 각주는 이 범위를 보존합니다. ‘돌 위에 돌 하나도’는 λίθον ἐπὶ λίθον의 관용적 파괴 표현을 잘 반영합니다.
  issues:
  - severity: high
    issue: 인과 표현이 중복되고 문장 구조가 어색합니다.
    rationale: 초안의 ‘남겨 두지 않을 것이기 때문이다. 이는 … 때문이다’는 원문에 없는 두 겹의 이유 제시이며, 첫 ‘때문이다’에는 연결될 이유가 없습니다. 원문은 파괴의 예고 뒤에 단 한 번의 인과절을 둡니다.
  - severity: medium
    issue: ‘너를 돌보신 때’가 ἐπισκοπή의 의미 범위를 좁힙니다.
    rationale: ἐπισκοπή는 방문, 감찰, 돌봄을 포괄할 수 있으며 문맥상 신적 방문의 의미가 암시되지만, ‘돌보신’은 긍정적 보살핌으로만 해석합니다. 원문의 긴장을 보존할 필요가 있습니다.
  - severity: low
    issue: ‘땅에 메어치고’는 현대적인 문체에서 덜 자연스럽습니다.
    rationale: ‘내동댕이치고’는 대상을 땅바닥으로 내리쳐 파괴한다는 뜻을 자연스럽게 전달합니다.
  - severity: low
    issue: 닫는 인용 부호가 짝 없이 남아 있습니다.
    rationale: 제시된 절 텍스트 안에 여는 인용 부호가 없으므로 삭제해야 합니다.
  revised_text: 그들이 너와 네 안에 있는 네 자녀들을 땅에 내동댕이치고, 네 안에 돌 하나도 돌 위에 남겨 두지 않을 것입니다. 이는 네가 네게 임한 방문[a]의 때를 알지 못했기 때문입니다.
  revised_footnotes:
