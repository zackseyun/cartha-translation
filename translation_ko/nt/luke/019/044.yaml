    text: 또는 ‘감찰’. 그리스어 ‘에피스코페’는 방문이나 감찰을 뜻할 수 있으며, 특히 하나님의 방문이 은혜나 심판을 가져오는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 두 미래동사와 단일 인과절을 보존하도록 문장 구조를 바로잡았습니다. 예루살렘의 의인화와 ‘자녀들’이라는 표현을 유지했으며, ἐπισκοπή는 ‘방문’으로 옮기고 각주에서 감찰 및 신적 방문의 양면 가능성을 밝혀 특정 교리적 해석으로 한정하지 않았습니다.
