review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ἐπισκοπή를 「너를 돌보신 때」로 풀어 하나님의 주체와 긍정적 돌봄을 명시하며, 원문의 ‘방문/감찰’의 폭과 심판을 포함할 수 있는 긴장을 좁힙니다. 또한 원문의 단일 인과절(ἀνθ’ ὧν)을 두 개의 「때문이다」 절로 중복 처리합니다. 수정문은 단일 인과관계를 유지하고 ἐπισκοπή의 모호성을 보존합니다.
  naturalness: 「땅에 메어치고」는 현대 표준어 합쇼체 성경 문장으로 다소 거칠고 어색합니다. 「땅에 내리칠 것이며」가 도시로 의인화된 예루살렘과 그 안의 자녀들에게 함께 적용되는 파괴를 자연스럽게 전달합니다. 종결도 합쇼체로 통일했습니다.
  terminology: 「방문의 때」는 ἐπισκοπή의 전통적 ‘방문’ 의미를 유지하되, 누구의 방문인지와 은혜·심판 중 어느 측면인지를 본문보다 앞서 결정하지 않습니다. 각주에서 ‘감찰’이라는 가능한 어휘적 대안을 제시합니다.
  issues:
  - severity: high
    issue: ἐπισκοπή의 의미를 「너를 돌보신 때」로 확정함
    rationale: 원문은 방문, 감찰, 돌봄/감독의 의미 영역을 가지며 문맥상 심판도 함축할 수 있습니다. 「돌보신」과 명시적 하나님의 주체는 원문의 모호성을 해소합니다.
  - severity: medium
    issue: 인과절의 중복
    rationale: ἀνθ’ ὧν은 한 번의 이유를 제시합니다. 초안의 「…것이기 때문이다. 이는 …때문이다」는 같은 인과를 중복합니다.
  - severity: low
    issue: 현대 한국어에서 어색한 동사 선택
    rationale: 「땅에 메어치고」보다 「땅에 내리칠 것이며」가 현대 문체에서 더 자연스럽고 원문의 파괴 강도를 유지합니다.
  revised_text: 그들이 너와 네 안에 있는 네 자녀들을 땅에 내리칠 것이며, 네 안에 돌 하나도 돌 위에 남겨 두지 않을 것입니다. 이는 네가 너에게 임한 방문의 때를 알지 못했기 때문입니다.」
  revised_footnotes:
  - marker: a
    text: 또는 ‘너에게 임한 감찰의 때’. 그리스어 ἐπισκοπή는 방문 또는 감찰을 뜻할 수 있으며, 특히 은혜나 심판을 가져오는 하나님의 방문을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 두 미래 동사와 단일 이유절을 보존했습니다. 「너」와 「네 안에 있는 네 자녀들」이라는 도시 의인화 및 모성 이미지를 유지하고, ‘돌 하나도 돌 위에’라는 완전한 파괴의 관용적 표현을 자연스럽게 옮겼습니다. ἐπισκοπή는 본문과 각주에서 방문/감찰의 의미 범위를 보존했습니다.
