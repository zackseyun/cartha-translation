  to: 그는 자신의 노예[a] 열 명을 불러, 그들에게 열 므나[b]를 주고 말했습니다. “내가 올 때까지 장사하라[c].”
  rationale: 동사들의 순차 관계를 ‘주고 말했습니다’로 바로잡고, ἑαυτοῦ의 소유 강조를 ‘자신의’로 반영했습니다. 비유의 사회적 관계를 흐리지 않도록 δοῦλος는 ‘노예’로 유지했으며, ‘므나’와 상업 명령에 필요한 주석을 추가했습니다. ‘내가 올 때까지’는 ἐν ᾧ ἔρχομαι의 관용적 시간 표현을 보존합니다.
