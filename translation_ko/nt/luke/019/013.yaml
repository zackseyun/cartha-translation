review_pass:
  verdict: revise
  source_fidelity: 초안은 βασ문 내용(열 명을 부름, 열 므나를 줌, 사업을 명함)을 대체로 전달합니다. 그러나 καλέσας 뒤의 ἔδωκεν과 εἶπεν은 모두 과거 서술이므로 ‘주며 말했습니다’보다 ‘주고 말했습니다’가 원문의 사건 순서를 정확히 반영합니다. ἑαυτοῦ의 소유 강조도 ‘자기’보다 ‘자신의’로 더 자연스럽고 분명하게 옮길 수 있습니다.
  naturalness: ‘자신의 노예 열 명을 불러, 그들에게 열 므나를 주고 말했습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. 직접 명령인 ‘장사하라’는 주인이 노예들에게 내리는 명령이라는 본문의 화행을 보존하며, 서술문의 합쇼체와 충돌하지 않습니다.
  terminology: δοῦλος는 이 비유의 소유 관계를 반영하여 ‘노예’로 옮겼습니다. μνᾶ는 현대 화폐로 등치하지 않고 음역 ‘므나’를 유지하며 문화 주석을 답니다. πραγματεύσασθε는 상업 활동을 뜻하는 ‘장사하라’로 적절하며, ‘거래하라/사업을 하라’는 주석에서 제시할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘주며 말했습니다’의 연결 표현
    rationale: 원문은 ‘불러’(분사) 후 ‘주었다’와 ‘말했다’(두 직설법 동사)를 순차적으로 서술합니다. ‘주고 말했습니다’가 이 관계를 더 정확히 나타냅니다.
  - severity: low
    issue: ἑαυτοῦ의 강조 미반영 가능성
    rationale: ‘자기 종’도 가능하지만, ‘자신의 노예’가 재귀 소유의 강조와 κοινων적 소유 관계를 더 분명히 전달합니다.
  - severity: low
    issue: 핵심 어휘 및 문화 정보에 대한 주석 부재
    rationale: ‘노예’, ‘므나’, ‘장사하라’에는 독자의 이해를 돕는 대안·문화 주석을 붙이는 것이 영어 감사 기록의 어휘 결정을 투명하게 반영합니다.
