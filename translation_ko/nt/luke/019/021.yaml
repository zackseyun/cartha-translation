  text: 제가 당신을 두려워했기 때문입니다. 당신은 엄한[a] 분이셔서, 당신이 놓지 않은 것을 가져가시고 당신이 뿌리지 않은 것을 거두십니다[b].」
  philosophy: optimal-equivalence
  footnotes:
