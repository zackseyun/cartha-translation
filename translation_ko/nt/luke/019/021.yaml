  - marker: a
    text: Or 'strict' or 'harsh' for 'severe.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'you take what you did not put down.' Some translations render the phrase more interpretively as 'you take up what you did not lay down' or 'you collect what you did not deposit.'
