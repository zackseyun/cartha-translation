translation:
  language: ko
  text: 그들이 이것들을 듣고 있을 때에, 그분께서는 한 비유를 덧붙여 말씀하셨습니다. 그분께서 예루살렘에 가까이 와 계셨고, 사람들이 하나님의 나라가 곧 나타나리라 생각하고 있었기 때문입니다.
  philosophy: optimal-equivalence
