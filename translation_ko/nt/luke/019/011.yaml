  source_fidelity: ‘예루살렘에 가까이 와 계셨고’는 예수께서 예루살렘으로 ‘와 계셨다’는 이동·도착의 뉘앙스를 더합니다. 원문은 단지 그가 예루살렘 가까이에 있었다는 상태를 말합니다. 또한 παραχρῆμα의 즉각성을 ‘곧바로’로 더 분명히 드러내는 것이 좋습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 두 개의 διὰ τὸ 원인절도 분명히 연결합니다.
  terminology: ‘비유’, ‘하나님의 나라’는 복음서 문맥의 정착된 용어이며 적절합니다. ἀναφαίνεσθαι는 교리적으로 구체화하지 않고 ‘나타나다’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘예루살렘에 가까이 와 계셨고’
    rationale: ἐγγὺς εἶναι Ἰερουσαλήμ αὐτόν은 그가 예루살렘 가까이에 ‘있었다’는 뜻입니다. ‘와 계시다’는 원문에 없는 이동·도착의 의미를 보탭니다.
  - severity: low
    issue: ‘곧 나타나리라’
    rationale: 의미상 크게 어긋나지는 않지만, παραχρῆμα가 강조하는 즉각성을 ‘곧바로’로 명시하는 편이 더 충실합니다.
  revised_text: 그들이 이것들을 듣고 있을 때에, 그분께서는 비유를 덧붙여 말씀하셨습니다. 그분께서 예루살렘 가까이에 계셨고, 사람들이 하나님의 나라가 곧바로 나타날 것이라고 생각하고 있었기 때문입니다.
  revised_footnotes: []
  revision_rationale: 예루살렘에 대한 위치 표현에서 원문에 없는 이동의 뉘앙스를 제거하고, 하나님 나라가 즉시 나타날 것이라는 사람들의 기대를 보존했습니다. ‘나타나다’는 그 나타남의 방식이 정치적·종말론적·영적이라고 특정하지 않습니다.
