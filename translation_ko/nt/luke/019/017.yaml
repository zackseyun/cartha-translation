  terminology: '''선한 종'' appropriately renders ἀγαθὲ δοῦλε in this context. ''권한'' is a natural contemporary rendering of ἐξουσία here; ''다스릴'' makes explicit the administrative relation already expressed by ''over ten cities,'' without introducing a distinct theological interpretation.'
  issues:
