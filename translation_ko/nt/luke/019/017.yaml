  verdict: revise
  source_fidelity: The draft accurately reflects the commendation, faithfulness in something very small, and the grant of authority over ten cities. However, '열 도시에 대한 권세를 가져라' is less idiomatic Korean and weakens the governing force conveyed by ἐπάνω ('over').
