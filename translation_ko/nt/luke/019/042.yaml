  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
  footnotes:
  - marker: a
    text: Or, 'If only you had known on this day, even you, the things that make for peace.'
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'the things toward peace,' meaning what pertains to or leads to peace.
    reason: lexical_alternative
  - marker: c
    text: Some translations render the final clause in the singular, 'now it has been hidden from your eyes,' taking the preceding phrase conceptually.
    reason: alternative_reading
