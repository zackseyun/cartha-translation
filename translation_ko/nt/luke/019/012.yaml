review_pass:
  verdict: revise
  source_fidelity: 초안은 εὐγενής를 ‘귀족’, λαβεῖν ἑαυτῷ βασιλείαν을 ‘자기를 위해 왕권을 받아’로 옮겨 핵심 뜻을 대체로 잘 반영합니다. 그러나 ‘돌아오려고’가 ‘먼 나라로 떠났습니다’에만 직접 걸리는 듯하여, 왕권을 받는 것과 돌아오는 것이 나란히 놓인 두 부정사의 구조가 한국어에서 다소 불분명합니다. 또한 βασιλείαν의 ‘왕국/왕권’ 의미 범위는 각주로 보존하는 것이 좋습니다.
  naturalness: ‘그래서 그분께서 말씀하셨습니다’는 문법적으로 가능하지만, 본문의 화자가 예수님임을 자연스럽게 밝히는 ‘그러므로 예수님께서 말씀하셨습니다’가 현대 격식체 성경 문맥에 더 적합합니다. ‘왕권을 받고 돌아오려고 먼 나라로 갔습니다’는 목적과 행동의 연결을 매끄럽고 정확하게 드러냅니다.
  terminology: ‘왕권’은 이 정치적 문맥에서 βασιλεία의 유효한 번역입니다. 다만 이 단어는 ‘왕국’ 또는 ‘통치권/왕의 권세’를 뜻할 수도 있으므로 각주에서 대안을 제시합니다. ‘귀족’은 εὐγενής의 높은 신분 또는 귀한 출생이라는 뜻을 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: 두 부정사의 병렬 관계가 한국어에서 충분히 드러나지 않음
    rationale: λαβεῖν과 ὑποστρέψαι는 모두 ἐπορεύθη에 연결되어 ‘왕권을 받고 돌아오기 위해’라는 목적을 이룹니다. 초안의 어순은 ‘돌아오려고’만 ‘먼 나라로 떠났다’에 걸리는 듯 읽힐 수 있습니다.
  - severity: low
    issue: βασιλείαν의 의미 범위에 대한 각주 누락
    rationale: 본문의 ‘왕권’은 적절하지만, 원어는 왕국 자체와 왕의 통치권/왕권을 모두 가리킬 수 있으므로 영어 POB 감사 기록과 같이 대안 의미를 각주로 보존하는 것이 좋습니다.
  - severity: low
    issue: 인용부호가 닫히지 않음
    rationale: 완결된 본문 표기를 위해 닫는 인용부호가 필요합니다.
  revised_text: 그러므로 예수님께서 말씀하셨습니다. 「어떤 귀족이 자기를 위해 왕권을 받고 돌아오려고 먼 나라로 갔습니다.」
  revised_footnotes:
  - marker: a
    text: 또는 “왕국.” 그리스어 ‘바실레이아’는 왕국 자체를 뜻할 수도 있고 왕권 또는 왕의 통치권을 뜻할 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 문장의 목적 구조를 ‘왕권을 받고 돌아오려고’로 정리하여 원문의 병렬 부정사(‘받기 위해’와 ‘돌아오기 위해’)를 자연스러운 한국어로 반영했습니다. ‘왕권’이라는 본문 선택은 유지하되, βασιλεία의 의미 범위는 각주로 보존했습니다. 인용부호를 완결하고 서술 문맥에 맞게 화자를 명시했습니다.
