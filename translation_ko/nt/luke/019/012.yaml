  source_fidelity: 그리스어의 서술 연결(οὖν), 비유적 인물 소개, 먼 지역으로의 이동, 왕권/왕국을 받음, 귀환이라는 핵심 의미는 대체로 반영되었습니다. 다만 원문의 βασιλείαν은 ‘왕국’과 ‘왕권/통치권’ 모두를 뜻할 수 있으므로, ‘왕권’이라는 선택에 그 대안을 각주로 밝혀 의미 범위를 보존하는 것이 적절합니다.
