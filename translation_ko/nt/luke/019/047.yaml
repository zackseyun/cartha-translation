- from: 그리고 그분께서 날마다 성전에서 가르치고 계셨습니다. 그러나 대제사장들과 율법학자들과 백성의 지도자들은 그분을 죽이려고 모색하고 있었습니다.
  to: 그리고 그분께서는 날마다 성전에서 가르치고 계셨습니다. 그러나 대제사장들과 서기관들과 백성의 지도자들은 그분을 죽이려고 꾀하고 있었습니다.
  rationale: The revision replaces the interpretive “율법학자들” with the source-nearer, conventional “서기관들.” The ongoing imperfect sense is retained in “가르치고 계셨습니다” and “꾀하고 있었습니다,” while “죽이려고” appropriately reflects the hostile context of ἀπολέσαι.
