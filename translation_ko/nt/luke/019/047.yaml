review_pass:
  verdict: revise
  source_fidelity: The draft preserves the ongoing teaching, daily setting, temple location, and the ongoing hostile intention. However, γραμματεῖς is more directly and conventionally rendered in this context as “서기관들,” rather than the broader interpretive term “율법학자들.”
  naturalness: The revised wording maintains natural modern formal-polite Korean. “죽이려고 꾀하고 있었습니다” is an idiomatic way to convey the imperfect ἐζήτουν with the hostile infinitive ἀπολέσαι.
  terminology: Use “서기관들” for γραμματεῖς, the established Korean biblical term. “대제사장들” and “백성의 지도자들” appropriately render the priestly leaders and prominent people respectively; the latter does not overstate a disputed institutional role.
  issues:
  - severity: medium
    issue: “율법학자들” for γραμματεῖς
    rationale: Although understandable, it is broader and more interpretive than the Greek term and departs from standard Korean biblical terminology. “서기관들” is both closer to the source and more recognizable in this narrative setting.
  revised_text: 그리고 그분께서는 날마다 성전에서 가르치고 계셨습니다. 그러나 대제사장들과 서기관들과 백성의 지도자들은 그분을 죽이려고 꾀하고 있었습니다.
