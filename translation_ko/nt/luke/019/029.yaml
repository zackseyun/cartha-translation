  terminology: Βηθφαγή와 Βηθανία는 통용 표기인 "벳바게", "베다니"로, Ἐλαιῶν이 가리키는 통상적 지명은 "감람산"으로 옮겼습니다. μαθητῶν의 부분 속격은 "제자들 가운데 두 사람"으로 보존했습니다.
