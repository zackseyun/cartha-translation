  - severity: medium
    issue: 장소 수식의 중복 및 불명확성
    rationale: '"올리브산이라고 불리는 산 가까이 벳바게와 베다니에 가까이"는 "가까이"를 중복하며, 원문의 πρὸς τὸ ὄρος가 나타내는 감람산 쪽 방향과 벳바게·베다니에 이르는 행위를 자연스럽게 드러내지 못합니다.'
