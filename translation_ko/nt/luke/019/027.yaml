  to: 그러나 내가 그들을 왕으로 다스리는 것을 원하지 않았던 이 내 원수들을 여기로 데려와 내 앞에서 죽이십시오.」
  rationale: 원문의 강한 전환(πλήν), 지시사적 강조(τούτους), 왕으로서 통치한다는 의미(βασιλεῦσαι), 직접적인 명령을 보존하면서 현대 표준 한국어 합쇼체로 다듬었습니다. 이 말이 비유 속 귀족의 발화라는 서사적 위치에 관한 해석적 설명은 본문에 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:05Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 전달하지만, βασιλεῦσαι의 왕적 통치 의미가 단순한 ‘다스리다’로 다소 약화되었고, κατασφάξατε의 강한 살해 명령도 명시적으로 유지할 필요가 있습니다. ‘자기들을’은 ‘원수들’과의 지시 관계가 한국어에서 다소 어색하므로 ‘그들을’이 적절합니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 명령을 ‘죽이십시오’로 옮기는 것이 자연스럽습니다. 원문의 관계절을 ‘내가 그들을 왕으로 다스리는 것을 원하지 않았던’으로 두면 수식 관계도 분명합니다.
  terminology: βασιλεύω는 여기서 ‘왕으로 다스리다’로 번역하여 왕권/통치의 의미를 보존했습니다. κατασφάζω는 일반적인 죽임보다 강한 동사이나, 교단적·사법적 뉘앙스를 덧붙이지 않는 ‘죽이십시오’로 옮기되 문맥의 직접성을 유지했습니다.
  issues:
  - severity: medium
    issue: 문체가 합쇼체 명령형이 아님
    rationale: 대상 변형이 현대 formal-polite 합쇼체이므로 종결을 ‘죽이십시오’로 고쳐야 합니다.
  - severity: medium
    issue: ‘다스리는’이 βασιλεύσαι의 왕적 의미를 충분히 드러내지 못함
    rationale: ‘왕으로 다스리는’은 원문의 왕으로서 통치한다는 의미를 보존합니다.
  - severity: low
    issue: ‘자기들을’의 지시가 어색함
    rationale: 명사구 ‘이 내 원수들’을 받는 목적어는 ‘그들을’이 현대 한국어에서 더 명료하고 자연스럽습니다.
  revised_text: 그러나 내가 그들을 왕으로 다스리는 것을 원하지 않았던 이 내 원수들을 여기로 데려와 내 앞에서 죽이십시오.」
