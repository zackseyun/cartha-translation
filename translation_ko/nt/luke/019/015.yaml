review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the return after receiving royal authority, the order to summon the slaves, and the purpose of discovering the outcome of their trading. A revision makes explicit that they were summoned to him (αὐτῷ), retains the demonstrative force of “these,” and avoids making “entrusted” more explicit than the stated “had given.”
  naturalness: The revision uses clear, modern formal Korean. “왕권을 받고 돌아왔을 때” and “자기에게 불러오라고 명령했습니다” are natural while preserving the narrative and purpose relationship.
  terminology: “왕권” appropriately reflects βασιλεία in this political-parabolic setting. “종들” is retained as the established Korean biblical designation for δοῦλοι; the context preserves their subordinate status without importing an interpretive social label. “장사하여 무엇을 벌었는지” reflects commercial activity and its gain.
  issues:
  - severity: medium
    issue: The destination of the summons is not explicit.
    rationale: φωνηθῆναι αὐτῷ means that the slaves were to be summoned to him. “불러오라고” can imply this, but “자기에게 불러오라고” preserves it directly.
  - severity: low
    issue: “맡겨 두었던” adds an entrusting nuance where the Greek explicitly says “had given.”
    rationale: The broader parable supports an entrusted-funds context, but this verse’s δεδώκει is most directly represented by “주었던.”
  - severity: low
    issue: The demonstrative force of τοὺς δούλους τούτους is not represented.
    rationale: Adding “이 종들” reflects “these slaves” without impairing Korean idiom.
  revised_text: 그가 왕권을 받고 돌아왔을 때, 그는 돈을 주었던 이 종들을 자기에게 불러오라고 명령했습니다. 그들이 장사하여 무엇을 벌었는지 알아보려는 것이었습니다.
