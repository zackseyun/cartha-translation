  source_fidelity: ‘백성들’은 πολῖται의 시민적·정치적 의미보다 신하나 피지배 백성의 뜻으로 기울 수 있어, 왕권을 거부하는 이 문맥에서는 ‘시민들’이 더 정확합니다. 또한 βασιλεῦσαι의 왕권 어휘를 ‘왕으로 … 다스리다’로 드러내는 것이 적절합니다.
