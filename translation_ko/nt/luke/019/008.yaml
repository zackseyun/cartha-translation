base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
  footnotes:
  - marker: a
    text: Or 'if I have defrauded anyone of anything.' The Greek verb can refer to extortion, exploitation, or defrauding, sometimes by false accusation.
    reason: lexical_alternative
  - marker: b
    text: The Greek present-tense verbs can also be understood as 'I will give' and 'I will repay,' expressing immediate resolve.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 삭개오가 서서 주님께 말씀드렸습니다. “보십시오, 주님, 저는 제 소유의 절반을 가난한 이들에게 드립니다. 또 제가 누구에게서든 무엇이든 부당하게 빼앗은 일이 있다면[a], 네 배로 갚습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “누구에게서든 무엇이든 속여 빼앗은 일이 있다면.” 그리스어 동사는 갈취하거나 착취하거나 속여 빼앗는 것을 가리킬 수 있으며, 때로는 거짓 고발을 통해 그렇게 하는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 현재 시제 동사들은 “드리겠습니다”와 “갚겠습니다”처럼 즉각적인 결단을 나타내는 말로도 이해할 수 있습니다.
    reason: alternative_reading
