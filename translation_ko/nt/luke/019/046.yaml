source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
  footnotes:
  - marker: a
    text: Or, “my temple shall be a house of prayer.” The Greek says “my house,” echoing Isaiah 56:7.
    reason: lexical_alternative
  - marker: b
    text: “Den of robbers” echoes Jeremiah 7:11; “robbers” may also be rendered “bandits.”
    reason: cross_reference
translation:
  language: ko
  text: 그분께서 그들에게 이렇게 말씀하셨습니다. “ ‘내 집은 기도하는 집이 될 것이다’라고 기록되어 있습니다.[a] 그러나 너희는 그것을 강도의 소굴로 만들었다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 성전은 기도하는 집이 될 것이다.” 그리스어는 “내 집”이라고 하며, 이사야 56:7을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: “강도의 소굴”은 예레미야 7:11을 반영합니다. “강도들”은 “도적들” 또는 “산적들”로도 옮길 수 있습니다.
    reason: cross_reference
