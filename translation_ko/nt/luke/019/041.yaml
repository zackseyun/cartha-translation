  source_fidelity: 초안은 ὡς ἤγγισεν, ἰδὼν τὴν πόλιν, ἔκλαυσεν ἐπ’ αὐτήν의 기본 의미를 대체로 전달합니다. 그러나 ἐπ’ αὐτήν은 여기서 장소적 ‘위에서’가 아니라 그 도시를 향한/두고 하는 울음을 나타내므로, ‘그 도시를 두고’가 문맥과 결합에 더 충실합니다. ‘가까이 이르셔서’는 접근의 대상을 본문에 덧붙이지 않고 보존합니다.
  naturalness: ‘그 도시를 보시고 그 도시를 위해 우셨습니다’는 동일 명사의 반복과 ‘~을 위해 울다’의 결합이 다소 부자연스럽습니다. ‘그 도시를 보시고는 그 도시를 두고 우셨습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 애도의 대상을 분명히 합니다.
  terminology: ‘도시’는 πόλις를 간결하게 옮기며, 문맥상 예루살렘을 본문에서 불필요하게 명시하지 않는 점도 적절합니다. κλαίω는 ‘우셨습니다’로 충분하며 감정의 강도를 추가하지 않습니다. 한국어에는 도시의 문법 성을 드러내는 대명사 선택이 없으므로 영어의 ‘her’ 대안에 해당하는 각주는 필요하지 않습니다.
  issues:
  - severity: medium
    issue: ἐπ’ αὐτήν을 ‘그 도시를 위해’로 번역함
    rationale: 이 표현도 넓게는 가능한 해석이지만, κλαίω와 함께 쓰인 ἐπί는 이 문맥에서 도시를 애도의 대상으로 삼아 ‘그 도시를 두고/향하여 우셨다’라는 뜻을 자연스럽게 나타냅니다. ‘위에서’라는 위치격 설명은 문법적으로 부정확합니다.
  - severity: low
    issue: ‘그 도시’를 연속 반복함
    rationale: 한국어에서는 두 번째 대상을 ‘그 도시를 두고’로 관용적으로 연결하면 반복이 덜 거슬리면서도 원문의 대명사 지시를 명확히 유지합니다.
  revised_text: 그리고 그분께서 가까이 이르셔서 그 도시를 보시고는 그 도시를 두고 우셨습니다.
