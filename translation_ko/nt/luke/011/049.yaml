base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
  footnotes:
  - marker: a
    text: Or 'God’s wisdom.' The phrase may be understood as a personification of divine wisdom, as God’s wise decree, or as an implicit self-reference by Jesus.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 하나님의 지혜도[a] 이렇게 말했습니다. ‘내가 그들에게 예언자들과 사도들을 보낼 것이다. 그들은 그들 가운데 몇 사람을 죽이고 박해할 것이다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 지혜’. 이 표현은 하나님의 지혜를 의인화한 것으로, 하나님의 지혜로운 작정으로, 또는 예수님의 암시적인 자기 지시로 이해될 수 있습니다.
    reason: ‘하나님의 지혜’가 가리키는 바에 관한 해석적 가능성을 보존하며 어느 한 해석을 본문에 강요하지 않기 위함입니다.
