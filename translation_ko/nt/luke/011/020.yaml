  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
  footnotes:
  - marker: a
    text: Or 'with the finger of God.' The phrase is an idiom for God's direct power and echoes Exodus 8:19.
    reason: lexical_alternative
  - marker: b
    text: Or 'has overtaken you' or 'has reached you.'
    reason: alternative_reading
translation:
  language: ko
  text: 「그러나 만일 내가 하나님의 손가락으로[a] 귀신들을 쫓아낸다면, 하나님의 나라가 너희에게 이른 것입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 손가락을 힘입어’. 이 표현은 하나님의 직접적인 능력을 가리키는 성경적 은유이며, 출애굽기 8:19를 반향합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희에게 임한 것입니다’, ‘너희에게 도달한 것입니다’.
    reason: alternative_reading
