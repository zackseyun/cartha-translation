  source_fidelity: The draft correctly retains the basic lamp image, lampstand, and purpose clause, but it narrows κρύπτη to "움" (a cellar/pit) without preserving its broader sense, and "말 아래" is liable to be read as archaic or ambiguous in modern Korean. The final clause also does not faithfully and naturally express the purposive ἵνα clause.
  naturalness: '"등불을 켜서 움 속에나 말 아래 두는 자가 없고" and especially "보게 함이다" are not natural modern formal-polite Korean. A finite, formal-polite construction gives the saying a clear and idiomatic form.'
  terminology: '"등불," "등잔대," and "빛" are suitable. "숨겨진 곳" preserves the non-specific sense of κρύπτη; a note can retain "움/지하 저장 공간" as a lexical possibility. "곡식을 재는 그릇" clearly conveys μόδιος in contemporary Korean, with its traditional measure/container sense documented in a note.'
  issues:
  - severity: medium
    issue: κρύπτη is rendered only as "움."
    rationale: κρύπτη may denote a cellar or underground storage area, but it can also refer generally to a hidden place. The main text should not select the architectural sense alone without a note.
  - severity: medium
    issue: '"말 아래" is archaic and ambiguous for a modern Korean audience.'
    rationale: Although 말 can denote a traditional measuring container, the unmarked phrase can be misunderstood and does not clearly communicate the object intended by μόδιος.
  - severity: high
    issue: '"들어오는 자들이 그 빛을 보게 함이다" is unidiomatic and inadequately expresses the purpose clause.'
    rationale: The Greek ἵνα with βλέπωσιν expresses purpose. "볼 수 있도록" is natural modern formal-polite Korean and retains that force.
