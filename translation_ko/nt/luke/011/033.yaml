source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
  footnotes:
  - marker: a
    text: Or 'in a cellar' or 'in a secret place'; the Greek κρύπτη can refer to a hidden place, including an underground storage area.
    reason: lexical_alternative
  - marker: b
    text: Greek μόδιος, a measuring container; traditionally 'bushel' or 'bushel basket.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 등불을 켜서 숨겨진 곳[a]이나 곡식을 재는 그릇[b] 아래에 두지 않고, 등잔대 위에 둡니다. 이는 들어오는 사람들이 그 빛을 볼 수 있도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 κρύπτη는 ‘숨겨진 곳’을 뜻하며, 지하 저장 공간이나 움을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 μόδιος는 곡식 등을 재는 용기입니다. 전통적으로 ‘말’ 또는 ‘부셸 바구니’로 옮깁니다.
    reason: lexical_alternative
