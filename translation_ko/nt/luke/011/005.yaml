review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses the syntax of τίς ἐξ ὑμῶν: it makes “a certain friend” the subject, whereas Jesus asks which one among the hearers has a friend and goes to that friend. Its “말한다고 하자” also changes the rhetorical question into a hypothetical invitation.'
  naturalness: The revised Korean uses a natural rhetorical-question construction and clear quotation nesting. The embedded request uses an appropriate familiar form of address, while the surrounding narration remains modern formal-polite.
  terminology: 친구, 한밤중, 빵 세 덩이, and 빌려 주게 accurately render φίλος/Φίλε, μεσονυκτίου, τρεῖς ἄρτους, and χρῆσόν μοι. No theological terminology is at issue.
  issues:
  - severity: high
    issue: The subject of the rhetorical question is mistranslated.
    rationale: Τίς ἐξ ὑμῶν means “who among you,” not “which friend among you.” The person going at midnight is one of the hearers, who has a friend.
  - severity: high
    issue: The rhetorical question is replaced with a hypothetical expression.
    rationale: The Greek asks a future-form rhetorical question; “말한다고 하자” (“suppose [he] says”) does not represent this construction.
  revised_text: 그리고 그들에게 말씀하셨습니다. “너희 가운데 누가 친구가 있어서 한밤중에 그에게 가서 ‘친구여, 내게 빵 세 덩이를 빌려 주게’ 하고 말하겠습니까?”
