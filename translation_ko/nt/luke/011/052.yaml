translation:
  language: ko
  text: 「율법 교사들이여, 여러분에게 화가 있습니다! 여러분은 지식의 열쇠를 치워 버렸습니다. 여러분 자신도 들어가지 않았고, 들어가는 사람들도 막았습니다.」
  philosophy: optimal-equivalence
