  source_fidelity: 초안은 핵심 의미를 대체로 전달하지만, 현재분사 τοὺς εἰσερχομένους를 ‘들어가려는 자들’로 옮겨 원문에 없는 시도·의도의 뉘앙스를 더합니다. 또한 αὐτοὶ의 강조는 현대 한국어에서 ‘정작 여러분은’으로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘있을진저’, ‘가져가 버렸도다’, ‘아니하고’는 요청된 현대 표준어 합쇼체와 맞지 않는 고어적 문체입니다. 현대적이면서도 엄중한 문체로 다듬는 것이 안전합니다.
  terminology: νομικοῖς는 현대 민사 변호사로 오해될 수 있으므로 본문에서는 ‘율법 전문가들’로 옮기고 각주에서 유대 율법 전문자라는 뜻을 밝혔습니다. ‘지식의 열쇠’와 ‘들어가다’의 은유는 해석적으로 특정하지 않고 유지했습니다.
  issues:
