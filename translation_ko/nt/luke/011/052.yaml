    issue: 문체가 현대 합쇼체가 아니라 고어적 성서체입니다.
    rationale: ‘있을진저/도다/아니하고’는 표준 현대 공식-공손체라는 대상 변종 요구에 부합하지 않습니다.
  - severity: medium
    issue: ‘들어가려는 자들’이 현재분사에 없는 의도성을 더합니다.
    rationale: τοὺς εἰσερχομένους는 ‘들어가는 사람들/들어오고 있는 사람들’로, ‘하려는’보다 원문의 진행 중인 동작을 더 직접적으로 반영합니다.
  - severity: low
    issue: ‘율법사’는 현대 독자에게 의미가 불투명할 수 있습니다.
    rationale: νομικοί는 현대 법률 변호사가 아니라 유대 율법의 전문자들을 가리키므로, 본문과 각주에서 이를 명료하게 하는 편이 자연스럽습니다.
  revised_text: 「율법 전문가들에게 화가 있습니다! 여러분이 지식의 열쇠를 빼앗아 버렸기 때문입니다. 정작 여러분은 들어가지 않았고, 들어가는 이들도 막았습니다.」
  revised_footnotes:
  - marker: a
