  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
  footnotes:
  - marker: a
    text: Or 'because of his boldness,' 'because of his impudence,' or more literally 'because of his shamelessness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「내가 너희에게 말합니다. 그가 자기 친구라는 이유로는 일어나서 그에게 무엇인가를 주지 않을지라도, 그 친구의 염치없는 끈질김[a] 때문에 일어나서 그가 필요한 것은 무엇이든 줄 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뻔뻔함 때문에’, ‘염치없음 때문에’.
    reason: ‘염치없는 끈질김’으로 옮긴 그리스어 ἀναίδεια의 직역적·어휘적 대안을 제시합니다.
