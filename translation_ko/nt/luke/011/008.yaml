  verdict: revise
  source_fidelity: The draft correctly conveys the concessive structure, the contrast between friendship and ἀναίδεια, and the comprehensive sense of ὅσων χρῄζει. However, its pronouns leave the referent of the shameless persistence less clear than the Greek narrative context, and its archaic speech style is not consistently modern formal-polite.
  naturalness: ‘내가 너희에게 이르노니’ is elevated/archaic rather than modern 합쇼체. ‘그의 부끄러움을 모르는 끈질김’ is understandable but awkward and referentially ambiguous in Korean. ‘염치없는 끈질김’ is natural while retaining the lexical edge.
  terminology: Render ἀναίδεια as ‘염치없는 끈질김,’ with a note preserving ‘뻔뻔함/염치없음’ as alternatives. This avoids making the term merely neutral persistence or imposing a theological interpretation.
  issues:
  - severity: medium
    issue: Register is archaic.
    rationale: ‘이르노니’ does not meet the requested modern formal-polite 합쇼체 register; ‘말합니다’ does.
  - severity: medium
    issue: The referent of ‘그의 ... 끈질김’ is unclear.
    rationale: In context ἀναίδεια refers to the requesting friend. ‘그 친구의’ identifies the petitioner without altering the source meaning.
  - severity: low
    issue: No lexical note is supplied for ἀναίδεια.
    rationale: The source term has a socially negative lexical force (‘shamelessness/impudence’) alongside its contextual sense of persistence, so a note is helpful.
  revised_text: 「내가 너희에게 말합니다. 그가 자기 친구라는 이유로는 일어나서 그에게 무엇인가를 주지 않을지라도, 그 친구의 염치없는 끈질김[a] 때문에 일어나서 그가 필요한 것은 무엇이든 줄 것입니다.」
  revised_footnotes:
