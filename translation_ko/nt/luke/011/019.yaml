review_pass:
  verdict: revise
  source_fidelity: ‘바알세불을 힘입어’는 ἐν Βεελζεβούλ의 수단·매개 의미를 자연스럽게 옮기며, ‘귀신들을 쫓아내다’와 ‘너희 아들들’도 원문의 어휘와 논증을 충실히 반영합니다. 다만 ἐν τίνι의 성별상 열려 있는 수단/매개 질문을 ‘누구를 힘입어’로 한정하면 원문의 가능한 비인칭적 의미가 좁아집니다. 또한 αὐτοί의 강조를 본문에서 반영하는 편이 좋습니다.
  naturalness: ‘누구를 힘입어’는 한국어에서 다소 어색하고, 이 문맥의 수단을 묻는 질문으로는 ‘무엇을 힘입어’가 더 자연스럽습니다. ‘바로 그들이’는 문맥상 자연스러우면서 그리스어 강조 대명사를 드러냅니다.
  terminology: ‘바알세불’은 한국어 성경 전통에서 널리 쓰이는 음역이며, ‘귀신’, ‘재판관’도 현대의 격식 있는 성경 문체에 적절합니다. ‘아들들’은 해석적으로 ‘제자들’ 등으로 바꾸지 않고 원문의 표현을 보존합니다.
  issues:
  - severity: medium
    issue: ‘누구를 힘입어’가 ἐν τίνι의 의미 범위를 인칭으로 한정함
    rationale: τίς의 여격은 문맥상 ‘누구로’와 ‘무엇으로/무슨 힘으로’ 모두 가능한 질문입니다. 원문의 열린 수단 표현을 보존하려면 ‘무엇을 힘입어’가 더 안전합니다.
  - severity: low
    issue: αὐτοί의 강조가 번역에 드러나지 않음
    rationale: ‘그들이’도 기본 뜻은 전달하지만, ‘바로 그들이’로 옮기면 강조 대명사의 담화 기능을 자연스럽게 반영할 수 있습니다.
  revised_text: 「만일 내가 바알세불을 힘입어 귀신들을 쫓아낸다면, 너희 아들들은 무엇을 힘입어 쫓아내느냐? 그러므로 바로 그들이 너희의 재판관이 될 것이다.」
  revised_footnotes: []
  revision_rationale: 수단을 묻는 ἐν τίνι를 인칭으로 제한하지 않도록 ‘무엇을 힘입어’로 고쳤고, αὐτοί의 강조를 ‘바로 그들이’로 반영했습니다. 나머지는 원문에 충실하고 현대 표준 한국어 합쇼체에 자연스러워 유지했습니다.
