  source_fidelity: 초안은 논증 구조, '너희 아들들', 귀신을 쫓아냄, 그리고 그들이 재판관이 된다는 결론을 대체로 충실히 옮깁니다. 그러나 ἐν τίνι의 수단·행위자 물음은 한국어 본문에서 더 자연스럽고 정확하게 표현할 필요가 있습니다.
  naturalness: ‘누구를 힘입어 쫓아내느냐’는 현대 한국어에서 목적격처럼 들리고 다소 부자연스럽습니다. ‘누구의 힘으로 … 쫓아내느냐’가 자연스러운 합쇼체이며 문맥의 인격적 비교를 유지합니다.
  terminology: ‘바알세불’, ‘귀신들’, ‘재판관’은 적절합니다. αὐτοί의 강조는 ‘바로’로 반영하되, ἐν τίνι의 비인격적 수단 가능성은 각주에 보존합니다.
  issues:
  - severity: medium
    issue: ‘누구를 힘입어’의 격과 관용 표현
    rationale: ἐν τίνι는 수단 또는 행위자를 묻는 표현입니다. 한국어 ‘누구를 힘입어’는 이 문맥에서 부자연스럽고, ‘누구의 힘으로’가 문법적·관용적으로 더 적절합니다.
  - severity: low
    issue: ἐν τίνι의 대안적 의미가 본문과 주석에 보존되지 않음
    rationale: 문맥상 인격적 행위자가 유력하지만, ‘무엇으로/무슨 능력으로’라는 수단의 의미도 가능합니다. 이를 각주에 남겨 해석상의 여지를 보존하는 것이 좋습니다.
  revised_text: 「그러나 내가 바알세불의 힘으로 귀신들을 쫓아낸다면, 너희 아들들은 누구의 힘으로 쫓아내느냐? 그러므로 그들이 바로 너희의 재판관이 될 것이다.」
  revised_footnotes:
  - marker: a
    text: 또는 ‘무엇을 힘입어’ 또는 ‘무슨 능력으로’.
    reason: ἐν τίνι는 여기서 행위자뿐 아니라 수단이나 능력을 물을 수도 있다.
  revision_rationale: ‘누구의 힘으로’는 바알세불과의 대조 속에서 ἐν τίνι의 행위자적 뉘앙스를 자연스러운 한국어로 옮깁니다. 대안적 수단 해석은 각주로 보존했습니다. ‘바로’는 αὐτοί의 강조를 반영하며, ‘너희 아들들’은 해석적으로 ‘추종자’ 등으로 바꾸지 않고 원문의 표현을 유지했습니다.
