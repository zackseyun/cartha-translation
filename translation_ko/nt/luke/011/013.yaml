id: LUK.11.13
reference: Luke 11:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
  footnotes:
  - marker: a
    text: Some English versions read 'your heavenly Father' by analogy with Matthew 7:11, but Luke's Greek says 'the Father from heaven.'
    reason: alternative_reading
  - marker: b
    text: Matthew 7:11 has 'good things' where Luke here has 'the Holy Spirit,' preserving each Gospel's distinct wording.
    reason: cross_reference
translation:
  language: ko
  text: 「너희가 악하면서도 자녀들에게 좋은 선물을 줄 줄 안다면, 하물며 하늘에 계신 아버지께서[a] 자신에게 구하는 이들에게 성령을 주시지 않으시겠습니까?[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘로부터 [오시는] 아버지’입니다. 누가의 그리스어에는 마태복음 7:11에 있는 ‘너희의’가 없으며, 표현도 ‘하늘에 계신’과는 다릅니다.
    reason: alternative_reading
  - marker: b
    text: 마태복음 7:11은 여기의 ‘성령’ 대신 ‘좋은 것들’을 말합니다. 각 복음서의 서로 다른 표현을 보존합니다.
    reason: cross_reference
