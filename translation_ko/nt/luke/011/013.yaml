    rationale: 원문은 ‘그분에게 구하는 이들에게’라고 명시합니다. 한국어에서는 ‘아버지께 구하는 이들에게’로 자연스럽게 보완할 수 있습니다.
  - severity: low
    issue: ‘하늘의 아버지’가 누가의 ἐξ οὐρανοῦ 표현을 충분히 반영하지 못함
    rationale: 한국어 본문에서는 자연스러운 ‘하늘에 계신 아버지’를 사용하되, 이것이 마태복음 7:11의 ‘너희 하늘 아버지’와 동일한 표현이 아니라는 점을 각주로 밝혀야 합니다.
  - severity: low
    issue: 영어 POB 감사 기록의 두 각주에 대응하는 한국어 각주 앵커가 없음
    rationale: 누가와 마태의 상이한 표현 및 ‘하늘로부터’의 표현을 보존·설명하기 위해 본문 앵커와 각주를 추가합니다.
