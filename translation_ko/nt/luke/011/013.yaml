  to: 「너희가 악하면서도 자녀들에게 좋은 선물을 줄 줄 안다면, 하물며 하늘에 계신 아버지께서[a] 자신에게 구하는 이들에게 성령을 주시지 않으시겠습니까?[b]」
  rationale: 원문의 조건절(εἰ οὖν), 인간의 악함을 전제하는 분사구(πονηροὶ ὑπάρχοντες), 하물며 논증(πόσῳ μᾶλλον), ‘그분에게 구하는 이들’(τοῖς αἰτοῦσιν αὐτόν)을 자연스러운 합쇼체로 반영했습니다. ‘성령’은 유지하고, 누가와 마태의 문구를 조화시키지 않도록 필요한 차이는 각주로 표시했습니다.
