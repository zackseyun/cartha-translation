  source_fidelity: 초안은 οἰκοδομεῖτε의 목적어를 문맥상 보충하고 있으나, 본문에 없는 ‘선지자들’을 ‘그들은 죽였고’에 명시하여 대명사의 원문 표현을 확장합니다. 또한 ‘무덤을 세우기 때문이다’는 앞 절과의 문장 연결이 부자연스럽습니다. 원문의 대조와 문맥상 생략된 목적어를 유지하도록 고쳤습니다.
  naturalness: ‘증인이 되며 … 자들이다’는 현대 한국어로 어색하고 서술 구조가 중복됩니다. ‘증인이며, … 동의합니다’와 종결형 ‘때문입니다’를 사용하여 합쇼체의 자연스러운 문장으로 정리했습니다.
  terminology: μάρτυρες는 ‘증인’, συνευδοκεῖτε는 ‘동의합니다’, ἔργα는 도덕적 함의를 보존하는 ‘행위’로 옮겼습니다. ‘조상들’은 여기서 πατέρες의 세대적·수사적 의미를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘선지자들’의 명시
    rationale: αὐτούς는 직전 문맥의 예언자들을 가리키지만, 이 절 자체에서는 대명사입니다. 본문은 대명사를 유지하고 각주에서 문맥상 지시 대상을 밝혀야 합니다.
  - severity: medium
    issue: ‘무덤을 세우기 때문이다’의 부자연스러운 연결
    rationale: ὅτι가 이끄는 설명을 한국어에서 ‘… 때문입니다’로 종결해야 문법과 논리 관계가 자연스럽습니다.
  - severity: low
    issue: ‘증인이 되며 … 자들이다’의 어색한 표현
    rationale: 원문의 술어명사 구조는 ‘증인이며’가 현대 합쇼체에서 더 자연스럽습니다.
  revised_text: 「그러므로 너희는 너희 조상들의 행위에 대한 증인이며, 그 행위에 동의합니다. 그들이 그들을 죽였고, 너희는 세우기 때문입니다.」
  revised_footnotes:
  - marker: a
    text: ‘그들’은 앞 절에서 언급된 예언자들을 가리키며, ‘세우다’의 목적어는 그 예언자들의 무덤으로 문맥상 이해됩니다.
    reason: cross_reference
