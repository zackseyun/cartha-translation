review_pass:
  verdict: revise
  source_fidelity: 초안은 ὑμεῖς δὲ οἰκοδομεῖτε의 목적어를 문맥상 ‘그 무덤’으로 보충한 점은 가능하지만, ‘때문이다’가 앞 절 전체의 이유를 어색하게 연결하고, ‘동의하는 자들이다’는 συνευδοκεῖτε의 유한동사를 부자연스럽게 명사화합니다. 또한 ‘그들은’과 ‘선지자들을’의 대조를 유지하되, 무덤의 소유자가 예언자들임을 분명히 하는 편이 안전합니다.
  naturalness: ‘너희 조상들이 한 일에 대한 증인이며, 그 일을 좋게 여깁니다’는 현대 표준어 합쇼체로 자연스럽고, μάρτυρές ἐστε와 συνευδοκεῖτε의 병렬을 살립니다. ‘무덤을 세웁니다’도 문맥상 이해되지만, 본문에서 보충된 목적어는 각주로 밝혀야 합니다.
  terminology: ‘예언자’는 현대 한국어 성경 번역에서 널리 쓰이는 중립적 표준 용어입니다. ‘조상들’은 τῶν πατέρων ὑμῶν의 문맥적 세대 연결을 자연스럽게 전달합니다. ‘좋게 여기다’는 συνευδοκεῖτε의 적극적 동조·승인 의미를 전달하되 과도한 해석을 피합니다.
  issues:
  - severity: high
    issue: 인과 연결의 오역 및 문장 구조
    rationale: 초안의 ‘너희는 … 자들이다. 그들은 … 죽였고, 너희는 … 세우기 때문이다’는 ὅτι가 이끄는 설명을 한국어에서 비문에 가깝게 처리합니다. 원문은 조상들의 살해와 현 세대의 건축을 대조적으로 제시합니다.
  - severity: medium
    issue: συνευδοκεῖτε의 부자연스러운 명사화
    rationale: ‘동의하는 자들이다’보다 ‘좋게 여깁니다’가 원문의 현재 능동 동사와 현대 합쇼체 문체를 더 정확히 반영합니다.
  - severity: medium
    issue: 보충된 목적어의 근거 미표시
    rationale: οἰκοδομεῖτε는 이 절에서 목적어 없이 쓰였고, ‘예언자들의 무덤’은 바로 앞 절에서 보충됩니다. 본문 보충을 유지한다면 각주로 명시해야 합니다.
  revised_text: 「그러므로 너희는 너희 조상들이 한 일에 대한 증인이며, 그 일을 좋게 여깁니다. 그들은 그들을 죽였고, 너희는 그 예언자들의 무덤을 세웁니다.」
  revised_footnotes:
  - marker: a
    text: ‘그 예언자들의 무덤’은 바로 앞 절에 언급된 예언자들의 무덤을 문맥에 따라 보충한 것입니다. 그리스어 본문은 여기서 ‘너희는 세운다’라고만 합니다.
    reason: 원문에서 생략된 οἰκοδομεῖτε의 목적어를 문맥상 보충했음을 밝혀 본문과 원문의 차이를 투명하게 합니다.
  revision_rationale: 수정문은 ἄρα의 결론적 기능을 ‘그러므로’로, μάρτυρές ἐστε와 συνευδοκεῖτε의 병렬을 ‘증인이며 … 좋게 여깁니다’로, 그리고 αὐτοὶ μὲν … ὑμεῖς δὲ의 대조를 ‘그들은 …, 너희는 …’으로 옮깁니다. ‘예언자들의 무덤’은 앞 절에서만 명시된 목적어이므로 각주에서 그 보충 사실을 밝힙니다.
