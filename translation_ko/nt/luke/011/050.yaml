review_pass:
  verdict: revise
  source_fidelity: 원문의 ἵνα 목적절, ‘모든 선지자의 피’, ‘세상의 기초가 놓인 때부터’, 그리고 ἐκζητηθῇ의 사법적·책임 추궁의 의미를 보존해야 합니다. 초안의 ‘요구되게’는 한국어에서 피 자체가 요구된다는 뜻으로 읽히기 쉬워, 피 흘림에 대한 책임을 묻는 의미가 충분히 드러나지 않습니다.
  naturalness: ‘창세로부터 흘린 모든 선지자의 피’는 ‘흘린’의 주체와 수식 범위가 불분명합니다. ‘세상의 기초가 놓인 때부터 흘려진 모든 선지자의 피에 대한 책임’이 현대 표준어로 더 자연스럽고 의미가 분명합니다.
  terminology: ‘선지자’는 성경적 문맥에서 적절합니다. καταβολῆς κόσμου는 ‘세상의 기초가 놓인 때부터’로 옮겨 관용적 의미를 분명히 했습니다. ἐκζητηθῇ는 ‘책임이 … 물어지다’로 옮겨 혈죄에 대한 심판적 추궁을 표현하되, 교리적 설명을 본문에 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘요구되게’의 의미 불명확성
    rationale: ἐκζητηθῇ는 이 문맥에서 피 흘림에 대해 책임을 추궁하거나 값을 묻는 사법적 의미입니다. 한국어 ‘피가 이 세대에 요구되다’는 직역투이며 무엇이 요구되는지 불명확합니다.
  - severity: low
    issue: ‘창세로부터 흘린’의 수식 및 태 불명확성
    rationale: 원문의 완료 수동 분사 ἐκκεχυμένον은 피가 ‘흘려진’ 것을 뜻합니다. 개정문은 수식 범위와 수동 의미를 명확히 합니다.
  revised_text: 「이는 세상의 기초가 놓인 때부터 흘려진 모든 선지자의 피에 대한 책임이 이 세대에 물어지게 하려 함이니,」
  revised_footnotes:
  - marker: a
    text: 또는 ‘이 세대에게 그 피의 값을 요구하게 하려 함이니.’ 여기서 ‘책임이 물어지다’는 피 흘림에 대해 책임을 추궁한다는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 목적절 구조와 ‘모든 선지자의 피’라는 표현을 유지하면서, 수동 동사 ἐκζητηθῇ가 문맥상 나타내는 책임 추궁의 의미를 자연스러운 현대 합쇼체 한국어로 분명히 했습니다. 각주에는 원문의 ‘요구하다/추궁하다’ 계열의 다른 직역 가능성을 제시했습니다.
