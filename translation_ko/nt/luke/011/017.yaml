- from: 그러나 예수께서 그들의 생각을 아시고 그들에게 이르셨습니다. 「스스로 분열된 나라마다 황폐하여지고, 집은 집 위로 무너진다.」
  to: 그러나 예수께서 그들의 생각을 아시고 그들에게 말씀하셨습니다. “서로 맞서 분열된 나라마다 황폐해지고, 집[1]이 집 위에 무너집니다.”
