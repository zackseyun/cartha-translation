review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ awareness of their thoughts and the general maxim about a kingdom internally divided becoming desolate. The final clause, however, is syntactically awkward in Korean, and its wording should retain the compressed image while marking the lexical ambiguity of οἶκος.
  naturalness: “집은 집 위로 무너진다” is not natural Korean because the topic particle and directional form obscure the subject–predicate relationship. “집이 집 위에 무너진다” is clear and idiomatic while preserving the vivid, compressed construction.
  terminology: “나라” is a natural modern Korean rendering of βασιλεία in this proverbial context. “황폐해진다” appropriately represents ἐρημοῦται. A footnote is warranted for οἶκος, which can refer to a physical house or a household/family unit.
  issues:
  - severity: medium
    issue: The final clause is awkwardly formed and lacks a footnote for οἶκος.
    rationale: The Greek οἶκος ἐπὶ οἶκον πίπτει is compressed and admits both physical-house and household readings. Revising the Korean syntax and adding an anchored alternative preserves both readability and the source ambiguity.
  revised_text: 그러나 예수께서 그들의 생각을 아시고 그들에게 말씀하셨습니다. “서로 맞서 분열된 나라마다 황폐해지고, 집[1]이 집 위에 무너집니다.”
