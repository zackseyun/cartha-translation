source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
  footnotes:
  - marker: a
    text: Or 'household falls against household.' The Greek οἶκος can mean either a physical house or a household/family.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수께서 그들의 생각을 아시고 그들에게 말씀하셨습니다. “서로 맞서 분열된 나라마다 황폐해지고, 집[1]이 집 위에 무너집니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 또는 “가정.” 그리스어 ‘오이코스’는 건물로서의 집을 뜻할 수도 있고, 가정이나 가족을 뜻할 수도 있습니다.
    reason: οἶκος의 어휘적 범위와 이 압축된 표현의 해석 가능성을 보존합니다.
