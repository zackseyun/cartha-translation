  source_fidelity: 그리스어 본문은 ‘그들에게 말씀하셨다’와 기도할 때의 일반적 지시(Ὅταν ... λέγετε)를 담고 있습니다. 호칭은 Πάτερ, 곧 단순히 ‘아버지’이며, 두 청원은 각각 하나님의 이름이 거룩히 여김을 받고 나라가 오기를 구합니다. 초안은 핵심 내용을 대체로 반영하지만, 청원문의 연결과 인용 부호를 다듬는 편이 안전합니다.
  naturalness: 초안의 겹친 「…「…」」 인용 부호는 현대 한국어 문장부호상 부자연스럽습니다. 또한 ‘이름이 거룩히 여겨지게 하시며’는 ‘하시며’의 연결이 매끄럽지 않습니다. ‘이름이 거룩히 여김을 받게 하시고’는 기도문 문맥에서 자연스럽고 현대적인 합쇼체입니다.
  terminology: Πάτερ는 ‘아버지’로 유지하며, 본문에 ‘우리’를 보충하지 않습니다. βασιλεία는 복음서 문맥의 정착된 표현인 ‘나라’, ἐλθέτω는 ‘임하게 하소서’로 옮기는 것이 적절합니다. 기존 각주는 ‘원형’과 전통 번역의 경향을 언급해 본문비평적 판단을 불필요하게 확대하므로, 제공된 그리스어 본문과 마태 평행 본문이라는 확인 가능한 사실만 남깁니다.
