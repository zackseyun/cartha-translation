  to: 예수께서 그들에게 말씀하셨습니다. “너희는 기도할 때 이렇게 말하십시오. ‘아버지[a], 아버지의 이름이 거룩히 여김을 받게 하시고, 아버지의 나라가 임하게 하소서.’”
  rationale: ‘아버지’라는 짧은 호칭을 보존하고, 두 청원을 한국어 합쇼체 기도문으로 자연스럽게 병렬화했습니다. ‘거룩히 여김을 받게 하시고’는 ἁγιασθήτω의 수동적 의미, 곧 하나님의 이름이 거룩하게 대우받기를 구하는 뜻을 유지합니다. 각주는 제공된 본문과 평행 본문에 근거한 최소한의 설명으로 축소했습니다.
  reviewer_model: gpt-5.6-terra
