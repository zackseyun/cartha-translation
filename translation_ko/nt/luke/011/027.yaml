  text: 예수께서 이 말씀을 하고 계실 때에, 무리 가운데 한 여자가 목소리를 높여[a] 그분에게 말하였습니다. “당신을 품었던[b] 태와 당신에게 젖을 먹인 가슴은 복이 있습니다.”
  philosophy: optimal-equivalence
