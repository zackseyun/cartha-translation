  source_fidelity: 초안은 사건의 시간적 배경, 무리 속 여인의 발화, 태와 수유의 이미지를 대체로 충실히 옮겼습니다. 다만 ‘당신이 빨던 젖’은 헬라어의 선행사인 ‘유방/젖가슴’이 아니라 그 안의 ‘젖(우유)’을 가리켜 의미 관계가 바뀝니다. 원문은 ‘당신이 젖을 빤 유방들’이라는 뜻입니다.
