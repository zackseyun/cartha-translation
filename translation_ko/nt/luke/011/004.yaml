  source_fidelity: 첫 청원에서 ἁμαρτίας를 ‘죄’로, 관계절의 ὀφείλοντι를 ‘우리에게 빚진 사람’으로 구별한 점은 적절합니다. 그러나 ‘시험에 들지 않게 하소서’는 εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν의 직접적인 사역 구문(‘우리를 시험으로/시험에 들어가게 하다’)을 다소 완화합니다.
