review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘죄’(ἁμαρτίας)와 둘째 절의 ‘빚진’(ὀφείλοντι)이라는 서로 다른 어휘 영역은 잘 구별되어야 합니다. 마지막 청원은 ‘시험에 들지 않게’보다 하나님이 우리를 그 상황 안으로 ‘들게 하다’라는 εἰσενέγκῃς의 직접적 표현을 유지하는 편이 더 충실합니다.
  naturalness: ‘우리도 … 용서하기 때문입니다’는 이해 가능하나 αὐτοὶ의 강조를 ‘우리 자신도’로 드러내면 더 자연스럽고 충실합니다. ‘우리를 시험에 들게 하지 마십시오’는 현대 표준어 합쇼체이면서도 원문의 긴장을 보존합니다.
  terminology: ‘죄’는 ἁμαρτίας에, ‘빚진 모든 이’는 ὀφείλοντι에 적절합니다. πειρασμός는 본문에서 ‘시험’으로 옮기고, ‘유혹’ 및 ‘시련’의 가능한 뜻은 각주로 남깁니다.
  issues:
  - severity: medium
    issue: 마지막 청원의 동사 관계가 약화됨
    rationale: ‘우리를 시험에 들지 않게 하소서’는 시험에 빠지지 않도록 해 달라는 결과 중심의 표현으로 들릴 수 있습니다. εἰσενέγκῃς ἡμᾶς εἰς는 ‘우리를 시험 안으로 들게 하다/데려가다’이므로, 이를 직접 반영하는 표현이 적절합니다.
  - severity: low
    issue: αὐτοὶ의 강조가 충분히 드러나지 않음
    rationale: ‘우리도’도 가능하지만, 원문의 강조 대명사는 ‘우리 자신도’로 옮길 때 더 분명합니다.
  revised_text: 「우리의 죄를 용서하여 주십시오. 우리 자신도 우리에게 빚진 모든 이를 용서하기 때문입니다. 그리고 우리를 시험[1]에 들게 하지 마십시오.」
  revised_footnotes:
  - marker: '1'
    text: ‘시험’은 ‘유혹’ 또는 ‘시련’으로도 옮길 수 있습니다.
    reason: πειρασμός의 의미 범위를 보존합니다.
  revision_rationale: 수정문은 첫 절의 ‘죄’와 둘째 절의 ‘빚’ 은유를 구별하고, αὐτοὶ의 강조를 ‘우리 자신도’로 반영합니다. 마지막 청원은 원문이 제기하는 신학적 긴장을 해소하지 않고 εἰσφέρω의 직접적 구문을 유지했으며, πειρασμός의 폭넓은 의미는 각주로 제시했습니다.
