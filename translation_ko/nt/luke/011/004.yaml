  terminology: ‘죄’와 ‘용서’는 원문 및 기도 문맥에 정확합니다. πειρασμός는 본문에서 ‘시험’으로 옮기되, ‘유혹’ 및 ‘시련’의 가능성은 각주로 밝혀 의미 범위를 보존하는 것이 좋습니다.
