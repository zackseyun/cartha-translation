translation:
  language: ko
  text: 「우리의 죄를 용서하여 주십시오. 우리 자신도 우리에게 빚진 모든 이를 용서하기 때문입니다. 그리고 우리를 시험[1]에 들게 하지 마십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: ‘시험’은 ‘유혹’ 또는 ‘시련’으로도 옮길 수 있습니다.
    reason: πειρασμός의 의미 범위를 보존합니다.
