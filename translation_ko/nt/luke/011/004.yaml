  revision_rationale: 원문의 죄(ἁμαρτίας)와 빚짐(ὀφείλοντι)의 어휘적 대비를 유지했습니다. αὐτοὶ의 강조는 ‘우리 자신도’로 반영했습니다. 마지막 청원은 εἰσενέγκῃς의 직접적 사역 의미를 살려 ‘시험에 들게 하지 마십시오’로 고쳤으며, πειρασμός의 해석상 폭은 각주에서 보존했습니다.
