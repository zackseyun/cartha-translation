    rationale: 그리스어의 πορεύεται와 παραλαμβάνει의 주어는 앞 문맥의 영입니다. 한국어에서는 ‘그때에 가서’만으로 시작하면 누가 가는지 불분명합니다.
  - severity: medium
    issue: ‘다른’(ἕτερα)의 의미가 누락되었습니다.
    rationale: ‘자기보다 더 악한 영 일곱’은 일곱 영이 원래 영과 구별되는 ‘다른’ 영들이라는 정보를 충분히 드러내지 않습니다.
  - severity: low
    issue: 들어가 사는 주체의 복수성이 드러나지 않습니다.
    rationale: εἰσελθόντα는 복수이며, 영어 감사 기록과 문맥도 원래 영 및 일곱 영이 함께 들어가 거주하는 뜻으로 처리합니다.
