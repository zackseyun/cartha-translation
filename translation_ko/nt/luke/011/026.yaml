  to: 「그때 그 영은 가서 자기보다 더 악한 다른 영 일곱을 데리고 옵니다. 그들이 들어가 거기에 살고, 그 사람의 나중 형편은 처음보다 더 나빠집니다.」
  rationale: 주어 ‘그 영’을 보충하여 문맥상의 귀환하는 영을 분명히 하고, ἕτερα를 ‘다른’으로 반영했습니다. 복수 분사에 맞춰 ‘그들이 들어가’로 옮겼으며, κατοικεῖ의 단수형이 야기하는 문법적 난점은 한국어에서 문맥상 자연스러운 집단적 거주 표현으로 처리했습니다. 본문에 없는 ‘귀신’이나 ‘더러운 영’은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
