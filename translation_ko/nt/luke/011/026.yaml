  source_fidelity: 수정이 필요합니다. 초안은 귀환하는 영의 주어가 명시되지 않아 첫 구절이 불완전하게 들리며, ἕτερα(‘다른’)의 의미도 빠져 있습니다. 또한 복수 분사 εἰσελθόντα에 맞추어 들어가는 주체를 복수로 나타내는 편이 적절합니다. 단수 κατοικεῖ는 문법적으로 난점이 있으나, 문맥상 영들의 집단적 거주를 한국어 복수 표현으로 옮기는 것은 안전합니다.
  naturalness: 현대 표준어 합쇼체로 ‘그때 그 영은 … 데리고 옵니다. 그들이 들어가 … 삽니다’라고 하면 주어와 행위의 전환이 명료하고 자연스럽습니다.
  terminology: πνεύματα는 본문에서 ‘영’으로 유지합니다. ‘악한’은 πονηρότερα를 충실히 반영하며, ‘그 사람’은 ἀνθρώπου ἐκείνου의 특정 개인 지시를 보존합니다.
  issues:
