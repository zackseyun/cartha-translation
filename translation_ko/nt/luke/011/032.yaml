  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
  footnotes:
  - marker: a
    text: Or, 'one greater than Jonah is here' or 'more than Jonah is here.' The Greek uses a neuter form ('greater/more'), which may point broadly to the greater reality present in Jesus and his ministry, not only to a personal comparison.
    reason: alternative_reading
translation:
  language: ko
  text: 「니느웨의 남자들은 심판 때에 이 세대와 함께 일어나 이 세대를 정죄할 것입니다. 그들이 요나의 선포를 받고 회개하였기 때문입니다. 보십시오, 요나보다 더 큰 것이 여기 있습니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 중성형 ‘더 큰 것/더 많은 것’을 사용합니다. 따라서 ‘요나보다 더 큰 이가 여기 있다’ 또는 ‘요나보다 더 큰 것이 여기 있다’로도 이해할 수 있습니다. 이 중성 표현은 예수 한 분과의 개인적 비교에만 한정되지 않고, 그분 안에 현존하는 더 큰 실재를 폭넓게 가리킬 수도 있습니다.
    reason: alternative_reading
