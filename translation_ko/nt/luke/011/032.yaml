  source_fidelity: 초안은 심판 때의 부활/등장, 이 세대와의 연대, 정죄, 니느웨 사람들의 회개, 그리고 요나보다 더 큰 것이 현존한다는 핵심을 대체로 충실히 옮깁니다. 그러나 ‘회개하였거니와’는 ὅτι의 이유를 역접·양보처럼 들리게 하므로 인과 관계를 명시해야 합니다. 또한 ἄνδρες의 남성 복수와 πλεῖον의 중성형에서 비롯되는 표현상의 여지를 더 잘 보존할 수 있습니다.
  naturalness: ‘-하리라’, ‘-하였거니와’, ‘보라’는 현대 표준어 합쇼체 목표와 맞지 않거나 문어적·고어적입니다. ‘-할 것입니다’, ‘-하였기 때문입니다’, ‘보십시오’로 고치면 현대의 격식 있는 성경 문체로 자연스럽습니다.
