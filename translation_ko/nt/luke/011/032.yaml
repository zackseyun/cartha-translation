  to: 「니느웨의 남자들은 심판 때에 이 세대와 함께 일어나 이 세대를 정죄할 것입니다. 그들이 요나의 선포를 받고 회개하였기 때문입니다. 보십시오, 요나보다 더 큰 것이 여기 있습니다.[a]」
  rationale: 이유를 나타내는 ὅτι를 ‘-기 때문입니다’로 분명히 옮기고, κήρυγμα를 ‘선포’로 다듬었으며, 전체를 현대 표준어 합쇼체로 조정했습니다. πλεῖον의 중성형이 지닌 인칭적·비인칭적 해석 가능성은 본문을 과도하게 해석하지 않도록 각주에 보존했습니다.
