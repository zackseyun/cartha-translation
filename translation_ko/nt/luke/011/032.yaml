    issue: ‘회개하였거니와’가 ὅτι의 인과 관계를 흐립니다.
    rationale: ὅτι는 니느웨 남자들이 이 세대를 정죄할 이유, 곧 요나의 선포에 반응하여 회개했다는 사실을 제시합니다. ‘거니와’는 대조 또는 양보의 뉘앙스를 낼 수 있습니다.
  - severity: medium
    issue: 현대 합쇼체 목표에 비해 종결과 호소 표현이 고어적입니다.
    rationale: ‘정죄하리라’, ‘회개하였거니와’, ‘보라’ 대신 현대 격식체인 ‘정죄할 것입니다’, ‘회개하였기 때문입니다’, ‘보십시오’를 사용해야 합니다.
  - severity: low
    issue: ‘요나의 전파’는 κήρυγμα의 의미를 다소 넓고 불분명하게 합니다.
    rationale: κήρυγμα는 전파 행위 일반보다 선포된 메시지/선포를 뜻하므로 ‘요나의 선포’가 더 직접적입니다.
