  source_fidelity: 초안은 마지막 절의 미래 수동태(ἀνοιγήσεται)는 대체로 반영하지만, λαμβάνει와 εὑρίσκει의 현재형을 각각 미래형으로 옮겼습니다. 또한 ‘찾는 자는 찾을 것이며’는 ‘seek’와 ‘find’의 구별을 흐립니다. 수정문은 현재형의 일반적 진술과 마지막 미래 수동태를 구분하고, 열리는 대상이 그리스어에서 명시되지 않은 점을 보존합니다.
  naturalness: ‘구하는 자’와 ‘찾는 자’는 이해 가능하나 현대 표준어 합쇼체로는 ‘구하는 사람’, ‘찾는 사람’이 더 자연스럽습니다. ‘두드리는 사람에게는 열릴 것입니다’는 한국어에서 목적어/주어를 보충하지 않아도 문맥상 자연스럽고, 원문의 비명시성을 유지합니다.
  terminology: αἰτέω는 ‘구하다’, ζητέω는 ‘찾다’, εὑρίσκω는 ‘찾아내다’로 구별했습니다. 교리적 조건이나 ‘문’ 같은 명시되지 않은 대상을 본문에 추가하지 않았습니다.
