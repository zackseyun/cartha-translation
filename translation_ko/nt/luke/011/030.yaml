translation:
  language: ko
  text: 「이는 요나가 니느웨 사람들에게 표적이 된 것처럼, 인자도 이 세대에게 표적이 될 것이기 때문입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “이와 같이 인자도 이 세대에게 있을 것입니다.” 병행되는 앞 절에 비추어 ‘표적이 될’이라는 뜻이 함축되어 있습니다.
    reason: 둘째 절에서 그리스어 본문이 반복하지 않은 ‘표적’이라는 보어를 한국어 번역에서 명시한 점을 밝혀, 원문의 생략과 번역의 명료성을 함께 보존합니다.
