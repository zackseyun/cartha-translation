source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
  footnotes:
  - marker: a
    text: Or 'clear,' 'sound,' or traditionally 'single.' The Greek adjective can carry the sense of being undivided or sound; here it describes the eye in contrast to a 'bad' eye.
    reason: lexical_alternative
  - marker: b
    text: Or 'evil.' The Greek word can mean 'bad' or 'evil'; here it may suggest both a defective eye and morally distorted perception.
    reason: lexical_alternative
translation:
  language: ko
  text: 「당신의 몸의 등불은 당신의 눈입니다.[a] 당신의 눈이 건강하면 온몸도 밝습니다. 그러나 눈이 나쁘면 몸도 어둡습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맑은’, ‘온전한’, 또는 전통적으로 ‘단일한’. 그리스어 형용사는 나뉘지 않거나 온전하다는 뜻을 지닐 수 있으며, 여기서는 ‘나쁜’ 눈과 대조되어 눈을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악한’. 그리스어는 ‘나쁜’ 또는 ‘악한’을 뜻할 수 있으며, 여기서는 결함 있는 눈과 도덕적으로 왜곡된 인식이라는 두 의미를 함께 암시할 수 있습니다.
    reason: lexical_alternative
