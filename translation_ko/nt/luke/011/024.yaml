review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 의미를 대체로 담고 있으나, δι’ ἀνύδρων τόπων의 ‘~을/를 지나’라는 이동 방향이 ‘~으로 다니다’로 바뀌었고, καὶ μὴ εὑρίσκον λέγει의 연결은 ‘찾지 못하면’보다 ‘찾지 못하고 말합니다’가 더 충실합니다. 직접 인용문의 미래 결의도 명시적으로 옮겼습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 비유적 서술의 현재형을 ‘말합니다’로 유지합니다. 겹낫표와 종결 쉼표는 문장 완결성을 해치므로 일반적인 인용 부호와 마침표로 정리했습니다.
  terminology: ἀκάθαρτον πνεῦμα은 복음서의 통상 용례에 맞게 ‘더러운 영’으로 유지했습니다. ἀνάπαυσις는 ‘쉼’, ὁ οἶκός μου는 뒤 절의 비유를 보존하도록 ‘내 집’으로 옮겼습니다. ἄνθρωπος는 원문의 남성 단수 및 대표적 용법을 보존하여 ‘사람’으로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘물 없는 곳으로 다니다’는 전치사 διὰ의 통과·경유 의미를 약화합니다.
    rationale: 원문은 영이 물 없는 장소들을 ‘지나며/통과하며’ 쉼을 찾는다고 말합니다. ‘물 없는 곳들을 지나 다니며’가 이동과 장소의 관계를 더 정확히 반영합니다.
  - severity: medium
    issue: ‘찾지 못하면’은 분사 καὶ μὴ εὑρίσκον을 조건절로 다소 재구성합니다.
    rationale: 원문은 ‘찾지 못하고 말합니다’라는 연속 동작으로 진술합니다. 조건적 뉘앙스를 피하여 서술 흐름을 보존하는 편이 안전합니다.
  - severity: low
    issue: 원문 및 영어 감사 기록의 ‘waterless/dry places’ 어휘 대안을 반영하는 각주가 없습니다.
    rationale: ‘물 없는 곳들’에 각주를 달아 전통적 번역인 ‘메마른 곳들’도 가능한 번역임을 제시하면 어휘 선택을 투명하게 할 수 있습니다.
  revised_text: 더러운 영이 사람에게서 나가면, 물 없는 곳들을 지나 다니며 쉼을 찾다가, 찾지 못하고 말합니다. “내가 나온 내 집으로 돌아가겠다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘메마른 곳들’. 그리스어는 글자 그대로 물이 없는 장소들을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 원문의 일반적 시간 조건(ὅταν), 물 없는 장소들을 통과하는 움직임(διὰ), 쉼을 찾으나 찾지 못한 뒤 말하는 연속 서술(καὶ μὴ εὑρίσκον λέγει), 그리고 미래의 결의(Ὑποστρέψω)를 한국어에서 자연스럽게 보존했습니다. 본문에는 ‘물 없는 곳들’ 뒤에 각주 표지 a를 붙여야 합니다.
