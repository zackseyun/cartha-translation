  terminology: ἀκάθαρτον πνεῦμα는 복음서의 일반적 용례에 맞게 ‘더러운 영’으로 유지합니다. ἄνθρωπος의 단수 남성형은 ‘사람’으로 자연스럽게 옮기되, 대표적 단수의 의미를 보존합니다.
