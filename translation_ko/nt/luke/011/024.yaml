  - severity: high
    issue: 문장 및 인용부호 미완결
    rationale: 초안은 ‘하고,’로 끝나 문장이 완결되지 않고, 바깥 인용부호와 직접화법 인용부호가 부적절하게 중첩되어 있습니다.
  revised_text: 더러운 영이 사람에게서 나가면, 쉴 곳을 찾아 물 없는 곳들을 지나 다니며, 찾지 못하고 말합니다. ‘내가 나온 내 집으로 돌아가겠습니다.’
