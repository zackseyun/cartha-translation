  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 현재형 분사 ἐπαθροιζομένων의 진행성을 ‘계속 모여들자’로, αὐτῇ(‘이 세대’에 대한 단수 지시)를 ‘그 세대에’로 옮기면 더 정확합니다.
  naturalness: 초안의 서술은 자연스럽지만, 인용문 안의 ‘이다’와 ‘아니할 것이다’는 요청된 현대 합쇼체와 맞지 않습니다. ‘입니다/않을 것입니다’가 현대 표준어 문체에 적합합니다.
  terminology: γενεά는 ‘세대’, πονηρά는 ‘악한’, σημεῖον은 ‘표적’, τὸ σημεῖον Ἰωνᾶ는 해석을 덧붙이지 않은 ‘요나의 표적’으로 유지하는 것이 적절합니다.
  issues:
