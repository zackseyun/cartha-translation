  - severity: low
    issue: ‘그들에게’가 원문의 단수 지시 대상과 다릅니다.
    rationale: αὐτῇ는 ‘이 세대’를 가리킵니다. 한국어에서는 ‘그 세대에’가 문법적 지시를 더 잘 보존하면서도 자연스럽습니다.
  - severity: low
    issue: 무리가 모여드는 동작의 진행성이 약하게 드러납니다.
    rationale: ἐπαθροιζομένων은 주동사와 동시적인 진행 중의 모임을 나타내므로 ‘계속 모여들자’가 이를 더 분명히 반영합니다.
