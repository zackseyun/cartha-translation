  verdict: revise
  source_fidelity: The draft correctly retains the implicit house and the resultant state expressed by the two perfect passive participles. However, ‘깨끗이’ adds an explicit ‘clean’ not stated in the Greek, and ‘치워지다’ can suggest that things have been removed rather than that the house has been swept. ‘청소되어 있고 정돈되어 있습니다’ conveys the two-result-state description naturally; the temporal participle is represented by ‘와서 보니.’
  naturalness: The revised wording is natural modern formal-polite Korean. Removing the contraction-like ‘와 보니’ and using ‘와서 보니’ gives a slightly more formal narrative register. The quotation marks may be retained because the verse belongs to Jesus’ continuing direct speech.
  terminology: ‘정돈되어’ suitably renders κεκοσμημένον in its contextual sense of being put in order. A lexical-alternative note preserves the possible more concrete/ornamental sense (‘swept’ / ‘adorned’) without forcing it into the main text.
  issues:
  - severity: medium
    issue: ‘깨끗이 치워지고’ over-specifies and may misstate the first participle.
    rationale: σεσαρωμένον means ‘having been swept’; it does not explicitly say ‘clean,’ and 치워지다 can mean ‘be put away/removed,’ which is less precise for the condition of a house.
  - severity: low
    issue: No note preserves the lexical range represented in the English audit trail.
    rationale: κεκοσμημένον can mean ‘adorned/decorated’ as well as ‘put in order’; a concise anchored alternative supports source transparency.
