review_pass:
  verdict: revise
  source_fidelity: The draft preserves the three imperative–future promise pairs, but its archaic diction and mixed endings obscure the modern formal-polite target register. In particular, 찾으라 ... 너희가 찾을 것이요 fails to distinguish ζητεῖτε ('seek') from εὑρήσετε ('find') clearly in natural Korean.
  naturalness: ‘이르노니’ and ‘것이요’ are archaic/non-합쇼체, while the final ‘것이다’ changes register. Short parallel sentences with ‘-십시오/-것입니다’ are natural modern formal-polite Korean.
  terminology: ‘구하십시오’ appropriately renders αἰτεῖτε; ‘찾으십시오’ and ‘발견할 것입니다’ preserve the seek/find distinction. ‘문이 너희에게 열릴 것입니다’ makes explicit only the door that is necessarily implied by κρούετε/ἀνοιγήσεται and retains the passive promise.
  issues:
  - severity: medium
    issue: Register is archaic and inconsistent.
    rationale: ‘이르노니,’ ‘것이요,’ and ‘것이다’ do not consistently use the required modern formal-polite 합쇼체.
  - severity: medium
    issue: The second promise is semantically unclear.
    rationale: The wording ‘찾으라, 그러면 너희가 찾을 것이요’ repeats ‘find/search’ with the same Korean verb and does not naturally convey the Greek contrast between seeking and finding.
  - severity: low
    issue: The audit-trail aspect footnote is absent.
    rationale: A footnote anchored to the imperatives can retain the non-main-text alternative that explicitly renders a possible ongoing nuance of the Greek present imperatives.
