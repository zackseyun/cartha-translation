  to: 「그리고 내가 너희에게 말합니다. 구하십시오. 그러면 너희에게 주어질 것입니다[a]. 찾으십시오. 그러면 발견할 것입니다. 두드리십시오. 그러면 문이 너희에게 열릴 것입니다.」
