source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
  footnotes:
  - marker: a
    text: Or 'between the altar and the temple'; Greek literally, 'between the altar and the house.'
    reason: lexical_alternative
  - marker: b
    text: The Zechariah mentioned here is debated; possibilities include Zechariah son of Jehoiada (2 Chronicles 24:20–22) or Zechariah son of Berechiah.
    reason: cross_reference
translation:
  language: ko
  text: 「아벨의 피로부터 제단과 성전[a] 사이에서 죽은 스가랴의 피에 이르기까지입니다. 그렇습니다, 내가 너희에게 말합니다[b]. 그 피의 값이 이 세대에게서 요구될 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어로는 문자적으로 ‘제단과 집 사이에서’입니다. 여기서 ‘집’은 성전 건물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 언급된 스가랴가 누구인지는 논쟁이 있습니다. 여호야다의 아들 스가랴(역대기하 24:20–22) 또는 베레갸의 아들 스가랴일 가능성이 제시됩니다.
    reason: cross_reference
