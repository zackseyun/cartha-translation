review_pass:
  verdict: revise
  source_fidelity: 초안은 식사 초청과 들어감의 흐름을 대체로 전달합니다. 그러나 ‘그가’는 바로 앞의 ‘한 바리새인’을 가리키는 것으로 읽혀, 들어가 식탁에 앉은 분이 예수님이라는 원문의 주어를 흐립니다. 또한 ἀνέπεσεν은 식사 때 기대어 눕는 자세를 뜻하므로 단순히 ‘앉으셨습니다’보다 그 뜻을 드러낼 필요가 있습니다.
  naturalness: ‘말씀하고 계실 때’는 진행 중인 발화를 자연스럽게 나타내며, ‘식탁에 기대어 앉으셨습니다’는 현대 표준어 합쇼체 안에서 당시 식사 자세를 무리 없이 전달합니다.
  terminology: ‘바리새인’은 표준적인 명칭입니다. ‘식사하시기를 청했습니다’는 ὅπως ἀριστήσῃ의 식사 초청을 시간대를 과도하게 특정하지 않고 옮깁니다.
  issues:
  - severity: medium
    issue: ‘그가’의 지시 대상이 모호합니다.
    rationale: 한국어 문맥상 가장 가까운 명사인 ‘한 바리새인’을 받는 것으로 읽히기 쉽지만, εἰσελθὼν δὲ ἀνέπεσεν의 주어는 예수님입니다.
  - severity: medium
    issue: ‘식탁에 앉으셨습니다’가 ἀνέπεσεν의 기대어 눕는 식사 자세를 충분히 반영하지 못합니다.
    rationale: 이 동사는 식사 맥락에서 단순히 앉는 것이 아니라 기대어 눕거나 비스듬히 기대는 자세를 가리킵니다.
