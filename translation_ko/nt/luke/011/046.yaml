source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
  footnotes:
  - marker: a
    text: Or 'experts in the law.' The Greek term refers to specialists in the Jewish law.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not lay a finger on the burdens.' The expression emphasizes that they make no effort to help with what they impose on others.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. “너희 율법 전문가들에게도 화가 있습니다.[a] 너희는 사람들에게 감당하기 어려운 짐을 지우면서, 정작 너희 자신은 그 짐에는 손가락 하나도 대지 않습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법 교사들’. 그리스어는 유대 율법의 전문 지식인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희 손가락들 가운데 하나로도 그 짐들에 대지 않는다’. 이 표현은 자신들이 다른 사람에게 지운 짐을 덜어 주려는 노력조차 하지 않음을 강조합니다.
    reason: idiomatic_expression
