  terminology: ‘주님’은 κύριε의 존칭 및 누가복음에서의 용례를 적절히 반영합니다. ‘제자들 가운데 한 사람’도 τις τῶν μαθητῶν αὐτοῦ를 자연스럽고 정확하게 옮깁니다.
  issues:
