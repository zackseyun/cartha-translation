  to: 예수께서 어떤 곳에서 기도하고 계셨는데, 기도를 마치시자 제자들 가운데 한 사람이 예수께 말하였습니다. 「주님, 요한도 자기 제자들에게 가르친 것처럼, 우리에게 기도하도록 가르쳐 주십시오.」
  rationale: 원문의 불특정 장소, 계속 중인 기도, 기도를 마친 뒤의 요청, 제자들 중 한 사람, ‘주님’이라는 호칭을 유지했습니다. 비교절의 καί를 ‘요한도’로 반영하고, 한국어 문법과 현대적 문체에 맞게 요청 표현을 다듬었습니다. 비교절의 목적어는 원문처럼 문맥상 생략된 상태로 유지했습니다.
