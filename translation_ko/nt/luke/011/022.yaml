    issue: ἐπελθών의 대결적 접근이 ‘와서’에서 약화됨
    rationale: 이 분사는 단순한 도착보다 상대에게 닥치거나 맞서 오는 상황을 나타냅니다. ‘그에게 닥쳐’가 문맥상의 충돌 이미지를 보존합니다.
  - severity: low
    issue: ‘모든 무장’의 어색한 결합
    rationale: 한국어에서 ‘무장’은 집합적·상태적 의미로도 쓰이므로 ‘모든 무장’은 다소 부자연스럽습니다. ‘온갖 무장’이 완전한 무장이라는 뜻을 자연스럽게 전달합니다.
