  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
  footnotes:
  - marker: a
    text: Or more specifically, 'a large millstone.' The Greek phrase can refer to the heavier millstone used in a mill.
    reason: lexical_alternative
  - marker: b
    text: Or 'cause one of these little ones to sin.' The Greek verb includes the sense of causing someone to fall into sin or spiritual ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이 작은 자들 가운데 하나를 걸려 넘어지게 하는 것보다, 그의 목에 맷돌[a]이 매달리고 그가 바다에 던져지는 것이 그에게 더 나을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 구체적으로, ‘큰 맷돌’. 그리스어 표현은 방앗간에서 쓰는 더 무거운 맷돌을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 작은 자들 가운데 하나를 죄짓게 하는 것보다’. 그리스어 동사는 누군가를 죄에 빠지게 하거나 영적으로 넘어지게 한다는 뜻을 포함합니다.
    reason: lexical_alternative
