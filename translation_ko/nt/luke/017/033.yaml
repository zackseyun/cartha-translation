  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
  footnotes:
  - marker: a
    text: Or 'soul' for 'life' (ψυχή), though here the sense is likely one's life/self rather than the immaterial soul.
    reason: lexical_alternative
  - marker: b
    text: Or 'will preserve it alive' or traditionally 'will save it'; the Greek verb literally means 'will keep alive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 자기 목숨[a]을 보존하려고 하는 사람은 그것을 잃을 것이며, 누구든지 그것을 잃는 사람은 그것을 살릴 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼’. 여기서는 자신의 목숨 또는 생명을 가리키는 뜻으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 살아 있게 할 것입니다’; 전통적으로 ‘그것을 구원할 것입니다’.
    reason: lexical_alternative
