  source_fidelity: ‘겨자씨만 한’은 ὡς κόκκον σινάπεως의 단순 비교를 크기 비교로 한정합니다. 또한 ‘말해도’는 조건·양보의 뉘앙스를 더하므로, 잠재적 귀결을 나타내는 ‘말할 것이며’가 ἐλέγετε ἄν과 더 가깝습니다. ‘심겨라’는 수동 명령형 Ἐκριζώθητι καὶ φυτεύθητι를 자연스럽게 옮깁니다.
  naturalness: 현대 표준어 합쇼체에는 ‘심기어라’보다 ‘심겨라’가 자연스럽습니다. 인용문 안의 인용문은 서로 다른 인용 부호로 구분하는 것이 읽기 쉽습니다.
  terminology: ‘주’, ‘믿음’, ‘뽕나무’, ‘순종하다’는 문맥과 핵심 용어를 적절히 반영합니다. συκάμινος의 전통적 대안인 ‘시카민 나무’를 각주로 보존합니다.
  issues:
