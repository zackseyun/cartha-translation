  - severity: medium
    issue: ‘말해도’가 원문의 잠재적 귀결을 양보절처럼 표현합니다.
    rationale: ἐλέγετε ἄν은 ‘말할 것입니다/말할 것이며’처럼 조건의 귀결로 옮기는 편이 직접적입니다.
