  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'from one end of the sky to the other.' The Greek more literally repeats 'under heaven' in both halves of the expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'on his day.' The phrase refers to the time associated with the Son of Man and is left intentionally broad in the main text.
    reason: alternative_reading
