  source_fidelity: 대체로 충실합니다. 그러나 πάντα를 더 분명히 반영하려면 ‘모든 것을 다’로 옮기는 것이 좋고, πεποιήκαμεν은 ‘했을 뿐입니다’보다 ‘했습니다’가 원문의 단순한 완료 진술을 더 직접적으로 반영합니다. ἀχρεῖοι는 문맥상 주인에게 내세울 공로나 이익이 없다는 뜻을 포함하며, ‘무익한’은 가능한 번역입니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘명령받은 모든 것을 다 행한 뒤에’와 직접 인용 앞의 콜론을 사용하면 시간 관계와 인용의 경계가 더 선명해집니다.
  terminology: ‘종’은 한국어 성경 문체에서 δοῦλοι의 관습적이고 알아듣기 쉬운 대응어입니다. 다만 ἀχρεῖοι의 ‘쓸모없는/무익한’ 어휘 범위와 공로를 주장할 수 없다는 문맥적 함의는 각주로 밝혀 두는 것이 좋습니다.
