  naturalness: “주여” is understandable in traditional biblical Korean but is less natural for a modern formal-polite target. “주님” is contemporary and reverent. The revised word order is also more idiomatic Korean while retaining the response formula.
  terminology: Use “주님” for κύριε. Retain “시체” for the immediate carrion image, with a note for “몸.” Retain “독수리” as the direct lexical rendering, with a note that the Greek may denote vultures/carrion birds in this context. This does not resolve the proverb’s disputed theological referent.
