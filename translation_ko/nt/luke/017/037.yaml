  text: 그들이 대답하여 예수께 말했습니다. “주님, 어디입니까?” 예수께서 그들에게 말씀하셨습니다. “시체[a]가 있는 곳에는 독수리[b]도 모여들 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “몸.” 그리스어는 기본적으로 “몸”을 뜻하지만, 여기서는 죽은 몸을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 “독수리들”을 뜻할 수 있으며, 시체 주위에 모이는 문맥에서는 “독수리과의 시체를 먹는 새들,” 곧 독수리류의 scavenging birds(“vultures”)를 가리킬 수도 있습니다.
    reason: lexical_alternative
