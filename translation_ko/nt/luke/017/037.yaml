    issue: No footnote anchors preserve the lexical ambiguities of σῶμα and ἀετοί.
    rationale: The audit trail identifies both as meaningful alternatives. Anchored Korean notes allow the main text to remain natural without concealing the source-language range.
  - severity: low
    issue: “주여” is archaic relative to the stated modern formal-polite register.
    rationale: “주님” is the customary modern respectful Korean address and preserves the title κύριε.
  - severity: low
    issue: “모일 것입니다” is somewhat less idiomatic for carrion birds converging on a body.
    rationale: “모여들 것입니다” is natural Korean and retains the future sense without imposing an interpretation.
