  terminology: ‘롯’, ‘소돔’, ‘하늘’, ‘유황’, ‘멸했습니다’는 통용되는 성경 용어이면서 현대 한국어에도 적절합니다. θεῖον은 ‘유황’으로, ἀπώλεσεν은 문맥상 ‘멸했습니다’로 충실히 옮겼습니다.
