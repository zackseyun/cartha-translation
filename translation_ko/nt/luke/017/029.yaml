  source_fidelity: 개정이 필요합니다. ἐξῆλθεν은 부정과거로, 롯이 실제로 소돔에서 ‘나간’ 사건을 가리키므로 미완료적 뉘앙스를 줄 수 있는 ‘나가던’보다 ‘나간’이 정확합니다. βρέχω의 비유적 ‘비처럼 내리다’는 한국어에서 자연스럽게 살리되, 원문에 없는 행위 주체를 보충하지 않았습니다.
