  source_fidelity: 초안은 εἰσερχομένου의 진행·동시 상황, τινα의 부정성, 열 명, 그리고 거리의 요소를 대체로 반영합니다. 그러나 문장이 ‘서서’로 끝나 원문의 완료된 진술을 전달하지 못합니다. 또한 ἔστησαν은 여기서 단순히 ‘서 있었다/섰다’라는 서술이므로, 한국어에서는 독립된 종결 서술로 옮겨야 합니다.
  naturalness: ‘어느 마을에 들어가실 때에’도 가능하지만 ‘어떤 마을에 들어가실 때’가 현대 표준어에서 더 자연스럽습니다. ‘맞이했는데, 그들은 멀찍이 서서’는 미완결 문장이므로 합쇼체 종결형으로 고쳐야 합니다.
  terminology: ‘나병에 걸린 사람’은 고대의 λεπροί를 현대 의학적으로 과도하게 특정하지 않으면서 사람을 지칭하는 표현입니다. 다만 ‘나병’이 현대 임상 진단과 완전히 등치되는 것은 아니라는 점을 각주로 밝혀 원문의 범주적 모호성을 보존합니다. ‘그분’은 본문 내 예수에 대한 공손한 지시로 문맥상 무리가 없습니다.
  issues:
