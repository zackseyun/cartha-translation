    issue: 첫 문장의 재귀적 경계 표현이 어색함
    rationale: ‘여러분 자신을 조심하십시오’는 자신을 위험 대상으로 삼는 듯한 의미가 될 수 있습니다. προσέχετε ἑαυτοῖς의 문맥상 뜻은 스스로 경계하라는 명령입니다.
  - severity: medium
    issue: 영어 감사 기록의 본문비평·문화 각주와 앵커가 누락됨
