review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 προσέχετε ἑαυτοῖς는 목적어가 있는 ‘여러분 자신을 조심하십시오’보다 재귀적 경계의 뜻인 ‘여러분은 스스로 조심하십시오’가 더 자연스럽고 정확합니다. SBLGNT의 짧은 본문을 따라 ‘여러분에게’ 또는 ‘여러분을 거슬러’를 본문에 보태지 않았습니다.
  naturalness: ‘여러분 자신을 조심하십시오’는 현대 한국어에서 다소 어색합니다. ‘여러분은 스스로 조심하십시오’와 조건절 ‘죄를 지으면/회개하면’이 표준어 합쇼체로 자연스럽습니다.
  terminology: ἀδελφός는 본문에서 남성 단수 ‘형제’로 유지하고, 포괄적 공동체 지시 가능성은 각주로 설명했습니다. ἐπιτίμησον은 ‘책망하십시오’, μετανοήσῃ는 ‘회개하면’, ἄφες는 ‘용서하십시오’로 옮겼습니다.
  issues:
