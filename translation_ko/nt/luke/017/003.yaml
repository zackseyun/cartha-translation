translation:
  language: ko
  text: 여러분은 스스로 조심하십시오. 여러분의 형제가 죄를 지으면[a] 그를 책망하십시오. 그가 회개하면 용서하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “여러분의 형제가 여러분에게 죄를 지으면 그를 책망하십시오”라고 되어 있습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어의 ‘형제’는 남성 단수형이며, 더 넓게는 함께 믿는 사람을 가리킬 수도 있습니다.
