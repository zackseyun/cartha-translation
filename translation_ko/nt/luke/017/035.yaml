base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
  footnotes:
  - marker: a
    text: Or 'in the same place.' The Greek expression can mean 'together' or 'at the same place.'
    reason: lexical_alternative
  - marker: b
    text: '''Will be taken'' does not by itself specify whether the taking is for salvation or for judgment; the Greek leaves that to the broader context.'
    reason: alternative_reading
translation:
  language: ko
  text: 두 여자가 함께 맷돌질을 하고 있을 것입니다.[a] 한 여자는 데려가질 것이며,[b] 다른 한 여자는 남겨질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “같은 곳에서.” 그리스어 표현은 “함께” 또는 “같은 곳에서”를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “데려가질 것이다”라는 말만으로는 그 데려감이 구원을 위한 것인지 심판을 위한 것인지 분명히 알 수 없습니다. 그리스어 본문은 그 판단을 더 넓은 문맥에 남겨 둡니다.
    reason: alternative_reading
