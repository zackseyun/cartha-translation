review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the contrast (δὲ), temporal priority (πρῶτον), necessity (δεῖ), and the paired passive experiences. However, '이 세대로부터' is less idiomatic for the personal agency expressed by ἀπό with the passive verb; '이 세대에게' expresses the intended agent naturally. Rendering πολλὰ παθεῖν as '많은 고난을 겪고' clearly conveys suffering in natural Korean.
  naturalness: The sentence is clear and uses appropriate modern formal-polite 합쇼체. Replacing '세대로부터 버림받아야' with '세대에게 배척받아야' improves idiomatic Korean and more precisely represents rejection.
  terminology: '''인자'' is the established Korean biblical rendering for the contextual referent, and ''배척받다'' suitably conveys ἀποδοκιμασθῆναι, rejection/repudiation. No doctrinal interpretation is added.'
  issues:
  - severity: medium
    issue: '''이 세대로부터 버림받아야 합니다'' is an awkward rendering of ἀπὸ τῆς γενεᾶς ταύτης.'
    rationale: In this passive construction ἀπό identifies those responsible for the rejection. Korean '이 세대에게 배척받아야 합니다' is more natural and preserves that agency.
  revised_text: 그러나 먼저 인자는 많은 고난을 겪고 이 세대에게 배척받아야 합니다.
