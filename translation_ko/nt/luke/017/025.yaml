- from: 그러나 인자가 먼저 많은 고난을 받고 이 세대로부터 버림받아야 합니다.
  to: 그러나 먼저 인자는 많은 고난을 겪고 이 세대에게 배척받아야 합니다.
  rationale: The revision preserves the verse's sequence and necessity while making the agentive phrase idiomatic in Korean. '많은 고난을 겪고' naturally communicates the many sufferings expressed by πολλὰ παθεῖν, and '배척받아야 합니다' reflects the force of ἀποδοκιμασθῆναι without interpretive expansion.
  reviewer_model: gpt-5.6-terra
