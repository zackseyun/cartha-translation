  text: 예수께서 제자들에게 말씀하셨습니다. “여러분이 인자의 날들[a] 가운데 하루를 보기를 간절히 바랄 날들이 오겠으나, 보지 못할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자의 날들’은 그분이 계시고 사역하시는 때를 가리킬 수도 있고, 더 구체적으로는 장차 그분이 나타나실 때를 가리킬 수도 있습니다. 그리스어 표현은 그 범위를 열어 둡니다.
    reason: alternative_reading
