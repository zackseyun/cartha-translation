  source_fidelity: 수정이 필요합니다. οὐδὲ ἐροῦσιν은 ‘말하지 못할 것입니다’(능력·불가능)보다 미래 부정인 ‘말하지 않을 것입니다’로 옮겨야 합니다. 또한 인용부호의 시작·끝 구조가 잘못되어 있습니다. ἐντὸς ὑμῶν은 본문에서 공동체적 의미로 ‘여러분 가운데에’라고 번역할 수 있으나, ‘여러분 안에’라는 가능한 대안은 각주로 남겨야 합니다.
  naturalness: ‘보십시오’와 합쇼체 서술은 현대 표준어의 격식 있는 문체에 적절합니다. ‘여기 있다!’와 ‘저기 있다!’는 위치를 가리키는 표현의 대조를 자연스럽게 살립니다. ‘가운데에’가 조사 결합까지 갖춘 자연스러운 표기입니다.
  terminology: ‘하나님의 나라’는 ἡ βασιλεία τοῦ θεοῦ의 표준적이고 신학적으로 과도하게 해석하지 않는 번역입니다. ἐντὸς ὑμῶν의 논쟁적 범위는 본문과 각주를 함께 두어 보존합니다.
