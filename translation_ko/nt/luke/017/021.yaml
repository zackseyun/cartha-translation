translation:
  language: ko
  text: 또 사람들이 ‘보십시오, 여기 있다!’ 또는 ‘저기 있다!’라고 말하지 않을 것입니다. 보십시오, 하나님의 나라는 여러분 가운데에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분 안에 있습니다.’ 그리스어 표현은 내적인 의미로도, ‘여러분 가운데/사이에’라는 공동체적 의미로도 이해될 수 있습니다.
    reason: alternative_reading
theological_decisions:
- issue: ἐντὸς ὑμῶν의 의미
  chosen_reading: 여러분 가운데 있습니다
  alternative_readings:
  - 여러분 안에 있습니다
  rationale: ἐντός는 내부를 뜻할 수도, 공동체적 가운데를 뜻할 수도 있다. 청자가 바리새파임을 감안할 때 개인 영성적 「안에」보다 공동체적 임재 「가운데」가 문맥에 부합한다.
  doctrine_reference: DOCTRINE.md §1 author intent
