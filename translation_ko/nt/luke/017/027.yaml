  verdict: revise
  source_fidelity: The draft correctly conveys the sequence of ordinary activities, Noah's entry into the ark, the flood, and the total destruction. However, "들어가던 날" presents Noah's entering as an ongoing action, whereas εἰσῆλθεν is a completed aorist event. The repeated imperfects in the activity list are better represented explicitly as continuing customary actions.
  naturalness: '"장가들고 시집가고" is natural, established Korean biblical wording for the paired marriage expressions. Adding "있었습니다" makes the ongoing scene clear while retaining concise, modern formal-polite prose. "멸망시켰습니다" is more idiomatic than "멸했습니다" for the flood''s destruction of people.'
  terminology: '"방주" and "홍수" are appropriate established terms. The traditional paired expressions "장가들고 시집가고" preserve the source''s distinction between marrying and being given in marriage; a note should identify that distinction without forcing unnatural passive Korean wording.'
  issues:
  - severity: medium
    issue: '"노아가 방주에 들어가던 날까지"'
    rationale: The Greek εἰσῆλθεν is a completed aorist ('entered'), not an imperfect or progressive action. "들어간 날까지" accurately marks the temporal endpoint.
  - severity: medium
    issue: The ongoing force of the four imperfect verbs is not explicit.
    rationale: Although a coordinated Korean list can imply customary activity, "먹고 마시며 ... 있었습니다" more clearly reflects the continuing/habitual scene conveyed by ἤσθιον, ἔπινον, ἐγάμουν, and ἐγαμίζοντο.
  - severity: low
    issue: No footnote marks the distinct marriage verbs.
    rationale: The source and English audit specifically preserve the active/passive distinction. A brief anchored note documents this lexical feature while keeping idiomatic Korean in the main text.
  - severity: low
    issue: '"그들 모두를 멸했습니다" is less natural Korean collocation.'
    rationale: For a flood destroying people, "그들 모두를 멸망시켰습니다" is clearer and idiomatic while preserving ἀπώλεσεν πάντας.
  revised_text: 사람들은 노아가 방주에 들어간 날까지 먹고 마시며 장가들고 시집가고[a] 있었습니다. 그리고 홍수가 와서 그들 모두를 멸망시켰습니다.
