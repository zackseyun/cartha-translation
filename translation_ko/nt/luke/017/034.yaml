  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
  footnotes:
  - marker: a
    text: Or 'one will be taken along' for παραλημφθήσεται; the verb itself does not specify here whether the taking is for deliverance or for judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be left behind'; the shorter 'will be left' is used in the main text to avoid importing later eschatological associations not explicit in the Greek.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러분에게 말합니다. 그 밤에 두 사람이 한 침대에 있을 것입니다. 한 사람은 데려가질 것이고[a], 다른 한 사람은 남겨질 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 데려가질 것입니다.’ παραλημφθήσεται는 ‘함께 데려가다’로도 옮길 수 있습니다. 그러나 이 동사 자체는 여기서 그 데려감이 구원을 위한 것인지 심판을 위한 것인지 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뒤에 남겨질 것입니다.’ 본문의 짧은 표현 ‘남겨질 것입니다’는 그리스어에 명시되지 않은 후대의 종말론적 연상을 덧붙이지 않습니다.
    reason: lexical_alternative
