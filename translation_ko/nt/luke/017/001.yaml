review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders σκάνδαλα as “걸림돌” and conveys the impossibility of their non-occurrence. However, “그것이 그를 통해 오는 자” is grammatically and referentially defective: it changes the plural/collective antecedent into an unclear singular and fails to express δι’ οὗ (“through whom”) naturally.'
  naturalness: “그리고” is less suitable for the lightly connective δέ than “그러자,” and the final clause is not idiomatic Korean. The revision uses clear, modern formal-polite Korean while retaining the warning’s representative-singular force.
  terminology: “걸림돌” appropriately preserves the metaphor of σκάνδαλα without prematurely narrowing it to sin, offense, or temptation. “화가 있습니다” is a faithful and suitably solemn rendering of οὐαί.
  issues:
  - severity: high
    issue: The phrase “그러나 그것이 그를 통해 오는 자에게는” is syntactically malformed and semantically unclear.
    rationale: δι’ οὗ means “through whom,” with the person as the means/agent through whom the stumbling blocks come. The draft’s “그를 통해 오는 자” can instead suggest a person who comes through him and does not provide a clear antecedent for either pronoun.
  - severity: medium
    issue: The draft renders the plural/collective τὰ σκάνδαλα as an unexplained singular “그것.”
    rationale: Although “걸림돌” may be collective in Korean, the subsequent singular pronoun creates ambiguity. Repeating “걸림돌” avoids this and clearly identifies what comes.
  - severity: low
    issue: “그리고” overstates the connective force of δέ slightly.
    rationale: “그러자” gives natural narrative progression without implying a strong additive connection.
  revised_text: 그러자 예수께서 자기 제자들에게 말씀하셨습니다. “걸림돌이 오지 않는 것은 불가능합니다. 그러나 걸림돌이 누구를 통해 오든, 그 사람에게는 화가 있습니다.”
  revised_footnotes:
  - marker: '1'
    text: 또는 “죄에 빠지게 하는 것들” 또는 “범죄하게 하는 것들.” 그리스어 스칸달라(σκάνδαλα)는 사람을 도덕적·영적으로 넘어지게 하는 것들을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The final warning is recast as “걸림돌이 누구를 통해 오든, 그 사람에게는 화가 있습니다,” which faithfully communicates that the stumbling blocks come through a person while producing idiomatic Korean. The lexical note preserves viable interpretive alternatives for σκάνδαλα without placing a doctrinally narrowed interpretation in the main text.
