base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
  footnotes:
  - marker: a
    text: Or 'for offenses not to come,' 'for causes of sin not to come,' or 'for temptations to sin not to come.' The Greek σκάνδαλα carries the sense of things that trip people up morally or spiritually.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예수께서는 자기 제자들에게 말씀하셨습니다. 「걸림돌이 오지 않는 것은 불가능합니다. 그러나 그것이 그를 통해 오는 자에게는 화가 있을 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκάνδαλα
  english_pob_choice: stumbling blocks
  chosen_korean: 걸림돌
  alternatives_korean:
