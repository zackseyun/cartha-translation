review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 σκάνδαλα를 「걸림돌」로 옮겨 비유를 잘 보존했으나, 복수 중성 명사 τὰ σκάνδαλα를 단수 「그것」으로 받고, δι’ οὗ(‘그를 통하여’)를 「그를 통해 오는 자」로 처리하여 문법적 관계와 의미가 뒤바뀌었습니다.
  naturalness: 「걸림돌들이 오지 않는 것은 불가능합니다」와 「…사람에게는 화가 있습니다」는 현대 표준 한국어의 자연스러운 합쇼체이며, 예수께서 제자들에게 말씀하시는 서술 문맥에도 적합합니다.
  terminology: 「제자들」과 「걸림돌」은 누가복음의 문맥 및 σκάνδαλα의 비유적 폭을 잘 반영합니다. 「화가 있습니다」는 οὐαί의 경고·선고적 성격을 자연스럽게 유지합니다.
  issues:
  - severity: high
    issue: 「그것이 그를 통해 오는 자」가 원문의 수와 문법 관계를 바꿉니다.
    rationale: τὰ σκάνδαλα는 복수이므로 「그것들이」여야 합니다. δι’ οὗ는 ‘그 사람을 통하여’라는 뜻인데, 초안의 「그를 통해 오는 자」는 그 사람이 통로가 아니라 ‘그를 통해 오는’ 대상으로 읽히게 합니다.
  - severity: low
    issue: 「화가 있을 것입니다」는 현재형 οὐαί의 직접적인 선언보다 다소 미래적으로 들립니다.
    rationale: 「화가 있습니다」가 원문의 현재적 경고를 더 충실히 반영합니다.
  revised_text: 그리고 예수께서는 자기 제자들에게 말씀하셨습니다. “걸림돌들이 오지 않는 것은 불가능합니다. 그러나 걸림돌들이 그를 통하여 오는 사람에게는 화가 있습니다.”
  revised_footnotes:
  - marker: a
    text: 「걸림돌들」은 ‘범죄하게 하는 것’, ‘죄에 빠지게 하는 것’, 또는 ‘걸려 넘어지게 하는 일’로도 옮길 수 있습니다. 그리스어 스칸달라는 도덕적·영적으로 넘어지게 하거나 죄에 이르게 하는 것을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 원문의 복수 주어와 ‘~을 통하여’라는 관계를 명확히 회복했습니다. σκάνδαλα의 은유성과 의미 범위는 본문 「걸림돌들」 및 각주로 유지했으며, 특정 교리적 해석을 덧붙이지 않았습니다.
