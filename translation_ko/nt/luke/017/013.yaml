  - 주관자
  lexicon: BDAG
  rationale: ἐπιστάτης는 누가복음 고유의 호칭으로 권위 있게 가르치는 자를 가리킨다. κύριος(주)와 구별되므로 한국어 「선생님」이 자연스럽고 정중하다.
