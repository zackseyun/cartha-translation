  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
  footnotes:
  - marker: a
    text: Or, more literally, “lifted up their voice.”
    reason: lexical_alternative
  - marker: b
    text: “Master” translates Greek epistata, a term of address meaning one in authority; it is not the usual word for “Lord” (kyrios).
