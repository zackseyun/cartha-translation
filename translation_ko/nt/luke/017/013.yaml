translation:
  language: ko
  text: 그들은 소리를 높여[a] 말했습니다. “예수 선생님[b], 저희에게 자비를 베풀어 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “그들의 목소리를 높여.”
    reason: lexical_alternative
  - marker: b
    text: ‘선생님’은 권위를 지닌 사람에게 하는 호칭인 그리스어 에피스타타(ἐπιστάτα)를 옮긴 말입니다. 이는 흔히 ‘주’로 번역되는 퀴리오스(κύριος)와 다른 단어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστάτα
