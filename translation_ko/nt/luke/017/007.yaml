  source_fidelity: 「양 치는」은 ποιμαίνοντα가 가리키는 가축을 양으로 한정합니다. 또한 「식사 자리에 앉으라」는 ἀνάπεσε의 식사 중 기대어 눕는 자세를 충분히 드러내지 못합니다. 「그가」의 선행사도 문맥상 종임을 명시하는 편이 분명합니다.
  naturalness: 「종을 두고 있을 때」보다 「종을 둔 사람이」가 현대 표준 한국어에서 더 자연스럽고, 비유의 수사 의문문 구조도 명료합니다. 「식탁에 기대어 앉으라」는 고대 식사 관습을 반영하면서 이해 가능한 표현입니다.
  terminology: δοῦλον은 이 비유의 비대칭적 주인-종 관계를 보존하는 「종」으로 유지할 수 있습니다. ποιμαίνοντα는 특정 동물로 좁히지 않고 「가축을 돌보는」으로, ἀροτριῶντα는 「밭을 가는」으로 옮깁니다.
  issues:
