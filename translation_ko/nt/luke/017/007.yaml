    rationale: 원문은 목자의 일을 한다는 뜻이며, 여기서는 양이라는 동물이 명시되지 않습니다.
  - severity: medium
    issue: ἀνάπεσε의 기대어 식사하는 자세가 「식사 자리에 앉으라」에서 약화됨
    rationale: 고대 연회 식사의 몸 자세를 가리키는 동사이므로 본문 또는 문화 주석으로 이를 보존하는 것이 적절합니다.
