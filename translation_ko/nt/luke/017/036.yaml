  text: 두 사람이 밭에 있을 텐데, 한 사람은 데려감을 받고 다른 한 사람은 남겨질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '이 절은 가장 이른 그리스어 사본들(4세기의 시내 사본과 바티칸 사본 포함)과 초기 콥트어 번역본들에는 없지만, 서방 계열 전통(예: 5세기의 베자 사본), 비잔틴 다수 전통, 라틴 불가타에는 있습니다. 마태복음 24:40과 조화시키기 위해 후대 필사자들이 덧붙였을 가능성이 높습니다.'
    reason: textual_variant
