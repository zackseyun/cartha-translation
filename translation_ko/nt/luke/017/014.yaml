  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
  footnotes:
  - marker: a
    text: Or “they were made clean.” The Greek verb can denote cleansing in both a physical and ritual sense.
    reason: lexical_alternative
  - marker: b
    text: The instruction to show themselves to the priests reflects the priestly examination required for those healed of a skin disease; see Leviticus 14.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그들을 보시고 말씀하셨습니다. “가서 제사장들에게 여러분의 몸을 보이십시오.[b]” 그들이 가는 길에 깨끗해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 몸의 병이 깨끗해지는 것과 의례적으로 정결해지는 것을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 병이 나은 사람이 제사장에게 자신을 보이라는 명령은 피부병에서 나은 사람을 제사장이 살피도록 한 규정을 반영합니다. 레위기 14장을 보십시오.
    reason: cross_reference
