  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' command and the cleansing that occurred while the ten were on their way. The revised wording retains the plural reflexive sense of ἑαυτούς, the reference to the priests, and the cleansing terminology of ἐκαθαρίσθησαν without reducing it merely to healing.
  naturalness: ‘여러분 자신을 ... 보이십시오’ is understandable but unnatural in modern Korean. ‘제사장들에게 여러분의 몸을 보이십시오’ is idiomatic in the context of an examination for a skin condition. ‘가는 길에’ naturally expresses the contemporaneous-action construction.
  terminology: ‘제사장’ appropriately renders ἱερεύς. ‘깨끗해졌습니다’ preserves the text’s broad cleansing language; the note records its physical and ritual-purity dimensions without overloading the main text.
