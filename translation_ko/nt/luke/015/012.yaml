  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘동생’은 가족 관계를 가리키는 말로서 본문의 비교급 명사화 표현(‘더 어린 이’)보다 다소 덜 정확하며, 문맥상 자연스러운 ‘작은아들’이 더 적절합니다. βίον은 단순한 가사 활동보다 아버지의 생활 수단·재산을 가리키므로, ‘살림살이’는 유지하되 주석으로 그 범위를 밝혀야 합니다.
  naturalness: 초안의 문장은 이해하기 쉽지만, 바깥 겹낫표와 대화 인용이 중첩되어 한국어 성경 문장으로는 부자연스럽습니다. 합쇼체 서술과 한국어 인용 부호로 정리했습니다.
  terminology: ‘재산’, ‘몫’, ‘작은아들’, ‘살림살이’는 상속 문맥과 현대 표준어에 적합합니다. ‘살림살이’가 지닌 의미 폭은 주석으로 보완했습니다.
