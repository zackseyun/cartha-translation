- from: 「그 중 동생이 아버지에게 말하였다. 「아버지, 재산 중에서 제게 돌아올 몫을 제게 주십시오.」 그러자 아버지는 자기의 살림살이를 그들에게 나누어 주었다.」
  to: 그들 가운데 작은아들이 아버지께 말했습니다. “아버지, 재산 가운데 제게 돌아올 몫[a]을 주십시오.” 그러자 아버지는 자기의 살림살이[b]를 그들에게 나누어 주었습니다.
