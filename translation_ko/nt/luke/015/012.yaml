  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
  footnotes:
  - marker: a
    text: Or 'the portion of the property that belongs to me' or 'the share due me.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'his life/livelihood' (βίον), referring here to the father's property or means of living.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 작은아들이 아버지께 말했습니다. “아버지, 재산 가운데 제게 돌아올 몫[a]을 주십시오.” 그러자 아버지는 자기의 살림살이[b]를 그들에게 나누어 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제게 속한 재산의 몫” 또는 “제게 마땅히 돌아올 몫.”
    reason: τὸ ἐπιβάλλον μέρος는 당사자에게 돌아오거나 마땅히 주어질 몫을 가리킵니다.
  - marker: b
    text: 그리스어 βίον은 직역하면 “삶/생활”이며, 여기서는 아버지의 생활 수단, 곧 재산이나 자산을 가리킵니다.
    reason: βίος의 ‘생활 수단·재산’ 의미를 밝혀 ‘살림살이’의 의미 범위를 명확히 합니다.
