source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
  footnotes:
  - marker: a
    text: Greek 'against heaven' uses 'heaven' as a reverential way of referring to God; some translations render it interpretively as 'against God.'
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts continue the son's speech with words equivalent to 'Treat me as one of your hired servants,' harmonizing with v. 19; the SBLGNT text ends the sentence at 'your son.'
    reason: textual_variant
translation:
  language: ko
  text: 아들이 아버지에게 말했습니다. “아버지, 저는 하늘을 거슬러 아버지 앞에서 죄를 지었습니다.[a] 더 이상 아버지의 아들이라 불릴 자격이 없습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘’은 하나님을 완곡하게 가리키는 표현입니다. 일부 번역은 이를 해석하여 ‘하나님께’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 여기서 아들의 말을 이어 “저를 아버지의 품꾼 가운데 하나로 여겨 주십시오”라는 뜻의 구절을 덧붙입니다. 이는 19절과 조화된 독법이며, SBLGNT 본문은 ‘아버지의 아들’에서 문장을 끝냅니다.
    reason: textual_variant
