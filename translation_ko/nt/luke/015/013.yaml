source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
  footnotes:
  - marker: a
    text: Or 'after a few days.' The Greek expression is literally 'after not many days.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his estate' or 'his wealth' for 'his property.'
    reason: lexical_alternative
  - marker: c
    text: Or 'living wastefully' or 'in reckless living.' The text does not specify particular sins here, only a dissipated manner of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 「며칠이 지나지 않아[a], 둘째 아들은 모든 것을 모아서 먼 나라로 떠났습니다. 그리고 그곳에서 방탕하게[c] 살면서 자기 재산을[b] 탕진하였습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘며칠 후에’. 그리스어 표현은 직역하면 ‘많지 않은 날들 뒤에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘재산’은 ‘소유물’, ‘재물’ 또는 ‘유산’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘낭비하며’ 또는 ‘무절제하게’. 본문은 여기서 특정한 죄를 열거하지 않고, 삶의 방종하고 낭비적인 방식을 가리킵니다.
    reason: lexical_alternative
