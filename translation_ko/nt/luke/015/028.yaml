  naturalness: ‘하지 아니하였다’는 현대 표준어 합쇼체 본문에서는 다소 문어적·고풍스럽습니다. ‘화가 났고’, ‘들어가려 하지 않았습니다’, ‘나오셔서’가 자연스럽고 격식 있는 현대 표현입니다.
  terminology: ‘간곡히 권하셨습니다’는 여기서 παρακαλέω가 나타내는 아버지의 진지한 권면/호소를 자연스럽게 옮기며, 특정 교리적 해석을 더하지 않습니다.
