  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘-로라도’는 원문에 없는 양보·최소 기대의 뉘앙스를 더하며, κεράτια는 일반적인 ‘열매’보다 꼬투리임을 드러내는 편이 더 정확합니다. ἐπεθύμει와 ἐδίδου의 미완료 시제는 문맥상 지속된 갈망과 계속된 궁핍을 나타내므로 이를 자연스럽게 반영했습니다.
  naturalness: ‘배를 채우기를 간절히 원하였으나’는 이해되지만 현대 합쇼체에서는 ‘배를 채우고 싶어 했습니다’가 더 자연스럽습니다. ‘아무도 그에게 먹을 것을 주지 않았습니다’는 한국어에서 생략된 목적어를 자연스럽게 보완하면서 원문의 의미를 유지합니다.
  terminology: ‘돼지’는 χοῖροι의 현대 표준어 대응으로 적절합니다. κεράτια는 쥐엄나무의 꼬투리(캐롭 꼬투리)를 가리키므로 본문에서는 ‘쥐엄나무 꼬투리’로 옮기고, 필요 시 각주에서 캐롭을 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘쥐엄나무 열매로라도’
    rationale: ‘-로라도’는 ‘그것만이라도’라는 추가적 양보 뉘앙스를 넣습니다. 또한 κεράτια는 특히 쥐엄나무의 꼬투리를 가리키므로 ‘꼬투리’가 더 정확합니다.
  - severity: low
    issue: 문체 및 미완료 시제의 표현
    rationale: ‘주지 아니하였다’는 문어적이고, ‘원하였으나’는 지속적 갈망을 충분히 드러내지 못할 수 있습니다. 현대 합쇼체로 자연스럽게 다듬는 것이 좋습니다.
  revised_text: 그는 돼지들이 먹고 있는 쥐엄나무 꼬투리로 자기 배를 채우고 싶어 했지만, 아무도 그에게 먹을 것을 주지 않았습니다.
  revised_footnotes:
  - marker: a
    text: ‘쥐엄나무 꼬투리’는 캐롭나무의 꼬투리를 가리키며, 흔히 동물의 먹이로 쓰였습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 구체적 식물 용어와 지속되는 갈망·궁핍의 장면을 보존하되, 원문에 없는 ‘-로라도’의 양보 뉘앙스를 제거했습니다. 본문은 현대 표준어 합쇼체로 다듬었고, 캐롭이라는 식물의 정체는 각주로 보완했습니다.
