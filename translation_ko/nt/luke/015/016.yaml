  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘로라도’의 ‘라도’는 원문에 명시되지 않은 양보·강조를 더하며, 마지막 절의 계속된 무상 제공의 의미는 ‘아무것도’로 밝혀 주는 편이 더 정확합니다.
  naturalness: 초안의 ‘주지 아니하였다’는 현대 표준어 합쇼체 문체와 맞지 않습니다. ‘않았습니다’ 형태가 자연스럽고 요구된 격식체에 부합합니다.
  terminology: ‘쥐엄나무 열매’는 κεράτια(캐럽 꼬투리)를 가리키는 한국어 성경 전통의 이해 가능한 표현입니다. 별도 각주는 필수적이지 않습니다.
  issues:
  - severity: medium
    issue: 문체가 합쇼체가 아님
    rationale: ‘원하였으나, 주지 아니하였다’는 문어적 평서체이며, 지정된 현대 formal-polite 합쇼체에는 ‘원했으나/바랐으나, 주지 않았습니다’가 적합합니다.
  - severity: low
    issue: ‘로라도’가 원문보다 양보를 강화함
    rationale: ἀπὸ τῶν κερατίων은 쥐엄나무 열매로 배를 채우려 했다는 뜻이며, ‘라도’가 가진 ‘그것만이라도’의 추가 뉘앙스는 본문에 명시되지 않았습니다.
  - severity: low
    issue: 마지막 절의 목적어가 생략됨
    rationale: οὐδεὶς ἐδίδου αὐτῷ는 아무도 그에게 아무것도 주지 않는 지속적 상황을 뜻하므로, ‘아무것도’를 명시하면 의미가 더 분명합니다.
  revised_text: 그는 돼지들이 먹고 있는 쥐엄나무 열매로 배를 채우기를 몹시 바랐으나, 아무도 그에게 아무것도 주지 않았습니다.
