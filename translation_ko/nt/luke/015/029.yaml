source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
  footnotes:
  - marker: a
    text: Or “I have been serving you.” The Greek verb δουλεύω can mean “serve” or, in a stronger sense, “be enslaved / slave.” Here “slaving” reflects the elder son’s bitter tone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아버지에게 대답하여 말했습니다. “보십시오, 저는 이렇게 여러 해 동안 아버지를 섬겨[a] 왔고, 한 번도 아버지의 명령을 어긴 적이 없습니다. 그런데도 아버지께서는 제가 친구들과 함께 즐길 수 있도록 염소 새끼 한 마리도 제게 주신 적이 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 δουλεύω는 ‘섬기다’를 뜻하며, 더 강하게는 ‘종으로 섬기다’ 또는 ‘종노릇하다’를 뜻할 수도 있습니다. 여기서는 맏아들의 쓰라린 어조가 드러납니다.
    reason: lexical_alternative
