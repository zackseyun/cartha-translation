source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
  footnotes:
  - marker: a
    text: Or 'ate up your estate'; the Greek verb is vivid, literally 'devoured,' and the noun can mean means of living, property, or estate.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그런데 아버지의 이 아들이 창녀들과 함께 아버지의 재산[a]을 삼켜 버리고 왔을 때, 아버지께서는 그를 위해 살진 송아지를 잡으셨습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살림의 밑천’ 또는 ‘재산.’ 그리스어 βίος는 생계를 이루는 수단, 소유물, 또는 재산을 뜻할 수 있습니다.
    reason: βίος의 문맥상 의미를 ‘재산’으로 옮기되, 원어의 더 넓은 의미 범위를 보존합니다.
