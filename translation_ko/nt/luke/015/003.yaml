  source_fidelity: εἶπεν δὲ πρὸς αὐτοὺς τὴν παραβολὴν ταύτην λέγων의 핵심 요소를 충실히 반영합니다. ‘그러자’는 δέ의 가벼운 서사 연결을 자연스럽게 나타내며, ‘그들에게 이 비유를 말씀하셨습니다’는 πρὸς αὐτούς 및 τὴν παραβολὴν ταύτην을 정확히 옮깁니다. λέγων은 이어지는 비유의 직접 발화를 도입하는 기능으로, 한국어에서는 ‘말씀하셨습니다’ 뒤에 다음 절이 이어지는 구조로 자연스럽게 처리됩니다.
  naturalness: 표준 현대 한국어의 합쇼체로 자연스럽고, 성경 본문의 격식 있는 서술 문체에도 잘 맞습니다. ‘예수께서’는 앞 문맥의 지시 대상을 한국어에서 분명히 하는 적절한 보충입니다.
  terminology: ‘비유’는 παραβολή에 대한 정착된 적절한 번역입니다. ‘말씀하셨습니다’는 예수의 발화를 존중하는 문체로 자연스럽지만 원문의 의미를 과도하게 신학화하지 않습니다.
