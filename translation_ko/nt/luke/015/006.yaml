    issue: ‘말하리라’가 미래형으로 번역됨
    rationale: λέγων은 현재 주동사 συγκαλεῖ에 수반되는 현재분사이며, 이 문맥에서 미래의 발화를 뜻하지 않습니다.
  - severity: medium
    issue: ‘내가 잃었던 내 양’의 의미가 불명확함
    rationale: 원문 τὸ πρόβατόν μου τὸ ἀπολωλός는 ‘잃어버린 나의 양’으로, 양의 상실 상태를 가리킵니다. 초안은 화자가 양을 잃었다는 능동적 의미로 읽힐 수 있습니다.
