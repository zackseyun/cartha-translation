translation:
  language: ko
  text: 「내가 너희에게 말합니다. 이와 같이[a] 회개할 필요가 없는 의인[b] 아흔아홉 사람보다 회개하는 한 죄인으로 인해 하늘에서 더 큰 기쁨이 있을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러므로’, ‘그와 같이’. 이 표현은 앞선 비유의 요점과 하늘의 기쁨을 연결합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의인’은 문맥상 있는 그대로 이해할 수도 있고 반어적으로 이해할 수도 있습니다. 번역은 원문의 표현을 유지하며 해석을 확정하지 않습니다.
    reason: alternative_reading
