  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
  footnotes:
  - marker: a
    text: Or 'on the wing of the temple.' The Greek term refers to a projecting extremity or high point of the temple complex.
    reason: lexical_alternative
  - marker: b
    text: Greek ἱερόν refers to the temple complex, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: c
    text: Or 'Since you are the Son of God.' The Greek condition can be read that way, but here it is rendered 'If' to preserve the tempter's challenge.
    reason: alternative_reading
translation:
  language: ko
  text: 마귀가 그분을 예루살렘으로 이끌고 가서 성전의 꼭대기[a][b]에 세우고 그분께 말했습니다. 「당신이 하나님의 아들이라면[c], 여기서 아래로 뛰어내려 보시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전의 날개 부분에.’ 그리스어는 성전 건물이나 경내의 돌출된 끝부분 또는 높은 지점을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 히에론(ἱερόν)은 특히 안쪽 성소만이 아니라 성전 경내 전체를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘당신이 하나님의 아들이므로.’ 그리스어 조건절은 그렇게 이해될 수도 있으나, 여기서는 시험하는 자의 도전의 어조를 보존하여 ‘~이라면’으로 옮겼습니다.
    reason: alternative_reading
