  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
  footnotes:
  - marker: a
    text: Or 'were bearing witness to him.' The Greek expression can mean either that they spoke favorably of him or that they testified about him; in this context the favorable sense best fits the parallel 'were marveling.'
