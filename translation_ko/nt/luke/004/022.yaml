  source_fidelity: 초안은 ἐμαρτύρουν αὐτῷ를 '호의적으로 증언하며'로 옮겨 대체로 의미를 살렸으나, 한국어에서는 이 문맥의 지속적 호의·칭찬의 반응을 '좋게 말하며'로 옮기는 편이 더 자연스럽습니다. 또한 두 동사가 모두 미완료 과거이므로 '말하며 ... 놀랐고'보다 병렬적인 과거 진행 반응으로 표현하는 것이 좋습니다. '은혜의 말씀'은 τῆς χάριτος의 가능한 직역을 보존하며, '요셉의 아들이 아닌가?'도 긍정 답변을 기대하는 의문문의 힘을 잘 전달합니다.
  naturalness: '''그분에 대해 호의적으로 증언하며''는 현대 한국어에서 다소 법정·공적 진술처럼 들리고, ''말하며''와 ''놀랐고''의 시상 및 병렬도 매끄럽지 않습니다. ''모두가 그분을 좋게 말하고 ... 놀라워하였으며''가 표준어 성서 문체로 자연스럽고 원문의 두 반응을 균형 있게 나타냅니다.'
  terminology: 예수에 대한 존칭 '그분'과 '은혜의 말씀'은 합쇼체 성서 문맥에 적절합니다. 요셉의 아들이라는 군중의 발언은 해설이나 교리적 보충 없이 그대로 유지해야 합니다.
  issues:
  - severity: medium
    issue: '''호의적으로 증언하며''의 문체 및 어감'
    rationale: ἐμαρτύρουν αὐτῷ는 여기서 법정적 '증언'보다 예수에 대해 좋게 말하거나 칭찬하는 반응을 가리키는 것이 자연스럽습니다. '호의적으로 증언하다'는 한국어에서 부자연스럽고 다소 기술적입니다.
  - severity: low
    issue: 병렬된 미완료 과거의 표현
    rationale: ἐμαρτύρουν과 ἐθαύμαζον은 모두 미완료 과거입니다. 초안의 '말하며 ... 놀랐고'는 연결과 상이 비대칭적이므로 두 반응을 병렬로 옮기는 편이 좋습니다.
  revised_text: 모두가 그분을 좋게 말하고, 그분의 입에서 나오는 은혜의 말씀에 놀라워하였으며, “이 사람은 요셉의 아들이 아닌가?” 하고 말하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “그분에 대하여 증언하고.” 그리스어 표현은 그분에 대해 증언한다는 뜻도 될 수 있으나, 여기서는 이어지는 ‘놀라워하였다’와 함께 호의적으로 말하는 반응을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “은혜의 말씀”은 “호의나 매력을 지닌 말씀” 또는 “은혜로 특징지어진 말씀”으로 이해할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 의미와 군중의 발언을 유지하면서, ἐμαρτύρουν의 문맥상 호의적 의미를 자연스러운 현대 한국어로 조정했습니다. 두 미완료 과거 동사의 병렬도 반영했습니다. 영어 감사 기록의 두 어휘상 대안은 한국어 각주로 보존했습니다.
