  source_fidelity: 초안은 화자(ὁ διάβολος, ‘마귀’)를 누락했고, 인용문이 닫히지 않았습니다. 또한 παραδέδοται의 완료 수동(‘넘겨져 있다’)과 αὐτήν이 가리키는 여성 단수 ‘권세’를 명시하여 원문의 문법적 연결을 살렸습니다. 마귀의 발언을 그의 주장으로서 직접 옮기며 그 주장의 진위를 번역으로 판단하지 않았습니다.
  naturalness: ‘주겠소/때문이오’는 요청된 현대 표준 합쇼체와 맞지 않고 문체가 고풍스럽습니다. ‘주겠습니다/넘겨져 있으며/누구에게나 줍니다’로 현대적이고 일관된 합쇼체로 고쳤습니다.
  terminology: διάβολος는 유혹 이야기의 인격적 칭호로 ‘마귀’로 옮겼습니다. ἐξουσία는 통치 권한의 뜻을 살려 ‘권세’, δόξα는 ‘영광’으로 옮기고 문맥상 가능한 ‘영화’는 각주로 제시했습니다.
