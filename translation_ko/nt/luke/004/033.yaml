review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 ἔχων(‘지닌/가지고 있는’)은 해당 사람이 ‘부정한 귀신의 영’을 지니고 있음을 말합니다. 초안의 ‘사로잡힌’은 귀신에게 지배·점유되었다는 해석을 더하여 원문의 표현보다 강합니다. 또한 πνεῦμα와 δαιμόνιον의 두 요소를 모두 드러내는 것이 좋습니다.
  naturalness: ‘더러운 귀신의 영을 지닌 한 사람’은 현대 표준 한국어에서 다소 문어적이지만, 원문의 중첩된 표현을 보존하는 데 적절하며 합쇼체 서술과도 자연스럽게 연결됩니다.
  terminology: ἀκάθαρτος는 신약의 정형적 표현을 따라 ‘더러운’으로, πνεῦμα δαιμονίου는 두 명사를 보존하여 ‘귀신의 영’으로 옮겼습니다. ‘사로잡힌’과 같은 더 강한 소유/빙의 표현은 피했습니다.
  issues:
  - severity: medium
    issue: ‘사로잡힌’은 ἔχων보다 해석적으로 강합니다.
    rationale: ἔχων은 문자적으로 ‘가지고 있는/지닌’이라는 분사입니다. 본문은 귀신 들림의 맥락을 가리키지만, 번역에서 ‘사로잡힌’으로 확정하면 원문에 없는 지배·점유의 뉘앙스를 추가합니다.
  - severity: low
    issue: ‘부정한 귀신의 영’은 한국어에서 수식 관계가 다소 불분명하고 관용적 신약 용어와 거리가 있습니다.
    rationale: ‘더러운’은 ἀκάθαρτος의 일반적인 신약 번역어이며, ‘더러운 귀신의 영’은 원문의 영과 귀신이라는 두 요소를 유지합니다.
  revised_text: 회당에 더러운 귀신의 영을 지닌 한 사람이 있었는데, 그가 큰 소리로 외쳤습니다.
