- from: 「야훼[a]의 영이 내게 임하셨으니, 이는 그분께서 내게 기름을 부으셔서 가난한 자들에게 복음을 전하게 하시려는 것이며, 사로잡힌 자들에게 해방을, 눈먼 자들에게 다시 보게 됨을 선포하게 하시고, 짓밟힌 자들을 자유롭게 풀어 주시려는 것이며,
  to: 「주님의 영이 내게 임하셨습니다. 주님께서 가난한 이들에게 좋은 소식을 전하도록 내게 기름을 부으셨기 때문입니다. 주님께서는 나를 보내셔서 포로들에게 해방[a]을 선포하고 눈먼 이들에게 시력 회복을 선포하며, 짓밟힌 이들을 해방시켜 보내게 하셨습니다[b].
  rationale: 원문의 범위를 눅 4:18에 한정하고, 누락된 ‘나를 보내셨습니다’를 복원했습니다. κύριος는 ‘주님’으로, εὐαγγελίσασθαι는 ‘좋은 소식을 전하다’로 옮겼습니다. 두 차례의 ἄφεσις는 ‘해방’으로 통일하되 어휘적 대안은 각주에 보존했습니다. τεθραυσμένους ἐν ἀφέσει는 다소 관용적이고 압축된 표현이므로 ‘짓밟힌 이들을 해방시켜 보내게 하셨습니다’로 번역하여 ἀποστεῖλαι와 ἄφεσις를 모두 드러냈습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:15:14Z'
