  source_fidelity: 핵심 의미는 대체로 보존되었으나, ἐν τοῖς ὠσὶν ὑμῶν의 관용적 표현을 직역에 가깝게 처리한 ‘너희 귀에 들리는 가운데서’는 한국어로 부자연스럽고 의미 관계도 불명확합니다. 완료 수동 πεπλήρωται는 ‘성취되었습니다’로 옮겨 현재까지 효력이 있는 성취를 적절히 나타낼 수 있습니다.
  naturalness: ‘그분께서 그들에게 말씀하기 시작하셨습니다’는 자연스럽고 합쇼체에 맞습니다. 다만 인용문에서는 존대 호칭인 ‘그분’ 및 문체와 조응하도록 ‘너희’보다 ‘여러분’을 쓰고, ‘귀에 들리는 가운데서’를 ‘여러분이 듣는 가운데’로 고치는 것이 현대 표준 한국어에 자연스럽습니다.
