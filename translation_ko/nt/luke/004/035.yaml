review_pass:
  verdict: revise
  source_fidelity: 핵심 사건과 어순은 대체로 충실합니다. 다만 Φιμώθητι는 단순히 조용히 하라는 말보다 강한 ‘입을 다물라/잠잠하라’의 명령이므로 이를 반영하는 편이 좋습니다. 또한 ῥίψαν ... εἰς τὸ μέσον은 사람들을 명시하지 않고 ‘한가운데로 내던진 뒤’로 옮겨 원문의 명시성을 유지했습니다.
  naturalness: 서술은 현대 표준 한국어 합쇼체에 맞추고, 예수의 직접 명령은 자연스러운 명령형 ‘-라’로 처리했습니다. ‘그것을 꾸짖으며’는 한국어에서 지시 대상이 다소 불명확하고 동시 동작처럼 들릴 수 있어 ‘그 귀신을 꾸짖어’로 다듬었습니다.
  terminology: δαιμόνιον은 문맥과 원어에 따라 일관되게 ‘귀신’으로 옮겼습니다. ‘해도 입히지 않고’는 자연스럽지만, βλάψαν의 능동적 행위를 더 직접 반영하여 ‘아무런 해도 끼치지 않은 채’로 수정했습니다.
  issues:
  - severity: medium
    issue: ‘조용히 하고’가 Φιμώθητι의 강한 침묵 명령을 다소 약화합니다.
    rationale: φιμόω는 본래 재갈을 물리는 이미지를 지니며, 이 문맥에서는 단호하게 발언을 그치게 하는 명령입니다. ‘입을 다물고’가 자연스러우면서 그 힘을 더 잘 보존합니다.
  - severity: low
    issue: ‘그것을 꾸짖으며’는 지시 대상과 분사-본동사의 관계가 다소 모호합니다.
    rationale: 원문의 αὐτῷ는 앞 문맥의 귀신을 가리킵니다. 한국어에서는 ‘그 귀신을 꾸짖어 말씀하셨습니다’가 더 명료하고 자연스럽습니다.
  - severity: low
    issue: ‘사람들 한가운데’는 이 절에 명시되지 않은 대상을 보충합니다.
    rationale: εἰς τὸ μέσον은 ‘한가운데로’이며, 주변의 사람들이 문맥상 추정되더라도 번문에서는 명시하지 않는 편이 최적 등가에 더 적절합니다.
