translation:
  language: ko
  text: 예수께서 그 귀신을 꾸짖어 말씀하셨습니다. 「입을 다물고[a] 그에게서 나오라.」 그러자 귀신은 그 사람을 한가운데로 내던진 뒤, 그에게 아무런 해도 끼치지 않은 채[b] 그에게서 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
