revisions:
- from: 예수께서 그것을 꾸짖으며 말씀하셨습니다. 「조용히 하고 그에게서 나오라.」 그러자 귀신은 그 사람을 사람들 한가운데로 내던지고서, 그 사람에게 아무런 해도 입히지 않고 그에게서 나왔습니다.
  to: 예수께서 그 귀신을 꾸짖어 말씀하셨습니다. 「입을 다물고[a] 그에게서 나오라.」 그러자 귀신은 그 사람을 한가운데로 내던진 뒤, 그에게 아무런 해도 끼치지 않은 채[b] 그에게서 나왔습니다.
