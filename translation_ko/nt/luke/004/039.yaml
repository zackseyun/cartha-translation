  source_fidelity: 원문의 ἐπιστὰς ἐπάνω αὐτῆς는 그 여인 가까이에 서서 그 위쪽에 위치한 구체적 장면을 나타냅니다. 초안의 ‘그녀 위에 서서’는 한국어에서 실제로 몸 위에 올라선 듯한 부자연스럽고 오해 가능한 뜻이 될 수 있으므로, 문맥상 충실한 ‘그녀 곁에 서서’로 옮기는 것이 적절합니다. ‘열병을 꾸짖으셨고’ 및 열병이 떠났다는 표현은 원문의 의인화된 서술을 보존하며, 원인에 관한 해석을 덧붙이지 않습니다. ‘섬기기 시작했습니다’는 문맥상 즉각 이어지는 행동과 미완료 과거의 진행/시작 뉘앙스를 무리 없이 반영합니다.
  naturalness: ‘그녀 위에 서서’는 현대 표준 한국어에서 어색하고 공간 관계를 과도하게 문자적으로 이해하게 합니다. ‘그녀 곁에 서서’는 병상 장면에서 자연스럽고, 나머지 문장은 현대 합쇼체로 매끄럽습니다. ‘시중들다’도 가능하지만, ‘섬기다’가 διηκόνει의 넓은 봉사 의미를 더 중립적이고 자연스럽게 전달합니다.
  terminology: ‘열병’은 πυρετός에 대한 정착된 성경 용어이며 현대 독자에게도 이해 가능합니다. ‘꾸짖다’는 ἐπετίμησεν의 강한 권위적 표현을 보존합니다. ‘섬기다’는 여기서 교회 직분을 뜻하도록 한정하지 않고 일행을 돌보는 행동을 나타냅니다.
