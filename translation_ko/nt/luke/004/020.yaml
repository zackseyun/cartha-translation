    rationale: 이 문맥의 ὑπηρέτης는 두루마리를 취급하고 예배를 보조하는 회당의 담당자입니다. ‘회당 관리인’이 문맥상 기능을 더 정확하고 자연스럽게 전달합니다.
  - severity: low
