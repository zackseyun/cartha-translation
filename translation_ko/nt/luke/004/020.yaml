  source_fidelity: 원문의 분사 연쇄(두루마리를 말아 돌려주고)와 주동사(앉으셨습니다), 그리고 회당의 모든 이가 그분을 주목한 장면을 대체로 충실히 옮겼습니다. 다만 ὑπηρέτῃ는 이 문맥에서 개인적으로 ‘시중드는 자’라기보다 회당에서 두루마리를 관리·보조하는 직무자를 가리키므로 이를 더 정확히 반영하는 것이 좋습니다.
