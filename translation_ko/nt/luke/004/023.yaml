  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
  footnotes:
  - marker: a
    text: Or more literally, 'the things we heard happened to/in Capernaum.' The Greek uses εἰς ('to/into'), but the sense in context is locative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 그들에게 말씀하셨습니다. “너희는 분명히 내게 이 속담을 말할 것이다. ‘의사여, 네 자신을 고쳐라. 우리가 가버나움에서[a] 일어났다고 들은 모든 일을 여기 네 고향에서도 하라.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘가버나움으로/안으로’입니다. 헬라어 εἰς(‘~으로’)가 쓰였으나, 문맥에서는 가버나움에서 일어난 일을 가리키는 처소적 의미로 이해됩니다.
    reason: lexical_alternative
