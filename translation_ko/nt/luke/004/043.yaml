  source_fidelity: ‘동네들’은 πόλεις(도시들)보다 범위가 넓고, ‘하나님의 나라를 전해야 한다’는 εὐαγγελίσασθαι의 ‘좋은 소식을 전하다’라는 어휘적 의미를 충분히 드러내지 못합니다. ‘다른 도시들에도 하나님의 나라의 복음을 전해야 합니다’는 원문의 첨가(καί), 복수, 복음 선포, δεῖ의 필연성을 보존합니다. ‘바로’ 같은 강조는 ἐπὶ τοῦτο에 가능한 뉘앙스이나 필수는 아니므로 넣지 않았습니다.
  naturalness: ‘그러나 그는 그들에게 말씀하셨습니다’와 직접화법의 합쇼체 ‘전해야 합니다/받았기 때문입니다’는 현대 표준어 문체에 자연스럽습니다. ‘도시들’은 이 문맥에서 ‘동네들’보다 정확하고 자연스럽습니다.
  terminology: ‘하나님의 나라’는 τὴν βασιλείαν τοῦ θεοῦ의 널리 이해되는 표준 번역입니다. ‘복음을 전하다’는 εὐαγγελίζω의 선포 의미를 드러내며, 후대 교리 내용을 덧붙이지 않습니다. ἀπεστάλην은 ‘보내심을 받다’로 수동적 파송을 유지합니다.
