    rationale: αὐτούς의 선행 대상은 문맥에 맡겨져 있고, 이 절에는 별도의 장소 부사가 없습니다. 불필요한 첨가 없이 번역하는 편이 최적 등가에 맞습니다.
  - severity: medium
    issue: ‘가르치셨습니다’가 진행·지속 표현을 약화합니다.
    rationale: ἦν διδάσκων은 미완료 동사와 현재분사의 결합이므로 ‘가르치고 계셨습니다’가 그 지속성을 더 잘 반영합니다.
  - severity: low
    issue: πόλιν을 ‘동네’로 옮겼습니다.
    rationale: ‘동네’도 문맥상 가능하지만, πόλις의 일반적 의미와 격식 있는 성서 문체에는 ‘도시’가 더 적절합니다.
