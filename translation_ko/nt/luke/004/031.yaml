  terminology: ‘가버나움’은 한국어 개신교 성서 전통에서 널리 쓰이는 지명 표기이며, ‘안식일’도 적절합니다. ‘안식일마다’는 원문의 복수형이 나타내는 반복적 ಸಂದರ್ಭ을 자연스럽게 보존합니다.
  issues:
