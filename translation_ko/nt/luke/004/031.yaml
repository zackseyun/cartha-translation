  source_fidelity: 초안은 카φαρναούμ으로 ‘내려가다’와 복수 안식일의 반복성을 대체로 반영합니다. 그러나 ‘그곳에서’는 원문에 없는 장소 지시를 더하며, ‘가르치셨습니다’는 ἦν διδάσκων의 진행·지속 표현을 충분히 드러내지 못합니다. 또한 πόλις는 ‘동네’보다 ‘도시’가 더 가깝습니다.
