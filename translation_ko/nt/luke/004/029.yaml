review_pass:
  verdict: revise
  source_fidelity: ‘끌고 가서’는 ἤγαγον(데리고 가다/이끌다)보다 강한 ‘질질 끌다’의 뉘앙스를 더합니다. 또한 ‘벼랑’은 ὀφρύς(산의 눈썹·끝·가장자리)가 직접 명시하는 것보다 지형을 구체화합니다. 목적을 나타내는 ὥστε + 부정사는 ‘…하려고’로 자연스럽게 살릴 수 있습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 반복되는 대명사는 원문의 목적어 반복과 폭력적 행위의 초점을 유지합니다.
  terminology: ‘마을’은 πόλις의 문맥상 적절한 번역입니다. ‘내쫓고’는 ἐξέβαλον의 강제성을, ‘데리고 가서’는 ἤγαγον의 중립적 기본 의미를 보존합니다. ‘산의 끝자락’은 ὀφρύς의 가장자리 의미를 과도한 ‘벼랑’ 지형으로 한정하지 않고 전달합니다.
  issues:
  - severity: medium
    issue: ‘끌고 가서’가 ἤγαγον보다 폭력의 방식을 구체화합니다.
    rationale: 문맥은 적대적이지만, ἄγω 자체는 ‘이끌다/데리고 가다’이며 질질 끄는 행위를 명시하지 않습니다.
  - severity: medium
    issue: ‘산의 벼랑까지’가 ὀφρύς의 지형을 ‘벼랑’으로 확정합니다.
    rationale: ὀφρύς는 산이나 높이의 눈썹, 가장자리, 끝을 뜻합니다. 아래로 떨어뜨리려는 의도는 κατακρημνίσαι가 충분히 전달하므로, 본문에서 절벽을 덧붙일 필요는 없습니다.
