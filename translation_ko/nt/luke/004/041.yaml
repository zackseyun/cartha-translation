  to: 많은 사람들에게서 귀신들도 나와 외치며, “당신은 하나님의 아들이십니다!”라고 말했습니다. 그러나 그분은 귀신들을 꾸짖으시며, 귀신들이 그분이 메시아이심을 알았기 때문에 말하는 것을 허락하지 않으셨습니다.
