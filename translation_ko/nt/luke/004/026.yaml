  to: 그러나 엘리야가 그들 가운데 어느 누구에게도 보내심을 받은 것은 아니었습니다. 오직 시돈의 사렙다에 있는 한 과부에게만 보내심을 받았습니다.
  rationale: 원문의 οὐδεμίαν … εἰ μὴ가 이루는 배타적 대조를 한국어의 ‘어느 누구에게도 … 아니었습니다. 오직 …에게만’으로 재현했습니다. 수동태를 유지하여 암시된 발신자를 본문에 추가하지 않았고, 지명은 한국어 성서에서 널리 쓰이는 ‘사렙다’로 통일했습니다. 기존 각주는 본문의 이해나 원문상 불확실성 해소에 필요하지 않아 삭제했습니다.
