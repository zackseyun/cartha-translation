  terminology: Ἠλίας는 ‘엘리야’, Σάρεπτα는 한국어 성서 지명 용례에 맞추어 ‘사렙다’로 표기했습니다. γυναῖκα χήραν은 한국어에서 자연스러운 ‘한 과부’로 옮겼습니다. 원문이 발신자를 명시하지 않으므로 ‘하나님’ 등을 보충하지 않았습니다.
