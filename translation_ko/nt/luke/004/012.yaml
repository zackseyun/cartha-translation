  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
  footnotes:
  - marker: a
    text: Traditional English often has “It is written.” The Greek here literally says “It is said.”
    reason: alternative_reading
  - marker: b
    text: This quotes Deuteronomy 6:16, where the Hebrew has the divine name YHWH, often rendered “the LORD.”
    reason: cross_reference
translation:
  language: ko
  text: 예수님께서 그에게 대답하셨습니다. “이렇게 말씀되어 있습니다[a]. ‘너는 주[b] 너의 하나님을 시험하지 말라.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적인 번역에는 “기록되어 있다”가 흔합니다. 여기서 그리스어는 문자적으로 “말씀되어 있다” 또는 “말해져 있다”라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 이는 신명기 6:16을 인용한 것입니다. 그 히브리어 본문에는 신적 이름 YHWH가 있으며, 흔히 “여호와” 또는 “주”로 옮깁니다.
    reason: cross_reference
