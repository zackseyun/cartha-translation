review_pass:
  verdict: revise
  source_fidelity: 원문의 αὐτῷ(문맥상 마귀를 가리킴)를 본문에 반영하고, Εἴρηται의 완료 수동 인용 공식을 ‘기록되어 있다’로 바꾸지 않고 ‘말씀하신 바 있다’로 옮겼습니다. κύριον τὸν θεόν σου는 그리스어를 따라 ‘주, 네 하나님’으로 번역했습니다.
  naturalness: 초안의 ‘일컬어졌느니라’는 원문의 인용 공식과 맞지 않고 현대 표준 한국어 합쇼체에도 어울리지 않습니다. 수정문은 현대적인 존대 서술과 자연스러운 인용 구조를 사용합니다.
  terminology: κύριος는 ‘주’로, θεός는 ‘하나님’으로 유지했습니다. 신명기 원문의 YHWH는 본문이 아니라 교차참조 각주에서 설명하여 그리스어 본문과 히브리어 배경을 모두 구분했습니다.
  issues:
  - severity: high
    issue: αὐτῷ가 누락됨
    rationale: 그리스어 본문은 예수께서 ‘그에게’ 대답하셨다고 명시하며, 문맥상 그 대상은 마귀입니다.
  - severity: high
    issue: ‘일컬어졌느니라’가 Εἴρηται를 부정확하고 고어적으로 처리함
    rationale: Εἴρηται는 ‘말해져/말씀하신 바 있다’라는 성경 인용 공식이며, ‘일컬어지다’는 명명되거나 불리는 뜻이 강합니다. ‘-느니라’도 요청된 현대 합쇼체와 맞지 않습니다.
  - severity: medium
    issue: ‘야훼’가 그리스어 κύριος의 본문상 대응을 대체함
    rationale: 인용의 히브리어 배경에는 YHWH가 있으나, 현 그리스어 본문은 κύριος입니다. 본문은 ‘주’로 옮기고 YHWH는 각주에서 설명하는 것이 원문 우선 원칙에 맞습니다.
  revised_text: 예수께서 그에게 대답하여 말씀하셨습니다. “이렇게 말씀하신 바 있습니다. ‘너는 주, 네 하나님을 시험하지 말라.’”
  revised_footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘말해져 있다’라는 뜻의 성경 인용 공식입니다. 전통적인 번역에는 ‘기록되어 있다’가 흔합니다.
    reason: alternative_reading
  - marker: b
    text: 이는 신명기 6:16을 인용한 것입니다. 그 히브리어 본문에는 하나님의 이름 YHWH가 있으며, 흔히 ‘여호와’로 옮깁니다.
    reason: cross_reference
  revision_rationale: 누락된 간접목적어를 보완하고, 고어적이며 의미가 다른 표현을 현대 합쇼체의 성경 인용 공식으로 고쳤습니다. 또한 그리스어 κύριος를 본문에서 ‘주’로 유지하고, 신명기 히브리어 본문의 YHWH는 교차참조 각주로 처리했습니다.
