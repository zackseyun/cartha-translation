review_pass:
  verdict: revise
  source_fidelity: 개정안은 αὐτῷ를 ‘그에게’로 반영하고, εἴρηται의 비인칭 완료 수동 표현을 ‘이렇게 말씀되어 있습니다’로 옮겨 ‘기록되어 있다’라는 전통적 관용구를 본문에 강제하지 않았습니다. ἐκπειράσεις는 ‘시험하지 말라’로 충실히 반영했습니다.
  naturalness: 초안의 ‘일컬어졌느니라’는 현대 표준 한국어 합쇼체에서 매우 부자연스럽고, 문장 안의 겹따옴표도 읽기 어렵습니다. 개정안은 현대적이면서도 성경 인용의 격식을 유지합니다.
  terminology: 그리스어 κύριον에 따라 본문은 ‘주’로 유지합니다. ‘야훼’는 이 구절의 그리스어 본문에 없는 번역 선택이므로 본문에서 제거하고, 신명기 히브리어 본문의 YHWH는 각주에서만 설명합니다. ‘예수님’과 ‘하나님’은 한국어 성경 문맥에서 자연스러운 존칭 및 신명 표기입니다.
  issues:
  - severity: high
    issue: αὐτῷ의 번역이 누락되었습니다.
    rationale: 예수께서 대답하신 상대방을 가리키는 여격 대명사가 원문에 있으므로 ‘그에게’를 반영해야 합니다.
  - severity: high
    issue: εἴρηται가 ‘일컬어졌느니라’로 부정확하고 비자연스럽게 번역되었습니다.
    rationale: εἴρηται는 성경 인용 공식에서 ‘말씀되어 있다/말해져 있다’라는 비인칭 완료 수동입니다. ‘일컬어졌느니라’는 의미와 현대적 문체 모두에 맞지 않습니다.
  - severity: medium
    issue: 본문의 ‘야훼’는 그리스어 κύριον에 대한 직접 번역이 아닙니다.
    rationale: 인용의 히브리어 배경에는 YHWH가 있으나, 누가복음의 그리스어 본문은 κύριον입니다. 본문은 ‘주’로 번역하고 히브리어 배경은 각주로 처리하는 것이 원문 우선 원칙에 맞습니다.
  - severity: low
    issue: 인용부호가 중첩되어 있습니다.
    rationale: 직접 발화와 그 안의 성경 인용을 한국어식 큰따옴표와 작은따옴표로 구분하면 구조가 명확해집니다.
  revised_text: 예수님께서 그에게 대답하셨습니다. “이렇게 말씀되어 있습니다[a]. ‘너는 주[b] 너의 하나님을 시험하지 말라.’”
  revised_footnotes:
