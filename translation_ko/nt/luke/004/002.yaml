translation:
  language: ko
  text: 사십 일 동안 마귀에게 유혹을 받으셨습니다[a]. 그리고 그 날들 동안 아무것도 잡수시지 않으셨으며, 그 날들이 끝났을 때 배고프셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시험을 받으셨습니다.’ 그리스어 동사는 ‘유혹하다’ 또는 ‘시험하다’라는 뜻을 지닐 수 있습니다. 여기서는 행위자가 마귀이므로 ‘유혹을 받으셨습니다’가 문맥에 더 잘 맞습니다.
    reason: πειραζόμενος의 가능한 어휘적 대안을 보존하면서, 마귀가 행위자라는 문맥에 따른 선택을 밝힙니다.
