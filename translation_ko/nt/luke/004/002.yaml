    rationale: SBLGNT 본문은 ‘사십 일 동안’으로 시작하며 장소 부사를 포함하지 않습니다. 앞 절의 맥락을 본문에 보충하지 않는 편이 최적 등가 원칙에 맞습니다.
  - severity: high
    issue: ‘잡수시지 않았으므로’가 인과관계를 추가함
    rationale: καὶ는 단순한 접속이며, 예수께서 먹지 않으신 사실을 이후의 배고픔의 원인으로 문법적으로 명시하지 않습니다. 한국어 ‘-므로’는 원문보다 강한 인과를 부가합니다.
  - severity: medium
    issue: πειραζόμενος의 번역 및 대안 의미 미표시
    rationale: 마귀가 행위자이므로 ‘유혹을 받다’가 문맥상 적합하지만, 동사는 ‘시험하다/시험받다’의 의미도 지닙니다. 각주로 대안을 보존하는 것이 좋습니다.
