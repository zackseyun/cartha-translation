  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
  footnotes:
  - marker: a
    text: Or 'being tested.' The Greek verb can mean either 'tempt' or 'test,' though 'tempted' best fits the context here because the agent is the devil.
