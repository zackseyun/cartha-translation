  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
  footnotes:
  - marker: a
    text: Or 'they appealed to him for her.' The Greek wording is literally 'they asked him concerning/about her,' and in context likely implies a request for help.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서는 회당을 떠나 시몬의 집에 들어가셨습니다. 시몬의 장모는 심한 열병을 앓고 있었고, 사람들이 그 여자를 두고[a] 예수님께 여쭈었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자를 위하여 예수님께 청하였습니다.’ 그리스어는 직역하면 ‘그 여자에 관하여 그분께 물었습니다’라는 뜻이며, 문맥상 도움을 청한 의미를 시사할 수 있습니다.
    reason: lexical_alternative
