  source_fidelity: 초안의 ‘회당에서 일어나’는 ἀπὸ τῆς συναγωγῆς(회당에서/로부터 떠나)의 이동 의미를 ‘회당 안에서 일어나다’로 오해하게 할 수 있습니다. 또한 ‘그 여인을 위하여 ... 청하였습니다’는 문맥상 가능한 해석이지만, ἠρώτησαν αὐτὸν περὶ αὐτῆς의 절제된 ‘그 여자에 관하여 그에게 물었다’보다 한 단계 더 명시적입니다.
