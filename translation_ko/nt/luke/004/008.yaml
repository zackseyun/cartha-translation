review_pass:
  verdict: revise
  source_fidelity: ‘야훼’는 현재 그리스어 본문의 κύριον(및 영어 POB의 ‘Lord’)을 넘어 히브리어 신명을 본문에 도입합니다. κύριον은 ‘주’로 옮기는 것이 본문 및 프로젝트 용어 원칙에 맞습니다. 또한 ‘기록되었느니라’는 현대 합쇼체 문체에 비해 고어적입니다.
  naturalness: ‘예수께서 그에게 대답하셨습니다’는 자연스럽지만, 인용 도입부를 포함해 ‘예수님께서 그에게 대답하여 말씀하셨습니다’와 ‘기록되어 있다’가 현대의 격식 있는 성경 문체에 더 잘 맞습니다. 인용문의 ‘섬겨라’는 직접 명령으로 가능하나, 성경 인용의 규범적 진술을 자연스럽게 나타내는 ‘섬겨야 한다’가 적절합니다.
  terminology: κύριος는 ‘주’로, θεός는 ‘하나님’으로 옮깁니다. προσκυνέω는 ‘경배하다’, λατρεύω는 ‘섬기다’로 번역하여 예배와 하나님께 드리는 배타적 섬김의 의미를 유지합니다. 기존 각주는 누가복음의 그리스어 표현이 신명기의 히브리어를 ‘그대로 반영한다’고 단정하므로, 신명기 6:13을 반영한 인용이라는 중립적 설명으로 고칩니다.
  issues:
  - severity: medium
    issue: 본문의 ‘야훼’
    rationale: SBLGNT는 κύριον을 읽으며, 본문 번역에 히브리어 신명 YHWH를 직접 도입하지 않아야 합니다. 프로젝트의 NT 용어 원칙 및 영어 감사 기록도 ‘Lord’를 채택합니다.
  - severity: medium
    issue: 각주의 ‘그대로 반영한다’는 단정
    rationale: 누가복음의 인용은 신명기 6:13을 반영하지만, 표현과 구성에 차이가 있으므로 ‘그대로’라는 설명은 본문 관계를 과도하게 단정합니다.
  - severity: low
    issue: ‘기록되었느니라’의 문체
    rationale: 현대 표준어 합쇼체 번역에는 ‘기록되어 있다’가 더 자연스럽고 정형적인 인용 공식입니다.
