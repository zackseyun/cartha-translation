  rationale: 그리스어 본문을 따라 κύριον을 ‘주’로 번역하고, 현대 합쇼체에 맞게 인용 도입부를 다듬었습니다. ‘오직 그분만’은 αὐτῷ μόνῳ의 배타성을 보존합니다. 각주는 신명기와의 관계를 알리되, 히브리어 신명을 본문에 도입하거나 양 본문이 완전히 동일하다고 단정하지 않도록 수정했습니다.
