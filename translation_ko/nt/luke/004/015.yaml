  terminology: ‘회당’ is the standard term for συναγωγή. ‘영광을 받으셨습니다’ preserves the lexical glory connection of δοξαζόμενος, while a footnote is needed to make its contextually plausible senses of praise and honor visible and to avoid suggesting a more specific theological sense than the sentence itself requires.
