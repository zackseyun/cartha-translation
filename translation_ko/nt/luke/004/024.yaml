  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
  footnotes:
  - marker: a
    text: Or “in his native place” or “in his homeland.” The Greek πατρίς can refer to one’s hometown, home region, or homeland; here “hometown” fits the Nazareth setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 말씀하셨습니다. 「내가 진실로 너희에게 말합니다. 어떤 예언자도 자기 고향[a]에서는 환영받지 못합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고향 땅”, “고향 지역”, “조국”. 그리스어 πατρίς는 사람의 고향 마을, 고향 지역, 또는 조국을 가리킬 수 있습니다. 여기서는 나사렛이라는 문맥에 따라 “고향”으로 옮겼습니다.
    reason: lexical_alternative
