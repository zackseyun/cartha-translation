  to: 그러나 그들은 모두 한결같이 핑계를 대며 사양하기 시작했습니다. 첫째 사람이 그에게 말했습니다. “제가 밭을 샀는데, 나가서 그것을 보아야 합니다. 청하오니 저를 사양한 것으로 여겨 주십시오.”
