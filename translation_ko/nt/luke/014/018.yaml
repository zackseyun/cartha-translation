  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
  footnotes:
  - marker: a
    text: Or “began to make excuses.” The Greek verb can denote declining an invitation by offering an excuse.
    reason: lexical_alternative
  - marker: b
    text: Literally “from one,” an idiom meaning “all together” or “with one accord.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 모두 한결같이 핑계를 대며 사양하기 시작했습니다. 첫째 사람이 그에게 말했습니다. “제가 밭을 샀는데, 나가서 그것을 보아야 합니다. 청하오니 저를 사양한 것으로 여겨 주십시오.”
  philosophy: optimal-equivalence
