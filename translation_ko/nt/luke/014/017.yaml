  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δείπνου는 본문 자체에서 반드시 ‘잔치’라고 할 필요는 없으므로 ‘저녁 식사’가 더 직접적입니다. ἕτοιμά ἐστιν의 집합적 중성 복수 표현은 ‘모든 것이 준비되었습니다’로 자연스럽게 옮길 수 있으나, 그 주어는 헬라어에서 명시되지 않았습니다.
  naturalness: 초안의 ‘이르되’와 인용문 뒤의 ‘하였다’는 현대 표준어 합쇼체 문체에 맞지 않으며, 겹낫표 처리도 부자연스럽습니다. ‘말하게 하셨습니다’와 현대식 인용부호를 사용하면 자연스럽습니다.
  terminology: δοῦλον은 이 비유의 가정 내 전달자 문맥에서 ‘종’으로 옮길 수 있습니다. τοῖς κεκλημένοις의 완료 수동 의미는 ‘초청받은 사람들’로 보존했습니다.
