  to: 저녁 식사 시간에 그는 자기 종을 보내어 초청받은 사람들에게 “오십시오. 이미 모든 것이 준비되었습니다[a].”라고 말하게 하셨습니다.
  rationale: 식사의 명칭을 원문의 기본 의미에 가깝게 조정하고, 현대 합쇼체 서술 및 인용 형식으로 고쳤습니다. ‘모든 것’은 헬라어의 암시된 집합적 주어를 자연스럽게 드러내되, 각주에서 주어가 명시되지 않은 점을 보존했습니다.
