  terminology: τόπος는 연회 맥락에서 ‘자리’로, αἰσχύνη는 ‘부끄러움’으로 옮기는 것이 적절합니다. τὸν ἔσχατον τόπον의 ‘끝자리’는 문맥상 가장 낮은 영예의 자리를 함축하므로 대안 의미를 각주로 제시합니다.
