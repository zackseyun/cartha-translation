source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
  footnotes:
  - marker: a
    text: Or 'the lowest place.' The Greek expression τὸν ἔσχατον τόπον can denote the last position in order, and in this banquet setting therefore the lowest seat of honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너와 그 사람을 초대한 사람이 와서 너에게 말할 것입니다. ‘이 사람에게 자리를 내주십시오.’ 그러면 너는 부끄러워하며 끝자리[a]를 차지하기 시작할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 낮은 자리.’ 그리스어 τὸν ἔσχατον τόπον은 순서상 마지막 자리를 뜻할 수 있으며, 이 연회 장면에서는 가장 낮은 영예의 자리를 가리킬 수도 있습니다.
    reason: lexical_alternative
