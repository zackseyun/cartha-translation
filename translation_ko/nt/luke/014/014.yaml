- from: 「그러면 네가 복이 있을 것이니, 그들이 너에게 갚을 수 없기 때문이다. 의인들의 부활 때에 네가 갚음을 받을 것이다.」
  to: 「또한 복을 받을 것입니다. 그들이 갚을 수 없기 때문입니다. 의인들의 부활 때에 보답을 받을 것입니다.」
  rationale: The revision regularizes the required 합쇼체, replaces an awkward Korean passive expression with an idiomatic equivalent, and renders the opening connective less interpretively. It preserves the source's causal logic, the inability of the recipients to repay, and the unresolved scope of the resurrection of the righteous.
