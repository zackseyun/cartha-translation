review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the causal statement that the invitees cannot repay the addressee and the future recompense at the resurrection of the righteous. However, its initial "그러면" makes the conjunction more explicitly inferential than καί, and "갚음을 받을" is an unnatural nominalized passive in modern Korean. The revision keeps the temporal and theological scope of "ἐν τῇ ἀναστάσει τῶν δικαίων" without specifying a broader resurrection scheme.
  naturalness: 'The draft does not consistently use the requested modern formal-polite register: "있을 것이니," "때에," and "것이다" produce a mixed, elevated/literary declarative style rather than 합쇼체. The revised wording uses clear modern formal-polite endings and idiomatic Korean.'
  terminology: '"복을 받을 것입니다" is a natural Korean rendering of being blessed in this future context. "보답을 받을 것입니다" naturally conveys the future passive ἀνταποδοθήσεται and retains the recompense sense, while avoiding the awkward expression "갚음을 받을." "의인들의 부활" preserves the genitive association without doctrinal expansion.'
  issues:
  - severity: medium
    issue: Register is inconsistent with the required modern formal-polite (합쇼체) variant.
    rationale: The draft ends with "것이다" and uses "것이니," rather than formal-polite endings.
  - severity: medium
    issue: '"갚음을 받을 것이다" is unnatural in contemporary Korean.'
    rationale: Although grammatically analyzable, this nominalized construction is stilted. "보답을 받을 것입니다" is idiomatic and accurately conveys future recompense.
  - severity: low
    issue: '"그러면" is more inferential than the source conjunction καί.'
    rationale: The surrounding discourse permits an inferential connection, but "또한" more closely preserves the additive connective without materially altering the flow.
  revised_text: 「또한 복을 받을 것입니다. 그들이 갚을 수 없기 때문입니다. 의인들의 부활 때에 보답을 받을 것입니다.」
  revised_footnotes: []
  revision_rationale: The revision regularizes the required 합쇼체, replaces an awkward Korean passive expression with an idiomatic equivalent, and renders the opening connective less interpretively. It preserves the source's causal logic, the inability of the recipients to repay, and the unresolved scope of the resurrection of the righteous.
