review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the adversative force of ἀλλ’ and the four-member list. However, -거든 does not clearly express the indefinite/iterative force of ὅταν in the requested modern formal-polite register, and the imperative 청하라 is 해라체 rather than 합쇼체. “몸 불편한 자들” is an overly euphemistic and imprecise rendering of ἀναπείρους.
  naturalness: Use contemporary person-centered expressions and the formal-polite imperative. “잔치를 베푸실 때에는 … 초대하십시오” is natural and clearly conveys an occasion of hosting a banquet.
  terminology: “신체 장애가 있는 사람들” preserves the physical-impairment reference of ἀναπείρους without using the dated and potentially stigmatizing “불구자/병신.” “다리를 저는 사람들” retains the distinct, specific walking impairment denoted by χωλούς; “보지 못하는 사람들” is modern neutral Korean for τυφλούς.
  issues:
  - severity: medium
    issue: Register mismatch in “청하라.”
    rationale: The assigned target is modern formal-polite 합쇼체. The imperative should be rendered as “초대하십시오.”
  - severity: medium
    issue: “몸 불편한 자들” is euphemistic and semantically broad.
    rationale: ἀναπείρους refers to persons with physical impairment/maiming. “신체 장애가 있는 사람들” is clearer and more source-specific while retaining a respectful modern register.
  - severity: low
    issue: “잔치를 베풀거든” only weakly represents ὅταν.
    rationale: “잔치를 베푸실 때에는” more naturally conveys the indefinite temporal instruction in formal Korean.
  - severity: low
    issue: “자들” and “맹인” are less suitable for the requested contemporary respectful style.
    rationale: “사람들” and “보지 못하는 사람들” are modern, neutral expressions and preserve the source list.
  revised_text: 「그러나 잔치를 베푸실 때에는 가난한 사람들, 신체 장애가 있는 사람들[a], 다리를 저는 사람들, 보지 못하는 사람들을 초대하십시오.」
