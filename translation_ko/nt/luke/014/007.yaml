  terminology: παραβολή는 복음서의 통상 용례에 따라 ‘비유’로, πρωτοκλισίας는 식사의 명예로운 상석이라는 뜻을 살려 ‘윗자리’로 옮겼습니다. 별도 각주는 필수적이지 않습니다.
