  source_fidelity: 개정안은 κληθῇς를 연회 문맥의 ‘초대를 받으시면’으로, ἔσχατον τόπον을 사회적 서열상 ‘가장 낮은 자리’로, δόξα를 공개적 평가의 ‘영예’로 옮깁니다. ἀνάπεσε의 식사 중 기대어 눕는 뉘앙스는 본문의 자연스러운 ‘앉으십시오’와 각주로 보존했습니다. προσανάβηθι ἀνώτερον도 더 높은 자리로 옮기라는 뜻을 유지합니다.
  naturalness: 초안의 ‘너를/너에게’와 ‘앉으라’는 현대 합쇼체 문맥에서 일관되지 않습니다. 개정안은 존대 종결을 일관되게 사용하고, 한국어에서 불필요한 2인칭 대명사를 생략하여 자연스럽게 했습니다. 인용 부호도 바깥 인용을 제거하고 발화 인용만 사용해 구조를 정리했습니다.
  terminology: ‘친구여’는 Φίλε의 정중한 호칭을 과도하게 해석하지 않고 유지합니다. ‘영예’는 이 식사 자리의 사회적 명예를 가리키며 신적 ‘영광’으로 오해될 가능성을 줄입니다.
