revisions:
- from: 「오히려 초대를 받거든 가서 끝자리에 앉으라. 그러면 너를 초대한 자가 와서 「벗이여, 윗자리로 올라오시오」 할 것이다. 그때에 너와 함께 앉은 모든 사람 앞에서 너에게 영광이 있으리라.」
  to: 그러나 초대를 받으시면 가서 가장 낮은 자리에 앉으십시오[a]. 그러면 초대한 사람이 와서 ‘친구여, 더 높은 자리로 올라가십시오[b]’라고 말할 것입니다. 그때에 함께 식탁에 앉아 있는 모든 사람 앞에서 영예를 얻게 될 것입니다.
  rationale: 지정된 현대 합쇼체에 맞추어 문체를 통일하고, 연회 비유의 좌석 서열과 공개적 명예라는 원문의 의미를 자연스러운 한국어로 반영했습니다. 원문의 식사 관습과 ‘더 높은 곳으로 올라오라’는 표현의 대안은 각주 앵커를 올바른 해당 표현에 붙여 보존했습니다.
