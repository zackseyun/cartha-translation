source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
  footnotes:
  - marker: a
    text: Or 'sit down in the lowest seat.' The Greek verb refers specifically to reclining at a meal.
    reason: lexical_alternative
  - marker: b
    text: Or 'come up higher.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 초대를 받으시면 가서 가장 낮은 자리에 앉으십시오[a]. 그러면 초대한 사람이 와서 ‘친구여, 더 높은 자리로 올라가십시오[b]’라고 말할 것입니다. 그때에 함께 식탁에 앉아 있는 모든 사람 앞에서 영예를 얻게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 낮은 자리에 기대어 앉으십시오.’ 그리스어 동사는 식사 자리에서 기대어 앉는 것을 특별히 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 높은 곳으로 올라오십시오.’
    reason: lexical_alternative
