review_pass:
  verdict: revise
  source_fidelity: 화자의 주어를 ‘예수께서’로 밝힌 것은 문맥에 맞고, Ἄνθρωπός τις, δεῖπνον μέγα, καὶ ἐκάλεσεν πολλούς도 각각 ‘어떤 사람’, ‘큰 잔치’, ‘많은 사람을 초청’으로 충실히 옮겼습니다. 다만 ἐποίει는 미완료 과거이므로 단순 완료를 암시할 수 있는 ‘베풀고’보다 진행 중인 마련 행위를 드러내는 표현이 더 적절합니다.
  naturalness: ‘이르셨습니다’와 직접 인용의 합쇼체는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. ‘마련하고 있었고’는 두 동사의 상(진행 중인 마련, 완료된 초청)을 자연스럽게 구별합니다.
  terminology: ‘큰 잔치’는 δεῖπνον μέγα가 가리키는 규모 있는 초대 식사를 자연스럽게 전달하며, 교파적 해석을 더하지 않습니다. ‘초청했습니다’는 식사 문맥의 καλέω에 알맞습니다.
  issues:
  - severity: low
    issue: ἐποίει의 미완료 과거가 ‘베풀고’에서 충분히 드러나지 않습니다.
    rationale: ‘베풀고’는 문맥상 가능하지만, 원문의 진행 중이거나 전개되는 행위를 명시하는 ‘마련하고 있었고’가 상적 뉘앙스를 더 잘 보존합니다.
