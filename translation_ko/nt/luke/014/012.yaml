id: LUK.14.12
reference: Luke 14:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
  footnotes:
  - marker: a
    text: Or, 'breakfast' for 'luncheon'; the Greek ἄριστον refers to an earlier meal, often around midday rather than a modern morning breakfast.
    reason: lexical_alternative
  - marker: b
    text: Or, 'they invite you back.' The Greek verb means to invite in return.
    reason: lexical_alternative
  - marker: c
    text: Or, 'you be repaid.' The Greek more literally says, 'it become repayment to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서는 자기를 초대한 사람에게도 말씀하고 계셨습니다. “당신이 점심[a]이나 저녁을 베풀 때에는, 당신의 친구들이나 형제들이나 친척들이나 부유한 이웃들을 초대하지 마십시오. 그들도 다시 당신을 초대하여, 그것이 당신에게 보답[b]이 될까 하기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침 식사’. 그리스어 아리스톤(ἄριστον)은 더 이른 식사를 가리키며, 흔히 현대의 아침 식사보다는 한낮 무렵의 식사였습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신이 보답을 받을까’. 그리스어는 직역하면 ‘그것이 당신에게 보답이 될까’입니다.
    reason: lexical_alternative
