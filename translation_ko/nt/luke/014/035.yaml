  - severity: medium
    issue: ἔξω(밖에)가 번역에서 누락됨
    rationale: ‘내버린다’만으로는 원문의 ‘밖에 던진다’는 공간적 표현이 충분히 드러나지 않습니다.
  - severity: medium
    issue: 합쇼체 문체 불일치
    rationale: ‘없어’, ‘내버린다’, ‘들어라’는 요청된 현대 정중 격식체가 아닙니다.
