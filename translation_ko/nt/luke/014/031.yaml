  text: 「또 어느 왕이 다른 왕과 전쟁을 하러 가면서, 먼저 앉아 자기가 만 명으로 이만 명을 거느리고 자기에게 오는 그 왕에게 맞설 수 있는지 숙고하지 않겠습니까?」
  philosophy: optimal-equivalence
