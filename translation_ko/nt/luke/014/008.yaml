  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
  footnotes:
  - marker: a
    text: Or, 'to a wedding.' The Greek plural can refer to the wedding festivities, especially the banquet.
    reason: lexical_alternative
  - marker: b
    text: That is, the most honored place at the table.
    reason: cultural_note
  - marker: c
    text: Ancient formal meals commonly involved reclining rather than sitting upright.
    reason: cultural_note
translation:
  language: ko
  text: “어떤 사람에게서 혼인 잔치[a]에 초대를 받으셨을 때에는, 상석[b]에 앉지 마십시오[c]. 혹시 그가 당신보다 더 존귀한 사람을 이미 초대했을지도 모릅니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼인에.’ 그리스어 복수형은 특히 잔치를 포함한 혼인 축제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 식탁에서 가장 높은 영예를 받는 자리입니다.
    reason: cultural_note
  - marker: c
    text: 고대의 격식 있는 식사에서는 흔히 똑바로 앉기보다 기대어 누워 식사했습니다.
    reason: cultural_note
