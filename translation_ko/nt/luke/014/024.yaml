  to: 「내가 너희에게 말합니다. 초대받았던 그 남자들 가운데서는 아무도 내 잔치 음식을 맛보지 못할 것입니다.」
  rationale: 현대 표준어 합쇼체로 문체를 정비하고, 식사 문맥에서 자연스러운 ‘잔치 음식’을 보충하여 γεύομαι와 δεῖπνον의 결합을 명확히 했습니다. ‘그 남자들’로 ἀνδρῶν의 남성 지시를 보존했으며, 원문의 배제와 미래 선언은 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:39Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 원문은 γὰρ의 설명적 접속, ἀνδρῶν의 남성 지시, 완료 수동분사 κεκλημένων의 선행 초청, 그리고 미래형 배제 선언을 담고 있습니다. 초안은 핵심 의미를 대체로 보존하지만, ‘내 잔치를 맛보다’는 한국어에서 어색하며 γεύομαι의 관용적 의미를 충분히 자연스럽게 전달하지 못합니다.
  naturalness: ‘내가 너희에게 이르노니’와 ‘못하리라’는 현대 표준어 합쇼체로는 문어적·고어적입니다. ‘내가 너희에게 말합니다’ 및 ‘먹지 못할 것입니다’가 현대적이면서도 엄숙한 발화의 어조를 유지합니다.
  terminology: δεῖπνον은 이 비유의 식사 맥락에서 ‘잔치’가 자연스럽고 적절합니다. τῶν ἀνδρῶν은 ‘그 사람들’보다 ‘그 남자들’이 원문의 남성 지시를 명시적으로 보존합니다. κεκλημένων은 ‘초대받은’이 현대 한국어에서 자연스럽습니다.
  issues:
  - severity: medium
    issue: 현대 합쇼체와 맞지 않는 고어적 종결 및 표현
    rationale: ‘이르노니’, ‘못하리라’는 현대 formal-polite 합쇼체가 아니라 성경체 고어 문체에 가깝습니다.
  - severity: medium
    issue: ‘잔치를 맛보다’의 한국어 결합이 부자연스러움
    rationale: γεύομαι는 문자적으로 ‘맛보다’이지만 이 식사 배제 문맥에서는 ‘먹다/맛보다’가 자연스럽습니다. ‘잔치를 맛보다’보다 ‘잔치 음식을 맛보다’ 또는 ‘잔치를 먹다’가 더 자연스럽고, 전자는 의미도 정확합니다.
  - severity: low
    issue: ἀνδρῶν의 남성 지시가 ‘사람들’로 일반화됨
    rationale: 원문은 ἀνήρ의 복수 속격을 사용하므로, 불필요한 일반화 없이 ‘남자들’을 사용하는 편이 원문에 더 가깝습니다.
  revised_text: 「내가 너희에게 말합니다. 초대받았던 그 남자들 가운데서는 아무도 내 잔치 음식을 맛보지 못할 것입니다.」
