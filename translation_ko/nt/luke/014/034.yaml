  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
  footnotes:
  - marker: a
    text: Or 'if salt loses its taste.' The Greek verb can literally mean 'become foolish,' but here it refers to salt becoming insipid or tasteless.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그러므로 소금은 좋습니다. 그러나 소금도 맛을 잃으면[a] 무엇으로 그것을 짜게 할 수 있겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석게 되면.’ 그리스어 동사는 문자적으로 ‘어리석게 되다’라는 뜻일 수 있으나, 여기서는 소금이 맛을 잃어 싱거워지는 것을 가리킵니다.
    reason: lexical_alternative
