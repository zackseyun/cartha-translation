  to: 그 종이 돌아와 자기 주인에게 그 모든 일을 보고하였다. 그러자 집주인이 분노하여 자기 종에게 말하였다. “급히 성의 큰길과 골목으로 나가서, 가난한 사람들과 장애가 있는 사람들과 보지 못하는 사람들과 다리를 저는 사람들을 이리로 데려오라.”
  rationale: 문맥상 귀환의 뜻을 명시하고, ταῦτα의 복수적 지시를 ‘그 모든 일’로 자연스럽게 반영했습니다. 직접 인용부호를 정비했으며, 원문의 네 부류와 그 순서를 보존하면서 현대 표준어 합쇼체 서술에 맞는 사람 중심 표현을 사용했습니다.
