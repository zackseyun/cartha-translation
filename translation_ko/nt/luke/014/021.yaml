  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 παραγενόμενος는 이 문맥에서 심부름을 마치고 주인에게 돌아온 것을 가리키므로 ‘돌아와’가 더 정확합니다. ταῦτα는 앞선 거절의 사정들을 가리키므로 ‘그 모든 일을’로 자연스럽게 반영했습니다.
  naturalness: 초안의 겹따옴표(「…「…」」)는 한국어 성경 문장부호로 부자연스럽습니다. 직접 인용을 큰따옴표로 정리하고, ‘이 말을 보고하자’의 시간 관계를 자연스러운 서술로 다듬었습니다. ‘몸 불편한 자들’과 ‘다리 저는 자들’은 현대 표준어에서 사람 중심 표현으로 조정했습니다.
  terminology: δοῦλος는 비유의 가정 내 역할에 맞게 ‘종’으로 유지했고, κύριος는 인간 상급자를 뜻하므로 ‘주인’으로, οἰκοδεσπότης는 ‘집주인’으로 구별했습니다. ἀναπείρους와 χωλούς의 구별은 각각 ‘장애가 있는 사람들’과 ‘다리를 저는 사람들’로 유지했습니다.
