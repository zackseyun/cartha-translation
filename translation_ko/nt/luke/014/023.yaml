  text: 그러자 주인이 종에게 말했습니다. “길과 산울타리가 있는 곳으로 나가서, 그들이 들어오도록 강권하십시오[a]. 그래서 내 집이 차도록 하십시오.”
  philosophy: optimal-equivalence
