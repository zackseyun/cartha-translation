  source_fidelity: 주요 의미는 대체로 반영했으나, φραγμούς를 단순히 ‘산울’로 옮긴 것은 현대 한국어에서 부자연스럽고 의미가 불분명합니다. 또한 ἵνα γεμισθῇ μου ὁ οἶκος는 ‘내 집을 채우게 하라’보다 ‘내 집이 가득 차게 하라’가 수동형 목적절을 더 정확히 반영합니다.
  naturalness: 원문의 겹낫표 표기(「…「…」」)는 한국어 인용 관습상 어색합니다. ‘길과 산울 가로 나가’도 자연스럽지 않으므로 ‘길과 울타리 쪽으로 나가서’로 다듬는 것이 적절합니다. 합쇼체에 맞추어 서술과 직접 명령을 ‘말했습니다’, ‘하십시오’로 통일했습니다.
  terminology: 비유 안의 κύριος는 ‘주인’, δοῦλος는 사회적 종속 관계를 보존하는 ‘종’이 적절합니다. ἀνάγκασον의 강한 어감을 본문에서는 ‘강권하여’로 보존하되, 물리적 강제를 반드시 뜻하는 것은 아니라는 주석을 답니다.
  issues:
  - severity: medium
    issue: ‘산울’ 및 ‘길과 산울 가로’ 표현
    rationale: φραγμοί는 울타리·산울타리·경계 울타리를 가리키며, ‘산울’은 표준 현대어에서 낯설고 해당 구문도 자연스럽지 않습니다.
  - severity: medium
    issue: 목적절의 능동적 표현
    rationale: γεμισθῇ는 수동형이므로 ‘내 집을 채우게 하라’보다 ‘내 집이 가득 차게 하라’가 원문의 문법과 의미를 더 잘 보존합니다.
  - severity: low
    issue: 인용부호 중첩 및 합쇼체 불일치
    rationale: 겹낫표의 중첩은 불필요하며, ‘말하였다/하라’는 지정된 현대 합쇼체 문체와 일관되지 않습니다.
  revised_text: 그러자 주인이 종에게 말했습니다. “길과 울타리 쪽으로 나가서, 사람들을 강권하여 들어오게 하십시오. 내 집이 가득 차게 하십시오.”
  revised_footnotes:
  - marker: a
    text: '‘강권하여’: 그리스어 동사는 ‘강요하다, 강하게 권하다’라는 강한 뜻을 지닙니다. 이 비유의 문맥에서 반드시 물리적 강제를 뜻하는 것은 아닙니다.'
    reason: lexical_alternative
  revision_rationale: 현대 표준 한국어와 합쇼체에 맞추어 문장을 정리하고, ‘울타리’와 ‘내 집이 가득 차게 하십시오’로 원문의 어휘와 수동 목적절을 충실히 반영했습니다. ‘강권하여’는 ἀνάγκασον의 강도를 유지하며, 주석으로 문맥상 가능한 비폭력적 뉘앙스를 밝혔습니다.
