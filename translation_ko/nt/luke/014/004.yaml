  source_fidelity: 원문의 οἱ δὲ ἡσύχασαν은 ‘그러나 그들은 잠잠하였습니다’로 적절히 옮겼습니다. ἐπιλαβόμενος, ἰάσατο, ἀπέλυσεν의 연속 동작도 ‘그를 붙드시고 고치셔서 보내셨습니다’에 충실하게 반영되었습니다.
