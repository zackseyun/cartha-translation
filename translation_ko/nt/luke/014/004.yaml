  terminology: ‘고치셨습니다’는 육체적 치유를 가리키는 ἰάσατο에 적절하며, ‘보내셨습니다’는 이 문맥의 ἀπέλυσεν을 자연스럽게 전달합니다. 신학적 해석을 덧붙이지 않았습니다.
