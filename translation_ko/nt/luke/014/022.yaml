  source_fidelity: The draft accurately identifies the servant, the householder addressed as '주인이여,' the completion of the command, and remaining capacity. However, '명하신 대로 하였으나' adds an adversative nuance ('but/although') not present in the Greek, where καί simply links the two assertions.
  naturalness: The nested quotation marks are typographically awkward in Korean. Modern formal-polite narrative is more natural with '말했습니다' and a single level of quotation.
  terminology: '''종'' appropriately renders δοῦλος in this parable, and ''주인이여'' is a contextually apt rendering of the vocative Κύριε without importing a theological identification. ''자리'' naturally conveys τόπος as available banquet capacity.'
  issues:
