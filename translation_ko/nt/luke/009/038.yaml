  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
  footnotes:
  - marker: a
    text: Or “my only son.” The Greek says literally that he is ‘only-begotten/only one’ to me; in context, since the child has already been identified as a son, both renderings are possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 보십시오, 무리 가운데서 한 사람이 부르짖어 말하였습니다. “선생님, 간청하오니 제 아들을 굽어보아 주십시오. 그 아이는 제 외아들[a]입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게는 하나뿐인 자녀입니다.” 그 아이가 이미 아들로 언급되었으므로, 본문은 ‘외아들’로 옮겼습니다.
    reason: μονογενής의 문맥상 가능한 ‘유일한 자녀’라는 어휘적 뉘앙스를 보존합니다.
