    reason: εὑρέθη(“발견되었다”)는 문맥상 예수님만 남아 보였다는 뜻으로도 이해될 수 있으나, 본문은 그 장면을 해석하지 않고 서술합니다.
  revision_rationale: The revision corrects the temporal event from the voice’s cessation to its occurrence, removes an unsupported locative addition, and retains the source’s narrative restraint. The footnote records the Greek passive expression and its contextually possible Korean rendering.
