  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
  footnotes:
  - marker: a
    text: Or 'Jesus alone remained' / 'only Jesus was seen.' The Greek says literally, 'Jesus was found alone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 음성이 들렸을 때, 예수님만 홀로 계셨습니다[a]. 그들은 잠잠히 있었고, 그 당시에는 자기들이 본 것 가운데 아무것도 아무에게도 알리지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예수님만 보였습니다.” 그리스어는 직역하면 “예수님만 홀로 발견되셨다”입니다.
    reason: εὑρέθη(“발견되었다”)는 문맥상 예수님만 남아 보였다는 뜻으로도 이해될 수 있으나, 본문은 그 장면을 해석하지 않고 서술합니다.
