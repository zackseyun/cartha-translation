- from: 음성이 그쳤을 때, 예수만 홀로 거기 계셨습니다. 그들은 잠잠하였고, 그날들에 자기들이 본 것을 아무에게도 알리지 아니하였습니다.
  to: 그 음성이 들렸을 때, 예수님만 홀로 계셨습니다[a]. 그들은 잠잠히 있었고, 그 당시에는 자기들이 본 것 가운데 아무것도 아무에게도 알리지 않았습니다.
