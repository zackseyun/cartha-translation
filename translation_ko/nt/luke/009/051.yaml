    rationale: τὰς ἡμέρας는 복수이며, ἐν τῷ συμπληροῦσθαι는 그 기간이 차 가는 과정의 시간적 배경을 나타냅니다.
  - severity: medium
    issue: 「얼굴을 굳히고 결단하셨습니다」는 관용구를 다시 ‘결단’으로 해설하여 의미가 중복되고, 원문의 동사 하나를 두 표현으로 확대합니다.
    rationale: ἐστήρισεν은 본문에서는 ‘얼굴을 굳히셨습니다’로 옮기고, 결의의 뜻은 각주에서 설명하는 것이 원문 이미지와 문체를 더 잘 보존합니다.
