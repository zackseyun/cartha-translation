  source_fidelity: 개정이 필요합니다. 원문의 복수형 「날들」(τὰς ἡμέρας)과 진행 중인 충족의 의미(συμπληροῦσθαι)를 드러내고, 「얼굴을 굳히고 결단하셨습니다」가 낳는 중복 및 원문에 없는 추상명사 보충을 피하는 편이 더 충실합니다. 「올려지실」은 ἀνάλημψις의 넓은 의미를 보존합니다.
  naturalness: 「올려지실 날들이 차 갈 때에」와 「예루살렘으로 가시기로 얼굴을 굳히셨습니다」는 현대 표준어 합쇼체로 자연스럽고, 원문의 문학적 이미지를 유지합니다.
  terminology: 「올려지실」은 ‘승천’으로 의미를 좁히지 않으며, 「얼굴을 굳히셨습니다」는 τὸ πρόσωπον ἐστήρισεν의 관용적·비유적 표현을 보존합니다. 각주는 이 표현을 설명하되 이사야 50:7에 대한 의도적 반향을 단정하지 않도록 수정합니다.
  issues:
