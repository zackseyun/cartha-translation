  source_fidelity: ‘구름 속에서’는 ἐκ τῆς νεφέλης(구름으로부터)를 ‘구름 안에서’로 바꾸므로, 출처를 나타내는 ‘구름에서’로 고쳐야 합니다. 또한 ὁ ἐκλελεγμένος은 ‘택하신 이’로 옮겨 선택됨이라는 의미와 칭호적 기능을 보존했습니다.
  naturalness: 초안의 ‘음성이 나서 이르되 … 하였습니다’는 현대 표준어 합쇼체 서술로는 다소 문어적이고 인용 연결이 어색합니다. ‘음성이 들려와 이렇게 말씀하셨습니다’는 자연스럽고, 인용문 안의 명령은 ‘들으십시오’로 현대의 격식을 유지합니다.
  terminology: ‘내 아들, 택하신 이’는 ‘my Son, the Chosen One’의 병렬·동격 구조를 보존하며, 두 번째 ‘내’를 본문에 보태지 않습니다. 본문에 채택되지 않은 ‘사랑하는 아들’ 읽기는 본문 비평 각주로 남깁니다.
