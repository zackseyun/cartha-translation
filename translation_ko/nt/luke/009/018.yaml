  text: 어느 날 예수께서 따로[a] 기도하고 계실 때에 제자들이 그와 함께 있었습니다. 예수께서 그들에게 물으셨습니다. “무리가 나를 누구라고 말합니까?”
  philosophy: optimal-equivalence
