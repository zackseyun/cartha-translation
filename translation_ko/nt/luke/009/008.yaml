  source_fidelity: ‘옛 선지자 가운데 하나’는 의미상 가능하지만, τις τῶν ἀρχαίων은 한국어에서 ‘옛 선지자 한 사람’으로 옮기는 편이 더 자연스럽고, 부정 단수 τις를 더 직접적으로 반영합니다. ‘다시’는 원문에 명시된 요소가 아니므로 삭제하는 것이 안전합니다. ἀνέστη의 죽음에서의 일어남이라는 문맥적 뜻은 ‘살아났다’로 자연스럽게 드러납니다.
  naturalness: 인용 부호 없이 ‘…다고 하며’로 처리하면 앞 절에서 이어지는 소문들의 나열이라는 원문의 타원적 구문을 현대 한국어로 자연스럽게 재현합니다. 합쇼체 종결 ‘때문입니다’를 유지했습니다.
  terminology: ‘엘리야’와 ‘선지자’는 한국어 성서 문맥에서 널리 쓰이는 표기입니다. ‘살아났다’는 수동형으로 과도하게 해석하지 않으면서도 ἀνέστη의 부활/되살아남의 함의를 보존합니다.
  issues:
  - severity: low
    issue: ‘다시 일어났다’에 ‘다시’가 추가되어 있습니다.
    rationale: ἀνέστη 자체는 ‘일어났다/살아났다’를 뜻하며, ‘다시’라는 부사는 원문에 명시되어 있지 않습니다. 문맥상 되살아남을 뜻하지만 불필요한 첨가어는 피하는 편이 좋습니다.
  - severity: low
    issue: ‘옛 선지자 가운데 하나’는 다소 부자연스럽고 ‘하나’가 사람을 직접 가리키지 않습니다.
    rationale: προφήτης τις τῶν ἀρχαίων은 ‘옛 선지자 한 사람’으로 옮기면 부정 단수의 사람 지시와 소속 관계가 한국어에서 더 분명합니다.
