  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
  footnotes:
  - marker: a
    text: Or 'a cloud came and overshadowed them.' The verb can be rendered more simply without the inceptive nuance.
    reason: lexical_alternative
  - marker: b
    text: The cloud likely echoes Old Testament scenes of God's manifest presence, though the verse itself does not state this explicitly.
    reason: cross_reference
translation:
  language: ko
  text: 그가 이러한 말을 하고 있을 때에, 구름이 나타나 그들을 덮기 시작하였고[a], 그들은 그 구름 속으로 들어가면서 두려워하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “구름이 나타나 그들을 덮었습니다.” 이 동사는 시작의 뉘앙스를 드러내지 않고 더 간단하게 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구름은 하나님의 임재가 나타나는 구약의 장면들을 연상시킬 수 있으나, 이 절 자체는 그것을 명시하지 않습니다.
    reason: cross_reference
