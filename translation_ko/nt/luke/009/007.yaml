  verdict: revise
  source_fidelity: 초안의 ‘그때’는 δέ의 완만한 연결 기능을 시간 부사로 과도하게 특정합니다. 또한 ἠγέρθη는 수동형인데 ‘살아났다’는 능동·자동사 표현이므로, 수동의 뉘앙스를 더 잘 보존해야 합니다. ‘당황하였으니’는 διηπόρει의 ‘몹시 의아해함/곤혹스러움’보다 다소 상황적 당황을 강하게 암시할 수 있습니다.
  naturalness: ‘헤롯 분봉왕’, ‘일어나고 있는 모든 일’, ‘몹시 의아해했습니다’는 현대 표준어 합쇼체에서 자연스럽고, 역사적 서술의 격식에도 맞습니다. 인용부호와 ‘하고’는 직접 인용처럼 보이므로 간접 인용으로 정리했습니다.
  terminology: τετραάρχης는 ‘분봉왕’으로 유지했습니다. ἐκ νεκρῶν은 성경 한국어의 관용을 따라 ‘죽은 자들 가운데서’로 옮겼습니다. ἠγέρθη의 수동성은 ‘다시 살아나게 되었다’로 반영하고, 능동형 대안은 각주로 밝혔습니다.
