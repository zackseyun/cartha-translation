  text: 제자들인 야고보와 요한이 이것을 보고[a] 말하였습니다. “주님, 하늘에서 불이 내려와 그들을 태워 없애도록 우리가 명하기를 원하십니까?”
  philosophy: optimal-equivalence
  footnotes:
