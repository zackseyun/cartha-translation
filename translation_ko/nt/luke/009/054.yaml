    text: 원문에는 ‘보고’의 목적어가 명시되어 있지 않습니다. 문맥상 앞절에서 사마리아 사람들이 예수님을 받아들이지 않은 일을 가리킵니다. 직역하면, ‘우리가 하늘에서 불이 내려와 그들을 태워 없애도록 말하기를 원하십니까?’입니다.
    reason: 원문에 암시된 목적어의 문맥적 보충을 밝히고, εἴπωμεν(‘말하다’)을 문맥상 ‘명하다’로 자연스럽게 옮긴 사실을 투명하게 제시합니다.
