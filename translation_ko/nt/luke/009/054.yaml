  rationale: 원문의 동격 주어와 θέλεις + 1인칭 복수 접속법의 청원 구조를 현대 한국어로 명료하게 재구성했습니다. ‘명하다’는 제자들이 하늘의 불을 불러 심판을 실행하려는 발화의 수행적 힘을 자연스럽게 드러내되, 원문 동사가 문자적으로는 ‘말하다’임을 각주에서 보존합니다. ‘이것’은 독해를 돕기 위해 유지하고 그 비명시성을 각주로 표시했습니다.
