review_pass:
  verdict: revise
  source_fidelity: The draft retains the contrast, the deliberately repeated νεκρούς ('dead'), the emphatic reflexive 'their own,' and the call to proclaim God's kingdom. However, '장사하게 하라' is archaic and can sound like an instruction to arrange a funeral rather than a command to leave them to the task. The revision more clearly conveys Ἄφες + infinitive while preserving the paradox. '가서 ... 선포하십시오' idiomatically represents ἀπελθὼν διάγγελλε without treating the participle as a rigid temporal sequence.
  naturalness: The revision uses modern standard Korean and formal-polite 합쇼체. '죽은 사람들' and '장사 지내게 내버려 두십시오' are clearer and more natural than the Sino-Korean-heavy '죽은 자들' and archaic '장사하게 하라.'
  terminology: '''하나님의 나라'' is an established, natural rendering of βασιλεία τοῦ θεοῦ. ''선포하십시오'' suitably conveys the public/heralding force of διάγγελλε. The footnote preserves, rather than resolves, the likely metaphorical/literal contrast in the two occurrences of ''dead.'''
  issues:
  - severity: medium
    issue: '''장사하게 하라'' is archaic and underspecifies Ἄφες.'
    rationale: In contemporary Korean it is less natural and may be understood as simply ordering a burial. '장사 지내게 내버려 두십시오' directly expresses leaving someone to perform the burial.
  - severity: low
    issue: The draft lacks a footnote for the repeated, paradoxical use of 'dead.'
    rationale: The Greek repeats the same term in both positions, while the likely senses differ. A note can aid readers without inserting an interpretation into the text.
  revised_text: 그러나 예수님께서 그에게 말씀하셨습니다. “죽은 사람들은 자기들의 죽은 사람들을 장사 지내게 내버려 두십시오. 당신은 가서 하나님의 나라를 선포하십시오.”
  revised_footnotes:
  - marker: a
    text: 첫 번째 ‘죽은 사람들’은 영적으로 무감각한 사람들을, 두 번째는 육체적으로 죽은 사람들을 가리키는 것으로 흔히 이해됩니다. 그러나 그리스어는 두 경우에 같은 단어를 사용하며, 본문도 그 긴장을 그대로 유지합니다.
    reason: 원문의 반복과 의도적인 역설을 보존하면서, 흔한 해석을 본문 밖에서만 설명합니다.
  revision_rationale: 현대 표준 한국어 합쇼체로 다듬고, Ἄφες의 ‘내버려 두다’라는 명령을 분명히 했습니다. νεκρούς의 반복, ἑαυτῶν의 강조, 그리고 하나님 나라를 계속 공적으로 알리라는 요청을 유지했습니다. 해석상 논쟁 또는 긴장은 본문에서 해소하지 않고 각주로만 안내했습니다.
