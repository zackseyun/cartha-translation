review_pass:
  verdict: revise
  source_fidelity: 원문의 대조적 δέ, 두 차례 반복되는 νεκρούς, 강조된 ἑαυτῶν, 그리고 ἀπελθών 뒤의 διάγγελλε를 대체로 충실히 옮겼습니다. 다만 인용문 안의 명령형을 합쇼체로 통일하고, 원문의 의도적인 ‘죽은 자들’의 긴장을 보존하는 주석을 보완하는 것이 적절합니다.
  naturalness: ‘장사하게 하라’와 ‘전파하라’는 성경 문체로 이해되지만, 지정된 현대 표준어 합쇼체와는 맞지 않습니다. ‘장사 지내게 하십시오’, ‘전파하십시오’가 현대적이면서도 명령의 강도를 유지합니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ에 대한 한국어 성경의 정착된 표현으로 적절합니다. ‘죽은 자들’을 두 번 그대로 유지하여 원문의 역설과 반복을 보존했습니다.
  issues:
  - severity: medium
    issue: 인용문 안의 종결법이 합쇼체가 아닙니다.
    rationale: ‘하라/전파하라’는 해라체입니다. 과업에서 요구한 현대 표준어 합쇼체에 맞추어 ‘하십시오’로 고쳐야 합니다.
  - severity: low
    issue: ‘죽은 자들’의 이중 의미를 설명하는 주석이 없습니다.
    rationale: 본문은 원문처럼 반복을 유지해야 하지만, 첫 번째 ‘죽은 자들’이 비유적 의미로 이해될 수 있고 두 번째는 육체적으로 죽은 이들을 가리킨다는 일반적 이해를 주석에서 밝혀 독자의 이해를 도울 수 있습니다. 이는 본문의 모호성을 해소하지 않습니다.
  revised_text: 그러나 예수께서 그에게 말씀하셨습니다. “죽은 자들로 자기들의 죽은 자들을 장사 지내게 하십시오. 그러나 당신은 가서 하나님의 나라를 전파하십시오.”
  revised_footnotes:
  - marker: a
    text: 첫 번째 ‘죽은 자들’은 흔히 영적으로 반응하지 않는 사람들을 비유적으로 가리키고, 두 번째는 육체적으로 죽은 사람들을 가리키는 것으로 이해됩니다. 그러나 그리스어는 두 경우 모두 같은 말을 사용하므로, 본문도 그 반복과 긴장을 그대로 보존합니다.
    reason: alternative_reading
  revision_rationale: 직접 인용의 명령형을 현대 표준어 합쇼체로 바로잡았습니다. ‘죽은 자들’의 반복, ‘자기들의’가 나타내는 소유의 강조, 그리고 ‘가서 … 전파하십시오’의 순서는 유지했습니다. 본문에는 해석을 덧붙이지 않고 주석에서만 통상적 이해를 제한적으로 설명했습니다.
