  terminology: δύναμις와 ἐξουσία는 ‘능력과 권세’로 구별해 유지합니다. δαιμόνια는 전통적이고 직접적인 대응어인 ‘귀신’으로, νόσους θεραπεύειν은 ‘병을 고치다’로 옮깁니다.
