  source_fidelity: 초안은 날이 저물기 시작함, 열둘의 접근과 발언, 무리의 해산, 주변 지역에서의 숙박 및 식량 확보, 외딴 장소라는 이유를 모두 충실히 담고 있습니다. 다만 첫 절의 ‘-니’는 원문의 단순한 서술적 연결(δὲ)에 다소 강한 인과 뉘앙스를 부여할 수 있어 시간적 전환으로 다듬는 것이 더 적절합니다.
