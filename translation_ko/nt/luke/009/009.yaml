  source_fidelity: The draft preserves Herod's beheading of John and his desire to see Jesus, but “이런 일이 들려오는 이 사람” shifts the Greek’s personal construction (“this one about whom I hear such things”) into an impersonal passive expression and uses singular “일” for plural/neuter “such things.”
  naturalness: The proposed wording is natural modern standard Korean in formal-polite narrative style. “내가 이런 일들을 듣는 이 사람” directly and idiomatically identifies the person who is the subject of the reports.
  terminology: “헤롯,” “요한,” and “목을 베다” are appropriate standard Korean biblical terminology. No doctrinal interpretation is added.
  issues:
  - severity: medium
    issue: The relative clause is rendered impersonally and with singular wording.
    rationale: περὶ οὗ ἀκούω τοιαῦτα means “about whom I hear such things.” “이런 일이 들려오는 이 사람” is less direct and can suggest that events themselves are arriving rather than that Herod is hearing reports about the person. “이런 일들을 듣는 이 사람” retains the source relation and breadth.
