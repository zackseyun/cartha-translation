  source_fidelity: 초안은 귀신이 소년을 넘어뜨리고 경련하게 한 일, 예수님께서 더러운 영을 꾸짖으시고 소년을 고치셔서 아버지에게 돌려주신 일을 충실히 옮깁니다. 다만 ἔτι의 ‘아직’이라는 지속성을 명시하고, συνεσπάραξεν의 격렬한 경련의 뉘앙스를 더 자연스럽게 드러내는 편이 좋습니다.
  naturalness: ‘가까이 오는 동안에’는 문법적으로 가능하지만 이 문맥의 동시성을 나타내는 표현으로는 ‘아직 가까이 다가오고 있을 때’가 더 자연스럽습니다. ‘고치사’는 현대 합쇼체 문체보다 다소 문어적이므로 ‘고치시고’로 고칩니다.
  terminology: δαιμόνιον은 ‘귀신’, πνεῦμα τὸ ἀκάθαρτον은 ‘더러운 영’으로 옮겨 두 표현의 구별과 상호 지시를 보존했습니다. παῖς는 문맥상 ‘그 아이’가 적절합니다.
  issues:
