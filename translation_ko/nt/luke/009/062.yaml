  source_fidelity: 개정안은 οὐδείς의 보편적 부정, ἐπιβαλών의 쟁기를 잡기 시작한 행위, βλέπων의 계속적인 ‘뒤를 돌아봄’, εὔθετος의 ‘적합함’, 그리고 τῇ βασιλείᾳ τοῦ θεοῦ의 ‘하나님의 나라에’를 모두 보존합니다. 구원 여부를 단정하는 표현은 피했습니다.
  naturalness: 초안은 ‘손을 쟁기에 댄 자가 뒤를 돌아보면, 누구도’라는 구조에서 ‘누구도’의 선행 범위가 문법적으로 어색합니다. 또한 ‘합당하지 아니하다’는 현대 합쇼체에는 다소 고어적입니다. 개정문은 자연스러운 현대 표준어 합쇼체로 정리했습니다.
