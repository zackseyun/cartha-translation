  source_fidelity: 초안은 ἰδού를 빠뜨리고, 현재 직설법 λαμβάνει를 조건절(‘사로잡으면’)로 바꾸었습니다. 또한 ‘좀처럼 떠나지 아니합니다’는 μόγις ἀποχωρεῖ의 뜻을 대체로 전달하지만, 문장 전체를 원문의 연속적인 묘사에 맞게 고칠 필요가 있습니다.
