- from: 「영이 그를 사로잡으면, 갑자기 그가 부르짖고, 영이 그를 거품을 내며 경련케 하다가, 그를 부서뜨리며 좀처럼 떠나지 아니합니다.」
  to: 「보십시오, 영[a]이 그를 사로잡고, 그는 갑자기 소리를 지릅니다. 그 영은 그가 거품을 물고 경련을 일으키게 하며, 그를 짓이기면서 좀처럼 그에게서 떠나지 않습니다.」
  rationale: ἰδού는 ‘보십시오’로, 현재 서술인 λαμβάνει는 ‘사로잡고’로 옮겼습니다. σπαράσσει αὐτὸν μετὰ ἀφροῦ는 한국어에서 자연스럽게 ‘그가 거품을 물고 경련을 일으키게 하며’로 표현했습니다. μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ는 ‘좀처럼 그에게서 떠나지 않습니다’로, συντρῖβον αὐτόν은 동시적 손상을 나타내도록 ‘그를 짓이기면서’로 유지했습니다. πνεῦμα의 비특정성은 본문 ‘영’ 및 각주로 보존했습니다.
