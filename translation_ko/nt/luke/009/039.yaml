  terminology: πνεῦμα는 본문에서 ‘영’으로 유지하여 원문의 비특정성을 보존했습니다. 문맥상 적대적인 존재임을 알 수 있어도 본문에 ‘악한 영’이나 ‘귀신’을 넣지 않았으며, 그 가능성은 각주로만 밝혔습니다.
