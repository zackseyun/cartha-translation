translation:
  language: ko
  text: 「보십시오, 영[a]이 그를 사로잡고, 그는 갑자기 소리를 지릅니다. 그 영은 그가 거품을 물고 경련을 일으키게 하며, 그를 짓이기면서 좀처럼 그에게서 떠나지 않습니다.」
  philosophy: optimal-equivalence
