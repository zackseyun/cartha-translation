source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
  footnotes:
  - marker: a
    text: Or “booths,” “tents,” or traditionally “tabernacles.” The Greek skēnai refers to temporary shelters and may echo biblical festival imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예수에게서 떠나가고 있을 때, 베드로가 예수께 말했습니다. “선생님, 우리가 여기 있는 것이 좋습니다. 임시 거처[a] 셋을 마련합시다. 하나는 선생님을 위해, 하나는 모세를 위해, 하나는 엘리야를 위해 말입니다.” 그는 자신이 무슨 말을 하고 있는지도 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “초막들”, “장막들”, 전통적으로 “성막들”. 그리스어 스케나이(σκηναί)는 임시 거처를 가리키며, 성경의 절기 이미지와 관련될 가능성도 있습니다.
    reason: σκηνάς의 어휘적 대안과 가능한 성경적 연상을 본문에 과도하게 해석으로 넣지 않고 보존합니다.
