- from: 그 두 사람이 예수에게서 떠나려 할 때, 베드로가 예수께 말하였습니다. 「선생님, 우리가 여기 있는 것이 좋습니다. 우리가 초막 셋을 짓겠습니다 — 하나는 선생님께, 하나는 모세에게, 하나는 엘리야에게.」 자기가 무슨 말을 하는지도 알지 못한 채 말하였습니다.
  to: 그들이 예수에게서 떠나가고 있을 때, 베드로가 예수께 말했습니다. “선생님, 우리가 여기 있는 것이 좋습니다. 임시 거처[a] 셋을 마련합시다. 하나는 선생님을 위해, 하나는 모세를 위해, 하나는 엘리야를 위해 말입니다.” 그는 자신이 무슨 말을 하고 있는지도 알지 못했습니다.
  rationale: 진행 중인 떠남과 예수에게서의 분리를 명확히 하고, 권유형 ποιήσωμεν을 ‘마련합시다’로 반영했습니다. ‘임시 거처’는 σκηνάς의 기본 의미를 현대적으로 전달하며, 전통적 번역 및 가능한 절기 연상은 각주로 처리했습니다. 마지막 문장은 μὴ εἰδὼς ὃ λέγει의 설명적 기능을 자연스럽게 드러냅니다.
