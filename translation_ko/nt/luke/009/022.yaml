review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the sequence of suffering, rejection by the three leadership groups, death, and resurrection. However, "다시" is not expressed in the Greek, and the placement of "-야 한다" only on the final verb can obscure that Δεῖ governs the entire infinitive series. The passive force of ἐγερθῆναι should also be retained more clearly.
  naturalness: '"일으켜져야 한다" is grammatically possible but somewhat awkward in modern formal Korean. Structuring the sentence with "반드시 ... 해야 합니다" and rendering the final passive as "일으킴을 받아야 합니다" is clear, formal-polite, and preserves the Greek syntax and voice.'
  terminology: '"인자," "장로들," "대제사장들," and "서기관들" are appropriate established Korean biblical terms. "많은 고난을 겪고" naturally represents πολλὰ παθεῖν without adding an unstated object. The passive resurrection wording avoids changing the source to an active expression such as "살아나다."'
  issues:
  - severity: medium
    issue: The adverb "다시" has been added before the resurrection verb.
    rationale: ἐγερθῆναι means "to be raised" but does not explicitly contain "again." The addition is readily inferred from context but is not required by this verse and should be omitted in an optimal-equivalence rendering.
  - severity: medium
    issue: The construction "... 일으켜져야 한다" can make the necessity appear to attach only to the final event.
    rationale: 'Δεῖ governs each of the coordinated infinitives: suffering, rejection, being killed, and being raised. A Korean construction with "반드시" and coordinated "-고" clauses more transparently carries that necessity across the whole sequence.'
  - severity: low
    issue: The draft does not preserve the English audit trail's alternative-rendering notes.
    rationale: A note on Δεῖ and a note identifying the passive form of ἐγερθῆναι support source transparency without altering the translation.
