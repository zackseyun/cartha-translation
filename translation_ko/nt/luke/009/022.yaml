translation:
  language: ko
  text: 말씀하시기를[a] “인자는 반드시 많은 고난을 겪고 장로들과 대제사장들과 서기관들에게 버림을 받아 죽임을 당하고, 사흘째 되는 날 일으킴을 받아야 합니다[b]” 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “인자는 많은 고난을 겪어야 합니다 …”
    reason: Δεῖ의 비인칭적 ‘필연/반드시’ 구문을 주어 중심의 표현으로 옮길 수 있음을 알린다.
  - marker: b
    text: 그리스어는 수동형으로 “일으킴을 받다”입니다. 능동형으로 “일어나다”라고도 옮길 수 있습니다.
    reason: ἐγερθῆναι의 수동태 형태와 가능한 한국어 번역 대안을 명시한다.
