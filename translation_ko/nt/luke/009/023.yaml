  source_fidelity: The draft accurately retains the core sequence of coming after Jesus, self-denial, taking up one’s cross, the daily qualifier, and following him. However, '모두에게' is less natural and less exact in this context than '모든 사람에게,' and the plain imperative '따르라' does not meet the specified modern formal-polite register. The Greek imperfect Ἔλεγεν can be expressed naturally in Korean narrative with '말씀하셨습니다'; Korean does not require a periphrastic progressive here.
  naturalness: '''그리고 모두에게 이르셨습니다'' is awkward in modern Korean. ''또 모든 사람에게 이렇게 말씀하셨습니다'' is natural narrative prose. Rendering the direct exhortation with ''-야 합니다'' maintains imperative force while consistently using 합쇼체.'
  terminology: '''자기를 부인하다,'' ''자기 십자가를 지다,'' and ''나를 따르다'' are accurate, established Korean renderings of the key discipleship terms. ''지고'' is idiomatic for ἀράτω in this cross-bearing expression and should be retained.'
