    rationale: ‘가지지 말라’는 소유 금지로 읽히기 쉬우나 αἴρετε는 여행을 위해 휴대·지참하지 말라는 뜻입니다.
  - severity: medium
    issue: ‘두 벌씩’의 분배 의미가 불명확함
    rationale: ἀνὰ δύο는 각 제자가 두 벌씩이라는 분배적 표현이므로 ‘저마다’를 보충하는 것이 안전합니다.
  - severity: low
    issue: 여행용 자루의 성격이 드러나지 않음
    rationale: ‘자루’만으로도 가능하지만 πήρα가 여행용 물품을 담는 자루임을 ‘여행용 자루’로 명확히 할 수 있습니다.
