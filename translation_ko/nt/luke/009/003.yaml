  text: 예수님께서 그들에게 말씀하셨습니다. “길을 떠날 때 아무것도 가져가지 마십시오. 지팡이도, 여행용 자루도, 빵도, 돈도 가져가지 말며, 저마다 속옷을 두 벌씩 가지지도 마십시오.”
