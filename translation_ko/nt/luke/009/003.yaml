  source_fidelity: 원문의 Μηδὲν αἴρετε εἰς τὴν ὁδόν은 여행을 위한 물품을 ‘가져가지 말라’는 명령이며, 열거된 지팡이·자루·빵·돈과 ‘각자 두 벌의 χιτών을 가지는 것’을 모두 보존해야 합니다. 초안은 핵심 목록을 대체로 옮겼으나, 첫 ‘가지지 말라’는 αἴρετε의 여행용 휴대 의미보다 소유 의미로 들리고, 마지막 항목의 ἀνά(각자/저마다)의 분배 의미가 충분히 드러나지 않습니다.
  naturalness: ‘길에 아무것도 가지지 말라’와 곧이어 반복되는 ‘가지지 말고’는 현대 한국어에서 다소 부자연스럽습니다. ‘길을 떠날 때 아무것도 가져가지 마십시오’와 ‘저마다 … 두 벌씩 가지지도 마십시오’가 명령의 연결과 의미를 자연스럽게 살립니다.
  terminology: ῥάβδος는 ‘지팡이’, πήρα는 여행용 물품 자루라는 뜻에서 ‘여행용 자루’, χιτών은 당시의 몸에 직접 입는 옷이라는 점을 반영하여 ‘속옷’으로 옮겼습니다. ἀργύριον은 문맥상 ‘돈’이 적절합니다.
  issues:
