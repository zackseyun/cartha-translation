    rationale: 예수께서 사도들을 데리고 가셨으므로 ‘따로’는 완전한 고독이 아니라 군중에게서 떨어짐을 뜻합니다. 영어 감사 기록의 어휘 역주 취지를 한국어에서도 보존하는 것이 바람직합니다.
