  source_fidelity: 그리스어의 사건 순서와 핵심 의미는 대체로 충실합니다. 다만 ὅσα의 포괄성은 ‘모든 일’로 유지하되 ‘자기들이 행한’보다 현대 한국어의 ‘자신들이 한’이 자연스럽습니다. κατ’ ἰδίαν은 사도들을 동반했다는 문맥상 예수께서 완전히 혼자 계셨다는 뜻이 아니라 군중과 떨어져 따로 물러나셨다는 뜻으로 옮겨야 합니다.
  naturalness: ‘성읍’은 현대 표준어 합쇼체 본문에서는 다소 고풍스럽습니다. πόλις의 규모를 과장하지 않는 ‘마을’이 자연스럽습니다. ‘벳새다라 하는’도 ‘벳새다라는’으로 다듬는 편이 매끄럽습니다.
  terminology: ‘사도들’, ‘예수께서’, ‘벳새다’는 적절합니다. κατ’ ἰδίαν의 문맥상 의미를 명확히 하기 위해 ‘따로’에 역주를 붙입니다.
  issues:
