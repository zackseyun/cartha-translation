    issue: 현대어 표현 및 지명 장소어
    rationale: ‘자기들이 행한’과 ‘성읍’은 의미상 문제는 없지만, 현대 표준어 합쇼체의 자연스러움을 위해 각각 ‘자신들이 한’과 ‘마을’로 조정하는 것이 좋습니다.
  - severity: low
