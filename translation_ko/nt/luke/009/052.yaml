- from: 그리고 예수께서 자기 앞에 사자들을 보내셨습니다. 그들이 가서 그를 위하여 준비하려고 사마리아 사람들의 한 마을에 들어갔습니다.
  to: 그리고 예수께서 자기 앞에 전령들을 보내셨습니다. 그들이 가서 그분을 위해 준비하려고 사마리아 사람들의 한 마을에 들어갔습니다.
  rationale: 인간 사절이라는 문맥적 의미를 명료하게 하기 위해 ‘사자들’을 ‘전령들’로 고쳤습니다. 그 밖에는 원문의 순서, ‘사마리아 사람들의 한 마을’이라는 표현, 그리고 준비의 목적을 유지했습니다.
