  source_fidelity: 헬라어 ἀγγέλους는 이 문맥에서 천사가 아니라 사람으로서 앞서 파견된 전령들을 가리킵니다. 초안의 ‘사자들’은 현대 한국어에서 이 의미로 자연스럽지 않고 ‘사자’(lion) 또는 천상 존재를 연상시킬 수 있습니다. 나머지 문장 구조와 목적 표현은 원문에 충실합니다.
  naturalness: ‘자기 앞에 사자들을’보다 ‘앞서 전령들을’이 현대 표준 한국어에서 자연스럽고 의미가 분명합니다. ‘그분을 위해’는 예수님을 가리키는 대명사의 지시 대상을 명료하게 합니다.
  terminology: ἀγγέλους는 ‘전령들’로 옮겨 인간 파견자라는 문맥적 의미를 반영했습니다. κώμην Σαμαριτῶν은 ‘사마리아 사람들의 한 마을’로 유지했습니다.
