  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
  footnotes:
  - marker: a
    text: Or 'word,' 'statement,' or 'matter' for 'saying' (ῥῆμα).
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'it was concealed from them' without naming who concealed it.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그들은 이 말씀을 깨닫지 못하였습니다[a]. 그들이 그것을 알아차리지 못하도록 그 말씀이 그들에게서 가려져 있었고[b], 그들은 이 말씀에 관하여 예수님께 묻기를 두려워하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀’은 ‘말’, ‘진술’, 또는 ‘일’을 뜻할 수도 있습니다(ῥῆμα).
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그들에게서 가려져 있었다’고만 하며, 누가 가렸는지는 밝히지 않습니다.
    reason: alternative_reading
