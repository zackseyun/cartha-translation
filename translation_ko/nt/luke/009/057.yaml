revisions:
- from: 그들이 길을 가고 있을 때에 어떤 사람이 예수께 말하였습니다. 「선생님이 가시는 곳이면 어디든지 따르겠습니다.」
  to: 그들이 길을 가고 있을 때에, 어떤 이가 그에게 말하였습니다. 「당신이 어디로 가시든지 저는 따르겠습니다.」
  rationale: 성별을 특정하지 않는 τις를 ‘어떤 이’로 옮기고, 원문에 없는 ‘선생님’ 호칭을 삭제했습니다. πρὸς αὐτόν은 ‘그에게’로, ὅπου ἐὰν ἀπέρχῃ는 불특정적 범위를 보존하여 ‘어디로 가시든지’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
