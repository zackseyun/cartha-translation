  - severity: low
    issue: ‘대답하였습니다’가 원문의 단순 발화보다 다소 해석적임
    rationale: δὲ εἶπεν은 ‘그러나/그런데 그가 말하였다’라는 단순 서술입니다. ‘그는 말했습니다’가 더 직접적입니다.
