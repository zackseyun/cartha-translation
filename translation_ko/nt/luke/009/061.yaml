  source_fidelity: The draft accurately conveys the additional speaker, his intention to follow Jesus, the respectful address κύριε as “주님,” the priority marked by πρῶτον, the request for permission, and the farewell to people belonging to or in his home. “제 집 사람들에게” is an acceptable contextual rendering of τοῖς εἰς τὸν οἶκόν μου.
  naturalness: The sentence is clear and appropriately formal-polite. Replacing the somewhat biblical-register object “주를” with “주님을” makes the referent explicit and is more natural in modern standard Korean while retaining the formal register.
  terminology: “주님” appropriately renders κύριε without narrowing its respectful and potentially weightier sense. “작별 인사를 하도록 허락하여 주십시오” faithfully expresses the request conveyed by ἐπίτρεψόν μοι ... ἀποτάξασθαι.
