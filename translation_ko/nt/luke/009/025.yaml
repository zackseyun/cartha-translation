  terminology: ‘온 세상’, ‘자기 자신’, ‘유익’은 문맥과 신학적 함의를 과도하게 좁히지 않는 적절한 표현입니다. 특히 ἑαυτόν을 ‘영혼’이나 ‘생명’으로 한정하지 않은 점이 적절합니다.
