  to: 「왜냐하면 누구든지 자기 목숨을 구하려고 하면 그것을 잃을 것이지만, 누구든지 나를 위하여 자기 목숨을 잃으면 그것을 구할 것입니다.[a]」
  rationale: The revision uses natural modern 합쇼체, removes the unnatural explicit apposition used to mirror οὗτος, retains the explanatory γάρ with ‘왜냐하면,’ and represents the two indefinite conditions with ‘누구든지 … 하면.’ ‘목숨을 구하다/잃다/구하다’ preserves the repeated verbal structure and immediate force of the Greek without narrowing ψυχή to an immaterial soul or σῴζω to a predetermined doctrinal sense.
