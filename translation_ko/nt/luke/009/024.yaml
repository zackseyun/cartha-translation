  terminology: ‘목숨’ is appropriate for ψυχή in this context. Rendering σῴζω with ‘구하다’ preserves the verbal paradox without prematurely restricting it to the conventional theological sense often carried by ‘구원하다.’ A lexical footnote should preserve ψυχή’s relevant alternatives.
