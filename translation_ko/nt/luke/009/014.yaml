  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
  footnotes:
  - marker: a
    text: Greek 'men,' specifying adult males rather than the whole crowd; women and children are not included in this number.
    reason: lexical_alternative
  - marker: b
    text: Or 'Have them sit down in groups of about fifty each.' The Greek verb specifically suggests reclining for a meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 남자[a]가 약 오천 명 있었기 때문입니다. 예수께서 자기 제자들에게 말씀하셨습니다. “그들을 한 무리마다 약 오십 명씩 기대어 앉게 하십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘남자’는 성인 남성을 가리킵니다. 이 수에는 여자와 아이들이 포함되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 한 무리마다 약 오십 명씩 앉게 하십시오.’ 그리스어 동사는 식사를 위해 기대어 앉게 하는 것을 특별히 시사합니다.
    reason: lexical_alternative
