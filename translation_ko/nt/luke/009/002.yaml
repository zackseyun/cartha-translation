  source_fidelity: 원문의 καί는 단순 접속인데 초안의 ‘또’는 첨가의 뉘앙스를 더합니다. 또한 κηρύσσειν은 이 문맥에서 ‘전파하다’보다 공적 선포의 뜻을 살린 ‘선포하다’가 더 적절합니다. 두 부정사는 파송의 목적을 나타내므로 ‘~하도록 보내셨습니다’로 옮기면 ἀπέστειλεν과 두 동사의 관계가 명확해집니다.
  naturalness: ‘하나님의 나라를 선포하고 병든 이들을 고치도록 그들을 보내셨습니다’는 현대 표준어 합쇼체로 자연스럽고, 완결된 문장입니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ의 통상적이고 폭넓은 번역입니다. ἰᾶσθαι는 ‘고치다’, τοὺς ἀσθενεῖς는 치유 문맥상 ‘병든 이들’로 옮겼습니다. 영어 감사 주석의 어휘 대안은 한국어에도 유지합니다.
