  - severity: low
    issue: The object of ‘막지 말라’ is left unexpressed.
    rationale: The Greek imperative’s object is supplied by the immediate context, and Korean can omit it, but ‘그를’ makes clear that Jesus means the unnamed exorcist without adding interpretation.
