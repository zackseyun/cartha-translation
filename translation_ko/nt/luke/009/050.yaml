  source_fidelity: 'The draft conveys the core meaning accurately: Jesus addresses the preceding speaker, prohibits preventing the unnamed man, and states the antithetical principle of being not against and therefore for the disciples. Explicitly supplying the contextually implied object (''him'') better reflects the immediate referent of the prohibition.'
  naturalness: The narrative is natural, but the direct quotation uses plain-style forms ('말라,' '편이다') rather than the requested modern formal-polite 합쇼체. Revising the quotation to '-십시오/-입니다' makes the register consistent and modern.
