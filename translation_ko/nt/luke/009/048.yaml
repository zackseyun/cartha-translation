  naturalness: ‘영접하다’는 가능하나 현대 표준어 합쇼체 성경 번역으로는 다소 교회 내부적이고 문어적인 표현입니다. ‘받아들이다’는 반복되는 δέχομαι를 자연스럽게 유지하면서 수용과 환대의 폭을 보존합니다. 인용문 안의 종결을 모두 합쇼체로 통일했습니다.
