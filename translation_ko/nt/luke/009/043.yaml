  source_fidelity: 원문의 두 반응 동사(ἐξεπλήσσοντο, θαυμαζόντων)의 강도와 기능을 구별할 필요가 있습니다. 첫 절은 하나님의 μεγαλειότης에 대한 강한 놀라움이고, 둘째 절은 예수께서 하시는 모든 일에 대한 지속적인 감탄입니다. 예수님을 δεύτε 절의 행위자와 발화자로 명시한 것은 문맥상 적절합니다.
  naturalness: 초안의 ‘놀라워하고 있을 때에’는 현대 표준 한국어에서 다소 어색합니다. ‘감탄하고 있을 때에’가 자연스러우며, 첫 절의 ‘놀랐습니다’와도 의미상 구별됩니다. δεύτε δέ의 전환은 ‘그런데’로 드러내는 것이 자연스럽습니다.
  terminology: ‘하나님의 위엄’은 μεγαλειότης의 ‘위대하심/장엄함/위엄’ 범위를 자연스럽게 전달합니다. ‘제자들’, ‘예수께서’, ‘말씀하셨습니다’도 현대 합쇼체 성경 문맥에 적합합니다.
  issues:
  - severity: medium
    issue: ‘놀라워하고 있을 때에’의 어색한 서술어 선택
    rationale: θαυμάζω는 여기서 앞선 강한 ‘놀라다’와 구별되는 ‘감탄하다/신기하게 여기다’로 옮기는 것이 자연스럽고 원문의 표현상 대비도 보존합니다.
  - severity: low
    issue: 둘째 절의 δέ에 따른 담화 전환이 드러나지 않음
    rationale: ‘그런데’를 사용하면 앞 문장의 군중 반응에서 예수님의 말씀으로 넘어가는 원문의 전환을 한국어에서 자연스럽게 나타낼 수 있습니다.
