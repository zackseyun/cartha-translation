  naturalness: ‘그것을 알고’ is understandable but stiff and underspecified in Korean. ‘이 사실을 알고’ is more natural in this context. ‘사람들’ is more idiomatic than ‘자들’ in modern formal Korean. The coordinated past forms naturally represent the Greek imperfects in Korean narrative style.
  terminology: ‘하나님의 나라’ appropriately preserves βασιλεία τοῦ θεοῦ. ‘치료가 필요한’ appropriately represents the θεραπεία phrase while retaining the distinction from the following healing verb. ‘예수께서’ retains the supplied Korean subject needed for clarity without adding content.
