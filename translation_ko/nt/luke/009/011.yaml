  rationale: ‘그런데’는 문맥상 δέ의 가벼운 전환을 자연스럽게 나타냅니다. ‘이 사실을 알고’는 원문의 목적어 없는 γνόντες가 가리키는 앞선 상황을 한국어로 자연스럽게 보완합니다. 나머지는 원문의 사건 순서와 의미를 유지했으며, 각주를 θεραπείας에 해당하는 표현에 정확히 연결했습니다.
