  source_fidelity: 초안의 ‘열두 광주리에 가득 찼습니다’는 원문에 없는 ‘가득’이라는 내용을 더하며, ‘열두 광주리’가 수거된 부스러기의 양/결과라는 원문의 구문도 충분히 반영하지 못합니다. 원문의 수동형 ‘ἤρθη’와 ‘그들에게 남은’(αὐτοῖς)의 관계는 한국어에서 자연스럽게 수거 행위로 표현할 수 있습니다.
