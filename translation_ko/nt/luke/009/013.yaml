review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 명령문의 명시적 복수 주어 ὑμεῖς의 강조를 한국어 본문과 각주에서 드러내는 것이 좋습니다. 또한 λαόν은 여기서 집단을 가리키므로 자연스러운 현대 한국어로는 ‘이 모든 사람’을 쓰되, ‘무리’라는 대안을 각주로 보존할 수 있습니다.
  naturalness: 초안의 의미는 자연스럽지만, 합쇼체 목표에 맞추어 직접 인용문의 명령을 ‘주십시오’로 통일하고, ‘사오지 않는 한 말입니다’보다 ‘사지 않는 한입니다’로 다듬으면 더 매끄럽습니다. ‘이 모든 백성’은 현대 한국어에서는 다소 문어적·정치적으로 들릴 수 있습니다.
  terminology: ἄρτοι와 ἰχθύες는 각각 ‘빵 다섯 개’와 ‘물고기 두 마리’로 정확합니다. βρώματα는 ‘먹을 것’이 적절합니다. λαός는 특정 신학적 의미를 강요하지 않고 ‘사람’으로 옮겼습니다.
  issues:
  - severity: low
    issue: ὑμεῖς의 강조가 본문에서 충분히 드러나지 않습니다.
    rationale: 명시된 2인칭 복수 대명사는 강조를 지닙니다. ‘여러분이’와 대체 각주로 이를 반영할 수 있습니다.
  - severity: low
    issue: 직접 인용문의 명령이 목표 합쇼체와 일치하지 않습니다.
    rationale: ‘주어라’는 해라체이므로, 지정된 현대 정중체에 맞춰 ‘주십시오’로 고칩니다.
  - severity: low
    issue: ‘이 모든 백성’은 현대 표준어에서 다소 부자연스럽습니다.
    rationale: λαός의 집단적 의미는 ‘이 모든 사람’으로 자연스럽게 전달되며, ‘무리’는 각주 대안으로 제시할 수 있습니다.
  revised_text: 예수께서 그들에게 말씀하셨습니다. 「여러분이 그들에게 먹을 것을 주십시오.」 그러자 그들이 말했습니다. 「우리에게는 빵 다섯 개와 물고기 두 마리밖에 없습니다. 우리가 가서 이 모든 사람에게[a] 먹을 것을 사지 않는 한은 말입니다.」
  revised_footnotes:
  - marker: a
    text: 또는 ‘이 모든 무리에게’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분 자신이 그들에게 먹을 것을 주십시오.’
    reason: lexical_alternative
  revision_rationale: 합쇼체를 유지하면서 예수님의 명령에 있는 ὑμεῖς의 강조를 ‘여러분이’로 반영했습니다. λαός는 현대적인 ‘사람’으로 옮기고 가능한 ‘무리’의 뉘앙스는 각주로 보존했습니다. 단, 강조 각주 b는 본문에 앵커가 없으므로 구조적 일관성을 위해 본문에 해당 표지를 추가해야 합니다.
