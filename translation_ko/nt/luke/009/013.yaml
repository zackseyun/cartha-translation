  language: ko
  text: 예수께서 그들에게 이르셨습니다. 「너희가 그들에게 먹을 것을 주어라.」 그들이 대답하였습니다. 「우리에게는 빵 다섯 개와 물고기 두 마리밖에 없습니다 — 우리가 가서 이 모든 백성을 위하여 먹을 것을 사오지 않는 한 말입니다.」
  philosophy: optimal-equivalence
