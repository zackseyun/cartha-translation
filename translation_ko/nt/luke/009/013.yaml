translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “너희가 그들에게 먹을 것을 주십시오.” 그러자 그들이 말했습니다. “우리에게는 빵 다섯 개와 물고기 두 마리밖에 없습니다. 우리가 가서 이 모든 사람들을 위해 먹을 것을 사지 않는다면 모르겠습니다.”
