  source_fidelity: 초안의 ‘~에게만’은 원문의 조건절에 없는 제한(‘only’)을 더하므로 삭제해야 합니다. 또한 παρ’ ὧν ἐλπίζετε λαβεῖν은 빌려준 대상에게서 돌려받기를 기대한다는 관계를 나타내므로 ‘돌려받기를 기대하는 사람들에게’로 명시하는 편이 충실합니다. ‘같은 금액을 돌려받으려고’는 τὰ ἴσα 및 ἵνα ἀπολάβωσιν을 적절히 반영합니다.
  naturalness: 초안은 ‘자’, ‘하느냐’, ‘느니라’가 혼재되어 지정된 현대 합쇼체에 맞지 않습니다. 조건문과 수사 의문문 및 서술문을 모두 현대적 합쇼체로 정리했습니다.
  terminology: χάρις는 이 문맥에서 구원론적 ‘은혜’가 아니라 도덕적 인정 또는 칭찬의 뜻입니다. 본문은 자연스러운 ‘칭찬’으로 옮기고, 가능한 ‘감사’의 어휘적 대안을 각주로 보존했습니다. ‘죄인들’과 ‘같은 금액’은 각각 ἁμαρτωλοί와 τὰ ἴσα를 적절히 전달합니다.
