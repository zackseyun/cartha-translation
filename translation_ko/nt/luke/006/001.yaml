  source_fidelity: 초안의 ‘밀밭’은 σπόριμος가 특정 곡물인 밀을 뜻하지 않으므로 ‘곡식밭’으로 고쳤습니다. ‘이삭을 잘라’도 ἔτιλλον(뜯다, 따다)의 뜻보다 강하고 부정확하여 ‘이삭을 따서’로 고쳤습니다. ‘어느 안식일에’는 관사 없는 ἐν σαββάτῳ의 부정적 용법을 반영합니다.
  naturalness: ‘어느 안식일에 그분께서 … 지나가실 때’와 ‘손으로 비비며 먹고 있었습니다’는 현대 표준 한국어 합쇼체 서술에 자연스럽고, 원문의 진행 중인 행동을 유지합니다.
  terminology: ‘안식일’, ‘제자’, ‘이삭’은 통상적인 성경 번역 용어입니다. 선행 문맥의 지시 대상을 보존하기 위해 원문의 대명사에 맞춰 ‘그분’을 유지했습니다.
  issues:
  - severity: medium
    issue: ‘밀밭’이 곡물의 종류를 특정합니다.
    rationale: σπορίμων은 씨 뿌려 경작한 곡식밭을 가리키며 밀이 명시되어 있지 않습니다.
  - severity: medium
    issue: ‘이삭을 잘라’가 ἔτιλλον의 동작을 정확히 옮기지 못합니다.
    rationale: ἔτιλλον은 이삭을 뜯거나 따는 행위이지, 자르는 행위를 뜻하지 않습니다.
  - severity: low
    issue: 원문의 어휘·문화 설명에 해당하는 각주가 없습니다.
    rationale: ‘이삭’(στάχυας)과 손으로 비벼 먹는 행위(ψώχοντες)의 의미를 짧게 보충하면 독자의 이해를 돕습니다.
  revised_text: 어느 안식일에 그분께서 곡식밭 사이로 지나가실 때, 그분의 제자들은 이삭을 따서[a] 손으로 비비며 먹고 있었습니다.[b]
  revised_footnotes:
