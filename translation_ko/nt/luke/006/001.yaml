source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: Now it happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
  footnotes:
  - marker: a
    text: Or 'ears of grain.' The Greek στάχυας refers to the heads or ears of grain.
    reason: lexical_alternative
  - marker: b
    text: That is, they rubbed the grain in their hands to separate the edible kernels.
    reason: cultural_note
translation:
  language: ko
  text: 어느 안식일에 그분께서 곡식밭 사이로 지나가실 때, 그분의 제자들은 이삭을 따서[a] 손으로 비비며 먹고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡식의 이삭’. 그리스어 στάχυας는 곡식의 이삭 또는 이삭 부분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 제자들은 먹을 수 있는 낟알을 얻기 위해 이삭을 손으로 비볐습니다.
    reason: cultural_note
