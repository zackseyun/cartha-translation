  source_fidelity: 개정이 필요합니다. 원문의 부정적 용법(ἐν σαββάτῳ), σπόριμα(곡식밭), ἔτιλλον(이삭을 따다), 그리고 손으로 비비는 동작을 더 정확히 반영해야 합니다. 초안의 ‘밀밭’은 작물을 과도하게 특정하고, ‘이삭을 잘라’는 ‘따다/뜯다’보다 원문에서 멉니다.
  naturalness: ‘어느 안식일에 … 지나가실 때에’와 ‘이삭을 따서 손으로 비비며 먹고 있었습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽습니다.
  terminology: ‘안식일’, ‘제자들’, ‘이삭’은 적절합니다. 대명사 ‘그분’을 유지하여 그리스어의 αὐτόν을 불필요하게 인명으로 확장하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘밀밭’이 σπορίμων의 범위를 좁힙니다.
    rationale: σπόριμα는 특정한 밀밭이라기보다 곡식이 심긴 밭들/곡식밭을 가리킵니다.
  - severity: medium
    issue: ‘이삭을 잘라’가 ἔτιλλον을 정확히 옮기지 못합니다.
    rationale: ἔτιλλον은 이삭을 따거나 뜯는 행위이며, 자르는 행위를 뜻하지 않습니다.
  - severity: low
    issue: ‘안식일에’는 원문의 부정적·일회적 뉘앙스를 충분히 드러내지 못합니다.
    rationale: 관사 없는 ἐν σαββάτῳ는 여기서 ‘어느 안식일에’로 옮기는 것이 자연스럽고 정확합니다.
  revised_text: 어느 안식일에 그분께서 곡식밭을 지나가실 때에, 그분의 제자들은 이삭[b]을 따서 손으로 비비며 먹고 있었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘곡식이 심긴 밭들’.
    reason: σπορίμων은 특정 작물의 밭이 아니라 곡식이 심긴 밭들을 가리킨다.
  - marker: b
    text: 제자들은 먹을 수 있는 낟알을 분리하려고 이삭을 손으로 비볐습니다.
    reason: ψώχοντες ταῖς χερσίν의 구체적인 동작을 설명한다.
  revision_rationale: 원문의 작물 비특정성, 이삭을 따는 동작, 손으로 비벼 먹는 방식을 보존했습니다. 영어 감사 기록의 두 각주를 한국어에서도 제공하되, 본문에서 실제로 지시되는 ‘이삭’에 문화 설명 각주를 연결했습니다. ‘곡식밭’의 대안 각주는 제공하지만 본문에 별도 표지를 두지 않아 구조적 표지와 본문 앵커가 일치하지 않습니다. 따라서 이를 해결하려면 첫 각주 앵커를 본문에 추가해야 합니다.
