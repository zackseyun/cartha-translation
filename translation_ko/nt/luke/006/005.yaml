  to: 그리고 그들에게 말씀하고 계셨습니다. “인자는 안식일의 주님이십니다.”
  rationale: The revision preserves the Greek assertion and word-level terminology while rendering the christological title κύριος as ‘주님,’ using formal-polite speech throughout, and representing the narrative imperfect without imposing additional interpretation.
