review_pass:
  verdict: revise
  source_fidelity: The draft conveys the fourfold pattern of hostility and retains the title “인자,” but “인자로 인하여” is archaic and its placement can momentarily obscure that the Son of Man is the reason for all the hostility. “너희의 이름을 악하다고 버리다” is not natural modern Korean and does not adequately communicate the idiomatic force of ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν.
  naturalness: A modern formal-polite beatitude is better expressed with “복이 있습니다.” The revised wording uses natural contemporary Korean while retaining the indefinite future sense of ὅταν (“…할 때”).
  terminology: “인자” appropriately preserves the established Gospel title τοῦ υἱοῦ τοῦ ἀνθρώπου. “복” appropriately retains the beatitude register of μακάριοι. “배제하다” and “모욕하다” are suitable formal modern equivalents in this persecution context.
  issues:
  - severity: medium
    issue: Archaic and ambiguously placed causal phrase
    rationale: “인자로 인하여” is not idiomatic modern Korean. Placing “인자 때문에” directly with the coordinated hostile actions makes clear that it supplies the cause indicated by ἕνεκα.
  - severity: medium
    issue: Unnatural rendering of the ‘name’ idiom
    rationale: “너희의 이름을 악하다고 버리다” is not a natural Korean expression. The Greek idiom concerns public repudiation/denunciation of the disciples as evil; “악한 자들이라고 하여 내칠 때” communicates this sense, with a footnote preserving the concrete ‘name’ wording and its interpretive openness.
  - severity: low
    issue: Register of the beatitude conclusion
    rationale: “너희는 복이 있다” is grammatical but less consistent with the requested modern formal-polite 합쇼체 than “너희에게 복이 있습니다.”
  revised_text: 사람들이 인자 때문에 너희를 미워하고, 너희를 배제하며, 모욕하고, 너희를 악한 자들이라고 하여 내칠 때에, 너희에게 복이 있습니다.[a]
  revised_footnotes:
