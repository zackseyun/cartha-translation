  source_fidelity: 초안은 ἔξεστιν(허락되다/합법이다)을 ‘어느 것이 옳으냐’로 옮겨 안식일에 허용되는 행위라는 법적·규범적 물음을 일반적인 도덕 판단으로 바꾸었습니다. 또한 ἀπολέσαι를 ‘죽이는 것’으로 한정하여 ‘멸하다/파괴하다’라는 더 넓은 표현을 좁혔습니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 유지하면서, 병렬 대조와 수사적 질문을 자연스럽게 드러냅니다.
  terminology: ἀγαθοποιῆσαι는 ‘선을 행하다’, κακοποιῆσαι는 문맥상 구체적 위해를 나타내는 ‘해를 끼치다’로, ψυχή는 ‘생명’으로 옮겼습니다. ἀπολέσαι는 불필요하게 ‘죽이다’로 제한하지 않고 ‘멸하다’로 유지했습니다.
  issues:
