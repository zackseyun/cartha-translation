  text: 그러나 예수께서 그들에게 말씀하셨습니다. “내가 너희에게 묻겠습니다. 안식일에 선을 행하거나 해를 끼치는 것, 생명을 구하거나 멸하는 것이 허락됩니까?”
  philosophy: optimal-equivalence
