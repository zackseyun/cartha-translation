- from: 예수께서 그들에게 말씀하셨습니다. 「내가 너희에게 묻겠다. 안식일에 선을 행하는 것과 악을 행하는 것, 생명을 구하는 것과 죽이는 것 중 어느 것이 옳으냐?」
  to: 그러나 예수께서 그들에게 말씀하셨습니다. “내가 너희에게 묻겠습니다. 안식일에 선을 행하거나 해를 끼치는 것, 생명을 구하거나 멸하는 것이 허락됩니까?”
  rationale: 원문의 ἔξεστιν이 제기하는 안식일 규정상 허용 여부를 ‘허락됩니까’로 보존했습니다. 두 부정사 대조의 구조를 유지하되, 한국어에서 자연스럽게 이해되도록 ‘하거나’의 병렬로 옮겼습니다. ‘생명’과 ‘멸하다’는 ψυχή 및 ἀπολέσαι의 문맥상 의미와 어휘적 폭을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:01Z'
