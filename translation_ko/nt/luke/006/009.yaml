    issue: ‘어느 것이 옳으냐?’
    rationale: εἰ ἔξεστιν은 무엇이 허락되는가/합법적인가를 묻는 표현입니다. ‘옳다’는 법적·관행적 허용 여부를 일반 윤리 판단으로 변형합니다.
  - severity: medium
    issue: ‘죽이는 것’
    rationale: ἀπολέσαι는 이 문맥에서 생명의 파괴를 가리키지만, ‘죽이다’는 원문의 ‘멸하다/파괴하다’보다 좁고 해석적인 표현입니다.
