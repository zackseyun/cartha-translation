revisions:
- from: 선한 사람은 마음의 선한 곳간에서 선한 것을 내고, 악한 사람은 악한 곳간에서 악한 것을 낸다. 마음에서 넘치는 것을 그 입이 말하기 때문이다.
  to: 선한 사람은 자기 마음의 선한 보물에서 선한 것을 내고, 악한 사람은 자기의 악한 보물에서 악한 것을 냅니다. 이는 마음에 넘치는 것[a]에서 그의 입이 말하기 때문입니다.
