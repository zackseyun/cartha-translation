review_pass:
  verdict: revise
  source_fidelity: The draft preserves the antithetical structure and the explicit image of the mouth speaking from the heart's overflow. However, 곳간 means chiefly a granary or storehouse and is less faithful to the metaphorical force of θησαυρός ('treasure') in this context. The possessive reference in both clauses is also clearer when retained.
  naturalness: The draft is generally clear, but '마음의 선한 곳간' is stiff and can evoke a literal granary. '자기 마음의 선한 보물' is natural Korean while retaining the source metaphor. The revised wording maintains modern formal-polite 합쇼체.
  terminology: 선한/악한 appropriately retains the ethical contrast of ἀγαθός and πονηρός. 보물 is preferable here for θησαυρός. '마음에 넘치는 것' accurately conveys περισσεύματος καρδίας; an alternative of '풍성함' is supplied in a footnote.
  issues:
  - severity: medium
    issue: 곳간 for θησαυρός
    rationale: 곳간 is a possible 'storehouse' rendering but commonly denotes a physical grain store. The Greek uses 'treasure' as an inward moral metaphor; 보물 better preserves that image and is more idiomatic in this sentence.
  - severity: low
    issue: Possessive reference is not explicit in the second clause
    rationale: The Greek's second 'evil [treasure]' is understood as the evil person's own treasure. Adding 자기의 makes the parallel and referent clear without adding meaning.
  revised_text: 선한 사람은 자기 마음의 선한 보물에서 선한 것을 내고, 악한 사람은 자기의 악한 보물에서 악한 것을 냅니다. 이는 마음에 넘치는 것[a]에서 그의 입이 말하기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘마음의 풍성함’.
    reason: lexical_alternative
  revision_rationale: ‘곳간’을 ‘보물’로 바꾸어 θησαυρός의 비유적 의미를 보존하고, 양 절의 소유 관계를 분명히 했습니다. 원문의 반복과 대조, 그리고 ‘마음의 넘침에서 입이 말한다’는 표현을 유지했습니다.
