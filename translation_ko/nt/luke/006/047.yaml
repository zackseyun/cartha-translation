  source_fidelity: 원문의 πᾶς ὁ ἐρχόμενος ... καὶ ἀκούων ... καὶ ποιῶν의 포괄적·일반적 진술과 미래형 ὑποδείξω는 대체로 반영했습니다. 그러나 초안의 ‘모든 자가 누구와 같은지’는 문장상 ‘모든 자’가 비교의 주체임은 알 수 있으나 다소 어색하고, 현대 한국어에서는 명시적으로 자연스럽게 다듬는 편이 좋습니다.
  naturalness: ‘모든 자’와 ‘보여 주겠다’는 각각 문어적·해라체 표현입니다. 요청된 현대 표준어 합쇼체에 맞추어 ‘모든 사람’ 및 ‘보여 드리겠습니다’로 고쳤습니다.
  terminology: ‘내 말’, ‘듣고’, ‘행하는’은 λόγοι, ἀκούων, ποιῶν을 과도한 해석 없이 충실히 옮깁니다. 한국어는 원문의 일반적 남성 단수를 문법적으로 표시하지 않으므로 별도 성별 관련 주석은 필요하지 않습니다.
  issues:
