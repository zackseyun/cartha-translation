  - severity: low
    issue: ‘모든 자가 누구와 같은지’의 현대성 및 문장 자연스러움
    rationale: 의미는 전달되지만 ‘자’는 현대 산문에서 다소 경직되어 보입니다. ‘모든 사람이 누구와 같은지’가 원문의 일반적 범위와 비교 구문을 더 자연스럽게 드러냅니다.
