  text: 그는 집을 짓는 사람과 같습니다. 그 사람은 땅을 깊이 파고 반석 위에 기초를 놓았습니다. 홍수가 나서 강물이 그 집에 세차게 들이쳤으나, 그 집은 잘 지어졌기 때문에 강물은 그것을 흔들 수 없었습니다.
