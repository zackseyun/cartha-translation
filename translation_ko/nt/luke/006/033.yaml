  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
  footnotes:
  - marker: a
    text: Or 'what grace is that to you?' The Greek word can mean 'grace,' 'favor,' 'thanks,' or 'credit'; here it refers to commendation for reciprocal kindness.
    reason: lexical_alternative
translation:
