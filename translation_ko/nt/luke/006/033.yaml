  text: 너희에게 선을 행하는 이들에게 너희도 선을 행한다면, 너희에게 무슨 칭찬[a]이 있겠습니까? 죄인들도 똑같이 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무슨 은혜가 있겠습니까?’ 그리스어 ‘카리스’는 ‘은혜’, ‘호의’, ‘감사’, ‘칭찬/공로’를 뜻할 수 있습니다. 여기서는 보답으로 행한 선에 대한 칭찬이나 공로를 가리킵니다.
    reason: lexical_alternative
