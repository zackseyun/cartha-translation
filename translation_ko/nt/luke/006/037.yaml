  terminology: ‘정죄하다’ appropriately preserves the stronger force of καταδικάζω in contrast to ‘판단하다’ for κρίνω. ‘용서하다’ is a natural contextual rendering of ἀπολύω; the note records its broader lexical range without imposing a narrower interpretation as the only possible sense.
