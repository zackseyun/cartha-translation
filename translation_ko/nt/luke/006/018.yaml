  naturalness: ‘자기들의 병을 고침받으려고’는 현대 표준어에서 다소 어색하고, 무엇이 고침을 받는지 잠시 불분명할 수 있습니다. ‘그들의 병에서 고침을 받기 위해’가 자연스럽고 명료합니다. 나머지 문장은 합쇼체 서술 문맥에 적합합니다.
