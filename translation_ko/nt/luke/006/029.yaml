revisions:
- from: 너의 뺨을 치는 자에게 다른 뺨도 내어 주라. 너의 겉옷을 빼앗는 자에게는 속옷도 거절하지 말라.
  to: 뺨을 치는 사람에게 다른 쪽 뺨도 내어 주십시오. 겉옷을 가져가는 사람에게 속옷도 내주기를 거절하지 마십시오.
  rationale: 누가복음의 πάρεχε를 마태복음의 익숙한 표현인 ‘돌려 대다’로 조화시키지 않고 ‘내어 주십시오’로 옮겼습니다. 두 의복의 구별은 유지했으며, δεύτε 절의 κωλύω는 문맥에 맞게 ‘내주기를 거절하지 마십시오’로 명료화했습니다. 한국어에서는 이러한 일반적 상황에서 소유대명사를 생략해도 의미가 자연스럽고 원문의 일반적 두 번째 인칭 명령의 범위를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:03Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘다른 뺨도 내어 주라’는 πάρεχε καὶ τὴν ἄλλην의 뜻을 대체로 잘 반영합니다. 다만 두 번째 절의 ‘속옷도 거절하지 말라’는 무엇을 거절하지 말라는 것인지 불분명하며, μὴ κωλύσῃς의 ‘막지 말라/내주기를 거절하지 말라’라는 뜻을 더 명료하게 나타낼 필요가 있습니다.
  naturalness: 명령형 ‘-라’는 지정된 현대 합쇼체와 맞지 않습니다. 또한 ‘속옷도 거절하지 말라’는 현대 한국어에서 어색하고 의미상 목적어가 불완전합니다. ‘내주기를 거절하지 마십시오’가 자연스럽습니다.
  terminology: ἱμάτιον과 χιτών의 구별을 ‘겉옷’과 ‘속옷’으로 유지한 것은 적절합니다. σιαγών의 문맥상 의미는 ‘뺨’으로 자연스럽게 옮길 수 있으며, 생략된 명사를 밝혀 ‘다른 쪽 뺨’으로 하는 것이 명확합니다.
  issues:
  - severity: medium
    issue: 문체가 합쇼체가 아니라 해라체입니다.
    rationale: ‘내어 주라’, ‘말라’는 해라체 명령형입니다. 요청된 표준어 현대 합쇼체에는 ‘내어 주십시오’, ‘마십시오’가 적합합니다.
  - severity: medium
    issue: ‘속옷도 거절하지 말라’가 문법·의미상 부자연스럽습니다.
    rationale: κωλύσῃς는 상대가 속옷을 가져가는 것을 막거나 속옷을 내주기를 거절하지 말라는 뜻입니다. ‘속옷’을 직접 ‘거절하다’라고 하면 무엇을 거절하는지 불명확합니다.
  revised_text: 뺨을 치는 사람에게 다른 쪽 뺨도 내어 주십시오. 겉옷을 가져가는 사람에게 속옷도 내주기를 거절하지 마십시오.
