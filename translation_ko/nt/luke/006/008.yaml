  source_fidelity: 원문의 αὐτὸς δέ, ᾔδει, διαλογισμούς, 손이 마른 사람, 두 단계 명령(Ἔγειρε· στῆθι), 그리고 그 사람의 순종을 대체로 충실히 옮겼습니다. 다만 인용문 종결의 ‘서라’는 지정된 현대 합쇼체와 맞지 않으며, ‘가운데로 나와 서라’의 ‘나와’는 εἰς τὸ μέσον의 이동 방향을 자연스럽게 드러내기는 하나 본문에 명시된 ‘나오다’를 다소 보탭니다.
  naturalness: ‘손이 마른 그 사람’은 성경 문체에서는 이해되지만 현대 표준어에서는 ‘손이 말라 있는 사람’이 더 자연스럽고, ξηράν의 ‘withering’ 상태도 보존합니다. 직접 명령은 ‘일어나 가운데에 서십시오’로 하면 합쇼체를 일관되게 유지하면서도 간결합니다.
  terminology: ‘생각’은 διαλογισμούς의 무표적이고 자연스러운 번역입니다. ‘손이 말라 있는 사람’은 신체 부위가 위축·마른 상태라는 ξηράν의 묘사를 유지하며, 병명이나 원인을 덧붙이지 않습니다.
