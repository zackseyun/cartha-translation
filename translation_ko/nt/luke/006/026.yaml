review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional warning, universal scope ('모든 사람'), the comparison with false prophets, and the habitual past sense. However, '너희를 잘 말할' is not idiomatic Korean for καλῶς ... εἴπωσιν and can suggest speaking correctly rather than speaking favorably. The final clause can more clearly express the dative-directed action and the iterative comparison.
  naturalness: '''모든 사람이 너희를 좋게 말할 때에'' is natural modern Korean for ''when all people speak well of you.'' ''화가 있습니다'' maintains the prophetic ''woe'' formula in a formal-polite register; the surrounding verbs are correspondingly rendered in 합쇼체.'
  terminology: '''거짓 예언자들'' is an accurate, established rendering of ψευδοπροφῆται. ''조상들'' naturally conveys ''their fathers'' in its biblical intergenerational sense without implying only immediate male parents.'
  issues:
  - severity: medium
    issue: '''너희를 잘 말할'' is semantically and idiomatically weak.'
    rationale: In contemporary Korean, '잘 말하다' commonly concerns speaking skillfully/correctly. The Greek idiom means to speak positively or favorably about someone.
  - severity: low
    issue: The final clause's formal register and comparative force can be sharpened.
    rationale: '''똑같이 하였습니다'' preserves the habitual past and is more natural in 합쇼체 than the mixed-style ''행하였느니라''; adding ''도'' clarifies that the ancestors likewise acted toward the false prophets.'
  revised_text: 모든 사람이 너희를 좋게 말할 때에, 너희에게 화가 있습니다. 그들의 조상들도 거짓 예언자들에게 똑같이 하였습니다.
