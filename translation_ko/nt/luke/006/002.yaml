  terminology: ‘바리새인’과 ‘안식일’은 표준적인 성서 용어입니다. ἔξεστιν의 법적·규범적 허용 의미는 ‘해서는 안 되는 일’로 자연스럽게 전달됩니다. 그리스어의 복수형 ‘안식일들’은 한국어에서 통상 단수로 옮기되 각주로 밝혔습니다.
