    rationale: 한국어 본문에서는 관용적으로 ‘안식일에’가 자연스럽지만, 원문의 복수형과 영어 감사 기록의 투명성을 위해 각주로 설명하는 것이 적절합니다.
  revised_text: 그런데 몇몇 바리새인이 말했습니다. “왜 안식일에 해서는 안 되는 일을 하십니까?”
