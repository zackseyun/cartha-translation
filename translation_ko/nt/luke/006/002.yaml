  terminology: '''바리새인''과 ''안식일''은 표준적인 명칭입니다. ἔξεστιν의 규범적 의미는 ''해서는 안 되는''으로 무리 없이 전달됩니다. 한국어에서는 안식일을 단수로 쓰는 것이 자연스러우며, 그리스어의 복수형은 이 문맥에서 통상적인 안식일 관용 표현입니다.'
