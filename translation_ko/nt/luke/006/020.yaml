  source_fidelity: 그리스어의 핵심 의미는 대체로 반영했으나, 인용문의 닫는 부호가 누락되어 있으며 문장 종결과 인용 형식을 바로잡아야 합니다. οἱ πτωχοί는 ‘가난한 이들’로 옮겨 마태복음의 ‘심령이 가난한’ 표현을 덧붙이지 않았습니다. 뒤따르는 ὑμετέρα는 ‘너희의 것’으로 유지하여 제자들을 향한 직접 خطاب을 보존했습니다.
  naturalness: ‘눈을 들어 제자들을 보시며’는 자연스럽지만 ‘바라보시며’가 현대 표준 한국어에서 시선의 방향을 더 매끄럽게 드러냅니다. 직접 인용 안에서는 합쇼체에 맞추어 ‘복이 있습니다’, ‘것이기 때문입니다’로 종결하는 것이 적절합니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ의 통용되고 정확한 번역입니다. ‘가난한 이들’은 πτωχοί의 일반적 의미를 보존하며 경제적·사회적 의미를 ‘심령’ 등의 해석으로 한정하지 않습니다.
