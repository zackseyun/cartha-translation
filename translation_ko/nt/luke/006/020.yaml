    rationale: 의미 변화 없이 현대 한국어의 자연스러움을 높입니다.
  revised_text: 그분께서 눈을 들어 제자들을 바라보시며 말씀하셨습니다. 「가난한 이들은 복이 있습니다. 하나님의 나라가 너희의 것이기 때문입니다.」
  revised_footnotes:
