  source_fidelity: 개정이 필요합니다. 초안의 ‘가난한 자들이여’는 그리스어 οἱ πτωχοί(‘가난한 이들/가난한 사람들’)의 서술적 복 선언을 한국어 호격으로 바꾸어 문법과 의미를 어색하게 만듭니다. 이어지는 ὑμετέρα(‘너희의/여러분의’)의 직접 خطاب은 ‘여러분’으로 자연스럽게 보존했습니다. ἐπάρας ... εἰς의 시선 동작도 ‘눈을 들어 제자들을 바라보시며’로 충실히 옮겼습니다.
  naturalness: 초안은 ‘복이 있다’의 종결이 현대 합쇼체와 맞지 않고, 인용부호가 닫히지 않았습니다. ‘복이 있습니다’, ‘여러분의 것이기 때문입니다’로 현대 표준어 합쇼체를 일관되게 적용했습니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ의 확립된 한국어 성경 용어이며, 본문에 없는 ‘심령이’ 등의 해석적 보충을 하지 않았습니다.
  issues:
  - severity: high
    issue: ‘가난한 자들이여’가 οἱ πτωχοί를 호격으로 변경함
    rationale: 원문은 정관사+형용사의 복 선언이며, 호격은 아닙니다. 뒤의 소유대명사가 청자를 직접 가리키므로 한국어에서는 ‘가난한 여러분’이 자연스럽게 그 담화 기능을 드러냅니다.
  - severity: medium
    issue: 현대 합쇼체 종결 불일치 및 닫는 인용부호 누락
    rationale: ‘복이 있다’는 초안의 ‘말씀하셨습니다’와 종결 높임이 일치하지 않으며, 인용문이 구조적으로 닫히지 않았습니다.
  revised_text: 그분께서 눈을 들어 제자들을 바라보시며 말씀하셨습니다. 「가난한 여러분은 복이 있습니다. 하나님의 나라가 여러분의 것이기 때문입니다.」
