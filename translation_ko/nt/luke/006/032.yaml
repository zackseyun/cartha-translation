  text: 너희를 사랑하는 이들을 너희가 사랑한다면, 너희에게 무슨 공로가 있겠습니까?[a] 죄인들도 자기를 사랑하는 이들을 사랑합니다.
  philosophy: optimal-equivalence
  footnotes:
