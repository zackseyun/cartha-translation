  source_fidelity: 초안의 '자만'은 헬라어에 없는 '오직'의 한정 의미를 명시적으로 더합니다. 상호성의 대조는 문맥상 분명하지만, 본문 자체는 단지 '너희를 사랑하는 이들을 사랑한다면'이라고 말하므로 한정을 삭제하는 것이 원문에 더 충실합니다. χάρις는 여기서 구원론적 '은혜'라기보다 칭찬받을 만함/공로의 뜻이며, '공로'는 그 수사적 질문을 적절히 드러냅니다.
  naturalness: '''너희를 사랑하는 이들을 너희가 사랑한다면''은 반복을 보존하면서도 현대 표준어로 자연스럽습니다. 질문은 합쇼체 ''있겠습니까?''로, 서술은 ''사랑합니다''로 통일했습니다.'
  terminology: ἀγαπάω의 세 차례 반복은 모두 '사랑하다'로 유지했습니다. ἁμαρτωλοί는 통상적이고 원문의 도덕적 범주를 보존하는 '죄인들'로 옮겼습니다. χάρις의 문맥적 의미는 본문에서 '공로'로, 가능한 어휘 범위는 각주에서 밝혔습니다.
