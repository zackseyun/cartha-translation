  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
  footnotes:
  - marker: a
    text: Or 'what grace is that to you?' The Greek word can mean 'grace,' 'credit,' or 'favor'; here it refers to what is commendable.
