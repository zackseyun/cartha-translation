    text: 또는 “너희에게 무슨 은혜가 있겠습니까?” 헬라어 ‘카리스’는 ‘은혜’, ‘호의’, ‘공로/칭찬받을 만함’을 뜻할 수 있습니다. 여기서는 사랑을 되갚는 일에 특별히 칭찬받을 만한 점이 있는지를 묻습니다.
