review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘산에서’는 이 절의 그리스어 본문에 없는 지형 정보를 보충하므로 삭제해야 합니다. καταβὰς는 ‘그들과 함께 내려오셔서’로 충분히 옮길 수 있습니다. ἐπὶ τόπου πεδινοῦ는 ‘평평한 곳에’로 옮겨 원문의 지형 표현을 보존했습니다. 두 무리(제자들의 큰 무리 / 백성의 큰 무리)와 각 지역으로부터 왔다는 수식 관계도 반영했습니다.
  naturalness: ‘제자들의 큰 무리’와 ‘백성의 큰 무리’는 현대 표준어에서 자연스럽고, 합쇼체 서술에도 적절합니다. 두 번째 문장을 ‘있었습니다’로 처리하여 원문의 명사구 나열을 한국어 문장으로 매끄럽게 재구성했습니다.
  terminology: ‘유대’, ‘예루살렘’, ‘두로’, ‘시돈’은 통용되는 성경 지명 표기입니다. λαός는 불필요하게 계층화하지 않고 ‘백성’으로, παράλιος는 ‘해안 지방’으로 옮겼습니다.
  issues:
