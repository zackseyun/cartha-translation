    rationale: ‘평지’는 유효한 번역이지만 다소 넓은 지형적 의미로 들릴 수 있습니다. 본문을 ‘평평한 곳’으로 하고 ‘평지’를 대안으로 제시하면 원문의 표현과 번역 선택지를 함께 보존합니다.
