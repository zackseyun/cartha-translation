  source_fidelity: 원문의 두 분사구(‘지금 굶주리는’, ‘지금 우는’)와 각각의 미래 2인칭 복수 동사(‘너희가 배부르게 될 것이다’, ‘너희가 웃을 것이다’)가 나타내는 직접 호소를 유지해야 합니다. 초안의 ‘굶주린 자들이여/우는 자들이여’도 뜻은 통하지만, 이어지는 ‘너희가’와 결합될 때 원문의 문장 흐름보다 표지된 호격 표현이 됩니다. ‘지금 굶주리는 너희’와 ‘지금 우는 너희’가 직접 주소와 현재적 상태를 더 자연스럽게 보존합니다.
  naturalness: ‘복이 있다’, ‘것이기 때문이다’는 현대 표준 합쇼체의 종결 표현으로는 다소 비격식적·문어적입니다. ‘복이 있습니다’, ‘때문입니다’로 통일하면 요청된 현대 정중체에 맞습니다.
  terminology: μακάριοι는 복 선언의 관용적 표현인 ‘복이 있습니다’로, χορτασθήσεσθε는 음식의 구체적 이미지를 살린 ‘배부르게 될 것입니다’로, γελάσετε는 해석적으로 ‘기뻐할’로 바꾸지 않고 ‘웃게 될 것입니다’로 옮깁니다.
  issues:
