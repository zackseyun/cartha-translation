    rationale: ἐν τῷ οὐρανῷ is most directly "하늘에," locating the reward in heaven.
  - severity: low
    issue: The final clause is archaic and less natural in modern Korean.
    rationale: '"예언자들에게 똑같이 하였습니다" retains the Greek''s compressed, non-specific ποιέω expression while using current formal Korean.'
