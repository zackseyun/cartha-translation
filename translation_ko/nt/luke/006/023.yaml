  source_fidelity: The draft preserves the overall sense, including the commands to rejoice and leap, the great heavenly reward, and the comparison with the treatment of the prophets. However, "하늘에서" can suggest that the reward comes from heaven, whereas ἐν τῷ οὐρανῷ states its location/sphere, "in heaven." The final clause is best rendered with a natural Korean verb while retaining the deliberately unspecified hostile action indicated by ποιέω.
