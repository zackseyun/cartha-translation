review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the central contrast between hearing and not doing, the house without a foundation, the river's impact, immediate collapse, and the greatness of the resulting ruin. However, the final expression "그 집의 무너짐이 컸다" is unnatural Korean and does not clearly convey ῥῆγμα as the ruin/destruction resulting from collapse. The stray closing quotation mark is also a textual defect.
  naturalness: 'Modern formal-polite register is not consistently maintained: the draft uses plain narrative endings ("무너졌고," "컸다") despite the specified 합쇼체. "강물이 부딪치자" is understandable, but "강물이 그 집에 부딪치자" more clearly represents the Greek relative clause. "그 집의 파괴는 컸습니다" is formal and idiomatic enough in this context.'
  terminology: '"기초" appropriately renders θεμέλιον. "행하다" is a suitable concise rendering of ποιέω in this context. "파괴" communicates the contextual sense of ῥῆγμα without imposing a more specific interpretation such as total destruction.'
  issues:
  - severity: medium
    issue: The final clause is awkward and semantically imprecise.
    rationale: '"그 집의 무너짐이 컸다" is not natural modern Korean. The Greek ῥῆγμα denotes the resulting break, ruin, or destruction; "그 집의 파괴는 컸습니다" expresses this naturally while retaining "great."'
  - severity: medium
    issue: Register is inconsistent with the required modern formal-polite style.
    rationale: The draft ends its narrative clauses in plain style ("무너졌고," and "컸다") while the required target register is 합쇼체. The revision consistently uses "-습니다."
  - severity: low
    issue: There is an unmatched closing quotation mark.
    rationale: The final "」" has no opening counterpart and must be removed.
  revised_text: 그러나 듣고 행하지 않는 사람은 기초 없이 땅 위에 집을 지은 사람과 같습니다. 강물이 그 집에 부딪치자 그 집은 곧 무너졌고, 그 집의 파괴는 컸습니다.
