review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the adversative πλὴν, the direct woe to the rich, and the causal clause. However, its shift from the modern formal-polite target register to the intimate plural pronoun 너희 requires correction. The adverb 이미 is defensible only if ἀπέχετε is understood in its idiomatic ‘receive in full’ sense; a footnote should preserve the present-oriented alternative.
  naturalness: ‘부유한 자들이여’ followed by ‘너희’ is stylistically mixed and not suitable for modern formal-polite Korean. ‘부유한 여러분’ consistently maintains respectful direct address. ‘화가 있습니다’ retains the compact prophetic formula, though it is necessarily somewhat elevated in tone.
  terminology: ‘위로’ is an appropriate rendering of παράκλησις. A note gives ‘위안’ as a viable alternative. ‘다 받았습니다’ represents the possible πλήρης/settled-receipt force of ἀπέχω without adding an eschatological explanation.
  issues:
  - severity: medium
    issue: 'Register mismatch: ‘너희’'
    rationale: The requested target is modern formal-polite 합쇼체. The intimate/plural pronoun 너희 conflicts with that register, especially alongside the vocative-like ‘자들이여.’
  - severity: low
    issue: The interpretive force of 이미 is unmarked
    rationale: ἀπέχετε is present indicative and can mean either that they are receiving their consolation or, idiomatically, that they have received it in full. Since the Korean main text adopts the latter sense, a note should preserve the alternative.
  revised_text: 그러나 부유한 여러분에게는 화가 있습니다. 여러분은 여러분의 위로를 다 받았습니다[a][b].
  revised_footnotes:
  - marker: a
    text: 또는 “여러분은 여러분의 위로를 받고 있습니다.” 여기의 동사는 ‘받다’라는 현재의 뜻과 ‘전부 받다’라는 관용적 뜻을 모두 지닐 수 있습니다.
    reason: Preserves the temporal and idiomatic ambiguity of ἀπέχετε.
  - marker: b
    text: 또는 “위안.”
    reason: Lexical alternative for παράκλησις.
  revision_rationale: The revision consistently uses modern formal-polite address, retains the direct prophetic warning without adding an explanation of why wealth incurs it, and marks the debated present/full-receipt nuance of ἀπέχετε in a footnote.
