review_pass:
  verdict: revise
  source_fidelity: The adversative and direct warning are retained, but the draft's "이미" (already) resolves ἀπέχετε more strongly than necessary. The present verb can denote possessing/receiving in full, but the wording should not make that temporal inference explicit in the main text without a note.
  naturalness: '"부유한 자들이여" is archaic and sits awkwardly with the required modern formal-polite register; "너희에게 화가 있다" is also in plain style rather than 합쇼체. A direct modern formal rendering is more natural.'
  terminology: '"화" suitably conveys the prophetic/judgment force of οὐαί, and "위로" is an appropriate rendering of παράκλησις. "부유한 여러분" clearly renders the addressed rich class in modern Korean.'
  issues:
  - severity: medium
    issue: Register and address are inconsistent with modern formal-polite Korean.
    rationale: The vocative "부유한 자들이여" and predicate "화가 있다" use archaic/plain forms, whereas the requested target is modern formal-polite 합쇼체.
  - severity: medium
    issue: '"이미" over-specifies the temporal force of ἀπέχετε.'
    rationale: Although ἀπέχω may idiomatically imply receipt in full, the Greek present can also express present possession/receipt. The main text should preserve that lexical tension; the 'in full' sense is best supplied in a footnote.
  revised_text: 그러나 부유한 여러분에게 화가 있습니다. 여러분은 여러분의 위로를 받고 있기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “여러분은 여러분의 위로를 이미 다 받았습니다.” ἀπέχω는 받기로 한 것을 전부 받았다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “위안.”
    reason: lexical_alternative
  revision_rationale: The revision uses consistent 합쇼체 and a modern direct address. It retains the prophetic force of οὐαί as "화가 있습니다" and renders the present ἀπέχετε with a present-oriented Korean expression, while preserving the idiomatic 'received in full' alternative in a footnote rather than imposing it on the main text.
