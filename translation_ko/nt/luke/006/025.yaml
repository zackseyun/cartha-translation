  terminology: ‘화’는 οὐαί의 예언적 심판 경고를 적절히 보존합니다. ‘배부른’, ‘굶주리게’, ‘애통하고 울게’는 각각 원문의 구체성과 두 동사의 병치를 잘 반영합니다.
