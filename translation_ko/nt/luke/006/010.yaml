  source_fidelity: 그리스어의 순서와 핵심 의미는 대체로 충실합니다. περιβλεψάμενος πάντας αὐτούς는 ‘그들을 모두 둘러보신 뒤’로, ἀπεκατεστάθη는 ‘회복되었습니다’로 옮겨 복원 의미를 유지하는 것이 적절합니다.
  naturalness: 서술은 현대 한국어 합쇼체에 대체로 맞지만, 직접 명령인 ‘내밀어라’는 반말체이므로 목표 등록에 맞지 않습니다. ‘내미십시오’로 고쳐야 합니다. ‘그가 그대로 하자’는 명령을 수행한 뒤 이어지는 결과를 자연스럽게 연결합니다.
  terminology: ‘손’은 χείρ의 문맥상 적절한 번역이며, ‘회복되었습니다’는 치유로 한정하지 않고 ἀποκαθίστημι의 복원 의미를 보존합니다. 호칭 ‘그분’은 원문의 대명사에 상응하며, 앞 문맥에서 지시 대상이 분명하다는 전제에서는 유지할 수 있습니다.
