id: LUK.23.14
reference: Luke 23:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
  footnotes:
  - marker: a
    text: Or, “as one who was turning the people away.” The Greek verb can mean to turn away or lead astray.
    reason: lexical_alternative
  - marker: b
    text: Or, “I found in this man no guilt regarding the things of which you accuse him.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「당신들은 이 사람을 백성을 미혹하는 자로[a] 내게 데려왔습니다. 보십시오, 내가 여러분 앞에서 그를 심문해 보니, 여러분이 그를 고발하는 일들에 관하여 이 사람에게서 아무런 근거도 찾지 못했습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성을 돌아서게 하는 자로.’ 이 동사는 ‘돌아서게 하다’ 또는 ‘잘못 이끌다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 사람에게서 여러분이 그를 고발하는 일들에 관하여 아무런 죄도 찾지 못했습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: προσηνέγκατέ μοι
  english_pob_choice: You brought ... to me
  chosen_korean: 내게 끌고 왔습니다
  alternatives_korean:
  - 내게 데려왔습니다
  - 내게 가져왔습니다
  lexicon: BDAG
  rationale: 재판 장면의 동작을 자연스럽게 드러내되, 단순 이동보다 피고를 심문 자리로 이송한 뉘앙스를 살리기 위해 ‘끌고 왔습니다’를 택했습니다.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  english_pob_choice: as one who was misleading the people
  chosen_korean: 백성을 미혹하는 자로
  alternatives_korean:
  - 백성을 돌이키는 자로
  - 백성을 잘못 이끄는 자로
  lexicon: BDAG
  rationale: ἀποστρέφω의 ‘돌이키다/미혹하다’ 범위를 반영하되, 여기서는 고발 취지인 ‘미혹’이 법정 맥락에 가장 잘 맞습니다.
- source_word: ἐνώπιον ὑμῶν
  english_pob_choice: before you
  chosen_korean: 여러분 앞에서
  alternatives_korean:
  - 여러분의 앞에서
  - 여러분의 면전에서
  lexicon: BDAG
  rationale: 공개된 심문 상황을 드러내는 표현으로, 현대 한국어에서 가장 자연스럽고 직접적인 대응어입니다.
- source_word: ἀνακρίνας
  english_pob_choice: after examining him
  chosen_korean: 심문해 보니
  alternatives_korean:
  - 조사해 보니
  - 신문해 보니
  lexicon: BDAG
  rationale: ἀνακρίνω의 법정적 의미를 살려 ‘심문하다’로 옮기고, 결과 발견을 자연스럽게 이어 주기 위해 ‘-해 보니’를 붙였습니다.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  english_pob_choice: I found no basis in this man for the charges
  chosen_korean: 이 사람에게서 아무런 근거도 찾지 못했습니다
  alternatives_korean:
  - 이 사람에게서 아무런 죄도 찾지 못했습니다
  - 이 사람 안에서 아무런 근거도 찾지 못했습니다
  lexicon: BDAG
  rationale: αἴτιον을 단정적 ‘죄’로 좁히지 않고, POB의 ‘basis for the charges’를 따라 고발을 지탱할 근거가 없다는 재판적 의미를 유지했습니다.
theological_decisions:
- issue: ἰδοὺ의 화용적 기능
  chosen_reading: ‘보십시오’로 옮겨 판결문식 진술 안의 강조와 청중 환기를 살렸습니다.
  alternative_readings:
  - 보라
  - 보십시오
  rationale: 고어적 ‘보라’보다 현대 합쇼체의 공개적 주의 환기 표현이 장면의 직접성을 더 잘 전달합니다.
  doctrine_reference: '번역 원칙: 원어의 담화 기능 보존'
