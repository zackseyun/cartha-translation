  source_fidelity: 본문의 법정적 어휘와 문장 흐름은 대체로 잘 반영했습니다. 다만 Προσηνέγκατε는 단순히 ‘데려오다/제시하다’이지 강제성을 덧붙이는 ‘끌고 오다’로 단정할 필요는 없습니다. 또한 ἀνακρίνας의 암시된 목적어를 ‘그를’로 밝혀 주는 편이 정확합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. 다만 각주 표지는 해당 표현이나 절에 직접 붙여야 하며, 두 표지를 문장 끝에 함께 두면 어느 표현을 설명하는지 불분명합니다.
  terminology: ‘백성을 미혹하는 자’, ‘심문하다’, ‘고발하다’, ‘근거’는 재판 문맥에 잘 맞습니다. αἴτιον은 여기서 고발을 뒷받침하는 근거나 유죄 사유를 가리키므로 ‘아무런 근거도 찾지 못했습니다’가 적절합니다. 각주 a의 ‘백성을 돌이키는 자’는 한국어로 무엇에게서 돌이키게 하는지 불명확하므로 ‘백성을 돌아서게 하는 자’로 조정했습니다.
