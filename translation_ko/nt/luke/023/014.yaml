  rationale: 원문의 법정적 의미와 현대 합쇼체를 유지하면서, ‘끌고’가 더하는 강제성을 제거하고 심문의 목적어를 명시했습니다. 또한 각주 표지를 설명 대상에 직접 연결하고, 어휘 대안 각주를 자연스러운 한국어로 바로잡았습니다.
