translation:
  language: ko
  text: 군인들도 다가오면서 그에게 신 포도주를 바치며 그를 조롱했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὄξος는 고대의 흔한 값싼 신 포도주를 가리키며, 전통 번역의 「식초」보다 음료라는 점을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  english_pob_choice: mocked
  chosen_korean: 조롱했습니다
  alternatives_korean:
  - 비웃었습니다
  - 놀렸습니다
  lexicon: BDAG
  rationale: ἐμπαίζω는 적대적인 조롱을 뜻하므로, 현대 한국어에서 그 뉘앙스를 가장 자연스럽게 드러내는 「조롱했습니다」를 택했습니다.
- source_word: οἱ στρατιῶται
  english_pob_choice: the soldiers
  chosen_korean: 군인들도
  alternatives_korean:
  - 병사들도
  - 군사들도
  lexicon: BDAG
  rationale: 로마 처형 장면의 주체를 분명히 하면서, προηγούμενο 맥락에 이어 그들도 합류했다는 점을 「-도」로 반영했습니다.
- source_word: προσερχόμενοι
  english_pob_choice: coming up
  chosen_korean: 다가오면서
  alternatives_korean:
  - 다가와서
  - 접근하면서
  lexicon: BDAG
  rationale: 분사로서의 동작 진행을 살리되, 한국어 서술에서는 「다가오면서」가 가장 자연스럽습니다.
- source_word: ὄξος
  english_pob_choice: sour wine
  chosen_korean: 신 포도주
  alternatives_korean:
  - 식초
  - 신 술
  lexicon: BDAG
  rationale: ὄξος는 단순한 조미료 식초보다 저급한 신 포도주를 가리키므로, 독자가 음료임을 이해하도록 「신 포도주」로 옮겼습니다.
theological_decisions:
- issue: 군인들의 행위의 성격
  chosen_reading: 본문의 조롱 장면을 따라가되, 그들이 신 포도주를 바친 행위에 별도의 자비나 잔혹성 판단을 덧붙이지 않았습니다.
  alternative_readings:
  - 동정의 표시로 읽기
  - 순전히 조롱으로만 읽기
  rationale: 문맥상 조롱이 분명하지만, 이 절 자체는 동기 해석을 명시하지 않으므로 사건을 있는 그대로 제시해 긴장을 보존했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘지 않기
