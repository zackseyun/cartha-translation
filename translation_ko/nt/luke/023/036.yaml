  source_fidelity: 주절 ἐνέπαιξαν은 ‘조롱했습니다’로 정확히 옮겼고, οἱ στρατιῶται의 첨가·연속 의미도 ‘군인들도’에 반영되었습니다. προσερχόμενοι와 προσφέροντες의 분사 관계 역시 ‘다가와 … 내밀며’로 자연스럽게 유지됩니다. ὄξος는 ‘신 포도주’가 적절합니다.
  naturalness: 초안의 ‘신 포도주를 바치며’에서 ‘바치다’는 한국어에서 윗사람이나 신성한 대상에게 드리는 공경의 뉘앙스가 강하여, 조롱 장면의 중립적 행위를 부정확하게 만들 수 있습니다. ‘내밀며’가 자연스럽고 문맥에 맞습니다.
  terminology: ‘군인들’, ‘조롱했습니다’, ‘신 포도주’는 현대 표준어 합쇼체와 본문의 어휘·서사적 어조에 잘 맞습니다. 각주에서는 ‘식초’가 전통적 번역어임을 대안으로 제시하되, 음료를 가리킨다는 점을 명확히 하는 것이 좋습니다.
