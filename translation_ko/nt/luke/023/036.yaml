theological_decisions:
- issue: 군인들의 행위의 성격
  chosen_reading: 본문의 조롱 장면을 따라가되, 그들이 신 포도주를 바친 행위에 별도의 자비나 잔혹성 판단을 덧붙이지 않았습니다.
  alternative_readings:
  - 동정의 표시로 읽기
  - 순전히 조롱으로만 읽기
  rationale: 문맥상 조롱이 분명하지만, 이 절 자체는 동기 해석을 명시하지 않으므로 사건을 있는 그대로 제시해 긴장을 보존했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘지 않기
