  lexicon: BDAG
  rationale: 로마 처형 장면의 주체를 분명히 하면서, προηγούμενο 맥락에 이어 그들도 합류했다는 점을 「-도」로 반영했습니다.
- source_word: προσερχόμενοι
  english_pob_choice: coming up
