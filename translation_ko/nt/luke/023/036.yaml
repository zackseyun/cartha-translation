translation:
  language: ko
  text: 군인들도 다가와 그에게 신 포도주를 내밀며 그를 조롱했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신 포도주’에 해당하는 그리스어 ὄξος는 고대에 흔히 마시던 산미 있는 포도주 음료를 가리킵니다. 전통적으로는 ‘식초’로도 번역합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  english_pob_choice: mocked
  chosen_korean: 조롱했습니다
  alternatives_korean:
