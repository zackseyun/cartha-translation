  - 놀렸습니다
  lexicon: BDAG
  rationale: ἐμπαίζω는 적대적인 조롱을 뜻하므로, 현대 한국어에서 그 뉘앙스를 가장 자연스럽게 드러내는 「조롱했습니다」를 택했습니다.
- source_word: οἱ στρατιῶται
