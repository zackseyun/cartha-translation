    rationale: ἠρώτησεν λέγων의 중복적 구조를 한국어에서 그대로 나누어 옮기면서 문장이 어색해졌습니다. ‘그에게 물었습니다’가 질문과 직접화법을 충분히 전달합니다.
  - severity: medium
    issue: 각주 a와 b가 모두 응답문 뒤에 배치됨
