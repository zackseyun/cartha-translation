id: LUK.23.3
reference: Luke 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
  footnotes:
  - marker: a
    text: Or 'of the Judeans.' The Greek term can denote either Jews or Judeans depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'You say it' or 'Yes, it is as you say.' The Greek reply is concise and can be understood as a qualified affirmation.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 빌라도가 그에게 물으며 말했습니다. 「당신이 유대인의 왕입니까?」 예수께서 그에게 대답하여 말씀하셨습니다. 「당신이 말하고 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다인의’. 그리스어 표현은 문맥에 따라 ‘유대인’ 또는 ‘유다인(들)’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신이 그렇게 말합니다’, ‘당신이 말한 것입니다’. 그리스어 응답은 매우 간결하여, 분명한 긍정으로도 읽을 수 있지만 제한된 동의로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Πιλᾶτος / ἠρώτησεν
  english_pob_choice: Then Pilate asked
  chosen_korean: 그때 빌라도가 물으며
  alternatives_korean:
  - 그리고 빌라도가 물으며
  - 빌라도가 묻고는
  lexicon: BDAG
  rationale: δὲ는 서술을 이어 주는 약한 연결이므로 ‘그때’로 자연스러운 서술 흐름을 살렸고, ἠρώτησεν은 직접 질문을 여는 말이므로 ‘물으며’로 간결하게 옮겼습니다.
- source_word: λέγων
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여 이르기를
  - 말하면서
  lexicon: BDAG
  rationale: λέγων은 한국어에서 보통 중복이 되므로, 문장 구조를 살리되 과도하게 직역하지 않도록 서술 동사로 자연스럽게 처리했습니다.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  english_pob_choice: the king of the Jews
  chosen_korean: 유대인의 왕
  alternatives_korean:
  - 유대인의 임금
  - 유다인들의 왕
  lexicon: BDAG
  rationale: βασιλεύς는 여기서 왕권 주장에 관한 표준 칭호이므로 ‘왕’이 적절하고, Ἰουδαίων은 문맥상 통상적인 ‘유대인’으로 옮겨 제목의 정치·종교적 뉘앙스를 유지했습니다.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  english_pob_choice: answering him, he said
  chosen_korean: 그에게 대답하여 말씀하셨습니다
  alternatives_korean:
  - 그에게 대답하며 말씀하셨습니다
  - 그에게 응답하여 말씀하셨습니다
  lexicon: BDAG
  rationale: ἀποκριθεὶς는 응답의 동작을, αὐτῷ는 그 대상을 분명히 하므로 ‘그에게 대답하여’로 옮겼고, 예수의 발화 동사로는 존중을 반영해 ‘말씀하셨습니다’를 택했습니다.
- source_word: Σὺ λέγεις
  english_pob_choice: You say so
  chosen_korean: 당신이 말하고 있습니다
  alternatives_korean:
  - 당신이 말씀하십니다
  - 당신이 그렇게 말합니다
  - 당신이 말한 것입니다
  lexicon: BDAG
  rationale: Σὺ λέγεις은 단순한 예/아니오가 아니라 상대의 진술을 되받아치는 압축된 답이므로, 직접적 확언으로 풀어 버리지 않고 화자의 책임을 상대에게 돌리는 표현을 살렸습니다.
theological_decisions:
- issue: Σὺ λέγεις의 응답 강도와 함의
  chosen_reading: 예수의 답을 노골적 긍정도 부정도 아닌, 빌라도의 말에 되비추는 짧고 긴장감 있는 응답으로 유지했습니다.
  alternative_readings:
  - ‘그렇다고 당신이 말합니다’라는 완곡한 긍정
  - ‘당신이 그렇게 말합니다’라는 거리 두기
  rationale: 본문은 예수께서 왕호를 곧장 승인하기보다 심문자의 언어를 되돌려 주는 형식이라, 한국어에서도 의미의 여지를 남겨 신학적 긴장을 보존하는 것이 가장 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
