revisions:
- from: 그때 빌라도가 그에게 물으며 말했습니다. 「당신이 유대인의 왕입니까?」 예수께서 그에게 대답하여 말씀하셨습니다. 「당신이 말하고 있습니다.」[a][b]
  to: 그때 빌라도가 그에게 물었습니다. 「당신은 유대인의 왕입니까?」[a] 예수께서 그에게 대답하여 말씀하셨습니다. 「당신이 그렇게 말합니다.」[b]
  rationale: 질문을 도입하는 헬라어의 관용적 중복(ἠρώτησεν λέγων)은 자연스러운 한국어 직접화법으로 처리했습니다. Σὺ λέγεις는 노골적인 긍정으로 확대하지 않고, 빌라도의 표현을 되비추는 ‘당신이 그렇게 말합니다’로 옮겨 원문의 압축성과 해석상 여지를 보존했습니다. 각주 표지도 해당 어구로 옮겼습니다.
