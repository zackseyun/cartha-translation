  source_fidelity: 그리스어의 미완료 과거 ἐπεφώνουν이 나타내는 지속·반복적 외침은 ‘계속 큰 소리로 외쳤습니다’로 자연스럽게 반영할 수 있습니다. 현 초안은 명시된 목적어 αὐτόν(‘그를’)을 본문에서 빠뜨리고 각주에서만 보충하므로, 본문에 반영하는 편이 더 충실합니다.
  naturalness: ‘계속 소리치며 말했습니다’는 의미상 가능하지만, ‘소리치며’와 ‘말했습니다’의 결합은 다소 중복되고 외침의 직접 인용을 도입하는 문장으로는 ‘계속 큰 소리로 외쳤습니다’가 더 자연스럽습니다. 인용문에서는 반복된 명령을 두 문장으로 처리해 한국어의 격앙된 발화를 자연스럽게 살렸습니다.
  terminology: σταύρου는 ‘십자가에 못 박으십시오’로 유지하는 것이 십자가 처형을 구체적으로 나타내며 적절합니다. αὐτόν은 ‘그를’로 명시했습니다. 현 각주는 어휘적 대안을 제시하지 않고 본문에서 누락된 목적어만 보충하므로 삭제하는 것이 적절합니다.
  issues:
