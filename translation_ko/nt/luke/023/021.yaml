lexical_decisions:
- source_word: οἱ δὲ
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그런데 그들은
  - 하지만 그들은
  lexicon: BDAG
  rationale: δέ의 대조를 살리기 위해 ‘그러나’를 택했고, οἱ는 앞 문맥의 무리/사람들을 가리키므로 자연스럽게 ‘그들’로 옮겼습니다.
- source_word: ἐπεφώνουν
  english_pob_choice: kept shouting
  chosen_korean: 계속 소리치며
  alternatives_korean:
  - 계속 외치며
  - 끊임없이 소리치며
  lexicon: BDAG
  rationale: 미완료 과거가 나타내는 반복·지속성을 한국어의 ‘계속’으로 살렸고, 군중의 거친 고함을 ‘소리치다’로 옮겼습니다.
- source_word: Σταύρου σταύρου
  english_pob_choice: Crucify, crucify
  chosen_korean: 십자가에 못 박으십시오, 십자가에 못 박으십시오
  alternatives_korean:
  - 십자가에 못 박으소서, 십자가에 못 박으소서
  - 십자가형에 처하십시오, 십자가형에 처하십시오
  lexicon: BDAG
  rationale: σταυρόω의 기본 의미를 직접 살려 ‘십자가에 못 박다’로 옮겼고, 반복 명령의 격앙된 요구를 두 번 반복해 반영했습니다.
- source_word: λέγοντες
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하며
  - 이르며
  lexicon: BDAG
  rationale: 분사 λέγοντες를 한국어 서술 흐름에 맞게 ‘말했습니다’로 풀어, 앞의 ‘소리치며’와 함께 자연스럽게 연결했습니다.
theological_decisions:
- issue: σταύρου의 형벌 표현 방식
  chosen_reading: ‘십자가에 못 박으십시오’로 직역해 실행 요구의 폭력성과 공개 처형의 의미를 드러냈습니다.
  alternative_readings:
  - ‘처형하십시오’
  - ‘십자가형에 처하십시오’
  rationale: σταυρόω는 단순히 죽이라는 뜻이 아니라 십자가형 처형을 지시하므로, 그 잔혹성과 구체성을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; source-direct rendering'
- issue: 인용문 내부의 공손체
  chosen_reading: 군중의 외침은 한국어 공손 명령형(‘-십시오’)으로 옮겼습니다.
  alternative_readings:
  - 반말 명령형
  - 더 강한 감탄형
  rationale: 직접 화법의 공격성은 유지하되, 현대 한국어 문체와 성경 번역의 공적 문체에 맞추기 위해 명령형 높임을 사용했습니다.
  doctrine_reference: Korean style and discourse register
