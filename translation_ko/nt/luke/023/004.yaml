  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
  footnotes:
  - marker: a
    text: 'Or “I find no fault in this man.” The Greek αἴτιον can mean “fault,” but here it carries a judicial sense: no valid ground for accusation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 빌라도는 대제사장들과 무리들에게 말했습니다. “나는 이 사람에게서 아무런 죄목도 찾지 못하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 사람에게서 아무런 잘못도 찾지 못하겠습니다.” 여기서 αἴτιον은 ‘잘못’의 뜻도 될 수 있지만, 이 문맥에서는 기소할 법적 근거라는 재판상의 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πιλᾶτος
  english_pob_choice: Then Pilate
  chosen_korean: 그러나 빌라도는
  alternatives_korean:
  - 그리고 빌라도는
  - 그때 빌라도는
  lexicon: BDAG
  rationale: δὲ는 이야기의 흐름을 잇는 약한 접속이지만, 한국어에서는 앞선 재판 장면과의 대비를 드러내는 ‘그러나’가 자연스럽습니다.
- source_word: τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους
  english_pob_choice: the chief priests and the crowds
  chosen_korean: 대제사장들과 무리들에게
  alternatives_korean:
  - 대제사장들과 군중들에게
  - 대제사장들과 백성들에게
  lexicon: BDAG
  rationale: ἀρχιερεῖς는 복수의 종교 지도층을 가리키므로 ‘대제사장들’이 적절하고, ὄχλους의 복수성을 살려 ‘무리들’로 옮겼습니다.
- source_word: Οὐδὲν εὑρίσκω αἴτιον
  english_pob_choice: I find no basis for a charge
  chosen_korean: 아무런 죄목도 찾지 못하겠습니다
  alternatives_korean:
  - 아무런 혐의도 찾지 못하겠습니다
  - 고발할 근거를 찾지 못하겠습니다
  lexicon: BDAG
  rationale: αἴτιον은 이 법정 맥락에서 단순한 ‘잘못’보다 ‘죄목/고발 근거’의 뜻이므로, 법적 뉘앙스를 분명히 하는 ‘죄목’을 택했습니다.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  english_pob_choice: against this man
  chosen_korean: 이 사람에게서
  alternatives_korean:
  - 이 사람 안에서
  - 이 사람에게서의
  lexicon: BDAG
  rationale: εὑρίσκω αἴτιον과 결합한 ἐν은 한국어에서 ‘~에게서’가 가장 자연스럽게 법적 대상성을 드러냅니다.
theological_decisions:
- issue: 예수에 대한 빌라도의 무죄 선언의 법정적 성격
  chosen_reading: ‘죄목도 찾지 못하겠습니다’로 옮겨, 도덕적 평가보다 재판상의 무혐의 판단을 드러냈습니다.
  alternative_readings:
  - ‘잘못도 찾지 못하겠습니다’
  - ‘허물도 찾지 못하겠습니다’
  rationale: 본문의 αἴτιον은 단순한 도덕적 결함이 아니라 기소 가능한 법적 근거를 가리키므로, 재판 장면의 공적 선언으로 읽히도록 했습니다.
  doctrine_reference: Luke 23:4
