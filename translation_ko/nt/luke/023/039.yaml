source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: Now one of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
  footnotes:
  - marker: a
    text: 'Or, “the Christ.” Greek: ho christos.'
    reason: alternative_reading
translation:
  language: ko
  text: 달려 있던 죄수들 가운데 한 사람이 그를 계속 모욕하며 말했습니다. 「당신이 메시아[a] 아니십니까? 당신 자신과 우리를 구하시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘그리스도’. 그리스어: 호 크리스토스(ὁ χριστός).'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  english_pob_choice: Now one
  chosen_korean: 그곳에 달린 죄수들 가운데 한 사람도
  alternatives_korean:
  - 그런데 한 사람은
  - 그리고 한 사람은
  lexicon: BDAG
  rationale: δέ의 서술 전개를 자연스러운 한국어 흐름으로 옮기되, 장면의 대조를 살려 ‘한 사람도’로 시작했습니다.
- source_word: τῶν κρεμασθέντων κακούργων
  english_pob_choice: of the criminals who were hanging there
  chosen_korean: 그곳에 달린 죄수들
  alternatives_korean:
  - 매달린 범죄자들
  - 거기 달린 범죄자들
  lexicon: BDAG
  rationale: κακοῦργοι는 현대 한국어에서 ‘죄수들’이 가장 자연스럽고, κρεμασθέντων의 처형 장면은 ‘달린’으로 충분히 드러납니다.
- source_word: ἐβλασφήμει
  english_pob_choice: was reviling
  chosen_korean: 그를 모독하며
  alternatives_korean:
  - 그를 욕하며
  - 그를 비방하며
  lexicon: BDAG
  rationale: 문맥상 단순한 욕설보다 조롱과 모욕의 의미가 강하므로 ‘모독하며’가 적절합니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 메시아 되시는 분
  lexicon: project glossary
  rationale: 직함으로 쓰인 Χριστός는 이 프로젝트 기본값에 따라 ‘메시아’로 옮겨, 유대적 메시아 기대를 보존했습니다.
theological_decisions:
- issue: 조롱하는 질문의 존댓말 처리
  chosen_reading: 「당신이 메시아가 아니십니까? 당신과 우리를 구하시오.」
  alternative_readings:
  - 반말로 ‘네가 메시아 아니냐?’
  - 더 평이하게 ‘당신이 메시아 아닙니까?’
  rationale: 인물 상호 간 존대가 아니라 독자에게 들려주는 한국어 서술의 격식을 유지하되, 조롱의 직접성을 살렸습니다. 뒤의 명령형은 원문의 imperative를 반영해 ‘구하시오’로 보존했습니다.
  doctrine_reference: Korean register guidance in project instructions
