    issue: ‘한 사람도’의 첨가 보조사
    rationale: Εἷς δὲ는 ‘한 사람도’(한 사람 역시)가 아니라 ‘한 사람이/그런데 한 사람이’입니다. ‘도’는 원문에 없는 첨가·강조를 도입합니다.
  - severity: high
    issue: 각주의 원문 용어 오류
    rationale: 현 각주는 κύριος를 언급하지만 해당 절의 그리스어에는 κύριος가 없습니다. 각주는 ὁ χριστός에 관한 대안 번역만 정확히 제시해야 합니다.
  - severity: low
    issue: 미완료상 표현
    rationale: ‘모독하며 말했습니다’도 가능하지만, ἐβλασφήμει의 지속적 행위를 ‘계속 모욕했습니다’로 나타내면 더 분명합니다.
  revised_text: 달려 있던 죄수들 가운데 한 사람이 그를 계속 모욕하며 말했습니다. 「당신이 메시아[a] 아니십니까? 당신 자신과 우리를 구하시오.」
