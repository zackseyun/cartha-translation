- from: 그곳에 달린 죄수들 가운데 한 사람도 그를 모독하며 말했습니다. 「당신이 메시아가 아니십니까? 당신과 우리를 구하시오.」[a]
  to: 달려 있던 죄수들 가운데 한 사람이 그를 계속 모욕하며 말했습니다. 「당신이 메시아[a] 아니십니까? 당신 자신과 우리를 구하시오.」
  rationale: 원문의 단순한 수량 표현을 ‘한 사람이’로 바로잡고, 지속적 모욕을 나타내는 미완료상을 자연스럽게 반영했습니다. ‘메시아’는 유지하되, 원문에 없는 κύριος를 잘못 언급한 각주를 ὁ χριστός의 정확한 대안 번역 각주로 교체했으며, 각주 표지를 해당 단어 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:38Z'
review_pass:
  verdict: revise
  source_fidelity: ‘한 사람도’의 보조사 ‘도’는 ‘한 사람 역시/또한’이라는 첨가 의미를 내어 Εἷς의 단순한 ‘한 사람’을 정확히 반영하지 못합니다. 또한 현 각주의 ‘κύριος 대응이 아니라’라는 설명은 본문에 κύριος가 없으므로 원문 사실과 맞지 않습니다. ἐβλασφήμει의 미완료상은 ‘계속 모욕했습니다’로 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘달려 있던 죄수들 가운데 한 사람이’가 현대 한국어에서 자연스럽고, 직접 인용문은 합쇼체를 유지하면서도 조롱하는 질문과 명령의 어조를 보존합니다.
  terminology: ὁ χριστός은 직함으로서 ‘메시아’가 적절합니다. 대안인 ‘그리스도’는 간결한 역주로 제시할 수 있으나, 원문에 없는 κύριος를 언급하거나 번역 선택을 장황하게 해설할 필요는 없습니다.
  issues:
