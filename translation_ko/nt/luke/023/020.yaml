lexical_decisions:
- source_word: πάλιν
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 한 번 더
  - 또
  lexicon: BDAG
  rationale: 반복을 나타내는 부사로, 간결하고 자연스러운 현대 한국어인 ‘다시’가 가장 적절합니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그런데
  alternatives_korean:
  - 하지만
  - 그리고
  lexicon: BDAG
  rationale: 이야기 흐름에서 앞선 군중 요구에 대한 전개를 부드럽게 이어 주는 역접·전환 표현으로 ‘그런데’가 적절합니다.
- source_word: προσεφώνησεν
  english_pob_choice: called out
  chosen_korean: 사람들을 불러서
  alternatives_korean:
  - 불러서 말했습니다
  - 호소했습니다
  - 대답했습니다
  lexicon: BDAG
  rationale: 공적인 자리에서 소리를 내어 사람들에게 말을 건네는 의미를 살리되, 한국어에서는 ‘불러서’가 가장 자연스럽게 그 뉘앙스를 전달합니다.
- source_word: ἀπολῦσαι
  english_pob_choice: to release
  chosen_korean: 놓아주고자 했습니다
  alternatives_korean:
  - 석방하고자 했습니다
  - 풀어주고자 했습니다
  lexicon: BDAG
  rationale: 법적·구금 맥락에서 단순한 ‘풀다’보다 ‘놓아주다’가 문맥을 잘 살리며, 목적의 뉘앙스도 함께 드러냅니다.
theological_decisions:
- issue: 빌라도의 의도 표현 방식
  chosen_reading: 주동적 목적을 살려 “놓아주고자 했습니다”로 옮겼습니다.
  alternative_readings:
  - 놓아주려 했습니다
  - 놓아주기를 원했습니다
  rationale: θέλων은 단순 감정이 아니라 현재적 의도/원함을 나타내므로, 행동의 방향성을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 본문 주해/서술적 뉘앙스
