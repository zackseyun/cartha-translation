review_pass:
  verdict: revise
  source_fidelity: ‘그들 모두’는 ἅπαν τὸ πλῆθος αὐτῶν의 집합 명사 πλῆθος(무리/집단)를 개인들의 총합으로 평면화합니다. 또한 ‘끌고 갔습니다’는 ἤγαγον(이끌다, 데리고 가다)보다 강제성과 거친 물리적 행동을 더합니다. Καὶ는 여기서 단순 서사 접속이므로 ‘그러고 나서’보다 ‘그리고’가 더 직접적입니다.
  naturalness: ‘그리고 그들의 온 무리가 일어나 예수를 빌라도에게 데리고 갔습니다’는 현대 표준어 합쇼체로 자연스럽고, 집합적 주어와 사건의 순서를 명료하게 드러냅니다.
  terminology: ‘온 무리’는 πλῆθος와 ἅπαν의 집합성과 전체성을 보존하며, 특정 공식 기구라는 뜻을 과도하게 부여하지 않습니다. ‘데리고 갔습니다’는 ἄγω의 이동·호송 의미를 자연스럽게 옮기되 원문에 없는 폭력성을 첨가하지 않습니다. ‘빌라도’는 통용 인명 표기입니다.
  issues:
  - severity: medium
    issue: 집합 명사 πλῆθος의 의미가 ‘그들 모두’에서 약화됨
    rationale: 원문은 ‘모든 사람’만이 아니라 ‘그들의 온 무리/집단’을 주어로 제시합니다. 한국어 본문에서도 집합적 성격을 나타내는 명사가 필요합니다.
  - severity: medium
    issue: ‘끌고 갔습니다’가 ἤγαγον보다 강한 강제성을 시사함
    rationale: ἄγω는 이 문맥에서 ‘이끌다/데리고 가다’로 충분하며, ‘끌다’가 암시할 수 있는 물리적 난폭함은 이 절 자체에 명시되어 있지 않습니다.
  - severity: low
    issue: ‘그러고 나서’가 Καὶ의 단순 연결보다 시간적 전개를 다소 강화함
    rationale: ‘그리고’가 원문의 서사적 접속을 더 절제되고 직접적으로 반영합니다.
  revised_text: 그리고 그들의 온 무리가 일어나 예수를 빌라도에게 데리고 갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들 모두’.
    reason: ‘그들의 온 무리’는 ἅπαν τὸ πλῆθος αὐτῶν의 집합적 표현을 살린 번역이며, αὐτῶν을 보다 간결하게 처리하면 ‘그들 모두’로도 옮길 수 있습니다.
  revision_rationale: 원문의 단순 접속, 선행 동작, 전체 집단이라는 주어의 성격, 그리고 ἄγω의 비교적 중립적인 호송 의미를 보존하도록 고쳤습니다. 본문은 πλῆθος의 집합성을 ‘온 무리’로 드러내고, 각주에는 대안적 간결 번역을 제시했습니다.
