translation:
  language: ko
  text: 그러고 나서 그들 모두가 일어나 예수를 빌라도에게 끌고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  english_pob_choice: And
  chosen_korean: 그러고 나서
  alternatives_korean:
  - 그리고
  - 그런 다음
  lexicon: BDAG
  rationale: 서술의 연속을 자연스럽게 이어 주는 연결어로 옮겼습니다. 단순한 접속사 ‘그리고’보다 사건의 진행을 조금 더 분명히 드러냅니다.
- source_word: ἀναστὰν
  english_pob_choice: rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나서
  - 일어난 뒤
  - 몸을 일으켜
  lexicon: BDAG
  rationale: 부사절처럼 앞선 동작을 나타내므로, 한국어에서는 동작의 선행을 자연스럽게 보여 주는 ‘일어나’로 옮겼습니다.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  english_pob_choice: the whole assembly of them
  chosen_korean: 그들 모두
  alternatives_korean:
  - 그들의 온 무리
  - 그들의 전체 집회
  - 그들 전체의 무리
  lexicon: BDAG
  rationale: πλῆθος의 집합적 의미와 ἅπαν의 총체성을 간결하게 살리기 위해 ‘그들 모두’로 옮겼습니다. 여기서는 공식 용어보다 집합적 주체가 강조됩니다.
- source_word: ἤγαγον
  english_pob_choice: led
  chosen_korean: 끌고 갔습니다
  alternatives_korean:
  - 데리고 갔습니다
  - 인도했습니다
  - 이끌고 갔습니다
  lexicon: BDAG
  rationale: 예수를 관정으로 이송하는 구체적 상황에서 단순한 ‘데리고 가다’보다 강한 구속적 뉘앙스를 주는 ‘끌고 가다’가 문맥에 더 가깝습니다.
theological_decisions:
- issue: 빌라도에게로의 이동 방향 표현
  chosen_reading: ‘빌라도에게’로 직접 옮겨, 법정 장면의 방향성을 간결하게 드러냈습니다.
  alternative_readings:
  - ‘빌라도 앞에’
  - ‘빌라도의 앞에’
  rationale: ἐπὶ τὸν Πιλᾶτον은 이동의 방향을 나타내므로, 원문의 직접성을 살리면서도 한국어에서 자연스러운 ‘빌라도에게’가 가장 적절합니다. ‘빌라도 앞에’는 해석을 조금 더 더합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
