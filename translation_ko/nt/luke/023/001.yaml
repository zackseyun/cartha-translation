review_pass:
  verdict: revise
  source_fidelity: ‘그들 모두’는 ἅπαν τὸ πλῆθος αὐτῶν의 집합 명사 πλῆθος(무리, 군중)를 개인들의 총합처럼 바꾸어 표현합니다. 또한 ‘끌고 갔습니다’는 ἄγω의 기본 뜻인 ‘데리고 가다/이끌고 가다’보다 강압성을 더합니다. 원문은 예수를 이름으로 다시 밝히지 않고 대명사를 사용합니다.
  naturalness: ‘그들의 온 무리가 일어나 그를 빌라도에게 데리고 갔습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 집합적 주어와 동작의 순서를 분명히 나타냅니다.
  terminology: ‘빌라도’는 통용되는 인명 표기이며 적절합니다. ‘온 무리’는 공식 기관을 과도하게 특정하지 않으면서 πλῆθος의 집합성과 ἅπαν의 전체성을 보존합니다.
  issues:
  - severity: medium
    issue: 집합 명사 πλῆθος가 ‘그들 모두’로 개인화되었습니다.
    rationale: 원문은 ‘그들의 온 무리/전체 군중’을 주어로 제시합니다. ‘그들 모두’도 전체성은 전달하지만 무리라는 집합적 성격을 누락합니다.
  - severity: medium
    issue: ἤγαγον을 ‘끌고 갔습니다’로 옮겨 강압성을 추가했습니다.
    rationale: ἄγω는 이 문맥에서 ‘데리고 가다’ 또는 ‘이끌고 가다’가 적절합니다. ‘끌고 가다’는 원문이 명시하지 않는 물리적 끌어감이나 과도한 강제를 암시할 수 있습니다.
  - severity: low
    issue: Καὶ를 ‘그러고 나서’로 옮겨 순차성을 다소 강화했습니다.
    rationale: 단순 접속사이므로 ‘그리고’가 원문의 서술 연결을 더 직접적으로 반영합니다.
  revised_text: 그리고 그들의 온 무리가 일어나 그를 빌라도에게 데리고 갔습니다.
  revised_footnotes: []
  revision_rationale: 집합 명사 ‘온 무리’로 ἅπαν τὸ πλῆθος αὐτῶν을 보존하고, 중립적인 ‘데리고 갔습니다’로 ἤγαγον을 옮겼습니다. 원문의 대명사 αὐτόν도 ‘그를’로 유지했으며, 단순 연결어 Καὶ는 ‘그리고’로 번역했습니다.
