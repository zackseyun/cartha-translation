id: LUK.23.51
reference: Luke 23:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
  footnotes:
  - marker: a
    text: Or 'had not consented to their decision and deed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람은 그들의 계획과 행동에 동의하지 않았습니다 — 아리마대[a]라는 유대인의 도시 출신으로서, 그는 하나님의 나라를 기다리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 결정과 행위에 동의하지 않았다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκατατεθειμένος
  english_pob_choice: had not agreed
  chosen_korean: 동의하지 않았습니다
  alternatives_korean:
  - 찬성하지 않았습니다
  - 승낙하지 않았습니다
  - 같이하지 않았습니다
  lexicon: BDAG
  rationale: 완료 분사와 미완료 서술의 결합이 과거의 확정된 비동의 상태를 나타내므로, 현대 한국어의 자연스러운 표현인 ‘동의하지 않았습니다’로 옮겼습니다.
- source_word: τῇ βουλῇ καὶ τῇ πράξει
  english_pob_choice: their plan and action
  chosen_korean: 그들의 계획과 행동
  alternatives_korean:
  - 그들의 결정과 행위
  - 그들의 의논과 실행
  - 그들의 책략과 행위
  lexicon: BDAG
  rationale: βουλή와 πρᾶξις의 대조를 살리기 위해, 의도/결의와 실제 실행의 구분이 드러나는 ‘계획과 행동’을 선택했습니다.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  english_pob_choice: from Arimathea, a city of the Jews
  chosen_korean: 아리마대라는 유대인의 도시 출신으로서
  alternatives_korean:
  - 유대인의 도시 아리마대 출신으로서
  - 유대의 도시 아리마대에서 온
  - 아리마대라는 유대인의 고을 출신으로서
  lexicon: BDAG
  rationale: 지명과 설명구를 한국어 어순에 맞게 자연스럽게 풀되, ‘τῶν Ἰουδαίων’의 표지를 지워버리지 않기 위해 ‘유대인의 도시’라는 연결을 유지했습니다.
- source_word: προσεδέχετο
  english_pob_choice: was waiting for
  chosen_korean: 기다리고 있었습니다
  alternatives_korean:
  - 기대하고 있었습니다
  - 고대하고 있었습니다
  - 바라고 있었습니다
  lexicon: BDAG
  rationale: 미완료 과거가 나타내는 지속적 기대를 반영해, 단순한 순간적 소망보다 지속 상태가 드러나는 ‘기다리고 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: 아리마대의 지명 표기와 유대인 표지의 보존
  chosen_reading: ‘유대인의 도시’라는 표현을 그대로 살려, 출신 배경에 대한 본문의 표지를 약화시키지 않았습니다.
  alternative_readings:
  - ‘유대의 도시’로 완화
  - ‘유대 지역의 도시’로 일반화
  rationale: 본문은 단순 지리 정보만이 아니라 유대인 정체성과 연결된 출신 표지를 제시하므로, 이를 일반화하지 않고 드러내는 쪽이 원문 의도를 더 잘 반영합니다.
  doctrine_reference: 원문 우선 원칙; 민족/정체성 표지를 평준화하지 않음
