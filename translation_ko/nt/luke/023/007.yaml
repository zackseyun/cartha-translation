  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
  footnotes:
  - marker: a
    text: Or “under the authority of Herod.” The Greek expression refers to Herod’s governing domain or legal authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 예수께서 헤롯의 관할[a]에 속하신 것을 알고, 예수를 헤롯에게 보냈습니다. 헤롯도 그 무렵 예루살렘에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤롯의 권한 아래에.’ 여기서 그리스어 표현은 헤롯의 통치 구역이나 법적 권위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  english_pob_choice: when he learned
  chosen_korean: 알고
  alternatives_korean:
  - 알아차리고
  - 알게 되어
  - 깨닫고
  lexicon: BDAG
  rationale: 아오리스트 분사로 앞선 인지를 나타내므로, 문맥에 맞게 선행 동작을 간결하게 옮겼습니다.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  english_pob_choice: he was under Herod’s jurisdiction
  chosen_korean: 헤롯의 관할 아래에 있는 것을
  alternatives_korean:
  - 헤롯의 권한 아래 있는 것을
  - 헤롯의 통치 범위에 있는 것을
  - 헤롯에게 속한 것을
  lexicon: BDAG
  rationale: ἐξουσία를 단순한 추상적 ‘권력’보다 행정·법적 영역으로 이해하여, ‘관할’로 옮겨 재판 절차의 맥락을 드러냈습니다.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  english_pob_choice: he sent him to Herod
  chosen_korean: 그를 헤롯에게 보냈습니다
  alternatives_korean:
  - 그를 헤롯에게 넘겼습니다
  - 그를 헤롯에게 회부했습니다
  - 그를 헤롯에게 돌려보냈습니다
  lexicon: BDAG
  rationale: 문맥상 법적 재이송의 뉘앙스가 있으나, 본문 자체는 단순한 ‘보냄’을 말하므로 과도한 해석 없이 자연스럽게 옮겼습니다.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  english_pob_choice: in those days
  chosen_korean: 그때
  alternatives_korean:
  - 그날들에
  - 그 무렵
  - 그 시절에
  lexicon: BDAG
  rationale: 지시 표현을 한국어 서술 흐름에 맞게 압축해, 뒤의 장소 정보와 자연스럽게 연결했습니다.
theological_decisions:
- issue: 헤롯의 ἐξουσία를 한국어로 어떻게 드러낼지
  chosen_reading: ‘관할’은 법적·행정적 권역을 뜻하는 표현으로 사용했습니다.
  alternative_readings:
  - ‘권세’로 번역할 수 있으나 여기서는 추상적 위력으로 들릴 수 있습니다.
  - ‘권한’은 가능하지만 법정 맥락에서 ‘관할’이 더 분명합니다.
  rationale: 이 절의 초점은 신학적 권세가 아니라 빌라도가 예수를 헤롯의 통치·재판 범위에 속한 인물로 판단한 데 있으므로, 법적 행정 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
