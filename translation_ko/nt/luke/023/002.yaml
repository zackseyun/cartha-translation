  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
  footnotes:
  - marker: a
    text: Or “subverting our nation” or “leading our nation astray.”
    reason: lexical_alternative
  - marker: b
    text: Greek φόρους, referring to taxes or tribute paid to the Roman ruler.
    reason: cultural_note
  - marker: c
    text: Or “claiming that he himself is Christ, a king.”
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 그를 고발하기 시작하며 말했습니다. 「우리는 이 사람이 우리 민족을 그릇된 길로 이끄는 것과, 우리가 가이사에게 세금을 바치지 못하게 하는 것과, 또 자기가 메시아요 왕이라고 말하는 것을 보았습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 민족을 전복하는 것” 또는 “우리 민족을 그릇된 길로 이끄는 것.”
    reason: lexical_alternative
  - marker: b
    text: 그리스어 φόρους는 로마 통치자에게 바치는 세금 또는 공물을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 “자기가 곧 그리스도요, 왕이라고 주장하는 것.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν
  english_pob_choice: And they began to accuse
  chosen_korean: 그리고 그들은 그를 고발하기 시작하며
  alternatives_korean:
  - 그리고 그들은 그를 비난하기 시작하며
  - 그들은 그를 고소하기 시작하며
  lexicon: BDAG
  rationale: ἤρξαντο δὲ κατηγορεῖν의 도입적 뉘앙스를 살려 ‘고발하기 시작하며’로 옮겼습니다. 법정 장면의 공적·대립적 분위기도 유지됩니다.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  english_pob_choice: misleading our nation
  chosen_korean: 우리 민족을 그릇된 길로 이끄는 것
  alternatives_korean:
  - 우리 민족을 미혹하는 것
  - 우리 민족을 부패시키는 것
  - 우리 나라를 어지럽히는 것
  lexicon: BDAG
  rationale: διαστρέφω의 핵심은 ‘바르게 있던 것을 비틀어 돌리다’라는 뜻이어서, 단순한 정보 오류보다 공동체를 잘못된 방향으로 이끄는 의미를 살려 번역했습니다.
- source_word: φόρους Καίσαρι διδόναι
  english_pob_choice: forbidding us to pay taxes to Caesar
  chosen_korean: 우리가 가이사에게 세금을 바치지 못하게 하는 것
  alternatives_korean:
  - 가이사에게 세금을 내지 못하게 하는 것
  - 가이사에게 조세를 바치지 못하게 하는 것
  - 가이사에게 공물을 바치지 못하게 하는 것
  lexicon: BDAG
  rationale: φόρους는 로마 통치자에게 바치는 세금/공물로, 여기서는 현대 독자가 즉시 이해할 수 있도록 ‘세금’으로 옮겼습니다. διδόναι의 주체가 생략되어 있지만 한국어에서는 ‘우리가 … 바치지 못하게 하는 것’으로 자연스럽게 드러냈습니다.
- source_word: χριστὸν βασιλέα εἶναι
  english_pob_choice: saying that he himself is Messiah, a king
  chosen_korean: 자기가 메시아요 왕이라고 말하는 것을
  alternatives_korean:
  - 자기가 메시아이며 왕이라고 말하는 것을
  - 자기가 그리스도요 왕이라고 말하는 것을
  - 자기가 메시아인 왕이라고 말하는 것을
  lexicon: BDAG
  rationale: χριστός는 호칭으로 쓰였으므로 기본 용례에 따라 ‘메시아’로 옮겼습니다. βασιλέα는 절대적인 칭호를 강요하지 않도록 ‘왕’으로 유지해, 두 겹의 주장—메시아와 왕—을 함께 드러냈습니다.
theological_decisions:
- issue: Χριστός의 한국어 처리
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 여기서는 예수에 대한 이름처럼 굳어진 형태가 아니라 정치적·유대교적 호칭으로 제기된 주장입니다. 따라서 ‘메시아’가 원문의 표제적 의미를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → Messiah (title)'
