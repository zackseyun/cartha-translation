  source_fidelity: ‘보았습니다’는 εὕραμεν(‘찾아냈습니다/발견했습니다’)의 법정적 आरोप 제기 표현을 충분히 반영하지 못합니다. 또한 ‘고발하기 시작하며 말했습니다’는 시제와 연결이 어색합니다. 수정문은 ἤρξαντο ... κατηγορεῖν의 시작 의미, 세 개의 현재분사에 담긴 आरोप 내용, 그리고 χριστὸν βασιλέα의 병렬적 칭호를 보존합니다.
  naturalness: 현행 문장은 ‘시작하며 말했습니다’가 현대 표준 한국어의 합쇼체 서술로 부자연스럽고, 인용문 안의 ‘것을 보았습니다’도 고발 맥락에 맞지 않습니다. ‘고발하기 시작했습니다’와 ‘찾아냈습니다’를 사용하고, 각 혐의의 병렬을 ‘~하고, ~못하게 하며, ~한다고’로 정리하면 자연스럽습니다.
  terminology: ‘메시아’는 이 문맥에서 χριστός의 호칭적 용법을 잘 반영합니다. φόρους는 ‘세금’으로, Καίσαρ는 관례적인 ‘가이사’로 유지할 수 있습니다. ‘우리 민족’은 τὸ ἔθνος ἡμῶν의 정치·공동체적 어감을 보존합니다.
  issues:
  - severity: medium
    issue: εὕραμεν을 ‘보았습니다’로 번역함
