review_pass:
  verdict: revise
  source_fidelity: 그리스어의 συγκαλεσάμενος는 다음 절의 주동사(‘그들에게 말하였다’)에 이어지는 선행 분사입니다. 초안의 ‘불러모았습니다’는 이를 독립된 종결문으로 처리하여 원문의 연결 구조를 약화시킵니다. 또한 ἄρχοντας는 단순히 영향력 있는 ‘지도자들’보다 공적 권위를 지닌 ‘관리들/통치자들’의 뜻이 더 분명합니다.
  naturalness: ‘불러 모아 놓고’는 다음 절과 자연스럽게 이어지며, 현대 표준어 합쇼체 성경 문체에도 잘 맞습니다. ‘그런데’는 δέ의 완만한 전환을 무리 없이 나타냅니다.
  terminology: ‘빌라도’, ‘대제사장들’, ‘백성’은 통용되는 성경 용례와 원문의 지시 범위에 부합합니다. ἄρχοντες는 이 문맥에서 공적 지도층을 가리키므로 ‘관리들’이 더 직접적입니다.
  issues:
  - severity: medium
    issue: 분사 συγκαλεσάμενος를 독립 종결문 ‘불러모았습니다’로 번역함
    rationale: 원문에서 이 분사는 23:14의 ‘말하였다’에 문법적으로 연결됩니다. ‘불러 모아 놓고’로 옮겨 선행 행위와 다음 절의 발화를 연결하는 것이 원문 구조와 의미를 더 충실히 보존합니다.
  - severity: low
    issue: ἄρχοντας를 ‘지도자들’로 번역함
    rationale: ‘지도자들’도 가능한 넓은 번역이지만, ἄρχοντες의 공적·통치적 권위라는 의미가 약해집니다. ‘관리들’이 문맥상 더 구체적이고 통상적인 표현입니다.
  revised_text: 그런데 빌라도는 대제사장들과 관리들과 백성을 불러 모아 놓고
