id: LUK.23.29
reference: Luke 23:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: ko
  text: 「보십시오, 날들이 올 것인데, 그때는 ‘임신하지 못한 여자들은 복되다’ 하고, ‘한 번도 아이를 낳지 못한 태와, 한 번도 젖먹여 길러 보지 못한 젖가슴’이라고 말할 것입니다.”[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “임신하지 못한 여자들”.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “태들(자궁들)”.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “젖먹이지 못한 젖가슴들”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 보십시오, 보라
  lexicon: ἰδοὺ
  rationale: POB의 ‘look’을 한국어 현대 합쇼체로 직접 살려, 단순한 시간표지보다 주의를 끌어 말문을 여는 감탄적 호소를 나타냈습니다.
- source_word: ἐροῦσιν
  english_pob_choice: they will say
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 말하겠습니다
  - 말한다고 할 것입니다
  lexicon: λέγω
  rationale: 미래 시점의 일반적 발화를 자연스럽게 옮기되, 원문의 단정적 예고를 보존했습니다.
- source_word: αἱ στεῖραι
  english_pob_choice: the barren women
  chosen_korean: 임신하지 못한 여자들
  alternatives_korean:
  - 불임의 여자들
  - 불임한 여자들
  lexicon: στεῖρα
  rationale: στεῖραι의 상태를 생물학적·서술적으로 풀어, 전통적 교회어조의 완곡한 표현보다 원문의 직접성을 살렸습니다.
- source_word: αἱ κοιλίαι
  english_pob_choice: the wombs
  chosen_korean: 태
  alternatives_korean:
  - 배
  - 자궁
  lexicon: κοιλία
  rationale: 문맥상 출산하지 못한 ‘wombs’를 한국어의 자연스러운 신체 명사로 압축해, 이어지는 ‘낳지 못한’과의 대응을 유지했습니다.
- source_word: μαστοί
  english_pob_choice: the breasts
  chosen_korean: 젖가슴
  alternatives_korean:
  - 가슴
  - 유방
  lexicon: μαστός
  rationale: 수유 기능이 강조되는 문맥이므로 단순 신체 일반명보다 ‘젖가슴’이 ‘젖먹여 길러 보지 못한’과의 의미 연결을 분명히 합니다.
theological_decisions:
- issue: ‘복되다’ 선언의 대상이 모성의 부재인 역설적 진술
  chosen_reading: 원문의 아이러니를 그대로 살려, ‘임신하지 못한 여자들’과 ‘낳지 못한 태’, ‘젖먹여 길러 보지 못한 젖가슴’을 모두 복되다고 말하는 미래 발화를 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 의미를 완화해 ‘행복하다’로 옮기기
  - 설명적 해석을 덧붙여 역설을 풀어 쓰기
  rationale: 이 구절은 감상적 위로가 아니라 심판/환난 맥락에서의 역설적 축복 선언이므로, 독자가 충격과 긴장을 그대로 인지하도록 했습니다.
  doctrine_reference: 눅 23:27-31의 예언적 문맥
- issue: ‘wombs’와 ‘breasts’의 의인화 여부
  chosen_reading: ‘태’와 ‘젖가슴’을 병렬로 유지해 출산·수유 기관을 직접 지칭하는 원문 구조를 보존했습니다.
  alternative_readings:
  - ‘아이를 낳지 못한 몸’처럼 의역하기
  - ‘젖을 먹이지 못한 가슴’처럼 완곡하게 바꾸기
  rationale: 원문은 여성을 사람-기관 병행으로 매우 구체적으로 지시하므로, 구조를 흐리지 않는 선에서 한국어도 같은 대비를 드러내야 합니다.
  doctrine_reference: 성경 서사에서의 예언적 수사와 표현 방식
