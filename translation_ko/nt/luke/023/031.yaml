source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
  footnotes:
  - marker: a
    text: Or 'in the green wood ... in the dry.' The Greek preserves the image more literally; the translation renders it idiomatically as a contrast between green and dry wood.
    reason: lexical_alternative
  - marker: b
    text: 'The image likely moves from the lesser to the greater: if such things are done in the case of ''green'' wood, what will happen in the case of ''dry'' wood?'
    reason: cultural_note
translation:
  language: ko
  text: 이는 그들이 푸른 나무에도 이런 일들을 한다면, 마른 나무에는 무슨 일이 일어나겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘푸른 나무에서 … 마른 나무에서’에 가깝습니다. 한국어 본문은 비유의 의미가 드러나도록 관용적으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 푸른 나무의 경우에도 이런 일이 일어난다면 마른 나무의 경우에는 어떠하겠느냐는, 더 작은 경우에서 더 큰 경우로 나아가는 논리를 암시하는 것으로 이해되기도 합니다.
    reason: theological_note
lexical_decisions:
- source_word: ὅτι
  english_pob_choice: For
  chosen_korean: 그들이…한다면
  alternatives_korean:
  - 왜냐하면
  - …이기 때문에
  lexicon: BDAG
  rationale: 앞선 말씀과의 인과·설명 관계를 한국어에서는 종속절의 조건문으로 자연스럽게 풀어 옮겼습니다.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  english_pob_choice: when the wood is green
  chosen_korean: 푸른 나무
  alternatives_korean:
  - 젖은 나무
  - 푸른 목재
  - 푸른 나무 속에서
  lexicon: BDAG
  rationale: ὑγρός의 문자적 ‘젖은’보다, 마른 나무와 대비되는 관용적 이미지인 ‘푸른 나무’가 한국어에서 더 자연스럽고 비슷한 비유 효과를 냅니다.
- source_word: ξύλῳ / ξηρῷ
  english_pob_choice: wood / dry
  chosen_korean: 나무 / 마른 나무
  alternatives_korean:
  - 목재 / 마른 목재
  - 나무 / 건조한 나무
  lexicon: BDAG
  rationale: ξύλον은 여기서 불에 타는 재료의 이미지를 이루므로 ‘나무’가 가장 직관적입니다. ξηρός와의 대조도 ‘마른 나무’로 선명하게 드러납니다.
- source_word: τί γένηται
  english_pob_choice: what will happen
  chosen_korean: 무슨 일이 일어나겠습니까?
  alternatives_korean:
  - 어찌 되겠습니까?
  - 무엇이 되겠습니까?
  lexicon: BDAG
  rationale: 수사적 질문의 예기된 결과를 현대 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 푸른 나무와 마른 나무의 비유적 참조 대상
  chosen_reading: 본문의 비유를 그대로 살리고, 예수 자신이나 예루살렘을 구체적으로 해석하지 않았습니다.
  alternative_readings:
  - 푸른 나무는 예수, 마른 나무는 예루살렘을 가리킨다
  - 더 작은 일에서 더 큰 일로 가는 일반적 경고이다
  rationale: 원문의 긴장을 해치지 않도록, 번역문은 해석을 확정하지 않고 비유의 대비만 드러내는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
