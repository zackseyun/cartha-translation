    text: Or 'had accompanied him from Galilee.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갈릴리에서 그와 함께 온[a] 여자들은 뒤따라가서 무덤과 그의 몸이 어떻게 놓였는지를 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
