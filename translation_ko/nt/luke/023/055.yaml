    text: 또는 ‘갈릴리에서 그와 동행해 온’.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσασαι
  english_pob_choice: followed
  chosen_korean: 와 있었고
  alternatives_korean:
  - 따라왔고
  - 뒤따랐고
  lexicon: BDAG
  rationale: 문맥상 부활 전 예수의 장례 현장을 지켜본 여자들의 이전 동행을 자연스럽게 드러내기 위해, 단순 과거의 ‘따라왔고’보다 결과 상태까지 보이는 표현을 택했습니다.
- source_word: αἱ γυναῖκες
  english_pob_choice: the women
  chosen_korean: 그 여자들은
  alternatives_korean:
  - 그 여자들
  - 여자들은
  lexicon: BDAG
  rationale: 관사와 문맥상 특정 집단을 가리키므로 ‘그 여자들’ 계열이 필요하며, 서술 흐름에 맞게 주어를 앞세운 표현을 사용했습니다.
- source_word: ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ
  english_pob_choice: saw the tomb and how his body was laid
  chosen_korean: 무덤을 보고 그의 몸이 어떻게 놓였는지도 보았습니다
  alternatives_korean:
  - 무덤을 보았고 그의 몸이 어떻게 놓였는지도 보았습니다
  - 무덤과 그의 몸이 어떻게 놓였는지도 살펴보았습니다
  lexicon: BDAG
  rationale: μνημεῖον은 장례 맥락에서 ‘무덤’이 가장 정확하며, ὡς ἐτέθη는 단순한 배치가 아니라 ‘어떻게 놓였는지’라는 방식까지 포함하므로 이를 분명히 드러냈습니다.
- source_word: σῶμα αὐτοῦ
  english_pob_choice: his body
  chosen_korean: 그의 몸
  alternatives_korean:
  - 그의 시신
  - 그 몸
  lexicon: BDAG
  rationale: 예수의 장례 장면이므로 ‘몸’이 너무 완곡하지 않으면서도 본문이 직접 말하는 σῶμα를 자연스럽게 옮깁니다.
theological_decisions:
- issue: κατακολουθήσασαι와 ἐθεάσαντο의 관계를 한국어에서 어떻게 처리할지
  chosen_reading: ‘와 있었고 … 보았습니다’로 이어서, 이전 동행과 현장 관찰을 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘따라왔고 … 보았습니다’처럼 더 직역적으로 처리할 수 있습니다.
  - ‘갈릴리에서 그와 함께 오신 여자들은 … 보았습니다’처럼 서술할 수 있습니다.
  rationale: 이 구절은 교리적 쟁점보다 서술 순서가 핵심이므로, 원문의 사건 순서를 유지하면서 한국어에서 어색하지 않게 연결하는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence'
