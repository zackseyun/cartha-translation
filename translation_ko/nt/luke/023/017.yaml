base_translation:
  language: en
  yaml_path: translation/nt/luke/023/017.yaml
  text: Now he had an obligation[a] to release one man to them at the festival.
  footnotes:
  - marker: a
    text: This entire verse is absent from several of the earliest Greek manuscripts (including the 3rd-century Papyrus 75 and 4th-century Vaticanus) and early Coptic translations. It is present in other major early manuscripts (such as the 4th-century Sinaiticus), the Latin tradition, and the later Byzantine majority. It was likely added by scribes to harmonize Luke's account with the release custom mentioned in Matthew 27:15 and Mark 15:6. Some manuscripts place this sentence after verse 18.
    reason: textual_critical
translation:
  language: ko
  text: 그는 명절에 그들에게 한 사람을 풀어 주어야 할 의무가 있었습니다.ᵃ
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνάγκην δὲ εἶχεν
  english_pob_choice: had an obligation
  chosen_korean: 의무가 있었습니다
  alternatives_korean:
  - 반드시 그래야 했습니다
  - 해야 할 일이 있었습니다
  - 필연성이 있었습니다
  lexicon: BDAG ἀνάγκη
  rationale: ἀνάγκην ἔχειν은 ‘~할 의무/필요가 있다’는 관용구이므로, 현대 한국어에서는 법적·관습적 압박을 살리는 ‘의무가 있었습니다’가 가장 자연스럽습니다.
- source_word: ἀπολύειν
  english_pob_choice: release
  chosen_korean: 풀어 주어야
  alternatives_korean:
  - 석방해야
  - 놓아 주어야
  - 보내 주어야
  lexicon: BDAG ἀπολύω
  rationale: 구금된 사람을 풀어 주는 법정·형사적 맥락이므로, ‘석방하다’보다 본문 흐름에 맞는 동사구 ‘풀어 주다’를 택했습니다.
- source_word: κατὰ ἑορτὴν
  english_pob_choice: at the festival
  chosen_korean: 명절에
  alternatives_korean:
  - 절기에
  - 축제 때
  - 절기마다
  lexicon: BDAG ἑορτή
  rationale: 유월절 관습을 가리키는 공적·종교적 절기라는 점을 살리면서도 현대 독자에게 자연스러운 ‘명절’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 본문 위치와 문헌 비평 상태
  chosen_reading: 본문을 본문으로 두되 각주로 일부 초기 사본에서의 부재를 알렸습니다.
  alternative_readings:
  - 초기 사본 부재를 반영해 본문에서 제외
  - 각주 없이 본문만 유지
  rationale: 비잔틴 계열 본문에 수록된 읽기를 번역하되, 영어 POB의 본문 비평 주석을 따라 주요 사본 전승 차이를 독자에게 투명하게 알리는 편이 적절합니다.
  doctrine_reference: 본문 비평/사본학
