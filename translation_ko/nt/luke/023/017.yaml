  source_fidelity: 그리스어 ἀνάγκην δὲ εἶχεν ἀπολύειν αὐτοῖς κατὰ ἑορτὴν ἕνα의 뜻, 곧 그가 명절에 그들에게 한 사람을 풀어 주어야 했다는 의무를 충실히 반영합니다. 다만 δέ는 여기서 강한 대조를 요구하지 않으므로 ‘그런데’는 생략하는 편이 문맥상 더 중립적이고 자연스럽습니다.
