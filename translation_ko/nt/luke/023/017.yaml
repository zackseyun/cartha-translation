  terminology: ‘의무’, ‘풀어 주다’, ‘명절’은 각각 ἀνάγκη, ἀπολύω, ἑορτή의 문맥상 의미를 적절히 전달합니다. 본문비평 각주는 영어 POB 감사 기록의 정보와 판단 범위를 충실히 반영합니다.
