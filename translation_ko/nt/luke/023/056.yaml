id: LUK.23.56
reference: Luke 23:56
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
  footnotes:
  - marker: a
    text: Or 'having returned.' The Greek participle indicates action preceding the main verb.
    reason: lexical_alternative
  - marker: b
    text: '''Ointments'' may also be rendered ''perfumes'' or ''fragrant oils.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 돌아와서 향품과 향유를 준비하였습니다. 그리고 안식일에는 계명에 따라 쉬었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아와서’는 분사의 선행성을 자연스럽게 드러낸 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향유’는 ‘향기름’ 또는 ‘향기로운 기름’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  english_pob_choice: after returning
  chosen_korean: 돌아와서
  alternatives_korean:
  - 돌아온 뒤
  - 돌아온 후에
  - 돌아와
  lexicon: BDAG
  rationale: 여성 복수 분사로 앞선 동작이 본동사보다 먼저 일어났음을 나타내므로, 한국어에서는 자연스럽게 선행 의미를 드러내는 ‘돌아와서’로 옮겼습니다.
- source_word: ἀρώματα
  english_pob_choice: spices
  chosen_korean: 향품
  alternatives_korean:
  - 향료
  - 향신료
  - 향료와 향재
  lexicon: BDAG
  rationale: 장례 준비 맥락에서 향료성 물품을 가리키므로, 일반적인 식용 향신료보다 더 넓고 장례용 뉘앙스를 살리는 ‘향품’을 택했습니다.
- source_word: μύρα
  english_pob_choice: ointments
  chosen_korean: 향유
  alternatives_korean:
  - 연고
  - 향기름
  - 향유와 기름
  lexicon: BDAG
  rationale: μύρον의 기본 의미는 향이 섞인 기름/도유용 기름이므로, 한국어 성경에서 널리 이해되면서도 별도의 물건을 구분해 주는 ‘향유’로 옮겼습니다.
- source_word: ἡσύχασαν
  english_pob_choice: they rested
  chosen_korean: 쉬었습니다
  alternatives_korean:
  - 안식했습니다
  - 가만히 있었습니다
  - 쉬어 있었습니다
  lexicon: BDAG
  rationale: 안식일 문맥에서 ‘조용히 있었다’보다 활동을 멈추고 쉰다는 의미가 분명하므로, 동사적 자연성을 살려 ‘쉬었습니다’로 번역했습니다.
- source_word: κατὰ τὴν ἐντολήν
  english_pob_choice: according to the commandment
  chosen_korean: 계명에 따라
  alternatives_korean:
  - 계명에 따라서
  - 명령에 따라
  - 율법의 명령에 따라
  lexicon: BDAG
  rationale: ἡ ἐντολήν을 구체화하지 않고 단수형의 일반적 표현을 유지하되, 안식일 준수 맥락이 분명하므로 한국어에서는 간결하게 ‘계명에 따라’로 옮겼습니다.
theological_decisions:
- issue: 안식일 준수의 근거 표현
  chosen_reading: 토라의 안식일 계명에 따른 순종으로 이해하되, 본문에는 추가 설명을 넣지 않았습니다.
  alternative_readings:
  - 일반적인 신앙 규범
  - 단순한 유대 관습
  rationale: 본문은 단수형 ‘계명’을 사용하며, 문맥상 안식일 계명을 가리키지만, 번역 본문에서는 의미를 확장하지 않고 원문의 절제된 표현을 유지하는 것이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve what the text states without importing extra doctrinal claims.'
