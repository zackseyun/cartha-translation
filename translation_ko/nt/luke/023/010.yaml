  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
  footnotes:
  - marker: a
    text: Or 'bringing charges against him with intensity' / 'fiercely accusing him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 대제사장들과 서기관들은 그곳에 서서, 그를 격렬하게 고발하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “강하게 고발하고 있었습니다”, “맹렬하게 고발하고 있었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  english_pob_choice: stood there
  chosen_korean: 그곳에 서서
  alternatives_korean:
  - 서 있었습니다
  - 그 자리에 서 있었습니다
  lexicon: BDAG
  rationale: 과거의 지속적 서 있는 상태를 한국어에서는 위치성을 살려 '그곳에 서서'로 자연스럽게 옮기되, 장면 제시의 힘을 유지했습니다.
- source_word: δὲ
  english_pob_choice: And
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또
  lexicon: BDAG
  rationale: 앞절의 진행에 이어지지만, 예수께 대한 심리 과정의 대립적 분위기를 살려 약한 대조 접속사로 처리할 수 있습니다.
- source_word: ἐὐτόνως
  english_pob_choice: vehemently
  chosen_korean: 격렬하게
  alternatives_korean:
  - 격하게
  - 열렬하게
  - 강하게
  lexicon: BDAG
  rationale: 단순한 열심보다 공격적 강도를 드러내는 부사이므로, 법정적 고발의 뉘앙스를 살려 '격렬하게'로 옮겼습니다.
- source_word: κατηγοροῦντες αὐτοῦ
  english_pob_choice: accusing him
  chosen_korean: 그를 고발하고 있었습니다
  alternatives_korean:
  - 그를 비난하고 있었습니다
  - 그에게 고발을 제기하고 있었습니다
  lexicon: BDAG
  rationale: κατηγορέω는 법정적 '고발하다'의 뜻이 강하므로, 일반적 '비난하다'보다 직접적인 표현을 택했습니다.
theological_decisions:
- issue: 대제사장들과 서기관들의 태도 표현
  chosen_reading: 공적 심문 자리에서 예수를 향한 지속적이고 격렬한 법정적 고발로 이해했습니다.
  alternative_readings:
  - 단순한 말다툼으로 완화하는 읽기
  - 감정적 비난으로만 제한하는 읽기
  rationale: 문맥상 단순 감정 표현이 아니라 공식적 고발 행위가 진행 중임을 드러내는 것이 본문의 힘과 맞습니다.
  doctrine_reference: 수난 서사 / 예수의 공적 재판
