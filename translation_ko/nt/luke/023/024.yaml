lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  lexicon: BDAG
  rationale: 앞선 서술과 자연스럽게 이어 주는 표지로, 시간적 뉘앙스를 덧붙이지 않는 평이한 연결어를 택했습니다.
- source_word: Πιλᾶτος
  english_pob_choice: Pilate
  chosen_korean: 빌라도
  alternatives_korean:
  - 필라투스
  lexicon: 고유명사 표기 관행
  rationale: 한국어 성경에서 널리 쓰이는 고유명사 형태를 따랐습니다.
- source_word: ἐπέκρινεν
  english_pob_choice: decided
  chosen_korean: 판결했습니다
  alternatives_korean:
  - 결정했습니다
  - 유죄 선고했습니다
  - 판단했습니다
  lexicon: BDAG
  rationale: 이 동사는 법정적 판단을 가리키므로, 현대 한국어에서 그 공적·사법적 무게를 살리는 ‘판결했습니다’가 가장 적절합니다.
- source_word: γενέσθαι τὸ αἴτημα αὐτῶν
  english_pob_choice: should be granted
  chosen_korean: 그들의 요구를 들어주기로
  alternatives_korean:
  - 그들의 요청이 이루어지도록
  - 그들의 청원이 시행되도록
  lexicon: BDAG
  rationale: 직역하면 ‘그들의 요구가 이루어지게’이지만, 한국어에서는 ‘요구를 들어주다’가 판결로 승인된 결과를 자연스럽게 드러냅니다.
- source_word: τὸ αἴτημα
  english_pob_choice: their demand
  chosen_korean: 그들의 요구
  alternatives_korean:
  - 그들의 청원
  - 그들의 부탁
  lexicon: BDAG
  rationale: 군중이 압박하는 문맥에서 ‘청원’보다 ‘요구’가 원문의 강한 압력을 더 잘 반영합니다.
theological_decisions:
- issue: 빌라도의 행위에 대한 법정적 뉘앙스
  chosen_reading: 빌라도가 군중의 요구를 단순히 허락한 것이 아니라, 공식적으로 판결하여 승인한 것으로 옮겼습니다.
  alternative_readings:
  - 빌라도는 그들의 요청을 허락했습니다.
  - 빌라도는 그들의 요구가 이루어지도록 했습니다.
  rationale: ἐπέκρινεν은 단순 호의가 아니라 사법적 결정을 뜻하므로, 본문이 가진 법정적 긴장을 보존해야 합니다.
  doctrine_reference: '번역 원칙: source-direct, legal nuance preservation'
