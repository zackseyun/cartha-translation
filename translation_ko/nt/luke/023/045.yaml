translation:
  language: ko
  text: 해가 어두워지고 있었고, 성전의 휘장이 한가운데로 찢어졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해가 어두워지고 있었다.’ ελλην어는 기술적으로 ‘일식’까지 요구하지 않으므로 그렇게 구체화하지 않았습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘성전의 휘장’에 해당하는 ‘성전의 장막’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘한가운데로 찢어졌다’ 혹은 ‘둘로 찢어졌다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  english_pob_choice: the sun having been darkened
  chosen_korean: 해가 어두워지고 있었고
  alternatives_korean:
  - 해가 사라지고 있었고
  - 해가 약해지고 있었고
  - 해가 그 기능을 잃고 있었고
  lexicon: BDAG
  rationale: ἐκλίπω는 ‘줄어들다/사라지다/그치다’의 의미 범위를 가지므로, 한국어에서는 기술적 ‘일식’으로 좁히지 않고 문맥상 보이는 어두워짐을 자연스럽게 살렸습니다.
- source_word: ἐσχίσθη
  english_pob_choice: was torn
  chosen_korean: 찢어졌습니다
  alternatives_korean:
  - 갈라졌습니다
  - 찢겨졌습니다
  - 분리되었습니다
  lexicon: BDAG
  rationale: σχίζω의 수동 aorist는 천이나 막이 ‘찢어지다’로 가장 직접적으로 대응됩니다. 성전 휘장이라는 대상에도 자연스럽습니다.
- source_word: τὸ καταπέτασμα
  english_pob_choice: the curtain
  chosen_korean: 성전의 휘장
  alternatives_korean:
  - 성전의 커튼
  - 성전의 휘베
  - 성전의 장막
  lexicon: BDAG
  rationale: καταπέτασμα은 성전 분리막을 가리키므로, 한국어 교회 전통과 의미를 함께 살릴 수 있는 ‘휘장’을 택했습니다. ‘커튼’은 현대적이지만 예배/성전 맥락의 무게가 약합니다.
- source_word: μέσον
  english_pob_choice: in the middle
  chosen_korean: 한가운데로
  alternatives_korean:
  - 가운데로
  - 중간에서
  - 둘로
  lexicon: BDAG
  rationale: μέσον은 위치와 절단 양상을 함께 시사하므로 ‘한가운데로’가 가장 간결하고 자연스럽습니다. ‘둘로’는 결과를 보강하지만 원문의 직접성은 약합니다.
theological_decisions:
- issue: 성전 휘장의 번역어 선택
  chosen_reading: ‘휘장’으로 번역해 성전의 분리막이라는 상징성과 전통적 독법을 함께 유지했습니다.
  alternative_readings:
  - 커튼
  - 장막
  rationale: 본문은 단순한 천막이 아니라 성전 내부의 경계막을 가리키므로, 한국어 성서 독자에게 이 장면의 신학적 함의를 가장 잘 전달하는 용어를 택했습니다.
  doctrine_reference: Translation philosophy §6
