base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
  footnotes:
  - marker: a
    text: Or, 'the sun being darkened.' Some translate more specifically, 'the sun eclipsed,' but that is more interpretive than the Greek requires.
