- from: 하지만 예수님은 말씀하고 계셨습니다[a]. “아버지, 저들을 용서해 주십시오. 그들은 자기들이 무엇을 하는지 알지 못합니다.” 그리고 그분의 옷을 나누며 제비를 뽑았습니다.
  to: 그러나 예수께서는 말씀하고 계셨습니다[a]. “아버지, 저들을 용서해 주십시오. 그들은 자신들이 무엇을 하는지 알지 못합니다.” 그들은 그분의 옷을 나누어 제비를 뽑았습니다.
  rationale: 마지막 문장의 주어를 ‘그들은’으로 밝혀, 옷을 나누고 제비를 뽑은 이들이 예수님이 아니라 문맥상의 다른 사람들임을 드러냈습니다. 이는 그리스어 복수형을 충실히 반영하면서 특정 집단을 원문보다 더 좁게 규정하지 않습니다. ‘그러나’는 첫 δέ의 약한 전환·대조를 자연스럽게 나타내며, 미완료상과 본문비평 각주는 유지했습니다.
