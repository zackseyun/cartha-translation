translation:
  language: ko
  text: 그러나 예수께서는 말씀하고 계셨습니다[a]. “아버지, 저들을 용서해 주십시오. 그들은 자신들이 무엇을 하는지 알지 못합니다.” 그들은 그분의 옷을 나누어 제비를 뽑았습니다.
  philosophy: optimal-equivalence
  footnotes:
