id: LUK.23.34
reference: Luke 23:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
  footnotes:
  - marker: a
    text: 'Some manuscripts omit: “Father, forgive them, for they do not know what they are doing.”'
    reason: textual_variant
translation:
  language: ko
  text: 하지만 예수님은 말씀하고 계셨습니다[a]. “아버지, 저들을 용서해 주십시오. 그들은 자기들이 무엇을 하는지 알지 못합니다.” 그리고 그분의 옷을 나누며 제비를 뽑았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “아버지, 저들을 용서해 주십시오. 그들은 자기들이 무엇을 하는지 알지 못합니다.”가 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  english_pob_choice: was saying
  chosen_korean: 말씀하고 계셨습니다
  alternatives_korean:
  - 말했습니다
  - 말하고 계셨습니다
  lexicon: BDAG
  rationale: 미완료 과거의 지속·반복 뉘앙스를 살려 단순 과거보다 진행감을 드러냈습니다.
- source_word: Πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아버지시여
  - 아버지여
  lexicon: BDAG
  rationale: 예수님의 직접 호칭으로 자연스러운 현대 한국어는 ‘아버지’이며, 불필요한 고어화는 피했습니다.
- source_word: ἄφες
  english_pob_choice: forgive
  chosen_korean: 용서해 주십시오
  alternatives_korean:
  - 용서하십시오
  - 사하여 주십시오
  - 풀어 주십시오
  lexicon: BDAG
  rationale: 기도문에서 하나님께 드리는 간구로서 ‘용서해 주십시오’가 가장 직접적이며, ‘사하다’보다 현대 한국어에서 즉시 이해됩니다.
- source_word: οἴδασιν τί ποιοῦσιν
  english_pob_choice: they do not know what they are doing
  chosen_korean: 자기들이 무엇을 하는지 알지 못합니다
  alternatives_korean:
  - 무엇을 하는지 알지 못합니다
  - 무엇을 하고 있는지 깨닫지 못합니다
  lexicon: BDAG
  rationale: οἶδα의 ‘알다’를 보존하고, τί ποιοῦσιν의 현재적 행위를 ‘무엇을 하는지’로 직역에 가깝게 살렸습니다.
- source_word: ἱμάτια
  english_pob_choice: garments
  chosen_korean: 옷
  alternatives_korean:
  - 겉옷
  - 의복
  - 옷가지
  lexicon: BDAG
  rationale: 문맥상 군사들이 나누는 예수님의 소지품을 한국어 독자가 자연스럽게 이해하도록 가장 일반적인 ‘옷’을 택했습니다.
theological_decisions:
- issue: 본문에 포함된 “아버지, 저들을 용서해 주십시오…” 절의 본문 상태
  chosen_reading: 본문에 포함하고 각주로 일부 사본의 생략 가능성을 표시합니다.
  alternative_readings:
  - 일부 사본에서는 이 구절을 생략합니다.
  rationale: 주어진 SBLGNT 본문이 이 말을 포함하므로 본문에 유지하되, 본문비평상의 변이를 투명하게 드러내기 위해 각주를 달았습니다.
  doctrine_reference: 본문비평의 변이를 보존하고, 전승 차이를 독자에게 숨기지 않는 원칙
