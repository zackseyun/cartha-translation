- from: 그는 성 안에서 일어난 어떤 소요와 살인 때문에 감옥에 갇혀 있던 사람이었습니다.[a]
  to: 그는 그 도시에서 일어난 어떤 봉기와 살인 때문에 감옥에 갇힌 사람이었습니다.[a]
  rationale: ‘그 도시에서’는 ἐν τῇ πόλει를 불필요하게 공간적으로 좁히지 않고 옮깁니다. ‘감옥에 갇힌’은 βληθεὶς의 수동적 수감 사건을 자연스러운 한국어로 반영합니다. στάσις는 ‘봉기’로 옮기되 각주에서 의미 범위의 불확정성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:41Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ἐν τῇ πόλει는 ‘그 도시에서’이며, ‘성 안에서’는 도시를 성곽으로 둘러싸인 공간으로 좁혀 표현합니다. 또한 βληθεὶς는 수감된 상태보다 감옥에 ‘넣어진’ 사건을 가리키므로 이를 반영하는 편이 좋습니다.
  naturalness: ‘그는 … 사람이었습니다’는 자연스럽고 합쇼체 문체에도 맞습니다. 다만 ‘감옥에 갇혀 있던’은 원문의 완료된 수감 행위보다 상태를 두드러지게 합니다. ‘감옥에 들어가 있던’은 자연스럽지만 수동성과 βάλλω의 힘이 약해지므로 ‘감옥에 갇힌’이 간결하고 적절합니다.
  terminology: στάσις의 ‘소요’는 가능한 번역이나 정치적·반란적 성격을 다소 약화할 수 있습니다. 본문의 불확정성을 보존하면서도 더 직접적인 ‘봉기’를 본문으로 채택하고, ‘소요’와 ‘반란’을 각주 대안으로 제시하는 것이 적절합니다. φόνον의 ‘살인’은 적절합니다.
  issues:
  - severity: medium
    issue: ἐν τῇ πόλει를 ‘성 안에서’로 번역함
    rationale: πόλις는 ‘도시/성읍’이지 반드시 ‘성 안’이라는 성곽 내부 공간을 뜻하지 않습니다. ‘그 도시에서’가 원문의 지시성과 범위를 더 정확히 보존합니다.
  - severity: medium
    issue: βληθεὶς의 사건성을 ‘갇혀 있던’이라는 상태 표현으로만 처리함
    rationale: 분사는 ‘감옥에 던져져/갇힌’ 수감 행위를 가리킵니다. 한국어에서는 ‘감옥에 갇힌’이 자연스러우면서도 수동 사건성을 더 잘 살립니다.
  - severity: low
    issue: στάσις를 ‘소요’로 고정함
    rationale: ‘소요’는 가능하지만 봉기·반란의 정치적 성격을 약화할 수 있습니다. ‘봉기’를 본문에 두고 대안을 각주로 보존하는 편이 최적등가 원칙에 더 부합합니다.
  revised_text: 그는 그 도시에서 일어난 어떤 봉기와 살인 때문에 감옥에 갇힌 사람이었습니다.[a]
  revised_footnotes:
