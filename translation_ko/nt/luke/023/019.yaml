  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
  footnotes:
  - marker: a
    text: Or 'insurrection.' The Greek στάσις can denote a revolt, uprising, or insurrection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성 안에서 일어난 어떤 소요와 살인 때문에 감옥에 갇혀 있던 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉기’. 그리스어 στάσις는 반란, 봉기, 소요를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  english_pob_choice: who
  chosen_korean: 그는 … 사람이었습니다
  alternatives_korean:
  - 그는 … 자였습니다
  - 그 사람은 … 사람이었습니다
  lexicon: BDAG
  rationale: 바라바를 가리키는 관계대명사이므로 한국어에서는 자연스러운 회상 표현으로 처리했습니다. 문맥상 ‘그는’이 가장 읽기 쉽고, 뒤의 설명절을 이끌기에 충분합니다.
- source_word: διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει
  english_pob_choice: for a certain uprising that had taken place in the city
  chosen_korean: 성 안에서 일어난 어떤 소요 때문에
  alternatives_korean:
  - 성 안에서 일어난 어떤 봉기 때문에
  - 성 안에서 일어난 어떤 반란 때문에
  - 성 안에서 일어난 어떤 폭동 때문에
  lexicon: BDAG
  rationale: στάσις는 시민적 소요에서 정치적 반란까지 폭넓게 가리키므로, 여기서는 POB의 ‘uprising’에 대응하되 한국어에서 과도하게 군사·혁명적 뉘앙스를 고정하지 않는 ‘소요’를 택했습니다. ‘성 안’은 본문의 도시를 과도하게 특정하지 않으면서 장소 감각을 살립니다.
- source_word: φόνον
  english_pob_choice: murder
  chosen_korean: 살인
  alternatives_korean:
  - 살해
  - قتل?
  - 살인죄
  lexicon: BDAG
  rationale: φόνος는 단순한 죽임이 아니라 살인/살해의 범죄성을 가리키므로, 문맥상 법적 의미가 살아 있는 ‘살인’이 적절합니다.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  english_pob_choice: had been thrown into prison
  chosen_korean: 감옥에 갇혀 있던
  alternatives_korean:
  - 감옥에 던져졌던
  - 감옥에 던져져 있던
  - 감옥에 갇혀 있었습니다
  lexicon: BDAG
  rationale: βάλλω의 수동분사는 직역하면 ‘던져진’이지만, 한국어에서는 수감 상태를 자연스럽게 나타내는 ‘갇혀 있던’이 문맥상 가장 매끄럽습니다. 과거완료적 배경을 반영해 서술어를 과거형으로 처리했습니다.
theological_decisions:
- issue: στάσις의 정치적 강도와 한국어 선택
  chosen_reading: ‘소요’로 번역해 범죄성과 공공질서 교란을 드러내되, 특정 정치 이념의 봉기처럼 과도하게 규정하지 않았습니다.
  alternative_readings:
  - 봉기
  - 반란
  - 폭동
  rationale: 본문은 바라바의 죄목을 간단히 설명하는 문맥이므로, 독자가 즉시 이해할 수 있는 범위에서 원문의 불확정성과 폭력성을 함께 보존하는 것이 적절합니다.
  doctrine_reference: 문맥적 역사서술
