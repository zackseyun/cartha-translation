    text: 또는 ‘소요’, ‘반란’. 그리스어 στάσις는 소요, 봉기, 반란을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘그 도시에서’는 ἐν τῇ πόλει를 불필요하게 공간적으로 좁히지 않고 옮깁니다. ‘감옥에 갇힌’은 βληθεὶς의 수동적 수감 사건을 자연스러운 한국어로 반영합니다. στάσις는 ‘봉기’로 옮기되 각주에서 의미 범위의 불확정성을 보존했습니다.
