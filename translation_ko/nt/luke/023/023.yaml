  to: 그러나 그들은 큰 소리로 그가 십자가에 못 박히기를 요구하며 계속 압박했고, 그들의 목소리가 우세했습니다.[a]
  rationale: 접속사 δέ를 문맥상 ‘그러나’로 옮기고, 미완료형 ἐπέκειντο의 지속성을 ‘계속 압박했고’로 보존했습니다. αἰτούμενοι의 요청·요구 의미와 수동 부정과거 부정사 ‘그가 십자가에 못 박히기를’도 유지했습니다. 마지막 절은 복수 ‘목소리’를 그대로 반영하고, κατίσχυον을 자연스럽고 중립적인 ‘우세했습니다’로 옮겼습니다. 각주도 그리스어의 φωνή 반복과 가능한 ‘외침’ 번역을 정확히 설명하도록 고쳤습니다.
