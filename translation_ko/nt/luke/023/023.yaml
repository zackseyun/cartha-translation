  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
  footnotes:
  - marker: a
    text: Or 'their cries were prevailing.' The Greek repeats the word for 'voices' in both clauses, which may also be rendered 'cries' in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 큰 소리로 계속 몰아붙이며 그가 십자가에 못 박히기를 요구했고, 그들의 목소리가 이겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 목소리’가 두 절에 반복됩니다. 이 반복은 여기서 단순한 ‘외침’보다 압도적 압력을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  english_pob_choice: kept pressing
  chosen_korean: 계속 몰아붙이며
  alternatives_korean:
  - 계속 압박하며
  - 끈질기게 요구하며
  - 계속 주장하며
  lexicon: BDAG
  rationale: 미완료 과거의 지속적 압박을 살리기 위해 단회적 ‘요구했다’보다 진행성을 드러내는 표현을 택했습니다.
- source_word: φωναῖς μεγάλαις
  english_pob_choice: with loud voices
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 목소리로
  - 높은 소리로
  - 크게 외치며
  lexicon: BDAG
  rationale: φωνή의 반복을 살리되 한국어로는 자연스러운 부사구인 ‘큰 소리로’가 가장 간결하게 음성적 강도를 전달합니다.
- source_word: αἰτούμενοι
  english_pob_choice: asking
  chosen_korean: 요구했고
  alternatives_korean:
  - 요청했고
  - 간청했고
  - 청원했고
  lexicon: BDAG
  rationale: 법정 맥락에서 단순한 ‘묻다’보다 강한 압력을 드러내는 문맥을 반영해 ‘요구하다’를 택했습니다.
- source_word: κατίσχυον
  english_pob_choice: were prevailing
  chosen_korean: 이겼습니다
  alternatives_korean:
  - 우세했습니다
  - 압도했습니다
  - 이겨 가고 있었습니다
  lexicon: BDAG
  rationale: 결과를 서술하는 한국어로 자연스럽게 옮기면서도, 군중의 목소리가 판세를 좌우했다는 의미를 유지했습니다.
theological_decisions:
- issue: 군중의 압력이 재판 절차를 좌우하는 장면의 표현
  chosen_reading: 직접적이고 절박한 법정 압력으로 드러나게 번역했습니다.
  alternative_readings:
  - 더 완곡하게 ‘간청했습니다’로 옮김
  - ‘목소리가 우세했습니다’처럼 중립적으로 표현
  rationale: 본문은 단순 요청이 아니라 지속적 압박과 승세를 묘사하므로, 그 긴장을 약화시키지 않는 방향이 원문 의도에 더 가깝습니다.
  doctrine_reference: 본문 맥락 보존 및 서술 긴장 유지
