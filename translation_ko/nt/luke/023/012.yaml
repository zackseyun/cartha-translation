source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
  footnotes:
  - marker: a
    text: Or 'became friendly with each other.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had previously been at enmity with one another.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 헤롯과 빌라도가 서로 친구가 되었습니다. 이전에는 서로 적대하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로 우호적인 사이가 되었습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이전에는 서로 원수 관계에 있었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  english_pob_choice: became
  chosen_korean: 되었습니다
  alternatives_korean:
  - 맺어졌습니다
  - 되어 갔습니다
  lexicon: BDAG
  rationale: 관계 상태의 변화를 나타내므로, 자연스러운 합쇼체로 ‘되었습니다’가 가장 직접적입니다.
- source_word: φίλοι
  english_pob_choice: friends
  chosen_korean: 친구가
  alternatives_korean:
  - 친밀한 사이가
  - 우호적인 관계가
  lexicon: BDAG
  rationale: predicate nominative로서 실제 관계 변화를 가리키므로, ‘친구가 되었습니다’가 본문을 가장 분명하게 옮깁니다.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  english_pob_choice: on that very day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 바로 그날에
  - 그날 바로
  lexicon: BDAG
  rationale: 강조는 살리되 한국어에서는 ‘그날에’가 가장 간결하고 자연스럽습니다.
- source_word: ἐν ἔχθρᾳ
  english_pob_choice: in hostility
  chosen_korean: 적대하고
  alternatives_korean:
  - 적대 상태에 있었고
  - 원수 관계에 있었고
  lexicon: BDAG
  rationale: 명사구 ‘적대’의 상태를 한국어 동사구로 자연스럽게 풀되, 관계적 적대의 의미를 유지했습니다.
theological_decisions:
- issue: 헤롯과 빌라도의 관계 변화의 성격
  chosen_reading: 본문은 그들이 그날 친구가 되었다는 사실만 말하며, 그 관계가 단순한 우호인지 정치적 동맹인지까지는 규정하지 않습니다.
  alternative_readings:
  - ‘친구’보다 약하게 ‘우호적인 사이’로 읽을 수 있습니다.
  rationale: 그리스어 φίλοι의 관계 변화는 분명하지만, 본문이 그 이상의 동기나 평가를 설명하지 않으므로 과도한 해석을 넣지 않았습니다.
  doctrine_reference: 본문이 말하는 만큼만 번역하여 신학적 긴장을 보존합니다.
