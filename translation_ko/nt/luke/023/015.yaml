review_pass:
  verdict: revise
  source_fidelity: ‘그러지 못했습니다’는 헤롯이 그렇게 할 능력이 없었다는 뜻이 되어, 앞 절의 판단을 함께 내리지 않았다는 그리스어의 타원 표현을 잘못 옮깁니다. 또한 ‘그에게는 … 일이 일어나지 않았습니다’는 αὐτῷ를 예수에게 일어난 일로 이해하게 하여, 예수에게 귀속되는 사형감 행위가 없다는 재판적 진술을 훼손합니다.
  naturalness: ‘헤롯도 그렇게 판단하지 않았습니다’는 앞 절의 빌라도 판단을 자연스럽게 이어 주며 합쇼체에 맞습니다. 마지막은 ‘그가 … 저지른 사실이 없습니다’로 명료하고 현대적인 재판 언어로 다듬었습니다.
  terminology: ‘사형에 해당할’은 ἄξιον θανάτου의 법정적 의미를 적절히 전달합니다. ‘돌려보냈습니다’는 이 문맥에서 ἀνέπεμψεν의 재송환 의미를 살립니다.
  issues:
