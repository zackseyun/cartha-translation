  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
  footnotes:
  - marker: a
    text: Or 'But not even Herod, for he sent him back to us; and see, nothing worthy of death has been done by him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지만 헤롯도 그러지 못했습니다. 그는 그를 우리에게 돌려보냈기 때문입니다. 보십시오, 그에게는 사형에 해당하는 아무 일도 일어나지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그렇지만 헤롯도 그러지 않았습니다. 그는 그를 우리에게 돌려보냈기 때문입니다. 그리고 보십시오, 그에게는 사형에 해당하는 아무 일도 일어나지 않았습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ
  english_pob_choice: But neither did
  chosen_korean: 그렇지만 …도 그러지 못했습니다
  alternatives_korean:
  - 그런데 헤롯도 …하지 않았습니다
  - 그렇지만 헤롯도 그러지 못했습니다
  lexicon: BDAG
  rationale: 앞 절과의 대조를 살리면서 헤롯도 앞선 판단에 동조했다는 뜻을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  english_pob_choice: for he sent him back to us
  chosen_korean: 그는 그를 우리에게 돌려보냈기 때문입니다
  alternatives_korean:
  - 그는 그를 우리에게 보냈기 때문입니다
  - 그는 그를 우리에게 되돌려보냈기 때문입니다
  lexicon: BDAG
  rationale: ἀναπέμπω의 재송환/반송 뉘앙스를 반영해 ‘돌려보냈습니다’로 옮겼고, πρὸς ἡμᾶς는 문맥상 ‘우리에게’로 자연스럽게 처리했습니다.
- source_word: καὶ ἰδοὺ
  english_pob_choice: And look / And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보십시오
  lexicon: BDAG
  rationale: 주의 환기 표지로서의 ἰδού를 합쇼체에 맞게 직접적인 청자 호소인 ‘보십시오’로 옮겼습니다.
- source_word: οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ
  english_pob_choice: nothing deserving of death has been done by him
  chosen_korean: 그에게는 사형에 해당하는 아무 일도 일어나지 않았습니다
  alternatives_korean:
  - 그가 사형에 해당하는 아무 일도 저지르지 않았습니다
  - 그에게는 죽음에 합당한 아무 일도 없었습니다
  lexicon: BDAG
  rationale: 핵심은 예수에게 귀속될 사형감 행위가 없다는 재판적 선언이므로, ‘사형에 해당하는’으로 형사적 무게를 살리되 한국어에서는 과도한 직역을 피했습니다.
theological_decisions:
- issue: πεπραγμένον의 행위 주체와 무죄 선언의 뉘앙스
  chosen_reading: 예수께서 사형을 받을 만한 행위를 한 적이 없다는 무죄 판결로 읽었습니다.
  alternative_readings:
  - 예수께 그런 일들이 일어나지 않았다는 뜻으로 읽을 수 있습니다
  - 예수에게 행해진 일이 없었다는 뜻으로 읽을 수 있습니다
  rationale: 문맥상 빌라도가 예수의 죄책이 없음을 진술하는 장면이므로, 동사의 결과를 예수의 행위 귀속으로 이해해 재판적 의미를 보존했습니다.
  doctrine_reference: 공관복음의 예수 무죄 선언
- issue: ἰδοὺ의 문체
  chosen_reading: 합쇼체의 직접 환기 표현인 ‘보십시오’를 사용했습니다.
  alternative_readings:
  - ‘보라’로 더 성서적 어감을 낼 수 있습니다
  - ‘그리고 보십시오’로 더 문자적으로 옮길 수 있습니다
  rationale: 본문의 강조를 살리면서도 현대 표준어 합쇼체와 어조를 맞추기 위한 선택입니다.
  doctrine_reference: 문체/화행
