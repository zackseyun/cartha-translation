  rationale: ὄπισθεν은 공간적 ‘뒤’를 가리키므로, 단순한 시간적 ‘후에’보다 행진 장면의 위치 관계를 드러내는 표현을 택했습니다.
  doctrine_reference: Original-language primacy over idiomatic smoothing
