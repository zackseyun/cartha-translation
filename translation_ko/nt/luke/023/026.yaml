id: LUK.23.26
reference: Luke 23:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
  footnotes:
  - marker: a
    text: Or 'coming in from the field.' The Greek may refer either to a field specifically or more generally to the countryside outside the city.
    reason: lexical_alternative
  - marker: b
    text: Some understand 'the cross' here more specifically as 'the crossbeam,' but the Greek text says simply 'the cross.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 그를 끌고 갈 때에, 시몬이라 하는 구레네 사람 하나를 붙잡았는데, 그는 들에서 들어오던 사람이었습니다. 그들은 그에게 십자가를 지워 예수의 뒤를 따라가게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들’은 ἀγρός의 넓은 의미를 반영한 것입니다. 문맥상 특정한 밭이라기보다 도시 밖에서 들어오는 상황을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부는 σταυρός를 더 구체적으로 ‘십자가 횃대’로 이해하지만, 본문은 단순히 ‘십자가’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  english_pob_choice: led ... away
  chosen_korean: 끌고 갈 때에
  alternatives_korean:
  - 데려갈 때에
  - 끌고 갔을 때에
  lexicon: BDAG
  rationale: ἀπάγω는 끌어가다/데려가다의 뜻이므로, 체포된 예수를 호송하는 상황을 살려 ‘끌고 갈 때에’로 옮겼습니다.
- source_word: ἐπιλαβόμενοι
  english_pob_choice: they seized
  chosen_korean: 붙잡았는데
  alternatives_korean:
  - 붙들었는데
  - 끌어잡았는데
  lexicon: BDAG
  rationale: 이 분사는 신체적으로 붙들어 조치하는 강한 동작을 나타내므로, 단순한 접촉보다 강한 ‘붙잡다’를 택했습니다.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  english_pob_choice: coming in from the countryside
  chosen_korean: 들에서 들어오던 사람이었습니다
  alternatives_korean:
  - 시골에서 들어오던 사람이었습니다
  - 밭에서 들어오던 사람이었습니다
  lexicon: BDAG
  rationale: ἀγρός는 ‘밭’도 되지만 더 넓게는 시외/들판을 가리킬 수 있어, 문맥상 ‘들에서 들어오다’로 자연스럽게 옮겼습니다.
- source_word: τὸν σταυρὸν
  english_pob_choice: the cross
  chosen_korean: 십자가를
  alternatives_korean:
  - 횃대를
  - 십자가 횃대를
  lexicon: BDAG
  rationale: 본문은 σταυρός를 사용하므로, 재구성적인 ‘횃대’보다 직접적이고 표준적인 ‘십자가’를 유지했습니다.
theological_decisions:
- issue: ὄπισθεν τοῦ Ἰησοῦ의 방향감
  chosen_reading: 예수의 뒤를 따라가게 했습니다
  alternative_readings:
  - 예수 뒤에서 가게 했습니다
  - 예수의 뒤를 따르게 했습니다
  rationale: ὄπισθεν은 공간적 ‘뒤’를 가리키므로, 단순한 시간적 ‘후에’보다 행진 장면의 위치 관계를 드러내는 표현을 택했습니다.
  doctrine_reference: Original-language primacy over idiomatic smoothing
