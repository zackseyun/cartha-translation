base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
  footnotes:
  - marker: a
    text: Or 'evildoers' or 'malefactors.' The Greek term refers to wrongdoers under criminal condemnation.
    reason: lexical_alternative
  - marker: b
    text: Or 'to be executed.' The Greek says 'to be put to death' and does not itself specify the method here, though the context shows crucifixion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 두 명의 다른 죄수도 — 함께 그와 더불어 죽임을 당하려고 — 끌려가고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄수’는 여기서 κακοῦργοι의 사법적·형벌적 성격을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘죽이다/죽임을 당하다’의 범위를 말하며, 이 절 자체는 처형 방식을 직접 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
