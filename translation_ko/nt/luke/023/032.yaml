theological_decisions:
- issue: 처형 방식의 구체화 여부
  chosen_reading: ‘죽임을 당하려고’로 번역해, 이 절만으로는 십자가형을 직접 명시하지 않았습니다.
  alternative_readings:
  - 십자가에 못 박히려고
  - 사형당하려고
  rationale: 문맥상 십자가형이 분명하더라도, 원문의 동사 ἀναιρεθῆναι는 이 절에서 단지 ‘죽이다/제거하다’의 범위이므로 본문이 말하는 것 이상을 덧붙이지 않았습니다.
  doctrine_reference: '원문 우선 번역 원칙: 문맥상 자명한 내용이라도 개별 절의 어휘 범위를 넘어서는 구체화는 피합니다.'
