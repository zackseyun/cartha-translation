lexical_decisions:
- source_word: Πιλᾶτος
  english_pob_choice: Pilate
  chosen_korean: 빌라도
  alternatives_korean:
  - 필라도
  lexicon: 고유명사 표기 관행
  rationale: 통용되는 성경 인명 표기인 ‘빌라도’를 따랐습니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그리고
  alternatives_korean:
  - 그러나
  - 그런데
  lexicon: BDAG
  rationale: 서사 진행의 약한 전개 표지로서, 한국어에서는 앞 문장을 자연스럽게 이어 주는 ‘그리고’가 가장 무리 없습니다.
- source_word: ἀκούσας
  english_pob_choice: hearing this
  chosen_korean: 이것을 듣고
  alternatives_korean:
  - 들으시고
  - 들어서
  - 들은 뒤에
  lexicon: BDAG
  rationale: 분사구문을 한국어의 ‘-고’ 연결로 옮겨, 앞선 진술을 듣고 즉시 반응하는 흐름을 살렸습니다.
- source_word: ὁ ἄνθρωπος
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람을
  lexicon: BDAG
  rationale: 직역적 ‘사람’을 유지하되, 문맥상 예수를 가리키는 것을 드러내기 위해 자연스러운 지시 표현을 택했습니다.
- source_word: Γαλιλαῖός ἐστιν
  english_pob_choice: was a Galilean
  chosen_korean: 갈릴리 사람인지
  alternatives_korean:
  - 갈릴리 사람인지를
  - 갈릴리 출신인지
  lexicon: BDAG
  rationale: 직접 인용이 아닌 간접 의문문이므로 한국어에서도 ‘인지’로 처리해, 빌라도의 질문 내용을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 인칭과 존대의 문체
  chosen_reading: 서술문은 합쇼체로, 빌라도의 질문도 동일한 공적 서술 톤을 유지했습니다.
  alternative_readings:
  - 질문을 더 구어적으로 낮추는 방식
  - 예수에 대한 존대를 과도하게 표시하는 방식
  rationale: 본문은 역사 서술이며, 인물의 사회적 지위나 화자 존대가 아니라 사건 진행이 핵심이므로 표준적 현대 문체를 유지했습니다.
  doctrine_reference: 서사체 문체 일관성
