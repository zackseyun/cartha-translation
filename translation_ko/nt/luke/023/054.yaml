  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
  footnotes:
  - marker: a
    text: Or, more literally, 'the Sabbath was dawning.' The Greek verb can mean 'was dawning' or 'was beginning'; here it refers to the Sabbath's onset at evening.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날은 준비일이었고, 안식일이 시작되고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는, ‘안식일이 동이 트고 있었습니다.’ 여기서 이 동사는 ‘동이 트다’ 또는 ‘시작되다’를 뜻할 수 있으며, 이 문맥에서는 저녁에 시작되는 안식일의 개시를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  english_pob_choice: Preparation
  chosen_korean: 준비일
  alternatives_korean:
  - 준비
  - 예비일
  - 금요일
  lexicon: BDAG
  rationale: 유대 달력 용어로서의 παρασκευή를 살리되, 관용적이면서도 원문 투명성을 유지하는 표현으로 옮겼습니다. 금요일로 풀면 해석이 지나치게 앞서갑니다.
- source_word: ἡμέρα ἦν παρασκευῆς
  english_pob_choice: it was the day of Preparation
  chosen_korean: 그것은 준비일이었고
  alternatives_korean:
  - 그것은 준비의 날이었고
  - 그것은 예비일이었고
  lexicon: BDAG
  rationale: 원문의 명사구를 한국어에서 자연스럽게 풀면서도, 뒤의 안식일 언급과 함께 특수한 날 이름임을 드러내도록 했습니다.
- source_word: ἐπέφωσκεν
  english_pob_choice: was beginning
  chosen_korean: 시작되고 있었습니다
  alternatives_korean:
  - 동이 트고 있었습니다
  - 밝아지고 있었습니다
  - 다가오고 있었습니다
  lexicon: BDAG
  rationale: 문맥상 안식일의 시작을 가리키므로, 아침의 '동틀 무렵'처럼 오해되지 않게 하면서 진행형으로 그 시작의 국면을 표현했습니다.
- source_word: σάββατον
  english_pob_choice: the Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 그 안식일
  - 안식날
  lexicon: BDAG
  rationale: 유대교적 정규 용어인 안식일을 사용해 문맥의 종교적·달력적 의미를 분명히 했습니다.
theological_decisions:
- issue: ἐπέφωσκεν의 시간감각
  chosen_reading: 안식일은 저녁에 시작되는 유대식 날짜 계산을 배경으로 '시작되고 있었습니다'로 옮겼습니다.
  alternative_readings:
  - '''동이 트고 있었습니다''처럼 아침의 밝아옴으로 옮기는 방식'
  - '''안식일이 밝아오고 있었습니다''로 직역하는 방식'
  rationale: 본문은 장례 준비가 안식일 전 마감 시점에 이루어지는 장면이므로, 아침 새벽이 아니라 안식일 개시를 가리키는 의미를 드러내야 합니다.
  doctrine_reference: Translation philosophy §3 (source-based tension preserved)
