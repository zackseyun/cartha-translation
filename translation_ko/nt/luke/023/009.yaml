translation:
  language: ko
  text: 헤롯은 예수님께 오래도록 여러 가지를 물었으나, 예수님께서는 그에게 아무 대답도 하지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 말로’. 그리스어 표현은 길고 계속된 언어적 질문을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  english_pob_choice: questioned
  chosen_korean: 계속 질문했으나
  alternatives_korean:
  - 질문했습니다
  - 묻고 있었습니다
  - 계속 물었습니다
  lexicon: BDAG
  rationale: 미완료 시제의 반복·지속성을 살려 단발적 ‘질문했습니다’보다 진행성을 드러냈습니다. 문맥상 심문에 가까운 압박을 반영해 ‘계속 질문했으나’로 옮겼습니다.
- source_word: ἐν λόγοις ἱκανοῖς
  english_pob_choice: at considerable length
  chosen_korean: 여러 말로
  alternatives_korean:
  - 상당한 길이로
  - 많은 말로
  - 여러 질문으로
  lexicon: BDAG
  rationale: 직역하면 ‘충분한/많은 말로’이지만, 한국어에서는 ‘여러 말로’가 길게 이어지는 말문을 자연스럽게 드러냅니다. POB의 ‘at considerable length’에 해당하는 지속성과 분량을 간결하게 살렸습니다.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  english_pob_choice: he answered him nothing
  chosen_korean: 아무 대답도 하지 않으셨습니다
  alternatives_korean:
  - 그에게 아무 대답도 하지 않았습니다
  - 아무 말도 하지 않으셨습니다
  - 그에게 대답하지 않으셨습니다
  lexicon: BDAG
  rationale: οὐδέν과 ἀπεκρίνατο의 결합은 ‘아무 대답도 하지 않다’로 직접 옮기는 것이 가장 분명합니다. 예수님에 대한 서술이므로 종결은 존대형으로 두었습니다.
- source_word: αὐτός
  english_pob_choice: he
  chosen_korean: 그는
  alternatives_korean:
  - 그 자신은
  - 예수님은
  lexicon: BDAG
  rationale: 헬라어의 대조적 강조를 한국어에서는 평이한 주어 ‘그는’으로 자연스럽게 드러냈습니다. 바로 앞의 질문자와 대비가 문맥에서 충분히 전달됩니다.
theological_decisions:
- issue: 예수님의 무응답을 어떻게 서술할지
  chosen_reading: 무대응 자체를 분명히 하되, 문장을 과장하지 않고 ‘아무 대답도 하지 않으셨습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 침묵하셨습니다
  - 대답하지 않으셨습니다
  rationale: 본문의 핵심은 예수님의 침묵이라는 사실이며, 헬라어는 ‘아무것도 대답하지 않았다’고 명시합니다. 따라서 해석을 덧붙이기보다 무응답을 직접적으로 제시했습니다.
  doctrine_reference: 그리스도의 수난 서술 / 본문 충실성
