id: LUK.23.28
reference: Luke 23:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
  footnotes:
  - marker: a
    text: Or “Women of Jerusalem.” The Greek literally says “Daughters of Jerusalem,” a prophetic-style address preserved in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 예수께서 그들을 향해 돌아서서 말씀하셨습니다. 「예루살렘의 딸들아, 나를 두고 울지 말고, 오히려 너희 자신과 너희 자녀들을 두고 우십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 “예루살렘의 딸들”입니다. POB는 이 표현의 예언자적 호칭을 살리기 위해 본문에 그대로 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  english_pob_choice: But turning toward them
  chosen_korean: 그들을 향해 돌아서서
  alternatives_korean:
  - 돌아서며
  - 그들에게 돌아서서
  lexicon: BDAG
  rationale: 분사 구조를 한국어로 자연스럽게 풀어, 예수의 물리적 방향 전환과 이어지는 발화를 함께 드러냈습니다.
- source_word: Θυγατέρες Ἰερουσαλήμ
  english_pob_choice: Daughters of Jerusalem
  chosen_korean: 예루살렘의 딸들아
  alternatives_korean:
  - 예루살렘의 여자들아
  - 예루살렘의 여성들아
  lexicon: BDAG
  rationale: 직역에 가까운 호격을 살려 예언자적·성경적 울림을 보존했으며, POB의 ‘Daughters’ 선택을 따랐습니다.
- source_word: μὴ κλαίετε
  english_pob_choice: do not weep
  chosen_korean: 울지 말고
  alternatives_korean:
  - 울지 마십시오
  - 우시지 마십시오
  lexicon: BDAG
  rationale: 부정 명령과 이어지는 대조를 한국어 구문으로 자연스럽게 표현했습니다.
- source_word: ἐφ’ ἑαυτὰς ... καὶ ἐπὶ τὰ τέκνα ὑμῶν
  english_pob_choice: for yourselves and for your children
  chosen_korean: 너희 자신과 너희 자녀들을 두고
  alternatives_korean:
  - 너희 자신과 너희 자녀들 위에
  - 너희 자신과 너희 자녀들 때문에
  lexicon: BDAG
  rationale: ἐπί의 대상/관련성을 한국어에서는 ‘~을 두고’로 옮겨, 앞의 ἐπ’ ἐμέ와 평행을 유지했습니다.
theological_decisions:
- issue: 예수의 직접 화법 안에서의 높임말과 명령형 처리
  chosen_reading: 서술문은 합쇼체로 유지하되, 예수의 직접 발화는 존칭적 종결과 명령형으로 옮겼습니다.
  alternative_readings:
  - 직접 발화도 서술체로 통일
  - 예수의 말을 평서형으로 완화
  rationale: 본문의 예수 말씀을 한국어 독자에게 경건하고 분명하게 전달하되, 원문의 긴박한 경고와 애도 반전을 약화시키지 않기 위한 선택입니다.
  doctrine_reference: Translation philosophy §§1, 6
