revisions:
- from: 그리고 많은 백성과 여자들이 그를 따르고 있었는데, 여자들은 가슴을 치며 그를 위해 슬퍼하고 있었습니다.[a][b]
  to: 그리고 백성과 여자들로 이루어진 큰 무리가 그를 따라가고 있었습니다. 여자들은 가슴을 치며 그를 애도하고 있었습니다.[a][b]
  rationale: 큰 무리(πολὺ πλῆθος)를 명시하고, 그 무리가 백성과 여자들로 이루어졌다는 원문의 구성을 자연스럽게 옮겼습니다. 또한 θρηνέω αὐτόν을 ‘그를 애도하다’로 번역하여 애도의 대상을 명료하게 했습니다. 여성 복수 관계대명사가 여자들만을 수식한다는 점은 독립 문장으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
