  lexicon: BDAG
  rationale: 여성 복수 관계대명사가 문상 행위를 여성들에게 한정함을 반영해, 한국어 본문에서 주어를 분명히 밝혔습니다.
- source_word: ἐκόπτοντο
  english_pob_choice: were beating their breasts
  chosen_korean: 가슴을 치며
  alternatives_korean:
  - 가슴을 두드리며
  - 자기 몸을 치며
  lexicon: BDAG
  rationale: 문상 관습의 몸짓을 한국어 관용으로 드러내되, 본문이 요구하는 문화적 행위를 과도하게 해설하지 않도록 했습니다.
- source_word: ἐθρήνουν αὐτόν
  english_pob_choice: mourning for him
  chosen_korean: 그를 위해 슬퍼하고 있었습니다
  alternatives_korean:
  - 그를 애도하고 있었습니다
  - 그를 위해 통곡하고 있었습니다
  lexicon: BDAG
  rationale: θρηνέω의 애도/슬픔 의미를 살리면서, 현대 한국어에서 자연스러운 감정 표현으로 옮겼습니다.
theological_decisions:
- issue: 문상 행위의 문화적 표현을 어떻게 처리할지
  chosen_reading: ‘가슴을 치며’로 문상 관습을 드러내고, 본문 의미를 설명적으로 확장하지는 않았습니다.
  alternative_readings:
  - ‘자기 가슴을 치며’
  - ‘가슴을 치며 통곡하고’
  rationale: 본문의 관습적 애도 행위를 이해 가능하게 하되, 원문 이상의 해석을 덧붙이지 않기 위해 최소한의 명시만 사용했습니다.
  doctrine_reference: 본문 해석의 절제와 문화적 관습의 보존
