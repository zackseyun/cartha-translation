id: LUK.23.27
reference: Luke 23:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: And a large crowd of the people and of women was following him[b][a], and the women were beating their breasts and mourning for him.
  footnotes:
  - marker: a
    text: Or, more literally, 'were beating themselves and lamenting him'; the Greek likely refers to the customary act of beating the breast in mourning.
    reason: cultural_note
  - marker: b
    text: The relative pronoun 'who' is feminine plural, indicating that the mourning actions are specifically attributed to the women.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 백성과 여자들이 그를 따르고 있었는데, 여자들은 가슴을 치며 그를 위해 슬퍼하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기 몸을 치며’에 가깝지만, 문맥상 문상 때 가슴을 치는 관습적 행위를 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 여성 복수 관계대명사로서, 애도 행위가 전체 무리가 아니라 여자들에게 속함을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  english_pob_choice: was following
  chosen_korean: 따르고 있었습니다
  alternatives_korean:
  - 따랐습니다
  - 뒤따르고 있었습니다
  lexicon: BDAG
  rationale: 미완료시제의 진행성을 살려 과거의 계속된 동작을 자연스러운 합쇼체로 옮겼습니다.
- source_word: πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν
  english_pob_choice: a large crowd of the people and of women
  chosen_korean: 많은 백성과 여자들
  alternatives_korean:
  - 큰 무리와 여자들
  - 많은 군중과 여자들
  lexicon: BDAG
  rationale: 두 명사구가 함께 무리의 구성을 이루는 구조를 살리되, 한국어에서는 과도한 직역보다 자연스러운 병렬로 표현했습니다.
- source_word: αἳ
  english_pob_choice: who / specifically the women
  chosen_korean: 여자들은
  alternatives_korean:
  - 그 여자들은
