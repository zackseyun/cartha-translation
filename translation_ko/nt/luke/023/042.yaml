    issue: 직접 호칭 안에서 ‘당신이 당신의’를 사용함
    rationale: 한국어에서 ‘당신’의 반복은 자연스럽지 않으며 해당 청원의 경건하고 정중한 어조를 손상할 수 있습니다. ‘예수님의 나라’로 지시 대상을 명료하고 자연스럽게 표현할 수 있습니다.
  - severity: low
    issue: 각주가 이문인 εἰς의 방향성을 충분히 정확하게 나타내지 못함
    rationale: 일부 사본의 읽기는 ‘나라 안으로’에 해당하는 εἰς이며, SBLGNT 본문은 ἐν으로 ‘나라에/안에’입니다. 이를 원어 형태와 함께 명시하면 본문비평 정보가 더 정확해집니다.
  revised_text: 그리고 그가 말했습니다[a]. “예수님, 예수님의 나라에 오실 때 저를 기억해 주십시오.”
