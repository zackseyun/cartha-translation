  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
  footnotes:
  - marker: a
    text: Or “when you come in your kingdom.” Some manuscripts read “into your kingdom” more explicitly, while the SBLGNT text reads “in your kingdom.”
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그가 말했습니다[a], “예수님, 당신이 당신의 나라에 오실 때 저를 기억해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘당신의 나라 안으로’에 더 분명하게 해당하는 읽기를 보이지만, SBLGNT 본문은 ‘당신의 나라에/안에’에 해당합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  english_pob_choice: he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 말하고 있었습니다
  - 그가 말했습니다
  lexicon: BDAG
  rationale: 미완료 과거의 진행성은 한국어 서술에서 보통 단순 과거로 자연스럽게 풀어도 의미가 유지되므로, 장면의 흐름을 해치지 않는 표현을 택했습니다.
- source_word: Ἰησοῦ
  english_pob_choice: Jesus
  chosen_korean: 예수님
  alternatives_korean:
  - 예수
  - 예수님
  lexicon: BDAG
  rationale: 직접 호격으로 부르는 말이므로 한국어에서는 자연스러운 호칭형인 ‘예수님’을 사용했습니다.
- source_word: μνήσθητί μου
  english_pob_choice: remember me
  chosen_korean: 저를 기억해 주십시오
  alternatives_korean:
  - 저를 기억하십시오
  - 저를 기억해 주십시오
  - 저를 기억해 주옵소서
  lexicon: BDAG
  rationale: 단순한 인지적 회상보다 청원적 뉘앙스가 있으므로, 한국어에서는 ‘기억해 주십시오’로 부탁의 의미를 살렸습니다.
- source_word: ἐν τῇ βασιλείᾳ σου
  english_pob_choice: in your kingdom
  chosen_korean: 당신의 나라에
  alternatives_korean:
  - 당신의 나라에서
  - 당신의 나라 안에서
  - 당신의 나라에
  lexicon: BDAG
  rationale: ἐν과 βασιλείᾳ를 장소/도달의 자연스러운 한국어로 옮겨 ‘~에’로 처리했으며, 왕권의 통치 영역이라는 의미를 덜 약화시키지 않도록 ‘나라’를 택했습니다.
theological_decisions:
- issue: 예수의 미래 도래와 나라 표현의 방향성
  chosen_reading: 기도하는 이는 예수님이 장차 자기 나라에 오실 때 자신을 기억해 달라고 요청합니다.
  alternative_readings:
  - 예수님이 자기 나라 안에 계실 때 기억해 달라는 뜻
  - 예수님이 왕권으로 오실 때 기억해 달라는 뜻
  rationale: 본문은 예수의 장차 오심과 그 나라를 분명히 말하지만, 그 시간표나 세부 종말론은 규정하지 않으므로 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
