  lexicon: BDAG
  rationale: 재판 상황에서는 παιδεύσας를 교정적 훈육보다 벌의 의미로 읽는 것이 자연스럽습니다. 다만 정확한 형벌 방식은 본문이 밝히지 않으므로, ‘벌한’이 가장 넓고 과도하게 특정하지 않습니다.
