  text: 그러므로 그를 처벌한 뒤에 풀어 주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘징계한 뒤에’라고 할 수 있습니다. παιδεύω는 교정적 처벌을 뜻할 수 있습니다. 일부는 여기서 더 구체적으로 ‘매질한 뒤에’를 염두에 둔다고 이해하지만, 그리스어 동사 자체의 뜻은 더 넓습니다.
