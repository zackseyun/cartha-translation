  footnotes:
  - marker: a
    text: 또는 ‘징계한 뒤에’, ‘훈계한 뒤에’로 옮길 수 있습니다. παιδεύω는 문맥에 따라 교정적 처벌을 뜻하며, 일부는 여기서 더 구체적으로 매질을 염두에 둡니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  english_pob_choice: after punishing
  chosen_korean: 벌한 뒤에
  alternatives_korean:
  - 징계한 뒤에
  - 훈련한 뒤에
  - 매질한 뒤에
  lexicon: BDAG
  rationale: 재판 상황에서는 παιδεύσας를 교정적 훈육보다 벌의 의미로 읽는 것이 자연스럽습니다. 다만 정확한 형벌 방식은 본문이 밝히지 않으므로, ‘벌한’이 가장 넓고 과도하게 특정하지 않습니다.
