  - 훈계한 뒤에
  - 매질한 뒤에
  rationale: 본문은 예수에게 가해질 조치가 판결적 조처임을 보여 주므로, 교육적·훈련적 뉘앙스는 배제하고도 원문의 넓은 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
