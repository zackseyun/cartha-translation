    rationale: 주격 ‘우리가’는 원문의 ἐφ’ ἡμᾶς(‘우리 위에’)와 맞지 않으며 한국어 문법상도 부자연스럽습니다. 산들이 ‘우리 위에’ 떨어지기를 바라는 요청이어야 합니다.
