  source_fidelity: 그리스어의 미래 개시 의미(ἄρξονται λέγειν), 산/언덕의 구별, 두 명령의 직접성은 대체로 잘 반영되었습니다. 그러나 첫 인용문의 ‘우리가 위에’는 ἐφ’ ἡμᾶς(‘우리 위에/우리에게’)를 잘못 옮긴 것으로, ‘우리 위에’로 바로잡아야 합니다.
  naturalness: ‘산들에게 … 언덕들에게 …라고 말하기 시작할 것입니다’라는 병렬 구조는 현대 표준 한국어에서 자연스럽습니다. 대시로 인용문을 분절하기보다 인용 조사 ‘라고’를 쓰는 편이 문장 구조와 합쇼체 문체에 더 적합합니다.
  terminology: ‘산’, ‘언덕’, ‘떨어지십시오’, ‘덮으십시오’는 원문의 어휘 대비와 예언적 심판 이미지에 충실합니다. 대체 번역 각주는 ‘덮다’가 문맥상 은폐의 뜻을 띤다는 점을 명료하게 표현하도록 다듬었습니다.
