id: LUK.23.30
reference: Luke 23:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
  footnotes:
  - marker: a
    text: This wording echoes prophetic judgment language, especially Hosea 10:8.
    reason: cross_reference
  - marker: b
    text: Or 'Hide us.' The verb literally means 'cover,' but in context it carries the sense of concealment from coming judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들은 산들에게 말하기 시작할 것입니다[a] — “우리가 위에 떨어지십시오” — 그리고 언덕들에게는[b] — “우리를 덮으십시오” —.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 특히 호세아 10:8 같은 예언적 심판 언어를 떠올리게 합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘우리를 숨기십시오.’ 여기서는 문자적으로는 ‘덮다’이지만, 문맥상 숨김의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: BDAG
  rationale: 앞선 문맥에서 이어지는 시간적 순서를 자연스럽게 표시하면서도, 장면의 긴박한 전환을 간결하게 살립니다.
- source_word: ἄρξονται λέγειν
  english_pob_choice: they will begin to say
  chosen_korean: 말하기 시작할 것입니다
  alternatives_korean:
  - 말할 것입니다
  - 말하기 시작하겠습니다
  lexicon: BDAG
  rationale: ἄρξονται와 부정사 λέγειν의 시작/개시 의미를 함께 살려, 단순 미래형보다 발화가 막 시작되는 뉘앙스를 보존합니다.
- source_word: τοῖς ὄρεσιν / τοῖς βουνοῖς
  english_pob_choice: to the mountains / to the hills
  chosen_korean: 산들에게 / 언덕들에게
  alternatives_korean:
  - 산에 / 산비탈에
  - 산들과 언덕들에게
  lexicon: BDAG
  rationale: 두 명사가 병렬로 대비되므로 한국어도 각각 구분해 옮겨 어휘적 차이를 유지했습니다.
- source_word: Πέσετε
  english_pob_choice: Fall
  chosen_korean: 떨어지십시오
  alternatives_korean:
  - 떨어져 내리십시오
  - 무너지십시오
  lexicon: BDAG
  rationale: 직접적인 명령형을 살리되, 한국어에서 자연스럽고 위기감이 드러나는 동사로 옮겼습니다.
- source_word: Καλύψατε
  english_pob_choice: Cover
  chosen_korean: 덮으십시오
  alternatives_korean:
  - 가리십시오
  - 숨겨 주십시오
  lexicon: BDAG
  rationale: 직역에 가까운 ‘덮다’를 택해, 심판에서 숨고자 하는 이미지와 본문의 원형 표현을 유지합니다.
theological_decisions:
- issue: 심판을 피하려는 절규의 직접성
  chosen_reading: 본절의 산과 언덕을 향한 절규를 설명적으로 풀지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘심판을 피하게 해 달라’는 뜻으로 의역하기
  rationale: 호세아 10:8을 연상시키는 심판 언어의 긴장을 본문이 지닌 그대로 드러내기 위해, 해석을 본문 안에서 미리 풀어 쓰지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
