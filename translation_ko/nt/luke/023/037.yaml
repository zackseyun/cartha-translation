id: LUK.23.37
reference: Luke 23:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
  footnotes:
  - marker: a
    text: Or, “the King of the Judeans.” The Greek Ἰουδαίων can refer to Jews or Judeans depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말하며, 「네가 유대인들의 왕이라면, 네 자신을 구하여라」 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들의 왕” 대신 “유대인들의 임금”으로 옮길 수 있습니다. 여기서 Ἰουδαίων은 문맥에 따라 유대인들 또는 유대 지방 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  english_pob_choice: and saying
  chosen_korean: 그리고 말하며
  alternatives_korean:
  - 그리고 말하면서
  - 그리고 외치며
  - 그리고 조롱하며 말하면서
  lexicon: BDAG
  rationale: 분사형 λέγοντες를 한국어의 연결·동시 진행 표현으로 살려, 본문이 직접적으로 ‘조롱하다’라고 말하지 않는 점을 보존했습니다.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  english_pob_choice: the King of the Jews
  chosen_korean: 유대인들의 왕
  alternatives_korean:
  - 유대인들의 임금
  - 유대인들의 왕이신 분
  - 유대인의 왕
  lexicon: BDAG
  rationale: 왕칭과 소유격 관계를 자연스럽게 옮기되, POB의 영어 선택에 맞춰 'Jews'를 '유대인들'로 직역했습니다.
- source_word: σῶσον σεαυτόν
  english_pob_choice: save yourself
  chosen_korean: 네 자신을 구하여라
  alternatives_korean:
  - 자신을 구하라
  - 너를 구해라
  - 네 몸을 구하여라
  lexicon: BDAG
  rationale: 반말 명령형은 인물들의 조롱 섞인 직설을 드러내며, σῴζω의 기본 의미인 '구하다'를 유지합니다.
theological_decisions:
- issue: 모욕적 왕칭의 번역
  chosen_reading: ‘유대인들의 왕’이라는 칭호를 그대로 유지해, 십자가 장면의 조롱과 아이러니를 드러냈습니다.
  alternative_readings:
  - ‘유대인의 왕’으로 단수화해 관용적으로 옮김
  - ‘유대 민족의 왕’으로 완화함
  rationale: 본문은 예수의 왕권을 비웃는 정치적 칭호를 제시하므로, 완화하지 않고 직설적으로 옮기는 것이 서사적 긴장을 보존합니다.
  doctrine_reference: 수난 내러티브의 아이러니와 왕권 선포
