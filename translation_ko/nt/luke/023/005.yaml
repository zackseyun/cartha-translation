id: LUK.23.5
reference: Luke 23:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
  footnotes:
  - marker: a
    text: Or “incites the people.” The Greek verb can mean to arouse or stir up in a disruptive sense.
    reason: lexical_alternative
  - marker: b
    text: “Judea” may refer either to the region of Judea specifically or, more broadly in some contexts, to the Jewish territory under discussion; here the wording likely stresses the breadth of his activity.
    reason: cultural_note
  - marker: c
    text: Or “all the way here” or “up to this place.” The phrase points from Galilee to the present location before Pilate.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그들은 더욱 강하게 주장하며 말했습니다. “그는 갈릴리에서 시작하여 여기까지, 온 유대 전역에서[b] 가르치며 백성을 선동하고 있습니다[a][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람들을 부추기고 있습니다.” 그리스어 동사는 해로운 방향으로 사람들을 자극하거나 들뜨게 한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “유대”는 좁게는 유대 지방, 넓게는 여기서 문제 된 유대인의 영역 전체를 가리킬 수 있습니다. 여기서는 그의 활동 범위가 넓다는 점이 강조됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 “이곳까지” 또는 “이 자리까지.” 이 표현은 갈릴리에서 시작해 지금 빌라도 앞의 장소에 이르기까지의 활동 범위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  english_pob_choice: kept insisting
  chosen_korean: 더욱 강하게 주장하며
  alternatives_korean:
  - 계속 우기며
  - 끈질기게 주장하며
  lexicon: BDAG
  rationale: 미완료 과거의 반복·지속성과 압박감을 살려, 단순한 반복보다 더 강한 ‘강하게 주장하다’로 옮겼습니다.
- source_word: Ἀνασείει
  english_pob_choice: stirs up
  chosen_korean: 선동하고 있습니다
  alternatives_korean:
  - 부추기고 있습니다
  - 소동을 일으키고 있습니다
  lexicon: BDAG
  rationale: 원문의 ‘흔들어 일으키다/선동하다’는 뉘앙스를 한국어의 직접적인 고발 표현으로 옮겼습니다. 여기서는 정치적 죄목을 과도하게 구체화하지 않되, 비난의 공격성을 분명히 드러냈습니다.
- source_word: τὸν λαὸν
  english_pob_choice: the people
  chosen_korean: 백성을
  alternatives_korean:
  - 사람들을
  - 민중을
  lexicon: BDAG
  rationale: λαός는 단순 군중보다 공동체 전체를 가리키는 말이므로, 문맥상 ‘백성’이 가장 자연스럽고 범위도 잘 반영합니다.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  english_pob_choice: throughout all Judea
  chosen_korean: 온 유대에서
  alternatives_korean:
  - 유대 전역에서
  - 유대의 모든 곳에서
  lexicon: BDAG
  rationale: 지역 전역을 포괄하는 범위를 한국어로 압축해 자연스럽게 살렸습니다. ‘유대’는 지명으로 처리했습니다.
- source_word: ἕως ὧδε
  english_pob_choice: even to here
  chosen_korean: 여기까지 이르렀습니다
  alternatives_korean:
  - 이곳까지입니다
  - 지금 이곳까지입니다
  lexicon: BDAG
  rationale: 현재 재판장 앞이라는 지시성을 살려, ‘여기까지’의 도착점 강조를 한국어 동사구로 풀어냈습니다.
theological_decisions:
- issue: 예수에 대한 고발의 성격
  chosen_reading: ‘선동하고 있습니다’로 옮겨, 원문의 사회적 동요 조장이라는 비난을 드러내되 반역죄 같은 기술적 정치 혐의로 확정하지 않았습니다.
  alternative_readings:
  - 반란을 조장하고 있습니다
  - 사람들을 부추기고 있습니다
  rationale: 원문 ἀνασείει는 사람들을 흔들어 놓는다는 뜻이지, 반드시 정식 반역 혐의를 뜻하지는 않습니다. 따라서 고발의 강도는 유지하되 의미를 과잉해석하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
