id: LUK.23.8
reference: Luke 23:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: Now when Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
  footnotes:
  - marker: a
    text: Or 'he had heard about him.' The Greek can be rendered more simply, but the present infinitive suggests repeated or ongoing reports.
    reason: lexical_alternative
  - marker: b
    text: Or 'some miracle.' The Greek says 'some sign' (σημεῖον), which can refer to a miraculous act viewed as a significant sign.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 헤롯은 예수를 보고 매우 기뻐했습니다. 그는 오래전부터 그를 보고 싶어 했는데, 그에 대해 듣고 있었기 때문입니다. 그리고 그에 의해 어떤 표적이 행해지는 것을 보기를 바라고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그에 대해 듣고 있었기 때문입니다’는 원문의 현재 부정사 ἀκούειν이 나타내는 지속적·반복적 소문 수집의 뉘앙스를 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘표적’은 여기서 초자연적 기적을 포함할 수 있지만, 원문은 σημαῖον(표적)이라는 더 넓은 말을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  english_pob_choice: he rejoiced greatly
  chosen_korean: 매우 기뻐했습니다
  alternatives_korean:
  - 크게 기뻐했습니다
  - 몹시 기뻐했습니다
  lexicon: BDAG
  rationale: χαίρω의 ‘기뻐하다’ 의미와 λίαν의 강도를 자연스러운 현대 한국어로 살렸습니다.
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  english_pob_choice: for a long time wanted to see him
  chosen_korean: 오래전부터 그를 보고 싶어 했는데
  alternatives_korean:
  - 오랫동안 그를 보고 싶어 했는데
  - 꽤 오래 그를 보고 싶어 했는데
  lexicon: BDAG
  rationale: 기간을 나타내는 관용구를 직역하기보다, 긴 지속을 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  english_pob_choice: because he had been hearing about him
  chosen_korean: 그에 대해 듣고 있었기 때문입니다
  alternatives_korean:
  - 그에 관해 들었기 때문입니다
  - 그에 대해 계속 듣고 있었기 때문입니다
  lexicon: BDAG
  rationale: 원문의 원인 표현을 살리되, 반복적·지속적 청취의 뉘앙스는 한국어의 진행형으로 무리 없이 드러냈습니다.
- source_word: σημεῖον
  english_pob_choice: some sign
  chosen_korean: 어떤 표적
  alternatives_korean:
  - 어떤 이적
  - 어떤 기적
  lexicon: BDAG
  rationale: σημεῖον의 기본 의미인 ‘표적’을 유지해, 단순한 기적 이상으로 신호성·의미성을 보존했습니다.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  english_pob_choice: being done by him
  chosen_korean: 그에 의해 행해지는 것을
  alternatives_korean:
  - 그에 의해 이루어지는 것을
  - 그가 행하는 것을
  lexicon: BDAG
  rationale: 현재 분사의 진행성을 살려 ‘행해지는 것’으로 옮기고, ὑπό의 행위 주체를 분명히 했습니다.
theological_decisions:
- issue: σημεῖον의 번역을 ‘기적’이 아니라 ‘표적’으로 둘 것인지
  chosen_reading: ‘어떤 표적’으로 번역했습니다.
  alternative_readings:
  - 어떤 기적
  - 어떤 이적
  rationale: 본문은 헤롯이 예수의 행위를 구경거리로 기대하는 장면이지만, 원어는 의미가 넓은 σημεῖον을 사용하므로 ‘표적’이 더 원문에 가깝습니다.
  doctrine_reference: source-based lexical precision
