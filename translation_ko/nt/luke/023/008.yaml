  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐξ ἱκανῶν χρόνων은 특정한 과거 시점부터라는 뜻보다 ‘오랫동안’이라는 지속 기간을 나타내므로 ‘오래전부터’보다 ‘오랫동안’이 더 정확합니다. γινόμενον은 예수가 행하는 표적을 현재적으로 기대하는 뜻이며, 이를 자연스럽게 유지했습니다.
  naturalness: 초안의 ‘그에 의해 어떤 표적이 행해지는 것’은 문법적으로 가능하나 현대 한국어에서 다소 무겁고 피동적입니다. ‘예수가 행하는 어떤 표적’이 의미를 보존하면서 더 자연스럽습니다. 또한 각주 표지는 설명 대상 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘표적’은 σημεῖον의 폭넓은 의미를 보존하는 적절한 번역입니다. 각주에는 원어 철자를 정확히 σημεῖον으로 바로잡았습니다.
