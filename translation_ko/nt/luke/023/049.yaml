id: LUK.23.49
reference: Luke 23:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
  footnotes:
  - marker: a
    text: Or, 'all his acquaintances.' The Greek γνωστοί can denote those known to someone, that is, acquaintances or associates.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그를 알던 모든 사람들[a]과 갈릴리에서부터 그를 따라온 여자들은 멀찍이 서서 이 일들을 보고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: γνωστοί는 ‘아는 사람들’ 또는 ‘지인들’로도 옮길 수 있습니다. 본문은 그와 관계가 있었던 사람들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  english_pob_choice: were standing
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 서 있었습니다
  - 서 있었습니다(계속 서 있었습니다)
  - 서 있었습니다
  lexicon: BDAG
  rationale: 행위의 지속된 자세를 살려, 단순한 순간 동작보다 관찰 장면을 이루는 상태를 자연스럽게 나타냈습니다.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  english_pob_choice: all those who knew him
  chosen_korean: 그를 알던 모든 사람들
  alternatives_korean:
  - 그의 모든 지인들
  - 그와 아는 사이인 모든 사람들
  lexicon: BDAG
  rationale: γνωστοί의 범위를 넓게 두어 ‘지인’보다 덜 좁고, 관계의 성격을 과도하게 규정하지 않도록 했습니다.
- source_word: μακρόθεν
  english_pob_choice: at a distance
  chosen_korean: 멀찍이
  alternatives_korean:
  - 멀리
  - 떨어져
  lexicon: BDAG
  rationale: 현장감을 살리면서도 현대 한국어에서 자연스러운 거리감을 표현했습니다.
- source_word: ὁρῶσαι ταῦτα
  english_pob_choice: watching these things
  chosen_korean: 이 일들을 보고 있었습니다
  alternatives_korean:
  - 이 일들을 지켜보고 있었습니다
  - 이것들을 보고 있었습니다
  lexicon: BDAG
  rationale: ταῦτα를 ‘이 일들’로 풀어 사건 전체를 가리키는 뉘앙스를 살리고, ὁρῶσαι의 지속적 관찰을 ‘보고 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: 여인들의 위치와 행동 묘사
  chosen_reading: ‘갈릴리에서부터 그를 따라온 여자들’과 ‘멀찍이 서서’라는 서술을 그대로 유지해, 십자가 사건의 목격자이지만 거리 두기된 장면을 보존했습니다.
  alternative_readings:
  - ‘그를 따르던 여자들’
  - ‘멀리 서서’
  rationale: 본문은 이들이 예수와의 추종 관계에 있었으나 처형 현장에서는 멀리 서 있었다는 긴장을 드러냅니다. 이를 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 복음서의 수난 서술과 제자도/목격 증언의 긴장
