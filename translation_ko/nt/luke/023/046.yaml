id: LUK.23.46
reference: Luke 23:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
  footnotes:
  - marker: a
    text: Or “I entrust my spirit.” The verb can mean to place something in another's care.
    reason: lexical_alternative
  - marker: b
    text: 'This saying echoes Psalm 31:5 in the Greek Scriptures: “Into your hands I commit my spirit.”'
    reason: cross_reference
  - marker: c
    text: Or “he expired” or simply “he died”; literally, the verb refers to breathing out.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 큰 소리로 외치시고 말씀하셨습니다. 「아버지, 제 영을 아버지의 손에 맡깁니다.[a]」 이렇게 말씀하시고[b] 숨을 거두셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제 영을 맡깁니다.” 동사는 어떤 것을 다른 이의 돌봄에 맡기는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 말씀은 그리스어 성경의 시편 31:5를 떠올리게 합니다. “주의 손에 나의 영을 부탁하나이다.”
    reason: cross_reference
  - marker: c
    text: 또는 “운명하셨습니다” 또는 “죽으셨습니다”; 문자적으로 이 동사는 숨을 내쉬는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  english_pob_choice: crying out with a loud voice
  chosen_korean: 큰 소리로 외치시고
  alternatives_korean:
  - 큰 소리로 부르시고
  - 큰 소리로 외치며
  lexicon: BDAG
  rationale: φωνέω의 강한 발화와 φωνῇ μεγάλῃ의 음성 강도를 함께 살리기 위해, 자연스럽고 장중한 표현인 ‘큰 소리로 외치시고’를 택했습니다.
- source_word: Πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아버님
  lexicon: BDAG
  rationale: 직접 호칭이므로 ‘아버지’로 옮겼고, 원문에 없는 소유격을 덧붙이지 않았습니다.
- source_word: παρατίθεμαι
  english_pob_choice: I commit
  chosen_korean: 맡깁니다
  alternatives_korean:
  - 위탁합니다
  - 의탁합니다
  lexicon: BDAG
  rationale: 중간태의 ‘내어 맡기다/맡기다’라는 뜻을 살리면서, 한국어에서 가장 자연스럽고 관계적 신뢰를 드러내는 동사로 번역했습니다.
- source_word: τὸ πνεῦμά μου
  english_pob_choice: my spirit
  chosen_korean: 제 영
  alternatives_korean:
  - 제 영혼
  - 제 숨
  lexicon: BDAG
  rationale: πνεῦμα의 기본 의미를 유지해 ‘영’으로 옮겼습니다. ‘숨’은 생리적 뉘앙스만 강해지고, ‘영혼’은 범위를 좁히므로 피했습니다.
- source_word: ἐξέπνευσεν
  english_pob_choice: he breathed his last
  chosen_korean: 숨을 거두셨습니다
  alternatives_korean:
  - 숨을 거두셨습니다
  - 죽으셨습니다
  lexicon: BDAG
  rationale: 문자적으로는 ‘내쉬다/숨을 내쉬다’이지만, 한국어 관용에서 죽음을 자연스럽게 드러내는 ‘숨을 거두셨습니다’가 가장 적절합니다.
theological_decisions:
- issue: 예수의 마지막 말씀에서 τὸ πνεῦμά μου를 어떻게 이해할 것인가
  chosen_reading: 제 영
  alternative_readings:
  - 제 숨
  - 제 생명
  rationale: 아버지께 의식적으로 자신을 맡기는 기도문이라는 문맥을 살려, 단순한 생리적 ‘숨’보다 인격적·신학적 무게가 있는 ‘영’을 유지했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 후대 교리를 과도하게 덧씌우지 않음.
- issue: 직접 인용 안에서의 호칭과 종결 어조
  chosen_reading: 예수의 인용문은 평서형 현재시제의 1인칭으로, 하나님께 직접 드리는 기도체는 합쇼체를 유지
  alternative_readings:
  - 아버지, 제 영을 아버지의 손에 부탁하나이다
  - 아버지, 제 영을 아버지의 손에 맡깁니다
  rationale: 원문의 간결하고 단호한 선언성을 살리기 위해 현대적 합쇼체를 택했고, 예수의 아버지 호칭은 경어화하되 본문 자체의 절박함은 유지했습니다.
  doctrine_reference: 현대 한국어 성경문체의 자연스러움과 원문 화행 보존.
