  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
  footnotes:
  - marker: a
    text: Or “the Christ of God, the Elect One.”
    reason: alternative_reading
translation:
  language: ko
  text: 백성이 서서 지켜보고 있었습니다. 관원들도 그를 조롱하며 말했습니다. “다른 이들은 구원하였으니, 이 사람이 하나님의 메시아, 곧 선택받은 이라면 자신을 구원하게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 그리스도, 선택받은 이.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἱστήκει ὁ λαὸς θεωρῶν
  english_pob_choice: And the people stood watching.
  chosen_korean: 백성이 서서 지켜보고 있었습니다.
  alternatives_korean:
  - 백성이 서서 보고 있었습니다.
  - 백성이 서서 구경하고 있었습니다.
  lexicon: BDAG
  rationale: 상태를 보이는 완료/과거적 서술과 진행 중인 시선을 자연스러운 한국어로 풀어, 장면의 정지성과 지속성을 함께 살렸습니다.
- source_word: ἐξεμυκτήριζον
  english_pob_choice: were mocking him
  chosen_korean: 그분을 조롱하며
  alternatives_korean:
  - 그분을 비웃으며
  - 그분을 조롱하고 있었습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 놀림보다 경멸 섞인 조롱을 가리키므로, 현대 한국어에서 그 강도를 드러내는 '조롱하며'를 택했습니다.
- source_word: οἱ ἄρχοντες
  english_pob_choice: the rulers
  chosen_korean: 관원들
  alternatives_korean:
  - 지도자들
  - 권력자들
  lexicon: BDAG
  rationale: 누가복음 문맥에서 군중과 대비되는 공적 권위를 지닌 자들을 가리키므로, 과도하게 해석을 덧붙이지 않는 '관원들'이 적절합니다.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  english_pob_choice: God’s Messiah
  chosen_korean: 하나님의 메시아
  alternatives_korean:
  - 하나님의 그리스도
  - 하나님께 속한 메시아
  lexicon: BDAG
  rationale: Χριστός를 직역어 '그리스도'가 아니라 칭호로서 '메시아'로 옮겨, 본문의 메시야적 의미를 드러냈습니다.
- source_word: ὁ ἐκλεκτός
  english_pob_choice: the Chosen One
  chosen_korean: 선택받은 분
  alternatives_korean:
  - 택함받은 이
  - 선택된 이
  lexicon: BDAG
  rationale: 형용사적 칭호를 한국어에서 자연스러운 존칭형으로 옮기되, 조롱 속에서도 메시아 칭호의 무게가 살아나도록 했습니다.
theological_decisions:
- issue: Χριστός의 칭호 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 문맥상 고유명이라기보다 칭호이므로, 한국어 독자가 왕적·구원사적 의미를 즉시 읽도록 '메시아'로 옮겼습니다.
  doctrine_reference: Contested terms — Χριστός → Messiah (where title)
- issue: ὁ ἐκλεκτός의 메시아적 칭호성
  chosen_reading: 선택받은 분
  alternative_readings:
  - 택함받은 이
  - 선택된 자
  rationale: 관원들의 조롱 속에서도 이 표현이 단순한 설명이 아니라 예수에 대한 칭호로 들리도록, 인격적이고 공손한 형태로 유지했습니다.
  doctrine_reference: Readable modern Korean; preserve theological tension rather than resolve it
