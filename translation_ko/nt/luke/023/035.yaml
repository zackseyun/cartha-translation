  lexicon: BDAG
  rationale: 이 동사는 단순한 놀림보다 경멸 섞인 조롱을 가리키므로, 현대 한국어에서 그 강도를 드러내는 '조롱하며'를 택했습니다.
- source_word: οἱ ἄρχοντες
  english_pob_choice: the rulers
  chosen_korean: 관원들
  alternatives_korean:
  - 지도자들
  - 권력자들
  lexicon: BDAG
  rationale: 누가복음 문맥에서 군중과 대비되는 공적 권위를 지닌 자들을 가리키므로, 과도하게 해석을 덧붙이지 않는 '관원들'이 적절합니다.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  english_pob_choice: God’s Messiah
  chosen_korean: 하나님의 메시아
  alternatives_korean:
  - 하나님의 그리스도
  - 하나님께 속한 메시아
  lexicon: BDAG
  rationale: Χριστός를 직역어 '그리스도'가 아니라 칭호로서 '메시아'로 옮겨, 본문의 메시야적 의미를 드러냈습니다.
- source_word: ὁ ἐκλεκτός
  english_pob_choice: the Chosen One
  chosen_korean: 선택받은 분
  alternatives_korean:
  - 택함받은 이
  - 선택된 이
  lexicon: BDAG
  rationale: 형용사적 칭호를 한국어에서 자연스러운 존칭형으로 옮기되, 조롱 속에서도 메시아 칭호의 무게가 살아나도록 했습니다.
theological_decisions:
- issue: Χριστός의 칭호 번역
  chosen_reading: 메시아
  alternative_readings:
