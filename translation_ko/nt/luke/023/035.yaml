translation:
  language: ko
  text: 백성이 서서 지켜보고 있었습니다. 그런데 관원들까지도 그분을 조롱하며 말했습니다. “다른 이들은 구원하였으니, 자신도 구원해 보십시오. 이 사람이야말로 하나님의 메시아, 선택받은 분이라면 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 그리스도, 선택받은 분.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἱστήκει ὁ λαὸς θεωρῶν
  english_pob_choice: And the people stood watching.
  chosen_korean: 백성이 서서 지켜보고 있었습니다.
  alternatives_korean:
  - 백성이 서서 보고 있었습니다.
  - 백성이 서서 구경하고 있었습니다.
  lexicon: BDAG
  rationale: 상태를 보이는 완료/과거적 서술과 진행 중인 시선을 자연스러운 한국어로 풀어, 장면의 정지성과 지속성을 함께 살렸습니다.
- source_word: ἐξεμυκτήριζον
