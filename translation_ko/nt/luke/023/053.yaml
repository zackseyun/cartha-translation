  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
  footnotes:
  - marker: a
    text: Or "a hewn tomb" or "a tomb cut out of rock."
    reason: lexical_alternative
  - marker: b
    text: Or "where no one had ever lain."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그를 내린 뒤[a], 세마포로 감싸서 돌로 파낸 무덤에 두었는데, 그곳에는 아직 아무도 누워 있지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “깎아 만든 무덤” 혹은 “바위를 파서 만든 무덤”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그곳에는 아무도 한 번도 누워 있지 않았습니다”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  english_pob_choice: after taking him down
  chosen_korean: 그를 내린 뒤
  alternatives_korean:
  - 그를 끌어내린 뒤
  - 그를 내려놓은 뒤
  lexicon: BDAG
  rationale: 십자가에서 예수의 시신을 내리는 동작을 자연스러운 순서로 나타내면서, 원문의 시간적 선행 관계를 살렸습니다.
- source_word: σινδόνι
  english_pob_choice: in a linen cloth
  chosen_korean: 세마포로
  alternatives_korean:
  - 린넨 천으로
  - 세마포 천으로
  - 수의로
  lexicon: BDAG
  rationale: σινδών은 매장용으로도 쓰이는 세마포를 가리키므로, 한국어 성경 어휘로 널리 통하는 세마포를 택하되 장례용 수의로 과도하게 해석하지 않았습니다.
- source_word: λαξευτῷ
  english_pob_choice: cut in stone
  chosen_korean: 돌로 파낸
  alternatives_korean:
  - 바위에 판
  - 돌을 깎아 만든
  - 바위를 파서 만든
  lexicon: BDAG
  rationale: 무덤의 재질과 제작 방식을 직역에 가깝게 드러내면서도, 현대 한국어로 자연스럽게 읽히도록 했습니다.
- source_word: οὐδεὶς οὔπω κείμενος
  english_pob_choice: where no one had yet been laid
  chosen_korean: 그곳에는 아직 아무도 누워 있지 않았습니다
  alternatives_korean:
  - 그곳에는 아직 아무도 놓여 있지 않았습니다
  - 그곳에는 한 번도 아무도 누워 본 적이 없었습니다
  lexicon: BDAG
  rationale: 무덤의 미사용 상태를 살리기 위해 ‘아직’과 ‘누워 있지 않았습니다’를 사용해, burial context의 관용적 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 무덤의 미사용 상태 표현
  chosen_reading: 예수의 무덤은 아직 아무도 사용하지 않은 돌무덤이었다는 점을 사실적으로 진술합니다.
  alternative_readings:
  - 무덤에 아무도 한 번도 누워 본 적이 없었다는 의미로 옮길 수 있습니다.
  rationale: 본문은 교리적 해설보다 역사적 묘사에 초점이 있으므로, 병행본문을 덧붙이지 않고 원문의 정보만 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
