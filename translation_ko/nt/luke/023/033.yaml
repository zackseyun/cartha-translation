review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. κακούργους는 도덕·종교적 의미가 강한 ‘죄인들’보다 ‘범죄자들’이 더 정확합니다. 또한 원문은 예수와 두 범죄자를 함께 십자가에 못 박았고 그 범죄자들의 좌우 위치를 분배하여 말합니다. 초안의 ‘두었습니다’는 원문에 없는 별도 배치 행위를 도입합니다.
  naturalness: 초안은 전반적으로 이해 가능하나, ‘하나는 오른쪽에, 하나는 왼쪽에 두었습니다’는 누가 누구를 두었는지가 불명확하고 한국어로도 어색합니다. ‘한 사람은 … 다른 한 사람은 … 십자가에 못 박았습니다’로 분배 관계를 분명히 하는 것이 자연스럽습니다.
  terminology: Κρανίον을 ‘해골’로 번역한 것은 적절합니다. σταυρόω의 ‘십자가에 못 박았습니다’도 허용되는 직접적 번역입니다. κακούργους는 ‘범죄자들’로 고쳐 누가의 비교적 넓은 표현을 보존해야 합니다.
  issues:
  - severity: medium
    issue: κακούργους를 ‘죄인들’로 번역함
    rationale: ‘죄인’은 한국어에서 종교적·도덕적 의미를 쉽게 불러오며, 법적·일반적 악행자를 뜻하는 κακούργοι의 의미보다 좁거나 다른 방향으로 들릴 수 있습니다. ‘범죄자들’이 원문 및 영어 감사본의 ‘criminals’에 더 충실합니다.
  - severity: high
    issue: ‘하나는 오른쪽에, 하나는 왼쪽에 두었습니다’가 원문에 없는 배치 행위를 추가함
    rationale: ἐσταύρωσαν은 예수와 범죄자들을 십자가에 못 박았다는 하나의 행위를 말하며, 이어지는 상관구문은 두 범죄자의 위치를 분배합니다. ‘두었습니다’는 별도의 행위를 만들고 목적어도 불분명합니다.
  - severity: low
    issue: 위치 분배 각주가 문장 끝의 두 각주 표시에 함께 묶여 있음
    rationale: 각주 b는 범죄자들의 좌우 분배 표현을 설명하므로 해당 표현 바로 뒤에 두는 편이 앵커 기능을 더 명확히 합니다.
  revised_text: 그리고 그들이 「해골」이라 불리는 곳에 이르렀을 때, 그곳에서 그들은 그분과 범죄자들을 십자가에 못 박았습니다. 한 사람은 오른쪽에, 다른 한 사람은 왼쪽에 십자가에 못 박았습니다.[b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘해골이라 불린 곳’. 그리스어 지명 Κρανίον은 문자적으로 ‘해골’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘한 사람은 오른쪽에, 한 사람은 왼쪽에’입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 장소명 의미 번역과 십자가형 동사를 유지하면서, κακούργους를 ‘범죄자들’로 바로잡았습니다. 또한 좌우 분배 구문을 ‘한 사람은 … 다른 한 사람은 … 십자가에 못 박았습니다’로 처리하여, 원문이 말하는 두 범죄자의 위치와 십자가형 행위를 한국어에서 명확하게 연결했습니다. ‘그분’은 초안의 지시 방식과 합쇼체 존대 서술을 유지했습니다.
