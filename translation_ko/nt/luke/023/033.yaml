id: LUK.23.33
reference: Luke 23:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
  footnotes:
  - marker: a
    text: Or 'called the Skull.' The Greek place designation Κρανίον literally means 'skull.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'one from the right and one from the left.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람들이 「해골」이라 불리는 곳에 이르자, 거기서 그들은 그분과 죄인들을 십자가에 못 박았습니다. 하나는 오른쪽에, 하나는 왼쪽에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해골이라 불린 곳’. 그리스어 지명 Κρανίον은 문자적으로 ‘해골’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘오른쪽에서 한 사람, 왼쪽에서 한 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν τόπον τὸν καλούμενον Κρανίον
  english_pob_choice: the place called Skull
  chosen_korean: 「해골」이라 불리는 곳
  alternatives_korean:
  - 해골이라 불리는 곳
  - 해골이라 불린 곳
  - 두개골이라 불리는 곳
  lexicon: SBLGNT; BDAG
  rationale: Κρανίον은 문자적으로 ‘해골’이므로 의미를 살려 옮겼고, 장소명이라도 본문이 강조하는 어감을 보존하기 위해 고유명처럼 음역하지 않았습니다.
- source_word: ἐσταύρωσαν
  english_pob_choice: they crucified
  chosen_korean: 십자가에 못 박았습니다
  alternatives_korean:
  - 십자가형에 처했습니다
  - 십자가에 달았습니다
  lexicon: BDAG
  rationale: σταυρόω의 표준적 의미를 한국어로 자연스럽게 옮기되, 형벌 행위의 직접성을 유지하기 위해 ‘못 박았습니다’를 택했습니다.
- source_word: κακούργους
  english_pob_choice: criminals
  chosen_korean: 죄인들
  alternatives_korean:
  - 범죄자들
  - 악인들
  - 사형수들
  lexicon: BDAG
  rationale: 문맥상 예수와 함께 처형된 자들을 가리키므로 너무 좁은 법률 용어보다, 본문의 도덕적·법적 범주를 함께 살릴 수 있는 ‘죄인들’로 옮겼습니다.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  english_pob_choice: one on the right and one on the left
  chosen_korean: 하나는 오른쪽에, 하나는 왼쪽에
  alternatives_korean:
  - 하나는 오른편에, 하나는 왼편에
  - 한 사람은 오른쪽에, 한 사람은 왼쪽에
  lexicon: BDAG
  rationale: 대조 구조를 한국어로 자연스럽게 재현했고, 그리스어에 없는 소유격 ‘그의’를 덧붙이지 않아 원문의 절제된 표현을 유지했습니다.
theological_decisions:
- issue: Κρανίον의 처리
  chosen_reading: 장소명이라도 의미를 번역해 ‘해골’로 옮겼습니다.
  alternative_readings:
  - 그 해골
  - 크라니온
  rationale: 영어 POB가 의미 번역을 택한 취지를 따르되, 본문이 독자에게 지명의 뜻을 바로 이해하게 하려는 방향이 원문상 더 적절합니다.
  doctrine_reference: Translation philosophy §2
- issue: κακούργοι의 범위
  chosen_reading: ‘죄인들’로 옮겨, 단순한 정치범/강도 등으로 좁히지 않았습니다.
  alternative_readings:
  - 범죄자들
  - 악인들
  - 강도들
  rationale: 누가복음의 표현을 마태·마가의 다른 전승 용어와 섞지 않고, 원문이 말하는 일반적인 처형 대상이라는 점을 보존합니다.
  doctrine_reference: Translation philosophy §1
