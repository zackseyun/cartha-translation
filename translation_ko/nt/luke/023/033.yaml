review_pass:
  verdict: revise
  source_fidelity: 원문은 그들이 ‘해골’이라 불리는 곳에 이르러 예수와 두 κακοῦργοι를 십자가에 처형했으며, 그 둘의 위치를 오른쪽과 왼쪽으로 나눕니다. 초안의 ‘죄인들’은 κακοῦργοι의 법적·행위적 의미보다 넓고 신학적으로도 다른 함의를 낳을 수 있어 ‘범죄자들’이 더 충실합니다. 또한 ‘하나는 … 두었습니다’는 원문이 말하는 위치 서술을 ‘두다’라는 별도 행위로 바꾸므로 수정이 필요합니다.
  naturalness: ‘해골이라 불리는 곳’과 ‘한 사람은 오른쪽에, 다른 한 사람은 왼쪽에 있었습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. 장소명에 겹낫표를 쓰는 것은 불필요하므로 제거했습니다.
  terminology: Κρανίον은 의미를 살려 ‘해골’로 옮기고, σταυρόω는 한국어 성경 문체에서 확립된 ‘십자가에 못 박았습니다’로 유지했습니다. κακοῦργοι는 다른 복음서의 ‘강도’로 조화시키지 않고 ‘범죄자들’로 번역했습니다.
  issues:
  - severity: medium
    issue: κακούργους를 ‘죄인들’로 번역함
    rationale: κακοῦργος는 악행자·범죄자를 뜻하며, ‘죄인’은 한국어에서 종교적·도덕적 범주로도 넓게 이해될 수 있습니다. ‘범죄자들’이 원문의 일반적 법적·행위적 범주와 영어 POB의 criminals를 더 정확히 보존합니다.
  - severity: medium
    issue: ‘하나는 오른쪽에, 하나는 왼쪽에 두었습니다’가 위치 서술을 별도 타동 행위로 바꿈
    rationale: ὃν μὲν … ὃν δὲ …는 두 범죄자의 배치를 분배하여 말하는 구문입니다. ‘두었습니다’는 원문에 명시되지 않은 별도의 ‘놓다’ 행위를 도입합니다.
  - severity: low
    issue: ‘그분’ 및 겹낫표 사용
    rationale: 원문의 대명사는 존대 여부를 표시하지 않으며, ‘그분’은 존칭을 추가합니다. 현대 formal-polite 문체는 종결 표현으로 충분히 유지할 수 있습니다. ‘해골’은 번역된 장소 명칭이므로 겹낫표도 필요하지 않습니다.
  revised_text: 그리고 그들이 해골이라 불리는 곳에 이르렀을 때, 거기서 그를 범죄자들과 함께 십자가에 못 박았습니다. 범죄자들 가운데 한 사람은 오른쪽에, 다른 한 사람은 왼쪽에 있었습니다.[a][b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘해골이라 불린 곳’. 그리스어 장소 명칭 Κρανίον은 문자적으로 ‘해골’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘한 사람은 오른쪽에서, 다른 한 사람은 왼쪽에서’입니다.
    reason: lexical_alternative
  revision_rationale: ‘범죄자들’로 κακοῦργοι의 의미 범위를 보존하고, 마지막 절을 ‘있었습니다’로 옮겨 원문의 위치 분배를 자연스럽고 정확하게 반영했습니다. ‘그를 … 함께’는 αὐτὸν καὶ τοὺς κακούργους의 병렬 처형을 명확히 하되, 원문에 없는 소유격이나 신분 규정을 덧붙이지 않습니다. 각주 표지는 각각 ‘해골’ 및 좌우 위치 표현에 연결되도록 배치했습니다.
