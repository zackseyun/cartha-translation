source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
  footnotes:
  - marker: a
    text: Or "a good and just man."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오, 요셉이라는 사람이 있었는데, 그는 공회 의원이었고, 선하고 의로운 사람이었습니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선하고 공정한 사람.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 그리고 보십시오, 보십시오
  lexicon: BDAG
  rationale: 누가의 주의 환기 표현을 살리되, 현대 한국어에서는 ‘보십시오’가 문장 흐름을 가장 자연스럽게 유지하면서도 독자의 시선을 끌어 줍니다.
- source_word: βουλευτὴς ὑπάρχων
  english_pob_choice: who was a council member
  chosen_korean: 공회 의원이었고
  alternatives_korean:
  - 공회원이었고
  - 공의회 의원이었고
  - 의원으로 있었고
  lexicon: BDAG
  rationale: βουλευτής는 통치/심의 기관의 구성원을 가리키므로, 이 문맥에서는 예수 수난 서술에 나오는 공회를 가리키는 ‘공회 의원’이 가장 분명합니다.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  english_pob_choice: a good and righteous man
  chosen_korean: 선하고 의로운 사람
  alternatives_korean:
  - 좋고 의로운 사람
  - 선하고 공의로운 사람
  - 선하고 옳은 사람
  lexicon: BDAG
  rationale: ἀγαθός는 도덕적으로 ‘선한’으로, δίκαιος는 하나님 앞과 사람 앞에서의 올바름을 담는 ‘의로운’으로 옮겨 누가의 평가를 유지했습니다.
theological_decisions:
- issue: δίκαιος의 윤리·종교적 뉘앙스
  chosen_reading: 의로운
  alternative_readings:
  - 공정한
  - 옳은
  rationale: 이 인물 묘사는 단순한 법적 공정성보다 성경적 품성 평가에 가깝기 때문에, 한국어에서도 ‘의로운’이 문맥의 무게를 가장 잘 살립니다.
  doctrine_reference: Translation philosophy §5; δικαιοσύνη 관련 용례
