  terminology: ‘공회 의원’ is an appropriate contextual rendering of βουλευτής, and ‘선하고 의로운 사람’ faithfully conveys the moral-religious force of ἀγαθὸς καὶ δίκαιος. ‘공정한’ remains a valid lexical alternative for ‘의로운’ in the footnote, but it must be anchored to that term.
