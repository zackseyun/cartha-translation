id: LUK.23.18
reference: Luke 23:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
  footnotes:
  - marker: a
    text: Or “Away with this man.” The Greek imperative can be rendered more tersely, but the sense is that they demand his removal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 모두 함께 소리치며 말했습니다. 「이 사람을 데려가십시오! 우리에게 바라바를 놓아주십시오!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이 사람을 치워라” 또는 더 간단히 “저 사람을 없애라”에 가깝습니다. 동사는 단순 이동보다 제거·배제를 요구하는 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  english_pob_choice: cried out
  chosen_korean: 소리치며
  alternatives_korean:
  - 외치며
  - 큰소리로 외치며
  lexicon: BDAG
  rationale: 강한 집단적 외침을 자연스러운 현대 한국어로 살리되, 단순한 말하기보다 격한 소리침의 뉘앙스를 유지했습니다.
- source_word: παμπληθεὶ
  english_pob_choice: all together
  chosen_korean: 모두 함께
  alternatives_korean:
  - 한목소리로
  - 일제히
  lexicon: BDAG
  rationale: 사람들이 집단적으로 한꺼번에 외쳤다는 의미를 직역에 가깝게 전달했습니다.
- source_word: Αἶρε τοῦτον
  english_pob_choice: Take this man away
  chosen_korean: 이 사람을 데려가십시오
  alternatives_korean:
  - 이 사람을 치워 주십시오
  - 이 사람을 제거하십시오
  lexicon: BDAG
  rationale: αἴρω의 핵심은 ‘치우다/데려가다/없애다’인데, 문맥상 예수를 눈앞에서 제거하라는 요구이므로 공손한 명령형으로 옮겼습니다.
- source_word: ἀπόλυσον ... τὸν Βαραββᾶν
  english_pob_choice: release Barabbas to us
  chosen_korean: 우리에게 바라바를 놓아주십시오
  alternatives_korean:
  - 우리에게 바라바를 풀어주십시오
  - 바라바를 우리에게 석방해 주십시오
  lexicon: BDAG
  rationale: ἀπολύω는 구금 상태에서 풀어 주는 뜻이므로 ‘놓아주다’가 자연스럽고, dative ἡμῖν은 수혜 대상인 ‘우리에게’로 옮겼습니다.
theological_decisions:
- issue: 군중의 요구를 담은 명령문의 높임말 수준
  chosen_reading: 직접 인용 안에서 군중의 요구를 현대 한국어 공손 명령형(하십시오체)로 옮겼습니다.
  alternative_readings:
  - 반말형 명령으로 낮춤
  - 더 거친 명령형으로 직역
  rationale: 원문의 명령형 강도를 유지하면서도 한국어 출판문맥에서 읽기 자연스러운 직접 화법으로 재현했습니다.
  doctrine_reference: 번역 문체/화행 재현
