translation:
  language: ko
  text: 우리도 참으로 마땅히 받습니다. 우리가 행한 일의 대가를 받고 있기 때문입니다. 그러나 이 사람은 아무 잘못도 하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우리가 행한 일에 마땅한 것을 받고 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘이 사람은 아무 부적절한 일도 하지 않았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  english_pob_choice: justly
  chosen_korean: 참으로 마땅히
  alternatives_korean:
  - 정당하게
  - 옳게
  - 마땅히
  lexicon: BDAG
  rationale: 재판 맥락에서 ‘δικαίως’는 응당한 판결과 수용을 가리키므로, 한국어로는 결과의 정당성을 드러내는 ‘참으로 마땅히’가 자연스럽습니다.
- source_word: ἄξια ... ἀπολαμβάνομεν
  english_pob_choice: we are receiving what our deeds deserve
  chosen_korean: 우리가 행한 일의 대가를 받고 있습니다
  alternatives_korean:
  - 우리가 한 일에 합당한 것을 받고 있습니다
  - 우리의 행위에 마땅한 것을 받고 있습니다
  lexicon: BDAG
  rationale: ‘ἄξια’와 ‘ἀπολαμβάνομεν’의 결합은 행위에 상응하는 결과를 받는다는 뜻이므로, 이를 ‘대가를 받고 있습니다’로 옮겨 보응의 의미를 살렸습니다.
- source_word: οὐδὲν ἄτοπον ἔπραξεν
  english_pob_choice: has done nothing wrong
  chosen_korean: 아무 잘못도 하지 않았습니다
  alternatives_korean:
  - 아무 부당한 일도 하지 않았습니다
  - 아무 부적절한 일도 하지 않았습니다
  - 아무 잘못된 일도 하지 않았습니다
  lexicon: BDAG
  rationale: ‘ἄτοπον’은 여기서 도덕적·법적 부당함을 가리키므로, 예수의 무죄 진술을 분명하게 드러내는 ‘아무 잘못도 하지 않았습니다’가 가장 간결합니다.
theological_decisions:
- issue: 회개한 강도의 예수 무죄 진술을 어떻게 한국어로 유지할지
  chosen_reading: 이 사람은 아무 잘못도 하지 않았습니다
  alternative_readings:
  - 이 사람은 아무 부적절한 일도 하지 않았습니다
  - 이 사람은 아무 부당한 일도 하지 않았습니다
  rationale: 본문은 즉각적인 재판·처형 맥락에서 예수의 무죄를 인간 증언으로 제시하므로, 의미를 좁히지 않으면서도 평이하게 유지했습니다.
  doctrine_reference: 본문의 증언을 과도하게 신학화하지 말고, 문맥이 말하는 무죄 진술을 그대로 살립니다.
