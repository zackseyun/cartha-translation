  - 우리의 행위에 마땅한 것을 받고 있습니다
  lexicon: BDAG
  rationale: ‘ἄξια’와 ‘ἀπολαμβάνομεν’의 결합은 행위에 상응하는 결과를 받는다는 뜻이므로, 이를 ‘대가를 받고 있습니다’로 옮겨 보응의 의미를 살렸습니다.
- source_word: οὐδὲν ἄτοπον ἔπραξεν
  english_pob_choice: has done nothing wrong
  chosen_korean: 아무 잘못도 하지 않았습니다
  alternatives_korean:
  - 아무 부당한 일도 하지 않았습니다
  - 아무 부적절한 일도 하지 않았습니다
  - 아무 잘못된 일도 하지 않았습니다
  lexicon: BDAG
  rationale: ‘ἄτοπον’은 여기서 도덕적·법적 부당함을 가리키므로, 예수의 무죄 진술을 분명하게 드러내는 ‘아무 잘못도 하지 않았습니다’가 가장 간결합니다.
