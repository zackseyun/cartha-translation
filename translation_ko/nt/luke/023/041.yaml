  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 첫 문장의 ‘우리도 참으로 마땅히 받습니다’는 ἀπολαμβάνομεν의 목적어가 한국어에서 부자연스럽게 생략되어 있으며, 수난·처형의 문맥에서 받는 벌을 명시하는 것이 자연스럽습니다. ‘우리가 행한 일에 마땅한 대가를 받고 있기 때문입니다’는 ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν을 잘 반영합니다.
  naturalness: 합쇼체는 유지되어 있으나, ‘참으로 마땅히 받습니다’는 현대 표준어에서 무엇을 받는지 불분명합니다. ‘우리야 마땅히 벌을 받고 있습니다’가 대조의 μὲν과 현재형을 자연스럽게 드러냅니다.
