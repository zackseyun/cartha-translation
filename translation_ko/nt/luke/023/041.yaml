  lexicon: BDAG
  rationale: 재판 맥락에서 ‘δικαίως’는 응당한 판결과 수용을 가리키므로, 한국어로는 결과의 정당성을 드러내는 ‘참으로 마땅히’가 자연스럽습니다.
- source_word: ἄξια ... ἀπολαμβάνομεν
  english_pob_choice: we are receiving what our deeds deserve
  chosen_korean: 우리가 행한 일의 대가를 받고 있습니다
  alternatives_korean:
