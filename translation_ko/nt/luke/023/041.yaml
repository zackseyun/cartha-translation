- from: 우리도 참으로 마땅히 받습니다. 우리가 행한 일의 대가를 받고 있기 때문입니다. 그러나 이 사람은 아무 잘못도 하지 않았습니다.[a][b]
  to: 우리야 마땅히[a] 벌을 받고 있습니다. 우리가 행한 일에 마땅한 대가를 받고 있기 때문입니다. 그러나 이 사람은 아무 잘못도 하지 않았습니다.[b]
  rationale: ‘우리야’로 μὲν의 대조적 강조를 살리고, ‘벌을 받고 있습니다’로 문맥상 분명한 ἀπολαμβάνομεν의 내용을 자연스러운 한국어로 제시했습니다. 이어지는 이유절은 행위에 상응하는 보응이라는 ἄξια의 의미를 ‘마땅한 대가’로 유지했습니다. 예수에 관한 진술은 원문의 범위를 넘지 않도록 그대로 유지했으며, 각주는 관련 어구에 직접 연결했습니다.
