  source_fidelity: καὶ εἶπεν αὐτῷ는 ‘그에게 말씀하셨습니다’로 자연스럽게 옮겼고, Ἀμήν σοι λέγω σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ의 인칭, 미래 약속, ‘오늘’, 동반, 장소가 모두 보존되었습니다. 본문은 σήμερον을 ἔσῃ에 연결하는 가장 자연스러운 읽기를 명료하게 반영합니다.
  naturalness: 합쇼체 서술과 직접화법이 자연스럽습니다. ‘너/네가’는 예수께서 단수 상대에게 직접 말씀하시는 장면에서 현대 한국어 성경 문체로 무리가 없으며, ‘낙원에 있을 것입니다’도 명확합니다.
  terminology: ‘진실로’, ‘낙원’은 각각 Ἀμήν과 παραδείσῳ에 적절합니다. ‘낙원’을 ‘천국’으로 대체하지 않은 것은 원문의 어휘 선택을 보존합니다.
