id: LUK.23.43
reference: Luke 23:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
  footnotes:
  - marker: a
    text: 'Or, less likely: “Truly I tell you today, you will be with me in paradise.” The Greek text originally lacked punctuation; this alternative takes “today” with “I tell you” rather than with “you will be.”'
    reason: alternative_reading
translation:
  language: ko
  text: 그에게 말씀하셨습니다. “진실로 내가 너에게 말합니다. 오늘 네가 나와 함께 낙원에 있을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는, 가능성은 낮지만: “진실로 내가 오늘 너에게 말합니다. 너는 나와 함께 낙원에 있을 것입니다.” 헬라어 본문에는 원래 문장부호가 없어서, 이 대안은 ‘오늘’을 ‘내가 너에게 말합니다’에 붙입니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  english_pob_choice: Truly
  chosen_korean: 진실로
  alternatives_korean:
  - 아멘
  - 참으로
  - 진실로
  lexicon: BDAG
  rationale: 예수의 선언을 여는 Ἀμήν의 엄숙한 확언 기능을 살리되, 예배용 음역보다 현대 한국어 서술문에 자연스러운 공손한 확언 표현을 택했습니다.
- source_word: σοι λέγω
  english_pob_choice: I tell you
  chosen_korean: 내가 너에게 말합니다
  alternatives_korean:
  - 내가 네게 말합니다
  - 내가 너에게 이릅니다
  - 내가 너에게 말하노라
  lexicon: BDAG
  rationale: 직접화법의 화자-청자 관계를 분명히 하면서, 합쇼체로 예수의 권위 있는 선언을 자연스럽게 드러냅니다.
- source_word: σήμερον
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 오늘날
  - 지금
  lexicon: BDAG
  rationale: 그리스어 부사 σήμερον을 가장 직접적으로 옮겨, 약속이 이루어지는 시점을 분명히 하였습니다. 문장부호가 해석을 좌우하는 대안은 각주로 남깁니다.
- source_word: παραδείσῳ
  english_pob_choice: paradise
  chosen_korean: 낙원
  alternatives_korean:
  - 파라다이스
  - 동산
  - 천국
  lexicon: BDAG
  rationale: παράδεισος의 표준적인 성경 용례를 따라 ‘낙원’으로 옮겼습니다. ‘천국’은 다른 헬라어 표현과 의미 범위가 달라 여기서는 피했습니다.
theological_decisions:
- issue: σήμερον(오늘)의 수식 범위가 문장부호 해석에 따라 달라지는 문제
  chosen_reading: ‘오늘’은 ‘네가 나와 함께 낙원에 있을 것입니다’에 붙였습니다.
  alternative_readings:
  - ‘오늘’은 ‘내가 너에게 말합니다’에 붙일 수 있습니다.
  rationale: 헬라어 본문은 현대식 문장부호가 없으므로 번역은 해석을 반영합니다. 문맥상 가장 자연스러운 읽기는 약속의 시점을 오늘로 보는 것이므로 본문에는 이를 채택하되, 대안 해석은 각주로 보존합니다.
  doctrine_reference: 'Translation philosophy §3: 보존 가능한 신학적 긴장을 해소하지 말고, 문장부호 의존적 해석은 각주로 문서화합니다.'
