id: LUK.23.48
reference: Luke 23:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
  footnotes:
  - marker: a
    text: Or 'for this sight.'
    reason: lexical_alternative
  - marker: b
    text: A gesture of grief, mourning, or shock.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 함께 모여 그 광경을 보던 모든 무리가, 일어난 일을 보고는, 가슴을 치며 돌아가고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광경’은 here의 θεωρία가 지닌 공개적 ‘구경거리/보기’의 뉘앙스를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 가슴을 치는 행위는 애도, 충격, 슬픔을 나타내는 몸짓일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  english_pob_choice: had gathered
  chosen_korean: 함께 모여
  alternatives_korean:
  - 모여든
  - 함께 모여든
  - 한자리에 모인
  lexicon: BDAG
  rationale: 동사적 뉘앙스를 살려 사람들이 현장에 함께 모여 있는 상태를 자연스럽게 표현했습니다.
- source_word: ὄχλοι
  english_pob_choice: crowds
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  - 무리들
  lexicon: BDAG
  rationale: 복수 집단이라는 점을 살리되, 한국어에서 복수 표지가 어색할 수 있어 문맥상 자연한 ‘무리’로 옮겼습니다.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  english_pob_choice: for this spectacle
  chosen_korean: 그 광경을 보려고
  alternatives_korean:
  - 이 구경을 하려고
  - 이 광경을 보려고
  - 이 일을 구경하려고
  lexicon: BDAG
  rationale: theōria의 공개적 ‘보기/구경’ 성격을 살리면서, POB의 ‘spectacle’가 지닌 약간의 해석적 뉘앙스를 한국어에서는 ‘광경’으로 전달했습니다.
- source_word: τύπτοντες τὰ στήθη
  english_pob_choice: beating their chests
  chosen_korean: 가슴을 치며
  alternatives_korean:
  - 가슴을 두드리며
  - 가슴을 치고
  - 가슴을 치면서
  lexicon: BDAG
  rationale: 애도·충격·슬픔의 몸짓을 지시하는 관용 표현으로서, 직역보다 한국어 관용에 가까운 ‘가슴을 치며’를 택했습니다.
theological_decisions:
- issue: τὰ γενόμενα와 ὑπέστρεφον의 관계를 어떻게 드러낼지
  chosen_reading: 사람들이 ‘일어난 일을 보고는’ ‘돌아가고 있었습니다’로 옮겨, 사건을 본 뒤의 지속적 귀환을 분리해서 드러냈습니다.
  alternative_readings:
  - 보고는 돌아갔습니다
  - 일어난 일을 보고는 돌아가고 있었습니다
  - 보고는 되돌아갔습니다
  rationale: 아오리스트 분사와 미완료 시상의 흐름을 한국어에서도 순차성과 진행성을 함께 느낄 수 있게 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
