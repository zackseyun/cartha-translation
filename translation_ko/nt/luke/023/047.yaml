id: LUK.23.47
reference: Luke 23:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: Now when the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
  footnotes:
  - marker: a
    text: Or “innocent” or “just.” The Greek word can denote moral righteousness or legal innocence in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 백부장은 일어난 일을 보고 하나님께 영광을 돌리며 말했습니다. “참으로 이 사람은 의로운 사람이었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무죄한”, “정당한”. 이 헬라어는 문맥에 따라 도덕적 의로움이나 법적 무죄를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  english_pob_choice: Now when ... saw
  chosen_korean: 그런데 ... 보고
  alternatives_korean:
  - 그리고 ... 보고
  - 그가 보고
  lexicon: BDAG
  rationale: δὲ의 완만한 전개와 aorist participle의 시간 관계를 한국어에서 자연스럽게 살려, 장면 전환을 드러내는 ‘그런데’와 동사 ‘보고’로 옮겼습니다.
- source_word: ἑκατοντάρχης
  english_pob_choice: centurion
  chosen_korean: 백부장
  alternatives_korean:
  - 로마 백부장
  - 군관
  lexicon: BDAG
  rationale: 백부장은 한국어 성경에서 널리 통용되는 직역적 표현으로, 군 계급의 구체성을 잘 보존합니다.
- source_word: ἐδόξαζεν
  english_pob_choice: glorified
  chosen_korean: 영광을 돌리며
  alternatives_korean:
  - 영광을 돌리기 시작하며
  - 찬양하며
  - 영광스럽게 하며
  lexicon: BDAG
  rationale: imperfect의 지속적/진행적 뉘앙스를 한국어 부사구로 자연스럽게 살리면서, δοξάζω의 신학적 강도를 약화시키지 않기 위해 ‘영광을 돌리다’를 택했습니다.
- source_word: δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 의인인
  - 무죄한
  - 정당한
  lexicon: BDAG
  rationale: δίκαιος의 핵심 의미인 도덕적·신학적 의를 살리되, 문맥상 가능한 ‘무죄한’의 법정적 뉘앙스는 본문 주해 여지를 남기도록 주석 처리했습니다.
theological_decisions:
- issue: 백부장의 평결인 δίκαιος의 의미 범위
  chosen_reading: ‘의로운’으로 두어 예수의 도덕적/신학적 의를 직접 표현했습니다.
  alternative_readings:
  - 무죄한
  - 정당한
  rationale: 누가복음은 예수의 억울한 처형 맥락을 강조하지만, 본문 자체는 백부장의 진술을 단순한 법적 무죄 선언으로만 제한하지 않습니다. 따라서 ‘의로운’으로 번역해 의미의 긴장을 보존했습니다.
  doctrine_reference: 의미의 긴장 보존; 문맥상 법정적 독해를 배제하지 않되 본문이 직접 말하는 바를 우선함.
