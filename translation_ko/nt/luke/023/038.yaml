id: LUK.23.38
reference: Luke 23:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
  footnotes:
  - marker: a
    text: Or “sign,” “notice,” or “written charge.”
    reason: lexical_alternative
  - marker: b
    text: Or “above him.”
    reason: lexical_alternative
  - marker: c
    text: Greek is literally “The King of the Jews, this one.”
    reason: lexical_alternative
  - marker: d
    text: “Jews” could in some contexts be rendered “Judeans,” but in this fixed crucifixion title the traditional and contextually fitting sense is “Jews.”
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그 위에는 한 표지판이 있었습니다. 「이 사람은 유대인의 왕입니다」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “표지,” “고지문,” “서면 공소장”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그 위에”입니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 문자적으로 “유대인의 왕, 이 사람”입니다.
    reason: lexical_alternative
  - marker: d
    text: 여기서 “유대인”은 일부 문맥에서 “유다인”으로도 옮길 수 있지만, 십자가형의 고정된 칭호에서는 전통적이고 문맥에 맞는 표현이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  english_pob_choice: inscription
  chosen_korean: 표지판
  alternatives_korean:
  - 명문
  - 게시문
  - 글귀
  - 기록
  lexicon: BDAG
  rationale: 십자가 위에 붙은 게시 문구라는 맥락을 살려, 현대 한국어에서 자연스럽고 읽기 쉬운 표현인 ‘표지판’을 택했습니다. ‘명문’은 너무 문어적이고, ‘게시문’은 딱딱하며, ‘기록’은 대상물이 아니라는 점에서 부정확합니다.
- source_word: ἐπ’ αὐτῷ
  english_pob_choice: over him
  chosen_korean: 그 위에는
  alternatives_korean:
  - 그 위에
  - 그에게
  - 그 위쪽에
  lexicon: BDAG
  rationale: 십자가형 처형 현장에서 예수의 몸/십자가에 대한 상대적 위치를 자연스럽게 드러내기 위해 ‘그 위에는’으로 옮겼습니다. 영어 본문의 ‘over him’과 같은 공간적 관계를 유지합니다.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  english_pob_choice: This is the King of the Jews
  chosen_korean: 이 사람은 유대인의 왕입니다
  alternatives_korean:
  - 이분은 유대인의 왕입니다
  - 유대인의 왕, 이 사람입니다
  - 이 사람은 유대인의 왕이다
  lexicon: BDAG
  rationale: 그리스어의 무동사 구문과 지시대명사 οὗτος의 강조를 한국어에서는 주어를 보충해 자연스럽게 살렸습니다. ‘이 사람은…입니다’는 게시문체의 선명함을 유지하면서도 영어의 ‘This is…’에 대응합니다.
- source_word: Ἰουδαίων
  english_pob_choice: Jews
  chosen_korean: 유대인
  alternatives_korean:
  - 유다인
  - 유대 사람들
  lexicon: BDAG
  rationale: 이 구절은 십자가 위 명칭으로 고정된 표현인 ‘유대인의 왕’이 가장 자연스럽고 전통적인 문맥 적합성을 가집니다. 여기서는 별도 주해 없이 일반적인 역사·민족적 호칭으로 옮겼습니다.
theological_decisions:
- issue: 십자가 위 문구의 성격
  chosen_reading: 이 구절은 예수에 대한 표지판의 존재와 문구를 직접 보고하며, 법적 공소장처럼 해설하지 않고 그대로 제시했습니다.
  alternative_readings:
  - 형식적인 고발문으로 풀어 쓰기
  - 아이러니나 정치적 함의를 본문에 더 드러내기
  rationale: 본문은 표지판의 내용 자체를 전달하므로, 번역이 해석을 앞서지 않도록 했습니다. 이는 원문 우선 원칙에 맞고 본문이 지닌 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it.'
