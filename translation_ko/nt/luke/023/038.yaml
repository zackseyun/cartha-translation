  source_fidelity: 원문의 ἐπιγραφή는 십자가 처형자 위에 게시된 ‘글/명문’을 가리킵니다. 초안의 ‘표지판’은 물리적 판 자체를 뜻하기 쉬워, 기록된 내용인 ἐπιγραφή보다 다소 좁고 부정확합니다. 또한 ἐπ’ αὐτῷ는 ‘그 위에’보다 ‘그분 위에’로 옮겨 지시 대상을 분명히 하는 편이 안전합니다. 인용문의 ‘이 사람은 유대인의 왕이다’는 무동사 명제와 οὗτος의 지시성을 자연스럽게 보존합니다.
  naturalness: ‘그분 위에는 또 다음과 같은 글이 적혀 있었습니다’는 현대 표준 한국어의 합쇼체 서술로 자연스럽고, 게시된 문구의 존재를 명료하게 전달합니다. 인용문은 실제 게시문의 형식으로 ‘이다’를 사용해도 자연스럽습니다.
  terminology: ‘유대인의 왕’은 이 십자가형 칭호에 대한 확립되고 문맥에 맞는 표현입니다. 각주 a의 ‘서면 공소장’은 현대 법률문서인 공소장을 연상시켜 원문의 넓은 의미와 맞지 않으므로 ‘적어 놓은 죄목’으로 조정합니다.
