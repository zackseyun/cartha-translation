  rationale: ‘쯤’으로 ὡσεὶ의 근사성을 회복하고, ‘아홉째 시까지’로 ἕως ὥρας ἐνάτης의 표현과 종료 시점을 보존했습니다. 시간의 현대적 환산은 각주로 제시했습니다. γῆ의 지역적·우주적 범위에 관한 모호성은 ‘온 땅’과 대안 각주로 그대로 유지했습니다.
