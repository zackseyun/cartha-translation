id: LUK.23.44
reference: Luke 23:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
  footnotes:
  - marker: a
    text: Or 'the whole earth.' The Greek word γῆ can mean either 'land' or 'earth.'
    reason: alternative_reading
  - marker: b
    text: That is, from about noon until about three in the afternoon.
    reason: cultural_note
translation:
  language: ko
  text: 때는 이미 여섯째 시쯤이었고, 어둠이 온 땅에[a] 아홉째 시까지 내렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 세상’. 그리스어 γῆ는 ‘땅’이나 ‘세상’ 둘 다를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 곧 약 정오부터 오후 세 시까지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη ὡσεὶ ὥρα ἕκτη
  english_pob_choice: already about the sixth hour
  chosen_korean: 이미 여섯째 시간이 되었고
  alternatives_korean:
  - 벌써 대략 여섯 시가 되었고
  - 이미 거의 여섯째 시간이었고
  lexicon: BDAG
  rationale: ἤδη의 ‘already’와 ὡσεὶ의 ‘about’를 함께 살려, 시간 도달의 뉘앙스를 자연스럽게 합쇼체로 옮겼습니다. ‘여섯째 시간’은 본문 형식을 보존합니다.
- source_word: σκότος ἐγένετο
  english_pob_choice: darkness came
  chosen_korean: 어둠이 내렸습니다
  alternatives_korean:
  - 어둠이 왔습니다
  - 어둠이 생겼습니다
  lexicon: BDAG
  rationale: ‘어둠’에 대해 γίνομαι의 사건성을 한국어 관용에 맞게 ‘내리다’로 표현해, 단순 상태가 아니라 발생한 사건임을 드러냈습니다.
- source_word: ἐφ’ ὅλην τὴν γῆν
  english_pob_choice: over the whole land
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 땅 위에
  - 온 땅 전체에
  - 온 세상에
  lexicon: BDAG
  rationale: γῆ의 ‘land/earth’ 양가성을 살리되, 본문이 허락하는 더 절제된 ‘땅’을 택했습니다. ‘온’은 범위를, ‘땅’은 전면성을 간결하게 전달합니다.
- source_word: ἕως ὥρας ἐνάτης
  english_pob_choice: until the ninth hour
  chosen_korean: 세 시간 동안
  alternatives_korean:
  - 아홉째 시간까지
  - 오후 세 시까지
  lexicon: BDAG
  rationale: 본문의 시간 표현을 현대 독자가 이해하도록 보충해 합쳐 옮겼습니다. 문맥상 여섯째 시간에서 아홉째 시간까지의 지속을 분명히 드러냅니다.
theological_decisions:
- issue: γῆ의 범위
  chosen_reading: 온 땅
  alternative_readings:
  - 온 세상
  - 온 지면
  - 온 땅과 온 세상
  rationale: 영어 POB가 유지한 ‘land’의 절제된 독법을 따라, 우주적 범위를 단정하지 않고 본문이 허용하는 넓은 지역적 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
