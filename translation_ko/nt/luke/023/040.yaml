  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
  footnotes:
  - marker: a
    text: Or “under the same condemnation” or “in the same judgment.” The Greek κρίμα can denote judgment, verdict, or sentence; here it refers to the shared penal outcome.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다른 한 사람은 그를 꾸짖으며 대답했습니다. 「당신도 같은 판결을 받고 있으면서 하나님을 두려워하지 않습니까?[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “같은 심판 아래 있으면서도” 또는 “같은 선고를 받고 있으면서도”로 옮길 수 있습니다. 그리스어 κρίμα는 심판, 판결, 또는 선고를 뜻할 수 있으며, 여기서는 두 사람이 함께 처한 형벌적 결과를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  english_pob_choice: But the other answered
  chosen_korean: 그러나 다른 한 사람은 … 대답했습니다
  alternatives_korean:
  - 그런데 다른 이가 … 답했습니다
  - 그 다른 사람이 … 말했습니다
  lexicon: BDAG
  rationale: ἀποκριθεὶς δὲ ὁ ἕτερος의 대조와 응답 구성을 살려, ‘그러나’와 ‘다른 한 사람은’으로 두 범죄자 사이의 대비를 분명히 했습니다.
- source_word: ἐπιτιμῶν αὐτῷ
  english_pob_choice: rebuking him
  chosen_korean: 그를 꾸짖으며
  alternatives_korean:
  - 그를 책망하며
  - 그를 나무라며
  lexicon: BDAG
  rationale: ἐπιτιμάω는 단순한 지적보다 강한 꾸짖음을 뜻하므로, 현대 한국어에서 직접적이고 구어적인 ‘꾸짖다’로 옮겼습니다.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  english_pob_choice: Do you not even fear God
  chosen_korean: 너는 … 하나님을 두려워하지 않느냐?
  alternatives_korean:
  - 너는 … 하나님을 무서워하지 않느냐?
  - 너는 … 하나님을 경외하지 않느냐?
  lexicon: BDAG
  rationale: φοβέομαι + τὸν θεόν의 직접적 의미를 살려 ‘두려워하다’로 번역했고, ‘경외하다’는 해석을 덧붙이는 느낌이 있어 보조 대안으로만 두었습니다.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  english_pob_choice: since you are under the same sentence
  chosen_korean: 같은 판결을 받고도
  alternatives_korean:
  - 같은 심판을 받고도
  - 같은 형을 받고도
  - 같은 선고 아래 있으면서도
  lexicon: BDAG
  rationale: κρίμα는 이 문맥에서 사형선고의 법적 결과를 가리키므로, 의미를 분명하게 드러내는 ‘판결’로 옮겼습니다. ‘받고도’는 현재 처지를 자연스럽게 살립니다.
theological_decisions:
- issue: 하나님을 두려워한다는 표현의 보존
  chosen_reading: ‘하나님을 두려워하지 않느냐’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 하나님을 경외하지 않느냐
  - 하나님을 무서워하지 않느냐
  rationale: 본문의 도덕적 책망과 신적 책임 의식을 희석하지 않기 위해, 성경적 관용구를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
