revisions:
- from: 그래서 그들은 반란과 살인으로 감옥에 던져졌던 그 사람을 놓아주고, 자기들이 요구하던 그 사람을 내주었습니다. 그러나 예수님은 그들의 뜻에 넘겨주었습니다.[a][b]
  to: 빌라도는 반란과 살인 때문에 감옥에 던져졌던 사람[a], 곧 그들이 요구하던 사람을 놓아주고, 예수님은 그들의 뜻에 넘겨주었습니다[b].
  rationale: 원문의 두 동사 ἀπέλυσεν과 παρέδωκεν은 모두 빌라도를 가리키므로 주어를 명시하여 행위 관계를 바로잡았습니다. 수감된 사람은 군중이 요구하던 사람이라는 관계를 ‘곧’으로 명료하게 유지했으며, 예수님을 ‘그들의 뜻에’ 넘긴다는 표현을 보존하여 불필요한 교리적 확장을 피했습니다. 각주는 해당 어구 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:40Z'
