  verdict: revise
  source_fidelity: 현 번역은 주어를 ‘그들은’으로 처리하고 ‘놓아주고/내주었습니다’라고 하여, 단수 동사 ἀπέλυσεν 및 παρέδωκεν의 행위자인 빌라도가 사라졌으며 행위의 대상도 뒤바뀌었습니다. 원문은 빌라도가 반란과 살인으로 수감된, 군중이 요구하던 사람을 석방하고 예수님을 그들의 뜻에 넘겨준다고 말합니다.
  naturalness: 수정문은 한국어에서 필요한 주어 ‘빌라도’를 명시하고, 길게 중첩된 관형절은 ‘곧’으로 풀어 자연스럽고 명료하게 했습니다. 합쇼체 서술도 유지했습니다.
  terminology: ‘반란과 살인’, ‘감옥에 던져졌던’, ‘그들의 뜻에 넘겨주었습니다’는 στάσις, φόνος, βεβλημένον εἰς φυλακήν, τῷ θελήματι αὐτῶν의 의미와 수난 서술의 어휘를 적절히 보존합니다. ‘예수님’은 해당 번역의 존칭 관례와 일치합니다.
