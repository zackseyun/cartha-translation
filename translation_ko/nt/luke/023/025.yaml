id: LUK.23.25
reference: Luke 23:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
  footnotes:
  - marker: a
    text: Or 'had been put in prison.' The Greek is more vividly 'had been thrown into prison.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to what they wanted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 반란과 살인으로 감옥에 던져졌던 그 사람을 놓아주고, 자기들이 요구하던 그 사람을 내주었습니다. 그러나 예수님은 그들의 뜻에 넘겨주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감옥에 넣어졌던’. 헬라어는 더 생생하게 ‘감옥에 던져졌던’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 원한 대로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  english_pob_choice: released
  chosen_korean: 놓아주었습니다
  alternatives_korean:
  - 석방했습니다
  - 풀어주었습니다
  lexicon: BDAG
  rationale: 감옥에 있던 사람을 풀어 주는 문맥이므로, 법적·구금적 상황을 자연스럽게 살리는 ‘놓아주었습니다’를 택했습니다.
- source_word: διὰ στάσιν καὶ φόνον
  english_pob_choice: for insurrection and murder
  chosen_korean: 반란과 살인으로
  alternatives_korean:
  - 폭동과 살인 때문에
  - 소요와 살인으로
  lexicon: BDAG
  rationale: διά+목적격은 원인 표지이므로 ‘~으로’가 적절하며, στάσις는 이 문맥에서 단순한 다툼이 아니라 정치적 반란에 가까워 ‘반란’으로 옮겼습니다.
- source_word: βεβλημένον εἰς φυλακήν
  english_pob_choice: had been thrown into prison
  chosen_korean: 감옥에 던져졌던
  alternatives_korean:
  - 감옥에 갇혔던
  - 감옥에 넣어졌던
  lexicon: BDAG
  rationale: βάλλω의 수동 완료 분사는 ‘던지다’의 생생함을 지니므로, POB의 감각을 살려 ‘감옥에 던져졌던’으로 옮겼습니다.
- source_word: τῷ θελήματι αὐτῶν
  english_pob_choice: to their will
  chosen_korean: 그들의 뜻에
  alternatives_korean:
  - 그들이 원한 대로
  - 그들의 의지에
  lexicon: BDAG
  rationale: θέλημα은 단순한 욕구보다 의지·뜻의 무게가 있어 ‘뜻에’가 원문의 힘을 유지합니다.
theological_decisions:
- issue: 예수님을 ‘그들의 뜻에 넘겨주다’의 표현이 갖는 수난 서술의 의미
  chosen_reading: 예수님은 사람들의 요구와 의지에 넘겨진 것으로, 별도의 설명을 덧붙이지 않고 서술 자체를 유지했습니다.
  alternative_readings:
  - 대속적 의미를 드러내기 위해 ‘대신 넘겨주었다’로 확장
  - 해석을 붙여 ‘그들의 악한 뜻대로 넘겨주었다’로 강화
  rationale: 본문은 빌라도의 결정을 기록할 뿐, 이 절 자체에서 대속 교리를 직접 진술하지 않으므로 해석을 덧붙이지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 범위를 넘는 교리적 설명을 삽입하지 않음'
