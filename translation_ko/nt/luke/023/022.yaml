id: LUK.23.22
reference: Luke 23:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
  footnotes:
  - marker: a
    text: Or “For what evil has this man done?” The opening Τί may be taken as an elliptical protest introducing the fuller question.
    reason: lexical_alternative
  - marker: b
    text: Or “no cause for death,” “nothing deserving death,” or “no basis for a death sentence.”
    reason: lexical_alternative
  - marker: c
    text: Or “after punishing him”; possibly more specifically “after flogging him.” The Greek παιδεύσας denotes disciplinary punishment, but the exact form is not specified by this word alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 세 번째로 그들에게 말했습니다. 「도대체 이 사람이 무슨 악한 일을 했습니까?」[a] 「나는 그에게서 사형에 해당하는 근거를 하나도 찾지 못했습니다.[b] 그러므로 그를 벌한 뒤에[c] 풀어 주겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘도대체’는 Τί의 항의적·수사적 성격을 살린 표현입니다. 또는 ‘왜요? 이 사람이 무슨 악한 일을 했습니까?’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사형에 해당하는 근거’는 ‘죽음에 대한 근거’, ‘사형 선고의 근거’, ‘사형받을 죄목’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘벌한 뒤에’는 παιδεύσας의 징벌적 의미를 반영한 표현입니다. ‘처벌한 뒤에’ 또는 더 구체적으로 ‘매질한 뒤에’, ‘채찍질한 뒤에’로 이해할 수도 있으나, 이 단어만으로 처벌 방식이 특정되지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  english_pob_choice: a third time
  chosen_korean: 세 번째로
  alternatives_korean:
  - 세 번째 시간에
  - 세 번째로
  lexicon: BDAG
  rationale: 반복을 나타내는 부사적 용법이므로 자연스러운 현대 한국어로 ‘세 번째로’가 가장 적절합니다.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  english_pob_choice: Why? What evil has this man done?
  chosen_korean: 도대체 이 사람이 무슨 악한 일을 했습니까?
  alternatives_korean:
  - 왜요? 이 사람이 무슨 악한 일을 했습니까?
  - 무슨 악한 일을 이 사람이 했습니까?
  lexicon: BDAG
  rationale: Τί의 수사적 항의 뉘앙스를 한국어에서 ‘도대체’로 살리고, κακόν은 단순한 ‘잘못’보다 도덕적 강도를 지닌 ‘악한 일’로 옮겼습니다.
- source_word: οὐδὲν αἴτιον θανάτου
  english_pob_choice: no grounds for death
  chosen_korean: 사형에 이를 근거를 하나도
  alternatives_korean:
  - 죽음에 이를 근거를 하나도
  - 사형받을 죄목을 하나도
  - 사형 선고의 근거를 하나도
  lexicon: BDAG
  rationale: 법정 맥락의 αἴτιον을 ‘근거’로 옮기되, θανάτου는 문맥상 ‘사형’의 의미가 분명하므로 ‘사형에 이를 근거’로 자연스럽게 표현했습니다.
- source_word: παιδεύσας
  english_pob_choice: after disciplining him
  chosen_korean: 매질한 뒤에
  alternatives_korean:
  - 징계한 뒤에
  - 벌한 뒤에
  - 채찍질한 뒤에
  lexicon: BDAG
  rationale: 이 동사는 단순 훈육보다 징벌적 처분을 가리키며, 여기서는 더 구체적인 형벌 가능성을 열어 두되 본문이 직접 명시하지 않는 범위 안에서 ‘매질한 뒤에’로 번역했습니다.
theological_decisions:
- issue: Pilate의 제안된 처벌의 구체성
  chosen_reading: 본문은 사형에 이르지 않는 징벌적 처분을 제안하지만, 그 형식은 본문 자체가 명시하는 범위 안에서만 드러내도록 했습니다.
  alternative_readings:
  - 징계한 뒤에
  - 채찍질한 뒤에
  rationale: παιδεύσας는 문맥상 처벌을 뜻하지만, 예수에게 가해질 구체적 처벌을 번역이 과도하게 결정하지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 과도한 구체화 지양'
