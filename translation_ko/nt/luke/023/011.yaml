id: LUK.23.11
reference: Luke 23:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
  footnotes:
  - marker: a
    text: Or 'a splendid robe'; λαμπρὰν can also mean 'bright,' and the clothing likely serves Herod's mockery by giving Jesus an appearance of mock honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 헤롯도 자기 군사들과 함께 예수님을 업신여기고 조롱했습니다. 예수님께 화려한 옷을 입힌 뒤[a] 그분을 빌라도에게 돌려보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛나는 옷’. λαμπράν은 ‘밝은, 빛나는’이라는 뜻도 있습니다. 이 옷은 예수님을 조롱하기 위해 마치 존귀한 사람처럼 꾸민 것일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  english_pob_choice: treated him with contempt
  chosen_korean: 업신여기며
  alternatives_korean:
  - 멸시하며
  - 경멸하며
  lexicon: BDAG
  rationale: 사람을 ‘하찮게 여기다’는 동작적 뉘앙스를 살리기 위해, 한국어에서는 행위성을 드러내는 ‘업신여기며’를 택했습니다.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  english_pob_choice: together with his soldiers
  chosen_korean: 자기 군사들과 함께
  alternatives_korean:
  - 자기 병사들과 함께
  - 자기 부대와 함께
  lexicon: BDAG
  rationale: στράτευμα는 여기서 군사 집단을 가리키므로, 이야기 문맥에 자연스럽고 구체적인 ‘군사들’로 옮겼습니다.
- source_word: ἐμπαίξας
  english_pob_choice: mocked him
  chosen_korean: 조롱했습니다
  alternatives_korean:
  - 희롱했습니다
  - 비웃었습니다
  lexicon: BDAG
  rationale: 수난 기사에서의 공개적 수치를 나타내는 표준적 표현으로 ‘조롱했습니다’를 선택했습니다.
- source_word: ἐσθῆτα λαμπρὰν
  english_pob_choice: splendid clothing
  chosen_korean: 밝고 화려한 옷
  alternatives_korean:
  - 찬란한 옷
  - 화려한 의복
  - 빛나는 옷
  lexicon: BDAG
  rationale: λαμπρός의 ‘밝은/빛나는/화려한’ 범위를 살리면서, 영어 POB가 보존한 조롱의 아이러니를 한국어에서도 드러내기 위해 ‘밝고 화려한 옷’으로 옮겼습니다.
- source_word: ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ
  english_pob_choice: sent him back to Pilate
  chosen_korean: 그분을 빌라도에게 돌려보냈습니다
  alternatives_korean:
  - 그분을 빌라도에게 보냈습니다
  - 그분을 빌라도에게 돌려주었습니다
  lexicon: BDAG
  rationale: 법정 절차상 이전 권위자에게 되돌려 보내는 뜻을 분명히 하기 위해 ‘돌려보냈습니다’를 택했습니다.
theological_decisions:
- issue: 헤롯의 조롱이 담긴 옷의 의미
  chosen_reading: 본문이 말하는 ‘밝고 화려한 옷’만을 살리고, 그 옷이 조롱과 모욕의 장치라는 점은 문맥으로 드러나게 했습니다.
  alternative_readings:
  - 특정한 왕복으로 단정하는 읽기
  - 정신이상 풍자로 해석하는 읽기
  rationale: 헬라어는 옷의 종류를 구체적으로 규정하지 않으므로, 본문 이상의 상징 해석을 본문 안에 넣지 않으면서도 모욕의 아이러니는 보존해야 합니다.
  doctrine_reference: 본문의 긴장을 해치지 않도록 과도한 해석을 자제함
