revisions:
- from: 그러자 헤롯도 자기 군사들과 함께 예수님을 업신여기며 조롱했습니다. 예수님께 밝고 화려한 옷을 입힌 뒤, 그분을 빌라도에게 돌려보냈습니다.[a]
  to: 그런데 헤롯도 자기 군사들과 함께 예수님을 업신여기고 조롱했습니다. 예수님께 화려한 옷을 입힌 뒤[a] 그분을 빌라도에게 돌려보냈습니다.
  rationale: 원문의 λαμπράν이 지닌 ‘빛나는’과 ‘화려한’의 어휘적 범위를 본문과 각주로 나누어 보존했습니다. 또한 각주의 영어 혼입을 제거하고, 표지를 의복 어구 바로 뒤로 옮겨 참조 대상을 명확히 했습니다. ‘그런데 헤롯도’는 δὲ와 καὶ ὁ Ἡρῴδης가 제공하는 전환 및 ‘또한’의 뉘앙스를 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:38Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 옮겼습니다. 헤롯과 그의 군사들이 예수님을 멸시하고 조롱한 뒤 빌라도에게 돌려보냈다는 사건 순서와 ἀνέπεμψεν의 ‘되돌려 보내다’라는 법정 문맥이 보존되었습니다. 다만 λαμπράν을 ‘밝고 화려한’으로 두 가지 의미를 동시에 확정하기보다, 본문에서는 한 자연스러운 의미로 번역하고 다른 의미는 각주에서 제시하는 편이 원문의 어휘 범위와 모호성을 더 잘 보존합니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. ‘그러자’는 앞 문맥과의 연결에는 가능하지만 δὲ의 느슨한 전환에는 ‘그런데’가 더 중립적입니다. 각주에 영어 표현(mock honor)이 남아 있어 표준 한국어 각주로 고쳐야 합니다.
  terminology: ‘업신여기다’, ‘조롱하다’, ‘돌려보내다’는 문맥과 수난 기사에 적절합니다. ‘화려한 옷’은 ἐσθῆτα λαμπρὰν의 ‘훌륭한/눈부신 옷’이라는 폭넓은 뜻을 자연스럽게 반영하며, ‘빛나는 옷’이라는 대안은 각주로 처리합니다.
  issues:
  - severity: medium
    issue: 본문의 ‘밝고 화려한 옷’이 λαμπράν의 가능한 의미 둘을 누적하여 표현합니다.
    rationale: λαμπράν은 ‘빛나는/밝은’ 또는 ‘화려한/훌륭한’의 뜻이 가능하지만, 두 의미를 모두 본문에 병렬로 넣으면 원문보다 의미가 구체화됩니다. 본문은 ‘화려한 옷’으로 하고 다른 가능성은 각주에 두는 것이 안전합니다.
  - severity: medium
    issue: 각주에 번역되지 않은 영어 표현 ‘mock honor’가 포함되어 있습니다.
    rationale: 한국어 성경의 독자용 각주로 자연스럽지 않으며, ‘조롱하기 위해 마치 존귀한 사람처럼 꾸미는’ 등으로 한국어화해야 합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 놓여 있어 의복 어구가 아니라 ‘돌려보냈습니다’에 걸리는 것으로 읽힐 수 있습니다.
    rationale: 어휘 대안 각주는 해당 어구인 ‘화려한 옷’ 바로 뒤에 두어 앵커를 명확히 하는 것이 좋습니다.
  revised_text: 그런데 헤롯도 자기 군사들과 함께 예수님을 업신여기고 조롱했습니다. 예수님께 화려한 옷을 입힌 뒤[a] 그분을 빌라도에게 돌려보냈습니다.
  revised_footnotes:
