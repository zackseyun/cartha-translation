    text: 또는 ‘빛나는 옷’. λαμπράν은 ‘밝은, 빛나는’이라는 뜻도 있습니다. 이 옷은 예수님을 조롱하기 위해 마치 존귀한 사람처럼 꾸민 것일 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 λαμπράν이 지닌 ‘빛나는’과 ‘화려한’의 어휘적 범위를 본문과 각주로 나누어 보존했습니다. 또한 각주의 영어 혼입을 제거하고, 표지를 의복 어구 바로 뒤로 옮겨 참조 대상을 명확히 했습니다. ‘그런데 헤롯도’는 δὲ와 καὶ ὁ Ἡρῴδης가 제공하는 전환 및 ‘또한’의 뉘앙스를 자연스럽게 반영합니다.
