    rationale: πατεῖν은 ‘밟다’의 공간적·비유적 이미지이며, ‘누르다’는 억압·제압의 행위를 더 강하게 부가합니다.
  - severity: medium
    issue: 합쇼체 종결 불일치
    rationale: 초안의 ‘못할 것이다’는 평서체이므로 지정된 현대 공식-공손체에 맞게 ‘못할 것입니다’로 고쳐야 합니다.
