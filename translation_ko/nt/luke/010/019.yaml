  terminology: ἐξουσία는 ‘권세’, δύναμις는 ‘능력’으로 옮겨 두 단어의 대조를 유지했습니다. ‘뱀과 전갈’은 문맥상 가능한 비유적 함의를 본문에 덧붙이지 않고 그대로 유지했습니다.
