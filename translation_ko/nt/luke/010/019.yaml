  source_fidelity: ‘누르는’은 πατεῖν(밟다)을 과도하게 해석하므로 ‘밟고’로 고치는 것이 적절합니다. 또한 ἐξουσία(권세)와 δύναμις(능력)의 구별을 유지하여, 원수의 ‘모든 능력’을 제어할 ‘권세’라는 관계를 분명히 해야 합니다. 마지막의 οὐδὲν … οὐ μὴ ἀδικήσῃ의 강한 부정과 미래 지향성도 살렸습니다.
