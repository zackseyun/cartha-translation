translation:
  language: ko
  text: 「고라신아, 너희에게 화가 있습니다! 벳새다야, 너희에게 화가 있습니다! 너희 가운데서 일어난 능력의 일들이 두로와 시돈에서 일어났더라면, 그들은 오래전에 베옷을 입고 재 가운데 앉아 회개했을 것입니다.」
  philosophy: optimal-equivalence
