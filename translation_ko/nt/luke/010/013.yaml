  terminology: Οὐαί는 ‘화가 있습니다’로, δυνάμεις는 기적이라고 한정하지 않고 ‘능력의 일들’로, μετενόησαν는 ‘회개했을 것입니다’로 옮겨 원문의 의미 범위와 한국어 성서 용례를 함께 고려했습니다. 지명은 ‘고라신’, ‘벳새다’, ‘두로’, ‘시돈’으로 통용 표기를 유지했습니다.
