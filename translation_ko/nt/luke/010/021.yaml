- from: 바로 그때에 예수께서 성령으로 즐거워하시며 이르셨습니다. 「하늘과 땅의 주이신 아버지여, 내가 당신을 찬양합니다. 당신께서 이것들을 지혜로운 자들과 명철한 자들에게는 숨기시고 어린아이들에게는 나타내셨기 때문입니다. 그렇습니다, 아버지여, 이렇게 하시는 것이 당신 앞에 기뻐하시는 뜻이었습니다.」
  to: 바로 그때에 예수께서 성령 안에서 크게 기뻐하시며 이르셨습니다. 「하늘과 땅의 주이신 아버지여, 내가 아버지를 찬양합니다. 아버지께서 이것들을 지혜로운 자들과 명철한 자들에게는 숨기시고 어린아이들에게는 나타내셨기 때문입니다. 그렇습니다, 아버지여. 이렇게 되는 것이 아버지께서 기뻐하시는 일이었습니다.」
  rationale: 마지막 문장을 원문의 문법과 의미에 맞는 현대 합쇼체로 바로잡았습니다. ‘당신’ 대신 기도 상대를 가리키는 ‘아버지’를 반복하여 한국어 기도 문체의 자연스러움과 존칭의 일관성을 높였습니다. ‘성령 안에서 크게 기뻐하시며’는 τῷ πνεύματι τῷ ἁγίῳ와 ἠγαλλιάσατο를 보다 직접적으로 반영합니다. 영어 감사 추적의 대안들(‘감사합니다’, ‘젖먹이들/유아들’, ‘선한 뜻’)은 가능한 번역 선택지이나, 이 본문에 별도 각주를 의무화할 정도의 구조적 또는 의미상 결함은 아닙니다.
