- from: 그러나 주께서 그녀에게 대답하여 이르셨습니다. 「마르다야, 마르다야, 너는 많은 일로 염려하며 분주하구나.」
  to: 그러나 주께서 마르다에게 대답하여 말씀하셨습니다. “마르다, 마르다, 당신은 많은 일로 염려하고 마음이 어지럽습니다.”
  rationale: ‘분주하다’가 낳는 활동량 중심의 의미를 피하고, 원문의 내적 염려(μεριμνᾷς)와 동요(θορυβάζῃ)를 각각 ‘염려하고’와 ‘마음이 어지럽습니다’로 옮겼습니다. 대화문을 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:24Z'
review_pass:
  verdict: revise
  source_fidelity: ‘분주하구나’는 θορυβάζῃ의 ‘마음이 동요하다/괴로워하다’라는 뜻을 ‘바쁘게 움직이다’로 바꾸므로 적절하지 않습니다. μεριμνᾷς와 θορυβάζῃ의 구별은 ‘염려하고 마음이 어지럽습니다’로 보존했습니다. ἀποκριθεὶς ... εἶπεν은 ‘대답하여 말씀하셨습니다’로 자연스럽게 옮겼습니다.
  naturalness: ‘그녀에게’와 반말 종결 ‘하구나’는 요청된 현대 표준어 합쇼체와 잘 맞지 않습니다. 문맥상 지시 대상이 분명하므로 ‘마르다에게’로 하고, 인용문도 합쇼체로 다듬었습니다.
  terminology: κύριος는 본문의 서술상 예수의 칭호인 ‘주’로 유지했습니다. ‘마르다’는 통용 한국어 성서 표기를 따랐습니다.
  issues:
  - severity: high
    issue: ‘분주하구나’
    rationale: θορυβάζῃ는 단순히 바쁘거나 분주한 상태가 아니라, 여러 일 때문에 마음이 동요하고 괴로워하는 상태를 가리킵니다.
  - severity: medium
    issue: 인용문의 종결 ‘하구나’
    rationale: 지정된 현대 formal-polite 합쇼체와 일치하지 않습니다.
  - severity: low
    issue: ‘그녀에게’
    rationale: 문맥상 마르다가 명확하므로 이름을 반복하는 편이 현대 한국어 성서 문장으로 더 자연스럽습니다.
  revised_text: 그러나 주께서 마르다에게 대답하여 말씀하셨습니다. “마르다, 마르다, 당신은 많은 일로 염려하고 마음이 어지럽습니다.”
