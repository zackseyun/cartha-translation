id: LUK.10.42
reference: Luke 10:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
  footnotes:
  - marker: a
    text: Or, 'only one thing is necessary.' The Greek can also be understood more specifically in the meal setting as 'few dishes are needed—or only one.'
    reason: alternative_reading
  - marker: b
    text: Or, 'the good part.' 'Portion' may intentionally echo both a meal portion and a figurative share in what is truly valuable.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그러나 필요한 것은 몇 가지, 아니면 하나입니다[a]. 마리아는 좋은 몫[b]을 택했습니다. 그 몫은 마리아에게서 빼앗기지 않을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘한 가지만 필요합니다.’ 그리스어는 식사 준비라는 문맥에서 ‘몇 가지 음식이면 충분하며, 아니면 한 가지면 된다’라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘좋은 부분.’ ‘몫’은 식사의 몫과 참으로 가치 있는 것에 대한 비유적 몫을 함께 암시할 수 있습니다.
    reason: lexical_alternative
