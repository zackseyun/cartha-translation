  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
  footnotes:
  - marker: a
    text: Or 'its public squares' or 'its broad streets.' The Greek πλατείας refers to open, public thoroughfares.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그러나 어느 성읍에 들어가든지 그들이 여러분을 영접하지 않으면, 그 성읍의 거리[a]로 나가서 말하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “넓은 거리” 또는 “공공 광장”. 그리스어 πλατεῖαι는 사람들이 드나드는 넓고 열린 공공 장소나 거리를 가리킬 수 있습니다.
    reason: πλατεῖαι의 ‘거리’ 외의 공공·개방 공간이라는 어휘적 뉘앙스를 보존합니다.
