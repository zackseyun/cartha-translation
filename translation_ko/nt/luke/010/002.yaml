  verdict: revise
  source_fidelity: The draft correctly conveys the plentiful harvest, few workers, prayer to the harvest's Lord, and the movement of workers into his harvest. However, the clause '그가 ... 보내시도록' has an inconsistent honorific construction, and '보내다' alone does not preserve the marked outward/forceful nuance of ἐκβάλῃ as well as '내보내다.'
  naturalness: The revision uses natural modern formal-polite Korean consistently. '말씀하셨습니다' is appropriate for Jesus' speech in this register, and the direct imperative is rendered as '기도하십시오.'
  terminology: '''추수,'' ''일꾼,'' and ''추수의 주인'' are clear, established, and source-faithful. ''내보내시도록'' retains the honorific appropriate to ''추수의 주인'' without making an interpretive identification of that title.'
  issues:
  - severity: medium
    issue: Honorific mismatch in '그가 일꾼들을 자기의 추수에 보내시도록'
    rationale: The non-honorific pronoun '그가' combined with honorific '-시-' is stylistically and grammatically awkward in Korean. Recasting the clause with '추수의 주인께서' resolves this without altering meaning.
  - severity: low
    issue: The stronger nuance of ἐκβάλῃ is not represented or footnoted
    rationale: Although 'send' is possible in context, ἐκβάλλω can have a more forceful sense. '내보내다' better reflects the outward movement, and a footnote preserves the lexical nuance without making the main text unnatural.
