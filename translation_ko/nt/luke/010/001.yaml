  source_fidelity: 원문의 ἑβδομήκοντα δύο는 ‘일흔두’로 옮겨졌고, 둘씩 보내신 행동 및 주님이 친히 가실 장소라는 기본 의미도 대체로 반영되었습니다. 그러나 ‘자기보다 앞서’는 비교 표현으로 읽혀 πρὸ προσώπου αὐτοῦ(그분보다 앞서/그분에 앞서)의 뜻을 부자연스럽고 부정확하게 전달합니다. 또한 사본 이문에 대한 각주가 본문에 없습니다.
  naturalness: ‘이 후에’보다 ‘이 일 후에’가 현대 표준어 띄어쓰기와 원문의 복수 지시 표현을 더 잘 반영합니다. ‘둘씩 둘씩’은 한국어에서 다소 어색하므로 ‘둘씩 짝지어’가 자연스럽습니다. 주님을 가리키며 ‘자기가’라고 하는 것은 높임 문체의 일관성을 해치므로 ‘주님께서 친히’로 명시하는 편이 적절합니다.
  terminology: κύριος는 문맥상 ‘주님’으로, ἀνέδειξεν은 파송을 위한 지정이라는 의미가 드러나도록 ‘세우시고’로 옮겼습니다. ‘성읍과 곳’은 πόλις와 τόπος의 두 명사를 보존합니다. 본문은 SBLGNT의 ‘일흔두 사람’을 따르고, ‘일흔’ 이문은 각주로 보존해야 합니다.
