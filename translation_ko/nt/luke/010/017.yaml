  to: 일흔두 사람이[a] 기뻐하며 돌아와 말하였습니다. “주님, 귀신들까지도 주님의 이름으로 우리에게 복종합니다.”
  rationale: 본문은 SBLGNT의 ‘일흔두’를 유지하고, 유의미한 ‘일흔’ 이문을 각주로 명시했습니다. ‘주님의 이름으로’는 불필요한 대조 표지를 피하면서 원문의 전치사구를 충실하게 반영합니다. ‘복종합니다’는 귀신들이 제자들에게 복종한다는 현재적 의미를 자연스러운 합쇼체로 전달합니다.
  reviewer_model: gpt-5.6-terra
