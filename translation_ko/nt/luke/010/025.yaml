  source_fidelity: 초안은 νομικός를 ‘율법사’로, ἀνέστη를 ‘일어나’로, Διδάσκαλε를 ‘선생님’으로 적절히 옮겼습니다. 그러나 κληρονομήσω의 ‘상속받다’라는 비유를 ‘얻다’로 평면화했으므로 수정이 필요합니다. 또한 ἐκπειράζων은 단순 결과 연결인 ‘시험하여’보다 목적·의도를 드러내는 ‘시험하려고’가 문맥과 헬라어 참여사에 더 충실합니다.
  naturalness: ‘그런데 보십시오’는 καὶ ἰδού의 주의 환기 기능을 현대 표준어 합쇼체 안에서 유지합니다. ‘율법학자’와 ‘상속받겠습니까?’는 자연스럽고, 인용문의 높임말도 일관됩니다.
  terminology: νομικός는 현대 민사 변호사를 뜻하는 것으로 오해되지 않도록 ‘율법학자’로 옮기고 주석에서 모세 율법 전문성을 밝힙니다. ζωὴ αἰώνιος는 통용되는 신학 용어인 ‘영생’으로 유지하며, κληρονομέω는 ‘상속받다’로 보존합니다.
