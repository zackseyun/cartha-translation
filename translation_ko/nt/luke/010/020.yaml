  to: 「그러나 영들이 너희에게 복종한다고 해서 기뻐하지 마십시오. 오히려 너희의 이름이 하늘에 기록되어 있다는 사실을 기뻐하십시오.」
  rationale: 합쇼체로 통일하고, 원문의 ‘이 일로 기뻐하지 말라 … 너희 이름이 기록되어 있다는 것으로 기뻐하라’라는 대조를 자연스러운 한국어로 재구성했습니다. ‘영들’을 유지하여 원문의 포괄성을 보존했으며, ‘기록되어 있다’로 완료 수동의 결과 상태를 반영했습니다.
  reviewer_model: gpt-5.6-terra
