review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 의미는 대체로 보존되어 있습니다. 다만 ‘영들이 너희에게 굴복하는 이것으로’는 ἐν τούτῳ와 ὅτι절의 관계를 한국어에서 부자연스럽게 처리합니다. ‘영들이 너희에게 복종한다고 해서’로 옮기면 ‘그 사실 때문에’라는 뜻이 명확해집니다. ἐγγέγραπται의 완료 수동은 ‘기록되어 있다’로, 기록된 결과가 현재 유효함을 자연스럽게 나타낼 수 있습니다. 복수형 οὐρανοῖς는 한국어 관용상 ‘하늘에’로 옮기되, 단수로 한정하는 뜻은 아닙니다.
  naturalness: 초안은 ‘이것으로 기뻐하지 말고’와 ‘기록된 것으로 기뻐하라’가 현대 표준 한국어 문장으로 다소 어색하며, 명령형 ‘말고/하라’는 요청된 합쇼체와 일치하지 않습니다. 수정문은 현대적이고 자연스러운 합쇼체를 사용합니다.
  terminology: πνεύματα는 본문에서 ‘영들’로 유지하여 ‘귀신들’ 또는 ‘악한 영들’로 과도하게 구체화하지 않았습니다. ὑποτάσσεται는 문맥에 맞게 ‘복종하다’로 옮겼습니다. ‘하늘’은 한국어 성경적 관용에 따른 표현이며, 원문의 복수형을 신학적으로 단수화하려는 의도는 아닙니다.
  issues:
  - severity: medium
    issue: 요청된 합쇼체 불일치
    rationale: 초안의 ‘기뻐하지 말고’와 ‘기뻐하라’는 해라체이므로 현대 정중체(합쇼체)인 ‘기뻐하지 마십시오/기뻐하십시오’로 바꾸어야 합니다.
  - severity: medium
    issue: 인과·대조 구문의 부자연스러움
    rationale: ‘영들이 너희에게 굴복하는 이것으로’는 한국어에서 어색하고 ὅτι절이 제시하는 기쁨의 근거를 흐립니다. ‘…한다고 해서’가 원문의 의미와 문장 흐름을 더 정확히 전달합니다.
  - severity: low
    issue: 완료 수동 표현의 자연스러움
    rationale: ‘기록된 것으로’보다 ‘기록되어 있다는 사실을’이 ἐγγέγραπται가 나타내는 기록의 지속적 효력을 자연스럽게 드러냅니다.
