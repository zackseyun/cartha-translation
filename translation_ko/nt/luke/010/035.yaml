  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
  footnotes:
  - marker: a
    text: A denarius was a standard Roman silver coin, roughly a day's wage for a laborer.
    reason: cultural_note
translation:
  language: ko
  text: 다음 날, 그는 두 데나리온[a]을 꺼내 여관 주인에게 주고 말하였습니다. “이 사람을 돌보아 주십시오. 그 밖에 더 드는 비용은 무엇이든, 내가 돌아올 때에 갚아 드리겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 로마의 표준 은화로, 노동자 하루 품삯 정도에 해당했습니다.
    reason: cultural_note
