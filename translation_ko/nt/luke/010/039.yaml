  - severity: low
    issue: The phrase repeats “마리아” immediately after introducing her.
    rationale: Using “그 자매도” gives a smoother Korean sentence without omitting any source content.
  revised_text: 그녀에게는 마리아라는 자매가 있었는데, 그 자매도 예수님의 발치에 앉아 그의 말씀을 듣고 있었습니다.
