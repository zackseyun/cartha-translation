  verdict: revise
  source_fidelity: SBLGNT reads τοῦ Ἰησοῦ (“of Jesus”), whereas the draft renders this as “주의” (“the Lord’s”). The personal name should be retained. The imperfect ἤκουεν is well represented by the progressive “듣고 있었습니다.”
