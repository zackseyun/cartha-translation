translation:
  language: ko
  text: 「내가 너희에게 말합니다. 그날[a]에는 소돔 사람들에게는 그 성읍보다 더 견디기 쉬울 것입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그날’은 하나님의 심판의 날을 가리킵니다. 몇몇 평행 구절에서는 이를 분명히 말합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘더 견딜 만할 것입니다.’ 그리스어 비교급 ἀνεκτότερον은 어느 쪽으로도 옮길 수 있습니다.
