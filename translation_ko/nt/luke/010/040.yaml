  - severity: medium
    issue: ‘분주하였습니다’는 περιεσπᾶτο의 ‘마음이 여러 일로 끌려가다/빼앗기다’라는 의미를 충분히 드러내지 못합니다.
    rationale: 문맥상 단순히 일이 많았다는 뜻보다 많은 섬김 때문에 주의가 분산된 지속 상태를 나타냅니다.
  - severity: low
    issue: ‘시중드는 일’은 현대어에서 다소 어색하고 대상에 수발을 드는 뉘앙스를 낼 수 있습니다.
    rationale: 가정에서의 πρακτική διακονία를 ‘섬기는 일’로 표현하면 자연스럽고 원문의 범위를 유지합니다.
