  text: 「너희에게 귀 기울이는 사람은 내게 귀 기울이는 것입니다. 너희를 거부하는 사람은 나를 거부하는 것이며, 그러나 나를 거부하는 사람은 나를 보내신 분을 거부하는 것입니다.」
  philosophy: optimal-equivalence
