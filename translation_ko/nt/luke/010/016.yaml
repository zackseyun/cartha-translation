  source_fidelity: 초안의 ‘너희의 말을/내 말을 듣는’은 헬라어가 반복하는 인칭 목적어(‘너희/나’)를 ‘말’로 명시하여 범위를 좁힙니다. 또한 ‘저버리다’도 가능하나, 여기서는 반복되는 ἀθετέω의 개인적 거부를 ‘거부하다’로 일관되게 옮기는 것이 더 직접적입니다.
  naturalness: ‘너희에게/내게 귀 기울이다’는 한국어에서 사람을 대상으로 자연스럽게 쓰이며, 인칭 대상을 유지합니다. 합쇼체 종결도 갖추었습니다.
  terminology: ‘나를 보내신 분’은 원문의 암시적 지시 대상을 유지하며 ‘아버지’ 등으로 해설하지 않습니다. ‘거부하다’는 ἀθετέω의 문맥상 의미를 자연스럽게 전달합니다.
