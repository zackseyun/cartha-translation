- from: 「너희의 말을 듣는 자는 내 말을 듣는 것이요, 너희를 저버리는 자는 나를 저버리는 것이며, 나를 저버리는 자는 나를 보내신 분을 저버리는 것이다.」
  to: 「너희에게 귀 기울이는 사람은 내게 귀 기울이는 것입니다. 너희를 거부하는 사람은 나를 거부하는 것이며, 그러나 나를 거부하는 사람은 나를 보내신 분을 거부하는 것입니다.」
  rationale: 인칭 대상을 ‘말’로 바꾸지 않고 유지하기 위해 ‘귀 기울이다’를 사용했습니다. 마지막 절의 δέ는 영어 감사본의 ‘but’를 따라 ‘그러나’로 드러냈으며, ‘보내신 분’의 지시 대상은 원문처럼 명시하지 않았습니다.
