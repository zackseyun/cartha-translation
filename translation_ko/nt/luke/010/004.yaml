source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
  footnotes:
  - marker: a
    text: Or, 'greet no one on the way.' The sense is likely not a ban on ordinary courtesy, but an urgency that leaves no room for time-consuming social greetings customary in that culture.
    reason: cultural_note
  - marker: b
    text: '''Travel bag'' could also be rendered ''knapsack'' or simply ''bag.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 전대[1]도 자루[2]도 신발도 지니지 말고, 길에서 아무에게도 인사하지 마십시오.[3]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: '전대: 돈을 넣어 지니는 주머니.'
    reason: lexical clarification for βαλλάντιον
  - marker: '2'
    text: '자루: 여행 중 물품이나 양식을 넣는 가방. ‘배낭’ 또는 ‘여행용 가방’으로도 옮길 수 있습니다.'
    reason: lexical alternative for πήρα
  - marker: '3'
    text: 당시 길에서 주고받는 인사는 오래 이어질 수 있었습니다. 그러나 본문은 이를 완화하지 않고 직접적인 금지 명령으로 표현합니다.
    reason: cultural note anchored to ἀσπάσησθε
