review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘떨어 버린다’는 ἀπομασσόμεθα(닦아 내다/닦아 떼다)의 의미를 충분히 반영하지 못하며, ‘너희에게’는 문맥상 대적·증언의 방향을 분명히 하는 편이 좋습니다. ἤγγικεν의 완료형은 ‘가까이 왔습니다’로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘우리 발에 묻은 먼지조차 우리가 너희에게 떨어 버린다’는 어순과 서술어 결합이 현대 한국어에서 다소 부자연스럽습니다. ‘우리 발에 달라붙은 먼지까지도 … 닦아 버립니다’가 더 명료하고 합쇼체에도 맞습니다.
  terminology: ‘하나님의 나라’는 ἡ βασιλεία τοῦ θεοῦ에 대한 표준적이고 자연스러운 번역입니다. ‘성읍’도 본문의 πόλις에 적합합니다.
  issues:
  - severity: medium
    issue: ἀπομασσόμεθα의 번역
    rationale: ‘떨어 버린다’는 먼지를 의도적으로 닦아 떼어 내는 동작을 충분히 나타내지 못합니다. ‘닦아 버립니다’는 어휘적 의미를 더 가깝게 반영합니다.
  - severity: low
    issue: ὑμῖν의 문맥적 방향
    rationale: 이 여격은 단순 수여보다 거절한 이들을 향한 상징적 행위의 방향을 나타냅니다. ‘너희를 향하여’가 이를 자연스럽게 드러냅니다.
  - severity: low
    issue: 대괄호 처리된 εἰς τοὺς πόδας
    rationale: SBLGNT에서 해당 어구는 대괄호로 표시되어 있으므로, 본문에는 번역하되 일부 사본의 생략 가능성을 각주로 밝혀 본문 비평상의 불확실성을 보존하는 것이 안전합니다.
