  source_fidelity: 개정이 필요합니다. 「마침」은 문맥상 우연한 만남을 나타낼 수 있으나 시간적 ‘때마침’의 뉘앙스도 강합니다. κατὰ συγκυρίαν의 ‘우연히/공교롭게’라는 의미는 「우연히」가 더 직접적입니다. 또한 미완료 과거 κατέβαινεν의 진행성을 「내려가고 있었습니다」로 반영하는 것이 적절합니다. ἀντιπαρῆλθεν은 반대편으로 지나간 행동을 나타내므로 「그 길 반대편으로 지나갔습니다」가 충실합니다.
  naturalness: 「우연히 한 제사장이 그 길을 따라 내려가고 있었는데」는 현대 표준 한국어의 자연스러운 서술이며, 합쇼체 종결도 일관됩니다. 「그를 보고는」은 선행 행동 뒤의 결과를 매끄럽게 연결합니다.
  terminology: ἱερεύς는 「제사장」으로 정확합니다. 본문에는 별도의 신학 용어상 문제가 없습니다.
