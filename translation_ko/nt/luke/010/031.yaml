    rationale: 「마침」은 우연의 뜻도 가능하지만 ‘바로 그때’라는 시간적 적시성이나 상황상 알맞음의 뉘앙스를 낼 수 있습니다. κατὰ συγκυρίαν의 우연성을 명료하게 보존하려면 「우연히」가 안전합니다.
  - severity: medium
