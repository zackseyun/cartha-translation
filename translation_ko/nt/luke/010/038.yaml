review_pass:
  verdict: revise
  source_fidelity: ‘자기 집에’는 헬라어 본문에 명시되어 있지 않으므로 삭제해야 합니다. 또한 εἰσῆλθεν은 단순 서술인데 ‘들어가시니’는 뒤 절과의 시간적·결과적 연결을 더하므로 독립된 문장으로 옮기는 것이 더 충실합니다. ὑπεδέξατο의 손님으로 맞이하는 뜻은 ‘맞아들였습니다’로 자연스럽게 드러납니다.
  naturalness: ‘그들이 길을 가고 있을 때’와 ‘마르다라는 한 여자가 예수님을 맞아들였습니다’는 현대 표준어 합쇼체에서 자연스럽고 서사 흐름도 분명합니다.
  terminology: ‘예수님’ 및 높임 종결 표현은 한국어 성경 문체에 적절합니다. ‘영접하였습니다’보다 ‘맞아들였습니다’가 이 문맥의 환대 의미를 더 일상적이고 정확하게 전달합니다.
  issues:
  - severity: high
    issue: ‘자기 집에’라는 장소·소유 표현의 첨가
    rationale: 원문은 마르다가 예수를 손님으로 받아들였다고만 말하며, ‘집’이나 ‘자기’에 해당하는 말은 없습니다.
  - severity: medium
    issue: ‘들어가시니’의 종속 연결
    rationale: 원문의 두 동사는 서술적으로 이어집니다. ‘-시니’는 원문에 없는 시간적 또는 결과적 관계를 암시할 수 있습니다.
  - severity: low
    issue: ‘영접하였습니다’의 문체 및 의미 범위
    rationale: 틀린 번역은 아니지만, 현대 한국어에서는 종교적·의례적 뉘앙스가 강할 수 있습니다. 손님으로 환대했다는 ὑπεδέξατο의 문맥에는 ‘맞아들였습니다’가 더 직접적입니다.
  revised_text: 그들이 길을 가고 있을 때, 예수께서는 어떤 마을에 들어가셨습니다. 마르다라는 한 여자가 예수님을 맞아들였습니다.
