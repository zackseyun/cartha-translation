  to: 그들이 길을 가고 있을 때, 예수께서는 어떤 마을에 들어가셨습니다. 마르다라는 한 여자가 예수님을 맞아들였습니다.
  rationale: 원문이 말하지 않는 ‘자기 집에’를 제거하고, 두 사건을 원문의 서술 흐름에 맞게 분리했습니다. ‘맞아들였습니다’는 마르다가 예수를 손님으로 환대했다는 동사의 의미를 보존하면서도 현대적이고 자연스럽습니다.
