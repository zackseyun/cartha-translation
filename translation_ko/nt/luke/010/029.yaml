  source_fidelity: 원문의 δὲ는 문맥상 대조·전환을 나타내므로 “그러나”로 옮길 수 있습니다. θέλων δικαιῶσαι ἑαυτόν은 자신이 옳다는 것을 드러내거나 정당화하려는 의도를 뜻하므로, “자신을 옳게 보이려고”가 자연스럽고 문맥에 맞습니다. 질문의 πλησίον은 “이웃”으로 유지했습니다.
  naturalness: 초안의 “자기를 옳다 하고자 하여”는 현대 한국어에서 다소 부자연스럽고 의미도 불명료할 수 있습니다. “자신을 옳게 보이려고”로 고치면 합쇼체 서술과 자연스럽게 어울립니다.
  terminology: Ἰησοῦς는 표준적으로 “예수”로, πλησίον은 인접 문맥의 율법 인용과의 연결을 보존하는 “이웃”으로 옮겼습니다. δικαιῶσαι는 기술적 교리 용어로 과도하게 한정하지 않고 문맥적 의미를 드러냈습니다.
