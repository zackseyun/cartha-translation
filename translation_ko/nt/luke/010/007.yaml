  naturalness: 초안의 ‘먹고 마시라’, ‘말라’는 현대 표준어 합쇼체 요청과 맞지 않습니다. ‘먹고 마십시오’, ‘마십시오’가 현대의 격식 있고 자연스러운 명령형입니다. ‘이 집 저 집’도 가능하나 ‘이 집에서 저 집으로’가 이동·숙소 변경의 관계를 더 분명히 합니다.
  terminology: ἐργάτης는 ‘일꾼’, μισθός는 ‘삯’으로 옮길 수 있으며 문맥에 잘 맞습니다. ‘자기 삯을 받을 만합니다’는 원문의 자격/마땅함을 유지하면서 한국어로 자연스럽습니다. 별도의 신학 용어 또는 교파적 해석은 개입되지 않았습니다.
