translation:
  language: ko
  text: 「그곳에 평화의 사람이 있으면, 너희의 평화가 그에게 머무를 것입니다. 그러나 그렇지 않으면, 그 평화가 너희에게 돌아올 것입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘평화의 아들’입니다. 평화로 특징지어지거나 평화의 메시지를 받아들이는 사람을 가리키는 표현입니다.
    reason: υἱὸς εἰρήνης의 셈어적 관용구와 본문의 자연스러운 번역 사이의 의미 범위를 제시합니다.
