  source_fidelity: 초안의 조건문, 평화가 머무르고 되돌아온다는 기본 의미는 원문과 일치합니다. 그러나 υἱὸς εἰρήνης를 ‘평안의 사람’으로 옮긴 표현은 현대 한국어에서 부자연스럽고, 원문의 셈어적 관용구 및 영어 감사 기록의 대안 의미를 밝혀 주는 주석이 필요합니다. ἐπ’ αὐτόν은 한국어에서 자연스럽게 ‘그에게’로 옮겼으며, 평화가 되돌아오는 대상을 명시하여 ἀνακάμψει의 주어를 분명히 했습니다.
  naturalness: ‘평화의 사람’은 ‘평안의 사람’보다 현대 표준어에서 더 자연스럽고, ‘그에게 머무를 것입니다/너희에게 돌아올 것입니다’는 합쇼체 문체와 한국어 어법에 맞습니다. ‘그 위에’는 사람을 가리키는 문맥에서 다소 직역투이므로 고쳤습니다.
  terminology: εἰρήνη는 이 구절에서 제자들이 전하는 평화의 인사·복을 가리키지만, 원문의 소유 표현을 보존하여 ‘너희의 평화’로 유지했습니다. υἱὸς εἰρήνης의 남성 단수 관용구는 본문에서 ‘평화의 사람’으로 자연스럽게 옮기고, 주석에서 직역과 ‘평화를 받아들이는 사람’이라는 의미를 제시하여 해석을 단정하지 않았습니다.
