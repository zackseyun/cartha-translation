  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 두 개의 독립 의문문을 접속형으로 묶었고, δεύτε인칭 표현과 종결형이 요청된 현대 합쇼체와 맞지 않습니다. δεύτε 질문의 ἀναγινώσκεις는 직역 ‘읽다’를 본문에 유지하되, 문맥상 해석의 뉘앙스는 주석으로 보완하는 것이 적절합니다.
  naturalness: ‘예수께서 그에게 이르셨습니다’는 자연스럽지만, 인용문 안의 ‘너는 … 읽느냐?’는 현대 formal-polite 합쇼체가 아닙니다. 주어를 생략하고 ‘어떻게 읽습니까?’로 옮기면 자연스럽고 원문의 단수 직접 질문도 문맥상 유지됩니다.
  terminology: ‘율법’은 여기서 인정된 이스라엘의 성경적 율법을 가리키므로 적절합니다. ‘무엇이라 기록되었으며’보다 ‘무엇이라고 기록되어 있습니까?’가 현대 한국어에 자연스럽고 γέγραπται의 기록된 상태를 잘 반영합니다.
