  naturalness: 서술문은 합쇼체이나 인용문은 해라체·고어체가 섞여 있습니다. 인용문도 현대적인 합쇼체로 통일하는 편이 자연스럽습니다.
  terminology: ‘바르게 대답하셨습니다’, ‘행하십시오’, ‘사실 것입니다’는 각각 Ὀρθῶς ἀπεκρίθης, τοῦτο ποίει, καὶ ζήσῃ를 과도한 신학적 보충 없이 반영합니다. ζήσῃ를 ‘영생을 얻을 것입니다’로 확장하지 않았습니다.
