  text: 그분께서 말씀하셨습니다. “미혹되지 않도록 주의하십시오. 많은 사람이 내 이름으로 와서 ‘내가 그 사람이다’[a], 또 ‘때가 가까이 왔다’고 말할 것입니다. 그들을 따라가지 마십시오.”
  philosophy: optimal-equivalence
