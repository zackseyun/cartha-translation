  source_fidelity: 핵심 의미는 대체로 충실하나, 「내가 그라」는 현대 표준 한국어로 부자연스럽고 원문의 타원적 자기-identification을 적절히 전달하지 못합니다. 또한 인용부호가 닫히지 않았습니다.
  naturalness: 합쇼체의 권면과 명령은 적절합니다. 다만 「그라」는 현대 문어에서도 매우 비자연스러우므로 「내가 그 사람이다」로 고치는 것이 안전합니다. 「그들 뒤를 따라가지」보다 「그들을 따라가지」가 자연스럽고 뜻도 유지합니다.
  terminology: 「미혹되다」, 「내 이름으로」, 「때가 가까이 왔다」는 문맥과 신약 한국어 용례에 잘 맞습니다. ἐγώ εἰμι의 암시된 대상을 본문에서 ‘그 사람’으로만 표현하고, 메시아라고 단정하지 않도록 각주로 대안을 보존합니다.
