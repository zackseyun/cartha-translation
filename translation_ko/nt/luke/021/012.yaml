review_pass:
  verdict: revise
  source_fidelity: 전체적인 사건 순서와 박해·인도·재판의 의미는 잘 전달합니다. 다만 ἕνεκεν τοῦ ὀνόματός μου는 수단을 나타내기 쉬운 ‘내 이름으로 인하여’보다 원인/이유를 분명히 하는 ‘내 이름 때문에’가 더 정확합니다. 또한 ἀπαγομένους는 여러분이 ‘끌려가는’ 수동적 처지를 나타내므로 이를 본문에서 드러내는 편이 좋습니다.
  naturalness: 현대 표준어 합쇼체로 대체로 자연스럽습니다. ‘회당과 감옥에 넘겨주고’는 제도·당국에 넘긴다는 문맥에서 자연스럽습니다. 마지막 절을 수동형으로 조정하면 원문의 관점도 더 또렷해집니다.
  terminology: ‘박해’, ‘회당’, ‘감옥’, ‘왕들’, ‘총독들’은 적절합니다. ‘내 이름 때문에’는 예수의 ‘이름’이라는 성서적 표현을 보존하면서도 ἕνεκεν의 인과 관계를 정확히 나타냅니다.
  issues:
  - severity: medium
    issue: ‘내 이름으로 인하여’의 의미 범위
    rationale: 한국어 ‘~으로 인하여’는 문맥상 원인을 뜻할 수도 있으나, ‘내 이름으로’가 수단·권위를 뜻하는 것으로도 읽힐 수 있습니다. ἕνεκεν은 여기서 ‘~ 때문에/말미암아’라는 이유를 나타냅니다.
  - severity: low
    issue: ἀπαγομένους의 수동성
    rationale: 원문은 여러분이 왕들과 총독들 앞에 ‘끌려가는’ 수동 분사입니다. ‘끌고 갈 것입니다’도 행위자 면에서는 가능하지만, 수동적 처지를 드러내는 번역이 더 가깝습니다.
  revised_text: 그러나 이 모든 일이 있기 전에, 그들이 여러분에게 손을 대어 박해할 것이며, 여러분을 회당과 감옥에 넘겨주고, 여러분은 내 이름 때문에 왕들과 총독들 앞으로 끌려갈 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘여러분을 붙잡을 것입니다.’ 직역하면 ‘여러분에게 손을 댈 것입니다’이며, 적대적으로 붙잡거나 해치는 일을 뜻하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 이름 때문에’는 ‘내 이름을 위하여’ 또는 더 풀이하여 ‘나 때문에’로도 옮길 수 있습니다. 본문은 예수님의 인격과 권위를 가리키는 성서적 표현인 ‘내 이름’을 보존합니다.
    reason: alternative_reading
  revision_rationale: '원문의 시간적 우선성, 박해와 인도의 연쇄를 유지했습니다. ‘내 이름 때문에’로 ἕνεκεν의 인과 의미를 명확히 하고, ‘끌려갈 것입니다’로 수동 분사의 관점을 보존했습니다. 각주 표지는 각각 해당 표현 뒤에 배치해야 합니다: ‘손을 대어[a]’, ‘내 이름 때문에[b]’.'
