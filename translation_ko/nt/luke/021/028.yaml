review_pass:
  verdict: revise
  source_fidelity: The draft conveys the temporal condition, the two imperatives, and the causal assurance. However, the final stray closing quotation mark is erroneous, and '일어서서' is less precise for ἀνακύψατε, which specifically evokes straightening or raising oneself up.
  naturalness: '''여러분의 머리를 드십시오'' is understandable but unnatural in contemporary Korean. ''고개를 드십시오'' is the idiomatic Korean expression. ''가까이 오기 때문입니다'' can be improved to the progressive ''가까워지고 있기 때문입니다'' for ἐγγίζει.'
  terminology: '''구속'' can function as a theological term, but ''속량'' is the more direct established Korean equivalent for ἀπολύτρωσις in this context and avoids the common non-theological sense of arrest or detention associated with ''구속.'''
  issues:
  - severity: medium
    issue: The text ends with an unmatched closing quotation mark (」).
    rationale: This is an editorial/structural defect not represented in the Greek source.
  - severity: low
    issue: '''일어서서'' does not fully reflect ἀνακύψατε.'
    rationale: The verb denotes straightening oneself up or raising oneself; '몸을 일으켜' retains this bodily image naturally.
  - severity: low
    issue: '''여러분의 머리를 드십시오'' is unidiomatic Korean.'
    rationale: Korean naturally expresses this image as '고개를 드십시오,' while retaining the imperative to lift one's head.
  - severity: low
    issue: '''가까이 오기 때문입니다'' underrepresents the present-process sense of ἐγγίζει.'
    rationale: '''가까워지고 있기 때문입니다'' naturally conveys that the redemption is drawing near.'
  revised_text: 그러나 이런 일들이 일어나기 시작하면, 몸을 일으켜 고개를 드십시오. 여러분의 속량이 가까워지고 있기 때문입니다.
