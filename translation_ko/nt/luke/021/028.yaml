revisions:
- from: 그러나 이것들이 일어나기 시작할 때에, 일어서서 여러분의 머리를 드십시오. 이는 여러분의 구속이 가까이 오기 때문입니다.」
  to: 그러나 이런 일들이 일어나기 시작하면, 몸을 일으켜 고개를 드십시오. 여러분의 속량이 가까워지고 있기 때문입니다.
  rationale: The revision removes the stray punctuation, renders ἀνακύψατε and ἐπάρατε τὰς κεφαλὰς with natural Korean bodily imagery, preserves the temporal and causal syntax, and uses the established theological term '속량' for ἀπολύτρωσις without adding an interpretive explanation.
