  source_fidelity: 원문의 ἐν τῇ ὑπομονῇ ὑμῶν을 수단을 나타내는 ‘여러분의 인내로’로, κτήσασθε(부정과거 중간 명령형)를 합쇼체 명령 ‘얻으십시오’로 충실히 옮겼습니다. ψυχὰς는 이 문맥에서 가능한 ‘생명’으로 번역하여 원문의 포괄성을 크게 훼손하지 않습니다.
  naturalness: ‘여러분의 인내로 여러분의 생명을 얻으십시오’는 현대 표준 한국어 합쇼체로 문법적이며 의미가 분명합니다. 반복된 ‘여러분의’는 원문의 두 소유격을 드러내며 과도하게 부자연스럽지 않습니다.
  terminology: ‘인내’는 ὑπομονή의 시련 가운데 굳게 견딤이라는 뜻에 적절합니다. ‘생명’은 ψυχή를 영혼으로 한정하지 않으면서 문맥상 생명/자기 보전의 폭을 유지합니다. 교파적 해석을 덧붙이지 않았습니다.
