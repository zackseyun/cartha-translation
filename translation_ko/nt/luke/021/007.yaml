  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
  footnotes:
  - marker: a
    text: Or 'what is the sign when these things are going to happen?' The Greek verb may be rendered more generally than 'are about to.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 그분께 물었습니다. 「선생님, 그러면 이런 일들이 언제 일어나겠으며, 이런 일들이 일어나려 할 때에[a] 무슨 표적이 있겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이런 일들이 일어날 때에’. 그리스어 동사는 ‘일어나려 할’보다 더 일반적으로 번역될 수도 있습니다.
    reason: μέλλῃ의 임박성을 살린 본문 번역과, 더 일반적인 미래 발생으로 이해할 수 있는 번역 가능성을 함께 제시합니다.
