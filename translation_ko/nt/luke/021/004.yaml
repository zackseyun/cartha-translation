source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
  footnotes:
  - marker: a
    text: Or 'the offerings.' The Greek says 'the gifts,' referring to donated gifts in the temple context.
    reason: lexical_alternative
  - marker: b
    text: Or 'out of her poverty' or 'out of her need.'
    reason: lexical_alternative
  - marker: c
    text: Or 'all her living' or 'her whole means of living'; not 'all her life' in the sense of her entire existence.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 사람은 자기들의 넉넉한 데서 헌금함에 넣었지만[a], 이 여자는 자기의 궁핍한 데서 자기가 가진 모든 생활비를 넣었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예물들에’ 또는 ‘헌물들에’입니다. 여기서는 성전에서 바치는 헌금의 문맥을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생활비’는 생계를 유지하는 데 쓰는 모든 수단을 뜻합니다. 단순히 ‘평생’ 또는 생물학적 생명 전체를 뜻하는 말은 아닙니다.
    reason: lexical_alternative
