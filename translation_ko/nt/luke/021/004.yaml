  source_fidelity: 핵심 대조(모든 사람의 넉넉함과 이 여자의 궁핍), 두 번의 '넣다', 그리고 그녀가 가진 생계 수단 전부를 드렸다는 뜻은 잘 반영되어 있습니다. 다만 '헌금에 넣었으나'는 한국어에서 부자연스럽고, 본문의 성전 헌납 맥락상 '헌금함에 넣었습니다'가 자연스럽습니다. 이는 τὰ δῶρα의 문맥적 지시를 반영하되, 각주로 직역적 표현을 밝혀 두는 것이 적절합니다.
  naturalness: '''이는 이 모든 사람은''은 문두 접속 표현과 주제 표지가 겹쳐 어색합니다. ''이 모든 사람은 … 넣었지만''으로 고치고, 불필요한 닫는 인용 부호를 제거해야 합니다. ''궁핍한 가운데서''보다 ''궁핍한 데서''가 원문의 ἐκ 구문과 대조를 더 자연스럽게 살립니다.'
  terminology: '''생활비''는 여기서 βίος가 가리키는 생계 수단이라는 의미를 현대 한국어로 명료하게 전달합니다. ''헌금함''은 문맥상 자연스러운 번역이나, 그리스어의 표현 자체는 ''예물/헌물''이므로 각주로 밝혔습니다.'
