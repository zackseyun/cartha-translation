    issue: The draft leaves the relation between ‘여러분’ and ‘증언’ somewhat implicit.
    rationale: Although understandable, ‘여러분이 증언할’ naturally states that the predicted events become an opportunity for the disciples themselves to bear witness, which is the contextual force of εἰς μαρτύριον.
