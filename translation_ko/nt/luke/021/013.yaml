  naturalness: ‘이 일은 여러분이 증언할 기회가 될 것입니다’ is natural contemporary formal Korean and fits the surrounding prediction of arrests and hearings.
  terminology: ‘증언’ appropriately renders μαρτύριον in its public/legal witness sense. The footnote retains the more formally literal alternative without forcing a narrower theological interpretation.
