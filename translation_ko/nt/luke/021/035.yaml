  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐπεισελεύσεται의 ‘갑자기 닥쳐오다/들이닥치다’라는 진행·도달의 뉘앙스는 ‘임하다’보다 ‘닥치다’가 더 직접적으로 드러냅니다. γῆ는 이 문맥에서 ‘땅/지구’의 넓은 범위를 가리키므로 ‘온 땅’이 적절합니다.
  naturalness: 초안의 ‘이는 그날이’는 한국어에서 지시어와 명사절 연결이 다소 어색합니다. ‘그날이 … 닥칠 것이기 때문입니다’로 고치면 현대 표준어 합쇼체로 자연스럽고, 앞 절에서 암시된 ‘그날’을 명료하게 이어 줍니다.
  terminology: ‘덫’은 παγίς의 현대적이고 자연스러운 번역이며, 대안인 ‘올가미’는 각주로 제시할 수 있습니다. ‘온 땅 위에 사는 모든 사람’은 κατο住의 관용적 의미를 잘 전달합니다.
  issues:
  - severity: low
    issue: ‘이는 그날이’의 연결이 부자연스럽습니다.
    rationale: 원문의 γάρ는 앞선 경고의 이유를 제시합니다. 한국어에서는 지시어 ‘이는’를 넣기보다 ‘그날이 … 것이기 때문입니다’라고 하는 편이 자연스럽습니다.
  - severity: low
    issue: ‘임할 것이다’보다 ‘닥칠 것이다’가 동사의 경고적 도달 의미를 더 선명하게 나타냅니다.
    rationale: ἐπεισελεύσεται는 문맥상 그날이 사람들에게 닥쳐오는 것을 뜻합니다. ‘닥치다’는 덫의 비유와도 자연스럽게 호응합니다.
  revised_text: 덫[a]처럼 말입니다. 그날이 온 땅[b] 위에 사는 모든 사람에게 닥칠 것이기 때문입니다.
