review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands παγίς as a trap and the idiom τοὺς καθημένους ... as people living on the earth. However, “이는 그날이 … 때문입니다” makes the causal connection somewhat unnatural in Korean and obscures that γάρ directly explains why the preceding day will be trap-like. Supplying “그날은” is warranted by the explicit antecedent in the preceding verse.
  naturalness: “덫처럼 말입니다” is understandable but has a conversational, explanatory ring that is less suitable for the requested modern formal-polite biblical register. “덫처럼 닥칠 것입니다” is clear, formal, and retains the force of the comparison.
  terminology: “덫” appropriately renders παγίς; “온 땅” appropriately renders πάσης τῆς γῆς in this context. “닥칠 것입니다” naturally renders the future sense of ἐπεισελεύσεται without importing a theological interpretation.
  issues:
  - severity: low
    issue: The causal clause is phrased awkwardly.
    rationale: “이는 그날이 … 것이기 때문입니다” is grammatically possible, but Korean more naturally expresses γάρ here by making the antecedent subject explicit and following it with “왜냐하면.”
  - severity: low
    issue: The opening expression is overly conversational for the specified register.
    rationale: Replacing “말입니다” with the formal verbal expression “닥칠 것입니다” improves register while preserving the implied subject from the preceding context.
  revised_text: 덫처럼 닥칠 것입니다. 왜냐하면 그날은 온 땅에 사는 모든 사람에게 닥칠 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “올무처럼.”
    reason: παγίς의 대안적 번역입니다.
  - marker: b
    text: 직역하면 “온 땅의 표면 위에 앉아 있는 모든 사람.” 이 표현은 땅에 거주하는 사람들을 가리키는 관용적 표현입니다.
    reason: τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς의 문자적 표현과 관용적 의미를 밝힙니다.
  - marker: c
    text: 또는 “온 지역.” 그러나 여기서는 “온 땅”이 문맥에 가장 잘 맞습니다.
    reason: γῆ는 “땅/지역”을 뜻할 수도 있습니다.
  revision_rationale: 문맥상 앞 절의 “그날”을 보충하여 헬라어의 생략된 주어를 자연스럽게 드러냈습니다. “덫처럼”과 “닥칠 것입니다”를 사용해 ὡς παγίς 및 ἐπεισελεύσεται의 갑작스럽게 임하는 이미지를 유지했고, γάρ의 설명 관계를 “왜냐하면”으로 분명히 했습니다. 대안 번역과 관용 표현은 각 해당 단어에 연결할 수 있도록 각주로 제시합니다.
