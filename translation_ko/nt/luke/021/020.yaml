  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
  footnotes:
  - marker: a
    text: Or 'surrounded by military encampments.' The Greek term can refer to camps or encamped armies; here it denotes the forces besieging Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: '''Desolation'' echoes prophetic judgment language; compare the related wording in Matthew 24:15 and Mark 13:14.'
    reason: cross_reference
translation:
  language: ko
  text: 그러나 여러분이 예루살렘이 군대들에게[a] 포위되는 것을 보거든, 그때에 예루살렘의 황폐[b]가 가까이 왔음을 아십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군사 진영들에게 포위되는’. 그리스어는 진영 또는 진을 친 군대를 가리킬 수 있으며, 여기서는 예루살렘을 포위하는 군사 세력을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘황폐’는 예언서에서 심판을 나타내는 표현을 반향합니다. 마태복음 24:15과 마가복음 13:14의 관련 표현을 보십시오.
    reason: cross_reference
