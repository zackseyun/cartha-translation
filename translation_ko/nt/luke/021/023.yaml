  text: 그 날들에 임신한 여자들과 아기에게 젖을 먹이는 여자들에게 화가 있을 것입니다! 이는 이 땅[a] 위에 큰 환난이 있고, 이 백성[b]에게 진노가 있을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
