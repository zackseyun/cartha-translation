id: LUK.21.36
reference: Luke 21:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
  footnotes:
  - marker: a
    text: Some manuscripts read 'that you may be counted worthy to escape all these things...' instead of 'that you may have strength to escape all these things...'
    reason: textual_variant
  - marker: b
    text: Or 'that are going to take place.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'stand before the Son of Man' may imply standing accepted or vindicated before him, but the Greek leaves this implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 언제나 깨어 있으면서, 다가올 이 모든 일을 피하고 인자 앞에 설 힘을 얻도록[a] 기도하십시오.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘힘을 얻도록’ 대신 ‘…을 피할 자격이 있다고 여겨지도록’으로 읽습니다.
    reason: textual_variant
  - marker: b
    text: ‘다가올’은 ‘일어나게 될’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘인자 앞에 서다’는 그분 앞에 받아들여지거나 옹호되어 선다는 뜻을 함축할 수 있으나, 그 의미는 그리스어 본문에 명시되어 있지 않습니다.
    reason: lexical_alternative
