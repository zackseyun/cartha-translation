review_pass:
  verdict: revise
  source_fidelity: The draft omits the explicit force of κατισχύσητε ('may have strength/be strong enough') and recasts the prayer clause as a purpose statement ('이는 ... 위함입니다'), rather than the command to pray for the stated outcome. It also renders δέ as '그러므로,' which adds an inferential force not present in the Greek.
  naturalness: 'The proposed revision uses natural modern formal-polite Korean and keeps the single imperative structure: continual vigilance accompanied by prayer.'
  terminology: '''인자'' is the established Korean rendering of ὁ υἱὸς τοῦ ἀνθρώπου. ''힘을 얻도록'' expresses the δυναμικός sense of κατισχύσητε without adopting the variant reading ''worthy.'''
  issues:
  - severity: high
    issue: The main clause does not explicitly convey κατισχύσητε.
    rationale: The SBLGNT reads κατισχύσητε, meaning to be strong enough or prevail. The draft's '피하여 ... 설 수 있도록' leaves this lexical component unstated.
  - severity: high
    issue: The syntax of δεόμενοι ἵνα is altered.
    rationale: Greek commands vigilant prayer 'that you may' escape and stand. '이는 ... 위함입니다' converts this into an explanatory purpose sentence and weakens the direct prayer construction.
  - severity: medium
    issue: '''그러므로'' overstates δέ, and the final closing quotation mark is structurally stray.'
    rationale: δέ is a mild contrast/transition, better represented here by '그러나'; the unmatched quotation mark should be removed.
  revised_text: 그러나 모든 때에 깨어 있으면서, 장차 일어날 이 모든 일을 피하고 인자 앞에 설 수 있는 힘을 얻도록 기도하십시오.[a]
  revised_footnotes:
  - marker: a
    text: 어떤 사본들은 ‘피하고 인자 앞에 설 수 있도록 합당한 사람으로 여김을 받도록’이라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: ‘장차 일어날’은 ‘일어나게 되어 있는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘인자 앞에 서다’는 그분 앞에 받아들여지거나 인정받아 서는 뜻을 함축할 수 있으나, 그 의미는 그리스어 본문에 명시되어 있지 않습니다.
    reason: lexical_alternative
  revision_rationale: The revision restores the Greek command to remain alert and to pray, explicitly includes the strength/ability denoted by κατισχύσητε, retains the coordinated outcomes of escaping and standing, and preserves the unexpanded image of standing before the Son of Man. Footnotes retain the significant textual variant and the relevant lexical/interpretive alternatives. Markers b and c are supplied for the complete audit set but are not required in the main text because their alternatives are adequately represented by the translation and no ambiguity needs to be signaled there.
