review_pass:
  verdict: revise
  source_fidelity: 현 초안은 δέ를 ‘그러므로’로 옮겨 대조·전환의 뉘앙스를 바꾸며, κατισχύσητε(‘힘을 얻다/능력을 가지다’)를 빠뜨렸습니다. 또한 기도의 목적 구조가 두 문장으로 분리되어 약해졌습니다. 수정문은 ‘깨어 있으면서 … 기도하십시오’와 ‘피하고 … 설 힘을 얻도록’의 구조로 원문의 명령, 분사, 목적절을 보존합니다.
  naturalness: ‘언제나 깨어 있으면서 … 기도하십시오’는 현대 표준 한국어 합쇼체에서 자연스럽고, 지속적인 경계와 기도를 분명히 나타냅니다. 불필요한 종결 따옴표는 삭제했습니다.
  terminology: ‘인자’는 복음서의 정착된 칭호인 ‘ὁ υἱὸς τοῦ ἀνθρώπου’를 충실히 옮깁니다. ‘인자 앞에 서다’는 수납·인정 등의 해석을 본문에 덧붙이지 않고 원문의 표현을 유지합니다.
  issues:
  - severity: high
    issue: ‘그러므로’
    rationale: 원문의 δέ는 여기서 주로 완만한 대조 또는 전환을 나타내며, 강한 논리적 귀결을 뜻하는 ‘그러므로’는 적절하지 않습니다.
  - severity: high
    issue: ‘설 수 있도록’에 필요한 ‘힘을 얻다’의 누락
    rationale: SBLGNT의 κατισχύσητε는 피하고 서는 데 필요한 능력·힘을 얻는다는 뜻이며, 단순 가능 표현만으로는 이 의미가 충분히 반영되지 않습니다.
  - severity: medium
    issue: 목적절과 기도 행위의 분리
    rationale: δεόμενοι ἵνα 구조는 ‘…하도록 기도하십시오’로 연결되어야 합니다. 현 초안의 ‘이는 … 위함입니다’는 원문의 직접적 권면 구조를 약화합니다.
  - severity: low
    issue: 문장 끝의 닫는 따옴표
    rationale: 짝이 없는 문장부호로서 삭제해야 합니다.
  revised_text: 그러나 여러분은 언제나 깨어 있으면서, 다가올 이 모든 일을 피하고 인자 앞에 설 힘을 얻도록[a] 기도하십시오.[b][c]
  revised_footnotes:
