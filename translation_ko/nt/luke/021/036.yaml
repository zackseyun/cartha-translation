    reason: textual_variant
  - marker: b
    text: ‘다가올’은 ‘일어나게 될’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘인자 앞에 서다’는 그분 앞에 받아들여지거나 옹호되어 선다는 뜻을 함축할 수 있으나, 그 의미는 그리스어 본문에 명시되어 있지 않습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 δέ를 ‘그러나’로, ἀγρυπνεῖτε와 δεόμενοι를 ‘깨어 있으면서 … 기도하십시오’로 옮겼습니다. ἵνα κατισχύσητε의 핵심인 능력·힘의 획득을 명시하고, 두 부정과거 부정사(‘피하다’, ‘서다’)를 함께 목적 내용으로 연결했습니다. 본문에 없는 수납·무죄 선언의 해석은 각주에만 남겼습니다.
