  source_fidelity: 원문의 δέ가 나타내는 가벼운 대조와 첫 καί의 상승적 강조(‘심지어’)가 초안의 ‘그리고 …에게서도’에는 충분히 드러나지 않습니다. 또한 ἐξ ὑμῶν은 ‘여러분 가운데 몇 사람’으로 옮기는 것이 자연스럽고 정확합니다.
  naturalness: 초안의 ‘여러분 중 어떤 이들’은 문법적으로 가능하나 현대 한국어에서는 ‘여러분 가운데 몇 사람’이 더 자연스럽습니다. 수정문은 표준어 합쇼체의 엄숙하고 자연스러운 문체를 유지합니다.
  terminology: παραδοθήσεσθε는 ‘넘겨질 것입니다’로 유지하여 ‘배신하다’로 의미를 과도하게 한정하지 않았습니다. ἀδελφῶν은 본문에서 ‘형제들’로 보존하고, 혼성 형제자매 집단을 가리킬 가능성은 각주로 제시합니다.
  issues:
  - severity: medium
    issue: δέ 및 상승적 καί의 의미가 약화됨
    rationale: ‘그리고’는 δέ의 대조적 전환을 반영하지 못하며, ‘에게서도’만으로는 가까운 관계자들에 의한 넘김이라는 ‘심지어’의 강조가 분명하지 않습니다.
  - severity: low
    issue: ἀδελφῶν에 관한 대안 각주 누락
    rationale: 영어 POB 감사 기록의 어휘 대안을 한국어에서도 보존하는 것이 성별 표지된 복수 친족어의 해석 가능성을 투명하게 합니다.
  - severity: low
    issue: ‘여러분 중 어떤 이들’의 비자연스러운 표현
    rationale: ἐξ ὑμῶν의 부분성을 ‘여러분 가운데 몇 사람’으로 옮기면 더 자연스러우며 ‘some of you’의 뜻을 정확히 전달합니다.
  revised_text: 그러나 여러분은 심지어 부모와 형제들과 친척들과 친구들에게서도 넘겨질 것이며, 그들은 여러분 가운데 몇 사람을 죽일 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘형제자매들’ 또는 ‘동기들’. 그리스어 남성 복수형은 때때로 형제자매가 섞인 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 대조(δέ)와 강조적 ‘심지어’(καί)를 명시하고, ἐξ ὑμῶν의 부분적 의미를 자연스러운 한국어로 다듬었습니다. 본문은 원문의 남성 복수 친족어를 ‘형제들’로 유지하며, 가능한 더 넓은 지시는 각주에만 제시했습니다.
