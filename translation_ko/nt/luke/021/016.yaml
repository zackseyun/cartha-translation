  source_fidelity: 원문의 δέ가 앞 절의 보호 약속에 대한 역접적 전환을 이루고, 첫 καί가 가까운 관계자들까지 포함한다는 상승적 강조를 나타냅니다. 초안의 ‘그리고’와 ‘…에게서도’는 이 강조를 충분히 드러내지 못합니다. ‘넘겨질 것’과 ‘여러분 중 어떤 이들을 죽일 것’은 각각 παραδοθήσεσθε와 ἐξ ὑμῶν을 충실히 옮깁니다.
  naturalness: 합쇼체 문장으로 자연스럽지만, ‘부모와 형제들과 친척들과 친구들에게서도’보다 ‘부모와 형제들과 친척들과 친구들에게서까지’가 행위자와 ‘심지어’의 강조를 더 분명하고 자연스럽게 전달합니다.
  terminology: ‘넘겨지다’는 παραδίδωμι의 수동형을 중립적으로 보존하며, ‘죽이다’는 θανατόω에 적절합니다. ἀδελφῶν은 본문에서 ‘형제들’로 유지하고, 혼성 형제자매 집단을 가리킬 가능성은 각주로 제시합니다.
  issues:
  - severity: medium
    issue: 접속사와 상승적 강조의 약화
    rationale: 원문의 δέ는 여기서 ‘그러나’로 옮기는 것이 적절하며, 첫 καί의 ‘심지어’라는 강조는 ‘…에게서도’보다 ‘…에게서까지’ 또는 ‘심지어 …에게서’로 더 명확히 나타내야 합니다.
  revised_text: 그러나 여러분은 심지어 부모와 형제들과 친척들과 친구들에게서까지 넘겨질 것이며, 그들이 여러분 중 어떤 이들을 죽일 것입니다.
  revised_footnotes:
  - marker: a
    text: ‘형제들’은 문맥에 따라 형제자매들을 가리킬 수도 있습니다.
    reason: ἀδελφῶν은 남성 복수형이며, 혼성 형제자매 집단을 포함할 가능성이 있어 대안적 이해를 제시합니다.
  revision_rationale: 원문의 역접(δέ)과 가까운 관계자들까지 포함하는 강조(καί)를 보존하도록 ‘그러나’와 ‘심지어 …에게서까지’를 사용했습니다. 나머지 표현은 초안의 정확한 수동 의미와 자연스러운 합쇼체를 유지했습니다.
