  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
  footnotes:
  - marker: a
    text: Greek ἱερόν refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'spend the night'; the verb can also suggest lodging in the open.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 낮마다 성전[a]에서 가르치셨고, 밤마다 나가셔서 감람산이라고 불리는 산에서 묵으셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἱερόν은 특별히 성소 내부만이 아니라 성전 경내 또는 성전 구역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “밤을 보내셨습니다.” 이 동사는 때때로 야외에서 묵는 것을 암시할 수 있습니다.
    reason: lexical_alternative
