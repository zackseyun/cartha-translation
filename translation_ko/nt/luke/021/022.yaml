  rationale: The revision removes unnatural repetition, restores a single causal structure corresponding to ὅτι, and integrates the articular infinitive as a purpose/result qualifier of "보복의 날들." It retains "보복" for the judicial-requital sense and leaves "기록된 모든 것" appropriately broad.
