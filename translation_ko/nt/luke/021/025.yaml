  source_fidelity: 현 초안은 ‘민족들이 당혹한 가운데 고통할 것입니다’로 συνοχὴ와 ἐν ἀπορίᾳ를 대체로 반영하지만, ‘바다와 파도의 흔들림’은 ἤχους θαλάσσης καὶ σάλου(바다와 그 요동의 소리/울림)의 ‘소리’ 요소를 약화합니다. 수정문은 이 요소와 민족들의 곤경 및 막막함을 모두 보존합니다.
  naturalness: ‘해와 달과 별들에 표적들이 있을 것이며’ 및 ‘어찌할 바를 몰라 곤경에 빠질 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 묵시적 문맥에도 적절합니다.
  terminology: σημεῖα는 ‘표적들’, συνοχή는 ‘곤경’, ἀπορία는 ‘어찌할 바를 모름’으로 옮겼습니다. σάλος는 특정한 ‘파도’로 한정하지 않고 ‘요동’으로 두어 원문의 폭을 보존했습니다.
