- from: 그리고 해와 달과 별들에 표적들이 있을 것이며, 땅 위에는 바다와 파도의 흔들림으로 인하여 민족들이 당혹한 가운데 고통할 것입니다.
  to: 그리고 해와 달과 별들에 표적들이 있을 것이며, 땅 위에서는 바다와 그 요동이 내는 소리 때문에 민족들이 어찌할 바를 몰라 곤경에 빠질 것입니다.[a]
  rationale: 바다 및 요동과 관련된 ‘소리’를 명시하고, ‘곤경’과 ‘어찌할 바를 모름’으로 원문의 압박과 막막함을 구별해 반영했습니다. ‘요동’은 σάλος를 ‘파도’로 과도하게 한정하지 않습니다. 각주에서는 전치사적 결합의 ‘앞에서’와 문맥상 인과적으로 이해되는 ‘때문에’의 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
