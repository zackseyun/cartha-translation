review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparison, the occurrence of the specified events, the imperative to recognize their significance, and 'the kingdom of God.' However, '가까이 온 줄' naturally carries a completed-arrival nuance, whereas ἐγγύς ἐστιν states present nearness.
  naturalness: The proposed wording is idiomatic modern standard Korean in formal-polite register. '보면' clearly renders the future-temporal contingency of ὅταν with the aorist subjunctive without the potentially more conditional coloring of '보거든.'
  terminology: '''하나님의 나라'' is the standard Korean rendering of ἡ βασιλεία τοῦ θεοῦ and appropriately retains its semantic and theological breadth. No interpretive expansion is added.'
  issues:
  - severity: low
    issue: '''가까이 온 줄 아십시오'' can imply that the kingdom has already come near/arrived.'
    rationale: The Greek ἐγγύς ἐστιν more directly predicates present nearness. '가까이 있음을 아십시오' preserves this without deciding how that nearness should be construed eschatologically.
  - severity: low
    issue: '''보거든'' is somewhat more conditional in flavor.'
    rationale: ὅταν ἴδητε is a future-temporal construction ('when you see'). '보면' is natural Korean and better preserves that relation.
  revised_text: 이와 같이 여러분도 이러한 일들이 일어나는 것을 보면, 하나님의 나라가 가까이 있음을 아십시오.
