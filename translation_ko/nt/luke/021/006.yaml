  naturalness: ‘여러분이 보고 있는 이 모든 것에 관하여 말하자면’은 전치된 Ταῦτα의 화제 제시를 자연스러운 현대 한국어 합쇼체로 옮깁니다. ‘돌 하나도 돌 위에 남지 않고 모두 무너질’은 한국어에서 자연스럽고 의미가 분명합니다.
  terminology: ‘돌’, ‘남다’, ‘무너지다’는 건축물의 철거·파괴 문맥에 적절하며, 본문이 요구하지 않는 종말론적 해석을 덧붙이지 않습니다.
