  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
  footnotes:
  - marker: a
    text: Or “while they still did not believe for joy and were amazed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 아직도 기쁨 때문에 믿지 못하고 놀라고 있을 때[a], 예수께서 그들에게 말씀하셨습니다. 「여기 먹을 것이 있습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 기뻐서 아직도 믿지 못하고 놀라고 있을 때.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ
  english_pob_choice: And while they still
  chosen_korean: 아직도 …하고 있을 때
  alternatives_korean:
  - 그리고 아직도
  - 하지만 아직도
  lexicon: BDAG
  rationale: ἔτι의 지속성에 δέ의 완만한 접속을 살려, 사건이 진행 중임을 자연스럽게 드러냈습니다.
- source_word: ἀπιστούντων
  english_pob_choice: were disbelieving
  chosen_korean: 믿지 못하고
  alternatives_korean:
  - 믿지 않고
  - 불신하고
  lexicon: BDAG
  rationale: 현재분사로서의 진행성과 상황적 주저를 살려, 단순한 고정적 불신보다 순간적 미수긍을 표현했습니다.
- source_word: ἀπὸ τῆς χαρᾶς
  english_pob_choice: because of joy
  chosen_korean: 기쁨 때문에
  alternatives_korean:
  - 기쁨으로 인해
  - 기쁨으로부터
  lexicon: BDAG
  rationale: 원문의 원인/출처 관계를 한국어에서 가장 분명하게 드러내는 표현을 택했습니다.
- source_word: θαυμαζόντων
  english_pob_choice: were marveling
  chosen_korean: 놀라워하고
  alternatives_korean:
  - 경이로워하고
  - 놀라고
  lexicon: BDAG
  rationale: 놀람과 경이의 지속적 반응을 살리되, 문맥상 과장되지 않은 현대 한국어로 옮겼습니다.
- source_word: Ἔχετέ τι βρώσιμον ἐνθάδε;
  english_pob_choice: Do you have anything here to eat?
  chosen_korean: 여기 먹을 것이 있습니까?
  alternatives_korean:
  - 여기에 먹을 만한 것이 있습니까?
  - 여기서 먹을 것이 있습니까?
  lexicon: BDAG
  rationale: βρώσιμον의 ‘먹을 수 있는 것’을 한국어 질문으로 간결하게 풀어, 요청의 뜻을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 부활하신 예수에 대한 제자들의 반응
  chosen_reading: 기쁨이 너무 커서 믿기 어려워하는 일시적 놀라움으로 보이게 했습니다.
  alternative_readings:
  - 단순히 끝까지 믿지 못하는 태도로 보이게 할 수 있습니다.
  rationale: 원문은 불신과 경탄이 동시에 진행되는 복합 반응을 보여 주므로, 이를 평평하게 만들지 않고 그대로 유지했습니다.
  doctrine_reference: 해석의 긴장을 보존
- issue: 예수의 질문의 성격
  chosen_reading: 부활의 실재를 시험하는 논쟁적 질문이 아니라, 실제로 먹을 것을 요청하는 일상적 질문으로 옮겼습니다.
  alternative_readings:
  - 기적을 입증하기 위한 수사적 장치로 읽을 수 있습니다.
  rationale: 직전 문맥에서 예수의 몸의 실재성을 드러내는 흐름에 맞추어, 평범한 요청의 어조를 유지했습니다.
  doctrine_reference: 부활의 جسم적 실재성
