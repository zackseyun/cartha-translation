translation:
  language: ko
  text: 그는 그들을 베다니 쪽까지[a] 데리고 나가셔서, 손을 들어 그들을 축복하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베다니까지’, ‘베다니 가까이까지’. 헬라어 표현은 문자적으로 ‘베다니 쪽으로 이르는 데까지’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  english_pob_choice: led them out
  chosen_korean: 데리고 나가시고
  alternatives_korean:
  - 데리고 나가셨습니다
  - 이끌고 나가시고
  - 밖으로 데려가시고
  lexicon: BDAG
  rationale: 이 동사는 단순히 ‘밖으로 데려감’보다 방향성과 인도를 함께 담으므로, 문맥상 예수님이 제자들을 직접 인도하시는 뉘앙스를 살려 ‘데리고 나가시고’로 옮겼습니다.
- source_word: ἕως πρὸς Βηθανίαν
  english_pob_choice: as far as Bethany
  chosen_korean: 베다니 맞은편까지
  alternatives_korean:
  - 베다니까지
  - 베다니 가까이까지
  - 베다니로 향하는 곳까지
  lexicon: BDAG
  rationale: ἕως πρός는 단순 도착점보다 ‘~쪽으로 이르는 범위/방향’을 더 강하게 드러내므로, POB 각주 취지를 반영해 자연스럽게 ‘베다니 맞은편까지’로 표현했습니다.
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  english_pob_choice: lifting up his hands
  chosen_korean: 손을 들어
  alternatives_korean:
  - 두 손을 들어
  - 손을 높이 들어
  - 그의 손을 들어
  lexicon: BDAG
  rationale: 축복 행위의 관용적 제스처를 한국어로 자연스럽게 살리되, 복수형 ‘손들’의 이미지가 주는 장면성을 유지하려고 ‘손을 들어’로 옮겼습니다.
- source_word: εὐλόγησεν αὐτούς
  english_pob_choice: he blessed them
  chosen_korean: 그들에게 복을 빌어 주셨습니다
  alternatives_korean:
  - 그들을 축복하셨습니다
  - 그들에게 복을 주셨습니다
  - 그들에게 축복을 선포하셨습니다
  lexicon: BDAG
  rationale: εὐλογέω는 여기서 단순 인사말이 아니라 실제로 복을 선언하는 행위이므로, 교회적 관용어를 쓰되 너무 추상화하지 않도록 ‘복을 빌어 주셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 예수님의 축복 행위의 성격
  chosen_reading: 의식적·권위적 축복 행위로 드러내되, 제사장적 공식이나 설명을 덧붙이지 않고 본문 그대로 유지했습니다.
  alternative_readings:
  - 그들에게 축복을 선포하셨습니다
  - 그들을 위해 기도해 주셨습니다
  rationale: 본문은 손을 들어 축복하는 구체적 행동을 보여 주지만, 후대 교회적 범주를 과도하게 삽입하지 않는 것이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy items 1 and 3
