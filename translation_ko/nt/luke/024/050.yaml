base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
  footnotes:
  - marker: a
    text: Or 'to Bethany' or 'near Bethany'; the Greek expression is somewhat fuller, literally 'as far as toward Bethany.'
