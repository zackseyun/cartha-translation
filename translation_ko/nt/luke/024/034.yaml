  naturalness: ‘말하기를,’은 문어적이고 다소 경직됩니다. 앞 절에 이어지는 분사 구조에는 ‘말하며,’가 현대 표준어 합쇼체 성경 문맥에서 더 자연스럽습니다. ‘일으켜지셨고’는 ‘살아나셨고’보다 덜 관용적이지만, 이 절에서는 원문의 수동형을 보존하기 위한 제한적이고 이해 가능한 표현입니다.
  terminology: κύριος는 기독론적 호칭인 ‘주님’으로 적절히 옮겼고, Σίμων은 원문대로 ‘시몬’으로 유지했습니다. ‘참으로’는 ὄντως의 확증적 강조를 잘 전달합니다. 각주도 수동형이라는 핵심을 명시하도록 고쳐야 합니다.
