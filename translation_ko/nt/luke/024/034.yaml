translation:
  language: ko
  text: 말하기를, 「주님께서 참으로 살아나셨고, 시몬에게 나타나셨습니다!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ὄντως와 수동형 동사는 “참으로 살아나셨습니다”, “정말로 다시 살아나셨습니다”, “참으로 부활하셨습니다”처럼도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  english_pob_choice: saying
  chosen_korean: 말하기를
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: BDAG
  rationale: 분사 λέγοντας의 연결을 살리되, 한국어에서는 뒤의 직접 화법을 자연스럽게 여는 표현으로 ‘말하기를’이 가장 무난합니다.
- source_word: ὄντως
  english_pob_choice: truly
  chosen_korean: 참으로
  alternatives_korean:
  - 정말로
  - 진실로
  - 실로
  lexicon: BDAG
  rationale: 부사의 확증적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽고 힘 있는 강조를 주는 표현입니다.
- source_word: ἠγέρθη
  english_pob_choice: has been raised
  chosen_korean: 살아나셨고
  alternatives_korean:
  - 일으켜지셨고
  - 부활하셨고
  - 다시 살아나셨고
  lexicon: BDAG
  rationale: 수동형을 원칙적으로 보존해야 하지만, 한국어에서는 ‘살아나시다’가 부활 수동을 가장 자연스럽게 전달합니다. ‘부활하셨고’도 가능하나, 원문 수동성을 직접 드러내기 위해 ‘살아나셨고’를 택했습니다.
- source_word: ὁ κύριος
  english_pob_choice: The Lord
  chosen_korean: 주님께서
  alternatives_korean:
  - 주께서
  - 주님이
  - 주께
  lexicon: BDAG
  rationale: κύριος의 기본 번역 지침을 따라 ‘주님’을 쓰되, 문장 전체의 존칭 흐름에 맞게 주어 표지까지 포함한 ‘주님께서’로 옮겼습니다.
- source_word: ὤφθη
  english_pob_choice: has appeared
  chosen_korean: 나타나셨습니다
  alternatives_korean:
  - 보이셨습니다
  - 나타나 보이셨습니다
  - 현현하셨습니다
  lexicon: BDAG
  rationale: 부활 현현을 가리키는 수동형을 한국어에서 가장 자연스럽게 전달하는 표현은 ‘나타나셨습니다’입니다. ‘보이셨습니다’보다 사건의 계시적 성격이 분명합니다.
theological_decisions:
- issue: 수동형 ἠγέρθη의 한국어 처리
  chosen_reading: ‘살아나셨고’로 옮겨 수동적 부활 표현을 유지했습니다.
  alternative_readings:
  - ‘부활하셨고’
  - ‘일으켜지셨고’
  rationale: 원문은 수동형이므로 능동적 재진술인 ‘일어나셨다’보다 수동 의미를 살리는 번역이 필요합니다. 한국어에서는 ‘살아나시다’가 부활 수동을 가장 자연스럽게 담습니다.
  doctrine_reference: 'Translation philosophy: preserve source-text sense; do not paraphrase beyond what the source warrants.'
