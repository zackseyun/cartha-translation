revisions:
- from: 그런데 그가 그들과 함께 식탁에 기대어 앉으셨을 때[a], 빵을 집어 축복하신 뒤[b], 떼어 그들에게 주기 시작하셨습니다.
  to: 그가 그들과 함께 식탁에 기대어 앉으셨을 때[a], 이런 일이 있었습니다. 그는 빵을 집어 축복하시고, 그것을 떼어 그들에게 주기 시작하셨습니다[b].
  rationale: καὶ ἐγένετο를 ‘이런 일이 있었습니다’로 옮겨 원문의 비대조적 사건 도입 기능을 보존했습니다. 이어지는 ‘그는’은 한국어 문장 구조상 자연스럽게 행동의 주체를 다시 밝혀 줍니다. ‘축복하시고, 그것을 떼어’는 원문의 연속된 분사·동사 관계를 명료하게 드러내며, 각주 b를 ἐπεδίδου의 번역어에 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:30Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그런데’는 καὶ ἐγένετο의 서술 전환을 대조적으로 들리게 할 수 있으며, 원문의 사건 도입 표지를 충분히 반영하지 못합니다. 또한 미완료시제 ἐπεδίδου에 관한 각주 b가 ‘축복하신 뒤’에 붙어 있어 해당 동사에 닻이 맞지 않습니다. 개정문은 사건 도입을 명시하고, 빵을 축복하고 떼는 순서 및 ‘주기 시작하셨습니다’의 개시적 미완료 뉘앙스를 보존합니다.
  naturalness: ‘이런 일이 있었습니다. 그는 …’은 원문의 ἐγένετο를 보존하면서도 현대 한국어의 정중한 성경 서술문에서 이해 가능한 표현입니다. ‘그것을 떼어’는 ‘떼어’의 목적어를 분명히 하여 문장을 자연스럽게 합니다.
  terminology: ‘빵’, ‘축복하시고’, ‘떼어’, ‘주기 시작하셨습니다’는 각각 ἄρτος, εὐλόγησεν, κλάσας, ἐπεδίδου를 무리한 성찬적 해석 없이 적절히 반영합니다. ‘식탁에 기대어 앉으셨을 때’는 고대 식사의 기대어 눕는 관습을 충분히 전달하며 문화 각주와도 일치합니다.
  issues:
  - severity: medium
    issue: ‘그런데’가 καὶ ἐγένετο를 대조 접속으로 들리게 할 수 있음
    rationale: καὶ ἐγένετο는 여기서 대조를 표시하기보다 장면과 사건을 도입하는 누가의 서술 공식입니다. 한국어 ‘그런데’는 문맥상 역접·전환의 함의가 강할 수 있으므로, 사건 도입을 직접 나타내는 표현이 더 충실합니다.
  - severity: medium
    issue: 각주 b의 닻이 ἐπεδίδου가 아닌 ‘축복하신 뒤’에 놓임
    rationale: 각주 b는 ‘그들에게 주고 계셨습니다’라는 ἐπεδίδου의 미완료시제 대안을 설명합니다. 따라서 ‘주기 시작하셨습니다’에 붙어야 합니다.
  revised_text: 그가 그들과 함께 식탁에 기대어 앉으셨을 때[a], 이런 일이 있었습니다. 그는 빵을 집어 축복하시고, 그것을 떼어 그들에게 주기 시작하셨습니다[b].
