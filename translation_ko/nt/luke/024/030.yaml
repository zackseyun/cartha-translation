id: LUK.24.30
reference: Luke 24:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
  footnotes:
  - marker: a
    text: Or 'sat down with them.' The Greek more specifically refers to reclining at table, reflecting ancient dining practice.
    reason: cultural_note
  - marker: b
    text: Or 'was giving it to them.' The Greek imperfect can emphasize ongoing action; 'began giving' reflects the action's onset in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그가 그들과 함께 식탁에 기대어 앉으셨을 때[a], 빵을 집어 축복하신 뒤[b], 떼어 그들에게 주기 시작하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들과 함께 식탁에 앉으셨을 때.’ 그리스어는 고대 식사 관습을 반영해 식탁에 기대어 앉는 모습을 더 구체적으로 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들에게 주고 계셨습니다.’ 그리스어 미완료시제는 계속되거나 시작되는 동작을 나타낼 수 있으며, 여기서는 그 행동의 시작을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  english_pob_choice: it happened
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 일이 일어났습니다
  lexicon: BDAG
  rationale: Luke의 서술 전환 표지를 한국어에서는 자연스러운 이야기 전환어로 옮겨, 단순 연결 이상의 장면 전환 기능을 살렸습니다.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  english_pob_choice: when he reclined at the table with them
  chosen_korean: 그들과 함께 식탁에 기대어 앉으셨을 때
  alternatives_korean:
  - 그들과 함께 앉으셨을 때
  - 그들과 함께 식탁에 누우셨을 때
  lexicon: BDAG
  rationale: 식사 장면의 고대적 관습을 반영해 단순한 ‘앉다’보다 식탁에 기대어 앉는 이미지를 살렸고, 현대 한국어에서는 과도하게 낯설지 않도록 다듬었습니다.
- source_word: λαβὼν τὸν ἄρτον
  english_pob_choice: he took the bread
  chosen_korean: 빵을 집어
  alternatives_korean:
  - 떡을 집어
  - 빵을 잡아
  lexicon: BDAG
  rationale: ὁ ἄρτος는 문맥상 식사에 놓인 빵을 가리키므로, 한국어에서는 자연스럽고 구체적인 ‘빵’을 택했습니다.
- source_word: εὐλόγησεν
  english_pob_choice: blessed it
  chosen_korean: 축복하신 뒤
  alternatives_korean:
  - 복을 빌어 주신 뒤
  - 축복하셨고
  lexicon: BDAG
  rationale: 식사 자리에서 빵 위에 복을 선언하는 동작을 한국어 동사 ‘축복하다’로 옮겨, 감사(danksgiving)와는 구별되는 원문의 동사를 반영했습니다.
- source_word: κλάσας
  english_pob_choice: after breaking it
  chosen_korean: 떼어
  alternatives_korean:
  - 쪼개어
  - 부수고
  lexicon: BDAG
  rationale: 앞선 동작 뒤에 이어지는 분배를 자연스럽게 잇되, 빵을 나누는 행위를 간결하게 드러내기 위해 ‘떼어’로 옮겼습니다.
- source_word: ἐπεδίδου
  english_pob_choice: began giving it to them
  chosen_korean: 그들에게 주기 시작하셨습니다
  alternatives_korean:
  - 그들에게 주셨습니다
  - 그들에게 계속 주셨습니다
  - 그들에게 나누어 주기 시작하셨습니다
  lexicon: BDAG
  rationale: 미완료시제의 개시·진행 뉘앙스를 살려 ‘주기 시작하셨습니다’로 옮겼고, 장면의 순간적 전개를 보존했습니다.
theological_decisions:
- issue: 성찬적 해석을 본문 자체에 과도하게 부여할 것인가
  chosen_reading: 일상 식사 동작으로 번역하되, 성찬으로 단정하지 않습니다.
  alternative_readings:
  - 성찬을 암시하는 교회 전통적 표현을 강화하기
  rationale: 본문은 예수의 식탁 동작을 서술할 뿐, 이 절 자체에서 성례를 명시하지 않으므로, 원문이 허용하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1 and §3
