id: LUK.24.7
reference: Luke 24:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
  footnotes:
  - marker: a
    text: Or "be handed over into the hands of sinful men."
    reason: lexical_alternative
  - marker: b
    text: Or "rise"; the Greek is active, not passive (contrast "be raised").
    reason: lexical_alternative
translation:
  language: ko
  text: 「인자가 죄인들의 손에 넘겨져 십자가에 못 박히고 셋째 날에 다시 살아나야 한다」고 말씀하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넘겨지다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다시 살아나다.’ 헬라어는 수동이 아니라 능동입니다(‘다시 일으켜지다’와 대조됨).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  english_pob_choice: saying
  chosen_korean: 「…」고 말씀하셨습니다
  alternatives_korean:
  - …라고 말했습니다
  - …라고 하셨습니다
  lexicon: BDAG
  rationale: 직전 절과 이어지는 분사구문을 한국어에서 자연스럽게 살리기 위해 인용절을 달아 연결했고, 본문이 회상된 말씀임을 반영해 공손한 서술형으로 처리했습니다.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자이신 분
  lexicon: BDAG
  rationale: 예수의 자기칭호로서 표준적이고 상호본문적 울림이 큰 ‘인자’를 유지했습니다.
- source_word: παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν
  english_pob_choice: be delivered into the hands of sinful men
  chosen_korean: 죄인들의 손에 넘겨져
  alternatives_korean:
  - 죄인들의 손에 넘겨져
  - 죄인들 가운데 넘겨져
  - 죄 많은 사람들의 손에 넘겨져
  lexicon: BDAG
  rationale: παραδοθῆναι의 ‘넘겨지다/인도되다’라는 수동 의미와 εἰς χεῖρας의 관용구를 한국어에서 가장 자연스럽게 살렸습니다. ‘죄인들’은 ἁμαρτωλῶν의 직접 대응을 유지합니다.
- source_word: σταυρωθῆναι
  english_pob_choice: be crucified
  chosen_korean: 십자가에 못 박히고
  alternatives_korean:
  - 십자가형을 당하고
  - 십자가에 달리고
  lexicon: BDAG
  rationale: 수동 부정사의 의미를 직역에 가깝게 옮기되 한국어에서 익숙한 수난 표현인 ‘못 박히다’를 사용했습니다.
- source_word: ἀναστῆναι
  english_pob_choice: rise again
  chosen_korean: 다시 살아나야
  alternatives_korean:
  - 다시 일어나야
  - 부활해야
  - 다시 일어나
  lexicon: BDAG
  rationale: 능동 부정사의 ‘일어나다’보다 부활 문맥에서 한국어 독자가 즉시 이해하는 ‘다시 살아나다’를 택했고, δεῖ의 필연성을 위해 ‘-아야’로 옮겼습니다.
theological_decisions:
- issue: δεῖ의 신학적 필연성
  chosen_reading: ‘~해야 한다’로 옮겨 단순한 예고가 아니라 하나님의 계획 안에서의 필연을 드러냈습니다.
  alternative_readings:
  - ‘~할 것이다’로 단순 미래 예고
  - ‘~할 수밖에 없다’로 더 강한 필연성
  rationale: 누가복음에서 δεῖ는 구속사적 필요를 나타내므로, 미래예고로 약화시키지 않되 과도한 설명도 덧붙이지 않는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
