id: LUK.24.21
reference: Luke 24:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
  footnotes:
  - marker: a
    text: Or, 'the one who was going to redeem Israel.' The Greek keeps a present verb ('is') within the content of their past hope.
    reason: alternative_reading
  - marker: b
    text: '''Redeem Israel'' can refer broadly to hoped-for messianic deliverance; the text does not specify whether the speakers mean political liberation, spiritual salvation, or both.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리는 그분이 이스라엘을 구속하실 분이라고 희망했었습니다[a]. 그런데 이 모든 일 외에도[b] 지금은 그 일이 일어난 지 벌써 사흘째입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 구속하려 하던 분.’ 헬라어는 과거의 희망 내용 안에서 현재형 ‘is’를 유지합니다.
    reason: alternative_reading
  - marker: b
    text: ‘이스라엘을 구속하다’는 넓게는 메시아적 해방을 가리킬 수 있으므로, 정치적 해방인지 영적 구원인지, 혹은 둘 다인지는 본문이 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  english_pob_choice: But we
  chosen_korean: 그러나 우리는
  alternatives_korean:
  - 그런데 우리는
  - 하지만 우리는
  lexicon: BDAG
  rationale: δέ의 대조를 살리면서 ἡμεῖς의 강조를 자연스럽게 드러내기 위해 ‘그러나 우리는’을 택했습니다.
- source_word: ἠλπίζομεν
  english_pob_choice: were hoping
  chosen_korean: 희망했었습니다
  alternatives_korean:
  - 희망했습니다
  - 바라고 있었습니다
  lexicon: BDAG
  rationale: 과거의 지속된 기대가 지금은 좌절된 뉘앙스를 살리기 위해 단순 과거보다 ‘희망했었습니다’를 사용했습니다.
- source_word: ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ
  english_pob_choice: the one who is about to redeem Israel
  chosen_korean: 이스라엘을 구속하실 분
  alternatives_korean:
  - 이스라엘을 속량하실 분
  - 이스라엘을 구원하실 분
  lexicon: BDAG
  rationale: λυτρόομαι의 구속/속량 의미를 살리되, 한국어에서 메시아적 구원 행위를 자연스럽게 드러내기 위해 ‘구속하실 분’으로 옮겼습니다.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  english_pob_choice: it is now the third day
  chosen_korean: 지금은 ... 사흘째입니다
  alternatives_korean:
  - 이것이 셋째 날입니다
  - 이제 셋째 날입니다
  lexicon: BDAG
  rationale: ἄγει의 관용적 시간 표현을 한국어의 현재 진행감으로 풀어, 이미 경과한 시간을 강조하는 자연스러운 문장으로 옮겼습니다.
theological_decisions:
- issue: λυτροῦσθαι τὸν Ἰσραήλ의 범위
  chosen_reading: ‘이스라엘을 구속하실 분’이라고만 두어 정치적 해방, 영적 구원, 혹은 둘 다로 한정하지 않았습니다.
  alternative_readings:
  - 이스라엘을 정치적으로 해방하실 분
  - 이스라엘을 영적으로 구원하실 분
  rationale: 본문은 제자들의 메시아적 기대를 말하지만 구속의 방식을 규정하지 않으므로, 의미 범위를 열어 둔 번역이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: ἐστιν과 ἠλπίζομεν의 시제 긴장
  chosen_reading: ‘희망했었습니다’로 과거 기대를 드러내면서도 현재적 진술을 덧씌우지 않았습니다.
  alternative_readings:
  - 희망했습니다
  - 희망해 왔습니다
  rationale: 헬라어의 현재 ἐστιν이 과거 희망 내용 안에 남아 있는 긴장을 한국어에서도 과도하게 평준화하지 않도록 했습니다.
  doctrine_reference: Source-tense preservation
