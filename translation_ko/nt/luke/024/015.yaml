  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
  footnotes:
  - marker: a
    text: Or 'debating' or 'arguing'; the Greek can suggest a more intense discussion.
    reason: lexical_alternative
  - marker: b
    text: Or 'drew near and went with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이야기하고 논의하는 동안, 예수님 자신이 가까이 오셔서 그들과 함께 가고 계셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토론하는’이나 ‘논쟁하는’입니다. 헬라어는 더 강한 주고받음을 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가까이 다가오셔서 그들과 함께 가셨습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  english_pob_choice: it happened
  chosen_korean: ~하는 동안
  alternatives_korean:
  - 일이 일어났습니다
  - 그때 그런 일이 있었습니다
  lexicon: BDAG
  rationale: 루가의 서술 전환 표지로서 사건의 흐름을 여는 말인데, 한국어에서는 자연스럽게 다음 절의 시간 표현으로 풀어 옮기는 것이 가장 매끄럽습니다.
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  english_pob_choice: while they were talking
  chosen_korean: 그들이 이야기하고
  alternatives_korean:
  - 그들이 말하는 동안
  - 그들이 대화하는 동안
  lexicon: BDAG
  rationale: ἑλλην어의 ἐν + 정관사 부정사 구조를 시간 부사절로 옮겼고, ὁμιλεῖν은 단순한 대화의 뉘앙스가 있어 ‘이야기하고’가 가장 자연스럽습니다.
- source_word: συζητεῖν
  english_pob_choice: discussing
  chosen_korean: 논의하는
  alternatives_korean:
  - 토론하는
  - 논쟁하는
  - 따져 묻는
  lexicon: BDAG
  rationale: συζητέω는 단순한 말하기보다 의견을 주고받는 적극적인 대화를 가리킬 수 있으므로, 중립적이면서도 강도를 살린 ‘논의하는’으로 옮겼습니다.
- source_word: αὐτὸς Ἰησοῦς
  english_pob_choice: Jesus himself
  chosen_korean: 예수님 자신이
  alternatives_korean:
  - 예수님이 직접
  - 예수님께서 몸소
  lexicon: BDAG
  rationale: αὐτός의 강조를 한국어에서도 드러내기 위해 주어를 ‘예수님 자신이’로 옮겨, 단순히 이름만 제시하는 것보다 강조를 보존했습니다.
- source_word: ἐγγίσας συνεπορεύετο
  english_pob_choice: came near and was going with them
  chosen_korean: 가까이 오셔서 그들과 함께 가고 계셨습니다
  alternatives_korean:
  - 다가와서 그들과 함께 가셨습니다
  - 가까이 다가오셔서 그들과 동행하고 계셨습니다
  lexicon: BDAG
  rationale: ἐγγίσας의 선행 동작과 συνεπορεύετο의 진행상을 살려 ‘가까이 오셔서 … 가고 계셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 부활하신 예수의 현존을 드러내는 강조
  chosen_reading: 예수님 자신이 가까이 오셔서
  alternative_readings:
  - 예수님이 가까이 오셔서
  rationale: 본문은 단순한 접근보다 부활하신 예수께서 친히 동행하신 점을 강조하므로, αὐτός의 강조를 번역에서 살렸습니다.
  doctrine_reference: Affirmations; Translation philosophy §1, §3
