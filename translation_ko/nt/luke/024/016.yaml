  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
  footnotes:
  - marker: a
    text: Or 'were restrained from recognizing him' or 'were prevented from recognizing him.' The Greek leaves the agent unstated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그들의 눈이 그를 알아보지 못하도록 막혀 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘알아보지 못하도록 제지되었다’, ‘알아보지 못하도록 방해받았다’로도 옮길 수 있습니다. 헬라어는 행위자를 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그런데
  alternatives_korean:
  - 하지만
  - 그러나
  - 그리고
  lexicon: BDAG
  rationale: δὲ는 서술 전개의 전환을 나타내는 약한 접속사이므로, 앞 문맥과의 대비를 살리면서도 한국어 문맥에 자연스러운 ‘그런데’로 옮겼습니다.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  english_pob_choice: their eyes
  chosen_korean: 그들의 눈이
  alternatives_korean:
  - 그들의 눈은
  - 그 눈이
  - 그들이
  lexicon: BDAG
  rationale: 주어로 제시된 ‘눈’을 그대로 살려, 인식의 문제를 추상화하지 않고 신체적 이미지 자체를 보존했습니다.
- source_word: ἐκρατοῦντο
  english_pob_choice: were kept
  chosen_korean: 막혀 있었습니다
  alternatives_korean:
  - 붙들려 있었습니다
  - 억제되고 있었습니다
  - 가로막혀 있었습니다
  lexicon: BDAG
  rationale: 수동태의 상태를 드러내면서도 한국어에서 ‘인식이 막히다’라는 관용적 표현으로, 외적 제약이 가해진 상태를 자연스럽게 나타냈습니다.
- source_word: τοῦ μὴ ἐπιγνῶναι
  english_pob_choice: from recognizing
  chosen_korean: 알아보지 못하도록
  alternatives_korean:
  - 알지 못하도록
  - 인식하지 못하도록
  - 알아채지 못하도록
  lexicon: BDAG
  rationale: 문맥상 단순 지식이 아니라 예수를 ‘알아보는’ 의미이므로, ἐπιγινώσκω의 인식·식별 뉘앙스를 살려 옮겼습니다.
theological_decisions:
- issue: 인식 불가능의 원인과 행위자
  chosen_reading: 행위자를 밝히지 않고 ‘막혀 있었습니다’로 수동적 상태를 유지했습니다.
  alternative_readings:
  - ‘하나님이 그들의 눈을 막으셨습니다’처럼 행위자를 명시함
  - ‘그들은 알아볼 수 없었습니다’처럼 비인칭으로 풀어씀
  rationale: 헬라어는 수동태로만 제시하고 행위자를 밝히지 않으므로, 번역도 그 긴장을 보존해 독자가 원문의 열린 상태를 그대로 보게 했습니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 않고 보존'
