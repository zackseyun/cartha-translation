id: LUK.24.52
reference: Luke 24:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
  footnotes:
  - marker: a
    text: Some manuscripts omit 'after worshiping him.'
    reason: textual_variant
  - marker: b
    text: Or 'after bowing down to him' / 'after paying him homage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예수님께 경배한 뒤, 큰 기쁨으로 예루살렘으로 돌아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘그분께 경배한 뒤’를 생략합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그분께 절한 뒤’ / ‘그분께 경의를 표한 뒤’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσαντες αὐτόν
  english_pob_choice: after worshiping him
  chosen_korean: 예수님께 경배한 뒤
  alternatives_korean:
  - 그에게 절한 뒤
  - 그에게 경의를 표한 뒤
  lexicon: BDAG
  rationale: 부활하신 예수님을 대상으로 한 προσκυνέω는 문맥상 단순한 몸짓보다 경배의 뜻이 더 자연스럽고, ‘뒤’로 분사 앞선 행위를 한국어로 자연스럽게 드러낼 수 있습니다.
- source_word: ὑπέστρεψαν
  english_pob_choice: returned
  chosen_korean: 돌아갔습니다
  alternatives_korean:
  - 되돌아갔습니다
  - 돌아왔습니다
  lexicon: BDAG
  rationale: 본문의 핵심 동사는 ‘돌아가다/되돌아가다’이며, 서술문 합쇼체에서는 ‘돌아갔습니다’가 가장 간명하고 자연스럽습니다.
- source_word: εἰς Ἰερουσαλήμ
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘으로
  alternatives_korean:
  - 예루살렘에
  - 예루살렘 안으로
  lexicon: BDAG
  rationale: 도시 이름 앞의 εἰς는 한국어에서 보통 방향을 나타내는 조사 ‘-으로’가 가장 자연스럽고, ‘안으로’는 과도하게 구체적입니다.
- source_word: μετὰ χαρᾶς μεγάλης
  english_pob_choice: with great joy
  chosen_korean: 큰 기쁨으로
  alternatives_korean:
  - 큰 즐거움으로
  - 매우 기뻐하며
  lexicon: BDAG
  rationale: ‘χαρά’와 ‘μεγάλης’의 결합은 상태를 나타내는 부사적 표현으로 옮기는 것이 자연스럽고, ‘큰 기쁨으로’가 간결하게 강도를 살립니다.
theological_decisions:
- issue: προσκυνέω를 예수님께 적용할 때의 번역 강도
  chosen_reading: 경배한
  alternative_readings:
  - 절한
  - 경의를 표한
  rationale: 부활하신 예수님을 향한 행위는 문맥상 예배적 의미를 충분히 담고 있으므로, 한국어에서 신앙적 무게를 약화시키지 않는 ‘경배’가 적절합니다.
  doctrine_reference: 그리스도론; 번역 원칙
