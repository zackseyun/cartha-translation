  source_fidelity: 그리스어의 αὐτόν은 대명사인데 본문은 이를 ‘예수님’으로 풀어 썼습니다. 문맥상 지시 대상은 분명하지만, 원문의 지시 표현과 본문비평 각주의 표현을 일치시키기 위해 ‘그분’으로 유지하는 편이 더 충실합니다. προσκυνήσαντες의 선행 행위, ὑπέστρεψαν의 귀환, εἰς Ἰερουσαλήμ의 방향, μετὰ χαρᾶς μεγάλης의 큰 기쁨은 정확히 반영되었습니다.
  naturalness: ‘그들은 그분께 경배한 뒤 큰 기쁨으로 예루살렘으로 돌아갔습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그들은’은 원문의 명시된 αὐτοί와 접속사 καί의 서술 연결을 무리 없이 드러냅니다.
  terminology: ‘경배하다’는 이 부활·승천 문맥에서 προσκυνέω의 유력한 의미를 적절히 전달합니다. 각주에서 ‘절하다’와 ‘경의를 표하다’라는 대안을 제시하여 해당 동사의 의미 범위를 보존합니다. ‘예루살렘’ 및 ‘큰 기쁨’도 적절합니다.
