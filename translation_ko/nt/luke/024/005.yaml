  terminology: ‘죽은 자들’, ‘살아 계신 분’은 부활 문맥의 대조와 존칭을 적절히 살립니다. μετά τῶν νεκρῶν의 대안은 해당 구절에 각주를 붙여 제시하는 것이 적절합니다.
