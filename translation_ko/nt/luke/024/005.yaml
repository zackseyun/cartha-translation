id: LUK.24.5
reference: Luke 24:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
  footnotes:
  - marker: a
    text: Or, more literally, “What are you seeking the living one with the dead?” The sense in context is “Why are you seeking the living one among the dead?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 몹시 두려워하여 얼굴을 땅에 대고 있었을 때, 그들이 그들에게 말했습니다. “어찌하여 여러분은 죽은 자들 가운데서 살아 계신 분을 찾고 있습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “죽은 자들과 함께” 또는 “죽은 자들과 더불어”입니다. 문맥상 뜻은 “죽은 자들 가운데서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων δὲ γενομένων
  english_pob_choice: when they became terrified
  chosen_korean: 몹시 두려워하여
  alternatives_korean:
  - 두려워하게 되어
  - 두려움에 사로잡혀
  lexicon: BDAG
  rationale: 겐itive absolute의 선행 상황을 한국어 부사절로 풀면서, ἐμφόβων의 강한 두려움을 ‘몹시’로 살렸습니다.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  english_pob_choice: bowed their faces to the ground
  chosen_korean: 얼굴을 땅에 대고
  alternatives_korean:
  - 얼굴을 땅으로 숙이고
  - 얼굴을 땅에 숙이고
  lexicon: BDAG
  rationale: 직역적 이미지인 ‘얼굴’을 유지하되, 한국어에서 자연스러운 동작 표현으로 ‘땅에 대고’를 택해 경외와 두려움의 자세를 드러냈습니다.
- source_word: Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν
  english_pob_choice: Why are you seeking the living one among the dead?
  chosen_korean: 어찌하여 여러분은 죽은 자들 가운데서 살아 계신 분을 찾고 있습니까?
  alternatives_korean:
  - 왜 죽은 자들 가운데서 살아 계신 분을 찾고 있습니까?
  - 무엇을 죽은 자들 가운데서 찾고 있습니까?
  lexicon: BDAG
  rationale: τί는 문맥상 ‘왜’의 도전적 질문으로 이해했고, τὸν ζῶντα는 인격적 대상을 분명히 하는 ‘살아 계신 분’으로 옮겼습니다.
theological_decisions:
- issue: τὸν ζῶντα의 부활 암시
  chosen_reading: ‘살아 계신 분’으로 옮겨 예수께서 죽은 자들과 대비되는 살아 계신 존재임을 드러냈습니다.
  alternative_readings:
  - ‘살아 있는 분’
  - ‘산 자’
  rationale: 문맥상 부활을 설명적으로 덧붙이지 않으면서도, 대조와 충격을 유지하는 표현이 필요했습니다.
  doctrine_reference: 본문이 말하는 부활의 함의를 보존하되 과잉해석은 피합니다.
