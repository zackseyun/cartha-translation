  source_fidelity: 핵심 의미는 대체로 충실하지만, 주절 화자와 수신자가 모두 ‘그들’로 반복되어 한국어 본문에서는 누가 말하는지 불필요하게 모호합니다. 헬라어의 αὐτάς는 앞선 여자들을 가리키므로 한국어에서는 ‘여자들에게’로 밝혀 주는 것이 자연스럽고 의미를 보존합니다. κλινουσῶν은 ‘얼굴을 땅으로 숙이고’가 동작과 방향을 더 직접적으로 반영합니다.
