- from: 그들이 가고 있던 마을에 가까이 이르자, 예수께서는 더 멀리 가실 것처럼 행동하셨습니다.[a]
  to: 그들이 가던 마을에 가까이 이르렀을 때, 예수께서는 더 멀리 가시는 듯이 행동하셨습니다.[a]
  rationale: 관계절을 한국어 목적지 표현에 맞게 다듬고, ‘가실 것처럼’을 진행 중인 외양을 나타내는 ‘가시는 듯이’로 바꾸었습니다. 이는 예수께서 더 나아가려는 의도를 실제로 가졌는지 여부를 결정하지 않으면서, προσποιήσατο의 ‘마치 그러한 것처럼 행동하다’라는 의미를 보존합니다.
