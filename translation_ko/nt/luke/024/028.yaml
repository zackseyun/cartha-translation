  naturalness: ‘그들이 가고 있던 마을’도 이해되지만, 목적지로 향하고 있었다는 뜻에는 ‘그들이 가던 마을’이 더 자연스럽고 간결합니다. 또한 ‘더 멀리 가시는 듯이 행동하셨습니다’가 현대 표준 한국어에서 원문의 서술을 매끄럽게 전달합니다.
