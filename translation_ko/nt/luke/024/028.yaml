  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
  footnotes:
  - marker: a
    text: Or, 'pretended to be going farther' or 'made as if to go farther.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가던 마을에 가까이 이르렀을 때, 예수께서는 더 멀리 가시는 듯이 행동하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 멀리 가는 척하셨습니다’, ‘더 멀리 가시는 것처럼 보이셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  english_pob_choice: came near
  chosen_korean: 가까이 이르자
  alternatives_korean:
  - 가까이 왔을 때
  - 다가가자
  lexicon: BDAG
  rationale: ἐγγίζω의 이동 완료를 자연스러운 서술로 살리면서, 단순한 도착보다 ‘가까워짐’의 의미를 유지했습니다.
- source_word: κώμην
  english_pob_choice: village
  chosen_korean: 마을
  alternatives_korean:
  - 촌락
  - 마을집
  lexicon: BDAG
  rationale: κώμη는 도시보다 작은 거주지를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘마을’로 옮겼습니다.
- source_word: προσεποιήσατο
  english_pob_choice: acted as though
  chosen_korean: '...처럼 행동하셨습니다'
  alternatives_korean:
  - '...인 척하셨습니다'
  - '...하는 듯하셨습니다'
  lexicon: BDAG
  rationale: ‘pretended’보다 덜 강한 ‘acted as though’의 뉘앙스를 살려, 예수께서 계속 가실 것처럼 보이게 하셨다는 서술을 유지했습니다.
- source_word: πορρώτερον πορεύεσθαι
  english_pob_choice: were going farther
  chosen_korean: 더 멀리 가실 것
  alternatives_korean:
  - 더 멀리 가시는 것
  - 더 멀리 가시려는 것
  lexicon: BDAG
  rationale: 목적지에서 더 멀어지는 진행성을 살려 ‘더 멀리 가실 것’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: προσεποιήσατο의 행위 해석
  chosen_reading: 예수께서는 더 멀리 가실 것처럼 행동하셨습니다.
  alternative_readings:
  - 예수께서는 더 멀리 가시는 척하셨습니다.
  - 예수께서는 더 멀리 가려는 듯하셨습니다.
  rationale: 원문은 예수께서 실제로 떠나려 하셨는지, 또는 단지 그렇게 보이게 하셨는지를 서술할 뿐이므로, ‘pretended’처럼 도덕적 판단을 덧씌우지 않고 서술상의 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
