  lexicon: BDAG
  rationale: 몸의 구체적 부위를 직역해 예수의 육체성을 분명히 드러냈습니다.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  english_pob_choice: that it is I myself
  chosen_korean: 이것이 바로 나 자신입니다
  alternatives_korean:
  - 내가 바로 그 사람입니다
  - 바로 내가 나 자신입니다
  lexicon: BDAG
  rationale: ἐγώ와 αὐτός의 강조를 한국어의 「바로 … 자신」으로 살려, 단순한 동일시보다 강한 자기 확인을 전달했습니다.
- source_word: ψηλαφήσατέ με
  english_pob_choice: Touch me
  chosen_korean: 나를 만져 보십시오
  alternatives_korean:
  - 나를 더듬어 보십시오
  - 나를 만지십시오
  lexicon: BDAG
  rationale: 검증을 위한 접촉의 뉘앙스를 살리기 위해 「만져 보십시오」로 옮겼고, 너무 생경한 「더듬다」는 피했습니다.
- source_word: πνεῦμα
  english_pob_choice: a spirit
  chosen_korean: 영
  alternatives_korean:
