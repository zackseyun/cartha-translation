id: LUK.24.39
reference: Luke 24:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
  footnotes:
  - marker: a
    text: 'Or, ''that I am he.'' The Greek expression is emphatic: ''I myself am [the one].'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'feel me' or 'handle me.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'a ghost.' The Greek word is 'spirit.'
    reason: alternative_reading
  - marker: d
    text: Or 'Look at my hands and my feet, that it is I myself.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 손과 내 발을 보십시오. 이것이 바로 나 자신입니다. 나를 만져 보고 살펴보십시오. 영은 살과 뼈가 없지만, 여러분이 보는 대로 나는 그렇습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 바로 그 사람이다’라는 뜻입니다. 원문은 ἐγώ와 αὐτός를 함께 써서 자기 동일성을 강하게 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘느껴 보십시오’, ‘만져 확인해 보십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘유령’입니다. 원문의 단어는 ‘영’입니다.
    reason: alternative_reading
  - marker: d
    text: 다른 방식으로는 ‘내 손과 내 발을 보십시오. 그것이 바로 나 자신입니다.’라고도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἴδετε
  english_pob_choice: Look at / see
  chosen_korean: 보십시오
  alternatives_korean:
  - 살펴보십시오
  - 보십시오, 확인하십시오
  lexicon: BDAG
  rationale: 시각적 확인을 요구하는 복수 명령형을 현대 한국어의 자연스러운 공손체로 옮겼습니다.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  english_pob_choice: my hands and my feet
  chosen_korean: 내 손과 내 발
  alternatives_korean:
  - 제 손과 제 발
  - 내 양손과 발
  lexicon: BDAG
  rationale: 몸의 구체적 부위를 직역해 예수의 육체성을 분명히 드러냈습니다.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  english_pob_choice: that it is I myself
  chosen_korean: 이것이 바로 나 자신입니다
  alternatives_korean:
  - 내가 바로 그 사람입니다
  - 바로 내가 나 자신입니다
  lexicon: BDAG
  rationale: ἐγώ와 αὐτός의 강조를 한국어의 「바로 … 자신」으로 살려, 단순한 동일시보다 강한 자기 확인을 전달했습니다.
- source_word: ψηλαφήσατέ με
  english_pob_choice: Touch me
  chosen_korean: 나를 만져 보십시오
  alternatives_korean:
  - 나를 더듬어 보십시오
  - 나를 만지십시오
  lexicon: BDAG
  rationale: 검증을 위한 접촉의 뉘앙스를 살리기 위해 「만져 보십시오」로 옮겼고, 너무 생경한 「더듬다」는 피했습니다.
- source_word: πνεῦμα
  english_pob_choice: a spirit
  chosen_korean: 영
  alternatives_korean:
  - 유령
  - 혼령
  lexicon: BDAG
  rationale: 원문의 대조는 비물질적 존재와의 대비이므로, 교회식 고정어보다 원어의 일반 의미를 살린 「영」을 택했습니다.
- source_word: σάρκα καὶ ὀστέα
  english_pob_choice: flesh and bones
  chosen_korean: 살과 뼈
  alternatives_korean:
  - 육과 뼈
  - 살과 뼈들
  lexicon: BDAG
  rationale: 관용적인 한국어 신체 표현을 사용해 문자적이고 물리적인 대비를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 부활하신 예수의 몸의 실제성
  chosen_reading: 예수의 말을 육체적 실재를 분명히 확인하는 진술로 그대로 유지했습니다.
  alternative_readings:
  - 영적 부활체로 완화하는 해석
  - 상징적 자기계시로 약화하는 번역
  rationale: 원문은 보고 만지는 명령과 ‘살과 뼈’의 대비로 물질적 실재를 강하게 강조하므로, 그 긴장을 약화하지 않고 직설적으로 살렸습니다.
  doctrine_reference: Chalcedon(451)의 두 본성 고백과 본문 자체의 문맥
- issue: ὅτι의 처리
  chosen_reading: 첫 번째 ὅτι를 내용절로, 두 번째 ὅτι를 이유절로 반영해 문맥의 흐름을 자연스럽게 살렸습니다.
  alternative_readings:
  - 두 곳 모두 단순히 ‘~라는 것’으로 처리
  - 모두 ‘왜냐하면’으로 처리
  rationale: 첫 절은 무엇을 알아보아야 하는지의 내용이 앞서고, 둘째 절은 그 이유를 제시하므로 한국어에서는 각각 ‘이것이…’와 ‘-지만’/‘…입니다’ 구조로 구분하는 편이 의미가 분명합니다.
  doctrine_reference: 번역상의 문맥 구분
