id: LUK.24.29
reference: Luke 24:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
  footnotes:
  - marker: a
    text: Or “they pressed him” or traditionally “they constrained him.”
    reason: lexical_alternative
  - marker: b
    text: Or “the day is now far spent.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그를 강하게 권하며 말했습니다. 「우리와 함께 머무르십시오. 저녁때가 가까웠고 날이 이미 기울었습니다」. 그리고 그는 그들과 함께 머무르려고 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 붙들어 권했습니다” 또는 전통적으로 “그를 억지로 붙잡았습니다”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “날이 이제 한창 지나갔습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  english_pob_choice: urged him strongly
  chosen_korean: 강하게 권하며
  alternatives_korean:
  - 간절히 권하며
  - 강권하며
  - 붙들어 권하며
  lexicon: BDAG
  rationale: 중간태의 뉘앙스는 물리적 강제가 아니라 간절한 요청과 설득이므로, 현대 한국어에서는 자연스럽고 강도를 살리는 「강하게 권하다」가 적절합니다.
- source_word: Μεῖνον
  english_pob_choice: Stay
  chosen_korean: 머무르십시오
  alternatives_korean:
  - 머무르세요
  - 계십시오
  - 남아 있으십시오
  lexicon: BDAG
  rationale: 환대의 자리에서의 요청이므로, 합쇼체 명령형으로 정중하면서도 직접적인 「머무르십시오」가 잘 맞습니다.
- source_word: πρὸς ἑσπέραν ἐστὶν
  english_pob_choice: it is toward evening
  chosen_korean: 저녁때가 가까웠고
  alternatives_korean:
  - 저녁이 되어 가고 있고
  - 해질 무렵이고
  - 저녁때가 되었고
  lexicon: BDAG
  rationale: πρὸς ἑσπέραν의 방향성을 살려 단순히 “저녁이다”로 평평하게 만들지 않고, 시간의 접근을 드러내는 표현으로 옮겼습니다.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  english_pob_choice: the day has already declined
  chosen_korean: 날이 이미 기울었습니다
  alternatives_korean:
  - 날이 이미 저물었습니다
  - 날이 이미 저녁으로 기울었습니다
  - 날이 벌써 저물어 갑니다
  lexicon: BDAG
  rationale: κλίνω의 ‘기울다/굽다’ 이미지를 살리면서, 고어적 「한창 지나갔다」보다 현대어로 이해 가능한 「기울었습니다」를 택했습니다.
theological_decisions:
- issue: 예수에게 붙는 청유의 존댓말 수준
  chosen_reading: 예수께 드리는 요청을 합쇼체로 옮겨, 제자들이 손님이신 예수께 정중히 간청하는 장면으로 보이게 했습니다.
  alternative_readings:
  - 평서형으로 낮춰 번역
  - 보다 친근한 해요체로 번역
  rationale: 문맥상 환대의 청유이며, 한국어 독자는 존대가 관계의 긴장과 예의를 더 잘 드러내므로 합쇼체가 적절합니다.
  doctrine_reference: 기독론/서사 문체
