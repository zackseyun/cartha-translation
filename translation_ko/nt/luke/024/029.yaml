  source_fidelity: παρεβιάσαντο의 중간태는 물리적 강제보다 끈질기고 간절한 권유를 가리키므로, ‘간절히 권하며’가 적절합니다. πρὸς ἑσπέραν과 κέκλικεν ἤδη ἡ ἡμέρα는 각각 저녁이 가까워짐과 날이 이미 기울었음을 잘 보존해야 합니다. εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς는 ‘그들과 함께 머무르려고 들어갔습니다’로 충실히 옮길 수 있습니다.
  naturalness: 초안의 ‘강하게 권하며’는 현대 한국어에서 다소 직역투입니다. ‘간절히 권하며’ 또는 ‘강권하며’가 더 자연스럽습니다. 또한 각주 표지는 해당 어휘에 직접 붙여야 하며, 문장 끝에 함께 몰아 두면 무엇을 설명하는지 불분명합니다.
  terminology: ‘머무르십시오’는 환대의 요청에 맞는 현대 합쇼체입니다. ‘날이 이미 기울었습니다’도 κλίνω의 비유적 이미지를 자연스럽게 보존합니다. ‘억지로 붙잡았습니다’는 물리적 강제를 지나치게 암시하므로 각주 대안으로 적절하지 않습니다.
