lexical_decisions:
- source_word: εὗρον
  english_pob_choice: they found
  chosen_korean: 그들은 … 발견했습니다
  alternatives_korean:
  - 그들은 … 찾았습니다
  - 그들은 … 알아냈습니다
  lexicon: BDAG
  rationale: 과거 능동 서술로서 문맥상 새 사실을 확인하는 의미이므로, 자연스러운 현대 한국어의 ‘발견했습니다’로 옮겼습니다.
- source_word: δὲ
  english_pob_choice: And
  chosen_korean: 그리고/연결 생략
  alternatives_korean:
  - 그리고
  - 그런데
  lexicon: BDAG
  rationale: δέ는 여기서 강한 대조가 아니라 서술 전개를 잇는 약한 접속이므로, 한국어에서는 자연성을 위해 별도 접속어를 두지 않았습니다.
- source_word: ἀποκεκυλισμένον
  english_pob_choice: rolled away
  chosen_korean: 굴려져 치워진
  alternatives_korean:
  - 굴려져 옮겨진
  - 굴려져 옆으로 치워진
  lexicon: BDAG
  rationale: 완료 수동 분사로서 돌이 이미 옮겨져 있는 결과 상태를 나타내므로, ‘굴려져 치워진’이 동작과 परिणательного 상태를 함께 살립니다.
- source_word: μνημείου
  english_pob_choice: tomb
  chosen_korean: 무덤
  alternatives_korean:
  - 묘
  - 묘소
  - 장지
  lexicon: BDAG
  rationale: 복음서의 장례 문맥에서 μνημεῖον은 ‘무덤’이 가장 직접적이고 자연스러운 대응어입니다.
theological_decisions:
- issue: 주어가 앞절에서 이어지는 암시된 복수 주어임
  chosen_reading: 그들은 … 발견했습니다
  alternative_readings:
  - 발견했습니다
  - 여인들은 … 발견했습니다
  rationale: 그리스어는 주어를 반복하지 않지만 복수 동사로 앞절의 여인들을 가리키므로, 한국어는 문맥 회복을 위해 ‘그들은’을 보충했습니다.
  doctrine_reference: Translation philosophy §6 (Readable modern Korean without obscuring discourse flow)
