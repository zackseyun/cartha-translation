revisions:
- from: 그들이 바로 그 시간에 일어나 예루살렘으로 돌아가 보니, 열한 제자와 그들과 함께한 사람들이 모여 있었습니다.[a]
  to: 그들이 바로 그 시간에 일어나 예루살렘으로 돌아가서, 그 열한 사람과 그들과 함께 있던 이들이 모여 있는 것을 발견했습니다.[a]
  rationale: 원문에 없는 ‘제자’라는 보충을 제거하고, εὗρον의 직접적인 의미를 반영했습니다. ‘모여 있는’은 ἠθροισμένους의 결과 상태를 유지하며, 수식 범위가 ‘그 열한 사람’과 ‘그들과 함께 있던 이들’ 모두에 미치도록 했습니다. 각주는 중복을 없애 실질적 어휘 대안을 제시하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:50Z'
review_pass:
  verdict: revise
  source_fidelity: ‘열한 제자’는 그리스어의 관용적 집단 명칭인 τοὺς ἕνδεκα에 ‘제자’를 보충합니다. 문맥상 가리키는 대상은 분명하지만, 본문에 없는 직분·신분 표지는 보충하지 않는 편이 원문에 더 충실합니다. 또한 εὗρον은 ‘발견했습니다’로 명시하는 것이 ‘돌아가 보니’보다 직접적입니다.
  naturalness: ‘그 열한 사람’은 한국어에서 다소 낯설 수 있으나, 정관사와 집단 명칭의 성격을 보존하면서 자연스럽게 읽힙니다. ‘모여 있는 것을 발견했습니다’는 완료 수동 분사가 나타내는 이미 형성된 상태를 무리 없이 반영합니다.
  terminology: 예루살렘은 표준 표기입니다. ‘그 열한 사람’은 ‘열한 제자’나 ‘열한 사도’처럼 원문에 없는 호칭을 더하지 않으며, 본문의 관용적 집단 지칭을 유지합니다.
  issues:
  - severity: medium
    issue: ‘열한 제자’가 원문에 없는 ‘제자’를 보충함
    rationale: τοὺς ἕνδεκα은 직역하면 ‘그 열한 사람’이며, 본문은 μαθηταί나 ἀπόστολοι를 사용하지 않습니다. 신분 표지를 보충하지 않는 번역이 더 안전합니다.
  - severity: low
    issue: 각주가 본문 표현을 그대로 반복하여 대안 기능을 하지 못함
    rationale: 현 각주의 ‘또는 모여 있었습니다’는 본문과 동일합니다. ‘함께 모여 있었습니다’처럼 실제 어휘적 대안을 제시해야 합니다.
  revised_text: 그들이 바로 그 시간에 일어나 예루살렘으로 돌아가서, 그 열한 사람과 그들과 함께 있던 이들이 모여 있는 것을 발견했습니다.[a]
