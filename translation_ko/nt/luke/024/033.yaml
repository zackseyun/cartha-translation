id: LUK.24.33
reference: Luke 24:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
  footnotes:
  - marker: a
    text: Or 'assembled.' The Greek participle describes them as already in a gathered state when they were found.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 바로 그 시간에 일어나 예루살렘으로 돌아가 보니, 열한 제자와 그들과 함께한 사람들이 모여 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모여 있었습니다.’ 그리스어 분사는 그들이 발견될 때 이미 모여 있는 상태였음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  english_pob_choice: rising
  chosen_korean: 일어나
  alternatives_korean:
  - 몸을 일으켜
  - 일어서서
  lexicon: BDAG
  rationale: 행동의 선행성을 살리면서도 한국어 서술에서 자연스럽게 이어지도록 ‘일어나’로 옮겼습니다.
- source_word: αὐτῇ τῇ ὥρᾳ
  english_pob_choice: that very hour
  chosen_korean: 바로 그 시간에
  alternatives_korean:
  - 그때 바로
  - 그 순간에
  lexicon: BDAG
  rationale: 즉시성을 드러내는 관용구이므로, 시간 지시와 강조를 함께 살리는 표현을 선택했습니다.
- source_word: ἠθροισμένους
  english_pob_choice: gathered together
  chosen_korean: 모여 있었습니다
  alternatives_korean:
  - 함께 모여 있었습니다
  - 모여 있더군요
  lexicon: BDAG
  rationale: 완료 수동 분사가 나타내는 ‘이미 모여 있는 상태’를 한국어 상태 표현으로 자연스럽게 반영했습니다.
- source_word: τοὺς ἕνδεκα / τοὺς σὺν αὐτοῖς
  english_pob_choice: the Eleven and those with them
  chosen_korean: 열한 제자와 그들과 함께한 사람들
  alternatives_korean:
  - 열한 사람과 그들과 함께한 이들
  - 열한 명과 동행한 사람들
  lexicon: BDAG
  rationale: ‘the Eleven’은 사도 집단의 통칭을 직접 살리되, 한국어에서는 문맥상 ‘제자’를 보충해 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: ‘the Eleven’의 집단 명칭 유지
  chosen_reading: ‘열한 제자’로 옮겨, 유다의 부재 이후에도 사용되는 관용적 집단 명칭을 유지했습니다.
  alternative_readings:
  - 열한 사도
  - 열한 명의 제자
  rationale: 본문은 정확한 참석자 재구성보다 Luke의 서술어법을 따르므로, 집단 표지를 과도하게 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
