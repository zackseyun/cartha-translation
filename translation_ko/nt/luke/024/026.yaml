review_pass:
  verdict: revise
  source_fidelity: 수정안은 οὐχὶ의 긍정 답변을 기대하는 반문, ταῦτα의 복수 지시, ἔδει의 과거적 필연성, 그리고 고난과 영광으로 들어감의 병렬을 충실히 반영합니다. ‘했어야 했던’은 불필요하게 중복되므로 ‘들어가셔야 했던’으로 옮겨 미완료 과거 문맥의 필연성을 자연스럽게 나타냈습니다.
  naturalness: 초안의 ‘이것이 그 메시아께서 … 하는 것이 아니겠습니까?’는 주어와 보어 구성이 어색하고 문법적으로 불안정합니다. ‘메시아께서 … 하셔야 했던 것이 아니겠습니까?’로 고치면 현대 표준어 합쇼체의 자연스러운 반문이 됩니다.
  terminology: Χριστός는 문맥상 직함의 뜻을 드러내어 ‘메시아’로 유지했습니다. δόξα는 ‘영광’, αὐτοῦ는 ‘자신의’로 옮겨 소유 관계를 보존했습니다. 메시아를 가리키는 높임을 적용해 ‘께서/겪으시고/들어가셔야’로 통일했습니다.
  issues:
  - severity: high
    issue: 문장 골격의 오류
    rationale: ‘이것이 그 메시아께서 … 해야 하는 것이 아니겠습니까?’는 ‘이것이’와 뒤의 절이 자연스럽게 연결되지 않습니다. 원문의 의문은 ‘메시아가 이런 일을 겪고 영광에 들어갈 필요가 있지 않았는가’이므로 메시아를 문장의 주어로 세워야 합니다.
  - severity: medium
