base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
  footnotes:
  - marker: a
    text: Or 'the Christ.' The Greek title Χριστός is rendered 'Messiah' here to preserve its meaning in the scriptural-fulfillment context.
    reason: alternative_reading
translation:
  language: ko
  text: 메시아께서 이런 일들을 겪으시고 자신의 영광에 들어가셔야 했던 것이 아니겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리스도.’ 여기서 그리스어 칭호 Χριστός는 성경 성취의 문맥에서 그 의미를 살리기 위해 ‘메시아’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  english_pob_choice: Was it not
  chosen_korean: 아니겠습니까
  alternatives_korean:
  - 그렇지 않습니까
  - ~하지 않겠습니까
  lexicon: BDAG
  rationale: 기대하는 긍정 대답을 전제하는 반문으로 자연스럽게 살리되, 현대 한국어 합쇼체의 질문 문형을 유지했습니다.
- source_word: τὸν χριστὸν
  english_pob_choice: the Messiah
  chosen_korean: 그 메시아
  alternatives_korean:
  - 그리스도
  - 메시아
  lexicon: BDAG
  rationale: 본문의 Χριστός는 직함으로서 메시아를 뜻하므로, POB의 용례를 따라 ‘메시아’로 옮기고 문맥상 지시를 살리기 위해 관사 기능을 ‘그’로 반영했습니다.
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 일들을
  alternatives_korean:
  - 이 일들을
  - 이것들
  lexicon: BDAG
  rationale: 이미 앞서 언급된 수난들을 가리키는 복수 지시를 한국어에서 자연스럽게 표현하되, 단순 지시어보다 사건성 있는 ‘일들’을 택했습니다.
- source_word: ἔδει ... παθεῖν
  english_pob_choice: was necessary ... to suffer
  chosen_korean: 겪고 ... 해야 하는 것이
  alternatives_korean:
  - 고난받아야 하는 것이
  - 당하셔야 하는 것이
  lexicon: BDAG
  rationale: δεῖ의 신적 필연성과 πάσχειν의 수난 의미를 함께 살리기 위해 ‘해야 하는’ 구조를 쓰되, ‘겪다’로 고난의 실제 체험성을 드러냈습니다.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  english_pob_choice: to enter into his glory
  chosen_korean: 자기의 영광에 들어가야
  alternatives_korean:
  - 그의 영광에 들어가야
  - 영광에 들어가야
  lexicon: BDAG
  rationale: εἰς를 살려 ‘들어가다’의 방향성을 유지했고, αὐτοῦ는 앞선 주어를 다시 받는 소유격이므로 ‘자기의’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: Χριστός의 번역 방식
  chosen_reading: 메시아로 번역
  alternative_readings:
  - 그리스도로 음역/관용 번역
  rationale: 예수의 고난과 영광이 성경 성취의 맥락에서 말해지는 본문이므로, 직함의 의미를 드러내는 ‘메시아’가 더 적절합니다.
  doctrine_reference: 'POB contested terms: Χριστός as title → Messiah'
- issue: ἔδει의 필연성
  chosen_reading: 하나님의 구원 계획과 성경 성취를 내포한 ‘해야 하는’ 필연성
  alternative_readings:
  - 단순한 사건의 불가피성
  - 완화된 가능성 표현
  rationale: 누가복음의 부활 후 해석 담화에서 이 필연성은 우연이 아니라 하나님의 계획과 성경의 성취를 가리키므로, 그 긴장을 약화하지 않도록 유지했습니다.
  doctrine_reference: Luke resurrection discourse; preserve theological necessity
