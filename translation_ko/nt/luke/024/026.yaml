- from: 이것이 그 메시아께서 이런 일들을 겪고 자기의 영광에 들어가야 하는 것이 아니겠습니까?[a]
  to: 메시아께서 이런 일들을 겪으시고 자신의 영광에 들어가셔야 했던 것이 아니겠습니까?[a]
  rationale: 초안의 문법적으로 어색한 ‘이것이’ 구문을 제거하고, 메시아를 주어로 하는 한국어 반문으로 재구성했습니다. 또한 ‘해야 하는’을 ‘하셔야 했던’으로 고쳐 원문의 과거적 필연성을 살렸습니다. 본문의 의미, 병렬 구조, 그리고 ‘그의 영광’이라는 소유 관계는 유지했습니다.
