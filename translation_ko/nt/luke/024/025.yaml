revisions:
- from: 예수님께서 그들에게 말씀하셨습니다. 「어리석은 사람들아, 그리고 마음이 둔하여 예언자들이 말한 모든 것을 믿는 데 더디구나!」[a][b][c]
  to: 예수님께서 그들에게 말씀하셨습니다. 「어리석은 사람들아[a], 예언자들이 말한[c] 모든 것을 믿는 데 마음이 둔하여[b] 더딘 사람들이여!」
  rationale: 호격을 유지하면서 두 질책을 한국어의 자연스러운 병렬 구조로 재구성했습니다. ‘마음’과 ‘믿는 데’를 보존하여 이해와 신뢰 모두에 관한 원문의 초점을 유지했으며, 각주 대안과 표지를 해당 원어 표현에 정확히 맞추었습니다.
