id: LUK.24.25
reference: Luke 24:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
  footnotes:
  - marker: a
    text: Or “senseless” or “without understanding.”
    reason: lexical_alternative
  - marker: b
    text: Literally “slow of heart,” an idiom for being sluggish in the inner person to trust and receive what God has said.
    reason: cultural_note
  - marker: c
    text: Or “spoke.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 그들에게 말씀하셨습니다. 「어리석은 사람들아, 그리고 마음이 둔하여 예언자들이 말한 모든 것을 믿는 데 더디구나!」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무감각한” 또는 “이해하지 못하는.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “마음이 더딘”이라는 뜻으로, 하나님께서 말씀하신 것을 신뢰하고 받아들이는 내면의 반응이 둔하다는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “말하셨다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  english_pob_choice: O
  chosen_korean: 어리석은 사람들아
  alternatives_korean:
  - 오
  - 아
  lexicon: BDAG
  rationale: 헬라어 감탄사로 시작하는 직접적 질책을 한국어 호격 감탄으로 옮겼습니다. ‘오’보다 ‘어리석은 사람들아’가 한국어 문장 안에서 자연스럽고, 뒤의 호칭을 곧바로 실어 주어 원문의 꾸짖는 힘을 유지합니다.
- source_word: ἀνόητοι
  english_pob_choice: foolish ones
  chosen_korean: 어리석은 사람들
  alternatives_korean:
  - 무지한 사람들
  - 분별 없는 사람들
  - 어리석은 자들
  lexicon: BDAG
  rationale: 단순한 지적 부족만이 아니라 이해와 분별의 결핍을 드러내는 질책으로 보아 ‘어리석은 사람들’로 옮겼습니다. ‘자들’보다 ‘사람들’이 현대 한국어에서 더 자연스럽습니다.
- source_word: βραδεῖς τῇ καρδίᾳ
  english_pob_choice: slow of heart
  chosen_korean: 마음이 둔하여
  alternatives_korean:
  - 마음이 더뎌
  - 속마음이 둔하여
  - 마음이 느려
  lexicon: BDAG
  rationale: ‘heart’를 단순한 감정이 아니라 내면 전체로 보는 성경적 인류학을 살리면서, 한국어로는 ‘마음이 둔하여’가 지각과 신뢰의 둔함을 함께 나타냅니다. 직역형 ‘마음이 더뎌’보다 의미가 분명합니다.
- source_word: τοῦ πιστεύειν
  english_pob_choice: to believe
  chosen_korean: 믿는 데
  alternatives_korean:
  - 믿기
  - 믿는 일에
  - 믿도록
  lexicon: BDAG
  rationale: 부정사 구문이 ‘더딘’ 상태의 방향을 나타내므로 한국어에서는 ‘믿는 데’로 자연스럽게 처리했습니다. 행위 자체보다 그 행위에 이르는 반응의 느림을 드러냅니다.
- source_word: ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται
  english_pob_choice: all that the prophets have spoken
  chosen_korean: 예언자들이 말한 모든 것을
  alternatives_korean:
  - 예언자들이 선포한 모든 것을
  - 예언자들이 말해 온 모든 것을
  - 예언자들이 한 말 모두를
  lexicon: BDAG
  rationale: 전치사와 관계절의 포괄성을 ‘모든 것을’으로 압축하되, 예언자들의 증언 전체를 가리키는 의미를 유지했습니다. POB의 ‘spoken’에 맞춰 ‘말한’으로 두어 선포의 성격을 보존했습니다.
theological_decisions:
- issue: 예수님의 질책의 초점
  chosen_reading: 지적 무지와 더불어 예언자들의 말을 신뢰하지 못하는 내면의 둔함을 함께 드러내는 질책으로 옮겼습니다.
  alternative_readings:
  - 도덕적 비난 중심으로 읽는 해석
  - 단순한 이해 부족으로만 읽는 해석
  rationale: ‘어리석은 사람들’과 ‘마음이 둔하여 믿는 데 더디구나’는 함께 읽혀야 하므로, 번역도 이해와 신뢰의 두 측면을 모두 유지해야 합니다.
  doctrine_reference: Translation philosophy §3, §6
