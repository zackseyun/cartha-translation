id: LUK.24.27
reference: Luke 24:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
  footnotes:
  - marker: a
    text: Or 'explained' or 'expounded.' The Greek verb can denote detailed interpretation.
    reason: lexical_alternative
  - marker: b
    text: '''Moses and all the Prophets'' refers to the scriptural writings associated with Moses and the prophetic books.'
    reason: cultural_note
translation:
  language: ko
  text: 모세의 글과 모든 예언서에서 시작하여,[a] 성경 전체에 걸쳐 자신에 관한 것들을 그들에게 풀어 설명해 주셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모세의 글’과 ‘모든 예언서’는 모세와 예언자들의 이름으로 가리킨 성경 문헌들을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 διερμήνευσεν은 성경의 뜻을 자세히 풀어 설명하거나 해석하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν
  english_pob_choice: beginning with Moses and all the Prophets
  chosen_korean: 모세와 모든 예언서로부터 시작하여
  alternatives_korean:
  - 모세와 모든 예언자들로부터 시작하여
  - 모세에서 시작하여 모든 예언서까지
  lexicon: BDAG
  rationale: ἀπό는 여기서 단순한 출발점이 아니라 성경 해설을 시작하는 범위를 가리키므로, 한국어도 ‘~로부터 시작하여’로 옮겨 자연스러운 전개를 살렸습니다. πάντων τῶν προφητῶν은 인물 일반보다 성경 범주를 가리키는 것으로 보아 ‘예언서’로 처리했습니다.
- source_word: διερμήνευσεν
  english_pob_choice: interpreted
  chosen_korean: 풀어 설명하셨습니다
  alternatives_korean:
  - 해석하셨습니다
  - 설명하셨습니다
  - 주석하셨습니다
  lexicon: BDAG
  rationale: 동사는 단순 설명보다 성경의 뜻을 풀어 밝히는 해석 행위를 가리키므로, 현대 한국어에서 의미를 드러내는 ‘풀어 설명하다’가 가장 적절합니다.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  english_pob_choice: in all the Scriptures
  chosen_korean: 모든 성경에서
  alternatives_korean:
  - 모든 성경 안에서
  - 모든 성경 구절에서
  lexicon: BDAG
  rationale: γραφή는 여기서 성경 문헌 전체를 가리키므로, 한국어도 복수적 범위를 살린 ‘모든 성경에서’로 옮겼습니다.
- source_word: τὰ περὶ ἑαυτοῦ
  english_pob_choice: the things concerning himself
  chosen_korean: 자기 자신에 관한 것들
  alternatives_korean:
  - 자기에 관한 일들
  - 자기와 관련된 것들
  lexicon: BDAG
  rationale: 중성 복수는 특정 예언 한두 개보다 더 넓은 ‘사항들/내용들’을 가리킬 수 있으므로, 범위를 좁히지 않고 ‘것들’로 보존했습니다.
theological_decisions:
- issue: 예수의 성경 해석 범위
  chosen_reading: 본문은 예수께서 성경 전체에서 자신에 관한 것들을 설명하셨다고 말하며, 이를 단일한 예언 범주로 제한하지 않습니다.
  alternative_readings:
  - 직접적인 메시아 예언만 가리킴
  - 구약의 모든 본문이 각각 직접 예수를 가리킴
  rationale: 원문은 모세와 예언서, 그리고 모든 성경을 포괄하되 해석 방식의 세부 범주는 규정하지 않으므로, 그 긴장을 그대로 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
