  source_fidelity: 개정이 필요합니다. ‘모세와 모든 예언서로부터 시작하여’는 모세와 예언서를 병렬하는 방식이 어색하며, 원문의 성경 문헌 범주를 한국어에서 충분히 자연스럽게 드러내지 못합니다. ‘모세의 글과 모든 예언서에서 시작하여’는 Μωϋσέως와 πάντων τῶν προφητῶν의 정경적·환유적 용법을 자연스럽게 보존합니다. ‘성경 전체에 걸쳐’는 ἐν πάσαις ταῖς γραφαῖς의 포괄성을 적절히 전달하며, ‘자신에 관한 것들’은 τὰ περὶ ἑαυτοῦ의 넓고 비특정적인 범위를 유지합니다.
  naturalness: ‘모세의 글과 모든 예언서에서 시작하여’ 및 ‘성경 전체에 걸쳐’가 현대 표준 한국어에서 더 자연스럽습니다. ‘풀어 설명해 주셨습니다’는 합쇼체를 지키면서 διερμήνευσεν의 해설·해석적 성격을 무리 없이 나타냅니다.
  terminology: ‘예언서’는 여기서 예언자 개인들이 아니라 성경의 문헌 범주를 가리키는 문맥상 적절합니다. ‘모세의 글’은 모세 개인을 단순히 지칭하는 것으로 오해될 수 있는 여지를 줄이되, 본문이 특정 문헌 목록이나 해석 방법을 규정한다고 과도하게 구체화하지 않습니다.
