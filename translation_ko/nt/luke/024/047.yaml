  source_fidelity: 개정이 필요합니다. SBLGNT의 μετάνοιαν καὶ ἄφεσιν ἁμαρτιῶν은 καὶ로 연결된 두 명사를 우선적으로 ‘회개와 죄 사함’으로 옮기는 것이 형태상 더 충실합니다. ‘죄의 용서를 위한 회개’도 가능한 해석이지만, 본문으로 채택하면 그 관계를 한 방향으로 더 강하게 규정합니다. 또한 ἀρξάμενοι ἀπὸ Ἰερουσαλήμ은 ‘예루살렘에서 시작하여’로 옮겨 선포의 시작점을 자연스럽게 나타내는 편이 낫습니다.
  naturalness: ‘예루살렘에서 시작해야 합니다’는 누가 시작해야 하는지가 문장 안에서 불분명하고, 앞의 수동 표현과 병렬될 때 다소 어색합니다. ‘예루살렘에서 시작하여 … 선포되어야 합니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘죄 사함’은 성경 한국어에서 널리 정착한 핵심 용어이면서도 현대 독자에게 이해 가능합니다.
  terminology: ἐπὶ τῷ ὀνόματι αὐτοῦ는 ‘그의 이름으로’, κηρυχθῆναι는 ‘선포되어야 합니다’, πάντα τὰ ἔθνη는 ‘모든 민족에게’로 유지합니다. ἄφεσις ἁμαρτιῶν은 ‘죄 사함’으로 옮깁니다. 이는 ‘용서’와 동의 범위에 있으나 성경 문맥의 관용적 표현을 보존합니다.
