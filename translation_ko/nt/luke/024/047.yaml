id: LUK.24.47
reference: Luke 24:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
  footnotes:
  - marker: a
    text: Or 'and forgiveness of sins'; the Greek may be taken as two coordinated elements of the message proclaimed.
    reason: alternative_reading
  - marker: b
    text: Or 'to all nations.' The Greek term can also mean 'Gentiles' in some contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 예루살렘에서 시작하여, 그의 이름으로 회개와 죄 사함이 모든 민족에게[b] 선포되어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄 사함을 위한 회개’; 헬라어는 회개와 죄 사함을 선포되는 내용의 두 요소로 읽을 수도 있고, 회개를 죄 사함과 밀접하게 연결하여 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘모든 나라에게’. 헬라어 ἔθνη는 어떤 문맥에서는 ‘이방인들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  english_pob_choice: should be proclaimed
  chosen_korean: 선포되어야 하며
  alternatives_korean:
  - 전파되어야 하며
  - 설교되어야 하며
  lexicon: BDAG
  rationale: 공적 선언의 뜻을 살리면서 현대 한국어에서 자연스럽고, 단순한 설교 행위로 좁히지 않기 위해 ‘선포되다’를 택했습니다.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  english_pob_choice: in his name
  chosen_korean: 그의 이름으로
  alternatives_korean:
  - 그의 이름 안에서
  - 그의 이름에 의하여
  lexicon: BDAG
  rationale: 예수의 권위와 근거를 드러내는 관용구로서, 한국어에서는 ‘그의 이름으로’가 가장 자연스럽고 의미를 잘 전달합니다.
- source_word: μετάνοιαν
  english_pob_choice: repentance
  chosen_korean: 회개
  alternatives_korean:
  - 마음의 변화
  - 돌이킴
  lexicon: BDAG
  rationale: μετάνοια의 통상적이고 본문에 적합한 대응어로 ‘회개’를 사용했습니다. 영어 POB의 흔적상 ‘change of mind’의 해석 가능성은 있으나, 한국어 본문에서는 과도한 풀이보다 정착된 의미를 따랐습니다.
- source_word: ἄφεσιν ἁμαρτιῶν
  english_pob_choice: for the forgiveness of sins
  chosen_korean: 죄의 용서를 위한
  alternatives_korean:
  - 죄 사함을 위한
  - 죄로부터의 해방을 위한
  lexicon: BDAG
  rationale: ἄφεσις를 여기서는 ‘용서/사함’의 뜻으로 보고, ‘죄의 용서’를 통해 관용적이면서도 본문의 의미를 보존했습니다.
- source_word: εἰς πάντα τὰ ἔθνη
  english_pob_choice: to all the nations
  chosen_korean: 모든 민족에게
  alternatives_korean:
  - 모든 나라에
  - 모든 민족들 가운데
  lexicon: BDAG
  rationale: ἔθνη는 문맥상 열방 전체를 가리키므로, ‘민족’이 한국어에서 보편적 범위를 가장 자연스럽게 나타냅니다. ‘이방인들’로 좁히지 않아야 합니다.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  english_pob_choice: beginning from Jerusalem
  chosen_korean: 예루살렘에서 시작해야 합니다
  alternatives_korean:
  - 예루살렘에서부터 시작하며
  - 예루살렘으로부터 시작하며
  lexicon: BDAG
  rationale: 출발점을 나타내는 ἀπό를 살리면서, 뒤의 의무/명령 문맥에 맞게 ‘시작해야 합니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: μετάνοιαν과 ἄφεσιν ἁμαρτιῶν의 관계
  chosen_reading: 본문은 ‘회개’와 ‘죄의 용서’를 선포할 내용으로 함께 제시하며, 둘의 관계를 지나치게 체계화하지 않고 그대로 둡니다.
  alternative_readings:
  - ‘회개와 죄의 용서’가 각각 병렬로 선포되는 것으로 읽기
  - ‘죄의 용서를 얻기 위한 회개’로 원인-결과 관계를 강하게 읽기
  rationale: 그리스어는 두 명사를 함께 묶어 선포의 내용을 말하지만, 구원론의 세부 순서를 명시적으로 규정하지는 않습니다. 그래서 본문이 말하는 연결감은 살리되 교리적 세부는 덧붙이지 않았습니다.
  doctrine_reference: 본문이 허용하는 긴장 유지
- issue: εἰς πάντα τὰ ἔθνη의 범위
  chosen_reading: ‘모든 민족’으로 번역해 보편적 선교 범위를 드러냅니다.
  alternative_readings:
  - ‘모든 나라’로 번역하기
  - ‘모든 이방인들’로 좁혀 번역하기
  rationale: 이 표현은 유대인/이방인 대조만이 아니라 부활 이후 복음의 전 세계적 확장을 가리킵니다. ‘모든 민족’이 원문 형식과 범위를 가장 잘 보존합니다.
  doctrine_reference: 복음의 보편적 선포
