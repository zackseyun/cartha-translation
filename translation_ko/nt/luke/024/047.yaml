  rationale: 원문의 두 명사에 있는 접속사 καὶ를 본문에서 ‘회개와 죄 사함’으로 보존하고, ‘죄 사함을 위한 회개’라는 해석은 각주로 제시했습니다. 이에 따라 본문이 명시하지 않는 구원론적 인과관계를 단정하지 않습니다. 또한 ‘예루살렘에서 시작하여’를 문두에 두어 분사가 나타내는 출발점과 선포의 관계를 자연스러운 한국어로 표현했습니다. 각주 표지는 해당 어구에 직접 배치했습니다.
