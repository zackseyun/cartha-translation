id: LUK.24.10
reference: Luke 24:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: Now they were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
  footnotes:
  - marker: a
    text: Greek literally 'Mary of James'; this likely means 'Mary the mother of James,' though 'Mary, wife of James' is also possible.
    reason: alternative_reading
translation:
  language: ko
  text: 막달라 마리아와 요안나와 야고보의 어머니 마리아[a], 그리고 그들과 함께 있던 다른 여인들이었습니다. 그들은 이 일들을 사도들에게 말하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘야고보의 마리아’라고 합니다. 이는 아마 ‘야고보의 어머니 마리아’를 뜻하지만, ‘야고보의 아내 마리아’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δὲ
  english_pob_choice: Now they were
  chosen_korean: 그때 … 있었습니다
  alternatives_korean:
  - 그리고 … 있었습니다
  - 이때 … 있었습니다
  lexicon: BDAG
  rationale: δὲ의 완만한 전환과 미완료 복수 동사를 자연스럽게 살리기 위해 서술 도입어를 ‘그때’로 두고 평서형 과거 진행을 사용했습니다.
- source_word: ἡ Μαγδαληνὴ Μαρία
  english_pob_choice: Mary Magdalene
  chosen_korean: 막달라 마리아
  alternatives_korean:
  - 마리아 막달라
  - 마리아 막달레네
  lexicon: BDAG
  rationale: 고유명사와 지명형 별칭을 현대 한국어 성경에서 자연스럽게 읽히는 순서로 옮겼습니다.
- source_word: Μαρία ἡ Ἰακώβου
  english_pob_choice: Mary the mother of James
  chosen_korean: 야고보의 어머니 마리아
  alternatives_korean:
  - 야고보의 마리아
  - 야고보의 아내 마리아
  lexicon: BDAG
  rationale: 그리스어 속격 구문이 관계를 압축해 두었기 때문에, 문맥상 가장 자연스러운 친족 표지인 ‘어머니’를 본문에 반영했습니다.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  english_pob_choice: the other women with them
  chosen_korean: 그 밖의 여자들이 그들과 함께
  alternatives_korean:
  - 나머지 여자들이 그들과 함께
  - 다른 여자들이 그들과 함께
  lexicon: BDAG
  rationale: 여성 복수 관사가 있어 암시된 명사 ‘여자들’을 한국어에서 드러냈고, 수식 관계도 그대로 유지했습니다.
- source_word: ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα
  english_pob_choice: they were telling these things to the apostles
  chosen_korean: 그들은 이 일들을 사도들에게 말하고 있었습니다
  alternatives_korean:
  - 그들은 이 일들을 사도들에게 말했습니다
  - 그들은 이 일들을 사도들에게 하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 시제가 반복·진행되는 보고를 나타내므로 ‘말하고 있었습니다’로 옮겨 동작의 지속성을 살렸습니다.
theological_decisions:
- issue: Μαρία ἡ Ἰακώβου의 관계 표지
  chosen_reading: ‘야고보의 어머니 마리아’로 옮기되, 그리스어가 관계를 압축해 두었다는 점은 보존했습니다.
  alternative_readings:
  - 야고보의 마리아
  - 야고보의 아내 마리아
  rationale: 본문은 관계를 명시하지 않지만, 복음서의 명명 관습과 영어 POB의 판단을 따라 가장 분명한 친족 관계를 본문에 풀어 썼습니다. 다만 그리스어의 압축성을 지우지 않기 위해 주해적 과도한 확정은 피했습니다.
  doctrine_reference: Translation philosophy §3, source가 진짜로 모호할 때 해석의 긴장을 보존한다.
