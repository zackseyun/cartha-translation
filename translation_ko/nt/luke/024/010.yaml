review_pass:
  verdict: revise
  source_fidelity: 그리스어의 인명 목록과 미완료 동사 ἔλεγον의 지속적 보고는 대체로 잘 반영했습니다. 그러나 ‘그때’는 δέ의 완만한 접속 기능을 시간 부사로 구체화하여 원문에 없는 시간 지시를 더합니다. 또한 αἱ λοιπαὶ σὺν αὐταῖς는 ‘그들과 함께 있던 다른 여인들’로 묶어 옮기는 편이 수식 관계를 더 정확하고 자연스럽게 나타냅니다.
  naturalness: 현대 표준어 합쇼체는 전반적으로 적절합니다. 다만 인물 목록 안에서 ‘그 밖의 여자들이 그들과 함께 있었습니다’라고 하면 ‘그들’의 선행사가 다소 불분명하고 표현이 중복됩니다. ‘그들과 함께 있던 다른 여인들’이 더 매끄럽습니다.
  terminology: ‘막달라 마리아’, ‘요안나’, ‘야고보’, ‘사도들’은 적절합니다. ‘야고보의 어머니 마리아’는 문맥상 가장 개연성 있는 본문 선택이지만, 속격의 관계가 명시되지 않은 점을 각주로 보존해야 합니다. 각주 표지는 해당 표현 바로 뒤에 두는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그때’가 δέ를 시간 부사로 한정함
    rationale: δέ는 여기서 약한 담화 전환을 표시할 뿐 명시적인 ‘그때’라는 시간 지시어는 아닙니다. 원문의 시간적 모호성을 유지하려면 이를 삭제하는 것이 안전합니다.
  - severity: low
    issue: ‘그 밖의 여자들이 그들과 함께 있었습니다’의 수식 관계와 지시 대상이 어색함
    rationale: σὺν αὐταῖς는 ‘다른 여인들’을 수식하며, αὐταῖς는 앞서 열거된 여성들을 가리킵니다. ‘그들과 함께 있던 다른 여인들’이 이를 한국어에서 명료하게 재현합니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 관계 해석의 대안은 ‘야고보의 어머니 마리아’에 직접 관련되므로 문장 끝이 아니라 해당 명칭 뒤에 표지하는 편이 독자에게 명확합니다.
  revised_text: 막달라 마리아와 요안나와 야고보의 어머니 마리아[a], 그리고 그들과 함께 있던 다른 여인들이었습니다. 그들은 이 일들을 사도들에게 말하고 있었습니다.
