revisions:
- from: 그때 막달라 마리아와 요안나와 야고보의 어머니 마리아와 그 밖의 여자들이 그들과 함께 있었습니다. 그들은 이 일들을 사도들에게 말하고 있었습니다.[a]
  to: 막달라 마리아와 요안나와 야고보의 어머니 마리아[a], 그리고 그들과 함께 있던 다른 여인들이었습니다. 그들은 이 일들을 사도들에게 말하고 있었습니다.
  rationale: 원문에 없는 시간 지시를 삭제하고, ‘다른 여인들’과 ‘그들과 함께’의 결합을 원문의 수식 관계에 맞게 조정했습니다. 야고보와 마리아의 관계를 본문에서 가장 개연성 있는 방식으로 제시하되, 그리스어의 압축된 속격 표현이 허용하는 대안은 해당 명칭의 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
