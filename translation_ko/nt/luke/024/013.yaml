  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
  footnotes:
  - marker: a
    text: A stadion was an ancient unit of distance; sixty stadia is about 7 miles or 11 kilometers.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 보라, 그들 가운데 두 사람이 바로 그 날 예루살렘에서 육십 스타디온 떨어진 한 마을로 가고 있었는데, 그 이름은 엠마오였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스타디온은 고대 거리 단위이며, 육십 스타디온은 약 11킬로미터입니다.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  english_pob_choice: And behold
  chosen_korean: 그리고 보라
  alternatives_korean:
  - 그리고 보십시오
  - 그런데 보라
  lexicon: BDAG
  rationale: 서술 전환의 주의를 환기하는 감탄적 표지를 살리되, 현대 한국어에서 자연스럽고 문체적으로도 본문의 장면 제시 기능을 유지하기 위해 ‘그리고 보라’로 옮겼습니다.
- source_word: δύο ἐξ αὐτῶν
  english_pob_choice: two of them
  chosen_korean: 그들 가운데 두 사람이
  alternatives_korean:
  - 그들 중 두 사람이
  - 두 사람이 그들 가운데
  lexicon: BDAG
  rationale: 부분을 나타내는 표현을 자연스럽게 풀어, 앞서 언급된 무리 속에서 두 사람이 나왔음을 분명히 했습니다.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  english_pob_choice: that very day
  chosen_korean: 바로 그 날
  alternatives_korean:
  - 그 바로 그 날
  - 그 날
  lexicon: BDAG
  rationale: 강조가 있는 지시 표현을 한국어의 ‘바로’로 살려, 단순한 날짜 표지보다 즉시성과 강조를 드러냈습니다.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  english_pob_choice: sixty stadia from Jerusalem
  chosen_korean: 예루살렘에서 육십 스타디온 떨어진
  alternatives_korean:
  - 예루살렘에서 육십 스타디아 떨어진
  - 예루살렘으로부터 육십 스타디온 떨어진
  lexicon: BDAG
  rationale: 본문의 고대 거리 단위를 본문에 그대로 두어 출처의 투명성을 유지했고, ‘떨어진’으로 거리 관계를 자연스럽게 표현했습니다.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  english_pob_choice: whose name was Emmaus
  chosen_korean: 그 이름은 엠마오였습니다
  alternatives_korean:
  - 그 이름이 엠마오였습니다
  - 이름은 엠마오였습니다
  lexicon: BDAG
  rationale: 명시적 이름 제시를 한국어로 자연스럽게 옮기되, 문장의 흐름을 해치지 않도록 서술형으로 정리했습니다.
theological_decisions:
- issue: 장면 제시를 위한 서술 표지 ‘ἰδοὺ’의 처리
  chosen_reading: ‘그리고 보라’로 옮겨 독자에게 장면 전환과 주목을 요구하는 효과를 유지했습니다.
  alternative_readings:
  - 표지를 생략
  - ‘그리고’만 번역
  rationale: 누가복음의 내러티브 흐름에서 이 표지는 단순 접속사보다 강한 주목 신호이므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: narrative discourse transparency
