  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
  footnotes:
  - marker: a
    text: Or, more literally, 'on the first of the Sabbaths,' an idiomatic expression meaning the first day of the week.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 주간 첫날[a] 새벽 일찍, 그들은 준비해 둔 향품을 가지고 무덤으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘안식일들의 첫째 날’이지만, 이는 관용적으로 ‘주간 첫날’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  english_pob_choice: on the first day of the week
  chosen_korean: 주간 첫날
  alternatives_korean:
  - 안식일들 가운데 첫째 날
  - 안식 후 첫날
  lexicon: BDAG
  rationale: 유대적 관용 표현을 한국어에서 자연스럽고 오해 없이 풀어, ‘첫날’의 시간 의미를 드러냈습니다.
- source_word: ὄρθρου βαθέως
  english_pob_choice: at early dawn
  chosen_korean: 새벽 일찍
  alternatives_korean:
  - 깊은 새벽에
  - 동이 트기 한참 전에
  lexicon: BDAG
  rationale: 직역한 ‘깊은 새벽’보다 한국어에서 자연스럽고, 매우 이른 시간이라는 강조를 유지합니다.
- source_word: ἐπὶ τὸ μνῆμα ἦλθον
  english_pob_choice: they came to the tomb
  chosen_korean: 무덤으로 갔습니다
  alternatives_korean:
  - 무덤에 왔습니다
  - 무덤으로 다가갔습니다
  lexicon: BDAG
  rationale: 움직임의 방향을 살리면서도 서술 흐름에 맞게 ‘갔습니다’로 옮겼고, μνῆμα는 매장 맥락에 맞는 ‘무덤’으로 렌더링했습니다.
- source_word: ἀρώματα
  english_pob_choice: the spices
  chosen_korean: 향품
  alternatives_korean:
  - 향신료
  - 향료
  lexicon: BDAG
  rationale: 장례 준비에 쓰이는 향품이라는 의미를 살려, 단순한 조미료가 아닌 매장용 향재의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: τῇ δὲ μιᾷ τῶν σαββάτων의 관용적 시간 표현
  chosen_reading: 주간 첫날
  alternative_readings:
