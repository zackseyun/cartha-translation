  - 안식 후 첫날
  rationale: 본문의 시간 표기를 자연스러운 한국어로 옮기되, 특정 달력 논쟁이나 교회 전통 표현을 덧씌우지 않도록 했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 관용구는 의미를 우선하여 번역
