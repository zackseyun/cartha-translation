  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
  footnotes:
  - marker: a
    text: Or, 'he vanished from them' or 'he disappeared from their sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 눈이 열려 예수를 알아보았고, 예수께서는 그들에게서 보이지 않게 되셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들의 눈이 열렸다”입니다.
    reason: source_note
lexical_decisions:
- source_word: διηνοίχθησαν οἱ ὀφθαλμοὶ
  english_pob_choice: their eyes were opened
  chosen_korean: 그들의 눈이 열려
  alternatives_korean:
  - 그들의 눈이 열렸습니다
  - 그들의 눈이 열려졌습니다
  lexicon: BDAG
  rationale: 수동태의 ‘열리다’로 번역해, 인식이 자기 힘이 아니라 주어진 것으로 이루어졌다는 점을 자연스럽게 살렸습니다.
- source_word: ἐπέγνωσαν αὐτόν
  english_pob_choice: they recognized him
  chosen_korean: 예수를 알아보았고
  alternatives_korean:
  - 그를 알아보았고
  - 그를 인식했고
  lexicon: BDAG
  rationale: 엠마오 본문에서 사람을 다시 식별하게 되는 뜻이므로, 추상적인 ‘인식하다’보다 서술적이고 자연한 ‘알아보다’를 택했습니다.
- source_word: ἄφαντος ἐγένετο ἀπ’ αὐτῶν
  english_pob_choice: he became unseen by them
  chosen_korean: 예수께서는 그들에게서 보이지 않게 되셨습니다
  alternatives_korean:
  - 예수께서는 그들에게서 사라지셨습니다
  - 예수께서는 그들의 시야에서 사라지셨습니다
  lexicon: BDAG
  rationale: ἄφαντος와 γίνομαι의 결합은 ‘보이지 않게 됨/보이지 않음’에 가깝기 때문에, 소멸이나 이동 방식까지 단정하지 않는 표현으로 옮겼습니다.
- source_word: ἀπ’ αὐτῶν
  english_pob_choice: by them / from them
  chosen_korean: 그들에게서
  alternatives_korean:
  - 그들로부터
  - 그들의 시야에서
  lexicon: BDAG
  rationale: ἀπό의 관계성을 한국어 조사 ‘-에게서/-로부터’로 간단히 반영하여, 본문이 말하는 ‘그들과의 관계 안에서 더 이상 보이지 않음’을 살렸습니다.
theological_decisions:
- issue: 예수의 ‘보이지 않게 되심’의 범위
  chosen_reading: 본문은 예수께서 더 이상 그들에게 보이지 않게 되셨음을 말하며, 그 방식은 규정하지 않습니다.
  alternative_readings:
  - 예수께서 순간적으로 사라지셨습니다
  - 예수께서 물리적으로 이동하셨습니다
  rationale: 그리스어는 ἄφαντος ἐγένετο를 사용하여 ‘보이지 않음’을 말할 뿐, 사라짐의 메커니즘을 설명하지 않으므로 서술의 신비를 그대로 두었습니다.
  doctrine_reference: 본문이 열어 두는 신학적 긴장을 유지합니다.
