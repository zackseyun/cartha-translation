id: LUK.24.9
reference: Luke 24:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: ko
  text: 그리고 무덤에서 돌아와서, 그들은 이 모든 일을 열한 제자와 다른 모든 사람에게 알렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단순히 ‘열한 명’(τοῖς ἕνδεκα)이라고 합니다.
    reason: source_note
  - marker: b
    text: λοιποί는 문자적으로 ‘남은 사람들, 나머지 사람들’입니다.
    reason: source_note
lexical_decisions:
- source_word: ὑποστρέψασαι
  english_pob_choice: returning
  chosen_korean: 돌아와서
  alternatives_korean:
  - 돌아가서
  - 되돌아와서
  lexicon: BDAG
  rationale: 여성 복수 분사로서 앞 문맥의 여인들을 가리키며, 한국어에서는 자연스러운 연결 표현인 ‘돌아와서’로 분사적 연계를 살렸습니다.
- source_word: μνημείου
  english_pob_choice: tomb
  chosen_korean: 무덤
  alternatives_korean:
  - 빈소
  - 묘
  lexicon: BDAG
  rationale: 부활 문맥의 μνημεῖον은 예수의 매장 장소를 가리키므로, 한국어에서는 가장 직접적이고 자연스러운 ‘무덤’으로 옮겼습니다.
- source_word: ἀπήγγειλαν
  english_pob_choice: reported
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 보고했습니다
  - 전했습니다
  lexicon: BDAG
  rationale: 본문은 사건을 전달하는 서술 동사이므로, 공적 발표보다 덜 강한 ‘알리다’가 ‘reported’의 뉘앙스를 잘 살립니다.
- source_word: τοῖς ἕνδεκα
  english_pob_choice: the eleven
  chosen_korean: 열한 제자
  alternatives_korean:
  - 열한 사람
  - 열한 명
  lexicon: BDAG
  rationale: 그리스어는 단순히 ‘열한 명’이지만 한국어에서는 해당 집단이 제자 공동체임이 문맥상 분명하므로, 의미를 과도하게 확장하지 않는 범위에서 ‘열한 제자’로 자연화했습니다.
- source_word: πᾶσιν τοῖς λοιποῖς
  english_pob_choice: all the rest
  chosen_korean: 다른 모든 사람
  alternatives_korean:
  - 모든 나머지 사람들
  - 그 밖의 모든 사람
  lexicon: BDAG
  rationale: λοιποί는 남은 사람들을 뜻하므로, 열한 제자와 대비되는 넓은 무리를 가리키는 ‘다른 모든 사람’이 한국어로 가장 간명합니다.
theological_decisions:
- issue: 여성 복수 주어의 반영
  chosen_reading: 주어는 앞 문맥의 여자들이며, 한국어에서도 그 주어를 암시적으로 유지했습니다.
  alternative_readings:
  - 명시적으로 ‘여자들이’라고 덧붙이기
  - 중성적 주어로 바꾸기
  rationale: 분사의 여성 복수형이 주어를 분명히 표시하므로, 본문이 말하는 인물군을 흐리지 않으면서도 한국어의 자연스러움을 유지했습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
- issue: τοῖς ἕνδεκα의 확장 여부
  chosen_reading: ‘열한 제자’로 옮기되, 사도라는 호칭은 덧붙이지 않았습니다.
  alternative_readings:
  - 열한 사도
  - 열한 제자들
  rationale: 본문은 단순히 ‘열한 명’을 가리키며, 여기에 ‘사도’를 추가하면 원문에 없는 명칭을 넣게 됩니다. 한국어의 자연성을 위해 ‘제자’만 최소한으로 보충했습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy over translation tradition)
