  - marker: a
    text: Or 'a ghost.' The Greek word is πνεῦμα, more literally 'spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 놀라 두려움에 사로잡혀, 영을 보고 있다고 생각했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유령’. 그리스어 πνεῦμα는 문자적으로 ‘영’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  english_pob_choice: startled
  chosen_korean: 놀라고
  alternatives_korean:
  - 깜짝 놀라고
  - 당황하고
  - 두려워하고
  lexicon: BDAG
  rationale: 즉각적이고 अचानक한 충격을 나타내므로, 뒤의 두려움과 구별되는 1차 반응으로 ‘놀라고’가 가장 자연스럽습니다.
- source_word: ἔμφοβοι γενόμενοι
  english_pob_choice: became afraid
  chosen_korean: 두려워하게 되어
  alternatives_korean:
  - 무서워하게 되어
  - 두려워지고
  - 겁이 나게 되어
  lexicon: BDAG
  rationale: γενόμενοι가 상태로 들어감을 나타내므로, 단순 상태보다 진행·진입을 살린 ‘두려워하게 되어’가 적합합니다.
- source_word: πνεῦμα
  english_pob_choice: a spirit
  chosen_korean: 영
  alternatives_korean:
  - 영체
  - 유령
  - 귀신
  lexicon: BDAG
  rationale: 본문의 πνεῦμα를 한국어 성경 문맥에서 가장 직접적으로 옮기되, ‘유령’이나 ‘귀신’처럼 문화적 의미가 덧붙는 표현은 피했습니다.
- source_word: ἐδόκουν πνεῦμα θεωρεῖν
  english_pob_choice: they thought they were seeing a spirit
  chosen_korean: 영을 보고 있다고 생각했습니다
  alternatives_korean:
  - 영을 보고 있다고 여겼습니다
  - 영을 보고 있다고 생각하였습니다
  lexicon: BDAG
  rationale: ἐδόκουν은 지속적 인상을, θεωρεῖν은 ‘보고 있다’는 지각 행위를 가리키므로, 현대 한국어에서 자연스러운 현재 진행형 인식을 살렸습니다.
theological_decisions:
- issue: 부활하신 예수를 ‘영’으로 오해한 제자들의 이해를 어떻게 보존할 것인가
  chosen_reading: ‘영’으로 번역해, 본문의 오해와 예수의 실제 육체적 부활 사이의 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘유령’으로 옮겨 문화적 오해를 더 강하게 드러내는 방식
  - ‘영체’처럼 설명을 덧붙이는 방식
  rationale: 본문은 제자들의 잘못된 해석을 기록하므로, 그 오해를 지나치게 해소하지 않고 원문의 어휘 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 부활 현현의 실제성과 제자들의 오해를 함께 보존
