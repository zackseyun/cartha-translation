id: LUK.24.46
reference: Luke 24:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
  footnotes:
  - marker: a
    text: Or “the Christ.” The Greek title Χριστός is rendered “Messiah” here because it functions as a title rather than a name-like designation.
    reason: alternative_reading
  - marker: b
    text: Or more literally, “from among the dead.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들에게 말씀하셨습니다. 「이와 같이 기록되어 있습니다. 곧 메시아[a]께서 고난을 받고 죽은 자들 가운데서[b] 셋째 날에 일어나실 것이라고。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리스도.” 이곳의 Χριστός는 이름이 아니라 칭호로 기능하므로 “메시아”로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “죽은 자들 가운데서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν χριστόν
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: 여기서는 Χριστός가 이름처럼 아니라 칭호로 쓰였으므로, 한국어도 교회 전통어보다 칭호감이 살아 있는 ‘메시아’를 택했습니다.
- source_word: γέγραπται
  english_pob_choice: it is written
  chosen_korean: 기록되어 있습니다
  alternatives_korean:
  - 쓰여 있습니다
  - 기록되었습니다
  lexicon: BDAG
  rationale: 성경 인용 서식으로 굳어진 현재적 표현을 살려, 완료 수동의 지속된 효력을 한국어의 공손한 현행 표현으로 옮겼습니다.
- source_word: ἀναστῆναι
  english_pob_choice: rise
  chosen_korean: 일어나셔야 합니다
  alternatives_korean:
  - 일어나시다
  - 다시 살아나셔야 합니다
  lexicon: BDAG
  rationale: 형식상 능동 부정법이므로 ‘살아나시다’처럼 수동화하지 않고, 부활 맥락을 유지하면서도 한국어에서는 자연스러운 ‘일어나시다’로 옮겼습니다.
- source_word: ἐκ νεκρῶν
  english_pob_choice: from the dead
  chosen_korean: 죽은 자들 가운데서
  alternatives_korean:
  - 죽은 자들로부터
  - 죽은 자들 가운데
  lexicon: BDAG
  rationale: ‘from among the dead’의 관용적 부활 표현을 살려, 단순한 출처보다 집합 안에서 나오심을 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: 부활 서술에서 능동형 ἀναστῆναι의 처리
  chosen_reading: 주어가 직접 ‘일어나시다’로 표현되도록 유지했습니다.
  alternative_readings:
  - ‘다시 살아나시다’로 수동적 의미를 강화함
  - ‘부활하시다’로 요약함
  rationale: 본문은 실제로 능동 부정법을 사용하므로, 신학적 배경은 살리되 문법적 형식을 수동으로 바꾸지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
