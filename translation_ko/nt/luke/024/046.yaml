revisions:
- from: 그리고 그들에게 말씀하셨습니다. 「이렇게 기록되어 있습니다. 곧 메시아께서 고난을 받으시고, 죽은 자들 가운데서 셋째 날에 일어나셔야 합니다」[a][b]
  to: 그리고 그들에게 말씀하셨습니다. 「이와 같이 기록되어 있습니다. 곧 메시아[a]께서 고난을 받고 죽은 자들 가운데서[b] 셋째 날에 일어나실 것이라고。」
  rationale: 'The revision removes the unsupported modal force of ‘-셔야 합니다’ and renders the coordinated infinitives as the content of what stands written: the Messiah would suffer and rise. It preserves the Greek active resurrection verb, the titular rendering “메시아,” the temporal phrase “셋째 날에,” and the direct lexical footnote for ἐκ νεκρῶν.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders γέγραπται as an ongoing scriptural formula, τὸν χριστόν as “메시아,” and ἐκ νεκρῶν as “죽은 자들 가운데서.” However, “일어나셔야 합니다” introduces explicit necessity (‘must rise’) not expressed by the infinitive ἀναστῆναι in this clause. The paired infinitives state the content of what is written and should be rendered without this added modal force.
  naturalness: The revised wording uses a natural Korean content clause after “기록되어 있습니다,” while retaining formal-polite 합쇼체 and a suitably scriptural register. Relocating the footnote markers to their relevant words improves anchoring.
  terminology: “메시아” appropriately renders the titular use of Χριστός. “고난을 받고 … 일어나실 것이라고” preserves the active sense of ἀναστῆναι without imposing a passive or a doctrinally stronger modal reading. “죽은 자들 가운데서” is a clear and established resurrection expression.
  issues:
  - severity: high
    issue: ‘일어나셔야 합니다’ adds necessity absent from the Greek.
    rationale: ἀναστῆναι is an aorist active infinitive coordinated with παθεῖν under the content introduced by ὅτι. It does not itself contain a modal equivalent to ‘must.’ The Korean expression ‘-셔야 합니다’ explicitly adds obligation/necessity.
  - severity: low
    issue: Footnote markers are placed only after the closing quotation rather than at their respective referents.
    rationale: Marker a concerns “메시아,” and marker b concerns “죽은 자들 가운데서.” Anchoring them directly after those expressions makes their scope unambiguous.
  revised_text: 그리고 그들에게 말씀하셨습니다. 「이와 같이 기록되어 있습니다. 곧 메시아[a]께서 고난을 받고 죽은 자들 가운데서[b] 셋째 날에 일어나실 것이라고。」
  revised_footnotes:
  - marker: a
    text: 또는 “그리스도.” 이곳의 Χριστός는 이름이 아니라 칭호로 기능하므로 “메시아”로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “죽은 자들 가운데서”입니다.
    reason: lexical_alternative
