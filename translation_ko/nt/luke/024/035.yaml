    rationale: 그리스어 전치사구는 ‘떡을 뗌/떼는 가운데’라는 명사적 표현이며, 이 절 자체에는 떼는 이가 명시되지 않습니다. 앞 문맥상 예수를 가리킬 가능성은 높지만, 번역문에서는 불필요한 보충을 피하는 편이 원문에 더 충실합니다.
