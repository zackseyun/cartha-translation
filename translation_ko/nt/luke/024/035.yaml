  source_fidelity: 원문의 καὶ αὐτοὶ는 문맥상 ‘그들도’로 자연스럽게 강조할 수 있으며, 미완료 중간태 ἐξηγοῦντο는 계속된 보고를 나타내는 ‘이야기하고 있었습니다’로 적절합니다. τὰ ἐν τῇ ὁδῷ는 문맥상 ‘길에서 있었던 일들’로 보충하는 것이 안전합니다. ἐγνώσθη의 수동태는 ‘그분이 그들에게 알려지셨는지’로 보존하되, 원문에 없는 행위 주체와 높임을 넣는 ‘떡을 떼실 때’는 피하는 것이 좋습니다.
  naturalness: 초안은 ‘이야기하고 있었고’가 병렬절에서 반복되고, 앞 절은 과거진행형인데 뒤 절은 ‘이야기하고 있었습니다’로 끝나 문장 연결이 부자연스럽습니다. 두 보고 내용을 목적어로 묶어 한 번만 ‘이야기하고 있었습니다’를 쓰면 현대 한국어 문체에 자연스럽습니다.
  terminology: ‘떡을 떼는 가운데’는 ἐν τῇ κλάσει τοῦ ἄρτου를 자연스럽고 중립적으로 옮기며, 성찬에 관한 특정 교리적 해석을 강요하지 않습니다. ‘알려지셨다’는 수동 표현을 유지합니다.
  issues:
