id: LUK.24.35
reference: Luke 24:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
  footnotes:
  - marker: a
    text: Or, 'he was recognized by them.' The Greek uses a passive verb, which may emphasize either their recognition of him or that he was made known to them.
    reason: alternative_reading
  - marker: b
    text: Or, 'in the breaking of bread.' The Greek can be read more generally, but 'the bread' fits the specific meal scene in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 자신은 길에서 일어난 일들을 이야기하고 있었고, 떡을 떼실 때에 그분이 그들에게 어떻게 알려지셨는지를 이야기하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 그분을 알아보았는지.’ 그리스어는 수동 동사를 사용하여, 그들이 그분을 인식한 것인지 또는 그분이 그들에게 알려지신 것인지 둘 다를 시사할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘떡을 떼는 중에.’ 그리스어는 더 일반적으로 읽을 수도 있으나, 문맥상 앞의 식사 장면에는 ‘떡’을 두는 번역이 더 구체적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  english_pob_choice: they themselves
  chosen_korean: 그들 자신은
  alternatives_korean:
  - 그들은
  - 그들만은
  lexicon: BDAG
  rationale: 명시된 대명사의 강조를 살려, 단순한 ‘그들은’보다 ‘그들 자신은’으로 두 제자의 직접적인 증언을 드러냈습니다.
- source_word: ἐξηγοῦντο
  english_pob_choice: were recounting
  chosen_korean: 이야기하고 있었고
  alternatives_korean:
  - 전하고 있었고
  - 상세히 설명하고 있었고
  - 말하고 있었고
  lexicon: BDAG
  rationale: 미완료 시상의 진행성을 살리되, 한국어에서는 자연스러운 서술형으로 옮겨 ‘계속 말하고 있는 상황’을 표현했습니다.
- source_word: τὰ ἐν τῇ ὁδῷ
  english_pob_choice: the things on the road
  chosen_korean: 길에서 일어난 일들
  alternatives_korean:
  - 길에서의 일들
  - 길 위의 일들
  - 그 길에서 있었던 일들
  lexicon: BDAG
  rationale: 그리스어의 간결한 표현을 한국어에서 너무 직역하면 어색해지므로, 문맥상 암시되는 사건성을 드러내는 범위에서만 자연화했습니다.
- source_word: ἐγνώσθη
  english_pob_choice: he was made known
  chosen_korean: 그분이 그들에게 어떻게 알려지셨는지
  alternatives_korean:
  - 그분이 그들에게 어떻게 알려지셨는지
  - 그분이 그들에게 어떻게 인식되셨는지
  - 그들이 그분을 어떻게 알아보았는지
  lexicon: BDAG
  rationale: 수동태를 그대로 살려 ‘알려지셨다’로 옮기고, 인식 주체보다 드러나심의 뉘앙스를 유지했습니다. ‘알아보았다’는 능동적 인식으로 기울어 원문 수동을 약화시킵니다.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  english_pob_choice: in the breaking of the bread
  chosen_korean: 떡을 떼실 때에
  alternatives_korean:
  - 떡을 떼는 중에
  - 떡을 떼는 일에서
  - 떡을 떼는 행위에서
  lexicon: BDAG
  rationale: 전치사구를 한국어 사건 서술에 맞게 시간적 배경으로 풀어, 바로 앞 문맥의 식사 장면과 연결되도록 했습니다. ‘떡’은 이 본문의 구체적 식사 맥락을 살립니다.
theological_decisions:
- issue: ἐγνώσθη의 수동태를 단순한 인간의 알아봄으로 풀지, 드러나심의 뉘앙스를 유지할지
  chosen_reading: ‘그분이 그들에게 어떻게 알려지셨는지’로 수동의 의미를 유지했습니다.
  alternative_readings:
  - 그들이 그분을 어떻게 알아보았는지
  - 그분이 그들에게 어떻게 드러나셨는지
  rationale: 누가복음의 문맥은 인식 사건을 인간의 시각만이 아니라 주어지는 깨달음의 차원으로 제시하므로, 능동적 표현으로 평평하게 만들지 않고 수동을 보존했습니다.
  doctrine_reference: 본문의 긴장을 해소하지 않고 유지
