  rationale: 원문의 한 보고 동사에 ‘길에서 있었던 일들’과 ‘떡을 떼는 가운데 그분이 알려지신 방식’이라는 두 내용을 병렬로 연결했습니다. 수동태의 열린 뉘앙스와 원문의 명사적 전치사구를 보존하면서, 중복된 서술과 원문에 없는 주체 표지를 제거했습니다. 각주 표지도 해당 표현 바로 뒤에 배치했습니다.
