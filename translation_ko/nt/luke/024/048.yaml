  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
  footnotes:
  - marker: a
    text: Or simply, 'You are witnesses of these.' The Greek demonstrative refers to the events Jesus has just spoken about.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 이 일들의 증인입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 단순히 ‘이것들의 증인입니다’로도 옮길 수 있습니다. 여기의 지시대명사는 예수가 방금 말씀하신 사건들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  english_pob_choice: You
  chosen_korean: 여러분은
  alternatives_korean:
  - 너희는
  - 당신들은
  lexicon: BDAG
  rationale: 문장 첫머리의 인칭대명사를 살려 제자들을 직접 지목하되, 현대 한국어에서는 공손하고 자연스러운 복수 2인칭으로 ‘여러분은’을 택했습니다.
- source_word: μάρτυρες
  english_pob_choice: witnesses
  chosen_korean: 증인
  alternatives_korean:
  - 목격자
  - 증언자
  lexicon: BDAG
  rationale: 여기서는 예수의 죽음과 부활 및 그에 대한 선포를 ‘증언하는 사람들’이라는 기본 의미가 핵심이므로, 교회적 직함보다 더 직접적인 ‘증인’이 적절합니다.
- source_word: τούτων
  english_pob_choice: of these things
  chosen_korean: 이 일들의
  alternatives_korean:
  - 이것들의
  - 이 일들의 증인들
  lexicon: BDAG
  rationale: 지시대명사는 직전에 예수가 말한 사건들을 가리키므로, 한국어에서는 문맥을 드러내는 ‘이 일들’로 옮겨 참조 대상을 분명히 했습니다.
theological_decisions:
- issue: μάρτυρες의 의미 범위
  chosen_reading: 이 구절에서는 후대의 ‘순교자’ 뉘앙스를 불러오기보다, 직전에 언급된 사건들을 직접 증언하는 역할을 말합니다.
  alternative_readings:
  - 후대 교회 전통과 연결된 순교적 울림을 일부 느낄 수 있음
  rationale: 문맥상 예수의 수난, 부활, 그리고 그 선포를 목격하고 전하는 제자들의 증언 사명이 초점이므로, 본문의 직접 의미를 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
