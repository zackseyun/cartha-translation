  - severity: low
    issue: 각주 a에 ‘사형 언도로’라는 조사 결합 오류가 있습니다.
    rationale: 명사 ‘언도’ 뒤에는 이 문맥에서 ‘-에’가 와야 하므로 ‘사형 언도에’가 맞습니다.
