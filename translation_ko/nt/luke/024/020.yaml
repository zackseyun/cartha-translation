source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
  footnotes:
  - marker: a
    text: Or 'to a death sentence' or 'for condemnation to death.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had him crucified,' making explicit that the leaders were responsible for the execution though Roman authorities carried it out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리 대제사장들과 지도자들이 그를 사형 판결을 받도록 넘기고 십자가에 못 박았다는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사형 언도에’ 또는 ‘사형 판결에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 십자가에 못 박히도록 넘겼다’. 실제 집행은 로마 당국이 했지만 지도자들의 책임을 더 명시적으로 드러내는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  english_pob_choice: and how
  chosen_korean: 그리고 … 하다는 것입니다
  alternatives_korean:
  - 그리고 어떻게
  - 또한 …
  lexicon: BDAG
  rationale: 이 절은 앞선 진술에 이어지는 내용 소개이므로, 한국어에서는 ‘그리고 … 하다는 것입니다’로 연결해 서술 흐름을 자연스럽게 살렸습니다.
- source_word: παρέδωκαν
  english_pob_choice: handed ... over
  chosen_korean: 넘기고
  alternatives_korean:
  - 내주고
  - 인도하고
  - 넘겨주고
  lexicon: BDAG
  rationale: 예수님을 재판과 처형으로 넘겨주는 법정적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽게 읽히는 동사를 택했습니다.
- source_word: εἰς κρίμα θανάτου
  english_pob_choice: to a sentence of death
  chosen_korean: 사형 선고에
  alternatives_korean:
  - 죽음의 판결에
  - 사형 판결에
  - 사형 언도를 받게 하여
  lexicon: BDAG
  rationale: κρίμα θανάτου는 단순한 ‘죽음’이 아니라 사법적 선고를 가리키므로, ‘사형 선고에’로 압축해 법정적 의미를 분명히 했습니다.
- source_word: ἐσταύρωσαν
  english_pob_choice: crucified
  chosen_korean: 십자가에 못 박았다는 것입니다
  alternatives_korean:
  - 십자가에 못 박았습니다
  - 그를 십자가에 못 박았습니다
  lexicon: BDAG
  rationale: 직접 행위 동사를 살리되, 한국어에서는 앞의 종결 구조와 맞추어 ‘못 박았다는 것입니다’로 정리해 서술의 종속 관계를 분명히 했습니다.
theological_decisions:
- issue: 지도자들의 책임과 로마 집행의 관계
  chosen_reading: 본문의 직접 진술을 따라 유대 지도자들을 주어로 유지하고, 별도의 설명 없이 그들에게 처형 책임을 귀속시켰습니다.
  alternative_readings:
  - 로마 권력이 실제 집행을 했다
  - 그들이 그를 십자가형에 넘겼다
  rationale: 헬라어는 주어를 ‘우리의 대제사장들과 지도자들’로 두고 직접적으로 ‘십자가에 못 박았다’고 말하므로, 책임 귀속의 강도를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
