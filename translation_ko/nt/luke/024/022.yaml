  naturalness: ‘갔었습니다’는 이 문맥에서 불필요하게 겹친 과거로 들립니다. ‘이른 아침에 무덤으로 갔습니다’가 현대 표준 한국어 합쇼체로 더 자연스럽습니다. 각주 표지도 해당 어구 바로 뒤에 두는 편이 명확합니다.
  terminology: ‘여인들’, ‘무덤’, ‘우리’를 유지한 것은 문맥과 한국어 성경 문체에 적절합니다. ἐξέστησαν의 강한 놀라움은 ‘몹시 놀라게도 했습니다’로 보존하되, 믿음이나 불신이라는 해석을 덧붙이지 않습니다.
