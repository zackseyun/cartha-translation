  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
  footnotes:
  - marker: a
    text: Or 'amazed us' or 'bewildered us.' The Greek verb can express strong surprise or disorientation.
    reason: lexical_alternative
  - marker: b
    text: Or 'at dawn.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 우리 가운데 몇몇 여인들이 우리를 몹시 놀라게도 했습니다.[a] 그들은 이른 아침에 무덤으로 갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리둥절하게 했습니다’. 그리스어 동사는 강한 놀라움이나 당혹감을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘새벽에’, ‘동틀 무렵에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  english_pob_choice: But also
  chosen_korean: 그러나
  alternatives_korean:
  - 그런데도
  - 뿐만 아니라
  lexicon: BDAG
  rationale: 앞절과의 대조를 살리되, 한국어에서는 이어지는 놀라움을 자연스럽게 여는 접속사로 ‘그러나’를 택했습니다.
- source_word: γυναῖκές τινες ἐξ ἡμῶν
  english_pob_choice: some women from among us
  chosen_korean: 우리 가운데 몇몇 여인들
  alternatives_korean:
  - 우리 중 몇몇 여자들
  - 우리 가운데 몇몇 여성들
  lexicon: BDAG
  rationale: 무리 안에 속한 인물임을 드러내는 ἐξ ἡμῶν을 ‘우리 가운데’로 옮기고, 문맥상 자연스러운 ‘여인들’을 택했습니다.
- source_word: ἐξέστησαν ἡμᾶς
  english_pob_choice: astonished us
  chosen_korean: 우리를 놀라게 했습니다
  alternatives_korean:
  - 우리를 놀라게 했습니다만
  - 우리를 놀라게 하였습니다
  - 우리를 어리둥절하게 했습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 놀람을 넘어 강한 충격이나 방향 감각의 흔들림까지 담을 수 있으나, 여기서는 과도한 해석을 피하면서도 반응의 강도를 살렸습니다.
- source_word: ὀρθριναὶ
  english_pob_choice: early in the morning
  chosen_korean: 새벽에
  alternatives_korean:
  - 이른 아침에
  - 동틀 무렵에
  lexicon: BDAG
  rationale: ‘아침 일찍’의 시간성을 간결하게 살리면서, 영어 각주처럼 해석 여지를 남길 수 있는 한국어 표현으로 옮겼습니다.
- source_word: ἐπὶ τὸ μνημεῖον
  english_pob_choice: to the tomb
  chosen_korean: 무덤으로
  alternatives_korean:
  - 무덤에
  - 묘지로
  lexicon: BDAG
  rationale: ἐπί+대격의 이동 방향을 반영해 ‘-으로’로 옮기고, 예수의 장례 문맥에 맞는 ‘무덤’을 사용했습니다.
theological_decisions:
- issue: ἐξέστησαν의 서사적 강도와 부활 증언의 긴장 유지
  chosen_reading: ‘놀라게 했습니다’로 옮겨, 여인들의 말을 들은 제자들의 반응이 아직 믿음이나 불신으로 확정되지 않도록 했습니다.
  alternative_readings:
  - ‘놀랐습니다’
  - ‘어리둥절하게 했습니다’
  rationale: 본문은 여인들의 증언이 가져온 반응만 전하며 결론을 내리지 않으므로, 한국어도 그 긴장을 그대로 보존해야 합니다.
  doctrine_reference: 부활 서사에서 서술자의 판단을 앞서지 않음
