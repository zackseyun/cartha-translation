revisions:
- from: 그러나 우리 가운데 몇몇 여인들이 우리를 놀라게 했습니다. 그들은 새벽에 무덤으로 갔었습니다.[a][b]
  to: 그런데 우리 가운데 몇몇 여인들이 우리를 몹시 놀라게도 했습니다.[a] 그들은 이른 아침에 무덤으로 갔습니다.[b]
  rationale: 대조와 첨가를 함께 지닌 ἀλλὰ καί를 ‘그런데 … 놀라게도’로 옮겼습니다. ἐξέστησαν의 강도를 ‘몹시’로 나타내면서도, 여인들의 증언에 대한 화자들의 판단을 믿음이나 불신으로 확정하지 않았습니다. 분사구는 자연스러운 한국어 문장으로 풀어 ‘그들은 이른 아침에 무덤으로 갔습니다’로 옮겼고, 각주는 실제 번역 대안을 해당 어구에 연결하도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:50Z'
