lexical_decisions:
- source_word: εἰσελθοῦσαι
  english_pob_choice: when they entered
  chosen_korean: 안으로 들어갔지만
  alternatives_korean:
  - 들어갔을 때
  - 들어간 뒤
  lexicon: BDAG
  rationale: 여성 복수 분사로 앞의 여자들을 가리키며, 서술 흐름을 자연스럽게 살려 ‘안으로 들어갔지만’으로 옮겼습니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 하지만
  alternatives_korean:
  - 그리고
  - 또
  lexicon: BDAG
  rationale: 이야기 전개에서 기대와 다른 결과를 이어 주는 완만한 대조를 한국어 ‘하지만’으로 반영했습니다.
- source_word: οὐχ εὗρον
  english_pob_choice: they did not find
  chosen_korean: 찾지 못했습니다
  alternatives_korean:
  - 찾지 않았습니다
  - 발견하지 못했습니다
  lexicon: BDAG
  rationale: 부정된 aorist ‘찾다’를 현대 한국어의 간결한 서술형으로 옮겨, 사건의 결과를 직설적으로 드러냈습니다.
- source_word: τὸ σῶμα
  english_pob_choice: the body
  chosen_korean: 그 몸
  alternatives_korean:
  - 그 시신
  - 몸
  lexicon: BDAG
  rationale: '본문에는 단순히 ‘몸’(σῶμα)만 있으며, 영어 POB의 ‘the body’를 따라 ‘그 몸’으로 두어 추가 해석(예: ‘주 예수의 몸’)을 넣지 않았습니다.'
theological_decisions:
- issue: 본문에 없는 소유격 확장 여부
  chosen_reading: 그 몸
  alternative_readings:
