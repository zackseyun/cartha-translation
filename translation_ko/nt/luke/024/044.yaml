id: LUK.24.44
reference: Luke 24:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
  footnotes:
  - marker: a
    text: Or 'all the things written.'
    reason: lexical_alternative
  - marker: b
    text: '''The Law of Moses and the Prophets and the Psalms'' likely refers to the major divisions of Israel''s Scriptures; ''Psalms'' may stand specifically for the Psalter or more broadly for the Writings.'
    reason: cultural_note
  - marker: c
    text: Or 'concerning me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “내가 아직 너희와 함께 있을 때 너희에게 한 내 말들은 다음과 같습니다. 곧 나에 관하여[c] 모세의 율법과 예언서와 시편[b]에 기록된 모든 것[a]이 반드시 이루어져야 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기록되어 있는 모든 것’.
    reason: lexical_alternative
  - marker: b
    text: ‘모세의 율법과 예언서와 시편’은 이스라엘 성경의 주요 구분을 가리키는 표현으로 보이며, ‘시편’은 시편집 자체를 가리키거나 더 넓게는 성문서 전체를 대표할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나에 대하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  english_pob_choice: Then he said
  chosen_korean: 그때 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 예수께서 그들에게 말씀하셨습니다
  - 예수께서 또 그들에게 말씀하셨습니다
  lexicon: BDAG
  rationale: δέ는 서술을 자연스럽게 이어 주는 약한 연결이므로, 한국어에서는 시간 전환을 나타내는 '그때'로 매끄럽게 처리했습니다.
- source_word: Οὗτοι οἱ λόγοι μου
  english_pob_choice: These are my words
  chosen_korean: 이것들은 … 내 말들입니다
  alternatives_korean:
  - 이것들은 내 말씀입니다
  - 이것들은 내 말입니다
  lexicon: BDAG
  rationale: λόγοι를 단수의 '말씀'보다 직접적인 복수 감각이 살아 있는 '말들'로 옮겨, 복수형과 지시어의 힘을 보존했습니다.
- source_word: δεῖ πληρωθῆναι
  english_pob_choice: must be fulfilled
  chosen_korean: 반드시 이루어져야 한다는 것입니다
  alternatives_korean:
  - 반드시 성취되어야 한다는 것입니다
  - 반드시 완성되어야 한다는 것입니다
  lexicon: BDAG
  rationale: δεῖ의 필연성과 수동 부정과거 부정사 πληρωθῆναι의 성취/실현 의미를 살려, 예언 성취의 필연을 자연스러운 한국어로 표현했습니다.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  english_pob_choice: in the Law of Moses and the Prophets and the Psalms
  chosen_korean: 모세의 율법과 예언서와 시편
  alternatives_korean:
  - 모세의 율법과 예언자들과 시편
  - 모세 율법과 예언서와 시편
  lexicon: BDAG
  rationale: νόμος는 기본적으로 '율법'으로, προφήταις는 성경의 분류를 드러내는 '예언서'로 옮겼습니다. ψαλμοῖς는 직역하되, 성경의 주요 분류를 가리키는 표현으로 읽히도록 했습니다.
theological_decisions:
- issue: ‘율법과 예언서와 시편’의 성경 분류성
  chosen_reading: 주요 성경 분류를 가리키는 표현으로 자연스럽게 옮기되, 본문 안에서는 추가 설명을 넣지 않았습니다.
  alternative_readings:
  - ‘모세의 율법과 예언자들과 시편’처럼 인물군으로 읽기
  - ‘율법·예언서·성문서’처럼 더 기술적으로 풀기
  rationale: 헬라어는 이스라엘 성경의 넓은 범위를 가리키지만, 본문 자체는 기술적 설명을 요구하지 않습니다. 번역문은 분류성을 암시하면서도 과잉 해석은 피하는 편이 적절합니다.
  doctrine_reference: 원문 우선과 해석 절제
- issue: πληρωθῆναι의 신적 필연성
  chosen_reading: ‘반드시 이루어져야 한다’로 옮겨, 예수의 말이 단순한 예견이 아니라 필연적 성취를 말한다는 점을 보존했습니다.
  alternative_readings:
  - ‘이루어질 수밖에 없다’
  - ‘성취될 것이다’
  rationale: 본문의 δεῖ는 신적 필요를 드러내므로, 약화된 미래형보다 필연성을 드러내는 표현이 원문에 더 가깝습니다.
  doctrine_reference: 신학적 긴장을 유지
