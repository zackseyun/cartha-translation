revisions:
- from: 그때 예수께서 그들에게 말씀하셨습니다. “이것들은 내가 아직 너희와 함께 있을 때 너희에게 말했던 내 말들입니다. 곧 나에 관하여 모세의 율법과 예언서와 시편에 기록된 모든 것이 반드시 이루어져야 한다는 것입니다.”[a][b][c]
  to: 예수께서 그들에게 말씀하셨습니다. “내가 아직 너희와 함께 있을 때 너희에게 한 내 말들은 다음과 같습니다. 곧 나에 관하여[c] 모세의 율법과 예언서와 시편[b]에 기록된 모든 것[a]이 반드시 이루어져야 합니다.”
  rationale: 접속사 δέ에 대한 과도한 시간화는 제거했습니다. λόγοι의 복수와 ὅτι가 이끄는 발화 내용을 자연스러운 한국어 인용 구조로 옮겼으며, ‘반드시 이루어져야 합니다’로 δεῖ πληρωθῆναι의 필연성과 수동적 성취를 유지했습니다. 각주 a와 c를 각각 πάντα τὰ γεγραμμένα 및 περὶ ἐμοῦ에 정확히 연결하고, 본문 내 해당 위치에 표지를 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:03Z'
