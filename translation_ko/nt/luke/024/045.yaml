- source_word: αὐτῶν τὸν νοῦν
  english_pob_choice: their minds
  chosen_korean: 그들의 마음
  alternatives_korean:
  - 그들의 생각
  - 그들의 이해력
  lexicon: BDAG
  rationale: νοῦς는 이해·인식의 자리이므로 한국어에서는 ‘마음’이 자연스럽고, ‘이해력’은 기능 설명으로 지나치게 추상적입니다.
- source_word: τοῦ συνιέναι τὰς γραφάς
  english_pob_choice: to understand the Scriptures
  chosen_korean: 성경을 깨닫게 하셨습니다
  alternatives_korean:
