  source_fidelity: 핵심 구문은 충실합니다. 다만 συνιέναι는 우선적으로 ‘이해하다’를 뜻하므로, ‘깨닫게 하셨습니다’보다 ‘이해하게 하셨습니다’가 원문의 인지적 의미와 영어 POB의 ‘understand’를 더 직접적으로 반영합니다. ‘마음을 열어’는 διανοίγω와 νοῦς의 비유를 자연스럽게 보존하며, ‘성경’은 복수 γραφάς의 집합적 지시 대상을 한국어에서 적절히 나타냅니다.
  naturalness: ‘그때 예수께서 그들의 마음을 열어 성경을 이해하게 하셨습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 목적/결과 관계도 무리 없이 드러냅니다.
  terminology: ‘성경’은 이 문맥의 γραφάς에 적절합니다. ‘마음’은 νοῦς의 구체적 비유를 살리는 자연스러운 표현이고, ‘이해력’은 가능한 설명적 대안입니다. ‘깨닫다’도 가능한 번역이지만, 본문은 특별한 계시 체험으로 한정하지 않고 성경을 이해하는 행위를 말하므로 본문에는 ‘이해하다’를 채택합니다.
  issues:
