  lexicon: BDAG
  rationale: 목적의 부정사 의미를 한국어 동사구로 자연스럽게 풀어 ‘깨닫게 하셨습니다’로 옮겼고, γραφαί는 이 문맥에서 성경을 가리킨다고 보았습니다.
theological_decisions:
- issue: 예수의 사역을 ‘마음 여심’으로 직역할지, 설명적 번역으로 풀지 여부
  chosen_reading: ‘그들의 마음을 열어’라고 직접적으로 번역해, 이해가 가능해진 행위를 본문대로 드러냈습니다.
  alternative_readings:
  - 그들이 이해하도록 도우셨습니다
  - 성경을 설명해 주셨습니다
  rationale: 헬라어는 예수께서 이해의 기능 자체를 여시는 것으로 말하므로, 설명으로 대체하지 않고 원문의 신학적 진술을 보존했습니다.
  doctrine_reference: 성경 이해에 대한 예수의 주권적 개입을 본문 수준에서 보존
