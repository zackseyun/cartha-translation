revisions:
- from: 그분의 몸을 찾지 못하고 돌아와서는, 「천사의 환상을 보았다」고 말했으며, 그들은 그분이 살아 계시다고 말합니다.[a]
  to: 그들은 그분의 몸을 찾지 못하고 와서, 또한 천사들이 나타난 환상을 보았으며, 그 천사들이 그분이 살아 계시다고 말한다고 하였습니다.[a]
  rationale: ‘왔다’를 유지하고, 천사들이 선행사라는 주된 문법적 판단을 본문에서 분명히 했습니다. 동시에 οἳ의 대안적 지시 가능성은 각주에 보존했습니다. 각주 표지는 관련된 관계절 뒤에 두어 대안 해석의 범위를 정확히 표시했습니다.
