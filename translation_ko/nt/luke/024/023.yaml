id: LUK.24.23
reference: Luke 24:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
  footnotes:
  - marker: a
    text: Or, less likely, 'they came saying that they had seen a vision of angels and that they say he is alive,' taking 'who say' as referring to the women rather than the angels.
    reason: alternative_reading
  - marker: b
    text: Or 'saying that they had even seen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분의 몸을 찾지 못하고 돌아와서는, 「천사의 환상을 보았다」고 말했으며, 그들은 그분이 살아 계시다고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 덜 가능하게는, ‘그들이 와서 천사의 환상을 보았고 그들이 그분이 살아 계시다고 말한다’로도 옮길 수 있습니다. 이 경우 ‘who say’는 천사들이 아니라 여인들을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ
  english_pob_choice: not finding his body
  chosen_korean: 그분의 몸을 찾지 못하고
  alternatives_korean:
  - 그분의 몸을 발견하지 못하고
  - 그분의 시신을 찾지 못하고
  lexicon: BDAG
  rationale: 분사구문은 한국어에서 자연스러운 부사적 연결로 옮겼고, σῶμα는 부활·장례 문맥에서 직설적으로 ‘몸’으로 옮겨 원문의 표현을 유지했습니다.
- source_word: ἦλθον λέγουσαι
  english_pob_choice: they came saying
  chosen_korean: 돌아와서는 …고 말했으며
  alternatives_korean:
  - 와서 말했으며
  - 돌아와 말하며
  lexicon: BDAG
  rationale: ἦλθον은 단순히 ‘왔다’이지만 문맥상 무덤에서 돌아옴을 자연스럽게 드러내어 ‘돌아와서는’으로 옮겼고, λέγουσαι는 이어지는 말하기 동작으로 처리했습니다.
- source_word: ὀπτασίαν ἀγγέλων
  english_pob_choice: a vision of angels
  chosen_korean: 천사의 환상을
  alternatives_korean:
  - 천사들의 환시를
  - 천사들의 모습을
  lexicon: BDAG
  rationale: ὀπτασία는 초자연적 ‘환상/환시’의 뜻이므로 ‘환상’으로 옮겨 extraordinary한 성격을 살렸고, ἀγγέλων은 소유격 관계를 자연스럽게 ‘천사의’로 처리했습니다.
- source_word: οἳ λέγουσιν αὐτὸν ζῆν
  english_pob_choice: who say that he is alive
  chosen_korean: 그들은 그분이 살아 계시다고 말합니다
  alternatives_korean:
  - 그분이 살아 계시다고 말하는 그 천사들은
  - 그분이 살아 있다고 말합니다
  lexicon: BDAG
  rationale: 관계대명사 οἳ는 가장 가까운 선행사인 ‘천사들’을 받는 것으로 읽되, 한국어에서는 반복을 줄이기 위해 뒤 문장을 독립적으로 처리했습니다.
- source_word: ζῆν
  english_pob_choice: is alive
  chosen_korean: 살아 계시다고
  alternatives_korean:
  - 살아 있다고
  - 살아 계신다고
  lexicon: BDAG
  rationale: 부활 선포의 내용을 현대 한국어에서 자연스럽게 전달하기 위해 ‘살아 계시다’를 사용했고, 주어가 예수님을 가리키므로 존칭을 썼습니다.
theological_decisions:
- issue: οἳ λέγουσιν의 지시 대상
  chosen_reading: ‘천사들’이 ‘그분이 살아 계시다’고 말하는 것으로 번역했습니다.
  alternative_readings:
  - ‘여인들이 … 그분이 살아 계시다고 말한다’로 읽는 해석
  rationale: 가장 가까운 선행사는 ἀγγέλων이며, 본문 흐름상 천사들의 선포가 자연스럽습니다. 다만 문법적 대안 해석은 주석적 여지를 남길 수 있으므로 각주로 보존했습니다.
  doctrine_reference: 문법적 애매성을 해소하되, 본문의 대안 해석 가능성은 소거하지 않습니다.
