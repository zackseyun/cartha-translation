  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘돌아와서는’은 문맥상 가능한 보충이나 ἦλθον(‘왔다’)보다 구체적입니다. 또한 ‘그들은’은 원문에서 가장 자연스러운 선행사인 천사들을 한국어에서 분명히 드러내지 못하여, 여인들로 오해될 수 있습니다. ὀπτασίαν ἀγγέλων은 ‘천사들이 나타난 환상’으로 옮겨 ‘천사들이 본 환상’이라는 소유격 오독도 피했습니다. δεύτερη καί의 첨가적/강조적 기능은 ‘또한’으로 반영했습니다.
  naturalness: 합쇼체의 현대 표준어로 자연스럽게 다듬었습니다. 여인들의 과거 보고와 천사들의 현재 발화를 ‘말한다고 하였습니다’로 연결하여, λέγουσιν의 현재형을 가능한 한 보존하면서도 한국어 간접화법의 자연스러움을 유지했습니다.
  terminology: σῶμα는 ‘몸’, ὀπτασία는 ‘환상’, ἄγγελοι는 ‘천사들’, ζῆν은 예수님을 가리키는 문맥에 맞추어 ‘살아 계시다’로 유지했습니다. 특정 교리적 해석을 추가하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘돌아와서는’이 ἦλθον을 문맥적으로 구체화합니다.
    rationale: 원문은 문자적으로 ‘왔다’라고 할 뿐, 이 절 자체에서 ‘돌아왔다’를 명시하지 않습니다. 한국어에서도 ‘와서’로 충분히 자연스럽고 원문에 더 가깝습니다.
  - severity: high
    issue: ‘그들은’의 지시 대상이 한국어에서 모호합니다.
    rationale: 원문의 남성 복수 관계대명사 οἳ는 가장 가까운 선행사인 ‘천사들’을 받는 것이 자연스럽지만, 초안의 독립절 ‘그들은’은 앞 절의 여인들을 가리키는 것으로도 쉽게 읽힙니다. ‘그 천사들이’로 명시해야 합니다.
  - severity: medium
    issue: ‘천사의 환상’은 한국어에서 소유 관계로도 읽힐 수 있습니다.
    rationale: ὀπτασίαν ἀγγέλων은 천사들이 나타난 환상을 뜻합니다. ‘천사들이 나타난 환상’은 의미 관계를 자연스럽고 명료하게 전달합니다.
  revised_text: 그들은 그분의 몸을 찾지 못하고 와서, 또한 천사들이 나타난 환상을 보았으며, 그 천사들이 그분이 살아 계시다고 말한다고 하였습니다.[a]
