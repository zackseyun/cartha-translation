    text: Some manuscripts omit this sentence.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이렇게 말씀하신 뒤에, 그들에게 자기 손과 발을 보여 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 어떤 사본들은 이 문장을 생략합니다.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  english_pob_choice: after saying this
  chosen_korean: 그리고 이렇게 말씀하신 뒤에
  alternatives_korean:
  - 그렇게 말씀하신 뒤에
  - 이 말씀을 하신 후에
  lexicon: BDAG
  rationale: 앞선 말을 가리키는 τοῦτο와 선행 행위를 나타내는 분사 구조를 자연스러운 현대 한국어의 시간 순서 표현으로 옮겼습니다.
- source_word: ἔδειξεν
  english_pob_choice: he showed
  chosen_korean: 보여 주셨습니다
  alternatives_korean:
  - 보이셨습니다
  - 드러내셨습니다
  lexicon: BDAG
  rationale: 예수께서 제자들에게 상처 난 실체를 직접 확인시키는 맥락이므로, 단순한 '보여주다'를 살려 자연스럽고 분명하게 옮겼습니다.
- source_word: τὰς χεῖρας καὶ τοὺς πόδας
  english_pob_choice: his hands and his feet
  chosen_korean: 자기 손과 발
  alternatives_korean:
  - 그의 손과 발
  - 손과 발
  lexicon: BDAG
  rationale: 헬라어는 소유격 대명사가 없지만 문맥상 예수 자신의 신체를 가리키므로 한국어에서는 '자기'를 보충해 자연스럽게 전달했습니다.
theological_decisions:
- issue: 본절의 본문 상태
  chosen_reading: 본문에는 포함하되 각주로 일부 사본의 생략 가능성을 밝혔습니다.
  alternative_readings:
  - 일부 사본에서는 이 문장을 생략합니다.
  rationale: SBLGNT가 이 문장을 괄호 처리한 점을 따라 본문에 번역하되, 본문의 확실성에 대한 중요한 텍스트 비평 정보를 각주로 보존했습니다.
  doctrine_reference: 본문 비평의 투명성 유지
- issue: 예수의 몸의 확인 가능성
  chosen_reading: 손과 발을 직접 보여 주신 것으로 옮겼습니다.
  alternative_readings:
  - 손과 발을 나타내 보이셨습니다.
  - 손과 발을 내보이셨습니다.
  rationale: 부활하신 예수의 실제성을 강조하는 문맥을 따라, 단순한 상징적 '보임'이 아니라 제자들이 확인할 수 있는 신체적 제시를 드러냈습니다.
  doctrine_reference: 부활의 جسم적 실재성
