lexical_decisions:
- source_word: τοῦτο εἰπὼν
  english_pob_choice: after saying this
  chosen_korean: 그리고 이렇게 말씀하신 뒤에
  alternatives_korean:
  - 그렇게 말씀하신 뒤에
  - 이 말씀을 하신 후에
  lexicon: BDAG
  rationale: 앞선 말을 가리키는 τοῦτο와 선행 행위를 나타내는 분사 구조를 자연스러운 현대 한국어의 시간 순서 표현으로 옮겼습니다.
- source_word: ἔδειξεν
  english_pob_choice: he showed
  chosen_korean: 보여 주셨습니다
