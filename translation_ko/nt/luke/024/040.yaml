  rationale: 예수께서 제자들에게 상처 난 실체를 직접 확인시키는 맥락이므로, 단순한 '보여주다'를 살려 자연스럽고 분명하게 옮겼습니다.
- source_word: τὰς χεῖρας καὶ τοὺς πόδας
  english_pob_choice: his hands and his feet
  chosen_korean: 자기 손과 발
  alternatives_korean:
  - 그의 손과 발
  - 손과 발
  lexicon: BDAG
  rationale: 헬라어는 소유격 대명사가 없지만 문맥상 예수 자신의 신체를 가리키므로 한국어에서는 '자기'를 보충해 자연스럽게 전달했습니다.
