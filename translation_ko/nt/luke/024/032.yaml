base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
  footnotes:
  - marker: a
    text: Or 'our hearts'; Greek has the singular 'our heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'on the way.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'opening the Scriptures,' that is, making their meaning clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로 말했습니다. “우리 마음이 우리 안에서 타오르고 있지 않았습니까? 그가 길에서 우리에게 말씀하실 때, 또 성경을 우리에게 열어 주실 때 말입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 마음들’; 헬라어는 단수형인 ‘우리 마음’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘길 위에서’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘성경을 여는 것’이며, 곧 그 뜻을 분명히 풀어 주는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 서로에게
  - 서로 간에
  lexicon: BDAG
  rationale: 상호 대화를 나타내는 관용적 표현이므로, 자연스러운 현대 한국어로는 ‘서로’가 가장 간결하고 정확합니다.
- source_word: ἡ καρδία ἡμῶν
  english_pob_choice: our heart
  chosen_korean: 우리 마음
  alternatives_korean:
  - 우리의 마음
  - 우리들 마음
  - 우리 마음들
  lexicon: BDAG
  rationale: 헬라어는 단수형이지만, 한국어에서는 ‘마음’이 내적 중심을 자연스럽게 가리키므로 단수 의미를 살리되 어색한 직역을 피했습니다.
- source_word: καιομένη
  english_pob_choice: burning
  chosen_korean: 타오르고 있지 않았습니까
  alternatives_korean:
  - 불타고 있지 않았습니까
  - 타고 있지 않았습니까
  lexicon: BDAG
  rationale: 비유적 ‘불타다’의 이미지를 유지하면서 현재 분사와 질문형의 생동감을 살리기 위해 ‘타오르고 있지 않았습니까’로 옮겼습니다.
- source_word: διήνοιγεν
  english_pob_choice: he was opening
  chosen_korean: 열어 주실 때
  alternatives_korean:
  - 열고 계실 때
  - 열어 가실 때
  - 열어 보이실 때
  lexicon: BDAG
  rationale: 문맥상 성경의 의미를 풀어 주는 행위이므로, 본문의 은유를 해치지 않으면서 한국어에서 자연스러운 ‘열어 주다’로 표현했습니다.
theological_decisions:
- issue: ‘우리 마음이 타오르다’의 비유 유지
  chosen_reading: 내적 감동이나 이해로 풀어 쓰지 않고, 불타는 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 우리 마음이 깊이 움직이지 않았습니까
  - 우리 안에 불이 붙지 않았습니까
  rationale: 본문은 체험의 성격을 규정하지 않고 비유만 제시하므로, 의미를 과도하게 해석하지 않고 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
