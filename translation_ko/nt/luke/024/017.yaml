id: LUK.24.17
reference: Luke 24:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
  footnotes:
  - marker: a
    text: Or “What are these matters that you are discussing with one another as you walk?”
    reason: lexical_alternative
  - marker: b
    text: Or “they stopped, looking downcast.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “너희가 걸어가면서 서로 주고받는 이 말들은 무엇입니까?” 그러자 그들은 멈춰 서서 침울한 표정을 지었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희가 걸어가면서 서로 이야기하는 이 일들은 무엇입니까?”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들은 멈춰 섰고, 침울해 보였습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  english_pob_choice: And he said to them
  chosen_korean: 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그들에게 말씀하셨습니다
  - 그들에게 이르셨습니다
  lexicon: BDAG
  rationale: οὐδὲ/δέ의 약한 연결과 대화 도입을 자연스럽게 살리면서, 예수의 직접 발화를 한국어 공손체로 분명히 드러냈습니다.
- source_word: Τίνες οἱ λόγοι οὗτοι
  english_pob_choice: What are these words
  chosen_korean: 이 말들은 무엇이냐
  alternatives_korean:
  - 이 일들은 무엇이냐
  - 이 대화는 무엇이냐
  lexicon: BDAG
  rationale: λόγοι를 기본적으로 ‘말들’로 옮겨 원문의 어휘를 유지하되, 문맥상 실제로 주고받는 대화를 가리키므로 한국어에서는 자연스럽게 다듬었습니다.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  english_pob_choice: you are exchanging with one another
  chosen_korean: 서로 주고받는
  alternatives_korean:
  - 서로 나누는
  - 서로 이야기하는
  lexicon: BDAG
  rationale: ἀντιβάλλω의 상호적 말 주고받음을 살려 ‘주고받는’으로 옮겼습니다. 단순한 ‘이야기하다’보다 교환적 뉘앙스가 더 드러납니다.
- source_word: περιπατοῦντες
  english_pob_choice: as you walk
  chosen_korean: 걸어가면서
  alternatives_korean:
  - 걸으면서
  - 가는 길에
  lexicon: BDAG
  rationale: 동시 동작을 자연스러운 한국어 부사절로 표현해, 걸어가는 중 대화가 진행된다는 점을 살렸습니다.
- source_word: ἐστάθησαν σκυθρωποί
  english_pob_choice: they stood still, looking sad
  chosen_korean: 그들은 멈춰 서서 슬퍼하는 모습이었습니다
  alternatives_korean:
  - 그들은 멈춰 서서 우울한 표정을 지었습니다
  - 그들은 멈춰 서서 침울했습니다
  lexicon: BDAG
  rationale: ἐστάθησαν은 ‘멈춰 서다’로, σκυθρωποί는 얼굴빛/표정을 가리키는 형용사이므로 ‘슬퍼하는 모습’으로 시각적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 예수의 질문체를 직설형으로 유지할지 간접화할지
  chosen_reading: 직접 질문과 대화체를 유지하되, 한국어에서는 공손한 서술식+직접 인용으로 처리했습니다.
  alternative_readings:
  - 예수께서 그들에게 물으셨습니다
  - 예수께서 그들에게 말씀하셨습니다. “...?”
  rationale: 원문은 질문을 담은 말하기 동사이므로, 질문의 생동감을 유지하면서도 현대 합쇼체에 맞게 자연스럽게 제시했습니다.
  doctrine_reference: 서사 문맥의 직접화법 보존
