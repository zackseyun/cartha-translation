language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
  footnotes:
  - marker: a
    text: Or “Jesus of Nazareth”; Greek “Jesus the Nazarene.”
    reason: lexical_alternative
  - marker: b
    text: Or “who was a man, a prophet”; the verb can be rendered more idiomatically as “was,” though Greek more literally says “became.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 그들에게 말씀하셨습니다. “무슨 일입니까?” 그들이 그분에게 말했습니다. “나사렛 사람 예수[a]에 관한 일들입니다. 그분은 하나님과 온 백성 앞에서 행동과 말에 능하신 예언자이신 한 사람이 되셨습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나사렛 예수”; 헬라어는 “나사렛 사람 예수”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “예언자이신 한 사람이셨습니다”; ἐγένετο는 문맥상 더 관용적으로 “이셨습니다”로 옮길 수 있으나, 더 문자적으로는 “되셨습니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  english_pob_choice: What things?
  chosen_korean: 무슨 일입니까?
  alternatives_korean:
  - 무슨 것들입니까?
  - 어떤 일입니까?
  lexicon: BDAG
  rationale: 복수형의 뜻을 살리면서도 한국어에서는 자연스럽게 ‘일들’로 묶어 묻는 표현이 가장 읽기 좋습니다.
- source_word: Τὰ περὶ Ἰησοῦ
  english_pob_choice: The things concerning Jesus
  chosen_korean: 나사렛 예수에 관한 일들입니다
  alternatives_korean:
  - 예수에 관한 일들입니다
  - 예수와 관련된 일들입니다
  lexicon: BDAG
  rationale: περί의 ‘관한’ 뜻을 드러내고, 영어 audit의 형식성을 유지하되 한국어로는 자연스럽게 옮겼습니다.
- source_word: Ναζαρηνοῦ
  english_pob_choice: the Nazarene
  chosen_korean: 나사렛
  alternatives_korean:
  - 나사렛 사람
  - 나사렛 예수
  lexicon: BDAG
  rationale: 문맥상 고유 식별 표현이므로 ‘나사렛 예수’로 풀어 쓰는 편이 한국어 독자에게 가장 분명합니다. ‘나사렛 사람’은 어색하고, 단순 음역은 식별성이 떨어집니다.
- source_word: ἐγένετο ἀνὴρ προφήτης
  english_pob_choice: who became a man, a prophet
  chosen_korean: 한 사람으로서 나타나셨습니다
  alternatives_korean:
  - 한 사람, 예언자로 되셨습니다
  - 한 사람, 예언자이셨습니다
  lexicon: BDAG
  rationale: ἐγένετο의 ‘되다/나타나다’ 뉘앙스를 살리되, 한국어에서는 ‘되셨습니다’보다 ‘나타나셨습니다’가 자연스럽습니다. ἀνὴρ를 단순한 ‘남자’로 좁히기보다 인물성을 드러내는 ‘한 사람’으로 옮겼습니다.
- source_word: προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  english_pob_choice: a prophet mighty in deed and word
  chosen_korean: 예언자이신 한 사람으로서 … 행위와 말에 능하신
  alternatives_korean:
  - 행동과 말에 능하신 예언자
  - 일과 말에 능하신 예언자
  lexicon: BDAG
  rationale: ‘예언자’는 본문의 명시적 호칭을 보존하고, δυνατός는 ‘능하다’로 옮겨 힘과 역량을 함께 담았습니다. ἐν ἔργῳ καὶ λόγῳ는 관용적으로 ‘행위와 말’로 풀었습니다.
theological_decisions:
- issue: ἀνὴρ를 예수에 대해 어떻게 반영할지
  chosen_reading: ‘한 사람’으로 살리되 성별 표지를 전면화하지 않았습니다.
  alternative_readings:
  - ‘남자’로 번역
  - 생략하고 ‘예언자’만 남김
  rationale: 본문은 분명히 ἀνήρ를 포함하지만, 한국어에서는 예수의 공적 묘사에서 ‘남자’가 오히려 부자연스럽고 신학적 효과를 과장할 수 있습니다. ‘한 사람’은 원문의 인물 표지를 보존하면서도 매끄럽습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
