  naturalness: ‘예언자이신 한 사람으로서 나타나셨습니다’는 한국어 문장 구조가 부자연스럽고 수식 관계가 불명확합니다. ‘예언자이신 한 사람이 되셨습니다’는 원문의 다소 이례적인 표현을 보존하면서 현대 표준 한국어로 읽힙니다.
