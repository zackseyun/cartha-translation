  source_fidelity: 주본문은 제공된 SBLGNT의 짧은 읽기(Ταῦτα δὲ αὐτῶν λαλούντων αὐτὸς ἔστη ἐν μέσῳ αὐτῶν)를 따르며, 진행 중인 말함, αὐτός의 강조, 그리고 ἔστη의 완료적 사건성을 더 정확히 반영하도록 다듬을 수 있습니다. 장문 인사는 본문에 넣지 않고 사본 변이 각주로 처리하는 것이 적절합니다.
  naturalness: ‘그 자신이’는 현대 표준 한국어 성경 문맥에서 부자연스럽고, ‘서 계셨습니다’는 ἔστη의 단회적 ‘서다’보다 지속 상태를 두드러지게 합니다. 문맥상 지시 대상인 예수님을 밝혀 ‘예수님께서 친히’로 하고, ‘서셨습니다’로 옮기는 편이 자연스럽고 정확합니다.
  terminology: ‘이 일들’은 Ταῦτα의 복수성과 직전 대화 내용의 지시 기능을 자연스럽게 보존합니다. ‘친히’는 αὐτός의 강조를, ‘평강’은 변이 본문의 εἰρήνη에 대한 전통적이면서도 이해 가능한 대응어를 보존합니다.
