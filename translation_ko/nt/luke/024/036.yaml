lexical_decisions:
- source_word: Ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 것들
  alternatives_korean:
  - 이것들
  - 이 일들
  lexicon: BDAG
  rationale: 직전 문맥의 대화를 가리키는 중성 복수 지시어이므로, 복수성과 담화 연계를 살린 ‘이런 것들’로 옮겼습니다.
- source_word: αὐτῶν λαλούντων
  english_pob_choice: they were saying
  chosen_korean: 그들이 … 말하고 있을 때
  alternatives_korean:
  - 그들이 … 말하는 동안
  - 그들이 … 이야기하고 있을 때
  lexicon: BDAG
  rationale: 현재분사 속격절의 동시·진행 의미를 살려 ‘말하고 있을 때’로 표현했습니다.
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그 자신이
  alternatives_korean:
  - 그가
  - 그분께서
  lexicon: BDAG
  rationale: 명시적 대명사의 강조를 살려 ‘그 자신이’로 옮겨, 예수의 अचानक한 현존을 부각했습니다.
- source_word: ἔστη ἐν μέσῳ αὐτῶν
  english_pob_choice: stood among them
  chosen_korean: 그들 가운데 서 계셨습니다
  alternatives_korean:
  - 그들 가운데 서셨습니다
  - 그들 한가운데 서 계셨습니다
  lexicon: BDAG
  rationale: ἵστημι의 기본 의미를 따라 ‘서 계셨습니다’로 옮기되, ‘ἐν μέσῳ αὐτῶν’은 자연스러운 현대 한국어 관용인 ‘그들 가운데’로 처리했습니다.
theological_decisions:
- issue: 본문의 짧은 SBLGNT 읽기와 장문 변이 독법 처리
  chosen_reading: 주본문에서는 ‘그들 가운데 서 계셨습니다’에서 끝내고, 장문 변이 ‘그리고 그들에게 “평강이 너희에게 있기를.”이라고 말씀하신다’는 주석으로만 보존했습니다.
  alternative_readings:
  - 본문에 장문 변이를 포함한다
  - 주석 없이 장문 변이를 생략한다
  rationale: 제공된 원문이 SBLGNT의 짧은 본문이므로 본문은 이를 따르되, 중요한 사본 변이를 독자에게 숨기지 않기 위해 각주로 남겼습니다.
  doctrine_reference: 원문 우선 번역 원칙, 사본 변이 보존
