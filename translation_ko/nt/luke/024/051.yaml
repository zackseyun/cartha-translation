review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그런데’는 καὶ ἐγένετο가 나타내는 사건 도입을 대조적 연결로 바꾸어 놓습니다. 또한 원문의 동시성은 유지되지만, 두 문장으로 분리하면서 떠남과 하늘로 올려짐의 연결이 다소 느슨해졌습니다. ‘그들에게서’는 ἀπ’ αὐτῶν의 출발점을 더 분명히 반영합니다.
  naturalness: ‘그들에게 복을 빌어 주실 때에’와 ‘그들에게서 떠나 하늘로 올려지셨습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 불필요한 대조 접속사 없이 문맥을 매끄럽게 이읍니다.
  terminology: εὐλογεῖν은 여기서 ‘복을 빌어 주다’로 자연스럽게 옮길 수 있습니다. ἀνεφέρετο의 수동적 표현은 ‘하늘로 올려지셨습니다’로 보존합니다. 대괄호 친 본문 구절은 본문에 두고, 해당 범위를 정확히 가리키는 사본 변이 각주를 유지합니다.
  issues:
  - severity: medium
    issue: ‘그런데’가 καὶ ἐγένετο를 대조적 전환으로 번역함
    rationale: καὶ ἐγένετο는 누가의 사건 도입 관용구이며, 이 문맥에는 ‘그런데’가 암시하는 대조가 없습니다. 한국어에서는 별도 관용구를 억지로 재현하기보다 시간절을 직접 도입하는 편이 자연스럽고 의미상 안전합니다.
  - severity: low
    issue: ‘그들을 떠나셨습니다’가 ἀπ’ αὐτῶν의 관계를 다소 덜 명시함
    rationale: ‘그들에게서 떠나’는 원문의 ‘그들로부터’를 직접 반영하면서도 자연스럽습니다.
  revised_text: 그분께서 그들에게 복을 빌어 주실 때에, 그분은 그들에게서 떠나 하늘로 올려지셨습니다.[a]
