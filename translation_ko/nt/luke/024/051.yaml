id: LUK.24.51
reference: Luke 24:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
  footnotes:
  - marker: a
    text: Some manuscripts omit 'and was carried up into heaven.'
    reason: textual_variant
translation:
  language: ko
  text: 그분께서 그들에게 복을 빌어 주실 때에, 그분은 그들에게서 떠나 하늘로 올려지셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘하늘로 올려지셨습니다’라는 구절을 생략합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  english_pob_choice: it happened
  chosen_korean: 그런데
  alternatives_korean:
  - 일이 일어났습니다
  - 그 일이 있었습니다
  lexicon: BDAG
  rationale: 누가의 서술적 전환을 한국어에서 자연스럽게 여는 연결어로 옮겼습니다. '일어났습니다'류의 직역보다 문맥 흐름을 더 부드럽게 살립니다.
- source_word: ἐν τῷ εὐλογεῖν
  english_pob_choice: while he was blessing
  chosen_korean: 그들에게 복을 빌어 주시는 동안
  alternatives_korean:
  - 그들을 축복하시는 동안
  - 그들에게 복 주시는 동안
  lexicon: BDAG
  rationale: 진행 중인 동시 동작을 살리되, 한국어에서 예수의 행위가 사람들에게 미치는 방향을 분명히 하기 위해 '복을 빌어 주시는'으로 옮겼습니다.
- source_word: διέστη ἀπ’ αὐτῶν
  english_pob_choice: he parted from them
  chosen_korean: 그들을 떠나셨습니다
  alternatives_korean:
  - 그들과 갈라지셨습니다
  - 그들로부터 분리되셨습니다
  lexicon: BDAG
  rationale: 물리적 이별을 뜻하는 동사를 자연스러운 서술형으로 옮겼습니다. '떠나셨습니다'가 한국어에서 가장 직접적이고 읽기 쉽습니다.
- source_word: ἀνεφέρετο εἰς τὸν οὐρανόν
  english_pob_choice: was carried up into heaven
  chosen_korean: 하늘로 올려지셨습니다
  alternatives_korean:
  - 하늘로 들려 올라가셨습니다
  - 하늘로 옮겨지셨습니다
  lexicon: BDAG
  rationale: 수동적 상승을 보존하면서도 한국어에서 과도하게 장황하지 않게 옮겼습니다. '올려지셨습니다'가 수동성을 가장 분명히 드러냅니다.
theological_decisions:
- issue: SBLGNT의 대괄호 처리된 'καὶ ἀνεφέρετο εἰς τὸν οὐρανόν'의 본문 반영
  chosen_reading: 본문에 포함하되 각주로 본문 변이 가능성을 표시했습니다.
  alternative_readings:
  - 본문에서 생략
  - 후기 첨가 가능성만 주석 처리
  rationale: 제공된 원문에 해당 구가 포함되어 있고 누가-사도행전의 승천 서술과도 부합하므로 본문에 살리되, 사본 차이를 가리는 대신 투명하게 남겼습니다.
  doctrine_reference: 본문 비평의 불확실성은 숨기지 않고 기록하며, 문맥에 맞는 의미를 유지합니다.
