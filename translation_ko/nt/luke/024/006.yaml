  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
  footnotes:
  - marker: a
    text: Or, 'he has risen.' The Greek verb is passive ('has been raised' / 'was raised'), but English translations often render it intransitively to express the resurrection event.
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 여기에 계시지 않습니다. 그러나 살아나셨습니다. 여러분은 그분이 갈릴리에 계셨을 때 여러분에게 말씀하신 일을 기억하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살아나셨습니다’는 원문의 수동형 ἠγέρθη를 한국어로 자연스럽게 옮긴 표현입니다. 직역하면 ‘일으켜지셨습니다’에 가깝고, 다른 번역들은 종종 ‘살아나셨습니다/부활하셨습니다’로 풀어 씁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  english_pob_choice: He is not here
  chosen_korean: 그분은 여기에 계시지 않습니다
  alternatives_korean:
  - 그분은 여기 없습니다
  - 그분은 이곳에 계시지 않습니다
  lexicon: SBLGNT; BDAG
  rationale: 주어가 생략되어 있으므로 한국어에서는 문맥상 예수를 분명히 드러내기 위해 대명사를 보충했고, ὧδε는 자연스러운 위치 부사로 ‘여기에’로 옮겼습니다.
- source_word: ἠγέρθη
  english_pob_choice: has been raised
  chosen_korean: 살아나셨습니다
  alternatives_korean:
  - 일으켜지셨습니다
  - 부활하셨습니다
  lexicon: SBLGNT; BDAG
  rationale: 원문은 수동형이지만 한국어에서는 ‘살아나셨습니다’가 사건을 자연스럽게 전하면서도 하나님에 의한 일으키심의 뉘앙스를 비교적 잘 보존합니다.
- source_word: μνήσθητε
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 기억하시오
  lexicon: BDAG
  rationale: 부활 선포 뒤의 직접적인 권면이므로 공손한 명령형인 ‘기억하십시오’가 합쇼체 본문에 가장 잘 맞습니다.
- source_word: ἔτι ὢν ἐν τῇ Γαλιλαίᾳ
  english_pob_choice: while he was still in Galilee
  chosen_korean: 갈릴리에 계셨을 때
  alternatives_korean:
  - 갈릴리에 아직 계실 때
  - 갈릴리에 머무르고 계실 때
  lexicon: BDAG
  rationale: ἔτι의 ‘아직/계속’의 의미는 ‘계셨을 때’ 안에 함축되며, ὢν은 예수에 대한 존대 표현 ‘계시다’로 옮겨 자연스러운 한국어 시간을 구성했습니다.
theological_decisions:
- issue: ἠγέρθη의 수동형을 어떻게 반영할지
  chosen_reading: ‘살아나셨습니다’로 옮기되, 주어가 스스로 부활했다는 뜻으로 오해되지 않도록 문맥 전체는 수동적 선포로 유지했습니다.
  alternative_readings:
  - 일으켜지셨습니다
  - 부활하셨습니다
  rationale: 원문의 수동형은 암시된 하나님의 행위를 보존합니다. 한국어 본문에서는 지나치게 기계적인 수동 표현보다, 사건의 실제와 신학적 함의를 함께 전달하는 자연한 표현을 택했습니다.
  doctrine_reference: 부활론; 번역 철학 §1, §3
