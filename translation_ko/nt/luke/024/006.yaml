revisions:
- from: 그분은 여기에 계시지 않습니다. 그러나 살아나셨습니다. 여러분은 그분이 갈릴리에 계셨을 때 여러분에게 말씀하신 일을 기억하십시오.[a]
  to: 그분은 여기에 계시지 않습니다. 그러나 일으키심을 받으셨습니다.[a] 그분께서 아직 갈릴리에 계실 때 여러분에게 어떻게 말씀하셨는지를 기억하십시오.
  rationale: 원문의 수동형 ἠγέρθη와 ἔτι의 ‘아직’이라는 의미를 본문에 반영하고, ὡς ἐλάλησεν의 방식적 표현을 보존했습니다. 각주는 부활 동사에 직접 연결하여 자연한 대안 번역을 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:53Z'
review_pass:
  verdict: revise
  source_fidelity: ‘갈릴리에 계셨을 때’는 ἔτι(‘아직, 여전히’)의 의미를 빠뜨립니다. 또한 ‘살아나셨습니다’는 자연스럽지만 ἠγέρθη의 수동태를 본문에서 보존하지 못합니다. ‘말씀하신 일을 기억하십시오’도 ὡς ἐλάλησεν(‘어떻게 말씀하셨는지’)보다 내용을 ‘일’로 구체화합니다.
  naturalness: 합쇼체와 존대법은 전반적으로 적절합니다. 다만 ‘그분께서 아직 갈릴리에 계실 때 여러분에게 어떻게 말씀하셨는지를 기억하십시오’가 원문의 시간적·방식적 연결을 더 자연스럽고 정확하게 드러냅니다. ‘일으키심을 받으셨습니다’는 다소 격식적이나, 부활 문맥에서 이해 가능하며 수동태 보존을 위해 적절합니다.
  terminology: ‘갈릴리’와 ‘그분’은 일관되고 적절합니다. ἠγέρθη는 수동태이므로 본문에서는 ‘일으키심을 받으셨습니다’로 옮기고, 자연한 능동·자동사적 대안인 ‘부활하셨습니다’를 각주에 제시하는 것이 원문과 영어 POB의 번역 원칙에 더 부합합니다.
  issues:
  - severity: medium
    issue: ἔτι의 의미 누락
    rationale: ‘갈릴리에 계셨을 때’는 단순한 시간 표현이며, ἔτι가 나타내는 ‘아직/여전히’의 의미를 전달하지 않습니다.
  - severity: medium
    issue: ἠγέρθη의 수동태가 본문에서 소실됨
    rationale: ‘살아나셨습니다’는 한국어로 자연스럽지만 자동사 표현이므로, 원문의 수동형과 암시된 행위 주체의 여지를 보존하지 못합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주는 부활 동사의 번역 선택을 설명하므로 해당 표현 바로 뒤에 놓는 편이 앵커 기능에 맞습니다.
  - severity: low
    issue: ὡς의 방식적 의미가 ‘일’로 구체화됨
    rationale: ‘말씀하신 일을’은 발화의 내용을 하나의 ‘일’로 바꿉니다. ‘어떻게 말씀하셨는지’가 원문의 표현을 더 가깝게 보존합니다.
