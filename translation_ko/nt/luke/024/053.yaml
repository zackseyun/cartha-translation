translation:
  language: ko
  text: 그리고 그들은 계속해서 성전에서 하나님을 찬송하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님을 송축하고.” 헬라어 동사는 직역하면 “좋게 말하다”라는 뜻이며, 하나님을 대상으로 할 때 “송축하다” 또는 “찬송하다”를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντός
  english_pob_choice: continually
  chosen_korean: 계속해서
  alternatives_korean:
  - 늘
  - 끊임없이
  - 언제나
  lexicon: BDAG
  rationale: 지속적·반복적 상태를 자연스러운 현대 한국어로 살리기 위해 ‘계속해서’를 택했습니다.
- source_word: ἐν τῷ ἱερῷ
  english_pob_choice: temple
  chosen_korean: 성전에서
  alternatives_korean:
  - 성전 뜰에서
  - 성전 구역에서
  lexicon: BDAG
  rationale: ἱερόν은 내실(성소)보다 성전 परिसर 전체를 가리키므로, 간결하고 표준적인 ‘성전에서’가 적절합니다.
- source_word: εὐλογοῦντες τὸν θεόν
  english_pob_choice: blessing God
  chosen_korean: 하나님을 찬송하고
  alternatives_korean:
  - 하나님을 축복하고
  - 하나님을 송축하고
  - 하나님을 찬양하고
  lexicon: BDAG
  rationale: εὐλογέω는 문자적으로 ‘복을 빌다/찬송하다’의 범위를 가지며, 하나님이 목적어일 때 한국어로는 예배적 표현인 ‘찬송하다’가 가장 자연스럽고 오역을 피합니다.
- source_word: ἦσαν ... εὐλογοῦντες
  english_pob_choice: they were continually ... blessing
  chosen_korean: 계속해서 ... 찬송하고 있었습니다
  alternatives_korean:
  - 늘 ... 찬송했습니다
  - 끊임없이 ... 찬송했습니다
  lexicon: SBLGNT
  rationale: 과거 미완료의 지속성을 한국어 진행형과 ‘계속해서’로 함께 반영했습니다.
theological_decisions:
- issue: εὐλογεῖν τὸν θεόν의 한국어 예배 동사 선택
  chosen_reading: ‘찬송하다’로 옮겨 예배적 의미를 살리되, 직역적 흔적은 문맥상 허용되는 범위 안에서 유지했습니다.
  alternative_readings:
  - ‘축복하다’
  - ‘송축하다’
  rationale: 하나님을 대상으로 한 εὐλογέω는 한국어에서 ‘찬송/송축’이 문맥상 자연스럽습니다. ‘축복하다’는 의미가 한국어에서 보통 타동적·상향적 용법으로 들리기 쉬워 오해를 줄이기 위해 피했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
