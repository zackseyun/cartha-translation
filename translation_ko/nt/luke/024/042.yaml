translation:
  language: ko
  text: 그들은 그분께 구운 물고기 한 조각을 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 후대 사본에는 ‘그리고 벌집 한 조각’이 더 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ
  english_pob_choice: And they
  chosen_korean: 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그런데 그들은
  - 그들도
  lexicon: BDAG
  rationale: οἱ는 앞선 제자들을 가리키는 실질적 주어이고, δέ는 약한 연결이므로 한국어에서는 불필요한 대조를 드러내지 않는 ‘그들은’이 자연스럽습니다.
- source_word: ἐπέδωκαν
  english_pob_choice: gave
  chosen_korean: 드렸습니다
  alternatives_korean:
  - 주었습니다
  - 건넸습니다
  - 바쳤습니다
  lexicon: BDAG
  rationale: 예수께 대상을 건네는 문맥에서 단순한 ‘주었습니다’보다 존대가 반영된 ‘드렸습니다’가 한국어 서술 흐름에 더 잘 맞습니다.
- source_word: ἰχθύος ὀπτοῦ μέρος
  english_pob_choice: a piece of broiled fish
  chosen_korean: 구운 물고기 한 조각
  alternatives_korean:
  - 볶은 물고기 한 조각
  - 익힌 물고기 한 조각
  - 구운 생선 한 조각
  lexicon: BDAG
  rationale: μέρος는 ‘조각/한 부분’이 핵심이므로 ‘한 조각’으로 옮기고, ὀπτοῦ는 조리된 상태를 가리키는 ‘구운’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 예수께 드리는 행위의 높임 표현
  chosen_reading: 예수님을 가리키는 목적어는 한국어 서술에서 자연스러운 존대인 ‘그분께’와 ‘드렸습니다’로 처리했습니다.
  alternative_readings:
  - 그에게 주었습니다
  - 그분에게 주었습니다
  rationale: 본문은 단순 사실 진술이지만, 한국어에서는 예수께 대한 행위 표시에 존대가 의미를 훼손하지 않으면서 자연스럽게 전달됩니다.
  doctrine_reference: 한국어 공경 표현의 문체 선택
