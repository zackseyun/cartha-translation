  source_fidelity: SBLGNT의 οἱ δὲ ἐπέδωκαν αὐτῷ ἰχθύος ὀπτοῦ μέρος를 빠짐없이 충실하게 옮겼습니다. ‘그들은’은 δέ의 약한 연결을 과도하게 대조시키지 않으며, ‘구운 물고기 한 조각’은 ἰχθύος ὀπτοῦ μέρος의 의미를 자연스럽고 정확하게 반영합니다.
  naturalness: 표준어 현대 합쇼체로 자연스럽습니다. ‘그분께 … 드렸습니다’는 예수를 가리키는 한국어 성경 문체의 공경 표현으로 문맥상 매끄럽고, 본문의 사실 진술을 변경하지 않습니다.
  terminology: ‘구운’은 ὀπτός의 로스팅/브로일링 조리 의미를 적절히 전달합니다. 본문에는 SBLGNT에 없는 벌집 관련 구절을 넣지 않았고, 후대 사본의 긴 읽기는 각주로 적절히 처리했습니다.
