  source_fidelity: 초안은 γυναῖκες를 받는 대명사를 '그들'로 자연스럽게 처리하고, ἀπορεῖσθαι의 곤혹스러움을 '어쩔 줄 몰라'로 잘 드러냅니다. 그러나 ἐπέστησαν은 이 장면에서 두 사람이 갑자기 가까이 와서 선 완료 사건을 나타내므로, 지속 상태처럼 들릴 수 있는 '서 있었습니다'보다 '섰습니다'가 더 충실합니다. '그런데'를 보완하여 καὶ ἐγένετο의 서술 전환도 자연스럽게 반영했습니다.
  naturalness: '''보십시오''는 합쇼체의 주의 환기 표현으로 가능하며, 쉼표 뒤에 두어 ἰδού의 돌발성과 강조를 살립니다. ''눈부시게 빛나는 옷을 입고''는 현대 표준어에서 자연스럽고 원문의 밝게 번쩍이는 성격을 유지합니다.'
  terminology: '''두 사람''은 ἄνδρες δύο의 본문상 제시를 보존하며 천사라는 해석을 앞당기지 않습니다. 각주에는 ἀστραπτούσῃ의 번개 이미지가 명확히 남아 있습니다.'
  issues:
