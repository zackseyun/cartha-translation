source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
  footnotes:
  - marker: a
    text: Or, more literally, 'in clothing flashing like lightning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이 일에 대해 어쩔 줄 몰라 할 때에, 보십시오, 두 사람이 눈부신 옷을 입고 그들 곁에 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '번개처럼 번쩍이는 옷을 입고'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  english_pob_choice: it happened
  chosen_korean: ~할 때에
  alternatives_korean:
  - 이 일이 일어났습니다
  - 그 일이 있었습니다
  lexicon: BDAG
  rationale: 루가의 서술 전환 공식을 한국어에서 자연스럽게 살리기 위해 사건 도입을 풀어 옮겼습니다.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς περὶ τούτου
  english_pob_choice: while they were perplexed about this
  chosen_korean: 이 일에 대해 어쩔 줄 몰라 할 때에
  alternatives_korean:
  - 이 일에 대해 당황하고 있을 때에
  - 이 일 때문에 난처해할 때에
  lexicon: BDAG
  rationale: ἀπορέω는 단순한 궁금함이 아니라 막막함·난감함을 뜻하므로, 현대 한국어에서 그 강도를 드러내는 표현을 택했습니다.
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: BDAG
  rationale: 서술 중 돌발 장면을 강조하는 표지로서, 합쇼체 서술에 맞게 주의를 환기하는 표현으로 옮겼습니다.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  english_pob_choice: in dazzling clothing
  chosen_korean: 눈부신 옷을 입고
  alternatives_korean:
  - 번개처럼 번쩍이는 옷을 입고
  - 빛나는 옷을 입고
  lexicon: BDAG
  rationale: ἐσθῆτι는 옷/의복이고 ἀστραπτούσῃ는 번개처럼 번쩍이는 빛남을 가리키므로, 본문 의미를 살리되 한국어 문장으로는 자연스럽게 정리했습니다.
theological_decisions:
- issue: 두 인물의 정체
  chosen_reading: 본문 자체의 표면 표현을 따라 '두 사람'으로 두고, 천상 존재라는 해석은 이 절 안에 주입하지 않았습니다.
  alternative_readings:
  - 두 천사
  - 두 천상의 사자
  rationale: 직전 문맥에서 그들이 천사로 밝혀지더라도, 이 절은 먼저 '두 사람'이라고 제시하므로 서술의 즉시성을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: translation philosophy §1, §3
