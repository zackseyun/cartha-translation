    issue: '''그들 곁에 서 있었습니다'''
    rationale: ἐπέστησαν은 부정과거로, 여기서는 두 사람이 그들 곁에 이르러 선 사건을 가리킵니다. '서 있었습니다'는 이미 서 있던 지속 상태로 읽힐 수 있어 '그들 곁에 섰습니다'로 고치는 것이 적절합니다.
