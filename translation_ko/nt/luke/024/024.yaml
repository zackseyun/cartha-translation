id: LUK.24.24
reference: Luke 24:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: ko
  text: 그리고 우리와 함께 있던 사람들 가운데 몇몇이 무덤으로 가서 여자들이 말한 그대로였음을 확인했지만, 그분을 보지는 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 떠나갔습니다
  lexicon: BDAG
  rationale: 무덤을 향한 이동을 자연스럽게 살리기 위해 간단히 ‘가서’로 옮겼습니다. ‘떠나갔습니다’는 출발 뉘앙스를 과하게 드러냅니다.
- source_word: τινες τῶν σὺν ἡμῖν
  english_pob_choice: some of those with us
  chosen_korean: 우리와 함께 있던 몇몇
  alternatives_korean:
  - 우리와 함께한 몇몇
  - 우리 동행자들 중 몇몇
  lexicon: BDAG
  rationale: 그룹의 일부를 가리키는 구조를 한국어에서도 그대로 살려, 소속 관계를 드러내는 ‘우리와 함께 있던 몇몇’으로 옮겼습니다.
- source_word: ἐπὶ τὸ μνημεῖον
  english_pob_choice: to the tomb
  chosen_korean: 무덤으로
  alternatives_korean:
  - 무덤에
  - 묘로
  lexicon: BDAG
  rationale: 부활 서사 맥락에서 μνημεῖον은 예수의 매장 장소이므로 ‘무덤’이 가장 정확합니다.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  english_pob_choice: just as the women had said
  chosen_korean: 여자들이 말한 그대로임을
  alternatives_korean:
  - 여자들이 말한 것과 같음을
  - 여자들이 말한 그대로
  lexicon: BDAG
  rationale: 상응 관계를 자연스럽게 드러내기 위해 ‘그대로임을’로 처리했습니다. ‘또한’은 가능하지만 여기서는 일치 자체가 이미 충분히 강조됩니다.
- source_word: αὐτὸν δὲ οὐκ εἶδον
  english_pob_choice: but they did not see him
  chosen_korean: 그는 보지 못했습니다
  alternatives_korean:
  - 그를 보지 못했습니다
  - 그분은 보지 못했습니다
  lexicon: BDAG
  rationale: 지시 대상이 예수임을 유지하되, 한국어에서는 목적어를 생략한 자연스러운 표현보다 ‘그를 보지 못했습니다’가 더 직접적입니다. 최종 문장에서는 담화를 매끄럽게 하기 위해 주어를 앞세운 표현을 택했습니다.
theological_decisions:
- issue: 부활 기사에서의 사실 확인과 시각 부재
  chosen_reading: 무덤은 여자들의 말대로였지만, 예수 자신은 보지 못했다는 대조를 그대로 보존했습니다.
  alternative_readings:
  - 무덤만 보고 예수는 못 만났다는 식으로 완화하는 번역
  - 빈 무덤 확인을 강조하며 예수 부재를 약화하는 번역
  rationale: 본문은 무덤 상태의 확인과 예수 미시현을 분리해 말하므로, 이를 합치거나 해소하지 않고 그대로 드러내는 것이 source-faithful 합니다.
  doctrine_reference: 부활 서사의 긴장을 보존
