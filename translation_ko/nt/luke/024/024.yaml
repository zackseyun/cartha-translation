revisions:
- from: 그리고 우리와 함께 있던 몇몇이 무덤으로 가서, 여자들이 말한 그대로임을 확인했지만, 그는 보지 못했습니다.
  to: 그리고 우리와 함께 있던 사람들 가운데 몇몇이 무덤으로 가서 여자들이 말한 그대로였음을 확인했지만, 그분을 보지는 못했습니다.
  rationale: 목적어 αὐτόν을 ‘그분을’로 바로잡아 원문의 주체와 의미를 회복했습니다. 또한 ‘사람들 가운데 몇몇’으로 원문의 부분적 집단 지시를 분명히 했습니다. ‘확인했지만’은 무덤에서 여자들의 보고와 일치하는 상태를 발견한 것과 예수를 보지 못한 것 사이의 δέ의 대조를 자연스럽게 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:46Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 서술 구조는 대체로 충실합니다. 그러나 마지막 절의 αὐτόν은 동사 εἶδον의 목적어(‘그를’)인데, 초안의 ‘그는 보지 못했습니다’는 예수를 주어로 바꾸어 ‘그가 보지 못했다’는 뜻이 됩니다. 이는 원문의 의미를 반대로 바꾸는 중대한 문법 오류입니다.
  naturalness: ‘우리와 함께 있던 몇몇’도 이해되지만, 사람을 명시한 ‘우리와 함께 있던 사람들 가운데 몇몇’이 현대 표준 한국어 문장으로 더 자연스럽고 분명합니다. ‘여자들이 말한 그대로였음을 확인했습니다’는 원문의 상응 관계를 자연스럽게 전달합니다.
  terminology: ‘무덤’은 μνημεῖον에 적절합니다. ‘여자들’은 원문의 αἱ γυναῖκες를 무리 없이 반영합니다. αὐτόν은 앞선 예수를 가리키는 목적어이므로 ‘그분을’으로 옮겨 존대 서술체와 지시 관계를 모두 분명히 했습니다.
  issues:
  - severity: high
    issue: ‘그는 보지 못했습니다’의 격과 주어 해석 오류
    rationale: 원문 αὐτὸν δὲ οὐκ εἶδον은 ‘그러나 그를 보지 못했습니다’입니다. 초안은 목적격 αὐτόν을 주격 ‘그는’으로 바꾸어, 방문자들이 예수를 보지 못했다는 뜻을 예수가 무언가를 보지 못했다는 뜻으로 전도합니다.
  - severity: low
    issue: ‘우리와 함께 있던 몇몇’의 지시 대상이 다소 생략됨
    rationale: 문맥상 사람들을 뜻하지만, ‘사람들 가운데 몇몇’으로 보완하면 τινες τῶν σὺν ἡμῖν의 부분 관계가 더 명확하고 자연스럽습니다.
  revised_text: 그리고 우리와 함께 있던 사람들 가운데 몇몇이 무덤으로 가서 여자들이 말한 그대로였음을 확인했지만, 그분을 보지는 못했습니다.
