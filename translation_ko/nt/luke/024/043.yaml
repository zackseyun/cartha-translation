    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 그리고 나서
  - 또
  lexicon: BDAG
  rationale: 앞절과의 단순 연결을 나타내는 접속사이므로, 시간적 강세를 더하지 않는 자연스러운 ‘그리고’가 적절합니다.
- source_word: λαβὼν
  english_pob_choice: taking it
  chosen_korean: 그것을 받아
  alternatives_korean:
  - 받아서
  - 잡아
  lexicon: BDAG
  rationale: 분사 λαβών은 앞선 동작을 배경으로 하는 ‘받다/집다’의 의미이므로, 문맥상 생략된 목적어를 살려 ‘그것을 받아’로 옮겼습니다.
- source_word: ἐνώπιον αὐτῶν
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 눈앞에서
  - 그들 앞에
  lexicon: BDAG
  rationale: ‘그들의 시야/존재 앞에서’라는 공개성을 담아, 한국어로는 간결한 ‘그들 앞에서’가 가장 자연스럽습니다.
- source_word: ἔφαγεν
  english_pob_choice: he ate it
  chosen_korean: 잡수셨습니다
  alternatives_korean:
  - 드셨습니다
  - 먹었습니다
  lexicon: BDAG
  rationale: 본문의 동사는 단순히 ‘먹다’이지만, 예수를 주어로 한 서술에서 자연스럽고 공손한 표현으로 ‘잡수셨습니다’를 택했습니다. 문맥상 목적어는 앞절의 생선 조각이므로 한국어에서는 반복하지 않아도 됩니다.
theological_decisions:
- issue: 부활하신 예수의 실제적 식사 행위 표현
  chosen_reading: 동작의 사실성을 분명히 드러내되 과장 없이 간결하게 옮겼습니다.
  alternative_readings:
  - 그들 앞에서 드셨습니다.
