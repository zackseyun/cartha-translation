  rationale: 이 절은 부활하신 예수의 육체적 실재성을 보여 주는 서술이므로, 본문의 평서적 사실성을 유지하는 번역이 적절합니다.
  doctrine_reference: 부활의 육체성에 대한 복음서 서술; Chalcedonian orthodoxy
