id: LUK.24.18
reference: Luke 24:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
  footnotes:
  - marker: a
    text: Or “the only one staying in Jerusalem as a stranger.” The Greek verb carries the sense of residing as an outsider or temporary resident.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들 중 한 사람인 글로바가 그에게 대답했습니다. “당신은 예루살렘에 나그네로 머물면서[a] 요즈음 그곳에서 일어난 일을 알지 못하는 유일한 분입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘에 낯선 사람으로 머물면서.” 그리스어 동사는 외부인 또는 임시 거주자로 머무는 뉘앙스를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  english_pob_choice: Then ... answered
  chosen_korean: 그러자 ... 대답했습니다
  alternatives_korean:
  - 그리고 ... 대답했습니다
  - 그런데 ... 대답했습니다
  lexicon: SBLGNT/BDAG
  rationale: 앞뒤의 진행을 부드럽게 잇는 δέ의 흐름을 살려 ‘그러자’로 옮기고, ἀποκριθείς는 한국어 관용에 맞게 ‘대답했습니다’로 자연스럽게 처리했습니다.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  english_pob_choice: one of them, named Cleopas
  chosen_korean: 그들 중 한 사람, 이름이 글로바인 사람이
  alternatives_korean:
  - 그들 중 한 사람, 글로바라는 이름의 사람이
  - 그들 중 한 사람, 글로바인 사람이
  lexicon: SBLGNT/BDAG
  rationale: ὀνόματι는 ‘이름이/…라는 이름의’라는 뜻이므로 이를 분명히 반영했습니다. 한국어에서 널리 알려진 인명형을 고려해 ‘글로바’로 옮겼습니다.
- source_word: παροικεῖς
  english_pob_choice: visitor to
  chosen_korean: 머물러 있는 나그네이시며
  alternatives_korean:
  - 방문객이시며
  - 낯선 이로 머무르고 계시며
  - 이방인으로 사시는
  lexicon: BDAG
  rationale: παροικέω의 핵심인 ‘낯선 사람/임시 거주자’ 뉘앙스를 살리기 위해 단순한 ‘방문객’보다 ‘나그네’가 더 적절합니다. 질문의 문맥상 현재 상태를 묻는 말이라 ‘머물러 있는’으로 풀었습니다.
- source_word: οὐκ ἔγνως τὰ γενόμενα
  english_pob_choice: does not know the things that have happened
  chosen_korean: 일어난 일들을 알지 못하십니까
  alternatives_korean:
  - 일어난 일들을 모르십니까
  - 무슨 일이 있었는지 알지 못하십니까
  lexicon: SBLGNT/BDAG
  rationale: aorist형 ἔγνως는 여기서 현재적 무지의 질문으로 기능하므로 한국어도 현재형 질문으로 자연스럽게 옮겼습니다. τὰ γενόμενα는 최근에 실제로 벌어진 사건들을 가리켜 ‘일어난 일들’로 번역했습니다.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  english_pob_choice: in these days
  chosen_korean: 이 여러 날 동안
  alternatives_korean:
  - 이날들에
  - 이런 날들에
  lexicon: BDAG
  rationale: 직역의 ‘이 날들에’보다 한국어에서 시간의 누적을 더 자연스럽게 드러내는 ‘이 여러 날 동안’을 택했습니다.
theological_decisions:
- issue: 예루살렘에서의 체류를 가리키는 παροικεῖς의 뉘앙스
  chosen_reading: 예수님을 단순한 방문객으로만 묻지 않고, 예루살렘에 임시로 머무는 나그네로 이해하는 질문으로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘예루살렘을 방문하신 분’으로 완화하는 번역
  - ‘외국인/이방인’처럼 민족적 의미를 덧씌우는 번역
  rationale: 문맥은 지리적·사회적 소속감의 결여를 묻는 것이지 민족 구분을 묻는 것이 아닙니다. 그래서 ‘나그네’로 옮겨 outsider 뉘앙스를 보존했습니다.
  doctrine_reference: 성서 번역의 문맥상 의미 보존 원칙
