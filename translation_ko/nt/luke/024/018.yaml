revisions:
- from: 그러자 그들 중 한 사람, 이름이 글로바인 사람이 그에게 대답했습니다. “당신만 예루살렘에 머물러 있는 나그네이시며, 이 여러 날 동안 그곳에서 일어난 일들을 알지 못하십니까?”[a]
  to: 그러자 그들 중 한 사람인 글로바가 그에게 대답했습니다. “당신은 예루살렘에 나그네로 머물면서[a] 요즈음 그곳에서 일어난 일을 알지 못하는 유일한 분입니까?”
  rationale: 그리스어의 εἷς ὀνόματι Κλεοπᾶς를 자연스러운 한국어 인물 소개로 다듬고, μόνος가 포함된 수사 의문문의 초점을 ‘최근 사건을 알지 못하는 유일한 사람’에 두었습니다. παροικεῖς의 나그네·임시 체류자 뉘앙스는 본문과 해당 어휘에 연결된 각주로 보존했습니다. 의미를 추가하거나 교리적으로 해석하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:50Z'
