  source_fidelity: 핵심 의미는 대체로 반영했으나, ‘당신만 예루살렘에 머물러 있는 나그네이시며’는 μόνος가 ‘알지 못하는 사람은 당신뿐’이라는 질문 전체를 수식하는 관계를 한국어에서 부자연스럽고 다소 모호하게 만듭니다. 또한 ‘이 여러 날 동안’은 ἐν ταῖς ἡμέραις ταύταις의 최근성을 충분히 자연스럽게 드러내지 못합니다.
  naturalness: ‘이름이 글로바인 사람이’는 문법적으로 가능하지만 ‘그들 중 한 사람인 글로바가’가 현대 표준 한국어 내러티브에서 더 간결하고 자연스럽습니다. 질문은 ‘…유일한 분입니까?’로 구성하면 존대 합쇼체와 배타적 강조가 모두 자연스럽게 살아납니다.
  terminology: ‘글로바’는 통용되는 한국어 성경 인명 표기이며 유지할 수 있습니다. παροικεῖς의 외부인·임시 체류자 뉘앙스는 ‘나그네로 머물다’와 각주로 적절히 보존됩니다. ‘요즈음’은 이 문맥의 ‘이 날들에/최근 여러 날 동안’에 자연스럽게 대응합니다.
