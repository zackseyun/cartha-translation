id: LUK.24.11
reference: Luke 24:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
  footnotes:
  - marker: a
    text: Or 'like an idle tale' or 'like delirious talk.' The Greek λῆρος refers to speech regarded as senseless or absurd.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 말씀들은 그들에게 마치 헛소리처럼 여겨졌고, 그들은 그 여자들을 믿지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “헛된 이야기처럼”, “망상처럼”으로 옮길 수 있습니다. λῆρος는 무의미하거나 비합리적인 말을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν ἐνώπιον αὐτῶν
  english_pob_choice: seemed to them
  chosen_korean: 그들에게 ...처럼 여겨졌고
  alternatives_korean:
  - 그들에게 ...처럼 보였고
  - 그들 앞에서 ...처럼 나타났고
  lexicon: BDAG
  rationale: 이 구문은 단순한 시각적 '나타남'보다 판단·평가의 의미가 강하므로, 한국어에서는 '여겨지다'로 처리해 평가적 뉘앙스를 살렸습니다.
- source_word: ὡσεὶ λῆρος
  english_pob_choice: like nonsense
  chosen_korean: 마치 헛소리처럼
  alternatives_korean:
  - 마치 쓸데없는 말처럼
  - 마치 터무니없는 말처럼
  - 마치 헛된 이야기처럼
  lexicon: BDAG
  rationale: λῆρος는 의미 없는, 어리석은, 헛된 말을 가리키므로 현대 한국어에서 즉시 이해되는 '헛소리'가 POB의 'nonsense'와 가장 가깝습니다.
- source_word: τὰ ῥήματα ταῦτα
  english_pob_choice: these words
  chosen_korean: 그 말씀들
  alternatives_korean:
  - 이 말들
  - 이 말씀들
  - 그 말들
  lexicon: BDAG
  rationale: 지시 대명사와 명사를 자연스럽게 살리면서, 복음서 서술에서 보고·증언의 내용을 가리키는 표현으로 '말씀들'을 선택했습니다.
- source_word: αὐταῖς
  english_pob_choice: them
  chosen_korean: 그 여자들을
  alternatives_korean:
  - 그들을
  - 그 여자들에게
  - 그 여성들을
  lexicon: BDAG
  rationale: 대명사는 여성 복수를 가리키며, 바로 앞 문맥의 여인들을 뜻하므로 한국어에서는 의미를 분명히 드러내어 '그 여자들'로 옮겼습니다.
theological_decisions:
- issue: 부활 증언에 대한 제자들의 반응
  chosen_reading: 본문은 여인들의 증언을 제자들이 신뢰하지 않았다는 역사적 반응을 सीधे 서술합니다.
  alternative_readings:
  - 단순한 오해로 약화된 표현
  - 의심이 아니라 일시적 당혹감으로 완화한 표현
  rationale: 헬라어 ἠπίστουν은 실제 불신을 뜻하므로, 이를 약화하지 않고 그대로 드러내는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: 복음서의 부활 증언과 제자들의 불신 서술
