id: LUK.24.38
reference: Luke 24:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
  footnotes:
  - marker: a
    text: Or “thoughts” or “reasonings” for “doubts.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말씀하셨습니다. "어찌하여 너희가 당황하고 있으며, 어찌하여 너희 마음에 의심이 일어납니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의심’은 문맥상 ‘생각들’ 또는 ‘이성적 추론’의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: BDAG
  rationale: 문장 전체가 원인을 묻는 용법이므로 한국어에서는 이유를 묻는 ‘어찌하여’가 가장 자연스럽고, 예수의 물음의 힘도 살립니다.
- source_word: τεταραγμένοι
  english_pob_choice: troubled
  chosen_korean: 당황하고 있으며
  alternatives_korean:
  - 동요하고 있으며
  - 불안해하고 있으며
  lexicon: BDAG
  rationale: 제자들의 내적 혼란과 동요를 가리키며, 단순한 감정 상태보다 상황 앞에서의 당혹과 흔들림을 함께 드러내는 표현으로 옮겼습니다.
- source_word: διαλογισμοὶ ἀναβαίνουσιν
  english_pob_choice: doubts arise
  chosen_korean: 의심이 일어납니까
  alternatives_korean:
  - 생각이 떠오릅니까
  - 이성적 추론이 올라옵니까
  - 문젯거리 생각이 솟아납니까
  lexicon: BDAG
  rationale: διαλογισμοί는 문맥상 단순한 ‘생각’보다 흔들리는 ‘의심’의 뜻이 적절하며, ἀναβαίνουσιν은 내면에서 ‘일어나다’는 한국어 표현이 자연스럽습니다.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  english_pob_choice: in your hearts
  chosen_korean: 너희 마음에
  alternatives_korean:
  - 너희 হৃদ에
  - 너희 심장에
  - 너희 속에
  lexicon: BDAG
  rationale: καρδία는 성경적 인간 이해에서 생각과 의지를 포함하는 내면을 가리키므로, ‘마음’이 가장 적절합니다. 한국어에서는 복수 소유를 자연스럽게 반영하기 위해 ‘너희 마음에’로 옮겼습니다.
theological_decisions:
- issue: καρδία의 인류학적 범위
  chosen_reading: ‘마음’은 감정만이 아니라 생각과 의지를 포함하는 내면 전체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘생각’
  - ‘속마음’
  - ‘내면’
  rationale: 본문은 의심이 외적 행동이 아니라 내적 중심에서 일어남을 말하므로, 성경적 인류학을 보존하는 ‘마음’이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
