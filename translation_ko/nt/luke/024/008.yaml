lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그때
  alternatives_korean:
  - 그리고
  - 또
  lexicon: BDAG
  rationale: 서사 연결을 단순히 유지하면서 문맥상 직전 사건 이후의 반응을 자연스럽게 드러내기 위해 ‘그때’를 택했습니다.
- source_word: ἐμνήσθησαν
  english_pob_choice: remembered
  chosen_korean: 기억했습니다
  alternatives_korean:
  - 생각해 냈습니다
  - 떠올렸습니다
  lexicon: BDAG
  rationale: aorist deponent의 단순한 회상 의미를 현대 한국어에서 자연스럽게 옮기기 위해 ‘기억했습니다’를 사용했습니다.
- source_word: τῶν ῥημάτων
  english_pob_choice: words
  chosen_korean: 그분의 말씀들
  alternatives_korean:
  - 그분의 말들
  - 그분이 하신 말씀
  lexicon: BDAG
  rationale: ῥήματα는 단순한 ‘단어’보다 말해진 내용 전체를 가리키므로, 예수의 발언을 가리키는 문맥을 반영해 ‘말씀들’로 옮겼습니다.
- source_word: αὐτοῦ
  english_pob_choice: his
  chosen_korean: 그분의
  alternatives_korean:
  - 그의
  - 자신의
  lexicon: BDAG
  rationale: 문맥상 예수를 가리키며, 한국어에서는 인물 지시를 분명히 하기 위해 ‘그분의’가 가장 자연스럽습니다.
