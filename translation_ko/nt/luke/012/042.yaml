  source_fidelity: 초안은 πιστός, φρόνιμος, οἰκονόμος의 기본 의미를 대체로 반영합니다. 그러나 관계절의 미래형 καταστήσει를 과거/단정적 표현인 ‘세워 … 주게 한 자이다’로 옮겨, 예수님의 수사 의문문 구조와 미래의 임명 의미를 바꾸었습니다. θεραπεία는 관리 아래 있는 집단의 종들을 가리키며, σιτομέτριον은 정해진 분량의 양식입니다.
  naturalness: ‘주께서 말씀하셨습니다’와 ‘누구겠습니까?’는 현대 표준어 합쇼체 서술 및 직접화법에 자연스럽습니다. ‘집안의 종들’은 역사적 가정의 종/하인 집단이라는 뜻을 명확히 하면서도 문맥상 자연스럽습니다.
  terminology: ‘주’는 화자이신 예수님에 대한 κύριος에 적절하며, 비유 안의 δεύτερος κύριος는 ‘주인’으로 구별했습니다. οἰκονόμος는 ‘청지기’, πιστός는 ‘신실한’, φρόνιμος는 ‘슬기로운’으로 옮겼습니다. σιτομέτριον의 측량된 배급 몫이라는 뉘앙스는 본문과 주석으로 보존했습니다.
  issues:
  - severity: high
    issue: 미래 관계절과 수사 의문문의 의미가 바뀜
    rationale: ὃν καταστήσει ὁ κύριος는 ‘주인이 세울/임명할’이라는 미래 관계절인데, 초안의 ‘세워 … 주게 한 자이다’는 과거 완료된 사실을 진술하고 ‘누가 … 이겠느냐?’에 대한 부자연스러운 답변 형태가 됩니다.
  - severity: medium
    issue: θεραπεία의 관리 대상 집단이 다소 불명확함
    rationale: ‘자기 집안 사람들’은 가족 구성원으로 이해될 수 있습니다. 여기서는 주인이 청지기에게 맡기는 집안의 종들/하인들의 집단을 가리킵니다.
  - severity: low
    issue: σιτομέτριον의 정해진 분량 의미를 명시할 필요
    rationale: 단순한 ‘양식’보다 각 사람에게 배분하는 측량된 양식 몫이라는 뜻이 문맥과 어휘에 더 충실합니다.
  revised_text: 주께서 말씀하셨습니다. “주인이 자기 집안의 종들을 맡겨, 그들에게 제때에 정해진 양식 몫을 나누어 주게 할 신실하고 슬기로운 청지기가 누구겠습니까?”
  revised_footnotes:
  - marker: '1'
    text: ‘정해진 양식 몫’은 직역하면 ‘곡식의 정량 배급’이며, 각 종에게 나누어 주는 측량된 음식 분량을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 미래형 καταστήσει와 수사 의문문의 문장 구조를 보존하도록 관계절을 ‘…하게 할’로 고쳤습니다. θεραπεία를 ‘집안의 종들’로 명확히 하고, σιτομέτριον의 배급량 의미를 ‘정해진 양식 몫’ 및 주석으로 반영했습니다.
