  source_fidelity: 초안은 화자를 ‘주’로, οἰκονόμος를 ‘청지기’로 옮긴 점은 적절합니다. 그러나 관계절의 미래형 καταστήσει와 목적 부정사 τοῦ διδόναι가 ‘세워 … 주게 한 자이다’라는 과거·서술 구조로 바뀌어, 원문의 ‘세울 … 청지기가 누구냐’라는 질문 구조를 보존하지 못합니다. 또한 θεραπεία는 여기서 가족 일반보다 청지기의 감독 아래 있는 집안의 하인들/수행원 집단을 가리킵니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 서술 도입과 자연스러운 직접화법을 사용하며, 수사 의문문의 구조를 한국어답게 유지합니다.
  terminology: ‘신실한’, ‘슬기로운’, ‘청지기’, ‘주인’은 각각 πιστός, φρόνιμος, οἰκονόμος 및 비유 내부의 κύριος에 알맞습니다. ‘집안 하인들’은 θεραπεία의 집단적·역사적 가리킴을, ‘정해진 양식’은 σιτομέτριον의 배정된 몫이라는 뜻을 반영합니다.
  issues:
  - severity: high
    issue: 관계절과 시제가 질문 뒤의 과거 서술로 재구성됨
    rationale: ‘주인이 그를 … 세워 … 주게 한 자이다’는 원문의 미래형 ‘주인이 … 세울’ 및 ‘주도록’ 목적을 충실히 반영하지 못하며, ‘누가 …이겠느냐?’와도 문법적으로 어색하게 연결됩니다.
  - severity: medium
    issue: ‘집안 사람들’이 θεραπεία의 지시 대상을 넓게 만듦
    rationale: θεραπεία는 이 문맥에서 집안의 가족 일반이라기보다 급식·관리의 대상인 하인/수행원들의 집단입니다.
  revised_text: 주께서 말씀하셨습니다. “그러면 주인이 자기 집안 하인들을 맡겨 제때에 정해진 양식을 나누어 주도록 세울 신실하고 슬기로운 청지기가 누구겠느냐?”
  revised_footnotes:
  - marker: a
    text: ‘정해진 양식’은 직역하면 ‘곡식의 정량’이며, 각 사람에게 배정하여 주는 음식 몫을 가리킵니다.
    reason: lexical_alternative
