  source_fidelity: 「또 어찌하여」는 Τί δὲ καὶ의 앞선 말씀을 잇고 재차 묻는 수사적 힘을 자연스럽게 살립니다. 「너희 스스로」는 ἀφ’ ἑαυτῶν의 자발적·독자적 판단의 뜻을, 「판단하지 아니하느냐」는 οὐ κρίνετε의 판단·분별 의미를 충실히 반영합니다. 「옳은 것」은 τὸ δίκαιον의 넓은 윤리적·평가적 의미를 보존합니다.
  naturalness: 문어적 성경 문맥에 적합하며, 현대 표준 한국어에서 자연스럽게 이해됩니다. 「아니하느냐」는 예수님의 수사적 질문에 어울리는 격식 있는 표현입니다.
  terminology: 「옳은 것」은 ‘의로운 것’처럼 신학적으로 좁히지 않고, ‘정의로운 것’으로 법적 의미에 한정하지도 않아 적절합니다. 별도의 전문 용어 문제는 없습니다.
