  to: 그러나 하나님께서 그에게 말씀하셨습니다. “어리석은 사람아! 바로 오늘 밤에 네 목숨[a]을 너에게서 도로 요구할 것입니다. 그러면 네가 마련한 것들은 누구의 것이 되겠습니까?”
