  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
  footnotes:
  - marker: a
    text: Literally, 'to be dug through,' reflecting the practice of breaking through the wall of a house.
    reason: cultural_note
translation:
  language: ko
  text: 「너희는 이것을 알아두십시오. 만일 집주인이 도둑이 어느 시각에 올 줄 알았더라면, 자기 집을 뚫고 들어오도록[a] 두지 않았을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘뚫리도록’ 또는 ‘파헤쳐지도록’입니다. 당시 집의 벽을 뚫고 침입하는 일을 가리킵니다.
    reason: διορυχθῆναι의 문자적 ‘뚫다/파고들다’ 이미지를 보존하면서, 본문에서는 침입을 뜻한다는 문화적 배경을 밝혀 줍니다.
