  source_fidelity: 초안은 μακάριος, δοῦλος, κύριος, οὕτως의 기본 의미를 대체로 전달합니다. 그러나 미래형 εὑρήσει와 ἐλθών의 시간 관계가 ‘와서 … 보게 되는’에서는 다소 흐려지고, 관계절 안에서 ‘보게 되는’의 주체도 불명확합니다.
  naturalness: ‘그 주인이 와서 그렇게 행하는 것을 보게 되는 종’은 누가 보는지 문법적으로 잠시 모호하며, ‘행하는 것’도 현대 한국어에서는 다소 경직됩니다. ‘주인이 와서 그가 그렇게 하고 있는 것을 발견할 그 종’은 원문의 주어 관계와 진행 중인 행위를 더 자연스럽게 드러냅니다.
