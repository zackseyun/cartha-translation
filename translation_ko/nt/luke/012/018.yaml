  source_fidelity: 수정안은 καθελῶ, μείζονας, οἰκοδομήσω, συνάξω, ἐκεῖ를 각각 ‘헐다’, ‘더 큰 곳간들’, ‘짓다’, ‘모아 두다’, ‘거기에’로 자연스럽게 반영합니다. σῖτος에는 원문에 명시된 소유격이 없으므로 ‘내 모든 곡식’ 대신 ‘모든 곡식’으로 옮겨 불필요한 소유 표시를 피했습니다. τὰ ἀγαθά μου는 문맥상 물질적 소유를 가리키므로 ‘내 재물’로 옮겼습니다.
  naturalness: 초안의 겹친 인용부호는 한국어 문장부호 관습에 맞지 않습니다. 또한 ‘더 큰 것을’은 선행 명사인 곳간을 가리키지만, ‘더 큰 곳간들을’로 밝혀 주면 현대 한국어에서 더 분명하고 자연스럽습니다. 합쇼체에 맞추어 서술과 직접화법을 ‘말했습니다/하겠습니다’로 통일했습니다.
  terminology: ‘곳간’은 농경 맥락의 ἀποθήκας에 적절합니다. ‘재물’은 τὰ ἀγαθά μου의 폭넓은 물질적 소유라는 뜻을 보존하며, 단순한 개별 물건이라는 인상을 줄 수 있는 ‘물건들’보다 문맥에 잘 맞습니다.
