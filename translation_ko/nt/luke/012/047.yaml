review_pass:
  verdict: revise
  source_fidelity: 초안은 주인의 뜻을 아는 종과 그 결과로 많은 매를 맞는다는 핵심 의미를 잘 옮겼습니다. 다만 원문의 μὴ ἑτοιμάσας ἢ ποιήσας는 ‘준비하지 않거나 … 행하지 않은’이라는 선택 접속을 포함하므로, ‘준비하지 아니하고 … 행하지 아니한’보다 이를 드러내는 편이 더 충실합니다. δαρήσεται πολλάς에서 생략된 타격의 명사는 한국어에서 ‘매’로 보충하되 각주로 밝혔습니다.
  naturalness: ‘알면서도’, ‘준비하지 않거나’, ‘많은 매를 맞을 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 비유 속 주종 관계와 경고의 어조를 유지합니다.
  terminology: δοῦλος는 비유의 가정 내 신분 관계를 고려하여 ‘종’, κύριος는 ‘주인’, θέλημα는 ‘뜻’으로 옮겼습니다. δαρήσεται는 원문의 물리적 처벌 표현을 과도하게 완화하거나 구체화하지 않고 ‘매를 맞다’로 번역했습니다.
  issues:
  - severity: medium
    issue: 접속사 ἢ의 의미가 초안에서 ‘-고’로 처리됨
    rationale: 원문은 μὴ 아래에서 ἑτοιμάσας와 ποιήσας를 ἢ(‘또는’)로 연결합니다. ‘준비하지 아니하고 … 행하지 아니한’은 두 행동의 부재를 누적적으로 들리게 할 수 있으므로, ‘준비하지 않거나 … 행하지 않은’이 원문의 연결을 더 직접적으로 보존합니다.
  - severity: low
    issue: 많은 타격을 가리키는 생략 명사에 대한 각주가 없음
    rationale: πολλάς는 여성 복수 형용사가 단독으로 쓰여 타격/매 등의 명사가 함축됩니다. 한국어 번역에서 ‘매’를 보충하는 것은 자연스럽지만, 원문에 명사가 명시되지 않았음을 각주로 남기는 것이 감사 추적을 보존합니다.
