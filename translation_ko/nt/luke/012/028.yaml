id: LUK.12.28
reference: Luke 12:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
  footnotes:
  - marker: a
    text: Or 'vegetation' or 'herbage' for 'grass.'
    reason: lexical_alternative
  - marker: b
    text: The 'oven' refers to a baking oven; dried field grass could be used as fuel.
    reason: cultural_note
translation:
  language: ko
  text: 「그러나 하나님께서 오늘은 들에 있다가 내일은 화덕[a]에 던져지는 들풀도 이렇게 입히신다면, 하물며 너희를 얼마나 더 입히시겠습니까? 믿음이 작은 사람들아!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화덕’은 빵을 굽는 데 쓰던 화덕을 가리킵니다. 마른 들풀은 그 연료로 사용될 수 있었습니다.
    reason: cultural_note
