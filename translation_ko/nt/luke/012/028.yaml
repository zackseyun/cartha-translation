  source_fidelity: 초안은 χόρτον을 ‘들풀’로, ἀμφιέζει를 ‘입히시거든’으로 적절히 옮기고, ὀλιγόπιστοι의 직접적인 부름도 보존합니다. 그러나 문두의 εἰ δέ(‘그러나/그런데 만일’)가 빠져 있으며, ‘하물며 너희이겠느냐’는 비교의 귀결인 ‘너희를 [입히시다]’를 자연스럽고 명확하게 드러내지 못합니다.
  naturalness: ‘오늘 있다가’는 가능하나 ‘오늘은 들에 있다가 내일은 … 던져지는’이 시간적 대조와 장소를 더 자연스럽게 나타냅니다. ‘화덕’은 고대의 빵 굽는 κλίβανος를 현대 한국어로 무리 없이 전달합니다. ‘믿음이 작은 사람들아’는 직접적이되 불필요하게 강하지 않은 호격입니다.
  terminology: ‘하나님’, ‘들풀’, ‘화덕’, ‘입히시다’, ‘믿음이 작은 사람들’은 본문의 어휘와 문맥에 적합합니다. ‘얼마나 더’는 πόσῳ μᾶλλον의 작은 것에서 큰 것으로의 비교를 명시하며, ‘잘’과 같은 해석적 부사는 덧붙이지 않았습니다.
