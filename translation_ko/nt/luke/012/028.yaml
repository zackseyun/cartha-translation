  - severity: medium
    issue: ‘하물며 너희이겠느냐’가 생략된 술어를 한국어에서 부자연스럽게 처리합니다.
    rationale: 그리스어의 ἀμφιέζει가 비교절에도 함축되지만, 한국어에서는 ‘너희를 얼마나 더 입히시겠습니까’라고 밝혀야 의미와 문법이 명료합니다.
