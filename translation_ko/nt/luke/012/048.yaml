  to: 「알지 못한 채 매를 맞을 일을 한 사람은 매를 적게 맞을 것입니다. 많이 받은 사람에게는 많은 것을 요구할 것이며, 많이 맡겨 받은 사람에게는 더 많은 것을 요구할 것입니다.」
  rationale: The revision corrects the reversed participant role in the final clause, explicitly retains the concrete ‘blows’ imagery, and uses consistent modern formal-polite Korean. The subject of “요구할 것입니다” remains unexpressed, corresponding to the Greek indefinite third-person plural rather than specifying God or another agent.
