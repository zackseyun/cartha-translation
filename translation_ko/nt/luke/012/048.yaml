review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the graded consequence for one who acted without knowledge and the principle that greater gifts bring greater accountability. However, “많이 맡긴 자” reverses the role in the final clause: it denotes one who entrusted much, whereas the Greek refers to the person to whom much was entrusted.'
  naturalness: The wording is generally understandable, but “매 맞을 일” is less polished than “매를 맞을 일을 한,” and the requested modern formal-polite register is better maintained with “-습니다” forms.
  terminology: “매” appropriately preserves the concrete imagery of πληγαί (‘blows’) without specifying an instrument. “맡겨 받은” naturally renders the entrusted-responsibility sense of παρέθεντο while retaining the Greek’s indefinite plural agency in the following verb.
  issues:
  - severity: high
    issue: The final clause reverses the recipient/entruster relationship.
    rationale: “많이 맡긴 자에게는” means ‘to the one who entrusted much.’ Greek καὶ ᾧ παρέθεντο πολύ means ‘and [from/to] the one to whom they entrusted much.’ The Korean must identify that person as the recipient of a trust.
  - severity: low
    issue: Register and explicit punishment object can be improved.
    rationale: “매를 적게 맞을 것입니다” is clearer and maintains modern formal-polite 합쇼체 consistently.
  revised_text: 「알지 못한 채 매를 맞을 일을 한 사람은 매를 적게 맞을 것입니다. 많이 받은 사람에게는 많은 것을 요구할 것이며, 많이 맡겨 받은 사람에게는 더 많은 것을 요구할 것입니다.」
