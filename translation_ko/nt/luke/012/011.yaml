    rationale: ‘무엇으로 변호할까’는 한국어에서 목적·내용 관계가 불명확합니다. 원문의 ‘어떻게 또는 무엇을 변호할지’라는 범위를 ‘어떻게 또는 무슨 말로 자신을 변호할지’로 자연스럽게 드러낼 수 있습니다.
