  source_fidelity: 원문의 ὅταν δέ는 미래의 반복적 상황을 나타내므로 ‘그러나/그런데 … 때에는’으로 옮길 수 있습니다. εἰσφέρωσιν ἐπί는 심문·재판의 맥락에서 ‘앞에 끌고 가다’가 적절합니다. πῶς ἢ τί ἀπολογήσησθε는 변호의 방식과 내용을 함께 묻는 표현이므로 ‘어떻게 또는 무슨 말로 자신을 변호할지’가 자연스럽고 충실합니다. 뒤의 ἢ τί εἴπητε도 별도로 ‘무엇을 말할지’로 보존했습니다.
  naturalness: 초안의 ‘어떻게 또 무엇으로 변호할까’는 간접 의문문의 문체와 ‘무엇으로 변호하다’의 결합이 다소 부자연스럽습니다. 또한 요청된 현대 한국어 합쇼체에 맞추어 종결을 ‘염려하지 마십시오’로 고쳐야 합니다.
  terminology: ‘회당’, ‘통치자들’, ‘권세자들’은 원문의 세 부류를 구별하여 유지할 수 있습니다. 여기서 ‘권세자들’은 초자연적 권세로 한정하지 않고 공적 권한을 가진 당국을 가리키는 문맥으로 이해됩니다.
