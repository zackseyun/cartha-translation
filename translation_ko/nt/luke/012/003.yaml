  source_fidelity: 첫 절의 공개·은폐 대조와 미래 수동태는 대체로 충실합니다. 그러나 ἐλαλήσατε를 ‘속삭인’으로 옮기면 ‘귀에 대고’라는 관용구가 이미 나타내는 은밀성을 넘어서 발화 방식을 확정합니다. 또한 복수형 ταμείοις는 ‘은밀한 방들’로 반영하는 편이 안전합니다.
  naturalness: 합쇼체 성경 문체에서 ‘너희가 … 말한 모든 것은’과 ‘은밀한 방들에서 귀에 대고 말한 것’은 자연스럽고 명료합니다. ‘빛 가운데서’와 ‘지붕 위에서’는 원문의 대조적 이미지를 유지합니다.
  terminology: ‘선포될 것입니다’는 κηρυχθήσεται의 공개적 선언 의미를 적절히 살립니다. ‘은밀한 방들’은 ταμεῖον의 방/내실이라는 의미를 보존하면서 특정 용도(골방·창고)를 단정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘속삭인’은 ἐλαλήσατε보다 구체적입니다.
    rationale: πρὸς τὸ οὖς가 사적인 귓속말의 상황을 나타내지만, 동사 λαλέω 자체는 단순히 ‘말하다’입니다. ‘귀에 대고 말한’으로 옮겨 원문의 표현 범위를 보존해야 합니다.
  - severity: low
    issue: ‘골방’은 ταμείοις의 의미를 다소 좁히며 복수도 드러나지 않습니다.
    rationale: ταμεῖον은 안쪽의 사적인 방, 방/내실, 저장 공간 등을 가리킬 수 있습니다. 문맥상 ‘은밀한 방들’이 자연스럽고 더 포괄적입니다.
