  source_fidelity: 개정이 필요합니다. 초안의 ‘비유로 말씀하셨습니다’는 παραβολὴν의 직접목적어 관계를 다소 흐리며, ‘밭’은 χώρα가 가리키는 소유지·농경지를 한 필지의 밭으로 다소 좁힐 수 있습니다. ‘어떤 부자의 땅에서 많은 소출이 났습니다’는 소유 관계와 풍성한 수확의 뜻을 자연스럽게 보존합니다.
  naturalness: ‘그들에게 비유를 들어 말씀하셨습니다’와 ‘땅에서 많은 소출이 났습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. 인용문을 도입하는 방식도 λέγων의 기능을 무리 없이 반영합니다.
  terminology: παραβολή는 복음서의 정착된 용어인 ‘비유’로 유지했습니다. χώρα는 여기서 국가가 아니라 부자의 농경지를 가리키므로 ‘땅’으로 옮겼습니다. εὐφόρησεν의 ‘풍성히 산출하다’라는 의미는 ‘많은 소출이 났습니다’로 반영했습니다.
