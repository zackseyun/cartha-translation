  terminology: ‘인자’는 ὁ υἱὸς τοῦ ἀνθρώπου의 정착된 메시아적 호칭을 보존하므로 유지합니다. ‘하나님의 천사들’도 원문의 소유 관계를 충실히 반영합니다.
