- from: 「내가 너희에게 두려워할 자를 보이리니, 죽인 후에 게헨나에 던질 권세 있는 그를 두려워하라. 그렇다, 내가 너희에게 이르노니, 이분을 두려워하라.」
  to: 「그러나 내가 너희에게 누구를 두려워해야 하는지 보여 주겠습니다. 죽인 뒤에 게헨나[a]에 던질 권세를 가진 이를 두려워하십시오. 그렇습니다. 내가 너희에게 말합니다. 바로 그를 두려워하십시오.」
  rationale: 현대 표준어 합쇼체로 문체를 정비하고, ‘권세를 가진 이’로 원문의 분사구문을 명료하게 반영했습니다. 대상의 정체를 본문에서 특정하거나 존칭으로 해석하지 않았으며, 마지막 지시대명사의 강조를 ‘바로 그를’로 살렸습니다.
