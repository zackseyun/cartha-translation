  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
  footnotes:
  - marker: a
    text: Or 'hell.' The Greek term is Gehenna, a judgment term with roots in the Valley of Hinnom imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그러나 내가 너희에게 누구를 두려워해야 하는지 보여 주겠습니다. 죽인 뒤에 게헨나[a]에 던질 권세를 가진 이를 두려워하십시오. 그렇습니다. 내가 너희에게 말합니다. 바로 그를 두려워하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지옥’. 그리스어 ‘게헨나’는 힌놈 골짜기 이미지에 뿌리를 둔 심판 용어입니다.
    reason: lexical_alternative
