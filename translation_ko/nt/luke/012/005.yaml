    issue: ‘죽인 후에 게헨나에 던질 권세 있는 그’의 수식 관계가 불명확함
    rationale: 원문은 ‘죽인 후에 게헨나에 던질 권세를 가진 이’를 뜻합니다. ‘권세를 가진 이’로 명시해야 한국어 문장이 자연스럽고 원문의 관계절 구조가 보존됩니다.
  - severity: medium
