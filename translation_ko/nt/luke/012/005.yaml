  verdict: revise
  source_fidelity: 초안은 핵심 의미를 대체로 전달하지만, ‘권세 있는 그’는 ἔχοντα ἐξουσίαν(‘권세/권한을 가진 이’)의 수식 관계가 한국어에서 불분명합니다. 또한 마지막의 τοῦτον이 지닌 지시·강조는 ‘바로 그를’로 더 잘 드러납니다.
  naturalness: ‘보이리니’, ‘이르노니’는 현대 표준어 합쇼체에 비해 고어적입니다. 현대적이면서도 격식 있는 직접화법으로 ‘보여 주겠습니다’, ‘말합니다’, ‘두려워하십시오’를 사용했습니다.
  terminology: γέεννα는 본문에서 ‘게헨나’로 음역하여 원어의 역사적·유대교적 심판 용어를 보존하고, ‘지옥’은 각주 대안으로 제시했습니다. ἐξουσία는 여기서 단순 능력보다 권한의 뜻이므로 ‘던질 권세를 가진’으로 옮겼습니다.
  issues:
