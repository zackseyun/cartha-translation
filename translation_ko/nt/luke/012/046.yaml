review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the master-slave setting, unexpected arrival, severe judgment, and assignment with the ἀπίστοι. However, ‘잘라 내어’ normally means ‘cut off/remove’ and does not adequately represent διχοτομήσει, whose literal image is cutting in two. The implicit subject of ‘기대하지’ and ‘알지 못하는’ should also be made explicit enough to preserve that the slave neither expects the master nor knows the hour.
  naturalness: The current sentence is mostly intelligible, but ‘생각하지 못한 날’ is less precise and idiomatic than ‘올 것이라고 기대하지 않는 날’ for προσδοκᾷ. A formal-polite biblical rendering should use a 합쇼체 final ending.
  terminology: ‘종’ and ‘주인’ suitably render δοῦλος and κύριος in this parabolic household context. ‘신실하지 않은 자들’ is a viable contextual rendering of ἀπίστων, provided the alternative ‘믿지 않는 자들’ is footnoted. ‘몫’ appropriately conveys μέρος in the sense of assigned lot/portion.
  issues:
  - severity: medium
    issue: ‘잘라 내어’ weakens and shifts the sense of διχοτομήσει.
    rationale: The Greek verb has the concrete sense ‘cut in two’/‘divide in two’; ‘잘라 내다’ commonly means cut off or remove. The literal judgment imagery should be retained in the text, with an idiomatic-punishment interpretation in a note.
  - severity: low
    issue: The temporal clauses do not clearly identify what the slave does not expect and does not know.
    rationale: The Greek leaves the objects implicit, but Korean can naturally clarify them as the master’s coming and the hour without adding interpretation.
  - severity: low
    issue: The draft’s final ending is plain declarative rather than the requested modern formal-polite 합쇼체.
    rationale: Changing to ‘것입니다’ conforms to the stated target register.
  revised_text: 「그 종의 주인은 그가 올 것이라고 기대하지 않는 날, 그가 알지 못하는 시각에 와서 그를 두 동강 내고[a], 신실하지 않은 자들과 함께 그의 몫을 정할 것입니다.[b]」
