    text: 또는 ‘그를 심하게 벌하고’. 직역하면 ‘그를 둘로 자르고’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘믿지 않는 자들’.
    reason: alternative_reading
  revision_rationale: The revision renders προσδοκᾷ as ‘기대하다’ and γινώσκει as ‘알다,’ retaining their distinction. It restores the literal force of διχοτομήσει with ‘두 동강 내고,’ while preserving the possible idiomatic understanding in a footnote. It retains the contextual main-text sense ‘신실하지 않은 자들’ for ἀπίστων and supplies the ‘믿지 않는 자들’ alternative. ‘그의 몫을 정하다’ preserves the judicial assignment of μέρος, and the ending is revised to modern formal-polite 합쇼체.
