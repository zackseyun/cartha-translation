review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, ψυχή를 ‘목숨을 위하여’로 옮기면 음식에 관한 염려의 대상이라기보다 목숨을 보존하기 위한 수단처럼 들릴 수 있습니다. 또한 ‘그러므로’는 가능하나 Διὰ τοῦτο의 명시적 선행 근거를 ‘이 때문에’로 옮기는 편이 더 가깝습니다.
  naturalness: 서술은 합쇼체이나 직접 인용은 ‘이르노니/말라’의 고전적 문체여서 요청된 현대 표준어 합쇼체와 일관되지 않습니다. ‘생명에 대하여’와 ‘염려하지 마십시오’가 현대적이고 자연스럽습니다.
  terminology: ψυχή는 이 문맥에서 영혼보다 먹고사는 생명·삶을 가리키므로 ‘생명’으로 번역하고, 가능한 어휘 대안을 각주로 밝혔습니다. σώμα는 ‘몸’이 적절합니다.
  issues:
  - severity: medium
    issue: ‘목숨을 위하여’의 의미 방향
    rationale: τῇ ψυχῇ는 여기서 ‘목숨을 위해’라기보다 먹을 것에 관해 염려하는 삶/생명의 영역을 나타냅니다. ‘생명에 대하여’가 원문의 관계를 더 정확히 드러냅니다.
  - severity: medium
    issue: 직접 인용문의 문체 불일치
    rationale: ‘이르노니, ... 말라’는 현대 합쇼체가 아니라 문어적 성경체입니다. ‘말합니다, ... 마십시오’로 통일해야 합니다.
  - severity: low
    issue: Διὰ τοῦτο의 번역
    rationale: ‘그러므로’도 가능하지만, ‘이 때문에’는 앞선 말씀을 근거로 삼는 표현을 더 명시적으로 보존합니다.
  revised_text: 예수께서 제자들에게 말씀하셨습니다. “이 때문에 내가 너희에게 말합니다. 무엇을 먹을까 하고 너희 생명에 대하여 염려하지 말고, 무엇을 입을까 하고 너희 몸에 대하여도 염려하지 마십시오.”
  revised_footnotes:
  - marker: a
    text: ‘생명’에 해당하는 그리스어는 문맥에 따라 ‘혼’으로도 옮길 수 있으나, 여기서는 먹고사는 삶을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 현대 표준어 합쇼체로 문체를 통일하고, ψυχή가 음식과 관련하여 가리키는 현세의 생명이라는 문맥적 의미를 정확히 반영했습니다. 각주 표지는 ‘생명’ 뒤에 a로 붙입니다.
