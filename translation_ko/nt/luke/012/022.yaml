review_pass:
  verdict: revise
  source_fidelity: The draft substantially conveys the Greek sense, including the causal Διὰ τοῦτο and the parallel concerns of food and clothing. However, τῇ ψυχῇ is better rendered as "삶에 대하여" in this context than "목숨을 위하여," which can shift the relation toward purpose/provision rather than anxious concern about one's life. The explicit "예수께서" is contextually identifiable, but "그분께서" avoids adding a name not present in this verse while retaining natural Korean reference.
  naturalness: The draft mixes narrative 합쇼체 ("이르셨습니다") with archaic, non-합쇼체 quotation forms ("이르노니," "말라"). A consistent modern formal-polite rendering requires "말씀하셨습니다," "말씀드립니다," and "염려하지 마십시오."
  terminology: '"제자들," "염려하다," and "몸" are appropriate. "삶" accurately represents ψυχή here as earthly life, without importing the theological sense "영혼."'
  issues:
  - severity: medium
    issue: Register is inconsistent and archaic within the quotation.
    rationale: '"이르노니" and "말라" do not meet the requested modern formal-polite 합쇼체 style, whereas the narrative uses "이르셨습니다."'
  - severity: medium
    issue: '"목숨을 위하여" weakens the Greek dative''s sense of concern about one''s life.'
    rationale: In context, ψυχή denotes earthly life, and the construction calls for not being anxious concerning it and its food needs, not primarily acting for its benefit.
  - severity: low
    issue: No Korean lexical note preserves the possible "영혼" sense of ψυχή.
    rationale: '"삶" is the contextually preferred translation, but a brief note can transparently retain the lexical alternative without promoting it as the intended sense.'
  revised_text: 그분께서 제자들에게 말씀하셨습니다. “그러므로 내가 여러분에게 말씀드립니다. 삶에 대하여, 곧 무엇을 먹을지 염려하지 말고, 몸에 대하여, 곧 무엇을 입을지도 염려하지 마십시오.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘영혼’. 여기서 그리스어 단어는 흔히 먹는 것과 관련된 이 땅의 삶을 뜻합니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the source's causal connection, direct address, and balanced food/clothing clauses while using consistent modern 합쇼체. "삶" reflects ψυχή in its immediate practical context; the note preserves the alternate lexical sense. The verse's unnamed subject is rendered "그분께서" rather than adding a name absent from the Greek wording.
