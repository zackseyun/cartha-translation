  text: 예수께서 제자들에게 말씀하셨습니다. “이 때문에 내가 너희에게 말합니다. 무엇을 먹을까 하고 너희 생명에 대하여 염려하지 말고, 무엇을 입을까 하고 너희 몸에 대하여도 염려하지 마십시오.”
  philosophy: optimal-equivalence
