review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the explicit contrastive/emphatic subject, the two coordinated questions of food and drink, and the two prohibitions. However, bare “흔들리지도 말라” can naturally suggest literal or general wavering in Korean, whereas μετεωρίζεσθε here denotes inner agitation or anxious uncertainty.
  naturalness: The draft’s final imperative, “말라,” does not consistently use the requested modern formal-polite 합쇼체. “무엇을 먹을지, 무엇을 마실지를” is idiomatic Korean for the deliberative questions, and “마음을 불안하게 하지도 마십시오” naturally conveys the final prohibition in context.
  terminology: “구하지 마십시오” retains the seeking vocabulary without importing an ascetic prohibition on obtaining food. The added “마음을” specifies the idiomatic Korean domain of the otherwise potentially ambiguous metaphor while remaining within the lexical sense of μετεωρίζομαι.
  issues:
  - severity: medium
    issue: Register mismatch
    rationale: “말라” is not the specified modern formal-polite 합쇼체; the passage should use “마십시오.”
  - severity: medium
    issue: Ambiguity of “흔들리지도 말라”
    rationale: Although it can figuratively denote emotional instability, in contemporary Korean it may be read as physical shaking or an unspecific lack of resolve. The Greek verb in this context concerns anxious mental unsettledness.
  revised_text: 「너희는 무엇을 먹을지, 무엇을 마실지를 구하지 말고, 마음을 불안하게 하지도 마십시오.」
  revised_footnotes:
  - marker: a
    text: 또는 “마음이 흔들리지도 마십시오”, “마음 졸이지도 마십시오.” 더 직역하면 “공중에 매달린 듯하지도 마십시오.”
    reason: μετεωρίζεσθε의 비유적 의미(불안·동요)와 문자적 이미지의 여지를 보존합니다.
  revision_rationale: 합쇼체로 통일하고, 먹고 마실 것에 대한 숙고를 자연스러운 한국어로 옮겼습니다. 마지막 동사는 문맥상 정신적 불안을 뜻하므로 이를 본문에서 분명히 하되, 다른 가능한 표현과 문자적 이미지는 각주에 남겼습니다.
