  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
  footnotes:
  - marker: a
    text: Or “rain is coming.” The Greek ὄμβρος can denote rain generally or a rainstorm/downpour more specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서는 또한 무리에게 말씀하고 계셨습니다. “너희가 서쪽에 구름이 솟아오르는 것을 보면, 곧바로 ‘비[a]가 오겠다’ 하고 말한다. 그러면 그대로 된다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “폭우가 오겠다” 또는 “소나기가 오겠다.” 그리스어 ὄμβρος는 일반적인 비를 가리킬 수도 있고, 폭우나 소나기를 가리킬 수도 있습니다.
    reason: lexical_alternative
