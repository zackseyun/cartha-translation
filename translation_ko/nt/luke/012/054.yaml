review_pass:
  verdict: revise
  source_fidelity: 원문의 미완료과거 Ἔλεγεν과 δὲ καὶ, 복수형 ‘무리들’, 일반적 조건 표현을 반영할 필요가 있습니다. 초안의 ‘예수께서’는 이 절의 그리스어 본문에 명시되지 않았으므로 생략하는 편이 원문 우선 원칙에 더 충실합니다. ὄμβρος는 단순 ‘비’보다 ‘큰비/폭우’의 뉘앙스를 가질 수 있으므로 본문과 각주에서 이를 보존했습니다.
  naturalness: 초안의 중첩된 한국어 큰따옴표는 인용 관계가 불명확합니다. 바깥 발화에는 큰따옴표, 발화 안의 군중의 말에는 작은따옴표를 사용하고, 일반적으로 반복되는 관찰을 현재형으로 옮기면 현대 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘무리’는 τοῖς ὄχλοις의 복수 의미를 문맥상 자연스럽게 전달합니다. ‘서쪽에서 구름이 일어나는 것’은 ἐπὶ δυσμῶν 및 ἀνατέλλουσαν을 충실히 반영합니다. ‘큰비’는 ὄμβρος의 강한 강수 가능성을 반영하되, 각주에서 ‘비’라는 대안을 제시합니다.
  issues:
  - severity: medium
    issue: 명시되지 않은 주어 ‘예수께서’가 추가되어 있습니다.
    rationale: 이 절의 그리스어는 주어를 명시하지 않습니다. 앞 문맥상 예수를 가리키지만, 원문 우선 검토에서는 한국어에서도 주어를 생략할 수 있으므로 불필요한 보충을 피하는 것이 안전합니다.
  - severity: medium
    issue: 인용부호가 중첩되어 발화 구조가 불명확합니다.
    rationale: 예수의 발화 안에 군중의 직접 발화가 들어가므로 한국어 인용부호를 구분해야 합니다.
  - severity: low
    issue: ‘과연 그렇게 된다’는 원문의 일반적 현재 서술보다 다소 강조되고 문체가 덜 자연스럽습니다.
    rationale: καὶ γίνεται οὕτως는 ‘그렇게 됩니다’로 옮기면 의미와 합쇼체 문체를 자연스럽게 보존합니다.
  revised_text: 또 무리에게 말씀하셨습니다. “너희가 서쪽에서 구름이 일어나는 것을 보면, 곧바로 ‘큰비가 오겠다’라고 말합니다. 그러면 그대로 됩니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “비가 오겠다.” 그리스어 ‘옴브로스’(ὄμβρος)는 일반적인 비를 가리킬 수도 있고, 큰비나 폭우를 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 명시적 주어를 제거하고, 미완료과거의 배경적·반복적 발화는 ‘말씀하셨습니다’로 자연스럽게 옮겼습니다. 조건절과 군중의 습관적 반응은 현재형으로 유지했으며, 직접 인용의 층위를 바로잡았습니다. ὄμβρος의 의미 범위는 본문 ‘큰비’와 각주의 대안으로 보존했습니다.
