review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘분쟁할 것이다’는 διαμερισθήσονται(‘갈라질 것이다/분열될 것이다’)의 수동적 분열 상태를 능동적 다툼으로 좁힙니다. 또한 ‘시어머니’는 πενθερά의 일반적인 ‘어머니/시어머니’ 관계를 한국어 친족 체계의 남편 쪽 어머니로 특정합니다. 문맥상 통상적인 짝은 유지하되, 대립 관계와 미래의 분열을 더 직접적으로 옮기는 것이 안전합니다.
  naturalness: ‘A가 B에 대하여 … 분쟁하다’의 장황한 병렬보다 ‘A는 B와 맞서고’가 현대 표준어에서 자연스럽고, 반복되는 ἐπί의 적대 관계도 명료하게 나타냅니다. 합쇼체 미래 종결은 ‘것입니다’로 일관되게 처리했습니다.
  terminology: πατήρ/υἱός, μήτηρ/θυγάτηρ는 각각 ‘아버지/아들’, ‘어머니/딸’로 유지했습니다. πενθερά와 νύμφη는 이 가족 짝에서 ‘시어머니/며느리’로 옮겼으며, αὐτῆς는 ‘자기 며느리’에 반영했습니다. 이는 한국어 관용 친족어가 일부 관계 방향을 더 구체화하는 한계가 있으나, 본문의 통상적 가족 관계를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘분쟁할 것이다’가 ‘갈라질 것이다’를 능동적 다툼으로 좁힘
    rationale: διαμερισθήσονται는 미래 수동태로, 가족 구성원들 사이의 분열을 말합니다. 뒤의 대립 목록을 살리되 도입부의 분열 표현을 보존해야 합니다.
  - severity: low
    issue: 반복된 ‘~에 대하여’ 구성의 부자연스러움
    rationale: ἐπί의 문맥상 의미는 ‘맞서다/대적하다’로 자연스럽게 옮길 수 있습니다.
