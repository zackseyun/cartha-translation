id: LUK.12.2
reference: Luke 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
  footnotes:
  - marker: a
    text: Or 'concealed' for 'covered up'; the Greek uses imagery of something having been covered and later revealed.
    reason: lexical_alternative
  - marker: b
    text: Or 'secret' for 'hidden.'
    reason: lexical_alternative
  - marker: c
    text: The saying can refer broadly to eventual disclosure, whether in the present or at the final judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 「가려져 있는 것 중에는 드러나지 않을 것이 없으며[a][c], 숨겨진 것 중에는 알려지지 않을 것이 없습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가려져 있는’은 ‘덮여 있는’ 또는 ‘감추어진’으로도 옮길 수 있습니다. 그리스어는 덮여 있던 것이 후에 드러나는 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숨겨진’은 ‘비밀스러운’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 말씀은 현재 또는 마지막 심판 때를 포함하여, 장차 감추어진 것이 드러나게 됨을 넓게 가리킬 수 있습니다.
    reason: alternative_reading
