review_pass:
  verdict: revise
  source_fidelity: The draft retains the images of fire, earth, and kindling, but its final rhetorical question (“내가 무엇을 더 원하랴”) follows a highly literal construal that is obscure in modern Korean and introduces “더” (“more”), which is not explicit in the Greek. The difficult final clause is more clearly conveyed in the main text as an emphatic wish, with the literal alternative preserved in a footnote.
  naturalness: “불을 땅에 던지러 왔습니다” is vivid and acceptable in formal Korean. The current final clause is archaic in register and not natural modern 합쇼체. “그 불이 이미 붙었으면 좋겠습니다!” is clear, formal-polite, and communicates the probable idiomatic force of the Greek.
  terminology: “불,” “땅,” “던지다,” and “붙다” preserve the source imagery without defining the fire as judgment, purification, or another theological interpretation. “그 불” provides a natural Korean referent without adding interpretation.
  issues:
  - severity: medium
    issue: The final clause is rendered as an archaic, overly literal rhetorical question.
    rationale: τί θέλω εἰ ἤδη ἀνήφθη is syntactically difficult. The draft’s “그것이 이미 붙었으면 내가 무엇을 더 원하랴” is not idiomatic modern Korean and adds “더.” A natural exclamation of desire better represents the probable sense while a footnote should retain the literal possibility.
  - severity: low
    issue: The direct speech does not consistently use modern formal-polite sentence endings.
    rationale: The target register is 합쇼체; “왔습니다” and “좋겠습니다” provide the required modern formal-polite style.
  revised_text: 「내가 땅에 불을 던지러 왔습니다. 그 불이 이미 붙었으면 좋겠습니다!」
  revised_footnotes:
  - marker: a
    text: 직역하면, “그리고 그것이 이미 붙었다면, 내가 무엇을 바라겠습니까?”라고 할 수 있습니다. 그리스어 문구는 해석하기 어렵습니다. 본문은 불이 이미 붙기를 강하게 바라신다는 관용적 의미를 따른 것입니다.
    reason: alternative_reading
  revision_rationale: The revision preserves the metaphorical image of fire and the scope of “earth” without theological specification. It renders the difficult closing clause in natural modern Korean as a strong wish, in line with the probable idiomatic sense reflected in the English audit trail, while explicitly preserving the more literal construal in a footnote. No doctrinal interpretation is imposed.
