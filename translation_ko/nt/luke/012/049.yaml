review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘왔으니’는 단순 접속사 καί를 이유·결과의 뉘앙스로 바꾸며, 후반절은 난해한 헬라어를 지나치게 직역하여 의도된 소망의 감탄을 한국어에서 자연스럽게 드러내지 못합니다.
  naturalness: ‘그것이 이미 붙었으면 내가 무엇을 더 원하랴’는 현대 표준어 합쇼체에 맞지 않고, ‘더’는 원문에 없는 추가 대조를 암시합니다. ‘그 불이 이미 붙었으면 얼마나 좋겠습니까!’는 자연스러운 감탄형으로 강한 소망을 전달합니다.
  terminology: Πῦρ는 해석적으로 ‘심판’ 등으로 풀지 않고 ‘불’로 유지했습니다. βαλεῖν은 ‘던지다’, γῆ는 문맥상 ‘땅’으로 옮겼습니다. ἀνήφθη는 불의 이미지에 맞게 ‘붙다’로 표현했습니다.
  issues:
  - severity: medium
    issue: ‘왔으니’가 καί를 인과적으로 처리함
    rationale: 원문은 ‘불을 던지러 왔고/왔다’라는 단순 연결이며, 이유를 명시하지 않습니다.
  - severity: medium
    issue: 후반절의 직역적 수사가 한국어에서 불명확함
    rationale: τί θέλω εἰ ἤδη ἀνήφθη는 난해하지만, 문맥상 불이 이미 붙기를 바라는 감탄으로 이해하는 번역이 적절합니다. 초안의 ‘무엇을 더 원하랴’는 이 의미를 흐리고 ‘더’라는 원문 밖의 요소를 넣습니다.
  revised_text: 「내가 불을 땅에 던지러 왔습니다. 그 불이 이미 붙었으면 얼마나 좋겠습니까!」
  revised_footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그것이 이미 붙었다면 내가 무엇을 바라겠습니까?’ 그리스어 이 구절은 해석하기 어렵습니다. 본문은 불이 이미 붙기를 바라는 강한 소망으로 이해하여 옮겼습니다.
    reason: alternative_reading
  revision_rationale: 원문의 비유적 ‘불’을 그대로 보존하고, 후반절의 문법적 난해함은 각주에 밝혔습니다. 본문은 영어 POB의 판단과 마찬가지로 강한 소망의 감탄을 자연스러운 현대 한국어 합쇼체로 표현하되, 불이 무엇을 뜻하는지는 해석하지 않았습니다.
