  terminology: ‘파수 시간’은 여기서 φυλακή가 가리키는 밤의 시간을 자연스럽게 전달합니다. μακάριοι는 성경적 용례를 유지하여 ‘복이 있습니다’로 옮깁니다.
  issues:
