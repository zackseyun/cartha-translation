    issue: ‘제이 경/제삼 경’ 표현
    rationale: 현대 한국어에서는 비자연스럽고 ‘경’의 뜻이 불분명합니다. φυλακή의 문맥상 의미인 밤의 파수 시간을 밝혀야 합니다.
  - severity: medium
    issue: κἄν의 양보적 뉘앙스가 약함
    rationale: ‘오든지 … 오든지’보다 ‘설령 … 오더라도’가 반복된 κἄν의 ‘심지어 어느 때에 오더라도’라는 조건을 더 잘 보존합니다.
  - severity: low
    issue: 합쇼체 종결 미사용
    rationale: 요청된 현대 격식체에 맞추어 ‘복이 있습니다’로 종결하는 것이 일관됩니다.
