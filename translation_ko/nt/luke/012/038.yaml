    reason: historical_context
  revision_rationale: 원문의 조건적·양보적 구조를 ‘설령 … 오더라도’로 반영하고, φυλακή를 현대적으로 이해 가능한 ‘밤의 … 파수 시간’으로 옮겼습니다. οὕτως는 직전 문맥의 준비 상태를 가리키므로 ‘그렇게 준비되어 있는 것’으로 문맥상 보충하되 특정 행동으로 과도하게 좁히지 않았습니다. ἐκεῖνοι의 선행사는 문맥상 종들이므로 ‘그 종들’로 명시했습니다.
