  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'in the second watch of the night, or in the third watch of the night.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'blessed are those.' The referent is the servants mentioned in the immediate context.
    reason: lexical_alternative
translation:
  language: ko
  text: 「설령 주인이 밤의 둘째 파수 시간[a]이나 셋째 파수 시간에 와서 종들이 그렇게 준비되어 있는 것을 보면, 그 종들은 복이 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘파수 시간’은 밤을 나눈 시간 구분을 가리킵니다. 직역하면 ‘둘째 파수 시간이나 셋째 파수 시간’입니다.
    reason: historical_context
