  source_fidelity: 개정이 필요합니다. 초안의 핵심 의미는 대체로 맞지만, 두 개의 경고 명령(Ὁρᾶτε καὶ φυλάσσεσθε)을 더 분명히 살리고, πάσης πλεονεξίας의 포괄성을 ‘온갖’으로 드러내는 편이 좋습니다. 마지막 문장은 사람이 가진 것의 풍족함이 생명의 근거·본질이 아니라는 뜻을 자연스럽게 나타내야 합니다.
  naturalness: ‘조심하라’와 ‘경계하라’의 명령형은 본문이 요구한 합쇼체와 맞지 않습니다. ‘주의하고 … 경계하십시오’가 현대 표준어 합쇼체로 자연스럽고, 연속된 두 명령의 기능도 보존합니다. ‘그 소유의 풍부함’은 다소 문어적이고 어색하므로 ‘그가 가진 것이 풍족한 데’로 고쳤습니다.
  terminology: πλεονεξία는 여기서 단지 타인의 것을 탐내는 행위에 한정되지 않는 탐욕·소유욕을 가리키므로 ‘탐욕’이 적절합니다. πάσης의 범위를 반영하여 ‘온갖 탐욕’으로 번역했습니다. ζωή는 불필요하게 해석을 좁히지 않고 전통적이며 자연스러운 ‘생명’으로 유지했습니다.
  issues:
  - severity: medium
    issue: 명령문의 높임 종결이 합쇼체 기준과 일치하지 않습니다.
    rationale: ‘조심하라, … 경계하라’는 해라체입니다. 지정된 현대 공식-공손체에 맞추어 ‘주의하고 … 경계하십시오’로 해야 합니다.
  - severity: medium
    issue: 두 개의 그리스어 경고 명령의 결합이 충분히 드러나지 않습니다.
    rationale: Ὁρᾶτε와 φυλάσσεσθε는 각각 주의하고 스스로 지키라는 경고입니다. ‘주의하고 … 경계하십시오’는 두 요소와 φυλάσσεσθε의 자기보호적 경계 의미를 자연스럽게 반영합니다.
  - severity: low
    issue: ‘모든 탐욕’보다 ‘온갖 탐욕’이 자연스럽고 포괄성을 잘 드러냅니다.
    rationale: πάσης는 탐욕의 모든 형태를 경계하라는 뜻입니다.
  - severity: medium
    issue: ‘그 소유의 풍부함에 있지 아니하다’는 현대 한국어에서 다소 경직되어 있고, 풍족함과 생명의 관계가 불명확할 수 있습니다.
    rationale: ‘사람의 생명은 그가 가진 것이 풍족한 데 있지 않습니다’는 생명이 소유의 풍족함으로 규정되지 않는다는 문맥상의 뜻을 자연스럽게 전달합니다.
