  text: 그 무렵 수만 명[a]의 군중이 모여 서로 밟을 만큼 되자, 예수께서는 먼저 자기 제자들에게 말씀하기 시작하셨습니다. “바리새인들의 누룩, 곧 외식을 조심하십시오.”
  philosophy: optimal-equivalence
  footnotes:
