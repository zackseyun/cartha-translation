  source_fidelity: 핵심 의미는 대체로 전달하지만, 원문의 복수 지시 대상(‘이 백합들 가운데 하나’)이 ‘이 꽃 하나’로 다소 축소되었고, ‘솔로몬의 모든 영광도’는 솔로몬 자신이 주어인 원문의 비교 구조를 흐립니다.
  naturalness: ‘생각하여 보라’, ‘하지 아니한다’, ‘이르노니’는 요청된 현대 표준어 합쇼체보다 문어적·고어적입니다. ‘잘 살펴보십시오’, ‘하지 않습니다’, ‘말합니다’가 현대적이면서도 본문의 엄숙한 어조를 유지합니다.
  terminology: κρίνα는 ‘백합’으로 유지하는 것이 적절합니다. κοπιᾷ와 νήθει는 각각 ‘수고하다’와 ‘길쌈하다’로, περιεβάλετο는 문맥상 ‘차려입다’로 자연스럽게 옮길 수 있습니다. δόξα는 여기서 왕의 위엄과 화려함을 가리키므로 ‘영광’이 가능합니다.
  issues:
  - severity: medium
    issue: 현대 합쇼체에 맞지 않는 고어적 표현
    rationale: ‘생각하여 보라’, ‘하지 아니한다’, ‘이르노니’는 현대 표준어 공식 존대체가 아니라 전통 성경체에 가깝습니다.
  - severity: low
    issue: 비교 대상의 복수성이 약화됨
    rationale: ὡς ἓν τούτων은 ‘이것들 가운데 하나처럼’이라는 뜻입니다. ‘이 꽃 하나만큼도’도 의미는 통하지만, ‘이 백합들 가운데 하나처럼’이 원문의 지시 관계를 더 충실히 보존합니다.
  revised_text: 「백합이 어떻게 자라는지 잘 살펴보십시오. 백합은 수고도 길쌈도 하지 않습니다. 그러나 내가 여러분에게 말합니다. 솔로몬도 그의 모든 영광 가운데서 이 백합들 가운데 하나처럼 차려입지 못했습니다.」
  revised_footnotes:
  - marker: a
    text: 또는 ‘들꽃들’ 또는 ‘꽃들’. 그리스어는 구체적으로 ‘백합들’을 말합니다.
    reason: lexical_alternative
  revision_rationale: 원문의 명령형이 요청하는 주의 깊은 관찰을 ‘잘 살펴보십시오’로 옮기고, 전 구절을 현대 표준어 합쇼체로 정비했습니다. 솔로몬을 문장의 주어로 회복하고 ‘이 백합들 가운데 하나처럼’으로 원문의 비교 구문과 복수 지시를 보존했습니다. ‘백합’에 대해서만 원어의 구체성과 가능한 어휘 대안을 설명하는 각주를 두었습니다.
