review_pass:
  verdict: revise
  source_fidelity: 초안은 백합, 수고, 길쌈, 솔로몬의 영광이라는 핵심 요소를 대체로 담았으나, ‘이 꽃 하나’는 복수 선행사 τὰ κρίνα 및 ‘이것들 중 하나’(ἓν τούτων)를 충분히 반영하지 못합니다. 또한 ‘차려입지 못하였다’는 원문의 과거 진술보다 능력의 결여로 읽힐 수 있습니다.
  naturalness: ‘백합화’는 현대 표준어 성경 문맥에서 부자연스럽고, ‘생각하여 보라/하지 아니한다/이르노니/못하였다’는 요청된 현대 합쇼체와 맞지 않습니다. 자연스러운 현대 합쇼체로 고쳤습니다.
  terminology: κρίνα는 ‘백합’으로 유지했습니다. κοπιᾷ와 νήθει는 각각 ‘수고하다’와 ‘실을 잣다’로, δόξα는 왕적 화려함을 포함하는 ‘영광’으로 옮겼습니다. περιεβάλετο는 과거의 의복 상태를 나타내도록 ‘차려입지 않았습니다’로 번역했습니다.
  issues:
  - severity: medium
    issue: ‘백합화’ 및 문체
    rationale: ‘백합화’는 현대 한국어에서 어색하며, 초안의 ‘보라/아니한다/이르노니’는 현대 formal-polite 합쇼체가 아닙니다.
  - severity: medium
    issue: ‘이 꽃 하나만큼도’
    rationale: ἓν τούτων은 앞의 ‘백합들’ 가운데 하나를 가리킵니다. ‘이 백합들 가운데 하나만큼도’가 지시와 수를 더 충실히 드러냅니다.
  - severity: low
    issue: ‘차려입지 못하였다’
    rationale: περιεβάλετο는 여기서 솔로몬의 과거 의복 상태를 비교하는 서술입니다. ‘차려입지 않았습니다’가 불필요한 능력 의미를 피합니다.
  revised_text: 「백합이 어떻게 자라는지 잘 살펴보십시오. 그것들은 수고하지도 실을 잣지도 않습니다. 그러나 내가 여러분에게 말합니다. 솔로몬도 온갖 영광을 누릴 때에 이 백합들 가운데 하나만큼 차려입지 않았습니다.」
  revised_footnotes:
  - marker: a
    text: 또는 ‘들꽃들’ 또는 ‘꽃들’. 그리스어는 구체적으로 ‘백합들’을 말합니다.
    reason: lexical_alternative
  revision_rationale: 현대 합쇼체로 문체를 통일하고, ‘백합들 가운데 하나’라는 비교 대상을 분명히 했습니다. 원문의 꽃 이름과 의복·왕적 영광의 이미지는 유지했으며, 해석적 확장은 피했습니다.
