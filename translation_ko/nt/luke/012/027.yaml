  text: 「백합이 어떻게 자라는지 잘 살펴보십시오. 백합은 수고도 길쌈도 하지 않습니다. 그러나 내가 여러분에게 말합니다. 솔로몬도 그의 모든 영광 가운데서 이 백합들 가운데 하나처럼 차려입지 못했습니다.」
