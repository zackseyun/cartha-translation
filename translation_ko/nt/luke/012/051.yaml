  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
  footnotes:
  - marker: a
    text: Or 'to bring peace.' The Greek verb is literally 'to give,' but some English translations use 'bring' idiomatically.
    reason: lexical_alternative
  - marker: b
    text: '''On the earth'' could also be rendered ''in the land,'' but the broader sense is more likely here.'
    reason: lexical_alternative
