    issue: Register is not modern formal-polite 합쇼체.
    rationale: '''생각하느냐'' and ''이르노니'' are not appropriate for the specified target register; use ''생각하십니까'' and ''말합니다.'''
  - severity: medium
    issue: '''분쟁'' narrows διαμερισμόν to active conflict.'
    rationale: The source noun denotes division/separation, including the social and familial splitting developed in the following verses. '분열' better preserves that sense.
  revised_text: 「내가 땅에 평화를 주러 왔다고 생각하십니까? 아닙니다. 내가 너희에게 말합니다. 도리어 분열입니다.」
