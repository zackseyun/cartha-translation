  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘내 주인이 오기를 더디 하리라’는 주인이 자신의 도착을 의도적으로 늦출 것이라는 뜻으로 읽힐 수 있어, χρονίζει의 ‘도착이 지연되다/늦어지다’라는 의미를 정확히 반영하지 못합니다. 또한 ἄρξηται가 뒤따르는 행동들의 시작을 나타내는 점을 한국어에서 더 분명히 드러낼 수 있습니다.
  naturalness: ‘속으로’와 ‘남종들과 여종들’은 현대 표준 한국어에서 자연스럽고, 비유 속 가정의 종속적 관계도 유지합니다. 다만 인용문의 동사 표현은 ‘오는 것이 늦어진다’가 자연스럽고 정확합니다.
  terminology: δοῦλος는 ‘종’, κύριος는 이 비유의 가정 내 상전을 가리키므로 ‘주인’으로 옮기는 것이 적절합니다. παῖδας/παιδίσκας의 성별 대조는 ‘남종들과 여종들’로 보존됩니다. μεθύσκεσθαι는 ‘술에 취하다’로 자연스럽게 옮깁니다.
  issues:
  - severity: high
    issue: ‘내 주인이 오기를 더디 하리라’
    rationale: 이는 한국어에서 주인이 ‘더디 하겠다’는 의지 또는 행위를 표현하는 것으로 이해되기 쉽습니다. 원문의 χρονίζει는 주인의 도착이 늦어진다는 종의 판단을 뜻하므로 ‘내 주인이 오는 것이 늦어진다’처럼 옮겨야 합니다.
  - severity: medium
    issue: ἄρξηται의 시작 의미가 뒤의 행동열과 충분히 연결되지 않음
    rationale: 원문은 때리기, 먹기, 마시기, 취하기를 시작하는 상황을 나타냅니다. 한국어 문장에서 ‘때리기 시작하고 … 술에 취하기 시작하면’으로 명시하면 의미 범위가 분명해집니다.
