review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the speaker, crowd setting, address, inheritance, and request. However, ‘명하여’ (‘command’) makes Jesus’ requested action stronger than εἰπέ, which here simply asks him to speak to the brother.
  naturalness: The proposed revision uses idiomatic contemporary formal-polite Korean. ‘제 형제에게 … 말씀해 주십시오’ fits the respectful direct address and preserves the request form.
  terminology: ‘선생님’ appropriately renders Διδάσκαλε, ‘유산’ renders κληρονομίαν, and ‘형제’ retains the Greek reference to the speaker’s brother without assuming a more specific Korean kinship term.
  issues:
  - severity: medium
    issue: ‘명하여’ overtranslates εἰπέ.
    rationale: The Greek imperative εἰπέ means ‘tell/say to’ in this request. Rendering it as ‘command’ adds an authority nuance not present in the source.
