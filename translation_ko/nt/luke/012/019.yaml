    rationale: 원문의 καὶ ἐρῶ는 ‘말할 것이다’라는 미래형인데, 초안은 인용 뒤에 ‘하였다’를 붙여 과거 사건으로 바꾸었습니다.
  - severity: medium
    issue: 겹친 인용부호와 인용 종결이 부자연스러움
    rationale: ‘「「…」 하였다.」’는 한국어 직접 인용의 문장 구조를 흐리고, 원문에 없는 서술층을 덧붙입니다.
  - severity: low
    issue: ‘여러 해를 쓸 좋은 것’의 결합이 다소 어색함
    rationale: εἰς ἔτη πολλά의 미래 지속 용도는 ‘여러 해 동안 쓸’로 표현하는 편이 자연스럽고 명확합니다.
