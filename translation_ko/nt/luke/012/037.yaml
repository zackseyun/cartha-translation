review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 περιζώσεται의 구체적 몸짓은 ‘친히 띠를 띠고’보다 ‘허리에 띠를 두르고’가 더 분명하며, ἀνακλινεῖ는 식사 때 기대어 앉는 관습을 가리키므로 이를 드러내는 편이 좋습니다. κύριος는 이 비유의 직접적 가정 문맥에서는 ‘주인’이 자연스럽습니다.
  naturalness: 초안의 ‘보게 되는 그 종들’, ‘이르노니’, ‘띠를 띠고’, ‘곁에 와서 시중들 것이다’는 다소 문어적이거나 어색합니다. 현대 표준어 합쇼체로 미래 진술을 자연스럽게 다듬었습니다.
  terminology: δοῦλοι는 한국어 성경 문맥에서 ‘종들’이 자연스럽고, 이 구절의 가정 비유 관계도 보존합니다. κύριος는 ‘주인’으로, διακονήσει는 식사 장면에 맞추어 ‘시중들다’로 옮겼습니다. μακάριοι는 관용적 성경 표현인 ‘복이 있습니다’로 유지했습니다.
  issues:
  - severity: medium
    issue: 현대 합쇼체와 맞지 않는 고어적 종결 및 어색한 연결
    rationale: ‘내가 진실로 너희에게 이르노니’와 ‘보게 되는’은 현대 표준어 합쇼체의 자연스러운 문장 흐름에서 벗어납니다.
  - severity: low
    issue: 식사 때 기대어 앉는 의미가 충분히 드러나지 않음
    rationale: ἀνακλινεῖ는 단순히 자리에 앉히는 것보다 식탁에서 기대어 앉게 하는 행위를 가리킵니다. 본문과 문화 주석으로 이를 보존했습니다.
  revised_text: 「주인이 와서 깨어 있는 것을 발견할 그 종들은 복이 있습니다. 내가 진실로 너희에게 말합니다. 주인이 친히 허리에 띠를 두르고[a] 그들을 식탁에 기대어 앉게 한 뒤, 다가가 그들을 시중들 것입니다.」
  revised_footnotes:
