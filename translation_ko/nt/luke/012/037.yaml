review_pass:
  verdict: revise
  source_fidelity: The draft conveys the overall reversal in the parable, but “곁에 와서” narrows παρελθών to standing beside them, and “시중들 것이다” is less direct than the table-service sense of διακονήσει. The revision renders the sequence as the master girding himself, seating the slaves for a meal, then coming to serve them.
  naturalness: The draft’s declarative endings (“복이 있다,” “것이다”) do not consistently meet the requested modern formal-polite 합쇼체. The revision uses natural formal-polite Korean and replaces the somewhat awkward “깨어 있는 것을 보게 되는” with a smoother future relative clause.
  terminology: “주인” is appropriate for κύριος within this household parable and does not force a theological title beyond the immediate context. “종” is idiomatic Korean for δοῦλοι in this setting but can be broader than Greek; a note supplies “노예들” as the lexical sense. “허리에 띠를 두르다” preserves the service-preparation image of περιζώσεται.
  issues:
  - severity: medium
    issue: Register is not consistently modern formal-polite (합쇼체).
    rationale: The requested target register requires polite declarative forms; the draft instead uses plain-style endings.
  - severity: low
    issue: “곁에 와서” unnecessarily specifies the master’s position.
    rationale: παρελθών conveys moving/coming in order to serve; it does not specifically mean coming to stand beside them.
  - severity: low
    issue: The service-preparation and meal imagery can be represented more precisely.
    rationale: “허리에 띠를 두르고” retains the girding image, and “식탁에 앉게 한 뒤 ... 섬길 것입니다” clearly expresses the ensuing table service.
  revised_text: 「주인이 와서 깨어 있는 것을 보게 될 그 종들은 복이 있습니다. 내가 진실로 너희에게 말합니다. 주인이 허리에 띠를 두르고 그들을 식탁에 앉게 한 뒤, 다가와 그들을 섬길 것입니다.」
  revised_footnotes:
  - marker: a
    text: ‘종들’에 해당하는 그리스어는 δοῦλοι이며, 이 비유의 가정 관계에서는 ‘노예들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision corrects the required speech register, retains the household-parable sense of “주인,” preserves the Greek image of girding oneself for service, and renders the final service action without adding a spatial detail not specified by the source. A lexical note preserves the bonded-status force of δοῦλοι without making the main Korean line needlessly unnatural.
