    text: 직역하면 ‘자신을 띠로 두를 것이다.’ 활동하거나 시중들기 위해 옷자락을 허리에 묶는 행동을 가리킵니다.
    reason: cultural_note
  revision_rationale: 원문의 미래 시제와 강조 공식(ἀμὴν λέγω ὑμῖν)을 현대 합쇼체로 자연스럽게 반영했습니다. ‘허리에 띠를 두르고’와 ‘식탁에 기대어 앉게’는 고대 식사·봉사 장면의 구체성을 보존하며, 주석은 띠를 두르는 문화적 의미만 간결히 설명합니다.
