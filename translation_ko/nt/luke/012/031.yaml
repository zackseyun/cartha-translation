  source_fidelity: 초안은 βασιλείαν αὐτοῦ를 ‘그의 나라’로 옮긴 점은 원문에 충실합니다. 그러나 ταῦτα에는 ‘모든’이 없으므로 ‘이 모든 것’은 마태복음 병행구절의 표현을 불필요하게 반영합니다. 또한 미래 수동태 προστεθήσεται는 하나님을 명시적 주어로 삼기보다 수동 표현으로 유지하는 편이 원문 형식과 행위자 비명시성을 보존합니다.
  naturalness: ‘구하십시오’와 ‘더해질 것입니다’는 현대 표준어 합쇼체에 자연스럽고, 짧은 권면 문맥에 적합합니다. πλὴν의 대조는 ‘그러나’로 드러냈습니다.
  terminology: ‘나라’는 βασιλεία의 통용되는 번역어이며, ‘그의’는 문맥상 하나님을 가리키되 헬라어 대명사의 표현을 보존합니다. 본문에 없는 ‘모든’을 삭제했습니다.
  issues:
