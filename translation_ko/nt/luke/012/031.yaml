    rationale: SBLGNT 본문은 단지 ‘이것들/이러한 것들’(ταῦτα)이라고 하며, ‘모든’에 해당하는 단어가 없습니다.
  - severity: low
    issue: ‘더하여 주실 것이다’가 수동태를 능동태 및 명시적 행위자로 바꿉니다.
    rationale: 문맥상 하나님이 공급하심은 분명하지만, προστεθήσεται는 미래 수동태이므로 ‘더해질 것입니다’가 문법적 형태와 표현상의 비명시성을 더 잘 보존합니다.
