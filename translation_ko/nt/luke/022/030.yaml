  - severity: low
    issue: ‘내 식탁에 앉아’가 원문에 없는 ‘앉아’ 동작을 식사 장면에 덧붙입니다.
    rationale: ἐπὶ τῆς τραπέζης μου는 여기서 ‘내 식탁에서/내 식탁에’라는 식탁 교제를 나타냅니다. ‘내 식탁에서 먹고 마시며’가 더 직접적입니다.
  revised_text: 이는 여러분이 내 나라에서 내 식탁에서 먹고 마시며, 보좌들에 앉아 이스라엘의 열두 지파를 심판하게 하려는 것입니다[a].
