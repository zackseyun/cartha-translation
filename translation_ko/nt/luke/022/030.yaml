  source_fidelity: 초안은 식사와 음료, 나라, 보좌, 이스라엘의 열두 지파라는 핵심 요소를 보존합니다. 그러나 κρίνω를 ‘다스리다’로만 옮기면 원문의 직접적인 ‘심판하다/판단하다’ 의미와, 통치의 뉘앙스를 함께 지닌 모호성이 좁아집니다. 또한 원문에는 ‘식탁에 앉아’라는 별도의 동작이 명시되지는 않습니다.
  naturalness: ‘내 나라에서 내 식탁에서 먹고 마시며’와 ‘보좌들에 앉아’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. 절의 의존적인 목적 표현은 ‘이는 … 하려는 것입니다’로 유지할 수 있습니다.
  terminology: βασιλεία는 ‘나라’, θρόνοι는 ‘보좌들’, φυλαί는 ‘지파들’로 옮기는 것이 적절합니다. κρίνω는 본문에서 ‘심판하다’로 옮기고, 통치적 의미 가능성은 각주로 남기는 것이 원문의 긴장을 보존합니다.
  issues:
