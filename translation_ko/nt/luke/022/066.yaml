  source_fidelity: ‘날이 되자’는 ὡς ἐγένετο ἡμέρα의 새벽/날이 밝음이라는 관용적 시간 표현을 충분히 살리지 못합니다. 또한 ‘끌고 갔습니다’는 ἀπήγαγον보다 강한 강제성을 암시할 수 있으므로 ‘데리고 갔습니다’가 더 중립적입니다. πρεσβυτέριον과 συνέδριον의 구별은 ‘장로회’와 음역어 ‘산헤드린’으로 유지할 수 있습니다.
  naturalness: ‘날이 밝자’와 ‘백성의 장로회, 곧 대제사장들과 율법학자들이’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 구성 관계도 명료하게 드러냅니다. 원안의 대시 앞뒤 띄어쓰기 및 조사 분리는 한국어 문장부호·띄어쓰기 관행에 맞지 않습니다.
  terminology: ‘대제사장들’, ‘율법학자들’, ‘산헤드린’은 통용되는 성서 한국어 용어입니다. ‘장로회’는 πρεσβυτέριον의 집합적·제도적 뜻을 적절히 나타냅니다. συνέδριον의 의미 범위는 각주에서 ‘의회’ 및 ‘의회 앞에’라는 대안을 밝혀 보존합니다.
