  verdict: revise
  source_fidelity: The draft accurately renders the speaker, the addressees, and the emphatic negation (οὐ μή) as “결코 … 않을 것입니다.” However, “물어도” is concessive (“even if I ask”), whereas ἐὰν with the aorist subjunctive introduces an ordinary future-oriented condition, “if I ask.” The adversative δέ is also not represented.
  naturalness: “여러분은 결코 대답하지 않을 것입니다” is natural modern formal-polite Korean. Recasting the protasis as “물으면” is both natural and more precise.
  terminology: No specialized theological terminology occurs. “대답하다” is an appropriate rendering of ἀποκρίνομαι in this dialogue.
  issues:
  - severity: medium
    issue: The conditional clause is rendered concessively.
    rationale: “만일 내가 물어도” means “even if I ask,” while ἐὰν … ἐρωτήσω means “if I ask.” “내가 물으면” preserves the source construction without adding concessive force.
  - severity: low
    issue: The contrastive connective δέ is omitted.
    rationale: In context δέ is adversative and is suitably represented by “그러나.”
  revised_text: 그러나 내가 물으면, 여러분은 결코 대답하지 않을 것입니다.
