  source_fidelity: 첫 질문의 πάντες, οὖν, ‘하나님의 아들’은 대체로 반영되었으나, 예수님의 응답 ‘여러분이 내가 그라고 말합니다’는 한국어 문법상 부자연스럽고 ‘그’의 지시 대상도 불명확합니다. Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι의 강조와 간접적 긍정의 여지는 유지해야 합니다.
  naturalness: ‘그들 모두가 말했습니다’보다 ‘그들이 모두 말했습니다’가 현대 표준어 성경 문체에서 자연스럽습니다. 질문의 ‘당신이’는 예수님께 직접 말하는 문맥에서 ‘당신이 …이십니까’로 높임을 갖추는 것이 적절합니다. 응답은 ‘여러분이 내가 그렇다고 말합니다’로 옮기면 문법적으로 자연스럽고, 앞선 질문의 술어를 받습니다.
  terminology: ‘하나님의 아들’은 ὁ υἱὸς τοῦ θεοῦ에 대한 확립되고 적절한 번역입니다. ‘그분’ 및 ‘말씀하셨습니다’도 합쇼체 서술과 예수님을 가리키는 존중 표현으로 적절합니다.
  issues:
