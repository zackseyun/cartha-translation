  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “You say so” or “It is as you say.” Jesus' wording is an affirmative reply, but the Greek is more literally, “You yourselves say that I am.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 그들이 모두 말했습니다. 「그렇다면 당신이 하나님의 아들이십니까?」 그분께서 그들에게 말씀하셨습니다. 「여러분이 내가 그렇다고 말합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “여러분이 내가 그렇다고 말합니다.” 또는 더 관용적으로, “여러분이 그렇게 말합니다” 또는 “당신들이 말한 대로입니다.” 예수님의 말씀은 문맥상 긍정의 답변이지만, 헬라어 표현은 상대방에게 그 진술을 돌려 말하는 형태입니다.
    reason: alternative_reading
