  to: 그분께서 아직 말씀하고 계실 때에, 보십시오, 한 무리가 왔습니다. 열둘 가운데 하나인 유다라고 불리는 자가 그들보다 앞서 가고 있었고, 예수께 입맞추려고 그분께 가까이 갔습니다.
  rationale: 'The revision preserves all source-level information and the narrative attention marker ἰδού, while using natural modern formal Korean. It avoids introducing interpretive language about betrayal or formal leadership. No footnote is required: ''그들보다 앞서 가다'' gives the primary contextual sense of προήρχετο, and the alternative leadership nuance need not be elevated in this brief verse.'
