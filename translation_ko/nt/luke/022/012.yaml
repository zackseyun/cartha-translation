  source_fidelity: κἀκεῖνος은 앞 절의 집주인을 이어 가리키므로 '그러면'보다 접속 의미를 살린 '그러면 그가' 또는 '그리고 그가'가 가능하나, 문맥상 '그러면'은 조건·결과를 암시하여 부정확합니다. ἐστρωμένον은 단순히 '잘 차려진'보다 방 안의 자리나 비품이 마련된 상태를 뜻하므로 '잘 마련된'이 더 안전합니다. ἑτοιμάσατε는 복수 명령이므로 합쇼체에서 '준비하십시오'로 적절합니다.
  naturalness: '''거기에 준비하십시오''는 현대 한국어에서 목적어가 생략되어 다소 어색합니다. ''거기에서 준비하십시오''가 자연스럽고 원문의 장소 지시를 보존합니다. 또한 본문 끝의 닫는 인용부호(」)는 짝이 없어 삭제해야 합니다.'
  terminology: '''다락방''은 ἀνάγαιον의 통상적이고 자연스러운 번역입니다. ''잘 마련된''은 식사 자리가 갖추어진 상태를 넓게 전달하며, 특정 비품을 과도하게 단정하지 않습니다.'
