  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
  footnotes:
  - marker: a
    text: Or, more formally, 'the one reclining' / 'in your midst.' The Greek reflects banquet custom, where diners reclined while attendants served.
    reason: cultural_note
translation:
  language: ko
  text: 누가 더 높은 사람입니까? 식탁에 기대어 앉아 있는 사람입니까, 섬기는 이입니까? 식탁에 기대어 앉아 있는 사람이 아닙니까? 그러나 나는 여러분 가운데 섬기는 이로 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여러분 가운데에 있습니다.’ ‘식탁에 기대어 앉아 있는 사람’은 당시 연회에서 손님들이 비스듬히 기대어 식사하던 관습을 가리킵니다.
    reason: 문화적 배경과 ἐν μέσῳ ὑμῶν의 표현을 보충하여 ἀνακείμενος의 의미를 명확히 합니다.
