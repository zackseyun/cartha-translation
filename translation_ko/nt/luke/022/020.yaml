  text: 또한 저녁 식사 후에 잔도 이와 같이 드시고 말씀하셨습니다. 「이 잔은 여러분을 위하여 흘려지는 내 피로 맺는 새 언약입니다.[a][b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 피로 맺는 새 유언’.
    reason: alternative_reading
  - marker: b
    text: 그리스어에서 ‘여러분을 위하여 흘려지는’은 절 전체 뒤에 놓여 있습니다. 문맥상 이는 잔 자체보다 예수님의 피가 흘려짐을 가리키는 것으로 이해하는 것이 가장 자연스럽습니다.
