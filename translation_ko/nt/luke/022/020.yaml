  - marker: a
    text: Or 'the new testament in my blood.'
    reason: alternative_reading
  - marker: b
    text: The Greek wording places 'which is poured out for you' after the whole clause; the sense is most naturally that Jesus' blood is poured out for them.
    reason: lexical_alternative
translation:
