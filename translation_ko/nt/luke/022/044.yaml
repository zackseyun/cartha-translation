  to: 그리고 그분께서는 고뇌에 빠지셔서 더욱 간절히 기도하셨습니다. 그분의 땀이 땅에 떨어지는 피방울들처럼 되었습니다.[a]
  rationale: 수정은 ἀγωνία의 강한 정서적 의미를 ‘고뇌’로 반영하고, ἐκτενέστερον의 비교급을 ‘더욱 간절히’로 유지했습니다. 또한 ‘땀이 피가 되었다’고 단정하지 않고, ὡσεὶ가 표지하는 비교를 ‘피방울들처럼’으로 명확히 보존했습니다. 본문비평 주석은 SBLGNT의 대괄호 처리와 사본 간 전승 차이를 정확하고 비단정적으로 설명하도록 정비했습니다.
