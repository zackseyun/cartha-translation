review_pass:
  verdict: revise
  source_fidelity: 원문의 미완료 과거(ἐζήτουν, ἐφοβοῦντο)가 나타내는 지속적 상황은 초안의 ‘모색하고 있었습니다’, ‘두려워했기 때문입니다’로 대체로 전달됩니다. 다만 τὸ πῶς ἀνέλωσιν은 단순히 ‘어떻게 죽일까’보다 ‘어떻게 죽일 수 있을지를/그 방법을’ 찾는다는 뜻이 더 분명하며, γραμματεῖς는 본문 번역에서는 전통적이고 직접적인 ‘서기관들’이 적절합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체를 유지합니다. 그러나 ‘어떻게 그분을 죽일까 모색하고’는 목적 내용과 동사 결합이 다소 압축되어 있습니다. ‘어떻게 그분을 죽일 수 있을지를 찾고 있었습니다’가 현대 표준어에서 더 자연스럽고 원문의 탐색 의미도 명료하게 드러냅니다.
  terminology: ἀρχιερεῖς는 ‘대제사장들’로 적절합니다. γραμματεῖς의 ‘율법학자들’은 가능한 해석적 표현이지만, 원문의 직역성과 복음서 서술의 통상 용례를 위해 ‘서기관들’로 고칩니다. λαός는 집회로 한정하지 않고 ‘백성’을 유지합니다.
  issues:
  - severity: medium
    issue: γραμματεῖς를 ‘율법학자들’로 번역함
    rationale: 율법 관련 전문가라는 의미를 전달하지만 원문보다 해석을 보태는 표현입니다. 복음서 문맥에서 널리 정착되어 있고 더 직접적인 대응인 ‘서기관들’이 적절합니다.
  - severity: low
    issue: τὸ πῶς ἀνέλωσιν의 방법 탐색 의미가 다소 압축됨
    rationale: ‘어떻게 그분을 죽일까 모색하고’도 의미상 가능하지만, ‘어떻게 … 죽일 수 있을지를 찾고’는 그들이 실행 방법을 계속 찾았다는 원문의 뉘앙스를 더 명확히 보존합니다.
  revised_text: 그리고 대제사장들과 서기관들은 어떻게 그분을 죽일 수 있을지를 찾고 있었습니다. 그들은 백성을 두려워하고 있었기 때문입니다.
