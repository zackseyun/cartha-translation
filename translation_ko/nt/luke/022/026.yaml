  source_fidelity: 초안은 대조 구조, γινέσθω의 명령, 비교 표현을 대체로 잘 옮겼습니다. 다만 ‘여러분은 그렇지 않습니다’는 문맥상 함축된 금지의 힘을 단순 서술로 약화시킬 수 있고, ἡγούμενος를 ‘다스리는 자’로 옮기면 여기서의 공동체적 인도 의미보다 통치의 뉘앙스가 강해집니다.
  naturalness: ‘그래서는 안 됩니다’, ‘오히려’, ‘어린 사람처럼’, ‘이끄는 사람’은 현대 표준어 합쇼체에서 자연스럽고, 비교 대상의 사회적 위상도 문맥상 명료합니다.
  terminology: μείζων은 ‘큰 사람’으로 유지하여 비교급과 지위의 의미를 살렸습니다. νεώτερος는 단순 연령보다 사회적으로 아래인 사람을 가리킬 수 있으므로 주석으로 보완했습니다. διακονῶν은 제도적 직분어를 피하여 ‘섬기는 사람’으로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘여러분은 그렇지 않습니다’가 금지의 함축을 충분히 드러내지 못함
    rationale: οὐχ οὕτως는 앞 절의 행태를 제자들에게 강하게 대조하여 배제하는 타원적 표현입니다. 한국어에서는 ‘그래서는 안 됩니다’가 문맥상 명령적 힘을 더 정확히 전달합니다.
  - severity: low
    issue: ‘다스리는 자’의 통치적 뉘앙스
    rationale: ἡγούμενος는 여기서 공동체 안에서 앞장서고 인도하는 사람을 뜻합니다. ‘이끄는 사람’이 불필요하게 강한 지배·통치의 함의를 피합니다.
  - severity: low
    issue: 영어 감사 기록의 문화적 보충 주석이 한국어 본문에 반영되지 않음
    rationale: ‘더 어린 사람’은 나이만이 아니라 당시의 사회적 선후·낮은 지위를 가리킬 수 있으므로 해당 지점에 주석을 두는 것이 적절합니다.
