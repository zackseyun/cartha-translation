review_pass:
  verdict: revise
  source_fidelity: 초안은 대조와 섬김의 역전을 대체로 충실히 전달합니다. 그러나 ἡγούμενος는 여기서 ‘다스리는 자’보다 ‘이끄는 사람/지도하는 사람’에 가깝고, 전자는 불필요하게 강한 통치 뉘앙스를 더합니다. 또한 οὐχ οὕτως의 문맥상 금지적 힘을 한국어에서 분명히 하는 편이 적절합니다.
  naturalness: ‘그렇게 해서는 안 됩니다’, ‘오히려’, ‘이끄는 사람’, ‘섬기는 사람’은 현대 표준어 합쇼체에서 자연스럽고 본문의 권면 어조를 유지합니다. ‘더 어린 사람’은 비교급을 보존하며, 사회적 낮은 지위라는 함의는 각주로 보완합니다.
  terminology: ‘이끄는 사람’은 ὁ ἡγούμενος의 참여자적 표현과 문맥상의 공동체 리더십을 잘 반영합니다. ‘섬기는 사람’은 ὁ διακονῶν의 능동적 봉사 의미를 유지합니다. ‘더 큰 사람’은 μείζων의 비교급을 유지하되, 신체적 크기보다 지위의 비교를 뜻하는 문맥을 따릅니다.
  issues:
  - severity: medium
    issue: ‘다스리는 자’
    rationale: ὁ ἡγούμενος는 ‘지도자/이끄는 사람’을 뜻하며, ‘다스리다’는 본문이 요구하지 않는 강한 지배·통치의 뉘앙스를 부가할 수 있습니다.
  - severity: low
    issue: ‘여러분은 그렇지 않습니다’
    rationale: 문법적으로 가능한 직역적 표현이지만, 앞절의 행동 양식과 대비되는 οὐχ οὕτως의 금지적·권면적 힘은 ‘그렇게 해서는 안 됩니다’가 더 명확히 전달합니다.
  revised_text: 그러나 여러분은 그렇게 해서는 안 됩니다[a]. 오히려 여러분 가운데 더 큰 사람은 더 어린 사람처럼 되고, 이끄는 사람은 섬기는 사람처럼 되십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “그러나 여러분에게는 그렇지 않습니다.” 그리스어 표현은 생략적이며, 바로 앞에서 언급된 지위 추구의 방식과 예수님의 제자들을 강하게 대조합니다.
    reason: alternative_reading
  - marker: b
    text: ‘더 어린 사람’은 단지 나이가 더 어린 사람만이 아니라, 당시 사회에서 더 낮은 지위에 있던 사람을 가리킬 수 있습니다.
    reason: cultural_note
  revision_rationale: 원문의 비교급(‘더 큰’, ‘더 어린’)과 γινέσθω의 ‘되다’라는 명령을 보존했습니다. ἡγούμενος는 과도하게 통치적이지 않은 ‘이끄는 사람’으로 고쳤고, 원문의 생략적 금지 표현과 ‘더 어린 사람’의 사회적 함의는 각주로 제시했습니다.
