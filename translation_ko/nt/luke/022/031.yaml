review_pass:
  verdict: revise
  source_fidelity: 'ὑμᾶς is correctly represented as plural by ‘여러분 모두를,’ and ‘밀처럼’ preserves the comparison. However, ‘여러분 모두를 … 하려고 요구했습니다’ is syntactically and semantically incomplete in Korean: ἐξῃτήσατο conveys Satan''s demand to have/receive them for the stated purpose, not merely a demand directed at them.'
  naturalness: ‘키질하다’ can describe winnowing, but σινιάσαι more specifically denotes sifting through a sieve. ‘체질하다’ is the natural Korean equivalent here. Adding ‘넘겨 달라고’ makes the demand construction idiomatic and explicit.
  terminology: ‘사탄’ is appropriate. ‘시몬, 시몬’ and the formal-polite imperative ‘보십시오’ suitably preserve the direct address and register.
  issues:
  - severity: medium
    issue: The Korean construction with ‘요구했습니다’ lacks the requested party/content.
    rationale: In the draft, Satan appears to ‘demand [all of you] in order to sift,’ which is not natural Korean and leaves the force of ἐξῃτήσατο (‘demanded to have’) underexpressed. ‘넘겨 달라고 요구했습니다’ supplies this without adding a theological interpretation.
  - severity: low
    issue: ‘키질하다’ is less exact than ‘체질하다’ for σινιάζω.
    rationale: The Greek verb refers to sifting, while 키질 commonly evokes winnowing by tossing grain. ‘체질하다’ better retains the stated image.
  revised_text: 시몬, 시몬, 보십시오. 사탄이 여러분 모두를 밀처럼 체질하려고 넘겨 달라고 요구했습니다.
