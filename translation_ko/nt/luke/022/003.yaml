  source_fidelity: 개정안은 εἰσῆλθεν ... εἰς의 강한 표현을 한국어에서 자연스러운 관용으로 유지하며, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα를 ‘열둘 가운데 하나인’으로 충실하게 옮깁니다. 원문에 없는 ‘제자’는 넣지 않았습니다.
  naturalness: 초안의 ‘유다 ― 열두 제자의 수에 속한 자 ― 안으로 들어갔습니다’는 ‘안으로’의 위치와 삽입구 때문에 현대 한국어로 다소 부자연스럽습니다. ‘유다, 곧 열둘 가운데 하나인 유다에게 들어갔습니다’는 합쇼체 문장으로 자연스럽고 의미도 명료합니다.
  terminology: Σατανᾶς는 관용적인 ‘사탄’, Ἰσκαριώτην은 한국어 성경 전통과 현대 표기에 맞는 ‘이스가리옷’으로 표기했습니다. ‘열둘’은 원문의 정관사구가 가리키는 알려진 집단을 보존하되 교파적 해석을 덧붙이지 않습니다.
  issues:
