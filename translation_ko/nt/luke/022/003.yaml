  - severity: low
    issue: ‘열두 제자’의 추가
    rationale: 원문은 ‘열둘’이라고만 하므로, 인정된 집단을 지칭하는 맥락은 보존하되 ‘제자’라는 명사를 보충하지 않는 편이 더 직접적입니다.
  - severity: low
    issue: ‘이스카리옷’ 표기
    rationale: 한국어 성경 및 일반적 성서 한국어 용례에서는 ‘이스가리옷’이 더 확립된 표기입니다.
