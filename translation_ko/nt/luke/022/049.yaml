  naturalness: ‘주여’는 성서적 문체로 가능하나, 현대 표준어 합쇼체의 직접 호칭으로는 ‘주님’이 더 자연스럽습니다. ‘그분 곁에 있던 사람들’은 원문의 οἱ περὶ αὐτὸν을 과도하게 제자들로 한정하지 않으면서 자연스럽습니다.
  terminology: κύριε는 ‘주님’으로, πατάξομεν은 문맥상 무력을 가하는 뜻을 보존하는 ‘칼로 칠까요?’로 옮겼습니다. 영어 감사 기록의 μάχαιρα 관련 어휘 대안은 각주로 보존합니다.
