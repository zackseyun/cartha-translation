  rationale: 임박한 사건이라는 원문의 뉘앙스를 ‘일어나려는 일’로 살리고, 현대 표준어 합쇼체에 맞춰 호칭을 ‘주님’으로 다듬었습니다. 원문이 특정 집단을 명시하지 않는 점을 보존했으며, μάχαιρα의 어휘적 범위를 설명하는 각주 앵커를 추가했습니다.
