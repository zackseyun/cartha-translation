    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그분께서 그들에게 말씀하셨습니다. “내가 고난을 겪기 전에 여러분과 함께 이 유월절[a]을 먹기를 간절히[b] 원했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 유월절’은 여기서 특별히 유월절 식사를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘열망으로 열망했다’입니다. 그리스어는 같은 어근의 명사와 동사를 함께 써서 예수님의 강한 열망을 강조합니다.
    reason: lexical_alternative
