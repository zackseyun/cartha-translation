  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
  footnotes:
  - marker: a
    text: Or, more literally, “With desire I have desired”; the Greek uses an emphatic construction to intensify Jesus’ longing.
    reason: lexical_alternative
  - marker: b
