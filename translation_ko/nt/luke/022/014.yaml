  source_fidelity: 그리스어 ἀνέπεσεν은 식사 자리에서 기대어 눕듯 앉는 고대의 식사 자세를 가리킵니다. 초안의 ‘자리에 비스듬히 앉으셨고’는 자세와 ‘식탁’이라는 식사 맥락을 충분히 드러내지 못합니다. 또한 사도들도 같은 자세로 그분과 함께 있었다는 병렬을 더 분명히 옮기는 것이 좋습니다.
  naturalness: ‘그 시각이 이르렀을 때에’는 ‘시각’과 ‘이르다’ 및 ‘때’가 겹쳐 다소 무겁습니다. ‘그 시각이 되자’가 현대 표준어 문체에서 간결하고 자연스럽습니다. ‘식탁에 기대어 앉다’는 고대 식사 자세를 자연스럽게 전달합니다.
  terminology: ‘사도들’은 οἱ ἀπόστολοι에 적절합니다. 존칭 주어에는 ‘그분께서’를 유지하고, 서술은 합쇼체로 맞추었습니다. 식사 자세의 문화적 의미는 각주로 보완합니다.
