- from: 이는 내가 여러분에게 말합니다. 기록된 이 말씀, 「그가 무법자들 가운데 헤아려졌다」가 내게 이루어져야 하기 때문입니다. 참으로 내게 관한 일이 이루어지고 있습니다.」
  to: 내가 여러분에게 말씀드리는 까닭은, 기록된 이 말씀이 내게 이루어져야 하기 때문입니다. 곧, “그가 무법한 자들과 함께 수에 들었다”는 말씀입니다. 내게 관한 일도 결말에 이르고 있기 때문입니다.[a]
