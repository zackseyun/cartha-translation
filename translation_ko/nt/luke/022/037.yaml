  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
  footnotes:
  - marker: a
    text: Or, more traditionally, “And he was numbered with transgressors” (Isa 53:12).
    reason: alternative_reading
  - marker: b
    text: Or “what concerns me has fulfillment / is coming to completion.”
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러분에게 말씀드리는 까닭은, 기록된 이 말씀이 내게 이루어져야 하기 때문입니다. 곧, “그가 무법한 자들과 함께 수에 들었다”는 말씀입니다. 내게 관한 일도 결말에 이르고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내게 관한 일도 완성에 이르고 있기 때문입니다” 또는 “내게 관한 일도 이루어지고 있기 때문입니다.”
    reason: τέλος ἔχει는 ‘끝/결말에 이르다’와 ‘완성·성취에 이르다’의 의미를 문맥상 함께 가질 수 있으므로, 본문은 전자의 표현을 유지하고 대안을 제시합니다.
