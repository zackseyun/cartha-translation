review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the command to pray and the basic sense of not entering temptation. However, δέ together with the aorist participle γενόμενος is more directly represented by a temporal clause ('when he came/arrived'), rather than the additive '그리고.' The lexical breadth of πειρασμόν should also be retained with an anchored note.
  naturalness: The current Korean is clear and appropriately formal-polite. '그곳에 이르셨을 때' is smoother and more explicit about the Greek temporal relationship. '유혹에 들지 않도록' is an established, natural biblical Korean expression.
  terminology: '''기도하십시오'' properly renders the present imperative in modern 합쇼체. ''유혹'' is a suitable primary rendering for πειρασμόν in context, while a note should preserve the possible senses ''시험'' and ''시련.'''
  issues:
  - severity: low
    issue: The narrative connection is rendered as '그리고' rather than a temporal arrival clause.
    rationale: γενόμενος δὲ ἐπὶ τοῦ τόπου introduces the speech upon Jesus' arrival. '그곳에 이르셨을 때' represents this relation more closely and naturally.
  - severity: medium
    issue: The draft has no anchored note for πειρασμόν.
    rationale: The source term can mean moral temptation or a broader testing/trial. The English audit trail preserves this ambiguity in a footnote; Korean should do likewise without changing the main contextual rendering.
  revised_text: 그분께서 그곳에 이르셨을 때 그들에게 말씀하셨습니다. 「유혹[a]에 들지 않도록 기도하십시오.」
