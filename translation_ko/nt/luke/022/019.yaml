  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Do this in remembrance of me.”
  footnotes:
  - marker: a
    text: 'Some manuscripts omit: ''which is given for you. Do this in remembrance of me.'''
    reason: textual_variant
  - marker: b
    text: Or 'which is being given for you.'
    reason: lexical_alternative
  - marker: c
    text: '''This is my body'' is translated as written; some interpret it as ''This signifies my body,'' but the Greek text itself uses ''is.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 빵을 집어 드시고 감사 기도를 드리신 뒤, 그것을 떼어 그들에게 주시며 말씀하셨습니다. “이것은 여러분을 위해 주어지는[b] 내 몸입니다[c]. 나를 기념하여 이것을 행하십시오.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “여러분을 위해 주어지는 내 몸입니다. 나를 기념하여 이것을 행하십시오”가 없습니다.
    reason: textual_variant
  - marker: b
    text: 또는 “여러분을 위해 주어지고 있는.”
    reason: lexical_alternative
  - marker: c
    text: “이것은 내 몸입니다”는 그리스어 표현을 그대로 옮긴 것입니다. 일부는 이를 “이것은 내 몸을 가리킨다”라고 해석하지만, 그리스어 본문은 “이다”를 사용합니다.
    reason: alternative_reading
