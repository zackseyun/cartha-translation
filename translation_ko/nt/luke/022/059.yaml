- from: 그리고 한 시간쯤 지난 후에 또 다른 사람이 강하게 주장하며 말했습니다. 「참으로 이 사람도 그와 함께 있었다. 게다가 그는 갈릴리 사람이다.」
  to: 그리고 한 시간쯤 지난 뒤에 다른 어떤 사람이 계속 강하게 주장했습니다. “참으로 이 사람도 그와 함께 있었습니다. 그도 갈릴리 사람이기 때문입니다.”
