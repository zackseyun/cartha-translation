- from: 그분께서 말씀하셨습니다. 「아버지, 만일 원하신다면 이 잔을 제게서 거두어 주십시오. 그러나 제 뜻이 아니라 아버지의 뜻이 이루어지기를 원합니다.」
  to: 그분께서 말씀하시기를, 「아버지, 아버지께서 원하신다면 이 잔을 제게서 거두어 주십시오. 그러나 제 뜻이 아니라 아버지의 뜻이 이루어지게 하십시오.」
