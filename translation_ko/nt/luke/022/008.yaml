review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 전달하지만, 초안의 ‘우리가 먹을 유월절’은 ἡμῖν(‘우리를 위하여’)과 ἵνα φάγωμεν(‘우리가 먹도록’)의 목적 관계를 한 표현으로 압축하여 다소 불분명하게 만듭니다. 또한 ‘보내며 말씀하셨습니다’보다 완료된 파송 뒤의 발화를 나타내는 ‘보내어 말씀하셨습니다’가 ἀπέστειλεν … εἰπών에 더 자연스럽고 정확합니다.
  naturalness: ‘그리고’는 문맥 연결상 가능하나, 본절 단독 번역에서는 ‘그분께서’로 시작해도 자연스럽습니다. ‘가서 … 준비하십시오’는 현대 표준어 합쇼체 명령으로 적절합니다.
  terminology: πάσχα는 본문에서 ‘유월절’로 유지하여 유월절 절기, 식사, 또는 관련 요소 사이의 어휘적 폭을 불필요하게 좁히지 않았습니다. 문맥상 식사를 가리킬 가능성은 각주로만 제시합니다. 베드로와 요한은 통용되는 성경 인명 표기입니다.
  issues:
  - severity: medium
    issue: ‘우리가 먹을 유월절’이 ‘우리를 위하여’와 ‘우리가 먹도록’의 구문 관계를 충분히 드러내지 못함
    rationale: 그리스어는 ἡμῖν으로 수혜자를, ἵνα φάγωμεν으로 준비의 목적을 각각 명시합니다. 이를 분리하여 번역하면 의미와 문장 흐름이 더 명료해집니다.
  - severity: low
    issue: ‘보내며 말씀하셨습니다’의 연결 방식
    rationale: εἰπών은 주동사 ‘보냈다’에 수반되는 발화를 나타내므로, 한국어에서는 ‘보내어 말씀하셨습니다’가 사건의 순서와 연결을 더 자연스럽게 표현합니다.
