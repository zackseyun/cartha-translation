  naturalness: ‘그는 떠나 … 함께 의논했습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. ‘성전 경비대 지휘관들’은 문맥상 자연하면서도 στρατηγοί의 지휘·관리 역할을 드러냅니다.
  terminology: ἀρχιερεῖς는 ‘대제사장들’, στρατηγοί는 이 문맥에서 ‘성전 경비대 지휘관들’로 옮깁니다. παραδῷ는 해석적으로 좁은 ‘배반하다’ 대신 ‘넘겨주다’를 유지하고, 대안은 각주로 제시합니다.
