  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
  footnotes:
  - marker: a
    text: Or 'betray him.' The Greek verb can mean 'hand over,' 'deliver over,' or, in this context, 'betray.'
    reason: lexical_alternative
  - marker: b
    text: The 'officers' were likely temple authorities or members of the temple guard, not Roman soldiers.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 떠나 대제사장들과 성전 경비대 지휘관들과 함께, 어떻게 그를 그들에게 넘겨줄지를[a] 의논했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 배반할지를’. 그리스어 동사는 ‘넘겨주다’, ‘내주다’를 뜻할 수 있으며, 이 문맥에서는 ‘배반하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전 경비대 지휘관들’은 로마 군인이 아니라 성전 경비대와 관련된 관리들을 가리키는 것으로 보입니다.
    reason: cultural_note
