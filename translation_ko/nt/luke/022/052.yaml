source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
  footnotes:
  - marker: a
    text: Or 'bandit.' The Greek λῃστής can refer to a robber, brigand, or insurgent-type outlaw; here Jesus contrasts their armed approach with the kind of force used against a dangerous criminal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수께서 자신에게 맞서 온 대제사장들과 성전 경비대장들과 장로들에게 말씀하셨습니다. “여러분은 강도[a]를 잡으러 온 것처럼 칼과 몽둥이를 들고 나왔습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도적’, ‘무장한 산적’. 그리스어 λῃστής는 강도, 산적, 또는 반란에 가담한 무법자를 가리킬 수 있습니다. 여기서는 예수님께서 위험한 범죄자를 체포하듯 무장하여 온 방식을 대조하여 말씀하십니다.
    reason: lexical_alternative
