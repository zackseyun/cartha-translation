  text: 예수께서 그들에게 말씀하셨습니다. “그러나 이제는 돈주머니가 있는 사람은 그것을 가지고 가고, 여행 가방도 마찬가지로 가지고 가십시오. 그리고 없는 사람은 자기 겉옷을 팔아 칼[a]을 사십시오.”
