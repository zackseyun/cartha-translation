source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
  footnotes:
  - marker: a
    text: Or, 'I will never eat it again until it is fulfilled in the kingdom of God.' The Greek emphatically denies a future eating; some translations make the implied 'again' explicit from the context, but it is not stated in the Greek text.
    reason: lexical_alternative
  - marker: b
    text: '''It'' refers to the Passover just mentioned in the previous verse.'
    reason: cross_reference
translation:
  language: ko
  text: 내가 여러분에게 말합니다. 그것이 하나님의 나라에서 이루어질 때까지, 나는 결코 그것을 먹지 않을 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 그것이 하나님의 나라에서 이루어질 때까지 다시는 그것을 먹지 않을 것입니다.” 헬라어는 장차 먹지 않겠다는 것을 강하게 부정합니다. 문맥상 ‘다시는’이라고 번역하기도 하지만, 그 말 자체가 헬라어 본문에 명시되어 있는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것’은 바로 앞 절에서 언급한 유월절을 가리킵니다.
    reason: cross_reference
