review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence of rising from prayer, going to the disciples, and their sleep being caused by sorrow. However, εὗρεν is more specifically ‘found’ than simply ‘saw,’ and the present participle κοιμωμένους is best represented as their ongoing state of being asleep.
  naturalness: The wording is generally natural in modern formal Korean. ‘기도를 마치고 일어나’ is more idiomatic than ‘기도에서 일어나,’ while retaining the sense of rising from prayer. ‘잠들어 있는 것을 발견하셨습니다’ clearly expresses both the ongoing state and εὗρεν.
  terminology: ‘제자들,’ ‘기도,’ and ‘슬픔’ are appropriate standard Gospel terminology. The honorific verbal forms appropriately refer to Jesus without adding interpretive content.
  issues:
  - severity: low
    issue: ‘보셨습니다’ renders εὗρεν less precisely.
    rationale: εὑρίσκω here means that Jesus found the disciples in the stated condition. ‘발견하셨습니다’ retains this observation/finding nuance.
  - severity: low
    issue: ‘잠든 것’ can focus on the completed act of falling asleep.
    rationale: κοιμωμένους is a present participle describing the disciples as being asleep when Jesus found them. ‘잠들어 있는’ represents that state more clearly.
  - severity: low
    issue: ‘기도에서 일어나’ is somewhat less idiomatic Korean.
    rationale: ‘기도를 마치고 일어나’ naturally conveys rising after prayer and does not materially add to the source sense.
  revised_text: 그리고 기도를 마치고 일어나 제자들에게 가셔서, 그들이 슬픔 때문에 잠들어 있는 것을 발견하셨습니다.
