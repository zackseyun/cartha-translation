  source_fidelity: 개정이 필요합니다. 초안의 ‘물어 말했습니다’는 ἐπηρώτων의 미완료 시제가 나타내는 반복·지속성을 충분히 반영하지 못하며, ‘그분의 얼굴을 가리고’는 περικαλύψαντες보다 구체적입니다. 본문은 ‘그분을 가린 뒤’로 원문의 포괄성을 유지하고, 각주에서 눈을 가린다는 가능한 이해를 제시하는 것이 적절합니다.
  naturalness: ‘그분을 가린 뒤, 계속 이렇게 물었습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽고, 조롱의 내용을 직접화법으로 명료하게 연결합니다.
  terminology: ‘예언해 보십시오’는 Προφήτευσον의 명령을, ‘당신을 때린 사람이 누구입니까?’는 ὁ παίσας σε의 관사 있는 분사 표현을 자연스럽게 반영합니다. ‘때리다’는 παίσας에 적절합니다.
