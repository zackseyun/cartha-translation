  source_fidelity: 원문의 δέ는 강한 대조보다 장면의 진행을 나타내므로 ‘그때’가 자연스럽습니다. παιδίσκη τις는 ‘한 여종’으로, καθήμενον πρὸς τὸ φῶς는 ‘불빛 곁에 앉아 있는’으로, ἀτενίσασα는 ‘유심히 바라보며’로 충실히 옮길 수 있습니다. ‘그와 함께 있었습니다’는 σὺν αὐτῷ ἦν의 과거 상황을 적절히 보존합니다.
  naturalness: 초안의 ‘응시하다가’는 앞선 ‘보고’ 및 발화와 시간적 순서를 다소 강하게 만들고, ‘응시’는 현대 한국어에서 약간 날카롭거나 지속적인 시선을 연상시킬 수 있습니다. ‘유심히 바라보며’가 원문의 집중된 시선과 분사 연결을 더 자연스럽게 나타냅니다.
  terminology: ‘여종’은 παιδίσκη의 종속된 봉사자 신분을 불필요하게 완화하지 않으면서 한국어 성경 문체에 자연스럽습니다. ‘불빛 곁에’는 πρὸς τὸ φῶς의 위치 관계를 보존하며, 조명 안에 있었다는 가능한 이해는 각주로 남깁니다.
