  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
  footnotes:
  - marker: a
    text: Or 'looked intently at Peter'; the Greek verb can suggest a fixed or direct gaze.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 주께서 돌아서서 베드로를 바라보셨습니다[a]. 그러자 베드로는 주께서 그에게 “오늘 닭이 울기 전에 네가 나를 세 번 부인할 것이다”라고 말씀하셨던 주님의 말씀을 기억했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “베드로를 똑바로 바라보셨습니다.”
    reason: ἐνέβλεψεν은 단순히 보는 것보다 직접적이거나 유심한 시선을 암시할 수 있습니다.
