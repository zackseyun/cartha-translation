  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
  footnotes:
  - marker: a
    text: Or 'your faithfulness' or 'your trust may not fail.' The Greek word can carry overlapping senses.
    reason: alternative_reading
  - marker: b
    text: Or 'when you have returned' or 'when you have turned again.' The wording suggests restoration after Peter's coming failure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 너를 위해 네 믿음이 꺾이지 않도록 간구했습니다.[a] 그리고 너는 돌이킨 뒤에[b] 네 형제들을 굳세게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 신실함’ 또는 ‘네 신뢰가 꺾이지 않도록.’ 그리스어 낱말은 이러한 뜻들이 겹칠 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘네가 돌아온 뒤에’ 또는 ‘네가 다시 돌이킨 뒤에.’ 이 표현은 베드로가 앞으로 실패한 뒤 회복될 것을 시사합니다.
    reason: lexical_alternative
