  verdict: revise
  source_fidelity: The draft retains the emphatic future negation, the temporal boundary ('until the kingdom of God comes'), and the broad expression for the vine's produce. However, '포도나무 열매에서 마시다' is not idiomatic Korean, and the closing quotation mark is unsupported.
  naturalness: The opening '이는 내가 여러분에게 말합니다 ... 때문입니다' is syntactically awkward and redundantly frames the sentence as both an explanation and a reason. A direct statement is natural in modern formal-polite Korean.
  terminology: '''하나님의 나라'' appropriately renders ἡ βασιλεία τοῦ θεοῦ. ''포도나무에서 난 것'' naturally conveys γενήματος τῆς ἀμπέλου without narrowing it to ''포도주.'''
  issues:
  - severity: medium
    issue: Awkward and redundant causal framing
    rationale: '''이는 ... 때문입니다'' encloses the whole saying awkwardly and does not naturally represent γάρ in Korean discourse.'
  - severity: medium
    issue: Unnatural expression '포도나무 열매에서 마시다'
    rationale: The Greek ἀπὸ marks what is drunk from, but Korean does not normally say one drinks 'from a grapevine fruit.' '포도나무에서 난 것을 마시다' is idiomatic and preserves the source expression's breadth.
  - severity: low
    issue: Unmatched closing quotation mark
    rationale: The final '」' has no corresponding opening mark and should be removed.
  revised_text: 내가 여러분에게 말합니다. 이제부터 하나님의 나라가 올 때까지 나는 포도나무에서 난 것을 결코 마시지 않을 것입니다.[a]
