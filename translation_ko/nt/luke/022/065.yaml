  text: καὶ ἕτερα πολλὰ βλασφημοῦντες ἔλεγον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/065.yaml
  text: And they were saying many other blasphemous things against him[a][b].
  footnotes:
  - marker: a
    text: Or 'many other insulting things' or 'many other abusive things.' The Greek participle can denote reviling speech more broadly, though 'blasphemous' best preserves its full force here.
    reason: lexical_alternative
  - marker: b
    text: Or 'to him.' The Greek preposition can be rendered more literally, but in this context 'against him' better conveys hostile speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그분을 향해 다른 많은 모독적인 말도 계속해서 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다른 많은 모욕적인 말” 또는 “다른 많은 악담.” 그리스어 분사는 더 넓게 욕하거나 헐뜯는 말을 가리킬 수도 있지만, 여기서는 “모독적인”이 그 강한 의미를 잘 보존합니다.
    reason: βλασφημοῦντες의 어휘적 대안
  - marker: b
    text: 또는 “그분께.” 그리스어 전치사는 더 문자적으로 이렇게 옮길 수 있으나, 이 문맥에서는 적대적인 발화이므로 “그분을 향해”가 더 잘 드러냅니다.
    reason: εἰς αὐτόν의 전치사적 대안
