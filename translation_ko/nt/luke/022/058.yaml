translation:
  language: ko
  text: 그리고 잠시 후, 다른 사람이 그를 보고 말했습니다. “당신도 그들 중 한 사람입니다.” 그러나 베드로가 말했습니다. “이 사람아, 저는 아닙니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 “저는 아닙니다”라고만 하며, “그들 중 한 사람이”라는 말은 앞선 고발에서 함축됩니다.
    reason: 원문의 οὐκ εἰμί가 목적어·보어를 생략한 짧은 부인임을 드러냅니다.
