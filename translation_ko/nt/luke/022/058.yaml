revisions:
- from: 그리고 잠시 후에 다른 사람이 그를 보고 말했습니다. 「당신도 그들 중 하나요.」 그러나 베드로가 말했습니다. 「이 사람아, 저는 아닙니다.」
  to: 그리고 잠시 후, 다른 사람이 그를 보고 말했습니다. “당신도 그들 중 한 사람입니다.” 그러나 베드로가 말했습니다. “이 사람아, 저는 아닙니다.”[a]
  rationale: 집단 구성원을 뜻하는 표현과 평서형 고발을 바로잡고, 직접 인용의 문장부호를 자연스럽게 다듬었습니다. 베드로의 생략된 부인은 본문에서 유지하고 각주로 설명했습니다.
