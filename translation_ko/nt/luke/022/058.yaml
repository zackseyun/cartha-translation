  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
  footnotes:
  - marker: a
    text: Or, more explicitly, “I am not one of them.” The Greek simply says, “I am not,” leaving the object implied from the previous accusation.
