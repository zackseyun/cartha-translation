review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그들 중 하나요’는 사람들의 집단을 가리키는 원문의 ἐξ αὐτῶν εἶ를 한국어에서 부자연스럽고 부정확하게 표현합니다. ‘그들 중 한 사람입니다’가 집단 소속이라는 고발의 뜻을 정확히 전달합니다. 베드로의 ‘저는 아닙니다’는 원문의 의도적인 생략을 잘 보존합니다.
  naturalness: 현 초안은 인용문 앞의 마침표와 ‘하나요’가 어색합니다. 서술문으로 된 원문의 고발은 ‘한 사람입니다’로 옮기는 것이 자연스럽습니다. ‘잠시 후’와 ‘이 사람아’는 짧고 방어적인 대화의 어조를 유지합니다.
  terminology: ‘베드로’는 통용되는 고유명이며 적절합니다. ‘이 사람아’는 Ἄνθρωπε의 직접 호격을 보존합니다. 다소 거친 호격이지만 베드로의 단호한 부인이라는 문맥에 맞으며, ‘선생님’ 등으로 완화하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘당신도 그들 중 하나요’
    rationale: ‘하나’는 사람 집단의 구성원을 가리킬 때 부자연스럽고, 의문형은 원문의 평서형 고발(‘너도 그들 중 하나다’)을 바꿉니다. ‘당신도 그들 중 한 사람입니다’로 고쳐야 합니다.
  - severity: low
    issue: 인용문을 도입하는 ‘말했습니다.’ 뒤의 마침표
    rationale: 한국어 직접 인용문은 보통 콜론 또는 쉼표로 이어야 합니다. 마침표 뒤에 인용문을 독립시키는 방식은 이 문맥에서 매끄럽지 않습니다.
  revised_text: 그리고 잠시 후, 다른 사람이 그를 보고 말했습니다. “당신도 그들 중 한 사람입니다.” 그러나 베드로가 말했습니다. “이 사람아, 저는 아닙니다.”[a]
