  source_fidelity: The draft correctly conveys the arrest, Peter’s ongoing following, and the distance. However, «대제사장의 집으로» does not explicitly express εἰσήγαγον, which denotes bringing Jesus into the house/interior.
  naturalness: The draft is fluent modern formal-polite Korean. «멀찍이 따라가고 있었습니다» naturally renders the imperfect ἠκολούθει and μακρόθεν.
  terminology: «대제사장» and «베드로» are standard and appropriate. «그분» maintains respectful Korean biblical register without adding interpretation.
  issues:
  - severity: medium
    issue: The directional force of εἰσήγαγον is underrepresented.
    rationale: The Greek states that they brought Jesus into (εἰς) the high priest’s house, whereas «집으로 데려갔습니다» can mean only that they took him to the house. Adding «안으로» preserves the specified entry.
