id: LUK.8.6
reference: Luke 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
  footnotes:
  - marker: a
    text: Or 'upon the rock.' The Greek has the singular 'rock,' preserving the image of seed landing on a rocky surface rather than using the broader phrase 'rocky ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 다른 씨는 바위 위에 떨어졌습니다. 싹이 난 뒤에 말라 버렸는데, 수분이 없었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 πέτρα는 단수 ‘바위’입니다. 넓은 의미의 ‘바위땅’보다, 씨가 떨어진 구체적인 바위 표면의 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  english_pob_choice: another
  chosen_korean: 또 다른
  alternatives_korean:
  - 다른
  - 또 하나의
  lexicon: BDAG
  rationale: 씨 뿌리기 연속 장면에서 다음 항목을 가리키므로, 단순한 ‘다른’보다 ‘또 다른’이 서술 흐름을 자연스럽게 살립니다.
- source_word: ἐπὶ τὴν πέτραν
  english_pob_choice: on the rock
  chosen_korean: 바위 위에
  alternatives_korean:
  - 바위에
  - 돌 위에
  - 바위땅에
  lexicon: BDAG
  rationale: πέτρα는 단수 ‘바위’이므로 ‘바위 위에’로 옮겨, 영어 POB가 유지한 ‘the rock’의 구체성과 이미지성을 살렸습니다.
- source_word: φυὲν
  english_pob_choice: after it sprang up
  chosen_korean: 싹이 난 뒤에
  alternatives_korean:
  - 돋아난 뒤에
  - 자라난 뒤에
  - 발아한 뒤에
  lexicon: BDAG
  rationale: 씨앗 비유의 식물 발아 단계를 한국어로 자연스럽게 드러내기 위해 시간적 순서를 나타내는 ‘뒤에’를 사용했습니다.
- source_word: ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα
  english_pob_choice: it withered because it had no moisture
  chosen_korean: 말라 버렸는데, 수분이 없었기 때문입니다
  alternatives_korean:
  - 말라 버렸는데, 습기가 없었기 때문입니다
  - 말라 죽었는데, 수분이 없었기 때문입니다
  lexicon: BDAG
  rationale: ἐξηράνθη의 결과를 식물의 상태 변화로 자연스럽게 표현해 ‘말라 버렸는데’로 옮겼고, ἰκμάς는 성장에 필요한 ‘moisture’에 해당하므로 ‘수분’이 가장 정확합니다.
theological_decisions:
- issue: 돌/바위 이미지의 구체성 유지
  chosen_reading: ‘바위’로 직역해 ‘바위 위에’라고 하여 넓은 ‘돌밭’이나 ‘바위땅’으로 일반화하지 않았습니다.
  alternative_readings:
  - ‘돌밭에’
  - ‘바위땅에’
  rationale: 본문은 단수 πέτρα를 사용하므로, 씨가 떨어진 위치의 구체적인 이미지를 보존하는 것이 비유의 힘을 더 정확히 전달합니다.
  doctrine_reference: 본문 주해/비유의 표상 보존
- issue: 수분 부재의 원인 설명
  chosen_reading: ‘수분이 없었기 때문입니다’로 원인절을 분명히 해, 마름이 단순한 우연이 아니라 결핍의 결과임을 드러냈습니다.
  alternative_readings:
  - ‘습기가 없었기 때문입니다’
  - ‘물기가 없었기 때문입니다’
  rationale: διὰ τὸ μὴ ἔχειν은 명시적 이유 제시이므로, 한국어도 원인-결과를 분명히 살리는 편이 본문의 논리를 잘 반영합니다.
  doctrine_reference: 본문의 인과 구조
