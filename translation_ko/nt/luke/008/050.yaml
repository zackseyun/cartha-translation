id: LUK.8.50
reference: Luke 8:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
  footnotes:
  - marker: a
    text: Or 'only have faith' or 'only trust.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she will be healed' or 'she will be made well.' The Greek verb can mean save, rescue, or heal, and in this context includes restoration from the brink of death.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그 말을 들으시고 그에게 대답하셨습니다. “두려워하지 마십시오[a]. 다만 믿으십시오[b]. 그러면 그 아이는 구원받을 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워하지 말고’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘믿음을 가지십시오’ 또는 ‘신뢰하십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘낫게 될 것입니다’ 또는 ‘온전하게 될 것입니다’로 옮길 수 있습니다. 그리스어 동사는 구원하다, 구출하다, 낫게 하다를 뜻할 수 있으며, 여기서는 죽음의 위기에서 회복되는 의미를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  english_pob_choice: hearing this
  chosen_korean: 그것을 들으시고
  alternatives_korean:
  - 그 말을 들으시고
  - 들으신 뒤
  lexicon: BDAG
  rationale: 문맥상 앞선 소식을 가리키는 것으로 보이므로, 지시대명사를 보충해 자연스러운 한국어로 옮겼습니다.
- source_word: Μὴ φοβοῦ
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 말고
  alternatives_korean:
  - 두려워하지 마십시오
  - 무서워하지 말고
  lexicon: BDAG
  rationale: 금지 명령의 긴박함을 살리면서도 현대 한국어에서 자연스러운 합쇼체로 표현했습니다.
- source_word: πίστευσον
  english_pob_choice: believe
  chosen_korean: 믿으십시오
  alternatives_korean:
  - 믿으세요
  - 믿음을 가지십시오
  - 신뢰하십시오
  lexicon: BDAG
  rationale: πιστεύω의 동사형은 여기서 단순 인지보다 의탁의 뉘앙스를 포함하므로, 명령형으로 직접 옮기되 본문의 응답성을 살렸습니다.
- source_word: σωθήσεται
  english_pob_choice: she will be saved
  chosen_korean: 살게 될 것입니다
  alternatives_korean:
  - 구원받을 것입니다
  - 낫게 될 것입니다
  - 온전해질 것입니다
  lexicon: BDAG
  rationale: 이 문맥에서는 죽음의 위기에서의 회복을 가리키므로, σῴζω의 의미를 살리면서도 한국어 독자가 즉시 이해할 수 있게 '살게 될 것입니다'로 옮겼습니다.
theological_decisions:
- issue: σῴζω의 의미 범위와 이 문맥의 구체성
  chosen_reading: 이 구절은 단순한 '치유'보다 죽음의 위기에서의 생명 회복을 포함하는 '살게 됨'으로 번역했습니다.
  alternative_readings:
  - 낫게 될 것입니다
  - 구원받을 것입니다
  rationale: 영문 POB가 'saved'를 유지하면서도 주석으로 'healed/made well' 가능성을 남긴 점을 따라, 한국어 본문도 의미를 좁혀 버리지 않되 문맥상 생명 회복의 긴장을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #3 and #5'
- issue: πιστεύω의 명령형 톤
  chosen_reading: '''믿으십시오''로 옮겨 단순한 동의가 아니라 예수의 권위 있는 요청으로 들리게 했습니다.'
  alternative_readings:
  - 믿으세요
  - 믿음을 가지십시오
  - 신뢰하십시오
  rationale: 본문의 명령은 위로와 요구를 함께 담고 있으므로, 합쇼체를 유지하면서도 한국어에서 과도하게 부드러워지지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for πίστις; Translation philosophy #3'
