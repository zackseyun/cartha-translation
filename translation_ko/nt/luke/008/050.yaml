  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 σωθήσεται를 ‘살게 될 것입니다’로만 옮기면 σῴζω의 ‘구원하다/구출하다/낫게 하다’라는 의도적 의미 범위가 본문에서 지나치게 좁아집니다. 본문에는 ‘구원받을 것입니다’를 두고, 문맥상 회복·치유의 뜻은 주석으로 보존하는 편이 원문과 영어 POB의 번역 방침에 더 가깝습니다.
  naturalness: ‘그녀’는 현대 한국어 성경 문맥에서 다소 번역투로 들릴 수 있으므로, 야이로의 딸을 가리키는 자연스러운 표현인 ‘그 아이’가 적절합니다. 또한 두 명령은 ‘두려워하지 마십시오. 다만 믿으십시오.’처럼 각각 독립 문장으로 처리하는 것이 그리스어의 명령과 결과 진술의 관계를 더 분명히 드러냅니다.
  terminology: πιστεύω는 ‘믿으십시오’가 적절합니다. σωθήσεται는 문맥상 생명의 회복을 가리키지만, ‘구원받을 것입니다’로 번역하여 σῴζω의 폭넓은 의미를 유지하고 ‘낫게 될 것입니다/온전하게 될 것입니다’ 등의 문맥적 가능성을 주석으로 제시합니다.
