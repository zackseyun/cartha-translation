id: LUK.8.51
reference: Luke 8:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
  footnotes:
  - marker: a
    text: Or 'the child's father and mother.' The Greek word can mean 'child' more generally, but the context identifies the child as a girl.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 집에 들어가셔서, 베드로와 요한과 야고보와 그 아이의 아버지와 어머니 외에는 자기와 함께 아무도 들어오지 못하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παῖς는 문맥에 따라 ‘아이’, ‘아들/딸’, ‘종’까지 가리킬 수 있습니다. 여기서는 바로 앞의 문맥이 야이로의 딸을 가리키므로, 본문에서는 ‘그 아이’로 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν ... εἰς τὴν οἰκίαν
  english_pob_choice: When he came into the house
  chosen_korean: 그는 집에 들어가셔서
  alternatives_korean:
  - 그가 집에 오셔서
  - 그가 집 안으로 들어가셔서
  lexicon: BDAG
  rationale: aorist participle의 시간 흐름을 자연스러운 한국어로 풀어, 집에 ‘들어가신’ 동작을 앞세우기보다 사건 진행 속의 동시·선행 뉘앙스를 살렸습니다.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν τινα σὺν αὐτῷ
  english_pob_choice: he did not allow anyone to enter with him
  chosen_korean: 자기와 함께 아무도 들어오지 못하게 하셨습니다
  alternatives_korean:
  - 자기와 함께 누구도 들어오게 하지 않으셨습니다
  - 자기와 함께 아무도 들어오도록 허락하지 않으셨습니다
  lexicon: BDAG
  rationale: ἀφίημι의 ‘허락하다/용납하다’ 의미를 한국어의 부정 가능 표현으로 옮겨, ‘allow’의 통제력을 자연스럽게 전달했습니다.
- source_word: εἰ μὴ
  english_pob_choice: except
  chosen_korean: 외에는
  alternatives_korean:
  - 단지
  - 오직
  lexicon: BDAG
  rationale: 부정 뒤의 배제 구조를 한국어의 ‘-외에는’으로 간결하게 대응시켜 예외 범위를 분명히 했습니다.
- source_word: τῆς παιδὸς
  english_pob_choice: the girl's
  chosen_korean: 그 아이의
  alternatives_korean:
  - 그 소녀의
  - 그 어린이의
  - 그 아이의(문맥상 딸)
  lexicon: BDAG
  rationale: παῖς의 기본 범위가 ‘아이/자녀’로 넓기 때문에, 문맥상 여자아이임을 드러내되 원문의 넓은 의미도 해치지 않도록 ‘그 아이’로 옮겼습니다.
theological_decisions:
- issue: παῖς의 성별 특정 여부
  chosen_reading: ‘그 아이의 아버지와 어머니’로 두되, 본문 자체는 ‘아이’라는 일반어를 유지했습니다.
  alternative_readings:
  - ‘그 소녀의 아버지와 어머니’
  - ‘그 딸의 아버지와 어머니’
  rationale: 바로 앞 문맥이 야이로의 딸임을 가리키지만, 여기서의 παῖς는 단어 자체로는 성별이 확정되지 않으므로, 본문에서는 과도한 특정화를 피하고 주석 없이도 이해되도록 했습니다.
  doctrine_reference: 문맥 우선 원칙
- issue: 직설 서술의 존대 처리
  chosen_reading: 서술체는 합쇼체로 유지하되, 예수의 행동은 ‘들어가셔서 / 하셨습니다’로 존대했습니다.
  alternative_readings:
  - ‘들어가서 / 하셨습니다’
  - ‘들어가시고 / 하셨습니다’
  rationale: 복음서 서술의 현대적 공손성을 유지하면서도, 예수에 대한 직접 서술에서 존대 어미를 일관되게 적용했습니다.
  doctrine_reference: Korean style convention
