  source_fidelity: 'The draft reverses the sense of οὐκ ἔλαθεν: ‘자기 일이 드러나지 않았음을 보고’ means that her action had not been revealed, whereas the Greek says that she realized it had not gone unnoticed / could not remain hidden. The remaining narrative elements—trembling, falling before him, public declaration, reason for touching, and immediate healing—are represented accurately.'
  naturalness: The revised wording is natural modern formal-polite Korean and keeps the participial narrative flow without adding interpretive content.
  terminology: ‘치유되었는지’ reflects the passive ἰάθη more directly than ‘나았는지.’ ‘그분 앞에 엎드리고’ retains the posture without supplying ‘feet.’
  issues:
  - severity: high
    issue: The negation in ‘자기 일이 드러나지 않았음을’ reverses the meaning of οὐκ ἔλαθεν.
    rationale: λανθάνω with the negation means that the matter did not escape notice or remain concealed. The woman recognizes that concealment is no longer possible, not that her act remains undisclosed.
  - severity: medium
    issue: Footnote a repeats the reversed semantic direction.
    rationale: ‘눈에 띄지 않았음’ and ‘숨겨지지 않았음’ are presented as equivalents, but the first means ‘did not attract notice’ and conflicts with the source. The note should consistently express that she could not remain hidden.
