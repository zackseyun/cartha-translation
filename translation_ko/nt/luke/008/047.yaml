id: LUK.8.47
reference: Luke 8:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
  footnotes:
  - marker: a
    text: Or 'had not gone unnoticed' or 'was not hidden.'
    reason: lexical_alternative
  - marker: b
    text: Or 'falling at his feet before him.' The Greek says 'falling before him' without explicitly mentioning feet.
    reason: lexical_alternative
translation:
  language: ko
  text: 여자가 자기 일이 드러나지 않았음을 보고 떨며 와서, 그분 앞에 엎드려, 자신이 왜 그분을 만졌는지와 어떻게 즉시 나았는지를 모든 사람 앞에서 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈에 띄지 않았음을’, ‘숨겨지지 않았음을’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그분 앞에 엎드려’라고 하며, ‘발’은 직접 언급되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  english_pob_choice: when ... saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았을 때
  - 보자
  lexicon: BDAG
  rationale: 부사적 분사로서 주절의 상황을 이끄는 기능을 살려, 자연스러운 현대 한국어의 ‘보고’로 옮겼습니다.
- source_word: οὐκ ἔλαθεν
  english_pob_choice: had not escaped notice
  chosen_korean: 드러나지 않았음을
  alternatives_korean:
  - 눈에 띄지 않았음을
  - 숨겨지지 않았음을
  lexicon: BDAG
  rationale: ‘숨겨지다/알려지지 않다’의 의미를 살리면서도 한국어에서 가장 자연스러운 인식 결과를 담는 표현으로 잡았습니다.
- source_word: προσπεσοῦσα αὐτῷ
  english_pob_choice: falling down before him
  chosen_korean: 그분 앞에 엎드려
  alternatives_korean:
  - 그분 앞에 쓰러져
  - 그분 발 앞에 엎드려
  lexicon: BDAG
  rationale: ‘before him’에 해당하는 전치 관계를 유지하면서, 본문에 없는 ‘발’을 덧붙이지 않고도 절하는 자세를 자연스럽게 나타냈습니다.
- source_word: ὡς ἰάθη
  english_pob_choice: how she was healed
  chosen_korean: 어떻게 즉시 나았는지를
  alternatives_korean:
  - 어떻게 곧바로 치유되었는지를
  - 어떻게 낫게 되었는지를
  lexicon: BDAG
  rationale: ‘어떻게’의 설명적 연결을 살리고, 뒤의 παραχρῆμα와 함께 ‘즉시’로 치료의 신속성을 분명히 했습니다.
theological_decisions:
- issue: 여인의 행동을 회개나 예배로 과잉 해석할지 여부
  chosen_reading: 본문이 말하는 범위 안에서, 떨며 엎드리고 공개적으로 설명한 행위만 묘사했습니다.
  alternative_readings:
  - 회개하여 고백했다
  - 분명히 예배했다
  rationale: 그리스어는 두려움과 공개 진술을 말할 뿐, 회개나 예배를 명시하지 않으므로 신학적 확장을 피했습니다.
  doctrine_reference: 'Translation philosophy: source-bounded narration'
