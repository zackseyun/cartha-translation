  to: 또 다른 씨는 좋은 땅[a]에 떨어져 자라서 백 배의 열매를 맺었습니다[b]. 예수께서 이 말씀을 하시며 외치셨습니다. “들을 귀가 있는 사람은 들으십시오.”[c]
