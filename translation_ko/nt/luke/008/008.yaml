id: LUK.8.8
reference: Luke 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
  footnotes:
  - marker: a
    text: Or 'the good ground.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it bore fruit a hundredfold.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditional: ''He who has ears to hear, let him hear.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 또 다른 씨는 좋은 땅에 떨어져 자라서 백 배의 열매를 맺었습니다. 예수께서 이런 말씀을 하실 때에 외치셨습니다. “들을 귀가 있는 사람은 들으십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 흙’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘열매를 백 배 맺었습니다’.
    reason: lexical_alternative
  - marker: c
    text: '전통적 표현: ‘들을 귀 있는 자는 들으라.’'
    reason: previous_rendering
lexical_decisions:
- source_word: γῆν τὴν ἀγαθήν
  english_pob_choice: the good soil
  chosen_korean: 좋은 땅
  alternatives_korean:
  - 좋은 토양
  - 좋은 밭
  - 좋은 흙
  lexicon: BDAG
  rationale: 농경 비유에서 γῆ는 한국어로 가장 자연스럽게 ‘땅’으로 옮길 수 있으며, POB의 ‘good soil’ 취지를 살리되 본문 이미지를 과도하게 기술화하지 않기 위해 ‘좋은 땅’으로 옮겼습니다.
- source_word: φυὲν ἐποίησεν καρπὸν
  english_pob_choice: it produced fruit
  chosen_korean: 자라서 백 배의 열매를 맺었습니다
  alternatives_korean:
  - 자라서 열매를 맺었습니다
  - 자라서 결실을 맺었습니다
  - 자라서 열매를 생산했습니다
  lexicon: BDAG
  rationale: φυὲν의 ‘자라다’와 ἐποίησεν καρπὸν의 결실 이미지를 한국어 농경 표현인 ‘열매를 맺다’로 자연스럽게 살렸습니다.
- source_word: ἑκατονταπλασίονα
  english_pob_choice: a hundredfold
  chosen_korean: 백 배의
  alternatives_korean:
  - 백 배의
  - 한 백 배의
  - 백 배나 되는
  lexicon: BDAG
  rationale: 배수 표현을 간결하고 관용적인 ‘백 배의’로 옮겨 원문의 양적 강조를 그대로 드러냈습니다.
- source_word: Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  english_pob_choice: The one who has ears to hear, let him hear
  chosen_korean: 들을 귀가 있는 사람은 들으십시오
  alternatives_korean:
  - 들을 귀 있는 자는 들으십시오
  - 들을 귀가 있는 이는 들으십시오
  - 들을 귀가 있는 사람이면 들으십시오
  lexicon: BDAG
  rationale: 그리스어의 대표적 단수 표현을 한국어 현대문법에 맞게 중립적인 ‘사람’으로 옮겨, 남성특정으로 들리지 않게 하면서도 경고적·권면적 어조를 유지했습니다.
- source_word: ἐφώνει
  english_pob_choice: he called out
  chosen_korean: 외치셨습니다
  alternatives_korean:
  - 소리치셨습니다
  - 큰소리로 말씀하셨습니다
  - 외쳐 말씀하셨습니다
  lexicon: BDAG
  rationale: 반복적·강조적 발화의 뉘앙스를 살려 공적으로 선포하는 느낌의 ‘외치셨습니다’를 선택했습니다.
theological_decisions:
- issue: 대표적 단수 표현의 성중립 처리
  chosen_reading: ‘Ὁ ἔχων’은 ‘들을 귀가 있는 사람은’으로 옮겨, 대표적 단수의 보편적 적용을 드러냈습니다.
  alternative_readings:
  - 그 귀 있는 자는
  - 그는 귀가 있어 들을 수 있으니
  rationale: 원문은 남성 지칭이 아니라 대표적 단수이므로, 한국어에서도 남성으로 고정하지 않는 표현이 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
