id: LUK.8.27
reference: Luke 8:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'possessed by demons.' The Greek reads literally 'having demons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when he stepped ashore.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 육지에 나오시자, 그 성에서 온 한 사람이 그분을 만나니, 그에게는 귀신들이 있었습니다. 그리고 상당한 동안 그는 옷을 입지 않았고, 집에 머물지 않고 무덤들 사이에 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  english_pob_choice: when he came out onto the land
  chosen_korean: 육지에 나오시자
  alternatives_korean:
  - 뭍에 나오시자
  - 육지로 나오시자
  - 뭍으로 나오시자
  lexicon: SBLGNT; BDAG
  rationale: 예수님의 동작에 대한 시간·상황 부사절로 처리하고, ἐπὶ τὴν γῆν의 ‘land’ 감각을 자연스러운 ‘육지/뭍’으로 옮겼습니다.
- source_word: ἀνήρ τις ἐκ τῆς πόλεως
  english_pob_choice: a certain man from the city
  chosen_korean: 그 성에서 온 한 사람
  alternatives_korean:
  - 그 성의 한 남자
  - 성에서 온 어떤 사람
  lexicon: SBLGNT; BDAG
  rationale: ἀνήρ τις의 ‘a certain man’은 서술상 특정성을 띤 불특정 인물을 가리키므로, 한국어에서는 성별을 드러내는 ‘남자’보다 자연스러운 ‘한 사람’으로 옮기되 ἐκ τῆς πόλεως의 출처를 살렸습니다.
- source_word: ἔχων δαιμόνια
  english_pob_choice: who had demons
  chosen_korean: 그에게는 귀신들이 있었습니다
  alternatives_korean:
  - 귀신들을 지니고 있었습니다
  - 귀신들에 사로잡혀 있었습니다
  - 귀신 들린 상태였습니다
  lexicon: SBLGNT; BDAG
  rationale: 본문의 직역적 표현 ‘having demons’와 POB의 신중한 어휘 선택을 반영하여, 해석을 덜한 ‘귀신들이 있었습니다’로 옮겼습니다.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  english_pob_choice: he had not put on clothing
  chosen_korean: 옷을 입지 않았고
  alternatives_korean:
  - 옷을 갖춰 입지 않았고
  - 옷을 걸치지 않았고
  - 옷을 입지 못했고
  lexicon: SBLGNT; BDAG
  rationale: ἐνδύω의 기본 동작은 ‘입다/걸치다’이므로, 과도한 설명 없이 상태를 자연스럽게 드러내는 ‘옷을 입지 않았고’로 처리했습니다.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  english_pob_choice: but among the tombs
  chosen_korean: 무덤들 사이에 있었습니다
  alternatives_korean:
  - 무덤들에 있었습니다
  - 무덤들 가운데 있었습니다
  - 묘지에 있었습니다
  lexicon: SBLGNT; BDAG
  rationale: μνήμα는 묘지가 아니라 매장지/무덤을 가리키므로, 장소의 사이·한가운데 있음을 살리는 ‘무덤들 사이에’로 옮겼습니다.
theological_decisions:
- issue: δαιμόνια의 번역과 해석 강도
  chosen_reading: 귀신들
  alternative_readings:
  - 악귀들
  - 더러운 영들
  - 귀신에게 사로잡혀 있음
  rationale: 본문은 πνεύματα ἀκάθαρτα가 아니라 δαιμόνια를 사용하므로, 직접 대응어인 ‘귀신들’을 택해 용어를 구별했습니다.
  doctrine_reference: 'Translation philosophy #1 and #5'
- issue: ἔχων δαιμόνια의 한국어 표상
  chosen_reading: 그에게는 귀신들이 있었습니다
  alternative_readings:
  - 귀신 들린 사람이었습니다
  - 귀신에게 사로잡혀 있었습니다
  rationale: 원문은 점유 상태를 직설적으로 말하지만, ‘possessed’라는 전통적 관용을 본문에 덧씌우지 않기 위해 보다 원문 밀착적인 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
