  verdict: revise
  source_fidelity: 핵심 사건 배열과 장소·기간·무덤이라는 배경 묘사는 원문에 충실합니다. 다만 ἔχων δαιμόνια를 옮긴 ‘그에게는 귀신들이 있었습니다’는 한국어에서 귀신이 단순히 주변에 있었다는 뜻으로도 읽혀, 원문의 인물에게 귀신들이 관련되어 있는 상태를 충분히 전달하지 못합니다. 자연스러운 관용 표현으로 보완하되, 각주에서 원문의 직역적 표현을 밝혀 해석의 강도를 통제하는 것이 적절합니다.
  naturalness: ‘상당한 동안’은 현대 표준어 성경 문장에서는 다소 부자연스럽고, ‘오랫동안’이 χρόνῳ ἱκανῷ를 자연스럽고 충분히 충실하게 전달합니다. 또한 ‘무덤들 사이에 있었습니다’보다 ‘무덤들 사이에서 지냈습니다’가 집에 머물지 않았다는 μένω의 지속적 거처/체류의 대조를 한국어로 더 명료하게 나타냅니다.
  terminology: δαιμόνια는 ‘귀신들’로 유지했습니다. ‘귀신들이 들려 있었습니다’는 한국어의 자연스러운 표상이나, 원문이 문자적으로는 ‘귀신들을 가지고 있는’이라고 말한다는 점을 각주로 밝혔습니다. ‘더러운 영들’로 바꾸지 않아 원문의 용어 구별도 보존했습니다.
