    rationale: ἔχων δαιμόνια는 그 남자의 상태를 한정하는 분사입니다. 한국어 관용상 ‘귀신들이 들려 있었습니다’가 그 관계를 자연스럽게 전달하며, 직역은 각주로 제시하여 원문의 표현을 보존할 수 있습니다.
