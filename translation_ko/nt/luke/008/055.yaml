lexical_decisions:
- source_word: ἐπέστρεψεν τὸ πνεῦμα αὐτῆς
  english_pob_choice: And her spirit returned
  chosen_korean: 그녀의 영이 돌아오고
  alternatives_korean:
  - 그녀의 숨이 돌아오고
  - 그녀의 영이 돌아왔고
  lexicon: SBLGNT; BDAG
  rationale: πνεῦμα는 여기서 생명의 회복을 가리키는 표현으로 보아 ‘영’이 가장 직접적이며, ‘숨’은 가능한 의미지만 의미를 지나치게 생리적으로 좁힙니다.
- source_word: ἀνέστη παραχρῆμα
  english_pob_choice: she rose immediately
  chosen_korean: 그녀는 곧 일어났으며
  alternatives_korean:
  - 그녀는 즉시 일어났으며
  - 그녀는 즉시 일어섰으며
  lexicon: BDAG
  rationale: ἀνέστη는 단순히 ‘일어나다’의 뜻이므로, 현대 한국어에서 자연스럽고 사건의 즉시성을 살리는 ‘곧 일어났으며’로 옮겼습니다.
- source_word: διέταξεν αὐτῇ δοθῆναι φαγεῖν
  english_pob_choice: he directed that food be given to her
  chosen_korean: 예수님은 그녀에게 먹을 것을 주라고 지시하셨습니다
  alternatives_korean:
  - 예수님은 그녀에게 먹을 것이 주어지도록 지시하셨습니다
  - 예수님은 그녀에게 먹을 것을 주게 하셨습니다
  lexicon: BDAG
  rationale: διατάσσω는 권위 있는 지시를 뜻하며, δοθῆναι φαγεῖν은 ‘먹을 것이 주어지다’라는 실제적 요청을 나타내므로 한국어에서는 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: πνεῦμα를 ‘영’으로 번역할지 ‘숨’으로 번역할지
  chosen_reading: 그녀의 영이 돌아오고
  alternative_readings:
  - 그녀의 숨이 돌아오고
  rationale: 부활/생명 회복의 문맥에서 πνεῦμα의 범위를 좁혀 생리적 호흡으로만 환원하지 않고, 본문의 신학적 긴장을 유지하기 위해 ‘영’을 택했습니다.
  doctrine_reference: 원어 우선 원칙; 생명의 회복을 설명하는 표현을 축소하지 않음
