id: LUK.8.45
reference: Luke 8:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
  footnotes:
  - marker: a
    text: Or “are crowding around you and pressing in on you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “나를 만진 사람이 누구입니까?” 그러나 모두가 아니라고 부인하는 동안, 베드로가 말했습니다. “선생님, 무리들이 당신을 에워싸고 밀어붙이고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무리들이 당신을 둘러싸고 짓누르고 있습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁψάμενός
  english_pob_choice: touched
  chosen_korean: 손을 댄
  alternatives_korean:
  - 만진
  - 접촉한
  lexicon: BDAG
  rationale: 이 문맥의 ἅπτομαι 중간태는 예수께 물리적으로 접촉한 행위를 가리키므로, 한국어로는 자연스럽고 서술에 맞는 ‘손을 댄’으로 옮겼습니다.
- source_word: Ἐπιστάτα
  english_pob_choice: Master
  chosen_korean: 주인님
  alternatives_korean:
  - 선생님
  - 주님
  lexicon: BDAG
  rationale: Ἐπιστάτης는 누가복음에서 예수께 대한 존칭이며, 여기서는 κύριος가 아니므로 더 강한 신학적 호칭인 ‘주님’보다 존중을 담은 ‘주인님’이 본문에 더 가깝습니다.
- source_word: συνέχουσίν σε
  english_pob_choice: are hemming you in
  chosen_korean: 당신을 에워싸고
  alternatives_korean:
  - 당신 주위를 둘러싸고
  - 당신을 둘러싸고
  lexicon: BDAG
  rationale: συνέχω는 둘러싸여 눌리거나 갇힌 상태를 나타내므로, 단순한 ‘몰려들다’보다 둘러싼 압박을 드러내는 ‘에워싸고’로 옮겼습니다.
- source_word: ἀποθλίβουσιν
  english_pob_choice: pressing against you
  chosen_korean: 밀치고 있습니다
  alternatives_korean:
  - 누르고 있습니다
  - 압박하고 있습니다
  lexicon: BDAG
  rationale: ἀποθλίβω는 바깥에서 가해지는 압력을 더합니다. 한국어에서는 자연스러운 현재 진행형으로 ‘밀치고 있습니다’가 중첩된 압박감을 잘 살립니다.
theological_decisions:
- issue: 예수에 대한 호칭 Ἐπιστάτα의 처리
  chosen_reading: ‘주인님’으로 옮겨, 권위는 드러내되 κύριος에 해당하는 더 강한 고백은 도입하지 않았습니다.
  alternative_readings:
  - 선생님
  - 주님
  rationale: 본문 자체가 Ἐπιστάτα를 사용하므로, 독자가 예수의 권위를 이해하되 이 단어가 담지 않은 추가적 그리스도론을 덧입히지 않도록 했습니다.
  doctrine_reference: Translation philosophy; original-language primacy
