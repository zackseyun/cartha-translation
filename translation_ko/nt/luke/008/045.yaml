revisions:
- from: 예수께서 말씀하셨습니다. “내게 손을 댄 사람이 누구입니까?” 그런데 모든 사람이 부인하고 있을 때 베드로가 말했습니다. “주인님, 무리가 당신을 에워싸고 밀치고 있습니다.”[a]
  to: 예수께서 말씀하셨습니다. “나를 만진 사람이 누구입니까?” 그러나 모두가 아니라고 부인하는 동안, 베드로가 말했습니다. “선생님, 무리들이 당신을 에워싸고 밀어붙이고 있습니다.”[a]
  rationale: ‘주인님’을 현대 표준 한국어와 누가복음의 호칭 용례에 맞는 ‘선생님’으로 고쳤습니다. ἁψάμενος는 ‘나를 만진 사람’으로 직접 옮기고, πάντων의 지속적인 부인은 ‘모두가 아니라고 부인하는 동안’으로 반영했습니다. 두 군중 동사는 ‘에워싸고 밀어붙이고’로 구별해, 둘러쌈과 압박을 함께 나타냈습니다. 각주 표지는 실제 대안이 적용되는 문장 끝으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:15Z'
