  source_fidelity: 원문의 핵심 구조와 의미는 대체로 반영되어 있습니다. 다만 Ἐπιστάτα를 ‘주인님’으로 옮기면 현대 한국어에서 소유주 또는 고용 관계의 주인을 우선 연상시켜, 예수를 향한 누가복음의 존중하는 호칭으로는 부정확하고 부자연스럽습니다. 또한 ἀποθλίβουσιν의 군중이 가하는 지속적 압박은 ‘밀치고’보다 ‘밀어붙이고’가 더 잘 드러냅니다.
  naturalness: 합쇼체 문장 자체는 자연스럽지만, ‘주인님’은 이 문맥에서 현대 표준어의 자연스러운 호칭이 아닙니다. ‘모두가 아니라고 부인하는 동안’은 현재 분사의 진행성을 살리면서도 이해하기 쉽습니다.
  terminology: Ἐπιστάτα는 여기서 κύριος에 해당하는 ‘주님’으로 격상하지 않고 ‘선생님’으로 옮기는 것이 적절합니다. 이는 교육자라는 기능만으로 한정하기보다, 한국어 성서 문맥에서 존중하는 예수의 호칭으로 통용되는 표현입니다. ‘만진’은 ἁψάμενος의 물리적 접촉을 직접적이고 자연스럽게 표현합니다.
