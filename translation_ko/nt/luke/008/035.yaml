    rationale: 주석 내용은 ‘정신이 온전한’에 관한 것이므로 그 표현 직후에 표지를 두어야 합니다. 또한 현 주석은 본문 표현을 그대로 반복하여 실질적 대안을 제공하지 못합니다.
  - severity: medium
    issue: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν의 단수 동사에 관한 본문비평 주석이 누락되었습니다.
    rationale: 제시된 영어 POB 감사 기록은 복수 주어와 단수 동사의 변이를 명시합니다. 한국어에서는 수 일치가 표면적으로 드러나지 않지만, 원문 및 사본 차이를 투명하게 보존하기 위해 해당 절에 주석을 붙이는 것이 적절합니다.
