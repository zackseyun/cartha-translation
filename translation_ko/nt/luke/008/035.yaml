revisions:
- from: 그들은 무슨 일이 일어났는지 보려고 나가서 예수께로 왔습니다. 그리고 귀신들이 떠나간 그 사람이 옷을 입고 정신이 온전한 채 예수의 발치에 앉아 있는 것을 보고, 그들은 두려워했습니다.[a]
  to: 그들은 무슨 일이 일어났는지 보려고 나가서 예수께로 왔습니다. 그리고 귀신들이 떠나간[b] 그 사람이 옷을 입고 정신이 온전한[a] 채 예수의 발치에 앉아 있는 것을 발견하고 두려워했습니다.
  rationale: 원문의 εὗρον을 ‘발견하고’로 명확히 옮기고, ‘정신이 온전한’의 대안 주석을 해당 어구에 연결했습니다. 또한 SBLGNT의 단수 동사와 일부 사본의 복수형 읽기에 관한 주석을 관계절에 추가했습니다. 그 밖의 표현은 원문 의미와 현대 격식체 한국어를 잘 보존하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:18Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 사건 전개와 주요 어휘는 대체로 정확합니다. 다만 SBLGNT 본문의 특이한 단수 동사(ἐξῆλθεν)와 관련된 본문비평 주석이 한국어 초안에서 빠져 있으며, 기존 [a]는 ‘정신이 온전한’의 대안이라는 내용과 달리 문장 끝에 놓여 있어 해당 표현에 직접 연결되지 않습니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. 그러나 εὗρον은 ‘보고’보다 ‘발견하고/발견했습니다’가 더 직접적입니다. 주석 표지를 해당 어구 바로 뒤에 배치하면 읽기에도 더 명료합니다.
  terminology: ‘귀신들’, ‘예수께로’, ‘예수의 발치’, ‘정신이 온전한’은 원문의 의미와 현대 표준 한국어에 적절합니다. ‘제정신인’을 어휘 대안으로 제시할 수 있습니다.
  issues:
