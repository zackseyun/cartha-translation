id: LUK.8.35
reference: Luke 8:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
  footnotes:
  - marker: a
    text: Or 'of sound mind.'
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read the verb as plural ('the demons had gone out'); the printed text has a singular verb with a plural subject, but the sense is unchanged.
    reason: textual_variant
translation:
  language: ko
  text: 그들은 무슨 일이 일어났는지 보려고 나가서 예수께로 왔습니다. 그리고 귀신들이 떠나간[b] 그 사람이 옷을 입고 정신이 온전한[a] 채 예수의 발치에 앉아 있는 것을 발견하고 두려워했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제정신인’.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 동사를 복수형으로 읽습니다(‘귀신들이 떠나갔다’). 본문은 복수 주어와 함께 단수 동사를 읽지만, 뜻은 달라지지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονός
  english_pob_choice: Then they went out to see what had happened
  chosen_korean: 무슨 일이 일어났는지 보려고 나가서
  alternatives_korean:
  - 무슨 일이 있었는지 보려고 나가서
  - 일어난 일을 보려고 나가서
  lexicon: BDAG
  rationale: ἐξέρχομαι의 이동 의미와 ἰδεῖν의 목적 용법을 자연스러운 한국어로 살렸습니다. τὸ γεγονός는 완료된 사건을 가리키므로 ‘무슨 일이 일어났는지’가 가장 간결하고 적절합니다.
- source_word: πρὸς τὸν Ἰησοῦν
  english_pob_choice: to Jesus
  chosen_korean: 예수께로
  alternatives_korean:
  - 예수에게
  - 예수 쪽으로
  lexicon: BDAG
  rationale: πρός + 대격은 사람을 향한 이동을 나타내므로 ‘예수께로’가 방향성을 잘 드러냅니다.
- source_word: τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  english_pob_choice: the man from whom the demons had gone out
  chosen_korean: 귀신들이 떠나간 그 사람
  alternatives_korean:
  - 귀신들이 나간 그 사람
  - 귀신들이 떠나간 남자
  lexicon: BDAG
  rationale: 관계절을 한국어 관형절로 옮겨 인물 식별 기능을 살렸습니다. δαιμόνια는 본문의 초자연적 실체를 약화시키지 않도록 ‘귀신들’로 옮겼습니다.
- source_word: ἱματισμένον καὶ σωφρονοῦντα
  english_pob_choice: sitting, clothed, and in his right mind
  chosen_korean: 옷을 입고 정신이 온전한 채
  alternatives_korean:
  - 옷을 입고 제정신인 채
  - 입을 것을 갖춰 입고 정신이 온전한 채
  lexicon: BDAG
  rationale: ἱματισμένος는 단순히 ‘입은’보다 상태를 드러내는 ‘옷을 입고’가 자연스럽고, σωφρονοῦντα는 ‘정신이 온전한’이 현대 한국어에서 문맥상 가장 분명합니다.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  english_pob_choice: at Jesus’s feet
  chosen_korean: 예수의 발치에
  alternatives_korean:
  - 예수의 발 앞에
  - 예수의 발 곁에
  lexicon: BDAG
  rationale: παρά + 대격의 위치 의미를 살리면서, 한국어 관용으로는 ‘발치에’가 가장 자연스럽고 장면의 겸손한 자세도 암시합니다.
theological_decisions:
- issue: 귀신 축출을 단순 심리 치유로 완화하지 않음
  chosen_reading: 귀신들이 떠나간
  alternative_readings:
  - 병이 나은
  - 정신적 문제에서 회복된
  rationale: 본문은 실제 귀신 축출 사건을 서술하므로, 이를 비유나 단순 질병 회복으로 바꾸지 않았습니다.
  doctrine_reference: 원문 서술의 초자연적 실재를 보존
