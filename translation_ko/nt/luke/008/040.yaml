id: LUK.8.40
reference: Luke 8:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: Now when Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
  footnotes:
  - marker: a
    text: Or "the crowd received him"; the Greek verb can denote receiving or welcoming, with a positive sense in this context.
    reason: lexical_alternative
  - marker: b
    text: Or "for all were expecting him."
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 돌아오셨을 때, 무리가 그분을 맞아들였습니다. 그들이 모두 그분을 기다리고 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  english_pob_choice: Now when Jesus returned
  chosen_korean: 예수님께서 돌아오시자
  alternatives_korean:
  - 예수님께서 돌아오실 때
  - 예수님께서 돌아오고 계실 때
  lexicon: BDAG
  rationale: ἐν + 정관사 + 부정사는 시간 부사절이므로 한국어에서는 자연스럽게 ‘-시자’로 옮겨 사건의 전환을 살렸습니다.
- source_word: ἀπεδέξατο
  english_pob_choice: welcomed
  chosen_korean: 맞아들였습니다
  alternatives_korean:
  - 환영했습니다
  - 받아들였습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 ‘받다’보다 호의적인 수용을 나타내므로, 문맥의 긍정성을 살려 ‘맞아들이다’를 선택했습니다.
- source_word: ὁ ὄχλος
  english_pob_choice: the crowd
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: BDAG
  rationale: 누가복음에서 ὄχλος는 모인 사람들의 집합을 뜻하므로, 자연스러운 성경 문체의 ‘무리’로 옮겼습니다.
- source_word: προσδοκῶντες
  english_pob_choice: waiting for
  chosen_korean: 기다리고 있었기
  alternatives_korean:
  - 기대하고 있었기
  - 고대하고 있었기
  lexicon: BDAG
  rationale: προσδοκάω는 ‘기다리다/기대하다’의 뜻이 있으나, 여기서는 예수님의 도착을 기다리는 상황이므로 ‘기다리고 있었기’가 가장 직접적입니다.
