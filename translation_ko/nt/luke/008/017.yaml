source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
  footnotes:
  - marker: a
    text: Or 'become manifest.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will certainly be known'; the Greek construction strongly denies that anything secret will remain unknown.
    reason: lexical_alternative
  - marker: c
    text: Or 'come into the open.'
    reason: lexical_alternative
translation:
  language: ko
  text: 숨겨진 것은 드러나지 않을 것이 없고, 비밀인 것은 알려지지 않고 빛으로 나오지 않을 것이 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드러나게 될 것입니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘반드시 알려지게 될 것입니다’; 그리스어 구조는 어떤 비밀도 알려지지 않은 채 남지 않는다는 뜻을 강하게 부정합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세상에 드러나게 될 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸν
  english_pob_choice: hidden
  chosen_korean: 숨겨진 것
  alternatives_korean:
  - 감추어진 것
  - 은밀한 것
  lexicon: BDAG
  rationale: κρυπτός는 숨겨져 있거나 감추어진 상태를 가리키므로, 문맥상 가장 자연스러운 현대 한국어인 ‘숨겨진 것’으로 옮겼습니다.
- source_word: φανερὸν γενήσεται
  english_pob_choice: will become evident
  chosen_korean: 드러나지 않을 것이 없습니다
  alternatives_korean:
  - 분명해질 것입니다
  - 드러날 것입니다
  lexicon: BDAG
  rationale: γενήσεται는 단순 상태가 아니라 상태의 변화를 나타내므로, ‘드러날 것입니다’보다 ‘드러나지 않을 것이 없습니다’로 원문의 강한 부정적 상대구조를 살렸습니다.
- source_word: ἀπόκρυφον
  english_pob_choice: secret
  chosen_korean: 비밀인 것
  alternatives_korean:
  - 숨은 것
  - 감추어진 것
  lexicon: BDAG
  rationale: ἀπόκρυφος는 첫 절의 κρυπτόν과 가깝지만 약간 다른 뉘앙스를 가지므로, ‘비밀인 것’으로 약간의 어휘 구별을 유지했습니다.
- source_word: οὐ μὴ γνωσθῇ καὶ εἰς φανερὸν ἔλθῃ
  english_pob_choice: will not be known and come to light
  chosen_korean: 알려지지 않고 빛으로 나오지 않을 것이 없습니다
  alternatives_korean:
  - 알려지지 않을 것이 없고 드러나지 않을 것이 없습니다
  - 반드시 알려지고 드러나게 될 것입니다
  lexicon: BDAG
  rationale: οὐ μὴ는 강한 부정이므로, 단순한 미래형보다 ‘알려지지 않고… 않을 것이 없습니다’로 이중 부정을 살려 어떤 비밀도 끝내 남지 않는다는 뜻을 표현했습니다.
theological_decisions:
- issue: 계시의 범위
  chosen_reading: 이 말씀은 숨겨진 것의 보편적 드러남을 말하는 일반 원칙으로 번역하고, 종말론적 심판이나 즉각적 문맥 적용으로 좁히지 않았습니다.
  alternative_readings:
  - 마지막 심판 때의 계시
  - 예수의 가르침과 반응의 드러남
  rationale: 본문 자체는 드러남의 원칙을 말할 뿐 시점을 특정하지 않으므로, 번역도 그 신학적 긴장을 보존해야 합니다.
  doctrine_reference: Source-sensitive reading; preserve theological tension.
