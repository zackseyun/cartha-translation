  rationale: 둘째 절의 부자연스러운 ‘빛으로 나오다’를 ‘드러나다’로 고쳐 εἰς φανερὸν ἔλθῃ의 공개적 드러남을 자연스럽게 옮겼습니다. 두 절 모두 원문의 ‘그렇지 않을 것은 없다’라는 부정 관계절 구조를 유지했으며, 본문이 밝히지 않는 계시의 시점이나 범위를 덧붙이지 않았습니다. 각주도 실제 해당 표현에 연결되도록 재배치·조정했습니다.
