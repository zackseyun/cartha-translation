  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: ko
  text: 보십시오, 야이로라 이름하는 한 사람이 왔는데, 그는 회당의 한 지도자였습니다. 그는 예수의 발 앞에 엎드려 자기 집으로 들어와 주시기를 간청했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「회당의 한 지도자」는 문자적으로는 「회당의 통치자/관리」에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이봐요
  lexicon: ἰδοὺ
  rationale: 서술을 끊어 주의를 환기하는 감탄사로, 현대 합쇼체에서 자연스럽고 직접적인 호응형 표현인 「보십시오」를 택했습니다.
- source_word: ἄρχων τῆς συναγωγῆς
  english_pob_choice: a ruler of the synagogue
  chosen_korean: 회당의 한 지도자
  alternatives_korean:
  - 회당의 관리
  - 회당장
  - 회당의 통치자
  lexicon: ἄρχων
  rationale: ἄρχων의 권위 직함을 그대로 살리되, 한국어에서 오해를 줄이기 위해 기능적으로 「지도자」로 옮겼습니다.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  english_pob_choice: falling at Jesus's feet
  chosen_korean: 예수의 발 앞에 엎드려
  alternatives_korean:
  - 예수의 발 앞에 무릎을 꿇고
  - 예수의 발치에 쓰러져
  lexicon: πίπτω + παρὰ τοὺς πόδας
  rationale: 단순히 자세를 낮춘 정도보다 완전히 몸을 낮춘 행위를 드러내기 위해 「엎드려」를 사용했습니다.
- source_word: παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  english_pob_choice: he begged him to come into his house
  chosen_korean: 자기 집으로 들어와 주시기를 간청했습니다
  alternatives_korean:
  - 자기 집에 들어오시기를 부탁했습니다
  - 자기 집에 와 달라고 애원했습니다
  lexicon: παρακαλέω + εἰσέρχομαι
  rationale: 간청의 강도를 유지하면서도, 이어지는 목적절의 초청 의미를 한국어로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 예수께 하는 요청의 높임말 표현
  chosen_reading: 직접 청원 장면으로서 예수께 대한 존칭은 「들어와 주시기를」로 처리했습니다.
  alternative_readings:
  - 평서형으로 단순화
  - 더 강한 종교적 존칭을 부가
  rationale: 본문의 간청 뉘앙스를 유지하면서도 현대 한국어에서 과도하게 경직된 종교어를 피하기 위해 합쇼체를 유지했습니다.
  doctrine_reference: 경배/청원 예절의 문체적 재현
