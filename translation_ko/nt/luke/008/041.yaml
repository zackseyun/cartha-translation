  naturalness: 초안의 「보십시오, … 왔는데」는 현대 한국어의 연속 서술에서 다소 직역투로 들립니다. 또한 「그는」의 반복은 원문의 강조를 반영할 수 있으나, 한 문장 안에서는 「…였으며」로 연결하면 합쇼체 서술이 더 매끄럽습니다.
  terminology: 「야이로」, 「회당」, 「예수」는 통용되는 성서 한국어 표기입니다. 「회당의 지도자」는 교파적으로 특정한 직제 용어를 강제하지 않으면서 원문의 공적 역할을 전달합니다. 각주가 이 표현의 가능한 직역 범위를 밝혀 주므로 유지할 수 있습니다.
  issues:
