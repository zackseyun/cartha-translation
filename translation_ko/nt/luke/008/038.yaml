  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: Now the man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: ko
  text: '그에게서 귀신들이 나간 그 사람은 예수와 함께 있기를 간청하고 있었습니다. 그러나 예수께서는 그를 돌려보내시며 말씀하셨습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  english_pob_choice: was begging
  chosen_korean: 간청했으나
  alternatives_korean:
  - 애원했으나
  - 매달렸으나
  - 부탁했으나
  lexicon: BDAG
  rationale: 미완료 시상의 συνεχής한 간청을 살리면서도 현대 한국어에서 자연스럽고, 단순한 ‘요청’보다 강한 호소를 드러냅니다.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  english_pob_choice: from whom the demons had gone out
  chosen_korean: 그에게서 귀신들이 나간
  alternatives_korean:
  - 그에게서 악한 영들이 떠나간
  - 그에게서 귀신들이 떠난
  - 귀신들이 그에게서 나간
  lexicon: BDAG
  rationale: 관계절의 완료된 이전 사건을 ‘나간’으로 자연스럽게 살리고, δαιμόνια는 본문의 초자연적 실재를 흐리지 않도록 ‘귀신들’로 옮겼습니다.
- source_word: εἶναι σὺν αὐτῷ
  english_pob_choice: to be with him
  chosen_korean: 예수와 함께 있기를
  alternatives_korean:
  - 그와 함께 있기를
  - 예수 곁에 있기를
  - 그를 따라다니기를
  lexicon: BDAG
  rationale: 직역보다 문맥상 대상이 예수임이 분명하므로 이름을 보충해 한국어 독자의 추적성을 높였고, ‘함께 있기를’로 헬라어의 단순한 동반 의미를 보존했습니다.
- source_word: ἀπέλυσεν
  english_pob_choice: sent him away
  chosen_korean: 그를 돌려보내시며
  alternatives_korean:
  - 그를 보내시며
  - 그를 떠나가게 하시며
  - 그를 돌려보내며
  lexicon: BDAG
  rationale: 단순 방출보다 뒤 절의 파송 맥락을 염두에 둔 ‘돌려보내다’가 자연스럽고, 거절의 뉘앙스를 지나치게 차갑게 만들지 않습니다.
theological_decisions:
- issue: 귀신들(δαιμόνια)을 약화시키지 않는 번역
  chosen_reading: ‘귀신들’로 번역해 본문의 초자연적 실재를 그대로 드러냅니다.
  alternative_readings:
  - ‘악한 영들’
  - ‘영들’
  rationale: 본문은 단순한 심리적 상태가 아니라 나가간 존재로서의 δαιμόνια를 전제하므로, 이를 희석하지 않는 번역이 स्रोत의 주장에 더 충실합니다.
  doctrine_reference: 'Affirmations; translation philosophy #1'
