review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐδεῖτο는 미완료 과거로 지속적인 간청을 나타내므로 ‘간청하고 있었습니다’가 더 잘 반영합니다. αὐτῷ는 문맥상 예수를 가리키므로 ‘예수와 함께’는 안전한 명시화입니다. ἀπέλυσεν λέγων은 그를 보내고 이어서 말하는 구조이며, 한국어에서는 ‘돌려보내시며 말씀하셨습니다’로 자연스럽게 옮길 수 있습니다.
  naturalness: 원문의 앞선 사건을 나타내는 ‘그에게서 귀신들이 나간 그 사람’은 자연스럽습니다. ‘간청하고 있었습니다’는 지속성을 살리면서 현대 합쇼체 문장에도 적합합니다. 다음 절의 직접 인용을 도입하도록 문장 끝에 콜론을 사용했습니다.
  terminology: δαιμόνια의 ‘귀신들’은 한국어 성경 문맥에서 정착된 자연스러운 대응어이며 원문의 주장을 약화하지 않습니다. ‘돌려보내시다’는 여기서 요청을 받아들이지 않고 보내는 ἀπέλυσεν에 적절합니다.
  issues:
  - severity: medium
    issue: ‘간청했으나’가 ἐδεῖτο의 미완료상(진행·지속의 간청)을 충분히 드러내지 못합니다.
    rationale: ‘간청하고 있었습니다’는 그가 계속 간청하던 상황을 더 직접적으로 보존합니다.
  - severity: low
    issue: 두 대안 번역 각주는 본문 이해에 필요한 본문비평·의미상의 쟁점을 제시하지 않으며, 특히 [a]는 문맥상 예수를 가리키는 대명사의 단순 직역 가능성만 반복합니다.
    rationale: 각주를 제거하면 불필요한 선택지를 제시하지 않고 본문의 명확한 지시 대상을 유지할 수 있습니다.
  revised_text: '그에게서 귀신들이 나간 그 사람은 예수와 함께 있기를 간청하고 있었습니다. 그러나 예수께서는 그를 돌려보내시며 말씀하셨습니다:'
