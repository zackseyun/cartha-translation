id: LUK.8.3
reference: Luke 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
  footnotes:
  - marker: a
    text: Some manuscripts read “him” instead of “them.”
    reason: textual_variant
  - marker: b
    text: Or “from their possessions” or “from their means.”
    reason: lexical_alternative
translation:
  language: ko
  text: 요안나[a], 곧 헤롯의 청지기 쿠사의 아내와 수산나와 또 많은 다른 여자들이 자기들의 소유로 그들을 섬겼습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘그들’ 대신 ‘그를’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘자기들의 재산에서’ 또는 ‘자기들의 수단에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  english_pob_choice: the wife of Chuza
  chosen_korean: 쿠사의 아내
  alternatives_korean:
  - 쿠사의 여자
  - 쿠사의 부인
  lexicon: BDAG
  rationale: γυνή는 뒤에 인명 속격이 따라와 요안나의 신분을 남편과의 관계로 밝히므로, 한국어에서는 자연스럽게 ‘아내’로 옮겼습니다.
- source_word: ἐπιτρόπου
  english_pob_choice: steward
  chosen_korean: 청지기
  alternatives_korean:
  - 관리인
  - 감독관
  - 집정관
  lexicon: BDAG
  rationale: Ἐπίτροπος는 맡겨진 재산이나 일을 관리하는 사람을 가리키며, 한국어 성경 전통과 현대 문체를 함께 고려할 때 ‘청지기’가 가장 간결하고 원뜻에 가깝습니다.
- source_word: ἕτεραι πολλαί
  english_pob_choice: many others
  chosen_korean: 또 많은 다른 여자들
  alternatives_korean:
  - 많은 다른 이들
  - 많은 여자들
  lexicon: BDAG
  rationale: 문맥상 이미 언급된 여성들을 가리키므로 단순히 ‘많은 다른 이들’보다 성별을 분명히 드러내는 편이 자연스럽고, 본문 흐름도 더 분명해집니다.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  english_pob_choice: out of their possessions
  chosen_korean: 자기들의 소유로
  alternatives_korean:
  - 자기들의 재산으로
  - 자기들의 소유에서
  - 자기들의 가진 것으로
  lexicon: BDAG
  rationale: ὑπάρχοντα는 소유물·재산을 뜻하므로, 한국어에서는 출처 관계를 살리면서도 자연스럽게 들리는 ‘자기들의 소유로’로 옮겼습니다.
theological_decisions:
- issue: αὐτοῖς의 지시 대상
  chosen_reading: 복수로 유지하여, 여자들이 예수와 그와 함께한 이들에게 봉사한 것으로 읽었습니다.
  alternative_readings:
  - 단수로 읽어 예수 한 분께 봉사한 것으로 이해하는 읽기
  rationale: 제시된 그리스어 본문이 복수형 αὐτοῖς를 따르므로, 일부 사본의 단수 읽기를 본문에 흡수하지 않고 그대로 반영했습니다.
  doctrine_reference: 원문 우선 원칙과 사본 차이 보존 원칙
