id: LUK.8.15
reference: Luke 8:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
  footnotes:
  - marker: a
    text: Or “with an honest and good heart.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 좋은 땅에 떨어진 씨는, 말씀을 듣고 좋고 선한 마음으로[a] 말씀을 굳게 지키며 인내로 열매를 맺는 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정직하고 좋은 마음으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ ἐν τῇ καλῇ γῇ
  english_pob_choice: the seed in the good soil
  chosen_korean: 좋은 땅에 있는 것들
  alternatives_korean:
  - 좋은 토양에 있는 것
  - 좋은 땅에 있는 씨
  lexicon: BDAG
  rationale: 헬라어의 중성 관사는 앞선 비유 문맥을 가리키는 지시적 표현이므로, 한국어에서는 자연스럽게 앞부분을 받는 ‘것들’로 처리했습니다. γῆ는 여기서 비옥한 땅을 가리키므로 전통적인 ‘땅’을 살렸습니다.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  english_pob_choice: with a good and noble heart
  chosen_korean: 선하고 좋은 마음으로
  alternatives_korean:
  - 정직하고 좋은 마음으로
  - 선하고 올바른 마음으로
  - 좋고 고귀한 마음으로
  lexicon: BDAG
  rationale: καρδία는 성경적 용례에 따라 내면 전체를 가리키는 ‘마음’으로 옮겼고, καλῇ와 ἀγαθῇ의 두 형용사는 서로 겹치지만 동일어 반복이 아니므로 한국어에서도 둘 다 살려 구분했습니다. ‘고귀한’은 의미를 과하게 좁힐 수 있어 기본 의미인 선함을 우선했습니다.
- source_word: κατέχουσιν
  english_pob_choice: hold fast to it
  chosen_korean: 그것을 붙들어 지키며
  alternatives_korean:
  - 그것을 굳게 붙들며
  - 그것을 간직하며
  - 그것을 지키며
  lexicon: BDAG
  rationale: κατέχω는 단순 소유가 아니라 굳게 ধরে 놓치지 않는 뜻이므로 ‘붙들어 지키다’로 옮겼습니다. 앞절의 ‘말씀’을 다시 받는 대명사 ‘그것’을 두어 의미 연결을 분명히 했습니다.
- source_word: ἐν ὑπομονῇ
  english_pob_choice: with perseverance
  chosen_korean: 인내로
  alternatives_korean:
  - 참음으로
  - 견딤으로
  - 인내 가운데
  lexicon: BDAG
  rationale: ὑπομονή는 단순한 참음보다 지속적이고 견고한 인내를 뜻하므로, 한국어에서는 간결하게 ‘인내로’ 처리해 열매 맺음의 방식을 나타냈습니다.
theological_decisions:
- issue: 마음의 선함을 어떻게 표현할지
  chosen_reading: ‘선하고 좋은 마음’으로 두 형용사를 모두 살려, 들은 말씀을 받는 내면의 상태를 긍정적으로 묘사했습니다.
  alternative_readings:
  - ‘정직하고 좋은 마음’으로
  - ‘선하고 올바른 마음’으로
  rationale: 본문은 열려 있는 수용성과 지속적 충실함을 말할 뿐, 그 마음의 기원이나 공로를 설명하지 않습니다. 따라서 도덕적 묘사를 유지하되, 신학적 체계를 덧입히지 않도록 했습니다.
  doctrine_reference: 본문이 말하는 수용적 내면을 보존하고, 은혜의 기원이나 공로 문제는 본문 밖으로 남겨 둡니다.
