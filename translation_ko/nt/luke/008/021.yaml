id: LUK.8.21
reference: Luke 8:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
  footnotes:
  - marker: a
    text: Or 'my siblings.' The Greek says 'brothers,' but the statement's application may extend beyond males.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''are these: those who''.'
    reason: previous_rendering
translation:
  language: ko
  text: 예수님께서 대답하여 그들에게 말씀하셨습니다. “내 어머니와 내 형제들은 하나님의 말씀을 듣고 행하는 이 사람들입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제자매들’. 헬라어는 ‘형제들’이라고 하지만, 이 말씀의 적용은 남성에만 제한되지 않을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '또는 ‘내 형제들은 바로 이런 사람들입니다: 곧 …하는 이들입니다’로 볼 수 있습니다.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 … 말씀하셨습니다
  alternatives_korean:
  - 대답하여 … 이르셨습니다
  - 대답하시고 말씀하셨습니다
  lexicon: SBLGNT; BDAG
  rationale: 헬라어의 관용적 서술 결합을 살려, 단순히 ‘말씀하셨습니다’로만 줄이지 않고 응답의 동작을 분명히 드러냈습니다.
- source_word: πρὸς αὐτούς
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그 사람들에게
  lexicon: SBLGNT; BDAG
  rationale: 간접 대상을 자연스러운 한국어 조사구로 옮겨, 본문 흐름을 해치지 않으면서 대상 지시를 유지했습니다.
- source_word: ἀδελφοί μου
  english_pob_choice: my brothers
  chosen_korean: 내 형제들
  alternatives_korean:
  - 내 형제자매들
  - 내 형제들(=형제자매)
  lexicon: SBLGNT; BDAG
  rationale: 헬라어 복수 남성형의 표면 형식을 반영해 ‘형제들’로 옮겼고, 영어 주석이 제시한 포괄적 가능성은 본문보다 각주에 두는 편이 적절합니다.
- source_word: οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ποιοῦντες
  english_pob_choice: those who hear the word of God and do it
  chosen_korean: 하나님의 말씀을 듣고 행하는 이 사람들
  alternatives_korean:
  - 하나님의 말씀을 듣고 그대로 행하는 이들
  - 하나님의 말씀을 듣고 실천하는 이들
  lexicon: SBLGNT; BDAG
  rationale: 현재분사구를 관계절로 풀어, ‘듣는 것’과 ‘행하는 것’의 지속적 특징을 살리면서 한국어 문장으로 자연스럽게 표현했습니다. ‘행하다’는 ποιοῦντες의 직접성을 비교적 잘 반영합니다.
- source_word: τὸν λόγον τοῦ θεοῦ
  english_pob_choice: the word of God
  chosen_korean: 하나님의 말씀
  alternatives_korean:
  - 하나님의 말씀
  - 하나님 말씀
  lexicon: SBLGNT; BDAG
  rationale: λόγος를 이 구절에서는 ‘말씀’으로 옮겨, 하나님의 선포와 가르침을 뜻하는 문맥적 의미를 살렸습니다.
theological_decisions:
- issue: 예수님의 참된 가족 선언의 범위
  chosen_reading: 예수님은 혈연 관계를 부정하지 않으면서도, 하나님의 말씀을 듣고 행하는 이들이 참된 가족이라는 기준을 제시하십니다.
  alternative_readings:
  - 육친 가족을 완전히 배제하신다
  - 남성 제자들만을 가리키신다
  rationale: 본문의 초점은 가족 관계의 재정의이지, 어머니와 형제들을 거부하는 선언이 아닙니다. 또한 ‘형제들’의 남성형을 본문대로 유지해 성별 표지를 지우지 않았습니다.
  doctrine_reference: 본문이 제시하는 긴장과 확장을 그대로 보존
