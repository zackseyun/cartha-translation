  source_fidelity: 본문의 핵심 의미는 대체로 정확합니다. 다만 각주 표지가 모두 ‘놀랐습니다’ 뒤에 붙어 있어, 지시(παρήγγειλεν)와 일어난 일(τὸ γεγονός)에 관한 각주의 지시 대상이 불분명합니다. 또한 ‘그의 부모’는 한국어에서 선행 대상을 모르면 지시가 흐려질 수 있으므로 ‘그 아이의 부모’로 명시하는 것이 αὐτῆς를 자연스럽고 충실하게 전달합니다.
  naturalness: 합쇼체 문체와 문장 흐름은 자연스럽습니다. ‘그 아이의 부모는 몹시 놀랐습니다’는 ἐξέστησαν의 강한 놀라움을 더 잘 나타내며, ‘아무에게도 … 말하지 말라고’도 자연스러운 금지 표현입니다.
  terminology: ‘부모’, ‘지시하셨습니다’, ‘일어난 일’은 각각 γονεῖς, παρήγγειλεν, τὸ γεγονός에 적절합니다. 각주는 해당 어휘 또는 구문 바로 뒤에 배치해야 합니다.
