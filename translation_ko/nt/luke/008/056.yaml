  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
  footnotes:
  - marker: a
    text: Or 'were amazed' or 'were beside themselves.'
    reason: lexical_alternative
  - marker: b
    text: Or 'ordered' or 'commanded them to tell no one.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'the thing that had happened' or 'the event.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 아이의 부모는 몹시 놀랐습니다.[a] 그러나 예수께서는 아무에게도 일어난 일[c]을 말하지 말라고 그들에게 지시하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경악했습니다’, ‘정신이 나간 듯했습니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아무에게도 말하지 말라고 명령하셨습니다’, ‘엄히 지시하셨습니다’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘일어난 것’ 또는 ‘그 사건’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  english_pob_choice: were astonished
  chosen_korean: 놀랐습니다
  alternatives_korean:
  - 경악했습니다
  - 어안이 벙벙했습니다
  - 몹시 놀랐습니다
  lexicon: BDAG
  rationale: 여기서는 큰 충격과 놀람을 자연스러운 현대 한국어로 옮기는 것이 적절하여, 과도하게 관용적인 표현보다 ‘놀랐습니다’를 택했습니다.
- source_word: γονεῖς
  english_pob_choice: parents
  chosen_korean: 부모
  alternatives_korean:
  - 아버지와 어머니
  - 양친
  lexicon: BDAG
  rationale: γονεῖς는 표준적인 복수 명사로서 ‘부모’가 가장 직접적이고 중립적인 대응입니다.
- source_word: παρήγγειλεν
  english_pob_choice: instructed
  chosen_korean: 지시하셨습니다
  alternatives_korean:
  - 명령하셨습니다
  - 분부하셨습니다
  - 당부하셨습니다
  lexicon: BDAG
  rationale: 명령의 힘은 살리되, 문맥상 지나치게 군령조로 만들지 않기 위해 ‘지시하셨습니다’를 선택했습니다.
- source_word: τὸ γεγονός
  english_pob_choice: what had happened
  chosen_korean: 일어난 일
  alternatives_korean:
  - 무슨 일이 일어났는지
  - 그 사건
  lexicon: BDAG
  rationale: 완료된 사건을 가리키는 표현을 한국어에서 가장 자연스럽게 살리기 위해 ‘일어난 일’로 옮겼습니다.
theological_decisions:
- issue: 침묵 명령의 범위와 의도
  chosen_reading: 본문이 말하는 대로, 예수께서 그들에게 아무에게도 말하지 말라고 지시하셨다는 사실만 드러내고 추가 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 메시아 비밀 모티프에 연결해 해석하기
  - 일시적 제한 명령으로 해석하기
  rationale: 이 절은 동기나 기간을 설명하지 않으므로, 번역은 본문이 제시하는 지시 자체를 보존하는 데 그쳐야 합니다.
  doctrine_reference: 본문 수준의 긴장을 유지하고, 해석을 번역문에 과도하게 주입하지 않음.
