id: LUK.8.20
reference: Luke 8:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
  footnotes:
  - marker: a
    text: Or 'relatives,' if ἀδελφοί is understood more broadly in context; the Greek term ordinarily means 'brothers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 예수님께 이렇게 전해졌습니다. 「어머니와 형제들이 바깥에 서서 당신을 보려고 합니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족들’로 볼 수 있습니다. 다만 ἀδελφοί는 보통 ‘형제들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη δὲ
  english_pob_choice: And it was reported
  chosen_korean: 그런데 예수님께 이렇게 전해졌습니다
  alternatives_korean:
  - 그리고 그에게 보고되었습니다
  - 그리고 그에게 전해졌습니다
  - 그런데 예수님께 보고가 들어왔습니다
  lexicon: BDAG
  rationale: 수동형의 ‘보고되다/전해지다’ 의미를 살리되, 한국어에서는 자연스러운 서술로 옮겼습니다. δέ는 단순 접속보다 장면 전환이므로 ‘그런데’로 처리했습니다.
- source_word: αὐτῷ
  english_pob_choice: to him
  chosen_korean: 예수님께
  alternatives_korean:
  - 그에게
  - 그분께
  lexicon: BDAG
  rationale: 문맥상 수신자는 예수님이므로, 지시대명사보다 인칭을 드러내는 표현이 한국어 서술에서 더 분명합니다.
- source_word: ἑστήκασιν
  english_pob_choice: are standing
  chosen_korean: 서서
  alternatives_korean:
  - 서 있습니다
  - 서 있는
  - 서 계십니다
  lexicon: BDAG
  rationale: 완료형이 나타내는 현재 상태를 한국어에서 간결하게 살리기 위해 진행/상태적 분사구로 처리했습니다.
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제들
  alternatives_korean:
  - 오빠들
  - 형제자매들
  - 친족들
  lexicon: BDAG
  rationale: POB의 영어 선택처럼 남성 복수의 기본 의미를 유지해 ‘형제들’로 옮겼습니다. 관계를 확장하는 해석은 본문 밖의 문제이므로 여기서는 넣지 않았습니다.
- source_word: ἰδεῖν θέλοντες
  english_pob_choice: wanting to see you
  chosen_korean: 당신을 보려고 합니다
  alternatives_korean:
  - 당신을 보고 싶어 합니다
  - 당신을 만나려고 합니다
  - 당신을 보기를 원합니다
  lexicon: BDAG
  rationale: ἰδεῖν의 기본 의미인 ‘보다’를 유지하면서 θέλοντες의 의지를 한국어 자연문으로 반영했습니다. ‘만나려고’는 더 넓은 해석이어서 피했습니다.
theological_decisions:
- issue: 예수님의 가족을 가리키는 ἀδελφοί의 범위
  chosen_reading: ‘형제들’로 직역해 본문의 어휘를 유지했습니다.
  alternative_readings:
  - 친족들
  - 형제자매들
  - 가족들
  rationale: 이 절만으로는 가족 관계에 대한 신학적 논쟁을 해결하지 않으며, 본문이 실제로 사용하는 일반 명사를 그대로 드러내는 것이 더 투명합니다.
  doctrine_reference: 본문의 어휘적 긴장을 보존하고 조화시키지 않음
