revisions:
- from: 그런데 예수님께 이렇게 전해졌습니다. 「어머니와 형제들이 바깥에 서서 당신을 보려고 합니다」[a]
  to: 그리고 어머니와 형제들이 밖에 서서 예수님을 보려고 한다는 말이 예수님께 전해졌습니다.[a]
  rationale: 간접화법으로 바꾸어 원문의 전달 사건과 내용, 곧 어머니와 형제들이 밖에 서 있으며 예수님을 보기를 원한다는 뜻을 모두 보존했습니다. 이로써 ‘당신’이라는 부자연스러운 호칭을 피하고, δέ의 약한 연결 기능은 ‘그리고’로 절제하여 반영했습니다. ‘형제들’ 및 그 어휘적 대안에 관한 각주는 유지하되 문장을 조금 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:13Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δέ를 ‘그런데’로 옮기면 원문에 없는 뚜렷한 대조·전환의 뉘앙스가 생길 수 있으며, 직접 인용 안의 ‘당신’을 피하는 편이 적절합니다. ἑστήκασιν의 현재 상태, ἔξω의 공간 의미, ἰδεῖν θέλοντες의 목적·의지 의미는 유지되어야 합니다.
  naturalness: ‘예수님께 이렇게 전해졌습니다’는 ‘이렇게’가 다소 군더더기이고, 예수님께 직접 말하는 인용문에서 ‘당신을’은 현대 표준 한국어, 특히 성경의 공적·격식 있는 문체에서 부자연스럽거나 무례하게 들릴 수 있습니다. 간접화법으로 자연스럽게 처리할 수 있습니다.
  terminology: ‘형제들’은 ἀδελφοί의 일반적이고 남성 복수인 의미를 적절히 보존합니다. 각주도 본문의 가족 관계 범위를 신학적으로 단정하지 않고 가능한 넓은 이해를 밝혀 적절합니다.
  issues:
  - severity: medium
    issue: 직접 인용문의 ‘당신을’
    rationale: 현대 한국어에서 ‘당신’은 친밀한 부부 간 호칭 또는 대립적인 호칭으로 들리기 쉬워, 예수님을 향한 전달 말로 자연스럽지 않습니다. 원문의 2인칭을 기계적으로 재현하기보다 간접화법으로 수신자를 명시하면 의미를 보존하면서 자연스러워집니다.
  - severity: low
    issue: δέ를 ‘그런데’로 번역
    rationale: δέ는 여기서 서사를 가볍게 이어 주는 접속사입니다. ‘그런데’는 대조나 예상 밖 전환을 다소 강하게 암시할 수 있으므로 ‘그리고’ 또는 무표지 연결이 더 안전합니다.
  - severity: low
    issue: ‘이렇게’의 첨가
    rationale: 원문에는 전달 내용이 뒤따른다는 뜻의 ‘이렇게’에 해당하는 어휘가 없습니다. 한국어 문장에는 가능하지만 삭제하면 더 간결하고 원문에 가깝습니다.
  revised_text: 그리고 어머니와 형제들이 밖에 서서 예수님을 보려고 한다는 말이 예수님께 전해졌습니다.[a]
  revised_footnotes:
