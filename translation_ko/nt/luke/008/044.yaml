revisions:
- from: 그가 다가오자 뒤에서 옷 술에 손을 대었는데, 즉시 그의 혈루가 멈추었습니다.[a]
  to: 그 여자가 뒤에서 다가와 그의 옷자락에 손을 대자, 즉시 그 여자의 출혈이 멈추었습니다.[a]
  rationale: 여성이 뒤에서 다가와 예수의 옷 가장자리에 접촉했고 그녀의 출혈이 즉시 멈추었다는 헬라어의 주어·소유 관계를 바로잡았습니다. κράσπεδον의 의미 범위는 본문에서 ‘옷자락’으로 유지하고 각주에서 대안을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:11Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 주어와 소유 대명사를 뒤바꾸어, 여자가 다가오고 만진 사건 및 그녀의 출혈이 멈춘 사건이라는 헬라어의 핵심 관계를 훼손합니다. 또한 προσελθοῦσα ὄπισθεν은 예수께 ‘뒤에서 다가온’ 여자를 뜻합니다.
  naturalness: ‘혈루’는 현대 표준어 합쇼체 본문에서는 다소 전문적·고어적이므로 ‘출혈’이 더 자연스럽고 명료합니다. ‘손을 대다’는 접촉의 강도를 과장하지 않아 적절합니다.
  terminology: κρασπέδον은 ‘옷자락’으로 넓게 옮기고, ‘옷단’과 ‘옷 술’을 각주에 제시하면 가장자리·술장식이라는 가능한 의미를 보존할 수 있습니다. ἱμάτιον의 소유자는 예수이므로 ‘그의 옷자락’으로 명시해야 합니다.
  issues:
  - severity: high
    issue: 행위 주체와 대상의 전도
    rationale: 초안의 ‘그가 다가오자’는 여성 주어를 남성으로 바꾸며, ‘그의 혈루’도 αὐτῆς(그 여자의)를 남성 소유로 바꿉니다. 이는 본문의 사건 관계를 변경합니다.
  - severity: medium
    issue: ὄπισθεν의 대상이 불분명함
    rationale: ‘뒤에서’만으로는 누구의 뒤인지 명확하지 않습니다. 문맥상 ‘그의 뒤에서’ 또는 ‘뒤에서 다가와’로 여자의 접근을 분명히 하는 것이 좋습니다.
  - severity: low
    issue: 현대어 어휘 선택
    rationale: ‘혈루’는 전통 성경 용어이지만 현대 독자에게 불투명할 수 있습니다. 원문의 출혈 의미를 ‘출혈’로 자연스럽게 전달할 수 있습니다.
  revised_text: 그 여자가 뒤에서 다가와 그의 옷자락에 손을 대자, 즉시 그 여자의 출혈이 멈추었습니다.[a]
