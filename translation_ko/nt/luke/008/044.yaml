source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
  footnotes:
  - marker: a
    text: Or 'hem' or 'tassel' of his garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 다가오자 뒤에서 옷 술에 손을 대었는데, 즉시 그의 혈루가 멈추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '옷단'이나 '술'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  english_pob_choice: Coming up behind him
  chosen_korean: 다가오자 뒤에서
  alternatives_korean:
  - 뒤에서 다가와
  - 그의 뒤로 다가와
  lexicon: SBLGNT, BDAG
  rationale: aorist 분사와 부사구의 결합을 한국어로 자연스럽게 풀어, 뒤따른 동작을 앞세운 서술 흐름을 살렸습니다.
- source_word: ἥψατο τοῦ κρασπέδου
  english_pob_choice: touched the fringe
  chosen_korean: 옷 술에 손을 대었는데
  alternatives_korean:
  - 옷 술을 만졌는데
  - 옷의 술에 손을 댔는데
  - 옷단을 만졌는데
  lexicon: BDAG
  rationale: κράσπεδον의 기본 의미를 살리되, 한국어 성경 독자가 바로 이해할 수 있도록 '옷 술'을 택했습니다. '손을 대다'는 단순 접촉을 나타내어 ἅπτω의 문맥에 맞습니다.
- source_word: ἱματίου
  english_pob_choice: garment
  chosen_korean: 옷
  alternatives_korean:
  - 겉옷
  - 의복
  lexicon: BDAG
  rationale: ἱμάτιον은 일반적인 겉옷이지만, 문맥상 특정 복장명보다 넓고 자연한 '옷'이 소스에 충실합니다.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  english_pob_choice: her flow of blood stopped
  chosen_korean: 그의 혈루가 멈추었습니다
  alternatives_korean:
  - 그의 피흘림이 멈추었습니다
  - 그녀의 출혈이 멈추었습니다
  lexicon: BDAG
  rationale: ῥύσις τοῦ αἵματος는 지속적인 출혈 상태를 가리키므로, 의미를 직역한 '혈루'를 본문에 두어 질환의 지속성을 보존했습니다.
theological_decisions:
- issue: κρασπέδου의 유대교적 옷술/술 장식 뉘앙스
  chosen_reading: 본문에는 '옷 술'로 두고, 과잉 해석 없이 단순 접촉 사건으로 제시했습니다.
  alternative_readings:
  - 옷단
  - 술장식
  - 끝자락
  rationale: 본문 자체는 토라 술에 대한 명시적 설명을 요구하지 않으므로, 의미는 열어 두되 구체적 상징을 본문에 주입하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
