  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
  footnotes:
  - marker: a
    text: Or 'down the cliff' or 'over the precipice'; the Greek denotes a steep descent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 귀신들이 그 사람에게서 나와 돼지들 속으로 들어갔고, 그 떼는 가파른 비탈을 따라[a] 호수로 내달려 익사했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “절벽 아래로”나 “벼랑 너머로”로도 옮길 수 있습니다. 그리스어는 가파른 내리막을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαιμόνια
  english_pob_choice: demons
  chosen_korean: 귀신들
  alternatives_korean:
  - 악한 영들
  - 더러운 영들
  lexicon: BDAG
  rationale: 이 절의 δαιμόνια는 영어 POB의 'demons'에 맞춰 한국어로는 통상적인 '귀신들'로 옮겨, 별도의 정화된 종교 용어로 바꾸지 않았습니다.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  english_pob_choice: entered the pigs
  chosen_korean: 돼지들에게 들어갔고
  alternatives_korean:
  - 돼지들 안으로 들어갔고
  - 돼지들에게로 들어갔고
  lexicon: BDAG
  rationale: 동작의 방향성과 결과를 자연스러운 한국어로 살리기 위해 '들어갔고'를 택했으며, χοίρους는 현대 표준어의 '돼지들'로 옮겼습니다.
- source_word: ὥρμησεν ἡ ἀγέλη
  english_pob_choice: the herd rushed
  chosen_korean: 그 떼는 … 내달려
  alternatives_korean:
  - 그 떼는 … 달려
  - 그 무리는 … 내달려
  lexicon: BDAG
  rationale: ὥρμησεν의 급작스럽고 힘있는 움직임을 '내달리다'로 살려, 영어 POB의 'rushed'와 같은 속도감과 돌진성을 반영했습니다.
- source_word: κατὰ τοῦ κρημνοῦ
  english_pob_choice: down the steep bank
  chosen_korean: 가파른 비탈을 따라
  alternatives_korean:
  - 가파른 둑을 따라
  - 절벽 아래로
  lexicon: BDAG
  rationale: κρημνός는 반드시 수직 절벽을 뜻하지 않으므로, POB의 판단을 따라 과장하지 않고 '가파른 비탈'로 옮겼습니다.
- source_word: ἀπεπνίγη
  english_pob_choice: drowned
  chosen_korean: 익사했습니다
  alternatives_korean:
  - 물에 빠져 죽었습니다
  - 질식했습니다
  lexicon: BDAG
  rationale: 물속으로 뛰어든 동물들이 죽는 상황이므로, 동사의 결과를 분명히 드러내는 '익사했습니다'가 가장 직접적입니다.
theological_decisions:
- issue: 악령/귀신 용어의 선택
  chosen_reading: 귀신들
  alternative_readings:
  - 악한 영들
  - 더러운 영들
  rationale: 원문이 δαιμόνια를 사용하므로, 관련 개념으로 넓히지 않고 본문의 어휘 자체를 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: κρημνός의 지형적 강도
  chosen_reading: 가파른 비탈
  alternative_readings:
  - 절벽
  - 벼랑
  rationale: 본문은 급경사의 하강을 말하지만 꼭 수직 절벽을 요구하지 않으므로, 사건의 강도는 유지하되 지형 이미지는 과장하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
