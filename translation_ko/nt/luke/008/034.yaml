source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
  footnotes:
  - marker: a
    text: Or 'what had taken place.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the fields'; here it refers to the surrounding rural area or countryside.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그것이 일어난 것을 보고, 도망하여 그 도시와 들판에 알렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일어난 일’.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘들판 안에’이지만, 여기서는 도시 주변의 농촌 지역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  english_pob_choice: When ... saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았을 때
  - 보고 나서
  lexicon: BDAG
  rationale: 분사구문을 한국어에서 자연스럽게 시간 관계로 풀어, 앞선 상황을 본 뒤 이어진 행동을 간결하게 표현했습니다.
- source_word: οἱ βόσκοντες
  english_pob_choice: the herdsmen
  chosen_korean: 그들
  alternatives_korean:
  - 돼지치던 사람들
  - 가축을 치던 사람들
  - 목자들
  lexicon: BDAG
  rationale: 앞 절 문맥에서 이미 돼지를 치던 자들로 식별되므로, 반복을 피하고 대명사로 이어 받아 자연스럽게 처리했습니다. 다만 본문 자체의 직접 표지는 유지했습니다.
- source_word: τὸ γεγονὸς
  english_pob_choice: what had happened
  chosen_korean: 그것이 일어난 것
  alternatives_korean:
  - 일어난 일
  - 무슨 일이 일어났는지
  - 그 사건
  lexicon: BDAG
  rationale: 완료분사적 성격의 γεγονός를 사건의 결과가 이미 성립한 상태로 반영해, 직역보다도 한국어에서 자연스러운 사건 서술로 옮겼습니다.
- source_word: εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς
  english_pob_choice: in the city and in the countryside
  chosen_korean: 그 도시와 들판에
  alternatives_korean:
  - 그 도시와 시골에
  - 도시와 농촌에
  - 그 도시와 주변 지역에
  lexicon: BDAG
  rationale: εἰς가 보고의 확산 방향을 나타내므로 ‘-에’로 옮겼고, ἀγρούς는 도시와 대비되는 주변 농경 지역을 뜻하여 ‘들판’으로 간명하게 살렸습니다.
