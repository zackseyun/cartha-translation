  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “누군가 나를 만졌습니다. 내게서 능력이 나간 것을 내가 알았기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  english_pob_choice: Someone touched me
  chosen_korean: 누군가 나를 만졌습니다
  alternatives_korean:
  - 누가 나를 만졌습니다
  - 아무개가 나를 만졌습니다
  lexicon: ἅπτομαι
  rationale: 육체적 접촉의 직접성을 살리되, 한국어에서 자연스러운 합쇼체로 옮겼습니다. ‘누군가’는 원문의 τις의 비특정성을 잘 드러냅니다.
- source_word: δύναμιν
  english_pob_choice: power
  chosen_korean: 능력
  alternatives_korean:
  - 권능
  - 힘
  lexicon: δύναμις
  rationale: 원문이 말하는 초월적 효력을 한국어로는 ‘능력’이 가장 무리 없이 전달합니다. ‘권능’도 가능하지만 본절의 짧은 진술에서는 다소 문어적입니다.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  english_pob_choice: had gone out from me
  chosen_korean: 내게서 나간
  alternatives_korean:
  - 내게서 떠난
  - 내로부터 흘러나간
  lexicon: ἐξέρχομαι
  rationale: ‘나간’은 원문의 이동 이미지를 직접 반영합니다. POB의 개정된 ‘I knew’와도 맞물리도록 상태의 인식보다 사실 확인에 초점을 둡니다.
theological_decisions:
- issue: 예수의 인식 표현(ἔγνων)
  chosen_reading: “내게서 능력이 나간 것을 내가 알았기 때문입니다”로 옮겨, 단순 추측이나 감지보다 분명한 인식으로 표현했습니다.
  alternative_readings:
  - 내가 느꼈기 때문입니다
  - 내가 알아차렸기 때문입니다
  rationale: 영문 POB가 ‘I knew’로 확정했으므로, 본문이 예수의 실제 인식을 말한다는 점을 분명히 드러내는 번역이 source-grounded합니다.
  doctrine_reference: 예수의 지식/인식에 대한 본문적 진술
