  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
  footnotes:
  - marker: a
    text: Or, “your faith has made you well” or “your faith has healed you.” The Greek verb can refer to healing as well as saving.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 예수께서 그 여자에게 말씀하셨습니다. “딸아, 네 믿음이 너를 구원했습니다. 평안히 가십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 믿음이 너를 낫게 했습니다” 혹은 “네 믿음이 너를 치유했습니다.” 원문의 동사는 치유와 구원을 모두 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  english_pob_choice: Daughter
  chosen_korean: 딸아
  alternatives_korean:
  - 사랑하는 여자여
  - 여자여
  lexicon: BDAG
  rationale: 직접 호격인 ‘Daughter’를 살려 친밀하고 다정한 호칭을 유지했습니다. ‘여자여’는 한국어로 차갑게 들릴 수 있고, ‘사랑하는 여자여’는 원문보다 확장적입니다.
- source_word: πίστις
  english_pob_choice: faith
  chosen_korean: 믿음
  alternatives_korean:
  - 신뢰
  - 신실함
  lexicon: BDAG
  rationale: 원문의 πίστις를 기본값인 ‘믿음’으로 옮겨, 치유 장면 속에서도 그녀의 예수께 대한 믿음을 드러냈습니다.
- source_word: σέσωκέν
  english_pob_choice: has saved
  chosen_korean: 구원하였다
  alternatives_korean:
  - 낫게 하였다
  - 고쳤다
  - 살려 주었다
  lexicon: BDAG
  rationale: σῴζω의 넓은 의미를 살려 ‘구원하였다’로 옮겨, 단순한 육체적 회복으로만 축소하지 않았습니다. 한국어에서는 현재완료의 뉘앙스를 자연스럽게 반영하기 어려워 서술형 완료로 처리했습니다.
- source_word: πορεύου εἰς εἰρήνην
  english_pob_choice: go in peace
  chosen_korean: 평안히 가거라
  alternatives_korean:
  - 평화 가운데 가거라
  - 평안 속으로 가거라
  lexicon: BDAG
  rationale: 관용적 표현을 한국어로 자연스럽게 옮겼습니다. ‘평안히’는 출발의 상태와 축복을 함께 전달하며, ‘평화 가운데’보다 더 간결합니다.
theological_decisions:
- issue: σῴζω의 이중 의미 보존
  chosen_reading: ‘구원하였다’로 번역해 치유와 구원의 의미를 함께 열어 두었습니다.
  alternative_readings:
  - 낫게 하였다
  - 치유하였다
  rationale: 문맥상 육체적 치유가 분명하지만, 원어는 구원과 치유를 모두 포괄할 수 있습니다. 그래서 의미를 좁히지 않고 신학적 긴장을 유지했습니다.
  doctrine_reference: 번역 철학 §3; σῴζω의 다의성을 보존하는 원칙
