id: LUK.8.43
reference: Luke 8:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
  footnotes:
  - marker: a
    text: Or 'with a discharge of blood' or more dynamically 'suffering from bleeding.'
    reason: lexical_alternative
  - marker: b
    text: Greek βίος here means her means of living or resources, not her biological 'life.'
    reason: lexical_alternative
  - marker: c
    text: Some manuscripts, reflected in the Textus Receptus and thus the KJV tradition, add that she 'could not be healed by any' after stating that she had spent all her livelihood on physicians; the SBLGNT text includes the inability clause but not the stronger implication that the physicians failed her by explicit addition beyond this wording.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 열두 해 동안 피가 흐르는 가운데 있었던 한 여인이 있었는데[a], 의사들에게 자기의 모든 생계 수단을 다 써 버렸으나[b] 아무에게서도 고침을 받을 수 없었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면 ‘피의 흐름 가운데’이며, 더 자연스럽게는 ‘출혈을 앓던’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 βίος는 생물학적 ‘생명’이 아니라 생활 자원, 곧 생계 수단을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 사본 전통은 ‘아무에게도’보다 더 강하게 의사들의 무능을 드러내는 문구를 덧붙이지만, 본문(SBLGNT) 자체는 현재 형태의 부정 능력 진술을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  english_pob_choice: a woman who had been
  chosen_korean: 한 여인이 있었는데
  alternatives_korean:
  - 한 여인이었는데
  - 한 여인이 있었고
  lexicon: BDAG
  rationale: 배경 상황을 드러내는 분사구를 한국어 서술로 자연스럽게 풀어, 이야기 흐름을 해치지 않으면서 과거 배경성을 유지했습니다.
- source_word: ἐν ῥύσει αἵματος
  english_pob_choice: in a flow of blood
  chosen_korean: 피가 흐르는 가운데
  alternatives_korean:
  - 피가 흘러나오는 가운데
  - 혈루를 앓고
  lexicon: BDAG
  rationale: 직역에 가까운 ‘피가 흐르는’ 표현으로 구체성을 살리되, 교회적 완곡어인 ‘혈루’는 피했습니다.
- source_word: ὅλον τὸν βίον
  english_pob_choice: her whole livelihood
  chosen_korean: 자기의 모든 생계 수단
  alternatives_korean:
  - 자기가 가진 모든 것
  - 생활비 전부
  lexicon: BDAG
  rationale: βίος가 생물학적 ‘생명’이 아니라 생계 수단/생활 자원을 뜻하므로, 그 의미를 분명히 드러내는 표현을 택했습니다.
- source_word: ἀπ’ οὐδενὸς θεραπευθῆναι
  english_pob_choice: to be healed by anyone
  chosen_korean: 아무에게서도 고침을 받을 수 없었습니다
  alternatives_korean:
  - 아무에게도 낫게 될 수 없었습니다
  - 어느 누구에게서도 치유받을 수 없었습니다
  lexicon: BDAG
  rationale: 수동 부정 능력을 한국어로 자연스럽게 옮기기 위해 ‘고침을 받을 수 없었습니다’로 처리했고, ‘아무에게서도’로 주체 부재를 살렸습니다.
theological_decisions:
- issue: 치유 서술의 표현 방식
  chosen_reading: ‘고침을 받다’로 옮겨, 의학적·종교적 해석을 미리 덧씌우지 않고 본문의 능동적 치유 가능성 부재를 그대로 드러냈습니다.
  alternative_readings:
  - ‘치유받다’
  - ‘낫다’
  rationale: 본문은 단순한 증상 묘사와 치료 실패를 말하므로, 해석을 과도하게 좁히지 않는 표현이 적절합니다.
  doctrine_reference: 본문 문맥상 치유 기적 서술
- issue: 피의 상태 묘사
  chosen_reading: ‘피가 흐르는 가운데’로 비교적 직설적으로 옮겨, 본문의 육체적·정결 문제 가능성을 희석하지 않았습니다.
  alternative_readings:
  - ‘출혈을 앓고 있던’
  - ‘혈루가 있던’
  rationale: 복음서의 서술은 실제 상태를 구체적으로 제시하므로, 전통적 종교용어로 바꾸어 완화하지 않았습니다.
  doctrine_reference: 율법적 정결 규정과 치유 서술의 배경
