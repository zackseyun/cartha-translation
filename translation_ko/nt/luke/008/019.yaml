revisions:
- from: 그의 어머니와 형제들이 그에게 왔지만, 군중 때문에 그에게 닿을 수 없었습니다.[a][b]
  to: 그의 어머니와 형제들[b]이 그에게로 왔으나, 군중 때문에 그에게 다가갈 수 없었습니다.[a]
  rationale: 수정문은 παραγίνομαι와 πρὸς αὐτόν의 이동 의미를 ‘그에게로 왔으나’로 살리고, συντυχεῖν αὐτῷ를 군중 때문에 접근하지 못한 상황에 맞게 ‘그에게 다가갈 수 없었습니다’로 옮겼습니다. ‘형제들’은 그대로 보존하여 관계에 관한 후대의 해석을 본문에 부가하지 않았습니다. 각주 a의 비문을 바로잡고, 각주 b를 ‘형제들’ 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:11Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그에게 닿을 수 없었습니다’는 물리적으로 접촉할 수 없었다는 뜻으로도 읽혀 συντυχεῖν의 문맥상 ‘그에게 접근하여 만나지 못하다’라는 의미를 충분히 드러내지 못합니다. ‘그에게로 왔으나’와 ‘그에게 다가갈 수 없었습니다’가 원문의 이동과 군중으로 인한 접근 불능을 더 정확히 전달합니다.
  naturalness: 합쇼체 문체는 적절합니다. 그러나 ‘그에게 왔지만’보다 ‘그에게로 왔으나’가 한국어에서 이동의 방향을 더 자연스럽고 분명하게 나타냅니다. 각주 a의 ‘그에게 만나려’는 문법적으로 자연스럽지 않아 고쳐야 합니다.
  terminology: ‘어머니’, ‘형제들’, ‘군중’은 적절합니다. ἀδελφοί를 ‘형제들’로 유지하고 더 넓은 친족 관계에 관한 해석을 각주에서만 언급한 것은 원문과 번역 원칙에 부합합니다.
  issues:
  - severity: medium
    issue: ‘그에게 닿을 수 없었습니다’의 의미 범위
    rationale: 한국어 ‘닿다’는 접촉·도달의 뜻이 강하여, 군중 때문에 예수께 접근하여 만날 수 없었다는 συντυχεῖν의 문맥적 의미를 다소 좁히거나 어색하게 만들 수 있습니다.
  - severity: medium
    issue: 각주 a의 대안 표현 비문
    rationale: ‘그에게 만나려’는 한국어 문법상 자연스럽지 않습니다. ‘그를 만날 수 없었다’ 또는 ‘그에게 다가갈 수 없었다’처럼 서술어와 목적격을 갖춘 표현으로 고쳐야 합니다.
  - severity: low
    issue: 각주 b의 앵커 위치
    rationale: ‘형제들’의 의미를 설명하는 각주는 해당 단어 바로 뒤에 두는 편이 독자가 각주의 지시 대상을 분명히 알 수 있습니다.
