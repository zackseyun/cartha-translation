  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
  footnotes:
  - marker: a
    text: Or 'to meet with him' or 'to get to him.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'brothers'; some interpret this more broadly as 'relatives' or 'kinsmen,' but the text itself says 'brothers.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 어머니와 형제들[b]이 그에게로 왔으나, 군중 때문에 그에게 다가갈 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 만날 수 없었다’ 또는 ‘그에게 다가갈 수 없었다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘형제들’이라고 말합니다. 어떤 이들은 이를 더 넓게 ‘친족들’ 또는 ‘가족들’로 이해하기도 하지만, 본문 자체는 ‘형제들’이라고 적고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 도착했습니다
  - 찾아왔습니다
  lexicon: BDAG
  rationale: παραγίνομαι는 여기서 예수의 가족이 그에게 다가온 사건을 서술하므로, 단순하고 자연스러운 ‘왔습니다’가 가장 잘 맞습니다.
- source_word: πρὸς αὐτὸν
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를 향해
  - 그를 만나러
  lexicon: BDAG
  rationale: πρός + 대격은 사람에게로의 이동을 가리키므로, 목적을 덧붙이지 않는 ‘그에게’가 원문에 가장 가깝습니다.
- source_word: ἀδελφοὶ
  english_pob_choice: brothers
  chosen_korean: 형제들
  alternatives_korean:
  - 오빠들
  - 남자 형제들
  - 친족들
  lexicon: BDAG
  rationale: 그리스어는 남성 복수형이며 본문 자체가 ‘형제들’이라고 말하므로, 의미를 넓혀 친족으로 바꾸지 않고 그대로 옮겼습니다.
- source_word: συντυχεῖν αὐτῷ
  english_pob_choice: to reach him
  chosen_korean: 그에게 닿을 수 없었습니다
  alternatives_korean:
  - 그를 만날 수 없었습니다
  - 그에게 다가갈 수 없었습니다
  lexicon: BDAG
  rationale: 군중 때문에 실제로 접촉하거나 접근하지 못했다는 뜻이므로, ‘닿을 수 없었습니다’가 막혀 있는 상황을 가장 분명하게 드러냅니다.
- source_word: διὰ τὸν ὄχλον
  english_pob_choice: because of the crowd
  chosen_korean: 군중 때문에
  alternatives_korean:
  - 무리 때문에
  - 사람들 때문에
  lexicon: BDAG
  rationale: διά + 대격은 원인을 나타내므로, 현대 한국어에서 가장 자연스러운 원인 표현인 ‘때문에’로 옮겼습니다.
theological_decisions:
- issue: ἀδελφοὶ의 범위
  chosen_reading: 본문의 표면 의미대로 ‘형제들’로 옮기고, 친족이나 사촌으로 해석을 좁히지 않았습니다.
  alternative_readings:
  - 친족들
  - 사촌들
  - 남자 형제들
  rationale: 본문의 그리스어는 ἀδελφοί이며, 본문 자체는 그 관계를 더 구체화하지 않습니다. 따라서 후대 교리 논쟁을 번역에 미리 반영하지 않고 문면 그대로 유지합니다.
  doctrine_reference: 본문 우선 원칙; 마리아의 항존동정 교리 논쟁을 번역에서 결정하지 않음
