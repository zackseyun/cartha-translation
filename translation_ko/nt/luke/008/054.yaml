id: LUK.8.54
reference: Luke 8:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
  footnotes:
  - marker: a
    text: Or “Girl, get up.” The Greek παῖς can mean “child” or, in context, “girl.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀의 손을 잡고 외치며 말했습니다. 「아이야, 일어나라」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς δὲ
  english_pob_choice: But he
  chosen_korean: 그가
  alternatives_korean:
  - 그런데 그가
  - 그 자신이
  lexicon: BDAG
  rationale: δέ의 전환감을 살리면서도 한국어에서는 자연스러운 주어로 처리했습니다. αὐτός의 약한 강조는 굳이 ‘그 자신이’로 옮기지 않았습니다.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  english_pob_choice: took her by the hand
  chosen_korean: 그녀의 손을 잡고
  alternatives_korean:
  - 그녀의 손을 붙잡고
  - 그녀의 손을 움켜잡고
  lexicon: BDAG
  rationale: κρατέω는 여기서 폭력적 ‘붙들다’보다 접촉 동작인 ‘손을 잡다’가 자연스럽고, γενitive 구조도 한국어에서 매끄럽게 풀어 옮길 수 있습니다.
- source_word: ἐφώνησεν λέγων
  english_pob_choice: called out, saying
  chosen_korean: 외치며 말했습니다
  alternatives_korean:
  - 불러 말했습니다
  - 소리쳐 말했습니다
  lexicon: BDAG
  rationale: ἐφώνησεν은 단순한 ‘말하다’보다 청각적으로 들리는 호출을 나타내므로 ‘외치며’가 적절합니다. λέγων은 한국어에서 중복을 피하기 위해 자연스럽게 연결했습니다.
- source_word: Ἡ παῖς
  english_pob_choice: Child
  chosen_korean: 아이야
  alternatives_korean:
  - 딸아
  - 소녀야
  - 어린아
  lexicon: BDAG
  rationale: παῖς의 의미 범위를 ‘아이’로 넓게 보존해 POB의 ‘Child’와 대응시켰습니다. 문맥상 딸이지만, ‘소녀’는 의미를 좁히고 ‘딸아’는 원문에 없는 가족관계를 전면화합니다.
- source_word: ἔγειρε
  english_pob_choice: arise
  chosen_korean: 일어나라
  alternatives_korean:
  - 일어나
  - 깨어나라
  - 일어서라
  lexicon: BDAG
  rationale: ἐγείρω의 명령형을 현대 한국어의 직접적이고 또렷한 명령인 ‘일어나라’로 옮겼습니다. 장엄한 ‘일어나라’가 문맥의 기적적 부름을 잘 드러냅니다.
theological_decisions:
- issue: 예수의 명령 어조
  chosen_reading: 직접 명령형으로 유지했습니다.
  alternative_readings:
  - 완곡한 청유형
  - 더 전통적인 경어식 종결
  rationale: 원문은 회복을 일으키는 권위 있는 직접 명령이므로, 한국어에서도 힘을 약화시키지 않도록 그대로 명령형으로 옮겼습니다.
  doctrine_reference: Translation philosophy §6
