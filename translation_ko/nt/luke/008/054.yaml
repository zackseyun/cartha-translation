- from: 그가 그녀의 손을 잡고 외치며 말했습니다. 「아이야, 일어나라」
  to: 그런데 그는 그 아이의 손을 잡고 큰 소리로 말했습니다. “아이야, 일어나라.”
  rationale: 원문의 서사 전환, 손을 잡는 행위, 들리는 호출, 성별을 특정하지 않는 호칭, 직접 명령을 모두 유지하면서 현대 표준 한국어의 자연스러운 문장으로 다듬었습니다. 영어 POB의 각주가 설명하는 παῖς의 대안 의미는 한국어 ‘아이’가 이미 해당 의미 범위를 보존하므로 별도 각주가 필요하지 않습니다.
