  source_fidelity: ‘열두 제자’는 본문이 사용하는 집단 명칭 οἱ δώδεκα(‘열둘’)보다 구체적입니다. 또한 각주 표지는 해당 어구에 직접 붙여야 합니다. 나머지 내용은 반복적으로 여러 성읍과 마을을 다니며 선포하고 복음을 전한 의미를 잘 전달합니다.
  naturalness: 문장을 둘로 나누고 ‘열둘’을 사용하면 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다. ‘그 후 얼마 지나지 않아’는 루가의 순차적 시간 전환을 자연스럽게 나타냅니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ의 폭넓은 의미를 보존하는 적절한 번역입니다. κηρύσσων과 εὐαγγελιζόμενος의 구별도 ‘선포하시고 복음을 전하셨습니다’로 유지됩니다.
  issues:
