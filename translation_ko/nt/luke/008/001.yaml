translation:
  language: ko
  text: 그리고 그 후 얼마 지나지 않아, 예수님께서는 성읍에서 성읍으로, 마을에서 마을로[a] 다니시며 하나님의 나라[b]를 선포하시고 복음을 전하셨습니다. 열둘이 그분과 함께 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍과 마을을 이리저리 두루.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 통치.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  english_pob_choice: it happened soon afterward
  chosen_korean: 그리고 얼마 뒤에
  alternatives_korean:
  - 그 일이 얼마 뒤에 일어났습니다
  - 곧이어
  lexicon: BDAG
  rationale: 루가의 서술 전환표지를 자연스러운 한국어 시간 부사구로 옮기되, 사건의 연속성을 살려 과도한 의역을 피했습니다.
- source_word: διώδευεν κατὰ πόλιν καὶ κώμην
  english_pob_choice: was traveling through city after city and village after village
  chosen_korean: 성읍과 마을을 이리저리 두루 다니시며
  alternatives_korean:
  - 성읍마다 마을마다 다니시며
  - 도시와 마을을 지나 다니시며
  lexicon: BDAG
  rationale: 반복적·분산적 이동의 뉘앙스를 살리기 위해 단순한 ‘지나가다’보다 ‘이리저리 두루 다니다’를 택했습니다.
- source_word: κηρύσσων καὶ εὐαγγελιζόμενος
  english_pob_choice: proclaiming and bringing the good news
  chosen_korean: 선포하고 복음을 전하셨으며
  alternatives_korean:
  - 전파하고 좋은 소식을 전하시며
  - 선포하며 복음을 알리시며
  lexicon: BDAG
  rationale: 두 분사 사이의 구분을 유지하면서도 한국어에서 중복이 덜하도록 ‘선포하다’와 ‘복음을 전하다’를 병렬로 옮겼습니다.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  english_pob_choice: the kingdom of God
  chosen_korean: 하나님의 나라
  alternatives_korean:
  - 하나님의 왕국
  - 하나님의 통치
  lexicon: BDAG
  rationale: POB 기본 용례를 따라 직역적이면서도 문맥상 가장 자연스러운 ‘하나님의 나라’를 사용했습니다.
- source_word: οἱ δώδεκα
  english_pob_choice: the Twelve
  chosen_korean: 열두 제자
  alternatives_korean:
  - 열둘
  - 열두 사람
  lexicon: BDAG
  rationale: 문맥상 예수님을 따르는 그룹을 가리키므로 한국어 독자에게 더 분명한 ‘열두 제자’를 택했습니다.
theological_decisions:
- issue: τὴν βασιλείαν τοῦ θεοῦ의 번역 범위
  chosen_reading: 하나님의 나라
  alternative_readings:
  - 하나님의 통치
  - 하나님의 왕국
  rationale: ‘나라’는 공간적 왕국과 통치의 동적 의미를 함께 담을 수 있어, 본문의 신학적 폭을 좁히지 않습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
