revisions:
- from: 그리고 얼마 뒤에 그는 성읍과 마을을 이리저리 두루 다니시며 하나님의 나라를 선포하고 복음을 전하셨으며, 열두 제자가 그와 함께 있었습니다.[a][b]
  to: 그리고 그 후 얼마 지나지 않아, 예수님께서는 성읍에서 성읍으로, 마을에서 마을로[a] 다니시며 하나님의 나라[b]를 선포하시고 복음을 전하셨습니다. 열둘이 그분과 함께 있었습니다.
  rationale: 원문의 οἱ δώδεκα를 해석적으로 확장하지 않고 ‘열둘’로 옮겼습니다. 시간 전환은 한국어 서술에서 자연스럽게 ‘그 후 얼마 지나지 않아’로 표현했으며, 이동의 분산·반복 의미는 ‘성읍에서 성읍으로, 마을에서 마을로’로 보존했습니다. 각주 표지는 해당 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:10Z'
review_pass:
