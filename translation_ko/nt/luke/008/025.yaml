id: LUK.8.25
reference: Luke 8:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
  footnotes:
  - marker: a
    text: Or “trust.” Jesus’ question can also be understood as, “Where is your trust?”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. 「너희의 믿음[a]이 어디에 있느냐?」 그들이 두려워하며 놀라서, 서로 말했습니다. 「그렇다면 이분은 누구시기에 바람과 물에도 명령하시며, 그것들이 그분께 순종하는가?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿음’은 여기서 문맥상 ‘신뢰’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ ἡ πίστις ὑμῶν
  english_pob_choice: Where is your faith?
  chosen_korean: 너희의 믿음이 어디에 있느냐?
  alternatives_korean:
  - 너희의 믿음이 어디 있느냐?
  - 너희의 신뢰가 어디 있느냐?
  lexicon: BDAG
  rationale: Ποῦ는 위치를 묻는 말이므로 ‘어디에/어디 있느냐’로 옮겨 질문의 직접성을 살렸고, πίστις는 본문 주석과 용어표에 따라 기본어인 ‘믿음’을 유지했습니다.
- source_word: φοβηθέντες
  english_pob_choice: being afraid
  chosen_korean: 두려워하며
  alternatives_korean:
  - 무서워하며
  - 두려움을 느끼며
  lexicon: BDAG
  rationale: 분사 구조를 한국어의 연결 어미로 자연스럽게 풀어, 두려움이 놀라움과 함께 진행되는 장면의 흐름을 살렸습니다.
- source_word: ἐθαύμασαν
  english_pob_choice: they marveled
  chosen_korean: 놀라서
  alternatives_korean:
  - 경탄했습니다
  - 몹시 놀랐습니다
  lexicon: BDAG
  rationale: θαυμάζω의 놀람과 경이의 반응을 현대 한국어에서 자연스럽게 드러내면서, 뒤의 대화로 이어지는 감정 반응을 유지했습니다.
- source_word: Τίς ἄρα οὗτός ἐστιν
  english_pob_choice: Who then is this
  chosen_korean: 그렇다면 이분은 누구시기에
  alternatives_korean:
  - 도대체 이분은 누구시기에
  - 그렇다면 이분은 누구신가
  lexicon: BDAG
  rationale: ἄρα의 추론·놀람의 뉘앙스를 ‘그렇다면’으로 살리고, 질문의 대상이 예수이므로 존칭형을 사용했습니다.
- source_word: τοῖς ἀνέμοις καὶ τῷ ὕδατι
  english_pob_choice: the winds and the water
  chosen_korean: 바람과 물에도
  alternatives_korean:
  - 바람과 물에게도
  - 바람과 물에
  lexicon: BDAG
  rationale: 그리스어의 ‘바람들’과 ‘물’을 그대로 따라가되, 한국어에서는 명령의 대상을 자연스럽게 드러내기 위해 조사만 최소한으로 조정했습니다.
theological_decisions:
- issue: Jesus addressed in direct quotation with honorific verb forms
  chosen_reading: 서술과 인용문 모두 합쇼체를 유지하되, 예수님에 대한 질문에서는 존칭 표현(‘이분은 누구시기에’, ‘명령하시며’)을 사용했습니다.
  alternative_readings:
  - 평서체로만 통일하는 방식
  - 더 전통적인 교회체 어휘를 쓰는 방식
  rationale: 본문의 서술은 현대 공식체가 적합하고, 인용문 안에서도 예수의 위상을 드러내는 존칭이 원문의 경외와 놀람을 더 잘 전달합니다.
  doctrine_reference: POB Korean style guidance; honorific speech in direct reference to Jesus
