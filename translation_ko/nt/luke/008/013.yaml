id: LUK.8.13
reference: Luke 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
  footnotes:
  - marker: a
    text: Or 'in a time of temptation' or 'when trial comes.' The Greek term can refer to testing, trial, or temptation depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바위 위에 있는 사람들은 말씀을 들을 때 기쁨으로 말씀을 받습니다. 그러나 그들은 뿌리가 없어 잠시 믿다가 시험의 때가 오면 떨어져 나갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: πειρασμός는 문맥에 따라 ‘시험’, ‘시련’, ‘유혹’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  english_pob_choice: on the rock
  chosen_korean: 바위 위에 있는 사람들
  alternatives_korean:
  - 바위 위에 있는 이들
  - 반석 위에 있는 사람들
  lexicon: BDAG
  rationale: πέτρα를 구체적인 ‘바위’로 옮기고, 위치 표현은 한국어에서 자연스러운 ‘-위에 있는’으로 풀어 원문의 이미지와 구조를 보존했습니다.
- source_word: δέχονται τὸν λόγον
  english_pob_choice: receive the word
  chosen_korean: 말씀을 받습니다
  alternatives_korean:
  - 말씀을 받아들입니다
  - 말씀을 맞아들입니다
  lexicon: BDAG
  rationale: δέχομαι의 핵심은 ‘받다/영접하다’이므로, 복음서 문맥에 익숙하면서도 원문에 가까운 ‘말씀을 받다’로 옮겼습니다.
- source_word: ῥίζαν οὐκ ἔχουσιν
  english_pob_choice: have no root
  chosen_korean: 뿌리가 없어
  alternatives_korean:
  - 뿌리가 없어서
  - 뿌리를 갖지 못해
  lexicon: BDAG
  rationale: 단수 ‘뿌리’를 그대로 살려 은유를 간결하게 유지했고, 한국어에서는 이유를 나타내는 ‘-어’ 구조가 가장 자연스럽습니다.
- source_word: ἐν καιρῷ πειρασμοῦ
  english_pob_choice: in a time of testing
  chosen_korean: 시험의 때가 오면
  alternatives_korean:
  - 시험의 때에
  - 시련의 때가 오면
  - 유혹의 때가 오면
  lexicon: BDAG
  rationale: πειρασμός의 범위를 좁히지 않기 위해 기본 의미인 ‘시험’으로 두되, 시간적 상황을 한국어에서 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ἀφίστανται
  english_pob_choice: they fall away
  chosen_korean: 떨어져 나갑니다
  alternatives_korean:
  - 물러갑니다
  - 떠나갑니다
  - 배교합니다
  lexicon: BDAG
  rationale: 문맥상 지속하던 믿음에서 이탈하는 뜻을 살리면서도, 한국어에서 과도하게 신학화된 용어를 피하고 이미지적 동작을 유지했습니다.
theological_decisions:
- issue: πιστεύουσιν의 믿음이 구원적 믿음인지 일시적 호감인지
  chosen_reading: ‘잠시 믿다가’로 옮겨, 믿음의 성격을 단정하지 않고 본문이 말하는 시간적 한계와 이탈을 그대로 드러냈습니다.
  alternative_readings:
  - 잠시 믿습니다
  - 일시적으로 믿습니다
  - 겉으로만 믿습니다
  rationale: 원문은 ‘잠시 믿는다’와 ‘떨어져 나간다’를 함께 말할 뿐, 이 믿음의 구원론적 성격을 해설하지 않습니다. 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: 번역은 본문의 진술을 보존하고 구원론적 판정을 유보합니다.
- issue: πειρασμοῦ의 의미 범위
  chosen_reading: ‘시험’으로 기본 번역하되, 특정한 ‘유혹’이나 ‘시련’으로 한정하지 않았습니다.
  alternative_readings:
  - 유혹
  - 시련
  - 시험받는 때
  rationale: πειρασμός는 문맥에 따라 시험·시련·유혹을 모두 가리킬 수 있으므로, 가장 넓은 의미를 살린 ‘시험’이 본문에 가장 적합합니다.
  doctrine_reference: 어휘 범위를 좁히지 않고 문맥의 폭을 보존합니다.
