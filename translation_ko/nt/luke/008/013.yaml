  to: 바위 위에 떨어진 씨는 말씀을 들을 때 기쁨으로 말씀을 받아들이는 사람들입니다. 그러나 이들은 뿌리가 없습니다. 한동안 믿지만 시험의 때에[a] 믿음에서 떠나갑니다.
