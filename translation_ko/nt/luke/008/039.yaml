id: LUK.8.39
reference: Luke 8:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
  footnotes:
  - marker: a
    text: Or 'all that God has done for you.' The Greek is literally 'what things God did for you'; 'great things' brings out the magnitude implied in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 집으로 돌아가서, 하나님이 네게 행하신 것을 말하라. 그 사람은 떠나 온 도시를 두루 다니며 예수께서 자기에게 행하신 것을 선포하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  english_pob_choice: Return
  chosen_korean: 돌아가서
  alternatives_korean:
  - 되돌아가서
  - 가서
  lexicon: BDAG
  rationale: ὑποστρέφε의 명령형은 이전 장소로 되돌아가라는 지시이므로, 현대 한국어에서는 간결한 ‘돌아가서’가 가장 자연스럽습니다.
- source_word: εἰς τὸν οἶκόν σου
  english_pob_choice: to your house
  chosen_korean: 네 집으로
  alternatives_korean:
  - 네 집에
  - 네 가정으로
  lexicon: BDAG
  rationale: οἶκος는 여기서 공간적 귀환을 가리키므로 ‘집’이 적절하며, 한국어에서는 ‘네 집으로’가 원문의 방향성을 잘 드러냅니다.
- source_word: διηγοῦ ὅσα σοι ἐποίησεν ὁ θεός
  english_pob_choice: tell what God has done for you
  chosen_korean: 하나님이 네게 행하신 것을 말하라
  alternatives_korean:
  - 하나님이 네게 하신 모든 것을 말하라
  - 하나님이 네게 행하신 큰 일들을 말하라
  lexicon: BDAG
  rationale: ὅσα는 본문상 ‘무엇을/무엇이나’에 가깝고, 원문에 없는 ‘큰’은 넣지 않았습니다. ‘행하신 것’은 ἐποίησεν의 폭넓은 의미를 비교적 직접적으로 옮깁니다.
- source_word: κηρύσσων
  english_pob_choice: proclaiming
  chosen_korean: 선포하였습니다
  alternatives_korean:
  - 전파하였습니다
  - 알렸습니다
  lexicon: BDAG
  rationale: κηρύσσω는 단순히 말하는 것보다 공개적으로 알리는 선포의 뉘앙스가 강하므로, 현대 한국어에서는 ‘선포하다’가 가장 가깝습니다.
theological_decisions:
- issue: 본문의 병렬 구조에서 ‘하나님’과 ‘예수’의 주어가 다르게 제시됨
  chosen_reading: 앞 절에서는 하나님이 하신 일로, 뒤 절에서는 예수께서 하신 일로 각각 그대로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 하나님으로 통일하기
  - 둘 다 예수로 통일하기
  - 예수는 하나님이 하신 일이라는 설명을 덧붙이기
  rationale: 누가는 명령 부분과 선포 부분을 병렬로 배치해 예수와 하나님의 관계를 독자에게 스스로 보게 합니다. 번역에서 이를 평준화하지 않고 그대로 보존하는 것이 원문의 신학적 긴장을 살립니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
