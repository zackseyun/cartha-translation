revisions:
- from: 네 집으로 돌아가서, 하나님이 네게 행하신 것을 말하라. 그 사람은 떠나 온 도시를 두루 다니며 예수께서 자기에게 행하신 것을 선포하였습니다.
  to: “당신의 집으로 돌아가십시오. 하나님께서 당신에게 하신 모든 일을 이야기하십시오.” 그는 떠나 온 도시 곳곳에서 예수께서 자기에게 하신 모든 일을 선포했습니다.
  rationale: 원문에 없는 ‘큰’이라는 수식은 추가하지 않고, ὅσα의 포괄성은 ‘모든 일’로 옮겼습니다. 하나님과 예수의 병렬 및 수혜자를 가리키는 대명사(당신에게/자기에게)를 보존했습니다. 직접 명령과 서술을 현대 표준 한국어 합쇼체로 일관되게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:11Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. ὅσα는 ‘무엇을’보다 ‘모든 것/모든 일’을 나타내므로 두 절에서 그 포괄성을 드러내는 편이 적절합니다. 또한 원문은 앞절의 하나님과 뒷절의 예수를 의도적으로 병렬시킵니다. ‘큰 일’은 원문에 명시되지 않았으므로 넣지 않았습니다.
  naturalness: 초안의 ‘네게 행하신 것’과 ‘자기에게 행하신 것’은 문법적으로 가능하지만 현대 표준 한국어에서는 다소 경직되고, 합쇼체 직접 화법의 ‘네’와 서술의 ‘선포하였습니다’가 등록상 고르지 않습니다. ‘당신에게 하신 모든 일’ 및 ‘선포했습니다’가 자연스럽고 일관됩니다.
  terminology: ‘하나님’, ‘예수’, ‘선포하다’는 적절합니다. 다만 ‘행하신 것’보다 ‘하신 모든 일’이 ἐποίησεν과 ὅσα를 자연스럽게 함께 반영합니다.
  issues:
  - severity: medium
    issue: ὅσα의 포괄성이 ‘것’으로 충분히 드러나지 않음
    rationale: ὅσα는 ‘모든 것/모든 일’을 뜻합니다. 양쪽 병렬절에 ‘모든 일’을 사용하여 원문의 범위와 대칭을 보존하는 것이 좋습니다.
  - severity: low
    issue: 직접 화법의 등록과 서술체 종결이 일관되지 않음
    rationale: 요청된 현대 합쇼체에 맞추어 명령은 ‘-십시오’, 서술은 ‘-했습니다’로 맞추는 편이 적절합니다.
  - severity: low
    issue: ‘온 도시를 두루 다니며’가 다소 장황함
    rationale: καθ’ ὅλην τὴν πόλιν은 도시 전역이라는 범위를 나타냅니다. ‘온 도시 곳곳에서’는 이동 자체를 과도하게 부각하지 않고 분포적 의미를 자연스럽게 전달합니다.
  revised_text: “당신의 집으로 돌아가십시오. 하나님께서 당신에게 하신 모든 일을 이야기하십시오.” 그는 떠나 온 도시 곳곳에서 예수께서 자기에게 하신 모든 일을 선포했습니다.
  revised_footnotes: []
  revision_rationale: 원문에 없는 ‘큰’이라는 수식은 추가하지 않고, ὅσα의 포괄성은 ‘모든 일’로 옮겼습니다. 하나님과 예수의 병렬 및 수혜자를 가리키는 대명사(당신에게/자기에게)를 보존했습니다. 직접 명령과 서술을 현대 표준 한국어 합쇼체로 일관되게 다듬었습니다.
