  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
  footnotes:
  - marker: a
    text: Some manuscripts and parallel Gospel passages read 'Gadarenes' or 'Gergesenes.'
    reason: textual_variant
translation:
  language: ko
  text: 그들은 배를 타고 갈릴리 맞은편에 있는 게라사 사람들의 지역에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 평행 복음서 본문은 ‘가다라 사람들’ 또는 ‘게르게사 사람들’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  english_pob_choice: sailed down
  chosen_korean: 배를 타고 갔습니다
  alternatives_korean:
  - 배를 타고 내려갔습니다
  - 배로 갔습니다
  - 항해하여 갔습니다
  lexicon: BDAG
  rationale: καταπλέω는 물길을 따라 목적지에 도착한다는 뜻이지만, 한국어에서는 ‘내려가다’의 방향감을 굳이 살리면 부자연스러울 수 있어, 결과를 분명히 하는 ‘배를 타고 갔습니다’로 옮겼습니다.
- source_word: χώραν
  english_pob_choice: region
  chosen_korean: 지역
  alternatives_korean:
  - 지역
  - 지방
  - 땅
  lexicon: BDAG
  rationale: χώρα는 현대 한국어의 ‘국가’보다 ‘지역/지방’이 더 정확하므로, 문맥상 가장 자연스러운 ‘지역’을 선택했습니다.
- source_word: Γερασηνῶν
  english_pob_choice: Gerasenes
  chosen_korean: 게라사인들
  alternatives_korean:
  - 게라사 사람들
  - 게라사 주민들
  lexicon: BDAG
  rationale: 지명에서 파생된 집단명은 한국어 성서 번역 관례에 따라 음역하고 복수 의미를 살리기 위해 ‘-인들’로 옮겼습니다.
- source_word: ἀντιπέρα τῆς Γαλιλαίας
  english_pob_choice: opposite Galilee
  chosen_korean: 갈릴리 맞은편에 있는
  alternatives_korean:
  - 갈릴리 건너편에 있는
  - 갈릴리 반대편에 있는
  - 갈릴리 건너편의
  lexicon: BDAG
  rationale: ἀντιπέρα는 ‘맞은편/건너편’을 뜻하므로, 지리적 대비를 자연스럽게 드러내는 ‘맞은편에 있는’으로 옮겼습니다.
theological_decisions:
- issue: 본문의 지명 전승 차이
  chosen_reading: 본문은 게라사인들을 따르되, 본문 각주로 다른 전승 가능성을 알립니다.
  alternative_readings:
  - 가다라인들
  - 게르게사인들
  rationale: SBLGNT 본문이 Γερασηνῶν을 읽으므로 이를 그대로 반영하되, 공관복음 평행본문과 사본 전통의 차이를 숨기지 않기 위해 각주로 남깁니다.
  doctrine_reference: 본문비평/사본 전승
