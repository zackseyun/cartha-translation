id: LUK.8.4
reference: Luke 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
  footnotes:
  - marker: a
    text: Or 'he spoke in a parable.' The Greek expression διὰ παραβολῆς can be understood as indicating means or manner.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 큰 무리가 모여들고, 여러 마을에서 사람들이 그에게 나아오고 있었습니다. 그는 비유로 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비유 안에서’로도 옮길 수 있습니다. 헬라어 표현 διὰ παραβολῆς는 수단이나 방식을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  english_pob_choice: was gathering
  chosen_korean: 모여들고 있었습니다
  alternatives_korean:
  - 모이고 있었습니다
  - 모여가고 있었습니다
  lexicon: BDAG
  rationale: 진행 중인 상황을 나타내는 속격 절대구로, 단순 과거보다 진행형이 더 잘 맞습니다. ‘모여들다’는 군중이 한데 모이는 움직임을 자연스럽게 드러냅니다.
- source_word: ὄχλου πολλοῦ
  english_pob_choice: a large crowd
  chosen_korean: 큰 무리
  alternatives_korean:
  - 큰 군중
  - 많은 무리
  lexicon: BDAG
  rationale: ὄχλος는 ‘무리/군중’의 뜻이며 πολλοῦ가 규모를 강조합니다. 한국어에서는 ‘큰 무리’가 자연스럽고 본문의 규모감을 잘 살립니다.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  english_pob_choice: people from town after town were coming
  chosen_korean: 여러 마을에서 사람들이 ... 나아오고 있었습니다
  alternatives_korean:
  - 도시마다 사람들이 ... 오고 있었습니다
  - 마을마다 사람들이 ... 나아오고 있었습니다
  lexicon: BDAG
  rationale: κατὰ πόλιν의 분배적 뉘앙스를 ‘여러 마을에서’로 풀어, 한 곳이 아니라 여러 지역에서 사람들이 오는 모습을 전달했습니다.
- source_word: διὰ παραβολῆς
  english_pob_choice: by a parable
  chosen_korean: 비유로
  alternatives_korean:
  - 비유 안에서
  - 비유를 통해
  lexicon: BDAG
  rationale: διά + 속격은 수단/방식을 나타낼 수 있으므로, 한국어에서는 간결하게 ‘비유로’가 가장 직접적입니다. 이는 말의 방식이 비유였다는 점을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 예수의 발화 도입을 ‘말씀하셨습니다’로 처리할지 여부
  chosen_reading: ‘그는 비유로 말씀하셨습니다’로 옮겨, 단순한 발화가 아니라 가르침의 권위를 드러냈습니다.
  alternative_readings:
  - 그는 비유로 말했습니다
  - 그는 비유를 들어 말씀하셨습니다
  rationale: 뒤의 διὰ παραβολῆς가 말의 방식뿐 아니라 예수의 가르침 행위를 지시하므로, 한국어에서는 존대형의 ‘말씀하셨습니다’가 본문 기능을 잘 반영합니다.
  doctrine_reference: 복음서의 예수 발화 표지
