  source_fidelity: 초안의 ‘못하게 하십니다’는 ἵνα절의 접속법을 하나님이 직접 그렇게 행하신다는 직설적 사역 구문으로 바꾸어, 원문의 목적/결과의 긴장을 다소 과도하게 확정합니다. 또한 ‘비유로 하십니다’는 무엇을 ‘한다’는지 불명확합니다. ‘비유로 주어졌습니다’는 그리스어의 수동태와 생략을 자연스럽게 보충합니다.
