  terminology: ‘하나님 나라’, ‘비밀들’, ‘비유’, ‘깨닫다’를 유지했습니다. ‘비밀들’은 μυστήρια의 복수 및 계시된 진리라는 성경적 용례를 보존하며, ‘알다’와 συνίημι의 ‘깨닫다’를 구별합니다.
