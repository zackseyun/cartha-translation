  to: 그분이 말씀하셨습니다. 「너희에게는 하나님 나라의 비밀들[a]을 알도록 주어졌습니다. 그러나 나머지 사람들에게는 비유로 주어졌습니다[c]. 이는 그들이 보아도 보지 못하고, 들어도 깨닫지 못하도록 하려는 것입니다[b].」
  rationale: 그리스어의 완료 수동태 δέδοται를 두 대조 절에서 ‘주어졌습니다’로 자연스럽게 보충하고, ἵνα절은 목적과 결과 가운데 하나로 단정하지 않는 ‘…못하도록 하려는 것입니다’로 옮겼습니다. ‘보아도/들어도’는 영어 감사 기록의 concessive ‘though seeing/hearing’ 및 이사야 반향을 반영합니다. 각주는 해당 어휘와 절에 직접 연결했습니다.
