id: LUK.8.10
reference: Luke 8:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
  footnotes:
  - marker: a
    text: Or 'secrets.' The Greek 'mysteries' refers to truths of God's kingdom hidden from some and disclosed to others.
    reason: lexical_alternative
  - marker: b
    text: The clause 'so that though seeing they may not see, and though hearing they may not understand' echoes Isaiah 6:9–10 and can be understood as expressing divine purpose, judicial result, or both.
    reason: cross_reference
  - marker: c
    text: Or 'but to the rest in parables'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분이 말씀하셨습니다. 「너희에게는 하나님 나라의 비밀들을 알도록 주어졌습니다. 그러나 나머지 사람들에게는 비유로 하십니다. 그래서 보면서도 보지 못하고, 들으면서도 깨닫지 못하게 하십니다」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비밀들’은 단순한 은밀한 정보가 아니라, 한때 감추어졌다가 이제 드러난 하나님의 나라의 진리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 이사야 6:9–10을 반향하며, 하나님의 목적, 심판의 결과, 또는 그 둘 모두로 이해할 수 있습니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘나머지 사람들에게는 비유로’라고 옮길 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Ὑμῖν δέδοται γνῶναι
  english_pob_choice: it has been given to know
  chosen_korean: 너희에게는 … 알도록 주어졌습니다
  alternatives_korean:
  - 너희에게는 … 알게 되었습니다
  - 너희에게는 … 알도록 허락되었습니다
  lexicon: BDAG; γινώσκω, δίδωμι
  rationale: 수동 완료의 ‘주어졌습니다’로 이미 주어진 상태를 살리고, γνῶναι는 ‘알다’로 옮겨 ‘깨닫다’와 구별했습니다.
- source_word: τὰ μυστήρια
  english_pob_choice: the mysteries
  chosen_korean: 비밀들
  alternatives_korean:
  - 신비들
  - 비밀스러운 것들
  lexicon: BDAG; μυστήριον
  rationale: 문맥상 하나님 나라에 관해 숨겨졌다가 드러나는 진리를 가리키므로, 한국어에서는 자연스럽고 직접적인 ‘비밀들’을 택했습니다.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  english_pob_choice: the kingdom of God
  chosen_korean: 하나님 나라
  alternatives_korean:
  - 하나님의 나라
  - 하나님의 왕국
  lexicon: BDAG; βασιλεία τοῦ θεοῦ
  rationale: POB 기본 용례를 따라 ‘하나님 나라’로 옮겨, 통치와 영역의 의미를 함께 담았습니다.
- source_word: τοῖς δὲ λοιποῖς ἐν παραβολαῖς
  english_pob_choice: but to the rest in parables
  chosen_korean: 그러나 나머지 사람들에게는 비유로 하십니다
  alternatives_korean:
  - 그러나 나머지 사람들에게는 비유 안에서 하십니다
  - 그러나 다른 이들에게는 비유로 말씀하십니다
  lexicon: BDAG; λοιπός, παραβολή
  rationale: 그리스어의 생략된 동사를 한국어에서 보충해 문장을 자연스럽게 만들되, ‘비유로’라는 매개를 유지해 원문의 간결함과 대조를 살렸습니다.
- source_word: συνιῶσιν
  english_pob_choice: may not understand
  chosen_korean: 깨닫지 못하게 하십니다
  alternatives_korean:
  - 이해하지 못하게 하십니다
  - 알아차리지 못하게 하십니다
  lexicon: BDAG; συνίημι
  rationale: συνίημι는 단순한 인지보다 더 적극적인 ‘이해/깨달음’의 부재를 뜻하므로, 현대 한국어에서 가장 자연스러운 ‘깨닫다’로 옮겼습니다.
theological_decisions:
- issue: ἵνα 절의 목적/결과와 이사야 6장 인용의 긴장
  chosen_reading: ‘그래서 … 못하게 하십니다’로 옮겨, 목적과 결과의 긴장을 풀지 않고 남겼습니다.
  alternative_readings:
  - ‘그 결과 … 못합니다’처럼 결과를 더 강하게 드러내는 번역
  - ‘~하기 위해서’로 목적만 강조하는 번역
  rationale: 이 절은 이사야 6장의 반향을 지니며 하나님의 심판적 목적과 결과를 모두 떠올리게 하므로, 어느 한쪽으로 단정하지 않고 원문의 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
