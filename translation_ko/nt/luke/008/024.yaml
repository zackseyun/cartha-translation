id: LUK.8.24
reference: Luke 8:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
  footnotes:
  - marker: a
    text: Or “the surging waves” for “the raging of the water.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 다가와 그를 깨우며 말했습니다. “선생님, 선생님, 우리가 죽게 되었습니다!” 그러자 그가 깨어나 바람과 물결의 요동을 꾸짖으시니, 그것들이 그치고 잔잔해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “물결의 요동”은 ‘물의 거센 출렁임/파도’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  english_pob_choice: they came
  chosen_korean: 다가와
  alternatives_korean:
  - 가서
  - 찾아가
  lexicon: BDAG
  rationale: 제자들이 예수께 가까이 이동한 뒤 깨운다는 연속 동작을 자연스럽게 살리면서, 단순한 ‘오다’보다 방향성을 분명히 했습니다.
- source_word: Ἐπιστάτα
  english_pob_choice: Master
  chosen_korean: 선생님
  alternatives_korean:
  - 주인님
  - 주님
  lexicon: BDAG
  rationale: 누가복음에서 제자들이 예수께 정중히 부르는 호칭으로, 권위와 친밀함을 함께 담을 수 있는 현대 한국어를 택했습니다.
- source_word: ἀπολλύμεθα
  english_pob_choice: we are perishing
  chosen_korean: 우리가 죽게 되었습니다
  alternatives_korean:
  - 우리가 멸망하고 있습니다
  - 우리가 죽어 가고 있습니다
  lexicon: BDAG
  rationale: 임박한 생명의 위협을 한국어로 직접적으로 드러내되, 현재 진행형의 위급함을 유지했습니다.
- source_word: κλύδωνι τοῦ ὕδατος
  english_pob_choice: the raging of the water
  chosen_korean: 물결의 요동
  alternatives_korean:
  - 물의 출렁임
  - 물의 거센 파도
  lexicon: BDAG
  rationale: κλύδων의 ‘출렁임/요동’과 물의 격한 움직임을 살리되, ‘파도’로만 좁히지 않아 물의 동요라는 이미지를 보존했습니다.
theological_decisions:
- issue: 예수의 호칭 Ἐπιστάτα를 어떻게 옮길지
  chosen_reading: ‘선생님’으로 옮겨, 정중한 제자들의 호칭이면서도 권위 있는 부름으로 유지했습니다.
  alternative_readings:
  - 주님
  - 주인님
  rationale: 본문은 호칭 자체의 권위와 관계성을 보여 주며, 한국 교회 전통어로 고정해 의미를 좁히기보다 누가의 문맥에 맞는 중립적 호칭을 택하는 편이 더 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve source force.'
- issue: 바람과 물결에 대한 예수의 행동 ἐπετίμησεν의 힘
  chosen_reading: ‘꾸짖으시니’로 옮겨, 단순한 말이 아니라 권위 있는 제압을 드러냈습니다.
  alternative_readings:
  - 명하셨으니
  - 엄하게 말씀하시니
  rationale: 복음서에서 반복되는 강한 제어의 동사를 약화하지 않고, 창조 질서 위에 대한 주님의 권위를 본문이 말하는 만큼만 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
