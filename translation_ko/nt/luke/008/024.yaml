- from: 그들이 다가와 그를 깨우며 말했습니다. “선생님, 선생님, 우리가 죽게 되었습니다!” 그러자 그가 깨어나 바람과 물결의 요동을 꾸짖으시니, 그것들이 그치고 잔잔해졌습니다.[a]
  to: 그들이 그에게 다가가 그를 깨우며 말했습니다. “선생님, 선생님, 우리가 죽어 가고 있습니다!” 그러자 그는 잠에서 깨어 바람과 물의 거센 출렁임[a]을 꾸짖으셨습니다. 바람과 물의 거센 출렁임이 그치고, 고요가 찾아왔습니다.
  rationale: 현재형 ἀπολλύμεθα의 긴박성을 보존하고, ἐπαύσαντο와 ἐγένετο γαλήνη의 두 결과를 분명히 구분했습니다. ‘잠에서 깨어’는 διεγερθείς의 수동형이 문맥상 나타내는 각성 상태를 자연스럽게 표현할 뿐, 각성의 방식을 과도하게 규정하지 않습니다. 각주 표지도 해당 번역어에 붙였습니다.
