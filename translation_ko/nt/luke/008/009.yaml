  lexicon: BDAG
  rationale: 미완료 과거의 반복·진행 뉘앙스가 있지만, 한국어에서는 자연스러운 서술로 ‘물었습니다’가 가장 읽기 좋고 본문의 질문 행위를 충분히 드러냅니다.
- source_word: οἱ μαθηταὶ αὐτοῦ
  english_pob_choice: his disciples
  chosen_korean: 제자들이
