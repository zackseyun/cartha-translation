  - 이 비유가 무엇을 의미하는지
  lexicon: BDAG
  rationale: 직역하면 ‘이 비유가 무엇일 수 있는지’이지만, 문맥상 제자들이 비유의 의미를 묻는 것이므로 ‘무엇을 뜻하는지’가 가장 자연스럽고 source-grounded입니다.
- source_word: παραβολή
