lexical_decisions:
- source_word: ἕτερον
  english_pob_choice: other seed
  chosen_korean: 다른 씨
  alternatives_korean:
  - 또 하나의 씨
  - 다른 씨앗
  lexicon: BDAG
  rationale: 문맥상 앞선 씨를 가리키는 중성 단수 용법이므로 ‘다른 씨’로 간결하게 옮겼습니다.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  english_pob_choice: among the thorns
  chosen_korean: 가시덤불 한가운데
  alternatives_korean:
