  - 가시덤불 속
  lexicon: BDAG
  rationale: 직역 가능한 ‘한가운데’를 살리되, 한국어에서는 ‘가시덤불’이 공간적 이미지를 더 자연스럽게 전달합니다.
- source_word: συμφυεῖσαι
  english_pob_choice: grew up with it
  chosen_korean: 함께 자라 올라와
  alternatives_korean:
  - 함께 자라서
  - 자라 함께하여
  lexicon: BDAG
  rationale: 동시적 성장과 경쟁적 확장을 함께 드러내기 위해 ‘함께 자라 올라와’로 옮겼습니다.
- source_word: ἀπέπνιξαν
  english_pob_choice: choked
  chosen_korean: 숨막히게 했습니다
  alternatives_korean:
  - 질식시켰습니다
  - 막아 숨지 못하게 했습니다
  lexicon: BDAG
  rationale: 농경 비유의 효과를 살리면서도 한국어에서 ‘숨막히게 하다’가 원인-결과를 자연스럽게 전달합니다.
theological_decisions:
- issue: 가시가 씨를 ‘숨막히게’ 하는 비유의 표현 강도
  chosen_reading: 직접적인 생물학적 손상을 넘어서, 자라는 가시가 씨의 생장을 압도하여 생명력을 빼앗는 모습을 그대로 드러냈습니다.
  alternative_readings:
  - ‘질식시켰습니다’처럼 더 문자적인 표현
  - ‘억눌렀습니다’처럼 완화된 표현
  rationale: 원문의 ἀποπνίγω는 단순 방해보다 강한 ‘질식/숨막힘’의 이미지를 가지므로, 비유의 긴장을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 비유 해석의 문자성 유지
- issue: ‘가시덤불 한가운데’와 ‘가시들이 함께 자라’의 중복성
  chosen_reading: 공간적 위치와 동시적 성장 둘 다 유지해, 씨가 가시의 환경 속에 놓여 결국 압도되는 과정을 보이게 했습니다.
  alternative_readings:
  - 한 요소를 생략해 더 간단히 번역
  - 두 표현을 합쳐 한 번만 언급
  rationale: 본문은 위치와 작용을 모두 제시하므로, 서술의 반복을 줄이기보다 원문의 단계적 묘사를 보존했습니다.
  doctrine_reference: 서사 구조 보존
