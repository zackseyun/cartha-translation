  naturalness: ‘예수께서 가시는 동안’과 ‘군중들이 그를 사방에서 밀어붙이고 있었습니다’는 현대 표준어 합쇼체에서 명료하고 자연스럽습니다. 원문의 대조·전환 표지 δέ는 ‘그런데’로 유지했습니다.
  terminology: ‘외동딸’은 θυγάτηρ와 함께 쓰인 μονογενής를 자연스럽게 옮깁니다. 주석의 ‘외아들딸’은 현대 한국어에서 통용되지 않고, 본문의 의미도 불필요하게 혼동하므로 ‘유일한 딸’로 바로잡았습니다. ‘헬라어’는 현대 학술 한국어에서 보편적인 ‘그리스어’로 정정했습니다.
