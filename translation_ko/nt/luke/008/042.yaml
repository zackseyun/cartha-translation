review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 다만 원문의 두 번째 문장에서 αὐτός/αὐτόν은 문맥상 예수를 가리키는데, 초안의 연속된 ‘그’는 바로 앞의 야이로와 혼동될 수 있습니다. 또한 각주 표지가 해당 어구가 아니라 문장 끝에 함께 놓여 있어 연결 관계가 부정확합니다.
  naturalness: ‘외동딸’, ‘열두 살쯤 된’, ‘죽어 가고 있었습니다’는 자연스러운 현대 한국어입니다. 군중의 압박은 ‘에워싸며 밀어붙이고’보다 ‘에워싸고 바싹 밀어붙이고’가 더 매끄럽고 물리적 압박을 잘 드러냅니다.
  terminology: ‘외동딸’은 θυγάτηρ와 함께 쓰인 μονογενής를 적절히 옮깁니다. 각주에서 ‘외아들딸’은 현대 표준어에서 부자연스럽고 의미상 혼선을 줄 수 있으므로 ‘유일한 딸’로 제시하는 편이 안전합니다.
  issues:
  - severity: medium
    issue: 두 번째 문장의 대명사 선행사가 모호합니다.
    rationale: 원문의 ‘그가 가는 동안’의 주어와 ‘그를’의 목적어는 문맥상 예수입니다. 한국어 초안에서는 직전의 ‘그에게’가 야이로를 가리키므로, 독자가 야이로가 가고 군중이 야이로를 압박했다고 읽을 가능성이 있습니다.
  - severity: medium
    issue: 각주 표지가 대응 어구에 붙어 있지 않습니다.
    rationale: a는 μονογενής(외동딸), b는 ὡς ἐτῶν δώδεκα(열두 살쯤), c는 συνέπνιγον(군중의 압박)을 설명해야 합니다. 문장 끝의 연속 표기는 각주의 범위를 불분명하게 합니다.
  - severity: low
    issue: 각주 a의 ‘외아들딸’ 표현이 부자연스럽습니다.
    rationale: 현대 표준어에서는 거의 쓰이지 않으며, ‘외동딸’의 대안적 의미를 명료하게 설명하는 데에도 도움이 되지 않습니다.
  revised_text: 그에게는 열두 살쯤 된 외동딸[a]이 있었는데, 그 아이가 죽어 가고 있었습니다. 예수께서 가시는 동안, 무리가 예수를 에워싸고 바싹 밀어붙이고 있었습니다.[c]
  revised_footnotes:
  - marker: a
    text: 또는 ‘유일한 딸’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘대략 열두 해’입니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어 동사는 무리가 그를 거의 짓눌러 숨 막히게 할 만큼 바싹 밀어붙였음을 시사할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문맥상 예수를 가리키는 대명사를 ‘예수께서/예수를’로 밝혀 한국어의 선행사 혼동을 막았습니다. ‘외동딸’과 ‘열두 살쯤 된’은 원문의 가족 관계와 근사 수치를 보존하므로 유지했으며, 각주 표지는 각각의 해당 어구에 연결했습니다. b 각주는 본문에서 이미 근사성(‘쯤’)이 반영되어 있으므로, 유지하되 별도의 표지는 원문 의미상 ‘열두 살쯤 된’ 뒤에 두는 것이 가장 정확합니다.
