id: LUK.8.42
reference: Luke 8:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
  footnotes:
  - marker: a
    text: Or 'one and only daughter.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'about twelve years.'
    reason: lexical_alternative
  - marker: c
    text: The Greek verb can suggest the crowd was pressing so tightly as to nearly crush him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 열두 살쯤 된 외동딸이 있었는데, 그 아이가 죽어 가고 있었습니다. 그런데 그가 가는 동안 군중이 그를 에워싸며 밀어붙이고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외아들딸’, 곧 ‘유일한 딸’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘대략 열두 해’입니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어 동사는 군중이 그를 거의 짓눌러 숨막히게 할 만큼 바싹 밀집했음을 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  english_pob_choice: only daughter
  chosen_korean: 외동딸
  alternatives_korean:
  - 유일한 딸
  - 외아들딸
  lexicon: BDAG
  rationale: θυγάτηρ와 결합한 μονογενής는 ‘독생’의 교리어보다 가족 관계상 ‘외동’의 뜻이 분명하므로, 자연스러운 한국어 관용인 ‘외동딸’로 옮겼습니다.
- source_word: ὡς ἐτῶν δώδεκα
  english_pob_choice: about twelve years old
  chosen_korean: 열두 살쯤 된
  alternatives_korean:
  - 대략 열두 살인
  - 약 열두 살 된
  lexicon: BDAG
  rationale: ὡς가 수와 함께 쓰여 대략성을 나타내므로, ‘쯤’으로 그 완곡함을 살렸습니다.
- source_word: ἀπέθνῃσκεν
  english_pob_choice: was dying
  chosen_korean: 죽어 가고 있었습니다
  alternatives_korean:
  - 죽어 가고 있었습니다만
  - 죽어 가는 중이었습니다
  lexicon: BDAG
  rationale: 미완료 시상은 진행 중인 상태를 나타내므로, 완료된 죽음이 아니라 지속되는 임박한 죽음을 한국어 진행형으로 반영했습니다.
- source_word: συνέπνιγον
  english_pob_choice: were pressing in on
  chosen_korean: 에워싸며 밀어붙이고 있었습니다
  alternatives_korean:
  - 밀려들고 있었습니다
  - 거의 압사시킬 듯 밀고 있었습니다
  lexicon: BDAG
  rationale: 동사는 ‘눌러 숨막히게 하다’는 물리적 압박을 시사하므로, 단순한 접근보다 군중의 조임과 압박을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 군중의 물리적 압박 묘사
  chosen_reading: ‘에워싸며 밀어붙이고 있었습니다’로 번역해, 단순히 사람이 많았다는 정보가 아니라 예수를 실제로 압박하는 장면을 드러냈습니다.
  alternative_readings:
  - ‘군중이 그를 둘러싸고 있었습니다’
  - ‘군중이 그를 에워싸고 있었습니다’
  rationale: συνέπνιγον의 의미를 약화시키면 서사의 긴박감이 사라지므로, 본문의 강한 물리적 뉘앙스를 보존했습니다.
  doctrine_reference: 본문 서사·어휘 뉘앙스 보존
- issue: ‘아버지/그에게는’의 소유 표현
  chosen_reading: ‘그에게는 … 있었습니다’로 자연스럽게 소유 관계를 나타냈습니다.
  alternative_readings:
  - ‘그는 …를 두고 있었습니다’
  - ‘그에게 …가 있었습니다’
  rationale: αὐτῷ + ἦν의 관용적 소유법을 한국어에서 가장 자연스럽고 명료하게 재현했습니다.
  doctrine_reference: 헬라어 관용구의 서사적 재현
