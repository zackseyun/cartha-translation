revisions:
- from: 그러나 그분이 그날들 가운데 하루에 제자들과 함께 배에 오르시고, 그들에게 말씀하셨습니다. “호수 건너편으로 건너갑시다.” 그래서 그들이 떠났습니다.[a][b]
  to: 그 무렵 어느 날, 그분은 제자들과 함께 배에 오르셔서 그들에게 말씀하셨습니다. “호수 건너편[a]으로 건너갑시다.” 그러자 그들은 출항했습니다.[b]
