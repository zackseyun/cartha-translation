id: LUK.8.22
reference: Luke 8:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: Now it happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
  footnotes:
  - marker: a
    text: Or “Let us cross over to the far side of the lake.”
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can mean “put out,” “set sail,” or “launched out.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분이 그날들 가운데 하루에 제자들과 함께 배에 오르시고, 그들에게 말씀하셨습니다. “호수 건너편으로 건너갑시다.” 그래서 그들이 떠났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “호수의 먼편으로 건너갑시다.”
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사는 “뱃사공처럼 떠나다”, “출항하다”, “배를 띄우다”의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  english_pob_choice: Now it happened
  chosen_korean: 그러나 ... 그날들 가운데 하루에
  alternatives_korean:
  - 그때
  - 어느 날
  lexicon: BDAG
  rationale: 누가복음의 서사 전환을 자연스럽게 살리되, 앞뒤 사건 연결을 나타내는 δέ의 완만한 전환감을 한국어 연결어로 반영했습니다.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  english_pob_choice: on one of those days
  chosen_korean: 그날들 가운데 하루에
  alternatives_korean:
  - 그날들 중 하루에
  - 어느 날
  lexicon: BDAG
  rationale: 특정 기간 안의 불특정한 하루라는 부분적 의미를 살리기 위해 직역에 가까운 표현을 택했습니다.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  english_pob_choice: to the other side of the lake
  chosen_korean: 호수 건너편으로
  alternatives_korean:
  - 호수의 반대편으로
  - 호수의 저편으로
  lexicon: BDAG
  rationale: τὸ πέραν의 관용적 의미를 살려 '건너편/저편'으로 옮겼고, λίμνη는 '호수'로 번역해 지리적 대상을 분명히 했습니다.
- source_word: ἀνήχθησαν
  english_pob_choice: they set out
  chosen_korean: 그래서 그들이 떠났습니다
  alternatives_korean:
  - 그래서 그들이 출발했습니다
  - 그래서 그들이 뱃길을 떠났습니다
  lexicon: BDAG
  rationale: 항해 문맥의 '출항하다/나아가다'를 한국어로 자연스럽게 풀어, 물리적 출발의 완결성을 전달했습니다.
theological_decisions:
- issue: 예수의 직접 화법에서 명령형의 뉘앙스
  chosen_reading: “호수 건너편으로 건너갑시다.”
  alternative_readings:
  - “호수 건너편으로 가봅시다.”
  - “호수 건너편으로 넘어갑시다.”
  rationale: Διέλθωμεν은 함께 건너가자는 제안/권유의 뉘앙스이므로, 공동의 의지를 드러내는 '갑시다'가 가장 충실합니다.
  doctrine_reference: 그리스도의 인도와 제자 공동체의 동행
- issue: 서술 도입부의 문체
  chosen_reading: 그러나 그분이 그날들 가운데 하루에 ...
  alternative_readings:
  - 그리고 그날들 가운데 하루에 ...
  - 어느 날 ...
  rationale: 누가의 사건 도입을 지나치게 매끈한 구어체로 약화시키지 않으면서도 현대 한국어 독자가 읽을 수 있는 서술 리듬을 유지했습니다.
  doctrine_reference: 복음서 서사 문체
