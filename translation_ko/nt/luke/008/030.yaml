id: LUK.8.30
reference: Luke 8:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
  footnotes:
  - marker: a
    text: Or “because many demons entered into him.”
    reason: lexical_alternative
  - marker: b
    text: “Legion” is a Latin loanword referring to a large Roman military unit; here it signifies that many demons were in the man.
    reason: cultural_note
translation:
  language: ko
  text: 예수께서 그에게 물으셨습니다. 「이름이 무엇입니까?」 그가 대답했습니다. 「레기온입니다[a]. 많은 귀신이 제 안에 들어갔기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레기온’은 로마 군사 편제의 큰 부대 이름이며, 여기서는 그 남자 안에 많은 귀신이 있음을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν δὲ
  english_pob_choice: Then Jesus asked him
  chosen_korean: 예수께서 그에게 물으셨습니다
  alternatives_korean:
  - 예수께서 그에게 물으셨습니다 — 그리고
  - 예수께서 그에게 물으셨습니다
  lexicon: BDAG
  rationale: δὲ의 담화 진행을 자연스럽게 드러내기 위해 문두 접속을 과하게 살리지 않고 서술을 이어 갔고, ἐπηρώτησεν은 직접 질문 도입이므로 ‘물으셨습니다’가 ‘질문하셨습니다’보다 자연스럽습니다.
- source_word: Τί σοι ὄνομά ἐστιν;
  english_pob_choice: What is your name?
  chosen_korean: 네 이름이 무엇이냐?
  alternatives_korean:
  - 네 이름이 무엇입니까?
  - 당신의 이름이 무엇입니까?
  lexicon: BDAG
  rationale: 직접 화법의 간결한 질문 형식을 살리되, 인물에게 던지는 질문의 즉시성을 위해 ‘네 이름이 무엇이냐?’로 옮겼습니다.
- source_word: Λεγιών
  english_pob_choice: Legion
  chosen_korean: 군단입니다
  alternatives_korean:
  - 레기온입니다
  - 군단
  lexicon: BDAG
  rationale: 라틴어 차용어의 군사적 의미를 한국어 독자에게 즉시 드러내기 위해 음역보다 ‘군단’을 택했습니다. 다만 본문의 의미는 단순한 군사 조직명이 아니라 다수성을 가리키므로 문맥상 적절합니다.
- source_word: ὅτι εἰσῆλθεν
  english_pob_choice: because many demons had entered into him
  chosen_korean: 많은 귀신이 그에게 들어갔기 때문입니다
  alternatives_korean:
  - 많은 귀신이 그 안으로 들어갔기 때문입니다
  - 많은 귀신이 그에게 들어왔기 때문입니다
  lexicon: BDAG
  rationale: ὅτι의 이유 표시를 ‘-기 때문입니다’로 자연스럽게 옮겼고, εἰσῆλθεν εἰς αὐτόν의 진입성을 ‘그에게 들어갔다’로 보존했습니다.
- source_word: δαιμόνια πολλὰ
  english_pob_choice: many demons
  chosen_korean: 많은 귀신
  alternatives_korean:
  - 많은 악한 영들
  - 많은 악령들
  lexicon: BDAG
  rationale: POB의 demons를 한국어 성서 관용에 맞춰 ‘귀신’으로 옮기되, 다수성 ‘많은’을 그대로 유지했습니다.
theological_decisions:
- issue: Λεγιών의 문화적 뉘앙스와 본문 기능
  chosen_reading: ‘군단’은 문자적 군사 단위의 이름이 아니라, 그 남자 안에 들어간 귀신의 엄청난 수를 드러내는 표현으로 읽습니다.
  alternative_readings:
  - 음역한 고유명사로만 읽기
  - 단순히 ‘다수’의 은유로 완전히 풀어쓰기
  rationale: 본문 자체가 ‘많은 귀신’이라는 이유절을 붙여 의미를 해설하므로, 한국어 본문에서도 군사적 집합성과 다수성의 뉘앙스를 함께 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
