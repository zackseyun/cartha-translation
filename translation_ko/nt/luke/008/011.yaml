source:
  edition: SBLGNT
  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'Now this is the parable: the seed is the word of God[a].'
  footnotes:
  - marker: a
    text: Or, 'this is the meaning of the parable.' The Greek reads more literally, 'this is the parable.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 바로 그 비유입니다. 씨는 하나님의 말씀입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 비유의 뜻입니다’. 헬라어는 더 문자적으로는 ‘이것이 그 비유입니다’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν δὲ αὕτη ἡ παραβολή
  english_pob_choice: Now this is the parable
  chosen_korean: 이것은 바로 그 비유입니다
  alternatives_korean:
  - 이것은 비유입니다
  - 이것은 그 비유의 뜻입니다
  lexicon: BDAG
  rationale: δέ의 완만한 전환은 ‘바로’로 자연스럽게 살리고, αὕτη ἡ παραβολή는 원문 구조를 따라 ‘그 비유’로 옮겨 ‘뜻’이라는 해석어를 덧붙이지 않았습니다.
- source_word: σπόρος
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 씨앗
  - 뿌려진 씨
  lexicon: BDAG
  rationale: 비유의 이미지에 맞는 단수형 ‘씨’가 가장 직접적이며, 한국어에서도 집합적 의미로 자연스럽습니다.
- source_word: ὁ λόγος
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: BDAG
  rationale: 하나님에게 속한 λόγος는 성경적 표현인 ‘말씀’이 원문과 문맥의 울림을 가장 잘 보존합니다.
- source_word: τοῦ θεοῦ
  english_pob_choice: of God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님에게서 난
  - 하나님께 속한
  lexicon: BDAG
  rationale: 속격을 직접적으로 반영해 ‘하나님의 말씀’으로 옮겼고, 불필요한 해석적 확대를 피했습니다.
theological_decisions:
- issue: αὕτη ἡ παραβολή를 ‘비유’로 둘지 ‘비유의 뜻/설명’으로 풀지 여부
  chosen_reading: 원문대로 ‘비유’로 유지합니다.
  alternative_readings:
  - 비유의 뜻
  - 비유의 설명
  rationale: 예수의 해설 문맥은 분명하지만, 원문은 문자적으로 ‘이것이 그 비유입니다’라고 말하므로 해석어를 보태기보다 원문 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
