id: LUK.8.18
reference: Luke 8:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
  footnotes:
  - marker: a
    text: Or, 'even what he seems to have will be taken away from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 어떻게 듣는지 잘 살피십시오. 누구든지 가진 자는 더 주어질 것이요, 누구든지 가지지 않은 자는 자기가 가진 줄로 생각하는 것마저 빼앗길 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기가 가지고 있다고 여기는 것마저 빼앗길 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε οὖν
  english_pob_choice: Therefore, pay attention
  chosen_korean: 그러므로 … 잘 살피십시오
  alternatives_korean:
  - 그러므로 주의하십시오
  - 그러므로 잘 보십시오
  lexicon: BDAG
  rationale: βλέπετε는 단순한 시각 동작보다 경계하고 주의를 기울이라는 명령이므로, 문맥의 경고성을 살려 ‘잘 살피십시오’로 옮겼습니다.
- source_word: πῶς ἀκούετε
  english_pob_choice: how you listen
  chosen_korean: 어떻게 듣는지
  alternatives_korean:
  - 어떻게 들으시는지
  - 어떻게 경청하는지
  lexicon: BDAG
  rationale: πῶς는 ‘어떻게’라는 방식의 문제이고 ἀκούετε는 단순 청취보다 수용적 듣기를 가리키므로, 자연스러운 표준어로 ‘어떻게 듣는지’라고 했습니다.
- source_word: δοθήσεται αὐτῷ
  english_pob_choice: more will be given to him
  chosen_korean: 더 주어질 것이요
  alternatives_korean:
  - 그에게 주어질 것이요
  - 더해질 것이요
  lexicon: BDAG
  rationale: 헬라어는 목적어를 직접 밝히지 않지만 문맥상 증가의 뜻이 분명하므로, ‘더’의 보충으로 의미를 드러내되 원문의 간결한 수동형을 살렸습니다.
- source_word: ὃ δοκεῖ ἔχειν
  english_pob_choice: what he thinks he has
  chosen_korean: 자기가 가진 줄로 생각하는 것
  alternatives_korean:
  - 자기가 가진 듯한 것
  - 자기가 가진 것으로 여기는 것
  lexicon: BDAG
  rationale: δοκεῖ는 ‘생각하다/여기다’와 ‘~처럼 보이다’의 여지가 있으나, 여기서는 실제 소유가 아닌 인식된 소유를 가리키므로 본문 안의 긴장을 살리는 표현을 택했습니다.
theological_decisions:
- issue: 이 말씀의 일반 원리와 신학 체계의 관계
  chosen_reading: 본문이 말하는 것은 듣는 태도에 따른 수용과 상실의 역설이며, 예정론·공로론·번영 신학으로 미리 규정하지 않았습니다.
  alternative_readings:
  - 영적 수용성에 대한 일반 원리
  - 청지기 정신에 관한 격언
  rationale: 이 절은 예수님의 말씀을 어떻게 듣는지가 핵심이므로, 문맥을 넘어서는 교리적 해석을 번역에 주입하지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
