  to: 그러므로 여러분이 어떻게 듣는지 주의하십시오. 누구든지 가진 사람에게는 더 주어질 것이지만, 누구든지 가지지 않은 사람에게서는 자신이 가지고 있다고 생각하는 것마저 빼앗길 것입니다.[a]
