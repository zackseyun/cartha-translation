  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
  footnotes:
  - marker: a
    text: Or more literally, “What is there between me and you?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 예수님을 보자 소리치며 그분 앞에 엎드려 큰 소리로 말했습니다. “예수님, 지극히 높으신 하나님의 아들이시여, 제가 당신과 무슨 상관이 있습니까?[a] 간청합니다. 저를 괴롭히지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 “나와 당신에게 무엇이 있습니까?”입니다. 관계를 거부하거나 항의하는 뜻의 셈어적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  english_pob_choice: when he saw
  chosen_korean: 보자
  alternatives_korean:
  - 보고
  - 보게 되자
  lexicon: BDAG
  rationale: 부사적 분사로서 앞선 상황을 배경으로 제시하므로, 한국어에서는 자연스러운 조건·시점 연결인 ‘보자’가 시간 관계를 간결하게 드러냅니다.
- source_word: ἀνακράξας
  english_pob_choice: he cried out
  chosen_korean: 크게 소리치며
  alternatives_korean:
  - 소리치며
  - 큰 소리로 외치며
  lexicon: BDAG
  rationale: 갑작스럽고 격한 외침을 나타내므로 ‘크게 소리치며’가 장면의 긴박함을 살리고, 뒤의 ‘큰 소리로’와 의미를 과도하게 겹치지 않습니다.
- source_word: Τί ἐμοὶ καὶ σοί
  english_pob_choice: What do you have to do with me
  chosen_korean: 제가 당신과 무슨 상관이 있습니까
  alternatives_korean:
  - 나와 당신 사이에 무슨 상관이 있습니까
  - 나와 당신이 무슨 관계가 있습니까
  lexicon: BDAG
  rationale: 셈어적 분리·거절의 관용구를 현대 한국어의 자연스러운 대립 표현으로 옮겼습니다. 영어 본문의 풀이를 따르되, 관계 단절의 뉘앙스를 유지했습니다.
- source_word: μή με βασανίσῃς
  english_pob_choice: do not torment me
  chosen_korean: 저를 괴롭히지 마십시오
  alternatives_korean:
  - 저를 고통스럽게 하지 마십시오
  - 저를 괴롭히지 말아 주십시오
  lexicon: BDAG
  rationale: βάσανος 계열은 강한 고통·괴롭힘을 뜻하지만, 이 본문에서는 악령의 절박한 간청으로 들리므로 ‘괴롭히다’가 가장 자연스럽고, 심판적·영적 압박을 함께 담습니다.
theological_decisions:
- issue: 예수님 호칭의 존칭 처리와 악령의 직접 발화
  chosen_reading: 직접 인용문 안에서 ‘예수님’과 ‘지극히 높으신 하나님의 아들’로 옮기고, 악령의 말투는 원문의 긴급한 간청을 살려 합쇼체를 유지했습니다.
  alternative_readings:
  - 예수, 하나님의 아들, 지극히 높으신 분
  - 예수님, 가장 높으신 하나님 아들
  rationale: 본문은 악령이 예수의 정체를 알아보고 항의하는 장면이므로, 예수에 대한 존칭은 유지하되 추가 설명은 넣지 않았습니다. 또한 직접 발화의 긴박성과 예수께 드리는 직접 호소를 한국어 합쇼체로 표현했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
