id: LUK.8.52
reference: Luke 8:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
  footnotes:
  - marker: a
    text: Or, 'is asleep.' Jesus' wording uses sleep as a metaphorical description in the context of her impending restoration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 울며 그를 위해 곡하고 있었습니다. 그러나 예수께서 말씀하셨습니다. “울지 마십시오. 그녀가 죽은 것이 아니라 자고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠들어 있습니다.’ 예수의 표현은 그녀의 곧 있을 회복을 가리키는 비유적 묘사입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  english_pob_choice: were weeping
  chosen_korean: 울며
  alternatives_korean:
  - 울었습니다
  - 계속 울고 있었습니다
  lexicon: BDAG
  rationale: 미완료 과거의 진행성을 한국어에서는 부사적 분사구문 ‘울며’로 자연스럽게 살려, 단순 과거보다 지속된 울음을 드러냈습니다.
- source_word: ἐκόπτοντο αὐτήν
  english_pob_choice: mourning for her
  chosen_korean: 그를 위해 곡하고 있었습니다
  alternatives_korean:
  - 그녀를 위해 애도하고 있었습니다
  - 그녀를 슬퍼하고 있었습니다
  lexicon: BDAG
  rationale: κόπτομαι의 장례적 통곡·곡함을 평이한 ‘슬퍼하다’보다 강하게 드러내기 위해 ‘곡하다’를 택했고, 대상을 분명히 하도록 ‘그녀를’로 번역했습니다.
- source_word: Μὴ κλαίετε
  english_pob_choice: Do not weep
  chosen_korean: 울지 마십시오
  alternatives_korean:
  - 울지 마세요
  - 그만 우십시오
  lexicon: BDAG
  rationale: μή + 현재 명령은 진행 중인 울음을 멈추라는 금지로 이해할 수 있어, 합쇼체 명령형 ‘울지 마십시오’가 가장 자연스럽게 대응합니다.
- source_word: καθεύδει
  english_pob_choice: is sleeping
  chosen_korean: 자고 있습니다
  alternatives_korean:
  - 잠들어 있습니다
  - 잠을 자고 있습니다
  lexicon: BDAG
  rationale: 예수의 비유적 표현을 본문에서 풀지 않고 현재 진행으로 옮겨, 죽음에 대한 ‘잠’의 비유를 그대로 보존했습니다.
theological_decisions:
- issue: ‘죽은 것이 아니라 자고 있습니다’라는 예수의 진술을 어떻게 옮길지
  chosen_reading: 본문의 비유를 해설하지 않고 그대로 보존해, 죽음과 회복 사이의 긴장을 유지했습니다.
  alternative_readings:
  - 실제로 죽지 않고 잠들어 있을 뿐이라는 식으로 설명하기
  - 회복이 임박했음을 암시하는 비유로만 약화시키기
  rationale: 원문은 예수의 진술 자체를 제시하므로, 번역이 해석을 덧붙여 긴장을 해소하지 않도록 하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 말고 보존한다.'
