revisions:
- from: 그들은 모두 울며 그를 위해 곡하고 있었습니다. 그러나 예수께서 말씀하셨습니다. “울지 마십시오. 그녀가 죽은 것이 아니라 자고 있습니다.”[a]
  to: 그들은 모두 울고 그녀를 두고 곡하고 있었습니다. 그러나 예수께서 말씀하셨습니다. “울지 마십시오. 그녀가 죽은 것이 아니라 자고 있습니다.”[a]
  rationale: 여성 목적격 αὐτήν을 ‘그녀를’로 바로잡고, ἐκόπτοντο의 애도 맥락은 ‘그녀를 두고 곡하고’로 옮겼습니다. ‘울고 … 곡하고 있었습니다’는 두 미완료 동작의 병렬적 진행을 자연스럽게 드러냅니다. 각주는 ‘자고 있습니다’의 어휘적 대안만 제시하여 예수의 비유적 진술을 해석적으로 설명하거나 확정하지 않도록 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:14Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘그를’은 여성 단수 목적격 αὐτήν과 맞지 않습니다. 또한 ἐκόπτοντο αὐτήν은 그 소녀를 두고 하는 애도의 뜻이므로 ‘그녀를 두고 곡하고’가 대상을 정확히 나타내며 자연스럽습니다. 예수의 말씀은 ‘죽은 것이 아니라 자고 있습니다’로 원문의 긴장을 적절히 보존합니다.
  naturalness: ‘울며 … 곡하고 있었습니다’도 가능하지만, 두 미완료 동작을 ‘울고 … 곡하고 있었습니다’로 병렬하면 현대 표준어에서 더 자연스럽고 지속성이 분명합니다. ‘그녀를 두고’는 애도 대상에 쓰이는 자연스러운 표현입니다.
  terminology: ‘곡하다’는 장례 애도의 강한 뉘앙스를 보존하는 적절한 격식어입니다. 각주에서 예수의 표현을 곧 있을 회복에 관한 묘사라고 단정하면 본문이 유지하는 해석상의 긴장을 불필요하게 해소하므로, 어휘적 대안만 제시하는 것이 적절합니다.
  issues:
  - severity: high
    issue: ‘그를 위해’라는 남성 대명사 사용
    rationale: 원문의 αὐτήν은 여성 단수 대명사이며, 이 절의 애도 대상인 소녀를 가리킵니다. 한국어 본문도 여성 대상을 정확히 밝혀야 합니다.
  - severity: low
    issue: 각주의 해설적 단정
    rationale: ‘그녀의 곧 있을 회복을 가리키는 비유적 묘사’라는 문구는 본문의 ‘자고 있다’는 표현을 해설로 확정합니다. 번역 본문이 보존하는 긴장을 각주에서도 유지하도록 어휘 대안만 남기는 편이 안전합니다.
  revised_text: 그들은 모두 울고 그녀를 두고 곡하고 있었습니다. 그러나 예수께서 말씀하셨습니다. “울지 마십시오. 그녀가 죽은 것이 아니라 자고 있습니다.”[a]
