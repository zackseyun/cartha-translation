  source_fidelity: 원문의 미완료 과거 παρεκάλουν은 ‘계속 간청했습니다’로, ἐπιτάξῃ의 권위적 명령과 εἰς τὴν ἄβυσσον ἀπελθεῖν의 목적지 이동은 ‘심연으로 들어가라고 명령하다’로 충실히 반영됩니다. ‘심연’은 ἄβυσσος의 의미를 보존하며 ‘무저갱’보다 해석 전통을 덜 부과합니다.
  naturalness: 초안의 ‘자기들에게 그분이’는 한국어 어순상 부자연스럽고, ‘간청하고 있었습니다’는 문맥상 과거 서술에서 다소 늘어집니다. 주어와 간청의 대상, 간청 내용을 명료하게 배열한 문장이 자연스럽습니다.
  terminology: ‘심연’과 ‘명령’은 적절합니다. 각주 대안은 한국어에서 명사형 ‘깊음’보다 ‘깊은 곳’이 자연스럽습니다. ‘악한 영들’은 문맥적 설명으로만 제한하여 본문에 추가하지 않습니다.
  issues:
  - severity: medium
