  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
  footnotes:
  - marker: a
    text: Or 'the deep.' The Greek word can denote a great depth; here it likely refers to the abyss as a place of confinement for evil spirits.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그분께서 자기들에게 그 심연으로 들어가라고 명령하지 않으시기를 계속 간청했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깊은 곳’. 이 말은 큰 깊이를 가리킬 수 있으나, 여기서는 악한 영들을 가두는 장소로서의 심연을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  english_pob_choice: were begging
  chosen_korean: 간청하고 있었습니다
  alternatives_korean:
  - 애원하고 있었습니다
  - 간구하고 있었습니다
  - 부탁하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 시제의 지속적·반복적 행위를 살리면서, 귀신들이 예수님께 절박하게 매달리는 상황에 가장 자연스럽고 강한 표현으로 옮겼습니다.
- source_word: ἐπιτάξῃ
  english_pob_choice: command
  chosen_korean: 명령하지 않으시기를
  alternatives_korean:
  - 지시하지 않으시기를
  - 명하하지 않으시기를
  lexicon: BDAG
  rationale: 권위 있는 명령의 뉘앙스를 살려 ‘명령하다’로 옮겼고, 부정 요청 구조에 맞게 한국어에서는 ‘-하지 않으시기를’로 처리했습니다.
- source_word: ἄβυσσον
  english_pob_choice: the abyss
  chosen_korean: 그 심연
  alternatives_korean:
  - 그 무저갱
  - 그 깊은 곳
  - 그 깊음
  lexicon: BDAG
  rationale: 영어 POB의 ‘the abyss’를 따라 직설적으로 옮기되, 한국어에서 전승적 교회어인 ‘무저갱’보다 원어 의미를 더 투명하게 드러내는 ‘심연’을 택했습니다.
- source_word: ἵνα μὴ ... ἀπελθεῖν
  english_pob_choice: not to ... to go
  chosen_korean: 들어가라고 ... 않으시기를
  alternatives_korean:
  - 가라고 ... 않으시기를
  - 가게 하지 않으시기를
  - 들어가도록 명령하지 않으시기를
  lexicon: BDAG
  rationale: ἵνα μή가 간청의 내용절로 쓰인 구조를 자연스럽게 살리기 위해 ‘~하지 않으시기를’로 풀었고, 목적지 표현 ‘εἰς τὴν ἄβυσσον’에 맞춰 ‘들어가다’로 옮겼습니다.
theological_decisions:
- issue: ἄβυσσος의 의미 범위
  chosen_reading: 귀신들이 두려워하는 감금·심판의 장소를 가리키는 ‘심연’으로 유지합니다.
  alternative_readings:
  - 단순한 ‘깊은 곳’으로 이해할 수 있음
  - 전통적 교회어 ‘무저갱’으로 고정할 수 있음
  rationale: 문맥이 영적 존재들의 간청과 예수님의 권위 아래 놓인 장소를 보여 주므로, 의미를 지나치게 약화하지 않으면서도 원문의 긴장을 그대로 남기는 표현이 적절합니다.
  doctrine_reference: 원문 우선 번역 원칙; 종말론적·영적 의미를 과도하게 해명하지 않음
