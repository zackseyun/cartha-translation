    rationale: ‘그들은 자기들에게 그분이’는 간청의 수혜자(그들)와 행위자(그분)의 관계를 즉시 파악하기 어렵습니다. ‘그들은 그분께서 자기들에게 … 명령하지 않으시기를’으로 배열하면 원문의 αὐτόν과 αὐτοῖς의 관계가 분명해집니다.
  - severity: low
