id: LUK.8.14
reference: Luke 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
  footnotes:
  - marker: a
    text: Or 'worries' for 'cares.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they do not produce ripe fruit' or 'they do not bring fruit to completion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가시덤불 속에 떨어진 것은 말씀을 들은 사람들입니다. 그들은 살아가면서 걱정[a]과 재물과 삶의 쾌락에 짓눌려 숨이 막히며, 온전히 열매를 맺지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘염려’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성숙한 열매를 맺지 못합니다’ 또는 ‘열매를 끝까지 맺지 못합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν
  english_pob_choice: And the one that fell among the thorns
  chosen_korean: 가시덤불 속에 떨어진 것은
  alternatives_korean:
  - 가시 속에 떨어진 것은
  - 가시덤불에 떨어진 씨는
  lexicon: SBLGNT
  rationale: 중성 단수 분사를 한국어에서 자연스럽게 받아들여, 해석적 설명문 구조인 "~것은"으로 옮기되 원문에 없는 '씨'를 덧붙이지 않았습니다.
- source_word: ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου
  english_pob_choice: by the cares and riches and pleasures of life
  chosen_korean: 걱정과 재물과 삶의 쾌락에
  alternatives_korean:
  - 염려와 부와 인생의 쾌락에
  - 근심과 부와 삶의 즐거움에
  lexicon: BDAG
  rationale: μερίμναι를 POB의 'cares' 흐름에 맞춰 '걱정'으로 두고, πλοῦτος는 물질적 축적을 드러내는 '재물'로, ἡδοναί는 도덕적 완곡화보다 직접적인 '쾌락'으로 옮겨 삼중항의 압박감을 살렸습니다.
- source_word: πορευόμενοι συμπνίγονται
  english_pob_choice: as they go on their way they are choked
  chosen_korean: 살아가면서 ... 눌려 숨이 막혀
  alternatives_korean:
  - 가는 길에서 ... 질식되어
  - 계속 가는 동안 ... 짓눌려
  lexicon: BDAG
  rationale: πορευόμενοι의 진행성을 한국어의 '살아가면서'로 자연스럽게 표현했고, συμπνίγονται는 농경 은유를 살리면서도 한국어에서 생생한 '숨이 막혀'로 옮겼습니다.
- source_word: οὐ τελεσφοροῦσιν
  english_pob_choice: they do not bear fruit to maturity
  chosen_korean: 끝내 열매를 성숙에 이르지 못합니다
  alternatives_korean:
  - 열매를 성숙하게 맺지 못합니다
  - 열매를 완성하지 못합니다
  lexicon: BDAG
  rationale: τελεσφορέω의 '완성/성숙에 이르다' 의미를 보존하면서, POB의 'to maturity'를 한국어로 직접 드러내어 열매 비유와 미완성의 상태를 함께 살렸습니다.
theological_decisions:
- issue: 가시덤불 밭의 결과를 어떻게 신학적으로 규정할지
  chosen_reading: 본문의 핵심 이미지를 유지한 채, 걱정·재물·쾌락에 의해 '숨이 막혀' 열매가 성숙에 이르지 못한다고만 번역하고, 배교·비중생·상급 상실 여부는 단정하지 않았습니다.
  alternative_readings:
  - 그들은 참 신자가 아니라고 단정하는 읽기
  - 참 신자이지만 열매가 없는 상태로 남는다는 읽기
  - 구원을 잃는다는 읽기
  rationale: 예수님의 설명은 원인과 결과를 말하지만, 이 구절만으로 후대의 구원론 논쟁을 종결하지 않습니다. 그래서 본문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
