    issue: '"열매를 성숙에 이르지 못합니다"의 문법 및 의미 연결이 부자연스럽습니다.'
    rationale: ‘이르다’의 주체는 사람들 또는 열매여야 하는데, 현 문장은 ‘열매를’ 목적어로 두고 ‘성숙에 이르다’를 결합하여 문법적으로 어색합니다. 또한 원문의 결실의 완결성을 명료하게 전달하지 못합니다.
  - severity: low
    issue: 각주 a와 b가 모두 문장 끝에 붙어 있어 각각의 대상이 불명확합니다.
    rationale: a는 ‘걱정’(μερίμναι)의 어휘 대안이고 b는 결실하지 못함(οὐ τελεσφοροῦσιν)의 대안이므로, 각 해당 표현 뒤에 표지를 두어야 합니다.
