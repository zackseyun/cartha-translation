id: LUK.8.5
reference: Luke 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
  footnotes:
  - marker: a
    text: Or 'the birds of heaven.' Many English versions also render this idiom as 'the birds of the air.'
    reason: lexical_alternative
translation:
  language: ko
  text: 씨 뿌리는 사람이 씨를 뿌리려고 나갔습니다. 그가 씨를 뿌리는 동안, 어떤 씨는 길가에 떨어져 짓밟혔고, 하늘의 새들이 그것을 먹어 치웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공중의 새들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξῆλθεν
  english_pob_choice: went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 밖으로 나갔습니다
  - 나섰습니다
  lexicon: BDAG
  rationale: 동사의 기본 의미를 자연스러운 현대 한국어로 옮기되, 비유의 흐름에 맞게 간결하게 표현했습니다.
- source_word: ὁ σπείρων
  english_pob_choice: the sower
  chosen_korean: 씨 뿌리는 사람
  alternatives_korean:
  - 파종하는 사람
  - 씨 뿌리는 자
  lexicon: BDAG
  rationale: 분사구가 명사적으로 쓰였으므로 ‘씨 뿌리는 사람’이 문맥상 가장 자연스럽고, 비유의 인물을 분명하게 드러냅니다.
- source_word: τὸν σπόρον αὐτοῦ
  english_pob_choice: his seed
  chosen_korean: 씨를
  alternatives_korean:
  - 자기의 씨를
  - 그의 씨앗을
  lexicon: BDAG
  rationale: 농경 문맥에서 σπόρος는 ‘씨’로 충분히 전달되며, 소유격은 앞뒤 문맥상 자연스럽게 드러나므로 과도한 반복을 피했습니다.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  english_pob_choice: as he was sowing
  chosen_korean: 그가 뿌리는 동안
  alternatives_korean:
  - 그가 씨를 뿌릴 때
  - 뿌리는 중에
  lexicon: BDAG
  rationale: 동시 동작을 나타내는 아티클 포함 부정사 구문을 한국어의 진행 표현으로 옮겼습니다.
- source_word: παρὰ τὴν ὁδόν
  english_pob_choice: beside the path
  chosen_korean: 길가에
  alternatives_korean:
  - 길 옆에
  - 길 곁에
  lexicon: BDAG
  rationale: παρά + 대격의 위치 관계를 한국어 관용 표현인 ‘길가에’로 자연스럽게 옮겼습니다.
- source_word: κατεπατήθη
  english_pob_choice: was trampled
  chosen_korean: 짓밟혔고
  alternatives_korean:
  - 밟혔고
  - 밟혀 짓눌렸고
  lexicon: BDAG
  rationale: 수동태의 강한 뉘앙스를 살려 ‘짓밟혔고’로 옮겼습니다.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  english_pob_choice: the birds of the sky
  chosen_korean: 하늘의 새들이
  alternatives_korean:
  - 하늘의 새들이
  - 공중의 새들이
  lexicon: BDAG
  rationale: 직역에 가까운 ‘하늘의 새들’이 원문의 이미지와 POB의 선택을 잘 반영합니다.
- source_word: κατέφαγεν αὐτό
  english_pob_choice: devoured it
  chosen_korean: 먹어 치웠습니다
  alternatives_korean:
  - 삼켜 버렸습니다
  - 먹어 버렸습니다
  lexicon: BDAG
  rationale: 완결성과 강도를 함께 드러내는 동사로, 단순한 ‘먹다’보다 강한 소진의 의미를 살렸습니다.
theological_decisions:
- issue: 비유 속 동작의 연속을 한국어 시제·상으로 어떻게 드러낼지
  chosen_reading: 서술 전체를 과거형으로 두되, ‘그가 뿌리는 동안’으로 동시성을 표시했습니다.
  alternative_readings:
  - 과거 진행형을 더 강하게 반복하는 표현
  - 단순 과거만으로 평면적으로 처리
  rationale: 헬라어의 서술 진행과 사건 연쇄를 자연스러운 한국어로 재현하기 위한 선택입니다.
  doctrine_reference: 해석학적 문체 결정
