  source_fidelity: 본문은 Ἐξῆλθεν, 목적 용법의 τοῦ σπεῖραι, 동시성을 나타내는 ἐν τῷ σπείρειν, 길가(παρὰ τὴν ὁδόν), 수동태 κατεπατήθη, 그리고 강조된 먹음의 κατέφαγεν을 충실히 반영합니다. 다만 ὃ μὲν이 가리키는 씨의 일부를 ‘어떤 씨는’으로 명시하면 한국어에서 지시 대상이 더 분명해집니다.
