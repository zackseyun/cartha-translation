  terminology: ‘씨 뿌리는 사람’, ‘길가’, ‘하늘의 새들’, ‘먹어 치웠습니다’는 적절합니다. 각주에서 ‘천상의’은 οὐρανοῦ의 이 문맥상 가능한 번역이라기보다 신학적 뉘앙스를 불필요하게 덧붙일 수 있으므로, 한국어의 일반적 대안인 ‘공중의 새들’로 제시하는 것이 좋습니다.
  issues:
