id: LUK.8.32
reference: Luke 8:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: Now there was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
  footnotes:
  - marker: a
    text: Or 'many pigs' or 'a considerable herd of pigs.'
    reason: lexical_alternative
  - marker: b
    text: Or 'on the hillside.'
    reason: lexical_alternative
  - marker: c
    text: The subject 'they' refers to the demons/unclean spirits in the surrounding context; some translations make this explicit.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳 산[b]에는 큰 돼지 떼[a]가 먹이를 먹고 있었습니다. 그들[c]은 그 돼지들 속으로 들어가도록 자기들에게 허락해 달라고 그분께 간청하였고, 그분은 그들에게 허락하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 돼지들’ 또는 ‘상당한 규모의 돼지 떼’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산비탈에’.
    reason: lexical_alternative
  - marker: c
    text: ‘그들’은 주변 문맥의 귀신들/더러운 영들을 가리킵니다. 일부 번역은 이를 명시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  english_pob_choice: a large herd of pigs
  chosen_korean: 돼지들이 많이 무리 지어
  alternatives_korean:
  - 큰 돼지 떼가
  - 상당한 규모의 돼지 무리가
  lexicon: BDAG
  rationale: ἀγέλη는 가축의 무리를 뜻하고 χοίρων은 돼지를 가리키므로, 한국어에서는 자연스러운 집합 표현인 ‘무리’와 복수 주어를 살려 옮겼습니다. ἱκανῶν은 수량의 충분함/많음을 나타내므로 ‘많이’로 반영했습니다.
- source_word: βοσκομένη
  english_pob_choice: feeding
  chosen_korean: 먹이를 먹고 있었습니다
  alternatives_korean:
  - 풀을 뜯고 있었습니다
  - 먹고 있었습니다
  lexicon: BDAG
  rationale: βοσκομένη는 동물이 먹이를 먹는 상태를 나타내므로, 돼지의 상황에 맞게 ‘먹이를 먹고 있었습니다’로 구체화했습니다.
- source_word: ἐν τῷ ὄρει
  english_pob_choice: on the mountain
  chosen_korean: 산에
  alternatives_korean:
  - 산에서
  - 산비탈에
  lexicon: BDAG
  rationale: ὄρος를 비교적 직역해 ‘산에’로 두되, 한국어에서 자연스러운 위치 표현이 되도록 했습니다.
- source_word: παρεκάλεσαν αὐτόν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν
  english_pob_choice: they begged him to permit them to enter those pigs
  chosen_korean: 자기들에게 그 돼지들에게 들어가게 해 달라고 그분께 간청하였고
  alternatives_korean:
  - 그분께 그 돼지들 안으로 들어가게 해 달라고 애원하였고
  - 그분께 그 돼지들에게 들어가도록 허락해 달라고 청하였고
  lexicon: BDAG
  rationale: παρεκάλεσαν은 단순한 요청보다 강한 간청이므로 ‘간청하다’로 옮겼고, ἵνα 절은 목적/청원의 내용이어서 한국어에서는 ‘-게 해 달라’ 구문이 가장 자연스럽습니다. εἰς ἐκείνους εἰσελθεῖν은 ‘그 돼지들에게 들어가다’로 직역해 대상의 실체를 드러냈습니다.
theological_decisions:
- issue: 말하는 주어의 암시성
  chosen_reading: ‘그들은’은 문맥상 귀신들/더러운 영들을 가리키지만, 본문처럼 명시하지 않고 유지했습니다.
  alternative_readings:
  - ‘귀신들이 그분께 간청하였고’로 명시하기
  rationale: 헬라어 본문은 복수 동사로만 처리하고 있으므로, 문맥상 분명한 주체를 한국어에서 과도하게 해명하지 않고 원문의 함축을 보존했습니다.
  doctrine_reference: 문맥이 밝히는 의미는 유지하되, 본문이 직접 말하지 않는 요소는 해석으로 과잉 확정하지 않습니다.
