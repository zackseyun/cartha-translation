  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, εἰς ἐκείνους εἰσελθεῖν은 귀신들이 돼지들 ‘속으로’ 들어가는 것을 뜻하므로 ‘그 돼지들에게 들어가게’보다 ‘그 돼지들 속으로 들어가도록’이 정확합니다. ἱκανῶν은 ‘큰 돼지 떼’로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘돼지들이 많이 무리 지어’는 집합명사와 복수 주어 및 부사가 중복되어 현대 표준어로 부자연스럽습니다. ‘큰 돼지 떼가’가 간결하고 자연스럽습니다. 또한 ‘그곳 산에는’이 장소 표현으로 매끄럽습니다.
  terminology: ‘돼지 떼’, ‘간청하였습니다’, ‘허락하셨습니다’는 현대적이면서도 격식 있는 합쇼체에 적절합니다. 문맥상 귀신들을 가리키는 복수 주어는 본문에서 ‘그들’로 유지합니다.
  issues:
  - severity: medium
