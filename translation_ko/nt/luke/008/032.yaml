revisions:
- from: 그곳에는 돼지들이 많이 무리 지어 산에 먹이를 먹고 있었습니다[a][b]. 그러자 그들은 자기들에게 그 돼지들[c]에게 들어가게 해 달라고 그분께 간청하였고, 그분은 그들에게 허락하셨습니다.
  to: 그곳 산[b]에는 큰 돼지 떼[a]가 먹이를 먹고 있었습니다. 그들[c]은 그 돼지들 속으로 들어가도록 자기들에게 허락해 달라고 그분께 간청하였고, 그분은 그들에게 허락하셨습니다.
  rationale: 집합명사 ἀγέλη와 수량·규모를 나타내는 ἱκανῶν을 ‘큰 돼지 떼’로 자연스럽게 옮겼습니다. ‘속으로’를 보충하여 εἰς의 방향성과 εἰσελθεῖν의 내부 진입 의미를 보존했습니다. 복수 주어는 원문처럼 명시적 해설 없이 유지하되, 관련 각주 표지를 주어에 배치했습니다.
