  - severity: low
    issue: 각주 c의 표지가 지시 대상이 아닌 ‘그 돼지들’에 붙어 있습니다.
    rationale: 각주의 내용은 ‘그들’의 문맥상 지시 대상에 관한 것이므로, 표지는 ‘그들’에 붙여야 독자가 혼동하지 않습니다.
