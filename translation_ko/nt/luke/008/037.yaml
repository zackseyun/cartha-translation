- from: 그러자 게라사인들의 주변 지역의 모든 무리가 그에게서 떠나 달라고 요청했습니다. 그들이 큰 두려움에 사로잡혀 있었기 때문입니다. 예수님은 배에 오르셔서 돌아가셨습니다.[a]
  to: 그러자 게라사인들의 주변 지역에 사는 온 무리가 예수님께 자기들에게서 떠나 달라고 요청했습니다. 그들이 큰 두려움에 사로잡혀[a] 있었기 때문입니다. 예수님은 배에 오르셔서 돌아가셨습니다.
  rationale: ἀπ’ αὐτῶν의 기준점을 ‘자기들에게서’로 바로잡아 군중의 요청 대상을 정확히 옮겼습니다. τῆς περιχώρου τῶν Γερασηνῶν은 ‘게라사인들의 주변 지역에 사는’으로 자연스럽게 풀었고, 각주를 ‘사로잡혀’에 연결하여 συνέχοντο의 대안 번역임을 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:13Z'
