id: LUK.8.37
reference: Luke 8:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
  footnotes:
  - marker: a
    text: Or 'were seized by great fear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 게라사인들의 주변 지역의 모든 무리가 그에게서 떠나 달라고 요청했습니다. 그들이 큰 두려움에 사로잡혀 있었기 때문입니다. 예수님은 배에 오르셔서 돌아가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 두려움에 붙들려 있었기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅπαν τὸ πλῆθος
  english_pob_choice: the whole crowd
  chosen_korean: 모든 무리
  alternatives_korean:
  - 온 무리
  - 전체 무리
  lexicon: BDAG
  rationale: ἅπαν의 총괄성을 살리면서 현대 한국어에서 자연스러운 집합 표현으로 옮겼습니다.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  english_pob_choice: from the surrounding region of the Gerasenes
  chosen_korean: 게라사인들의 주변 지역
  alternatives_korean:
  - 게라사인들의 둘러싼 지역
  - 게라사 주변 지방
  lexicon: BDAG
  rationale: περίχωρος의 ‘주변 지역’ 의미를 살리고, τῶν Γερασηνῶν은 지역의 주민/소속을 나타내는 말로 보아 소유격 관계를 자연스럽게 풀었습니다.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  english_pob_choice: to depart from them
  chosen_korean: 그에게서 떠나 달라고 요청했습니다
  alternatives_korean:
  - 그들 곁을 떠나 달라고 요청했습니다
  - 그들에게서 떠나 달라고 청했습니다
  lexicon: BDAG
  rationale: ἐρωτάω의 기본값을 따라 ‘요청했습니다’로 두고, ἀπ’ αὐτῶν은 대상에서 물러나라는 뜻이므로 ‘그에게서 떠나’로 옮겼습니다.
- source_word: φόβῳ μεγάλῳ συνείχοντο
  english_pob_choice: they were gripped by great fear
  chosen_korean: 큰 두려움에 사로잡혀 있었기 때문입니다
  alternatives_korean:
  - 큰 두려움에 붙들려 있었기 때문입니다
  - 큰 두려움으로 압도되어 있었기 때문입니다
  lexicon: BDAG
  rationale: συνείχομαι의 ‘붙들리다/사로잡히다’ 이미지를 살려, POB의 ‘gripped’에 대응하는 한국어로 ‘사로잡혀’가 가장 직접적입니다.
- source_word: ἐμβὰς εἰς πλοῖον
  english_pob_choice: he got into a boat
  chosen_korean: 배에 오르셔서
  alternatives_korean:
  - 배에 타셔서
  - 배 안으로 들어가셔서
  lexicon: BDAG
  rationale: πλοῖον은 문맥상 ‘배’가 자연스럽고, ἐμβάς는 탑승 동작을 간결하게 표현하는 ‘오르다’로 옮겼습니다.
- source_word: ὑπέστρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아가셨습니다
  alternatives_korean:
  - 되돌아가셨습니다
  - 돌아가셨습니다
  lexicon: BDAG
  rationale: ὑποστρέφω의 기본 의미인 ‘돌아가다’를 현대 공손체 서술로 반영했습니다.
theological_decisions:
- issue: 두려움의 성격을 어떻게 처리할 것인가
  chosen_reading: 본문은 그들이 예수님을 떠나 달라고 한 이유를 단지 ‘큰 두려움’으로만 제시하므로, 그 두려움이 경외인지 반감인지 단정하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 경외에 가까운 두려움으로 구체화
  - 경제적 손실이나 사회적 불안을 암시하는 두려움으로 구체화
  rationale: 본문이 두려움의 성격을 해설하지 않으므로, 번역도 그 긴장을 해소하지 않아야 합니다.
  doctrine_reference: 본문이 제공하는 범위 안에서만 신학적 해석을 제한함
