id: LUK.8.29
reference: Luke 8:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
  footnotes:
  - marker: a
    text: Or 'for a long time'; the Greek can denote extended duration, though the context also supports repeated episodes, hence 'many times.'
    reason: lexical_alternative
  - marker: b
    text: Or 'into the wilderness.' The Greek is plural, literally 'into the deserted places.'
    reason: lexical_alternative
  - marker: c
    text: Or 'yet breaking the bonds he was driven'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 더러운 영에게 그 사람에게서 나오라고 명령하고 계셨기 때문입니다. 그 귀신이 오랫동안[a] 그 사람을 사로잡아 왔고, 그는 쇠사슬과 족쇄에 묶여 감시받고 있었습니다. 그러나 그는 결박을 끊고[c], 귀신에게 이끌려 황량한 곳들로[b] 내몰렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘많은 시간 동안’입니다. 문맥상 ‘여러 차례에 걸쳐’라는 반복의 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광야로’. 그리스어는 복수형으로, 직역하면 ‘황량한 곳들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘결박을 끊으며’입니다. 조건을 뜻하는 표현은 아닙니다.
    reason: previous_rendering
lexical_decisions:
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  english_pob_choice: the unclean spirit
  chosen_korean: 더러운 영
  alternatives_korean:
  - 부정한 영
  - 깨끗하지 않은 영
  lexicon: SBLGNT
  rationale: ἀκάθαρτος는 의례적·도덕적 부정함을 함께 띨 수 있어, POB의 ‘unclean spirit’에 맞춰 직설적인 ‘더러운 영’으로 옮겼습니다.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  english_pob_choice: to come out of the man
  chosen_korean: 그 사람에게서 나오라고
  alternatives_korean:
  - 그 사람으로부터 나오라고
  - 그 사람에게서 빠져나오라고
  lexicon: SBLGNT
  rationale: ἐξέρχομαι + ἀπό의 이탈/분리 의미를 살려, 귀신 축출 문맥의 자연스러운 한국어로 표현했습니다.
- source_word: πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν
  english_pob_choice: For many times it had seized him
  chosen_korean: 그 영이 여러 번 그를 사로잡았고
  alternatives_korean:
  - 오랫동안 그를 사로잡았고
  - 그가 여러 차례 붙잡혀 있었고
  lexicon: SBLGNT
  rationale: πολλοῖς χρόνοις는 ‘오랫동안’보다 반복적 사건을 더 강하게 드러낼 수 있어, POB의 판단을 따라 ‘여러 번’으로 옮겼습니다.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος
  english_pob_choice: was kept bound with chains and shackles, being guarded
  chosen_korean: 쇠사슬과 족쇄에 묶인 채 지켜지고 있었으며
  alternatives_korean:
  - 쇠사슬과 족쇄로 묶여 감시를 받았으며
  - 쇠사슬과 족쇄에 묶여 있었으며 지켜지고
  lexicon: SBLGNT
  rationale: ἁλύσεις와 πέδαι를 각각 ‘쇠사슬’과 ‘족쇄’로 구분해 구속의 강도를 살렸고, φυλασσόμενος는 상태를 나타내는 분사로서 ‘지켜지고 있었으며’로 자연스럽게 풀었습니다.
- source_word: ὑπὸ τοῦ δαιμονίου εἰς τὰς ἐρήμους
  english_pob_choice: by the demon into the desolate places
  chosen_korean: 악귀에게 이끌려 광야 같은 곳으로 갔습니다
  alternatives_korean:
  - 악귀에게 끌려 황폐한 곳으로 갔습니다
  - 악귀에 의해 버려진 곳들로 갔습니다
  lexicon: SBLGNT
  rationale: δαιμόνιον은 서술 세계의 인격적 악령을 가리키므로 ‘악귀’로 옮겼고, ἐρήμους의 복수성을 살리면서도 한국어로는 자연스럽게 ‘광야 같은 곳’으로 표현했습니다.
theological_decisions:
- issue: 악령과 인간 의지의 관계를 어떻게 드러낼지
  chosen_reading: 이 구절은 악령의 인격적 사역과 강제성을 직접적으로 진술하므로, 이를 병리학적 표현이나 단순 비유로 완화하지 않았습니다.
  alternative_readings:
  - 심리적 질환처럼 완화하는 해석
  - 비유적 억압으로 보는 해석
  rationale: 본문은 예수의 명령, 사로잡음, 결박, 강제 이송을 연속적으로 제시해 실재적 영적 대립을 보여줍니다.
  doctrine_reference: 공관복음의 귀신 축출 기사에 대한 정통 기독교 이해
