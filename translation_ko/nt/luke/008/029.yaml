  to: 예수께서 더러운 영에게 그 사람에게서 나오라고 명령하고 계셨기 때문입니다. 그 귀신이 오랫동안[a] 그 사람을 사로잡아 왔고, 그는 쇠사슬과 족쇄에 묶여 감시받고 있었습니다. 그러나 그는 결박을 끊고[c], 귀신에게 이끌려 황량한 곳들로[b] 내몰렸습니다.
  rationale: 원문의 시간 표현, 분사 구조, 수동적 강제 이동을 보존하도록 고쳤습니다. 특히 조건절과 ‘나오다’를 삭제하고, ‘갔습니다’를 ‘내몰렸습니다’로 바꾸어 원문의 의미를 회복했습니다. 첫 문장의 미완료 과거는 문맥상 진행 중인 명령을 나타내므로 ‘명령하고 계셨기 때문입니다’로 옮겼습니다. 반면 γάρ의 연결은 한국어에서도 앞 절을 전제하는 ‘때문입니다’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
