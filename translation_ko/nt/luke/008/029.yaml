  source_fidelity: 수정이 필요합니다. πολλοῖς χρόνοις는 우선적으로 ‘오랫동안’이라는 지속 기간을 뜻하므로 본문에는 이를 채택하고, 반복적 이해는 각주에 남겼습니다. 또한 διαρρήσσων은 조건절이나 ‘나오다’를 포함하지 않으며, ἠλαύνετο는 자발적으로 ‘갔다’가 아니라 귀신에게 강제로 내몰린 수동 표현입니다.
  naturalness: 초안의 ‘결박을 끊고 나오면’은 조건 표현으로 바뀌어 어색하고 원문보다 내용을 보탭니다. ‘결박을 끊고, 귀신에게 이끌려 … 내몰렸습니다’는 현대 표준어 합쇼체로 자연스럽고 강제성을 드러냅니다. ‘광야 같은 곳’의 ‘같은’은 원문에 없는 완화 표현이므로 삭제했습니다.
  terminology: πνεύματι τῷ ἀκαθάρτῳ는 ‘더러운 영’, δαιμόνιον은 ‘귀신’으로 옮겨 두 용어를 구별했습니다. ‘악귀’도 가능한 말이나, 본문에 없는 가치 판단을 덧붙이지 않는 ‘귀신’이 더 절제되어 있습니다. ἁλύσεσιν καὶ πέδαις는 ‘쇠사슬과 족쇄’, τὰς ἐρήμους는 복수성을 반영한 ‘황량한 곳들’로 옮겼습니다.
