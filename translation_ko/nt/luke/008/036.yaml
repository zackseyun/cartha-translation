  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
  footnotes:
  - marker: a
    text: Or, 'how the demon-possessed man had been healed' or 'had been delivered.' The Greek verb can mean save, heal, or deliver, depending on context.
