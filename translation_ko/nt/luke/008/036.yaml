  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
  footnotes:
  - marker: a
    text: Or, 'how the demon-possessed man had been healed' or 'had been delivered.' The Greek verb can mean save, heal, or deliver, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그것을 본 사람들이 그들에게 그 귀신 들렸던 사람이 어떻게 구원을 받았는지 보고하였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 귀신 들렸던 사람이 어떻게 고침을 받았는지’ 혹은 ‘어떻게 해방되었는지’로도 옮길 수 있습니다. 헬라어 동사 σῴζω는 문맥에 따라 구원, 치유, 해방을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  english_pob_choice: reported
  chosen_korean: 보고하였습니다
  alternatives_korean:
  - 알렸습니다
  - 전하였습니다
  lexicon: BDAG
  rationale: 목격자들의 증언을 전달하는 문맥이므로, 단순히 말하다보다 공식성이 약간 있는 ‘보고하였습니다’가 적절합니다.
- source_word: δὲ
  english_pob_choice: And
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 또
  - 하지만
  lexicon: BDAG
  rationale: δέ는 이야기를 자연스럽게 이어 주는 약한 접속사이므로, 한국어에서는 문맥 흐름을 살리는 ‘그런데’로 옮겼습니다.
- source_word: ἐσώθη
  english_pob_choice: had been saved
  chosen_korean: 구원을 받았는지
  alternatives_korean:
  - 고침을 받았는지
  - 해방되었는지
  - 구원되었는지
  lexicon: BDAG
  rationale: σῴζω의 의미 범위를 살려 ‘구원’을 기본으로 두되, 이 문맥에서는 치유와 해방의 뉘앙스도 함께 열어 두었습니다. 영어 본문의 주석처럼 단일 의미로 좁히지 않았습니다.
- source_word: ὁ δαιμονισθείς
  english_pob_choice: the demon-possessed man
  chosen_korean: 그 귀신 들렸던 사람
  alternatives_korean:
  - 그 귀신 들린 사람
  - 그 악령에 사로잡혔던 사람
  lexicon: BDAG
  rationale: 남성 단수의 실체를 가리키는 표현으로, 한국어에서 자연스럽고 직설적인 ‘귀신 들렸던 사람’을 택했습니다. ‘사람’으로 풀어 인격적 대상을 분명히 했습니다.
theological_decisions:
- issue: σῴζω(ἐσώθη)의 번역 범위
  chosen_reading: ‘구원을 받았다’로 두되, 이 장면이 곧바로 신체적·영적 구분을 확정하지는 않도록 했습니다.
  alternative_readings:
  - ‘고침을 받았다’
  - ‘해방되었다’
  rationale: 본문은 귀신 들림에서의 회복을 말하지만, 그리스어 동사는 치료·구출·구원의 의미를 모두 가질 수 있습니다. 그래서 의미를 좁히지 않고 본문이 허용하는 폭을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
