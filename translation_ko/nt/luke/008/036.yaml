  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 δέ는 여기서 대조를 강하게 만드는 ‘그런데’보다 단순한 서술 연결로 옮기는 편이 적절합니다. 또한 ἐσώθη를 ‘구원을 받았다’로 옮길 수는 있으나, 이 축귀 문맥에서 한국어 독자가 이를 오직 종교적 구원으로 좁게 이해할 가능성이 있어 주석의 의미 범위를 더 분명히 하는 것이 좋습니다.
  naturalness: ‘보고하였습니다’도 가능하지만, 목격자들이 사건의 결과를 다른 이들에게 전하는 문맥에서는 ‘알려 주었습니다’가 현대 표준어 합쇼체에서 더 자연스럽습니다. 목적어와 종속절의 순서를 조정하면 문장 흐름도 좋아집니다.
  terminology: ‘귀신 들렸던 사람’은 δαιμονισθείς의 과거 상태를 자연스럽게 반영합니다. σῴζω는 본문에서 ‘구원’을 유지하되, 주석에서 ‘고침’과 ‘해방’이라는 문맥적 대안을 보존합니다. ‘헬라어’보다 현대 학술·성경 번역 문체에 널리 쓰이는 ‘그리스어’를 사용합니다.
