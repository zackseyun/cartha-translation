source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
  footnotes:
  - marker: a
    text: Or “from the ruler of the synagogue.”
    reason: lexical_alternative
  - marker: b
    text: Or “do not bother the teacher any longer.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 아직 말씀하고 계실 때에, 회당 지도자[a]에게서 한 사람이 와서 말했습니다. “당신의 딸이 죽었습니다. 더 이상 선생님을 번거롭게 하지[b] 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “회당의 회당장”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “더 이상 선생님을 괴롭히지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  english_pob_choice: While he was still speaking
  chosen_korean: 아직 말씀하고 계실 때에
  alternatives_korean:
  - 말씀하시는 동안에
  - 그가 아직 말하고 있을 때에
  lexicon: BDAG
  rationale: ἔτι의 ‘아직’과 동시 진행을 함께 살려, 현재 진행 중인 말과 동시에 벌어진 상황을 자연스러운 한국어로 옮겼습니다.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  english_pob_choice: from the synagogue leader
  chosen_korean: 회당 지도자
  alternatives_korean:
  - 회당의 통치자
  - 회당 관리
  lexicon: BDAG
  rationale: παρά + 속격의 출처 의미를 반영해 ‘~에게서 온’으로 풀고, ἀρχισυνάγωγος는 현대 독자가 이해하기 쉬운 ‘회당 지도자’로 옮겼습니다.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  english_pob_choice: Your daughter has died
  chosen_korean: 당신의 딸이 죽었습니다
  alternatives_korean:
  - 당신의 딸은 죽었습니다
  - 당신의 딸이 죽었어요
  lexicon: BDAG
  rationale: 완료형 τέθνηκεν이 결과 상태를 포함하므로 단순 과거보다 ‘죽었습니다’가 더 자연스럽고, 직설적 통보의 긴박함도 살립니다.
- source_word: μηκέτι σκύλλε τὸν διδάσκαλον
  english_pob_choice: do not trouble the teacher any longer
  chosen_korean: 더 이상 선생님을 괴롭히지 마십시오
  alternatives_korean:
  - 더는 선생님을 방해하지 마십시오
  - 더 이상 선생님을 번거롭게 하지 마십시오
  lexicon: BDAG
  rationale: σκύλλε의 ‘괴롭히다/번거롭게 하다’ 의미를 살리되, 한국어에서는 공손한 요청형으로 옮겨 메시지의 절박함과 예의가 함께 드러나게 했습니다.
theological_decisions:
- issue: διδάσκαλος의 호칭 처리
  chosen_reading: ‘선생님’
  alternative_readings:
  - ‘스승님’
  - ‘선생’
  rationale: 이 문맥에서 διδάσκαλος는 일반적인 ‘teacher’의 의미이므로, 과도한 신학적 격상 없이 평이한 호칭으로 옮겼습니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 호칭 수준을 유지'
