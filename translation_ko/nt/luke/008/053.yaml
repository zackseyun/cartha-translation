lexical_decisions:
- source_word: κατεγέλων
  english_pob_choice: were laughing at
  chosen_korean: 비웃었습니다
  alternatives_korean:
  - 웃어넘겼습니다
  - 조롱했습니다
  - 웃었습니다
  lexicon: BDAG
  rationale: 미완료 과거의 반복·지속 뉘앙스와 멸시의 힘을 함께 담기 위해, 자연스러운 현대 한국어로는 ‘비웃었습니다’가 가장 적절합니다.
- source_word: αὐτοῦ
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그에게
  - 그분을
  lexicon: BDAG
  rationale: 동사의 목적 대상이 예수를 가리키므로, 한국어에서도 직접 목적어로 드러내는 것이 자연스럽고 원문 관계를 분명히 합니다.
- source_word: εἰδότες ὅτι
  english_pob_choice: because they knew that
  chosen_korean: 그녀가 죽은 것을 알고 있었으므로
  alternatives_korean:
  - 그녀가 죽은 것을 알고서
  - 그녀가 죽었다는 것을 알고 있었기에
  - 알고 있었으므로
  lexicon: BDAG
  rationale: 분사 εἰδότες는 원인/이유를 제시하므로 ‘알고 있었으므로’로 옮기고, ὅτι절은 그들이 알고 있던 내용으로 풀어 원문의 구조를 살렸습니다.
- source_word: ἀπέθανεν
  english_pob_choice: had died
  chosen_korean: 죽은
  alternatives_korean:
  - 죽었다
  - 죽어 있었다
  lexicon: BDAG
  rationale: 완료된 죽음의 사건을 한국어 관용으로는 ‘죽은 것’이 가장 간결하게 표현하며, 서사상 과거 완료의 기능도 무리 없이 전달합니다.
theological_decisions:
- issue: 조롱의 행위가 단순한 웃음인지, 멸시를 담은 조롱인지
  chosen_reading: ‘비웃었습니다’로 옮겨 멸시와 조롱의 강도를 드러냈습니다.
  alternative_readings:
