  source_fidelity: κατεγέλων의 미완료상은 진행되거나 거듭되는 조롱을 나타냅니다. 현 초안의 ‘비웃었습니다’도 조롱의 의미는 보존하지만, 진행성을 드러내지 못합니다. ‘계속 비웃고 있었습니다’는 이 점을 자연스럽게 반영합니다. εἰδότες의 인과적 용법과 ὅτι절의 내용, 그리고 ἀπέθανεν이 가리키는 죽음의 완료 사건은 ‘죽었다는 것을 알고 있었으므로’로 충실히 옮겨집니다.
  naturalness: ‘그녀’는 한국어 성경 서사에서 어린 소녀를 가리킬 때 다소 부자연스럽거나 연령상 어색하게 들릴 수 있습니다. 직전 문맥에서 이미 언급된 소녀를 가리키는 ‘그 아이’가 자연스럽고 지시 대상도 분명합니다. 문장 연결을 위해 쉼표를 더했습니다.
  terminology: ‘비웃다’는 καταγελάω의 경멸적·조롱하는 의미를 적절히 전달합니다. 예수에 대한 존칭을 본 절에만 추가하지 않고 ‘그를’로 유지한 것은 원문의 대명사적 표현과 문맥상 호칭의 일관성에 부합합니다.
