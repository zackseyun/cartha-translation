review_pass:
  verdict: revise
  source_fidelity: 원문의 대조(οὐδείς ... οὐ/ἀλλά)와 목적절(ἵνα)을 보존해야 합니다. 초안은 ‘아무도 … 두지 않고, … 둡니다’라는 연결 때문에 부정과 대조의 범위가 문법적으로 불분명해집니다. 이를 ‘두지 않습니다. 오히려 둡니다’로 분명히 하면 원문의 대조를 정확히 전달합니다.
  naturalness: ‘등불을 켠 뒤 그것을 그릇으로 덮거나 침대 아래에 두지 않습니다. 오히려 … 둡니다’는 현대 표준어 합쇼체로 자연스럽고, 등불을 덮는 대상도 명확합니다. 목적은 ‘빛을 보도록 합니다’로 간결하게 표현했습니다.
  terminology: λύχνος/λυχνία는 각각 ‘등불/등잔대’로 일관되게 옮겼습니다. σκεῦος는 문맥상 ‘그릇’, κλίνη는 현대 독자에게 자연스러운 ‘침대’로 유지할 수 있습니다. 신학적 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: 부정과 대조의 문장 구조가 불분명함
    rationale: 초안의 ‘아무도 … 두지 않고, 등잔대 위에 둡니다’는 한국어에서 ‘아무도’가 뒤의 ‘둡니다’에도 걸리는 듯하게 읽힐 수 있으며, 원문의 ‘아무도 A나 B를 하지 않고, 오히려 C를 한다’는 대조가 충분히 명료하지 않습니다.
  - severity: low
    issue: 목적절의 주체·관계 표현이 다소 장황함
    rationale: ‘그렇게 하여 … 보게 하려는 것입니다’도 뜻은 전달하지만, 원문의 직접적인 행동-목적 관계는 ‘놓아 … 보도록 합니다’가 더 자연스럽고 간명하게 드러냅니다.
  revised_text: 아무도 등불을 켠 뒤 그것을 그릇으로 덮거나 침대 아래에 두지 않습니다. 오히려 등잔대 위에 놓아, 들어오는 사람들이 빛을 보도록 합니다.
