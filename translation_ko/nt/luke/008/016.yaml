id: LUK.8.16
reference: Luke 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: Now no one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: ko
  text: 아무도 등불을 켠 뒤 그것을 그릇으로 덮거나 침대 아래에 두지 않습니다. 오히려 등잔대 위에 놓아, 들어오는 사람들이 빛을 보도록 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδεὶς ... καλύπτει
  english_pob_choice: no one ... covers it
  chosen_korean: 아무도 ... 덮어 두거나
  alternatives_korean:
  - 아무도 ... 가리지 않거나
  - 아무도 ... 덮지 않거나
  lexicon: οὐδείς, καλύπτω
  rationale: οὐδεὶς의 포괄적 부정을 자연스럽게 살려 ‘아무도’로 옮기고, 등불을 실제로 가려 두는 동작은 ‘덮어 두다’가 가장 직관적입니다.
- source_word: σκεύει
  english_pob_choice: with a container
  chosen_korean: 그릇으로
  alternatives_korean:
  - 용기로
  - 기구로
  lexicon: σκεῦος
  rationale: σκεύει는 일반적으로 ‘그릇/용기’로 이해되는 넓은 물건을 가리키므로, 현대 한국어에서 문맥상 가장 자연스러운 ‘그릇’으로 옮겼습니다.
- source_word: ὑποκάτω κλίνης
  english_pob_choice: under a bed
  chosen_korean: 침대 아래에
  alternatives_korean:
  - 침상 아래에
  - 이불 아래에
  lexicon: κλίνη
  rationale: κλίνη는 눕는 가구를 뜻하므로 현대 독자가 바로 이해할 수 있는 ‘침대’로 옮겼습니다.
- source_word: ἐπὶ λυχνίας
  english_pob_choice: on a lampstand
  chosen_korean: 등잔대 위에
  alternatives_korean:
  - 등대 위에
  - 촛대 위에
  lexicon: λυχνία
  rationale: λυχνία는 등불을 올려 두는 받침대를 가리키므로, 본문 이미지에 맞게 ‘등잔대’가 가장 적절합니다.
theological_decisions:
- issue: 빛의 목적절 ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς의 전달
  chosen_reading: 그렇게 하여 들어오는 사람들이 그 빛을 보게 하려는 것입니다.
  alternative_readings:
  - 그래서 들어오는 사람들이 빛을 보게 하려는 것입니다.
  - 들어오는 사람들이 빛을 보도록 하려는 것입니다.
  rationale: ἵνα절의 목적성을 분명히 드러내되, ‘그 빛’으로 옮겨 앞절의 등불이 비추는 실제 빛과 연결되도록 했습니다.
  doctrine_reference: 본문의 교훈적 비유 구조를 보존하는 번역 원칙
