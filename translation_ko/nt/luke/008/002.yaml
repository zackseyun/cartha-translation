translation:
  language: ko
  text: 그리고 악한 영들과 질병에서 고침을 받은 몇몇 여인들이 있었는데, 마리아라 불리는 막달라인, 곧 일곱 귀신이 나간 그 여인도 있었습니다.[a][b]
  philosophy: optimal-equivalence
