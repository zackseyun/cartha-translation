  source_fidelity: 원문은 ‘악한 영들과 질병에서 고침을 받은’ 여성들을 소개하고, 그중 한 사람으로 ‘막달라라 불리는 마리아’를 동격으로 제시합니다. 초안의 ‘마리아라 불리는 막달라인’은 Μαγδαληνή를 인명 ‘막달라인’처럼 처리하여 마리아를 수식하는 별칭의 방향을 바꾸므로 수정이 필요합니다. 또한 ἀφ’ ἧς의 ‘그에게서/from whom’를 명시하는 편이 정확합니다.
  naturalness: ‘막달라 마리아’는 현대 표준 한국어 성경 문맥에서 널리 통용되는 자연스러운 이름 형태입니다. ‘몇몇 여인들이 있었는데’는 앞 절과 이어지는 본문의 열거를 한국어로 무리 없이 반영합니다.
