translation:
  language: ko
  text: 그리고 악한 영들과 질병에서 고침을 받은 몇몇 여인들이 있었는데, 그중에는 막달라 마리아도 있었습니다. 그에게서 일곱 귀신이 나갔던 마리아입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 여인들이’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그에게서 일곱 귀신이 떠나갔던’.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκές τινες
  english_pob_choice: some women
  chosen_korean: 몇몇 여인들
  alternatives_korean:
  - 어떤 여인들
  - 몇몇 여자들
  lexicon: BDAG
  rationale: τινες가 더하는 불특정 복수성을 한국어에서 자연스럽게 살리기 위해 ‘몇몇’으로 옮겼습니다. ‘여인들’은 문맥상 여성 제자 집단을 공손하게 가리키는 표현입니다.
- source_word: τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν
  english_pob_choice: had been healed from evil spirits and sicknesses
  chosen_korean: 악한 영들과 질병에서 고침을 받은
  alternatives_korean:
  - 악한 영들과 병들에서 치료받은
  - 악한 영들과 질병에서 치유된
  lexicon: BDAG
  rationale: 완료 수동의 ‘치유/치료’는 영적·육체적 고침을 함께 포괄해야 하므로, 전통적 종교어보다 원문 구조가 드러나는 ‘고침을 받은’을 택했습니다. ‘악한 영들’은 πονηρῶν을 그대로 살린 표현입니다.
- source_word: ἡ καλουμένη Μαγδαληνή
  english_pob_choice: called Magdalene
  chosen_korean: 마리아라 불리는 막달라인
  alternatives_korean:
  - 막달라인이라 불리는 마리아
  - 막달라 사람 마리아
  lexicon: BDAG
  rationale: καλουμένη의 명명 기능을 살려 ‘~라 불리는’으로 옮겼고, Μαγδαληνή는 지명 유래의 별칭이므로 ‘막달라인’으로 처리했습니다.
- source_word: δαιμόνια ἑπτὰ ἐξεληλύθει
  english_pob_choice: seven demons had gone out
  chosen_korean: 일곱 귀신이 나간
  alternatives_korean:
  - 일곱 귀신이 나와버린
  - 일곱 귀신이 떠나간
  lexicon: BDAG
  rationale: δαιμόνια는 본문에서 구체적 인격적 존재를 가리키므로 ‘귀신’으로 옮겼고, ἐξεληλύθει의 완료 상태는 ‘나간’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 영적 affliction과 육체적 illness의 구분
  chosen_reading: 악한 영들/귀신과 질병을 서로 구별되는 범주로 유지했습니다.
  alternative_readings:
  - 둘을 포괄적으로 병고로 완화하는 번역
  - 귀신 표현을 약화해 상징적으로 읽게 하는 번역
  rationale: 본문은 πνευμάτων πονηρῶν과 ἀσθενειῶν, 그리고 뒤의 δαιμόνια를 구별해 제시하므로, 그 긴장을 지우지 않고 직역에 가깝게 보존했습니다.
  doctrine_reference: 번역 원칙 1, 3
