id: LUK.8.12
reference: Luke 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
  footnotes:
  - marker: a
    text: Or 'lest they believe and be saved.'
    reason: lexical_alternative
  - marker: b
    text: '''The word'' here means the proclaimed message of God in the parable.'
    reason: cross_reference
translation:
  language: ko
  text: 길가 곁에 있는 이들은 말씀을 들은 사람들입니다. 그러나 그다음에 악마가 와서 그들의 마음에서 말씀을 빼앗아 가 버리니, 그들이 믿고 구원을 받지 못하게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀’은 이 비유에서 선포된 하나님의 메시지를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  english_pob_choice: beside the road
  chosen_korean: 길가 곁에
  alternatives_korean:
  - 길 옆에
  - 길가에
  - 길 옆 길가에
  lexicon: BDAG
  rationale: παρά + 대격은 ‘~곁에, ~옆에’의 공간 관계를 나타내므로, ‘길가 곁에’로 길 옆의 이미지를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: οἱ ἀκούσαντες
  english_pob_choice: the ones who have heard
  chosen_korean: 말씀을 들은 사람들
  alternatives_korean:
  - 들은 사람들
  - 들었던 사람들
  lexicon: BDAG
  rationale: 과거 분사 ἀκούσαντες는 해석 부분에서 말씀을 들은 부류를 가리키므로, 결과 상태를 드러내는 ‘들은 사람들’로 옮겼습니다.
- source_word: ὁ διάβολος
  english_pob_choice: the devil
  chosen_korean: 악마
  alternatives_korean:
  - 마귀
  - 사탄
  lexicon: BDAG
  rationale: 문맥상 인격적 악한 존재를 가리키므로 직역에 가까운 ‘악마’를 사용했습니다. 한국 교회어 ‘마귀’도 가능하지만, 표준 현대어로는 ‘악마’가 더 직접적입니다.
- source_word: αἴρει τὸν λόγον
  english_pob_choice: takes away the word
  chosen_korean: 말씀을 빼앗아 가 버리니
  alternatives_korean:
  - 말씀을 가져가니
  - 말씀을 없애 버리니
  - 말씀을 빼앗아 가니
  lexicon: BDAG
  rationale: αἴρω는 ‘치우다/가져가다/빼앗다’의 뜻이 있어, 문맥의 강한 제거 의미를 살려 ‘빼앗아 가 버리니’로 옮겼습니다. λόγος는 비유 해석에서 선포된 하나님의 말씀을 가리키므로 ‘말씀’이 적절합니다.
- source_word: καρδίας αὐτῶν
  english_pob_choice: from their hearts
  chosen_korean: 그들의 마음에서
  alternatives_korean:
  - 그들의 심장에서
  - 그들의 마음속에서
  lexicon: BDAG
  rationale: καρδία는 사고·의지·반응의 중심을 가리키므로, 현대 한국어 성경 문맥에 맞는 ‘마음’으로 옮겼습니다.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  english_pob_choice: so that they may not believe and be saved
  chosen_korean: 그들이 믿고 구원을 받지 못하게 하려는 것입니다
  alternatives_korean:
  - 그들이 믿어 구원을 받지 못하게 하려는 것입니다
  - 그들이 믿지 못하고 구원받지 못하게 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα + μή는 목적/결과를 나타내므로 ‘~하지 못하게 하려는 것입니다’로 자연스럽게 풀었습니다. σωθῶσιν은 여기서 구원의 결과를 가리켜 ‘구원을 받다’로 옮겼습니다.
theological_decisions:
- issue: 믿음과 구원의 관계를 어떻게 드러낼지
  chosen_reading: ‘그들이 믿고 구원을 받지 못하게 하려는 것입니다’로 옮겨, 악마의 목적이 믿음과 구원을 가로막는다는 진술을 그대로 보존했습니다.
  alternative_readings:
  - ‘그들이 믿지 못하게 하려는 것입니다’로 축약
  - 믿음의 성격을 더 신학적으로 풀어 설명하는 번역
  rationale: 본문은 악마가 말씀을 빼앗는 목적을 진술할 뿐, 믿음과 구원의 교리를 해설하지 않습니다. 따라서 신학적 논쟁을 풀어버리지 않고 긴장을 유지했습니다.
  doctrine_reference: 본문의 목적절을 해설 없이 보존
