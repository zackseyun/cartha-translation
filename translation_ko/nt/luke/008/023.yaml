  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
  footnotes:
  - marker: a
    text: Or 'they were filling up,' that is, the boat was filling with water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 배를 타고 가는 동안 예수께서는 잠드셨습니다. 그런데 거센 바람을 동반한 폭풍이 호수 위로 내려닥쳐, 그들은 물에 잠기고 있었으며 위험에 처해 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배 안에 물이 차오르고 있었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  english_pob_choice: as they were sailing
  chosen_korean: 그들이 항해하고 있을 때
  alternatives_korean:
  - 그들이 배를 타고 갈 때
  - 그들이 항해하는 동안
  lexicon: BDAG
  rationale: 현재분사 속격 절대구의 진행·동시성을 한국어에서 자연스럽게 살리기 위해 ‘항해하고 있을 때’로 옮겼습니다.
- source_word: ἀφύπνωσεν
  english_pob_choice: he fell asleep
  chosen_korean: 잠드셨습니다
  alternatives_korean:
  - 주무셨습니다
  - 잠이 드셨습니다
  lexicon: BDAG
  rationale: 문맥상 예수님을 가리키며, aorist의 시작 동작을 한국어에서 간결하게 드러내기 위해 ‘잠드셨습니다’로 옮겼습니다.
- source_word: λαῖλαψ ἀνέμου
  english_pob_choice: a windstorm
  chosen_korean: 바람바다
  alternatives_korean:
  - 바람 폭풍
  - 거센 바람
  lexicon: BDAG
  rationale: ‘바람의 폭풍’이라는 의미를 살리되, 물 위를 덮치는 폭풍의 성격을 더 직접적으로 드러내기 위해 합성어처럼 ‘바람바다’로 옮겼습니다.
- source_word: συνεπληροῦντο
  english_pob_choice: they were being swamped
  chosen_korean: 배가 물로 가득 차고 있었으며
  alternatives_korean:
  - 배가 물로 차오르고 있었으며
  - 그들은 물이 차오르고 있었으며
  lexicon: BDAG
  rationale: 부정과거 진행형의 지속적 위협을 드러내면서도, 영어 POB의 ‘filling with water’ 취지를 따라 배가 물로 차는 상황으로 구체화했습니다.
theological_decisions:
- issue: 예수님의 수면과 제자들의 위기 서술의 시점 표현
  chosen_reading: ‘항해하고 있을 때’와 ‘잠드셨습니다’를 병치해, 예수님의 수면이 항해 도중 실제로 발생한 사건임을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘항해하는 동안’ 예수께서 ‘주무셨습니다’
  - ‘배가 가는 중에’ 예수께서 ‘잠이 드셨습니다’
  rationale: 본문은 두 사건의 동시성과 갑작스러운 폭풍의 전환을 강조하므로, 한국어에서도 배경-전경 대비를 분명하게 유지하는 것이 좋습니다.
  doctrine_reference: 서술 문맥의 시간관계 보존
