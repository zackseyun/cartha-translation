- from: 그러자 포도원 주인이 말했습니다. 「내가 어찌할까? 내가 사랑하는 아들을 보내겠다. 아마 그들이 이 아들은 존중할 것이다.」
  to: 그러자 포도원 주인이 말했습니다. 「내가 무엇을 할까? 내가 사랑하는 아들을 보내겠다. 아마 그들은 그를 존중할 것이다.」
