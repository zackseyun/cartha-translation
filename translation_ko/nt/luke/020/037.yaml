  to: 그러나 죽은 이들이 일으켜짐을 모세도 가시덤불 대목[a]에서 밝혔습니다. 그가 주[b]를 ‘아브라함의 하나님, 이삭의 하나님, 야곱의 하나님’이라고 부른 곳에서입니다.
  rationale: 인과적 종결을 제거하여 ὡς λέγει의 인용 기능을 보존하고, 현재 수동형 ἐγείρονται는 「일으켜짐」으로 유지했습니다. 가시덤불 표현의 해석상 여지는 주석으로 남겼으며, κύριος는 「주」로 번역하되 신명 전통은 본문에 과도하게 삽입하지 않았습니다.
