    rationale: τῷ ἀδελφῷ αὐτοῦ는 자녀 없이 죽은 형제를 위한 것임을 가리킵니다. ‘죽은 형제를 위해’로 명시하면 원문의 문맥상 지시 대상을 정확히 전달합니다.
