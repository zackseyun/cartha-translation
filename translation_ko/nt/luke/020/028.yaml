- from: 그들이 말했습니다. 「선생님, 모세는 우리에게 이렇게 기록했습니다. 「만일 어떤 사람의 형제가 아내를 두고 죽었는데 자식이 없으면, 그의 형제가 그 아내를 취하여 자기 형제를 위하여 후손을 일으켜야 한다.」
  to: 그들이 말하였습니다. “선생님, 모세는 우리에게 이렇게 기록하였습니다. ‘어떤 사람의 형제가 아내를 둔 채[a] 죽었는데 그에게 자녀가 없으면, 그의 형제가 그 아내를 맞아 죽은 형제를 위해 후손을 세워야 합니다.[b]’”
  rationale: 인용부호의 구조적 오류를 바로잡고, 원문의 상태 분사(‘아내를 둔 채’)와 사망한 형제를 위한 법률적 목적을 정확하고 자연스러운 현대 합쇼체로 반영했습니다. 주석은 본문에 불필요한 해설을 넣지 않으면서 원문의 관용구와 가능한 어휘적 대안을 제시합니다.
