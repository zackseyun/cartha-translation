  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
  footnotes:
  - marker: a
    text: Or 'leave a wife'; the Greek literally says 'dies having a wife.'
    reason: lexical_alternative
  - marker: b
    text: '''Raise up offspring'' echoes the legal idiom of Deuteronomy 25:5 for providing descendants in the deceased brother''s name; literally, ''raise up seed.'''
    reason: cross_reference
translation:
  language: ko
  text: 그들이 말하였습니다. “선생님, 모세는 우리에게 이렇게 기록하였습니다. ‘어떤 사람의 형제가 아내를 둔 채[a] 죽었는데 그에게 자녀가 없으면, 그의 형제가 그 아내를 맞아 죽은 형제를 위해 후손을 세워야 합니다.[b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아내를 남기고’. 그리스어는 직역하면 ‘아내를 둔 채 죽다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘후손을 세우다’는 신명기 25:5의 법률적 관용구를 반영하며, 직역하면 ‘씨를 일으키다’입니다. 이는 자녀 없이 죽은 형제의 이름으로 후손을 잇게 하는 것을 뜻합니다.
    reason: cross_reference
