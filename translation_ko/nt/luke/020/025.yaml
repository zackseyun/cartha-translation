- from: 그러자 그분께서 그들에게 말씀하셨습니다. 「그러면 카이사르의 것은 카이사르에게, 하나님의 것은 하나님께 돌려 드리십시오.」
  to: 그러나 그분께서 그들에게 말씀하셨습니다. 「그러면 카이사르의 것은 카이사르에게, 하나님의 것은 하나님께 돌려주십시오.」
  rationale: The revision replaces the deferential verb 드리다 with neutral 돌려주다 and adjusts the connective to reflect δέ without over-specifying sequence or causality. It retains τοίνυν’s inferential force (‘그러면’), the broad plural expressions ‘카이사르의 것’ and ‘하나님의 것,’ and the source’s parallel structure without interpreting its political or theological limits.
