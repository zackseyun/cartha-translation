  naturalness: ‘그는 세 번째 종을 더 보냈으나’와 ‘상처를 입히고 내쫓았습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 비유의 서술 흐름에도 맞습니다.
  terminology: ‘종’은 앞 문맥에서 생략된 파송 대상의 지시물을 자연스럽게 보충합니다. ‘내쫓았습니다’는 ἐξέβαλον의 강제적 축출을 적절히 전달합니다.
  issues:
