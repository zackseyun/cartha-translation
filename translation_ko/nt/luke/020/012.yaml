  - severity: low
    issue: ‘상하게 하여’는 τραυματίσαντες의 구체성을 다소 약화하고 문체상 덜 자연스럽습니다.
    rationale: τραυματίζω는 상처를 입히다/부상을 입히다의 뜻이므로 ‘상처를 입히고’가 더 정확하고 자연스럽습니다.
