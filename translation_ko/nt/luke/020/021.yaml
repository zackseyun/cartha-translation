  source_fidelity: 개정문은 ἐπηρώτησαν의 ‘물었다’, ὀρθῶς의 ‘바르게’, οὐ λαμβάνεις πρόσωπον의 비편파성, ἐπ’ ἀληθείας의 ‘참으로’, 그리고 ‘하나님의 길’을 모두 반영합니다. ‘사람을 외모로 판단하지 않으시고’는 직역적 ‘얼굴을 받다’가 뜻하는 사람의 지위·겉모습에 따른 편파성을 자연스럽게 드러냅니다.
  naturalness: 초안의 ‘물어 말했습니다’는 그리스어 분사를 기계적으로 따르며 한국어로 어색합니다. 또한 인용문 안에서 청자에게 ‘당신’을 쓰는 것은 현대 공적 한국어에서 부자연스럽거나 무례하게 들릴 수 있으므로 ‘선생님께서’로 바꾸었습니다.
  terminology: Διδάσκαλε는 ‘선생님’, τὴν ὁδὸν τοῦ θεοῦ는 현대 표준어로 ‘하나님의 길’이 적절합니다. ‘하나님의 도’는 가능하지만 여기서는 다소 고어적입니다.
  issues:
