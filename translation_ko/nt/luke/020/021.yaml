  - severity: low
    issue: ‘하나님의 도’가 사용되었습니다.
    rationale: 의미상 문제는 없으나, 현대 표준어 번역에서는 ‘하나님의 길’이 더 자연스럽고 원문의 ὁδός도 충실히 반영합니다.
