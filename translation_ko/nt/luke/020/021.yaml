  text: 그리고 그들이 그분께 물었습니다. “선생님, 우리는 선생님께서 바르게 말씀하시고 가르치시며, 사람을 외모로 판단하지 않으시고, 참으로 하나님의 길을 가르치시는 줄 압니다.”
