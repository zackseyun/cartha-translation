  source_fidelity: ‘외식으로’는 προφάσει(겉치레로, 구실로)의 의미를 충분히 자연스럽게 드러내지 못합니다. 또한 ‘집을 삼키고’는 그리스어의 비유를 지나치게 직역하여 한국어에서 어색합니다. ‘과부들의 재산을 삼켜 버리고’는 οἰκίας의 문맥상 환유적 의미와 κατεσθίουσιν의 착취적 뉘앙스를 자연스럽게 보존합니다. ‘더 큰 심판’은 περισσότερον κρίμα의 비교급과 κρίμα의 폭넓은 법정적 의미를 유지합니다.
  naturalness: ‘겉으로는 길게 기도합니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 긴 기도가 겉치레라는 προφάσει의 수식 관계를 분명히 합니다. 끝의 불필요한 닫는 인용 부호도 제거해야 합니다.
  terminology: ‘심판’은 κρίμα에 적절하며, ‘정죄’로 한정하지 않습니다. ‘재산을 삼켜 버리고’는 과부의 ‘집’이 가리키는 가산·생계 기반을 문맥상 자연스럽게 옮긴 표현입니다.
  issues:
