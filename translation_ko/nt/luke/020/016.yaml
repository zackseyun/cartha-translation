  source_fidelity: ‘농부들’은 γεωργοί의 기본 뜻을 반영하지만, 이 비유의 토지를 빌려 경작하는 지위를 충분히 드러내지 못합니다. ‘소작농들’은 그 사회적 역할을 자연스럽게 명시합니다. ἀπολέσει의 넓은 심판 표현은 ‘멸하고’로 유지했으며, Μὴ γένοιτο의 강한 경악과 거부는 ‘결코 그럴 수 없습니다!’로 옮기고 직역상의 소망법 뉘앙스는 각주에 보존했습니다.
  naturalness: 인용문의 한국어식 큰따옴표와 서술·발화의 연결을 자연스럽게 다듬었습니다. ‘이 말을 들은 사람들은 … 하고 말했습니다’는 분사구문과 εἶπαν을 매끄럽게 반영하며, 합쇼체 서술에 맞습니다.
