  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
  footnotes:
  - marker: a
    text: Or 'farmers' or 'tenants'; the Greek term refers to those who worked land belonging to another.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''Certainly not!'' or ''By no means!'' The Greek expression is a strong rejection: literally, ''May it not happen.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그는 와서 이 소작농들을[a] 멸하고 포도원을 다른 사람들에게 줄 것입니다.” 이 말을 들은 사람들은 “결코 그럴 수 없습니다!”[b] 하고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
