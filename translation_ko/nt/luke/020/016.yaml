    text: 또는 ‘농부들’ 또는 ‘소작인들’. 그리스어는 다른 이의 땅을 경작하는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그런 일이 없기를!’ 또는 ‘절대로 안 됩니다!’ 그리스어는 직역하면 ‘그 일이 일어나지 않기를’이라는 뜻의 강한 거부 표현입니다.
    reason: alternative_reading
