  verdict: revise
  source_fidelity: The draft correctly renders the two questions and retains ἐξουσία as ‘권세.’ However, ‘그들이 그분께 말하여 물었습니다’ unnecessarily turns the speech introduction into an awkward double verb, and ‘이것들’ is an unnatural Korean rendering of ταῦτα in this context.
  naturalness: Use a single natural speech-introduction verb and render the plural demonstrative idiomatically as ‘이런 일들을.’ The revised questions maintain modern formal-polite 합쇼체.
  terminology: ‘권세’ appropriately represents ἐξουσία here as authority/right to act. No doctrinally specific interpretation is introduced.
  issues:
  - severity: medium
    issue: Awkward speech introduction
    rationale: ‘말하여 물었습니다’ is not natural modern Korean. Although Greek has εἶπαν with λέγοντες, the participle is pleonastic and should not be reproduced with an unnatural Korean double construction.
  - severity: low
    issue: Unnatural rendering of ταῦτα
    rationale: ‘이것들’ is grammatically possible but unnatural for the actions under dispute. ‘이런 일들을’ retains the plural reference and reads naturally.
