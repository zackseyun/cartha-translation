review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal participants, immediacy, fear of the people, and their recognition that Jesus directed the parable at them. However, ‘손을 대려고 모색했으나’ is not a natural Korean expression for the hostile idiom ἐπιβαλεῖν ... τὰς χεῖρας and weakens its intended sense.
  naturalness: Replace the unnatural Sino-Korean collocation ‘모색했으나’ with the idiomatic ‘손을 대려고 하였으나.’ Render πρὸς αὐτούς naturally and contextually as ‘자기들을 겨냥하여.’
  terminology: ‘율법학자들’ and ‘대제사장들’ are appropriate modern Korean renderings of γραμματεῖς and ἀρχιερεῖς. ‘비유’ is correct for παραβολή. The added notes retain the literal force of ‘손을 대다’ and clarify the contextual force of ‘겨냥하여’ without imposing doctrine.
  issues:
  - severity: medium
    issue: ‘그분께 손을 대려고 모색했으나’ is unnatural and semantically imprecise.
    rationale: ‘모색하다’ means to seek out a method or solution and does not idiomatically govern this action in Korean. The Greek says they sought/intended to lay hands on him, a hostile physical action; ‘그에게 손을 대려고 하였으나’ is both closer and more natural.
  - severity: low
    issue: ‘자신들을 향하여 이 비유를 말씀하신 줄’ is awkward Korean and only weakly conveys the adversative/contextual force of πρὸς αὐτούς.
    rationale: ‘자기들을 겨냥하여 이 비유를 말씀하신 것을’ clearly expresses that they understood themselves to be its target, while retaining the source's contextual ambiguity through a note.
  revised_text: 율법학자들과 대제사장들은 바로 그때 그에게 손을 대려고 하였으나[a], 백성을 두려워했습니다. 그들은 그가 자기들을 겨냥하여 이 비유를 말씀하신 것을 알았기 때문입니다.[b]
