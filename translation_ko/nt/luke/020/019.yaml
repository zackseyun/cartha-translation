translation:
  language: ko
  text: 율법학자들과 대제사장들은 바로 그때 그에게 손을 대려고 하였으나[a], 백성을 두려워했습니다. 그들은 그가 자기들을 겨냥하여 이 비유를 말씀하신 것을 알았기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
