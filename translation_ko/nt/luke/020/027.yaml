review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘부활이 없다고 부인하는’은 한국어에서 ‘부활이 없다는 말을 부인하는’ 것으로도 읽혀, 원문의 ‘부활이 존재하지 않는다고 주장/부정하는’ 뜻을 반대로 전달할 소지가 있습니다. 또한 τινες τῶν Σαδδουκαίων의 부분 표현은 ‘사두개파 사람들 가운데 몇몇’으로 분명히 옮기는 편이 좋습니다.
  naturalness: ‘그러자 … 다가와 그분께 물었습니다’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. 다만 핵심 분사구는 의미 혼동을 피하도록 ‘부활이 없다고 주장하는’으로 고쳐야 합니다.
  terminology: ‘사두개파’와 ‘부활’은 적절합니다. ἀντιλέγοντες는 여기서 부활의 존재를 부정하는 교리적 입장을 가리키므로, 한국어에서는 ‘주장하는’이 가장 명료하고 문맥상 충실합니다.
  issues:
  - severity: high
    issue: ‘부활이 없다고 부인하는’의 의미 모호성 및 역전 가능성
    rationale: 한국어에서 ‘A라고 부인하다’는 흔히 A라는 진술을 부정한다는 뜻이므로, 사두개파가 부활이 없다는 견해를 부정하는 것으로 이해될 수 있습니다. 원문은 그들이 부활이 존재하지 않는다고 말하거나 주장한다는 뜻입니다.
  - severity: low
    issue: 부분 표현의 명시성
    rationale: ‘사두개파 사람 몇’도 이해되지만, τινες τῶν Σαδδουκαίων의 ‘사두개파 사람들 가운데 일부’라는 범위를 ‘사두개파 사람들 가운데 몇몇’으로 명시하면 더 자연스럽고 정확합니다.
