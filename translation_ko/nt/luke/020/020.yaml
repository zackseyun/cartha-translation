  verdict: revise
  source_fidelity: 초안은 적대적 감시, 비밀 요원의 파견, 발언을 빌미로 한 함정, 총독에게 넘기려는 목적을 대체로 담고 있습니다. 그러나 Καὶ를 인과적인 ‘그래서’로 옮긴 것은 본문의 단순 연결보다 강하며, ‘자기들을 의인인 척하는’은 원문의 재귀적 자기 가장을 정확하고 자연스럽게 반영하지 못합니다. 또한 ‘말씀에서 어떤 것을 잡아내어’는 λόγου의 단수 발언을 근거로 한 법적 함정의 뜻을 다소 불명료하게 합니다.
  naturalness: ‘스스로 의로운 사람인 체하는’과 ‘말씀의 꼬투리를 잡아’는 현대 표준어 합쇼체에서 자연스럽고, 각각 거짓된 자기 제시와 말에 근거한 함정의 뜻을 분명히 합니다. ‘총독의 통치권과 권세에 넘겨주다’는 두 그리스어 명사를 구별해 보존하면서도 문맥상 이해 가능합니다.
  terminology: δίκαιος는 여기서 도덕적·종교적 올바름을 가장하는 뜻이므로 ‘의로운 사람’으로 옮겼습니다. ἐγκαθέτους는 은밀히 심어 둔 자들이라는 뜻을 살려 ‘첩자들’로 유지했습니다. ἀρχή와 ἐξουσία는 하나로 축소하지 않고 ‘통치권과 권세’로 병렬 번역했습니다.
