  - severity: high
    issue: ‘자기들을 의인인 척하는’
    rationale: 문법적으로 부자연스럽고, ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι(스스로 의롭다고 가장하는)를 정확히 표현하지 못합니다.
  - severity: medium
    issue: ‘그분의 말씀에서 어떤 것을 잡아내어’
    rationale: ἐπιλαμβάνομαι αὐτοῦ λόγου는 그의 말에서 빌미를 잡아 함정에 빠뜨린다는 뜻입니다. ‘말씀의 꼬투리를 잡아’가 이 기능을 더 분명히 드러냅니다.
