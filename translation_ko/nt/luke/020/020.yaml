source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
  footnotes:
  - marker: a
    text: Or, more literally, 'catch him in a word' or 'seize upon his word.'
    reason: lexical_alternative
  - marker: b
    text: Or 'hand him over to the governing rule and authority of the governor.' The paired terms likely emphasize official jurisdiction and power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그분을 면밀히 지켜본 뒤, 스스로 의로운 사람인 체하는 첩자들을 보냈습니다. 이는 그분의 말씀의 꼬투리를 잡아[a] 그분을 총독의 통치권과 권세에 넘겨주려는 것이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그분의 말 하나를 붙잡아’ 또는 ‘그분의 말씀을 붙들어’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘총독의 관할권과 권세에 넘겨주려는 것이었습니다.’ 그리스어의 두 표현은 공적 통치·관할과 권한을 함께 가리킵니다.
    reason: lexical_alternative
