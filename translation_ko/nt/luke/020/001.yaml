  naturalness: ‘그 무렵 어느 날’과 ‘가르치시며 … 전하고 계실 때’는 현대 표준어 합쇼체에서 자연스럽고, 동시 상황을 나타내는 속격 절대구문의 의미를 보존합니다. 문맥상 지시 대상이 분명한 예수님을 명시하여 한국어의 반복적인 대명사 사용을 피했습니다.
  terminology: ‘대제사장들’, ‘율법학자들’, ‘장로들’은 각각 ἀρχιερεῖς, γραμματεῖς, πρεσβύτεροι에 적절합니다. ‘복음을 전하다’는 εὐαγγελίζομαι의 현대 한국어 관용적 번역이며, 대안적 표현은 각주에 제시했습니다.
