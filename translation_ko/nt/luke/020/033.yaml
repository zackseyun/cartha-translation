review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 οἱ ἑπτά는 문맥상 이미 언급된 일곱 형제를 가리키므로 ‘일곱이 모두’보다 ‘그 일곱 사람이’가 더 직접적이며, ‘모두’는 원문에 명시되지 않은 총칭을 보탭니다.
  naturalness: ‘그 여자는 그들 중 누구의 아내가 되겠습니까?’는 현대 표준어 합쇼체로 자연스럽습니다. 둘째 절은 γάρ의 이유 제시를 명시하여 ‘…때문입니다’로 옮기면 더 정연한 문어체가 됩니다. 초안 끝의 닫는 인용 부호(」)는 문맥상 불필요한 표기입니다.
  terminology: ‘부활’, ‘아내’, ‘아내로 두다’는 각각 ἀνάστασις와 γυνή 및 ἔχω + γυναῖκα의 혼인 관계 표현을 적절히 반영합니다. ‘부활 때에’는 ἐν τῇ ἀναστάσει의 가능한 자연스러운 번역입니다.
  issues:
