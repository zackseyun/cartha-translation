- from: 그러면 부활 때에 그 여자는 그들 중 누구의 아내가 되겠습니까? 일곱이 모두 그 여자를 아내로 두었으니 말입니다.」
  to: 그러면 부활 때에 그 여자는 그들 중 누구의 아내가 되겠습니까? 그 일곱 사람이 그 여자를 아내로 두었기 때문입니다.
