  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
  footnotes:
  - marker: a
    text: A denarius was a Roman coin commonly used in the period; the term is kept rather than generalized to preserve the historical setting.
    reason: cultural_note
translation:
  language: ko
  text: 「내게 데나리온[a] 한 닢을 보여 주십시오. 거기에 누구의 형상과 글귀가 새겨져 있습니까?」 그들이 대답했습니다. 「카이사르의 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 당시 널리 쓰이던 로마 화폐입니다. 역사적 배경을 보존하기 위해 일반적인 화폐 이름으로 바꾸지 않고 이 명칭을 유지했습니다.
    reason: cultural_note
