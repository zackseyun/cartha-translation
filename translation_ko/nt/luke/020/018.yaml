  source_fidelity: 첫 절은 πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον의 보편적·조건적 표현을 대체로 옮겼으나, 둘째 절의 초안은 ‘그 돌이 떨어지는 자’로 되어 돌이 떨어지는 대상(ἐφ’ ὃν ... πέσῃ)을 문법적으로 분명히 나타내지 못합니다. 또한 λικμήσει의 강한 파쇄/분쇄 이미지는 유지되어야 합니다.
