translation:
  language: ko
  text: 그 돌 위에 떨어지는 사람은 모두 산산이 부서질 것이며, 그 돌이 누구 위에 떨어지든지 그를 가루로 만들 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
