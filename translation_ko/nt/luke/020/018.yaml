  terminology: ‘돌’, ‘부서지다’, ‘가루로 만들다’는 본문의 비유와 심판의 강도를 과도하게 해석하거나 완화하지 않고 전달합니다. 성별을 특정하지 않는 ‘누구’ 및 ‘그를’은 한국어의 자연스러운 일반 지칭이며 원문의 단수 대상을 보존합니다.
