  source_fidelity: 핵심 의미는 대체로 보존했으나, ‘저 시대’는 현대 표준어에서 이 문맥의 종말론적 ‘그 시대’보다 부자연스럽고, ‘죽은 자들로부터의 부활’은 한국어 성경 문체와 자연스러운 용법상 ‘죽은 사람들 가운데서의 부활’로 다듬는 것이 적절합니다. καταξιωθέντες의 수동적 평가 의미는 ‘합당하다고 인정받은’으로 분명히 살렸습니다.
