  text: 그러나 그 시대[b]와 죽은 사람들 가운데서의 부활을 얻기에 합당하다고 인정받은[a] 사람들은 장가들지도 않고 시집가지도 않습니다.
  philosophy: optimal-equivalence
  footnotes:
