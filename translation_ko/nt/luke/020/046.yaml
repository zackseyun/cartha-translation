translation:
  language: ko
  text: 「긴 옷을 입고 다니기를 원하며, 시장에서 인사받기를 좋아하고, 회당에서는 상석을, 잔치에서는 윗자리를 좋아하는 율법학자들을 경계하십시오.[a][b][c][d]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서기관들’.
    reason: lexical_alternative
  - marker: b
    text: ‘긴 옷’은 눈에 띄며 신분을 드러내는 옷을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘인사’는 공적인 자리에서 존대를 나타내는 인사를 뜻합니다.
    reason: cultural_note
  - marker: d
    text: ‘상석’과 ‘윗자리’는 각각 회당과 잔치에서 가장 높은 명예가 따르는 자리를 가리킵니다.
    reason: lexical_alternative
