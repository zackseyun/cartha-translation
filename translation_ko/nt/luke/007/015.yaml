source:
  edition: SBLGNT
  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
  footnotes:
  - marker: a
    text: Or 'he gave him back to his mother' / 'he returned him to his mother.' The Greek simply says 'he gave him to his mother,' with the restorative sense implied by the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 죽은 사람이 일어나 앉아 말하기 시작했고, 예수께서 그를 그의 어머니에게 주셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 그의 어머니에게 돌려주셨다’ 또는 ‘그를 그의 어머니에게 다시 주셨다’. 그리스어는 단순히 ‘그를 그의 어머니에게 주셨다’고만 하며, 회복의 뜻은 문맥에서 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  english_pob_choice: sat up
  chosen_korean: 일어나 앉아
  alternatives_korean:
  - 앉아 일어나
  - 몸을 일으켜 앉아
  lexicon: SBLGNT
  rationale: ἀνακαθίζω는 눕거나 쓰러진 상태에서 앉는 동작을 가리키므로, ‘일어나 앉아’가 자연스러운 현대 한국어로 그 움직임을 정확히 옮깁니다.
- source_word: ὁ νεκρός
  english_pob_choice: the dead man
  chosen_korean: 죽은 사람
  alternatives_korean:
  - 죽은 사람
  - 시체
  lexicon: SBLGNT
  rationale: 직역에 가까운 ‘죽은 사람’이 이전에 죽었던 인물을 개인으로 지칭하는 흐름을 살리며, ‘시체’는 지나치게 비인격적입니다.
- source_word: ἤρξατο λαλεῖν
  english_pob_choice: began to speak
  chosen_korean: 말하기 시작했고
  alternatives_korean:
  - 말하기 시작했고
  - 말하기 시작했습니다
  lexicon: SBLGNT
  rationale: ἄρχομαι+부정사는 시작 동작을 나타내므로 ‘말하기 시작했고’가 간결하고 자연스럽게 그 개시성을 드러냅니다.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  english_pob_choice: he gave him to his mother
  chosen_korean: 그를 그의 어머니에게 주셨습니다
  alternatives_korean:
  - 그를 그의 어머니에게 돌려주셨습니다
  - 그를 그의 어머니에게 다시 주셨습니다
  lexicon: SBLGNT
  rationale: 그리스어는 단순히 ‘주다’(δίδωμι)를 쓰므로, 해석어인 ‘돌려주다’를 본문에 넣지 않고 문맥이 암시하는 회복은 독자가 읽게 두었습니다.
theological_decisions:
- issue: 예수의 행위를 ‘돌려주셨습니다’로 명시할지 여부
  chosen_reading: 단순한 ‘주셨습니다’를 유지했습니다.
  alternative_readings:
  - 그를 그의 어머니에게 돌려주셨습니다
  - 그를 그의 어머니에게 다시 주셨습니다
  rationale: 부활의 회복이라는 의미는 문맥상 분명하지만, 본문은 구체적으로 δίδωμι를 사용하므로 해석적 확대를 피했습니다.
  doctrine_reference: 'translation philosophy: optimal equivalence; source-bound rendering'
