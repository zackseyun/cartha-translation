  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἀπήγγειλαν Ἰωάννῃ οἱ μαθηταὶ αὐτοῦ περὶ πάντων τούτων. καὶ προσκαλεσάμενος δύο τινὰς τῶν μαθητῶν αὐτοῦ ὁ Ἰωάννης
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/018.yaml
  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
  footnotes:
  - marker: a
    text: Or 'summoning two of his disciples.'
    reason: lexical_alternative
  - marker: b
    text: The Greek sentence continues into the next verse; this translation preserves the unfinished sense with a trailing comma.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그의 제자들이 이 모든 일을 요한에게 보고했습니다. 그리고 요한은 자기 제자들 가운데서 두 사람을 부르셨습니다[?][a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 제자들 가운데서 두 사람을 불러”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 문장은 다음 절로 이어지므로, 한국어도 문장을 끝맺지 않고 남겼습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  english_pob_choice: reported
  chosen_korean: 보고했습니다
  alternatives_korean:
  - 전했습니다
  - 알렸습니다
  lexicon: BDAG
  rationale: 사건을 전달해 알린다는 뜻을 자연스럽게 살리면서, 담화체에서 과도하게 격식을 올리지 않는 표현입니다.
- source_word: Ἰωάννῃ
  english_pob_choice: to John
  chosen_korean: 요한에게
  alternatives_korean:
  - 요한에게로
  - 요한한테
  lexicon: BDAG
  rationale: 여격의 수신자를 표준 문어체로 옮겼습니다.
- source_word: δύο τινὰς τῶν μαθητῶν αὐτοῦ
  english_pob_choice: two certain ones of his disciples
  chosen_korean: 자기 제자들 가운데서 두 사람
  alternatives_korean:
  - 그의 제자들 중 두 사람
  - 제자들 가운데 두 사람
  lexicon: BDAG
  rationale: τινάς의 불특정 뉘앙스를 한국어에서 무리하게 반복하기보다, 부분적 선택을 드러내는 방식으로 옮겼습니다.
- source_word: προσκαλεσάμενος
  english_pob_choice: calling ... to him
  chosen_korean: 부르셨습니다
  alternatives_korean:
  - 불러 모으셨습니다
  - 소집하셨습니다
  lexicon: BDAG
  rationale: 앞뒤 문맥상 다음 절로 이어지는 미완결 구문이므로, 호출 행위를 간결하게 반영했습니다.
theological_decisions:
- issue: 미완결된 그리스어 문장을 한국어에서도 열어 둔 처리
  chosen_reading: 둘째 절을 끝맺지 않고 다음 절로 이어질 수 있게 남겼습니다.
  alternative_readings:
  - 문장을 완결형으로 정리함
  - 쉼표를 추가해 미완결감을 약화함
  rationale: 원문이 다음 절로 이어지는 구조를 가지므로, 한국어도 그 긴장을 보존하는 편이 본문 충실성에 맞습니다.
  doctrine_reference: 본문 구조 보존
- issue: ‘그의 제자들’의 소유격 처리
  chosen_reading: ‘그의 제자들’로 자연스럽게 옮겼습니다.
  alternative_readings:
  - ‘제자들’만 사용함
  - ‘자기 제자들’로 명시함
  rationale: 앞절과의 연결을 유지하면서도 소유 관계를 분명히 했습니다.
  doctrine_reference: 서술 연속성
