  naturalness: ‘그리고’의 반복은 한국어에서 다소 무겁고, ‘부르셨습니다’ 뒤의 각주 설명만으로는 미완결 구문이 자연스럽게 보존되지 않습니다. ‘요한은 … 부르시고,’는 다음 절로 이어지는 구조를 자연스럽고 분명하게 나타냅니다.
