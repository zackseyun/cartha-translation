id: LUK.7.22
reference: Luke 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
  footnotes:
  - marker: a
    text: Or, “the blind see again.” The Greek verb can mean to regain sight or to look up; here it denotes receiving sight.
    reason: lexical_alternative
  - marker: b
    text: 'Or, “good news is preached to the poor.” The Greek is passive: “the poor are evangelized / have good news announced to them.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 대답하여 말씀하셨습니다. “가서 너희가 본 것과 들은 것을 요한에게 전하십시오. 눈먼 사람들이 보게 되고[a], 다리 저는 사람들이 걷고, 나병 환자들이 정결하게 되고, 귀먹은 사람들이 듣고, 죽은 사람들이 살아나며, 가난한 사람들에게 복음이 전해집니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보게 되고’는 문맥상 시력을 얻거나 되찾는다는 뜻입니다. 이 동사는 ‘다시 보다’ 또는 ‘위를 보다’로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 수동 표현으로, 직역하면 ‘가난한 사람들이 좋은 소식을 선포받는다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  english_pob_choice: And answering / in answer
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 답하여
  lexicon: BDAG
  rationale: 응답의 대응 관계를 살리면서도 현대 한국어에서 가장 자연스럽고 간결한 서술형 연결 표현입니다.
- source_word: Πορευθέντες ἀπαγγείλατε
  english_pob_choice: Go and report
  chosen_korean: 가서 … 전하십시오
  alternatives_korean:
  - 가서 … 보고하십시오
  - 가서 … 알리십시오
  lexicon: BDAG
  rationale: 도착·이동을 나타내는 분사와 명령을 한국어에서 자연스러운 연속 명령으로 옮기되, 증언을 되돌려 전하는 뉘앙스를 위해 ‘전하다’를 택했습니다.
- source_word: τυφλοὶ ἀναβλέπουσιν
  english_pob_choice: the blind receive sight
  chosen_korean: 눈먼 사람은 보게 되고
  alternatives_korean:
  - 눈먼 사람은 시력을 되찾고
  - 맹인은 보게 되고
  lexicon: BDAG
  rationale: ἀναβλέπω의 ‘다시 보게 되다/보게 되다’ 의미를 살리면서, 회복의 결과를 간명하게 나타냈습니다.
- source_word: λεπροὶ καθαρίζονται
  english_pob_choice: lepers are cleansed
  chosen_korean: 나병 환자는 깨끗해지고
  alternatives_korean:
  - 나병 환자는 정결해지고
  - 문둥병 환자는 깨끗해지고
  lexicon: BDAG
  rationale: 단순 치료보다 의식적·종교적 정결 회복까지 포함하는 καθαρίζονται의 폭을 살리기 위해 ‘깨끗해지다’를 택했습니다.
- source_word: πτωχοὶ εὐαγγελίζονται
  english_pob_choice: the poor have good news proclaimed to them
  chosen_korean: 가난한 사람에게는 복음이 전해집니다
  alternatives_korean:
  - 가난한 사람에게는 좋은 소식이 전해집니다
  - 가난한 사람은 복음을 듣습니다
  lexicon: BDAG
  rationale: 수동태의 수혜적 의미를 유지하면서도 한국어에서 ‘복음이 전해지다’가 가장 직접적이고 문맥상 자연스럽습니다.
theological_decisions:
- issue: 본문의 열거가 예수의 정체를 직접 해석하지 않고 표지로 제시되는 방식
  chosen_reading: 열거를 그대로 옮겨, 본문이 제시하는 치유·회복의 사실을 전면에 두고 메시아 해석은 본문 밖의 연결로 남겼습니다.
  alternative_readings:
  - 본문 안에 메시아 성취 어휘를 더 강하게 드러내는 번역
  rationale: 이 절은 요한에게 전할 보고의 내용이므로, 본문 자체의 관찰 가능한 행위를 과장 없이 제시하는 것이 소스에 가장 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 수동형 진술들의 행위자 명시 여부
  chosen_reading: ‘보게 되고’, ‘걷고’, ‘깨끗해지고’, ‘듣고’, ‘살아나며’, ‘전해집니다’처럼 수동·비인칭적 구조를 유지했습니다.
  alternative_readings:
  - 하나님이 보게 하시고 걷게 하시며…
  rationale: 그리스어 수동형이 가진 절제와 간접성을 보존해야 하므로, 행위자를 덧붙여 해석을 확대하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3
