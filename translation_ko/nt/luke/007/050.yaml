  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὴν γυναῖκα· Ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
  footnotes:
  - marker: a
    text: Or 'Your trust has saved you'; less likely here, 'Your faithfulness has saved you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'has made you well.' The Greek verb can mean 'save,' 'rescue,' or 'make well,' but here the context emphasizes forgiveness and salvation.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그 여인에게 말씀하셨습니다. “당신의 믿음[a]이 당신을 구원했습니다.[b] 평안히 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 신뢰가 당신을 구원했습니다.’ 덜 가능하지만 ‘당신의 신실함이 당신을 구원했습니다.’로도 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신을 낫게 했습니다.’ 그리스어 동사는 ‘구원하다’, ‘구해 내다’, ‘낫게 하다’를 뜻할 수 있지만, 여기서는 문맥이 용서와 구원을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὴν γυναῖκα
  english_pob_choice: to the woman
  chosen_korean: 그 여자에게
  alternatives_korean:
  - 그 여성에게
  - 그 여인에게
  lexicon: BDAG
  rationale: 문맥상 특정 여성을 가리키므로 ‘여자’가 가장 직접적이며, 구어적이지만 무례하지 않은 현대 한국어로 인물 지시를 분명히 합니다.
- source_word: Ἡ πίστις σου
  english_pob_choice: Your faith
  chosen_korean: 당신의 믿음
  alternatives_korean:
  - 당신의 신뢰
  - 당신의 신실함
  lexicon: BDAG
  rationale: πίστις는 기본적으로 ‘믿음’으로 옮기되, 여기서는 예수께 대한 신뢰의 응답이라는 뉘앙스가 배경에 있습니다.
- source_word: σέσωκέν σε
  english_pob_choice: has saved you
  chosen_korean: 당신을 구원했습니다
  alternatives_korean:
  - 당신을 낫게 했습니다
  - 당신을 구했습니다
  lexicon: BDAG
  rationale: 이 문맥은 단순 치유보다 용서와 구원의 의미가 강조되므로, ‘구원했습니다’가 동사의 완료된 결과를 가장 잘 드러냅니다.
- source_word: πορεύου εἰς εἰρήνην
  english_pob_choice: go in peace
  chosen_korean: 평안히 가십시오
  alternatives_korean:
  - 평화 속으로 가십시오
  - 평안 속으로 가십시오
  lexicon: BDAG
  rationale: εἰς εἰρήνην의 관용적 표현을 한국어 자연문으로 살려, ‘평안히’가 떠나는 상태를 가장 간결하게 전달합니다.
theological_decisions:
- issue: σῴζω를 치유보다 구원으로 번역할지
  chosen_reading: ‘구원했습니다’로 옮겨, 치유적 의미를 배제하지 않되 본문이 강조하는 용서와 구원의 무게를 유지했습니다.
  alternative_readings:
  - 낫게 했습니다
  - 치유했습니다
  rationale: 누가복음 7:36-50의 흐름은 죄 사함과 믿음의 응답에 초점이 있으므로, 단순한 의학적 회복으로 좁히지 않는 것이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: σῴζω의 의미 범위를 문맥에 따라 유지하며, 구원-치유의 긴장을 해소하지 않음
