id: LUK.7.47
reference: Luke 7:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
  footnotes:
  - marker: a
    text: Or 'therefore she loved much.' The Greek conjunction can be understood in a way that highlights her love as evidence of her forgiven state rather than its cause.
    reason: alternative_reading
translation:
  language: ko
  text: 이런 이유로 내가 당신에게 말합니다. 그녀의 많은 죄는 용서받았습니다. 왜냐하면 그녀가 많이 사랑했기 때문입니다. 그러나 조금 용서받는 사람은 조금 사랑합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러므로 그녀가 많이 사랑했습니다.’ 그리스어 접속사는 그녀의 사랑을 용서받은 상태의 원인보다 증거로 강조하는 방식으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  english_pob_choice: For this reason
  chosen_korean: 이런 이유로
  alternatives_korean:
  - 그러므로
  - 이 때문에
  lexicon: BDAG
  rationale: 원인·결과를 이끄는 관용적 연결어로서, 문맥의 논증 흐름을 자연스럽게 살리면서도 단순한 ‘그러므로’보다 지시적 뉘앙스를 유지합니다.
- source_word: ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί
  english_pob_choice: her many sins have been forgiven
  chosen_korean: 그녀의 많은 죄는 용서받았습니다
  alternatives_korean:
  - 그녀의 많은 죄들이 용서되었습니다
  - 그녀의 수많은 죄는 사함을 받았습니다
  lexicon: BDAG
  rationale: 완료 수동의 결과 상태를 한국어 완료형으로 옮겼고, αἱ πολλαί는 ‘많은’으로 평이하게 처리해 죄의 수를 강조합니다.
- source_word: ἠγάπησεν πολύ
  english_pob_choice: she loved much
  chosen_korean: 그녀가 많이 사랑했기 때문입니다
  alternatives_korean:
  - 그녀가 크게 사랑했기 때문입니다
  - 그녀가 많은 사랑을 했기 때문입니다
  lexicon: BDAG
  rationale: ἀγαπάω의 어근을 따라 ‘사랑하다’로 옮기되, 문맥상 사랑의 정도를 나타내는 부사적 ‘많이’를 유지했습니다.
- source_word: ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ
  english_pob_choice: is forgiven little loves little
  chosen_korean: 조금 용서받는 사람은 조금 사랑합니다
  alternatives_korean:
  - 적게 용서받는 사람은 적게 사랑합니다
  - 조금 사함을 받는 사람은 조금 사랑합니다
  lexicon: BDAG
  rationale: 병렬 구조를 살리면서 수동 표현을 자연스러운 현재형으로 옮겼고, ἀφίεται의 수동성을 보존해 ‘받는 사람’으로 주체를 드러냈습니다.
theological_decisions:
- issue: ὅτι의 인과 관계가 사랑이 용서의 공로처럼 들릴 수 있는 문제
  chosen_reading: ‘왜냐하면’으로 직역에 가깝게 옮기되, 앞 절의 용서받음과 뒤의 사랑을 논리적으로 연결하는 말로 유지했습니다.
  alternative_readings:
  - ‘그래서’로 완화해 공로 오해를 줄이는 번역
  - ‘그 증거로’처럼 명시적으로 해석하는 번역
  rationale: 본문은 사랑을 용서의 원인처럼 압축적으로 말하지만, 문맥 전체는 이미 용서받은 상태가 사랑을 낳는다는 방향을 보여 줍니다. 따라서 본문의 긴장을 지우지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
