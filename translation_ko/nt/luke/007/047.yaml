review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 병렬 구조는 대체로 충실합니다. 다만 ὅτι 절의 대안 해석을 설명하는 각주 표지가 현재 마지막 절에 붙어 있어, 해당 접속사와 직접 연결되지 않습니다. 완료 수동 ἀφέωνται는 한국어에서 자연스럽게 ‘용서받았습니다’로 옮길 수 있습니다.
  naturalness: ‘이런 이유로’와 ‘조금’도 이해 가능하지만, 격식 있는 현대 한국어 성경 문맥에서는 ‘그러므로’ 및 반복되는 ‘적게’가 더 간결하고 병렬 관계를 분명히 합니다. ‘왜냐하면’은 앞 문장과 분리하기보다 이유 절에 직접 붙이는 편이 자연스럽습니다.
  terminology: ‘죄’, ‘용서받다’, ‘사랑하다’는 적절합니다. 사랑을 용서의 공로로 단정하지 않으면서도 원문의 ὅτι가 지닌 인과적 표현과 문맥상 긴장을 보존하도록 각주를 정리했습니다.
  issues:
