  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
  footnotes:
  - marker: a
    text: Or more literally, “Look, a man, a glutton and a wine-drinker.”
    reason: lexical_alternative
translation:
  language: ko
  text: 인자는 먹고 마시며 왔습니다. 그런데 여러분은 이렇게 말합니다. “보십시오, 이 사람은 탐식가이며 술꾼이고 세리들과 죄인들의 친구입니다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “보십시오, 한 사람, 탐식가이며 술꾼이고 세리들과 죄인들의 친구입니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  english_pob_choice: has come
  chosen_korean: 왔습니다
  alternatives_korean:
  - 왔습니다
  - 오셨습니다
  lexicon: SBLGNT
  rationale: 완료형의 ‘이미 와서 현재 그 상태가 지속됨’이라는 힘을 살려 합쇼체의 현재완료적 표현인 ‘왔습니다’를 택했습니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자
  lexicon: BDAG
  rationale: 예수의 자기칭호로 굳어진 관용구이므로 직역적 설명보다 한국어 성서어휘로 확립된 ‘인자’를 유지했습니다.
- source_word: ἐσθίων καὶ πίνων
  english_pob_choice: eating and drinking
  chosen_korean: 먹고 마시며
  alternatives_korean:
  - 먹고 마시며
  - 먹으며 마시며
  lexicon: BDAG
  rationale: 현재분사 두 개가 동반 방식과 특성을 나타내므로, 자연스러운 한국어 연결형으로 행위의 지속성과 병렬성을 살렸습니다.
- source_word: ἄνθρωπος φάγος καὶ οἰνοπότης
  english_pob_choice: a glutton and a drunkard
  chosen_korean: 탐식가요 술꾼
  alternatives_korean:
  - 대식가요 술꾼
  - 먹보요 술꾼
  lexicon: BDAG
  rationale: 모욕적 비난의 날카로움을 살리되, φάγος의 도덕적 비난 뉘앙스를 ‘탐식가’로, οἰνοπότης를 ‘술꾼’으로 옮겼습니다.
- source_word: φίλος τελωνῶν καὶ ἁμαρτωλῶν
  english_pob_choice: a friend of tax collectors and sinners
  chosen_korean: 세리들과 죄인들의 친구입니다
  alternatives_korean:
  - 세리들과 죄인들의 친구입니다
  - 세리들과 죄인들의 벗입니다
  lexicon: BDAG
  rationale: ‘friend of’의 관계를 평이한 소유격 구조로 옮겨 비난의 꼬리표를 유지했고, τελῶναι는 표준어 성서 번역어 ‘세리’로 처리했습니다.
theological_decisions:
- issue: ‘인자’ 칭호의 보존
  chosen_reading: 예수의 메시아적 자기칭호를 설명어로 풀지 않고 ‘인자’로 유지했습니다.
  alternative_readings:
  - 사람의 아들
  - 한 사람
  rationale: 다니엘 7장 배경과 복음서 내 칭호의 반복성을 보존해야 하므로, 의미를 평평하게 만드는 풀어쓰기를 피했습니다.
  doctrine_reference: 'Translation philosophy: source-language primacy; christological title continuity'
- issue: 공개적 비난의 강도
  chosen_reading: ‘탐식가요 술꾼’으로 옮겨, 상대가 예수를 폄하하는 공격적 어조를 그대로 드러냈습니다.
  alternative_readings:
  - 먹보요 술꾼
  - 많이 먹고 많이 마시는 사람
  rationale: 이 구절은 예수에 대한 적대적 중상으로 제시되므로, 완화된 표현보다 모욕의 강도를 보존하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; rhetorical force'
