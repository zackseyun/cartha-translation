source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
  footnotes:
  - marker: a
    text: Or "his one and only son."
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 도시의 문에 가까이 이르렀을 때, 보십시오, 죽은 사람이 실려 나오고 있었습니다. 그는 그 어머니의 외아들[a]이었고, 그 여자는 과부였습니다. 도시의 많은 무리가 그 여자와 함께 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 어머니의 유일한 아들”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν τῇ πύλῃ τῆς πόλεως
  english_pob_choice: he came near to the gate of the city
  chosen_korean: 도시의 문에 가까이 이르렀을 때
  alternatives_korean:
  - 성문의 가까이에 이르렀을 때
  - 도시 문에 가까워졌을 때
  lexicon: BDAG
  rationale: ἤγγισεν의 접근 동작을 자연스러운 서술로 옮기되, τῇ πύλῃ τῆς πόλεως의 관계를 ‘도시의 문’으로 간결하게 반영했습니다.
- source_word: καὶ ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기에
  lexicon: BDAG
  rationale: ἰδοὺ의 주의를 끄는 담화 표지를 현대 한국어의 공손한 감탄/주의 환기 표현으로 살렸습니다.
- source_word: μονογενὴς υἱός
  english_pob_choice: the only son
  chosen_korean: 외아들
  alternatives_korean:
  - 외동아들
  - 유일한 아들
  lexicon: BDAG
  rationale: 이 문맥에서 μονογενής는 신학적 칭호가 아니라 한 어머니에게 유일한 아들을 가리키므로, 한국어로는 관계의 비극성을 살리는 ‘외아들’이 가장 자연스럽습니다.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  english_pob_choice: a considerable crowd from the city
  chosen_korean: 그 도시에서 온 많은 무리
  alternatives_korean:
  - 그 도시에서 온 상당한 무리
  - 도시의 적지 않은 무리
  lexicon: BDAG
  rationale: ἱκανός의 ‘상당한/적지 않은’ 의미를 반영하되, 한국어에서는 ‘많은 무리’가 장례 행렬의 규모를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: μονογενής의 비기독론적 용례
  chosen_reading: 외아들
  alternative_readings:
  - 독생자
  - 유일한 아들
  rationale: 요한문맥의 그리스도론적 용례가 아니므로, 여기서는 아들의 유일성을 가리키는 가족 관계 의미를 우선해 번역했습니다.
  doctrine_reference: 'translation philosophy: context-sensitive lexical meaning; avoid importing later theological usage into a narrative scene'
