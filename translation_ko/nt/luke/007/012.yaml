revisions:
- from: 그가 도시의 문에 가까이 이르렀을 때, 보십시오, 죽은 외아들이 어머니에게 실려 나오고 있었고, 그 여자는 과부였으며, 그와 함께 그 도시에서 온 많은 무리가 있었습니다.[a]
  to: 그가 도시의 문에 가까이 이르렀을 때, 보십시오, 죽은 사람이 실려 나오고 있었습니다. 그는 그 어머니의 외아들[a]이었고, 그 여자는 과부였습니다. 도시의 많은 무리가 그 여자와 함께 있었습니다.
  rationale: The revision restores the Greek syntactic relationship between the deceased man and his mother, retains the imperfect passive sense of the funeral procession, and makes the crowd's accompaniment of the widow unambiguous. It also corrects the lexical-alternative footnote without importing Christological terminology.
  reviewer_model: gpt-5.6-terra
