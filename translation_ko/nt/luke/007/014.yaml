id: LUK.7.14
reference: Luke 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
  footnotes:
  - marker: a
    text: Or “coffin” or “funeral stretcher.” The Greek term refers to the bier or carrying frame used in a funeral procession.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 다가가 그 운구 들것[a]을 만지시자, 그것을 옮기던 사람들이 멈추어 섰습니다. 그리고 예수께서 말씀하셨습니다. 「젊은이여, 내가 너에게 말한다. 일어나라.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: σορός는 현대 한국어의 ‘관’이라기보다, 시신을 올려 장례 행렬에서 나르던 들것이나 운구틀을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  english_pob_choice: coming up
  chosen_korean: 다가가
  alternatives_korean:
  - 다가오셔서
  - 가까이 가셔서
  lexicon: BDAG
  rationale: 행동의 순서를 살리면서도 한국어에서 자연스럽고 간결한 동작 진행을 표현하기 위해 ‘다가가’를 선택했습니다.
- source_word: ἥψατο τῆς σοροῦ
  english_pob_choice: touched the bier
  chosen_korean: 그 들것을 만지시자
  alternatives_korean:
  - 그 상여를 만지시자
  - 관을 만지시자
  lexicon: BDAG
  rationale: σορός는 현대식 ‘관’보다 운구용 받침대/들것에 가깝기 때문에, 본문의 장례 행렬 장면을 살리기 위해 ‘들것’으로 옮겼습니다.
- source_word: οἱ δὲ βαστάζοντες
  english_pob_choice: the men carrying it
  chosen_korean: 그것을 메고 가던 사람들이
  alternatives_korean:
  - 그것을 들고 가던 사람들
  - 운구하던 사람들
  lexicon: BDAG
  rationale: βαστάζοντες는 ‘메다/들다’의 현재 분사로서 운구 동작을 나타내므로, 한국어에서는 자연스러운 서술인 ‘메고 가던 사람들’로 풀었습니다.
- source_word: ἔστησαν
  english_pob_choice: stood still
  chosen_korean: 멈추어 섰습니다
  alternatives_korean:
  - 서서 멈췄습니다
  - 걸음을 멈췄습니다
  lexicon: BDAG
  rationale: 단순히 멈춘 것이 아니라 멈춘 채 서 있게 된 결과를 함께 드러내기 위해 ‘멈추어 섰습니다’로 번역했습니다.
- source_word: Νεανίσκε
  english_pob_choice: Young man
  chosen_korean: 젊은이여
  alternatives_korean:
  - 젊은 남자여
  - 청년이여
  lexicon: BDAG
  rationale: 직접 호격의 어조를 살리면서도 현대 한국어에서 자연스러운 호칭으로 옮기기 위해 ‘젊은이여’를 선택했습니다.
- source_word: ἐγέρθητι
  english_pob_choice: arise
  chosen_korean: 일어나라
  alternatives_korean:
  - 일어서라
  - 깨어나라
  lexicon: BDAG
  rationale: 부활/소생의 권위 있는 명령을 담되, 한국어에서 가장 직접적이고 자연스러운 명령형으로 ‘일어나라’를 택했습니다.
theological_decisions:
- issue: 죽은 자에게 주시는 예수의 명령 어조
  chosen_reading: ‘일어나라’로 옮겨, 기적의 권위를 유지하면서도 과도한 해석어를 덧붙이지 않았습니다.
  alternative_readings:
  - 일어서라
  - 다시 살아나라
  rationale: 본문은 예수의 직접 명령과 사건의 즉각성을 드러내므로, 설명을 덧붙이기보다 간결한 명령형을 유지하는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: '번역 원칙: 기적의 신학적 무게를 평평하게 만들지 않되, 본문이 말하는 범위를 넘어 해석을 보태지 않는다.'
