id: LUK.7.28
reference: Luke 7:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
  footnotes:
  - marker: a
    text: Or, more literally, 'I say to you.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'born of women' is an idiom for human beings generally.
    reason: cultural_note
  - marker: c
    text: Or 'the one who is least in the kingdom of God.' The Greek expression can be rendered more explicitly with a relative phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러분에게 말합니다[a], 여자에게서 태어난 사람들 가운데 요한보다 더 큰 이는 아무도 없습니다[b]. 그러나 하나님 나라에서 가장 작은 이[c]는 그보다 더 큽니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 여러분에게 이릅니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘여자에게서 태어난 사람들’은 일반적으로 인간을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘하나님 나라에서 가장 작은 사람.’ 그리스어 표현은 관계절로 더 명시적으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  english_pob_choice: I tell you
  chosen_korean: 내가 여러분에게 말합니다
  alternatives_korean:
  - 여러분에게 말합니다
  - 내가 여러분에게 이르노니
  lexicon: SBLGNT / BDAG
  rationale: 현재형 발화 공식의 직접성을 살리면서도 현대 한국어에서 자연스러운 공적 발화를 위해 ‘말합니다’를 택했습니다.
- source_word: ἐν γεννητοῖς γυναικῶν
  english_pob_choice: among those born of women
  chosen_korean: 여자에게서 난 사람들 가운데
  alternatives_korean:
  - 여자에게서 태어난 사람들 가운데
  - 여자에게서 난 자들 가운데
  lexicon: BDAG
  rationale: 이 표현은 인간 일반을 가리키는 관용구이므로, 직역의 낯섦을 지나치게 키우지 않으면서도 관용적 의미를 드러내는 방향으로 옮겼습니다.
- source_word: μικρότερος
  english_pob_choice: the least
  chosen_korean: 가장 작은 사람
  alternatives_korean:
  - 가장 작은 이
  - 가장 덜 중요한 사람
  - 가장 작은 자
  lexicon: BDAG
  rationale: 문법상 명사화된 비교급이므로 ‘가장 작은 사람’으로 옮겨 비교의 최소치를 자연스럽게 표현했습니다.
- source_word: βασιλείᾳ τοῦ θεοῦ
  english_pob_choice: the kingdom of God
  chosen_korean: 하나님 나라
  alternatives_korean:
  - 하나님의 나라
  - 하나님 왕국
  lexicon: 표준 신학 용어
  rationale: POB의 기본 용례에 따라 ‘하나님 나라’를 사용해 왕권적 통치의 개념을 표준적으로 전달했습니다.
- source_word: μείζων αὐτοῦ ἐστιν
  english_pob_choice: is greater than he is
  chosen_korean: 그보다 더 큽니다
  alternatives_korean:
  - 그보다 더 위대합니다
  - 그보다 더 큰 사람입니다
  lexicon: BDAG
  rationale: 비교급의 상대적 우위를 간명하게 살리되, 우위의 구체적 기준은 본문이 말하는 만큼만 남겼습니다.
theological_decisions:
- issue: 요한과 하나님 나라에서 가장 작은 사람의 ‘더 큼’의 기준
  chosen_reading: 본문의 역설적 비교를 그대로 보존하고, 그 ‘더 큼’이 지위·특권·구속사적 위치 가운데 무엇인지 단정하지 않았습니다.
  alternative_readings:
  - 언약 특권의 더 큼
  - 도덕적·영적 우월성
  - 수사적 과장
  rationale: 헬라어 본문은 비교를 제시하지만 기준을 명시하지 않으므로, 해석을 과도하게 좁히지 않고 긴장을 유지했습니다.
  doctrine_reference: 의도된 신학적 긴장 보존
- issue: 직접 발화의 화자 표지
  chosen_reading: ‘내가 여러분에게 말합니다’로 옮겨 예수의 직접적 선언성을 살렸습니다.
  alternative_readings:
  - ‘여러분에게 이르노니’
  - ‘내가 여러분에게 이릅니다’
  rationale: 합쇼체 안에서 구어적이면서도 권위 있는 선언으로 들리도록 조정했습니다.
  doctrine_reference: 화자-청중 관계의 수사적 기능 보존
