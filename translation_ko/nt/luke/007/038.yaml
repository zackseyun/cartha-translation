id: LUK.7.38
reference: Luke 7:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
  footnotes:
  - marker: a
    text: Or 'kept kissing his feet'; the Greek verb is intensive and the imperfect tense suggests repeated action.
    reason: lexical_alternative
  - marker: b
    text: Or 'with ointment' or 'with fragrant oil'; the Greek word refers to perfumed oil or ointment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 뒤에서 그분의 발치에 서서 울며, 눈물로 그분의 발을 적시기 시작하여 자기 머리털로 그 발을 닦고, 그분의 발에 입맞추며 그 발에 향유를 바르고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 발에 계속 입맞추며’. 그리스어 동사는 강한 반복성을 띠며, 미완료 시상은 반복되는 동작을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘향품으로’ 혹은 ‘향기로운 기름으로’. 그리스어 μύρον은 향유나 향품 기름을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  english_pob_choice: standing behind him at his feet
  chosen_korean: 뒤에서 그분의 발치에 서서
  alternatives_korean:
  - 그분 뒤편 발치에 서서
  - 그분 뒤에서 그분의 발 곁에 서서
  lexicon: BDAG
  rationale: 뒤에 서 있는 위치와 발치라는 근접성을 함께 살리되, 한국어에서는 '발치'가 가장 자연스럽게 장면을 전달합니다.
- source_word: κλαίουσα
  english_pob_choice: weeping
  chosen_korean: 울며
  alternatives_korean:
  - 눈물 흘리며
  - 울고
  lexicon: BDAG
  rationale: '''울며''가 지속적인 슬픔의 상태를 간결하게 드러내며, 문장 흐름도 가장 자연스럽습니다.'
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  english_pob_choice: she began to wet
  chosen_korean: 눈물로 ... 적시기 시작하고
  alternatives_korean:
  - 눈물로 ... 젖게 하기 시작하고
  - 눈물로 ... 적시기 시작하여
  lexicon: BDAG
  rationale: '''ἤρξατο + infinitive''의 시작 의미를 ''시작하고''로 살리고, βρέχω는 과장하지 않은 ''적시다''로 옮겼습니다.'
- source_word: ἐξέμασσεν
  english_pob_choice: she was wiping
  chosen_korean: '... 닦고'
  alternatives_korean:
  - '... 닦아 내고'
  - '... 계속 닦으며'
  lexicon: BDAG
  rationale: 미완료 시상의 진행 중인 동작을 한국어 연결형으로 자연스럽게 반영했습니다.
- source_word: κατεφίλει
  english_pob_choice: was kissing his feet
  chosen_korean: 그분의 발에 입 맞추며
  alternatives_korean:
  - 그분의 발에 계속 입 맞추며
  - 그분의 발에 여러 번 입 맞추며
  lexicon: BDAG
  rationale: 강조된 반복성은 본문이 허용하는 만큼만 유지하고, 본문 밖의 해석을 덧붙이지 않기 위해 가장 직설적인 표현을 택했습니다.
- source_word: τῷ μύρῳ
  english_pob_choice: with the perfume
  chosen_korean: 향유를 바르고 있었습니다
  alternatives_korean:
  - 향유로 바르고 있었습니다
  - 향유를 붓고 있었습니다
  lexicon: BDAG
  rationale: μύρον은 향유/향품을 가리키므로, 한국어 교회 전통과 본문 맥락을 고려해 '향유'를 사용했습니다.
theological_decisions:
- issue: 여인의 행동을 어떻게 드러낼 것인가
  chosen_reading: 몸의 동작과 반복성을 있는 그대로 살려, 경건한 해설이나 완곡한 표현을 덧붙이지 않았습니다.
  alternative_readings:
  - 감정 표현을 약화한 번역
  - 헌신을 해설하는 번역
  rationale: 이 구절은 예수님 발 앞에서의 눈물, 닦음, 입맞춤, 바름을 통해 극적인 겸손을 보여 주므로, 본문이 말하는 강도를 유지하는 것이 중요합니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
