base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
  footnotes:
  - marker: a
    text: A denarius was a standard Roman silver coin, commonly associated with about a day's wage for a laborer.
    reason: cultural_note
translation:
  language: ko
  text: 한 사람은 두 채무자였습니다. 한 사람은 다섯백 데나리온을, 다른 사람은 쉰 데나리온을 빚졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 로마의 표준 은화로, 일반적으로 노동자의 하루 품삯 정도와 연결됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  english_pob_choice: debtors
  chosen_korean: 채무자
  alternatives_korean:
  - 빚진 사람들
  - 빚쟁이들
  lexicon: BDAG
  rationale: 두 사람의 법적·경제적 채무 관계를 가리키므로, 구어체보다 중립적이고 서술에 맞는 ‘채무자’가 원문의 뜻을 가장 정확하게 드러냅니다.
- source_word: δανιστῇ τινι
  english_pob_choice: a certain moneylender
  chosen_korean: 한 사람은
  alternatives_korean:
  - 어떤 돈꾼에게
  - 어떤 돈을 빌려주는 사람에게
  lexicon: BDAG
  rationale: δανιστής는 단순한 ‘채권자’보다 돈을 빌려주는 사람을 가리키므로, 본문 흐름상 ‘다음에 나오는 문맥에서 이미 소개된 인물’이라는 점만 간결하게 살리되, 뒤 문장에서 그가 누구인지 분명해지도록 했습니다.
- source_word: δηνάρια
  english_pob_choice: denarii
  chosen_korean: 데나리온
  alternatives_korean:
  - 데나리우스
  - 은전
  lexicon: BDAG
  rationale: 화폐 단위의 역사성을 보존하기 위해 음역을 택했습니다. 한국어에서는 단수형 ‘데나리온’이 자연스럽고, 수량 표현과 함께 역사적 화폐임을 드러냅니다.
- source_word: πεντακόσια / πεντήκοντα
  english_pob_choice: five hundred / fifty
  chosen_korean: 다섯백 / 쉰
  alternatives_korean:
  - 오백 / 오십
  lexicon: BDAG
  rationale: 수량 자체는 직역 가능하지만, 본문은 화폐 단위와 결합된 서술이므로 자연스러운 현대 한국어 수사 표현으로 처리했습니다.
