revisions:
- from: 그 사람들이 예수께 오자, 이렇게 말했습니다. 「세례자 요한이 우리를 당신에게 보내며, ‘당신이 오실 그분입니까, 아니면 우리가 다른 분을 기다려야 합니까?’라고 했습니다」[a]
  to: 그 사람들이 예수께 와서 말했습니다. “세례자 요한이 우리를 당신께 보내어 이렇게 말했습니다. ‘당신께서 오실 분[a]이십니까? 아니면 우리가 다른 분을 기다려야 합니까?’”
  rationale: 원문의 분사 λέγων이 요한이 전하도록 한 메시지의 내용을 이끈다는 점을 분명히 하기 위해 인용 구조를 바로잡았습니다. ‘오실 그분’을 자연스러운 현대 표준어인 ‘오실 분’으로 조정하고, 각주를 해당 표현에 직접 연결했습니다. 질문의 메시아적 기대와 그 해석상 긴장은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:10Z'
