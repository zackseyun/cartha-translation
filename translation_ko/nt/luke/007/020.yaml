  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
  footnotes:
  - marker: a
    text: Or, “the one who is to come.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들이 예수께 오자, 이렇게 말했습니다. 「세례자 요한이 우리를 당신에게 보내며, ‘당신이 오실 그분입니까, 아니면 우리가 다른 분을 기다려야 합니까?’라고 했습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오실 분’.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  english_pob_choice: came
  chosen_korean: 오자
  alternatives_korean:
  - 와서
  - 도착하자
  lexicon: BDAG
  rationale: 접속부사처럼 이어지는 부사절로 처리해 자연스러운 서술 흐름을 살렸습니다.
- source_word: οἱ ἄνδρες
  english_pob_choice: the men
  chosen_korean: 그 사람들
  alternatives_korean:
  - 그 남자들
  - 그 남성들
  lexicon: BDAG
  rationale: 문맥상 파견된 사자들이지만, 한국어에서는 ‘사람들’이 가장 자연스럽고 성별 정보는 본문 의미를 해치지 않는 범위에서 유지됩니다.
- source_word: Ἰωάννης ὁ βαπτιστής
  english_pob_choice: John the Baptist
  chosen_korean: 세례자 요한
  alternatives_korean:
  - 침례자 요한
  - 요한 세례자
  lexicon: BDAG
  rationale: 한국어 성경에서 널리 알려진 호칭을 따르되, βαπτιστής의 기능을 분명히 드러내기 위해 ‘세례자’를 사용했습니다.
- source_word: ὁ ἐρχόμενος
  english_pob_choice: the one who is to come
  chosen_korean: 오실 그분
  alternatives_korean:
  - 오셔야 할 분
  - 오시는 분
  lexicon: BDAG
  rationale: 직역보다 메시아적 함의를 드러내는 호칭 기능을 살려, 미래 분사적 의미를 한국어 관용에 맞게 ‘오실 그분’으로 옮겼습니다.
- source_word: προσδοκῶμεν
  english_pob_choice: should we expect
  chosen_korean: 우리가 ... 기다려야 합니까
  alternatives_korean:
  - 우리가 ... 기대해야 합니까
  - 우리가 ... 바라야 합니까
  lexicon: BDAG
  rationale: προσδοκάω의 기대/대기 의미를 반영해, 단순한 ‘기대’보다 인물을 기다리는 뉘앙스가 살아나는 표현을 택했습니다.
theological_decisions:
- issue: ὁ ἐρχόμενος의 메시아적 호칭성
  chosen_reading: ‘오실 그분’으로 옮겨 단순 설명이 아니라 호칭처럼 들리게 했습니다.
  alternative_readings:
  - ‘오실 분’
  - ‘오실 그이’
  rationale: 본문은 단순히 ‘오는 사람’이 아니라 구원사적 기대를 띤 질문이므로, 호칭적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: translate titles; preserve theological tension rather than resolve it.'
