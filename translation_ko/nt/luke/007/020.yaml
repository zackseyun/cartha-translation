  source_fidelity: 전반적으로 원문의 사건 순서와 질문의 의미를 충실히 옮겼습니다. 다만 ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων의 전달 구조는 요한이 사람들을 보내면서 이 질문을 전하게 했다는 뜻이므로, 현재의 ‘보내며, …라고 했습니다’보다 ‘보내어 이렇게 말했습니다’가 더 명료하고 정확합니다. ὁ ἐρχόμενος는 ‘오실 분’으로 자연스럽게 옮길 수 있으며 호칭적·메시아적 여지를 보존합니다.
  naturalness: 현행 문장은 겹인용과 ‘보내며, …라고 했습니다’의 결합이 다소 어색하여 누가 누구에게 말했는지 순간적으로 흐릴 수 있습니다. 수정문은 현대 표준어 합쇼체에서 자연스럽고, 직접 인용의 층위도 분명합니다. ‘오실 그분’은 한국어에서 다소 부자연스럽고 불필요하게 강조된 표현이므로 ‘오실 분’이 더 적절합니다.
  terminology: ‘세례자 요한’은 표준 한국어 성경 번역에서 통용되는 표현이며 βαπτιστής에 적절합니다. ‘오실 분’은 ὁ ἐρχόμενος의 호칭성을 유지하면서도 특정 교리적 해석을 덧붙이지 않습니다. 대명사 ‘당신’은 본문이 직접 예수께 드리는 질문이라는 점을 반영하되, 서술·질문 종결을 높임말로 처리했습니다.
