  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
  footnotes:
  - marker: a
    text: Or “Do not cry” or “Stop weeping.” The Greek may be heard either as a general prohibition or as telling her to cease her present mourning.
