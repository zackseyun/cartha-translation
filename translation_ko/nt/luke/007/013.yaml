    text: Μὴ κλαῖε는 ‘울지 마십시오’처럼 일반적인 금지로도, 이미 진행 중인 울음을 그치라는 뜻으로도 들릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 예수님께서
  alternatives_korean:
  - 주께서
  - 주님께서
  lexicon: BDAG
  rationale: 누가복음의 서술 문맥에서 κύριος는 예수님을 가리키는 주호칭이므로, 한국어에서는 자연스럽고 관계를 드러내는 ‘예수님께서’로 풀어 의미를 분명히 했습니다.
- source_word: ἰδὼν αὐτὴν
  english_pob_choice: when ... saw her
  chosen_korean: 그 여인을 보시고는
  alternatives_korean:
  - 그 여인을 보셨을 때
  - 보시고
  lexicon: BDAG
  rationale: 부정과거 분사의 시간 선행을 한국어의 연결형 ‘-고는’으로 옮겨, 보신 뒤에 곧 이어지는 반응을 자연스럽게 살렸습니다.
- source_word: ἐσπλαγχνίσθη
  english_pob_choice: was moved with compassion
  chosen_korean: 측은한 마음이 드셔서
  alternatives_korean:
  - 불쌍히 여기셔서
  - 깊이 동정하셔서
  lexicon: BDAG
  rationale: σπλαγχνίζομαι의 내적 동정과 강한 정서 반응을 드러내되, 현대 한국어에서 지나치게 교회적이거나 구어적인 표현을 피하기 위해 ‘측은한 마음이 드셔서’로 옮겼습니다.
- source_word: Μὴ κλαῖε
  english_pob_choice: Do not weep
  chosen_korean: 울지 마십시오
  alternatives_korean:
  - 울지 마라
  - 더는 울지 마십시오
  lexicon: BDAG
  rationale: μή + 현재 명령은 진행 중인 울음을 멈추라는 뉘앙스도 가질 수 있으나, POB의 보수적 선택에 맞춰 기본 금지 명령으로 ‘울지 마십시오’라고 옮겼습니다.
theological_decisions:
- issue: κύριος의 한국어 호칭 처리
  chosen_reading: 예수님께서
  alternative_readings:
  - 주께서
  - 주님께서
  rationale: 본문의 κύριος는 단순한 ‘주인’이 아니라 누가 서술의 예수님 호칭이므로, 독자가 인물 식별을 즉시 할 수 있도록 본문에서는 이름을 풀어 썼습니다. 이는 예수 호칭의 존칭 효과를 유지하면서도 한국어 문장 흐름을 매끄럽게 합니다.
