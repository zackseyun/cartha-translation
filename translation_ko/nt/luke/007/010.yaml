  to: 그리고 보냄을 받았던 사람들이 집으로 돌아가서 그 종이 건강한 것을 보았습니다.[a]
  rationale: 수동 분사 οἱ πεμφθέντες를 ‘보냄을 받았던 사람들’로 자연스럽게 통합하고, ὑποστρέψαντες의 선행 행위를 ‘돌아가서’로 유지했습니다. δοῦλος의 본문 번역 ‘종’은 보존하되, 대안 번역을 설명하는 각주의 용어를 일치시켰습니다.
