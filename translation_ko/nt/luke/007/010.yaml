id: LUK.7.10
reference: Luke 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the slave healthy.
  footnotes:
  - marker: a
    text: Or "servant." The Greek word is doulos, which can mean either "slave" or "servant" depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들이 집으로 돌아갔을 때, 보내졌던 이들은 종이 건강한 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하인.” 그리스어 doulos는 문맥에 따라 “종” 또는 “노예”를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  english_pob_choice: when ... returned
  chosen_korean: 돌아갔을 때
  alternatives_korean:
  - 돌아온 뒤
  - 되돌아가서
  lexicon: BDAG
  rationale: 부사적 부정과거 분사로서 주절보다 앞선 시간 관계를 나타내므로, 자연스러운 한국어로 ‘돌아갔을 때’라고 옮겼습니다.
- source_word: οἱ πεμφθέντες
  english_pob_choice: those who had been sent
  chosen_korean: 보내졌던 이들
  alternatives_korean:
  - 파견되었던 이들
  - 보냄을 받았던 사람들
  lexicon: BDAG
  rationale: 수동 분사 구조를 살려 ‘보내졌던’으로 옮겨, 누가 보냈는지보다 파송받은 상태를 드러냈습니다.
- source_word: τὸν δοῦλον
  english_pob_choice: the slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 이 절에서는 예수의 치유 대상인 집안의 종이라는 맥락이므로, 한국어에서 과도하게 현대적 법적 뉘앙스를 띠는 ‘노예’보다 문맥상 자연한 ‘종’을 택했습니다. 다만 소유/종속의 관계는 유지됩니다.
- source_word: ὑγιαίνοντα
  english_pob_choice: healthy
  chosen_korean: 건강한
  alternatives_korean:
  - 멀쩡한
  - 온전한
  lexicon: BDAG
  rationale: ὑγιαίνω의 기본 의미인 ‘건강하다/온전하다’를 반영하여, 치유의 결과를 드러내는 ‘건강한’으로 번역했습니다.
theological_decisions:
- issue: δοῦλος의 한국어 처리
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 하인
  rationale: 본문은 단순한 고용 관계보다 예속된 신분을 가리키는 δοῦλος를 사용하므로, 본문이 지닌 종속성을 살리되 한국어 가독성도 확보하는 ‘종’을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος의 맥락별 번역 원칙'
