id: LUK.7.4
reference: Luke 7:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
  footnotes:
  - marker: a
    text: Or “He is worthy for you to do this for him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예수께 오자마자, 그분께 간절히 청하며 말했습니다. “그는 당신이 그를 위해 이것을 해 주셔도 될 만한 사람입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 당신이 그를 위해 이것을 해 주셔도 될 만한 사람입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  english_pob_choice: came
  chosen_korean: 오자마자
  alternatives_korean:
  - 왔을 때
  - 도착했을 때
  - 예수께 왔을 때
  lexicon: BDAG
  rationale: 이 분사구는 단순한 이동보다 ‘와서 현장에 이르다’는 뉘앙스를 가지므로, 사건의 순서를 자연스럽게 드러내는 ‘오자마자’를 택했습니다.
- source_word: παρεκάλουν
  english_pob_choice: appealed
  chosen_korean: 간절히 청하며
  alternatives_korean:
  - 간청하며
  - 애원하며
  - 간곡히 요청하며
  lexicon: BDAG
  rationale: 상대적으로 공손하면서도 절박한 요청을 나타내므로, ‘청하다’에 ‘간절히’를 붙여 영어 POB의 respectful urgency를 살렸습니다.
- source_word: Ἄξιός
  english_pob_choice: worthy
  chosen_korean: 그는 … 만한 사람입니다
  alternatives_korean:
  - 그는 합당한 사람입니다
  - 그는 자격이 있습니다
  - 그는 가치 있는 사람입니다
  lexicon: BDAG
  rationale: 문맥상 사람의 품격/자격을 평가하는 말이므로, 한국어에서는 ‘합당하다’보다 관계적 자연성을 살린 ‘…만한 사람’으로 옮겼습니다.
- source_word: παρέξῃ
  english_pob_choice: should grant
  chosen_korean: 해 주셔도 될
  alternatives_korean:
  - 허락해 주실
  - 베풀어 주실
  - 허락하여 주실
  lexicon: BDAG
  rationale: παρέχω의 ‘베풀다/주다’ 의미를 살리되, 간청의 정중함을 유지하기 위해 ‘해 주셔도 될’로 표현했습니다. 이는 요청의 적합성을 말하는 문맥에 맞습니다.
theological_decisions:
- issue: 직접화법 안의 존대 수준
  chosen_reading: 예수께 대한 직접 요청은 합쇼체로 유지하고, 인용문 안에서도 ‘당신이’와 ‘해 주셔도 될’로 정중성을 드러냈습니다.
  alternative_readings:
  - 인용문 내부를 평서형으로 낮추는 번역
  - 더 전통적인 교회체 표현 사용
  rationale: 이 절은 예수께 드리는 예의 바른 청원을 전달하므로, 현대 한국어의 공손한 합쇼체가 원문의 태도를 가장 잘 반영합니다.
  doctrine_reference: 공손한 간청의 화행 보존
- issue: Ἄξιός의 평가 어감
  chosen_reading: ‘합당하다’보다 관계적이고 자연한 ‘…만한 사람’으로 처리했습니다.
  alternative_readings:
  - ‘합당한 사람’
  - ‘자격이 있는 사람’
  rationale: 원문은 centurion의 자격을 예수의 행동과 연결해 평가하는 말이므로, 한국어에서 지나치게 추상적인 어휘보다 화행의 기능을 살리는 표현이 적절합니다.
  doctrine_reference: 문맥 기반 의미 보존
