  to: 그들이 예수께 와서, 그분께 간절히 청하며 말했습니다. “그는 그를 위해 이 일을 해 주실 만한 사람입니다.”[a]
  rationale: 도착 분사의 무표적 시간 관계는 ‘와서’로 옮기고, 간절한 청원은 유지했습니다. 인용문은 ‘~해 주실 만한 사람’으로 ἄξιος의 평가를 보존했으며, ‘해 주셔도 될’이 유발하던 허용 의미를 제거했습니다. 각주는 παρέχω의 ‘베풀다’라는 어휘 대안을 제시합니다.
  reviewer_model: gpt-5.6-terra
