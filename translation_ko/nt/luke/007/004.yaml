  verdict: revise
  source_fidelity: ‘오자마자’는 παραγενόμενοι의 단순한 도착/참여의 시간적 의미보다 즉시성을 더합니다. 또한 ‘해 주셔도 될’은 허용의 뜻으로 들려, ἄξιος와 παρέξῃ가 나타내는 ‘그에게 이 일을 해 주기에 합당하다’라는 평가를 정확히 전달하지 못합니다.
  naturalness: ‘그들이 예수께 와서, 그분께 간절히 청하며 말했습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. 직접 인용에서는 한국어의 자연스러운 존대 주어 생략을 활용하여 ‘당신’이라는 다소 부자연스러운 호칭을 피했습니다.
  terminology: ἄξιος는 ‘…해 주실 만한 사람’으로, παρέξῃ τοῦτο는 문맥상 요청된 일을 ‘해 주시다’로 옮겼습니다. 이는 신학적 해석을 덧붙이지 않고 원문의 평가와 요청을 보존합니다.
  issues:
