    rationale: παραγενόμενοι는 ‘와서/도착하여’라는 분사이며, 그들이 도착하자마자 청원했다는 즉시성 자체를 명시하지 않습니다.
  - severity: high
    issue: ‘해 주셔도 될 만한’이 허용의 뜻을 만듦
    rationale: 원문은 그 사람이 예수께서 그에게 이 일을 해 주실 만큼 ‘합당하다/가치 있다’고 주장합니다. ‘~해도 되다’는 예수의 행위가 허용된다는 뜻으로 바뀝니다.
