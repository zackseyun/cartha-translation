id: LUK.7.6
reference: Luke 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
  footnotes:
  - marker: a
    text: 'Or “sir.” Greek: “Lord” (κύριε), which can function as a respectful address and may also imply recognition of Jesus’ authority.'
    reason: alternative_reading
  - marker: b
    text: Or “fit” / “qualified.” The Greek expression can denote adequacy or worthiness; here it conveys the centurion’s humility before Jesus.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들과 함께 가셨습니다. 그런데 예수께서 이미 그 집에서 멀지 않은 곳에 계셨을 때, 백부장이 친구들을 보내어 예수께 이렇게 말하게 했습니다. “주님[a], 수고하지 마십시오. 저는 주님께서 제 지붕 아래로 들어오시기에 합당한 사람이 아닙니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님.” 헬라어 κύριε는 공손한 호칭으로 쓰일 수 있으며, 예수의 권위를 인정하는 뜻을 담을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “자격이 있는” 또는 “합당한.” 헬라어 ἱκανός는 충분함이나 적합함을 뜻할 수 있으며, 여기서는 예수 앞에서 자신을 낮추는 백부장의 태도를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο σὺν αὐτοῖς
  english_pob_choice: So Jesus went with them
  chosen_korean: 예수께서 그들과 함께 가셨습니다
  alternatives_korean:
  - 예수께서 그들과 함께 가셨습니다
  - 예수께서 그들과 동행하셨습니다
  lexicon: BDAG
  rationale: ἔπορεύετο와 σὺν αὐτοῖς의 동행 의미를 자연스러운 현대 한국어로 옮기되, 불필요한 의역을 피했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 대한 직접 호칭으로서의 κύριε를 보존하면서, 한국어에서는 관계적·경외적 뉘앙스가 살아 있는 ‘주님’이 가장 적절합니다.
- source_word: μὴ σκύλλου
  english_pob_choice: do not trouble yourself
  chosen_korean: 수고롭게 하지 마십시오
  alternatives_korean:
  - 번거롭게 하지 마십시오
  - 마음 쓰지 마십시오
  lexicon: BDAG
  rationale: σκύλλω의 ‘괴롭히다/수고롭게 하다’라는 의미를 공손한 요청 형태로 옮겨, 백부장의 정중한 태도를 살렸습니다.
- source_word: ἱκανός εἰμι ... εἰσέλθῃς ὑπὸ τὴν στέγην μου
  english_pob_choice: I am not worthy that you should come under my roof
  chosen_korean: 저는 주님께서 제 지붕 아래로 들어오실 만한 사람이 아닙니다
  alternatives_korean:
  - 저는 주님을 제 집 아래로 모실 자격이 없습니다
  - 저는 주님께서 제 집에 들어오실 자격이 없습니다
  lexicon: BDAG
  rationale: ἱκανός εἰμι를 단순한 능력보다 ‘합당함/자격 없음’의 의미로 이해하여, POB의 ‘not worthy’를 반영하되 한국어에서는 ‘~만한 사람이 아닙니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: κύριε의 호칭 강도
  chosen_reading: ‘주님’으로 번역해 단순한 예의표현을 넘을 수 있는 예수의 권위 인정 가능성을 열어 둡니다.
  alternative_readings:
  - 주
  - 선생님
  - sir
  rationale: POB의 주석처럼 κύριε는 공손한 호칭일 수 있지만, 이 문맥에서는 예수의 권위를 함축할 수 있으므로 ‘주님’이 본문의 긴장과 가능성을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
