revisions:
- from: 이것을 본 초대받은 바리새인은 마음속으로 말했습니다. 「만일 이 사람이 예언자라면, 자기에게 닿고 있는 이 여자가 누구이며 어떤 사람인지 알았을 텐데, 그녀는 죄인입니다」.[a][b]
  to: 그를 초대한 바리새인이 이것을 보고 속으로 말했습니다. “이 사람이 예언자라면, 그에게 닿고 있는 이 여자가 누구이며 어떤 부류의 사람인지[a], 또 그 여자가 죄인이라는 것을[b] 알았을 텐데.”
  rationale: 초청의 주체를 바로잡아 원문의 관계절을 충실히 반영했습니다. ὅτι절은 본문에서 내용절로 처리하되, 그리스어에서 가능한 이유의 뉘앙스는 각주에 남겨 논쟁 가능한 모호성을 보존했습니다. 각주 표지도 해당 어구에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:08Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ‘초대받은 바리새인’은 ὁ καλέσας αὐτόν(‘그를 초대한 바리새인’)과 행위자 관계가 반대입니다. 또한 ὅτι ἁμαρτωλός ἐστιν은 ‘그 여자가 죄인이라는 것을’이라는 내용절로 본문에 옮기고, 이유절 가능성은 각주로 보존하는 편이 그리스어의 연결 관계를 더 정확히 반영합니다.
  naturalness: ‘그를 초대한 바리새인이 이것을 보고 속으로 말했습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘그에게 닿고 있는’은 현재 진행 중인 접촉을 분명히 하며, 불필요하게 강한 표현을 피합니다.
  terminology: ‘바리새인’, ‘예언자’, ‘죄인’은 적절합니다. ποταπή의 평가적 뉘앙스는 ‘어떤 부류의 사람인지’로 자연스럽게 드러냅니다.
  issues:
  - severity: high
    issue: ‘초대받은 바리새인’
    rationale: 원문의 ὁ καλέσας αὐτόν은 바리새인이 예수를 초대한 주체임을 뜻합니다. 현 문안은 바리새인이 초대를 받은 사람이라는 반대 의미가 됩니다.
  - severity: medium
    issue: ὅτι절의 통사 관계와 각주 연결
    rationale: 현 본문 ‘그녀는 죄인입니다’는 조건문의 목적어인 ‘알았을 텐데’와 느슨하게 연결됩니다. 내용절로 옮기면 원문의 ‘그 여자가 죄인이라는 것’을 알았을 것이라는 의미가 명확해지며, 이유절로 읽을 가능성은 각주에서 보존할 수 있습니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주 a는 τίς καὶ ποταπή에, 각주 b는 ὅτι절에 각각 직접 붙이는 것이 독자가 대안의 적용 범위를 명확히 알 수 있습니다.
