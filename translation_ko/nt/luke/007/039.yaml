id: LUK.7.39
reference: Luke 7:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: Now when the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
  footnotes:
  - marker: a
    text: Or 'who and what kind of woman this is.' The Greek stresses both her identity and her character/reputation.
    reason: lexical_alternative
  - marker: b
    text: Or 'that she is a sinner.' The clause may be heard either as the content of what he would know or as the reason for the woman's character.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 본 초대받은 바리새인은 마음속으로 말했습니다. 「만일 이 사람이 예언자라면, 자기에게 닿고 있는 이 여자가 누구이며 어떤 사람인지 알았을 텐데, 그녀는 죄인입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘누구이며 어떤 사람인지’는 그녀의 신원과 성격/평판을 함께 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그녀는 죄인입니다’는 ‘그녀가 죄인이라는 사실을’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  english_pob_choice: Now when ... saw this
  chosen_korean: 이것을 본
  alternatives_korean:
  - 그리고 보니
  - 보았을 때
  lexicon: BDAG
  rationale: 분사구문을 자연스러운 시간 부사절로 옮겨, 직전 사건을 본 뒤의 반응이라는 흐름을 살렸습니다.
- source_word: ὁ καλέσας αὐτόν
  english_pob_choice: who had invited him
  chosen_korean: 초대받은
  alternatives_korean:
  - 그를 초대한
  - 그를 불러온
  lexicon: BDAG
  rationale: 식사 자리 문맥에서 καλέω는 ‘초대하다’가 자연스러우며, 관계절을 간결하게 살리기 위해 수식어로 처리했습니다.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  english_pob_choice: he said to himself
  chosen_korean: 마음속으로 말했습니다
  alternatives_korean:
  - 스스로 말했습니다
  - 자기 안에서 말했습니다
  lexicon: BDAG
  rationale: ἐν ἑαυτῷ의 내적 독백을 표준 한국어로 자연스럽게 전달했습니다.
- source_word: τίς καὶ ποταπὴ
  english_pob_choice: who and what sort of
  chosen_korean: 누구이며 어떤 사람인지
  alternatives_korean:
  - 누구이며 어떤 종류의 사람인지
  - 누구이고 어떤 부류의 사람인지
  lexicon: BDAG
  rationale: 두 개의 의문사를 통해 신원과 성격/평판을 함께 묻는 효과를 보존했습니다.
- source_word: ἅπτεται
  english_pob_choice: is touching
  chosen_korean: 닿고 있는
  alternatives_korean:
  - 만지고 있는
  - 손대고 있는
  lexicon: BDAG
  rationale: 현재형의 진행성을 살리면서, 이 장면에서의 접촉 행위를 한국어로 자연스럽게 옮겼습니다.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  english_pob_choice: because she is a sinner
  chosen_korean: 그녀는 죄인입니다
  alternatives_korean:
  - 그녀가 죄인이라는 것을
  - 그녀가 죄인이기 때문입니다
  lexicon: BDAG
  rationale: ὅτι의 이유/내용 가능성을 감안해 본문에는 판단의 핵심 진술을 두고, 구체적 이유는 문맥상 드러나게 했습니다.
theological_decisions:
- issue: 예수께 대한 바리새인의 가정적 판단의 조건문 처리
  chosen_reading: ‘만일 이 사람이 예언자라면, ... 알았을 텐데’로 옮겨, 반사실적 조건과 추론의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - ‘이 사람이 예언자라면, ... 알 것입니다’처럼 더 평서적으로 옮길 수 있음
  rationale: εἰ ἦν ... ἐγίνωσκεν ἂν은 바리새인의 회의적 가정을 드러내므로, 이를 완화하지 않고 반사실적 뉘앙스를 보존하는 것이 적절합니다.
  doctrine_reference: 서술자의 평가가 아니라 인물의 편견을 드러내는 장면으로 유지
