  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
  footnotes:
  - marker: a
    text: Or 'my boy' or 'my child'; the Greek word can refer to a child, youth, or servant, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 저는 스스로 주님께 나아갈 자격도 없다고 여겼습니다. 다만 말씀만 하셔서 제 종이 낫게 하십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 아이’ 또는 ‘제 소년’. 그리스어 παῖς는 문맥에 따라 아이, 소년, 또는 종을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그래서
  lexicon: BDAG
  rationale: 앞 문맥의 결론을 잇는 추론 표지이므로, 자연스러운 한국어 접속부사인 ‘그러므로’로 옮겼습니다.
- source_word: ἐμαυτὸν ἠξίωσα
  english_pob_choice: I considered myself worthy
  chosen_korean: 스스로를 … 합당한 사람으로 여기지도 않았습니다
  alternatives_korean:
  - 스스로를 … 가치 있다고 여기지도 않았습니다
  - 스스로를 … 자격이 있다고 여기지도 않았습니다
  lexicon: BDAG
  rationale: ἠξίωσα는 ‘합당하다고 여기다/평가하다’의 의미가 핵심이므로, ‘합당한 사람으로 여기다’로 옮겨 자격 판단의 뉘앙스를 살렸습니다.
- source_word: εἰπὲ λόγῳ
  english_pob_choice: say the word
  chosen_korean: 말씀만 하십시오
  alternatives_korean:
  - 한 말씀만 하십시오
  - 말만 하십시오
  - 말씀만 해 주십시오
  lexicon: BDAG
  rationale: 명령형과 도구격적 표현을 한국어 관용에 맞게 압축해, 권위 있는 한마디로 치유가 이루어진다는 의미를 살렸습니다.
- source_word: ὁ παῖς μου
  english_pob_choice: my servant
  chosen_korean: 제 종
  alternatives_korean:
  - 제 하인
  - 제 아이
  - 제 아들
  lexicon: BDAG
  rationale: 이 문맥에서는 centurion의 집안/명령 아래 있는 사람을 가리키므로 ‘종’이 가장 직접적입니다. 영어 POB의 ‘servant’에 맞추되, παῖς의 넓은 의미는 각주로 보존했습니다.
theological_decisions:
- issue: ἰαθήτω의 명령형 뉘앙스
  chosen_reading: 그러면 제 종이 나을 것입니다
  alternative_readings:
  - 그러면 제 종이 치유될 것입니다
  - 그러면 제 종을 고쳐 주십시오
  rationale: 그리스어는 단순 미래가 아니라 ‘치유되게 하십시오’라는 요청의 명령형이므로, 한국어에서는 결과를 기대하는 선언형으로 자연스럽게 살렸습니다.
  doctrine_reference: Translation philosophy §5 (source-direct imperatival force)
