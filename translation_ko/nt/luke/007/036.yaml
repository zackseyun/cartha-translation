    issue: ‘그때’의 추가
    rationale: 원문의 δέ는 완만한 접속사이며 명시적 시간 부사가 아닙니다. 영어 POB 감사 이력도 선행 ‘Now’를 삭제했으므로, 한국어 ‘그때’는 제거하는 것이 적절합니다.
  - severity: medium
    issue: ‘식탁에 기대어 앉으셨습니다’의 공간적 모호성
    rationale: 이 표현은 식탁을 지지물로 삼아 기댄다는 의미로 이해될 수 있습니다. κατεκλίθη의 식사 관습상 자세는 ‘식사 자리에 기대어 앉으셨습니다’로 옮기는 편이 정확합니다.
  - severity: low
    issue: ‘계속 청하였습니다’가 반복을 다소 강하게 단정함
    rationale: 미완료는 진행·반복 등의 관점을 나타낼 수 있으나, 문맥상 실제 반복을 확정하지 않습니다. ‘청하고 있었습니다’가 지속성을 보존하면서도 더 신중합니다.
  revised_text: 바리새인들 중 한 사람이 예수님께 자기와 함께 식사해 주시기를 청하고 있었습니다. 예수님은 그 바리새인의 집에 들어가셔서 식사 자리에 기대어 앉으셨습니다.[a]
