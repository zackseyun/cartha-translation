id: LUK.7.36
reference: Luke 7:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: Now one of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
  footnotes:
  - marker: a
    text: Or, more formally, 'asked him that he might eat with him.'
    reason: lexical_alternative
  - marker: b
    text: That is, he took the customary posture for a formal meal, reclining rather than sitting upright.
    reason: cultural_note
translation:
  language: ko
  text: 바리새인들 중 한 사람이 예수님께 자기와 함께 식사해 주시기를 청하고 있었습니다. 예수님은 그 바리새인의 집에 들어가셔서 식사 자리에 기대어 앉으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 1세기 식사 자리의 관습에 따라 앉아서 식사하기보다 기대어 식사하는 자세를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  english_pob_choice: was asking
  chosen_korean: 계속 청하였습니다
  alternatives_korean:
  - 청하였습니다
  - 초청하였습니다
  - 함께 식사해 달라고 부탁하였습니다
  lexicon: BDAG
  rationale: 미완료 과거의 지속성을 살리면서도, 식사 초청의 문맥을 자연스럽게 드러내기 위해 ‘계속 청하였습니다’를 택했습니다.
- source_word: τῶν Φαρισαίων / τοῦ Φαρισαίου
  english_pob_choice: of the Pharisees / the Pharisee’s
  chosen_korean: 바리새인들 중 한 사람 / 바리새인의 집
  alternatives_korean:
  - 바리새인들 중 한 사람 / 그 바리새인의 집
  - 바리새파 사람들 중 한 사람 / 바리새파 사람의 집
  lexicon: BDAG
  rationale: 집단 소속을 나타내는 부분속격은 ‘~들 중 한 사람’으로, 뒤의 속격은 소유 관계인 ‘바리새인의 집’으로 옮겨 원문 관계를 분명히 했습니다.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  english_pob_choice: to eat with him
  chosen_korean: 자기와 함께 식사해 달라고
  alternatives_korean:
  - 그와 함께 먹기 위해
  - 그와 함께 식사하도록
  lexicon: BDAG
  rationale: ἵνα + 접속법의 목적 의미를 한국어 요청 표현으로 자연스럽게 풀어, 단순한 행위보다 초청의 의도를 드러냈습니다.
- source_word: κατεκλίθη
  english_pob_choice: reclined at the table
  chosen_korean: 식탁에 기대어 앉으셨습니다
  alternatives_korean:
  - 식탁에 비스듬히 누우셨습니다
  - 식사 자리에서 기대어 앉으셨습니다
  - 식탁에 누우셨습니다
  lexicon: BDAG
  rationale: 1세기 식사 관습인 ‘recline’를 현대 독자가 이해하도록 ‘식탁에 기대어’로 옮기되, 단순히 ‘앉으셨습니다’로 평탄화하지 않았습니다.
theological_decisions:
- issue: 식사 초청의 정중한 요청 표현
  chosen_reading: ‘자기와 함께 식사해 달라고 계속 청하였습니다’로 번역해 바리새인의 요청과 예수님의 응답 가능성을 열린 채로 둡니다.
  alternative_readings:
  - ‘초청하였습니다’
  - ‘함께 식사하자고 했습니다’
  rationale: 원문은 단순 초대보다 요청/청원의 뉘앙스가 있어, 관계의 긴장과 공손함을 함께 보존하는 표현을 택했습니다.
  doctrine_reference: 서사 문맥 보존
- issue: 식사 자세의 문화적 배경
  chosen_reading: ‘식탁에 기대어 앉으셨습니다’로 첫째세기 연회 관습을 암시합니다.
  alternative_readings:
  - ‘앉으셨습니다’
  - ‘기대어 누우셨습니다’
  rationale: 본문의 역사적 배경을 지우지 않기 위해 전통적 식사 자세를 반영하되, 과도한 설명은 본문 밖으로 돌렸습니다.
  doctrine_reference: 역사-문화적 배경
