  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 빚을 갚지 못하는 문맥에서 ἐχαρίσατο ἀμφοτέροις는 두 사람 자체를 ‘용서하다’보다 두 사람의 빚을 호의로 면제하거나 탕감한 것으로 한국어에 명시하는 편이 원문의 채무 문맥과 여격 구문을 더 정확히 전달합니다.
  naturalness: ‘둘 모두에게 너그러이 용서해 주었습니다’는 한국어에서 무엇을 용서했는지가 다소 불분명하고, 채무자에게 빚을 용서한다는 표현도 자연스럽지 않습니다. ‘두 사람 모두의 빚을 너그러이 탕감해 주었습니다’가 현대 표준어 합쇼체에서 명료하고 자연스럽습니다.
  terminology: ‘탕감해 주었습니다’는 이 비유의 채무 문맥에서 χαρίζομαι의 무상·호의의 면제 의미를 적절히 살립니다. ‘너그러이’는 그 호의의 뉘앙스를 보존합니다. 각주도 ‘빚진 것을 너그럽게 주다’라는 부정확하고 어색한 설명을 바로잡아야 합니다.
