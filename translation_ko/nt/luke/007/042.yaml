source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
  footnotes:
  - marker: a
    text: Or 'he canceled the debts of both.' The Greek verb can denote freely granting or remitting what is owed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 갚을 수 없었으므로, 그가 두 사람 모두의 빚을 너그러이 탕감해 주었습니다.[a] 그러니 그들 가운데 누가 그를 더 사랑하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 두 사람 모두를 너그러이 용서해 주었습니다.’ 그리스어 동사는 호의로 주거나 빚진 것을 면제하거나 탕감하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  english_pob_choice: Since they did not have the means to repay
  chosen_korean: 그들이 갚을 수 없었으므로
  alternatives_korean:
  - 그들이 갚을 능력이 없었으므로
  - 그들이 갚을 돈이 없었으므로
  lexicon: BDAG
  rationale: 분사구가 빚을 갚을 능력/수단이 없었던 상황을 배경으로 제시하므로, 한국어에서는 원인 연결을 자연스럽게 살려 간결하게 옮겼습니다.
- source_word: ἀμφοτέροις
  english_pob_choice: both
  chosen_korean: 둘 모두에게
  alternatives_korean:
  - 둘에게
  - 두 사람 모두에게
  lexicon: BDAG
  rationale: 두 채무자를 가리키므로 ‘둘 모두’로 분명하게 표시했습니다.
- source_word: ἐχαρίσατο
  english_pob_choice: he graciously forgave
  chosen_korean: 너그러이 용서해 주었습니다
  alternatives_korean:
  - 은혜로 용서해 주었습니다
  - 값 없이 용서해 주었습니다
  - 빚을 탕감해 주었습니다
  lexicon: BDAG
  rationale: χαρίζομαι의 ‘호의로 주다/용서하다’ 뉘앙스를 살리면서, 빚 비유의 맥락에서 ‘용서해 주었습니다’로 자연스럽게 표현했습니다.
- source_word: πλεῖον
  english_pob_choice: more
  chosen_korean: 더
  alternatives_korean:
  - 더 많이
  - 더 큰 사랑으로
  lexicon: BDAG
  rationale: 비교급의 단순한 의미를 한국어 비교 부사 ‘더’로 옮겼습니다.
theological_decisions:
- issue: χαρίζομαι의 빚 탕감과 용서 뉘앙스의 동시 보존
  chosen_reading: ‘너그러이 용서해 주었습니다’로 옮겨, 빚의 취소와 은혜로운 용서의 의미를 함께 드러냈습니다.
  alternative_readings:
  - 빚을 탕감해 주었습니다
  - 둘 모두를 용서해 주었습니다
  rationale: 문맥은 분명히 빚 상환이지만, 예수의 비유 전체는 용서와 사랑의 관계를 드러냅니다. 따라서 금융적 의미만으로 축소하지 않으면서도 은혜의 뉘앙스를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
