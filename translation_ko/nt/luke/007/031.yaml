id: LUK.7.31
reference: Luke 7:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: ko
  text: 그러므로 내가 이 세대의 사람들을 무엇에 비유하겠습니까? 그들은 무엇과 같습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  english_pob_choice: To what, then, shall I compare ...
  chosen_korean: “무엇에 비유하겠습니까?”
  alternatives_korean:
  - “무엇과 견주겠습니까?”
  - “무엇에 견주어 말하겠습니까?”
  lexicon: ὁμοιόω
  rationale: 비유하다/견주다의 뜻을 살리되, 한국어에서 자연스러운 수사 질문 형태로 정리했습니다.
- source_word: τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης
  english_pob_choice: the men of this generation
  chosen_korean: “이 세대의 사람들”
  alternatives_korean:
  - “이 세대의 남자들”
  - “이 세대의 인간들”
  lexicon: ἄνθρωποι / γενεά
  rationale: POB의 영어 선택인 “the men”은 문맥상 ‘사람들’로 옮기되, γενεά는 ‘세대’로 직역해 대상 집단을 분명히 했습니다.
- source_word: τίνι εἰσὶν ὅμοιοι
  english_pob_choice: what are they like?
  chosen_korean: “그들은 무엇과 같습니까?”
  alternatives_korean:
  - “그들은 어떤 것과 같습니까?”
  - “그들은 무엇과 비슷합니까?”
  lexicon: ὅμοιος
  rationale: 두 번째 수사 질문의 평행성을 살려 ‘무엇과 같다’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 수사 질문의 존대 수준
  chosen_reading: 예수님의 공개 발화로서 공손한 종결형을 유지하되, 내용상 판단적 수사성을 그대로 드러냈습니다.
  alternative_readings:
  - 더 직접적인 평서형
  - 덜 공손한 구어체
  rationale: 본문은 대중을 향한 예수님의 질문이므로 합쇼체가 적절하지만, 수사 질문의 날카로움은 약화하지 않도록 했습니다.
  doctrine_reference: 복음서 내 예수의 공개 발화 톤
- issue: γενεά의 범위
  chosen_reading: ‘세대’로 옮겨 당대의 역사적-도덕적 집단을 가리키게 했습니다.
  alternative_readings:
  - ‘족속’
  - ‘사람들’
  rationale: γενεά는 단순 연령 집단이 아니라 예수께서 평가하시는 동시대의 세대를 뜻하므로 ‘세대’가 가장 직접적입니다.
  doctrine_reference: 복음서의 세대 비판 모티프
