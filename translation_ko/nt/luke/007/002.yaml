    rationale: 초안의 ‘그가 그에게 매우 귀한 사람이었습니다’에서 ‘그가’가 종인지 백부장인지, ‘그에게’가 누구인지 문법상 혼동될 수 있습니다. 원문의 관계절은 종을 가리키고 αὐτῷ는 백부장을 가리킵니다.
