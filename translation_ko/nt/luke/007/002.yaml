id: LUK.7.2
reference: Luke 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: Now a certain centurion’s slave[a], who was sick and about to die, was highly valued by him.
  footnotes:
  - marker: a
    text: Or “servant.” The Greek word is doulos, which can mean either “slave” or “servant” depending on context; here “slave” was chosen to preserve the bonded relationship implied by the term.
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 백부장의 종 하나가 병들어 거의 죽게 되었는데, 그가 그에게 매우 귀한 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하인”. 여기서는 δοῦλος가 단순한 고용인을 넘는 종속 관계를 가리키므로 “종”을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκατοντάρχου δέ τινος
  english_pob_choice: Now a certain centurion’s
  chosen_korean: 어떤 백부장의
  alternatives_korean:
  - 한 백부장의
  - 어느 백부장의
  lexicon: SBLGNT / BDAG
  rationale: τινος의 불특정성을 살리면서, 주어가 속한 관계를 자연스럽게 한국어 소유격으로 옮겼습니다. δέ는 문맥 전환 표지로 처리하지 않고 흐름에 흡수했습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 이 절에서는 백부장에게 속한 가사 종의 소속 관계가 분명하지만, POB 영어가 ‘slave’ 대신 주석으로 대안을 열어 두었으므로 한국어는 현대 독자에게 과도하게 경직되지 않으면서도 종속성을 유지하는 ‘종’을 택했습니다.
- source_word: κακῶς ἔχων ἤμελλεν τελευτᾶν
  english_pob_choice: who was sick and about to die
  chosen_korean: 병들어 거의 죽게 되었는데
  alternatives_korean:
  - 아파서 죽기 직전이었는데
  - 몹시 앓아 죽어 가고 있었는데
  lexicon: BDAG
  rationale: κακῶς ἔχων의 관용적 의미를 ‘병들어’로 자연스럽게 옮기고, ἤμελλεν τελευτᾶν의 임박성을 ‘거의 죽게 되었는데’로 살렸습니다.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  english_pob_choice: was highly valued by him
  chosen_korean: 그가 그에게 매우 귀한 사람이었습니다
  alternatives_korean:
  - 그가 그에게 매우 소중한 사람이었습니다
  - 그가 그에게 높이 평가받는 사람이었습니다
  lexicon: BDAG
  rationale: ἔντιμος의 ‘귀하다/가치 있다/존귀하다’ 범위를 반영해 정서적 과잉을 피하면서도 관계적 애정을 드러내는 ‘매우 귀한 사람’으로 옮겼습니다.
theological_decisions:
- issue: δοῦλος를 ‘노예’로 직역할지 여부
  chosen_reading: ‘종’으로 번역하되, 소속과 종속 관계는 문맥으로 보존합니다.
  alternative_readings:
  - 노예
  - 하인
  rationale: 이 문맥은 분명 소유 관계를 포함하지만, 한국어에서 ‘노예’는 현대 독자에게 더 강한 사회사적 뉘앙스를 띠어 서술 흐름을 거칠게 만들 수 있습니다. 본 절의 핵심은 백부장에게 속한 하인의 긴급한 병환과 주인의 귀중하게 여김이므로 ‘종’이 가장 균형 잡힌 선택입니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος 번역 지침; Luke 7:2 POB audit trail'
- issue: ἔντιμος의 평가어를 감정적 언어로 옮길지 여부
  chosen_reading: 관계적 존중과 가치를 함께 드러내는 표현을 사용합니다.
  alternative_readings:
  - 귀한
  - 소중한
  - 존귀한
  rationale: 이 단어는 단순한 감정 애착만이 아니라 실제로 ‘가치 있게 여김’을 뜻하므로, 한국어에서 너무 정서적이거나 지나치게 형식적인 단어 하나로 고정하지 않고 ‘매우 귀한 사람’으로 균형을 잡았습니다.
  doctrine_reference: BDAG ἔντιμος 용례; 문맥 중심 번역 원칙
