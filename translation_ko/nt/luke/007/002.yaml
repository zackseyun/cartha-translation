  verdict: revise
  source_fidelity: ‘그가 그에게’는 관계절의 선행사와 αὐτῷ의 지시 대상을 한국어에서 불필요하게 모호하게 합니다. 또한 ‘거의 죽게 되었는데’는 임박의 뜻을 전달하나 다소 어색하며, ‘죽음을 앞두고’가 ἤμελλεν τελευτᾶν을 더 자연스럽고 정확하게 반영합니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체 문체에 맞고, 반복을 최소한으로 유지하면서도 ‘종’과 ‘백부장’의 관계를 분명히 합니다.
  terminology: ἑκατοντάρχης는 ‘백부장’, δοῦλος는 본문에서 소속·종속 관계를 보존하는 ‘종’으로 유지합니다. ἔντιμος는 감상적 의미를 덧붙이지 않고 ‘매우 귀하게 여겨졌습니다’로 옮깁니다.
