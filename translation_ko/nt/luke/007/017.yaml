lexical_decisions:
- source_word: καὶ ἐξῆλθεν
  english_pob_choice: went out
  chosen_korean: 퍼졌습니다
  alternatives_korean:
  - 나갔습니다
  - 퍼져 나갔습니다
  lexicon: BDAG
  rationale: λόγος가 소문·보고의 뜻이므로, 한국어에서는 ‘나갔다’의 이미지를 살리되 자연스러운 확산 표현인 ‘퍼졌습니다’로 옮겼습니다.
- source_word: ὁ λόγος οὗτος
  english_pob_choice: this report
  chosen_korean: 이 소문
  alternatives_korean:
  - 이 보고
  - 이 말
  - 이 이야기
  lexicon: BDAG
  rationale: 여기서 λόγος는 한마디 ‘말’보다 예수에 관한 소식이 퍼진 상황을 가리키므로, ‘소문’이 문맥상 가장 직접적입니다.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ ... καὶ πάσῃ τῇ περιχώρῳ
  english_pob_choice: through all Judea and all the surrounding region
  chosen_korean: 온 유대와 모든 주변 지역
  alternatives_korean:
  - 유대 온 땅과 주변 모든 지역
  - 온 유대와 주변의 모든 지역
  lexicon: BDAG
  rationale: Ἰουδαία는 지명으로 ‘유대’, περιχώρος는 ‘주변 지역’으로 옮겨 두 지리 범주의 포괄성을 살렸습니다.
- source_word: περὶ αὐτοῦ
  english_pob_choice: about him
  chosen_korean: 그에 대하여
  alternatives_korean:
  - 그에 관하여
  - 그에 대해
  lexicon: BDAG
  rationale: περί + 속격의 기본 의미를 한국어 조사구로 자연스럽게 반영했습니다.
