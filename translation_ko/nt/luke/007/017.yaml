translation:
  language: ko
  text: 이 소문이 그에 대하여 온 유대와 모든 주변 지역에 퍼졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 소식/이 말이 그에 대하여 퍼졌습니다’가 됩니다.
