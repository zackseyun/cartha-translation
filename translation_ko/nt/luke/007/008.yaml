revisions:
- from: 저도 권위 아래에 놓인 사람으로서 제 아래에 군사들을 두고 있습니다. 그래서 이 사람에게는 “가라” 하면 가고, 다른 사람에게는 “오라” 하면 오며, 제 노예에게는 “이것을 하라” 하면 그대로 합니다.[a]
  to: 저도 권위 아래에 있는 사람이며 제 아래에 군사들을 거느리고 있으므로, 이 사람에게 “가라” 하면 가고, 다른 사람에게 “오라” 하면 오며, 제 노예에게 “이것을 하라” 하면 그것을 합니다.[a]
  rationale: 근거를 나타내는 καὶ γάρ를 ‘…이므로’로 반영하고, τασσόμενος의 권위 체계 의미는 자연스러운 ‘권위 아래에 있는’으로, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας는 ‘군사들을 거느리고’로 옮겼습니다. 명령과 실행의 반복 구조 및 δοῦλος의 ‘노예’ 번역은 유지했으며, 마지막 동사는 불필요한 강화 없이 ‘그것을 합니다’로 바로 옮겼습니다. 각주의 그리스어 표기 오류도 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:06Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 권위의 위계와 세 부류의 명령-실행 병행을 대체로 충실히 보존합니다. 다만 καὶ γάρ의 설명·근거 관계를 ‘그래서’로 옮기면 앞 문장을 뒤 명령들의 결과처럼 연결하여 방향이 다소 바뀝니다. 또한 마지막 ‘그대로 합니다’는 순종의 뉘앙스를 조금 보태므로 목적어를 직접 되살리는 편이 더 가깝습니다.
  naturalness: ‘권위 아래에 놓인 사람’은 이해되지만 현대 표준어에서는 ‘권위 아래에 있는 사람’이 더 자연스럽습니다. ‘군사들을 두고 있습니다’보다 ‘군사들을 거느리고 있습니다’가 이 문맥의 지휘 관계를 자연스럽게 드러냅니다. 인용된 짧은 명령형 ‘가라/오라/하라’는 화자의 직접 명령으로 자연스럽고 합쇼체 본문과도 양립합니다.
  terminology: ἐξουσία는 ‘권위’, στρατιώτας는 ‘군사들’, δοῦλος는 ‘노예’로 유지할 수 있습니다. 각주에 그리스어를 뜻하는 ‘ελλην어’라는 표기는 오류이므로 ‘그리스어’로 고치고, 영어 POB의 대안 ‘servant’에 해당하는 일반적 한국어 대안으로 ‘하인’을 제시하는 것이 적절합니다. ‘종’도 문맥상 가능하나 한국어 성경 용례상 별도의 종교적 연상이 있어 각주의 유일한 일반어 대안으로는 덜 명료합니다.
  issues:
