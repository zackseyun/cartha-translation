id: LUK.7.8
reference: Luke 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my slave, ‘Do this,’ and he does it.
  footnotes:
  - marker: a
    text: Or 'servant' for 'slave' (Greek doulos). The term denotes a subordinate in a bonded or owned status, though in some contexts it can be rendered more generally as 'servant.'
    reason: alternative_reading
translation:
  language: ko
  text: 저도 권위 아래에 놓인 사람으로서 제 아래에 군사들을 두고 있습니다. 그래서 이 사람에게는 “가라” 하면 가고, 다른 사람에게는 “오라” 하면 오며, 제 노예에게는 “이것을 하라” 하면 그대로 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노예’는 ελλην어 δοῦλος의 예속 상태를 드러내는 번역입니다. 문맥에 따라 더 일반적인 ‘종’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  english_pob_choice: placed under authority
  chosen_korean: 권위 아래에 놓인
  alternatives_korean:
  - 권위 아래에 있는
  - 권위 아래에 배치된
  lexicon: BDAG
  rationale: τασσόμενος의 수동적 뉘앙스와 질서 안에 놓인 신분을 살리기 위해 단순한 ‘아래에 있는’보다 ‘놓인’을 택했습니다.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  english_pob_choice: with soldiers under me
  chosen_korean: 제 아래에 군사들을 두고 있습니다
  alternatives_korean:
  - 제 아래 군사들을 거느리고 있습니다
  - 제 지휘 아래 군사들을 두고 있습니다
  lexicon: BDAG
  rationale: ‘under me’의 위계 구조를 한국어 자연문으로 살리되, 군사적 지휘 관계를 분명히 하기 위해 ‘두고 있습니다’를 사용했습니다.
- source_word: τῷ δούλῳ μου
  english_pob_choice: to my slave
  chosen_korean: 제 노예에게
  alternatives_korean:
  - 제 종에게
  - 제 하인에게
  lexicon: BDAG
  rationale: POB의 ‘slave’ 선택을 따라 δοῦλος의 예속 상태를 드러냈습니다. 한국어 ‘노예’가 현대적으로 거칠게 들릴 수 있지만, 여기서는 사회적 종속성을 흐리지 않는 것이 우선입니다.
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  english_pob_choice: Go / Come / Do this
  chosen_korean: “가라” / “오라” / “이것을 하라”
  alternatives_korean:
  - “가십시오” / “오십시오” / “이것을 하십시오”
  - “가” / “와” / “이것을 해”
  lexicon: BDAG
  rationale: 직접 명령문으로서의 힘을 살리기 위해 인용문 안에서 명령형을 사용했습니다. 종에게 하는 말의 대비를 위해 말투를 굳이 완화하지 않았습니다.
- source_word: καὶ γὰρ ἐγώ
  english_pob_choice: For I too
  chosen_korean: 저도
  alternatives_korean:
  - 저 역시
  - 왜냐하면 저도
  lexicon: BDAG
  rationale: 설명적 연결과 강조를 함께 담는 간결한 대응으로 ‘저도’를 택했습니다.
theological_decisions:
- issue: δοῦλος의 한국어 표기에서 예속성과 현대 독자 수용성의 긴장
  chosen_reading: 제 노예에게
  alternative_readings:
  - 제 종에게
  - 제 하인에게
  rationale: 이 비유는 권위 구조를 예시하는 것이므로, bonded status를 약화시키는 완화 번역보다 원문의 사회적 현실을 드러내는 번역이 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος'
- issue: 직접 명령형의 말투
  chosen_reading: 인용문 안에서는 평서 체계와 구분되는 명령형을 유지했습니다.
  alternative_readings:
  - 모든 인용문을 합쇼체로 통일
  - 전반을 중립적 서술형으로 완화
  rationale: 본문은 주인의 명령과 즉각적 실행을 대조하므로, 명령의 즉시성과 위계를 희석하지 않는 것이 의미상 중요합니다.
  doctrine_reference: '번역 원칙: source-direct imperative force 보존'
