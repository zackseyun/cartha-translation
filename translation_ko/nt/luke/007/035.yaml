id: LUK.7.35
reference: Luke 7:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
  footnotes:
  - marker: a
    text: Or 'was justified' or 'was proved right.'
    reason: lexical_alternative
  - marker: b
    text: '''Children'' is a metaphor for those who show the truth of wisdom by their response or way of life.'
    reason: lexical_alternative
  - marker: c
    text: Matthew 11:19 reads, 'wisdom is vindicated by her works.'
    reason: cross_reference
translation:
  language: ko
  text: 그러나 지혜는 자기 자녀들 모두에 의해 옳다고 입증되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옳다고 입증되었습니다’는 ‘의롭다고 인정되었습니다’ 또는 ‘정당하다고 판명되었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자녀들’은 지혜를 드러내는 응답자들 또는 그 삶의 열매를 가리키는 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: 마태복음 11:19는 ‘지혜는 그 행위들로 옳다고 입증된다’고 읽습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδικαιώθη
  english_pob_choice: was vindicated
  chosen_korean: 옳다고 입증되었습니다
  alternatives_korean:
  - 정당하다고 판명되었습니다
  - 의롭다고 인정되었습니다
  - 변호되었습니다
  lexicon: BDAG
  rationale: δικαιόω의 수동형이 여기서는 바울서신의 법정적 ‘칭의’보다, 지혜가 옳았음이 드러나고 확인되는 뜻이므로 ‘옳다고 입증되다’가 가장 직접적입니다.
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜로움
  - 지혜의 사람
  lexicon: BDAG
  rationale: 소피아는 인격화된 추상명사이므로, 본문 이미지를 살려 ‘지혜’로 옮기는 것이 적절합니다.
- source_word: ἀπὸ πάντων τῶν τέκνων αὐτῆς
  english_pob_choice: by all her children
  chosen_korean: 자기 자녀들 모두에 의해
  alternatives_korean:
  - 자기 자녀들 모두로부터
  - 자기 자녀들 모두가
  - 자기 자녀들 모두를 통해
  lexicon: BDAG
  rationale: ἀπό는 수동태와 함께 행위 주체/근거를 나타낼 수 있어, ‘-에 의해’로 옮기면 수동적 관계와 검증의 의미가 자연스럽게 드러납니다. τέκνων은 기본어휘 의미를 따라 ‘자녀들’을 유지했습니다.
- source_word: αὐτῆς
  english_pob_choice: her
  chosen_korean: 자기
  alternatives_korean:
  - 그녀의
  - 그것의
  lexicon: BDAG
  rationale: 지혜의 문법적 여성성을 한국어의 인칭대명사로 직역하기보다, 인격화된 대상에 자연스러운 소유 표현인 ‘자기’를 써서 의미를 보존했습니다.
theological_decisions:
- issue: ‘지혜의 자녀들’의 비유성
  chosen_reading: 본문의 비유를 유지해 ‘자기 자녀들’로 직역하고, 그들이 지혜의 참됨을 드러내는 존재라는 해석을 본문 밖으로 넘깁니다.
  alternative_readings:
  - 지혜를 따르는 사람들
  - 지혜의 결과들
  - 지혜의 행위들로
  rationale: 누가 본문은 τέκνων(자녀들)을 사용하므로, 마태복음의 ‘행위들’로 조화시키지 않고 누가의 표현을 그대로 살려 해석적 평준화를 피합니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 해소하기보다 보존한다.'
