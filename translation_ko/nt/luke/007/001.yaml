translation:
  language: ko
  text: 그분이 백성의 귀에 들려 주신 모든 말씀을 마치셨을 때, 가버나움으로 들어가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘백성의 귀 안으로’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδὴ
  english_pob_choice: When
  chosen_korean: …을 때
  alternatives_korean:
  - 이후에
  - ~하자
  - ~한 뒤에
  lexicon: BDAG
  rationale: 여기서는 인과가 아니라 시간 순서를 여는 종속절이므로, 자연스러운 한국어로 ‘…을 때’를 택해 서술 흐름을 살렸습니다.
- source_word: ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ
  english_pob_choice: had finished all his words
  chosen_korean: 말씀을 마치셨을 때
  alternatives_korean:
  - 모든 말씀을 다하셨을 때
  - 말씀하신 것을 끝내셨을 때
  lexicon: BDAG
  rationale: ῥήματα는 단순한 ‘말들’보다 예수의 발화 내용을 가리키므로, 문맥상 자연한 ‘말씀’으로 옮기되 ‘마치셨다’로 완료 의미를 살렸습니다.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  english_pob_choice: in the hearing of the people
  chosen_korean: 백성의 귀에 들려
  alternatives_korean:
  - 백성 앞에서
  - 백성이 듣는 데서
  lexicon: BDAG
  rationale: 직역하면 ‘백성의 귀 안으로’라는 관용적 표현이므로, 청중이 실제로 들은 공개 발화라는 뉘앙스를 살려 자연스럽게 옮겼습니다.
- source_word: Καφαρναούμ
  english_pob_choice: Capernaum
  chosen_korean: 가버나움
  alternatives_korean:
  - 가파르나움
  - 카퍼나움
  lexicon: 표준 외래어 표기법
  rationale: 한국어 성경에서 널리 통용되는 지명 형태를 따랐습니다.
theological_decisions:
- issue: 주어의 지시 대상과 문체
  chosen_reading: 직전 문맥의 예수님을 가리키는 대명사는 ‘그분’으로 풀고, 서술은 현대적 공손체로 유지했습니다.
  alternative_readings:
  - ‘그가’
  - 주어를 생략한 평서형
  rationale: 한국어에서는 대명사 반복을 줄이는 것이 자연스럽고, 공적 성경 문체에서도 인물 지시가 분명해집니다.
  doctrine_reference: 서사 문체의 가독성과 문맥적 지시명료성
