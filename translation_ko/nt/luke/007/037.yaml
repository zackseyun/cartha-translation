id: LUK.7.37
reference: Luke 7:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
  footnotes:
  - marker: a
    text: Or 'a sinful woman.' The Greek says simply 'a sinner' and does not specify her particular sin.
    reason: lexical_alternative
  - marker: b
    text: That is, reclining in the customary posture for a formal meal.
    reason: cultural_note
  - marker: c
    text: Or 'an alabaster flask of ointment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오[a], 그 도시 안에 있던 한 여자가, 죄인이었는데, 그가 바리새인의 집에서 식사 자리에서 비스듬히 기대어 있다는 것을 알고 향유 한 옥합을 가져왔습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보라/보십시오’입니다. 장면 전환의 강조를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 고대 식사 관습에 따라 비스듬히 기대어 식사하는 자세를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘향유가 든 알라바스터 병’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 보십시오
  lexicon: BDAG
  rationale: 장면 전환의 주목 기능을 살리면서도 현대 한국어에서 자연스럽고 품위 있는 호소형으로 옮겼습니다.
- source_word: γυνὴ ἥτις ἦν ἐν τῇ πόλει
  english_pob_choice: a woman in the city, who was a sinner
  chosen_korean: 그 도시 안에 있던 한 여자
  alternatives_korean:
  - 그 도시에 있던 한 여자
  - 그 도시의 한 여자
  - 도시에 살던 한 여자
  lexicon: BDAG
  rationale: ἥτις ἦν ἐν τῇ πόλει의 위치 관계를 살리되, 영어 POB의 ‘in the city’ 판단을 따라 소속보다 현장성에 초점을 두었습니다.
- source_word: ἁμαρτωλός
  english_pob_choice: a sinner
  chosen_korean: 죄인이었는데
  alternatives_korean:
  - 죄인이었는데
  - 죄를 지은 여자였는데
  - 죄 많은 여자였는데
  lexicon: BDAG
  rationale: 그녀의 구체적 죄목을 밝히지 않는 단순 명사적 표현을 유지해, 전통적 추정보다 원문의 범위를 지켰습니다.
- source_word: ἐπιγνοῦσα ὅτι κατάκειται
  english_pob_choice: having learned that he was reclining at table
  chosen_korean: 그가 바리새인의 집에서 식사 자리에서 비스듬히 기대어 있다는 것을 알고
  alternatives_korean:
  - 그가 바리새인의 집에서 식사 자리에서 누워 있다는 것을 알고
  - 그가 바리새인의 집에서 식사하고 있다는 것을 알고
  - 그가 바리새인의 집에서 비스듬히 기대어 식사하고 있다는 것을 알고
  lexicon: BDAG
  rationale: κατάκειται의 식사 관습상 의미를 한국어 독자에게 분명히 전달하기 위해 ‘비스듬히 기대어’로 풀어 쓰되, 단순히 ‘식사하다’로 약화시키지 않았습니다.
- source_word: ἀλάβαστρον μύρου
  english_pob_choice: an alabaster jar of perfume
  chosen_korean: 향유 한 옥합
  alternatives_korean:
  - 향유가 든 옥합
  - 향유 한 알라바스터 병
  - 향유 한 옥병
  lexicon: BDAG
  rationale: ἀλάβαστρον의 용기 의미를 옥합으로 자연스럽게 옮기되, μύρου는 향유로 번역해 재료와 내용물을 함께 드러냈습니다.
theological_decisions:
- issue: 여자의 도덕적 규정
  chosen_reading: 죄인
  alternative_readings:
  - 음란한 여자
  - 죄 많은 여자
  - 창녀
  rationale: 원문은 ἁμαρτωλός만 말하고 죄의 종류를 특정하지 않으므로, 추정적·전통적 낙인을 피하고 원문이 허용하는 범위 안에서 번역했습니다.
  doctrine_reference: 원문 우선 원칙; 번역이 본문이 말하지 않는 세부를 덧씌우지 않음
- issue: κατάκειται의 문화적 배경
  chosen_reading: 식사 자리에서 비스듬히 기대어
  alternative_readings:
  - 앉아
  - 식사하고
  - 누워
  rationale: 고대 식사 자세를 현대 독자에게 전달하기 위해 문화적 설명을 본문 안에 최소한으로 반영했습니다. 이는 의미를 풀어 주는 주석적 번역이며 신학적 해석을 추가하지 않습니다.
  doctrine_reference: 문화적 관습의 가시화; 본문 의미 보존
