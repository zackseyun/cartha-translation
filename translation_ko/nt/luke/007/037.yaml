  terminology: ‘죄인’은 ἁμαρτωλός의 죄목을 특정하지 않는 명사적 성격을 잘 보존합니다. ‘향유가 든 옥합’은 ἀλάβαστρον μύρου의 용기와 내용물을 모두 드러내며, 각주의 ‘알라바스터 병’ 대안도 유효합니다. ‘바리새인’은 표준적인 명칭입니다.
