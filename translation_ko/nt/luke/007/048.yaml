translation:
  language: ko
  text: 예수님께서 그 여자에게 말씀하셨습니다. 「당신의 죄가 용서받았습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  english_pob_choice: he said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: BDAG
  rationale: 예수의 직접 발화를 공손하고 자연스럽게 옮기기 위해 ‘말씀하셨습니다’를 택했습니다. 일반 서술보다 화자 존중이 드러나지만, 과도하게 경건한 고어체는 피했습니다.
- source_word: δὲ
  english_pob_choice: Then
  chosen_korean: 그는
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: BDAG
  rationale: 이 절의 δέ는 강한 대조가 아니라 이야기 전개를 잇는 완만한 접속이므로, 한국어에서는 별도 접속어 없이 인칭 주어로 자연스럽게 넘겼습니다.
- source_word: Ἀφέωνταί
  english_pob_choice: are forgiven
  chosen_korean: 용서받았습니다
  alternatives_korean:
  - 용서됩니다
  - 이미 용서되었습니다
  lexicon: BDAG
  rationale: 완료 수동형의 현재 결과 상태를 한국어에서는 ‘용서받았습니다’로 가장 자연스럽게 살렸습니다. ‘용서됩니다’는 시제상 덜 적절하고, ‘이미 용서되었습니다’는 설명을 덧붙이는 느낌이 강합니다.
- source_word: ἁμαρτίαι
  english_pob_choice: sins
  chosen_korean: 죄
  alternatives_korean:
  - 죄들
  - 허물
  lexicon: BDAG
  rationale: 복수형이지만 한국어에서는 ‘죄들’보다 집합적 의미의 ‘죄’가 더 자연스럽고, 본문의 도덕적·신학적 의미를 잘 전달합니다.
theological_decisions:
- issue: Ἀφέωνταί의 완료 수동이 주는 완료된 행위와 현재 결과의 긴장
  chosen_reading: ‘용서받았습니다’로 선언의 현재 효력을 살리면서, 완료된 용서의 사실도 함축되게 했습니다.
  alternative_readings:
  - 용서되었습니다
  - 용서받아 있습니다
  rationale: 이 구절은 예수의 선언이 현재의 용서 상태를 선포하는 방식이므로, 결과 상태를 드러내는 자연스러운 한국어가 적합합니다. 동시에 완료 시제의 신학적 무게를 따로 풀어 설명하지 않고 유지합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
