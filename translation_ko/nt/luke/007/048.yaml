  naturalness: '''그는 그녀에게''는 현대 표준 한국어 성경 문체에서 번역투로 들립니다. 문맥상 지시 대상을 자연스럽게 밝혀 ''예수님께서 그 여자에게''로 옮기는 것이 적절합니다. ''당신의 죄가 용서받았습니다''는 합쇼체 직접 발화로 가능하며, 완료 수동의 결과 상태도 무리 없이 전달합니다.'
  terminology: '''죄''와 ''용서받았습니다''는 적절합니다. 복수 ἁμαρτίαι는 한국어에서 집합 명사 ''죄''로 자연스럽게 표현될 수 있습니다. ''말씀하셨습니다''도 예수의 발화에 쓰이는 현대 존대 서술로 적절합니다.'
