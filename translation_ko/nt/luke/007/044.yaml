  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
  footnotes:
  - marker: a
    text: Or, more formally, 'you gave me no water upon my feet.' The sense is the customary provision of water for foot washing.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 그 여자 쪽으로 몸을 돌리시고 시몬에게 말씀하셨습니다. “이 여자를 보십니까? 내가 당신의 집에 들어갔는데, 당신은 내 발에[a] 물도 주지 않았습니다. 그러나 이 여자는 내 발을 자기 눈물로 적시고 자기 머리카락으로 내 발을 닦았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 발 위에 물을 주지 않았다’입니다. 발 씻기를 위한 관습적 물 제공을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  english_pob_choice: turning toward the woman
  chosen_korean: 그 여자 쪽으로 몸을 돌리시고
  alternatives_korean:
  - 여자를 향해 돌아서시고
  - 그 여자에게 몸을 돌리시고
  lexicon: BDAG
  rationale: 분사 στραφεὶς의 물리적 방향 전환을 살리면서, 한국어에서는 '몸을 돌리다'가 자연스럽고 장면의 시선 이동도 드러냅니다.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  english_pob_choice: Do you see this woman?
  chosen_korean: 이 여자를 보십니까?
  alternatives_korean:
  - 이 여자를 아십니까?
  - 이 여자를 보느냐?
  lexicon: BDAG
  rationale: βλέπεις의 직접적인 시각적 질문을 유지했고, ταύτην의 지시성을 '이'로 반영했습니다.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  english_pob_choice: you gave me no water for my feet
  chosen_korean: 내 발에 물도 주지 않았습니다
  alternatives_korean:
  - 내 발을 씻을 물도 주지 않았습니다
  - 내 발 위에 물도 주지 않았습니다
  lexicon: BDAG
  rationale: 원문은 '물을 주다'를 말하므로 한국어도 그 구조를 살리되, 발 씻기 관습은 문맥상 자연스럽게 이해되도록 했습니다.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  english_pob_choice: wet my feet with her tears
  chosen_korean: 내 발에 자기 눈물을 적시고
  alternatives_korean:
  - 내 발을 자기 눈물로 적시고
  - 내 발에 눈물을 떨어뜨려 적시고
  lexicon: BDAG
  rationale: βρέχω의 '적시다/젖게 하다'를 살렸고, 여격적 '눈물'은 '자기 눈물'로 분명히 했습니다.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  english_pob_choice: wiped them with her hair
  chosen_korean: 자기 머리카락으로 그것을 닦았습니다
  alternatives_korean:
  - 자기 머리털로 그것을 닦아냈습니다
  - 자기 머리카락으로 내 발을 닦았습니다
  lexicon: BDAG
  rationale: ἐκμάσσω의 '닦아내다/닦다'를 반영했고, 대명사 '그것'은 앞의 '내 발'을 가리키게 하여 한국어 어순을 매끄럽게 했습니다.
theological_decisions:
- issue: 예수님의 직접 발화에서 존칭과 2인칭 표현
  chosen_reading: 시몬에게는 공손한 질문형과 서술형으로 옮기고, 직접 호칭은 '당신'으로 유지했습니다.
  alternative_readings:
