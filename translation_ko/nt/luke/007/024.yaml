base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
  footnotes:
  - marker: a
    text: Or 'to see' or 'to behold' for 'to look at.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요한의 사자들이 떠난 뒤에, 예수께서 무리에게 요한에 대하여 말씀하기 시작하셨습니다. "너희는 무엇을 보려고 광야에 나갔습니까? 바람에 흔들리는 갈대였습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보려고’는 여기의 θεάσασθαι가 단순히 보는 것보다 주의 깊게 살펴보는 뜻을 담을 수 있음을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλων
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
