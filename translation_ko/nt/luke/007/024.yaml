base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
  footnotes:
  - marker: a
    text: Or 'to see' or 'to behold' for 'to look at.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요한의 사자들이 떠난 뒤, 예수께서 무리에게 요한에 관하여 말씀하기 시작하셨습니다. “너희는 무엇을 보려고[a] 광야에 나갔습니까? 바람에 흔들리는 갈대였습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 깊게 바라보려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλων
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 메신저들
  - 전령들
  - 천사들
  lexicon: BDAG
  rationale: 문맥상 하늘 존재가 아니라 요한이 보낸 사람들을 가리키므로, 교회 전통어보다 인물 역할이 드러나는 ‘사자들’을 택했습니다.
- source_word: ἤρξατο λέγειν
  english_pob_choice: he began to speak
  chosen_korean: 말씀하기 시작하셨습니다
  alternatives_korean:
  - 말하기 시작하셨습니다
  - 말씀하기 시작했습니다
  lexicon: BDAG
  rationale: 군중을 향한 공개 발화를 자연스럽게 살리면서, 예수의 발화를 공손하고 현대적인 한국어로 옮겼습니다.
- source_word: πρὸς τοὺς ὄχλους
  english_pob_choice: to the crowds
  chosen_korean: 무리에게
  alternatives_korean:
  - 군중에게
  - 사람들에게
  lexicon: BDAG
  rationale: 복수형 ὄχλους의 집합성을 살리되, 한국어에서 자연스럽게 들리는 ‘무리에게’로 옮겼습니다.
- source_word: θεάσασθαι
  english_pob_choice: to look at
  chosen_korean: 보려고
  alternatives_korean:
  - 바라보려고
  - 구경하려고
  - 보았습니까
  lexicon: BDAG
  rationale: 단순 시각이 아니라 주목하여 살펴보는 뜻을 간결하게 살리기 위해 목적형 ‘보려고’를 택했습니다.
- source_word: κάλαμον ὑπὸ ἀνέμου σαλευόμενον
  english_pob_choice: A reed shaken by the wind
  chosen_korean: 바람에 흔들리는 갈대
  alternatives_korean:
  - 바람에 흔들리는 갈대 하나
  - 바람에 휘둘리는 갈대
  lexicon: BDAG
  rationale: 직유의 이미지를 유지하면서, 한국어에서 자연스러운 관용 표현으로 instability의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 예수의 수사적 질문이 전달하는 이미지의 유지
  chosen_reading: 주석적으로 풀지 않고 ‘바람에 흔들리는 갈대’라는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 흔들리는 사람입니까?
  - 우유부단한 사람입니까?
  rationale: 본문은 이미지를 제시하고 청중이 그 의미를 스스로 파악하게 하므로, 해석을 본문 안에서 풀어 버리지 않고 수사적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
