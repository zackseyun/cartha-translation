  lexicon: BDAG
  rationale: 복수형 ὄχλους의 집합성을 살리되, 한국어에서 자연스럽게 들리는 ‘무리에게’로 옮겼습니다.
- source_word: θεάσασθαι
  english_pob_choice: to look at
  chosen_korean: 보려고
  alternatives_korean:
