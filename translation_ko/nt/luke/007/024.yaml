  lexicon: BDAG
  rationale: 직유의 이미지를 유지하면서, 한국어에서 자연스러운 관용 표현으로 instability의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 예수의 수사적 질문이 전달하는 이미지의 유지
  chosen_reading: 주석적으로 풀지 않고 ‘바람에 흔들리는 갈대’라는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 흔들리는 사람입니까?
  - 우유부단한 사람입니까?
  rationale: 본문은 이미지를 제시하고 청중이 그 의미를 스스로 파악하게 하므로, 해석을 본문 안에서 풀어 버리지 않고 수사적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
