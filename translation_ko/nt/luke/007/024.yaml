  - 전령들
  - 천사들
  lexicon: BDAG
  rationale: 문맥상 하늘 존재가 아니라 요한이 보낸 사람들을 가리키므로, 교회 전통어보다 인물 역할이 드러나는 ‘사자들’을 택했습니다.
- source_word: ἤρξατο λέγειν
