id: LUK.7.40
reference: Luke 7:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
  footnotes:
  - marker: a
    text: Or “Master, speak.” The Greek Διδάσκαλε is more literally “Teacher,” and εἰπέ is simply “say” or “speak.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 그에게 말씀하셨습니다. 「시몬아, 내가 네게 할 말이 하나 있습니다.」 그가 말했습니다. 「선생님, 말씀하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Διδάσκαλε는 문자적으로는 ‘선생님’이지만, 문맥에 따라 ‘스승님’ 또는 ‘주인님’으로도 이해될 수 있습니다. εἰπέ는 단순히 ‘말하다/말씀하다’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτόν
  english_pob_choice: answered and said to him
  chosen_korean: 대답하여 그에게 말씀하셨습니다
  alternatives_korean:
  - 대답하여 그에게 말했습니다
  - 대답하여 그에게 이르셨습니다
  lexicon: SBLGNT; BDAG
  rationale: ἀποκριθεὶς와 εἶπεν의 결합을 한국어에서도 자연스럽게 살리되, 예수께 대한 직접 대화에서는 문체상 ‘말씀하셨습니다’가 가장 무난합니다.
- source_word: ἔχω σοί τι εἰπεῖν
  english_pob_choice: I have something to say to you
  chosen_korean: 내가 네게 할 말이 하나 있습니다
  alternatives_korean:
  - 네게 말할 것이 하나 있습니다
  - 너에게 할 말이 있습니다
  lexicon: BDAG
  rationale: 소유 동사 ἔχω와 부정대명사 τι를 반영해 ‘할 말이 하나 있습니다’로 옮겨, 단순한 ‘말할 것이 있습니다’보다 원문의 담화 시작감을 살렸습니다.
- source_word: Διδάσκαλε
  english_pob_choice: Teacher
  chosen_korean: 선생님
  alternatives_korean:
  - 선생님이시여
  - 스승님
  lexicon: BDAG
  rationale: διδάσκαλε의 기본 의미는 ‘교사/선생’이므로, 한국어에서는 공손하고 직접적인 ‘선생님’이 가장 자연스럽습니다. ‘스승님’은 관계 뉘앙스를 더 강하게 만들 수 있습니다.
- source_word: εἰπέ
  english_pob_choice: say it
  chosen_korean: 말씀하십시오
  alternatives_korean:
  - 말하십시오
  - 이르십시오
  lexicon: BDAG
  rationale: 명령형 εἰπέ를 한국어 공손 명령으로 옮겼습니다. 직접적으로 ‘말씀하십시오’라고 하면 요청의 정중함을 보존하면서도 본문 흐름에 자연스럽습니다.
- source_word: φησίν
  english_pob_choice: he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 말하였습니다
  - 그가 이르렀습니다
  lexicon: BDAG
  rationale: 역사적 현재 φησίν을 한국어 서술에서는 과거형으로 처리하는 것이 자연스럽습니다.
theological_decisions:
- issue: 예수의 발화 표지와 공손도
  chosen_reading: 예수의 발화를 ‘말씀하셨습니다’로, 제자의 요청을 ‘말씀하십시오’로 옮겨 공손한 합쇼체를 유지했습니다.
  alternative_readings:
  - 예수께서 ... 말하셨습니다 / 선생님, 말하십시오
  rationale: 본문은 예수와 상대방의 대화 장면이므로, 한국어에서는 동일한 높임 체계를 일관되게 적용하는 것이 독자의 이해에 유익합니다.
  doctrine_reference: 복음서 서술의 화용론과 예수에 대한 공손한 한국어 관용
