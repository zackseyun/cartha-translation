id: LUK.7.29
reference: Luke 7:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
  footnotes:
  - marker: a
    text: Or more formally, 'justified God.' The sense is that they acknowledged that God was in the right.
    reason: lexical_alternative
  - marker: b
    text: 'The participle may also be understood causally: ''because they had been baptized with John''s baptism.'''
    reason: alternative_reading
translation:
  language: ko
  text: 모든 백성이 이 말을 듣고, 세리들까지도 하느님이 의로우시다고 인정하였으니, 요한의 세례를 받았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하느님이 의로우시다고 인정하다’는 직역보다 자연스러운 표현입니다. 원문은 하나님을 옳다고 시인하는 뜻이지, 하나님을 새로 의롭게 만든다는 뜻이 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 이 분사는 원인으로도 읽을 수 있지만, 본문은 그 가능성을 열어 둔 채 배경/상황으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 사람들
  - 온 백성
  lexicon: BDAG
  rationale: 집합적 표현을 자연스러운 한국어 집합명사로 옮겼습니다. ‘백성’은 문맥상 군중 전체를 가리키는 데 적절하며, ‘모든’으로 포괄성을 살렸습니다.
- source_word: ἀκούσας
  english_pob_choice: when they heard this
  chosen_korean: 이 말을 듣고
  alternatives_korean:
  - 그것을 듣고
  - 이것을 들은 뒤
  lexicon: BDAG
  rationale: 문맥상 앞선 요한의 선포를 가리키므로 지시대명사를 과도하게 풀지 않고 ‘이 말’로 자연스럽게 처리했습니다.
- source_word: τελῶναι
  english_pob_choice: tax collectors
  chosen_korean: 세리들
  alternatives_korean:
  - 세금 징수원들
  - 조세 징수인들
  lexicon: BDAG
  rationale: 신약에서 확립된 직업명으로 ‘세리’가 가장 직관적이고 본문 흐름에도 맞습니다.
- source_word: ἐδικαίωσαν τὸν θεόν
  english_pob_choice: declared God to be righteous
  chosen_korean: 하느님이 의로우시다고 인정하였으니
  alternatives_korean:
  - 하느님을 의롭다 하였으니
  - 하느님을 의롭다고 선언하였으니
  - 하느님을 옳다고 하였으니
  lexicon: BDAG
  rationale: δικαιόω의 법정적 뉘앙스를 살리되, ‘하느님을 의롭다 하다’가 한국어에서 오해를 낳을 수 있어 ‘의로우시다고 인정하다’로 옮겼습니다. 여기서는 하나님을 인간이 바꾸는 것이 아니라, 하나님이 옳으심을 시인하는 뜻입니다.
- source_word: βαπτισθέντες τὸ βάπτισμα Ἰωάννου
  english_pob_choice: having been baptized with John's baptism
  chosen_korean: 요한의 세례를 받았기 때문입니다
  alternatives_korean:
  - 요한의 세례를 받은 채
  - 요한의 세례를 받아서
  lexicon: BDAG
  rationale: 영어 POB가 허용한 인과적 가능성을 한국어 본문에서는 더 자연스러운 이유절로 드러냈습니다. 다만 원문의 분사 의미를 지나치게 좁히지 않도록 ‘기 때문입니다’로 완화했습니다.
theological_decisions:
- issue: ἐδικαίωσαν τὸν θεόν의 신학적 중의성
  chosen_reading: 사람들이 하느님을 ‘의로우시다’고 인정한 것으로 번역했습니다.
  alternative_readings:
  - ‘하느님을 의롭다 하였다’처럼 더 직역할 수 있습니다.
  - ‘하느님이 옳으심을 인정하였다’로 풀 수 있습니다.
  rationale: 원문은 하나님을 변화시키는 행위가 아니라, 하나님 편이 옳다는 인간의 응답을 말합니다. 한국어에서 ‘의롭다 하다’가 어색하거나 오해를 부를 수 있어, 법정적 의미를 유지하면서도 의미가 분명한 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve source meaning in readable modern Korean; do not imply humans confer righteousness on God.'
- issue: βαπτισθέντες 분사의 관계
  chosen_reading: 세례를 받은 사실을 이유로 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - 단순한 동시상황/배경으로 ‘세례를 받은 상태에서’라고 옮길 수 있습니다.
  - 명시적으로 인과를 약하게 드러내지 않고 ‘세례를 받으면서’로 처리할 수 있습니다.
  rationale: 그리스어 분사는 문맥상 원인이나 배경을 모두 가능하게 하므로, 본문은 한쪽으로 과도하게 확정하지 않으면서도 자연스러운 한국어 독해를 제공합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than over-resolve syntax.'
