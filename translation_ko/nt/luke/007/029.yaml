  rationale: 원문의 병렬 구조를 ‘모든 백성과 세리들’로 옮기고, ‘하느님을 의롭다 하다’의 뜻을 자연스러운 한국어로 명확히 했습니다. 세례를 가리키는 분사는 ‘사람들로서’로 처리하여 가능한 인과적 이해를 본문에서 확정하지 않았으며, 각주 표지도 설명 대상에 맞게 배치했습니다.
