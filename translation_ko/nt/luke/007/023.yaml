translation:
  language: ko
  text: 나 때문에 걸려 넘어지지 않는 사람은 복이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나 때문에 불쾌하게 여기지 않는 사람’ 또는 ‘나 때문에 믿음에서 떠나지 않는 사람’
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριός
  english_pob_choice: blessed
  chosen_korean: 복된
  alternatives_korean:
  - 복이 있는
  - 행복한
  lexicon: BDAG
  rationale: 예수님의 말씀에서 μακάριός의 종교적·언약적 무게를 살리기 위해, 일상적 정서에 머물기 쉬운 ‘행복한’보다 ‘복된’을 택했습니다.
- source_word: ὃς
  english_pob_choice: the one who
  chosen_korean: 사람은
  alternatives_korean:
  - 그는
  - 누구든지
  lexicon: BDAG
  rationale: 단수의 대표성을 현대 한국어로 자연스럽게 드러내기 위해 ‘사람은’으로 옮겼습니다.
- source_word: σκανδαλισθῇ
  english_pob_choice: is not caused to stumble
  chosen_korean: 걸려 넘어지지 않는
  alternatives_korean:
  - 실족하지 않는
  - 넘어지게 되지 않는
  - 걸려들어 넘어지지 않는
  lexicon: BDAG
  rationale: 수동태의 뉘앙스를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘걸려 넘어지다’를 사용해, 예수님을 향한 걸림과 실족의 이미지를 보존했습니다.
- source_word: ἐν ἐμοί
  english_pob_choice: by me
  chosen_korean: 나로 말미암아
  alternatives_korean:
  - 내 안에서
  - 내 때문에
  - 내로 인하여
  lexicon: BDAG
  rationale: 관용적으로 원인·계기를 나타내는 용법을 반영하여, 예수님 자신이 걸림의 원인이 된다는 뜻을 분명하게 하기 위해 ‘나로 말미암아’를 택했습니다.
theological_decisions:
- issue: 예수님에 대한 ‘걸림’과 ‘실족’의 의미를 얼마나 직접적으로 드러낼지
  chosen_reading: 단순한 감정적 ‘불쾌감’으로 약화하지 않고, 예수님 때문에 실제로 걸려 넘어지는 이미지로 유지했습니다.
  alternative_readings:
  - 예수님에게 offended 되는 사람
  - 예수님 때문에 떠나지 않는 사람
  rationale: 본문은 예수님을 받아들이는 데서 생기는 신앙적 걸림을 경고하므로, 의미를 완화하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
