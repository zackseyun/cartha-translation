id: LUK.7.32
reference: Luke 7:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
  footnotes:
  - marker: a
    text: Or, more traditionally, 'We piped for you.' The Greek verb specifically refers to playing a flute or pipe.
    reason: lexical_alternative
  - marker: b
    text: Or 'we sang a dirge' / 'we mourned.' The Greek can denote lamenting, including a funeral lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 시장에 앉아 서로에게 부르짖는 아이들과 같습니다. 곧, 「우리가 너희를 위해 피리를 불었으나 너희는 춤추지 않았고, 우리가 애가를 불렀으나 너희는 울지 않았다」라는 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '피리를 불다'입니다. 전통적으로는 '피리를 불었다'로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: θρηνέω는 '애가를 부르다', '곡하다', '애도하다'의 뜻을 가질 수 있습니다. 여기서는 놀이 장면의 대조를 살려 '애가를 불렀다'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  english_pob_choice: They are like
  chosen_korean: ~들과 같습니다
  alternatives_korean:
  - ~와 비슷합니다
  - ~와 같습니다
  lexicon: BDAG
  rationale: 비유를 여는 표준 비교 표현이므로, 자연스러운 현대 한국어의 '같습니다'로 옮기되 비교 대상이 분명하게 드러나도록 했습니다.
- source_word: παιδίοις
  english_pob_choice: children
  chosen_korean: 아이들
  alternatives_korean:
  - 어린아이들
  - 어린이들
  lexicon: BDAG
  rationale: 문맥이 어린아이들의 놀이 장면이므로 '아이들'이 가장 자연스럽고, 지나치게 연령을 좁히지 않습니다.
- source_word: ἐν ἀγορᾷ καθημένοις
  english_pob_choice: sitting in the marketplace
  chosen_korean: 시장에 앉아
  alternatives_korean:
  - 장터에 앉아
  - 시장터에 앉아
  lexicon: BDAG
  rationale: ἀγορά는 공적인 시장/장터를 가리키므로 '시장'을 택했고, '앉아'는 진행 중인 장면을 간명하게 살립니다.
- source_word: προσφωνοῦσιν ἀλλήλοις
  english_pob_choice: calling to one another
  chosen_korean: 서로에게 부르짖는
  alternatives_korean:
  - 서로를 부르는
  - 서로에게 외치는
  lexicon: BDAG
  rationale: 아이들이 서로에게 외쳐 대는 장면을 살리면서도, 뒤따르는 직접 인용을 자연스럽게 이끄는 동사로 옮겼습니다.
- source_word: Ηὐλήσαμεν
  english_pob_choice: We played the flute for you
  chosen_korean: 우리가 너희를 위해 피리를 불었으나
  alternatives_korean:
  - 우리가 너희를 위해 나팔을 불었으나
  - 우리가 너희를 위해 피리 소리를 냈으나
  lexicon: BDAG
  rationale: 동사가 특정 악기 연주를 뜻하므로, 전통적이지만 모호할 수 있는 표현보다 '피리를 불다'로 구체화했습니다.
- source_word: ἐθρηνήσαμεν
  english_pob_choice: we sang a lament
  chosen_korean: 우리가 애가를 불렀으나
  alternatives_korean:
  - 우리가 곡을 했으나
  - 우리가 슬퍼하며 울부짖었으나
  lexicon: BDAG
  rationale: θρηνέω는 애도/곡조의 노래를 가리킬 수 있으므로, 앞의 '피리'와 대응되는 수행적 이미지가 살아나도록 '애가를 불렀다'로 옮겼습니다.
- source_word: ὠρχήσασθε / ἐκλαύσατε
  english_pob_choice: you did not dance / you did not weep
  chosen_korean: 너희는 춤추지 않았고 ... 너희는 울지 않았다
  alternatives_korean:
  - 너희는 춤을 추지 않았고 ... 너희는 눈물을 흘리지 않았다
  - 너희는 춤추지 않았고 ... 너희는 곡하지 않았다
  lexicon: BDAG
  rationale: 대조 구조를 평이하게 살리기 위해 직설적 과거 부정을 사용했고, '울지 않았다'로 κλαίω의 기본 의미를 유지했습니다.
theological_decisions:
- issue: 비유의 해석을 미리 정리하지 않고 장면의 긴장을 보존하는 번역
  chosen_reading: 구체적 놀이·애도 행위를 그대로 옮겨, 예수의 적용이 아닌 비유 자체의 대조를 드러냈습니다.
  alternative_readings:
  - '''즐거워하지 않았다 / 슬퍼하지 않았다''처럼 풀이 중심으로 옮김'
  - 상징적 의미를 덧붙여 해석적으로 번역
  rationale: 본문은 설명이 아니라 비유를 제시하므로, 과잉 해석을 피하고 원문의 대비가 청중에게 그대로 전달되도록 했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
