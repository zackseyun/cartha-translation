revisions:
- from: 그들은 시장에 앉아 서로에게 부르짖는 아이들과 같습니다. 곧, 「우리가 너희를 위해 피리를 불었으나 너희는 춤추지 않았고, 우리가 애가를 불렀으나 너희는 울지 않았다」라는 말입니다.[a][b]
  to: 그들은 장터에 앉아 서로에게 외치는 아이들과 같습니다. 아이들이 이렇게 말합니다. 「우리가 너희에게 피리를 불었는데[a] 너희는 춤추지 않았고, 우리가 애가를 불렀는데[b] 너희는 울지 않았다.」
  rationale: 직접 인용을 도입하는 원문의 문장 구조를 보존하고, 여격의 의미를 더 정확히 반영하며, 과도한 정서적 뉘앙스를 줄였습니다. 각주도 본문을 반복하지 않고 관련 어휘의 번역 선택지를 설명하도록 고쳤습니다.
