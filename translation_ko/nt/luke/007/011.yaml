id: LUK.7.11
reference: Luke 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
  footnotes:
  - marker: a
    text: Some manuscripts read 'soon afterward' instead of 'on the next day.'
    reason: textual_variant
translation:
  language: ko
  text: 그 이튿날[a], 예수께서 나인이라는 마을로 가셨습니다. 제자들과 큰 무리가 예수님과 함께 가고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘그 이튿날’ 대신 ‘곧 그 뒤에’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἑξῆς
  english_pob_choice: it happened on the next day
  chosen_korean: 그 일은 다음 날에 일어났습니다
  alternatives_korean:
  - 다음 날에 그런 일이 있었습니다
  - 그 일이 다음 날에 있었습니다
  lexicon: BDAG
  rationale: 누가복음의 사건 도입 공식은 한국어에서 자연스러운 서술형으로 옮기되, 시간표현 ‘다음 날’을 분명히 살렸습니다.
- source_word: ἐπορεύθη
  english_pob_choice: he went
  chosen_korean: 가셨습니다
  alternatives_korean:
  - 가셨다
  - 이동하셨습니다
  lexicon: BDAG
  rationale: 단순한 이동을 나타내는 동사를 자연스러운 서사체로 옮겼고, 예수님을 지칭하므로 높임을 반영했습니다.
- source_word: πόλιν καλουμένην Ναΐν
  english_pob_choice: into a town called Nain
  chosen_korean: 나인이라는 마을로
  alternatives_korean:
  - 나인이라는 성읍으로
  - 나인이라는 도시로
  lexicon: BDAG
  rationale: πόλις는 문맥상 큰 도시보다 작은 정착지에 가까워 보이므로 ‘마을’로 옮겼고, καλουμένην은 ‘~이라는’으로 간결하게 처리했습니다.
- source_word: ὄχλος πολύς
  english_pob_choice: a large crowd
  chosen_korean: 큰 무리
  alternatives_korean:
  - 많은 군중
  - 큰 군중
  lexicon: BDAG
  rationale: ὄχλος는 단순한 인원 수보다 함께 모여 움직이는 집단을 가리키므로, 한국어 성경에서 자연스러운 ‘무리’를 택했습니다.
theological_decisions:
- issue: 예수에 대한 높임 표현
  chosen_reading: 서술에서는 평서형을 쓰되, 예수님의 행위 동사는 높임말로 처리했습니다.
  alternative_readings:
  - 전부 평서형으로 옮김
  - 직접화법처럼 더 강한 존칭 사용
  rationale: 한국어 합쇼체 서사에서 인물 고유의 존칭을 유지하는 것이 자연스럽고, 원문의 예수 중심 서술을 흐리지 않습니다.
  doctrine_reference: 복음서 서술의 화자 존중 및 한국어 경어 규범
