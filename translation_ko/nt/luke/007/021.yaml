id: LUK.7.21
reference: Luke 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
  footnotes:
  - marker: a
    text: Or 'In that very hour.' The Greek expression can emphasize the immediacy of the moment.
    reason: lexical_alternative
  - marker: b
    text: Or 'scourges' or 'plagues' for 'afflictions'; the Greek term can refer literally to lashes or, by extension, severe bodily suffering.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'he granted to see.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 시각에 예수께서 많은 사람을 질병과 고난과 악한 영들로부터 고치셨고, 많은 눈먼 사람에게는 보게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 바로 그 시각에”. 이 표현은 순간의 긴급성과 즉시성을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “채찍”, “재앙”. μαστίγων은 문자적으로는 채찍이지만, 여기서는 심한 고통이나 질병을 가리키는 비유로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “보도록 허락하셨다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ
  english_pob_choice: In that hour
  chosen_korean: 그때 그 시각에
  alternatives_korean:
  - 그 시간에
  - 바로 그 시각에
  lexicon: SBLGNT / BDAG
  rationale: ἐκείνῃ τῇ ὥρᾳ의 시간 강조를 살리되, 한국어에서 자연스러운 문맥 표현으로 옮겼습니다.
- source_word: ἐθεράπευσεν
  english_pob_choice: he healed
  chosen_korean: 고치셨고
  alternatives_korean:
  - 치유하셨고
  - 낫게 하셨고
  lexicon: BDAG
  rationale: 치료 행위의 일반적 의미를 살리면서 복음서 문맥에 자연스럽고 읽기 쉬운 동사를 택했습니다.
- source_word: ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν
  english_pob_choice: from diseases and afflictions and evil spirits
  chosen_korean: 질병과 고난과 악한 영들로부터
  alternatives_korean:
  - 질병과 채찍과 악한 영들로부터
  - 질병과 재앙과 악한 영들로부터
  lexicon: BDAG
  rationale: ἀπό의 분리 의미를 '...로부터'로 살리고, νόσοι/μάστιγες/πνεύματα πονηρά를 각각 질병, 고난, 악한 영들로 옮겼습니다. μαστίγων은 문자적 '채찍'보다 치료 문맥의 비유적 의미를 살렸습니다.
- source_word: τυφλοῖς πολλοῖς
  english_pob_choice: to many blind people
  chosen_korean: 많은 눈먼 사람에게는
  alternatives_korean:
  - 많은 맹인에게는
  - 많은 보지 못하는 사람에게는
  lexicon: BDAG
  rationale: 수혜 대상을 분명히 하면서 성별을 불필요하게 한정하지 않는 표현으로 옮겼습니다.
- source_word: ἐχαρίσατο βλέπειν
  english_pob_choice: he granted sight
  chosen_korean: 보게 하셨습니다
  alternatives_korean:
  - 볼 수 있게 하셨습니다
  - 시력을 허락하셨습니다
  lexicon: BDAG
  rationale: χαρίζομαι의 '값없이/은혜롭게 주다'의 뉘앙스를 살리되, 한국어에서는 '보게 하셨습니다'가 가장 자연스럽습니다.
theological_decisions:
- issue: πνευμάτων πονηρῶν을 질병의 은유로 약화할지 여부
  chosen_reading: 예수께서 악한 영들에 대한 권위를 행사하신 것으로 그대로 옮겼습니다.
  alternative_readings:
  - 정신적·육체적 질환을 가리키는 비인격적 표현으로 완화하기
  rationale: 본문의 직설적 표현을 유지해 영적 실재를 약화하지 않았습니다.
  doctrine_reference: 성경 본문 직역 원칙 / 복음서의 귀신 축출 묘사
