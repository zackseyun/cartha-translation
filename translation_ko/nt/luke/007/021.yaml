    issue: 시간 표현의 중복
    rationale: ‘그때 그 시각에’는 같은 시간 지시를 겹쳐 표현하여 자연스럽지 않습니다. ἐν ἐκείνῃ τῇ ὥρᾳ는 ‘그 시각에’로 충분히 옮길 수 있습니다.
  - severity: medium
    issue: ‘악한 영들로부터 고치셨고’의 부자연스러운 결합
    rationale: 한국어에서 사람을 ‘악한 영들로부터 고치다’라고 하면 치료 대상과 해방 대상의 관계가 어색합니다. 원문의 병렬을 유지하면서 ‘악한 영들에게 시달리던’으로 풀어 주는 것이 자연스럽습니다.
  - severity: low
    issue: 각주 표지의 위치와 각주 a의 표현
    rationale: 각주 표지가 문장 끝에 한데 붙어 있어 해당 어구를 바로 가리키지 않습니다. 또한 ‘그 바로 그 시각에’는 한국어로 어색하므로 ‘바로 그 시각에’로 고칩니다.
