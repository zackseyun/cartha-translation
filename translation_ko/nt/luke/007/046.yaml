    rationale: 각주는 ἐλαίῳ(기름)의 대안 번역을 설명하므로 해당 단어 바로 뒤에 두는 편이 정확합니다. 또한 ‘향유/연고’는 μύρῳ에 해당하므로 ἐλαίῳ의 각주 대안으로 제시하지 않는 것이 좋습니다.
