  source_fidelity: 원문의 대조(당신은 머리에 기름을 바르지 않았으나, 이 여인은 발에 향유를 발랐습니다)를 충실히 반영합니다. 다만 초안의 ‘부어 주다/부었다’는 ἀλείφω의 기본 뜻인 ‘바르다, 기름을 바르다’보다 행위 방식을 불필요하게 구체화합니다.
