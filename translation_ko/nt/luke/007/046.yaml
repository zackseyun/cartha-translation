  to: 당신은 내 머리에 기름[a]을 바르지 않으셨습니다. 그러나 이 여인은 내 발에 향유를 발랐습니다.
  rationale: ‘붓다’를 원문의 일반적 의미인 ‘바르다’로 바로잡아 ἀλείφω의 반복을 보존했습니다. ἐλαίῳ와 μύρῳ의 물질적 대비는 각각 ‘기름’과 ‘향유’로 유지했습니다. 각주는 ἐλαίῳ에 직접 연결하고 그 단어에만 해당하는 대안인 ‘올리브기름’을 제시했습니다.
