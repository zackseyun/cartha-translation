base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
  footnotes:
  - marker: a
    text: Or 'with fragrant oil' or 'with ointment' for 'with perfume.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 내 머리에 기름을 부어 주지 않으셨습니다. 그러나 이 여인은 내 발에 향유를 부었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기름’은 일반적인 의미를 살린 번역입니다. 문맥상 ‘향기로운 기름’이나 ‘향유/연고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  english_pob_choice: with oil
  chosen_korean: 기름으로
  alternatives_korean:
  - 올리브기름으로
  - 향기로운 기름으로
  lexicon: BDAG
  rationale: 여기서는 접대의 관습적 행위를 가리키므로, 일반적인 ‘기름’이 원문의 의미를 충분히 전달합니다.
- source_word: ἤλειψας / ἤλειψεν
  english_pob_choice: anoint / has anointed
  chosen_korean: 부어 주지 않으셨습니다 / 부었습니다
  alternatives_korean:
  - 바르지 않으셨습니다 / 발랐습니다
  - 문지르지 않으셨습니다 / 문질렀습니다
  lexicon: BDAG
  rationale: ἀλείφω는 기름이나 향유를 바르는/붓는 행위를 뜻하므로, 한국어에서는 자연스럽게 ‘부어 주다’로 옮기되, 대조가 분명하게 드러나도록 했습니다.
- source_word: αὕτη δὲ
  english_pob_choice: but she
  chosen_korean: 그러나 이 여인은
  alternatives_korean:
  - 하지만 그녀는
  - 그런데 이 여자는
  lexicon: BDAG
  rationale: 지시대명사의 강조를 살리면서도, 바로 앞의 ‘당신’과의 대비가 분명한 한국어 표현으로 옮겼습니다.
- source_word: μύρῳ
  english_pob_choice: with perfume
  chosen_korean: 향유를
  alternatives_korean:
  - 향기로운 기름을
  - 향료를
  lexicon: BDAG
  rationale: μύρον은 향을 낸 기름/향유를 가리키므로, 교회 전통어이면서도 원문의 물질적 의미를 살릴 수 있는 ‘향유’가 적절합니다.
theological_decisions:
- issue: 접대의 결핍과 여인의 과잉된 존중을 어떻게 드러낼 것인가
  chosen_reading: 제의적·성례적 의미를 덧씌우지 않고, 손님 대접의 결핍과 여인의 더 큰 존경을 सीधे 드러내는 표현을 택했습니다.
  alternative_readings:
  - 의식적 기름부음처럼 들리게 하는 표현
  - 그리스도론적 상징을 과도하게 부각하는 표현
  rationale: 문맥상 예수께서 시몬의 환대를 대조해 말씀하시는 장면이므로, 번역은 사회적 존대 행위의 대비를 선명하게 보여 주어야 합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
