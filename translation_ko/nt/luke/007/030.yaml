source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
  footnotes:
  - marker: a
    text: Or 'God's counsel against themselves' or 'God's plan concerning themselves.'
    reason: alternative_reading
  - marker: b
    text: That is, by John the Baptist.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 바리새파 사람들과 율법 교사들은 하나님의 뜻을 자기들에게 대하여 거절하였으니, 그에게서 세례를 받지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 세례 요한입니다.
    reason: cross_reference
lexical_decisions:
- source_word: Φαρισαῖοι
  english_pob_choice: Pharisees
  chosen_korean: 바리새파 사람들
  alternatives_korean:
  - 바리새인들
  - 바리새파
  lexicon: BDAG
  rationale: 집단명을 자연스럽게 풀어 표준어 문맥에 맞추되, 특정 종교직함보다 바리새파라는 운동·집단성을 살렸습니다.
- source_word: νομικοὶ
  english_pob_choice: lawyers
  chosen_korean: 율법 교사들
  alternatives_korean:
  - 율법 전문가들
  - 서기관들
  lexicon: BDAG
  rationale: νομικός는 모세 율법에 능한 사람을 가리키므로, 현대적 직역인 '법률가'보다 성경적 맥락이 분명한 '율법 교사들'을 택했습니다.
- source_word: βουλὴν τοῦ θεοῦ
  english_pob_choice: God's purpose
  chosen_korean: 하나님의 뜻
  alternatives_korean:
  - 하나님의 목적
  - 하나님의 계획
  - 하나님의 의도
  lexicon: BDAG
  rationale: βουλή는 목적·계획·뜻의 범위를 가지며, 여기서는 하나님이 그들에게 향해 가지신 의도와 뜻을 자연스럽게 드러내는 '뜻'이 가장 무난합니다.
- source_word: εἰς ἑαυτούς
  english_pob_choice: for themselves
  chosen_korean: 자기들에게 대하여
  alternatives_korean:
  - 자기들을 향하여
  - 자기들을 위해
  - 자기들에게
  lexicon: BDAG
  rationale: 이 표현은 하나님 뜻의 대상이 그들 자신임을 가리키므로, '대하여'를 넣어 원문의 방향성을 살리면서도 'against themselves'처럼 해석을 고정하지 않도록 했습니다.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  english_pob_choice: not having been baptized by him
  chosen_korean: 그에게서 세례를 받지 않았기 때문입니다
  alternatives_korean:
  - 그에게 세례를 받지 않은 채
  - 그에게서 세례를 받지 못했기 때문입니다
  lexicon: BDAG
  rationale: 분사구를 한국어 원인절로 풀어 읽기 쉽게 하되, 요한을 명시하지 않고 대명사 '그'를 유지해 원문 정보를 보존했습니다.
theological_decisions:
- issue: εἰς ἑαυτούς의 해석 범위
  chosen_reading: 하나님의 뜻을 자기들에게 대하여 거절하였으니
  alternative_readings:
  - 하나님의 뜻을 자기들을 향한 뜻으로 거절하였으니
  - 하나님의 뜻을 자기들에게 대하여 무효화하였으니
  rationale: 이 구절은 하나님의 뜻이 그들에게 관련되어 있었음을 말하지만, 그 뜻을 '그들에게 반대되는 것'으로 단정하지는 않으므로 긴장을 유지하는 번역을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
