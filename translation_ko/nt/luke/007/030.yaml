  to: 그러나 바리새인들과 율법 전문가들은 그에게서[a] 세례를 받지 않은 채, 자기들에 관한 하나님의 뜻을 거절했습니다.
  rationale: 인과를 명시한 절을 원문의 분사 구조에 상응하는 ‘~받지 않은 채’로 고쳐 의미 관계를 열어 두었습니다. εἰς ἑαυτούς는 자연스러운 한국어인 ‘자기들에 관한’으로 옮겼고, 각주 표지를 대명사 ‘그’의 해당 표현에 붙였습니다. ‘율법 전문가들’은 νομικοί의 전문성은 드러내되 ‘서기관’과 동일시하지 않습니다.
