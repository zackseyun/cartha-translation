  source_fidelity: 원문의 대조(δέ), νομικοί, 하나님의 βουλή, εἰς ἑαυτούς의 대상/관련성은 대체로 반영되어 있습니다. 그러나 μὴ βαπτισθέντες ὑπ’ αὐτοῦ는 인과를 명시하지 않는 분사구인데, 초안의 ‘받지 않았기 때문입니다’는 이를 확정적 원인절로 바꾸어 원문의 열어 둔 관계를 과도하게 규정합니다.
  naturalness: ‘하나님의 뜻을 자기들에게 대하여 거절하다’는 현대 한국어에서 다소 부자연스럽습니다. ‘자기들에 관한 하나님의 뜻을 거절하다’가 자연스럽고, 원문의 의미 범위도 유지합니다. ‘바리새인들’은 통용되는 표준 성경 용례로 간결합니다.
  terminology: νομικοί는 ‘율법 전문가들’로 옮기면 모세 율법에 정통한 이들이라는 뜻을 보존하면서, 반드시 교육 행위를 뜻하지 않는 원어의 범위를 더 잘 반영합니다. βουλή는 여기서 ‘뜻’으로 가능하며, 교리적으로 특정한 의지 개념을 강요하지 않습니다.
