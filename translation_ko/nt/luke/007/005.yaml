  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
  footnotes:
  - marker: a
    text: Or, 'had the synagogue built for us.' The Greek says simply 'built,' which may refer either to personal involvement or to patronage/funding.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그가 우리 민족을 사랑하고, 그 자신이 우리를 위해 회당을 지었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지었다’는 그가 직접 건축했다는 뜻일 수도 있고, 후원하거나 발주하여 짓게 했다는 뜻일 수도 있습니다. 헬라어는 단순히 ‘지었다’고만 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  english_pob_choice: loves
  chosen_korean: 사랑하고
  alternatives_korean:
  - 좋아하고
  - 아끼고
  lexicon: BDAG
  rationale: ἀγαπᾷ의 강한 애정과 호의를 약화하지 않기 위해, 평이한 ‘좋아하다’보다 ‘사랑하다’를 택했습니다.
- source_word: ἔθνος
  english_pob_choice: nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 백성
  lexicon: BDAG
  rationale: 여기서는 유대인 공동체를 가리키는 집단 명사이므로, 단순한 국가보다 공동체적·민족적 의미를 드러내는 ‘민족’이 적절합니다.
- source_word: συναγωγήν
  english_pob_choice: the synagogue
  chosen_korean: 회당
  alternatives_korean:
  - 유대교 회당
  - 예배당
  lexicon: BDAG
  rationale: συναγωγή의 확립된 유대교 제도적 의미를 살려 ‘회당’으로 옮겼습니다.
- source_word: ᾠκοδόμησεν
  english_pob_choice: built
  chosen_korean: 지었습니다
  alternatives_korean:
  - 건축했습니다
  - 세웠습니다
  - 짓게 했습니다
  lexicon: BDAG
  rationale: 그리스어는 단순히 ‘지었다’고 말할 뿐이므로, 물리적으로 직접 했는지 후원했는지를 단정하지 않는 자연스러운 과거형 ‘지었습니다’를 택했습니다.
theological_decisions:
- issue: 센추리온의 회당 건립이 직접 시공인지 후원인지
  chosen_reading: 본문은 단순히 그가 ‘지었다’고만 말하며, 직접 참여와 후원을 모두 열어 둡니다.
  alternative_readings:
  - 그가 직접 건축했다
  - 그가 자금을 대어 짓게 했다
  rationale: 헬라어 동사 자체가 그 책임·관여를 넓게 표현하므로, 해석을 한쪽으로 고정하지 않았습니다.
