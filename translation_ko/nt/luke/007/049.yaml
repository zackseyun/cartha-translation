id: LUK.7.49
reference: Luke 7:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
  footnotes:
  - marker: a
    text: Or 'to say to themselves.' The Greek expression may suggest either private reflection or discussion among the guests.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 함께 식탁에 앉아 있던 사람들은 서로[a] 말하기 시작했습니다. “이 사람이 누구이기에 죄까지도 용서합니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속으로’. 그리스어 표현은 손님들 사이의 대화를 가리킬 수도 있고, 각 사람이 속으로 한 말을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ συνανακείμενοι
  english_pob_choice: those reclining at the table with him
  chosen_korean: 함께 식탁에 앉아 있던 사람들
  alternatives_korean:
  - 그와 함께 식탁에 기대어 있던 사람들
  - 함께 식사하던 사람들
  lexicon: BDAG
  rationale: 공동 식사 장면은 살리되, 현대 한국어에서 어색한 ‘엎드려 기대다’보다 자연스러운 ‘식탁에 앉아 있던’으로 풀었습니다. ‘함께’는 συν-의 동반 의미를 반영합니다.
- source_word: λέγειν ἐν ἑαυτοῖς
  english_pob_choice: to say among themselves
  chosen_korean: 자기들끼리 말하기 시작했습니다
  alternatives_korean:
  - 자기들 안에서 말하기 시작했습니다
  - 서로 말하기 시작했습니다
  lexicon: BDAG
  rationale: 이 표현은 내적 독백과 상호 발화를 모두 열어 두므로, 집단적 반응을 드러내는 ‘자기들끼리’가 가장 무난합니다. ‘말하기 시작했습니다’는 ἤρξαντο의 시작상도 함께 살립니다.
- source_word: Τίς οὗτός ἐστιν
  english_pob_choice: Who is this
  chosen_korean: 이 사람이 누구이기에
  alternatives_korean:
  - 이분이 누구이기에
  - 이 사람이 누구입니까
  lexicon: BDAG
  rationale: 원문의 질문은 놀라움과 의문을 담고 있으므로, 한국어에서는 감탄적 뉘앙스를 살리는 ‘-이기에’로 옮겼습니다. ‘이 사람’은 ἄνθρωπος가 없다는 점을 반영해 불필요한 보충을 피합니다.
- source_word: ἁμαρτίας ἀφίησιν
  english_pob_choice: forgives sins
  chosen_korean: 죄까지도 용서합니까
  alternatives_korean:
  - 죄를 용서합니까
  - 죄를 사해 주십니까
  lexicon: BDAG
  rationale: ἀφίημι는 이 문맥에서 죄 사함의 통상적 표현이지만, 한국어 본문에서는 행위의 범위를 강조하는 ‘죄까지도’로 ἁμαρτίας에 대한 경악을 드러냈습니다. ‘용서합니까’는 직역적이면서도 현대 독자에게 분명합니다.
theological_decisions:
- issue: 예수의 죄 사함 권위에 대한 반응의 보존
  chosen_reading: 이 구절은 결론을 내리지 않고, 손님들의 놀라운 질문 자체를 그대로 드러냈습니다.
  alternative_readings:
  - 예수의 신적 권위를 암시하는 식으로 풀어 쓰기
  - ‘죄를 사해 주십니까’처럼 교리적 용어로 고정하기
  rationale: 본문은 해설이 아니라 반응을 기록하므로, 신학적 판단을 덧붙이지 않고 놀라움과 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문의 긴장 보존
