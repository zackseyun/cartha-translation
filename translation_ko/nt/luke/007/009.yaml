  - severity: low
    issue: ‘이 말’과 ‘돌아보시며’가 각각 ταῦτα와 στραφείς의 형태·동작을 다소 축소합니다.
    rationale: ταῦτα는 복수이며, στραφείς는 군중을 향해 몸을 돌리는 동작입니다. ‘이러한 말씀’ 및 ‘무리에게 돌아서서’는 뜻을 더 충실히 전달하면서도 자연스럽습니다.
