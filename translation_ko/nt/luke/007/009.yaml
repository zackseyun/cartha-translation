revisions:
- from: 예수께서 이 말을 들으시고 그를 놀라워하셨으며, 그분을 따르던 무리를 돌아보시며 말씀하셨습니다. “내가 너희에게 말합니다. 이스라엘에서도 이만한 믿음을 본 적이 없습니다.”[a][b]
  to: 예수께서 이러한 말씀을 들으시고 그를 놀랍게 여기셨습니다. 그리고 자신을 따르는 무리에게 돌아서서 말씀하셨습니다. “내가 너희에게 말합니다. 이스라엘에서조차 이만한 믿음을[a][b] 찾은 적이 없습니다.”
  rationale: 원문의 복수 지시어, 예수께서 군중을 향해 돌아서시는 동작, 그리고 ‘그를’ 놀랍게 여기신 목적어 관계를 더 직접적으로 반영했습니다. 또한 각주 a를 믿음의 정도를 나타내는 τοσαύτην의 대안 표현에 연결하여 감사 기록의 어휘 쟁점과 맞추고, 각주 b에는 πίστις의 가능한 대안인 ‘신뢰’를 보존했습니다.
