id: LUK.7.9
reference: Luke 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
  footnotes:
  - marker: a
    text: Or “so great a faith.”
    reason: lexical_alternative
  - marker: b
    text: Or “trust”; the Greek word is the same term often translated “faith.”
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 이러한 말씀을 들으시고 그를 놀랍게 여기셨습니다. 그리고 자신을 따르는 무리에게 돌아서서 말씀하셨습니다. “내가 너희에게 말합니다. 이스라엘에서조차 이만한 믿음을[a][b] 찾은 적이 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이처럼 큰 믿음”.
    reason: lexical_alternative
  - marker: b
    text: ‘믿음’으로 옮긴 원어는 ‘신뢰’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  english_pob_choice: When Jesus heard these things
  chosen_korean: 예수께서 이 말을 들으시고
  alternatives_korean:
  - 예수께서 이 일들을 들으시고
  - 예수께서 그것들을 들으시고
  lexicon: BDAG
  rationale: 분사 ἀκούσας와 ταῦτα의 시간·상황 관계를 한국어에서 자연스럽게 살리되, 복수 지시어를 문맥상 ‘이 말’로 압축해 centurion의 발화를 가리키게 했습니다.
- source_word: ἐθαύμασεν
  english_pob_choice: marveled
  chosen_korean: 놀라워하셨으며
  alternatives_korean:
  - 놀라셨으며
  - 매우 놀라셨으며
  lexicon: BDAG
  rationale: θαυμάζω의 놀라움을 드러내되, 예수의 무지를 암시하지 않도록 ‘놀라워하셨다’로 옮겼습니다.
- source_word: στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  english_pob_choice: turning to the crowd following him
  chosen_korean: 그분을 따르던 무리를 돌아보시며
  alternatives_korean:
  - 그분을 따르던 군중을 돌아보시며
  - 그분을 뒤따르던 무리를 향해 돌이켜
  lexicon: BDAG
  rationale: στραφεὶς는 동작 전환을, ἀκολουθοῦντι ὄχλῳ는 지속적 추종을 나타내므로 ‘돌아보시며’와 ‘따르던 무리’로 간결하게 반영했습니다.
- source_word: Λέγω ὑμῖν
  english_pob_choice: I tell you
  chosen_korean: 내가 너희에게 말합니다
  alternatives_korean:
  - 내가 너희에게 이르노라
  - 너희에게 말합니다
  lexicon: BDAG
  rationale: 직접 화법의 단정적 도입구를 현대 합쇼체로 살리되, 구어적 인상을 과도하게 낮추지 않기 위해 ‘말합니다’를 택했습니다.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον
  english_pob_choice: not even in Israel have I found such faith
  chosen_korean: 이스라엘에서도 이만한 믿음을 본 적이 없습니다
  alternatives_korean:
  - 이스라엘에서도 이런 믿음을 찾은 적이 없습니다
  - 이스라엘 안에서도 이와 같은 믿음을 본 적이 없습니다
  lexicon: BDAG
  rationale: οὐδὲ의 ‘not even’은 ‘~에서도’로, τοσαύτην πίστιν은 ‘이만한 믿음’으로, εὗρον은 한국어 관용에 맞게 ‘본 적이 없습니다’로 옮겨 관찰·발견의 뉘앙스를 자연스럽게 전달했습니다.
theological_decisions:
- issue: πίστις의 한국어 기본어 선택
  chosen_reading: 믿음
  alternative_readings:
  - 신뢰
  - 신실함
  rationale: 이 문맥의 centurion은 예수의 권위에 대한 신뢰와 확신을 보이므로, 프로젝트 기본어인 ‘믿음’을 유지하는 것이 가장 직접적입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: πίστις → 믿음'
