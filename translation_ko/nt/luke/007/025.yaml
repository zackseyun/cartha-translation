id: LUK.7.25
reference: Luke 7:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
  footnotes:
  - marker: a
    text: Or 'soft garments.' The phrase refers to fine, delicate clothing associated with luxury, not to moral weakness.
    reason: lexical_alternative
  - marker: b
    text: Or 'kings' courts.' The Greek refers to royal residences or court settings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 무엇을 보려고 나가셨습니까? 부드러운 옷을 입은 사람입니까? 보십시오. 화려한 옷을 입고 사치 속에 사는 사람들은 왕궁에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부드러운 옷’은 여기서 옷감의 섬세함과 고급스러움을 가리키며, 도덕적 약함을 뜻하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕의 궁정들’입니다. 헬라어는 왕실 거처나 궁정 공간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그런데
  - 하지만
  lexicon: BDAG
  rationale: 앞의 수사적 질문을 이어 주는 반대 연결로서, 한국어에서는 문두의 전환을 자연스럽게 살리는 ‘그러나’가 가장 적절합니다.
- source_word: ἐξήλθατε ἰδεῖν
  english_pob_choice: did you go out to see
  chosen_korean: 보려고 나가셨습니까
  alternatives_korean:
  - 나가서 보셨습니까
  - 보러 나가셨습니까
  lexicon: BDAG
  rationale: 목적을 나타내는 부정사와 수사적 질문의 흐름을 살려 ‘보려고 나가셨습니까’로 옮겼습니다.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  english_pob_choice: dressed in soft clothing
  chosen_korean: 부드러운 옷을 입은
  alternatives_korean:
  - 고운 옷을 입은
  - 연한 옷을 입은
  lexicon: BDAG
  rationale: μαλακοῖς는 이 문맥에서 도덕적 연약함이 아니라 섬세하고 값비싼 옷감을 가리키므로, ‘부드러운 옷’으로 직역에 가깝게 살렸습니다.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ
  english_pob_choice: in splendid clothing and luxury
  chosen_korean: 화려한 옷을 입고 사치 속에
  alternatives_korean:
  - 영화로운 옷차림과 호사 속에
  - 찬란한 옷을 입고 호화롭게
  lexicon: BDAG
  rationale: ἐνδόξῳ의 ‘splendid’는 외적인 화려함을, τρυφῇ는 사치와 안락함을 가리키므로 두 요소를 한국어에서 분명히 구분해 표현했습니다.
- source_word: βασιλείοις
  english_pob_choice: royal palaces
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 궁정
  - 왕실 궁전
  lexicon: BDAG
  rationale: βασιλείοις는 왕실 거처나 궁정 공간을 가리키며, 한국어에서는 간결하고 자연스러운 ‘왕궁’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: μαλακοῖς의 의미 범위
  chosen_reading: 이 구절에서는 옷감의 부드러움/섬세함을 가리키며, 사람의 성적·도덕적 성향을 평가하는 표현으로 옮기지 않았습니다.
  alternative_readings:
  - 나약한
  - 여성적인
  rationale: 바로 뒤의 ‘화려한 옷’과 ‘왕궁’이 사회적·경제적 대비를 분명히 하므로, 문맥상 도덕적 비난보다 사치스러운 복식을 가리키는 뜻을 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 6
