  source_fidelity: 그리스어의 주어는 ‘세례자 요한’인데 초안은 ‘요한’으로만 옮겨 칭호 ὁ βαπτιστὴς를 누락했습니다. 또한 μὴ … μήτε …의 빵과 포도주에 대한 이중 부정과 Δαιμόνιον ἔχει의 비난은 대체로 반영되었으나, ‘마시을’은 명백한 형태 오류입니다.
  naturalness: ‘먹을 빵도 마시을 포도주도 없이’는 오기와 비자연스러운 결합 때문에 현대 표준 한국어 문장으로 적절하지 않습니다. ‘빵을 먹지도 포도주를 마시지도 않은 채’가 원문의 금욕적 방식과 한국어 관용을 함께 살립니다.
