  to: 세례자 요한은 빵을 먹지도 포도주를 마시지도 않은 채 왔는데, 여러분은 ‘그에게 귀신이 들렸다[a]’고 말합니다.
  rationale: 세례자 칭호를 복원하고, 이중 부정의 병렬을 자연스러운 한국어로 바로잡았습니다. ‘귀신이 들렸다’는 Δαιμόνιον ἔχει의 한국어 관용적 표현이며, 직역 가능성은 각주로 제시해 원문의 어휘적 형태도 확인할 수 있게 했습니다. 완료형 ἐλήλυθεν은 한국어 문맥에서 현재의 발화와 연결되는 ‘왔는데’로 무리 없이 반영했습니다.
