base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, “He is demon-possessed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 요한이 먹을 빵도 마시을 포도주도 없이 와서, 여러분은 ‘그에게는 귀신이 들렸다’고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 “그는 귀신 들린 사람이다”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  english_pob_choice: has come
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 오셨습니다
  lexicon: BDAG
  rationale: 완료 시상의 현재적 도착/현존 효과를 한국어에서도 동작의 결과가 이어지는 말투로 살렸습니다.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  english_pob_choice: John the Baptist
  chosen_korean: 요한
  alternatives_korean:
  - 세례 요한
  - 침례 요한
  lexicon: BDAG
  rationale: 한국어 성경에서 이미 굳어진 고유명사이므로 간명하게 ‘요한’으로 두되, 문맥상 세례자임은 본문이 이미 밝히므로 중복 설명은 피했습니다.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  english_pob_choice: eating no bread and drinking no wine
  chosen_korean: 먹을 빵도 마시을 포도주도 없이
  alternatives_korean:
  - 빵도 먹지 않고 포도주도 마시지 않고
  - 빵을 먹지 않고 포도주를 마시지 않고
  lexicon: BDAG
  rationale: 부정 분사구를 한국어의 자연스러운 부사구로 옮겨, ‘빵/포도주’라는 구체적 대상을 유지하면서 금욕적 생활방식을 드러냈습니다.
- source_word: Δαιμόνιον ἔχει
  english_pob_choice: He has a demon
  chosen_korean: 귀신이 들렸다
  alternatives_korean:
  - 귀신을 가졌다
  - 악령이 들렸다
  lexicon: BDAG
  rationale: 직역보다 한국어 관용에 맞는 표현을 택했지만, ‘그는 귀신 들림 상태다’라는 비난의 강도는 유지했습니다.
theological_decisions:
- issue: δαιμόνιον에 대한 한국어 표현
  chosen_reading: 귀신
  alternative_readings:
  - 악령
  - 악한 영
  rationale: 누가복음의 해당 비난 발화는 인물에 대한 폄하적 진술이므로, 한국어 독자에게 즉시 이해되는 ‘귀신’이 가장 직접적입니다.
  doctrine_reference: 복음서의 영적 존재 표현
- issue: 한국어 문장 속 주어 생략 여부
  chosen_reading: 요한이 … 와서, 여러분은 … 말합니다
  alternative_readings:
  - 요한이 … 와서, 너희는 … 말합니다
  - 세례 요한이 … 와서, 여러분은 … 말합니다
  rationale: 예수의 대중 خطاب을 현대 한국어로 옮기기 위해 ‘여러분’을 사용해 공적 청중을 드러냈습니다.
  doctrine_reference: 화자-청중 관계의 재현
