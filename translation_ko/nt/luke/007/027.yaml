  source_fidelity: 인용문의 2인칭 소유·방향 표현과 미래 동사 κατασκευάσει는 대체로 충실히 옮겼습니다. 다만 ἀποστέλλω의 현재형을 고풍스러운 ‘보내노니’로 처리한 것은 현대 표준어 합쇼체 요청과 맞지 않으며, 각주 표지가 해당 어휘에 직접 붙어 있지 않아 검증 가능성이 떨어집니다.
