id: LUK.7.27
reference: Luke 7:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
  footnotes:
  - marker: a
    text: Or more smoothly, 'before you.' The Greek literally says 'before your face.'
    reason: lexical_alternative
  - marker: b
    text: '''Messenger'' could also be rendered ''angel,'' but here it refers to a human envoy, namely John.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람이 바로 “보라, 내가 내 사자를 네 앞에 보내노니, 그가 네 길을 네 앞에서 준비할 것이다”라고 기록된 그분입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘네 앞에’라고 옮길 수도 있습니다. 헬라어는 문자적으로는 ‘네 얼굴 앞에’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사자’는 여기서 하늘의 천사가 아니라, 세례 요한 같은 인간 사절을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  english_pob_choice: This
  chosen_korean: 이 사람
  alternatives_korean:
  - 이분
  - 이 사람은
  lexicon: BDAG
  rationale: 지시대명사의 강조를 살리면서 한국어에서 자연스럽게 인물 지시로 읽히게 했습니다.
- source_word: ἄγγελόν
  english_pob_choice: messenger
  chosen_korean: 사자
  alternatives_korean:
  - 메신저
  - 천사
  - 전령
  lexicon: BDAG
  rationale: 본문의 인물은 세례 요한이므로 천사로 오해되지 않도록 ‘사자’로 옮겼습니다.
- source_word: πρὸ προσώπου σου
  english_pob_choice: before your face
  chosen_korean: 네 앞에
  alternatives_korean:
  - 네 얼굴 앞에
  - 네 앞에서
  lexicon: BDAG
  rationale: 직역의 ‘얼굴’ 이미지는 한국어에서 다소 부자연스러워, 본문의 시각적 방향성을 유지하는 자연스러운 표현을 택했습니다.
- source_word: ἔμπροσθέν σου
  english_pob_choice: before you
  chosen_korean: 네 앞에서
  alternatives_korean:
  - 네 앞에
  - 너보다 앞서
  lexicon: BDAG
  rationale: 앞의 ‘네 앞에’와 구별해, 뒤의 표현은 동작의 위치를 분명히 하는 ‘네 앞에서’로 살렸습니다.
theological_decisions:
- issue: 구약 인용문의 직접 적용과 2인칭 호칭 유지
  chosen_reading: ‘네’로 된 2인칭을 유지하고, 메시아/주를 해설적으로 덧붙이지 않았습니다.
  alternative_readings:
  - ‘주님 앞에’처럼 해설을 보탠 번역
  - ‘그의 길’로 바꾸어 대상만 명시하는 번역
  rationale: 예수께서 인용을 직접 적용하는 긴장을 본문대로 보존해야 하므로, 인용문의 지시어를 그대로 살렸습니다.
  doctrine_reference: 본문의 신학적 긴장 보존
