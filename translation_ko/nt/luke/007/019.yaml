  verdict: revise
  source_fidelity: 초안의 ‘사람을’은 원문의 생략된 목적어를 보충하려는 것이지만, 단수의 불특정한 사람을 넣어 문맥상 전제된 복수의 제자들을 부정확하게 만들 수 있습니다. 또한 ‘오실 그분’은 원문의 칭호적 표현을 전달하려 하나 한국어로는 다소 부자연스럽습니다. ‘오실 분’은 문맥상 종말론적 칭호를 보존하면서 자연스럽습니다.
  naturalness: ‘당신이 오실 그분이십니까’는 현대 정중 한국어에서 어색하며, 예수께 직접 보내는 질문에서 ‘당신’은 부적절하게 들릴 수 있습니다. 주어를 생략한 ‘오실 분이십니까’는 한국어의 자연스러운 높임 표현입니다. ‘이렇게 물었습니다’는 질문 내용에 맞고, 제자들을 보내어 전달한 상황도 명료하게 합니다.
  terminology: κύριος는 ‘주님’으로 유지합니다. ὁ ἐρχόμενος는 ‘오실 분’으로 옮기고 각주에서 ‘오시는 분’이라는 직역 가능성과 이 문맥에서의 메시아적 칭호 기능을 밝혀, 해석어인 ‘메시아’를 본문에 삽입하지 않습니다.
