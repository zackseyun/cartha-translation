    rationale: ‘당신’은 이와 같은 정중한 직접 호칭에서 자연스럽지 않으며, ‘오실 그분’도 한국어의 칭호 표현으로 매끄럽지 않습니다. 주어 생략 및 ‘오실 분’이 원문의 뜻과 높임을 더 자연스럽게 전달합니다.
