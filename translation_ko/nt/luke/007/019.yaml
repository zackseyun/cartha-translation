revisions:
- from: 그는 사람을 주님께 보내어 이렇게 말했습니다. 「당신이 오실 그분이십니까, 아니면 우리가 다른 이를 기대해야 합니까?」[a]
  to: 그는 제자들을 주님께 보내어 이렇게 물었습니다. “오실 분[a]이십니까, 아니면 우리가 다른 이를 기대해야 합니까?”
  rationale: 문맥상 생략된 전달자들을 ‘제자들’로 자연스럽게 보충하고, 질문을 ‘물었습니다’로 옮겼습니다. ‘오실 그분’은 ‘오실 분’으로 다듬어 칭호적 의미와 현대 한국어의 자연스러움을 함께 살렸습니다. ‘기대해야 합니까’는 προσδοκῶμεν의 지속적 기대라는 뜻을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:13Z'
