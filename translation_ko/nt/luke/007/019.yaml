id: LUK.7.19
reference: Luke 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
  footnotes:
  - marker: a
    text: Or, “the one who is coming.” The Greek expression can be read more descriptively, but here likely functions as a messianic title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사람을 주님께 보내어 이렇게 말했습니다. 「당신이 오실 그분이십니까, 아니면 우리가 다른 이를 기대해야 합니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “오시는 분”이지만, 여기서는 메시아적 칭호로 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  english_pob_choice: He sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: BDAG
  rationale: 아오리스트 서술의 단순 과거 행위를 자연스럽게 옮기면서, 뒤의 말하기 절을 이끄는 동작으로 연결하기에 ‘보내어’가 가장 간결합니다.
- source_word: πρὸς τὸν κύριον
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주인에게
  - 주께
  lexicon: BDAG
  rationale: κύριος는 본문 맥락에서 예수를 가리키는 호칭이므로 ‘주님’이 적절합니다. ‘주인’은 의미가 약해지고, ‘주께’는 다소 전통적입니다.
- source_word: ὁ ἐρχόμενος
  english_pob_choice: the Coming One
  chosen_korean: 오실 그분
  alternatives_korean:
  - 오시는 분
  - 오셔야 할 분
  lexicon: BDAG
  rationale: 관사+현재분사의 명사화가 지닌 칭호적 뉘앙스를 살리되, 한국어에서 자연스럽게 읽히도록 ‘오실 그분’으로 옮겼습니다.
- source_word: ἄλλον
  english_pob_choice: another
  chosen_korean: 다른 이
  alternatives_korean:
  - 다른 사람
  - 또 한 분
  lexicon: BDAG
  rationale: 대조 질문의 목적어로서 간결하고 중립적인 표현을 택했습니다. ‘다른 사람’보다 ‘다른 이’가 더 격식 있고 본문 분위기에 맞습니다.
theological_decisions:
- issue: ὁ ἐρχόμενος의 메시아적 칭호성
  chosen_reading: ‘오실 그분’으로 번역해 기능상 칭호성을 유지했습니다.
  alternative_readings:
  - ‘오시는 분’처럼 단순 서술로 옮김
  - ‘메시아’로 해석 번역
  rationale: 본문은 예언적/종말론적 칭호를 암시하지만, 한국어에서 지나친 해석어 ‘메시아’를 직접 넣기보다 원문 형식을 살린 표현이 더 안전합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §2, §3
- issue: κύριος의 예수 호칭 번역
  chosen_reading: 예수에 대한 호칭으로 ‘주님’을 사용했습니다.
  alternative_readings:
  - 주
  - 주인
  rationale: 루가복음의 서술에서는 κύριος가 단순 호칭을 넘어 그리스도론적 무게를 가지므로, 한국어에서도 ‘주님’이 그 무게를 가장 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος *Kyrios* → Lord'
