  naturalness: ‘그에게 더 많이 탕감받은 사람이겠다고 생각합니다’는 한국어로 다소 어색하며 ‘그에게’의 선행 대상도 불필요하게 모호합니다. ‘더 많이 탕감받은 사람일 것이라고 생각합니다’가 자연스럽습니다. 문맥상 화자는 예수이므로 ‘예수께서’라고 밝혀도 의미를 보태지 않습니다.
  terminology: ‘탕감받은’은 빚 면제 비유의 이미지를 잘 보존합니다. 다만 각주 b의 기존 대안 ‘그가 더 많은 빚을 탕감한 사람’은 수혜자인 관계대명사의 지시 방향을 바꾸므로 사용할 수 없습니다.
