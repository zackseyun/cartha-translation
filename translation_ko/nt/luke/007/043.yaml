  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
  footnotes:
  - marker: a
    text: Or “I assume” or “I take it”; the Greek expresses a tentative inference.
    reason: lexical_alternative
  - marker: b
    text: Or “the one he canceled more debt for”; the verb can carry the sense of graciously remitting a debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬이 대답했습니다[a]. “저는 그에게 더 많이 탕감받은 사람이겠다고 생각합니다.” 그러자 그가 시몬에게 말했습니다[b]. “당신이 옳게 판단했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “생각합니다”, “짐작합니다”; 그리스어는 확정적 진술이 아니라 조심스러운 추론을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 더 많은 빚을 탕감한 사람”; 동사는 은혜롭게 빚을 면제해 주는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  english_pob_choice: answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 응답했습니다
  - 말했습니다
  lexicon: SBLGNT
  rationale: ἀποκριθεὶς + εἶπεν의 관용적 응답 공식을 한국어에서는 자연스럽게 ‘대답했습니다’로 옮겨, 응답의 기능을 살리면서도 서술 흐름을 부드럽게 했습니다.
- source_word: Ὑπολαμβάνω
  english_pob_choice: I suppose
  chosen_korean: 생각합니다
  alternatives_korean:
  - 짐작합니다
  - 추측합니다
  - 그런 것 같습니다
  lexicon: BDAG
  rationale: 여기서 Ὑπολαμβάνω는 확정이 아닌 조심스러운 추론이므로, ‘생각합니다’로 옮겨 시몬의 망설이는 태도를 보존했습니다.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  english_pob_choice: the one to whom he forgave more
  chosen_korean: 그에게 더 많이 탕감받은 사람
  alternatives_korean:
  - 그에게 더 많이 용서받은 사람
  - 그가 더 많은 빚을 탕감한 사람
  lexicon: BDAG
  rationale: χαρίζομαι는 이 비유 문맥에서 빚의 탕감/용서 의미를 가지므로, 본문 맥락을 살려 ‘탕감받다’로 옮겼습니다. 간접목적 구조도 ‘그에게’로 반영했습니다.
- source_word: Ὀρθῶς ἔκρινας
  english_pob_choice: You have judged rightly
  chosen_korean: 옳게 판단했습니다
  alternatives_korean:
  - 바르게 판단했습니다
  - 정확하게 판단했습니다
  lexicon: BDAG
  rationale: ὀρθῶς는 ‘옳게/바르게’의 의미이므로 ‘옳게’로, κρίνω는 판단/심판의 동사로서 여기서는 ‘판단했습니다’가 자연스럽고 문맥에 맞습니다.
theological_decisions:
- issue: 빛나는 은혜/탕감의 뉘앙스를 어떻게 살릴지
  chosen_reading: ἐχαρίσατο를 ‘탕감받은’으로 옮겨, 비유 전체의 빚 탕감 이미지와 용서 주제를 함께 드러냈습니다.
  alternative_readings:
  - 용서받은
  - 빚을 면제받은
  rationale: 본문은 죄 사함을 빚 탕감 비유로 설명하는 자리이므로, 직접적인 ‘탕감’ 표현이 신학적 연결을 가장 분명하게 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
