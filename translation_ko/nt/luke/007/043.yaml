    rationale: 각주 a는 Ὑπολαμβάνω의 잠정성을, 각주 b는 ἐχαρίσατο의 빚 면제 의미를 설명합니다. 현재처럼 각각 ‘대답했습니다’와 ‘말했습니다’에 붙이면 독자가 무엇을 설명하는지 오해할 수 있습니다.
