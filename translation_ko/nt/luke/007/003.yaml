  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his slave.
  footnotes:
  - marker: a
    text: Or 'servant.' The Greek word is doulos, which can mean 'servant' or 'slave' depending on context; here 'slave' was chosen to preserve the bonded status implied by the term.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 예수에 관한 소식을 듣고, 유대인의 장로들을 예수께 보내어 예수께서 오셔서 자기 노예를 구해 주시기를 청했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '종.' 헬라어 둘로스(δοῦλος)는 문맥에 따라 '종' 또는 '노예'를 뜻할 수 있습니다. 여기서는 그 말에 내포된 예속된 신분을 드러내기 위해 '노예'로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  english_pob_choice: When he heard about Jesus
  chosen_korean: 예수에 관해 듣고는
  alternatives_korean:
  - 예수에 대해 듣고는
  - 예수에 대하여 들은 뒤
  lexicon: BDAG
  rationale: 부사적 상황분사로서 앞선 정황을 자연스럽게 이끄는 표현이므로, 한국어에서도 시간·계기 관계를 드러내되 문장을 매끄럽게 했습니다.
- source_word: ἀπέστειλεν πρὸς αὐτόν πρεσβυτέρους τῶν Ἰουδαίων
  english_pob_choice: he sent to him elders of the Jews
  chosen_korean: 유대인들의 장로들을 그에게 보내어
  alternatives_korean:
  - 유대인들의 장로들을 그에게 보냈습니다
  - 유대인의 장로들을 그에게 보내어
  lexicon: BDAG
  rationale: πρεσβυτέρους τῶν Ἰουδαίων은 문자대로 '유대인들의 장로들'로 옮겨, 중간에 '사신들'을 덧붙이지 않고 원문의 지시 대상을 보존했습니다.
- source_word: ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ
  english_pob_choice: asking him to come and save
  chosen_korean: 와서 자기 종을 구해 달라고 청했습니다
  alternatives_korean:
  - 와서 자기 종을 구해 달라고 요청했습니다
  - 와서 자기 노예를 구해 달라고 청했습니다
  lexicon: BDAG
  rationale: ἐρωτῶν과 ὅπως절의 요청 의미를 한국어에서 자연스러운 간청 표현으로 살렸고, διασώσῃ는 병든 사람을 살리거나 구하다의 넓은 의미를 유지하기 위해 '구해 달라'로 옮겼습니다.
- source_word: τὸν δοῦλον αὐτοῦ
  english_pob_choice: his slave
  chosen_korean: 자기 종
  alternatives_korean:
  - 자기 노예
  - 그의 종
  lexicon: BDAG
  rationale: 이 구절에서는 κοινων적·가정적 관계가 앞에 서고, 한국어에서 '노예'는 현대 독자에게 지나치게 법적 소유관계를 강조할 수 있어, 본문 의미를 해치지 않는 범위에서 '종'을 택했습니다.
theological_decisions:
- issue: δοῦλος의 한국어 처리
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 하인
  rationale: 주인의 권위 아래 있는 종속적 지위를 가리키지만, 이 문맥의 중심은 예수께 대한 정중한 요청과 병든 가신의 구원 청원에 있으므로 한국어 수용성을 고려해 '종'으로 번역했습니다. 본문이 신분의 법적 성격을 전면화하지는 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; Luke 7:1-10 narrative context'
