  terminology: πρεσβυτέρους τῶν Ἰουδαίων은 '유대인의 장로들'로 자연스럽게 옮길 수 있습니다. δοῦλος는 여기서 '노예'로 번역하고, 전통적 대안인 '종'을 각주로 제시하는 것이 원문의 신분적 종속성을 더 잘 보존합니다.
