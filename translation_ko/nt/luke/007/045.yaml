source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
  footnotes:
  - marker: a
    text: Or 'no kiss of greeting'; the kiss was a customary act of hospitality.
    reason: cultural_note
  - marker: b
    text: 'The verb can imply affectionate or repeated kissing: ''has not stopped covering my feet with kisses.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 내게 입맞춤을 하지 않았습니다.[a] 그러나 내가 들어온 때부터 이 여자는 내 발에 입맞추기를 그치지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인사의 입맞춤’입니다. 이 입맞춤은 당시 환대의 관례였습니다.
    reason: cultural_note
  - marker: b
    text: 동사는 애정 어린 또는 반복된 입맞춤을 암시할 수 있습니다. 또는 ‘내 발에 계속 입맞춤하기를 그치지 않았다’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  english_pob_choice: kiss
  chosen_korean: 입맞춤
  alternatives_korean:
  - 키스
  - 입맞춤 인사
  lexicon: BDAG
  rationale: ἔδωκας와 함께 쓰인 φίλημα는 단순한 ‘키스’라기보다 인사로 건네는 입맞춤을 가리킬 수 있어, 문맥의 환대 의미를 살리면서도 본문은 간결하게 유지하기 위해 ‘입맞춤’으로 옮겼습니다.
- source_word: οὐκ ἔδωκας
  english_pob_choice: You gave me no kiss
  chosen_korean: 당신은 내게 입맞춤을 하지 않았습니다
  alternatives_korean:
  - 당신은 내게 입맞춤을 주지 않았습니다
  - 당신은 나에게 입맞춤을 건네지 않았습니다
  lexicon: BDAG
  rationale: δίδωμι의 기본 의미인 ‘주다’를 살리되 한국어에서는 ‘입맞춤을 하다’가 더 자연스러워, 동작 자체를 중심으로 옮겼습니다.
- source_word: ἀφ’ ἧς εἰσῆλθον
  english_pob_choice: from the time I came in
  chosen_korean: 내가 들어온 뒤로
  alternatives_korean:
  - 내가 들어온 때부터
  - 내가 들어온 이후로
  lexicon: BDAG
  rationale: 관계절이 시간의 기점을 나타내므로 ‘뒤로’로 간결하게 표현해, 영어 POB의 시간적 출발점 의미를 한국어로 자연스럽게 재현했습니다.
- source_word: οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας
  english_pob_choice: has not stopped kissing my feet
  chosen_korean: 내 발에 입맞춤하기를 그치지 않았습니다
  alternatives_korean:
  - 내 발에 계속 입맞춤하고 있습니다
  - 내 발을 입맞춤으로 덮기를 그치지 않았습니다
  lexicon: BDAG
  rationale: καταφιλέω의 반복적·애정적 뉘앙스를 본문에서 과장하지 않으면서도, ‘그치지 않았습니다’로 지속성을 분명히 드러냈습니다.
theological_decisions:
- issue: 환대의 입맞춤을 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 행위를 직접적으로 번역하고, 문화적 의미는 주석으로 남겼습니다.
  alternative_readings:
  - 당신은 내게 관례적인 환대의 입맞춤을 하지 않았습니다
  rationale: 원문은 환대 관습을 설명하지 않고 행동만 진술하므로, 본문을 설명문으로 풀지 않는 편이 원문 충실도에 더 적합합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; original-language primacy over translation tradition.'
