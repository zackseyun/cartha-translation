translation:
  language: ko
  text: 당신은 내게 입맞춤을 하지 않았습니다. 그러나 내가 들어온 뒤로 이 여자는 내 발에 입맞춤하기를 그치지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인사의 입맞춤’입니다. 이 입맞춤은 당시 환대의 관례였습니다.
    reason: cultural_note
  - marker: b
    text: 동사는 애정 어린 입맞춤이나 반복된 입맞춤을 암시할 수 있습니다. 곧 ‘내 발을 입맞춤으로 덮기를 그치지 않았다’는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
