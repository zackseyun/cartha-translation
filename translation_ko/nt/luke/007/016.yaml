id: LUK.7.16
reference: Luke 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
  footnotes:
  - marker: a
    text: Or “has been raised up among us,” highlighting God’s raising up of a prophet.
    reason: lexical_alternative
  - marker: b
    text: “Has visited” is biblical language for God coming to his people with attention and saving concern.
    reason: cultural_note
  - marker: c
    text: Or '“A great prophet has arisen among us,” and, “God has visited his people.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 모두가 두려움에 사로잡혔고, 그들은 하나님을 영화롭게 하며 말했습니다. “위대한 예언자 한 분이 우리 가운데 일어나셨고, 하나님이 자기 백성을 찾아오셨습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 가운데 일으켜 세우셨습니다.” 이는 하나님께서 예언자를 일으키시는 뜻을 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 성서적 표현으로서의 “찾아오셨습니다”는 하나님이 자기 백성에게 관심을 가지고 구원하러 개입하신다는 뜻을 담습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν δὲ φόβος πάντας
  english_pob_choice: fear seized them all
  chosen_korean: 모두가 두려움에 사로잡혔고
  alternatives_korean:
  - 두려움이 그들 모두를 사로잡았고
  - 모든 사람에게 두려움이 임했고
  - 경외가 그들을 모두 사로잡았고
  lexicon: BDAG
  rationale: φόβος가 주어로 서는 강한 관용구를 자연스러운 한국어로 옮기되, 미화하지 않고 갑작스러운 압도감을 살렸습니다.
- source_word: ἐδόξαζον τὸν θεὸν
  english_pob_choice: they were glorifying God
  chosen_korean: 그들은 하나님을 영화롭게 하며
  alternatives_korean:
  - 그들은 하나님께 영광을 돌리며
  - 그들은 하나님을 찬양하며
  lexicon: BDAG
  rationale: ἐδόξαζον의 동작성을 살려 단순 과거보다 진행적 뉘앙스를 반영했고, δοξάζω와의 직접 대응을 유지했습니다.
- source_word: Προφήτης μέγας ἠγέρθη ἐν ἡμῖν
  english_pob_choice: A great prophet has arisen among us
  chosen_korean: 위대한 예언자 한 분이 우리 가운데 일어나셨고
  alternatives_korean:
  - 큰 예언자 한 분이 우리 가운데 일어나셨고
  - 위대한 예언자 한 분이 우리 가운데 세워지셨고
  - 위대한 예언자 한 분이 우리 가운데 일어나셨습니다
  lexicon: BDAG
  rationale: ἠγέρθη를 ‘일어나셨다’로 옮겨 문맥상 자연스러움을 살리면서, 하나님이 예언자를 일으키셨다는 가능성도 과도하게 해석하지 않도록 했습니다.
- source_word: Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ
  english_pob_choice: God has visited his people
  chosen_korean: 하나님이 자기 백성을 찾아오셨습니다
  alternatives_korean:
  - 하나님이 자기 백성을 방문하셨습니다
  - 하나님이 자기 백성을 돌보러 오셨습니다
  - 하나님이 자기 백성을 살피러 오셨습니다
  lexicon: BDAG
  rationale: ἐπισκέπτομαι의 성서적 ‘방문’ 언어를 살리되, 한국어에서 더 분명한 구원의 관심을 드러내는 ‘찾아오시다’로 옮겼습니다.
theological_decisions:
- issue: φόβος의 정서적 강도
  chosen_reading: 두려움
  alternative_readings:
  - 경외
  - 놀라움
  rationale: 기적 뒤의 반응을 ‘경외’로 완화하면 원문의 긴장감이 줄어듭니다. 한국어 본문은 두려움의 강도를 유지하고, 독자가 문맥에서 경외를 함께 읽도록 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: Ἐπεσκέψατο의 구원사적 울림
  chosen_reading: 찾아오셨습니다
  alternative_readings:
  - 방문하셨습니다
  - 돌보러 오셨습니다
  rationale: ‘방문’의 성서적 의미를 유지하면서도 한국어에서 하나님의 돌보심과 개입을 자연스럽게 드러내기 위해 ‘찾아오시다’를 선택했습니다.
  doctrine_reference: Translation philosophy §1 and §3
