revisions:
- from: 그러나 너희는 무엇을 보려고 나갔습니까? 예언자입니까? 그렇습니다. 내가 여러분에게 말합니다. 예언자보다 더 큰 사람입니다.[a]
  to: 그러나 여러분은 무엇을 보려고 나갔습니까? 예언자입니까? 그렇습니다. 내가 여러분에게 말합니다. 예언자보다 더한 분입니다.[a]
  rationale: 비교 표현을 ‘더 큰 사람’으로 해석적으로 구체화하지 않고 ‘예언자보다 더한 분’으로 수정했습니다. 이는 요한을 가리키는 문맥을 반영하되, 그가 어떤 점에서 예언자보다 더한지 본절에서 규정하지 않는 원문의 간결함을 보존합니다. 청자 호칭도 ‘여러분’으로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:45:02Z'
review_pass:
  verdict: revise
  source_fidelity: ‘예언자보다 더 큰 사람’은 비교의 방향은 전달하지만, 그리스어 περισσότερον은 중성 비교 표현으로서 ‘예언자보다 더한’이라는 간결한 진술을 이룹니다. ‘큰 사람’은 ‘크다’의 특정 의미와 ‘사람’을 덧붙여 원문의 표현을 다소 좁힙니다. ‘예언자보다 더한 분’이 문맥상 대상을 자연스럽게 가리키면서 원문의 개방성을 더 잘 보존합니다.
  naturalness: 합쇼체와 현대 표준어에 맞추어 청자를 ‘여러분’으로 일관되게 하고, ‘내가 여러분에게 말합니다’라는 직접 화법을 유지했습니다. ‘예언자보다 더한 분입니다’는 한국어로 자연스럽고 간결합니다.
  terminology: προφήτης는 ‘예언자’로 적절합니다. 비교 표현은 신분이나 위대함의 구체적 성격을 설명하지 않는 ‘더한’으로 옮겨, 본문이 남겨 둔 범위를 보존했습니다.
  issues:
