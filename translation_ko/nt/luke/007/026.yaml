id: LUK.7.26
reference: Luke 7:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
  footnotes:
  - marker: a
    text: Or, 'something greater than a prophet.' The Greek comparative expression can be rendered more literally this way, but 'more than a prophet' is the most natural English equivalent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 무엇을 보려고 나갔습니까? 예언자입니까? 그렇습니다. 내가 여러분에게 말합니다. 예언자보다 더 큰 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예언자보다 더 큰 사람’은 그리스어 비교 표현을 자연스럽게 옮긴 것이며, 더 문자적으로는 ‘예언자보다 더 큰 무엇’처럼 읽을 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 질문과의 대조를 분명히 하면서도, 한국어 문장 흐름에서는 ‘그러나’가 가장 자연스럽습니다.
- source_word: τί ἐξήλθατε ἰδεῖν
  english_pob_choice: what did you go out to see
  chosen_korean: 무엇을 보려고 나갔습니까
  alternatives_korean:
  - 무엇을 보러 나갔습니까
  - 무엇을 보려고 나가셨습니까
  lexicon: BDAG
  rationale: ‘나가다’의 목적을 나타내는 ἰδεῖν을 자연스러운 목적 표현 ‘보려고’로 옮겨, 질문의 구체적 대상이 ‘무엇’인지 살렸습니다.
- source_word: προφήτην
  english_pob_choice: A prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자 한 사람
  lexicon: BDAG
  rationale: 공통명사로서의 προφήτην을 표준적 현대 한국어인 ‘예언자’로 옮겼습니다. 여기서는 호칭어가 아니라 질문의 답으로 제시되는 명사입니다.
- source_word: περισσότερον προφήτου
  english_pob_choice: more than a prophet
  chosen_korean: 예언자보다 더 큰 사람
  alternatives_korean:
  - 예언자보다 더 많은 사람
  - 예언자보다 큰 분
  lexicon: BDAG
  rationale: 그리스어 비교구문은 직역하면 ‘예언자보다 더(많이/큰) 사람’의 뉘앙스가 있으나, 한국어에서는 ‘더 큰 사람’이 가장 자연스럽게 비교의 강도를 살립니다.
theological_decisions:
- issue: 예수의 요한 평가를 한국어로 과도하게 풀이하지 않을지 여부
  chosen_reading: 이 절은 요한을 예언자라고 말하면서도 그보다 더 크다고만 진술하며, 그 우월성의 구체적 의미는 여기서 풀지 않습니다.
  alternative_readings:
  - 가장 위대한 예언자
  - 종말론적 사자
  rationale: 본문은 간결한 비교 진술을 유지하므로, 해석을 덧붙여 범위를 좁히지 않고 긴장을 그대로 보존하는 것이 소스에 충실합니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 비교 표현을 그대로 보존
