  source_fidelity: 개정이 필요합니다. 본문은 κύριος를 '야훼'로 특정하지 않으며, 마지막 절은 병자라는 목적어를 보충하거나 야훼가 예수를 고치게 하셨다는 사역 구문으로 옮겨서는 안 됩니다. SBLGNT의 αὐτόν은 예수께서 고치시는 주체임을 나타내는 것으로 보존하는 것이 적절합니다.
  naturalness: '''주님의 능력이 그분께서 고치실 수 있도록 함께 있었습니다''는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 다소 압축된 목적 구문도 유지합니다. ''모든 마을과 예루살렘에서''은 지역과 도시의 병렬을 자연스럽게 드러냅니다.'
  terminology: κύριος는 프로젝트의 기본 대응어 및 본문상의 모호성을 따라 '주님'으로 옮겨야 합니다. '야훼'는 본문이 명시하지 않는 신명 특정화입니다. νομοδιδάσκαλοι는 '율법 교사들', Φαρισαῖοι는 '바리새인들'이 적절합니다.
  issues:
