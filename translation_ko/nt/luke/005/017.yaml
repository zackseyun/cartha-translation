    rationale: 그리스어 본문은 κύριος이며, 이를 야훼로 특정하는 것은 번역 차원에서 본문보다 더 좁게 해석합니다.
  - severity: high
    issue: 마지막 절을 '병자를 고치게 하셨습니다'로 번역함
    rationale: 본문에는 '병자'라는 목적어가 없고, 이 표현은 주님의 능력이 예수에게 치유를 명령하거나 사역하게 했다는 인과를 강하게 부가합니다. αὐτόν을 반영하여 예수께서 고치시는 주체임을 유지해야 합니다.
  - severity: medium
    issue: 각주가 근거 없는 구약 정형 반향을 주장하며 본문 변이를 설명하지 않음
