translation:
  language: ko
  text: 어느 날 예수께서 가르치고 계셨는데, 갈릴리와 유대의 모든 마을과 예루살렘에서 온 바리새인들과 율법 교사들이 앉아 있었습니다. 주님의 능력이 예수께서 고치실 수 있도록 함께 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
