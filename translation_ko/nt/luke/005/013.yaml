  text: 그분은 손을 내밀어 그를 만지시고 말씀하셨습니다. 「내가 원합니다. 깨끗해지십시오.」 그리고 즉시 나병[a]이 그에게서 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
