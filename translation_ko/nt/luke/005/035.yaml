  source_fidelity: ‘신랑이 그들에게서 빼앗길’은 ἀπαρθῇ ἀπ’ αὐτῶν의 수동적이고 강제적인 제거의 뉘앙스를 충실히 살립니다. ‘날들이 올 것이며 … 그때에 … 그 날들에’는 미래의 날들, ὅταν의 시간절, τότε, 그리고 마지막의 반복 구문을 모두 보존합니다.
  naturalness: 초안의 ‘날이 올 것이니’와 ‘금식할 것이다’는 뜻은 자연스럽지만, 합쇼체 요구에 맞추어 종결을 ‘것입니다’로 통일했습니다. 또한 문장 끝의 불필요한 닫는 인용 부호를 제거했습니다.
  terminology: ‘신랑’은 νυμφίος의 성경적 혼인 비유를 정확히 유지하며, ‘금식하다’는 νηστεύω의 종교적 의미에 알맞습니다. ‘빼앗기다’는 단순한 떠남으로 완화하지 않고 원문의 수동성과 긴장을 보존합니다.
