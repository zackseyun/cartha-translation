review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. κοινωνοί를 ‘동업자’로 옮긴 것은 어업 사업의 공동 경영 관계를 잘 반영하며, ζωγρῶν의 ‘산 채로’도 ‘살려서 붙잡다’라는 어감을 보존합니다. 다만 원문의 ‘야고보와 요한도 마찬가지로’라는 연결을 더 명료하게 하고, 미래의 지속적 사역을 자연스럽게 드러낼 필요가 있습니다.
  naturalness: 초안의 서술문은 자연스럽지만, 인용문의 ‘말라/너는/것이다’는 지정된 현대 합쇼체와 맞지 않습니다. 또한 사람을 ‘낚다’는 의도적인 비유이기는 하나 한국어에서 지나치게 어색할 수 있으므로, ζωγρέω의 핵심인 ‘산 채로 붙잡다’를 자연스럽게 옮기는 것이 안전합니다.
  terminology: ‘시몬’, ‘세베대’, ‘야고보’, ‘요한’, ‘예수’는 통용되는 성경 인명 표기입니다. ‘동업자’는 κοινωνοί에 적절합니다. ‘사람들’은 ἀνθρώπους의 포괄적 지시 대상을 정확히 나타냅니다.
  issues:
  - severity: medium
    issue: 인용문의 높임말 등급이 합쇼체가 아닙니다.
    rationale: 요청된 목표 문체는 현대 formal-polite 합쇼체인데, ‘두려워하지 말라… 낚을 것이다’는 하라체입니다.
  - severity: low
    issue: 첫 문장의 비교·첨가 연결이 다소 불분명합니다.
    rationale: ‘야고보와 요한도 마찬가지였습니다’도 가능하지만, 원문의 ὁμοίως δὲ καὶ가 그들이 앞선 반응에 함께 해당함을 표시하므로 ‘그들도 마찬가지로’가 더 분명합니다.
  revised_text: 세베대의 아들 야고보와 요한도 시몬의 동업자들이었는데, 그들도 마찬가지로 그러했습니다. 예수께서 시몬에게 말씀하셨습니다. 「두려워하지 마십시오. 이제부터는 사람들을 산 채로 붙잡게 될 것입니다.」
  revised_footnotes: []
  revision_rationale: 합쇼체를 일관되게 적용했습니다. ‘그들도 마찬가지로 그러했습니다’로 원문의 비교·첨가 연결을 드러냈고, ‘산 채로 붙잡게 될 것입니다’로 ζωγρῶν의 ‘살려서 사로잡다’라는 의미를 유지하면서 한국어의 자연스러움을 높였습니다. 원문에 없는 병행본문의 ‘사람 낚는 어부’ 표현으로 조화시키지 않았습니다.
