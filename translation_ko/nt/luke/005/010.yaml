review_pass:
  verdict: revise
  source_fidelity: ‘동업자들’ accurately represents κοινωνοί in its fishing-business context, and ‘사람들을 산 채로 낚게 될 것입니다’ retains both the fishing metaphor and the life-preserving force of ζωγρῶν. The plural ‘사람들을’ reflects ἀνθρώπους. The revision makes the comparative force of ὁμοίως explicit through ‘그러했습니다.’
  naturalness: The draft’s declarative direct speech (‘두려워하지 말라…낚을 것이다’) is intelligible but does not consistently use the requested modern formal-polite 합쇼체. ‘두려워하지 마십시오…낚게 될 것입니다’ is natural, respectful modern Korean. ‘동업자들인 …도 그러했습니다’ is also more idiomatic than attaching ‘마찬가지였습니다’ directly after the names.
  terminology: ‘동업자들’ is appropriate for κοινωνοί, rather than a merely social term such as ‘친구들.’ ‘산 채로 낚다’ intentionally preserves Luke’s distinctive ζωγρέω wording and should not be harmonized into ‘사람을 낚는 어부.’
  issues:
  - severity: medium
    issue: Direct speech does not consistently follow the specified modern formal-polite (합쇼체) register.
    rationale: ‘두려워하지 말라’ and ‘낚을 것이다’ are formal declarative/command forms, not the requested modern polite style. The wording should be revised to ‘두려워하지 마십시오’ and ‘낚게 될 것입니다.’
  - severity: low
    issue: The comparative clause is slightly stiff and less explicit in Korean.
    rationale: ‘시몬의 동업자였던 …도 마찬가지였습니다’ is understandable, but ‘시몬의 동업자들인 …도 그러했습니다’ more naturally identifies James and John as Simon’s partners while conveying ὁμοίως.
  revised_text: 시몬의 동업자들인 세베대의 아들 야고보와 요한도 그러했습니다. 예수께서 시몬에게 말씀하셨습니다. 「두려워하지 마십시오. 이제부터는 당신이 사람들을 산 채로 낚게 될 것입니다.」
  revised_footnotes:
  - marker: a
    text: ‘산 채로 낚다’로 옮긴 그리스어는 단순히 잡는다는 뜻이 아니라 ‘산 채로 사로잡다’라는 뜻을 지닙니다. 누가복음의 이 표현은 마태복음 4:19와 마가복음 1:17의 ‘사람을 낚는 어부’라는 표현과 구별됩니다.
    reason: ζωγρῶν의 ‘산 채로’라는 의미를 설명하고, 평행본문의 표현으로 본문을 평준화하지 않도록 하기 위해
  revision_rationale: 합쇼체를 일관되게 적용하고, κοινωνοί의 사업상 관계를 ‘동업자들’로 명확히 했습니다. ζωγρῶν의 생명 보존적 뉘앙스와 낚시 비유를 본문에 유지했으며, 그 다소 낯선 표현은 각주로 설명했습니다.
