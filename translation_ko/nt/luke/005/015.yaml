  verdict: revise
  source_fidelity: 원문의 미완료상(‘퍼져 나갔고’, ‘모여들었습니다’)과 치료의 수동 의미는 대체로 잘 반영되었습니다. 그러나 ἀκούειν에는 목적어가 명시되지 않았는데 ‘그분의 말씀’을 보충한 것은 원문보다 구체적입니다. 또한 ὄχλοι πολλοὶ는 ‘큰 무리’보다 ‘많은 무리’가 수적 복수성을 더 충실히 나타냅니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, ‘듣고 … 고침받기 위해 모여들었습니다’는 두 목적을 매끄럽게 연결합니다.
  terminology: λόγος περὶ αὐτοῦ는 이 문맥에서 ‘그분에 관한 소문’이 자연스럽습니다. 다만 ‘말’이나 ‘소식’이라는 어휘적 가능성은 각주로 보존하는 것이 좋습니다. θεραπεύεσθαι는 영적 의미를 덧붙이지 않고 ‘고침받다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘그분의 말씀을’이 원문에 없는 목적어를 보충합니다.
    rationale: ἀκούειν은 여기서 목적어 없이 쓰였으므로, 한국어에서도 ‘듣고’로 두어 원문의 비특정성을 유지하는 편이 안전합니다.
  - severity: low
    issue: ‘큰 무리’는 ὄχλοι πολλοὶ의 수적 강조를 충분히 반영하지 못합니다.
    rationale: πολλοί는 ‘많은’을 뜻하므로 ‘많은 무리’가 더 직접적입니다.
  - severity: low
    issue: λόγος의 대안적 번역 가능성을 나타내는 각주가 없습니다.
    rationale: 영어 감사 기록의 lexical-alternative 각주를 한국어에서도 유지하면 ‘소문’ 선택의 해석적 범위를 투명하게 보존할 수 있습니다.
