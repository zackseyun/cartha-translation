- from: 그러나 그분에 관한 소문은 더욱 퍼져 나갔고, 큰 무리가 그분의 말씀을 듣고 자기들의 병을 고침받기 위하여 모여들었습니다.
  to: 그런데 그분에 관한 소문은 더욱 퍼져 나갔고, 많은 무리가 듣고 자기들의 병을 고침받기 위해 모여들었습니다.[a]
  rationale: 원문에 없는 ‘그분의 말씀’을 삭제하여 ἀκούειν의 목적어를 특정하지 않았고, ‘큰 무리’를 ‘많은 무리’로 고쳐 πολλοί의 수적 의미를 반영했습니다. ‘소문’은 문맥상 적절하게 유지하되 λόγος의 어휘적 대안을 각주로 제시했습니다.
  reviewer_model: gpt-5.6-terra
