  source_fidelity: 핵심 의미는 대체로 충실하지만, 원문의 οὐδείς(‘아무도’)가 ‘사람은’으로 약화되었고, 끝의 인용 부호가 짝을 이루지 않아 수정이 필요합니다. χρηστός는 ‘좋다’로 적절히 옮겼습니다.
