  terminology: ‘묵은 포도주’, ‘새 포도주’는 문맥과 비유의 표현에 적절합니다. 본문은 비교급이 아닌 ‘좋다’를 유지하고, 알려진 이문 ‘더 좋다’는 각주로 처리해야 합니다.
