  source_fidelity: 초안은 θάμβος, περιέσχεν, ἐπὶ τῇ ἄγρᾳ, 그리고 복수 동사 συνέλαβον의 기본 의미를 대체로 반영합니다. 그러나 ‘물고기 떼’는 잡힌 물고기의 ‘어획/잡이’가 아니라 물속의 무리를 뜻할 수 있어 ἄγρα의 의미에 부정확하며, ‘그와 그와 함께 있던’은 중복되어 문장 구조가 어색합니다.
