  terminology: ‘놀라움’은 θάμβος에 적절하며, 특별한 신학 용어 문제는 없습니다. ἄγρα는 ‘물고기 떼’ 대신 그들이 잡아 올린 물고기라는 표현으로 문맥상 정확히 옮깁니다.
  issues:
