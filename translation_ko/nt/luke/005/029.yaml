  source_fidelity: 핵심 내용은 대체로 충실합니다. 다만 ‘세리들과 다른 사람들의 큰 무리’ 뒤의 ‘그들과 함께’는 한국어에서 바로 앞의 ‘세리들과 다른 사람들’을 가리키는 듯하여, 그 무리가 자기들끼리 함께 식사한다는 어색한 인상을 줄 수 있습니다. 원문의 복수 대명사 αὐτῶν의 지시 대상은 번역에서 단정하지 않고 각주로 보존하는 편이 안전합니다.
  naturalness: ‘식탁에 기대어 있었습니다’는 뜻은 전달하지만, 식사 장면에서는 ‘식탁에 기대어 앉아 있었습니다’가 더 자연스럽고 구체적입니다. 문장을 나누고 ‘많이 모여 있었습니다’로 옮기면 현대 표준어 합쇼체로 더 매끄럽습니다.
