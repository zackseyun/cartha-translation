  to: 그러나 인자[a]가 땅에서 죄를 용서할 권세가 있음을 너희가 알게 하려고—그분께서 중풍병자에게 말씀하셨습니다—“내가 네게 말한다. 일어나 네 작은 침상[b]을 들고 네 집으로 가라.”
  rationale: 그리스어의 ἵνα 목적절(‘너희가 알게 하려고’)과 뒤따르는 발화 서술을 한 문장으로 연결하여 원문의 논리와 인용 구조를 회복했습니다. ἐξουσία는 ‘권세’, ἀφιέναι ἁμαρτίας는 ‘죄를 용서하다’로 번역했으며, ‘인자’라는 칭호의 전통적 표현과 해석상 개방성을 보존했습니다.
