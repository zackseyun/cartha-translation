  source_fidelity: 그리스어의 미완료 동사구(ἦν + 현재분사)는 반복적·습관적 행동을 나타내며, 초안의 ‘기도하시곤 하였습니다’는 이 점을 대체로 잘 살립니다. 다만 ἐν ταῖς ἐρήμοις는 특정한 단수 ‘광야’라기보다 외딴/한적한 지역들을 가리키므로, ‘외딴 곳’이 더 자연스럽고 의미 범위도 적절합니다.
  naturalness: ‘그분께서는 … 하였습니다’는 주체 높임과 서술어 높임이 일관되지 않습니다. 현대 합쇼체에서는 ‘기도하시곤 하셨습니다’가 자연스럽습니다. ‘외딴 곳으로 물러가’는 한국어에서 이동·후퇴 동사와 자연스럽게 결합하면서 원문의 장소 표현을 무리 없이 반영합니다.
