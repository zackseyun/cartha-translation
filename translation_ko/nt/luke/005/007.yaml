  source_fidelity: 초안은 다른 배의 동료들에게 신호하여 도움을 요청하고, 두 배가 가득 차 가라앉게 된다는 기본 뜻을 대체로 반영합니다. 그러나 ‘두 배에 가득 채우니’는 목적어와 행위의 관계가 한국어에서 불분명하며, βυθίζεσθαι의 진행·결과를 ‘가라앉으려 했습니다’보다 더 자연스럽게 나타낼 필요가 있습니다.
  naturalness: ‘두 배를 가득 채우자’와 ‘가라앉을 지경이었습니다’로 고치면 현대 표준 한국어 합쇼체에서 문장 관계와 결과가 더 명료하고 자연스럽습니다.
  terminology: μετόχοις는 이 문맥에서 함께 일하는 어업상의 동업자/협력자를 가리키므로 ‘동업자들’이 적절합니다. κατένευσαν은 거리에서 하는 몸짓 신호라는 뜻을 살려 ‘손짓했습니다’로 옮겼습니다.
  issues:
