  source_fidelity: 첫 결과절의 능동형 σχίσει는 행동 주체가 새 옷을 찢는다는 뜻입니다. 초안의 ‘새 옷도 찢어지고’는 피동/상태 변화로 들려 행위 주체와 논리적 연결이 약해집니다. 또한 닫는 인용부호가 빠져 있습니다.
  naturalness: ‘비유로 말씀하셨습니다’도 이해되지만, 현대 표준어 성서 문체에서는 ‘비유를 들어 말씀하셨습니다’가 더 자연스럽습니다. ‘낡은 옷에 대지 않습니다’는 원문의 ‘put/place upon’을 과도하게 구체화하지 않으면서 자연스럽습니다.
  terminology: ‘비유’, ‘새 옷’, ‘낡은 옷’, ‘조각’은 παραβολή, ἱμάτιον, ἐπίβλημα의 문맥상 의미를 적절히 전달합니다. ‘어울리지 않을 것이다’는 συμφωνήσει의 적합성/조화 의미를 무리 없이 보존합니다.
  issues:
