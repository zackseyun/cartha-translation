  verdict: revise
  source_fidelity: The draft conveys the narrative sequence, Levi’s identity as a tax collector, his position at the collection point, and Jesus’ summons. However, 세관 usually denotes a modern customs office and is narrower than τελώνιον, which denotes a place for collecting taxes or tolls.
  naturalness: 이 일들 후에 is a literal but awkward Korean transition. 그 후에 is idiomatic in modern narrative Korean. The direct imperative should use the requested modern formal-polite 합쇼체 rather than 따르라.
  terminology: 세리 is an established and appropriate rendering of τελώνης. 세금 징수소 more accurately and naturally renders τελώνιον without limiting it to customs.
  issues:
  - severity: medium
    issue: 세관에 앉아 있는
    rationale: 세관 commonly means a customs office, whereas τελώνιον may be a tax- or toll-collection station more broadly. 세금 징수소 preserves the source’s scope.
  - severity: low
    issue: 이 일들 후에
    rationale: Though understandable, this is not idiomatic modern Korean. 그 후에 naturally carries Luke’s narrative transition.
  - severity: medium
    issue: 「나를 따르라.」
    rationale: 따르라 is a plain/archaic imperative and does not conform to the specified modern formal-polite 합쇼체. 나를 따르십시오 is a direct imperative in the requested register.
  revised_text: 그 후에 그분이 나가셔서 세금 징수소에 앉아 있는 레위라는 세리를 보시고 그에게 말씀하셨습니다. 「나를 따르십시오.」
