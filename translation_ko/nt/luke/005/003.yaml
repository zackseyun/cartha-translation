  text: 그분은 배들 가운데 시몬의 배 한 척에 올라타셔서, 그에게 배를 육지에서 조금 떨어지게 해 달라고 요청하셨습니다. 그리고 배에 앉으신 뒤, 그곳에서 무리들을 가르치고 계셨습니다.
