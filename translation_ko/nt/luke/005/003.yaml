review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그 두 배’는 본문의 ἓν τῶν πλοίων(‘배들 가운데 한 척’)과 맞지 않습니다. 또한 ‘육지에서 조금 떼어 달라’는 뜻은 통하지만, 배를 육지에서 조금 떨어지게 해 달라는 요청을 더 분명히 나타내는 편이 좋습니다. 미완료 과거 ἐδίδασκεν의 진행성을 ‘가르치고 계셨습니다’로 반영했습니다.
  naturalness: ‘배들 가운데 시몬의 배 한 척’과 ‘육지에서 조금 떨어지게 해 달라고’는 현대 표준어 합쇼체에서 자연스럽고 상황을 명료하게 전달합니다. ‘그곳에서’를 사용하여 ‘배에 앉으셔서 배에서’라는 반복을 피했습니다.
  terminology: πλοῖον은 갈릴리 호수의 작은 어선이라는 문맥에 맞게 ‘배/한 척’으로, ὄχλους는 복수형을 살려 ‘무리들’로 옮겼습니다. 소유를 나타내는 Σίμωνος는 ‘시몬의 배’로 자연스럽게 반영했습니다.
  issues:
  - severity: high
    issue: ‘그 두 배’
    rationale: 그리스어는 ‘배들 가운데 한 척’이라고 할 뿐 이 절에서 ‘두 배’라고 말하지 않습니다. 앞 절의 문맥 정보를 이 절의 표현으로 부당하게 한정합니다.
  - severity: medium
    issue: ‘육지에서 조금 떼어 달라’
    rationale: 의도는 전달되지만 무엇을 떼어 놓는지 생략되어 있습니다. ἐπαναγαγεῖν의 선박 이동을 ‘배를 ... 떨어지게’로 밝혀 주는 것이 충실합니다.
  - severity: low
    issue: ‘가르치셨습니다’
    rationale: 문법적으로 가능하나 ἐδίδασκεν의 미완료 과거가 나타내는 진행 중인 가르침은 ‘가르치고 계셨습니다’가 더 잘 드러냅니다.
  revised_text: 그분은 배들 가운데 시몬의 배 한 척에 올라타셔서, 그에게 배를 육지에서 조금 떨어지게 해 달라고 요청하셨습니다. 그리고 배에 앉으신 뒤, 그곳에서 무리들을 가르치고 계셨습니다.
