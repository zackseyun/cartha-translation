- from: 그분은 그 두 배 중 시몬의 배에 올라, 육지에서 조금 떼어 달라고 그에게 청하시고는, 배에 앉아 무리를 가르치셨습니다.
  to: 그분은 배들 가운데 시몬의 배 한 척에 올라타셔서, 그에게 배를 육지에서 조금 떨어지게 해 달라고 요청하셨습니다. 그리고 배에 앉으신 뒤, 그곳에서 무리들을 가르치고 계셨습니다.
  rationale: 본문의 수 표현을 ‘배들 가운데 ... 한 척’으로 바로잡고, 배를 육지에서 조금 떨어지게 하라는 요청을 명시했습니다. 순차적 행위와 가르침의 진행성을 자연스러운 합쇼체로 반영했습니다.
