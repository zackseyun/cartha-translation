  text: 보십시오, 남자들이 마비된 한 남자를 침상[a]에 실어 나르고 있었고, 그를 안으로 들여 그분[b] 앞에 두려고 하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들것’ 또는 ‘긴 의자’. 그리스어 κλίνη는 침상 같은 깔개나 긴 의자를 가리킬 수 있습니다.
    reason: κλίνη의 가능한 어휘적 범위를 제시하되, 본문의 기본 번역을 과도하게 한정하지 않습니다.
  - marker: b
    text: 문맥상 예수를 가리킵니다.
    reason: 그리스어는 이름 대신 대명사 αὐτοῦ(‘그분’)를 사용하므로 본문에서는 대명사를 보존하고 문맥상 지시 대상은 각주로 밝혔습니다.
