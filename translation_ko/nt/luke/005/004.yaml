    rationale: Ἐπανάγαγε는 시몬 한 사람에게 하는 단수 명령이고, χαλάσατε 및 ὑμῶν은 복수입니다. 한국어에서 ‘시몬아’와 ‘여러분의’를 보충하여 이 전환을 자연스럽게 드러낼 수 있습니다.
  - severity: medium
