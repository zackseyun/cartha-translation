  naturalness: ‘그물을 내려 잡으라’는 현대 표준 한국어에서 목적어가 생략되어 다소 부자연스럽습니다. 시몬에게는 단수로, 함께 있는 이들에게는 복수로 각각 직접 부르는 표현이 자연스럽고 원문의 수 전환도 보존합니다.
  terminology: ‘말씀을 마치신 뒤’, ‘깊은 데’, ‘그물을 내리다’는 현대 합쇼체 성경 문맥에 자연스럽습니다. ἄγρα의 어획 의미는 ‘고기를 잡으십시오’로 명료하게 표현했습니다.
  issues:
