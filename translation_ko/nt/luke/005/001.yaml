  source_fidelity: 무리가 그분께 몰려들어 말씀을 듣는 상황, 그분이 게네사렛 호숫가에 서 계신 모습을 충실히 옮겼습니다. ἐν τῷ + 부정사의 시간 관계는 ‘…있을 때’로 자연스럽게 반영되었고, ἐπικεῖσθαι의 물리적으로 밀려드는 의미도 ‘몰려들어’로 충분히 전달됩니다. 누가의 사건 도입 공식 Ἐγένετο δέ는 한국어 문장에서는 별도의 직역 없이 시간절 구성으로 자연스럽게 흡수될 수 있습니다.
