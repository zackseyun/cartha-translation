  source_fidelity: 그리스어의 분사 구조, 복수 소유 대명사(‘그들의’), 직접 호격, 죄의 용서에 관한 완료 수동 직설법의 선언을 충실히 반영합니다. 한국어 ‘죄’의 집합적 단수는 원문의 복수형을 의미상 자연스럽게 포괄하며, 용서의 시점이나 작동 방식을 과도하게 해석하지 않습니다.
