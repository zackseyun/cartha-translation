source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
  footnotes:
  - marker: a
    text: Or 'not finding how to bring him in because of the crowd.' The Greek idiom can emphasize the manner or means as well as the access route.
    reason: lexical_alternative
  - marker: b
    text: That is, through the roof tiles. Luke's wording reflects a tiled roof structure.
    reason: cultural_note
  - marker: c
    text: Or 'with the little bed' or 'with the stretcher.' The Greek term refers to a small bed or sleeping mat.
    reason: lexical_alternative
translation:
  language: ko
  text: 무리 때문에 그를 어떻게 들여갈지 찾지 못하자[a], 그들은 지붕에 올라가 기와를 통해 그를 침상째로[c] 한가운데[b], 예수님 앞에 내려보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무리 때문에 그를 어떤 길로 들여갈지 찾지 못하자.” 그리스어 표현은 방법과 들어갈 통로를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 지붕의 기와를 통해서입니다. 누가는 기와로 된 지붕 구조를 반영하는 표현을 사용합니다.
    reason: cultural_note
  - marker: c
    text: 또는 “작은 침상째로” 또는 “들것째로.” 그리스어는 작은 침상이나 잠자리를 가리킵니다.
    reason: lexical_alternative
