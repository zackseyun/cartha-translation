review_pass:
  verdict: revise
  source_fidelity: 초안은 군중 때문에 प्रवेश시키지 못했다는 인과관계, 지붕에 올라간 행동, 침상과 함께 아래로 내린 행동을 대체로 반영합니다. 그러나 ‘기와를 뜯고’는 κεράμων(기와들)을 ‘통해’라는 표현보다 더 구체적으로 기와를 제거했다는 행동을 추가합니다. 또한 ‘사람들 한가운데’는 원문의 εἰς τὸ μέσον에 없는 ‘사람들’을 보충합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, ‘어떻게 들여갈지’는 ποίας의 방법·통로 양쪽 뉘앙스를 무리 없이 살립니다. ‘내려보냈습니다’는 지붕 위에서 아래로 내리는 καθῆκαν을 자연스럽게 옮깁니다.
  terminology: δῶμα는 ‘지붕’, κέραμοι는 ‘기와’, κλινίδιον은 문맥상 ‘침상’으로 옮겼습니다. ‘예수님’은 한국어 성경 문체에서 자연스러운 존칭형 이름 표기입니다.
  issues:
  - severity: medium
    issue: ‘기와를 뜯고’가 기와를 제거했다는 행위를 첨가함
    rationale: διὰ τῶν κεράμων은 문자적으로 ‘기와들을 통하여’이며, 본문 자체는 기와를 뜯어냈다고 명시하지 않습니다. 논쟁될 수 있는 건축적 세부는 본문에 첨가하지 않는 편이 안전합니다.
  - severity: low
    issue: ‘사람들 한가운데’의 ‘사람들’ 보충
    rationale: εἰς τὸ μέσον은 ‘한가운데로’를 뜻할 뿐, 그 한가운데가 사람들 가운데임을 명시하지 않습니다.
  revised_text: 무리 때문에 그를 어떻게 들여갈지 찾지 못하자[a], 그들은 지붕에 올라가 기와를 통해 그를 침상째로[c] 한가운데[b], 예수님 앞에 내려보냈습니다.
