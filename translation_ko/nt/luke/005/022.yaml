  naturalness: '''너희 마음속으로 그렇게 의논하느냐'' is understandable but less natural in modern formal-polite Korean. ''너희 마음속으로 그런 생각을 하고 있습니까'' is idiomatic while retaining the inward, ongoing deliberative sense. The direct question is rendered in 합쇼체.'
  terminology: '''예수께서,'' ''마음,'' and the respectful subject honorific are appropriate. A footnote preserves the lexical alternative of ἐπιγνοὺς (''knowing their reasonings'') without claiming a mechanism for Jesus'' knowledge.'
