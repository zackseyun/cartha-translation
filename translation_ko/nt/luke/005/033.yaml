  terminology: ‘요한’, ‘바리새인’, ‘금식’, ‘기도’, ‘제자들’은 성경 문맥에서 통용되는 적절한 용어입니다. ‘그분께’와 직접화법의 ‘당신의’는 현재의 존대 서술 및 대화 상황 안에서 일관됩니다.
