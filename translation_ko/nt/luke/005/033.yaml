  source_fidelity: SBLGNT의 문장 구조와 의미를 충실히 옮겼습니다. ‘자주 금식하며’는 νηστεύουσιν πυκνά를, ‘기도를 드리고’는 δεήσεις ποιοῦνται를 적절히 반영합니다. 바리새인들과 예수의 경우에 그리스어에서 생략된 ‘제자들’을 한국어 문맥상 명시한 것은 의미를 변경하지 않으면서 자연스러운 이해를 돕습니다.
