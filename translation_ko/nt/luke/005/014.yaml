  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
  footnotes:
  - marker: a
    text: Or 'as a testimony to them'; the phrase may refer to testimony to the priests or others, and some understand it as evidence against them.
    reason: alternative_reading
  - marker: b
    text: See Leviticus 14 for the offering Moses commanded for cleansing from leprosy.
    reason: cross_reference
