id: LUK.5.14
reference: Luke 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
  footnotes:
  - marker: a
    text: Or 'as a testimony to them'; the phrase may refer to testimony to the priests or others, and some understand it as evidence against them.
    reason: alternative_reading
  - marker: b
    text: See Leviticus 14 for the offering Moses commanded for cleansing from leprosy.
    reason: cross_reference
translation:
  language: ko
  text: 그분은 그에게 아무에게도 말하지 말라고 명령하셨습니다. 그리고 말씀하셨습니다. 「가서 자신을 제사장에게 보이시고, 모세가 명한 대로 자신의 정결을 위하여 제물을 드리십시오. 그것이 그들에게 증거가 되도록 하십시오[a][b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ‘그들에게’가 누구를 가리키는지는 명시되어 있지 않습니다. 제사장들, 다른 사람들, 또는 더 넓은 무리를 가리킨다고 이해되기도 합니다. ‘증거’는 그들에게 보이는 증거나, 일부 해석에 따르면 그들을 향한 증거라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 모세가 정결을 위하여 명한 제물에 대해서는 레위기 14장을 보십시오.
    reason: cross_reference
