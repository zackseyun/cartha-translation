review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the main sequence, but it adds a second speech verb ('말씀하셨습니다') after παρήγγειλεν ('commanded/ordered') and expands περὶ τοῦ καθαρισμοῦ σου ('for your cleansing') into '정결 예식을 위한,' which is more specific than the Greek. The revised wording retains the unspecified referent and force of 'to them.'
  naturalness: The duplicate construction '명령하시고 말씀하셨습니다' is unnatural and unnecessarily repetitive. A single narrative verb followed by the command is clear and natural in modern formal Korean.
  terminology: '''제사장,'' ''정결,'' ''제물,'' and ''증거'' are appropriate. ''네 정결을 위하여'' directly represents the personal possessive in the Greek without adding a ritual category.'
  issues:
  - severity: medium
    issue: Duplicate speech attribution
    rationale: παρήγγειλεν is represented by '명령하셨습니다'; the additional '말씀하셨습니다' has no corresponding Greek verb and should be removed.
  - severity: medium
    issue: Added specification in '정결 예식'
    rationale: The Greek refers to an offering 'for your cleansing,' not explicitly to a 'cleansing ceremony.' The revision avoids this added interpretive specification.
  - severity: low
    issue: No note preserves the ambiguity of '그들에게'
    rationale: The referent of αὐτοῖς and the nuance of μαρτύριον are not explicitly defined in Greek. A note can preserve this ambiguity without imposing an interpretation.
  revised_text: 그분께서 그에게 아무에게도 말하지 말라고 명령하셨습니다. 「그러나 가서 네 자신을 제사장에게 보이고, 네 정결을 위하여 모세가 명령한 대로 제물을 드려라. 그것이 그들에게 증거가 되게 하여라.[a]」
  revised_footnotes:
  - marker: a
    text: ‘그들에게’가 누구를 가리키는지와 ‘증거’의 구체적인 의미는 본문에 명시되어 있지 않습니다. 제사장들 또는 다른 이들에게 하는 증거로 이해될 수 있으며, 일부는 이를 그들에 대한 증거로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 정결을 위한 모세의 명령에 관해서는 레위기 14장을 보십시오.
    reason: cross_reference
  revision_rationale: Removed the unsupported second speech verb and replaced the interpretively expanded '정결 예식을 위한 제물' with a direct rendering, '네 정결을 위하여 ... 제물을.' The final clause retains the Greek ambiguity through '그들에게 증거가 되게 하여라,' with a note explaining rather than resolving its referent and force. A cross-reference note is supplied for the Mosaic prescription, though it need not be anchored in the verse text.
