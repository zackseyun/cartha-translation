review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition, the priestly inspection, Mosaic command, and the purpose clause. However, "정결 예식을 위한 제물" adds the specific notion of a ritual/ceremony not stated by περὶ τοῦ καθαρισμοῦ σου. "그들에게 증거가 되게" is substantially faithful, but the source's referent and nuance remain deliberately unspecified and merit an anchored note.
  naturalness: '"명령하시고 말씀하셨습니다" is redundant in Korean and makes an indirect command followed by direct speech sound awkward. Separating the prohibition from the quoted further instructions is natural modern formal-polite Korean.'
  terminology: '"정결" appropriately renders καθαρισμός in this legal-cultic context, and "제사장" and "제물" are standard. "증거" is a natural rendering of μαρτύριον when accompanied by a note preserving its disputed force and referent.'
  issues:
  - severity: medium
    issue: Redundant reporting construction
    rationale: '"명령하시고 말씀하셨습니다" combines two reporting verbs unnecessarily. The Greek has one verb, παρήγγειλεν, governing both the prohibition and the subsequent imperatives.'
  - severity: medium
    issue: Added 'ritual ceremony' language
    rationale: '"정결 예식" narrows/expands τοῦ καθαρισμοῦ σου beyond ''your cleansing/purification.'' The verse refers to the required offering in connection with cleansing, without itself naming it an ''observance'' or ''ceremony.'''
  - severity: low
    issue: Unanchored ambiguity in 'to them'
    rationale: αὐτοῖς does not identify who 'them' are, and εἰς μαρτύριον can be understood in several ways. A note should preserve this rather than assigning a referent or adversarial force.
  revised_text: 그분은 그에게 아무에게도 말하지 말라고 명령하셨습니다. 그리고 말씀하셨습니다. 「가서 자신을 제사장에게 보이시고, 모세가 명한 대로 자신의 정결을 위하여 제물을 드리십시오. 그것이 그들에게 증거가 되도록 하십시오[a][b].」
  revised_footnotes:
  - marker: a
    text: 그리스어의 ‘그들에게’가 누구를 가리키는지는 명시되어 있지 않습니다. 제사장들, 다른 사람들, 또는 더 넓은 무리를 가리킨다고 이해되기도 합니다. ‘증거’는 그들에게 보이는 증거나, 일부 해석에 따르면 그들을 향한 증거라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 모세가 정결을 위하여 명한 제물에 대해서는 레위기 14장을 보십시오.
    reason: cross_reference
  revision_rationale: The revision removes redundant Korean reporting language, avoids adding 'ritual ceremony' to the source, retains the generic sacrificial object required by natural Korean, and supplies notes at the relevant anchors. The referent and force of ‘to them’ remain unresolved, as in the Greek.
