  text: 그분께서 그에게 아무에게도 말하지 말도록 명령하시고 말씀하셨습니다. 「가서 자신을 제사장에게 보이고, 모세가 명한 대로 정결 예식을 위한 제물을 드려, 그들에게 증거가 되게 하라.」
  philosophy: optimal-equivalence
