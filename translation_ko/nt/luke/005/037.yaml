    rationale: εἰ δὲ μήγε는 ‘그렇지 않으면’이라는 결과 조건을 나타냅니다. ‘그렇게 하면’도 뜻은 통하지만, ‘그렇지 않으면’이 원문의 논리 관계를 더 분명히 드러냅니다.
