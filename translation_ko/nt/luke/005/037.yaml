  terminology: οἶνος νέος는 ‘새 포도주’, ἀσκοί는 문맥상 ‘가죽 부대’, ἀπολοῦνται는 용도를 잃는 뜻의 ‘못 쓰게 됩니다’로 적절합니다. 별도 각주는 필요하지 않습니다.
