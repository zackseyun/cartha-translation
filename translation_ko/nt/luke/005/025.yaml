  source_fidelity: 초안은 παραχρῆμα, ἐνώπιον αὐτῶν, ἄρας, εἰς τὸν οἶκον αὐτοῦ, δοξάζων τὸν θεόν의 핵심 의미를 대체로 충실히 옮겼습니다. 다만 「가며 하나님께 영광을 돌렸습니다」는 연결 어미와 문장 종결의 결합 때문에, 하나님께 영광을 돌린 행위가 집으로 가는 것과 동시적으로 이어진다는 δοξάζων의 기능을 다소 불명료하게 만듭니다.
  naturalness: 「하나님께 영광을 돌리며 자기 집으로 갔습니다」가 현대 표준 한국어 합쇼체 서술에서 더 자연스럽고, 행위들의 순서 및 마지막 동반 상황을 명료하게 드러냅니다. 쉼표로 분절하면 긴 동작 연쇄의 가독성도 좋아집니다.
  terminology: 「하나님께 영광을 돌리다」는 δοξάζειν τὸν θεόν에 알맞은 자연스럽고 신학적으로 비특수적인 표현입니다. ἐφ’ ὃ κατέκειτο는 본문에서 특정 물건을 단정하지 않고 「자신이 누워 있던 것」으로 유지합니다. 영어 감사 추적의 어휘 대안을 반영하여 ‘깔개’ 가능성을 각주로 제시합니다.
  issues:
  - severity: medium
    issue: 「가며 하나님께 영광을 돌렸습니다」의 연결 및 종결 관계가 불명료합니다.
    rationale: δοξάζων은 그가 집으로 가는 가운데 하나님께 영광을 돌렸음을 나타내는 현재분사입니다. 수정안은 이를 「영광을 돌리며 ... 갔습니다」로 자연스럽게 연결하여 원문의 동반적 뉘앙스와 한국어 문장 구조를 함께 보존합니다.
  revised_text: 그는 즉시 그들 앞에서 일어나, 자신이 누워 있던 것을 들고, 하나님께 영광을 돌리며 자기 집으로 갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그가 누워 있던 깔개’. 직역하면 ‘그가 누워 있던 것’.
    reason: lexical_alternative
  revision_rationale: 동작의 핵심 순서는 유지하되, 현재분사 δοξάζων이 나타내는 동반 상황을 현대 한국어로 명료하게 표현하도록 어순을 조정했습니다. 원문이 이 절에서 물건의 명칭을 명시하지 않으므로 본문은 포괄적으로 두고, 문맥상 가능한 ‘깔개’를 각주에만 제시했습니다.
