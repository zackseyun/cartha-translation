  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
  footnotes:
  - marker: a
    text: Or 'You still lack one thing.' The Greek more literally says, 'One thing still lacks for you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'treasure in the heavens.' Greek has the plural 'heavens,' but English idiom commonly uses the singular 'heaven' here.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 이 말씀을 들으시고 그에게 말씀하셨습니다. “당신에게는 아직 한 가지가 부족합니다. 가지고 있는 것을 모두 팔아 가난한 이들에게 나누어 주십시오. 그러면 하늘에 보화를 얻게 될 것입니다. 그리고 와서 나를 따르십시오.”
  philosophy: optimal-equivalence
