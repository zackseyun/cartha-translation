  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
  footnotes:
  - marker: a
    text: Or, more literally, 'through a needle's eye.'
    reason: lexical_alternative
  - marker: b
    text: Some have proposed interpretive explanations such as a narrow gate called 'the needle's eye' or the sense 'rope' instead of 'camel,' but the Greek text here reads 'camel.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 낙타가 바늘귀로 들어가는 것이 부자가 하나님의 나라에 들어가는 것보다 더 쉽기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “바늘의 구멍을 통하여.”
    reason: ‘바늘귀’는 τρῆμα βελόνης의 자연스러운 한국어 관용 표현이며, 직역적 표현을 함께 제시합니다.
  - marker: b
    text: 어떤 이들은 ‘바늘귀’라는 이름의 좁은 문을 가리킨다거나 ‘낙타’ 대신 ‘밧줄’을 뜻한다고 해석하기도 하지만, 여기의 그리스어 본문은 ‘낙타’를 읽습니다.
    reason: 후대의 해석적 설명을 본문에 도입하지 않으면서, 본문의 κάμηλον(‘낙타’)을 분명히 합니다.
