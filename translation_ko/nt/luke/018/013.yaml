  to: 그러나 그 세리는 멀찍이 서서 눈을 들어 하늘을 바라보려고도 하지 않고, 계속 자기 가슴을 치며 이렇게 말했습니다. 「하나님, 죄인인 저에게 자비를 베풀어 주십시오.」[a]
