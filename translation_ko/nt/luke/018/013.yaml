  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
  footnotes:
  - marker: a
    text: Or "be propitious to me"; the verb is related to language of atonement and propitiation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 세리는 멀찍이 서서 눈을 들어 하늘을 바라보려고도 하지 않고, 계속 자기 가슴을 치며 이렇게 말했습니다. 「하나님, 죄인인 저에게 자비를 베풀어 주십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저에게 은혜를 베풀어 주십시오.” 여기의 동사는 속죄와 화목의 언어와 관련이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱλάσθητί
  english_pob_choice: be merciful
  chosen_korean: 자비를 베풀어 주십시오
  alternatives_korean:
  - 속죄해 주십시오
  - 화목케 하여 주십시오
  lexicon: BDAG
  rationale: ἱλάσκομαι는 단순한 자비를 넘어 속죄·화목의 제의적 함의를 띤다. 다만 한국어로 「속죄해 주소서」는 부자연스럽고, 자비의 호소가 본문 의도를 일차적으로 담는다. 함의는 신학적 각주의 대상.
