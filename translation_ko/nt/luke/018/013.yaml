review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the tax collector, his distance, his downwardly humbled posture, chest-beating, and plea for mercy. However, ‘감히 … 못하고’ recasts οὐκ ἤθελεν (‘was not willing/would not’) as inability, and ‘치며’ does not convey the imperfect ἔτυπτε, which depicts continued or repeated beating.
  naturalness: The Korean is generally clear and appropriately formal-polite. ‘눈을 들어 하늘을 바라보려고도 하지 않고’ is natural while more closely retaining the Greek volitional expression. ‘계속 가슴을 치며’ naturally represents the ongoing action.
  terminology: ‘세리,’ ‘하나님,’ ‘죄인인 저,’ and ‘자비를 베풀어 주십시오’ are suitable standard Korean choices. A footnote should retain the propitiatory/atonement-related lexical nuance of ἱλάσθητί without making a technical interpretation part of the main text.
  issues:
  - severity: medium
    issue: Volitional force of οὐκ ἤθελεν is weakened.
    rationale: ‘감히 … 못하고’ means that he dared not/could not, whereas the Greek states that he was unwilling even to lift his eyes. The humility is contextual, but the wording should preserve the stated volition.
  - severity: low
    issue: The imperfect aspect of ἔτυπτε is not represented.
    rationale: ‘치며’ can describe a simultaneous action but does not clearly indicate the repeated or ongoing chest-beating conveyed by the imperfect.
  - severity: low
    issue: The lexical-theological nuance of ἱλάσθητί is not footnoted.
    rationale: The English audit trail preserves ‘be propitious to me’ and the verb’s atonement/propitiation association in a note. A concise Korean note can preserve this without overloading the text.
  revised_text: 그러나 그 세리는 멀찍이 서서 눈을 들어 하늘을 바라보려고도 하지 않고, 계속 자기 가슴을 치며 이렇게 말했습니다. 「하나님, 죄인인 저에게 자비를 베풀어 주십시오.」[a]
  revised_footnotes:
