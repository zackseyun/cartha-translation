  source_fidelity: ‘다시 보게 되었습니다’는 ἀνέβλεψεν이 회복을 뜻할 수 있다는 점에서는 가능한 번역이지만, 그가 이전에 보았다는 이력을 한국어에서 더 직접적으로 암시합니다. 본문 자체는 그 이력을 명시하지 않으므로, ‘보게 되었습니다’가 문맥상의 치유를 유지하면서도 불필요한 구체화를 피합니다. 나머지는 παραχρῆμα, ἠκολούθει의 지속적 배경 행동, δοξάζων, 그리고 집합적 ‘모든 백성’의 반응을 충실히 전달합니다.
  naturalness: 합쇼체로 자연스럽고, ‘하나님께 영광을 돌리며 그분을 따라갔습니다’와 ‘이것을 본 모든 백성’은 현대 표준 한국어 성경 문체에서 무난합니다. 두 번째 문두의 ‘그리고’는 헬라어의 연결을 반영하지만 한국어에서는 생략하는 편이 더 매끄럽습니다.
  terminology: ‘하나님’, ‘영광을 돌리다’, ‘찬양을 드리다’, ‘백성’은 표준적인 성경 한국어 용례이며 신학적으로 과도한 해석을 더하지 않습니다. 영어 감사 기록의 ‘received his sight’와 ‘was following him’의 선택도 각각 ‘보게 되었습니다’와 ‘따라갔습니다’/분사구문으로 적절히 반영됩니다.
