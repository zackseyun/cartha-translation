  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
  footnotes:
  - marker: a
    text: Or "justified in comparison with that one"; the phrase contrasts this man with the other worshiper.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러분에게 말합니다. 이 사람은 저 사람보다[a] 의롭다 하심을 받고 자기 집으로 내려갔습니다. 누구든지 자신을 높이는 자는 낮아질 것이며, 자신을 낮추는 자는 높아질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저 사람과 비교하여.” 이 표현은 이 사람과 다른 예배자를 대조합니다.
    reason: παρ’ ἐκεῖνον의 비교적 용법에 대한 영어 POB 감사 기록의 lexical alternative를 보존합니다.
