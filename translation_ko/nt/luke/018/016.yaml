  verdict: revise
  source_fidelity: The draft correctly identifies the children as the object of Jesus’ summons and accurately renders the commands to allow them to come and not hinder them. Revising ‘자기에게로’ to ‘곁으로’ gives a more natural Korean expression of προσεκαλέσατο αὐτὰ while retaining the sense of calling them to himself. ‘이와 같은 이들’ preserves the representative scope of τῶν τοιούτων without specifying which qualities are intended.
  naturalness: The sentence is natural in modern formal-polite Korean after replacing the somewhat stiff reflexive expression ‘자기에게로’ with ‘곁으로.’ The quotation also requires a closing quotation mark.
  terminology: ‘하나님의 나라’ is an established and appropriate rendering of ἡ βασιλεία τοῦ θεοῦ. ‘이와 같은 이들’ is suitably inclusive and does not impose an interpretive description such as ‘childlike people.’
  issues:
