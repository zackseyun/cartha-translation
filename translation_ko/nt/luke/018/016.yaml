    issue: The direct-speech quotation is not closed.
    rationale: The Korean translation text ends without a closing Korean quotation mark, producing a structural punctuation error.
  - severity: low
    issue: ‘자기에게로’ is less natural than an idiomatic Korean expression for Jesus’ calling the children to himself.
    rationale: Although intelligible, ‘곁으로 부르시며’ more naturally conveys προσεκαλέσατο αὐτὰ in this context without adding meaning.
  revised_text: 그러나 예수께서는 어린아이들을 곁으로 부르시며 말씀하셨습니다. “어린아이들이 내게 오도록 허락하고 막지 마십시오. 하나님의 나라는 이와 같은 이들의 것이기 때문입니다.”
