    issue: The rendering ‘그들의 정당함을 베푸실’ misstates and unnaturally expresses ποιήσει τὴν ἐκδίκησιν αὐτῶν.
    rationale: ἐκδίκησις in this immediate legal context denotes justice done for, or vindication of, the people concerned. ‘정당함’ describes a quality of persons or claims, not the judicial action that God performs.
  - severity: medium
    issue: The draft contains an unmatched closing quotation mark (」).
    rationale: There is no corresponding opening quotation mark; this is a structural punctuation error.
  - severity: low
    issue: The interpretively significant lexical alternatives represented in the English audit trail are absent.
    rationale: Notes on ‘정의’ and ‘믿음’ preserve the source word’s relevant semantic range without narrowing the translation.
