  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
  footnotes:
  - marker: a
    text: Or 'he will vindicate them' or 'he will grant them justice.' The Greek term can carry the sense of legal vindication or justice done on behalf of someone.
    reason: lexical_alternative
  - marker: b
    text: Or 'faithfulness' or 'trust.' The Greek word can denote faith, trust, or faithfulness; the main text keeps the broader rendering 'faith.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 여러분에게 말합니다. 그분께서는 속히 그들에게 정의를 이루어 주실 것입니다[a]. 그러나 인자가 오실 때에, 과연 이 땅에서 믿음을 찾으시겠습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 억울함을 풀어 주실 것입니다’, ‘그들을 변호해 주실 것입니다’. 그리스어는 법적 변호 또는 그들을 위한 정의의 실현을 뜻할 수 있습니다.
    reason: ἐκδίκησις의 법적 정의·변호·원한 해소의 의미 범위를 보존합니다.
  - marker: b
    text: 또는 ‘신뢰’ 또는 ‘신실함’. 그리스어는 믿음, 신뢰, 또는 신실함을 뜻할 수 있습니다.
    reason: πίστις의 폭넓은 의미와 문맥상 가능한 뉘앙스를 보존합니다.
