  source_fidelity: 'The draft conveys the main contrast and retains the title ‘인자’ and the rhetorical force of ἆρα (‘과연’). However, ‘그들의 정당함을 베푸실’ is not a natural or sufficiently accurate rendering of ποιήσει τὴν ἐκδίκησιν αὐτῶν: the phrase concerns God’s bringing about justice/vindication for them, rather than bestowing their ‘rightness.’'
  naturalness: ‘정당함을 베푸실’ is awkward in modern Korean. ‘그들에게 정의를 이루어 주실 것입니다’ is clear, formal-polite, and preserves the judicial-redress sense. The unmatched closing quotation mark in the draft must also be removed.
