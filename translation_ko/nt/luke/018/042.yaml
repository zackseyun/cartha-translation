    text: 또는 “시력을 되찾으십시오.” 그리스어 명령형은 치유의 문맥에서 다시 보게 되는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “당신의 믿음이 당신을 낫게 했습니다” 또는 “당신을 고쳤습니다.” 그리스어 동사는 구원뿐 아니라 치유를 가리킬 수도 있습니다.
    reason: alternative_reading
