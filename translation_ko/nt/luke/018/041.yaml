- from: 「당신은 내가 무엇을 해 주기를 원합니까?」 그가 말했습니다. 「주여, 다시 보게 해 주십시오.」
  to: 「내가 무엇을 해 주기를 원하십니까?」 그가 말했습니다. 「주님[a], 제가 다시 볼 수 있게 해 주십시오[b].」
  rationale: 현대 합쇼체의 자연스러움을 위해 부자연스러운 2인칭 대명사를 생략하고 ‘주여’를 ‘주님’으로 조정했습니다. 원문의 요청형 ἵνα ἀναβλέψω는 한국어에서 자연스러운 청원인 ‘제가 다시 볼 수 있게 해 주십시오’로 옮겼습니다. κύριε의 존칭 범위와 ἀναβλέψω의 시력 회복 의미는 올바른 위치의 각주로 보존했습니다.
