  source_fidelity: 핵심 의미는 대체로 옮겼으나, 첫 질문의 ‘당신은’은 현대 한국어 대화에서 부자연스럽고 대립적으로 들릴 수 있습니다. 또한 ‘주여’는 현대 표준어 합쇼체의 자연스러운 직접 화법으로는 다소 고풍스럽습니다. ἀναβλέψω의 회복 의미는 ‘다시 볼 수 있게’로 명료하게 드러내는 것이 좋습니다.
  naturalness: ‘내가 무엇을 해 주기를 원하십니까?’는 수혜자 σοι를 한국어의 자연스러운 생략으로 처리하면서도 합쇼체 대화에 맞습니다. ‘주님’과 ‘제가 다시 볼 수 있게 해 주십시오’도 현대적이며 정중한 직접 요청으로 자연스럽습니다.
  terminology: κύριε는 프로젝트 기본 원칙에 따라 ‘주님’으로 옮기되, 이 호칭이 단순한 존칭으로도 쓰일 수 있음을 각주로 보존합니다. ἀναβλέψω는 치유 문맥에서 시력 회복을 뜻하므로 ‘다시 볼 수 있게’로 번역하고 대안 표현을 각주에 제시합니다.
