  source_fidelity: 개정안은 δέ의 약한 연결을 한국어 문장 흐름에 과도하게 드러내지 않으면서, ἔλεγεν의 진행적 과거를 ‘말씀하고 계셨습니다’로 반영합니다. 또한 αὐτούς를 ‘그들에게’ 및 종속절의 주어로 명시하고, δεῖν의 필요/당위와 πάντοτε의 지속성을 보존합니다.
  naturalness: 초안의 ‘…안 된다는 것에 대하여 한 비유를’은 조사 결합과 어순이 다소 부자연스럽습니다. ‘…말아야 한다는 것을 비유로’가 현대 표준어 합쇼체에서 자연스럽고 명료합니다.
  terminology: παραβολή는 문맥상 일관되게 ‘비유’로 옮겼습니다. προσεύχεσθαι는 ‘기도하다’, ἐγκακεῖν은 본문의 간결한 관용 표현인 ‘낙심하다’로 옮기고, 가능한 어휘적 대안을 각주로 제시합니다.
