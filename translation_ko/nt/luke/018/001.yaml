    rationale: πρὸς τὸ δεῖν … 및 παραβολή의 관계는 ‘…말아야 한다는 것을 비유로 말씀하다’로 표현하는 것이 자연스럽고 원문의 교육적 목적을 더 정확히 드러냅니다.
