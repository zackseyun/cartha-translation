  source_fidelity: 수정안은 ἐκδίκησιν의 법정적 구제/공의의 뜻을 ‘공의를 이루어 주다’로 살리고, ‘밤낮으로 자신에게 부르짖는’이 택하신 이들을 수식하도록 바로잡습니다. 마지막 절은 본문의 문맥상 ‘오래 지체하다’로 옮기되, μακροθυμεῖ ἐπ’ αὐτοῖς의 ‘오래 참다/인내하다’ 해석 가능성은 각주에 보존합니다.
  naturalness: 초안의 ‘정당함을 베풀다’와 ‘오래 참고만 계시다’는 현대 표준어에서 부자연스럽거나 원문에 없는 제한(‘만’)을 더합니다. 수정안은 합쇼체의 자연스러운 수사의문문으로 정리했습니다.
  terminology: ‘택하신 이들’은 ἐκλεκτῶν의 명사적 용법을 자연스럽게 반영하며, 특정 교파적 의미를 덧붙이지 않습니다. ‘공의를 이루어 주다’는 이 문맥의 법적 정의와 구제를 나타냅니다.
