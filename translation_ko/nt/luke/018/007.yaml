    issue: ‘정당함을 베풀다’
    rationale: ἐκδίκησιν은 추상적 ‘정당함’보다 법적 공의, 권리의 구제 또는 신원의 뜻입니다. 해당 표현은 한국어로도 부자연스럽습니다.
