  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
  footnotes:
  - marker: a
    text: Or "all the things written by the prophets for the Son of Man"; the Greek construction can be taken more literally, but here likely means what the prophets wrote concerning him.
    reason: alternative_reading
translation:
  language: ko
  text: 그분께서는 열두 사람을 따로 데리시고 그들에게 말씀하셨습니다. 「보십시오, 우리는 예루살렘으로 올라가고 있습니다. 예언자들을 통하여 기록된, 인자에 관한[a] 모든 것이 성취될 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문자적으로 ‘인자를 위해’. 그리스어 표현은 더 문자적으로 옮길 수 있으나, 여기서는 예언자들이 인자에 관하여 기록한 모든 것을 가리키는 뜻으로 보입니다.
    reason: alternative_reading
