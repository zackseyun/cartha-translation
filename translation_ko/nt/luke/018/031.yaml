  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τοὺς δώδεκα는 본문에서 단지 ‘열두 사람/열둘’로 되어 있으므로 ‘열두 제자’는 원문에 없는 명사를 보탭니다. 또한 τῷ υἱῷ τοῦ ἀνθρώπου의 여격은 문맥상 ‘인자에 관하여’가 자연스럽지만, 더 문자적으로는 ‘인자를 위해’로도 이해될 수 있어 각주로 남기는 것이 적절합니다.
  naturalness: 합쇼체는 자연스럽습니다. ‘예언자들을 통해 기록된 모든 것’은 이해 가능하나, ‘예언자들을 통하여 기록된, 인자에 관한 모든 것’으로 어순을 조정하면 수식 관계가 더 분명합니다. 인용부호의 닫는 부호도 필요합니다.
  terminology: ‘인자’, ‘예언자들’, ‘예루살렘’은 적절합니다. ‘성취될 것입니다’는 예언의 성취라는 문맥에서 ‘이루어질 것입니다’보다 더 직접적입니다.
