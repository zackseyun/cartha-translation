review_pass:
  verdict: revise
  source_fidelity: ‘그녀의 정당함을 들어주어야겠다’는 ἐκδικήσω αὐτήν의 법적 구제·권리 회복의 뜻을 충분히 전달하지 못하며, ‘어야겠다’는 미래의 결정을 다소 약화합니다. ‘그 여자의 권리를 찾아 주겠다’는 문맥상의 법적 정의/변호의 뜻을 자연스럽게 나타냅니다. εἰς τέλος는 여기서 반복적이고 끝없는 방문을 뜻하므로 ‘끝없이 찾아와’로 옮길 수 있습니다.
  naturalness: 초안의 ‘그녀의 정당함을 들어주다’는 현대 한국어에서 법적 청구를 처리한다는 의미로 다소 부자연스럽습니다. 인용부호도 중복되어 있습니다. 수정문은 합쇼체 직접화법으로 자연스럽습니다.
  terminology: ‘과부’는 χήρα를 정확히 보존합니다. ἐκδικέω는 보복으로 한정하지 않고 ‘권리를 찾아 주다’로 번역하여 법적 구제의 의미를 유지합니다. ὑπωπιάζῃ의 관용적 의미는 본문에서 ‘지치게 하다’로, 문자적 이미지는 각주로 보완합니다.
  issues:
  - severity: medium
    issue: ἐκδικήσω αὐτήν의 번역
    rationale: ‘그녀의 정당함을 들어주다’보다 ‘그 여자의 권리를 찾아 주다’가 법적 정의를 베풀고 원통함을 풀어 준다는 동사의 문맥상 의미를 더 정확하고 자연스럽게 반영합니다.
  - severity: low
    issue: 미래 결의와 인용부호
    rationale: ‘들어주어야겠다’는 의무·독백의 뉘앙스를 낳을 수 있으므로 미래형 ‘찾아 주겠다’가 적합합니다. 종결 인용부호는 하나만 남겨야 합니다.
  revised_text: 이 과부가 계속 나를 괴롭히니, 그 여자가 끝없이 찾아와 나를 지치게 하지 못하도록 그 여자의 권리를 찾아 주겠다.”
  revised_footnotes:
  - marker: a
    text: ‘그 여자의 권리를 찾아 주겠다’는 말은 법적으로 정의를 베풀어 주거나 그 여자의 정당한 권리를 회복시켜 준다는 뜻입니다.
    reason: ἐκδικήσω αὐτήν의 법적 구제 의미를 명확히 합니다.
  - marker: b
    text: 직역하면 ‘내 눈 아래를 치다’입니다. 여기서는 끈질긴 방문으로 ‘나를 지치게 하다’라는 비유적 뜻입니다.
    reason: ὑπωπιάζῃ의 문자적 이미지와 문맥상 관용적 의미를 보존합니다.
  revision_rationale: 법적 판결 장면의 ἐκδικέω를 ‘권리를 찾아 주다’로 수정하고, 지속적 방문과 그로 인한 피로라는 εἰς τέλος 및 ὑπωπιάζῃ의 의미를 자연스럽게 반영했습니다. 각주는 각각 ‘권리를 찾아 주겠다’와 ‘지치게 하다’에 연결해야 합니다.
