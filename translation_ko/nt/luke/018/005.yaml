review_pass:
  verdict: revise
  source_fidelity: ‘그녀의 정당함을 들어주어야겠다’는 ἐκδικήσω αὐτήν의 법적 구제·권리 회복의 뜻을 충분히 나타내지 못하며, ‘정당함’은 과부 자신의 도덕적 정당성을 인정하는 뜻으로도 들릴 수 있습니다. ὑπωπιάζῃ의 비유적 강도는 ‘지치게 하다’로 적절히 살릴 수 있습니다.
  naturalness: ‘그 과부의 억울함을 풀어 주다’는 현대 표준어에서 법적·사회적 억울함을 해소해 준다는 뜻으로 자연스럽습니다. 중복된 닫는 인용부호는 바로잡았습니다.
  terminology: χήρα는 ‘과부’로 유지했습니다. ἐκδικέω는 보복이라는 뜻으로 좁히지 않고 ‘억울함을 풀어 주다’로 옮겨 법적 정의·구제의 문맥을 반영했습니다.
  issues:
  - severity: medium
    issue: ‘그녀의 정당함을 들어주어야겠다’
    rationale: 법적 정의를 베푸는 ἐκδικήσω αὐτήν을 개인의 ‘정당함’을 인정하는 일처럼 들리게 하며, 한국어 관용상도 부자연스럽습니다.
  - severity: low
    issue: 닫는 인용부호가 중복됨
    rationale: 본문 끝의 ‘」」’는 문장부호 오류입니다.
  revised_text: 그러나 이 과부가 나를 계속 괴롭히니, 그가 끝없이 찾아와 나를 지치게 하지 않도록 그 과부의 억울함을 풀어 주어야겠다.”
  revised_footnotes:
  - marker: a
    text: ‘그 과부의 억울함을 풀어 주다’는 법적으로 그에게 정의를 베풀고 권리를 회복시켜 준다는 뜻입니다. 문맥에 따라 ‘그의 원한을 갚아 주다’로도 옮길 수 있으나, 여기서는 법적 구제의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나를 지치게 하다’에 해당하는 말은 글자 그대로는 ‘눈 아래를 치다’라는 뜻일 수 있으나, 여기서는 끊임없는 요구로 몹시 지치게 하거나 괴롭힌다는 비유적 표현입니다.
    reason: lexical_alternative
  revision_rationale: 법적 판결의 문맥에서 ἐκδικήσω를 자연스러운 한국어 관용구인 ‘억울함을 풀어 주다’로 바로잡았습니다. εἰς τέλος와 현재분사의 지속성을 ‘끝없이 찾아와’로, ὑπωπιάζῃ의 비유적 뜻을 ‘지치게 하다’로 유지했습니다. 각주 표지는 완전한 본문에서는 ‘억울함을 풀어 주어야겠다[a]’와 ‘지치게 하지 않도록[b]’에 붙일 수 있습니다.
