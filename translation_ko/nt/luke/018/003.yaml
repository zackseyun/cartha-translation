  text: 그 도시에 한 과부가 있었는데, 그 여자는 그에게 계속 찾아와 “내 상대방에게서 제 권리를 찾아 주십시오”라고 말하곤 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
