    text: 또는 “내 상대방에 대하여 제게 정당한 판결을 내려 주십시오” 또는 “내 상대방에게서 내 억울함을 풀어 주십시오.” 그리스어 동사는 법적 정의나 권리의 회복을 확보한다는 뜻을 가질 수 있으며, 반드시 개인적인 보복을 뜻하지는 않습니다.
