  verdict: revise
  source_fidelity: The draft accurately conveys the loud cry and plea for mercy. However, ‘그러자’ adds a consequential/temporal nuance not expressed by καί, and the vocative sequence ‘다윗의 자손 예수여’ is unnatural Korean and obscures the direct address structure.
  naturalness: ‘예수님, 다윗의 자손이여’ is natural, reverent modern Korean in formal-polite register. ‘자비를 베풀어 주십시오’ is an idiomatic direct plea matching ἐλέησόν με.
  terminology: ‘다윗의 자손’ preserves the established biblical title and its messianic resonance without forcing an interpretation into the main text. The anchored note supplies the legitimate generic alternative ‘다윗의 후손.’
  issues:
  - severity: medium
    issue: ‘그러자’ is more interpretive than the source conjunction.
    rationale: καί simply links the action (‘and/he’); ‘그러자’ can imply a result or a temporal transition supplied from context.
  - severity: medium
    issue: ‘다윗의 자손 예수여’ is not idiomatic Korean direct address.
    rationale: The Greek has two vocative addresses, ‘Jesus’ and ‘Son of David.’ Separating them as ‘예수님, 다윗의 자손이여’ is clear and natural.
  - severity: low
    issue: The title’s lexical alternative lacks an anchored Korean footnote.
    rationale: The English audit trail identifies ‘descendant of David’ as a viable lexical alternative; an anchored note preserves this information while retaining the title in the text.
