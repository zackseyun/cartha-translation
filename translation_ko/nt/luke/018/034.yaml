  verdict: revise
  source_fidelity: The draft adds an adversative force with “그러나,” although the Greek begins with the connective καί (“and”). It also supplies “그분께서” (“he”), even though τὰ λεγόμενα is a passive substantive (“the things being said”) and does not state the speaker. The revision retains the threefold incomprehension, the unstated agent of concealment, and the distinction between συνῆκαν (“깨닫지 못했습니다”) and ἐγίνωσκον (“알지 못했습니다”).
  naturalness: The revised wording is formal, clear Korean in 합쇼체. “말씀되고 있는 것들” is deliberately somewhat literal in order to reflect the source’s passive present participle without supplying an explicit speaker.
  terminology: “이 말씀” is an appropriate contextual rendering of τὸ ῥῆμα τοῦτο. “감추어져 있었습니다” conveys the resultant state of the perfect passive construction while leaving the concealing agent unspecified.
  issues:
  - severity: medium
    issue: Unwarranted adversative connector
    rationale: “그러나” introduces contrast not expressed by καί.
  - severity: medium
    issue: Explicit speaker supplied in final clause
    rationale: “그분께서 말씀하시는” specifies a speaker and active formulation where the Greek uses the passive τὰ λεγόμενα without naming an agent.
  revised_text: 그들은 이 모든 일을 전혀 깨닫지 못했고, 이 말씀은 그들에게 감추어져 있었으며, 그들은 말씀되고 있는 것들을 알지 못했습니다.
