review_pass:
  verdict: revise
  source_fidelity: 원문의 ἄρχων은 특정 행정 관직으로 한정되지 않는 권위자를 가리키므로, ‘관리’보다 ‘지도자’가 범위를 더 잘 보존합니다. τί ποιήσας … κληρονομήσω는 행위의 전제 또는 수단을 묻는 표현이며, ‘무엇을 해야 … 상속받겠습니까?’가 이를 자연스럽고 충실하게 옮깁니다. κληρονομήσω의 상속 비유도 유지했습니다.
  naturalness: ‘물어 말했습니다’는 한국어에서 중복적이고 부자연스럽습니다. 인용문이 뒤따르므로 ‘물었습니다’만으로 충분합니다. ‘선한 선생님’과 ‘영생’은 현대 한국어 성경 문맥에서 자연스럽고 격식 있는 표현입니다.
  terminology: διδάσκαλε는 ‘선생님’, ἀγαθέ는 뒤 절에서 이어지는 논점을 보존하도록 ‘선한’으로, ζωὴν αἰώνιον은 통용되는 신학 용어인 ‘영생’으로, κληρονομήσω는 ‘상속받다’로 옮겼습니다. 본문은 질문자의 행위 중심 표현을 그대로 재현하며 이를 교리적으로 해설하거나 완화하지 않습니다.
  issues:
  - severity: medium
    issue: ‘관리’는 ἄρχων의 의미를 특정 행정 관료로 다소 좁힐 수 있습니다.
    rationale: ἄρχων은 넓게 권위자·지도자·통치자를 뜻하며, 이 절만으로 직책을 특정할 근거가 없습니다.
  - severity: low
    issue: ‘물어 말했습니다’는 발화 동작을 중복하여 표현합니다.
    rationale: λέγων은 인용문으로 자연스럽게 흡수할 수 있으므로 ‘물었습니다’가 현대 한국어 문장에 적합합니다.
  - severity: low
    issue: ‘선하신 선생님’보다 ‘선한 선생님’이 형용사 ἀγαθέ의 직접적인 호칭을 더 자연스럽게 반영합니다.
    rationale: ‘선하신’은 한국어에서 신적 존칭 용법으로도 쉽게 들릴 수 있는 반면, 원문은 인물의 호칭으로서 ‘좋은/선한’을 사용하며 다음 절에서 그 호칭 자체가 논의됩니다.
  revised_text: 그리고 한 지도자가 그분께 물었습니다. “선한 선생님, 제가 무엇을 해야 영생을 상속받겠습니까?”
