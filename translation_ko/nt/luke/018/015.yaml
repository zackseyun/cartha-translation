    rationale: βρέφη는 특히 아주 어린 아이들, 곧 아기/젖먹이를 뜻합니다. ‘어린아이들’은 더 넓은 연령대를 가리킬 수 있습니다.
  - severity: medium
    issue: ‘만져 주시기를 바라며’가 목적절을 소망 및 수혜 표현으로 바꿈
    rationale: ἵνα αὐτῶν ἅπτηται는 ‘그분이 그들을 만지시도록’이라는 목적입니다. ‘바라며’와 ‘주다’는 원문에 명시되지 않은 의미를 보탭니다.
  - severity: medium
    issue: 마지막 ‘그들을’의 선행사가 한국어에서 아기들로 읽힐 수 있음
    rationale: αὐτοῖς는 문맥상 아기들을 데려온 사람들을 가리킵니다. 한국어에서는 명시하여 오해를 막는 편이 자연스럽고 의미에도 맞습니다.
