source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: Now they were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
  footnotes:
  - marker: a
    text: Or 'babies.' The Greek term refers to very young children, specifically infants.
    reason: lexical_alternative
  - marker: b
    text: That is, those who were bringing the infants to Jesus.
    reason: lexical_alternative
  - marker: c
    text: In the parallel accounts, Jesus' touch is associated with blessing and laying hands on the children (cf. Matt 19:13; Mark 10:13, 16).
    reason: cross_reference
translation:
  language: ko
  text: 사람들은 그분이 그들을 만지시도록 심지어 아기들[a]까지도 그분께 데려오고 있었습니다. 그러나 제자들은 이것을 보고[c] 그들을 데려온 사람들을 꾸짖었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젖먹이들’. 그리스어는 특히 아주 어린 아이들, 곧 아기들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 아기들을 데려온 사람들을 가리킵니다.
    reason: antecedent_clarification
  - marker: c
    text: 병행 본문에서는 예수님이 아이들을 만지시는 일이 축복 및 그들에게 손을 얹으시는 일과 관련되어 있습니다(마 19:13; 막 10:13, 16 참조).
    reason: cross_reference
