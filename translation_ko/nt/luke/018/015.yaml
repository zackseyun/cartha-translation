  verdict: revise
  source_fidelity: 개정이 필요합니다. βρέφη는 일반적인 ‘어린아이들’보다 ‘아기들/젖먹이들’에 가까우므로 ‘아기들’로 옮기는 것이 적절합니다. 또한 마지막 αὐτοῖς는 문맥상 아기들이 아니라 아기들을 데려온 사람들을 가리킵니다. 목적절의 ‘만지시도록’은 ἵνα ... ἅπτηται의 목적과 ‘만지다’를 충실히 보존합니다.
  naturalness: 초안의 합쇼체와 전반적 문장은 자연스럽습니다. 다만 ‘그분께서 만져 주시기를 바라며’는 원문의 목적 표현을 소망 표현으로 바꾸고, ‘주다’가 원문에 없는 수혜의 뉘앙스를 더합니다. 개정문은 현대 표준어 합쇼체로 자연스럽게 목적을 표현합니다.
  terminology: ‘그분’은 존대 문맥에서 가능하며, ‘제자들’, ‘꾸짖었습니다’도 적절합니다. βρέφη에는 ‘아기들’을 사용했습니다. 본문에는 ‘축복하다’나 ‘안수하다’를 넣지 않고 ‘만지다’를 유지했습니다.
  issues:
