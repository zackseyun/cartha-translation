review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the speaker, solemn affirmation, the kingdom-of-God motive, and the listed relationships. However, ''버린 자라면 그 누구든'' introduces a conditional construction not present in Greek and makes the verse read as an incomplete or misleading assertion. The Greek relative clause is deliberately continued by v. 30: ''there is no one who has left ... [who will not receive ...].'' Korean should retain that cross-verse syntactic continuation.'
  naturalness: The current ending '버린 자라면 그 누구든,' is unnatural and structurally unresolved in Korean. '떠난 사람으로서,' is natural in a continuing sentence and allows the negated main clause to follow in the next verse.
  terminology: '''하나님의 나라'' appropriately renders βασιλεία τοῦ θεοῦ. ''아내,'' ''형제,'' ''부모,'' and ''자녀'' are accurate and suitably neutral. ''떠난'' is preferable to ''버린,'' which can add an unnecessarily harsh sense of abandonment beyond the source''s contextually broad ''left.'''
  issues:
  - severity: medium
    issue: Conditional and dangling construction at the verse ending
    rationale: '''자라면 그 누구든'' adds a conditional sense and does not preserve the Greek''s relative-clause construction whose negated main assertion is completed in Luke 18:30.'
  - severity: low
    issue: Overly loaded verb '버린'
    rationale: ἀφῆκεν means 'left' here. '떠난' is more neutral and preserves the source without suggesting culpable abandonment.
  revised_text: 예수께서 그들에게 말씀하셨습니다. “내가 진실로 여러분에게 말합니다. 하나님의 나라를 위하여 집이나 아내나 형제나 부모나 자녀를 떠난 사람으로서,
