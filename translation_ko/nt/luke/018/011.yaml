base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
  footnotes:
  - marker: a
    text: Or 'standing, he was praying to himself these things.' The phrase 'πρὸς ἑαυτόν' may mean either that he stood apart or that his prayer was directed to himself in an ironic sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그 바리새인은 따로 서서[a] 다음과 같이 기도했습니다. 「하나님, 제가 다른 사람들, 곧 갈취하는 자들, 불의한 자들, 간음하는 자들과 같지 않고, 심지어 이 세리와도 같지 않다는 것을 감사드립니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “서서 자신에게 다음과 같이 기도했습니다.” 그리스어 ‘πρὸς ἑαυτόν’은 그가 다른 이들과 떨어져 서 있었다는 뜻일 수도 있고, 그의 기도가 자신을 향한 것이었다는 뜻일 수도 있습니다.
    reason: alternative_reading
