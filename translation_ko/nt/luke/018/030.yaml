  rationale: 원문의 강한 확언은 한국어의 자연스러운 미래 단정문으로 옮기고, 앞 절의 선행사를 가리키는 ‘그런 사람은’을 보충하여 상대절의 기능을 보존했습니다. ‘여러 배를 더’로 보상의 증가를 명시했으며, ‘오는 시대’와 ‘영생’은 원문의 종말론적 대비와 정착된 핵심 용어를 유지합니다.
