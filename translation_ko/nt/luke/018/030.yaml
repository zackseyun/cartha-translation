review_pass:
  verdict: revise
  source_fidelity: 초안은 현재 시대의 풍성한 보상과 오는 시대의 영생이라는 두 보상의 대조를 대체로 보존합니다. 그러나 헬라어의 강한 확언(οὐχὶ μὴ)을 한국어의 이중 부정으로 두 번 반복하여 문장이 불필요하게 무겁고, 원문의 한 상대절이 두 개의 독립적인 ‘없습니다’ 절로 분리되었습니다. 또한 πολλαπλασίονα의 비교·증가 의미는 ‘여러 배를’보다 ‘여러 배를 더’가 더 분명합니다.
  naturalness: ‘그런 사람은 … 받을 것입니다’는 앞 절에서 가리킨 사람을 자연스럽게 이어 주며, 현대 표준어 합쇼체로도 매끄럽습니다. ‘오는 시대’는 αἰῶνι τῷ ἐρχομένῳ의 시대론적 표현을 보존하는 자연스러운 번역입니다.
  terminology: ‘영생’은 ζωὴν αἰώνιον의 한국어 성경 및 일반 신학 용례에 맞습니다. αἰών은 단순한 미래가 아니라 ‘시대’로 옮겨 현재 시대와 오는 시대의 대비를 유지했습니다. 별도의 본문 이문이나 번역상 필수적인 각주는 없습니다.
  issues:
  - severity: medium
    issue: 강조 부정과 문장 구조의 과도한 이중화
    rationale: ‘받지 않을 자가 없고 … 받지 않을 자가 없습니다’는 원문의 강한 확언을 반영하려는 장점은 있으나, 한 사람에 대한 단일 관계절을 두 번의 이중 부정으로 나누어 한국어 문체와 원문의 결속을 약화합니다.
  - severity: low
    issue: ‘여러 배를’에 비교 의미가 명시되지 않음
    rationale: πολλαπλασίονα는 문맥상 남겨 둔 것에 비해 몇 배나 더 받는다는 보상의 증가를 가리킵니다. ‘여러 배를 더’가 이를 더 정확히 드러냅니다.
  revised_text: 그런 사람은 이 시대에 여러 배를 더 받고, 오는 시대에는 영생을 받을 것입니다.」
