    rationale: ἀπαράβατος 자체의 직접적인 어휘 의미로는 ‘영원한’보다 ‘변하지 않는’ 또는 ‘다른 이에게 넘겨지지 않는’이 더 정확합니다. 영원성은 앞선 εἰς τὸν αἰῶνα 및 문맥에서 나옵니다.
  revised_text: 그러나 그분은 영원히 계시므로, 제사장직을 영구히 지니십니다.[a]
