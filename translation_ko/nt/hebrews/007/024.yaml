  to: 그러나 그분은 영원히 계시므로, 제사장직을 영구히 지니십니다.[a]
  rationale: 본문은 영어 POB의 ‘permanently’와 같이 문맥적 지속성을 ‘영구히’로 옮기되, ἀπαράβατον의 논쟁적·다의적 뉘앙스는 각주에서 ‘변하지 않는’과 ‘다른 이에게 넘겨지지 않는’으로 함께 제시했습니다. 이에 따라 원문의 인과 관계와 전후 문맥의 제사장 교체 대비를 보존하면서도 특정 해석을 본문에 과도하게 고정하지 않았습니다.
