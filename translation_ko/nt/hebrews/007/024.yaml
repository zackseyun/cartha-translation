  source_fidelity: 초안의 ‘갈리지 않는’은 ἀπαράβατον의 의미(변하지 않는/다른 이에게 넘겨지지 않는)를 나타내지 못하고 ‘분할되지 않는’이라는 다른 뜻으로 이해됩니다. ‘영원히 계시므로’는 διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα의 지속성과 인과를 자연스럽게 반영합니다.
  naturalness: ‘그분은 영원히 계시므로’와 ‘제사장직을 영구히 지니십니다’는 현대 표준어 합쇼체에서 자연스럽고, 앞절의 여러 제사장과의 대조도 유지합니다.
  terminology: ἱερωσύνη는 ‘제사장직’으로 옮기는 것이 직분을 가리키는 문맥에 적절합니다. ἀπαράβατον의 ‘불변’과 ‘비양도’라는 어휘적 여지는 본문에서 한쪽으로 단정하지 않고 각주에 보존합니다.
