  terminology: '''제사장'' is the appropriate established term for ἱερεύς. ''계속 머물러 있을 수 없었습니다'' preserves the verbal sense of παραμένειν; its contextual reference to continuance in priestly office is supplied in a footnote rather than overexplained in the text.'
