  source_fidelity: The draft correctly conveys the causal relationship between death and the succession of priests, but '그 다른 자들' adds the unsupported idea 'other,' and '직무를 계속 수행하지 못하다' is somewhat more interpretive than παραμένειν ('remain/continue'). The revision retains the contrastive μέν, the plurality of priests, and the reason given by the Greek.
