  - severity: low
    issue: The draft makes παραμένειν explicitly mean performing official duties.
    rationale: The priestly-office sense is contextually valid, but the Greek verb itself is 'remain/continue.' Keeping that wording in the text better preserves the source while a note explains the contextual sense.
