  - severity: low
    issue: ‘복을 빌었습니다’
    rationale: 원문의 εὐλόγηκεν은 멜기세덱이 아브라함을 축복한 행위를 가리킵니다. ‘축복했습니다’가 더 직접적이며 기도 행위로 오해될 여지를 줄입니다.
