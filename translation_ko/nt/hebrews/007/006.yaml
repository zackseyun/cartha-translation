  source_fidelity: ‘그들의 족보에 속하지 않은’은 뜻을 대체로 전달하지만, γενεαλογούμενος ἐξ αὐτῶν의 ‘그들에게서 계보를 잇다/계보에 따라 등록되다’라는 관계를 다소 불분명하게 합니다. 또한 εὐλόγηκεν은 ‘복을 빌다’보다 ‘축복하다’로 옮기는 편이 행위와 문장 구조를 더 직접적으로 보존합니다.
