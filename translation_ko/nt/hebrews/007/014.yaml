  naturalness: 개정문은 현대 표준어 합쇼체로 자연스럽고, 논증적 접속사 γάρ의 흐름도 ‘왜냐하면’으로 명료하게 나타냅니다. ‘그 지파에 대해서는 제사장들에 관하여’는 원문의 두 개의 관련 범위를 유지하면서도 문장 구조가 분명합니다.
