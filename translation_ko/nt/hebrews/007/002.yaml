translation:
  language: ko
  text: 아브라함은 또한 그에게 모든 것에서 십분의 일을 나누어 주었습니다.[a] 첫째, 그의 이름을 풀이하면 「의의 왕」이며[b], 다음으로는 「살렘 왕」, 곧 「평화의 왕」입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘십일조’. 그리스어는 문자적으로 ‘십분의 일’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의의 왕’. 그리스어 δικαιοσύνη는 ‘의’ 또는 ‘정의’를 뜻할 수 있습니다. 본문은 프로젝트의 기본 번역인 ‘의’를 따릅니다.
