  to: 아브라함은 또한 그에게 모든 것에서 십분의 일을 나누어 주었습니다.[a] 첫째, 그의 이름을 풀이하면 「의의 왕」이며[b], 다음으로는 「살렘 왕」, 곧 「평화의 왕」입니다.
