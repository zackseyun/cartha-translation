  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness, but the word of the oath, which came after the law, appoints a Son who has been perfected forever.
translation:
  language: ko
  text: 율법은 연약함을 지닌 사람들을 대제사장으로 세우지만, 율법 뒤에 주어진 맹세의 말씀은 영원히 온전하게 되신 아들을 세웁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 아들”. 그리스어는 여기서 관사 없이 “아들”이라고 하며, 문맥에서는 예수님을 가리킵니다. 이는 “사람들”과의 대조를 두드러지게 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “영원히 완성되신” 또는, 제사장 문맥에서는 “영원히 성별되신”.
    reason: lexical_alternative
