    rationale: 시편의 히브리어 배경은 인정할 수 있으나, 검토 대상인 SBLGNT 본문은 κύριος이고 영어 POB도 ‘Lord’를 채택합니다. 본문 번역에서 「야훼」로 바꾸면 직접 원문보다 후대의 원어 배경을 우선하게 됩니다.
