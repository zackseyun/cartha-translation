  source_fidelity: 수정이 필요합니다. 초안의 「야훼」는 인용의 히브리어 배경을 반영하려는 시도이지만, 히브리서의 직접적인 그리스어 본문은 κύριος이며 영어 POB의 결정도 ‘Lord’입니다. 따라서 본문에서는 「주」로 옮기는 것이 원문 우선 원칙에 맞습니다. 또한 διὰ τοῦ λέγοντος πρὸς αὐτόν은 ‘그분에게 말씀하신 분을 통하여’로 옮겨, 맹세에 의한 임명의 매개/발화자를 보존해야 합니다.
  naturalness: 초안의 「그분께 말씀하신 분을 통해서입니다」는 앞 절과 분리된 설명문처럼 들리고, 「이분은 … 되셨으니」와의 연결도 부자연스럽습니다. 한 문장으로 연결하고, 인용문은 현대 한국어의 자연스러운 합쇼체 문장으로 다듬는 것이 좋습니다.
  terminology: ἱερεύς는 문맥과 한국어 성경 용례상 「제사장」이 적절합니다. κύριος는 본문의 그리스어와 프로젝트 기본 방침에 따라 「주」로 유지합니다. μεταμεληθήσεται는 도덕적 회개가 아니라 결정을 번복하지 않는다는 뜻이므로 「뜻을 바꾸지 않으실 것이다」가 적절합니다.
