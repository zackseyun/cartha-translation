  to: 그러나 이분은 그분에게 말씀하신 분을 통하여 맹세와 함께 제사장이 되셨습니다. 「주께서 맹세하셨고[a] 뜻을 바꾸지 않으실 것이다. 너는 영원히 제사장이다.」[b]
  rationale: 「주」는 히브리서 그리스어 본문의 κύριος를 그대로 반영하며, 시편 인용이라는 사실은 각주에서 밝혔습니다. 문장을 재구성하여 ‘맹세와 함께 제사장이 되셨다’는 중심 진술과 ‘그분에게 말씀하신 분을 통하여’라는 매개 표현의 관계를 자연스럽게 드러냈습니다. 본문에 없는 ‘멜기세덱의 계열을 따라’ 등의 표현은 첨가하지 않았습니다.
