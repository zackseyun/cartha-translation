source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ αὐτῆς νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: Now if perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?
translation:
  language: ko
  text: 그러므로 만일 레위 계통의 제사장직을 통하여 완전함에 이를 수 있었다면—백성이 그 제사장직에 근거하여 율법을 받았기 때문입니다—어찌하여 멜기세덱의 반차를 따른 다른 제사장이 일어나고 아론의 반차를 따른다고 불리지 않아야 할 필요가 더 있었겠습니까?
  philosophy: optimal-equivalence
