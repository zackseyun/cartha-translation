  source_fidelity: 원문의 분사구문과 대조 관계는 대체로 잘 반영되었습니다. 다만 ἀποδεκατοῦν은 십일조를 ‘받다’보다 백성에게서 십분의 일을 ‘거두다’라는 뜻을 분명히 하는 편이 정확합니다. καίπερ 이하의 ‘아브라함의 허리에서 나온’은 수식 대상인 ‘형제들’을 가리키도록 유지했습니다.
  naturalness: ‘십분의 일을 받으라는 명령을 가지고’는 다소 직역투이고, ‘아브라함의 허리에서 나온 자들’도 현대 표준어에서는 어색합니다. ‘십분의 일을 거둘 명령을 받았으며’와 ‘아브라함의 허리에서 난 이들’이 현대의 격식 있는 성경 번역 문체에 더 자연스럽습니다.
  terminology: ‘제사장직’, ‘율법’, ‘십분의 일’은 적절합니다. ἀδελφούς의 친족 표현을 본문에서 ‘형제들’로 보존하되, 여기서는 이스라엘 동족을 뜻한다는 주석을 붙이는 것이 좋습니다. ‘허리’는 원문의 혈통 비유를 보존하므로, 직역임을 밝히는 주석을 붙였습니다.
