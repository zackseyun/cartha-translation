revisions:
- from: 이러한 대제사장이 우리에게 합당하셨습니다. 거룩하시고, 흠이 없으시며, 더럽혀지지 않으시고, 죄인들로부터 분리되시며, 하늘들보다 더 높이 되신 분입니다.
  to: 우리에게는 거룩하시고, 악이 없으시며, 더러움이 없으시고, 죄인들에게서 구별되시며, 하늘들보다 더 높아지신 이러한 대제사장이 참으로 합당하셨습니다.
  rationale: The revision keeps the explanatory force of γάρ (“참으로” also reflects the intensifying καί in a natural Korean placement), renders the three distinct moral/purity predicates separately, represents κεχωρισμένος as a descriptive state, and translates ὑψηλότερος τῶν οὐρανῶν γενόμενος as “하늘들보다 더 높아지신” without specifying the agent or resolving its theological implications.
  reviewer_model: gpt-5.6-terra
