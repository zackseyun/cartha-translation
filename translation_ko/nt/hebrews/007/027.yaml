  to: 그분께서는 대제사장들처럼 날마다 먼저 자기 죄를 위하여, 그다음에는 백성의 죄를 위하여 제사를 드릴 필요가 없으십니다. 그분께서 자신을 드리심으로 이 일을 단번에 하셨기 때문입니다.
  rationale: 원문에 없는 지시사 ‘저’를 제거하고, 제사 문맥에 더 자연스러운 ‘제사를 드리다’를 사용했습니다. ‘이 일을 단번에 하셨다’로 τοῦτο γὰρ ἐποίησεν ἐφάπαξ를 가깝게 옮기되, ‘이 일’의 선행 범위는 원문처럼 명시적으로 한정하지 않았습니다. ‘자신을 드리심으로’는 ἑαυτὸν ἀνενέγκας의 수단적/동반적 뉘앙스와 희생제사 언어를 유지합니다.
