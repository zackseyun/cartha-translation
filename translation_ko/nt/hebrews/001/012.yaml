  source_fidelity: 초안의 ‘갈아입혀질 것입니다’는 ἀλλαγήσονται(‘변하게 될 것이다’)를 피동의 ‘옷을 갈아입다’로 바꾸어, 피조물이 변화한다는 뜻을 훼손합니다. ‘말아 거두실’과 ‘한결같으시며’, ‘햇수는 다함이 없다’는 원문의 시적 대비를 잘 살립니다.
  naturalness: ‘당신은’은 현대 한국어의 하나님 호칭으로 다소 부자연스럽거나 다른 뉘앙스를 줄 수 있어, 문맥상 수신자를 자연스럽게 드러내는 ‘주님은’으로 다듬었습니다. 또한 불필요한 닫는 인용 부호를 제거했습니다.
  terminology: περιβόλαιον은 ‘겉옷’으로, ἱμάτιον은 ‘옷’으로 구별했습니다. ὁ αὐτός는 교리 용어를 덧붙이지 않고 ‘한결같으시며’로 번역했으며, οὐκ ἐκλείψουσιν은 ‘다함이 없을 것입니다’로 옮겼습니다.
