    reason: lexical_alternative
  - marker: b
    text: 또는 「우주」 또는 「세계들」. 헬라어 τοὺς αἰῶνας는 시대들 자체를 가리킬 수 있으며, 문맥에 따라 온 피조 질서를 포함하여 가리킬 수도 있다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν υἱῷ
  english_pob_choice: in a Son
  chosen_korean: 아들을 통하여
  alternatives_korean:
  - 한 아들 안에서
  - 아들로
  lexicon: BDAG
  rationale: 관사 없는 ἐν υἱῷ는 아들의 인격적·신분적 성격을 강조한다. 한국어에서 「한 아들 안에서」는 어색하므로, 1절의 「예언자들을 통하여」와의 구조적 대구를 살려 「아들을 통하여」로 옮긴다.
