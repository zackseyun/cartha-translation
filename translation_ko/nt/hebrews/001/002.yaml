  source_fidelity: 개정이 필요합니다. 본문은 ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων의 복수형과 지시어를 충분히 반영하지 못했고(「이 마지막 날에는」), ἐν υἱῷ를 「아들을 통하여」로 옮겨 ἐν의 표현 및 무관사 표현을 본문에서 해설적으로 바꾸었습니다. 또한 τοὺς αἰῶνας의 시간적·우주론적 폭을 「세상들」로 다소 좁혔습니다.
  naturalness: 「아들 안에서」와 「시대들을 지으셨습니다」는 직역적 긴장이 있으나 현대 한국어의 격식 있는 성경 번역 문맥에서는 자연스럽고 이해 가능합니다. 「이 마지막 날들에」, 「만물의 상속자」, 「그분을 통하여」는 명료하고 합쇼체에 맞습니다.
  terminology: 「만물」은 πάντων의 포괄성을 잘 전달하며, 「상속자」와 「세우셨습니다」는 κληρονόμον 및 ἔθηκεν에 적절합니다. υἱός는 문맥상 대문자 표기가 없는 한국어에서도 「아들」로 충분하되, 무관사성과 ἐν의 뉘앙스는 각주로 설명해야 합니다.
