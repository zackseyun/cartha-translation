  text: in these last days he has spoken to us in a Son, whom he appointed heir of all things, through whom he also made the ages.
translation:
  language: ko
  text: 이 마지막 날들에 하나님께서는 아들 안에서[a] 우리에게 말씀하셨습니다. 하나님께서는 그분을 만물의 상속자로 세우셨고, 그분을 통하여 또한 시대들을[b] 지으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
