    issue: τοὺς αἰῶνας를 「세상들을」로 한정했습니다.
    rationale: αἰῶνας는 ‘시대들’이라는 시간적 의미와 피조 질서라는 확장 의미를 함께 가질 수 있습니다. 본문은 「시대들」로 두고 ‘우주/세계들’은 각주에서 제시해야 모호성을 보존합니다.
