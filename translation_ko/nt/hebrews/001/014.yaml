review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the referent as angels from the immediate context and conveys their service, sending, the beneficiaries, and salvation as inheritance. However, its past-tense wording, “보내심을 받은,” weakens the present participial force of ἀποστελλόμενα, and “자들” is not a natural referent for spirits. The prospective force of μέλλοντας is better represented by “상속받게 될.”
  naturalness: A coordinated Korean predicate is more natural than describing the spirits as “영들로서” and then calling them “자들.” “섬기는 영들이며 … 보내심을 받는 이들” keeps the formal rhetorical-question register while reading smoothly.
  terminology: “섬기는 영들” appropriately renders λειτουργικὰ πνεύματα without importing a church-office sense. “봉사하도록” conveys εἰς διακονίαν, and “구원” and “상속받게 될” preserve the established salvation and inheritance terminology and the prospective nuance.
  issues:
  - severity: medium
    issue: The participle ἀποστελλόμενα is rendered as completed past action (“보내심을 받은”).
    rationale: The Greek present passive participle descriptively portrays the spirits as being sent out. “보내심을 받는” preserves this aspect without overtranslating it.
  - severity: low
    issue: The draft uses “자들” for the angelic spirits and does not retain the English audit trail’s future-oriented lexical note.
    rationale: “이들” is more idiomatic for the antecedent, and a footnote supplies the simpler future alternative while the main text retains the prospective nuance of μέλλοντας.
  revised_text: 천사들은 모두 섬기는 영들이며, 구원을 상속받게 될 이들을 위하여 봉사하도록 보내심을 받는 이들이 아닙니까?[a]
