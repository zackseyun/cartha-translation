  source_fidelity: 수정이 필요합니다. 초안의 「친히」는 δι’ αὑτοῦ의 전치사적 의미(‘자신을 통하여’)를 충분히 옮기지 못하며, 해당 각주도 중요한 생략 사본 전승을 반영하지 않습니다. 또한 χαρακτήρ의 ‘정확한’ 대응을 본문에 드러내는 편이 원문에 더 충실합니다.
  naturalness: 「정결케 하심을 이루신」은 현대 표준어 합쇼체에서는 다소 고어적이고 명사화가 무겁습니다. 「죄들을 정결하게 하신 뒤」가 자연스럽고, 선행 완료의 관계도 유지합니다.
  terminology: 「광채」, 「만물」, 「능력의 말씀」, 「위엄」은 적절합니다. 「본체」는 한국어 성경 전통에서 익숙하지만 현대 독자에게 ὑπόστασις와 χαρακτήρ의 관계를 분명히 전달하기 위해 「하나님의 본질의 정확한 형상」으로 고쳤습니다. 이는 후대의 ‘위격’이라는 기술 용어를 본문에 도입하지 않습니다.
  issues:
