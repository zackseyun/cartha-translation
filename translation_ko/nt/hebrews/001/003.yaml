    issue: δι’ αὑτοῦ를 「친히」로 번역함
    rationale: 「친히」는 ‘스스로/by himself’의 뜻으로 들리기 쉬우며, SBLGNT의 διὰ가 나타내는 ‘자신을 통하여/통해’라는 수단·매개의 의미를 소거합니다.
  - severity: medium
    issue: 본문 b 각주가 사본 생략 전승을 설명하지 않음
    rationale: 제시된 영어 감사 기록과 SBLGNT 채택문에 따르면, 핵심 이문은 δι’ αὑτοῦ의 포함과 생략입니다. 초안의 「δι’ αὑτοῦ 또는 δι’ ἑαυτοῦ」라는 설명은 이 주요 이문을 해결하지 못합니다.
