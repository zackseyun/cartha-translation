  text: 오래전에 하나님께서는 예언자들을 통하여 조상들에게[c] 여러 부분과[a] 여러 방식으로 말씀하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「여러 부분에 걸쳐」. 헬라어 πολυμερῶς는 여러 부분 또는 분량으로 주어진 성격을 가리키며, πολυτρόπως(여러 방식)와 의미가 구분된다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로 「예언자들 안에서」(ἐν τοῖς προφήταις). 여기서는 도구·매개의 의미로 사용되어 「예언자들을 통하여」로 옮긴다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어는 「조상들에게」(τοῖς πατράσιν)이며, 「우리 조상들에게」가 아니다. 「조상들」은 원문의 표현을 보존한다.
    reason: lexical_alternative
