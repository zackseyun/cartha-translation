  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, καὶ ἡ ῥάβδος τῆς εὐθύτητος ῥάβδος τῆς βασιλείας σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says, “Your throne, O God, is forever and ever, and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: ko
  text: 그러나 아들에게는 이렇게 말씀하셨습니다. 「하나님이여[a], 주의 보좌는 영원무궁토록 있으며, 올바름의 왕홀[b]은 주의 나라의 왕홀입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시편 45:6-7(칠십인역 44:7-8)을 인용합니다. 그리스어 구문은 논의되어 왔으나, 여기서는 ‘하나님이여, 주의 보좌는’이라는 직접 호격으로 옮겼습니다. 덜 가능성 있는 번역은 ‘하나님은 주의 보좌이십니다, 영원무궁토록’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘의로움의 왕홀’. 그리스어는 올바름, 정직함, 또는 바름을 뜻할 수 있습니다.
    reason: lexical_alternative
