translation:
  language: ko
  text: 그들은 하늘에 있는 것들의 모형과 그림자를 섬기는데, 이는 모세가 장막을 세우려 할 때에 신적 지시를 받은 것과 같습니다. 그분이 말씀하시기를, 「보라, 산에서 네게 보여진 본을 따라 모든 것을 만들라」 하셨습니다.
  philosophy: optimal-equivalence
