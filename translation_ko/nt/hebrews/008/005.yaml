review_pass:
  verdict: revise
  source_fidelity: 초안은 ὑπόδειγμα와 σκιά의 대조를 ‘모형과 그림자’로 적절히 옮겼고, ‘장막을 세우려 할 때’도 문맥상 수용 가능합니다. 그러나 λατρεύουσιν을 목적어를 직접 ‘섬기다’로 처리하면 모형과 그림자 자체를 예배한다는 뜻으로 들릴 수 있으므로, 성소 제의의 봉사라는 여격 용법을 드러내야 합니다. 또한 καθὼς 이하의 비교 관계와 인용을 도입하는 γάρ/φησίν의 흐름을 더 충실히 반영할 필요가 있습니다.
  naturalness: ‘신적 지시’는 현대 표준 한국어 성서 문맥에서 다소 직역투이므로 ‘하나님의 지시’가 자연스럽습니다. ‘이는 … 것과 같습니다’도 앞 절 전체와 모세의 수령 사건을 잇는 비교를 충분히 분명하게 하지 못합니다. 개정문은 합쇼체의 격식과 인용문의 직접성을 유지합니다.
  terminology: ‘모형과 그림자’, ‘모세’, ‘장막’, ‘본’은 적절합니다. λατρεύω는 여기서 일반적 ‘섬김’보다 제의적 봉사를 뜻하므로 ‘봉사하다’를 사용했습니다. κεχρημάτισται는 하나님에게서 온 지시라는 뜻을 살려 ‘하나님의 지시를 받았습니다’로 옮기고, 가능한 경고·훈계의 뉘앙스는 각주로 보존했습니다.
  issues:
  - severity: medium
    issue: ‘모형과 그림자를 섬기는데’는 λατρεύουσιν의 제의적 용법과 여격 구문을 부정확하게 드러냅니다.
    rationale: 한국어에서는 모형과 그림자 자체를 숭배하거나 섬긴다는 의미로 읽히기 쉽습니다. ‘모형과 그림자에 봉사합니다’는 하늘의 것들을 반영하는 지상 성소의 제의 봉사라는 문맥을 더 정확히 나타냅니다.
  - severity: medium
    issue: ‘이는 모세가 … 받은 것과 같습니다’는 καθὼς가 연결하는 비교와 이어지는 인용의 논리를 다소 불명확하게 합니다.
    rationale: 모세가 장막을 세우려 할 때 받은 하나님의 지시를 ‘그와 같이’ 연결하고, γάρ를 ‘하나님께서 말씀하셨기 때문입니다’로 드러내면 원문의 논증 흐름이 자연스럽습니다.
  - severity: low
    issue: ‘신적 지시’는 현대 한국어 성서 문체에서 다소 부자연스럽습니다.
    rationale: ‘하나님의 지시’는 신적 출처를 명확히 하면서도 자연스럽고, κεχρημάτισται의 계시적·지시적 의미를 보존합니다.
  revised_text: 그들은 하늘에 있는 것들의 모형과 그림자에 봉사합니다. 모세가 장막을 세우려 할 때 하나님의 지시를 받은 것도 이와 같습니다. 하나님께서 말씀하셨기 때문입니다. 「보십시오, 산에서 네게 보여 주신 본을 따라 모든 것을 만들라.」
  revised_footnotes:
  - marker: a
    text: ‘하나님의 지시를 받았다’는 말은 문맥에 따라 ‘경고를 받았다’ 또는 ‘훈계를 받았다’로도 옮길 수 있습니다.
    reason: κεχρημάτισται의 신적 전달 및 경고·훈계의 가능한 뉘앙스를 보존합니다.
  revision_rationale: 제의적 봉사를 뜻하는 λατρεύω의 문맥상 의미를 ‘…에 봉사합니다’로 명확히 하고, καθὼς와 γάρ가 이끄는 비교 및 인용의 논리적 연결을 한국어 문장 구조로 재구성했습니다. ‘하나님께서’는 κεχρημάτισται의 수동태와 출애굽기 인용의 발화자를 문맥상 명시한 것이며, 교리적 해석을 추가하지 않습니다. 불확실하게 남을 수 있는 κεχρημάτισται의 경고 뉘앙스는 각주에 보존했습니다.
