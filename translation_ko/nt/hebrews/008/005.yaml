  source_fidelity: 원문의 관계절은 레위계 제사장들이 '하늘에 있는 것들의 모형과 그림자'와 관련하여 예배·봉사의 직무를 수행함을 말합니다. 초안의 '모형과 그림자를 섬기는데'는 그 모형과 그림자 자체를 섬기는 것으로도 읽힐 수 있어, '모형과 그림자에 따라 섬기며'로 관계를 더 분명히 했습니다. 또한 καθὼς는 모세가 하나님의 지시를 받은 사실과의 비교이므로 '이는 … 것과 같습니다'보다 '… 것과 같이'가 원문의 연결을 더 충실히 반영합니다. κεχρημάτισται는 신적 հաղորդ의 뜻을 보존하여 '하나님의 지시를 받았습니다'로 옮겼습니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 문장을 재구성하고, 불분명한 대명사 '그분'을 '하나님께서'로 밝혔습니다. 인용문은 성서적이면서도 자연스러운 명령형 '만들어야 한다'로 옮겼습니다.
  terminology: ‘모형과 그림자’, ‘하늘에 있는 것들’, ‘장막’, ‘본’은 히브리서와 출애굽기 인용의 어휘적 연결을 유지합니다. ‘하나님의 지시’는 κεχρημάτισται의 신적 지시·경고의 폭넓은 의미를 과도하게 좁히지 않습니다.
