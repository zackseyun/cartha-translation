base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
  footnotes:
  - marker: a
    text: Or 'was warned' for 'was divinely instructed'; the Greek verb can emphasize a divine warning or admonition.
    reason: lexical_alternative
  - marker: b
    text: Or 'construct' for 'complete' the tabernacle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하늘에 있는 것들의 모형과 그림자에 따라 섬기며, 모세가 장막을 완성하려 할 때에 하나님의 지시를 받은 것과 같습니다.[a] 하나님께서 말씀하셨습니다. “보라, 산에서 네게 보여 준 본을 따라 모든 것을 만들어야 한다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경고를 받았습니다.’ 그리스어 동사는 하나님의 지시뿐 아니라 경고나 권고의 뉘앙스도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만들어야 한다’는 명령의 기능을 하는 그리스어 미래형을 옮긴 것입니다.
    reason: grammatical_clarification
