  source_fidelity: 개정이 필요합니다. κύριος는 본문상 ‘주’로 옮겨야 하며, 복수형 νόμους는 ‘율법들’로 보존하는 것이 적절합니다. αὐτούς가 가리키는 ‘율법들’을 한국어에서도 밝혀 두면 새기는 대상이 분명해집니다.
  naturalness: ‘이스라엘 집’과 언약 정형 어구는 예언서 인용의 울림을 보존하면서도 표준 한국어 성경 문체에서 자연스럽습니다. ‘생각에 두고’와 ‘마음에 새기리라’는 인지적 영역과 마음의 대조를 유지하며 자연스럽습니다.
  terminology: ‘언약’, ‘율법들’, ‘하나님’, ‘백성’은 본문의 언약 언어를 충실히 반영합니다. ‘야훼’는 인용의 히브리어 배경을 앞세우기보다 현 그리스어 본문의 κύριος에 따라 ‘주’로 고칩니다.
  issues:
