  to: 이것이 그 날들 후에 내가 이스라엘 집과 더불어 맺을 언약이다, 주께서 말씀하신다. 내가 내 율법들을 그들의 생각에 두고, 그것들을 그들의 마음에 새기리라. 또 나는 그들의 하나님이 되고, 그들은 내 백성이 되리라.
  rationale: 주요 개정은 본문상 호칭을 ‘주’로 바로잡고, ‘율법들’의 복수와 이를 받는 대명사를 반영한 것입니다. ‘두고 … 새기리라’는 διδοὺς와 미래형 ἐπιγράψω의 혼합된 구조를 한국어에서 무리 없이 드러냅니다.
