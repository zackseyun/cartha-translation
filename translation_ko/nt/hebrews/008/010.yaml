    issue: κύριος를 ‘야훼’로 번역함
    rationale: SBLGNT 본문은 κύριος이며, 제시된 영어 감사 기록도 이를 ‘Lord’로 번역합니다. 구약 인용의 배경을 고려할 수 있으나, 본문 우선 원칙상 ‘주께서’가 적절합니다.
  - severity: medium
    issue: νόμους μου의 복수형이 ‘나의 율법’으로 단수 처리됨
    rationale: 그리스어 νόμους는 복수이므로 ‘내 율법들’을 사용하여 수를 보존해야 합니다.
  - severity: low
    issue: 새기는 대상인 αὐτούς가 한국어에서 명시되지 않음
    rationale: 앞선 ‘율법들’을 ‘그것들을’로 받아 주면 그들의 마음에 새기는 대상이 분명해지고 원문의 대명사도 반영됩니다.
