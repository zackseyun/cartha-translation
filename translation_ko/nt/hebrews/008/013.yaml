review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the perfect force of πεπαλαίωκεν ("made ... obsolete/old") and the paired present participles for an ongoing process. However, "사라지기에 가깝습니다" is not idiomatic Korean for ἐγγὺς ἀφανισμοῦ and weakens the noun phrase's sense of impending disappearance. The Greek's elliptical Καινὴν and τὴν πρώτην are retained without supplying "언약" in the main text.
  naturalness: '"낡아지고 쇠하여 가는" is natural and appropriately preserves the aging imagery. Revising the final clause to "사라질 날이 가까웠습니다" gives natural formal-polite Korean while clearly expressing imminence.'
  terminology: '"낡은 것으로 만드셨습니다" conveys the covenantal force of πεπαλαίωκεν without imposing a doctrinal expansion. The quoted "새" is intentionally elliptical, with a note identifying its contextual echo of "새 언약."'
  issues:
  - severity: medium
    issue: The final clause is awkward Korean.
    rationale: '"사라지기에 가깝습니다" is a literal calque and is not a natural way to express ἐγγὺς ἀφανισμοῦ. "사라질 날이 가까웠습니다" naturally conveys that disappearance is imminent.'
  - severity: low
    issue: The Greek ellipsis in "새" may be unclear without a note.
    rationale: Καινὴν is an adjective quoted elliptically, echoing "새 언약" in the preceding citation. A footnote preserves this source feature without adding "언약" to the main text.
  revised_text: 「새」라고 말씀하심으로써 첫 것을 낡은 것으로 만드셨습니다. 낡아지고 쇠하여 가는 것은 사라질 날이 가까웠습니다.
  revised_footnotes:
  - marker: a
    text: 그리스어에는 “새”만 있으며, 앞선 예레미야 31:31 인용의 “새 언약”을 되울립니다.
    reason: cross_reference
  - marker: b
    text: 또는 “사라짐에 가깝습니다.”
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek ellipses and aspectual contrast while replacing an unnatural Korean calque in the final clause. Footnotes document the contextual referent of the quoted adjective and the close lexical alternative for ἀφανισμός.
