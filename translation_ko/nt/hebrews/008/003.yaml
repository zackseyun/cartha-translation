  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
  footnotes:
  - marker: a
    text: Or 'for this one too to have something to offer.' The Greek wording leaves the referent implicit; in context, it refers to Jesus as high priest.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 대제사장은 예물과 제사를 드리도록 세움을 받습니다. 그러므로 이분도 드릴 것이 있어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이분도 드릴 무엇인가를 가지고 계셔야 합니다.” 그리스어는 “이분”이 누구를 가리키는지 본문에서 밝히지 않지만, 문맥상 예수님을 가리킵니다.
    reason: The phrase καὶ τοῦτον leaves the referent implicit, and ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ can be represented with either an existential Korean construction or an explicit possession construction.
