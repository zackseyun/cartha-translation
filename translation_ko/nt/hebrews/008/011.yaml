  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
  footnotes:
  - marker: a
    text: Or 'neighbor.' The Greek text of Hebrews has 'fellow citizen,' while the underlying Jeremiah passage is commonly rendered 'neighbor.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 각 사람이 자기 동료 시민[a]에게, 또 각 사람이 자기 형제에게 ‘주를 알라’고 말하며 가르치지 않을 것입니다. 이는 그들이 가장 작은 자로부터 가장 큰 자에 이르기까지 모두 나를 알 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이웃’. 히브리서의 그리스어 본문은 ‘동료 시민’이라고 하나, 그 바탕이 되는 예레미야 구절은 흔히 ‘이웃’으로 번역됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Γνῶθι τὸν κύριον
  english_pob_choice: Know the Lord
  chosen_korean: 야훼를 알라
  alternatives_korean:
  - 주를 알라
  lexicon: BDAG
  rationale: 예레미야 인용 안의 κύριος를 「야훼」로 복원한다.
