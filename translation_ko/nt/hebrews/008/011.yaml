    text: 또는 ‘이웃’. 히브리서의 그리스어 본문은 ‘동료 시민’을 뜻하지만, 그 바탕이 되는 예레미야 본문은 흔히 ‘이웃’으로 번역됩니다.
    reason: alternative_reading
  revision_rationale: 현존 그리스어 본문을 우선하여 κύριος를 ‘주’로 옮기고, οὐ μή의 강조를 ‘결코’로 반영했습니다. πολίτης의 어휘적 특수성은 ‘동료 시민’으로 보존하되, 예레미야 배경에서 익숙한 ‘이웃’은 각주로 처리했습니다. 문장 종결은 현대 표준 한국어 합쇼체로 통일했습니다.
