  source_fidelity: 개정이 필요합니다. 초안은 οὐ μὴ διδάξωσιν의 강한 부정을 충분히 드러내지 못하고, 인용 명령의 대상인 τὸν κύριον을 본문 그리스어보다 앞서 해석하여 ‘야훼’로 특정합니다. 또한 ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν의 ‘그들 가운데’라는 범위를 명시하는 편이 정확합니다.
  naturalness: ‘각자가 … 가르치며 … 말하지 아니할 것이다’는 한국어에서 부정의 범위가 어색하고, 누가 무엇을 말하지 않는지 불분명해질 수 있습니다. ‘각 사람이 … “주를 알라”라고 말하며 가르치지 않을 것입니다’로 배열하면 자연스럽고 원문의 인용 구조도 보존됩니다.
  terminology: κύριος는 영어 POB 및 제공된 어휘 결정과 같이 ‘주’로 옮겨야 합니다. 히브리어 신명 복원인 ‘야훼’는 현존 그리스어 본문에 없는 특정화입니다. πολίτης는 ‘동료 시민’으로 유지하되, 예레미야의 통상적 표현인 ‘이웃’은 각주로 제시하는 것이 적절합니다.
  issues:
  - severity: high
    issue: ‘야훼를 알라’가 τὸν κύριον을 과도하게 특정함
    rationale: SBLGNT 본문은 κύριον(‘주’)이라고 하며, 인용의 배경만으로 한국어 본문에서 신명을 복원해서는 안 됩니다. 영어 POB 감사 기록도 ‘Lord’를 채택합니다.
  - severity: medium
    issue: 강조 부정 οὐ μή의 반영이 약하고 문장 구조가 모호함
    rationale: οὐ μὴ διδάξωσιν은 강한 미래 부정입니다. ‘결코 … 가르치지 않을 것입니다’가 이를 자연스럽게 반영하며, ‘말하며 가르치지’의 구조가 인용구와 가르침의 관계를 명확히 합니다.
  - severity: low
    issue: ‘그들 가운데’의 범위 표지가 빠짐
    rationale: αὐτῶν은 최소자와 최대자가 속한 집단을 가리킵니다. ‘그들 가운데 가장 작은 자부터 가장 큰 자까지’가 원문의 범위를 더 충실히 나타냅니다.
  revised_text: 그리고 각 사람이 자기 동료 시민에게, 또 자기 형제에게 ‘주를 알라’고 말하며 결코 가르치지 않을 것입니다. 이는 그들 모두가 그들 가운데 가장 작은 자부터 가장 큰 자까지 나를 알 것이기 때문입니다.
  revised_footnotes:
