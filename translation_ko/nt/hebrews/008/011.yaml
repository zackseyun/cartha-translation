review_pass:
  verdict: revise
  source_fidelity: 주요 구조와 ‘동료 시민’ 및 ‘형제’의 구별은 원문을 대체로 반영합니다. 그러나 κύριον을 본문 근거 없이 ‘야훼’로 복원한 것은 그리스어 본문 및 영어 POB의 ‘Lord’와 일치하지 않습니다. 또한 οὐ μὴ의 강한 부정을 ‘결코’로 드러내는 것이 적절합니다.
  naturalness: 초안의 ‘가르치며 … 말하지 아니할 것이다’는 수식 관계가 다소 어색하고 현대 합쇼체에 덜 자연스럽습니다. ‘…에게 …고 말하며 가르치지 않을 것입니다’로 고치면 분배 구조와 인용 도입이 자연스럽습니다.
  terminology: κύριος는 표준 한국어 성경 문체와 제시된 영어 감사 기록에 따라 ‘주’로 옮겨야 합니다. πολίτης는 ‘동료 시민’으로 유지하되, 예레미야 본문의 익숙한 표현인 ‘이웃’ 가능성을 각주로 밝혀야 합니다.
  issues:
  - severity: high
    issue: ‘야훼를 알라’
    rationale: SBLGNT는 τὸν κύριον(‘주’)이라고 하며, 번역 대상인 현존 그리스어 본문을 우선해야 합니다. 인용의 배경을 근거로 고유신명을 본문에 복원하면 원문의 어휘를 넘어섭니다.
  - severity: medium
    issue: οὐ μὴ의 강조가 충분히 드러나지 않음
    rationale: οὐ μή + 접속법은 강한 부정입니다. ‘결코 … 않다’가 이를 자연스러운 현대 한국어로 반영합니다.
  - severity: medium
    issue: ‘가르치며 … 말하지 아니할 것이다’의 어색한 결합
    rationale: λέγων은 가르침의 내용을 도입하므로, ‘…라고 말하며 가르치다’로 연결하고 합쇼체 종결을 쓰는 편이 자연스럽습니다.
  - severity: low
    issue: ‘동료 시민’에 대한 대안 각주 누락
    rationale: 히브리서의 πολίτην은 ‘동료 시민’이지만, 인용의 예레미야 본문은 흔히 ‘이웃’으로 번역됩니다. 영어 POB 감사 기록의 정보가 독자에게도 제공되어야 합니다.
  revised_text: 그리고 각 사람이 자기 동료 시민[a]에게, 또 각 사람이 자기 형제에게 ‘주를 알라’고 말하며 가르치지 않을 것입니다. 이는 그들이 가장 작은 자로부터 가장 큰 자에 이르기까지 모두 나를 알 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘이웃’. 히브리서의 그리스어 본문은 ‘동료 시민’이라고 하나, 그 바탕이 되는 예레미야 구절은 흔히 ‘이웃’으로 번역됩니다.
    reason: alternative_reading
  revision_rationale: '원문 그리스어의 κύριον을 ‘주’로 바로 옮기고, οὐ μή의 강조를 ‘결코’가 아닌 문장 전체의 강한 부정으로 반영하려 했으나, 최종 본문에는 ‘결코’를 명시하는 편이 더 정확합니다. 따라서 최종 수정문은 다음과 같아야 합니다: ‘그리고 각 사람이 자기 동료 시민[a]에게, 또 각 사람이 자기 형제에게 ‘주를 알라’고 말하며 결코 가르치지 않을 것입니다. 이는 그들이 가장 작은 자로부터 가장 큰 자에 이르기까지 모두 나를 알 것이기 때문입니다.’ 각주는 제시된 내용대로 유지합니다.'
