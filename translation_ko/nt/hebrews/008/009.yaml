  to: 그것은 내가 그들의 손을 붙잡아 그들을 이집트 땅에서 이끌어 내려고 하던 날에 그들의 조상들과 맺은 언약과 같지 않습니다[a]. 그들이 내 언약 안에 머물러 있지 않았으므로, 나도 그들을 돌보지 않았습니다[b], 주께서 말씀하십니다.
