translation:
  language: ko
  text: 그는 성소들과 참된 장막을 섬기시는 분이십니다.[a] 이 장막은 주께서 세우신 것이며,[b] 사람이 세운 것이 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소’. 그리스어는 복수형이며, 이 문맥에서는 거룩한 사람들보다 성소의 거룩한 곳들을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쳐 세우신’.
    reason: lexical_alternative
