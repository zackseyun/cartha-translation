    issue: ‘봉사자로서’의 미결 문장 구조
    rationale: -로서는 뒤 절과 문법적으로 연결되어야 하나, ‘그것은’ 이하가 그 봉사자의 행위를 잇지 않아 원문의 λειτουργός 술어가 어색하게 단절됩니다.
