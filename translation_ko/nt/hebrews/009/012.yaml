  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
  footnotes:
  - marker: a
    text: Or 'into the sanctuary.' The Greek says 'into the holy places'; some translations render this more specifically as 'the Most Holy Place,' but that is more interpretive than the wording itself requires.
    reason: alternative_reading
translation:
  language: ko
  text: 염소와 송아지의 피를 통하여가 아니라 자신의 피를 통하여, 영원한 구속을 얻으시고 단번에 성소에[a] 들어가셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성소 안으로.” 그리스어는 직역하면 “거룩한 것들/장소들”이라는 복수형입니다. 이를 “지성소”로 옮기는 번역도 있으나, 본문의 표현 자체가 반드시 그렇게 한정하지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφάπαξ
  english_pob_choice: once for all
  chosen_korean: 단번에
  alternatives_korean:
  - 한 번에 그리고 영원히
  lexicon: BDAG
  rationale: 히브리서의 결정적 제사 모티프의 핵심어로, 일관되게 「단번에」로 옮긴다.
- source_word: αἰωνίαν λύτρωσιν
  english_pob_choice: eternal redemption
  chosen_korean: 영원한 구속
  alternatives_korean:
  - 영원한 구원
  lexicon: BDAG
  rationale: λύτρωσις는 「대속/구속」의 정확한 등가어이며, 한국 교회 전통의 「구속」을 사용한다.
