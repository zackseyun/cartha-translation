review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 어순은 대체로 충실합니다. 다만 διὰ πνεύματος αἰωνίου의 채택된 해석(성령)을 본문에서 분명히 하고, 실제로 가능한 다른 해석은 각주로 보존해야 합니다. 현재의 수사 의문문은 πόσῳ μᾶλλον의 강한 비교·확언을 한국어에서 자연스럽게 살립니다.
  naturalness: ‘정결케 하여’는 현대 표준어 합쇼체 문맥에서는 다소 문어적·고어적입니다. ‘정결하게 하여’가 자연스럽고 제의적 정결의 의미도 유지합니다. ‘자기 자신’은 한국어에서는 ‘자신’으로 충분합니다.
  terminology: ‘메시아’, ‘피’, ‘흠 없이’, ‘양심’, ‘죽은 행실’, ‘살아 계신 하나님’은 원문의 제의적·신학적 어휘를 적절히 보존합니다. πνεῦμα의 지시 대상을 성령으로 읽는 본문 선택에는 대안 독법을 알리는 각주가 필요합니다.
  issues:
  - severity: medium
    issue: διὰ πνεύματος αἰωνίου에 관한 대안 독법 각주가 없습니다.
    rationale: 영어 POB 감사 기록은 ‘영원하신 성령’이라는 해석을 채택하면서도, 관사 없는 그리스어 구문의 더 일반적인 독법을 각주로 보존합니다. 한국어도 이 모호성을 삭제하지 않아야 합니다.
  - severity: low
    issue: ‘정결케 하여’는 현대 표준어 문체에 다소 고어적입니다.
    rationale: καθαριεῖ의 정결·정화 의미는 ‘정결하게 하여’로 자연스럽게 유지됩니다.
  revised_text: 하물며 영원하신 성령을 통하여 흠 없이 자신을 하나님께 드리신 메시아의 피가 우리의 양심을 죽은 행실에서 정결하게 하여 살아 계신 하나님을 섬기게 하지 않겠습니까?[a]
