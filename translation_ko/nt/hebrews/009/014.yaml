  to: 하물며 영원하신 성령을 통하여 흠 없이 자신을 하나님께 드리신 메시아의 피가 우리의 양심을 죽은 행실에서 정결하게 하여 살아 계신 하나님을 섬기게 하지 않겠습니까?[a]
