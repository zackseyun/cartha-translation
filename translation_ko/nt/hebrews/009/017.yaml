  - marker: b
    text: The phrase 'over dead ones' is compressed in Greek and may refer either to dead persons (in a testamentary sense) or to death involved in covenant ratification.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 언약[a]은 죽음[b]이 있을 때에 유효하며, 그것을 세운 이가 살아 있는 동안에는 결코 효력이 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유언’ 또는 ‘유서’. 그리스어 단어는 ‘언약’과 ‘유언/유서’ 둘 다를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 표현은 압축되어 있으며, 죽은 사람들과 관련된 경우, 유언자의 죽음 이후, 또는 언약을 확증하는 희생과 관련된 죽음을 가리킬 수 있습니다.
