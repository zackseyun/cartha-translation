base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
  footnotes:
  - marker: a
    text: Or 'For a will is valid only after death, since it is never in force while the one who made it is living.' The Greek term can mean either 'covenant' or 'will/testament.'
