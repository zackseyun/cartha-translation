review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 τῶν ἁγίων은 성막 문맥의 복수형 ‘거룩한 곳들/성소’를 가리키므로, 한국어에서는 집합적으로 쓰는 ‘성소’가 자연스럽습니다. μήπω πεφανερῶσθαι의 ‘아직 드러나지 않았다’와 ἔτι ... ἐχούσης의 ‘아직 서 있는 동안’도 유지했습니다.
  naturalness: ‘성소들’은 현대 한국어 성경 문체에서 부자연스럽습니다. 또한 ‘나타나지 아니하였다는’보다 ‘드러나지 않았다는’이 현대 합쇼체에서 자연스럽고, 본문의 계시·접근 의미를 잘 드러냅니다.
  terminology: πνεῦμα τὸ ἅγιον은 ‘성령’으로, σκηνή는 ‘장막’으로 유지했습니다. ‘첫째 장막’은 바로 앞 문맥(9:2)의 공간적 구분을 반영하면서도 ‘첫 장막’보다 한국어에서 더 명료합니다. 성소를 지성소로 한정하지 않았습니다.
  issues:
  - severity: low
    issue: ‘성소들’이라는 복수 표현이 한국어에서 어색함
    rationale: 그리스어 복수형은 보존하되, 한국어의 집합 명사 ‘성소’로 옮기는 것이 자연스럽고 성막의 특정 구역인 지성소로 의미를 좁히지 않습니다.
  - severity: low
    issue: ‘나타나지 아니하였다는’의 문체
    rationale: 문법적으로 가능하지만 현대 표준어 합쇼체에서는 ‘드러나지 않았다는’이 더 자연스럽고 πεφανερῶσθαι의 ‘명백히 드러남’에 잘 맞습니다.
