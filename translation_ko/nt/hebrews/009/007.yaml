  text: 그러나 둘째 칸[a]에는 대제사장만이 해마다 한 번 들어가며, 피 없이는 들어가지 않습니다. 그는 그 피를 자신과 백성이 알지 못하고 지은 죄들[b]을 위하여 드립니다.
