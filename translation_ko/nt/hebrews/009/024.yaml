revisions:
- from: 이는 메시아께서 손으로 지은 성소들로 들어가신 것이 아니라—그것들은 참된 것들의 모형들입니다—하늘 자체로 들어가셨기 때문입니다. 이제 그분은 우리를 위하여 하나님의 면전에 나타나십니다.
  to: 이는 메시아께서 참된 것들의 모형인 손으로 만든 성소들에 들어가신 것이 아니라, 하늘 자체에 들어가셔서 이제 우리를 위하여 하나님의 면전에 나타나시기 때문입니다.
  rationale: The revision retains the source’s cultic plural, earthly/heavenly contrast, intensive “heaven itself,” temporal “now,” and representative “for us,” while restoring the purpose relation of the infinitive and smoothing the apposition into idiomatic formal Korean.
  reviewer_model: gpt-5.6-terra
