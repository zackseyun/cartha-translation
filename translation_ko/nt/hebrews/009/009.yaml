  source_fidelity: 핵심 구조와 의미는 대체로 충실합니다. 다만 ἐνεστηκότα는 여기서 ‘시대’보다 ‘현재의 때’로 옮기는 편이 더 직접적이며, κατὰ συνείδησιν은 ‘양심을’이라는 목적어처럼 보이기보다 예배하는 사람이 온전하게 되는 범위를 한정하도록 표현하는 것이 정확합니다.
  naturalness: ‘온전케’는 현대 표준어 문체에서 다소 고풍스럽습니다. ‘온전하게 하다’가 자연스럽고, ‘현재의 시대’는 이 문맥에서 ‘현재의 때’보다 지나치게 시대/시대를 뜻하는 뉘앙스를 줄 수 있습니다.
  terminology: παραβολή의 ‘비유’는 영어 POB의 선택을 보존합니다. 다만 이 문맥에서 가능한 ‘상징’과 ‘표상’을 각주로 제시하여 어휘적 폭을 보존합니다. δῶρα와 θυσίαι는 ‘예물과 제물’, τελειῶσαι는 ‘온전하게 하다’로 적절히 구별됩니다.
