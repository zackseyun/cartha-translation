  source_fidelity: 핵심 대조와 복수형(‘제물들’)은 대체로 보존되었습니다. 그러나 두 번째 부정사 구문도 첫 절과 마찬가지로 과거의 필요성을 말하므로, 현재형 ‘되어야 합니다’보다 ‘될 필요가 있었습니다’가 원문의 시제와 병렬을 더 정확히 반영합니다.
  naturalness: ‘정결케’는 이해 가능하나 현대 표준어 합쇼체에서는 ‘정결하게’가 더 자연스럽습니다. ‘하늘에 속한 것들’은 첫 절의 ‘하늘에 있는 것들’과 δεύτε 절의 ἐπουράνια의 표현상 구별을 무리 없이 살립니다.
  terminology: ‘모형들’은 ὑποδείγματα의 가능한 번역입니다. ‘희생제물들’은 θυσίαις의 제의적 의미와 복수형을 명확히 드러내며, ‘더 나은’은 히브리서에서 κρείττων의 비교 표현을 자연스럽게 옮깁니다.
