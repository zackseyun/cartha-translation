source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
  footnotes:
  - marker: a
    text: Or 'patterns' or 'representations' for 'copies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to be purified.' The verb is ritual language for cleansing/purification.
    reason: lexical_alternative
  - marker: c
    text: The Greek says 'better sacrifices' (plural), though the context in Hebrews centers on Messiah's once-for-all offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 하늘에 있는 것들의 모형들[a]은 이것들로 정결하게 될[b] 필요가 있었으나, 하늘에 속한 것들 자체는 이것들보다 더 나은 희생제물들[c]로 정결하게 될 필요가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘본들’, ‘표상들’.
    reason: ὑποδείγματα의 어휘적 대안입니다.
  - marker: b
    text: 또는 ‘정화될’. 이 동사는 제의적 정결 또는 정화를 가리키는 표현입니다.
    reason: καθαρίζεσθαι의 제의적 의미와 번역 대안을 나타냅니다.
  - marker: c
    text: 그리스어는 ‘희생제물들’이라고 복수형을 사용합니다. 문맥은 메시아의 단번의 제사에 초점을 두지만, 여기서는 원문의 복수형을 유지합니다.
    reason: θυσίαις의 복수형을 보존한 이유를 설명합니다.
