review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional and cultic contrast, but renders the active participle ῥαντίζουσα ('sprinkling') passively as '뿌려져서.' The revision preserves its modifying relation to '암송아지의 재' and its active ritual action.
  naturalness: '''부정하게 된 사람들에게 뿌리는 암송아지의 재'' is clear, idiomatic modern formal Korean. It also avoids the less natural implication that ashes themselves are merely passively applied without retaining the Greek participial relation.'
  terminology: '''염소와 황소의 피,'' ''암송아지의 재,'' ''부정하게 된 사람들,'' ''육체의 정결,'' and ''거룩하게 하다'' accurately preserve the passage''s sacrificial and ritual terminology. ''육체'' is retained rather than interpretively expanded to ''외적인'' or ''몸.'''
  issues:
