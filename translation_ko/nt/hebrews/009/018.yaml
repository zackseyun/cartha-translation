  source_fidelity: ‘첫 언약도’는 ἡ πρώτη의 문맥상 지시 대상을 명확히 잘 드러내며, ‘그러므로’와 ‘피 없이’도 각각 ὅθεν과 χωρὶς αἵματος를 충실히 옮깁니다. 그러나 ‘봉헌되다’는 주로 건물·제물·성물 등을 바쳐 드리거나 헌정하는 뜻이어서 언약의 발효·수립이라는 ἐγκεκαίνισται의 문맥에 맞지 않습니다.
  naturalness: ‘봉헌되지 아니하였습니다’는 현대 표준 한국어 합쇼체로 다소 문어적·부자연스럽습니다. ‘제정된 것은 아닙니다’가 언약에 자연스럽고, 그리스어 완료 수동태가 나타내는 이미 이루어진 수립을 무리 없이 반영합니다.
  terminology: ‘언약’은 본문과 인접 문맥에서 διαθήκη를 가리키는 적절한 신학·성경 용어입니다. ‘첫 언약조차도’는 οὐδέ의 강조(‘not even’)를 보존합니다.
  issues:
  - severity: medium
    issue: ἐγκεκαίνισται를 ‘봉헌되지 아니하였습니다’로 번역함
    rationale: ἐγκαινίζω는 여기서 출애굽기 24장의 피 뿌림과 관련된 언약의 개시·수립을 뜻합니다. ‘봉헌’은 언약 자체의 법적·의례적 개시를 나타내기에 부정확하며, 현대어로도 자연스럽지 않습니다.
  - severity: low
    issue: οὐδέ의 강조가 충분히 드러나지 않음
    rationale: ‘첫 언약도’도 가능하지만, ‘첫 언약조차도’가 ‘not even’의 강조를 더 분명하게 보존합니다.
