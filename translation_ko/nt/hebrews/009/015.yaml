  - severity: low
    issue: θανάτου γενομένου의 한국어 표현이 부자연스러움
    rationale: ‘죽음이 일어났으므로’는 한국어에서 다소 어색합니다. 죽음의 발생이라는 원문의 진술을 유지하면서 ‘죽음이 있었기에’로 다듬는 편이 자연스럽습니다.
  - severity: low
    issue: διαθήκη의 의미 중첩에 대한 각주가 없음
    rationale: 본절의 본문 번역은 ‘언약’이 적절하지만, 뒤의 9:16–17과 관련된 ‘유언’ 의미의 가능성을 각주로 밝혀 영어 감사 기록의 의미 보존 원칙과 부합하게 했습니다.
