  terminology: μεσίτης는 ‘중보자’, ἀπολύτρωσις는 ‘속량’, κληρονομία는 ‘유업’으로 유지했습니다. διαθήκη는 문맥상 ‘언약’으로 옮기되, 히브리서 9:16–17에서 중요해지는 ‘유언’의 의미 가능성은 각주로 보존했습니다.
