  to: 이 때문에 그분은 새 언약[a]의 중보자이십니다. 이는 첫 언약 아래에서 저질러진 범법들을 속량하기 위한 죽음이 있었기에, 부르심을 받은 이들이 영원한 유업의 약속을 받게 하려는 것입니다.
