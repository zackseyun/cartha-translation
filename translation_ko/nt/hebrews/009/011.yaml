review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실하나, 「이 창조에 속하지 아니한 것입니다」는 선행하는 「장막」을 받는 관계절로 처리되어야 합니다. 또한 διὰ τῆς ... σκηνῆς는 다음 절의 동사와 이어지는 문장 구조이므로, 현 절 안에서 메시아의 ‘오심’을 수식하는 것처럼 보이지 않게 보존할 필요가 있습니다.
  naturalness: 「손으로 짓지 아니한」과 「속하지 아니한 것입니다」는 현대 표준어 합쇼체 성경 문체로 다소 경직되어 있습니다. 「손으로 만들지 않은」 및 명시적인 반복으로 더 자연스럽고 구조가 분명해집니다.
  terminology: 「메시아」, 「대제사장」, 「장막」은 적절합니다. τῶν γενομένων ἀγαθῶν은 SBLGNT 본문을 따라 「이미 이루어진 좋은 것들」로 유지하며, 대안 독법은 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: 「곧 이 창조에 속하지 아니한 것입니다」의 문법적 지시 대상이 불명확합니다.
    rationale: τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως는 ‘더 크고 더 온전한 장막’을 설명합니다. 한국어에서는 「장막」을 반복하여 이 설명이 장막에 걸림을 분명히 하는 것이 안전합니다.
  - severity: medium
    issue: 「장막을 통하여」가 「오시어」를 수식하는 것으로 읽힐 수 있습니다.
    rationale: διὰ τῆς ... σκηνῆς는 9:12의 주동사와 연결되는 전치사구입니다. 이 절이 문장 중간에서 끝나는 원문의 연결을 유지하되, ‘오심의 수단’이라는 오독을 줄이는 구성이 필요합니다.
  - severity: low
    issue: 본문 비평상 대안 독법 각주가 없습니다.
    rationale: 본문은 γενομένων을 따르지만, 널리 알려진 μελλόντων 독법(‘장차 올 좋은 것들’)을 각주로 제시하면 영어 POB 감사 기록 및 본문 비평의 투명성을 보존합니다.
  revised_text: 그러나 메시아께서는 이미 이루어진 좋은 것들의 대제사장으로 오셨습니다. 그분은 손으로 만들지 않은, 더 크고 더 온전한 장막을 통하여—곧 이 창조에 속하지 않은 장막을 통하여—
  revised_footnotes:
  - marker: a
    text: 어떤 사본들은 ‘장차 올 좋은 것들의’로 읽습니다.
    reason: textual_variant
  revision_rationale: 문장의 첫 부분을 완결하여 παραγενόμενος를 자연스럽게 옮기고, 뒤의 「장막을 통하여」는 9:12에서 이어질 동사를 기다리는 원문의 절 경계를 반영하도록 별도 문장으로 두었습니다. 「장막」을 반복하여 ‘이 창조에 속하지 않은’이라는 설명의 대상을 명확히 했습니다. SBLGNT의 γενομένων은 「이미 이루어진」으로 보존하고, 대안 독법은 각주로 처리했습니다.
