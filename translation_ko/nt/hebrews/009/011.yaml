review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문(γενομένων)을 따라 ‘이미 이루어진 좋은 것들’로 옮긴 점과, ‘더 크고 더 온전한 장막’, ‘손으로 짓지 않은’, ‘이 창조에 속하지 않은’의 핵심 대조를 보존한 점은 적절합니다. 다만 현행 ‘곧 이 창조에 속하지 아니한 것입니다’는 οὐ ταύτης τῆς κτίσεως가 수식하는 ‘장막’을 독립된 서술문처럼 처리하여 문법적으로도 부자연스럽고 원문의 수식 관계를 흐립니다.
  naturalness: 현대 표준어 합쇼체에서는 ‘아니한’보다 ‘않은’, ‘오시어’보다 ‘오셔서’가 자연스럽습니다. 또한 원문은 12절의 주절로 이어지는 긴 문장 구조이므로, 11절 끝의 대시를 유지하되 ‘장막을 통하여’가 이어질 여지를 남기는 것이 좋습니다.
  terminology: ‘메시아’, ‘대제사장’, ‘장막’, ‘창조’는 문맥과 용어 일관성에 적합합니다. 본문이 따르는 γενομένων과 널리 알려진 이문 μελλόντων의 차이는 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘곧 이 창조에 속하지 아니한 것입니다’가 장막을 수식하는 원문 구문을 독립 서술처럼 바꿉니다.
    rationale: τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως는 앞의 σκηνῆς(장막)를 설명합니다. 한국어에서는 ‘곧 이 창조에 속하지 않은’이 ‘장막’을 직접 수식하도록 해야 합니다.
  - severity: low
    issue: 이문에 관한 각주가 없습니다.
    rationale: SBLGNT 본문은 γενομένων(이미 이루어진/와 있는)이지만, 일부 사본은 μελλόντων(장차 올)을 읽습니다. 본문 선택의 투명성을 위해 각주가 필요합니다.
  revised_text: 그러나 메시아께서는 이미 이루어진 좋은 것들[a]의 대제사장으로 오셔서, 손으로 짓지 않은, 곧 이 창조에 속하지 않은 더 크고 더 온전한 장막을 통하여—
  revised_footnotes:
  - marker: a
    text: 일부 사본에는 ‘장차 올 좋은 것들’로 되어 있습니다.
    reason: textual_variant
  revision_rationale: ‘이 창조에 속하지 않은’을 ‘장막’의 수식어로 재배치하여 원문의 구문과 의미를 정확히 보존했습니다. 이어지는 12절의 동사에 연결되는 문장 흐름을 대시로 유지했으며, 현대적 합쇼체로 다듬었습니다. SBLGNT의 γενομένων을 본문에 반영하고 대안 이문을 각주로 제시했습니다.
