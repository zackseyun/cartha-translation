translation:
  language: ko
  text: 모세가 율법에 따른 모든 계명을 모든 백성에게 말한 뒤, 물과 붉은 양털과 우슬초를 곁들인 송아지들의 피[a]를 가져다가 두루마리 자체와 모든 백성에게 뿌렸습니다,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “젊은 수소들의 피.” 그리스어 μόσχων은 제의 문맥에서 송아지들 또는 젊은 수소들을 가리킬 수 있습니다.
    reason: μόσχων의 어휘적 대안을 보존합니다.
