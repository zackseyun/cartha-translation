  source_fidelity: 수정이 필요합니다. 초안의 ‘모든 백성에게 뿌렸으며’는 한국어에서 피가 아닌 백성 자체를 뿌린다는 듯이 읽힐 수 있고, ἐράντισεν의 직접목적어 구조와 의례적 행위를 충분히 드러내지 못합니다. 또한 μετὰ ὕδατος κτλ.는 피와 함께 취한 물·진홍색 양털·우슬초의 동반 요소로 더 명료하게 연결할 필요가 있습니다.
  naturalness: ‘율법에 따라’, ‘온 백성’, ‘피를 … 함께 가져다가’, ‘…에게 뿌렸습니다’는 현대 표준어 합쇼체에서 자연스럽고, 피를 생략하되 문맥상 명확하게 하는 표현입니다. 절 단위가 이어지는 원문의 쉼표는 유지했습니다.
  terminology: μόσχων은 ‘송아지들’로 옮기고, 제의 문맥에서 가능한 ‘어린 황소들’은 각주로 보존했습니다. κοκκίνου는 ‘진홍색’으로, βιβλίον은 당시 문서 형태를 반영하여 ‘두루마리’로 옮겼습니다. ῥαντίζω는 ‘뿌리다’로 유지했습니다.
