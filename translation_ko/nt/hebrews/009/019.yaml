  terminology: ‘율법’, ‘계명’, ‘두루마리’, ‘우슬초’, ‘뿌리다’는 적절합니다. μόσχων의 의미 범위를 반영하여 본문은 ‘송아지들’로 두고 ‘젊은 수소들’이라는 대안을 각주에 제시합니다.
