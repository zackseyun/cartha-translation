    rationale: 헬라어는 두루마리와 온 백성을 ἐράντισεν의 목적어로 제시합니다. 한국어에서는 ‘~에게 뿌리다’가 무엇을 뿌렸는지 보충하지 않으면 백성을 대상으로 한 행위가 부자연스럽거나 오해될 수 있습니다.
