revisions:
- from: 그렇지 않다면 그분은 세상의 기초로부터 여러 번 고난을 받으셔야 했을 것입니다. 그러나 이제 그분은 자기 자신의 제물로 죄를 없이하시려고 시대들의 완성에 단번에 나타나셨습니다.
  to: 그렇지 않다면 그분은 세상이 창조된 때부터 여러 번 고난을 겪으셔야 했을 것입니다. 그러나 이제 그분은 시대들이 완성되는 때에 자신을 제물로 드리심으로써 죄를 없애시려고 단 한 번 나타나셨습니다.
  rationale: 'The revision retains the source''s argument: absent the actual once-only appearance, Christ would have needed to suffer repeatedly from the world''s foundation. It renders the two temporal idioms idiomatically, preserves the contrast between πολλάκις and ἅπαξ, retains the singular collective ''죄,'' and makes explicit in natural Korean that the sacrifice is Christ''s self-offering. No footnotes are required because the revised Korean text contains no footnote anchors and the principal lexical alternatives do not need to be carried into the text.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:49:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse's conditional contrast, Christ's suffering, the singularity of his appearance, and the purpose of dealing with sin. However, '세상의 기초로부터' is an unnecessarily literal and unnatural rendering of ἀπὸ καταβολῆς κόσμου, '시대들의 완성' is not idiomatic Korean for ἐπὶ συντελείᾳ τῶν αἰώνων, and '자기 자신의 제물로' can sound as though Christ is merely using a sacrificial object rather than offering himself.
  naturalness: Modern formal Korean is improved by rendering the temporal idioms as '세상이 창조된 때부터' and '시대들이 완성되는 때에.' '자신을 제물로 드리심으로써' naturally and clearly expresses the self-referential genitive without interpretive expansion.
  terminology: '''단 한 번'' clearly maintains the contrast with ''여러 번'' and the nonrepeated force of ἅπαξ. ''죄를 없애시려고'' suitably represents εἰς ἀθέτησιν ἁμαρτίας while retaining the Greek abstract singular ''죄.'''
  issues:
  - severity: medium
    issue: '''세상의 기초로부터'''
    rationale: Although formally close to 'from the foundation of the world,' this phrase is unnatural in contemporary Korean. The idiomatic temporal sense is '세상이 창조된 때부터.'
  - severity: medium
    issue: '''시대들의 완성'''
    rationale: This noun phrase is overly calqued and incomplete-sounding in Korean. The Greek temporal expression is more naturally rendered '시대들이 완성되는 때에.'
  - severity: medium
    issue: '''자기 자신의 제물로'''
    rationale: This wording is awkward and may obscure διὰ τῆς θυσίας αὐτοῦ, which refers to the sacrifice consisting in/offered as himself. '자신을 제물로 드리심으로써' communicates the construction naturally.
  revised_text: 그렇지 않다면 그분은 세상이 창조된 때부터 여러 번 고난을 겪으셔야 했을 것입니다. 그러나 이제 그분은 시대들이 완성되는 때에 자신을 제물로 드리심으로써 죄를 없애시려고 단 한 번 나타나셨습니다.
