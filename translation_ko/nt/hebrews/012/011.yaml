  text: 모든 훈련이 현재로는 기쁨이 아니라 슬픔으로 보이지만, 나중에는 그것을 통해 훈련받은 사람들에게 의[a]의 평화로운 열매를 맺어 줍니다.
  philosophy: optimal-equivalence
