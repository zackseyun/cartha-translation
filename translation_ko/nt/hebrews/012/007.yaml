source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
  footnotes:
  - marker: a
    text: Or 'Endure this as discipline.' The Greek can be understood either as an exhortation to endure for the sake of discipline or to regard what is endured as discipline.
    reason: alternative_reading
  - marker: b
    text: Greek 'sons.' The term reflects the father-son analogy in the argument; the application is not limited to males.
    reason: lexical_alternative
translation:
  language: ko
  text: 훈육을 위해 견디십시오.[a] 하나님께서는 여러분을 아들처럼 대하십니다.[b] 아버지가 훈육하지 않는 아들이 어디 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일을 훈육으로 여기고 견디십시오.” 그리스어는 훈육을 위해 견디라는 뜻으로도, 겪는 일을 훈육으로 받아들이라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 “아들들”입니다. 이는 아버지와 아들의 비유를 따른 표현이며, 그 적용이 남성에게만 한정된다는 뜻은 아닙니다.
    reason: lexical_alternative
