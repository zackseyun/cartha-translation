  source_fidelity: 원문의 추론 표지(διό), 현재적 수령의 상황(παραλαμβάνοντες), 흔들리지 않는 왕국, 그리고 하나님께 드리는 경외와 두려움의 섬김은 대체로 반영되었습니다. 그러나 ‘은혜를 가지고’는 ἔχωμεν χάριν의 권면형을 충분히 드러내지 못하고 한국어 연결도 부자연스럽습니다. 또한 χάριν의 ‘은혜/감사’라는 중요한 의미 가능성을 각주로 보존해야 합니다.
  naturalness: ‘은혜를 가지고, 그것을 통하여’는 현대 표준 한국어에서 다소 어색하며, ‘그 은혜를 통하여’처럼 선행사를 명시하는 편이 자연스럽습니다. ‘받으니’도 가능하나, 현재분사의 진행·상황적 뉘앙스는 ‘받고 있으므로’가 더 분명합니다.
