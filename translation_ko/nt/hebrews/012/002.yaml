  source_fidelity: 개정이 필요합니다. 초안의 ‘우리의 눈’은 원문에 없는 ‘우리’를 보충하며, ἀφορῶντες의 초점 있는 시선을 ‘눈을 고정하다’로 옮긴 것은 가능하나 더 자연스러운 ‘바라보다’가 적절합니다. 또한 κεκάθικεν은 완료형이므로 ‘앉아 계십니다’가 현재까지의 결과를 더 잘 나타냅니다.
  naturalness: ‘믿음의 개척자이시며 완성자이신 예수께 우리의 눈을 고정합시다’보다 ‘믿음의 개척자요 완성자이신 예수를 바라봅시다’가 현대 표준어 합쇼체에서 자연스럽습니다. ‘수치를 멸시하셨으며’는 오해의 여지가 있으므로, 문맥상 수치를 결정적인 것으로 여기지 않으셨다는 뜻을 살려 ‘수치를 개의치 않으시고’로 옮깁니다.
  terminology: ‘개척자’와 ‘완성자’는 ἀρχηγός와 τελειωτής의 길을 여는/완성하는 의미를 잘 보존합니다. τῆς πίστεως는 본문에서 ‘믿음’으로 두되 ‘신실함’ 및 ‘우리의 믿음’이라는 가능한 이해는 각주로 남깁니다. ‘하나님의 보좌 우편’은 가능하지만 ‘하나님의 보좌 오른편’이 원문의 보좌 관련 속격 구조를 더 투명하게 드러냅니다.
