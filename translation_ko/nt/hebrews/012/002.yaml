id: HEB.12.2
reference: Hebrews 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
  footnotes:
  - marker: a
    text: Or 'the pioneer and perfecter of faithfulness,' or 'the pioneer and perfecter of our faith.' The Greek phrase is compact, and πίστις can also be understood as 'faithfulness' or as referring specifically to believers' faith.
    reason: alternative_reading
  - marker: b
    text: Or 'disregarding the shame.' The sense is that he treated the disgrace of crucifixion as something not decisive.
    reason: lexical_alternative
translation:
  language: ko
  text: 믿음의 개척자요 완성자이신 예수를 바라봅시다[a]. 그분은 자기 앞에 놓인 기쁨을 위하여 십자가를 견디시고, 수치를 개의치 않으셨으며[b], 하나님의 보좌 오른편에 앉아 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실함의 개척자요 완성자’ 또는 ‘우리의 믿음의 개척자요 완성자’. 그리스어 표현은 간결하며, ‘믿음’은 신실함을 가리키거나 믿는 이들의 믿음을 특별히 가리키는 것으로 이해될 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘수치를 멸시하시고’ 또는 ‘수치를 무시하시고’. 이는 십자가형의 치욕을 결정적인 것으로 여기지 않으셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχηγὸν καὶ τελειωτὴν
  english_pob_choice: pioneer and perfecter
  chosen_korean: 개척자이시며 완성자
  alternatives_korean:
  - 창시자와 온전케 하시는 분
  lexicon: BDAG
  rationale: ἀρχηγός는 「길을 여는 자」, τελειωτής는 「완성하는 자」의 의미를 살린다.
