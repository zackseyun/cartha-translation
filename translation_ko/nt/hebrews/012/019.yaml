  to: 나팔 소리[b]와 말씀하시는 음성[a]에 이른 것이 아닙니다. 그 음성을 들은 이들은 더 이상의 말씀이 자기들에게 전해지지 않기를 간청하였습니다.
  rationale: 문맥에 따라 보충된 “이른 것이 아닙니다”는 유지했습니다. 다만 원문의 음성-말씀 관계와 상대절의 지시를 자연스러운 한국어로 명확히 했고, 논쟁 가능한 상대대명사의 범위는 각주로 보존했습니다. 각주 표지는 해당 표현 뒤에 배치했습니다.
