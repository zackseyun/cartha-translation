base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
  footnotes:
  - marker: a
    text: Or, 'which those who heard begged should not continue to address them,' taking the relative as referring more broadly to the whole Sinai manifestation rather than specifically to 'a voice of words.'
    reason: alternative_reading
  - marker: b
    text: See Exodus 20:18–19 and Deuteronomy 5:23–27 for the Israelites' plea not to hear God's voice directly any longer.
    reason: cross_reference
translation:
  language: ko
  text: 나팔 소리[b]와 말씀하시는 음성[a]에 이른 것이 아닙니다. 그 음성을 들은 이들은 더 이상의 말씀이 자기들에게 전해지지 않기를 간청하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것을 들은 이들이 더 이상의 말씀이 자기들에게 전해지지 않기를 간청하였습니다.” 여기서 관계대명사는 가장 가까운 선행사인 ‘음성’을 가리킬 수 있으나, 나팔 소리와 음성을 포함한 시내산의 현상 전체를 가리키는 것으로 볼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이스라엘 백성이 하나님의 음성을 더 이상 직접 듣지 않게 해 달라고 간청한 내용은 출애굽기 20:18–19와 신명기 5:23–27을 보십시오.
    reason: cross_reference
