  source_fidelity: 핵심 의미와 문장 구조는 대체로 충실합니다. 다만 βέβηλος는 여기서 단순히 세속적이라는 뜻의 ‘속된 자’보다, 거룩한 것을 존중하지 않는 ‘불경한 자’로 옮기는 편이 문맥과 어휘 의미를 더 정확히 드러냅니다. ἀντὶ βρώσεως μιᾶς의 교환 관계도 ‘대가로’로 명시할 수 있습니다.
