  terminology: ‘에서’, ‘장자권’, ‘음행하는 자’는 정착된 성서 용례이며 적절합니다. βέβηλος는 ‘불경한 자’가 ‘속된 자’보다 이 구절에서 요구되는 부정적 종교·윤리적 함의를 더 잘 보존합니다.
  issues:
