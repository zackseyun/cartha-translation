    issue: βέβηλος를 ‘속된 자’로 번역함
    rationale: ‘속된’은 일상적·세속적이라는 비교적 중립적 의미로도 이해될 수 있습니다. βέβηλος는 거룩한 것을 함부로 대하거나 존중하지 않는 태도를 가리키므로, 에서가 장자권을 경시한 문맥에서는 ‘불경한 자’가 더 정확합니다.
