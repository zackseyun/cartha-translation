  verdict: revise
  source_fidelity: ‘모든 사람의 심판자’는 πάντων을 사람으로 한정합니다. 문맥상 하나님이 ‘모든 이의 심판자’이심을 말하므로, 사람으로 제한하지 않는 표현이 더 충실합니다. 또한 τετελειωμένων의 완료 수동 의미는 ‘온전케 된’보다 현대어인 ‘온전하게 된’으로 자연스럽게 나타낼 수 있습니다. ἐν οὐρανοῖς의 복수는 한국어 본문에서는 관용적으로 ‘하늘에’라고 하되 각주로 밝혔습니다.
  naturalness: ‘온전케 된’은 현대 표준어 합쇼체 성경 번역에서는 다소 고어적입니다. ‘온전하게 된’이 자연스럽고 뜻도 보존합니다. ‘장자들의 회중’과 절 전체의 여격 나열 및 앞절에서 이어지는 ‘이르렀고’는 유지할 수 있습니다.
  terminology: ἐκκλησίᾳ는 이 종말론적 문맥에서 ‘회중’으로 적절합니다. πρωτοτόκων은 원문의 복수와 집합적 지위를 보존하여 ‘장자들’로 옮깁니다. πνεύμασι δικαίων τετελειωμένων은 해석을 덧붙이지 않고 ‘온전하게 된 의인들의 영들’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘모든 사람의 심판자’가 πάντων의 범위를 사람으로 제한함
    rationale: πάντων은 원문상 ‘모든 사람’으로 명시되어 있지 않습니다. ‘모든 이의’는 한국어에서 포괄성을 보존하면서도 불필요한 한정을 피합니다.
  - severity: low
    issue: ‘온전케 된’의 문체가 현대 표준어에 비해 고어적임
    rationale: ‘온전하게 된’은 τετελειωμένων의 완료 수동 의미를 유지하면서 현대적이고 자연스럽습니다.
  revised_text: 하늘에 등록된 장자들의 회중과, 모든 이의 심판자이신 하나님과, 온전하게 된 의인들의 영들에게 이르렀고,
  revised_footnotes:
  - marker: a
    text: 또는 ‘하늘들에 등록된’. 그리스어는 ‘하늘들’이라는 복수형을 사용합니다.
    reason: 원문의 복수형 οὐρανοῖς를 한국어의 관용적 단수 표현 ‘하늘에’와 함께 투명하게 보존하기 위함입니다.
  revision_rationale: ‘모든 사람’을 원문의 포괄적 표현에 더 가까운 ‘모든 이’로 고치고, 고어적인 ‘온전케’를 현대어 ‘온전하게’로 바꾸었습니다. ‘하늘에’는 자연스러운 한국어를 위해 유지하되, 원문의 복수형은 각주로 표시했습니다.
