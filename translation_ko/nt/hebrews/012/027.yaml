revisions:
- from: 「다시 한 번」이라는 이 표현은, 흔들리지 않는 것들이 남아 있게 하시려고, 흔들리는 것들이—만들어진 것들로서—제거됨을 가리킵니다.
  to: 「다시 한 번」이라는 이 말은 흔들리는 것들, 곧 만들어진 것들이 제거되어 흔들리지 않는 것들이 남도록 함을 가리킵니다.
  rationale: 원문의 인용구를 가리키는 중성 명사구(τὸ δὲ Ἔτι ἅπαξ), 흔들리는 것들의 제거, 만들어진 것들이라는 설명(ὡς πεποιημένων), 그리고 흔들리지 않는 것들이 남는 목적을 모두 보존했습니다. 특히 ‘하시려고’를 제거하여 원문에 없는 신적 행위자를 첨가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:52:52Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘남아 있게 하시려고’는 헬라어 ἵνα μείνῃ의 목적/결과 절에 하나님을 행위자로 하는 사역 표현을 보태므로, 원문에 없는 주체를 도입합니다. 또한 ὡς πεποιημένων은 흔들리는 것들이 ‘만들어진 것들’이라는 설명을 유지해야 합니다.
  naturalness: ‘흔들리는 것들, 곧 만들어진 것들’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 설명적 관계를 명료하게 나타냅니다. ‘남도록’은 원문의 목적을 자연스럽게 표현합니다.
  terminology: σαλευομένων/μὴ σαλευόμενα의 대조를 각각 ‘흔들리는 것들’과 ‘흔들리지 않는 것들’로 일관되게 보존했습니다. 제출된 어휘 결정의 ἀσάλευτος는 이 절의 원문 어휘가 아니며, 실제 본문에는 σαλευομένων이 사용됩니다.
  issues:
  - severity: high
    issue: ‘남아 있게 하시려고’가 원문에 없는 행위자를 도입함
    rationale: ἵνα μείνῃ는 ‘남도록/남게 하려는’ 목적을 나타내지만, 하나님을 명시하거나 암시하는 사역 구문을 요구하지 않습니다. 원문의 문법적 모호성을 보존해야 합니다.
  - severity: low
    issue: ‘만들어진 것들로서’의 한국어 연결이 다소 부자연스러움
    rationale: ὡς πεποιημένων의 설명적 기능은 유지하되, ‘곧 만들어진 것들’로 풀면 자연스럽고 의미가 분명합니다.
  - severity: low
    issue: 어휘 결정에 본문에 없는 ἀσάλευτος가 제시됨
    rationale: 히브리서 12:27의 해당 대조는 σαλευομένων 및 μὴ σαλευόμενα이며, ἀσάλευτος는 이 절에 나타나지 않습니다.
  revised_text: 「다시 한 번」이라는 이 말은 흔들리는 것들, 곧 만들어진 것들이 제거되어 흔들리지 않는 것들이 남도록 함을 가리킵니다.
