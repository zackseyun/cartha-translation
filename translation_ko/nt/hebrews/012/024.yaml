  naturalness: '''새 언약의 중보자이신 예수께 이르렀고 ... 피에 이르렀습니다''는 현대 한국어 합쇼체로 자연스럽고, 앞 절들에서 이어지는 ''이르렀습니다''의 목록 구조도 유지합니다. ''더 좋은 것을 말하는''은 κρεῖττον의 목적어가 생략된 표현을 자연스럽게 재현합니다.'
  terminology: '''새 언약'', ''중보자'', ''뿌려진 피''는 히브리서의 언약·제의 어휘를 정확하고 현대적으로 전달합니다. ''아벨''은 본문에 그대로 두고, 피를 가리킨다는 흔한 이해는 각주로 한정합니다.'
