base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
  footnotes:
  - marker: a
    text: Or 'than the blood of Abel.' The Greek reads simply 'than Abel,' likely alluding to Abel's blood crying out from the ground (Gen 4:10).
    reason: alternative_reading
  - marker: b
    text: '''The sprinkled blood'' refers to sacrificial blood applied by sprinkling, evoking covenant ratification and cleansing imagery.'
    reason: cultural_note
translation:
  language: ko
  text: 또한 새 언약의 중보자이신 예수께 이르렀고, 아벨[a]보다 더 좋은 것을 말하는 뿌려진 피[b]에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아벨의 피보다.’ 그리스어 본문은 단지 ‘아벨보다’라고 하며, 아마도 아벨의 피가 땅에서 부르짖은 일을 암시합니다(창 4:10).
    reason: alternative_reading
  - marker: b
    text: ‘뿌려진 피’는 희생 제물의 피를 뿌리는 일을 가리키며, 언약의 비준과 정결의 이미지를 불러일으킵니다.
    reason: cultural_note
