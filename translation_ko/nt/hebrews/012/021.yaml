  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
  footnotes:
  - marker: a
    text: Or “what appeared” or “the spectacle.” The Greek expression refers to the visible manifestation at Sinai.
    reason: lexical_alternative
  - marker: b
    text: The wording is not a verbatim quotation from the Old Testament but reflects Moses’ fearful response associated with the Sinai event; compare Deut 9:19.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그 광경이 너무도 두려워서 모세가 말하였습니다[b][a]. 「나는 몹시 두려워 떨고 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나타난 것” 또는 “보이는 것”. 그리스어 표현은 시내산에서 보인 가시적 현현을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 말은 구약의 직접 인용이 아니라, 시내산 사건과 관련된 모세의 두려운 반응을 반영합니다. 신명기 9:19를 비교하십시오.
    reason: cross_reference
