translation:
  language: ko
  text: 그러나 여러분은 시온 산과 살아 계신 하나님의 도성, 곧 하늘의 예루살렘과 무수한[a] 천사들의 축제 모임[b]에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
