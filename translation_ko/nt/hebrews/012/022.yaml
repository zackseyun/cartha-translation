    text: ‘무수한’으로 번역한 그리스어는 문자적으로 ‘만들’ 또는 ‘수만’을 뜻할 수도 있고, 일반적으로 헤아릴 수 없이 많은 무리를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 문법상 ‘축제 모임’은 ‘무수한 천사들’을 수식할 수도 있고, 별도의 병렬 항목으로 읽을 수도 있습니다.
