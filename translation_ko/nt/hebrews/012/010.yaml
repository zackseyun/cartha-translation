  to: 그들은 며칠 동안 자기들이 좋다고 여기는 대로 우리를 훈육하였으나, 그분은 우리가 그분의 거룩하심에 참여하도록 우리의 유익을 위하여 그렇게 하십니다.
  rationale: The revision renders πρὸς ὀλίγας ἡμέρας as '며칠 동안,' retains the subjective force of κατὰ τὸ δοκοῦν αὐτοῖς with an idiomatic Korean expression, and uses parental-discipline terminology for ἐπαίδευον. It preserves the implicit contrastive subject, the beneficial purpose of divine discipline, and participation in God's holiness.
