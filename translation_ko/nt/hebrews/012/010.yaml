base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
  footnotes:
  - marker: a
    text: Or 'for a short time.' The Greek phrase emphasizes the limited duration of earthly fathers' discipline in contrast with God's enduring purpose.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to what seemed right to them.'
    reason: alternative_reading
