  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
  footnotes:
  - marker: a
    text: Or 'fail to obtain the grace of God.' The Greek expression can denote not attaining what is offered as well as falling short of it.
    reason: lexical_alternative
  - marker: b
    text: '''Root of bitterness'' likely echoes Deuteronomy 29:18, where a poisonous root symbolizes covenant unfaithfulness spreading within the community.'
    reason: cross_reference
translation:
  language: ko
  text: 아무도 하나님의 은혜에 이르지 못하는 일이 없도록, 어떤 쓴 뿌리가 돋아나서 괴롭히고 그것으로 말미암아 많은 사람이 더럽혀지는 일이 없도록 주의 깊게 살피십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 은혜를 얻지 못하는.” 헬라어 표현은 제공된 것을 얻지 못하는 것과 그 은혜에 미치지 못하는 것을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “쓴 뿌리”는 아마도 신명기 29:18을 반영합니다. այնտեղ 독이 되는 뿌리는 공동체 안에 퍼지는 언약 불성실을 상징합니다.
    reason: cross_reference
