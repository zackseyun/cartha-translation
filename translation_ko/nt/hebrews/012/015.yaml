    rationale: '''아무도 하나님의 은혜에 미치지 못하는 자가 없도록''은 ''아무도''와 ''자가 없도록''이 중복되어 부자연스럽습니다. 또한 ''미치지 못하다''보다 여기서는 제공된 은혜에 도달하지 못함/결여함의 여지를 남기는 ''은혜에 이르지 못하다''가 더 직접적입니다.'
  - severity: medium
    issue: 두 번째와 세 번째 경고절의 부정 연결
    rationale: '''괴롭게 하지 못하도록''과 ''더럽혀지지 못하도록''은 한국어에서 능력의 부정처럼 들릴 수 있습니다. 경계의 목적을 나타내는 ''... 일이 없도록''으로 병렬화해야 자연스럽습니다.'
  - severity: low
