  source_fidelity: 핵심 어휘와 경고의 구조는 대체로 반영되어 있습니다. 다만 초안의 “아무도 … 자가 없도록”은 중복되어 문법적으로 부자연스럽고, 세 부정 목적절의 연결도 더 분명히 할 필요가 있습니다. 개정문은 ὑστερῶν ἀπὸ τῆς χάριτος를 교리적으로 단정하지 않고 “하나님의 은혜에 미치지 못하다”로 옮겼으며, μιανθῶσιν의 강한 도덕적·제의적 함의를 “더럽혀지다”로 보존했습니다.
  naturalness: “아무도 하나님의 은혜에 미치지 못하는 자가 없도록”은 ‘아무도’와 ‘자가 없도록’이 겹칩니다. 또한 “괴롭게 하지 못하도록”보다 주어인 ‘쓴 뿌리’가 일으키는 결과를 드러내는 “괴롭히고 … 더럽혀지는 일이 없도록”이 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: “하나님의 은혜,” “쓴 뿌리,” “더럽혀지다”는 원문의 신학적·성경적 어조를 적절히 보존합니다. “쓴 뿌리”는 신명기 29:18의 배경을 암시할 수 있으므로 유지합니다.
  issues:
  - severity: medium
    issue: 중복·부자연스러운 부정 표현
    rationale: “아무도 … 자가 없도록”은 동일한 부정 의미를 중복하여 한국어 문장으로 어색합니다.
  - severity: low
    issue: 목적절들의 연결이 불분명함
    rationale: 원문은 ‘주의하여 살피라’에 이어 두 경고절을 제시합니다. 한국어에서는 두 번째 경고절 안의 ‘괴롭히고/더럽혀지는’ 결과 연결을 분명히 하는 편이 자연스럽습니다.
  revised_text: 아무도 하나님의 은혜에 미치지 못하는 일이 없도록, 또 어떤 쓴 뿌리가 돋아나 괴롭히고 그것으로 말미암아 많은 사람이 더럽혀지는 일이 없도록 주의 깊게 살피십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “하나님의 은혜를 얻지 못하는.” 그리스어 표현은 제공된 은혜에 이르지 못한다는 뜻과 은혜에 미치지 못한다는 뜻을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “쓴 뿌리”는 신명기 29:18을 반향하는 것으로 보입니다. այնտեղ 독성 있는 뿌리는 공동체 안에 퍼지는 언약 불충실을 상징합니다.
    reason: cross_reference
  revision_rationale: 문법 중복을 제거하고, 원문의 두 μή 경고절과 두 번째 경고절의 인과적 전개를 자연스러운 한국어로 정리했습니다. ‘은혜에 미치지 못하다’는 구원의 상실이나 획득 실패에 관한 특정 교리적 결론을 강요하지 않습니다.
