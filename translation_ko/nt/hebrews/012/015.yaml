review_pass:
  verdict: revise
  source_fidelity: 초안은 하나님의 은혜에 이르지 못함, 쓴 뿌리의 발생, 많은 사람의 더러워짐이라는 핵심 요소를 담고 있습니다. 그러나 '아무도 ... 자가 없도록'은 문법적으로 부자연스럽고, 각 경고절에 '못하도록'을 붙인 방식은 헬라어의 병렬적인 경계/예방 구조를 충분히 자연스럽게 나타내지 못합니다. 수정문은 ὑστερῶν ἀπό의 의미를 교리적으로 단정하지 않고 '은혜에 이르지 못하다'로 유지하며, δι’ αὐτῆς의 도구적 의미와 μιανθῶσιν의 강한 더러움 표현을 보존합니다.
  naturalness: 합쇼체 명령인 '주의 깊게 살피십시오'는 적절합니다. 다만 '어떤 쓴 뿌리가 솟아나서 괴롭게 하지 못하도록'은 주어와 부정 연결이 어색합니다. '돋아나서 괴롭히고, 그것으로 말미암아 ... 더럽혀지는 일이 없도록'으로 고치면 현대 표준 한국어에서 자연스럽고 병렬 구조도 명료해집니다.
  terminology: '''하나님의 은혜'', ''쓴 뿌리'', ''더럽혀지다''는 모두 적절합니다. ''쓴 뿌리''는 신명기 29:18의 배경을 반영할 수 있는 정착된 성경적 표현이며, 이를 특정 교리적 해석으로 한정하지 않습니다. 영어 감사 추적에 있는 두 주석은 번역문에도 대응 표지로 제시하는 것이 적절합니다.'
  issues:
