  to: 여러분은 말씀하시는 분을 거부하지 않도록 주의하십시오. 땅에서 경고하시는 분을 거부한 그들이 피하지 못했다면, 하늘에서 경고하시는 분에게서 돌아서는 우리는 더욱 피하지 못할 것입니다.[a]
