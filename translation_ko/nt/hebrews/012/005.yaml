  to: 그리고 여러분은 여러분을 아들들로 대하여 말씀하시는 그 권면을 잊어버렸습니다. “내 아들아, 주님의 징계를 가볍게 여기지 말고, 그분께 책망을 받을 때 낙심하지도 말라.”[a]
  rationale: 수신자 관계(‘여러분을 아들들로 대하여’)를 명확히 하고, κύριος를 ‘주님’으로 직역적·문맥적으로 처리했습니다. παιδεία는 문맥에 맞게 ‘징계’로 옮기되, 그 폭넓은 형성적 의미는 각주에서 보존했습니다. 누락된 인용 부호와 인용 범위도 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
