  source_fidelity: 현 초안은 SBLGNT의 ἑαυτούς(‘자기들/그들 자신’) 대신 이문 ἑαυτόν(‘자기 자신/그 자신’)의 뜻을 본문에 채택했습니다. 또한 ‘그러한 적대’의 수식 관계를 더 분명히 할 필요가 있습니다. 수정문은 SBLGNT 본문을 따르되, 문맥상 난해한 대명사 문제를 각주로 밝혔습니다.
  naturalness: ‘깊이 생각하십시오’와 합쇼체는 자연스럽습니다. 다만 ‘여러분의 영혼이 낙담하여 지치지 아니할 것입니다’는 원문의 권면 목적절과 분사 관계를 다소 평서적으로 바꾸므로, ‘지쳐 낙심하지 않도록’으로 옮기는 편이 자연스럽고 가깝습니다.
