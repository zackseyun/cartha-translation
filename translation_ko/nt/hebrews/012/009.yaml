  source_fidelity: 초안의 ‘훈련자들로 모셨고’는 εἴχομεν παιδευτὰς(‘훈육하는 이들로 두었/가졌고’)를 ‘그들을 섬겼다’는 뜻으로 오해하게 할 수 있습니다. 또한 ‘훈련자들’은 부모의 징계·훈육이라는 문맥을 충분히 드러내지 못합니다. ‘영들의 아버지’는 원문의 복수와 의도적으로 넓게 남겨 둔 표현을 보존합니다.
  naturalness: ‘우리 육신의 아버지들’은 다소 직역적이지만, ‘영들의 아버지’와의 대조를 보존하는 성경 문맥에서는 이해 가능한 현대 표준어입니다. 이를 주어로 하여 ‘우리를 훈육하는 이들이었고’라고 하면 자연스럽고 원문의 관계를 정확히 전달합니다.
  terminology: παιδευταί는 이 문맥에서 ‘훈련자’보다 ‘훈육하는 이들’이 적절합니다. ὑποταγησόμεθα는 ‘복종하다’로, τῷ πατρὶ τῶν πνευμάτων은 ‘영들의 아버지’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘훈련자들로 모셨고’
    rationale: ‘모시다’는 존대·봉사의 의미를 강하게 내며, 원문의 ‘아버지들을 훈육자들로 가졌다’라는 뜻을 정확히 전달하지 못합니다.
  - severity: low
    issue: ‘훈련자들’
    rationale: 일반적 훈련을 연상시켜 히브리서 12장의 부모적 훈육·징계 문맥을 약화할 수 있습니다.
  revised_text: 또한 우리의 육신의 아버지들은 우리를 훈육하는 이들이었고, 우리는 그들을 공경하였습니다. 하물며 영들의 아버지께 더욱더 복종하여 살지 않겠습니까?
  revised_footnotes: []
