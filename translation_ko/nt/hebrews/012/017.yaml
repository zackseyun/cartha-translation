  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
  footnotes:
  - marker: a
    text: Or, 'he found no place for repentance'; this may mean he found no opportunity to reverse the outcome, or that he could not obtain a change of mind from Isaac.
    reason: alternative_reading
  - marker: b
    text: The pronoun 'it' may refer to 'the blessing' or, less likely, to 'repentance/opportunity'; the Greek leaves the referent ambiguous.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분도 아시다시피, 그는 후에 축복을 상속받고자 하였으나 거절당했습니다. 이는 그가 눈물로 그것을 간절히 구했음에도 회개할 기회[a]를 얻지 못했기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘회개의 자리를 찾지 못했다’입니다. 이는 결과를 되돌릴 기회를 얻지 못했다는 뜻으로 이해될 수 있으며, 이삭이 뜻을 바꾸지 않았다는 뜻으로 이해되기도 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘그것’은 ‘축복’을 가리킬 수도 있고, 덜 가능하지만 ‘회개’ 또는 ‘기회’를 가리킬 수도 있습니다. 그리스어는 지시 대상을 명확히 밝히지 않습니다.
    reason: lexical_alternative
