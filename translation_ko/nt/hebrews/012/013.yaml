  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
  footnotes:
  - marker: a
    text: Or 'may not be put out of joint' or 'may not be dislocated'; the Greek verb can carry a more medical nuance within the bodily metaphor.
    reason: lexical_alternative
  - marker: b
    text: The wording echoes Proverbs 4:26 and continues the passage's imagery of disciplined walking.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 여러분의 발을 위해 곧은 길을 내십시오.[a] 그리하여 절뚝거리는 것이 어긋나지 않고,[b] 오히려 낫게 되도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 잠언 4:26을 반향합니다. 여기서 ‘길’은 문자적인 길과 삶의 행로라는 은유를 함께 담고 있습니다.
    reason: cross_reference
  - marker: b
    text: ‘어긋나다’로 옮긴 그리스어는 ‘길에서 벗어나다’라는 뜻 외에, 신체 은유에서는 ‘탈구되다’ 또는 ‘접질리다’에 가까운 의학적 뉘앙스를 지닐 수도 있습니다.
    reason: lexical_alternative
