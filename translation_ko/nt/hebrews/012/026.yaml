  verdict: revise
  source_fidelity: The draft correctly identifies God as the possessor of the voice and the promiser, and it retains the earth/heaven contrast. However, the quotation's first-person future verb σείσω (“I will shake”) is mistranslated as the intransitive/declarative “흔들리라,” which does not express God as the agent who will shake both realms.
  naturalness: The proposed revision uses natural modern formal-polite Korean. “이렇게 약속하셨습니다” clearly introduces the quotation without the somewhat redundant “약속하시며 말씀하셨습니다.”
  terminology: “음성,” “땅,” “하늘,” and “흔들다” are appropriate and maintain the cosmic language of the Greek without interpretive expansion.
  issues:
  - severity: high
    issue: The quoted future verb is rendered “흔들리라.”
    rationale: 'σείσω is first-person singular future active: “I will shake.” “흔들리라” is not an appropriate rendering here and fails to state that the divine speaker will perform the shaking.'
  - severity: low
    issue: The Haggai quotation is not identified in the Korean draft.
    rationale: A cross-reference footnote at the quotation introduction preserves the audit-trail information and gives readers the source of the citation.
