- from: 우리도 그들과 마찬가지로 복음을 받았으나, 들은 말씀이 그들에게 유익을 주지 못한 것은, 그것이 들은 자들 안에서 믿음과 결합되지 못하였기 때문입니다.
  to: 우리에게도 그들에게처럼 좋은 소식이 선포되었습니다. 그러나 그들이 들은 말씀은 그들에게 유익하지 못했습니다. 이는 그들이 믿음으로 들은 이들과 결합되지 않았기 때문입니다.[a]
