review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the inferential 'therefore,' the continuing availability of the promise, the exhortation to fear, and the individualizing force of 'anyone among you.' However, '그 약속에 이르지 못한' makes the promise itself the goal that one fails to reach. In Greek, the promise concerns entering God's rest; the shortfall is from attaining that promised rest.
  naturalness: The sentence is generally fluent in modern formal Korean. Revising the final clause to name 'that rest' removes the unintended ambiguity and gives the warning a natural, clear Korean object.
  terminology: '''안식'' suitably renders κατάπαυσις, and ''두려워합시다'' preserves the force of the hortatory φοβηθῶμεν without softening it. ''그분의'' appropriately retains the Greek pronoun without adding interpretive specificity.'
  issues:
  - severity: medium
    issue: The phrase '그 약속에 이르지 못한' misidentifies the object of ὑστερηκέναι.
    rationale: The promise remains, but what a person may have fallen short of is entry into God's rest. The Korean wording can be read as failing to attain the promise itself, which changes the syntactic and conceptual relation in the source.
  revised_text: 그러므로 그분의 안식에 들어갈 약속이 아직 남아 있는 동안, 여러분 가운데 누군가가 그 안식에 이르지 못한 것으로 보이지 않도록 두려워합시다.
