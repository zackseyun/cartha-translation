review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the Greek litotes (οὐ ... μὴ δυνάμενον) and the contrast between Christ's sympathy and his sinlessness. However, “함께 느낄” is less precise and less idiomatic for συμπαθῆσαι than “동정하다,” and “우리와 같은 모양으로” is an unnatural calque of καθ’ ὁμοιότητα. In context, “우리와 같이” communicates the implied comparison naturally without changing the sense.
  naturalness: 'A formal-polite Korean rendering should use idiomatic theological Korean: “우리의 연약함을 동정하지 못하실” and “모든 면에서 우리와 같이.” The connective “으되” suitably maintains the formal contrast before “죄가 없으신.”'
  terminology: “대제사장,” “연약함,” “시험을 받으셨다,” and “죄가 없으신” are accurate, established, and appropriately formal. A note preserves “유혹을 받으셨다” as a valid alternative for πεπειρασμένον. A second note records the more literal force of καθ’ ὁμοιότητα without burdening the Korean main text with an unnatural expression.
  issues:
  - severity: medium
    issue: “함께 느낄 수 없는” for συμπαθῆσαι
    rationale: This phrase can suggest merely sharing a feeling and is not the most natural Korean expression for sympathetic participation in another's weakness. “동정하지 못하실” is both idiomatic and semantically closer in this context.
  - severity: medium
    issue: “우리와 같은 모양으로” for καθ’ ὁμοιότητα
    rationale: The wording is awkward in modern Korean and may evoke outward appearance (“모양”) rather than correspondence or likeness. “우리와 같이” is the natural contextual rendering; a footnote can retain the literal wording and signal the syntactic difficulty.
  revised_text: 우리에게는 우리의 연약함을 동정하지 못하실 대제사장이 계신 것이 아니라, 모든 면에서 우리와 같이 시험을 받으셨으되 죄가 없으신 분이 계십니다.[a][b]
