  source_fidelity: 초안의 ‘하늘들을 통과하신’은 복수형 τοὺς οὐρανούς와 διέληλυθότα의 의미를 대체로 보존합니다. 그러나 ‘예수를 우리가 모셨으니’는 ἔχοντες(‘우리가 가지고 있으므로/우리에게 계시므로’)를 한국어에서 ‘모시다’로 옮겨 의미를 부자연스럽게 바꾸며, 예수를 목적어로 ‘소유’하는 듯한 구문을 피하려는 의도와 달리 원문의 논리적 근거를 흐립니다.
  naturalness: ‘우리에게 … 계시므로’는 존대가 요구되는 예수에 대해 자연스러우면서도 ἔχοντες가 권면의 근거를 이루는 기능을 잘 드러냅니다. ‘하늘들을 지나가신’은 한국어에서 다소 문어적이지만 원문의 복수와 공간적 이미지를 보존하는 데 적절합니다. ‘고백하는 바’를 사용하면 한국어에서 ‘고백’을 무엇을 붙드는지 더 자연스럽게 표현할 수 있습니다.
  terminology: ‘위대한 대제사장’, ‘하나님의 아들’, ‘고백’은 각각 ἀρχιερέα μέγαν, τὸν υἱὸν τοῦ θεοῦ, τῆς ὁμολογίας를 충실히 반영합니다. ‘하늘들’은 의도적으로 복수형을 보존하며, 각주에서 한국어의 관용적 대안과 원문의 복수형을 설명합니다.
  issues:
  - severity: medium
    issue: ‘예수를 우리가 모셨으니’
    rationale: ἔχοντες는 공동체가 대제사장을 ‘가지고 있다’는 사실을 권면의 근거로 제시합니다. ‘모시다’는 한국어 존대 표현이지만 여기서는 원문의 관계와 논리적 기능을 정확히 전달하지 못하고 어색한 능동 목적어 구문을 만듭니다.
  - severity: low
    issue: ‘우리의 고백’
    rationale: 의미상 가능하지만, 헬라어는 소유 대명사를 쓰지 않고 정관사를 사용합니다. ‘우리가 고백하는 바’는 공동체적 고백이라는 뜻을 자연스럽게 드러내면서 불필요한 소유 표지를 피합니다.
  revised_text: 그러므로 우리에게 하늘들을 지나가신 위대한 대제사장, 곧 하나님의 아들이신 예수께서 계시므로, 우리가 고백하는 바를 굳게 붙듭시다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘하늘을 지나가신’. 헬라어 본문은 ‘하늘들’이라는 복수형을 사용합니다.
    reason: ‘하늘들’이라는 본문의 복수형을 보존하되, 한국어에서 가능한 단수형 관용 번역을 제시합니다.
  revision_rationale: 원문의 논증 구조(‘그러므로… 계시므로… 붙듭시다’)를 한국어 합쇼체로 명확히 하고, ἔχοντες를 ‘모시다’로 옮긴 데서 생기는 의미 및 문체 문제를 바로잡았습니다. 완결된 행위와 지속적 효력을 함축하는 완료 분사는 ‘지나가신’으로, 복수형 οὐρανούς는 ‘하늘들’로 유지했습니다. 그리스도론적 호칭과 권면의 지속적 성격도 보존했습니다.
