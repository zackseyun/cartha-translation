  source_fidelity: 첫 문장은 σπουδάσωμεν의 권면과 '그 안식에 들어가다'를 대체로 충실히 옮겼습니다. 그러나 둘째 문장의 '함입니다'는 ἵνα μὴ가 나타내는 목적을 자연스럽고 완전한 문장으로 전달하지 못합니다. '그와 같은 불순종의 본을 따라'는 ἐν τῷ αὐτῷ ὑποδείγματι τῆς ἀπειθείας의 경고적 선례/본보기를 적절히 보존합니다.
  naturalness: '''들어가기를 우리가 힘써 노력합시다''는 어순이 다소 무겁고 ''힘써 노력하다''는 의미가 겹칩니다. ''우리가 ... 들어가기를 힘씁시다''가 현대 표준어 합쇼체로 자연스럽습니다. 목적절은 ''아무도 ... 넘어지지 않도록''으로 완결해야 합니다.'
  terminology: κατάπαυσις는 문맥상 일관되게 '안식'으로, ἀπείθεια는 직접적 의미에 따라 '불순종'으로 유지했습니다. '불신'으로 본문을 바꾸지 않아 문맥적 해석을 본문에 과도하게 반영하지 않았습니다.
  issues:
