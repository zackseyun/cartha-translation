    issue: 둘째 문장이 불완전하고 목적 관계가 어색합니다.
    rationale: '''누구도 ... 쓰러지지 않도록 함입니다''는 자연스러운 합쇼체 문장이 아니며, 원문의 ἵνα μὴ 목적절이 앞선 권면에 연결되는 구조를 명료하게 전달하지 못합니다.'
  - severity: low
    issue: '''힘써 노력합시다''의 중복과 어순'
    rationale: σπουδάσωμεν은 '힘씁시다'로 충분하며, 주어를 앞에 두면 권면문이 더 자연스럽습니다.
