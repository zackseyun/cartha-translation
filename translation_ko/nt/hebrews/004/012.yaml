  source_fidelity: 수정안은 λόγος τοῦ θεοῦ를 넓은 의미의 ‘하나님의 말씀’으로 유지하고, ἐνεργής의 능동성을 ‘활동하며’로, διϊκνούμενος ἄχρι μερισμοῦ의 도달 범위를 ‘나뉘는 데까지 꿰뚫으며’로 옮깁니다. ‘혼과 영’의 표현을 보존하되 인간 구성에 관한 특정 교리를 본문에 부과하지 않습니다.
  naturalness: 초안의 ‘활력이 있으며’와 ‘쪼개기까지 찌르고’는 각각 다소 부자연스럽고, 원문의 ‘분할에 이르기까지 관통함’이라는 범위 표현을 충분히 드러내지 못합니다. 수정안은 현대 표준어 합쇼체에서 자연스러운 병렬 구조를 사용합니다.
