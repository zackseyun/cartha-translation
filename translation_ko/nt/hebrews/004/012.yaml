  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active, and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow, and able to judge the thoughts and intentions of the heart.
translation:
  language: ko
  text: 하나님의 말씀은 살아 있고 활동하며, 어떤 양날 칼보다도 더 날카롭고, 혼과 영[b], 관절과 골수가 나뉘는 데까지 꿰뚫으며[a], 마음의 생각과 의도를 판단합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깊이 파고들며’. 그리스어는 관통하여 깊숙이 이르는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘혼과 영’은 여기서 인간이 어떤 방식으로 구성되어 있는지에 관한 특정 교리를 요구하는 표현으로 단정할 수 없습니다. 문맥은 하나님의 말씀이 인간의 가장 깊은 내면까지 꿰뚫는다는 점을 강조합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘마음의 생각과 의도를 분별합니다’.
    reason: lexical_alternative
