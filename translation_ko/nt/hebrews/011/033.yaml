  source_fidelity: 그리스어의 연속된 부정과거 동사열을 충실히 반영합니다. ‘믿음으로’는 διὰ πίστεως의 수단적 의미를, ‘왕국들을 정복하였고’는 κατηγωνίσαντο βασιλείας를, ‘의를 행하였으며’는 εἰργάσαντο δικαιοσύνην을 적절히 옮깁니다. ‘약속들을 얻었고’는 ἐπέτυχον ἐπαγγελιῶν의 복수와 ‘얻다’의 비특정적 성취 의미를 보존하며, ‘사자들의 입을 막았으며’는 ἔφραξαν στόματα λεόντων을 정확히 반영합니다.
  naturalness: 현대 표준어의 격식 있는 성경 문체로 자연스럽습니다. 절 끝의 ‘막았으며,’는 다음 절과 이어지는 원문의 열거를 반영하는 적절한 미완결 연결형입니다.
  terminology: ‘믿음’, ‘의’, ‘약속’, ‘사자’는 문맥과 한국어 성경 문체에 맞는 안정적인 용어입니다. δικαιοσύνη의 가능한 ‘정의’ 뉘앙스가 있으나, 여기서는 ‘의’가 원문의 넓은 도덕적·언약적 의미를 과도하게 좁히지 않습니다.
