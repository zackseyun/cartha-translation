review_pass:
  verdict: revise
  source_fidelity: ‘이제’는 δέ의 온건한 전환 기능을 시간 부사로 한정하여 옮기므로 삭제하는 것이 적절합니다. ‘믿음’, ‘바라는 것들’, ‘보이지 않는 것들’, ‘증거’는 원문의 병행 구조와 의미를 잘 반영합니다. ὑπόστασις를 ‘실상’으로 옮기는 것은 가능한 해석이지만, 의미 범위가 논쟁적이므로 대안은 절제된 각주로 남겨야 합니다.
  naturalness: ‘믿음은 바라는 것들의 실상이며, 보이지 않는 것들의 증거입니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 장절 인용에서 널리 이해되는 문장입니다. 문두의 ‘이제’는 문맥 없이 시간적 의미를 강하게 만들어 자연스럽지 않습니다.
  terminology: ‘믿음’(πίστις), ‘실상’(ὑπόστασις), ‘증거’(ἔλεγχος)는 일관되고 알아보기 쉬운 용어입니다. 다만 각주의 ‘현재화되는’ 및 ‘의미가 우세하다’는 원문이 확정하지 않는 해석을 본문 의미로 제시하므로 제거해야 합니다. ‘본질’은 이 절의 직접적인 대안으로 제시하기보다 ‘실체’와 ‘확신’을 대안으로 제시하는 편이 정확합니다.
  issues:
  - severity: medium
    issue: 문두의 ‘이제’
    rationale: 그리스어 δέ는 여기서 주로 약한 담화 전환을 나타내며, 시간적 ‘이제’를 요구하지 않습니다. 영어 감사 이력도 같은 이유로 선행 ‘Now’를 삭제했습니다.
  - severity: medium
    issue: 각주의 해석적 단정
    rationale: ‘바라는 것들이 믿음 안에서 현재화되는’ तथा ‘실상’의 의미가 우세하다는 설명은 ὑπόστασις의 논쟁적 의미를 특정 신학적 해석으로 기웁니다. 각주는 어휘적 대안을 보존하되 우열을 단정하지 않아야 합니다.
  revised_text: 믿음은 바라는 것들의 실상[a]이며, 보이지 않는 것들의 증거입니다.
  revised_footnotes:
