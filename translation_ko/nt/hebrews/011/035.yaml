  to: 여인들은 부활로 자신들의 죽은 이들을 되돌려 받았습니다. 그러나 다른 이들은 더 나은 부활을 얻고자 석방을 받아들이지 않아 고문을 당했습니다.[a][b][c]
  rationale: 문장의 의미를 바꾸지 않고, 석방 제안을 거절했다는 원문의 관계를 자연스럽게 명시했습니다. 또한 ἐτυμπανίσθησαν의 형벌 방식에 관한 불확실성과 ‘더 나은 부활’의 문맥상 대비는 각주에서 제한적으로 설명했습니다.
