    rationale: τοὺς νεκροὺς αὐτῶν은 ‘자신들의 죽은 이들’을 가리킵니다. ‘죽은 자들’도 가능하나, 현대 한국어 문장에서는 ‘죽은 이들’이 더 자연스럽습니다.
