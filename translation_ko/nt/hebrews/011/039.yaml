  source_fidelity: μαρτυρηθέντες는 이 문맥에서 믿음으로 인해 호의적인 증언/인정을 받았다는 뜻이며, 초안의 ‘인정을 받았으나’는 이를 자연스럽게 전달합니다. 그러나 τὴν ἐπαγγελίαν은 단수 정관사 표현인 ‘그 약속’으로 남겨 두어야 하며, ‘약속하신 것’은 약속의 내용을 이미 풀어 쓴 표현입니다.
