base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
  footnotes:
  - marker: a
    text: Or 'the invisible One.' The Greek could also be rendered 'the unseen One.'
    reason: lexical_alternative
  - marker: b
    text: The verse may allude either to Moses' departure from Egypt after fleeing Pharaoh (Exod 2) or to the exodus departure with Israel (Exod 12–14); the Greek wording itself does not specify the episode.
    reason: cross_reference
translation:
  language: ko
  text: 믿음으로 그는 이집트를 떠났고, 왕의 진노를 두려워하지 않았습니다[b]. 이는 그가 보이지 않으시는 분[a]을 보는 것 같이 굳게 견뎠기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보이지 않는 분’. 그리스어는 ‘보이지 않는 분’ 또는 ‘보이지 않으시는 분’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 모세가 바로를 피해 이집트를 떠난 사건(출 2장)을 가리킬 수도 있고, 이스라엘 백성과 함께 출애굽한 사건(출 12–14장)을 가리킬 수도 있습니다. 그리스어 본문은 어느 사건인지를 특정하지 않습니다.
    reason: cross_reference
