  source_fidelity: 원문의 핵심 구조와 의미는 대체로 반영되어 있습니다. 다만 ἀσπασάμενοι는 약속을 멀리서 보고 긍정적으로 맞이한 비유적 행위인데, 한국어에서 ‘약속들을 환영하다’는 다소 부자연스럽습니다. 또한 ξένοι는 단순한 국적상의 ‘외국인’보다 이 땅에 속하지 않은 낯선 이라는 사회적·실존적 뜻을 포함합니다.
  naturalness: ‘믿음 안에서 죽었고’도 이해되지만, 이 문맥에서는 ‘믿음 가운데서 죽었습니다’가 현대 한국어 합쇼체에서 더 자연스럽고, 죽을 때까지 지닌 믿음의 상태를 잘 나타냅니다. ‘약속들을 … 환영하였으며’는 어색하므로 ‘약속들을 멀리서 보고 반기며’로 다듬는 것이 자연스럽습니다.
  terminology: πίστις는 ‘믿음’으로 유지했습니다. ἐπαγγελίας의 복수는 ‘약속들을’로 보존했습니다. ξένοι와 παρεπίδημοι의 병렬은 ‘낯선 이들이며 나그네들’로 옮겨, ‘외국인’의 지나치게 국적 중심적인 뉘앙스를 피하고 임시 체류·비소속의 의미를 유지했습니다.
