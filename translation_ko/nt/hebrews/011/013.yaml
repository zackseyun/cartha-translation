  to: 이들 모두는 믿음 가운데서 죽었습니다. 그들은 약속들을 받지 못한 채, 그것들을 멀리서 보고 반기며, 자신들이 땅 위에서는 낯선 이들이며 나그네들이라고 고백하였습니다.
  rationale: 원문의 aorist participle 연쇄를 ‘받지 못한 채, 보고 반기며, … 고백하였습니다’로 자연스럽게 연결했습니다. ‘반기며’는 ἀσπασάμενοι의 비유적 환영·맞이함을 살리되, 아직 약속을 ‘받지’ 못했다는 앞선 대조를 흐리지 않습니다. ‘낯선 이들’과 ‘나그네들’은 ξένοι와 παρεπίδημοι의 병렬 및 이 땅에서의 비정착성을 보존합니다.
