  verdict: revise
  source_fidelity: 핵심 구조는 원문을 잘 반영합니다. 다만 ἡ πόρνη는 현대 한국어에서 ‘기생’이 주로 전통 예능인을 가리킬 수 있으므로, 성매매 여성을 뜻하는 원문의 직접적 의미가 흐려질 수 있습니다. 또한 μετ’ εἰρήνης의 방식 표현은 ‘평화로 영접하다’보다 ‘평안히 맞아들이다’가 자연스럽고 충실합니다.
  naturalness: ‘평화로 영접하였기 때문에’는 현대 표준어에서 다소 직역투입니다. ‘평안히 맞아들였기 때문에’가 자연스럽습니다. ‘아니하였습니다’도 문법상 가능하나, 현대 합쇼체에서는 ‘않았습니다’가 더 자연스럽습니다.
  terminology: 라합과 정탐꾼은 적절합니다. πόρνη는 현대적이고 의미가 분명한 ‘매춘부’로 옮깁니다. 이는 비난을 덧붙이지 않고 원문의 사회적 지칭을 보존합니다. πίστις는 ‘믿음으로’, ἀπειθήσασιν은 ‘불순종한 사람들’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘기생’의 현대적 의미 범위
    rationale: 현대 한국어의 ‘기생’은 전통적 예능인이라는 의미가 강하여 πόρνη(매춘부)의 뜻을 정확히 전달하지 못할 수 있습니다.
  - severity: low
    issue: ‘평화로 영접하다’의 비자연스러운 결합
    rationale: μετ’ εἰρήνης는 영접의 태도·방식을 나타내므로 ‘평안히 맞아들이다’가 자연스럽고 의미도 보존합니다.
  revised_text: 믿음으로 매춘부 라합은 정탐꾼들을 평안히 맞아들였기 때문에, 불순종한 사람들과 함께 멸망하지 않았습니다.
