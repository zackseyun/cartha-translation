  source_fidelity: 개정이 필요합니다. 특히 ἐν φόνῳ μαχαίρης를 직역한 ‘칼의 살해로 죽었고’는 한국어에서 부자연스럽고 의미 관계도 불명확합니다. ‘칼에 살해되었고’는 칼에 의한 폭력적 죽음이라는 표현의 강도를 자연스럽게 전달합니다. 나머지 항목들은 돌로 맞음, 톱으로 켜짐, 가죽옷을 입고 돌아다님, 궁핍·환난·학대의 연속이라는 원문의 구조와 의미를 충실히 반영합니다.
  naturalness: ‘톱으로 켜였으며’는 문법적으로 가능하나 현대 표준어에서는 피동형 ‘톱으로 켜졌으며’가 더 자연스럽습니다. 또한 원문은 한 문장 안에서 계속되는 열거이므로, ‘떠돌아다녔습니다. 궁핍하고’처럼 문장을 끊기보다 접속하여 마무리하는 편이 자연스럽고 원문의 참여적 흐름을 보존합니다.
  terminology: ‘양가죽’, ‘염소 가죽’, ‘궁핍’, ‘환난’, ‘학대’는 문맥과 한국어 성경 문체에 적합합니다. ‘환난을 당하고’는 θλιβόμενοι의 고난·압박의 뜻을 무리 없이 전달하며, ‘학대를 받았습니다’는 κακουχούμενοι에 알맞습니다.
