review_pass:
  verdict: revise
  source_fidelity: 초안은 구절의 기본 구조와 의미를 대체로 충실히 옮겼습니다. 다만 「믿음을 따라 오는 의」는 κατὰ πίστιν을 부정확하게 확장하므로 「믿음에 따른 의」로 고쳐야 합니다. δι’ ἧς의 여성 관계대명사는 가장 가까운 선행사인 κιβωτός(방주)를 가리키는 것이 자연스럽기에 본문에서 이를 명시했습니다.
  naturalness: 「신적 경고」와 「경외하는 두려움」은 현대 표준 한국어 성서 문체로 다소 부자연스럽습니다. 각각 「경고를 받고」와 「경외함으로」로 다듬고, οἶκος는 건물인 「집」보다 구성원을 가리키는 「집안」으로 옮겼습니다.
  terminology: Νῶε는 통용 표기인 「노아」를 유지했습니다. κιβωτός는 「방주」, σωτηρία는 문맥상 「구원」, δικαιοσύνη는 교리적으로 과도하게 해석하지 않고 「의」로 유지했습니다. χρηματισθείς는 신적 전달을 함축할 수 있으나 하나님의 이름이 본문에 명시되어 있지 않으므로 본문에는 「경고를 받고」로 절제하여 옮겼습니다.
  issues:
  - severity: medium
    issue: 「믿음을 따라 오는 의」
    rationale: κατὰ πίστιν은 ‘믿음에 따른/믿음에 의한’이라는 수식 관계이며, 「오는」은 원문에 없는 발생·기원 의미를 덧붙입니다.
  - severity: medium
    issue: 「경외하는 두려움으로」
    rationale: εὐλαβηθεὶς의 경건하고 두려워하는 반응을 나타내려는 의도는 적절하지만, 해당 표현은 현대 한국어에서 어색합니다. 「경외함으로」가 자연스럽고 의미도 보존합니다.
  - severity: low
    issue: 「자기 집의 구원」
    rationale: οἶκος는 여기서 집 건물보다는 노아의 가속·가족 공동체를 뜻하므로 「자기 집안의 구원」이 더 정확합니다.
  - severity: low
    issue: 「그것을 통하여」의 지시 대상
    rationale: 문법상 방주를 가리키는 것이 가장 자연스러우므로 「그 방주를 통하여」라고 밝혀 한국어의 모호성을 줄였습니다.
  revised_text: 믿음으로 노아는 아직 보이지 않는 것들에 관하여 경고를 받고, 경외함으로 자기 집안의 구원을 위하여 방주를 지었습니다. 그 방주를 통하여 그는 세상을 정죄하였고, 믿음에 따른 의의 상속자가 되었습니다.
  revised_footnotes:
  - marker: a
    text: 「경고를 받고」는 ‘신적 지시를 받다’ 또는 ‘신적 경고를 받다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 「경외함으로」는 ‘경건한 두려움에 움직여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 「그 방주를 통하여」는 문법상 방주를 가리키는 것이 가장 자연스럽습니다. 일부는 이를 노아의 믿음이나 순종 전체를 가리키는 것으로 이해합니다.
    reason: alternative_reading
  - marker: d
    text: 「의」는 ‘정의’로도 옮길 수 있으나, 여기서는 믿음과 관련된 의를 가리키므로 「의」로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 분사 구조와 인과 관계를 유지하면서, 현대 합쇼체에 맞지 않거나 원문 이상의 의미를 더하는 표현을 바로잡았습니다. 「하나님께서」는 χρηματισθείς에 함축될 수 있지만 명시되어 있지 않으므로 본문에 보태지 않았습니다. 관계대명사의 가장 자연스러운 선행사인 방주는 본문에서 명시하되, 다른 해석 가능성은 각주에 보존했습니다.
