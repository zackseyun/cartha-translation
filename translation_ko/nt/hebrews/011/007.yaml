review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the faith-frame, Noah's warning concerning as-yet-unseen things, construction of the ark, household deliverance, condemnation of the world, and inheritance of righteousness according to faith. However, "신적 경고" is an unnecessarily technical nominalization for χρηματισθείς, and "믿음을 따라 오는 의" adds the idea of righteousness 'coming' through faith rather than rendering κατὰ πίστιν directly.
  naturalness: '"경외하는 두려움으로" is understandable but awkward in contemporary formal Korean. "경외하는 마음으로" naturally conveys the reverent response denoted by εὐλαβηθεὶς. "집안" is clearer than "집" for οἶκος in this context.'
  terminology: Use established "방주," "정죄하다," and "의." "믿음에 따른 의" follows the Greek phrase without making a denominationally specific claim about its mechanism. The divine source of the warning is implicit in χρηματισθείς and should not be made explicit in the main text.
  issues:
  - severity: medium
    issue: The phrase "믿음을 따라 오는 의" is interpretively expanded.
    rationale: κατὰ πίστιν modifies δικαιοσύνης ('righteousness according to faith'); the source does not say that righteousness 'comes' through faith. "믿음에 따른 의" is closer and idiomatic.
  - severity: low
    issue: '"신적 경고" and "경외하는 두려움으로" are stiff Korean.'
    rationale: The former over-specifies the implied divine agency in a technical expression, and the latter is not natural modern Korean. A plain passive '경고를 받고' and '경외하는 마음으로' preserve the sense more naturally.
  - severity: low
    issue: The debated antecedent of δι’ ἧς is not documented.
    rationale: The Korean pronoun naturally points to the ark, as does the nearest Greek antecedent, but a footnote should acknowledge the broader alternative reading.
  revised_text: 믿음으로 노아는 아직 보이지 않는 일들에 관하여 경고를 받고[a], 경외하는 마음으로 자기 집안의 구원을 위하여 방주를 지었습니다. 그것을 통하여[b] 그는 세상을 정죄하였고, 믿음에 따른 의의 상속자가 되었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “신적 지시를 받고” 또는 “하나님의 경고를 받고.”
    reason: lexical_alternative
  - marker: b
    text: “그것을 통하여”는 가장 자연스럽게 방주를 가리킵니다. 일부는 이를 노아의 믿음이나 순종의 행위로 더 넓게 이해합니다.
    reason: alternative_reading
  revision_rationale: The revision removes an overly technical expression, improves modern Korean fluency, renders the household sense of οἶκος, and corrects the added nuance in the final righteousness phrase. It leaves God's agency implicit in the main text while documenting it as a lexical alternative, and it supplies a properly anchored note for the disputed reference of δι’ ἧς.
