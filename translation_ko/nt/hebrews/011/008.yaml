review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys faith, Abraham's calling, obedience, inheritance, and his ignorance of the destination. However, its use of 나아갔으며/나아갔습니다 ('went forward/approached') does not adequately represent ἐξελθεῖν and ἐξῆλθεν, both of which emphasize departure or going out. The future force of ἤμελλεν λαμβάνειν is also clearer with 장차 ('was going to/eventually').
  naturalness: The revised wording is natural in modern formal-polite Korean while retaining the Greek's deliberate repetition of the departure verb.
  terminology: 믿음, 아브라함, and 기업 are appropriate established biblical terms. No theological terminology requires adjustment.
  issues:
  - severity: medium
    issue: 나아갔으며/나아갔습니다 is used for both ἐξελθεῖν and ἐξῆλθεν.
    rationale: 나아가다 normally denotes proceeding forward or approaching, whereas the Greek verbs specifically denote going out/departing. 떠나다 more faithfully conveys the intended movement and preserves the verbal repetition.
  - severity: low
    issue: The prospective sense of ἤμελλεν λαμβάνειν is underrepresented.
    rationale: 장차 기업으로 받을 makes explicit that the place was one Abraham was going to receive as an inheritance, without adding a deterministic implication.
  revised_text: 믿음으로 아브라함은 부르심을 받았을 때 순종하여, 장차 기업으로 받을 곳으로 떠났으며, 어디로 가는지도 알지 못한 채 떠났습니다.
