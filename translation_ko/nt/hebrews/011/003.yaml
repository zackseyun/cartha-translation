  source_fidelity: 초안의 ‘세계들이’는 αἰῶνας의 시간적·우주적 폭을 ‘복수의 세계’로 좁히며, ‘지어졌음’은 가능하나 κατηρτίσθαι의 ‘마련되다/갖추어지다/질서 있게 이루어지다’의 뉘앙스를 다소 단순화합니다. 또한 δεύτε 문장의 ‘나타나는 것들’은 ἐκ φαινομένων의 ‘보이는 것들’을 자연스럽게 옮기지 못합니다.
