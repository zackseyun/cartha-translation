  to: 믿음이 없이는 하나님을 기쁘시게 하는 것이 불가능합니다. 하나님께 나아가는 사람은 하나님께서 계시다는 것과 그분을 부지런히 찾는 사람들에게 상 주시는 분이심을 믿어야 합니다.
