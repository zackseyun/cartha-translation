  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
  footnotes:
  - marker: a
    text: Or, more literally, 'from one, and these things from one having been deadened.' The sense is that Abraham was beyond normal childbearing age.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 한 사람에게서, 그것도 죽은 자와 같은 상태에 있던 사람에게서, 후손들이 태어났습니다. 그 수는 하늘의 별처럼 많고 바닷가의 셀 수 없는 모래와 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘한 사람에게서, 그것도 죽은 자와 같이 된 사람에게서’입니다. 여기서 ‘죽은 자와 같은’은 아브라함이 실제로 죽었다는 뜻이 아니라, 고령으로 말미암아 자녀를 낳을 능력이 없었던 상태를 비유적으로 가리킵니다.
    reason: νενεκρωμένου의 문자적 표현과 문맥상 비유적 의미를 함께 밝혀, 실제 죽음으로 오해하지 않도록 합니다.
