source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
  footnotes:
  - marker: a
    text: Or 'a greater sacrifice.' The comparative may emphasize either quality ('better') or magnitude ('greater').
    reason: lexical_alternative
  - marker: b
    text: Or 'he was commended to be righteous' or 'he was attested as righteous.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'through it' may refer to Abel's faith or to his sacrifice; the Greek is not fully explicit.
    reason: alternative_reading
  - marker: d
    text: Or 'he was testified to be righteous'.
    reason: previous_rendering
translation:
  language: ko
  text: 믿음으로 아벨은 가인보다 더 나은 제물을 하나님께 드렸습니다.[a] 그 제물을 통하여 그는 의롭다고 증언을 받았습니다.[b] 하나님께서 그의 예물에 관하여 증언하셨습니다. 그는 죽었지만, 그것을 통하여 아직도 말합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 큰 제물’. 비교 표현은 질적으로 ‘더 나은’이라는 뜻일 수도 있고, 양적으로 ‘더 큰’이라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의롭다고 인정받았습니다’ 또는 ‘의로운 사람으로 확증받았습니다’.
    reason: lexical_alternative
  - marker: c
    text: ‘그것을 통하여’가 가리키는 것은 아벨의 믿음일 수도 있고 제물일 수도 있습니다. 그리스어는 이를 분명히 밝히지 않습니다.
    reason: alternative_reading
