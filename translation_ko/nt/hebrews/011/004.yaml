  to: 믿음으로 아벨은 가인보다 더 나은 제물을 하나님께 드렸습니다.[a] 그 제물을 통하여 그는 의롭다고 증언을 받았습니다.[b] 하나님께서 그의 예물에 관하여 증언하셨습니다. 그는 죽었지만, 그것을 통하여 아직도 말합니다.[c]
  rationale: 'The revision preserves the source''s comparison, sacrificial vocabulary, twofold testimony language, and the ambiguity of the final feminine pronoun. It also moves the concessive statement of Abel''s death before the final instrumental phrase so that the Korean unambiguously expresses: although he died, through it he still speaks.'
