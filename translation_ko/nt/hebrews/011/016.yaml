translation:
  language: ko
  text: 그러나 사실 그들은 더 나은 나라[a], 곧 하늘에 속한 나라를 갈망합니다. 그러므로 하나님께서는 그들의 하나님으로 불리시는 것을 부끄러워하지 않으십니다. 하나님께서 그들을 위하여 한 도성을 마련해 두셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
