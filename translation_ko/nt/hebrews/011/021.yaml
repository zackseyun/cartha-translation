  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
  footnotes:
  - marker: a
    text: Or, following the Hebrew text of Genesis 47:31, 'and bowed in worship over the head of his bed.' The Greek text here reads 'staff.'
    reason: textual_variant
  - marker: b
    text: Or 'worshiped toward the top of his staff.' The phrase likely describes Jacob's posture, not the object of his worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 믿음으로 야곱은 죽어 가면서 요셉의 아들들을 하나하나 축복하였고, 자기 지팡이 끝에 기대어 경배하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 47:31의 히브리어 본문을 따르면, “그의 침상 머리맡에서 경배하였다”로도 옮길 수 있습니다. 그러나 여기 히브리서의 그리스어 본문은 “지팡이”라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 “자기 지팡이 끝을 향하여 경배하였다.” 이 표현은 경배의 대상이라기보다 야곱의 자세를 묘사하는 것일 수 있습니다.
    reason: lexical_alternative
