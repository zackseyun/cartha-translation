base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
  footnotes:
  - marker: a
    text: Or 'the application of the blood.' The Greek term refers to the ritual placing of blood; 'sprinkling' is a traditional cultic rendering, while 'application' may reflect the Passover setting more specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 믿음으로 그는 유월절을 지키고 피를 바르는 일을 행하였습니다[a]. 이는 멸하는 자가 그들의 장자들을 건드리지 못하게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피를 뿌리는 일’. 그리스어는 피를 의례적으로 붓거나 바르는 행위를 가리킵니다. ‘피를 뿌리는 일’은 전통적인 번역이며, 유월절의 문맥에서는 ‘피를 바르는 일’이 더 구체적일 수 있습니다.
    reason: πρόσχυσις의 가능한 어휘적 번역들을 보존하고, 출애굽기 12장의 문맥에 맞는 본문 선택을 설명하기 위함입니다.
