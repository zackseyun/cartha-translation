review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. αὐτῶν은 τὰ πρωτότοκα와 연결되어 ‘그들의 장자들’을 뜻하는데, 초안의 ‘그들을’은 장자들 자체가 아니라 이스라엘 사람들을 가리키는 것처럼 보입니다. 또한 πρόσχυσις는 유월절 맥락에서 피를 문설주 등에 바르는 행위를 가리키므로 ‘피를 바르는 일’이 더 직접적입니다.
  naturalness: 초안의 ‘지켰으니, 이는 … 하려 함이었습니다’는 현대 표준어 합쇼체에서 다소 문어적이고 호응이 무겁습니다. ‘지키고 … 행하였습니다. 이는 … 것이었습니다’가 자연스럽고 명료합니다.
  terminology: ‘유월절’은 정착된 절기명으로 적절합니다. ὁ ὀλοθρεύων은 특정 존재의 정체를 덧붙이지 않고 ‘멸하는 자’로 옮겼습니다. θίγῃ의 직역적 표현인 ‘건드리지’도 유지했습니다.
  issues:
