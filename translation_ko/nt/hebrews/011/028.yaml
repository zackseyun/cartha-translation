    issue: αὐτῶν의 지시 대상이 불명확하고 달라짐
    rationale: 그리스어는 ‘그들의 장자들’을 말합니다. ‘그들을’은 장자들을 수식하는 소유 관계를 빠뜨리고, 멸하는 자가 이스라엘 백성 전체를 건드리지 않는다는 뜻으로 읽힐 수 있습니다.
  - severity: medium
    issue: πρόσχυσις의 번역이 다소 의례화됨
    rationale: ‘피 뿌리는 의식’은 가능한 전통적 표현이지만, 이 문맥에서는 피를 문설주에 바르는 적용 행위를 더 구체적으로 가리킵니다. 본문은 ‘피를 바르는 일’로 하고 전통적 대안을 각주에 보존하는 것이 적절합니다.
  - severity: low
    issue: 문장 호응과 현대적 자연스러움
    rationale: ‘지켰으니 … 하려 함이었습니다’보다 평서형으로 문장을 나누면 현대 합쇼체에서 더 자연스럽습니다.
