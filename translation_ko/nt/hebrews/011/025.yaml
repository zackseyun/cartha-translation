  terminology: '''하나님의 백성'' is standard and appropriate for τῷ λαῷ τοῦ θεοῦ. ''죄의 일시적인 즐거움'' appropriately renders πρόσκαιρον ἁμαρτίας ἀπόλαυσιν. No doctrinal narrowing has been introduced.'
