  source_fidelity: 그리스어 미완료 중간태 ἐξεδέχετο의 지속적 과거 의미가 초안의 ‘기다렸기’에는 충분히 드러나지 않습니다. 또한 τοὺς θεμελίους의 복수는 ‘기초들이’로 보존하는 것이 안전합니다. τεχνίτης와 δημιουργός를 각각 ‘설계자’와 ‘건축자’로 옮겨 구별했습니다.
