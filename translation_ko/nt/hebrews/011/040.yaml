  source_fidelity: 초안은 하나님께서 우리를 위해 더 좋은 것을 미리 예비하셨다는 genitive absolute와, 그들이 우리와 분리되어 τελειόω의 상태에 이르지 못한다는 목적절을 대체로 충실히 옮깁니다. 다만 ‘온전케’는 현대 표준어 문체에 맞지 않으며, ‘못하게 하려 하심입니다’는 ἵνα 목적절을 한국어에서 부자연스럽게 중첩해 표현합니다.
  naturalness: ‘더 좋은 어떤 것’은 문법상 가능하나 현대 한국어에서는 ‘더 나은 것을’이 더 자연스럽습니다. ‘미리 마련하셔서 … 되지 않도록 하셨기 때문입니다’는 원문의 선행 행위와 목적 관계를 자연한 합쇼체로 재현합니다.
  terminology: κρεῖττόν은 히브리서의 반복되는 비교 주제를 살려 ‘더 나은’으로, τελειωθῶσιν은 도덕적 무결성으로만 한정하지 않는 ‘온전하게 되다’로 옮깁니다. ‘우리 없이’는 χωρὶς ἡμῶν의 공동체적·구원사적 분리의 뜻을 유지합니다.
  issues:
  - severity: medium
    issue: ‘온전케’ 및 ‘못하게 하려 하심입니다’의 문체와 구문
    rationale: ‘온전케’는 현대 표준어 합쇼체에서 고풍스럽고, ‘못하게 하려 하심’은 목적절을 부자연스럽게 명사화합니다. 현대적이고 직접적인 목적 표현으로 고칠 필요가 있습니다.
  - severity: low
    issue: ‘더 좋은 어떤 것’의 어순
    rationale: τι의 불특정성을 기계적으로 드러낸 표현으로 한국어에서는 다소 어색합니다. ‘더 나은 것을’이 의미를 손상하지 않으면서 자연스럽습니다.
  revised_text: 이는 하나님께서 우리를 위하여 더 나은 것을 미리 마련하셔서, 그들이 우리 없이 온전하게 되지 않도록 하셨기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리와 관련하여 더 나은 것을 미리 내다보셨기 때문에.’ ‘미리 마련하셨다’로 옮긴 그리스어는 문맥상 하나님의 앞선 마련 또는 계획을 가리키지만, ‘미리 내다보다’라는 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 없이 완성되지 않도록’ 또는 ‘우리와 따로 완전하게 되지 않도록.’
    reason: alternative_reading
  revision_rationale: 현대 합쇼체에 맞추어 고풍스러운 ‘온전케’와 부자연스러운 목적절 명사화를 고쳤습니다. 동시에 ‘더 나은 것’, ‘우리 없이’, ‘온전하게 되다’로 원문의 비교, 공동체성, 그리고 τελειόω의 넓은 완성/온전함의 의미를 보존했습니다. 각주에서는 προβλεψαμένου의 ‘미리 내다봄’ 가능성과 τελειωθῶσιν의 대안적 표현을 제시하여 해석적 긴장을 유지했습니다.
