  verdict: revise
  source_fidelity: 그리스어 ἐπιλαμβάνεται는 문맥상 ‘돕다/도우러 붙들다’라는 관용적 의미로 이해하는 것이 가장 자연스럽습니다. 초안의 ‘붙드시는’은 가능한 문자적 어의를 반영하지만, 한국어 본문에서는 도움의 의미가 충분히 전달되지 않습니다. 또한 각주가 도움과 ‘동참’을 함께 시사한다고 한 것은 본문 어휘 자체가 확정적으로 말하는 범위를 넘어섭니다.
  naturalness: ‘분명히 그분은 … 것이 아니라 … 것이기 때문입니다’는 한국어에서 다소 겹치고 무겁습니다. ‘이는 분명히 그분께서 … 것이 아니라 … 것이기 때문입니다’가 γάρ의 논증적 연결과 대조를 자연스럽게 살립니다.
  terminology: ‘아브라함의 자손’은 σπέρματος Ἀβραὰμ의 단수 집합적 표현을 보존하면서 표준 한국어 성경 문체에서도 자연스럽습니다. 각주는 ‘붙잡다’라는 문자적 가능성과 문맥상의 ‘돕다’를 구별하여, 성육신적 함의를 본문에 부가하지 않도록 수정합니다.
  issues:
  - severity: medium
    issue: 본문의 ‘붙드시는’이 문맥상 도움의 의미를 충분히 드러내지 못함
    rationale: ἐπιλαμβάνεται는 문자적으로 ‘붙잡다’일 수 있으나, 이 문맥에서는 ‘돕다, 도우러 붙들다’라는 의미가 널리 인정됩니다. 본문은 자연스러운 문맥상 의미를 채택하고 문자적 표현은 각주에 남기는 것이 적절합니다.
  - severity: medium
    issue: 각주의 ‘도움의 행위와 동참의 행위를 함께 시사한다’는 설명
    rationale: 이 표현은 어휘의 가능한 문자적 의미를 넘어 특정 신학적 함의를 함께 확정하는 듯합니다. 논쟁적 또는 해석적 함의는 보존하되, 어휘적 대안을 중립적으로 제시해야 합니다.
  - severity: low
    issue: 문장 연결과 강조의 어순
    rationale: γὰρ와 δήπου의 논증적·명백성의 뉘앙스를 ‘이는 분명히’로 옮기면 현대 한국어 합쇼체에서 더 매끄럽습니다.
  revised_text: 이는 분명히 그분께서 천사들을 도우시는 것이 아니라 아브라함의 자손을 도우시는 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 ἐπιλαμβάνεται는 문자적으로 ‘붙잡다’ 또는 ‘손에 잡다’라는 뜻도 될 수 있다. 여기서는 ‘돕다’ 또는 ‘도우러 붙들다’라는 의미로 이해될 수 있다.
    reason: lexical_alternative
  revision_rationale: 본문에는 문맥상 가장 자연스러운 ‘도우시는’을 사용하여 그리스어 동사의 관용적 의미를 반영했습니다. 문자적 ‘붙잡다’의 가능성은 각주에 보존하되, 본문이 명시하지 않는 ‘동참’의 의미를 덧붙이지 않았습니다. ‘이는 분명히’는 γάρ와 δήπου의 연결 및 명백성의 뉘앙스를 자연스럽게 반영하며, ‘아브라함의 자손’은 집합적 단수 표현을 유지합니다.
