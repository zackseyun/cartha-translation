review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the sanctifying agent, the sanctified group, the causal connection, and the Son's not being ashamed to call them brothers. However, 「한 분에게서」 identifies ἑνός as a personal referent and the note further privileges God, whereas the Greek leaves the referent unspecified. The wording should preserve that ambiguity. The present passive participle οἱ ἁγιαζόμενοι is also better represented as an ongoing process.
  naturalness: 「거룩하게 되어 가는 이들」 is natural modern Korean and expresses the ongoing passive sense. 「한 근원에서 비롯되었으니」 is idiomatic in formal Korean, while a footnote can explicitly preserve the literal Greek ambiguity. The sentence maintains modern formal-polite 합쇼체.
  terminology: 「거룩하게 하시다」 and 「거룩하게 되어 가다」 retain the established sanctification terminology without forcing a doctrinal interpretation. 「형제」 accurately represents the masculine plural ἀδελφούς; a note should explain its likely inclusive contextual reference without replacing the source term in the text.
  issues:
  - severity: high
    issue: 「한 분에게서」 and its footnote narrow ἐξ ἑνός to a person, especially God.
    rationale: The Greek says only “from one” and does not state whether this is God, a common ancestor, or another shared origin. The main text and note must not resolve or privilege that disputed referent.
  - severity: medium
    issue: 「거룩하게 되는 자들」 does not clearly convey the present passive participle’s ongoing aspect.
    rationale: 「거룩하게 되어 가는 이들」 more naturally represents those who are being sanctified while preserving the passive sense.
  - severity: low
    issue: The draft lacks a note for 「형제」.
    rationale: The English audit trail notes that the masculine plural is retained but may contextually include women among the sanctified community. A concise Korean note preserves both lexical form and contextual scope.
