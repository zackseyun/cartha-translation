  text: You subjected all things under his feet.” For in subjecting all things to him, he left nothing not subjected to him. But now we do not yet see all things subjected to him.
translation:
  language: ko
  text: “만물을 그의 발 아래 복종하게 하셨습니다.”[a] 만물을 그에게 복종하게 하심에 있어서, 그에게 복종하지 않는 것은 아무것도 남겨 두지 않으셨습니다.[b] 그러나 지금 우리는 아직 만물이 그에게 복종하고 있는 것을 보지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의’와 뒤의 ‘그에게’는 시편 8편의 표현을 따른 것입니다. 시편의 본래 문맥에서는 인간을 가리킬 수 있으며, 히브리서의 적용에서는 예수를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그가 만물을 그에게 복종하게 하셨을 때’. 그리스어 표현은 시간의 의미로도 옮길 수 있습니다.
    reason: lexical_alternative
