  verdict: revise
  source_fidelity: 초안은 만물의 보편적 복종, 현재 아직 보이지 않는다는 대조를 대체로 전달합니다. 그러나 인용문의 2인칭 주어(ὑπέταξας)를 ‘하나님께서’로 명시하여 인용의 형식을 약화하고, ‘복종케/복종치’는 현대 표준 한국어 문체에 맞지 않습니다. 또한 αὐτοῦ/αὐτῷ의 지시 대상에 관한 본문의 의도적 긴장을 각주로 보존하는 것이 좋습니다.
  naturalness: ‘복종하게 하셨습니다/복종하지 않는’으로 고치면 현대적이고 자연스러운 합쇼체가 됩니다. ‘만물을 그에게 복종하게 하심에 있어서’는 원문의 ἐν τῷ ... ὑποτάξαι의 설명적 연결을 비교적 가깝게 유지합니다.
  terminology: ὑποτάσσω 어군은 ‘복종하게 하다/복종하다’로 일관되게 옮겼습니다. 본문에는 지시 대상을 특정하지 않고 ‘그’로 유지하여 시편 8편의 인간과 히브리서의 예수 적용 사이의 긴장을 해소하지 않았습니다.
