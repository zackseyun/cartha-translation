    rationale: 제시된 원문은 χωρὶς θεοῦ이나, 초안은 χάριτι θεοῦ를 본문에 두고 χωρὶς θεοῦ를 각주로 보냈습니다. 영어 감사 기록의 선택과 관계없이 이 검토에서는 원어 출전을 우선해야 합니다.
  - severity: medium
