  to: 그러나 우리는 예수께서 천사들보다 잠시 동안 낮아지셨으나 죽음의 고난 때문에 영광과 존귀로 관을 쓰신 것을 봅니다. 이는 그분께서 하나님 없이[a] 모든 사람을 위하여 죽음을 맛보시기 위함이었습니다.
