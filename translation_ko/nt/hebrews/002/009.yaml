    rationale: 각주는 독자가 이문을 확인하도록 간결하게 제시해야 합니다. 특히 이 구절의 독법은 중요한 논쟁점이므로 어느 독법의 증거가 압도적이라고 단정하여 해석을 유도하지 않는 편이 좋습니다.
  - severity: low
    issue: βραχύ τι의 시간적 의미가 ‘잠시’로는 다소 압축되어 있습니다.
    rationale: ‘잠시 동안’은 원문의 시간적 한정을 더 분명히 보여 줍니다.
