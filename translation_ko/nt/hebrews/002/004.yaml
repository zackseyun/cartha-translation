  source_fidelity: 핵심 어휘와 열거는 대체로 충실합니다. 다만 ‘성령의 나누어 주심’은 한국어에서 다소 불완전하고, 그 분배의 의미가 불명확합니다. μερισμοῖς는 본문에서 ‘나누어 주심/분배’이며 ‘은사’를 본문에 보충하지 않는 편이 적절합니다. συνεπιμαρτυροῦντος의 첨가·동반 증언의 뜻은 ‘하나님께서도’로 자연스럽게 보존할 수 있습니다.
  naturalness: 원문의 어순을 다듬어 ‘그분의 뜻에 따라’가 전체 증언 수단과 행위를 수식하도록 하고, ‘성령을 나누어 주심’으로 명사구를 현대 표준어에서 더 자연스럽게 만들었습니다. ‘표적과 기사들과’도 현대적인 병렬 표현인 ‘표적과 기사와’로 정리했습니다.
  terminology: ‘하나님’, ‘표적’, ‘기사’, ‘성령’은 한국어 성경 문맥에서 안정된 용어입니다. ‘여러 가지 능력’은 δυνάμεις의 폭넓은 뜻을 보존하며, 각주에서 ‘기적’ 또는 ‘권능의 역사’라는 문맥상 대안을 제시합니다. ‘성령을 나누어 주심’은 본문이 명시하지 않는 ‘은사’를 추가하지 않습니다.
  issues:
  - severity: medium
    issue: ‘성령의 나누어 주심’의 한국어 명사구가 어색하고 의미 관계가 불분명함
    rationale: μερισμοῖς는 분배·몫·나누어 줌을 뜻하지만, ‘성령의 나누어 주심’은 누가 무엇을 나누는지를 자연스럽게 전달하지 못합니다. ‘성령을 나누어 주심’은 영어 감사 기록의 ‘distributions of the Holy Spirit’에 상응하면서도 ‘은사’를 보태지 않습니다.
  - severity: low
    issue: ‘자신의 뜻에 따른’의 수식 위치와 병렬 연결
    rationale: ‘그분의 뜻에 따라’를 문장 후반에 두고 ‘그리고’를 사용하면 원문의 수단 열거와 κατὰ τὴν αὐτοῦ θέλησιν의 범위를 더 자연스럽게 드러냅니다.
  revised_text: 하나님께서도 표적과 기사와 여러 가지 능력[a], 그리고 그분의 뜻에 따라 성령을 나누어 주심[b]으로 증언하셨습니다.
  revised_footnotes:
