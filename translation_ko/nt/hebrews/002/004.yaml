    reason: lexical_alternative
  revision_rationale: 성령의 ‘분배’라는 원문의 표현을 유지하되, 한국어에서 더 자연스러운 ‘성령을 나누어 주심’으로 고쳤습니다. ‘하나님께서도’는 συν-이 지닌 첨가·동반 증언의 뜻을 문맥상 무리 없이 반영합니다. 하나님의 뜻이라는 최종 구절은 ‘그분의 뜻에 따라’로 옮겨, 대명사의 가장 자연스러운 선행사인 하나님을 가리키게 했습니다.
