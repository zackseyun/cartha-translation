base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory, to perfect the pioneer of their salvation through sufferings.
translation:
  language: ko
  text: 만물이 그분을 위하여 존재하고 만물이 그분을 통하여 존재하는 그분께서는, 많은 아들들을[a] 영광으로 이끄시는 가운데, 그들의 구원의 선구자를[b] 고난을 통하여 온전하게 하시는[c] 것이 합당하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “많은 아들들”은 헬라어의 표현을 따른 것으로, 아들의 신분과 상속의 강조를 보존합니다. 이는 남성만을 가리키는 말이 아니라 하나님의 모든 자녀를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “창시자”, “지도자”, “개척자”. 헬라어 ἀρχηγός는 앞장서서 시작하고 길을 여는 이를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: “온전하게 하다”는 도덕적 결함을 고친다는 뜻이 아니라, 고난을 통하여 의도된 목표와 완성에 이르게 한다는 뜻입니다.
    reason: lexical_alternative
