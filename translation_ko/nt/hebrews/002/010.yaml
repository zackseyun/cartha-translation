  naturalness: “그분께서 … 하심이 합당하였습니다”보다 “그분께서는 … 하시는 것이 합당하였습니다”가 현대 한국어 문장 구조와 합쇼체에 자연스럽습니다. “존재하고” 및 “온전하게 하시는”도 명료하고 자연스럽습니다.
