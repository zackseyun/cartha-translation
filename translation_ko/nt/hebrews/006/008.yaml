review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the land imagery, the contrast, thorns and thistles, lack of usefulness, proximity to curse, and burning. However, '불사름입니다' is not natural contemporary standard Korean for εἰς καῦσιν. Rendering the outcome as '마침내 불에 태워질 것입니다' faithfully expresses the Greek result/purpose phrase without specifying a doctrinal referent.
  naturalness: ‘가시와 엉겅퀴를 내는 땅’ and ‘쓸모없고’ are natural. ‘저주에 가까우며’ is understandable but awkward in modern Korean; ‘저주를 받을 지경에 이르렀으며’ is idiomatic and conveys the phrase’s sense of being near to curse. ‘불사름입니다’ should be revised to modern Korean.
  terminology: ‘가시’/‘엉겅퀴’ appropriately render ἀκάνθας/τριβόλους. ‘쓸모가 없는’ suits the agricultural context of ἀδόκιμος; a footnote preserves ‘버림받은’ as a viable stronger alternative. The revised wording does not turn the burning image into an explicit statement about final judgment.
  issues:
  - severity: medium
    issue: ‘불사름입니다’ is archaic and unnatural in modern standard Korean.
    rationale: While it attempts to mirror the nominal Greek expression, contemporary formal Korean naturally expresses the land’s outcome as ‘마침내 불에 태워질 것입니다.’ This preserves the agricultural image and the ambiguity of εἰς καῦσιν.
  - severity: low
    issue: The alternative sense of ἀδόκιμος is not footnoted in the Korean draft.
    rationale: The English audit trail preserves ‘rejected’ as an alternative. A Korean footnote anchored to ‘쓸모가 없는’ should preserve ‘버림받은’ without making that more theologically weighty option the main rendering.
  revised_text: 그러나 가시와 엉겅퀴를 내는 땅은 쓸모가 없고[a] 저주를 받을 지경에 이르렀으며, 마침내 불에 태워질 것입니다.
