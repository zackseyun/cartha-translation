    text: 또는 ‘버림받은’.
    reason: ἀδόκιμος의 가능한 대안적 의미를 보존합니다.
  revision_rationale: The revision modernizes the awkward final expression, makes the proximity-to-curse phrase idiomatic while retaining its non-final character, and adds a properly anchored lexical-alternative footnote for ἀδόκιμος. It does not identify the burning image with a specific doctrinal outcome.
