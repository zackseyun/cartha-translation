  naturalness: The draft is generally natural in modern formal-polite Korean. '이에 따라' is somewhat less direct than the contextual connective, and '그것을' has an unclear antecedent. '더욱 분명히 보여 주시려고' and '맹세로 보증하셨습니다' are fluent and suitably formal.
  terminology: '''약속의 상속자들,'' ''뜻,'' ''불변성,'' and ''맹세'' are appropriate, accurate terms. ''뜻의 불변성'' most transparently represents τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ without adding theological interpretation.'
