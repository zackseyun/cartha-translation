review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. παραπεσόντας는 조건절 「타락하였다면」이 아니라 앞절의 대상을 계속 수식하는 부정과거 분사이므로, 조건성을 부가하지 않아야 합니다. 또한 본문의 ἀνασταυροῦντας와 παραδειγματίζοντας는 현재분사로서 이유를 나타낼 수 있으므로 「이는/왜냐하면」과 현재 진행 표현이 적절합니다. ἑαυτοῖς는 「자기들을 위하여」로 옮겨 원문의 재귀적 여격을 보존했습니다.
  naturalness: 현행 「자기들에게 있어」는 현대 표준 한국어로 부자연스럽습니다. 「타락한 이들을」, 「그들이 … 하기 때문입니다」는 합쇼체 문맥에서 자연스럽고, 6:4–6절의 이어지는 문장 구조도 분명히 합니다.
  terminology: 「회개」, 「하나님의 아들」, 「십자가에 못 박다」는 적절합니다. 「타락」은 문맥상 배교의 심각성을 나타낼 수 있으나, 각주에서 이를 ‘의도적 배반’으로 단정하지 않고 가능한 대안인 「배교하다」를 제시하는 것이 원문과 해석의 여지를 더 충실히 보존합니다.
  issues:
  - severity: high
    issue: 「타락하였다면」이 παραπεσόντας를 조건절로 번역함
    rationale: 원문의 부정과거 능동 분사 παραπεσόντας는 6:4–6절에서 앞선 복수 대상을 나열하여 수식하며, ‘만일 … 한다면’이라는 조건을 표현하지 않습니다. 조건절은 원문에 없는 가정을 도입합니다.
  - severity: medium
    issue: 「자기들에게 있어」가 ἑαυτοῖς의 자연스러운 번역이 아님
    rationale: 재귀 여격 ἑαυτοῖς는 ‘자기들을 위하여/자기들 자신에게 관련하여’라는 뜻입니다. 현행 표현은 부자연스럽고 의미 관계를 흐립니다.
  - severity: medium
    issue: 각주 a가 ‘의도적 배반’을 단정함
    rationale: παραπίπτω는 이 문맥에서 심각한 떨어져 나감 또는 배교를 가리킬 수 있지만, 분사 자체가 의도성을 명시하지는 않습니다. 교리적·심리적 단정 없이 어휘적 대안을 제시해야 합니다.
  revised_text: 그리고 타락한 이들을 다시 회개하도록 새롭게 하는 것은 불가능합니다[a]. 이는 그들이 하나님의 아들을 자기들을 위하여 다시 십자가에 못 박고 그분을 공공연히 욕되게 하고 있기 때문입니다[b].
