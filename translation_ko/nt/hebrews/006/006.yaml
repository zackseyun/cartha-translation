  to: 그리고 타락한 이들을 다시 회개하도록 새롭게 하는 것은 불가능합니다[a]. 이는 그들이 하나님의 아들을 자기들을 위하여 다시 십자가에 못 박고 그분을 공공연히 욕되게 하고 있기 때문입니다[b].
