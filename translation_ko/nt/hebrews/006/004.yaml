    reason: lexical_alternative
  - marker: b
    text: 또는 “성령을 함께 나누게 된” 또는 “성령에 참여하게 된.”
    reason: lexical_alternative
  - marker: c
    text: “빛을 받다”는 영적인 빛이나 가르침을 받는 것을 넓게 가리킬 수 있습니다. 이를 회심이나 세례 때의 조명으로 더 구체적으로 이해하는 견해도 있습니다.
