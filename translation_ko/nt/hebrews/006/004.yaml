  terminology: ‘빛을 받다’, ‘하늘의 선물’, ‘성령에 참여하다’는 원문의 은유와 의도적인 신학적 비특정성을 유지합니다. ‘성령에 참여하다’는 성령의 내주나 구원 여부를 교리적으로 확정하지 않으면서 μετόχους의 참여 의미를 반영합니다.
