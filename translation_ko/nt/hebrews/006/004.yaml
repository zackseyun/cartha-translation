  naturalness: 현대 표준어 합쇼체로는 ‘한 번 빛을 받고’와 ‘하늘의 선물을 맛보며’가 자연스럽습니다. 다만 이 절은 원문에서도 다음 절에 걸쳐 완성되는 문장이므로, 한국어에서도 ‘…사람들에게는 불가능하기 때문입니다’로 두어 다음 절의 내용을 기다리게 하는 것이 자연스럽고 충실합니다.
  terminology: ‘빛을 받다’, ‘하늘의 선물’, ‘성령에 참여하게 되다’는 신학적으로 과도하게 해석하지 않으면서도 현대 한국어에서 이해 가능한 표현입니다. ‘성령에 참여하다’는 μετόχους πνεύματος ἁγίου의 참여/공유 의미를 보존하며, 성령의 내주나 구원 상태를 특정 방식으로 단정하지 않습니다.
