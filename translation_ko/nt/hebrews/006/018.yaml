    issue: ‘하나님께서 거짓말하시는 것이 불가능한’이 ‘두 가지 변치 않는 일’을 직접 수식하는 구조
    rationale: ἐν οἷς는 ‘두 가지 변치 않는 일’을 받으며, ἀδύνατον ψεύσασθαι θεόν은 그 두 가지 일과 관련하여 하나님이 거짓말하시는 것이 불가능하다는 독립 진술입니다. 원문의 논리적·문법적 관계를 분명히 해야 합니다.
  - severity: medium
    issue: ‘피난처로 달려온’
