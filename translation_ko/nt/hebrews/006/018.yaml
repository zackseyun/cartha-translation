  source_fidelity: 개정이 필요합니다. 초안의 ‘하나님께서 거짓말하시는 것이 불가능한 두 가지 변치 않는 일’은 수식 관계상 ‘두 가지 일’ 자체가 거짓말할 수 없다는 듯이 읽힐 수 있습니다. 원문은 ‘변치 않는 두 가지 일’과 그 일들 안에서 ‘하나님이 거짓말하시는 것이 불가능함’을 구별합니다.
  naturalness: ‘피난처로 달려온’도 이해되지만, καταφυγόντες의 피신·도피의 뜻에는 ‘피난처를 찾아 피한’이 더 자연스럽고 정확합니다. ‘강력한 격려’보다 ‘큰 격려’가 현대 표준어 문맥에서 더 자연스럽습니다.
  terminology: ‘변치 않는’, ‘하나님께서 거짓말하시는 것이 불가능한’, ‘소망’, ‘굳게 붙들’은 원문의 의미와 격식에 잘 맞습니다. 영어 감사 기록의 각주 표지는 본문상 각각 ‘두 가지 일’과 ‘하나님이 거짓말하심’에 붙어 있으나 각주 내용은 각각 κρατῆσαι와 καταφυγόντες를 설명하여 표지와 내용이 불일치합니다. 한국어 개정문에는 근거 없는 각주를 신설하지 않았습니다.
  issues:
