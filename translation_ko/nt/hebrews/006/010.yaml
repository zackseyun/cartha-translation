  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them.
translation:
  language: ko
  text: 하나님께서는 여러분의 수고와, 여러분이 성도들을 섬겼고 지금도 섬김으로써 그분의 이름을 위하여 보여 준 사랑을 잊으실 만큼 불의하지 않으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
