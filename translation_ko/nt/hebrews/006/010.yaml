    text: ‘그분의 이름을 위하여’는 그분의 명예를 위해, 그분께 충성하여라는 뜻을 포함합니다.
    reason: εἰς τὸ ὄνομα αὐτοῦ의 관용적 의미를 설명하되 본문의 ‘이름’ 표현을 보존합니다.
  - marker: b
    text: ‘성도들’은 후대에 시성된 특정 부류가 아니라, 하나님께 속한 신자들을 가리킵니다.
    reason: τοῖς ἁγίοις의 신약적 공동체 의미를 명확히 합니다.
