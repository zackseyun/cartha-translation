review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the central assertion correctly: God will not forget the readers’ work and their love shown for his name through past and ongoing service to the saints. The two participles are appropriately represented as completed service and service that continues. Revising the main clause more closely reflects the Greek construction, ‘not unjust so as to forget.’'
  naturalness: The draft’s phrasing ‘불의하셔서 … 잊으실 분이 아닙니다’ is understandable but less natural and less direct in modern formal Korean. ‘잊으실 만큼 불의하지 않으십니다’ is idiomatic and retains the force of the infinitival construction. Recasting the service phrase avoids the somewhat cumbersome ‘섬겼고 또 지금도 섬기고 있는 가운데.’
  terminology: ‘성도들’ is an established and suitable rendering of τοῖς ἁγίοις. ‘그분의 이름을 위하여’ preserves εἰς τὸ ὄνομα αὐτοῦ; a note clarifies that ‘name’ carries the sense of honor and allegiance, not merely the spoken designation. ‘수고’ is a natural collective rendering of ἔργον in this context.
  issues:
  - severity: medium
    issue: The main clause is awkwardly phrased in Korean.
    rationale: ‘하나님께서는 불의하셔서 … 잊으실 분이 아닙니다’ can momentarily suggest that God is unjust before the negation is resolved. The Greek explicitly says that God is not unjust to forget, which Korean expresses naturally as ‘잊으실 만큼 불의하지 않으십니다.’
  - severity: low
    issue: The participial service phrase is stylistically heavy.
    rationale: ‘성도들을 섬겼고 또 지금도 섬기고 있는 가운데’ is not the clearest Korean way to express the instrumental relation of the past and present participles to the love shown. ‘섬겼고 지금도 섬김으로써’ clearly maintains both past and ongoing service.
  revised_text: 하나님께서는 여러분의 수고와, 여러분이 성도들을 섬겼고 지금도 섬김으로써 그분의 이름을 위하여 보여 준 사랑을 잊으실 만큼 불의하지 않으십니다.[a][b]
