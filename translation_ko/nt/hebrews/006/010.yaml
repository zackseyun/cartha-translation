revisions:
- from: 하나님께서는 불의하셔서 여러분의 수고와, 성도들을 섬겼고 또 지금도 섬기고 있는 가운데 그분의 이름을 위하여 여러분이 보여준 사랑을 잊으실 분이 아닙니다.
  to: 하나님께서는 여러분의 수고와, 여러분이 성도들을 섬겼고 지금도 섬김으로써 그분의 이름을 위하여 보여 준 사랑을 잊으실 만큼 불의하지 않으십니다.[a][b]
  rationale: 'The revision improves Korean syntax and formal-polite readability while preserving the Greek wording and sequence: God is not unjust to forget; the readers have shown love for his name; and that love has been expressed through both prior and continuing service to the saints. It does not add an implication that works earn salvation.'
