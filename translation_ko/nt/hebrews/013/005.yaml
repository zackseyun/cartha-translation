  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “being content with what you have.” Literally, “being content with the things present.”
    reason: lexical_alternative
  - marker: b
    text: The quotation echoes Old Testament covenant assurances, especially Deuteronomy 31:6, 8 and Joshua 1:5.
    reason: cross_reference
