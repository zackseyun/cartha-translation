revisions:
- from: '여러분의 삶의 방식은 돈을 사랑함에서 자유롭게 하고, 여러분이 가진 것에 만족하십시오. 그분 자신이 말씀하셨습니다: 「내가 결코 너를 떠나지 아니하며, 결단코 너를 버리지 아니하리라.」'
  to: 여러분의 삶의 방식에서 돈을 사랑하지 말고, 지금 가진 것으로 만족하십시오. 그분이 친히 말씀하셨습니다. “내가 결코 너를 떠나지 않으며, 결코 너를 버리지 않을 것이다.”
  rationale: The revision replaces the ungrammatical opening with a natural formal-polite exhortation while retaining the specific reference to love of money. It renders τοῖς παροῦσιν contextually as ‘지금 가진 것,’ preserves the emphatic αὐτός with ‘친히,’ and repeats ‘결코’ to reflect the two emphatic negative constructions. No footnotes are required by the Korean text or needed for source fidelity in this verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:52:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition of money-love, contentment with present possessions, and the emphatic divine assurance. However, its opening Korean construction is grammatically unnatural and does not clearly express the Greek exhortational predicate. The emphatic force of both οὐ μή clauses should also be represented consistently.
  naturalness: '‘여러분의 삶의 방식은 돈을 사랑함에서 자유롭게 하고’ is not idiomatic Korean: the topic phrase does not govern ‘하고’ appropriately. ‘그분 자신이’ is understandable but less natural than ‘그분이 친히.’'
  terminology: ‘돈을 사랑하다’ accurately retains the specific focus of ἀφιλάργυρος rather than broadening it to general greed. ‘지금 가진 것’ naturally expresses τοῖς παροῦσιν in this context. ‘친히’ appropriately renders the emphasis of αὐτός without explicitly adding ‘하나님’ to the Greek wording.
  issues:
  - severity: high
    issue: The opening exhortation is grammatically and stylistically defective.
    rationale: ‘여러분의 삶의 방식은 … 자유롭게 하고’ leaves the topic phrase syntactically unresolved. The Greek calls for an exhortation concerning a manner of life free from money-love.
  - severity: medium
    issue: The quotation’s repeated emphatic negations are not represented with parallel force.
    rationale: The draft has ‘결코’ only with the first clause, whereas both Οὐ μή constructions are emphatic. Repeating ‘결코’ makes the Korean reflect the source more fully.
  - severity: low
    issue: ‘그분 자신이 말씀하셨습니다’ is awkward Korean collocation.
    rationale: ‘그분이 친히 말씀하셨습니다’ is the normal formal Korean way to convey αὐτὸς … εἴρηκεν.
  revised_text: 여러분의 삶의 방식에서 돈을 사랑하지 말고, 지금 가진 것으로 만족하십시오. 그분이 친히 말씀하셨습니다. “내가 결코 너를 떠나지 않으며, 결코 너를 버리지 않을 것이다.”
  revised_footnotes: []
  revision_rationale: The revision replaces the ungrammatical opening with a natural formal-polite exhortation while retaining the specific reference to love of money. It renders τοῖς παροῦσιν contextually as ‘지금 가진 것,’ preserves the emphatic αὐτός with ‘친히,’ and repeats ‘결코’ to reflect the two emphatic negative constructions. No footnotes are required by the Korean text or needed for source fidelity in this verse.
