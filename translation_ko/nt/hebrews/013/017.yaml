source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
  footnotes:
  - marker: a
    text: 'Or: “Obey your leaders.” The Greek Πείθεσθε can carry the sense of obeying, but more literally suggests being persuaded or won over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 지도자들의 말에 귀를 기울이고 그들에게 양보하십시오.[a] 그들은 장차 책임을 보고해야 할 사람들로서 여러분의 영혼을 위하여 깨어 살피고 있습니다. 그러므로 그들이 이 일을 기쁨으로 하고 탄식하며 하지 않게 하십시오. 그것은 여러분에게 유익하지 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분의 지도자들에게 순종하십시오.” 그리스어 Πείθεσθε는 ‘설득되다, 설득에 응하다’라는 뜻에서 여기서는 ‘따르다/순종하다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
