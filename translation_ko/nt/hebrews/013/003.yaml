  rationale: 둘째 절의 부자연스럽고 의미가 어긋난 표현을 바로잡았습니다. ‘그들과 함께 갇힌 것처럼’은 συνδεδεμένοι가 요청하는 공감적 연대를 보존하며, ‘몸을 지닌 사람들인 것을 생각하여’는 ἐν σώματι의 문맥상 의미를 현대 한국어로 명료하게 전달합니다. 논쟁 가능한 교회론적 울림은 본문에 강요하지 않고 각주에 보존했습니다.
