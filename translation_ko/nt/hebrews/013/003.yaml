base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
  footnotes:
  - marker: a
    text: Or 'as being bound with them.' The Greek literally evokes being bound together with the prisoners.
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'in the body' as a reference to belonging to the body of Christ; more likely it refers to sharing ordinary human bodily vulnerability.
    reason: alternative_reading
translation:
  language: ko
  text: 갇힌 이들을[a] 여러분도 그들과 함께 갇힌 것처럼 기억하고, 학대받는 이들을 여러분도 몸을 지닌 사람들인 것을 생각하여 기억하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들과 함께 묶인 사람들처럼’. 그리스어는 갇힌 이들과 함께 결박된 상태를 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분 자신도 몸 안에 있는 이들로서’입니다. 이는 보통 모든 사람이 지닌 육체적 취약성을 가리키지만, 그리스도의 몸에 속함을 암시하는 말로 이해하기도 합니다.
    reason: alternative_reading
