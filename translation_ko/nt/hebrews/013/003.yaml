  verdict: revise
  source_fidelity: 첫 절의 ‘갇힌 자들’과 ‘그들과 함께 갇힌 것처럼’이라는 연대의 뜻은 대체로 반영되었으나, δεύτε 절의 ὡς καὶ αὐτοὶ ὄντες ἐν σώματι는 ‘여러분도 몸으로 함께 있는 것처럼’으로는 한국어 문법과 의미가 성립하지 않습니다. 이는 학대받는 이들과 함께하는 공감의 근거로서 독자들 역시 몸을 지닌, 고통에 노출될 수 있는 존재임을 가리킵니다. 본문은 이 주된 뜻을 자연스럽게 옮기고, ‘몸 안에’의 가능한 교회론적 울림은 각주에 남깁니다.
  naturalness: 초안의 ‘갇힌 자들’, ‘학대받는 자들’은 이해 가능하지만 현대 표준어에서는 ‘갇힌 이들’, ‘학대받는 이들’이 더 자연스럽습니다. 특히 ‘여러분도 몸으로 함께 있는 것처럼’은 비문에 가까우므로 고쳐야 합니다. ‘기억하십시오’의 합쇼체는 적절합니다.
  terminology: δέσμιοι는 ‘갇힌 이들’로, συνδεδεμένοι의 연대·동일시의 이미지는 ‘그들과 함께 갇힌 것처럼’으로 옮겼습니다. κακουχούμενοι는 가해를 전제하는 수동 의미를 살려 ‘학대받는 이들’로 유지했습니다. ἐν σώματι는 본문에서 ‘몸을 지닌 사람들’로 자연스럽게 번역하되, 문자적 표현과 대안적 교회론적 이해는 각주에서 밝혔습니다.
  issues:
