  source_fidelity: 핵심 구조와 권면의 어조는 잘 반영되어 있습니다. 다만 ὀνειδισμός은 여기서 단순한 ‘모욕’ 행위보다 그리스도와 함께 감당하는 ‘치욕/비방’의 뜻이므로 ‘치욕’이 더 정확합니다. πρὸς αὐτόν의 이동 방향도 ‘그분께’가 자연스럽고 분명합니다.
  naturalness: ‘진영 밖으로 그분에게 나아갑시다’는 이해할 수 있으나, 한국어에서는 ‘그분께 나아갑시다’가 더 자연스럽습니다. ‘그분의 치욕을 짊어지고’는 그 치욕을 함께 감당한다는 뜻을 유지하면서도 현대 표준어로 자연스럽습니다.
  terminology: παρεμβολή는 앞 절들의 제의·광야 이미지를 보존하는 ‘진영’으로 적절합니다. ὀνειδισμός은 ‘모욕’보다 성경적·사회적 수치의 폭을 지닌 ‘치욕’으로 옮깁니다. ‘그분’은 직전 문맥의 예수를 가리키는 대명사를 보존합니다.
  issues:
  - severity: medium
    issue: ‘그분의 모욕’
    rationale: ὀνειδισμός은 모욕을 가하는 행위라기보다 감당되는 비방·수치의 의미가 중심입니다. 한국어 ‘그분의 모욕’은 그분이 남에게 가하는 모욕으로도 읽힐 여지가 있어 ‘그분의 치욕’이 더 정확합니다.
  - severity: low
    issue: ‘그분에게 나아갑시다’
    rationale: πρὸς αὐτόν의 대인 이동은 높임말 문체에서 ‘그분께 나아갑시다’가 더 자연스럽습니다.
