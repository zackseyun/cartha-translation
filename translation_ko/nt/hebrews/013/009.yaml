  rationale: ‘낯선’으로 ξέναις의 이질성과 경계의 뉘앙스를 살리고, 은혜와 음식의 대조를 원문 순서와 논리대로 재구성했습니다. 마지막 절은 ‘음식들을 따라 살아온’으로 περιπατέω의 삶의 방식이라는 은유를 보존하되, 음식 자체로 생존한다는 부자연스러운 독해를 피했습니다. 음식이 식이 규례, 제의 식사, 또는 더 넓은 음식 관련 관행 중 무엇을 뜻하는지는 특정하지 않았습니다.
