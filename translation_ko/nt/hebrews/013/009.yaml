  text: 여러 가지 낯선 가르침에 끌려가지 마십시오. 마음은 음식들로가 아니라 은혜로 굳건해지는 것이 좋습니다. 음식들을 따라 살아온 사람들은 그것들로 유익을 얻지 못하였습니다.
