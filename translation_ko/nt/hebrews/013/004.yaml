  text: 모든 사람은 결혼을 귀히 여기고[a][b], 결혼의 잠자리를 더럽히지 않게 하십시오. 하나님께서는 음행하는 사람들과 간음하는 사람들을 심판하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
