  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
  footnotes:
  - marker: a
    text: Or, 'Marriage is honorable among all.' The Greek has no explicit verb in the first clause, so it may be read either as an exhortation or as a statement.
    reason: alternative_reading
  - marker: b
    text: Or, 'by all' instead of 'among all.'
    reason: lexical_alternative
translation:
