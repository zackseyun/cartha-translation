  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
  footnotes:
  - marker: a
    text: Or "their faithfulness." The Greek word can mean either faith or faithfulness; the main text follows the project's default rendering "faith."
    reason: alternative_reading
  - marker: b
    text: '"Outcome" could also be rendered "end" or, in some interpretations, refer specifically to the manner of their death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분에게 하나님의 말씀을 전한 여러분의 지도자들을 기억하십시오. 그들의 삶의 방식이 가져온 결과[b]를 깊이 살펴보고, 그들의 믿음[a]을 본받으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “신실함”. 그리스어 단어는 “믿음” 또는 “신실함”을 뜻할 수 있습니다. 본문은 기본 번역인 “믿음”을 따릅니다.
    reason: alternative_reading
  - marker: b
    text: “결과”는 “끝”으로도 옮길 수 있으며, 일부 해석에서는 특히 그들의 죽음의 방식을 가리킨다고 봅니다.
    reason: lexical_alternative
