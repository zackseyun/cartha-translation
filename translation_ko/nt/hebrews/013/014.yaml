review_pass:
  verdict: revise
  source_fidelity: The draft preserves the basic contrast and retains 'city' (도성), but '여기에 머무를 도성' can mean 'a city that will stay here,' because 머무를 is prospective/adnominal. The present participle μένουσαν describes an enduring/remaining city, not a city that will remain. The revised wording renders this aspect clearly and retains the future force of τὴν μέλλουσαν.
  naturalness: '''우리는 여기에 머무를 도성을 가지고 있지 아니하고'' is grammatically possible but stiff and potentially ambiguous in modern Korean. ''우리에게는 이곳에 영속하는 도성이 없으며'' is natural formal-polite Korean and clearly expresses the contrast. ''찾고 있습니다'' appropriately represents the present-tense pursuit.'
  terminology: 도성 appropriately retains the concrete city imagery and its established biblical register without identifying it as heaven or Jerusalem. '장차 올 도성' preserves the implied feminine noun in τὴν μέλλουσαν and does not over-interpret it.
  issues:
  - severity: medium
    issue: '''머무를'' gives μένουσαν an unintended future/prospective sense.'
    rationale: μένoυσαν is a present participle meaning remaining, abiding, or enduring. In Korean, 머무를 normally means 'will remain/stay,' whereas 영속하는 directly conveys the intended ongoing/enduring quality.
  - severity: low
    issue: The causal and contrastive syntax is somewhat awkward in the draft.
    rationale: Ending the whole sentence with '때문입니다' after '-지 아니하고' is less smooth than using '없으며 ... 찾고 있습니다,' while still allowing γάρ to explain the preceding context.
  revised_text: 우리에게는 이곳에 영속하는 도성이 없으며, 우리는 장차 올 도성[a]을 찾고 있습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면, “다가오는 도성” 또는 “장차 올 도성”입니다.
    reason: τὴν μέλλουσαν은 앞의 ‘도성’을 가리키며, 명사가 생략된 표현입니다. ‘장차 올 도성’은 그 함축된 명사를 한국어에서 밝혀 번역한 것입니다.
