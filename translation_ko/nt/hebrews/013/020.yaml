    text: 또는 “영원한 언약의 피를 통하여 우리 주 예수를 죽은 사람들 가운데서 이끌어 올리신.” 그리스어의 “영원한 언약의 피로”라는 구절은 하나님의 이끌어 올리시는 행위에 연결될 수도 있고, “양들의 큰 목자”에 연결될 수도 있습니다.
    reason: ‘ἐν αἵματι διαθήκης αἰωνίου’의 수식 관계와 ‘ἐν’의 의미 범위에 관한 가능한 다른 구문 해석을 보존합니다.
