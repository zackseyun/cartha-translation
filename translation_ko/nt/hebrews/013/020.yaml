translation:
  language: ko
  text: 평강의 하나님[a], 곧 영원한 언약의 피로 양들의 큰 목자이신 우리 주 예수를 죽은 사람들 가운데서 이끌어 올리신 분께서,
  philosophy: optimal-equivalence
  footnotes:
