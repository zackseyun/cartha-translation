  to: 평강의 하나님[a], 곧 영원한 언약의 피로 양들의 큰 목자이신 우리 주 예수를 죽은 사람들 가운데서 이끌어 올리신 분께서,
  rationale: ‘이제’를 삭제하여 δέ의 비시간적 전환 기능에 불필요한 시간 의미를 더하지 않았습니다. 또한 하나님을 주어로 유지하면서 분사구를 동격 설명으로 재구성해 자연스러운 합쇼체 문장 구조를 만들었습니다. ‘영원한 언약의 피로’의 논쟁 가능한 수식 범위는 본문에서 과도하게 해석하지 않고 각주로 밝혔습니다.
