  to: 여러분이 그분의 뜻을 행하도록 모든 선한 것으로 여러분을 갖추어 주시고, 예수 메시아를 통하여 우리 안에서 그분께서 기뻐하시는 일을 이루어 주시기를 빕니다. 그분에게[a] 영광이 영원토록 있기를 빕니다. 아멘.
