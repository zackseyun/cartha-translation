source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus Messiah, to whom be the glory forever and ever. Amen.
  footnotes:
  - marker: a
    text: Or, 'to whom' may refer specifically to Jesus the Messiah; some understand it instead to refer to the God of peace, the subject of the prayer.
    reason: alternative_reading
translation:
  language: ko
  text: 여러분이 그분의 뜻을 행하도록 모든 선한 것으로 여러분을 갖추어 주시고, 예수 메시아를 통하여 우리 안에서 그분께서 기뻐하시는 일을 이루어 주시기를 빕니다. 그분에게[a] 영광이 영원토록 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분에게’는 특별히 예수 메시아를 가리킬 수도 있습니다. 그러나 어떤 이들은 이를 기도의 주체이신 평화의 하나님을 가리키는 것으로 이해합니다.
    reason: alternative_reading
