- from: '그러므로 우리는 담대하게 말합니다: 「야훼는 나의 도움이시니, 나는 두려워하지 아니하리라. 사람이 내게 무엇을 행할 수 있으리요?」[a]'
  to: 그러므로 우리는 담대히 말할 수 있습니다. 「주님은 나를 돕는 분이시니, 나는 두려워하지 않겠습니다. 사람이 내게 무엇을 하겠습니까?」[a]
  rationale: 직접 원문인 그리스어 Κύριος를 ‘주님’으로 옮기고, 담대함의 분사와 말하다의 부정사를 현대 합쇼체로 자연스럽게 반영했습니다. 수사적 질문의 미래 지향성도 ‘무엇을 하겠습니까?’로 유지했습니다. 각주는 시편 인용 사실을 밝히되, 본문 표기를 특정 신명으로 복원해야 한다는 번역 지침은 제거했습니다.
