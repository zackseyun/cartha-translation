base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
  footnotes:
  - marker: a
    text: Or 'do not forget.' The Greek verb can be rendered more literally this way, though here it carries the practical sense of failing to carry out these acts.
    reason: lexical_alternative
  - marker: b
    text: '''Sharing'' can also be rendered ''fellowship'' or ''generosity''; in this context it likely refers to practical sharing of resources with others.'
    reason: lexical_alternative
