id: HEB.10.39
reference: Hebrews 10:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
  footnotes:
  - marker: a
    text: Or 'drawing back.' The Greek term can denote retreat or withdrawal; some interpreters take it more strongly here as apostasy.
    reason: lexical_alternative
  - marker: b
    text: Or 'faithfulness.' The Greek pistis can carry the sense of faithful perseverance as well as faith.
    reason: alternative_reading
  - marker: c
    text: Or 'for preservation,' 'for gaining,' or 'for possession of the soul/life.' The Greek phrase may refer to preserving one's life/self, not only 'soul' in a narrow modern sense.
    reason: lexical_alternative
  - marker: d
    text: Or 'to the preserving of the soul'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 우리는 멸망에 이르는 물러섬[a]에 속한 사람들이 아니라, 영혼[c]의 보존에 이르는 믿음[b]에 속한 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘후퇴’ 또는 ‘물러남’. 그리스어는 후퇴하거나 물러나는 것을 뜻하며, 일부 해석에서는 여기서 더 강하게 배교를 가리킨다고 봅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신실함’ 또는 ‘충실한 인내’. 그리스어 피스티스는 믿음뿐 아니라 신실하게 견디는 뉘앙스를 지닐 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘생명’ 또는 ‘자기 자신’. ‘영혼의 보존’은 영혼만을 좁게 뜻하기보다, 사람의 생명 또는 존재의 보존을 가리킬 수도 있습니다.
    reason: lexical_alternative
