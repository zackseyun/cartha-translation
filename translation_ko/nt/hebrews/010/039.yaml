  verdict: revise
  source_fidelity: 초안은 전체 대조와 결과의 기본 뜻을 잘 전달합니다. 다만 ‘영혼의 보존에 이르는 믿음의 사람들’은 πίστεως εἰς περιποίησιν ψυχῆς의 관계를 한국어에서 다소 불명확하고 부자연스럽게 만듭니다. ψυχή는 여기서 좁은 뜻의 비물질적 ‘영혼’으로 한정하기보다 생명/자기 자신을 포함하는 말로 보존하는 것이 안전합니다.
  naturalness: ‘뒤로 물러서는 자들’과 ‘믿음의 사람들’의 대조는 이해되지만, 후반부의 ‘보존에 이르는 믿음의 사람들’은 현대 표준어 문장으로 매끄럽지 않습니다. ‘믿음으로 생명을 보존할 사람들’은 간결하면서도 목적·결과의 관계를 자연스럽게 드러냅니다.
  terminology: ὑποστολή는 ‘물러섬’으로, ἀπώλεια는 ‘멸망’으로 옮기는 것이 적절합니다. πίστις는 ‘믿음’을 유지합니다. ψυχή는 본문에서 ‘생명’으로 옮기고, ‘영혼/자기 자신’도 가능한 범위임을 각주로 밝혀 좁은 현대적 영혼 개념으로 고정하지 않습니다. περιποίησις는 문맥상 ‘보존’으로 옮기되 획득·얻음의 가능성을 각주에 남깁니다.
  issues:
  - severity: medium
    issue: 후반부의 문장 관계가 불명확하고 어색함
    rationale: ‘영혼의 보존에 이르는 믿음의 사람들’은 믿음이 보존에 이르는지, 사람들이 믿음의 사람들인지 결속 관계가 불분명합니다. 원문의 대조를 한국어에서 자연스럽게 표현할 필요가 있습니다.
  - severity: low
    issue: ‘영혼’이 ψυχή의 의미 범위를 지나치게 좁힐 수 있음
    rationale: ψυχή는 이 문맥에서 생명 또는 자기 자신을 가리킬 수 있습니다. 본문은 ‘생명’으로 하고 대안을 각주로 제시하는 편이 의미 범위를 더 잘 보존합니다.
  revised_text: 그러나 우리는 뒤로 물러서서 멸망할 사람들이 아니라, 믿음으로 생명을 보존할 사람들입니다.
  revised_footnotes:
  - marker: a
    text: ‘뒤로 물러서서’는 ‘물러남’ 또는 ‘후퇴함’으로도 옮길 수 있습니다. 문맥에 따라 배교를 뜻한다고 보는 해석도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘믿음’은 ‘신실함’ 또는 믿음 안에서의 끈질긴 충실함을 포함할 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘생명을 보존할’은 직역하면 ‘혼/생명의 보존을 위한’입니다. 여기서 그리스어는 생명, 자기 자신, 또는 영혼을 가리킬 수 있으며, ‘보존’은 ‘얻음’이나 ‘획득’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 ‘멸망에 이르는 물러섬’과 ‘생명 보존에 이르는 믿음’의 대조를 유지하면서, 한국어에서 어색한 명사 연쇄를 자연스러운 합쇼체 문장으로 고쳤습니다. ‘영혼’을 ‘생명’으로 옮기고 관련 의미 범위를 각주에 보존하여 ψυχή를 특정한 교리적 의미로 한정하지 않았습니다.
