review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the two contrasted outcomes: withdrawal ending in destruction and faith directed toward preservation. However, ‘영혼’ can be read too narrowly in contemporary Korean as an immaterial soul, whereas ψυχή here may also denote life or the person/self. The lexical alternatives identified in the audit trail should be retained in notes.'
  naturalness: The formal-polite register is appropriate. Replacing ‘뒤로 물러서는’ with ‘물러서는’ avoids a slightly redundant expression while retaining the sense of ὑποστολή. ‘믿음의 사람들’ is natural Korean for the Greek categorizing genitive construction.
  terminology: ‘멸망,’ ‘믿음,’ and ‘영혼의 보존’ are suitable main-text equivalents. Notes preserve the possible senses of withdrawal, faith/faithfulness, and soul/life/self without forcing an interpretive conclusion.
  issues:
  - severity: low
    issue: The draft has no notes for materially relevant lexical breadth.
    rationale: ὑποστολή may mean withdrawal/retreat and is sometimes understood as apostasy; πίστις may carry faithful perseverance; and ψυχή can refer to life or self as well as soul. The main text can remain traditional and concise, but these alternatives should be available in anchored notes.
  - severity: low
    issue: ‘뒤로 물러서는’ is mildly redundant in Korean.
    rationale: ‘물러서는’ naturally conveys withdrawal or drawing back in this context and is smoother while preserving the source sense.
  revised_text: 그러나 우리는 멸망에 이르는 물러섬[a]에 속한 사람들이 아니라, 영혼[c]의 보존에 이르는 믿음[b]에 속한 사람들입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘후퇴’ 또는 ‘물러남’. 그리스어는 후퇴하거나 물러나는 것을 뜻하며, 일부 해석에서는 여기서 더 강하게 배교를 가리킨다고 봅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신실함’ 또는 ‘충실한 인내’. 그리스어 피스티스는 믿음뿐 아니라 신실하게 견디는 뉘앙스를 지닐 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘생명’ 또는 ‘자기 자신’. ‘영혼의 보존’은 영혼만을 좁게 뜻하기보다, 사람의 생명 또는 존재의 보존을 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision keeps the Greek noun-based category contrast more visible (‘물러섬에 속한’ / ‘믿음에 속한’) and supplies anchored notes for the lexical ambiguities documented in the English audit trail. It does not decide whether the withdrawal is full apostasy, whether πίστις should be understood as faithfulness, or whether ψυχή is restricted to an immaterial soul.
