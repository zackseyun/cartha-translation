- from: 여러분은 갇힌 자들과 함께 고난을 받았고, 여러분 자신에게 더 좋고 영구한 소유가 있는 것을 알므로 여러분의 소유를 빼앗기는 것을 기쁨으로 받아들였습니다.
  to: 여러분은 갇힌 이들과 함께 고난을 겪었고[a], 여러분 자신이 더 나은 그리고 영속하는 소유를 가지고 있음을 알고 여러분의 재산을 빼앗기는 것을 기쁘게 받아들였습니다.[b]
  rationale: 본문은 SBLGNT의 짧은 독법을 따르므로 ‘하늘에’를 본문에 넣지 않았습니다. συνεπαθήσατε의 연대와 고난 참여의 뜻을 본문에서 보존하고, 더 약한 ‘동정하다’ 독법은 주석으로 처리했습니다. 이문 주석은 후반부의 ὕπαρξιν에, 어휘 대안 주석은 συνεπαθήσατε에 연결했습니다.
