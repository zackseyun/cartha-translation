  verdict: revise
  source_fidelity: 초안은 핵심 의미를 대체로 충실히 옮깁니다. 다만 ἁρπαγή의 강제적 빼앗음이라는 뉘앙스를 더 분명히 하고, γινώσκοντες의 연결을 자연스럽게 드러내며, 사본 이문 및 어휘 대안 주석의 위치를 본문 해당 구절에 맞추는 것이 좋습니다.
  naturalness: ‘갇힌 자들’과 ‘영구한 소유’는 이해되지만 다소 문어적이거나 경직됩니다. ‘갇힌 이들’, ‘더 나은 그리고 영속하는 소유’ 및 ‘있음을 알고’가 현대 표준어 합쇼체 성경 문맥에서 더 자연스럽습니다.
  terminology: δεσμίοις는 ‘갇힌 이들’, συνεπαθήσατε는 능동적 연대의 의미를 살려 ‘함께 고난을 겪었고’로 옮깁니다. ἁρπαγή는 ‘재산을 빼앗기는 것’으로, κρείττονα와 μένουσαν은 각각 ‘더 나은’과 ‘영속하는’으로 옮깁니다. 본문은 ‘하늘에’를 삽입하지 않습니다.
  issues:
  - severity: medium
    issue: 영어 감사 기록의 두 주석은 본문상 해당하는 위치와 연결되어 있지 않으며, 한국어 초안에는 이문 및 어휘 대안 주석이 빠져 있습니다.
    rationale: ‘하늘에’라는 이문은 후반부의 더 나은 영속하는 소유에, ‘동정하다’라는 어휘 대안은 첫 절의 συνεπαθήσατε에 각각 붙어야 합니다. 주석 앵커를 바로잡아 독자가 본문 이문과 어휘적 불확실성을 정확히 확인할 수 있게 해야 합니다.
  - severity: low
    issue: ‘여러분의 소유를 빼앗기는 것’은 의미상 맞지만 ἁρπαγή의 강제적·부당한 탈취의 어감을 충분히 드러내지 못할 수 있습니다.
    rationale: ‘재산을 빼앗기는 것’은 자연스러운 한국어이면서 폭력적 탈취의 기본 의미를 더 분명하게 전달합니다.
