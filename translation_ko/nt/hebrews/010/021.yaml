  source_fidelity: 그리스어 ἱερέα μέγαν은 기술적 칭호인 ἀρχιερεύς(‘대제사장’)가 아니라 ‘위대한/큰 제사장’이라는 명사구입니다. 따라서 ‘큰 제사장’은 의미는 가깝지만 한국어에서 다소 부자연스럽고 크기라는 인상을 줄 수 있습니다. ἐπὶ τὸν οἶκον τοῦ θεοῦ는 하나님의 집 위에 권위를 가진다는 뜻으로, ‘맡으신’이 문맥상 자연스럽게 이를 전달합니다. ‘모셨으니’는 앞 절부터 이어지는 ‘가지고 있으므로’의 구문을 한국어로 자연스럽게 이어 줍니다.
