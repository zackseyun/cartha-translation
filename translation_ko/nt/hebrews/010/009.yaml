  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
  footnotes:
  - marker: a
    text: Or 'He removes the first in order to establish the second.' Here 'the first' and 'the second' likely refer to the first arrangement of sacrifices and the second reality of God's will fulfilled in the Messiah's offering.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 그분께서 말씀하셨습니다. “보십시오, 제가 주님의 뜻을 행하려고 왔습니다.” 그분께서는 둘째 것을 세우시려고 첫째 것[a]을 없애십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘첫째 것’과 ‘둘째 것’은 본문에서 명시적으로 풀이되지 않습니다. 문맥상 제사와 예물의 첫 질서와 하나님의 뜻이 메시아의 제물로 이루어진 현실을 가리킬 가능성이 크며, 시편 인용 안의 두 진술을 가리킨다는 이해도 있습니다.
    reason: The substantival expressions τὸ πρῶτον and τὸ δεύτερον are intentionally terse; the note gives contextual possibilities without fixing one disputed referent in the translation.
