    issue: ‘봉헌하셨습니다’는 ἐνεκαίνισεν과 ‘길’의 결합을 부자연스럽게 만듭니다.
    rationale: ἐγκαινίζω에는 새로 사용하도록 열거나 마련한다는 뜻이 있으나, 한국어 ‘길을 봉헌하다’는 통상적 결합이 아니며 길의 접근성이라는 문맥을 흐립니다.
  - severity: medium
    issue: ‘그것은 그분의 육체입니다’가 원문의 동격 관계를 독립된 단정문으로 바꿉니다.
    rationale: τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ는 바로 앞의 ‘휘장’을 설명하는 동격 표현입니다. ‘휘장, 곧 자신의 육체’로 처리하면 문법적 연결과 비유를 더 잘 보존합니다.
