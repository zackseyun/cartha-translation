  source_fidelity: 개정안은 ἐνεκαίνισεν을 ‘여셨습니다’로, ἡμῖν을 ‘우리를 위하여’로, διὰ τοῦ καταπετάσματος를 ‘휘장을 통하여’로 충실히 옮깁니다. ‘휘장, 곧 자신의 육체를 통하여’라는 구성은 τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ의 동격 설명을 보존하며, 원문에 없는 별도의 연결 구조를 강요하지 않습니다.
  naturalness: 초안의 ‘길을 봉헌하셨습니다’는 한국어에서 길의 개설·접근 비유와 자연스럽게 결합하지 않습니다. 또한 대시로 둘러싼 ‘그것은 그분의 육체입니다’는 휘장과 육체의 동격을 독립 서술로 바꾸어 문맥상 어색합니다. 개정안은 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: καταπέτασμα은 ‘휘장’, σάρξ는 ‘육체’로 옮겨 성소 휘장 및 예수의 육체라는 비유적·신학적 어휘를 유지합니다. ‘자신의 육체’는 주어를 명확히 가리키되 의미를 추가하지 않습니다.
  issues:
