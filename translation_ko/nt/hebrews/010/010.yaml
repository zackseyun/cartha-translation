  source_fidelity: 원문의 ἐν ᾧ θελήματι를 문맥상 앞서 언급된 하나님의 뜻을 가리키는 수단적 표현인 “그 뜻으로 말미암아”로 적절히 옮겼습니다. 완료 수동을 “거룩하게 되었습니다”로, διά+속격을 “통하여”로, ἐφάπαξ를 “단번에”로 충실히 반영합니다. “예수 메시아의 몸을 단번에 드리심”은 예수의 몸의 제사를 통한 수단을 자연스럽게 나타냅니다.
  naturalness: 표준 한국어의 현대적 합쇼체로 자연스럽고 문장 구조도 명료합니다. “말미암아”와 “통하여”는 다소 격식 있는 성경 번역 문체이나, 본문의 제의적·신학적 문맥에 적절합니다.
  terminology: ἁγιάζω의 “거룩하게 되었습니다,” προσφορά의 “드리심,” Χριστός의 칭호적 의미를 보존한 “메시아”가 일관되고 적절합니다. 본문에 별도의 각주 표지가 없으므로 추가 각주는 필요하지 않습니다.
