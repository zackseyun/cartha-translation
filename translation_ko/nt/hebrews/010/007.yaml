    text: 또는 ‘책의 두루마리’ 또는 ‘책의 두루마리 롤’. 여기서 ‘두루마리’는 현대의 제본책이 아니라 고대의 두루마리를 가리킵니다.
    reason: κεφαλίς의 어휘적 의미와 고대 문서 형태를 설명합니다.
