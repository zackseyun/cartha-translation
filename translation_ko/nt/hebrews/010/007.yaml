  to: 그때에 내가 말하였습니다. 『보십시오, 제가 왔습니다—책의 두루마리[a]에 나에 관하여 기록되어 있듯이—하나님, 당신의 뜻을 행하려고 왔습니다.』
  rationale: 문장부호 오류를 고치고, ‘책의 두루마리’와 각주로 κεφαλίς의 의미를 보존했습니다. ‘제가 왔습니다’와 ‘행하려고 왔습니다’의 반복은 원문의 ἥκω와 목적을 나타내는 τοῦ ποιῆσαι의 관계를 한국어에서 명시적으로 유지합니다. 그리스어 원문의 1인칭 선언과 하나님께 대한 직접 호칭을 유지하며, 그리스도론적 해석을 본문에 덧붙이지 않았습니다.
