review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 의미를 대체로 전달하지만, ‘두루마리 책’은 ἐν κεφαλίδι βιβλίου의 소유 관계를 충분히 드러내지 못하고, 인용부호가 불균형하게 닫혀 있습니다. 또한 ‘기록되어 있는 대로’는 본문의 삽입된 기록 진술을 다소 느슨하게 처리합니다.
  naturalness: ‘그때에’와 ‘보십시오’는 현대의 격식 있는 성경 문체에 자연스럽습니다. ‘책의 두루마리’는 다소 낯선 직역이지만, 각주로 고대 두루마리를 설명하면 원문의 표현과 현대 독자의 이해를 함께 살릴 수 있습니다. 문장부호를 바로잡고 인용문 내부의 연결을 명료하게 했습니다.
  terminology: Ἰδοὺ는 ‘보십시오’, ἥκω는 도착의 완료적 뉘앙스를 살린 ‘제가 왔습니다’, θέλημα는 ‘당신의 뜻’으로 옮겼습니다. ‘하나님’은 ὁ θεός의 호격적 용법을 직접 호칭으로 반영합니다.
