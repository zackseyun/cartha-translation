translation:
  language: ko
  text: 그때에 내가 말하였습니다. 『보십시오, 제가 왔습니다—책의 두루마리[a]에 나에 관하여 기록되어 있듯이—하나님, 당신의 뜻을 행하려고 왔습니다.』
  philosophy: optimal-equivalence
  footnotes:
