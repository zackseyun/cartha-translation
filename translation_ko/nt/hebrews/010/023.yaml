    issue: The possessive ‘우리’ is supplied in ‘우리 소망의 고백.’
    rationale: The Greek reads simply ‘the confession of hope’ and does not contain an explicit possessive. Korean does not need this addition for idiomatic clarity.
  - severity: low
    issue: ‘소망의 고백’ can sound syntactically less transparent in contemporary Korean.
    rationale: ‘소망에 대한 고백’ more clearly expresses the genitive relationship while preserving the source sense.
  revised_text: 소망에 대한 고백을 흔들림 없이 굳게 지킵시다. 약속하신 분은 신실하시기 때문입니다.
