revisions:
- from: '우리는 이렇게 말씀하신 분을 압니다: 「보응은 내 것이니, 내가 갚으리라.」 또 「야훼께서 자기 백성을 심판하시리라.」'
  to: 이는 우리가 이렇게 말씀하신 분을 알고 있기 때문입니다. “보응은 내 것이니, 내가 갚겠습니다.” 또, “주님께서 자기 백성을 심판하실 것입니다.”
  rationale: γάρ의 근거 관계를 ‘이는 … 때문입니다’로 반영하고, τὸν εἰπόντα를 자연스러운 현대 한국어로 옮겼습니다. ἐκδίκησις는 ‘보응’으로 유지하되, κύριος는 그리스어 본문과 영어 POB에 따라 ‘주님’으로 수정했습니다. 두 미래형 인용문은 현대 합쇼체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:52:52Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 γάρ(설명·근거), 두 인용문, 미래형 동사들은 대체로 반영되었습니다. 그러나 κύριος를 ‘야훼’로 옮긴 것은 본문의 그리스어 표현 및 영어 POB의 ‘the Lord’를 넘어선 복원입니다.
  naturalness: ‘우리는 이렇게 말씀하신 분을 압니다’는 이해할 수 있으나, 현대 표준어에서는 ‘우리는 이렇게 말씀하신 분을 알고 있습니다’가 더 자연스럽습니다. 인용문의 ‘갚으리라/심판하시리라’는 문어적·고어적 색채가 있어, 목표 합쇼체에 맞게 현대적으로 다듬는 것이 안전합니다.
  terminology: ἐκδίκησις의 ‘보응’은 문맥에 맞는 절제된 표현입니다. κύριος는 원문을 따라 ‘주님’으로 번역해야 하며, ‘야훼’로 특정하지 않는 것이 원문 충실성과 번역 원칙에 부합합니다.
  issues:
  - severity: medium
    issue: κύριος를 ‘야훼’로 번역함
    rationale: SBLGNT 본문은 κύριος이며, 이는 여기서 ‘주님’으로 옮기는 것이 직접적입니다. 히브리어 원전의 신명을 근거로 ‘야훼’를 복원하면 그리스어 본문과 영어 POB 감사 기록의 용어 선택을 넘어섭니다.
  - severity: low
    issue: γάρ의 설명 관계가 한국어에서 드러나지 않음
    rationale: ‘이는/왜냐하면’으로 앞 절과의 논리적 연결을 표시하면 γάρ의 기능을 보존할 수 있습니다.
  - severity: low
    issue: 인용문과 서술의 표현이 목표 현대 합쇼체보다 다소 고어적임
    rationale: ‘알고 있습니다’, ‘갚겠습니다’, ‘심판하실 것입니다’는 의미를 바꾸지 않으면서 현대적인 정중 문체를 유지합니다.
