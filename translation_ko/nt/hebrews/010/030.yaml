  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
  footnotes:
  - marker: a
    text: Or, more literally, “Vengeance is mine.”
    reason: lexical_alternative
  - marker: b
    text: The quotation echoes Deuteronomy 32:35–36. In its original context, “judge” can include both punishment and vindication; here the warning context emphasizes divine judgment.
    reason: cross_reference
translation:
  language: ko
  text: 이는 우리가 이렇게 말씀하신 분을 알고 있기 때문입니다. “보응은 내 것이니, 내가 갚겠습니다.” 또, “주님께서 자기 백성을 심판하실 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ ἐκδίκησις
  english_pob_choice: Vengeance is mine
  chosen_korean: 보응은 내 것
  alternatives_korean:
  - 원수 갚음은 내 것
  lexicon: BDAG
  rationale: 신명기 32:35의 인용으로, ἐκδίκησις는 정의로운 보응을 가리키며 「보응」으로 옮긴다.
- source_word: κύριος
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean: []
  lexicon: BDAG
  rationale: 신명기 32:36의 재인용 — 야훼 복원.
