id: HEB.10.38
reference: Hebrews 10:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
  footnotes:
  - marker: a
    text: Or 'by faithfulness' or 'by trust.' The Greek word pistis can carry these senses, though the main text follows the project's default rendering 'faith.'
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read simply 'the righteous one' instead of 'my righteous one.'
    reason: textual_variant
  - marker: c
    text: The singular masculine ('he,' 'him') reflects the Greek wording and functions representatively, not necessarily exclusively of males.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 나의 의인은[a][b] 믿음으로 살 것입니다. 그가 뒤로 물러서면[c], 내 영혼은 그를 기뻐하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''믿음으로''는 ''신실함으로'' 또는 ''신뢰로''로도 옮길 수 있습니다. 그리스어 피스티스(πίστις)는 이러한 의미들을 가질 수 있으나, 본문에서는 기본 번역인 ''믿음''을 따릅니다.'
    reason: lexical_alternative
  - marker: b
    text: 일부 사본에는 '나의 의인' 대신 단순히 '의인'이라고 되어 있습니다.
    reason: textual_variant
  - marker: c
    text: 그리스어는 단수 남성형('그가', '그를')을 사용합니다. 이는 반드시 남성만을 가리키기보다 대표적으로 한 사람을 가리키는 표현일 수 있습니다.
    reason: cultural_note
