revisions:
- from: 우리는 참된 마음과 믿음의 충만한 확신으로 가까이 나아갑시다. 우리의 마음은 악한 양심으로부터 뿌려져서 깨끗케 되었고, 우리의 몸은 순수한 물로 씻겨졌습니다.
  to: 참된 마음과 믿음의 충만한 확신으로, 악한 양심으로부터 우리의 마음에 뿌림을 받고 우리의 몸이 깨끗한 물로 씻김을 받은 채 가까이 나아갑시다.
  rationale: The revision restores the participial relationship to the hortatory main verb by using “-을/를 받은 채.” It retains the source’s purification imagery and its ambiguity concerning the precise referent of the washing, while using contemporary formal Korean. “깨끗한 물” is preferred over “순수한 물” here because it is more idiomatic for cleansing/purification language and closely reflects καθαρῷ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:52:50Z'
review_pass:
  verdict: revise
  source_fidelity: The exhortatory force of προσερχώμεθα is correctly represented by “나아갑시다,” and the core lexical choices are broadly sound. However, the draft recasts the two perfect participles as independent past-tense assertions (“되었고 … 씻겨졌습니다”), obscuring their syntactic role as accompanying conditions/states of the exhortation. “뿌려져서 깨끗케” is also an awkward and overly explicit expansion of ῥεραντισμένοι.
  naturalness: The proposed revision uses natural modern formal Korean while retaining the ritual-cleansing imagery. “깨끗케” is archaic/nonstandard in this context; “씻김을 받은 채” and “뿌림을 받은 채” better express the completed participial states.
  terminology: “참된 마음,” “믿음의 충만한 확신,” “악한 양심,” and “깨끗한 물” appropriately preserve the Greek and the English audit trail. The revision does not identify the washing explicitly as baptism or introduce an unstated substance for the sprinkling.
  issues:
  - severity: medium
    issue: The perfect participles are rendered as separate past-tense finite clauses.
    rationale: ῥεραντισμένοι and λελουσμένοι modify the implied “we” in the exhortation. Rendering them as “되었고 … 씻겨졌습니다” makes them coordinate assertions rather than completed states accompanying “let us draw near.”
  - severity: medium
    issue: “뿌려져서 깨끗케 되었고” is awkward and adds a result formulation.
    rationale: The phrase is not natural contemporary Korean, and “깨끗케 되다” expands the participle into an explicit result. The cleansing implication may be retained through the ritual expression without adding a separate predicate.
  revised_text: 참된 마음과 믿음의 충만한 확신으로, 악한 양심으로부터 우리의 마음에 뿌림을 받고 우리의 몸이 깨끗한 물로 씻김을 받은 채 가까이 나아갑시다.
  revised_footnotes: []
