    text: ‘그러한 일을 겪는 이들’로 옮긴 표현은 문맥상 같은 박해를 당하는 이들을 가리킵니다. 그러나 헬라어 동사는 문맥에 따라 ‘그처럼 살아가거나 처신하는 이들’로도 이해될 수 있습니다.
    reason: alternative_reading
  revision_rationale: 인과를 나타내는 ‘이는 ... 때문입니다’를 제거하여 앞 절에 이어지는 분사구의 병렬 구조를 보존했습니다. θεατριζόμενοι의 공개적 수모라는 뜻을 ‘공개적으로 구경거리가 되다’로, κοινωνοί의 연대 의미를 ‘동료’로 유지했습니다. 문맥상 적절한 박해의 이해를 본문에 반영하면서도 ἀναστρεφομένων의 가능한 대안은 각주에 보존했습니다.
