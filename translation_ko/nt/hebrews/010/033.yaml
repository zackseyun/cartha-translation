  source_fidelity: 초안은 τοῦτο μὲν ... τοῦτο δὲ의 대조와 박해의 맥락을 대체로 잘 반영합니다. 그러나 ‘이는 ... 때문입니다’는 헬라어 본절에 없는 인과관계를 독립적으로 확정하며, ‘사람들 앞에’는 θεατρίζω의 공개성에 비해 다소 부가적입니다. ἀναστρεφομένων의 문맥상 수동적 이해는 가능하지만, 동사 자체의 ‘살다/처신하다’라는 가능한 의미는 주석으로 보존하는 것이 좋습니다.
  naturalness: ‘한편으로는 ... 또 한편으로는’은 자연스럽고 본문의 상관 구문을 잘 살립니다. ‘공개적으로 구경거리가 되다’는 현대 표준어에서 자연스러우며, 모욕과 환난을 당하는 공적 수모의 뜻을 명료하게 전달합니다.
  terminology: ‘모욕’, ‘환난’, ‘동료’는 각각 ὀνειδισμοί, θλίψεις, κοινωνοί에 적절합니다. ‘그러한 일을 겪는 이들’은 박해 문맥의 주된 이해를 반영하되, 각주에서 ἀναστρεφομένων의 생활·처신 관련 대안을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘이는 ... 때문입니다’가 본절에 없는 명시적 인과관계를 추가합니다.
    rationale: 헬라어는 앞 절의 주동사에 딸린 두 분사구로, 여기서는 두 양상을 병렬로 제시합니다. 인과절로 독립시켜 번역하면 문장 관계를 과도하게 확정합니다.
  - severity: low
    issue: ἀναστρεφομένων의 가능한 생활·처신 의미가 번역 및 주석에서 사라졌습니다.
    rationale: 문맥은 ‘그처럼 대우받는/그러한 일을 겪는’ 이해를 강하게 지지하지만, 해당 동사는 다른 문맥에서 ‘살다, 처신하다’를 뜻할 수 있으므로 가능한 대안을 각주로 남기는 것이 투명합니다.
  revised_text: 여러분은 한편으로는 모욕과 환난을 당하며 공개적으로 구경거리가 되었고, 또 한편으로는 그러한 일을 겪는 이들의 동료가 되었습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면, ‘공개적인 구경거리가 되며’입니다. 이 표현은 사람들 앞에 드러나 수모와 조롱의 대상이 되는 모습을 나타냅니다.
    reason: lexical_alternative
