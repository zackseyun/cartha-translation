  - severity: low
    issue: ‘죄들과 그들의 무법한 행실들을’ is stylistically cumbersome.
    rationale: Korean commonly uses collective singular expressions for these abstract plural categories. ‘그들의 죄와 불법 행위를’ is natural while retaining both source terms.
