  verdict: revise
  source_fidelity: 현 초안의 ‘약속하신 것을’은 τὴν ἐπαγγελίαν(‘약속’)을 이미 성취된 약속의 내용으로 확정하여, 원문의 의도적인 여지를 좁힙니다. 또한 ἵνα와 aorist participle ποιήσαντες의 관계는 ‘하나님의 뜻을 행한 뒤에 … 받게 되려면’으로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘이는 … 받으려 함입니다’는 현대 표준 한국어 합쇼체에서 다소 문어적이고 주어 및 목적 관계가 불분명합니다. 조건·목적 관계를 한 문장으로 명료하게 옮기는 편이 자연스럽습니다.
  terminology: ὑπομονή는 ‘인내’, τὸ θέλημα τοῦ θεοῦ는 ‘하나님의 뜻’, ἐπαγγελία는 본문에서 ‘약속’으로 유지합니다. ‘약속된 것’이라는 문맥적 해석은 각주로만 제시하여 원문의 의미 범위를 보존합니다.
  issues:
  - severity: medium
    issue: ‘약속하신 것을’이 ‘약속’을 ‘약속된 것’으로 확정함
    rationale: τὴν ἐπαγγελίαν은 문자적으로 ‘약속’이며, κομίσησθε와 함께 약속의 성취물을 가리킬 수도 있습니다. 본문에서 한쪽으로 단정하지 않고 대안을 각주로 보존해야 합니다.
  - severity: low
    issue: ‘이는 … 받으려 함입니다’의 표현이 부자연스럽고 관계가 모호함
    rationale: 현대 합쇼체에서는 ‘… 받게 되려면 인내가 필요합니다’가 원문의 목적/결과 관계와 선행 행위 관계를 더 명료하고 자연스럽게 전달합니다.
  revised_text: 여러분이 하나님의 뜻을 행한 뒤에 약속을[a] 받게 되려면 인내가 필요합니다.
  revised_footnotes:
  - marker: a
    text: 또는 “약속된 것을.”
    reason: ἐπαγγελία는 본문에서는 ‘약속’이지만, κομίσησθε(‘받다’)와 함께 문맥상 약속된 것 또는 약속의 성취를 가리킬 수 있습니다.
  revision_rationale: 원문의 핵심 어휘를 보존하면서, ‘하나님의 뜻을 행한 뒤에’로 aorist participle의 선행성을 드러냈습니다. ‘약속’을 본문에 유지하고 ‘약속된 것’은 각주로 처리하여 해석상의 긴장을 보존했습니다.
