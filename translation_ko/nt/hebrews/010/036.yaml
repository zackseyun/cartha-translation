  source_fidelity: 초안은 ὑπομονή를 ‘인내’로, 하나님의 뜻을 행한 뒤 받는다는 순서를 적절히 반영합니다. 그러나 τὴν ἐπαγγελίαν(‘그 약속’)을 ‘약속하신 것’으로 옮겨, 원문의 명사 표현과 의도적으로 남겨진 ‘약속/약속된 것’의 뉘앙스를 본문에서 한쪽으로 해소합니다.
  naturalness: ‘이는 … 받으려 함입니다’는 현대 표준어 합쇼체에서 다소 문어적이고 목적의 주체가 불분명합니다. 문장 구조를 간결하게 조정하면 자연스럽고 분명해집니다.
  terminology: ‘인내’, ‘하나님의 뜻’, ‘약속’은 모두 적절합니다. ‘약속’은 원문의 표현을 보존하고, ‘약속된 것’이라는 문맥상 가능한 이해는 각주로 제시하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘약속하신 것을’이 τὴν ἐπαγγελίαν을 본문에서 해석적으로 구체화합니다.
    rationale: ἐπαγγελία는 문자적으로 ‘약속’이며, 이 문맥에서는 ‘약속된 것’도 가능하지만 원문은 그 뉘앙스를 확정하지 않습니다. 영어 POB의 각주 처리와 같이 대안은 각주로 보존해야 합니다.
  - severity: low
    issue: ‘이는 … 받으려 함입니다’의 문체와 구문이 부자연스럽습니다.
    rationale: 현대 합쇼체에서는 ‘… 받기 위해서입니다’가 더 자연스럽고, 앞 문장의 ‘필요합니다’와도 잘 연결됩니다.
  revised_text: 여러분에게는 인내가 필요합니다. 하나님의 뜻을 행한 뒤에 약속을 받기 위해서입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘약속된 것을 받다.’
    reason: ‘약속’(ἐπαγγελία)은 문맥상 약속 자체를 가리킬 수도 있고 약속된 것을 가리킬 수도 있습니다.
  revision_rationale: 원문의 ‘약속’을 본문에서 그대로 유지하여 의미의 여지를 보존하고, ‘약속된 것’이라는 문맥상 가능한 이해는 각주로 옮겼습니다. 또한 목적을 나타내는 문장을 현대적인 합쇼체로 다듬되, 하나님의 뜻을 행한 뒤 약속을 받는 순서를 유지했습니다.
