source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
  footnotes:
  - marker: a
    text: Or 'conscience of sins.' The Greek expression can denote conscience, awareness, or consciousness of sins; here it refers to the continuing sense of guilt before God.
    reason: lexical_alternative
  - marker: b
    text: Or 'once for all been cleansed.' The adverb 'once' may carry a definitive, unrepeatable sense in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않았다면, 제사들이 드려지는 일이 그치지 않았겠습니까? 이는 한 번[b] 정결하게 된 예배드리는 사람들이 더 이상 죄에 대한 의식[a]을 갖지 않게 되었을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄에 대한 양심’ 또는 ‘죄에 대한 자각’. 그리스어 표현은 죄에 관한 양심·자각·의식을 뜻할 수 있으며, 여기서는 하나님 앞에서 지속되는 죄책의 의식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘단번에’. ‘한 번’은 이 문맥에서 결정적이며 반복되지 않는 의미를 지닐 수 있습니다.
    reason: lexical_alternative
