  source_fidelity: 초안은 성령이 우리에게 증언한다는 핵심 의미를 잘 전달합니다. 그러나 '증언하시는데, 이렇게 말씀하신 후에'는 γάρ의 근거·설명 관계가 충분히 드러나지 않고, '이렇게'는 원문에 명시되지 않은 지시어입니다. μετὰ γὰρ τὸ εἰρηκέναι의 시간·근거 연결을 자연스럽게 반영할 필요가 있습니다.
  naturalness: 합쇼체는 적절하나, 현재 문장은 '-는데'가 뒤 절을 단순히 이어 주어 논증의 관계가 다소 불분명합니다. 두 문장으로 나누어 '이는 … 때문입니다'로 처리하면 현대 표준 한국어에서 더 명료하고 자연스럽습니다.
  terminology: '''성령''과 ''증언하다''는 신약 문맥 및 현대 한국어 성서 용례에 적절합니다. μαρτυρεῖ의 법정적 증언 뉘앙스를 보존하기 위해 대안 번역을 각주로 제시할 수 있습니다.'
  issues:
  - severity: medium
    issue: γάρ의 설명·근거 관계가 약화됨
    rationale: 원문의 'for after saying'은 성령의 증언이 뒤따르는 인용과 관련됨을 설명합니다. 초안의 '-는데'는 이 관계를 명시하지 않습니다.
  - severity: low
    issue: 원문에 없는 지시어 '이렇게'의 선행 배치
    rationale: 인용을 도입하는 한국어 표현으로 가능하지만, 원문의 압축된 '말씀하신 후에:'를 불필요하게 구체화합니다.
  revised_text: '성령께서도 우리에게 증언하십니다. 이는 말씀하신 후에 이렇게 말씀하셨기 때문입니다:'
  revised_footnotes:
  - marker: a
    text: 또는 “우리에게 증언을 해 주십니다.”
    reason: μαρτυρέω의 대안적 한국어 표현
  revision_rationale: δέ와 καί는 '성령께서도'로 자연스럽게 반영하고, μαρτυρεῖ는 현재형 '증언하십니다'로 옮겼습니다. γάρ 및 μετὰ τὸ εἰρηκέναι는 '이는 말씀하신 후에 … 때문입니다'로 처리하여 원문의 설명 관계와 시간적 순서를 드러냈습니다. '말씀하셨기'의 주어는 앞 절의 성령으로 자연스럽게 이해되며, 신학적 해석을 추가하지 않습니다.
