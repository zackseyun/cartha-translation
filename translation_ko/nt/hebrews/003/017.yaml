    issue: ‘죄를 범하여 시체가’가 ὧν의 관계절을 인과절로 바꿉니다.
    rationale: 원문은 ‘죄를 지은 자들, 그들의 몸이 광야에 쓰러진 이들’이라고 그들을 식별합니다. 인과 자체는 문맥상 함의될 수 있으나 이 절의 문법이 직접 표현하는 관계는 아닙니다.
