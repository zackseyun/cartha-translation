  source_fidelity: 원문의 수사 의문문과 ‘사십 년 동안’의 기간 표현은 초안이 잘 반영합니다. 그러나 ὧν(‘그들의’)은 앞선 ‘죄를 지은 자들’을 수식하는 소유격 관계절이므로, 초안의 ‘죄를 범하여 시체가’는 죄와 죽음 사이에 원문보다 직접적인 인과를 문법적으로 부여합니다. 이를 ‘그들의 몸이’로 고쳐 관계를 보존해야 합니다.
  naturalness: ‘노하셨습니까’는 현대 한국어의 격식 있는 성경 문체에 적절합니다. ‘시체가 … 쓰러진’보다 ‘그들의 몸이 광야에 쓰러진’이 κῶλα의 기본 의미와 한국어의 자연스러움을 함께 살립니다.
  terminology: ἁμαρτήσασιν은 ‘죄를 지은 자들’로 자연스럽고 충실하게 옮겼습니다. κῶλα는 여기서 죽은 이들의 몸을 가리키므로 본문에는 ‘몸’을 사용하고, 더 강한 의미를 드러내는 ‘시체’를 각주 대안으로 제시합니다. ‘광야’는 ἐρήμῳ의 성경적 배경에 잘 맞습니다.
  issues:
