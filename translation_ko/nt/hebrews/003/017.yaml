review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘사십 년 동안’, 죄를 지은 이들, 광야에서 쓰러진 몸이라는 핵심 의미를 대체로 전달합니다. 그러나 ‘죄를 범하여’는 죄와 죽음의 관계를 인과적으로 읽히게 할 수 있는데, 헬라어는 ‘죄를 지은 이들’과 ‘그들의 몸이 쓰러진 이들’을 관계절로 연결합니다. 또한 κῶλα는 여기서 단순히 ‘시체’라고 확정하기보다 ‘몸’으로 옮기고 대안을 주는 편이 원문의 어휘 범위를 더 잘 보존합니다.
  naturalness: ‘누구에게 노하셨습니까?’는 가능하지만, 둘째 질문을 ‘…자들이 아닙니까?’로만 끝내면 첫 질문의 ‘누구에게’와의 문법적 연결이 다소 압축됩니다. ‘…사람들에게 노하신 것이 아니었습니까?’로 풀면 현대 표준어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: ‘분노하셨습니까’는 προσώχθισεν의 문맥상 분노·격분의 뜻을 현대어로 분명히 전달합니다. ‘광야’는 이스라엘의 광야 배경을 적절히 보존합니다.
  issues:
  - severity: medium
    issue: ‘죄를 범하여’의 인과적 뉘앙스
    rationale: ἁμαρτήσασιν은 ‘죄를 지은 사람들’이라는 분사이며, 이어지는 ὧν 관계절은 그들의 몸이 광야에 쓰러졌음을 설명합니다. ‘-하여’는 한국어에서 원인이자 결과처럼 읽힐 수 있으므로 병렬적 관계절 표현이 더 충실합니다.
  - severity: low
    issue: ‘시체’가 κῶλα의 번역 범위를 다소 좁힘
    rationale: κῶλα는 본래 사지·몸의 부분을 뜻하며 이 문맥에서는 쓰러진 몸들/시신들을 가리킵니다. 본문은 ‘몸’으로 두고 ‘시체’라는 가능성을 각주로 제시하면 원문과 영어 감사 기록의 어휘적 대안을 함께 보존할 수 있습니다.
  revised_text: 또 사십 년 동안 누구에게 분노하셨습니까? 죄를 지은 사람들, 곧 그들의 몸이 광야에 쓰러진 사람들에게 노하신 것이 아니었습니까?
  revised_footnotes:
  - marker: a
    text: ‘몸’은 문맥상 ‘시체’로도 옮길 수 있습니다.
    reason: κῶλα의 어휘적 대안을 보존하며, 본문에서는 현대어로 자연스러운 ‘몸’을 유지합니다.
  revision_rationale: 둘째 수사 의문문을 명시적으로 완결하여 ‘누구에게’라는 첫 질문에 자연스럽게 답하게 했습니다. ‘죄를 범하여’를 ‘죄를 지은 사람들, 곧…’으로 바꾸어 원문의 분사와 관계절 구조를 보존하고 불필요한 인과 뉘앙스를 피했습니다. κῶλα는 본문에서 ‘몸’으로 번역하고, 문맥상 가능한 ‘시체’를 각주로 제시했습니다.
