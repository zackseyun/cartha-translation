  text: 그러나 메시아께서는 아들로서 그 집을 맡아 신실하셨습니다. 우리가 담대함과 소망에서 오는 자랑을 굳게 붙든다면, 그 집이 곧 우리입니다.
  philosophy: optimal-equivalence
