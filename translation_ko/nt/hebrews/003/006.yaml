review_pass:
  verdict: revise
  source_fidelity: 초안은 대조(그러나), 아들로서의 지위, 집의 비유, 조건절을 대체로 충실히 옮겼습니다. 다만 ‘끝까지’는 이 절의 그리스어 본문에 명시되지 않았으므로 삭제하는 것이 안전합니다. 또한 ‘아들로서 그분의 집을 다스리시는 분으로’는 ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ를 다소 장황하게 풀어낸 표현입니다.
  naturalness: ‘집을 맡으신 아들로서 신실하셨습니다’는 원문의 생략된 ‘신실하셨다’를 자연스럽게 보완하면서도, 현대 표준어 합쇼체로 간결합니다. 조건절을 앞에 두어 관계절의 의미도 자연스럽게 드러냅니다.
  terminology: Χριστός는 문맥상 칭호적 용법을 반영하여 ‘메시아’로 유지했습니다. παρρησία는 ‘담대함’, καύχημα τῆς ἐλπίδος는 원문의 다의성을 과도하게 해석하지 않는 ‘소망의 자랑’으로 옮겼습니다. ‘그분의 집’은 소유격 선행사의 해석상 여지를 유지합니다.
  issues:
  - severity: medium
    issue: ‘끝까지’가 추가되어 있습니다.
    rationale: κατάσχωμεν은 ‘굳게 붙들다/지키다’를 뜻하지만, 이 절에는 ‘끝까지’(μέχρι τέλους)가 없습니다. 원문에 없는 시간적 한정을 넣지 않는 편이 좋습니다.
  - severity: low
    issue: ‘그분의 집을 다스리시는 분으로’가 다소 우회적입니다.
    rationale: ἐπὶ τὸν οἶκον은 집 위에 맡겨진 권한을 나타내지만, ‘집을 맡으신 아들’이 원문의 비유와 문장 구조를 더 간결하고 자연스럽게 보존합니다.
  revised_text: 그러나 메시아께서는 그분의 집을 맡으신 아들로서 신실하셨습니다. 우리가 담대함과 소망의 자랑을 굳게 붙든다면, 우리는 그분의 집입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그리스도’. 그리스어 Χριστός는 ‘메시아’라는 칭호로도, 이름처럼 쓰이는 ‘그리스도’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘확신’. 그리스어 παρρησία는 거리낌 없는 말함, 공개성, 또는 확신에 찬 담대함을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘소망에서 오는 확신’ 또는 ‘소망의 기쁨’. 그리스어 καύχημα는 자랑, 자랑할 근거, 또는 기뻐하며 확신하는 태도를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 ‘끝까지’를 삭제하고, ἐπὶ τὸν οἶκον의 감독·책임의 의미를 ‘집을 맡으신’으로 자연스럽게 표현했습니다. 조건절의 신학적 긴장은 단순한 ‘~한다면’으로 보존했으며, 소유격의 지시 대상에 관한 모호성도 유지했습니다.
