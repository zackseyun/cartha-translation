  source_fidelity: 현 본문은 SBLGNT의 ἐν τῷ οἴκῳ αὐτοῦ를 넘어 ‘하나님의 온 집’으로 번역합니다. SBLGNT 본문에는 ‘온/모든’(πάντι/ὅλῳ)이 없고, αὐτοῦ도 본문에서는 ‘그의’로 남아 있습니다. 또한 현 각주는 본문에 없는 ‘그의 집’을 설명하여 앵커와 본문이 맞지 않습니다. ‘세우신’은 이 문맥에서 ποιήσαντι의 적절한 번역입니다.
