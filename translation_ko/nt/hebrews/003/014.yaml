    rationale: μέτοχοι τοῦ Χριστοῦ는 메시아와의 참여·공유 관계를 나타냅니다. 한국어 ‘메시아에 참여하다’는 통상 사람이 아니라 행사·활동 등을 대상으로 취하는 표현이어서, 원문의 관계와 자연스러운 용법을 모두 충분히 살리지 못합니다.
  revised_text: 우리가 처음의 확신을 끝까지 굳게 붙든다면, 우리는 메시아와 함께하는 이들이 된 것입니다.
