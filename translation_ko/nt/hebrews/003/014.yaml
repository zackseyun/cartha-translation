    reason: ὑπόστασις의 문맥상 가능한 의미 범위를 보존합니다.
  revision_rationale: 문장 구조와 조건의 긴장은 유지하되, ‘메시아에 참여하다’라는 비자연스러운 표현을 메시아와의 참여 관계를 자연스럽게 나타내는 ‘메시아와 함께하는 이들’로 수정했습니다. ‘된 것입니다’는 γεγόναμεν의 완료적 결과를 한국어에서 무리 없이 드러냅니다.
