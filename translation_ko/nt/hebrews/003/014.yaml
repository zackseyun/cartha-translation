  source_fidelity: 조건절의 내용과 완료 시제의 결과 상태는 대체로 반영되어 있습니다. 그러나 μέτοχοι τοῦ Χριστοῦ를 ‘메시아에 참여한 자들’이라고 하면 사람인 메시아를 참여의 대상으로 처리하여 한국어로는 부자연스럽고 원문의 관계를 흐립니다.
  naturalness: ‘처음의 확신을 끝까지 굳게 붙들기만 한다면’은 자연스럽습니다. 다만 ‘메시아에 참여한 자들’은 현대 표준 한국어에서 어색하므로 ‘메시아와 함께하는 이들’로 고치는 것이 자연스럽습니다.
  terminology: Χριστός는 이 문맥에서 칭호로 쓰였으므로 ‘메시아’를 유지합니다. μέτοχοι는 특정 교리적 함의를 덧붙이지 않고 ‘메시아와 함께하는 이들’로 옮깁니다. ὑπόστασις는 문맥상 ‘확신’으로 옮기되, 다른 가능한 의미는 주석으로 보존합니다.
  issues:
