  to: 이분께서는 모세보다 더 큰 영광을 받기에 합당하다고 여겨지셨습니다. 이는 집을 지은 사람이 그 집보다 더 큰 존귀를 받는 것과 같기 때문입니다.
  rationale: The revision retains the source’s passive perfect claim and comparative imagery while improving formal Korean syntax. ‘이는 … 때문입니다’ represents the explanatory γάρ, and ‘것과 같기 때문입니다’ preserves the comparison without specifying an interpretation beyond the text.
