  source_fidelity: 첫 절의 ‘들었으면서도’는 ἀκούσαντες의 단순한 선행·시간 관계를 양보 관계(‘들었는데도’)로 강화합니다. ‘듣고’가 원문의 관계를 더 정확히 보존합니다. παραπικραίνω는 이 문맥에서 하나님을 거역하여 노하게 한 행위를 가리키므로 ‘반역한’은 적절합니다. δεύτε 번째 수사 의문문은 ‘모두’와 ‘아니었습니까?’로 보존됩니다.
  naturalness: ‘듣고 반역한 자들이 누구입니까?’와 ‘모세를 통하여 이집트에서 나온 모든 사람들이 아니었습니까?’는 현대 표준 한국어 합쇼체로 자연스럽고, 수사적 질문의 흐름도 분명합니다.
  terminology: ‘반역하다’는 광야 세대의 하나님에 대한 반항이라는 문맥적 의미를 잘 전달합니다. ‘모세를 통하여’는 διά + 속격의 매개·수단 표현을 과도한 해설 없이 유지합니다. 원문의 더 직역적인 어휘 가능성은 각주로 제시합니다.
