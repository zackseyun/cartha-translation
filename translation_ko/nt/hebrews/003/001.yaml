  source_fidelity: ‘그러므로’, ‘거룩한 형제들이여’, ‘하늘의 부르심에 함께 참여한’, ‘예수’, ‘사도’, ‘대제사장’은 대체로 원문을 충실히 반영합니다. 그러나 ‘우리가 고백하는 사도이시며 대제사장이신’은 예수께서 사도와 대제사장이심을 우리가 고백한다는 해석을 본문에 확정합니다. 헬라어의 자연스러운 연결은 ‘우리의 고백의 사도와 대제사장’이며, 영어 감사 기록도 이를 본문 번역으로 채택하고 다른 연결을 대안으로 처리합니다.
  naturalness: ‘우리의 고백의 사도’는 한국어에서 다소 격식적이지만, ‘우리의 고백에 속한 사도이시며 대제사장이신’으로 옮기면 현대 표준어 합쇼체 안에서 의미 관계를 비교적 자연스럽게 보존할 수 있습니다. ‘깊이 생각하십시오’는 κατανοήσατε의 주의 깊은 숙고의 명령에 잘 맞습니다.
  terminology: ‘대제사장’과 ‘사도’는 히브리서의 핵심 용어를 적절히 유지합니다. ‘형제들’은 원문의 남성 복수 호격을 보존하되, 수신 공동체 전체를 가리키는 용법을 주석으로 밝혀야 합니다. ‘하늘의 부르심’은 κλήσεως ἐπουρανίου에 적절합니다.
