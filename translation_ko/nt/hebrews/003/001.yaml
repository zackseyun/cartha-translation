    text: 여기서 “형제들”은 여성들을 포함한 믿는 공동체 전체를 부르는 말입니다.
    reason: cultural_note
  - marker: b
    text: 또는 “하늘의 부르심에 참여하는 이들.”
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “우리의 고백의 사도이시며 대제사장이신 예수.”
    reason: lexical_alternative
