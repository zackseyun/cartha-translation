  naturalness: 초안은 인용문 뒤에 ‘라고 하신 것과 같습니다’를 두어 한국어 문장 흐름이 다소 역전되어 있습니다. 인용 도입을 먼저 두고 인용문을 제시하면 현대 표준 한국어 합쇼체에서 더 자연스럽습니다. ‘반차’는 전통적이지만 현대 일반 독자에게 불투명할 수 있으므로 본문은 ‘계열’로 하고 전통 번역어는 각주에서 제시합니다.
  terminology: ἱερεύς는 ‘제사장’, Μελχισέδεκ은 ‘멜기세덱’으로 적절합니다. κατὰ τὴν τάξιν은 여기서 제사장적 범주·계열을 뜻하므로 ‘멜기세덱의 계열을 따라’가 자연스럽고 문맥에 맞습니다. ‘반차’는 유효한 전통적 대안으로 각주에 남깁니다.
  issues:
