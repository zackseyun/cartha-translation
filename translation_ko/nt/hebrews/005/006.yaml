  source_fidelity: 원문의 καθὼς καὶ(‘…와 같이/또한’)와 ἐν ἑτέρῳ(‘또 다른 곳에서’) 및 현재형 λέγει를 고려할 때, 인용을 도입하는 문구는 유지되어야 합니다. 초안은 기본 의미를 전달하지만, ‘말씀하시기를 …라고 하신 것과 같습니다’는 인용 도입 표현이 중복되어 문장 구조가 부자연스럽습니다. ‘반차’는 τάξις의 전통적 역어이지만 현대 표준어에서는 다소 고어적이므로, 의미를 보존하면서 현대적인 ‘계열’로 옮기는 것이 안전합니다.
  naturalness: ‘또 다른 곳에서도 말씀하신 바와 같이’는 성경 인용을 도입하는 자연스러운 현대 문어 표현입니다. ‘영원히 제사장이다’는 εἰς τὸν αἰῶνα가 제사장직의 지속을 수식함을 한국어에서 더 직접적으로 드러냅니다.
  terminology: 멜기세덱은 통용 표기입니다. τάξις는 여기서 단순한 시간적 ‘순서’가 아니라 제사장직의 분류·질서를 가리키므로 ‘계열’이 현대어로 적절합니다. 각주에서는 교파적 전통의 채택을 주장하지 않고, 가능한 대안을 간결하게 제시합니다.
  issues:
  - severity: medium
    issue: 인용 도입 구문의 중복
    rationale: ‘말씀하시기를’ 뒤에 인용을 놓고 다시 ‘…라고 하신 것과 같습니다’라고 하면 동일한 발화 행위를 이중으로 표시하여 한국어 문장이 어색합니다.
  - severity: low
    issue: ‘반차’의 현대어 자연성 및 각주 표현
    rationale: ‘반차’는 전통 성경어로 이해될 수 있으나 현대 표준어에서는 드문 말입니다. 또한 각주의 ‘한국 교회 전통의 …를 채택한다’는 번역 근거를 넘어 특정 전통을 우선하는 인상을 줄 수 있습니다.
  revised_text: 또 다른 곳에서도 말씀하신 바와 같이, 「너는 멜기세덱의 계열을 따라 영원히 제사장이다」[a]
