    issue: 인용 도입과 인용문의 어순
    rationale: ‘또 다른 곳에서도 말씀하시기를’은 인용문 앞에 와야 λέγει의 현재적 인용 도입과 한국어 문장 구조가 자연스럽게 드러납니다.
  - severity: low
    issue: ‘영원한 제사장’의 의미 범위
