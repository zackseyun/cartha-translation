  - severity: low
    issue: ‘반차’의 현대성
    rationale: 전통 번역어로 널리 알려져 있으나 현대 표준어 독자에게는 설명 없이 뜻이 불투명할 수 있습니다. 본문에서는 ‘계열’을 쓰고 각주로 대안을 제공하는 것이 적절합니다.
  revised_text: 또 다른 곳에서도 말씀하시기를, “너는 멜기세덱의 계열을 따라 영원히 제사장이다.”라고 하신 것과 같습니다.
