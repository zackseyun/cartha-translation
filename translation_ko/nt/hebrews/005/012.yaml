  text: 사실 여러분은 이쯤 되면 교사가 되어 있어야 하는데, 다시 누군가가 여러분에게 하나님의 말씀[a]의 초보적인 기본 요소들을 가르쳐 주어야 할 처지가 되었습니다. 여러분은 단단한 음식이 아니라 젖을 필요로 하게 되었습니다.
  philosophy: optimal-equivalence
