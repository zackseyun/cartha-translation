review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the general priestly representation, appointment, and offerings for sins. However, "하나님 앞의 일을 맡도록" adds the notion of being entrusted with a task and shifts τὰ πρὸς τὸν θεόν from matters pertaining to God to work done before God. The purpose clause is also better rendered directly as purpose.
  naturalness: The proposed revision uses natural modern formal-polite Korean and more idiomatically expresses the passive appointment and purpose relationship.
  terminology: '"대제사장," "예물," and "제사" are established and appropriate terms. "하나님께 속한 일" closely represents the Greek idiom τὰ πρὸς τὸν θεόν without unnecessary interpretive expansion.'
  issues:
  - severity: medium
    issue: '"하나님 앞의 일을 맡도록" is not a precise rendering of τὰ πρὸς τὸν θεόν and καθίσταται.'
    rationale: The Greek states that the high priest is appointed in matters pertaining to God; it does not specifically say that he is entrusted with work 'before God.'
  - severity: low
    issue: '"이는 그가 ... 드리도록 함입니다" is awkward and weakly expresses the ἵνα purpose clause.'
    rationale: '"... 드리게 하려는 것입니다" is clear formal-polite Korean and directly conveys purpose.'
  revised_text: 모든 대제사장은 사람들 가운데서 택함을 받아 사람들을 위하여 하나님께 속한 일에 세움을 받습니다. 이는 그가 죄들을 위하여 예물과 제사를 드리게 하려는 것입니다.
