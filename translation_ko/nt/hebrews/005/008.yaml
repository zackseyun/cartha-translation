  terminology: ‘아들’은 문맥상의 그리스도론적 지시를 충실하게 유지하며, 한국어에서는 별도의 관사나 대문자로 한정성을 표시할 필요가 없습니다. ‘순종’은 ὑπακοή의 적절한 표준 번역입니다.
  issues:
