    issue: ἐγηγερμένον의 수동태가 ‘다시 살아나신’에서 능동태로 바뀜
    rationale: 그리스어는 완료 수동 분사이므로, 번역도 가능한 한 ‘일으켜지신’처럼 수동성을 보존해야 합니다.
  - severity: low
    issue: τοῖς ἕνδεκα를 ‘열한 제자’로 특정함
    rationale: 문맥상 제자 그룹을 가리키지만, 원문은 단지 ‘열한 사람’이라고 하므로 불필요한 명사 보충을 피하는 것이 좋습니다.
  - severity: low
    issue: 식사 자세 표현의 현대 한국어 어색함
    rationale: ‘비스듬히 누워’보다 ‘기대어 앉아’가 식사 중 기대어 있는 고대 관습을 자연스럽게 전달합니다.
  revised_text: '[부록 ─ 긴 끝맺음:] 후에[a] 열한 사람이 식사 자리에 기대어 앉아[b] 있을 때, 그분께서 그들에게 나타나셔서 그들의 믿지 않음과 완고한 마음을 꾸짖으셨습니다. 이는 그분께서 일으켜지신 것을 본 사람들을 그들이 믿지 않았기 때문입니다[c].'
  revised_footnotes:
