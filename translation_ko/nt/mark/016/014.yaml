review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘다시 살아나신’은 ἐγηγερμένον의 완료 수동형을 능동적으로 바꾸므로, 수동성을 보존해야 합니다. 또한 τοῖς ἕνδεκα는 본문 자체에서 ‘제자’라고 명시하지 않으므로 ‘열한 사람’으로 옮기는 편이 더 직접적입니다.
  naturalness: ‘식사 자리에 비스듬히 누워’는 현대 한국어에서 다소 어색합니다. 식사 관습을 드러내는 ‘식사 자리에 기대어 앉아’가 자연스럽고 의미도 충분히 전달합니다. ‘믿음 없음’은 ‘믿지 않음’으로 다듬었습니다.
  terminology: σκληροκαρδία는 성경적 비유를 살려 ‘완고한 마음’으로, ὠνείδισεν은 합쇼체에 맞춰 ‘꾸짖으셨습니다’로 옮겼습니다. 부활 표현은 ‘일으켜지신’으로 수동태를 유지하며, 각주에서 그 의미를 명확히 했습니다.
  issues:
