review_pass:
  verdict: revise
  source_fidelity: 초안은 시간 부사, 열한 사람에게 나타나신 일, 불신과 완고함에 대한 책망, 그리고 목격자들의 증언을 믿지 않은 이유를 대체로 충실히 옮깁니다. 그러나 ἐγηγερμένον은 완료 수동 분사인데, ‘그분께서 다시 살아나신 후’는 능동적으로 바꾸고 ‘다시’도 원문에 없는 뜻을 더합니다. 또한 τοῖς ἕνδεκα는 본문상 ‘열한 제자’가 아니라 ‘열한 사람/열한 명’이며, ‘그분을 본 자들의 말’은 원문의 ‘그분을 본 이들’을 다소 풀어쓴 표현입니다.
  naturalness: ‘식사 자리에 비스듬히 누워’는 이해되지만 현대 한국어에서는 다소 어색합니다. 당시 식사 자세를 나타내는 ‘식탁에 기대어 앉아’가 자연스럽고, 필요한 문화적 뉘앙스는 주석으로 보완할 수 있습니다. ‘믿음 없음’보다 ‘불신’이 현대적이고 문맥에 맞습니다.
  terminology: ‘마음의 완고함’은 σκληροκαρδία의 비유적 표현을 적절히 보존합니다. 부활 표현은 수동형을 가능한 한 반영하여 ‘일으켜지신 후’로 옮기고, 독자가 그 의미를 분명히 알 수 있도록 주석을 둡니다. 긴 끝맺음이라는 표제에는 본문 전승상의 상태를 알리는 주석이 필요합니다.
  issues:
  - severity: medium
    issue: ἐγηγερμένον의 수동태 및 ‘다시’의 첨가
    rationale: ‘그분께서 다시 살아나신 후’는 완료 수동 분사를 능동으로 전환하고 원문에 없는 ‘다시’를 보탭니다. ‘일으켜지신 후’로 수동형을 보존하는 편이 원문에 더 가깝습니다.
  - severity: low
    issue: τοῖς ἕνδεκα를 ‘열한 제자’로 번역
    rationale: 문맥상 사도 집단을 가리키지만, 헬라어는 명시적으로 ‘제자’라고 하지 않고 ‘열한 사람’이라고 합니다.
  - severity: low
    issue: ἀνακειμένοις의 현대 한국어 표현
    rationale: ‘식사 자리에 비스듬히 누워’보다 ‘식탁에 기대어 앉아’가 자연스럽고, 고대 식사 자세는 주석에서 설명할 수 있습니다.
  - severity: medium
    issue: 긴 끝맺음 표제의 전승 정보 미제공
    rationale: 마가복음의 긴 끝맺음은 중요한 본문 전승 문제이므로, 본문에 표제를 둘 경우 주요 초기 사본에 없다는 정보를 중립적으로 밝혀야 합니다.
  revised_text: '[긴 끝맺음]¹ 그 후 열한 사람이 식탁에 기대어 앉아 있을 때에, 예수께서 그들에게 나타나셔서 그들의 불신과 마음의 완고함을 꾸짖으셨습니다. 이는 그분께서 일으켜지신 후 그분을 본 이들을 그들이 믿지 않았기 때문입니다.'
  revised_footnotes:
  - marker: '1'
    text: 마가복음 16:9–20의 긴 끝맺음은 많은 후대 사본에는 들어 있으나, 몇몇 중요한 초기 사본에는 없습니다.
    reason: textual_note
  - marker: '2'
    text: ‘식탁에 기대어 앉아’는 당시 식사할 때의 기대어 눕는 자세를 가리킵니다.
    reason: cultural_note
  - marker: '3'
    text: 또는 ‘그분께서 살아나신 것을 본 이들’. 헬라어는 문자적으로 ‘일으켜지신 그분을 본 이들’이라고 하며, 완료 수동 분사를 사용합니다.
    reason: lexical_alternative
  revision_rationale: 수동형 부활 표현을 보존하고, 원문에 없는 ‘다시’와 ‘제자’를 제거했습니다. 식사 자세는 현대 한국어에 맞게 다듬었으며, 긴 끝맺음의 본문 전승 상태와 관련 문화·어휘 정보를 중립적 주석으로 제시했습니다.
