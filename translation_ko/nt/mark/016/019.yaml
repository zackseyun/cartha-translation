  terminology: κύριος Ἰησοῦς는 ‘주 예수께서’로, θεός는 ‘하나님’으로 유지했습니다. ‘하나님의 오른편’은 ἐκ δεξιῶν τοῦ θεοῦ의 확립된 성경 관용구를 현대적으로 옮긴 것입니다.
