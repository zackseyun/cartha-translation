review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 βεβαιοῦντος는 주께서 말씀을 확증하셨다는 뜻이며, 현행의 ‘확증해 주셨습니다’는 원문에 없는 수혜의 뉘앙스를 더합니다. ἐπακολουθούντων은 ‘따르는/뒤따르는’로 두어, 표적이 무엇을 직접 따르는지 원문보다 더 명시하지 않는 것이 적절합니다.
  naturalness: ‘그들이 나가’보다 ‘그들은 나가서’가 현대 표준 한국어 문장 흐름에 더 자연스럽습니다. ‘주께서는’은 대조가 아니라 문장 주제 전환을 매끄럽게 표시합니다.
  terminology: ‘주’, ‘말씀’, ‘표적’, ‘전파하다’, ‘확증하다’는 본문의 의미와 현대적 격식체에 잘 맞습니다. ‘표적’은 σημεῖα의 성경적 용례를 자연스럽게 보존합니다.
  issues:
  - severity: low
    issue: ‘확증해 주셨습니다’의 수혜 표현
    rationale: βεβαιοῦντος는 ‘확증하다’이며, ‘-해 주다’는 원문에 명시되지 않은 수혜·호의의 뉘앙스를 덧붙입니다.
  - severity: low
    issue: ‘그들이 나가’의 문체
    rationale: 의미상 문제는 없으나, 합쇼체 서술에서는 ‘그들은 나가서’가 더 자연스럽고 매끄럽습니다.
  revised_text: '[긴 끝맺음:] 그들은 나가서 어디에서나 전파하였고, 주께서는 그들과 함께 일하시며 따르는 표적들을 통하여 말씀을 확증하셨습니다.'
