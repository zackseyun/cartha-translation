  source_fidelity: 핵심 의미는 대체로 맞지만, πιστεύσασιν의 완료된 믿음의 뉘앙스는 '믿는 자들'보다 '믿은 사람들'이 더 잘 반영합니다. γλώσσαις는 복수이나 한국어에서는 일반적 용법으로 단수 '새 방언으로'가 자연스러우며, 그 의미가 언어인지 방언인지 단정하지 않도록 각주를 둡니다.
