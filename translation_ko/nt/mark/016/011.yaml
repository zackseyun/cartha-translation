    rationale: 한국어 ‘보이시다’는 ‘나타나시다’로 이해될 수 있어, 단순히 그 여인이 그분을 보았다는 수동문의 관점을 다소 바꿀 수 있습니다.
  revised_text: 그들은 그분께서 살아 계시고 그 여자가 그분을 보았다는 말을 듣고도 믿지 않았습니다.
