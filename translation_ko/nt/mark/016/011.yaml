  source_fidelity: ‘그러나’는 κἀκεῖνοι의 연결적 καί보다 강한 역접을 더하므로 피하는 것이 좋습니다. ζῇ는 ‘살아 계시며’로, ἐθεάθη ὑπ’ αὐτῆς는 수동적 관점을 살린 ‘그 여인에게 보이셨다는’으로 옮길 수 있습니다. ‘듣고도’는 뒤의 불신과의 대조를 자연스럽게 드러냅니다.
  naturalness: ‘그 여자’보다 ‘그 여인’이 현대 표준어의 공적·성경 문맥에서 더 자연스럽고 존중하는 표현입니다. 문장 전체는 합쇼체로 매끄럽게 다듬었습니다.
  terminology: 예수에 대한 높임 표현 ‘그분’과 부활 이후의 생명을 나타내는 ‘살아 계시다’를 유지했습니다. 본문 자체가 제공하는 대명사 지시를 넘어서 ‘막달라 마리아’라는 이름을 보충하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘그러나’가 원문의 연결 표현보다 강한 역접을 도입합니다.
    rationale: κἀκεῖνοι(καὶ ἐκεῖνοι)는 앞선 서술을 이어 주는 ‘그리고/그들은’의 기능이며, 명시적 역접 접속사는 아닙니다.
  - severity: low
    issue: ‘그 여자’의 문체 수준
    rationale: 여성을 가리키는 데 문법상 틀리지는 않지만, 현대 공적 성경 문체에서는 ‘그 여인’이 더 자연스럽고 적절합니다.
  - severity: low
    issue: 부록 표제를 본문 문장에 포함함
    rationale: ‘[부록 ─ 긴 끝맺음:]’은 헬라어 절의 일부가 아닌 편집 표제입니다. 본문 번역은 절의 내용만 제시하고, 긴 끝맺음에 관한 본문비평 정보는 별도 주석으로 처리하는 편이 적절합니다.
  revised_text: 그들은 그분이 살아 계시며 그 여인에게 보이셨다는 말을 듣고도 믿지 않았습니다.
  revised_footnotes: []
  revision_rationale: 원문의 연결적 시작, 현재형 ‘살아 계시다’, 그리고 여인이 예수를 보았다는 수동 표현을 보존하면서 현대 표준어 합쇼체로 다듬었습니다. 원문 절에 없는 부록 표제와 불필요한 역접은 제거했습니다.
