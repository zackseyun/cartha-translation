  source_fidelity: 본문의 핵심 의미는 대체로 전달하지만, 원문에 없는 '[부록 ─ 긴 끝맺음:]'라는 표지가 본문에 포함되어 있습니다. 또한 ἐθεάθη ὑπ’ αὐτῆς는 ‘그 여자가 그분을 보았다’로 옮기면 현대 한국어에서 더 자연스럽게 ‘그 여인에 의해 보였다’는 뜻을 전달합니다.
