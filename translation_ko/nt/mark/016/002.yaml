  verdict: revise
  source_fidelity: The draft accurately conveys the day, early time, destination, and the temporal circumstance of the risen sun. However, it changes Mark's historical present ἔρχονται ('they come') to a past-tense Korean verb ('갔습니다').
  naturalness: ‘한 주의 첫날 매우 이른 아침’ is understandable, but adding the time particle and ordering it as ‘한 주의 첫날 매우 이른 아침에’ is more natural in modern formal Korean. ‘해가 떠올랐을 때’ naturally renders the temporal genitive absolute.
  terminology: ‘무덤’ is appropriate for μνημεῖον in this context. ‘한 주의 첫날’ clearly communicates the idiomatic sense of τῇ μιᾷ τῶν σαββάτων without importing an interpretation.
  issues:
  - severity: medium
    issue: Historical present is not retained.
    rationale: ἔρχονται is present tense, a Markan historical present. ‘갔습니다’ shifts it to a past event; ‘옵니다’ preserves the source tense in a natural Korean narrative register.
  revised_text: 그리고 한 주의 첫날 매우 이른 아침에, 해가 떠올랐을 때 그들은 무덤으로 옵니다.
