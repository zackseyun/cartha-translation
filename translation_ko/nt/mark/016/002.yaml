base_translation:
  language: en
  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
  footnotes:
  - marker: a
    text: Greek literally, 'on the first of the Sabbaths,' an idiom meaning 'on the first day of the week.'
    reason: lexical_alternative
  - marker: b
    text: Mark uses the historical present 'they come,' where many English translations use the past tense 'they came.'
    reason: lexical_alternative
  - marker: c
    text: Or 'when the sun had risen'; the Greek is a genitive absolute indicating the time of their arrival.
    reason: lexical_alternative
translation:
