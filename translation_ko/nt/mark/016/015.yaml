review_pass:
  verdict: revise
  source_fidelity: 본문은 καὶ εἶπεν αὐτοῖς, Πορευθέντες, εἰς τὸν κόσμον ἅπαντα, κηρύξατε, τὸ εὐαγγέλιον, πάσῃ τῇ κτίσει의 순서와 보편적 범위를 충실히 옮겨야 합니다. ‘온 세상에 가서’는 선행 부정과거 분사의 명령적 수반 상황 용법을 자연스럽게 반영하며, ‘복음을 선포하십시오’는 κηρύξατε의 공적 선포 의미를 보존합니다. ‘모든 피조물에게’는 πάσῃ τῇ κτίσει의 넓고 다소 논쟁적인 범위를 유지합니다.
  naturalness: ‘온 세상에 가서 모든 피조물에게 복음을 선포하십시오’는 현대 표준어 합쇼체로 자연스럽고, 명령의 어조도 적절합니다. 원안은 닫는 인용부호가 없어 문장 구조상 불완전합니다.
  terminology: εὐαγγέλιον은 한국어 성경 용례와 현대 독자의 이해를 고려해 ‘복음’으로 번역하고, 각주에서 ‘좋은 소식’이라는 어휘적 대안을 제시합니다. κτίσις는 사람으로 한정하지 않고 ‘피조물’로 두며, ‘온 창조 세계’라는 집합적 대안을 각주로 보존합니다.
  issues:
  - severity: medium
    issue: 인용문이 닫히지 않았습니다.
    rationale: 원안의 마지막 인용부호가 누락되어 구조적으로 완결된 본문이 아닙니다.
  - severity: low
    issue: ‘전하십시오’는 κηρύξατε의 선포·전령적 뉘앙스를 충분히 드러내지 못할 수 있습니다.
    rationale: ‘선포하십시오’가 공적으로 알리는 명령의 성격을 더 직접적으로 반영합니다.
  revised_text: '[긴 끝맺음:] 그리고 그분께서 그들에게 말씀하셨습니다. “온 세상에 가서 모든 피조물에게 복음을 선포하십시오.”'
  revised_footnotes:
  - marker: a
    text: 또는 “온 창조 세계에.” 그리스어 πάσῃ τῇ κτίσει는 집합적으로 ‘모든 창조 세계’를, 분배적으로 ‘모든 피조물’을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘복음’은 그리스어 εὐαγγέλιον의 전통적 번역이며, 문자적으로는 ‘좋은 소식’입니다.
    reason: lexical_alternative
  revision_rationale: 누락된 닫는 인용부호를 보완하고, κηρύσσω의 의미를 더 정확히 반영하도록 ‘전하십시오’를 ‘선포하십시오’로 조정했습니다. κτίσις의 집합적·분배적 가능성은 본문에서 한쪽으로 좁히지 않고 각주에 보존했습니다. 원안의 ‘긴 끝맺음’ 표지는 본문 전승에 관한 독자를 위한 표지로 유지했습니다.
