base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
  footnotes:
  - marker: a
    text: Or “to every creature.” The Greek phrase can be rendered either distributively or corporately.
    reason: alternative_reading
  - marker: b
    text: Or “the gospel.” Greek εὐαγγέλιον literally means “good news.”
    reason: lexical_alternative
translation:
  language: ko
  text: 〔긴 끝맺음〕[a] 그분께서 그들에게 말씀하셨습니다. “온 세상으로 가서 모든 피조물에게 복음을 선포하십시오.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마가복음 16:9–20은 일부 초기 그리스어 사본에는 없으며, 다른 고대 사본들과 교회 전통에는 포함되어 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 “좋은 소식”. 그리스어 εὐαγγέλιον은 문자적으로 “좋은 소식”을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “모든 창조물에게”. 그리스어 표현은 모든 피조물을 각각 가리킬 수도, 창조 세계 전체를 가리킬 수도 있습니다.
    reason: alternative_reading
