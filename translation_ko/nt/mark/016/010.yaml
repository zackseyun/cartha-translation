  source_fidelity: 원문의 ἐκείνη는 앞 절의 막달라 마리아를 가리키므로 ‘그 여자는’이 자연스럽습니다. πορευθεῖσα ἀπήγγειλεν은 ‘가서 ... 전했습니다’로 옮길 수 있습니다. τοῖς μετ’ αὐτοῦ γενομένοις는 ‘그분과 함께 있었던 이들에게’가 적절하며, 현재분사 πενθοῦσι καὶ κλαίουσιν은 그들이 당시 ‘슬퍼하며 울고 있던’ 상태를 나타냅니다.
  naturalness: 초안의 ‘그분과 함께 있다가’는 시간적으로 잠시 함께 있다가 떠난 듯한 의미를 낼 수 있고, 뒤의 현재 상태 수식과도 연결이 약합니다. ‘그분과 함께 있었던 이들에게, 곧 슬퍼하며 울고 있던 이들에게’는 현대 한국어 문장으로 명료합니다.
  terminology: ‘그분’은 예수님을 가리키는 존중 표현으로 문맥상 무리가 없습니다. 원문에 없는 ‘[부록 ─ 긴 끝맺음:]’은 본문 번역에 포함하지 않았습니다. 이 절이 속한 긴 끝맺음의 본문비평적 문제는 절 자체의 번역문에 덧붙일 내용이 아니며, 필요하면 단락 또는 본문 주석에서 다루어야 합니다.
