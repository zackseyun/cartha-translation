  verdict: revise
  source_fidelity: 본문 번역은 대체로 헬라어를 충실히 옮기지만, ἔκστασις는 이 문맥에서 단순한 ‘놀라움’보다 충격과 당혹을 포함하는 ‘경악’이 더 적절합니다. 또한 ἐξελθοῦσαι와 ἔφυγον의 순서를 ‘무덤에서 나와 달아났습니다’로 자연스럽고 분명하게 드러낼 수 있습니다.
  naturalness: ‘그들이 나가 무덤에서 도망쳤습니다’는 무엇으로부터 나갔는지가 잠시 불분명하고 ‘도망치다’는 다소 부자연스럽습니다. ‘무덤에서 나와 달아났습니다’가 현대 표준 한국어 합쇼체에 더 자연스럽습니다. 마지막 이유절은 짧게 두어 원문의 급작스러운 종결감을 어느 정도 보존했습니다.
  terminology: ‘무덤’, ‘떨림’, ‘두려워하고 있었습니다’는 적절합니다. ἔκστασις는 ‘경악’으로 조정했습니다. 현 각주는 SBLGNT 이중 대괄호에 제시된 짧은 끝맺음 자체를 제시하지 않고, 긴 끝맺음까지 단정적으로 ‘후대 첨가’라고 확대하여 이 절의 원문 및 영어 POB 감사 기록의 각주 범위를 벗어납니다.
  issues:
