    issue: 본문의 ‘나가 무덤에서 도망쳤습니다’는 동작의 출발점과 순서가 다소 불명확합니다.
    rationale: ἐξελθοῦσαι는 여성 복수 분사로, 무덤에서 나온 뒤 ἔφυγον(달아났다)이 이어집니다. ‘무덤에서 나와 달아났습니다’가 이를 분명하고 자연스럽게 전달합니다.
  - severity: low
    issue: ‘놀라움’은 ἔκστασις의 충격·경악의 뉘앙스를 약화할 수 있습니다.
    rationale: 이 문맥의 ἔκστασις는 기쁨의 놀라움이라기보다 정신을 압도하는 충격과 당혹을 가리키므로 ‘경악’이 더 알맞습니다.
  - severity: high
    issue: 각주가 원문에 이중 대괄호로 제시된 짧은 끝맺음의 내용을 제공하지 않으며, 긴 끝맺음(16:9–20)에 관한 광범위하고 단정적인 진술을 포함합니다.
    rationale: 이 절의 SBLGNT 원문과 영어 POB 감사 기록은 짧은 끝맺음을 본문 밖의 사본 이문으로 보존하도록 요구합니다. 각주는 그 이문을 번역하여 제시하고, 이 절의 범위를 넘어서는 판단은 피해야 합니다.
