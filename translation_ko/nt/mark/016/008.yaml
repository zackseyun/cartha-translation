- from: 그리고 그들이 나가 무덤에서 도망쳤습니다. 이는 떨림과 놀라움이 그들을 사로잡았기 때문입니다. 그리고 그들은 누구에게도 아무 말도 하지 않았으니, 이는 그들이 두려워했기 때문입니다.[a]
  to: 그들은 무덤에서 나와 달아났습니다. 떨림과 경악이 그들을 사로잡았기 때문입니다. 그들은 아무에게도 아무 말도 하지 않았습니다. 그들이 두려워하고 있었기 때문입니다.[a]
  rationale: 본문은 16:8의 SBLGNT 본문만 번역하고, 이중 대괄호 안의 짧은 끝맺음은 사본 이문 각주로 옮겼습니다. 번역은 여성 복수 분사와 주동사의 순서를 한국어로 명료하게 반영하고, ἔκστασις의 문맥상 의미를 ‘경악’으로 조정했습니다. 긴 끝맺음에 대한 별도 본문비평 판단은 이 절의 주석 범위를 넘어가므로 제거했습니다.
