  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
  footnotes:
  - marker: a
    text: Some early manuscripts do not include Mark 16:9–20; this verse belongs to the longer ending of Mark.
    reason: textual_variant
  - marker: b
    text: Or 'serpents.'
    reason: lexical_alternative
  - marker: c
    text: Or 'any deadly thing'; the phrase is broad and not limited strictly to poison.
    reason: lexical_alternative
  - marker: d
    text: Literally, 'they will be well.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 뱀을 집어 들 것이며, 치명적인 어떤 것을 마셔도 결코 해를 입지 않을 것입니다. 또 병든 사람들에게 손을 얹을 것이며, 그들은 나을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
