review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 ἀπελθόντες의 떠남/출발의 뉘앙스를 ‘가서’보다 분명히 드러내고, τοῖς λοιποῖς는 문맥상 ‘나머지 사람들’보다 ‘남은 이들’로 옮기는 편이 더 절제되고 정확합니다. οὐδὲ는 ‘그들도’와 부정문으로 자연스럽게 보존됩니다.
  naturalness: 합쇼체는 적절합니다. 그러나 ‘[부록 ─ 긴 끝맺음:]’은 본문에 속하지 않는 편집적 규정처럼 들리고 ‘긴 끝맺음’도 통상적인 본문비평 표제로는 다소 어색합니다. ‘[긴 결말:]’이 간결하고 자연스럽습니다.
  terminology: ‘믿지 않았습니다’는 이 문맥의 ἐπίστευσαν, 곧 전해진 증언을 받아들이지 않았다는 뜻을 적절히 전달합니다. 특정 교리적 의미를 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: 편집 표제 ‘[부록 ─ 긴 끝맺음:]’
    rationale: SBLGNT 본문에는 이 표제가 없으며, ‘부록’은 긴 결말의 본문적 지위를 필요 이상으로 규정할 수 있습니다. 이 단락의 논쟁적 전승 상태는 보존하되 중립적인 표제가 적절합니다.
  - severity: low
    issue: ‘가서’와 ‘나머지 사람들’
    rationale: ἀπελθόντες는 떠나간 뒤 보고했다는 흐름이며, λοιποί는 특정되지 않은 ‘남은 이들’을 가리킵니다. ‘떠나가서’, ‘남은 이들’이 원문의 표현 범위를 더 잘 유지합니다.
  revised_text: '[긴 결말:] 그리고 그들은 떠나가서 남은 이들에게 알렸지만, 그들도 그들을 믿지 않았습니다.'
