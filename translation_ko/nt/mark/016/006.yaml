base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
  footnotes:
  - marker: a
    text: Or, “the Nazorean” or “of Nazareth.” The Greek uses a designation derived from Nazareth.
    reason: lexical_alternative
  - marker: b
    text: 'Or, “He is risen” or “He has risen.” The Greek verb is passive: “He has been raised.”'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그가 그들에게 말합니다. “놀라지 마십시오. 여러분은 십자가에 못 박히신 나사렛 사람[a] 예수를 찾고 있습니다. 그분은 일으켜지셨습니다[b]. 그분은 여기 계시지 않습니다. 보십시오. 그들이 그분을 두었던 곳입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나사렛 출신” 또는 “나사렛인”. 그리스어는 나사렛에서 파생된 호칭을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분은 살아나셨습니다” 또는 “그분은 부활하셨습니다”. 그리스어 동사는 수동태이며, 직역하면 “그분은 일으켜지셨습니다”입니다.
    reason: alternative_reading
