source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: ko
  text: 어느 곳이든 여러분을 받아들이지 않고 여러분의 말을 듣지 않으면, 그곳을 떠날 때 여러분의 발 아래에 있는 먼지를 털어 버리십시오. 그것이 그들에게[a] 증거가 되도록 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들에게 증거로”입니다. 문맥상 그들을 거스르는 증거라는 뜻으로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 발의 먼지를 터는 것은 거절에 대한 단절과 경고를 나타내는 상징적 행동입니다.
    reason: cultural_note
