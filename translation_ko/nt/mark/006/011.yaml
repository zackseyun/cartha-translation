- from: 어떤 곳이 너희를 받아들이지 않고 너희의 말을 듣지 않거든, 거기서 떠날 때에 너희 발 아래의 먼지를 떨어버려 그들에게 증거를 삼으라.」
  to: 어느 곳이든 여러분을 받아들이지 않고 여러분의 말을 듣지 않으면, 그곳을 떠날 때 여러분의 발 아래에 있는 먼지를 털어 버리십시오. 그것이 그들에게[a] 증거가 되도록 하십시오.[b]
  rationale: The revision maintains the source's open-ended reference to any place, its paired refusals, the temporal departure clause, and the dust-shaking command. It renders the testimony phrase naturally as the intended significance of the act, while a footnote preserves the debated contextual force of the Greek dative. It also consistently uses modern formal-polite Korean.
