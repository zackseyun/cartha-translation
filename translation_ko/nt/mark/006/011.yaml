review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys rejection, departure, and the dust-shaking act. However, "그들에게 증거를 삼으라" is less natural and can imply making the people into evidence; εἰς μαρτύριον αὐτοῖς is better rendered as the purpose/result of the act, "그들에게 증거가 되도록." This preserves the Greek dative's ambiguity rather than importing "against them."
  naturalness: '"너희" and the imperative "삼으라" do not consistently match modern formal-polite 합쇼체. "여러분" and "털어 버리십시오" provide an appropriately formal, natural register. The terminal closing quotation mark in the draft is extraneous.'
  terminology: '"받아들이다," "듣다," "먼지," and "증거" are suitable. The alternative adverse sense of αὐτοῖς should be retained in a footnote, not made explicit in the main text.'
  issues:
  - severity: medium
    issue: The phrase "그들에게 증거를 삼으라" is semantically and syntactically awkward.
    rationale: The Greek means that shaking the dust functions as a testimony with reference to them. In Korean, "그들에게 증거를 삼다" can suggest treating them as evidence rather than the act becoming evidence to them.
  - severity: medium
    issue: The draft does not preserve the ambiguity of αὐτοῖς through a footnote.
    rationale: The dative can be translated "to/for them," while the context may support an adverse sense. The main text should remain noncommittal, with the contextual alternative noted.
  - severity: low
    issue: Register and punctuation need normalization.
    rationale: '"삼으라" is not 합쇼체, and the final "」" has no matching opening quotation mark.'
