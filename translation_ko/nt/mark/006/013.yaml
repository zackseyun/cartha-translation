  source_fidelity: 초안은 δαιμόνια, ἀρρώστους, ἐλαίῳ, θεραπεύω의 기본 의미와 세 행동의 순서를 대체로 충실히 옮깁니다. 다만 그리스어의 반복·진행을 나타내는 미완료 과거는 한국어 서술 과거에서 반드시 별도로 표지할 필요는 없지만, ‘쫓아내었고’는 현대 표준 문체에서 다소 부자연스럽습니다. 영어 감사 기록의 ἐλαίῳ 관련 어휘 대안도 각주로 보존하는 것이 적절합니다.
