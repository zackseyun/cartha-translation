  verdict: revise
  source_fidelity: 원문의 περιέδραμον(온 지역을 급히 두루 달림), ἤρξαντο … περιφέρειν(옮기기 시작함), ὅπου ἤκουον ὅτι ἐστίν(그분이 계신다는 말을 들은 곳마다)의 의미는 대체로 반영되었습니다. 다만 ‘자리에 메어’는 κράβαττοις ἐπὶ의 ‘간이 침상/깔개 위에’라는 뜻을 자연스럽고 정확하게 전달하지 못합니다.
  naturalness: ‘그 온 지역’보다 ‘그 온 지역을’ 또는 ‘그 온 지방을’이 자연스럽고, ‘계시다고 들은’은 ‘계신다는 말을 들은’이 현대 표준어 문장에 더 매끄럽습니다. ‘자리에 메어’는 병자를 침상에 실어 운반하는 장면에 맞지 않는 어색한 표현입니다.
  terminology: κακῶς ἔχοντας는 존중되고 현대적인 표현인 ‘병든 사람들’로 옮겼습니다. κράβαττος는 현대 독자가 이해할 수 있도록 ‘간이 침상’으로 번역하고, 단순한 휴대용 깔개라는 어휘 범위는 각주로 보완합니다. 예수님을 가리키는 ἐστίν은 기존 문체를 따라 ‘그분’으로 유지했습니다.
  issues:
