review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Herod’s emphatic responsibility, the sending of agents, John’s arrest, Herodias’s relationship to Philip, and the causal connection to Herod’s marriage. However, ‘옥에 가두었’ renders imprisonment without retaining the distinct verb ἔδησεν (‘bound’). The pronoun ‘그가’ in the final sentence can also be read as referring to Philip, whereas the Greek refers to Herod.
  naturalness: The draft is generally natural modern formal Korean. Making Herod the explicit subject in the final causal clause improves clarity, and ‘옥에 가두어 결박하였습니다’ is clear and appropriately formal.
  terminology: ‘헤롯,’ ‘요한,’ ‘빌립,’ and ‘헤로디아’ are standard Korean biblical forms. ‘결박하였습니다’ preserves the concrete sense of δέω without adding an unwarranted detail such as chains.
  issues:
  - severity: medium
    issue: The distinct action ‘bound him’ is omitted.
    rationale: The source has both ἐκράτησεν (‘seized/arrested’) and ἔδησεν (‘bound’). Imprisonment alone does not fully represent the latter verb.
  - severity: low
    issue: The referent of ‘그가’ is potentially ambiguous in Korean.
    rationale: The immediately preceding named male is Philip, but ἐγάμησεν refers to Herod. Repeating ‘헤롯이’ preserves the source’s reference clearly.
  revised_text: 헤롯이 친히 사람을 보내어 요한을 붙잡고, 자기 형제 빌립의 아내 헤로디아 때문에 그를 옥에 가두어 결박하였습니다. 헤롯이 그녀와 결혼하였기 때문입니다.
