  source_fidelity: 핵심 의미는 충실합니다. 다만 ἐπὶ πίνακι는 ‘쟁반에 담아’보다 ‘쟁반에 올려’가 ‘~ 위에’라는 표현을 더 직접적으로 반영합니다. εὐθὺς와 μετὰ σπουδῆς의 연속된 긴급성도 더 자연스럽게 구분해 낼 수 있습니다.
  naturalness: 초안의 ‘곧 급히’는 뜻은 통하지만 현대 한국어에서는 다소 겹쳐 들립니다. ‘즉시 … 서둘러’로 옮기면 두 부사의 기능을 유지하면서 자연스럽습니다. 직접 인용 뒤의 ‘청하여 말하였습니다’도 ‘청하며 말했습니다’가 더 매끄럽습니다.
  terminology: ‘왕’은 본문의 βασιλέα를 충실히 반영합니다. βαπτιστοῦ는 전통적 명칭을 그대로 쓰기보다 묘사적 칭호를 살린 ‘세례자’가 적절합니다. ‘세례자 요한’은 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
