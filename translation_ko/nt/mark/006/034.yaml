  - marker: b
    text: ‘목자 없는 양들’이라는 비유는 충실한 지도자가 없는 백성을 가리키는 성경의 표현을 떠올리게 합니다. 민수기 27:17; 열왕기상 22:17; 에스겔 34:5을 보십시오.
    reason: cross_reference
