  source_fidelity: 초안은 여행용 물품을 가져가지 말라는 명령과 지팡이의 예외를 대체로 충실히 옮겼습니다. 그러나 χαλκόν은 문자상 ‘구리’이며 여기서는 구리 화폐를 가리키므로, 단순히 ‘동전’이라고 하면 금속의 명시성이 사라집니다. ‘명하셨으니’와 뒤의 ‘말라 하시고’는 한 헬라어 명령 구조를 한국어에서 불필요하게 중복합니다.
