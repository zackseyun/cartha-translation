- from: '헤로디아의 딸이 들어와 춤을 추어 헤롯과 그와 함께 자리에 앉은 자들을 기쁘게 하였습니다. 왕이 그 소녀에게 말하였습니다: 「네가 원하는 것을 무엇이든 나에게 청하라. 내가 너에게 주리라.」'
  to: 헤로디아의 딸[a]이 들어와 춤을 추어 헤롯과 그와 함께 식탁에 앉아 있던 사람들을 기쁘게 하자, 왕이 그 소녀에게 말하였습니다. “원하는 것은 무엇이든 내게 청하십시오. 내가 당신에게 주겠습니다.”
  rationale: 연회 장면의 구체성을 보존하고, 현대 한국어 합쇼체에 맞추어 문장과 직접화법을 정리했습니다. ‘왕’은 마가복음의 표현을 그대로 유지했으며, 논쟁 가능한 친족 관계의 이문은 각주로 처리하여 본문의 의미를 과도하게 단정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
