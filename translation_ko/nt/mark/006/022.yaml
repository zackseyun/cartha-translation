    issue: 연회 동석자 표현이 다소 포괄적입니다.
    rationale: ‘그와 함께 자리에 앉은 자들’도 가능하지만, συνανακειμένοις는 식탁을 함께하는 연회 손님이라는 문맥을 나타냅니다.
  - severity: medium
    issue: 본문 비평상 이문에 관한 각주가 없습니다.
    rationale: SBLGNT의 ‘헤로디아의 딸’ 읽기는 일부 전승의 ‘그의 딸 헤로디아’와 관련하여 혼동될 수 있으므로, 본문을 바꾸지 않되 이문을 각주로 밝혀야 합니다.
