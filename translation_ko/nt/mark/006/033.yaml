  source_fidelity: The draft introduces an adversative '그러나' although the Greek has the simple connective καί ('and'). Its rendering of ἐπέγνωσαν as '그들인 줄 알아채고' is understandable but less direct than recognizing/identifying them. The remaining movement sequence is substantially represented.
