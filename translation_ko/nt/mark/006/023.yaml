  naturalness: 초안의 ‘그녀’는 현대 한국어 성경 문체에서 다소 부자연스럽고 지시 대상이 흐릴 수 있습니다. 문맥의 소녀를 가리키는 ‘그 소녀’가 더 자연스럽습니다. 직접 인용문에서는 ‘주리라’보다 ‘주겠다’가 현대적인 합쇼체 서술과 조화를 이룹니다.
