  to: 그러나 그분께서 그들에게 대답하여 말씀하셨습니다. 「너희가 직접 그들에게 먹을 것을 주십시오.」 그러자 그들이 그분께 말하였습니다. 「우리가 가서 이백 데나리온어치의 떡을 사서 그들에게 먹을 것을 주어야 합니까?[a]」
