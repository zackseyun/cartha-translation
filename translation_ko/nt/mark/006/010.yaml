  source_fidelity: The draft conveys the core instruction, but its final wording is syntactically incomplete and the imperative does not consistently use the requested modern formal-polite 합쇼체. The revised wording retains the source's indefinite 'wherever,' the command to remain, and the potentially broad reference of departure 'from there.'
