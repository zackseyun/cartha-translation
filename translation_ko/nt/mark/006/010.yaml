    rationale: ‘머물라’ is a plain, elevated command form. ‘머무르십시오’ supplies the required modern formal-polite imperative.
  - severity: low
    issue: The phrase for the indefinite location is somewhat unnatural.
    rationale: ‘어느 집에 들어가든지’ is a more natural Korean expression of Ὅπου ἐὰν ... εἰς οἰκίαν while retaining its indefinite scope.
  revised_text: 그분은 그들에게 말씀하셨습니다. “어느 집에 들어가든지, 그곳을 떠날 때까지 그곳에 머무르십시오.”
