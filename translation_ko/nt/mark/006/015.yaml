  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: ko
  text: 그러나 다른 사람들은 “그는 엘리야입니다”라고 말했고, 또 다른 사람들은 “그는 예언자[a]이며 예언자들 가운데 한 사람과 같습니다”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리, 가능성은 낮지만 특정한 종말론적 인물을 가리켜 “그 예언자”로 볼 수도 있습니다. 그러나 뒤에 “예언자들 가운데 한 사람과 같다”가 이어지므로, 그리스어는 여기서 더 자연스럽게 일반적인 “예언자”를 뜻합니다.
    reason: alternative_reading
