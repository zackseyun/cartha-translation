  verdict: revise
  source_fidelity: 첫 절의 '배에서 그들과 함께 오르시니'는 원문의 εἰς τὸ πλοῖον(배 안으로)과 πρὸς αὐτούς(그들에게로/그들이 있는 곳으로)의 관계를 부정확하게 드러낼 수 있습니다. 예수께서 제자들이 있는 배에 올라타신 행동으로 표현하는 편이 정확합니다. 바람이 그친 것과 제자들의 매우 강한 놀라움은 유지되어야 합니다.
  naturalness: '''배에서 ... 오르시니''는 현대 한국어에서 어색하며, ''배에 오르시자''가 자연스럽습니다. ''속으로 심히 놀랐습니다''는 이해 가능하지만, 원문의 중첩된 강세(λίαν ἐκ περισσοῦ)를 ''몹시''로 더 자연스럽게 반영할 수 있습니다.'
  terminology: 호칭 '그분'은 문맥상 허용되며, 본 절에는 별도의 신학 용어나 고유명사 문제가 없습니다. 합쇼체 종결을 유지했습니다.
  issues:
  - severity: medium
    issue: '''배에서 그들과 함께 오르시니''의 장소·동반 표현'
    rationale: 원문은 예수께서 '그들에게로, 배 안으로' 올라가신다는 뜻입니다. 초안의 '배에서'는 출발 또는 배 위에서의 행동처럼 들릴 수 있고, '그들과 함께'는 그들과 동시 행동했다는 뉘앙스를 줄 수 있습니다.
  - severity: low
    issue: 강조의 강도
    rationale: λίαν ἐκ περισσοῦ는 강한 중첩 강조이므로 '심히'보다 '몹시'가 현대어에서 좀 더 자연스럽게 강도를 전달합니다.
