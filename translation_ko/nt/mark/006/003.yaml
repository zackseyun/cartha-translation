  - severity: medium
    issue: ‘그분에 대하여 걸려 넘어졌습니다’는 ἐν αὐτῷ의 관계를 한국어에서 부자연스럽게 처리합니다.
    rationale: 문맥상 예수 때문에 걸려 넘어지거나 그분을 못마땅하게 여긴 반응입니다. ‘그분 때문에’가 더 자연스럽고 원문의 비유를 보존합니다.
