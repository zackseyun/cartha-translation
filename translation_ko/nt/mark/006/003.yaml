  verdict: revise
  source_fidelity: 초안은 인명 목록과 가족 관계, 그리고 ‘마리아의 아들’이라는 표현을 대체로 충실히 옮겼습니다. 그러나 ἐσκανδαλίζοντο ἐν αὐτῷ는 단순히 ‘그분에 대하여’가 아니라 그분으로 인해/그분을 두고 걸려 넘어지거나 못마땅해한 반응을 가리키므로, 관계를 더 직접적으로 밝혀야 합니다.
  naturalness: ‘이 사람이 그 목수’는 인용문 안에서 다소 부자연스럽고, 닫는 인용 부호(」)만 있는 것은 문장부호 오류입니다. ‘이 사람이 그 목수요 … 형제가 아닌가?’가 현대 표준 한국어 합쇼체에 자연스럽습니다.
  terminology: τέκτων은 ‘목수’, Ἰωσῆτος는 ‘요세’, ἀδελφός/ἀδελφαί는 본문에서 각각 ‘형제/누이들’로 유지하는 것이 적절합니다. 가족 관계의 범위에 관한 해석은 각주에서만 제시합니다. ἐσκανδαλίζοντο는 본문에서 ‘그분 때문에 걸려 넘어졌습니다’로 옮기고 의미상 대안을 각주에 둡니다.
