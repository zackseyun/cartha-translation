  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: ko
  text: 이 사람이 그 목수요, 마리아의 아들이며 야고보와 요세와 유다와 시몬의 형제[a]가 아닌가? 그의 누이들도 우리와 함께 여기 있지 않은가? 그래서 그들은 그분 때문에 걸려 넘어졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족들’. 그리스어 ‘형제’와 ‘누이들’은 통상 형제자매를 뜻하지만, 일부 기독교 전통에서는 이들을 더 넓은 친족 또는 의붓형제자매로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분을 못마땅하게 여겼습니다’ 또는 ‘그분 때문에 실족했습니다’.
    reason: lexical_alternative
