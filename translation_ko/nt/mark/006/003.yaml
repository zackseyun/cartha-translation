  to: 이 사람이 그 목수요, 마리아의 아들이며 야고보와 요세와 유다와 시몬의 형제[a]가 아닌가? 그의 누이들도 우리와 함께 여기 있지 않은가? 그래서 그들은 그분 때문에 걸려 넘어졌습니다[b].
