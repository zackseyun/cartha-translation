- from: 왕은 심히 슬퍼졌지만, 자기의 맹세와 함께 자리에 앉은 자들 때문에, 그녀를 거절하기를 원하지 않았습니다.
  to: 왕은 몹시 슬퍼하였지만, 자기의 맹세와 식탁에 함께 앉아 있던 사람들 때문에 그녀의 요청을 거절하려 하지 않았습니다.
  rationale: 식사 자리에 있던 사람들을 가리키는 원문의 의미를 분명히 하고, ‘그녀를 거절하다’가 낳을 수 있는 인물 배척의 뉘앙스를 피하여 그 여자의 요청을 거절하지 않으려 했다는 문맥적 의미를 자연스러운 현대 한국어로 옮겼습니다. ‘-지만’은 왕의 슬픔과 그럼에도 요청을 거절하지 않으려 한 행동 사이의 문맥상 긴장을 표현하며, 원문에 없는 추가 사건을 도입하지 않습니다.
  reviewer_model: gpt-5.6-terra
