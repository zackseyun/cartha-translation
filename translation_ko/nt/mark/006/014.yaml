  - severity: low
    issue: ‘그분의 이름’의 선행사가 불명확함
    rationale: 직전 주어는 헤롯 왕이지만, 원문의 αὐτοῦ는 문맥상 예수님의 이름을 가리킵니다. 한국어에서 명시하면 오해를 막습니다.
  - severity: low
    issue: ‘그 안에서 역사하고 있다’의 현대적 자연스러움
    rationale: ‘역사하다’는 교회어로 널리 쓰이나 다소 신학적 관용구처럼 들릴 수 있습니다. 여기서는 능력들이 작용한다는 원문을 ‘그에게서 작용하고 있다’로 자연스럽게 옮길 수 있습니다.
