  to: 헤롯 왕이 이 일을 들었습니다. 예수님의 이름이 널리 알려졌기 때문입니다. 사람들이 말하였습니다. “세례자 요한이 죽은 자들 가운데서 살아나게 되었다. 그래서 이런 능력들이 그에게서 작용하고 있다.”
  rationale: 문맥상 가리키는 대상을 명확히 하고, 요한의 부활에 관한 그리스어 수동 완료형을 한국어에서 가능한 한 보존했습니다. δυνάμεις는 ‘능력들’로 유지하여 ‘기적’ 또는 추상적 능력 중 하나로 단정하지 않았습니다.
