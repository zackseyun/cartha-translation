  source_fidelity: 수동 완료형 ἐγήγερται는 ‘일어났다’라는 능동 표현보다 ‘살아나게 되었다/일으켜졌다’처럼 수동성을 드러내는 번역이 더 충실합니다. 또한 αὐτοῦ는 문맥상 예수님을 가리키므로 ‘그분’보다 선행사가 분명한 ‘예수님의’가 적절합니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽지만, ‘그분의 이름’은 지시 대상이 불명확할 수 있습니다. ‘이런 능력들이 그 안에서 역사하고 있다’는 의미는 가능하나, 현대 표준어에서는 ‘그에게서 작용하고 있다’가 더 자연스럽고 원문의 작동하는 능력이라는 표현을 잘 살립니다.
  terminology: ‘세례자 요한’은 ὁ βαπτίζων의 동작적 의미를 살린 적절한 표현입니다. ‘죽은 자들 가운데서’도 ἐκ νεκρῶν에 충실합니다. ‘능력들’은 δυνάμεις의 해석 가능성을 성급히 ‘기적’으로 좁히지 않아 적절합니다.
  issues:
