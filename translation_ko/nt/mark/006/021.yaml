revisions:
- from: 그러나 기회의 날이 왔으니, 헤롯이 자기 생일에 자기의 귀족들과 군대 지휘관들과 갈릴리의 유력한 자들을 위하여 잔치를 베풀었을 때입니다.
  to: 그리고 헤롯이 자기 생일을 맞아 자기 고관들과 군대 지휘관들과 갈릴리의 주요 인사들을 위하여 잔치를 베풀었을 때, 마침 알맞은 날이 왔습니다.
  rationale: The revision restores the non-adversative force of Καὶ, reflects the Greek temporal construction, and uses idiomatic formal Korean. '마침 알맞은 날' retains εὔκαιρος ('opportune/suitable') without adding an interpretation beyond the narrative's strategic sense.
  reviewer_model: gpt-5.6-terra
