  source_fidelity: 초안은 εὐθύς, ἀναγκάζω, 제자들이 예수님보다 먼저 떠나는 관계, 그리고 무리를 보내는 예수님의 행동을 대체로 반영합니다. 그러나 πρὸς Βηθσαϊδάν의 방향성은 ‘벳세다로’보다 ‘벳새다 쪽으로’가 더 잘 보존하며, ‘건너편 벳세다’는 지명과 방향 관계를 다소 불분명하게 만듭니다. 또한 ‘보내실 동안’은 원문의 ἕως가 지닌 시간 연결을 자연스럽게 풀어 주지만, 문장상 그분이 무리를 보내신 행동을 더 명료하게 드러내는 편이 좋습니다.
  naturalness: ‘강권하여’는 다소 문어적이지만 ἀναγκάζω의 강한 뜻을 과장 없이 살리는 현대 정중체 표현입니다. ‘자기가’는 이 문맥에서 강조된 αὐτός를 충분히 자연스럽게 드러내지 못하므로 ‘친히’가 더 적절합니다. ‘벳새다’가 통용되는 표기입니다.
