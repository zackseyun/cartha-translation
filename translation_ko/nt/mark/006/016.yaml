  source_fidelity: 현 초안의 ‘내가 목 베인 요한’은 그리스어 ἀπεκεφάλισα(‘내가 목을 베었다’)의 능동 주어와 행위를 잘못 옮깁니다. 또한 ‘그가’ 앞의 강조와 ἠγέρθη의 죽음에서 일으켜짐이라는 의미를 더 분명히 반영할 필요가 있습니다.
  naturalness: ‘헤롯은 그 말을 듣고 말하였습니다’와 ‘내가 목을 벤 요한, 바로 그가 다시 살아났습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 직접화법의 놀람과 단정을 유지합니다.
  terminology: ‘목을 벤’은 ἀποκεφαλίζω의 구체적 의미를 보존합니다. ‘다시 살아났습니다’는 한국어에서 자연스러운 표현이며, 수동태인 ἠγέρθη의 형식은 각주로 밝혀 능동적 ‘스스로 일어남’으로 단정하지 않게 했습니다.
