  to: 그러나 헤롯은 그 말을 듣고 말하였습니다[a]. “내가 목을 벤 요한, 바로 그가 다시 살아났습니다[b].”
  rationale: 행위자와 행위를 명확히 하도록 ‘내가 목을 벤’으로 고쳤습니다. οὗτος의 지시적 강조는 ‘바로 그가’로 반영했습니다. ἠγέρθη는 한국어 본문에서 자연스러운 ‘다시 살아났습니다’로 옮기되, 원문의 수동태는 각주에서 보존했습니다. ‘그 말’은 원문에서 문맥상 생략된 청취 대상을 한국어 문장에 자연스럽게 보충한 것입니다.
  reviewer_model: gpt-5.6-terra
