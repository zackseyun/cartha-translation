revisions:
- from: 그분은 거기서 어떤 큰 능력의 일도 행하실 수 없었고, 다만 몇 명의 병자에게 손을 얹어 고치셨을 뿐입니다.
  to: 그분은 그곳에서는 아무 권능의 일도[a] 행하실 수 없으셨습니다. 다만 몇몇 병자들에게 손을 얹고 고쳐 주셨을 뿐입니다.
  rationale: 직역투인 ‘큰 능력의 일’을 ‘권능의 일’로 고쳐 δύναμις의 마가적 의미를 자연스럽게 드러냈습니다. ‘행하실 수 없으셨습니다’는 οὐκ ἐδύνατο의 실제적 불능 표현을 완화하지 않고 유지했습니다. 예외절은 원문의 참여구문과 주동사를 자연스러운 한국어 문장으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:45:08Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘큰 능력의 일’은 δύναμις를 어색하게 직역한 표현이며, 예수께서 ‘행하실 수 없었다’는 본문의 직접적 진술은 그대로 유지되어야 합니다. εἰ μὴ의 예외는 ‘다만 … 뿐입니다’로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘어떤 큰 능력의 일’은 현대 표준어에서 부자연스럽고 의미도 다소 불명확합니다. ‘아무 권능의 일도’은 기적 행위를 가리키는 마가의 용례를 살리면서 문장으로도 자연스럽습니다. ‘그곳에서는’과 ‘손을 얹고 고쳐 주셨을’이 현대 합쇼체 문맥에 적합합니다.
  terminology: δύναμις는 여기서 단순한 내적 능력보다 기적적 능력의 행위를 가리킵니다. 본문에는 ‘권능의 일’을 사용하고, 각주에서 ‘기적’ 및 ‘능력의 일’이라는 대안을 밝혀 의미 범위를 보존합니다. ἀρρώστοις는 ‘병자들’, ἐπιθεὶς τὰς χεῖρας는 ‘손을 얹고’, ἐθεράπευσεν은 ‘고쳐 주셨습니다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘어떤 큰 능력의 일’이라는 표현
    rationale: 한국어 어법상 어색하며, ‘큰’은 원문의 δύναμις를 자연스럽게 드러내지 못합니다. 이 문맥의 δύναμις는 기적적 권능의 행위를 뜻합니다.
  - severity: low
    issue: 영어 감사 기록의 어휘 각주 미반영
    rationale: δύναμις의 ‘기적/능력의 일’ 의미 범위를 독자가 확인할 수 있도록 해당 표현에 각주 표지를 두는 것이 적절합니다.
