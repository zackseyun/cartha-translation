    issue: '''둘씩 둘씩'' for δύο δύο'
    rationale: Korean idiom expresses the distributive sense with '둘씩'; repeating it is unnatural and adds an unintended sense of repeated action.
  - severity: medium
    issue: Perfective past '주셨습니다' for imperfect ἐδίδου
    rationale: The imperfect depicts Jesus' giving authority as ongoing or contemporaneous with the sending. '주고 계셨습니다' preserves this aspect more closely.
  revised_text: 그분께서 열둘을 부르시고 그들을 둘씩 보내기 시작하셨으며, 그들에게 더러운 영들을 다스릴 권세를 주고 계셨습니다.
