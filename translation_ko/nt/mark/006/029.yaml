  source_fidelity: 원문의 시간적 분사(ἀκούσαντες)는 ‘듣고’로 자연스럽게 반영되었고, 이어지는 ‘와서’, ‘시신을 거두어’, ‘무덤에 두었습니다’는 각각 ἦλθον, ἦραν τὸ πτῶμα, ἔθηκαν αὐτὸ ἐν μνημείῳ의 서술 순서와 뜻을 충실히 전달합니다. ‘요한의 제자들’은 직전 문맥상 세례 요한을 가리키는 αὐτοῦ의 지시 대상을 한국어에서 명료하게 드러낸 것입니다. ‘시신’은 πτῶμα의 죽은 몸이라는 의미를 적절히 살립니다.
