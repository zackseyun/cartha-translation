revisions:
- from: 그분이 다섯 개의 떡과 두 마리의 물고기를 가지고 하늘을 우러러 축복하시고 떡을 떼어, 사람들 앞에 나누어 놓도록 제자들에게 계속 주셨고, 두 마리의 물고기도 그들 모두에게 나누어 주셨습니다.
  to: 그분은 다섯 개의 떡과 두 마리의 물고기를 받으시고, 하늘을 우러러보시며 축복하시고[a] 떡을 떼어 제자들에게 계속 주셨습니다. 제자들이 그것을 사람들 앞에 놓게 하시려는 것이었습니다. 그리고 두 마리의 물고기도 모든 사람에게 나누어 주셨습니다.
  rationale: 원문의 분사와 동사들의 순서, ἐδίδου의 계속적·반복적 의미, ἵνα παρατιθῶσιν의 목적을 보존했습니다. ‘사람들 앞에 놓다’로 παρατίθημι의 구체적 의미를 살리고, 마지막 분배의 수혜자를 ‘모든 사람’으로 명확히 했습니다. εὐλόγησεν은 본문에서 ‘축복하시고’로 번역하되, 해석상 가능한 식사 문맥의 대안을 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
