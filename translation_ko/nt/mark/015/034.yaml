  to: 제구시에 예수께서 큰 소리로 부르짖으셨습니다. 「엘로이 엘로이 레마 사박다니?」 이는 번역하면 「나의 하나님, 나의 하나님, 어찌하여 나를 버리셨습니까?」라는 뜻입니다.
