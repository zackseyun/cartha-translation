  source_fidelity: 원문의 ὥρα τρίτη는 '제삼시'로 보존되어 있으며, ἐσταύρωσαν αὐτόν도 '그분을 십자가에 못 박았습니다'로 충실히 옮겼습니다. 다만 δέ의 약한 접속은 '-는데'보다 단순 병렬 연결인 '-고'가 더 적절합니다.
  naturalness: '''제 삼시였는데''는 띄어쓰기와 연결 어미 면에서 다소 어색합니다. 성경적 시간 표현은 ''제삼시''로 쓰고, ''때는 …였고''로 문장을 연결하면 현대 표준어 합쇼체에서 자연스럽습니다.'
  terminology: '''십자가에 못 박았습니다''는 σταυρόω의 통상적이고 정확한 번역입니다. ''그분''은 문맥상 예수를 공손하게 가리키는 표현으로 허용됩니다. ''제삼시''는 본문에서 유지하되 현대 독자를 위해 오전 아홉 시경이라는 문화적 주석을 답니다.'
