    issue: ἔσω의 공간·방향 의미가 충분히 드러나지 않음
    rationale: ‘안뜰, 곧 총독 관저로’도 목적지는 나타내지만, ἔσω τῆς αὐλῆς의 ‘안으로/안에’라는 표현을 명확히 하려면 ‘안뜰 안 … 안으로’가 더 충실합니다.
  - severity: low
    issue: 역사적 현재 συγκαλοῦσιν이 과거형으로 평준화됨
    rationale: 과거형도 한국어 서사에서는 가능하나, 원문의 생동감 있는 현재를 ‘불러 모읍니다’로 보존할 수 있습니다.
