  source_fidelity: 초안은 병사들이 예수를 총독 관저(프라이토리온) 안으로 데려가 전 부대를 소집했다는 기본 의미를 충실히 옮겼습니다. 다만 ἔσω의 ‘안으로’라는 방향·공간 표현이 더 명시되는 것이 좋고, συγκαλοῦσιν의 마가식 역사적 현재는 한국어에서도 현재형으로 살릴 수 있습니다.
  naturalness: ‘안뜰, 곧 총독 관저로’는 이해 가능하지만, 안뜰과 관저의 관계 및 ‘안으로’라는 이동 방향이 다소 어색하게 결합됩니다. ‘안뜰 안, 곧 총독 관저 안으로’는 원문의 설명적 동격을 유지하면서 자연스럽습니다.
  terminology: ‘총독 관저’는 πραιτώριον의 문맥상 적절한 번역이며, ‘전 부대’는 σπεῖρα의 군사 단위성을 과도하게 현대화하지 않고 전달합니다. 별도 각주는 필수적이지 않습니다.
  issues:
