  to: 그러나 대제사장들은 빌라도가 오히려 바라바를 그들에게 풀어 주도록 무리를 선동하였습니다.
  rationale: 수혜자 αὐτοῖς를 ‘그들에게’로 바로잡고, 원문에 문맥적으로 암시된 빌라도를 보충하여 ‘무리를 선동한’ 목적을 한국어에서 명확히 하였습니다. ‘오히려’는 μᾶλλον의 비교·선호 의미를 유지하며, 대조 대상은 문맥에 맡겼습니다.
