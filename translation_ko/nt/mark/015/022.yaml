  - severity: medium
    issue: Unnatural rendering ‘해골의 곳’
    rationale: Although literal, ‘해골의 곳’ is not idiomatic modern Korean. ‘해골의 장소’ is natural while retaining the genitive relationship expressed by Κρανίου Τόπος.
