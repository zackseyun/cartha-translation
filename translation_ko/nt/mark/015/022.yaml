  source_fidelity: The draft accurately conveys the movement to Golgotha and the explanatory translation. However, its final clause is syntactically attached with -는데 while ending in present-tense 입니다, and ‘해골의 곳’ is markedly unnatural in modern Korean. The source’s anarthrous Κρανίου is best left unmarked in Korean, with a note preserving the possible definiteness nuance.
