  source_fidelity: 초안은 요셉의 출신, 존경받는 공의회 의원이라는 지위, 하나님의 나라를 기다림, 빌라도에게 예수의 시신을 요청한 행동을 대체로 충실히 옮겼습니다. 그러나 καὶ αὐτός의 강조(‘그 자신도’)가 빠져 있으며, τολμήσας의 용기 있는 행동은 ‘용기를 내어’로 더 직접적으로 드러낼 수 있습니다. ‘빌라도에게 들어가’는 εἰσῆλθεν의 ‘들어가다’와 πρὸς의 대면 방향을 보존합니다.
  naturalness: 문장 구조는 자연스럽지만, 강조가 누락되었고 ‘담대히’보다 ‘용기를 내어’가 이 맥락에서 현대 한국어로 더 자연스럽고 참여사의 의미를 잘 나타냅니다. 쉼표는 제거하여 동작 연결을 매끄럽게 했습니다.
