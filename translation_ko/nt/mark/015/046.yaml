  source_fidelity: 전반적인 사건 순서와 의미는 원문에 충실합니다. 다만 “그분을 내려”는 한국어 문장으로 다소 불완전하게 들리므로 연결 어미를 보완하는 것이 좋습니다. “바위에서 깎아 낸”도 뜻은 통하지만, 원문의 ‘바위에서/바위를 깎아 만든’ 무덤이라는 구조를 더 자연스럽게 반영할 수 있습니다.
  naturalness: 합쇼체 문체는 적절합니다. “그분을 내려서”와 “바위를 깎아 만든 무덤”이 현대 표준어에서 더 자연스럽습니다. “무덤 입구에 돌을 굴려 놓았습니다”는 ἐπὶ의 닫는 방향성을 문맥상 자연스럽게 전달합니다.
  terminology: σινδών은 ‘베 천’으로 옮겨 과도하게 ‘수의’로 한정하지 않은 점이 적절합니다. μνημεῖον은 ‘무덤’, πέτρα는 ‘바위’, θύρα는 이 문맥에서 ‘입구’로 옮기는 것이 적절합니다. 원문의 대명사는 앞 문맥의 요셉을 가리키므로 ‘요셉이’를 명시한 것은 한국어의 명료성을 위해 허용됩니다.
