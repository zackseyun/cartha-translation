  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
  footnotes:
  - marker: a
    text: Or 'the Christ.' The Greek title Χριστός is rendered 'Messiah' here to preserve its royal-anointed sense in context.
    reason: alternative_reading
  - marker: b
    text: Or 'were reviling him' or 'were reproaching him.'
    reason: lexical_alternative
translation:
  language: ko
  text: “메시아[a], 곧 이스라엘의 왕은 이제 십자가에서 내려오십시오. 그러면 우리가 보고 믿겠습니다.” 그리고 그분과 함께 십자가에 못 박힌 사람들도 그분을 모욕하고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리스도’. 그리스어 칭호 Χριστός를 여기서는 왕으로 기름부음 받은 이라는 문맥상의 뜻을 살려 ‘메시아’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분을 욕하고 있었습니다’ 또는 ‘그분을 비난하고 있었습니다’.
    reason: lexical_alternative
