  verdict: revise
  source_fidelity: ἤρξαντο ἀσπάζεσθαι is ingressive ('began to') and, in the soldiers' mock-royal setting, is more specifically conveyed by '경례하기' than the ordinary '인사하기.' Χαῖρε is appropriately rendered '만세,' and βασιλεῦ τῶν Ἰουδαίων is retained as '유대인의 왕.'
  naturalness: '''그분께 경례하기 시작했습니다'' is natural modern formal-polite Korean and distinguishes the soldiers'' formal, mocking salute from an everyday greeting. The acclamation ''만세, 유대인의 왕이여!'' is idiomatic in this royal-parodic context.'
  terminology: Use '경례' for the performative salute and '만세' for the acclamation. Retain the conventional passion-title rendering '유대인의 왕,' with a narrowly worded note acknowledging that Ἰουδαῖοι may also denote Judeans.
  issues:
  - severity: medium
    issue: '''인사하기'' is too general for ἀσπάζεσθαι in this mock formal-salute context.'
    rationale: Although ἀσπάζομαι can mean ordinary greeting, the soldiers' royal parody calls for a term that conveys a formal salute. '경례하기' does so without adding an explicit interpretive word such as '조롱하며.'
  - severity: low
    issue: The draft lacks a note for the possible geographic/ethnic range of '유대인.'
    rationale: The conventional rendering is appropriate here, but a footnote preserves the lexical ambiguity reflected in the audit trail.
