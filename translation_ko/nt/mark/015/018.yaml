review_pass:
  verdict: revise
  source_fidelity: 원문의 미완료 과거 ἤρξαντο와 부정사 구문은 ‘~하기 시작했습니다’로 잘 반영되어 있습니다. 다만 이 문맥의 ἀσπάζεσθαι는 일반적인 ‘인사하다’보다 병사들의 조롱 섞인 의례적 경례를 가리키므로 ‘경례하다’가 더 충실합니다. Χαῖρε는 조롱하는 왕권 환호로서 ‘만세’가 적절합니다.
  naturalness: ‘그분께 경례하기 시작했습니다’는 현대 표준어 합쇼체 서술로 자연스럽고, 이어지는 직접 화법의 조롱조도 분명합니다.
  terminology: ‘유대인의 왕’은 본문 및 수난 문맥에서 확립된 표제 번역이며 유지할 수 있습니다. Ἰουδαίων에는 ‘유대인들’과 ‘유대 지방 사람들’의 의미 범위가 있으나, 본문에서는 ‘유대인’이 자연스럽습니다.
  issues:
  - severity: medium
    issue: ‘인사하기’는 ἀσπάζεσθαι의 조롱 섞인 공식적·군사적 경례의 뉘앙스를 충분히 드러내지 못합니다.
    rationale: 바로 뒤의 ‘만세, 유대인의 왕이여!’라는 모의 왕권 환호가 이 동작이 단순한 인사가 아니라 조롱의 경례임을 보여 줍니다.
  revised_text: 그리고 그들은 그분께 경례하기 시작했습니다. “만세, 유대인의 왕이여!”
  revised_footnotes:
  - marker: a
    text: 또는 “인사하기 시작했습니다.” 그리스어 동사는 일반적인 인사를 뜻할 수도 있으나, 여기서는 조롱하는 의례적 경례의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “유대 지방 사람들의 왕.” 그리스어 표현은 ‘유대인’ 또는 ‘유대 지방 사람’을 가리킬 수 있습니다. 이 수난 문맥의 통상적인 표제 표현을 따라 “유대인의 왕”으로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 조롱하는 군사적 왕권 경례라는 문맥을 반영하여 ‘인사하기’를 ‘경례하기’로 고쳤습니다. ‘만세’와 ‘유대인의 왕’은 원문의 환호와 표제를 충실하고 자연스럽게 전달하므로 유지했습니다.
