source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
  footnotes:
  - marker: a
    text: Or “the Judeans.” Here the phrase “king of the Jews” reflects the standard political charge brought before Pilate.
    reason: lexical_alternative
  - marker: b
    text: Or “You say,” or more explicitly, “That is what you say.” Jesus’ reply is terse and leaves a measure of ambiguity.
    reason: alternative_reading
translation:
  language: ko
  text: 빌라도가 예수께 물었습니다[a]. 「당신이 유대인의 왕입니까?」 예수께서 빌라도에게 대답하여 말씀하셨습니다[b]. 「그렇게 말씀하신 것은 총독님입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게 물었습니다’입니다.
    reason: source_pronoun
  - marker: b
    text: 또는 “당신이 말씀하십니다”, “그것은 당신이 말씀하신 것입니다.” 예수의 짧은 대답은 명시적으로 ‘예’라고 하지 않으며, 어느 정도의 모호함을 남깁니다.
    reason: alternative_reading
