  to: 빌라도가 예수께 물었습니다[a]. 「당신이 유대인의 왕입니까?」 예수께서 빌라도에게 대답하여 말씀하셨습니다[b]. 「그렇게 말씀하신 것은 총독님입니다.」
  rationale: 본문의 이름을 밝혀 대화의 지시 대상을 명료하게 하고, Σὺ λέγεις를 한국어의 자연스러운 과거 대화체로 수정했습니다. 수정한 응답은 예수께서 그 표현을 빌라도의 말로 돌리는 원문의 절제된 성격을 보존하며, 이를 무조건적인 긍정이나 부정으로 해석하지 않습니다. ‘유대인의 왕’은 정치적 고발로 쓰인 정착된 표현이므로 유지했고, 어휘적 대안과 응답의 모호성은 각주에 남겼습니다.
