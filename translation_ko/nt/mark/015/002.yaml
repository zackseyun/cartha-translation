  source_fidelity: ‘유대인의 왕’은 βασιλεὺς τῶν Ἰουδαίων을 정확히 반영합니다. 그러나 ‘당신이 그렇게 말합니다’는 Σὺ λέγεις의 과거 서사 문맥과 한국어 직접화법에 맞지 않아, 예수의 절제되고 여지를 남기는 응답을 자연스럽게 전달하지 못합니다. ‘그분’ 및 ‘그에게’도 지시 대상이 문맥상 파악되기는 하나, 이 짧은 대화에서는 ‘예수’와 ‘빌라도’를 밝혀 주는 편이 명료합니다.
  naturalness: 현대 표준어 합쇼체에서는 ‘빌라도가 예수께 물었습니다’와 ‘예수께서 빌라도에게 대답하여 말씀하셨습니다’가 자연스럽습니다. 응답은 ‘그렇게 말씀하신 것은 총독님입니다’로 옮겨, 직역투를 피하면서도 ‘당신이 말한 것이다’라는 원문의 귀속과 모호성을 유지했습니다.
  terminology: ‘빌라도’, ‘예수’, ‘유대인의 왕’은 통용되는 성경 용례이며 적절합니다. Ἰουδαίων은 여기서 통상적인 정치적 고발 표현인 ‘유대인’으로 번역하되, ‘유대 지역 사람들’이라는 어휘적 가능성은 각주로 제시합니다.
