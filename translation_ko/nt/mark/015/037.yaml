  source_fidelity: The draft correctly conveys Jesus' death through the idiomatic Korean expression "숨을 거두셨습니다." However, "내신 후" introduces a more explicit temporal sequence ('after he made...') than the Greek aorist participle, which simply accompanies or precedes the main action without emphasizing an interval.
