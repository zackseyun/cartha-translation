  source_fidelity: σῶσον σεαυτόν is accurately represented by ‘당신 자신을 구원하십시오.’ καταβάς is an aorist participle whose precise relation to the imperative is compressed and can be read as attendant action, means, or effectively a second challenge. Rendering it as a second imperative preserves this ambiguity without importing an explicitly instrumental ‘by’ sense.
  naturalness: The draft’s ‘구원하라’ is 하라체, not the requested modern formal-polite 합쇼체. ‘너 자신’ is also less suitable for this target register. Two short imperatives are natural Korean in a hostile taunt while retaining formal-polite morphology.
  terminology: ‘구원하다’ appropriately preserves the lexical and theological connection of σῴζω; it should not be weakened to ‘살려 내다’ or ‘구하다.’ ‘십자가’ is standard.
  issues:
  - severity: medium
    issue: Register mismatch
    rationale: ‘너 자신을 구원하라’ uses familiar/plain imperative speech (하라체), whereas the specified target is modern formal-polite 합쇼체.
  - severity: low
    issue: Participial relation should remain open
    rationale: The draft’s ‘내려와서’ is possible, but the Greek participle does not unambiguously specify instrumental means. Coordinated imperatives are idiomatic and preserve the taunt’s compressed relation; a note records the more formally participial alternatives.
