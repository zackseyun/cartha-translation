  source_fidelity: 초안은 κακόν을 ‘악’으로, Σταύρωσον αὐτόν을 직접 명령인 ‘그를 십자가에 못 박으십시오’로 정확히 옮기며, 군중의 강화된 외침도 잘 반영합니다. 다만 미완료형 ἔλεγεν의 진행·반복적 뉘앙스가 단순 과거 ‘말했습니다’에서 사라집니다. γάρ의 문제 제기적 연결도 ‘도대체’로 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘그가 무슨 악을 행하였습니까?’와 ‘더욱 크게 부르짖었습니다’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. ‘말하고 있었습니다’는 이 장면에서 빌라도의 계속되는 발화를 무리 없이 나타냅니다.
  terminology: ‘빌라도’, ‘악’, ‘십자가에 못 박으십시오’는 통용되는 성경 용어이면서 원문의 의미와 명령형의 직접성을 보존합니다.
