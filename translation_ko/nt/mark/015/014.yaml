  - severity: low
    issue: γάρ의 문제 제기적 연결이 드러나지 않음
    rationale: 원문의 ‘Τί γὰρ’는 빌라도가 군중의 요구에 근거를 묻는 흐름입니다. ‘도대체’는 이를 자연스러운 한국어로 반영합니다.
