  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
  footnotes:
  - marker: a
    text: Or 'were worshiping him.' The Greek verb can mean 'bow down before,' 'pay homage to,' or 'worship,' but here it describes the soldiers' mocking imitation of royal honor.
    reason: lexical_alternative
translation:
