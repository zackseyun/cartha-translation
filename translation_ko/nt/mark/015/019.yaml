  text: 그들은 갈대로 그의 머리를 때리고, 그에게 침을 뱉고, 무릎을 꿇어 그에게 절하고 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경배하고 있었습니다.’ 그리스어 동사는 ‘절하다’, ‘경의를 표하다’, 또는 ‘경배하다’를 뜻할 수 있으나, 여기서는 병사들이 왕에게 보이는 경의를 조롱하여 흉내 내는 것을 가리킵니다.
    reason: lexical_alternative
