  text: 그러자 어떤 사람이 달려가 스펀지에 신 포도주를 흠뻑 적시고 그것을 갈대에 끼워 예수께 마시게 하고 있었습니다. 그러면서 말했습니다. “그를 그대로 두십시오.[a] 엘리야가 와서 그를 내려 줄지 봅시다.”
