review_pass:
  verdict: revise
  source_fidelity: ‘해면에 신 포도주를 적셔’는 대체로 뜻이 통하지만, γεμίσας는 스펀지를 신 포도주로 가득 적시는 행위를 더 직접적으로 나타냅니다. 또한 ἐπότιζεν은 미완료 시상으로, ‘마시게 하고 있었습니다’가 진행 중인 행위를 더 잘 반영합니다. καθελεῖν αὐτόν은 엘리야가 그분을 아래로 내려 주기 위해 오는지를 말하므로 ‘그분을 내려 주러 오는지’로 명확히 옮겼습니다.
  naturalness: ‘스펀지’, ‘가득 적시고’, ‘갈대에 끼워’, ‘마시게 하고 있었습니다’는 현대 표준어 서술문에서 자연스럽습니다. ‘그대로 두십시오’는 Ἄφετε의 명령을 자연스럽게 살리며, ‘기다리십시오’라는 가능한 관용적 이해는 각주로 보존했습니다.
  terminology: ὄξος는 현대 조미료로만 오해될 수 있는 ‘식초’보다 ‘신 포도주’가 적절합니다. 원문의 불특정 인물과 대명사 지시를 보존하면서, 본문 서술의 합쇼체와 그분에 대한 존칭을 일관되게 유지했습니다.
  issues:
  - severity: medium
    issue: ‘해면에 신 포도주를 적셔’ 및 ‘그분께 마시게 하며’
    rationale: 원문의 ‘스펀지를 신 포도주로 채우고’와 미완료 동사 ἐπότιζεν의 진행성을 충분히 드러내지 못합니다.
  - severity: low
    issue: ‘갈대에 매어’
    rationale: 스펀지를 갈대에 붙이거나 끼우는 행위를 뜻하는 περιθεὶς에 비해 한국어로 다소 부자연스럽고 구체성이 부족합니다.
  - severity: medium
    issue: ‘엘리야가 와서 그를 내려 주는지’
    rationale: ‘와서’는 가능하나, 부정과거 부정사 καθελεῖν의 목적을 ‘그를 내려 주러 오는지’로 옮기면 엘리야의 도래 목적이 더 분명합니다.
  revised_text: 한 사람이 달려가 스펀지에 신 포도주를 가득 적시고, 그것을 갈대에 끼워 그분께 마시게 하고 있었습니다. 그러면서 말했습니다. 「그대로 두십시오[a]. 엘리야가 그분을 내려 주러 오는지 봅시다.」
  revised_footnotes:
  - marker: a
    text: 또는 “기다리십시오.”
    reason: lexical_alternative
  - marker: b
    text: ‘신 포도주’는 현대의 증류 식초를 반드시 뜻하는 말이 아니라, 값싼 산성의 포도주 음료를 가리킵니다.
    reason: cultural_note
  revision_rationale: 원문의 동작 순서와 미완료 시상을 더 충실히 반영하고, 현대 한국어로 자연스럽게 다듬었습니다. Ἄφετε의 의미 범위는 본문과 각주로 함께 보존했습니다. 문화 설명 각주(b)는 ‘신 포도주’에 붙일 수 있도록 제공하지만, 본문에 표지(b)를 넣지 않아 앵커 오류가 생기지 않도록 본문 표지와 각주 표지를 일치시켜야 합니다. 따라서 완결된 표지 체계에서는 본문 ‘신 포도주[b]’로 표기해야 합니다.
