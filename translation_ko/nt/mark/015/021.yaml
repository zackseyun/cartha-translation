  source_fidelity: 초안의 인명·지명, 알렉산더와 루포의 부친이라는 동격 설명, 그리고 십자가를 지게 한 목적은 원문에 대체로 충실합니다. 그러나 ἀγγαρεύουσιν을 ‘강제로 데려와’로 옮기면 단순한 강제 동원보다 ‘데려오다’라는 이동 행위를 더하게 됩니다. 또한 αὐτοῦ는 문맥상 예수님을 가리키므로 한국어에서 시몬을 가리키는 것으로 오해될 수 있는 ‘그의’는 명확히 하는 것이 안전합니다.
  naturalness: ‘시골에서 오던 지나가는 어떤 사람’은 수식어가 다소 겹칩니다. ‘시골에서 오던 … 어떤 사람’으로 정리하고, ἀγγαρεύω의 강제 역역/부역 의미를 ‘억지로 동원하여’로 표현하면 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘구레네 사람 시몬’과 ‘십자가’는 적절합니다. ‘억지로 동원하여’는 강제성을 보존하면서도 원문에 없는 ‘데려와’를 피합니다.
  issues:
  - severity: medium
    issue: ‘강제로 데려와’가 ἀγγαρεύουσιν에 원문에 없는 이동 의미를 더합니다.
    rationale: ἀγγαρεύω는 강제 봉사·동원을 뜻하며, 시몬을 특정 장소로 데려왔다는 행위 자체를 말하지 않습니다.
  - severity: medium
    issue: ‘그의 십자가’의 선행사가 한국어에서는 시몬으로 읽힐 수 있습니다.
    rationale: 그리스어 문맥에서 αὐτοῦ는 예수님을 가리키지만, 한국어의 가장 가까운 남성 인물은 시몬입니다. 의미를 보존하려면 지시 대상을 명확히 해야 합니다.
  revised_text: 그리고 그들은 시골에서 오던 어떤 사람, 곧 알렉산더와 루포의 아버지인 구레네 사람 시몬을 억지로 동원하여 예수님의 십자가를 지게 했습니다.
  revised_footnotes: []
