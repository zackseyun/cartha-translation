review_pass:
  verdict: revise
  source_fidelity: 원문의 ἀγγαρεύουσιν은 강제 부역·강제 동원의 뜻인데, 초안의 ‘강제로 데려와’는 시몬을 어디론가 끌고 왔다는 의미를 더하여 원문의 행위를 바꿉니다. 또한 ‘그의 십자가’는 한국어에서 가장 가까운 선행사인 시몬의 십자가로 읽힐 수 있으므로, 문맥상 예수를 가리키는 αὐτοῦ를 분명히 해야 합니다.
  naturalness: ‘시골에서 오던 지나가는 어떤 사람’은 관형어가 연속되어 다소 어색합니다. ‘시골에서 오다가 지나가던 한 사람’으로 하면 원문의 ‘시골에서 오던’과 ‘지나가던’을 모두 자연스럽게 살릴 수 있습니다.
  terminology: ‘구레네 사람 시몬’, ‘알렉산더’, ‘루포’, ‘십자가’는 적절합니다. 강제성을 위해 ‘억지로 동원하여’를 사용하고, 십자가의 소유자는 한국어의 필수적인 지시 대상 명료화를 위해 ‘예수님의’로 밝혔습니다.
  issues:
  - severity: high
    issue: ‘강제로 데려와’가 ἀγγαρεύουσιν의 의미를 변경함
    rationale: ἀγγαρεύω는 강제 봉사나 부역에 동원한다는 뜻입니다. ‘데려오다’는 이동·연행을 뜻하며 십자가를 지게 한 강제 동원의 행위를 정확히 옮기지 못합니다.
  - severity: medium
    issue: ‘그의 십자가’의 지시 대상이 한국어에서 모호함
    rationale: 문장 안의 가장 가까운 남성 인물은 시몬이므로 ‘그의’가 시몬을 가리키는 것으로 오해될 수 있습니다. 헬라어 문맥의 αὐτοῦ는 예수를 가리킵니다.
  - severity: low
    issue: 관형어 연쇄가 부자연스러움
    rationale: ‘시골에서 오던 지나가는 어떤 사람’보다 ‘시골에서 오다가 지나가던 한 사람’이 현대 표준 한국어에서 더 자연스럽습니다.
  revised_text: 그들은 시골에서 오다가 지나가던 한 사람, 곧 알렉산더와 루포의 아버지인 구레네 사람 시몬을 억지로 동원하여 예수님의 십자가를 지게 했습니다.
  revised_footnotes:
  - marker: a
    text: ‘시골에서’는 직역하면 ‘밭/시골에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘억지로 동원하여’로 옮긴 말은 강제 부역이나 강제 봉사를 시키는 것을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘십자가’로 옮긴 그리스어는 단순히 ‘십자가’라고 하며, 이를 더 구체적으로 ‘가로대’라고 한정하지 않습니다.
    reason: lexical_alternative
  revision_rationale: 강제 동원의 의미를 정확히 회복하고, 한국어 대명사의 잠재적 모호성을 해소했으며, 원문의 인물 식별과 ‘시골에서 오다가 지나가던’ 상황을 유지했습니다. ‘십자가’는 원문의 범위를 좁히지 않았습니다.
