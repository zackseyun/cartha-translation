    issue: Stiff wording and potentially unclear reflexive reference
    rationale: “그가 늘 자기들에게 행하던 대로” is grammatically possible, but “자기들” may require a moment of processing, and “행하다” is unnecessarily formal here. The revision clarifies that Pilate customarily acted for the crowd.
  revised_text: 그리고 무리가 올라와서, 그가 평소에 그들에게 해 주던 대로 해 달라고 요청하기 시작했습니다.
