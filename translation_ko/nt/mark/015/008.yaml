  source_fidelity: ἀναβὰς is represented by “올라와서,” and ἤρξατο αἰτεῖσθαι by “요청하기 시작했습니다.” The customary force of the imperfect ἐποίει should be expressed as a habitual practice. The implied object of the request is clear in Korean.
  naturalness: The draft is understandable, but “자기들에게 행하던 대로” is somewhat stiff and the reflexive “자기들에게” can momentarily obscure the referent. “평소에 그들에게 해 주던 대로” is more natural modern formal Korean while retaining the sense of Pilate’s customary action for the crowd.
  terminology: “무리,” “요청하다,” and the formal-polite past narrative ending are suitable. Replacing “행하다” with “해 주다” better conveys the benefactive dative αὐτοῖς in this context.
  issues:
