  terminology: ‘강도’는 λῃσταί의 기본적이고 넓은 의미를 적절히 반영합니다. 다만 ‘도적/무장 강도, 산적’ 및 문맥상 가능한 정치적 함의를 독자가 확인할 수 있도록 영어 감사 기록에 상응하는 주석을 붙입니다. ‘그분’은 한국어의 현대 존중 서술 관습에 맞으며 본문의 지시 대상도 명료합니다.
