- from: 그러자 빌라도가 다시 그분께 물어 말했습니다. 「당신은 아무 대답도 하지 않습니까? 보십시오, 그들이 당신을 거슬러 얼마나 많이 고발하고 있는지요.」
  to: 그러나 빌라도는 다시 그분께 물었습니다. 「아무 대답도 하지 않습니까? 보십시오, 그들이 당신을 상대로 얼마나 많은 혐의를 제기하고 있는지요.」
