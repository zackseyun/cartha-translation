  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐξ ἐναντίας αὐτοῦ는 한국어에서 ‘그분 맞은편’보다 ‘그분의 맞은편’이 더 정확하고 자연스럽습니다. ἐξέπνευσεν은 완료된 사건이므로 ‘숨을 거두시는 것을’보다 ‘숨을 거두신 것을’이 적절합니다. οὕτως는 ‘그렇게’로 보존했습니다.
  naturalness: 현대 표준어 합쇼체에 맞게 문장 구조를 다듬고, 인용문 종결을 ‘이었습니다’로 통일했습니다. ‘서 있던’은 이미 그 위치에 서 있던 상태를 나타내는 완료분사의 문맥상 기능을 자연스럽게 전달합니다.
  terminology: κεντυρίων은 ‘백부장’으로 유지했습니다. υἱὸς θεοῦ는 본문에서 ‘하나님의 아들’로 옮기되, 관사 없는 그리스어 표현의 해석 가능성은 해당 어구에 직접 연결한 각주로 보존했습니다. ‘하나님의 아들’은 한국어에서 제목적 읽기와 비정관적 읽기를 문법적으로 명확히 구별하지 않으므로 각주가 필요합니다.
  issues:
  - severity: medium
    issue: 소유격 조사 누락 및 시제·상 불일치
    rationale: ‘그분 맞은편’은 표준적인 산문에서 어색하며, ‘그분의 맞은편’이 공간 관계를 분명히 합니다. 또한 부정과거 ἐξέπνευσεν은 ‘숨을 거두신’으로 옮겨야 완료된 죽음의 사건을 충실히 반영합니다.
  - severity: low
    issue: 해석상 논의되는 υἱὸς θεοῦ에 연결된 각주 부재
    rationale: 영어 감사 기록이 보존한 ‘a son of God’ 가능성을 한국어 독자에게도 제시하는 것이, 본문에서 한쪽 읽기를 택하면서도 원문의 논쟁된 모호성을 보존하는 방법입니다. 각주는 ‘하나님의 아들’ 어구에 붙여야 합니다.
