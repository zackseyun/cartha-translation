  source_fidelity: 초안은 지나가는 사람들, 머리를 흔드는 동작, 조롱의 감탄사, 성전을 헐고 사흘 안에 짓는다는 말을 대체로 반영합니다. 그러나 ‘짓겠다는’은 헬라어 현재분사 οἰκοδομῶν(‘짓는’)에 없는 의도·주장이라는 뉘앙스를 더합니다. 또한 미완료 과거 ἐβλασφήμουν의 진행성을 더 자연스럽게 살릴 수 있습니다.
  naturalness: ‘지나가던 사람들’과 ‘머리를 흔들며’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. 인용문의 ‘짓는 자여’는 조롱하는 직접 호칭으로서 문맥상 자연스럽고, 원문의 미완결 인용(뒤 절로 이어짐)도 쉼표로 보존합니다.
  terminology: βλασφημέω는 이 문맥에서 신성모독이라는 기술적 의미로 한정하지 않고 ‘모욕하다’로 옮기는 것이 적절합니다. ναός는 본문에서 ‘성전’으로 유지합니다. Οὐά는 조롱의 감탄사이므로 ‘아하!’가 알맞습니다.
  issues:
  - severity: medium
    issue: ‘사흘 만에 짓겠다는’
    rationale: οἰκοδομῶν은 단순히 ‘짓는’이며, ‘-겠다는’은 말한 이의 의도나 선언을 명시하여 원문보다 해석을 추가합니다.
  - severity: low
    issue: 미완료 과거의 진행성
    rationale: ‘모욕하여 말했습니다’도 가능하나, ἐβλασφήμουν의 지속적 배경 행위는 ‘모욕하고 있었습니다’로 더 분명히 드러낼 수 있습니다.
