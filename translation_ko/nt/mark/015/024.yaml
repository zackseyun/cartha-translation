review_pass:
  verdict: revise
  source_fidelity: 초안은 십자가형과 옷의 분배 및 제비뽑기의 핵심 의미를 담고 있습니다. 그러나 두 주동사 σταυροῦσιν, διαμερίζονται의 역사적 현재를 과거형으로 평준화했고, 분배를 제비뽑기 뒤의 결과로만 배열하여 헬라어의 동시적 진행 관계가 다소 약해졌습니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체로 자연스럽습니다. ‘옷을 두고 제비를 뽑다’는 ἐπ’ αὐτὰ의 대상 관계를 자연스럽게 나타내며, ‘누가 무엇을 가져갈지’는 τίς τί ἄρῃ의 분배적 의미를 보존합니다.
  terminology: ‘십자가에 못 박습니다’는 σταυροῦσιν에 충실하고, ‘옷’, ‘제비를 뽑다’, ‘나눕니다’는 문맥과 현대적 격식에 적절합니다. 본문에 교파적 해석이나 불필요한 신학적 보충은 없습니다.
  issues:
  - severity: medium
    issue: 역사적 현재의 소실
    rationale: σταυροῦσιν과 διαμερίζονται는 모두 현재형입니다. 한국어에서 역사적 현재는 ‘못 박습니다/나눕니다’로 무리 없이 재현할 수 있으므로, 초안의 ‘못 박고/나누었습니다’보다 원문의 서술 효과에 가깝게 옮기는 것이 안전합니다.
  - severity: low
    issue: 분배와 제비뽑기의 관계가 다소 순차적으로 표현됨
    rationale: βάλλοντες κλῆρον은 ‘나누다’에 수반되는 분사입니다. ‘제비를 뽑아 나눕니다’로 옮기면 제비뽑기가 옷 분배의 방식임을 더 분명히 하면서도 자연스럽습니다.
