review_pass:
  verdict: revise
  source_fidelity: 원문의 순서와 핵심 의미는 대체로 충실합니다. 그러나 ἐξάγουσιν은 ‘끌고’라기보다 ‘데리고/이끌고 나가다’이며, ‘끌고’는 원문에 없는 거친 물리적 강제의 뉘앙스를 더합니다. 목적 표현 ‘십자가에 못 박으려고’는 ἵνα + 접속법의 목적을 적절히 반영합니다.
  naturalness: 합쇼체 서술은 자연스럽습니다. 다만 ‘그분 자신의 옷’은 다소 직역투이므로 ‘그분의 옷을 다시’가 현대 한국어에서 더 자연스럽고, 문맥상 τὰ ἴδια의 소유 강조와 원래 옷을 돌려입힌 의미를 보존합니다.
  terminology: ‘조롱하다’, ‘자색 옷’, ‘십자가에 못 박다’는 적절합니다. ‘데리고 나가다’가 ἐξάγω의 구금 상태에서의 인도 의미를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘끌고 나갔습니다’
    rationale: ἐξάγω는 이 문맥에서 그를 밖으로 이끌어 가거나 데리고 나가는 뜻입니다. ‘끌고’는 실제로 질질 끌었다는 물리적 강제의 뉘앙스를 추가할 수 있으므로 피하는 것이 안전합니다.
  - severity: low
    issue: ‘그분 자신의 옷’
    rationale: τὰ ἱμάτια τὰ ἴδια의 ‘자기 자신의 옷’이라는 뜻은 맞지만, 한국어에서는 ‘그분의 옷을 다시 입혔습니다’가 더 자연스럽고 원래의 옷을 되돌려 입힌 문맥을 잘 드러냅니다.
  revised_text: 그들이 그분을 조롱한 후, 자색 옷을 벗기고 그분의 옷을 다시 입혔습니다. 그리고 그분을 십자가에 못 박으려고 데리고 나갔습니다.
