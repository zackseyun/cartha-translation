review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the two women and conveys the ongoing observation indicated by ἐθεώρουν. However, ‘그분’ adds a reverential referential nuance not expressed in the Greek, and ‘안치되었는지’ is more ceremonially specific than τέθειται (‘has been placed/laid’).
  naturalness: The sentence is generally natural in modern formal-polite Korean. ‘어디에 두었는지를 지켜보고 있었습니다’ is a more idiomatic narrative rendering and retains the durative force of the imperfect.
  terminology: ‘막달라 마리아’ and ‘요세의 어머니 마리아’ are standard and appropriate. No footnote is required, since the Korean wording already makes explicit the likely relational sense of Μαρία ἡ Ἰωσῆτος.
  issues:
  - severity: low
    issue: ‘그분’ introduces an honorific reference absent from the source.
    rationale: The Greek passive leaves Jesus implicit from context; Korean can likewise leave the subject implicit without adding a reverential designation.
  - severity: low
    issue: ‘안치되었는지’ is interpretively narrower and more ceremonial than the Greek verb.
    rationale: τέθειται denotes that he had been placed/laid; ‘두었는지’ more directly and neutrally represents the burial action in context.
  revised_text: 그리고 막달라 마리아와 요세의 어머니 마리아는 어디에 두었는지를 지켜보고 있었습니다.
