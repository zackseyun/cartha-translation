    issue: κυρίου를 본문에서 ‘야훼’로 번역함
    rationale: SBLGNT의 표현은 κυρίου(‘주의’)입니다. 이사야의 히브리어 배경이 יהוה인 점은 중요하지만, 마가의 그리스어 본문이 사용하는 칭호를 본문에서 신명으로 대체하지 않아야 합니다.
  - severity: medium
    issue: ‘광야에서’의 대안적 결속에 관한 각주가 없음
    rationale: 그리스어 문맥에서는 ‘광야에서 외치는 이’가 가장 자연스럽지만, 이사야 인용 전통에서는 ‘광야에서 주의 길을 예비하십시오’라는 구두점도 가능합니다. 영어 POB 감사 기록처럼 이를 각주로 보존해야 합니다.
  - severity: medium
    issue: 명령문이 합쇼체가 아님
    rationale: 초안의 ‘예비하고, ... 만들어라’는 해라체입니다. 지정된 현대 정중 합쇼체에는 ‘예비하십시오, ... 하십시오’가 맞습니다.
