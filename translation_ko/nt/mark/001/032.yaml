    issue: The imperfect ἔφερον is rendered as the simple completed past 데려왔습니다.
    rationale: The Greek imperfect presents the bringing as ongoing or repeated in the narrative. 데려오고 있었습니다 more closely preserves this aspect.
  - severity: low
    issue: The noun 자 is less natural for the requested modern Korean register.
    rationale: 사람들 is contemporary and clear, while preserving the referential scope of the substantival participles.
  revised_text: 저녁이 되어 해가 졌을 때, 사람들이 병든 사람들과 귀신 들린 사람들을 모두 그분께 데려오고 있었습니다.
