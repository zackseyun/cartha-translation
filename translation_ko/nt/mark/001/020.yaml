- from: 그분은 곧 그들을 부르셨습니다. 그러자 그들은 자기들의 아버지 세베대를 일꾼들과 함께 배에 남겨 두고 그분을 따라갔습니다.
  to: 그분은 곧바로 그들을 부르셨습니다. 그들은 그들의 아버지 세베대를 품꾼들과 함께 배에 남겨 두고 그분을 따라갔습니다[a].
