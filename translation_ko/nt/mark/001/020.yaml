review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jesus' immediate call, the leaving of Zebedee in the boat, and the subsequent following. However, 일꾼들 does not convey the paid status of μισθωτῶν ('hired workers'), and the existing wording does not preserve the audit-trail footnote for ὀπίσω αὐτοῦ.
  naturalness: The formal-polite narrative style is natural. Replacing 자기들의 with 그들의 avoids an unnecessarily awkward possessive, and 곧바로 makes the temporal force of εὐθύς clear in contemporary Korean.
  terminology: 세베대 is the standard Korean form of Zebedee. 품꾼들 is an established, comprehensible rendering for paid/hired laborers in this setting. The note preserves the lexical and discipleship-related breadth of ὀπίσω αὐτοῦ without imposing an interpretation.
  issues:
  - severity: medium
    issue: 일꾼들과 does not translate μισθωτῶν fully.
    rationale: μισθωτῶν identifies workers engaged for pay. 품꾼들과 preserves this essential semantic feature without specifying a modern employment relationship.
  - severity: low
    issue: The lexical-alternative footnote associated with ὀπίσω αὐτοῦ is absent.
    rationale: The English audit trail identifies a genuine ambiguity between spatial movement and following/discipleship. A Korean footnote anchor after 따라갔습니다 preserves that ambiguity.
  - severity: low
    issue: 자기들의 is stylistically marked here.
    rationale: 그들의 naturally renders αὐτῶν in this third-person plural narration and avoids needless reflexive emphasis.
  revised_text: 그분은 곧바로 그들을 부르셨습니다. 그들은 그들의 아버지 세베대를 품꾼들과 함께 배에 남겨 두고 그분을 따라갔습니다[a].
