  lexicon: BDAG
  rationale: 글로서리에 따라 「회개」로 옮긴다. 본 명령형은 결정적 전환을 촉구하는 부정과거의 의미를 「회개하고」로 표현한다.
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 「때가 찼고」, 「하나님의 나라」, 「회개」, 「복음」은 원문의 의미를 대체로 충실히 반영합니다. 다만 원문의 현재 명령법 복수형 μετανοεῖτε, πιστεύετε에 대하여 본문이 하라체 단수 명령인 「회개하고 … 믿어라」를 사용하여, 목표로 제시된 현대 한국어 합쇼체 및 청자 복수에 맞지 않습니다. 「가까이 왔습니다」는 ἤγγικεν의 완료적 결과를 자연스럽게 나타냅니다.
  naturalness: 「말씀하셨습니다」와 직접 인용의 「믿어라」가 한 문장 안에서 높임·종결 등급이 섞여 있습니다. 인용문의 명령을 「회개하고 복음을 믿으십시오」로 고치면 현대적이고 일관된 합쇼체가 됩니다. 「그리고 이렇게 말씀하셨습니다」는 καὶ λέγων의 서사적 연결을 자연스럽게 드러냅니다.
  terminology: 「하나님의 나라」는 βασιλεία τοῦ θεοῦ의 폭넓은 의미와 한국어 성서 용례를 잘 보존합니다. 「회개」와 「복음」도 적절합니다. 「하나님의 통치」 및 「기쁜 소식」은 각각 가능한 어휘 대안으로 주석에서 제시할 수 있으나 본문을 바꿀 필요는 없습니다.
  issues:
  - severity: medium
    issue: 인용문 명령형의 종결 등급 및 수
    rationale: 「회개하고 복음을 믿어라」는 하라체 단수형인 반면, 원문은 복수 청중에게 하는 명령이며 번역 목표는 현대 공식-공손 합쇼체입니다. 「회개하고 복음을 믿으십시오」가 이를 해결합니다.
  revised_text: 그리고 이렇게 말씀하셨습니다. 「때가 찼습니다. 하나님의 나라가 가까이 왔습니다. 회개하고 복음을 믿으십시오.」
  revised_footnotes:
  - marker: a
    text: 또는 “하나님의 통치가 가까이 왔습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “기쁜 소식을 믿으십시오.”
    reason: lexical_alternative
  revision_rationale: 본문의 하라체 단수 명령을 합쇼체 복수 청중을 향한 명령으로 고쳐 원문의 문법적 대상과 목표 문체를 일치시켰습니다. 완료형의 의미는 「때가 찼습니다」와 「가까이 왔습니다」로 유지했습니다. 어휘 대안 주석은 해당 어구에 연결되도록 제시했습니다.
