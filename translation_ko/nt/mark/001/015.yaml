lexical_decisions:
- source_word: βασιλεία τοῦ θεοῦ
  english_pob_choice: the kingdom of God
  chosen_korean: 하나님의 나라
  alternatives_korean:
  - 하나님의 통치
  lexicon: BDAG
  rationale: 글로서리 기본값. 「하나님의 통치」는 동적 측면을 강조하나 한국어 성서 전통과 가독성에서 「하나님의 나라」가 표준이다.
- source_word: μετανοεῖτε
  english_pob_choice: Repent
  chosen_korean: 회개하고
  alternatives_korean:
  - 돌이키고
  - 마음을 바꾸고
  lexicon: BDAG
  rationale: 글로서리에 따라 「회개」로 옮긴다. 본 명령형은 결정적 전환을 촉구하는 부정과거의 의미를 「회개하고」로 표현한다.
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 「때가 찼고」는 Πεπλήρωται의 완료된 성취를, 「하나님의 나라가 가까이 왔다」는 ἤγγικεν의 현재적 가까움을 자연스럽게 전달합니다. 「회개하고 복음을 믿다」도 μετανοεῖτε와 πιστεύετε ἐν τῷ εὐαγγελίῳ에 적절히 대응합니다.
  naturalness: 현 번역은 문장 자체는 자연스럽지만, 인용문 안의 「왔다」「믿어라」가 해라체입니다. 지정된 현대 공식-공손체(합쇼체)에 맞추어 서술과 명령을 모두 「-습니다/-십시오」로 통일하는 것이 필요합니다.
  terminology: 「하나님의 나라」, 「회개」, 「복음」은 표준 한국어 성서 용어로 적절합니다. 「하나님의 통치」로 좁혀 옮길 필요는 없습니다.
  issues:
  - severity: medium
    issue: 지정된 합쇼체와 인용문의 종결 표현 불일치
    rationale: 「가까이 왔다」「믿어라」는 해라체입니다. 과업의 목표 문체인 현대 공식-공손체에 맞게 「가까이 왔습니다」「믿으십시오」로 바꾸어야 합니다.
  - severity: low
    issue: 말씀 도입부의 연결 표현
    rationale: λέγων은 앞 절에 연결되는 분사이므로, 독립 인용으로 제시할 때 「이렇게 말씀하셨습니다」라고 하면 발화 도입이 더 자연스럽고 분명합니다.
  revised_text: 이렇게 말씀하셨습니다. “때가 찼으며 하나님의 나라가 가까이 왔습니다. 회개하고 복음을 믿으십시오.”
  revised_footnotes: []
  revision_rationale: 번역의 어휘 선택은 유지하되, 목표 문체의 일관성을 위해 인용문을 합쇼체로 고쳤습니다. 「때가 찼으며」는 완료형의 성취를 유지하고, 「가까이 왔습니다」는 하나님의 나라의 현재적 가까움을 보존합니다.
