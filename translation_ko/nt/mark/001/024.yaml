translation:
  language: ko
  text: '말했습니다: 「나사렛 예수님, 우리가 당신과 무슨 상관이 있습니까?[a] 우리를 멸하러 오셨습니까? 저는 당신이 누구신지 압니다. 하나님의 거룩한 분이십니다.[b]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘우리에게 그리고 당신에게 무엇이 있습니까?’ 이 표현은 단절이나 적대 관계를 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘나사렛 예수님.’ 그리스어는 ‘예수, 나사렛 사람’이라는 뜻의 호칭을 사용합니다.
    reason: lexical_alternative
