  naturalness: 초안의 ‘물에서 올라오시며, 그분은’은 문법적으로 가능하지만 현대 한국어 서사에서는 다소 끊기고 중복적으로 들립니다. ‘물에서 올라오실 때 … 보셨습니다’가 합쇼체 서술로 더 자연스럽습니다.
  terminology: ‘성령’은 이 세례 문맥에서 τὸ πνεῦμα의 통상적이고 이해 가능한 한국어 신학 용어입니다. 다만 ‘성령께서’처럼 높임을 적용하고, ‘비둘기처럼’은 비교의 정확한 양태를 규정하지 않아 원문의 여지를 보존합니다.
