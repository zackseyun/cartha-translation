  text: 모두가 놀라 서로 이야기했습니다. “이것이 무엇입니까? 권위 있는 새로운 가르침입니다![a] 그분은 더러운 영들에게도 명령하시고, 그들은 그분께 복종합니다.”
  philosophy: optimal-equivalence
