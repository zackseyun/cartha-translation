- from: 그러나 그가 나가서 그 일을 널리 전파하고 그 말을 퍼뜨리기 시작하니, 예수께서 더 이상 드러내고 어떤 성에도 들어가실 수 없었고, 바깥 한적한 곳에 머무르셨습니다. 그래도 사람들이 사방에서 그분에게 나아왔습니다.
  to: 그러나 그가 나가서 그 소식을 널리 전파하고 퍼뜨리기 시작하니, 예수께서는 더 이상 공개적으로 어느 마을에도 들어가실 수 없으셨습니다. 그래서 바깥 외딴 곳들에 머물러 계셨는데, 사람들이 사방에서 그분께 나아왔습니다.
