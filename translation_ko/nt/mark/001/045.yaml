  text: 그러나 그가 나가서 그 소식을 널리 전파하고 퍼뜨리기 시작하니, 예수께서는 더 이상 공개적으로 어느 마을에도 들어가실 수 없으셨습니다. 그래서 바깥 외딴 곳들에 머물러 계셨는데, 사람들이 사방에서 그분께 나아왔습니다.
