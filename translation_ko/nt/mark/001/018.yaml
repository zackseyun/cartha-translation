review_pass:
  verdict: revise
  source_fidelity: ‘버리고’ can suggest discarding or throwing away the nets, whereas ἀφέντες here most directly means leaving them behind. ‘버려두고’ preserves the prior participial action without adding that nuance. The connective καί is better retained as ‘그리고’ than rendered as the more inferential ‘그러자.’
  naturalness: ‘그리고 그들은 곧 그물을 버려두고 그분을 따라갔습니다’ is natural modern Korean in formal-polite narrative style. ‘곧’ appropriately conveys εὐθύς.
  terminology: ‘그분을 따라갔습니다’ accurately renders ἠκολούθησαν αὐτῷ while retaining the contextual pronoun and avoiding expansion into an explicit discipleship formula. The lexical-alternative footnote is retained and anchored to ‘곧.’
  issues:
  - severity: medium
    issue: ‘그러자’ adds a consequential nuance to καί.
    rationale: The Greek uses the ordinary connective καί (‘and’). ‘그리고’ more closely preserves Mark’s simple narrative coordination.
  - severity: medium
    issue: ‘버리고’ may imply discarding the nets.
    rationale: ἀφέντες denotes leaving them; ‘버려두고’ conveys leaving behind without suggesting disposal.
  - severity: low
    issue: The draft omits the lexical-alternative footnote corresponding to εὐθύς.
    rationale: The audit trail supplies an ‘at once’ alternative; Korean should retain an equivalent anchored note.
  revised_text: 그리고 그들은 곧[a] 그물을 버려두고 그분을 따라갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘즉시’.
    reason: εὐθύς의 어휘적 대안을 보존합니다.
  revision_rationale: The revision retains the Greek connective, represents the participle as a preceding coordinated action without overstating it as disposal, preserves the pronoun for Jesus, and restores the lexical-alternative footnote for εὐθύς.
