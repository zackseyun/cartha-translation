  to: 그는 이렇게 선포하였습니다. 「나보다 더 강하신 분이 내 뒤에 오십니다. 나는 몸을 굽혀 그분의 샌들 끈을 풀 자격조차 없습니다.」
  rationale: ‘샌들’을 사용하여 ὑποδήματα의 고대적 지시를 보존하고, 선포 동사와 발화 도입을 현대 한국어에 자연스럽게 정리했습니다. 비교급, ‘내 뒤에’, 몸을 굽히는 동작, 끈을 푸는 행위, 그리고 화자의 깊은 무자격 선언은 유지했습니다.
