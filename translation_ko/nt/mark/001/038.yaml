  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “다른 곳, 곧 이웃 마을들[b]로 갑시다. 내가 այնտեղ에서도 전파하도록 말입니다. 나는 이 일을 위하여 나왔습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 이 일을 위해 나왔다.” 이 표현은 예수님께서 지금 계신 곳을 떠나 나오신 일을 가리킬 수도 있고, 전파하러 나가신 목적을 더 넓게 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 단어는 마을과 도시의 중간 정도에 해당하는, 비교적 작은 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
