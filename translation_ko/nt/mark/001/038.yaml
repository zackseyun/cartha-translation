review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘가까운 다른 마을들’은 ἀλλαχοῦ(다른 곳으로)와 ἐχομένας κωμοπόλεις(이웃한 고을들)를 한 덩어리로 처리하여 의미 관계가 다소 흐려집니다. 또한 ἵνα κηρύξω는 목적을 나타내는데, ‘전파해야 하리니’는 원문에 없는 당위·필연의 뉘앙스를 더합니다. ‘이를 위하여 내가 나왔다’는 ἐξῆλθον의 의미 범위를 대체로 보존합니다.
  naturalness: ‘다른 곳, 곧 이웃 고을들로 갑시다’는 현대 표준어 합쇼체로 자연스럽고, ἀλλαχοῦ와 뒤따르는 지명구의 관계를 분명히 합니다. ‘전파할 수 있도록’은 목적절을 자연스럽게 옮깁니다.
  terminology: κηρύσσω는 본문 문맥에서 ‘전파하다’로 유지할 수 있습니다. κωμοπόλεις는 ‘고을들’로 옮기고, 더 작은 정착지를 가리킬 수 있다는 점은 각주로 보완합니다. ἐξῆλθον은 ‘나왔다’로 두어 현 장소를 떠남과 사역을 위한 나아감 사이의 해석상 여지를 보존합니다.
  issues:
  - severity: medium
    issue: 목적절이 의무·필연 표현으로 번역됨
    rationale: ‘내가 거기서도 전파해야 하리니’는 ἵνα κηρύξω의 목적을 ‘해야 한다’라는 당위로 바꿉니다.
  - severity: low
    issue: 장소 표현의 의미 관계가 불분명함
    rationale: ἀλλαχοῦ는 ‘다른 곳’을, εἰς τὰς ἐχομένας κωμοπόλεις는 그 목적지를 구체화하므로 이를 분리해 드러내는 편이 정확합니다.
  revised_text: 그분이 그들에게 말씀하셨습니다. “다른 곳, 곧 이웃 고을들로 갑시다. 내가 այնտեղ에서도 전파할 수 있도록 말입니다. 내가 이를 위해 나왔기 때문입니다[a].”
  revised_footnotes:
  - marker: a
    text: 또는 ‘내가 이 때문에 나왔다.’ ‘나왔다’는 현재 있는 곳을 떠난 일을 가리킬 수도 있고, 전파하기 위해 나선 더 넓은 목적을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 ‘고을들’은 마을과 도시의 중간 정도인 비교적 작은 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: '목적절을 목적 표현으로 바로잡고, ‘다른 곳’과 ‘이웃 고을들’의 관계를 명료하게 했습니다. ἐξῆλθον의 범위는 본문과 각주에서 모두 열어 두었습니다. 다만 본문에 b 각주 표지가 누락되어 있어 아래와 같이 표지를 반영한 완성 본문이 필요합니다: ‘그분이 그들에게 말씀하셨습니다. “다른 곳, 곧 이웃 고을들[b]로 갑시다. 내가 այնտեղ에서도 전파할 수 있도록 말입니다. 내가 이를 위해 나왔기 때문입니다[a].”’'
