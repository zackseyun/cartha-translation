  naturalness: ‘다른 곳, 곧 이웃 마을들로 갑시다’는 ἀλλαχοῦ와 ‘가까이 있는 κωμοπόλεις’를 모두 자연스럽게 드러내며, 현대 한국어 합쇼체 문장으로 무리가 없습니다.
  terminology: κωμοπόλεις는 본문에서 자연스러운 ‘마을들’로 옮기고, 더 작은 정착지라는 어휘적 뉘앙스는 각주에서 밝혔습니다. κηρύσσω는 문맥상 ‘전파하다’로 유지했습니다.
