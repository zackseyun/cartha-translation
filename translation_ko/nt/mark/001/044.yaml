  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: ko
  text: 그에게 말씀하셨습니다. “각별히 조심해서 아무에게도 아무 말도 하지 마십시오. 오히려 가서 제사장에게 네 몸을 보이십시오. 그리고 네 정결을 위하여 모세가 명한 것을 드려서 그들에게 증거가 되게 하십시오.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들에게 증거가 되도록.” 이 표현은 제사장들이나 다른 이들에게 제시되는 증거를 뜻할 수 있으며, 일부는 이를 그들에게 불리한 증언으로 이해합니다.
    reason: εἰς μαρτύριον αὐτοῖς의 대상과 뉘앙스는 확정되지 않았으므로, 증거라는 넓은 의미를 본문에 유지하고 가능한 더 날카로운 해석은 각주에 보존합니다.
