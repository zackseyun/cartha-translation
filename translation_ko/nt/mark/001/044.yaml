  to: 그에게 말씀하셨습니다. “각별히 조심해서 아무에게도 아무 말도 하지 마십시오. 오히려 가서 제사장에게 네 몸을 보이십시오. 그리고 네 정결을 위하여 모세가 명한 것을 드려서 그들에게 증거가 되게 하십시오.[a]”
