  verdict: revise
  source_fidelity: 초안은 이른 시간, 어둠, 이동, 기도의 기본 뜻을 대체로 충실히 옮깁니다. 다만 λίαν의 강조가 명시적으로 드러나지 않고, ἔρημον의 ‘외지고 인적이 드문’ 성격은 ‘한적한’보다 ‘외딴’이 더 정확합니다. 미완료형 προσηύχετο의 진행성을 ‘기도하고 계셨습니다’로 반영했습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘밖으로 나가시어 … 가셔서’는 ἐξῆλθεν과 ἀπῆλθεν의 연속된 이동을 한국어에서 무리 없이 구별합니다.
  terminology: ‘외딴 곳’은 ἔρημον τόπον의 문맥상 의미를 자연스럽게 전달하며, 가능한 ‘황량한/광야 같은/인적이 드문’ 뉘앙스는 각주로 보완합니다. 본문에는 신학적 해석을 덧붙이지 않았습니다.
  issues:
