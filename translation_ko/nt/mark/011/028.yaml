  source_fidelity: 초안은 ἐξουσία를 ‘권세’로, ταῦτα를 ‘이런 일들’로 옮겨 핵심 의미를 대체로 충실히 반영합니다. 그러나 δεύτε 질문을 이끄는 ἢ(‘또는/혹은’)가 번역에서 빠졌으며, ἔλεγον의 미완료 과거 뉘앙스도 반영하는 편이 더 적절합니다.
  naturalness: ‘말하고 있었습니다’와 ‘또는’은 현대 한국어 합쇼체에서 자연스럽고, 질문의 병렬·대안 관계를 분명히 합니다. ‘이런 일들을 할 이 권세’도 자연스러운 어순입니다.
  terminology: ‘권세’는 이 문맥의 ἐξουσία(권위·권한)를 가리키는 성경적이고 통용되는 표현으로 유지할 수 있습니다. 본문은 그 권세의 출처를 묻는 질문일 뿐이므로, 그 출처를 해석적으로 보충하지 않았습니다.
  issues:
  - severity: medium
    issue: ἢ의 의미가 누락되었습니다.
    rationale: 그리스어는 ‘무슨 권세로’라는 질문 뒤에 ‘또는 누가 … 주었는가’라는 대안적·보충적 질문을 명시합니다. 이를 번역에 드러내야 합니다.
  - severity: low
    issue: ἔλεγον의 미완료 과거 뉘앙스가 약화되었습니다.
    rationale: ‘말했습니다’도 가능하지만, ‘말하고 있었습니다’는 진행·반복의 미완료 과거를 더 직접적으로 반영합니다.
  revised_text: 그리고 그들이 그분께 말하고 있었습니다. 「당신은 무슨 권세로 이런 일들을 하십니까? 또는 누가 당신에게 이런 일들을 할 이 권세를 주었습니까?」
