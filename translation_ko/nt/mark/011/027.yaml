  source_fidelity: 첫 문장의 ‘갔습니다’는 목적지를 향한 이동으로 들릴 수 있어, 예루살렘에 이르러 들어온다는 문맥의 ἔρχονται εἰς를 더 잘 드러내도록 ‘들어갔습니다’로 고쳤습니다. ‘성전 뜰’은 ἱερόν, 곧 성소 내부(ναός)가 아닌 넓은 성전 구역을 문맥상 적절히 나타냅니다.
