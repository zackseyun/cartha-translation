  terminology: ‘대제사장들’, ‘율법학자들’, ‘장로들’은 해당 유대 지도자 집단을 가리키는 통용되고 이해하기 쉬운 표현입니다. ἱερόν의 공간적 범위를 명확히 하기 위해 각주를 덧붙였습니다.
