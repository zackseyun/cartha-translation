  source_fidelity: 핵심 의미는 대체로 충실합니다. ἐδίδασκεν καὶ ἔλεγεν의 지속적·서술적 진행, 성경에 기록된 말씀에 호소하는 의문, ‘모든 민족을 위한 기도의 집’, 그리고 ‘강도들의 소굴’이라는 예레미야 7:11의 반향이 보존되어 있습니다. 다만 인용문의 겹따옴표가 구조적으로 잘못 배치되어 있어 인용 범위와 ‘기록되어 있지 않습니까?’의 관계를 명료하게 바로잡아야 합니다.
  naturalness: ‘그들에게 가르치며 말씀하셨습니다’도 이해되지만, 높임과 문장 연결을 자연스럽게 하려면 ‘그들에게 가르치시며 말씀하셨습니다’가 더 적절합니다. 성경 인용을 소개하는 표현은 ‘…라고 기록되어 있지 않습니까?’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘내 집’, ‘기도의 집’, ‘모든 민족’, ‘강도들의 소굴’은 원문의 어휘와 이사야 56:7 및 예레미야 7:11의 인용·반향을 적절히 살립니다. λῃστῶν을 ‘강도들’로 옮긴 것은 이 문맥에서 안전하며, 불필요하게 정치적 의미를 확정하지 않습니다.
  issues:
