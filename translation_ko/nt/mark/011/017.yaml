    issue: 인용부호가 겹쳐 있고 닫는 위치가 부정확합니다.
    rationale: 초안의 ‘「「…」 하고 기록되지 않았습니까? …」’는 직접 인용과 예수의 발화 전체의 경계를 혼동하게 합니다. 원문은 성경 인용을 포함한 하나의 발화이므로, 바깥 인용부호 안에 성경 인용을 작은따옴표로 처리하거나 인용부호 체계를 일관되게 적용해야 합니다.
