  text: 그리고 그분께서 그들에게 가르치시며 말씀하셨습니다. “ ‘내 집은 모든 민족을 위한 기도의 집이라 불릴 것이다’라고 기록되어 있지 않습니까? 그런데 여러분은 그것을 강도들의 소굴로 만들었습니다.”
  philosophy: optimal-equivalence
