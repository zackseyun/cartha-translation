review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's recollection, the fig tree, Jesus' prior curse, and its resulting withering. However, it renders Mark's historical present λέγει as past tense (말했습니다), and it changes the address/title from “Rabbi” to “Teacher” (선생님) within the same utterance.
  naturalness: The revised wording uses natural contemporary standard Korean in formal-polite style. “생각이 나서” idiomatically expresses Peter's recollection, and “말합니다” retains Mark's vivid historical present.
  terminology: Ῥαββί should remain “랍비” consistently. Replacing the draft's “선생님께서” with “랍비께서” preserves both the Greek title and the direct second-person reference in idiomatic Korean.
  issues:
  - severity: medium
    issue: Historical present is flattened to past tense.
    rationale: λέγει is a historical present. “말합니다” better reflects Mark's narrative style than “말했습니다.”
  - severity: medium
    issue: The title “Rabbi” is inconsistently rendered as “선생님” in the clause describing the curse.
    rationale: The Greek has Ῥαββί in direct address and then an explicit second-person verb. Korean can naturally retain the title as “랍비께서,” avoiding an unnecessary title shift.
  revised_text: 베드로가 생각이 나서 그분께 말합니다. 「랍비여, 보십시오. 랍비께서 저주하신 무화과나무가 말랐습니다.」
