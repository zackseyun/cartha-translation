    text: 또는 ‘그들이 가도록 허락했습니다.’ 그리스어 동사는 ‘놓아주다’, ‘허락하다’, ‘보내 주다’ 등의 뜻을 가질 수 있습니다. 여기서는 사람들이 제자들이 나귀를 데려가는 것을 더 이상 막지 않았다는 뜻입니다.
