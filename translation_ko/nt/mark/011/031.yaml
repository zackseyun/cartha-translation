  source_fidelity: 초안은 διελογίζοντο의 상호 숙의와 ‘하늘에서’ 및 αὐτῷ의 인칭 목적어를 대체로 반영합니다. 그러나 직접 인용문의 종결과 인용 구조가 불완전하여, 가정문과 예수께서 하실 것으로 예상한 질문의 관계가 문법적으로 온전하게 드러나지 않습니다.
  naturalness: ‘무어라고’는 구어적이며, 합쇼체 목표에 비해 인용문 종결 ‘말할까?’와 ‘않았느냐?’가 일관되지 않습니다. 현대 표준어 합쇼체의 자연스러운 직접화법으로 정리했습니다.
  terminology: ‘하늘에서’는 유대교의 경외적 완곡어법을 보존하므로 본문에서 유지했습니다. ‘그를 믿지 않았습니까’는 πιστεύω + 여격이 가리키는 요한의 증언을 믿지 않았다는 뜻을 자연스럽게 전달합니다.
  issues:
  - severity: high
    issue: 인용문과 문장의 종결이 불완전합니다.
    rationale: 초안은 마지막 큰따옴표 및 서술 종결이 누락되어 있고, 중첩 인용의 범위도 명확하지 않습니다. 완결된 문장과 한국어 인용 부호를 제공해야 합니다.
  - severity: medium
    issue: 직접화법의 높임말 종결이 목표 합쇼체와 일관되지 않습니다.
    rationale: ‘말할까?’, ‘않았느냐?’ 대신 ‘말해야 합니까?’, ‘않았습니까?’를 사용하여 지정된 현대 격식체를 유지합니다.
  revised_text: 그들은 서로 의논하며 말했습니다. “우리가 무엇이라고 말해야 합니까? 만일 ‘하늘에서’라고 말하면, 그가 ‘그러면 왜 그를 믿지 않았습니까?’라고 말할 것입니다.”
  revised_footnotes:
  - marker: a
    text: ‘하늘에서’는 ‘하나님에게서’ 또는 ‘하나님께서 주신’이라는 뜻을 에둘러 나타내는 유대교의 경외적 표현입니다.
    reason: cultural_note
  revision_rationale: 문장부호와 중첩 인용을 바로잡고, 직접화법을 현대 표준어 합쇼체로 통일했습니다. ‘하늘에서’는 원문의 표현과 그 완곡어법을 보존하기 위해 유지하고 각주로 설명했습니다.
