  text: 그리고 그들이 서로 의논하며 말했습니다. 「우리가 무어라고 말할까? 만일 「하늘에서」라고 말하면, 그가 「그러면 왜 그를 믿지 않았느냐?」 할 것이다.
  philosophy: optimal-equivalence
