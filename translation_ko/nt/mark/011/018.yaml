translation:
  language: ko
  text: 대제사장들과 율법학자들이 이 일을 듣고, 그분을 어떻게 없애 버릴 수 있을지를 궁리하고 있었습니다.[a] 그들은 그분을 두려워하고 있었으니, 온 무리가 그분의 가르침에 크게 놀라고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “죽일 수 있을지를” 또는 “사형에 처할 수 있을지를.” 그리스어 동사는 더 넓게 “없애다, 멸하다”를 뜻할 수 있으나, 이 문맥에서는 살해 의도가 시사됩니다.
    reason: lexical_alternative
