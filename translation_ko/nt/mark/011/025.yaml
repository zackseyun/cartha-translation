revisions:
- from: 그리고 여러분이 서서 기도할 때마다, 누구에게 무엇이든 거리낌이 있거든 용서하십시오. 그래야 하늘에 계신 여러분의 아버지께서도 여러분의 잘못을 용서해 주실 것입니다.」
  to: 그리고 여러분이 서서 기도할 때마다, 누구에게든 불만이 있거든 용서하십시오. 그리하여 하늘에 계신 여러분의 아버지께서도 여러분의 잘못을 용서해 주시도록 하십시오.
  rationale: 대인적 불만을 뜻하는 κατά τινος를 ‘누구에게든 불만이 있거든’으로 바로잡고, 명령 뒤의 ἵνα 목적절을 ‘그리하여 … 용서해 주시도록 하십시오’로 옮겨 원문의 연결을 보존했습니다. 불필요한 닫는 인용 부호를 제거했습니다.
