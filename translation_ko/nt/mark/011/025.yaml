base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
  footnotes:
  - marker: a
    text: Or 'your Father in heaven.' The Greek reads 'in the heavens' (plural).
    reason: lexical_alternative
  - marker: b
    text: Or 'transgressions' or 'offenses' for 'trespasses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분이 서서 기도할 때마다, 누구에게든 불만이 있거든 용서하십시오. 그리하여 하늘에 계신 여러분의 아버지께서도 여러분의 잘못을 용서해 주시도록 하십시오.
