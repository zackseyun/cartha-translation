review_pass:
  verdict: revise
  source_fidelity: ‘거리낌’은 보통 주저함·꺼림을 뜻하여 κατά τινος가 나타내는 타인에 대한 불만이나 원한을 정확히 옮기지 못합니다. 또한 원문의 ἵνα 절은 용서 명령과 아버지의 용서를 연결하는 목적 표현이므로 이를 자연스러운 한국어 목적 표현으로 보존했습니다.
  naturalness: ‘누구에게든 불만이 있거든’은 현대 표준 한국어에서 자연스럽고, τι/τινος의 포괄성을 유지합니다. 원문의 닫는 인용 부호처럼 보이는 불필요한 ‘」’도 삭제했습니다.
  terminology: ἀφίετε/ἀφῇ는 일관되게 ‘용서하다’로, παραπτώματα는 현대적이면서도 문맥상 적합한 ‘잘못’으로 옮겼습니다. ‘하늘에 계신’은 τοῖς οὐρανοῖς의 한국어 관용적 대응이며, 교리적 해석을 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ‘누구에게 무엇이든 거리낌이 있거든’
    rationale: ‘거리낌’은 개인적 양심의 꺼림 또는 주저함을 주로 뜻하며, ‘누구에게 무엇인가를 품고 있다/불만이 있다’라는 원문의 대인적 원망·불만의 의미를 전달하지 못합니다.
  - severity: low
    issue: 문장 끝의 ‘」’
    rationale: 대응하는 여는 인용 부호가 없고 본문에 속하지 않는 문장부호입니다.
