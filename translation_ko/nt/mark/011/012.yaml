review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the narrative connector, the following-day setting, the plural group departing from Bethany, and Jesus as the singular implicit subject. However, ‘나올 때’ can imply simultaneity, whereas the aorist genitive absolute naturally presents their departure as antecedent to his hunger.
  naturalness: ‘시장하셨습니다’ is understandable but comparatively literary/dated in contemporary standard Korean. ‘배가 고프셨습니다’ is the usual natural formal-polite expression.
  terminology: ‘베다니’ is the established Korean biblical place name. Rendering the implicit singular subject as ‘그분께서는’ is respectful and preserves the source’s lack of an explicit name.
  issues:
  - severity: medium
    issue: Temporal relation of the genitive absolute
    rationale: ‘그들이 베다니에서 나올 때’ may mean ‘while/as they were coming out.’ ‘그들이 베다니에서 나온 뒤에’ more clearly conveys the departure as preceding the main verb, without adding substantive meaning.
  - severity: low
    issue: Contemporary idiom for hunger
    rationale: Replacing ‘시장하셨습니다’ with ‘배가 고프셨습니다’ improves modern naturalness while conveying ἐπείνασεν faithfully.
  revised_text: 그리고 이튿날, 그들이 베다니에서 나온 뒤에 그분께서는 배가 고프셨습니다.
