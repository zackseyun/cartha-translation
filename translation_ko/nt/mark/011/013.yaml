base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
  footnotes:
  - marker: a
    text: Or, 'for it was not the time for figs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 멀리서 잎이 난 무화과나무를 보시고, 혹시 그 나무에서 무엇인가를 찾으실까 하여 그 나무로 가셨습니다. 그러나 가셔서 잎 외에는 아무것도 찾지 못하셨습니다. 무화과 철이 아니었기 때문입니다.
  philosophy: optimal-equivalence
