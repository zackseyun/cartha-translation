review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence, the tentative purpose ('혹시'), the failure to find anything but leaves, and Mark's explanatory statement that it was not the season for figs. However, '잎이 무성한' adds the idea of luxuriant foliage, whereas ἔχουσαν φύλλα says only that the tree had leaves.
  naturalness: The proposed wording is natural contemporary standard Korean in formal-polite 합쇼체. Replacing the repeated, somewhat vague '그리로' with '그 나무로' improves clarity while retaining the Greek's movement toward the tree.
  terminology: '''무화과나무'' and ''무화과 철'' are standard and clear. ''잎이 난'' renders the presence of leaves without intensifying it. No theological terminology is at issue.'
  issues:
  - severity: medium
    issue: '''잎이 무성한'' is stronger than the source.'
    rationale: The Greek phrase ἔχουσαν φύλλα means 'having leaves.' It does not state that the foliage was thick or luxuriant. '잎이 난' is a natural Korean expression that avoids this added detail.
  - severity: low
    issue: '''그리로'' is less explicit than the referent in the source.'
    rationale: The Greek refers again to the fig tree. '그 나무로' is clearer in Korean and does not change the meaning.
  revised_text: 그분께서는 멀리서 잎이 난 무화과나무를 보시고, 혹시 그 나무에서 무엇인가를 찾으실까 하여 그 나무로 가셨습니다. 그러나 가셔서 잎 외에는 아무것도 찾지 못하셨습니다. 무화과 철이 아니었기 때문입니다.
