base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
  footnotes:
  - marker: a
    text: “Hosanna” is a Hebrew/Aramaic liturgical cry meaning something like “save, please” or “save now,” though here it functions as a shout of praise.
    reason: lexical_alternative
  - marker: b
    text: This acclamation echoes Psalm 118:26.
    reason: cross_reference
translation:
  language: ko
  text: 앞서 가는 사람들과 뒤따르는 사람들이 외쳤습니다. “호산나![a] 주의 이름으로 오시는 분은 복되십니다![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호산나’는 히브리어/아람어에서 온 예전적 외침으로, ‘구원해 주십시오’ 또는 ‘지금 구원해 주십시오’라는 뜻에 가깝습니다. 그러나 여기서는 찬양의 환호로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 환호는 시편 118:26을 반영합니다.
    reason: cross_reference
