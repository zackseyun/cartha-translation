  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
  footnotes:
  - marker: a
    text: Or 'the temple courts' or 'the temple precincts'; the Greek term refers to the broader temple complex, not specifically the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 예루살렘에 이르렀습니다. 그분께서 성전[가]에 들어가셔서 성전에서 파는 사람들과 사는 사람들을 내쫓기 시작하시고, 환전상들의 상과 비둘기를 파는 사람들의 의자를 뒤엎으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
