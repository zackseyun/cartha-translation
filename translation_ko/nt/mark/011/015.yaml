  verdict: revise
  source_fidelity: 원문은 예루살렘에 도착한 뒤 예수께서 성전 구역에 들어가셔서, 파는 이들과 사는 이들을 내쫓기 시작하시고 환전상들의 상과 비둘기 판매자들의 의자를 뒤엎으신 일을 서술합니다. 초안은 핵심 내용을 대체로 충실히 옮겼으나, 접속된 동사의 상과 시제가 한국어 문장 안에서 부자연스럽습니다. ἱερόν은 내소가 아닌 더 넓은 성전 구역을 가리키므로 주석으로 보완하는 것이 적절합니다.
  naturalness: ‘들어가셔서 … 시작하시며 … 뒤엎으셨습니다’는 ‘시작하시며’가 뒤의 완료된 과거 동사와 연결되어 어색합니다. ‘내쫓기 시작하시고’로 고치면 원문의 ἤρξατο ἐκβάλλειν과 사건의 진행을 자연스럽게 반영합니다. 또한 ‘예루살렘으로 갔습니다’보다 문맥상 도착을 나타내는 ‘예루살렘에 이르렀습니다’가 ἔρχονται에 더 알맞습니다.
  terminology: ‘환전상’, ‘비둘기’, ‘상’, ‘내쫓다’는 문맥과 원어에 적절합니다. 판매자와 구매자의 병렬을 분명히 하기 위해 ‘사고팔던 자들’은 ‘파는 사람들과 사는 사람들’로 고쳤습니다. ‘성전’에는 ἱερόν의 공간적 범위를 밝히는 주석을 답니다.
  issues:
  - severity: medium
    issue: 연결 어미와 시제의 부조화
    rationale: ‘내쫓기 시작하시며’는 뒤의 ‘뒤엎으셨습니다’와 자연스럽게 병렬되지 않습니다. 원문의 ‘시작하다 + 부정사’ 구문은 ‘내쫓기 시작하시고’로 옮기는 것이 정확하고 자연스럽습니다.
  - severity: low
    issue: 판매자와 구매자의 병렬이 덜 분명함
    rationale: ‘사고팔던 자들’도 의미상 가능하지만, 원문은 파는 이들과 사는 이들을 명시적으로 병렬합니다. 이를 한국어에서도 드러내는 편이 최적 등가에 부합합니다.
  - severity: low
    issue: ἱερόν의 범위에 관한 주석 누락
    rationale: ‘성전’은 통용 번역으로 적절하지만, 여기서는 특히 내소가 아니라 성전 경내·구역을 가리킵니다. 독자가 공간을 과도하게 좁혀 이해하지 않도록 주석이 유익합니다.
