  text: 그들에게 말씀하셨습니다. 「여러분 맞은편 마을로 가십시오. 그리로 들어가는 즉시, 아직 아무도 탄 적이 없는 묶여 있는 나귀 새끼를 발견할 것입니다. 그것을 풀어 데려오십시오.
  philosophy: optimal-equivalence
