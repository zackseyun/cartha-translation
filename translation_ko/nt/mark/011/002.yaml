    rationale: 문장 구조상 인용문이 종결되지 않아 표기 및 구조적 완결성이 필요합니다.
  - severity: low
    issue: ‘아직 아무도 탄 적이 없는 묶여 있는 나귀 새끼’는 두 관형절의 연결이 어색하고 일시적으로 수식 범위가 불명확합니다.
    rationale: ‘묶여 있는 나귀 새끼가, 아직 아무도 타 본 적이 없는’ 순으로 배열하면 원문의 두 진술을 명료하고 자연스럽게 전달합니다.
  revised_text: 그들에게 말씀하셨습니다. 「여러분 맞은편에 있는 마을로 가십시오. 그곳에 들어가는 즉시, 묶여 있는 나귀 새끼가 아직 아무도 타 본 적이 없는 것을 발견할 것입니다. 그것을 풀어 데려오십시오.」
