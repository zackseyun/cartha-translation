  naturalness: '"그 나무에게 대답하여 말씀하셨습니다" is understandable, though the Greek''s narrative idiom can sound marked in Korean as it does in Greek. "아무도 다시는 네게서 열매를 먹지 못하게 되기를 바랍니다" is a natural formal expression of the wish without recasting it as a prediction. The narration consistently uses modern formal-polite style.'
  terminology: '"열매," "제자들," and the direct second-person address are appropriate. "영원토록" accurately conveys εἰς τὸν αἰῶνα in this imprecatory context; "다시는" conveys μηκέτι.'
