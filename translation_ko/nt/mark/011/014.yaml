  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
  footnotes:
  - marker: a
    text: Or, more literally, 'And answering, he said to it.' The verb 'answering' is a common narrative idiom in Greek even when no explicit prior speech is recorded.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''May no one eat fruit from you forever.'' Greek: ''into the age.'''
    reason: alternative_reading
  - marker: c
    text: 'The Greek imperfect can also be rendered ''heard'': ''And his disciples heard it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그분께서 그 나무에게 대답하여 말씀하셨습니다. 「아무도 다시는 영원토록 네게서 열매를 먹지 못하게 되기를 바랍니다.[a]」 그리고 그분의 제자들은 듣고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “아무도 다시는 영원토록 네게서 열매를 먹지 않기를.” 그리스어 동사는 소망 또는 저주의 뜻을 나타냅니다.
    reason: The aorist optative φάγοι is an imprecatory wish, not a simple future statement.
  - marker: b
    text: 또는 “들었습니다.” 그리스어 미완료형은 계속 듣고 있던 상황을 나타낼 수 있습니다.
    reason: The imperfect ἤκουον may be translated either duratively or with a simple past in Korean.
