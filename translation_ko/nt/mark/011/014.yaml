  to: 그리고 그분께서 그 나무에게 대답하여 말씀하셨습니다. 「아무도 다시는 영원토록 네게서 열매를 먹지 못하게 되기를 바랍니다.[a]」 그리고 그분의 제자들은 듣고 있었습니다.[b]
