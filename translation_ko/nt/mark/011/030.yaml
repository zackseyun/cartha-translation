base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
  footnotes:
  - marker: a
    text: Or 'from God.' The Greek reads 'from heaven,' preserving the Jewish idiom for divine origin or authority.
    reason: lexical_alternative
  - marker: b
    text: '''From men'' means ''from human beings,'' that is, of merely human origin or authority.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요한의 세례가 하늘에서[a] 온 것입니까, 사람들에게서[b] 온 것입니까? 내게 대답하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님에게서.’ 그리스어는 ‘하늘에서’라고 하며, 이는 신적 기원이나 권위를 가리키는 유대적 완곡어법입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람들에게서’는 인간에게서, 곧 단지 인간적인 기원이나 권위에서라는 뜻입니다.
    reason: lexical_alternative
