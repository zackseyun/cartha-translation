  source_fidelity: 초안의 ‘오시는’은 문법상 ‘나라’보다 ‘다윗’을 수식하는 것으로도 읽혀, ἡ ἐρχομένη βασιλεία(‘다가오는 나라’)의 수식 관계가 불분명합니다. 또한 끝의 닫는 인용 부호는 본문에 근거가 없습니다. ‘가장 높은 곳에서’는 ἐν τοῖς ὑψίστοις를 직접적으로 보존합니다.
