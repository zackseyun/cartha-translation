  terminology: ‘호산나’는 신약의 예전적 환호라는 용례를 보존하는 음역이 적절합니다. 그 어원적 간구 의미는 각주에서 제시합니다. ‘우리 조상 다윗’은 τοῦ πατρὸς ἡμῶν Δαυίδ의 조상 존칭을 무리 없이 반영합니다.
