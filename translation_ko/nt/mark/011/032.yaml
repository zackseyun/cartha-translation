base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
  footnotes:
  - marker: a
    text: Or, “From human beings,” or more interpretively, “Of human origin.”
    reason: lexical_alternative
  - marker: b
    text: The Greek can also be rendered, “everyone held John to be a prophet indeed.”
    reason: lexical_alternative
translation:
