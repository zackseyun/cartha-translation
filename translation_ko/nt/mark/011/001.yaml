revisions:
- from: 그리고 그들이 예루살렘에 가까이 와서, 올리브 산 근처 벳바게와 베다니에 이르렀을 때, 그분께서 제자들 가운데 둘을 보내시며
  to: 그들이 예루살렘에 가까이 와서 올리브 산 근처의 벳바게와 베다니에 이르렀을 때, 그분께서는 제자들 가운데 두 사람을 보내십니다.
