review_pass:
  verdict: revise
  source_fidelity: 초안은 μόδιον을 ‘말’로 옮겨 현대 한국어에서 ‘말’(horse)로 오해될 수 있으며, τεθῇ의 수동 목적 표현과 Μήτι의 부정 답변을 예상하는 수사 의문문의 뉘앙스를 충분히 드러내지 못합니다. 또한 인용부호가 닫히지 않았습니다. ‘등불이 … 들어오다’라는 의인화된 능동 이미지는 보존하는 것이 적절합니다.
  naturalness: ‘곡식 계량 그릇 아래’는 현대 표준어에서 자연스럽고 의미가 분명합니다. ‘두려고 들어오겠습니까?’는 원문의 목적절과 부정적 답변을 기대하는 질문을 합쇼체로 무리 없이 재현합니다.
  terminology: λύχνος는 ‘등불’, κλίνη는 ‘침상’, λυχνία는 ‘등잔대’로 옮겼습니다. μόδιον은 한국의 특정 도량형인 ‘말’로 단정하지 않고 ‘곡식 계량 그릇’으로 번역하며 각주에서 로마의 계량 용기임을 설명합니다.
  issues:
  - severity: medium
    issue: ‘말 아래’는 현대 한국어에서 동물 ‘말’로도 읽힐 수 있고, μόδιος의 용기 의미가 불분명합니다.
    rationale: μόδιος는 곡물의 양을 재는 단위 및 그 계량 용기를 가리킵니다. 문화적으로 특정한 로마 단위를 한국의 ‘말’과 동일시하지 않는 표현이 필요합니다.
  - severity: medium
    issue: 첫 질문의 부정적 수사성 및 목적 표현이 초안에서 충분히 표현되지 않았습니다.
    rationale: Μήτι는 ‘아니다’라는 답을 예상하며, ἵνα τεθῇ는 ‘두려고/두기 위해’라는 목적을 나타냅니다.
  - severity: high
    issue: 인용부호가 닫히지 않았습니다.
    rationale: 완결된 본문 형식을 위해 닫는 인용부호가 필요합니다.
  revised_text: 그분이 그들에게 말씀하고 계셨습니다. “등불이 곡식 계량 그릇 아래에 두려고, 또는 침상 아래에 두려고 들어오겠습니까? 등잔대 위에 두려고 들어오는 것이 아니겠습니까?”
  revised_footnotes:
  - marker: a
    text: ‘곡식 계량 그릇’으로 번역한 그리스어 ‘모디오스’는 곡물을 재는 로마의 계량 단위와 그 용기를 가리킵니다. 전통적으로는 ‘말’ 또는 ‘부셸’로 번역하기도 합니다.
    reason: cultural_note
  revision_rationale: 원문의 의인화된 ‘등불이 들어오다’를 유지하되, 목적을 나타내는 두 ἵνα절을 ‘두려고’로 재현했습니다. 현대 독자에게 모호한 ‘말’을 피하고 문화적 배경은 각주로 보완했습니다. 문장부호와 인용부호를 완결했습니다.
