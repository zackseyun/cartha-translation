  - severity: low
    issue: ‘그분 둘레에 있던 자들’
    rationale: οἱ περὶ αὐτὸν을 지나치게 공간적으로 들리게 하고 현대 한국어로도 어색합니다. 더 넓은 주변 제자·추종자 집단이라는 구별을 유지하는 표현으로 바꾸는 것이 좋습니다.
