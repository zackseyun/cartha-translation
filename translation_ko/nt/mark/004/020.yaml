    issue: ‘삼십 배, 육십 배, 백 배가 된다’
    rationale: 원문은 ‘열매를 맺다’라는 동사 뒤에 수확량을 제시합니다. ‘~가 된다’보다 ‘~의 열매를 맺습니다’가 동사와 농경 비유를 더 정확히 반영합니다.
  - severity: medium
    issue: 합쇼체 및 문장 자연스러움
    rationale: ‘이러하니’와 ‘된다’는 요청된 현대 formal-polite 합쇼체에 일관되게 맞지 않으며, ‘좋은 흙에 뿌려진 자들’도 다소 경직됩니다.
  - severity: low
