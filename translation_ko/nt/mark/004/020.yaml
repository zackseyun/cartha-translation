  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 현재 문장은 종결부의 ‘된다’가 καρποφοροῦσιν(‘열매를 맺다’)의 동작을 다소 약화하며, 원문의 현재형 열거와 결속도 충분히 드러내지 못합니다. 원문의 ‘좋은 땅에 뿌려진 이들’, ‘듣고, 받아들이고, 열매를 맺는다’ 및 삼십·육십·백 배의 수확을 유지하도록 고쳤습니다.
  naturalness: ‘좋은 흙에 뿌려진 자들은 이러하니’는 현대 표준어 합쇼체 성경 문장으로 다소 어색합니다. ‘좋은 땅에 뿌려진 이들은’이 자연스럽고 비유의 농경 이미지를 유지합니다. 또한 초안 끝의 닫는 인용부호(」)는 짝이 없어 제거해야 합니다.
  terminology: ‘말씀’은 문맥상 λόγος의 반복되는 표현을 잘 살립니다. παραδέχονται는 ‘받아들이며’로 옮기고, 영어 감사 기록의 어휘 대안을 반영한 각주를 붙였습니다. ‘열매를 맺습니다’는 καρποφοροῦσιν에 적절합니다.
  issues:
