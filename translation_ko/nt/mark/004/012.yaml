  source_fidelity: 초안은 ἵνα와 μήποτε의 목적·경계 표현을 대체로 반영하지만, ‘보아도 깨닫지 못하게 하고, 들어도 알아듣지 못하게 하여’는 원문의 반복 강조(βλέποντες βλέπωσι, ἀκούοντες ἀκούωσι)와 병렬을 약화하고, ‘못하게 하고’는 원문보다 직접적인 사역 표현으로 들릴 수 있습니다. 또한 인용 부호가 불완전합니다.
  naturalness: ‘보기는 보아도’, ‘듣기는 들어도’는 반복되는 동사의 강조를 현대 표준어에서 자연스럽게 살립니다. ‘이해하지 못하고’는 συνιῶσιν에 적절하며, 전체는 합쇼체 종결로 정리했습니다.
  terminology: ἴδωσιν은 여기서 단순 시각보다 인식의 뜻이므로 ‘깨닫지 못하고’로, συνιῶσιν은 ‘이해하지 못하고’로 구별했습니다. ἐπιστρέψωσιν은 신학적으로 좁힌 ‘회개하다’ 대신 ‘돌이켜’로 유지했으며, ἀφεθῇ αὐτοῖς는 수동형을 살려 ‘용서받지 못하도록’으로 옮겼습니다.
