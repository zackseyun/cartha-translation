  source_fidelity: 현 번역의 ‘보아도 깨닫지 못하게 하고’와 ‘들어도 알아듣지 못하게 하여’는 그리스어의 접속법을 직접적인 사역/강제 표현으로 바꾸어 놓습니다. 또한 ‘돌이켜 용서받지 못하게’는 μήποτε의 유보적·경계적 뉘앙스를 충분히 드러내지 못합니다. 반복된 βλέποντες βλέπωσι 및 ἀκούοντες ἀκούωσι의 강조는 ‘보기는 보아도’, ‘듣기는 들어도’로 살릴 수 있습니다.
  naturalness: ‘보기는 보아도 … 듣기는 들어도’는 현대 표준 한국어에서 자연스럽고, 인용된 이사야 어법의 반복과 대조를 보존합니다. 문장 종결은 합쇼체로 ‘것입니다’를 사용했습니다.
  terminology: ἴδωσιν과 συνιῶσιν은 각각 ‘깨닫지 못하고’로 번역하여 한국어상 두 병렬 절을 자연스럽게 유지했습니다. ἐπιστρέψωσιν은 회개라는 신학 용어를 단정적으로 삽입하지 않고 ‘돌이켜’로 옮겼습니다. ἀφεθῇ αὐτοῖς는 ‘용서받다’로 적절히 옮겼습니다.
  issues:
  - severity: high
    issue: 사역적 표현의 추가
    rationale: ‘깨닫지 못하게 하고’와 ‘알아듣지 못하게 하여’는 원문의 ‘보아도 보지 못하고/들어도 깨닫지 못하는’ 표현을 하나님 또는 예수께서 직접 불가능하게 만드신다는 명시적 사역 구조로 강화합니다.
  - severity: medium
    issue: μήποτε의 뉘앙스 미반영
    rationale: ‘혹’과 ‘용서받을까 하여’를 사용하면 μήποτε의 ‘어쩌면 …할까 하여/lest’라는 유보적이고 난해한 경계의 뉘앙스를 보존할 수 있습니다.
  - severity: low
    issue: 인용부호의 불일치
    rationale: 초기 작은따옴표와 말미의 겹꺾쇠가 혼용되어 있으므로 일관된 한국어 큰따옴표로 정리하는 편이 좋습니다.
  revised_text: 이는 “그들이 보기는 보아도 깨닫지 못하고, 듣기는 들어도 깨닫지 못하여, 혹 돌이켜 용서받을까 하려는 것입니다.”
  revised_footnotes:
