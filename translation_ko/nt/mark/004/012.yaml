    text: 예수님께서는 여기서 이사야 6:9–10을 반영하여 말씀하십니다. ‘혹 … 용서받을까 하여’라는 표현은 심판과 인간의 응답 실패 사이의 긴장을 그대로 보존합니다.
    reason: cross_reference
  revision_rationale: 원문의 반복적·역설적 표현을 한국어의 ‘보기는 보아도/듣기는 들어도’로 보존하고, 사역 동사를 제거하여 원문보다 강한 인과성을 부과하지 않았습니다. μήποτε는 ‘혹 …할까 하여’로 옮겨 본문의 의도적으로 난해한 긴장을 완화하지 않았습니다.
