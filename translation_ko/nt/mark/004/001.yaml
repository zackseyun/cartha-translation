  to: 그분이 다시 바닷가에서 가르치기 시작하셨습니다. 아주 큰 무리가 그분에게 모여들자, 그분은 바다 위의 배에 올라 앉으셨고, 온 무리는 바닷가의 땅 위에 있었습니다.
  rationale: 군중의 크기를 나타내는 πλεῖστος를 문맥에 맞게 ‘아주 큰’으로 고쳤습니다. 원문이 말하는 배와 바다의 관계를 불필요한 설명 없이 자연스러운 한국어로 옮기고, 어색한 ‘바닷가 육지’를 ‘바닷가의 땅 위’로 수정했습니다. 역사적 현재 συνάγεται는 한국어의 자연스러운 서사 흐름을 위해 과거 서술에 통합했으며, 의미상의 손실은 없습니다.
