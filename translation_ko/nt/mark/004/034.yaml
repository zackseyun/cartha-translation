  terminology: ‘비유’, ‘제자’, ‘모든 것’은 적절합니다. ἐπέλυεν에는 교리적으로 한정하지 않는 ‘설명해 주셨습니다’를 사용하여 ‘해석하다’라는 가능한 뉘앙스도 과도하게 특정하지 않습니다.
