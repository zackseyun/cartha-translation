  verdict: revise
  source_fidelity: The draft correctly reflects the broad contrast between concealment and disclosure, but it weakens the Greek's two negated existential assertions ('nothing is hidden ... nor did anything become concealed ...') and does not distinguish the second clause's coming-to-be expression (ἐγένετο). The revision restores both assertions while retaining the ἵνα clauses' purposive/result-capable wording.
  naturalness: The revised Korean is modern, formal-polite standard Korean and reads naturally as a compact proverbial saying. ‘생겨난 것은 없습니다’ appropriately represents the second clause without adding an agent.
  terminology: ‘숨겨진/감추어진’ preserves the lexical parallelism of κρυπτόν and ἀπόκρυφον; ‘드러나다’ and ‘드러나게 되다’ naturally convey φανερωθῇ and ἔλθῃ εἰς φανερόν. The footnote preserves the debated purpose/result shade of ἵνα without doctrinally resolving it.
  issues:
  - severity: medium
    issue: The draft omits the explicit negative-existential force of both Greek clauses.
    rationale: ‘숨겨진 것은 드러나기 위함이요 ... 일 뿐이다’ states a general purpose but does not clearly say that no hidden or concealed thing exists except for disclosure.
  - severity: low
    issue: The draft flattens the second clause's distinct verb and movement toward openness.
    rationale: ἐγένετο denotes coming into a concealed state, and ἔλθῃ εἰς φανερόν means coming into what is open/visible. ‘생겨난’ and ‘드러나게 되다’ retain this progression naturally.
  revised_text: 왜냐하면 드러나기 위한 것이 아니면 숨겨진 것은 없고, 드러나게 되기 위한 것이 아니면 감추어진 것은 생겨난 것이 없습니다.[a]
