- from: '그러나 그분은 고물에서 베개를 베고 주무시고 계셨습니다. 그들이 그분을 깨우며 말하였습니다: 「선생님, 우리가 죽게 되었는데 돌보지 않으십니까?」'
  to: 한편, 그분께서는 배의 고물에서 베개[a]를 베고 주무시고 계셨습니다. 그들은 그분을 깨우고 그분께 말했습니다. 「선생님, 우리가 죽어 가고 있는데도 신경 쓰지 않으십니까?」
  rationale: 역접을 제거하여 원문의 단순 연결을 보존하고, 그분의 위치와 수면 상태를 자연스러운 한국어로 유지했습니다. 제자들의 말은 비난과 긴급성을 유지하면서도, ‘신경 쓰지 않으십니까?’로 οὐ μέλει σοι의 관용적 의미를 현대 표준어로 옮겼습니다. προσκεφάλαιον의 어휘적 범위는 각주로 남겼습니다.
