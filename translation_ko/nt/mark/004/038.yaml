review_pass:
  verdict: revise
  source_fidelity: 초안은 배의 고물, 잠, 제자들이 깨우고 부르는 장면을 대체로 전달합니다. 그러나 καί를 ‘그러나’로 옮겨 본문에 없는 대조를 만들었고, αὐτός의 강조가 약화되었습니다. 또한 ἀπολλύμεθα의 진행 중인 긴급성은 ‘죽게 되었는데’보다 ‘죽어 가고’가 더 충실합니다.
  naturalness: ‘배의 고물에서 베개를 베고 주무시고 계셨습니다’보다 ‘배의 고물에서 베개를 베고 주무시고 계셨습니다’는 자연스럽지만, 접속과 후속 동작을 분명히 하여 ‘그분께서는 ... 계셨습니다. 그들은 ... 깨우고 ... 말했습니다’로 다듬는 편이 현대 표준어 합쇼체 서술에 더 매끄럽습니다.
  terminology: πρύμνη는 ‘배의 고물’로 정확히 옮겼습니다. προσκεφάλαιον은 본문에서 자연스러운 ‘베개’로 옮기되, 머리를 받치는 쿠션/베개라는 어휘 범위를 각주로 보존합니다. διδάσκαλε는 ‘선생님’이 적절합니다.
  issues:
  - severity: medium
    issue: 접속사 ‘그러나’
    rationale: 그리스어 καί는 여기서 단순 연결(‘그리고/한편’)이며, ‘그러나’가 요구하는 역접은 본문에 명시되어 있지 않습니다.
  - severity: low
    issue: αὐτός의 강조
    rationale: ‘그분은’만으로는 ‘그분 자신/바로 그분’이라는 명시적 강조가 충분히 드러나지 않습니다. ‘그분께서는’과 문맥적 대조를 통해 자연스럽게 반영할 수 있습니다.
  - severity: medium
    issue: ἀπολλύμεθα의 상과 긴급성
    rationale: 현재형 ‘우리가 죽어 가고 있습니다’가 진행 중인 위기와 절박함을 ‘죽게 되었는데’보다 더 가깝게 전달합니다.
