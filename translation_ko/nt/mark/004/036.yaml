  source_fidelity: 초안의 ‘배에 모시고 갔습니다’는 예수님을 그때 배 안으로 모셔 들어간 것으로 읽힐 수 있습니다. 헬라어 ὡς ἦν ἐν τῷ πλοίῳ는 그분이 이미 배에 계신 상태였음을 나타내므로, 이를 명시하는 편이 충실합니다. ‘다른 배들도 그분과 함께 있었습니다’는 ἄλλα πλοῖα ἦν μετ’ αὐτοῦ를 잘 옮깁니다.
  naturalness: ‘그분을 배에 계신 그대로 데리고 갔습니다’는 현대 표준어 합쇼체에서 자연스럽고, 이미 배에 계셨다는 위치 정보와 ‘그대로’의 상태 정보를 무리 없이 보존합니다.
  terminology: ‘그분’과 존대 동사 ‘계신’은 본문 전체의 존대 문체와 조화를 이룹니다. παραλαμβάνουσιν에는 ‘데리고 갔습니다’가 적절하며, ‘모시고 갔습니다’보다 원문의 단순한 ‘데리고 가다’의 의미를 과도하게 높이지 않습니다.
  issues:
  - severity: medium
    issue: ‘배에 모시고 갔습니다’가 예수님을 배 안으로 데려간 행동으로 오해될 수 있습니다.
    rationale: ἐν τῷ πλοίῳ는 예수님이 이미 배 안에 계신 상태를 수식합니다. 한국어 어순상 ‘배에 … 갔습니다’는 목적지를 나타내는 것으로 읽히기 쉽습니다.
  revised_text: 그들은 무리를 떠나, 그분을 배에 계신 그대로 데리고 갔습니다. 다른 배들도 그분과 함께 있었습니다.
