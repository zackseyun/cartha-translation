  naturalness: '''큰 광풍''은 현대 표준어에서는 다소 문어적이고 ''광풍''이 비유적 의미로도 흔히 쓰입니다. ''큰 바람폭풍''은 원문의 μεγάλη 및 ἀνέμου를 살리면서 현대 한국어로 자연스럽습니다. ''밀려들어와''는 파도가 배 안으로 계속 들어오는 장면에 적절합니다.'
  terminology: πλοῖον은 갈릴리 호수의 문맥에서 '배'가 적절합니다. λαῖλαψ μεγάλη ἀνέμου는 '큰 바람폭풍'으로, 과도하게 해석하지 않고 어휘 요소를 보존합니다. 별도의 신학 용어는 없습니다.
