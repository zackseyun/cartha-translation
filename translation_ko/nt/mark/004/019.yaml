    issue: ‘세상의 염려’
    rationale: αἰών은 여기서 기본적으로 ‘시대’를 뜻하며, ‘세상’은 가능한 확장 번역이지만 시간적 뉘앙스를 본문에서 잃게 합니다.
  - severity: medium
    issue: ‘말씀을 막아 버려’
    rationale: συμπνίγουσιν은 ‘질식시키다, 숨 막히게 하다’라는 강한 비유입니다. ‘버려’는 원문에 없는 완료적 뉘앙스를 보탭니다.
  - severity: low
    issue: 마지막 ‘열매를 맺지 못한다’의 주어
    rationale: 원문의 단수 술어는 가장 가까운 단수 선행사인 ‘말씀’을 받습니다. 한국어에서는 주어를 밝혀 모호성을 줄일 수 있습니다.
