  source_fidelity: ‘세상의 염려’는 αἰών의 기본 의미인 ‘시대/시대 질서’를 ‘세상’으로 좁혀 옮깁니다. 또한 ‘막아 버려’는 συμπνίγω의 질식시키는 비유를 약화하고 완료·폐기의 뉘앙스를 더합니다. 최종 술어는 문맥상 말씀을 가리키므로 이를 한국어에서 분명히 하는 것이 좋습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 병렬된 세 요소가 모두 ‘들어와’ 말씀을 질식시킨다는 관계도 분명합니다.
  terminology: ‘말씀’은 λόγος의 문맥상 적절한 번역입니다. ‘이 시대’는 αἰών의 시간적·질서적 뉘앙스를 보존하며, ‘재물의 속임’은 부가 설명 없이 재물이 지닌 기만성을 자연스럽게 나타냅니다.
  issues:
