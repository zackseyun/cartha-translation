review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘세상’은 αἰών의 기본 뜻인 ‘시대/세대’보다 ‘세계’를 뜻하는 쪽으로 기울어져 있어, 본문의 시간적·현시대적 뉘앙스가 약해집니다. 또한 ‘막아 버려’는 συμπνίγω의 질식시키는 비유를 충분히 드러내지 못합니다. 수정문은 세 항목 전체가 들어와 말씀을 질식시키며, 그 결과 말씀이 열매를 맺지 못하게 된다는 문장 구조를 보존합니다.
  naturalness: ‘이 시대의 염려’, ‘재물의 기만’, ‘그 밖의 것들에 대한 욕망’은 현대 표준어에서 자연스럽고, ‘됩니다’로 합쇼체 문장 종결을 갖춥니다. ‘말씀을 질식시켜 열매를 맺지 못하게 합니다’는 한국어에서 주어를 불필요하게 반복하지 않으면서도 결과의 대상을 문맥상 분명히 합니다.
  terminology: λόγος는 문맥에 맞게 ‘말씀’으로 유지했습니다. ἀπάτη는 재물 자체가 사람을 오도하는 성격을 나타내므로 ‘재물의 기만’으로 옮겼습니다. ἄκαρπος γίνεται의 문법적 선행사는 가장 가까운 단수 명사인 ‘말씀’이지만 비유의 적용상 다른 이해도 가능하므로 각주로 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘세상의 염려’
    rationale: αἰῶνος는 여기서 기본적으로 ‘시대’를 뜻하며, ‘세상’은 가능한 확장 번역이지만 원문의 시간적 뉘앙스를 본문에서 약화시킵니다.
  - severity: medium
    issue: ‘말씀을 막아 버려’
    rationale: συμπνίγουσιν은 식물이 숨 막혀 자라지 못하는 이미지의 ‘질식시키다/숨 막히게 하다’에 가깝습니다. ‘막다’는 이 이미지를 일반화합니다.
  - severity: low
    issue: 합쇼체 종결 미비
    rationale: 초안의 ‘못한다’는 평서체이며, 지정된 현대 정중 합쇼체에 맞추어 ‘못하게 합니다’로 고칩니다.
  revised_text: 또 이 시대의 염려와 재물의 기만과 그 밖의 것들에 대한 욕망이 들어와 말씀을 질식시켜 열매를 맺지 못하게 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘세상의 염려’. 그리스어 ‘아이온’은 기본적으로 ‘시대’를 뜻하며, 문맥에 따라 현재의 세상 질서를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘재물의 속임’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그것이 열매 없는 것이 됩니다’. 가장 가까운 선행사는 ‘말씀’이지만, 비유의 식물이나 듣는 사람을 가리킨다고 이해하기도 합니다.
    reason: alternative_reading
  revision_rationale: 원문의 αἰών, συμπνίγω, 그리고 마지막 단수 서술의 문법적 모호성을 보존하도록 고쳤습니다. 세 가지 경쟁 요인이 모두 ‘들어와’ 말씀을 질식시키는 것으로 자연스럽게 연결했으며, 문체를 현대 표준 한국어 합쇼체로 통일했습니다.
