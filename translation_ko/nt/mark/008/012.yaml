  to: 그분은 속으로[a] 깊이 탄식하시며 말씀하십니다. “이 세대가 어찌하여 표적을 구합니까? 내가 진실로 너희에게 말합니다. 이 세대에는 표적이 주어지지 않을 것입니다.”
