  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τῷ πνεύματι αὐτοῦ의 내적·인격적 표현을 '자기 영으로'라고 하면 한국어에서 다소 도구적이며 부자연스럽게 들립니다. 자연스러운 본문에서는 '속으로'로 옮기고, 직역을 각주로 보완하는 것이 의미와 가독성을 함께 살립니다. εἰ로 시작하는 맹세적 부정은 '표적이 주어지지 않을 것입니다'로 적절히 전달되었습니다.
  naturalness: 초안은 서술부의 '말씀하셨습니다'와 직접 인용의 '말한다/않을 것이다'가 합쇼체 기준에서 일관되지 않습니다. 역사적 현재를 살려 '말씀하십니다'로 하고, 인용문도 '말합니다/않을 것입니다'로 통일하는 편이 현대 표준 한국어의 격식 있는 문체에 맞습니다.
