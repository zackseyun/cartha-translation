  rationale: Πόθεν, τις, ὧδε, χορτάσαι ἄρτων의 의미 관계를 한국어 문장 안에서 직접 드러내도록 ‘누가 여기 … 떡으로 … 배부르게 할 수 있겠습니까?’로 조정했습니다. 원문의 수사 의문과 합쇼체를 유지했습니다.
