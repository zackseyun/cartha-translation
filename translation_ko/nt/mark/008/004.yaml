    rationale: 원문은 ‘누가 여기서 이 사람들을 떡으로 배부르게 할 수 있겠는가’라고 묻습니다. 초안의 ‘어디서 떡을 얻어’는 자연스럽지만, 능력의 주체 τις와 장소 부사 ὧδε를 간접적으로 바꿉니다.
