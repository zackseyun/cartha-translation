  source_fidelity: 초안은 제자들과 무리를 함께 부르신 뒤 말씀하셨다는 큰 흐름과 제자도에 대한 세 명령을 대체로 반영합니다. 그러나 ‘무리를 자기 제자들과 함께 부르셔서’는 제자들이 예수와 함께 무리를 불렀다는 뜻으로도 읽힐 수 있으므로, 두 집단을 함께 부르신 것으로 명확히 해야 합니다. ἀράτω의 ‘들다/take up’에 맞는 관용적 표현인 ‘자기 십자가를 지고’는 유지할 수 있습니다.
  naturalness: 합쇼체는 적절하나, 문장을 종결하는 직접 인용 부호가 빠져 있어 구조상 수정이 필요합니다. 또한 ‘무리와 자기 제자들을 함께 불러’가 현대 표준 한국어에서 의미 관계를 더 자연스럽고 분명하게 드러냅니다.
