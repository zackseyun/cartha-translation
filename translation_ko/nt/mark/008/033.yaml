  rationale: 원문의 강한 호칭과 명령을 보존하면서, 지정된 합쇼체 문체를 일관되게 적용했습니다. 또한 φρονέω를 ‘마음에 두다’로 옮겨 하나님께 속한 일과 인간의 일 사이에서 어느 쪽을 지향하는지를 나타냈습니다. ‘사탄아’는 본문이 베드로에게 직접 하는 호칭을 그대로 유지하며, 그 존재론적 의미를 해설로 덧붙이지 않았습니다.
