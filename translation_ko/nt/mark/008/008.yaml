  text: 그들은 먹고 배불렀습니다. 그리고 남은 조각을 일곱 광주리 거두었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 스퓌리스(σπυρίς)는 광주리를 가리키며, 아마도 비교적 큰 바구니였을 것입니다. 마가는 오천 명을 먹이신 사건에서는 다른 단어인 코피노스(κόφινος)를 사용합니다(6:43).
    reason: σπυρίς의 가능한 크기와 마가복음 6:43에서 사용된 다른 바구니 명칭과의 어휘적 구별을 보존합니다.
