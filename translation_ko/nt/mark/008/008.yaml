  source_fidelity: 초안은 ‘먹고 배불렀고’로 ἔφαγον καὶ ἐχορτάσθησαν을 대체로 잘 옮겼습니다. 그러나 δεύτε 절의 주어를 ‘사람들은’으로 바꾸어 불필요하게 명시했고, ‘떡 부스러기’는 원문의 κλασμάτων(조각들)보다 좁은 표현입니다. 또한 περισσεύματα(남은 것)의 의미를 명시하는 편이 필요합니다.
  naturalness: ‘그들은 먹고 배불렀습니다. 그리고 남은 조각을 일곱 광주리 거두었습니다’는 현대 표준 한국어의 합쇼체 서술로 자연스럽고, 수거 행위와 수량을 분명히 전달합니다.
