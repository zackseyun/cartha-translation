  source_fidelity: 초안은 손을 잡아 마을 밖으로 데리고 나간 일과 눈에 침을 뱉은 일을 충실히 옮깁니다. 그러나 “그 위에 손을 얹으시며”는 손을 눈 위에 얹었다는 뜻으로 읽히기 쉬워, 여격 αὐτῷ(그 사람에게)를 반영하지 못합니다. 또한 τί를 “무엇이”로 옮기면 특정한 대상이 보이는지를 묻는 뉘앙스가 강해질 수 있으므로, 부정칭 ‘무엇인가/아무것’의 개방성을 살리는 편이 더 적절합니다.
  naturalness: ‘그에게 손을 얹으시고’와 ‘무엇인가 보이십니까?’는 현대 표준어 합쇼체 서술 및 직접 발화에 자연스럽습니다. ‘맹인’은 성경 문맥에서 통용되는 중립적 서술 명사로 유지할 수 있습니다.
  terminology: ‘손을 잡고’, ‘마을 밖으로 데리고 나가시고’, ‘손을 얹으시고’는 각각 원문의 구체적 동작을 적절히 반영합니다. πτύσας εἰς τὰ ὄμματα의 생생한 방향성은 본문에서 ‘눈에 침을 뱉으시고’로 유지하고, ‘눈 속에’라는 직역 가능성은 각주로 제시합니다.
  issues:
  - severity: medium
    issue: ‘그 위에 손을 얹으시며’의 지시 대상이 부정확합니다.
    rationale: 원문의 ἐπιθεὶς τὰς χεῖρας αὐτῷ는 손을 그 사람에게 얹었다는 뜻입니다. 초안은 바로 앞의 ‘눈’을 선행사로 삼아 손을 눈 위에 얹는 동작으로 오해될 수 있습니다.
  - severity: low
    issue: ‘무엇이 보이느냐?’는 τί의 부정칭 범위를 다소 좁힐 수 있고 합쇼체 직접 발화와도 일치하지 않습니다.
    rationale: Εἴ τι βλέπεις;는 ‘무엇인가/아무것이라도 보이십니까?’라는 개방적 질문입니다. ‘무엇인가 보이십니까?’가 이를 자연스럽게 보존합니다.
  revised_text: 그분이 그 맹인의 손을 잡고 마을 밖으로 데리고 나가신 뒤, 그의 눈에 침을 뱉으시고 그에게 손을 얹으시며 물으셨습니다. 「무엇인가 보이십니까?」
  revised_footnotes:
  - marker: a
    text: 직역하면, “그의 눈 속에 침을 뱉으시고.”
    reason: 원문의 εἰς(‘~속으로’)가 지닌 생생한 방향성을 제시합니다. 본문의 ‘눈에’는 자연스러운 한국어 표현입니다.
  revision_rationale: 손을 얹는 대상이 맹인임을 명확히 하여 원문의 여격을 반영했습니다. 질문은 τί의 부정칭 의미를 보존하고, 예수의 직접 질문을 현대 합쇼체로 일관되게 다듬었습니다. 침을 뱉는 행위의 물리성은 완화하지 않았으며, 더 직역적인 방향성은 각주에 남겼습니다.
