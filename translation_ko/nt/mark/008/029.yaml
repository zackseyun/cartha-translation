revisions:
- from: '그분이 그들에게 물으셨습니다: 「그러나 너희는 나를 누구라고 하느냐?」 베드로가 그분에게 대답하여 말하였습니다: 「당신은 메시아이십니다.」'
  to: 그분께서 그들에게 물으셨습니다. 「그러나 너희는 나를 누구라고 합니까?」 베드로가 그분께 대답했습니다. 「당신이 메시아이십니다.[a]」
  rationale: The revision regularizes the discourse into modern formal-polite Korean, removes an unnatural redundant response formula, retains the Greek plural contrast and Peter’s emphatic confession, and adds the Korean counterpart to the English alternative-rendering note. No doctrinal interpretation has been added.
