    text: 또는 “그리스도.”
    reason: alternative_reading
  revision_rationale: The revision regularizes the discourse into modern formal-polite Korean, removes an unnatural redundant response formula, retains the Greek plural contrast and Peter’s emphatic confession, and adds the Korean counterpart to the English alternative-rendering note. No doctrinal interpretation has been added.
