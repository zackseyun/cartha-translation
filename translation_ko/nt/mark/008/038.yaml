  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: ko
  text: 이 음란하고 죄 많은 세대에서 누구든지 나와 내 말을 부끄러워하면, 인자께서도 자기 아버지의 영광 가운데 거룩한 천사들과 함께 오실 때에 그 사람을 부끄러워하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불충하고 죄 많은 세대’. ‘음란한’은 여기서 언약에 대한 불성실을 가리키는 예언자적 비유로도 쓰였습니다.
    reason: lexical_alternative
