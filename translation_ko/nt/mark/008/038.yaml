  source_fidelity: 수정이 필요합니다. μοιχαλίδι는 문자적으로 ‘간음하는/간음한’이라는 예언자적 비유를 지닌 표현인데, 초안의 ‘음란하고’는 성적으로 문란하다는 뜻으로 범위가 달라져 이 비유의 구체성을 약화합니다. 또한 γάρ의 설명적 연결은 ‘왜냐하면’으로 드러내는 것이 적절합니다.
  naturalness: ‘간음하며 죄 많은 이 세대’는 현대 표준어에서 자연스럽고, 세대를 향한 비유적·도덕적 규정을 유지합니다. 종결을 합쇼체인 ‘것입니다’로 고치고, 불필요한 닫는 인용부호를 제거합니다.
  terminology: ‘인자’, ‘영광’, ‘거룩한 천사들’은 원문의 제목과 핵심 용어를 충실히 보존합니다. ‘자기 아버지’는 αὐτοῦ를 자연스럽게 반영하며, ‘그 사람’을 사용하여 단수의 일반적 대상을 한국어답게 나타냅니다.
