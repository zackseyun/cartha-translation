    rationale: 열린 인용부호 없이 닫는 인용부호만 있어 삭제해야 합니다.
  revised_text: 왜냐하면 이 간음하며 죄 많은 세대에서 누구든지 나와 내 말을 부끄러워하면, 인자도 자기 아버지의 영광 가운데 거룩한 천사들과 함께 올 때에 그 사람을 부끄러워할 것입니다.
