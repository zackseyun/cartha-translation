    rationale: μοιχαλίδι는 ‘간음하는(adulterous)’이라는 구체적 표현이며, 여기서는 언약적·도덕적 불충을 암시하는 예언자적 비유입니다. ‘음란한’은 주로 음란·외설 또는 성적 문란을 뜻하여 어휘적 초점이 달라집니다.
  - severity: low
