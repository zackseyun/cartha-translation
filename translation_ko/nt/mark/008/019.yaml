  source_fidelity: 원문의 시간절(ὅτε), ‘다섯 개의 떡’, ‘오천 명을 위해’, 남은 조각으로 가득 찬 광주리의 수, 그리고 제자들의 ‘열둘’이라는 응답을 충실히 반영합니다. ‘떼어 주다’처럼 원문에 없는 ‘주다’를 보태지 않고, κλάω의 ‘떼다’를 유지했습니다.
  naturalness: 초안의 ‘다섯 떡’은 현대 표준어에서 다소 부자연스럽고, 질문의 ‘거두었느냐’는 요구된 합쇼체와 맞지 않습니다. 직접 인용부호와 문장부호도 현대 한국어 표기에 맞게 정리해야 합니다.
  terminology: ‘떡’, ‘광주리’, ‘부스러기’는 본문의 의미와 한국어 성경 문체에 자연스럽게 부합합니다. ‘오천 명’은 원문의 관습적 군중 수 표기를 자연스럽게 옮기며 성별을 과도하게 특정하지 않습니다.
  issues:
