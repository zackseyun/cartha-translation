    issue: 대화체 높임말이 합쇼체가 아닙니다.
    rationale: ‘거두었느냐?’는 해라체 의문형입니다. 대상 변형의 현대 공식-공손 합쇼체에 맞춰 ‘거두어들였습니까?’로 고쳐야 합니다.
  - severity: low
    issue: 수량 표현과 인용부호 표기가 부자연스럽거나 잘못되었습니다.
    rationale: ‘다섯 떡’보다 ‘다섯 개의 떡’이 자연스럽고, 질문 끝의 닫는 인용부호만 있는 표기는 구조적으로 부정확합니다.
  - severity: low
    issue: ‘거두다’는 가능하지만 남은 조각을 모으는 행위에는 ‘거두어들이다’가 더 명료합니다.
    rationale: αἴρω는 이 문맥에서 남은 조각을 거두는 것을 뜻하므로, 의미를 유지하면서 자연스러운 현대어로 다듬을 수 있습니다.
