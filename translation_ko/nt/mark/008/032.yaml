  rationale: παρρησίᾳ의 문맥상 핵심인 솔직하고 분명한 발화를 “분명히”로 옮겼습니다. προσλαβόμενος는 문맥에 따라 베드로가 예수님을 따로 데리고 간 행위로 번역하되, 원문에 없는 공경 행위의 뉘앙스는 피했습니다. 나머지 문장 구조와 진행상, 그리고 ἐπιτιμᾶν의 강한 책망의 의미는 유지했습니다.
