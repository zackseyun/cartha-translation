review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the progressive sense of ἐλάλει and the sequence in which Peter begins to rebuke Jesus. However, “드러내 놓고” is less precise and less natural here than “분명히,” and “모셔 가서” adds a deferential nuance not expressed by προσλαβόμενος.
  naturalness: “이 말씀을 분명히 하셨습니다” and “따로 데리고 가서” are idiomatic modern standard Korean in formal-polite narrative style.
  terminology: “꾸짖다” appropriately renders ἐπιτιμάω. “말씀” is suitable for λόγον in this context; “그분” consistently reflects the established reverential Korean reference to Jesus without altering the source meaning.
  issues:
  - severity: medium
    issue: “드러내 놓고” for παρρησίᾳ
    rationale: Although it can convey openness, it has a somewhat colloquial and potentially spatial/exposing sense. In this context of clear, frank speech, “분명히” is more natural and accurately preserves the sense of speaking plainly.
  - severity: medium
    issue: “옆으로 모셔 가서” for προσλαβόμενος
    rationale: “모시다” introduces an explicit honorific/deferential action by Peter that the Greek verb does not state. “따로 데리고 가서” conveys the contextual sense of taking Jesus aside without this added nuance.
  revised_text: 그분이 이 말씀을 분명히 하셨습니다.[a] 그러자 베드로가 그분을 따로 데리고 가서 그분을 꾸짖기 시작하였습니다.
