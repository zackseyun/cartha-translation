  source_fidelity: 초안은 ‘자기 집으로 보내시며’와 마을에 들어가지 말라는 명령의 기본 뜻을 대체로 반영합니다. 그러나 μηδέ의 강조(‘심지어/조차’)가 충분히 드러나지 않으며, ‘자기 집’은 한국어에서 주어인 예수님의 집으로 이해될 여지가 있어 αὐτοῦ가 가리키는 치유받은 사람의 집을 더 분명히 해야 합니다.
  naturalness: 서술은 합쇼체이나 직접 명령 ‘말라’는 문체가 평서부의 ‘말씀하셨습니다’와 일치하지 않습니다. ‘들어가지도 마십시오’가 현대 표준어 합쇼체이며 μηδέ의 강조도 자연스럽게 살립니다.
  terminology: ‘그분’은 존칭 대명사로 무방합니다. ‘마을’은 κώμη에 적절합니다. 본문에 없는 ‘마을에서 아무에게도 말하지 말라’는 내용을 본문에 넣지 않고, 사본 이문으로 각주 처리해야 합니다.
