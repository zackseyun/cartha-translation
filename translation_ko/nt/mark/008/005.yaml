  verdict: revise
  source_fidelity: The draft accurately conveys the question and the reply, including the counted loaves and the number seven. The imperfect ἠρώτα is naturally represented by 물으셨습니다 in this narrative context. However, 너희 is mismatched with the required modern formal-polite speech level.
  naturalness: The narration is clear, but a direct question ending in 있느냐 alongside formal-polite narration is register-inconsistent. Modern standard Korean in 합쇼체 calls for 있습니까. Sentence-final colons are also less natural here than ordinary quotation punctuation.
  terminology: 떡 is the established Korean biblical rendering for ἄρτοι and is appropriate. 일곱 개 correctly represents the seven loaves.
  issues:
  - severity: medium
    issue: Direct-speech register mismatch
    rationale: 너희에게 … 있느냐 is informal/plain speech, whereas the target variant requires modern formal-polite 합쇼체. Use 여러분에게 … 있습니까 to maintain a consistent formal-polite register.
  - severity: low
    issue: Quotation punctuation and response transition
    rationale: Replacing the colons with sentence punctuation and adding a modest response transition produces more natural modern Korean without altering the Greek's simple narrative sequence.
