  text: 예수님께서 이를 아시고 그들에게 말씀하셨습니다. 「어찌하여 너희는 떡이 없다는 것을 두고 의논하느냐? 아직도 깨닫지 못하고 이해하지 못하느냐? 너희의 마음들이 굳어 있느냐?」
