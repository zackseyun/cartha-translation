  verdict: revise
  source_fidelity: 그리스어의 대조와 인과관계, 그리고 βίος의 '생계/생활 수단' 의미는 대체로 반영되었습니다. 그러나 '이는 모두는'은 문법적으로 부자연스럽고, ἐκ τῆς ὑστερήσεως αὐτῆς는 '가난한 가운데서'보다 '궁핍한 가운데서/궁핍함 속에서'가 결핍의 뜻을 더 직접적으로 드러냅니다. 끝의 닫는 인용부호는 문단 내 단독 절에서 구조상 불필요합니다.
  naturalness: 현대 표준 한국어 합쇼체로는 '그들은 모두 자신들에게 남는 것에서 넣었지만' 및 '이 여자는 자기의 궁핍함 가운데서'가 자연스럽습니다. '모두는'의 중복 주제 표지는 피하는 편이 좋습니다.
  terminology: '''생계 전부''는 ὅλον τὸν βίον αὐτῆς의 경제적 의미를 적절히 전달합니다. 다만 ''자기의 생계 전부''보다 ''자기의 생계 전부를''은 유지하되, 앞의 ''자기가 가진 모든 것''과 동격임을 ''곧''으로 명료하게 하는 것이 좋습니다.'
  issues:
  - severity: medium
    issue: '''이는 모두는''이라는 표현'
    rationale: γάρ의 설명 관계를 나타내려는 의도는 보이나, '이는'과 '모두는'의 결합은 한국어 문장으로 부자연스럽습니다. '그들은 모두'로 주어를 명료히 하고 문두의 '이는'은 삭제하는 것이 적절합니다.
  - severity: low
    issue: '''자신들의 풍족함에서'''
    rationale: ἐκ τοῦ περισσεύοντος αὐτοῖς는 단순한 풍족함보다 필요를 넘어서 남는 것을 가리킵니다. '자신들에게 남는 것에서'가 문맥상 더 정확하고 자연스럽습니다.
  - severity: low
    issue: 불필요한 닫는 인용부호
    rationale: 제시된 본문에는 대응하는 여는 인용부호가 없으므로 제거해야 합니다.
  revised_text: 그들은 모두 자신들에게 남는 것에서 넣었지만, 이 여자는 자기의 궁핍함 가운데서 자기가 가진 모든 것, 곧 자기의 생계 전부를 넣었기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “자기가 살아가는 데 필요한 모든 것.”
    reason: ὅλον τὸν βίον αὐτῆς의 βίος는 여기서 생물학적 생명이 아니라 생활 수단 또는 생계를 가리킵니다.
  revision_rationale: 문장의 인과관계(γάρ)와 대조(δέ)를 보존하면서 현대 한국어의 자연스러운 어순으로 다듬었습니다. '남는 것'은 περισσεύοντος의 잉여 의미를, '궁핍함'은 ὑστέρησις의 결핍 의미를 반영합니다. '생계 전부'는 βίος를 문자적으로 '생명'으로 오해하지 않도록 하며, 각주에서 가능한 설명적 번역을 제시합니다.
