  terminology: πρωτοκαθεδρίας는 ‘높은 자리’, πρωτοκλισίας는 잔치의 가장 명예로운 자리라는 뜻으로 ‘윗자리’로 옮겼습니다. ‘잔치’는 δείπνοις의 격식 있고 공적인 식사 맥락에 알맞습니다. 별도 각주는 필수적이지 않습니다.
