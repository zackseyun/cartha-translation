  source_fidelity: 초안의 ‘차지하고’는 πρωτοκαθεδρίας/πρωτοκλισίας가 앞 절의 θελόντων(원하는 사람들)에 이어지는 목적어라는 문법적 관계를 ‘실제로 차지하다’로 바꾸므로, 원문의 욕망·추구의 뜻을 보존하지 못합니다. ‘율법학자들을 조심하십시오’는 12:38에서 이어지는 선행 문맥을 한국어에서 완결되게 드러내는 보충으로 허용됩니다.
