  text: 예수님께서 제자들을 불러 가까이 오게 하시고 그들에게 말씀하셨습니다. “진실로 내가 여러분에게 말합니다. 이 가난한 과부가 헌금함[a]에 넣고 있는 모든 사람보다 더 많이 넣었습니다.”
