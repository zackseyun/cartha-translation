  text: 예수께서 헌금함[a] 맞은편에 앉으셔서, 무리가 어떻게 헌금함에 돈을 넣고 있는지를 보고 계셨습니다. 많은 부자들도 많이 넣고 있었습니다.
  philosophy: optimal-equivalence
