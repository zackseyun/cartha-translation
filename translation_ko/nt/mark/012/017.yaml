  naturalness: ‘그분으로 인하여 크게 놀랐습니다’는 현대 표준 한국어로 다소 직역투이며, 사람이 놀라움의 대상일 때는 ‘그분을 매우 놀랍게 여겼습니다’가 더 자연스럽습니다. ‘가이사’는 한국어 성경 및 현대 한국어의 통용 표기입니다.
