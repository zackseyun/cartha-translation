  source_fidelity: 그리스어의 네 항목(마음, ψυχή, διάνοια, 힘)과 각 항목에 반복되는 ‘온/모든’의 강조를 유지해야 합니다. κύριον은 이 셰마 인용의 문맥상 ‘야훼’로 옮길 수 있습니다. 다만 초안의 ‘목숨’은 가능한 의미이지만 ψυχή의 전통적·문맥적 대응어인 ‘영혼’을 본문에 두고 대안을 각주로 제시하는 편이 어휘적 구별을 더 잘 보존합니다.
  naturalness: 초안은 ‘너는/네’와 ‘사랑하여라’가 해라체이므로 요구된 현대 합쇼체와 맞지 않습니다. ‘당신은 … 사랑해야 합니다’는 단수 명령의 인용 형식을 유지하면서 현대의 격식 있는 문체로 자연스럽습니다. ‘온 마음과 온 영혼과 온 생각과 온 힘을 다하여’는 반복 구조를 분명하게 살립니다.
  terminology: ‘야훼’는 제공된 프로젝트 용어 결정 및 신명기 6장 인용 문맥과 일치합니다. καρδία는 ‘마음’, ψυχή는 ‘영혼’, διάνοια는 ‘생각’, ἰσχύς는 ‘힘’으로 옮기고, 영어 감사 기록의 어휘 대안은 한국어 각주로 보존합니다.
