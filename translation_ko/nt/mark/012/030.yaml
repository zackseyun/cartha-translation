translation:
  language: ko
  text: 당신은 당신의 하나님 야훼를 온 마음과 온 영혼[a]과 온 생각[b]과 온 힘[c]을 다하여 사랑해야 합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영혼’(ψυχῆς)은 ‘목숨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생각’(διανοίας)은 ‘이해력’으로도 옮길 수 있습니다.
