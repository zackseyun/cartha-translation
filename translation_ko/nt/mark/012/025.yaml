review_pass:
  verdict: revise
  source_fidelity: 초안은 부활 뒤 혼인이 없고 천사와 같다는 핵심은 전달하지만, γάρ의 설명적 연결이 빠졌고, ἀναστῶσιν의 능동형은 ‘살아날’보다 ‘일어날’로 옮기는 편이 적절합니다. 또한 εἰσίν은 ‘됩니다’가 아니라 현재의 비교 서술인 ‘같습니다’로 옮겨야 하며, ‘하늘에서’는 천사들을 수식하도록 명확히 해야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, ‘장가가다/시집가다’는 두 그리스어 동사의 관습적으로 구별된 표현을 한국어에서 무리 없이 보존합니다.
  terminology: ‘죽은 사람들 가운데서’, ‘장가가다/시집가다’, ‘하늘에 있는 천사들’은 본문의 부활 및 혼인 관련 표현과 비교 표현을 충실히 반영합니다. ‘천사들과 같습니다’는 인간이 천사가 된다는 뜻을 피하고 비교만 나타냅니다.
  issues:
  - severity: medium
    issue: γάρ의 설명적 연결이 누락되었습니다.
    rationale: ὅταν γὰρ는 앞선 논증을 잇는 ‘이는/왜냐하면 … 때문입니다’의 설명 기능을 지닙니다.
  - severity: medium
    issue: ‘살아날’은 원문의 능동형 ἀναστῶσιν을 충분히 반영하지 못합니다.
    rationale: 여기서는 수동형 ‘일으킴을 받을’이 아니라 능동형 ‘일어날’이 원문 형태에 더 가깝습니다.
  - severity: high
    issue: ‘천사들과 같이 됩니다’는 εἰσίν의 현재 서술을 변화·전환의 뜻으로 바꿉니다.
    rationale: 원문은 ‘천사들과 같다’는 비교이지 ‘천사들과 같이 된다’는 변화를 진술하지 않습니다.
  - severity: medium
    issue: ‘하늘에서’의 수식 관계가 모호합니다.
    rationale: ἐν τοῖς οὐρανοῖς는 문맥상 천사들의 위치를 나타내므로 ‘하늘에 있는 천사들’로 명확히 하는 것이 좋습니다.
  revised_text: 이는 죽은 사람들 가운데서 일어날 때에는 장가가지도 시집가지도 않고, 하늘[a]에 있는 천사들과 같기 때문입니다.
