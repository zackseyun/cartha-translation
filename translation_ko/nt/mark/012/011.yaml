  source_fidelity: παρὰ κυρίου는 여기서 출처를 나타내므로 ‘주께로부터’가 적절합니다. SBLGNT의 κύριος 및 제공된 영어 감사 기록의 기본 번역을 따라 ‘야훼’가 아니라 ‘주’로 옮겨야 합니다. αὕτη는 앞선 돌의 비유 전체를 가리키므로 ‘이것’으로 유지할 수 있습니다.
  naturalness: 초안의 ‘우리 눈에 놀랍게 보인다’는 다소 어색하고 합쇼체도 아닙니다. ‘우리 눈에는 놀랍습니다’가 원문의 관용 표현을 살리면서 현대 표준 한국어 합쇼체에 맞습니다. 인용부호도 닫는 부호 하나만 남겨야 합니다.
  terminology: κύριος를 ‘야훼’로 특정하는 것은 그리스어 본문의 표면적 표현과 영어 POB의 ‘Lord’ 정책을 벗어납니다. 시편의 배경은 각주에서 밝힐 수 있으나, 본문은 ‘주’로 유지합니다.
