  source_fidelity: 원문의 καί는 단순 연결인데, 초안의 ‘그래서’와 ‘-으나’는 원문에 없는 인과·대조를 더합니다. 또한 ‘남기지 못하고’는 능력이나 실패의 뉘앙스를 보태므로, μή καταλιπών의 단순 부정은 ‘남기지 않은 채’로 옮기는 것이 더 충실합니다. σπέρμα는 이 문맥에서 ‘자손’이 적절합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 앞 절의 계대결혼 문맥을 반영한 ‘아내로 맞이하다’도 명료합니다. ‘셋째도 마찬가지였습니다’는 원문의 생략적 표현을 자연스럽게 재현합니다.
  terminology: ‘자손’은 σπέρμα의 문맥상 의미를 잘 전달합니다. ἔλαβεν αὐτήν은 결혼 문맥에서 ‘아내로 맞이했다’로 번역하되, 직역 가능성을 각주로 밝혀 원문의 표현도 보존합니다.
  issues:
  - severity: medium
    issue: ‘그래서’와 ‘-으나’가 원문에 없는 인과 및 대조를 암시합니다.
    rationale: καί는 여기서 사건을 단순히 이어 주며, 두 사건 사이의 인과나 역접을 표시하지 않습니다.
  - severity: medium
    issue: ‘자손을 남기지 못하고’가 불필요한 무능·실패의 뉘앙스를 더합니다.
    rationale: μή καταλιπών은 ‘남기지 않고/남기지 않은 채’라는 부정적 사실을 말할 뿐, ‘하지 못했다’는 양태를 명시하지 않습니다.
  revised_text: 둘째도 그 여자를 아내로 맞이하고 자손을 남기지 않은 채 죽었으며, 셋째도 마찬가지였습니다.
