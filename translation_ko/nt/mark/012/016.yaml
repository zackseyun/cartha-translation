  text: 그러자 그들이 그것을 가져왔습니다[a]. 그분께서 그들에게 말씀하셨습니다. 「이 초상과 새긴 글은 누구의 것입니까?」 그들이 그분께 말했습니다. 「카이사르의 것입니다.」
