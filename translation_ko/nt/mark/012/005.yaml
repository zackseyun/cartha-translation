  terminology: 비유의 선행 문맥에서 가리키는 사람들을 '종'으로 일관되게 표현했습니다. δέρω는 과도하게 특정하지 않고 '때리다'로, ἀποκτείνω는 '죽이다'로 옮겼습니다.
