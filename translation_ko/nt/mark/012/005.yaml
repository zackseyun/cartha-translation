  source_fidelity: 초안의 마지막 절은 '많은 다른 사람들도 보냈으나'라고 하여 누가 보냈는지와 때리고 죽인 주체가 불분명하며, 문맥상 주인이 많은 다른 종들을 보내고 소작인들이 그들을 학대했다는 그리스어의 관계를 충분히 드러내지 못합니다. 수정문은 생략된 '보냈습니다'를 문맥에 따라 보충하고, οὓς μὲν ... οὓς δὲ의 분배를 명확히 반영합니다.
