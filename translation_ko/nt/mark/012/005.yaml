    rationale: 초안은 '많은 다른 사람들도 보냈으나, 어떤 자들은 때리고, 어떤 자들은 죽였습니다'라고 하여 많은 사람들이 보냄의 주체처럼 읽히거나, 누가 누구를 때리고 죽였는지가 흐려집니다. 원문은 주인이 많은 다른 종들을 보냈고 소작인들이 그들 중 일부를 때리고 일부를 죽였다는 뜻입니다.
