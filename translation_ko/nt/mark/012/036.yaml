  to: 다윗 자신이 성령 안에서[a] 이렇게 말씀하셨습니다. “주께서[b] 내 주께 말씀하셨습니다. ‘내가 네 원수들을 네 발 아래에 둘 때까지 내 오른편에 앉아 있어라.’”
  rationale: 그리스어 본문에 충실하게 두 κύριος를 모두 ‘주’로 유지했습니다. 시편 110:1의 히브리어 배경에서 첫 호칭과 둘째 호칭이 구별된다는 정보는 유익하지만, 마가의 그리스어 본문 자체에 없는 어휘적 구별이므로 각주로 옮겼습니다. 또한 성령 관련 전치사구의 가능한 해석을 각주로 보완하고, 인용부호를 구조적으로 정리했습니다.
