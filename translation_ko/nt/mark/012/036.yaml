  source_fidelity: 초안은 αὐτός의 강조와 인용문의 기본 구조를 대체로 반영하지만, 그리스어 본문의 두 κύριος를 각각 ‘야훼’와 ‘주’로 구별한 것은 SBLGNT 본문에 없는 히브리어 본문의 구별을 본문에 도입한 것입니다. 마가의 그리스어는 양쪽 모두 κύριος이므로, 본문에서는 둘 다 ‘주’로 옮기고 히브리어 배경의 구별은 각주로 처리하는 것이 적절합니다. 또한 ἐν τῷ πνεύματι τῷ ἁγίῳ는 ‘성령 안에서’로 보존했습니다.
  naturalness: ‘다윗 자신이 성령 안에서 이렇게 말씀하셨습니다’는 현대 한국어의 격식 있는 성경 문체로 자연스럽고, 인용 안의 발화는 중첩 인용부호로 명료하게 제시했습니다. ‘내 오른편’과 ‘네 발 아래’는 왕권·복종의 비유를 자연스럽게 보존합니다.
  terminology: κύριος는 두 차례 모두 ‘주’로 일관되게 번역했습니다. 첫 ‘주’가 시편 히브리어 본문에서 신명에 해당한다는 정보는 번역 본문이 아닌 각주에 두었습니다. ‘성령’은 τῷ πνεύματι τῷ ἁγίῳ에 대한 표준적이고 적절한 번역입니다.
