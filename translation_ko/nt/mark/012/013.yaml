    reason: lexical_alternative
  revision_rationale: The revision clarifies the representatives from both groups and renders the hunting-derived entrapment metaphor in idiomatic Korean. It retains the source text’s unspecified “그들이,” its narrative past rendering, and the instrumental ambiguity of “말로.”
