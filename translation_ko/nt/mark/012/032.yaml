  text: 그러자 그 율법학자가 그분께 말했습니다. “잘 말씀하셨습니다, 선생님. 그분은 한 분이시며[a], 그분 외에 다른 이는 없다고 참으로 말씀하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
