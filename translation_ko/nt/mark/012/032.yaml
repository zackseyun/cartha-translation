    text: 문맥상 ‘하나님은 한 분이시며’라는 뜻입니다. 그러나 그리스어 본문은 여기서 ‘하나님’을 명시하지 않고, 단지 ‘그분은 한 분이시며’라고 합니다.
    reason: The Greek phrase εἷς ἐστιν has an implicit subject supplied by the preceding context; the note clarifies the referent without expanding the main text.
