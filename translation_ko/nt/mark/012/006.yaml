translation:
  language: ko
  text: 그에게는 아직 한 사람, 곧 사랑하는 아들이 있었습니다. 그는 마지막으로 그 아들을 그들에게 보내면서, “그들이 내 아들을 존중할 것이다”라고 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
