id: MRK.12.12
reference: Mark 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
  footnotes:
  - marker: a
    text: Or 'that he had spoken the parable with reference to them' or 'to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 그분을 붙잡으려고 하였으나, 무리를 두려워하였습니다. 그분께서 그들을 겨냥하여[a] 그 비유를 말씀하셨다는 것을 알았기 때문입니다. 그래서 그들은 그분을 그대로 두고 떠나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 두고” 또는 “그들에게.”
    reason: πρὸς αὐτούς는 이 문맥에서 그들을 겨냥한 의미를 나타내지만, 더 중립적으로는 ‘그들을 두고’ 또는 ‘그들에게’로 옮길 수도 있다.
