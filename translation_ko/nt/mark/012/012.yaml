  naturalness: The draft is generally natural in modern formal Korean. A small restructuring makes the causal relation clearer and avoids the potentially vague reflexive pronoun '자기들' in reference to the religious leaders.
  terminology: '''그분,'' ''무리,'' and ''비유'' are suitable. ''붙잡으려고 하였습니다'' is a natural rendering of κρατῆσαι in this context without importing the more formal sense ''arrest.'''
