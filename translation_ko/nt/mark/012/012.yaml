  to: 그러나 그들은 그분을 붙잡으려고 하였으나, 무리를 두려워하였습니다. 그분께서 그들을 겨냥하여[a] 그 비유를 말씀하셨다는 것을 알았기 때문입니다. 그래서 그들은 그분을 그대로 두고 떠나갔습니다.
