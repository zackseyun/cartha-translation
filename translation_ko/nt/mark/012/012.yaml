    rationale: '''붙잡으려고 하였습니다'' more naturally represents that they were attempting to seize him.'
  - severity: low
    issue: '''자기들을 향해'' can be momentarily ambiguous and does not explicitly preserve the audit trail''s alternative for πρὸς αὐτούς.'
    rationale: Using '그들을 겨냥하여[a]' gives the contextual adverse force, and a footnote preserves '그들을 두고' or '그들에게' as lexical alternatives.
