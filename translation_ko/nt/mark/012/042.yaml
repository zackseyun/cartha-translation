  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
  footnotes:
  - marker: a
    text: A lepton was a very small coin; two lepta equaled one Roman quadrans.
    reason: cultural_note
  - marker: b
    text: 'Or ''two small copper coins.'' Traditional English: ''two mites.'''
    reason: lexical_alternative
  - marker: c
    text: Quadrans is the Roman coin named in the Greek; older English versions often render it 'farthing.'
    reason: lexical_alternative
