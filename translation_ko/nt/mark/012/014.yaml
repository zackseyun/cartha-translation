  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
  footnotes:
  - marker: a
    text: Or, “you do not show partiality to people” or “you are not swayed by appearances.”
    reason: lexical_alternative
  - marker: b
    text: The Greek κῆνσος refers to the Roman census or poll tax.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들이 와서 그분께 말했습니다. “선생님, 우리는 선생님께서 진실한 분이시며 아무도 개의치 않으시고, 사람을 외모로 보지 않으시며, 참으로 하나님의 길을 가르치시는 줄 압니다[a]. 카이사르에게 인두세를 내는 것이 허용됩니까, 허용되지 않습니까? 우리가 내야 합니까, 내지 말아야 합니까?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “사람들의 얼굴을 보지 않으신다.” 이는 사람을 외모나 지위에 따라 편애하지 않는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 κῆνσος는 로마의 인구 조사와 관련된 인두세를 가리킵니다.
    reason: cultural_note
