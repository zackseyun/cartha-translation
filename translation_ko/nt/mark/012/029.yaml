  naturalness: ‘첫째는 이렇습니다’와 ‘이스라엘아, 들으십시오’는 현대 표준어 합쇼체에서 자연스럽고, 셰마의 엄숙한 호격과 명령을 유지합니다. 인용문 안의 병렬 호칭은 쉼표로 보존하되, 문장부호와 겹따옴표를 완결해야 합니다.
  terminology: ‘예수’, ‘이스라엘’, ‘하나님’, ‘야훼’는 일관되고 적절합니다. ‘야훼’에는 신명기 6:4의 신명 배경을 밝히는 주석을 달고, 마지막 선언에는 하나됨/배타성의 해석 가능성을 과도하게 단정하지 않는 대안 번역 주석을 둡니다.
