  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 관사+분사 구조(‘과부들의 집을 삼키고 … 길게 기도하는 자들’)를 ‘그들은 … 합니다’로 풀면 앞 문맥에 대한 의존성이 커지고, ‘보이기 위하여’는 προφάσει의 ‘겉치레/구실’ 뉘앙스를 충분히 드러내지 못합니다.
  naturalness: ‘집을 삼키고’는 직역으로 이해는 가능하지만 현대 한국어에서는 ‘집어삼키고’가 원문의 강한 비유를 유지하면서 더 자연스럽습니다. 초안 끝의 닫는 인용 부호(」)는 짝이 없어 삭제해야 합니다.
  terminology: ‘과부’, ‘기도’, ‘정죄’는 적절합니다. κρίμα는 이 문맥에서 ‘정죄’로 옮길 수 있으나 ‘심판’도 가능한 어휘적 대안이므로 각주로 보존하는 것이 좋습니다. προφάσει의 대안도 각주로 제시합니다.
  issues:
  - severity: medium
    issue: προφάσει의 의미가 ‘보이기 위하여’로 다소 약화됨
    rationale: 이 말은 단순히 타인에게 보이는 목적뿐 아니라 겉치레나 구실로 삼는 위선을 뜻합니다. ‘겉으로 보이려고’가 자연스럽게 그 기능을 더 잘 반영합니다.
  - severity: low
    issue: 원문의 명사화된 분사 구조가 평서문 ‘그들은’으로 전환됨
    rationale: 한국어 문법상 가능하지만, ‘…하는 자들은’으로 옮기면 원문의 수식 구조와 뒤의 ‘이들은’이라는 지시를 더 명확히 보존합니다.
  - severity: low
    issue: 영어 감사 추적의 어휘 대안 각주 앵커가 한국어 본문에 없음
    rationale: ‘겉으로 보이려고/구실로’, ‘정죄/심판’의 번역상 대안을 추적 가능하게 하려면 해당 위치에 각주 표지를 두는 편이 좋습니다.
  - severity: low
    issue: 짝 없는 닫는 인용 부호가 있음
    rationale: 본문 끝의 ‘」’는 구조상 불필요한 문장부호입니다.
