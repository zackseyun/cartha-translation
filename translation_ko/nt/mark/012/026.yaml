translation:
  language: ko
  text: 또 죽은 자들이 다시 살아난다는 것에 관해서는, 모세의 책, 곧 떨기나무 대목에서 하나님께서 그에게 어떻게 말씀하셨는지를 여러분은 읽어 보지 못했습니까? ‘나는 아브라함의 하나님이요 이삭의 하나님이요 야곱의 하나님이다’라고 말씀하셨습니다.
  philosophy: optimal-equivalence
