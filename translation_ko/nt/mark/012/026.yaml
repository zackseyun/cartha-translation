    text: 또는 “떨기나무에서.” 헬라어 표현은 떨기나무 사건이 나오는 성경의 대목을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 질문의 범위 안에 하나님의 말씀과 인용을 유지하여 원문의 통사와 수사적 호소를 회복했습니다. 부활 문맥을 ‘다시 살아난다’로 분명히 하고, 인용문의 ‘하나님’ 반복을 보존했습니다. 떨기나무 표현의 장소적 및 본문-지시적 가능성은 각주로 보존했습니다.
