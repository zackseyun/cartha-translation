  source_fidelity: 초안은 핵심 주제와 인용문의 반복 구조를 대체로 전달하지만, πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων(하나님께서 그에게 어떻게 말씀하셨는지, 말씀하시되)을 독립된 서술문으로 바꾸어 예수님의 성경 호소라는 질문 구조와 ‘어떻게 말씀하셨는지’를 충분히 반영하지 못합니다. 또한 ἐγείρονται의 부활 문맥은 ‘다시 살아난다’로 명시하는 편이 안전합니다.
  naturalness: ‘모세의 책에서 떨기나무 장면을’은 한국어로 다소 어색하고, ‘모세의 책, 곧 떨기나무 대목에서’가 본문 참조 관용을 자연스럽게 드러냅니다. ‘여러분이’보다 문맥상 청중에게 직접 묻는 ‘여러분은’이 자연스럽습니다.
  terminology: ‘하나님’, ‘아브라함’, ‘이삭’, ‘야곱’ 및 ‘하나님이요’의 반복은 표준 한국어 성경 문체와 원문의 반복된 ὁ θεός 구조에 부합합니다. ‘떨기나무 대목’에는 해당 표현이 실제 장소가 아니라 성경 본문의 해당 대목을 가리킬 수 있다는 각주를 둡니다.
  issues:
  - severity: medium
    issue: ‘하나님께서 그에게 말씀하시기를’ 이하가 질문에서 분리되어, ‘어떻게 하나님께서 그에게 말씀하셨는지 읽지 못했습니까?’라는 원문의 수사적 질문 구조가 약화되었습니다.
    rationale: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων은 οὐκ ἀνέγνωτε에 종속됩니다. 이를 질문 안에 유지해야 예수님이 모세의 기록을 근거로 호소하시는 구문을 충실히 반영합니다.
  - severity: low
    issue: ‘살아나는 일’은 부활 논쟁의 명제를 다소 느슨하게 표현합니다.
    rationale: ὅτι ἐγείρονται는 죽은 이들이 다시 살아난다는 일반적 진술을 가리킵니다. ‘다시 살아난다는 것’이 문맥을 더 분명히 전달합니다.
  - severity: low
    issue: ‘떨기나무 장면’은 해당 헬라어 표현의 성경 대목 지시 기능을 충분히 드러내지 못합니다.
    rationale: ἐπὶ τοῦ βάτου는 떨기나무 사건이 나오는 성경의 대목을 식별하는 표현으로 이해될 수 있습니다. 본문에는 ‘떨기나무 대목’을 쓰고 대안은 각주로 보존합니다.
  revised_text: 또 죽은 자들이 다시 살아난다는 것에 관해서는, 모세의 책, 곧 떨기나무 대목에서 하나님께서 그에게 어떻게 말씀하셨는지를 여러분은 읽어 보지 못했습니까? ‘나는 아브라함의 하나님이요 이삭의 하나님이요 야곱의 하나님이다’라고 말씀하셨습니다.
