    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 죽은 자들이 살아나는 일에 관하여는, 여러분이 모세의 책에서 떨기나무 장면을 읽지 못했습니까? 하나님께서 그에게 말씀하시기를 「나는 아브라함의 하나님이요 이삭의 하나님이요 야곱의 하나님이다」 하셨습니다.
  philosophy: optimal-equivalence
