  source_fidelity: 그리스어의 두 정관사 부정사(하나님을 사랑함, 이웃을 사랑함)의 병렬 구조와 비교 표현을 충실히 옮겼습니다. 다만 συνέσεως는 ‘깨달음’보다 ‘이해’가 더 직접적이고, 현재 문구는 ‘깨달음을 다하다’가 자연스럽지 않습니다. ‘번제’는 ὁλοκαυτώματα(온전히 태워 드리는 제물)의 통상적 한국어 대응어이므로 별도 보충 없이 충분합니다.
  naturalness: ‘마음을 다하고 깨달음을 다하고 힘을 다하여’는 병렬 명사의 결합과 ‘깨달음을 다하다’가 다소 부자연스럽습니다. ‘온 마음과 온 이해와 온 힘을 다하여’로 하면 현대 표준어 합쇼체에서 자연스럽고 원문의 반복과 총체성도 드러납니다. ‘자기 자신같이’는 ‘자기 자신처럼’이 더 자연스럽습니다.
  terminology: ‘그분’, ‘이웃’, ‘번제와 제사’는 문맥 및 성서 용례에 적절합니다. ‘이해’는 σύνεσις의 분별력·이해력을 무리 없이 반영하며, ‘번제’는 whole burnt offering의 의미를 이미 내포합니다.
  issues:
