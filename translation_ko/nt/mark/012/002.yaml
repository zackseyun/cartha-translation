review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main actions and the partitive sense of ἀπὸ τῶν καρπῶν, but its final causative construction ('받게 하였습니다') is ambiguous and does not clearly express the owner's purpose in sending the slave. '정한 때에' more directly represents τῷ καιρῷ as the appropriate/appointed time.
  naturalness: The sentence becomes more idiomatic and syntactically clear when the purpose clause is rendered with '-려고 하였습니다.' '소작 농부들' is natural in the parable context and retains both the agricultural sense of γεωργοί and their tenancy established by the preceding context.
  terminology: '''종'' is an established Korean biblical rendering for δοῦλος and is acceptable here. ''소작 농부들'' avoids reducing γεωργοί to generic ''소작인'' while appropriately reflecting their role in this vineyard parable.'
  issues:
  - severity: medium
    issue: The phrase '보내, 소작인들에게서 ... 받게 하였습니다' uses a causative form that leaves the intended recipient/agent of receiving unclear.
    rationale: 'ἵνα ... λάβῃ is a purpose clause: the owner sent a slave in order that he himself might receive some produce from the cultivators. Rendering it as ''받으려고 하였습니다'' clearly preserves this purpose.'
  - severity: low
    issue: '''때가 이르자'' does not fully express the appropriateness or appointment implicit in τῷ καιρῷ.'
    rationale: '''정한 때에'' naturally conveys the proper/appointed time without specifying harvest time.'
  revised_text: 정한 때에, 그는 포도원 소작 농부들에게 종 한 사람을 보내어 그들에게서 포도원 소출의 얼마를 받으려고 하였습니다.
