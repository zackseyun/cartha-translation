  source_fidelity: 그리스어의 반복 파송(πάλιν ἀπέστειλεν), 다른 종(ἄλλον δοῦλον), 머리에 가한 폭력(ἐκεφαλίωσαν), 수치스럽게 대함(ἠτίμασαν)은 대체로 충실히 옮겼습니다. 다만 ‘그의 머리’는 한국어에서 앞절의 주어인 주인/포도원 주인의 머리로도 잠시 해석될 수 있으므로, 폭행당한 종을 명시하는 편이 원문의 목적어를 더 정확히 드러냅니다.
  naturalness: 합쇼체 서술과 문장 흐름은 자연스럽습니다. ‘그 종의 머리를’로 바꾸면 지시 대상이 분명해지고 현대 한국어에서도 매끄럽습니다.
  terminology: ‘종’은 이 비유 문맥에서 δοῦλος의 자연스럽고 전통적인 번역입니다. ‘모욕하였습니다’는 ἠτίμασαν의 의미를 적절히 전달합니다. ἐκεφαλίωσαν은 참수로 단정하지 않고 ‘머리를 때리고’로 번역하는 것이 적절합니다.
