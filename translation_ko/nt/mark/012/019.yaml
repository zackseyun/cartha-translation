review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the Mosaic legal citation and the absence of children, but it renders ἀδελφός as the age-specific ‘형/동생.’ Greek ἀδελφός does not specify older or younger brother, and the second occurrence should not be restricted to ‘younger brother.’
  naturalness: The sentence is generally understandable, but ‘그 아내를 데려다가’ can suggest merely taking her away rather than taking her in marriage. ‘맞아’ is natural in this legal-marital context. The quotation punctuation should also be completed.
  terminology: ‘선생님,’ ‘모세,’ ‘아내,’ ‘자녀,’ and ‘자손’ are suitable. ‘형제’ preserves the source’s nonspecific brother terminology; ‘자손을 세우다’ naturally conveys the legal idiom ἐξαναστήσῃ σπέρμα without importing interpretation.
  issues:
  - severity: high
    issue: ‘형’ and ‘동생’ impose age distinctions not present in ἀδελφός.
    rationale: The source uses ἀδελφός for both kinship references and does not identify either brother as older or younger. ‘형제’ preserves this distinction-neutral wording.
  - severity: medium
    issue: ‘그 아내를 데려다가’ is insufficiently marital in sense.
    rationale: λάβῃ τὴν γυναῖκα in this levirate-law context means to take the wife in marriage. ‘그 아내를 맞아’ conveys that sense naturally and concisely.
  - severity: low
    issue: The opening quotation mark is not closed.
    rationale: Completing the nested quotation marks resolves the punctuation defect while retaining the cited-law format.
  revised_text: 「선생님, 모세는 우리를 위해 이렇게 기록했습니다. ‘만일 어떤 사람의 형제가 아내를 남기고 자녀 없이 죽으면, 그의 형제가 그 아내를 맞아 자기 형제를 위하여 자손을 세워야 한다.’」
