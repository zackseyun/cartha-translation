- from: 「선생님, 모세는 우리에게 「만일 어떤 사람의 형이 아내를 두고 자녀 없이 죽으면, 그 동생이 그 아내를 데려다가 그의 형을 위하여 자손을 일으켜야 한다」 하고 기록해 주었습니다.
  to: 「선생님, 모세는 우리를 위해 이렇게 기록했습니다. ‘만일 어떤 사람의 형제가 아내를 남기고 자녀 없이 죽으면, 그의 형제가 그 아내를 맞아 자기 형제를 위하여 자손을 세워야 한다.’」
  rationale: The revision removes unsupported older/younger-brother distinctions, makes the marital force of ‘take the wife’ clear, and uses a natural Korean equivalent for ‘raise up offspring.’ ‘자녀’ remains a generic singular-compatible collective expression for τέκνον, and no footnote is required.
