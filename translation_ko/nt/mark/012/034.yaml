  source_fidelity: 원문의 부정과거 분사 ἀπεκρίθη는 예수께서 말씀하시기 전에 이미 이루어진 대답을 가리킵니다. 초안의 ‘대답하는 것을’은 진행 중인 동작으로 들릴 수 있으므로 ‘대답한 것을’로 고치는 것이 원문에 더 충실합니다. ‘하나님의 나라에서 멀지 않습니다’와 ‘더 이상 ... 감히 질문하지 못했습니다’는 각각 Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ 및 οὐδεὶς οὐκέτι ἐτόλμα ... ἐπερωτῆσαι를 적절히 옮깁니다.
  naturalness: ‘그가 지혜롭게 대답한 것을 보시고’는 현대 표준 한국어 합쇼체에서 자연스럽고, 사건의 선후 관계도 분명히 합니다. 접속사 ‘그러자’는 원문의 단순 연결 καὶ보다 다소 인과적으로 들릴 수 있어 ‘그리고’로 조정했습니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ의 한국어 성서 번역 관습과 의미를 잘 반영합니다. 원문은 그 사람이 나라 안에 들어갔다고 말하지 않고 단지 멀지 않다고 하므로, 이를 그대로 유지했습니다. ‘당신’은 이 직접 발화에서 문법적으로 자연스러운 현대 존칭 대명사이며, 별도의 신학적 해석을 덧붙이지 않습니다.
