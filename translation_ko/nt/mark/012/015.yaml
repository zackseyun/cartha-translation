  terminology: ‘위선’, ‘시험하다’, ‘데나리온’은 각각 ὑπόκρισις, πειράζω, δηνάριον에 적절합니다. 데나리온 문화 주석은 해당 단어에, ‘유혹하다’ 대안은 ‘시험합니까’에 연결해야 합니다.
