  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
  footnotes:
  - marker: a
    text: A denarius was a Roman silver coin commonly used as a day's wage.
    reason: cultural_note
  - marker: b
    text: Or “Why are you tempting me?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분께서는 그들의 위선을 아시고 그들에게 말씀하셨습니다. 「왜 나를 시험합니까?[b] 내가 보도록 데나리온[a] 하나를 내게 가져오십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 로마의 은화로, 일반적으로 하루 품삯으로 쓰이던 화폐였습니다.
    reason: cultural_note; δηνάριον에 앵커를 둠
  - marker: b
    text: 또는 “나를 유혹합니까?”
    reason: lexical_alternative; πειράζετε에 앵커를 둠
