  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
  footnotes:
  - marker: a
    text: Or, “he was speaking most emphatically.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “die together with you.”
    reason: lexical_alternative
  - marker: c
    text: Or, “I will never deny you.” The Greek uses a strong negation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 더욱더 강하게 계속 주장했습니다. 「제가 선생님과 함께 죽어야 한다면, 결코 선생님을 부인하지 않겠습니다.」 그리고 그들도 모두 같은 말을 했습니다.
  philosophy: optimal-equivalence
