revisions:
- from: 그러나 그가 더욱 강하게 말했습니다. 「제가 선생님과 함께 죽어야 한다 할지라도, 결코 선생님을 부인하지 않겠습니다.」 그리고 그들도 모두 그같이 말했습니다.
  to: 그러나 그는 더욱더 강하게 계속 주장했습니다. 「제가 선생님과 함께 죽어야 한다면, 결코 선생님을 부인하지 않겠습니다.」 그리고 그들도 모두 같은 말을 했습니다.
  rationale: 원문의 조건절(ἐὰν δέῃ), ‘함께 죽다’(συναποθανεῖν), 강한 부정(οὐ μή), 그리고 다른 모든 제자들의 동조를 보존했습니다. 또한 베드로의 발화가 계속되고 강화되는 양상은 ‘더욱더 강하게 계속 주장했습니다’로 반영했습니다. 별도의 각주는 본문에서 해당 의미가 충분히 드러나므로 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
