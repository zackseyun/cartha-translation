review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘함께 죽어야 한다’와 강한 부정인 ‘결코 … 부인하지 않겠습니다’를 충실히 옮겼습니다. 다만 ἐλάλει의 미완료적·지속적 발화와 ἐκπερισσῶς의 강화는 ‘더욱 강하게 말했습니다’보다 ‘더욱더 강하게 계속 주장했습니다’에서 더 잘 드러납니다. 마지막 ὡσαύτως는 제자들이 같은 내용을 말했다는 뜻을 명시하는 편이 자연스럽고 분명합니다.
  naturalness: 합쇼체는 일관되고 인용문의 문체도 자연스럽습니다. ‘그같이 말했습니다’는 문어적이며 지시 대상이 다소 약하므로 ‘같은 말을 했습니다’가 현대 표준어로 더 매끄럽습니다.
  terminology: ‘선생님’은 본문 앞선 문맥에서 예수님을 부르는 호칭으로 채택되었다면 유지할 수 있으며, 본 절의 σοι(‘당신과’)에 부가된 신학적 의미는 없습니다. ‘부인하다’는 베드로의 부인을 서술하는 이 문맥의 표준적이고 적절한 표현입니다.
  issues:
  - severity: medium
    issue: 지속·반복의 뉘앙스가 약함
    rationale: ἐλάλει는 미완료형이며, ἐκπερισσῶς와 결합하여 베드로가 더욱 강하게 계속 말하거나 주장했음을 나타냅니다. 초안의 단순 과거 ‘말했습니다’는 이 뉘앙스를 충분히 드러내지 못합니다.
  - severity: low
    issue: 마지막 절의 내용 지시를 명확히 할 필요
    rationale: ὡσαύτως는 여기서 다른 제자들도 베드로와 같은 취지의 말을 했다는 뜻입니다. ‘그들도 모두 같은 말을 했습니다’가 ‘그같이’보다 자연스럽고 분명합니다.
  revised_text: 그러나 그는 더욱더 강하게 계속 주장했습니다. 「제가 선생님과 함께 죽어야 한다면, 결코 선생님을 부인하지 않겠습니다.」 그리고 그들도 모두 같은 말을 했습니다.
