  text: 그리고 무교절 첫날, 유월절 양을 잡는 날에, 제자들이 그분께 말했습니다. 「우리가 어디로 가서, 선생님이 유월절을 잡수실 수 있도록 준비하기를 원하십니까?」
  philosophy: optimal-equivalence
