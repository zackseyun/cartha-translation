  source_fidelity: 초안은 대체로 뜻을 옮기지만, ‘선생님’은 원문에 없는 호칭이며, 질문의 목적 관계와 주어를 더 분명하고 자연스럽게 드러낼 필요가 있습니다. ἔθυον의 미완료 과거는 ‘잡을 때’로 문맥상 자연스럽게 반영할 수 있습니다.
  naturalness: ‘유월절 양을 잡는 날에’와 ‘준비하기를 원하십니까’의 결합은 다소 딱딱하고, 쉼표도 불필요하게 많습니다. 질문을 ‘우리가 어디에 가서 준비하기를 원하십니까?’로 정리하고 목적절을 앞에 두면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘무교절’, ‘유월절’, ‘유월절 양’은 적절합니다. 다만 원문에 없는 ‘선생님’은 제거하고, 예수께 대한 높임은 ‘드실’로 표현합니다. 첫 번째 πάσχα가 희생 제물을 가리킨다는 해석적 명료화는 각주로 뒷받침합니다.
  issues:
