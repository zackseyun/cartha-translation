  source_fidelity: 첫 번째 πάσχα는 θύω와 함께 희생 제물인 유월절 양을 가리키고, 두 번째는 먹는 유월절 식사를 가리킵니다. 초안의 ‘유월절 양을 잡는 날’은 ὅτε가 가리키는 때를 ‘날’로 다소 중복·고정하며, 두 번째 ‘유월절’의 목적어를 준비 행위와 더 명료하게 연결할 필요가 있습니다.
  naturalness: ‘선생님’은 원문에 없는 호칭이며, ‘잡수실 수 있도록’도 가능하나 ‘잡수시도록’이 목적 관계를 더 자연스럽고 간결하게 나타냅니다. ‘무교절 첫날’과 ‘유월절 양을 잡아 바치던 때’를 연결하면 현대 표준어 합쇼체 서술로 자연스럽습니다.
  terminology: ‘무교절’, ‘유월절 양’, ‘유월절’은 문맥에 맞습니다. 첫 용례의 ‘양’은 희생 맥락을 명시한 번역이므로 각주로 그리스어의 포괄적 표현을 밝혀야 합니다. 원문에 없는 ‘선생님’은 삭제합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 호칭 ‘선생님’이 첨가되었습니다.
    rationale: Ποῦ θέλεις에는 호칭이 없으므로 이를 본문에 보태지 않는 것이 원문 충실성에 더 적합합니다.
  - severity: low
    issue: ‘유월절 양을 잡는 날’은 시간 표현을 다소 부정확하게 고정합니다.
    rationale: ὅτε τὸ πάσχα ἔθυον은 ‘유월절 양을 잡아 바치던 때’라는 관습적/진행적 시간 배경을 나타냅니다.
  - severity: low
    issue: 첫 번째 πάσχα의 구체화에 대한 각주가 없습니다.
    rationale: ‘유월절 양’은 θύω의 문맥상 타당하지만, 그리스어 자체는 ‘유월절’이라고 하므로 번역상의 구체화를 각주로 밝혀야 합니다.
  revised_text: 그리고 무교절 첫날, 곧 유월절 양을 잡아 바치던 때에 제자들이 그분께 말했습니다. “우리가 어디로 가서 유월절을 잡수시도록 준비하기를 원하십니까?”
  revised_footnotes:
  - marker: a
    text: 또는 ‘유월절을 잡아 바치던 때에’. 그리스어는 ‘유월절’이라고 하지만, 여기서는 ‘잡아 바치다’라는 동사와 함께 쓰여 유월절 양을 가리키는 것으로 보입니다.
    reason: 첫 번째 πάσχα를 ‘유월절 양’으로 구체화한 번역을 투명하게 밝히고 가능한 대안을 제시합니다.
  revision_rationale: 원문에 없는 호칭을 삭제하고, 희생 행위의 시간 배경과 두 번째 유월절의 식사 의미를 한국어 문장 안에서 자연스럽게 드러냈습니다. 첫 번째 ‘유월절’의 문맥상 의미 확장은 각주로 표시하여 번역의 투명성을 확보했습니다.
