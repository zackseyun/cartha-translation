source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
  footnotes:
  - marker: a
    text: Or, 'when they sacrificed the Passover.' The Greek says 'the Passover,' which in this context likely refers to the Passover lamb being sacrificed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 무교절 첫날, 유월절 양[a]을 잡을 때에 제자들이 그분에게 말했습니다. “그분께서 유월절을 드실 수 있도록, 우리가 어디에 가서 준비하기를 원하십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유월절을 잡을 때.” 그리스어는 “유월절”이라고 하며, 여기서는 유월절 희생 제물을 가리키는 것으로 보입니다.
    reason: lexical_alternative
