    rationale: Ποῦ θέλεις는 단순한 2인칭 단수 질문이며 호칭이 없습니다. 한국어 높임은 동사의 ‘드실’로 충분히 표현할 수 있습니다.
  - severity: medium
    issue: 질문의 목적 관계가 다소 어색하게 표현되었습니다.
    rationale: ἵνα φάγῃς τὸ πάσχα는 제자들이 준비하는 목적을 나타냅니다. ‘그분께서 유월절을 드실 수 있도록, 우리가 어디에 가서 준비하기를 원하십니까?’가 이를 자연스럽게 보존합니다.
  - severity: low
    issue: 첫 번째 ‘유월절’의 제의적 의미를 확인하는 각주가 없습니다.
    rationale: θύω와 함께 쓰인 τὸ πάσχα는 이 문맥에서 유월절 희생 제물을 가리킵니다. 본문 ‘유월절 양’과 각주를 함께 두면 명료성과 번역의 투명성을 확보합니다.
  revised_text: 그리고 무교절 첫날, 유월절 양[a]을 잡을 때에 제자들이 그분에게 말했습니다. “그분께서 유월절을 드실 수 있도록, 우리가 어디에 가서 준비하기를 원하십니까?”
