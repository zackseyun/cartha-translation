  terminology: μυρίσαι는 향유를 바르는 행위를 뜻하므로 ‘향유를 발랐습니다’가 적절합니다. ἐνταφιασμός에는 문맥상 ‘장례’가 자연스러운 대응어입니다. 첫 절의 관용적 번역을 뒷받침하도록 직역 각주를 추가합니다.
