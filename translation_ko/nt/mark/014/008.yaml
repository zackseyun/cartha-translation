  source_fidelity: 첫 문장은 ὃ ἔσχεν ἐποίησεν의 관용적 의미를 적절히 살렸습니다. 다만 εἰς τὸν ἐνταφιασμόν은 장사/매장을 위한 목적을 가리키므로, 현대 한국어에서 상업 의미로도 흔히 쓰이는 ‘장사’를 ‘장례’로 바꾸어 뜻을 분명히 하는 것이 안전합니다. προέλαβεν의 ‘미리’도 유지했습니다.
