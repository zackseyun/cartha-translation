review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. ἔλεγεν은 미완료 과거이므로 단순 과거 「말씀하셨습니다」보다 계속되거나 거듭된 발화를 나타내는 표현이 적절합니다. 또한 마지막 대조절은 아버지께 무엇을 ‘행해 달라’고 명시적으로 요청하는 말이 아니라, 예수님의 뜻과 아버지의 뜻을 대조하는 생략 구문입니다.
  naturalness: 「아빠」는 현대 한국어에서 주로 유아적·가정적인 호칭으로 들려 아람어 Αββα의 음역을 보존하기보다 한국어 친족 호칭으로 치환하는 인상이 있습니다. 성경 한국어의 통용 음역인 「아바」와 자연스러운 직접 호칭 「아버지」가 더 적절합니다. 마지막 문장은 한국어에서 필요한 동사를 보충하되, 원문의 대조와 절제를 유지하도록 다듬었습니다.
  terminology: Αββα는 「아바」로 음역하고, 뒤따르는 ὁ πατήρ는 「아버지」로 옮겨 원문의 아람어+그리스어 병치를 보존합니다. τὸ ποτήριον은 해석하여 ‘고난’으로 바꾸지 않고 「이 잔」으로 유지합니다.
  issues:
  - severity: medium
    issue: ἔλεγεν의 미완료상 미반영
    rationale: 「말씀하셨습니다」는 단순 과거로, 계속적 또는 반복적 발화를 나타낼 수 있는 미완료 ἔλεγεν의 측면을 잃습니다.
  - severity: medium
    issue: Αββα를 「아빠」로 번역함
    rationale: 본문은 아람어 호칭을 그리스어 문자로 보존합니다. 「아빠」는 음역이 아니며 현대 한국어의 유아적 뉘앙스를 불필요하게 불러올 수 있습니다. 「아바」가 원어 표지와 통용 성경 용례를 더 잘 보존합니다.
  - severity: medium
    issue: 마지막 절에 「행하여 주십시오」를 추가함
    rationale: οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ는 ‘내가 원하는 것이 아니라 당신이 원하는 것’이라는 대조이며, ‘행하다’라는 동사가 명시되어 있지 않습니다. 한국어의 문법적 보충은 가능하나, ‘행하여 주십시오’는 표현을 지나치게 특정합니다.
  revised_text: 그분께서 말씀하고 계셨습니다[a]. 「아바[b], 아버지, 아버지께는 모든 것이 가능합니다. 이 잔을 저에게서 거두어 주십시오[c]. 그러나 제가 원하는 대로가 아니라, 아버지께서 원하시는 대로 하십시오.」
  revised_footnotes:
  - marker: a
    text: 또는 “말씀하셨습니다.” 그리스어 미완료형은 계속되거나 거듭된 발화를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “아바”는 ‘아버지’를 뜻하는 아람어 호칭입니다. 본문은 이 말을 보존한 뒤 그리스어로 “아버지”를 덧붙입니다.
    reason: cultural_note
  - marker: c
    text: “잔”은 그에게 정해진 고난을 가리키는 성경적 비유입니다. 마가복음 10:38을 보십시오.
    reason: cross_reference
