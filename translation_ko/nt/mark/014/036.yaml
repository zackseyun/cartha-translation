review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἔλεγεν은 미완료 과거이므로 단순 과거인 ‘말씀하셨습니다’보다 지속·반복의 뉘앙스를 지닌 ‘말씀하고 계셨습니다’가 적절합니다. 또한 마지막 대조절은 ‘행하여 주십시오’를 덧붙이지 않고, 원문의 타동사 θέλω가 가리키는 ‘원하는 것’을 그대로 유지해야 합니다.
  naturalness: ‘아빠’는 현대 한국어에서 일반적으로 한국어 친족 호칭 ‘dad’로 들리며, 아람어 음역을 보존하는 번역으로는 부정확합니다. 통용되는 음역 ‘아바’를 쓰고, 이어지는 ‘아버지’와 병치하면 자연스럽고 본문의 이중 언어적 표현도 살릴 수 있습니다. 전체 문장은 현대 합쇼체로 자연스럽습니다.
  terminology: Αββα는 ‘아바’로 음역하고 ὁ πατήρ는 ‘아버지’로 옮깁니다. ‘잔’은 고난을 해설로 바꾸지 않고 은유 그대로 보존합니다. θέλω는 ‘원하다’로 일관되게 옮깁니다.
  issues:
  - severity: medium
    issue: ‘아빠’는 Αββα의 음역이 아니라 현대 한국어 친족 호칭으로 의미 번역되어 있습니다.
    rationale: 마가가 보존한 아람어 호칭의 형태와 그 뒤의 그리스어 ‘아버지’를 함께 나타내려면 ‘아바, 아버지’가 적절합니다.
  - severity: medium
    issue: ‘말씀하셨습니다’가 ἔλεγεν의 미완료상을 충분히 드러내지 못합니다.
    rationale: 문맥상 반복되거나 지속된 발화를 나타낼 수 있으므로 ‘말씀하고 계셨습니다’가 원문 형식에 더 가깝습니다.
  - severity: high
    issue: ‘아버지께서 원하시는 것을 행하여 주십시오’는 원문에 없는 ‘행하다’와 청원 형식을 추가합니다.
    rationale: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ는 ‘제가 원하는 것이 아니라 아버지께서 원하시는 것’이라는 대조이며, 별도의 ‘행하여 주십시오’가 명시되어 있지 않습니다.
  revised_text: 그분께서는 말씀하고 계셨습니다. “아바, 아버지, 아버지께는 모든 것이 가능합니다. 이 잔을 제게서 거두어 주십시오. 그러나 제가 원하는 것이 아니라, 아버지께서 원하시는 것입니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘말씀하셨습니다.’ 그리스어 미완료 과거는 반복되거나 계속된 발화를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아바’는 ‘아버지’를 뜻하는 아람어 호칭입니다. 본문은 이 말과 그리스어 ‘아버지’를 함께 보존합니다.
    reason: cultural_note
  - marker: c
    text: ‘잔’은 그분에게 정해진 고난을 가리키는 성경의 은유입니다. 마가복음 10:38을 보십시오.
    reason: cross_reference
  revision_rationale: 아람어 호칭의 음역을 ‘아바’로 바로잡고, 미완료 과거의 뉘앙스를 반영했습니다. 또한 마지막 절에서 원문에 없는 ‘행하다’ 및 추가 청원 표현을 제거하여 대조 구조와 의미를 보존했습니다. 주석은 본문에 실제 표지(a, b, c)를 두지 않는 현 초안의 구조를 바꾸지 않고 제공하므로, 편집 단계에서 각각 ‘계셨습니다’, ‘아바’, ‘잔’ 뒤에 연결해야 합니다.
