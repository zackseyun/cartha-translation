  terminology: ἑορτή는 문맥상 유월절을 포함한 절기 기간을 가리키므로, 본 절 안에서는 과도하게 특정하지 않고 “명절”로 유지했습니다. λαός는 “백성”으로 옮겼으며, θόρυβος는 공적 소요를 과장하지 않는 “소동”으로 옮겼습니다.
