  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
  footnotes:
  - marker: a
    text: Or “among the people.” The Greek genitive τοῦ λαοῦ may indicate the uproar would arise from the crowd or occur within it.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 계속 이렇게 말하고 있었기 때문입니다. “명절에는 하지 말자. 백성에게서[a] 소동이 일어날까 염려된다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성들 사이에.” 그리스어 속격 τοῦ λαοῦ는 소동이 백성에게서 일어남을 가리킬 수도 있고, 백성들 사이에서 일어남을 가리킬 수도 있습니다.
    reason: lexical_alternative
