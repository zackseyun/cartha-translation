  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
  footnotes:
  - marker: a
    text: Or, more literally, 'But so that the Scriptures might be fulfilled.' The Greek is elliptical, leaving the main verb implied.
    reason: lexical_alternative
  - marker: b
    text: Or 'you did not arrest me.'
    reason: lexical_alternative
  - marker: c
    text: '''Temple'' here refers to the temple complex or precincts, not specifically the inner sanctuary.'
    reason: cultural_note
