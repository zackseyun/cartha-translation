- from: 내가 날마다 여러분과 함께 성전에서 가르치고 있을 때에는 여러분이 나를 잡지 않았습니다. 그러나 성경이 이루어지기 위함입니다.」
  to: 내가 날마다 여러분과 함께 성전에서 가르치고 있었는데도, 여러분은 나를 붙잡지 않았습니다. 그러나 성경이 이루어지도록 이렇게 된 것입니다.
