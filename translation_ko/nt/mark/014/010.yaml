    issue: '"열둘 중 하나" refers to Judas as "one/thing" rather than naturally as a person.'
    rationale: The Greek ὁ εἷς τῶν δώδεκα means "one of the Twelve," but Korean idiom requires the personal classifier "한 사람" in this context.
  - severity: low
    issue: The draft omits the lexical-alternative footnote for παραδοῖ.
    rationale: The audit trail identifies "betray" as a valid contextually significant alternative. A Korean footnote preserves this nuance while keeping the less interpretive "넘겨주다" in the main text.
  - severity: low
    issue: '"그분을 그들에게" is less clear and less natural than resolving the referent in Korean narrative.'
    rationale: Korean normally avoids stacked third-person pronouns where the recipient noun can be stated directly. "예수를 대제사장들에게" clearly conveys the source referents without altering the sense.
