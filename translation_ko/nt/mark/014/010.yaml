  naturalness: '"열둘 중 한 사람" is idiomatic modern Korean. Placing "대제사장들에게" before the purpose phrase also makes the sentence flow more naturally and removes the awkward cataphoric "그들에게."'
  terminology: '"가룟 유다," "열둘," and "대제사장들" are appropriate. "넘겨주다" faithfully renders παραδίδωμι without prematurely narrowing it to "배반하다."'
  issues:
