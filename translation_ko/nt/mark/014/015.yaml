  source_fidelity: 현 초안의 ‘그러면’은 접속사 καί를 조건·결과의 의미로 바꾸며, 문장 끝의 닫는 인용 부호도 본문에 근거가 없습니다. 또한 ‘자리가 펴진’은 ἐστρωμένον의 의미를 다소 부자연스럽고 좁게 옮깁니다. ‘그가 친히’, ‘잘 갖추어져 있고 준비되어 있는’은 강조와 방의 갖추어진 상태 및 준비됨을 자연스럽게 반영합니다.
  naturalness: ‘자리가 펴진, 준비된 큰 다락방’은 관형어 연결이 어색합니다. ‘잘 갖추어져 있고 준비되어 있는 큰 다락방’은 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: ἀνάγαιον은 문맥상 ‘다락방’으로 옮길 수 있습니다. ἐστρωμένον은 가구만을 뜻한다고 한정하지 않고 ‘잘 갖추어져’로 번역하며, 각주에서 ‘차려져/정돈되어’라는 가능성을 밝혀 의미 범위를 보존합니다. ἡμῖν은 해석적으로 확대하지 않고 ‘우리를 위해’로 유지합니다.
  issues:
