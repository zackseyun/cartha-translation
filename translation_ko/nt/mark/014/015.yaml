  revised_text: 그가 친히 여러분에게 잘 갖추어져 있고 준비되어 있는 큰 다락방을 보여 줄 것입니다. 거기에서 우리를 위해 준비하십시오.
  revised_footnotes:
  - marker: a
    text: '‘잘 갖추어져 있고’: 또는 ‘차려져 있고’, ‘정돈되어 있고’. 그리스어 ἐστρωμένον은 방이 마련되거나 갖추어진 상태를 가리키며, 단지 가구가 있다는 뜻에만 한정되지 않습니다.'
