  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
  footnotes:
  - marker: a
    text: Or, more literally, “through whom the Son of Man is handed over.”
    reason: lexical_alternative
translation:
  language: ko
  text: 인자는 자기에 관하여 기록된 대로 가십니다. 그러나 인자를 넘겨주는 그 사람에게는 화가 있습니다[a]. 그 사람이 태어나지 않았더라면 그 사람에게 더 좋았을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 통하여 인자가 넘겨진다.”
    reason: παραδίδοται의 더 문자적인 수동 표현을 보존합니다.
