  text: 그리고 한 청년이 맨몸에 베 천[a]만 두른 채 그분을 따라가고 있었는데, 그들이 그를 붙잡습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베 시트’. 그리스어 시νδών은 베 천이나 시트 모양의 천을 가리킬 수 있습니다.
    reason: σίνδων의 형태에 관한 어휘적 대안을 보존합니다.
