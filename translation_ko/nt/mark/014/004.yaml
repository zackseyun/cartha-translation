  source_fidelity: 초안은 τινες, ἀγανακτοῦντες, μύρον 및 항의의 뜻을 대체로 잘 옮겼습니다. 다만 ‘이 향유를 이렇게 낭비하였습니까?’는 원문의 명사구 ‘이 향유의 이 낭비’와 완료된 사건을 다소 직접적인 행위자 질문으로 바꿉니다. 또한 인용부호가 닫히지 않았습니다.
  naturalness: ‘서로 분개하면서 말했습니다’와 ‘어찌하여’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 뒤따르는 직접 인용을 매끄럽게 연결합니다.
  terminology: ‘향유’는 μύρον의 문맥상 적절한 전통적·현대적 역어입니다. 이 절에서는 별도 주석 없이도 충분히 이해되며, ‘서로’는 πρὸς ἑαυτούς의 상호적 뉘앙스를 자연스럽게 보존합니다.
