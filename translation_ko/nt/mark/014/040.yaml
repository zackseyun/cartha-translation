  verdict: revise
  source_fidelity: The draft accurately conveys the repeated return, the disciples' sleeping, and their inability to answer. However, "눈이 무거워졌기" presents a change-of-state more strongly than the Greek imperfect participial expression, which describes their eyes as being weighed down/heavy. "눈이 무거웠기" is both closer and more idiomatic in Korean.
  naturalness: The revision uses natural modern formal-polite Korean. Separating the explanatory clause into its own sentence improves clarity while retaining γάρ's causal force.
  terminology: '"그분께" appropriately represents αὐτῷ in the established narrative context without unnecessarily adding a name. "무엇이라고 대답해야 할지" is clear, formal, and preserves the indirect-question sense.'
  issues:
  - severity: low
    issue: '"무거워졌기" suggests that their eyes had become heavy.'
    rationale: καταβαρυνόμενοι, with ἦσαν, depicts an ongoing condition of being weighed down. Korean "무거웠기" preserves the idiomatic result/state without adding emphasis on onset.
  - severity: low
    issue: The lexical nuance represented by the English audit footnote is not retained.
    rationale: A footnote anchored to "무거웠습니다" can preserve the image of eyes being weighed down with sleep and provide the literal alternative.
