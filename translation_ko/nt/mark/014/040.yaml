base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
  footnotes:
  - marker: a
    text: Or, 'for their eyes were heavy.' The Greek image is that their eyes were being burdened or weighed down with sleep.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다시 와서 그들이 자고 있는 것을 보셨습니다. 그들의 눈이 무거웠기 때문입니다[a]. 그들은 그분께 무엇이라고 대답해야 할지 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 눈이 잠으로 짓눌려 있었습니다.” 그리스어는 눈이 잠으로 부담을 받아 짓눌리는 모습을 나타냅니다.
    reason: καταβαρυνόμενοι의 ‘짓눌리다, 무겁게 되다’라는 비유적 어감을 보존하는 어휘 대안입니다.
