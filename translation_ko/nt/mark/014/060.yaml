revisions:
- from: 그러자 대제사장이 가운데에 서서 예수께 물어 말했습니다. 「당신은 아무 대답도 하지 않습니까? 이 사람들이 당신을 거슬러 무엇을 증언하고 있습니까?」
  to: 그러자 대제사장이 일어나 한가운데로 나와 예수께 물었습니다. 「당신은 아무 대답도 하지 않습니까? 이 사람들이 당신을 거슬러 무엇을 증언합니까?」
  rationale: The revision restores the rising and movement-to-the-center implied by ἀναστὰς εἰς μέσον, while retaining the judicial questioning and the Greek's present-tense accusation. It also uses concise, natural modern formal-polite Korean for the speech introduction.
