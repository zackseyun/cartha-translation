  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
  footnotes:
  - marker: a
    text: Or “into the midst.” The phrase indicates that the high priest took a central position before the assembly.
    reason: lexical_alternative
  - marker: b
    text: Or “Do you make no answer?”
    reason: lexical_alternative
  - marker: c
    text: Literally “these men”; Greek has a masculine plural demonstrative referring to the witnesses present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 대제사장이 일어나 한가운데로 나와 예수께 물었습니다. 「당신은 아무 대답도 하지 않습니까? 이 사람들이 당신을 거슬러 무엇을 증언합니까?」
  philosophy: optimal-equivalence
