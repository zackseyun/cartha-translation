  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
  footnotes:
  - marker: a
    text: Or 'linen sheet' or 'linen garment' for 'linen cloth' (σινδόνα).
    reason: lexical_alternative
  - marker: b
    text: '''Naked'' (γυμνός) can in some contexts mean inadequately clothed, but here the immediate sense is that he escaped without the garment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 아마포 천[a]을 버리고 알몸으로[b] 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아마포 홑이불’ 또는 ‘아마포 옷감’. 그리스어 σινδών은 아마포로 된 천을 가리키며, 그 정확한 형태는 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알몸으로’(γυμνός)는 문맥에 따라 옷을 충분히 입지 않은 상태를 뜻할 수도 있으나, 여기서는 그가 아마포 천을 남기고 도망한 상황을 가리킵니다.
    reason: lexical_alternative
