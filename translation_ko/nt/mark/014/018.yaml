source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
  footnotes:
  - marker: a
    text: Or, more literally, “Amen, I say to you.”
    reason: lexical_alternative
  - marker: b
    text: Or, “will hand me over.” The Greek verb can mean hand over, deliver up, or betray; here it refers to treacherous handing over by one of Jesus' own companions.
    reason: lexical_alternative
  - marker: c
    text: Reclining was the customary posture for a formal meal.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 식탁에 기대어 누워 음식을 먹고 있을 때, 예수께서 말씀하셨습니다. 「진실로 내가 여러분에게 말합니다. 여러분 가운데 한 사람, 곧 나와 함께 먹는 사람이 나를 넘겨줄 것입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 배반할 것입니다.” 그리스어 동사는 ‘넘겨주다’, ‘인도하다’, ‘배반하다’라는 뜻을 가질 수 있습니다. 여기서는 예수님과 함께 식사하는 동료가 그분을 배반하여 넘겨주는 일을 가리킵니다.
    reason: lexical_alternative
