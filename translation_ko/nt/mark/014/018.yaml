  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 ἀνακειμένων은 당시 식사 자세인 ‘기대어 누워’를 가리키므로, ‘비스듬히 누워’보다 이를 더 분명하고 자연스럽게 옮기는 편이 좋습니다. παραδώσει는 문맥상 배반의 행위를 가리키지만 어휘 자체의 ‘넘겨주다’라는 폭을 본문에서 보존할 수 있습니다.
  naturalness: ‘비스듬히 누워 먹고 있을 때’는 현대 한국어에서 다소 어색하고 자세의 역사적 의미가 충분히 드러나지 않습니다. ‘식탁에 기대어 누워 음식을 먹고 있을 때’가 자연스럽고 구체적입니다. ‘나와 함께 먹고 있는 자’도 가능하나 ‘나와 함께 먹는 사람이’가 합쇼체 문맥에서 더 매끄럽습니다.
  terminology: ‘진실로’는 Ἀμήν의 엄숙한 도입을 적절히 반영합니다. ‘넘겨주다’는 παραδίδωμι의 기본 의미를 보존하며, 문맥상의 배반 의미는 각주로 밝혀 투명성을 확보합니다.
