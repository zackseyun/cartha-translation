  to: 그들이 식탁에 기대어 누워 음식을 먹고 있을 때, 예수께서 말씀하셨습니다. 「진실로 내가 여러분에게 말합니다. 여러분 가운데 한 사람, 곧 나와 함께 먹는 사람이 나를 넘겨줄 것입니다.[a]」
  rationale: 식사 자세를 나타내는 ἀνακειμένων을 당시 관습에 맞게 ‘식탁에 기대어 누워’로 수정하고, 마지막의 관형 분사를 자연스러운 한국어 관계 표현으로 다듬었습니다. παραδώσει는 본문에서 ‘넘겨주다’로 유지하여 원문의 의미 범위를 보존하되, 문맥상 배반의 뜻을 각주에서 제시했습니다.
