id: MRK.14.72
reference: Mark 14:72
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
  footnotes:
  - marker: a
    text: Or, 'when he thought on it, he wept'; the participle ἐπιβαλών is difficult and has been understood in several ways, including an inward mental turn or an outward physical gesture.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 곧 닭이 두 번째로 울었습니다. 베드로는 예수께서 그에게 “닭이 두 번 울기 전에 네가 세 번 나를 부인할 것이다”라고 말씀하신 그 말씀을 기억했습니다. 그리고 그는 마음이 무너져[a] 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 일을 생각하며 울었습니다.” 그리스어 ἐπιβαλών은 뜻이 분명하지 않은 표현으로, 깊이 생각하는 내적 전환이나 어떤 몸짓을 가리키는 것으로도 이해됩니다.
    reason: lexical_alternative
