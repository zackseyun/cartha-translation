  source_fidelity: 현 초안은 οὐκέτι οὐ μὴ의 강한 미래 부정과 '포도나무의 열매'라는 관용구를 대체로 반영합니다. 그러나 문장 끝의 닫는 인용 부호는 짝이 없고, '새것으로 마시는'은 καινόν의 술어적 용법을 한국어에서 부자연스럽게 처리하여 '새로운 물건을 마신다'는 뜻으로 오해될 수 있습니다.
  naturalness: '''포도나무의 열매로부터''와 ''새것으로 마시는''은 현대 표준 한국어 합쇼체에서 다소 직역투입니다. 어순을 정리하고 ''새롭게 마시는''으로 옮기면 자연스럽고, 주석으로 ''새로운''과 ''새로이''의 가능한 뉘앙스를 보존할 수 있습니다.'
  terminology: '''하나님의 나라''와 ''포도나무의 열매''는 적절합니다. ''여러분''은 복수 ὑμῖν을 자연스럽게 반영합니다. ''결코 … 않겠습니다''는 οὐ μὴ의 강조를, ''다시는''은 οὐκέτι의 시간적 의미를 반영합니다.'
