id: MRK.14.62
reference: Mark 14:62
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
  footnotes:
  - marker: a
    text: Or “I am he.” The Greek reads simply “I am.”
    reason: alternative_reading
  - marker: b
    text: “Power” is a reverential way of referring to God.
    reason: cultural_note
  - marker: c
    text: Echoes Psalm 110:1 and Daniel 7:13.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “그렇습니다.[a] 그리고 여러분은 권능[b]의 오른편에 앉아 계시며 하늘의 구름과 함께 오시는 인자[c]를 보게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 단순히 “내가 이다”라고 말합니다. “내가 그입니다”으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘권능’은 하나님을 가리키는 경외적 우회 표현입니다.
    reason: cultural_note
  - marker: c
    text: 시편 110:1과 다니엘 7:13을 반향합니다.
    reason: cross_reference
