- from: 예수께서 말씀하셨습니다. 「내가 그입니다. 그리고 여러분은 인자가 권능의 우편에 앉아 있는 것과 하늘 구름과 함께 오는 것을 볼 것입니다.」
  to: 예수께서 말씀하셨습니다. “그렇습니다.[a] 그리고 여러분은 권능[b]의 오른편에 앉아 계시며 하늘의 구름과 함께 오시는 인자[c]를 보게 될 것입니다.”
  rationale: 원문에 없는 보어를 본문에서 제거하고, 한국어의 자연스러운 긍정 응답을 사용하되 각주에서 그리스어의 간결한 표현과 대안적 번역을 제시했습니다. 또한 ‘인자’를 ‘보다’의 직접 목적어로 복원하여, 그가 앉아 계시고 오시는 분으로 묘사되는 그리스어의 분사 구조를 살렸습니다.
