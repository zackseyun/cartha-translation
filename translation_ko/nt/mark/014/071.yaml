  source_fidelity: 원문의 ἀναθεματίζειν은 단순한 욕설보다 ‘저주를 불러오는/저주를 맹세에 덧붙이는’ 행위를 가리킵니다. 초안의 ‘저주하며’도 가능한 번역이지만, 저주의 대상이 명시되지 않은 원문의 여지를 독자가 확인할 수 있도록 각주가 필요합니다. ‘맹세하기 시작했습니다’와 부인 내용은 원문에 충실합니다.
  naturalness: ‘그러나 그가 저주하며 맹세하기 시작했습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽습니다. 다만 ‘저주를 퍼부으며’는 욕설 또는 타인에 대한 저주로 좁혀 들릴 수 있으므로, ‘저주를 하며’와 보충 각주가 더 중립적입니다.
  terminology: ἀναθεματίζειν을 ‘저주를 하며’로 옮기고, 그것이 자신에게 저주를 불러올 수도 있다는 해석은 본문이 아니라 각주에 한정합니다. ὀμνύναι의 ‘맹세하다’, οὐκ οἶδα의 ‘알지 못합니다’는 적절합니다.
