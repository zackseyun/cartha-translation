  to: 그러나 그는 저주를 하며 맹세하기 시작했습니다.[a] “나는 여러분이 말하는 이 사람을 알지 못합니다.”
  rationale: ‘저주를 하며’는 ἀναθεματίζειν의 저주-호소적 의미를 보존하면서도 저주의 대상이 누구인지 본문에서 특정하지 않습니다. 각주는 가능한 자기저주 해석을 제시하되 원문의 불명시성을 분명히 합니다. 나머지 문장은 원문의 진행(‘시작했습니다’), 맹세, 그리고 직접적인 부인을 자연스러운 합쇼체로 유지합니다.
  reviewer_model: gpt-5.6-terra
