- from: 그런데 유월절과 무교절이 이틀 후로 다가오고 있었습니다. 그리고 대제사장들과 율법학자들은 어떻게 그분을 속임수로 잡아 죽일까 모색하고 있었습니다.
  to: 유월절과 무교절이 이틀 뒤에 있었습니다. 대제사장들과 서기관들은 어떻게 그분을 속여 붙잡아 죽일 방도를 찾고 있었습니다.
