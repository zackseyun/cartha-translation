review_pass:
  verdict: revise
  source_fidelity: ‘무교절’은 τὰ ἄζυμα의 축제적 용법을 적절히 옮겼습니다. 그러나 ‘이틀 후로 다가오고 있었습니다’는 원문의 단순한 시간 진술(μετὰ δύο ἡμέρας ἦν)에 진행 중인 접근의 뉘앙스를 더하며 한국어로도 다소 부자연스럽습니다. 또한 γραμματεῖς는 여기서 ‘율법학자들’보다 직접적인 전통 용어인 ‘서기관들’이 더 충실합니다. ἐν δόλῳ는 ‘속여’로, κρατήσαντες는 ‘붙잡아’로 옮겨 속임과 체포/장악의 의미를 보존했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, ‘방도를 찾고 있었습니다’가 πῶς와 미완료 과거 ἐζήτουν의 지속적인 모의를 무리 없이 나타냅니다.
  terminology: ‘유월절’, ‘무교절’, ‘대제사장들’, ‘서기관들’은 성경 문맥에서 통용되며 원문의 명칭과 사회적 직분을 과도하게 해석하지 않습니다. ‘그분’은 초안의 존칭 지시어를 유지했습니다.
  issues:
  - severity: medium
    issue: 시간 표현 ‘이틀 후로 다가오고 있었습니다’
    rationale: μετὰ δύο ἡμέρας는 ‘이틀 뒤에/후에’라는 시간적 거리 표현입니다. ‘다가오고 있었다’는 진행적 접근을 부가하고 한국어 결합도 매끄럽지 않습니다.
  - severity: low
    issue: γραμματεῖς를 ‘율법학자들’로 번역
    rationale: ‘율법학자’는 가능한 설명적 번역이지만, 본문은 특정 집단 명칭을 사용하므로 ‘서기관들’이 더 직접적이며 용어상 일관됩니다.
  - severity: low
    issue: ‘속임수로 잡아 죽일까’의 결합 범위
    rationale: ἐν δόλῳ는 그들을 붙잡는 방식의 속임을 가리킵니다. ‘그분을 속여 붙잡아 죽일’로 표현하면 이 관계가 한국어에서 더 분명합니다.
  revised_text: 유월절과 무교절이 이틀 뒤에 있었습니다. 대제사장들과 서기관들은 어떻게 그분을 속여 붙잡아 죽일 방도를 찾고 있었습니다.
