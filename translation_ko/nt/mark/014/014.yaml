review_pass:
  verdict: revise
  source_fidelity: 초안은 κατάλυμα를 ‘객실’로 옮기고, ‘내’(μου), ‘제자들과 함께’, ‘유월절을 먹을’을 포함하여 주요 의미 요소를 대체로 보존합니다. 그러나 ‘그가 어디로든 들어가는 집의 주인’은 ὅπου ἐὰν εἰσέλθῃ를 지나치게 명사구 안에 묶어 어색하게 만들며, ‘어느 곳에 들어가든지 그 집 주인에게’로 풀어야 명령의 구조가 분명해집니다.
  naturalness: 합쇼체에 맞추어 명령은 ‘말하십시오’, 인용된 질문은 ‘어디 있습니까?’로 처리했습니다. 중첩 인용부호도 한국어 문장부호에 맞게 정리했습니다.
  terminology: ὁ οἰκοδεσπότης는 ‘그 집 주인’, ὁ διδάσκαλος는 문맥상 호칭인 ‘선생님’, κατάλυμα는 사설 집의 ‘객실’로 옮겼습니다. ‘객실’에는 ‘여관’이라는 오해를 막는 어휘 주석을 붙였습니다.
  issues:
  - severity: medium
    issue: 관계절과 명령의 연결이 부자연스럽습니다.
    rationale: ‘그가 어디로든 들어가는 집의 주인에게’는 한국어에서 수식 관계가 무겁고 모호합니다. 원문의 ‘그가 어느 곳에 들어가든지, 그 집 주인에게 말하라’라는 순서를 드러내야 합니다.
  - severity: low
    issue: 인용문 표기가 중첩되어 있습니다.
    rationale: 초안의 「… 「…」 하십니다.」는 표준적인 중첩 인용 표기로 정리할 필요가 있습니다.
  - severity: low
    issue: κατάλυμα의 의미 범위를 보완하는 주석이 없습니다.
    rationale: 이 문맥의 κατάλυμα는 일반적으로 사가의 손님용 방을 가리키며 상업적 여관을 뜻하지 않습니다. 영어 감사 기록의 어휘 주석을 한국어에도 반영하는 것이 적절합니다.
