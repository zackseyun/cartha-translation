    text: 또는 ‘묵을 곳’, ‘방’. 그리스어 κατάλυμα는 머무는 장소를 뜻하며, 여기서는 상업적인 여관이라기보다 개인 집 안의 손님용 방을 가리킬 가능성이 큽니다.
