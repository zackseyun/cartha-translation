translation:
  language: ko
  text: 그리고 그가 어느 곳에 들어가든지 그 집 주인에게 이렇게 말하십시오. “선생님께서 말씀하십니다. ‘제가 제자들과 함께 유월절을 먹을 제 객실[a]이 어디 있습니까?’”
  philosophy: optimal-equivalence
  footnotes:
