  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
  footnotes:
  - marker: a
    text: Or “in three days.” The Greek expression διὰ τριῶν ἡμερῶν here most naturally indicates the span within which the action would occur.
    reason: lexical_alternative
  - marker: b
    text: “Made with hands” and “not made with hands” preserve the Greek contrast between χειροποίητον and ἀχειροποίητον.
    reason: lexical_alternative
translation:
  language: ko
  text: “우리는 그가 ‘내가 손으로 만든 이 성전을 헐고, 사흘 안에 손으로 만들지 않은 다른 성전을 세우겠습니다’라고 말하는 것을 들었습니다.”
  philosophy: optimal-equivalence
