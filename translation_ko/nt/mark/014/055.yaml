    text: ‘온 공의회’는 당시 유대 지도자들의 최고 의결 기구인 산헤드린을 가리킬 수 있습니다.
    reason: ‘공의회’는 συνέδριον의 의미를 번역한 것이며, ‘산헤드린’은 역사적 명칭을 보완하는 가능한 번역입니다.
  revision_rationale: 원문의 법정적 의미와 두 미완료 과거가 나타내는 지속성을 보존하도록 다듬었습니다. 원문에 없는 존칭을 제거하고, 현대 한국어에서 자연스러운 법정 표현으로 바꾸었습니다.
