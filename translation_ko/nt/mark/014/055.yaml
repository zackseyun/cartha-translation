  source_fidelity: 대체로 충실합니다. 그러나 마지막의 ‘찾지 못했습니다’는 두 번째 미완료 과거(οὐχ ηὕρισκον)의 지속성을 약화시키며, ‘그분’은 원문에 없는 높임을 더합니다. ‘그분을 거스르는 증언’도 현대 한국어 법정 문맥에서는 다소 어색합니다.
  naturalness: ‘예수에게 불리한 증언’과 ‘아무 증언도 찾아내지 못하고 있었습니다’가 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 법정적·지속적 서술을 잘 살립니다.
  terminology: ‘대제사장들’은 ἀρχιερεῖς의 통상적이고 적절한 번역입니다. ‘공의회’는 συνέδριον을 번역한 말로 적절하며, 역사적 명칭인 산헤드린은 각주로 보완할 수 있습니다.
  issues:
  - severity: medium
    issue: 원문에 없는 존칭 대명사 ‘그분’
    rationale: αὐτόν은 단순 목적대명사입니다. 존칭은 원문의 어조를 넘어서는 해석적·문체적 추가이므로, 이 구절에서는 ‘예수’ 또는 ‘그’를 쓰는 편이 중립적입니다.
  - severity: medium
    issue: 마지막 미완료 과거의 지속성 약화
    rationale: ἐζήτουν과 οὐχ ηὕρισκον은 모두 미완료 과거입니다. ‘찾고 있었지만, 아무 증언도 찾아내지 못하고 있었습니다’는 계속 찾았으나 계속 얻지 못한 상황을 더 잘 반영합니다.
  - severity: low
    issue: ‘그분을 거스르는 증언’의 비자연스러운 법정 표현
    rationale: κατὰ τοῦ Ἰησοῦ μαρτυρίαν은 법정 문맥에서 예수에게 불리한 증언을 뜻합니다. ‘예수에게 불리한 증언’이 현대 한국어에서 자연스럽습니다.
  revised_text: 대제사장들과 온 공의회는 예수를 죽이려고 예수에게 불리한 증언을 찾고 있었지만, 아무 증언도 찾아내지 못하고 있었습니다.
  revised_footnotes:
