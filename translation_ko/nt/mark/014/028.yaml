review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the adversative contrast, the future action of going ahead, the plural audience, and Galilee as destination. However, ‘내가 일어난 후에’ ordinarily means ‘after I get up/arise’ and does not adequately communicate the resurrection sense or the Greek passive form of ἐγερθῆναί.
  naturalness: The sentence is otherwise clear and uses appropriate modern formal-polite 합쇼체. Removing the unmatched closing quotation mark is necessary. ‘살아난 뒤에’ is idiomatic Korean resurrection language; a note can retain the source’s passive nuance without burdening the main text.
  terminology: ‘살아나다’ is the standard natural Korean resurrection expression here. ‘여러분보다 먼저 갈릴리로 가겠습니다’ accurately renders προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν and preserves the plural addressees.
  issues:
  - severity: medium
    issue: ‘일어난 후에’ is semantically insufficient for the resurrection expression.
    rationale: ἐγερθῆναί με is an aorist passive infinitive of ‘raise,’ used here in a resurrection context. Korean ‘일어나다’ is too readily understood as simply getting up and does not clearly convey resurrection.
  - severity: low
    issue: The draft has an unmatched closing quotation mark (」).
    rationale: There is no corresponding opening quotation mark, so it should be removed.
  revised_text: 그러나 내가 살아난[a] 뒤에, 여러분보다 먼저 갈릴리로 가겠습니다.
