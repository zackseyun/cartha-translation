  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
  footnotes:
  - marker: a
    text: Or 'blindfold him.' The Greek literally says 'cover his face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the guards struck him' / 'they took him with blows.' The Greek expression is literally 'the officers received him with blows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 어떤 자들이 그분께 침을 뱉기 시작하였고, 그분의 얼굴을 가리고 주먹으로 치며 그분께 「예언해 보아라」 하고 말했습니다. 그리고 부하들이 손바닥으로 그분을 쳤습니다.
  philosophy: optimal-equivalence
