review_pass:
  verdict: revise
  source_fidelity: 대체로 원문을 잘 반영하지만, ὑπηρέται는 단순히 ‘부하들’이라기보다 재판·경비 상황의 하급 관리 또는 경비원들입니다. 또한 ῥαπίσμασιν은 ‘손바닥으로’라고 특정하기보다 ‘손찌검/매질’처럼 넓게 옮기는 것이 안전합니다.
  naturalness: ‘어떤 자들’은 현대 표준 한국어에서 다소 부자연스럽고 불필요하게 경멸적인 뉘앙스를 줄 수 있어 ‘몇몇 사람이’로 다듬는 것이 자연스럽습니다. 직접 인용의 조롱하는 명령은 ‘예언해 보아라!’가 문맥에 맞습니다.
  terminology: κολαφίζειν은 ‘주먹으로 치다’로 구체성을 살렸습니다. ὑπηρέται는 ‘하속들’보다 현대적으로 이해되는 ‘경비원들’로 옮기되, 원문의 제도적 의미를 보충하는 각주를 둡니다.
  issues:
  - severity: medium
    issue: ‘부하들’은 ὑπηρέται의 의미를 부정확하게 좁힐 수 있습니다.
    rationale: 이 문맥의 ὑπηρέται는 누군가의 개인적 부하라기보다 공적인 하급 관리·경비 인력을 가리킵니다.
  - severity: medium
    issue: ‘손바닥으로’는 ῥαπίσμασιν의 수단을 지나치게 특정합니다.
    rationale: 이 단어는 손으로 가하는 타격을 포함할 수 있으나, ‘손바닥’으로 한정되지 않습니다. ‘손찌검을 하다’는 원문의 넓이를 보존합니다.
  - severity: low
    issue: ‘어떤 자들’은 문체상 다소 어색하고 부정적 뉘앙스를 추가합니다.
    rationale: τινες는 특정되지 않은 일부를 뜻하므로 ‘몇몇 사람이’가 자연스럽고 중립적입니다.
  revised_text: 그리고 몇몇 사람이 그분께 침을 뱉기 시작했고, 그분의 얼굴을 가리고 주먹으로 치며 그분께 “예언해 보아라!” 하고 말했습니다. 그리고 경비원들은 손찌검을 하며 그분을 맞이했습니다.[b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘그분의 눈을 가리고.’ 그리스어는 직역하면 ‘그분의 얼굴을 가리고’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘경비원들은 손찌검으로 그분을 맞이했습니다.’ 또는 ‘경비원들이 그분을 때렸습니다.’
    reason: lexical_alternative
  revision_rationale: 원문의 불특정 복수, 주먹으로 치는 행위, 조롱하는 명령을 유지했습니다. 마지막 관용적 표현은 직역을 본문에 보존하고, 자연스러운 대안을 각주로 제시했습니다. ‘경비원들’은 이 재판 장면에서 ὑπηρέται의 공적 역할을 반영합니다.
