  source_fidelity: 초안은 침 뱉기, 얼굴 가리기, 주먹으로 때리기, 예언하라는 조롱, 그리고 ὑπηρέται의 가해라는 기본 흐름을 대체로 반영합니다. 그러나 「예언해 보아라」의 ‘보아라’는 원문의 단순 명령에 ‘시험 삼아 해 보라’는 뉘앙스를 더하며, ὑπηρέται를 「부하들」로 옮기면 이들이 누구의 부하인지 불필요하게 अस्पष्ट해집니다. ῥαπίσμασιν은 손바닥으로 한정하기보다 ‘손으로 때리다’로 옮기는 편이 원문의 폭을 보존합니다.
  naturalness: 「어떤 자들」은 현대 표준 한국어에서 다소 부자연스럽고 대상화하는 어감이 있으므로 「몇몇 사람이」가 자연스럽습니다. 인용문의 「예언해라!」는 조롱하는 명령으로 자연스럽고, 본문은 합쇼체 서술로 유지됩니다.
  terminology: ὑπηρέται는 이 재판·구금 상황에서 하급 관리 또는 경비 인력을 가리키므로 「경비원들」이 「부하들」보다 적절합니다. 그리스어가 대명사를 사용하므로 본문에서도 「그에게/그의/그를」로 유지하여 이름이나 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: 「예언해 보아라」
    rationale: Προφήτευσον은 단순한 명령형입니다. ‘-해 보다’는 원문에 없는 시도·도전의 뉘앙스를 보탭니다.
  - severity: medium
    issue: 「부하들」
    rationale: ὑπηρέται는 특정 인물의 개인적 부하라는 뜻이 아니라 공적 수행원·경비 인력을 뜻합니다.
  - severity: low
    issue: 「손바닥으로」
    rationale: ῥαπίσμασιν은 손으로 가한 타격을 가리킬 수 있으나, 손바닥으로만 친 것으로 단정하지 않는 표현이 안전합니다.
  - severity: low
    issue: 「어떤 자들」
    rationale: τινες의 불특정 복수는 「몇몇 사람」으로 자연스럽게 옮길 수 있습니다.
  revised_text: 그리고 몇몇 사람이 그에게 침을 뱉기 시작했고, 그의 얼굴을 가리고 주먹으로 때리며 그에게 “예언해라!” 하고 말했습니다. 그리고 경비원들은 손으로 그를 때렸습니다.
