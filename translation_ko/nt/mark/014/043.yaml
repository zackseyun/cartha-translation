- from: 그리고 그분께서 아직 말씀하고 계실 때, 곧 열둘 중 하나인 유다가 도착했습니다. 그리고 그와 함께 대제사장들과 율법학자들과 장로들에게서 보낸 무리가 칼과 몽둥이를 가지고 왔습니다.
  to: 그가 아직 말씀하고 계실 때에, 곧바로 열둘 중 하나인 유다가 왔습니다. 그와 함께 칼과 몽둥이를 든 무리가 대제사장들과 율법학자들과 장로들에게서 왔습니다.
  rationale: 'The revision preserves the Greek sequence and historical narrative sense: while he was still speaking, Judas arrived immediately, accompanied by an armed crowd originating from the chief priests, scribes, and elders. It removes the unsupported explicit claim that the authorities sent the crowd while retaining the source/authorization connection expressed by παρά.'
  reviewer_model: gpt-5.6-terra
