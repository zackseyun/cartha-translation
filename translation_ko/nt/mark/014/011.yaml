id: MRK.14.11
reference: Mark 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
  footnotes:
  - marker: a
    text: Or 'silver.' The Greek term can refer literally to silver or more generally to money.
    reason: lexical_alternative
  - marker: b
    text: Or 'hand him over.' The Greek verb can mean 'deliver up' or 'hand over'; here 'betray' reflects the treacherous context involving Judas.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이 말을 듣고 기뻐하며, 그에게 돈[a]을 주겠다고 약속했습니다. 그리고 그는 적절한 때에 그분을 어떻게 넘겨줄[b] 수 있을지를 찾기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은’. 그리스어 낱말은 문자적으로 은을 뜻할 수 있으며, 더 일반적으로 돈을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘배반할’. 그리스어 동사는 ‘넘겨주다’ 또는 ‘인도하다’를 뜻할 수 있으며, 유다의 행위라는 문맥에서는 ‘배반하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
