- from: 여러분은 신성모독을 들었습니다. 여러분에게는 어떻게 보입니까?」 그리고 그들 모두가 그분을 죽음에 해당하는 자로 정죄했습니다.
  to: “여러분은 신성 모독을 들었습니다. 여러분은 어떻게 생각합니까?” 그러자 그들 모두가 그를 사형에 해당한다고 정죄했습니다.
