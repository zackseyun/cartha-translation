  verdict: revise
  source_fidelity: The draft conveys the armed approach and intended seizure, but its wording slightly blurs the force of ὡς ἐπὶ λῃστήν ('as against/as if after a bandit') and does not preserve the broader historical sense possible in λῃστής. The Greek's participial speech formula is adequately represented by '대답하여 말씀하셨습니다.'
  naturalness: The repeated use of 잡다 ('강도를 잡는 것처럼 ... 나를 잡으러') is stylistically awkward in Korean. '강도를 잡듯이' and '나를 체포하러' provide a natural, formal-polite rendering. The submitted quotation is also missing its closing quotation mark.
  terminology: '''칼과 몽둥이'' naturally renders μαχαίραι and ξύλα in this arrest context. ''강도'' is an established primary rendering for λῃστής, while a note should indicate that the word may refer to a violent bandit or insurgent, rather than merely a thief.'
  issues:
  - severity: medium
    issue: Awkward repetition of 잡다
    rationale: Using 잡다 both for the supposed criminal ('강도를 잡는') and for Jesus ('나를 잡으러') is needlessly repetitive. '체포하다' accurately renders συλλαμβάνειν in this context and improves Korean style.
  - severity: low
    issue: Missing closing quotation mark
    rationale: The direct speech opened with 「 requires a matching closing 」.
  - severity: low
    issue: Lexical nuance of λῃστής is omitted
    rationale: Although '강도' is suitable in the main text, λῃστής can denote a violent bandit or insurgent; a footnote preserves this without over-specifying the main translation.
  revised_text: 예수께서 그들에게 대답하여 말씀하셨습니다. 「강도[a]를 잡듯이 칼과 몽둥이를 들고 나를 체포하러 나왔습니까?」
  revised_footnotes:
