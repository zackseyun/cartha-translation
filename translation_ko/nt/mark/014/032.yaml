- from: 그리고 그들이 겟세마네라 하는 곳에 갔습니다. 그분께서 제자들에게 말씀하셨습니다. 「내가 기도하는 동안 여러분은 여기 앉아 있으십시오.」
  to: 그들은 겟세마네라는 곳에 이르렀습니다. 예수께서 제자들에게 말씀하셨습니다. 「내가 기도할 때까지 여기 앉아 있으십시오.」
  rationale: 'The revision corrects the temporal relation expressed by ἕως with the aorist subjunctive, retains the broad sense of χωρίον as ''곳,'' and uses clear, natural formal-polite Korean. No footnote is needed: Korean past-tense narrative is idiomatic for Mark''s historical presents, and no unresolved source ambiguity requires annotation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:14:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft''s ''기도하는 동안'' renders a durative sense (''while I pray''), whereas ἕως προσεύξωμαι sets a temporal limit: ''until I pray.'' The remaining clauses convey the place, disciples, and imperative adequately. Rendering Mark''s historical presents with Korean past narrative forms is idiomatic and does not impair fidelity.'
  naturalness: The revised wording is natural in modern standard Korean and consistently uses formal-polite 합쇼체. '앉아 있으십시오' naturally expresses the imperative in context.
  terminology: '''겟세마네,'' ''제자들,'' and ''기도'' are standard, suitable renderings. Using ''예수께서'' rather than the context-dependent ''그분께서'' gives the Korean verse an unambiguous subject without adding theological interpretation.'
  issues:
  - severity: medium
    issue: '''내가 기도하는 동안'''
    rationale: This means 'while I am praying' and shifts the temporal-limit force of ἕως προσεύξωμαι. It should be rendered '내가 기도할 때까지.'
  - severity: low
    issue: '''그분께서'''
    rationale: Though respectful, this pronoun depends on prior context and is less clear in a standalone verse than the explicit subject '예수께서.'
  revised_text: 그들은 겟세마네라는 곳에 이르렀습니다. 예수께서 제자들에게 말씀하셨습니다. 「내가 기도할 때까지 여기 앉아 있으십시오.」
