    reason: cultural_note
  revision_rationale: 지속된 침묵이라는 동사의 상을 ‘계속 침묵하시고’로 반영했습니다. χριστός의 칭호적 의미는 ‘메시아’로 유지했고, τοῦ εὐλογητοῦ의 경건한 우회 표현은 ‘찬송받으실 분’으로 보존했습니다. 두 주석 표지는 각각 해당 표현에 직접 연결했습니다.
