review_pass:
  verdict: revise
  source_fidelity: 초안은 γάρ의 설명적 연결, 가난한 이들의 지속적 현존, 원할 때 선을 행할 수 있다는 가능, 그리고 예수님의 제한된 현존이라는 대조를 대체로 담고 있습니다. 다만 ‘가난한 자들을 ... 함께 두고 있어’는 ἔχετε μεθ’ ἑαυτῶν(‘함께/곁에 있다’)를 소유하거나 의도적으로 ‘두는’ 듯이 표현하여 의미가 다소 어긋납니다.
  naturalness: ‘이는 ... 두고 있어, ... 때문입니다’는 현대 표준어 합쇼체 성경 문장으로 다소 부자연스럽습니다. 두 절을 분리하고 ‘곁에 있으며’로 옮기면 자연스럽고 원문의 대조도 분명해집니다.
  terminology: ‘가난한 사람들’, ‘선을 행하다’는 각각 πτωχούς와 αὐτοῖς εὖ ποιῆσαι를 자연스럽고 충실하게 옮깁니다. ‘선을 행하다’는 단순한 호의나 특정 형태의 구제에 한정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘가난한 자들을 항상 여러분과 함께 두고 있어’
    rationale: 원문은 가난한 사람들이 제자들과 함께 있는 지속적 상황을 말합니다. 한국어 ‘두고 있다’는 그들을 소유·배치하는 뉘앙스를 낼 수 있으므로 ‘곁에 있으며/함께 있고’가 더 충실합니다.
  - severity: low
    issue: 문장 연결과 대조의 흐름
    rationale: γάρ의 설명은 ‘왜냐하면’으로 명시할 수 있으나, 한국어에서는 앞 문맥에 이어지는 자연스러운 서술로도 충분합니다. ‘그러나’로 δέ의 대조를 분명히 하는 편이 좋습니다.
  revised_text: 가난한 사람들은 언제나 여러분 곁에 있으며, 여러분이 원할 때에는 그들에게 선을 행할 수 있습니다. 그러나 나는 언제나 여러분과 함께 있지 않습니다.
