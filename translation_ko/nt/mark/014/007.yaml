  to: 가난한 사람들은 언제나 여러분 곁에 있으며, 여러분이 원할 때에는 그들에게 선을 행할 수 있습니다. 그러나 나는 언제나 여러분과 함께 있지 않습니다.
  rationale: 원문의 시간적 대조와 ‘선을 행할 수 있음’을 유지하면서, ‘함께 두고 있다’가 낳는 부정확한 소유·배치 뉘앙스를 제거했습니다. 교리적 해석이나 가난한 이들에 대한 돌봄의 부정은 덧붙이지 않았습니다.
