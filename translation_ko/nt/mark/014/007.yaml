  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
  footnotes:
  - marker: a
    text: Or, 'you can do good to them.' The Greek idiom means to act beneficially toward them, not merely to feel goodwill.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람들은 언제나 여러분 곁에 있으며, 여러분이 원할 때에는 그들에게 선을 행할 수 있습니다. 그러나 나는 언제나 여러분과 함께 있지 않습니다.
  philosophy: optimal-equivalence
