  source_fidelity: 초안은 τῆς διαθήκης를 ‘언약의’로, ὑπὲρ πολλῶν을 ‘많은 사람을 위하여’로 옮겨 핵심 의미를 대체로 보존합니다. 그러나 ἐκχυννόμενον은 현재 수동분사이며 ‘흘리는’은 주체와 상이하게 읽힐 수 있으므로 수동 표현으로 고쳐야 합니다. 또한 닫는 인용부호가 없습니다.
  naturalness: ‘많은 사람을 위하여 흘려지는 나의 언약의 피’는 현대 표준 한국어 합쇼체 문맥에서 자연스럽고, 성찬/언약의 비유적 표현도 유지합니다. ‘쏟아지는’도 가능하지만 여기서는 한국어 성서 문체에서 자연스러운 ‘흘려지는’을 사용합니다.
  terminology: ‘언약’은 διαθήκη의 문맥상 의미를 정확히 반영하며, 원문에 없는 ‘새’는 넣지 않았습니다. ‘피’와 ‘많은 사람’도 원문의 신학적·수사적 무게를 보존합니다.
  issues:
  - severity: high
    issue: 수동분사 ἐκχυννόμενον의 번역
    rationale: 초안의 ‘흘리는’은 능동형으로 읽히며, 원문의 ‘부어지다/흘려지다’라는 현재 수동 의미를 충분히 반영하지 못합니다.
  - severity: medium
    issue: 인용부호 미종결
    rationale: 직접 인용문을 여는 인용부호만 있고 닫는 인용부호가 없어 문장 구조가 완결되지 않습니다.
  - severity: low
    issue: 본문 이문 및 어휘 대안 주석 부재
    rationale: 원문 본문에는 ‘새’가 없다는 중요한 이문과 ἐκχυννόμενον 및 ὑπὲρ πολλῶν의 가능한 번역 범위를 주석으로 제시하면 원문 충실성과 번역의 투명성이 높아집니다.
  revised_text: 그리고 그분께서 그들에게 말씀하셨습니다. “이것은 많은 사람을 위하여 흘려지는 나의 언약의 피입니다.”
  revised_footnotes:
  - marker: a
    text: 일부 사본과 병행 구절에는 ‘새 언약의 나의 피’라고 되어 있습니다. 그러나 마가복음의 이 그리스어 본문은 ‘나의 언약의 피’라고 읽는 것이 가장 타당합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘쏟아지고 있는’. 전통적으로는 ‘흘린’ 또는 ‘흘려진’으로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘많은 사람을 대신하여’ 또는 ‘많은 사람을 위하여’.
    reason: lexical_alternative
  revision_rationale: 원문의 직접 서술과 현재 수동분사를 반영하여 ‘흘리는’을 ‘흘려지는’으로 고치고, 누락된 닫는 인용부호를 보완했습니다. διαθήκη는 문맥상 ‘언약’으로 유지했으며, 원문에 없는 ‘새’를 본문에 첨가하지 않았습니다. 이문과 주요 어휘 대안은 주석으로 제시하되, 본문은 신학적 해석을 추가하지 않고 원문의 ‘많은 사람’을 그대로 보존했습니다.
