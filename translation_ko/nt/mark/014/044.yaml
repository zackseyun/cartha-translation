source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: Now the one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
  footnotes:
  - marker: a
    text: Or “a sign”; the Greek term refers to an agreed identifying signal.
    reason: lexical_alternative
  - marker: b
    text: A kiss was a customary greeting and here serves as Judas’s identifying signal.
    reason: cultural_note
  - marker: c
    text: Or “lead him away safely.” Here “securely” likely means making sure he is kept under firm control.
    reason: alternative_reading
translation:
  language: ko
  text: 그분을 넘겨줄 자는 이미 그들에게 신호[a]를 정해 놓고 이렇게 말하였습니다. 「내가 입을 맞추는 이[b]가 바로 그분입니다. 그를 붙잡아 확실히[c] 데리고 가십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘표지’. 그리스어는 미리 약속한 식별 신호를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 입맞춤은 관습적인 인사였으며, 여기서는 유다의 식별 신호로 사용됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘안전하게’. 여기서는 그가 도망하지 못하도록 확실히 확보한다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
