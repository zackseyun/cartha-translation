  source_fidelity: δεδώκει의 완료된 선행 행위는 ‘이미 … 정해 놓고’로, σύσσημον의 합의된 식별 표지는 ‘신호’로 반영했습니다. ἀσφαλῶς는 예수의 안녕을 뜻하는 ‘안전하게’보다 도주하지 못하도록 확실히 확보한다는 뜻이므로 ‘확실히’로 고쳤습니다.
  naturalness: 초안의 ‘그가 그 사람입니다’와 ‘안전하게 끌고 가십시오’는 현대 표준어에서 각각 다소 부자연스럽거나 의미가 빗나갈 수 있습니다. ‘바로 그분입니다’와 ‘확실히 데리고 가십시오’가 합쇼체 문맥에 자연스럽습니다.
