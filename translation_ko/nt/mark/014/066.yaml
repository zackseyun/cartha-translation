  terminology: ‘베드로’, ‘대제사장’, ‘여종’, ‘뜰’은 일관되고 이해하기 쉬운 성경 번역 용어입니다. παιδίσκη가 종/노예 신분을 가리킬 수 있는 어휘라는 점은 원문에 법적 신분이 명시되지 않은 만큼 ‘여종’으로 옮긴 현 번역이 적절합니다.
