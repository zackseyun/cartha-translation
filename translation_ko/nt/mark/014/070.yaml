  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
  footnotes:
  - marker: a
    text: Or 'your accent is similar' or 'your way of speaking is like theirs.' The Greek λαλιά can refer to speech-pattern, dialect, or accent.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts omit 'and your speech matches it.'
    reason: textual_variant
translation:
  language: ko
  text: 그러나 그는 다시 부인했습니다. 잠시 후에 곁에 서 있던 사람들이 다시 베드로에게 말했습니다. “참으로 당신은 그들 가운데 한 사람입니다. 당신도 갈릴리 사람이고, 말씨도 그들의 말씨와 같습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 일부 사본에는 “말씨도 그들의 말씨와 같습니다”가 없습니다.
    reason: textual_variant
