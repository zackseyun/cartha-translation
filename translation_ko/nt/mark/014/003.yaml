  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
  footnotes:
  - marker: a
    text: Or 'genuine nard'; the adjective translated 'pure' (πιστικῆς) is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 베다니에 있는 나병 환자 시몬의 집에서 식사 자리에 기대어 누워 계실 때, 한 여자가 매우 값비싼 순수한[a] 나드 향유가 든 설화석고 향유병을 가지고 와서, 그 향유병을 깨뜨리고 그분의 머리에 향유를 부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘순수한’으로 번역한 말(πιστικῆς)은 뜻이 논쟁적입니다. ‘진짜 나드’로 번역할 수도 있습니다.
    reason: lexical_alternative
