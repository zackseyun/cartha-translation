review_pass:
  verdict: revise
  source_fidelity: The draft conveys the setting, Simon’s designation, the woman, costly nard perfume, breaking of the container, and anointing of Jesus’ head. However, ‘문둥병자’ is obsolete and stigmatizing in modern Korean, and ‘옥합’ does not clearly represent the alabaster container. The disputed sense of πιστικῆς should also retain a footnote.
  naturalness: ‘베다니에 계시면서 ... 누우셨을 때’ combines temporal expressions awkwardly. ‘식사 자리에 비스듬히 누우셨을 때’ is understandable but less natural than describing reclining at a meal. The revision uses modern, formal-polite Korean while retaining the ancient dining posture.
  terminology: ‘나병 환자 시몬’ is the current neutral rendering of Σίμωνος τοῦ λεπροῦ and does not add ‘former.’ ‘설화석고 향유병’ makes the alabaster container explicit. ‘순수한 나드’ follows the audit trail’s main rendering, with a note preserving the lexical uncertainty.
  issues:
  - severity: medium
    issue: Obsolete, stigmatizing designation ‘문둥병자’
    rationale: This expression is not appropriate in modern standard Korean. ‘나병 환자’ retains the source designation without supplying the unsupported qualification ‘former.’
  - severity: medium
    issue: ‘옥합’ obscures ἀλάβαστρον
    rationale: The term is traditional but does not clearly communicate an alabaster container to modern readers. ‘설화석고 향유병’ more directly represents the source term.
  - severity: low
    issue: No footnote for disputed πιστικῆς
    rationale: The English audit trail identifies this adjective as disputed. A Korean footnote should preserve the alternative ‘진짜/진품의’ sense rather than presenting ‘순수한’ as certain.
  - severity: low
    issue: Awkward temporal phrasing
    rationale: The consecutive ‘계시면서 ... 누우셨을 때’ is not idiomatic Korean for the Greek circumstantial setting. A single temporal clause reads more naturally.
  revised_text: 그분께서 베다니에 있는 나병 환자 시몬의 집에서 식사 자리에 기대어 누워 계실 때, 한 여자가 매우 값비싼 순수한[a] 나드 향유가 든 설화석고 향유병을 가지고 와서, 그 향유병을 깨뜨리고 그분의 머리에 향유를 부었습니다.
