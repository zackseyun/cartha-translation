    rationale: ἐξῆλθεν ἔξω의 ‘밖으로 나감’과 προαύλιον의 앞뜰/바깥뜰 개념을 ‘바깥 앞뜰’로 겹쳐 옮기면 한국어가 어색합니다. ‘바깥뜰로 나갔습니다’가 의미를 자연스럽게 보존합니다.
