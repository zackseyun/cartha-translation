  source_fidelity: 원문의 부정 동사와 ‘알다/이해하다’의 병렬은 대체로 반영했지만, προαύλιον을 ‘바깥 앞뜰’로 옮긴 표현은 한국어에서 중복되고 부자연스럽습니다. 또한 대괄호로 표시된 ‘수탉이 울었다’라는 본문 이문에 대한 각주가 필요합니다.
  naturalness: ‘그가 부인하며 말했습니다’는 가능하나 ‘그는 부인하여 말했습니다’가 더 매끄럽습니다. ‘바깥뜰로 나갔습니다’는 ἐξῆλθεν ἔξω εἰς τὸ προαύλιον의 이동과 장소를 자연스럽게 전달합니다.
  terminology: ‘이해하지도 못합니다’는 ἐπίσταμαι에 적절하며, ‘수탉이 울었습니다’는 ἀλέκτωρ ἐφώνησεν을 자연스럽고 구체적으로 옮깁니다.
