  source_fidelity: 그리스어 ἀφεῖλεν은 귀를 단지 베었다는 뜻보다 ‘잘라 내다/떼어 내다’라는 결과를 나타냅니다. 또한 αὐτοῦ는 대제사장이 아니라 맞은 종의 귀를 가리키므로 한국어에서 이를 분명히 하는 것이 좋습니다.
  naturalness: ‘곁에 서 있던 사람들 가운데 한 사람’과 ‘칼을 뽑아’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. ‘그 종의 귀를 잘라 버렸습니다’는 절단·제거의 결과를 명료하게 표현합니다.
  terminology: ἀρχιερεύς는 ‘대제사장’, δοῦλος는 이 서사적 사회 관계에서는 관용적이고 자연스러운 ‘종’으로 옮길 수 있습니다. 별도 각주는 필요하지 않습니다.
