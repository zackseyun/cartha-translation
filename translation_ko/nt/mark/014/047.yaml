    rationale: 원문은 대제사장의 종을 친 뒤 그 종의 귀를 제거했다고 말합니다. ‘그 종의 귀를 잘라 버렸습니다’로 절단의 결과와 지시 대상을 모두 명확히 할 수 있습니다.
