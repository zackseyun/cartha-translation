  verdict: revise
  source_fidelity: The draft correctly conveys the disciples’ grief, their individual responses, the referent of αὐτῷ, and the negative-answer expectation of μήτι. However, the single Korean verb phrase '말했습니다' does not clearly retain the inception force of ἤρξαντο governing both 'to be grieved' and 'to say.'
  naturalness: The proposed revision is natural in modern formal-polite Korean. '제가 아니겠지요?' is a more idiomatic respectful first-person response to Jesus than '나는 아니지요?' while retaining the emphatic personal denial.
  terminology: '''그분께'' appropriately preserves the Greek pronoun without unnecessarily replacing it with ''예수님.'' No specialized theological terminology is at issue.'
  issues:
