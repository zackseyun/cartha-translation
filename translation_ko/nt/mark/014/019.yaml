    issue: The inception force of ἤρξαντο is not clearly applied to both λυπεῖσθαι and λέγειν.
    rationale: 'Greek has one governing verb, ''they began,'' followed by coordinated infinitives: ''to be grieved and to say.'' The Korean draft explicitly says only that they began grieving, then simply that they spoke.'
