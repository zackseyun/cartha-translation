review_pass:
  verdict: revise
  source_fidelity: ἀπάγω는 단순한 이동보다 구금·호송의 맥락에서 ‘데려가다/끌고 가다’의 뜻이지만, ‘끌고 갔습니다’는 물리적으로 질질 끄는 뉘앙스를 불필요하게 더합니다. ‘데려갔습니다’가 원문의 범위를 더 정확히 보존합니다. 복수 ἀρχιερεῖς, πρεσβύτεροι, γραμματεῖς 전체에 걸리는 πάντες는 세 집단 뒤에 ‘모두’를 두어 분명히 반영했습니다. συνέρχονται의 역사적 현재는 자연스러운 한국어 과거 서술로 옮겼습니다.
  naturalness: ‘대제사장에게로’와 ‘한자리에 모두 모였습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 집합·집결 의미를 명료하게 전달합니다.
  terminology: 단수 ἀρχιερεύς는 ‘대제사장’, 복수 ἀρχιερεῖς도 해당 지도층을 가리키므로 ‘대제사장들’로 유지했습니다. γραμματεῖς는 복음서 문맥에서 통용되는 ‘율법학자들’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘끌고 갔습니다’가 ἀπήγαγον의 방식을 과도하게 구체화합니다.
    rationale: 원문은 예수를 구금 상태로 데려간 사실을 말하지만, 난폭하게 끄는 행위를 명시하지는 않습니다. ‘데려갔습니다’가 더 중립적입니다.
  - severity: low
    issue: ‘모든’의 범위가 첫 집단에만 걸리는 것으로 읽힐 수 있습니다.
    rationale: πάντες는 대제사장들·장로들·율법학자들의 열거 전체를 수식합니다. ‘...들이 모두’가 범위를 더 분명히 합니다.
  revised_text: 그리고 그들은 예수를 대제사장에게로 데려갔습니다. 그러자 대제사장들과 장로들과 율법학자들이 한자리에 모두 모였습니다.
