revisions:
- from: 진실로 내가 여러분에게 말합니다. 온 세상 어디서든지 이 복음이 전파되는 곳에서는, 이 여자가 행한 일도 그를 기념하여 이야기될 것입니다.」
  to: 진실로 내가 여러분에게 말씀드립니다. 온 세상 어디에서든 이 복음이 선포되는 곳에서는, 이 여자가 한 일도 그녀를 기념하여 전해질 것입니다.
  rationale: The revision corrects the feminine referent of αὐτῆς, removes the unmatched punctuation, and improves Korean flow while retaining the Greek sentence’s solemn declaration, universal/indefinite scope, proclamation terminology, and memorial purpose. No footnote is required for the revised Korean wording.
