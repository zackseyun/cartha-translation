- from: 예수께서 멈추어 서서 말씀하셨습니다. 「그를 불러오십시오.」 그러자 그들이 그 눈먼 사람을 불러 그에게 말했습니다. 「용기를 내십시오, 일어나십시오, 그분께서 당신을 부르십니다.」
  to: 예수께서 걸음을 멈추시고 말씀하셨습니다. 「그를 부르십시오.」 그러자 그들이 그 눈먼 사람을 불러 그에게 말했습니다. 「용기를 내십시오. 일어나십시오. 그분께서 당신을 부르십니다.」
  rationale: ‘부르다’를 두 차례 일관되게 사용하여 φωνέω의 반복을 보존하고, στὰς의 문맥적 의미를 자연스러운 한국어로 옮겼습니다. 문장부호만 다듬었으며 의미나 신학적 해석을 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
