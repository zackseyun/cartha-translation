  text: 그들은 여리고에 이르렀습니다.[a] 그분께서 제자들과 꽤 많은 무리와 함께 여리고에서 나가실 때, 디매오의 아들 바디매오라는 눈먼 거지가 길가에 앉아 있었습니다.
