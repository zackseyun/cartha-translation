  text: 그들은 예루살렘으로 올라가는 길을 가고 있었는데, 예수께서는 그들보다 앞서 가고 계셨습니다. 그들은 놀랐고, 뒤따르던 이들은 두려워했습니다. 예수께서는 다시 열둘을 따로 데리고 가셔서, 자신에게 일어날 일들을 그들에게 말씀하기 시작하셨습니다.
