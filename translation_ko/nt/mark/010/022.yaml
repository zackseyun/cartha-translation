  source_fidelity: στυγνάσας의 눈에 보이는 침울한 반응을 ‘얼굴이 어두워져’로 잘 옮겼고, ἐπὶ τῷ λόγῳ의 반응 계기인 ‘그 말씀에’도 보존했습니다. λυπούμενος의 지속되는 슬픔은 ‘슬퍼하며’에, ἀπῆλθεν은 ‘떠나갔으니’에 자연스럽게 반영되었습니다. ἦν γὰρ ἔχων κτήματα πολλά도 ‘많은 재산을 가지고 있었기 때문입니다’로 충실히 전달합니다.
