  terminology: ‘말씀’, ‘재산’, ‘슬퍼하며’는 문맥과 현대 한국어 성서 문체에 적절합니다. 본문은 그 사람의 반응을 묘사할 뿐 도덕적 평가나 교리적 해석을 덧붙이지 않습니다.
