review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the social sense of ἐν ὑμῖν, πρῶτος, πάντων, and the stronger force of δοῦλος as “노예.” However, “되어야 합니다” changes the Greek future ἔσται (“will be”) into an explicit necessity (“must be”). The future should be retained in Korean.
  naturalness: The wording is generally natural in modern formal-polite Korean. Adding “하는 사람은” makes the indefinite relative construction smoother, and “될 것입니다” gives a natural formal-polite future formulation.
  terminology: “노예” appropriately preserves the distinction from διάκονος in the preceding verse and reflects the strong, subordinated sense of δοῦλος. “모든 사람의 노예” faithfully retains πάντων without adding interpretive limitation.
  issues:
  - severity: medium
    issue: “되어야 합니다” renders ἔσται as explicit obligation.
    rationale: ἔσται is future indicative, literally “will be.” Though the saying has exhortative force in context, “되어야 합니다” is stronger and less formally equivalent than the source. “될 것입니다” preserves the Greek form while functioning naturally in this instructional context.
  revised_text: 또 누구든지 여러분 가운데서 첫째가 되고자 하는 사람은 모든 사람의 노예가 될 것입니다.
