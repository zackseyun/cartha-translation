- from: 그리고 누구든지 여러분 가운데서 첫째가 되고자 하면, 모든 사람의 노예가 되어야 합니다.
  to: 또 누구든지 여러분 가운데서 첫째가 되고자 하는 사람은 모든 사람의 노예가 될 것입니다.
  rationale: The revision preserves the Greek future ἔσται with “될 것입니다,” while retaining “노예” for δοῦλος to maintain the intended contrast with the less forceful service term in the preceding verse. “또” is a natural connective for καὶ, and the added head noun makes the Korean conditional-relative construction idiomatic without changing meaning.
  reviewer_model: gpt-5.6-terra
