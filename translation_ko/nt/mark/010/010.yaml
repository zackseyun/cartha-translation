  verdict: revise
  source_fidelity: The draft conveys the disciples' inquiry and the repeated sense of πάλιν, but '집에서' treats εἰς τὴν οἰκίαν simply as a static location. '집에 들어가서' more clearly retains the movement into the house while remaining natural Korean. The simple past is an acceptable Korean rendering of the imperfect in this concise narrative context.
  naturalness: '''이에 관하여'' is understandable but somewhat stiff in modern Korean. ''이 일에 관하여'' is more idiomatic and makes the referent naturally clear without adding interpretive detail. Placing ''다시'' with ''물었습니다'' clearly associates it with the questioning.'
  terminology: '''제자들'' is appropriate for οἱ μαθηταί. ''그분께'' suitably renders the pronoun αὐτόν in the requested respectful formal register without unnecessarily replacing it with a proper name.'
  issues:
  - severity: medium
    issue: '''집에서'' does not reflect the directional force of εἰς τὴν οἰκίαν.'
    rationale: The Greek explicitly uses εἰς ('into'). In this narrative setting, '집에 들어가서' preserves the transition to the private setting more faithfully.
  - severity: low
    issue: '''이에 관하여'' is less natural than ''이 일에 관하여'' in contemporary formal Korean.'
    rationale: The latter is a standard, clear way to render περὶ τούτου ('concerning this matter') and avoids a somewhat bureaucratic-sounding demonstrative expression.
