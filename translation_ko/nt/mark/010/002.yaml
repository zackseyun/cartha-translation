  - severity: medium
    issue: The imperfect aspect and participial relation are not adequately represented.
    rationale: ἐπηρώτων denotes ongoing/repeated asking, and πειράζοντες is best represented as concurrent action, “while testing him,” rather than solely as a purpose clause.
  - severity: medium
    issue: The Korean divorce expression is unnatural.
    rationale: Standard Korean does not normally say that a husband ‘divorces a wife’ with the object marker in this construction; “아내와 이혼하다” is idiomatic.
