  verdict: revise
  source_fidelity: The draft adds “바리새인들이 그분께 와서” (“the Pharisees came to him”), which is not present in the supplied SBLGNT text. It also renders the imperfect ἐπηρώτων as a simple past and frames πειράζοντες as a purpose clause (“in order to test”), rather than as a concurrent participle.
  naturalness: “남편이 아내를 이혼하는” is not idiomatic standard Korean. Korean naturally expresses this as “남자가 아내와 이혼하다.”
  terminology: “율법상 허용되는지” appropriately conveys ἔξεστιν in this legal dispute. “아내” is contextually required for γυναῖκα here, while “남자” preserves the generic force of ἀνήρ without unnecessarily specifying possession.
