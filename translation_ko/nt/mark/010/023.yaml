    reason: χρήματα는 현금만이 아니라 더 넓게 돈이나 소유·재산을 가리킬 수 있습니다.
  revision_rationale: The revision retains the historical-narrative style appropriate to Korean Scripture translation, renders the participial sequence naturally, makes the Greek future explicit, and preserves the breadth of χρήματα with an anchored lexical note. It does not strengthen the statement into impossibility or otherwise resolve its theological tension.
