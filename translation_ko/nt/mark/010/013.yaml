review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘손을 대시기를’은 문맥상 가능하지만 ἅψηται의 직접적인 의미인 ‘만지시다’보다 구체적이며, ‘바랐으나’는 ἵνα가 나타내는 목적을 다소 약화합니다. προσέφερον의 미완료상은 ‘데려오고 있었습니다’로 반영했습니다. αὐτοῖς는 문맥상 아이들을 데려온 사람들을 가리키므로 이를 분명히 했습니다.
  naturalness: 합쇼체의 자연스러운 현대 한국어로 다듬었습니다. 목적 관계를 별도 문장으로 풀어 한국어의 과도한 반복과 어색한 목적절 연결을 피했습니다.
  terminology: παιδία는 넓은 의미의 ‘아이들’로 옮기고, 가능한 ‘어린아이들’이라는 대안을 각주로 제시했습니다. 예수에 대한 높임은 현대 한국어 성경 문체에 맞게 ‘예수님’과 ‘만지시다’로 일관되게 처리했습니다.
  issues:
  - severity: medium
    issue: ‘손을 대시기를’은 원문에 없는 ‘손’을 연상시키며 한국어에서 뜻이 넓게 들릴 수 있습니다.
    rationale: ἅπτομαι는 여기서 우선 ‘만지다’이므로, 평행본문의 안수 장면을 본문에 끌어들이지 않는 직접 번역이 더 적절합니다.
  - severity: medium
    issue: ‘바랐으나’는 목적절 ἵνα의 기능을 소망·요청의 의미로 옮깁니다.
    rationale: 원문은 사람들이 예수께서 아이들을 만지시게 하려는 목적으로 데려왔음을 말합니다.
  - severity: low
    issue: ‘그들을’은 한국어에서 아이들을 가리키는 것으로도 읽힐 수 있습니다.
    rationale: αὐτοῖς의 자연스러운 선행사는 아이들을 데려온 사람들이므로, 서술상 ‘그 사람들’로 밝혀 오해를 줄였습니다.
