  text: 그리고 그들은 그를 조롱하고 그에게 침을 뱉고 그를 채찍질하고 죽일 것입니다. 그리고 그는 사흘 후에[a] 일어나실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
