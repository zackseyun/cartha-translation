  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
  footnotes:
  - marker: a
    text: Or 'as a child.' The phrase may point to childlike humility, trust, or dependence, but the Greek does not specify which nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로 내가 여러분에게 말합니다. 누구든지 하나님의 나라를 어린아이처럼[a] 받아들이지 않는 사람은 결코 그 나라에 들어가지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린아이로서’. 이 표현은 어린아이의 겸손, 신뢰 또는 의존을 가리킬 수 있으나, 헬라어 본문은 어느 한 의미를 특정하지 않습니다.
    reason: lexical_alternative
