  text: 제자들은 그분의 말씀에 몹시 놀랐습니다. 예수께서 다시 대답하여 그들에게 말씀하셨습니다. “자녀들아, 하나님의 나라에 들어가기가 얼마나 어려운 일입니까!”[a]
