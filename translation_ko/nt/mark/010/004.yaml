  source_fidelity: 원문의 ἐπέτρεψεν(‘허락했다’)과 βιβλίον ἀποστασίου(‘이혼 증서’)는 충실히 옮겼습니다. 다만 ‘보내는 것’은 한국어에서 이혼 증서를 보내는 것으로도 읽힐 수 있어, ἀπολῦσαι가 가리키는 이혼의 상대를 명시하는 편이 문맥과 의미를 더 정확히 전달합니다.
  naturalness: 합쇼체 문장과 인용 형식은 자연스럽습니다. ‘이혼 증서를 써서 아내를 내보내는 것’으로 하면 동작의 대상이 분명해지고, ‘내보내다’는 이 문맥의 법적·관용적 이혼 행위를 무리 없이 드러냅니다.
  terminology: ‘모세’, ‘이혼 증서’, ‘허락했습니다’는 표준적이고 적절합니다. ‘내보내다’는 ἀπολύω의 문자적 표현을 보존하면서 앞선 ‘이혼 증서’가 이혼 문맥을 밝혀 줍니다.
  issues:
