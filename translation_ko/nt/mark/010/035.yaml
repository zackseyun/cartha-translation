  source_fidelity: 초안은 인물 식별과 요청의 기본 뜻을 잘 옮겼습니다. 다만 ποιήσῃς ἡμῖν은 단순히 ‘우리에게 행하다’보다 ‘우리를 위해 해 주다’라는 뜻이므로 이를 분명히 했습니다. 또한 무엇이든지(ὃ ἐὰν)의 무제한성을 유지했습니다.
  naturalness: ‘우리에게 행해 주시기를’은 현대 한국어에서 부자연스럽고 ‘행하다’의 대상 관계도 모호합니다. ‘우리를 위해 해 주시기를’이 현대 표준어 합쇼체에서 자연스럽고 원문의 직접적인 요청 어조를 유지합니다.
  terminology: Διδάσκαλε는 ‘선생님’으로 적절합니다. 세베대, 야고보, 요한의 통용 표기를 유지했습니다. προσπορεύονται의 이동 의미를 반영하여 ‘나아갔습니다’로 옮기고, 선택 가능한 더 직역적인 표현을 각주로 제시했습니다.
  issues:
