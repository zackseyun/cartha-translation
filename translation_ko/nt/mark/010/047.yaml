    issue: Awkward rendering of κράζειν καὶ λέγειν
    rationale: ‘부르짖어 말하기 시작했습니다’ is grammatically possible but stylistically stiff and does not sound like natural modern Korean. ‘큰 소리로 외치기 시작했습니다’ expresses κράζειν naturally; the ensuing direct speech supplies λέγειν.
  revised_text: 그는 나사렛 사람 예수라는 말을 듣자 큰 소리로 외치기 시작했습니다. “다윗의 자손 예수님, 저에게 자비를 베풀어 주십시오!”
