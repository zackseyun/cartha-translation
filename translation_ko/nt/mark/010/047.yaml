  source_fidelity: ‘나사렛 사람 예수’는 의미상 가능하지만, Ναζαρηνός의 호칭적·형용사적 성격을 충분히 살리지 못하고 다소 설명적으로 들립니다. 또한 ‘부르짖어 말하기 시작했습니다’는 δύο 동사(‘외치다’와 ‘말하다’)의 연결이 한국어에서 어색합니다.
  naturalness: ‘나사렛 예수’와 ‘외치며 말하기 시작했습니다’는 현대 표준어 합쇼체 문맥에서 더 자연스럽고, 원문의 발화 개시와 긴급한 외침을 함께 보존합니다.
  terminology: ‘다윗의 자손’은 Υἱὲ Δαυὶδ의 전통적이며 메시아적 함의를 보존하는 적절한 번역입니다. 직접 호칭에서는 현대 한국어의 공손한 문체에 맞추어 ‘예수님’을 사용했습니다.
  issues:
  - severity: medium
    issue: Ναζαρηνός의 호칭적 표현
    rationale: ‘나사렛 사람’은 지리적 출신을 풀어 쓴 표현으로 들립니다. 본문은 ‘나사렛 예수’라는 호칭을 사용하고, ‘나사렛 출신 예수’는 각주에서 대안으로 제시하는 편이 원문의 형태를 더 잘 보존합니다.
  - severity: low
    issue: ‘부르짖어 말하기 시작했습니다’의 연결
    rationale: 원문의 ἤρξατο κράζειν καὶ λέγειν은 외침과 발화를 함께 시작한 것을 나타냅니다. ‘외치며 말하기 시작했습니다’가 한국어에서 더 자연스럽게 이를 반영합니다.
  revised_text: 그가 나사렛 예수라는 말을 듣자, 외치며 말하기 시작했습니다. “다윗의 자손이신 예수님, 저를 불쌍히 여겨 주십시오!”
  revised_footnotes:
  - marker: a
    text: 또는 “나사렛 출신 예수.” 그리스어는 지리적 출신을 풀어 말하는 표현보다 ‘나사렛 사람’이라는 호칭적 형용사를 사용합니다.
    reason: lexical_alternative
  revision_rationale: 본문은 Ναζαρηνός를 ‘나사렛 예수’로 옮겨 호칭적 성격을 유지하고, 대안적 지리 표현은 각주로 처리했습니다. ‘외치며 말하기 시작했습니다’는 ἤρξατο와 κράζειν καὶ λέγειν을 자연스럽게 반영합니다. ‘다윗의 자손’ 및 자비를 구하는 청원은 유지했습니다.
