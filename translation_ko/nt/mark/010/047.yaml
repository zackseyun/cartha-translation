  source_fidelity: The draft conveys the temporal participle, the designation 'the Nazarene,' the inception of the outcry, the Davidic title, and the plea for mercy. However, '부르짖어 말하기 시작했습니다' is an unnatural Korean handling of the paired infinitives κράζειν καὶ λέγειν. A natural rendering can retain both actions without adding meaning.
  naturalness: ‘나사렛 사람 예수’ is understandable and appropriately reflects the epithet-like designation. The revised wording makes the public, urgent appeal idiomatic in modern formal-polite Korean while preserving Mark’s twofold expression.
  terminology: ‘다윗의 자손’ appropriately retains the established Korean rendering and the messianic-title force of Υἱὲ Δαυίδ. ‘저에게 자비를 베풀어 주십시오’ naturally and accurately renders the plea ἐλέησόν με in the requested register. ‘예수님’ is the normal respectful Korean vocative and does not alter the source’s address.
