  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
  footnotes:
  - marker: a
    text: Or 'has made you well' or 'has healed you.' The Greek verb can refer to healing as well as salvation.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the way.'
    reason: lexical_alternative
  - marker: c
    text: '''Faith'' could also be expressed as ''trust'' here.'
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “가십시오. 당신의 믿음[c]이 당신을 구원했습니다[a].” 그리고 그는 곧 다시 보게 되었고, 길[b]에서 그분을 따라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 낫게 했습니다’ 또는 ‘당신을 고쳤습니다.’ 그리스어 동사는 치유뿐 아니라 구원을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가는 길에서.’
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘믿음’은 ‘신뢰’로도 표현할 수 있습니다.
    reason: alternative_reading
