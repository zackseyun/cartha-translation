  source_fidelity: 본문은 대체로 원문을 충실히 옮겼습니다. 다만 καί εὐθύς는 인과를 나타내기보다 단순한 서술 연결과 즉시성을 나타내므로 ‘그러자’보다 ‘그리고 곧’이 더 직접적입니다. σέσωκέν은 문맥상 시력 회복과 관련되지만 ‘구원했습니다’라는 넓은 뜻을 본문에서 유지하는 것이 적절합니다.
  naturalness: 합쇼체는 자연스럽고 일관됩니다. ‘그리고 그는 곧’으로 연결하면 현대 표준어에서 더 매끄러우면서도 원문의 서술 흐름을 보존합니다.
  terminology: ‘믿음’, ‘구원했습니다’, ‘그분’은 적절합니다. σῴζω의 치유/온전하게 함의 의미와 πίστις의 ‘신뢰’ 가능성은 각주로 밝혀 본문의 의미 범위를 보존하는 것이 좋습니다.
