  text: 그러나 예수께서 그들에게 말씀하셨습니다. 「여러분은 무엇을 구하는지 알지 못합니다. 내가 마시는 잔을 여러분이 마실 수 있으며, 또는 내가 세례를 받는 그 세례로 여러분도 세례를 받을 수 있겠습니까?」
