  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
  footnotes:
  - marker: a
    text: The 'cup' is a biblical metaphor for the portion appointed to someone, here especially Jesus' coming suffering.
    reason: cross_reference
  - marker: b
    text: Or, more interpretively, 'to undergo the baptism that I undergo.' The Greek repeats the baptism word-group for emphasis.
    reason: lexical_alternative
