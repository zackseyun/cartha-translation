  source_fidelity: ‘두로 지방’은 εἰς τὰ ὅρια Τύρου의 지역/영토 의미를 자연스럽게 옮깁니다. 다만 ‘아무도 알지 못하기를’은 한국어에서 무엇을 알지 못한다는 것인지 다소 불완전하게 들리며, ‘숨어 계실 수 없었습니다’는 λανθάνειν의 ‘남의 눈을 피하다/눈에 띄지 않다’보다 능동적으로 숨는 뉘앙스를 더할 수 있습니다.
  naturalness: ‘아무에게도 알려지기를 원하지 않으셨으나, 남의 눈에 띄지 않으실 수 없었습니다’는 원문의 암시된 내용을 과도하게 특정하지 않으면서 현대 표준 한국어 합쇼체로 자연스럽습니다.
