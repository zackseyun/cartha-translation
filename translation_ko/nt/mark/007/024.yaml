  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: ko
  text: 그분께서 այնտեղ서 일어나 두로 지방[a]으로 가셨습니다. 한 집에 들어가셔서 아무에게도 알려지기를 원하지 않으셨으나[b], 남의 눈에 띄지 않으실 수 없었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두로의 영토로’. 그리스어는 단순한 경계선만이 아니라 두로와 관련된 지역 또는 영토를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아무도 알기를 원하지 않으셨다’. 그리스어에서 목적어는 생략되어 있으며, 그분의 উপস্থিত 또는 행방을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘눈을 피하실 수 없었습니다’.
    reason: lexical_alternative
