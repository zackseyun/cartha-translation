  terminology: κοινόω는 이 정결 논쟁의 문맥에서 ‘부정하게 하다’로 옮기는 것이 적절하며, 의례적 부정과 문맥상의 더 넓은 함의를 불필요하게 한쪽으로 좁히지 않습니다. ἄνθρωπος는 대표적 단수인 ‘사람’으로 일관되게 옮겼습니다.
