review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the entry into a house, separation from the crowd, the disciples as subject, and their inquiry concerning τὴν παραβολήν. However, ‘무리에게서 떠나’ can momentarily sound as though Jesus’ departure itself, rather than his entry into the house apart from the crowd, is the main action; a closer Korean construction improves the attachment. The lexical range of παραβολή should also retain the supplied audit-trail note.
  naturalness: ‘그 비유에 대하여 그분에게’ is grammatically possible but repetitious and less natural in modern formal Korean. ‘그 비유에 관하여 그분께’ is idiomatic and maintains the required honorific register.
  terminology: ‘비유’ is the appropriate primary rendering of παραβολή and preserves Mark’s designation without interpretively narrowing it to a mere saying. The honorific ‘들어가셨을 때/그분께’ is consistent with formal-polite Korean narration about Jesus.
  issues:
  - severity: low
    issue: Awkward phrase attachment in ‘무리에게서 떠나 집에 들어가시자’
    rationale: The Greek ἀπὸ τοῦ ὄχλου is linked with entering the house in a setting apart from the crowd. ‘무리를 떠나 집에 들어가셨을 때’ expresses this relationship more naturally while preserving the temporal clause.
  - severity: low
    issue: Repetitive and less idiomatic object/recipient phrasing
    rationale: Replacing ‘그 비유에 대하여 그분에게’ with ‘그 비유에 관하여 그분께’ is natural modern formal Korean and preserves both the topic and indirect object.
  - severity: low
    issue: Lexical-alternative footnote for παραβολή is absent
    rationale: The English audit trail flags the broader possible senses ‘saying’ and ‘illustration.’ A Korean note preserves that lexical transparency without displacing the primary translation ‘비유.’
  revised_text: 그분이 무리를 떠나 집에 들어가셨을 때, 그분의 제자들이 그 비유에 관하여 그분께 물었습니다.[a]
