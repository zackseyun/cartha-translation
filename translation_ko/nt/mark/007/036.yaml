  source_fidelity: 원문의 강한 금지 명령(διεστείλατο), 반복·점층의 상관 구조(ὅσον … μᾶλλον περισσότερον), 그리고 공개적으로 알리는 행위(ἐκήρυσσον)를 충실히 반영하도록 다듬었습니다. ‘거듭 명하실수록’은 미완료 시제가 나타내는 계속적·반복적 명령의 뉘앙스를 자연스럽게 살립니다.
