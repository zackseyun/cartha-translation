  terminology: ‘명하다’는 여기서 단순한 권고보다 강한 지시를 나타내기에 적절합니다. κηρύσσω는 ‘선포하다’로 옮겨 공개적으로 널리 알리는 뜻을 유지했습니다. ‘그 일’은 원문에 함축된 선포 내용을 한국어에서 자연스럽게 보충한 것입니다.
