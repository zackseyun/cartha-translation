  text: 또 그들은 시장에서 돌아온 뒤에는 몸을 씻지 않고서는 먹지 않습니다.[a] 그리고 그들이 지키려고 전해 받은 다른 많은 것들이 있으니, 곧 잔과 항아리와 놋그릇과 침상[b]을 씻는 일입니다—
