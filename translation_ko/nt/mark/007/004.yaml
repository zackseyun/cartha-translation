review_pass:
  verdict: revise
  source_fidelity: 초안은 시장에서 돌아온 뒤의 정결 씻음과 여러 기물의 씻음이라는 기본 뜻을 잘 전달합니다. 그러나 ‘같은 것입니다’는 원문에 없는 예시·비교의 뉘앙스를 더하고, κλινῶν의 본문 이문 및 βαπτίσωνται의 어휘적 폭을 주석으로 밝혀야 합니다. ‘침상’은 원문의 폭을 보존합니다.
  naturalness: ‘자기 몸을 씻지 않고는’은 자연스럽지만, 문장 끝의 ‘같은 것입니다’는 열거를 예시로 약화하고 문체상 어색합니다. 수정문은 현대 표준어 합쇼체로 자연스럽게 문장을 마무리하면서, 원문의 이어지는 문맥을 나타내는 대시를 유지합니다.
  terminology: βαπτίσωνται와 βαπτισμούς는 이 문맥에서 각각 ‘몸을 씻다’와 ‘씻는 일’로 옮기는 것이 적절합니다. χαλκίων은 구리 및 그 합금 금속을 가리킬 수 있으므로 ‘놋그릇’은 자연스럽고 과도하게 특정하지 않습니다. κλινῶν은 ‘침상’으로 옮겨 식사용 긴 의자라는 문맥적 해석을 본문에 과도하게 넣지 않았습니다.
  issues:
