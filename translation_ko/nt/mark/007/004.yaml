    issue: ‘같은 것입니다’가 원문의 열거를 예시로 바꿉니다.
    rationale: βαπτισμοὺς 이하의 명사들은 ‘씻는 일’의 구체적 대상들을 직접 열거합니다. ‘같은’은 원문에 없는 비한정적 비교 뉘앙스를 추가합니다.
  - severity: medium
    issue: κλινῶν에 관한 본문 이문 주석이 없습니다.
    rationale: SBLGNT는 ‘침상들’을 본문에 두되 일부 사본이 이를 생략함을 표시합니다. 해당 항목에 주석 표지를 두어야 합니다.
  - severity: low
    issue: βαπτίσωνται의 가능한 ‘담그다’ 의미가 주석으로 보존되지 않았습니다.
    rationale: 이 정결 관습의 문맥에서는 ‘몸을 씻다’가 가장 적절하지만, 동사의 통상적 ‘담그다/침례를 베풀다’ 계열 의미와의 어휘적 관련은 독자 주석에서 밝혀 줄 수 있습니다.
