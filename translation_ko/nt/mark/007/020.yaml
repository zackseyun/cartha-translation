  source_fidelity: 원문의 미완료 과거 ἔλεγεν은 서술 문맥에서 자연스럽게 ‘말씀하셨습니다’로 옮겼고, δέ는 ‘또’로, 사람에게서 나오는 것이라는 분사구문과 강조 대명사 ἐκεῖνο은 ‘사람에게서 나오는 것, 그것이’로 보존했습니다. κοινόω는 정결/부정 문맥을 유지하는 ‘더럽게 합니다’로 번역했습니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. 다만 초안은 여는 인용부호만 있고 닫는 인용부호와 종결 문장부호가 없어 구조적으로 불완전합니다. ‘그분이’는 한국어에서 불필요하게 반복되는 주어이므로 생략하는 편이 자연스럽습니다.
  terminology: ‘더럽게 합니다’는 κοινόω의 부정·정결 언어를 자연스럽게 반영합니다. ‘사람’은 ἄνθρωπος의 일반적·대표적 용법을 유지합니다.
