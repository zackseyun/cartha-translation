  - severity: medium
    issue: ‘더러운 영에 사로잡혀 있었다’의 해석적 확대
    rationale: 원문은 딸이 ‘더러운 영을 가지고 있었다’고 표현합니다. ‘사로잡혀’는 본문에 없는 지배·빙의의 양태를 더 구체화하므로 피하는 것이 좋습니다.
  - severity: low
    issue: 관계절의 문장 분리
    rationale: ‘어린 딸에게 더러운 영이 있는’이라는 관계절을 한 문장 안에 유지하면 γυναίκα와 ἧς 이하의 수식 관계가 보존됩니다.
