revisions:
- from: '하늘을 우러러 깊이 탄식하시며 그에게 말씀하셨습니다: 「에바다」 곧 「열려라」 하는 뜻입니다.'
  to: 하늘을 우러러보시고 탄식하신 뒤 그에게 말씀하셨습니다. 「에바다」, 곧 「열려라」라는 뜻입니다.
  rationale: 원문에 없는 강도 부사 ‘깊이’를 제거하고, 그리스어의 동작 순서와 마가가 제공한 아람어 풀이를 현대 표준어 합쇼체로 자연스럽게 반영했습니다. ‘에바다’ 음역과 ‘열려라’라는 수동 명령형의 한국어 관용적 표현을 유지했습니다.
