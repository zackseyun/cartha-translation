  naturalness: 합쇼체 문체는 적절합니다. ‘곧 「열려라」 하는 뜻입니다’도 이해되지만, ‘곧 「열려라」라는 뜻입니다’가 현대 표준어 문장으로 더 매끄럽습니다.
  terminology: Εφφαθα는 아람어 음역 ‘에바다’로 보존하고, 본문 안의 마가의 풀이를 그대로 제시하는 것이 적절합니다. 별도 각주는 필수적이지 않습니다.
