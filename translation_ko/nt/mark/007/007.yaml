review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 「하니」는 δέ의 대조 및 분사 διδάσκοντες의 동시적 양태를 인과 관계로 기울게 하며, ἀνθρώπων과 ἐντάλματα의 복수도 충분히 드러나지 않습니다. 「그러나 … 경배하며」는 δέ와 현재분사의 관계를 더 직접적으로 보존합니다.
  naturalness: 「사람의 계명들을 교훈으로 가르칩니다」는 현대 표준어 합쇼체에서 자연스럽고, 원문의 의도적인 ‘가르침/계명’ 결합을 과도하게 풀어쓰지 않습니다.
  terminology: σέβονταί는 신적 인용문 맥락에서 「경배합니다」가 적절합니다. διδασκαλίας는 여기서 인간의 계명을 권위 있는 가르침으로 제시한다는 뜻이므로 「교훈으로」가 무난합니다. 「사람」은 성별을 한정하지 않는 ἀνθρώπων을 정확히 반영합니다.
  issues:
  - severity: medium
    issue: 「하니」가 분사의 관계를 인과적으로 처리함
    rationale: διδάσκοντες는 그들의 헛된 경배를 수반하는 양태를 나타냅니다. 한국어의 「경배하며」가 이를 더 가깝게 옮깁니다.
  - severity: low
    issue: 「사람의 계명」의 복수성이 약화됨
    rationale: ἐντάλματα는 복수이므로 「계명들」로 표시하는 것이 원문 충실도에 더 낫습니다.
  - severity: low
    issue: δέ의 대조가 미표시됨
    rationale: 앞 절의 입술의 공경과 마음의 거리라는 진술에 이어지는 대조이므로 「그러나」를 두는 것이 적절합니다.
  revised_text: 그러나 그들은 나를 헛되이 경배하며, 사람의 계명들을 교훈으로 가르칩니다.’
  revised_footnotes:
  - marker: a
    text: 또는 “사람의 계명들을 교훈으로 삼아 가르칩니다.”
    reason: διδασκαλίας와 ἐντάλματα의 관계를 ‘교훈으로’ 또는 ‘교훈으로 삼아’로 옮길 수 있는 통사적 대안을 제시합니다.
  revision_rationale: 대조 접속사 δέ를 「그러나」로, 현재분사 διδάσκοντες를 「경배하며」로 반영하고, 인간에게서 나온 명령이라는 복수 표현을 「사람의 계명들」로 보존했습니다. 인용문의 1인칭 「나」는 원문대로 유지했습니다.
