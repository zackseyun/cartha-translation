theological_decisions:
- issue: 코르반(Κορβᾶν) 음역과 풀이
  chosen_reading: 음역 「코르반」 유지 + 「곧 봉헌물」 풀이
  alternative_readings:
  - 「하나님께 드린 예물」
  - 직접 「봉헌물」으로 옮기기
  rationale: 마가가 본문에서 친히 풀이를 덧붙인 셈어 용어는 음역 + 풀이의 형태를 유지한다(에바다 7:34, 달리다 굼 5:41과 동일 패턴). 본문의 비판은 이 단어를 방패로 효도 의무를 회피하는 관행에 대한 것이므로, 셈어를 살려야 비판의 구체성이 보존된다.
  doctrine_reference: 'DOCTRINE.md: preserve Semitic terms with author-supplied gloss'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 Κορβᾶν의 음역과 마가의 풀이를 보존한 점은 좋습니다. 그러나 ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς는 부모가 화자로부터 얻을 수 있는 도움/유익을 가리키므로, 이를 더 명시적으로 표현할 필요가 있습니다. 또한 Δῶρον의 기본 뜻에는 ‘예물’이 자연스럽습니다.
  naturalness: ‘그러나 너희는 말한다’는 현대 표준어 합쇼체에 맞게 ‘그러나 너희는 말합니다’로 고쳤습니다. 직접 인용 안의 ‘당신에게서 받을 유익은 무엇이든’은 다소 경직되어 ‘당신이 나에게서 받을 수 있는 것은 무엇이든’으로 다듬었습니다.
  terminology: Κορβᾶν은 ‘코르반’으로 음역하고, 본문 자체의 해설 ὅ ἐστιν Δῶρον은 ‘곧 예물’로 옮겼습니다. ‘봉헌물’도 문맥상 가능하지만, 여기서는 마가의 일반적인 어휘 Δῶρον을 지나치게 기술적으로 한정하지 않는 ‘예물’이 더 적절합니다.
  issues:
  - severity: medium
    issue: ὠφεληθῇς의 수혜 관계가 충분히 드러나지 않음
    rationale: 원문은 부모가 ‘나에게서’ 받을 수 있는 유익을 말합니다. ‘당신이 나에게서 받을 수 있는 것’으로 수혜자와 출처를 명료하게 보존해야 합니다.
  - severity: low
    issue: 서술체가 요청된 합쇼체와 불일치
    rationale: ‘말한다’보다 ‘말합니다’가 표준어 현대 공식-공손체에 맞습니다.
  - severity: low
    issue: Δῶρον을 ‘봉헌물’로 한정함
    rationale: 문맥상 하나님께 드리는 것으로 바쳐진 물건이라는 설명은 각주에서 제공할 수 있으나, 마가의 본문 해설은 기본적으로 ‘예물/선물’입니다.
  revised_text: 그러나 너희는 말합니다. ‘사람이 자기 아버지나 어머니에게 “당신이 나에게서 받을 수 있는 것은 무엇이든 코르반[ㄱ], 곧 예물[ㄴ]입니다”라고 말하면,’
  revised_footnotes:
  - marker: ㄱ
    text: ‘코르반’은 하나님께 드리는 예물로 바쳐져 일반적인 가족 부양에 쓰지 못하게 된 것을 가리키는 말입니다.
    reason: cultural_note
  - marker: ㄴ
    text: 또는 ‘제물’.
    reason: lexical_alternative
  revision_rationale: 원문의 조건절과 인용문의 미완결 구문(다음 절에서 이어짐)을 유지했습니다. 코르반의 셈어 음역 및 마가가 덧붙인 풀이를 보존하면서, 부모가 화자에게서 받을 수 있었던 도움이라는 ἐξ ἐμοῦ ὠφεληθῇς의 관계를 자연스럽고 정확하게 드러냈습니다.
