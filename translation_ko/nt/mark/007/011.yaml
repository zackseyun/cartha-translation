review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 「당신에게서 받을 유익」은 ἐξ ἐμοῦ(‘나에게서’)의 관계를 반대로 옮겨, 부모가 화자에게서 받을 수 있는 유익이라는 뜻을 훼손합니다. 또한 원문의 미완결 인용과 다음 절로 이어지는 구문을 대시로 보존하는 것이 적절합니다.
  naturalness: 「그러나 너희는 말합니다」와 「어떤 사람이」는 현대 표준어의 격식 있는 문체에 자연스럽습니다. 인용 안에서는 부모에게 말하는 상황을 고려해 「당신이 저에게서」로 옮겨 높임의 일관성을 확보했습니다.
  terminology: Κορβᾶν은 「코르반」으로 음역하고, 마가의 자체 풀이인 δῶρον은 기본 의미에 따라 「예물」로 병기했습니다. 「봉헌물」도 가능하지만, δῶρον의 직접적 대응어로는 「예물」이 더 적절하며, 하나님께 바쳐진 것이라는 구체적 제도 설명은 본 절의 본문에 과도하게 넣지 않았습니다.
  issues:
  - severity: high
    issue: 수혜의 방향이 반대로 번역되었습니다.
    rationale: 「당신에게서 받을 유익」은 화자가 부모에게서 유익을 받는다는 뜻이지만, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς는 부모가 화자에게서 받을 수 있는 유익을 가리킵니다.
  - severity: low
    issue: 원문이 다음 절로 이어지는 미완결 인용임이 충분히 드러나지 않습니다.
    rationale: 7:11의 발화 공식은 7:12에서 문법적으로 완결되므로, 한국어에서도 대시를 사용해 연결을 보존하는 것이 좋습니다.
  revised_text: 그러나 너희는 말합니다. ‘어떤 사람이 자기 아버지나 어머니에게, 「당신이 저에게서 받을 수 있는 유익은 무엇이든 코르반, 곧 예물입니다—」라고 말하면,’
  revised_footnotes:
  - marker: a
    text: 코르반은 하나님께 드린 예물로 바쳐졌다고 선언된 것을 가리키는 말입니다.
    reason: 문화적 배경을 간략히 설명하여 음역어의 의미를 보완합니다.
  - marker: b
    text: 또는 ‘곧 헌물입니다.’
    reason: Δῶρον의 가능한 번역 대안을 제시합니다.
  revision_rationale: 핵심 수정은 ἐξ ἐμοῦ의 방향을 「당신이 저에게서 받을 수 있는」으로 바로잡는 것입니다. 「코르반」과 마가의 괄호성 풀이를 유지하되, 원문의 어순을 한국어에서 자연스럽게 재배치했습니다. 대시는 7:12로 이어지는 원문의 미완결성을 나타냅니다.
