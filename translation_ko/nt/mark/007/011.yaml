  text: 그러나 너희는 말합니다. ‘사람이 자기 아버지나 어머니에게 “당신이 나에게서 받을 수 있는 것은 무엇이든 코르반[ㄱ], 곧 예물[ㄴ]입니다”라고 말하면,’
