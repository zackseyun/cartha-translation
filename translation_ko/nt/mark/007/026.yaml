  text: 그 여인은 그리스 사람이었고[a], 혈통으로는 시로페니키아 사람이었습니다[b]. 그녀는 자기 딸에게서 그 귀신을 쫓아내 주시기를 그에게 계속 청했습니다.
  philosophy: optimal-equivalence
