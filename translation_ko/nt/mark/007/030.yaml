  source_fidelity: 그리스어의 시간적 순서(그 여자가 자기 집에 간 뒤 발견함), 아이가 침상에 누워 있는 상태, 귀신이 이미 나가 있는 완료된 결과를 충실히 옮겼습니다. ‘돌아가 보니’는 문맥상 자연스럽게 εὗρεν(발견하였다)을 나타내며, ‘귀신은 나가 있었습니다’도 ἐξεληλυθός의 결과 상태를 보존합니다.
