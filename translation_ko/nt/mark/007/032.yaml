  source_fidelity: 원문의 κωφός와 μογιλάλος는 각각 청각 장애와 말하기의 어려움을 구별하여 나타냅니다. 초안의 ‘귀먹고’는 κωφός를 대체로 반영하지만, 현대 표준어에서는 더 중립적인 표현으로 고치는 것이 적절합니다. ‘손을 얹어 주시기를’은 ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα를 충실히 옮깁니다.
  naturalness: ‘귀먹고’는 현대의 자연스럽고 존중하는 공적 문체에 맞지 않으며, ‘말 더듬는’은 μογιλάλος를 특정한 말더듬으로 지나치게 좁힐 수 있습니다. ‘귀가 들리지 않고 말하기가 어려운’이 현대 한국어에서 자연스럽고 원문의 범위를 보존합니다.
  terminology: κωφός는 여기서 뒤따르는 μογιλάλος와 구별되므로 ‘귀가 들리지 않는’으로, μογιλάλος는 완전한 침묵이 아니라 말하기의 어려움이므로 ‘말하기가 어려운’으로 옮깁니다. 치유 행위인 ‘손을 얹다’는 유지합니다.
  issues:
  - severity: medium
    issue: ‘귀먹고’는 현대 표준어의 존중하는 공적 문체에 부적절합니다.
    rationale: 의미는 전달하지만 사람을 지칭하는 표현으로 낡고 낙인적 어감을 지닐 수 있습니다.
  - severity: medium
    issue: ‘말 더듬는’은 μογιλάλος의 의미를 지나치게 한정합니다.
    rationale: μογιλάλος는 일반적으로 말하기가 어렵거나 말이 어눌한 상태를 가리키며, 특정한 말더듬만을 뜻하지는 않습니다.
  revised_text: 사람들이 귀가 들리지 않고 말하기가 어려운 사람을 그분께 데려와, 그에게 손을 얹어 주시기를 간청하였습니다.
  revised_footnotes: []
  revision_rationale: 현대적이고 존중하는 표현으로 바꾸면서, 귀가 들리지 않음과 말하기의 어려움이라는 원문의 두 특성을 구별해 보존하였습니다. ‘말 더듬는’처럼 장애의 양상을 특정하지 않았으며, 간청과 손을 얹는 행위도 유지하였습니다.
