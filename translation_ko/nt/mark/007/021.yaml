    rationale: The Greek lists evil thoughts alongside πορνεῖαι, κλοπαί, and φόνοι as distinct evils that come out from the heart; the Korean should coordinate all four items under '나옵니다.'
  - severity: low
    issue: The phrase '사람 안에서' is unnatural for an inner moral source.
    rationale: Korean normally expresses this sense as '사람들의 마음속에서' or '사람들의 내면에서.'
