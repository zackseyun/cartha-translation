review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the contrast between what enters from outside and ritual defilement, but its opening question renders ἀσύνετοι too narrowly as simply ‘do not understand.’ The Greek first asks whether the disciples lack discernment, then repeats the cognitive question with νοεῖτε.
  naturalness: The draft is understandable, but ‘너희도 그렇게 깨닫지 못하느냐?’ is not natural Korean for the adjectival rebuke, and the quotation lacks its closing mark. The revision uses modern formal-polite 합쇼체 consistently.
  terminology: ‘부정하게 하다’ appropriately renders κοινόω in this ritual-purity context. A footnote identifies the ritual-purity sense without reducing it to a later doctrinal claim.
  issues:
  - severity: medium
    issue: ἀσύνετοι is conflated with the following νοεῖτε.
    rationale: The first question is adjectival (‘are you also without discernment/understanding?’), whereas the second is verbal (‘do you not understand?’). Distinguishing them better reflects the Greek rhetoric.
  - severity: high
    issue: The direct quotation is structurally unclosed.
    rationale: The draft text has no closing quotation mark, which must be corrected for a complete valid passage text.
  revised_text: 그분이 그들에게 말씀하셨습니다. 「너희도 이렇게 분별력이 없습니까? 밖에서 사람 안으로 들어가는 모든 것이 그 사람을 부정하게 할 수 없다는 것을 깨닫지 못합니까?」
  revised_footnotes:
  - marker: a
    text: ‘부정하게 하다’는 여기서 의식적 정결과 부정의 맥락을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision distinguishes ‘lack discernment’ (ἀσύνετοι) from ‘understand’ (νοεῖτε), retains the generic singular ‘person,’ and preserves κοινόω as ritual-purity language. It also supplies the missing closing quotation mark and uses formal-polite Korean.
