review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the main clause and the purity sense of κοινῶσαι, but it leaves the Greek adjective ἀσύνετοι somewhat flattened as a repeated verbal expression and has an unclosed quotation mark. The generic singular ἄνθρωπον and the pronoun αὐτόν are retained as ‘사람’ and ‘그를.’
  naturalness: ‘밖에서 사람 안으로 들어가는 모든 것’ is natural and clear in modern Korean. Rendering ἀσύνετοι as ‘분별력이 없느냐’ and νοεῖτε as ‘깨닫지 못하느냐’ makes the rebuke idiomatic while retaining the related lack-of-understanding emphasis. ‘그분께서’ and ‘말씀하셨습니다’ maintain formal-polite narrative register.
  terminology: ‘부정하게 하다’ appropriately preserves the ritual-purity force of κοινῶσαι without reducing it to moral corruption. A footnote identifies the ritual-purity nuance and offers ‘깨끗하지 못하게 하다’ as an explanatory alternative.
  issues:
  - severity: medium
    issue: The opening Korean quotation mark is not closed.
    rationale: The verse ends with a comma because the Greek sentence continues into the next verse, but the direct-speech quotation still requires a closing quotation mark after the comma.
  - severity: low
    issue: The first question repeats ‘깨닫지 못하느냐,’ obscuring the adjective ἀσύνετοι.
    rationale: Using ‘분별력이 없느냐’ for ἀσύνετοι distinguishes it from the following νοεῖτε while naturally expressing lack of understanding.
  revised_text: 그분께서 그들에게 말씀하셨습니다. “너희도 이처럼 분별력이 없느냐? 밖에서 사람 안으로 들어가는 모든 것이 그를 부정하게 할 수 없다는 것을 너희는 깨닫지 못하느냐?”
  revised_footnotes:
  - marker: a
    text: 또는 “그를 깨끗하지 못하게 하다.” 여기서 “부정하게 하다”는 의식적 정결과 관련된 뉘앙스를 지닙니다.
    reason: lexical_alternative
  revision_rationale: The revision closes the quotation, distinguishes the two Greek expressions for lack of understanding, and supplies an explicit Korean complement clause for natural syntax. It retains the source’s generic singular wording and marks the ritual-purity sense of κοινῶσαι in a footnote. Although the Greek clause is syntactically continued in the following verse, Korean punctuation closes the complete quoted question in this verse for a well-formed standalone verse rendering.
