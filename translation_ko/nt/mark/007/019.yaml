  source_fidelity: 초안의 ‘그분이 ... 깨끗하다고 하셨습니다’는 καθαρίζων을 ‘정결하다고 선언하다’로 해석하여 원문의 직접적인 ‘깨끗하게 하다/정결하게 하다’보다 한 단계 더 해석적으로 옮깁니다. 또한 마지막 분사는 문법적·해석상 논쟁이 있으므로 대안 가능성을 각주로 밝혀야 합니다. ‘위’와 ‘변소’는 κοιλία와 ἀφεδρών의 생리적·구체적 대조를 자연스럽게 보존합니다.
  naturalness: ‘그의 마음에’보다 대표적 인물을 가리키는 ‘그 사람의 마음에’가 한국어에서 더 명확하며, ‘위로 들어가 변소로 나가기’는 현대 표준어 합쇼체로 자연스럽습니다. 인용문의 종결 부호와 뒤따르는 마가의 설명을 구분했습니다.
  terminology: καρδία는 ‘마음’, κοιλία는 ‘위’, ἀφεδρών은 ‘변소’, βρώματα는 복수 의미를 살린 ‘모든 음식’으로 옮겼습니다. καθαρίζων은 본문에서 ‘깨끗하게 하셨습니다’로 직접 옮기고, 생리 과정으로 보는 대안은 각주에 남겼습니다.
