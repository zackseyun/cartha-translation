revisions:
- from: 그러나 누구도 먼저 강한 자를 결박하지 않고는 그 강한 자의 집에 들어가 그의 재물을 빼앗을 수 없다. 묶은 뒤에야 그의 집을 약탈할 것이다.
  to: 그러나 누구도 강한 자의 집에 들어가, 먼저 그 강한 자를 결박하지 않고서는 그의 재물을 빼앗을 수 없습니다. 그런 다음에야 그의 집을 약탈할 것입니다.
