review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the adversative, the repeated image of the strong man, the prerequisite of binding him, and the distinction between his goods and his house. However, placing '먼저 강한 자를 결박하지 않고는' before '집에 들어가' can imply that binding must precede entering the house, whereas the Greek explicitly makes binding the prerequisite for plundering after entering. The revised word order preserves the Greek construction and sequence more closely.
  naturalness: The wording is generally natural, but the second sentence has an unexpressed subject that can be momentarily unclear in Korean. The revision makes the progression explicit with '그런 다음에야' while maintaining concise, modern formal-polite Korean.
  terminology: ‘강한 자’ appropriately renders the substantival ἰσχυρός and preserves the metaphor without identifying the figure in the main text. ‘결박하다’ is a fitting formal rendering of δήσῃ. ‘재물’ suitably conveys σκεύη in this plundering context, while ‘집’ preserves the repeated οἰκία imagery.
  issues:
  - severity: medium
    issue: Conditional phrase placement can alter the scope of the prerequisite.
    rationale: 'The draft''s fronted phrase, ''먼저 강한 자를 결박하지 않고는 그 강한 자의 집에 들어가…,'' naturally reads as though one cannot enter the house before binding the strong man. In Greek, the condition directly qualifies plundering the goods: no one can enter and plunder unless first binding the strong man.'
  - severity: low
    issue: The agent in the second sentence is implicit and may be unclear.
    rationale: ‘묶은 뒤에야 그의 집을 약탈할 것이다’ leaves the subject unexpressed after two different masculine referents have been introduced. ‘그런 다음에야’ better marks the result of the stated condition without introducing an interpretive identification.
  revised_text: 그러나 누구도 강한 자의 집에 들어가, 먼저 그 강한 자를 결박하지 않고서는 그의 재물을 빼앗을 수 없습니다. 그런 다음에야 그의 집을 약탈할 것입니다.
  revised_footnotes: []
  revision_rationale: The revision moves the conditional phrase next to the plundering action, preserving the source's stated prerequisite without implying an unwarranted sequence for entering the house. It retains the metaphorical language, the repeated references to the strong man and his house, and modern formal-polite register.
