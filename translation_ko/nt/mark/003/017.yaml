  verdict: revise
  source_fidelity: 그리스어는 요한을 ‘야고보의 형제’로 특정합니다. 초안의 ‘그의 형제 요한’은 선행하는 세베대를 가리키는 것으로도 읽힐 수 있어 관계를 명시해야 합니다. 또한 ὀνόματα는 복수이므로, 한국어 본문에서는 자연스러운 단수 ‘이름’을 유지하되 각주로 그 형태를 밝혀 두는 것이 적절합니다.
  naturalness: ‘그들에게는’은 불필요한 대조·화제 표지를 만들어 다소 어색합니다. ‘그들에게 … 이름을 주셨습니다’가 현대 한국어 합쇼체로 자연스럽습니다. βροντή에는 ‘천둥’이 가장 직접적이고 현대적인 대응어입니다.
  terminology: 인명 ‘세베대’, ‘야고보’, ‘요한’ 및 음역된 별칭 ‘보아너게’를 유지합니다. 설명구 ‘천둥의 아들들’은 원문의 복수 Υἱοὶ 및 Βροντῆς의 의미를 반영합니다.
