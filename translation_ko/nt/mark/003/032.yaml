  source_fidelity: 초안은 핵심 의미를 대체로 옮겼으나, 「앉아 있다가」는 무리가 앉아 있던 배경 상황 뒤에 발화가 이어지는 듯한 뉘앙스를 줄 수 있습니다. 그리스어 미완료 과거 ἐκάθητο의 진행적 배경과 이어지는 역사적 현재 λέγουσιν을 더 분명히 반영하는 편이 좋습니다.
  naturalness: 「그분 주위에 무리가 앉아 있었는데, 그들이 그분께 말하였습니다」는 현대 표준 한국어 서술문으로 자연스럽고 합쇼체 문체에 맞습니다. 직접화법의 「보십시오」도 ἰδού의 주의 환기 기능을 자연스럽게 살립니다.
  terminology: μήτηρ와 ἀδελφοί는 각각 「어머니」와 「형제들」로 직역하여 친족 관계에 관한 해석을 덧붙이지 않았습니다. ζητοῦσιν은 이 문맥에서 물리적으로 찾는다는 뜻이므로 「찾고 있습니다」가 적절합니다. 원문의 2인칭 소유·목적어는 한국어에서도 「당신의/당신을」으로 보존합니다.
