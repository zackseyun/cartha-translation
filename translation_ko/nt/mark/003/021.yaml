    rationale: 이 표현은 가족을 포함할 수 있고 문맥상 그 가능성이 크지만, 원문은 직접 친족 명사를 쓰지 않습니다. 본문은 더 넓은 표현을 사용하고 가족이라는 해석은 주석으로 제시하는 것이 안전합니다.
  - severity: low
    issue: ἔλεγον의 미완료상이 약화됨
    rationale: ‘말했습니다’보다 ‘계속 말하고 있었습니다’가 진행·반복의 뉘앙스를 더 잘 보존합니다.
  revised_text: 그분과 가까운 사람들[a]이 이 소식을 듣고 그분을 붙잡으려고 나섰습니다. 이는 그들이 “그가 제정신이 아니다[b]”라고 계속 말하고 있었기 때문입니다.
