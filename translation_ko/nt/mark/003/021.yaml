  source_fidelity: 초안의 ‘가족들’은 οἱ παρ’ αὐτοῦ가 문맥상 가족을 가리킬 가능성이 있는 점을 반영하지만, 원문이 친족 관계를 명시하지 않는 모호성을 본문에서 좁혀 버립니다. 또한 ‘이 소식’은 원문에 없는 목적어를 보충합니다. κρατῆσαι는 ‘붙잡다’로, ἐξέστη는 ‘제정신이 아니다’로 자연스럽고 원문의 비난을 유지할 수 있습니다.
