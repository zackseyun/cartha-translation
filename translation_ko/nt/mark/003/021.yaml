review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘가족들’은 οἱ παρ’ αὐτοῦ가 문맥상 가족을 가리킬 가능성은 있으나, 원문의 관용적이고 다소 모호한 범위를 본문에서 좁힙니다. 또한 ἔλεγον의 미완료상(계속/반복하여 말함)이 충분히 드러나지 않습니다. ‘붙잡으려고’는 κρατῆσαι를 적절히 옮깁니다.
  naturalness: ‘그분과 가까운 사람들’, ‘이 소식을 듣고’, ‘붙잡으려고 나섰습니다’, ‘계속 말하고 있었기 때문입니다’는 현대 표준어 합쇼체로 자연스럽습니다. 인용문은 그들의 부정적 판단을 직접 보고하므로 ‘그가’가 적절합니다.
  terminology: 예수님을 직접 지칭하는 서술에서는 ‘그분’을 유지했습니다. ἐξέστη는 ‘제정신이 아니다’로 명료하게 번역하고, 보다 직역적인 대안은 주석으로 남겼습니다. οἱ παρ’ αὐτοῦ의 가족 가능성도 주석으로 처리하여 본문의 모호성을 보존했습니다.
  issues:
