- from: 그래서 그분은 제자들에게 무리 때문에 작은 배 하나를 자기를 위해 준비해 두라고 말씀하셨습니다. 그들이 그분을 밀쳐 누르지 못하게 하려는 것이었습니다.
  to: 그분은 무리 때문에 작은 배 한 척을 자신 곁에 대기시켜 두도록 제자들에게 말씀하셨습니다. 무리가 그분을 짓누르지[a] 못하게 하려는 것이었습니다.
