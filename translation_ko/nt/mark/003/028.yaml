  source_fidelity: 초안의 ‘사람의 아들들’은 그리스어의 셈어적 관용 표현을 한국어에서 지나치게 직역하여 ‘사람들의 아들들’이라는 부자연스럽고 의미가 좁아진 표현이 됩니다. 또한 문맥상 접속은 역접이 아니라 병렬이며, ὅσα ἐὰν βλασφημήσωσιν의 불특정적 범위를 ‘무슨 모독을 하든’으로 옮기는 것이 적절합니다.
  naturalness: 합쇼체에 맞게 ‘말합니다’와 ‘용서될 것입니다’를 사용했습니다. ‘그들이 모독하는 모든 모독’은 한국어에서 중복되고 어색하므로 자연스러운 조건·양보 구문으로 다듬었습니다.
  terminology: ἁμαρτήματα는 ‘죄’, βλασφημίαι는 다음 절의 성령 모독 경고와의 연결을 보존하도록 ‘모독’으로 옮겼습니다. τοῖς υἱοῖς τῶν ἀνθρώπων은 일반 인류를 뜻하므로 본문에서는 ‘사람들’로 번역하고, 직역 및 포괄적 의미는 각주로 밝혔습니다.
