  to: 그분이 그들에게 말씀하셨습니다. “안식일에 선을 행하는 것과 해를 끼치는 것, 생명을 구하는 것과 죽이는 것 중 어느 것이 허락됩니까?” 그러나 그들은 잠자코 있었습니다.
