  text: 예루살렘에서 내려온 율법학자들은 계속 이렇게 말하였습니다. 「그에게 바알세불이 들렸다[a][b].」 또 「그는 귀신들의 우두머리의 힘으로[c] 귀신들을 쫓아낸다.」
