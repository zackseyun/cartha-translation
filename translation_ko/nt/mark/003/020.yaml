  terminology: ‘빵’이 ἄρτος의 기본 뜻에 가장 적절합니다. ‘그분께서’ 및 ‘그분과 그 일행’은 예수를 공경하는 서술 문체를 유지하면서도 원문의 복수 목적어를 반영합니다. ‘집’은 원문의 부정성과 소유자 미특정을 보존하며, 관용적으로 ‘집으로/집에 돌아가’라고도 이해될 수 있음을 주석으로 남겼습니다.
