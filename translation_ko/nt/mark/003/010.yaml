  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: ko
  text: 그분께서 많은 사람을 고치셨기 때문에, 고통을 겪는[b] 사람들은 모두 그분을 만지려고 그분께[a] 몰려들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분에게 달려들었습니다.” 그리스어는 문자적으로 “그분 위로 떨어지다/덮치다”라는 뜻으로, 군중이 그분께 세차게 몰려드는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “병을 앓는” 또는 “재앙을 겪는.” 그리스어는 문자적으로 “채찍들”이며, 여기서는 심한 고통이나 질병과 같은 괴로움을 비유적으로 가리킵니다.
    reason: lexical_alternative
