  terminology: ‘드러내다’는 φανερὸν ποιέω의 ‘알려지게 하다/공개하다’라는 의미를 자연스럽게 살립니다. 본문은 그들이 예수님의 어떤 칭호를 밝히지 말아야 했는지를 명시하지 않으므로 추가하지 않았습니다.
