theological_decisions:
- issue: 성령 모독의 영원한 용서 불가(3:28-30) — 본문의 강한 의미를 약화시키지 않을 것
  chosen_reading: 영원히 용서받지 못하고, 영원한 죄에 매이게 된다
  alternative_readings:
  - 결코 용서받지 못한다
  - 용서받을 수 없는 죄를 지은 것이다
  rationale: 헬라어 οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ἁμαρτήματος를 그대로 옮긴다. 부사적 「영원히」와 명사적 「영원한 죄」를 모두 유지하여 본문의 무게를 보존한다. 30절은 마가가 이 경고의 구체적 정황(예수의 권능을 더러운 영의 일로 돌리는 것)을 명시한 것이므로 분리하지 않는다.
  doctrine_reference: 'DOCTRINE.md: preserve full force of original; do not soften'
revisions:
- from: 성령을 모독하는 자는 영원히 용서받지 못하고, 영원한 죄에 매이게 된다.」
  to: 그러나 누구든지 성령을 모독하는 사람은 영원히 용서받지 못하며[a], 영원한 죄에 대해 책임이 있습니다.[b][c]」
  rationale: 본문의 대조(‘그러나 누구든지’), 성령을 향한 모독, 용서의 영구적 부정, 그리고 SBLGNT의 ‘영원한 죄’를 모두 보존했습니다. ἔνοχος의 법적·책임 의미를 현재형 합쇼체로 옮기되, 죄의 성격이나 용서 불가의 이유를 해석적으로 덧붙이지 않았습니다. 종결 인용부호는 제시된 초안의 절 단위 인용 형식을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:44:59Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 ‘성령을 모독하는’ 및 용서의 영구적 부정을 대체로 반영하지만, δέ의 대조적 접속(‘그러나 누구든지’)을 빠뜨렸고, 현재형 ἔνοχός ἐστιν(‘책임/죄책이 있다’)을 미래의 결과인 ‘매이게 된다’로 바꾸었습니다. 또한 ‘매이다’는 ἔνοχος의 일반적 의미인 ‘책임이 있다, 유죄이다, 처벌을 받게 되다’와 정확히 일치하지 않습니다.
  naturalness: ‘그러나 누구든지 성령을 모독하는 사람은 영원히 용서받지 못하며, 영원한 죄에 대해 책임이 있습니다’는 현대 표준어 합쇼체로 자연스럽고, 경고문의 엄중한 어조도 유지합니다.
  terminology: ‘성령’, ‘모독’, ‘용서’, ‘영원한 죄’는 적절합니다. ἔνοχος는 교파적 해석을 더하지 않고 ‘영원한 죄에 대해 책임이 있습니다’로 옮겼으며, ‘죄책이 있다’라는 가능한 대안은 각주에 남깁니다.
  issues:
  - severity: medium
    issue: 대조 접속과 부정 관계절의 주어가 누락됨
    rationale: ὃς δ’ ἂν은 앞 절과 연결되는 ‘그러나 누구든지’입니다. 초안의 ‘성령을 모독하는 자는’은 일반화는 전달하지만 δέ의 대조를 드러내지 않습니다.
  - severity: high
    issue: ἔνοχός ἐστιν을 ‘매이게 된다’로 번역함
    rationale: 그리스어는 현재 상태를 나타내며 ‘책임이 있다/유죄이다/처벌을 받게 되어 있다’의 의미입니다. ‘매이게 된다’는 미래화할 뿐 아니라 원문의 법적·책임 의미를 속박의 비유로 바꿉니다.
  - severity: low
    issue: 영어 감사 기록의 본문 비평 및 어휘 대안을 반영하는 각주가 없음
    rationale: SBLGNT 본문은 ‘영원한 죄’(ἁμαρτήματος)이며, 일부 사본의 ‘영원한 심판/정죄’ 읽기는 본문이 아닌 각주로 구별하는 것이 적절합니다.
