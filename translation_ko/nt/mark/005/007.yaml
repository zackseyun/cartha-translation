  source_fidelity: 그리스어의 aorist 분사 κράξας와 '큰 소리로'(φωνῇ μεγάλῃ), 관계 단절을 나타내는 관용구 Τί ἐμοὶ καὶ σοί, '지극히 높으신 하나님의 아들'이라는 호칭, 그리고 βασανίσῃς의 강한 고통 의미를 충실히 옮겼습니다. λέγει의 역사적 현재는 한국어 서사에서 자연스러운 과거형으로 처리되었으며 의미 손실이 없습니다. '하나님을 두고 당신께 간구합니다'는 ὁρκίζω의 엄숙한 호소/간청의 기능을 무리 없이 전달합니다.
