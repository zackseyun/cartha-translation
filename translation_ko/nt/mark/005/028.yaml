    issue: ‘속으로’가 추가되어 있음
    rationale: ἔλεγεν은 계속되거나 반복된 발화를 나타내지만, 그것이 내적 생각인지 소리 내어 한 말인지는 확정하지 않습니다.
  - severity: high
    issue: σωθήσομαι를 ‘구원을 받으리라’로 번역함
    rationale: 여인의 출혈 치유라는 직접 문맥에서는 ‘낫다/치유되다’가 우선 의미입니다. ‘구원’으로만 번역하면 신체적 치유의 진술을 부정확하게 만들 수 있습니다.
  revised_text: 그녀가 “그분의 옷에라도 손을 대면, 나는 나을 것이다”라고 말하고 있었기 때문입니다.
