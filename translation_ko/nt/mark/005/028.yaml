  source_fidelity: 초안의 ‘속으로’는 본문의 ἔλεγεν(‘말하고 있었다/계속 말하였다’)에 명시되어 있지 않은 해석을 더합니다. 또한 σωθήσομαι는 이 문맥에서 신체적 치유를 가리키므로 ‘구원을 받으리라’보다 ‘나을 것이다’로 옮기는 것이 적절합니다. 미완료 과거의 진행·반복적 뉘앙스는 ‘말하고 있었습니다’로 보존했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 서술 문체에 자연스럽습니다. ‘옷에라도 손을 대면’은 κἂν의 최소화·강조(‘비록 옷에라도/옷만이라도’)와 ἅψωμαι의 ‘만지다’를 자연스럽게 전달합니다.
  terminology: σωθήσομαι의 문맥상 의미는 ‘낫다’로 번역하되, σῴζω의 가능한 ‘구원받다’ 의미는 각주에 보존했습니다. ‘그분의 옷’은 원문의 복수형 ἱματίων을 한국어에서 집합적으로 자연스럽게 표현합니다.
  issues:
  - severity: medium
    issue: ‘속으로’가 추가되어 있습니다.
    rationale: 원문은 그녀가 말하고 있었다고 할 뿐, 그 말이 내적 독백이었는지 소리 내어 한 말인지는 명시하지 않습니다.
  - severity: medium
    issue: σωθήσομαι를 ‘구원을 받으리라’로 본문에 번역했습니다.
    rationale: σῴζω에는 ‘구원하다’의 의미도 있으나, 이 절의 직접적 문맥은 병의 치유입니다. 본문은 치유 의미로 옮기고 어휘적 대안은 각주로 남기는 것이 원문과 문맥을 함께 보존합니다.
  revised_text: 이는 그녀가 “그분의 옷에라도 손을 대면 내가 나을 것이다”라고 말하고 있었기 때문입니다.[a]
  revised_footnotes:
