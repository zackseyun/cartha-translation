  source_fidelity: 초안의 ‘속으로’는 본문 ἔλεγεν이 내적 독백이었음을 명시하지 않으므로 근거 없이 의미를 한정합니다. 또한 이 문맥의 σωθήσομαι는 신체적 치유를 가리키므로 ‘구원을 받으리라’보다 ‘나을 것이다’가 문맥에 충실합니다. 미완료형은 ‘말하고 있었다’로 반영했습니다.
  naturalness: ‘그분의 옷에라도 손을 대면’과 ‘나을 것이다’는 현대 표준 한국어의 자연스러운 서술 문체이며, 본문 전체는 합쇼체 종결을 유지합니다.
  terminology: ἱμάτια는 복수의 일반적 의복을 뜻하므로 ‘옷’으로 옮겼습니다. σωθήσομαι의 더 넓은 ‘구원받다’ 의미 가능성은 본문에 부과하지 않고 각주에 보존했습니다.
  issues:
