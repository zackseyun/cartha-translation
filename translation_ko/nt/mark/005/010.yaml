  source_fidelity: 그리스어의 단수 주어(παρεκάλει)와 복수 목적어(αὐτά)의 긴장을 ‘그가 … 자기들을’로 보존합니다. πολλὰ는 ‘거듭’, ἵνα μὴ는 ‘… 말아 달라고’, ἀποστείλῃ ἔξω τῆς χώρας는 ‘그 지방에서 내보내지’로 충실하게 옮겼습니다.
  naturalness: ‘그가 자기들을 그 지방에서 내보내지 말아 달라고 그분께 거듭 간청하였습니다’는 현대 표준어 합쇼체로 자연스럽고, 귀신들의 대변자인 단수 화자와 복수 귀신 집단의 관계도 문맥상 이해 가능합니다.
  terminology: ‘간청하였습니다’는 παρακαλέω의 절박한 간구를 적절히 나타내며, ‘그 지방’은 χώρα를 현대 국가로 한정하지 않고 지역·영역의 뜻으로 잘 반영합니다. ‘그분께’는 예수님을 가리키는 존대 표현으로 문맥에 적절합니다.
