  verdict: revise
  source_fidelity: The draft accurately conveys the temporal relation, the ongoing/repeated force of the imperfect παρεκάλει ('거듭 간청하였습니다'), and the request to be with Jesus. Revising the temporal clause to '오르고 계실 때' more clearly reflects the participle’s action-in-progress nuance.
