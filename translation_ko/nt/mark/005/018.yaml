    issue: The participial temporal nuance is slightly flattened by '배에 오르실 때.'
    rationale: ἐμβαίνοντος is a present participle in a genitive absolute, indicating that Jesus was in the process of entering the boat. '배에 오르고 계실 때' expresses this naturally in Korean.
  - severity: low
    issue: '''귀신들렸던 자'' is somewhat stiff and compressed in modern Korean.'
    rationale: Spacing '귀신 들렸던' and using '사람' produces idiomatic standard Korean without changing the referent or meaning.
  revised_text: 그분께서 배에 오르고 계실 때, 귀신 들렸던 사람이 그분과 함께 있게 해 달라고 거듭 간청하였습니다.
