  source_fidelity: 원문의 παρακούσας는 문맥상 방금 전해진 말을 ‘듣다/우연히 듣다’로 옮기는 것이 자연스럽지만, ‘무시하다’라는 가능한 의미도 있으므로 각주로 보존하는 것이 좋습니다. τὸν λόγον λαλούμενον은 특정 보고를 가리키므로 ‘그 말이 전해지는 것을’으로 자연스럽게 옮겼습니다. 명령문은 현재 명령형의 지속적 뉘앙스를 과도하게 해석하지 않고 옮겼습니다.
  naturalness: ‘곁귀로 듣고’는 현대 표준어 성경 문체에서 다소 어색하고, 인용문의 ‘믿어라’는 요구된 합쇼체와 맞지 않습니다. ‘들으시고’, ‘두려워하지 마십시오’, ‘믿으십시오’가 자연스럽고 일관된 높임말입니다.
  terminology: ἀρχισυνάγωγος는 ‘회당장’이 한국어 성경 전통과 현대 독자 모두에게 통용되는 적절한 명칭입니다. πιστεύω는 본문에서 ‘믿으십시오’로 직역하되 ‘신뢰하다/믿음을 가지다’의 대안을 각주로 제시합니다.
