  - severity: medium
    issue: παρακούσας의 대안 의미가 보존되지 않았습니다.
    rationale: ‘듣다’가 문맥상 주된 의미이나 ‘무시하다/개의치 않다’라는 알려진 해석 가능성이 있으므로 원문의 실제 모호성을 각주로 밝혀야 합니다.
  - severity: low
    issue: ‘곁귀로 듣고’와 ‘그들이 하는 말’은 원문의 단수 ‘말/보고’와 문체에 비해 다소 부자연스럽습니다.
