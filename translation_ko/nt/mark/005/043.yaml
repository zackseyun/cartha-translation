  terminology: ‘그분,’ ‘명령하시고,’ and ‘말씀하셨습니다’ maintain respectful modern formal-polite register. ‘그녀에게 먹을 것을 주라고’ naturally conveys the passive infinitive δοθῆναι and the idiomatic sense of φαγεῖν.
