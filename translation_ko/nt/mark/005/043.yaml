  source_fidelity: 'The draft conveys both clauses faithfully: Jesus gives a strongly worded instruction that the event not become known, then orders that the girl be given food. The Greek πολλὰ functions as an intensifier with διεστείλατο and is adequately represented by ‘엄히.’'
