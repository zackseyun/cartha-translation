  source_fidelity: 초안의 ‘얼마나 큰 일을’은 ὅσα(‘모든 일’, ‘얼마나 많은 일’)에 없는 ‘큰’이라는 평가를 덧붙입니다. 또한 ‘전파하기 시작하니’는 뒤 절을 인과적으로 연결할 수 있어, 단순 접속인 καί의 흐름을 충분히 반영하지 못합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 주절들을 ‘-했고’로 연결하여 사건의 순서를 명료하게 나타냅니다.
  terminology: ‘데가볼리’는 통용되는 지명 표기이며, κηρύσσειν은 이 문맥에서 ‘선포하다’로 옮겨 공적 알림의 뜻을 살렸습니다. ‘해 주신 모든 일’은 여격 αὐτῷ의 수혜 의미를 자연스럽게 반영합니다.
  issues:
