    issue: ‘얼마나 큰 일을’이 원문에 없는 평가를 추가함
    rationale: ὅσα는 예수께서 그에게 행하신 일의 범위 또는 양을 가리키며, ‘큰’이라는 명시적 평가를 포함하지 않습니다.
  - severity: medium
    issue: ‘전파하기 시작하니’의 연결이 부정확함
    rationale: καὶ … καὶ는 그가 선포하기 시작한 일과 모든 사람이 놀란 일을 병렬적으로 잇습니다. ‘-니’는 원문에 없는 인과 또는 강한 시간 관계를 암시할 수 있습니다.
  revised_text: 그는 떠나가 예수께서 자기에게 해 주신 모든 일을 데가볼리에서 선포하기 시작했고, 모든 사람이 놀랐습니다.
