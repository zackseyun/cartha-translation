  source_fidelity: 원문의 ὡς δισχίλιοι는 ‘약 이천 마리’라는 수량을 돼지 떼에 덧붙이는 표현입니다. 현 번역의 ‘약 이천 마리의 떼’는 의미는 전달하지만 한국어 문장 구조상 수량과 집합명사의 관계가 부자연스럽습니다. κρημνός의 가파른 지형이라는 뜻도 ‘비탈’보다 ‘가파른 비탈’로 명시하는 편이 충실합니다. 마지막 ‘바다에서 빠져 죽었습니다’는 ἐπνίγοντο의 익사 결과를 자연스럽게 옮깁니다.
  naturalness: ‘그 돼지 떼, 곧 약 이천 마리가’는 삽입 동격을 자연스럽게 드러내며, 현대 표준어 합쇼체 서사에 맞습니다. ‘가파른 비탈을 내리달아 바다로 들어가’는 원문의 갑작스러운 돌진과 방향을 과장 없이 전달합니다.
  terminology: ‘더러운 영들’은 τὰ πνεύματα τὰ ἀκάθαρτα에 대한 한국어 성경의 통용 표현이며, ‘돼지’, ‘바다’도 원문의 어휘를 적절히 보존합니다. ‘바다’는 갈릴리 호수를 가리키지만, 본문은 θάλασσα를 그대로 번역해야 합니다.
  issues:
