review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central sense accurately, including Jesus' immediate awareness that power had gone out from him and his question to the crowd. However, ‘자기 안에서 아시고’ is an overly literal and unnatural rendering of ἐν ἑαυτῷ, and ‘돌이키며’ weakens the completed participial action ἐπιστραφείς (‘having turned’).
  naturalness: ‘자기 안에서 아시고’ is not idiomatic in modern standard Korean. ‘곧바로 … 아시고’ and ‘돌아서서’ provide natural formal-polite narrative Korean while preserving the sequence of actions.
  terminology: ‘능력’ appropriately renders δύναμις without adding an explanatory qualifier. ‘옷에 손을 댄’ naturally renders touching Jesus’ plural garments; Korean uses ‘옷’ collectively here without loss of meaning.
  issues:
  - severity: medium
    issue: ‘자기 안에서 아시고’ is unnatural Korean.
    rationale: ἐν ἑαυτῷ indicates inward awareness, not a spatial location ‘inside himself.’ In Korean, ‘자신에게서 능력이 나간 것을 아시고’ already expresses Jesus’ personal awareness naturally.
  - severity: low
    issue: ‘돌이키며’ does not clearly reflect the completed turning expressed by ἐπιστραφείς.
    rationale: ‘돌아서서’ more naturally represents the aorist participle’s completed action before the speech.
  revised_text: 예수께서는 곧바로 자신에게서 능력이 나간 것을 아시고, 무리 가운데서 돌아서서 말씀하셨습니다. “내 옷에 손을 댄 사람이 누구냐?”
