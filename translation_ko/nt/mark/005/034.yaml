review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the vocative “Daughter,” the perfect sense of σέσωκέν as “has saved,” and the two imperatives. However, “네 병에서 나아 있어라” is not a natural Korean expression for ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου and does not clearly convey the continuing state of health/freeedom from the affliction.
  naturalness: The narration is suitably formal-polite. Within the quotation, “평안히 가라” is a natural direct imperative, but “나아 있어라” is awkward. “네 병에서 벗어나 건강하여라” is clear, idiomatic, and retains the stative result expressed by ὑγιής.
  terminology: “믿음” appropriately renders πίστις, and “구원하였다” preserves the broader, potentially salvation-related force of σῴζω rather than reducing it to physical healing. “병” is contextually appropriate for μάστιξ, while “벗어나 건강하여라” reflects the metaphorical sense of being free from the affliction.
  issues:
  - severity: medium
    issue: “네 병에서 나아 있어라” is awkward and semantically imprecise Korean.
    rationale: The Greek commands the woman to be healthy/well, free from her affliction. Korean normally expresses this as being healed from, or freed from, the illness and healthy; “나아 있어라” is not idiomatic in this context.
