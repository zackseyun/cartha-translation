  source_fidelity: 원문의 역사적 현재 λέγει와 아람어 표현 뒤에 이어지는 마가의 번역 설명을 더 직접적으로 반영할 필요가 있습니다. παιδίον은 앞부분에서 성별을 특정하지 않는 ‘아이’로 유지하고, 뒤의 κοράσιον은 ‘소녀’로 옮기는 것이 적절합니다.
  naturalness: ‘그녀에게’는 한국어에서 어린아이를 가리킬 때 다소 부자연스러우므로 ‘아이에게’가 자연스럽습니다. 인용문 안의 쉼표 연결과 ‘하는 뜻입니다’도 현대 한국어 문장으로는 다듬는 편이 좋습니다.
  terminology: Ταλιθα κουμ은 음역으로 보존하되, 비평 그리스어 본문의 κουμ에 맞추어 ‘달리다 쿰’으로 표기했습니다. 전통적 ‘달리다굼’ 표기는 각주에서 설명할 수 있습니다.
