    issue: Λεγιών is translated as “군대.”
    rationale: The Greek presents Λεγιών as the speaker’s stated name/designation, a Greek form of Latin legio, rather than the ordinary Greek word for “army.” “군대” both weakens the name-like force and is less precise than a transliteration with a note.
  - severity: low
    issue: The draft does not reflect the imperfect and historical-present narrative forms.
    rationale: “계속 물으셨습니다” reasonably represents ἐπηρώτα, and “말합니다” retains the vivid historical present λέγει. These are safe stylistic correspondences in Korean.
