  naturalness: ‘족쇄’는 현대 표준어에서 πέδαι(발에 채우는 쇠고랑/족쇄)를 자연스럽고 정확하게 나타내며, ‘사슬을 끊어 버리고 족쇄를 산산이 부수었으며’는 한국어로 자연스럽습니다. 문맥상 앞 절의 이유를 받는 ‘때문입니다’도 합쇼체에 맞습니다.
  terminology: πέδαι와 ἁλύσεις의 구별을 각각 ‘족쇄’와 ‘사슬’로 유지했습니다. δαμάσαι는 교리적 해석을 더하지 않고 ‘제압하다’로 옮겼으며, 가능한 어휘 대안인 ‘길들이다’는 각주로 제시합니다.
