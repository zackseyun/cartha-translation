    rationale: ζήσῃ는 여기서 ‘살다’이며, 앞선 ἵνα 절들과 함께 야이로의 간청 목적을 나타냅니다. ‘살아나다’는 되살아남의 뉘앙스를 더하며, ‘것입니다’는 요청을 서술적 예측으로 바꿉니다.
