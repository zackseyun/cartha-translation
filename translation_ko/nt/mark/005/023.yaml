  source_fidelity: 초안은 절박한 요청, 딸의 위중함, 안수, 그리고 삶이라는 큰 흐름을 담고 있습니다. 그러나 σωθῇ를 문맥상 부자연스럽고 신학적으로 지나치게 특정적인 ‘구원을 받아’로 옮겨 신체적 치유라는 직접 문맥을 흐립니다. 또한 πολλὰ의 반복·강조를 ‘거듭’으로 더 직접 반영하는 편이 좋습니다.
  naturalness: ‘그 위에 손을 얹어’보다 사람을 대상으로 하는 ‘그 아이에게 손을 얹어’가 현대 표준 한국어에서 자연스럽습니다. ‘낫고 살게’는 이 치유 요청의 문맥과 합쇼체 직접화법에 자연스럽게 맞습니다.
  terminology: σωθῇ의 더 넓은 ‘구원/구출’ 어감은 본문에서 부자연스럽게 전면화하지 않고 각주로 보존합니다. θυγάτριον은 ‘어린 딸’로, ἐσχάτως ἔχει는 ‘죽어 가고’로 충실히 반영합니다.
  issues:
  - severity: medium
    issue: ‘구원을 받아’
    rationale: σωθῇ는 ‘구원하다’의 어휘 범위를 지니지만, 딸의 임박한 죽음과 안수 요청이라는 즉각적 문맥에서는 낫게 됨/회복됨을 가리킵니다. 한국어 본문의 ‘구원을 받아 살아날’은 영적 구원을 우선적으로 뜻하는 것으로 읽히며 치유 문맥에 부자연스럽습니다.
  - severity: low
    issue: πολλὰ의 강조가 충분히 드러나지 않음
    rationale: ‘간절히’도 강도를 나타내지만, πολλὰ는 간청의 반복 또는 거듭됨도 시사합니다. ‘거듭 간청하며’가 이를 자연스럽게 반영합니다.
  - severity: low
    issue: ‘그 위에 손을 얹어’의 대상 표현
    rationale: 사람에게 하는 안수는 ‘그 아이에게 손을 얹어’가 더 자연스럽고 명료합니다.
  revised_text: 그는 예수께 거듭 간청하며 말했습니다. “내 어린 딸이 죽어 가고 있습니다. 오셔서 그 아이에게 손을 얹어 주십시오. 그러면 그 아이가 낫고 살게 될 것입니다.”
  revised_footnotes:
  - marker: a
    text: ‘낫고’는 직역하면 ‘구원을 받고’ 또는 ‘구출되어’입니다. 그리스어 동사는 구원·구출·치유를 뜻할 수 있으며, 여기서는 직접 문맥상 치유의 뜻입니다.
    reason: alternative_reading
  revision_rationale: 치유 요청의 직접 문맥에 맞게 σωθῇ를 ‘낫고’로 옮기되, 그리스어 동사의 더 넓은 의미 범위는 각주에 보존했습니다. ‘거듭’으로 πολλὰ의 강조를 반영하고, 안수의 대상을 자연스러운 한국어로 명확히 했습니다.
