  naturalness: 합쇼체로 자연스럽게 다듬었습니다. ‘그 위에’는 사람을 가리킬 때 부자연스러우므로 ‘그 아이에게’로 고쳤고, ‘간청하며 말하였습니다’는 ‘거듭 간청하며 말했습니다’로 정리했습니다.
  terminology: σωθῇ는 이 문맥에서 육체적 치유를 가리키지만 ‘구원을 받다’라는 표현은 원문의 구원·치유 의미 범위를 보존합니다. 각주에서 문맥상 ‘낫다/온전해지다’라는 뜻을 밝혀, 불필요하게 특정 교리적 의미로 좁히지 않도록 했습니다.
