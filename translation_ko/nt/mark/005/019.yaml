  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: ko
  text: 그분께서는 그가 함께 가는 것을 허락하지 않으시고, 그에게 말씀하셨습니다. 「당신의 집으로 돌아가 당신의 사람들에게[a], 주[b]께서 당신에게 얼마나 많은 일을 하시고 당신에게 자비를 베푸셨는지를 알리십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어로는 직역하여 ‘당신의 사람들에게’입니다. 가족과 가까운 이들을 포함하여, 그에게 속한 사람들을 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘주’는 하나님을 특별히 가리킨다고 이해되기도 하며, 하나님의 자비와 예수님의 권위와 행동의 연결을 마가가 의도적으로 열어 둔다고 이해되기도 합니다.
    reason: alternative_reading
