    rationale: 원문은 ‘예수께서 배 안에서 다시 맞은편으로 건너가신 후’라는 선행 상황을 제시합니다. 초안의 ‘건너편으로 건너오시니’는 ‘건너편’과 ‘건너오다’가 어색하게 겹치며, -시니가 동시·계기 관계로도 읽힐 수 있습니다.
