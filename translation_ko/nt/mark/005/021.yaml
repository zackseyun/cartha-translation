  source_fidelity: 대체로 충실합니다. 다만 ‘배로 다시 건너편으로 건너오시니’는 원문의 과거 선행 상황(속격 절대구문)을 충분히 드러내지 못하고, ‘건너편으로 건너오다’가 한국어에서 중복되고 기준점도 다소 불명확합니다. ‘다시 맞은편으로 건너가신 뒤’는 διαπεράσαντος, πάλιν, εἰς τὸ πέραν의 시간적·공간적 의미를 자연스럽게 보존합니다. ‘큰 무리’, ‘그분에게 모여들었고’, ‘바닷가에 계셨습니다’는 각각 ὄχλος πολὺς, ἐπ’ αὐτόν, παρὰ τὴν θάλασσαν에 잘 부합합니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체로 자연스럽습니다. ‘배를 타고’는 ἐν τῷ πλοίῳ를 명시하며, ‘…가신 뒤’는 문장 흐름을 매끄럽게 합니다.
  terminology: ‘예수께서’, ‘큰 무리’, ‘바다/바닷가’는 일관되고 적절합니다. 본문은 원문의 θάλασσα를 따라 ‘바다’를 유지하고, 지리적 식별은 각주에서만 보충합니다.
