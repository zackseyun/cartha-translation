- from: 그러자 곧 소녀가 일어나 걸어 다녔습니다. 그녀는 열두 살이었습니다. 사람들은 곧 큰 놀라움에 사로잡혔습니다.
  to: 그리고 곧 그 소녀가 일어나 걸어 다녔습니다. 그 소녀는 열두 살이었습니다. 사람들은 곧 큰 놀라움에 사로잡혔습니다.
  rationale: The revision replaces the interpretively stronger opening connective with a simple coordinate connective and retains the repeated immediacy. The age statement remains a natural Korean sentence; in this context its juxtaposition supplies the explanatory detail expressed by γάρ without unnatural repetition of a causal conjunction. The wording retains the imperfect sense of περιεπάτει as observable walking activity and the intensive astonishment expression without overtranslating it.
