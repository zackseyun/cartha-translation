  verdict: revise
  source_fidelity: 초안은 식사 장면과 세리·죄인들의 동석을 대체로 전달하지만, κατακεῖσθαι/συνανέκειντο의 식탁에 기대어 앉는 자세가 일반적인 식사 행위로 약화되었습니다. 또한 마지막 절의 복수 주어를 ‘그들을 따르는 자’로 처리하여, 그들이 예수를 따랐다는 αὐτῷ의 단수 목적어와 문장 관계가 불명확해졌습니다. ‘그의 집’의 선행사가 본문상 불명확한 점도 각주로 보존해야 합니다.
  naturalness: ‘그분이 그의 집에서 음식을 잡수실 때’는 동일 인물을 가리키는 존칭 대명사가 연달아 나와 다소 부자연스럽습니다. ‘식탁에 기대어 앉아 계셨을 때’는 고대 식사 자세를 현대 한국어로 무리 없이 드러냅니다. 마지막 문장은 주어와 목적어를 명시하여 자연스럽고 분명하게 다듬었습니다.
  terminology: ‘세리’, ‘죄인’, ‘제자’는 한국어 성경 문맥에서 통용되는 적절한 용어입니다. 예수에 대한 존칭은 현대 합쇼체에 맞게 ‘예수님께서/예수님을’으로 일관되게 사용했습니다. ‘식탁에 기대어 앉다’는 단순히 식사한다는 뜻보다 원문의 식사 자세와 교제를 더 충실히 반영합니다.
  issues:
  - severity: medium
    issue: 식사 자세와 함께 식사하는 장면의 의미가 약화됨
    rationale: κατακεῖσθαι와 συνανέκειντο는 고대 연회·식사의 기대어 앉는 자세를 가리킵니다. ‘음식을 잡수시다/음식을 나누다’만으로는 이 표현이 지닌 구체성이 사라집니다.
  - severity: high
    issue: 마지막 절의 주어 및 ‘그를’의 지시 대상이 불명확함
    rationale: ‘그들을 따르는 자가 많았기 때문입니다’는 원문의 ‘많은 이들이 있었고, 그들이 그를 따르고 있었다’를 바꾸며, 복수 대상을 따르는 것처럼 읽힐 수 있습니다. 원문은 단수 αὐτῷ, 곧 예수를 따른다는 뜻입니다.
  - severity: medium
    issue: ‘그의 집’의 모호성이 각주 없이 사실상 해소될 위험
    rationale: αὐτοῦ의 선행사는 본문만으로 확정되지 않습니다. 본문에는 직역적 표현을 남기고 레위의 집 또는 예수님의 집이라는 가능한 이해를 각주로 밝혀야 합니다.
