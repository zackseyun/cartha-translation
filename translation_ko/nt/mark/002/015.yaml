base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: ko
  text: 예수님께서 그의 집[a]에서 식탁에 기대어 앉아 계셨을 때, 많은 세리와 죄인들이 예수님과 그분의 제자들과 함께 식탁에 기대어 앉아 있었습니다. 그들이 많았고 예수님을 따르고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위의 집에서’. 일부는 ‘예수님의 집에서’로 이해합니다. 그리스어 본문은 단지 ‘그의 집에서’라고만 말합니다.
    reason: 원문의 소유 대명사 αὐτοῦ의 선행사에 관한 해석상 모호성을 본문에서 확정하지 않고 보존합니다.
