revisions:
- from: 그분이 그의 집에서 음식을 잡수실 때, 많은 세리들과 죄인들이 예수와 그분의 제자들과 함께 음식을 나누고 있었습니다. 그들을 따르는 자가 많았기 때문입니다.
  to: 예수님께서 그의 집[a]에서 식탁에 기대어 앉아 계셨을 때, 많은 세리와 죄인들이 예수님과 그분의 제자들과 함께 식탁에 기대어 앉아 있었습니다. 그들이 많았고 예수님을 따르고 있었기 때문입니다.
