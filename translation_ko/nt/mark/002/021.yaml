source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: ko
  text: 아무도 수축하지 않은 새 천 조각[a]을 낡은 옷에 대고 꿰매지 않습니다. 그렇게 하면 새 조각이 낡은 옷에서 떨어져 나가고[b], 찢어진 곳이 더 심해집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아직 다듬질하지 않은 천 조각’. 그리스어는 수축 가공을 하지 않아, 덧대어 꿰매면 수축할 수 있는 천을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘새 것이 낡은 것에서 그것의 채우는 것을 빼앗아 가고’입니다. 문맥상 새 조각이 낡은 옷에서 떨어져 나가 찢어진 곳을 더 심하게 만든다는 뜻입니다.
    reason: lexical_alternative
