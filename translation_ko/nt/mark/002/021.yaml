  to: 아무도 수축하지 않은 새 천 조각[a]을 낡은 옷에 대고 꿰매지 않습니다. 그렇게 하면 새 조각이 낡은 옷에서 떨어져 나가고[b], 찢어진 곳이 더 심해집니다.
