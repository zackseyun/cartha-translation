  source_fidelity: 초안의 기본 비유와 결과는 대체로 맞지만, ῥάκους ἀγνάφου의 핵심인 아직 수축되지 않은 천이라는 뜻이 ‘새 천’만으로는 충분히 드러나지 않습니다. 또한 ‘더 큰 구멍’보다 σχίσμα에 맞는 ‘찢어진 곳’이 더 정확합니다.
  naturalness: ‘대고 깁지 않는다’는 이해되지만, 현대 표준어 합쇼체 성경 문체에서는 ‘대고 꿰매지 않습니다’가 더 자연스럽고 명료합니다.
  terminology: ἱμάτιον은 과도하게 특정하지 않고 ‘낡은 옷’으로 옮길 수 있습니다. ἐπίβλημα/τὸ πλήρωμα와 τὸ καινόν의 연결은 ‘새 천 조각/새 조각’으로 유지하고, ἀγνάφου는 ‘수축하지 않은’으로 밝혔습니다.
