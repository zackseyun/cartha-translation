  source_fidelity: ‘아들아’는 τέκνον의 다정한 호칭을 남성에 한정해 옮깁니다. 이 문맥의 대상은 남성으로 이해될 수 있으나, 호칭 자체의 어휘적 범위는 ‘아이/자녀’이므로 그 한정을 본문에 넣지 않는 편이 원문에 더 가깝습니다. ‘보시고’, ‘그들의 믿음’, 그리고 죄 사함의 선언은 원문의 의미를 대체로 충실히 반영합니다.
  naturalness: ‘중풍병자’는 오늘날에도 이해되지만, 현대 표준어에서는 ‘마비된 사람’이 더 자연스럽고 사람을 지칭하는 표현입니다. 다정한 직접 호칭으로는 ‘얘야’가 자연스럽습니다.
  terminology: πίστις는 ‘믿음’, ἁμαρτίαι는 복수 의미를 포괄하는 ‘죄’, ἀφίενται는 신적 행위자를 명시하지 않는 수동 선언인 ‘용서받았다’로 옮깁니다. τέκνον의 가능한 남성적 번역은 각주로 보존합니다.
