source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: ko
  text: 예수께서 그것을 들으시고 그들에게 말씀하십니다. “건강한 사람들[a]에게는 의사가 필요 없지만, 병든 사람들에게는 필요합니다. 나는 의인들[b]을 부르러 온 것이 아니라 죄인들을 부르러 왔습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “강한 사람들” 또는 “건강한 이들.” 그리스어는 문자적으로 강하거나 건강한 상태인 이들을 가리킵니다.
    reason: οἱ ἰσχύοντες의 문자적 의미와 자연스러운 의학적 문맥 번역을 함께 보존합니다.
  - marker: b
    text: 문맥상 “의인들”은 자신을 의롭다고 여기는 이들이나 의롭다고 여겨지는 이들을 가리키는 아이러니로 이해될 수도 있습니다. 그러나 그리스어 본문은 단지 “의인들”이라고 합니다.
    reason: δικαίους에 대한 가능한 문맥적 아이러니를 본문에 강요하지 않고 표시합니다.
