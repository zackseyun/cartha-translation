  verdict: revise
  source_fidelity: The draft accurately conveys the medical contrast and Jesus’ stated purpose. However, it levels Mark’s historical present λέγει into a past-tense Korean narrative verb and repeats ‘came’ where the Greek has one governing verb. The supplied object for ἀκούσας is contextually justified; ‘그 말’ is more natural Korean than ‘그것.’
  naturalness: The draft’s quotation uses plain-style endings (‘필요 없다,’ ‘왔다’) despite the requested modern formal-polite 합쇼체. The revision consistently uses formal-polite endings and employs natural Korean generic plurals.
  terminology: ‘의사,’ ‘의인,’ and ‘죄인’ are established, accurate Korean renderings. ‘건강한 사람들’ naturally conveys the idiomatic medical sense of οἱ ἰσχύοντες, while a footnote preserves the Greek lexical nuance (‘strong/well’).
  issues:
  - severity: medium
    issue: The direct quotation is in plain style rather than the required formal-polite 합쇼체.
    rationale: ‘필요 없다/있다’ and ‘왔다’ do not maintain the specified Korean register. Formal-polite endings are required throughout the quoted speech.
  - severity: low
    issue: The historical present λέγει is rendered as past tense.
    rationale: ‘말씀하십니다’ can naturally retain Mark’s vivid narrative present in formal Korean and more closely reflects the Greek.
  - severity: low
    issue: ‘그것’ is an unnatural referential object in this context.
    rationale: The object is implicit in Greek and may be supplied; ‘그 말’ idiomatically identifies the preceding remarks without adding substantive content.
  revised_text: 예수께서 그 말을 들으시고 그들에게 말씀하십니다. “건강한 사람들에게는[a] 의사가 필요 없고, 병든 사람들에게는 필요합니다. 나는 의인이 아니라 죄인을 부르러 왔습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘강한 사람들’ 또는 ‘잘 있는 사람들’. 그리스어는 문자적으로 강하거나 잘 있는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의인’은 문맥상 아이러니하게, 곧 의롭다고 여겨지는 사람들이나 스스로 의롭다고 생각하는 사람들을 가리킬 수도 있습니다. 그러나 그리스어 본문은 단지 ‘의인’이라고 말합니다.
    reason: alternative_reading
  revision_rationale: The text is revised to meet the specified 합쇼체 register, preserve Mark’s historical present, and use idiomatic Korean for the implicit object. The second clause avoids unnecessarily repeating ‘온’ while retaining the Greek construction. Footnotes preserve the lexical range of οἱ ἰσχύοντες and the unresolved contextual force of ‘the righteous’ without imposing an interpretation.
