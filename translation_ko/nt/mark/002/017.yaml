review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the core contrast and Jesus' mission statement. However, λέγει is a historical present and should be reflected as “말씀하십니다,” rather than the past “말씀하셨습니다.” The supplied object “그것을” is acceptable from context. “건강한” naturally communicates the medical sense of οἱ ἰσχύοντες, while a note preserves its more literal ‘strong/well’ range.
  naturalness: The revision uses natural contemporary standard Korean in formal-polite narrative and direct speech. Repeating “의사가 필요하다” is better avoided in the second half of the contrast, where Korean naturally supplies the understood predicate.
  terminology: “의사,” “의인,” and “죄인” are established, clear Korean biblical terms. The main text does not impose an ironic interpretation on “의인들.”
  issues:
  - severity: medium
    issue: Historical present is rendered as a past tense.
    rationale: λέγει is present tense in Mark’s narrative. “말씀하십니다” better preserves the source's historical present than “말씀하셨습니다.”
  - severity: low
    issue: The lexical breadth of οἱ ἰσχύοντες is not signaled.
    rationale: “건강한 사람들” is idiomatic in the physician contrast, but the Greek literally denotes those who are strong or well. A footnote preserves this lexical alternative without making the main text unnatural.
  revised_text: 예수께서 그것을 들으시고 그들에게 말씀하십니다. “건강한 사람들[a]에게는 의사가 필요 없지만, 병든 사람들에게는 필요합니다. 나는 의인들[b]을 부르러 온 것이 아니라 죄인들을 부르러 왔습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “강한 사람들” 또는 “건강한 이들.” 그리스어는 문자적으로 강하거나 건강한 상태인 이들을 가리킵니다.
    reason: οἱ ἰσχύοντες의 문자적 의미와 자연스러운 의학적 문맥 번역을 함께 보존합니다.
  - marker: b
    text: 문맥상 “의인들”은 자신을 의롭다고 여기는 이들이나 의롭다고 여겨지는 이들을 가리키는 아이러니로 이해될 수도 있습니다. 그러나 그리스어 본문은 단지 “의인들”이라고 합니다.
    reason: δικαίους에 대한 가능한 문맥적 아이러니를 본문에 강요하지 않고 표시합니다.
  revision_rationale: Historical present를 합쇼체 현재형으로 바로잡고, 의료 비유에 자연스러운 “건강한 사람들”을 유지하되 그리스어의 더 넓은 어휘 범위를 각주로 보존했습니다. “의인들”의 해석상 긴장도 각주로만 밝혀 본문의 모호성을 유지했습니다.
