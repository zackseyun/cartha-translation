  - severity: low
    issue: 존칭 및 문체의 불일치
    rationale: 서술에서는 ‘그분께서 … 잡수시는’이라고 높이면서 인용문에서는 ‘그가 … 먹는가’라고 하여 높임과 문체가 혼재합니다. 합쇼체의 질문형으로 통일하되, 원문에 없는 화자들의 존경 또는 경멸을 추가하지 않도록 주어와 주체 높임을 피했습니다.
