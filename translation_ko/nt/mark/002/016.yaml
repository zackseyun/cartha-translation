  source_fidelity: 수정이 필요합니다. 원문의 γραμματεῖς는 복음서 문맥에서 통상적인 용어인 ‘서기관’으로 옮기고, τῶν Φαρισαίων의 소속 관계는 ‘바리새파에 속한’으로 나타냈습니다. 두 차례의 ‘죄인들과 세리들/세리들과 죄인들’의 어순과, ἐσθίει 및 ἔλεγον의 진행·반복적 뉘앙스를 보존했습니다.
  naturalness: 초안의 ‘바리새인의 율법학자들’은 다소 부자연스럽고, 서술의 존칭 ‘그분께서 … 잡수시는’과 인용문 ‘그가 … 먹는가’가 혼재합니다. 현대 표준어 합쇼체에 맞춰 자연스럽고 일관된 서술 및 질문으로 다듬었습니다.
  terminology: ‘서기관’, ‘바리새파’, ‘세리’, ‘죄인’, ‘제자’는 복음서의 관례적이며 의미상 적절한 용어입니다. ‘함께 먹다’는 식탁 교제의 함의를 본문에 과도하게 해설하지 않고 보존합니다.
