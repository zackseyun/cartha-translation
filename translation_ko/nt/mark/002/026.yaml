    text: ‘진설병’은 성소에서 하나님 앞에 차려 놓는 거룩한 빵을 가리킵니다.
    reason: cultural_note
  revision_rationale: ‘주지 않았느냐’를 원문의 긍정 동사에 맞추어 ‘주었는지’로 바로잡고, 누락된 ‘어떻게’를 복원했습니다. ἐπὶ Ἀβιαθὰρ ἀρχιερέως의 해석상 범위는 본문에서 과도하게 확정하지 않고 각주에 보존했습니다.
