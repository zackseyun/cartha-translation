review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐξουσία를 ‘권세’, ὁ υἱὸς τοῦ ἀνθρώπου를 ‘인자’로 옮긴 점은 적절합니다. 그러나 ἵνα 목적절을 종결문 ‘알게 하려 한다’로 처리하고 마침표 및 닫는 인용부호를 둔 것은, 뒤따르는 λέγει τῷ παραλυτικῷ와 연결되는 그리스어의 중단·전환 구문을 충분히 반영하지 못합니다.
  naturalness: ‘죄를 사하다’는 현대 표준어 합쇼체 본문에서는 다소 고어적이므로 ‘죄를 용서하다’가 자연스럽습니다. 목적절 뒤에 줄표를 두어 다음 절의 발화로 이어지게 하면 한국어에서도 문맥과 원문의 진행이 살아납니다.
  terminology: ‘인자’는 한국어 성서 전통과 다니엘 7장 연관 가능성을 보존하는 적절한 칭호입니다. ‘권세’는 ἐξουσία의 법적·권위적 의미를 잘 전달합니다. ‘중풍병자’는 παραλυτικός의 전통적 번역이지만 현대 독자를 위해 대안 표현을 각주로 제시할 수 있습니다.
  issues:
  - severity: medium
    issue: 목적절의 종결 및 인용부호 처리
    rationale: ἵνα δὲ εἰδῆτε ... 뒤의 λέγει τῷ παραλυτικῷ는 다음 발화를 도입합니다. 초안의 마침표와 닫는 인용부호는 이 연결을 끊고, ‘알게 하려 한다’는 원문의 목적 구문을 독립된 의도 진술로 바꿉니다.
  - severity: low
    issue: ‘사하다’의 현대성
    rationale: 의미는 맞지만, 현대 표준어 합쇼체의 자연스러운 본문 문체에는 ‘용서하다’가 더 적합합니다.
  revised_text: 그러나 인자가 땅에서 죄를 용서할 권세가 있음을 너희가 알게 하려고—그분께서 중풍병자에게 말씀하셨습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘마비된 사람’.
    reason: lexical_alternative
  revision_rationale: 목적절을 ‘알게 하려고’로 유지하고 줄표 뒤에 ‘그분께서 중풍병자에게 말씀하셨습니다’를 배치하여, 원문의 중단된 발화와 다음 절의 직접 인용으로 이어지는 구조를 보존했습니다. ‘인자’와 ‘권세’는 유지했으며, 현대성을 위해 ‘사하다’를 ‘용서하다’로 고쳤습니다. ‘중풍병자’의 전통적 표현에는 현대적 대안을 각주로 제공했습니다.
