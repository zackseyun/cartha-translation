  verdict: revise
  source_fidelity: The draft accurately conveys the Pharisees, their address to Jesus, the Sabbath setting, and the objection that the action is not permitted. However, “그러자” adds a consequential/temporal nuance not carried by the simple connective καὶ. The interrogative τί can mean either “why” or “what”; the contextual rendering “어찌하여” is appropriate, but the lexical alternative should be retained in a footnote as in the audit trail.
  naturalness: The proposed revised Korean uses natural contemporary formal-polite narrative style. “보십시오” and “말하였습니다” fit the requested register, while “안식일에 해서는 안 되는 일을” is clear and idiomatic.
  terminology: “바리새인들,” “안식일,” and “해서는 안 되는” are suitable standard Korean renderings. The latter preserves the accusation’s permissibility/lawfulness force without specifying a particular legal or doctrinal framework.
  issues:
  - severity: low
    issue: “그러자” exceeds the force of καὶ.
    rationale: καὶ is a simple narrative connective (“and”). “그러자” can imply “then/as a result,” introducing a relationship not explicit in the Greek.
  - severity: low
    issue: The ambiguity of τί is not represented.
    rationale: Although “어찌하여” is contextually likely, τί can formally be read as “무엇.” The English audit trail preserves this alternative, so a Korean lexical footnote is warranted.
  revised_text: 바리새인들이 그분에게 말하였습니다. 「보십시오, 어찌하여a 그들이 안식일에 해서는 안 되는 일을 합니까?」
