    rationale: 문맥상 이유를 묻는 질문으로 번역하는 것은 가능하지만, τί의 ‘무엇’ 독법도 문법적으로 가능하므로 본문 비평적·의미론적 모호성을 각주로 보존하는 것이 안전합니다.
