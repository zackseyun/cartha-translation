    text: 또는 “보십시오, 그들이 안식일에 해서는 안 되는 무슨 일을 합니까?” 그리스어 τί는 “무엇”으로도 읽을 수 있으나, 문맥상 “어찌하여”라는 뜻일 가능성이 높습니다.
    reason: lexical_alternative
  revision_rationale: Removed the unwarranted connective nuance of “그러자” and added a footnote for the formally possible “what” sense of τί. The main wording retains the contextually likely complaint, “why are they doing what is not permitted on the Sabbath?”
