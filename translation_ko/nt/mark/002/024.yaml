  source_fidelity: ‘그러자’는 단순 접속사 καὶ에 없는 결과·전환의 뉘앙스를 더할 수 있으므로 ‘그리고’가 더 충실합니다. τί는 문맥상 ‘왜/무엇 때문에’로 이해할 수 있으나 ‘무엇’이라는 문법적 가능성도 있으므로 각주로 보존하는 것이 적절합니다. ‘안식일에 해서는 안 되는 일’은 ὃ οὐκ ἔξεστιν의 허용·적법성에 관한 비난을 자연스럽게 전달합니다.
