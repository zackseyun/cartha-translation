  rationale: 원문의 결과 구문과 진행 중인 발화를 보존하고, ‘전하다’가 더하는 해석적 의미를 피했습니다. 문 주변까지 빈 공간이 없었다는 표현을 명확히 했으며, 원문과 영어 POB의 λόγος 관련 대안도 각주로 유지했습니다.
