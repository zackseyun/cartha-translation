  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “혼인 잔치의 손님들[a]이 신랑과 함께 있는 동안 금식할 수 있겠느냐? 그들이 신랑을 곁에 두고 있는 동안에는 금식할 수 없다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “혼인 잔치 자리의 아들들” 또는 “신방의 아들들”이며, 혼인 잔치에 참여하는 사람들을 가리키는 관용적 표현입니다.
    reason: οἱ υἱοὶ τοῦ νυμφῶνος의 직역 가능성과 관용적 의미를 밝혀, 본문의 자연스러운 번역을 보완합니다.
