  terminology: ‘자기 영으로’는 원문의 표현을 유지하되, 그것이 예수님의 내적 영을 뜻하는지 혹은 지각의 방식을 뜻하는지 확정하지 않도록 각주를 달았습니다. ‘마음속으로’는 καρδίαις의 내적 사고·의도의 비유적 용법을 자연스럽게 반영합니다.
