review_pass:
  verdict: revise
  source_fidelity: 초안은 신랑의 강제적 상실과 그 뒤의 금식을 대체로 잘 옮겼습니다. 그러나 원문의 복수 주어인 ‘날들이 올 것이며’와 단수의 ‘그날에’를 구분하지 않고 ‘빼앗길 날’로 합쳐, 시간 표현의 구조와 단수 강조가 흐려졌습니다. 또한 ἀπαρθῇ는 신랑이 ‘빼앗기는’ 것보다 ‘그들에게서 빼앗기는’ 것으로 옮겨야 ἀπ’ αὐτῶν의 관계가 명료합니다.
  naturalness: ‘그러나’와 ‘금식할 것입니다’는 현대 표준어 합쇼체에 자연스럽습니다. ‘신랑을 그들에게서 빼앗길 날’은 한국어에서 피동 주체의 관계가 다소 불분명하므로 문장을 분리해 명료하게 하는 편이 좋습니다.
  terminology: νυμφίος는 성경의 혼인 비유를 보존하는 ‘신랑’으로 적절하며, νηστεύσουσιν은 ‘금식할 것입니다’가 적절합니다. 원문이 제거의 주체나 방식, 그리고 비유의 지시 대상을 명시하지 않으므로 이를 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘신랑을 그들에게서 빼앗길 날’이 원문의 ‘날들이 올 것이다’와 ‘신랑이 그들에게서 빼앗길 때’를 하나의 수식어구로 결합합니다.
    rationale: ἐλεύσονται δὲ ἡμέραι는 복수이고, ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος는 그 날들이 도래할 때의 사건을 나타냅니다. 둘을 분리하면 원문의 문장 구조와 의미 관계가 더 정확해집니다.
  - severity: medium
    issue: 마지막 시간 표현의 단수성과 전치사적 표현이 충분히 드러나지 않습니다.
    rationale: ἐν ἐκείνῃ τῇ ἡμέρᾳ는 ‘그날에’라는 단수입니다. ‘그날에는’도 문법상 가능하지만, 앞선 ‘날’과 결합된 초안에서는 복수 ‘날들’과 단수 ‘그날’의 대비가 사라집니다.
  revised_text: 그러나 신랑이 그들에게서 빼앗길 날들이 올 것입니다. 그날에 그들은 금식할 것입니다.
