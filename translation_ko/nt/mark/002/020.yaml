  to: 그러나 신랑이 그들에게서 빼앗길 날들이 올 것입니다. 그날에 그들은 금식할 것입니다.
  rationale: 복수 ‘날들’과 단수 ‘그날’을 구분하고, 신랑이 ‘그들에게서’ 빼앗긴다는 원문의 관계를 명료하게 했습니다. ‘빼앗기다’는 수동태와 갑작스러운 상실의 뉘앙스를 유지하며, 제거의 주체나 구체적 사건은 덧붙이지 않습니다.
