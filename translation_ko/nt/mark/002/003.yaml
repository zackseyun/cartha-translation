  verdict: revise
  source_fidelity: 초안의 ‘그때’는 καὶ의 단순 접속을 시간 부사로 구체화하므로 삭제하는 것이 좋습니다. 또한 ‘사람들이’와 ‘네 사람’은 원문의 ‘그들’ 및 ‘넷’을 각각 사람/남성으로 명시합니다. 한국어에서는 ‘네 명’이 자연스럽지만, 원문이 단지 ‘넷’이라고 한 점은 각주로 밝혀야 합니다. ‘데리고 왔습니다’는 역사적 현재 ἔρχονται와 φέροντες의 결합을 자연스럽게 옮기며, ‘들고 있는’은 αἰρόμενον의 수동적 운반 의미를 전달합니다.
  naturalness: ‘그들이 네 명이 들고 있는 마비된 사람 한 명을 그분께 데리고 왔습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘중풍병자’보다 ‘마비된 사람’이 현대적이며 사람 중심적인 표현입니다.
  terminology: παραλυτικός는 ‘마비된 사람’으로 옮겼습니다. πρὸς αὐτόν의 대상은 문맥상 예수님이므로 기존 번역의 존칭 지시어 ‘그분’을 유지했습니다. ὑπὸ τεσσάρων은 본문에서 자연스러운 ‘네 명’으로 옮기되, 원문이 성별이나 ‘사람’을 명시하지 않는다는 점을 각주로 보완했습니다.
  issues:
