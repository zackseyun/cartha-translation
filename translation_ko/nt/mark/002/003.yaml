    issue: ‘그때’가 원문의 단순 접속사 καὶ에 시간적 의미를 덧붙입니다.
    rationale: καὶ는 앞 사건을 잇는 ‘그리고’이며, 이 절에서 ‘그때’라는 특정한 시간적 전환을 명시하지 않습니다.
  - severity: low
    issue: ‘네 사람’은 원문의 ‘넷’보다 더 구체적입니다.
    rationale: ὑπὸ τεσσάρων은 문자적으로 ‘넷에 의해’이며, 문맥상 사람들을 가리키지만 성별이나 명사 자체는 명시하지 않습니다. 한국어의 자연스러운 수 표현을 위해 ‘네 명’을 쓰고 각주로 원문의 생략을 표시합니다.
  revised_text: 그들이 네 명[a]이 들고 있는 마비된 사람 한 명을 그분께 데리고 왔습니다.
