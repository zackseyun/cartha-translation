  text: 또한 아무도 새 포도주를 낡은 가죽 부대에 넣지 않습니다. 그렇지 않으면 포도주가 가죽 부대를 터뜨려, 포도주도 가죽 부대도 못 쓰게 됩니다. 그러나 새 포도주는 새 가죽 부대에 넣습니다.
