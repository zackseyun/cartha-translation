  to: 또한 아무도 새 포도주를 낡은 가죽 부대에 넣지 않습니다. 그렇지 않으면 포도주가 가죽 부대를 터뜨려, 포도주도 가죽 부대도 못 쓰게 됩니다. 그러나 새 포도주는 새 가죽 부대에 넣습니다.
  rationale: 원문의 결과절(포도주가 부대를 터뜨리고 포도주와 부대가 모두 손상됨)을 유지했습니다. 마지막 타원절은 한국어에서 자연스럽게 보충하되 ‘-아야 한다’의 강한 의무 표현은 피했습니다. 문체를 합쇼체로 통일하고, stray 인용부호를 삭제했습니다.
