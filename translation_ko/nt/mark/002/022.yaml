  source_fidelity: 핵심 비유와 결과는 대체로 충실합니다. 다만 마지막 절의 동사 없는 격언적 표현에 대해 ‘담아야 한다’라고 의무를 명시하면 원문의 타원 표현보다 강한 양태를 더합니다.
  naturalness: ‘가죽 부대’와 ‘못 쓰게 됩니다’는 현대 한국어에서 자연스럽습니다. 다만 요청된 현대 합쇼체에 맞추어 문장 종결을 ‘-습니다’로 통일하고, 끝의 불필요한 닫는 인용부호를 제거해야 합니다.
  terminology: οἶνος νέος는 ‘새 포도주’, ἀσκοί는 ‘가죽 부대’, παλαιούς/καινούς의 대조는 ‘낡은/새’로 자연스럽게 반영됩니다. ‘새’는 καινός의 질적 뉘앙스를 모두 드러내지는 않지만, 한국어의 간결한 대조에서는 무리 없는 번역입니다.
  issues:
