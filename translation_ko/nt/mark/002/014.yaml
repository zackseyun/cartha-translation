  text: 그분께서 지나가시다가 알패오의 아들 레위가 세금 징수소[a]에 앉아 있는 것을 보시고 그에게 말씀하십니다. 「나를 따르십시오.」 그러자 그는 일어나 그분을 따랐습니다.
