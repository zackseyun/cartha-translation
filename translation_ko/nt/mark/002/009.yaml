  source_fidelity: 원문의 비교 의문(τί … εὐκοπώτερον)과 두 부정사구의 대조는 초안에 대체로 보존되어 있습니다. 그러나 παραλυτικός는 현대 한국어에서 ‘마비된 사람’으로 옮기는 것이 더 직접적이며, κράβαττος는 단순한 휴대용 깔개/침상이라는 뜻이 드러나도록 ‘돗자리’가 적절합니다. ἀφίενταί의 현재 수동형은 한국어 ‘용서되었다’가 결과 상태를 나타내는 용법으로 무리 없이 포괄합니다.
  naturalness: ‘중풍병자’는 현대 표준어 성경 문맥에서 다소 낡고 질환 범위도 좁게 들릴 수 있습니다. ‘말하는 것’과 ‘말하는 것’의 병렬 및 ‘어느 것이 더 쉽겠습니까?’는 자연스럽고 현대적인 합쇼체 문장입니다. 직접 인용문의 명령형 ‘일어나서 … 걸어가라’는 인용된 명령의 자연스러운 형태입니다.
  terminology: ‘죄’, ‘용서되었다’, ‘마비된 사람’, ‘돗자리’는 신학적 의미나 물건의 성격을 과도하게 해석하지 않고 원문에 충실합니다. 용서 선언의 시제·상은 ‘용서되었다’로 유지하여 완료 사건과 현재의 용서 상태 사이의 가능한 뉘앙스를 한쪽으로 단정하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘중풍병자’
    rationale: παραλυτικός는 일반적으로 마비를 앓는 사람을 뜻합니다. ‘중풍병자’는 현대어에서 뇌졸중(중풍)과 연관된 특정 질환으로 좁혀 들릴 수 있고 사람을 질병명으로 명사화합니다.
  - severity: low
    issue: ‘네 자리’
    rationale: κράβαττος는 사람이 누워 있던 간이 침상 또는 깔개입니다. ‘자리’도 가능하지만 다의적이므로, 휴대하여 드는 물건이라는 문맥을 드러내는 ‘돗자리’가 더 분명합니다.
  revised_text: 마비된 사람에게 ‘네 죄가 용서되었다’라고 말하는 것과 ‘일어나서 네 돗자리를 들고 걸어가라’라고 말하는 것 중 어느 것이 더 쉽겠습니까?
  revised_footnotes: []
  revision_rationale: 현대적이고 비낙인적인 표현을 위해 παραλυτικός를 ‘마비된 사람’으로, κράβαττος의 간이 깔개 의미를 드러내기 위해 ‘돗자리’로 고쳤습니다. 원문의 대조 구조, 용서 선언의 수동 표현, 명령의 연속은 유지했습니다.
