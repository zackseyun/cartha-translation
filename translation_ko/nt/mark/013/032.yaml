  source_fidelity: 수정안은 Περὶ δέ의 화제 전환(“그러나 … 관해서는”), ἢ의 선택 관계(“그 날이나 그 시”), οὐδείς οἶδεν의 현재 의미, 천사와 아들을 포함하는 부정의 열거, 그리고 아버지 한 분만의 예외를 모두 보존합니다. 초안의 “그날과 그 시”는 ἢ(‘또는’)를 ‘과’로 옮겨 관계를 바꾸므로 수정이 필요합니다.
  naturalness: “그러나 그 날이나 그 시에 관해서는 아무도 알지 못합니다”는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. “하늘에 있는 천사들도, 아들도”는 원문의 병렬적 부정을 명료하게 드러냅니다.
  terminology: ‘아들’과 ‘아버지’는 원문의 정관사적 칭호를 자연스럽게 유지합니다. 기존 각주의 ‘종속적-들림(subordinationist-sounding)’은 부자연스러운 혼용 표현이며 본문이 말하지 않는 신학적 평가를 앞세웁니다. 본문을 그대로 두고, 해석자들이 제시하는 이해를 본문에 추가하지 않는다는 중립적 각주로 교체합니다.
  issues:
  - severity: medium
    issue: “그날과 그 시”가 원문의 접속사 ἢ를 ‘과’로 번역합니다.
    rationale: ἢ는 ‘또는/이나’이며, ‘그 날’과 ‘그 시’ 사이의 선택적 병렬을 나타냅니다. ‘그 날이나 그 시’로 옮겨야 원문의 관계를 보존합니다.
  - severity: medium
    issue: 각주가 ‘종속적-들림’이라는 비표준 혼용어와 신학적 평가를 사용합니다.
    rationale: 영어 감사 기록은 ‘아들의 성육신 사명 또는 인성과 관련하여’ 이해하는 해석자들이 있음을 중립적으로 알리되, 번역문은 헬라어의 표현을 보존한다고 설명합니다. 수정 각주는 이 범위에 맞추고 신학적 결론을 강요하지 않습니다.
  - severity: low
    issue: 각주 표지가 절 전체 끝에 놓여 있어 ‘아들도’라는 논쟁적 구절의 주석 대상이 다소 불명확합니다.
    rationale: 표지를 ‘아들도’ 뒤에 배치하면 각주가 바로 그 구절에 관한 것임을 분명히 하면서 문장 구조를 해치지 않습니다.
