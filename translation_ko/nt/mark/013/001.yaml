  source_fidelity: 원문의 역사적 현재 λέγει는 초안의 과거형 ‘말했습니다’보다 현재형 ‘말합니다’로 옮기는 편이 적절합니다. 또한 ἱερόν은 성소 내부만이 아니라 성전 경내 전체를 가리킬 수 있으므로 이를 각주로 밝혀야 합니다. ποταπός의 감탄·찬탄의 뉘앙스는 ‘얼마나 대단합니까’로 자연스럽게 살릴 수 있습니다.
