  terminology: ‘성전’은 통상적 번역어로 유지하되, ἱερόν의 넓은 지시 범위는 각주로 보완합니다. Διδάσκαλε는 ‘선생님’으로, οἰκοδομαί는 ‘건물들’로 번역하는 것이 문맥과 현대 한국어에 적합합니다.
