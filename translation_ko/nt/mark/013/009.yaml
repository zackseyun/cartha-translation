  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
  footnotes:
  - marker: a
    text: Or 'for a witness to them'; the phrase may also carry the sense 'as testimony against them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 여러분은 스스로 조심하십시오. 그들이 여러분을 공의회에 넘겨줄 것이고, 여러분은 회당에서 매질을 당할 것이며, 나 때문에 총독들과 왕들 앞에 서게 될 것입니다. 이것은 그들에게 증언이 되도록 하기 위한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 증언이 되게 하려는 것이다.’ 문맥에 따라 ‘그들에게 불리한 증언’이라는 뜻으로도 이해될 수 있다.
    reason: εἰς μαρτύριον αὐτοῖς의 목적·결과 관계와 ‘against them’으로 이해될 수 있는 의미 가능성을 보존합니다.
