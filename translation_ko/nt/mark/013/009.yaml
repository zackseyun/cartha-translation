  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 εἰς μαρτύριον αὐτοῖς의 ‘그들에게 증언/증거가 됨’이 ‘서서’에 바로 이어져 문장 관계가 다소 불분명하며, 이 구절에 가능한 ‘그들에게 불리한 증언’의 뉘앙스를 주석으로 보존하는 편이 좋습니다.
  naturalness: ‘여러분 자신을 조심하십시오’와 반복된 ‘것이며’는 이해 가능하나 다소 직역투입니다. ‘여러분은 스스로 조심하십시오’ 및 병렬 미래 표현으로 정리하면 현대 표준 한국어 합쇼체로 더 자연스럽습니다.
  terminology: ‘공의회’, ‘회당’, ‘총독들’, ‘왕들’은 원문의 제도적 구별을 과도하게 특정하지 않고 적절히 반영합니다. μαρτύριον은 이 문맥에서 ‘증언’이 ‘증거’보다 더 자연스럽고 능동적인 전달입니다.
