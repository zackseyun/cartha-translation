  verdict: revise
  source_fidelity: The draft accurately conveys the fig tree, its branch becoming tender, leaf growth, and summer being near. However, ‘알게 됩니다’ can suggest a future result more than the Greek present indicative γινώσκετε (‘you know/recognize’). ‘연해지고’ is also more idiomatic than ‘부드러워지고’ for tender new plant growth.
  naturalness: The revised wording is natural modern standard Korean in formal-polite register. ‘무화과나무에게서’ clearly expresses the source of the illustrative teaching, and omitting an unnecessary explicit subject before ‘압니다’ avoids stiffness.
  terminology: ‘비유’ appropriately preserves παραβολή and its Gospel-term continuity. A footnote is placed on ‘비유,’ the term to which the lexical alternative pertains, rather than on ‘잎을 내면.’
  issues:
  - severity: medium
    issue: The Korean rendering of γινώσκετε as ‘알게 됩니다’ is aspectually less precise.
    rationale: γινώσκετε is present indicative, stating what is recognized from the sign. ‘압니다’ better retains this general present sense.
  - severity: low
    issue: ‘부드러워지고’ is not the most idiomatic Korean description of a branch’s tender new growth.
    rationale: For ἁπαλὸς γένηται in this botanical context, ‘연해지고’ is more natural while retaining the sense of becoming tender.
  - severity: low
    issue: The lexical-alternative footnote for παραβολή lacks a Korean anchor and footnote.
    rationale: The English audit trail identifies a documented alternative for παραβολή. Anchoring the Korean note to ‘비유’ preserves both relevance and traceability.
