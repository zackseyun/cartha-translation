  source_fidelity: The draft correctly retains the titular "인자" and the future public seeing, but "구름을 타고" is a more specific and idiomatic image than the Greek ἐν νεφέλαις ("in/amid clouds"). It should be adjusted to preserve the source wording without deciding the debated spatial nuance. The explicit "사람들이" is not wrong, but "그들은" more directly represents the Greek’s unexpressed plural subject.
  naturalness: '"그때에 그들은 … 볼 것입니다" is natural in modern formal-polite Korean. "구름 가운데서" is a clear, dignified rendering that avoids the added vehicle-like nuance of "구름을 타고."'
  terminology: '"인자," "큰 권능," and "영광" appropriately preserve the established biblical title and key apocalyptic terminology. No doctrinal expansion is introduced.'
  issues:
