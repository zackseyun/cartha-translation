    issue: '"구름을 타고" specifies a mode of travel not stated by ἐν νεφέλαις.'
    rationale: The Greek most directly locates the coming in/amid clouds. "Riding on clouds" is compatible with related biblical imagery but is interpretively more definite than this wording.
  - severity: low
    issue: The draft omits the lexical-alternative note supplied in the English audit trail.
    rationale: A note can preserve the viable "with the clouds" rendering and identify its possible Daniel 7:13 resonance without placing interpretation in the main text.
