  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
  footnotes:
  - marker: a
    text: Or 'this people' or 'this race'; Greek γενεά can bear broader senses, though 'generation' is the most natural rendering here.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'will certainly not pass away' renders an emphatic Greek negation.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 진실로 여러분에게 말합니다. 이 모든 일이 일어날 때까지 이 세대[a]는 결코 지나가지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 백성’ 또는 ‘이 종족’. 그리스어 γενεά는 더 넓은 뜻으로도 쓰일 수 있으나, 여기서는 ‘세대’가 가장 자연스러운 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘결코 지나가지 않을 것입니다’는 강한 그리스어 부정을 옮긴 것입니다.
    reason: lexical_alternative
