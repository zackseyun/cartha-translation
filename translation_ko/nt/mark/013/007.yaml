  text: 또 여러분이 전쟁과 전쟁에 관한 소식[a]을 들을 때, 놀라지 마십시오. 그런 일들은 반드시 일어나야 합니다. 그러나 아직 끝은 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁의 소문’. 그리스어는 전쟁에 관하여 들려오는 보고, 소식 또는 소문을 가리킬 수 있습니다.
    reason: lexical_alternative
