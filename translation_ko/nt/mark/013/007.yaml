review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal clause, the prohibition against alarm, the necessity expressed by δεῖ, and the statement that the end is not yet. However, ‘전쟁의 소문’ narrows ἀκοὰς πολέμων to unverified rumors, whereas the Greek can more broadly mean reports or news about wars.
  naturalness: The draft is generally natural in modern formal-polite Korean. Separating the final contrast into its own sentence more clearly reflects the Greek’s emphatic ‘but not yet the end,’ and ‘그런 일들’ naturally supplies the contextual referent of the infinitive.
  terminology: ‘끝’ appropriately preserves the text’s eschatological term without importing a particular interpretive system. ‘전쟁에 관한 소식’ is a broader and more source-faithful rendering of ἀκοὰς πολέμων; the familiar ‘전쟁의 소문’ should be retained as a footnoted alternative.
  issues:
  - severity: medium
    issue: ‘전쟁의 소문’ is too narrow as the unfootnoted main rendering.
    rationale: ἀκοή may mean a report, news, or a rumor. Rendering it only as ‘소문’ can imply hearsay more strongly than the Greek requires. A broader main text with a lexical-alternative note better preserves the source ambiguity.
  - severity: low
    issue: The contrast following δεῖ γενέσθαι can be punctuated more clearly.
    rationale: Using a sentence break before ‘그러나 아직 끝은 아닙니다’ provides natural Korean flow while retaining the force of ἀλλά and οὔπω.
  revised_text: 또 여러분이 전쟁과 전쟁에 관한 소식[a]을 들을 때, 놀라지 마십시오. 그런 일들은 반드시 일어나야 합니다. 그러나 아직 끝은 아닙니다.
  revised_footnotes:
