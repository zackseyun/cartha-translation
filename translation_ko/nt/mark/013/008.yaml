  text: 민족이 민족을 대적하여 일어나고, 나라가 나라를 대적하여 일어날 것이기 때문입니다. 곳곳에 지진이 일어나고 기근이 있을 것입니다. 이런 일들은 해산의 진통이 시작되는 것입니다.
  philosophy: optimal-equivalence
