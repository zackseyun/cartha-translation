  terminology: “깨어 있으십시오”는 경계와 지속적 각성의 명령을 적절히 전달하며, “집 주인”은 여기서 직접적인 존칭 신학 용어로 단정하지 않고 가정 비유 안의 권위를 나타냅니다. “닭이 울 때”와 “새벽”도 한국어에서 이해하기 쉬우면서 원문의 야간 시간 구분을 충실히 반영합니다.
