  source_fidelity: 그리스어의 명령 γρηγορεῖτε, 인과접속사 γάρ, 집 주인의 도래와 네 시간 표지는 대체로 충실히 옮겼습니다. 다만 ὀψέ는 네 야경의 첫 표지로서 보통 ‘저녁’보다 ‘저녁 늦게’가 더 정확하며, 원문의 열거 구조는 쉼표와 ‘또는’으로 직접 보이는 편이 좋습니다.
