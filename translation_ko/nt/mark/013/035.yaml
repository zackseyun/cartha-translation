  terminology: ‘깨어 있으십시오’는 γρηγορεῖτε에 자연스럽고 적절합니다. ‘집 주인’은 ὁ κύριος τῆς οἰκίας의 비유적 가정 문맥을 잘 반영합니다. ἀλεκτοροφωνία는 ‘닭이 울 때’로 명료하게 옮길 수 있으며, 필요하면 야경 표지라는 점을 주석으로 보완할 수 있습니다.
