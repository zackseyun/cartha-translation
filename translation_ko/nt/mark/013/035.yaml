  source_fidelity: 그리스어의 명령 γρηγορεῖτε를 “깨어 있으십시오”로, 추론적 οὖν을 “그러므로”로 정확히 옮겼습니다. 주인이 올 시각을 알지 못한다는 이유와 네 시간대(저녁, 한밤중, 닭이 울 때, 새벽)를 모두 보존했습니다. “집 주인”은 이 비유적 가정 문맥의 ὁ κύριος τῆς οἰκίας를 자연스럽게 반영합니다.
