  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘떠나면서’는 두 행동의 동시성을 다소 강하게 만들며, ‘각자에게 자기의 일을 맡기며’는 문맥상 무난하지만 그리스어의 병렬적 타원 구문을 더 직접적으로 옮길 수 있습니다. 또한 δοῦλοι의 예속 관계는 ‘종들’보다 ‘노예들’이 더 분명하게 나타냅니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. 다만 ‘권세’는 현대 한국어에서 종교적·신학적 어감이 강할 수 있으므로, 위임된 ἐξουσία의 뜻에는 ‘권한’이 더 자연스럽습니다.
  terminology: ἐξουσία는 ‘권한’, δοῦλοι는 ‘노예들’, θυρωρός는 ‘문지기’, γρηγορῇ는 이 장의 반복되는 비유를 살려 ‘깨어 있으라’로 옮기는 것이 적절합니다. ‘노예들’에는 현대 독자가 용어의 사회적 함의를 확인할 수 있도록 각주를 답니다.
  issues:
  - severity: medium
    issue: ‘떠나면서’가 ἀφεὶς의 시간 관계를 동시적 행동처럼 들리게 함
    rationale: 분사는 주된 비교 속에서 집을 떠난 뒤 권한을 주고 명령하는 서술을 연결합니다. ‘떠나’는 불필요한 동시성 함의를 피하면서 자연스럽습니다.
  - severity: low
    issue: ‘권세’의 현대적 어감
    rationale: ἐξουσία는 여기서 종들에게 위임된 권위·권한을 뜻합니다. ‘권한’이 현대 한국어에서 더 직접적이고 오해가 적습니다.
  - severity: medium
    issue: δοῦλοι의 예속 관계가 ‘종들’에서 충분히 드러나지 않음
    rationale: 이 가정 비유에서는 주인과 δοῦλοι의 종속적 관계가 전경화됩니다. ‘노예들’이 원어의 사회적 현실을 더 충실히 드러내며, 대안 용례는 각주로 안내할 수 있습니다.
  revised_text: 이는 한 사람이 여행을 떠나 자기 집을 떠나, 자기 노예들에게 권한을 주고 각자에게 자기 일을 맡기며, 문지기에게는 깨어 있으라고 명령한 것과 같습니다.[a]
