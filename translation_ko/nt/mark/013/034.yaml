- from: 이는 여행을 떠난 사람과 같습니다. 그는 자기 집을 떠나면서, 자기 종들에게 권세를 주고, 각자에게 자기의 일을 맡기며, 문지기에게는 깨어 있으라고 명령했습니다.
  to: 이는 한 사람이 여행을 떠나 자기 집을 떠나, 자기 노예들에게 권한을 주고 각자에게 자기 일을 맡기며, 문지기에게는 깨어 있으라고 명령한 것과 같습니다.[a]
