source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the elect.'
    reason: lexical_alternative
  - marker: b
    text: '''From the four winds'' is an idiom meaning from every direction.'
    reason: cultural_note
  - marker: c
    text: Some translations render the final phrase more interpretively as 'from the farthest end of the earth to the farthest end of heaven' or 'from one end of heaven to the other.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그때에 그는 천사들을 보내어 네 바람[b]에서, 땅 끝에서 하늘 끝까지[c], 택하신 이들[a]을 모으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로, “택함 받은 이들” 또는 “택자들”이라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “네 바람”은 모든 방향, 곧 온 세상을 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 마지막 표현은 “땅의 가장 먼 끝에서 하늘의 가장 먼 끝까지” 또는 “하늘 이 끝에서 저 끝까지”로 옮기기도 합니다.
    reason: alternative_reading
