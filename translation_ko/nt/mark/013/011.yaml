  to: 그들이 여러분을 끌고 가서 넘겨줄 때, 무엇을 말할지 미리 염려하지 마십시오. 그러나 그 시간에 여러분에게 주어지는 것은 무엇이든 말하십시오. 말씀하시는 분은 여러분이 아니라 성령이시기 때문입니다.
