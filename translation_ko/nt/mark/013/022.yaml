review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future emergence of false messiahs and false prophets and their signs and wonders. However, ‘택자들까지’ adds an emphatic ‘even’ nuance not expressed in the Greek, and ‘미혹하려 할’ can sound like an additional attempt/intention construction rather than the Greek purpose clause πρὸς τὸ ἀποπλανᾶν. The revision expresses the purpose directly while retaining εἰ δυνατόν (‘if possible’) without deciding whether deception of the elect is possible.
  naturalness: ‘택자’ is not natural in contemporary standard Korean outside narrow theological jargon. ‘선택받은 이들’ is clear, formal, and idiomatic. Reordering the purpose phrase produces a smoother Korean sentence.
  terminology: ‘거짓 메시아들,’ ‘거짓 예언자들,’ and ‘표적과 기사’ appropriately render the key terms. ‘선택받은 이들’ preserves the sense of τοὺς ἐκλεκτούς without importing denominational conclusions.
  issues:
  - severity: medium
    issue: ‘택자들까지’ adds emphasis and uses marked jargon.
    rationale: The Greek has simply ‘the elect’ (τοὺς ἐκλεκτούς), without a particle corresponding to ‘까지.’ ‘택자’ is also less natural than modern standard Korean alternatives.
  - severity: low
    issue: The purpose clause is not rendered as directly as it could be.
    rationale: πρὸς τὸ ἀποπλανᾶν expresses purpose (‘in order to lead astray’). ‘미혹하려고’ represents this directly and naturally.
  revised_text: 이는 거짓 메시아들과 거짓 예언자들이 일어나, 가능하다면 선택받은 이들을 미혹하려고 표적과 기사를 행할 것이기 때문입니다.
  revised_footnotes: []
  revision_rationale: The revision removes added emphasis, replaces a less idiomatic theological label with natural standard Korean, and makes the Greek purpose construction explicit. ‘가능하다면’ preserves the source’s unresolved conditional force.
