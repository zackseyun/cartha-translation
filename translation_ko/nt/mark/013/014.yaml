  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
  footnotes:
  - marker: a
    text: Or, 'standing where he ought not to be.' The Greek participle is masculine, which may suggest a personal referent behind 'the abomination.'
    reason: alternative_reading
  - marker: b
    text: '''The abomination of desolation'' echoes Daniel''s language (see Dan. 9:27; 11:31; 12:11).'
    reason: cross_reference
translation:
  language: ko
  text: 여러분이 멸망의 가증한 것이 있어서는 안 될 곳에 서 있는 것을 보거든(읽는 이는 깨달으십시오)[a], 그때 유대에 있는 사람들은 산으로 피해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 있어서는 안 될 곳에 서 있는 것을.” 그리스어 분사는 남성형이며, ‘가증한 것’ 뒤에 인격적 지시 대상이 있음을 시사할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘멸망의 가증한 것’은 다니엘서의 표현을 반향합니다(단 9:27; 11:31; 12:11 참조).
    reason: cross_reference
