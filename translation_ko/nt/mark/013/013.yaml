  naturalness: 초안의 ‘끝까지 견디는 자, 그가’는 현대 한국어에서 쉼표로 이어진 중복 주어가 다소 부자연스럽습니다. ‘끝까지 견디는 사람은’으로 다듬으면 οὗτος의 강조를 주제 표지로 자연스럽게 살리면서 합쇼체 문체에 맞습니다.
  terminology: ‘내 이름’, ‘미움을 받다’, ‘끝까지 견디다’, ‘구원을 받다’는 한국어 성경 문맥과 현대적인 정중 문체 모두에 적절합니다. ‘모든 사람에게’는 ὑπὸ πάντων의 행위자 표현을 자연스럽게 반영합니다.
