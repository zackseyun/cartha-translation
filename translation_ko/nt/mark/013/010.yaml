  terminology: ‘복음’은 εὐαγγέλιον의 한국어 성경 번역에서 확립된 자연스러운 대응어이며, ‘전파되어야 합니다’는 κηρυχθῆναι와 δεῖ의 공적 선포 및 필연의 의미를 적절히 나타냅니다. 별도 각주가 없으므로 각주 표지 관련 문제도 없습니다.
