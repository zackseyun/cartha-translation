  source_fidelity: 원문의 καὶ, πρῶτον, δεῖ, 수동 부정과거 부정사 κηρυχθῆναι, εἰς πάντα τὰ ἔθνη의 범위가 모두 충실히 반영되었습니다. ‘모든 민족에게’는 ἔθνη를 ‘이방인’으로 협의화하지 않으면서 전체 민족들에 대한 선포라는 문맥적 범위를 잘 보존합니다.
