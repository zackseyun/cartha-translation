  to: 그리고 형제가 형제를 죽음에 넘겨주고, 아버지가 자기 자녀를 죽음에 넘겨주며, 자녀들이 부모에게 맞서 일어나 그들을 죽일 것입니다.
  rationale: 둘째 절에 원문상 공유되는 ‘죽음에’를 보충하여 의미를 완전하게 했습니다. ‘넘겨주다’는 παραδίδωμι의 구체적 의미를 보존하며, ‘맞서 일어나’는 ἐπαναστήσονται의 적대적 반항을 자연스러운 현대 한국어로 옮깁니다. 본문에 본문비평상 불확실성이나 필수 어휘 주석이 없어 각주를 추가하지 않았습니다.
