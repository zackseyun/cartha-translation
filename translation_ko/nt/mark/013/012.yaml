  verdict: revise
  source_fidelity: 첫 절의 παραδώσει εἰς θάνατον은 대체로 잘 반영했지만, 둘째 절의 ‘아버지가 자녀를 넘겨줄 것이며’에는 그리스어에서 첫 절로부터 이어지는 ‘죽음에’가 빠져 있습니다. 또한 ἐπαναστήσονται와 θανατώσουσιν αὐτούς는 ‘부모에게 맞서 일어나 그들을 죽일 것’으로 명확히 옮길 수 있습니다.
  naturalness: ‘죽음에 넘겨주고’보다 문장 전체의 미래 서술에 맞춘 ‘죽음에 넘겨줄 것이며’가 더 자연스럽습니다. ‘부모를 거슬러 일어나’도 가능하지만, 현대 표준어에서는 ‘부모에게 맞서 일어나’가 자연스럽고 원문의 적대적 대항의 뜻을 유지합니다.
  terminology: ‘형제’, ‘아버지’, ‘자녀’, ‘부모’는 각각 ἀδελφός, πατήρ, τέκνον/τέκνα, γονεῖς를 적절히 반영합니다. παραδίδωμι는 해석을 과도하게 덧붙인 ‘배반하다’ 대신 ‘넘겨주다’로 유지합니다.
  issues:
  - severity: medium
    issue: 둘째 절에서 ‘죽음에’가 누락됨
    rationale: εἰς θάνατον은 ‘형제가 형제를’와 ‘아버지가 자녀를’ 넘겨주는 두 병렬 행위에 걸쳐 적용됩니다. 한국어에서는 생략할 경우 아버지가 자녀를 누구에게 또는 무엇을 위해 넘겨주는지 불명확해집니다.
  - severity: low
    issue: 첫 두 절의 시제·연결 표현이 다소 불균형함
    rationale: 원문은 모두 미래형 동사입니다. ‘넘겨줄 것이며’로 맞추면 예언적 진술의 흐름이 더 분명하고 자연스럽습니다.
