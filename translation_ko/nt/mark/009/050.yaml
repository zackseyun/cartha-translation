  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
  footnotes:
  - marker: a
    text: Or 'if the salt loses its saltiness' or 'becomes tasteless.'
    reason: lexical_alternative
  - marker: b
    text: The command 'Have salt in yourselves' preserves the metaphor of the Greek; possible interpretations include maintaining purity, wisdom, covenant faithfulness, or preserving influence, but the text does not specify one meaning explicitly.
    reason: lexical_alternative
  - marker: c
    text: Or 'be at peace with one another.'
    reason: lexical_alternative
