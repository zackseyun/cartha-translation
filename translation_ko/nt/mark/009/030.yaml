  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
  footnotes:
  - marker: a
    text: Or 'they were passing through Galilee.' The Greek imperfect verb can emphasize ongoing movement.
    reason: lexical_alternative
  - marker: b
    text: The Greek leaves unstated what he did not want anyone to know; in context, it refers to his presence or route through Galilee.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그곳을 떠나, 그들은 갈릴리를 지나가고 계셨는데[a], 예수님께서는 아무도 알기를 원하지 않으셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “갈릴리를 지나가고 있었습니다.” 그리스어 미완료형은 계속 진행 중인 이동을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 아무도 무엇을 알지 못하게 하려 하셨는지를 밝히지 않습니다. 문맥상 예수님의 উপস্থিত 또는 갈릴리를 지나는 여정을 가리킬 수 있습니다.
    reason: implicit_object
