  source_fidelity: 수정이 필요합니다. 본문의 첫 αὐτούς는 예수께서 질문하신 대상인 ‘그들에게’를 가리키며, πρὸς ἑαυτούς는 그 대상 집단 내부의 상호 관계, 곧 ‘서로/너희끼리’를 뜻합니다. 초안의 ‘그들과’는 두 번째 대명사의 지시 대상을 외부의 다른 집단으로 바꾸어 놓습니다.
  naturalness: ‘여러분은 서로 무엇을 논의하고 있습니까?’는 현대 표준 한국어 합쇼체로 자연스럽고, 직접 질문의 현재성을 잘 살립니다.
  terminology: συζητεῖτε는 문맥상 논쟁의 뉘앙스를 가질 수 있으나, 본문 자체만으로 적대적 논쟁을 단정하지 않는 ‘논의하고’가 적절합니다. 가능한 ‘논쟁’ 의미는 각주로 보존합니다.
  issues:
  - severity: high
    issue: ‘그들과’
    rationale: πρὸς ἑαυτούς의 상호적 의미는 ‘서로’ 또는 ‘너희끼리’입니다. ‘그들과’는 질문받는 이들과 구별되는 제3의 집단을 도입하여 원문의 지시 관계를 변경합니다.
  - severity: medium
    issue: ‘논쟁하고’
    rationale: συζητέω는 논쟁·토론을 뜻할 수도 있지만 일반적인 논의도 뜻합니다. 본문은 논쟁의 어조를 명시하지 않으므로 본문에서는 더 넓은 ‘논의하고’를 사용하고, 논쟁의 가능성은 각주로 처리하는 것이 적절합니다.
  revised_text: 그리고 그분께서 그들에게 물으셨습니다. “여러분은 서로 무엇을 논의하고 있습니까?”
  revised_footnotes:
  - marker: a
    text: 또는 “여러분은 서로 무엇을 논쟁하고 있습니까?”
    reason: συζητέω는 문맥에 따라 논의, 토론 또는 논쟁을 뜻할 수 있습니다.
  revision_rationale: 두 대명사의 서로 다른 기능을 보존했습니다. ‘그들에게’는 질문의 수신자를, ‘서로’는 그들 내부에서 이루어진 상호 논의를 나타냅니다. 또한 본문에는 중립적인 ‘논의하고’를 두고, 문맥적으로 가능한 논쟁의 뉘앙스는 각주에 남겼습니다.
