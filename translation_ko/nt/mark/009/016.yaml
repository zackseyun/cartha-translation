  source_fidelity: 초안의 ‘그들과’는 πρὸς ἑαυτούς(‘서로/자기들끼리’)를 ‘그들’이라는 별도 상대와의 대화로 바꾸므로 원문에 충실하지 않습니다. 또한 συζητεῖτε의 넓은 의미는 기본문에서 ‘논의하다’로 옮기고, 문맥상 가능한 ‘논쟁하다’는 각주로 보존하는 것이 적절합니다.
  naturalness: ‘여러분은 서로 무엇을 논의하고 있습니까?’는 현대 표준 한국어 합쇼체로 자연스럽고, 복수 청자와 상호성을 분명히 드러냅니다.
  terminology: ‘물으셨습니다’는 ἐπηρώτησεν에 적절합니다. ‘논의하다’는 συζητεῖτε의 비표지적 의미를 보존하며, ‘논쟁하다’ 가능성은 각주에서 제시합니다.
  issues:
  - severity: high
    issue: ‘그들과’
    rationale: πρὸς ἑαυτούς는 질문받는 복수 집단 내부의 상호 관계를 뜻합니다. ‘그들과’는 본문에 없는 별도의 상대 집단을 도입합니다.
  - severity: low
    issue: 논쟁의 뉘앙스가 본문에 고정됨
    rationale: συζητέω는 문맥에 따라 토론·논쟁을 뜻할 수 있으나, 이 절 자체만으로 적대적 논쟁을 확정할 필요는 없습니다.
  revised_text: 그리고 그분께서 그들에게 물으셨습니다. 「여러분은 서로 무엇을 논의하고 있습니까?a」
  revised_footnotes:
  - marker: a
    text: 또는 “여러분은 서로 무엇을 논쟁하고 있습니까?” ‘논의하다’로 번역된 동사는 문맥에 따라 토론하거나 논쟁한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 상호성을 나타내는 πρὸς ἑαυτούς를 ‘서로’로 바로잡고, συζητεῖτε의 가능한 논쟁 의미는 각주에 남겨 원문의 의미 범위를 보존했습니다.
