source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
  footnotes:
  - marker: a
    text: Or 'hell.' The Greek reads 'Gehenna,' a term rooted in the Valley of Hinnom and used for eschatological judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 만일 여러분의 눈이 여러분을 걸려 넘어지게 한다면, 그 눈을 빼 버리십시오. 두 눈을 가지고 게헨나[ㄱ]에 던져지는 것보다 한쪽 눈으로 하나님의 나라에 들어가는 것이 여러분에게 더 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 ‘지옥’. 그리스어는 ‘게헨나’이며, 힌놈 골짜기에 뿌리를 둔 말로 종말의 심판을 가리키는 데 사용됩니다.
    reason: alternative_reading
