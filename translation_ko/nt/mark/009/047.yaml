- from: 그리고 만일 여러분의 눈이 여러분을 걸려 넘어지게 하면, 그것을 빼 버리십시오. 두 눈을 가지고 게헨나에 던져지는 것보다, 한 눈으로 하나님의 나라에 들어가는 것이 여러분에게 더 낫습니다.
  to: 그리고 만일 여러분의 눈이 여러분을 걸려 넘어지게 한다면, 그 눈을 빼 버리십시오. 두 눈을 가지고 게헨나[ㄱ]에 던져지는 것보다 한쪽 눈으로 하나님의 나라에 들어가는 것이 여러분에게 더 낫습니다.
