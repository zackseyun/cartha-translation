  - severity: low
    issue: ‘한 눈으로’의 표현 개선
    rationale: ‘한쪽 눈으로’가 μονόφθαλμον(한 눈인, 한쪽 눈만 가진)의 상태를 더 자연스러운 현대 한국어로 전달합니다.
