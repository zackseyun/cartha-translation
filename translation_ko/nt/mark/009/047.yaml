  source_fidelity: 핵심 의미와 비교 구문, ‘하나님의 나라’, ‘게헨나’는 잘 보존되었습니다. 다만 ἐκβάλε αὐτόν의 목적어가 눈임을 한국어 본문에서 명시하면 지시 대상이 더 분명해집니다. σκανδαλίζῃ의 비유적 표현은 ‘걸려 넘어지게 하다’로 유지하여 ‘죄짓게 하다’로 의미를 한정하지 않았습니다.
  naturalness: ‘그것을 빼 버리십시오’는 바로 앞의 ‘눈’을 받지만 한국어에서는 다소 어색하고 지시 대상이 흐립니다. ‘그 눈을 빼 버리십시오’가 자연스럽고 명료합니다. ‘한쪽 눈으로’는 μονόφθαλμον의 구체적 이미지를 현대 한국어로 더 자연스럽게 나타냅니다.
  terminology: ‘하나님의 나라’는 βασιλεία τοῦ θεοῦ에 대한 표준적이고 적절한 번역입니다. γέεννα는 역사적·종말론적 특수성을 보존하도록 ‘게헨나’로 음역하고, 일반적인 번역어 ‘지옥’은 각주로 안내하는 것이 적절합니다.
