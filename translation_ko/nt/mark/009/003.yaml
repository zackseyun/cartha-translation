  source_fidelity: The draft correctly conveys the change of state, the exceptional whiteness, and the comparison with human ability. However, '빛나는 모양이 되어' introduces 'appearance/form' (모양) not expressed in the Greek and is less direct than the predicative description. The revised wording more closely reflects στίλβοντα λευκὰ λίαν and οὕτως λευκᾶναι.
