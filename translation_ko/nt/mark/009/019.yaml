review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the address, the two rhetorical questions, and the command. However, ‘여러분을 참아 주겠습니까’ adds a benefactive nuance (‘do a favor by enduring you’) not expressed by ἀνέξομαι ὑμῶν. The Greek historical present λέγει is also best retained in this formally equivalent rendering.
  naturalness: The revision uses natural modern Korean while retaining the solemn, rebuking force of Jesus’ speech. ‘아’ is a more natural modern rendering of the Greek vocative interjection than ‘오’ in this context.
  terminology: ‘믿음이 없는 세대’ faithfully renders γενεὰ ἄπιστος without prematurely choosing between ‘unbelieving’ and ‘faithless.’ A footnote records the viable ‘신실하지 않은’ alternative. ‘견디겠습니까’ renders ἀνέχομαι without the added benefactive sense.
  issues:
  - severity: medium
    issue: ‘참아 주겠습니까’ includes the auxiliary ‘주다.’
    rationale: This construction can imply doing something for the hearers’ benefit. The Greek simply asks how long Jesus will endure/bear with them.
  - severity: low
    issue: The historical present λέγει is rendered as a past-tense verb.
    rationale: Korean narrative past is possible, but ‘말씀하십니다’ better reflects Mark’s vivid present in an optimal-equivalence translation.
  revised_text: 그분께서 그들에게 대답하여 말씀하십니다. 「아, 믿음이 없는 세대여,[a] 내가 언제까지 여러분과 함께 있겠습니까? 내가 언제까지 여러분을 견디겠습니까? 그를 내게 데려오십시오.」
  revised_footnotes:
