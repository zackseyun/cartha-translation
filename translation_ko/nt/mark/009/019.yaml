    text: 또는 “신실하지 않은 세대여.” 그리스어 ἄπιστος는 믿지 않음을 뜻할 수도 있고 신실하지 않음을 뜻할 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision removes the added benefactive nuance, reflects Mark’s historical present, and preserves the lexical breadth of ἄπιστος in an anchored footnote. The questions and imperative remain direct and formal-polite.
