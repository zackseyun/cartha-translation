  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
  footnotes:
  - marker: a
    text: Or “faithless generation.” The Greek ἄπιστος can denote lack of belief or lack of faithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or “How long will I endure/bear with you?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 그들에게 대답하여 말씀하십니다. 「아, 믿음이 없는 세대여,[a] 내가 언제까지 여러분과 함께 있겠습니까? 내가 언제까지 여러분을 견디겠습니까? 그를 내게 데려오십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “신실하지 않은 세대여.” 그리스어 ἄπιστος는 믿지 않음을 뜻할 수도 있고 신실하지 않음을 뜻할 수도 있습니다.
    reason: lexical_alternative
