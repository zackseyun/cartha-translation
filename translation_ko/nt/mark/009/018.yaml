  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
  footnotes:
  - marker: a
    text: Or 'becomes withered,' 'wastes away,' or more literally 'dries up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 영이 그를 사로잡는 곳마다 그를 내동댕이칩니다. 그러면 그는 거품을 흘리고 이를 갈며 몸이 굳어집니다[a]. 그래서 제가 선생님의 제자들에게 그것을 쫓아내라고 했지만, 그들은 쫓아낼 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마릅니다’, ‘시들어 쇠약해집니다’.
    reason: ξηραίνεται는 문맥상 몸이 굳는 것으로 이해될 수 있으나, 문자적으로는 마르다 또는 시들다는 뜻도 지닌다.
