review_pass:
  verdict: revise
  source_fidelity: 핵심 조건문에서 ἔσται는 미래 직설법이므로, 초안의 의무적 표현인 「되어야 합니다」보다 미래 진술인 「될 것입니다」가 원문에 더 충실합니다. 또한 λέγει는 역사적 현재이므로 이를 반영하는 것이 안전합니다.
  naturalness: 「꼴찌」는 현대어로 자연스럽지만 다소 구어적이고 경쟁의 뉘앙스가 강합니다. 「모든 이 가운데 마지막인 사람」은 합쇼체 문맥에서 더 중립적이며 자연스럽습니다.
  terminology: διάκονος를 「섬기는 사람」으로 옮겨 δοῦλος와의 구별을 보존합니다. 「모든 이를 섬기는 사람」은 πάντων의 포괄성을 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: 미래 직설법이 의무 표현으로 번역됨
    rationale: ἔσται(‘그는/그 사람이 될 것이다’)는 조건절 뒤의 미래 직설법입니다. 「되어야 합니다」는 규범적 당위로 의미를 좁히므로 「될 것입니다」가 더 적절합니다.
  - severity: low
    issue: 역사적 현재 λέγει가 과거형으로 평탄화됨
    rationale: 원문의 현재형을 한국어 서사에서도 「말씀하십니다」로 반영할 수 있습니다.
  - severity: low
    issue: 「꼴찌」의 문체 및 의미 뉘앙스
    rationale: 「꼴찌」는 구어적이며 순위 경쟁을 강하게 연상시킬 수 있습니다. 「마지막인 사람」이 ἔσχατος의 포괄적 의미에 더 중립적입니다.
  revised_text: 그리고 그분께서 앉으신 뒤 열두 제자를 부르시고 그들에게 말씀하십니다. 「누구든지 첫째가 되고자 하면, 모든 이 가운데 마지막인 사람이 되고 모든 이를 섬기는 사람이 될 것입니다.」
