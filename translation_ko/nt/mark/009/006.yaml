review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the singular subject as Peter from the immediate context and renders τί ἀποκριθῇ as deliberation about an answer. However, it weakens ἐγένοντο ('became') by using the stative '두려워했기' ('were afraid'). The revision retains the intensified fear of ἔκφοβοι and the plural subject.
  naturalness: ‘무어라’ is understandable but somewhat dated in this register. ‘무엇이라고’ is natural modern standard Korean. The revised causal construction is idiomatic formal-polite Korean while retaining both explanatory clauses.
  terminology: No specialized theological terminology occurs. ‘대답하다’ accurately reflects ἀποκρίνομαι; ‘몹시 두려워하게 되다’ represents both the intensity of ἔκφοβοι and the ingressiveness of ἐγένοντο without overinterpreting the plural subject.
  issues:
  - severity: medium
    issue: The verbal nuance of ἐγένοντο is omitted.
    rationale: ‘그들이 몹시 두려워했기’ presents fear as a state, whereas γίνομαι indicates that they came into that state. ‘몹시 두려워하게 되었기’ preserves this aspect.
  - severity: low
    issue: Slightly dated wording in ‘무어라’.
    rationale: ‘무엇이라고’ is more natural in contemporary standard Korean formal prose.
  revised_text: 베드로는 무엇이라고 대답해야 할지 알지 못했으니, 그들이 몹시 두려워하게 되었기 때문입니다.
  revised_footnotes: []
