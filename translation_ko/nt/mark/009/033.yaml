  naturalness: ‘가버나움에 이르렀습니다’, ‘예수께서 집에 계실 때에 그들에게 물으셨습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽습니다. 직접화법도 합쇼체로 통일했습니다.
