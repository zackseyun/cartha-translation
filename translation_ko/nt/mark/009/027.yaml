    reason: ἤγειρεν의 어휘적 대안을 제시하고, 문맥상 신체적으로 일으키는 뜻을 유지하면서 관련 어휘 범위를 알립니다.
  - marker: b
    text: 또는 ‘그는 일어서거나 일어났습니다.’
