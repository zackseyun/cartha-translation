  terminology: πνεῦμα은 문맥상 악한 영을 암시할 수 있으나 본문에 없는 ‘악한’ 또는 ‘사로잡힌’을 추가하지 않고 ‘영’으로 옮깁니다. ἄλαλον의 수식 대상도 ‘영’으로 유지합니다.
