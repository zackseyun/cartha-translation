  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
  footnotes:
  - marker: a
    text: Or 'a large millstone,' specifically one turned by a donkey.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 나를 믿는 이 작은 이들 가운데 하나를 걸려 넘어지게 하면, 그의 목에 나귀가 끄는 맷돌이 매달리고 그가 바다에 던져지는 것이 그에게 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘나귀 맷돌.’ 나귀가 돌리는 큰 맷돌을 가리킵니다.
    reason: μύλος ὀνικός의 구체적 의미를 설명하고, ‘나귀가 끄는 맷돌’이라는 본문 표현의 어휘적 배경을 보완합니다.
