  rationale: 구름과 음성의 갑작스러운 도래를 자연스러운 한국어로 옮기되, 신적 임재에 관한 해설을 본문에 덧붙이지 않았습니다. ‘음성’으로 화자의 발화를 보존하고, 명령문의 현재적이고 주의 깊은 청종의 뉘앙스는 각주에서 제한적으로 설명했습니다.
