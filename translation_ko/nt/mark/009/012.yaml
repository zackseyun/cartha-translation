  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
  footnotes:
  - marker: a
    text: Or 'be despised' / 'be regarded as nothing.' The Greek verb carries the sense of being treated as of no account.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 그들에게 말씀하셨습니다. 「엘리야가 과연 먼저 와서 모든 것을 회복합니다. 그리고 인자에 관하여는 어찌하여 그가 많은 고난을 당하고 멸시받아야 한다고[a] 기록되어 있겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무가치한 자로 여김을 받아야 한다.’
    reason: ἐξουδενηθῇ는 ‘멸시받다’와 함께 ‘아무것도 아닌 자로 여기다, 하찮게 여기다’라는 뉘앙스를 지닙니다.
