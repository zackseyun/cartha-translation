  source_fidelity: 수정이 필요합니다. 초안의 “그 영이 그분을 보자마자”는 헬라어 ἰδὼν αὐτόν의 목적어를 예수님으로 바꾸어 버립니다. 여기서 영이 본 대상은 데려온 아이입니다. 또한 첫 접속사 καί는 인과를 나타내지 않으므로 “그래서”보다 “그리고”가 적절합니다. συνεσπάραξεν은 영이 아이에게 경련을 일으킨다는 사역적 의미를, ἐκυλίετο는 계속되는 뒹굶을 나타냅니다.
  naturalness: 합쇼체 문체는 유지할 수 있습니다. 한국어에서 반복되는 대명사가 가리키는 대상을 혼동시키므로, 문맥상 확정되는 예수님과 아이를 각각 명시해 자연스럽고 정확하게 했습니다. “거품을 흘리며 뒹굴고 있었습니다”는 마지막 두 분사의 동시성과 미완료상의 지속성을 자연스럽게 드러냅니다.
  terminology: πνεῦμα는 이 절 자체의 표현대로 “그 영”으로 옮기며, “더러운 영”이나 “귀신”을 본문에 보태지 않습니다. “예수님”은 이 절의 대명사 선행사가 문맥상 예수님임을 한국어에서 분명히 하기 위한 표현입니다.
  issues:
  - severity: high
    issue: “그 영이 그분을 보자마자”의 목적어 지시가 잘못되었습니다.
    rationale: ἰδὼν αὐτόν에서 보는 주체는 τὸ πνεῦμα이며, αὐτόν은 방금 예수님께 데려온 아이를 가리킵니다. 초안은 이를 예수님으로 옮겨 사건의 주체와 대상 관계를 바꿉니다.
  - severity: medium
    issue: “그래서”가 καί에 인과 관계를 부가합니다.
    rationale: 본문은 단순한 서술 연결이므로 “그리고”가 더 충실합니다.
  - severity: low
    issue: “심하게”는 원문에 명시된 부사로서 제시되지 않습니다.
    rationale: 동사의 강한 의미는 “경련을 일으켰습니다”로 충분히 표현할 수 있으며, 별도의 정도 부사를 더하지 않는 편이 안전합니다.
  revised_text: 그리고 그들이 그 아이를 예수님께 데려왔습니다. 그 영은 그 아이를 보자마자 곧 그에게 경련을 일으켰습니다. 그는 땅에 쓰러져 거품을 흘리며 뒹굴고 있었습니다.
  revised_footnotes: []
  revision_rationale: 대명사의 선행사를 한국어에서 명시하여 영이 아이를 보았고 아이에게 경련을 일으켰다는 원문의 관계를 보존했습니다. τὸ πνεῦμα는 “그 영”으로 유지하고, εὐθύς는 “곧”으로, συνεσπάραξεν은 사역적 표현으로, ἐκυλίετο는 지속상으로 옮겼습니다. 원문에 없는 ‘더러운’ 또는 ‘귀신’이라는 명칭과 불필요한 인과 관계는 추가하지 않았습니다.
