  source_fidelity: 본문은 Τοῦτο τὸ γένος의 명시되지 않은 명사를 보충하지 않고 ‘이런 종류’로 옮기며, ἐν οὐδενὶ와 ἐν προσευχῇ의 수단적 의미도 보존합니다. 다만 ‘어떤 것으로도’는 현대 한국어에서 부자연스러우므로 ‘어떤 수단으로도’가 원문의 수단 표현을 더 정확하고 자연스럽게 전달합니다.
  naturalness: ‘그분께서’는 이 문맥의 예수님을 가리키는 한국어 성경 문체로 다소 어색합니다. ‘예수님께서’가 자연스럽고 분명합니다. 또한 ‘기도가 아니고는’은 문법적으로 가능하지만, ‘기도가 아니면’이 현대 표준어 합쇼체에서 더 매끄럽습니다.
  terminology: ‘기도’는 προσευχῇ에 적절합니다. ‘이런 종류’는 원문이 ‘영/귀신’을 반복하지 않는 점을 보존합니다. 후대 사본의 ‘금식’을 본문에 넣지 않고 본문비평 각주로 처리해야 합니다.
  issues:
