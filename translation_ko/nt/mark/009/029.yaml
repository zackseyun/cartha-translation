    issue: ‘어떤 것으로도’가 부자연스럽고 수단 의미가 불명확합니다.
    rationale: ἐν οὐδενὶ는 여기서 수단·방법을 뜻하므로 ‘어떤 수단으로도’가 자연스러우면서도 원문의 의미를 충실히 반영합니다.
  - severity: low
    issue: ‘그분께서’가 문맥상 지시 대상을 불필요하게 흐립니다.
    rationale: 바로 앞 문맥의 화자가 예수님이므로 ‘예수님께서’는 한국어 성경 문체상 자연스럽고 의미를 추가하지 않습니다.
  - severity: medium
    issue: 후대 사본의 ‘기도와 금식’ 이문에 대한 각주가 빠져 있습니다.
    rationale: 제시된 영어 POB 감사 기록과 SBLGNT 본문에 따라, 본문은 ‘기도’만 유지하고 잘 알려진 긴 이문은 각주로 밝혀야 합니다.
  revised_text: 예수님께서 그들에게 말씀하셨습니다. “이런 종류는 기도가 아니면 어떤 수단으로도 나올 수 없습니다.”
  revised_footnotes:
