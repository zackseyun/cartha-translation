  source_fidelity: 그리스어의 핵심 의미(‘이런 종류’, ‘나올 수 없음’, ‘기도 외에는’)는 대체로 반영되어 있습니다. 그러나 ἐν οὐδενί의 수단·방법의 뉘앙스는 ‘어떤 것으로도’보다 ‘어떤 방법으로도’가 한국어에서 더 분명하고 자연스럽습니다. 본문은 SBLGNT를 따라 ‘기도’만 유지해야 합니다.
  naturalness: ‘기도가 아니고는 어떤 것으로도’는 이해되지만 다소 어색합니다. ‘기도가 아니고는 어떤 방법으로도’가 현대 표준어 합쇼체 성경 문체에 더 자연스럽습니다. 문맥상 화자가 예수님임을 밝혀 ‘예수님께서’로 하는 것은 한국어 단독 절 번역의 자연스러움을 높입니다.
  terminology: ‘이런 종류’는 γένος가 ‘영’이라는 명사를 명시하지 않는 원문을 충실히 보존합니다. ‘기도’는 προσευχῇ에 적절합니다. 후대 사본의 ‘금식’을 본문에 넣지 않고 각주로 처리해야 합니다.
  issues:
  - severity: low
    issue: ‘어떤 것으로도’의 표현
    rationale: ἐν οὐδενί는 여기서 수단을 가리킵니다. ‘어떤 방법으로도’가 의미를 더 명료하고 자연스럽게 전달합니다.
  - severity: low
    issue: 본문 화자 표지의 자연스러움
    rationale: 그리스어의 대명사적 ‘그가’를 한국어 단독 절에서 ‘그분께서’로 옮길 수 있으나, 문맥의 예수님을 명시하는 편이 현대 한국어 성경 문체에서 더 자연스럽고 지시 대상이 분명합니다.
  - severity: medium
    issue: 본문 비평 각주 누락
    rationale: 제공된 영어 POB 감사 기록에는 후대 사본이 ‘기도와 금식’을 읽는다는 본문 비평 각주가 있습니다. SBLGNT의 짧은 본문을 유지하면서 이 변이를 각주로 밝혀야 합니다.
  revised_text: 예수님께서 그들에게 말씀하셨습니다. “이런 종류는 기도가 아니고는 어떤 방법으로도 나올 수 없습니다.”
  revised_footnotes:
  - marker: a
    text: 일부 후기 사본에는 “기도와 금식”이라고 되어 있습니다.
    reason: textual_variant
  revision_rationale: ‘이런 종류’는 원문이 ‘영’ 또는 ‘귀신’을 반복하지 않는 점을 보존합니다. ‘기도가 아니고는 어떤 방법으로도’는 ἐν οὐδενί … εἰ μὴ ἐν προσευχῇ의 배타적인 수단 표현을 자연스럽게 옮깁니다. SBLGNT 본문에 따라 ‘금식’은 본문에 추가하지 않고 사본 변이 각주로 제시합니다.
