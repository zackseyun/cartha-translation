    text: 일부 후대 사본에는 “기도와 금식”이라고 되어 있습니다.
    reason: textual_variant
  revision_rationale: 원문의 간결한 ‘이런 종류’를 유지하고, 축귀 문맥에서 ‘나오다’를 그대로 보존했습니다. 수단을 나타내는 표현은 현대 한국어에 맞게 ‘어떤 수단으로도’로 다듬었습니다. SBLGNT의 ‘기도’만을 본문에 두고, ‘금식’을 더한 후대 이문은 각주로 제시했습니다.
