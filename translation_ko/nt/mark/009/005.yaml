base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
  footnotes:
  - marker: a
    text: Or “booths” or “tabernacles.” The Greek σκηνάς refers to temporary shelters and may carry associations with booths/tents, but the verse does not make those associations explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 베드로가 예수께 대답하여 말했습니다. “랍비님, 우리가 여기 있는 것이 좋습니다. 초막[a] 셋을 만듭시다. 하나는 랍비님을 위한 것이고, 하나는 모세를 위한 것이며, 하나는 엘리야를 위한 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “천막” 또는 “임시 거처.” 그리스어 σκηνάς는 임시로 마련한 거처를 가리킨다.
    reason: lexical_alternative
