revisions:
- from: 만일 여러분의 손이 여러분을 걸려 넘어지게 하면, 그것을 잘라 버리십시오. 두 손을 가지고 게헨나, 곧 꺼지지 않는 불 속으로 들어가는 것보다, 손이 잘린 채로 생명에 들어가는 것이 여러분에게 더 낫습니다.
