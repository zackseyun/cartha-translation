review_pass:
  verdict: revise
  source_fidelity: The draft preserves the forceful imperative, the contrast between entering life and going to Gehenna, and the unquenchable-fire expression. However, it changes the singular Greek possessives (σου, σε) to plural ‘여러분,’ and ‘손이 잘린 채로’ over-specifies κυλλόν (‘maimed/disabled’) beyond the source wording.
  naturalness: The phrasing is generally understandable, but repeated ‘여러분’ is less natural for this generic singular warning. ‘한쪽 손을 잃은 채’ is clear modern Korean and avoids the potentially stigmatizing wording ‘불구인 채.’
  terminology: ‘게헨나’ appropriately preserves γέεννα rather than importing ‘지옥.’ Footnotes should be supplied for the retained ambiguity of σκανδαλίζῃ and for the transliterated judgment term ‘게헨나.’
  issues:
  - severity: medium
    issue: Singular addressee rendered as plural
    rationale: The Greek has singular σου and σε (‘your hand,’ ‘you’). Rendering these as ‘여러분의/여러분을’ unnecessarily changes the address.
  - severity: medium
    issue: κυλλόν rendered too specifically as ‘손이 잘린 채로’
    rationale: κυλλός denotes being maimed or deprived of a limb; although the preceding imperative concerns cutting off the hand, the adjective itself does not explicitly state that the hand has been cut off. ‘한쪽 손을 잃은 채’ retains the resulting bodily contrast without specifying the means.
  - severity: low
    issue: Lexical and term notes absent from the Korean text
    rationale: The English audit trail preserves both the ambiguity of σκανδαλίζῃ and an explanation of Gehenna. Anchored Korean footnotes support source fidelity and reader comprehension.
  revised_text: 만일 당신의 손이 당신을 걸려 넘어지게 하면[a], 그것을 잘라 버리십시오. 한쪽 손을 잃은 채 생명에 들어가는 것이, 두 손을 가진 채 게헨나[b], 곧 꺼지지 않는 불 속으로 가는 것보다 당신에게 더 낫습니다.
