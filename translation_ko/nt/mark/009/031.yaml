  language: ko
  text: 이는 그분께서 제자들을 가르치시며 그들에게 이렇게 말씀하고 계셨기 때문입니다. 「인자가 사람들의 손에 넘겨질 것이며, 그들이 그분을 죽일 것입니다. 그분이 죽임을 당하신 뒤 사흘 후에 살아나실 것입니다.」
  philosophy: optimal-equivalence
