    issue: The final clause is attached in the wrong direction.
    rationale: '‘그에 관하여 기록된 대로 그에게 … 행하였습니다’ can state that the people acted in accordance with what was written about him. Greek καθὼς γέγραπται ἐπ’ αὐτόν instead qualifies the preceding treatment: they did to him whatever they wished, as was written about him.'
  - severity: low
    issue: The audit-trail footnote is absent from the Korean draft.
    rationale: The English POB supplies a cross-reference footnote on Elijah. Restoring its anchor and a Korean rendering preserves the documented note while leaving the main text noninterpretive.
