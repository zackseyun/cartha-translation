  source_fidelity: 'The draft retains the central claims, but it reverses the syntactic relationship of the final clauses: καθὼς γέγραπται ἐπ’ αὐτόν means that what was done to Elijah happened ‘as it is written about him,’ not that people acted according to a record concerning him. The revision restores this relationship. ‘엘리야도 이미 왔습니다’ represents καὶ Ἠλίας ἐλήλυθεν, including the perfect’s completed arrival with present relevance.'
  naturalness: The revised Korean uses modern formal-polite narrative speech. ‘그에게 자신들이 원하는 대로 하였습니다’ is clear and appropriately forceful without adding a specific form of mistreatment not stated in the Greek.
  terminology: ‘엘리야’ is standard. The main text does not identify Elijah as John the Baptist; the supplied cross-reference note preserves that interpretive identification outside the verse text.
