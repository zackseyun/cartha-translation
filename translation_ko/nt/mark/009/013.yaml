  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
  footnotes:
  - marker: a
    text: That is, Elijah has already come in the person and ministry of John the Baptist; see Mark 9:11–12 and compare Matthew 11:14; 17:12–13.
