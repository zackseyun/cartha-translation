translation:
  language: ko
  text: 그러나 내가 여러분에게 말합니다. 엘리야도 이미 왔습니다[a]. 그들은 그에게 자신들이 원하는 대로 하였습니다. 이는 그에 관하여 기록된 대로입니다.」
  philosophy: optimal-equivalence
  footnotes:
