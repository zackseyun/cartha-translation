  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
  footnotes:
  - marker: a
    text: Or, more literally, “The ‘if you can’?” Jesus echoes and challenges the father's wording from the previous verse.
    reason: lexical_alternative
  - marker: b
    text: The phrase “the one who believes” could also be rendered “the one who has faith” or “the one who trusts.”
