    text: 직역하면, “‘하실 수 있으시다면’이라는 말이냐?” 예수님께서 앞 절에서 그 아버지가 한 말을 되받아 말씀하시며 그 표현에 이의를 제기하십니다.
    reason: lexical_alternative
