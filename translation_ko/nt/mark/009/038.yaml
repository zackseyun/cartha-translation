base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
  footnotes:
  - marker: a
    text: Or 'we were forbidding him.' The Greek imperfect may describe repeated or attempted action; hence 'we tried to stop him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요한이 그분께 말했습니다. 「선생님, 우리가 어떤 사람이 선생님의 이름으로 귀신들을 쫓아내는 것을 보았는데, 그가 우리를 따르지 않았기 때문에 우리가 그를 막으려고 했습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 그를 막고 있었습니다.” 그리스어 미완료과거는 계속되거나 반복된 행동, 또는 시도된 행동을 나타낼 수 있습니다.
    reason: lexical_alternative
