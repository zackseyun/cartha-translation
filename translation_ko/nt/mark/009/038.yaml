  naturalness: The Korean is clear and suitably modern formal-polite. '막으려고 했습니다' is natural and more precise for the Greek imperfect. Retaining '그분께' is acceptable in the immediate narrative context.
  terminology: '''선생님'' appropriately renders Διδάσκαλε, ''귀신들을 쫓아내는'' accurately represents ἐκβάλλοντα δαιμόνια, and ''선생님의 이름으로'' preserves the biblical idiom ἐν τῷ ὀνόματί σου. ''우리를 따르지'' correctly preserves ἡμῖν (''us'') without interpretive alteration.'
