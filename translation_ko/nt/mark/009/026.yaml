revisions:
- from: 그러자 그것이 부르짖으며 그를 심하게 경련시키고 나갔습니다. 그리고 그는 죽은 사람같이 되어, 많은 사람이 「그가 죽었다」고 말할 정도였습니다.
  to: 그것은 크게 소리치고 그에게 심한 경련을 일으키게 한 뒤 나갔습니다. 그리고 그는 죽은 사람처럼 되었으며, 많은 사람이 “그가 죽었다”라고 말할 정도였습니다.
