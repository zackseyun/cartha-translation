  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
  footnotes:
  - marker: a
    text: Or 'a crowd was running together.' The Greek verb suggests people converging rapidly.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 무리가 몰려드는 것을 보시고¹ 더러운 영을 꾸짖으시며 그 영에게 말씀하셨습니다. 「말 못 하고 듣지 못하는 영아, 내가 네게 명한다. 그에게서 나와, 다시는 그에게 들어가지 마라.」
  philosophy: optimal-equivalence
