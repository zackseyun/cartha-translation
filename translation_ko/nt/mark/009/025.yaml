review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Jesus’ observation, the rebuke of the unclean spirit, the authoritative command, departure from the boy, and prohibition of reentry. However, '말 못 하고 듣지 못하게 하는 영' is causative ('a spirit that makes [someone] unable to speak and hear'), whereas the Greek directly addresses it as 'mute and deaf spirit.' The wording should not add that causative interpretation.
  naturalness: The narrative is generally natural in modern formal-polite Korean. '무리가 빠르게 모여드는' is understandable, but '무리가 몰려드는' is more idiomatic and preserves the sense of people converging rapidly. Explicitly indicating that Jesus spoke to the spirit improves clarity.
  terminology: '''더러운 영'' is the established and suitable Korean rendering of πνεῦμα ἀκάθαρτον. The direct-address expression should be revised to ''말 못 하고 듣지 못하는 영아'' to reflect the paired Greek adjectives without interpretive expansion. ''내가 네게 명한다'' appropriately conveys Jesus’ authority and the emphatic first-person subject.'
  issues:
  - severity: medium
    issue: '''말 못 하고 듣지 못하게 하는 영'' adds a causative sense not expressed by the Greek.'
    rationale: 'ἄλαλον καὶ κωφὸν modifies ''spirit'' directly: ''mute and deaf spirit.'' It does not say in this clause that the spirit causes another person’s muteness and deafness.'
  - severity: low
    issue: The rapid-convergence nuance of ἐπισυντρέχει is not fully represented by '빠르게 모여드는.'
    rationale: '''몰려드는'' more naturally conveys a crowd converging upon the scene; a footnote can preserve the literal running-together alternative.'
  - severity: low
    issue: The addressee of Jesus’ speech is only implicit in the narration.
    rationale: The Greek explicitly says that he spoke to the unclean spirit; adding '그 영에게' makes this relation clear without adding meaning.
  revised_text: 예수께서 무리가 몰려드는 것을 보시고¹ 더러운 영을 꾸짖으시며 그 영에게 말씀하셨습니다. 「말 못 하고 듣지 못하는 영아, 내가 네게 명한다. 그에게서 나와, 다시는 그에게 들어가지 마라.」
  revised_footnotes:
  - marker: '1'
    text: 또는 ‘무리가 함께 달려드는 것을.’ 그리스어 동사는 사람들이 급히 한곳으로 몰려드는 것을 나타냅니다.
    reason: ἐπισυντρέχει의 ‘함께 달려들다/몰려들다’라는 어휘적 뉘앙스를 보존합니다.
  revision_rationale: The revision corrects the unsupported causative description of the spirit, renders the crowd’s rapid convergence more naturally, explicitly retains that Jesus addressed the spirit, and supplies a footnote anchored to the relevant phrase. It preserves the Greek’s direct, authoritative command and uses modern formal-polite narration with appropriately forceful direct speech.
