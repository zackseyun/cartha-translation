translation:
  language: ko
  text: 예수께서 무리가 빠르게 모여드는 것을 보시고, 더러운 영을 꾸짖어 말씀하셨습니다. 「말 못 하고 듣지 못하게 하는 영아, 내가 너에게 명한다. 그에게서 나오고 다시는 그에게 들어가지 마라.」
  philosophy: optimal-equivalence
