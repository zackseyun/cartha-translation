  source_fidelity: 수정이 필요합니다. 초안의 ‘말 못 하고 듣지 못하게 하는 영’은 영이 사람을 그렇게 만들었다는 인과를 덧붙이며, 본문의 ‘말 못 하고 듣지 못하는 영’이라는 직접 호칭을 정확히 반영하지 못합니다. 또한 마지막 명령의 ‘마라’는 지정된 현대 합쇼체 문체와 맞지 않습니다.
  naturalness: ‘무리가 빠르게 모여드는 것’은 자연스럽습니다. 다만 서술과 직접 화법을 모두 현대 표준어 합쇼체로 일관되게 정리하고, 명령의 권위는 ‘명령합니다’ 및 의무·금지 표현으로 보존하는 편이 적절합니다.
  terminology: πνεῦμα ἀκάθαρτον은 복음서의 관용적·의미론적 범주를 보존하도록 ‘부정한 영’으로 옮겼습니다. ‘말 못 하고 듣지 못하는 영’은 ἄλαλον καὶ κωφὸν을 각각 보존합니다.
  issues:
  - severity: high
    issue: ‘말 못 하고 듣지 못하게 하는 영’이 원문의 호칭을 인과적 표현으로 바꿈
    rationale: ἄλαλον καὶ κωφὸν은 영을 ‘말 못 하고 듣지 못하는’ 것으로 부르는 표현입니다. ‘~하게 하는’은 본문에 없는 인과 관계를 명시합니다.
  - severity: medium
    issue: 직접 명령 ‘들어가지 마라’가 목표 문체인 현대 합쇼체와 불일치
    rationale: 번역의 지정 문체가 현대 formal-polite 합쇼체이므로, 직접 화법도 같은 문체로 정리해야 합니다.
  - severity: low
    issue: ἐπισυντρέχει의 신속한 집중 의미에 대한 주석이 없음
    rationale: ‘빠르게 모여드는’은 적절하지만, ‘달려 함께 모여들다’라는 가능한 어휘적 뉘앙스를 주석으로 제시하면 본문의 선택지를 투명하게 보여 줍니다.
  revised_text: 예수께서 무리가 빠르게 모여드는 것을 보시고, 부정한 영을 꾸짖으며 그에게 말씀하셨습니다. “말 못 하고 듣지 못하는 영아, 내가 네게 명령합니다. 그에게서 나와야 합니다. 다시는 그에게 들어가서는 안 됩니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “무리가 달려 함께 모여들고 있었다.” 그리스어 동사는 사람들이 빠르게 한곳으로 모여드는 모습을 나타냅니다.
    reason: lexical_alternative
  revision_rationale: 원문의 ‘부정한 영’과 ‘말 못 하고 듣지 못하는 영’이라는 호칭을 보존하고, 영이 장애를 유발한다는 추가 해석을 제거했습니다. 예수의 직접적 권위를 ‘내가 네게 명령합니다’로 유지하면서, 모든 문장을 현대 표준어 합쇼체로 통일했습니다. 무리가 급히 모여드는 동사의 어휘적 대안은 주석으로 보완했습니다.
