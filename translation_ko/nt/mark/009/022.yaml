  language: ko
  text: 그리고 그 영이 그를 죽이려고 여러 번이나 불 속에도, 물 속에도 던졌습니다. 그러나 만일 무엇이든 하실 수 있으시다면, 저희를 불쌍히 여기시고 도와주십시오.
