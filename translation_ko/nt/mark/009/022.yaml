  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
  footnotes:
  - marker: a
    text: Or 'into the water.' Greek has the plural 'into waters.'
    reason: lexical_alternative
  - marker: b
    text: Or 'moved with compassion toward us' or 'having mercy on us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 영이 그를 죽이려고 여러 번 불 속에도, 물 속에도 던졌습니다. 그러나 만일 무엇이든 하실 수 있으시다면, 저희를 불쌍히 여기시고 도와주십시오.」
  philosophy: optimal-equivalence
