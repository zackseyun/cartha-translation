    text: 또는 “여러분이 메시아께 속한 이들이기 때문에.”
    reason: alternative_reading
  revision_rationale: The revision accurately renders the relation expressed by χριστοῦ ἐστε as belonging to the Messiah, retains the source phrase ἐν ὀνόματι through "…이라는 이름으로," and supplies a footnote for the natural causal sense. It also removes the added concessive force of "이라도" while preserving the emphatic negation "결코 … 잃지 않을 것입니다."
