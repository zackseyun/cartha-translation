revisions:
- from: 누구든지 여러분이 메시아의 사람이라는 이름으로 여러분에게 물 한 잔이라도 마시게 한다면, 진실로 내가 여러분에게 말합니다. 그는 결코 자기 상을 잃지 않을 것입니다.
  to: 누구든지 여러분이 메시아께 속한 이들이라는 이름으로 여러분에게 물 한 잔을 마시게 해 주면, 내가 진실로 여러분에게 말합니다. 그 사람은 자기 상을 결코 잃지 않을 것입니다.[a]
  rationale: The revision accurately renders the relation expressed by χριστοῦ ἐστε as belonging to the Messiah, retains the source phrase ἐν ὀνόματι through "…이라는 이름으로," and supplies a footnote for the natural causal sense. It also removes the added concessive force of "이라도" while preserving the emphatic negation "결코 … 잃지 않을 것입니다."
