  to: 만일 발이 여러분을 걸려 넘어지게 한다면, 그것을 잘라 버리십시오. 두 발을 가진 채 게헨나에 던져지는 것보다, 다리를 절며 생명에 들어가는 것이 여러분에게 더 낫습니다.[a]
