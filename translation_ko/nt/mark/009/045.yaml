  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
  footnotes:
  - marker: a
    text: 'Or: “hell.” The Greek term is Gehenna, evoking the Valley of Hinnom and its associations with divine judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 만일 발이 여러분을 걸려 넘어지게 한다면, 그것을 잘라 버리십시오. 두 발을 가진 채 게헨나에 던져지는 것보다, 다리를 절며 생명에 들어가는 것이 여러분에게 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지옥’. 그리스어 ‘게헨나’는 힌놈 골짜기와 하나님의 심판에 관련된 연상을 불러일으키는 말입니다.
    reason: alternative_reading
