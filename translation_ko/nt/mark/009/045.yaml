review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the conditional warning, the concrete imperative to cut off the foot, the contrast between entering life and being thrown into Gehenna, and the comparative force of καλόν. However, ‘발이 잘린 채로’ translates the result of the preceding command rather than χωλόν, which specifically denotes being lame. The source’s singular second-person address is suitably expressed idiomatically in Korean as a general address.
  naturalness: The draft is generally clear in modern formal-polite Korean. ‘두 발을 가지고’ is understandable but less idiomatic than ‘두 발을 가진 채,’ and ‘다리를 절며’ naturally conveys entering life lame.
  terminology: ‘게헨나’ appropriately preserves γέεννα rather than prematurely equating it in the main text with ‘지옥.’ A footnote should be anchored to explain the familiar alternative and the term’s historical/judgment associations.
  issues:
  - severity: medium
    issue: ‘발이 잘린 채로’ renders χωλόν too narrowly and concretely.
    rationale: χωλός means ‘lame,’ not ‘with a foot cut off.’ Although the imperative calls for cutting off the foot, the comparison itself describes entering life lame. ‘다리를 절며’ preserves that wording and its implication without replacing it with a different bodily description.
  - severity: low
    issue: No footnote anchor or Korean footnote is supplied for ‘게헨나.’
    rationale: The English audit trail retains Gehenna in the text and supplies an explanatory alternative (‘hell’). Anchoring an equivalent Korean note preserves source-specific terminology while assisting readers.
