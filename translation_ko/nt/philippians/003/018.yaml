  source_fidelity: 핵심 어휘와 의미는 대체로 충실합니다. 그러나 원문의 관계절(‘내가 그들에 관하여 여러분에게 여러 번 말했고, 지금도 울며 말하는’)이 한국어 초안에서는 뒤에 독립 문장으로 분리되어, 무엇을 ‘말하는지’가 불완전하게 남습니다. 또한 περιπατοῦσιν은 이 문맥에서 삶의 행실을 가리키므로 ‘걸어가고’보다 ‘살아가고’가 현대 한국어에서 더 정확하고 자연스럽습니다.
  naturalness: ‘왜냐하면 … 때문입니다’의 중복 인과 표현과 ‘원수로 걸어가고’는 현대 격식체 한국어에서 다소 부자연스럽습니다. 원문의 삽입적 관계절을 ‘… 말하는 바와 같이’로 처리하면 문장이 완결되고 자연스럽습니다.
  terminology: ‘메시아’, ‘십자가’, ‘원수’는 적절합니다. Χριστός를 칭호로 보아 ‘메시아’로 옮긴 선택도 제시된 프로젝트 방침 및 원문에 부합합니다. 각주 표지는 본문 ‘메시아’에 유지해야 합니다.
