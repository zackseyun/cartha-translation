revisions:
- from: 내가 이미 그것을 얻었다거나[a] 이미 온전해졌다는[b] 말이 아닙니다. 다만, 내가 메시아 예수께[c] 붙잡힌 바 그것을 나 또한 붙잡으려고 좇아갑니다.
  to: 내가 이미 그것을 얻은 것도 아니고[a] 이미 온전하게 된 것도 아닙니다[b]. 그러나 그리스도께서[c] 나를 붙잡으신 바로 그것을 나도 붙잡으려고 힘써 나아갑니다.
  rationale: 원문에 없는 ‘예수’를 삭제하고 Χριστοῦ를 ‘그리스도’로 옮겼습니다. ‘그리스도께서 나를 붙잡으신 바로 그것’은 ἐφ’ ᾧ의 목적 지향성을 드러내며, ‘붙잡으려고 … 붙잡으신’은 καταλάβω와 κατελήμφθην의 어휘적 연결과 후자의 수동성을 보존합니다. ‘온전하게 된’은 τετελείωμαι의 완료된 상태를 표현하되 특정 교리 체계를 본문에 부과하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:41:37Z'
