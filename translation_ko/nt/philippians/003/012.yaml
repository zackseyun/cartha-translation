  source_fidelity: 수정이 필요합니다. 초안은 Χριστοῦ에 없는 ‘예수’를 보충하여 원문을 확장하며, ‘메시아 예수’는 본문의 단순한 속격 Χριστοῦ를 충실히 반영하지 못합니다. 또한 ‘붙잡힌 바 그것’은 현대 한국어에서 지시 관계가 불분명하고 어색합니다. 수정안은 καταλάβω/κατελήμφθην의 반복을 ‘붙잡다’로 유지하고, ἐφ’ ᾧ의 목적 지향성을 ‘바로 그것’으로 나타냅니다.
  naturalness: ‘좇아갑니다’와 ‘붙잡힌 바 그것’은 현대 표준어 합쇼체 산문에서 다소 고풍스럽고 결속이 약합니다. ‘붙잡으려고 힘써 나아갑니다’ 및 ‘그리스도께서 나를 붙잡으신 바로 그것’은 자연스럽고 의미 관계가 분명합니다.
  terminology: Χριστός는 이 절에서 원문처럼 ‘그리스도’로 옮기고 ‘메시아’는 대안 각주로 둡니다. τετελείωμαι는 완료 수동의 결과 상태를 과도한 교리적 해석 없이 ‘온전하게 된’으로 번역합니다.
