  to: 열심으로 말하면 회중을 박해하였고, 율법 안에서의 의[a][b]로 말하면 흠 없는 사람이 되었습니다.
  rationale: 원문의 두 κατὰ 구문을 「~으로 말하면」으로 병렬 처리하고, διώκων을 유한 과거 동사 「박해하였고」로 자연스럽게 연결했습니다. 「율법 안에서의 의」에 두 각주를 직접 붙여 어휘 대안과 범위 설명의 대상을 명확히 했습니다. ‘흠 없음’은 율법 안에서의 의라는 한정 아래 제시하여 절대적 무죄라는 오해를 피하되, 본문에 해석을 과도하게 첨가하지 않았습니다.
