  to: 그뿐 아니라, 내 주 메시아 예수[b]를 아는 지식의 탁월함[a] 때문에 나는 모든 것을 손실로 여깁니다. 나는 그분을 위하여 모든 것을 잃었으며, 메시아를 얻고자 그것들을 배설물[c]로 여깁니다.
