  source_fidelity: 개정이 필요합니다. 초안의 두 번째 절 「육체를 신뢰할 만하다 여긴다면」은 육체 자체가 신뢰할 만하다고 평가한다는 뜻이 되어, ἐν σαρκί와 πεποιθέναι가 가리키는 ‘육체 안에서/육체에 근거하여 자신감을 둘 근거’를 정확히 반영하지 못합니다. 이를 「육체 안에서 신뢰할 근거가 있다고 여긴다면」으로 고칩니다. 첫 절도 ἐν σαρκί를 「육체 안에서」로 일관되게 옮기고, καίπερ의 양보를 자연스러운 한국어로 나타냈습니다.
  naturalness: 「비록 … 가지고 있기는 합니다」는 문맥상 앞 절에 이어지는 양보를 유지하면서도 합쇼체 문장으로 자연스럽습니다. 「다른 누가」와 「나는 더욱 그렇습니다」는 바울의 비교적 수사 표현을 간결하게 보존합니다.
