review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 「함께 나를 본받는 자가 되십시오」는 Συμμιμηταί μου γίνεσθε의 공동적 본받음과 명령을 잘 전달합니다. 그러나 두 번째 문장은 καθὼς ἔχετε τύπον ἡμᾶς가 「그렇게 걷는 자들」을 규정하는 비교절임을 더 분명히 드러낼 필요가 있습니다. 「우리를 본보기로 삼은 그대로 그렇게」는 수식 관계가 불명확하고 ‘그대로/그렇게’가 중복됩니다.
  naturalness: 「그렇게 걷는 자들」은 원어의 비유를 보존하지만 현대 한국어에서는 삶의 방식을 뜻하는 「그렇게 살아가는 이들」이 더 자연스럽습니다. 「여러분이 우리를 본보기로 삼고 있는 것처럼」으로 비교 관계를 명료하게 했습니다.
  terminology: 「형제 여러분」, 「본받다」, 「본보기」는 적절합니다. ἡμᾶς의 복수는 「우리」로 유지했습니다. ἀδελφοί의 포괄적 회중 호칭 가능성은 본문을 바꾸지 않고 각주에서 밝혔습니다.
  issues:
  - severity: medium
    issue: 비교절의 수식 관계가 불명확함
    rationale: καθὼς ἔχετε τύπον ἡμᾶς는 ‘여러분이 우리를 본보기로 가지고 있는 것처럼’이라는 비교로서, 그런 방식으로 살아가는 사람들을 살피라는 명령을 규정합니다. 초안의 「우리를 본보기로 삼은 그대로 그렇게 걷는 자들」은 누가 누구를 본보기로 삼는지와 비교의 범위가 자연스럽게 파악되지 않습니다.
  - severity: low
    issue: 「그대로 그렇게」의 중복
    rationale: καθὼς와 οὕτως를 각각 직역하려다 한국어에서 불필요한 중복이 생겼습니다. 비교절을 명료한 문장으로 재구성하면 두 요소의 의미를 자연스럽게 보존할 수 있습니다.
