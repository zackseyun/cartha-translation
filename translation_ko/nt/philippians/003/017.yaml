revisions:
- from: 형제 여러분[a], 함께 나를 본받는 자가 되십시오. 또 우리를 본보기[b]로 삼은 그대로 그렇게 걷는 자들을 눈여겨보십시오.
  to: 형제 여러분[a], 함께 나를 본받는 자가 되십시오. 또 여러분이 우리를 본보기[b]로 삼고 있는 것처럼 그렇게 살아가는 이들을 눈여겨보십시오.
  rationale: 비교절 「여러분이 우리를 본보기로 삼고 있는 것처럼」을 명시하여 원문의 문장 관계와 ἡμᾶς의 복수를 분명히 했습니다. περιπατέω의 삶의 방식이라는 비유적 뜻은 현대 한국어의 자연스러운 표현인 「살아가다」로 옮겼으며, 공동적 본받음과 합쇼체 명령은 유지했습니다.
  reviewer_model: gpt-5.6-terra
