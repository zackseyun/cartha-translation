  rationale: 현대 한국어의 자연스러운 합쇼체를 유지하면서도, ταπείνωσις의 비천함, σύμμορφον의 강한 상응(「같은 모습이 되도록」), ἐνέργεια의 유효한 작용, 그리고 능력의 내용인 만물의 복종을 보존했습니다. 각주는 본문 밖의 부활 메커니즘이나 특정 교리적 설명을 덧붙이지 않고 문자적·구문적 대안만 제시하도록 정리했습니다.
