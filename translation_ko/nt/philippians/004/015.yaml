    rationale: 원문은 어느 회중도 바울과 ‘주고받는 일’에 관하여 참여/협력하지 않았다고 말합니다. 「나와 함께 참여한」으로 고치면 해당 사안에 관련된 참여를 명시하면서도 ‘재정 후원’으로 과도하게 한정하지 않습니다.
  - severity: low
