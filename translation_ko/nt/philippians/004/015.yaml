    rationale: ἐν ἀρχῇ τοῦ εὐαγγελίου의 시기적 표현은 「복음의 처음에」로 간결하게 옮길 수 있으며, 복음 자체의 시작인지 복음 사역의 초기인지에 관한 해석적 확장을 피할 수 있습니다.
