review_pass:
  verdict: revise
  source_fidelity: 초안은 οἶδα의 반복, 네 부정사의 두 짝, 그리고 μεμύημαι의 비유적 ‘비결을 터득함’을 대체로 잘 반영합니다. 다만 「풍성히 가지는 법」은 περισσεύειν을 소유 행위로 다소 좁히며 한국어로도 어색합니다. 또한 첫 각주의 표제형 「ταπεινόομαι」는 본문의 동사 ταπεινοῦσθαι의 표제형으로 정확하지 않습니다.
  naturalness: 「낮추어지는 법」과 「풍성히 가지는 법」은 현대 표준 한국어에서 다소 부자연스럽습니다. 「낮은 처지에 놓이는 법」과 「풍족하게 지내는 법」은 외적 형편의 낮음 및 풍요를 자연스럽게 전달합니다. 마지막 열거는 「곧」으로 앞의 ‘비결’을 풀어 주면 한국어 문장 구조가 명료해집니다.
  terminology: 「비결을 터득했습니다」는 μεμύημαι의 문맥상 비유를 자연스럽게 옮기며, 입문 어휘의 문자적 배경은 각주로 보존하는 것이 적절합니다. 각주의 그리스어 표제형은 ταπεινόω로 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: 「풍성히 가지는 법」
    rationale: περισσεύειν은 여기서 넉넉하거나 풍족한 처지에 있는 것을 뜻하며, ‘가지다’는 소유에 초점을 맞추어 의미를 다소 제한하고 자연스러움도 떨어집니다.
  - severity: medium
    issue: 각주 a의 표제형 「ταπεινόομαι」
    rationale: 본문의 ταπεινοῦσθαι는 ταπεινόω의 현재 중간/수동 부정사입니다. 제시된 표제형은 정확하지 않습니다.
  - severity: low
    issue: 「낮추어지는 법」의 어색한 결합
    rationale: 수동적 외적 낮아짐을 보존하려는 의도는 좋으나, ‘낮은 처지에 놓이다’가 현대 한국어에서 더 자연스럽고 문맥에도 잘 맞습니다.
  revised_text: 나는 낮은 처지에 놓이는 법도 알고 풍족하게 지내는 법도 압니다. 나는 모든 일과 모든 상황에서 그 비결을 터득했습니다. 곧 배부르게 먹는 법과 굶주리는 법, 풍족하게 지내는 법과 궁핍을 겪는 법입니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 ταπεινόω의 현재 중간·수동 부정사는 「낮아지다」 또는 「낮은 처지에 놓이다」를 뜻한다. 여기서는 겸손이라는 내적 태도보다 궁핍이나 고난과 같은 외적 형편의 낮음을 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 περισσεύω는 「풍족하게 지내다」, 「넘치다」를 뜻한다. 단순히 부유함만을 가리키는 말보다 넓은 표현이다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 「(비밀 의식에) 입문하였다」(μεμύημαι)이다. 바울은 입문 어휘를 비유적으로 사용하여, 여러 형편에서 살아가는 비결을 터득했음을 표현한다.
    reason: lexical_alternative
  revision_rationale: ‘풍성함’의 의미를 소유로 좁히지 않고 처지의 넉넉함으로 옮겼으며, 수동적 낮아짐은 자연스러운 한국어 표현으로 다듬었습니다. 각주 a의 그리스어 표제형을 정확히 수정했습니다. 문장 끝의 네 항목은 μεμύημαι가 설명하는 내용이므로 「곧」으로 연결하여 원문의 구조와 의미를 유지했습니다.
