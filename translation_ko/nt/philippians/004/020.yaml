  source_fidelity: 그리스어의 송영 구조(‘우리의 하나님과 아버지께 영광이 … 있기를’)와 무한한 기간의 관용구를 전반적으로 잘 반영합니다. 다만 ‘영광이 영원무궁하기를’은 영광 자체가 영원무궁하다는 서술처럼 들리며, 기간을 나타내는 εἰς 구문의 기능이 다소 불분명합니다.
  naturalness: ‘우리 하나님이시며 아버지께’는 한국어에서 수식 관계가 다소 어색합니다. 한 분을 가리키는 통상적이고 자연스러운 송영 표현인 ‘우리 하나님 아버지께’를 쓰고, 기간 부사어를 ‘영원무궁토록’으로 처리하는 것이 더 자연스럽습니다.
  terminology: ‘하나님 아버지’, ‘영광’, ‘아멘’은 적절합니다. ‘영원무궁’은 한국어 교회 송영에서 널리 쓰이는 표현이므로 사용할 수 있습니다. 각주의 ‘직역하면 세세토록’은 엄밀한 직역이라기보다 전통적 관용 번역이므로 표현을 조정해야 합니다.
