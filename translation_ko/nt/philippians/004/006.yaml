    rationale: τὰ αἰτήματα ὑμῶν은 ‘여러분의 요청들’이라는 뜻입니다. 「여러분의 요청」은 원문의 구체적 청원이라는 뜻을 자연스럽게 전달합니다.
  - severity: low
    issue: 각주 a가 본문 이상의 해석을 덧붙입니다.
    rationale: μετ’ εὐχαριστίας는 ‘감사와 함께/감사함으로’이지만, ‘늘’이라는 시간적 강조는 헬라어 본문에 명시되지 않습니다.
