  text: Nevertheless, you did well by sharing in my affliction.
translation:
  language: ko
  text: 그렇기는 하나, 여러분이 나의 환난을 함께 나눈 것은[a] 잘하신 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「나의 환난에 함께 참여한 것은」.
