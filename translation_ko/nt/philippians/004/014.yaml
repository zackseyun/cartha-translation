    text: 또는 「나의 환난에 함께 참여한 것은」.
    reason: lexical_alternative
  revision_rationale: 본문의 부드러운 대조(πλὴν), 긍정적 평가(καλῶς ἐποιήσατε), 그리고 바울의 환난에 함께 참여한 관계적 의미(συγκοινωνήσαντές μου τῇ θλίψει)를 유지했습니다. 해석적으로 과도한 기존 각주는 중립적인 번역 대안으로 교체했습니다.
