  to: 그리고 모든 이해를 뛰어넘는 하나님의 평강이 메시아 예수[a] 안에서 여러분의 마음과 생각을 지켜 줄 것입니다.
  rationale: 원문의 비조건적 접속사 καί를 「그리고」로 보존하고, νοῦς의 문맥상 인지·이해 의미를 현대적으로 분명히 하기 위해 「모든 지각」을 「모든 이해」로 고쳤습니다. 그 밖의 문구와 메시아 칭호 번역은 유지했습니다. 각주는 본문에 직접 관련된 어휘 대안만 간결하게 제시하도록 정리했습니다.
