review_pass:
  verdict: revise
  source_fidelity: 문장의 주요 관계와 범위는 원문에 충실합니다. αὐταῖς를 앞 절의 유오디아와 순두게를 가리키는 「이 여인들」로 밝힌 것, 그리고 γυνα이들이 바울뿐 아니라 글레멘드 및 다른 συνεργοί와 함께 복음 안에서 힘썼다는 구조를 잘 반영합니다. 다만 συναθλέω는 실제 전투를 뜻하기보다 함께 경기하며 분투한다는 비유를 지니므로 「싸운」보다 「분투한」이 원문의 어휘적 범위를 더 정확하게 보존합니다. Κλήμης의 한국어 성경 전통 표기는 「글레멘드」가 더 적절합니다.
  naturalness: 합쇼체의 청원과 명령은 자연스럽습니다. 다만 「그대에게도 부탁합니다」는 문학적 호칭인 「그대」와 현대 공적 문체가 다소 섞여 보이므로, 호격 뒤에 목적어를 생략한 「참된 동역자여, 또한 부탁합니다」가 더 매끄럽습니다. 「그들은 … 자들이며」도 자연스럽지만, 「그들은 … 분투한 이들이며」가 문맥상 더 현대적입니다.
  terminology: 「동역자」, 「복음 안에서」, 「생명책」은 적절합니다. γνήσιε σύζυγε의 은유와 고유명사 가능성을 각주에 남기는 것도 바람직합니다. 다만 고유명사 음역 「수쥐고스」는 그리스어 Σύζυγος에 더 가까운 「쉬쥐고스」로 바로잡고, 현대 학술·공적 문체에 맞추어 「헬라어」는 「그리스어」로 고칩니다.
  issues:
  - severity: medium
    issue: Κλήμεντος를 「글레멘스」로 표기함
    rationale: 한국어 성경 전통 및 통용 인명 표기에서는 이 인명을 「글레멘드」로 표기하는 것이 더 적절합니다.
  - severity: medium
    issue: συναθλέω를 「나와 함께 싸운」으로 번역함
    rationale: 원어는 함께 경기에 참여하고 분투한다는 비유적 표현입니다. 「싸운」은 무력 충돌을 지나치게 전면화할 수 있으므로 「나와 함께 분투한」이 더 충실합니다.
  - severity: low
    issue: 각주의 그리스어 명칭 및 고유명사 음역
    rationale: 현대 표준 학술 문체에서는 「그리스어」가 적절하며, Σύζυγος의 음역은 「쉬쥐고스」가 더 가깝습니다.
  - severity: low
    issue: 「그대에게도 부탁합니다」의 문체 혼합
    rationale: 「그대」는 현대 합쇼체 공적 문체에서 다소 문학적으로 들립니다. 목적어를 생략해도 원문의 직접 호소와 존중의 어조가 유지됩니다.
  revised_text: 그렇습니다. 참된 동역자[a]여, 또한 부탁합니다. 이 여인들을 도와주십시오. 그들은 글레멘드와 그 밖의 나의 동역자들과 더불어 복음 안에서 나와 함께 분투한 이들이며, 그들의 이름은 생명책에 있습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「참된 멍에의 동무」(직역). 그리스어 σύζυγος는 「같은 멍에를 지고 함께 일하는 사람」을 뜻하며, 일부는 이를 고유명사 「쉬쥐고스」로 보기도 한다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 συναθλέω는 운동 경기에서 「함께 겨루다」를 뜻하므로 「나와 함께 힘쓴」 또는 「나와 함께 애쓴」으로도 옮길 수 있다.
    reason: lexical_alternative
  revision_rationale: 인명 표기를 한국어 성경 전통에 맞추고, συναθλέω의 경기·분투 비유를 보존하도록 표현을 조정했습니다. 또한 현대 표준어 합쇼체에 맞게 호소문의 문체를 다듬고, 각주의 그리스어 명칭과 음역을 정정했습니다. 원문과 영어 감사 기록이 보존한 σύζυγος의 해석상 불확실성은 각주에 그대로 유지했습니다.
