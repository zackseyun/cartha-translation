review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 문장 관계는 대체로 충실합니다. 다만 Κλήμεντος는 그리스어 자음 κ에 따라 「클레멘스」로 옮기는 것이 원문 음가 및 현대 표기 관행에 더 맞습니다. συναθλέω의 비유적 경기 이미지는 본문의 「분투한」과 각주로 무리 없이 보존할 수 있습니다.
  naturalness: 초안의 「그들은 … 싸운 자들이며」는 현대 한국어에서 다소 경직되고, 사역 맥락에서 실제 싸움으로 읽힐 여지가 있습니다. 「복음 안에서 나와 함께 분투한 이들이며」가 자연스럽고 원문의 분투·경쟁 함의를 유지합니다. 호격 「그대」는 성경 문체상 가능하므로 유지했습니다.
  terminology: 「참된 동역자」, 「복음 안에서」, 「동역자들」, 「생명책」은 적절합니다. 다만 고유명사 「글레멘스」는 「클레멘스」로 바로잡아야 합니다. 각주의 고유명사 대안도 그리스어 음역에 맞추어 「쉬쥐고스」로 정리했습니다.
  issues:
  - severity: medium
    issue: Κλήμεντος를 「글레멘스」로 표기함
    rationale: 그리스어 Κλήμεντος의 κ는 현대 한국어 음역에서 일반적으로 「ㅋ」으로 옮깁니다. 「클레멘스」가 원문 음가에 더 충실하며, 초안의 근거에서 언급한 전통 표기도 본문 표기와 일치하지 않습니다.
  - severity: low
    issue: 「나와 함께 싸운 자들」의 표현
    rationale: συναθλέω는 함께 경쟁하고 분투한다는 경기 비유를 지니지만, 한국어 「싸우다」는 물리적·군사적 전투를 강하게 연상시킬 수 있습니다. 「분투한」이 문맥과 현대 용법에서 더 자연스럽고, 관련 이미지는 각주가 보완합니다.
  revised_text: 그렇습니다. 참된 동역자[a]여, 그대에게도 부탁합니다. 이 여인들을 도와주십시오. 그들은 클레멘스와 그 밖의 나의 동역자들과 함께 복음 안에서 나와 함께 분투한 이들이며, 그들의 이름은 생명책에 있습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「참된 멍에의 동무」(직역). 헬라어 σύζυγος는 「같은 멍에를 지고 함께 일하는 사람」을 뜻하며, 일부는 이를 고유명사 「쉬쥐고스」로 보기도 한다.
    reason: alternative_reading
  - marker: b
    text: 헬라어 συναθλέω는 운동 경기에서 「함께 겨루다」를 뜻하므로 「나와 함께 겨루었다」, 「나와 함께 힘써 일했다」로도 옮길 수 있다.
    reason: lexical_alternative
  revision_rationale: 고유명사 Κλήμεντος를 원문 음가에 맞게 「클레멘스」로 교정했습니다. 또한 συναθλέω를 「분투한」으로 옮겨 원문의 경쟁·분투 이미지를 유지하면서도 현대 한국어에서 「싸운」이 낳을 수 있는 불필요한 전투적 오해를 줄였습니다. 각주는 대안 해석과 어휘 범위를 보존합니다.
