  source_fidelity: Ἀσπάσασθε의 서신 종결부 인사 명령을 「안부를 전해 주십시오」로, πάντα ἅγιον의 분배적 단수 용법을 「모든 성도」로 적절히 옮겼습니다. 「메시아 예수 안에 있는」은 ἐν Χριστῷ Ἰησοῦ를 충실히 반영하며, οἱ σὺν ἐμοὶ ἀδελφοί도 「나와 함께 있는 형제들」로 정확하게 전달합니다.
