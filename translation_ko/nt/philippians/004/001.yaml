  - severity: low
    issue: 마지막 ‘사랑하는 자들이여’의 배치
    rationale: 원문은 명령 뒤에 마지막 ἀγαπητοί를 두어 애정 어린 호명을 반복합니다. 한국어에서도 명령 뒤에 ‘사랑하는 여러분’을 배치하면 반복과 강조를 더 잘 살릴 수 있습니다.
