revisions:
- from: 그러므로 나의 사랑하고 사모하는 형제 여러분[a], 나의 기쁨이요 면류관[b]인 여러분, 사랑하는 자들이여, 이와 같이 주 안에 굳게 서십시오.
  to: 그러므로 내가 사랑하고 그리워하는 형제 여러분[a], 여러분은 나의 기쁨이요 면류관[b]입니다. 사랑하는 여러분, 이와 같이 주 안에 굳게 서십시오.
  rationale: 안전한 문법 교정과 문체 정돈이 필요합니다. 수정문은 ὥστε의 결론적 연결, ἀγαπητοὶ와 ἐπιπόθητοι의 애정 어린 이중 호명, χαρὰ καὶ στέφανός μου의 동격, οὕτως의 지시성, ἐν κυρίῳ의 관계적 표현, 그리고 마지막 ἀγαπητοί의 반복을 보존합니다. 원문의 성별 표지와 회중 전체를 향한 문맥은 기존 영어 POB 방침에 따라 본문의 ‘형제’와 각주를 통해 함께 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:41:37Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 호격 연쇄(‘사랑하는/그리워하는 형제들’), ‘나의 기쁨과 면류관’이라는 동격, 그리고 마지막 ‘사랑하는 이들이여’의 반복을 모두 보존해야 합니다. 초안은 핵심 의미를 대체로 충실히 옮겼으나, 첫 호격의 ‘나의 사랑하고 사모하는’은 한국어 문법상 자연스럽지 않고, 마지막 호격이 명령문 앞에 놓여 원문의 수사적 배치가 다소 흐려집니다.
  naturalness: ‘내가 사랑하고 그리워하는 형제 여러분’ 및 ‘사랑하는 여러분’은 현대 표준어 합쇼체에서 자연스럽고 따뜻한 회중 호명입니다. 두 문장으로 나누어 동격 관계와 명령을 명료하게 제시했습니다.
  terminology: ‘주 안에’, ‘굳게 서십시오’, ‘면류관’은 바울 서신의 정착된 신학·교회 용어로 적절합니다. 각주의 ‘헬라어’는 현대 학술 한국어에 맞추어 ‘그리스어’로, ‘문법성’은 ‘문법적 성’으로 다듬었습니다. στέφανος의 경기 우승 화관이라는 뉘앙스도 유지했습니다.
  issues:
