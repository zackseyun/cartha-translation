  to: 나는 모든 것을 다 받았고[a] 풍족합니다. 에바브로디도에게서 여러분이 보내신 것을 받아 충분히 공급받았습니다. 그것은 향기로운 냄새요, 하나님께서 받아들이실 만한 제물이며, 하나님께서 기뻐하시는 것입니다.
  rationale: 원문의 반복되는 ‘받다’ 표현과 풍족함·충족됨의 점층을 보존하되, 한국어에서 자연스럽게 이해되도록 πεπλήρωμαι를 ‘충분히 공급받았습니다’로 옮겼습니다. 제사적 삼중 묘사(향기로운 냄새, 받아들여질 제물, 하나님께 기쁨이 됨)도 유지했습니다. 각주는 ἀπέχω의 상업적 가능성을 보존하면서도 특정 해석을 본문 의미로 단정하지 않도록 조정했습니다.
