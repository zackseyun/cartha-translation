review_pass:
  verdict: revise
  source_fidelity: 대조 구문과 ‘구하다’의 반복, ‘열매’ 비유는 대체로 잘 반영되었습니다. 그러나 ‘계좌’는 λόγος의 회계·장부 은유를 현대의 실제 은행 계좌로 지나치게 구체화합니다. 또한 각주의 ‘영적 유익’ 설명은 본문이 명시하지 않는 해석을 덧붙입니다.
  naturalness: ‘여러분의 حساب에 더해져 가는 열매’는 회계 비유와 증가의 뜻을 함께 자연스럽게 전달합니다. 두 번째 ‘내가’를 생략하면 한국어 문장이 더 매끄러우면서도 그리스어의 반복된 동사는 유지됩니다.
  terminology: δόμα는 ‘선물’, καρπός는 ‘열매’, ἐπιζητῶ는 ‘구하다’로 적절합니다. εἰς λόγον ὑμῶν은 ‘여러분의 حساب에’로 옮겨 회계적 비유를 보존하되, 구체적인 ‘계좌’라는 표현은 피하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘계좌’가 회계 은유를 실제 은행 계좌로 과도하게 구체화함
    rationale: λόγος는 이 문맥에서 حساب·결산을 가리키는 비유적 회계 용어입니다. ‘계좌’도 가능한 의역이지만 현대 금융기관의 계좌를 강하게 연상시켜 원문의 폭을 좁힙니다.
  - severity: medium
    issue: 각주의 ‘그들 자신의 영적 유익’이 해석을 첨가함
    rationale: 본문은 열매가 그들의 حساب에 증가한다고 말하지만, 그것을 특정한 방식으로 ‘영적 유익’이라고 풀이하지는 않습니다. 논쟁 여지 없는 회계 비유 설명으로 제한해야 합니다.
  revised_text: 내가 선물을 구하는 것이 아닙니다. 도리어 여러분의 حساب에 더해져 가는 열매를 구합니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 「여러분의 셈을 향하여」 또는 「여러분의 حساب에」입니다. 여기서 ‘셈’은 회계상의 حساب을 가리키는 비유입니다.
    reason: lexical_alternative
  revision_rationale: ‘계좌’를 ‘حساب’으로 바꾸어 λόγος의 회계·결산 비유를 유지하면서 현대 은행 계좌라는 불필요한 구체화를 피했습니다. 또한 해석적 신학 설명을 삭제하고, 원문이 명시하는 회계 비유만 각주에서 설명했습니다. ‘더해져 가는’은 πλεονάζοντα의 지속적인 증가를 나타냅니다.
