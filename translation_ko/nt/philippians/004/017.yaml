review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 반복된 ἐπιζητῶ(‘구하다’)는 대체로 잘 반영되었습니다. 그러나 ‘계좌’는 현대의 은행 계좌를 지나치게 구체적으로 연상시켜, λόγος의 장부·계산 비유를 좁힐 수 있습니다. ‘계정’이 이 문맥의 회계적 비유를 더 적절히 보존합니다.
  naturalness: ‘제가 선물을 구하는 것이 아닙니다. 오히려 … 열매를 구합니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 반복과 대조를 명료하게 드러냅니다.
  terminology: ‘열매’는 καρπός의 비유를 보존합니다. ‘계정’은 εἰς λόγον ὑμῶν의 회계·결산적 표현을 현대 한국어로 무리 없이 전달합니다. 기존 각주의 ‘영적 유익’ 해설은 본문이 직접 명시하지 않는 신학적 구체화를 하므로 제거하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘계좌’는 λόγος의 의미를 은행 계좌로 과도하게 한정합니다.
    rationale: 이 문맥의 λόγος는 특히 주고받음의 장부, حساب, 계산을 가리키는 상업적 비유입니다. ‘계정’은 회계적 함의를 유지하면서 현대 은행 계좌라는 불필요한 구체화를 피합니다.
  - severity: medium
    issue: 각주가 ‘그들 자신의 영적 유익’이라고 해석을 확정합니다.
    rationale: 본문은 열매가 그들의 حساب에 증가한다는 회계 비유를 사용하지만, 그것을 특정한 방식의 ‘영적 유익’으로 명시하지는 않습니다. 각주는 비유의 범위를 보존해야 합니다.
  revised_text: 제가 선물을 구하는 것이 아닙니다. 오히려 여러분의 계정에 더해지는 열매를 구합니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 “여러분의 حساب으로” 또는 “여러분의 셈으로”입니다. 회계·결산의 비유적 표현입니다.
    reason: lexical_alternative
  revision_rationale: ‘계좌’를 ‘계정’으로 바꾸어 λόγος의 장부·회계 비유를 더 정확히 살렸습니다. 또한 ἐπιζητῶ의 반복을 ‘구하는 것’과 ‘구합니다’로 유지했습니다. 각주는 원문의 회계 비유만 설명하고, 본문이 명시하지 않는 신학적 해석은 덧붙이지 않았습니다.
