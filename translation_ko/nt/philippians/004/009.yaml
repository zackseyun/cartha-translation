review_pass:
  verdict: revise
  source_fidelity: 초안은 동사들의 순서와 ‘평강의 하나님’ 및 미래의 임재 약속을 대체로 충실히 옮깁니다. 그러나 ‘그리하면’은 원문의 단순 접속사 καί를 조건적 결과로 구체화합니다. 또한 ‘나에게서’가 한국어 문장에서 앞선 ‘배우고, 전해 받고, 듣고’에도 걸리는 듯 읽힐 수 있으나, ἐν ἐμοί는 직접적으로 ‘본 것’에 연결됩니다.
  naturalness: ‘여러분이 배우고 받고 듣고 내게서 본 것’은 각 동사의 병렬과 마지막 수식어의 범위를 자연스럽고 분명하게 드러냅니다. ‘또’로 다음 절을 이어 합쇼체의 흐름도 매끄럽습니다.
  terminology: ‘평강의 하나님’은 ὁ θεὸς τῆς εἰρήνης에 대한 정착된 교회 용어이며 적절합니다. παραλαμβάνω는 여기서 ‘전해 받다’로 한정하지 않고 ‘받다’로 옮겨, 가르침·전통의 뉘앙스를 포함할 수 있는 원문의 폭을 보존합니다.
  issues:
  - severity: medium
    issue: ‘그리하면’이 καί를 조건·결과 접속으로 해석합니다.
    rationale: 원문은 권면과 약속을 καί로 병렬할 뿐 명시적 조건절을 사용하지 않습니다. 한국어에서는 ‘또’ 또는 문장 분리로 연결하여 그 관계를 불필요하게 강화하지 않는 편이 충실합니다.
  - severity: low
    issue: ‘나에게서’의 수식 범위가 넓게 읽힐 수 있고, ‘전해 받고’는 παραλάβετε를 다소 구체화합니다.
    rationale: ἐν ἐμοί는 εἴδετε와 연결되므로 ‘내게서 본 것’으로 배치하는 것이 명료합니다. ‘받고’는 원문의 수용 대상이 가르침인지 전통인지 문맥상 열어 둡니다.
  revised_text: 여러분이 배우고 받고 듣고 내게서 본 것, 이것들을 실천하십시오. 또 평강의 하나님께서 여러분과 함께 계실 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘내 안에서 본 것’, 곧 바울 자신에게서 관찰한 것을 뜻한다.
    reason: lexical_alternative
  revision_rationale: 수식어 ἐν ἐμοί의 범위를 ‘본 것’에만 분명히 연결하고, παραλαμβάνω의 의미를 과도하게 특정하지 않았습니다. 또한 καί를 ‘또’로 옮겨 원문의 병렬적 권면과 약속을 보존했습니다. 각주 표지는 본문에 ‘내게서 본 것[a]’으로 붙여야 합니다.
