  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus Messiah[a][b][c].
  footnotes:
  - marker: a
    text: Or Christ.
    reason: lexical_alternative
  - marker: b
    text: Or Master.
    reason: lexical_alternative
  - marker: c
