  source_fidelity: 핵심 의미는 대체로 충실합니다. πάντοτε, πᾶσῃ, ὑπὲρ πάντων ὑμῶν, μετὰ χαρᾶς 및 현재분사 ποιούμενος의 지속적·동시적 관계가 모두 반영되어 있습니다. 다만 원문의 두 δέησις가 같은 기도 행위를 가리키는 점을 한국어에서 더 자연스럽게 처리할 필요가 있습니다.
  naturalness: 현 번역의 ‘나의 모든 간구마다 ... 간구하면서’는 같은 어휘가 한 절 안에서 부자연스럽게 반복되고, ‘간구마다 간구하면서’의 결합도 현대 한국어 산문으로 매끄럽지 않습니다.
  terminology: δέησις는 ‘간구’로 유지하되, 첫 용례는 ‘간구’라는 명사로, 두 번째의 ποιεῖσθαι τὴν δέησιν은 한국어 관용에 맞게 ‘간구를 드리다’로 옮기는 것이 적절합니다. ‘여러분 모두’는 πάντων ὑμῶν을 충실히 반영합니다.
