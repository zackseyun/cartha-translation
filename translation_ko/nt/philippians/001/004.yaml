    issue: ‘간구’의 기계적 반복과 어색한 결합
    rationale: ‘나의 모든 간구마다 ... 간구하면서’는 원문의 반복을 표면적으로 보존하려 하지만 한국어에서는 중복이 부자연스럽습니다. 두 번째 표현을 ‘간구를 드리면서’로 처리하면 원문의 행위 표현(τὴν δέησιν ποιούμενος)과 문체를 모두 살릴 수 있습니다.
