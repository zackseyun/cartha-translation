review_pass:
  verdict: revise
  source_fidelity: 초안은 πιστεύειν과 πάσχειν을 모두 ἐχαρίσθη의 내용으로 묶고, ὑπὲρ Χριστοῦ 및 ὑπὲρ αὐτοῦ의 ‘~을 위하여’ 관계를 대체로 충실히 반영합니다. 다만 ‘은혜로 베풀어진 것이니’와 ‘함께 주어진 것입니다’가 한 문장 안에서 중복되며, ‘함께’는 원문에 없는 추가 강조입니다.
  naturalness: ‘고난받는 것’보다 ‘고난을 받는 것’이 현대 표준어에서 더 자연스럽습니다. 또한 수식 범위와 병렬 구조를 명료하게 하도록 문장을 재구성하는 것이 좋습니다.
  terminology: Χριστός를 ‘메시아’로 옮긴 것은 제공된 POB 방침과 일치합니다. χαρίζομαι의 은혜로운 선물의 의미는 ‘은혜로 주어졌습니다’로 자연스럽고 충분히 보존됩니다.
  issues:
  - severity: medium
    issue: 문장 종결과 의미의 중복
    rationale: ‘은혜로 베풀어진 것이니’ 뒤에 ‘함께 주어진 것입니다’를 덧붙여 ἐχαρίσθη를 중복 번역합니다. 또한 ‘함께’는 두 부정사에 대한 공동 범위를 설명하려는 의도는 이해되지만 원문에 명시된 어휘는 아닙니다.
  - severity: low
    issue: 비자연적인 ‘고난받는 것’
    rationale: 현대 표준어에서는 ‘고난을 받는 것’이 더 자연스럽고, πάσχειν의 의미도 정확히 전달합니다.
  - severity: low
    issue: 각주 c의 대안이 지나치게 해석적임
    rationale: ‘그의 이름을 위하여’와 특히 ‘그를 대신하여’는 ὑπὲρ αὐτοῦ의 일반적인 ‘그를 위하여/그분 때문에’보다 더 좁거나 다른 의미를 유발할 수 있습니다.
  revised_text: 이는 여러분에게 메시아[a]를 위하여, 그를 믿는 것[b]뿐 아니라 그를 위하여 고난을 받는 것[c]까지 은혜로 주어졌기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「그리스도」. 헬라어 칭호 Χριστός는 「그리스도」로도 옮길 수 있다. 여기서는 칭호성을 드러내기 위해 「메시아」로 번역한다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그를 신뢰하는 것」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「그분 때문에」.
    reason: lexical_alternative
  revision_rationale: 원문의 인과 접속사(ὅτι), 은혜로 주어짐(ἐχαρίσθη), 그리고 믿음과 고난을 함께 포괄하는 두 부정사의 병렬을 한 번의 자연스러운 서술로 재구성했습니다. ‘메시아를 위하여’는 두 행위 전체를 수식하도록 앞에 두었고, ‘그를 위하여’는 원문의 두 번째 ὑπέρ 구를 그대로 보존했습니다.
