review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존합니다. 그러나 「은혜로 베풀어진 것이니」 뒤에 「함께 주어진 것입니다」를 덧붙인 표현은 헬라어의 단일 수동 동사 ἐχαρίσθη를 중복하여 옮기며, 「함께」는 원문에 없는 첨가입니다. 「고난받는 것」도 현대 표준어에서는 「고난을 겪는 것/고난을 당하는 것」보다 자연스럽지 않습니다.
  naturalness: 현 문장은 「것이니」와 「것입니다」가 한 문장 안에서 겹쳐 어색하고, 연결 구조도 불분명합니다. 원문의 대조 구문을 「~뿐만 아니라 ~까지」로 유지하면서 하나의 서술어로 마무리하는 편이 자연스럽습니다.
  terminology: Χριστός는 프로젝트 방침에 따라 「메시아」로 유지합니다. πιστεύειν εἰς αὐτόν은 「그분을 믿는 일」, πάσχειν은 「고난을 겪는 일」로 옮깁니다. 두 ὑπέρ 표현은 각각 「메시아를 위하여」와 「그분을 위하여」로 보존합니다. 각주 c의 「그의 이름을 위하여」는 원문보다 해석적이므로 제거합니다.
  issues:
  - severity: medium
    issue: 서술어 중복 및 「함께」의 첨가
    rationale: 「은혜로 베풀어진 것이니 ... 함께 주어진 것입니다」는 ἐχαρίσθη를 사실상 두 번 번역하고, 원문에 없는 「함께」를 추가합니다.
  - severity: low
    issue: 「고난받는 것」의 현대 한국어 어색함
    rationale: 「고난을 겪는 일」 또는 「고난을 당하는 일」이 현대 표준어에서 더 자연스럽고 πάσχειν의 의미도 충실히 전달합니다.
  - severity: low
    issue: 각주 c의 해석적 대안
    rationale: 「그의 이름을 위하여」는 ὑπὲρ αὐτοῦ의 가능한 직역 대안이 아니라 문맥적 해석입니다.
  revised_text: 이는 여러분에게 메시아[a]를 위하여 그분을 믿는 일뿐만 아니라 그분을 위하여 고난을 겪는 일까지 은혜로 주어졌기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「그리스도」. 헬라어 칭호 Χριστός를 칭호로 옮기는 본 번역의 원칙에 따라 「메시아」로 번역합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그분을 신뢰하는 일」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「그분을 위하여」, 「그분을 대신하여」.
    reason: lexical_alternative
  revision_rationale: 원문의 ὅτι가 나타내는 앞 절의 근거를 「이는 ... 때문입니다」로 보존하고, ἐχαρίσθη의 은혜로운 수여 의미가 믿음과 고난이라는 두 부정사에 모두 걸리도록 문장을 재구성했습니다. 「메시아를 위하여」는 두 항목 전체의 관계를, 뒤의 「그분을 위하여」는 고난의 직접적 관계를 나타내도록 유지했습니다. 각주 표지는 본문에서 실제로 사용되도록 b와 c를 각각 「믿는 일」 및 「고난을 겪는 일」 뒤에 배치했습니다.
