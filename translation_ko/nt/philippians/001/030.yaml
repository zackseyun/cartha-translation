  to: 여러분은 내가 겪는 것을 보았고 지금도 내가 여전히 겪고 있다고 듣는 바로 그와 같은 분투를 겪고 있습니다.
  rationale: 원문의 분사 ἔχοντες를 한국어 주절 ‘겪고 있습니다’로 명료하게 옮기고, οἷον εἴδετε … καὶ νῦν ἀκούετε의 병렬을 ‘보았고 … 듣는’으로 보존했습니다. 불필요한 ‘함께’와 중복된 주어를 제거했습니다. 의미상 필수적이지 않고 두 용례를 충분히 포괄하지 못하는 각주는 삭제했습니다.
