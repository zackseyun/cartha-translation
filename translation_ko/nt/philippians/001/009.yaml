  source_fidelity: 핵심 의미는 충실합니다. 다만 현재의 「내가 기도하는 것은 이것이니 … 구합니다」는 προσεύχομαι와 ἵνα절을 각각 ‘기도’와 ‘구합니다’로 중복 표지하여, 원문의 한 문장 기도 진술보다 다소 부자연스럽고 과잉 번역처럼 들립니다. 「그리고 나는 이것을 기도합니다」는 καὶ τοῦτο와 προσεύχομαι를 자연스럽게 함께 살립니다.
  naturalness: 「그리고 나는 이것을 기도합니다.」 뒤에 기도의 내용을 제시하는 방식이 현대 표준 한국어 합쇼체에서 더 자연스럽습니다. 「지식과 모든 분별 안에서」는 ἐν의 범위를 보존하는 다소 직역적인 표현이지만 문맥상 이해 가능하며 유지할 수 있습니다.
  terminology: ἀγάπη는 「사랑」, ἐπίγνωσις는 과도하게 전문화하지 않은 「지식」, αἴσθησις는 「분별」로 옮긴 것이 적절합니다. 「모든 도덕적 분별」은 본문 대안으로 단정하지 않고 각주 대안으로 처리한 것이 좋습니다.
