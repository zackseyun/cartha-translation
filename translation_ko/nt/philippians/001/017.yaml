  to: 그러나 다른 사람들은 이기적인 야심으로 메시아를 선포합니다. 그들은 순수한 동기[b]에서가 아니라, 내가 갇혀 있는 동안 내게[a] 환난을 더하려 한다고 생각합니다.
  rationale: 그리스어의 대조(「그러나 다른 사람들은」), 동기(ἐξ ἐριθείας; οὐχ ἁγνῶς), 의도·추정(οἰόμενοι), 그리고 바울의 구금 상태를 가리키는 δεσμοί의 환유를 보존했습니다. 초안의 중복되고 부자연스러운 「내가 매인 중에 있는 나에게」를 자연스러운 현대 한국어로 바로잡았으며, 각주 표지도 해당 표현에 맞게 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:41:30Z'
