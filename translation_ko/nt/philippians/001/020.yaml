- from: 이는 나의 간절한 기대와 소망에 부합하는 것이니, 곧 내가 어떤 일에서도 부끄러움을 당하지 않고[a] 도리어 온전한 담대함으로, 언제나처럼 지금도, 메시아가 나의 몸에서 크게 드러나시는 것입니다 — 살든지 죽든지.
  to: 나의 간절한 기대와 소망은 이것입니다. 나는 어떤 일에서도 수치를 당하지 않고[a], 오히려 언제나 그러했듯이 지금도 온갖 담대함으로 메시아께서 내 몸에서 크게 드러나실 것입니다. 살든지 죽든지 그러할 것입니다.
  rationale: 기대와 소망이 가리키는 ὅτι절의 내용을 명료하게 드러내고, 미래 수동형 μεγαλυνθήσεται를 「크게 드러나실 것입니다」로 보존했습니다. πάσῃ παρρησίᾳ는 자연스러운 한국어 표현인 「온갖 담대함으로」로 조정했으며, 삶과 죽음의 양자택일은 독립 문장으로 유지하여 문장의 흐름을 살렸습니다.
