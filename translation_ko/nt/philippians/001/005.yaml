  to: 여러분이 첫날부터 지금까지 복음에 함께 참여해 온 것[a] 때문입니다.
  rationale: The revision keeps the causal relation, the temporal span, and the active communal sense of κοινωνία while making the Korean idiomatic. The note preserves the source phrase's possible sphere/purpose nuance without treating either interpretation as certain.
