review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 「확신하기에」와 이어지는 「알고 있으니, 이는」은 πεποιθὼς를 과도하게 인과적으로 처리하고, 바울이 ‘안다’고 하는 내용과 그 목적을 문법적으로 다소 어색하게 연결합니다. 두 미래 동사 μενῶ와 παραμενῶ의 병렬도 더 분명히 드러낼 필요가 있습니다.
  naturalness: 현 문장은 「나는 내가 … 되리라는 것을 알고 있으니」와 「이는 … 위함입니다」의 연결이 현대 표준 한국어 합쇼체에서 부자연스럽고 장황합니다. 문장을 나누고 목적구를 자연스럽게 정리하는 것이 좋습니다.
  terminology: 「믿음」, 「진보」는 적절합니다. 「믿음 안에서 누리는 기쁨」은 χαρὰν τῆς πίστεως의 주된 번역 선택을 자연스럽게 전달하며, 속격의 다른 가능한 관계는 각주에서 보존합니다.
  issues:
  - severity: medium
    issue: πεποιθὼς 및 문장 논리의 인과적 과잉 처리
    rationale: 「확신하기에」와 「알고 있으니, 이는」은 확신·앎·목적의 관계를 한국어에서 지나치게 인과적으로 만들고 문장 구조를 어색하게 합니다. 원문은 ‘이것을 확신하고, 나는 안다’라는 분사구문과 그 앎의 내용을 제시합니다.
  - severity: medium
    issue: μενῶ와 παραμενῶ의 병렬 표현이 불분명함
    rationale: 「머물러 … 계속 있게 되리라」도 의미는 전달하지만, 「남아」와 「함께 계속 있으리라」로 옮기면 ‘남다’와 ‘함께 계속 머물다’의 구별 및 미래 병렬이 더 선명합니다.
  - severity: low
    issue: 목적구의 자연스러운 연결
    rationale: 「여러분의 진보와 믿음 안에서의 기쁨을 위하여」보다 「여러분이 진보하고 믿음 안에서 기뻐하도록」이 현대 한국어에서 더 자연스럽고, εἰς의 목적 의미를 명료하게 나타냅니다.
  revised_text: 그리고 나는 이것을 확신하고, 내가 남아 여러분 모두와 함께 계속 있으리라는 것을 압니다. 이는 여러분이 진보하고 믿음 안에서 기뻐하도록 하려는 것입니다[a].
  revised_footnotes:
