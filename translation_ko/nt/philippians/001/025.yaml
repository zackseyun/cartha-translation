- from: 그리고 이것을 확신하기에, 나는 내가 머물러 여러분 모두와 함께 계속 있게 되리라는 것을 알고 있으니, 이는 여러분의 진보와 믿음 안에서의 기쁨[a]을 위함입니다.
  to: 그리고 나는 이것을 확신하고, 내가 남아 여러분 모두와 함께 계속 있으리라는 것을 압니다. 이는 여러분이 진보하고 믿음 안에서 기뻐하도록 하려는 것입니다[a].
  rationale: 문장 구조를 원문의 분사구문, 앎의 내용, 목적구에 맞게 정돈했습니다. 「남아」와 「여러분 모두와 함께 계속 있으리라」로 두 미래 동사의 차이를 보존했고, χαρὰν τῆς πίστεως의 속격 관계에 관한 대안은 각주에 유지했습니다.
