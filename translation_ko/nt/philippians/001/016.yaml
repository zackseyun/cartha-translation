review_pass:
  verdict: revise
  source_fidelity: 「앞의 사람들」은 οἱ μὲν이 다음 절의 οἱ δέ와 이루는 전향적 대조를 부정확하게 앞 문맥의 사람들에 연결할 수 있습니다. 또한 κεῖμαι에 관해 하나님이 정하셨다는 해석을 본문 및 어휘 자체보다 강하게 footnote에 부가합니다. 수정문은 대조와 문맥상 보충된 행위를 보존하고, κεῖμαι의 ‘세워짐/배치됨’ 의미를 과도한 신학적 해석 없이 반영합니다.
  naturalness: 「한편, 이들은 사랑으로 그렇게 하며」는 다음 절의 대조를 예고하면서도 현대 표준 한국어로 자연스럽습니다. 「알고 있습니다」는 헬라어 현재 분사의 연결을 유지하며, 불필요하게 강한 인과 종결을 피합니다.
  terminology: 「사랑」, 「복음」, 「변호」는 적절합니다. 「복음을 변호하도록 세워졌음」은 εἰς ἀπολογίαν τοῦ εὐαγγελίου 및 κεῖμαι를 자연스럽게 옮깁니다.
  issues:
  - severity: medium
    issue: 「앞의 사람들」의 지시와 대조 방향
    rationale: οἱ μὲν은 바로 다음 절의 οἱ δέ와 대조되는 ‘한편 이들은’이라는 기능입니다. 「앞의」는 앞선 절의 집단을 가리키는 듯하여 대조 구조를 흐릴 수 있습니다.
  - severity: medium
    issue: 각주 b의 신학적 해석 과잉
    rationale: κεῖμαι는 ‘놓여 있다, 자리하다, 세워져 있다’의 의미를 가지지만, 해당 어휘만으로 바울이 자신의 상황을 ‘하나님이 정하신 자리’로 받아들였다고 명시할 수는 없습니다. 이는 가능한 문맥적 해석이지만 본문 각주에서는 중립적으로 제시해야 합니다.
  revised_text: 한편, 이들은 사랑으로 그렇게 하며, 내가 복음을 변호하도록 세워졌음을 알고 있습니다.
  revised_footnotes:
  - marker: a
    text: 헬라어는 「한편, 이들은」이라는 대조 구문이다. 다음 절의 「다른 이들은」과 대조되며, 전파 행위는 앞뒤 문맥에서 함축된다.
    reason: alternative_reading
  - marker: b
    text: 또는 「내가 복음의 변호를 위해 놓여 있음을」. 헬라어 κεῖμαι는 본래 「놓이다·자리하다」를 뜻하며, 여기서는 맡겨진 자리나 역할을 가리킬 수 있다.
    reason: lexical_alternative
  revision_rationale: οἱ μὲν의 다음 절과의 대조를 「한편, 이들은」으로 명료하게 하고, 문맥상 생략된 행위는 「그렇게 하며」로만 보충했습니다. κεῖμαι는 「세워졌음」으로 번역하되, 각주에서 특정한 신적 원인이나 바울의 내적 해석을 단정하지 않도록 중립화했습니다.
