review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 κεῖμαι를 「세움받았다」로 옮기고 각주에서 하나님이 정하신 자리라고 단정하면, 본문의 ‘놓여/세워져 있다’라는 상태 표현보다 신적 행위자를 더 명시하게 됩니다. 이를 더 절제하여 옮기는 것이 적절합니다.
  naturalness: 「앞의 사람들」은 이 절 자체에서 앞선 문장에 나온 사람들을 가리키는 듯하여 다소 어색합니다. 대조를 나타내는 「한편 이들은」이 οἱ μὲν 및 다음 절의 οἱ δέ에 더 자연스럽게 대응합니다. 「사랑으로 그렇게 합니다」도 한국어 합쇼체 문장으로 자연스럽습니다.
  terminology: 「복음」과 「변호」는 εὐαγγέλιον 및 ἀπολογία의 문맥상 적절한 정형 용어입니다. 「복음을 변호하도록 세워져 있다」는 법정적 변호의 목적과 κεῖμαι의 문맥적 ‘정해진/놓인 처지’를 보존하면서, 행위자를 본문 이상으로 특정하지 않습니다.
  issues:
  - severity: medium
    issue: 「앞의 사람들」
    rationale: οἱ μὲν은 다음 절의 οἱ δέ와 짝을 이루는 대조 표지입니다. 「앞의」는 한국어에서 앞 문장에 언급된 사람을 뜻하는 인상이 강하므로 「한편 이들은」이 더 정확하고 자연스럽습니다.
  - severity: medium
    issue: κεῖμαι에 대한 각주의 신적 정하심 단정
    rationale: κεῖμαι는 ‘놓여 있다, 정해져 있다, 세워져 있다’라는 표현이며, 문맥상 바울의 사명을 가리키지만 하나님을 명시적 행위자로 단정하는 것은 번역과 각주에서 한 단계 나아간 해석입니다.
  revised_text: 한편 이들은 사랑으로 그렇게 합니다. 이는 내가 복음을 변호하도록 세워져 있음을 알고 있기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 헬라어는 「한편 이들은」이라는 대조 표현이다. 동사는 앞 문맥의 전파 행위에서 보충되며, 다음 절의 「다른 이들은」과 대조된다.
    reason: alternative_reading
  - marker: b
    text: 또는 「내가 복음의 변호를 위해 놓여 있음을」. 헬라어 κεῖμαι는 본래 「놓이다, 자리하다」라는 뜻이며, 여기서는 바울이 복음을 변호하는 일을 위해 정해진 처지에 있음을 가리킨다.
    reason: lexical_alternative
  revision_rationale: 대조 표지 οἱ μὲν을 한국어 문맥에 맞게 「한편 이들은」으로 바로잡고, κεῖμαι의 의미를 보존하되 본문에 명시되지 않은 신적 행위자를 각주에서 단정하지 않도록 수정했습니다. 나머지 핵심 용어와 목적 표현은 유지했습니다.
