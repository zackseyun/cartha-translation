  source_fidelity: 「위협을 받지」는 πτυρόμενοι가 말하는 두려움·위축의 반응보다 실제 외부의 위협을 받지 않는다는 뜻으로 읽히기 쉽습니다. 또한 「바랍니다」는 원문 문맥의 권면적 분사에 화자의 소망 표현을 더합니다. 이를 직접적인 권면으로 옮기는 것이 안전합니다. ἔνδειξις에 대한 양쪽 속격의 병렬 관계와 τοῦτο의 넓은 지시 범위는 유지됩니다.
  naturalness: 「어떤 일에서도 … 두려워하지 마십시오」는 현대 표준 한국어의 합쇼체로 자연스럽고, 독립적으로 제시된 절에서도 권면의 기능을 명료하게 전달합니다. 「하나님께로부터 온 것입니다」는 ἀπὸ θεοῦ를 자연스럽게 나타내면서 지시 대상의 모호성을 보존합니다.
  terminology: 「대적하는 자들」, 「멸망」, 「구원」, 「표징」은 문맥과 신학적 용례에 적절합니다. 「표징」을 두 절에 병렬로 반복하여 원문의 한 ἔνδειξις가 멸망과 구원에 각각 관련된다는 구조를 분명히 했습니다.
