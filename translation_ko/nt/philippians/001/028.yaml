  to: 그리고 어떤 일에서도 여러분을 대적하는 자들 때문에 두려워하지 마십시오. 이것은 그들에게는 멸망의 표징이며, 여러분에게는 구원의 표징입니다. 그리고 이것은 하나님께로부터 온 것입니다[c].
  rationale: 두려움이나 위축을 뜻하는 πτυρόμενοι를 「두려워하지 마십시오」로 바로 옮기고, 원문에 없는 「바랍니다」를 제거했습니다. 어휘 대안 각주 a와 b는 본문에 더 이상 표지되지 않으므로 제거했으며, 원문의 실제 해석상 모호성을 보존하는 각주 c만 유지했습니다.
