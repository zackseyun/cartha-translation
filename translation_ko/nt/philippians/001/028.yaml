  revised_text: 그리고 어떤 일에서도 여러분을 대적하는 자들 때문에 두려워하지 마십시오. 이것은 그들에게는 멸망의 표징이며, 여러분에게는 구원의 표징입니다. 그리고 이것은 하나님께로부터 온 것입니다[c].
