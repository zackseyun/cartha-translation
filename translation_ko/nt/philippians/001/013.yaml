revisions:
- from: 그리하여 메시아 안에서[a] 내가 매인 일이 온 친위대[b]와 그 밖의 모든 사람에게 알려지게 되었고,
  to: 그리하여 내가 메시아 안에서[a] 결박당한 일이 온 황제의 친위대[b]와 그 밖의 모든 사람에게 알려지게 되었고,
  rationale: 본문을 「내가 메시아 안에서 결박당한 일」로 고쳐 δεσμούς의 구체적 의미와 ἐν Χριστῷ의 수식 관계를 더 명료하고 자연스럽게 반영했습니다. πραιτώριον의 주된 문맥상 이해는 「황제의 친위대」로 밝혔으며, 대안적 지시 대상은 각주에 중립적으로 보존했습니다. ἐν Χριστῷ의 원인적 독해는 본문에 강요하지 않고 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:41:30Z'
review_pass:
  verdict: revise
  source_fidelity: 「매인 일」은 δεσμούς의 구금·결박이라는 구체적 의미를 다소 흐리며, 「메시아 안에서」의 수식 범위도 자연스럽게 드러나지 않습니다. 「내가 메시아 안에서 결박당한 일」은 τοὺς δεσμούς μου ... ἐν Χριστῷ를 더 충실하게 반영하면서도, ἐν의 영역적 의미를 본문에 보존합니다. πραιτωρίῳ의 지시 대상은 확정하기 어려우므로 본문의 「황제의 친위대」와 각주의 대안을 유지하는 것이 적절합니다.
  naturalness: 「내가 매인 일」보다 「내가 ... 결박당한 일」이 현대 표준 한국어에서 더 자연스럽고 의미가 분명합니다. 절을 이어 주는 「그리하여」 및 문말의 「-었고」는 문맥상 다음 절과 연결되는 원문을 적절히 반영합니다.
  terminology: Χριστῷ를 「메시아」로 옮긴 것은 프로젝트 원칙에 부합합니다. δεσμούς는 「결박」으로, πραιτωρίῳ는 본문에서 「황제의 친위대」로 옮기고 관저·본부 가능성은 각주에서 보존합니다.
  issues:
  - severity: medium
    issue: 「내가 매인 일」은 δεσμούς의 결박·구금 의미와 ἐν Χριστῷ의 결합을 충분히 명료하게 전달하지 못합니다.
    rationale: 「매인 일」은 관용성이 낮고 단순한 개인적 사정처럼 들릴 수 있습니다. 「내가 메시아 안에서 결박당한 일」은 바울 자신의 결박을 명시하고, 논쟁적인 전치사구의 영역적 독해를 유지합니다.
  - severity: low
    issue: 본문의 「친위대」에 ‘황제의’라는 수식어가 없습니다.
    rationale: πραιτώριον을 ‘imperial guard’로 이해하는 본문 선택을 한국어에서 명시하면 의미가 더 분명해집니다. 다만 어휘의 다른 지시 가능성은 각주에 보존해야 합니다.
  - severity: low
    issue: 각주의 「황실 관저」는 πραιτώριον의 ‘본부/관저’ 가능성을 다소 좁힐 수 있습니다.
    rationale: ‘황제의 관저 또는 본부’라고 하면 건물·행정 시설을 가리킬 수 있는 어휘의 범위를 더 중립적으로 보존합니다.
