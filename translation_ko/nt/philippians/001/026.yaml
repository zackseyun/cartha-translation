review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 그러나 ἵνα 절을 「~하기 위함입니다」로 명사화하면서 앞 절(25절)에 종속되는 목적절의 문장 기능이 다소 부자연스럽게 처리되었습니다. 또한 「내가 다시 여러분에게 가는 일」은 παρουσία의 개인적 방문/다시 찾아옴을 충분히 자연스럽게 드러내지 못합니다.
  naturalness: 「그리하여 … 풍성해지도록 하기 위함입니다」는 목적 표지가 중복되어 현대 한국어 합쇼체 성경 문장으로 어색합니다. 「다시 여러분을 찾아감으로써」는 자연스럽고, διὰ τῆς ἐμῆς παρουσίας의 수단·계기 관계를 명확히 합니다.
  terminology: 「메시아 예수」는 Χριστῷ Ἰησοῦ의 칭호 의미를 보존하며 프로젝트 방침에 부합합니다. καύχημα를 「자랑」으로 옮기고 ‘자랑할 근거/거리’의 가능성을 각주로 남긴 것은 적절합니다. ἐν ἐμοὶ의 각주 대안 가운데 「나를 통하여」는 διὰ와 혼동될 수 있으므로 삭제하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 목적절 표현의 중복과 비문성
    rationale: 「풍성해지도록 하기 위함입니다」는 -도록과 ‘위함’이 중첩됩니다. ἵνα의 목적 관계는 「풍성해지게 하려는 것입니다」로 자연스럽게 표현할 수 있습니다.
  - severity: medium
    issue: παρουσία의 번역이 어색함
    rationale: 「내가 다시 여러분에게 가는 일」은 일상적으로 부자연스럽고 παρουσία가 가리키는 바울의 재방문/현존을 약화합니다. 「내가 다시 여러분을 찾아감으로써」가 문맥과 한국어 용법에 더 적합합니다.
  - severity: low
    issue: 각주 b의 대안이 전치사 구별을 흐림
    rationale: ἐν ἐμοὶ에 대한 「나를 통하여」는 바로 뒤의 διὰ τῆς ... παρουσίας와 같은 수단 의미처럼 들릴 수 있습니다. 본문의 「나로 말미암아」와 각주의 「내 안에서/나로 인하여」가 더 정확합니다.
  revised_text: 그리하여 메시아 예수 안에서 여러분이 자랑할 것이[a] 내가 다시 여러분을 찾아감으로써 나로 말미암아 더욱 풍성해지게 하려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「여러분의 자랑」. 헬라어 καύχημα는 자랑하는 행위 자체보다 자랑의 근거·내용을 가리킬 수 있다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로 「내 안에서」. 문맥상 「나로 인하여」 또는 「나로 말미암아」라는 뜻이다.
    reason: lexical_alternative
  revision_rationale: 문장을 25절에 이어지는 목적절로 자연스럽게 다듬고, καύχημα의 ‘자랑할 근거/거리’ 의미를 본문에서 무리 없이 반영했습니다. 「다시 여러분을 찾아감으로써」는 διὰ τῆς ἐμῆς παρουσίας의 수단·계기 관계와 재방문의 의미를 분명히 합니다. 원문에 없는 신학적 해석은 추가하지 않았습니다.
