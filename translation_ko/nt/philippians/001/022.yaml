  - severity: low
    issue: ‘결실 있는 수고’가 원문의 명사구를 다소 해석적으로 풀어냄
    rationale: καρπὸς ἔργου는 문자적으로 ‘수고/일의 열매’입니다. 본문에서는 이 표현을 보존하고, ‘결실 있는 수고’를 대안으로 제시하는 편이 원문의 압축성을 더 잘 살립니다.
