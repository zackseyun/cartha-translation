  source_fidelity: 원문의 조건절적·압축적 구문과 ‘무엇을 택할지 알지 못한다’는 결론은 대체로 반영되었습니다. 다만 δέ와 καί를 모두 ‘그러나’로 옮긴 것은 불필요하게 대립을 중첩하며, ‘육신 가운데’는 이 문맥에서 공간적 표현처럼 들릴 수 있습니다. ‘수고의 열매’는 καρπὸς ἔργου의 압축성과 의미 범위를 더 직접적으로 보존합니다.
  naturalness: ‘그러나 … — 그러나’의 반복과 대시 연결은 현대 한국어 문장으로 다소 부자연스럽습니다. ‘그런데 …라면, 무엇을 택할지 저는 알지 못합니다’로 정리하면 합쇼체를 유지하면서도 자연스럽습니다.
  terminology: σάρξ는 도덕적 ‘죄성’이 아니라 육체적 지상 생애를 뜻하므로 ‘육신 안에서’가 적절합니다. 각주 대안 ‘몸 안에서 사는 것’은 한국어에서 문자적으로 몸의 내부에 있다는 뜻으로 오해될 수 있어 ‘몸으로 살아가는 것’으로 바로잡았습니다. καρπὸς ἔργου는 본문에서 ‘수고의 열매’로 옮기고, 관용적 해석인 ‘결실 있는 수고’를 각주에 남겼습니다.
