  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake.
translation:
  language: ko
  text: 그러나 육신 안에 머무르는 것은 여러분을 위하여 더 필요합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「몸 안에서 계속 살아가는 것」.
