  to: 나는 이 일이 여러분의 간구와 예수 메시아의 영의 풍성한 도우심을 통하여 나에게 구원이[a] 될 것을 알고 있습니다.
  rationale: 결과를 나타내는 ἀποβήσεται εἰς σωτηρίαν을 ‘나에게 구원이 될 것’으로 다듬어 원문의 통사 관계를 더 분명히 했습니다. 또한 ἐπιχορηγίας의 의미를 ‘풍성한 도우심’으로 옮겨 한국어의 자연스러움을 높이되, 예수 메시아의 영과의 속격 관계를 과도하게 해석하지 않았습니다. σωτηρία의 폭은 본문과 각주를 통해 보존했습니다.
