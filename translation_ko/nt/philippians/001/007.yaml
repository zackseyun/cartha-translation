    rationale: δεσμοῖς는 바울의 결박·구금 상태를 가리키지만, ‘매인 중’은 자연스러운 현대 표현이 아닙니다. ‘갇혀 있을 때’는 문맥상 구금 상태를 분명하고 자연스럽게 전달합니다.
  - severity: low
    issue: ‘동참한 자들’이 원문의 현재적 상태를 약화함
    rationale: ὄντας는 현재 ‘…인’ 상태를 나타냅니다. ‘동참하는 사람들’은 지속되는 공동 참여를 더 잘 반영합니다.
  - severity: low
