review_pass:
  verdict: revise
  source_fidelity: 원문은 하나님이 신자들 안에서 ‘의지하는 것’과 ‘행하는 것’ 양쪽 모두에 작용하신다는 뜻입니다. 초안의 핵심 의미는 대체로 보존하지만, ‘일하시는 분이 하나님이시기’라는 도치 구조와 ‘자신의 기뻐하시는 뜻’은 한국어 문장 구조상 어색하고 수식 관계가 불분명합니다. ‘이루시다’로 옮기면 하나님이 두 행위 모두를 실제로 작동하게 하신다는 원문의 범위를 자연스럽게 담습니다.
  naturalness: ‘이는 … 일하시는 분이 하나님이시기 때문입니다’는 현대 표준 한국어 합쇼체에서 지나치게 얽혀 있습니다. 하나님을 주어로 앞세우고 ‘이루시기 때문입니다’로 종결하면 설명 접속사 γάρ의 기능과 합쇼체 문체가 모두 자연스럽습니다.
  terminology: τὸ θέλειν/τὸ ἐνεργεῖν은 각각 ‘의지하는 것’과 ‘행하는 것’으로 유지했습니다. εὐδοκία는 의지나 계획으로 과도하게 한정하지 않고 관용적으로 자연스러운 ‘그분의 기쁘신 뜻’으로 옮겼습니다. ἐν ὑμῖν의 개인적·공동체적 범위는 ‘여러분 안에서’로 열어 둡니다.
  issues:
  - severity: medium
    issue: 주절의 도치 및 수식 범위가 부자연스럽습니다.
    rationale: ‘여러분 안에서 … 일하시는 분이 하나님이시기’는 한국어에서 ‘자신의’가 누구를 가리키는지와 ‘위하여’가 무엇을 수식하는지가 즉시 드러나지 않습니다.
  - severity: low
    issue: ‘자신의 기뻐하시는 뜻’의 표현이 어색합니다.
    rationale: ‘자신의’와 ‘기뻐하시는’의 주체가 문장 표면상 불명확합니다. ‘그분의 기쁘신 뜻’이 εὐδοκία를 자연스럽고 간결하게 전달합니다.
  revised_text: 이는 하나님께서 여러분 안에서 의지하는 것과 행하는 것 모두를 그분의 기쁘신 뜻을 위하여 이루시기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「의지함과 행함 모두를」. 헬라어 관사 부정사 τὸ θέλειν은 의지의 행위를 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그분의 기쁘신 뜻에 따라」.
    reason: lexical_alternative
  revision_rationale: 문장을 하나님을 명시적 주어로 하는 현대 합쇼체 문장으로 재구성했습니다. ‘의지하는 것과 행하는 것 모두’를 보존하여 두 관사 부정사의 병렬을 드러냈고, ‘그분의 기쁘신 뜻’을 사용하여 εὐδοκία의 의미와 원문의 목적·이익 관계를 유지했습니다. 각주 표지는 해당 어구 바로 뒤에 그대로 유지합니다.
