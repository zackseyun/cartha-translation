review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 본문의 「함께」는 ἀλλὰ καί가 나타내는 단순한 추가·대조를 넘어 ‘함께’라는 뉘앙스를 더할 수 있으므로 빼는 것이 더 정확합니다. 또한 각자의 관심 대상을 가리키는 복수 표현을 자연스럽게 반영하여 「다른 사람들의 일」로 다듬었습니다.
  naturalness: 「여러분 각자는 … 살피십시오」는 현대 표준어 합쇼체로 자연스럽습니다. 「자기 자신의」은 강조된 재귀성을 살릴 수 있으나 한국어에서는 다소 중복적으로 들리므로 「자기 일」이 더 자연스럽고 의미도 충분히 보존합니다.
  terminology: 「살피다」는 σκοπέω의 주의 깊은 관심·고려의 뜻을 적절히 옮깁니다. 「일」은 소유물에 한정되지 않는 넓은 관심사·형편을 나타내며, 각주에서 더 문자적인 「것들」을 제시하여 의미 범위를 보완할 수 있습니다.
  issues:
  - severity: low
    issue: 본문의 「함께」
    rationale: 그리스어 ἀλλὰ καί는 ‘그러나 또한/뿐 아니라 또한’의 대조와 추가를 뜻합니다. 「함께」는 공동 행위 또는 동시성을 연상시킬 수 있으므로 불필요한 의미를 더하지 않는 「도」가 적절합니다.
  - severity: low
    issue: 각주의 직역 표현
    rationale: 기존 「자기 것을 보지 말고」는 문맥상 ‘자기 것에 전혀 관심을 두지 말라’는 인상을 줄 수 있습니다. 원문의 ‘자기 것만이 아니라 다른 이들의 것도’라는 추가 관계를 명시하는 편이 정확합니다.
  revised_text: 여러분 각자는 자기 일만이 아니라 다른 사람들의 일도 살피십시오[a].
