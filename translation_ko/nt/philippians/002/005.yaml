  source_fidelity: 본문의 「메시아 예수 안에 있었던」은 ἐν Χριστῷ Ἰησοῦ를 보존하고, 모범적 이해를 본문에 두면서 대안 독법을 각주에 남긴 점에서 대체로 충실합니다. 그러나 καί는 ‘곧’이 아니라 ‘또한’으로 드러내야 합니다.
  naturalness: 「그것은 곧 메시아 예수 안에 있었던 것입니다」는 한국어로 다소 부자연스럽고, ‘곧’은 원문의 연결 의미를 바꿉니다. 「이는 또한 메시아 예수 안에 있었던 마음가짐입니다」가 현대적인 합쇼체 문장으로 더 자연스럽습니다.
  terminology: 「메시아」는 Χριστός의 칭호성을 반영하며 프로젝트의 어휘 방침과 일치합니다. 각주에서는 현대 표준 학술 용례에 맞추어 「헬라어」를 「그리스어」로 다듬는 것이 좋습니다.
