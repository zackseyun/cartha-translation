  to: 여러분의 일에 진심으로 마음을 쓸, 나와 마음이 같은 사람이 나에게는 아무도 없기 때문입니다.[a][b]
  rationale: γάρ의 설명적 기능을 「없기 때문입니다」로 반영하고, ἰσόψυχον은 문맥상 바울과의 일치를 명확히 하는 「나와 마음이 같은」으로 옮겼습니다. γνησίως μεριμνήσει는 긍정적 관심의 뜻을 보존하여 「진심으로 마음을 쓸」로 번역했습니다. τὰ περὶ ὑμῶν은 특정한 ‘안위’에 한정하지 않고 「여러분의 일」로 포괄적으로 유지했습니다.
