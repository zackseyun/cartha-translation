    text: 또는 「여러분이 빛들처럼 나타납니다」. 헬라어 φαίνεσθε는 「빛나다」와 「나타나다」 둘 다 가능하나, 이어지는 「빛들」과의 연결에서는 「빛나다」가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 「비뚤어지고 뒤틀린 세대」는 신명기 32:5의 어구를 반영하며, 부패한 세대와 하나님의 자녀를 대조합니다.
    reason: cross_reference
  - marker: c
    text: 또는 「발광체들」, 「별들」.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported divine-honorific causative, retains the purpose relation of ἵνα γένησθε in idiomatic formal Korean, and translates the final present clause without converting ἐν κόσμῳ into a possessive. It also corrects the misplaced lexical footnote anchor and pluralizes 「빛들」 to reflect φωστῆρες.
