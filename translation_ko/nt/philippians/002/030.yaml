    issue: ἵνα 목적절의 기능이 본문에서 충분히 드러나지 않음
    rationale: ἵνα ἀναπληρώσῃ는 에바브로디도가 목숨을 건 목적, 곧 빌립보 교회의 부재로 인한 섬김의 부족분을 보충하려는 목적을 나타냅니다. 「채우기 위하여」로 명시하는 것이 안전합니다.
  - severity: low
