  source_fidelity: 「그와 같이 여러분도 기뻐하고 나와 함께 기뻐하십시오」는 τὸ δὲ αὐτὸ의 문맥적·부사적 용법, 두 개의 복수 현재 명령형(χαίρετε, συγχαίρετε), 그리고 μοι의 ‘나와 함께’라는 공유의 대상을 충실히 반영합니다. 두 번째 ‘기뻐하십시오’는 συγχαίρετε의 공동 기쁨의 뉘앙스를 자연스럽게 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 「여러분도」와 「기뻐하십시오」의 조합도 공적 성경 문체에 적절합니다. 「그와 같이」는 앞 절을 받는 표현으로 문맥상 명료합니다.
  terminology: 「기뻐하다/함께 기뻐하다」는 빌립보서의 반복되는 기쁨 어휘를 일관되게 살립니다. 인명 대명사 「나」 및 공동성을 나타내는 「나와 함께」도 정확합니다.
