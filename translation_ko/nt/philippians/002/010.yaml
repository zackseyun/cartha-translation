  source_fidelity: 핵심 어휘와 세 영역의 포괄적 범위는 잘 보존했습니다. 다만 κάμψῃ는 ‘모든 무릎’이 주어인 능동형이므로, 현행 ‘꿇게 하시려는’은 하나님이 무릎을 꿇게 하신다는 사역 구문을 전면에 내세워 원문의 직접적인 표현을 다소 바꿉니다. 목적을 나타내는 ἵνα는 ‘~하도록’으로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: ‘예수의 이름 앞에’는 이 문장에서는 부사격 조사와 결합한 ‘예수의 이름 앞에서’가 더 자연스럽습니다. ‘모든 무릎이 꿇도록’은 문어적이지만 현대 한국어 성서 문맥에서 자연스럽고, 합쇼체의 격식 있는 문장에 맞습니다.
