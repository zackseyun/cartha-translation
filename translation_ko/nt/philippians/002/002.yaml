  to: 여러분이 같은 생각을 품고[a], 같은 사랑을 지니며, 한마음이 되어[b], 한 가지를 생각하여 나의 기쁨을 채워 주십시오.
  rationale: 문법적으로 불완전한 「곧 … 함으로써입니다」를 제거하고, ἵνα 이하의 네 연합 표현이 바울의 기쁨을 채우는 내용이 되도록 한국어의 자연스러운 연결 구조로 재구성했습니다. 두 φρονέω 표현은 각각 「같은 생각을 품고」와 「한 가지를 생각하여」로 옮겨 원문의 반복과 변주를 유지했습니다. 각주는 대안 번역만 간결하게 제시하여 논쟁적 또는 과도한 해설을 피했습니다.
