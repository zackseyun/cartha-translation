  naturalness: ‘여러분의 믿음의 제사와 섬김 위에 전제로 부어지고 있다’는 제사 비유를 다소 낯설더라도 정확하게 보존하며, ‘기뻐하고 … 함께 기뻐합니다’는 반복과 공동 기쁨을 자연스럽게 드러냅니다.
  terminology: θυσία는 문맥상 ‘제사’로, λειτουργία는 기본적으로 ‘섬김’으로 옮기되 각주에서 제사·예배 어조를 밝혔습니다. ‘전제’는 필요한 전문 제의 용어이므로 한자를 병기하지 않고 각주로 뜻을 설명합니다.
