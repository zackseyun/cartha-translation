  source_fidelity: 핵심 어휘와 명령형은 대체로 충실합니다. 그러나 현행 대시 안의 대조 구문은 ‘순종해 왔듯이’와의 문법적 연결이 다소 불분명합니다. παρουσίᾳ/ἀπουσίᾳ의 대조와 πολλῷ μᾶλλον의 강조를 ‘내가 함께 있을 때에만 그러했던 것이 아니라 … 더욱더 그러하듯이’로 명시하면 원문의 구조를 더 정확히 드러냅니다.
  naturalness: 「나의 사랑하는 이들이여」, 「두려움과 떨림으로」, 「여러분 자신의 구원을 이루어 가십시오」는 현대 표준 한국어의 격식 있는 합쇼체에 적절합니다. 다만 현행 삽입구는 생략이 겹쳐 다소 압축되어 있으므로 완전한 상관 구문으로 다듬는 것이 자연스럽습니다.
  terminology: 「구원」, 「순종」, 「두려움과 떨림」은 적절합니다. 각주 b의 ‘이미 받은 구원’은 본 절 자체가 명시하지 않는 해석을 전제하므로, 영어 감사 기록의 비-공로적 설명 취지는 유지하되 그 전제를 제거하는 편이 안전합니다.
