revisions:
- from: 그러나 나는 에바브로디도—나의 형제이며, 동역자이며, 함께 싸우는 군사이고, 또한 여러분의 사자[a]요 나의 필요를 섬기는 일꾼[b]인 그를—여러분에게 보내는 것이 필요하다고 여겼습니다.
  to: 그러나 나는 나의 형제요 동역자요 함께 싸우는 군사이며, 여러분이 보낸 사람[a]이요 나의 필요를 돌보아 주는 일꾼[b]인 에바브로디도를 여러분에게 보내는 것이 필요하다고 여겼습니다.
  rationale: 수정은 λειτουργὸν τῆς χρείας μου의 의미 관계를 자연스러운 현대 한국어로 명확히 하고, ἀπόστολος의 문맥상 비기술적 의미를 본문에서 투명하게 드러내기 위한 것입니다. 「사도」라는 가능한 번역은 각주에 보존했으며, 원문의 군사 비유와 인물 수식의 병렬 구조를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:41:36Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 수식 관계는 대체로 충실합니다. 다만 「나의 필요를 섬기는 일꾼」은 한국어에서 ‘필요’ 자체를 섬긴다는 부자연스러운 관계를 만들 수 있어, λειτουργὸν τῆς χρείας μου가 뜻하는 바울의 필요를 돌보는 봉사를 더 명료하게 나타낼 필요가 있습니다.
  naturalness: 「사자」는 문어적·고전적인 느낌이 있고 현대 한국어에서 뜻이 즉시 분명하지 않을 수 있습니다. 문맥상 ‘여러분이 보낸 사람’이 ἀπόστολος의 비기술적 의미를 자연스럽고 정확하게 전달합니다. 병렬 수식은 「요」를 사용하여 간결하게 다듬었습니다.
  terminology: 「동역자」와 군사 비유를 보존한 「함께 싸우는 군사」는 적절합니다. ἀπόστολος는 본문에서 「여러분이 보낸 사람」으로 번역하고, 「사도」 가능성은 중립적인 각주로 남겼습니다. λειτουργός는 직분 명칭을 과도하게 암시하지 않도록 ‘일꾼’으로 유지하되, 필요를 돌보는 대상 관계를 분명히 했습니다.
  issues:
