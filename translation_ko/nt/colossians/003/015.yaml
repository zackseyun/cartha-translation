- from: 또한 메시아의 평강이 여러분의 마음을 다스리게 하십시오. 여러분이 한 몸으로 부르심을 받은 것도 바로 그 평강을 향한 것입니다. 그리고 감사하는 자들이 되십시오.
  to: 또한 메시아의 평강이 여러분의 마음속에서 다스리게 하십시오. 여러분은 한 몸 안에서 바로 그 평강을 위하여 부르심을 받았습니다. 그리고 감사하는 사람들이 되십시오.
  rationale: The revision restores the locative force of ἐν ταῖς καρδίαις ὑμῶν with 「마음속에서」 and of ἐν ἑνὶ σώματι with 「한 몸 안에서」. It also renders εἰς ἣν as the goal of the calling, 「그 평강을 위하여」, without resolving the phrase beyond the Greek’s corporate and purposive sense. The imperative and plural exhortation are retained in formal-polite Korean.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:42:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the Messiah’s peace, its governing function, the calling, and thanksgiving. However, 「여러분의 마음을 다스리게」 changes ἐν ταῖς καρδίαις ὑμῶν (‘in your hearts’) into the direct object of ruling, and 「한 몸으로」 can suggest means rather than the locative/corporate sphere expressed by ἐν ἑνὶ σώματι.
  naturalness: The proposed revision uses natural modern formal-polite Korean while retaining the epistolary exhortation. 「마음속에서」 clearly expresses the inner sphere, and 「한 몸 안에서」 preserves the body metaphor without making it instrumental.
  terminology: 「메시아」 appropriately reflects Χριστός as a title under the supplied translation policy, and 「평강」 follows the stated glossary choice. No theological expansion is introduced.
  issues:
  - severity: medium
    issue: The phrase 「여러분의 마음을 다스리게 하십시오」 does not explicitly retain ‘in your hearts.’
    rationale: The Greek has ἐν + dative, locating the peace’s ruling activity within the readers’ hearts; the Korean object marker 을 instead makes ‘hearts’ the entity ruled.
  - severity: medium
    issue: 「한 몸으로」 is potentially instrumental.
    rationale: ἐν ἑνὶ σώματι is most directly ‘in one body.’ 「한 몸 안에서」 more clearly retains the corporate sphere/body imagery and avoids implying that the calling occurs ‘by means of’ one body.
  revised_text: 또한 메시아의 평강이 여러분의 마음속에서 다스리게 하십시오. 여러분은 한 몸 안에서 바로 그 평강을 위하여 부르심을 받았습니다. 그리고 감사하는 사람들이 되십시오.
  revised_footnotes: []
  revision_rationale: The revision restores the locative force of ἐν ταῖς καρδίαις ὑμῶν with 「마음속에서」 and of ἐν ἑνὶ σώματι with 「한 몸 안에서」. It also renders εἰς ἣν as the goal of the calling, 「그 평강을 위하여」, without resolving the phrase beyond the Greek’s corporate and purposive sense. The imperative and plural exhortation are retained in formal-polite Korean.
