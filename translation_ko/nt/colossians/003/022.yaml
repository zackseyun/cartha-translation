  naturalness: 「육신을 따른 여러분의 주인들」은 직역투가 강합니다. 「육신에 따른 주인들」은 원문의 한정어를 보존하면서 더 자연스럽습니다. 또한 「사람들에게 잘 보이려는 자들처럼」보다 「사람들에게 잘 보이려고」가 현대 한국어에서 자연스럽고 원문의 목적·태도도 충분히 전달합니다.
  terminology: 「노예들/주인들」은 고대 노예제 현실을 흐리지 않는 적절한 대응입니다. 신적 κύριος는 인간 「주인」과 구별하여 「주」로 유지할 수 있습니다. ἁπλότης καρδίας는 「진실한 마음」이 자연스럽고, 「눈가림」에는 관찰될 때만 하는 섬김이라는 주석이 적절합니다.
