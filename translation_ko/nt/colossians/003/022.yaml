  terminology: δοῦλοι는 이 문맥에서 「노예들」이 적절하고, 인간 주인 κύριοι와 주님 κύριον의 구별도 「주인들」/「주님」으로 분명히 하는 것이 좋습니다. φοβούμενοι τὸν κύριον은 한국어의 관용적 신학 용례를 고려해 「주님을 경외하면서」로 옮기되, 각주 없이도 원문의 경외 의미를 유지합니다.
