  source_fidelity: 핵심 어휘와 상호적 가르침·권면의 구조는 대체로 원문에 충실합니다. 다만 「여러분의 마음에 하나님께 노래하십시오」는 ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ의 장소/내면 영역과 하나님을 향한 여격을 한국어에서 자연스럽고 문법적으로 구별하지 못합니다. 이를 「여러분의 마음속에서 하나님께 노래하십시오」로 고쳐야 합니다.
  naturalness: 현 초안의 마지막 구절은 조사 결합이 부자연스럽고 뜻이 불명확합니다. 또한 현대 표준어로는 「신령한」보다 「영적인」이 더 자연스럽습니다. 분사들의 연결은 합쇼체 명령문으로 풀되 원문의 연속된 권면 구조를 유지했습니다.
