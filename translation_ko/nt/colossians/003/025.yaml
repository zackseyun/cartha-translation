  source_fidelity: The draft accurately conveys the generic wrongdoer and future recompense, but it leaves γάρ untranslated. Its rendering of προσωπολημψία as “외모로 보는 일” is a traditional literalizing expression but is not sufficiently clear in modern Korean and can suggest merely judging physical appearance rather than partiality based on status.
  naturalness: “불의를 행하는 자” is formal and understandable, but “사람” is more natural in contemporary standard Korean. “사람을 차별하는 일은 없습니다” is clear modern formal-polite Korean and retains the source's impersonal existential construction.
  terminology: “불의” appropriately preserves the lexical connection between ἀδικῶν and ἠδίκησεν. “차별” clearly communicates προσωπολημψία without importing a particular doctrinal interpretation. The footnote retains the literal idiom as lexical background while explaining its intended sense.
  issues:
  - severity: medium
    issue: γάρ is omitted.
    rationale: The conjunction gives the statement an explanatory/grounding force and should be represented, naturally as “왜냐하면.”
  - severity: medium
    issue: “외모로 보는 일” is potentially misleading and insufficiently idiomatic in modern Korean.
    rationale: προσωπολημψία means partiality or favoritism, especially discrimination based on outward standing; the proposed wording can be understood as evaluating physical appearance.
  revised_text: 왜냐하면 불의를 행하는 사람은 자신이 행한 불의에 대한 갚음을 받을 것이며, 사람을 차별하는 일은 없습니다[a].
