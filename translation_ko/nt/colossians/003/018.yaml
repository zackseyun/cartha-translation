review_pass:
  verdict: revise
  source_fidelity: γυναῖκες and ἀνδράσιν denote wives and husbands in this household-instruction context. ὑποτάσσεσθε is accurately represented by ‘복종하십시오,’ and ‘주 안에서’ correctly retains ἐν κυρίῳ as the qualifier of what is fitting. ‘마땅한 대로’ more directly conveys the ethical propriety of ὡς ἀνῆκεν than ‘합당한 대로.’
  naturalness: The draft is intelligible, but ‘여러분의 남편들에게’ is somewhat cumbersome in a collective Korean address and introduces a second-person possessive not expressed in the Greek. Generic singular ‘남편에게’ is natural Korean usage for a class-directed instruction and retains the intended marital relation.
  terminology: '‘아내들,’ ‘남편,’ ‘복종하십시오,’ and ‘주 안에서’ are appropriate modern formal Korean renderings. No footnote is required: the imperfect-form/present-sense nuance of ἀνῆκεν is adequately conveyed by the Korean idiom and does not create a necessary ambiguity in the translation.'
  issues:
  - severity: low
    issue: ‘여러분의 남편들에게’ is stylistically heavy and adds an explicit audience possessive.
    rationale: The source marks the marital relationship through the paired nouns but has no possessive pronoun. Korean naturally expresses this generic reciprocal relation as ‘남편에게’ in an address to wives.
  - severity: low
    issue: ‘합당한 대로’ is less idiomatic and slightly less precise here than ‘마땅한 대로.’
    rationale: ἀνῆκεν expresses what is fitting or proper; ‘마땅한’ naturally conveys this ethical appropriateness in this construction.
  revised_text: 아내들이여, 주 안에서 마땅한 대로 남편에게 복종하십시오.
