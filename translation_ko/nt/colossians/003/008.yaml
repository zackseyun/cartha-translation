  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: ko
  text: 그러나 이제 여러분도 이 모든 것, 곧 분노와 격분과 악의와 비방과 여러분의 입에서 나오는 더러운 말을 벗어 버리십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그렇지만 이제는
  lexicon: BDAG
  rationale: 과거(7절)에서 현재로의 대조 전환.
- source_word: ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα
  english_pob_choice: you also must put away all these things
  chosen_korean: 여러분도 이 모든 것을 벗어 버리십시오
  alternatives_korean:
  - 여러분도 이 모든 것을 버리십시오
  - 여러분 또한 이 모든 것을 떨쳐 버리십시오
  lexicon: BDAG
  rationale: ἀποτίθημι의 「벗어 버림」 의복 비유를 살린다.
- source_word: ὀργήν
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  lexicon: BDAG
  rationale: 표준 등가어.
- source_word: θυμόν
  english_pob_choice: rage
  chosen_korean: 격분
  alternatives_korean:
  - 분노 폭발
  - 격노
  lexicon: BDAG
  rationale: θυμός의 「격렬한 분노 폭발」을 「격분」으로 옮겨 ὀργή와 구분.
- source_word: κακίαν
  english_pob_choice: malice
  chosen_korean: 악의
  alternatives_korean:
  - 악함
  - 사악
  lexicon: BDAG
  rationale: 「악의」가 한국 교회의 정립된 표현.
- source_word: βλασφημίαν
  english_pob_choice: slander
  chosen_korean: 비방
  alternatives_korean:
  - 욕설
  - 헐뜯음
  lexicon: BDAG
  rationale: 사람에 대한 βλασφημία는 「비방」.
- source_word: αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν
  english_pob_choice: filthy speech from your mouth
  chosen_korean: 여러분의 입에서 나오는 더러운 말
  alternatives_korean:
  - 너희 입에서 나오는 부끄러운 말
  - 부끄러운 말을 너희 입에서
  lexicon: BDAG
  rationale: αἰσχρολογία의 「부끄럽고 더러운 말」을 자연스럽게 옮긴다.
