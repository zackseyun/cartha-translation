review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 은유는 대체로 충실합니다. 다만 원문의 대격 나열은 ‘지체들’을 구체적으로 설명하는 동격적 나열이므로, 이를 별도 서술문인 ‘곧 …입니다’로 처리하기보다 목적어 구조 안에 유지하는 편이 더 직접적입니다. ἥτις의 단수 여성형이 직전의 πλεονεξίαν(탐심)을 받는 점도 본문에서 분명히 드러내는 것이 좋습니다.
  naturalness: 현 초안의 ‘지체들을 죽이십시오. 곧 …입니다’는 한국어에서 나열 항목이 ‘지체들’의 설명인지, 별도의 진술인지 잠시 불분명합니다. ‘지체들, 곧 …을 죽이십시오’라는 구조가 현대 한국어 문장으로도 자연스럽고 원문의 통사 관계를 잘 보입니다.
  terminology: ‘지체’, ‘음행’, ‘부정’, ‘정욕’, ‘악한 욕망’, ‘탐심’, ‘우상 숭배’는 모두 본문 문맥에서 사용할 수 있는 적절한 표준 성경 어휘입니다. ‘탐심은 우상 숭배입니다’는 원문의 강한 동일시를 완화하지 않고 보존합니다.
  issues:
  - severity: medium
    issue: 동격 나열의 통사 관계가 본문에서 분리되어 보임
    rationale: 그리스어에서 ‘음행, 부정, 정욕, 악한 욕망, 탐심’은 ‘땅 위에 있는 지체들’을 설명하는 대격 나열입니다. 초안의 마침표와 ‘입니다’는 이 나열을 명령문의 목적어로부터 분리해 보이게 합니다.
  - severity: low
    issue: ‘탐심’과 ‘우상 숭배’의 관계를 본문에서 더 명시할 필요
    rationale: ‘우상 숭배인 탐심’도 가능한 표현이지만, 별도 문장으로 ‘이 탐심은 우상 숭배입니다’라고 하면 관계절이 탐심만을 가리킨다는 원문의 문법적 범위가 더 선명해집니다.
  revised_text: 그러므로 땅 위에 있는 지체들, 곧 음행과 부정과 정욕과 악한 욕망과 탐심을 죽이십시오. 이 탐심은 우상 숭배입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「탐욕」. 원문의 「우상 숭배입니다」는 직전의 단수 명사 「탐심」을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 명령의 목적어 안에 동격적 악덕 목록을 배치하여 원문의 문장 구조를 보존했습니다. 관계절의 선행사가 탐심이라는 점은 본문에서 자연스럽게 명시했으며, 각 핵심 용어와 ‘지체’ 은유는 유지했습니다.
