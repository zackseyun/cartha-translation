  source_fidelity: ἀνεχόμενοι ἀλλήλων을 ‘서로 용납하며’로, χαριζόμενοι ἑαυτοῖς를 ‘서로 용서하십시오’로 옮겨 상호적 관계와 용서의 의미를 충실히 반영합니다. ‘누구든지 다른 사람에게 불만이 있거든’은 ἐάν τις πρός τινα ἔχῃ μομφήν의 일반적 조건과 대인적 불만/불평의 뜻을 자연스럽게 전달합니다. 마지막 ‘여러분도 그렇게 하십시오’는 οὕτως καὶ ὑμεῖς의 생략을 한국어에서 무리 없이 보완하며, 특정 동사를 과도하게 명시하지 않습니다.
  naturalness: 표준어 현대 합쇼체로 자연스럽습니다. ‘서로 용납하며’와 ‘서로 용서하십시오’의 병렬도 권면 문맥에서 매끄럽고, 문장 전체의 격식이 일관됩니다.
  terminology: ‘주’, ‘용서’, ‘용납’은 한국어 성경 번역 및 교회 언어에서 널리 통용되는 적절한 표현입니다. ‘주’의 지시 대상을 번역문에서 불필요하게 특정하지 않아 원문의 호칭을 보존합니다.
