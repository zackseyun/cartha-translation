  to: 무슨 일을 하든지, 마음[a]을 다하여 주께 하듯 하고 사람들에게 하듯이 하지 마십시오.
  rationale: 「마음을 다하여」로 ἐκ ψυχῆς의 내적 성실성과 전적인 헌신을 자연스럽게 나타내고, 직역은 각주에 보존했습니다. 「주께 하듯 하고 사람들에게 하듯이 하지 마십시오」는 ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις의 대조를 자연스러운 합쇼체로 재구성하며, 주어와 명령의 범위를 불필요하게 좁히지 않습니다.
