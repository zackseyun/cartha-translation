    rationale: ἐργάζεσθε는 여기서 직업적 노동만이 아니라 앞의 「무엇을 하든지」에 해당하는 모든 행위를 포괄하는 권면입니다. 「하십시오」가 그 폭을 더 잘 유지합니다.
  revised_text: 무슨 일을 하든지, 마음[a]을 다하여 주께 하듯 하고 사람들에게 하듯이 하지 마십시오.
