  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존했으나, 「마음으로부터 일하십시오」 뒤에 「…하듯이 하십시오」를 덧붙인 현 문장은 헬라어의 단일 권면을 한국어에서 부자연스럽게 중복합니다. 또한 ἐργάζεσθε는 문맥상 단순한 직업 노동에 한정되지 않으므로 「무엇을 하든지」와 호응하는 「하십시오」가 더 적절합니다.
  naturalness: 「마음을 다하여」는 ἐκ ψυχῆς의 진심과 전심의 뉘앙스를 현대 표준 한국어로 자연스럽게 전달합니다. 「주께 하듯 하고 사람들에게 하듯이 하지 마십시오」는 대조를 분명하고 자연스럽게 살립니다.
  terminology: κύριος는 문맥과 영어 POB의 결정을 따라 「주」로 유지했습니다. ἀνθρώποις는 남성 한정이 아닌 일반적 인간을 가리키므로 「사람들」로 옮겼습니다. 「영혼」의 직역적 이미지는 각주에서 보존합니다.
  issues:
  - severity: medium
    issue: 술어의 부자연스러운 중복
    rationale: 초안의 「무엇을 하든지 마음으로부터 일하십시오. 사람을 위해서가 아니라 주를 위해 하듯이 하십시오」는 한 헬라어 명령문을 「일하십시오」와 「하십시오」로 중복하여 옮겨, 문장이 다소 어색하고 의미 초점이 분산됩니다.
  - severity: low
