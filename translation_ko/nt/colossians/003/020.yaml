revisions:
- from: 자녀들이여, 모든 일에 여러분의 부모에게 순종하십시오. 이는 주 안에서 기뻐하실 일이기 때문입니다.
  to: 자녀들이여, 모든 일에서 여러분의 부모에게 순종하십시오. 이는 주 안에서 기쁘게 여겨지는 일이기 때문입니다.
  rationale: The revision preserves the direct address, imperative, and unrestricted extent stated in the verse. “주 안에서 기쁘게 여겨지는” keeps ἐν κυρίῳ as a relational phrase and avoids resolving its debated nuance as either merely ‘pleasing the Lord’ or an explicit limitation on the command. No footnote is required in Korean because the translation itself preserves the ambiguity.
  reviewer_model: gpt-5.6-terra
