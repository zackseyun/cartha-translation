  to: 여러분은 주께로부터 유업의 보상[a]을 받을 것을 알고 있습니다. 여러분은 주 메시아를 섬기고 있습니다.
  rationale: 직설법 δουλεύετε를 ‘섬기고 있습니다’로 바로잡아 원문의 문법과 문맥적 기능을 보존했습니다. ‘기업의 상’은 현대어에서 모호할 수 있으므로, κληρονομία와 ἀνταπόδοσις의 의미를 더 분명히 드러내는 ‘유업의 보상’으로 고쳤습니다. εἰδότες의 참여적 연결은 ‘받을 것을 알고 있습니다’로 유지하여 인과 관계를 과도하게 확정하지 않았습니다.
