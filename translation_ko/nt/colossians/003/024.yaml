review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. δουλεύετε는 현재 능동 직설법 2인칭 복수이며, 본문은 명령이 아니라 독자들이 실제로 누구를 섬기고 있는지를 확인하는 진술입니다. 또한 ἀπολήμψεσθε는 미래 중간태이지 수동태가 아닙니다. 수정문은 이 문법적 차이를 반영합니다.
  naturalness: ‘유업의 보상’은 ‘기업의 상’보다 현대 표준어에서 자연스럽고, 기업(企業)과의 혼동도 피합니다. ‘알고 있습니다’와 ‘섬기고 있습니다’는 합쇼체 문체를 유지하면서 분사와 직설법의 연결을 무리 없이 드러냅니다.
  terminology: κληρονομία는 신학적 문맥에서 ‘유업’으로, ἀνταπόδοσις는 ‘보상’으로 옮기는 것이 적절합니다. Χριστός의 칭호적 용법은 ‘메시아’로 유지합니다. κύριος는 ‘주’로, δουλεύω는 문맥상 ‘섬기다’로 옮깁니다.
  issues:
  - severity: high
    issue: ‘주 메시아를 섬기십시오’가 δουλεύετε를 명령형으로 바꿈
    rationale: SBLGNT의 δουλεύετε는 현재 능동 직설법 2인칭 복수입니다. 권면 문맥이더라도 형태를 명령형으로 바꾸면 본문이 말하는 확인·동기의 진술을 직접 명령으로 변경하게 됩니다.
  - severity: medium
    issue: ‘기업의 상’의 현대어 모호성
    rationale: ‘기업’은 오늘날 일반적으로 사업체를 먼저 떠올리게 합니다. κληρονομία의 성경적 의미를 살리는 ‘유업’이 더 명료하며, ‘보상’은 ἀνταπόδοσις의 보답·갚음의 뜻을 자연스럽게 전달합니다.
  - severity: low
    issue: 어휘 결정 설명의 ‘미래 수동’ 분석
    rationale: ἀπολήμψεσθε는 미래 중간태 형태입니다. 본문 번역은 ‘받을 것’으로 가능하지만, 분석상 수동태라고 해서는 안 됩니다.
  revised_text: 여러분은 주께로부터 유업의 보상[a]을 받을 것을 알고 있습니다. 여러분은 주 메시아를 섬기고 있습니다.
