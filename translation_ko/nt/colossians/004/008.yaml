review_pass:
  verdict: revise
  source_fidelity: 주절과 ‘바로 이 목적으로’는 원문의 의미를 잘 반영합니다. 그러나 목적절 첫 부분의 ‘여러분이 우리의 형편을 알게 하고’는 문맥상 사도 자신이 독자들을 ‘알게 하게 한다’는 사역 구조로 읽힐 수 있고, 뒤의 ‘그가’와 병렬되는 두 목적절의 관계가 불분명합니다. 두 번째 목적은 디기고가 독자들의 마음을 격려하는 것입니다.
  naturalness: 초안의 ‘보냈으니 … 하려는 것입니다’는 문장 연결이 다소 무겁고, ‘알게 하고 그가’의 주어 전환도 매끄럽지 않습니다. 목적을 먼저 명시하고 주절을 뒤에 두면 현대 표준어 합쇼체로 더 자연스럽고 분명합니다.
  terminology: τὰ περὶ ἡμῶν을 ‘우리의 형편’으로 옮긴 것은 적절합니다. παρακαλέσῃ는 이 문맥에서 ‘위로’보다 ‘격려’가 더 넓고 원문에 충실합니다. ‘마음’은 καρδίας의 성경적 표현을 잘 보존합니다.
  issues:
  - severity: medium
    issue: 목적절의 병렬 및 주어 관계가 불명확함
    rationale: 원문은 ‘여러분이 우리의 형편을 알게 하고’와 ‘그가 여러분의 마음을 격려하게 하려는’ 두 목적을 제시합니다. 초안은 첫 절의 ‘알게 하고’가 문법상 ‘내가 여러분을 알게 한다’로 들리고, 이어지는 ‘그가’의 전환이 어색합니다.
  - severity: low
    issue: παρακαλέσῃ를 ‘위로하게’로 한정함
    rationale: 위로도 가능한 뜻이지만, 소식을 전하는 파송 목적 및 영어 감사본의 ‘encourage’에 비추어 ‘격려하게’가 원문의 강화·권면·위로를 더 포괄적으로 반영합니다.
  revised_text: 나는 여러분이 우리의 형편[a]을 알게 하고 그가 여러분의 마음을 격려하도록 하려고 바로 이 목적으로 그를 여러분에게 보냈습니다.
