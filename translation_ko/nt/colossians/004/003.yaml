    issue: 「하나님께서 … 하시기를 구하는 것입니다」가 권면을 서술문으로 전환합니다.
    rationale: προσευχόμενοι는 앞 절의 명령에 딸린 분사이므로, 한국어에서도 청자를 향한 기도 권면으로 유지하는 것이 적절합니다.
  - severity: medium
    issue: 「이 비밀 때문에」가 δι’ ὃ의 선행사를 확정합니다.
    rationale: 중성 관계대명사 ὃ는 바로 앞의 「비밀」을 받을 가능성이 크지만, 말씀/선포 전체를 가리킬 여지도 있습니다. 「그것 때문에」로 모호성을 보존합니다.
  - severity: low
    issue: 「나도」가 누락되었습니다.
    rationale: καὶ는 바울 자신도 그 일로 매여 있음을 덧붙입니다.
