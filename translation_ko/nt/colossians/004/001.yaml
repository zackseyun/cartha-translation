review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies human masters, enslaved persons, what is right, equitable treatment, and the heavenly Lord. However, 「주를 모시고 있음을」 makes ἔχετε (‘have’) sound primarily like reverential service and unnecessarily weakens the verse’s deliberate master/Lord parallel.
  naturalness: The main exhortation is clear and uses appropriate modern formal-polite register. 「여러분에게도 하늘에 주님이 계심을 아십시오」 is more natural Korean for the participial ground and avoids the altered nuance of 「모시고 있다」.
  terminology: 「주인들」 and 「노예들」 faithfully preserve the social relationship. 「주님」 appropriately distinguishes the heavenly κύριος from the human 「주인들」. The ἰσότης footnote should present ‘equality’ as a lexical alternative without internal project-policy language.
  issues:
  - severity: medium
    issue: 「여러분 자신도 하늘에 주를 모시고 있음을」 for καὶ ὑμεῖς ἔχετε κύριον ἐν οὐρανῷ
    rationale: ἔχετε states that the masters themselves have a Lord. 「주를 모시다」 can mean to serve or venerate a lord and thus shifts the stated relationship. It also uses 「주」 where 「주님」 is the natural modern Korean divine title in this contrast.
  - severity: low
    issue: Footnote a cites internal policy material rather than supplying a reader-facing lexical note.
    rationale: A published footnote should explain the translation alternative directly. The source does not require a note here, but if the anchor is retained, it should neutrally state the lexical alternative.
  revised_text: 주인들이여, 여러분의 노예들[a]에게 옳은 것과 공정한 것[b]을 베푸십시오. 여러분에게도 하늘에 주님이 계심을 아십시오.
