  source_fidelity: 개정이 필요합니다. σύν Ὀνησίμῳ는 앞 절의 두기고가 오네시모와 동행함을 나타내는데, 초안의 「두기고와 함께 오네시모가 가는데」는 오네시모를 ‘가는’ 행위의 주된 주어로 만들고 앞 절의 두기고를 직접 보충합니다. 또한 ἀγαπητῷ는 수동적·관계적 의미의 ‘사랑받는’이 적절하며, 「사랑하는」은 오네시모가 사랑하는 쪽이라는 능동적 의미로도 읽힙니다.
  naturalness: 「…인 오네시모도 함께 갑니다」는 한국어로 자연스럽고, 문맥상 앞 절의 두기고와의 동행을 명료하게 드러냅니다. 이어지는 「그들이」도 두 사람을 자연스럽게 가리킵니다. 합쇼체 종결을 유지했습니다.
