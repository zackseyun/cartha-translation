  source_fidelity: πρὸς τοὺς ἔξω는 공동체 밖의 사람들을 향한/대하는 태도를 가리키며, καιρός는 특히 적절한 때 또는 기회의 뉘앙스를 지닙니다. 개정문은 이 두 요소와 ἐξαγοραζόμενοι의 ‘기회를 최대한 활용하다’라는 관용적 의미를 충실히 반영합니다.
  naturalness: 초안의 ‘외부 사람들을 대하여’는 조사 결합이 비문입니다. ‘외부 사람들을 대할 때’로 고치면 현대 표준어 합쇼체에서 자연스럽고, 문장의 관계도 분명해집니다.
  terminology: ‘외부 사람들’은 τοὺς ἔξω의 간결한 번역으로 유지하되, 각주에서 믿는 공동체 밖의 사람들이라는 문맥상 뜻을 밝혔습니다. ‘기회를 최대한 활용하십시오’는 καιρός와 ἐξαγοράζω의 문맥적 의미를 자연스럽게 전달합니다.
