review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영되었으나, 본문의 「외부 사람들[a]을 대하여」는 조사 결합이 비문입니다. 또한 καιρός는 단순한 연대기적 ‘시간’보다 알맞은 ‘때/기회’의 뜻이 두드러지므로 본문에서 ‘기회’로 옮기는 것이 자연스럽고 충실합니다.
  naturalness: ‘밖에 있는 사람들을 대할 때에는 지혜롭게 행하고’는 현대 표준 한국어 합쇼체에서 자연스럽고, περιπατεῖτε의 삶의 방식이라는 비유도 유지합니다. 두 동작을 ‘-고’로 연결하여 명령의 흐름을 명료하게 했습니다.
  terminology: τοὺς ἔξω는 신앙 공동체 밖의 사람들을 가리키므로 ‘밖에 있는 사람들’로 번역하고 각주에서 그 범위를 밝혔습니다. ἐξαγοραζόμενοι는 이 문맥에서 속죄의 의미가 아니라 기회를 충분히 활용한다는 관용적 의미이므로 ‘기회를 최대한 활용하십시오’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘외부 사람들을 대하여’의 조사 사용
    rationale: ‘대하다/대하여’에는 부사격 조사 ‘에’가 필요합니다. 원문 문구는 문법적으로 자연스럽지 않습니다.
  - severity: low
    issue: καιρός를 본문에서 ‘시간’으로 번역
    rationale: 가능한 번역이지만, 이 관용구에서는 ‘기회’가 문맥상의 적절한 때라는 의미를 더 잘 드러냅니다. 각주의 설명과도 일치하도록 조정하는 것이 좋습니다.
  revised_text: 밖에 있는 사람들을 대할 때에는 지혜롭게 행하고, 기회를 최대한 활용하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「외부 사람들」. 곧 믿는 공동체 밖에 있는 사람들.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 「때를 사들이다」. 여기서는 「기회를 최대한 활용하다」라는 관용적 의미입니다.
    reason: lexical_alternative
  revision_rationale: 문법 오류를 바로잡고, πρὸς τοὺς ἔξω의 대인적 방향성을 ‘대할 때’로 자연스럽게 표현했습니다. καιρός의 기회라는 뉘앙스와 ἐξαγοράζω의 관용적 의미를 본문과 각주에 일관되게 반영했습니다. 속죄나 교리적 의미는 추가하지 않았습니다.
