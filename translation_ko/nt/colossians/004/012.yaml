review_pass:
  verdict: revise
  source_fidelity: 초안은 본문의 주요 의미를 충실히 반영하지만, 「자기 기도들 가운데」와 「충분히 확신한 자로」는 한국어로 부자연스럽습니다. 수정안은 ὁ ἐξ ὑμῶν, δοῦλος Χριστοῦ, ἀγωνιζόμενος, 목적절, 그리고 ἐν παντὶ θελήματι τοῦ θεοῦ의 범위를 유지합니다. Χριστοῦ에는 ‘예수’를 보태지 않고 「메시아」로 옮겼습니다.
  naturalness: 「여러분 가운데 한 사람인」, 「언제나 기도 가운데 여러분을 위하여 애쓰고 있습니다」, 「성숙하고 온전히 확신한 채 굳게 서도록」은 현대 표준어 합쇼체에서 자연스럽고, 기도 안에서 지속적으로 수고한다는 의미를 명료하게 전달합니다.
  terminology: 「메시아」는 Χριστός의 칭호 의미를 보존하며, 「노예」는 δοῦλος의 강한 소속·예속 표현을 반영합니다. τέλειοι는 「성숙하고」, πεπληροφορημένοι는 문맥상 「온전히 확신한 채」로 옮기되, ‘굳게 세워짐’의 가능성은 각주에 보존했습니다.
  issues:
  - severity: medium
    issue: 「자기 기도들 가운데」는 직역투이며 한국어에서 부자연스럽습니다.
    rationale: ἐν ταῖς προσευχαῖς는 반복되는 에바브라의 기도라는 뜻이므로 「언제나 기도 가운데」가 자연스럽게 그 의미를 전달합니다.
  - severity: medium
    issue: 「충분히 확신한 자로」는 한국어 결합이 어색하고 πεπληροφορημένοι의 상태성을 충분히 살리지 못합니다.
    rationale: 「온전히 확신한 채」는 완료 수동 분사가 나타내는 충만한 확신의 상태를 자연스럽게 표현합니다.
  - severity: low
    issue: 각주 a에 내부 지침명(DOCTRINE.md)을 언급합니다.
    rationale: 출판용 각주는 원어의 의미와 번역 대안을 설명해야 하므로 내부 편집 지침 언급을 제거하는 것이 적절합니다.
  revised_text: 여러분 가운데 한 사람인 메시아의 노예 에바브라가 여러분에게 문안합니다. 그는 여러분이 하나님의 모든 뜻 안에서 성숙하고 온전히 확신한 채 굳게 서도록, 언제나 기도 가운데 여러분을 위하여 애쓰고 있습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「메시아의 종」. 헬라어 δοῦλος는 메시아께 속하여 헌신한 관계를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「온전히 확신하고 굳게 세워진 채」. 헬라어 πεπληροφορημένοι는 충만한 확신을, 문맥에 따라 굳게 정착된 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 문장 순서를 한국어에 맞게 다듬고, 에바브라의 지속적인 중보 기도와 그 목적을 명확히 했습니다. 본문의 의미를 추가하거나 축소하지 않았으며, πεπληροφορημένοι의 해석상 여지는 각주로 유지했습니다.
