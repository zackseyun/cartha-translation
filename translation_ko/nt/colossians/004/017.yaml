  source_fidelity: 본문의 명령 구조와 ἐν κυρίῳ의 기본 의미는 대체로 잘 반영했습니다. 다만 διακονία를 「직분」으로 옮기면 특정 교회 직책을 뜻하는 것으로 다소 과도하게 한정될 수 있으며, 현재 인용문의 「잘 살펴 이루도록 하시오」는 목적어와 동작의 관계가 불분명합니다.
  naturalness: 「아킵보에게 …라고 전하십시오」는 회중을 향한 복수 명령을 합쇼체로 자연스럽게 옮긴 것입니다. 직접 인용 안에서는 「사역에 유의하여 그것을 이루도록 하시오」가 더 명료하고 자연스럽습니다.
  terminology: 「사역」은 여기서 맡겨진 그리스도인 섬김·책임을 가리키는 διακονία의 범위를 유지하며, 교회 직분으로 한정하지 않습니다. κύριος는 「주」로 유지합니다. 각주는 「주께로부터」가 가능한 해석임을 제시하되, ἐν이 그 뜻을 직접 표현한다고 단정하지 않도록 조정합니다.
