review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 비유는 대체로 반영되었으나, 초안의 “여러분의 말이 … 하십시오”는 주어와 명령형 서술어의 결합이 문법적으로 부자연스럽습니다. 또한 “알게 됩니다”는 권면의 결과·목적을 서술적 현재형으로 처리하여 합쇼체 권면의 흐름이 약해집니다.
  naturalness: “여러분은 언제나 은혜롭게, 소금으로 맛을 낸 것처럼 말하십시오”는 현대 표준어 합쇼체로 자연스럽고, 원문의 은혜와 소금의 비유를 모두 유지합니다. “그리하면 … 알게 될 것입니다”는 εἰδέναι의 목적·결과적 연결을 무리 없이 드러냅니다.
  terminology: λόγος는 문맥상 “말하다”로 자연스럽게 구현하였고, ἐν χάριτι는 “은혜롭게”로 옮겨 친절하고 호의적인 말의 뜻을 보존했습니다. ἅλατι ἠρτυμένος의 소금 비유는 해설로 본문에서 대체하지 않고 유지했습니다. “각 사람”은 ἑνὶ ἑκάστῳ의 개별성을 반영합니다.
  issues:
  - severity: medium
    issue: 첫 문장의 문법적 결속이 부자연스럽습니다.
    rationale: “여러분의 말이 항상 은혜로 … 같게 하십시오”는 ‘말이’라는 주어에 ‘하십시오’가 직접 연결되어 현대 한국어 합쇼체 문장으로 매끄럽지 않습니다.
  - severity: low
    issue: 결말의 시제·양태가 권면의 목적/결과 연결을 충분히 반영하지 못합니다.
    rationale: “알게 됩니다”보다 “알게 될 것입니다”가 앞선 명령에 따른 결과·목적의 관계를 더 자연스럽게 나타냅니다.
  - severity: low
    issue: 소금 비유에 대한 문화적 각주가 영어 POB 감사 기록과 달리 누락되었습니다.
    rationale: 본문의 의미를 특정 교리로 제한하지 않으면서, 비유가 적절하고 지혜로운 말을 가리킨다는 최소한의 안내를 제공하는 것이 유익합니다.
  revised_text: 여러분은 언제나 은혜롭게, 소금으로 맛을 낸 것처럼 말하십시오.[a] 그리하면 각 사람에게 어떻게 대답해야 할지를 알게 될 것입니다.
