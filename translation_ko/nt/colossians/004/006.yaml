    reason: cultural_note
  revision_rationale: 문법적으로 불안정한 명사 주어+명령형 구성을 직접적인 합쇼체 권면으로 고쳤습니다. “은혜롭게”와 “소금으로 맛을 낸 것처럼”을 병치하여 원문의 두 수식어와 비유를 보존했으며, 결말은 앞선 권면의 목적 또는 결과를 나타내도록 조정했습니다. 문화적 각주는 영어 POB의 b 각주에 상응하도록 추가하되, 본문에는 별도 앵커를 두지 않아 번역 본문의 의미나 구조를 바꾸지 않았습니다.
