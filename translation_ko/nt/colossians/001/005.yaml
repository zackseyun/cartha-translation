  to: 이는 여러분을 위해 하늘[a]에 간직되어 있는 소망 때문입니다. 여러분은 복음인 진리의 말씀을 통하여 이 소망에 대하여 이미 들었습니다.
  rationale: 원문의 인과 관계, ‘여러분을 위해’라는 수익 여격, 하늘에 보관된 소망, 그리고 복음의 메시지 안에서 앞서 그 소망을 들었다는 내용을 유지했습니다. 「간직되어 있는」으로 ἀποκειμένην을 정확히 옮기고, 한국어의 자연스러운 관용을 위해 본문은 「하늘」로 하되 원문의 복수형은 각주에 밝혔습니다.
