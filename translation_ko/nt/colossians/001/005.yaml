  source_fidelity: 「쌓여 있는」은 ἀποκειμένην의 ‘보관되어/예비되어 있는’ 뜻보다 ‘물리적으로 쌓인’ 의미를 강하게 낼 수 있어 교정하는 것이 좋습니다. 또한 οὐρανοῖς의 복수는 한국어 본문에서 자연스럽게 ‘하늘’로 옮기고 각주에서 보존할 수 있습니다. προηκούσατε의 선행성 및 관계대명사가 ‘소망’을 받는 점은 유지했습니다.
  naturalness: 「하늘들에」와 「진리의 말씀 곧 복음 안에서 그 소망을 이미 들었습니다」는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘복음인 진리의 말씀을 통하여’ 및 ‘이 소망에 대하여 이미 들었습니다’가 합쇼체 문장으로 더 자연스럽습니다.
  terminology: 「소망」, 「진리의 말씀」, 「복음」은 적절합니다. ἀπόκειμαι에는 「간직되어 있는」을 사용하여 보존·예비의 뜻을 과도한 해석 없이 드러냈습니다.
