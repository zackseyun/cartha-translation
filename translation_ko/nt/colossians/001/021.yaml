  to: 여러분도 한때는 멀어져 있었고, 악한 행실 가운데서 마음으로 적대적이었습니다—
  rationale: The revision retains the source’s compact ambiguity concerning how evil deeds relate to inward hostility, avoids turning hostility into a durative action, and preserves the cross-verse continuation by means of the dash rather than an added adversative conjunction.
  reviewer_model: gpt-5.6-terra
