review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the former temporal state (ποτε), alienation (ἀπηλλοτριωμένους), inward hostility (ἐχθροὺς τῇ διανοίᾳ), and the association with evil deeds (ἐν τοῖς ἔργοις τοῖς πονηροῖς). However, 「적대하던」 can suggest an ongoing verbal action and 「-었으나」 supplies an adversative connective not present in this verse itself; the Greek instead leaves the clause open for completion in the following verse.
  naturalness: 「마음으로 적대적이었습니다」 is natural modern formal Korean and describes a settled disposition without adding an action. Ending with a dash appropriately retains the source sentence’s continuation while allowing 합쇼체.
  terminology: 「멀어져 있었고」 suitably conveys relational alienation without unnecessarily supplying an explicit object. 「악한 행실 가운데서」 preserves the Greek’s deliberately compact relation between hostility and evil deeds; no causal interpretation is imposed.
  issues:
  - severity: low
    issue: 「적대하던 자들」 may imply a continuing hostile action.
    rationale: ἐχθρούς is a nominal/adjectival description of their state (‘hostile/enemies’), rather than an imperfect-like action of repeatedly opposing someone.
  - severity: low
    issue: 「-었으나」 anticipates the contrast of the next verse within the present verse.
    rationale: The contrast is indeed completed by νυνὶ δέ in verse 22, but verse 21 itself ends with an open construction. A dash can preserve this without adding an explicit adversative here.
  - severity: low
    issue: The draft’s clause ending is not in the requested modern formal-polite style.
    rationale: Using 「-었습니다」 supplies the stipulated 합쇼체 while the em dash retains the incomplete syntactic connection.
  revised_text: 여러분도 한때는 멀어져 있었고, 악한 행실 가운데서 마음으로 적대적이었습니다—
  revised_footnotes: []
  revision_rationale: The revision retains the source’s compact ambiguity concerning how evil deeds relate to inward hostility, avoids turning hostility into a durative action, and preserves the cross-verse continuation by means of the dash rather than an added adversative conjunction.
