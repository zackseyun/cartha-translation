    reason: lexical_alternative
  revision_rationale: 현재 시제의 보유 의미를 「누리고 있습니다」로 반영하고, 동격 구조는 「곧」으로 보존했습니다. 「죄 사함」은 원문의 의미를 손상하지 않으면서 현대 한국어에서 자연스럽습니다. 각주는 본문의 신학적 관계를 해설로 확정하지 않고 공통 어휘 대안만 제시합니다.
