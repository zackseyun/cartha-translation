review_pass:
  verdict: revise
  source_fidelity: 「받았습니다」는 현재 직설법 ἔχομεν(‘우리는 가지고 있다’)을 과거의 수령 사건으로 바꾸므로 수정이 필요합니다. 「누리고 있습니다」는 현재적으로 보유하는 구속의 은혜를 자연스럽게 나타냅니다. δεύτερη 명사구는 동격으로 유지했습니다.
  naturalness: 「죄들의 사함」은 그리스어 복수를 기계적으로 옮긴 표현이라 현대 표준 한국어에서는 다소 부자연스럽습니다. 관용적이고 명료한 「죄 사함」이 적절합니다. 「속량, 곧 죄 사함」은 동격 관계를 자연스럽게 드러냅니다.
  terminology: ἀπολύτρωσις는 본문에서 「속량」으로, ἄφεσις는 「사함」으로 옮겨 신학적 용례와 원문의 구별을 보존했습니다. 각주도 영어 POB 감사 기록처럼 두 명사에 공통으로 가능한 ‘풀어 줌’이라는 어휘 가능성을 알리도록 바로잡았습니다.
  issues:
  - severity: medium
    issue: ἔχομεν의 현재 의미가 「받았습니다」라는 과거 표현으로 바뀌어 있습니다.
    rationale: 원문은 구속을 현재 ‘가지고 있음’을 말합니다. 한국어에서는 「누리고 있습니다」가 이를 자연스럽게 전달합니다.
  - severity: low
    issue: 「죄들의 사함」이 현대 한국어 어법상 부자연스럽습니다.
    rationale: 한국어에서는 집합적 의미의 「죄 사함」이 자연스럽고, 원문의 복수형이 여기서 개별 죄목을 강조한다고 단정할 근거도 없습니다.
  - severity: low
    issue: 각주가 ἀπολύτρωσις만을 설명하면서 「대속」 등을 제시해 영어 POB의 공통 어휘 대안과 일치하지 않습니다.
    rationale: 영어 감사 기록의 각주는 ἀπολύτρωσις와 ἄφεσις 양쪽에 가능한 ‘release’를 알립니다. 이를 한국어에서 「풀어 줌」으로 반영하는 것이 더 정확합니다.
  revised_text: 우리는 그분 안에서 속량[a], 곧 죄 사함을 누리고 있습니다.
  revised_footnotes:
  - marker: a
