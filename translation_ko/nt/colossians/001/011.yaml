review_pass:
  verdict: revise
  source_fidelity: The draft preserves the distinction between δύναμις (능력) and κράτος (위력), and retains the literal genitive expression '그분의 영광의 위력.' However, '강건하게 되어' is a resultative expression and does not clearly convey the ongoing passive force of δυναμούμενοι. Also, '...에 이르고' makes εἰς sound primarily like arrival/result, whereas the context more directly expresses purpose.
  naturalness: '''강건하게'' is markedly traditional and less natural in modern standard Korean. ''강하게 하심을 받아'' is clearer Korean in this formal biblical register and expresses the passive sense without adding an explicit agent. ''온갖 인내와 오래 참음을 위하여'' naturally conveys the comprehensive purpose phrase.'
  terminology: '''영광의 위력'' appropriately preserves the source’s dense wording and distinguishes κράτος from δύναμις. ''인내'' and ''오래 참음'' suitably maintain the distinction between ὑπομονή and μακροθυμία. No footnote is necessary because the Korean text itself retains the more literal rendering rather than adopting the alternative ''영광스러운 권능.'''
  issues:
  - severity: medium
    issue: '''강건하게 되어'' does not clearly represent the present passive participle δυναμούμενοι and is less idiomatic in modern Korean.'
    rationale: -게 되다 can indicate a resulting state rather than the ongoing reception of strengthening. '강하게 하심을 받아' more clearly conveys the passive process in a formal-polite biblical register.
  - severity: medium
    issue: '''모든 인내와 오래 참음에 이르고'' treats εἰς chiefly as arrival at a state.'
    rationale: In this construction εἰς expresses the aim/result of the strengthening. '온갖 인내와 오래 참음을 위하여' more directly preserves the purposive force without over-specifying the result.
  revised_text: 그분의 영광의 위력에 따라 모든 능력으로 강하게 하심을 받아, 기쁨으로 온갖 인내와 오래 참음을 위하여,
  revised_footnotes: []
  revision_rationale: The revision updates the less natural '강건하게' while more clearly reflecting the ongoing passive participle. It also renders εἰς with a purpose-oriented Korean phrase. The literal expression '그분의 영광의 위력' is retained, preserving the source wording and the English POB audit trail’s decision not to collapse it into '영광스러운 권능.' The trailing comma is retained because this verse is a syntactic continuation of the surrounding prayer sentence.
