    rationale: 「이제」만으로는 δέ의 대조적 연결이 충분히 드러나지 않습니다. 「그러나 이제」가 앞 절의 이전 상태와의 전환을 자연스럽게 나타냅니다.
  - severity: low
    issue: 각주가 '메시아'라는 명칭을 추가함
    rationale: σάρξ의 문자적 의미를 설명하는 데 「메시아」라는 원문 밖의 명칭은 필요하지 않습니다. 「그분의 실제 육체」라고 하면 본문의 지시 범위를 유지할 수 있습니다.
  revised_text: 그러나 이제 여러분은 그분의 육체의 몸 안에서 죽음을 통하여 화목하게 되었습니다[a]. 이는 여러분을 그분 앞에 거룩하고 흠 없으며 고발할 수 없는 사람으로 세우기 위함입니다.
