  to: 또한 하나님께서는 그분을 통하여 만물을 자신과 화목하게 하시기를 기뻐하셨습니다. 곧 그분의 십자가의 피를 통하여 평화를 이루시고, 그분을 통하여 땅 위에 있는 것들이든 여러 하늘에 있는 것들이든 화목하게 하시기를 기뻐하셨습니다.[a][b][c]
  rationale: 하나님께서 화목하게 하시는 분이고 그분(아들)이 매개자라는, 앞 절에서 계속되는 구문 관계를 명료하게 하였습니다. 이는 논쟁적 교리 결론을 추가하지 않으면서 εἰς αὐτόν의 「자신과」 및 「그분의 십자가」를 각각 자연스럽게 보존합니다. 두 번째 「그분을 통하여」는 본문에 유지하되 해당 사본상 이문을 주석으로 표시했습니다.
