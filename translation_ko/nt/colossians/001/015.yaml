  to: 그분은 보이지 않는 하나님의 형상이시며, 모든 피조물의 맏아들이십니다[a].
  rationale: 본문은 논쟁적인 πάσης κτίσεως 속격을 한국어에서도 「모든 피조물의」로 유지하여 원문의 모호성을 보존했습니다. πρωτότοκος는 자연스럽고 전통적으로 알아들을 수 있는 「맏아들」로 옮겼습니다. 각주는 시간적 의미와 지위적 의미를 모두 제시하되 어느 한 해석을 교리적으로 확정하지 않도록 수정했으며, 표제어와 직접 관련되도록 표지를 문장 끝에 배치했습니다.
