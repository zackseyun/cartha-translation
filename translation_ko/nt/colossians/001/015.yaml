  source_fidelity: 「형상」과 「보이지 않는 하나님」은 εἰκών 및 τοῦ θεοῦ τοῦ ἀοράτου를 충실히 옮깁니다. 그러나 「모든 피조물의 먼저 나신 분」은 πρωτότοκος의 명사적 칭호를 한국어에서 부자연스럽게 풀어 쓰며, ‘먼저 출생함’만을 지나치게 전면화합니다. 「모든 피조물의 맏아들」은 원문의 속격 관계와 ‘firstborn’의 의도적 긴장을 더 직접적으로 보존합니다.
  naturalness: 「보이지 아니하시는」은 문법상 가능하지만 현대 표준어에서는 「보이지 않는」이 더 자연스럽습니다. 또한 「모든 피조물의 먼저 나신 분」은 한국어 명사구로 매끄럽지 않습니다. 「그분은 … 형상이시며, 모든 피조물의 맏아들이십니다」는 현대 합쇼체로 자연스럽고 본문의 선포적 문체를 유지합니다.
  terminology: 「하나님」과 「형상」은 한국어 성경 문맥에서 적절합니다. πρωτότοκος는 본문에서 「맏아들」로 옮기고, 각주에서 시간적 선후뿐 아니라 지위·상속의 함의를 가질 수 있음을 중립적으로 밝혀야 합니다. 현 각주의 ‘피조물에 속한다는 뜻이 아니다’라는 단정은 이 한 구절의 번역 각주가 해석적·교리적으로 결론을 앞서 제시하는 것이므로 삭제하는 것이 좋습니다.
