  source_fidelity: 개정이 필요합니다. πᾶν τὸ πλήρωμα는 중성 단수 주격으로서 εὐδόκησεν과 문법적으로 연결됩니다. 본문의 존대 동사 「기뻐하셨기」는 명시되지 않은 인격적 주어를 사실상 도입하므로, 원문의 문법적 표현과 맞지 않습니다.
  naturalness: 「모든 충만이 … 기뻐하였기 때문입니다」는 다소 낯설 수 있으나, 원문의 의인화된 문법과 해석상의 긴장을 가장 적절히 보존합니다. 종결을 「때문입니다」로 하여 현대 표준어 합쇼체 문장으로 완결했습니다.
  terminology: 「충만」, 「그분 안에」, 「거하다」는 적절합니다. 다만 주어를 하나님으로 단정하는 존대법은 삭제해야 합니다.
  issues:
  - severity: high
    issue: 「기뻐하셨기」가 비명시적인 인격적 주어를 본문에 도입함
    rationale: 원문의 동사는 πᾶν τὸ πλήρωμα와 문법적으로 단수 주어-동사 관계를 이룹니다. 존대 선어말어미 「-시-」는 하나님 또는 다른 존귀한 인격을 주어로 전제하여, 본문의 문법적 긴장과 번역의 주어 미명시 방침을 훼손합니다.
  - severity: medium
    issue: 각주 b의 ‘헬라어는 주어를 명시하지 않는다’는 설명이 부정확함
    rationale: πᾶν τὸ πλήρωμα는 주격 명사구로 명시되어 있습니다. 다만 이것을 문법적 주어로 볼지, 하나님이 생략된 표현으로 이해할지에 관하여 해석적 논의가 있으므로, 각주는 그 점을 정확히 밝혀야 합니다.
  revised_text: 이는 모든 충만[a]이 그분 안에 거하기를 기뻐하였기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 「모든 충만」은 흔히 「하나님의 충만」으로 이해됩니다. 골로새서 2:9을 보십시오.
    reason: cross_reference
  - marker: b
    text: 헬라어에서 「모든 충만」은 동사와 문법적으로 연결됩니다. 많은 번역은 문맥에 따라 「하나님이 모든 충만이 그분 안에 거하도록 기뻐하셨다」라고 풀이하지만, 하나님 또는 아버지라는 명칭은 이 절에 명시되어 있지 않습니다.
