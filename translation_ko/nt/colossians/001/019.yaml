    issue: 「기뻐하셨기」의 주어 연결과 높임법
    rationale: 초안의 조사 배열에서는 「모든 충만」이 ‘기뻐하셨다’의 주어처럼 연결될 수 있습니다. 또한 높임 선어말어미는 헬라어에 명시되지 않은 행위자에 대한 존귀성을 부가합니다. 「모든 충만이 … 거하도록 기뻐한」으로 바꾸면 충만은 거함의 주어로, εὐδόκησεν의 행위자는 무표지로 남습니다.
  revised_text: 이는 모든 충만[a]이 그분 안에 거하도록 기뻐한 까닭입니다[b].
  revised_footnotes:
