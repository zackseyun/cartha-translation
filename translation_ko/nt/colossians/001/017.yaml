  source_fidelity: 「만물보다 먼저」는 πρὸ πάντων의 시간적 우선을 충실히 옮깁니다. 그러나 συνέστηκεν은 완료형으로서 만물이 그분 안에서 지속적으로 결속·존속하는 상태를 나타내는데, 「함께 서 있습니다」는 한국어에서 어색하며 그 뜻이 충분히 드러나지 않습니다.
  naturalness: 「그분은 만물보다 먼저 계시고」는 현대 한국어 합쇼체로 자연스럽습니다. 반면 「만물은 그분 안에서 함께 서 있습니다」는 한국어 관용에 맞지 않고, 물리적으로 함께 서 있는 듯한 뜻으로 오해될 수 있습니다.
