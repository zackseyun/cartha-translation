  to: 나는 하나님께서 여러분을 위하여 내게 주신 청지기 직분에 따라 그 교회의 일꾼이 되었습니다. 이는 하나님의 말씀을 이루기 위해서입니다.[a]
  rationale: 문장을 둘로 나누어 원문의 의미 관계를 보존하면서도 현대 표준 한국어 합쇼체로 자연스럽게 다듬었습니다. ‘여러분을 위하여’를 ‘하나님께서 … 주신 청지기 직분’에 연결하고, πληρῶσαι의 목적 용법은 ‘이는 … 위해서입니다’로 명시했습니다. 논쟁적인 πληρόω의 뉘앙스는 본문에서 넓게 ‘이루다’로 유지하고 각주에 대안을 제시했습니다.
