  source_fidelity: 핵심 어휘 선택은 대체로 적절합니다. 다만 εἰς ὑμᾶς는 ‘여러분을 위하여’라는 말로 청지기 직분에 직접 연결하는 편이 원문의 수식 관계를 더 분명히 드러냅니다. πληρῶσαι의 목적 용법도 독립된 목적 진술로 자연스럽게 표현할 필요가 있습니다.
  naturalness: 초안의 ‘…일꾼이 되었으니, 곧 여러분을 위하여 하나님의 말씀을 이루기 위함입니다’는 서술 주체와 ‘위함입니다’의 보어 구성이 어색하며, 현대 합쇼체 문장으로 매끄럽지 않습니다.
  terminology: ‘교회의 일꾼’, ‘청지기 직분’, ‘하나님의 말씀’, ‘이루다’는 모두 문맥상 사용할 수 있습니다. ‘청지기 직분’은 원문의 맡겨진 책무라는 의미를 전달하며, 후대 교회 직제를 뜻하는 ‘집사’는 피합니다.
  issues:
