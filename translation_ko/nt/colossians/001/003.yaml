  source_fidelity: 「기도할 때마다」는 현재분사 προσευχόμενοι를 반복적 계기('기도할 때마다')로 구체화하고, 「늘」과 결합하여 πάντοτε의 수식 범위를 다소 흐립니다. 원문은 ‘여러분을 위해 기도하면서’라는 동시적 정황 아래 ‘언제나 감사한다’고 말합니다.
  naturalness: 수정문은 합쇼체의 격식을 유지하면서도 ‘언제나 감사드립니다’가 주동사를 자연스럽게 수식하게 합니다. 「아버지이신 하나님」은 한국어에서 자연스럽게 동격 관계를 드러냅니다.
  terminology: κύριος는 「주」, Χριστός는 칭호의 의미를 살린 「메시아」로 유지합니다. 각주에서는 전통적 대안인 「예수 그리스도」를 간결하게 제시합니다.
