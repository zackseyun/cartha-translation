  - severity: low
    issue: 「늘」의 위치와 「기도할 때마다」의 결합
    rationale: πάντοτε는 주동사 Εὐχαριστοῦμεν을 수식합니다. 「언제나 감사드립니다」로 두면 수식 관계가 더 분명합니다.
  - severity: low
