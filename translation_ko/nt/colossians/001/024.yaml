  rationale: 수정문은 두 현재 직설법을 각각 「기뻐합니다」와 「채워 가고 있습니다」로 옮겨 원문의 병렬 구조를 보존했습니다. 「여러분을 위하여 받는 고난」은 ὑπὲρ ὑμῶν과 바울 자신의 고난이라는 문맥을 자연스럽게 반영하며, 「내 육체 안에서」는 ἐν τῇ σαρκί μου를 직접적으로 옮깁니다. 「부족한 것」이라는 본문의 긴장은 유지하고, 각주에서는 속죄의 결핍을 주장하는 것으로 읽지 않도록 문맥적 설명만 제공했습니다.
