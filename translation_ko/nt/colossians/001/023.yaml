review_pass:
  verdict: revise
  source_fidelity: 조건사 εἴ γε의 강조와 조건성은 살려야 하나, 초안의 「곧」은 이에 해당하지 않으며 「그렇습니다」와의 연결도 다소 부자연스럽습니다. 또한 τεθεμελιωμένοι(완료 수동)와 ἑδραῖοι를 「터 위에 굳게 서서 흔들리지 않고」로 합치면서, 뒤의 μὴ μετακινούμενοι 및 ‘소망에서 떠남’의 이미지를 중복시키고 수동성을 약화합니다. κτίσις의 주 본문은 영어 POB 및 문맥에 맞추어 ‘창조’의 넓은 의미를 보존하는 편이 안전합니다.
  naturalness: 「참으로」, 「믿음 안에 계속 머물고」, 「기초가 놓여 견고하며」, 「흔들려 … 떠나지 않는다면」은 현대 표준어의 격식 있는 성경 문체로 자연스럽습니다. 이 절의 조건절이 앞 절의 결론에 문법적으로 이어지는 점은 「그렇습니다」로 최소한 표시하되, 앞 절의 내용을 새로 보충하지 않았습니다.
  terminology: πίστις는 「믿음」, εὐαγγέλιον은 「복음」, διάκονος는 제도적 직분을 단정하지 않는 「일꾼」으로 유지합니다. κτίσις는 본문에서 「온 창조 세계」로 옮기고, ‘모든 피조물에게’라는 가능한 분배적 해석을 각주로 남깁니다.
  issues:
  - severity: medium
    issue: εἴ γε를 「곧」으로 옮김
    rationale: 「곧」은 설명·동격을 나타내며, 조건사 εἰ와 강조사 γε의 ‘참으로/과연 …한다면’이라는 조건적 힘을 전달하지 못합니다.
  - severity: medium
    issue: 기초·견고함·이동의 세 표현이 축약되고 중복됨
    rationale: 「터 위에 굳게 서서 흔들리지 않고」는 τεθεμελιωμένοι의 완료 수동 ‘기초가 놓인’ 뜻을 약화하고, ἑδραῖοι와 μὴ μετακινούμενοι를 사실상 한 표현으로 겹칩니다. 세 표현을 각각 드러내는 것이 원문에 더 충실합니다.
  - severity: medium
    issue: κτίσις의 본문 선택과 각주가 서로 충분히 대응하지 않음
    rationale: 본문의 「모든 피조물에」는 수신 대상처럼 읽힐 수 있고, 영어 POB의 주 번역인 ‘all creation’을 놓칩니다. 「온 창조 세계에」로 넓은 의미를 보존하고 ‘모든 피조물에게’를 대안으로 제시하는 편이 좋습니다.
  - severity: low
    issue: διάκονος 각주의 설명이 번역 주석보다 해석적 방침을 앞세움
    rationale: ‘후대의 집사 직제 함의’를 피한다는 설명보다 해당 단어의 가능한 일반 의미를 간결히 제시하는 것이 중립적이고 독자에게 유익합니다.
