revisions:
- from: 곧 여러분이 그 믿음 안에 계속 머무르되, 터 위에 굳게 서서 흔들리지 않고, 여러분이 들은 복음의 소망에서 떠나지 않는다면 그러합니다. 그 복음은 하늘 아래 모든 피조물[a]에 선포되었으며, 나 바울은 그 복음의 일꾼[b]이 되었습니다.
  to: 여러분이 참으로 믿음 안에 계속 머물고, 기초가 놓여 견고하며, 여러분이 들은 복음의 소망에서 흔들려 떠나지 않는다면, 그렇습니다. 이 복음은 하늘 아래 온 창조 세계에[a] 선포되었으며, 나 바울은 이 복음의 일꾼[b]이 되었습니다.
  rationale: 조건문의 강조를 「참으로」와 「~한다면」으로 보존했습니다. 완료 수동 분사, 견고함, 이동됨의 세 병렬 표현을 각각 「기초가 놓여」, 「견고하며」, 「흔들려 떠나지 않는」으로 반영했습니다. κτίσις의 의미가 논쟁될 수 있으므로 본문은 포괄적 의미를 유지하고 대안을 각주에 남겼습니다. 본 절이 앞 절에 종속되는 구문임을 고려하여, 앞 절의 의미를 추가하지 않는 범위에서 「그렇습니다」를 유지했습니다.
  reviewer_model: gpt-5.6-terra
