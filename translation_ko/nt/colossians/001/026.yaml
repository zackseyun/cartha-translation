review_pass:
  verdict: revise
  source_fidelity: 원문의 αἰῶνες는 추상적 ‘영원’이라기보다 ‘시대들/옛 시대들’을 뜻하며, 초안의 「영원 전부터」는 이를 과도하게 일반화합니다. 또한 ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν의 병행을 「시대들과 세대들로부터」로 보존하는 편이 정확합니다. 완료 수동 분사 ἀποκεκρυμμένον은 「감추어져 있던」으로, 수동적 지속 상태를 자연스럽게 나타낼 수 있습니다.
  naturalness: 「곧 … 비밀이지만, 이제는 … 드러났습니다」는 앞 문맥에 연결되는 원문의 동격적 표현과 대조를 한국어로 자연스럽게 재현합니다. 「나타났습니다」보다 「드러났습니다」가 비밀의 공개라는 문맥에 더 적절합니다.
  terminology: 「비밀」은 바울의 μυστήριον에 대한 통상적이고 적절한 역어이며, 「성도들」은 τοῖς ἁγίοις αὐτοῦ를 정확하게 옮깁니다. 「그분의」는 원문의 소유 대명사를 보존합니다.
  issues:
  - severity: medium
    issue: 「영원 전부터」
    rationale: αἰῶνες는 여기서 ‘시대들, 시대들의 흐름’을 가리킵니다. 「영원」은 원문보다 절대적·추상적인 의미를 부가하며, 각주가 그 문제를 인정하더라도 본문 선택으로는 적절하지 않습니다.
  - severity: low
    issue: 「여러 세대로부터」
    rationale: 복수형을 반영하려는 의도는 있으나 「여러」는 원문에 없는 수량적 뉘앙스를 더합니다. 「세대들로부터」가 병행 구조를 더 충실히 보존합니다.
  - severity: low
    issue: 「이는 … 비밀입니다」
    rationale: 원문은 독립적인 정의문이라기보다 앞 문맥의 내용을 받는 동격적 명사구입니다. 「곧」으로 처리하면 문맥 연결과 νῦν δέ의 대조를 더 잘 살릴 수 있습니다.
  revised_text: 곧 시대들과 세대들로부터 감추어져 있던 비밀이지만, 이제는 그분의 성도들에게 드러났습니다.
