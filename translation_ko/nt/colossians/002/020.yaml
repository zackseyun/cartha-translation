review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 στοιχείων은 복수이므로 「원리들」로 옮기는 것이 좋으며, ὡς ζῶντες ἐν κόσμῳ에 없는 「아직」은 제거하는 편이 안전합니다. ἀπό의 분리 의미는 「~에서 벗어나」로 자연스럽게 드러낼 수 있습니다.
  naturalness: 「규례들에 자신을 매이게 하십니까」는 ‘자신을 매이게 하다’의 사역 구성이 부자연스럽고, 원문의 수동/중간적 의미도 매끄럽게 전달하지 못합니다. 「규례들에 복종하십니까」가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: Χριστός를 「메시아」로 처리한 것은 프로젝트 방침과 부합합니다. 「세상의 초보적 원리들」은 στοιχεῖα의 논쟁적인 의미를 지나치게 한쪽으로 확정하지 않는 적절한 본문 선택입니다. 각주의 「영적 세력들」은 ‘elemental spirits’의 대안으로 더 자연스럽습니다.
  issues:
  - severity: medium
    issue: 「규례들에 자신을 매이게 하십니까」의 문법·표현
    rationale: 한국어에서 ‘자신을 매이게 하다’는 부자연스럽고, 독자가 스스로 자신을 속박한다는 사역 의미로 들릴 수 있습니다. δογματίζεσθε의 규례 아래 놓이거나 규례를 따르는 의미는 「규례들에 복종하십니까」로 자연스럽게 표현됩니다.
  - severity: low
    issue: 「초보적 원리」의 단수 처리와 「아직」의 첨가
    rationale: τῶν στοιχείων은 복수이므로 「원리들」이 더 직접적입니다. 「아직」은 문맥상 가능한 강조이나 본문에 명시되지 않았으므로 생략하여 수사적 대조를 보존합니다.
  revised_text: 여러분이 메시아와 함께 세상의 초보적 원리들에서 벗어나 죽으셨다면, 어찌하여 세상 안에서 살고 있는 것처럼 규례들에 복종하십니까?
  revised_footnotes:
  - marker: a
    text: 또는 「세상의 영적 세력들」, 「세상의 기초 원리들」. 2:8 각주 참조.
    reason: alternative_reading
  revision_rationale: 원문의 복수형과 분리 의미를 반영하여 「세상의 초보적 원리들에서 벗어나」로 다듬고, 불필요한 「아직」을 제거했습니다. 또한 δογματίζεσθε를 자연스러운 합쇼체인 「규례들에 복종하십니까」로 고쳤습니다. 본문에서 στοιχεῖα의 정확한 지시 대상을 확정하지 않고 대안은 각주에 보존했습니다.
