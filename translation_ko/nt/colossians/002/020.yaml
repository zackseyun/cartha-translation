review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 「세상의 초보적 원리에서 떠나 죽었다면」은 분리의 대상과 ‘죽다’의 관계가 다소 불분명하며, 복수형 στοιχείων도 본문에서 드러내는 편이 좋습니다. 「아직」은 원문에 없는 시간적 뉘앙스이므로 빼는 것이 적절합니다.
  naturalness: 「규례들에 자신을 매이게 하십니까」는 현대 한국어에서 부자연스럽습니다. 수동/중간태의 의미를 자연스럽게 살려 「규례들의 지배를 받으십니까」로 옮길 수 있습니다.
  terminology: Χριστῷ를 「메시아」로 옮긴 것은 프로젝트 방침 및 원문의 칭호성에 부합합니다. στοιχεῖα는 논쟁적인 표현이므로 「초보적 원리들」을 본문에 두고 대안을 각주로 보존하는 것이 적절합니다. 영어 감사 기록의 δογματίζεσθε 대안도 한국어 각주로 보존합니다.
  issues:
  - severity: medium
    issue: 분리 구문의 결속과 복수형
    rationale: 「원리에서 떠나 죽었다면」은 ‘떠난 뒤 죽었다’는 순차적 의미로도 읽힐 수 있습니다. 「원리들에 대하여 ... 죽었다면」은 ἀπὸ의 분리 의미와 원문의 결속을 더 자연스럽게 드러내며, στοιχείων의 복수형도 반영합니다.
  - severity: low
    issue: 원문에 없는 「아직」
    rationale: ὡς ζῶντες ἐν κόσμῳ는 ‘세상에 사는 사람들처럼/것처럼’이라는 비교 표현이며, ‘아직’이라는 시간적 함의는 명시하지 않습니다.
  - severity: medium
    issue: δογματίζεσθε의 한국어 표현
    rationale: 「자신을 매이게 하다」는 어색하고 행위 주체성을 과도하게 명시합니다. 「규례들의 지배를 받다」는 수동/중간태의 ‘규례에 얽매이다, 규정을 따르도록 되다’라는 뜻을 자연스럽게 유지합니다.
  - severity: low
    issue: 영어 감사 기록의 두 번째 어휘 대안 각주 누락
    rationale: 영어 POB의 ‘do you submit to regulations?’라는 δογματίζεσθε 대안을 한국어에도 별도 각주로 보존하면 감사 기록 및 각주 앵커가 완전해집니다.
  revised_text: 여러분이 세상의 초보적 원리들에 대하여 메시아와 함께 죽었다면, 어찌하여 세상에 사는 사람들처럼 규례들의 지배를 받으십니까[b]?
  revised_footnotes:
  - marker: a
    text: 또는 「세상의 영적 존재들」, 「세상의 기본 요소들」.
    reason: alternative_reading
  - marker: b
    text: 또는 「규례들에 복종하십니까?」
    reason: lexical_alternative
  revision_rationale: 분리의 ἀπό와 죽음의 결속을 한국어에서 명료하게 하고, στοιχεῖα의 복수형 및 논쟁적 의미 범위를 보존했습니다. 불필요한 「아직」을 제거하고, δογματίζεσθε를 자연스러운 수동 표현으로 고쳤습니다. 본문에 a 각주 표지가 반드시 붙어야 하므로, 수정 본문에는 해당 표지를 포함합니다.
