review_pass:
  verdict: revise
  source_fidelity: 원문의 세 분사는 앞 절의 주된 권면에 연결되어 있습니다. 초안은 마지막 분사만 합쇼체 명령으로 처리하여 대체로 연결을 살렸지만, 「감사가 넘치도록 하십시오」는 ‘감사의 정도’를 뜻하는 듯하여 ἐν εὐχαριστίᾳ의 ‘감사 가운데/감사로’라는 의미가 다소 약해집니다. 또한 「그 믿음」은 가능한 해석이나, 본문의 πίστις가 지닌 범위를 본문에서 다소 확정합니다.
  naturalness: 「세움을 받아 가며」와 「굳게 서서」는 이해 가능하지만, 건축 은유의 수동·진행과 βεβαιούμενοι의 ‘견고하게 세워짐’을 더 자연스럽고 일관되게 표현할 수 있습니다. 개정문은 현대 표준어 합쇼체를 유지하면서 분사들의 연쇄를 자연스럽게 연결합니다.
  terminology: ἐρριζωμένοι의 식물 은유와 ἐποικοδομούμενοι의 건축 은유를 보존했습니다. αὐτῷ는 원문처럼 「그분 안에서」로 유지했습니다. τῇ πίστει는 「믿음 안에서」로 두고, 영어 감사 기록에 따른 가능한 의미 범위는 각주로 보존했습니다.
  issues:
  - severity: medium
    issue: 「감사가 넘치도록 하십시오」의 의미 연결
    rationale: περισσεύοντες ἐν εὐχαριστίᾳ는 ‘감사 가운데/감사로 넘쳐 나는’ 뜻입니다. 「감사가 넘치게 하십시오」가 전치사구의 의미와 한국어 표현을 더 충실히 반영합니다.
  - severity: low
    issue: 「그 믿음」이 πίστις의 의미를 본문에서 확정함
    rationale: 문맥상 전수받은 신앙/가르침을 가리킬 가능성이 높지만, 개인적 믿음 또는 충실함의 의미 가능성도 논의됩니다. 본문은 「믿음」으로 유지하고 각주에서 대안을 밝혀 모호성을 보존하는 편이 안전합니다.
  - severity: low
    issue: 건축 은유에서의 수동성과 확고해짐 표현
    rationale: 「세움을 받아 가며」와 「굳게 서서」보다 「세워져 가고」 및 「굳게 세워지며」가 각각 ἐποικοδομούμενοι와 βεβαιούμενοι의 수동적·진행적 뉘앙스를 더 직접적으로 나타냅니다.
  revised_text: 그분 안에 뿌리를 내린 채 그분 안에서 세워져 가고, 여러분이 가르침을 받은 그대로 믿음 안에서 굳게 세워지며, 감사가 넘치게 하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “믿음으로.” 헬라어 피스티스(πίστις)는 믿음, 신뢰, 충실함을 뜻할 수 있습니다. 여기서는 “가르침을 받은 그대로”라는 말 때문에, 가르침 받은 신앙을 가리킬 가능성이 높습니다.
    reason: alternative_reading
  revision_rationale: 완료 분사 ἐρριζωμένοι는 「뿌리를 내린 채」로, 지속적 수동 분사 ἐποικοδομούμενοι는 「세워져 가고」로 옮겨 두 은유를 보존했습니다. βεβαιούμενοι는 「굳게 세워지며」로 옮겼습니다. 마지막 분사는 한국어에서 앞 절의 권면에 잇는 합쇼체 표현으로 처리하되, 「감사가 넘치게」로 εὐχαριστίᾳ의 의미를 분명히 했습니다. πίστις의 논쟁 가능한 의미는 본문에서 과도하게 확정하지 않고 각주로 제시했습니다.
