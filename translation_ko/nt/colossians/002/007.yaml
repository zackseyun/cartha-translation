review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐρριζωμένοι의 완료 결과와 ἐποικοδομούμενοι의 진행성을 대체로 잘 반영합니다. 그러나 세 분사(‘세워져 가며/굳게 세워지고/넘치며’)는 앞 절의 ‘걸으십시오’에 딸린 분사들이므로, 마지막을 독립 명령인 ‘감사가 넘치도록 하십시오’로 옮기면 원문의 문법적 연결과 양태가 바뀝니다. 또한 ἐν αὐτῷ의 범위를 자연스럽게 드러내기 위해 ‘그분 안에서’를 반복하는 것이 안전합니다.
  naturalness: ‘뿌리를 내린 채’, ‘세워져 가며’, ‘감사에 넘치며’는 현대 표준어에서 자연스럽고, 앞 절에 이어 읽히는 분사 연쇄를 유지합니다. ‘그 믿음’은 문맥상 이해 가능하나, 한국어에서는 ‘믿음 안에서’가 더 자연스럽습니다.
  terminology: ‘그분’은 직전 문맥의 그리스도를 가리키는 대명사로 적절합니다. τῇ πίστει는 가르침받은 믿음/신앙을 가리킬 가능성이 높으므로 본문은 ‘믿음 안에서’로 유지하고, 개인적 믿음 또는 신실함이라는 가능한 의미는 각주에 보존합니다. βεβαιούμενοι는 ‘굳게 세워지고’로, 지속적 수동의 뜻을 살립니다.
  issues:
  - severity: high
    issue: ‘감사가 넘치도록 하십시오’가 독립 명령문으로 번역됨
    rationale: περισσεύοντες는 명령형이 아니라 앞 절의 명령에 수반되는 현재분사입니다. 독립 명령으로 바꾸면 원문의 통사 구조와 동사 양태가 달라집니다.
  - severity: medium
    issue: τῇ πίστει의 가능한 의미에 관한 각주가 없음
    rationale: 문맥상 ‘믿음’이 가장 적절하지만, πίστις는 개인적 믿음 또는 신실함의 의미도 가질 수 있으므로 영어 POB 감사 추적에 맞춰 대안을 각주로 보존하는 것이 좋습니다.
  revised_text: 그분 안에 뿌리를 내린 채 그분 안에서 세워져 가며, 여러분이 가르침을 받은 대로 믿음 안에서 굳게 세워지고, 감사에 넘치며
  revised_footnotes:
  - marker: a
    text: 또는 ‘믿음으로’. 헬라어 피스티스는 믿음, 신뢰, 또는 신실함을 뜻할 수 있습니다. 여기서는 ‘여러분이 가르침을 받은 대로’라는 말에 비추어, 가르침받은 믿음 또는 신앙을 가리킬 가능성이 높습니다.
    reason: alternative_reading
  revision_rationale: 분사들이 앞 절의 권면에 연결되는 원문 구조를 보존하기 위해 마지막 명령형을 분사형 연결로 고쳤습니다. 완료된 뿌리내림의 지속 결과는 ‘뿌리를 내린 채’로, 진행 중인 건축 및 확고해짐은 ‘세워져 가며/굳게 세워지고’로 옮겼습니다. τῇ πίστει의 문맥상 주된 뜻은 본문에 유지하고 가능한 대안은 각주에 제시했습니다.
