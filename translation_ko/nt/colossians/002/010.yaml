  source_fidelity: 「충만하게 된 자들입니다」는 완료 수동 분사 πεπληρωμένοι의 결과 상태를 겨냥하지만, 명사화된 표현이 한국어에서 다소 부자연스럽고 완료 수동의 서술을 선명하게 드러내지 못합니다. 「충만하게 되었습니다」는 그리스어의 완료된 행위와 현재적 결과를 자연스럽게 전달합니다. 「모든 통치자와 권세의 머리」는 κεφαλή 은유와 ἀρχή·ἐξουσία의 포괄성을 충실히 보존합니다.
  naturalness: 관계절을 앞세운 「모든 통치자와 권세의 머리이신 그분 안에서」는 자연스럽습니다. 다만 「충만하게 된 자들입니다」는 문법적으로 가능해도 현대 표준어 성경 문체에서는 무겁고 어색합니다. 서술형 「충만하게 되었습니다」가 합쇼체에 더 자연스럽습니다.
  terminology: 「그분 안에서」는 ἐν αὐτῷ의 연합 언어를 유지하며, 「머리」는 해석적으로 ‘통치자’나 ‘근원’으로 바꾸지 않고 원문의 은유를 보존합니다. 「통치자와 권세」도 문맥상 ἀρχή와 ἐξουσία를 적절히 옮깁니다. 별도 각주는 필요하지 않습니다.
