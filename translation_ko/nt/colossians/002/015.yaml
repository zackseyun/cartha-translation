  naturalness: ‘무장 해제하시고’와 ‘공개적으로 구경거리로 삼으셨습니다’는 현대 표준어 합쇼체로 자연스럽습니다. 분사구를 재배열하여 주절을 분명히 하면 한국어 문장도 더 매끄럽고 원문의 구조도 잘 반영됩니다.
