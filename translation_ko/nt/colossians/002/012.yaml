  source_fidelity: 핵심 의미는 잘 보존되어 있습니다. 다만 διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ는 하나님의 역사하심을 믿는 믿음이라는 관계를 더 분명히 드러낼 필요가 있으며, συνηγέρθητε의 수동성과 συν-의 함께함도 명시하는 편이 좋습니다.
  naturalness: 전반적으로 현대 표준어 합쇼체에 맞습니다. 그러나 「하나님의 역사하심을 믿음으로」는 목적어 관계가 다소 압축되어 있어 「하나님의 역사하심에 대한 믿음을 통하여」가 더 자연스럽고 정확합니다. 「살아났습니다」보다 「일으키심을 받았습니다」가 원문의 수동태를 더 잘 반영합니다.
  terminology: 「세례」, 「장사되었으며」, 「믿음」, 「죽은 자들 가운데서」는 적절합니다. 「역사하심」은 ἐνέργεια의 하나님의 능동적 작용을 보존합니다.
  issues:
  - severity: medium
    issue: 「하나님의 역사하심을 믿음으로」의 관계가 압축되어 있음
    rationale: 원문은 하나님의 역사하심에 대한 믿음(διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ)을 말합니다. 「…에 대한 믿음」으로 옮기면 믿음의 대상 관계가 분명해집니다.
  - severity: low
    issue: 「살아났습니다」가 수동태를 약화함
    rationale: συνηγέρθητε는 부정과거 수동태입니다. 「그분과 함께 일으키심을 받았습니다」는 수동성과 συν- 접두사의 공동성을 모두 보존합니다.
  - severity: low
    issue: 각주 a의 대안 표현이 본문의 가능한 대안을 직접적으로 제시하지 않음
    rationale: 「누구 안에서」보다 문맥상 가능한 지시 대상에 맞추어 「그분 안에서」라고 제시하는 것이 한국어 독자에게 명료합니다.
  revised_text: 여러분은 세례[a] 안에서 그분과 함께 장사되었으며, 그 세례 안에서 또한 그분을 죽은 자들 가운데서 살리신 하나님의 역사하심에 대한 믿음을 통하여 그분과 함께 일으키심을 받았습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「그분 안에서」. 헬라어 관계대명사를 세례가 아니라 메시아를 가리키는 것으로 볼 경우.
    reason: alternative_reading
  - marker: b
    text: 또는 「신뢰를 통하여」. 헬라어 πίστις는 문맥에 따라 「신실함」의 뜻도 가질 수 있으나, 여기서는 「믿음」이 본문의 번역이다.
    reason: lexical_alternative
  revision_rationale: 본문은 세례를 가장 가까운 선행사로 명시하여 ἐν ᾧ의 주된 문법적 연결을 드러내되, 메시아를 가리킬 가능성은 각주에 보존했습니다. 믿음이 하나님의 죽은 자 가운데서 살리시는 역사하심에 관련됨을 분명히 했고, 부활 동사의 수동태와 그분과의 연합을 보존했습니다.
