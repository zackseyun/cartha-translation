  rationale: 원문의 비교·권면 구조(‘그러므로 … 받아들인 대로 … 행하십시오’)와 ἐν αὐτῷ의 간결한 표현을 유지하면서, 「영접」의 추가 뉘앙스와 동격구의 한국어 어색함을 바로잡았습니다. 문장 끝의 각주는 메시아/그리스도 번역 대안을 정확히 표지합니다.
