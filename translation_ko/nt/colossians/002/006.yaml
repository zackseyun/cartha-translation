review_pass:
  verdict: revise
  source_fidelity: 「영접한」은 παρελάβετε(받다/받아들이다)의 가능한 신앙 언어적 표현이지만, 원문의 넓은 ‘받아들임’보다 인격적 환영의 뉘앙스를 더합니다. 「받아들인」이 원문의 의미 범위를 더 직접적으로 보존합니다. τὸν Χριστὸν Ἰησοῦν τὸν κύριον은 예수께 메시아와 주라는 칭호를 붙이는 구조이며, 「주님이신 메시아 예수」는 이를 자연스럽게 유지합니다.
  naturalness: 초안의 「메시아 예수, 곧 주를」은 목적격 조사와 쉼표 뒤 동격구의 결합이 다소 어색하고, 「곧 주」가 문장 안에서 단절되어 들립니다. 「주님이신 메시아 예수」는 현대 표준어 합쇼체 성경 문체에서 자연스럽습니다. 「그분 안에서 행하십시오」는 바울의 ‘걷다’ 비유를 유지하는 자연스러운 격식체 표현입니다.
  terminology: Χριστός는 정책 및 원문상의 칭호성을 따라 「메시아」로 유지하고, 관습적 대안 「그리스도 예수」는 각주로 남깁니다. κύριος는 그리스도론적 칭호로 「주님」이 적절합니다.
  issues:
  - severity: medium
    issue: παρελάβετε를 「영접한」으로 옮김
    rationale: 「영접하다」는 한국 교회 용례에서는 익숙하지만, 원문의 ‘받다/받아들이다’보다 인격적 환영 또는 결단의 뜻을 다소 강화할 수 있습니다. 「받아들인」이 의미를 더 넓고 중립적으로 보존합니다.
  - severity: medium
    issue: 「메시아 예수, 곧 주를」의 동격 처리
    rationale: 원문의 칭호 연쇄를 반영하려는 의도는 타당하나, 한국어에서는 「곧 주를」이 앞의 목적어와 어색하게 결합합니다. 「주님이신 메시아 예수」로 하면 예수에게 붙는 두 칭호를 명료하고 자연스럽게 표현합니다.
  revised_text: 그러므로 여러분은 주님이신 메시아 예수를 받아들인 대로, 그분 안에서 행하십시오.[a]
