    rationale: ἀχειροποιήτῳ는 인간의 손으로 만들어지거나 행해지지 않은 것을 뜻합니다. 할례와 결합하는 한국어에서는 「손으로 행하지 않은 할례」가 더 명료합니다.
  - severity: low
    issue: 각주의 대안 범위 보완 필요
    rationale: 속격의 모호성을 설명하면서 메시아 자신의 할례라는 가능성을 명시하면, 주체적·소유적·연관적 해석 가능성을 더 균형 있게 안내할 수 있습니다.
  revised_text: 그분 안에서 여러분도 손으로 행하지 않은 할례, 곧 육체의 몸을 벗어 버리는 메시아의 할례를 받았습니다.[a]
  revised_footnotes:
