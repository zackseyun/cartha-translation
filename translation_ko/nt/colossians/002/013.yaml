  naturalness: ‘여러분의 허물들과 여러분 육체의 무할례 가운데서 죽어 있던 여러분’으로 병렬 수식을 정돈하고, 현대 표준어 합쇼체에 맞추어 ‘용서해 주셨습니다’를 사용했습니다. ‘그분’보다 문맥상 지시 대상이 분명한 ‘그리스도’를 쓰는 것이 한국어 문장에서는 자연스럽습니다.
