    reason: lexical_alternative
  revision_rationale: γάρ의 논리적 연결을 ‘왜냐하면’으로 반영했습니다. 열거된 세 대상(여러분, 라오디게아에 있는 이들, 바울을 직접 보지 못한 모든 사람)을 유지하면서 한국어 수식 구조를 정리했습니다. ἐν σαρκί는 ‘내 얼굴을 보지 못한’에 연결되도록 배치했으며, 각주 용어를 본문과 통일했습니다.
