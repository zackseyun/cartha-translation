    text: 또는 「메시아에 대한」. 헬라어 εἰς Χριστόν은 여기서 믿음의 대상 또는 방향을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 원문의 신체적 부재와 비신체적 동행의 대조를 더 직접적으로 표현하고, τάξις를 불필요한 보충 없이 「질서」로 옮겼습니다. 메시아를 향한 믿음이라는 주된 해석과 εἰς의 대안적 한국어 표현은 각주로 보존했습니다.
