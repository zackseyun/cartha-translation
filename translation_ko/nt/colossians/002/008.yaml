    text: 또는 「세상의 영적 세력들」. 헬라어 στοιχεῖα는 기본적·초보적 원리들을 가리킬 수도 있고, 우주적 영적 세력들을 가리킬 수도 있다.
    reason: alternative_reading
  revision_rationale: 「곧」을 삭제하여 철학과 헛된 속임수의 동격 여부를 결정하지 않았고, κατὰ의 세 병렬 구절을 한국어에서 자연스럽게 유지했습니다. 「포로로 끌고 가다」로 συλαγωγέω의 포획·탈취 은유를 보완했습니다. 각주는 στοιχεῖα의 논쟁적 의미를 보존합니다.
