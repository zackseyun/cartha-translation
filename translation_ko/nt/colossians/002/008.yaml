review_pass:
  verdict: revise
  source_fidelity: 원문의 세 차례 κατὰ 구문은 ‘철학과 헛된 속임수’의 성격과 기준을 규정합니다. 현 번역은 ‘사람의 전통을 따르고 … 따르며 메시아를 따르지 않는 것으로’가 ‘아무도’ 또는 포로로 잡는 행위에 걸리는 듯하여 수식 관계가 불명확합니다. 이를 철학과 속임수를 직접 수식하도록 바로잡아야 합니다.
  naturalness: ‘사로잡지 못하도록 조심하십시오’는 이해되지만, συλαγωγέω의 ‘끌고 가다/노획물로 삼다’라는 동적 비유를 ‘사로잡아 가지 못하도록’으로 드러내면 더 자연스럽고 충실합니다. 병렬 수식은 ‘따르는 것이며 … 따르는 것이 아닌’으로 정리하는 것이 현대 한국어에서 명료합니다.
  terminology: ‘메시아’는 Χριστός의 칭호성을 보존하며 주어진 번역 정책과 일치합니다. ‘세상의 초보적 원리’는 στοιχεῖα의 논쟁적 의미를 한쪽으로 확정하지 않는 안전한 본문 번역이고, 각주의 ‘세상의 영적 권세들’은 유의미한 대안을 보존합니다.
  issues:
  - severity: medium
    issue: κατὰ 구문들의 수식 관계가 불분명함
    rationale: ‘사람의 전통을 따르고 … 메시아를 따르지 않는 것으로’라는 표현은 원문의 ‘철학과 헛된 속임수’를 규정하는 병렬 구문을 부자연스럽게 처리합니다. 사람이나 포획 행위가 그러한 기준을 따른다는 뜻으로 읽힐 여지도 있습니다.
  - severity: low
    issue: συλαγωγέω의 이동·탈취 비유가 다소 약화됨
    rationale: ‘사로잡다’도 가능하지만 ‘사로잡아 가다’가 약탈물처럼 끌고 간다는 원문의 비유를 더 잘 전달합니다.
  revised_text: 아무도 사람의 전통과 세상의 초보적 원리를 따르는 것이며 메시아를 따르는 것이 아닌 철학과 헛된 속임수로 여러분을 사로잡아 가지 못하도록 조심하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「세상의 영적 권세들」. 헬라어 στοιχεῖα는 기본 원리들이나 우주적 영적 권세들 모두를 가리킬 수 있다.
    reason: alternative_reading
  revision_rationale: κατὰ τὴν παράδοσιν, κατὰ τὰ στοιχεῖα, οὐ κατὰ Χριστόν의 병렬 관계를 한국어에서 ‘철학과 헛된 속임수’를 직접 규정하도록 재구성했습니다. στοιχεῖα의 모호성과 Χριστός의 칭호적 번역은 유지했습니다. 각주 표지는 ‘세상의 초보적 원리’ 뒤에 유지되어야 합니다.
