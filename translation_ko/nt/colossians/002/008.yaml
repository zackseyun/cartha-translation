review_pass:
  verdict: revise
  source_fidelity: 초안은 수단을 나타내는 διά와 세 차례의 κατὰ 대조를 대체로 반영하며, Χριστόν을 칭호인 「메시아」로 옮긴 점도 적절합니다. 그러나 「곧」은 철학과 헛된 속임수를 뒤따르는 구절과 동격으로 단정하여 원문의 연결을 과도하게 해석합니다. 또한 「사로잡지」만으로는 συλαγωγέω의 ‘포로로 끌고 가다/노획물로 끌고 가다’라는 이동·탈취의 뉘앙스가 다소 약합니다.
  naturalness: 합쇼체 경고문으로 자연스럽게 다듬기 위해, 「아무도 여러분을 … 포로로 끌고 가지 못하도록 조심하십시오」로 목적어와 동작을 명확히 했습니다. 세 개의 「따르다」 구절은 철학과 헛된 속임수를 한정하도록 배치하되, 원문의 논리적 대조를 유지했습니다.
  terminology: 「철학」, 「헛된 속임수」, 「사람의 전통」, 「세상의 초보적 원리」, 「메시아」는 적절합니다. στοιχεῖα의 논쟁적 의미는 본문에서 「초보적 원리」로 보존하고, 각주에서 「영적 세력들」이라는 대안을 제시하는 것이 안전합니다.
  issues:
  - severity: medium
    issue: 「곧」이 삽입되어 있음
    rationale: 원문은 φιλοσοφίας와 κενῆς ἀπάτης를 동격이라고 문법적으로 확정하지 않습니다. 「곧」은 이러한 해석을 본문에 부과하므로 삭제하는 편이 원문 충실성에 더 맞습니다.
  - severity: medium
    issue: 「사로잡지」가 συλαγωγέω의 끌고 감의 의미를 충분히 드러내지 못함
    rationale: 이 동사는 포획뿐 아니라 노획물처럼 끌고 가는 뜻을 지닙니다. 「포로로 끌고 가다」가 은유와 동작성을 더 정확히 전달합니다.
  - severity: low
    issue: 각주의 「영적 권세들」 표현
    rationale: 가능한 해석이지만 στοιχεῖα의 인격적 존재 여부를 지나치게 고정할 수 있습니다. 「영적 세력들」은 영어 감사 기록의 ‘cosmic spiritual powers’를 자연스럽고 비교적 비결정적으로 반영합니다.
  revised_text: 아무도 사람의 전통을 따르고 세상의 초보적 원리[a]를 따르며 메시아를 따르지 않는 철학과 헛된 속임수로 여러분을 포로로 끌고 가지 못하도록 조심하십시오.
  revised_footnotes:
