lexical_decisions:
- source_word: ἐν ᾧ
  english_pob_choice: in whom
  chosen_korean: 그분 안에는
  alternatives_korean:
  - 그분 안에
  - 이분 안에
  lexicon: BDAG
  rationale: 앞 절의 메시아를 인격적 선행사로 받는다. 「그분 안에는」으로 주제화하여 한국어 자연성을 살린다.
- source_word: πάντες οἱ θησαυροὶ
  english_pob_choice: all the treasures
  chosen_korean: 모든 보화
  alternatives_korean:
  - 모든 보물
  - 모든 보배
  lexicon: BDAG
  rationale: 「보화」는 한국 교회의 정립된 표현으로 신학적 무게를 잘 담는다.
- source_word: τῆς σοφίας καὶ γνώσεως
  english_pob_choice: of wisdom and knowledge
  chosen_korean: 지혜와 지식의
  alternatives_korean:
  - 지혜와 통찰의
  lexicon: BDAG
  rationale: σοφία와 γνῶσις의 구분을 「지혜와 지식」으로 보존한다.
- source_word: ἀπόκρυφοι
  english_pob_choice: hidden
  chosen_korean: 감추어져 있습니다
  alternatives_korean:
  - 숨겨져 있습니다
  - 저장되어 있습니다
  lexicon: BDAG
  rationale: ἀπόκρυφος의 「감추어짐」을 그대로 옮기되, 「감춤」의 보존·기밀 함의를 모두 보존한다.
