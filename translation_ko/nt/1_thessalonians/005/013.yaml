  to: 그리고 그들의 일 때문에 사랑으로 그들을 더할 나위 없이 귀하게 여기십시오.[a] 서로 평화롭게 지내십시오.
  rationale: 접속사 καί를 ‘그리고’로 자연스럽게 연결하고, ἔργον을 문맥상 가능한 범위 안에서 더 중립적인 ‘일’로 옮겼습니다. ἐν ἀγάπῃ의 수식 관계가 분명하도록 ‘사랑으로’를 앞에 두었으며, 공동체 내부의 상호적 평화를 뜻하는 명령을 ‘서로 평화롭게 지내십시오’로 번역했습니다. 각주도 원문의 강한 강조와 ‘높이 여기다’의 평가적 의미를 보존하도록 수정했습니다.
