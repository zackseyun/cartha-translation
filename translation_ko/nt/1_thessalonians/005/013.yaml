  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 διὰ τὸ ἔργον αὐτῶν의 ἔργον은 본문 자체에서는 넓게 ‘일’이며, ‘사역’은 앞 절의 문맥상 가능하더라도 해석을 한 단계 더한 표현입니다. 또한 εἰρηνεύετε ἐν ἑαυτοῖς는 공동체 구성원들이 서로 평화롭게 지내라는 명령입니다.
  naturalness: ‘사랑 가운데 더할 나위 없이 귀하게 여기십시오’는 이해되지만 수식어가 길게 겹쳐 다소 경직됩니다. ‘사랑으로 그들을 더할 나위 없이 귀하게 여기십시오’가 현대 표준 한국어 합쇼체로 더 자연스럽습니다. ‘평화를 누리며 사십시오’보다 ‘서로 평화롭게 지내십시오’가 상호적 의미를 더 직접적으로 드러냅니다.
