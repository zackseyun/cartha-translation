  source_fidelity: 원문의 강조어 αὐτοὶ, 정확성을 나타내는 ἀκριβῶς, 종말론적 관용구 ἡμέρα κυρίου, 그리고 ‘도둑이 밤에 오듯’이라는 비유의 대응을 대체로 담고 있습니다. 그러나 ‘여러분 자신이 … 알고 있기 때문입니다’는 αὐτοὶ의 강조와 γάρ의 연결을 한국어에서 다소 부자연스럽게 처리하며, 문장이 앞 문맥에 문법적으로 매인 듯 끝납니다.
