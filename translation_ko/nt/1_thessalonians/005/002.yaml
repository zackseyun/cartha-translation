    rationale: αὐτοὶ는 ‘여러분 자신이’처럼 주어를 어색하게 명사화하기보다 ‘여러분도 친히’로 강조하는 편이 자연스럽습니다. 또한 γάρ는 앞 절의 이유·설명 연결을 나타내지만, 한국어에서 ‘때문입니다’로만 종결하면 독립 문장으로 부자연스러울 수 있습니다.
