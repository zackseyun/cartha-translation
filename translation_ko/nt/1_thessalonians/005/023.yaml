    rationale: 「여러분의 영과 혼과 몸을 온전한 채로 … 보전해 주시기를」은 보전되는 대상과 ‘온전한’ 상태의 관계가 매끄럽지 않습니다. 원문의 전체성(ὁλόκληρον)과 흠 없음(ἀμέμπτως)을 ‘전체가 온전하고 흠 없이’로 병렬해 명확히 드러낼 수 있습니다.
