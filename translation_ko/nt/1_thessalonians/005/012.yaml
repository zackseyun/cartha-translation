  naturalness: 「형제 여러분, 우리는 여러분에게 요청합니다」와 「알아주십시오」는 현대 표준어 합쇼체로 자연스럽습니다. 「여러분을 훈계하는」도 이 문맥에서 자연스럽고, 교회 공동체를 향한 정중한 문체와 조화를 이룹니다.
