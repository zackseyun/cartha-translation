review_pass:
  verdict: revise
  source_fidelity: 핵심 명령의 엄숙성은 대체로 반영했지만, 「주 앞에서」는 τὸν κύριον과 ἐνορκίζω의 결합이 나타내는 ‘주님을 두고/주님의 권위로’라는 맹세적 소환을 충분히 드러내지 못합니다. 또한 수동 부정사 ἀναγνωσθῆναι는 편지가 모든 형제에게 낭독되게 하라는 뜻인데, 「읽어 주십시오」는 수동성과 낭독 시행의 초점을 다소 약화합니다.
  naturalness: 「엄히 맹세시킵니다」는 현대 표준 한국어에서 다소 어색하고, 독자가 실제로 맹세를 발하게 한다는 뜻으로 이해될 수 있습니다. 「주님을 두고 여러분에게 엄히 명합니다」는 엄숙한 명령을 자연스럽게 표현합니다. 「낭독하게 하십시오」는 서신의 공적 읽기를 분명히 하면서도 과도한 해석을 더하지 않습니다.
  terminology: κύριος는 「주님」으로, ἐπιστολή는 「편지」로 자연스럽게 옮겼습니다. ἀδελφοῖς는 본문의 문법적 성을 보존하여 「형제」로 유지하고, 회중 전체를 가리킬 수 있다는 설명은 각주에 둡니다.
  issues:
  - severity: medium
    issue: 「주 앞에서 여러분에게 엄히 맹세시킵니다」의 의미와 결합이 부정확하거나 어색함
    rationale: ἐνορκίζω ὑμᾶς τὸν κύριον은 바울이 수신자들에게 주님을 소환하는 권위로 엄숙히 명하는 표현입니다. 현 번역은 ‘주 앞에서’와 ‘맹세시키다’의 결합 때문에 수신자에게 맹세 행위를 시킨다는 의미로 읽힐 수 있습니다.
  - severity: medium
    issue: 「이 편지를 모든 형제에게 읽어 주십시오」가 수동적 낭독 명령을 충분히 표시하지 못함
    rationale: ἀναγνωσθῆναι는 ‘낭독되다’라는 수동 부정사입니다. 편지가 모든 형제에게 낭독되도록 조처하라는 의미를 「낭독하게 하십시오」로 더 충실히 나타낼 수 있습니다.
  revised_text: 나는 주님을 두고 여러분에게 엄히 명합니다. 이 편지를 모든 형제에게 낭독하게 하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「주님의 이름으로」. 헬라어 표현은 바울이 주님을 소환되는 권위로 삼아 엄숙히 명하는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 「형제」는 헬라어 남성 복수형입니다. 여기서는 여성을 포함한 회중 전체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  revision_rationale: 주님을 맹세의 권위로 불러 엄숙히 명하는 ἐνορκίζω의 힘을 자연스러운 한국어로 옮기고, 편지가 모든 형제에게 낭독되도록 하라는 수동 부정사의 뜻을 보존했습니다. 형제라는 표현의 대표적 용법은 각주에서 설명했습니다.
