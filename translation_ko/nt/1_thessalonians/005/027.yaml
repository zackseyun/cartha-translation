review_pass:
  verdict: revise
  source_fidelity: 원문의 ἐνορκίζω는 단순히 ‘맹세하다’가 아니라 주님을 권위로 내세워 수신자들에게 엄숙한 의무를 지우는 표현입니다. 초안의 ‘엄히 맹세시킵니다’는 한국어에서 다소 부자연스럽고, 누가 맹세를 하게 되는지에 초점이 옮겨집니다. ‘주님을 두고 … 엄숙히 명합니다’는 원문의 엄숙한 강권과 τὸν κύριον의 의미를 더 자연스럽게 반영합니다. 수동 부정과거 ἀναγνωσθῆναι는 편지가 모든 형제들에게 읽히도록 하라는 요구이며, ‘읽어 주십시오’가 이를 적절히 전달합니다.
  naturalness: ‘나는 주님을 두고 여러분에게 엄숙히 명합니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 엄정한 서신 문체입니다. ‘모든 형제들에게’는 수혜/청자의 범위를 자연스럽게 나타냅니다.
  terminology: κύριος는 ‘주님’, ἐπιστολή는 ‘편지’, ἀδελφοί는 본문에서 형태를 보존하여 ‘형제들’로 옮깁니다. 회중 전체를 가리킬 수 있는 용법은 각주에서 설명합니다.
  issues:
  - severity: medium
    issue: ‘엄히 맹세시킵니다’의 어색한 한국어 표현 및 의미 초점
    rationale: 한국어 ‘맹세시키다’는 상대방에게 맹세 행위를 하게 한다는 뜻으로 들리기 쉬워, 바울이 주님의 권위로 엄숙히 요구하는 원문의 화행을 매끄럽게 전달하지 못합니다.
  - severity: low
    issue: τὸν κύριον의 각주 대안과 본문 연결
    rationale: 본문을 ‘주님을 두고’로 옮기고 ‘주님 앞에서’를 대안으로 제시하면, 원문의 논쟁 가능한 용법을 보존하면서도 한국어의 자연스러움을 확보합니다.
  revised_text: 나는 주님을 두고[a] 여러분에게 엄숙히 명합니다. 이 편지를 모든 형제들에게 읽어 주십시오.[b]
