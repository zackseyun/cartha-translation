    issue: 「정신을 차립시다」가 νήφωμεν의 ‘맑고 절제된 상태를 유지하다’라는 의미를 충분히 드러내지 못함
    rationale: νήφω는 문맥상 경계와 절제를 뜻하지만, 「정신을 차리다」는 정신을 잃었다가 회복한다는 일회적 뉘앙스를 줄 수 있습니다.
  - severity: medium
    issue: 각주 b가 유효한 번역 대안을 제공하지 않음
    rationale: 현 각주는 「구원의 소망을 투구로 쓰고」라는 표현을 포함한 문장을 분리할 수 있다는 설명일 뿐, 원문 및 영어 감사 기록에서 보존한 ‘투구, 곧 구원의 소망’이라는 대안 표현을 제시하지 않습니다.
  revised_text: 그러나 우리는 낮에 속하므로, 믿음[a]과 사랑의 가슴받이를 입고 구원의 소망을 투구로 쓰며 맑은 정신을 지킵시다.
  revised_footnotes:
  - marker: a
    text: 또는 「신실함과 사랑」. 헬라어 πίστις는 「믿음·신뢰·신실함」을 뜻할 수 있으며, 본문에서는 「믿음」으로 옮긴다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그리고 투구, 곧 구원의 소망을 쓰며」.
    reason: previous_rendering
