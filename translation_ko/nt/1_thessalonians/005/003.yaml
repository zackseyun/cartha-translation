    rationale: λέγωσιν의 주어는 불특정 복수입니다. 「사람들이」도 가능하지만, 「그들이」가 원문의 열린 지시를 더 잘 보존합니다.
  - severity: low
    issue: 대안 각주의 어휘 대응
    rationale: ἀσφάλεια의 대안은 「안녕」보다 「안전」이 더 직접적입니다. 따라서 대안은 「평화와 안전」이 적절합니다.
