review_pass:
  verdict: revise
  source_fidelity: 그리스어의 시간 절(ὅταν λέγωσιν), 갑작스러운 멸망, 임산부에게 닥치는 진통의 비유, 미래에 대한 강조 부정은 대체로 반영되었습니다. 그러나 「…것 같아서」는 비유를 인과 관계처럼 연결하므로 ὥσπερ의 단순 비교를 더 정확히 옮길 필요가 있습니다. 또한 주어를 「사람들이」로 특정하기보다 원문의 불특정 복수 「그들이」를 유지하는 편이 충실합니다.
  naturalness: 「임산부에게 진통이 닥치듯이」는 현대 표준어에서 자연스럽고, 원문의 비교 구조도 분명히 드러냅니다. 「갑작스러운 멸망이 그들에게 닥칠 것이며」와 「결코 피하지 못할 것입니다」는 합쇼체 문맥에 자연스럽습니다.
  terminology: 「평안과 안전」은 εἰρήνη καὶ ἀσφάλεια의 짝을 잘 보존하며, 「멸망」은 ὄλεθρος를 특정 종말론 체계로 확대하지 않는 적절한 번역입니다. 「진통」은 ὠδίν의 현대적이고 명확한 표현입니다.
  issues:
  - severity: medium
    issue: 비유 표현이 인과적으로 연결됨
    rationale: 「마치 임산부에게 산고가 닥치는 것 같아서」의 「-아서」는 뒤의 ‘피하지 못함’에 대한 이유나 결과처럼 들립니다. 원문 ὥσπερ는 멸망이 닥치는 방식에 대한 비교이므로 「…닥치듯이」로 옮기는 것이 정확합니다.
  - severity: low
