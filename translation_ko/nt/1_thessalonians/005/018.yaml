  source_fidelity: 원문의 ἐν παντί를 「모든 일 가운데서」로, εὐχαριστεῖτε를 합쇼체 명령 「감사하십시오」로 충실히 옮겼습니다. τοῦτο γὰρ와 θέλημα θεοῦ, ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς의 관계도 「이것이 메시아 예수 안에서 여러분을 향한 하나님의 뜻이기 때문입니다」로 적절히 보존합니다. εἰς의 방향성도 「향한」으로 무리 없이 드러납니다.
