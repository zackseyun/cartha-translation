review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Macedonian-wide scope, the ongoing practice, and the exhortation to increase. However, 「그렇게 하고 있습니다」 leaves αὐτό overly vague in Korean; its antecedent is the preceding brotherly love. 「자라 가기를」 also shifts the image from abounding/increasing to growth.
  naturalness: The draft is generally clear and maintains modern formal-polite register. 「그 사랑을 실천하고 있습니다」 is clearer and more idiomatic than 「그렇게 하고 있습니다」 in this context. 「더욱더 풍성해지라고 권면합니다」 naturally renders the exhortational infinitive without specifying an object that the Greek leaves implicit.
  terminology: 「형제」 appropriately retains ἀδελφοί/ἀδελφούς, and the footnote appropriately explains its likely mixed-gender referent. Plural 「형제들에게」 better reflects πάντας τοὺς ἀδελφούς in Korean.
  issues:
  - severity: medium
    issue: 「그렇게 하고 있습니다」 is an unclear rendering of αὐτό.
    rationale: The pronoun refers back to the immediately preceding subject of brotherly love. Korean benefits from identifying this as 「그 사랑」 without adding doctrinal interpretation.
  - severity: low
    issue: 「풍성하게 자라 가기를」 changes the lexical image of περισσεύειν.
    rationale: The Greek means to abound or increase still more. 「풍성해지다」 retains that sense more directly than growth language.
  revised_text: 사실 여러분은 마게도냐 전역에 있는 모든 형제[a]들에게 그 사랑을 실천하고 있습니다. 그러나 형제 여러분, 우리는 여러분에게 더욱더 풍성해지라고 권면합니다.
