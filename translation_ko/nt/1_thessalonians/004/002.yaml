  verdict: revise
  source_fidelity: 원문의 γάρ는 앞 문장을 뒷받침하는 접속사이므로 한국어에서도 문두의 「왜냐하면」으로 드러내는 편이 적절합니다. 「주 예수를 통하여」는 διὰ τοῦ κυρίου Ἰησοῦ의 매개적 표현을 충실히 보존합니다. παραγγελίας는 권위 있는 지시를 뜻하되, 이 절에서 「명령들」은 다소 강하게 좁힐 수 있어 「지시들」이 더 적절합니다.
  naturalness: 현 번역은 긴 종속절 뒤에 「알고 있기 때문입니다」를 두어, γάρ가 설명하는 방향이 한국어에서 다소 역전됩니다. 「왜냐하면 여러분은 … 알고 있기 때문입니다」가 현대 표준어 합쇼체에서 자연스럽고 문맥 연결도 분명합니다.
  terminology: κύριος는 「주」, Ἰησοῦ는 「예수」로 유지합니다. παραγγελία는 「지시」로 옮겨 권위 있는 전달 내용이라는 뜻을 살리면서도 원문보다 지나치게 강한 법적 명령의 뉘앙스를 피합니다.
  issues:
  - severity: medium
    issue: γάρ의 연결 방향이 한국어 문장 배열에서 불분명합니다.
    rationale: 원문은 「여러분이 알고 있기 때문입니다」라는 근거를 먼저 제시합니다. 문두 「왜냐하면」을 사용하면 앞 절과의 논리적 연결을 보존할 수 있습니다.
  - severity: low
    issue: 「명령들」은 παραγγελίας의 의미 범위를 다소 좁힐 수 있습니다.
    rationale: 이 단어는 권위 있는 명령도 될 수 있으나 일반적으로 지시·전달 사항을 가리킵니다. 영어 POB의 ‘instructions’ 및 원문의 폭을 고려해 「지시들」을 사용합니다.
  revised_text: 왜냐하면 여러분은 우리가 주 예수를 통하여 여러분에게 어떤 지시들을 주었는지 알고 있기 때문입니다.
  revised_footnotes:
