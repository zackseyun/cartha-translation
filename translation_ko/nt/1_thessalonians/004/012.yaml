  source_fidelity: 종결구 μηδενὸς χρείαν ἔχητε는 문법상 우선 ‘아무것도 필요로 하지 않다/아무것도 부족하지 않다’라는 뜻입니다. 초안의 ‘누구에게도 부족함이 없다’는 한국어에서 의미와 문장 관계가 불분명하며, 원문의 중성적 의미를 적절히 옮기지 못합니다. 대안인 타인 의존의 의미는 각주로 보존하는 것이 적절합니다.
  naturalness: ‘바깥 사람들’보다 ‘밖에 있는 사람들’이 현대 표준어에서 더 자연스럽고, ‘단정하게’는 주로 외양이나 태도를 가리킬 수 있으므로 여기의 사회적으로 존중받을 만한 행실에는 ‘품위 있게’가 더 알맞습니다. 목적절의 형식은 앞 절의 권면에 이어지는 문맥에서 자연스럽습니다.
