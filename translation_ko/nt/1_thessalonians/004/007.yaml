    issue: The rendering of γάρ is structurally incomplete in Korean.
    rationale: The terminal ‘때문입니다’ requires an explicit referential/grounding frame in a standalone Korean rendering. ‘이는’ supplies that frame and represents the source conjunction γάρ without adding meaning.
