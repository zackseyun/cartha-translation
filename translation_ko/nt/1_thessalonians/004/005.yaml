review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the negated manner, the intensified expression πάθει ἐπιθυμίας, and the attributive description of the Gentiles as those who do not know God. The comparison introduced by καθάπερ καὶ is retained by 「…처럼」.
  naturalness: 「정욕의 격정 가운데 그러지 마십시오」 is understandable in context, but 「그렇게 하지 마십시오」 is more natural and suitably formal-polite Korean. The phrase 「정욕의 격정」 deliberately reflects the Greek two-noun construction and is acceptable in this formal translation.
  terminology: 「이방인들」 appropriately renders τὰ ἔθνη in this Pauline context, and 「하나님」 is appropriate for τὸν θεόν. Footnote a's proposed alternative 「욕정의 정욕」 is not a viable Korean lexical alternative, since it unnecessarily duplicates the same sense; it should be corrected.
  issues:
  - severity: low
    issue: Footnote a includes the unnatural alternative 「욕정의 정욕」.
    rationale: This wording repeats near-synonymous sexual-desire terms without representing a meaningful alternative construal of πάθει ἐπιθυμίας. 「욕정의 격정」 and 「격정적인 욕망」 are viable alternatives.
  - severity: low
    issue: 「그러지 마십시오」 is somewhat colloquial and referentially vague.
    rationale: 「그렇게 하지 마십시오」 preserves the verse's dependence on the preceding exhortation while better fitting modern formal-polite biblical register.
  revised_text: 하나님을 알지 못하는 이방인들[b]처럼 정욕의 격정[a] 가운데 그렇게 하지 마십시오.
