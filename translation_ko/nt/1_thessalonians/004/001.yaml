  to: 그러므로 끝으로, 형제[a] 여러분, 우리는 주 예수 안에서 여러분에게 요청하고 권면합니다. 여러분이 우리에게서 받은 대로 어떻게 행하여 하나님을 기쁘시게 해야 하는지, 또 여러분이 지금도 그렇게 행하고 있듯이, 더욱더 풍성해지십시오.
