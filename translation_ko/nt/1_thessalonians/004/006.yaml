  source_fidelity: 본문은 τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν을 ‘경계를 넘어 그를 이용하지 말아야’로 적절히 반영하고, ἐν τῷ πράγματι의 문맥상 특정성을 ‘이 일에서’로 보존합니다. 다만 ‘이 모든 일을 보응하시는’은 περὶ πάντων τούτων(‘이 모든 일에 관하여’)의 전치사 관계를 ‘일들’을 보응의 직접목적어로 바꾸므로 수정이 필요합니다.
