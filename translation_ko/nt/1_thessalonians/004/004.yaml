    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ἑαυτοῦ σκεῦος κτᾶσθαι
  english_pob_choice: acquire his own vessel
  chosen_korean: 자기 자신의 그릇을 ... 얻을 줄
  alternatives_korean:
  - 자기의 몸을 다스리는 법을
  - 자기 아내를 얻는 법을
  lexicon: BDAG
  rationale: σκεῦος를 「그릇」으로 직역해 본문 어휘를 보존한다. 해석적 옮김(「몸」, 「아내」)은 본문에 두지 않고 각주로 살린다.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  english_pob_choice: in holiness and honor
  chosen_korean: 거룩함과 존귀함 가운데
  alternatives_korean:
  - 거룩과 영예 안에서
  - 거룩하게 그리고 존귀하게
  lexicon: BDAG
  rationale: 두 추상명사를 한국어 「~함」 명사형으로 자연스럽게 옮긴다.
theological_decisions:
- issue: σκεῦος의 지시 대상
  chosen_reading: 「자기 자신의 그릇」으로 본문 어휘 보존
  alternative_readings:
  - 자기 자신의 몸을 다스림
  - 자기 아내를 얻음
  rationale: 헬라어 σκεῦος는 본 문맥에서 ① 자기 자신의 몸 ② 자기 아내(혹은 배우자)를 가리킬 가능성이 모두 있으며, 학계의 의견이 갈린다. 본 번역은 본문 어휘 「그릇」을 보존하고 두 해석을 각주에 열어둔다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
