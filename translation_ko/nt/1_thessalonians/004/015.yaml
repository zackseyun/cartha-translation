  verdict: revise
  source_fidelity: 핵심 대조와 강한 부정은 대체로 잘 옮겼습니다. 그러나 「살아남아 있는」은 οἱ ζῶντες(살아 있는)와 οἱ περιλειπόμενοι(남아 있는)의 병렬을 ‘생존하다’라는 단일한 뉘앙스로 기울게 하며, 「재림」은 παρουσία의 기본 뜻인 ‘오심/도래’를 ‘두 번째 오심’으로 특정합니다. 본문과 영어 감사 기록이 보존하는 의미 범위를 위해 이를 수정하는 것이 안전합니다.
  naturalness: 원문의 「살아남아 있는 우리, 곧 ... 남은 자들」은 의미가 겹치고 「우리」와 「자들」의 호응이 다소 부자연스럽습니다. 두 분사를 병렬 절로 풀어 자연스럽고 명료하게 다듬었습니다.
  terminology: κύριος는 「주」로 유지했습니다. παρουσία는 이 절에서 「주의 오심」으로 옮겨 사건성을 살리면서도 ‘재림’이 수반할 수 있는 추가 특정화를 피했습니다. κοιμηθέντας의 ‘잠든’ 비유도 유지했습니다.
  issues:
  - severity: medium
    issue: παρουσία를 「재림」으로 특정함
    rationale: παρουσία는 이 문맥에서 주의 미래 오심을 가리키지만, 단어 자체는 ‘재림’이라는 ‘두 번째’라는 특정화를 표현하지 않습니다. 영어 POB도 ‘coming’을 채택하고 ‘presence/arrival’을 각주로 보존합니다. 「주의 오심」이 문맥의 사건성을 보존하면서 더 직접적입니다.
  - severity: medium
    issue: 「살아남아 있는」과 「남은 자들」의 중복 및 의미 이동
    rationale: οἱ ζῶντες와 οἱ περιλειπόμενοι는 각각 ‘살아 있는’과 ‘남아 있는’입니다. 「살아남다」는 생존·극복의 뉘앙스를 더할 수 있고, 뒤의 「남은 자들」과도 중복됩니다. 두 표현을 병렬로 옮겨 구별을 보존해야 합니다.
  - severity: low
    issue: b 각주의 문맥 해설이 본 절의 어휘 대안보다 확장됨
    rationale: 현 각주는 다음 절들의 세부 묘사와 「재림」이라는 해석적 결론을 덧붙입니다. 원문의 어휘 범위를 보여 주는 간결한 각주가 더 적절합니다.
  revised_text: 우리는 주의 말씀으로[a] 여러분에게 이것을 말합니다. 살아 있고 주께서 오실 때까지 남아 있는 우리는 잠든 이들[c]보다 결코 앞서지 않을 것입니다.
  revised_footnotes:
