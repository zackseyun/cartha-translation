  revision_rationale: '「주의 말씀으로」는 ἐν λόγῳ κυρίου의 권위·근거의 뉘앙스를 보존하며, a 각주에서 말씀의 출처 또는 전달 방식에 관한 미결성을 유지했습니다. 「살아 있고 주께서 오실 때까지 남아 있는 우리」는 두 현재분사의 병렬과 시간적 한정을 자연스럽게 반영합니다. 「결코 앞서지 않을 것입니다」는 οὐ μὴ φθάσωμεν의 강한 부정과 ‘앞서다’의 의미를 보존합니다. b 각주는 본문의 「오심」에 연결되어야 하나, 마커를 유지하기 위해 해당 위치에 [b]를 붙인 완전한 본문이 필요합니다. 아래 수정 본문에는 b 앵커를 반영합니다: 「우리는 주의 말씀으로[a] 여러분에게 이것을 말합니다. 살아 있고 주께서 오실 때까지[b] 남아 있는 우리는 잠든 이들[c]보다 결코 앞서지 않을 것입니다.」'
