review_pass:
  verdict: revise
  source_fidelity: 「살아남아 있는」은 περιλειπόμενοι를 단순히 그때까지 ‘남아 있는’ 사람들로 말하는 원문보다 생존·생존 경쟁의 뉘앙스를 더합니다. 또한 「재림」은 이 문맥에서 가능한 해석이지만 παρουσία의 어휘적 폭을 번역 본문에서 좁힙니다. 「오심」은 미래의 사건성을 자연스럽게 드러내면서도 덜 해석적입니다.
  naturalness: 현 번역의 「살아남아 있는 우리, 곧 ... 남은 자들은」은 ‘우리’와 ‘자들’의 호응 및 동격 구성이 다소 어색합니다. 두 분사를 병렬하여 「살아 있는 우리, 곧 남아 있는 우리는」으로 옮기면 현대 표준어 문장으로 자연스럽고 원문의 반복된 관사·분사 구조도 어느 정도 보존됩니다.
  terminology: κύριος는 일관되게 「주」로, κοιμηθέντας의 은유는 「잠든 이들」로 유지합니다. παρουσία는 본문에서 「오심」으로 번역하고 각주에서 「임재」와 「도래」라는 가능한 어휘 범위를 제시합니다. 이는 특정 종말론 용어인 「재림」을 본문에 선결적으로 도입하지 않습니다.
  issues:
  - severity: medium
    issue: 「살아남아 있는」의 과도한 뉘앙스
    rationale: περιλειπόμενοι는 지정된 때까지 남아 있는 이들을 뜻하며, ‘살아남다’는 위험이나 재난을 겪고 생존했다는 뉘앙스를 불필요하게 더합니다.
  - severity: medium
    issue: 「재림」이 παρουσία의 어휘적 여지를 본문에서 축소함
    rationale: 이 문맥에서 미래의 주의 오심을 가리키는 것은 분명하지만, παρουσία 자체는 ‘임재/도래/오심’의 의미 범위를 가집니다. 「오심」은 사건성을 보존하면서 교리적으로 더 특정된 용어를 강제하지 않습니다.
  - severity: low
    issue: 주석 b의 문맥 주장
    rationale: ‘함께 만나는 사건이 명시되어’라는 설명은 이 절 자체에 명시된 내용이 아니라 뒤 절의 문맥에 기대는 해설입니다. 어휘 대안만 간결하게 제시하는 편이 본 절의 주석으로 적절합니다.
  revised_text: 우리는 주의 말씀으로[a] 여러분에게 이렇게 말합니다. 곧 주의 오심[b]까지 살아 있는 우리, 곧 남아 있는 우리는 잠든 이들[c]보다 결코 앞서지 못할 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「주의 말씀에 따라」. 헬라어 표현은 주 예수의 말씀을 가리킬 수도 있고, 주의 권위로 주어진 계시를 가리킬 수도 있다.
    reason: alternative_reading
  - marker: b
    text: 헬라어 παρουσία는 「임재」 또는 「도래」로도 옮길 수 있다.
    reason: lexical_alternative
  - marker: c
    text: 「잠든 이들」은 죽은 이들을 가리키는 비유적 표현이다.
    reason: lexical_alternative
  revision_rationale: 원문의 권위 근거인 ἐν λόγῳ κυρίου, 두 개의 분사(‘살아 있는’, ‘남아 있는’), οὐ μή의 강한 부정(‘결코 ... 못할 것입니다’), 그리고 죽음을 가리키는 잠의 은유를 보존했습니다. 동시에 「살아남다」의 불필요한 생존 뉘앙스와 「재림」의 해석적 특정화를 피하고, 각주를 원문이 허용하는 대안과 은유 설명에 한정했습니다.
