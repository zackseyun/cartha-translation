  source_fidelity: 원문의 대조 구조(‘사람이 아니라 하나님’)와 하나님을 수식하는 현재분사(‘또한 자신의 성령을 주시는’)를 한국어에서도 분명히 드러낼 필요가 있습니다. 현 초안은 ‘하나님을 저버리는’ 목적어와 ‘주시는’ 수식절의 연결이 다소 압축되어 있으나, 의미 자체는 대체로 보존합니다.
  naturalness: 합쇼체 문장으로 자연스럽게 다듬기 위해 ‘자기 성령’은 ‘자신의 성령’으로, 수식 구조는 ‘여러분에게 자신의 성령을 또한 주시는 하나님’으로 정리합니다. ‘이를 저버리는 자’도 현대 표준어에 맞춰 ‘이것을 저버리는 사람’으로 풉니다.
  terminology: πνεῦμα ... ἅγιον은 ‘성령’으로 유지합니다. αὐτοῦ는 하나님을 가리키므로 ‘자신의 성령’이 자연스럽고 지시 대상도 명료합니다. ἀθετέω의 문맥상 권위 있는 가르침을 물리치거나 무시한다는 뜻은 ‘저버리다’와 각주 대안으로 충분히 반영됩니다.
  issues:
  - severity: medium
    issue: 하나님을 수식하는 분사구의 연결이 압축되어 대조 구조가 덜 선명합니다.
    rationale: 원문은 ‘사람을 저버리는 것이 아니라 하나님을 저버린다’고 한 뒤, 그 하나님을 ‘또한 자신의 성령을 여러분에게 주시는 분’으로 수식합니다. 이를 한국어에서도 명확히 연결하는 것이 좋습니다.
  - severity: low
    issue: ‘자기 성령’은 현대 한국어에서 지시 대상이 잠시 불분명하고 다소 부자연스럽습니다.
    rationale: 하나님을 선행사로 명시하는 ‘자신의 성령’이 αὐτοῦ를 자연스럽게 전달합니다.
  - severity: low
    issue: 각주 b의 ‘영어와 한국어 관용’ 언급은 한국어 번역 각주에 불필요합니다.
    rationale: 원문의 εἰς가 문자적으로 ‘안으로’라는 점과 본문의 관용적 번역만 제시하면 충분합니다.
  revised_text: 그러므로 이것을 저버리는 사람은 사람을 저버리는 것이 아니라, 여러분에게 자신의 성령을 또한 주시는 하나님을 저버리는 것입니다.
  revised_footnotes:
