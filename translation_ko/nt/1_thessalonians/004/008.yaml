    text: 또는 「이것을 무시하는 사람」, 「이것을 거부하는 사람」. 이 동사는 거부하다, 무시하다, 물리치다 등의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 전치사는 문자적으로 「여러분 안으로」입니다. 그러나 여기서는 한국어 관용에 따라 「여러분에게」로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 논리적 결론 표지(‘그러므로’), 일반적 주어, ‘사람이 아니라 하나님’이라는 대조, 그리고 하나님을 수식하는 ‘또한 자신의 성령을 여러분에게 주시는’ 현재분사를 모두 명시적으로 보존했습니다. 각주는 어휘 및 전치사 대안을 제시하되 본문 의미를 변경하지 않습니다.
