review_pass:
  verdict: revise
  source_fidelity: 현 번역은 사람과 하나님을 대조하고 성령을 주시는 하나님을 거부한다는 핵심 구조를 대체로 보존합니다. 그러나 「자기 성령」의 「자기」는 문장 주어인 「이를 저버리는 자」를 가리키는 것으로도 자연스럽게 읽혀, αὐτοῦ가 가리키는 하나님을 불분명하게 만듭니다. 또한 καί의 첨가 의미를 본문에 드러내는 편이 좋습니다.
  naturalness: 「저버리는 자」는 이해 가능하나, 이 구절에서 반복되는 ἀθετέω를 「거부하다」로 일관되게 옮기면 현대 표준어에서 더 직접적이고 자연스럽습니다. 「사람을 거부하는 것이 아니라 ... 하나님을 거부하는 것입니다」는 합쇼체의 격식 있는 문체에도 잘 맞습니다.
  terminology: 「성령」은 τὸ πνεῦμα αὐτοῦ τὸ ἅγιον의 자연스럽고 확립된 한국어 대응입니다. 소유 관계는 「자신의 성령을 주시는 하나님」으로 표현하여 하나님이 성령의 소유자이자 주시는 분임을 문법적으로 분명히 했습니다.
  issues:
  - severity: medium
    issue: 「자기 성령」의 선행사가 불분명함
    rationale: 한국어에서 「자기」는 흔히 주절의 주어인 「이를 저버리는 자」를 가리킬 수 있습니다. 원문의 αὐτοῦ는 관계절이 수식하는 「하나님」을 가리키므로, 하나님의 성령이라는 관계가 분명히 드러나야 합니다.
  - severity: low
    issue: καί(‘또한’)의 의미가 본문에 나타나지 않음
    rationale: τὸν καὶ διδόντα는 하나님을 ‘또한 주시는 분’으로 특정합니다. 「또한」을 넣어 이 첨가 의미를 보존할 수 있습니다.
  - severity: low
    issue: 각주 b의 관용 설명에 영어를 언급함
    rationale: 한국어 번역 각주에서는 한국어 관용만 언급하면 충분하며, 영어 관용을 언급할 필요가 없습니다.
  revised_text: 그러므로 이것을 거부하는 사람은 사람을 거부하는 것이 아니라, 또한 여러분에게 자신의 성령을 주시는 하나님을 거부하는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「이것을 무시하는 사람」, 「이것을 물리치는 사람」. 동사는 「거부하다」, 「무시하다」, 「폐기하다」 등의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 전치사는 문자적으로 「여러분 안으로」입니다. 그러나 여기서는 한국어 관용에 따라 「여러분에게」로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 반복되는 ἀθετέω를 「거부하다」로 일관되게 옮기고, 「자기 성령」이 거부하는 사람의 성령으로 오해될 수 있는 문제를 「자신의 성령을 주시는 하나님」으로 해소했습니다. 또한 καί를 「또한」으로 반영하고 각주 b를 한국어 독자를 위한 설명으로 다듬었습니다.
