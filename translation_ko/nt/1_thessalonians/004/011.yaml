  source_fidelity: 핵심 의미와 세 권면의 병렬 구조는 대체로 잘 반영되었습니다. 다만 πράσσειν τὰ ἴδια는 단순히 어떤 일에 ‘전념하다’라기보다 자신의 일·사정을 돌보고 처리한다는 뜻이므로, 더 직접적인 표현으로 다듬는 것이 좋습니다. καθὼς ὑμῖν παρηγγείλαμεν은 세 권면 전체를 받는 ‘우리가 여러분에게 명한 대로’로 자연스럽게 보존됩니다.
  naturalness: 합쇼체 권면으로 자연스럽습니다. 그러나 ‘여러분 자신의 손으로’는 한국어에서 소유 강조가 다소 중복되므로 ‘여러분의 손으로’가 더 매끄럽습니다. ‘또한’이 문두 접속으로 ‘또’보다 문어적 권면 문맥에 조금 더 적합합니다.
  terminology: ‘조용히 살기를 힘쓰고’는 φιλοτιμεῖσθαι ἡσυχάζειν의 역설적인 적극성과 생활 방식으로서의 조용함을 잘 전달합니다. ‘명한’은 παρηγγείλαμεν의 권위 있는 지시를 충실히 반영합니다.
