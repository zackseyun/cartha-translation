  terminology: ‘복음’, ‘하나님’, ‘마음’은 적절합니다. ‘합당하다고 인정하신’은 완료 수동 δεδοκιμάσμεθα의 승인 결과를, ‘복음을 맡기신’은 πιστευθῆναι의 수탁 의미를 충실히 나타냅니다. 각주에서는 동일 어근 δοκιμάζω의 반복을 설명하되, 이를 과도하게 ‘단어 유희’라고 규정하지 않습니다.
