review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two denials and the appeal to God. However, 「탐욕을 감추는 구실을 댄」is less direct than the Greek construction, which presents a pretext or outward cover serving greed; 「탐욕을 감추기 위한 구실을 내세운」makes that relationship clear. Rendering ἐγενήθημεν as 「여러분에게 나아간」appropriately reflects the visit/ministry context and is more idiomatic than the draft's unqualified 「나아간」.
  naturalness: The revision uses fluent modern formal-polite Korean. 「여러분도 아시는 대로」naturally renders the parenthetical appeal, and 「구실을 내세우다」is more natural and precise here than 「구실을 대다」.
  terminology: 「아첨하는 말」faithfully renders λόγῳ κολακείας. 「탐욕」appropriately renders πλεονεξία without restricting it solely to monetary gain. 「하나님께서 증인이십니다」is a natural solemn rendering of θεὸς μάρτυς in 합쇼체.
  issues:
  - severity: medium
    issue: The phrase 「탐욕을 감추는 구실을 댄」is semantically and idiomatically imprecise.
    rationale: πρόφασις denotes a pretext, pretense, or outward cover. The Korean should identify it as a pretext put forward to conceal greed, rather than suggesting merely that the speakers supplied an unspecified excuse that conceals greed.
  - severity: low
    issue: 「나아간 적이 없고」does not specify the relational context implicit in the visit.
    rationale: Adding 「여러분에게」makes the Korean expression natural and reflects the contextual force represented by the English audit's “came,” without adding substantive meaning.
  revised_text: 우리는 결코 아첨하는 말[a]로 여러분에게 나아간 적이 없으며, 여러분도 아시는 대로 탐욕을 감추기 위한 구실[b]을 내세운 적도 없습니다. 하나님께서 증인이십니다.
  revised_footnotes:
