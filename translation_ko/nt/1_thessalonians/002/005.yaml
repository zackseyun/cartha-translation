- from: 여러분이 아시는 대로, 우리는 결코 아첨하는 말[a]로 나아간 적이 없고, 탐욕을 감추는 구실[b]을 댄 적도 없습니다. 하나님이 증인이십니다.
  to: 우리는 결코 아첨하는 말[a]로 여러분에게 나아간 적이 없으며, 여러분도 아시는 대로 탐욕을 감추기 위한 구실[b]을 내세운 적도 없습니다. 하나님께서 증인이십니다.
