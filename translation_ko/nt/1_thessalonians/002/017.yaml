    text: 직역하면 「여러분에게서 고아가 된 듯이 떨어져」. 헬라어는 사별의 생생한 이미지를 빌려 분리를 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 「형제」는 바울의 호칭으로, 이 문맥에서는 여성을 포함한 신앙 공동체 전체를 가리킬 가능성이 큽니다.
    reason: cultural_note
  revision_rationale: 물리적 현존과 마음의 유대를 대조하는 원문 표현을 정확하고 자연스러운 한국어로 바로잡았으며, 원문에 없는 인과 관계를 제거했습니다. 수동 분리의 뉘앙스, ‘얼굴을 보다’의 개인적·대면적 표현, 그리고 강한 그리움을 모두 유지했습니다.
