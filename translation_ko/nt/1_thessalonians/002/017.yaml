review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘얼굴은 떠나 있었으나’는 προσώπῳ를 신체의 ‘얼굴’로 오해하여, 실제로는 물리적 현존의 부재를 뜻하는 대조를 부정확하게 옮깁니다. 또한 ‘-기에’는 원문에 없는 인과 관계를 다소 강하게 만듭니다. 이를 ‘몸으로는 떠나 있었지만 마음으로는 떠나 있지 않은 채’로 고치면 원문의 대조와 비인과적 병렬을 보존합니다.
  naturalness: ‘몸으로는 … 마음으로는 … 않은 채’는 현대 표준 한국어 합쇼체 문맥에서 자연스럽고, 바울의 정서적 어조도 유지합니다. ‘여러분의 얼굴을 보려고’는 원문의 προσωπον을 살리면서도 한국어 문장 안에서 무리 없이 읽힙니다.
  terminology: ‘형제 여러분’은 ἀδελφοί의 남성형 호칭을 유지하며, 각주가 공동체 전체를 가리킬 수 있음을 적절히 설명합니다. ‘그리움’은 여기서 긍정적인 ἐπιθυμία를 자연스럽게 전달합니다. 고아/사별 이미지는 본문을 어색하게 하지 않고 각주에 보존합니다.
  issues:
  - severity: medium
    issue: ‘얼굴은 떠나 있었으나’
    rationale: προσώπῳ는 여기서 ‘얼굴 자체’가 떠났다는 뜻이 아니라 몸으로 함께 উপস্থিত해 있지 않음을 뜻합니다. 기존 표현은 한국어에서도 의미상 부자연스럽습니다.
  - severity: low
    issue: ‘마음은 그렇지 않았기에’의 인과 표현
    rationale: προσώπῳ οὐ καρδίᾳ는 물리적 부재와 마음의 유대를 대조하는 삽입적 표현이며, 뒤의 노력에 대한 직접적 인과를 명시하지 않습니다.
  - severity: low
    issue: 수동적 분리의 뉘앙스
    rationale: ἀπορφανισθέντες는 수동형이므로 ‘떨어져 나오게 되어’가 단순 능동적 이탈보다 강제로 또는 어쩔 수 없이 분리된 뉘앙스를 더 잘 반영합니다.
  revised_text: 그러나 형제[b] 여러분, 우리는 잠시 동안 여러분에게서 떨어져 나오게 되어[a], 몸으로는 떠나 있었지만 마음으로는 떠나 있지 않은 채 더욱더 큰 그리움으로 여러분의 얼굴을 보려고 간절히 힘썼습니다.
  revised_footnotes:
