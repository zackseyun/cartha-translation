review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 προσώπῳ οὐ καρδίᾳ는 물리적 부재와 마음의 유대를 대조하는 표현인데, 현행의 「얼굴은 떠나 있었으나」는 한국어에서 ‘얼굴’ 자체가 떠난다는 뜻으로 다소 부자연스럽습니다. 또한 ἀπορφανισθέντες의 상실·사별 이미지를 설명하는 각주도 ‘고아처럼 떨어져’보다 원문의 수동적 ‘고아가 되다/사별로 잃다’ 이미지를 더 정확히 밝혀야 합니다.
  naturalness: 현행 본문은 긴 삽입 대시와 「얼굴은 떠나 있었으나 마음은 그렇지 않았기에」 때문에 문장 흐름이 다소 무겁고 어색합니다. 「몸으로만 그러했을 뿐 마음으로는 그렇지 않았습니다」라고 풀면 현대 표준어 합쇼체로 자연스럽고 원문의 대조도 명료합니다.
  terminology: 「형제 여러분」은 ἀδελφοί의 문법적 형태를 보존하며, 포괄적 청자 범위는 각주로 설명한 점이 적절합니다. 「큰 그리움」은 여기의 ἐπιθυμία를 자연스럽게 옮깁니다. 「여러분의 얼굴을 보려고」는 τὸ πρόσωπον ὑμῶν ἰδεῖν의 개인적·대면적 뉘앙스를 보존합니다.
  issues:
  - severity: medium
    issue: 「얼굴은 떠나 있었으나」라는 표현
    rationale: προσώπῳ οὐ καρδίᾳ는 ‘대면하여/몸으로는, 마음으로는 아니다’라는 대조입니다. 한국어에서 얼굴이 떠나 있었다고 하면 신체 부위가 이동한 듯 들리므로, 물리적 부재를 나타내는 「몸으로만」 또는 「직접 만나지는 못했지만」이 적절합니다.
  - severity: low
    issue: 각주 a의 직역 설명
    rationale: ἀπορφανισθέντες는 단순한 비교 표현인 ‘고아처럼’이라기보다 ‘고아가 되다, 사별로 잃다’라는 강한 상실의 수동적 이미지를 환기합니다. 각주에서 이 점을 더 정확히 설명하는 것이 좋습니다.
  revised_text: 그러나 형제[b] 여러분, 우리는 잠시 동안 여러분에게서 떨어져 있었지만, 몸으로만 그러했을 뿐 마음으로는 그렇지 않았습니다. 그래서 더욱더 큰 그리움으로 여러분의 얼굴을 보려고 힘썼습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 「여러분에게서 고아가 되다」라는 뜻이다. 헬라어는 사별로 인한 상실을 떠올리게 하는 생생한 표현으로 이별을 묘사한다.
    reason: lexical_alternative
  - marker: b
    text: 「형제」는 바울의 호칭으로, 이 문맥에서는 여성을 포함한 신앙 공동체 전체를 가리킬 가능성이 크다.
    reason: cultural_note
  revision_rationale: 물리적 부재와 마음의 유대라는 원문의 대조를 자연스러운 한국어로 명확히 했습니다. 또한 주동사 ἐσπουδάσαμεν의 노력·열심의 뜻, 비교급 περισσοτέρως의 강화, 그리고 ‘얼굴을 보다’라는 대면적 표현을 유지했습니다. 각주 a는 ἀπορφανισθέντες의 사별·상실 이미지를 더 정확하게 설명하도록 고쳤습니다.
