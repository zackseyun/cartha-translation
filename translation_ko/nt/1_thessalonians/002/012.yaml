  verdict: revise
  source_fidelity: 핵심 의미는 잘 반영하였으나, εἰς τὸ + 부정사의 목적 용법은 한국어에서 ‘~하게 하였습니다’보다 ‘~하도록 하였습니다’가 더 정확하고 자연스럽습니다. 또한 ἑαυτοῦ의 강조는 ‘자기의’가 가까운 복수 명사 ‘여러분’을 가리키는 듯 보일 수 있으므로 하나님을 명시하여 보존하는 것이 안전합니다.
  naturalness: 합쇼체 서술은 적절합니다. 다만 ‘엄히 권하여’는 원문의 엄숙한 호소보다 가혹하거나 엄격하게 꾸짖는 뉘앙스를 낼 수 있어 ‘엄숙히 권하여’가 더 적절합니다. ‘하나님께 합당하게 행하도록’은 성경적 비유를 유지하면서도 자연스럽습니다.
  terminology: ‘권면하다’, ‘위로하다’, ‘행하다’, ‘나라와 영광’은 표준 한국어 성경 문체와 잘 맞습니다. ‘하나님 자신의 나라와 영광’으로 ἑαυτοῦ의 재귀적 강조와 선행사를 분명히 합니다.
  issues:
  - severity: medium
    issue: ‘행하게 하였습니다’가 εἰς τὸ περιπατεῖν의 목적 관계를 다소 불분명하게 합니다.
    rationale: εἰς τὸ와 관사 부정사는 여기서 바울의 권면·위로·호소가 지향하는 목적을 나타냅니다. ‘행하도록 하였습니다’가 이 관계를 자연스럽고 정확하게 드러냅니다.
  - severity: low
    issue: ‘자기의 나라’의 선행사가 한국어에서 잠시 모호할 수 있습니다.
    rationale: 그리스어 ἑαυτοῦ는 하나님을 가리키지만, 한국어 ‘자기’는 인접한 ‘여러분’과 연결되어 읽힐 여지가 있습니다. ‘하나님 자신의’으로 선행사를 명시하는 것이 좋습니다.
  - severity: low
    issue: ‘엄히 권하여’는 지나치게 엄격한 훈계의 뉘앙스를 줄 수 있습니다.
    rationale: μαρτυρόμενοι는 이 문맥에서 엄숙하고 진지하게 권하거나 호소하는 뜻입니다. ‘엄숙히 권하여’가 그 강도를 보존하면서 불필요한 가혹함을 피합니다.
  - severity: low
    issue: 각주 b의 ‘「행함」(걷다)’라는 표기는 본문의 동사형 및 비유 설명과 맞지 않습니다.
    rationale: 본문은 ‘행하도록’이며, περιπατεῖν의 문자적 뜻은 ‘걷다’입니다. 각주는 ‘행하다’가 삶의 방식이라는 비유임을 직접 설명해야 합니다.
