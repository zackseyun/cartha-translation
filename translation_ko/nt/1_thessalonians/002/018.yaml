- from: 우리가 여러분에게 가기를 원하였기 때문입니다. 나 바울로서는 한 번 두 번[a] 그렇게 하려 하였으나, 사탄이 우리를 가로막았습니다.
  to: 우리가 여러분에게 가고자 했기 때문입니다. 나 바울은 한 번 두 번[a] 여러분에게 가고자 했으나, 사탄이 우리를 가로막았습니다.
  rationale: The revision preserves διότι as an explanatory clause, keeps Paul's personal singling-out within the plural 'we,' and explicitly connects the repeated intention to coming to the Thessalonians. It retains the close idiomatic rendering 「한 번 두 번」with a clarifying footnote, without overstating the number or frequency of attempts.
