review_pass:
  verdict: revise
  source_fidelity: 주요 명사열(소망, 기쁨, 자랑의 면류관)과 수사 의문문의 기본 의미는 잘 옮겼습니다. 그러나 종말론적 문맥의 παρουσίᾳ를 본문에서 「임재하실」로 옮기면 도래/오심의 사건성을 약화시키며, 영어 POB의 선택인 “coming” 및 본문의 문맥과도 거리가 있습니다. 또한 καὶ의 ‘또한/도’가 「바로」만으로는 충분히 드러나지 않습니다.
  naturalness: 합쇼체는 적절합니다. 다만 시간·장소 구문을 문두에 두고 「여러분도」를 사용하면 한국어 수사 의문문으로 더 자연스럽고 원문의 강조도 더 잘 살아납니다.
  terminology: 「소망」, 「기쁨」, 「자랑의 면류관」, 「우리 주 예수」는 적절합니다. 「면류관」은 στέφανος의 영예·승리 이미지를 한국어 성경 문체 안에서 자연스럽게 전달합니다. παρουσίᾳ는 여기서 「오실 때」로 옮기고, ‘임재/도래’의 어휘적 범위는 각주에 보존하는 것이 가장 안전합니다.
  issues:
  - severity: medium
    issue: παρουσίᾳ를 「임재하실 때」로 본문에 번역함
    rationale: παρουσία는 ‘임재’의 의미 범위를 지니지만, 이 문맥에서는 주 예수의 미래 오심을 가리킵니다. 「오실 때」는 그 문맥적 의미를 자연스럽게 전달하며, ‘임재/도래’ 대안은 각주로 보존할 수 있습니다.
  - severity: low
    issue: οὐχὶ καὶ ὑμεῖς의 καὶ가 명시되지 않음
    rationale: 「바로 여러분이」는 강조를 전달하지만 καὶ의 ‘또한/도’는 드러나지 않습니다. 「바로 여러분도」는 원문의 첨가·강조를 자연스럽게 반영합니다.
  revised_text: 우리 주 예수께서 오실 때에 그분 앞에서 우리의 소망이나 기쁨이나 자랑의 면류관이 무엇이겠습니까? 바로 여러분도 아니겠습니까?
  revised_footnotes:
  - marker: a
    text: 또는 「임재 때」 또는 「도래 때」. 헬라어 παρουσία는 임재 또는 도래를 가리킬 수 있습니다. 이 문맥에서는 주 예수의 미래 오심을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 문맥상 미래의 오심을 가리키는 παρουσίᾳ를 「오실 때」로 번역하여 원문의 사건적 의미와 영어 POB의 선택을 반영했습니다. 동시에 각주에 ‘임재’와 ‘도래’라는 어휘적 대안을 남겨 의미 범위를 보존했습니다. 「여러분도」로 καὶ의 첨가적 강조를 반영했으며, 원문의 수사 의문문과 핵심 용어는 유지했습니다.
