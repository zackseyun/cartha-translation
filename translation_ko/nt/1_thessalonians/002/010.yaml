review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 원문의 ὁσίως는 하나님 앞에서의 경건함을 뜻하므로, 영어 POB의 ‘devoutly’ 및 제시된 각주와도 일치하게 「경건하고」가 「거룩하고」보다 정확합니다. 또한 현 문안의 끝맺음 「행하였는지를.」은 문법적으로 미완결입니다.
  naturalness: 합쇼체와 현대 표준어에 맞추어, 증언의 내용인 행실을 먼저 제시하고 이어 증인을 밝히는 한국어 문장 구조로 정리하는 것이 자연스럽습니다. 「여러분이 증인이시며」는 청자 존대에도 적절합니다.
  terminology: 「경건하고, 의롭고, 흠 없이」는 각각 ὁσίως, δικαίως, ἀμέμπτως를 자연스럽고 신학적으로 과장 없이 옮깁니다. 「믿는 여러분에게」는 τοῖς πιστεύουσιν의 현재적·인칭적 성격을 보존합니다.
  issues:
  - severity: high
    issue: 문장이 명사절 「행하였는지를」로 끝나 문법적으로 완결되지 않습니다.
    rationale: ὡς 이하의 내용은 ‘여러분과 하나님이 증인’이라는 진술에 연결되어야 합니다. 현재 마침표 앞의 「-는지를」은 뒤에 받을 서술어가 없어 독립 문장으로 성립하지 않습니다.
  - severity: medium
    issue: 「거룩하고」는 ὁσίως의 경건·신심의 뉘앙스를 다소 넓게 옮깁니다.
    rationale: ὁσίως는 특히 하나님을 향한 경건한 행실을 가리킵니다. 「경건하고」가 영어 POB의 ‘devoutly’ 및 기존 대안 각주와 더 직접적으로 대응합니다.
  revised_text: 우리가 믿는 여러분에게[b] 얼마나 경건하고[a] 의롭고 흠 없이 행하였는지에 대하여, 여러분이 증인이시며 하나님도 증인이십니다.
  revised_footnotes:
