review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하나, 본문의 종결이 「…행하였는지를」로 끝나 문장 구조가 미완성입니다. 또한 ὁσίως는 여기서 하나님 앞에서의 경건한 태도를 가리키므로 「경건하게」가 「거룩하고」보다 문맥상 더 정확합니다. 여격 ὑμῖν은 관계의 대상을 나타내며 「여러분 앞에서」는 자연스러우면서도 ‘여러분에게/가운데서’의 가능한 뉘앙스를 과도하게 확정하지 않습니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 완결된 문장으로, 바울 일행의 행실에 관하여 데살로니가 신자들과 하나님께 증언을 호소하는 구조를 자연스럽게 드러냅니다.
  terminology: 「경건하게, 의롭게, 흠 없이」는 ὁσίως, δικαίως, ἀμέμπτως의 윤리적·경건적 병렬을 보존합니다. 「증인이십니다」는 청자와 하나님 모두에게 적절한 존대 표현입니다.
  issues:
  - severity: high
    issue: 문장이 미완성으로 끝남
    rationale: 「우리가 … 행하였는지를」는 앞의 ‘증인’ 진술과 문법적으로 연결되지 않아 완결된 한국어 문장이 아닙니다.
  - severity: medium
    issue: ὁσίως의 번역
    rationale: 「거룩하고」도 가능한 번역이지만, 이 문맥의 부사 ὁσίως는 하나님 앞에서 경건하게 행한 태도를 강조하므로 「경건하게」가 더 직접적이고 자연스럽습니다.
  - severity: low
    issue: 여격 표현의 자연스러움
    rationale: 「믿는 여러분에게 행하다」는 한국어에서 다소 어색합니다. 「믿는 여러분 앞에서 행하다」는 증인 호소 문맥과 행동의 공개성을 자연스럽게 전달하며, 각주로 ‘가운데서’의 가능성을 남깁니다.
  revised_text: 우리가 믿는 여러분 앞에서 얼마나 경건하고 의롭게 그리고 흠 없이 행하였는지에 대하여, 여러분은 증인이시며 하나님도 증인이십니다.
  revised_footnotes:
  - marker: a
    text: 또는 「거룩하게」. 헬라어 ὁσίως는 하나님 앞에서의 경건한 행실을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「믿는 여러분 가운데서」.
    reason: lexical_alternative
  revision_rationale: 미완성 문장을 원문의 증인 호소 구조에 맞추어 완결하고, ὁσίως를 문맥상 더 적합한 「경건하게」로 옮겼습니다. 여격의 해석상 여지를 각주로 보존했습니다.
