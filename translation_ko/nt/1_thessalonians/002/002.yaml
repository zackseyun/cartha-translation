  source_fidelity: 개역 초안은 절의 기본 구조와 핵심 어휘를 대체로 반영합니다. 그러나 ὑβρισθέντες는 단순한 ‘모욕을 당하다’보다 수치와 부당한 학대를 포함하므로 본문에서 이를 더 분명히 드러내는 편이 정확합니다. ἐν πολλῷ ἀγῶνι의 ‘큰 싸움’은 의미상 가능하나 현대 한국어에서는 다소 구체적인 물리적 싸움으로 들릴 수 있습니다.
  naturalness: ‘그러나’, ‘앞서 고난을 겪고’, ‘수치스러운 학대를 당하였지만’, ‘큰 분투 가운데서’가 현대 표준어 합쇼체에서 더 자연스럽고 문맥에 적합합니다. ‘우리 하나님 안에서’는 다소 직역적이지만, 원문의 의도적으로 폭넓은 전치사구를 보존하므로 유지합니다.
  terminology: ‘하나님의 복음’은 바울 서신의 정착된 신학 용어를 적절히 보존합니다. ‘수치스러운 학대’는 ὑβρίζω의 공적 수치와 무례한 처우의 함의를 반영하며, ‘큰 분투’는 ἀγών의 संघर्ष/투쟁 의미를 보존합니다.
