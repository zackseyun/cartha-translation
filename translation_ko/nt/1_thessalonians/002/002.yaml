- from: 오히려 여러분이 아시는 대로 빌립보에서 미리 고난을 받고 모욕[a]을 당하였음에도 불구하고, 우리는 우리 하나님 안에서 담대히[b] 여러분에게 하나님의 복음을 큰 싸움[c] 가운데서 전하였습니다.
  to: 그러나 여러분이 아시는 바와 같이, 우리는 빌립보에서 앞서 고난을 겪고 수치스러운 학대[a]를 당하였지만, 우리 하나님 안에서 담대히[b] 여러분에게 하나님의 복음을 큰 분투[c] 가운데서 전하였습니다.
  rationale: 접속사 ἀλλά는 앞 절과의 대조를 자연스럽게 나타내도록 ‘그러나’로 옮겼습니다. 앞선 고난과 빌립보에서의 수치스러운 처우를 보존하고, ὑβρισθέντες의 의미를 단순 ‘모욕’보다 넓게 반영했습니다. ‘우리 하나님 안에서’는 ἐν τῷ θεῷ ἡμῶν의 관계적·영역적 표현을 해석으로 좁히지 않기 위해 유지했습니다. ‘큰 분투’는 ἀγών의 격렬한 संघर्ष을 자연스러운 현대 한국어로 표현합니다.
  reviewer_model: gpt-5.6-terra
