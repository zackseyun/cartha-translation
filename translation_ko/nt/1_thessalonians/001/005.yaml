  source_fidelity: 핵심 의미는 대체로 충실합니다. 「말로만이 아니라」는 οὐκ … μόνον ἀλλὰ καί의 대조를 자연스럽게 반영하며, 「성령」과 「여러분을 위하여」도 문맥과 원문에 맞습니다. 다만 οἷοι ἐγενήθημεν은 바울 일행을 가리키므로 단수 「어떠한 사람」보다 복수로 옮기는 것이 원문의 지시 대상과 한국어 문법에 더 정확합니다.
  naturalness: 「능력과 성령과 큰 확신 가운데 임하였기」는 수식 범위가 다소 무겁고, 특히 「큰 확신 가운데 임하다」가 한국어에서 부자연스럽습니다. 「큰 확신과 함께」로 하면 πληροφορίᾳ πολλῇ의 수반 의미와 주체가 명시되지 않은 원문의 여지를 보존하면서 더 자연스럽습니다. 둘째 절은 복수 「어떠한 사람들이 되었습니다」가 자연스럽습니다.
