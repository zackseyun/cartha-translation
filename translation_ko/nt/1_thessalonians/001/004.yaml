  lexicon: BDAG
  rationale: 분사형이나 3절을 이어 받아 종결 동사로 풀어내는 편이 한국어 어순상 자연스럽다. 합쇼체 종결로 마무리한다.
- source_word: ἀδελφοὶ
  english_pob_choice: brothers
  chosen_korean: 형제
