  to: 그들 자신이 우리가 여러분에게 어떠한 방식으로 받아들여졌는지[a], 또 여러분이 살아 계시고 참되신 하나님[c]을 섬기기 위해 우상들을 떠나 하나님께로 어떻게 돌아섰는지[b] 우리에 관하여 알리고 있기 때문입니다.
