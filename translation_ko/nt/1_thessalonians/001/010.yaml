review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 「알리고 있기 때문입니다」는 본절의 헬라어 본문에 없는 앞절의 보고 동사와 인과 관계를 도입합니다. 또한 「기다리게 되었는지」는 본절의 부정사 연속을 의문·간접화법 구조로 바꾸므로 삭제해야 합니다. 「하늘로부터 오실」은 하늘로부터 아들을 기다린다는 헬라어의 공간적 수식 관계를 자연스러운 한국어로 풀어낸 것입니다.
  naturalness: 수정문은 여러 동격·관계절을 한국어 어순에 맞게 배치하고, 본절이 앞절에 이어지는 부정사 구문임을 「기다리는 것입니다」로 자연스럽게 유지합니다. 합쇼체의 서술 종결도 갖추었습니다.
  terminology: 「하나님께서 죽은 자들 가운데서 일으키신」, 「진노」, 「건지시는」은 각각 ἤγειρεν, ὀργή, ῥυόμενον의 의미를 충실히 반영합니다. 「다가오는 진노」는 그 지시 대상을 특정 종말론 체계로 한정하지 않습니다.
  issues:
  - severity: high
    issue: 본문에 없는 「알리고 있기 때문입니다」의 삽입
    rationale: καὶ ἀναμένειν으로 시작하는 본절에는 ‘알리다’에 해당하는 동사나 ‘때문에’라는 인과 표지가 없습니다. 이는 앞절의 ἀπαγγέλλουσιν 및 문맥을 본절 본문에 부당하게 끌어들입니다.
  - severity: medium
    issue: 「기다리게 되었는지」의 의문·간접화법화
    rationale: ἀναμένειν은 앞절의 하나님께로 돌아섬의 목적/내용을 잇는 부정사입니다. 「~는지」는 원문에 없는 간접의문 구조를 형성합니다.
  - severity: low
    issue: 각주 대안의 표현
    rationale: 「오실 진노」도 가능한 표현이나, 본문의 「다가오는」과 어휘적으로 직접 대응하는 「다가오는 진노에서 우리를 구하시는」이 대안으로 더 명료합니다.
  revised_text: 또한 하늘로부터 오실 그분의 아들, 곧 하나님께서 죽은 자들 가운데서 일으키신 예수, 다가오는 진노에서 우리를 건지시는 분을 기다리는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「다가오는 진노에서 우리를 구하시는」. 현재 분사 ῥυόμενον은 예수의 정체성과 행위로서의 구원을 가리키며, 다가오는 진노라는 미래 지향적 정황과 함께 쓰입니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 보고·인과 표현과 간접의문 구조를 제거하고, καὶ ἀναμένειν의 앞절 연속 기능을 유지했습니다. 예수에 대한 동격 표현과 하나님께서 그를 죽은 자들 가운데서 일으키셨다는 관계절을 보존했으며, 현재 분사 ῥυόμενον은 미래형으로 좁히지 않고 「건지시는 분」으로 옮겼습니다.
