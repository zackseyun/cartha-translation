review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘(하늘로부터, 죽은 자들 가운데서 일으키신, 다가오는 진노, 건지시는)는 대체로 원문에 충실합니다. 그러나 현행문은 ἀναμένειν의 목적어인 ‘그분의 아들’을 문법적으로 주어화하면서 ‘예수께서 하늘로부터 오시기를 기다리게’라는 어색한 구조가 되었고, 원문 및 직전 문맥에 없는 인과 표현 ‘때문입니다’를 덧붙입니다. 이 부정사구는 1:9의 ‘그들이 … 전하고 있습니다’에 이어지는 내용이므로 이를 명시하여 한국어 문장을 바로잡아야 합니다.
  naturalness: ‘예수께서 하늘로부터 오시기를 기다리게 되었는지 알리고 있기 때문입니다’는 누가 기다리는지와 누가 오는지가 문법적으로 혼동되며, ‘알리고 있기 때문입니다’도 문맥상 부자연스럽습니다. ‘… 예수께서 하늘로부터 오시기를 기다리고 있다고 전하고 있습니다’가 현대 표준어 합쇼체로 자연스럽고 원문의 문맥 의존적 부정사 구조를 명료하게 재현합니다.
  terminology: ‘진노’, ‘건지시는’, ‘죽은 자들 가운데서 일으키신’, ‘예수’는 적절합니다. ‘하나님의 아들’은 대명사 ‘그분의 아들’보다 선행사 지시가 명확하면서도 원문의 신적 아들 칭호를 그대로 유지합니다. 각주도 본문의 현재 분사 해석과 어휘 대안을 적절히 설명합니다.
  issues:
  - severity: high
    issue: 원문에 없는 인과 종결 표현 ‘때문입니다’가 추가됨
    rationale: καὶ ἀναμένειν은 1:9의 전언 내용에 병렬로 연결된 부정사이며, 인과를 나타내지 않습니다. ‘때문입니다’는 문장 관계와 의미를 바꿉니다.
  - severity: high
    issue: ‘예수께서 … 오시기를 기다리게’의 통사적 주체·목적어 혼선
    rationale: 기다리는 주체는 데살로니가 신자들이며, 기다림의 대상은 하늘로부터 오실 하나님의 아들 예수입니다. 현행 문장은 예수가 기다리는 주체처럼 읽힐 수 있습니다.
  - severity: medium
    issue: 1:9에서 이어지는 ‘그들이 전하고 있습니다’의 지배 구조가 불명확함
    rationale: 절 단위 한국어에서는 부정사구가 무엇에 의존하는지 드러내기 위해 전언 동사를 보충하는 것이 필요합니다. 이는 원문의 직전 문맥을 재현하는 것이며 의미를 추가하지 않습니다.
  revised_text: 또 하나님께서 죽은 자들 가운데서 일으키신 하나님의 아들, 곧 다가오는 진노에서 우리를 건지시는 예수께서 하늘로부터 오시기를 기다리고 있다고 그들이 전하고 있습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「오실 진노에서 우리를 구하시는」. 현재 분사 ῥυόμενον은 예수의 정체성과 행위로서의 구원을 가리키며, 다가오는 진노라는 미래 지향적 맥락 속에 놓여 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문 부정사 ἀναμένειν이 1:9의 ‘그들이 전하고 있습니다’에 연결됨을 한국어에서 명료하게 드러내고, 기다리는 이들과 기다림의 대상의 관계를 바로잡았습니다. ‘하늘로부터 오시기를’은 ‘하늘로부터 그의 아들을 기다리다’라는 한국어의 자연스러운 표현으로서 문맥상 귀환의 함의를 표현하되, 진노의 성격이나 구원의 시간적 양상을 특정 교리로 한정하지 않습니다. 각주는 현재 분사의 성격적 용법과 어휘 대안을 유지하되 문장을 다듬었습니다.
