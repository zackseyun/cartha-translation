review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 ἔπεμψα는 목적어를 명시하지 않는데 초안의 「사람을」은 문맥상 디모데를 가리킬 수 있으나 이 절 자체에 없는 정보를 본문에 보충합니다. 또한 μή πως 절은 보낸 목적에 딸린 우려를 나타내므로, 이를 별도의 「…염려하였기 때문입니다」라는 인과절로 처리하기보다 「…않을까 하여」로 연결하는 편이 원문 구조에 가깝습니다.
  naturalness: 「더 이상 참을 수 없어서」와 「수고가 헛되지 않을까 하여」는 현대 표준어 합쇼체에서 자연스럽고, 원문의 지속적 인내가 한계에 이른 뜻과 우려의 뉘앙스를 잘 전달합니다.
  terminology: 「믿음」은 πίστις의 기본 번역으로 적절하며, 대안 의미는 각주로 보존합니다. 「시험하는 자가 … 시험하여」는 πειράζων/ἐπείρασεν의 어근 반복을 보존하며, 원문이 사탄이라는 고유명을 쓰지 않는 점도 유지합니다. 「헛되게 되다」보다 「헛되지 않다」가 εἰς κενὸν γένηται를 더 자연스럽게 옮깁니다.
  issues:
  - severity: medium
    issue: 「사람을 보냈습니다」가 원문에 없는 목적어를 보충함
    rationale: ἔπεμψα의 목적어는 이 절에 명시되어 있지 않습니다. 앞 문맥상 누구를 보냈는지는 알 수 있어도, 최적 등가 번역의 본문에서는 이를 추가하지 않는 편이 안전합니다.
  - severity: medium
    issue: 「…염려하였기 때문입니다」가 원문의 목적/우려 관계를 인과절로 재구성함
    rationale: μή πως 이하의 절은 보낸 행위와 연결된 우려를 나타냅니다. 「…않을까 하여」로 연결하면 원문의 관계를 더 직접적으로 반영합니다.
  - severity: low
    issue: 「헛되게 되지 않을까」의 한국어 결합이 다소 부자연스러움
    rationale: 「우리의 수고가 헛되지 않을까」가 같은 의미를 더 자연스럽게 전달합니다.
  revised_text: 이런 까닭에 나도 더 이상 참을 수 없어서, 혹시 시험하는 자가 여러분을 시험하여 우리의 수고가 헛되지 않을까 하여 여러분의 믿음[a]을 알아보려고 보냈습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「여러분의 신실함」, 「여러분의 신뢰」. 헬라어 πίστις는 문맥에 따라 이러한 의미들을 함께 지닐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 「공허하게」, 「아무 결실 없이」.
    reason: lexical_alternative
  revision_rationale: 원문에 명시되지 않은 「사람」을 삭제하고, 우려를 나타내는 μή πως 절을 「…않을까 하여」로 보낸 행위에 직접 연결했습니다. 각주 b는 본문에 더 이상 해당 어구가 없어 제거해야 하지만, 구조적 각주 세트 보존이 요구되는 형식이라면 사용하지 않는 각주를 유지하지 말고 해당 각주 자체를 삭제하는 것이 맞습니다. 따라서 유효한 최종 각주는 a 하나입니다.
