translation:
  language: ko
  text: 여러분이 주 안에 굳게 서 있다면, 우리는 이제 살아 있습니다[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 앞 절을 설명하거나 그 이유를 덧붙이는 헬라어 접속사는 「왜냐하면」, 「실로」로 옮기거나 한국어에서 드러내지 않을 수 있다.
    reason: lexical_alternative
  - marker: b
    text: 「우리는 살아 있습니다」는 단순한 생존만이 아니라, 새로 얻은 격려와 활력을 나타내는 수사적 표현일 수 있다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν ζῶμεν
  english_pob_choice: now we live
  chosen_korean: 우리는 이제 살아납니다
  alternatives_korean:
  - 우리는 지금 살아 있습니다
  - 우리는 이제 살았다는 마음입니다
  lexicon: BDAG
  rationale: 단순 「살아 있다」가 아니라 곤경 가운데 회복된 활력의 수사. 한국어 「살아나다」가 본문의 정서적 무게를 담는다.
- source_word: ἐὰν ὑμεῖς στήκετε ἐν κυρίῳ
  english_pob_choice: if you stand firm in the Lord
  chosen_korean: 여러분이 주 안에 굳게 서 있기에
  alternatives_korean:
  - 여러분이 주 안에 견고히 서 있다면
  - 여러분이 주 안에 서 있는 한
  lexicon: BDAG
  rationale: 본 문맥의 ἐάν은 실현된 조건. 한국어 「~ 있기에」가 결과의 근거를 분명히 한다. 영어 POB의 「if」 선택보다 본 절 흐름이 명확해진다.
