review_pass:
  verdict: revise
  source_fidelity: 원문의 δέ는 강한 대조가 아니라 기원의 전환을 표시하므로 한국어에서 별도 접속사로 반드시 재현할 필요는 없습니다. 그러나 Αὐτός의 강조, ‘우리 하나님 아버지’와 ‘우리 주 예수’라는 병렬 주어, 기원법, 그리고 ‘우리의 길을 여러분에게로’라는 이동의 방향은 보존되어야 합니다. 초안의 ‘이제’는 원문의 시간 부사가 아니며, ‘하나님 아버지 친히와’는 αὐτός의 수식 범위와 병렬 구조를 문법적으로 잘못 처리합니다.
  naturalness: ‘우리 하나님 아버지와 우리 주 예수께서 친히’가 현대 표준어 합쇼체에서 자연스럽고, 친히가 두 병렬 주어의 공동 행위를 강조하도록 배치됩니다. ‘우리가 여러분에게로 가는 길’을 사용하여 한국어에서 어색한 ‘길을 … 인도하다’를 피하면서 원문의 여행 맥락과 비유적 여지를 유지합니다.
  terminology: ‘하나님 아버지’, ‘주 예수’, ‘친히’, ‘빕니다’는 존엄하고 현대적인 성경 번역 문체에 적합합니다. 그리스어의 단수 기원 동사는 한국어에서 수 표지가 드러나지 않으므로 각주에서만 문법 사실을 중립적으로 설명합니다.
  issues:
  - severity: medium
    issue: ‘이제’가 문두에 추가되어 있습니다.
    rationale: δέ는 전환 또는 약한 연결을 나타내지만 시간 부사 ‘이제’ 자체를 뜻하지 않습니다. 한국어 기원문에서는 무표지로 자연스럽게 처리할 수 있습니다.
  - severity: high
    issue: ‘우리의 하나님 아버지 친히와 우리 주 예수께서’는 병렬 주어와 ‘친히’의 결합이 비문입니다.
    rationale: 친히는 접속사 ‘와’ 앞에 둘 수 없으며, 원문의 αὐτός는 병렬된 주어 전체를 강조하는 위치로 옮겨야 합니다.
  - severity: medium
    issue: ‘우리의 길을 여러분에게로 곧게 인도하다’가 한국어에서 부자연스럽습니다.
    rationale: 한국어에서는 사람이 가는 길을 ‘곧게 해 주다’ 또는 ‘열어 주다’라고 하는 편이 자연스럽습니다. ‘우리가 여러분에게로 가는 길’은 원문의 소유격과 목적지를 충실히 풀어냅니다.
  revised_text: 우리 하나님 아버지와 우리 주 예수께서 친히 우리가 여러분에게로 가는 길을 곧게 해 주시기를 빕니다[a].
  revised_footnotes:
  - marker: a
    text: 그리스어에서는 「우리 하나님 아버지」와 「우리 주 예수」라는 두 주어가 단수 동사 하나와 연결되어 있다.
    reason: cross_reference
  - marker: b
    text: 또는 「우리가 여러분에게로 가는 길을 곧게 인도해 주시기를」.
    reason: lexical_alternative
  revision_rationale: 문법적으로 어색한 ‘친히와’를 바로잡고, 무근거의 시간적 ‘이제’를 삭제했습니다. ‘친히’를 두 병렬 주어 뒤에 두어 원문의 강조를 보존했습니다. 또한 ‘우리가 여러분에게로 가는 길’을 통해 κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς의 여행 방향을 한국어답게 재현했습니다. 대안 번역 각주는 본문에 붙지 않는 b 표지를 제거하고, 실제 대안에 맞춰 a 표지 뒤에 배치했습니다.
