translation:
  language: ko
  text: 이는 누구도 이러한 환난[b]으로 흔들리지[a] 않게 하려는 것이었습니다. 여러분 자신이 우리가 이러한 환난을 겪도록 정해져 있다는[c] 것을 알고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「동요되지」, 「불안에 빠지지」. 이 드문 동사는 다른 문맥에서 「속아 넘어가지」 또는 「아첨에 넘어가지」라는 의미도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「고난들」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「우리가 이러한 일을 겪도록 운명지어져 있다」, 「우리가 이를 위해 세워져 있다」.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδένα σαίνεσθαι
  english_pob_choice: no one would be shaken
  chosen_korean: 누구도 ... 흔들리지 않게
  alternatives_korean:
  - 누구도 동요되지 않게
  - 아무도 마음이 흔들리지 않게
  lexicon: BDAG
  rationale: σαίνω는 「꼬리치다·흔들다」, 수동으로는 「동요·흔들림」. 「흔들리다」가 본문의 정서적 동요 의미를 가장 잘 담는다.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  english_pob_choice: by these afflictions
  chosen_korean: 이 환난들로 인하여
  alternatives_korean:
  - 이 고난들로 인해
  - 이 환난 가운데서
  lexicon: BDAG
  rationale: 1:6과 일관된 「환난」 어휘. 「~로 인하여」가 원인을 분명히 한다.
- source_word: εἰς τοῦτο κείμεθα
  english_pob_choice: we are appointed for this
  chosen_korean: 이 일을 위하여 정해져 있다
  alternatives_korean:
  - 이 일에 세워져 있다
  - 이 일에 부르심을 받았다
  rationale: κεῖμαι의 「두어져 있다·정해져 있다」. 신적 작정의 함의를 「정해져 있다」로 보존하되, 특정 교리 체계로 좁히지 않는다.
  lexicon: BDAG
