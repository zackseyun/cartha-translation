review_pass:
  verdict: revise
  source_fidelity: 「여러분과 여러분의 믿음을 통해」는 ἐφ’ ὑμῖν과 διὰ τῆς ὑμῶν πίστεως를 모두 「통해」의 수단으로 결합하여, 바울이 데살로니가 교인들 자체와 그들의 믿음을 통해 위로받았다는 뜻으로 바꿉니다. 원문에서 ἐφ’ ὑμῖν은 그들이 관심과 위로의 관련 대상임을, διὰ τῆς ὑμῶν πίστεως는 위로의 수단을 나타냅니다.
  naturalness: 「여러분과 관련하여」는 원문의 관계를 분명히 하면서 현대 표준 한국어의 격식 있는 문체에 맞습니다. 반복되는 「여러분」은 원문의 소유·지시 관계를 보존하기 위해 허용됩니다.
  terminology: 「곤경과 환난」은 ἀνάγκη와 θλῖψις의 병렬을 적절히 구별하며, 「위로를 받았습니다」는 παρεκλήθημεν에 알맞습니다. πίστις는 본문에서 「믿음」으로 유지하고 「신실함」 가능성은 각주에 남깁니다. 「형제」 각주는 호칭이 회중 전체를 포괄할 수 있음을 적절히 설명합니다.
  issues:
  - severity: medium
    issue: ἐφ’ ὑμῖν의 기능이 수단 표현으로 오해됨
    rationale: 초안의 「여러분과 여러분의 믿음을 통해」는 「여러분」과 「여러분의 믿음」을 동등한 위로의 수단으로 만듭니다. 원문은 ‘여러분과 관련하여/여러분의 일로’ 위로받았고, 그 위로는 ‘여러분의 믿음을 통해’ 받은 것이라고 구별합니다.
  revised_text: 그러므로 형제[b] 여러분, 우리는 여러분과 관련하여 우리의 모든 곤경과 환난 가운데서 여러분의 믿음[a]을 통해 위로를 받았습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「여러분의 신실함을 통해」. 헬라어 πίστις는 믿음, 신뢰, 또는 신실함을 뜻할 수 있으며, 여기서는 데살로니가 신자들이 믿음 안에 굳게 서 있는 의미도 함께 담고 있을 수 있다.
    reason: alternative_reading
  - marker: b
    text: 「형제」는 바울이 공동체 전체를 부르는 통상적 호칭으로, 전 신앙 공동체를 포함할 수 있다.
    reason: cultural_note
  revision_rationale: ἐφ’ ὑμῖν을 「여러분과 관련하여」로 옮겨 위로의 관련 대상을 나타내고, διά + 속격인 「여러분의 믿음을 통해」를 위로의 수단으로 분명히 구별했습니다. 그 밖의 어휘와 각주 표지는 유지했으며, πίστις의 문맥상 가능한 ‘신실함’의 뉘앙스를 각주에서 더 정확히 보완했습니다.
