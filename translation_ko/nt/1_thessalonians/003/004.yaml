review_pass:
  verdict: revise
  source_fidelity: 초안은 προελέγομεν의 반복적 과거 의미와 μέλλομεν θλίβεσθαι의 미래 고난을 대체로 충실히 반영합니다. 그러나 문두의 καὶ γάρ가 나타내는 설명적·강조적 연결이 빠져 있으며, 「말해 왔으며」는 당시 체류 기간의 반복을 현재까지 이어지는 행위처럼 들리게 할 수 있습니다.
  naturalness: 「미리 거듭 말씀드렸습니다」가 현대 표준어 합쇼체에서 더 자연스럽고, 미완료 과거의 반복성을 정확히 드러냅니다. 「고난을 당하게 될 것」은 자연스러우면서도 θλίβεσθαι를 박해나 종말론적 ‘환난’으로 과도하게 한정하지 않습니다.
  terminology: 「환난」은 가능하나 현대 한국어에서 종말론적 또는 특정 종교적 용례로 좁게 들릴 수 있습니다. 여기서는 θλίβεσθαι의 넓은 압박·고난·박해 의미를 보존하는 「고난을 당하다」가 더 적절합니다. 각주에서는 현대 학술 용례인 「그리스어」를 사용합니다.
  issues:
  - severity: medium
    issue: καὶ γάρ의 연결·강조가 본문에 충분히 반영되지 않음
    rationale: 「사실」을 보태어 앞 절을 설명하는 γάρ와 강조의 καί를 자연스럽게 드러내는 것이 좋습니다.
  - severity: medium
    issue: 「말해 왔으며」의 시제·상 해석
    rationale: προελέγομεν은 그들이 함께 있던 때의 반복적 미완료 과거입니다. 「말해 왔다」는 그 행위가 현재까지 지속된다는 인상을 줄 수 있으므로 「미리 거듭 말씀드렸습니다」가 더 정확합니다.
  - severity: low
    issue: 「환난」의 의미 범위가 다소 좁게 들릴 수 있음
    rationale: θλίβεσθαι는 압박, 고난, 박해를 포함할 수 있으나 어느 하나로 한정되지 않습니다. 「고난을 당하다」가 문맥상 넓은 의미를 더 자연스럽게 보존합니다.
  revised_text: 사실 우리가 여러분과 함께 있을 때에도, 우리가 고난을 당하게 될 것이라고 여러분에게 미리 거듭 말씀드렸습니다. 실제로 그렇게 되었으며, 여러분도 그것을 알고 계십니다.
  revised_footnotes:
  - marker: a
    text: 또는 「압박을 받을 것」, 「환난을 당할 것」. 그리스어 동사는 압박, 고난, 박해를 겪는 것을 포괄할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문두의 설명적 강조를 「사실」로 반영하고, 미완료 과거의 반복성을 「미리 거듭 말씀드렸습니다」로 옮겼습니다. θλίβεσθαι는 특정한 종류의 고난으로 좁히지 않도록 「고난을 당하게 될 것」으로 번역했으며, 각주에서 가능한 대안과 의미 범위를 제시했습니다.
