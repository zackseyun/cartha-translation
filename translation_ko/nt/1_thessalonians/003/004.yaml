review_pass:
  verdict: revise
  source_fidelity: 초안은 θλίβεσθαι를 「환난을 당하다」로, προελέγομεν의 반복성을 「미리 말해 왔다」로 대체로 충실하게 옮기며, 사건의 실현과 수신자들의 앎도 잘 반영합니다. 그러나 문두의 καὶ γάρ가 번역에서 빠져 있어 앞 절을 뒷받침하는 설명적·강조적 연결이 드러나지 않습니다. 또한 「말해 왔으며」는 과거의 체류 기간에 반복하여 말한 미완료 시제보다 현재까지 이어진 행위처럼 들릴 수 있습니다.
  naturalness: 「사실」과 「미리 거듭 말하곤 했습니다」는 현대 표준 한국어 합쇼체에서 자연스럽고, 각각 문맥상 설명적 연결과 과거의 반복을 분명히 합니다. 「환난을 당하게 될 것」은 임박하거나 예상된 미래를 나타내는 μέλλομεν에 자연스럽게 대응합니다.
  terminology: 「환난」은 문맥상 가능한 θλίβεσθαι의 번역이지만 박해만으로 한정하지 않으므로, 대안 의미를 제시하는 주석을 유지하는 것이 적절합니다. 주석의 「그리스어」는 현대 표준어에 더 알맞습니다.
  issues:
  - severity: medium
    issue: καὶ γάρ의 설명적·강조적 연결이 누락됨
    rationale: 「우리가 여러분과 함께 있을 때에도」의 「-때에도」는 ὅτε의 강조적 καί를 반영할 수 있으나, γάρ의 ‘왜냐하면/사실’에 해당하는 연결은 없습니다.
  - severity: low
    issue: 「미리 말해 왔으며」의 시제상 뉘앙스
    rationale: προελέγομεν은 과거 체류 중 반복적으로 말하던 미완료형입니다. 「말해 왔습니다」는 현재까지 지속된 행위로도 읽힐 수 있으므로 「거듭 말하곤 했습니다」가 더 정확합니다.
  revised_text: 사실, 우리가 여러분과 함께 있을 때에도 우리는 우리가 환난을 당하게 될 것이라고 여러분에게 미리 거듭 말하곤 했습니다. 실제로 그렇게 되었고, 여러분도 그것을 알고 있습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「압박을 받을 것」, 「고난을 당할 것」. 그리스어 동사는 압박, 고난, 또는 박해를 겪는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문두에 「사실」을 보충하여 καὶ γάρ의 설명적이며 다소 강조적인 기능을 반영했습니다. προελέγομεν은 과거의 반복을 나타내도록 「미리 거듭 말하곤 했습니다」로 고쳤습니다. θλίβεσθαι의 범위와 두 차례의 καί가 주는 강조는 「환난」 및 「실제로 ... 여러분도」로 유지했습니다.
