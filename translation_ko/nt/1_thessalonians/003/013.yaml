  to: 그리하여 우리 주 예수께서 그분의 모든 거룩한 자들[a]과 함께 오실 때에, 여러분의 마음을 우리 하나님 아버지 앞에서 거룩함 가운데 흠 없게 굳게 세워 주시기를 빕니다.
  rationale: 「여러분의 마음을 ... 굳게 세워」로 고쳐 στηρίξαι의 타동사적 의미와 「마음」에 걸리는 「흠 없게, 거룩함 가운데」의 수식 관계를 선명하게 했습니다. 「오실 때」는 παρουσίᾳ의 이 문맥상 미래 강림 의미를 자연스럽게 드러내므로 유지했습니다. 각주는 ἁγίων의 지시 대상에 관한 원문의 모호성을 보존하되, 현대 표준 용어인 「그리스어」를 사용하도록 다듬었습니다.
