  source_fidelity: 원문의 ἀφ’ ὑμῶν은 디모데가 데살로니가 교인들에게서 바울 일행에게 ‘왔다’는 뜻이며, ‘돌아와’는 원문에 없는 귀환의 뉘앙스를 더합니다. 또한 디모데가 전한 내용은 믿음과 사랑의 좋은 소식 및 바울 일행에 대한 좋은 기억과 상호 만남의 갈망이라는 절 구조를 한 문장 안에서 분명히 드러내는 편이 좋습니다.
