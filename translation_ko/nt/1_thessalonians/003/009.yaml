  text: 우리가 여러분을 두고, 여러분 때문에 우리 하나님 앞에서 누리는 모든 기쁨에 대하여 어떤 감사를 하나님께 되돌려 드릴 수 있겠습니까[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 「우리가 여러분 때문에 하나님께 어떻게 충분히 감사할 수 있겠습니까?」라고 옮길 수 있습니다. 그리스어를 더 직역하면 「우리가 여러분을 두고 어떤 감사를 하나님께 되돌려 드릴 수 있겠습니까?」입니다.
    reason: lexical_alternative
