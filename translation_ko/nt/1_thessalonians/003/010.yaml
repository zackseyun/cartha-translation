  verdict: revise
  source_fidelity: 핵심 의미는 대체로 잘 옮겼습니다. 다만 「다시」는 이 절의 헬라어 본문에 명시되어 있지 않으므로, 앞 문맥에서 추론될 수 있더라도 본문 번역에는 넣지 않는 것이 안전합니다. 「얼굴을 보다」는 개인적으로 만나는 것을 뜻하는 관용적 표현이므로 「직접 만나다」로 자연스럽게 옮길 수 있습니다.
  naturalness: 기존 문장은 합쇼체로 자연스럽지만, 「얼굴을 다시 보고」의 「다시」를 제거하고 목적을 병렬적으로 정리하면 더 정확하고 매끄럽습니다.
  terminology: ὑπερεκπερισσοῦ는 「더할 나위 없이 간절히」로, δεόμενοι는 「간구합니다」로 적절합니다. καταρτίσαι τὰ ὑστερήματα는 「부족한 부분을 보충하다」가 ‘부족한 것을 갖추게 하다’라는 뜻을 자연스럽고 충실하게 전달합니다. πίστις는 「믿음」으로 유지합니다.
  issues:
  - severity: medium
    issue: 「다시」의 첨가
    rationale: εἰς τὸ ἰδεῖν에는 ‘다시’에 해당하는 어휘가 없습니다. 앞선 문맥과 조화될 수 있는 해석적 보충이지만, 이 절 자체의 번역에서는 명시하지 않는 편이 원문 충실성과 절제된 번역 원칙에 맞습니다.
  revised_text: 밤낮으로 우리는 여러분을 직접 만나고 여러분의 믿음에 부족한 부분을 보충하기를 더할 나위 없이 간절히 간구합니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 「여러분의 믿음에서 빠져 있는 것」. 헬라어는 여러분의 믿음 안에서 아직 강화되거나 온전해질 필요가 있는 것을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 「다시」를 삭제했습니다. 「여러분을 직접 만나다」는 문자적으로는 ‘여러분의 얼굴을 보다’인 표현의 개인적 만남이라는 관용적 뜻을 자연스러운 현대 한국어로 전달합니다. 두 목적 표현을 「만나고 ... 보충하기를」로 병렬 처리하여 εἰς τὸ ἰδεῖν ... καὶ καταρτίσαι를 반영했습니다.
