    text: 직역하면 ‘모세에게로’입니다. 바울은 세례의 표현을 사용하여 이스라엘이 모세와 결속되었음을 나타냅니다. ‘모세와 동일시되어’ 또는 ‘모세에게 충성을 바치게 되어’로도 이해할 수 있습니다.
    reason: 원문의 εἰς τὸν Μωϋσῆν이 지닌 이례적인 방향·결속의 표현과 해석 가능성을 보존합니다.
  - marker: b
    text: 바울은 ‘바다를 통하여’가 아니라 ‘바다 안에서’라고 말하며, 앞의 ‘구름 안에서’와 병행시킵니다.
    reason: ἐν τῇ νεφέλῃ와 ἐν τῇ θαλάσσῃ의 전치사 병행을 드러냅니다.
