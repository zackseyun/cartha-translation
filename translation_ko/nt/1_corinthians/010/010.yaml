    rationale: 초안도 의미상 이해되지만, 원문은 ‘그들 가운데 어떤 사람들이 불평했고 멸망당한 것처럼’이라는 하나의 비교 구조입니다. 이를 유지하는 편이 경고의 연결을 더 충실히 드러냅니다.
  - severity: low
