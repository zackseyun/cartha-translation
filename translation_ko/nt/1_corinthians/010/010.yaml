  rationale: 현대 합쇼체의 자연스러운 문장으로 다듬고, γογγύζω의 반복과 비교 구조를 보존했습니다. ‘멸망시키는 자’의 정체는 본문에서 특정하지 않았으며, 해석적 대안은 각주로 한정했습니다.
