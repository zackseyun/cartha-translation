  source_fidelity: 수정안은 μηδέ의 연결 기능을 ‘또한’으로, γογγύζετε/ἐγόγγυσαν의 반복을 ‘불평하다’로 일관되게 옮깁니다. 또한 ‘그들 가운데 어떤 사람들’과 ‘불평했고 … 멸망당한’의 결합을 유지하여, 원문의 비교절 안에서 두 과거 사건이 함께 진술되는 구조를 반영합니다. ὑπὸ τοῦ ὀλοθρευτοῦ는 특정한 존재로 단정하지 않고 ‘멸망시키는 자’로 보존합니다.
  naturalness: 초안의 ‘원망하다’는 현대 한국어에서 대개 누군가를 원한 깊게 탓하거나 미워한다는 뜻이 강하여, 광야 전승에서의 불만 섞인 투덜거림을 뜻하는 γογγύζω에는 ‘불평하다’가 더 자연스럽고 정확합니다. 두 문장으로 나눈 초안보다 비교절을 한 문장으로 유지하면 바울의 경고 논리가 명료해집니다.
  terminology: ‘멸망시키는 자’는 ὁ ὀλοθρευτής의 명사적이고 비특정적인 표현을 보존합니다. ‘멸망시키는 천사’는 가능한 해석이지만 본문에 넣지 않고 각주에만 제시합니다.
  issues:
