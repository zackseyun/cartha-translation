    rationale: 현대 표준어에서 ‘원망하다’는 불평보다 강한 원한·비난의 뉘앙스를 띠기 쉬워 γογγύζω의 집단적 불평/투덜거림을 좁히거나 달리 들리게 할 수 있습니다.
  - severity: low
