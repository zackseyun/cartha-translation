  verdict: revise
  source_fidelity: The draft accurately represents the inferential force of Διόπερ, the affectionate plural address, and εἰδωλολατρία. However, ‘우상숭배에서 도망치십시오’ is less idiomatic Korean for φεύγετε ἀπό in this moral exhortation. ‘우상 숭배를 피하십시오’ naturally conveys the urgent imperative to avoid it without narrowing its scope.
  naturalness: ‘나의 사랑하는 자들이여’ is understandable but stiff in contemporary formal Korean, and ‘…에서 도망치십시오’ is awkward with an abstract practice. ‘사랑하는 여러분’ and ‘…를 피하십시오’ are natural modern formal-polite Korean.
  terminology: ‘우상 숭배’ is a standard, clear rendering of εἰδωλολατρία. The supplied lexical alternative is retained in a footnote with an anchor.
  issues:
  - severity: medium
    issue: Awkward rendering of φεύγετε ἀπό
    rationale: ‘우상숭배에서 도망치십시오’ suggests literal flight from a location and is not idiomatic with ‘우상숭배.’ ‘우상 숭배를 피하십시오’ preserves the imperative to avoid idolatry in natural Korean.
  - severity: low
    issue: Stilted vocative address
    rationale: ‘나의 사랑하는 자들이여’ is overly literal for modern 합쇼체. ‘사랑하는 여러분’ retains the affectionate plural address idiomatically; the possessive nuance is naturally implicit in Korean address.
  - severity: low
    issue: English audit-trail lexical-alternative footnote lacks a Korean anchor
    rationale: A Korean anchor and equivalent lexical-alternative note should be supplied for εἰδωλολατρία.
