review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 충실하게 옮겼습니다. 그러나 διὰ … καὶ τὴν συνείδησιν의 병렬적 고려를 한국어에서 더 자연스럽게 드러내는 편이 좋습니다. ἱερόθυτόν을 ‘제물로 바쳐진 것’으로 옮긴 것은 원문의 제의적 희생 제물이라는 뜻을 보존하며, 본문에 ‘우상’을 명시적으로 보태지 않아 적절합니다.
  naturalness: ‘양심을 위해 먹지 마십시오’는 한국어에서는 다소 직역투입니다. ‘양심을 생각하여 먹지 마십시오’가 현대 표준어 합쇼체에서 자연스럽고, 원문의 간결한 표현도 유지합니다.
  terminology: ‘제물로 바쳐진 것’은 ἱερόθυτόν에 적절합니다. ‘양심’은 συνείδησις의 표준적인 번역어입니다. 다음 절이 그 양심이 알린 사람의 양심임을 밝히므로, 본문에서는 소유자를 덧붙이지 않고 각주에서만 설명합니다.
  issues:
  - severity: low
    issue: ‘양심을 위해’가 직역투로 들립니다.
    rationale: διὰ … καὶ τὴν συνείδησιν은 ‘…을 고려하여/생각하여’라는 방식으로 옮기면 한국어 문장 안에서 자연스럽고, 알린 사람과 양심을 함께 고려한다는 구조가 선명해집니다.
  revised_text: 그러나 누군가 여러분에게 「이것은 제물로 바쳐진 것입니다」라고 말하면, 그것을 알려 준 사람과 양심을 생각하여 먹지 마십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “이것은 희생 제물로 바쳐진 음식입니다.” 그리스어는 희생 제물로 바쳐진 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 양심은 먹는 사람 자신의 양심이 아니라, 그것을 알려 준 다른 사람의 양심을 가리킵니다. 다음 절을 보십시오.
    reason: cross_reference
  revision_rationale: 본문의 ‘양심을 위해’를 자연스러운 한국어인 ‘양심을 생각하여’로 고쳤습니다. ἱερόθυτόν은 원문 자체에 없는 ‘우상’을 본문에 보태지 않고 ‘제물로 바쳐진 것’으로 유지했습니다. 양심의 귀속은 다음 절에서 명시되므로 본문에는 과도하게 특정하지 않고 각주로 밝혔습니다.
