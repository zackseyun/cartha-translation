review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional contrast, the prohibition, and the two considerations motivating abstention. However, “제물로 바쳐진 것입니다” can sound as though the item itself is an offering in the abstract; in this food context, explicitly identifying it as food more naturally conveys ἱερόθυτόν without importing “idol,” which the Greek word does not state.
  naturalness: The sentence is generally clear and maintains modern formal-polite register. “제물로 바친 음식” is more idiomatic Korean in this context than the nominalized “제물로 바쳐진 것.”
  terminology: “양심” is appropriate for συνείδησις. The footnote should clarify that this is the other person’s conscience, as the following verse explicitly does, while the main text should retain the Greek phrase’s concise ambiguity.
  issues:
  - severity: low
    issue: The sacrificial-food expression is slightly unnatural and semantically less specific in Korean.
    rationale: ἱερόθυτόν refers in context to food offered in sacrifice. “제물로 바친 음식” communicates this naturally while avoiding the interpretive addition “idol.”
  - severity: medium
    issue: The draft omits the audit-trail footnotes and their anchors.
    rationale: The lexical alternative and the contextual clarification concerning whose conscience is meant should be retained with Korean anchors.
  revised_text: 그러나 누군가 여러분에게 「이것은 제물로 바친 음식입니다」라고 말한다면, 그것을 알려 준 사람과 양심을 위해 먹지 마십시오.[a][b]
  revised_footnotes:
