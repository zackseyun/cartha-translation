    rationale: γέγραπται는 ‘기록되어 있다’라는 성경 인용 공식입니다. 직접 인용 뒤에 「고 하였습니다」를 덧붙이면 문체가 중복되고, 기록의 지속성을 나타내는 원문의 표현도 약해집니다.
