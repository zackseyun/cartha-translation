  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 παίζειν을 「뛰놀다」로 옮기면 단순히 뛰는 행동이라는 뜻이 더해져, 우상 숭배 잔치 문맥의 폭넓은 ‘놀다/흥청거리다’라는 표현을 충분히 보존하지 못합니다.
  naturalness: 「기록되었듯이 …고 하였습니다」는 인용 공식과 간접 인용을 겹쳐 놓아 다소 부자연스럽습니다. 「기록된 바와 같이, ‘…’」로 직접 인용하는 것이 현대 한국어 성경 문체에 자연스럽습니다.
  terminology: 「우상 숭배자」는 εἰδωλολάτραι에 정확하고 자연스러운 표기입니다. παίζειν은 본문에서 「놀았다」로 두고, 문맥상 흥청거림/방종한 잔치의 뉘앙스는 각주로 제시하는 것이 해석을 과도하게 확정하지 않습니다.
  issues:
