revisions:
- from: 그들 가운데 어떤 자들이 그러했던 것처럼 여러분은 우상숭배자가 되지 마십시오. 기록되었듯이 「백성이 앉아서 먹고 마시며 일어나 뛰놀았다」고 하였습니다.
  to: 그들 가운데 몇몇 사람이 그러했던 것처럼, 여러분은 우상 숭배자가 되지 마십시오. 기록된 바와 같이, “백성이 앉아서 먹고 마시며 일어나 놀았다[a].”
  rationale: 원문의 금지 명령, 이스라엘 가운데 일부를 드는 비교, 성경 인용 공식을 보존했습니다. 「놀았다」는 παίζειν의 기본 의미를 유지하며, 「뛰놀았다」가 추가하는 신체 동작의 의미를 피합니다. 인용 공식은 직접 인용으로 정리했고, 논쟁의 여지 없이 문맥상 가능한 ‘흥청거림’은 각주로 제한했습니다.
  reviewer_model: gpt-5.6-terra
