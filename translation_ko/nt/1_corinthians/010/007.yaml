  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
  footnotes:
  - marker: a
    text: Or “rose up to revel”; the quoted wording comes from Exodus 32:6, where the ‘play’ is associated with Israel’s idolatrous feast around the golden calf.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 몇몇 사람이 그러했던 것처럼, 여러분은 우상 숭배자가 되지 마십시오. 기록된 바와 같이, “백성이 앉아서 먹고 마시며 일어나 놀았다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “흥청거렸다.” 이 인용은 출애굽기 32:6에서 왔으며, այնտեղ의 ‘놀이’는 금송아지 주변의 우상 숭배 잔치와 관련되어 있습니다.
    reason: παίζειν은 기본적으로 ‘놀다’이지만, 이 문맥에서는 우상 숭배와 관련된 흥청거림 또는 방종한 잔치의 뉘앙스를 가질 수 있습니다. 본문은 인용의 어휘적 표현을 보존하고 각주에서 가능한 문맥적 의미를 제시합니다.
