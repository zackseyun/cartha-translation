- from: 또 우리는 그들 가운데 어떤 자들이 시험한 것처럼 메시아를 시험해서는 안 됩니다. 그들은 뱀들에 의해 멸망당하고 있었습니다.[a]
  to: 또한 우리는 그들 가운데 몇몇 사람이 그분을 시험했던 것처럼 메시아를 시험해서는 안 됩니다. 그 몇몇 사람은 뱀들 때문에 죽어 가고 있었습니다.[a]
  rationale: 문장 안에서 ‘몇몇 사람’과 그들의 결과를 명시적으로 연결하여 원문의 지시 관계를 보존했습니다. ἀπώλλυντο의 진행 중인 과거상을 ‘죽어 가고 있었습니다’로 반영했으며, 본문 읽기 ‘메시아’와 ‘주’ 이문 각주는 유지했습니다.
