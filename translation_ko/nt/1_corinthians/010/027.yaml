  to: 믿지 않는 사람 중 누가 여러분을 초대하여 여러분이 가고자 하면, 여러분에게 차려 주는 것은 무엇이든지 양심을 위하여 아무것도 따져 묻지 말고 드십시오.
  rationale: The revision improves modern formal-polite Korean and clarifies the meal setting inherent in παρατιθέμενον, while preserving the conditional structure, the comprehensive 'whatever,' and the deliberate ambiguity of 'conscience.' No footnotes are required by the Korean draft or by a source-level ambiguity that the main text already preserves.
