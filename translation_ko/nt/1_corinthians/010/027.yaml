review_pass:
  verdict: revise
  source_fidelity: The draft conveys the conditional invitation, willingness to attend, unrestricted eating of what is served, and refraining from inquiry because of conscience. Its rendering of '양심' appropriately leaves the referent unspecified, as does the Greek.
  naturalness: 'Several expressions are understandable but less idiomatic in modern formal Korean: ''믿지 않는 자들 가운데 누가'' is stiff, and ''여러분 앞에 놓이는 것은'' can sound like any object placed before the readers rather than food served at a meal. ''양심을 위해'' is also less natural than ''양심을 위하여'' in this register.'
  terminology: 'Use ''믿지 않는 사람'' for ἀπίστων: it is modern, non-pejorative, and preserves the reference to a nonbelieving host. Retain ''양심'' without specifying whose conscience is intended.'
  issues:
  - severity: low
    issue: '''믿지 않는 자들 가운데 누가'' is stylistically stiff.'
    rationale: The Greek means 'someone from among the unbelievers.' '믿지 않는 사람 중 누가' is a more natural modern Korean expression without changing the referent.
  - severity: medium
    issue: '''여러분 앞에 놓이는 것은 무엇이든지'' does not clearly communicate food served at a meal.'
    rationale: In context, πᾶν τὸ παρατιθέμενον ὑμῖν denotes whatever food is set/served before the guests. '여러분에게 차려 주는 것은 무엇이든지' makes this meal sense clear while retaining the broad scope.
  - severity: low
    issue: '''양심을 위해'' is awkward in formal Korean.'
    rationale: '''양심을 위하여'' naturally renders διὰ τὴν συνείδησιν and does not resolve the contextual ambiguity concerning whose conscience is in view.'
  revised_text: 믿지 않는 사람 중 누가 여러분을 초대하여 여러분이 가고자 하면, 여러분에게 차려 주는 것은 무엇이든지 양심을 위하여 아무것도 따져 묻지 말고 드십시오.
