  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: Now these things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
  footnotes:
  - marker: a
    text: Or "as types" or "typologically"; Paul presents these events as patterns with instructive significance for later believers.
    reason: lexical_alternative
  - marker: b
    text: Or "for our admonition" or "for our warning"; the Greek includes both corrective instruction and warning.
    reason: lexical_alternative
  - marker: c
    text: Or "the end of the ages has come"; the Greek is plural, "the ends of the ages," which preserves Paul's salvation-historical wording.
    reason: alternative_reading
translation:
  language: ko
  text: 이런 일들은 그들에게 본보기로 일어났고[a], 시대들의 끝이 이른 우리를 훈계하기 위해 기록되었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유형으로” 또는 “유형론적으로”. 바울은 이 사건들이 후대의 신자들에게 교훈적 의미를 지닌 본보기가 된다고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리에게 경고하기 위해”. 그리스어는 교정적 가르침과 경고의 뜻을 함께 담습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “시대들의 끝”. 그리스어는 복수 표현을 사용하며, 시대들의 끝이 우리에게 이미 이르렀다는 구원 역사적 표현을 보존합니다.
    reason: alternative_reading
