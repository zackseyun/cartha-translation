  source_fidelity: 핵심 의미는 대체로 충실하며, 「본보기로」와 「훈계」는 각각 τυπικῶς와 νουθεσία를 적절히 옮깁니다. 그러나 「시대들의 끝에 이른 우리」는 우리가 시대들의 끝에 도달했다는 뜻으로 읽히기 쉬워, 시대들의 끝이 우리에게/우리 위에 도달했다는 εἰς οὓς ... κατήντηκεν의 방향을 보존하지 못합니다.
  naturalness: 「시대들의 끝이 이른 우리」는 현대 표준어 문장으로 자연스럽고, 합쇼체의 격식 있는 성경 번역 문체에도 맞습니다. 「이런 일들」과 「본보기」도 자연스럽습니다.
  terminology: 「본보기」는 문맥상 후대 신자에게 교훈적 본보기가 된다는 뜻을 분명히 하며, 기술적인 「유형」을 본문에 강요하지 않습니다. 「훈계」는 교정적 가르침과 경고의 뉘앙스를 함께 담습니다. 「시대들의 끝」은 그리스어의 복수 표현을 가능한 한 보존합니다.
