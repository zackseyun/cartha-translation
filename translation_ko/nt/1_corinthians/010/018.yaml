review_pass:
  verdict: revise
  source_fidelity: 「육신을 따라 사는」은 κατὰ σάρκα에 없는 ‘사는’이라는 동작을 더하며, 바울이 여기서 가리키는 혈통/자연적 이스라엘을 ‘육신을 따라 사는’ 사람들, 곧 육적인 삶을 사는 이들처럼 오해하게 할 수 있습니다. 「육신에 따른 이스라엘」은 원문의 표현과 문맥상의 혈통적 뜻을 보존합니다. 「제단에 참여하는」은 κοινωνοὶ τοῦ θυσιαστηρίου의 제의적 연대·참여를 적절히 반영합니다.
  naturalness: 합쇼체 명령과 수사 의문문은 자연스럽습니다. 다만 「육신에 따른 이스라엘」은 원문의 관용적 바울 표현을 살린 다소 직역적인 표현이므로, 혈통적 의미를 밝히는 주석이 있으면 현대 한국어 독자의 이해에 도움이 됩니다.
  terminology: 「제물」, 「제단」, 「참여」는 본문과 10:16–21의 참여/교제 논증에 잘 맞습니다. 「육신」은 도덕적 ‘육신을 따르는 삶’을 뜻하는 것으로 해석되지 않도록 주석에서 ‘혈통상’이라는 문맥적 의미를 밝혀야 합니다.
  issues:
  - severity: high
    issue: 「육신을 따라 사는 이스라엘」에 원문에 없는 ‘사는’이 추가됨
    rationale: κατὰ σάρκα는 여기서 이스라엘의 삶의 방식이 아니라 혈통·자연적 계보에 따른 이스라엘을 가리킵니다. 현 번역은 도덕적 또는 영적 상태에 관한 진술로 바꿀 위험이 있습니다.
  revised_text: 육신에 따른 이스라엘을 보십시오. 제물을 먹는 사람들이 제단에 참여하는 사람들이 아닙니까?
  revised_footnotes:
  - marker: a
    text: 또는 ‘혈통상 이스라엘’.
    reason: 「육신에 따른」은 여기서 죄된 육신을 따라 산다는 뜻이 아니라, 혈통 또는 자연적 출생에 따른 이스라엘을 가리킵니다.
  revision_rationale: 원문에 없는 ‘사는’을 제거하여 κατὰ σάρκα의 수식 기능을 회복했습니다. 본문의 바울적 표현인 ‘육신’을 본문에 유지하되, 혈통적 의미를 주석으로 밝혀 불필요한 도덕적 해석을 피했습니다. 나머지 표현은 헬라어의 수사 의문과 제단에 대한 참여라는 논증을 유지합니다.
