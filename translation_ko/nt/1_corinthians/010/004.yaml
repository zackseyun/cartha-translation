  to: 그들은 모두 같은 영적인 음료를 마셨습니다. 왜냐하면 그들은 그들을 따라오던 영적인 반석[a]에서 나오는 음료를 마셨기 때문입니다. 그 반석은 메시아[b]였습니다.
