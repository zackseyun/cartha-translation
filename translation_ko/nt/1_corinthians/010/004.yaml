source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
  footnotes:
  - marker: a
    text: Or 'from the spiritual rock that followed them.' The Greek participle can be rendered more simply as 'followed,' but 'was following' better reflects its ongoing aspect.
    reason: lexical_alternative
  - marker: b
    text: Greek 'Christ.' Here rendered 'Messiah' because Χριστός functions as a title rather than a name-like form.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 모두 같은 영적인 음료를 마셨습니다. 왜냐하면 그들은 그들을 따라오던 영적인 반석[a]에서 나오는 음료를 마셨기 때문입니다. 그 반석은 메시아[b]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘따라오는’이라는 현재분사를 사용합니다. ‘따라오던’은 그 지속적인 동작을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그리스도’입니다. 여기서는 Χριστός가 이름처럼 쓰이기보다 칭호로 기능하므로 ‘메시아’로 옮겼습니다.
    reason: alternative_reading
