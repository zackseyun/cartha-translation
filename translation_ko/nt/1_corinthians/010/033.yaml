  source_fidelity: 초안은 καθὼς를 뒤따르는 명령형 '하십시오'로 옮겨, 바울이 자신의 행위를 진술하는 직설법 ἀρέσκω 및 문장의 비교 연결을 바꾸었습니다. 또한 '기쁨이 되려고'는 ἀρέσκω의 현재 직설법과 목적어 구문을 충분히 반영하지 못합니다. 수정문은 바울의 자기 진술, '모든 일에서 모든 사람을', 자신의 유익과 많은 사람의 유익의 대조, 그리고 구원의 목적을 보존합니다.
  naturalness: ‘모든 일에서 모든 사람을 기쁘게 하며’는 현대 표준어에서 자연스럽고, 여기서 타인의 유익을 위한 배려라는 문맥에도 맞습니다. ‘많은 사람’은 τῶν πολλῶν의 표현을 불필요하게 ‘다른 사람들’로 일반화하지 않고 유지합니다.
  terminology: ‘유익’은 σύμφορον의 문맥상 의미에 적절하며, ‘구원을 받게 하려는 것입니다’는 σωθῶσιν의 수동형과 목적을 자연스럽게 드러냅니다.
  issues:
