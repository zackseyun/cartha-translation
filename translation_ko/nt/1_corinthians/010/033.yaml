revisions:
- from: 나 자신도 모든 사람에게 모든 일에서 기쁨이 되려고, 내 자신의 유익을 구하지 않고 많은 사람들의 유익을 구해 그들이 구원받게 하려는 것과 같이 하십시오.
  to: 나도 모든 일에서 모든 사람을 기쁘게 하며, 내 유익이 아니라 많은 사람의 유익을 구합니다. 이는 그들이 구원을 받게 하려는 것입니다.
  rationale: 원문의 직설법 자기 진술을 유지하고, πάντα πᾶσιν을 ‘모든 일에서 모든 사람을’으로, ἀρέσκω를 자연스러운 타동 표현 ‘기쁘게 하다’로 옮겼습니다. μὴ ζητῶν ... ἀλλὰ ...의 대조와 ἵνα 목적절도 유지했습니다. 앞 절과의 비교를 나타내는 καθὼς는 한국어에서 이 절을 완결된 문장으로 제시할 때 문맥적으로 암시되므로, 별도의 명령형을 덧붙이지 않았습니다.
