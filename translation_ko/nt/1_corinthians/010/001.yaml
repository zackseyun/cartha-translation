  doctrine_reference: 'METHODOLOGY.md: preserve Pauline typology'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the vocative, the twofold 'all,' the cloud, and passage through the sea. However, it omits the connective γάρ ('for'), and its wording '알지 못하는 채로 있기를' is unnecessarily cumbersome for the Pauline idiom οὐ θέλω ... ἀγνοεῖν.
  naturalness: '''형제 여러분'' is natural in a modern formal Korean church-address register. Recasting the idiom as ''알지 못하기를 원하지 않습니다'' is both natural and close to the Greek. Adding ''사실'' gives a restrained Korean representation of the explanatory/discourse force of γάρ without forcing an unnatural sentence-initial ''왜냐하면.'''
  terminology: '''우리 조상들'' is an appropriate, idiomatic Korean rendering of οἱ πατέρες ἡμῶν in this exodus context and preserves Paul''s corporate identification. No theological terminology requires alteration in this verse.'
  issues:
  - severity: medium
    issue: γάρ is not represented.
    rationale: The source begins with an explanatory connective. The Korean draft moves directly from the address to the assertion, losing this discourse link.
  - severity: low
    issue: The phrase '알지 못하는 채로 있기를' is stilted.
    rationale: It communicates the basic sense but is less idiomatic than the standard Korean construction '알지 못하기를 원하지 않습니다.'
  revised_text: 형제 여러분, 사실 나는 여러분이 알지 못하기를 원하지 않습니다. 우리 조상들은 모두 구름 아래에 있었고, 모두 바다를 지나갔습니다.
  revised_footnotes: []
  revision_rationale: 'The revision supplies the omitted explanatory connective with natural Korean ''사실,'' smooths the negated infinitive idiom, and retains the source''s repeated ''모두,'' familial-historical reference, and exodus imagery. No footnote is necessary: Korean ''형제 여러분'' functions as a conventional congregational address, and ''우리 조상들'' is unambiguous in context.'
  requires_human_review: false
