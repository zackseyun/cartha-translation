review_pass:
  verdict: revise
  source_fidelity: γάρ의 앞 문맥을 잇는 설명적 연결이 본문에서 드러나지 않으며, 「알지 못하는 채로 있기를」은 Οὐ θέλω ... ἀγνοεῖν의 자연스러운 한국어 표현으로 다소 부자연스럽습니다. 「우리 조상들」, 반복된 「모두」, 「구름 아래」 및 바다를 지나는 행위는 원문 의미를 적절히 보존합니다.
  naturalness: 「여러분이 알지 못하기를 원하지 않습니다」가 현대 표준 한국어 합쇼체에서 더 자연스럽고 간결합니다. 문두의 「그러므로」는 γάρ의 설명적·연결적 기능을 앞 문맥에 의존하는 방식으로 자연스럽게 나타냅니다.
  terminology: 「형제 여러분」은 ἀδελφοί의 남성형 호칭을 보존하는 적절한 번역입니다. 혼성 회중을 포괄할 수 있다는 점은 영어 POB의 어휘 주석에 맞추어 각주로 밝혀야 합니다. 「우리 조상들」은 οἱ πατέρες ἡμῶν의 역사적·공동체적 지시를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: γάρ의 연결 기능이 번역문에 나타나지 않습니다.
    rationale: γάρ는 앞선 논증에 대한 설명적 연결을 표시합니다. 한국어에서는 「그러므로」가 문맥상 완전히 동일한 논리 표지는 아니지만, 바울의 계속되는 권면·설명 문맥에서 자연스럽게 연결 기능을 드러냅니다.
  - severity: low
    issue: 「알지 못하는 채로 있기를」이 어색합니다.
    rationale: Οὐ θέλω ... ἀγνοεῖν은 「알지 못하기를 원하지 않습니다」로 옮기는 것이 원문의 부정된 의지 표현을 유지하면서 더 자연스럽습니다.
  - severity: low
    issue: ἀδελφοί의 혼성 회중 포괄 가능성을 밝히는 각주가 없습니다.
    rationale: 본문은 성별 표지된 「형제」를 유지할 수 있으나, 영어 POB 감사 기록의 어휘 주석에 맞추어 회중 전체를 부를 수 있음을 각주로 제공하는 것이 적절합니다.
  revised_text: 그러므로 형제 여러분, 나는 여러분이 알지 못하기를 원하지 않습니다. 우리 조상들은 모두 구름 아래에 있었고, 모두 바다를 통과했습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「형제자매 여러분」. 그리스어 「형제들」은 혼성 회중 전체를 부를 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문두에 「그러므로」를 두어 γάρ가 앞 문맥과 맺는 설명적 연결을 한국어 담화에서 자연스럽게 드러냈습니다. 관용적 부정 의지 표현은 현대 합쇼체에 맞게 다듬었고, 원문의 반복된 「모두」와 출애굽 사건의 핵심 표현은 유지했습니다. ἀδελφοί의 형태는 본문에서 「형제 여러분」으로 보존하되, 영어 POB 감사 기록과 일치하도록 포괄적 호칭 가능성을 각주로 제시했습니다.
