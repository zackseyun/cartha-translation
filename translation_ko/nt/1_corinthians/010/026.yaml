  source_fidelity: γάρ가 앞 절의 논거를 제시하는 접속사인데 초안에서 빠졌습니다. 또한 SBLGNT의 표면 본문은 τοῦ κυρίου(‘주의’)이므로, 인용의 히브리어 배경을 근거로 본문에서 ‘야훼’로 바꾸기보다 ‘주’를 유지하는 것이 그리스어 본문과 영어 POB 감사 기록에 충실합니다. τὸ πλήρωμα αὐτῆς는 ‘그 안에 가득한 모든 것’으로 자연스럽고 포괄적으로 옮길 수 있습니다.
  naturalness: ‘왜냐하면 … 때문입니다’는 앞 문맥을 받는 γάρ를 현대 한국어 합쇼체로 분명히 나타냅니다. ‘그 안에 가득한 모든 것’은 ‘거기에 충만한 것’보다 현대어로 더 자연스럽습니다.
  terminology: κύριος는 신약 그리스어 본문의 호칭에 따라 ‘주’로 옮깁니다. 시편 24:1의 인용이라는 사실 및 히브리어 본문과 칠십인역의 절 번호 차이는 각주에서 밝혀, 인용 배경을 보존합니다.
