  text: 그러나 하나님께서는 그들 중 대다수를 기뻐하지 않으셨습니다. 그들이 광야에 쓰러져 죽었기 때문입니다.[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 또는 ‘광야에 쓰러졌습니다’, ‘광야에 널렸습니다’.
    reason: κατεστρώθησαν는 광야에서 쓰러진 이들, 특히 그들의 시신이 널린 모습을 가리킬 수 있습니다. 본문의 ‘쓰러져 죽었습니다’는 문맥상 죽음의 결과를 자연스럽게 드러내며, 각주는 공간적·상태적 뉘앙스를 보존합니다.
