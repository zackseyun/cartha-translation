  text: 우리가 축복하는 축복의 잔은 메시아의 피에 참여하는 것이 아닙니까? 우리가 떼는 빵은 메시아의 몸에 참여하는 것이 아닙니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
