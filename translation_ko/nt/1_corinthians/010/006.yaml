  naturalness: ‘되었으니, … 하기 위함입니다’는 인과·목적 표현이 중복되어 어색합니다. 목적절을 ‘본보기가 되었습니다’에 직접 연결하면 현대 표준 한국어 합쇼체로 더 자연스럽습니다. ‘탐하다’는 여기서 성적인 의미로 한정되지 않는 악한 욕망을 간결하고 격식 있게 나타냅니다.
