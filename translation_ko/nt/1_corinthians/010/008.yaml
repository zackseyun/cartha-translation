source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
  footnotes:
  - marker: a
    text: Or 'died' or 'were struck down'; the Greek says 'fell,' a common way of referring to death under judgment.
    reason: lexical_alternative
  - marker: b
    text: Numbers 25:9 reports twenty-four thousand. Paul here says twenty-three thousand fell 'in one day,' which may distinguish the number who died that day from the larger total, though the translation preserves Paul's wording without harmonization.
    reason: cross_reference
translation:
  language: ko
  text: 또한 우리는 그들 가운데 몇몇 사람이 음행을 저지른 것처럼 음행을 저질러서는 안 됩니다. 그리고 하루에 이만 삼천 명이 쓰러졌습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽었습니다’ 또는 ‘심판을 받아 쓰러졌습니다.’ 그리스어는 직역하면 ‘쓰러졌습니다’이며, 이 심판의 문맥에서는 죽음을 가리키는 흔한 표현입니다. 민수기 25:9은 이만 사천 명이라고 기록하지만, 바울은 여기서 ‘하루에’ 이만 삼천 명이 쓰러졌다고 말합니다. 이는 그날 죽은 수와 더 큰 전체 수를 구별한 것일 수 있으나, 본문은 조화시키지 않고 바울의 표현을 그대로 옮깁니다.
    reason: lexical_alternative; cross_reference
