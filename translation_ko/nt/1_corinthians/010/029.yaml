base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: Now I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
  footnotes:
  - marker: a
    text: Or, more literally, 'not his own, but that of the other.' The context supports the sense 'not your own, but the other person's.'
    reason: lexical_alternative
  - marker: b
    text: This rhetorical question may be understood either as Paul's own challenge or as an objection he voices without explicit quotation markers in Greek.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 말하는 양심은 여러분 자신의 양심이 아니라 다른 사람의 양심입니다[a]. 왜 나의 자유가 다른 사람의 양심에 의해 판단받아야 합니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기 자신의 것이 아니라 다른 사람의 것’입니다. 원문의 ‘자기 자신의’은 3인칭 단수 형태이지만, 문맥상 ‘여러분 자신의 양심’으로 이해할 수 있습니다. ‘내 자신의 양심’으로 이해하는 견해도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 수사 의문문은 바울 자신의 물음으로, 또는 그가 명시적 인용 표시 없이 제시하는 반론으로 이해될 수 있습니다.
    reason: alternative_reading
