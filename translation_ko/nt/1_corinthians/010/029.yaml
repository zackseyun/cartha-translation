  source_fidelity: 첫 문장에서 λέγω의 1인칭 화자를 드러내야 합니다. 현 번역의 ‘여기서 양심은 … 말합니다’는 ‘양심’이 말하는 것처럼 읽혀 원문의 구문과 뜻을 정확히 전달하지 못합니다. 또한 δεύτε 절의 ‘다른 양심’은 가능하나, 앞 절의 ‘다른 사람’과 연결되는 대상임을 밝혀 ‘다른 사람의 양심’으로 하는 편이 자연스럽고 충실합니다.
  naturalness: ‘내가 말하는 양심은 …입니다’는 현대 표준 한국어 합쇼체로 명료하고 자연스럽습니다. ‘판단받아야 합니까?’는 수사 의문문의 힘을 보존합니다.
  terminology: συνείδησις는 ‘양심’, ἐλευθερία는 ‘자유’, κρίνεται는 ‘판단받다’로 적절합니다. ἑαυτοῦ는 문맥상 ‘여러분 자신의’으로 풀 수 있으나, 그 대명사의 형태와 가능한 다른 해석은 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: 첫 문장의 화자 및 문장 구조가 불명확함
    rationale: 원문 δὲ λέγω는 ‘내가 말한다/내가 뜻하는 바는’이라는 바울의 설명입니다. 초안의 ‘양심은 … 말합니다’는 양심을 문법적 행위자로 만들어 뜻이 어색하고 원문에 충실하지 않습니다.
  - severity: low
    issue: ‘다른 양심’의 지시 대상이 다소 불분명함
    rationale: ἄλλης συνειδήσεως는 문맥상 앞서 언급된 다른 사람의 양심을 가리킵니다. ‘다른 사람의 양심’이 한국어에서 더 명확합니다.
  - severity: low
    issue: 첫 절의 소유격 대조와 둘째 절 수사 의문의 해석 가능성에 대한 각주가 없음
    rationale: ἑαυτοῦ는 문법상 3인칭 단수 형태이며 문맥적 적용에 대한 논의가 있고, 둘째 절은 바울 자신의 수사적 질문 또는 인용되지 않은 반론으로 읽힐 수 있습니다. 본문은 문맥상 자연스럽게 옮기되 각주에서 불확실성을 보존하는 것이 적절합니다.
