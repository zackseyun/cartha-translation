source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
  footnotes:
  - marker: a
    text: Or, "interpreting spiritual things to spiritual people." The Greek can also be taken that way because πνευματικοῖς may be read as masculine rather than as an implied reference to spiritual words.
    reason: alternative_reading
translation:
  language: ko
  text: 우리는 또한 이것들을 말하되, 인간의 지혜가 가르친 말로 말하지 않고 성령께서 가르치신 말로 말하며, 영적인 것들을 영적인 말로 설명합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영적인 것들을 영적인 사람들에게 설명합니다.” 그리스어 πνευματικοῖς는 남성 복수로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διδακτοῖς πνεύματος
  english_pob_choice: taught by the Spirit
  chosen_korean: 영이 가르치는 말
  alternatives_korean:
  - 영에게서 배운 말
  lexicon: BDAG
  rationale: 형용사 διδακτός(가르침받은)를 자연스러운 능동 표현으로.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  english_pob_choice: interpreting spiritual things to spiritual people
  chosen_korean: 영적인 것을 영적인 자들에게 해석해 주는
  alternatives_korean:
  - 영적인 것을 영적인 것과 비교하는
  lexicon: BDAG
  rationale: συγκρίνω는 「짝지어 비교하다/해석하다」 양의. 본문 흐름은 14절의 「영적으로 분별된다」로 이어지므로 「해석해 주는」을 채택하고 각주로 대안 표시 가능.
