  to: 오히려 우리는 비밀로 된 하나님의 지혜, 곧 감추어져 있던 지혜를 말합니다. 하나님께서는 시대들이 시작되기 전에 우리의 영광을 위하여 이 지혜를 미리 정하셨습니다.
