  source_fidelity: 첫 문장은 원문의 비교 구조(‘누가 … 알겠습니까? … 외에는’)를 문장 둘로 나누면서 ‘그 사람 안에 있는 사람의 영’이 마치 별도의 주어처럼 보입니다. 또한 δεύτε 절의 완전형 ἔγνωκεν은 한국어에서 ‘알고 있습니까/알고 있지 않습니다’로 자연스럽게 나타낼 수 있으나, 원문의 ‘아무도’와 예외 구문을 더 분명히 유지하는 편이 좋습니다.
