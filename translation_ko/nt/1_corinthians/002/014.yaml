  to: 그러나 자연적인 사람[a]은 하나님의 영에 속한 것들을 받아들이지 않습니다. 그것들은 그에게 어리석은 것이며, 그는 그것들을 알 수 없습니다. 그것들이 영적으로 분별되기[b] 때문입니다.
  rationale: 원문의 대조(ψυχικός/πνευματικῶς), 복수 목적어, 그리고 γνῶναι의 주체를 명료하게 보존했습니다. 「자연적인 사람」은 영어 POB의 ‘natural person’과 부합하며, 「혼적인」이 유발할 수 있는 비현대적 표현 및 불필요한 교리적 함의를 피합니다. 접속사 δέ는 「그러나」로, 원인의 γάρ와 ὅτι는 각각 「이며」 및 「때문입니다」의 논리 관계로 드러냈습니다.
