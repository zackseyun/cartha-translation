  source_fidelity: 현 초안은 ψυχικός을 「혼적인」으로 직역하려 하나, 이 표현은 현대 표준 한국어에서 매우 비자연스럽고 바울이 인간을 세 실체로 체계화한다는 해석을 불필요하게 부과할 수 있습니다. 또한 「알 수도 없습니다」의 주어가 문법상 불분명하여, 알 수 없는 주체가 사람이라는 원문의 구문을 명확히 해야 합니다. 「자연적인 사람」은 ψυχικός와 πνευματικός의 대조 및 영어 POB의 선택을 무리한 교리적 해석 없이 보존합니다.
  naturalness: 「혼적인 사람」은 현대 합쇼체 성경 번역으로 자연스럽지 않습니다. 두 문장으로 나누고, 「그는 그것들을 알 수 없습니다」로 주어와 목적어를 명시하면 명료하고 자연스럽습니다.
  terminology: πνεῦμα τοῦ θεοῦ는 「하나님의 영」으로, τὰ τοῦ πνεύματος τοῦ θεοῦ는 「하나님의 영에 속한 것들」로 옮기는 것이 자연스럽고 소유·관련의 폭을 보존합니다. ἀνακρίνεται는 본문에서 「분별됩니다」로 번역하고, ‘판단된다/검토된다’의 어휘 범위는 각주로 제시합니다.
