- from: 그러나 기록된 바, 「눈으로 보지 못한 것, 귀로 듣지 못한 것, 사람의 마음에 떠오르지 못한 것, 곧 하나님께서 자기를 사랑하는 자들에게 예비하신 모든 것이다」 한 것과 같습니다.
  to: 그러나 기록된 바와 같습니다. 「어떤 눈도 보지 못하고 어떤 귀도 듣지 못하며 사람의 마음에 떠오르지 않은 것들, 곧 하나님께서 자신을 사랑하는 이들을 위하여 예비하신 모든 것들입니다.」
