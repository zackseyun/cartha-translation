base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
  footnotes:
  - marker: a
    text: Or “has not entered the human heart” or “has not occurred to anyone.”
    reason: lexical_alternative
  - marker: b
    text: “Man’s heart” uses “man” in a generic sense, referring to humanity.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 기록된 바와 같습니다. 「어떤 눈도 보지 못하고 어떤 귀도 듣지 못하며 사람의 마음에 떠오르지 않은 것들, 곧 하나님께서 자신을 사랑하는 이들을 위하여 예비하신 모든 것들입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  english_pob_choice: has not entered into the heart of man
  chosen_korean: 사람의 마음에 떠오르지 못한
  alternatives_korean:
