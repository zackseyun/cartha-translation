review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 어휘인 ‘예비하신’과 ‘사람의 마음에 떠오르지’의 의미를 대체로 잘 반영합니다. 그러나 καθὼς γέγραπται는 ‘기록된 바와 같습니다’로 옮겨야 하며, 인용문의 ὅσα를 ‘하나님께서 … 예비하신 모든 것들’로 명시하는 편이 충실합니다. ‘자기를 사랑하는 자들’은 한국어에서 지시 대상이 불필요하게 모호하므로 ‘하나님을 사랑하는 이들’로 밝혔습니다.
  naturalness: ‘그러나 기록된 바, … 한 것과 같습니다’는 현대 표준 한국어 문장으로 부자연스럽고 인용 도입과 인용문 종결의 연결도 어색합니다. ‘그러나 기록된 바와 같습니다’와 자연스러운 병렬 구문으로 다듬었습니다.
  terminology: ‘하나님’, ‘마음’, ‘예비하다’는 적절합니다. 신학적 해석을 더하지 않았으며, ἀνθρώπου의 포괄적 단수는 ‘사람의’로 유지했습니다.
  issues:
