    rationale: ‘그러나 기록된 바, … 한 것과 같습니다’는 καθὼς γέγραπται를 자연스럽게 반영하지 못합니다. ‘그러나 기록된 바와 같습니다’가 정착된 현대 한국어 성경 문체이면서도 원문의 인용 공식을 보존합니다.
  - severity: medium
    issue: ‘자기를 사랑하는 자들’의 지시 대상이 모호합니다.
    rationale: 원문의 αὐτόν은 하나님을 가리킵니다. 한국어 재귀 대명사 ‘자기’는 가까운 선행사나 문장 주어와 혼동될 수 있으므로 ‘하나님을 사랑하는 이들’로 명시해야 합니다.
  - severity: low
    issue: ὅσα의 포괄적 내용을 인용문에서 명시할 필요가 있습니다.
    rationale: ‘모든 것들’을 넣어 앞의 ‘보지 못하고 듣지 못하며 마음에 떠오르지 않은 것들’과 하나님께서 예비하신 것들을 이어 주는 원문의 재개 구조를 드러냅니다.
