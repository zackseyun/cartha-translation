  terminology: ‘영적인 사람’은 남성 단수 정관사 형용사의 일반적 인물 지시를 자연스럽게 옮기며, 특정 성별로 한정하지 않습니다. ‘판단’은 최종 정죄만을 뜻하지 않고 이 문맥에서는 식별적 평가를 포함할 수 있으므로, 각주로 어휘 범위를 밝혀 두는 것이 적절합니다.
  issues:
