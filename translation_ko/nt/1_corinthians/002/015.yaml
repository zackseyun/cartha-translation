  rationale: 동일한 그리스어 동사의 능동·수동 반복을 ‘판단하다/판단받다’로 보존하고, 현대 한국어에서 불명확할 수 있는 ‘분별받다’를 피했습니다. 원문이 제한하지 않은 ‘모든 것’과 ‘아무에게도’는 그대로 유지했으며, ‘그 자신’으로 αὐτός의 강조를 드러냈습니다.
