  source_fidelity: 원문의 대조 구조와 절대적 표현(‘모든 것’, ‘아무에게도’)은 초안이 잘 보존합니다. 다만 ἀνακρίνω의 반복은 여기서 ‘분별’보다 조사·판단·평가의 뜻이 더 직접적이며, 수동형 ‘분별받지 않다’는 현대 한국어에서 의미가 다소 불분명합니다.
