  source_fidelity: 초안은 Σοφίαν의 반복, ἐν τοῖς τελείοις의 ‘가운데서’, 그리고 통치자들이 καταργουμένων의 수식을 받는다는 기본 의미를 대체로 반영합니다. 다만 ‘폐하여지고 있는’은 현대 한국어에서 다소 부자연스럽고, καταργέω의 ‘무력하게 되다/효력을 잃게 되다’라는 의미를 더 분명히 옮길 수 있습니다.
