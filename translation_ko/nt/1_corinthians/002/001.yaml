  to: 형제 여러분[a], 나도 여러분에게 갔을 때 하나님의 증언[b]을 여러분에게 선포하면서 탁월한 말솜씨나 지혜를 내세우지 않았습니다.
  rationale: 분사 καταγγέλλων을 ‘선포하면서’로 옮겨 선포의 목적이나 부정으로 오해되지 않게 했습니다. ‘나도’는 Κἀγώ의 연결 및 강조를, ‘여러분에게 갔을 때’는 ἐλθὼν … ἦλθον의 시간적 구성을 반영합니다. ‘하나님의 증언’은 속격의 의미를 한 방향으로 결정하지 않으며, 이문은 각주로 보존했습니다.
