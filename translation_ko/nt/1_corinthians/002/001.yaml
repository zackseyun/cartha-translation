id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
  footnotes:
  - marker: a
    text: Brothers may refer to fellow believers generally, including women in the congregation.
    reason: cultural_note
  - marker: b
    text: Some manuscripts read mystery of God.
    reason: textual_variant
translation:
  language: ko
  text: 형제 여러분[a], 나도 여러분에게 갔을 때 하나님의 증언[b]을 여러분에게 선포하면서 탁월한 말솜씨나 지혜를 내세우지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제’는 회중 안의 여성들을 포함한 모든 신자를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 일부 사본에는 ‘하나님의 신비’라고 되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπεροχὴν λόγου ἢ σοφίας
  english_pob_choice: lofty speech or wisdom
  chosen_korean: 뛰어난 말이나 지혜
  alternatives_korean:
  - 탁월한 언변이나 지혜
  lexicon: BDAG
  rationale: ὑπεροχή는 「우위·뛰어남」. 그리스 수사학적 자랑을 비판하는 맥락.
- source_word: τὸ μαρτύριον τοῦ θεοῦ
  english_pob_choice: the testimony of God
  chosen_korean: 하나님의 증언
  alternatives_korean:
  - 하나님에 관한 증언
  lexicon: BDAG
  rationale: 속격을 출처·주체로 읽어 「하나님의 증언」.
