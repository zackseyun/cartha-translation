review_pass:
  verdict: revise
  source_fidelity: 현 번역은 ἐλθὼν … ἦλθον의 ‘갔을 때/갔다’ 구조를 대체로 반영하지만, ‘선포하러 가지 않았습니다’는 καταγγέλλων을 목적(‘선포하기 위해’)으로 바꾸어, 바울이 선포 자체를 하지 않았다는 뜻으로 읽힐 수 있습니다. 원문은 하나님의 증언을 선포할 때 탁월한 언변이나 지혜를 내세우지 않았다는 뜻입니다. 또한 τοῦ θεοῦ의 속격은 ‘하나님의’로 유지하여 출처·내용 등의 가능한 이해를 특정하지 않습니다.
  naturalness: ‘형제들이여’는 이해 가능하나 현대 표준어 합쇼체에서는 ‘형제 여러분’이 더 자연스럽습니다. ‘뛰어난 말’보다 ‘탁월한 말솜씨’가 λόγου의 수사적 뉘앙스를 자연스럽게 드러냅니다.
  terminology: ‘하나님의 증언’은 SBLGNT의 μαρτύριον τοῦ θεοῦ를 충실히 반영합니다. 잘 알려진 μυστήριον(‘신비’) 이문은 본문에 채택하지 않고 각주로 밝혀야 합니다.
  issues:
  - severity: high
    issue: ‘선포하러 가지 않았습니다’가 καταγγέλλων을 목적 표현으로 처리합니다.
    rationale: 원문의 분사는 선포 행위의 상황을 나타내며, 바울이 선포하기 위해 오지 않았다는 뜻이 아닙니다. 이 표현은 문맥상 선포 자체의 부정으로 오해될 수 있습니다.
  - severity: medium
    issue: 이문에 대한 각주와 본문 앵커가 없습니다.
    rationale: 기준 본문은 μαρτύριον이지만 μυστήριον 이문은 번역에 실질적 차이를 만들므로 영어 POB 감사 기록처럼 밝혀야 합니다.
  - severity: low
    issue: ‘형제들이여’는 현대 한국어에서 다소 고풍스럽습니다.
    rationale: 현대적이면서도 격식 있는 합쇼체에는 ‘형제 여러분’이 더 적합합니다.
