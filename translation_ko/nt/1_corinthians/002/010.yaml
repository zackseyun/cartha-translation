  to: 왜냐하면 하나님께서는 성령을 통하여 이것들을 우리에게 계시하셨습니다. 성령께서는 모든 것, 곧 하나님의 깊은 것들까지도 살피십니다.
  rationale: The revision replaces the adversative conjunction with a causal explanation for γάρ, retains the contextually supplied object, identifies the Spirit in accordance with the immediate context, preserves the probing sense of ἐραυνᾷ, and reflects the plural form of 'depths.' No footnote is necessary because the supplied object is explicit in the Korean rendering and does not create a competing textual reading.
