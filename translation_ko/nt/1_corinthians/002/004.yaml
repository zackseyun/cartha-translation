  source_fidelity: 원문의 대조 구조(οὐκ ἐν … ἀλλ’ ἐν …), λόγος와 κήρυγμα의 구별, 그리고 ‘설득력 있는 지혜의 말’과 ‘영과 능력의 나타나심’의 대비를 충실히 반영합니다. ‘영’은 한국어에서 대소문자 구별 없이 성령 및 보다 일반적인 영의 의미를 열어 두므로, πνεύματος의 해석상 여지를 본문 안에서 과도하게 확정하지 않습니다.
  naturalness: 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다. ‘내 말과 내 선포’ 및 ‘…한 것이었습니다’는 바울의 자기 언급과 대조를 명료하게 전달합니다.
  terminology: ‘선포’는 κήρυγμα의 공적 선포 의미를 살리며, ‘나타나심’은 여기서 영과 능력이 드러내는 ἀπόδειξις를 자연스러운 한국어로 전달합니다. ‘영’은 본문상 가능한 모호성을 보존합니다.
