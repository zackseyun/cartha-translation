  source_fidelity: 첫 절의 완료 수동 분사 περιτετμημένος와 둘째 절의 ἐν ἀκροβυστίᾳ는 각각 부르심을 받을 당시의 상태를 가리킵니다. 이를 ‘할례를 받은/받지 않은 상태에서’로 평행되게 옮기는 것이 충실합니다. ἐπισπάσθω는 할례의 표지를 되돌리거나 감추려는 행위를 뜻하므로 본문과 각주에 그 의미를 보존했습니다. 마지막 μὴ περιτεμνέσθω는 ‘할례를 받지 마십시오’로 자연스럽고 직접적으로 옮길 수 있습니다.
  naturalness: 초안의 ‘할례를 받고 부르심을 받은 자’는 ‘받고/받은’의 반복으로 다소 무겁습니다. ‘할례를 받은 상태에서 부르심을 받았습니까?’는 현대 표준어 합쇼체에서 자연스럽고, 두 질문의 구조도 균형을 이룹니다.
  terminology: ‘부르심을 받다’는 바울 문맥의 καλέω를 과도하게 해석하지 않으면서 통상적인 한국어 성서 용례를 따릅니다. ‘할례’와 ‘포피’도 적절합니다.
