    issue: ‘말합니다’의 첨가
    rationale: Περὶ δὲ는 ‘…에 관하여/관해서는’이라는 화제 표지이지 ‘내가 말한다’라는 독립 서술을 포함하지 않습니다.
  - severity: low
    issue: ‘이제’의 시간적 뉘앙스
    rationale: δέ의 전환 기능은 한국어의 ‘-에 관해서는’으로 충분히 나타낼 수 있으며, ‘이제’는 원문에 없는 시간적 뉘앙스를 줄 수 있습니다.
  - severity: medium
    issue: 완료 수동 분사와 πιστός의 의미가 충분히 드러나지 않음
    rationale: ‘주의 자비로 신실한 자로서’는 ἠλεημένος의 ‘긍휼을 입은’ 결과성과, 문맥상 πιστός의 ‘신뢰할 만한’ 의미를 덜 분명하게 합니다.
