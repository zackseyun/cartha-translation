- from: 이제 처녀들에 관하여 말합니다. 나는 주의 명령을 가지고 있지 않으나, 주의 자비로 신실한 자로서 내 판단을 제시합니다.
  to: 처녀들에 관해서는[a], 나는 주님에게서 받은 명령은 없습니다. 그러나 주님의 긍휼을 입어 신뢰할 만한 사람이 되어[c] 내 판단을 제시합니다[b].
  rationale: 원문의 화제 전환, 주님에게서 받은 직접 명령의 부재, 바울 자신의 판단, 그리고 주님의 긍휼로 얻은 신뢰성을 모두 보존하도록 개정했습니다. παρθένοι와 πιστός의 남아 있는 의미 범위는 본문에서 한쪽을 과도하게 해석하지 않고 각주로 제시했습니다.
