  verdict: revise
  source_fidelity: The draft accurately represents the mixed-marriage setting, the husband's willing consent, and the prohibition. However, 「그가 함께 살기를 원하면」 leaves the explicit μετ’ αὐτῆς (“with her”) implicit, and the phrasing 「어떤 여자에게 … 남편이 있고」 is less natural in current formal Korean.
  naturalness: A conditional clause using 「남편이 있는데」 and an explicit 「그녀와 함께」 is more idiomatic and clear. 「남편을 떠나서는 안 됩니다」 is natural formal-polite Korean and appropriately retains the lexical breadth of ἀφιέτω rather than narrowing it to a legal term such as 「이혼하다」.
  terminology: 「믿지 않는 남편」 appropriately conveys ἄπιστον in this Christian-context contrast without suggesting marital unfaithfulness. 「떠나다」 preserves the source and English audit trail’s deliberate avoidance of an over-specific rendering. A footnote is useful to identify the marital-context sense without collapsing the lexical ambiguity in the main text.
  issues:
  - severity: low
    issue: The object of “live with” is not explicit.
    rationale: Greek οἰκεῖν μετ’ αὐτῆς explicitly says “to live with her.” Korean can state this naturally as 「그녀와 함께 살기를」.
  - severity: low
    issue: The opening possession construction is somewhat stiff in modern Korean.
    rationale: 「어떤 여자에게 믿지 않는 남편이 있고」 is understandable, but 「어떤 여자에게 믿지 않는 남편이 있는데」 better carries the conditional scenario in natural formal Korean.
  revised_text: 또 어떤 여자에게 믿지 않는 남편이 있는데, 그가 그녀와 함께 살기를 원한다면, 그녀는 남편을 떠나서는 안 됩니다[a].
