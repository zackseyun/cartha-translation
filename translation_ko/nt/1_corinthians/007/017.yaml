revisions:
- from: 다만, 주께서 각 사람에게 나누어 주신 대로, 하나님께서 각 사람을 부르신 대로, 그대로 행하십시오. 이것은 내가 모든 교회에서 그렇게 명하는 바입니다.
  to: 다만 각 사람은 주께서 그에게 나누어 주신 대로[a], 하나님께서 그를 부르신 대로, 그렇게 살아가십시오[b]. 그리고 나는 모든 교회에서 이렇게 지시합니다.
  rationale: 원문의 대조적 전환(‘다만’), 각 사람에 대한 반복적 적용, ‘주’와 ‘하나님’의 구별, 그리고 삶의 방식에 관한 권면을 보존했습니다. 마지막 문장은 원문의 ‘καὶ οὕτως’를 반영하여 ‘그리고 … 이렇게 지시합니다’로 직접 옮겼으며, 원문에 없는 ‘이것은’이라는 내용을 추가하지 않았습니다.
