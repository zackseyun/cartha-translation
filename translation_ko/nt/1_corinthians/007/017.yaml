review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 첫 절의 반복되는 ‘각 사람’과 주어 관계를 더 분명히 하고, περιπατείτω의 삶의 방식이라는 비유적 의미를 자연스럽게 보존해야 합니다. 마지막 절은 καὶ οὕτως를 반영하여 ‘이것은 … 바입니다’처럼 내용 명사를 보태기보다 ‘이렇게 지시합니다’로 옮기는 것이 더 가깝습니다.
  naturalness: ‘각 사람은 … 대로 … 대로, 그렇게 살아가십시오’는 현대 표준어 합쇼체로 자연스럽고, 대표적 단수의 권면을 한국어의 일반적 권면으로 무리 없이 전달합니다. ‘모든 교회에서 이렇게 지시합니다’도 바울이 모든 교회들 가운데서 동일하게 지시한다는 범위를 보존합니다.
  terminology: κύριος는 ‘주’, θεός는 ‘하나님’으로 구별해 유지했습니다. μερίζω는 ‘나누어 주다’로 유지하되, 문맥상 각 사람에게 주어진 몫 또는 처지를 가리킬 수 있음을 각주로 밝혔습니다. διατάσσομαι는 영어 감사 기록의 ‘direct’에 맞추어 ‘지시합니다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: 마지막 문장의 ‘이것은 내가 모든 교회에서 그렇게 명하는 바입니다’
    rationale: 원문은 ‘그리고/또 나는 모든 교회에서 이렇게 지시합니다’라는 직접 진술입니다. ‘이것은’과 ‘명하는 바’는 원문에 없는 명사적 구성을 더하며, ‘그렇게’의 선행 내용도 다소 불분명하게 만듭니다.
