review_pass:
  verdict: revise
  source_fidelity: 첫 절의 완료 수동형 ἡγίασται는 ‘거룩하게 되었습니다’로 자연스럽게 옮길 수 있으며, ἀδελφῷ는 원문의 ‘그 형제’를 보존하되 그 지시 대상을 주석으로 밝혀야 합니다. 초안의 ‘부정한 것이 될 것이나’는 현재형 ἐστιν 및 조건적 논증의 상태 진술을 미래의 변화로 옮겨 원문에서 다소 벗어납니다.
  naturalness: ‘아내로 인해’와 ‘그 형제로 인해’는 이해되지만, 이 문맥에서는 ‘아내를 통해’, ‘그 형제를 통해’가 더 자연스럽고 ἐν의 관계적·매개적 용법을 잘 드러냅니다. ‘부정한 것이 될 것이나’는 한국어로도 다소 부자연스럽습니다.
  terminology: ‘거룩하게 되었습니다’와 ‘부정하다/거룩하다’는 ἡγίασται, ἀκάθαρτα, ἅγια의 연결과 제의적 대조를 유지합니다. ‘성화되다’는 교리적으로 과도하게 특정화될 수 있으므로 피하는 것이 적절합니다. ‘형제’는 바울의 신자 호칭을 보존하며, 주석에서 문맥상 믿는 남편을 가리킨다는 점을 설명합니다.
  issues:
  - severity: medium
    issue: ‘부정한 것이 될 것이나’
    rationale: 원문의 ἐστιν은 현재형이며, 이 조건 논증은 자녀의 지위를 ‘부정할 것이다’라고 진술합니다. ‘부정한 것이 될 것이다’는 미래의 변화처럼 들리고 명사화되어 제의적 상태 대조도 약해집니다.
  - severity: low
    issue: ‘그 형제’의 지시 대상에 관한 주석 부재
    rationale: ἀδελφῷ를 ‘형제’로 번역하는 것은 원문에 충실하지만, 현대 한국어 독자는 이를 아내의 친형제로 오해할 수 있습니다. 바울의 통상적 신자 호칭이며 여기서는 믿는 남편을 가리킬 가능성이 높다는 주석이 필요합니다.
  revised_text: 이는 믿지 않는 남편이 아내를 통해 거룩하게 되었고, 믿지 않는 아내가 그 형제를 통해 거룩하게 되었기 때문입니다.[a] 그렇지 않다면 여러분의 자녀는 부정할 것이지만, 이제는 거룩합니다.
  revised_footnotes:
  - marker: a
    text: 그리스어는 ‘그 형제’를 사용합니다. 바울이 ‘형제’를 동료 신자를 가리키는 말로 흔히 사용하므로, 여기서는 문맥상 믿는 남편을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘거룩하게 되었다’는 말은 믿는 배우자 및 가정과의 관계 안에서 구별된 지위를 가리키며, 반드시 개인의 구원을 뜻하는 것은 아닙니다.
    reason: cultural_note
  revision_rationale: 현재형 조건 논증을 반영하여 ‘부정한 것이 될 것이나’를 ‘부정할 것이지만’으로 고쳤고, ἐν의 문맥상 관계적·매개적 의미를 자연스럽게 나타내도록 ‘~을 통해’로 다듬었습니다. 원문의 ἀδελφῷ는 ‘그 형제’로 보존하고, 그 의미를 설명하는 주석을 추가했습니다. 신학적 의미를 본문에 과도하게 해석하여 넣지 않았습니다.
