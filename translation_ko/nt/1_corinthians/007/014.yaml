  source_fidelity: 수정안은 ἡγίασται의 완료 수동 상태를 ‘거룩하게 되었고’로, ἀκάθαρτα/ἅγια의 대조를 ‘부정한 상태/거룩’으로 유지합니다. ἐπεὶ ἄρα가 이끄는 반사실적 귀결은 한국어 조건문에 자연스러운 ‘부정한 상태일 것입니다’로 옮겨, 단순한 미래 예측으로 읽히지 않게 했습니다.
  naturalness: 초안의 ‘부정한 것이 될 것이나’는 한국어로 어색하고, 현재형 ἐστιν이 나타내는 가정된 현재 상태보다 미래의 변화처럼 들립니다. ‘부정한 상태일 것이지만’이 현대 표준어 합쇼체에서 자연스럽고 논리 관계도 분명합니다.
  terminology: ‘거룩하게 되다’와 ‘부정하다’는 본문의 제의적·관계적 대조를 보존합니다. ἀδελφῷ는 본문에서 ‘그 형제’로 보존하되, 한국어 독자가 혈연 형제로 오해할 수 있으므로 각주에서 믿는 남편을 가리키는 바울의 통상적 용법을 설명합니다.
  issues:
  - severity: medium
    issue: ‘여러분의 자녀가 부정한 것이 될 것이나’
    rationale: 그리스어는 ἐστιν(현재)이며, 이 절은 앞 진술이 성립하지 않을 경우의 귀결을 말합니다. ‘될 것이다’는 미래적 변화로 들리고 ‘부정한 것’도 사람인 자녀에 부자연스럽습니다. ‘부정한 상태일 것입니다’로 고칩니다.
  - severity: low
    issue: ‘그 형제’의 지시 대상이 본문만으로 한국어 독자에게 불분명함
    rationale: ἀδελφῷ를 ‘형제’로 보존하는 것은 원문 충실성이 있으나, 여기서는 믿는 남편을 가리키는 것으로 보입니다. 본문을 평준화하지 않고 각주로 설명합니다.
  revised_text: 이는 믿지 않는 남편이 자기 아내로 말미암아 거룩하게 되었고, 믿지 않는 아내도 그 형제로[a] 말미암아 거룩하게 되었기 때문입니다[b] 그렇지 않다면 여러분의 자녀는 부정한 상태일 것이지만, 이제는 거룩합니다.
  revised_footnotes:
