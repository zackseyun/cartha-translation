    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘거룩하게 되었다’는 믿는 배우자 및 가족과의 관계 안에서 구별되거나 거룩한 지위에 놓였음을 가리키며, 반드시 개인의 구원을 뜻하는 것은 아닙니다.
    reason: cultural_note
