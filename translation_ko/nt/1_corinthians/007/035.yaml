base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: Now I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: ko
  text: 내가 이것을 말하는 것은 여러분 자신의 유익을 위한 것이지, 여러분에게 올가미를 씌우려는 것이 아닙니다. 오히려 여러분이 합당하게 행하고, 주님을 섬기는 일에 흩어짐 없이 전념하도록 하려는 것입니다.
  philosophy: optimal-equivalence
