  to: 아내는 자기 남편이 살아 있는 동안 매여 있습니다. 그러나 남편이 잠들면[a], 그녀는 자기가 원하는 사람과 결혼할 자유가 있습니다. 다만 주 안에서만 결혼할 수 있습니다.
