  terminology: δέδεται는 ‘매여 있습니다’로 유지할 수 있습니다. ἐν κυρίῳ는 해석을 덧붙이지 않고 ‘주 안에서’로 옮겨, 신자와의 결혼이라는 통상적 해석을 본문에 강제하지 않습니다.
