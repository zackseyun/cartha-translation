  source_fidelity: 개정이 필요합니다. ‘누구든지 원하는 자와’는 ‘아내가 원하는 누구와든지’가 아니라 ‘원하는 자라면 누구든지’로 읽힐 수 있어 ᾧ θέλει의 주체와 의미를 정확히 전달하지 못합니다. 또한 κοιμηθῇ의 죽음 완곡 표현은 본문에서 보존하고 각주로 뜻을 밝혀 주는 것이 원문에 더 충실합니다.
