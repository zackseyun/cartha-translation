    rationale: 그리스어 ᾧ θέλει는 아내가 ‘원하는 사람과’ 결혼할 수 있다는 뜻입니다. 현 문구는 ‘원하는 자라면 누구든지’라는 뜻으로도 읽힙니다.
  - severity: low
