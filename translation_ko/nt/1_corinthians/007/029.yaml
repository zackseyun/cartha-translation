  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
  footnotes:
  - marker: a
    text: Or, 'the appointed time has grown short.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' translates the masculine plural ἀδελφοί, which can address a mixed group of fellow believers.'
    reason: cultural_note
translation:
  language: ko
  text: 형제들이여[b], 내가 이 말을 합니다. 때가 단축되었습니다[a]. 그러므로 이제부터는 아내가 있는 사람들도 아내가 없는 사람처럼 되어야 합니다,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 때가 얼마 남지 않았습니다.’
    reason: καιρός와 συνεσταλμένος의 가능한 어휘적 표현을 제시합니다.
  - marker: b
    text: ‘형제들이여’는 남성 복수형 ἀδελφοί를 옮긴 말이며, 문맥상 남녀 신자들로 이루어진 공동체 전체에게 하는 호칭일 수 있습니다.
    reason: 원어의 문법적 형태와 문맥상 포괄적 청중 가능성을 설명합니다.
lexical_decisions:
- source_word: ὁ καιρὸς συνεσταλμένος ἐστίν
  english_pob_choice: the time has been shortened
  chosen_korean: 때가 단축되었으니
  alternatives_korean:
