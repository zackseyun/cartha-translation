  verdict: revise
  source_fidelity: 원문의 τοῦτο δέ φημι는 설명을 도입하는 발화이며, ὁ καιρὸς συνεσταλμένος ἐστίν은 완료형이 나타내는 현재의 상태를 유지하여 ‘때가 단축되었습니다’로 옮길 수 있습니다. τὸ λοιπὸν ἵνα는 이어지는 삶의 태도에 대한 귀결을 이끌며, ‘이제부터는 … 되어야 합니다’가 이를 자연스럽게 드러냅니다. ‘아내가 있는 사람들’과 ‘아내가 없는 사람처럼’은 γυναῖκας와 ὡς μὴ ἔχοντες의 대조를 보존합니다.
  naturalness: 초안의 ‘아내 있는 자들’, ‘없는 자처럼 되고’는 현대 표준 한국어 합쇼체로는 다소 문어적이고 문장이 미완성처럼 들립니다. ‘아내가 있는 사람들도 아내가 없는 사람처럼 되어야 합니다’로 고치면 자연스럽고 문법적으로 완결됩니다.
  terminology: ἀδελφοί는 본문상 ‘형제들이여’로 유지하되, 혼성 신자 공동체를 가리킬 수 있음을 각주로 밝혔습니다. καιρός의 질적·정해진 때라는 뉘앙스는 대안 번역 각주에서 제시하되, 본문에는 과도한 해석을 더하지 않았습니다.
