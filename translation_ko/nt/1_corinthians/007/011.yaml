source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
  footnotes:
  - marker: a
    text: Or 'But even if she does separate.' The Greek can carry a slightly concessive force here.
    reason: lexical_alternative
  - marker: b
    text: Or 'must not send away his wife.' The verb can be rendered more literally as 'send away,' though in this marital context it commonly refers to divorce.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 아내가 갈라섰다면, 결혼하지 않은 채로 남아 있어야 하며, 또는 남편과 화해하여야 합니다. 또 남편도 아내와 이혼해서는 안 됩니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기 아내를 떠나보내서는 안 됩니다.’ 이 혼인 문맥에서 이 표현은 일반적으로 이혼을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μενέτω ἄγαμος
  english_pob_choice: let her remain unmarried
  chosen_korean: 결혼하지 않은 상태로 남아 있든지
  alternatives_korean:
  - 미혼으로 머물든지
  lexicon: BDAG
  rationale: 8절 ἄγαμος와 어휘 호응.
- source_word: καταλλαγήτω
  english_pob_choice: be reconciled
  chosen_korean: 화해하여야
  alternatives_korean:
  - 화목하여야
  lexicon: BDAG
  rationale: καταλλάσσω의 「관계 회복」.
- source_word: ἀφιέναι
  english_pob_choice: divorce
  chosen_korean: 내보내서는
  alternatives_korean:
  - 떠나보내서는
  lexicon: BDAG
  rationale: ἀφίημι의 「방출·해소」, 1세기 이혼의 일반 표현.
