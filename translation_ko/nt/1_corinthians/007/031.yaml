  text: 그리고 세상을 사용하는 사람들은 그것을 충분히 사용하지 않는 사람들처럼 하십시오.[a] 이 세상의 모습은 지나가고 있기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
