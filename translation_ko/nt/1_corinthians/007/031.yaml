  source_fidelity: 초안의 ‘충분히 활용하지 못하는’은 καταχρώμενοι를 의도적 절제가 아니라 능력이나 가능성의 결여처럼 들리게 합니다. 또한 σχῆμα를 ‘현재 형체’로 옮긴 것은 한국어에서 다소 부자연스럽고 물질적 형태로 좁혀질 수 있습니다.
  naturalness: ‘세상을 사용하는 사람들’과 ‘충분히 사용하지 않는 사람들처럼 하십시오’는 원문의 반복·대조를 살리면서 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘이 세상의 모습은 지나가고’는 진행 중인 παράγει와 σχῆμα의 일시적 양태를 무리 없이 나타냅니다.
  terminology: κόσμος는 ‘세상’으로 유지합니다. καταχράομαι는 문맥상 ‘충분히 사용하다’로 옮기되, ‘남용하다’라는 가능한 어감을 각주로 남깁니다. σχῆμα는 본질 자체보다 외적·현재적 양태를 가리킬 수 있으므로 ‘모습’과 각주를 사용합니다.
