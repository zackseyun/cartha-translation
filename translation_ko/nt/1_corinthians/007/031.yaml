  - marker: b
    text: ‘모습’은 ‘외적 형태’, ‘양상’ 또는 ‘현재의 형식’으로도 옮길 수 있습니다.
    reason: σχῆμα는 세상의 본질이라기보다 그 외적·일시적 양태를 가리킬 수 있습니다.
