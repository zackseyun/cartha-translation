- from: 그러나 나는 여러분이 염려에서 자유로워지기를 바랍니다. 결혼하지 않은 남자는 주의 일을 염려하니, 곧 어떻게 주를 기쁘게 할까 하는 것입니다.
  to: 그러나 나는 여러분에게 염려가 없기를 바랍니다. 결혼하지 않은 남자는 주의 일에 마음을 쓰며, 어떻게 주를 기쁘게 할 수 있을지에 마음을 씁니다.
