review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the causal relation (διὰ) and the reciprocal male/female parallel. However, "두어야 합니다" can sound like a generalized absolute obligation rather than a direct third-person imperative, and "자기 자신의" is unnecessarily repetitive. The plural πορνείας is best retained through a footnote, since a literal Korean plural such as "음행들" is unnatural.
  naturalness: '"음행들" is not idiomatic modern Korean. "성적 부도덕" is natural and suitably broad for πορνεία; a note can transparently identify the Greek plural. "자기 아내/남편" naturally conveys the possessive emphasis without the redundant "자기 자신의."'
  terminology: '"성적 부도덕" is a modern, non-euphemistic rendering of πορνεία that does not narrow the term to one specific offense. "아내" and "남편" correctly reflect γυνή and ἀνήρ in this marital pairing. The wording avoids adding an explicit command to marry or an interpretation about conjugal duties.'
  issues:
  - severity: medium
    issue: The expression "음행들" is unnatural in standard modern Korean.
    rationale: Although πορνείας is plural, Korean normally uses an uncountable collective expression here. A footnote can preserve the formally significant plural without producing stilted Korean.
  - severity: low
    issue: '"자기 자신의" is redundant.'
    rationale: '"자기 아내" and "자기 남편" adequately express the emphatic possessives ἑαυτοῦ and ἴδιον in natural Korean.'
  - severity: medium
    issue: '"두어야 합니다" may overstate or recast the third-person imperative as a general necessity.'
    rationale: '"두도록 하십시오" more directly represents the imperative force in modern formal-polite Korean while retaining the source''s wording of having a spouse rather than explicitly saying to marry.'
  revised_text: 그러나 성적 부도덕 때문에[a] 각 남자는 자기 아내를 두도록 하시고, 각 여자도 자기 남편을 두도록 하십시오.
