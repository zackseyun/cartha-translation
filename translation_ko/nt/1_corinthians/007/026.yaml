base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
  footnotes:
  - marker: a
    text: Or 'because of the present necessity' or 'because of the impending crisis.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for a person'; Greek 'for a man' may function generically, but the translation preserves the masculine form of the source.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'to be thus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 현재의 곤경 때문에 이것이 좋다고 생각합니다. 곧 사람이 지금 그대로 있는 것이 좋다는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἐνεστῶσαν ἀνάγκην
  english_pob_choice: the present distress
  chosen_korean: 현재의 곤경
  alternatives_korean:
  - 임박한 환난
  lexicon: BDAG
  rationale: ἀνάγκη는 「압박·환난」, ἐνεστῶσαν은 현재 분사 — 종말론적 곤경이 이미 시작됨.
- source_word: τὸ οὕτως εἶναι
  english_pob_choice: to remain as he is
  chosen_korean: 지금 그대로 있는 것
  alternatives_korean:
  - 그 상태 그대로 머무는 것
  lexicon: BDAG
  rationale: 17·20·24절의 「머물러라」 흐름.
