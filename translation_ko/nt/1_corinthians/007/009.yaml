  source_fidelity: 원문의 3인칭 복수 명령법 γαμησάτωσαν은 초안의 ‘결혼하십시오’처럼 독자에게 직접 명하는 2인칭 명령으로 옮기기보다, ‘그들이 결혼하도록 하십시오’와 같이 3인칭 권고/허용의 형태로 나타내는 편이 정확합니다. πυροῦσθαι는 문맥상 성적 욕망으로 타오름을 가리킬 가능성이 매우 높지만, 단어 자체에 ‘욕정으로’가 명시되어 있지는 않으므로 본문에서는 비유를 보존하고 각주에서 설명하는 것이 적절합니다.
