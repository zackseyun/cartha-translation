review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 μεμέρισται는 앞절의 결혼한 남성에 이어 결혼한 여성의 관심이 나뉜 상태를 말합니다. 초안의 ‘그는’은 성별 및 지시 대상이 맞지 않습니다. 또한 ἵνα ᾖ ἁγία는 ‘거룩하려 합니다’보다 목적을 나타내는 표현으로 옮기는 것이 적절합니다. γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος의 압축된 구문은 본문에서 동격으로 번역하되, 병렬 해석을 각주로 보존했습니다.
  naturalness: ‘분열되어 있습니다’는 사람 자체가 분열된다는 인상을 주어 이 문맥에서는 부자연스럽습니다. ‘마음이 나뉘어 있습니다’가 관심사의 분할이라는 비유를 자연스럽게 전달합니다. ‘주의 일’과 ‘세상의 일’은 반복 구조를 보존하면서 ‘주님의 일/세상의 일에 마음을 씁니다’로 현대 표준어에서 자연스럽게 다듬었습니다.
  terminology: κύριος는 ‘주님’, ἁγία는 ‘거룩하게 되다’, σώμα와 πνεῦμα는 ‘몸’과 ‘영’으로 유지했습니다. παρθένος는 ‘처녀’로 보존했습니다. 결혼 상태의 대조를 위해 ἡ δὲ γαμήσασα는 ‘결혼한 여자는’으로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘그래서 그는 분열되어 있습니다’
    rationale: καὶ는 ‘그래서’라는 결과 접속이 아니며, μεμέρισται의 여성형 문맥상 지시 대상은 ‘그’가 아니라 결혼한 여성입니다. 또한 ‘분열되어 있다’는 한국어에서 관심이 갈린다는 뜻을 자연스럽게 전달하지 못합니다.
  - severity: medium
    issue: ‘거룩하려 합니다’
    rationale: ἵνα ᾖ ἁγία는 거룩해지려는 주관적 의지를 직접 진술하기보다 목적을 나타냅니다. ‘거룩하게 되기 위해’가 더 충실합니다.
  - severity: medium
    issue: ‘결혼하지 않은 여자와 처녀’에 대한 대안 해석 미보존
    rationale: 이 구문은 동격 또는 두 범주의 병렬 열거로 읽힐 수 있습니다. 본문에서 동격으로 읽는 경우에도 병렬 읽기를 각주에 남겨야 합니다.
  revised_text: 그리고 그 여자의 마음은 나뉘어 있습니다. 결혼하지 않은 여자, 곧 처녀는 몸과 영 모두에서 거룩하게 되기 위해 주님의 일에 마음을 씁니다. 그러나 결혼한 여자는 어떻게 남편을 기쁘게 할지를 생각하며 세상의 일에 마음을 씁니다.
  revised_footnotes:
  - marker: a
    text: 또는 “결혼하지 않은 여자와 처녀는 주님의 일에 마음을 씁니다.” 헬라어는 ‘결혼하지 않은 여자’와 ‘처녀’를 동일한 대상을 설명하는 표현으로도, 서로 다른 두 범주를 나열하는 표현으로도 읽을 수 있습니다.
    reason: alternative_reading
  revision_rationale: 성별이 잘못된 첫 문장을 바로잡고, μεμέρισται의 ‘관심이 갈림’이라는 비유를 자연스러운 한국어로 재현했습니다. ἵνα 목적절을 목적 표현으로 수정했으며, 논쟁 가능한 ‘결혼하지 않은 여자와 처녀’의 구문은 본문에서 동격으로 번역하고 병렬 읽기를 각주로 보존했습니다.
