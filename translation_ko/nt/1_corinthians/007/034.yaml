review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 첫 문장의 καὶ μεμέρισται는 앞 절의 결혼한 남자를 이어 받아 ‘그도 나뉘어 있습니다’로 옮기는 것이 그리스어 문맥에 맞습니다. 초안의 ‘그래서’는 καί의 단순 연결을 인과로 바꾸며, ‘결혼하지 않은 여자와 처녀는’은 가능한 병렬 해석 하나를 본문에서 확정합니다. SBLGNT의 단수 동사 μεριμνᾷ에 맞추어 본문은 동격으로 옮기고, 병렬 해석은 각주로 보존합니다.
  naturalness: ‘분열되어 있습니다’는 사회적·집단적 분열을 강하게 연상시켜 관심의 분산이라는 문맥에 다소 부자연스럽습니다. ‘나뉘어 있습니다’가 더 적절합니다. 또한 ‘몸과 영 둘 다에서’보다 ‘몸과 영 모두에서’가 현대 표준어 문장에 자연스럽습니다.
  terminology: κύριος는 ‘주’, ἁγία는 ‘거룩하게’, πνεῦμα는 ‘영’, κόσμος는 ‘세상’으로 유지합니다. τὰ τοῦ κυρίου 및 τὰ τοῦ κόσμου는 각각 ‘주의 일’과 ‘세상 일’로 대응시키며, 후자는 부당하게 부정적 의미를 더하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그래서’와 첫 문장의 연결
    rationale: 그리스어 καί는 여기서 인과를 명시하지 않습니다. 또한 μεμέρισται의 묵시된 주어는 앞 절의 결혼한 남자이므로 ‘그도’가 문맥을 정확히 잇습니다.
  - severity: medium
    issue: ‘결혼하지 않은 여자와 처녀’가 병렬 범주로 단정됨
    rationale: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος는 병렬과 동격 모두로 읽힐 수 있습니다. 단수 동사와 영어 POB의 선택을 따라 본문에서는 동격으로 옮기되, 병렬 가능성은 각주에 남겨야 합니다.
  - severity: low
    issue: ‘분열되어 있습니다’와 ‘몸과 영 둘 다에서’의 어법
    rationale: 전자는 문맥상 관심이 갈린다는 뜻에 덜 자연스럽고, 후자는 현대 한국어에서 다소 어색합니다. ‘나뉘어 있습니다’, ‘몸과 영 모두에서’가 더 자연스럽습니다.
  revised_text: 그도 나뉘어 있습니다. 결혼하지 않은 여자, 곧 처녀ᵃ는 주의 일에 마음을 써서 몸과 영 모두에서 거룩하게 되려고 합니다. 그러나 결혼한 여자는 세상 일에 마음을 쓰며, 어떻게 남편을 기쁘게 할지를 염려합니다.
  revised_footnotes:
  - marker: a
    text: 또는 “결혼하지 않은 여자와 처녀는 주의 일에 마음을 씁니다.” 그리스어는 ‘결혼하지 않은 여자’와 ‘처녀’를 서로 다른 두 범주로 열거하는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
  revision_rationale: 그리스어 본문을 우선하여 첫 절의 묵시된 남성 주어를 앞 문맥에 따라 반영하고, καί를 인과 표현으로 바꾸지 않았습니다. 여성 미혼 상태를 가리키는 압축된 구문은 단수 동사에 맞춘 동격 번역을 본문에 두되, 논쟁 가능한 병렬 해석을 각주로 보존했습니다. 목적절 ἵνα ᾖ ἁγία와 ‘몸과 영’의 두 영역도 명시적으로 유지했습니다.
