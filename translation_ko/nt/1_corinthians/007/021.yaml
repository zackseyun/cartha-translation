revisions:
- from: 그대가 노예로 부르심을 받았습니까? 그것을 마음에 두지 마십시오. 그러나 만일 그대가 자유롭게 될 수 있다 하더라도, 차라리 [지금 처지를] 그대로 사용하십시오.[a]
  to: 그대가 노예 신분으로 부르심을 받았습니까? 그것을 염려하지 마십시오. 그러나 자유롭게 될 수 있다면, 오히려 그것을 활용하십시오.[a]
  rationale: 원문의 조건문과 목적어 생략을 보존하면서, 영어 POB의 본문 독법(자유의 기회를 활용함)을 한국어 본문에 반영했습니다. 현 노예 신분을 활용하라는 오래된 대안 독법은 본문에 삽입하지 않고 각주에 남겨 논쟁된 모호성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:37:24Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 본문의 「자유롭게 될 수 있다 하더라도」는 εἰ καὶ δύνασαι의 조건을 양보 조건으로 바꾸며, 본문에 삽입한 「[지금 처지를]」는 μᾶλλον χρῆσαι의 목적어가 생략된 원문의 핵심 모호성을 본문에서 해소합니다. SBLGNT의 직접적인 조건과 목적어 생략을 보존해야 합니다.
  naturalness: 「노예 신분으로 부르심을 받았습니까? … 염려하지 마십시오」와 「자유롭게 될 수 있다면, 오히려 그것을 활용하십시오」는 현대 표준 한국어 합쇼체로 자연스럽습니다. 「그대로 사용하십시오」보다 「활용하십시오」가 χράομαι의 용례와 한국어 문맥에 더 적절합니다.
  terminology: Δοῦλος는 신분 및 해방 가능성이 논의되는 문맥이므로 「노예」가 적절합니다. 「부르심을 받다」는 바울 서신의 관용적 표현을 유지합니다. 목적어가 불명시된 μᾶλλον χρῆσαι는 영어 POB의 주독법에 따라 자유의 기회를 가리키는 「그것」으로 번역하되, 다른 해석은 각주로 보존합니다.
  issues:
  - severity: high
    issue: 조건절을 양보절로 바꾸고 본문 뜻을 반전함
    rationale: 「자유롭게 될 수 있다 하더라도」는 ‘자유롭게 될 수 있음에도’라는 뜻이 되어, εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι의 조건적 가능성과 영어 POB의 ‘if indeed you are able’를 충실히 반영하지 못합니다.
  - severity: high
    issue: 본문의 대괄호 삽입이 생략된 목적어의 모호성을 해소함
    rationale: 「[지금 처지를]」는 원문에 없는 목적어를 본문에 넣어 현 상태 유지라는 한 해석을 확정합니다. 영어 POB는 가까운 선행사인 자유의 기회를 본문 독법으로 삼고, 현 처지 독법은 각주에 둡니다.
  - severity: medium
    issue: 각주에 불필요한 해석적 논증을 포함함
    rationale: 「종말이 가깝다는 23·29절 흐름에 맞춤」은 대안 독법의 설명을 넘어 특정 해석 논증을 각주에 삽입하며, 23절은 종말의 임박성을 직접 말하지 않습니다. 각주는 문법적 모호성과 대안 번역만 간명하게 제시하는 것이 적절합니다.
  revised_text: 그대가 노예 신분으로 부르심을 받았습니까? 그것을 염려하지 마십시오. 그러나 자유롭게 될 수 있다면, 오히려 그것을 활용하십시오.[a]
