revisions:
- from: 그러나 만일 믿지 않는 자가 갈라서면, 갈라서게 두십시오. 그러한 경우들에서 형제나 자매는 매여 있지 않습니다. 하나님께서 우리를 평화 안에서 부르셨습니다.
  to: 그러나 믿지 않는 사람이 떠나면, 떠나게 두십시오. 형제나 자매는 이런 경우에 종으로 매여 있지 않습니다. 하나님께서 우리를 평화 가운데 부르셨습니다[a].
