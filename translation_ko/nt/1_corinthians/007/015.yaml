review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the concessive structure, the twofold separation verb, the inclusive “brother or sister,” and God’s completed calling. However, “매여 있지 않습니다” renders the statement with generic binding language and obscures the salient δουλόω (‘enslave’) wording. The plural expression “그러한 경우들에서” is also overly literal and unnatural in Korean.
  naturalness: “갈라서면” and especially “그러한 경우들에서” are less idiomatic in this marital context. “떠나면, 떠나게 두십시오” retains the Greek repetition while reading naturally, and “이런 경우에” is the standard Korean idiom.
  terminology: “종으로 매여 있지 않습니다” preserves the enslaving/bondage sense without deciding what practical freedoms the verse entails. “평화 가운데” is a natural formal rendering of ἐν εἰρήνῃ. A textual-variant note is retained for the minority reading “you.”
  issues:
  - severity: medium
    issue: The phrase “매여 있지 않습니다” weakens the lexical force of οὐ δεδούλωται.
    rationale: δεδούλωται is from δουλόω, ‘enslave,’ rather than the ordinary verb for ‘bind.’ Korean should retain the slave/bondage image while avoiding doctrinal expansion.
  - severity: low
    issue: “그러한 경우들에서” is an unnatural calque.
    rationale: ἐν τοῖς τοιούτοις idiomatically denotes circumstances of this kind; “이런 경우에” is natural modern Korean.
  - severity: low
    issue: The draft does not represent the relevant textual-variant information.
    rationale: SBLGNT reads “us,” but a footnote should note that some manuscripts read “you.”
  revised_text: 그러나 믿지 않는 사람이 떠나면, 떠나게 두십시오. 형제나 자매는 이런 경우에 종으로 매여 있지 않습니다. 하나님께서 우리를 평화 가운데 부르셨습니다[a].
  revised_footnotes:
  - marker: a
    text: 어떤 사본들에는 ‘우리를’ 대신 ‘여러분을’이라고 되어 있습니다.
    reason: textual_variant
  revision_rationale: The revision improves idiomatic Korean, retains the source’s repeated separation verb, and restores the lexical slave/bondage sense of δουλόω without construing the verse as a determination of remarriage or any other disputed implication. The textual note reflects the variant from ‘us’ to ‘you.’
