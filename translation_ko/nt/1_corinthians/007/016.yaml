  terminology: ‘구원하다’는 σῴζω의 구원론적 가능성을 축소하지 않는 적절한 역어입니다. 이를 ‘믿게 하다’나 ‘가정을 지키다’로 풀어쓰지 않는 것이 바람직합니다.
