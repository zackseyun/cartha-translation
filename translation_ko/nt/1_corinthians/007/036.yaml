  source_fidelity: 핵심 구조와 의미는 대체로 원문에 부합합니다. 다만 단수 명령형(ποιείτω)과 복수 명령형(γαμείτωσαν)을 한국어 합쇼체로 더 정확히 드러내야 하며, ὑπέρακμος의 ‘젊음의 절정이 지남’이라는 뉘앙스도 보완하는 편이 좋습니다. ‘자기의 처녀’는 어색하기는 하나 원문의 의도적인 관계상 모호성을 본문에서 보존할 수 있습니다.
  naturalness: 초안의 ‘합당하지 않게 행하고’는 현대 한국어에서 다소 경직되고, ‘그가 원하는 대로 하십시오’는 지시 대상이 불분명합니다. ‘부당하게 대하고 있다고 생각하며’, ‘그가 원하는 대로 하게 하십시오’ 및 ‘그들이 결혼하게 하십시오’가 현대의 격식 있는 합쇼체에서 더 자연스럽고 문법적으로 분명합니다.
  terminology: ‘처녀’는 현대 한국어에서 다소 표지된 말이지만 παρθένος 및 αὐτοῦ의 모호성을 가장 경제적으로 유지합니다. 약혼녀나 딸로 본문을 특정하지 않고 각주에서 주요 해석 가능성을 밝혀야 합니다. ‘젊음의 한창때’는 ὑπέρακμος의 연령 관련 뉘앙스를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: 명령형의 주어와 지시 대상이 불명확함
    rationale: ‘그가 원하는 대로 하십시오’는 독자에게 직접 명령하는 듯 들립니다. ποιείτω는 ‘그가 … 하게 하십시오’라는 3인칭 단수 명령형이며, γαμείτωσαν은 ‘그들이 결혼하게 하십시오’라는 3인칭 복수 명령형입니다.
  - severity: low
    issue: ‘합당하지 않게 행하고’의 현대적 자연스러움
    rationale: ἀσχημονεῖν은 부적절하거나 부당하게 대한다는 뜻입니다. ‘부당하게 대하고’가 관계의 방향성과 현대적 문체를 더 잘 살립니다.
  - severity: low
    issue: ὑπέρακμος의 뉘앙스가 약화됨
    rationale: ‘한창때가 지나가고’도 가능하지만, ‘젊음의 한창때가 지나가고’가 원문의 연령·청춘 관련 의미를 더 분명히 하면서 특정한 혼인 연령을 강제하지 않습니다.
  - severity: medium
    issue: 원문의 해석상 모호성에 대한 각주 누락
