source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
  footnotes:
  - marker: a
    text: Or 'toward his fiancée/betrothed virgin'; traditionally also understood as 'toward his virgin daughter.' The Greek is ambiguous.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 어떤 사람이 자기의 처녀[a]를 부당하게 대하고 있다고 생각하며, 그녀의 젊음의 한창때가 지나가고 마땅히 그렇게 되어야 한다면, 그가 원하는 대로 하게 하십시오. 그는 죄를 짓는 것이 아닙니다. 그들이 결혼하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기의 약혼녀/정혼한 처녀’. 전통적으로는 ‘자기의 처녀 딸’로도 이해됩니다. 그리스어 표현은 모호합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ
  english_pob_choice: behaving improperly toward his virgin
  chosen_korean: 자기의 처녀에 대하여 합당하지 않게 행하고
  alternatives_korean:
  - 자기 약혼녀를 부적절하게 대하고
  lexicon: BDAG
  rationale: 본 문맥의 「자기의 처녀」는 (1) 약혼녀, (2) 결혼시키지 않은 딸, (3) 영적 동거 자매 등 다양한 해석이 가능. 직역을 유지하여 모호성을 보존.
- source_word: ὑπέρακμος
  english_pob_choice: past her youth
  chosen_korean: 한창때가 지나가고 있어서
  alternatives_korean:
  - 혼인 적령기가 지나서
  lexicon: BDAG
  rationale: ἀκμή(절정)를 지난 상태. 결혼 적기.
