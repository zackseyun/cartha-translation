review_pass:
  verdict: revise
  source_fidelity: 원문의 세 병렬 분사는 각각 ‘우는 이들/기뻐하는 이들/사는 이들’과 ‘울지 않는/기뻐하지 않는/소유하지 않는’이라는 대조를 이룹니다. 초안의 마지막 ‘되어야 합니다’는 원문에 없는 당위의 서술을 더하며, ‘사는 자들’은 ‘살다’로도 읽힐 수 있어 ἀγοράζοντες의 구매 의미가 불분명합니다.
  naturalness: ‘사람들’과 ‘마치 … 않는 것처럼’은 현대 표준어에서 자연스럽고, 반복 구조도 분명히 드러냅니다. 절 단위의 병렬 목록이므로 종결 서술어를 보충하지 않아 원문의 압축된 수사 구조를 보존했습니다.
  terminology: κλαίοντες는 ‘우는 사람들’, χαίροντες는 ‘기뻐하는 사람들’, ἀγοράζοντες는 혼동을 피하여 ‘무언가를 사는 사람들’로 옮겼습니다. κατέχοντες는 단순 구매 행위와 대비되는 지속적 소유의 뉘앙스를 ‘소유하는’으로 유지했습니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘되어야 합니다’가 추가됨
    rationale: 헬라어 본문은 세 개의 관사+현재분사 병렬구이며 이 절 자체에 ‘되어야 한다’에 해당하는 유한동사나 당위 표현이 없습니다. 한국어의 자연스러운 병렬을 위해 종결어를 보충할 수는 있지만, 이 경우에는 직접적 당위를 덧붙입니다.
  - severity: medium
    issue: ‘사는 자들’의 의미가 모호함
    rationale: 한국어 ‘사는’은 ‘구매하는’뿐 아니라 ‘생존하는/거주하는’ 뜻으로도 흔히 이해됩니다. ἀγοράζοντες의 상업적 구매 의미를 명시하는 편이 안전합니다.
  - severity: low
    issue: ὡς μή의 태도·방식 표현이 다소 약하게 드러남
    rationale: ‘마치 … 않는 것처럼’은 실제로 울고 기뻐하고 구매하는 일을 부정하지 않으면서 그에 매이지 않는 방식이라는 원문의 표현을 자연스럽게 전달합니다.
