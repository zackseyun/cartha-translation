  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
  footnotes:
  - marker: a
    text: Or, 'the one who marries his virgin fiancée does well, and the one who does not marry her will do better.' Another common interpretation is 'his virgin daughter.' The Greek verb here more naturally means 'give in marriage,' so the main text preserves that sense while leaving the exact relationship less specific.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 자신의 처녀[a]를 혼인시키는 사람도 잘하며, 혼인시키지 않는 사람은 더 잘할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기의 처녀 약혼녀와 결혼하는 사람도 잘하며, 그녀와 결혼하지 않는 사람은 더 잘할 것입니다.’라고 할 수 있습니다. 또 다른 일반적인 해석은 ‘자신의 처녀 딸’입니다. 여기서 그리스어 동사는 더 자연스럽게 ‘혼인시키다’라는 사역의 뜻을 가지므로, 본문은 그 뜻을 유지하면서 정확한 관계는 특정하지 않습니다.
    reason: alternative_reading
