  to: 그러나 그 밖의 사람들에게는 내가 말합니다—주께서가 아니라 내가—어떤 형제에게 믿지 않는 아내가 있고 그 아내가 그와 함께 살기로 동의한다면, 그는 그 아내와 이혼해서는 안 됩니다.[a]
  rationale: 수정문은 δέ의 완만한 전환, ἐγώ의 강조와 ‘주’와의 대조, 남성 단수 ‘형제’, 아내의 자발적 동의, 그리고 결혼 문맥의 금지 명령을 보존합니다. ‘내가, 주께서가 아니라’는 바울이 자신의 지시를 예수의 지상 사역 중 직접 발언과 구별하는 표현을 번역할 뿐, 그 권위나 영감을 해석적으로 축소하지 않습니다.
