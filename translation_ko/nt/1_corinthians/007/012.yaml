  source_fidelity: 수정이 필요합니다. 초안은 기본 구조와 남성 신자인 ‘형제’ 및 믿지 않는 아내의 대조를 보존하지만, συνευδοκεῖ의 동의 의미가 ‘원하면’으로 다소 약화되었고, ἀφιέτω를 ‘내보내다’로 옮긴 것은 단순한 축출의 뉘앙스를 낼 수 있습니다. 결혼 관계를 끝내지 말라는 문맥상 의미를 ‘이혼해서는 안 됩니다’로 명시하되, 직역 가능성은 각주로 보존하는 것이 적절합니다.
  naturalness: ‘그 밖의 사람들에게’와 ‘그 아내가 그와 함께 살기로 동의한다면’은 현대 표준어 합쇼체에서 자연스럽고 의미 관계가 분명합니다. ‘주께서가 아니라 내가’라는 삽입은 원문의 대조와 강조를 간결하게 재현합니다.
  terminology: ‘형제’는 아내와 대조되는 남성 신자를 정확히 나타냅니다. ‘믿지 않는 아내’는 여기서 기독교 신앙을 공유하지 않는다는 ἄπιστος의 문맥적 뜻을 유지합니다. ‘이혼’은 이 결혼 문맥에서 ἀφίημι의 관용적 뜻을 분명히 하며, 각주가 더 문자적인 대안을 보존합니다.
  issues:
  - severity: medium
    issue: συνευδοκεῖ를 ‘원하면’으로 번역함
    rationale: ‘원하다’는 의향을 나타내지만, συνευδοκέω에는 함께 사는 데 대한 승인·동의의 뜻이 더 직접적으로 담겨 있습니다. ‘함께 살기로 동의한다면’이 더 충실합니다.
  - severity: medium
    issue: ἀφιέτω를 ‘그녀를 내보내서는 안 됩니다’로 번역함
    rationale: 문맥상 혼인 관계의 해소를 뜻하지만, ‘내보내다’는 물리적으로 쫓아내는 의미를 강하게 낼 수 있습니다. 본문의 관계적·법적 의미를 ‘그 아내와 이혼해서는 안 됩니다’로 옮기고 직역 대안은 각주로 제시하는 편이 안전합니다.
