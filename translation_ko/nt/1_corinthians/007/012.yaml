base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
  footnotes:
  - marker: a
    text: Or 'he must not leave her' or 'he must not send her away.' The Greek verb can be rendered more literally as 'leave' or 'dismiss,' but here it refers to ending the marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 밖의 사람들에게는 내가 말합니다—주께서가 아니라 내가—어떤 형제에게 믿지 않는 아내가 있고 그 아내가 그와 함께 살기로 동의한다면, 그는 그 아내와 이혼해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 아내를 버려서는 안 됩니다’나 ‘그 아내를 떠나보내서는 안 됩니다.’ 그리스어 동사는 더 문자적으로 ‘버리다’ 또는 ‘떠나보내다’로 옮길 수 있으나, 여기서는 결혼 관계를 끝내는 것을 가리킵니다.
    reason: lexical_alternative
