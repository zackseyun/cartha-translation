base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
  footnotes:
  - marker: a
    text: Or 'unless perhaps by consent.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'be together again'; the phrase refers to resuming life together as husband and wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 서로를 거절하지 마십시오. 다만 서로 합의하여 한동안 기도에 전념하려는 경우에는 그렇게 할 수 있습니다[a]. 그 후에는 다시 함께하십시오[b]. 그래야 여러분의 자제력 부족 때문에 사탄이 여러분을 유혹하지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “아마도 서로 합의하여 하는 경우가 아니라면.”
    reason: εἰ μήτι ἂν의 조건적·유보적 예외를 설명하는 어휘 대안입니다.
  - marker: b
    text: 직역하면, “다시 함께 있으십시오.” 이 표현은 부부 관계를 다시 시작하는 것을 가리킵니다.
    reason: πάλιν ἐπὶ τὸ αὐτὸ ἦτε의 문자적 표현과 문맥상 함의를 설명합니다.
