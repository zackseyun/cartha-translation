- from: 이는 주 안에서 부르심을 받은 노예는 주의 자유인이기 때문입니다. 마찬가지로 자유인으로 부르심을 받은 자는 메시아의 노예입니다.
  to: 이는 주 안에서 부르심을 받은 노예는 주께서 해방하신 자이기 때문입니다. 마찬가지로 자유인이었을 때 부르심을 받은 자는 메시아의 노예입니다.
  rationale: ἀπελεύθερος의 ‘노예 상태에서 해방된 사람’이라는 사회·법적 의미를 ‘주께서 해방하신 자’로 명시하여 ἐλεύθερος와 구별했습니다. δεύτε 절은 ἐλεύθερος가 부르심의 내용이 아니라 부르심 당시의 신분임을 드러내도록 고쳤습니다. 원문의 병렬과 역설, 그리고 메시아께 속한 노예라는 표현을 보존했습니다.
