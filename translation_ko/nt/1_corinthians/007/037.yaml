base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
  footnotes:
  - marker: a
    text: Or 'under no compulsion.'
    reason: lexical_alternative
  - marker: b
    text: '''His own virgin'' may refer either to his virgin daughter or to his fiancée/betrothed virgin; the Greek is debated.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 마음속에 굳게 서 있고, 강요받는 일이 없으며[a], 자기 뜻에 관하여 권한이 있고, 자기의 처녀를 지키기로 자기 마음속에 결정한 사람은 잘할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘필요나 압박을 받지 않고’.
    reason: lexical_alternative
  - marker: b
    text: ‘자기의 처녀’는 그의 처녀 딸을 가리킬 수도 있고, 그의 약혼녀 또는 정혼한 처녀를 가리킬 수도 있습니다. 그리스어 표현의 뜻은 논쟁이 있습니다.
    reason: alternative_reading
