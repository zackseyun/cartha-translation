  source_fidelity: ἄρα καί의 추론·첨가 관계를 ‘그렇다면 …도’로 잘 살렸습니다. ‘메시아 안에서’는 ἐν Χριστῷ의 연합 표현과 Χριστός의 칭호성을 보존하며, ‘잠든 자들’은 κοιμηθέντες의 죽음 완곡어법을 유지합니다. ‘멸망한 것입니다’는 문맥상 부활이 없다는 가정 아래 ἀπώλοντο가 나타내는 파멸의 결론을 충실히 옮깁니다.
