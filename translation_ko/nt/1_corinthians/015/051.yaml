  source_fidelity: 본문의 핵심 대조(모두가 잠들지는 않음 / 모두가 변화됨)는 대체로 정확합니다. 다만 κοιμάομαι의 죽음 은유를 본문에서 보존한 만큼 그 뜻을 밝히는 각주를 해당 낱말에 연결하는 것이 영어 POB의 어휘 결정 및 바울의 문맥에 더 충실합니다. ἰδού는 ‘보십시오’로 적절히 옮길 수 있습니다.
  naturalness: 합쇼체와 현대 표준어는 전반적으로 자연스럽습니다. ‘우리가’의 반복은 둘째 절에서 생략해도 주어와 대조가 충분히 유지되어 더 매끄럽습니다.
  terminology: μυστήριον의 ‘비밀’은 한국어 성경 문맥에서 통용되며, 단순히 난해한 수수께끼가 아니라 계시된 진리를 가리키는 원문의 용법을 무리 없이 보존합니다. ‘잠들다’는 죽음의 은유로 유지합니다.
  issues:
  - severity: low
    issue: ‘잠들다’에 대한 설명 각주가 없습니다.
    rationale: κοιμάομαι는 여기서 부활 소망의 관점에서 죽음을 가리키는 은유입니다. 본문은 은유를 보존하되, 각주로 해석적 대안을 제시하면 독자가 문자적 잠으로 오해하지 않도록 하면서도 원문의 표현을 유지할 수 있습니다.
  - severity: low
