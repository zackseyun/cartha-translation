  text: 또한 게바에게 보이시고, 그 뒤에 열두 제자에게 보이셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게바는 베드로에 해당하는 아람어 이름입니다.
    reason: cross_reference
  - marker: b
    text: 「열두 제자」는 예수의 사도 무리를 가리키는 정형 호칭입니다. 그 무리의 수가 언제나 정확히 열둘이었던 것은 아니지만, 이 명칭은 계속 사용되었습니다.
    reason: cultural_note
