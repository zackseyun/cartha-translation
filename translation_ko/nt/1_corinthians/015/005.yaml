  source_fidelity: ὤφθη is appropriately represented by the resurrection-appearance idiom ‘보이셨습니다.’ However, the draft does not explicitly carry forward καὶ ὅτι (‘and that’), which continues the confessional sequence from the preceding lines. ‘열두 제자’ is an acceptable Korean conventional designation for τοῖς δώδεκα in this context, provided the note makes clear that it is a fixed collective title rather than a headcount.
  naturalness: The sentence is natural in modern formal-polite Korean. Adding ‘또한’ better connects it to the preceding confessional clauses without making the Korean cumbersome.
  terminology: ‘게바’ correctly preserves Κηφᾶς rather than harmonizing it to ‘베드로.’ ‘열두 제자’ is idiomatic Korean biblical terminology for the established group designation. The cultural note should describe continued use of the designation, rather than saying that the numerical total itself ‘is maintained.’
