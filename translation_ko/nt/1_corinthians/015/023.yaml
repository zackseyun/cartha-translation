  - marker: a
    text: Or 'Christ' for 'the Messiah' (Χριστός). The Greek title means 'Anointed One.'
    reason: alternative_reading
  - marker: b
    text: Or 'presence' or 'arrival' for 'coming' (παρουσία), though in this context it refers to his future advent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 각 사람은 정해진 차례에 살아나게 됩니다. 첫 열매는 메시아이시며, 그다음에는 그분의 강림 때에 메시아께 속한 사람들이 살아나게 됩니다.
  philosophy: optimal-equivalence
