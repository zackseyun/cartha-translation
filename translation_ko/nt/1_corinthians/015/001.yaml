  - severity: low
    issue: 초안의 ‘복음, 곧 … 그 복음을 이제 여러분에게’ 어순은 중복되고 문장 종결부가 어색합니다.
    rationale: 원문의 관계절 구조는 유지하되 한국어의 자연스러운 정보 배열에 맞추어 ‘…복음, 곧 … 그 복음을 여러분에게 알립니다’로 정리하는 것이 명료합니다.
