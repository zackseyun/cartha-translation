  source_fidelity: 개정안은 Γνωρίζω를 사역적 표현인 ‘알게 합니다’가 아니라 직접적인 선언 표현인 ‘알립니다’로 옮기며, εὐαγγέλιον, εὐηγγελισάμην, παρελάβετε, ἐν ᾧ, ἑστήκατε의 관계를 보존합니다. δέ의 가벼운 전환 기능은 한국어에서 별도 접속사 없이 자연스럽게 처리할 수 있으며, 시간적 의미의 ‘이제’는 본문에 명시되지 않았으므로 제거했습니다.
  naturalness: 원문의 관계절 연쇄를 한국어에서 이해하기 쉬운 동격·관계 표현으로 정리했습니다. ‘알게 합니다’는 현대 한국어에서 다소 부자연스럽고 ‘알도록 만든다’라는 사역 의미를 낼 수 있으므로 ‘알립니다’가 적절합니다.
  terminology: ‘복음’은 εὐαγγέλιον의 한국어 성경 번역 전통 및 현대 기독교 용례에 맞는 적절한 용어입니다. ἀδελφοί는 원문의 남성형 호칭을 따라 ‘형제 여러분’으로 유지했습니다.
