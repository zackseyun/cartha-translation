review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영했으나, γίνεσθε의 권면과 περισσεύοντες의 지속적·풍성한 힘씀을 더 자연스럽고 분명하게 연결할 필요가 있습니다. 또한 εἰδότες를 단정적인 인과절인 “아시기 때문입니다”로 처리하기보다, 원문의 분사적 연결을 보존하는 편이 좋습니다.
  naturalness: “주의 일에 풍성하십시오”는 현대 표준 한국어에서 어색합니다. “주의 일에 풍성히 힘쓰십시오”가 자연스럽고 원문의 의미도 잘 전달합니다. “굳건히 서서 흔들리지 말고”는 두 병렬 형용사의 권면을 자연스럽게 표현합니다.
  terminology: κύριος는 “주”로, κόπος는 “수고”로 적절합니다. 교회 전체를 향한 호칭이라는 문맥을 반영하여 “형제자매 여러분”으로 옮기되, 원어의 남성 복수형 및 포괄적 용법은 각주로 밝혀 두는 것이 투명합니다.
  issues:
  - severity: medium
    issue: “항상 주의 일에 풍성하십시오”가 비자연적이며 περισσεύοντες의 동작성을 충분히 드러내지 못합니다.
    rationale: περισσεύοντες는 ‘풍성히/넘치게 힘쓰는’ 지속적 행위를 뜻합니다. 한국어에서는 ‘주의 일에 풍성히 힘쓰십시오’가 자연스럽습니다.
  - severity: low
    issue: “아시기 때문입니다”는 εἰδότες의 분사 연결을 명시적 원인절로 확정합니다.
    rationale: 원문의 분사는 인과적으로 이해될 수 있지만, ‘알면서’로 옮기면 영어 POB의 ‘knowing’과 마찬가지로 연결 관계의 폭을 보존합니다.
  - severity: low
    issue: 수신자 호칭의 포괄적 의미에 관한 설명이 없습니다.
    rationale: ἀδελφοί는 문법적으로 남성 복수이나 이 서신의 교회 공동체 수신자에게는 여성도 포함될 수 있습니다. 본문에서 ‘형제자매 여러분’으로 자연스럽게 드러내고 각주로 원어 형태를 설명합니다.
  revised_text: 그러므로 나의 사랑하는 형제자매 여러분, 굳건히 서서 흔들리지 말고, 여러분의 수고가 주 안에서 헛되지 않음을 알면서 언제나 주의 일에 풍성히 힘쓰십시오.
  revised_footnotes:
  - marker: a
    text: ‘형제자매 여러분’으로 옮긴 그리스어 아델포이(ἀδελφοί)는 문법적으로 남성 복수형이지만, 문맥에 따라 여성들을 포함한 신자 공동체 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘굳건히 서서 흔들리지 말고’는 ἑδραῖοι와 ἀμετακίνητοι 및 γίνεσθε의 권면을 자연스러운 합쇼체로 표현합니다. ‘언제나 주의 일에 풍성히 힘쓰십시오’는 περισσεύοντες의 지속성과 풍성함을 보존합니다. ‘알면서’는 εἰδότες의 분사적 연결을 유지하며, 마지막 ‘주 안에서’는 원문처럼 ‘여러분의 수고’를 수식하도록 두었습니다.
