review_pass:
  verdict: revise
  source_fidelity: 초안은 Ὥστε의 결론적 연결, 두 권면, 주의 일, 그리고 수고가 헛되지 않다는 핵심을 대체로 충실히 옮깁니다. 다만 γίνεσθε의 적극적인 권면은 ‘흔들리지 마십시오’만으로는 충분히 드러나지 않으며, εἰδότες를 ‘아시기 때문입니다’로 처리하면 원문의 참여적 연결을 명시적 인과로 다소 좁힙니다.
  naturalness: ‘항상 주의 일에 풍성하십시오’는 현대 표준 한국어에서 부자연스럽습니다. ‘항상 주의 일에 더욱 힘쓰십시오’가 περισσεύοντες의 지속적이고 풍성한 헌신을 자연스럽게 전달합니다. ‘굳건히 서서’는 두 형용사 권면을 한국어답게 연결합니다.
  terminology: ‘주’, ‘주 안에서’, ‘수고’, ‘헛되지 않다’는 바울 서신의 문맥과 한국어 성서 문체에 적절합니다. ‘형제 여러분’은 ἀδελφοί의 문법적 형태를 보존하되, 이 서신의 교회 공동 수신자를 고려한 포괄적 용례는 각주로 밝혀 두는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘항상 주의 일에 풍성하십시오’의 비자연성
    rationale: ‘풍성하다’는 이 구문에서 사람의 지속적 활동을 권하는 말로 자연스럽지 않습니다. περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου의 ‘풍성히/넘치게 힘씀’을 자연스러운 권면으로 옮길 필요가 있습니다.
  - severity: low
    issue: γίνεσθε의 적극적 권면이 약화됨
    rationale: ‘굳건하고 흔들리지 마십시오’는 부정 명령 중심이어서 ‘굳건한 사람이 되라/굳게 서라’는 적극적 요청을 충분히 나타내지 못합니다.
  - severity: low
    issue: εἰδότες를 명시적 인과로 한정함
    rationale: 완료분사는 ‘알면서/알고’라는 동반적 또는 근거적 뉘앙스를 지니며, ‘때문입니다’는 가능한 해석이지만 원문의 유연한 연결을 좁힙니다.
  revised_text: 그러므로 나의 사랑하는 형제 여러분, 굳건히 서서 흔들리지 마십시오. 항상 주의 일에 더욱 힘쓰십시오. 여러분의 수고가 주 안에서 헛되지 않다는 것을 아십시오.
  revised_footnotes:
  - marker: a
    text: ‘형제 여러분’에 해당하는 그리스어 아델포이(adelphoi)는 문법적으로 남성 복수형이지만, 문맥에 따라 여성 신자들을 포함한 신자 공동체 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문장 전체의 결론적 권면 구조를 유지하면서, ‘굳건히 서서’로 γίνεσθε와 ἑδραῖοι를, ‘항상 주의 일에 더욱 힘쓰십시오’로 περισσεύοντες의 지속적 풍성함을 자연스러운 합쇼체로 반영했습니다. 마지막 참여절은 ‘아십시오’로 옮겨 원문의 연결 관계를 불필요하게 인과로 확정하지 않았습니다.
