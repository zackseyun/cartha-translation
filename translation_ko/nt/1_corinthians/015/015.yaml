revisions:
- from: 또한 우리는 하나님에 대한 거짓 증인으로 드러나게 됩니다. 우리가 하나님에 관하여 그분께서 메시아를 일으키셨다고 증언하였는데, 만일 죽은 자들이 일으킴을 받지 않는다면 하나님께서 그분을 일으키지 않으신 것이 되기 때문입니다.
  to: 더구나 우리는 하나님에 관한 거짓 증인으로 드러납니다. 우리가 하나님을 거슬러, 그분께서 메시아를 일으키셨다고 증언하였기 때문입니다. 만일 정말로 죽은 자들이 일으킴을 받지 않는다면, 하나님께서는 메시아를 일으키지 않으신 것입니다.
  rationale: The revision preserves the distinction between ‘false witnesses concerning God’ (τοῦ θεοῦ) and ‘testified against God’ (κατὰ τοῦ θεοῦ). It also makes the final referent explicit while maintaining the conditional argument and the source’s active/passive wording.
