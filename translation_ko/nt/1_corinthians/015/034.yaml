source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
  footnotes:
  - marker: a
    text: Or 'Come to your senses properly'; the verb literally evokes sobering up from drunkenness and is likely metaphorical here.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not sin' or 'stop sinning'; the present imperative may imply ongoing or habitual action.
    reason: lexical_alternative
translation:
  language: ko
  text: 정신을 똑바로 차리십시오[a]. 그리고 계속 죄를 짓지 마십시오[b]. 어떤 이들은 하나님에 관해 무지합니다. 내가 여러분을 부끄럽게 하려고 이 말을 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제정신을 차리십시오.’ 이 동사는 본래 술 취함에서 깨는 것을 가리키며, 여기서는 비유적으로 쓰인 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄를 짓지 마십시오’ 또는 ‘죄짓는 일을 그치십시오.’ 현재 명령법은 계속되거나 습관적인 행동을 염두에 둘 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  english_pob_choice: Come to your senses
  chosen_korean: 정신을 차리다
  alternatives_korean:
  - 깨어나다
  lexicon: BDAG
  rationale: ἐκνήφω는 「술에서 깨다」의 비유로, 한국어 「정신을 차리다」가 가장 자연스럽다.
