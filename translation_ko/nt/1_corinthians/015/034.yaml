- from: 올바로 정신을 차리고 죄를 짓지 마십시오. 어떤 이들은 하나님을 알지 못합니다. 내가 여러분을 부끄럽게 하려고 이 말을 합니다.
  to: 정신을 똑바로 차리십시오[a]. 그리고 계속 죄를 짓지 마십시오[b]. 어떤 이들은 하나님에 관해 무지합니다. 내가 여러분을 부끄럽게 하려고 이 말을 합니다.
