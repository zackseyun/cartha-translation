review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the main exhortation, but its rendering of ἀγνωσίαν θεοῦ as “하나님을 알지 못합니다” can suggest a relational failure to know God rather than the stated lack of knowledge concerning God. The present prohibition is better represented with an ongoing nuance where natural in Korean.
  naturalness: “올바로 정신을 차리고” is understandable but somewhat stiff. “정신을 똑바로 차리십시오” is idiomatic modern Korean and retains the metaphorical wake-up/sobering force. The revised wording maintains formal-polite 합쇼체.
  terminology: “하나님” is appropriate. “하나님에 관해 무지합니다” directly represents ἀγνωσίαν θεοῦ without importing a doctrinal or relational sense beyond the source.
  issues:
  - severity: medium
    issue: ‘하나님을 알지 못합니다’ may over-specify the kind of ignorance.
    rationale: ἀγνωσίαν θεοῦ denotes ignorance/lack of knowledge concerning God. In Korean, 하나님을 알다 can naturally carry relational or experiential connotations not required by the Greek.
  - severity: low
    issue: The ongoing force of μὴ ἁμαρτάνετε is not represented.
    rationale: ‘죄를 짓지 마십시오’ is possible, but ‘계속 죄를 짓지 마십시오’ more clearly conveys the present-imperative prohibition while remaining idiomatic.
  - severity: low
    issue: The source’s sobering-up image and δικαίως are somewhat flattened by ‘올바로 정신을 차리고.’
    rationale: ‘정신을 똑바로 차리십시오’ is more natural and preserves both the decisive call to clear-mindedness and the adverbial qualification.
