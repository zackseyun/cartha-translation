  verdict: revise
  source_fidelity: The draft correctly conveys καθημερινή death and identifies the boast as Paul’s, but it introduces «형제 여러분», which is absent from the Greek verse, and its explanatory wording («이는 … 두고 하는 말입니다») weakens νή, an oath-like particle.
  naturalness: The Korean is generally clear, but «이는 … 두고 하는 말입니다» is an indirect explanatory construction rather than the direct, emphatic assertion of the source. A concise oath formulation is more natural and faithful in modern formal Korean.
  terminology: «메시아 예수», «우리 주», and «자랑» are appropriate. «여러분에 대하여 가지고 있는 자랑» faithfully expresses Paul’s boast concerning/in the Corinthians while avoiding the misleading implication that it is their own self-boasting.
  issues:
  - severity: medium
    issue: Addition of «형제 여러분»
    rationale: ἀδελφοί does not occur in the SBLGNT text of 1 Corinthians 15:31. It should not be supplied.
  - severity: medium
    issue: The oath-like force of νή is diluted
    rationale: «이는 … 두고 하는 말입니다» merely explains the preceding statement. «…을 두고 맹세합니다» directly represents the Greek asseverative formula.
  revised_text: 나는 날마다 죽습니다. 우리 주 메시아 예수 안에서 내가 여러분에 대하여 가지고 있는 자랑을 두고 맹세합니다.[a]
