    text: 또는 “여러분의 자랑을 두고.” 그리스어 표현은 맹세 또는 단언의 형식이며, “여러분의 자랑”은 바울이 여러분에 대하여 가지고 있는 자랑을 뜻할 수도 있고 여러분 자신의 자랑을 뜻할 수도 있습니다.
    reason: alternative_reading
