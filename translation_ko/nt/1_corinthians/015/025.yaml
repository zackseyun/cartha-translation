  source_fidelity: 본문은 δεῖ γὰρ αὐτὸν βασιλεύειν을 ‘그분께서는 … 다스리셔야 하기 때문입니다’로 대체로 충실히 옮겼고, ἄχρι οὗ θῇ의 시간적 범위도 ‘두실 때까지’로 자연스럽게 보존했습니다. 다만 βασιλεύειν의 왕권적 의미를 더 분명히 하기 위해 ‘왕으로 다스리시다’가 적절합니다. ‘그분의 발 아래에’는 αὐτοῦ를 명시적으로 반영합니다.
  naturalness: 합쇼체 문장으로 자연스럽고, 앞 문맥을 받는 접속사 γάρ를 ‘… 때문입니다’로 무리 없이 표현합니다. ‘왕으로 다스리셔야’는 현대 표준 한국어에서 자연스럽고 원문의 왕적 통치 의미를 살립니다.
  terminology: ‘원수’, ‘발 아래에 두다’, ‘왕으로 다스리다’는 성경 문맥에 적합합니다. 기존 각주는 이 표현이 시편 110:1에서 ‘온’ 정형 표현이라고 단정하는 대신, 성경적 굴복/정복의 비유이며 시편 110:1을 참조한다는 방식으로 표현하는 것이 원문과 상호본문성을 더 정확하게 반영합니다.
