  to: 그분께서는 모든 원수를 그분의 발 아래에 두실 때까지 왕으로 다스리셔야 하기 때문입니다.[a]
  rationale: 왕권을 나타내는 βασιλεύειν을 ‘왕으로 다스리시다’로 명료하게 옮기고, αὐτοῦ를 ‘그분의’로 드러냈습니다. 시간 표현 ‘두실 때까지’는 헬라어가 그 이후 통치의 지속 또는 종료를 직접 결정하지 않는 점을 그대로 보존합니다. 각주는 시편 110:1과의 관련을 유지하되, 직접적인 문구 차용이라고 과도하게 단정하지 않도록 고쳤습니다.
