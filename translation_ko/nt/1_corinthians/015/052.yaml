  terminology: ‘마지막 나팔’, ‘죽은 이들’, ‘일으킴을 받다’, ‘변화되다’는 원문의 종말론적·부활 문맥을 과도하게 해석하지 않고 적절히 전달합니다. ‘우리’는 원문의 명시적 대명사와 대조를 보존합니다.
