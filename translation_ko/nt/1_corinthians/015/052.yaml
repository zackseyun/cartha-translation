    rationale: ἄφθαρτοι는 죽은 이들이 부패하지 않는 상태로 일으킴을 받는다는 뜻입니다. 현대 한국어로는 ‘썩지 않는 존재로’가 더 자연스럽고, 원문에 없는 ‘몸’을 추가하지 않습니다.
