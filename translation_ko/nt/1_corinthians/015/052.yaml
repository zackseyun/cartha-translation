  source_fidelity: 첫 문장의 시간 표현들은 원문의 강조된 병렬을 대체로 반영하지만, “그렇게 될 것입니다”은 원문에 없는 지시 내용을 보충합니다. 또한 σαλπίσει는 미래 진술인데 초안의 “나팔이 울리면”은 조건절로 바뀌어 있습니다. ἄφθαρτοι는 ‘썩지 않는’ 상태/존재로 일으킴을 받는다는 뜻을 자연스럽게 드러내야 합니다.
