    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에는, 그분께서 나라를 하나님 아버지께 넘겨드리시고 모든 통치와 모든 권세와 모든 능력을 폐하실 때에 끝[a]이 옵니다.
  philosophy: optimal-equivalence
  footnotes:
