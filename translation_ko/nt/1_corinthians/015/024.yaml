review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 καταργήσῃ의 ‘폐하다’와 βασιλεία의 ‘나라’를 적절히 반영하지만, 원문의 두 ὅταν 절이 ‘나라를 넘겨드리실 때’와 ‘모든 통치·권세·능력을 폐하실 때’를 함께 수식하는 구조를 더 직접적으로 드러내는 편이 좋습니다. 또한 πᾶσαν이 δύναμιν에도 반복되어 있으므로 ‘모든 능력’을 밝혀야 합니다.
  naturalness: ‘그 후에는 … 때에 끝이 옵니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 종말론적 시간 진행을 명료하게 나타냅니다. ‘하나님 아버지께 넘겨드리시고’는 공경 표현과 문맥상 주어에 잘 맞습니다.
  terminology: ‘끝’은 τέλος의 기본 의미를 보존하며, 각주에서 ‘완성’ 가능성을 안내할 수 있습니다. ‘통치, 권세, 능력’은 ἀρχή, ἐξουσία, δύναμις의 병렬을 추상적 권세들의 언어로 일관되게 옮깁니다. ‘폐하다’는 καταργέω를 존재론적 소멸로 단정하지 않고 효력의 폐지/종결로 표현합니다.
