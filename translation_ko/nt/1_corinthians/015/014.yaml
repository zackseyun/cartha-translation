  terminology: ‘메시아’ follows the project’s stipulated rendering. ‘선포’ suitably renders κήρυγμα, and ‘믿음’ suitably renders πίστις. ‘헛된 것’ expresses the lack-of-validity/substance denoted by κενός while maintaining the deliberate parallelism.
