  source_fidelity: 「살아 있는 혼」은 ψυχὴν ζῶσαν의 전통적 직역으로 가능하지만, 현대 한국어에서는 비물질적 ‘영혼’을 우선 연상시켜 창세기 인용의 ‘살아 있는 존재’라는 뜻을 좁힐 수 있습니다. 「살아 있는 존재」가 원문의 이 문맥상 의미를 더 정확히 전달합니다. πνεῦμα ζῳοποιοῦν은 「생명을 주는 영」으로 옮기는 것이 능동분사와 생명 부여의 뜻을 분명히 합니다.
  naturalness: 「이와 같이 기록되어 있습니다」는 성경 인용을 도입하는 γέγραπται를 현대 합쇼체로 자연스럽게 옮깁니다. 각주 표지를 해당 표현 바로 뒤에 배치하여 참조 관계도 분명하게 했습니다.
  terminology: 「마지막 아담」은 확립된 바울의 유형론적 표현을 보존합니다. 기존 각주의 「영적 실체」는 원문에 없는 형이상학적 해설이므로 삭제했습니다. πνεῦμα는 본문에서 「영」으로 유지하되, 각주에서 이를 성령과 한 위격으로 명시적으로 동일시하는 진술은 아니라는 점만 절제하여 밝혔습니다.
