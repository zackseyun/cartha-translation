translation:
  language: ko
  text: 그러나 먼저 있는 것은 영적인 것이 아니라 자연적인 것[a]이며, 그 다음에 영적인 것이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자연적인 것’은 그리스어 프쉬키콘(ψυχικόν)을 옮긴 것입니다. 이는 보통의 생명에 속한 것을 뜻하며, 문맥에서는 ‘영적인 것’과 대조됩니다. 여기에는 ‘몸’이라는 말이 원문에 명시되어 있지 않습니다.
    reason: lexical_alternative
