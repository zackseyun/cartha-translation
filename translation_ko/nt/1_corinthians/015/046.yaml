  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
  footnotes:
  - marker: a
    text: Or 'the natural body ... the spiritual body.' Paul omits the word 'body' here, though it is explicit in the surrounding context.
    reason: alternative_reading
  - marker: b
    text: '''Natural'' translates Greek psychikon, meaning what belongs to ordinary animate life; alternatively, more literally, ''soulish.'''
