  source_fidelity: 초안은 σῶμα를 ‘몸’으로 옮긴 점은 적절하지만, γυμνὸν의 ‘벌거벗은/그저’라는 대조적 뉘앙스와 εἰ τύχοι의 예시·개연성을 충분히 드러내지 못합니다. 또한 ‘곧’은 ‘아마/이를테면’의 뜻보다 단정적 동격에 가깝습니다.
  naturalness: ‘당신’은 현대 표준어의 성경 문맥에서 청자를 지칭할 때 어색하거나 대립적으로 들릴 수 있습니다. ‘여러분’이 현대 합쇼체에 자연스럽습니다. ‘알갱이 하나’는 자연스러우나 ‘그저’를 더해 원문의 대조를 살리는 편이 좋습니다.
  terminology: ‘몸’은 부활 논의의 핵심어 σῶμα에 충실합니다. γυμνὸν κόκκον은 과도하게 물리적 탈각을 뜻하는 표현 대신 ‘그저 알갱이 하나’로 옮겨, 장차 생겨날 몸과의 대비를 보존합니다.
  issues:
