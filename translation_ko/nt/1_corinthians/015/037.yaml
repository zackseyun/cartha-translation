  - severity: medium
    issue: εἰ τύχοι의 개연·예시 표현이 ‘곧’으로 단정화됨
    rationale: εἰ τύχοι는 ‘아마, 이를테면’의 의미이며, 밀을 확정적으로 동일시하는 ‘곧’과 다릅니다.
