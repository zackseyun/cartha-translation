  source_fidelity: 현 초안의 「모든 것을 자기에게 복종시키신 분」에서 「자기」는 한국어 문법상 대체로 ‘복종시키신 분’을 가리키므로, 원문의 αὐτῷ(아들께)를 잘못 지시하게 됩니다. 이를 명시적으로 바로잡아야 합니다. 「아들 자신도」는 αὐτὸς ὁ υἱός의 강조를 잘 살립니다. 마지막 πάντα ἐν πᾶσιν은 압축성과 범위를 유지하여 직역에 가까이 옮기는 것이 적절합니다.
  naturalness: 「복종되면」보다는 「복종하게 되면」이 현대 표준 한국어에서 더 자연스럽습니다. 「모든 것 안에서 모든 것이 되시기」는 다소 응축되어 있으나 원문의 의도적인 수사적 압축을 보존하며, 각주로 가능한 이해를 밝혀 독해를 도울 수 있습니다.
  terminology: 「아들」, 「하나님」, 「복종」은 본문의 관계와 격식을 적절히 반영합니다. 「만유」보다 반복되는 πᾶς 계열을 드러내는 「모든 것」을 본문에서 일관되게 사용합니다.
