  to: 그러나 하나님께서는 뜻하신 대로 그 씨에 몸을 주시고, 씨 하나하나에 그 씨 고유의 몸을 주십니다.
  rationale: 원문의 현재 시제, 하나님의 의지, 씨를 가리키는 단수 대명사, 그리고 각 씨에 고유한 몸을 주신다는 분배적 표현을 유지하되, 현대 표준 한국어 합쇼체에서 더 명료하고 자연스럽게 다듬었습니다. 영어 각주의 ‘각 씨’라는 분배적 가능성은 본문 번역에 이미 ‘씨 하나하나’로 충분히 반영되므로 별도 각주가 필요하지 않습니다.
