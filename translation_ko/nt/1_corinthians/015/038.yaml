review_pass:
  verdict: revise
  source_fidelity: 초안은 하나님이 뜻대로 씨에 몸을 주신다는 기본 의미를 잘 옮깁니다. 다만 αὐτῷ의 선행사가 문맥상 씨이므로 ‘그것에’보다 ‘그 씨에’가 더 분명하며, ἑκάστῳ와 ἴδιον의 개별성을 ‘씨 하나하나’와 ‘그 씨 고유의’로 드러내는 편이 적절합니다.
  naturalness: ‘그것에 자기 뜻대로’는 현대 한국어에서 지시 대상과 ‘자기’의 귀속이 순간적으로 불분명할 수 있습니다. ‘뜻하신 대로 그 씨에’ 및 ‘씨 하나하나에 그 씨 고유의’는 합쇼체 문체를 유지하면서도 자연스럽고 명확합니다.
  terminology: σῶμα는 이 장의 논의를 위해 일관되게 ‘몸’으로 유지했습니다. σπέρματα는 문맥상 ‘씨’로 옮겼고, ἴδιον은 단순한 종류의 차이로 축소하지 않고 각 씨에 속한 것이라는 뜻의 ‘고유의’로 옮겼습니다.
  issues:
  - severity: low
    issue: ‘그것에’의 지시 대상이 불분명함
    rationale: αὐτῷ는 앞 문맥의 씨를 가리키므로 ‘그 씨에’가 한국어 독자에게 더 명료합니다.
  - severity: low
    issue: ‘자기 뜻대로’의 귀속 가능성이 다소 모호함
    rationale: 주어가 하나님이기는 하나, ‘뜻하신 대로’가 하나님의 의지를 더 자연스럽고 직접적으로 나타냅니다.
  - severity: low
    issue: ‘각 씨에게 그 고유한’의 개별 소유 표현이 어색함
    rationale: ἑκάστῳ와 ἴδιον의 분배적·개별적 강조를 ‘씨 하나하나에 그 씨 고유의’로 명시하면 뜻과 한국어 어법이 모두 좋아집니다.
  revised_text: 그러나 하나님께서는 뜻하신 대로 그 씨에 몸을 주시고, 씨 하나하나에 그 씨 고유의 몸을 주십니다.
