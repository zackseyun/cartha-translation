  text: 그러나 하나님의 은혜로 나는 지금의 내가 되었으며, 내게 베푸신 그분의 은혜는 헛되지 않았습니다. 도리어 나는 그들 모두보다 더 수고하였습니다. 그러나 수고한 것은 내가 아니라, 나와 함께하신 하나님의 은혜였습니다.
