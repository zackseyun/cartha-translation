revisions:
- from: 내가 어린아이였을 때에는 어린아이처럼 말하였고, 어린아이처럼 생각하였고, 어린아이처럼 판단하였습니다. 그러나 어른이 되었을 때에는 어린아이의 것들을 버렸습니다.
  to: 내가 어린아이였을 때에는 어린아이처럼 말하였고, 어린아이처럼 생각하였고, 어린아이처럼 헤아렸습니다. 장성한 남자가 되었을 때에는 어린아이의 것들을 버렸습니다.
  rationale: The revision preserves the source's threefold rhetorical pattern, renders λογίζομαι with a Korean term for reflective reasoning, retains the masculine sense of ἀνήρ, and avoids adding an adversative not present in the Greek. No footnote is needed because the wording is clear and no unresolved textual ambiguity affects the translation.
