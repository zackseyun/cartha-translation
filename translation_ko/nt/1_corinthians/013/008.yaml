base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
  footnotes:
  - marker: a
    text: Or 'Love never falls' or 'Love never comes to an end.'
    reason: lexical_alternative
  - marker: b
    text: Or 'languages' for 'tongues.'
    reason: alternative_reading
  - marker: c
    text: The verb rendered 'will be set aside' is the same in both the 'prophecies' and 'knowledge' clauses.
    reason: cross_reference
translation:
  language: ko
  text: 사랑은 결코 실패하지 않습니다.[a] 그러나 예언은 폐지될 것이며,[c] 방언은 그칠 것이며,[b] 지식도 폐지될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「사랑은 결코 무너지지 않습니다」 또는 「사랑은 결코 끝나지 않습니다」.
    reason: lexical_alternative
  - marker: b
    text: 「방언」은 「언어」로도 옮길 수 있다.
    reason: alternative_reading
  - marker: c
    text: 「폐지될 것입니다」로 옮긴 동사는 예언과 지식에 관한 두 절에서 같은 그리스어 동사이다.
    reason: cross_reference
