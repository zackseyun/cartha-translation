  source_fidelity: 원문의 두 조건절(‘예언을 가지고 모든 비밀과 모든 지식을 알며’ / ‘산들을 옮길 만큼 모든 믿음을 가지고’)과 결론(‘사랑이 없으면 나는 아무것도 아니다’)을 충실히 옮겼습니다. ‘예언의 은사’는 고린도전서 12–14장의 은사 문맥에서 ἔχω προφητείαν의 소유 구문을 자연스럽게 드러내며, 의미를 부당하게 제한하지 않습니다.
