  source_fidelity: ‘쉽게 성내지 않으며’는 παροξύνεται에 없는 ‘쉽게’라는 강도를 보태므로 삭제해야 합니다. 또한 ‘잘못을 마음에 두지 않으며’는 문맥상 가능하지만 λογίζεται의 حساب/헤아림 비유를 충분히 드러내지 않습니다. ‘잘못을 헤아리지 않으며’는 단수 τὸ κακόν을 유지하면서도 그 비유와 관계적 의미를 자연스럽게 옮깁니다.
  naturalness: ‘품위 없게 행동하지 않으며, 자기 것을 구하지 않으며, 격분하지 않으며, 잘못을 헤아리지 않습니다’는 현대 표준어 합쇼체로 자연스럽고, 병렬 구조도 안정적입니다.
  terminology: ἀσχημονεῖ는 단순한 예의 문제보다 부적절하고 수치스러운 처신을 폭넓게 가리키므로 ‘품위 없게 행동하다’가 ‘무례하게 행동하다’보다 적절합니다. ζητεῖ τὰ ἑαυτῆς는 직역적으로 ‘자기 것을 구하다’로 두어 해석적 확장을 피했습니다. παροξύνεται는 ‘격분하다’로, 본문에 없는 ‘쉽게’를 첨가하지 않았습니다.
