  - severity: low
    issue: ‘잘못을 마음에 두지 않으며’가 회계적 비유를 약화함
    rationale: λογίζεται는 계산·셈·기록의 의미 영역을 지닙니다. ‘헤아리지 않다’는 자연스러운 한국어 안에서 이 의미를 더 잘 보존합니다.
