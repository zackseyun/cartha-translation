    rationale: γέγονα는 ‘나는 ... 되었습니다/된 것입니다’라는 완료의 결과 상태를 나타냅니다. 「뿐」은 ‘그저’라는 추가적 평가를 명시하므로 삭제하는 편이 충실합니다.
  - severity: low
    issue: γλῶσσα의 본문 선택과 각주가 다소 좁게 설정됨
    rationale: 「방언」은 가능하지만 한국어에서 의미가 협소하거나 교회 전통에 따라 특정 현상을 연상시킬 수 있습니다. 「언어」를 본문에 쓰고 「방언」 가능성을 각주에 남기면 원문의 어휘적 폭과 해석상 유보를 보존합니다.
