  to: 사랑은 모든 것을 감당하며[a], 모든 것을 믿으며[b], 모든 것을 소망하며, 모든 것을 인내합니다.
  rationale: στέγει는 ‘감당하다’로, ὑπομένει는 ‘인내하다’로 구별하여 원문의 병렬과 의미 차이를 한국어에서 살렸습니다. 반복되는 πάντα, 현재형의 성격 묘사, 그리고 πιστεύει의 의도적인 폭은 그대로 보존했습니다. 각주는 본문에 특정 해석을 강요하지 않고 가능한 어휘 대안을 제시합니다.
