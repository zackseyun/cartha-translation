    rationale: 두 그리스어 동사는 모두 인내의 영역에 속하지만 동일하지 않습니다. 현 번역은 한국어에서 동의어 병렬처럼 들려 수사적 점층과 στέγει의 ‘떠맡다/덮어 보호하다’라는 폭을 충분히 드러내지 못합니다.
