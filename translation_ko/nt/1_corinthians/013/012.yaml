translation:
  language: ko
  text: 지금 우리는 거울을 통해 수수께끼처럼[a] 봅니다. 그러나 그때에는 얼굴을 마주하여 보게 될 것입니다. 지금은 내가 부분적으로 압니다. 그러나 그때에는 내가 온전히 알려진 것처럼 온전히 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어렴풋이’. 그리스어는 더 직역하면 ‘수수께끼 안에서’ 또는 ‘수수께끼 같은 방식으로’라는 뜻으로, 간접적이고 난해한 인식을 나타냅니다.
    reason: lexical_alternative
