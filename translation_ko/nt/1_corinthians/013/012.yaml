  naturalness: ‘지금 우리는 … 봅니다/압니다’와 ‘그때에는 … 될 것입니다’의 대조는 현대 표준어 합쇼체로 자연스럽습니다. ‘얼굴을 마주하여 보게 될 것입니다’는 ‘얼굴과 얼굴을 마주 보게 될 것입니다’보다 자연스럽게 대면의 뜻을 전달합니다.
