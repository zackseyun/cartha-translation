review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 기존 「천사들을 심판할 줄을 알지 못합니까」는 ‘천사들을 심판하는 방법을 알지 못합니까’라는 뜻이 될 수 있어, 미래 직설법 κρινοῦμεν(‘우리가 심판할 것이다’)을 정확히 옮기지 못합니다. 「심판할 것임을」으로 고쳤습니다. μήτιγε βιωτικά는 더 큰 사실에서 통상적 현세의 일로 논증을 내리는 수사이므로 「하물며 이 세상 일들이야」가 이를 자연스럽게 살립니다.
  naturalness: 「이생의 일」은 이해할 수 있으나 현대 표준어에서는 다소 종교적·대조적인 뉘앙스를 띨 수 있습니다. 「이 세상 일들」은 βιωτικά가 가리키는 현세의 일상적·세속적 사안을 자연스럽고 넓게 표현합니다. 합쇼체의 수사 의문문도 유지했습니다.
  terminology: ἀγγέλους는 문맥상 「천사들」, κρίνω는 해석을 과도하게 좁히지 않는 「심판하다」로 유지했습니다. 천사 심판의 대상이나 방식은 본문이 명시하지 않으므로 보충하지 않았습니다.
  issues:
  - severity: high
    issue: 「심판할 줄을 알지 못합니까」의 의미 전환
    rationale: ‘-할 줄 알다’는 능력이나 방법을 안다는 뜻이므로, ‘우리가 천사들을 심판할 것이다’라는 미래 진술을 ‘심판할 줄 아는가’로 바꿉니다.
  - severity: low
    issue: 「이생의 일」의 현대적 어감
    rationale: 원문의 현세적·일상적 사안이라는 폭넓은 뜻을 유지하면서, 현대 한국어에서 더 자연스러운 「이 세상 일들」로 다듬는 편이 좋습니다.
  revised_text: 여러분은 우리가 천사들을 심판할 것임을 알지 못합니까? 하물며 이 세상 일들이야 더 말할 필요가 있겠습니까?
