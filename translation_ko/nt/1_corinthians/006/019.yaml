  source_fidelity: 수정이 필요합니다. 초안은 문두의 ἢ(수사적 전환, ‘아니면’)를 빠뜨렸고, ὅτι 이하의 세 진술을 하나의 ‘…것’ 구문으로 처리하면서 원문의 병렬 구조와 마지막 독립 진술(‘여러분은 여러분 자신의 것이 아닙니다’)을 약화합니다. 수정문은 단수 ‘몸’과 복수 ‘여러분’을 그대로 유지하고, 성령을 하나님께로부터 ‘받았다’는 의미와 소유 부정을 보존합니다.
  naturalness: ‘아니면 여러분은 … 알지 못합니까?’는 바울의 수사적 질문을 현대 표준 한국어 합쇼체로 자연스럽게 옮깁니다. ‘여러분 안에 계시는 성령’은 존칭과 문장 흐름에 모두 적절합니다.
  terminology: ‘성령’, ‘성전’, ‘하나님’은 한국어 성경 문체 및 신학 용어로 적절합니다. ‘여러분 자신의 것이 아닙니다’는 ἑαυτῶν의 소유·귀속 의미를 자연스럽고 과도한 해석 없이 전달합니다.
  issues:
  - severity: medium
    issue: 문두 ἢ의 수사적 전환이 누락됨
    rationale: ἢ는 앞선 논증에 이어지는 ‘아니면/혹은’의 전환을 표시합니다. 한국어 번역에서도 이를 드러내는 것이 원문 충실성에 더 가깝습니다.
  - severity: medium
    issue: 마지막 절을 ‘…것을 알지 못합니까?’의 종속 명사절로 처리함
    rationale: 원문은 ‘성전이다’, ‘하나님께로부터 가지고 있다’, ‘여러분 자신의 것이 아니다’를 병렬로 제시합니다. 초안의 명사화는 마지막 진술의 직접성과 병렬 관계를 흐립니다.
  revised_text: 아니면 여러분은 여러분의 몸이 여러분 안에 계시는 성령의 성전이며, 여러분이 그 성령을 하나님께로부터 받았고, 여러분은 여러분 자신의 것이 아니라는 것을 알지 못합니까?
  revised_footnotes: []
  revision_rationale: 문두의 수사적 ‘아니면’을 복원하고, ὅτι 이하의 내용을 한국어에서 자연스럽게 하나의 간접의문/인지 절로 유지하되 세 병렬 진술을 명확히 했습니다. 단수 ‘몸’은 그대로 두어 분배적·대표적 가능성을 해소하지 않았습니다. 본 절만의 종결 부호는 원문이 쉼표로 이어지지만, 한국어 독립 문장으로는 물음표를 사용했습니다.
