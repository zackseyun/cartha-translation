  lexicon: BDAG
  rationale: 본 절은 명시적 「거룩한 영」(πνεῦμα ἅγιον)으로 「성령」 사용이 적절(글로사리 기준).
- source_word: οὐκ ἐστὲ ἑαυτῶν
  english_pob_choice: you are not your own
  chosen_korean: 여러분 자신의 것이 아니라는
  alternatives_korean:
  - 여러분이 여러분의 소유가 아니라는
  lexicon: BDAG
  rationale: 속격의 소유 함의. 20절의 「값 주고 사신 바」로 연결.
