  text: 아니면 여러분은 여러분의 몸이 여러분 안에 계시는 성령의 성전이며, 여러분이 그 성령을 하나님께로부터 받았고, 여러분은 여러분 자신의 것이 아니라는 것을 알지 못합니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναὸς τοῦ … ἁγίου πνεύματός
  english_pob_choice: a temple of the Holy Spirit
