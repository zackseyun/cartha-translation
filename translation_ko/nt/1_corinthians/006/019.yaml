  source_fidelity: 수정안은 접속사 ἢ의 수사적 전환을 ‘아니면’으로 반영하고, 단수 ‘몸’과 복수 ‘여러분’을 유지합니다. 성령이 ‘여러분 안에’ 계시며 하나님께로부터 받으신 분이라는 두 수식 관계도 보존합니다.
  naturalness: 초안은 절 전체를 ‘…것’으로 명사화하여 문장이 무겁고, 문두의 ἢ가 빠져 있습니다. 수정안은 현대 표준어 합쇼체의 자연스러운 수사 의문문으로 정리합니다.
  terminology: ‘성령’, ‘성전’, ‘하나님’은 적절합니다. ‘여러분 자신의 것이 아니다’는 ἑαυτῶν의 소유·귀속 의미를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: 문두 접속사 ἢ가 번역에서 누락되었습니다.
    rationale: ἢ는 앞선 논증에 이어지는 수사적 대안을 도입합니다. ‘아니면’을 보충해야 원문의 논증 흐름이 보존됩니다.
  - severity: medium
    issue: 초안의 ‘…받았다는 것, 그리고 …아니라는 것을 알지 못합니까’ 구조는 원문의 두 서술을 과도하게 명사화하여 무겁습니다.
    rationale: 원문은 몸이 성전이라는 서술과 자신들의 소유가 아니라는 서술을 병렬로 제시합니다. 이를 직접 인용적 종속절로 옮기는 편이 자연스럽고 구조도 더 가깝습니다.
  revised_text: 아니면 여러분의 몸은 여러분 안에 계시고 여러분이 하나님께로부터 받은 성령의 성전이며, 여러분은 여러분 자신의 것이 아니라는 것을 알지 못합니까?
  revised_footnotes:
  - marker: a
    text: 그리스어는 ‘몸’을 단수로, ‘여러분의’를 복수로 씁니다. 이는 각 사람의 몸을 가리킬 수도 있고 공동체를 대표하여 가리킬 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 문두에 ‘아니면’을 더하여 ἢ를 반영하고, 원문의 두 병렬 진술을 한국어의 자연스러운 수사 의문문으로 재구성했습니다. ‘여러분의 몸’의 단수·복수 긴장은 본문에서 유지하고 각주로 설명했습니다.
