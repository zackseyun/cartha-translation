review_pass:
  verdict: revise
  source_fidelity: 초안은 πόρνη를 ‘창녀’로, σῶμα/σάρξ를 각각 ‘몸/육체’ 계열로 구별한 점과 창세기 인용을 보존한 점은 대체로 적절합니다. 그러나 문두의 접속사 ἢ(‘아니면/또는’)가 누락되어 바울의 수사적 논증 연결이 사라졌습니다. 또한 φησίν의 인용 도입을 한국어 본문에서 자연스럽게 드러내는 것이 좋습니다.
  naturalness: ‘창녀’는 현대 표준어 성경 문맥에서 낙인성이 강하고 다소 거칠게 들릴 수 있으므로, πόρνη의 직업적 의미를 유지하는 ‘매춘부’가 더 중립적이고 현대적인 표현입니다. ‘결합하는 사람’과 ‘한 몸이 된다’는 합쇼체 문맥에서 자연스럽습니다.
  terminology: πόρνη는 포괄적인 ‘음행하는 여자’가 아니라 ‘매춘부’로 옮겼습니다. σῶμα는 ‘몸’, 창세기 인용의 σάρξ는 관용적·상호본문적인 ‘육체’로 옮겨 두 표현을 구별했습니다. φησίν은 본문상 주어를 특정하지 않고 ‘그가 말하기를’으로 유지하며, 인용 출처는 각주로 밝혔습니다.
  issues:
  - severity: medium
    issue: 문두 ἢ의 번역 누락
    rationale: ἢ는 앞 절의 논증을 잇는 수사적 접속사입니다. 한국어에서는 ‘아니면’이 자연스럽게 그 기능을 보존합니다.
  - severity: low
    issue: ‘창녀’의 현대적 어감
    rationale: 원어의 ‘매춘부’라는 구체적 의미는 보존하되, 현대 공적 문체에서는 ‘매춘부’가 더 중립적입니다.
  - severity: low
    issue: 인용 도입 φησίν이 본문에서 드러나지 않음
    rationale: ‘그가 말하기를’으로 원문의 인용 도입을 반영하고, 주어를 ‘하나님’ 또는 ‘성경’으로 본문에서 과도하게 특정하지 않습니다.
  revised_text: 아니면 매춘부와 결합하는 사람이 그 여자와 한 몸이 된다는 것을 알지 못하십니까? 이는 그가 말하기를, “둘이 한 육체가 될 것이다”라고 하기 때문입니다.
  revised_footnotes:
  - marker: a
    text: '‘그가 말하기를’: 그리스어는 단수형 ‘그가 말한다’이며, 인용문은 창세기 2:24에서 온 것입니다.'
    reason: cross_reference
  revision_rationale: 문두의 수사적 접속사를 복원하고, πόρνη에 현대적이면서도 구체적인 직업 의미를 지닌 ‘매춘부’를 사용했습니다. ‘그 여자와’는 결합 상대를 한국어에서 자연스럽게 명시하지만, 원문의 관계적 의미를 넘어서지 않습니다. 창세기 인용의 ‘한 육체’는 본문의 ‘한 몸’과 구별하여 원문의 σάρξ/σῶμα 대비와 인용의 어휘를 보존했습니다.
