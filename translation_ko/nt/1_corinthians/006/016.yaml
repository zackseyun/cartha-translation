review_pass:
  verdict: revise
  source_fidelity: 현 초안은 πόρνη, κολλάομαι, ἓν σῶμα 및 창세기 인용의 핵심 의미를 대체로 반영합니다. 그러나 문두의 접속사 ἢ(“아니면/또는”)가 빠져 바울의 앞선 논증과의 수사적 연결이 누락되었습니다. 또한 φησίν의 인용 도입을 한국어 본문에서 드러내는 것이 좋습니다.
  naturalness: “결합하는 자”는 의미상 가능하지만 현대 표준어 합쇼체 본문에서는 “결합하는 사람이”가 더 자연스럽습니다. “창녀”는 πόρνη의 직접적 의미를 전달하지만 현대 한국어에서 강한 낙인성과 모욕적 어감을 지니므로, 본문에서는 중립적이고 현대적인 “매춘부”가 더 적절합니다.
  terminology: σῶμα는 “한 몸”, σάρξ는 창세기 인용의 관용적 표현인 “한 육체”로 구별한 것은 적절합니다. πόρνη는 일반적인 ‘음란한 여자’가 아니라 성매매를 하는 여성을 가리키므로 “매춘부”로 명시합니다. φησίν은 말하는 이의 정체를 본문에서 ‘하나님’이나 ‘성경’으로 단정하지 않고 인용 공식으로 처리합니다.
  issues:
  - severity: medium
    issue: 문두 ἢ가 번역에서 누락되었습니다.
    rationale: ἢ는 앞 절의 논증을 이어 주는 수사적 접속사이므로 “아니면”으로 반영해야 합니다.
  - severity: low
    issue: φησίν에 해당하는 인용 도입이 충분히 드러나지 않습니다.
    rationale: 단순히 인용문 뒤에 “하셨기 때문입니다”라고 하면 발화 주체를 불필요하게 높임말로 특정하는 인상이 있습니다. “말씀에 …라고 하였기 때문입니다”는 인용 공식의 기능을 자연스럽게 보존합니다.
  - severity: low
    issue: “결합하는 자”는 다소 문어적·고어적입니다.
    rationale: 현대 합쇼체에는 “결합하는 사람”이 더 자연스럽고 의미도 유지합니다.
  revised_text: 아니면 매춘부와 결합하는 사람이 그 여자와 한 몸이라는 것을 알지 못하십니까? 말씀에 “둘이 한 육체가 될 것이다”라고 하였기 때문입니다.
  revised_footnotes: []
  revision_rationale: 문두의 ἢ를 “아니면”으로 보완하고, 현대적 문체에 맞추어 “결합하는 사람”으로 다듬었습니다. πόρνη는 성매매를 하는 여성을 뜻하므로 “매춘부”로 옮겼습니다. σῶμα와 σάρξ는 각각 “한 몸”과 창세기 인용의 정형 표현인 “한 육체”로 구별했습니다. φησίν은 발화 주체를 교리적으로 특정하지 않는 인용 공식 “말씀에”로 처리했습니다.
