review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 「값으로 사신 바 되었습니다」는 수동태 원문의 의미는 의도하지만 한국어 문장으로는 행위 주체가 불분명하고 어색합니다. ἠγοράσθητε τιμῆς의 매매·대가 이미지는 「값을 치르고 사들여졌습니다」가 더 분명하고 자연스럽게 보존합니다.
  naturalness: 「여러분의 몸으로 하나님께 영광을 돌리십시오」는 현대 표준 한국어 합쇼체로 자연스럽습니다. 첫 문장만 관용적이지 않은 피동 구성 때문에 다듬을 필요가 있습니다.
  terminology: ἀγοράζω의 구매 은유를 유지하고, δοξάζω는 「영광을 돌리십시오」로 적절히 옮겼습니다. 「몸」은 문맥과 σῶμα에 충실합니다. 「그러므로」는 δή의 권면적 전환을 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: 「값으로 사신 바 되었습니다」의 비자연스러운 피동 표현
    rationale: 원문의 ἠγοράσθητε는 ‘여러분이 사들여졌다’라는 수동태입니다. 현 문구의 「사신 바」는 한국어에서 능동 관형사처럼 읽힐 여지가 있고, 「값으로」도 지불된 대가보다 수단으로 들릴 수 있습니다. 「값을 치르고 사들여졌습니다」는 구매와 대가의 관계를 명료하게 유지합니다.
  revised_text: 여러분은 값을 치르고 사들여졌습니다. 그러므로 여러분의 몸으로 하나님께 영광을 돌리십시오.
