  rationale: 접속사 ἢ를 ‘아니’로 반영하고, ἐν ὑμῖν을 문맥상 성도들의 심판 참여를 나타내는 ‘여러분에 의해’로 옮겼습니다. κριτήρια는 제도적 ‘법원’으로만 한정하지 않고 문맥에 맞게 ‘재판 사건들’로 번역했습니다. 심판의 구체적 방식에 관한 해석은 덧붙이지 않았습니다.
