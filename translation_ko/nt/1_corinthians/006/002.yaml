  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
  footnotes:
  - marker: a
    text: 'Or ''among you'': the Greek phrase can be read more literally as ''if the world is judged among you,'' but the sense in context is that the saints participate in judging the world.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the least important cases' for 'the smallest law courts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아니, 여러분은 성도들이 세상을 심판할 것을 알지 못합니까? 세상이 여러분에 의해 심판을 받는다면, 여러분이 지극히 작은 재판 사건들을 판단할 자격조차 없겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν κόσμον κρινοῦσιν
  english_pob_choice: will judge the world
  chosen_korean: 세상을 심판할
  alternatives_korean:
  - 세상을 재판할
  lexicon: BDAG
  rationale: 종말적 성도 심판권(단 7:22 호응).
- source_word: κριτηρίων ἐλαχίστων
  english_pob_choice: the smallest courts
  chosen_korean: 가장 작은 사건들
