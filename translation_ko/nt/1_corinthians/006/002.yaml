review_pass:
  verdict: revise
  source_fidelity: 첫 접속사 ἢ(논증을 이어 가는 ‘아니면/아니’)가 번역에서 빠졌습니다. 또한 ἐν ὑμῖν은 문맥상 성도들의 심판 참여를 가리키므로 ‘여러분에게서’보다 ‘여러분에 의해’가 자연스럽고 의미가 분명합니다. κριτηρίων은 여기서 작은 법적 분쟁 또는 재판 사건을 가리킬 수 있으므로 이를 명시하되, 법원이라는 제도적 의미로 과도하게 한정하지 않았습니다.
  naturalness: ‘세상이 여러분에게서 심판을 받겠거든’은 현대 표준어에서 어색하고 행위 주체가 불명확합니다. ‘여러분에 의해 심판을 받는다면’과 ‘판단할 자격조차 없겠습니까?’는 합쇼체의 수사 의문문으로 자연스럽습니다.
  terminology: ‘성도들’, ‘세상’, ‘심판’은 바울 서신의 통상적이며 적절한 용어입니다. κριτήριον의 문맥적 의미를 반영하여 ‘재판 사건들’로 옮겼으며, ἐλαχίστων의 강조는 ‘지극히 작은’으로 살렸습니다.
  issues:
  - severity: medium
    issue: ἢ에 해당하는 논증 연결 표현이 누락됨
    rationale: 본문은 앞 절의 논증을 이어 가는 수사적 대안을 ‘ἢ’로 시작합니다. 한국어에서도 ‘아니’로 반영하는 것이 원문의 논증 흐름에 충실합니다.
  - severity: medium
    issue: ‘여러분에게서 심판을 받겠거든’의 표현과 ἐν ὑμῖν 처리
    rationale: ‘에게서’는 심판의 주체 또는 참여자를 자연스럽게 드러내지 못합니다. 문맥상 성도들이 심판에 참여한다는 뜻을 ‘여러분에 의해’로 명료하게 나타낼 수 있습니다.
  - severity: low
    issue: ‘가장 작은 사건들에 관해서도 자격이 없겠습니까?’의 결합이 다소 부자연스러움
    rationale: κριτήρια는 이 문맥에서 판단·처리해야 할 법적 분쟁을 가리킬 수 있습니다. ‘지극히 작은 재판 사건들을 판단할 자격’이 원문의 수사적 대비를 더 자연스럽게 전달합니다.
  revised_text: 아니, 여러분은 성도들이 세상을 심판할 것을 알지 못합니까? 세상이 여러분에 의해 심판을 받는다면, 여러분이 지극히 작은 재판 사건들을 판단할 자격조차 없겠습니까?
