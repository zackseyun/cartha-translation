source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
  footnotes:
  - marker: a
    text: Or 'before the unbelievers.' The phrase likely refers to secular courts staffed by those outside the church, but the Greek says simply 'before unbelievers.'
    reason: lexical_alternative
  - marker: b
    text: The repeated 'brother' refers to fellow members of the Christian community.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 형제[b]가 형제를 상대로 소송을 벌이고, 그것도 믿지 않는 사람들[a] 앞에서 합니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “믿지 않는 이들 앞에서.” 이 표현은 교회 밖의 세속 법정을 가리킬 가능성이 크지만, 헬라어 본문은 단지 “믿지 않는 사람들 앞에서”라고만 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 반복되는 “형제”는 그리스도인 공동체의 동료 구성원을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται
  english_pob_choice: brother goes to court against brother
  chosen_korean: 형제가 형제를 상대로 재판하고
