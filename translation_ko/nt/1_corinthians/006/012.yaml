translation:
  language: ko
  text: “모든 것이 내게 허용된다.”[a] 그러나 모든 것이 유익한 것은 아닙니다.[b] “모든 것이 내게 허용된다.” 그러나 나는 어떤 것에도 지배받지 않겠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 인용부호 없이: 모든 것이 내게 허용된다. 많은 이들은 이 말을 바울이 인용하고 이어서 제한하는 고린도 교회 사람들의 표어로 이해합니다.'
    reason: alternative_reading
  - marker: b
    text: ‘유익한’은 ‘도움이 되는’ 또는 ‘유용한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나는 어떤 것의 권세 아래에도 들어가지 않겠습니다.’
    reason: lexical_alternative
