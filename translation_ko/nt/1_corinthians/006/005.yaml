  source_fidelity: 초안은 πρὸς ἐντροπὴν ὑμῖν의 책망 목적과 공동체 안에서 지혜로운 사람이 분쟁을 판단할 수 있는지를 묻는 수사적 질문을 대체로 충실히 옮겼습니다. 그러나 διακρῖναι ἀνὰ μέσον은 이 문맥에서 단순한 식별인 ‘분별하다’보다 당사자들 사이의 사안을 ‘판단하다’라는 뜻이 더 분명합니다. 또한 ‘형제들 사이를 분별하다’는 한국어 결합이 부자연스럽고 목적어가 불명확합니다.
  naturalness: ‘여러분을 부끄럽게 하려고 이렇게 말합니다’는 자연스럽지만, ‘이것을 말합니다’로 하여 직전 논의를 가리키는 대상을 명료하게 할 수 있습니다. ‘그렇다면’은 οὕτως가 이끄는 질책성 수사 질문의 추론을 자연스럽게 드러냅니다.
