  lexicon: BDAG
  rationale: 2:6의 동일 어근.
- source_word: τὸ σῶμα … τῷ κυρίῳ
  english_pob_choice: the body … for the Lord
  chosen_korean: 몸은 … 주를 위한 것
  alternatives_korean:
  - 몸은 … 주께 속한 것
  lexicon: BDAG
  rationale: 여격을 「~을 위함」으로.
