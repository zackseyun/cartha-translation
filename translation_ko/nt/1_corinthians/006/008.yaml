  verdict: revise
  source_fidelity: The draft correctly recognizes the emphatic subject (ὑμεῖς) and the two present-tense actions. However, the connective '-으니' changes the coordinated accusations into a causal sequence, and '그것도 형제들에게 그렇게 합니다' is syntactically awkward and weakens the emphatic force of καὶ τοῦτο. The revision preserves the direct accusation, the ongoing present tense, and the climactic application to fellow believers.
  naturalness: '''그러나 여러분 자신이 불의를 행하고 빼앗으니, 그것도 형제들에게 그렇게 합니다'' is not natural modern formal Korean: ''그렇게 합니다'' redundantly repeats the preceding actions, while ''-으니'' does not fit the Greek coordination. Two short formal sentences communicate the rebuke naturally.'
  terminology: '''불의를 행하다'' suitably renders ἀδικεῖτε. ''속여 빼앗다'' naturally conveys ἀποστερεῖτε in this legal/economic context without escalating it to violent robbery. ''형제들'' retains the source''s masculine plural wording; the footnote explains its likely broader ecclesial reference.'
  issues:
  - severity: medium
    issue: The causal connective '-으니' does not represent the Greek coordination.
    rationale: ἀδικεῖτε καὶ ἀποστερεῖτε presents two coordinated present-tense accusations, not a cause-and-result relation.
  - severity: medium
    issue: The rendering of καὶ τοῦτο is awkward and rhetorically diluted.
    rationale: '''그것도 형제들에게 그렇게 합니다'' adds a redundant verb phrase and fails to convey the climactic ''and this [to] brothers.'''
  - severity: low
    issue: The existing lexical choice for ἀποστερεῖτε is underspecified in Korean.
    rationale: '''빼앗습니다'' can work, but ''속여 빼앗습니다'' more clearly conveys defrauding/depriving in the immediate dispute context.'
  - severity: low
    issue: The gender/contextual clarification present in the English audit trail lacks a Korean footnote anchor.
    rationale: A brief note preserves the lexical form in the text while clarifying that the referent may include the wider community of believers.
