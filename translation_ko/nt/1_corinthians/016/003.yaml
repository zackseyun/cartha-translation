review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Paul’s future arrival, the Corinthians’ approval of delegates, the accompanying letters, the transport of the gift, and Jerusalem as destination. However, 인정한 presents the approval as completed, whereas the Greek ἐὰν δοκιμάσητε refers prospectively to those whom the readers will approve. The contextual sense of χάρις is a contribution rather than an ordinary personal present.
  naturalness: The sentence is generally clear and appropriately formal. Replacing 인정한 with 인정할 better matches both the future contingency and natural Korean phrasing. 기부금 is more precise than 선물 in this collection context while remaining modern and non-denominational.
  terminology: 인정할 preserves the evaluative/approving sense of δοκιμάζω without overtranslating it as election. 기부금 accurately renders χάρις as the material contribution in the immediate context. 편지와 함께 appropriately reflects δι’ ἐπιστολῶν without specifying letters of recommendation.
  issues:
  - severity: medium
    issue: 인정한 사람들
    rationale: 'The past adnominal form implies that approval has already occurred. The Greek indefinite relative construction with ἐὰν plus aorist subjunctive is prospective: those whom the Corinthians will approve.'
  - severity: low
    issue: 여러분의 선물
    rationale: Although understandable, 선물 commonly suggests a personal present. In this context of the Jerusalem collection, 기부금 more clearly communicates the intended charitable contribution.
  revised_text: 제가 도착하면, 여러분이 인정할 사람들을 편지와 함께 보내어 여러분의 기부금을 예루살렘으로 가져가게 하겠습니다.
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek syntax and purpose relation while correcting the temporal force of the approval clause and clarifying that χάρις denotes the Corinthians’ contribution for Jerusalem.
