review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands the recurring weekly setting, individual participation, proportionate giving, and the purpose of avoiding collections at Paul's arrival. However, "자기 곁에" is an unnatural and misleadingly spatial rendering of παρ’ ἑαυτῷ. The phrase is best rendered idiomatically as each person setting funds aside, with its possible private/at-home nuance retained in a note. "내가 갈 때에야" also adds an unnecessary restrictive nuance not conveyed by τότε.
  naturalness: '"매주 첫날에" and "각자 따로 떼어 모아 두십시오" are natural modern formal Korean. "그렇게 하면 내가 왔을 때에 연보를 거두는 일이 없을 것입니다" clearly expresses the purpose clause without awkwardness.'
  terminology: '"연보" is an established Korean biblical term for λογεῖαι in this context and is suitable in a formal Bible translation. "형편이 되는 대로" naturally conveys giving in accordance with one''s prosperity without claiming a specific source of income.'
  issues:
  - severity: medium
    issue: '"자기 곁에" is unnatural and overly spatial for παρ’ ἑαυτῷ.'
    rationale: The Greek can mean "by/with oneself" and has often been understood as private setting aside, possibly at home. Korean "자기 곁에" normally denotes physical proximity and does not naturally describe saving money.
  - severity: low
    issue: '"내가 갈 때에야" introduces a restrictive/emphatic sense.'
    rationale: The Greek τότε means "then" in the temporal setting of Paul's arrival; it does not mean that collections happen only at that time. A purpose expression referring simply to his arrival is more faithful.
  revised_text: 매주 첫날에 여러분 각자는[a] 형편이 되는 대로 따로 떼어 모아 두십시오. 그렇게 하면 내가 왔을 때에 연보를 거두는 일이 없을 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 "각자 자기에게" 또는 "각자 자기 곁에"입니다. 이는 각 사람이 개인적으로 따로 떼어 두라는 뜻일 수 있으며, 집에 보관하라는 뜻으로 이해되기도 합니다.
    reason: lexical_alternative
  revision_rationale: The revision replaces the unnatural spatial wording with idiomatic Korean that preserves the instruction to set aside and accumulate funds individually. A footnote retains the lexical and interpretive ambiguity of παρ’ ἑαυτῷ. The final clause is adjusted to express the intended prevention of collections upon Paul's arrival without adding restrictive emphasis.
