revisions:
- from: 매 주의 첫날에 여러분 각자는 형편이 허락하는 대로 무엇이든 자기 곁에 따로 모아 두십시오. 그래야 내가 갈 때에야 연보를 거두지 않게 됩니다.
  to: 매주 첫날에 여러분 각자는[a] 형편이 되는 대로 따로 떼어 모아 두십시오. 그렇게 하면 내가 왔을 때에 연보를 거두는 일이 없을 것입니다.
