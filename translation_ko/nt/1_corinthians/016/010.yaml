source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: Now if Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
  footnotes:
  - marker: a
    text: Or 'see that he may be among you without fear.' The Greek expression can emphasize Timothy’s being present among them in a state free from fear.
    reason: lexical_alternative
  - marker: b
    text: Or 'for he works the work of the Lord, as I also do.'
    reason: lexical_alternative
translation:
  language: ko
  text: 디모데가 오거든[a], 그가 여러분과 함께 있을 때 두려움이 없도록 살펴 주십시오. 그는 나도 하는 주의 일을 하고 있기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 여러분 가운데 두려움 없이 있을 수 있도록 살펴 주십시오.” 그리스어 표현은 디모데가 그들 가운데 두려움 없는 상태로 있는 것을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그는 주의 일을 합니다. 나도 그러합니다.”
    reason: lexical_alternative
