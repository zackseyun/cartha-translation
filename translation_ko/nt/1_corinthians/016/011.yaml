  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 προπέμψατε의 여행을 위한 배웅·지원의 뉘앙스와 ἵνα의 목적 관계는 ‘평안히 보내어 그가 내게 오게 하십시오’보다 ‘평안히 떠나 내게 올 수 있도록 보내 주십시오’에서 더 자연스럽고 분명하게 드러납니다. 마지막 문장은 μετὰ τῶν ἀδελφῶν을 바울이 형제들과 함께 기다리는 것으로 옮긴 것으로 가능하며, 이를 유지합니다.
  naturalness: ‘그가 내게 오게 하십시오’는 현대 한국어에서 다소 부자연스럽고 명령의 대상이 바뀌는 듯 들릴 수 있습니다. ‘그가 평안히 떠나 내게 올 수 있도록 보내 주십시오’가 합쇼체 문맥에서 자연스럽습니다.
  terminology: ἐξουθενήσῃ는 ‘업신여기다’가 적절합니다. ἀδελφῶν은 본문에서 ‘형제들’로 보존하고, 그 집단의 범위가 문맥상 동료 신자 또는 동역자들을 포함할 수 있음을 각주로 밝혀 원문의 가능한 포괄성을 보존합니다.
