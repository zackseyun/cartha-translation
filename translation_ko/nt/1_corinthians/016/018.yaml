  naturalness: '''나의 영과 여러분의 영을 쉬게 해 주었습니다'' is understandable but somewhat stiff and semantically awkward in contemporary Korean. ''나의 영과 여러분의 영에 새 힘을 주었습니다'' is natural while preserving Paul''s inward-person idiom. ''인정하십시오'' clearly conveys the requested recognition without implying mere acquaintance.'
  terminology: '''영'' appropriately renders πνεῦμα here as the inward spirit, not the Holy Spirit. ''그러한 이들'' is idiomatic Korean; the accompanying note preserves that the Greek masculine form refers in context to the named male coworkers.'
