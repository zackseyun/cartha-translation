  terminology: ‘복종하다’는 이 문맥에서 ὑποτάσσω의 강도를 유지합니다. ‘그런 이들’은 앞절에서 언급된 사람들과 같은 부류를 가리키는 τοῖς τοιούτοις를 자연스럽게 옮깁니다. ‘모든 이들’은 παντί의 포괄성을 유지합니다.
