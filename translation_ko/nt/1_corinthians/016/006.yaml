  source_fidelity: 초안은 παραχειμάσω를 ‘겨울을 보내다’로 적절히 옮겼고, 전체 여행 계획의 의미도 대체로 보존합니다. 그러나 ἵνα가 이끄는 목적절을 ‘...주기를 바랍니다’로 번역하여 바울의 바람/소원으로 다소 바꾸었습니다. 목적을 나타내도록 고쳤습니다. 또한 οὗ ἐὰν πορεύωμαι의 미정적 미래 뉘앙스는 ‘어디로 가게 되든지’로 반영했습니다.
