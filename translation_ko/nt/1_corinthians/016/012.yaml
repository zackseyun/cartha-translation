- from: 우리 형제 아볼로에 관하여는, 내가 그에게 형제들과 함께 여러분에게 가도록 강력히 권하였으나, 그가 지금 가는 것은 결코 뜻에 맞지 않았습니다. 그러나 기회가 되면 그가 갈 것입니다.
  to: 우리 형제 아볼로에 관해서는, 내가 그에게 형제들과 함께 여러분에게 가도록 여러 번 권했습니다. 그러나 그가 지금 가는 것은 결코 그의 뜻이 아니었습니다. 그는 기회가 생기면 갈 것입니다.
  rationale: 아볼로가 현재 방문할 의향이 없었다는 원문의 분명한 주체와 뜻을 ‘그의 뜻이 아니었습니다’로 밝혔습니다. 또한 πολλὰ의 강도를 ‘여러 번’으로 반영했습니다. 다른 표현은 원문의 이동 방향, 동행자, 미래의 방문 및 적절한 기회의 조건을 유지합니다.
