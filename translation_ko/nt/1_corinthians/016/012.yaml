  text: 우리 형제 아볼로에 관해서는, 내가 그에게 형제들과 함께 여러분에게 가도록 여러 번 권했습니다. 그러나 그가 지금 가는 것은 결코 그의 뜻이 아니었습니다. 그는 기회가 생기면 갈 것입니다.
