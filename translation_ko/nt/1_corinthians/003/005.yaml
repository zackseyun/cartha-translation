revisions:
- from: 그러면 아볼로는 무엇이고 바울은 무엇입니까? 주께서 각자에게 주신 대로, 여러분이 그들을 통하여 믿게 된 일꾼들입니다.
  to: 그러면 아볼로는 무엇이고 바울은 무엇입니까? 주께서 각각에게 주신 대로 여러분이 믿게 된 일꾼들입니다.
  rationale: 중성 의문사 τί의 역할 중심 질문을 「무엇입니까」로 유지하고, διάκονοι는 직제 용어를 피하여 「일꾼들」로 옮겼습니다. δι’ ὧν의 대상을 본문에서 추가 명시하지 않아 원문의 간결함을 보존했습니다. 마지막 절은 ‘주신’의 목적어를 보충하지 않고 원문의 타원성을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:37:10Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영했으나, 「여러분이 그들을 통하여 믿게 된」은 δι’ ὧν의 복수 관계대명사가 가리키는 아볼로와 바울을 한국어에서 명시적으로 보완한 것입니다. 또한 주어-서술 관계가 다소 풀어져 있어, 원문의 간결한 병렬과 마지막 절의 생략을 더 직접적으로 살릴 수 있습니다.
  naturalness: 초안은 이해 가능하지만, 「주께서 각자에게 주신 대로, 여러분이 그들을 통하여 믿게 된 일꾼들입니다」는 수식 범위와 ‘주신’의 생략된 목적어가 다소 불분명하게 느껴질 수 있습니다. 「주께서 각각에게 주신 대로 여러분이 믿게 된 일꾼들입니다」가 더 자연스럽고 원문의 어순 및 생략을 잘 보존합니다.
  terminology: 「아볼로」, 「바울」, 「주」는 적절합니다. διάκονοι를 직분명인 「집사」가 아니라 일반적인 「일꾼들」로 옮긴 것도 문맥에 맞습니다. 다만 원문은 복수 관계대명사만으로 대상을 지시하므로 「그들을」을 본문에서 명시하지 않는 편이 더 절제되어 있습니다.
  issues:
  - severity: low
    issue: 「그들을」의 명시
    rationale: δι’ ὧν은 복수형으로 앞의 아볼로와 바울을 가리키지만, 한국어 본문에서 이를 명시하면 원문의 간결한 지시를 약간 해설적으로 풀게 됩니다. 생략해도 뜻이 분명합니다.
  - severity: low
    issue: 마지막 절의 연결과 생략 보존
    rationale: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν은 ‘주께서 각각에게 주신 대로’라는 타원 표현입니다. 이를 ‘일꾼들’에 직접 이어 원문의 압축성과 목적어 미표시를 유지하는 편이 좋습니다.
  revised_text: 그러면 아볼로는 무엇이고 바울은 무엇입니까? 주께서 각각에게 주신 대로 여러분이 믿게 된 일꾼들입니다.
