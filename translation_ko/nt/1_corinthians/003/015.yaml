review_pass:
  verdict: revise
  source_fidelity: ‘불타 없어지면’ and ‘손실을 당할 것입니다’ substantially convey κατακαήσεται and ζημιωθήσεται. However, ‘불 가운데서 빠져나오듯’ adds an explicit escape sense that διὰ πυρός (‘through fire’) does not state and that the English audit trail deliberately leaves unresolved. ‘그렇게 될 것입니다’ is also an unclear and unnecessarily expanded rendering of the final clause.
  naturalness: The draft is generally intelligible in modern formal Korean, but the final wording is awkwardly redundant. ‘불을 통과하듯 구원을 받을 것입니다’ is natural, concise, and maintains the metaphor.
  terminology: ‘구원을 받을 것입니다’ appropriately renders σωθήσεται and retains the theological term without doctrinal elaboration. ‘손해를 입을 것입니다’ is a natural Korean equivalent for ‘will suffer loss.’
  issues:
  - severity: medium
    issue: The phrase ‘불 가운데서 빠져나오듯’ specifies escape.
    rationale: The Greek says ‘as through fire,’ not explicitly ‘as escaping from amid fire.’ The added escape image narrows a disputed metaphorical expression and goes beyond both the source and the English POB’s noninterpretive rendering.
  - severity: low
    issue: The phrase ‘그렇게 될 것입니다’ is unclear and overtranslates the closing construction.
    rationale: It does not clearly attach the fire image to the person’s being saved. Recasting the clause to modify ‘구원을 받을 것입니다’ gives a direct, idiomatic Korean rendering.
  - severity: low
    issue: The inherited lexical-alternative note has no visible anchor in the Korean text.
    rationale: A marker after the final clause makes the note structurally usable and identifies exactly which expression it qualifies.
  revised_text: 누구든지 그 일이 불타 버리면, 그는 손해를 입을 것입니다. 그러나 그 자신은 구원을 받되, 불을 통과하듯 구원을 받을 것입니다.[a]
  revised_footnotes:
