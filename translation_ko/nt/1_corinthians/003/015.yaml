    reason: The final Greek expression is metaphorical and can be construed with slightly different emphasis. This alternative preserves the wording’s ambiguity without adding the idea of escaping or a particular doctrinal interpretation.
  revision_rationale: The revision retains the conditional structure, the contrast between the destruction of the work and the salvation of the person, and the emphatic ‘그 자신.’ It removes the added ‘escape’ interpretation, rendering the final image more literally as passage through fire. The footnote is anchored and offers only a syntactic/stylistic alternative, not an interpretive expansion.
