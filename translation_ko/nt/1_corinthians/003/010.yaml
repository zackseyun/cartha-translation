translation:
  language: ko
  text: 하나님께서 내게 주신 은혜에 따라, 나는 지혜로운 건축 책임자처럼 기초를 놓았습니다. 그리고 다른 사람은 그 위에 세웁니다. 그러나 각 사람은 자신이 어떻게 세우는지 주의해야 합니다.
  philosophy: optimal-equivalence
