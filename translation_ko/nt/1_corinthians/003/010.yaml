review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys God's grace given to Paul, Paul's laying of a foundation, another's building upon it, and the warning that every individual must attend carefully to their own building. A revision is warranted because ἀρχιτέκτων denotes a master or supervising builder rather than primarily a modern building designer, and the sentence mixes informal/plain and formal-polite endings.
  naturalness: The construction is generally clear, but “건축가처럼” can suggest a design professional rather than the construction-leading role in the metaphor. “놓았고” alongside “세웁니다” and “조심해야 합니다” is an inconsistent register. The revised wording is natural modern Korean in consistent 합쇼체.
  terminology: “건축 책임자” better reflects ἀρχιτέκτων’s supervisory/master-builder sense. “기초를 놓다” is a standard Korean construction metaphor for θεμέλιον ἔθηκα. “주의해야 합니다” naturally conveys the imperative βλεπέτω without weakening its continuing call for care.
  issues:
  - severity: medium
    issue: Register is inconsistent.
    rationale: “내가 터를 놓았고” uses a plain connective ending, whereas “세웁니다” and “조심해야 합니다” use formal-polite endings. The target requires modern formal-polite 합쇼체.
  - severity: low
    issue: “건축가” incompletely represents ἀρχιτέκτων.
    rationale: In this context ἀρχιτέκτων is a master/chief builder overseeing construction. “건축 책임자” better preserves this role in Korean.
  - severity: low
    issue: The second “그 위에” is unnecessarily repeated.
    rationale: The foundation remains clear from the preceding clause, and omitting the repeated phrase produces a smoother Korean rendering while preserving the implied object of ἐποικοδομεῖ.
  revised_text: 하나님께서 내게 주신 은혜에 따라, 나는 지혜로운 건축 책임자처럼 기초를 놓았습니다. 그리고 다른 사람은 그 위에 세웁니다. 그러나 각 사람은 자신이 어떻게 세우는지 주의해야 합니다.
  revised_footnotes: []
  revision_rationale: The revision retains the source’s metaphor, verbal sequence, and distributive warning while using a more source-precise rendering for the master-builder role, natural Korean construction terminology, and consistent modern formal-polite register. No footnote is needed, since the translation does not introduce or resolve a textual ambiguity.
