  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τὸν κείμενον은 단지 과거에 ‘놓인’ 기초라기보다 현재 놓여/자리 잡고 있는 기초를 가리키므로 ‘이미 놓여 있는’이 그 상태성을 더 잘 드러냅니다. παρά는 ‘외에’로 자연스럽게 배타성을 나타냅니다.
  naturalness: ‘터’도 가능한 말이지만, 바울의 건축 비유와 현대 한국어 성경 문체에서는 ‘기초’가 더 분명하고 자연스럽습니다. 또한 예수를 가리킬 때 합쇼체의 높임 표현인 ‘이십니다’를 쓰는 것이 적절합니다.
  terminology: θεμέλιον은 ‘기초’로, Ἰησοῦς Χριστός의 Χριστός는 프로젝트 방침에 따라 ‘메시아’로 옮겼습니다. ‘예수 메시아’는 원문의 이름+칭호 결합을 보존하며, ‘예수 메시아이십니다’는 그 인물을 높이는 자연스러운 서술입니다.
  issues:
