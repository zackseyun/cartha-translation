    issue: ‘터’는 건축 비유의 핵심어로는 다소 넓고 구어적인 표현입니다.
    rationale: θεμέλιον은 건물의 기초를 뜻하므로 ‘기초’가 더 정확하고, 이어지는 문맥의 건축 은유와도 일관됩니다.
  - severity: low
    issue: ‘이미 놓인’은 κείμενον의 현재적·정착된 상태를 충분히 드러내지 못합니다.
    rationale: ‘이미 놓여 있는’은 이미 마련되어 현재 존재하는 기초라는 뜻을 자연스럽게 전달합니다.
