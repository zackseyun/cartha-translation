  source_fidelity: 초안은 σαρκικοί, ζῆλος καὶ ἔρις, κατὰ ἄνθρωπον περιπατεῖτε의 주요 어휘를 대체로 충실히 반영합니다. 그러나 둘째 절의 주어가 그리스어의 복수 2인칭(‘여러분’)에서 단수 지시어 ‘그것’으로 바뀌어, 바울이 독자들을 향해 던지는 수사 의문문의 구조와 의미가 훼손됩니다.
  naturalness: ‘육적’은 한국어에서 다소 압축적이고 명사적으로 들릴 수 있으므로, 사람을 가리키는 술어임을 드러내는 ‘육적인 사람들’이 현대 표준어 문장에서는 더 자연스럽고 명료합니다. ‘사람을 따라 행하다’는 직역적 비유를 보존하면서도 합쇼체 문맥에서 이해 가능합니다.
  terminology: ‘육적인 사람들’은 σαρκικοί의 σάρξ 계열 어휘를 보존하며, ‘세속적’이나 ‘죄성에 지배된’ 같은 해석적 대체를 피합니다. ‘시기와 다툼’ 및 ‘행하다’도 적절합니다. κατὰ ἄνθρωπον의 관용적 대안을 각주로 제시하여 본문의 긴장을 보존합니다.
  issues:
  - severity: high
    issue: 둘째 절에서 ‘그것이 육적이고’라고 하여 주어가 바뀜
    rationale: 원문은 ‘여러분이 육적인 사람들이며 사람을 따라 행하고 있는 것이 아니냐’라는 복수 2인칭 수사 의문문입니다. 시기와 다툼 자체를 ‘육적’이라고 진술하는 방식은 문법적 주어와 바울의 직접적인 책망 대상을 바꿉니다.
  - severity: low
    issue: κατὰ ἄνθρωπον의 관용적 의미를 안내하는 각주가 없음
    rationale: 본문의 ‘사람을 따라’는 원문의 형식을 보존하지만 한국어에서는 다소 낯설 수 있습니다. ‘단지 인간적인 방식으로’라는 대안을 각주로 제시하면 의미를 과도하게 본문에서 해설하지 않으면서 독해를 돕습니다.
  revised_text: 여러분은 아직도 육적인 사람들이기 때문입니다. 여러분 가운데 시기와 다툼이 있으니, 여러분은 육적인 사람들이며 사람을 따라 행하고 있는 것이 아니겠습니까?ᵃ
  revised_footnotes:
  - marker: a
    text: 또는 “단지 인간적인 방식으로 살아가고 있는 것.”
    reason: κατὰ ἄνθρωπον περιπατεῖτε의 관용적·해석적 대안을 제시한다. 본문은 ‘사람을 따라 행하다’로 원문의 표현과 바울의 ‘행하다’ 비유를 보존한다.
  revision_rationale: 원문의 두 차례 σαρκικοί가 모두 독자들(복수 2인칭)을 서술한다는 점을 복원했습니다. ‘아직도’는 ἔτι를, ‘때문입니다/있으니’는 두 γάρ의 설명적 연결을, ‘아니겠습니까?’는 긍정의 답을 예상하는 οὐχί 수사 의문을 반영합니다. ‘육적인 사람들’은 육체/육신 언어를 유지하되 한국어 문장 안에서 대상이 사람임을 분명히 합니다.
