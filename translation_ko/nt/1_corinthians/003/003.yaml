review_pass:
  verdict: revise
  source_fidelity: 초안은 ζῆλος καὶ ἔρις를 ‘시기와 다툼’으로, σαρκικοί의 육체/육신 계열 은유를 ‘육적’으로 보존하려는 점은 적절합니다. 그러나 첫 γάρ를 ‘때문입니다’로 처리해 독립 진술을 종속 이유절로 바꾸었고, 뒤의 두 번째 σαρκικοί ἐστε 및 περιπατεῖτε의 주어인 ‘여러분’을 ‘그것’으로 바꾸어 원문의 문장 관계와 수사 질문을 훼손합니다.
  naturalness: ‘육적’은 단독 술어보다 ‘육적인 사람들’로 쓰는 편이 현대 표준어에서 자연스럽고, 반복되는 복수 주어도 분명합니다. ‘사람을 따라 행하다’는 한국어에서 특정 인물을 따른다는 뜻으로 오해될 수 있으므로 ‘사람의 방식대로 행하다’가 자연스럽습니다.
  terminology: ‘육적인 사람들’은 σαρκικοί의 σάρξ 연관성을 보존하며, ‘세속적’이나 ‘죄된 본성’처럼 해석을 덧붙이지 않습니다. ‘행하다’는 περιπατέω의 바울적 행보 은유를 유지합니다. κατὰ ἄνθρωπον의 가능한 관용적 이해는 각주로 제시합니다.
  issues:
  - severity: high
    issue: 첫 문장이 인과 종속절로 번역됨
    rationale: ἔτι γὰρ σαρκικοί ἐστε는 ‘여러분은 아직도 육적인 사람들입니다’라는 진술이며, 문맥상 앞 문장을 뒷받침하는 γάρ입니다. ‘육적이기 때문입니다’는 본절 내부에서 문장을 불완전하게 만들고 주절을 삭제합니다.
  - severity: high
    issue: 두 번째 절의 주어가 ‘여러분’에서 ‘그것’으로 변경됨
    rationale: οὐχὶ σαρκικοί ἐστε καὶ ... περιπατεῖτε의 두 동사는 모두 복수 2인칭으로 고린도 교인들을 가리킵니다. ‘그것이 육적이고’는 시기와 다툼 자체를 주어로 삼아 원문과 다릅니다.
  - severity: medium
    issue: ‘사람을 따라 행하는’의 의미 모호성
    rationale: κατὰ ἄνθρωπον은 여기서 특정 ‘사람’을 추종한다는 뜻보다 인간적 방식/기준에 따른다는 뜻입니다. ‘사람의 방식대로 행하다’는 직역적 긴장을 크게 잃지 않으면서 한국어 오해를 줄입니다.
  revised_text: 여러분은 아직도 육적인 사람들입니다. 여러분 가운데 시기와 다툼이 있으니, 여러분은 육적인 사람들이며 사람의 방식대로 행하고 있는 것이 아니겠습니까?
  revised_footnotes:
  - marker: a
    text: 또는 “인간적인 방식으로 살아가고.”
    reason: κατὰ ἄνθρωπον의 관용적·해석적 번역 가능성을 제시하되, 본문은 ‘사람의 방식대로’라는 비교적 투명한 표현을 유지한다.
  revision_rationale: 원문의 두 독립 진술과 δεύτερη 인칭 복수 수사 질문을 회복했습니다. σαρκικοί의 반복과 περιπατεῖτε의 ‘행하다’ 은유를 유지하고, κατὰ ἄνθρωπον은 한국어에서 특정 인물을 따른다는 오해를 피하도록 조정했습니다. 각주 표지는 본문에서 ‘사람의 방식대로’ 뒤에 붙여야 합니다.
