review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the two predicate clauses and preserves the plural address in “여러분은.” However, it omits γάρ (“for”), which explicitly grounds the preceding statement. Its lexical rationale for “하나님의 동역자들” also incorrectly characterizes the genitive as conveying accompaniment, whereas the adopted English audit reading takes it as God’s workers/workers in God’s service; the alternative accompaniment reading should be footnoted.
  naturalness: “하나님의 밭이요 하나님의 건물입니다” is natural enough in a formal biblical register. Recasting the first clause as “하나님의 일을 함께하는 일꾼들” is clear modern Korean and avoids the potentially misleading implication that God is simply one member of a team of peers.
  terminology: “밭” appropriately renders γεώργιον and retains the agricultural metaphor. “건물” is a direct, natural rendering of οἰκοδομή and appropriately introduces the construction metaphor. The disputed force of θεοῦ συνεργοί is preserved with a footnote rather than doctrinally settled in the main text.
  issues:
  - severity: medium
    issue: γάρ is untranslated.
    rationale: The conjunction has an explanatory force and should be represented as “왜냐하면” (or equivalent) in Korean.
  - severity: medium
    issue: The main wording and rationale for “하나님의 동역자들” can readily be understood as “coworkers alongside God,” while the stated English base text adopts the service/belonging sense.
    rationale: Use wording that naturally means workers jointly engaged in God’s work, and retain “하나님과 함께 일하는 사람들” as a footnoted alternative because the genitive is disputed.
  revised_text: 왜냐하면 우리는 하나님의 일을 함께하는 일꾼들이며, 여러분은 하나님의 밭이고 하나님의 건물입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “하나님과 함께 일하는 사람들.”
    reason: θεοῦ συνεργοί의 속격은 ‘하나님의 일을 함께하는 일꾼들’로 이해될 수도 있고 ‘하나님과 함께 일하는 사람들’로 이해될 수도 있는 논쟁적인 표현이다.
  revision_rationale: γάρ의 설명적 연결을 “왜냐하면”으로 반영했습니다. θεοῦ συνεργοί는 본문에서 하나님을 위해 함께 수고하는 일꾼이라는 문맥상 자연스러운 뜻으로 옮기되, ‘하나님과 함께’라는 대안적 이해를 각주로 보존했습니다. 농경 및 건축 은유와 복수 호칭은 유지했습니다.
