  to: 나는 여러분에게 젖을 마시게 하였고, 음식을 주지는 않았습니다. 여러분이 아직 먹을 수 없었기 때문입니다. 그러나 지금도 여러분은 먹을 수 없습니다.
  rationale: 'The revision follows the Greek sequence and metaphor closely: Paul gave milk to drink rather than food; the Corinthians were not yet able to eat, and even now they are not able. It removes added receiving language and maintains the required formal-polite register. No footnote is needed, since the general sense of βρῶμα is retained directly as "음식."'
