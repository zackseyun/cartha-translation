base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
  footnotes:
  - marker: a
    text: Or 'because it is revealed by fire.' The Greek phrase ἐν πυρί may be understood as 'in fire' or instrumentally as 'by fire.'
    reason: lexical_alternative
  - marker: b
    text: '''The Day'' likely refers to the future day of divine evaluation or judgment.'
    reason: cross_reference
translation:
  language: ko
  text: 각 사람의 일이 드러나게 될 것입니다. 그날이 각 사람의 일을 밝혀 줄 것이기 때문입니다. 그날은 불 가운데서 드러나며, 불 자체가 각 사람의 일이 어떠한 것인지를 시험할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “불로 드러나며.” 그리스어 ‘ἐν πυρί’는 “불 가운데서” 또는 도구적 의미의 “불로”로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἡμέρα
  english_pob_choice: the Day
  chosen_korean: 그 날
  alternatives_korean:
  - 주의 날
  lexicon: BDAG
  rationale: 종말론적 「주의 날」(1:8과 호응). 본문은 정관사만 사용.
- source_word: δοκιμάσει
  english_pob_choice: will test
  chosen_korean: 시험할
  alternatives_korean:
  - 검증할
  lexicon: BDAG
  rationale: δοκιμάζω의 정형 의미 「시금하다, 시험하다」.
