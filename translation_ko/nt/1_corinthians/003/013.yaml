- from: 각 사람의 일이 드러나게 될 것입니다. 이는 그 날이 그것을 밝히 보여 줄 것이기 때문입니다. 그것은 불로 나타나며, 각 사람의 일이 어떠한 것인지 그 불이 그것을 시험할 것입니다.
  to: 각 사람의 일이 드러나게 될 것입니다. 그날이 각 사람의 일을 밝혀 줄 것이기 때문입니다. 그날은 불 가운데서 드러나며, 불 자체가 각 사람의 일이 어떠한 것인지를 시험할 것입니다.[a]
  rationale: 지시어 ‘그것’을 원문의 주어와 목적어에 맞게 각각 ‘그날’과 ‘각 사람의 일’로 명시했습니다. 또한 불이 시험한다는 강조를 ‘불 자체가’로 보존하고, ἐν πυρί의 위치격/도구격 모호성은 각주로 유지했습니다.
