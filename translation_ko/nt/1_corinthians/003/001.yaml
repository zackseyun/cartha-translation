  to: 형제들이여, 나도 여러분에게 영적인 사람들에게 말하듯 말할 수 없었습니다. 도리어 육적인 사람들에게, 곧 메시아 안에 있는 어린아이들에게 말하듯 말하였습니다.
  rationale: 원문의 ‘영적인 사람들로서’와 ‘육적인 사람들로서, 메시아 안에 있는 어린아이들로서’라는 세 겹의 비교를 유지하면서, 한국어에서 자연스럽게 비교 대상과 발화 행위를 연결하도록 문장을 다듬었습니다. ‘도리어’는 ἀλλά의 대조를 드러내며, ‘메시아 안에 있는’은 ἐν Χριστῷ를 보존합니다.
  reviewer_model: gpt-5.6-terra
