review_pass:
  verdict: revise
  source_fidelity: 핵심 대조(영적인 자들/육적인 자들)와 ‘메시아 안의 어린아이들’이라는 비유는 보존되어 있습니다. 그러나 초안의 반복된 ‘…하듯 말하다’ 구조는 원문의 비교 구문과 대조 관계를 한국어에서 부자연스럽고 불명료하게 만듭니다. ‘나도’는 Κἀγώ의 연결·개인 강조를 유지합니다.
  naturalness: ‘영적인 자들에게 하듯 말할 수 없었고, … 어린아이들에게 하듯 말하였습니다’는 한국어에서 비교 대상과 발화 행위가 반복되어 어색합니다. 비교를 ‘…에게 말하듯’으로 정리하고 두 절을 분명히 나누면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: πνευματικοῖς/σαρκίνοις는 각각 ‘영적인 사람들/육적인 사람들’로, Χριστῷ는 ‘메시아’로 옮겨 원문의 어휘 대조 및 프로젝트의 제목어 정책을 유지합니다. νήπιοι는 문맥상 미성숙의 비유를 담은 ‘어린아이들’이 적절합니다.
  issues:
  - severity: medium
    issue: 비교 구문의 반복으로 인한 문장 구조의 부자연스러움
    rationale: 초안의 ‘영적인 자들에게 하듯 말할 수 없었고 … 어린아이들에게 하듯 말하였습니다’는 한국어에서 ‘말하다’와 ‘하듯’이 중첩됩니다. 원문의 ὡς…ἀλλ’ ὡς…ὡς… 대조는 유지하되, ‘…에게 말하듯’으로 정리할 필요가 있습니다.
  revised_text: 형제들이여, 나도 여러분에게 영적인 사람들에게 말하듯 말할 수 없었습니다. 도리어 육적인 사람들에게, 곧 메시아 안에 있는 어린아이들에게 말하듯 말하였습니다.
