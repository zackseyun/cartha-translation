  text: 이 세상의 지혜는 하나님 앞에서는 어리석음이기 때문입니다. 기록된 바, 「그분이 지혜로운 자들을 그들의 교활함 가운데서 붙드신다」 하였습니다.
  philosophy: optimal-equivalence
