  source_fidelity: 초안의 「속하였다」는 그리스어 현재형 εἰμι와 맞지 않아 현재의 소속·당파적 충성을 나타내도록 고쳐야 합니다. 또한 ὅταν ... λέγῃ τις의 반복·불특정 상황은 「누군가가 ... 말할 때마다」로 옮기는 것이 충실합니다. οὐκ ἄνθρωποί ἐστε는 문맥상 책망의 수사 의문문이며, 「단지 사람일 뿐」은 그 함의를 자연스럽게 드러냅니다.
  naturalness: 「한 사람은 ... 하고 다른 사람은 ... 할 때에」보다 「누군가가 ... 말하고, 다른 사람이 ... 말할 때마다」가 현대 표준 한국어로 더 자연스럽고 원문의 병렬과 반복성을 잘 살립니다. 「여러분은 단지 사람일 뿐이 아닙니까?」는 합쇼체의 자연스러운 수사 의문문입니다.
  terminology: 바울과 아볼로의 이름은 통용 표기를 유지했습니다. 「바울에게 속해 있다」는 소유 관계가 아니라 지도자에 대한 당파적 소속을 문맥 안에서 무리 없이 나타내며, 특정 교파적 해석을 덧붙이지 않습니다.
