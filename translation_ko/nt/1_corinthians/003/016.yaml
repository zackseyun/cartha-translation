review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders ναὸς θεοῦ as “하나님의 성전” and preserves the rhetorical question. However, “여러분은 자신이 … 것을” introduces an unnecessary reflexive (“자신”) and makes the clause less direct than the Greek, which simply states that the plural addressees are God’s temple. The revision directly reflects both coordinated clauses and retains the plural address without over-specifying its corporate implication.
  naturalness: “여러분이 … 거하신다는 것을 알지 못합니까?” is natural modern formal Korean (합쇼체). It avoids the awkward and potentially ambiguous construction “여러분은 자신이 … 것을.”
  terminology: “하나님의 성전” appropriately renders ναός in established Korean biblical usage. “하나님의 영” and “거하시다” are standard, suitably reverent terms for τὸ πνεῦμα τοῦ θεοῦ and οἰκεῖ. Notes preserve the sanctuary nuance, plural addressee, and the possible sense “among you.”
  issues:
  - severity: medium
    issue: Unnecessary reflexive expression “자신이”
    rationale: The Greek has “you are God’s temple,” not “you [yourselves] are aware that yourselves are….” In Korean, “여러분은 자신이 … 것을” is less natural and can blur the straightforward predication. Replace it with “여러분이 … 거하신다는 것을.”
  - severity: low
    issue: No footnote anchors or Korean footnotes are supplied
    rationale: The audit trail identifies lexical and interpretive alternatives for ναός, the plural “you,” and ἐν ὑμῖν. Anchored Korean notes should retain these without imposing a doctrinally narrowed reading.
  revised_text: 여러분[b]이 하나님의 성전[a]이며 하나님의 영이 여러분 안에[c] 거하신다는 것을 알지 못합니까?
