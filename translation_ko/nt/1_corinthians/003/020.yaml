  source_fidelity: 원문 καὶ πάλιν은 앞선 인용에 이어지는 두 번째 인용을 표시하므로 「또」보다 「또다시」가 더 직접적입니다. γινώσκει는 「아신다」로, διαλογισμούς는 「생각」으로, μάταιοι는 「헛되다」로 적절히 옮겨졌습니다. 다만 ὅτι εἰσὶν μάταιοι는 ‘그 생각들이 헛되다는 것’을 명시하는 절이므로 이를 더 분명히 드러내는 편이 좋습니다.
  naturalness: 「또다시 … 하였습니다」는 현대 한국어 성경 문체의 합쇼체에서 자연스럽습니다. 「지혜로운 자들의 생각」도 문맥상 자연스럽고, 「헛됨을 아신다」보다 「헛되다는 것을 아십니다」가 절 구조를 더 투명하게 전달합니다.
  terminology: Κύριος는 시편 인용의 LXX 표현에 맞추어 「주」로 유지하는 것이 적절합니다. σοφῶν은 바울의 문맥에서 실체화된 복수 형용사이므로 「지혜로운 자들」이 적합합니다. 별도의 교리적 보충은 필요 없습니다.
