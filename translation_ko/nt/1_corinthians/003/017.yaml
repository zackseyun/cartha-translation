base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
  footnotes:
  - marker: a
    text: Or "corrupts" or "defiles" for both uses of the verb "destroy."
    reason: lexical_alternative
  - marker: b
    text: The "you" is plural; Paul identifies the congregation collectively as God's temple.
    reason: cultural_note
translation:
  language: ko
  text: 누구든지 하나님의 성전을 파괴하면[a], 하나님께서 그 사람을 파괴하실 것입니다. 하나님의 성전은 거룩하고, 여러분[b]이 바로 그 성전이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘파괴하면’과 ‘파괴하실’에 쓰인 동사는 ‘훼손하다’ 또는 ‘더럽히다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분’은 복수입니다. 바울은 회중 전체를 하나님의 한 성전으로 가리킵니다.
    reason: cultural_note
