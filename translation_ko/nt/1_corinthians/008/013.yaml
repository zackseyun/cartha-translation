  source_fidelity: διόπερ의 결론적 연결은 ‘그러므로’로, εἰ βρῶμα σκανδαλίζει의 조건은 ‘음식이 내 형제를 걸려 넘어지게 한다면’으로 충실히 옮겼습니다. οὐ μὴ φάγω의 강한 부정은 ‘결코 … 먹지 않겠습니다’에, εἰς τὸν αἰῶνα는 ‘영원토록’에 반영되어 있습니다. ἵνα μὴ의 목적도 ‘…하지 않기 위해’로 보존되었습니다.
