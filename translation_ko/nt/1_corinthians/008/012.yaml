  to: 이와 같이 형제들[a]을 거슬러 죄를 짓고 그들의 약한 양심을 상하게 함으로써, 여러분은 메시아[b]에게 죄를 짓는 것입니다.
  rationale: ‘이와 같이’는 οὕτως의 앞선 문맥 지시를 자연스럽게 살리고, ‘형제들을 거슬러’는 εἰς의 방향을 명확히 합니다. 나머지 핵심 구조—형제들에게 범죄하고 약한 양심을 상하게 하는 행위가 메시아에 대한 범죄라는 진술—는 유지했습니다. 각주는 본문 의미를 변경하지 않고 영어 POB의 관련 감사 결정을 한국어 독자에게 반영합니다.
