source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
  footnotes:
  - marker: a
    text: '''Brothers'' here refers to fellow believers; the context may include both men and women.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Christ.' The Greek title is Χριστός.
    reason: alternative_reading
  - marker: c
    text: Or 'And in this way, by sinning against the brothers'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이 형제들[a]을 거슬러 죄를 짓고 그들의 약한 양심을 상하게 함으로써, 여러분은 메시아[b]에게 죄를 짓는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 여기서 동료 신자들을 가리키며, 문맥상 남성과 여성을 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리스도’. 그리스어 칭호는 Χριστός입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τύπτοντες αὐτῶν τὴν συνείδησιν
  english_pob_choice: wounding their … conscience
  chosen_korean: 양심을 상하게 함
  alternatives_korean:
  - 양심을 때림
  lexicon: BDAG
  rationale: τύπτω의 문자적 「때리다」를 양심 문맥에서 「상하게 하다」로 자연화.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  english_pob_choice: sinning against Messiah
  chosen_korean: 메시아에게 죄를 짓는
  alternatives_korean:
  - 메시아를 거슬러 죄를 짓는
  lexicon: BDAG
  rationale: 형제에 대한 죄가 곧 메시아에 대한 죄라는 일체화.
