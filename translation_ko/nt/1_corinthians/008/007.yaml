review_pass:
  verdict: revise
  source_fidelity: 초안은 γνῶσις, εἰδωλόθυτον, συνείδησις, ἀσθενής, μολύνεται를 대체로 충실히 옮겼습니다. 그러나 「그래서」는 원문의 단순 접속사 καί를 인과적으로 강화하며, 「양심이 약하기에」도 분사구 ἀσθενὴς οὖσα의 상태 설명을 원인으로 바꿉니다. 난해한 「τῇ συνηθείᾳ ἕως ἄρτι τοῦ εἰδώλου」는 문맥상 우상과의 이전/지속적 연관을 가리키므로, 본문에서는 이를 자연스럽게 표현하고 직역 가능성은 각주로 보완하는 것이 적절합니다.
  naturalness: 「우상에 익숙해 있어」는 의미는 전달되지만 한국어에서는 무엇에 어떻게 익숙한지 다소 불분명합니다. 「우상과 관련된 오랜 습관 때문에」는 문맥을 더 자연스럽게 전달합니다. 또한 「그들의 양심은 약한 상태여서 더럽혀집니다」는 현대 표준어 합쇼체로 자연스럽고 원문의 수식 관계를 유지합니다.
  terminology: 「지식」, 「우상」, 「우상에게 바친 음식」, 「양심」, 「약한」, 「더럽혀집니다」는 바울의 문맥과 핵심 용어를 적절히 반영합니다. 「우상에게 바쳐진 음식」보다 「우상에게 바친 음식」이 행위의 귀속을 더 직접적으로 드러내면서 자연스럽습니다.
  issues:
