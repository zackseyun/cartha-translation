  - severity: medium
    issue: 「양심이 약하기에」가 상태 분사를 원인절로 전환함
    rationale: ἀσθενὴς οὖσα는 ‘약한 상태에 있는’ 양심을 묘사합니다. 「약한 상태여서」가 문법적 관계를 더 잘 보존합니다.
  - severity: low
    issue: 난해한 συνηθείᾳ … τοῦ εἰδώλου 구문의 해석 가능성이 본문에만 고정됨
    rationale: 이 구문은 어휘적·통사적으로 난해합니다. 문맥적 번역을 사용하되, 직역적 대안을 각주에 제시하여 해석의 여지를 보존하는 것이 바람직합니다.
