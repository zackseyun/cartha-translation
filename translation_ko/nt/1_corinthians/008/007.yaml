  to: 그러나 모든 사람에게 이 지식이 있는 것은 아닙니다. 어떤 이들은 우상과 관련된 오랜 습관 때문에 지금까지도 그것을 우상에게 바친 음식으로 여겨 먹으며[a], 그들의 양심은 약한 상태여서 더럽혀집니다.
