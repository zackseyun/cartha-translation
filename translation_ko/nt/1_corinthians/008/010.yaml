    rationale: 현대 한국어 성경 문체에서는 복수 수신자인 고린도 교회에 '여러분'을 쓰는 것이 자연스럽고 존중하는 어조를 유지합니다.
  - severity: medium
    issue: '''약한 자의 양심''은 ἀσθενοῦς ὄντος의 인칭적 수식을 다소 추상화합니다.'
    rationale: 약한 상태에 있는 것은 양심 자체라기보다 그 양심의 소유자인 관찰자이므로 '그 약한 사람의 양심'이 더 명료합니다.
  - severity: low
    issue: '''「세움」''의 인용부호는 원문에 없습니다.'
    rationale: 반어성은 번역문에 인용부호를 추가하기보다 각주에서 설명하는 편이 원문의 표현을 과도하게 해석하지 않습니다.
  revised_text: 누군가가 지식이 있는 여러분이 우상 신전에서 식사를 위해 기대어 앉아 있는 것을 보면, 그 약한 사람의 양심이 우상에게 바친 제물을 먹도록 세움을 받지 않겠습니까?
  revised_footnotes:
