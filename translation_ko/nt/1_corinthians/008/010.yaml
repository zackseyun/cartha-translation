  source_fidelity: 원문의 조건문, 우상 신전의 식사 상황, 약한 관찰자의 양심, 그리고 우상에게 바친 제물을 먹게 되는 결과를 보존했습니다. κατακείμενον의 기대어 먹는 자세는 '식사를 위해 기대어 앉아'로 반영했습니다. οἰκοδομηθήσεται의 문자적 '세움'과 이 문맥의 반어적 효과도 유지했습니다.
