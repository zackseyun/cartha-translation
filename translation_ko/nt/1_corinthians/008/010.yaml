review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the conditional setting, the cultic dining context, the weak observer, and the resulting eating of idol-sacrifice food. However, 「세움」을 받다 is not idiomatic Korean for the Greek passive οἰκοδομηθήσεται and obscures the rhetorical sense. The Greek's edification metaphor can be retained in a footnote while the text uses a natural Korean expression for the harmful emboldening implied by the question.
  naturalness: 그대 and the marked nominal expression 「세움」을 받다 are not natural modern formal-polite Korean in this context. 지식을 가진 당신 and 용기를 내게 되다 are clear, contemporary, and preserve the interpersonal and rhetorical flow. 식탁에 앉아 있는 것은 a suitable natural contextual rendering of reclining at a meal.
  terminology: 우상에게 바쳐진 음식 accurately renders εἰδωλόθυτα. The footnote preserves the significant οἰκοδομέω wordplay without imposing a doctrinal explanation; 용기를 내게 되다 reflects the contextual force of the verb in this ironic question.
  issues:
  - severity: medium
    issue: 「세움」을 받다 is an unnatural and opaque rendering of οἰκοδομηθήσεται.
    rationale: Quotation marks do not make the Korean nominalization idiomatic, and readers may not understand the intended ironic force. A contextual Korean rendering in the text with a literal lexical footnote better serves both intelligibility and source transparency.
  - severity: low
    issue: 그대 is stylistically archaic for the requested modern standard Korean register.
    rationale: 당신 is more contemporary in a direct hypothetical address and does not alter the singular referent.
  - severity: low
    issue: 약한 자의 양심 leaves the referential relation slightly less explicit than the Greek construction.
    rationale: 그 약한 사람의 양심 makes clear that the conscience belongs to the person who sees the knowledgeable believer.
  revised_text: 누군가가 지식을 가진 당신이 우상 신전에서 식탁에 앉아 있는 것을 본다면, 그 약한 사람의 양심이 우상에게 바쳐진 음식을 먹도록 용기를 내게 되지 않겠습니까?
  revised_footnotes:
  - marker: a
    text: 직역하면, ‘세워지지 않겠습니까?’입니다. 바울은 보통 덕을 세우는 데 쓰는 표현을 여기서는 해로운 결과를 가리키는 말로 사용합니다.
    reason: lexical_alternative
  revision_rationale: The revision replaces an opaque literalism with the natural contextual expression 용기를 내게 되다, while a footnote retains the literal ‘be built up’ wording and its likely irony. It also updates archaic 그대 and clarifies that the weak person's conscience is in view. No disputed textual or theological claim has been resolved beyond the source's rhetorical sense.
