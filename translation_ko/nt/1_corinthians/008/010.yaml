  terminology: '''우상 신전'', ''우상에게 바친 제물'', ''양심'', ''세움''은 문맥과 바울의 관련 어휘를 충실히 반영합니다. ''세움''의 통상적 긍정 용례와 본문의 역설적 결과는 각주로 밝혔습니다.'
  issues:
