    text: 또는 ‘먹도록 부추김을 받지 않겠습니까?’ 헬라어는 문자적으로 ‘세움을 받다’라고 하며, 여기서는 해로운 결과를 낳는 행동에 대해 통상 긍정적인 ‘세움’의 표현을 사용합니다.
    reason: lexical_alternative
