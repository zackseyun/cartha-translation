  terminology: '"이른바 신들" appropriately renders λεγόμενοι θεοί. "많은 신들과 많은 주들" preserves both plural noun pairs and the deliberate lexical contrast with the one God and one Lord in verse 6. Lowercase distinctions do not apply in ordinary Korean orthography.'
