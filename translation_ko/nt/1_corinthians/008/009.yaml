    text: 또는 ‘여러분의 이 자유’. 그리스어는 ‘권한’, ‘권리’, 또는 ‘자유’를 뜻할 수 있으며, 여기서는 우상에게 바쳐진 음식과 관련하여 일부 신자들이 주장한 자유를 가리킵니다.
