source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
  footnotes:
  - marker: a
    text: Or, 'an idol has no real existence in the world.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'there is no god but one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우상에게 바친 음식을 먹는 일에 관하여, 우리는 세상에 우상이란 아무것도 아니며[a] 한 분 외에는 하나님이 없다는 것을 압니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “세상에 우상은 실제로 존재하지 않는다.”
    reason: οὐδὲν εἴδωλον ἐν κόσμῳ의 실재성에 초점을 둔 번역 가능성을 제시합니다.
  - marker: b
    text: 또는 “한 분 외에는 신이 없다.”
    reason: οὐδεὶς θεὸς εἰ μὴ εἷς의 일반 명사 ‘신’과 유일성의 표현 가능성을 제시합니다.
lexical_decisions:
- source_word: οὐδὲν εἴδωλον ἐν κόσμῳ
  english_pob_choice: an idol is nothing in the world
  chosen_korean: 우상은 세상에서 아무것도 아니며
  alternatives_korean:
  - 우상이 세상에 실제로 존재하지 않으며
  lexicon: BDAG
  rationale: 고린도 회중의 「지식」 표어를 인용. 5절의 「많은 신·주」와 변증법적 긴장.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  english_pob_choice: no God except one
  chosen_korean: 한 분 외에는 하나님이 없다
  alternatives_korean:
  - 오직 한 분만이 하나님이시다
  lexicon: BDAG
  rationale: 셰마(신 6:4)의 헬라어 압축형.
