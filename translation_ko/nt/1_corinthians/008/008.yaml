  text: 그러나 음식이 우리를 하나님 앞에 내세우지는 않습니다. 우리가 먹는다고 더 풍족해지는 것도 아니고, 먹지 않는다고 부족해지는 것도 아닙니다.
  philosophy: optimal-equivalence
