  source_fidelity: ‘메시아의 몸’은 σῶμα Χριστοῦ를 충실히 옮기며, Χριστός를 칭호로 ‘메시아’로 번역한 프로젝트 방침과도 일치합니다. 그러나 ‘각각이 그 일부의 지체입니다’는 ἐκ μέρους를 ‘일부의’라는 속격 구조로 잘못 연결하여, 각 사람이 ‘그 일부에 속한 지체’라는 부자연스럽고 의미가 불분명한 표현이 됩니다. ἐκ μέρους는 여기서 한 몸과 각 지체의 관계를 나타내는 분배적 표현으로 보는 것이 적절합니다.
