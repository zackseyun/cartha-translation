  text: 우리는 모두 유대인이든 그리스인이든, 노예든 자유인이든, 한 성령 안에서[a] 한 몸 안으로 세례를 받았고, 모두 한 성령을[c] 마시게 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 성령으로’. 그리스어 ἐν은 영역(‘안에서’) 또는 수단/행위자(‘으로’)를 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘우리 모두에게 한 성령을 마시도록 하셨습니다.’
    reason: lexical_alternative
