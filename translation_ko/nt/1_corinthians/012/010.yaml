  source_fidelity: ‘능력의 역사들’은 ἐνεργήματα δυνάμεων의 형태를 지나치게 직역한 표현으로, 현대 한국어에서 의미가 불투명합니다. 이 은사 목록의 문맥에서 δυνάμεις를 ‘기적’으로 옮긴 것은 타당하며, ἐνεργήματα의 복수성은 ‘일들’로 살릴 수 있습니다. ‘영들의 분별’, ‘예언’, ‘여러 종류의 방언’은 원문의 범위와 복수 표현을 대체로 충실히 반영합니다.
