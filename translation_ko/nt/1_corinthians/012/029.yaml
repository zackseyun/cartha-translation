  source_fidelity: 초안은 각 항목을 의문문으로 반복한 점은 살렸지만, μή가 부정 답변을 예상하게 하는 의문문이라는 점이 한국어에 드러나지 않습니다. 또한 마지막의 ‘능력을 행합니까?’는 δυνάμεις를 자연스럽게 옮기지 못합니다. 문맥상 기적적 행위를 가리키므로 ‘기적을 행하다’가 적절합니다.
