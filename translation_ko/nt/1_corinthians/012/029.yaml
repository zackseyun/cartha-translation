  terminology: ἀπόστολοι, προφῆται, διδάσκαλοι는 각각 ‘사도’, ‘예언자’, ‘교사’로 적절합니다. δυνάμεις는 이 목록에서 기적적 능력/기적 행위를 가리키므로 본문에서는 ‘기적을 행하다’로 옮기고, 직역 가능성은 각주로 보완합니다.
