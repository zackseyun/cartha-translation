  source_fidelity: 주요 목록 구조와 순서는 대체로 충실합니다. 그러나 δυνάμεις를 직역한 「능력들」은 한국어에서 무엇을 뜻하는지 불분명하며, 이 은사 목록에서는 기적적 능력의 발현을 가리키므로 「기적들」이 더 정확합니다. κυβερνήσεις의 「다스리는 일들」은 통치·지배의 뜻을 지나치게 강하게 만들 수 있어, 방향을 잡고 পরিচাল하는 기능을 나타내는 「지도하는 일들」이 적절합니다.
  naturalness: 한 문장 안에서 「두셨고 ... 두셨습니다」로 동사를 반복한 초안보다, 하나의 동사로 열거 전체를 이끄는 수정문이 더 자연스럽고 원문의 단일 동사 ἔθετο에도 가깝습니다. 「여러 종류의 방언」은 자연스럽고 문맥상 신중한 표현입니다.
  terminology: 「사도들, 예언자들, 교사들, 치유의 은사들, 방언」은 적절합니다. δυνάμεις에는 「기적들」을 사용하되 문자적 대안은 각주로 보존하고, κυβερνήσεις는 「지도하는 일들」로 옮기며 지도·운영의 뉘앙스를 각주로 밝혀야 합니다.
