base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
  footnotes:
  - marker: a
    text: Or 'works of power' for 'miracles.'
    reason: lexical_alternative
  - marker: b
    text: Or 'guidance' or 'forms of leadership' for 'administrations.'
    reason: lexical_alternative
  - marker: c
    text: Or 'kinds of languages.' The Greek term can mean 'tongues' or 'languages'; the main text preserves the ambiguity of Paul's wording in this context.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서는 교회 안에 첫째로 사도들을, 둘째로 예언자들을, 셋째로 교사들을, 그다음에 기적들을[a], 그다음에 치유의 은사들을, 돕는 일들을, 지도하는 일들을[b], 여러 종류의 방언을[c] 두셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「기적들」은 직역하면 「능력들」 또는 「능력의 역사들」이다.
    reason: lexical_alternative
  - marker: b
    text: 「지도하는 일들」은 「관리하는 일들」 또는 「이끄는 일들」로도 옮길 수 있다. 이 그리스어는 본래 배의 방향을 잡는 일을 가리킨다.
    reason: lexical_alternative
  - marker: c
    text: 「여러 종류의 방언(γένη γλωσσῶν)」은 「여러 종류의 언어」로도 옮길 수 있다. 본문은 이 말이 가리키는 현상을 더 구체적으로 한정하지 않는다.
    reason: alternative_reading
