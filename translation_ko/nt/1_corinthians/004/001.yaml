  - severity: low
    issue: The two predicate roles are not syntactically parallel.
    rationale: Both ὑπηρέτας and οἰκονόμους are accusative complements of λογιζέσθω. Korean should mark both as capacities with -으로.
  revised_text: 사람은 이와 같이 우리를 메시아의 종으로, 하나님의 비밀들의 청지기로 여겨야 합니다.
