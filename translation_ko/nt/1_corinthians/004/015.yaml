  - severity: low
    issue: ἐγέννησα의 능동적 부성 비유가 약화됨
    rationale: ‘여러분의 아버지가 되었기’는 문맥상 가능하지만, ‘내가 여러분을 낳았다’라는 원문의 능동적 은유를 직접적으로 나타내지 않습니다. 자연스러운 한국어를 위해 ‘여러분을 낳아 아버지가 되었습니다’로 보완하고 각주를 답니다.
