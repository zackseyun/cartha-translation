  source_fidelity: ‘우리 손으로’는 대체로 ταῖς ἰδίαις χερσίν을 반영하지만, ἰδίαις의 강조를 ‘우리 자신의 손으로’로 드러내는 것이 더 정확합니다. 또한 ἀνεχόμεθα는 단순히 ‘참고’라는 연결형보다 독립된 서술어 ‘견딥니다’로 옮겨야 본문의 대조 구조와 시제를 충실히 반영합니다.
  naturalness: 초안의 ‘일하면서 수고합니다’는 의미는 전달하지만 다소 중복적으로 들립니다. ‘우리 자신의 손으로 일하며 수고합니다’는 원문의 분사 관계와 노력의 강조를 자연스럽게 살립니다. 절 끝의 ‘참고,’는 한국어로 미완결되어 있어 수정이 필요합니다.
  terminology: ‘축복합니다’는 εὐλογοῦμεν에 대한 자연스럽고 성경 문맥에 적합한 번역입니다. ‘박해를 받으면’과 ‘견딥니다’도 διωκόμενοι 및 ἀνεχόμεθα의 적대적 상황과 인내를 적절히 전달합니다.
  issues:
  - severity: medium
    issue: ‘참고,’가 종결되지 않은 연결형으로 남아 있습니다.
    rationale: ἀνεχόμεθα는 직설법 현재 1인칭 복수의 독립 서술어입니다. 한국어에서도 ‘견딥니다’처럼 종결해야 문법적으로 완결되고 앞의 ‘축복합니다’와 병렬을 이룹니다.
  - severity: low
    issue: ἰδίαις의 강조가 ‘우리 손으로’에서는 충분히 명시되지 않습니다.
    rationale: ‘우리 자신의 손으로’는 ‘우리의 고유한/직접적인 손으로’라는 강조를 무리 없이 보존합니다.
  - severity: low
    issue: ‘일하면서 수고합니다’는 두 동사의 결합을 다소 중복적으로 처리합니다.
    rationale: ‘일하며 수고합니다’는 ἐργαζόμενοι가 κοπιῶμεν의 방식을 설명하는 관계를 더 간결하고 자연스럽게 나타냅니다.
