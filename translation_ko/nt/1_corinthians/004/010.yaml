revisions:
- from: 우리는 메시아 때문에 어리석은 자들이고, 여러분은 메시아 안에서 분별 있는 자들입니다. 우리는 약하고 여러분은 강합니다. 여러분은 영예롭고 우리는 모욕을 받습니다.
  to: 우리는 메시아 때문에 어리석은 자들이지만, 여러분은 메시아 안에서 지혜로운 자들입니다. 우리는 약하지만, 여러분은 강합니다. 여러분은 존귀하지만, 우리는 천대받습니다.[a]
  rationale: 직접적인 반어 대조를 강화하기 위해 ‘분별 있는’을 ‘지혜로운’으로 바꾸고, 공적 명예·불명예의 상태를 더 정확하고 자연스럽게 나타내도록 마지막 대조를 개정했습니다. ‘메시아 때문에’는 διὰ Χριστόν의 원인적 의미를 자연스럽게 옮기며, 문맥상 가능한 ‘메시아를 위하여’의 목적적 뉘앙스를 배제하려는 교리적 판단은 아닙니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:37:17Z'
review_pass:
  verdict: revise
  source_fidelity: 개정안은 μωροί–φρόνιμοι의 직접적인 반어 대조를 ‘어리석은 자들–지혜로운 자들’로 보존하고, ἔνδοξοι–ἄτιμοι의 공적 명예/불명예 대조를 ‘존귀하다–천대받다’로 자연스럽게 드러냅니다. διὰ Χριστόν의 원인·목적 양의성을 본문과 각주로 보존합니다.
  naturalness: 합쇼체 문장과 대조적 병렬 구조가 자연스럽습니다. ‘분별 있는 자들’도 가능한 표현이지만, 이 문맥에서는 ‘지혜로운 자들’이 ‘어리석은 자들’과의 수사적 대조를 더 직접적이고 매끄럽게 전달합니다.
  terminology: ‘메시아’와 ‘메시아 안에서’는 제공된 용어 정책 및 영어 POB의 선택과 일치합니다. ‘존귀하다/천대받다’는 사회적 명예와 수치의 대조를 과도하게 내면화하지 않고 전달합니다.
  issues:
  - severity: medium
    issue: φρόνιμοι를 ‘분별 있는’으로 번역함
    rationale: φρόνιμοι가 실천적 분별의 뉘앙스를 가질 수 있으나, 본문의 μωροὶ와의 의도적인 반어적 대조 및 영어 POB의 ‘wise’를 고려하면 ‘지혜로운’이 더 직접적으로 원문의 수사적 균형을 재현합니다.
  - severity: medium
    issue: ἔνδοξοι … ἄτιμοι를 ‘영예롭고 … 모욕을 받습니다’로 번역함
    rationale: ‘영예롭다’와 ‘모욕을 받다’는 문법적·의미적 짝이 다소 비대칭이며, ἄτιμοι는 일회적 모욕보다 낮은 사회적 평가 또는 불명예의 상태를 가리킵니다. ‘존귀하지만, 우리는 천대받습니다’가 공적 지위의 대조를 더 자연스럽게 전달합니다.
