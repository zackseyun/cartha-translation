review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘의롭다 함을 받은’은 δεδικαίωμαι의 완료 수동 및 법정적·바울적 어휘를 대체로 잘 보존합니다. 그러나 ‘심판하시는’은 ἀνακρίνων의 우선적 의미인 조사·심사·평가를 최종 심판으로 다소 좁히므로 ‘심사하시는’으로 고치는 것이 더 정확합니다. 또한 σύνοιδα의 관용적 용례는 자신에 대해 아무런 잘못을 의식하지 않는다는 뜻을 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘내 자신에 대해 아무것도 의식하는 바가 없으나’는 현대 표준어로 다소 어색하고, 무엇을 의식하지 않는지 불분명합니다. ‘내 자신에게 아무런 잘못도 의식하지 못합니다’는 합쇼체 문체로 자연스럽고 문맥상의 자책·법정적 함의를 드러냅니다.
  terminology: ‘의롭다 하심을 받다’는 δικαιόω의 핵심 번역어를 유지합니다. κύριος는 ‘주님’으로, ἀνακρίνω는 ‘심사하다’로 옮겨 각각 호칭과 법정적 검토의 뉘앙스를 보존합니다.
  issues:
  - severity: medium
    issue: σύνοιδα 구문의 번역이 어색하고 의미 대상이 불명확합니다.
    rationale: ‘아무것도 의식하는 바’는 현대 한국어에서 부자연스럽습니다. 문맥과 관용구에 따라 자신에게 아무런 잘못도 의식하지 않는다는 뜻을 본문에서 드러내는 것이 안전합니다.
  - severity: medium
    issue: ἀνακρίνων을 ‘심판하시는’으로 번역했습니다.
    rationale: 이 동사는 조사·심사·평가의 법정적 과정을 가리킬 수 있습니다. 최종 판결의 의미로 한정하지 않는 ‘심사하시는’이 원문의 표현을 더 충실히 보존합니다.
  revised_text: 나는 내 자신에게 아무런 잘못도 의식하지 못합니다. 그러나 이것으로 내가 의롭다 하심을 받은 것은 아닙니다. 나를 심사하시는 분은 주님이십니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘나는 내 자신에 대하여 아무것도 알지 못합니다.’ 여기서는 자신에게 불리한 잘못을 의식하지 않는다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이것으로 내가 무죄 판결을 받은 것은 아닙니다’ 또는 ‘정당하다고 인정받은 것은 아닙니다.’ 그리스어는 바울이 다른 곳에서 ‘의롭다 하다’로도 사용하는 법정 용어입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나를 판단하시는 분.’ 이 동사는 법정적 맥락에서 조사하다, 심사하다, 평가하다를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: σύνοι다의 관용적 의미를 자연스러운 현대 한국어로 명료하게 옮기고, δεδικαίωμαι의 법정적·신학적으로 중요한 용어는 ‘의롭다 하심을 받다’로 유지했습니다. ἀνακρίνων은 최종 심판으로 단정하지 않고 ‘심사하다’로 번역했으며, 대안은 각주에 보존했습니다.
