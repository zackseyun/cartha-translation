review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the adversative structure and the forensic force of δεδικαίωμαι. However, “내 자신에 대해 아무것도 의식하는 바가 없으나” is not idiomatic Korean and can mean that Paul has no self-awareness, rather than that he knows of no charge against himself. “심판하시는” is stronger and less precise than ἀνακρίνων, which denotes examining or evaluating in a judicial setting.
  naturalness: The revised wording uses natural modern formal-polite Korean. “내 자신에게 불리한 것은 아무것도 알고 있지 않습니다” clearly conveys the Greek συνείδημι idiom without importing a specific accusation. “살피시는 분” retains the scrutinizing sense without prematurely rendering a final verdict.
  terminology: “의롭다 하심을 받은” preserves the forensic and Pauline terminology of δικαιόω. “주님” is the standard Korean rendering of κύριος here and does not expand the referent beyond the Greek text.
  issues:
  - severity: medium
    issue: The first clause is semantically unclear and unnatural.
    rationale: “내 자신에 대해 아무것도 의식하는 바가 없다” may suggest lacking awareness about oneself. The Greek means that Paul knows of nothing against himself.
  - severity: medium
    issue: “심판하시는” over-translates ἀνακρίνων.
    rationale: ἀνακρίνω concerns examination, investigation, or evaluative scrutiny. A final-judgment term risks collapsing the distinction that Paul maintains in the verse.
  revised_text: 나는 내 자신에게 불리한 것은 아무것도 알고 있지 않습니다[a]. 그러나 이로써 내가 의롭다 하심을 받은 것은 아닙니다[b]. 나를 살피시는 분은 주님이십니다[c].
  revised_footnotes:
  - marker: a
    text: 또는 “나는 내 자신에게 아무것도 거리끼는 바가 없습니다.” 직역하면 “나는 내 자신에게 아무것도 함께 알고 있지 않습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “이로써 내가 무죄 판결을 받은 것은 아닙니다” 또는 “이로써 내가 옳다고 인정받은 것은 아닙니다.” 그리스어는 바울에게서 칭의와 관련하여도 쓰이는 법정 용어입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “나를 심문하시는 분” 또는 “나를 판단하시는 분.” 이 동사는 법정적 맥락에서 조사하고 평가하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision makes the self-accusation sense of ἐμαυτῷ σύνοιδα explicit in idiomatic Korean, retains the perfect-passive forensic expression δεδικαίωμαι, and renders ἀνακρίνων as scrutiny rather than a final judgment. Footnote markers are supplied in sequence and preserve the relevant lexical range without resolving disputed nuances.
