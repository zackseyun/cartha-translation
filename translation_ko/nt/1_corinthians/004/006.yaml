  - severity: low
    issue: ‘형제들이여’
    rationale: 의미는 맞지만 목표 문체인 현대 표준어 합쇼체에서는 ‘형제 여러분’이 더 자연스럽습니다. 남성형 호칭이 혼성 청중을 가리킬 수 있다는 점은 각주로 처리할 수 있습니다.
  - severity: medium
    issue: 인용구의 원문 타원성에 관한 주석 부재
    rationale: τό· Μὴ ὑπὲρ ἃ γέγραπται는 문자적으로 압축된 표현이며 격언 또는 표어일 가능성이 있어, 명령형 번역을 유지할 경우 각주가 독자의 과도한 확정을 막습니다.
