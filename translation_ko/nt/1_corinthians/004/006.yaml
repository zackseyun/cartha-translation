review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 μετεσχημάτισα는 단순히 ‘적용해 말하다’보다 앞선 논의를 바울 자신과 아볼로에게 비유적으로 옮겨 적용한 행위를 가리키므로, 한국어에서는 ‘빗대어 말했습니다’가 더 자연스럽고 정확합니다. 또한 목적절의 관계를 분명히 하고, ἐν ἡμῖν의 압축된 표현은 ‘우리에게서’로 보존했습니다.
  naturalness: ‘형제들이여’와 ‘적용해 말한 것은’은 현대 표준어 합쇼체에서 다소 문어적·경직되어 보입니다. ‘형제 여러분’ 및 두 문장으로 나눈 서술이 현대적이고 자연스럽습니다. ‘다른 사람에 대하여 교만해지다’도 ‘다른 사람을 대적하며 교만해지다’로 고치면 원문의 대립 관계가 더 분명합니다.
  terminology: 아볼로, 기록된 것, 교만은 적절합니다. 다만 φυσιοῦσθε의 반복되는 비유적 어감을 고려해 ‘교만해지다’를 유지하되, 원문의 ‘한 사람을 위하여 다른 사람을 거슬러’라는 파당적 대립을 ‘한 사람을 편들어 다른 사람을 대적하며’로 명료하게 옮겼습니다. 인용구는 원문이 타원적이고 해석상 논쟁이 있으나, 영어 POB의 채택 읽기를 따라 명령형으로 유지하고 각주로 타원성을 밝혔습니다.
  issues:
