  text: 여러분은 이미 배부르며, 이미 부유해졌고, 우리 없이 통치하게 되었습니다. 참으로 여러분이 통치하고 있다면 좋겠습니다. 그러면 우리도 여러분과 함께 통치할 수 있을 것입니다.
  philosophy: optimal-equivalence
