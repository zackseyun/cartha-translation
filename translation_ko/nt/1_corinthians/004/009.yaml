review_pass:
  verdict: revise
  source_fidelity: ‘가장 끝에 두셔서 … 드러내셨습니다’는 ἐσχάτους와 ἀπέδειξεν을 두 개의 별도 행위처럼 처리합니다. 원문은 하나님께서 사도들을 ‘가장 마지막 자들로’ 공개적으로 내보이셨다는 한 행위를 말합니다. 또한 ‘곧 천사들에게도 사람들에게도’는 세상을 천사와 사람으로 풀이하는 인상을 줄 수 있으나, καὶ … καὶ는 덧붙이는 병렬입니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, ‘구경거리’는 공개적 관람의 대상이라는 θέατρον의 비유를 간결하게 살립니다.
  terminology: ‘사도들’, ‘하나님’, ‘천사들’은 적절합니다. ἐπιθανατίους는 ‘사형 선고를 받은 사람들’로 옮겨 죽음에 넘겨진 사람이라는 뜻을 무리 없이 전달합니다.
  issues:
  - severity: medium
    issue: ‘가장 끝에 두셔서 … 드러내셨습니다’의 이중 동작화
    rationale: ἐσχάτους는 ἀπέδειξεν의 목적어를 수식하며, 하나님이 사도들을 ‘가장 마지막 자들로’ 드러내셨다는 뜻입니다. ‘두셔서’는 원문에 없는 별도 선행 행위를 만들 수 있습니다.
  - severity: low
    issue: ‘곧 천사들에게도 사람들에게도’의 설명적 연결
    rationale: 원문의 ‘세상과 천사들과 사람들에게’는 병렬적 수신자/관람자 표현입니다. ‘곧’은 세상과 뒤의 두 대상을 동격적으로 풀이하는 뉘앙스를 더합니다.
  revised_text: 내가 생각하기에, 하나님께서 우리 사도들을 사형 선고를 받은 사람들처럼 가장 마지막 자들로 드러내셨습니다. 이는 우리가 세상과 천사들과 사람들에게 구경거리가 되었기 때문입니다.
  revised_footnotes: []
