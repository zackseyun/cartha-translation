  source_fidelity: ‘심판’은 ἀνακρίνω가 지닌 조사·심사·평가의 뜻을 최종적 판결이나 정죄의 뜻으로 좁힐 수 있습니다. 이 절에서 같은 동사가 두 번 사용된 점을 살려 ‘평가’로 일관되게 옮기는 것이 더 적절합니다. ἀνθρωπίνης ἡμέρας는 직역하면 ‘인간의 날’인 관용구이므로, 본문의 자연스러운 뜻풀이와 함께 각주에서 원문 표현을 밝혀야 합니다.
  naturalness: ‘나에게는 … 사소한 일입니다’와 ‘나 자신도 나를 …하지 않습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 ‘인간 법정에 의해’보다 ‘사람의 법정에서’가 한국어 문장 흐름에 더 자연스럽습니다.
  terminology: ‘사람의 법정’은 영어 POB의 ‘human court’를 따라 관용구의 의미를 전달합니다. ‘평가받다/평가하다’는 ἀνακρίνω의 신중한 심사·검토의 의미를 유지하며, 인접 문맥의 최종 심판 언어와 불필요하게 동일시하지 않습니다.
