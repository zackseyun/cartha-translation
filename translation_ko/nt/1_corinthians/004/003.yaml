translation:
  language: ko
  text: 그러나 나에게는 여러분에게서나 사람의 법정[a]에서 평가받는 것이 지극히 사소한 일입니다. 오히려 나는 나 자신도 평가하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
