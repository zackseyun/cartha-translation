  to: 이 때문에 내가 디모데를 여러분에게 보냈습니다. 그는 주님 안에서 내가 사랑하는 신실한 자녀이며, 메시아 예수 안에서 내가 살아가는 방식을 여러분에게 생각나게 해 줄 것입니다. 이는 내가 어디서나 모든 교회에서 가르치는 바와 같습니다.
  rationale: 문법적으로 모호하거나 부자연스러운 표현을 바로잡고, 원문의 관계절과 καθὼς 절을 한국어에서 명료하게 분리했습니다. ‘메시아 예수’는 제공된 영어 POB의 정책과 원문의 Χριστός의 칭호적 의미를 따랐습니다.
