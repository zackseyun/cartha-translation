id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
  footnotes:
  - marker: a
    text: Or 'my beloved and faithful son in the Lord.' The Greek τέκνον more literally means 'child,' though in context it can be rendered 'son.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in Christ Jesus.' The Greek title Χριστός is rendered 'Messiah' here to preserve its meaning.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 내가 디모데를 여러분에게 보냈습니다. 그는 주님 안에서 내가 사랑하는 신실한 자녀이며, 메시아 예수 안에서 내가 살아가는 방식을 여러분에게 생각나게 해 줄 것입니다. 이는 내가 어디서나 모든 교회에서 가르치는 바와 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνον ἀγαπητὸν καὶ πιστὸν
  english_pob_choice: beloved and faithful child
  chosen_korean: 사랑하고 신실한 내 자녀
  alternatives_korean:
  - 사랑받고 미더운 내 자녀
  lexicon: BDAG
  rationale: 15절 부성 비유 연장.
- source_word: τὰς ὁδούς μου τὰς ἐν Χριστῷ
  english_pob_choice: my ways in Messiah
  chosen_korean: 메시아 안에서의 내 행보
  alternatives_korean:
  - 메시아 안에서 내가 사는 길
  lexicon: BDAG
  rationale: ὁδοί는 가르침·삶의 방식 전체.
- source_word: ἐν πάσῃ ἐκκλησίᾳ
  english_pob_choice: in every church
  chosen_korean: 모든 교회에서
  alternatives_korean:
  - 모든 회중에서
  lexicon: BDAG
  rationale: '1:2의 글로사리 카브아웃과 일관: 본 서신에서 ἐκκλησία를 「교회」로 옮긴다.'
