  source_fidelity: 핵심 의미는 대체로 충실하나, 원문의 관계절(‘오실 주께서’)을 ‘주께서 오실 때까지 그러하니’로 옮긴 부분은 한국어로 부자연스럽고 문장 구조도 불분명합니다. 또한 βουλάς와 καρδιῶν의 복수는 ‘마음의 의도’보다 ‘마음들의 계획들’ 또는 자연스러운 집합 표현인 ‘마음속 계획들’로 더 잘 드러낼 수 있습니다.
  naturalness: ‘주께서 오실 때까지 그러하니’는 현대 표준어 합쇼체 성경 문장으로 자연스럽지 않습니다. 금지의 시간적 한계를 ‘주께서 오실 때까지’로 앞 절에 직접 연결하고, 뒤에 주님의 드러내심을 관계절에 해당하는 독립절로 이어 주는 편이 명료합니다.
  terminology: ‘주’, ‘하나님’, ‘칭찬’은 적절합니다. τὰ κρυπτὰ τοῦ σκότους는 ‘어둠의 감추어진 것들’로 옮겨 소유격적 연결과 은유를 보존했습니다. βουλάς는 단순한 심리 상태보다 숙고된 의도·계획의 뜻이므로 ‘마음속 계획들’로 수정했습니다.
  issues:
  - severity: medium
    issue: ‘주께서 오실 때까지 그러하니’라는 연결
    rationale: 원문의 ἕως ἂν ἔλθῃ ὁ κύριος는 ‘아무것도 판단하지 말라’는 명령의 시간적 한계입니다. 초안의 ‘그러하니’는 지시 대상이 불분명하고 관계절의 기능도 자연스럽게 전달하지 못합니다.
  - severity: low
    issue: ‘마음의 의도’의 단·복수 및 어휘 범위
    rationale: τὰς βουλὰς τῶν καρδιῶν은 복수이며 βουλή는 의도뿐 아니라 계획·숙고를 가리킵니다. ‘마음속 계획들’은 한국어 자연스러움을 유지하면서 그 범위를 보존합니다.
  revised_text: 그러므로 주께서 오실 때까지, 때가 이르기 전에 아무것도 판단하지 마십시오. 주께서는 또한 어둠의 감추어진 것들을 빛으로 드러내시고 마음속 계획들을 나타내실 것입니다. 그때에 각 사람에게 하나님으로부터 칭찬이 있을 것입니다.
