review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 「주께서 오실 때까지 그러하니」는 헬라어의 시간 한정(ἕως ἂν ἔλθῃ)을 자연스럽게 옮기지 못하며, 앞 문장과의 연결도 부자연스럽습니다. 「때가 되기 전에」는 πρὸ καιροῦ의 의미 범위 안에 있으나, 문맥상 ‘정한 때’라는 시간적 한정을 명확히 드러내는 편이 좋습니다.
  naturalness: 합쇼체는 유지되었으나 「주께서 오실 때까지 그러하니」는 현대 표준어 문장으로 어색합니다. 이를 「주께서 오실 때까지는 … 판단하지 마십시오」로 통합하면 자연스럽고 원문의 통사 관계도 보존됩니다.
  terminology: 「주」, 「하나님」, 「칭찬」은 적절합니다. 「어둠 속에 감추인 것들」도 가능한 번역이나, 「어둠에 감추어진 것들」이 원문의 ‘어둠의 감추어진 것들’이라는 표현을 더 직접적으로 보존하면서 자연스럽습니다. 「마음의 의도」는 βουλάς의 복수성과 각 개인의 내적 의도를 모두 감당할 수 있습니다.
  issues:
  - severity: medium
    issue: 「주께서 오실 때까지 그러하니」의 문장 연결
    rationale: 원문에서 ‘주께서 오실 때까지’는 ‘판단하지 마십시오’를 시간적으로 한정합니다. 현 번역의 별도 서술 「그러하니」는 그 관계를 불명료하고 부자연스럽게 만듭니다.
  - severity: low
    issue: πρὸ καιροῦ의 시간적 한정이 다소 약하게 드러남
    rationale: 「때가 되기 전에」도 가능하지만, 여기서 καιρός는 단순한 시점보다 적절한 때를 가리킵니다. 「정한 때가 이르기 전」은 이를 과도한 해석 없이 한국어로 분명히 합니다.
  revised_text: 그러므로 주께서 오실 때까지는, 정한 때가 이르기 전에 아무것도 판단하지 마십시오. 주께서는 어둠에 감추어진 것들을 빛 가운데로 드러내시고 마음의 의도를 나타내실 것입니다. 그때에 각 사람은 하나님께로부터 칭찬을 받을 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘때가 이르기 전에’ 또는 ‘너무 이르게’. 그리스어 표현은 적절하거나 정해진 때보다 앞서 행하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마음의 뜻들’, ‘마음의 동기들’.
    reason: lexical_alternative
  revision_rationale: 시간 절을 금지 명령에 직접 연결하여 원문의 문법과 논리적 흐름을 보존했습니다. ‘정한 때’는 καιρός의 문맥적 뉘앙스를 한국어로 드러내되, 그 때의 성격을 교리적으로 확대하지 않습니다. 두 병행 동사(‘빛 가운데로 드러내시고’/‘나타내실 것입니다’)와 마지막의 하나님으로부터 오는 각 사람의 칭찬도 유지했습니다.
