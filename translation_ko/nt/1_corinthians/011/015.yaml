  text: 여자가 긴 머리를 하고 있으면, 그것이 그 여자에게 영광이 됩니다. 긴 머리가 가리개 대신에 그 여자에게 주어졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「대신에」(ἀντί)는 대체나 상응의 관계를 나타낼 수 있습니다. 긴 머리 자체가 가리개로 기능한다고 보는 해석과, 긴 머리가 가리개와 관련하여 주어졌다고 보는 해석 모두 이 표현만으로는 배제되지 않습니다.
