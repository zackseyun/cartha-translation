  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
  footnotes:
  - marker: a
    text: Or 'as a covering.' The Greek preposition can express correspondence or substitution; the phrase does not by itself settle whether Paul means hair functions as the covering or is given in relation to one.
    reason: lexical_alternative
  - marker: b
    text: The Greek word can mean 'woman' or 'wife' depending on context.
    reason: lexical_alternative
