    rationale: Replace '그래야' with '드러나게 되도록' to provide modern formal-polite wording and preserve the Greek purpose/result nuance without defining the source of the stated necessity.
  - severity: low
    issue: Natural contemporary rendering of δόκιμοι
    rationale: '''인정받은 사람들'' is more natural than ''인정받은 자들'' in modern standard Korean while retaining the meaning of persons shown to be genuine/approved.'
  revised_text: 여러분 가운데에는 파당들도 있어야 합니다. 이는 인정받은 사람들이 여러분 가운데 드러나게 되도록 하기 위함입니다.
