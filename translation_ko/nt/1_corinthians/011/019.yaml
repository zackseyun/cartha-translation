  source_fidelity: The draft accurately renders αἱρέσεις as internal factions and retains δεῖ and the repeated communal setting. However, '그래야' is somewhat colloquial and can sharpen the clause into a merely necessary condition; a more formal purpose/result expression better reflects ἵνα while retaining the ambiguity of the necessity.
  naturalness: The wording is generally clear, but '인정받은 자들' is less natural in contemporary formal Korean than '인정받은 사람들,' and '그래야' is less suited to the requested formal register.
  terminology: '''파당'' appropriately avoids importing the later doctrinal sense of ''heresy'' into αἱρέσεις. ''인정받은 사람들'' suitably conveys δόκιμοι without prematurely specifying by whom they are approved.'
  issues:
