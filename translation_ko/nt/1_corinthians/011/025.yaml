  source_fidelity: 수정이 필요합니다. 초안의 「내 피로 세워진」은 ἐν τῷ ἐμῷ αἵματι(직역하면 ‘내 피 안에/내 피로 말미암는’)를 ‘세워진’이라는 동사와 수단적 의미로 구체화합니다. 이는 문맥상 가능한 해석이지만, 원문의 직접적인 표현과 의도적으로 남아 있는 신학적 긴장을 충분히 보존하지 못합니다. 또한 ὡσαύτως καὶ의 병렬·첨가 의미는 「이와 같이 또」로 드러내는 편이 낫습니다.
  naturalness: 「이와 같이, 식사 후에 또 잔을 드시며 말씀하셨습니다」는 현대 표준어 서술문으로 자연스럽습니다. 인용문은 요청된 현대 합쇼체에 맞추어 「행하십시오」로 옮겼습니다.
  terminology: διαθήκη는 예레미야 31장 및 성찬 제정 문맥에 맞게 「새 언약」으로 유지합니다. ποτήριον은 평이한 「잔」으로, ἀνάμνησις는 「나를 기억하도록」으로 번역하여 기념/기억의 목적을 보존합니다.
  issues:
