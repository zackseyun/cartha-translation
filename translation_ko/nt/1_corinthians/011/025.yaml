  rationale: 원문의 어순과 의미 관계를 가능한 한 보존하면서 현대 표준어 합쇼체로 다듬었습니다. 특히 ‘내 피 안에 있는’은 자연스러움에 다소 긴장이 있으나, ‘내 피로 세워진/맺어진’처럼 원문에 없는 인과·수단 관계를 확정하지 않기 위해 유지했습니다. 반복적 상황을 나타내는 ὁσάκις ἐὰν은 「마실 때마다」로, 현재 명령 ποιεῖτε는 「행하십시오」로 옮겼습니다.
