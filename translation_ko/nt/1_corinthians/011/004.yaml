  naturalness: ‘머리에 무엇을 쓰고’도 이해되지만 ‘머리에 무엇인가를 쓴 채’가 현대 표준 한국어에서 더 자연스럽고, 기도·예언 행위가 이루어지는 상태를 더 분명히 나타냅니다. 각주 표지는 해당 표현 바로 뒤에 두는 것이 적절합니다.
  terminology: ‘예언하다’와 ‘욕되게 하다’는 본문에 적합합니다. 각주에서 ‘면사’는 문맥상 부정확하거나 오기로 보이므로 제거해야 합니다. 11:3을 언급할 때는 통상적인 명칭인 ‘그리스도’를 쓰고, 본문이 가리키는 바를 단정하지 않도록 ‘일 수 있다’로 표현합니다.
