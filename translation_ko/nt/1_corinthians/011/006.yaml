  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 κατακαλύπτεται를 '머리를 가리다'로, κείρασθαι와 ξυρᾶσθαι의 구별을 각각 '깎다/밀다'로 대체로 적절히 옮겼습니다. 그러나 첫 절의 καί('또한')가 반영되지 않았고, κείρασθαι의 머리를 짧게 자르거나 깎는 뜻을 더 분명히 할 필요가 있습니다.
  naturalness: 합쇼체는 유지되어 있으나, '그 여자도'와 '짧게 깎다'를 넣으면 바울의 수사적 귀결을 더 자연스럽고 명료하게 전달합니다. '밀어 버리다'는 삭발의 의미를 자연스러운 현대 표준어로 나타냅니다.
  terminology: γυνή는 본문에서 '여자'로 유지하고, '아내' 가능성은 각주로 보존합니다. κατακαλύπτω는 특정 의복을 단정하지 않는 '머리를 가리다'가 적절합니다. αἰσχρόν은 사회적 수치의 뜻을 살려 '수치스럽다'로 옮깁니다.
