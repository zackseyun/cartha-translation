- from: 여자가 머리를 가리지 않는다면 머리를 깎으십시오. 여자가 머리를 깎거나 미는 것이 부끄럽다면 머리를 가리십시오.[a]
  to: 여자가[a] 머리를 가리지 않는다면, 그 여자도 머리를 짧게 깎으십시오. 그러나 여자가 머리를 짧게 깎거나 밀어 버리는 것이 수치스럽다면, 머리를 가리십시오.[b]
  rationale: καί를 '그 여자도'로 반영하고, κείρω와 ξυράω의 대비를 '짧게 깎다/밀어 버리다'로 명확히 했습니다. γυνή의 '아내' 가능성과 κατακαλύπτω의 '베일을 쓰다'라는 대안은 각주에 보존하여 본문의 문맥적 선택과 어휘적 여지를 함께 제시했습니다.
