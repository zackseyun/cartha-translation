id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
  footnotes:
  - marker: a
    text: Or 'wife' throughout the verse; Greek gynē can mean either 'woman' or 'wife' depending on context.
    reason: alternative_reading
  - marker: b
    text: The verb can also be rendered 'be veiled'; the Greek speaks of being covered, with the head covering implied by the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 여자가[a] 머리를 가리지 않는다면, 그 여자도 머리를 짧게 깎으십시오. 그러나 여자가 머리를 짧게 깎거나 밀어 버리는 것이 수치스럽다면, 머리를 가리십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「여자」(γυνή)는 문맥에 따라 「아내」로도 번역될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘가리다’ 또는 ‘베일을 쓰다’로도 옮길 수 있습니다. 머리를 가린다는 뜻은 문맥에서 드러납니다.
    reason: lexical_alternative
