review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the self-examination and eating/drinking, but it adds a restrictive temporal sense in ‘그렇게 한 후에야’ (‘only after doing so’) that is not expressed by οὕτως, which means ‘thus/in this way.’ ‘그러므로’ also supplies an inferential connection stronger than δέ (‘but/now’).
  naturalness: The revised wording is natural standard Korean in modern formal-polite register. ‘자신을 살피고’ is more idiomatic and contextually fitting for δοκιμαζέτω than the procedural-sounding ‘자기 자신을 점검하고.’
  terminology: ‘빵’ and ‘잔’ appropriately retain the concrete meal imagery. ‘그 잔에서 마시다’ reflects ἐκ τοῦ ποτηρίου (‘drink from the cup’) without importing sacramental interpretation.
  issues:
  - severity: medium
    issue: ‘그렇게 한 후에야’ adds an ‘only after’ temporal restriction.
    rationale: οὕτως denotes manner (‘thus/in this way’), not an exclusive temporal condition. The Korean should retain the source’s open connection between self-examination and participation.
  - severity: low
    issue: ‘그러므로’ overstates δέ.
    rationale: δέ is adversative or transitional here; ‘그러나’ is a closer Korean rendering.
  revised_text: 그러나 사람은 자신을 살피고, 그렇게 하여 그 빵을 먹고 그 잔에서 마셔야 합니다.
