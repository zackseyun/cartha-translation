    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 여러분이 알기를 바랍니다. 모든 남자의 머리는 메시아이시며,[a] 여자의 머리는 남자이며,[b] 메시아의 머리는 하나님이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「머리」(κεφαλή)는 권위 또는 근원으로 이해되기도 합니다. 본문은 이 비유를 그대로 보존하며 그 의미를 단정하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 「여자」와 「남자」(γυνή / ἀνήρ)는 문맥에 따라 「아내」와 「남편」으로도 읽힐 수 있습니다.
    reason: alternative_reading
