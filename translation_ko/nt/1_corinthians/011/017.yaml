theological_decisions:
- issue: 11:17-34 주의 만찬 본문 — 회중 분열에 대한 책망과 만찬 전통의 엄숙성
  chosen_reading: 회중 가난한 자들을 무시한 채 자기 식사를 먼저 먹는 일이 주의 만찬의 본질을 무너뜨림을 책망하는 본문. 만찬 자체의 엄숙성은 23-26절의 전통 인용으로, 회중적 적용은 27-32절의 자기 점검 권면으로 살린다.
  alternative_readings:
  - 단순한 식사 예절 권면
  rationale: 본문은 「함께 모임」이 십자가의 몸과 가난한 형제를 함께 분별하는 자리임을 전제한다. 한국어 본문에서도 엄숙성과 회중적 무게를 유지한다.
  doctrine_reference: 'DOCTRINE.md: preserve Eucharistic gravity without flattening to one tradition'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존되어 있으나, 원문의 반복 동사 συνέρχεσθε(‘모이다’)와 ‘더 나음/더 나쁨’을 이루는 결과적 대조를 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: ‘지시를 주면서’는 이해되지만 현대 표준 한국어의 격식 있는 문장에서는 ‘지시를 내리면서’가 더 자연스럽습니다. 또한 ‘함께 모이는 일이 … 되기’보다 ‘모일 때에 … 되다’가 원문의 직접성과 문장 흐름을 살립니다.
  terminology: παραγγέλλων은 여기서 ‘지시를 내리다’로 옮기는 것이 권위 있는 지침의 어조를 유지하면서도 불필요하게 강한 ‘명령’으로 한정하지 않습니다. ἐπαινῶ의 ‘칭찬하다’도 적절합니다.
  issues:
  - severity: low
    issue: ‘지시를 주면서’의 어색한 결합
    rationale: 의미상 문제는 없지만, 현대 격식체에서는 ‘지시를 내리면서’가 더 자연스럽고 관용적입니다.
  - severity: medium
    issue: 집회의 결과를 ‘모이는 일이 … 되다’로 우회적으로 표현함
    rationale: συνέρχεσθε가 문장에서 직접 반복되는 점과 εἰς τὸ κρεῖσσον/ἧσσον의 ‘더 나아짐/더 나빠짐’ 대조를 살리려면, 모일 때의 결과로 명시하는 것이 더 충실합니다.
  revised_text: 그러나 이 지시를 내리면서, 나는 여러분을 칭찬하지 않습니다. 여러분이 모일 때에 더 나아지게 되는 것이 아니라 더 나빠지게 되기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘이 명령을 내리면서.’ 그리스어 동사는 지시, 지침, 또는 명령을 내리는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 대조 접속사와 현재형 ‘모이다’를 유지하고, 모임이 더 나은 결과가 아니라 더 나쁜 결과를 낳는다는 εἰς의 결과적 용법을 자연스러운 합쇼체로 명확히 했습니다. 영어 POB의 παραγγέλλων 관련 어휘 대안도 각주로 보존했습니다.
