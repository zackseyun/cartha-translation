revisions:
- from: 이런 까닭에 여자는 천사들로 인해 자기 머리에 권위를 두어야 합니다.[a][b]
  to: 그러므로 여자는 천사들 때문에 자기 머리 위에 권위를 지녀야 합니다.[a][b]
  rationale: 본문은 ἐξουσία를 ‘권위’로, ἔχειν을 ‘지니다’로 옮겨 해석적 확장을 피했습니다. ‘천사들 때문에’는 διὰ와 대격의 이유·근거 용법을 자연스럽게 반영합니다. 각주는 논쟁적인 ‘권위’ 구문의 해석적 번역과 ἀγγέλους의 어휘적 가능성만 제시하여, 본문에 없는 역사적·신학적 이론을 덧붙이지 않습니다.
