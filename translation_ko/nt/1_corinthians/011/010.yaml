    rationale: ἔχειν은 여기서 ‘가지다/지니다’이며, ‘두다’는 권위를 어떤 장소에 놓는다는 인상을 주어 한국어 문법·의미상 부자연스럽습니다.
  - severity: low
    issue: 각주 b가 ‘천사들’의 가능한 어휘적 대안 대신 여러 추측적 해석을 제시합니다.
    rationale: ἀγγέλους의 핵심 번역상 쟁점은 ‘천사들/전령들’입니다. 예배 천사나 창세기 6장의 존재라는 특정 이론들은 원문이 명시하지 않으며, 어휘 대안 각주로 적절하지 않습니다.
  - severity: low
    issue: 각주 a의 ‘의도적으로 모호하다’는 표현은 본문이 저자의 의도를 명시한 것처럼 들립니다.
