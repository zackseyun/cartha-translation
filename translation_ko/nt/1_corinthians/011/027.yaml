  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'will be guilty of the body and blood of the Lord.' The Greek construction can be rendered more literally this way; 'concerning' is used in the main text to clarify the sense of liability with respect to the Lord's body and blood.
    reason: lexical_alternative
  - marker: b
    text: '''In an unworthy manner'' translates an adverb and describes how one eats or drinks, not the intrinsic worth of the person.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 누구든지 합당하지 않게[b] 빵을 먹거나 주의 잔을 마시면, 주의 몸과 피에 대하여 죄를 범하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, 「주의 몸과 피에 죄가 있을 것입니다.」 헬라어 표현은 이와 같이 더 문자적으로 옮길 수 있습니다. 본문은 주의 몸과 피에 관련하여 죄책 또는 책임이 있음을 분명히 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 「합당하지 않게」는 부사로서 먹고 마시는 방식를 가리키며, 참여자 자체의 내재적 가치를 가리키는 것은 아닙니다.
    reason: lexical_alternative
