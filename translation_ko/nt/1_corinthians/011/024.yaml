    rationale: ποιεῖτε는 이 문맥에서 계속적·반복적 실천을 나타내며, εἰς ἀνάμνησιν은 ‘나를 기억하여/기념하여’라는 정형적 기념 표현으로 자연스럽게 옮길 수 있습니다.
  - severity: low
    issue: 「감사 기도」는 원문이 명시하지 않은 기도 형식을 다소 구체화합니다.
    rationale: εὐχαριστήσας는 ‘감사드린’이라는 뜻이며, 한국어 본문에서는 이를 직접적으로 옮기는 편이 안전합니다.
