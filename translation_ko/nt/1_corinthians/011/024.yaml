revisions:
- from: 감사 기도를 드리신 후에 빵을 떼시고 말씀하셨습니다. 「이것은 너희를 위한 내 몸이다. 너희는 나를 기억하기 위해 이것을 행하라.」[a]
  to: 감사드리신 후에 떡을 떼시고 말씀하셨습니다. 「이것은 너희를 위한[a] 내 몸입니다. 나를 기억하여 이것을 계속 행하십시오.」
  rationale: 원문의 어휘와 문법을 우선하여, εὐχαριστήσας를 불필요한 의례적 구체화 없이 「감사드리신 후」로, 현재 명령법 ποιεῖτε를 「계속 행하십시오」로 옮겼습니다. ἀνάμνησις 구절은 한국어에서 자연스러운 기념·기억의 표현인 「나를 기억하여」로 번역했습니다. 변이 독법 ‘떼어진’은 SBLGNT 본문에 없으므로 각주에만 두고, 표지를 변이 발생 지점에 배치했습니다.
