  source_fidelity: 개정이 필요합니다. 원문의 현재 명령법 ποιεῖτε는 지속적·반복적 실천을 가리키므로, 단순한 「행하라」보다 「계속 행하십시오」가 이를 더 충실히 드러냅니다. εἰς τὴν ἐμὴν ἀνάμνησιν은 「나를 기억하기 위해」보다 관용적이며 목적론적 뉘앙스를 덜 보태는 「나를 기억하여」로 옮기는 것이 적절합니다.
  naturalness: 「감사 기도를 드리신 후에」도 이해되지만, εὐχαριστήσας 자체는 특정한 ‘기도’의 형식을 명시하지 않으므로 「감사드리신 후」가 더 간결하고 원문에 가깝습니다. 표준어 현대 합쇼체에 맞추어 인용문도 「입니다/하십시오」로 통일했습니다.
  terminology: 성찬 문맥의 ἄρτος는 한국어 성경 및 교회 언어에서 널리 쓰이는 「떡」으로 옮겼습니다. 「이것은 … 내 몸입니다」는 원문의 직설적 계사 표현을 그대로 보존하며 성찬 교리에 관한 해석을 덧붙이지 않습니다. 본문에 없는 ‘떼어진’은 본문에 넣지 않고 해당 어구 바로 뒤의 본문비평 각주로 처리했습니다.
  issues:
