translation:
  language: ko
  text: 감사드리신 후에 떡을 떼시고 말씀하셨습니다. 「이것은 너희를 위한[a] 내 몸입니다. 나를 기억하여 이것을 계속 행하십시오.」
  philosophy: optimal-equivalence
  footnotes:
