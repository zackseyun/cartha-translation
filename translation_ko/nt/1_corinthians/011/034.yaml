review_pass:
  verdict: revise
  source_fidelity: ‘굶주린다면’는 πεινᾷ(배고프다)보다 강하며, ‘모임이 심판으로 이어지지’는 συνέρχησθε의 주어인 ‘여러분이 모이다’와 εἰς κρίμα의 경고를 다소 간접적으로 바꿉니다. 이를 바로잡으면 원문의 현재적 권면과 모임에 관련된 심판 경고가 더 충실히 드러납니다.
  naturalness: ‘누구든지 배고프면’과 ‘모일 때 심판을 받지 않도록’은 현대 표준 한국어 합쇼체에서 자연스럽고 명료합니다. ‘그 밖의 일들’도 Τὰ δὲ λοιπὰ를 자연스럽게 옮깁니다.
  terminology: κρίμα는 문맥상 현재의 징계적 심판을 포함하지만 최종적 정죄로 한정되지 않습니다. ‘심판’으로 유지하고, 각주에서 ‘정죄’라는 가능한 대안을 밝혀 원문의 의미 범위를 보존합니다.
  issues:
  - severity: medium
    issue: ‘굶주린다면’이 πεινᾷ보다 의미가 강함
    rationale: πεινάω는 여기서 ‘배고프다’라는 일반적 상태를 뜻하며, ‘굶주리다’는 심한 결핍 또는 기아의 뉘앙스를 더합니다.
  - severity: medium
    issue: ‘여러분의 모임이 심판으로 이어지지 않을 것입니다’가 원문의 인칭과 동작을 간접화함
    rationale: συνέρχησθε는 ‘여러분이 모이다’이며, εἰς κρίμα는 그 모임과 관련하여 심판을 받는 경고입니다. 이를 직접적으로 표현하는 편이 더 충실합니다.
  revised_text: 누구든지 배고프면 집에서 먹게 하십시오. 그래야 여러분이 모일 때 심판을 받지 않게 될 것입니다.[a] 그 밖의 일들은 내가 갈 때에 지시하겠습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘정죄를 받지 않게’. 그리스어 크리마(κρίμα)는 ‘심판’ 또는 ‘정죄’를 뜻할 수 있습니다. 여기서는 바울이 주의 현재의 심판과 징계를 말하는 문맥(29–32절)에 비추어 ‘심판’으로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 배고픔의 일반적 의미를 보존하고, 교회가 ‘모이는’ 행위와 그에 따른 심판이라는 원문의 문장 관계를 더 직접적으로 반영했습니다. κρίμα는 ‘심판’으로 번역하되, 각주에서 가능한 ‘정죄’의 의미를 밝혀 논쟁되는 신학적 함의를 단정하지 않았습니다.
