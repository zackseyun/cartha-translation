lexical_decisions:
- source_word: κρίμα
  english_pob_choice: judgment
  chosen_korean: 심판
  lexicon: BDAG
  rationale: 11:29와 일관된 어휘 사용. 종말적 정죄가 아니라 현재의 주의 징계 문맥(11:30-32).
review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 의미를 대체로 전달하지만, ‘여러분의 모임이 심판으로 이어지지’는 συνέρχησθε(함께 모이다)의 인칭·동작을 ‘모임’이라는 명사로 바꾸고, εἰς κρίμα의 결과적 경고를 다소 간접적으로 표현합니다. πεινᾷ는 ‘굶주리다’보다 일반적인 배고픔을 뜻합니다.
  naturalness: ‘배가 고프다면’이 현대 표준어에서 더 자연스럽고, ‘심판을 받게 되는 일이 없도록 함께 모이도록 하십시오’는 원문의 함께 모임과 경고의 관계를 자연스럽게 보존합니다. 합쇼체도 일관됩니다.
  terminology: κρίμα는 직전 문맥의 주님의 판단·징계와 연결되므로 ‘심판’이 적절합니다. ‘정죄’라는 가능한 대안은 본문에 명시되지 않은 종말론적 강도를 더할 수 있으므로 본문에는 채택하지 않고 각주로 처리합니다.
  issues:
  - severity: medium
    issue: ‘굶주린다면’의 어감
    rationale: πεινᾷ는 일반적으로 ‘배가 고프다’이며, ‘굶주리다’는 지속적 결핍이나 기아라는 더 강한 뉘앙스를 흔히 지닙니다.
  - severity: medium
    issue: ‘여러분의 모임이 심판으로 이어지지’의 구문
    rationale: 원문은 ‘여러분이 심판을 받게 되도록 함께 모이지 않게’라는 복수 청자들의 모임 행위를 말합니다. 수정안은 함께 모이는 동작과 심판의 결과를 더 직접적으로 드러냅니다.
  revised_text: 누구든지 배가 고프다면 집에서 먹게 하십시오. 그래야 여러분이 심판을 받게 되는 일이 없도록 함께 모이도록 하십시오. 나머지 일들은 내가 갈 때에 지시하겠습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘정죄’. 그리스어 ‘크리마’(κρίμα)는 ‘심판’ 또는 ‘정죄’를 뜻할 수 있습니다. 여기서는 바울이 주님의 현재의 판단과 징계에 관해 말하는 바로 앞 문맥(29–32절)에 비추어 ‘심판’으로 옮겼습니다.
    reason: κρίμα의 가능한 어휘적 대안을 제시하되, 본문 문맥상 ‘심판’이라는 번역을 유지합니다.
  revision_rationale: 일반적 배고픔을 뜻하는 πεινᾷ를 자연스러운 현대 한국어로 옮기고, συνέρχησθε의 ‘함께 모이다’와 εἰς κρίμα의 경고를 보존하도록 둘째 문장을 고쳤습니다. 다만 수정 문장의 ‘함께 모이도록 하십시오’는 앞선 ‘먹게 하십시오’와 함께 사도적 지시를 전달하며, 원문의 목적절을 한국어 합쇼체로 자연스럽게 표현합니다. κρίμα의 의미 범위는 각주에 남겨 해석상의 여지를 보존했습니다.
