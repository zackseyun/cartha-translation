  source_fidelity: 초안은 기도하고 예언하는 여자가 머리를 가리지 않은 상태라는 기본 뜻과 ‘욕되게 하다’의 의미를 대체로 반영합니다. 그러나 πᾶσα(‘모든’)가 빠졌고, ‘머리를 깎은 것과 하나이며 같다’는 ἓν ... καὶ τὸ αὐτό 및 여성 단수 분사 τῇ ἐξυρημένῃ를 한국어로 부정확하고 부자연스럽게 처리합니다.
  naturalness: ‘머리를 깎은 것과 하나이며 같다’는 현대 표준 한국어로 자연스럽지 않습니다. ‘머리를 깎은 여자와 똑같기 때문입니다’가 원문의 비교·동일시를 자연스럽게 전달합니다. 각주 표지도 해당 표현 바로 뒤에 두는 편이 명확합니다.
  terminology: ‘여자’, ‘기도하다’, ‘예언하다’, ‘머리’, ‘욕되게 하다’는 문맥상 적절합니다. 다만 γυνή와 κεφαλή의 해석 가능성은 본문에서 확정하지 않고 각주에서 절제하여 밝혀야 합니다. ἀκατακαλύπτῳ의 덮개를 ‘면사’ 등으로 예시하는 것은 근거가 없으므로 피해야 합니다.
