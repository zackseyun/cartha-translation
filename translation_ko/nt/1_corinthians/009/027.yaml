    rationale: ‘자격을 잃지 않으려는 것입니다’는 원문의 우려/목적을 대체로 전달하지만, 주절의 행동 목적을 직접 나타내는 ‘…되지 않도록’이 더 충실하고 자연스럽습니다.
  - severity: medium
    issue: ἀδόκιμος에 대한 ‘자격을 잃다’가 경기 비유를 충분히 드러내지 못합니다.
    rationale: ‘실격자가 되다’는 앞 문맥의 경기 비유 및 영어 POB의 ‘disqualified’를 더 명확히 반영하면서도 신학적 결론을 추가하지 않습니다.
