revisions:
- from: 도리어 나는 내 몸을 쳐서 노예로 부립니다. 다른 사람들에게 선포한 후에 내 자신이 자격을 잃지 않으려는 것입니다.
  to: 그러나 나는 다른 이들에게 전파한 뒤에 나 자신이 실격자가 되지 않도록, 내 몸을 쳐서 노예로 부립니다.[a][b]
  rationale: 주절과 μή πως 목적절의 관계를 직접 드러내고, ἀδόκιμος를 운동 경기 문맥에 맞게 ‘실격자가 되다’로 수정했습니다. ‘쳐서’와 ‘노예로 부리다’는 원문의 강한 은유를 유지하며, 역주로 ὑπωπιάζω의 문자적 배경과 비유성을 밝혔습니다.
