review_pass:
  verdict: revise
  source_fidelity: 초안은 σῶμα를 ‘몸’으로, δουλαγωγῶ를 ‘노예로 부리다’로 보존하고 ἀδόκιμος의 경기 비유를 ‘자격을 잃다’로 대체로 잘 전달합니다. 그러나 μή πως의 목적·우려 절은 ‘…않으려는 것입니다’보다 ‘…되지 않도록’이 더 직접적이며, ἀδόκιμος는 ‘실격자가 되다’가 문맥의 운동 경기 비유와 ‘disqualified’를 더 정확히 반영합니다.
  naturalness: ‘도리어’도 가능하지만, 이 문맥의 강한 대조에는 현대 표준어에서 ‘그러나’가 더 자연스럽습니다. 목적절을 본문의 행위에 직접 연결하면 문장이 더 매끄럽고, 불필요하게 설명적인 ‘것입니다’를 피할 수 있습니다.
  terminology: ‘내 몸’, ‘노예로 부리다’, ‘전파하다’, ‘실격자가 되다’를 사용했습니다. ‘실격자’는 구원의 상실이나 단지 사역의 무용함이라는 신학적 쟁점을 결정하지 않은 채, 문맥상 경기의 승인·탈락 이미지를 유지합니다.
