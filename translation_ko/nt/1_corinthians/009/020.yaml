  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
  footnotes:
  - marker: a
    text: Or 'gain'; the verb can mean to gain or win over.
    reason: lexical_alternative
  - marker: b
    text: '''The law'' here most likely refers to the Mosaic law.'
    reason: cultural_note
translation:
  language: ko
  text: 유대인들에게는 유대인처럼 되었습니다. 유대인들을 얻기 위해서입니다[a]. 율법[b] 아래 있는 이들에게는, 나 자신은 율법 아래 있지 않으나, 율법 아래 있는 사람처럼 되었습니다. 율법 아래 있는 이들을 얻기 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얻어 내기 위해서입니다’; 이 동사는 ‘얻다’ 또는 ‘설득하여 자기편으로 얻다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘율법’은 가장 자연스럽게는 모세 율법을 가리킵니다.
    reason: cultural_note
