  source_fidelity: 첫 문장의 ‘그것은’은 헬라어에 없는 지시 대상을 보충하며, καύχημα는 ‘자랑할 거리/근거’로 직접 옮기는 편이 낫습니다. ἀνάγκη는 단순한 논리적 ‘필연’보다 ‘부과된 필요/강요’의 뜻이므로 ‘필연’은 부정확합니다. 마지막 문장은 미래적 결과(‘화가 미칠 것입니다’)보다 원문의 현재적 감탄·선언인 ‘내게 화가 있습니다’로 옮겨야 합니다.
  naturalness: ‘내게는 ... 부과되어 있습니다’와 ‘내게 화가 있습니다’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘화’는 성경적·예언적 엄숙성을 유지합니다.
  terminology: εὐαγγελίζωμαι/εὐαγγελίσωμαι는 두 번 모두 ‘복음을 전하다’로 일관되게 옮겼습니다. καύχημα는 ‘자랑할 근거’, ἀνάγκη는 ‘반드시 해야 할 일이 부과되어 있음’으로, οὐαί는 ‘화’로 옮겨 원문의 의미 범위와 격조를 보존했습니다.
  issues:
