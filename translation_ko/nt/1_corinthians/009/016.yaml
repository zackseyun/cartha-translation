    rationale: ‘필연’은 사태의 불가피성이나 논리적 필연성을 주로 뜻하여, 바울에게 가해진 강제적 필요·의무라는 원문의 힘을 충분히 나타내지 못합니다.
  - severity: medium
    issue: οὐαί 절을 ‘나에게 화가 미칠 것입니다’로 미래화함
    rationale: 원문 οὐαί ... ἐστιν은 조건 아래의 현재적 화 선언/감탄입니다. ‘미칠 것입니다’는 원문에 없는 미래적 결과를 덧붙입니다.
