review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 목적 표현은 대체로 잘 옮겼습니다. 그러나 마지막의 ‘썩지 않을 것’은 그리스어에서 생략된 명사 στέφανον(면류관)을 한국어에서는 자연스럽고 분명하게 보충하는 편이 좋습니다. ‘모두 모든 일에’도 πᾶς와 πάντα를 중복되어 어색하게 드러냅니다.
  naturalness: ‘경기에 출전하는 사람마다 모든 면에서 절제합니다’가 현대 표준어 합쇼체로 더 자연스럽습니다. 두 절의 목적을 ‘받으려고’로 병렬시키면 원문의 대조가 선명해집니다.
  terminology: ‘면류관’은 στέφανος의 정착된 성경 번역어로 유지할 수 있습니다. 다만 이 문맥에서는 운동 경기의 승리 화관을 가리키므로 그 점을 각주로 밝혀야 합니다. ‘썩어 없어질/썩지 않을’은 φθαρτός/ἄφθαρτος의 대조를 보존합니다.
  issues:
  - severity: medium
    issue: 마지막 명사가 ‘것’으로 처리됨
    rationale: ἡμεῖς δὲ ἄφθαρτον에는 앞 절의 στέφανον이 생략되어 있습니다. 한국어의 ‘썩지 않을 것’은 무엇을 가리키는지 다소 불명확하므로 ‘썩지 않을 면류관’을 보충하는 것이 자연스럽고 의미를 명료하게 합니다.
  - severity: low
    issue: ‘모두 모든 일에’의 중복과 부자연스러움
    rationale: πᾶς와 πάντα를 각각 ‘모두’와 ‘모든 일에’로 연달아 옮기면 한국어 문장이 어색합니다. ‘사람마다’와 ‘모든 면에서’로 옮기면 두 범위를 보존하면서도 자연스럽습니다.
  - severity: medium
    issue: στέφανος의 운동 경기 의미에 관한 각주 누락
    rationale: ‘면류관’은 한국어에서 왕관 또는 종말론적 보상의 연상을 강하게 줄 수 있습니다. 본문의 운동 비유에서 승자에게 주는 화관이라는 어휘적 의미를 각주로 밝혀야 합니다.
  revised_text: 경기에 출전하는 사람마다 모든 면에서 절제합니다. 그들은 썩어 없어질 면류관[a]을 받으려고 그렇게 하지만, 우리는 썩지 않을 면류관을 받으려고 합니다.
