review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 τῆς ὑμῶν ἐξουσίας는 고린도 교인들과 관련하여 사도들이 가진 권리, 곧 그들에게 요구할 수 있는 권리를 가리키는데, 초안의 ‘여러분에 대한 이 권리에 참여한다면’은 ‘권리에 참여하다’라는 결합이 부자연스럽고 관계도 다소 불명확합니다. 또한 τινα ἐγκοπὴν δῶμεν의 ‘장애를 끼치다’는 한국어 용법상 매끄럽지 않습니다.
  naturalness: ‘권리를 누리다’와 ‘복음에 아무런 방해도 주지 않다’로 고치면 현대 표준 한국어의 합쇼체 문체에서 자연스럽습니다. ‘하물며 우리는 더욱 그러하지 않겠습니까?’는 원문의 수사 의문문과 비교 강조를 보존합니다.
  terminology: ἐξουσία는 문맥상 ‘권리’가 적절하며 두 번 일관되게 유지했습니다. ἐγκοπή는 ‘방해’가 ‘복음에 … 주다’와 자연스럽게 결합합니다. τοῦ Χριστοῦ는 프로젝트 방침과 원문의 칭호적 용법에 따라 ‘메시아’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘여러분에 대한 이 권리에 참여한다면’의 의미와 결합이 불명확함
    rationale: μετέχω는 여기서 다른 이들이 고린도 교인들에 대하여 가진/행사하는 지원받을 권리를 ‘누리다’는 뜻입니다. 한국어에서 ‘권리에 참여하다’는 공동 참여의 뜻으로 쉽게 오해되며 자연스럽지 않습니다.
  - severity: low
    issue: ‘복음에 어떤 장애도 끼치지 않으려고’의 어법이 부자연스러움
    rationale: ἐγκοπὴν δῶμεν은 방해를 ‘주다/초래하다’는 뜻입니다. ‘장애를 끼치다’보다 ‘아무런 방해도 주지 않다’가 자연스럽고 원문의 목적 표현을 잘 반영합니다.
  revised_text: 다른 사람들이 여러분에 대해 가진 이 권리를 누린다면, 하물며 우리는 더욱 그러하지 않겠습니까? 그러나 우리는 이 권리를 사용하지 않았습니다. 오히려 메시아의 복음에 아무런 방해도 주지 않으려고 모든 것을 견딥니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘여러분에게 요구할 수 있는 이 권리’. 그리스어 표현은 고린도 교인들과 관련하여 사도들이 가진 권리, 문맥상 그들에게서 물질적 지원을 받을 권리를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그 메시아의 복음’입니다. 전통적 번역에서는 흔히 ‘그리스도의 복음’으로 옮깁니다.
    reason: alternative_reading
  revision_rationale: 관계 속격의 의미를 과도하게 단정하지 않으면서도 한국어에서 자연스럽게 ‘여러분에 대해 가진 이 권리’로 옮겼습니다. ‘누리다’는 이 권리의 혜택을 받거나 행사한다는 문맥을 드러냅니다. 또한 ‘방해를 주다’로 고쳐 원문의 ‘방해를 주다/초래하다’와 자연스러운 한국어 결합을 함께 살렸습니다.
