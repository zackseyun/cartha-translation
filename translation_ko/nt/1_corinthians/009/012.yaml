review_pass:
  verdict: revise
  source_fidelity: 초안의 핵심 의미는 대체로 충실합니다. 다만 μετέχουσιν을 「권리에 참여한다면」이라고 하면 한국어에서 권리 자체에 함께 참여한다는 뜻으로 다소 부자연스럽고, 문맥상 고린도 교인들에게 지원을 요구할 수 있는 권리를 다른 이들이 행사한다는 뜻도 충분히 드러나지 않습니다. 「여러분에게 이 권리를 행사한다면」이 문맥과 수사 의문문의 비교를 더 정확히 전달합니다. 마지막 절의 목적(ἵνα μή)도 「방해가 되지 않게 하려고」로 자연스럽게 보존했습니다.
  naturalness: 「권리에 참여하다」는 현대 표준 한국어에서 어색한 결합입니다. 또한 「장애를 끼치다」보다 복음과 관련해서는 「방해가 되다」가 더 자연스럽고 직접적입니다. 합쇼체의 격식 있는 문체는 유지했습니다.
  terminology: ἐξουσία는 문맥상 물질적 지원을 받을 정당한 「권리」로 일관되게 옮겼습니다. ἐγκοπή는 「방해」로, εὐαγγέλιον은 「복음」으로 옮겼습니다. Χριστοῦ의 칭호적 용법은 프로젝트 방침에 따라 「메시아」로 유지했습니다. 「메시아의 복음」은 원문의 속격 관계를 과도하게 해석하지 않고 보존합니다.
  issues:
  - severity: medium
    issue: 「여러분에 대한 이 권리에 참여한다면」의 의미와 결합이 부자연스러움
    rationale: μετέχω는 여기서 다른 사역자들이 고린도 교인들에 대하여 가진 지원 요구의 권리를 누리거나 행사한다는 문맥입니다. 한국어 「권리에 참여하다」는 이 관계를 불명확하게 만들고 자연스럽지 않습니다.
  - severity: low
    issue: 「복음에 어떤 장애도 끼치지 않으려고」의 관용성
    rationale: 원문의 '장애를 주다'라는 표현은 한국어에서 「복음에 아무런 방해가 되지 않게 하려고」로 옮길 때 더 자연스럽고 목적절의 기능도 선명합니다.
  revised_text: 다른 이들이 여러분에게 이 권리를 행사한다면, 우리는 더욱 그러하지 않겠습니까? 그러나 우리는 이 권리를 사용하지 않았습니다. 도리어 메시아의 복음에 아무런 방해가 되지 않게 하려고 모든 것을 견딥니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘여러분에 관한 이 권리’입니다. 문맥상 이는 사도들이 고린도 교인들에게 물질적 지원을 받을 수 있는 정당한 권리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그 메시아의 복음’입니다. 전통적인 번역에서는 흔히 ‘그리스도의 복음’으로 옮깁니다.
    reason: alternative_reading
  revision_rationale: 첫 절을 문맥상 자연스러운 한국어로 다듬어 다른 사역자들이 고린도 교인들에게 행사하는 지원 요구의 권리를 명확히 했습니다. 마지막 절은 원문의 목적절과 ‘장애를 주다’의 의미를 자연스럽게 반영하도록 수정했습니다. 메시아 칭호와 복음의 속격 표현은 유지했으며, 관련 번역상 설명을 각주로 제공했습니다.
