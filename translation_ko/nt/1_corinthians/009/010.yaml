  - severity: medium
    issue: ‘함께 나눌’은 μετέχειν에 없는 상호적 의미를 추가합니다.
    rationale: μετέχειν은 ‘몫을 받다/참여하다’의 뜻입니다. 공동 분배의 행위를 뜻하는 ‘함께 나누다’보다 ‘몫을 받을’이 문맥과 원문에 더 가깝습니다.
