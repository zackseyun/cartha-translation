revisions:
- from: 아니면 전적으로 우리를 위해 말씀하시는 것입니까? 분명히 우리를 위해 기록된 것입니다. 밭 가는 자는 소망 가운데 밭을 갈고, 곡식을 떠는 자는 함께 나눌 소망 가운데 떠는 것이 마땅하기 때문입니다.
  to: 아니면 전적으로 우리를 위하여 말씀하시는 것입니까? 그렇습니다. 이것은 우리를 위하여 기록된 것입니다. 밭 가는 사람은 소망을 품고 밭을 갈아야 하고, 타작하는 사람은 몫을 받을 소망을 품고 타작해야 하기 때문입니다.
  rationale: 원문의 ὀφείλει가 수식하는 첫 번째 부정사와, 둘째 절에서 병렬적으로 생략된 의무 의미를 모두 ‘해야 하고/해야 합니다’로 드러냈습니다. ἐπ’ ἐλπίδι의 반복은 ‘소망을 품고’로 보존했습니다. τοῦ μετέχειν의 목적어는 원문에 명시되지 않으므로 ‘수확’이나 ‘곡식’을 보충하지 않고 ‘몫을 받을’로 옮겼습니다.
