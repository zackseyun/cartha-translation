  source_fidelity: 수정이 필요합니다. 초안은 ὀφείλει(‘마땅하다/해야 한다’)의 의무 의미를 첫 절에서 빠뜨렸고, δεύτε째 절의 μετέχειν을 ‘함께 나누다’로 옮겨 공동으로 나눈다는 뜻을 더했습니다. μετέχειν은 문맥상 노동자가 몫을 받거나 참여한다는 뜻이며, 그 대상은 원문에서 명시되지 않습니다.
  naturalness: ‘곡식을 떠는 자’도 이해되지만 현대 표준어에서는 ‘타작하는 사람’이 더 자연스럽습니다. ‘소망을 품고’는 ἐπ’ ἐλπίδι를 자연스럽게 반복하면서 합쇼체 문체를 유지합니다.
  terminology: ‘소망’은 ἐλπίς의 반복을 유지합니다. ‘몫을 받을’은 τοῦ μετέχειν의 참여·분배 의미를 자연스럽게 나타내되, 원문에 없는 ‘수확/곡식’을 보충하지 않습니다.
