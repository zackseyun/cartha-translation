source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
  footnotes:
  - marker: a
    text: Or 'in a racecourse.' The Greek στάδιον refers to the place of the race, a stadium or track.
    reason: lexical_alternative
  - marker: b
    text: Or 'so run that you may win' or 'so that you may seize it.' The Greek καταλάβητε can mean 'obtain,' 'grasp,' or 'attain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 경기장에서 달리는 자들이 모두 달리지만 상을 받는 자는 한 사람뿐임을 여러분은 알지 못합니까? 여러분도 상을 얻도록 이와 같이 달리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “상을 붙잡도록” 또는 “상을 차지하도록.” 그리스어 καταλάβητε는 ‘얻다’, ‘붙잡다’, ‘도달하다’ 등의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
