  to: 율법 밖에 있는 사람들[a]에게는 율법 밖에 있는 사람처럼 되었습니다—하나님의 율법 밖에 있지 않고 메시아의 율법 아래 있으면서—율법 밖에 있는 사람들을 얻기 위해서입니다.
