  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
  footnotes:
  - marker: a
    text: Or 'without the law'; the phrase refers here to those not under the Mosaic law, not necessarily to morally lawless people.
    reason: lexical_alternative
  - marker: b
    text: Greek 'but under Messiah’s law'; alternatively, 'but within the law of Messiah/Christ.'
    reason: alternative_reading
translation:
  language: ko
  text: 율법 밖에 있는 사람들[a]에게는 율법 밖에 있는 사람처럼 되었습니다—하나님의 율법 밖에 있지 않고 메시아의 율법 아래 있으면서—율법 밖에 있는 사람들을 얻기 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘율법 밖에 있는 사람들’은 대체로 모세 율법 아래 있지 않은 사람들, 곧 이방인을 가리킵니다. 도덕적으로 무법한 사람들을 반드시 뜻하는 것은 아닙니다.
    reason: lexical_alternative
