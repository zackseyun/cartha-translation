  to: 약한 사람들에게는 약한 사람들을 얻으려고 약한 사람이 되었습니다[a]. 어떻게 해서든 몇 사람이라도 구원하려고 모든 사람에게 모든 것이 되었습니다[b].
  rationale: ‘얼마라도’를 ‘몇 사람이라도’로 고쳐 사람을 가리키는 τινάς의 의미를 명확히 했습니다. ‘약한 사람’은 본문의 포괄성을 유지하고, 각주에서 문맥상 가능한 ‘양심이 약한 사람들’이라는 이해를 제시했습니다. πάντως의 강조는 ‘어떻게 해서든’과 대안 각주로 보존했습니다.
