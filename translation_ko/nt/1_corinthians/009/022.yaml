  source_fidelity: 첫 절의 세 번 반복되는 ἀσθενής는 넓은 의미의 ‘약한 사람’으로 일관되게 옮겨야 하며, ‘약한 자들’이라는 목적어 반복도 원문에 충실합니다. 후반의 τινάς는 사람을 가리키는 복수이므로 ‘얼마라도’보다 ‘몇 사람이라도’가 더 정확합니다. γέγονα의 완료 시제는 한국어에서 ‘되었습니다’로 자연스럽게 표현할 수 있습니다.
  naturalness: 초안의 ‘어떻게 해서든 얼마라도 구원하려고’는 한국어에서 구원되는 대상이 수량처럼 들릴 수 있습니다. ‘어떻게 해서든 몇 사람이라도 구원하려고’가 자연스럽고 의미도 분명합니다. ‘모든 사람에게 모든 것이 되었습니다’는 다소 압축적이나 원문의 수사적 표현을 보존하는 자연스러운 성경 문체입니다.
  terminology: ‘약한 사람’은 문맥상 ‘양심이 약한 사람’을 포함할 수 있으나 본문에서 한정하지 않는 편이 적절합니다. ‘얻다’는 κερδήσω의 선교적 ‘얻다/얻어 내다’의 뜻을 잘 살립니다. ‘구원하다’는 σώσω의 구원 언어를 유지합니다.
