review_pass:
  verdict: approve
  source_fidelity: 그리스어의 수사적 접속사 ἢ, 배타적 강조 μόνος, 부정된 권리 표현 οὐκ ἔχομεν ἐξουσίαν, 그리고 μὴ ἐργάζεσθαι를 충실히 옮겼습니다. ‘일하지 않을 권리’는 문맥상 자비량 노동을 하지 않고 사역의 지원을 받을 권리를 자연스럽고 과도한 해설 없이 나타냅니다.
  naturalness: “아니면 바나바와 나만이 일하지 않을 권리가 없는 것입니까?”는 현대 표준 한국어의 합쇼체 수사 의문문으로 자연스럽습니다. ‘바나바와 나만이’도 공동 주어의 배타성을 분명히 드러냅니다.
  terminology: ‘권리’는 이 문맥의 ἐξουσία(정당한 권한·자격)를 적절히 전달합니다. ‘일하다’는 원문의 일반성을 보존하며, 본문에 ‘손수’나 ‘사역 지원’ 같은 문맥적 설명을 덧붙이지 않은 점도 적절합니다.
