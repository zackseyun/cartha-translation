review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders πάντα ... ποιῶ as '모든 일을 행합니다' and διὰ τὸ εὐαγγέλιον as '복음을 위해.' Its purpose clause and γένωμαι ('...자가 되기 위해서입니다') are also substantially faithful. However, '그것' leaves αὐτοῦ less clear than necessary in Korean, while the immediately preceding antecedent is '복음.'
  naturalness: The register is appropriately modern formal-polite. Replacing the somewhat literary '행합니다' with '합니다' is more natural without reducing formality. Repeating '그 복음' makes the connection clear and reads more smoothly than the standalone pronoun '그것.'
  terminology: '''복음'' is an established and suitable rendering of εὐαγγέλιον. ''함께 참여하는 사람'' retains the shared force of συγκοινωνός without narrowing it to the gospel''s fruits, ministry, or any particular doctrinal interpretation. The draft''s lexical rationale, however, should not define the phrase specifically as sharing in ''복음의 결실,'' since the Greek remains broader.'
  issues:
  - severity: low
    issue: The referent of '그것' is less explicit and less idiomatic than needed.
    rationale: αὐτοῦ most naturally refers to εὐαγγέλιον. In Korean, '그 복음에' clearly preserves that antecedent and avoids a vague demonstrative pronoun.
  - severity: low
    issue: The stated rationale narrows συγκοινωνός to sharing in the fruits of the gospel.
    rationale: The noun broadly denotes shared participation; the verse does not specify whether this concerns benefits, proclamation, or both. The translation should retain this breadth.
  revised_text: 나는 복음을 위하여 모든 일을 합니다. 이는 내가 그 복음에 함께 참여하는 사람이 되기 위해서입니다.
  revised_footnotes: []
  revision_rationale: The revision preserves the comprehensive '모든 일,' the motivational force of '복음을 위하여,' and the purpose expressed by ἵνα. It makes the pronoun's antecedent explicit and renders συγκοινωνός with a broad Korean expression that does not resolve the nature of Paul's participation beyond the Greek text.
