revisions:
- from: 나는 복음을 위해 모든 일을 행합니다. 그것에 함께 참여하는 자가 되기 위해서입니다.
  to: 나는 복음을 위하여 모든 일을 합니다. 이는 내가 그 복음에 함께 참여하는 사람이 되기 위해서입니다.
  rationale: The revision preserves the comprehensive '모든 일,' the motivational force of '복음을 위하여,' and the purpose expressed by ἵνα. It makes the pronoun's antecedent explicit and renders συγκοινωνός with a broad Korean expression that does not resolve the nature of Paul's participation beyond the Greek text.
