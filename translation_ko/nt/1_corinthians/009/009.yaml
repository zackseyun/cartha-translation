  naturalness: ‘소에게 입에 망을’은 조사 결합이 부자연스럽습니다. ‘타작하는 소의 입에 망을’이 자연스럽고, 합쇼체 문장 흐름에도 맞습니다.
  terminology: ‘모세의 율법’, ‘기록되어 있습니다’, ‘하나님’은 적절합니다. ἀλοῶντα에는 현대적으로 자연스러운 ‘타작하는’을 사용했습니다.
