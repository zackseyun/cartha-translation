  - severity: medium
    issue: 인용문 안의 ‘소에게 입에 망을’이 비문에 가깝습니다.
    rationale: ‘소의 입에 망을 씌우지 말라’로 고치면 κημόω의 의미를 보존하면서 자연스러운 한국어가 됩니다.
