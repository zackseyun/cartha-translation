  - severity: low
    issue: ‘무료로 제시하다’의 어휘 결합이 문맥에 비해 다소 상업적으로 들림
    rationale: ‘값없이 전하다’는 대가를 받지 않는 복음 선포라는 의미를 자연스럽게 전달합니다.
