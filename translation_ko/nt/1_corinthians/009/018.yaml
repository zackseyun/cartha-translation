    issue: 두 목적절의 관계가 ‘곧’이라는 동격 표현으로 평면화됨
    rationale: ἵνα와 εἰς τὸ μὴ는 각각 목적을 나타내므로, ‘전하여 … 하지 않는’ 형태로 연결하여 원문의 논리 관계를 반영하는 편이 낫습니다.
  - severity: low
    issue: ‘복음 안에서’가 한국어로 어색하고 의미 범위가 불분명함
