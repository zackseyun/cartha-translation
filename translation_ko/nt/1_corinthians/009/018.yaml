  rationale: 원문의 수사적 질문과 답변 구조를 유지하면서, 두 목적 표현을 한국어에서 자연스럽게 연결했습니다. ‘권리’가 물질적 지원을 받을 정당한 권리를 포함한다는 주변 문맥은 번역문에 과도하게 해설로 넣지 않았으며, ‘충분히 사용하지 않다’로 원문의 절제된 표현을 보존했습니다.
