- from: 그렇지 않으면, 당신이 영으로 축복할 때에, 알지 못하는 사람의 자리를 채운 사람이 어떻게 당신의 감사에 「아멘」 하고 말하겠습니까? 그는 당신이 무엇을 말하는지 모르기 때문입니다.[a][b]
  to: 그렇지 않으면, 당신이 영으로[b] 축복한다면, 잘 알지 못하는 사람의 자리에 있는 사람이 당신이 드리는 감사[c]에 어떻게 「아멘」이라고 하겠습니까? 그가 당신이 무엇을 말하는지 알지 못하기 때문입니다.[a]
  rationale: The revision retains the Greek conditional argument, the open sense of πνεύματι, and the nontechnical default sense of εὐχαριστία. It replaces wooden or awkward Korean with natural formal-polite phrasing, while preserving the lexical ambiguity of ἰδιώτης and avoiding an unwarranted categorical claim about Eucharistic terminology.
