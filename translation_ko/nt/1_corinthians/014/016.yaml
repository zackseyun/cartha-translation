review_pass:
  verdict: revise
  source_fidelity: The conditional structure and the final causal clause are substantially represented, but the draft's expression '알지 못하는 사람의 자리를 채운 사람' is overly literal and unnatural in Korean. The phrase ἐν/πνεύματι remains appropriately broad in the main text, but its source ambiguity should be retained in a note. The note on εὐχαριστία must not categorically deny a Eucharistic sense; the Greek and context do not require that later technical sense.
  naturalness: '''당신의 감사에 「아멘」 하고 말하겠습니까?'' is awkward. ''당신이 드리는 감사에 어떻게 「아멘」이라고 하겠습니까?'' is idiomatic and clearly expresses the congregational response. ''알지 못하는 사람의 자리에 있는 사람'' conveys the idiom without the unnatural image of someone ''filling a person''s place.'''
  terminology: 영으로 preserves the ambiguity of πνεύματι without deciding between the human spirit and Spirit-enabled speech. '잘 알지 못하는 사람' is a natural contextual rendering of ἰδιώτης; the lexical range is preserved in a note. '감사' correctly renders εὐχαριστία without imposing the later technical term '성찬.'
  issues:
  - severity: medium
    issue: The Korean rendering of ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου is unnatural.
    rationale: '''알지 못하는 사람의 자리를 채운 사람'' reads as though the person fills another person''s physical position. The idiom concerns someone occupying the position/role of an ἰδιώτης.'
  - severity: medium
    issue: The εὐχαριστία footnote overstates the exclusion of a Eucharistic meaning.
    rationale: Saying it 'does not refer' to the later technical term resolves more than the wording warrants. It should say that the term here means giving thanks and does not necessarily denote the later technical usage.
  - severity: low
    issue: The draft omits the audit-trail note preserving the ambiguity of πνεύματι.
    rationale: A note can preserve the viable 'with the spirit' alternative without forcing a theological identification.
  - severity: low
    issue: The wording for the Amen response is awkward.
    rationale: Korean naturally says that someone says '아멘이라고 하다' in response to a prayer or thanksgiving.
