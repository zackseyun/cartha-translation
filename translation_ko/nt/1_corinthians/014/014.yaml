  source_fidelity: 초안은 조건문과 ‘나의 영/나의 지각’의 대조를 대체로 보존합니다. 그러나 ἄκαρπος ἐστιν의 비유적 술어는 ‘열매가 없습니다’보다 ‘열매를 맺지 못합니다’가 더 직접적이고 자연스럽습니다. 또한 γλῶσσα는 문맥상 ‘방언’으로 옮길 수 있으나, ‘언어’라는 어휘적 가능성도 각주로 남기는 편이 원문의 범위를 더 잘 보존합니다.
  naturalness: ‘나의 지각은 열매가 없습니다’는 현대 한국어에서 다소 부자연스럽고, ‘지각’은 철학적·인지적 용법으로 들릴 수 있습니다. ‘나의 마음은 열매를 맺지 못합니다’는 νοῦς의 넓은 의미와 한국어 성경 문체에 자연스럽게 맞습니다.
  terminology: ‘방언’은 이 장의 확립된 문맥 용어로 적절합니다. 다만 γλῶσσα의 기본 의미인 ‘언어’도 가능한 만큼 각주에 제시합니다. τὸ πνεῦμά μου는 성령으로 단정하지 않고 ‘나의 영’으로 유지합니다. νοῦς는 ‘마음’으로 옮겨 감정만을 뜻하지 않도록 각주에서 ‘이해력/생각’의 의미 범위를 밝혀 줍니다.
