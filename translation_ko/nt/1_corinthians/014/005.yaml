  to: 저는 여러분 모두가 방언으로 말하기를 원합니다. 그러나 더욱 여러분이 예언하기를 원합니다. 예언하는 사람은 방언으로 말하는 사람보다 더 큽니다. 다만 통역이 이루어져[a] 교회가 세움을 받게 되는 경우는 예외입니다.
  rationale: 마지막 예외절을 ‘통역이 이루어져’로 고쳐 한국어 선행사 혼동을 없애면서도, 통역자가 방언을 말한 사람인지 다른 사람인지에 관한 원문의 문맥상 여지를 각주로 보존했습니다. 문체는 현대 표준어 합쇼체로 통일했으며, 비교와 교회 공동체의 세움이라는 원문의 의미를 유지했습니다.
