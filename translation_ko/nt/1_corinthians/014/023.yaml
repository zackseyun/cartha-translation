review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional inference, the whole gathered congregation, entry by two groups, and the rhetorical question. However, "온 교회" can readily denote a church building in contemporary Korean, rather than the entire congregation, and the lexical ambiguities of γλώσσαι and ἰδιῶται are left without the audit-trail footnotes needed to preserve their scope.
  naturalness: The sentence is generally clear and appropriately formal-polite. "교회 전체가" is clearer and more idiomatic for the congregational sense, and "말하고 있을 때" more smoothly frames the conditional scenario than the adversative-sounding "말하는데."
  terminology: '"방언" is the established Korean expression and appropriately leaves the nature of γλώσσαι unresolved. "잘 알지 못하는 사람들" retains a distinction from "믿지 않는 사람들"; an anchored note explains that this concerns lack of familiarity with the gathering or its practices, without collapsing the two groups.'
  issues:
  - severity: medium
    issue: '"온 교회" is potentially building-oriented in modern Korean.'
    rationale: ἐκκλησία ὅλη refers to the whole gathered congregation. "교회 전체" more directly communicates the collective community and avoids an unintended reference to a church edifice.
  - severity: medium
    issue: No footnote anchors preserve the lexical alternatives for γλώσσαι and ἰδιῶται.
    rationale: Both terms have explicitly documented, interpretively significant alternatives in the English audit trail. Korean notes should retain this ambiguity, particularly so that "방언" does not settle the debated phenomenon and "잘 알지 못하는 사람들" is not equated with unbelievers.
  revised_text: 그러므로 교회 전체가 한자리에 모여 모두 방언으로[a] 말하고 있을 때, 잘 알지 못하는 사람들이나[b] 믿지 않는 사람들이 들어오면, 그들이 여러분이 미쳤다고 하지 않겠습니까?
