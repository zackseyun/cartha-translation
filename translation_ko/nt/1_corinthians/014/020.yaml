revisions:
- from: 형제 여러분, 생각하는 데에서는 어린아이가 되지 말고, 악에 대해서만 어린아이가 되십시오. 그러나 생각하는 데에서는 어른이 되십시오.[a]
  to: 형제 여러분[a], 생각하는 일에서는 어린아이가 되지 마십시오. 오히려 악에 대해서는 갓난아기가 되십시오[b]. 생각하는 일에서는 성숙한 사람이 되십시오.
  rationale: Unsupported ‘만’을 삭제하고, 각 각주를 해당 표현에 직접 연결했습니다. παιδία/νηπιάζετε의 연령 대비는 ‘어린아이/갓난아기’로, τέλειοι의 문맥상 의미는 ‘성숙한 사람’으로 옮겼습니다. ‘형제 여러분’은 원문의 남성 복수형을 보존하되, 회중을 향한 포괄적 용법의 가능성을 각주로 밝혔습니다.
