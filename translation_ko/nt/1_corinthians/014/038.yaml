translation:
  language: ko
  text: 그러나 누구든지 이를 인정하지 않으면, 그도 인정받지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 「누구든지 알지 못하면, 알지 못하게 두라」라고 읽습니다(능동 명령법). 본문은 SBLGNT를 따라 「인정받지 못합니다」라는 수동 직설법을 옮깁니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγνοεῖ ... ἀγνοεῖται
  english_pob_choice: does not recognize ... is not recognized
  chosen_korean: 인정하지 않다 / 인정받지 못하다
  alternatives_korean:
  - 알지 못한다 / 알아주지 않는다
  lexicon: BDAG
  rationale: ἀγνοέω 능·수의 수사적 대구를 살리기 위해 「인정」으로 옮긴다. 의미적으로 「주가/공동체가 인정하지 않는다」를 가리킨다.
