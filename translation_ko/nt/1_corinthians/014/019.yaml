translation:
  language: ko
  text: 그러나 교회에서는 방언으로[a] 만 마디 말을 하는 것보다, 다른 사람들도 가르치기 위하여 내 마음으로 다섯 마디 말을 하기를 원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 언어로’. 그리스어 「글로사」는 ‘혀’ 또는 ‘언어’를 뜻할 수 있습니다. 여기서는 고린도전서 12–14장에서 논의되는 말하기의 종류를 가리킵니다.
    reason: alternative_reading
