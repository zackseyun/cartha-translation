translation:
  language: ko
  text: 나는 여러분 모두보다 더 많이 방언으로 말하는 것을 하나님께 감사드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언어들로 말하는 것’. 그리스어 γλώσσαις는 ‘언어들’을 뜻할 수도 있으나, 고린도전서 12–14장의 문맥에서는 전통적으로 ‘방언’으로 옮긴 현상을 가리킵니다.
    reason: γλώσσαις의 어휘적 대안을 제시하되, 본문이 가리키는 현상의 성격에 관한 논쟁을 확정하지 않습니다.
theological_decisions:
- issue: 바울이 자신의 방언 경험을 강조하는 진술의 보존
  chosen_reading: 여러분 모두보다도 더 많이 방언으로 말함
  alternative_readings:
