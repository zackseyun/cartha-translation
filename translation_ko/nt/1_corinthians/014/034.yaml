  source_fidelity: 개정이 필요합니다. 원문의 복수형(ἐν ταῖς ἐκκλησίαις), 명령(σιγάτωσαν, ὑποτασσέσθωσαν), 대조 접속사(ἀλλά), 그리고 '율법도'(καὶ ὁ νόμος)의 뜻을 더 직접적으로 반영해야 합니다. 기존의 '잠잠하게 하십시오'는 현대 한국어에서 부자연스럽고, 여성들이 다른 사람을 잠잠하게 하라는 뜻으로도 읽힐 수 있습니다.
  naturalness: 합쇼체의 설명문으로는 '잠잠해야 합니다', '허락되지 않습니다', '복종해야 합니다'가 자연스럽고 명확합니다. '교회들에서'는 원문의 복수를 보존하면서도 한국어에서 무리 없이 읽힙니다.
  terminology: γυναῖκες는 본문에서 '여자들'로 유지하고 '아내들' 가능성을 각주로 보존합니다. ὁ νόμος는 특정한 모세 율법인지 더 넓은 성경적 권위인지 확정하지 않도록 '율법'으로 옮기고 각주를 답니다. λαλεῖν의 범위를 본문에서 축소하지 않고 관련 각주를 복원합니다.
