  to: 여자들은 교회들에서 잠잠해야 합니다.[a] 그들에게 말하는 것은 허락되지 않습니다.[b] 오히려 율법도 말하는 대로 복종해야 합니다.[c]
  rationale: 본문은 해석적으로 논쟁되는 범위를 좁히거나 완화하지 않고, γυναῖκες를 ‘여자들’로, λαλεῖν을 일반적인 ‘말하는 것’으로, ὑποτασσέσθωσαν을 ‘복종해야 합니다’로 옮겼습니다. ‘교회들’, ‘오히려’, ‘율법도’를 사용하여 원문의 복수, 대조, καί의 강조를 반영했습니다. 각주는 아내들 가능성, 말하기의 불특정한 범위, ‘율법’의 불확정한 지시 대상을 각각 본문의 해당 위치에 연결합니다.
