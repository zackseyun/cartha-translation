translation:
  language: ko
  text: 그의 마음속에 숨겨진 것들이 드러나고, 그렇게 그는 얼굴을 땅에 대고 엎드려 하나님께 경배하며, 「참으로 하나님께서 여러분 가운데[a] 계십니다」라고 선언할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
