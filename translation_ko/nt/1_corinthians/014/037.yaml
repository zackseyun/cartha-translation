  source_fidelity: 초안은 δοκεῖ의 자기 판단, προφήτης, πνευματικός, ἐπιγινωσκέτω의 요구를 대체로 충실히 옮겼습니다. 그러나 κυρίου ἐστίν은 명사 없이 ‘주의 것이다/주께 속한 것이다’라고 압축되어 있어, 본문에서 ‘주의 명령’으로 단정해 보충하면 원문의 문법적 여지를 본문에서 좁히게 됩니다.
