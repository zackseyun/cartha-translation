review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the repeated universal scope, sequential prophecy, and learning. However, 「권면을 받다」 narrows παρακαλῶνται to exhortation/admonition, whereas in this immediate context the verb has the broader edifying sense of encouragement (while retaining possible connotations of exhortation or comfort). The final 「받게 됩니다」 also makes the purpose clause sound like an unqualified future outcome; a purpose-result rendering is preferable.
  naturalness: 「한 사람씩 차례로」 is natural modern Korean for καθ’ ἕνα. The revision maintains modern formal-polite register and makes the relationship of orderly speech to the assembly’s learning and encouragement clear without adding an imperative.
  terminology: 「예언하다」 is the established and suitably broad rendering of προφητεύειν. 「격려」 is preferable to 「권면」 for παρακαλῶνται here because it does not prematurely restrict the Greek verb’s semantic range. A footnote preserves the relevant alternatives.
  issues:
  - severity: medium
    issue: 「권면을 받다」 is too narrow for παρακαλῶνται.
    rationale: παρακαλέω can denote encouragement, exhortation, or comfort. In this context of the congregation’s edification, 「격려를 받다」 best conveys the broad central sense without excluding the other contextual nuances.
  - severity: low
    issue: 「받게 됩니다」 presents the ἵνα-clause as a straightforward future result.
    rationale: The clause expresses purpose/result. 「그리하여」 and a present general-result form convey the intended effect more naturally in Korean.
  revised_text: 여러분은 모두 한 사람씩 차례로 예언할 수 있으므로, 그리하여 모두가 배우고 모두가 격려[ㄱ]를 받습니다.
