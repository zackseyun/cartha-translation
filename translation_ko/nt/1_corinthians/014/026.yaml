base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
  footnotes:
  - marker: a
    text: '''Brothers'' here addresses the congregation representatively, including women as well as men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a language.' The Greek term can denote a tongue or language; here 'tongue' preserves Paul's wording in this discussion.
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 어떻게 해야 합니까, 형제 여러분[a]? 여러분이 모일 때에 각 사람에게는 찬송시도 있고, 가르침도 있고, 계시도 있고, 방언[b]도 있고, 통역도 있습니다. 모든 것이 공동체를 세우는 데 도움이 되게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제 여러분’은 회중을 대표하여 부르는 말로서, 남성뿐 아니라 여성도 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘언어’. 그리스어 단어는 혀 또는 언어를 뜻할 수 있습니다. 여기서는 이 논의에서 바울이 사용하는 표현을 보존하여 ‘방언’으로 옮겼습니다.
    reason: alternative_reading
