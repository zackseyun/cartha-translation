  verdict: revise
  source_fidelity: The draft correctly takes γλώσσῃ here in its concrete sense, ‘with/by the tongue,’ rather than prematurely rendering it ‘in tongues.’ However, the final clause’s plural subject (ἔσεσθε ... λαλοῦντες, ‘you [plural] will be speaking’) is weakened by the impersonal Korean expression ‘그것은 ... 됩니다.’
  naturalness: The proposed revision is natural modern formal-polite Korean. ‘여러분이 말하는 것을 어떻게 알아들을 수 있겠습니까?’ clearly communicates the passive communicative sense of πῶς γνωσθήσεται τὸ λαλούμενον without unnatural Korean passives.
  terminology: ‘혀로’ preserves the concrete image of διὰ τῆς γλώσσης, and ‘분명한 말’ appropriately renders εὔσημον λόγον. A lexical footnote preserves ‘알아들을 수 있는 말’ and ‘명확한 전달’ as viable nuances.
  issues:
  - severity: medium
    issue: 'The final sentence uses an impersonal subject: ‘그것은 허공에다 말하는 것이 됩니다.’'
    rationale: The Greek explicitly says that the addressed plural audience will be speaking into the air. The Korean should retain ‘여러분은’ as the subject and the prospective result expressed by the future construction.
  - severity: low
    issue: No Korean rendering of the lexical-alternative footnote is supplied for εὔσημον λόγον.
    rationale: The English audit trail marks this phrase with a lexical footnote. Adding a Korean footnote preserves the alternative nuances without overloading the main text.
