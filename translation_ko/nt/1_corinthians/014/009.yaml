  text: 여러분도 마찬가지입니다. 혀로 분명한 말[a]을 하지 않는다면, 여러분이 말하는 것을 어떻게 알아들을 수 있겠습니까? 여러분은 허공을 향해 말하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “알아들을 수 있는 말” 또는 “명확한 전달.” 그리스어는 듣는 사람이 알아보고 이해할 수 있는 말을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
