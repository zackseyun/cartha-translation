review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 반복되는 ὑπὸ πάντων은 대체로 반영되어 있습니다. 그러나 ἰδιώτης를 단순히 ‘알지 못하는 사람’으로 옮기면 무엇을 알지 못하는지 불분명하며, ἀνακρίνεται의 수동 표현 ‘살펴짐을 받습니다’는 한국어에서 부자연스럽습니다.
  naturalness: ‘어떤 … 사람이 들어올 때에 그는’보다 조건절을 간결하게 처리하고, ‘살펴짐을 받습니다’를 자연스러운 ‘판단을 받습니다’로 고치는 것이 현대 표준 한국어 합쇼체에 맞습니다.
  terminology: προφητεύω는 이 장의 용례에 맞게 ‘예언하다’를 유지했습니다. ἄπιστος는 ‘믿지 않는 사람’으로, ἰδιώτης는 집회 및 그 언어에 익숙하지 않다는 문맥을 보존하는 ‘익숙하지 않은 사람’으로 옮기고 가능한 대안은 각주로 제시했습니다. ἐλέγχεται와 ἀνακρίνεται는 각각 ‘책망을 받다’와 ‘판단을 받다’로 구별했습니다.
  issues:
  - severity: medium
    issue: ‘알지 못하는 사람’
    rationale: ἰδιώτης의 관련 분야·집회에 대한 비숙련 또는 비참여라는 뜻이 지나치게 일반화되어 불명확합니다.
  - severity: medium
    issue: ‘살펴짐을 받습니다’
    rationale: ἀνακρίνεται의 의미를 전달하려 하나 한국어 수동 명사화가 부자연스럽습니다. 여기서는 ‘판단을 받습니다’가 문맥상 자연스럽고 검토·평가의 뜻을 유지합니다.
  revised_text: 그러나 모두가 예언하면, 믿지 않는 사람이나 익숙하지 않은 사람이 들어올 때에 그는 모든 사람에게 책망을 받고 모든 사람에게 판단을 받습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘외부인’. 그리스어는 관련 내용을 알지 못하거나, 참여하지 않았거나, 말하는 집단에 속하지 않은 사람을 가리킬 수 있습니다.
    reason: ἰδιώτης의 문맥상 가능한 의미를 보존하기 위함입니다.
  revision_rationale: 문장의 조건 구조와 ‘모든 사람에게서’의 반복을 유지하면서, 불명확하거나 비자연스러운 표현을 현대 한국어로 다듬었습니다. ‘판단을 받습니다’는 최종적 정죄를 뜻하도록 과도하게 해석하지 않고, ἀνακρίνω의 검토·심사의 의미를 문맥적으로 전달합니다.
