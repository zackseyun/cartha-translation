translation:
  language: ko
  text: 그러나 모두가 예언한다면, 어떤 믿지 않는 자나 알지 못하는 사람이 들어올 때에 그는 모두에게서 책망을 받고, 모두에게서 살펴짐을 받습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλέγχεται
  english_pob_choice: convicted
  chosen_korean: 책망을 받다
  alternatives_korean:
  - 깨달음을 받다
  lexicon: BDAG
  rationale: ἐλέγχω는 죄를 들춰 인식하게 함을 가리킨다. 「책망」은 본문의 도덕적·인격적 노출의 무게를 담는다.
- source_word: ἀνακρίνεται
  english_pob_choice: examined
  chosen_korean: 살펴짐을 받다
  alternatives_korean:
  - 판별을 받다
  lexicon: BDAG
  rationale: ἀνακρίνω는 「샅샅이 살피다」이며, 14:25의 마음의 비밀이 드러남과 호응한다.
