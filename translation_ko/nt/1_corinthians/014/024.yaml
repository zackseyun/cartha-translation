review_pass:
  verdict: revise
  source_fidelity: 초안은 조건문과 πάντες의 반복을 대체로 보존합니다. 그러나 ἰδιώτης를 단순히 ‘알지 못하는 사람’으로 옮기면 무엇을 알지 못하는지 지나치게 불명확하며, ἀνακρίνεται의 면밀한 평가·검토의 뜻에 비해 ‘살펴짐을 받다’는 비문에 가깝고 자연스럽지 않습니다. ‘책망을 받다’는 ἐλέγχεται의 문맥상 잘못이 드러나고 깨우침을 받는 뜻을 수용할 수 있습니다.
  naturalness: ‘어떤 믿지 않는 자나 알지 못하는 사람이 들어올 때에’와 ‘살펴짐을 받습니다’는 현대 표준어 합쇼체에서 어색합니다. ‘믿지 않는 사람이나 익숙하지 않은 사람이 들어오면’ 및 ‘모든 사람의 검토를 받습니다’로 다듬으면 자연스럽습니다.
  terminology: ‘예언하다’는 이 장의 바울적 범주를 유지하는 적절한 용어입니다. ἰδιώτης는 집회 관행이나 내용에 익숙하지 않은 사람을 가리킬 수 있으므로 ‘익숙하지 않은 사람’으로 옮기고, 가능한 ‘외부인’ 해석은 각주로 남깁니다. ἀνακρίνεται는 최종 정죄를 뜻하는 ‘심판’보다 ‘검토’가 원문의 조사·평가 의미와 영어 감사 기록에 더 가깝습니다.
  issues:
  - severity: medium
    issue: ἰδιώτης의 번역이 지나치게 포괄적임
    rationale: ‘알지 못하는 사람’은 대상이 전혀 특정되지 않아, 집회의 언어·관행에 익숙하지 않거나 참여하지 않은 사람이라는 문맥적 의미를 충분히 드러내지 못합니다. ‘외부인’이라는 가능한 대안은 각주로 보존하는 것이 안전합니다.
  - severity: medium
    issue: ‘살펴짐을 받다’의 비자연성과 ἀνακρίνεται 반영 부족
    rationale: 현대 한국어에서 자연스럽지 않은 피동 명사 구성이며, ἀνακρίνω의 조사·검토·평가의 의미를 명료하게 전달하지 못합니다.
  revised_text: 그러나 모두가 예언을 하는데 믿지 않는 사람이나 익숙하지 않은 사람이 들어오면, 그는 모든 사람에게 책망을 받고 모든 사람의 검토를 받습니다.
  revised_footnotes:
  - marker: a
    text: ‘익숙하지 않은 사람’은 관련 지식이나 집회 관행을 알지 못하거나 그 모임에 속하지 않은 사람을 가리킬 수 있습니다. 또는 ‘외부인’.
    reason: alternative_reading
  revision_rationale: 조건문의 자연스러운 한국어 흐름을 위해 ‘들어오면’으로 옮기고, ἰδιώτης의 문맥적 의미를 ‘익숙하지 않은 사람’으로 표현했습니다. 논쟁 가능한 ‘외부인’ 해석은 본문에 고정하지 않고 각주에 보존했습니다. 두 차례의 ὑπὸ πάντων은 ‘모든 사람’의 반복으로 유지했으며, ἀνακρίνεται는 최종적 정죄를 강요하지 않는 ‘검토를 받습니다’로 옮겼습니다.
