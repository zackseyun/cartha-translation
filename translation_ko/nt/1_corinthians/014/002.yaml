  source_fidelity: ‘방언으로’는 γλώσσῃ의 단수 용법을 문맥에 맞게 옮기며, ‘사람에게 … 하나님께’도 대조를 충실히 반영합니다. ἀκούει는 문맥상 ‘알아듣다’로 번역할 수 있으나, 원문의 문자적 ‘듣다’ 가능성은 주석으로 보존하는 것이 적절합니다. πνεύματι는 성령과 말하는 이의 영 사이에서 문법적으로 열려 있으므로, 본문의 비한정적 ‘영으로’와 주석이 그 모호성을 보존합니다.
  naturalness: 초안의 ‘아무도 알아듣지 못하기 때문이며’는 문장 연결이 다소 부자연스럽습니다. ‘아무도 알아듣지 못하기 때문입니다’로 독립시킨 뒤 다음 절을 새 문장으로 처리하면 현대 한국어 합쇼체에서 더 자연스럽고 명료합니다.
