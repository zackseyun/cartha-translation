- from: 율법에 기록되기를, 「내가 다른 방언과 다른 입술로 이 백성에게 말하겠으나, 그래도 그들은 내 말을 듣지 않을 것이다」라고 야훼께서 말씀하십니다.[a]
  to: 율법에 기록되어 있습니다. 「내가 다른 언어를 쓰는 이들과 외국인의 입술을 통해 이 백성에게 말하겠으나, 그렇게 하여도 그들은 내게 귀를 기울이지 않을 것이다」라고 주께서 말씀하십니다.[a]
  rationale: 그리스어 본문을 우선하여 κύριος를 ‘주’로 옮기고, 인용문의 외국어/외국인이라는 병렬 표현과 ‘그렇게 하여도’의 양보적 강조를 자연스러운 현대 한국어로 반영했습니다. 기존 각주의 신명 복원 주장은 삭제하고, 이사야 인용 및 언어 표현의 문맥만 간결하게 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:28:57Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 인용 공식과 미래형, ‘이 백성’, 그리고 ‘그렇게 하여도 그들이 내게 귀 기울이지 않을 것’이라는 강조를 유지해야 합니다. κύριος는 그리스어 본문 및 영어 POB 감사 기록에 따라 ‘주’로 옮기는 것이 적절합니다. 이를 ‘야훼’로 복원하는 것은 번역 본문의 명시적 어휘를 넘어섭니다.
  naturalness: ‘율법에 기록되기를’보다 ‘율법에 기록되어 있습니다’가 현대 한국어 합쇼체의 성경 인용 공식으로 자연스럽습니다. ‘다른 언어를 쓰는 이들과 외국인의 입술을 통해’는 원문의 병렬 이미지와 외국어라는 문맥을 자연스럽게 드러냅니다.
  terminology: γλῶσσα 계열과의 연결은 ‘다른 언어’를 통해 충분히 보존되며, 여기서는 역사적 인용의 문맥상 ‘방언’보다 외국어를 뜻하는 표현이 더 분명합니다. κύριος는 ‘주’로 번역합니다.
  issues:
  - severity: high
    issue: κύριος를 ‘야훼’로 번역하고, 각주에서 이를 복원이라고 단정함
    rationale: SBLGNT의 본문은 κύριος이며, 제공된 영어 POB 감사 기록도 ‘the Lord’를 채택합니다. 히브리어 배경을 근거로 번역 본문에서 신명을 복원하는 것은 원문을 넘어서는 해석적 변경입니다.
  - severity: medium
    issue: ‘다른 방언과 다른 입술로’
    rationale: ‘다른 입술’은 현대 한국어에서 의미가 불분명합니다. ἑτερογλώσσοις와 χείλεσιν ἑτέρων이 가리키는 다른 언어 사용자/외국인의 말을 명료하게 드러내는 편이 자연스럽습니다.
  - severity: low
    issue: ‘율법에 기록되기를’
    rationale: 문법적으로 가능하지만 현대 합쇼체의 성경 인용 도입으로는 ‘율법에 기록되어 있습니다’가 더 자연스럽고 표준적입니다.
