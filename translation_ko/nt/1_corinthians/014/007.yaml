  text: 이와 같이 소리를 내는 생명 없는 것들도, 피리이든 리라이든, 음들을 구별하여 내지 않으면 피리로 연주되는 것인지 리라로 연주되는 것인지 어떻게 알겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
