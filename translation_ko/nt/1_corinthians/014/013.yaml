  source_fidelity: 그리스어의 추론 접속사 Διὸ를 ‘그러므로’로, γλώσσῃ를 문맥상 정착된 표현인 ‘방언으로’로 충실히 옮겼습니다. ‘방언으로 말하는 사람’은 ὁ λαλῶν의 일반적 단수 용법을 자연스럽게 반영하며, ‘통역할 수 있도록 기도하십시오’는 προσευχέσθω ἵνα διερμηνεύῃ의 명령과 목적/내용의 뉘앙스를 적절히 전달합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 예배·교훈 문맥에 맞는 정중한 문체입니다. ‘방언으로 말하는 사람은 … 기도하십시오’는 일반적 대상에게 권면하는 한국어 성경 문체로 무리가 없습니다.
  terminology: ‘방언’은 이 장의 γλῶσσα 용례와 연결을 보존하면서 그 현상의 성격에 관한 해석 논쟁을 미리 결정하지 않습니다. ‘통역’은 διερμηνεύῃ가 가리키는, 회중이 이해할 수 있도록 말의 뜻을 전달하는 행위에 알맞습니다.
