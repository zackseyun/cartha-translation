  source_fidelity: 핵심 대조 구조(영/마음, 기도/찬송)와 미래의 결단은 잘 반영되어 있습니다. 다만 νοΐ의 번역어로서 ‘지각’은 여기서 말하는 이해·의식적 사고의 능력을 자연스럽게 전달하지 못하며, 현대 한국어에서는 다소 기술적이고 부자연스럽습니다. ‘마음’이 원문의 어휘적 대조와 문맥을 더 잘 보존합니다.
  naturalness: ‘영으로 … 또한 지각으로도’는 조사가 겹쳐 다소 무겁습니다. ‘영으로 기도하겠고, 또한 마음으로 기도하겠습니다’처럼 병렬을 정리하면 현대 합쇼체에서 더 자연스럽고 원문의 반복 구조도 유지됩니다.
  terminology: πνεῦμα는 ‘영’으로 옮겨 성령, 인간의 영, 영적 발화 가운데 어느 하나로 단정하지 않았습니다. νοῦς는 ‘마음’으로, ψαλῶ는 예배 문맥의 ‘찬송하다’로 옮겼습니다. ‘찬송하다’는 노래로 드리는 찬양이라는 문맥에 적절합니다.
  issues:
  - severity: medium
    issue: ‘지각으로’
    rationale: νοΐ는 이 문맥에서 이해하고 의식적으로 생각하는 능력을 가리킵니다. ‘지각’은 감각적 지각 또는 전문적 인지 용어로도 읽혀 자연스럽지 않고 문맥상 의미를 충분히 전달하지 못합니다.
  revised_text: 그러면 어떻게 해야 합니까? 나는 영으로 기도하겠고, 또한 마음으로 기도하겠습니다. 나는 영으로 찬송하겠고, 또한 마음으로 찬송하겠습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘영 안에서’ 또는 ‘영에 의해’. 그리스어는 여기서 ‘영’이 특별히 성령, 말하는 사람의 인간적 영, 또는 영적인 발화를 가리키는지 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음으로’는 ‘이해와 함께’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘노래하겠습니다’ 또는 ‘가락을 내겠습니다’.
    reason: lexical_alternative
  revision_rationale: ‘지각’만 ‘마음’으로 고쳐 νοῦς의 문맥상 의미와 현대 한국어의 자연스러움을 높였습니다. ‘영’은 원문의 해석상 열려 있는 지시를 보존합니다. 본문에는 주석 표지를 삽입하지 않아도 번역 자체는 완결되지만, 영문의 어휘·해석상 유보를 한국어 주석으로 함께 제시했습니다.
