source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
  footnotes:
  - marker: a
    text: Or 'in the spirit' or 'by the spirit'; the Greek does not make explicit whether 'spirit' refers specifically to the Holy Spirit, the speaker's human spirit, or spiritual utterance.
    reason: lexical_alternative
  - marker: b
    text: Or 'with understanding' for 'with the mind.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will sing' or 'I will make melody.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 어떻게 해야 합니까? 나는 영으로[a] 기도하되, 마음으로[b]도 기도하겠습니다. 영으로 찬송하되,[c] 마음으로도 찬송하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영 안에서’ 또는 ‘영에 의해’. 그리스어는 여기서 ‘영’이 성령, 말하는 이의 영, 또는 영적인 발화를 특별히 가리키는지를 명시하지 않습니다.
    reason: τῷ πνεύματι의 격 기능과 지시 대상의 해석상 모호성을 보존합니다.
  - marker: b
    text: 또는 ‘이해를 가지고’.
    reason: τῷ νοΐ는 이해하거나 의식적으로 생각하는 능력을 뜻할 수 있습니다.
  - marker: c
    text: 또는 ‘노래하겠습니다’ 또는 ‘곡조를 내겠습니다’.
    reason: ψαλῶ의 가능한 어휘적 뉘앙스를 제시합니다.
