    issue: ‘어떠한 육체도’ is an unnatural and potentially misleading rendering of πᾶσα σὰρξ.
    rationale: In contemporary Korean, ‘육체’ normally denotes the physical body. Here πᾶσα σὰρξ is a Semitic-style expression for human beings universally, viewed in contrast to God. ‘아무도’ communicates that sense naturally, while a footnote preserves the literal expression.
