  source_fidelity: 개정이 필요합니다. 원문의 현재형 λέγει와 εἰμι가 반복되는 발화·소속 표시에 해당하는데, 초안의 「속하였다」는 완료된 과거 귀속으로 바꾸어 놓았습니다. 또한 네 구호의 대안적 열거를 명시하는 것이 원문의 반복 구조를 더 잘 드러냅니다.
  naturalness: 「내가 말하려는 것은」은 화자의 의도나 미래 지향을 암시하므로 현재의 설명 도입인 λέγω δὲ τοῦτο에는 「내가 말하는 것은」이 더 자연스럽고 충실합니다. 「여러분은 저마다 …라고 말합니다」은 표준어 합쇼체에서 명료하고 자연스럽습니다.
  terminology: 바울, 아볼로, 게바는 원문의 이름 구별을 보존합니다. Χριστοῦ는 프로젝트 방침에 따라 「메시아」로 옮기고, 전통적 표기 「그리스도」는 각주로 제시합니다.
  issues:
  - severity: medium
    issue: 「속하였다」의 시제
    rationale: εἰμι 및 λέγει는 현재형입니다. 「속하였다」는 과거 완료된 소속처럼 들려 원문의 지속적·현재적 파당 표명을 약화합니다.
  - severity: low
    issue: 도입문의 「말하려는」
    rationale: λέγω는 ‘말한다’이며, 이 문맥에서는 ‘내가 말하는 것은 이것입니다’가 설명적 현재를 정확히 반영합니다.
  - severity: low
    issue: 메시아 대안 표기의 각주 부재
    rationale: 영어 POB 감사 기록의 Χριστός/Christ 대안 및 용어 정책을 반영하여 「그리스도」를 각주로 제공합니다.
  revised_text: 내가 말하는 것은 이것입니다. 여러분은 저마다 “나는 바울에게 속합니다,” 혹은 “나는 아볼로에게 속합니다,” 혹은 “나는 게바에게 속합니다,” 혹은 “나는 메시아a에게 속합니다”라고 말합니다.
  revised_footnotes:
  - marker: a
    text: 또는 “그리스도”
    reason: Χριστός의 전통적 한국어 표기를 제시하는 대안 번역 각주입니다.
  revision_rationale: 현재형을 유지하고, 반복되는 네 소속 구호를 한국어의 자연스러운 직접 인용과 「혹은」 열거로 재구성했습니다. 인명은 음역을 유지했으며, Χριστός는 정책상 「메시아」로 번역하되 전통적 대안을 각주로 남겼습니다.
