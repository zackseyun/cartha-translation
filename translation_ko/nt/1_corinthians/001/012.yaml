translation:
  language: ko
  text: 내가 말하는 바는 이것입니다. 여러분 각 사람이 “나는 바울에게 속한 사람입니다”, “나는 아볼로에게 속한 사람입니다”, “나는 게바에게 속한 사람입니다”, “나는 메시아에게 속한 사람입니다” 하고 말합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ μέν εἰμι Παύλου
  english_pob_choice: I belong to Paul
  chosen_korean: 나는 바울에게 속하였다
  alternatives_korean:
  - 나는 바울 편이다
  lexicon: BDAG
  rationale: 속격 소유 구문 「~의 것」을 인격적 귀속으로 옮긴다.
- source_word: Ἀπολλῶ … Κηφᾶ
  english_pob_choice: Apollos … Cephas
