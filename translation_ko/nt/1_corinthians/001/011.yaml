    rationale: ‘내게 알려졌습니다’ directly conveys that information was made known to Paul without asserting a particular mode of reception.
  - severity: low
    issue: The inclusive-reference note for ἀδελφοί is absent.
    rationale: A footnote preserves the gender-accurate main-text wording while informing readers that the address likely encompasses the whole believing community.
