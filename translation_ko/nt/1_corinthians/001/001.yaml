  terminology: '"메시아 예수" appropriately represents Χριστοῦ Ἰησοῦ with Χριστός understood as a title. "형제 소스데네" naturally conveys ὁ ἀδελφὸς without adding a possessive pronoun absent from the Greek.'
  issues:
