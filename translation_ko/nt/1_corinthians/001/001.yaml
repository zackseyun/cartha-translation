    issue: '"사도가 된" adds a change-of-status sense.'
    rationale: The Greek calls Paul an apostle who is called; it does not state that he became an apostle.
  - severity: low
    issue: '"부르심받은" is less natural orthographically and stylistically than an explicit Korean construction.'
    rationale: '"사도로 부르심을 받은" is standard modern formal Korean and clearly identifies the calling as apostolic.'
  revised_text: 하나님의 뜻으로 메시아 예수의 사도로 부르심을 받은 바울과 형제 소스데네가,
