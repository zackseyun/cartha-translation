    issue: ‘침례를 베풀다’
    rationale: 원문 βαπτίζω는 세례의 방식에 관한 특정 해석을 명시하지 않습니다. ‘침례’는 현대 한국어에서 특정 교단의 선호 용어로 인식될 수 있으므로, 중립적이고 널리 통용되는 ‘세례’를 쓰는 것이 적절합니다.
  - severity: low
