  source_fidelity: 그리스어의 현재형 εὐχαριστῶ, 부정 목적어 οὐδένα ὑμῶν, 예외구문 εἰ μὴ, 그리고 두 인명은 대체로 반영되었습니다. 다만 ‘침례’는 원문의 행위 자체보다 특정 교단적 용례로 읽힐 수 있어, 번역어로는 더 중립적이고 한국어 성서에서 널리 쓰이는 ‘세례’가 적절합니다.
  naturalness: 원문의 ‘…하지 않았음을 감사합니다’라는 내용절은 유지하되, ‘나는’은 한국어에서 불필요하게 두드러지므로 생략하는 편이 자연스럽습니다. ‘세례를 베풀지 않았음을 감사합니다’는 현대 합쇼체 문장으로 자연스럽습니다.
  terminology: βαπτίζω에는 교파적 방식 해석을 피하는 표준 번역어 ‘세례를 베풀다’를 사용했습니다. 인명 ‘그리스보’와 ‘가이오’는 한국어 성서 관행 표기를 유지했습니다.
  issues:
