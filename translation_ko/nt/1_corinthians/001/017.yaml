  to: 메시아께서 나를 보내신 것은 세례를 베풀도록 하시려는 것이 아니라 복음을 전하도록 하시려는 것입니다. 말의 지혜로 복음을 전하지 않는 것은 메시아의 십자가가 헛되게 되지 않게 하려는 것입니다.
