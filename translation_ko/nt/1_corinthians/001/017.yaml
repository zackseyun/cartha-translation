review_pass:
  verdict: revise
  source_fidelity: 원문의 대조(οὐ ... ἀλλὰ ...; οὐκ ἐν σοφίᾳ λόγου; ἵνα μὴ κενωθῇ)를 따르면, 초안은 ‘말의 지혜로 하지 않게 하심’을 메시아께서 보내신 목적에 직접 연결하여 원문의 수식 관계를 다소 흐립니다. 또한 ‘나를 보내신 것은 … 것이었고’와 ‘하시려는 것이었습니다’라는 과거 서술은 현재적 논증의 문맥보다 덜 적절합니다. 수정문은 복음 선포를 ‘말의 지혜로’ 하지 않는 것과 십자가가 헛되게 되지 않는 목적을 명확히 연결합니다.
  naturalness: ‘말의 지혜로 하지 않게 하심은’은 현대 표준 한국어 합쇼체에서 다소 무겁고, 무엇을 ‘하지’ 않는지 불분명합니다. ‘말의 지혜로 복음을 전하지 않는 것은’으로 명시하면 자연스럽고 의미도 선명해집니다.
  terminology: Χριστός의 제목성을 살려 ‘메시아’를 유지했습니다. βαπτίζειν은 한국어 성경 및 일반 교회 용례에서 더 널리 통용되는 ‘세례를 베풀다’로 옮겼습니다. κενωθῇ는 원문의 구체적 ‘비게 되다/무효화되다’의 범위를 보존하여 ‘헛되게 되지 않게’로 번역했습니다.
  issues:
  - severity: medium
    issue: ‘그것도 말의 지혜로 하지 않게 하심은’의 문법적 연결이 원문의 논리 관계를 흐립니다.
    rationale: οὐκ ἐν σοφίᾳ λόγου는 복음 선포의 방식에 대한 부정이며, ἵνα절은 그 방식이 아닌 이유/목적을 나타냅니다. 초안은 이를 보내심 자체의 목적처럼 읽히게 할 수 있습니다.
  - severity: low
    issue: ‘침례’는 특정 한국 교회 전통과 더 강하게 결부될 수 있습니다.
    rationale: 원문은 의례의 방식에 관한 교파적 구별을 명시하지 않습니다. 널리 통용되는 ‘세례를 베풀다’가 불필요한 교파적 연상을 줄입니다.
  - severity: low
    issue: 초안의 과거형 종결이 바울의 현재적 설명과 다소 어긋납니다.
    rationale: 현재형 ‘보내신 것은 … 것입니다’ 및 ‘전하지 않는 것은 … 것입니다’가 현대 한국어에서 원문의 논증을 더 자연스럽게 전달합니다.
