review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 전반적 뜻은 본문과 일치하지만, σχίσματα를 「분쟁」으로 옮기면 관계적 분열·파당의 의미보다 다툼 자체를 뜻하기 쉬워 11절의 ἔριδες와의 구별이 흐려집니다. 또한 「바랍니다」는 바울의 직접적 권면(παρακαλῶ)을 다소 약화합니다. 「같은 뜻」은 γνώμῃ의 판단·견해라는 의미를 충분히 드러내지 못합니다.
  naturalness: 「형제 여러분」, 「간곡히 권합니다」, 「같은 마음과 같은 판단으로 온전히 하나가 되기를」은 현대 표준어 합쇼체로 자연스럽고, 원문의 병렬 구조와 권면의 어조를 잘 보존합니다.
  terminology: κύριος는 「주」, Χριστός의 직함은 프로젝트 방침에 따라 「메시아」로 유지했습니다. 「예수 메시아」는 한국어에서 다소 낯설 수 있으므로 전통적 명칭 「그리스도」를 각주로 밝혔습니다. σχίσματα는 「분열」로, κατηρτισμένοι는 회복·결속의 결과를 담아 「온전히 하나가 되다」로 옮겼습니다.
  issues:
  - severity: medium
    issue: σχίσματα를 「분쟁」으로 번역함
    rationale: σχίσματα는 공동체 안의 갈라짐·분열을 가리킵니다. 「분쟁」은 다음 절의 ἔριδες(다툼)와 더 가까워 의미 구별을 약화할 수 있습니다.
  - severity: low
    issue: Παρακαλῶ의 권면 어조가 「바랍니다」에서 완화됨
    rationale: 「바랍니다」도 문법적으로 가능하지만, 본문의 간곡한 사도적 호소에는 「간곡히 권합니다」가 더 직접적으로 상응합니다.
  - severity: low
    issue: γνώμῃ를 「뜻」으로만 옮김
    rationale: γνώμη는 여기서 공유된 판단, 견해, 결정을 가리키므로 「판단」을 사용해 νοῒ(마음)와의 구별을 보이는 편이 좋습니다.
