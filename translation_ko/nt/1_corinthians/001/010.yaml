id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: Now I urge you[a], brothers, by the name of our Lord Jesus Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
  footnotes:
  - marker: a
    text: Or brothers and sisters; the Greek masculine plural may address the whole believing community.
    reason: cultural_note
  - marker: b
    text: Messiah, traditionally 'Christ.'
    reason: lexical_alternative
  - marker: c
    text: Or 'there be no schisms among you.'
    reason: lexical_alternative
  - marker: d
    text: Or 'be restored' or 'be mended together.'
    reason: lexical_alternative
  - marker: e
    text: Or 'the same judgment' or 'the same conviction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 형제 여러분[a], 우리 주 예수 메시아[b]의 이름으로 여러분에게 간곡히 권합니다. 여러분 모두가 같은 말을 하고, 여러분 가운데 분열[c]이 없으며, 같은 마음과 같은 판단[e]으로 온전히 하나가 되기를[d] 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「형제자매 여러분」. 그리스어 남성 복수형은 믿는 공동체 전체에게 하는 호칭일 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 「메시아」는 전통적으로 「그리스도」라고 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「갈라짐」 또는 「분파」.
    reason: lexical_alternative
  - marker: d
    text: 또는 「회복되기를」 또는 「함께 바로 갖추어지기를」. 원어는 깨진 것을 제자리에 맞추어 회복하는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 「같은 견해」 또는 「같은 확신」.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  english_pob_choice: I urge
  chosen_korean: 권합니다
  alternatives_korean:
  - 간곡히 부탁합니다
  lexicon: BDAG
  rationale: 바울 권면 정형 동사.
- source_word: σχίσματα
  english_pob_choice: divisions
  chosen_korean: 분쟁
  alternatives_korean:
  - 분열
  - 갈라짐
  lexicon: BDAG
  rationale: σχίσμα는 회중 내 파벌화/분열을 가리키며, 이어지는 11절의 ἔριδες(다툼)와 호응한다. 「분쟁」을 기본으로 하되 11:18에서 「분열」도 사용.
- source_word: κατηρτισμένοι
  english_pob_choice: joined together
  chosen_korean: 온전히 연합하기를
  alternatives_korean:
  - 바르게 갖추어지기를
  lexicon: BDAG
  rationale: καταρτίζω는 깨진 것을 본래의 자리에 맞추어 회복함을 가리킨다.
