  to: 형제 여러분[a], 우리 주 예수 메시아[b]의 이름으로 여러분에게 간곡히 권합니다. 여러분 모두가 같은 말을 하고, 여러분 가운데 분열[c]이 없으며, 같은 마음과 같은 판단[e]으로 온전히 하나가 되기를[d] 바랍니다.
  rationale: 원문의 권면 동사와 ἵνα 이하의 세 병렬 요소를 한국어에서 유지했습니다. 「분열」로 σχίσματα의 공동체적 갈라짐을 보존하고, 「같은 마음과 같은 판단」으로 νοῦς와 γνώμη의 구별을 드러냈습니다. 각주 표지를 해당 어휘에 직접 배치하여 영어 POB 감사 이력의 관련 정보를 한국어 독자도 확인할 수 있게 했습니다.
