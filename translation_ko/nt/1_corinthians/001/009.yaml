translation:
  language: ko
  text: 하나님은 신실하십니다[a]. 하나님으로 말미암아 여러분은 그분의 아들이시며 우리 주이신 예수 메시아[d]와 교제하도록[c] 부르심을 받았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “신뢰할 만하십니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님을 통하여.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “함께 참여하도록” 또는 “함께 나누도록.”
    reason: lexical_alternative
  - marker: d
    text: 그리스어는 “예수 그리스도”입니다. “메시아”는 칭호 Χριστός를 옮긴 것입니다.
    reason: alternative_reading
