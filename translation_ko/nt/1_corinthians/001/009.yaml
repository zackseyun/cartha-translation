revisions:
- from: 하나님은 신실하시니, 그분으로 말미암아 여러분이 그분의 아들 우리 주 예수 메시아와의 사귐으로 부르심을 받았습니다.
  to: 하나님은 신실하십니다[a]. 하나님으로 말미암아 여러분은 그분의 아들이시며 우리 주이신 예수 메시아[d]와 교제하도록[c] 부르심을 받았습니다[b].
  rationale: 문장 경계를 회복하여 원문의 진술 구조를 보존하고, εἰς κοινωνίαν을 목적을 나타내는 ‘교제하도록’으로 옮겼습니다. ‘하나님으로 말미암아’와 수동형 ‘부르심을 받았습니다’는 δι’ οὗ와 ἐκλήθητε의 행위자 및 수동태를 유지합니다. 예수 메시아에 대한 아들과 주의 칭호도 자연스러운 현대 합쇼체로 명확히 했습니다.
