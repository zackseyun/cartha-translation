  source_fidelity: 초안의 기본 의미는 대체로 정확합니다. 그러나 διὰ τῆς σοφίας는 소유격이 명시되지 않았는데 ‘자기 지혜로’라고 번역하여 ‘자기’라는 해석적 한정을 더했습니다. 또한 ἐπειδὴ γὰρ의 인과적 연결이 번역문에서 충분히 드러나지 않습니다.
  naturalness: ‘하나님의 지혜 안에서’는 다소 직역적이지만, 여기서 ἐν의 영역·정황 및 수단 사이의 여지를 보존하므로 허용됩니다. ‘지혜를 통하여’와 ‘선포의 어리석음을 통하여’는 현대 표준어 합쇼체에서 자연스럽고 문장 구조도 명료합니다.
  terminology: ‘하나님’, ‘지혜’, ‘구원’, ‘믿는 사람들’은 적절합니다. κήρυγμα의 메시지와 선포 행위 양쪽의 연상을 성급히 한쪽으로 제한하지 않도록 ‘선포의 어리석음’을 유지하고, 대안 번역을 해당 구절에 앵커한 각주로 제시합니다.
  issues:
