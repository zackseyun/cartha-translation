    rationale: 그리스어 διὰ τῆς σοφίας는 ‘지혜를 통하여’이며, ‘세상 자신의 지혜’라는 소유 관계는 문맥상 가능한 이해이지만 본문에 명시되어 있지 않습니다. 번역 본문에서는 이를 추가하지 않는 편이 원문의 폭을 보존합니다.
