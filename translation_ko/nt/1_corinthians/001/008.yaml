  source_fidelity: 원문의 βεβαιώσει는 ‘견고하게 하다/굳게 세우다’이며, ἕως τέλους는 그 գործող이 ‘끝까지’ 지속됨을 나타냅니다. ἀνεγκλήτους는 ‘흠 없는’ 상태를 나타내고, ἐν τῇ ἡμέρᾳ는 ‘우리 주 예수 메시아의 날에’라는 시간적 맥락을 제공합니다. 수정문은 이 관계를 보존합니다.
  naturalness: 초안의 ‘견고하게 하셔서’는 뒤 절이 앞 절의 목적 또는 결과인 것처럼 다소 강하게 연결합니다. ‘굳게 세워 주시며’로 바꾸면 현대 표준어 합쇼체에서 자연스럽고, 원문의 서술적 연결도 더 잘 반영합니다.
  terminology: ‘우리 주 예수 메시아’, ‘주의 날’, ‘흠 없는’은 본문의 칭호와 종말론적 관용 표현 및 ἀνεγκλήτους의 비난·고발 불가능성의 기본 의미에 부합합니다. ‘메시아’는 Χριστοῦ의 칭호성을 보존합니다.
  issues:
