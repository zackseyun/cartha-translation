  verdict: revise
  source_fidelity: 「육신을 따라」는 문자적으로는 가능하지만, 이 문맥의 κατὰ σάρκα는 지혜를 인간적·세속적 판단으로 평가한다는 뜻입니다. 「사람의 기준으로」가 그 관용적 의미를 더 정확하고 오해 없이 전달합니다. Βλέπετε의 숙고를 촉구하는 힘도 「생각해 보십시오」로 자연스럽게 반영했습니다.
  naturalness: 현행 「육신을 따라 지혜로운 자」는 현대 한국어에서 다소 직역투이며 ‘육신적 지혜’라는 다른 바울적 의미로 오해될 수 있습니다. 「여러분 가운데 사람의 기준으로 지혜로운 이」는 합쇼체 문맥에서 자연스럽고 병렬 구조도 분명합니다.
  terminology: κλῆσις는 「부르심」으로 유지했습니다. δυνατοί는 사회적 힘을 포괄하는 「능력 있는 이」로, εὐγενεῖς는 출생·가문상의 높은 지위를 가리키는 「좋은 가문 출신인 이」로 옮겼습니다. ἀδελφοί의 남성 복수 호칭은 본문에서 보존하고, 회중 전체를 부른다는 점은 각주로 밝혔습니다.
  issues:
