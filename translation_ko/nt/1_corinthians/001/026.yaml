    issue: 「육신을 따라」가 κατὰ σάρκα의 문맥상 관용 의미를 충분히 드러내지 못함
    rationale: 이 구절은 ‘죄된 육신’과의 대조를 말하기보다 인간적·세속적 평가에 따른 지혜를 가리킵니다. 직역은 한국어 독자에게 신학적으로 다른 뉘앙스를 줄 수 있습니다.
  - severity: low
