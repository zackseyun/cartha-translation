translation:
  language: ko
  text: 형제들이여[a], 여러분의 부르심을 생각해 보십시오. 여러분 가운데 사람의 기준으로 지혜로운 이가 많지 않고, 능력 있는 이가 많지 않고, 좋은 가문 출신인 이가 많지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
