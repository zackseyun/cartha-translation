  to: 고린도에 있는 하나님의 교회, 곧 메시아 예수 안에서 거룩하게 된 이들이며 부르심을 받은 성도들에게, 또한 모든 곳에서 우리 주 예수 메시아의 이름을 부르는 모든 이들에게—그들과 우리의 곳에서[a]—편지합니다.
