  terminology: ‘십자가’, ‘말씀’, ‘멸망’, ‘구원’, ‘하나님의 능력’은 바울의 문맥 및 한국어 성서 번역의 주요 용례와 잘 부합합니다. ‘어리석음’은 μωρία의 강한 수사적 대조를 적절히 보존합니다.
