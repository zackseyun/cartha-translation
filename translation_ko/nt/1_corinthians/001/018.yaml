  source_fidelity: 그리스어의 대조 구조(‘멸망하는 자들’ 대 ‘구원받는 우리’), 현재분사의 진행성을 반영한 표현, 그리고 ‘하나님의 능력’이라는 술어를 충실히 옮겼습니다. ‘십자가의 말씀’은 ὁ λόγος ὁ τοῦ σταυροῦ의 자연스럽고 본문 맥락에 맞는 번역입니다.
