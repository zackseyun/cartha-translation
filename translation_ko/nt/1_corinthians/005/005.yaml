  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
  footnotes:
  - marker: a
    text: Or 'for the ruin of the flesh.' The phrase may refer to severe bodily judgment, or more figuratively to the destruction of the man's fleshly/sinful orientation.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read 'of our Lord Jesus' or 'of the Lord Jesus' instead of simply 'of the Lord.'
    reason: textual_variant
translation:
  language: ko
  text: 그런 사람을 육신의 멸망을 위하여[a] 사탄에게 넘겨주십시오. 이는 주의 날[b]에 영이 구원받게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “육신의 파멸을 위하여.” 이 표현은 심한 육체적 심판을 가리킬 수도 있고, 더 비유적으로 그 사람의 육신적·죄된 성향이 파괴되는 것을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 단순히 “주의 날” 대신 “우리 주 예수의 날” 또는 “주 예수의 날”이라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ
  english_pob_choice: to hand such a man over to Satan
  chosen_korean: 이런 자를 사탄에게 넘겨주어
  alternatives_korean:
  - 이러한 사람을 사탄에게 내어주어
  lexicon: BDAG
  rationale: 부정사를 명령적 의미로. 회중에서 추방하여 사탄 영역(교회 밖 세상)에 넘김.
- source_word: εἰς ὄλεθρον τῆς σαρκός
  english_pob_choice: for the destruction of the flesh
  chosen_korean: 육신을 멸하게
  alternatives_korean:
  - 육체의 멸망에 이르게
  lexicon: BDAG
  rationale: σάρξ를 「육신」으로 일관(2:14·3:1–3·26).
- source_word: τὸ πνεῦμα σωθῇ
  english_pob_choice: the spirit may be saved
  chosen_korean: 그의 영이 구원받게
  alternatives_korean:
  - 영혼이 구원받게
  lexicon: BDAG
  rationale: 중성 단수 πνεῦμα. 죄인 자신의 영을 가리킨다.
