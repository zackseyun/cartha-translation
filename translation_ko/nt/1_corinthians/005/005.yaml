review_pass:
  verdict: revise
  source_fidelity: 수정안은 παραδοῦναι의 위임/인도 명령, εἰς ὄλεθρον τῆς σαρκός의 목적 표현, 그리고 ἵνα 이하의 목적절을 보존합니다. 특히 원문에 없는 소유격을 제거하여 τὸ πνεῦμα의 표현상 개방성을 유지합니다.
  naturalness: ‘그런 사람을 … 사탄에게 넘겨주십시오’와 ‘… 구원받도록’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 문장 관계도 명료하게 드러냅니다.
  terminology: Σατανᾷ는 ‘사탄’, σάρξ는 논쟁적 의미를 결정하지 않는 ‘육신’, πνεῦμα는 ‘영’, κύριος는 ‘주’로 옮겼습니다. ‘영혼’이나 ‘그의 영’처럼 원문보다 의미를 좁히는 표현은 피했습니다.
  issues:
  - severity: medium
    issue: ‘육신을 멸하게’는 원문의 명사구를 사탄이 수행하는 동작처럼 읽히게 할 수 있습니다.
    rationale: εἰς ὄλεθρον τῆς σαρκός는 직역하면 ‘육신의 멸망을 위하여’이며, 멸망의 작용 주체나 육신의 의미를 본문에서 확정하지 않습니다.
  - severity: medium
    issue: ‘그의 영’은 원문에 없는 소유격을 보충합니다.
    rationale: τὸ πνεῦμα에는 명시적 소유 대명사가 없습니다. 문맥상 범죄자와 관련될 가능성이 높더라도, 본문은 ‘영’으로 두어야 합니다.
  - severity: low
    issue: ‘이런 자’보다 ‘그런 사람’이 τοιοῦτον의 범주적이면서 특정한 지시를 현대 한국어에서 더 자연스럽게 전달합니다.
    rationale: ‘그런 사람’은 성별을 불필요하게 덧붙이지 않으며, 해당 범죄자를 가리키는 문맥에 잘 맞습니다.
  revised_text: 그런 사람을 육신의 멸망을 위하여 사탄에게 넘겨주십시오. 이는 주의 날에 영이 구원받도록 하려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘육신의 파멸을 위하여’. 이 표현은 심각한 신체적 심판을 가리킬 수도 있고, 더 비유적으로 그 사람의 육신적·죄된 성향이 파괴되는 것을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 ‘주의 날’ 대신 ‘우리 주 예수의 날’ 또는 ‘주 예수의 날’이라고 읽습니다.
    reason: textual_variant
  revision_rationale: 원문의 목적 구문을 ‘육신의 멸망을 위하여’로 재구성하여 주체와 의미의 논쟁을 본문에서 결정하지 않았습니다. 또한 ‘그의’를 삭제하여 τὸ πνεῦμα의 무소유격 표현을 보존했습니다. 사본상의 확장 독법과 ‘육신’의 의미 범위는 각주로 제시했습니다.
