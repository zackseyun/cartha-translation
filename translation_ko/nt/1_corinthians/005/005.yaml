review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys handing the offender over to Satan and the intended salvation, but it over-specifies τὸ πνεῦμα by adding “his” (그의), and “육신을 멸하게” shifts the genitive phrase εἰς ὄλεθρον τῆς σαρκός into a more definite causative statement. The revision retains the source’s ambiguity concerning both ‘flesh’ and ‘spirit.’
  naturalness: The revised wording is natural modern standard Korean in formal-polite 합쇼체. “육신의 멸망을 위하여” is appropriately solemn without resolving the debated sense of the phrase.
  terminology: “사탄,” “육신,” “영,” “구원,” and “주” preserve established biblical terminology and the source wording. “그런 사람” conveys τὸν τοιοῦτον naturally without introducing unnecessary interpretive detail.
  issues:
  - severity: medium
    issue: Possessive added to τὸ πνεῦμα
    rationale: “그의 영” adds an explicit possessive absent from the Greek. Although the contextual referent is likely the offender, the source leaves the expression formally unqualified.
  - severity: medium
    issue: The phrase about flesh is made overly causative and lacks its ambiguity note
    rationale: “육신을 멸하게” can imply a definite command to destroy the body/flesh. “육신의 멸망을 위하여” more directly reflects εἰς ὄλεθρον τῆς σαρκός while leaving its bodily and figurative interpretations open.
  - severity: low
    issue: Source-audit footnotes are absent
    rationale: The ambiguity of ‘flesh’ and the manuscript expansion at ‘the day of the Lord’ should be retained with anchors in the Korean text.
  revised_text: 그런 사람을 육신의 멸망을 위하여[a] 사탄에게 넘겨주십시오. 이는 주의 날[b]에 영이 구원받게 하려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “육신의 파멸을 위하여.” 이 표현은 심한 육체적 심판을 가리킬 수도 있고, 더 비유적으로 그 사람의 육신적·죄된 성향이 파괴되는 것을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 단순히 “주의 날” 대신 “우리 주 예수의 날” 또는 “주 예수의 날”이라고 읽습니다.
    reason: textual_variant
  revision_rationale: 원문의 명령적 기능은 “넘겨주십시오”로 유지하되, 목적절은 한국어에서 자연스러운 “이는 … 하려는 것입니다”로 옮겼습니다. “영”에 소유격을 덧붙이지 않았고, “육신의 멸망”의 해석상 논쟁은 본문과 각주에서 보존했습니다. SBLGNT의 단순한 “주의 날”을 따르면서 사본상 확장은 각주로 처리했습니다.
