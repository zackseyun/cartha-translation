review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘떠나 있으나’는 ἀπὼν(부재한)의 뜻을 실제로 떠나간 것으로 다소 좁히며, ‘함께 있어’는 본문에 없는 ‘함께’를 전면화합니다. 또한 ‘그렇게 심판하였습니다’는 οὕτως가 행위가 아니라 심판 방식에 걸리는 것으로 읽힐 수 있습니다. οὕτως τοῦτο는 ‘이처럼 이 일을’로 함께 반영하는 것이 안전합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 대조(몸/영), 가정적 비교(마치 … 있는 것처럼), 이미 내려진 판단을 명료하게 유지합니다.
  terminology: ‘영’은 πνεύματι의 해석상 열려 있는 표현을 보존합니다. ‘판단을 내렸습니다’는 κέκρικα의 완료상과 징계 문맥을 자연스럽게 반영하며, ‘행한 자’는 κατεργασάμενον에 불필요한 추가 판단을 부과하지 않습니다.
  issues:
  - severity: medium
    issue: ‘몸으로는 떠나 있으나’
    rationale: ἀπὼν은 바울의 물리적 부재를 말합니다. ‘떠나 있다’는 출발·이탈 행위를 불필요하게 암시할 수 있으므로 ‘없으나’가 더 직접적입니다.
  - severity: medium
    issue: ‘영으로는 함께 있어’
    rationale: παρὼν은 ‘present’이며, ‘함께’는 문맥상 가능하지만 원문의 직접 표현은 아닙니다. ‘영으로는 그곳에 있으며’가 현존과 장소적 대조를 더 분명히 합니다.
  - severity: high
    issue: ‘…저지른 자를 그렇게 심판하였습니다’의 수식 범위
    rationale: οὕτως는 심판의 방식이 아니라 τοῦτο(이 일)를 행한 방식/성격을 수식합니다. 한국어 어순상 초안은 ‘그렇게’가 ‘심판하였습니다’를 수식하는 것으로 읽힐 수 있습니다.
