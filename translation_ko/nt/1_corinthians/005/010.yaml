  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
  footnotes:
  - marker: a
    text: Or 'robbers' or 'extortioners' for 'swindlers' (ἅρπαξιν); the term can denote those who seize from others by force or exploitation.
    reason: lexical_alternative
  - marker: b
    text: Paul is clarifying that he did not mean believers must avoid all immoral people outside the church; compare the application in 1 Corinthians 5:11.
    reason: cross_reference
translation:
  language: ko
  text: 내가 말한 것은 이 세상의 성적으로 부도덕한 사람들이나 탐욕스러운 사람들과 강탈자들이나 우상 숭배자들을 전적으로 피하라는 뜻이 아니었습니다. 그랬다면 여러분은 세상 밖으로 나가야 했을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ πάντως
  english_pob_choice: not at all
  chosen_korean: 일절 … 아닙니다
  alternatives_korean:
  - 전적으로 … 아닙니다
  lexicon: BDAG
  rationale: 강한 부정 한정.
- source_word: πλεονέκταις
  english_pob_choice: the greedy
  chosen_korean: 탐욕스러운 자들
  alternatives_korean:
  - 탐심을 부리는 자들
  lexicon: BDAG
  rationale: 6:10·골 3:5와 어휘 호응.
- source_word: ἅρπαξιν
  english_pob_choice: swindlers
  chosen_korean: 강탈자들
  alternatives_korean:
  - 약탈자들
  lexicon: BDAG
  rationale: 폭력적·기만적 탈취자. 「강탈자」가 명확.
- source_word: εἰδωλολάτραις
  english_pob_choice: idolaters
  chosen_korean: 우상숭배자들
  alternatives_korean:
  - 우상을 섬기는 자들
  lexicon: BDAG
  rationale: 한국 신학 정착어. 8장 우상 제물 문제와 연결.
