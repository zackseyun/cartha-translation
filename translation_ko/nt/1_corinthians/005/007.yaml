  text: 묵은 누룩을 깨끗이 없애십시오. 그러면 여러분은 새 반죽이 될 것입니다. 여러분은 누룩 없는 반죽이기 때문입니다. 우리의 유월절 어린양[a]이신 메시아께서 희생 제물로 바쳐지셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “우리의 유월절이신 메시아께서 희생되셨습니다.”입니다. 그리스어 ‘우리의 유월절’은 문맥상 유월절 어린양 또는 유월절 희생 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
