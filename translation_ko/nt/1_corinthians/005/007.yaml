  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 「사실 여러분은 누룩 없는 자들입니다」는 καθώς ἐστε ἄζυμοι의 비교/근거 관계(‘여러분이 누룩 없는 상태이므로/그러한 존재이므로’)를 ‘사실’이라는 단순한 새 진술로 바꾸며, 빵 반죽 비유도 약화합니다. 또한 ἐτύθη는 제의적 희생의 뜻을 분명히 하는 편이 적절합니다.
  naturalness: 「누룩 없는 자들」은 현대 한국어에서 다소 부자연스럽고 비유의 대상이 사람으로 전환됩니다. 「누룩 없는 반죽」 및 「희생 제물로 바쳐지셨습니다」가 문맥상 자연스럽고 합쇼체 문체에 맞습니다.
  terminology: 「묵은 누룩」, 「새 반죽」, 「유월절 어린양」, 「메시아」는 원문의 비유와 영어 POB의 어휘 결정을 적절히 반영합니다. ‘어린양’은 원문에 명시되지 않고 πάσχα 및 ἐτύθη의 문맥에서 보충된 표현이므로 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: καθώς의 관계가 「사실」로 번역됨
    rationale: καθώς는 ‘마치/…인 것처럼’ 또는 문맥상 ‘…이므로’의 연결을 나타냅니다. 「사실」은 이 관계를 보존하지 못합니다.
  - severity: medium
    issue: ἄζυμοι를 「누룩 없는 자들」로 표현함
    rationale: 원문의 반죽·누룩 은유가 사람을 가리키는 일반적 표현으로 약화됩니다. 「누룩 없는 반죽」이 직전의 φύραμα와 연결되어 더 충실하고 자연스럽습니다.
  - severity: low
    issue: ‘유월절 어린양’의 보충에 대한 각주 부재
    rationale: πάσχα는 문자적으로 ‘유월절’이며, ‘어린양’은 희생 동사와 문맥에 근거한 해석적 보충입니다. 투명성을 위해 각주가 필요합니다.
