  source_fidelity: 원문의 대조(νῦν δὲ ἔγραψα, μὴ συναναμίγνυσθαι, ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ, 죄목 열거, μηδὲ συνεσθίειν)를 충실히 반영합니다. ‘쓴 것은’은 ἔγραψα의 과거 서술을 자연스럽게 옮기며, ‘형제라 불리는 자’는 ὀνομαζόμενος의 공동체 내 호칭이라는 뉘앙스를 보존합니다. ‘함께 먹지도 말라’도 μηδὲ συνεσθίειν의 강조를 적절히 전달합니다.
  naturalness: 문장은 현대 표준어의 격식 있는 문체로 자연스럽고, 조건절과 명령 내용의 연결도 명료합니다. ‘술 취하는 자’는 열거 문맥에서 습관적 특성을 가리키는 표현으로 무리 없이 이해됩니다.
  terminology: ‘음행하는 자’, ‘탐욕스러운 자’, ‘우상숭배자’, ‘비방하는 자’, ‘술 취하는 자’, ‘강탈자’는 각각 πόρνος, πλεονέκτης, εἰδωλολάτρης, λοίδορος, μέθυσος, ἅρπαξ에 대응 가능한 번역입니다. 특히 λοίδορος를 ‘비방하는 자’로 옮긴 것은 문맥상 적절하며, 불필요하게 특정 교리적 해석을 더하지 않습니다.
