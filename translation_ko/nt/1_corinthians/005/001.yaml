    text: 또는 “민족들 가운데에도.” 그리스어는 문맥상 흔히 비유대 민족, 곧 이방인들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “자기 아버지의 아내를 가지고 있다.” 여기서 “가지다”는 성적 관계를 가리키는 완곡한 표현입니다. 그 여인은 그의 계모일 가능성이 있으나, 본문은 그렇게 특정하지 않습니다.
    reason: lexical_alternative
  revision_rationale: The revision improves the impersonal-report construction and modern Korean flow, regularizes the generic plural 「이방인들」, and adds anchored notes that preserve the lexical alternatives and the sexual euphemism without inserting an assertion of cohabitation or identifying the woman as a stepmother in the main text.
