review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the central claim accurately: sexual immorality is publicly reported within the Corinthian community, of a kind said not to occur even among the Gentiles, involving a man and his father''s wife. However, 「음행이 있다는 보고가 있는데」 is an awkward mixed construction for ἀκούεται, and the rationale''s claim that 「취하고 있다」 specifies a continuing cohabiting relationship goes beyond what ἔχειν itself requires. The revised wording retains the Greek euphemism while explaining it in a note.'
  naturalness: 「실제로 여러분 가운데 음행이 있다는 소문이 들립니다」 is more idiomatic modern formal Korean than 「음행이 있다는 보고가 있는데」 and avoids the unfinished-sounding connective 「-는데」. 「이방인들 가운데에도」 is also more natural in this generic plural sense.
  terminology: 「음행」 is an established Korean biblical rendering for πορνεία and is suitable in this formal register. 「이방인들」 appropriately renders ἔθνεσιν without the added evaluative sense of 「이교도들」. 「자기 아버지의 아내」 properly avoids prematurely identifying the woman as a stepmother.
  issues:
  - severity: medium
    issue: 「음행이 있다는 보고가 있는데」 is awkward and leaves a connective dangling.
    rationale: ἀκούεται is an impersonal passive, 'is heard/reported.' Korean 「…소문이 들립니다」 directly and naturally represents this form, while the existing 「-는데」 anticipates a following contrast that the sentence structure does not supply.
  - severity: medium
    issue: The lexical rationale states that 「취하고 있다」 explicitly denotes a continuing cohabiting relationship.
    rationale: ἔχειν is a euphemistic idiom in this context for having a sexual relationship; it does not by itself establish cohabitation. A footnote can clarify the idiom without adding that specific circumstance to the translation or its rationale.
  - severity: low
    issue: The draft has no Korean footnote anchors for the relevant lexical alternatives preserved in the audit trail.
    rationale: Notes on ἔθνεσιν and the euphemistic ἔχειν help preserve lexical precision, including that the woman may be a stepmother but is not identified as such by the text.
  revised_text: 실제로 여러분 가운데 음행이 있다는 소문이 들립니다. 그것도 이방인들[a] 가운데에도 없는 종류의 음행입니다. 곧 어떤 사람이 자기 아버지의 아내를 취하고 있다는[b] 것입니다.
  revised_footnotes:
