- from: 실제로 여러분 가운데 음행이 있다는 보고가 있는데, 그것도 이방인 가운데서도 없는 종류의 음행입니다. 곧 한 사람이 자기 아버지의 아내를 취하고 있다는 것입니다.
  to: 실제로 여러분 가운데 음행이 있다는 소문이 들립니다. 그것도 이방인들[a] 가운데에도 없는 종류의 음행입니다. 곧 어떤 사람이 자기 아버지의 아내를 취하고 있다는[b] 것입니다.
