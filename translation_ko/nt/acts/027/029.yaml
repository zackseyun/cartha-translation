  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
  footnotes:
  - marker: a
    text: Or 'that we might be driven onto jagged rocks' or 'run aground on rough places.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'prayed for day to become'; that is, they longed for daylight to arrive.
    reason: lexical_alternative
translation:
  language: ko
  text: 바위가 많은 곳[a]에 좌초할까 두려워하여, 그들은 선미에서 닻 네 개를 내리고 날이 밝아 오기를[b] 기도했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘험한 곳에 떠밀려 좌초할까’.
    reason: τραχεῖς τόπους 및 항해 문맥의 ἐκπέσωμεν에 대한 가능한 표현을 제시합니다.
  - marker: b
    text: 직역하면 ‘날이 되기를’. 곧 날이 밝기를 간절히 바랐다는 뜻입니다.
    reason: ἡμέραν γενέσθαι의 직역적 표현과 관용적 의미를 밝힙니다.
