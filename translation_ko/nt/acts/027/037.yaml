  source_fidelity: 그리스어 ἤμεθα(‘우리는 있었다’)를 ‘우리는 …명이었습니다’로 자연스럽게 반영했으며, αἱ πᾶσαι ψυχαὶ ἐν τῷ πλοίῳ의 ‘배 안에 있던 우리는 모두’를 통해 배에 있던 전원을 가리키는 뜻을 보존했습니다. 정확한 수 276도 충실히 옮겼습니다. δέ의 가벼운 연결 기능은 한국어에서 무표지로 처리해도 무방합니다.
  naturalness: ‘배 안에 있던 우리는 모두 합하여 이백칠십육 명이었습니다’는 현대 표준 한국어 합쇼체로 자연스럽고 문맥상 명료합니다.
  terminology: ψυχαί를 문맥에 맞게 ‘명’으로 옮겨 비물질적 영혼을 뜻하는 것으로 오해될 여지를 피했습니다. ‘배’와 수사 표기도 적절합니다.
