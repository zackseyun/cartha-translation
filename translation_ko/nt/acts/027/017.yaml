  source_fidelity: 원문의 항해 용어와 진행은 대체로 반영되었습니다. 그러나 τὸ σκεῦος는 정확한 대상을 확정하기 어려운 넓은 말인데, 현 번역의 “닻 [장구]”는 대상을 ‘닻’으로 단정하는 동시에 대괄호 표기가 남아 있어 원문 및 구조상 부정확합니다.
  naturalness: “보강 밧줄을 사용해 배 둘레를 묶었습니다”는 이해 가능하지만, 선체를 밧줄로 감아 보강하는 행위를 더 분명하고 자연스럽게 표현할 수 있습니다. “그들이 … 두려워하여”의 주어 반복도 줄이는 편이 매끄럽습니다.
  terminology: “스르디스”는 한국어 성서 전통에 따른 지명 표기로 사용할 수 있습니다. σκεῦος는 ‘장비’로 옮기고, 정확한 항해 장비가 불확실하다는 점을 각주로 밝혀 원문의 모호성을 보존해야 합니다.
