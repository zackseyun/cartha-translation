- from: 오랫동안 음식도 들지 못한 가운데, 바울이 그들 가운데 일어서서 말했습니다. 「여러분, 여러분이 제 말을 들어 그레데에서 출항하지 않았더라면, 이 손상과 손실을 면할 수 있었을 것입니다.
  to: 오랫동안 음식을 먹지 못한 지 오래되어, 바울이 그들 가운데 일어서서 말했습니다. “여러분, 여러분은 제 말을 따라 그레데에서 출항하지 말았어야 했습니다. 그랬더라면 이 피해와 손실을 피할 수 있었을 것입니다.”
  rationale: 'The revision preserves the genitive-absolute circumstance of prolonged not eating, renders σταθείς as Paul’s standing to address the group, and restores the force of ἔδει as a past obligation: they ought to have followed his counsel and not sailed. The final sentence expresses the resulting avoidance of the damage and loss. No footnote is necessary in Korean because the chosen wording does not introduce a disputed interpretation beyond the immediate storm context.'
