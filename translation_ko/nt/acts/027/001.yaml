  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: Now when it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
  footnotes:
  - marker: a
    text: Or “of the Augustan Cohort”; possibly “of the Sebaste cohort.” The Greek Σεβαστῆς reflects a title associated with Augustus/the emperor, but the exact historical unit is uncertain.
    reason: alternative_reading
translation:
  language: ko
  text: 우리가 이탈리아로 항해해 가기로 결정되자, 그들은 바울과 몇몇 다른 죄수를 아우구스투스 부대의[a] 백부장 율리오에게 넘겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「황제 부대의」; 「세바스테 부대의」. 헬라어 Σεβαστῆς는 아우구스투스 또는 황제와 관련된 칭호를 반영하지만, 정확한 역사적 부대의 명칭이나 동정은 확실하지 않습니다.
    reason: alternative_reading
