  source_fidelity: 초안의 ‘[나가게 했습니다]’는 헬라어 본문에 없는 행위자와 사역 의미를 보충하며, 앞 절에서 이어지는 동작을 괄호로 삽입해 본문의 생략을 부정확하게 처리합니다. 또한 ‘배의 조각’은 ἐπί τινων τῶν ἀπὸ τοῦ πλοίου의 부정적·포괄적 표현을 다소 좁힐 수 있습니다. 수정안은 두 집단의 대조와 난파에서의 신체적 구조/도달 의미를 유지합니다.
  naturalness: ‘나머지 사람들은 어떤 이들은 …, 어떤 이들은 … 붙잡고’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 생략된 이동 동작을 과도한 사역 표현 없이 문맥상 매끄럽게 나타냅니다. ‘무사히 육지에 이르렀습니다’도 서술 문맥에 적절합니다.
  terminology: σανίσιν은 ‘널빤지들’로, ἀπὸ τοῦ πλοίου는 ‘배에서 나온 물건들’로 옮겨 특정한 ‘조각’에 한정하지 않았습니다. διασωθῆναι는 이 문맥에서 신학적 구원보다 난파로부터의 물리적 안전 도달을 뜻하므로 ‘무사히 육지에 이르렀습니다’로 번역하고 각주에서 이를 밝혔습니다.
