translation:
  language: ko
  text: 그러므로 여러분에게 음식을 좀 드시기를 권합니다. 이것이 여러분의 생존[a]을 위한 것이기 때문입니다. 여러분 가운데 어느 누구도 머리카락 하나도 잃지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
