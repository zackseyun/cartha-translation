  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
  footnotes:
  - marker: a
    text: Or 'for this is for your salvation.' Here the Greek word can mean 'salvation,' 'deliverance,' or 'preservation'; in this context it refers to physical survival.
