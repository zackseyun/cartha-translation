    issue: ‘그들의 계획을 막았습니다’의 행위자·실행 의미가 다소 압축되어 있습니다.
    rationale: 그리스어는 백부장이 병사들(αὐτούς)이 앞 절의 의도(τοῦ βουλήματος)를 실행하지 못하게 했다고 말합니다. ‘계획을 실행하지 못하게 했습니다’가 이를 더 정확히 전달합니다.
  - severity: low
    issue: ‘먼저 뛰어내려’는 무엇에서 뛰어내리는지 문맥상만 드러납니다.
    rationale: ἀπορίψαντας는 배에서 물로 몸을 던지는 행위를 뜻하므로 ‘배에서 뛰어내려’로 보충하면 자연스럽고 의미를 과도하게 해석하지 않습니다.
