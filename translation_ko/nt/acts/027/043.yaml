  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그들의 계획을 막았습니다’는 계획 자체를 막았다는 뜻으로도 들릴 수 있어, αὐτοὺς τοῦ βουλήματος의 ‘그들이 그 의도를 실행하지 못하게 하다’를 더 분명히 드러내는 것이 좋습니다. 또한 ἀπορίψαντας는 배에서 몸을 던지는 동작을 가리키므로 ‘배에서 뛰어내려’가 문맥을 자연스럽게 밝혀 줍니다.
  naturalness: 합쇼체는 전반적으로 적절합니다. ‘명했고’보다 ‘명령했습니다’가 현대 표준어의 공식적 서술에 더 자연스럽고, 이어지는 다음 절과의 연결은 쉼표로 유지할 수 있습니다.
  terminology: ‘백부장’, ‘바울’, ‘육지’는 적절합니다. 신학적 용어 관련 쟁점은 없습니다.
  issues:
