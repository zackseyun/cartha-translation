  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
  footnotes:
  - marker: a
    text: Or “waiting anxiously”; the Greek participle can denote expectation, and in this storm context likely carries the sense of anxious suspense.
    reason: lexical_alternative
translation:
  language: ko
  text: 날이 밝아 오려고 할 때까지, 바울은 모두에게 음식을 좀 먹으라고 계속 권하며 말했습니다. “여러분은 오늘로 열나흘째, 기다리며[a] 음식을 전혀 먹지 않은 채 지내고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마음 졸이며 기다리면서.” 그리스어는 단순한 기대나 기다림을 뜻할 수 있으며, 폭풍의 문맥에서는 불안하게 기다리는 뜻일 수도 있습니다.
    reason: lexical_alternative
