  to: 여러 날 동안 우리가 천천히 항해하다가 간신히 니도 앞에 이르렀습니다. 바람이 우리가 앞으로 나아가는 것을 허락하지 않았으므로, 우리는 살모네 쪽 그레데의 바람을 피하는 편으로 항해했습니다.
  rationale: βραδυπλοοῦντες와 μόλις를 각각 ‘천천히 항해하다가’와 ‘간신히’로 구분했습니다. μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου는 원인의 속격절을 보존하여 번역했습니다. ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην은 살모네 쪽에 있는 그레데의 바람을 피하는 편으로 항해했다는 뜻으로, 항로 순서를 바꾸거나 ‘지나’라는 내용을 덧붙이지 않도록 옮겼습니다.
