  text: 여러 날 동안 우리가 천천히 항해하다가 간신히 니도 앞에 이르렀습니다. 바람이 우리가 앞으로 나아가는 것을 허락하지 않았으므로, 우리는 살모네 쪽 그레데의 바람을 피하는 편으로 항해했습니다.
