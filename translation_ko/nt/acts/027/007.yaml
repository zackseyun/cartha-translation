  source_fidelity: 개정이 필요합니다. 초안은 바람 때문에 진행하지 못한 이유와 그레데의 바람을 피하는 쪽으로 항해한 사실을 대체로 담았으나, 원문의 항로 서술 순서와 관계를 '살모네 앞을 지나 그레데의 ... 쪽으로'로 뒤바꾸었습니다. κατὰ Σαλμώνην은 그레데의 피항 측을 살모네 쪽과 관련하여 한정합니다.
  naturalness: ‘바람 그늘 쪽’은 현대 표준 한국어 항해 서술로 부자연스럽습니다. ‘바람을 피하는 쪽’이 의미를 자연스럽게 전달합니다.
  terminology: ‘그레데’, ‘니도’, ‘살모네’는 한국 성서 전통 및 음역 관례에 맞으며 유지할 수 있습니다. ‘바람이 우리를 가로막아’보다 원문의 허용하지 않음(μὴ προσεῶντος)을 반영하는 표현이 더 정확합니다.
  issues:
  - severity: medium
    issue: 항로의 순서와 구문 관계
    rationale: 원문은 먼저 ‘그레데 아래/바람을 피하는 쪽으로 항해했다’고 말하고, 이어 κατὰ Σαλμώνην으로 살모네 쪽의 위치를 덧붙입니다. 초안의 ‘살모네 앞을 지나 그레데의 ... 쪽으로’는 ‘지나’라는 이동을 첨가하고 수식 관계를 바꿉니다.
  - severity: medium
    issue: ‘바람 그늘 쪽’의 어색함
    rationale: ὑπεπλεύσαμεν은 섬의 바람을 피하는 편을 항해했다는 항해 용례입니다. ‘바람 그늘’은 자연스러운 현대 한국어 표현이 아니며 의미도 불명확할 수 있습니다.
  - severity: low
    issue: 바람의 작용 표현
    rationale: ‘가로막아’는 물리적 차단을 강조합니다. 원문은 바람이 진행을 허용하지 않았다는 원인의 속격절이므로 ‘나아가는 것을 허락하지 않았으므로’가 더 가깝습니다.
