  source_fidelity: 원문의 수신자(백부장과 군인들), 조건절(이 사람들이 배 안에 남아 있지 않으면), 결과절(여러분은 구원받을 수 없다)을 충실히 반영합니다. σωθῆναι의 직역적 표현인 ‘구원받다’는 유지하되, 이 문맥에서는 신학적 구원보다 난파 중의 신체적 생존을 가리킨다는 점을 각주로 밝혔습니다.
  naturalness: ‘군사들’은 현대 한국어 성경 문맥에서 다소 넓고 문어적인 표현일 수 있어, 로마 군인을 가리키는 ‘군인들’로 고쳤습니다. ‘배 안에 남아 있지 않으면’은 ἐν τῷ πλοίῳ와 μένωσιν을 자연스럽고 분명하게 옮깁니다.
  terminology: ‘백부장’은 ἑκατοντάρχης의 통용되는 성경 번역어로 유지했습니다. ‘구원받을 수 없습니다’는 σωθῆναι를 보존하며, 물리적 구조라는 문맥적 의미는 각주로 처리했습니다.
  issues:
  - severity: low
    issue: ‘군사들에게’
    rationale: 원문의 στρατιώταις는 여기서 백부장 휘하의 병사들을 가리키므로, 현대 표준어에서는 ‘군인들에게’가 더 자연스럽고 구체적입니다.
  - severity: low
    issue: σωθῆναι의 문맥상 의미에 대한 안내 부재
    rationale: ‘구원받다’는 원문의 어휘를 잘 보존하지만 한국어에서는 종교적 의미로도 쉽게 이해될 수 있습니다. 난파 문맥의 신체적 구조를 알리는 각주가 유익합니다.
  revised_text: 바울이 백부장과 군인들에게 말했습니다. “이 사람들이 배 안에 남아 있지 않으면, 여러분은 구원받을 수 없습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “구조될 수 없습니다.” 그리스어는 “구원받다”라고 말하며, 여기서는 육체적 생존을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 현대 표준어 합쇼체에 맞추어 στρατιώταις를 ‘군인들’로, 배 안에 계속 머무는 뜻을 ‘배 안에 남아 있다’로 다듬었습니다. σωθῆναι는 원문의 표현을 살려 ‘구원받다’로 번역하고, 문맥상 물리적 구조라는 뜻은 각주로 명시했습니다.
