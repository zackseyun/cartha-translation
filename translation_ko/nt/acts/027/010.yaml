  source_fidelity: 초안은 화물·배·사람의 생명이 모두 위험과 손실의 대상이라는 큰 흐름을 반영합니다. 그러나 “생명에도 손상”은 원문의 병렬 구조와 의미 관계를 자연스럽게 드러내지 못합니다. ὕβρις와 πολλὴ ζημία는 항해에 수반될 심한 피해와 큰 손실을 가리키며, τῶν ψυχῶν ἡμῶν은 이 문맥에서 ‘우리 목숨’을 뜻합니다.
  naturalness: “생명에도 손상”은 현대 표준어에서 어색하고, ‘손상’과 ‘큰 손실’의 결합도 항해 및 인명 피해의 문맥에 다소 부자연스럽습니다. “우리 목숨에도 피해와 큰 손실”이 합쇼체 서술 및 경고의 문맥에서 더 자연스럽습니다.
  terminology: ‘항해’(πλοῦς), ‘화물’(φορτίον), ‘배’(πλοῖον)는 적절합니다. ψυχή는 영혼이 아니라 물리적 생명을 뜻하므로 ‘우리 목숨’으로 옮겼습니다. ὕβρις는 도덕적 의미의 ‘오만’이 아니라 재난적 피해/곤경을 가리키므로 ‘피해’로 처리했습니다.
