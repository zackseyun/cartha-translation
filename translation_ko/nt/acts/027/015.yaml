  terminology: ‘배’, ‘바람’, ‘떠밀려 갔습니다’는 문맥과 합쇼체에 적절합니다. ‘휘말려’는 συναρπασθέντος의 외력에 사로잡힌 수동적 뉘앙스를 유지합니다.
