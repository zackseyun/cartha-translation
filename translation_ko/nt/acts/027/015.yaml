  source_fidelity: 그리스어의 ἐπιδόντες는 승무원이 능동적으로 저항을 그만두고 바람에 맡기는 행위를 나타내는데, 초안의 ‘우리는 그것에 내맡겨져’는 이를 수동적으로 바꾸며 ‘그것’의 지시 대상도 불분명합니다. 수정안은 배가 바람에 휘말린 뒤 바람을 마주하지 못하자 배를 바람에 맡기고 계속 떠밀려 간다는 흐름을 보존합니다.
