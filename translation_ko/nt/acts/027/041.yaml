  terminology: ‘이물’과 ‘고물’은 각각 πρῷρα와 πρύμνα에 맞는 정확한 항해 용어입니다. ‘좌초시켰습니다’도 ἐπέκειλαν τὴν ναῦν을 적절히 옮깁니다.
