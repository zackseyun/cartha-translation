  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
  footnotes:
  - marker: a
    text: Or 'a place between two seas.' The Greek expression is rare and may refer to a channel, sandbar, or meeting point of two bodies or currents of water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 두 바다가 만나는 곳[a]에 이르러 배를 좌초시켰습니다. 이물은 박혀 움직이지 않은 채 그대로 있었지만, 고물은 그 힘에 의해 부서지고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
