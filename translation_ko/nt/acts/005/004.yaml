translation:
  language: ko
  text: 그 땅이 그대로 있었을 때에는 당신의 것이 아니었습니까? 팔린 뒤에도 그 대금은 당신의 처분에 달려 있지 않았습니까? 어찌하여 이런 일을 당신의 마음에 품었습니까? 당신은 사람들에게 거짓말한 것이 아니라 하나님께 거짓말한 것입니다.
