revisions:
- from: 팔리기 전에는 그대의 것이 아니었는가? 그리고 팔린 후에도 그대의 권한 안에 있지 않았는가? 어찌하여 이런 일을 그대 마음에 품었는가? 그대는 사람에게 거짓말한 것이 아니라 하나님께 거짓말한 것이다.」
  to: 그 땅이 그대로 있었을 때에는 당신의 것이 아니었습니까? 팔린 뒤에도 그 대금은 당신의 처분에 달려 있지 않았습니까? 어찌하여 이런 일을 당신의 마음에 품었습니까? 당신은 사람들에게 거짓말한 것이 아니라 하나님께 거짓말한 것입니다.
  rationale: 현대 표준어 합쇼체로 호칭과 문장 종결을 통일하고, 판매 후의 ‘처분권’이 판매 대금에 관한 것임을 문맥상 명확히 했습니다. ‘이런 일’, ‘마음에 품다’, 그리고 ‘사람들에게 … 하나님께’의 대조는 원문의 넓은 의미와 수사적 힘을 보존합니다.
