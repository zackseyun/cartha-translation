review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 πραθὲν 뒤의 ἐξουσία는 판매 후의 재산, 곧 판매 대금에 대한 처분권을 가리키므로 한국어에서는 이를 밝혀 주는 편이 정확합니다. ἀνθρώποις는 복수이므로 ‘사람들에게’가 적절합니다.
  naturalness: ‘그대’와 평서형 의문 종결 ‘아니었는가?’는 요청된 현대 표준어 합쇼체와 맞지 않습니다. ‘당신의 … 아니었습니까?’ 및 ‘처분에 달려 있지 않았습니까?’가 현대적이면서도 본문의 질책조를 유지합니다. 원문의 인용부호에 대응하지 않는 닫는 인용부호도 삭제해야 합니다.
  terminology: ‘권한 안에 있다’는 직역투입니다. ἐξουσία의 소유·통제·결정 권한을 자연스럽게 나타내는 ‘처분에 달려 있다’를 사용합니다. ‘하나님’은 본문과 한국어 성경 문맥에 적절합니다.
  issues:
  - severity: medium
    issue: 현대 합쇼체와 맞지 않는 호칭 및 종결
    rationale: ‘그대’와 ‘아니었는가?’는 문어적·고풍적이며, 지정된 현대 formal-polite register에는 ‘당신의 … 아니었습니까?’가 적합합니다.
  - severity: medium
    issue: 판매 후 처분 대상이 불명확함
    rationale: ‘팔린 후에도 … 권한 안에’는 한국어로 어색하고 무엇이 처분 대상인지 모호합니다. 문맥상 판매 대금에 대한 처분권을 명시하면 ἐν τῇ σῇ ἐξουσίᾳ를 정확히 전달합니다.
  - severity: low
    issue: 불필요한 닫는 인용부호
    rationale: 본문에 대응하는 여는 인용부호가 없으므로 마지막 ‘」’는 구조적으로 제거해야 합니다.
  revised_text: 그 땅이 그대로 있었을 때에는 당신의 것이 아니었습니까? 팔린 뒤에도 그 대금은 당신의 처분에 달려 있지 않았습니까? 어찌하여 이런 일을 당신의 마음에 품었습니까? 당신은 사람들에게 거짓말한 것이 아니라 하나님께 거짓말한 것입니다.
