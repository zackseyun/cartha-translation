review_pass:
  verdict: revise
  source_fidelity: 초안은 병든 이들을 거리로 옮겨 침상에 눕히고 베드로의 그림자가 드리워지기를 바랐다는 기본 뜻을 대체로 전달합니다. 그러나 ἐκφέρειν은 단순히 ‘메어다’가 아니라 밖으로 ‘데리고 나가다/옮겨 내다’라는 뜻이며, καὶ의 강조(‘심지어’)와 κλιναρίων καὶ κραβάττων의 병렬이 충분히 반영되지 않았습니다.
  naturalness: ‘메어다가’는 현대 표준어 문맥에서 부자연스럽고, ‘그의 그림자라도 누구에게든’은 지시 대상이 다소 불분명합니다. ‘그들 가운데 누구에게든’으로 하면 병든 사람들을 가리키는 대상이 분명해집니다. 수정문은 현대 합쇼체로 자연스럽습니다.
  terminology: ‘베드로’, ‘병든 이들’, ‘그림자’는 적절합니다. κλιναρίων과 κραβάττων의 구별을 ‘간이침상과 깔개’로 옮겨 두 종류의 잠자리/누움 자리를 병렬로 나타냈습니다.
  issues:
  - severity: medium
    issue: ‘메어다가’
    rationale: ἐκφέρειν은 병든 사람들을 밖으로 옮겨 내는 행위를 뜻합니다. ‘메다’는 등에 지는 방식으로 한정될 수 있고 현대 문장에서도 어색합니다.
  - severity: medium
    issue: ‘작은 침상이나 자리’
    rationale: 원문은 καὶ로 연결된 두 종류의 누움 자리이며, ‘이나’는 대안처럼 들립니다. 두 항목의 병렬을 보존해야 합니다.
  - severity: low
    issue: 강조와 지시 대상의 불명확성
    rationale: καὶ εἰς는 거리까지 나아간 범위를 강조하므로 ‘심지어’를 반영하는 것이 좋습니다. τινὶ αὐτῶν은 병든 이들 가운데 어느 한 사람을 가리키므로 ‘그들 가운데 누구에게든’이 더 명확합니다.
  revised_text: 그 결과, 사람들은 병든 이들을 심지어 거리로 데리고 나와 간이침상과 깔개 위에 눕혔습니다. 베드로가 지나갈 때 그의 그림자라도 그들 가운데 누구에게든 드리워지게 하려는 것이었습니다.
