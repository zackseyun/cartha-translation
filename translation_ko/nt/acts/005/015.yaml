- from: 그래서 사람들은 병든 사람들을 거리로 메어다가 작은 침상이나 자리에 눕히기까지 하였습니다. 그것은 베드로가 지나갈 때, 그의 그림자라도 누구에게든 드리워지게 하기 위함이었습니다.
  to: 그 결과, 사람들은 병든 이들을 심지어 거리로 데리고 나와 간이침상과 깔개 위에 눕혔습니다. 베드로가 지나갈 때 그의 그림자라도 그들 가운데 누구에게든 드리워지게 하려는 것이었습니다.
  rationale: 수정문은 ὥστε의 결과 용법을 ‘그 결과’로, καὶ εἰς의 강조를 ‘심지어 거리로’로, ἐκφέρειν을 ‘데리고 나와’로 반영했습니다. 또한 두 침구 명사를 접속 병렬로 유지하고, ἵνα 및 접속법이 나타내는 사람들의 의도만을 ‘하려는 것이었습니다’로 표현하여 그림자가 실제로 치유했다는 내용을 본문에 덧붙이지 않았습니다.
