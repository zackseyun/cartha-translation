source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
  footnotes:
  - marker: a
    text: Or 'at the time of the registration.' The Greek term can refer to a census or official registration.
    reason: lexical_alternative
  - marker: b
    text: Or 'caused people to defect and follow him.' The verb can carry the sense of drawing people away from prior allegiance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후, 호적[a]이 실시되던 때에 갈릴리 사람 유다가 일어나 사람들을 자기 뒤를 따르도록 끌어들였습니다[b]. 그도 망하였고, 그에게 설득되어 따르던 사람들은 모두 흩어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘등록이 실시되던 때에.’ 그리스어는 인구 조사나 공식 등록을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람들이 이전의 소속에서 떨어져 나와 그를 따르게 하였습니다.’ 이 동사는 사람들을 이탈시켜 자기 편으로 끌어들이는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
