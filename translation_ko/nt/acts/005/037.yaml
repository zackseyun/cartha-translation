  to: 그 후, 호적[a]이 실시되던 때에 갈릴리 사람 유다가 일어나 사람들을 자기 뒤를 따르도록 끌어들였습니다[b]. 그도 망하였고, 그에게 설득되어 따르던 사람들은 모두 흩어졌습니다.
  rationale: 원문의 단순 연결을 보존하고, ἀπέστησε와 ἐπείθοντο의 서로 다른 의미를 한국어에서 구별해 나타냈습니다. ‘호적’의 가능한 어휘 범위와 사람들을 이탈시켜 따르게 한 의미는 적절한 위치의 각주로 보완했습니다.
