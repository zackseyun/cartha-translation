  source_fidelity: 원문의 흐름(관리들이 도착함 → 감옥에서 사도들을 찾지 못함 → 돌아가 보고함)은 대체로 반영되어 있습니다. 다만 초안의 마지막 ‘보고하며’는 원문의 직설법 동사 ἀπήγγειλαν(‘보고했습니다’)를 미완결 연결형으로 바꾸어 문장이 끝나지 않습니다.
