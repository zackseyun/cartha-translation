  - severity: low
    issue: ‘그들이 감옥에 없었습니다’는 의미상 가능하나, 원문의 ‘찾지 못했다’를 직접적으로 드러내지 않습니다.
    rationale: οὐχ εὗρον αὐτούς는 ‘그들을 찾지 못했다’입니다. 이를 직접 옮기면 원문 행위와 서술 초점이 더 분명해집니다.
