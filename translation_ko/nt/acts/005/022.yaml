  terminology: ὑπηρέται는 이 문맥에서 공적 직무를 수행하는 사람들을 가리키므로 ‘관리들’은 허용 가능한 일반적 표현입니다. 본 절만으로 ‘성전 경비대’처럼 구체화하지 않았습니다.
  issues:
