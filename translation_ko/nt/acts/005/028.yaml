    issue: ‘피를 우리에게 돌리려고 한다’ is an unnatural rendering of the bloodguilt idiom.
    rationale: Korean normally uses expressions such as ‘책임을 ... 돌리다’ rather than ‘피를 ... 돌리다.’ ‘이 사람의 피를 우리에게 뒤집어씌우려 합니다’ preserves the source’s blood imagery and clearly conveys the accusatory idiom without making ‘death’ explicit in the main text.
  - severity: low
    issue: Register is inconsistent in ‘보아라’ alongside ‘명하였는데’ and ‘한다.’
    rationale: The target requires modern formal-polite 합쇼체. ‘보십시오’ and corresponding formal-polite endings provide a consistent register.
