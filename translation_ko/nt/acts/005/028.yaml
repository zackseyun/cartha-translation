  source_fidelity: The draft accurately conveys the emphatic prohibition, the completed filling of Jerusalem with their teaching, and the accusation of intending to assign responsibility for the man's blood. However, ‘피를 우리에게 돌리려고 한다’ is not natural Korean for the Greek bloodguilt idiom and weakens the image of blood being brought upon someone.
  naturalness: The wording is generally clear, but the sentence mixes formal-polite declarative endings with the non-polite imperative ‘보아라.’ A consistent modern formal-polite rendering is preferable. ‘뒤집어씌우다’ is idiomatic Korean for placing culpability on someone while retaining the force of the accusation.
  terminology: ‘이 이름으로,’ ‘가르침,’ and ‘예루살렘’ are appropriate. ‘이 사람’ correctly retains the distancing, dismissive reference in the source. A footnote should document that ‘이 사람의 피’ is an idiom concerning responsibility for his death/bloodguilt.
  issues:
