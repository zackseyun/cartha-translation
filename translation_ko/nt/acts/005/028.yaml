  text: 말하였습니다. 「우리는 이 이름으로 가르치지 말라고 너희에게 엄히 명령하였는데, 보십시오, 너희는 너희의 가르침으로 예루살렘을 가득 채웠고, 또 이 사람의 피를 우리에게 뒤집어씌우려 합니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
