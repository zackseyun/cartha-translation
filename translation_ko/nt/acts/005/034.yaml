    rationale: 직전 문맥의 지시 대상이 사도들인 것은 분명하지만, 원문은 이 절에서 ‘그 사람들/그 남자들’이라고 표현합니다. 번역도 이를 불필요하게 명시화하지 않는 편이 원문 충실성과 영어 POB의 ‘the men’ 선택에 부합합니다.
  - severity: low
