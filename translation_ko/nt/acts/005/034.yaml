revisions:
- from: 그러나 공의회에 있던 한 바리새파 사람 가말리엘이라는 사람이 일어났습니다. 그는 모든 백성에게 존경받는 율법 교사였는데, 그가 사람들에게 잠시 사도들을 밖으로 내보내라고 명령하였습니다.
  to: 그러나 공의회[a]에서 한 바리새파 사람, 가말리엘이라는 이가 일어났습니다. 그는 모든 백성에게 존경받는 율법 교사였습니다. 그는 그 사람들을 잠시 밖으로 내보내라고 명령하였습니다.
  rationale: 원문의 인물 소개와 동작을 자연스러운 한국어로 옮기고, ‘사도들’이라는 문맥적 특정화를 ‘그 사람들’로 되돌려 본절의 표현 범위를 보존했습니다. 공의회의 역사적 지시 대상만 최소한의 문화 각주로 밝혔습니다.
  reviewer_model: gpt-5.6-terra
