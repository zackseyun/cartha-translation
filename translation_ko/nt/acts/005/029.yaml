  source_fidelity: The draft conveys the central obligation to obey God over human authorities. However, δέ is better represented by a mild adversative ('그러나'), and the comparative construction is more fully and naturally expressed as '사람들에게 순종하기보다 하나님께 순종해야 합니다.'
