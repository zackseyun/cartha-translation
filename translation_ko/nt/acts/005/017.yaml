  source_fidelity: 수정이 필요합니다. Ἀναστὰς(‘일어서서/일어섰고’)의 주어는 단수인 ‘대제사장’인데, 초안은 ‘대제사장과 … 모든 사람’ 전체가 일어난 것으로 옮겨 주어 관계를 바꾸었습니다. 또한 ἐπλήσθησαν ζήλου는 그 대제사장 측 사람들(사두개파)이 시기로 가득 찬 것을 가리키므로 이를 분명히 해야 합니다.
  naturalness: ‘대제사장이 일어섰고’와 ‘사두개파는 시기로 가득 찼습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. ‘곧’은 원문의 동격 설명을 간결하게 보존합니다.
  terminology: ἀρχιερεύς는 ‘대제사장’, Σαδδουκαῖοι는 ‘사두개파’, αἵρεσις는 후대의 부정적 의미를 피하여 ‘파’로, ζῆλος의 적대적 문맥상 의미는 ‘시기’로 옮기는 것이 적절합니다.
  issues:
