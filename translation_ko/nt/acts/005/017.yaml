    issue: ‘이 일어나’의 주어가 복수 집단으로 처리됨
    rationale: 원문에서 ‘일어서서’(Ἀναστὰς)는 단수 주격 분사로 ‘대제사장’을 수식합니다. 함께 있던 사람들과 사두개파가 일어섰다고 번역하면 문법적 관계가 달라집니다.
  - severity: low
    issue: 사두개파와 ‘시기로 가득 찼습니다’의 연결이 다소 불명확함
    rationale: 원문의 동격구는 대제사장과 함께 있던 모든 사람을 사두개파로 식별하며, 복수 동사 ‘가득 찼습니다’는 그들을 가리킵니다. 쉼표와 주어 배열을 조정하면 이 관계가 선명해집니다.
