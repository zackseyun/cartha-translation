  source_fidelity: 원문의 미완료 과거 ἐγίνετο는 반복·지속된 행위를 나타내므로, 단순히 ‘일어났습니다’보다 ‘행해지고 있었습니다’가 더 정확합니다. ‘사도들의 손을 통하여’는 διά ... τῶν χειρῶν의 구체적 수단 표현을 잘 보존합니다. δεύτε 문장의 암시된 주어는 특정 집단으로 한정하지 않았습니다.
  naturalness: ‘기이한 일’은 현대 한국어에서 다소 일반적이고 구어적으로 들릴 수 있습니다. 성경 문맥에서 정착된 ‘표적과 이적’이 자연스럽고, ‘모여 있었습니다’보다 원문의 ‘...에 있었다’와 결속·동시성을 함께 담는 ‘함께 있었습니다’가 적절합니다.
  terminology: σημεῖα καὶ τέρατα는 ‘표적과 이적’으로 옮기는 것이 한국어 성경 용례 및 원문의 기적 표지 표현에 충실합니다. Στοά는 ‘행각’으로 유지하고 대안 ‘주랑’을 각주로 제시합니다.
  issues:
  - severity: medium
    issue: ‘많은 표적과 기이한 일이 ... 일어났습니다’
    rationale: ἐγίνετο의 미완료상과 수동적·수단적 표현이 약화됩니다. ‘기이한 일’도 τέρατα의 성경적 짝말인 ‘이적’보다 덜 정확합니다.
  - severity: low
    issue: ‘그리고’ 및 ‘모두 한마음으로 ... 함께 있었습니다’
    rationale: ‘그리고’는 δέ의 가벼운 연결을 다소 과도하게 분절합니다. ‘한마음으로’와 ‘함께’는 모두 필요하며, 문장부호로 연결하면 더 자연스럽습니다.
