revisions:
- from: 그 값에서 얼마를 빼돌려 자기 몫으로 챙겼습니다. 그의 아내도 이 일을 알고 있었습니다. 그러고는 그 일부만을 가져와서 사도들의 발 앞에 두었습니다.
  to: 그는 판매 대금에서 얼마를 빼돌렸는데, 그의 아내도 이 사실을 알고 있었습니다. 그리고 일부를 가져와 사도들의 발 앞에 두었습니다.
  rationale: The revision maintains the deceptive force of νοσφίζομαι with ‘빼돌렸습니다,’ clarifies τιμή as ‘판매 대금,’ and removes the added implication that the withheld money was designated as his personal share. It retains the wife’s knowing participation and the literal ‘at the apostles’ feet’ expression.
