review_pass:
  verdict: revise
  source_fidelity: ‘빼돌려’ appropriately conveys the negative, covert force of ἐνοσφίσατο. However, ‘자기 몫으로 챙겼습니다’ adds a possessive/self-allocation nuance not explicitly stated, and ‘그 값’ is less clear in Korean than a term specifying the sale amount.
  naturalness: The draft is readable in modern formal-polite Korean. ‘판매 대금’ and ‘이 사실’ are more precise and natural in this financial and narrative context. Retaining two sentences is natural Korean while preserving the wife’s awareness as an attendant circumstance.
  terminology: ‘판매 대금’ suitably renders τιμή in its contextual sense of the price received from the sale. ‘사도들의 발 앞에’ accurately preserves the concrete expression παρὰ τοὺς πόδας τῶν ἀποστόλων. No doctrinal terminology is at issue.
  issues:
  - severity: medium
    issue: ‘자기 몫으로 챙겼습니다’ is interpretively fuller than the Greek.
    rationale: ἐνοσφίσατο denotes dishonest withholding/appropriation, but the text does not explicitly frame the withheld amount as ‘his own share.’ Removing this phrase preserves the verb’s force without adding that characterization.
  - severity: low
    issue: ‘그 값’ can be unclear as to what sort of price is meant.
    rationale: In context, τιμή is the amount received from the sale. ‘판매 대금’ communicates this clearly in idiomatic Korean.
  revised_text: 그는 판매 대금에서 얼마를 빼돌렸는데, 그의 아내도 이 사실을 알고 있었습니다. 그리고 일부를 가져와 사도들의 발 앞에 두었습니다.
  revised_footnotes: []
