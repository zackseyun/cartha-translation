  revision_rationale: 'The revision preserves the source text''s implicit singular subject (“it”), its explicit plural personal object (“them”), future capability (“will not be able”), and the warning that the council may be found to oppose God. No footnotes are required: the Korean wording preserves the source ambiguity without adding an interpretive claim.'
