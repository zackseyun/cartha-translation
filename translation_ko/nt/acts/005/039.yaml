  verdict: revise
  source_fidelity: ‘하나님에게서 난 것’은 ἐκ θεοῦ의 ‘하나님께로부터 온/나온 것’이라는 출처의 뜻을 다소 부자연스럽게 전달합니다. 또한 μήποτε καὶ θεομάχοι εὑρεθῆτε는 단순한 가능성뿐 아니라 경고의 결과를 나타내므로 ‘그러다가 … 드러날지도 모릅니다’로 옮기는 것이 더 가깝습니다. αὐτούς의 복수 인칭 대상은 ‘그들을’로 유지합니다.
  naturalness: ‘하나님께로부터 온 것’과 ‘하나님을 대적하는 자로 드러날지도 모릅니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 엄정한 표현입니다. 인용문의 종결 뒤 문장이 다음 절로 이어지는 쉼표도 유지했습니다.
  terminology: θεομάχοι는 교리적으로 확대하지 않고 ‘하나님을 대적하는 자’로 번역했습니다. καταλῦσαι는 문맥상 ‘무너뜨리다’가 적절하며, 대안을 각주로 제시했습니다.
  issues:
  - severity: medium
    issue: ‘하나님에게서 난 것’의 어색함 및 의미 범위
    rationale: ‘나다’는 한국어에서 출생의 연상을 강하게 일으킬 수 있습니다. 여기서는 어떤 일의 기원·출처를 뜻하므로 ‘하나님께로부터 온 것’이 더 정확하고 자연스럽습니다.
  - severity: low
    issue: μήποτε의 경고적 연결이 약함
    rationale: ‘도리어’도 가능하지만, ‘그러다가’는 하나님을 대적하는 자로 판명될 수 있다는 경고의 귀결을 더 분명히 드러냅니다.
  revised_text: 그것이 하나님께로부터 온 것이라면, 여러분은 그들을 무너뜨릴 수 없을 것입니다[a]. 그러다가 여러분이 하나님을 대적하는 자로 드러날지도 모릅니다[b].」 그래서 그들이 그의 말에 설득되어,
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들을 멸하거나 무너뜨릴 수 없을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나님과 싸우는 자들’. 또는 ‘하나님의 대적자들’.
    reason: lexical_alternative
  - marker: c
    text: ‘그들’은 가장 자연스럽게는 사도들을 가리키지만, 그들의 운동이나 일을 더 넓게 가리킨다고 보는 해석도 있습니다.
    reason: alternative_reading
