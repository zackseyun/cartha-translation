- from: 또한 예루살렘 주변 동네에서도 많은 사람이 모여서, 병든 사람들과 더러운 영들에게 시달리는 사람들을 데려왔고, 모두가 치유를 받았습니다.
  to: 또 예루살렘 주변 여러 동네에서 온 무리도 모여들고 있었고, 병든 이들과 더러운 영들에게 시달리는 이들을 데려오고 있었으며, 그들은 모두 치유받고 있었습니다.
