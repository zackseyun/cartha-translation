  source_fidelity: 원문의 καὶ ἡμεῖς ἐσμεν μάρτυρες ... καὶ τὸ πνεῦμα τὸ ἅγιον의 병렬 구조를 충실히 반영합니다. ‘이 일들’은 τῶν ῥημάτων τούτων의 문맥상 자연스러운 번역이며, ‘하나님께 순종하는 사람들’은 πειθαρχοῦσιν αὐτῷ를 분명하게 전달합니다.
  naturalness: 합쇼체 문체로 자연스럽습니다. 다만 원문의 문장 끝에 짝이 없는 닫는 인용부호(」)가 있어 제거해야 합니다. ‘하나님께서 자기에게’는 문법상 하나님을 가리킬 수 있으나, 한국어에서는 ‘자기’의 지시 대상이 잠시 불명확할 수 있어 명시하는 편이 좋습니다.
  terminology: ‘증인’, ‘성령’, ‘하나님’, ‘순종’은 사도행전의 현대 표준 한국어 종교 문맥에 적절하며, 특정 교파의 해석을 덧붙이지 않습니다. 성령을 높임말 주어로 처리한 ‘증인이십니다’도 합쇼체와 잘 맞습니다.
  issues:
  - severity: medium
    issue: 문장 끝에 짝이 없는 닫는 인용부호(」)가 있습니다.
    rationale: 인용문의 시작 부호가 없으므로 구조상 오류이며 제거해야 합니다.
  - severity: low
    issue: ‘하나님께서 자기에게 순종하는 사람들에게’의 ‘자기’는 지시 대상이 잠재적으로 모호합니다.
    rationale: 원문의 αὐτῷ는 하나님을 가리킵니다. ‘하나님께 순종하는 사람들’로 명시하면 한국어 독해를 돕고 의미를 바꾸지 않습니다.
  revised_text: 우리가 이 일들의 증인이며, 하나님께서 하나님께 순종하는 사람들에게 주신 성령도 증인이십니다.
