  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the whole council of Israel' or 'the whole body of elders of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 말을 듣고 새벽 무렵에 성전 뜰에 들어가 가르치고 있었습니다. 그런데 대제사장과 그와 함께 있던 사람들이 와서 공의회와 이스라엘 자손의 온 원로회[a]를 소집하고, 옥에 사람들을 보내어 그들을 데려오게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 온 원로회’ 또는 ‘이스라엘의 모든 장로들’.
    reason: γερουσία는 원로들로 이루어진 회의 또는 원로 집단을 가리킵니다. ‘이스라엘 자손’은 원문의 전통적인 민족 명칭을 따라 옮긴 것이며, 더 관용적인 표현도 가능합니다.
