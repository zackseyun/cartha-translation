- from: 그들이 이 말을 듣고 새벽에 성전에 들어가 가르치기 시작하였습니다. 대제사장과 그와 함께 있는 사람들이 와서 공의회와 이스라엘 자손의 온 원로회를 소집하고, 사도들을 데려오게 하려고 옥으로 사람들을 보냈습니다.
  to: 그들은 그 말을 듣고 새벽 무렵에 성전 뜰에 들어가 가르치고 있었습니다. 그런데 대제사장과 그와 함께 있던 사람들이 와서 공의회와 이스라엘 자손의 온 원로회[a]를 소집하고, 옥에 사람들을 보내어 그들을 데려오게 하였습니다.
  rationale: 미완료 과거의 진행상, 성전 구역을 뜻하는 ἱερόν, 그리고 감옥으로 사람을 보내어 사도들을 데려오게 한 목적 구문을 반영했습니다. ‘그들’은 원문의 대명사를 유지하여 불필요한 명시를 피했으며, 원로회 표현의 번역 선택지는 각주로 제시했습니다.
