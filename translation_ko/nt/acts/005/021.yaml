  source_fidelity: 수정이 필요합니다. 초안의 ‘가르치기 시작하였습니다’는 미완료 과거 ἐδίδασκον의 진행상을 ‘시작하다’로 바꾸므로, ‘가르치고 있었습니다’로 옮기는 것이 적절합니다. 또한 ἀπέστειλαν εἰς τὸ δεσμωτήριον은 사람들을 ‘옥으로’ 보냈다는 뜻이지 옥 자체로 사람들을 보냈다는 뜻이 아니므로, 목적지를 ‘옥에’로 명확히 해야 합니다.
  naturalness: 합쇼체 문체는 전반적으로 적절하나, ‘새벽에’보다 ‘새벽 무렵에’가 ὑπὸ τὸν ὄρθρον의 이른 새벽 시간을 더 잘 반영하며, ‘그와 함께 있는’은 과거 사건 서술에서는 ‘그와 함께 있던’이 자연스럽습니다.
  terminology: ‘대제사장’, ‘공의회’, ‘성전’, ‘옥’은 적절합니다. ἱερόν이 성전 구역을 가리킨다는 점을 반영하여 ‘성전 뜰’로 했습니다. γερουσία는 ‘원로회’로 유지하되, 이 표현이 앞선 공의회와 어떤 범위에서 구별되는지는 논의가 있으므로 직역에 가까운 본문과 관용적 대안을 각주에 둡니다.
