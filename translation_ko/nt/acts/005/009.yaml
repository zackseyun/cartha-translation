review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's question, the agreement to test the Lord's Spirit, the burial of her husband, the men at the door, and the prediction that they will carry her out. However, '두 사람' makes the plural referent more explicit than the Greek does, and the stated 합쇼체 target is not consistently maintained.
  naturalness: The wording is generally understandable, but '그대' is literary and sits awkwardly beside modern formal-polite narration. '보시오' and '합의하였는가?' are not 합쇼체. A modern formal-polite rendering should use forms such as '-습니까?' and '보십시오.'
  terminology: '''주의 영'' appropriately represents τὸ πνεῦμα κυρίου without unnecessarily expanding it to ''성령.'' ''시험하다,'' ''남편,'' and ''메고 나가다'' are suitable renderings in context. ''장사 지낸'' is more natural contemporary Korean than the attributive ''장사한.'''
  issues:
  - severity: medium
    issue: Speech register is inconsistent with the required modern formal-polite 합쇼체.
    rationale: '''합의하였는가?'' is a plain/formal literary interrogative and ''보시오'' is 하오체, whereas the required target calls for forms such as ''합의하였습니까?'' and ''보십시오.'''
  - severity: low
    issue: The phrase '두 사람이' is an unnecessary explicit expansion.
    rationale: ὑμῖν is plural and contextually includes Sapphira and her husband, but it does not literally say 'the two of you.' Retaining a plural expression preserves the source without specifying the number.
  - severity: low
    issue: The second-person term '그대' is literary rather than natural modern formal-polite Korean.
    rationale: Using '당신' in this direct address, while not ideal in every Korean context, is more consistent with a formal-polite biblical rendering and preserves the explicit possessive and object reference.
  revised_text: 베드로가 그녀에게 말하였습니다. “어찌하여 당신들이 함께 주의 영을 시험하기로 합의하였습니까? 보십시오, 당신의 남편을 장사 지낸 사람들의 발이 문 앞에 있습니다. 그들이 당신도 메고 나갈 것입니다.”
