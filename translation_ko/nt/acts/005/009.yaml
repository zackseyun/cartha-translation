  to: 베드로가 그녀에게 말하였습니다. “어찌하여 당신들이 함께 주의 영을 시험하기로 합의하였습니까? 보십시오, 당신의 남편을 장사 지낸 사람들의 발이 문 앞에 있습니다. 그들이 당신도 메고 나갈 것입니다.”
