  source_fidelity: 핵심 내용은 대체로 충실합니다. 다만 원문의 κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ는 단순히 ‘완전히’ 잠긴 정도보다 철저히 보안된 상태를 강조하므로 ‘빈틈없이 잠겨’가 더 가깝습니다. ἀνοίξαντες의 목적어는 문맥상 보충 가능한 ‘문’으로 옮겨도 무방합니다.
  naturalness: ‘우리가 옥은’은 이 문맥에서 주격 조사 대신 보조사 ‘은’이 쓰여 다소 부자연스럽습니다. ‘옥이’가 자연스럽고, ‘문을 열고 안을 보니’는 현대 표준어 합쇼체 서술로 자연스럽습니다.
  terminology: δεσμωτήριον의 ‘옥’, φύλακες의 ‘간수들’은 문맥에 적절합니다. ‘간수들’은 단순한 ‘경비병’보다 구금 시설의 수위라는 문맥을 잘 드러냅니다.
  issues:
  - severity: medium
    issue: ‘옥은’의 조사 선택
    rationale: 이 절에서는 옥을 대조적 화제로 제시하지 않으므로 ‘옥이’가 문법적·문체적으로 더 자연스럽습니다.
  - severity: low
    issue: 보안 강조와 영어 감사 주석의 앵커가 반영되지 않음
    rationale: ἐν πάσῃ ἀσφαλείᾳ의 강조를 ‘빈틈없이’로 드러내고, 해당 어휘 대안 주석을 앵커와 함께 제공하는 것이 최적 등가 및 감사 기록에 부합합니다.
  revised_text: 말하였습니다. 「우리가 옥이[a] 빈틈없이 잠겨 있고 간수들이 문 앞에 서 있는 것을 보았으나, 문을 열고 안을 보니 아무도 없었습니다.」
  revised_footnotes:
  - marker: a
    text: 또는 “완전히 안전하게 잠겨 있었다.” 그리스어는 옥이 철저히 보안된 상태였음을 강조합니다.
    reason: lexical_alternative
  revision_rationale: 주격 조사를 ‘이’로 바로잡고, ‘빈틈없이 잠겨’로 잠금 상태의 철저한 보안을 반영했습니다. 원문의 문맥상 암시된 목적어는 자연스러운 한국어를 위해 ‘문을’로 보충했으며, 영어 감사 기록의 보안 관련 대안은 한국어 주석 앵커로 보존했습니다.
