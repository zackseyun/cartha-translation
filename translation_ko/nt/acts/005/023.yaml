review_pass:
  verdict: revise
  source_fidelity: 초안은 감옥이 잠겨 있고 간수들이 문 앞에 서 있었으며, 열어 본 뒤 안에 아무도 없었다는 핵심 내용을 대체로 충실히 옮깁니다. 그러나 “우리가 옥은”은 목적어 자리에 부적절한 조사이며, 첫 εὕρομεν의 ‘발견했다’라는 보고의 뉘앙스도 더 분명히 하는 편이 좋습니다. “문을 열어 보니”는 ἀνοίξαντες의 시간적 관계와 문맥상 생략된 목적어를 자연스럽게 반영합니다.
  naturalness: ‘옥은’은 현대 표준어의 문장 흐름에서 어색하고 문법적으로도 적절하지 않습니다. ‘감옥이 아주 단단히 잠겨 있고 … 것을 발견했습니다’와 ‘안에는 아무도 없었습니다’는 현대적인 합쇼체 보고문으로 자연스럽습니다.
  terminology: δεσμωτήριον은 ‘감옥’, φύλακες는 이 문맥에서 ‘간수들’로 적절합니다. κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ는 ‘아주 단단히 잠겨’로 옮겨 잠긴 상태와 보안의 강조를 함께 살렸습니다. 신학적 용어 문제는 없습니다.
  issues:
  - severity: medium
    issue: ‘우리가 옥은’의 조사 및 문장 구조
    rationale: 원문에서 δεσμωτήριον은 εὕρομεν의 목적어이며, 한국어에서는 ‘감옥이 … 있는 것을 발견했습니다’처럼 절을 목적어로 구성하는 것이 자연스럽고 정확합니다.
  - severity: low
    issue: 첫 번째 εὕρομεν의 보고 동사 뉘앙스
    rationale: ‘보았습니다’도 가능한 범위이나, 두 차례 반복되는 εὕρομεν의 ‘발견했다’를 ‘발견했습니다’로 통일하면 원문의 관찰·보고 성격이 더 잘 드러납니다.
  revised_text: 그들은 이렇게 말했습니다. “우리는 감옥이 아주 단단히 잠겨 있고 간수들이 문 앞에 서 있는 것을 발견했습니다. 그러나 문을 열어 보니 안에는 아무도 없었습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “완전히 안전하게 잠겨 있고.” 그리스어는 감옥이 철저히 보안된 상태였음을 강조합니다.
    reason: lexical_alternative
  revision_rationale: 문법적으로 부적절한 ‘옥은’을 원문의 목적어 구조를 반영하는 자연스러운 한국어 절로 고쳤습니다. 또한 감옥의 보안 상태를 ‘아주 단단히 잠겨’로 명확히 하고, 원문의 두 ‘발견했다’를 일관되게 반영했습니다. 영어 감사 기록에 있는 보안 강조의 대안은 한국어 각주로 보존했습니다.
