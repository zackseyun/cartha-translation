  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
  footnotes:
  - marker: a
    text: Or 'about the name of Jesus' or 'on the basis of the name of Jesus.' The Greek idiom can include speaking with reference to Jesus and under his authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 사도들을 불러 매질한 뒤, 예수의 이름으로[a] 말하지 말라고 명령하고 그들을 놓아주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예수의 이름에 관하여’ 또는 ‘예수의 이름을 근거로’. 이 표현은 예수에 관하여 말하는 것과 그분의 권위 아래 말하는 것의 뜻을 함께 내포할 수 있습니다.
    reason: ‘예수의 이름으로’로 옮긴 그리스어 관용구 ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ의 가능한 의미 범위를 보존합니다.
