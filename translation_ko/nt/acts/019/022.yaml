  text: 그는 그를 섬기고 있던 사람들 중 두 사람, 곧 디모데와 에라스도를 마케도니아로 보내고, 자기는 아시아[a]에 한동안 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
