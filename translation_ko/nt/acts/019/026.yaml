  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
  footnotes:
  - marker: a
    text: Or, 'are no gods.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the ones coming into being through hands,' an idiom for idols made by human craftsmanship.
    reason: cultural_note
translation:
  language: ko
  text: 여러분이 보고 듣고 계시듯이, 이 바울이 에베소에서만이 아니라 거의 온 아시아에서 상당한 무리를 설득하여 돌아서게 했습니다. 그는 손으로 만들어진 신들은 신들이 아니라고 말합니다.
  philosophy: optimal-equivalence
