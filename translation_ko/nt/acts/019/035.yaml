  source_fidelity: 원문의 καταστείλας는 군중을 진정시킨 선행 행동이며, γραμματεύς는 유대교 서기관이 아니라 에베소의 시 행정관을 가리킵니다. νεωκόρος는 도시가 아르테미스 숭배 및 διοπετές 물건과 관련하여 공인된 수호·관리 역할을 가진다는 뜻입니다. διοπετές는 문자적으로 ‘하늘에서 떨어진’ 것이며, 문맥상 아르테미스와 관련된 숭배 형상을 가리키는 것으로 보입니다.
  naturalness: 초안의 ‘도시의 서기관’, ‘에베소 도시’, ‘신전 관리자’는 현대 표준 한국어에서 다소 부자연스럽거나 역할 관계가 모호합니다. 또한 인용문의 닫는 따옴표가 누락되어 있습니다. ‘시 서기관’, ‘에베소 사람들이 사는 이 도시’, ‘신전의 수호자’로 다듬어 합쇼체의 공적 발화에 맞추었습니다.
  terminology: Ἄνδρες Ἐφέσιοι는 당시 시민 सभा를 향한 남성형 호칭이므로 ‘에베소의 남자 여러분’으로 유지했습니다. Artemis는 통용 표기인 ‘아르테미스’로 옮겼습니다. διοπετές의 의미를 본문에서 과도하게 단정하지 않도록 ‘하늘에서 떨어진 형상’으로 번역하고, 문맥상 이해는 각주에서 제시했습니다.
  issues:
  - severity: medium
    issue: γραμματεύς의 번역
    rationale: ‘도시의 서기관’은 한국어에서 역할이 불명확하고 종교적 서기관으로 오해될 수 있습니다. 여기서는 시의 행정 관리를 뜻하므로 ‘시 서기관’이 더 정확합니다.
  - severity: medium
    issue: νεωκόρος의 관계와 표현
    rationale: ‘위대한 아데미와 하늘에서 떨어진 형상의 신전 관리자’는 아르테미스와 형상이 모두 신전의 소유자인 듯하게 연결되고, 도시가 주어라는 점도 약합니다. 도시의 공인된 수호·관리 역할을 드러내야 합니다.
  - severity: low
    issue: 고유명사 표기 및 문장 종결
    rationale: ‘아데미’는 일반적인 현대 한국어 성서·고전 표기와 다르므로 ‘아르테미스’가 적절합니다. 인용문의 닫는 따옴표도 보완해야 합니다.
  revised_text: 시 서기관이 군중을 진정시킨 뒤에 말하였습니다. “에베소의 남자 여러분, 에베소 사람들이 사는 이 도시가 위대한 아르테미스와 하늘에서 떨어진 형상의 신전 수호자라는 것을 모르는 사람이 누가 있겠습니까?”
  revised_footnotes:
  - marker: a
    text: ‘신전 수호자’로 번역한 그리스어는 한 도시가 신전이나 숭배 의식을 공적으로 맡아 지키는 도시로 인정받았음을 뜻합니다. 또는 ‘위대한 아르테미스의 신전을 지키는 자’로 옮길 수 있습니다.
    reason: lexical_alternative
