    rationale: 원문의 Ἄρτεμις 및 영어 감사 기록의 Artemis와 투명하게 연결되며, 의미 변화가 없습니다.
  revised_text: 도시 서기관이 무리를 진정시킨 후에 말하였습니다. 「에베소 사람들이여, 어떤 사람이 에베소 도시가 위대한 아르테미스와 하늘에서 떨어진 형상ᵇ의 신전을 맡아 지키는 도시ᵃ임을 모르겠습니까?」
