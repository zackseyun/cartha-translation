    issue: ‘신전 관리자’는 도시가 아닌 개인 관리자를 가리키는 것으로 읽힐 수 있습니다.
    rationale: νεωκόρος는 여기서 에베소 도시가 신전 또는 제의의 공인된 수호자라는 칭호를 지닌다는 뜻입니다. ‘신전을 맡아 지키는 도시’가 문법적 주어와 제도적 의미를 더 잘 드러냅니다.
  - severity: low
    issue: 인용문의 닫는 따옴표가 빠져 있습니다.
