  source_fidelity: 초안은 καταστείλας, γραμματεύς, ὄχλος 및 수사 의문의 기본 뜻을 대체로 반영합니다. 그러나 νεωκόρος는 에베소라는 도시가 신전·제의의 공인된 수호/관리 도시라는 뜻이므로, 단순히 사람이 맡는 ‘신전 관리자’로 들릴 수 있는 표현은 다듬는 것이 안전합니다. διοπετοῦς는 문맥상 형상을 가리키는 것으로 번역할 수 있으나, 하늘에서 떨어졌다는 것은 연설자가 전하는 종교적 주장임을 그대로 보존합니다.
  naturalness: ‘도시의 서기관’보다 ‘도시 서기관’이 현대 한국어에서 더 자연스럽고, ‘신전을 맡아 지키는 도시’는 도시를 주어로 하는 표현으로도 명료합니다. 인용문의 닫는 따옴표도 보완해야 합니다. ‘에베소 사람들이여’는 고대 공적 연설의 남성 복수 호격을 보존하는 격식 있는 표현입니다.
  terminology: Ἄρτεμις는 표준 한국어의 일반적 그리스 신명인 ‘아르테미스’로 표기했습니다. νεωκόρος는 본문에서 ‘신전을 맡아 지키는 도시’로 옮기고 주석에서 제의의 공인된 수호 도시라는 제도적 의미를 밝혔습니다. διοπετοῦς는 영어 감사 기록의 해석을 따라 ‘하늘에서 떨어진 형상’으로 옮기되, 주석에서 원어의 명사화된 표현과 주장성을 설명했습니다.
  issues:
