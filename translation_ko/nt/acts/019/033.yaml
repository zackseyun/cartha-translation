  naturalness: ‘무리 가운데서 사람들이 알렉산더를 끌어내었습니다’는 주어가 다소 불필요하게 드러나고 ‘끌어내다’는 단순히 공개적으로 앞으로 내세운다는 뜻보다 강하게 들릴 수 있습니다. 완결된 합쇼체 문장과 ‘민회 앞에서 변론하다’라는 결합이 자연스럽습니다.
  terminology: Ἀλέξανδρος는 ‘알렉산더’, ὄχλος는 ‘무리’, δῆμος는 이 문맥의 시민적 공적 집회를 나타내는 ‘민회’로 옮겼습니다. ἀπολογεῖσθαι의 공적·변론적 뉘앙스는 ‘변론하려고 했습니다’로 반영했습니다.
