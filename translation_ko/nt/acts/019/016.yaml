  text: 그리고 그 악한 영이 들린 사람이 그들에게 뛰어들어 그 둘을 제압하고 그들을 이기니, 그들이 벌거벗고 상처를 입은 채 그 집에서 도망하였습니다.
  philosophy: optimal-equivalence
