source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
  footnotes:
  - marker: a
    text: Or 'silver temples of Artemis' or 'silver models of the temple of Artemis.' The Greek uses naous ('shrines/temples'), likely referring to small crafted objects associated with Artemis worship.
    reason: lexical_alternative
  - marker: b
    text: Greek 'no small business,' a litotes meaning substantial trade or profit.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 데메드리오라는 어떤 은장이가 아데미의 은 신전 모형들[a]을 만들어 장인들에게 적지 않은 사업거리[b]를 제공하고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아데미의 은 신전들’. 그리스어는 작은 공예품의 정확한 형태를 특정하지 않으며, 아데미 숭배와 관련된 작은 신전 또는 신전 모형을 가리킨 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘적지 않은 일’. 그리스어의 완곡한 표현으로, 상당한 사업 또는 수입을 뜻합니다.
    reason: lexical_alternative
