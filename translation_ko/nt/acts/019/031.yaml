    issue: ‘사람을 보내어’
    rationale: 원문은 보낸 사람을 명시하지 않고, 문맥상 전갈을 보낸 것으로 이해됩니다. ‘전갈을 보내고’가 불필요하게 사절을 특정하지 않습니다.
  - severity: medium
    issue: ‘아시아 지방의 관리들’
    rationale: Ἀσιάρχης라는 기술적 칭호를 일반 ‘관리’로 평면화합니다. 음역과 문화 주석이 원문 용어를 보존합니다.
  - severity: low
    issue: ‘어떤 이들도’ 및 긴 수식열
    rationale: ‘몇몇도’와 ‘그의 친구들이어서’가 표준어 문장 흐름과 원문의 관계를 더 명료하게 드러냅니다.
  - severity: low
    issue: ‘모험을 하지 말 것’
    rationale: 문맥상 타당하나 원문의 표현보다 해석적입니다. ‘극장에 들어가지 말라고’는 자발적으로 위험한 군중 속에 나아가지 말라는 뜻을 보존하면서 과도한 보충을 피합니다.
