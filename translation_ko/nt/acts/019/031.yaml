- from: 아시아 지방의 관리들 가운데 그의 친구인 어떤 이들도 사람을 보내어, 극장으로 들어가는 모험을 하지 말 것을 그에게 권하였습니다.
  to: 아시아르크들[a] 가운데 몇몇도 그의 친구들이어서 그에게 전갈을 보내고, 극장에 들어가지 말라고 거듭 권하였습니다.
  rationale: 원문의 기술적 칭호를 보존하고, 친구 관계를 나타내는 분사구문과 전갈을 보낸 뒤 거듭 권한 행위를 자연스러운 합쇼체 문장으로 옮겼습니다. ‘거듭 권하였습니다’는 미완료 과거 παρεκάλουν의 지속·반복 가능성을 자연스럽게 반영하며, ‘극장에 들어가지 말라고’는 위험한 장소에 자신을 내보이지 말라는 문맥을 보존하되 ‘모험’이라는 해석적 어휘는 피합니다.
