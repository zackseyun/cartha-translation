  verdict: revise
  source_fidelity: 초안의 ‘사람을 보내어’는 문맥상 가능하지만, 원문 πέμψαντες πρὸς αὐτόν은 전달 내용을 명시하지 않으므로 ‘그에게 전갈을 보내고’가 더 자연스럽고 직접적으로 대응합니다. 또한 ‘극장으로 들어가는 모험을 하지 말 것’은 위험을 피하라는 문맥을 잘 드러내지만, δοῦναι ἑαυτόν εἰς τὸ θέατρον의 기본 뜻인 자신을 극장에 내보이거나 들어가는 행위를 다소 해석적으로 강화합니다.
  naturalness: ‘아시아 지방의 관리들 가운데 그의 친구인 어떤 이들도’는 수식 관계와 ‘어떤 이들도’의 표현이 다소 어색합니다. ‘아시아르크들 가운데 몇몇도 그의 친구들이어서’는 원문의 배경적 분사구문과 καὶ의 첨가를 현대 한국어로 자연스럽게 옮깁니다.
  terminology: Ἀσιαρχῶν은 특정한 공적 칭호이므로 ‘아시아르크들’로 음역하고 주석에서 설명하는 편이 ‘아시아 지방의 관리들’보다 정확합니다. 직무의 성격과 범위에는 논의가 있으므로 주석은 ‘관련된 유력 관리들’이라고 절제하여 설명합니다.
  issues:
