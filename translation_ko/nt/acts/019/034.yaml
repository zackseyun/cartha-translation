  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
  footnotes:
  - marker: a
    text: Or “a Judean.” The Greek term can denote either a Jew or someone from Judea; here the broader ethnoreligious sense is more likely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 유대인[a]임을 알아차리자, 모두에게서 한목소리가 터져 나왔고, 그들은 약 두 시간 동안 “에베소 사람들의 아르테미스는 위대합니다!” 하고 외쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유다 사람.” 그리스어는 유대인 또는 유다 지역 사람을 가리킬 수 있습니다. 여기서는 더 넓은 민족적·종교적 의미가 더 알맞습니다.
    reason: Ἰουδαῖος의 어휘적 대안을 보존합니다.
