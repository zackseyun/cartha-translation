source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
  footnotes:
  - marker: a
    text: Or 'the inhabited world.' The Greek often refers to the populated world, especially the wider Roman world.
    reason: lexical_alternative
  - marker: b
    text: Or 'her magnificence' or 'her greatness.' The Greek expression refers to Artemis's exalted status or splendor being brought down.
    reason: lexical_alternative
translation:
  language: ko
  text: 그뿐 아니라 우리의 이 업종이 불명예를 당할 위험에 처했으며, 위대한 여신 아데미의 신전이 무가치한 것으로 여겨지고, 온 아시아와 온 세계가 경배하는 그 여신의 위엄마저 무너지게 될 위험에 처했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 세계’는 직역하면 ‘사람이 사는 세계’이며, 흔히 당시의 더 넓은 로마 세계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘위엄’은 ‘장엄함’ 또는 ‘위대함’으로도 옮길 수 있습니다. 아데미가 받는 높은 명예와 찬란함이 무너지는 것을 뜻합니다.
    reason: lexical_alternative
