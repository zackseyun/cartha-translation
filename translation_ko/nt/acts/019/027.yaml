  source_fidelity: 핵심 의미는 대체로 반영했으나, τὸ μέρος를 문맥상 ‘업종/생업’으로 옮겨야 하며, 두 번째 위험의 대상인 아데미의 위엄이 더 분명히 드러나야 합니다. ‘이로써’는 그리스어의 연결 표현을 부정확하게 특정 인과관계로 만들 수 있어 피하는 것이 좋습니다.
  naturalness: ‘우리의 이 부문’은 현대 한국어에서 부자연스럽고 경제적 직종을 가리키는 문맥에도 맞지 않습니다. ‘우리의 이 업종’과 ‘불명예를 당할 위험’이 자연스럽습니다. 단독 제시된 본문에 닫는 인용부호만 있는 형식도 제거하는 것이 적절합니다.
