  to: 그뿐 아니라 우리의 이 업종이 불명예를 당할 위험에 처했으며, 위대한 여신 아데미의 신전이 무가치한 것으로 여겨지고, 온 아시아와 온 세계가 경배하는 그 여신의 위엄마저 무너지게 될 위험에 처했습니다.[a][b]
