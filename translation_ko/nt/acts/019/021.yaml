    reason: previous_rendering
translation:
  language: ko
  text: 이 모든 일이 마쳐진 뒤에 바울은 성령 안에서[a] 마케도니아와 아카이아를 거쳐 예루살렘으로 가기로 결심하고 이렇게 말하였습니다. 「내가 그곳에 간 뒤에는 로마도 보아야 합니다.」
  philosophy: optimal-equivalence
  footnotes:
