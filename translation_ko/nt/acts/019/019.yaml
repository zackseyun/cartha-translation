base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
  footnotes:
  - marker: a
    text: Or 'occult practices.' The Greek expression literally refers to 'curious' or 'special' things, but in this context it denotes magical practices.
    reason: lexical_alternative
  - marker: b
    text: Literally 'five myriads of silver,' that is, fifty thousand pieces of silver. The exact coin denomination is not specified.
    reason: lexical_alternative
translation:
  language: ko
  text: 마술을 행하던 많은 사람이 그들의 책을 모아 모든 사람이 보는 앞에서 불태우고 있었습니다. 그 책들의 값을 합산해 보니 은 오만 개에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘은 다섯 만(오만)’입니다. 정확한 동전 명칭이나 화폐 단위는 원문에 명시되어 있지 않습니다.
