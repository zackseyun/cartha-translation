  naturalness: ‘자기들의’보다 ‘그들의’가 문맥상 자연스럽고, ‘모든 사람 앞에서’보다 ‘모든 사람이 보는 앞에서’가 현대 표준어 문장 안에서 더 자연스럽습니다. ‘은 오만 개’에는 보충 각주가 필요합니다.
