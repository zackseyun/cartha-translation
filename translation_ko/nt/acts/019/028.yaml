    issue: ‘아데미’라는 고유명사 표기
    rationale: Ἄρτεμις(Artemis)의 표준 한국어 음역은 ‘아르테미스’입니다. ‘아데미’는 원어의 음가와 일반적인 한국어 성서·고전 용례에서 크게 벗어납니다.
  - severity: medium
    issue: ‘외쳐 말하기를, … 하였습니다’의 문체와 미완료상 반영
    rationale: ἔκραζον은 반복적 또는 지속적인 외침을 나타내며, ‘계속 외쳤습니다’가 이를 자연스럽게 반영합니다. 직접 인용 앞의 ‘외쳐 말하기를’은 현대 합쇼체에 부자연스럽습니다.
  - severity: low
    issue: 환호문의 명사구 처리
    rationale: ‘위대한 에베소의 아데미’는 한국어에서 누가 위대하다는 뜻인지 문법적으로 불분명합니다. 원문의 명사절을 명시적 선언문으로 옮기는 편이 정확합니다.
  revised_text: 그들이 이 말을 듣고 격노로 가득 차서 계속 외쳤습니다. “에베소 사람들의 아르테미스는 위대하다!”
