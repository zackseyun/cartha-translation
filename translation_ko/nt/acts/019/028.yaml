review_pass:
  verdict: revise
  source_fidelity: 원문의 Ἄρτεμις는 통상적인 한국어 음역인 ‘아르테미스’로 옮겨야 합니다. 또한 ἔκραζον의 미완료상은 지속·반복된 외침을 나타내므로 ‘계속 외쳤습니다’가 적절합니다. 군중의 환호문은 ‘에베소 사람들의 아르테미스는 위대하다!’로 옮겨 주어와 술어가 분명하면서도 원문의 선언적·구호적 성격을 보존합니다.
  naturalness: ‘외쳐 말하기를, … 하였습니다’는 현대 한국어 합쇼체에서 다소 부자연스럽습니다. 서술을 ‘계속 외쳤습니다’로 마친 뒤 직접 인용을 제시하면 자연스럽고 구호의 반복성도 살아납니다.
  terminology: 고유명사 Ἄρτεμις는 ‘아데미’가 아니라 표준적인 음역 ‘아르테미스’가 적절합니다. θυμός는 이 문맥에서 강한 분노를 뜻하므로 ‘격노로 가득 차’는 원문의 충만 관용구와 강도를 잘 반영합니다.
  issues:
