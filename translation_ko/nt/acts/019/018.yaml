review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that many who had come to faith came and both confessed and made known what they had done. However, "행위" is somewhat abstract and can suggest isolated acts, whereas πράξεις here more naturally denotes their habitual activities or practices; the imperfect ἤρχοντο is also better represented by "찾아오고 있었습니다."
  naturalness: '"와서 ... 드러내었습니다" is understandable but less natural than a continuous narrative construction with "찾아오고 있었습니다" and the modern formal-polite ending "-했습니다." "행실" is idiomatic Korean for conduct/practices in this context.'
  terminology: '"믿게 된" appropriately represents the prior belief implied by the perfect participle without making it a fixed ecclesial title. "고백하며" is preferable to the more juridical-sounding "자백하며." "행실" retains the contextual sense of practices without specifying magical practices or sins beyond the Greek wording.'
  issues:
  - severity: medium
    issue: '"자신들의 행위를" is less contextually precise and less idiomatic than "자신들의 행실을."'
    rationale: πράξεις may mean deeds or practices. In this setting it refers naturally to conduct or customary activities; "행실" expresses this without adding a specific accusation or occult label.
  - severity: low
    issue: The imperfect ἤρχοντο is flattened by "와서."
    rationale: '"찾아오고 있었습니다" more clearly preserves the ongoing/repeated past action while remaining natural Korean narrative style.'
  - severity: low
    issue: '"드러내었습니다" is stylistically heavier than needed.'
    rationale: '"드러냈습니다" is standard modern formal-polite Korean and matches the concise Greek narration.'
  revised_text: 믿게 된 많은 사람들이 찾아오고 있었습니다. 그들은 자신들의 행실을 고백하며 드러냈습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “자신들이 한 일들”
    reason: πράξεις는 문맥상 ‘행실’ 또는 ‘행위들/한 일들’을 뜻할 수 있다. 본문은 습관적 활동이라는 뉘앙스를 살려 ‘행실’로 옮겼다.
  revision_rationale: The revision preserves the perfect participle as people who had come to believe, represents the imperfect main verb with an ongoing past expression, and renders the two coordinated participles directly. It uses ‘행실’ for πράξεις to retain the contextual sense of practices without narrowing it to sins or magical arts. The footnote is anchored to the term it explains.
