review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the participants’ prior belief and the paired actions of confession and disclosure, but its simple past main verb does not reflect the imperfect ἤρχοντο as well as a progressive Korean construction can. "행위" is possible for πράξεις, yet "자신들이 행한 일들" is more idiomatic in this sentence and preserves the noun’s broad reference without prematurely restricting it to magical practices or sins.
  naturalness: '"믿게 된 많은 사람" and "고백하고 드러내고 있었습니다" are natural in modern formal-polite Korean. The progressive wording conveys the narrative’s ongoing/repeated action without asserting more than the Greek does.'
  terminology: '"고백하다" suitably renders ἐξομολογέομαι, and "드러내다" naturally renders ἀναγγέλλω in this context. "자신들이 행한 일들" renders πράξεις broadly; the note records viable alternatives such as "행위들" and "실천하던 일들."'
  issues:
  - severity: medium
    issue: The imperfect ἤρχοντο is rendered only as a simple completed event.
    rationale: '"와서 ... 드러내었습니다" can be read as a single finished action. A progressive construction better retains the Greek imperfect’s ongoing or repeated past-time perspective.'
  - severity: low
    issue: '"자신들의 행위" is somewhat stiff and less idiomatic in this context.'
    rationale: '"자신들이 행한 일들" is natural Korean and retains the broad semantic range of πράξεις (deeds, actions, practices) without adding a specific moral or occult interpretation.'
  revised_text: 믿게 된 많은 사람이 찾아와 자신들이 행한 일들을 고백하고 드러내고 있었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 "자신들의 행위들" 또는 "자신들이 실천하던 일들."
    reason: πράξεις는 행위, 행한 일, 또는 관행·실천을 가리킬 수 있습니다. 본문은 문맥상 특정 해석으로 한정하지 않습니다.
  revision_rationale: The revision expresses the imperfective narrative action with "드러내고 있었습니다" and uses an idiomatic, semantically broad Korean rendering for πράξεις. It maintains the source’s ambiguity concerning precisely what was confessed and disclosed, while preserving formal-polite register.
