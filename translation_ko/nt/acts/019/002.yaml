  to: 그가 그들에게 말하였다. “여러분은 믿을 때에[a] 성령을 받았습니까?” 그러자 그들이 그에게 말하였다. “아니요, 우리는 성령이 계시다는 것조차[b] 들어 본 적이 없습니다.”
  rationale: 본문은 πιστεύσαντες의 시간 관계를 ‘믿을 때에’로 무리 없이 제시하고, ‘뒤에’라는 가능한 시간적 뉘앙스를 각주에 보존합니다. 응답은 οὐδὲ εἰ의 주된 문맥상 의미를 자연스러운 한국어로 옮기되, ‘~인지’라는 대안적 이해와 ‘주어짐’이라는 해석적 확장을 각주에 구분하여 제시합니다. 불필요한 교리적 결론은 번역문에 도입하지 않았습니다.
