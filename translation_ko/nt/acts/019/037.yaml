  source_fidelity: 접속사 γάρ는 앞 발언의 근거를 제시하므로 대조를 나타내는 ‘하지만’은 맞지 않습니다. ἠγάγετε는 여기서 ‘데리고 왔습니다’가 자연스럽고, οὔτε ... οὔτε의 이중 부정과 ‘우리 여신’(에베소의 아르테미스)도 명확히 보존해야 합니다.
  naturalness: ‘이 사람들을 데리고 왔습니다’와 ‘신전을 약탈한 자도 아니고 … 자도 아닙니다’는 현대 표준 한국어의 격식 있는 합쇼체 문맥에 자연스럽습니다.
  terminology: ἱερόσυλος는 문맥상 ‘신전을 약탈한 자’로, βλασφημέω는 여신을 대상으로 한 ‘모독한 자’로 옮기는 것이 적절합니다. θεὸν ἡμῶν은 지시 대상이 아르테미스이므로 ‘우리 여신’이 정확합니다.
  issues:
