    rationale: ‘붙잡아’는 핵심적인 체포·장악 의미를 전달하지만, 이 문맥의 난폭하게 붙들어 데려감의 뉘앙스를 위해 ‘끌고’를 덧붙이는 것이 안전합니다.
  - severity: low
    issue: ὁμοθυμαδόν의 집단적 동시 행동 표현을 다듬을 필요가 있습니다.
