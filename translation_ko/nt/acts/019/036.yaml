  source_fidelity: The draft accurately conveys the inferential force of οὖν, the uncontestable character of the stated matters, the obligation expressed by δέον ἐστίν, and the prohibition against rash action. However, "자제하고" more readily means exercising self-restraint than being in a calm/composed state (κατεσταλμένους ὑπάρχειν).
