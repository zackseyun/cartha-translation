    issue: '"자제하고" does not precisely represent κατεσταλμένους ὑπάρχειν.'
    rationale: The Greek calls for a calm, composed state, rather than primarily self-control or restraint. "침착함을 유지하고" preserves this nuance.
  - severity: low
    issue: '"이 일들" is less natural than "이러한 사실들" in connection with "부인할 수 없다."'
    rationale: The source refers to matters asserted as beyond dispute; "사실들" expresses this idiomatically without materially narrowing the reference.
