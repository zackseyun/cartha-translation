  verdict: revise
  source_fidelity: 초안은 ἐπεχείρησαν의 ‘시도하다’와 κύριος Ἰησοῦ의 ‘주 예수’를 대체로 반영합니다. 그러나 ‘어떤/몇몇’과 καὶ의 첨가 의미가 빠졌고, ‘악한 영들이 들린’은 ‘악한 영들을 가진’이라는 원문의 표현보다 해석을 강화합니다. 또한 ὁρκίζω의 엄숙한 맹세·명령의 어조와 ‘예수를 두고/by Jesus’의 표현을 더 직접적으로 드러낼 필요가 있습니다.
  naturalness: ‘축귀자’는 이해 가능한 전문어이나 현대 표준어에서는 다소 낯설 수 있습니다. 문맥상 의미를 유지하면서도 자연스럽게 읽히도록 ‘축귀를 하는 사람들’로 풀어 쓸 수 있습니다. 인용문은 합쇼체 서술에 맞게 ‘명합니다’로 처리했습니다.
  terminology: ‘주 예수’, ‘악한 영들’, ‘전파하다’는 적절합니다. ‘들린’은 본문이 명시하지 않는 소유/지배 방식까지 확정할 수 있으므로 ‘악한 영들이 있는 사람들’로 옮겨 원문의 표현 수준을 보존했습니다.
