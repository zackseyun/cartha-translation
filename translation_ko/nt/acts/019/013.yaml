  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
  footnotes:
  - marker: a
    text: Or “some even of the traveling Jewish exorcists.”
    reason: lexical_alternative
  - marker: b
    text: Literally “those having evil spirits”; that is, people under the influence of evil spirits.
    reason: lexical_alternative
  - marker: c
    text: Or “I put you under oath by Jesus” or “I solemnly charge you by Jesus.”
    reason: lexical_alternative
  - marker: d
    text: Or “whom Paul preaches.”
    reason: lexical_alternative
translation:
  language: ko
  text: 돌아다니는 유대인 축귀를 하는 사람들 가운데 몇몇도 악한 영들이 있는 사람들에게 주 예수의 이름을 불러 사용하려고 시도하며 말했습니다. “바울이 전파하는 예수를 두고 너희에게 엄히 명합니다.”
  philosophy: optimal-equivalence
