revisions:
- from: 돌아다니는 어떤 유대인 축귀자들이 악한 영들이 들린 사람들에게 주 예수의 이름을 부르려고 시도하여 말하기를, 「내가 바울이 전파하는 예수의 이름으로 너희에게 명령한다」 하였습니다.
  to: 돌아다니는 유대인 축귀를 하는 사람들 가운데 몇몇도 악한 영들이 있는 사람들에게 주 예수의 이름을 불러 사용하려고 시도하며 말했습니다. “바울이 전파하는 예수를 두고 너희에게 엄히 명합니다.”
  rationale: 원문의 일부성(τινες), 첨가 의미(καὶ), 이동하며 활동하는 축귀자라는 수식 범위를 보완했습니다. 또한 ‘악한 영들이 있는’으로 원문의 표현 수준을 유지하고, ὁρκίζω를 ‘엄히 명합니다’로 옮겨 의례적이고 강한 발화의 성격을 반영했습니다. 본문 자체에 필요한 번역상 대안은 문장 안에서 충분히 처리할 수 있어 각주를 추가하지 않았습니다.
