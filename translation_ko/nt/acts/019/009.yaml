  text: 그러나 어떤 사람들이 마음이 굳어져 순종하지 아니하고 무리 앞에서 그 도(道)를 비방하니, 바울이 그들에게서 떠나 제자들을 따로 세우고, 두란노의 강의실에서 날마다 변론하였습니다.
