  source_fidelity: 원문의 미완료 시제는 지속적으로 완고해지고 불순종한 모습을 나타내며, 현 번역의 큰 흐름은 이를 대체로 반영합니다. 다만 ἀφώρισεν은 제자들을 ‘따로 세우다’라기보다 반대자들에게서 ‘분리하다/따로 떼어 놓다’라는 뜻이므로 수정이 필요합니다. τὴν ὁδόν은 사도행전에서 초기 그리스도교 운동의 명칭으로 쓰인 ‘그 길’로 옮기고 주석으로 밝혀 두는 것이 적절합니다.
  naturalness: ‘마음이 굳어져’와 ‘그 도(道)’는 이해 가능하지만 현대 표준어에서는 ‘완고해져’와 ‘그 길’이 더 자연스럽습니다. ‘변론하였습니다’도 가능하나 διαλεγόμενος의 지속적인 이성적 논의라는 뜻에는 ‘토론하였습니다’가 무난합니다.
  terminology: ‘제자들’, ‘두란노’는 적절합니다. ‘그 길’은 본문에서 제목처럼 기능하는 표현이므로, 대문자화가 불가능한 한국어에서는 주석으로 역사적 용법을 명시합니다.
