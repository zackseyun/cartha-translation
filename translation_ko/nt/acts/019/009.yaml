translation:
  language: ko
  text: 그러나 어떤 사람들은 완고해져 순종하지 않고, 무리 앞에서 그 길[a]을 비방하였습니다. 그래서 바울은 그들에게서 물러나 제자들을 따로 분리하고, 두란노의 강의실에서 날마다 토론하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 길’은 사도행전에서 초기 그리스도교 운동을 가리키는 명칭입니다.
    reason: cultural_note
