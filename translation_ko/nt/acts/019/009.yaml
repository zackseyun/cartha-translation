  - severity: low
    issue: ‘그 도(道)’의 현대성 및 용법
    rationale: ‘도(道)’는 전통적 번역어이나 현대 독자에게 다소 한문투로 들리고 일반적인 도리로 이해될 수 있습니다. 사도행전의 운동 명칭이라는 의미를 보존하도록 ‘그 길’과 주석을 사용합니다.
  revised_text: 그러나 어떤 사람들은 완고해져 순종하지 않고, 무리 앞에서 그 길[a]을 비방하였습니다. 그래서 바울은 그들에게서 물러나 제자들을 따로 분리하고, 두란노의 강의실에서 날마다 토론하였습니다.
