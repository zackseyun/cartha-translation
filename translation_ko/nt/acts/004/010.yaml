- from: 여러분 모두와 이스라엘의 온 백성이 이것을 알아야 합니다. 곧 여러분이 십자가에 못 박았으나 하나님께서 죽은 자들로부터 일으키신 나사렛 사람 예수 메시아의 이름으로, 바로 그 이름으로 이 사람이 여러분 앞에 건강하게 서 있다는 것입니다.
  to: 여러분 모두와 이스라엘의 온 백성은 이것을 알아 두시기 바랍니다. 여러분이 십자가에 못 박고 하나님께서 죽은 자들 가운데서 일으키신 나사렛 사람 예수, 곧 메시아의 이름으로, 이 사람이 여러분 앞에 건강한 몸으로 서 있습니다.[a]
