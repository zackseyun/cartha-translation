  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
  footnotes:
  - marker: a
    text: Or 'before the apostles.' The Greek literally says 'beside/at the feet of the apostles,' preserving the image of placing the proceeds under apostolic oversight.
    reason: lexical_alternative
  - marker: b
    text: 'The object of ''they were laying'' and ''it was being distributed'' is implied from the previous verse: the proceeds from what had been sold.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그들은 그것을 사도들의 발 앞에 놓고 있었으며[a], 그것은 각 사람에게 필요한 만큼 나누어지고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사도들 앞에.” 그리스어는 직역하면 “사도들의 발 곁에/발 앞에”이며, 사도들의 관리 아래 두는 구체적인 모습을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: “그것을”과 “그것은”의 선행사는 앞 절에서 암시된, 팔아 얻은 수익입니다.
    reason: cross_reference
