review_pass:
  verdict: revise
  source_fidelity: ‘사도들을’은 이 절의 αὐτούς(‘그들을’)보다 구체적이며, ‘누구의 이름으로’는 ποίῳ ὀνόματι(‘무슨 이름으로’)의 표현을 다소 좁힙니다. ‘권능’보다 δύναμις의 일반적 의미를 살린 ‘능력’이 적절합니다. 미완료 과거 ἐπυνθάνοντο의 진행/시작 뉘앙스도 본문 또는 각주에 반영하는 것이 좋습니다.
  naturalness: ‘그들을 한가운데에 세운 뒤 물었습니다’와 ‘무슨 능력으로, 또는 무슨 이름으로’는 현대 표준 한국어 합쇼체에서 자연스럽고 심문 장면에도 잘 맞습니다.
  terminology: δύναμις는 ‘능력’, ὄνομα는 ‘이름’으로 옮겨 원문의 구별을 유지했습니다. 명시된 강조 대명사 ὑμεῖς는 한국어 어순상 ‘여러분이’로 드러냈습니다.
  issues:
  - severity: medium
    issue: ‘사도들’이 원문의 대명사보다 구체적입니다.
    rationale: 이 절의 αὐτούς는 단지 ‘그들을’이라고 하며, 문맥상 지시 대상은 알 수 있어도 본문에 ‘사도들’을 보태지 않는 편이 원문 충실성에 더 가깝습니다.
  - severity: medium
    issue: ‘누구의 이름으로’가 ‘무슨 이름으로’를 해석적으로 좁힙니다.
    rationale: ποίῳ ὀνόματι는 문자적으로 ‘무슨 이름으로’입니다. ‘누구의’는 대체로 의미가 통하지만 원문의 표현을 변경합니다.
  - severity: low
    issue: ‘권능’은 δύναμις에 신학적·문체적 색채를 더합니다.
    rationale: 문맥상 초자연적 능력을 배제하지 않지만, 원어의 일반어적 의미를 보존하는 ‘능력’이 더 중립적입니다.
  revised_text: 그들이 그들을 한가운데에 세운 뒤 물었습니다. 「여러분이 무슨 능력으로, 또는 무슨 이름으로 이 일을 했습니까?」
  revised_footnotes:
  - marker: a
    text: 또는 “묻고 있었습니다” 또는 “물었습니다.” 그리스어 미완료 과거는 계속된 질문 또는 질문의 시작을 나타낼 수 있습니다.
    reason: ἐπυνθάνοντο의 미완료 과거가 지닌 진행적 또는 시작의 뉘앙스를 제시합니다.
  revision_rationale: 원문의 대명사가 지닌 비특정성을 유지하고, δύναμις와 ὄνομα를 각각 ‘능력’과 ‘이름’으로 직역에 가깝게 옮겼습니다. 미완료 과거의 가능한 뉘앙스는 한국어 본문의 자연스러움을 해치지 않도록 각주로 보완했습니다.
