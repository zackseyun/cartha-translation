  source_fidelity: 원문의 αὐτούς는 문맥상 베드로와 요한을 가리키지만, 이 절 자체에는 ‘사도들’이라는 명사가 없으므로 ‘그들’로 유지하는 것이 적절합니다. δύναμις는 ‘권능’보다 현대 한국어에서 자연스러운 ‘능력’으로 옮기고, ποίῳ ὀνόματι는 ‘누구의 이름’으로 특정하지 않고 ‘무슨 이름’으로 보존했습니다.
  naturalness: ‘그들을 한가운데에 세워 놓고’는 심문 장면의 공간적 의미를 자연스럽게 전달합니다. 직접 인용문은 현대 합쇼체에 맞춰 ‘하셨습니까?’로 고쳤습니다.
  terminology: ‘능력’은 δύναμις의 기본 의미를 보존하며 ‘권세/권위’로 의미를 이동시키지 않습니다. ‘이름으로’는 이름에 의해 행사되는 대표적·호명적 의미를 유지합니다.
  issues:
