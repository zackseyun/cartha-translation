    issue: ‘사도들을’은 원문에 없는 직함을 첨가합니다.
    rationale: 원문은 단지 ‘그들’을 뜻하는 αὐτούς를 사용합니다. 앞 문맥의 지시 대상을 본문에 직함으로 풀어쓰지 않는 편이 원문 충실성에 더 맞습니다.
  - severity: medium
    issue: ‘누구의 이름으로’는 ποίῳ ὀνόματι의 불특정 의문 표현을 다소 해석적으로 좁힙니다.
    rationale: ‘무슨 이름으로’가 ‘어떤/무슨 이름으로’라는 원문의 표현을 직접 보존합니다.
  - severity: low
