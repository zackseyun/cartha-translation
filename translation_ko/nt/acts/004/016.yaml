  to: 그들은 이렇게 말했습니다. 「이 사람들을 어떻게 해야 하겠습니까? 그들을 통하여 잘 알려진 표적이 일어났다는 것은 예루살렘에 사는 모든 사람에게 분명하니, 우리도 그것을 부인할 수 없습니다.」
