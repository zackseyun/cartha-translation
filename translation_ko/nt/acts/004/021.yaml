  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
  footnotes:
  - marker: a
    text: Or 'after threatening them again' or 'after adding threats.' The Greek participle προσαπειλησάμενοι conveys an additional or intensified threatening beyond what had already occurred.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들에게 거듭[a] 위협을 가한 뒤 놓아주었습니다. 백성 때문에 그들을 어떻게 처벌할 수 있을지 아무 방법도 찾지 못하였기 때문입니다. 이는 모든 사람이 일어난 일로 하나님께 영광을 돌리고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 위협을 가한’. 그리스어 προσαπειλησάμενοι는 앞서 있었던 위협에 더하여 위협했음을 나타냅니다.
    reason: lexical_alternative
