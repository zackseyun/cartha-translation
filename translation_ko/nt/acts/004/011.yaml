review_pass:
  verdict: revise
  source_fidelity: The draft conveys the identification of Jesus as the rejected stone and preserves the builder metaphor. However, “건축자인 여러분” is less natural than the Greek’s direct appositional address, “you, the builders,” and the final predicate is more clearly expressed as a completed becoming.
  naturalness: “이분이 바로” and “되신 분입니다” are understandable, but “여러분 건축자들이” is smoother and more direct in modern formal Korean. Separating the two predicates also avoids an unnecessarily heavy nominal construction.
  terminology: “돌” and “모퉁이의 머릿돌” appropriately retain the Psalm-derived building imagery. A footnote should preserve the disputed architectural nuance of κεφαλὴ γωνίας without making “cornerstone” or “capstone” exclusive.
  issues:
  - severity: medium
    issue: The phrase “건축자인 여러분” weakens the source’s direct apposition.
    rationale: ὑφ’ ὑμῶν τῶν οἰκοδόμων directly addresses the hearers as “you, the builders.” “여러분 건축자들이” retains both the accusation and the metaphor more naturally.
  - severity: low
    issue: The architectural ambiguity of “head of the corner” is not represented in a note.
    rationale: The exact referent may be understood as a cornerstone or capstone. The main rendering may use “모퉁이의 머릿돌,” but an alternative should be noted.
  revised_text: 이분은 바로 여러분 건축자들이 버린 돌이시며, 모퉁이의 머릿돌이 되셨습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “모퉁이의 으뜸돌”; 직역하면 “모퉁이의 머리”입니다. “마룻돌”로 이해하기도 합니다.
    reason: κεφαλὴ γωνίας의 건축적 지시 대상에 관한 어휘적 대안을 보존합니다.
  revision_rationale: The revision renders the emphatic demonstrative, the direct plural accusation toward “the builders,” and the completed change expressed by γενόμενος in idiomatic modern formal Korean. It retains the stone metaphor and supplies a restrained footnote for the debated architectural image.
