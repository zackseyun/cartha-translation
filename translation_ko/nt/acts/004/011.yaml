review_pass:
  verdict: revise
  source_fidelity: The draft preserves the identification of Jesus as the rejected stone and his subsequent exaltation, but its punctuation and phrasing obscure the Greek apposition and relative development. A revision makes the sequence—rejected stone, then becoming the head of the corner—clearer.
  naturalness: “이분이 바로, 건축자인 여러분이” is unnaturally punctuated and “건축자인 여러분” is less idiomatic than “여러분 건축자들이.” The revised wording is natural modern formal-polite Korean while retaining the metaphor.
  terminology: “돌,” “건축자들,” and “모퉁이의 머릿돌” appropriately retain the Psalm-derived building imagery. Because κεφαλὴ γωνίας has disputed architectural force, a footnote preserves the viable “capstone” alternative and the literal expression.
  issues:
  - severity: medium
    issue: The main clause is awkwardly segmented and the relationship between “rejected” and “became” is not fully clear.
    rationale: The Greek presents Jesus as the stone rejected by the builders and then as the one that became the head of the corner. Korean should clearly express both predicates without a disruptive comma after “바로.”
  - severity: low
    issue: No note preserves the architectural ambiguity of κεφαλὴ γωνίας.
    rationale: “모퉁이의 머릿돌” is a suitable main-text rendering, but the source expression is debated; a brief alternative should be retained without deciding the image dogmatically.
  revised_text: 이분은 여러분 건축자들이 버린 돌, 곧 모퉁이의 머릿돌이 되신 분입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “마룻돌”; 직역하면 “모퉁이의 머리”입니다.
    reason: κεφαλὴ γωνίας의 건축적 지시 대상은 논쟁의 여지가 있으므로, 본문의 전통적 표현을 유지하면서 가능한 대안을 제시합니다.
  revision_rationale: The revision restores a clear Korean apposition (“버린 돌, 곧 …”) corresponding to the Greek stone imagery and states the resulting status with “되신 분입니다.” It uses natural formal-polite address and preserves the disputed architectural nuance in a footnote.
