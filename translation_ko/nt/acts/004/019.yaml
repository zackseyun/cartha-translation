    rationale: 원문의 ‘누구의 말을 듣다’라는 구문을 자연스럽게 드러내도록 ‘하나님 말씀을/여러분의 말을 듣는 것’으로 옮기는 편이 좋습니다.
  revised_text: 그러나 베드로와 요한이 대답하여 그들에게 말하였습니다. “여러분의 말을 듣는 것이 하나님 말씀을 듣는 것보다 하나님 보시기에 옳은지, 여러분이 판단하십시오.”
