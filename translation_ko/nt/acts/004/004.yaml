  terminology: '"말씀" appropriately renders λόγος in this apostolic-proclamation context. The translation retains "남자들" rather than neutralizing ἀνδρῶν. Footnotes clarify both the lexical sense of λόγος and the likely male-specific nature of the count without overdetermining its scope.'
