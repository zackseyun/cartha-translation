  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
  footnotes:
  - marker: a
    text: Or 'the word.' Here λόγος refers to the apostolic proclamation or message.
    reason: lexical_alternative
  - marker: b
    text: Greek 'the number of the men,' likely indicating a count of males rather than the entire mixed crowd.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그 말씀을[a] 들었던 사람들 가운데 많은 이들이 믿었고, 남자들의 수는[b] 약 오천 명이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말씀.” 여기서 λόγος는 사도들의 선포 또는 메시지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 “남자들의 수”입니다. 이는 전체 남녀 군중이 아니라 남성의 수를 셌을 가능성을 시사합니다.
    reason: cultural_note
