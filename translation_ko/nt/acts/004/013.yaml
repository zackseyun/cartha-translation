  naturalness: 합쇼체 문장은 자연스럽습니다. ‘또’는 원문의 τε를 과도하게 강조하지 않으면서 연결하지만, 두 분사구를 ‘보고 … 알게 되자’로 처리하면 원인-결과 흐름이 더 매끄럽습니다. ‘알아보았습니다’는 이 문맥에서 그들이 예수와 함께 지냈던 이들임을 식별했다는 뜻을 자연스럽게 전달합니다.
  terminology: ‘베드로’, ‘요한’, ‘예수’, ‘담대함’은 표준적인 성경 용례에 맞습니다. ἀγράμματοι καὶ ἰδιῶται는 현대 독자가 문자적 문맹이나 지적 열등을 뜻한다고 오해하지 않도록 ‘정식 교육을 받지 않은 일반인들’로 옮기고, 주석에서 가능한 대안 및 사회적 함의를 제시합니다.
