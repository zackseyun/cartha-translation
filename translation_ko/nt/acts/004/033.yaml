  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
  footnotes:
  - marker: a
    text: Or 'great grace was upon them all.' The Greek χάρις can mean 'grace' or 'favor'; the wording may include both God's gracious presence and the favorable regard shown toward the believers.
    reason: lexical_alternative
translation:
  language: ko
  text: 사도들은 큰 능력으로 주 예수의 부활에 대하여 계속 증언하였으며, 큰 은혜가 그들 모두 위에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “큰 호의가 그들 모두 위에 있었습니다.” 그리스어 카리스(χάρις)는 “은혜” 또는 “호의”를 뜻할 수 있습니다. 이 표현에는 하나님께서 베푸시는 은혜와 신자들을 향한 호의가 함께 암시될 수 있습니다.
    reason: lexical_alternative
