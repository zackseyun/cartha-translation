  terminology: 문맥상 대상은 베드로와 요한이므로 ‘사도들에게’도 지시 대상 면에서 크게 어긋나지는 않지만, 원문의 대명사를 따라 ‘그들을’로 옮기는 편이 더 정확합니다. ‘구금하다’는 시설 유형을 과도하게 특정하지 않아 τήρησις에 적절합니다.
