  terminology: '''심문을 받다'' suitably retains the forensic/examination sense of ἀνακρινόμεθα. ''선한 일'' is an appropriate plain rendering of εὐεργεσία. A note is needed for the broader semantic range of σέσωσται, while ''나았는지'' appropriately reflects the immediate physical-healing context.'
  issues:
