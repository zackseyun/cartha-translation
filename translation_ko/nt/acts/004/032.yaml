  text: Now the multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'they shared everything.'
    reason: lexical_alternative
  - marker: b
    text: The singular 'him' reflects the distributive singular in Greek ('to him'), referring to each person individually.
    reason: lexical_alternative
