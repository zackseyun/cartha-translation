  source_fidelity: 원문의 γάρ에 따른 설명적 연결을 ‘때문입니다’로 적절히 살렸으며, ‘이 치유의 표적이 일어난 그 사람’은 ἐφ’ ὃν γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως(그 사람에게 이 치유의 표적이 일어났다)를 충실하게 옮깁니다. ‘사십 세가 넘었’은 ἐτῶν ... πλειόνων τεσσεράκοντα의 ‘마흔 살이 넘은’을 정확히 전달합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘사십 세’는 성경 문체에서도 무리 없는 격식 있는 나이 표현이며, 문장 끝의 ‘때문입니다’는 앞 절을 설명하는 독립 절 인용에서도 적절합니다.
  terminology: ‘치유’, ‘표적’은 각각 ἴασις와 σημεῖον의 의미를 정확히 보존합니다. ‘표적’을 ‘기적’으로 바꾸지 않아 본문의 표현과 누가의 용례상 뉘앙스를 유지합니다.
