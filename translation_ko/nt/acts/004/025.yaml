translation:
  language: ko
  text: 주님께서[a] 성령을 통하여 주님의 종 다윗의 입으로 이렇게 말씀하셨습니다. “어찌하여 나라들이 분노하고 백성들이 헛된 일을 꾀하였는가?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “우리 조상 다윗, 주님의 종”이라고 되어 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 “헛된 일을 궁리하였는가?” 그리스어 동사는 “묵상하다” 또는 문맥상 “꾀하다, 계획하다”라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
