  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
  footnotes:
  - marker: a
    text: Or 'was taken up dead.' The Greek verb can mean 'was picked up' or 'was taken up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유두고라는 한 청년이 창문에 앉아, 바울이 오래 말씀하는 동안 깊은 잠에 빠져들고 있었습니다. 그는 잠에 눌려 삼층에서 아래로 떨어졌고, 죽은 채로 들어 올려졌습니다[a].
  philosophy: optimal-equivalence
  footnotes:
