id: ACT.20.3
reference: Acts 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
  footnotes:
  - marker: a
    text: Greek 'the Jews'; in Acts this often refers to a particular group opposing Paul in context, not to all Jewish people without distinction.
    reason: cultural_note
  - marker: b
    text: Or 'when a plot arose against him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'as he was about to set sail for Syria.'
    reason: lexical_alternative
  - marker: d
    text: Or 'he resolved to return by way of Macedonia.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 석 달을 지낸 뒤, 그가 시리아로 배를 타고 떠나려 할 때 유대인들이[a] 그를 해하려는 음모를 꾸미자, 그는 마케도니아를 거쳐 돌아가기로 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘유대인들’이라고 합니다. 사도행전에서 이 표현은 문맥상 바울에게 적대적인 특정 집단을 가리키는 경우가 많으며, 유대인 전체를 뜻하는 것은 아닙니다.
    reason: cultural_note
