revisions:
- from: 거기에 석 달을 머물렀는데, 시리아로 배를 타고 가려고 할 때에 유대인들의 음모가 그를 노리고 있었으므로, 마케도니아를 거쳐 돌아가기로 결정하였습니다.
  to: 그곳에서 석 달을 지낸 뒤, 그가 시리아로 배를 타고 떠나려 할 때 유대인들이[a] 그를 해하려는 음모를 꾸미자, 그는 마케도니아를 거쳐 돌아가기로 하였습니다.
  rationale: 원문의 ποιήσας를 ‘석 달을 지낸 뒤’로, μέλλοντι ἀνάγεσθαι를 ‘배를 타고 떠나려 할 때’로 옮겼습니다. 음모의 발생과 행위 주체를 자연스럽게 드러내기 위해 ‘유대인들이 그를 해하려는 음모를 꾸미자’로 고쳤으며, 본문의 ‘유대인들’은 유지하되 문맥적 범위를 주석으로 밝혔습니다.
