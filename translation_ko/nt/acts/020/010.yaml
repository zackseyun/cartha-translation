  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
  footnotes:
  - marker: a
    text: Or 'his soul is in him.' The Greek word ψυχή can mean 'life,' 'self,' or 'soul'; here 'life' best fits the immediate context of whether he is dead or alive.
    reason: lexical_alternative
  - marker: b
    text: Paul's words can be understood either as saying the young man was not dead after all, or that his life had been restored; the Greek wording itself does not explicitly settle the question.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 바울은 내려가 그 위에 엎드리고 그를 껴안으며 말하였습니다. “소란을 피우지 마십시오. 그의 생명[a]이 그 안에 있습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영혼’. 그리스어 프쉬케(ψυχή)는 ‘생명’, ‘자기 자신’, 또는 ‘영혼’을 뜻할 수 있습니다. 여기서는 그가 죽었는지 살았는지가 문제인 문맥이므로 ‘생명’이 가장 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 바울의 말은 그 청년이 실제로 죽지 않았다는 뜻으로도, 생명이 회복되었다는 뜻으로도 이해될 수 있습니다. 그리스어 표현 자체는 이 둘 가운데 어느 쪽인지 명시적으로 결정하지 않습니다.
    reason: alternative_reading
