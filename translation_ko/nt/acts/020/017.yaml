  source_fidelity: 원문의 ἀπὸ ... πέμψας ... μετεκαλέσατο는 밀레도에서 에베소로 사람이나 전갈을 보내 교회의 장로들을 오도록 요청한 것을 뜻합니다. 초안의 의미는 대체로 맞지만, ‘그가’의 위치가 다소 부자연스럽고, ‘사람을’은 원문에 명시되지 않은 보충이므로 각주로 그 근거와 대안을 밝혀 두는 것이 좋습니다.
  naturalness: ‘그는 밀레도에서’라는 어순이 현대 표준 한국어 합쇼체 산문에서 더 자연스럽습니다. ‘불러오게 하였습니다’는 파견과 소집의 연쇄를 잘 나타내며, 장로들이 실제로 도착했다는 사실을 이 절만으로 단정하지 않습니다.
  terminology: ἐκκλησία는 ‘교회’, πρεσβυτέρους는 교회 지도자 문맥의 일반적이고 비종파적인 표현인 ‘장로들’로 옮기는 것이 적절합니다. ‘밀레도’와 ‘에베소’는 통용되는 한국어 성경 지명 표기입니다.
