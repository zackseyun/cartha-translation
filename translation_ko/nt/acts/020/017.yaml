  text: 그는 밀레도에서 에베소로 사람을 보내어 교회의 장로들을 불러오게 하였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에베소에 사람을 보내어 교회의 장로들을 불러오도록 하였습니다.” 그리스어는 ‘에베소로 보내어’와 ‘불러오게 하였다’를 함께 사용하며, 전갈이나 사절을 보내 장로들에게 오도록 요청했음을 나타냅니다.
    reason: 원문에 명시되지 않은 파견 대상과 ‘불러오게 하였다’의 소집 의미를 밝혀, 번역의 보충을 투명하게 하고 원문의 의미 범위를 보존합니다.
