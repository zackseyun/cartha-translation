  source_fidelity: 초안은 θεοῦ, ἐπισκόπους, ποιμαίνειν 및 περιεποιήσατο의 큰 뜻을 대체로 담고 있습니다. 그러나 「모든 양 떼를 조심하십시오」는 양 떼 자체를 경계하라는 뜻으로 읽혀 προσέχετε의 목적어 구조를 잘못 전달합니다. 또한 τοῦ αἵματος τοῦ ἰδίου를 「자기 피」로 단정하면 원문의 명사 생략과 그에 따른 해석상 여지를 충분히 보존하지 못합니다.
  naturalness: 「양 떼를 잘 살피십시오」, 「그 양 떼 가운데 감독자로 세우셔서」, 「교회를 돌보게 하셨습니다」는 현대 표준어 합쇼체에서 자연스럽고, 목자 비유와 직무의 관계도 분명합니다. 「치게 하셨습니다」는 오늘날 ‘벌을 주다’의 뜻이 먼저 연상될 수 있으므로 피하는 것이 좋습니다.
  terminology: 「성령」, 「감독자」, 「하나님의 교회」는 적절합니다. ποιμαίνειν은 ‘목양하다’보다 일반 독자에게 자연스러운 「돌보다」로 옮기되, 양 떼 비유는 앞부분에서 유지했습니다. περιεποιήσατο의 중간태는 「자기 것으로 삼으셨습니다」로 반영했습니다.
  issues:
