    issue: 「모든 양 떼를 조심하십시오」
    rationale: προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ는 자신과 양 떼를 주의 깊게 살피라는 명령입니다. 현 번역은 양 떼를 경계하라는 의미가 될 수 있습니다.
  - severity: medium
    issue: 「치게 하셨습니다」
    rationale: ποιμαίνειν은 목자가 양을 돌보는 행위입니다. 현대 한국어에서 ‘치다’는 이 문맥에 부자연스럽고 다른 뜻으로 오해될 수 있습니다.
  - severity: medium
    issue: 「자기 피로」 및 해당 각주
    rationale: τοῦ ἰδίου는 ‘자기에게 속한 분’이라는 명사적 용법으로도 읽히며, ‘자기 피’라고만 하면 한 해석을 본문에 확정합니다. 각주는 교리적 결론을 강하게 서술하기보다, 명사 생략이라는 문법적 쟁점과 가능한 번역을 간결하게 밝혀야 합니다.
  - severity: low
