  to: 여러분 자신과 모든 양 떼를 잘 살피십시오. 성령께서 여러분을 그 양 떼 가운데 감독자로 세우셔서 하나님의 교회[b]를 돌보게 하셨습니다. 하나님께서는 자기에게 속한 분의 피[a]로 그 교회를 자기 것으로 삼으셨습니다.
  rationale: 명령문의 목적어 관계를 바로잡아 양 떼를 돌보라는 뜻을 분명히 했고, 목자 비유에 맞는 현대어를 사용했습니다. 마지막 절은 하나님이 교회를 자신을 위해 얻으셨다는 περιεποιήσατο의 중간태를 반영했습니다. τοῦ ἰδίου는 본문에서 ‘자기에게 속한 분’으로 보존하고, ‘아들’ 및 전통적 ‘자기 피’ 해석은 각주에 병기하여 원문의 논쟁된 여지를 특정 교리적 결론으로 해소하지 않았습니다.
  reviewer_model: gpt-5.6-terra
