  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
  footnotes:
  - marker: a
    text: Or 'who is able,' taking the phrase to refer primarily to God rather than to 'the word of his grace.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 나는 여러분을 하나님과 그분의 은혜의 말씀에 맡깁니다. 이 말씀은 여러분을 굳게 세우고, 거룩하게 된 모든 사람과 함께 여러분에게 그 유업을 줄 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서는 여러분을 굳게 세우고, 거룩하게 된 모든 사람과 함께 여러분에게 그 유업을 주실 수 있습니다.” 여기서 “할 수 있는”이라는 말은 ‘그분의 은혜의 말씀’보다 하나님을 주로 가리킨다고 볼 수도 있습니다.
    reason: alternative_reading
