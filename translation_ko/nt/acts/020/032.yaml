- from: 이제 내가 여러분을 하나님과 그분의 은혜의 말씀에 부탁하니, 그분은 여러분을 세우시고 거룩하게 된 모든 사람들 가운데서 유업을 주실 수 있는 분이십니다.
  to: 이제 나는 여러분을 하나님과 그분의 은혜의 말씀에 맡깁니다. 이 말씀은 여러분을 굳게 세우고, 거룩하게 된 모든 사람과 함께 여러분에게 그 유업을 줄 수 있습니다.[a]
  rationale: The revision renders παρατίθεμαι as '맡깁니다,' takes the nearest antecedent ('the word of his grace') as the main-text referent of the capable participle, and preserves the grammatically viable God-referent reading in a footnote. It also expresses the inheritance as shared with all who have been sanctified in idiomatic Korean.
