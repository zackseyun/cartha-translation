  source_fidelity: 초안은 동작의 순서와 ‘새벽까지’라는 시간 범위를 대체로 잘 옮겼습니다. 다만 ἀναβὰς의 서사적 공간 이동은 문맥상 ‘위층으로’가 더 분명하며, κλάσας τὸν ἄρτον의 의미를 성찬으로 단정하지 않도록 주석으로 보존하는 것이 적절합니다. γευσάμενος는 여기서 ‘먹고/음식을 들고’라는 뜻으로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘위층으로 올라가 … 먹은 뒤, 새벽까지 오랫동안 이야기를 나눈 후 떠났습니다’는 현대 표준 한국어 합쇼체 서술문으로 자연스럽습니다. ‘오랫동안’은 ἐφ’ ἱκανόν을 무리 없이 반영합니다.
