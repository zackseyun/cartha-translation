  source_fidelity: 현 초안은 ἐξ ὑμῶν αὐτῶν의 내부 기원, 미래의 예고, 그리고 제자들을 자신들의 추종자로 만들려는 목적을 대체로 담고 있습니다. 그러나 ἄνδρες를 ‘사람들’로 옮겨 남성 지시를 중화했고, ‘자기들 뒤로 끌어내려’는 한국어에서 물리적으로 뒤쪽으로 끌어내는 뜻으로도 읽혀 ἀποσπᾶν…ὀπίσω ἑαυτῶν의 분리와 추종 관계를 충분히 드러내지 못합니다.
