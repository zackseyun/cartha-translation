translation:
  language: ko
  text: 저는 온갖 겸손과 눈물과, 유대인들의[b] 음모로 말미암아 제게 닥친 시련[a]을 겪으면서 주를 섬겼습니다.
  philosophy: optimal-equivalence
  footnotes:
