- from: 유익한 것이라면 어떤 것도 여러분에게 알리고 공중 앞에서나 집집마다 가르치는 일을 주저하지 않았습니다.
  to: 여러분에게 유익한 것은 무엇 하나도 여러분에게 알리고, 공중에서나 집집마다 여러분을 가르치는 일을 주저하지 않았습니다.
  rationale: 조건적으로 들리는 표현을 제거하고, 원문의 ‘아무것도’라는 부정 범위와 선언·교육의 병렬을 보존하도록 고쳤습니다. ‘공중에서나 집집마다’는 공개적 사역과 가정별 사역의 대조를 유지합니다.
