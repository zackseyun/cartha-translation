  source_fidelity: 그리스어의 여행 서술을 충실히 옮겼습니다. ‘앗소에서 우리와 만났을 때에’는 συνέβαλλεν과 εἰς τὴν Ἆσσον의 문맥상 의미를 자연스럽게 반영하며, ‘그를 태우고’는 ἀναλαβόντες의 배에 받아 함께 가는 뜻을 앞선 문맥에 비추어 적절히 전달합니다. ‘미둘레네에 이르렀습니다’도 ἤλθομεν εἰς Μιτυλήνην에 충실합니다.
