  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
  footnotes:
  - marker: a
    text: Or, more literally, 'from among the Thessalonians' for Aristarchus and Secundus.
    reason: lexical_alternative
  - marker: b
    text: That is, from the Roman province of Asia, not the modern continent.
    reason: cultural_note
translation:
  language: ko
  text: 베뢰아 사람으로 부로의 아들인 소바더, 데살로니가 사람 아리스다고와 세군도, 더베 사람 가이오와 디모데, 그리고 아시아[a] 사람 두기고와 드로비모가 그와 동행하였습니다.
  philosophy: optimal-equivalence
