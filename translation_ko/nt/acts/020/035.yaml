  source_fidelity: 'The draft broadly preserves the two coordinated obligations and Jesus’ saying, but “보여 준 바와 같이” makes the Greek content clause sound like a comparison (“as I showed”) rather than what Paul demonstrated: that they must work in this way and assist the weak. It also has an unmatched closing quotation mark.'
  naturalness: The revised wording is natural modern standard Korean in formal-polite style. “약한 이들” retains the Greek term’s breadth without restricting it to a particular kind of weakness.
  terminology: “주 예수,” “복,” and “기억해야 합니다” appropriately render κύριος Ἰησοῦ, μακάριον, and μνημονεύειν. The note preserves the possible sustained sense of ἀντιλαμβάνεσθαι.
  issues:
  - severity: medium
    issue: The opening construction does not clearly render the ὅτι content clause.
    rationale: “내가 … 보여 준 바와 같이” means “as I showed,” whereas the Greek states that Paul showed them that they must labor in this way and help the weak.
  - severity: high
    issue: Unmatched closing quotation mark at the end of the translation.
    rationale: The final ” has no corresponding opening mark and is a structural punctuation error.
  revised_text: 내가 모든 일에서 여러분에게, 이처럼 수고하여 약한 이들을 도와[a]야 하며 또 주 예수께서 친히 ‘주는 것이 받는 것보다 더 복이 있다’라고 하신 말씀을 기억해야 한다는 것을 보여 주었습니다.
