  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
  footnotes:
  - marker: a
    text: Or 'to support the weak.' The Greek verb can imply sustained assistance, not only momentary help.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 모든 일에서 여러분에게, 이처럼 수고하여 약한 이들을 도와[a]야 하며 또 주 예수께서 친히 ‘주는 것이 받는 것보다 더 복이 있다’라고 하신 말씀을 기억해야 한다는 것을 보여 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약한 이들을 도와주어야’. 그리스어 동사는 일시적인 도움뿐 아니라 지속적인 지원을 뜻할 수도 있습니다.
    reason: ἀντιλαμβάνεσθαι의 ‘지지하다, 지속적으로 돕다’라는 가능한 뉘앙스를 보존합니다.
