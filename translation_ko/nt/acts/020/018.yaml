base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
  footnotes:
  - marker: a
    text: Asia here refers to the Roman province of Asia in western Asia Minor, not the modern continent.
    reason: cultural_note
  - marker: b
    text: Or “how I was with you the whole time.” The Greek expression can emphasize either Paul’s manner of life or his continual presence among them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 왔을 때, 그가 그들에게 말하였습니다. “내가 아시아[a]에 발을 디딘 첫날부터 줄곧 여러분과 함께 어떻게 지냈는지를 여러분 자신이 아십니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 아시아는 현대의 대륙이 아니라 소아시아 서부에 있던 로마의 아시아 속주를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 “내가 줄곧 여러분과 함께 어떻게 있었는지를.” 그리스어 표현은 바울의 삶의 방식 또는 그가 계속 그들과 함께 있었음을 강조할 수 있습니다.
    reason: lexical_alternative
