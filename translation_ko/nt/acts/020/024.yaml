  - severity: low
    issue: 길과 직무를 완수하는 병렬 구조를 더 선명하게 할 필요
    rationale: ὡς τελειῶσαι는 ‘나의 길’과 ‘받은 직무’ 양쪽에 관련됩니다. ‘길을 끝까지 달리고 … 직무를 마치다’로 옮기면 비유와 문장 구조가 더 명료해집니다.
