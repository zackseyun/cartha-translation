  source_fidelity: 초안은 바울이 사명을 마치는 것을 위해 목숨을 귀히 여기지 않는다는 핵심 뜻과 ‘주 예수께로부터 받은 직무’, ‘하나님의 은혜의 복음’을 충실히 옮깁니다. 다만 ἐμαυτῷ(‘내게/나 자신에게’)의 개인적 가치 판단이 명시되지 않았고, δρόμον과 διακονίαν 모두를 ‘마치다’에 연결하는 구조를 더 분명히 하는 편이 좋습니다.
