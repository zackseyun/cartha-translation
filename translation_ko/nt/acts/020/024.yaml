  to: 그러나 나는 내 목숨을 내게 조금도 귀한 것으로 여기지 않습니다. 다만 내가 나의 길을 끝까지 달리고, 주 예수께 받은 직무, 곧 하나님의 은혜의 복음을 증언하는 일을 마치기만 한다면 말입니다.
