  terminology: ‘목숨’, ‘직무’, ‘주 예수’, ‘하나님의 은혜의 복음’, ‘증언하다’는 문맥과 현대 한국어 성경 문체에 잘 맞습니다. ‘길’은 δρόμος의 비유를 무리 없이 보존합니다.
