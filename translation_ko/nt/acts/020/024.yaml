id: ACT.20.24
reference: Acts 20:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
  footnotes:
  - marker: a
    text: Or 'my soul as precious to myself.' Here 'life' is preferred because the context is Paul's willingness to face death in order to complete his mission.
    reason: lexical_alternative
  - marker: b
    text: Or 'finish my race.' The Greek δρόμος is a course or race run to completion.
    reason: lexical_alternative
  - marker: c
    text: Or 'to bear witness' or 'to solemnly testify' to the gospel of God's grace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 내 목숨을 내게 조금도 귀한 것으로 여기지 않습니다. 다만 내가 나의 길을 끝까지 달리고, 주 예수께 받은 직무, 곧 하나님의 은혜의 복음을 증언하는 일을 마치기만 한다면 말입니다.
  philosophy: optimal-equivalence
