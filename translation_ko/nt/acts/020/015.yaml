  terminology: 키오스(Chios), 사모스(Samos), 밀레토스(Miletus)는 현대 한국어 지명 표기에 맞춥니다. ‘맞은편’과 ‘들르다’는 각각 ἄντικρυς와 항해 문맥의 παρεβάλομεν을 적절히 반영합니다.
