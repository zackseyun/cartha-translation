  revised_text: 그곳에서 배를 타고 떠나, 이튿날 키오스 맞은편에 이르렀습니다. 그다음 날에는 사모스에 기항했고, 그 이튿날에는 밀레도에 이르렀습니다.
  revised_footnotes:
  - marker: a
    text: 또는 "키오스 건너편에" 또는 "키오스 앞바다에". 그리스어는 그 섬에 반드시 상륙했다기보다 섬 맞은편의 위치를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 "사모스에 배를 대었다." 그리스어 동사는 항해 문맥에서 배를 대거나 기항하는 것을 뜻합니다.
    reason: lexical_alternative
  revision_rationale: 본문의 사흘에 걸친 이동 순서를 유지하면서, κἀκεῖθεν을 "그곳에서"로, ἀποπλεύσαντες를 "배를 타고 떠나"로 옮겼습니다. "키오스 맞은편"은 ἄντικρυς의 위치 정보를 보존합니다. 사모스 구절은 자연스러운 조사와 항해 용어를 사용해 παρεβάλομεν의 뜻을 반영했습니다.
