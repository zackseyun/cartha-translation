  naturalness: 초안의 "사모를 들렀으며"는 현대 표준어에서 목적격 결합이 어색합니다. 장소 부사격과 항해 문맥에 맞는 "사모스에 기항했고"가 자연스럽습니다.
  terminology: 현대 한국어 지명 표기로 키오스, 사모스, 밀레도를 사용했습니다. "기항하다"는 본문의 항해 용어에 적합하며 과도한 해석을 더하지 않습니다.
  issues:
