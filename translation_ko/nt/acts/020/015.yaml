    rationale: ἀποπλεύσαντες는 배로 떠난다는 뜻이므로 ‘출항하여’가 ‘배를 타고 떠나’보다 항해 행위를 더 직접적으로 나타냅니다.
  revised_text: 그리고 그곳에서 출항하여 이튿날 키오스 맞은편에 이르렀고, 그다음 날 사모스에 들렀으며, 그다음 날 밀레토스에 이르렀습니다.
  revised_footnotes:
