    issue: '"사모를 들렀으며"의 조사 및 동사 결합'
    rationale: 들르다는 이 문맥에서 보통 장소에 부사격 조사를 써서 "사모스에 들르다/기항하다"로 표현합니다. 또한 παραβάλλω의 항해적 정박·기항 의미가 약해집니다.
