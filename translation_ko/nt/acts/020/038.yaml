  to: 그들은 특히, 그들이 더 이상 그의 얼굴을 보지 못할 것이라고 그가 한 말 때문에 슬퍼하였습니다. 그리고 그를 배까지 배웅하였습니다.
  rationale: 원문의 ‘더 이상’(οὐκέτι)과 미래의 예상(μέλλουσιν)을 자연스러운 한국어로 반영하고, 장로들이 더 이상 바울을 보지 못한다는 의미를 명확히 하였습니다. 마지막 절은 작별을 위해 배까지 동행하는 뜻을 유지하였습니다.
