  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
  footnotes:
  - marker: a
    text: Or "clean from the blood of all"; the Greek idiom refers to being free from guilt or responsibility concerning others.
    reason: lexical_alternative
  - marker: b
    text: This wording likely echoes Ezekiel's watchman imagery about bloodguilt (e.g., Ezek 3:18–19; 33:6–9).
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 오늘 나는 여러분에게 증언합니다. 나는 모든 사람의 피에 대한 죄가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 사람의 피에서 깨끗합니다.” 이 그리스어 관용구는 다른 사람들에 관하여 죄나 책임이 없음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: '이 표현은 피의 죄와 파수꾼의 책임에 관한 에스겔의 비유를 반영하는 듯합니다(예: 겔 3:18–19; 33:6–9).'
