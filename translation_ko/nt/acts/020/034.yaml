    issue: ὑπηρέτησαν의 결과적 의미가 약하게 반영됨
    rationale: ‘필요를 위해 일하였습니다’는 노동 행위 자체는 전달하지만, 그 노동이 바울과 동행자들의 필요를 충족했다는 원문의 문장 관계를 충분히 드러내지 못합니다.
  revised_text: 여러분 자신이 아십니다. 이 두 손이 나의 필요와 나와 함께 있던 사람들의 필요를 채워 주었습니다.
