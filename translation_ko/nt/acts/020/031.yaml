review_pass:
  verdict: revise
  source_fidelity: The draft conveys the inferential force, the three-year duration, continual night-and-day activity, tears, and individual pastoral action. However, '눈물로' can imply means rather than accompaniment, and the wording does not clearly preserve the ongoing vigilance of the present imperative.
  naturalness: '''깨어 있어'' is informal speech-level Korean and conflicts with the required modern formal-polite 합쇼체. Recasting the sentence with ''기억하며 깨어 있으십시오'' is natural, formal, and retains the participial relationship.'
  terminology: '''권면하다'' is an appropriate broad Korean rendering of νουθετέω in this pastoral context. A footnote preserves its corrective-warning nuance without over-specifying it.'
  issues:
  - severity: medium
    issue: Register mismatch in '깨어 있어'
    rationale: The draft requires 합쇼체; the phrase is informal. '깨어 있으십시오' supplies the required formal-polite imperative.
  - severity: low
    issue: '''눈물로'' weakens the accompaniment sense of μετὰ δακρύων'
    rationale: '''눈물을 흘리며'' naturally expresses that Paul admonished while in tears.'
  - severity: low
    issue: The ongoing force of γρηγορεῖτε is underexpressed
    rationale: '''깨어 있으십시오'' naturally conveys continuing vigilance better than the draft''s bare informal phrase.'
  revised_text: 그러므로 내가 삼 년 동안 밤낮으로 눈물을 흘리며 한 사람 한 사람을 권면하기를[a] 그치지 않았다는 것을 기억하며 깨어 있으십시오.
