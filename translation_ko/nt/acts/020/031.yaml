  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
  footnotes:
  - marker: a
    text: Or 'warning each one.' The Greek verb can emphasize corrective warning as well as instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 삼 년 동안 밤낮으로 눈물을 흘리며 한 사람 한 사람을 권면하기를[a] 그치지 않았다는 것을 기억하며 깨어 있으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 사람 한 사람을 타이르며 경고하기를.’ 그리스어 동사는 교훈과 함께 바로잡기 위한 경고의 뜻도 나타낼 수 있습니다.
    reason: lexical_alternative
