source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
  footnotes:
  - marker: a
    text: Or 'from the first' or 'for a long time.'
    reason: lexical_alternative
  - marker: b
    text: Greek αἵρεσις, here meaning 'sect' or 'party,' not 'heresy' in the later technical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 처음부터 저를 알고 있으므로, 원한다면 제가 우리 종교의 가장 엄격한 분파[a]를 따라 바리새인으로 살았다는 것을 증언할 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 αἵρεσις는 여기서 후대의 기술적 의미인 ‘이단’이 아니라 ‘분파’ 또는 ‘당파’를 뜻합니다.
    reason: lexical_alternative
