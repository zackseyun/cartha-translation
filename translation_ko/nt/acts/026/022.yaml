translation:
  language: ko
  text: 그러므로 저는 하나님께로부터 도움을 받아 오늘날까지 서서, 낮은 사람과 높은 사람 모두에게 증언하며, 예언자들과 모세가 장차 일어날 것이라고 말한 것 외에는 아무것도 말하지 않습니다.
  philosophy: optimal-equivalence
