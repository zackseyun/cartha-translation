revisions:
- from: 그러나 저는 하나님께로부터 오는 도움을 받아 오늘까지 서 있으며, 작은 자에게나 큰 자에게나 증언하고 있습니다. 저는 예언자들과 모세가 일어나리라고 말한 것 외에는 아무것도 말하지 않습니다.
  to: 그러므로 저는 하나님께로부터 도움을 받아 오늘날까지 서서, 낮은 사람과 높은 사람 모두에게 증언하며, 예언자들과 모세가 장차 일어날 것이라고 말한 것 외에는 아무것도 말하지 않습니다.
  rationale: 원문의 결론 접속사, 장차 발생할 일이라는 미래 지향성, 그리고 ‘작은 자와 큰 자’라는 사회적 범위의 관용구를 반영하도록 수정했습니다. 원문의 문장 구조와 바울의 지속적인 증언이라는 의미는 유지했습니다.
