  source_fidelity: 개정이 필요합니다. ἀποστέλλω는 현재형이므로 이 위임 장면에서는 ‘보낼 것이다’보다 ‘보낸다’ 또는 ‘보내고 있다’가 적절합니다. ἐξαιρούμενος는 ‘건져 내어’로 충실히 옮길 수 있습니다. ‘이 백성’과 ‘이방인들’의 대조는 원문의 유대인/이방인 구도를 잘 보존합니다.
  naturalness: ‘내가 너를 이 백성과 이방인들에게서 건져 내어, 그들에게로 너를 보낼 것이다’는 한국어로 이해되지만, ‘그들에게로 너를’은 다소 무겁고 미래형은 원문의 현재형과 맞지 않습니다. ‘내가 너를 … 건져 내어 그들에게 보낸다’가 더 자연스럽습니다.
  terminology: ‘이방인들’은 여기서 τῶν ἐθνῶν의 문맥상 의미를 적절히 전달합니다. τοῦ λαοῦ는 본문에서 ‘이 백성’으로 유지하여 원문의 표현을 보존하고, 각주에서 유대 백성이라는 문맥상 지시를 밝혀도 좋습니다.
  issues:
  - severity: medium
    issue: ‘보낼 것이다’가 현재형 ἀποστέλλω를 미래형으로 바꿉니다.
    rationale: 원문은 예수께서 바울을 보내시는 현재의 위임 행위를 표현합니다. 한국어 본문도 현재형 ‘보낸다’로 옮기는 것이 적절합니다.
  - severity: low
    issue: ‘그들에게로 너를’의 어순과 조사 결합이 다소 무겁습니다.
    rationale: ‘그들에게 보낸다’는 εἰς οὓς의 수신 대상 의미를 자연스럽게 전달합니다.
  revised_text: 내가 너를 이 백성과 이방인들에게서 건져 내어 그들에게 보낸다.
  revised_footnotes:
  - marker: a
    text: 또는 “유대 백성과 이방인들에게서 너를 구출하여.”
    reason: τοῦ λαοῦ는 이방인들과의 대조에서 유대 백성을 가리키며, ἐξαιρούμενος는 ‘구출하여’로도 옮길 수 있다.
  revision_rationale: 미래형을 원문의 현재형에 맞추어 ‘보낸다’로 고치고, 수신 대상을 나타내는 표현을 자연스러운 한국어 어순으로 다듬었습니다. ‘이 백성’은 원문의 비교적 비특정적인 표현을 보존하며, 유대 백성이라는 문맥상 의미는 각주에서 제시했습니다.
