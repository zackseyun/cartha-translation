source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
  footnotes:
  - marker: a
    text: Or 'the Christ.' The Greek title Χριστός is rendered 'Messiah' here because it functions as a title in a prophetic context.
    reason: alternative_reading
  - marker: b
    text: '''The people'' here likely refers to the Jewish people, in contrast with ''the Gentiles.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'to the nations.' In this context the phrase commonly means the Gentiles.
    reason: lexical_alternative
  - marker: d
    text: Or 'and that as the first to rise from the dead he would proclaim'.
    reason: previous_rendering
translation:
  language: ko
  text: 곧 메시아께서[a] 고난을 받으시고, 죽은 자들 가운데서 부활하신 첫 분으로서[d] 백성[b]과 이방인들[c]에게 빛을 선포하실 것이라는 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리스도.” 그리스어 칭호 Χριστός는 여기서 예언적 문맥의 칭호로 쓰였으므로 “메시아”로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: “백성”은 이 문맥에서 “이방인들”과 대조되어, 유대 백성을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “민족들에게.” 이 문맥에서 ἔθνη는 흔히 이방인들을 뜻합니다.
    reason: lexical_alternative
  - marker: d
    text: 그리스어는 메시아가 죽은 자들 가운데서 부활하신 첫 분이며, 그가 빛을 선포하실 것을 함께 말합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: '글로사리: 칭호 Χριστός→메시아. 이 절은 메시아 칭호가 고난·부활·이방 선교의 신학을 응축하는 핵심 구절.'
- source_word: ἀναστάσεως νεκρῶν
  english_pob_choice: rise from the dead
  chosen_korean: 죽은 자들 가운데서 부활하신
  alternatives_korean:
  - 죽음으로부터의 부활
  lexicon: BDAG
  rationale: '글로사리: ἀνάστασις→부활. 「가운데서」 표현으로 죽은 자들 무리에서 일어남의 형상을 살린다.'
theological_decisions:
- issue: '아그립바 앞 변론의 신학적 절정: 메시아의 고난·부활·이방 선교'
  chosen_reading: 메시아께서 고난을 당하시고, 죽은 자들 가운데서 부활하신 첫 분으로서
  alternative_readings:
  - 그리스도가 고난을 받고 부활하여
  rationale: 바울의 사도행전 회심 증언의 신학적 절정. Χριστός를 명백한 칭호로 보존하고, 부활을 「죽은 자들 가운데서」의 명확한 어휘로 옮긴다. 이방 선교는 변론 전체의 변증적 정점.
  doctrine_reference: 'DOCTRINE.md: Translate titles; Original-language primacy'
