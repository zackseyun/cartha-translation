- from: 그러나 일어나 네 발로 서라. 내가 너에게 나타난 것은 이 때문이다. 곧 너를 일꾼과 증인으로 세우려 함이니, 네가 [나를] 본 일들과 내가 너에게 나타날 일들에 대한 증인으로 세우려 함이다.
