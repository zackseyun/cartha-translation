review_pass:
  verdict: revise
  source_fidelity: 그리스어의 με(‘나를’)를 대괄호 없이 본문에 명시해야 합니다. 또한 ὧν τε … ὧν τε의 병렬은 바울이 이미 본 일과 장차 그리스도께서 그에게 나타나실 때 관련될 일 모두에 대한 증인이 되도록 세움받는다는 뜻입니다.
  naturalness: 초안의 ‘[나를]’는 번역 본문에 남기기 부적절하고, ‘증인으로 세우려 함이니 … 증인으로 세우려 함이다’는 같은 표현을 불필요하게 반복하여 현대 한국어 문장으로 다소 부자연스럽습니다. 문장을 정리하면 합쇼체의 격식과 흐름이 좋아집니다.
  terminology: ὑπηρέτης는 ‘일꾼’, μάρτυς는 ‘증인’으로 옮긴 것이 적절합니다. προχειρίζομαι의 공식적인 위임 의미는 ‘세우다’로 충분히 전달됩니다. ‘나타나다’는 ὤφθην 및 ὀφθήσομαι의 계시적 나타남을 보존합니다.
  issues:
  - severity: medium
    issue: ‘나를’이 대괄호 안에 처리되어 있음
    rationale: SBLGNT 본문에는 με가 있으므로 선택적 보충처럼 대괄호로 처리하지 않고 번역 본문에 명시하는 것이 원문에 충실합니다.
  - severity: low
    issue: ‘증인으로 세우려 함’의 중복
    rationale: 원문의 수식 관계는 유지하되, 한국어에서는 ‘증인이 되게 하려는 것’으로 풀어 쓰면 불필요한 반복 없이 자연스럽습니다.
  revised_text: 그러나 일어나 네 발로 서라. 내가 네게 나타난 것은 바로 이 목적을 위해서다. 곧 너를 일꾼과 증인으로 세우려는 것이니, 네가 나를 본 일들과 내가 네게 나타날 일들에 대한 증인이 되게 하려는 것이다.
