translation:
  language: ko
  text: 저는 모든 회당에서 여러 번 그들을 처벌하면서, 그들이 신성 모독을 하도록 강요하려 했습니다. 또한 그들에게 몹시 격분하여, 밖에 있는 도시들에까지[a] 가서 계속 그들을 박해했습니다.
  philosophy: optimal-equivalence
