  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
  footnotes:
  - marker: a
    text: Or 'whether almost or altogether'; the Greek expression is difficult and may refer to degree, effort, or time/extent.
    reason: alternative_reading
translation:
  language: ko
  text: 바울이 말했습니다. 「짧은 시간이든 긴 시간이든[a], 왕만이 아니라 오늘 제 말을 듣고 있는 모든 사람이 이 결박을 제외하고는 저와 같은 사람이 되기를 하나님께 기도합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거의든 완전히든.” 그리스어 표현은 어렵고, 시간뿐 아니라 정도·범위 또는 필요한 노력으로 이해하기도 합니다.
    reason: alternative_reading
