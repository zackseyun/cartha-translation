  language: ko
  text: 바울이 말했습니다. 「짧은 시간이든 긴 시간이든, 왕만이 아니라 오늘 저의 말을 듣는 모든 분이 — 이 결박을 제외하고는 — 저와 같은 사람이 되시기를 하나님께 기도합니다.」
  philosophy: optimal-equivalence
