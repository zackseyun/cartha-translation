  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
  footnotes:
  - marker: a
    text: Or “worthy of death or chains.” The Greek δεσμῶν is literally “bonds/chains,” but here likely refers to imprisonment or custody.
    reason: lexical_alternative
translation:
