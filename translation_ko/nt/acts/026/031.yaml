  text: 그들이 물러난 뒤, 서로 이야기하고 있었습니다. “이 사람은 사형이나 구금[a]에 처할 만한 일을 한 것이 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “결박” 또는 “쇠사슬.” 그리스어 δεσμῶν은 문자적으로 결박이나 쇠사슬을 뜻하지만, 여기서는 구금 또는 감금을 가리킬 수 있습니다.
    reason: lexical_alternative
