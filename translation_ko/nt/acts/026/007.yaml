revisions:
- from: 우리의 열두 지파는 밤낮으로 간절히 [하나님께] 예배하며 그 약속에 이르기를 소망하고 있습니다. 왕이시여, 저는 이 소망 때문에 유대인들에게 고발당하고 있습니다.
  to: 우리 열두 지파 백성은 밤낮으로 간절히 하나님을 섬기며 그 약속에 이르기를 바라고 있습니다. 왕이시여, 저는 이 소망과 관련하여 유대인들에게 고발당하고 있습니다.
  rationale: The revision removes the bracketed editorial element, uses '하나님을 섬기며' for the broader cultic sense of λατρεύω, represents δωδεκάφυλον as a collective people, and smooths the Korean while preserving the antecedent-dependent reference to the promise and the legal sense of the accusation. No footnote is necessary because the supplied object of religious service is clear from context and does not alter the stated meaning.
