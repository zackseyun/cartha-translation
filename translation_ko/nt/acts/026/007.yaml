review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the continual, earnest religious devotion, the hope of attaining the antecedent promise, the legal accusation, and the address to the king. However, '[하나님께] 예배하며' both narrows λατρεύω to worship and retains an editorial bracket in the running text. The collective singular τὸ δωδεκάφυλον is better represented as a collective people rather than simply as the plural 'tribes.'
  naturalness: '''그 약속에 이르기를 소망하고 있습니다'' is intelligible but somewhat stiff in modern Korean. ''그 약속에 이르기를 바라고 있습니다'' is more natural while retaining the directional sense. Removing brackets and using ''하나님을 섬기며'' produces clean modern formal-polite prose.'
  terminology: Render λατρεύω as '하나님을 섬기며,' which can include religious service without restricting it to the narrower sense of '예배하다.' Render δωδεκάφυλον as '우리 열두 지파 백성' to preserve its collective sense. '유대인들에게 고발당하고 있습니다' appropriately reflects the legal passive without implying every Jewish person universally.
  issues:
  - severity: medium
    issue: Editorial brackets and a narrowed rendering of λατρεύω
    rationale: '''[하나님께] 예배하며'' leaves an unresolved editorial insertion in the text and ''예배하다'' is narrower than the religious-service sense of λατρεύω. The contextual object 하나님 may be supplied without brackets, and ''섬기다'' is broader.'
  - severity: low
    issue: Collective sense of τὸ δωδεκάφυλον is underrepresented
    rationale: '''우리의 열두 지파는'' is possible, but the Greek is a collective singular for Israel as a twelve-tribe people. A collective Korean expression better reflects this nuance.'
  - severity: low
    issue: Awkward Korean expression for the hoped-for goal
    rationale: '''그 약속에 이르기를 소망하고 있습니다'' is overly stiff. ''그 약속에 이르기를 바라고 있습니다'' is natural and retains the source''s goal-oriented wording.'
  revised_text: 우리 열두 지파 백성은 밤낮으로 간절히 하나님을 섬기며 그 약속에 이르기를 바라고 있습니다. 왕이시여, 저는 이 소망과 관련하여 유대인들에게 고발당하고 있습니다.
