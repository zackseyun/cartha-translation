  verdict: revise
  source_fidelity: 개정이 필요합니다. 본문은 대체로 의미를 전달하지만, εἰς τὴν γῆν의 ‘쓰러짐’보다 ‘엎드러짐’은 다소 능동적·자발적으로 들릴 수 있고, πρὸς κέντρα의 ‘가시채를 … 차다’라는 비유에서 κέντρα의 뾰족한 몰이 도구라는 뜻과 해를 입는 함의가 ‘막대기’로는 약화됩니다. 또한 τῇ Ἑβραΐδι διαλέκτῳ의 ‘히브리어’는 본문에 유지하되, 아람어로 이해될 가능성을 각주로 보존해야 합니다.
  naturalness: ‘우리 모두가 땅에 쓰러졌을 때’와 ‘제게 이렇게 말하는 음성을 들었습니다’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. ‘가시채를 걷어차는 것은 네게 고통스럽다’는 한국어에서도 비유의 문자적 영상과 격언적 힘을 유지합니다.
  terminology: ‘히브리어’는 그리스어 본문의 표면적 표현을 따릅니다. ‘가시채’는 κέντρα(가축을 몰 때 쓰는 뾰족한 몰이 도구)를 ‘막대기’보다 정확히 나타냅니다. ‘박해하다’는 διώκεις에 적절합니다.
  issues:
  - severity: medium
    issue: 히브리 말/방언이 아람어를 가리킬 수 있다는 각주가 누락되었습니다.
    rationale: 영어 POB 감사 기록은 본문에 ‘Hebrew’를 유지하면서도 이 역사언어학적 가능성을 각주로 보존합니다. 한국어도 본문의 번역을 바꾸지 않고 같은 모호성을 보존해야 합니다.
  - severity: medium
    issue: ‘막대기를 발로 차기’가 κέντρα의 의미와 πρὸς의 대항 관계를 충분히 드러내지 못합니다.
    rationale: κέντρα는 일반 막대기가 아니라 뾰족한 가축 몰이 도구이며, 이 격언은 그것을 걷어차는 자가 스스로 해를 입는 상황을 전제합니다. ‘가시채를 걷어차다’가 더 정확합니다.
  - severity: low
    issue: ‘엎드러졌을 때’는 καταπίπτω의 ‘쓰러지다/넘어지다’보다 자발적으로 몸을 낮춘 뉘앙스를 줄 수 있습니다.
    rationale: ‘땅에 쓰러졌을 때’가 낙하·전도의 서술을 더 직접적으로 반영합니다.
