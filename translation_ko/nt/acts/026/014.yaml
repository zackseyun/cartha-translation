source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
  footnotes:
  - marker: a
    text: Or possibly, 'in Aramaic'; the Greek expression literally says 'in the Hebrew language/dialect.'
    reason: alternative_reading
  - marker: b
    text: 'A proverbial expression: resisting the speaker only brings harm to oneself.'
    reason: cultural_note
translation:
  language: ko
  text: 우리 모두가 땅에 쓰러졌을 때, 저는 히브리어로[a] 제게 이렇게 말하는 음성을 들었습니다. “사울아, 사울아, 어찌하여 나를 박해하느냐? 가시채를 걷어차는 것은 네게 고통스럽다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아람어’. 그리스어 표현은 직역하면 ‘히브리 말/방언으로’이다.
    reason: alternative_reading
  - marker: b
    text: 말하는 자에게 저항하는 것은 결국 자기 자신에게 해를 입힌다는 격언적 표현.
    reason: cultural_note
