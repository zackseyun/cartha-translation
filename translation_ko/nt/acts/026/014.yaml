revisions:
- from: 우리 모두 땅에 엎드러졌을 때, 저는 히브리 말로 저에게 말씀하시는 음성을 들었습니다. 〈사울아, 사울아, 어찌하여 나를 박해하느냐? 막대기를 발로 차기는 너에게 어려운 일이다.〉[a]
  to: 우리 모두가 땅에 쓰러졌을 때, 저는 히브리어로[a] 제게 이렇게 말하는 음성을 들었습니다. “사울아, 사울아, 어찌하여 나를 박해하느냐? 가시채를 걷어차는 것은 네게 고통스럽다.”[b]
  rationale: 그리스어의 시간 관계(모두 쓰러진 때에 들음), ‘히브리어’라는 본문 표현, 사울의 반복 호칭, 현재형 질문, 그리고 가시채 비유를 보존했습니다. 아람어 가능성은 본문에 도입하지 않고 각주에만 제시했으며, 기존 격언 각주는 해당 표현 바로 뒤의 표지로 옮겼습니다.
