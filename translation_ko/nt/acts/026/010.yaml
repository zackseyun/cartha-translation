  text: 저는 또한 예루살렘에서 그렇게 했습니다. 저는 대제사장들에게서 권한을 받아 성도들 중 많은 사람을 감옥들에 가두었고, 그들이 죽임을 당할 때에는 그들에게 불리한 표를 던졌습니다.
