    rationale: κατήνεγκα ψῆφον은 이 문맥에서 그들에게 불리하게 표를 행사한 것을 나타냅니다. ‘거기에’는 죽임 자체에 찬성했다는 뜻으로만 좁게 읽힐 수 있고, 사람들을 향한 표라는 문맥적 방향도 흐립니다.
