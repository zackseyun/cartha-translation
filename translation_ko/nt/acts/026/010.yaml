  source_fidelity: 개정이 필요합니다. 초안은 바울이 예루살렘에서 성도들을 가두고 그들의 죽음에 표를 행사했다는 핵심을 잘 전달합니다. 그러나 καὶ의 연속·첨가 용법이 첫 문장에서 약해졌고, ‘거기에 찬성표를 던졌습니다’의 ‘거기에’는 표가 사람들을 대상으로 한 불리한 표였다는 ψῆφον의 문맥상 방향을 불분명하게 합니다. ‘감옥들’은 복수 φυλακαῖς도 보존합니다.
  naturalness: ‘성도들 가운데 많은 이를’도 가능하지만, 현대 표준어 합쇼체에서는 ‘성도들 중 많은 사람을’이 더 자연스럽고 명료합니다. ‘감옥들에 가두었습니다’와 ‘그들에게 불리한 표를 던졌습니다’는 격식 있는 서술에 자연스럽습니다.
  terminology: ‘성도들’, ‘대제사장들’, ‘권한’은 적절합니다. ‘성도들’은 신자 공동체를 가리키며, 특정 성인 계층을 뜻하지 않습니다. ψῆφος는 문자적으로 표이며, 정확한 제도적 법정 여부는 본문이 확정하지 않으므로 ‘표를 던졌습니다’로만 옮기고 제도적 설명은 덧붙이지 않았습니다.
  issues:
