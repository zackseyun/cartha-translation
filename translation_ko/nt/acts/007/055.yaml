review_pass:
  verdict: revise
  source_fidelity: 원문의 분사 구조와 핵심 내용은 대체로 충실합니다. 다만 ἀτενίσας는 단순히 위를 보거나 경건하게 우러러보는 뜻보다 ‘시선을 고정하여 주의 깊게 바라봄’을 나타내므로, ‘우러러보고’보다 이를 드러내는 표현이 더 적절합니다. ‘하나님의 오른편에 서 계신’은 ἐκ δεξιῶν τοῦ θεοῦ의 정착된 성경적 관용어와 ἑστῶτα의 자세를 잘 보존합니다.
  naturalness: ‘하늘을 주목하여 바라보니’는 현대 표준어 합쇼체 서술에서 자연스럽고, 이어지는 환상 목격의 결과를 매끄럽게 연결합니다. 예수에 대한 높임 표현은 ‘서 계신’과 일관되게 ‘예수님’으로 표기하는 것이 한국어 성경 문체에 자연스럽습니다.
  terminology: ‘성령’, ‘하나님의 영광’, ‘하나님의 오른편’은 모두 한국어 기독교 성경 번역에서 통용되는 적절한 핵심 용어입니다. ‘오른편’은 최고 존귀와 권위의 자리를 가리키는 성경적 관용어이므로 의역하지 않고 유지했습니다.
  issues:
  - severity: low
    issue: ‘우러러보고’가 ἀτενίσας의 집중된 시선을 충분히 드러내지 못할 수 있습니다.
    rationale: ‘우러러보다’는 위쪽 또는 공경의 태도로 바라보는 뉘앙스가 두드러질 수 있습니다. 본문은 스데반이 하늘을 집중하여 바라본 뒤 환상을 본 장면이므로 ‘주목하여 바라보니’가 더 가깝습니다.
  - severity: low
    issue: ‘예수’와 높임말 ‘서 계신’의 문체적 일관성
    rationale: 원문의 이름 자체에 존칭이 추가된 것은 아니지만, 현대 한국어의 존대 성경 문체에서는 ‘예수님’이 ‘서 계신’과 자연스럽게 호응합니다. 이는 그리스어의 의미를 바꾸지 않는 수용 언어의 경어법 처리입니다.
  revised_text: 그러나 스데반은 성령으로 충만하여 하늘을 주목하여 바라보니, 하나님의 영광과 하나님의 오른편에 서 계신 예수님을 보았습니다.
