  terminology: '''이스라엘 자손,'' ''하나님,'' ''예언자,'' and ''일으키실 것이다'' are suitable and faithful. ''형제들 가운데서'' clearly preserves the sense of ἐκ τῶν ἀδελφῶν ὑμῶν, namely from within the addressees’ fellow Israelites, without adding interpretation.'
