  source_fidelity: 개정안은 τοῖς πατράσιν을 ‘우리 조상들에게는’으로 옮겨 여격의 관계를 더 직접적으로 반영하고, 광야 수식 범위를 자연스럽게 유지합니다. ὁ λαλῶν의 암시적 지시 대상도 ‘모세에게 말씀하신 분’으로 보존하며, ‘모세가 본’이라고 명시하여 ἑωράκει의 주어가 모세임을 분명히 합니다.
  naturalness: 초안의 ‘우리 조상들이 광야에 있을 때 그들과 함께’는 원문의 단순한 위치·소유 관계를 시간절로 풀어 다소 과도하게 해석합니다. 또한 ‘그가 본’은 한국어에서 선행사가 불명확합니다. 개정안은 현대 표준어 합쇼체 문장으로 자연스럽고 명료합니다.
  terminology: ‘증거의 장막’은 σκηνὴ τοῦ μαρτυρίου의 정착된 성서적 표현으로 적절합니다. ‘모형’은 τύπον에 적합하며, 화자를 하나님/주님으로 특정하지 않았습니다.
  issues:
