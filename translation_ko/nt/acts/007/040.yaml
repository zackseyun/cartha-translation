  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
  footnotes:
  - marker: a
    text: Or 'idols.' The Greek word is literally 'gods,' echoing the wording of the Exodus account and preserving the people's claim rather than replacing it with an interpretive label.
    reason: lexical_alternative
  - marker: b
    text: Or 'because as for this Moses'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 아론에게 말하였습니다. “우리를 위하여 우리 앞서 갈 신들[a]을 만들어 주십시오. 왜냐하면 우리를 이집트 땅에서 인도해 낸 이 모세에게 무슨 일이 일어났는지 우리가 알지 못하기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상들’. 그리스어는 직역하면 ‘신들’이며, 출애굽기 본문의 표현을 반영합니다. 본문은 그들의 주장을 ‘우상들’이라고 해석하여 바꾸지 않고 그대로 나타냅니다.
    reason: lexical_alternative
