revisions:
- from: 하나님께서는 그에게 이 땅에서 유업으로 한 발자국의 땅도 주지 않으셨으나, 그와 그 후손에게 이 땅을 소유로 주시겠다고 약속하셨습니다. 비록 그에게는 자식이 없었지만 말입니다.
  to: 하나님께서는 그에게 그 땅에서 유업을, 발 디딜 땅조차 주지 않으셨습니다[a]. 그러나 그에게 그 땅을 소유로 주시고, 그 후에 그의 후손에게도 주시겠다고 약속하셨습니다. 그에게 자식이 없었는데도 말입니다[b].
  rationale: βῆμα ποδός를 한국어의 자연스러운 토지 관용 표현인 ‘발 디딜 땅조차’로 옮기고, μετ’ αὐτόν의 계승적 시간 의미를 ‘그 후에 그의 후손에게도’로 명시했습니다. 마지막 속격 절대구는 본문에서 양보적으로 번역하되, 시간적 해석 가능성은 각주에 보존했습니다.
