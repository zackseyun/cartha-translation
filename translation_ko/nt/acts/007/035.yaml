  rationale: ‘거절하다’로 모세의 권위에 대한 배척이라는 문맥적 의미를 반영하고, ‘바로 그를’로 원문의 반복 강조를 보존했습니다. λυτρωτής의 본문 번역 ‘구속자’는 유지하되, 각주에서 본문에 명시되지 않은 대속 교리를 제거하고 의미 범위와 자연스러운 대안을 제시했습니다.
