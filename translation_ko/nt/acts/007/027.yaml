  verdict: revise
  source_fidelity: ἀδικῶν은 ‘부당하게 행하던’으로 대체로 반영되었고, ἄρχοντα καὶ δικαστήν 및 ἐφ’ ἡμῶν도 적절히 옮겼습니다. 그러나 ἀπώσατο는 서술 장면에서 상대를 물리적으로 또는 거칠게 밀어 물리친 행위를 가리키므로 ‘밀치며’보다 완료된 동작을 드러내는 ‘밀쳐 내고’가 더 충실합니다.
  naturalness: ‘그러나’와 ‘말했습니다’는 현대 표준어 합쇼체 문맥에 자연스럽습니다. 인용문을 완결하는 닫는 인용부호를 보완해야 합니다.
  terminology: ‘통치자와 재판관’은 ἄρχων과 δικαστής의 권위적·법적 병치를 잘 반영합니다. ‘이웃’은 πλησίον의 어휘적 연결을 보존하며, 여기서 특정 집단을 본문에 과도하게 명시하지 않습니다.
  issues:
  - severity: medium
    issue: ἀπώσατο의 동작상 및 구체성이 약하게 반영됨
    rationale: ‘밀치며’는 말하는 행위와 동시적으로 진행되는 모습으로 읽히기 쉽지만, 본문은 그가 모세를 밀쳐 물리친 뒤 말한 것으로 서술합니다. ‘밀쳐 내고’가 aorist 동작과 배척의 구체성을 더 잘 보존합니다.
  - severity: medium
    issue: 인용문 닫는 부호 누락
    rationale: 열린 한국어 인용부호 「에 대응하는 닫는 부호 」가 없어 문장 구조가 미완성입니다.
  revised_text: 그러나 자기 이웃에게 부당하게 행하던 사람이 모세를 밀쳐 내고[a] 말했습니다. 「누가 너를 우리 위에 통치자와 재판관으로 세웠느냐?」
