  source_fidelity: 원문의 ὁ δὲ ἀδικῶν τὸν πλησίον은 ‘자기 이웃에게 부당하게 행하던 사람’으로 잘 옮겼고, ἄρχοντα καὶ δικαστήν ἐφ’ ἡμῶν도 ‘우리 위에 통치자와 재판관’으로 충실합니다. 다만 ἀπώσατο는 완료된 단회 행위이므로 ‘밀치며’보다 ‘밀쳐 내고’가 원문의 상과 서술 순서를 더 잘 반영합니다.
