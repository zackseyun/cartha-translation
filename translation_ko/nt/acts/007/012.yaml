    issue: ‘처음으로’의 시간적 대비가 다소 약함
    rationale: πρῶτον은 단순히 이전에 한 번도 없었던 행동이라는 뜻보다, 문맥상 첫 번째 파송을 가리키며 다음 절의 δεύτερον(두 번째)과 대비됩니다. ‘처음에는’이 이 기능을 더 잘 보존합니다.
  revised_text: 야곱은 이집트에 곡식이 있다는 말을 듣고, 처음에는 우리 조상들을 보냈습니다.
