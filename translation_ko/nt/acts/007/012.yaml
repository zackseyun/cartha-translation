  source_fidelity: 원문의 시간적 분사 ἀκούσας는 ‘듣고’로, 간접화법 ὄντα σιτία εἰς Αἴγυπτον은 ‘이집트에 곡식이 있다는 말을’로 충실히 옮겼습니다. τοὺς πατέρας ἡμῶν도 문맥상 이스라엘의 남성 선조들을 가리키므로 ‘우리 조상들’은 적절합니다. 다만 πρῶτον은 뒤의 두 번째 파송과 대비되는 ‘처음에/첫 번째로’이므로, ‘처음으로’보다 대비를 더 분명히 하는 표현이 안전합니다.
  naturalness: ‘이집트’와 ‘곡식’은 현대 표준 한국어에 자연스럽고, 합쇼체 서술인 ‘보냈습니다’도 적절합니다. ‘처음에는’은 이어지는 두 번째 방문의 함의를 자연스럽게 드러냅니다.
  terminology: ‘야곱’, ‘이집트’, ‘곡식’, ‘우리 조상들’은 현대 한국어 성경 번역에서 이해 가능하고 원문의 역사적·가족적 표현을 과도하게 해석하지 않는 용어입니다.
  issues:
