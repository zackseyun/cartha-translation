  source_fidelity: ‘이집트로 내려갔고’ accurately renders κατέβη ... εἰς Αἴγυπτον, and ‘죽었습니다’ renders ἐτελεύτησεν directly. The draft’s ‘그도 우리 조상들도’ does not clearly express the coordinated subject αὐτὸς καὶ οἱ πατέρες ἡμῶν; it should be ‘그와 우리 조상들도.’
  naturalness: ‘그와 우리 조상들도 죽었습니다’ is natural modern formal-polite Korean and preserves the Greek coordination. ‘그도 우리 조상들도 죽었습니다’ is awkward and potentially disfluent.
  terminology: ‘야곱’ and ‘이집트’ are standard Korean biblical forms. ‘우리 조상들’ naturally identifies οἱ πατέρες ἡμῶν as Israel’s forefathers; a note preserves the Greek’s literal familial wording.
