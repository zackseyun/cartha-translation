  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
  footnotes:
  - marker: a
    text: Or 'because of this statement.' The Greek phrase 'at this word' can be understood as the immediate cause of Moses' flight.
    reason: lexical_alternative
  - marker: b
    text: Or 'lived as a foreigner' or 'became a resident alien.' The term denotes someone dwelling in a land not his own.
    reason: lexical_alternative
translation:
