  text: 모세는 이 말 때문에[a] 도망하여 미디안 땅에서 나그네로[b] 살게 되었고, 거기서 두 아들의 아버지가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 말에’입니다. 이 표현은 이 말이 모세가 도망한 직접적인 계기 또는 원인이 되었음을 나타낼 수 있습니다.
    reason: lexical_alternative
