  source_fidelity: 원문의 핵심 의미는 대체로 충실합니다. 다만 ἐν ταῖς καρδίαις αὐτῶν은 실제 귀환이 아니라 내적인 방향 전환을 명시하므로, 한국어에서는 이를 더 자연스럽고 분명하게 드러내는 표현이 좋습니다.
  naturalness: ‘원치 아니하고’는 현대 표준어 합쇼체 본문으로는 다소 문어적이고 고풍스럽습니다. ‘순종하려 하지 않았고’와 ‘마음으로 이집트로 돌아섰습니다’가 현대적이면서도 원문의 의미를 보존합니다.
  terminology: ‘우리 조상들’, ‘순종’, ‘거부하다’, ‘마음’은 문맥과 성경적 용례에 적절합니다. 모세를 가리키는 ‘그’도 바로 앞 절의 선행사를 자연스럽게 이어 줍니다.
  issues:
  - severity: low
    issue: 현대 문체와의 불일치
    rationale: ‘원치 아니하고’는 의미상 오류는 없으나, 요청된 현대 표준어 합쇼체에는 ‘원하지 않았고’ 또는 ‘순종하려 하지 않았고’가 더 자연스럽습니다.
  - severity: low
    issue: 내적 전환의 표현
    rationale: ‘마음으로는 이집트로 돌아갔습니다’도 가능하지만, ‘마음으로 이집트로 돌아섰습니다’가 원문의 ‘마음 안에서 이집트로 향했다’는 내적 지향을 더 자연스럽게 전달하며 실제 이동으로 오해될 여지를 줄입니다.
  revised_text: 우리 조상들은 그에게 순종하려 하지 않았고, 오히려 그를 거부하고 마음으로 이집트로 돌아섰습니다.
  revised_footnotes:
  - marker: a
