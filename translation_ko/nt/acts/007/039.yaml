    reason: lexical_alternative
  - marker: b
    text: 곧 그들은 여전히 광야에 있었지만, 속으로는 이집트로 돌아가기를 바랐습니다.
    reason: cultural_note
  revision_rationale: 현대 합쇼체에 맞게 ‘원치 아니하고’를 고치고, ὑπήκοοι γενέσθαι의 의지적 거부를 ‘순종하려 하지 않았고’로 옮겼습니다. 또한 ‘마음으로 이집트로 돌아섰습니다’로 ἐν ταῖς καρδίαις αὐτῶν의 내적 지향과 εἰς Αἴγυπτον의 방향성을 보존했습니다. 영어 감사 기록의 두 주석 앵커도 한국어로 반영했습니다.
