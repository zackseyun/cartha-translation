    rationale: ἀπώσαντο의 보다 직역적인 뉘앙스와 ‘마음으로’의 내적 전환을 설명하는 주석을 본문 앵커와 함께 제공합니다.
  revised_text: 우리 조상들은 그에게 순종하기를 원하지 않았고, 오히려 그를[a] 거부하고 마음으로는 이집트로 돌아갔습니다.[b]
  revised_footnotes:
