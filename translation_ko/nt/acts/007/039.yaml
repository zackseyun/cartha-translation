  terminology: ‘우리 조상들’은 οἱ πατέρες ἡμῶν에 적절하며, ‘순종’과 ‘마음’도 문맥과 성경적 용례에 잘 맞습니다. 이집트로의 ‘돌아감’은 실제 이동이 아니라 내적 지향임을 본문과 주석으로 분명히 합니다.
  issues:
