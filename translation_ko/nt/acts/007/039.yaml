  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
  footnotes:
  - marker: a
    text: Or 'pushed him away.' The Greek verb can more literally suggest thrusting Moses aside.
    reason: lexical_alternative
  - marker: b
    text: That is, they inwardly longed to return to Egypt even while still in the wilderness.
    reason: cultural_note
translation:
  language: ko
  text: 우리 조상들은 그에게 순종하기를 원하지 않았고, 오히려 그를[a] 거부하고 마음으로는 이집트로 돌아갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 밀어냈습니다.’ 그리스어 동사는 모세를 밀쳐 내거나 배척했다는 뉘앙스를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그들은 광야에 있으면서도 속으로는 이집트로 돌아가기를 바랐다는 뜻입니다.
    reason: cultural_note
