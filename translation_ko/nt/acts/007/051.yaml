  verdict: revise
  source_fidelity: The draft preserves the principal metaphors and terms, but it places the comparison with the ancestors before the assertion that the audience continually resists the Holy Spirit. Restoring the Greek clause order better retains Stephen's rhetorical force. The Greek πατέρες is most naturally rendered in Korean context as ‘조상들,’ with a note preserving the literal lexical form.
  naturalness: ‘목이 곧고’ is an established Korean biblical idiom. ‘마음과 귀에 할례를 받지 않은’ is clear and preserves the deliberately vivid metaphor. Dividing the final comparison into a second sentence is natural in modern formal-polite Korean while retaining the implied repeated verb.
  terminology: ‘성령’ appropriately renders τῷ πνεύματι τῷ ἁγίῳ. ‘할례’ retains the covenantal prophetic imagery rather than interpreting it as merely being closed-minded or deaf. A footnote on ‘조상들’ accounts for the source’s literal ‘fathers.’
  issues:
  - severity: medium
    issue: The comparison with the ancestors is moved ahead of ‘언제나 성령을 거스릅니다.’
    rationale: The Greek first states the continuing resistance to the Holy Spirit and then compares the audience with their fathers. Reordering is not required for Korean naturalness and weakens the source sequence slightly.
  - severity: low
    issue: No note preserves the lexical specificity of πατέρες behind ‘조상들.’
    rationale: ‘조상들’ is the idiomatic Korean contextual rendering, but the English audit trail supplies a lexical-alternative note for the literal ‘fathers’; a corresponding Korean note maintains transparency.
