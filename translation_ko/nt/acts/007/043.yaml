id: ACT.7.43
reference: Acts 7:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
  footnotes:
  - marker: a
    text: Some translations, reflecting the Hebrew source in Amos 5:26, read 'your god Rephan' instead of 'the god Rephan.' Acts here reads 'the god Rephan.'
    reason: alternative_reading
  - marker: b
    text: Acts reads 'beyond Babylon.' In Amos 5:27 the source passage is commonly rendered 'beyond Damascus.'
    reason: cross_reference
  - marker: c
    text: Or 'figures' or 'representations' for 'images.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 너희는 몰록의 장막과 레판 신의 별[a], 곧 너희가 그것들에게 예배하려고 만든 형상들[c]을 메고 다녔습니다. 그리고 내가 너희를 바벨론 너머로 추방하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 번역은 아모스 5:26의 히브리어 본문을 반영하여 ‘너희의 신 레판’으로 옮깁니다. 그러나 사도행전의 그리스어 본문은 ‘레판 신’이라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 사도행전은 ‘바벨론 너머로’라고 읽습니다. 인용의 배경 본문인 아모스 5:27은 일반적으로 ‘다마스쿠스 너머로’로 번역됩니다.
    reason: cross_reference
  - marker: c
    text: ‘형상들’은 ‘모형들’, ‘표상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
