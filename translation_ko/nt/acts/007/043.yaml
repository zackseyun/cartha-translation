  source_fidelity: 원문의 θεοῦ Ῥαιφάν은 ‘레판 신’(the god Rephan)이며, 초안의 ‘너희의 신 레판’은 사도행전 그리스어 본문이 아니라 아모스의 히브리어 전승을 따라 조화시킨 표현입니다. 또한 καί는 단순 접속이므로 ‘그러므로’처럼 인과관계로 번역하지 않는 것이 적절합니다. ἀνελάβετε는 이교 숭배 물품을 ‘메고 다녔습니다’로 옮겨 운반·휴대의 뜻을 자연스럽게 살렸습니다.
  naturalness: ‘몰록의 장막과 레판 신의 별, 곧 … 형상들’이라는 동격 구성을 유지하면서도 현대 표준 한국어 합쇼체로 매끄럽게 다듬었습니다. 비대칭적인 닫는 인용부호는 제거했습니다.
