source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
  footnotes:
  - marker: a
    text: Or, 'he moved him'; the Greek does not state the subject explicitly, though the context indicates God.
    reason: lexical_alternative
  - marker: b
    text: Stephen says this move happened after his father died. Compare Genesis 11:32; 12:4 for the related chronology.
    reason: cross_reference
translation:
  language: ko
  text: 그때 그는 갈대아 사람들의 땅에서 나와 하란에 정착하였습니다. 그리고 하나님께서는 그의 아버지가 죽은 뒤에 그곳에서 그를 지금 여러분이 살고 있는 이 땅으로 옮기셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘옮기셨습니다’의 주어를 명시하지 않습니다. 앞 문맥에 따라 하나님을 주어로 보충하였습니다. 스데반은 이 이동이 아버지가 죽은 뒤에 일어났다고 말합니다(창세기 11:32; 12:4 비교).
    reason: 원문에 명시되지 않은 주어의 보충을 투명하게 밝히고, 본문의 연대기적 진술을 설명합니다.
