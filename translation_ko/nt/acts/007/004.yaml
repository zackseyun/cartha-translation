revisions:
- from: 그래서 그는 칼대아 사람의 땅에서 나와 하란에 정착하였습니다. 그리고 그의 아버지가 죽은 후에, 하나님께서 그를 그곳에서 옮겨 지금 여러분이 살고 있는 이 땅으로 이주시키셨습니다.
  to: 그때 그는 갈대아 사람들의 땅에서 나와 하란에 정착하였습니다. 그리고 하나님께서는 그의 아버지가 죽은 뒤에 그곳에서 그를 지금 여러분이 살고 있는 이 땅으로 옮기셨습니다[a].
  rationale: 시간 표지와 민족·지명 표현을 원문에 더 가깝게 바로잡고, 중복된 이동 표현을 자연스러운 한국어로 정리했습니다. 원문에 명시되지 않은 주어 ‘하나님’은 문맥상 보충하되 각주에서 분명히 밝혔습니다. 스데반의 연대기적 진술은 조화시키거나 변경하지 않았습니다.
