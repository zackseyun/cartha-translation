  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
  footnotes:
  - marker: a
    text: 'Or more idiomatically, ''his descendants would be foreigners in a strange land, and they would enslave them and mistreat them for four hundred years.'' The Greek uses a collective singular: ''offspring ... it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 이렇게 말씀하셨습니다. “그의 후손이 낯선 땅[a]에서 나그네가 될 것이며, 사람들이 그 후손을 종으로 삼고 사백 년 동안 학대할 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게, “그의 후손이 외국 땅에서 외국인으로 살게 될 것이며, 사람들이 그들을 종으로 삼고 사백 년 동안 학대할 것이다.” 그리스어는 ‘후손’과 그것을 받는 대명사를 집합적 단수로 사용합니다.
    reason: πάροικον과 ἐν γῇ ἀλλοτρίᾳ의 자연스러운 대안을 제시하고, σπέρμα 및 αὐτό의 집합적 단수를 설명합니다.
