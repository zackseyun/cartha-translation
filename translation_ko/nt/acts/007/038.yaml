    rationale: 이 구절은 ‘살아 있는 말씀/신탁’을 말하지만, 그것을 토라로 특정하는 것은 번역 본문이 직접 표현하지 않은 해석을 덧붙입니다.
  - severity: low
    issue: ‘전하여 줄’이 δοῦναι의 기본 의미보다 좁고 해석적입니다.
    rationale: δοῦναι는 ‘주다’이며, 모세가 말씀을 백성에게 주도록 받았다는 목적을 직접 드러내는 ‘주려고’가 더 충실합니다.
