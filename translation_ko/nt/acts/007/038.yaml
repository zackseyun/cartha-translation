  terminology: ἐκκλησία는 ‘회중’, ἀγγελος는 ‘천사’, λόγια ζῶντα는 ‘살아 있는 말씀’으로 옮길 수 있습니다. ‘살아 있는 말씀’은 원문의 수식 관계와 의미의 여지를 보존합니다.
  issues:
