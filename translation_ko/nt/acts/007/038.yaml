  source_fidelity: ‘전하여 줄’은 δοῦναι(‘주다’)보다 전달 행위를 더 강하게 암시하므로 ‘주려고’로 바로잡는 것이 좋습니다. 현 각주의 ‘시내산에서 받은 토라’라는 한정은 λόγια ζῶντα 자체가 명시하지 않는 해석입니다.
