  source_fidelity: 개정이 필요합니다. 원문의 διὰ χειρὸς αὐτοῦ는 하나님이 모세를 도구로 삼아 구원을 이루신다는 뜻인데, 초안의 “하나님께서 자기의 손을 통하여”는 가까운 주어인 하나님 자신의 손으로 오해될 수 있습니다. 또한 현재 부정사 συνιέναι와 뒤의 συνῆκαν의 반복은 ‘이해하다’로 일관되게 살리는 것이 적절합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체도 적절합니다. 다만 “깨달을 것이라 생각하였으나”는 형제들이 미래에 깨닫게 될 것이라는 의미로 읽힐 수 있어, 모세가 그들이 이미 이해하고 있다고 여겼다는 원문과 다소 어긋납니다. “이해하고 있다고 생각하였으나”가 더 정확하고 자연스럽습니다.
  terminology: σωτηρίαν은 이집트에서의 이스라엘 해방이라는 직접 문맥상 ‘구원’ 또는 ‘구출/해방’이 가능합니다. 본문에서는 전통적이고 폭넓은 ‘구원’을 유지하되, 각주에서 이 문맥의 구체적 의미가 ‘구출, 해방’임을 밝혀 과도하게 영적인 의미로 좁혀 읽지 않도록 합니다. ἀδελφοί는 ‘형제들’로 옮기되, 모세의 동족 이스라엘 사람들을 가리킨다는 각주를 둡니다.
