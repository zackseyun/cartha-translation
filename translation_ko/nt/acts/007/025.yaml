  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: Now he supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
  footnotes:
  - marker: a
    text: Or 'salvation.' The Greek term can denote rescue, deliverance, or salvation; here the immediate context points to God's deliverance of Israel through Moses.
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' refers to Moses'' fellow Israelites; the term is masculine plural kinship language in Greek.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 자기 형제들이 하나님께서 모세의 손을 통하여 그들에게 구원을 베푸신다는 것을 이해하고 있다고 생각하였으나, 그들은 이해하지 못하였습니다.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출’, ‘해방’. 그리스어는 구원, 구출, 해방을 뜻할 수 있습니다. 여기서는 하나님께서 모세를 통하여 이스라엘을 구출하시는 직접 문맥을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 모세의 동족 이스라엘 사람들을 가리킵니다. 그리스어는 남성 복수 친족 표현입니다.
    reason: cultural_note
