revisions:
- from: 그가 어떤 사람이 부당하게 당하는 것을 보고, 그를 도와서 이집트 사람을 쳐 죽임으로써 학대받는 사람을 위해 보복하였습니다.
  to: 그가 어떤 사람이 부당한 일을 당하는 것을 보고, 그를 도우며 이집트 사람을 침으로써 학대받는 그 사람의 원수를 갚아 주었습니다.
  rationale: The revision improves idiomatic Korean, preserves the source's indefinite referent and beneficiary relationship, and changes “쳐 죽임” to “침” so that the translation does not state more than the Greek verb. “원수를 갚아 주었습니다” retains the contextual force of ἐποίησεν ἐκδίκησιν while remaining natural in modern formal-polite Korean.
