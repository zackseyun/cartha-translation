  to: 이튿날 그가 다투고 있는 그들에게 나타나, 그들을 평화롭게 화해시키려 하시며 말씀하셨습니다. “여러분, 여러분은 형제입니다. 왜 서로 부당하게 대하십니까?”
  rationale: The revision corrects the central source-language error in ὤφθη, preserves the circumstantial force of μαχομένοις ('while they were fighting'), renders the imperfect συνήλλασσεν as an attempted action, and retains the stated aim of peace. No footnote is needed because the Korean wording communicates these features without unresolved ambiguity.
