  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
  footnotes:
  - marker: a
    text: Or 'to worship the host of heaven.' The Greek verb can denote religious service or worship.
    reason: lexical_alternative
  - marker: b
    text: '''The host of heaven'' is a biblical expression for the heavenly bodies, and by extension the celestial powers associated with them in idolatrous worship.'
    reason: cultural_note
  - marker: c
    text: Quoted from Amos 5:25.
    reason: cross_reference
  - marker: d
    text: Or 'in the scroll of the prophets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서는 돌아서셔서 그들을 하늘의 만상을[a] 섬기도록 넘겨주셨습니다. 이는 예언자들의 책[d]에 기록된 대로입니다. “이스라엘 집이여, 너희가 사십 년 동안 광야에서 짐승 제물과 희생 제물을 내게 바친 적이 있느냐?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 군대를’. ‘하늘의 만상’은 천체를 가리키는 성경적 표현이며, 여기서는 우상숭배의 대상이 된 천체 또는 그와 연관된 천상 권세를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 암 5:25을 인용함.
    reason: cross_reference
  - marker: d
    text: 또는 ‘예언자들의 두루마리’ 또는 ‘예언자들의 책’.
    reason: lexical_alternative
