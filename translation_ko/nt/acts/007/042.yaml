  source_fidelity: 개정이 필요합니다. 초안의 ‘하늘의 별들’은 τῇ στρατιᾷ τοῦ οὐρανοῦ(‘하늘의 만상/천체의 무리’)를 별들로 한정합니다. 또한 ἐν βίβλῳ τῶν προφητῶν은 복수인 ‘예언자들의 책’이며, παρέδωκεν의 심판적 ‘넘겨주다’의 뉘앙스를 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: 합쇼체 문체는 대체로 적절하나, ‘그들이 … 섬기도록 그들을 내버려 두셨습니다’는 목적어 반복으로 다소 무겁습니다. ‘섬기도록 넘겨주셨습니다’가 자연스럽고 간결합니다. 인용문의 닫는 인용부호도 필요합니다.
  terminology: ‘하늘의 만상’은 한국어 성경 문체에서도 통용되며, 천체와 그와 연관된 숭배 대상을 불필요하게 특정하지 않습니다. σφάγια와 θυσίας의 병렬은 ‘짐승 제물과 희생 제물’로 보존합니다.
  issues:
