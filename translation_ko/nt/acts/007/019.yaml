id: ACT.7.19
reference: Acts 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
  footnotes:
  - marker: a
    text: Or 'having dealt craftily with our people.' The Greek participle emphasizes cunning or deceptive treatment.
    reason: lexical_alternative
  - marker: b
    text: That is, to abandon their babies by exposure, a practice intended to leave them to die.
    reason: cultural_note
  - marker: c
    text: Or 'our ancestors' for 'our fathers.' The Greek uses the traditional familial term for Israel's forefathers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 우리 민족을 교활하게 다루고 우리 조상들을 학대하여, 그들이 자기들의 갓난아기들을 버려 두어[a] 살려 두지 못하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘갓난아기들을 내버려 두어’입니다. 이는 아기들을 밖에 버려 생존하지 못하게 하는 당시의 유기 관행을 가리킵니다.
    reason: cultural_note
