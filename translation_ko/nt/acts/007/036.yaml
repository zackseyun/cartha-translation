    issue: ‘인도하여 나오게 하였고’의 사역 표현
    rationale: ἐξήγαγεν은 모세가 ‘그들을 이끌어 냈다/데리고 나왔다’는 능동 동사입니다. 현 번역은 ‘나오게 하였다’라고 하여 원문의 직접 행위를 약화하고 한국어로도 다소 어색합니다.
  - severity: low
    issue: ‘기이한 일과 표적’의 용어 선택
    rationale: 뜻은 통하지만, τέρατα καὶ σημεῖα에 대응하는 성경적이고 정형화된 표현 ‘기사와 표적’이 용어 일관성과 문체 면에서 더 낫습니다.
  - severity: low
    issue: 홍해 명칭의 대안 각주 누락
    rationale: 본문은 헬라어를 따라 ‘홍해’로 번역하되, 영어 감사 기록에 보존된 ‘갈대 바다’ 대안과 헬라어 명칭에 관한 정보를 각주로 유지하는 것이 적절합니다.
