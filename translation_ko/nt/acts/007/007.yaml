review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그러나’는 원문의 접속사 καί(‘그리고/또’)와 맞지 않아 대조를 부가합니다. 또한 λατρεύω는 하나님께 드리는 종교적 섬김을 가리키므로 ‘예배하다’가 문맥상 더 분명합니다. 나머지 미래 시제와 ‘이곳’ 지시는 잘 보존됩니다.
  naturalness: ‘그들이 종 노릇 할’은 띄어쓰기와 표현 면에서 ‘종으로 섬기게 될’이 더 자연스럽고 현대 표준어에 맞습니다. 인용문과 서술문의 연결도 자연스럽게 다듬었습니다.
  terminology: ἔθνος는 이집트의 지배 집단을 가리키므로 ‘민족’으로, δουλεύω는 본문의 강제 예속 맥락을 드러내어 ‘종으로 섬기다’로 옮겼습니다. λατρεύω는 일반 노동이 아니라 하나님께 드리는 예배/성스러운 섬김이므로 ‘예배하다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘그러나’가 καί를 대조 접속사로 과도하게 해석함
    rationale: 원문은 앞 절의 인용을 이어 주는 καί이며, 여기에는 ‘그러나’가 요구하는 대조가 나타나지 않습니다.
  - severity: low
    issue: ‘종 노릇 할’의 띄어쓰기와 표현
    rationale: ‘종 노릇하다’는 붙여 쓰며, 원문의 미래 관계절은 ‘종으로 섬기게 될’로 표현하면 더 자연스럽고 의미가 분명합니다.
  - severity: medium
    issue: λατρεύω를 ‘섬기다’로 번역하여 종교적 의미가 약화될 수 있음
    rationale: 이 동사는 하나님을 목적어로 할 때 예배 또는 성스러운 봉사를 뜻합니다. ‘예배하다’가 현대 한국어에서 그 의미를 더 정확히 전달합니다.
  revised_text: “또 그들이 종으로 섬기게 될 그 민족을 내가 심판하겠다.” 하나님께서 말씀하셨습니다. “그 후에 그들이 나와서 이곳에서 나를 예배할 것이다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들이 섬기게 될 그 민족’. 그리스어 동사는 기본적으로 ‘섬기다’를 뜻하지만, 문맥은 이집트에서의 강제 예속을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 섬길 것이다’. 그리스어 동사는 하나님께 드리는 예배 또는 성스러운 봉사를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 대조 의미를 제거하고 원문의 순차적 연결을 ‘또’로 반영했습니다. 강제 노역의 문맥과 종교적 예배의 의미를 본문 및 각주에서 구별해 보존했으며, 원문의 미래 표현과 ‘이곳’이라는 지시를 유지했습니다.
