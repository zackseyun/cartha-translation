review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains divine judgment, Israel's forced service, departure, and service to God. However, initial '그러나' has no basis in καί, '그 일 후' weakens the plural μετὰ ταῦτα, and '섬기다' for λατρεύω does not clearly convey its religious-service sense in this context.
  naturalness: The wording is generally understandable, but placing the attribution between two separately quoted clauses is less natural in modern Korean. A single quotation introduced by '하나님께서 말씀하셨습니다' reads smoothly in formal-polite Korean.
  terminology: '''종으로 섬기다'' preserves the verbal form δουλεύω while making the bondage sense explicit. ''예배하다'' appropriately renders λατρεύω as religious worship/service. ''나라'' is a natural contextual rendering of ἔθνος here.'
  issues:
  - severity: medium
    issue: '''그러나'' renders the opening conjunction.'
    rationale: The Greek begins with καί ('and'), not an adversative conjunction. The contrastive '그러나' should be removed.
  - severity: low
    issue: '''그 일 후에는'' singularizes μετὰ ταῦτα.'
    rationale: The Greek plural expression means 'after these things'; '그 뒤에' preserves the sequence without unnecessary singularization.
  - severity: medium
    issue: '''나를 섬길 것이다'' underrepresents λατρεύσουσίν μοι.'
    rationale: λατρεύω denotes worship or sacred service directed to God. '나를 예배할 것이다' communicates this religious sense in current Korean; the alternative may be noted.
  revised_text: 하나님께서 말씀하셨습니다. “그들이 종으로 섬길[a] 그 나라를 내가 심판하겠다. 그 뒤에 그들은 나와서 이곳에서 나를 예배할[b] 것이다.”
  revised_footnotes:
  - marker: a
    text: 또는 “그들이 종살이할 그 나라를.” 그리스어는 ‘섬기다’라는 동사를 사용하지만, 문맥은 이집트에서의 강제 노역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나를 섬길 것이다.” 그리스어 동사는 하나님께 드리는 종교적 섬김 또는 예배를 뜻할 수 있습니다.
    reason: lexical_alternative
