  text: 하나님께서 말씀하셨습니다. “그들이 종으로 섬길[a] 그 나라를 내가 심판하겠다. 그 뒤에 그들은 나와서 이곳에서 나를 예배할[b] 것이다.”
  philosophy: optimal-equivalence
  footnotes:
