- from: 그가 우리에게 와서 바울의 띠를 가져다가 자기 발과 손을 묶고 말하기를, 「성령께서 이같이 말씀하십니다. 이 띠의 주인을 예루살렘에서 유대인들이 이와 같이 묶어 이방인들의 손에 넘겨줄 것이다」 하였습니다.
  to: 그는 우리에게 와서 바울의 띠를 집어 들고 자기 발과 손을 묶은 뒤 말했습니다. “성령께서 이렇게 말씀하십니다. ‘이 띠의 주인을 예루살렘에서 유대인들이 이와 같이 묶어 이방인들의 손에 넘겨줄 것입니다.’”
  rationale: 원문의 순서(다가옴―띠를 집어 듦―자기 발과 손을 묶음―발화)를 유지하면서, ἑαυτοῦ의 재귀 의미를 ‘자기’로 명시했습니다. 예언적 발화 공식은 ‘성령께서 이렇게 말씀하십니다’로, οὕτως는 ‘이와 같이’로 보존했습니다. 추가 해석이나 교리적 한정은 도입하지 않았습니다.
