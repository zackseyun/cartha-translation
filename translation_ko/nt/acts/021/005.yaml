  source_fidelity: ‘그 날들이 다 끝나자’는 체류 기간을 ‘우리가 마치다’라는 원문의 구문보다 날들 자체가 끝나는 것으로 옮겨 행위 주체를 약화합니다. 또한 ‘모든 사람이 그들의 아내와 자녀들과 함께’는 소유·지시 관계가 부자연스럽습니다. 개정문은 정해진 체류 기간을 우리가 마친다는 뜻, 도시 밖까지의 배웅, 그리고 여행 일행인 ‘우리’의 무릎 꿇음과 기도를 보존합니다.
  naturalness: 합쇼체 서술을 유지하되, ‘그들의 아내’ 대신 한국어에서 자연스러운 ‘아내와 자녀들을 데리고’를 사용합니다. ‘도시 밖까지 배웅해 주었습니다’는 προπέμπω의 작별 동반 의미를 자연스럽게 전달합니다.
  terminology: ‘정해진 날들’은 τὰς ἡμέρας가 가리키는 체류의 정해진 기간을 드러내며, ‘해변’은 αἰγιαλός의 무표적이고 현대적인 번역입니다. 신학적으로 해석을 덧붙이지 않았습니다.
