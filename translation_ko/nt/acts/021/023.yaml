  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
  footnotes:
  - marker: a
    text: Or 'who have taken a vow.' The Greek literally says 'having a vow.'
    reason: lexical_alternative
  - marker: b
    text: The wider context may suggest a Nazirite-type vow, but the verse itself states only 'a vow.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 우리가 당신에게 말하는 대로 하시오. 우리 가운데에는 자신들이 한 서원을 지닌 사람이 네 명 있습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “서원을 가지고 있는.” 그리스어는 문자적으로 “서원을 지닌”이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 넓은 문맥은 나실인과 같은 유형의 서원을 시사할 수 있으나, 이 절 자체는 단지 “서원”이라고만 말합니다.
    reason: cultural_note
