- from: 그들이 그를 죽이려고 할 때에, 온 예루살렘이 소요 가운데 있다는 보고가 그 군대의 천부장에게 올라갔습니다.
  to: 그들이 그를 죽이려고 하는 동안, 온 예루살렘이 혼란에 빠지고 있다는 보고가 그 부대의 천부장[a]에게 올라갔습니다.[b]
  rationale: 현재분사 ζητούντων의 지속성을 ‘죽이려고 하는 동안’으로 반영하고, συγχύννεται의 혼란·소요의 뜻을 자연스러운 현대 한국어로 옮겼습니다. ‘보고가 …에게 올라갔습니다’는 ἀνέβη φάσις의 이동 이미지를 유지합니다.
