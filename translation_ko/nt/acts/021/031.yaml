  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
  footnotes:
  - marker: a
    text: Or 'was in confusion' or 'was in turmoil.'
    reason: lexical_alternative
  - marker: b
    text: '''Commander of the cohort'' refers to a Roman military officer (a tribune) in charge of the cohort stationed there.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 그를 죽이려고 하는 동안, 온 예루살렘이 혼란에 빠지고 있다는 보고가 그 부대의 천부장[a]에게 올라갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천부장’은 로마 군대의 한 부대를 지휘하던 장교(트리부누스)를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘온 예루살렘이 소란에 빠지고 있다.’
    reason: lexical_alternative
