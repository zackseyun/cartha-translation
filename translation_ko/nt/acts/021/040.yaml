  source_fidelity: 초안은 바울이 층계에 서서 손짓한 것과 뒤이은 정적, 히브리 말로 발화한 핵심 흐름을 대체로 반영합니다. 그러나 λέγων이 다음 절의 직접 화법을 도입하는 기능이 번역문에서 빠졌으므로, 문장 끝에 콜론을 두어 보완해야 합니다.
  naturalness: ‘큰 침묵이 임하였습니다’보다 ‘큰 정적이 일어나자’가 현대 표준 한국어에서 자연스럽고, 사건의 발생을 나타내는 γενομένης에도 잘 맞습니다. ‘히브리 말’은 자연스럽지만 ‘히브리어’가 문어적 공적 발화 문맥에서 더 매끄럽습니다.
  terminology: Ἑβραΐδι διαλέκτῳ의 표면적 표현은 ‘히브리어’로 유지하고, 당시 문맥상 아람어를 가리킬 수 있다는 가능성은 각주로 처리합니다. 본문에서 이를 단정적으로 ‘아람어’로 바꾸지 않습니다.
  issues:
  - severity: medium
    issue: 다음 절의 직접 화법을 도입하는 ‘λέγων’이 누락되었습니다.
    rationale: 원문은 ‘말하면서/이렇게 말하였다’로 이어져 다음 절의 발언을 도입합니다. 한국어에서는 콜론을 포함한 ‘이렇게 말하였습니다:’가 이 기능을 충실히 재현합니다.
  - severity: low
    issue: ‘큰 침묵이 임하였습니다’는 다소 부자연스럽습니다.
    rationale: σιγῆς γενομένης는 정적이 생긴 상황을 가리키므로 ‘큰 정적이 일어나자’가 자연스럽고 의미를 보존합니다.
  revised_text: '그가 허락하자, 바울은 층계에 서서 백성에게 손짓하였습니다. 큰 정적이 일어나자, 바울은 히브리어로 그들에게 이렇게 말하였습니다:'
  revised_footnotes:
  - marker: a
    text: 또는 ‘아람어’. 그리스어는 문자적으로 ‘히브리 방언/언어’라고 말합니다. 이 문맥에서는 흔히 아람어라고 불리는 당시의 현지 셈어를 가리킬 수 있습니다.
    reason: ‘히브리어’라는 본문의 표현을 유지하면서, 해당 표현이 아람어를 뜻할 가능성이 있다는 어휘·역사적 대안을 제시합니다.
  revision_rationale: 원문의 두 개의 속격 절대구문, 바울의 손짓, 정적의 발생, 히브리 말로 청중에게 말한 행위, 그리고 다음 절 발언을 도입하는 분사 표현을 모두 보존하도록 문장을 다듬었습니다. ‘히브리어’에는 논쟁적 언어 지시 대상을 본문에서 확정하지 않도록 각주를 붙였습니다.
