  source_fidelity: 초안은 허락, 바울의 층계 위 অবস্থ, 손짓, 정적, 히브리 말이라는 주요 요소를 대체로 담고 있습니다. 그러나 προσεφώνησεν ... λέγων이 다음 절의 직접 발화를 도입하는 기능이므로, 문장 끝에 발화 도입 표지가 필요합니다. 또한 πολλῆς σιγῆς γενομένης는 손짓의 결과로 단정하기보다 뒤이어 큰 정적이 생긴 사건으로 표현하는 편이 정확합니다.
