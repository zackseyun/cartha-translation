  text: '그가 허락하자, 바울은 층계 위에 서서 백성에게 손짓하였습니다. 큰 정적이 생기자, 그는 히브리 말[a]로 그들에게 다음과 같이 말하였습니다:'
  philosophy: optimal-equivalence
