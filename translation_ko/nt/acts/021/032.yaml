  source_fidelity: 핵심 의미는 원문에 충실합니다. ἐξαυτῆς의 즉각성, 군인들과 백부장들을 데리고 내려간 행동, 그리고 바울을 때리던 일을 멈춘 사실이 모두 반영되어 있습니다. 다만 원문의 οἱ δέ가 가리키는 무리를 한국어에서 분명히 밝혀 주는 것이 문맥상 안전합니다.
