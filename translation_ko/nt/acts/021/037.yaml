    reason: cultural_note
  - marker: c
    text: “Barracks” refers to the Roman military quarters, likely within the fortress complex.
    reason: cultural_note
translation:
  language: ko
  text: 바울이 병영 안으로 이끌려 들어가려 할 때, 천부장에게 “제가 천부장님께 말씀드려도 되겠습니까?” 하고 말하였습니다. 그러자 그가 “헬라어를 아십니까?”라고 말하였습니다.
  philosophy: optimal-equivalence
