  source_fidelity: 수정 전 본문의 ‘바울이 진영으로 들어가려 할 때’는 εἰσάγεσθαι의 수동태를 충분히 나타내지 못합니다. 바울이 병영으로 이끌려 들어가려는 순간이라는 뜻을 밝혀야 합니다. παρεμβολή는 이 문맥에서 ‘병영’으로, χιλίαρχος는 통용 성경 용어인 ‘천부장’으로 옮길 수 있습니다. Ἑλληνιστί는 ‘헬라어를’로 자연스럽게 반영됩니다.
  naturalness: 합쇼체 서술과 대화로 정리하고, 낯선 사이의 ‘당신’ 반복은 피했습니다. ‘천부장님께’는 바울이 천부장에게 직접 말한다는 πρὸς σέ를 자연스러운 한국어 존칭으로 드러냅니다.
  terminology: ‘바울’, ‘천부장’, ‘헬라어’는 한국어 성경 문맥에서 널리 이해되는 용어입니다. ‘병영’은 로마 군사 주둔 시설이라는 문맥에 적합하며, 특정 요새 명칭을 본문에 덧붙이지 않습니다.
  issues:
