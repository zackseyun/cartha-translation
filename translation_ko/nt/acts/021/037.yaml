  source_fidelity: 원문의 수동적 임박 표현(μέλλων ... εἰσάγεσθαι)을 살려 바울이 병영 안으로 ‘끌려 들어가려’ 했음을 반영했습니다. παρεμβολή는 이 문맥에서 ‘병영’으로, χιλίαρχος는 역사적 군사 직함인 ‘천부장’으로 옮겼습니다. ‘그리스어를 아십니까?’는 Ἑλληνιστὶ γινώσκεις를 자연스럽고 충실하게 반영합니다.
