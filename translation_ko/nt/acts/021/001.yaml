  source_fidelity: The draft accurately preserves the itinerary and the sequence of destinations, but "직행하여" is not a natural Korean rendering of the nautical participle εὐθυδρομήσαντες; it should explicitly express sailing a direct course. The separation expression can also be made more natural while retaining the sense of departing from the Ephesian believers.
  naturalness: '"직행하여" is chiefly used for a direct bus/train or a non-stop service and is awkward with an implied ship voyage. "곧장 항해하여" is idiomatic modern Korean. "배를 타고 떠난" is understandable, but "배를 띄운" better renders the nautical ἀναχθῆναι.'
  terminology: 고스, 로도, and 바다라 are established Korean biblical forms. A footnote supplies the modern geographic form "코스," corresponding to the English audit trail's Cos/Kos alternative.
