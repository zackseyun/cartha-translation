  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
  footnotes:
  - marker: a
    text: Or 'came in sight of Cyprus.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'leaving it on the left'; that is, Cyprus remained on the ship's left side as they sailed.
    reason: cultural_note
  - marker: c
    text: Or 'arrived at Tyre.' The Greek more literally says 'came down to Tyre.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the ship was being unloaded' or 'was discharging its cargo.'
    reason: lexical_alternative
translation:
  language: ko
  text: 키프로스가 보이자 그것을 왼편에 두고 시리아로 항해하여 두로에 내려갔습니다[a]. 그곳에서 그 배가 화물을 내리고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두로에 이르렀습니다.’ 그리스어는 문자적으로 ‘두로에 내려갔습니다’라고 말합니다.
    reason: lexical_alternative
