  text: 믿게 된 이방인들에 대해서는, 우리는 그들이 우상에게 바친 음식과 피와 목 졸라 죽인 짐승의 고기와 성적 부도덕을 삼가도록 결정하여 편지를 보냈습니다.”
  philosophy: optimal-equivalence
