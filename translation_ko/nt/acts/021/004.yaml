  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 미완료 과거 ἔλεγον의 반복·지속 뉘앙스가 일반적인 과거형 「말하였습니다」에는 충분히 드러나지 않습니다. 또한 διὰ τοῦ πνεύματος는 본문 자체가 성령의 직접 명령인지, 성령께서 알리신 일을 근거로 한 제자들의 권면인지를 명시적으로 판정하지 않으므로 이를 번역과 주석에서 열어 두어야 합니다.
  naturalness: 「말라고 말하였습니다」는 문법적으로 가능하지만 다소 반복적입니다. 「말라고 거듭 말하였습니다」가 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 미완료 과거도 반영합니다. 「일곱 날 동안」은 기간을 분명히 합니다.
  terminology: 「제자들」, 「성령」, 「바울」, 「예루살렘」은 적절합니다. 「성령을 통하여」는 원문의 수단·매개 표현을 보존하는 격식 있는 표현입니다. 단, 제공된 신학적 결정의 ‘인간적 만류’ 단정은 본문의 문법만으로 확정할 수 없으므로 번역의 의미로 고정해서는 안 됩니다.
