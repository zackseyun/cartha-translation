source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
  footnotes:
  - marker: a
    text: Or 'leading us to Mnason … with whom we might lodge' or 'taking us to the house of Mnason.' The Greek participle and lodging verb can be understood in slightly different but closely related ways.
    reason: lexical_alternative
  - marker: b
    text: Or 'a longtime disciple.' The phrase may mean that Mnason had been a disciple for a long time, possibly from the early days of the movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 가이사랴에서 온 제자들 가운데 몇몇도 우리와 함께 가면서, 우리를 우리가 묵을[a] 나손이라는 키프로스 사람, 오래전부터 제자였던 사람[b]에게 데리고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나손의 집으로 데리고 갔다.’ 그리스어의 분사와 ‘묵다’라는 동사는 서로 밀접하지만 약간 다르게 연결하여 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘초기부터 제자였던 사람’ 또는 ‘오랜 제자.’ 이 표현은 나손이 오랫동안 제자였음을 뜻할 수 있으며, 운동의 초기부터 제자였음을 뜻할 가능성도 있습니다.
    reason: lexical_alternative
