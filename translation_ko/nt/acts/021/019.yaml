    issue: ‘자기의 직무’
    rationale: διὰ τῆς διακονίας αὐτοῦ는 바울의 사도적 섬김/사역을 뜻합니다. ‘직무’는 공식 직책 또는 의무의 뜻으로 읽히기 쉬워 문맥상 ‘사역’이 더 정확합니다.
  - severity: low
    issue: 수식 관계의 명료성
