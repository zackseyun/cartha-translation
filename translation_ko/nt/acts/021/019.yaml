  source_fidelity: 문안한 뒤 바울이 자신의 사역을 통하여 하나님께서 이방인들 가운데서 행하신 일을 항목별로 자세히 설명·보고했다는 기본 뜻은 반영합니다. 그러나 ‘직무’는 διακονία의 문맥상 의미인 사도적 ‘사역’보다 협소하고, 현 문장에서는 ‘자기의 직무를 통하여’가 ‘하나님께서’에 바로 이어져 수식 관계가 다소 무겁습니다.
  naturalness: ‘문안한 후에’와 ‘보고하였습니다’는 자연스럽지만, ‘사역을 통하여’와 ‘하나님께서 … 하신 일들’을 인접시켜 주면 현대 표준어 합쇼체에서 더 명료하고 매끄럽습니다. ‘하나하나 자세히’는 καθ’ ἓν ἕκαστον 및 ἐξηγεῖτο의 상세한 보고의 뉘앙스를 자연스럽게 드러냅니다.
  terminology: διακονία는 여기서 일반적인 의무나 직책인 ‘직무’보다 바울의 선교적 섬김을 가리키므로 ‘사역’이 적절합니다. ἔθνη는 문맥상 ‘이방인들’이 적절하며, 하나님의 행위를 ‘하신 일들’로 표현하여 신적 행위 주체를 분명히 합니다.
  issues:
