- from: 온 도시가 소동하여 사람들이 떼를 지어 모여들었습니다. 그들이 바울을 붙잡아 성전 밖으로 끌고 나갔고, 곧 문들이 닫혔습니다.
  to: 온 도시가 소동에 휩싸이고 사람들이 한데 몰려들었습니다. 사람들이 바울을 붙잡아 성전[a] 밖으로 끌고 나갔고, 곧 문들[b]이 닫혔습니다.
  rationale: 군중의 단일하고 급작스러운 집결이라는 συνδρομή의 의미를 더 정확히 반영하고, ἱερόν 및 θύραι의 문맥상 의미 범위를 주석으로 보완했습니다. 그 밖의 사건 전개와 절의 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T10:06:55Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 사건 순서와 의미는 대체로 충실합니다. 다만 ‘사람들이 떼를 지어 모여들었습니다’는 여러 무리가 각각 모였다는 인상을 줄 수 있어, συνδρομή가 나타내는 갑작스럽고 집단적인 집결을 ‘한데 몰려들었습니다’로 옮기는 편이 더 정확합니다. ἱερόν은 성소 건물 내부만이 아니라 성전 경내를 가리키므로 주석으로 그 범위를 밝혔습니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. ‘온 도시가 소동에 휩싸이고’와 ‘사람들이 한데 몰려들었습니다’는 현대 표준어에서 자연스러우면서도 원문의 공적 소요와 군중의 집결을 잘 드러냅니다. 두 번째 절의 주어를 ‘사람들이’로 명시해 지시 대상도 분명히 했습니다.
  terminology: ‘바울’, ‘성전’, ‘문들’은 적절합니다. ‘성전’은 본문에서 간결하게 유지하되, ἱερόν의 ‘성전 경내’ 의미를 주석으로 보완했습니다. θύραι는 문으로 번역하되 이 문맥에서 ‘문들/출입문’이 관문을 뜻할 가능성을 주석에 남겼습니다.
  issues:
  - severity: medium
    issue: ‘떼를 지어 모여들었습니다’의 의미 범위
    rationale: συνδρομὴ τοῦ λαοῦ는 사람들이 한데로 급히 몰려드는 집결을 뜻합니다. ‘떼를 지어’는 여러 집단이 따로따로 이동하는 뉘앙스를 낼 수 있습니다.
  - severity: low
    issue: 성전의 공간 범위에 대한 주석 부재
    rationale: ἱερόν은 통상 성전 건물의 내부 성소에 한정되지 않고 성전 경내·구역을 가리킵니다. 본문의 ‘성전’은 유지할 수 있으나 독자의 오해를 막기 위한 주석이 유익합니다.
  revised_text: 온 도시가 소동에 휩싸이고 사람들이 한데 몰려들었습니다. 사람들이 바울을 붙잡아 성전[a] 밖으로 끌고 나갔고, 곧 문들[b]이 닫혔습니다.
