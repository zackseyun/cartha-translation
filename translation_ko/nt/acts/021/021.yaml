  source_fidelity: 초안은 핵심 내용을 대체로 반영하지만, κατηχήθησαν의 수동 보고 의미와 ‘당신이 가르친다는’ 고발의 구조를 더 분명히 해야 합니다. 또한 ‘자녀에게 할례를 행하지 말고’는 누가 할례를 행하는지 다소 불분명하므로 ‘자기 자녀에게’로 밝혀야 합니다.
  naturalness: ‘그들이 당신에 관하여 들은 것은’보다 ‘그들은 당신에 관하여 들었습니다. 곧 …’이 현대 한국어 합쇼체에서 자연스럽고 문장 구조가 명료합니다. ‘관습을 따라 살다’는 περιπατεῖν의 비유적 용법을 자연스럽게 살립니다.
  terminology: ‘모세를 저버리다’는 ἀποστασίαν ἀπὸ Μωϋσέως라는 आरोप의 강도를 유지하면서도, 본문이 그 고발을 사실로 단정하지 않게 합니다. ‘할례’, ‘관습’은 적절합니다. ‘모세’가 모세 율법 및 조상 전통을 가리키는 환유임을 주석으로 밝혔습니다.
