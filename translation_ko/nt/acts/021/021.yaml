revisions:
- from: 그들이 당신에 관하여 들은 것은, 이방 가운데 있는 모든 유대인에게 모세를 떠나라고 가르치며 자녀에게 할례를 행하지 말고 관습대로 살지도 말라고 한다는 것입니다.
  to: 그들은 당신에 관하여 들었습니다. 곧 당신이 이방인들 가운데 있는 모든 유대인에게 모세를 저버리라고[a][b] 가르치고, 자기 자녀에게 할례를 행하지 말며 관습을 따라 살지도 말라고[c] 한다는 것입니다.
  rationale: 수동적인 소문·보고의 의미를 ‘그들은 당신에 관하여 들었습니다’로 드러내고, 이어지는 내용이 바울에 대해 제기된 고발임을 ‘당신이 … 가르친다고’로 명료화했습니다. ‘모세를 저버리다’는 고발의 강도를 보존하며, 주석에서 직역적 대안과 ‘모세’의 환유를 제시했습니다. 모든 주석 표지는 해당 본문 표현에 연결했습니다.
