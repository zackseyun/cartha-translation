  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
  footnotes:
  - marker: a
    text: Or 'tribune.' The Greek χιλίαρχος refers to a Roman military officer, literally 'commander of a thousand.'
    reason: lexical_alternative
  - marker: b
    text: '''Two chains'' may echo the prophecy in Acts 21:11 about Paul being bound in Jerusalem.'
    reason: cross_reference
translation:
  language: ko
  text: 그때 군 지휘관[a]이 다가와 그를 붙잡고 두 사슬로 묶으라고 명령한 뒤, 그가 누구이며 무슨 일을 했는지 계속 물었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천부장’ 또는 ‘호민관’. 그리스어 χιλίαρχος는 문자적으로 ‘천 명의 지휘관’이라는 뜻이며, 여기서는 로마 군의 지휘관을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두 사슬’은 사도행전 21:11에서 예고된 결박을 떠올리게 할 수 있습니다.
    reason: cross_reference
