  to: 그때에 바울이 대답하여 말하였습니다. 「여러분은 왜 울면서 내 마음을 짓누르시는 것입니까? 나는 결박당할 뿐 아니라 주 예수의 이름을 위하여 예루살렘에서 죽을 준비도 되어 있습니다.」
