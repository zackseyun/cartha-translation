  verdict: revise
  source_fidelity: 원문의 ἁγνισθεὶς는 바울이 그들과 함께 정결 예식에 참여한 것을 뜻하는데, 초안의 ‘정결하게 한 후에’는 바울이 타인을 정결하게 했다는 사역 의미로 읽힐 수 있습니다. 또한 ‘정결 의식의 날들이 차서’는 ἐκπλήρωσις(기간의 완료)와 ἕως οὗ(…할 때까지/때)를 충분히 반영하지 못합니다.
  naturalness: ‘정결 예식을 행한 뒤’와 ‘정결 예식 기간이 끝나고 … 바쳐질 때’를 사용하면 현대 표준 한국어 합쇼체에서 자연스럽고, 절차적 문맥도 명확해집니다.
  terminology: ἱερόν은 내소(ναός)가 아닌 성전 단지/경내를 가리키므로 본문은 통상적인 ‘성전’으로 두고 각주로 보완했습니다. προσφορά는 의미를 과도하게 좁히지 않도록 ‘제물’로 옮겼으며, 대안인 ‘예물’도 각주에 제시했습니다.
