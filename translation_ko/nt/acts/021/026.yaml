source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
  footnotes:
  - marker: a
    text: Or 'the temple precincts'; the Greek ἱερόν refers to the temple complex, not specifically the inner sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'was offered' for 'was presented.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 바울은 그 사람들을 데리고, 이튿날 그들과 함께 정결 예식을 행한 뒤 성전[ㅏ]에 들어가서, 정결 예식 기간이 끝나고 그들 각 사람을 위하여 제물[ㅂ]이 바쳐질 때를 알렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㅏ
    text: 또는 ‘성전 경내’. 그리스어 히에론(ἱερόν)은 특히 성소 내부만이 아니라 성전 구역 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: ㅂ
    text: 또는 ‘예물’.
    reason: lexical_alternative
