review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἀναστατώσας는 이 문맥에서 단순한 ‘폭동’보다 정치적 소요·반란을 일으킨다는 뜻이며, ἐξαγαγών에는 강제로 ‘끌고’ 갔다는 뜻이 필수적이지 않고 ‘이끌고 나가다’가 더 직접적입니다.
  naturalness: 합쇼체 인용문과 서술은 자연스럽습니다. ‘그 이집트 사람’도 이해되지만, 정관사가 가리키는 익히 알려진 인물을 나타내는 ‘그 이집트인’이 더 간결하고 자연스럽습니다.
  terminology: σικαρίων을 ‘자객’으로 옮긴 것은 적절합니다. 다만 역사적 명칭 및 문자적 대안을 보존하는 각주가 필요합니다.
  issues:
  - severity: medium
    issue: ‘폭동을 일으키고’
    rationale: ἀναστατώσας는 이 역사·정치적 맥락에서 소요 또는 반란을 일으킨다는 뜻입니다. ‘반란을 일으키고’가 영어 감사 번역의 ‘stirred up a revolt’ 및 문맥을 더 잘 반영합니다.
  - severity: low
    issue: ‘광야로 끌고 나간’
    rationale: ἐξαγαγών은 ‘이끌고 나가다’이며, ‘끌고’는 원문에 없는 강제성을 다소 암시할 수 있습니다.
  - severity: medium
    issue: σικαρίων 관련 각주 누락
    rationale: ‘자객’은 적절한 본문 번역이지만, ‘시카리오이/Sicarii’라는 역사적 명칭과 ‘단검을 든 자들’이라는 대안을 각주로 보존해야 합니다.
  revised_text: 그렇다면 당신은 얼마 전에 반란을 일으키고 자객 사천 명을 광야로 이끌고 나간 그 이집트인이 아니요?[a]」 하고 말하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘단검을 든 자들’. 그리스어 ‘시카리오이’; 숨긴 단검으로 공격한 자들로 알려진 집단을 가리킵니다.
    reason: σικαρίων의 역사적 명칭과 문자적 번역 대안을 보존합니다.
  revision_rationale: 정치적 소요를 뜻하는 동사와 ‘이끌고 나가다’라는 참여형의 의미를 더 정확히 반영하고, 시카리오이에 관한 필요한 어휘·역사 각주를 추가했습니다. 의문문의 추론적 ‘그렇다면’, 수량, 광야, 그리고 합쇼체 문체는 유지했습니다.
