translation:
  language: ko
  text: 그렇다면 당신은 얼마 전에 반란을 일으키고 자객 사천 명을 광야로 이끌고 나간 그 이집트인이 아니요?[a]」 하고 말하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘단검을 든 자들’. 그리스어 ‘시카리오이’; 숨긴 단검으로 공격한 자들로 알려진 집단을 가리킵니다.
    reason: σικαρίων의 역사적 명칭과 문자적 번역 대안을 보존합니다.
