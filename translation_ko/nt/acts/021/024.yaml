  to: 이 사람들을 데리고 가서 그들과 함께 정결 예식을 행하고, 그들이 머리를 깎을 수 있도록 그들의 비용을 부담하십시오. 그러면 모든 사람이 당신에 관하여 들은 일이 사실이 아니라는 것과, 당신 자신도 율법을 지키며 살아가고 있다는 것을 알게 될 것입니다.
