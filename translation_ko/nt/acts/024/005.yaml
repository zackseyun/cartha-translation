  verdict: revise
  source_fidelity: 초안은 λοιμός의 비유적 모욕, στάσεις(소요), αἵρεσις(분파)를 대체로 반영합니다. 그러나 εὑρόντες를 단순히 ‘알게 되었습니다’로 옮긴 것은 고발자가 조사하여 결론을 내렸다는 표현을 약화하며, ‘나사렛 사람들의 분파’는 τῶν Ναζωραίων의 집단 명칭을 한국어에서 다소 부자연스럽고 불명확하게 만듭니다.
  naturalness: ‘온 천하의 모든 유대인 가운데’보다 ‘온 세상에 있는 모든 유대인들 사이에서’가 현대 표준 한국어에 더 자연스럽습니다. ‘나사렛파의 우두머리’는 고발 문맥과 현대 합쇼체에 맞습니다.
  terminology: αἵρεσις는 후대 교리적 의미의 ‘이단’이 아니라 ‘분파/당파’이므로, 집단명 ‘나사렛파’로 옮기는 것이 적절합니다. πρωτοστάτης는 단순 구성원이 아니라 ‘우두머리’로 반영했습니다. λοιμός의 비유적 비난은 ‘전염병 같은 자’로 보존했습니다.
  issues:
  - severity: medium
    issue: εὑρόντες의 표현
