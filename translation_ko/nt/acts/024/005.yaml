  - severity: low
    issue: ‘나사렛 사람들의 분파’의 자연스러움과 지시 대상
    rationale: 원문은 ‘나사렛 사람들’이라는 호칭으로 알려진 집단의 분파를 뜻합니다. 한국어에서는 ‘나사렛파’가 해당 집단명과 αἵρεσις의 의미를 더 자연스럽게 전달합니다.
  revised_text: 우리는 이 사람이 전염병 같은 자이며, 온 세상에 있는 모든 유대인들 사이에서 소요를 선동하고, 나사렛파의 우두머리임을 알아냈습니다.
