- from: 저희가 이 사람이 전염병 같은 자임을 알게 되었기 때문입니다. 그는 온 천하의 모든 유대인 가운데 소요를 일으키며, 나사렛 사람들의 분파의 두목입니다.
  to: 우리는 이 사람이 전염병 같은 자이며, 온 세상에 있는 모든 유대인들 사이에서 소요를 선동하고, 나사렛파의 우두머리임을 알아냈습니다.
