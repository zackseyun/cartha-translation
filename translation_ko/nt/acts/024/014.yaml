  source_fidelity: 원문의 ὁμολογῶ, ὅτι, κατὰ τὴν ὁδόν, αἵρεσιν, λατρεύω 및 율법과 예언서에 기록된 모든 것이라는 구조를 대체로 충실히 반영합니다. 다만 「길」을 ‘따라’라고 하면 물리적으로 길을 따라간다는 뜻도 될 수 있으므로, 여기서 소속·방식을 나타내는 κατά에는 ‘「길」에 따라’가 더 직접적입니다. 또한 λατρεύω는 일반적인 섬김보다 하나님께 드리는 예배·종교적 봉사를 가리키므로 ‘예배합니다’가 더 정확합니다.
  naturalness: 합쇼체의 문장으로 자연스럽습니다. ‘각하께’는 본문의 σοι 자체에는 없으나 펠릭스에게 하는 법정 진술이라는 직접 문맥에서 공손한 한국어 호칭으로 기능하며, 의미를 실질적으로 추가하지 않습니다. ‘이것을’은 원문의 τοῦτο를 ‘한 가지’보다 더 직접적으로 옮깁니다.
  terminology: 「길」은 사도행전에 나오는 초기 그리스도 운동의 명칭을 잘 보존합니다. αἵρεσις는 후대의 기술적 의미를 띠는 ‘이단’ 대신 ‘분파’로 옮기는 것이 적절합니다. τῷ πατρῴῳ θεῷ는 ‘우리 조상들의 하나님’으로 자연스럽게 표현될 수 있습니다.
  issues:
  - severity: low
    issue: ‘「길」을 따라’의 의미 범위
    rationale: κατά는 여기서 ‘그 길에 따라/그 길의 방식으로’라는 관계를 나타냅니다. ‘을 따라’도 가능하지만 이동의 이미지를 불러올 수 있어 ‘에 따라’가 더 명료합니다.
  - severity: medium
    issue: λατρεύω를 ‘섬기며’로 번역
    rationale: 문맥상 하나님께 드리는 종교적 섬김·예배를 뜻하므로, 일반 봉사의 뜻도 지닌 ‘섬기다’보다 ‘예배하다’가 원문의 의미를 더 분명히 보존합니다.
  revised_text: 그러나 저는 이것을 각하께 고백합니다. 곧 그들이 분파라고 부르는 「길」에 따라, 저는 우리 조상들의 하나님을 예배하며 율법과 예언서에 기록된 모든 것을 믿습니다.
  revised_footnotes: []
  revision_rationale: 관계·방식을 나타내는 κατά를 ‘「길」에 따라’로, 하나님께 드리는 종교적 봉사를 뜻하는 λατρεύω를 ‘예배하며’로 조정했습니다. 나머지 표현은 원문의 법정 진술 어조, ‘길’이라는 명칭, 유대 조상들의 하나님 및 율법과 예언서에 대한 연속성을 충실히 유지합니다.
