  verdict: revise
  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 τοῦτό를 ‘한 가지’로 옮기기보다 ‘이 사실’로 명시하는 편이 더 충실하며, πατρῴῳ는 본문에 없는 ‘우리’를 덧붙이지 않고 ‘조상들의’로 옮기는 것이 안전합니다. ‘분파’는 αἵρεσις의 당시 의미를 잘 살립니다.
  naturalness: 합쇼체와 문체는 자연스럽습니다. ‘각하께 이 사실을 인정합니다’와 ‘「길」을 따라’는 법정 장면의 격식과 현대 한국어의 자연스러움을 함께 유지합니다.
  terminology: 「길」은 사도행전의 초기 그리스도 운동 명칭을 잘 보존합니다. λατρεύω는 ‘섬기고’로 자연스럽게 옮길 수 있으며, ‘율법과 예언서’도 적절합니다. αἵρεσις 및 πατρῷος의 번역상 뉘앙스를 올바른 위치의 각주로 밝혔습니다.
  issues:
  - severity: low
    issue: ‘한 가지는’은 τοῦτό의 지시 내용을 다소 부정확하게 한정합니다.
    rationale: τοῦτο는 ‘한 가지’라는 수량적 표현이라기보다 바울이 이어서 밝히는 ‘이 사실’을 가리킵니다.
  - severity: low
    issue: ‘우리 조상들의 하나님’의 ‘우리’는 원문에 명시되어 있지 않습니다.
    rationale: πατρῷος는 ‘조상에게서 물려받은/조상들의’이라는 뜻입니다. 공동체적 함의는 문맥상 가능하지만, 한국어 본문에서는 이를 추가하지 않는 편이 원문에 더 가깝습니다.
  - severity: low
    issue: αἵρεσις와 πατρῷος의 설명 각주 및 해당 본문 앵커가 없습니다.
    rationale: ‘분파’는 ‘당파’도 가능한 표현이고, ‘조상들의 하나님’은 직역상 ‘조상에게서 물려받은 하나님’이라는 뜻을 지닙니다. 두 각주는 해당 어휘 바로 뒤에 배치되어야 합니다.
  revised_text: 그러나 저는 각하께 이 사실을 인정합니다. 곧 그들이 분파라고 부르는 「길」을 따라 저는 조상들의 하나님을 섬기고, 율법과 예언서에 기록된 모든 것을 믿습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘당파’. 그리스어 단어는 분파나 당파를 가리킬 수 있습니다. 여기서 후대의 전문 용어인 ‘이단’으로 이해하는 것은 적절하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘조상에게서 물려받은 하나님’ 또는 ‘조상의 하나님’. 이스라엘 조상들이 섬긴 하나님을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 'τοῦτό를 ‘이 사실’로 명료하게 옮기고, 원문에 명시되지 않은 ‘우리’를 제거했습니다. 또한 영어 감사 기록에서 다뤄진 αἵρεσις와 πατρῷος의 어휘상 선택을 한국어 각주로 보완했습니다. 각주 앵커는 본문에서 각각 ‘분파’와 ‘조상들의 하나님’ 뒤에 붙여야 합니다: ‘분파[a]’, ‘하나님[b]’.'
