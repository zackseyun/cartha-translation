  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
  footnotes:
  - marker: a
    text: Or 'improvements' or 'corrective measures' for 'reforms' (διορθωμάτων).
    reason: lexical_alternative
  - marker: b
    text: Or 'through your providence' or 'through your prudence' for 'through your foresight.' The Greek πρόνοια here refers to a ruler’s forethought or administration, not necessarily divine providence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 소환되자, 더둘로가 그를 고발을 시작하며 말했습니다. “각하를 통해 우리가 큰 평화를 누리고 있고, 각하의 선견지명으로 이 민족을 위한 개혁들[a]이 이루어지고 있으므로[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “개선들” 또는 “시정 조치들.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “각하의 선견지명으로.” 그리스어 πρόνοια는 여기서 신적인 섭리라기보다 통치자의 사려 깊은 행정이나 선견지명을 가리킵니다.
    reason: lexical_alternative
