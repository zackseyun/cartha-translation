    text: This verse (along with the end of verse 6 and the beginning of verse 8) is absent from the earliest Greek manuscripts (including the 3rd-century Papyrus 74 and the 4th-century Sinaiticus and Vaticanus) and early Coptic translations. It is preserved in the Byzantine majority tradition, the Latin tradition, and later Greek manuscripts. It reads as an early editorial expansion narrating the Roman commander's intervention before Felix.
