  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐγκόπτω는 이 법정 연설의 문맥에서 상대를 ‘지체시키다’기보다 그의 시간을 더 오래 붙들어 두거나 빼앗는다는 뜻입니다. 또한 τῇ σῇ ἐπιεικείᾳ는 단순한 일반적 ‘관용’보다 공정함·온유함·너그러움·관대한 처분을 아우르는 아첨성 법정 호소입니다.
  naturalness: ‘각하를 더 이상 지체시켜 드리지 않으려’는 높임 표현과 결합할 때 다소 부자연스럽고, 화자가 총독의 시간을 더 차지하지 않겠다는 뜻이 선명하지 않습니다. ‘더 오래 붙들어 두지 않으려고’가 현대 한국어의 정중한 법정·공적 발화에 더 자연스럽습니다.
  terminology: ‘각하’는 앞 절들에서 총독에게 하는 직접 호칭을 이어 주는 적절한 공적 경칭입니다. ‘너그러우심’은 ἐπιείκεια의 범위를 무리 없이 반영하며, 각주에서 공정함·온유함·관대한 처분의 가능한 뉘앙스를 밝혀 두는 것이 좋습니다.
