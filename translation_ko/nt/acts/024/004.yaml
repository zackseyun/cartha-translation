- from: 그러나 각하를 더 이상 지체시켜 드리지 않으려 하오니, 각하의 관용으로 저희의 말을 잠시 들어 주시기를 청합니다.
  to: 그러나 각하를 더 오래 붙들어 두지 않으려고, 각하의 너그러우심[a]에 힘입어 저희의 말을 간단히 들어 주시기를 청합니다.
  rationale: ‘더 오래 붙들어 두지 않으려고’로 ἐπὶ πλεῖον σε ἐγκόπτω의 시간 점유·지연의 뜻을 자연스럽게 드러냈습니다. ‘너그러우심’을 본문에 두고, ἐπιείκεια의 폭넓은 법정·수사적 의미는 각주로 보존했습니다. ‘간단히’와 ‘청합니다’는 συντόμως 및 παρακαλῶ의 간결하고 공손한 호소를 반영합니다.
