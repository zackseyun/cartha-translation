  source_fidelity: 초안의 핵심 뜻은 대체로 맞지만, “그 일을 하던 중에”는 여성 복수 관계사 ἐν αἷς의 선행 내용을 단수의 ‘일’과 진행 중 행위로 지나치게 한정합니다. 또한 “무리도 소요도 없었습니다”는 원문의 μετὰ(…와 함께) 구조와 ‘발견한’ 상황에 대한 수식을 충분히 드러내지 못합니다.
  naturalness: “정결케 된”은 현대 표준 한국어에서 다소 문어적·고풍스럽습니다. ‘정결 예식을 마친 채’는 의례적 정결의 완료 상태를 자연스럽고 명료하게 전달합니다. “무리도 소란도 없이 있는 것을 발견했습니다”는 법정 변론 문맥에서도 매끄럽습니다.
  terminology: ἡγνισμένον은 의례적 정결의 완료된 상태를 뜻하므로 ‘정결 예식을 마친’으로 옮기고, 각주에서 이를 의식적·예식적 정결이라고 설명하는 것이 적절합니다. ἱερόν은 ‘성전’으로 충분하며, ὄχλος와 θόρυβος는 각각 ‘무리’와 ‘소란’으로 중립적으로 유지했습니다.
