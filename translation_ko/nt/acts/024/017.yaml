    issue: '''구제를 가져오고'' is an awkward collocation.'
    rationale: ἐλεημοσύνας denotes charitable gifts/alms. In Korean, '구제금' naturally denotes aid brought for distribution, whereas bare '구제' normally denotes the activity or undertaking of relief.
