translation:
  language: ko
  text: 벨릭스는 그 길[a]에 관하여 더 정확히 알고 있었으므로 그들의 사건을 미루고 말했습니다. “천부장 루시아가 내려오면 여러분의 사건을 결정하겠습니다.”
