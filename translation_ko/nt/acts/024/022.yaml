  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
  footnotes:
  - marker: a
    text: Or “postponed the proceedings”; the Greek verb can mean to defer or adjourn judicial action.
    reason: lexical_alternative
  - marker: b
    text: “The Way” was an early designation for the Christian movement.
    reason: cultural_note
  - marker: c
    text: Or “I will determine the matters concerning you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 벨릭스는 「길」에 관해 더 정확한 지식을 가지고 있었기에 그들을 미루며 말했습니다. 「천부장 루시아가 내려오면, 그때 그대들의 사건을 결정하겠소.」
  philosophy: optimal-equivalence
