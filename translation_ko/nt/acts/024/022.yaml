review_pass:
  verdict: revise
  source_fidelity: ‘그들을 미루며’는 한국어에서 사람을 목적어로 하여 재판 절차의 연기라는 뜻을 자연스럽게 전달하지 못합니다. αὐτούς의 인칭 지시와 ἀναβάλλομαι의 법정적 연기 의미를 살려 ‘그들의 일을 미루어 두고’로 옮기는 것이 안전합니다. ἀκριβέστερον은 ‘더 자세히’, τὰ καθ’ ὑμᾶς는 법정 문맥에서 ‘여러분의 사건’으로 충실히 반영했습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 일관되게 사용하며, ‘결정하겠소’의 다소 고풍스럽고 비일관적인 종결을 ‘결정하겠습니다’로 고쳤습니다. ‘길’은 초기 그리스도교 운동의 명칭임을 각주로 밝혀 문맥상의 혼동을 막았습니다.
  terminology: ‘길’은 ἡ ὁδός의 정착된 비유적·준기술적 용법을 보존합니다. χιλίαρχος는 한국어 성경 문체에서 통용되는 ‘천부장’으로 유지했습니다. ‘사건’은 법정 문맥의 διαγνώσομαι 및 τὰ καθ’ ὑμᾶς를 자연스럽게 전달하며, 각주에서 더 직역적인 가능성을 제시합니다.
  issues:
  - severity: medium
    issue: ‘그들을 미루며’는 비자연스럽고 법정 절차를 연기했다는 뜻이 불명확합니다.
    rationale: ἀνεβάλετο αὐτούς는 당사자들에 관한 판단 또는 절차를 미루었다는 뜻입니다. 한국어에서는 사람 자체를 ‘미루다’라고 하지 않으므로, 의미상 보충된 ‘그들의 일’을 목적어로 해야 합니다.
  - severity: low
    issue: 인용문 종결 ‘결정하겠소’가 현대 합쇼체 서술과 어조가 맞지 않습니다.
    rationale: 본문 서술의 ‘말했습니다’와 일관된 현대 공식 존대 표현을 위해 ‘결정하겠습니다’가 적절합니다.
  revised_text: 벨릭스는 ‘길’[a]에 관하여 더 자세히 알고 있었으므로, 그들의 일을 미루어 두고 말했습니다. “천부장 루시아가 내려오면, 여러분의 사건을 결정하겠습니다.”
  revised_footnotes:
  - marker: a
    text: ‘길’은 초기 그리스도교 운동을 가리키는 명칭입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들에 대한 판단을 연기하고’. 그리스어 동사는 법정에서 결정이나 절차를 미루는 뜻으로 쓰입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여러분과 관련된 일들을 결정하겠습니다.’
    reason: lexical_alternative
  revision_rationale: 법정적 연기라는 핵심 의미를 자연스러운 한국어로 명확히 하고, 현대 합쇼체를 일관되게 적용했습니다. ‘길’의 특수한 용법과 두 주요 표현의 번역 대안을 각주로 보존했습니다.
