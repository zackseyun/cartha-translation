  source_fidelity: 원문의 명령 내용과 구금 중 제한된 관용이라는 큰 뜻은 잘 반영합니다. 그러나 ‘친지들’은 τῶν ἰδίων αὐτοῦ(그에게 속한 사람들)를 가족·친족 쪽으로 좁힐 수 있어, 바울의 동료나 후원자까지 포함할 수 있는 원문의 범위를 충분히 보존하지 못합니다.
  naturalness: 합쇼체 문장은 대체로 자연스럽습니다. 다만 ‘감시 아래 두되’보다 법적 구금 상태를 나타내는 ‘구금해 두되’가 이 문맥에서 더 분명하며, ‘어느 정도의 자유’는 ἄνεσις의 제한된 관용을 자연스럽게 전달합니다.
  terminology: ‘백부장’은 ἑκατοντάρχῃ에 알맞습니다. ὑπηρετεῖν은 여기서 종교적 ‘사역’이 아니라 실질적 봉사·돌봄이므로 ‘돌보는 일’로 옮깁니다. ‘지인들’은 ‘친지들’보다 친족 의미를 피하지만, 원문의 넓은 표현은 주석으로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘친지들’이 τῶν ἰδίων αὐτοῦ의 범위를 좁힙니다.
    rationale: 이 표현은 문자적으로 ‘그에게 속한 사람들’이며, 문맥상 바울의 동료·친구·후원자 등을 가리킬 수 있습니다. ‘친지’는 현대 한국어에서 친족 또는 가까운 친분 관계로 들리기 쉬워 가족 의미를 불필요하게 강화합니다.
  - severity: low
    issue: ἄνεσις와 τῶν ἰδίων αὐτοῦ의 의미 범위에 대한 주석이 없습니다.
    rationale: ἄνεσις는 완전한 석방이 아닌 완화·편의·제한된 자유를 뜻할 수 있고, ‘그에게 속한 사람들’의 정확한 범위도 본문만으로 확정되지 않습니다. 번역의 해석적 한계를 주석으로 표시하는 것이 적절합니다.
  revised_text: 그는 백부장에게 바울을 구금해 두되, 그에게 어느 정도의 자유를 허락하고 바울의 지인들이 그를 돌보는 일을 아무도 막지 말라고 명령하였습니다.
  revised_footnotes:
  - marker: a
    text: ‘어느 정도의 자유’로 옮긴 말은 ‘완화’, ‘편의’, 또는 ‘자유’를 뜻할 수 있습니다. 여기서는 구금이 계속되는 가운데 허용된 제한적 관용을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그에게 속한 사람들’입니다. 바울의 동료, 친구, 또는 후원자들을 가리킬 수 있으며, 정확한 범위는 본문에 명시되어 있지 않습니다.
    reason: lexical_alternative
  revision_rationale: ‘친지들’을 ‘지인들’로 바꾸고 주석을 추가하여, 원문의 폭넓은 관계 표현을 친족으로 한정하지 않도록 했습니다. 또한 구금 상태와 그 안에서의 제한된 관용을 더 명료하게 표현했습니다.
