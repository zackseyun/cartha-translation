  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
  footnotes:
  - marker: a
    text: '"Asia" here refers to the Roman province in Asia Minor, not the modern continent.'
    reason: cultural_note
  - marker: b
    text: Or "to bring charges against me."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아시아에서 온 몇몇 유대인들이 있습니다. 그들이 저를 고발할 일이 있었다면, 마땅히 각하 앞에 나와 저를 고발했어야 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 「아시아」는 로마의 아시아 속주(소아시아 일부)를 가리키며, 오늘날의 대륙을 가리키지 않는다.
    reason: cultural_note
