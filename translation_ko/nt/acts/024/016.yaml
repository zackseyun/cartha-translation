    issue: ‘흠 없는 양심’ for ἀπρόσκοπον συνείδησιν
    rationale: While possible, ‘흠 없는’ may communicate sinless or objectively impeccable moral status. ‘양심에 거리낌이 없는’ more naturally expresses a conscience that does not give offense and retains the source expression’s relational nuance.
  revised_text: 이 때문에 저 자신도 하나님과 사람들에 대하여 언제나 양심에 거리낌이 없도록 힘쓰고 있습니다.
