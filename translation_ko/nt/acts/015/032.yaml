  verdict: revise
  source_fidelity: 원문의 καὶ αὐτοὶ가 나타내는 유다와 실라 자신들에 대한 강조는 유지되어야 합니다. διὰ λόγου πολλοῦ는 많은 분량의 말/권면으로 행했다는 뜻이며, ‘많은 말로’는 이를 충실히 옮깁니다. παρεκάλεσαν과 ἐπεστήριξαν의 두 동작도 ‘격려하고 굳세게 하였습니다’로 구별되어 잘 반영됩니다.
  naturalness: 초안의 ‘그들 자신이’는 한국어에서 다소 부자연스럽고 앞선 두 고유명사와의 연결도 매끄럽지 않습니다. ‘자신들도’가 강조를 자연스럽게 전달합니다.
  terminology: Ἰούδας와 Σιλᾶς는 각각 ‘유다’, ‘실라’가 한국어 성경 문맥에 알맞습니다. προφῆται는 ‘예언자들’로, ἀδελφοὺς는 본문에서 ‘형제들’로 유지하되 초기 신자 공동체 전체를 가리킬 수 있음을 주석으로 밝혀야 합니다.
  issues:
