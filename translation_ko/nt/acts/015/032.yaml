    issue: ‘그들 자신이’의 어색한 강조
    rationale: καὶ αὐτοὶ의 강조는 필요하지만, ‘그들 자신이 예언자들이었으므로’는 현대 한국어에서 부자연스럽습니다. ‘자신들도 예언자들이었으므로’가 같은 강조를 더 자연스럽게 전달합니다.
  - severity: low
    issue: ‘형제들’의 포괄적 지시 대상에 대한 주석 누락
    rationale: τοὺς ἀδελφοὺς는 문법적으로 남성 복수이나 이 문맥에서는 믿는 공동체 전체를 가리킬 수 있습니다. 영어 감사 기록의 어휘 대안을 반영하는 주석이 필요합니다.
