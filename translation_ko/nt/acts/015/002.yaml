  naturalness: The conditional opening is natural, but explicitly supplying the implicit main-clause subject and using a Korean expression for commissioning delegates produces a clearer, more idiomatic formal rendering.
  terminology: ‘분쟁과 논쟁,’ ‘사도들,’ and ‘장로들’ are appropriate modern formal Korean equivalents. ‘이 문제’ appropriately renders τοῦ ζητήματος τούτου.
