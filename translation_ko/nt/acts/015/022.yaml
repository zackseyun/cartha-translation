  source_fidelity: 초안의 ‘보내기로 결정하였습니다’는 ἔδοξε의 숙의적·집단적 판단을 다소 강한 공식 결정으로 만듭니다. ‘좋겠다고 여겼습니다’가 원문의 뉘앙스를 더 충실히 살립니다. 또한 ἄνδρας는 남성 복수이므로 ‘사람들’보다 ‘남자들’이 정확하며, 마지막 서술은 선택된 두 사람을 자연스럽게 다시 가리키도록 다듬어야 합니다.
