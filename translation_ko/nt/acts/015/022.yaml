  to: 그때 사도들과 장로들은 온 교회와 함께, 그들 가운데서 남자들을 택하여 바울과 바나바와 함께 안디옥으로 보내는 것이 좋겠다고 여겼습니다. 그들은 바사바라고 불리는 유다와 실라였으며, 형제들[a] 가운데서 지도자들이었습니다.
  rationale: 원문의 집단적 숙의 표현(ἔδοξε)을 ‘좋겠다고 여겼습니다’로 보존하고, 남성 복수 ἄνδρας를 ‘남자들’로 명시했습니다. 선택되어 파송된 유다와 실라의 동격 구조 및 그들의 지도적 위치를 현대적이고 자연스러운 합쇼체로 재구성했습니다.
