translation:
  language: ko
  text: 그때 사도들과 장로들은 온 교회와 함께, 그들 가운데서 남자들을 택하여 바울과 바나바와 함께 안디옥으로 보내는 것이 좋겠다고 여겼습니다. 그들은 바사바라고 불리는 유다와 실라였으며, 형제들[a] 가운데서 지도자들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 여기서 여성들을 포함한 신자 공동체 전체를 가리킬 가능성이 높습니다.
    reason: cultural_note
