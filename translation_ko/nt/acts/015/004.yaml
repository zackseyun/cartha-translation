review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 반영했습니다. 다만 수동태 παρεδέχθησαν의 행위자 표지가 초안의 ‘교회와 사도들과 장로들에게 영접을 받고’에서는 다소 어색하며, ‘환영을 받다’ 구문으로 명확히 하는 것이 좋습니다. μετ’ αὐτῶν은 ‘그들과 함께’로 유지하여 원문의 열려 있는 연합/동반의 의미를 보존했습니다.
  naturalness: ‘교회와 사도들과 장로들의 환영을 받았고’가 현대 표준어 문장으로 더 자연스럽고, 합쇼체 서술에도 잘 맞습니다.
  terminology: ‘교회’, ‘사도들’, ‘장로들’, ‘하나님’은 문맥과 한국어 성경 번역 관례에 적절합니다. ‘함께 하신’은 하나님이 주된 행위자이시며 그들이 그 일에 동반되었음을 과도한 해석 없이 나타냅니다.
  issues:
  - severity: medium
    issue: 수동태의 행위자 표현
    rationale: ‘교회와 사도들과 장로들에게 영접을 받고’는 ‘에게’가 수혜자처럼 들릴 여지가 있습니다. 원문의 ἀπό는 환대한 주체를 가리키므로 ‘교회와 사도들과 장로들의 환영을 받았고’가 더 명료하고 자연스럽습니다.
  - severity: low
    issue: μετ’ αὐτῶν에 관한 번역 주석 누락
    rationale: 영어 POB 감사 기록이 ‘with them’의 가능한 대안적 뉘앙스를 주석으로 보존하므로, 한국어에서도 ‘함께’라는 번역을 유지하고 대안 독법을 주석으로 제시하는 것이 적절합니다.
  revised_text: 그들이 예루살렘에 이르자, 교회와 사도들과 장로들의 환영을 받았고, 하나님께서 그들과 함께[a] 하신 모든 일을 보고하였습니다.
  revised_footnotes:
