  source_fidelity: 전반적으로 원문의 사건 순서와 수동태의 뜻을 잘 반영합니다. 다만 μετ᾽ αὐτῶν은 직역상 ‘그들과 함께’이므로, 현 번역의 ‘그들과 함께 행하신’은 가능하지만 한국어에서는 하나님이 그들과 함께 ‘행하신 일’이라는 결합이 다소 부자연스럽고, ‘행하신’은 ποιέω의 넓은 의미를 필요 이상으로 특정합니다. ‘그들과 함께하신 모든 일’이 원문의 열린 표현과 더 잘 맞습니다.
  naturalness: ‘영접을 받고’와 ‘보고하였습니다’는 현대 표준어의 격식 있는 합쇼체에 자연스럽습니다. ‘그들과 함께하신 모든 일’로 고치면 문장이 더 매끄럽고 일반 독자가 이해하기에도 좋습니다.
  terminology: ‘교회’, ‘사도들’, ‘장로들’, ‘하나님’은 문맥과 한국어 성경 번역 관습에 적절합니다. ‘장로들’은 여기서 공동체의 인정받은 지도자들을 가리키며 특정 교단의 직분 체계를 과도하게 부과하지 않습니다.
  issues:
  - severity: low
    issue: ‘하나님께서 그들과 함께 행하신 모든 일’의 어휘 결합
    rationale: μετ᾽ αὐτῶν의 ‘함께’를 보존하되, ποιέω를 ‘행하다’로 좁히기보다 ‘함께하시다’로 옮기면 한국어 문체가 자연스럽고, 하나님이 주된 행위자이며 그들이 그 일에 동반된다는 원문의 여지를 유지합니다.
  revised_text: 그들이 예루살렘에 이르러 교회와 사도들과 장로들에게 영접을 받고, 하나님께서 그들과 함께하신 모든 일을 보고하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “하나님께서 그들을 통하여 하신” 또는 “그들 가운데 하신.” 그리스어는 문자적으로 “그들과 함께”라고 합니다.
    reason: alternative_reading
  revision_rationale: μετ᾽ αὐτῶν의 의미 범위(‘그들과 함께’, 문맥상 ‘그들을 통하여’ 또는 ‘그들 가운데’)를 본문에서는 가장 직접적으로 보존하고, 대안 해석은 각주로 제시했습니다. 또한 ‘함께하신’으로 다듬어 현대 한국어의 자연스러운 문체와 원문의 신학적 절제를 함께 유지했습니다.
