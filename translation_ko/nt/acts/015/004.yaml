  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
  footnotes:
  - marker: a
    text: Or 'God had done through them' or 'God had done among them.' The Greek says 'with them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 예루살렘에 이르자, 교회와 사도들과 장로들의 환영을 받았고, 하나님께서 그들과 함께[a] 하신 모든 일을 보고하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 통하여 하신’, ‘그들 가운데 하신’. 그리스어는 직역하면 ‘그들과 함께 하신’입니다.
    reason: alternative_reading
