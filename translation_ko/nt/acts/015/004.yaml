    text: 또는 ‘그들을 통하여 하신’, ‘그들 가운데 하신’. 그리스어는 직역하면 ‘그들과 함께 하신’입니다.
    reason: alternative_reading
  revision_rationale: 환영의 주체를 자연스러운 한국어 소유격 구문으로 바꾸어 원문의 수동태와 ἀπό가 나타내는 행위자 관계를 분명히 했습니다. 또한 μετ’ αὐτῶν의 의미를 ‘함께’로 보존하고, 가능한 도구적·장소적 뉘앙스는 주석에서만 제시하여 본문에 특정 해석을 강요하지 않았습니다.
