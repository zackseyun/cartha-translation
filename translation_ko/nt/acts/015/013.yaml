    issue: σιγῆσαι를 ‘말을 마치자’로 번역함
    rationale: ‘말을 마치다’는 발언 완료를 암시하지만, 원문은 앞선 이들이 잠잠해지거나 발언을 그친 뒤라는 시간 표지입니다.
  - severity: medium
    issue: 직접 인용의 닫는 인용부호 누락
    rationale: 인용문 구조가 완결되지 않아 문장부호상 수정이 필요합니다.
  - severity: low
    issue: Ἄνδρες ἀδελφοί의 이중 남성 호격에 대한 정보 부재
    rationale: 본문의 자연스러움을 위해 ‘형제 여러분’으로 옮길 수 있으나, 원문이 ‘남자들이여, 형제들이여’라는 두 호격을 쓴 점은 각주로 밝혀 두는 것이 감사 가능성을 높입니다.
  revised_text: 그들이 잠잠해진 뒤에[a] 야고보가 대답하여 말했습니다. “형제 여러분[b], 내 말을 들어 주십시오.”
