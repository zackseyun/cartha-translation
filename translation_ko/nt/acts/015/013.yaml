  source_fidelity: ‘그들이 말을 마치자’는 앞선 발언자들이 모두 말을 끝냈다는 뜻으로 다소 좁혀질 수 있습니다. σιγῆσαι는 ‘잠잠해지다/말을 그치다’이므로 ‘잠잠해진 뒤에’가 더 직접적입니다. Ἄνδρες ἀδελφοί의 두 남성 호격은 본문에서 자연스러운 ‘형제 여러분’으로 옮기되 각주에서 직역과 문맥을 밝혔습니다.
  naturalness: 현대 표준어 합쇼체로 ‘야고보가 대답하여 말했습니다’와 ‘내 말을 들어 주십시오’는 자연스럽습니다. 초안의 닫히지 않은 인용부호는 바로잡아야 합니다.
  terminology: ‘야고보’는 신약 인명 관례에 맞고, ‘형제 여러분’은 공적 호소의 자연스러운 한국어입니다. 다만 원문의 남성형 이중 호격은 각주로 투명하게 보존합니다.
  issues:
