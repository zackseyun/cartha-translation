    issue: The quotation mark is unclosed.
    rationale: The draft opens a Korean quotation with 「 but provides no closing 」, creating a structural punctuation error.
  - severity: medium
    issue: “그들이 말을 마치자” does not fully represent σιγῆσαι.
    rationale: The Greek says that they became silent/fell silent; it need not specifically mean that they completed their remarks.
  - severity: low
    issue: The double vocative Ἄνδρες ἀδελφοί is not documented.
    rationale: A natural Korean rendering may use “형제 여러분,” but a footnote should retain the auditable information that the Greek literally has two masculine vocatives.
  revised_text: 그들이 잠잠해진 뒤에 야고보가 대답하여 말하였습니다. 「형제 여러분, 제 말을 들어 주십시오.」
