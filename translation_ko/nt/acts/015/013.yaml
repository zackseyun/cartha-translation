  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
  footnotes:
  - marker: a
    text: Or “after they fell silent.” The Greek expression marks the point after the previous speakers had stopped speaking.
    reason: lexical_alternative
  - marker: b
    text: The address is literally “Men, brothers,” a formal masculine vocative. In context it addresses the assembled brothers, though the wider gathering included others as well.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 잠잠해진 뒤에[a] 야고보가 대답하여 말했습니다. “형제 여러분[b], 내 말을 들어 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 말을 그친 뒤에.” 그리스어 표현은 앞서 말하던 이들이 잠잠해진 뒤의 시점을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “남자들이여, 형제들이여”입니다. 공적인 모임에서 쓰인 남성형 호격입니다.
    reason: cultural_note
