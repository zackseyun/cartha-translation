  source_fidelity: The draft’s “그들이 말을 마치자” narrows σιγῆσαι (“became/fell silent”) to merely finishing speech. “그들이 잠잠해진 뒤에” better preserves the stated transition. The address Ἄνδρες ἀδελφοί contains both masculine vocatives; natural Korean “형제 여러분” is appropriate in the main text, with a note documenting the literal form.
  naturalness: The revised wording is idiomatic, modern standard Korean in formal-polite style. “대답하여 말하였습니다” naturally reflects both ἀπεκρίθη and λέγων without sounding unduly repetitive.
  terminology: “야고보” is the established Korean New Testament form for Ἰάκωβος. “형제 여러분” is the conventional formal Korean public address; the accompanying note preserves the source wording and its masculine form.
  issues:
