  source_fidelity: 바나바, 요한, 마가의 이름과 βούλομαι의 미완료 과거(원하였-) 및 συμπαραλαβεῖν의 동반 의미(데려가-)를 충실히 옮겼습니다. καὶ의 첨가 강조도 ‘요한도’로 반영했습니다. ‘-으나’는 δέ의 문맥상 대조를 자연스럽게 드러내며, 다음 절과 이어지는 문장 구조에도 맞습니다.
  naturalness: ‘바나바는 마가라고 하는 요한도 데려가기를 원하였으나,’는 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. 절 끝 쉼표는 다음 절의 바울의 판단과 문장이 이어짐을 적절히 나타냅니다.
  terminology: 인명 표기 ‘바나바’, ‘요한’, ‘마가’는 통용 표기이며, ‘마가라고 하는 요한’은 τὸν καλούμενον Μᾶρκον을 무리 없이 재현합니다. 별도의 신학 용어 또는 각주가 필요한 표현은 없습니다.
