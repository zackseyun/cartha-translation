review_pass:
  verdict: revise
  source_fidelity: The draft misattaches '우리에게서 명령받지 아니한' to '말' ('words not commanded by us'), whereas οἷς οὐ διεστειλάμεθα refers to the men. The revision restores the denial that the Jerusalem body gave those men instructions, while retaining the causal force of ἐπειδή and the sequence of departure, troubling speech, and inner disturbance.
  naturalness: The draft's '명령받지 아니한 말로써' is unnatural and semantically misleading. The revised Korean is idiomatic modern formal-polite Korean; the verse remains a dependent clause, as indicated by the source's continuing syntax and comma.
  terminology: '''우리 가운데서 나간'' accurately conveys ἐξ ἡμῶν ἐξελθόντες. ''말로'' retains the instrumental sense of λόγοις. ''여러분의 마음을 혼란스럽게 하다'' naturally conveys ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν without reducing the phrase to mere emotion. ''아무 지시도 하지 않은'' renders the lack of authorization expressed by οἷς οὐ διεστειλάμεθα.'
  issues:
  - severity: high
    issue: The phrase '우리에게서 명령받지 아니한 말로써' makes the words, rather than the men, the object of the denied command.
    rationale: The Greek relative pronoun οἷς is masculine plural and refers to 'some' who went out. It states that the speakers had received no instruction/authorization from the letter's authors.
  - severity: medium
    issue: The draft omits the causal connection expressed by ἐπειδή.
    rationale: The verse begins with 'Since/Because we heard'; Korean should preserve this as '...들었으므로,' because the clause grounds the action stated in the following verse.
  revised_text: 우리는 우리 가운데서 나간 몇몇 사람이, 우리가 그들에게 아무 지시도 하지 않았는데, 말로 여러분을 괴롭히고 여러분의 마음을 혼란스럽게 하였다는 말을 들었으므로,
  revised_footnotes:
  - marker: a
    text: 또는 “여러분의 심령을 뒤흔들고.” 여기서 “여러분의 마음”은 단지 감정만이 아니라 사람의 내면 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리가 그들에게 명령하지 않았는데.”
    reason: alternative_reading
  revision_rationale: The correction relocates the lack of instruction from the words to the men, which is required by Greek grammar and the verse's point concerning unauthorized teachers. It also restores the causal opening and supplies footnotes for the inner-person sense of ψυχή and the possible stronger rendering of διεστειλάμεθα. The comma is retained because this verse is syntactically continued in Acts 15:25.
