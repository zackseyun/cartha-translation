review_pass:
  verdict: revise
  source_fidelity: 'The draft mistranslates οἷς οὐ διεστειλάμεθα (''to whom we gave no instructions''): ''우리에게서 명령받지 아니한 말로써'' makes the lack of command modify ''words'' rather than the men. The revision restores the Greek referent and its denial of authorization. ''마음'' is an acceptable natural Korean contextual rendering of ψυχαί in this expression.'
  naturalness: The draft's '명령받지 아니한 말로써' is syntactically awkward and semantically misleading. The revised wording is clear, modern standard Korean in formal-polite style.
  terminology: '''말로'' faithfully renders λόγοις without adding content. ''아무 지시도 하지 않았습니다'' naturally renders διεστειλάμεθα and avoids importing a specific doctrinal interpretation. ''여러분의 마음을 혼란스럽게 하다'' conveys the inward disruption expressed by ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν.'
  issues:
  - severity: high
    issue: '''우리에게서 명령받지 아니한 말로써'' attaches the lack of authorization to ''말'' (words).'
    rationale: The relative pronoun οἷς is masculine plural and refers to 'some people,' not to λόγοις ('words'). The source states that the Jerusalem leaders gave those people no instruction.
  - severity: medium
    issue: The clause structure obscures the source's explicit denial that the men were authorized.
    rationale: A separate Korean sentence preserves the referent unambiguously and remains faithful to the Greek sense.
  revised_text: 우리에게서 나간 몇몇 사람이 말로 여러분을 어지럽히고 여러분의 마음을 혼란스럽게 하였다는 소식을 들었습니다. 우리는 그들에게 아무 지시도 하지 않았습니다.
  revised_footnotes: []
  revision_rationale: Recast the final relative clause as an explicit second sentence so that '그들에게' unmistakably refers to the people who went out from the Jerusalem community. This corrects the substantive attachment error while retaining the source's restrained wording and the modern formal-polite register.
