    rationale: 이 문맥에서 바울은 단순한 개인적 판단을 말한 것이 아니라 그를 동행시키지 말아야 한다고 단호히 주장합니다.
  - severity: low
    issue: ‘함께 일하러 가지 아니한’에서 동행 대상이 명시되지 않습니다.
    rationale: αὐτοῖς는 그들과 함께 가지 않았음을 뜻하므로 ‘그들과 함께’를 넣으면 원문의 관계가 더 분명해집니다.
  revised_text: 바울은 밤빌리아에서 그들을 떠나 그들과 함께 그 일을 하러 가지 않았던 그 사람을 데려가지 말아야 한다고 강하게 주장했습니다.
