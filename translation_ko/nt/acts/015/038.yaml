  source_fidelity: 초안은 밤빌리아에서 일행을 떠났고 그 일에 함께 가지 않았다는 핵심 내용을 대체로 반영합니다. 그러나 ἠξίου의 지속적이고 단호한 주장이라는 힘이 ‘옳지 않다고 여겼습니다’에서는 약화됩니다. 또한 ‘함께 일하러’는 누구와 함께인지 다소 불분명하므로 αὐτοῖς를 명시하는 편이 낫습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 긴 수식절도 의미 관계를 유지합니다.
  terminology: ‘그 일’은 εἰς τὸ ἔργον의 정관사가 있는 ‘그 일’을 보존하면서 ‘선교’ 같은 해석적 보충을 피합니다. ‘그 사람’은 τοῦτον의 지시성을 무리하게 공격적인 ‘이 사람’으로 만들지 않고 반영합니다.
  issues:
