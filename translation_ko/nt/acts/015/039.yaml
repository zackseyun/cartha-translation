translation:
  language: ko
  text: 그런데 그들 사이에 심한 의견 충돌이 일어났고, 그 결과 그들은 서로 헤어지게 되었습니다. 바나바는 마가를 데리고 키프로스로 배를 타고 떠났습니다.[a]
  philosophy: optimal-equivalence
