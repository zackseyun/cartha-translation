  naturalness: ‘심한 의견 충돌’은 현대 표준어 합쇼체의 공적 서술에 자연스럽고, 인물들 사이의 갈등을 지나치게 완화하거나 과장하지 않습니다. ‘서로 헤어지게 되었습니다’도 문맥상 자연스럽습니다.
  terminology: ‘바나바’, ‘마가’, ‘키프로스’는 현대 한국어 외래어 표기와 본문의 명칭 범위(단순히 ‘마가’)에 맞습니다. παροξυσμός의 대안적 뉘앙스는 각주로 보존합니다.
  issues:
