    rationale: δέ는 이 문맥에서 주로 약한 서술 연결이며, 앞 문장의 원인이어서 다툼이 발생했다는 관계를 본문이 명시하지 않습니다.
  - severity: low
    issue: 결과를 나타내는 ὥστε 구문의 관계가 충분히 명시되지 않음
    rationale: ‘그 결과’를 사용하면 강한 충돌과 상호 분리 사이의 결과 관계를 한국어에서 자연스럽게 재현할 수 있습니다.
