  source_fidelity: 원문의 ταξιδιωτική 뉘앙스를 지닌 προπεμφθέντες는 「교회의 전송을 받아」로 적절히 반영되었고, διήρχοντο와 ἐκδιηγούμενοι도 각각 「거쳐 가면서」와 「자세히 전하여」로 충실하게 옮겼습니다. 「이방인들의 회심」은 ἐπιστροφὴ τῶν ἐθνῶν의 문맥상 의미를 정확히 전달하며, 「모든 형제들에게 큰 기쁨을 주었습니다」도 원문의 보편성과 사동 의미를 보존합니다.
