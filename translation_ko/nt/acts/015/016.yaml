translation:
  language: ko
  text: 「이 일들이 있은 뒤에 내가 돌아와서 무너진 다윗의 장막[a]을 다시 짓겠고, 그 허물어진 부분들을 다시 짓고, 그것을 다시 일으켜 세우겠다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘장막’: 또는 ‘성막’. 그리스어 σκηνή는 ‘장막’ 또는 ‘성막’을 뜻할 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: ‘다윗의 장막’은 다윗과 관련된 회복을 나타내는 예언적 비유입니다. 본문은 그 비유를 그대로 유지합니다.
    reason: cross_reference
theological_decisions:
- issue: 아모스 9:11-12 LXX 인용에서 화자(κύριος)의 정체
  chosen_reading: 내가 돌아와서…내가 다시 짓겠다 (야훼의 1인칭 발화)
  alternative_readings:
  - 주께서…
  rationale: '15:17에서 화자는 자신을 「λέγει κύριος」로 명시한다. 이는 아모스 본문의 야훼이며, 15:17에서는 「주」가 아니라 「야훼」로 옮긴다(글로사리 정책: κύριος = YHWH의 LXX 인용). 16절은 그 동일한 발화의 도입이므로 1인칭이 야훼임을 인지하여 옮긴다.'
  doctrine_reference: 'Glossary: κύριος (= YHWH) → 야훼'
