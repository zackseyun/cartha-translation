  to: 이는 인류 가운데 남은 자들이 야훼를 찾고, 내 이름으로 일컬음을 받는 모든 이방인들도 찾게 하려는 것이다[a]. 이 모든 일을 행하시는 야훼께서 말씀하신다.
  rationale: 목적절의 두 병렬 항이 모두 ‘찾다’에 연결됨을 한국어에서 명시하고, ‘인류 가운데 남은 자들’ 및 ‘이 모든 일’로 원문의 범위와 복수성을 반영했습니다. ἔθνη의 ‘민족들’ 가능성과 아모스 인용 배경은 하나의 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
