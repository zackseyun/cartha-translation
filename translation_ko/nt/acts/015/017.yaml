  source_fidelity: 현 초안은 첫 절의 목적절을 대체로 반영하지만, ‘남은 사람들과 … 모든 이방인들이 야훼를 찾게’라는 표현은 헬라어의 두 병렬 항을 한데 묶어, 두 번째 항에도 ‘찾게’가 생략되어 있다는 관계를 충분히 드러내지 못합니다. 또한 πάντα τὰ ἔθνη의 집합적 뉘앙스와 ποιῶν ταῦτα의 복수 목적어를 더 정확히 반영할 수 있습니다.
  naturalness: ‘이는 … 하려는 것이다’와 ‘말씀하신다’는 현대 표준어 합쇼체 인용 문맥에 자연스럽습니다. ‘인류 가운데 남은 자들’은 ‘남은 사람들’보다 κατάλοιποι τῶν ἀνθρώπων의 남은 자/인류라는 의미를 명확하게 전달합니다.
  terminology: 문맥상 ἔθνη는 예루살렘 회의의 비유대인 포용 논의와 맞물리므로 ‘이방인들’로 옮길 수 있으며, ‘민족들’이라는 가능성은 각주로 보존하는 것이 적절합니다. 본문이 아모스 인용에서 YHWH를 가리키는 κύριος를 사용한다는 제시된 프로젝트 방침에 따라 ‘야훼’를 유지할 수 있습니다.
