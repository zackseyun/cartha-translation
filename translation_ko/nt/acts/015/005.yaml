    issue: πεπιστευκότες의 번역
    rationale: 완료분사 πεπιστευκότες는 단순한 현재적 정체성 표지보다, 믿게 된 사건과 그 결과 상태를 나타냅니다. '믿게 된'이 이를 더 잘 보존합니다.
  - severity: low
    issue: 인용문의 도입과 종결 표현
    rationale: '''말하기를 … 하였습니다''는 문어적으로 가능하지만 현대 합쇼체 서술에서는 ''말했습니다: “…”''가 더 자연스럽고, λέγοντες의 동시성을 명료하게 합니다.'
  revised_text: 그러나 바리새파 가운데 믿게 된 몇 사람이 일어나서 말했습니다. “그들에게 할례를 베풀고 모세의 율법을 지키도록 명령해야 합니다.”
