  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
  footnotes:
  - marker: a
    text: Or “sect of the Pharisees.” The Greek word here denotes a recognized party or school, not necessarily 'heresy' in the later technical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바리새파 가운데 믿게 된 몇 사람이 일어나서 말했습니다. “그들에게 할례를 베풀고 모세의 율법을 지키도록 명령해야 합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱρέσεως τῶν Φαρισαίων
  english_pob_choice: party of the Pharisees
  chosen_korean: 바리새파
  alternatives_korean:
  - 바리새인의 분파
  lexicon: BDAG
  rationale: αἵρεσις는 여기서 부정적 「이단」이 아니라 중립적 의미의 「학파/당파」를 가리킨다. 「바리새파」가 한국어에서 가장 자연스럽다.
- source_word: νόμον Μωϋσέως
  english_pob_choice: law of Moses
  chosen_korean: 모세의 율법
  alternatives_korean:
  - 모세의 토라
  lexicon: BDAG
  rationale: 한국어 성서 전통에서 νόμος Μωϋσέως는 「모세의 율법」으로 굳어져 있다.
