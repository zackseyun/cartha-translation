translation:
  language: ko
  text: 며칠 후에 바울이 바나바에게 말하였습니다. 「우리가 주의 말씀을 전한 모든 도시에서 형제들[a]을 다시 찾아가, 그들이 어떻게 지내는지 살펴봅시다.」
  philosophy: optimal-equivalence
  footnotes:
