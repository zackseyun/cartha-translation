source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
  footnotes:
  - marker: a
    text: Or 'Simon.' James uses the form 'Simeon' here.
    reason: lexical_alternative
  - marker: b
    text: Or 'from among the nations.'
    reason: lexical_alternative
  - marker: c
    text: That is, a people belonging to him, identified with his name.
    reason: cultural_note
translation:
  language: ko
  text: 시므온이 하나님께서 처음으로 이방인들 가운데서 자기 이름을 위한 백성을 취하시려고 그들을 돌보신 일을 말하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시몬’. 야고보는 여기서 ‘시므온’이라는 형태를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들 가운데서’. 여기서는 유대인이 아닌 이들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 하나님의 이름에 속하고 그 이름으로 불리는 백성이라는 뜻입니다.
    reason: cultural_note
