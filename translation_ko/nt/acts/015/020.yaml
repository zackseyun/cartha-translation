revisions:
- from: 다만 그들에게 편지하여 우상에게 더럽혀진 것과 음행과 목매어 죽인 것과 피를 삼가도록 하는 것입니다.
  to: 다만 우상과 관련된 더러운 것들과 음행과 목 졸라 죽인 것과 피를 삼가라고 그들에게 편지하는 것입니다.
  rationale: The revision preserves the four coordinated Greek objects and the deliberately noncommittal scope of idol-related defilements. It retains the broad conventional term ‘음행,’ renders πνικτόν clearly without adding ‘meat,’ and improves the Korean expression of the directive conveyed by letter. The sentence’s ‘…하는 것입니다’ appropriately reflects that this verse continues the judgment expressed in the preceding context.
