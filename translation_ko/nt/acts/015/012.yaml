  source_fidelity: 현 번역은 하나님의 행위와 바나바·바울을 통한 수단성을 대체로 잘 옮겼습니다. 그러나 ἤκουον의 지속적·주의 깊은 청취는 단순히 ‘들었습니다’보다 ‘귀 기울여 들었습니다’가 더 잘 반영하며, ἐξηγουμένων은 ‘보고하는 것’보다 사건을 자세히 전하는 뜻의 ‘이야기하는 것’이 자연스럽습니다. ὅσα는 ‘모든 표적과 기사’로 명시하는 것이 적절합니다.
  naturalness: ‘온 회중이 잠잠해지자’와 ‘귀 기울여 들었습니다’는 현대 표준 한국어 합쇼체 서사로 자연스럽습니다. ‘보고하는 것’은 다소 행정적이어서 본문의 구두 보고·서술 상황에는 ‘이야기하는 것’이 더 알맞습니다.
  terminology: ‘회중’, ‘표적과 기사’, ‘이방인들’, ‘하나님’은 문맥과 한국어 성서 번역 관습에 부합합니다. ἐν τοῖς ἔθνεσιν의 어휘적 대안은 각주로 보존합니다.
