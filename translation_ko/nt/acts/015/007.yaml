  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 πολλῆς ζητήσεως는 단순히 논쟁이 ‘일어난’ 것보다 상당한 논의·토론이 진행된 상황을 가리키며, ἐξελέξατο의 선택 대상인 베드로가 한국어 문장에서 명시되면 더 분명합니다. διὰ τοῦ στόματός μου의 구체적 표현도 유지하는 것이 좋습니다.
  naturalness: 합쇼체 문체는 적절하지만, 인용문을 닫는 큰따옴표가 빠져 있어 구조상 수정이 필요합니다. ‘많은 논의가 있은 뒤’와 ‘여러분도 아십니다’는 현대 표준 한국어에서 자연스럽고 본문의 연설체에 맞습니다.
  terminology: ‘베드로’, ‘하나님’, ‘복음’, ‘이방 사람들’은 적절합니다. τὰ ἔθνη의 다른 가능성인 ‘민족들’ 및 Ἄνδρες ἀδελφοί의 남성 복수 관습적 호칭은 각주로 밝혀 의미 범위를 보존합니다.
