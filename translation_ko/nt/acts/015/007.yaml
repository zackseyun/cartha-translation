  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
  footnotes:
  - marker: a
    text: Or “Men, brothers.” The Greek address is masculine plural; “Brothers” preserves the form, though the audience may have included others represented by this conventional address.
    reason: lexical_alternative
  - marker: b
    text: Or “from early days.”
    reason: lexical_alternative
  - marker: c
    text: Or “the nations.” Here the sense is non-Jewish peoples, hence “the Gentiles.”
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 논의가 있은 뒤, 베드로가 일어나 그들에게 말하였습니다. 「형제 여러분[a], 여러분도 아십니다. 하나님께서 오래전부터[b] 여러분 가운데서 나를 택하셔서, 내 입을 통하여 이방 사람들이[c] 복음의 말씀을 듣고 믿게 하셨습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “남자 형제들이여”입니다. 그리스어의 남성 복수 관습적 호칭이며, 문맥상 대표적인 청중에게 하는 호칭일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “옛적부터”.
    reason: lexical_alternative
  - marker: c
    text: 또는 “민족들”. 여기서는 유대인이 아닌 사람들을 가리키므로 “이방 사람들”로 옮겼습니다.
    reason: lexical_alternative
