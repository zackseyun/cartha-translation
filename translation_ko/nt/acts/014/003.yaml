translation:
  language: ko
  text: 그러므로 그들은 그곳에 상당한 기간 머물며 주를 의지하여 담대히 말하였습니다.[a] 주께서는 자기의 은혜의 말씀을 증언하시고, 그들의 손을 통하여 표징과 이적이 일어나게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
