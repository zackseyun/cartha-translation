    text: 또는 ‘주 안에서 담대히 말하였습니다.’ 그리스어 표현은 그들의 담대함이 주 안에서 행해졌거나 주를 의지하는 데 근거했음을 나타낼 수 있습니다.
    reason: alternative_reading
