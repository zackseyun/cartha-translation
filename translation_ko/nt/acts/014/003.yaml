revisions:
- from: 그래서 두 사람이 그곳에 오랫동안 머물면서 주를 의지하여 담대히 말하였고, 주께서는 그분의 은혜의 말씀을 증언하시며 그들의 손으로 표징과 기사를 행하게 하셨습니다.
  to: 그러므로 그들은 그곳에 상당한 기간 머물며 주를 의지하여 담대히 말하였습니다.[a] 주께서는 자기의 은혜의 말씀을 증언하시고, 그들의 손을 통하여 표징과 이적이 일어나게 하셨습니다.
  rationale: The revision removes an unstated numerical specification, improves Korean idiom and cohesion, retains the Lord’s title without adding ‘Jesus,’ and preserves the ambiguity of ἐπὶ τῷ κυρίῳ with a footnote. It also keeps the instrumental force of ‘through their hands’ and the divine enabling expressed by διδόντι.
