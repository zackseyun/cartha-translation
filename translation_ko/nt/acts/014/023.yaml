  source_fidelity: ‘믿고 있던’은 πεπιστεύκεισαν(완료과거)의 선행한 믿음을 충분히 나타내지 못하며, παρέθεντο의 ‘맡기다/위탁하다’ 의미에 비해 ‘부탁하다’는 부정확합니다. 또한 ‘그들에게 장로들을’은 수식 관계가 다소 불분명합니다.
  naturalness: 합쇼체 문장 자체는 대체로 자연스럽지만, ‘그 주께 그들을 부탁하였습니다’는 반복과 어휘 선택 때문에 한국어 흐름이 어색합니다. ‘그들을 위하여 교회마다 장로들을 세우고’ 및 ‘주께 그들을 맡겼습니다’가 더 명료하고 자연스럽습니다.
  terminology: πρεσβύτεροι는 교회 지도자 문맥에서 ‘장로들’이 적절하며, κύριος는 ‘주’로 옮기는 것이 적절합니다. χειροτονήσαντες는 특정한 선출 제도를 단정하지 않는 ‘세우다’로 유지할 수 있습니다.
  issues:
