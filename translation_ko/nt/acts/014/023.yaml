  to: 그들을 위하여 교회마다 장로들을 세우고 금식하며 기도한 뒤, 그들이 믿었던 주께 그들을 맡겼습니다.[a]
  rationale: ‘맡기다’로 παρέθεντο의 위탁 의미를 살리고, ‘믿었던’으로 완료과거를 반영했습니다. ‘세우다’는 χειροτονέω가 선출 방식이나 교회 제도를 명시하지 않는 점을 보존합니다. 마지막 ‘그들’의 지시 대상에 관한 가능한 모호성은 번역문에서 해소하지 않고 각주로 밝혔습니다.
  reviewer_model: gpt-5.6-terra
