    issue: ‘부탁하였습니다’
    rationale: παρέθεντο는 사람들을 주의 돌보심에 맡기거나 위탁했다는 뜻입니다. 한국어 ‘부탁하다’는 요청한다는 뜻이 주가 되어 이 문맥의 위탁 의미를 정확히 전달하지 못합니다.
  - severity: medium
    issue: ‘믿고 있던’
    rationale: πεπιστεύκεισαν은 완료과거로, 주께 맡기기 이전에 이미 믿었던 상태를 가리킵니다. ‘믿었던’이 시제를 더 충실히 반영합니다.
  - severity: low
    issue: ‘그들에게 장로들을’의 수식 관계
    rationale: αὐτοῖς는 장로들이 세워지는 대상인 신자들/각 교회를 가리킵니다. ‘그들을 위하여’로 두어 관계를 분명히 하되, 뒤의 αὐτούς의 정확한 지시 대상이 논쟁될 수 있는 점은 각주로 보존합니다.
