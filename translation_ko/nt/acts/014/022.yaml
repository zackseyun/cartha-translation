revisions:
- from: 제자들의 영혼을 굳세게 하고 그 믿음에 머물러 있으라고 권면하며, 우리가 많은 환난을 겪어야 하나님 나라에 들어가게 됨을 말하였습니다.
  to: 제자들의 마음을 굳세게 하고, 그들이 믿음 안에 머물도록 권면하며, 우리가 많은 환난을 통하여 하나님 나라에 들어가야 한다고 말하였습니다.
  rationale: The revision retains the original’s coordinated present participles and indirect statement while rendering διά with ‘통하여,’ thereby avoiding an unintended sequential or meritorious implication. It also improves idiomatic Korean for continuing in the faith. No footnote is necessary because the principal ambiguity is adequately retained in the translation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T09:32:53Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the participial sequence and the core meanings of strengthening, exhorting, remaining in the faith, necessity, many afflictions, and entering God’s kingdom. However, ‘많은 환난을 겪어야 하나님 나라에 들어가게 됨’ can imply that enduring afflictions is a prior condition for entry, rather than that entry takes place through many afflictions. Rendering διά as ‘통하여’ better preserves the Greek relationship.
  naturalness: ‘그 믿음에 머물러 있으라고’ is understandable but somewhat stiff in modern Korean. ‘믿음 안에 머물도록 권면하며’ is more idiomatic and preserves the sense of continuing steadfastly in the faith. ‘마음을 굳세게 하다’ is a natural Korean idiom for the contextual sense of strengthening the disciples’ ψυχαί.
  terminology: ‘하나님 나라’ appropriately renders βασιλεία τοῦ θεοῦ. ‘환난’ suitably renders θλίψεις and retains the verse’s gravity. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The relation expressed by διὰ πολλῶν θλίψεων is weakened and potentially shifted.
    rationale: '‘많은 환난을 겪어야 … 들어가게 됨’ may be heard as a sequence or qualifying requirement: one must first undergo afflictions in order to enter. The Greek says that entry is through/along the path of many afflictions. ‘많은 환난을 통하여’ preserves this relation more directly.'
  - severity: low
    issue: The expression for remaining in the faith is slightly unnatural.
    rationale: ‘그 믿음에 머물러 있으라고’ is intelligible, but ‘믿음 안에 머물도록’ is more natural Korean and fits ἐμμένειν τῇ πίστει without changing its definite contextual sense.
  revised_text: 제자들의 마음을 굳세게 하고, 그들이 믿음 안에 머물도록 권면하며, 우리가 많은 환난을 통하여 하나님 나라에 들어가야 한다고 말하였습니다.
