revisions:
- from: 거기서 배를 타고 안디옥으로 돌아갔으니, 그곳은 그들이 이루어 낸 그 일을 위하여 하나님의 은혜에 맡겨졌던 곳이었습니다.
  to: 그들은 그곳에서 배를 타고 안디옥으로 떠났습니다. 안디옥은 그들이 완수한 그 일을 위하여 하나님의 은혜에 맡겨졌던 곳입니다.
  rationale: 'The revision removes the unsupported ‘returned,’ retains departure by sea, makes Antioch unambiguously the place from which they had earlier been entrusted to God’s grace, and renders the completed work in idiomatic formal Korean. No footnote is needed: the relevant lexical range can be represented directly without obscuring the verse.'
  reviewer_model: gpt-5.6-terra
