review_pass:
  verdict: revise
  source_fidelity: The draft unnecessarily adds ‘returned’ (돌아갔으니), whereas ἀπέπλευσαν εἰς Ἀντιόχειαν states that they sailed to Antioch without explicitly expressing return. Its second clause also makes ‘there’ refer awkwardly to the preceding departure point rather than clearly to Antioch, the antecedent of ὅθεν.
  naturalness: The sentence is formally polite, but ‘그곳은 … 맡겨졌던 곳이었습니다’ is repetitive and syntactically awkward. Naming Antioch directly produces clear, natural modern Korean.
  terminology: ‘하나님의 은혜에 맡겨졌던’ appropriately renders the passive periphrastic παραδεδομένοι τῇ χάριτι τοῦ θεοῦ without importing a particular ecclesial or denominational sense. ‘완수한 일’ naturally conveys ὃ ἐπλήρωσαν.
  issues:
  - severity: medium
    issue: ‘돌아갔으니’ adds the idea of returning.
    rationale: Although the wider narrative makes Antioch a return destination, the Greek verse itself says only that they sailed to Antioch. The Korean should not make this contextual implication explicit as part of the translated wording.
  - severity: medium
    issue: The relative location clause is unclear and awkward in Korean.
    rationale: ὅθεν refers to Antioch, the place from which they had previously been entrusted to God’s grace. Repeating ‘그곳’ after ‘거기서’ can instead suggest the departure location. Explicitly naming 안디옥 preserves the source relation.
  revised_text: 그들은 그곳에서 배를 타고 안디옥으로 떠났습니다. 안디옥은 그들이 완수한 그 일을 위하여 하나님의 은혜에 맡겨졌던 곳입니다.
  revised_footnotes: []
  revision_rationale: 'The revision removes the unsupported ‘returned,’ retains departure by sea, makes Antioch unambiguously the place from which they had earlier been entrusted to God’s grace, and renders the completed work in idiomatic formal Korean. No footnote is needed: the relevant lexical range can be represented directly without obscuring the verse.'
