- from: 도착하여 교회를 모은 뒤에, 그들은 하나님께서 자기들과 함께하시며 행하신 모든 일과, 또 이방인들에게 믿음의 문을 열어 주신 일을 보고하였습니다.
  to: 그들이 도착하여 교회를 모은 뒤, 하나님께서 그들과 함께하신 모든 일과 이방인들에게 믿음의 문을 열어 주신 일을 보고하였습니다.
  rationale: The revision removes the unsupported added notion that God 'was with' them and renders ἐποίησεν ... μετ’ αὐτῶν as '하나님께서 그들과 함께하신 모든 일.' It retains the coordination of the two reported matters and the traditional, contextually appropriate rendering '이방인들' for ἔθνεσιν.
