source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
  footnotes:
  - marker: a
    text: Or 'had surrounded him' or 'had encircled him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he rose.' The Greek can be rendered this way, but here it likely refers to Paul getting up physically rather than explicitly describing resurrection.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 제자들이 바울을 둘러서자[a], 바울은 일어나[b] 성 안으로 들어갔습니다. 이튿날 바울은 바나바와 함께 더베로 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바울을 에워싸자’ 또는 ‘바울을 둘러싸자’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘일어서서’. 그리스어는 ‘일어나다’로도 옮길 수 있으나, 여기서는 바울이 실제로 일어난 일을 가리키며 부활을 명시하지는 않습니다.
    reason: alternative_reading
