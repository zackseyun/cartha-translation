  - severity: low
    issue: The expression for ὁ ἡγούμενος τοῦ λόγου is slightly unnatural.
    rationale: “말을 주도하는 사람” is not wrong, but “말하는 일에서 주도적인 사람” better expresses being the principal speaker in natural Korean.
