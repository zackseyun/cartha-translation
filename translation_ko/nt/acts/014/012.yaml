  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
  footnotes:
  - marker: a
    text: 'Greek: ''the one leading in speech'' or ''the chief speaker.'''
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions often read 'Jupiter' and 'Mercury,' using the Roman names for these gods; the Greek text has 'Zeus' and 'Hermes.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 바나바를 제우스라고 하고 바울을 헤르메스라고 부르고 있었습니다. 바울이 말하는 일에서 주도적인 사람이었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δία … Ἑρμῆν
  english_pob_choice: Zeus … Hermes
  chosen_korean: 제우스 … 헤르메스
  alternatives_korean:
  - 주피터 … 머큐리
  lexicon: BDAG
  rationale: 헬라어 신명을 그대로 음역. 「주피터/머큐리」는 라틴 음역이라 본문의 문화적 배경(헬레니즘 도시)과 어긋난다.
