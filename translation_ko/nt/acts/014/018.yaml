  verdict: revise
  source_fidelity: 원문의 καὶ ταῦτα λέγοντες는 ‘이런 말을 하고서야’처럼 시간적 선행·필수 조건을 뜻하지 않고, ‘이런 말을 하면서/이런 말을 했지만’이라는 동시적·양보적 연결입니다. μόλις는 ‘겨우’로 잘 반영되어야 하며, τοῦ μὴ θύειν αὐτοῖς는 군중이 두 사도에게 제사를 드리지 못하도록 막았다는 뜻입니다.
  naturalness: ‘이런 말을 하면서도’는 현대 표준 한국어에서 원문의 양보적 흐름을 자연스럽게 드러냅니다. ‘무리가 그들에게 제사를 드리지 못하게’는 의미 관계가 분명하고 합쇼체 서술에도 적절합니다.
  terminology: ‘제사를 드리다’는 θύειν의 종교적 제의 행위를 적절히 옮깁니다. 원문이 단지 복수 대명사로 표현한 대상을 ‘두 사람’으로 명시할 필요는 없으므로 ‘그들’을 유지합니다.
  issues:
  - severity: medium
    issue: ‘하고서야’가 원문에 없는 시간적·조건적 뉘앙스를 더합니다.
    rationale: καὶ ταῦτα λέγοντες는 ‘이런 말을 하면서/말했지만’이라는 분사 구문이며, ‘~하고서야’는 마치 그 말을 한 뒤에야 저지가 가능했다는 뜻을 암시합니다.
  - severity: low
    issue: ‘자기들에게’의 지시 대상이 문장 구조상 잠시 불명확할 수 있습니다.
    rationale: ‘무리’가 바로 앞에 있어 재귀 대명사의 선행사를 처리하는 데 부담이 생길 수 있으므로, 일반 대명사 ‘그들에게’가 더 명료합니다.
  revised_text: 이런 말을 하면서도 그들은 무리가 그들에게 제사를 드리지 못하게 겨우 막았습니다.
