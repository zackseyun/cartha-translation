base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
  footnotes:
  - marker: a
    text: Or 'thinking that he had died.' The Greek states their assumption, not explicitly that Paul actually died.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 안디옥과 이고니온에서 유대인들이 와서 무리를 설득하고 바울을 돌로 친 뒤, 그가 죽은 줄로 여겨[a] 성 밖으로 끌고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 죽었다고 생각하여.” 헬라어는 그들의 판단을 말할 뿐, 바울이 실제로 죽었는지를 명시하지 않습니다.
    reason: 본문이 바울의 실제 사망이 아니라 가해자들의 추정을 서술한다는 점을 보존합니다.
