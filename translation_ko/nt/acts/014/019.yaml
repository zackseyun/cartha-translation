  text: 그러나 안디옥과 이고니온에서 유대 사람들이 와서 무리를 설득한 뒤에, 바울을 돌로 치고 죽은 줄로 알고 성 밖으로 끌어내었습니다.
  philosophy: optimal-equivalence
