review_pass:
  verdict: revise
  source_fidelity: 초안은 적대자들이 바울이 죽었다고 판단했다는 핵심을 대체로 전달합니다. 다만 ‘죽은 줄로 알고’는 문맥상 가능하나, 그 판단이 그들의 추정일 뿐 바울의 실제 사망을 진술하는 것이 아님을 더 분명히 할 필요가 있습니다. 또한 두 분사의 선후 관계를 ‘설득하고 … 돌로 친 뒤’로 자연스럽게 드러내는 편이 좋습니다.
  naturalness: ‘유대 사람들이’보다 이 문맥에서는 현대 표준어 성경 문체에 맞는 ‘유대인들이’가 자연스럽습니다. ‘성 밖으로 끌어내었습니다’도 가능하지만, 폭력적으로 도시 밖으로 끌고 간 진행 동작에는 ‘성 밖으로 끌고 갔습니다’가 더 매끄럽습니다.
  terminology: ‘안디옥’, ‘이고니온’, ‘유대인’, ‘바울’, ‘성’은 적절합니다. λιθάζω는 ‘돌로 치다’로 옮길 수 있으며, 본문은 바울의 실제 죽음을 단정하지 않고 가해자들의 판단만 서술해야 합니다.
  issues:
  - severity: medium
    issue: 바울의 실제 사망 여부에 관한 표현의 명료성
    rationale: 헬라어 νομίζοντες αὐτὸν τεθνηκέναι는 그들이 바울이 죽었다고 여겼음을 말할 뿐, 바울이 실제로 죽었다고 단정하지 않습니다. 이를 본문과 주석에서 분명히 보존해야 합니다.
  - severity: low
    issue: 연속된 분사의 시간 관계
    rationale: πείσαντες와 λιθάσαντες는 끌고 간 행동에 앞선 행위입니다. ‘설득하고 … 돌로 친 뒤’가 한국어에서 그 순서를 자연스럽게 나타냅니다.
  revised_text: 그러나 안디옥과 이고니온에서 유대인들이 와서 무리를 설득하고 바울을 돌로 친 뒤, 그가 죽은 줄로 여겨[a] 성 밖으로 끌고 갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “그가 죽었다고 생각하여.” 헬라어는 그들의 판단을 말할 뿐, 바울이 실제로 죽었는지를 명시하지 않습니다.
    reason: 본문이 바울의 실제 사망이 아니라 가해자들의 추정을 서술한다는 점을 보존합니다.
  revision_rationale: 가해자들의 도착, 군중 설득, 바울을 돌로 침, 그리고 그가 죽었다고 여겨 도시 밖으로 끌고 감이라는 원문의 흐름을 유지했습니다. ‘그가 죽은 줄로 여겨’와 각주는 본문이 실제 사망 여부를 단정하지 않는다는 해석상 중요한 여지를 보존합니다.
