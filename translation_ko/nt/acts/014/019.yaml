  source_fidelity: 초안은 적대적인 유대 사람들이 안디옥과 이고니온에서 와서 무리를 설득하고 바울을 돌로 친 뒤 성 밖으로 끌어냈다는 핵심 흐름을 대체로 반영합니다. 그러나 헬라어의 마지막 분사 νομίζοντες αὐτὸν τεθνηκέναι는 그들이 바울이 죽었다고 '여겼다/생각했다'는 인식이며, 이 판단은 성 밖으로 끌어낸 행동과 연결되어야 합니다. 초안의 '죽은 줄로 알고 성 밖으로 끌어내었습니다'는 한국어상 죽었다는 사실을 전제하는 듯한 연결이 될 수 있어, 상대방의 추정임을 더 분명히 보이는 것이 안전합니다.
  naturalness: '''유대 사람들이''는 현대 표준어 합쇼체 성경 문맥에서 자연스럽고, ''돌로 쳤습니다''와 ''성 밖으로 끌어냈습니다''도 명료합니다. 다만 사건 순서와 마지막의 추정 관계를 자연스럽게 드러내도록 문장 배열을 다듬는 편이 좋습니다.'
  terminology: 고유명사 '안디옥', '이고니온', 인명 '바울', 집단명 '유대 사람들'은 적절합니다. '무리'는 복수 ὄχλους를 문맥상 무리들로 옮기는 것이 더 직접적입니다. '죽었다고 여기면서'는 실제 죽음을 단정하지 않고 본문의 미결성을 보존합니다.
  issues:
  - severity: medium
    issue: 마지막 추정 표현의 연결이 불명확함
    rationale: νομίζοντες는 공격자들이 바울이 죽었다고 여긴 상태/이유를 나타낼 뿐 바울의 실제 죽음을 진술하지 않습니다. 이를 '죽었다고 여기면서'로 명시하여 본문의 한계를 보존해야 합니다.
  - severity: low
    issue: ὄχλους의 복수성이 약화됨
    rationale: '''무리를''도 가능하지만, 원문의 복수와 여러 군중 집단이라는 표현을 살려 ''무리들을''이 더 적절합니다.'
  revised_text: 그러나 안디옥과 이고니온에서 유대 사람들이 와서 무리들을 설득하고 바울을 돌로 친 뒤, 그가 죽었다고 여기면서 그를 성 밖으로 끌어냈습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “그가 죽었다고 생각하면서.” 헬라어는 그들이 바울이 죽었다고 여긴 것을 말할 뿐, 바울이 실제로 죽었다고 명시하지 않습니다.
    reason: 본문은 바울의 실제 죽음이 아니라 공격자들의 추정을 진술하므로, 그 구별을 보존합니다.
  revision_rationale: 원문의 사건 순서(와서—무리들을 설득하고—돌로 치고—성 밖으로 끌어냄)를 유지하고, 마지막 분사가 나타내는 공격자들의 판단을 '그가 죽었다고 여기면서'로 분명히 했습니다. 이 표현은 바울의 실제 사망 여부를 본문 이상으로 단정하지 않습니다.
