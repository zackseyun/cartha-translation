  terminology: ‘권한 있는’은 δυνατοί의 문맥상 가능한 의미를 잘 살립니다. 각주에서 ‘유력한’이라는 대안을 제시하여 어휘의 폭을 보존하는 것도 적절합니다. ‘고발하다’는 κατηγορεῖν의 법적 문맥에 알맞습니다.
