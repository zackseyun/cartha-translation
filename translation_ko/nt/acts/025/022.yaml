  text: Ἀγρίππας δὲ πρὸς τὸν ⸀Φῆστον· Ἐβουλόμην καὶ αὐτὸς τοῦ ἀνθρώπου ἀκοῦσαι. ⸀Αὔριον, φησίν, ἀκούσῃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
  footnotes:
  - marker: a
    text: Or, 'I too wanted to hear the man,' taking καὶ αὐτὸς with an additive sense rather than primarily emphatic.
    reason: lexical_alternative
  - marker: b
    text: 'Greek has the historical present: ''he says.'' Some translations smooth this to ''he said.'''
    reason: lexical_alternative
  - marker: c
    text: Or, 'you will hear from him.' The Greek expression can mean hearing the person speak directly.
    reason: lexical_alternative
translation:
  language: ko
  text: 아그립바가 베스도에게 말했습니다. “저도[a] 그 사람의 말을 들어 보고 싶습니다.” 베스도가 말합니다[b]. “내일 그 사람의 말을 들으실 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저 자신도’. 그리스어 καὶ αὐτός는 ‘나도’라는 첨가의 뜻과 ‘바로 나 자신’이라는 강조의 뜻을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 역사적 현재, 곧 ‘말합니다’를 사용합니다. 일부 번역은 문맥에 맞추어 ‘말했습니다’로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그를 들으실 것입니다’. 이 문맥에서는 그 사람이 말하는 것을 듣는다는 뜻입니다.
    reason: lexical_alternative
