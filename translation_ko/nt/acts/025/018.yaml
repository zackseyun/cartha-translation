- from: 고발자들이 일어섰을 때, 그들은 제가 예상했던 악행에 대해서는 아무 고발도 가져오지 않았습니다.
  to: 고발자들이 일어섰을 때, 그들은 제가 의심했던 악행에 대해서는 어떠한 고발도 제기하지 않았습니다.
  rationale: 법정 관용구를 자연스러운 한국어로 바로잡고, 화자의 지속적인 의심을 나타내는 미완료형의 의미를 ‘의심했던’으로 반영했습니다. ‘악행’은 πονηρῶν을 ‘범죄’로 과도하게 한정하지 않습니다.
