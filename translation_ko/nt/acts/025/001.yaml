  source_fidelity: 초안의 ‘부임하여’는 ἐπιβὰς τῇ ἐπαρχείᾳ가 문맥상 직무 개시를 함축할 수는 있어도, 본문 자체가 확정적으로 말하는 ‘속주에 도착함/들어감’보다 한 단계 해석을 더한 표현입니다. ‘속주에 도착한 지 사흘 뒤에’로 옮기면 시간 관계와 지리적 이동을 충실히 보존합니다.
  naturalness: ‘속주에 도착한 지 사흘 뒤에 가이사랴에서 예루살렘으로 올라갔습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, ‘올라가다’의 예루살렘 관용을 유지합니다.
  terminology: 베스도, 가이사랴, 예루살렘은 통용되는 성경식 한국어 표기입니다. ‘속주’는 로마 행정 단위 ἐπαρχεία에 적절합니다.
  issues:
