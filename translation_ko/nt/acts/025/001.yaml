    issue: ‘부임하여’가 원문의 의미를 다소 좁힙니다.
    rationale: ἐπιβὰς는 문자적으로 속주에 들어가거나 도착한 것을 가리키며, 부임·직무 인수는 가능한 함의이지만 본문에 명시된 뜻으로 단정하기 어렵습니다.
  revised_text: 베스도가 그 속주에 도착한 지 사흘 뒤에 가이사랴에서 예루살렘으로 올라갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그 속주에 들어간 뒤’ 또는 ‘그 속주의 직무를 맡은 뒤’. 그리스어 분사는 베스도가 속주에 도착한 일을 가리키며, 문맥상 행정 업무를 시작한 것을 함축할 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 시간적 분사와 그 의미 범위를 보존하기 위해 ‘부임하여’를 ‘그 속주에 도착한 지’로 수정했습니다. 직무 인수라는 가능한 해석은 각주에 남겨 본문의 불필요한 해석적 확정을 피했습니다.
