  text: 그가 그들 가운데서 여드레나 열흘을 넘기지 않고 머문 뒤, 가이사랴로 내려갔습니다. 다음 날 그는 재판석[a]에 앉아 바울을 데려오라고 명했습니다.
  philosophy: optimal-equivalence
