  - severity: medium
    issue: 인용문의 하오체 사용
    rationale: ‘그대가 … 것이오’는 목표로 지정된 현대 표준어 합쇼체와 일치하지 않습니다. 합쇼체인 ‘당신이 … 갈 것입니다’로 통일해야 합니다.
