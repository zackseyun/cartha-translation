  source_fidelity: 핵심 법정 의미는 대체로 잘 옮겼습니다. 그러나 συμβούλιον은 현대 정치 제도인 ‘의회’라기보다 총독의 자문·참의 기구를 가리키므로 ‘자문단’이 더 정확합니다. 또한 ἐπὶ Καίσαρα의 법정적 방향성에 관한 영어 감사 주석의 대안 독법을 한국어에도 반영하는 것이 적절합니다.
