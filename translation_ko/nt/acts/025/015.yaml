  naturalness: ‘그에 관하여 제게 알리고, 그에게 유죄 판결을 내려 달라고 요구했습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 법적 문맥도 분명합니다.
  terminology: ἀρχιερεῖς는 ‘대제사장들’, πρεσβύτεροι τῶν Ἰουδαίων는 ‘유대인의 장로들’로 유지합니다. καταδίκη는 본문에서 자연스러운 법률 용어인 ‘유죄 판결’로 옮기고, 각주에서 ‘정죄’라는 보다 직역적인 대안을 제시합니다.
