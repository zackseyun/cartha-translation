  source_fidelity: 개정이 필요합니다. τῷ κυρίῳ는 이 문맥에서 로마 황제를 가리키며, 초안의 「주(主)이신 분」은 기독교 신학 용례를 불필요하게 환기하고 원문의 소유 표현도 반영하지 못합니다. 또한 προήγαγον은 단순히 ‘끌어내다’보다 공식적으로 사람들 앞에 ‘데리고 나오다/제시하다’라는 뜻이며, σχῶ τί γράψω는 쓸 수 있게 되는 능력보다 쓸 내용을 확보하려는 목적을 나타냅니다.
  naturalness: 「주(主)이신 분께」「확실한 것을 써 드릴 것이 없습니다」「신문이 이루어진 후」는 현대 표준어 합쇼체의 행정·법정 문맥에서 부자연스럽거나 뜻이 흐립니다. 「황제 폐하께 쓸 만한 확실한 내용」「심문이 있은 뒤」가 자연스럽고 정확합니다.
  terminology: 황제에 대한 κύριος는 본문에서 「황제 폐하」로 명시하고, 각주에서 직역 「내 주께」와 황제라는 지시 대상을 설명하는 것이 적절합니다. ἀνάκρισις는 현대어에서 신문과 혼동될 수 있으므로 법적 맥락의 「심문」으로 옮기고 대안 번역을 각주로 제시합니다.
