    issue: σχῶ τί γράψω를 「무엇을 쓸 수 있게」로 번역함
    rationale: 원문은 황제에게 보낼 보고서에 쓸 내용을 얻고자 하는 목적입니다. 능력 획득으로 읽히지 않도록 「쓸 내용을 얻기」로 옮기는 편이 정확합니다.
