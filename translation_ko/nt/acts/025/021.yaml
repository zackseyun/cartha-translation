- from: 그러나 바울이 황제의[a] 결정을 위해 자기를 구류해 달라고 상소했으므로, 저는 그를 카이사르에게 보낼 때까지 구류해 두라고 명했습니다.」
  to: 그러나 바울이 황제의[a] 판결을 받도록 자신을 구금해 달라고 상소하였으므로, 저는 그를 카이사르에게 보낼 때까지 구금해 두라고 명령했습니다.
  rationale: 법률 문맥에서 διάγνωσιν의 사법적 의미와 εἰς의 목적 관계를 ‘황제의 판결을 받도록’으로 명료하게 했습니다. 두 번 나오는 τηρέω는 모두 공식 구금을 뜻하므로 ‘구금’으로 통일했으며, 불필요한 종결 인용부호를 삭제했습니다. 황제 칭호에 관한 각주는 원문의 칭호성과 역사적 대응어를 더 정확하고 자연스럽게 설명하도록 다듬었습니다.
