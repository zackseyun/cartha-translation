  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
  footnotes:
  - marker: a
    text: Or 'for the decision of the Emperor.' The Greek has 'the August One' (Σεβαστός), the imperial title equivalent to 'Augustus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바울이 황제의[a] 판결을 받도록 자신을 구금해 달라고 상소하였으므로, 저는 그를 카이사르에게 보낼 때까지 구금해 두라고 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 「존엄하신 분」(Σεβαστός)이며, 라틴어 「아우구스투스」에 해당하는 로마 황제의 칭호이다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Σεβαστοῦ
  english_pob_choice: the Emperor
  chosen_korean: 황제의
  alternatives_korean:
