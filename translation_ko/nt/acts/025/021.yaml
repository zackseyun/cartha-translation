    issue: ‘황제의 결정을 위해’가 εἰς ... διάγνωσιν의 법률적 목적 관계를 충분히 드러내지 못함
    rationale: 바울의 요청은 황제의 사법적 판단을 받기까지 자신을 구금해 달라는 공식 상소입니다. ‘판결을 받도록’은 이 관계를 자연스럽고 정확하게 표현합니다.
