- from: 오히려 그들은 자기들의 종교에[a] 관한 몇 가지 논쟁점과, 죽은 어떤 예수라는 사람에 관한 것을 그와 두고 있었는데, 바울은 그가 살아 있다고 주장합니다.
  to: 오히려 그들은 그에게 자기들의 종교에[a] 관한 몇 가지 쟁점과 죽은 어떤 예수에 관한 쟁점을 제기했을 뿐이었는데, 바울은 그가 살아 있다고 주장하였습니다.
  rationale: 수정문은 페스투스가 예상했던 범죄 혐의와 실제로 제기된 종교적 쟁점을 대조하는 ‘오히려’를 유지합니다. ‘그에게 … 쟁점을 제기했을 뿐이었는데’는 원문의 대적·법정 문맥을 불필요하게 확대하지 않으면서 εἶχον πρὸς αὐτόν을 자연스럽게 반영합니다. 바울의 발언은 페스투스의 보고라는 원문 관점을 보존하여 과거형 ‘주장하였습니다’로 옮겼습니다.
