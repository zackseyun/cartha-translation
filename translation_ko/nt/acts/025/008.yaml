  source_fidelity: 그리스어의 법정 변론 장면, 세 대상(유대인의 율법·성전·카이사르)에 대한 삼중 부정, 그리고 ἥμαρτον의 ‘죄를 짓다’라는 어휘적 뉘앙스가 충실히 반영되어 있습니다. 다만 ἀπολογουμένου는 바울이 자기 변론을 하는 행위를 가리키므로, 한국어에서는 ‘변론하며 말했습니다’보다 ‘자신을 변호하며 말했습니다’가 법정 문맥과 동작을 더 자연스럽고 분명하게 드러냅니다.
