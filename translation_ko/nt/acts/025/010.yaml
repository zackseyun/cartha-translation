  text: 바울이 말했습니다. 「저는 카이사르의 법정에 서 있습니다. 제가 재판받아야 할 곳은 이곳입니다. 각하께서도 더 잘 아시는 바와 같이, 저는 유대인들에게 아무 잘못도 하지 않았습니다.」
