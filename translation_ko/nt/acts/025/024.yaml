  language: ko
  text: 베스도가 말했습니다. 「아그립바 왕이시여, 그리고 우리와 함께 자리하신 모든 분들이시여, 여러분은 이 사람을 보십니다. 그에 관해 온 유대인 무리가 예루살렘에서도 여기서도 저에게 청원하며 그가 더 이상 살아서는 안 된다고 외쳤습니다.
