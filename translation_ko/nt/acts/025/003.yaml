  to: 그들은 바울에게 불리한 호의를 자기들에게 베풀어, 그를 예루살렘으로 보내 달라고[a] 요청하면서, 도중에 그를 죽이려고 매복을 꾸미고 있었습니다.
  rationale: κατ’ αὐτοῦ를 「바울에게 불리한」으로, αἰτούμενοι χάριν을 「호의를 자기들에게 베풀어 ... 요청하면서」로 옮겨 원문의 관계를 분명히 했습니다. μεταπέμψηται의 ‘불러오게 하다’라는 어휘적 대안은 본문의 선택을 강제하지 않도록 각주에 두었고, ἐνέδραν ποιοῦντες의 동시적 참여는 「요청하면서 ... 매복을 꾸미고 있었습니다」로 보존했습니다.
