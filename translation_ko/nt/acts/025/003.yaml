  source_fidelity: 초안은 바울을 예루살렘으로 옮기도록 요청하고 길에서 죽이려 매복했다는 큰 흐름은 담고 있습니다. 그러나 「바울을 자기들에게 호의로 베풀어」는 αἰτούμενοι χάριν κατ’ αὐτοῦ(바울에게 불리한 호의를 자기들에게 베풀어 달라고 요청함)의 문법 관계와 적대적 뜻을 제대로 나타내지 못합니다. 「데려와 달라」는 μεταπέμψηται의 가능한 문맥적 의미이나, 본문에서는 ‘보내 달라’로 옮기고 대안은 각주에 보존하는 편이 정확합니다.
  naturalness: 개정문은 현대 표준어 합쇼체로 자연스럽고, 요청과 매복이라는 두 동시 행위를 「요청하면서」로 연결합니다. 「도중에」는 κατὰ τὴν ὁδόν을 자연스럽게 반영합니다.
  terminology: 「호의」는 χάρις의 이 문맥상 ‘favor/concession’를 유지하며, 「바울에게 불리한」은 κατ’ αὐτοῦ의 적대적 방향을 명시합니다. 「매복을 꾸미다」와 「죽이다」는 ἐνέδραν ποιεῖν 및 ἀνελεῖν에 적절합니다.
