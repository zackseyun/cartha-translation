  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
  footnotes:
  - marker: a
    text: Or “grant the Jews a favor”; the expression refers to Festus seeking to accommodate Paul's Jewish accusers.
    reason: lexical_alternative
  - marker: b
    text: “The Jews” here refers contextually to the Jewish accusers or leaders pressing the case, not to every Jewish person without distinction.
    reason: cultural_note
  - marker: c
    text: Or “be tried before me” or “have your case heard before me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 베스도는 유대인들에게[b] 호의를 베풀고자[a] 바울에게 대답하여 말했습니다. “예루살렘으로 올라가 거기에서 이 일들에 관하여 내 앞에서 재판을 받기를[c] 원하십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들에게 은혜를 베풀고자.” 이 표현은 베스도가 바울의 유대인 고발자들의 요구를 들어주려 했음을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 “유대인들”은 모든 유대인을 가리키는 말이 아니라, 문맥상 이 사건을 제기하고 압박하던 유대인 고발자들 또는 지도자들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 “내 앞에서 재판받기를” 또는 “내 앞에서 사건을 심리받기를.”
    reason: lexical_alternative
