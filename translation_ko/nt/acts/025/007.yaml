  source_fidelity: 핵심 내용은 대체로 충실합니다. 그러나 καταφέροντες는 법정 문맥에서 고발을 ‘가져오다’보다는 ‘제기하다’로 옮기는 것이 자연스럽고 정확합니다. ‘그들이 입증할 수 없는’은 관계절의 선행사인 고발들을 적절히 수식합니다.
