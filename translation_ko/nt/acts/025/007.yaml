  terminology: Ἰουδαῖοι는 여기서 예루살렘에서 온 유대인 고발자들을 가리키므로 ‘유대인들’이 적절합니다. αἰτιώματα는 ‘고발’ 또는 ‘혐의’로 옮길 수 있으며, 본문에서는 ‘고발’을 유지해도 무방합니다.
