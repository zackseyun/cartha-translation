  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
  footnotes:
  - marker: a
    text: Or 'surrounded him.' The Greek verb can emphasize standing around someone, with the surrounding posture implying pressure in the legal setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Judeans who had come down from Jerusalem.' Here the translation uses 'Jews' because the phrase refers to Jewish accusers from Jerusalem rather than merely residents of Judea.
    reason: lexical_alternative
