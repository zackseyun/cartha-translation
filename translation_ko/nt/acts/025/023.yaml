review_pass:
  verdict: revise
  source_fidelity: 원문의 μετὰ πολλῆς φαντασίας는 공개적인 화려함·성대한 위세를 나타내며, ‘화려한 모습을 하고’가 이를 자연스럽게 살립니다. σύν τε는 천부장들과 그 성의 유력한 남성들이 함께 들어갔음을 연결합니다. ἤχθη는 바울이 그곳으로 인도되었음을 뜻할 뿐, ‘끌려’처럼 강제적·폭력적 뉘앙스를 명시하지 않습니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘알현실’은 왕에게 알현하는 장소라는 뜻이 강해 관청의 심문·청문 맥락인 ἀκροατήριον에는 ‘심문 장소’가 더 적합합니다.
  terminology: 인명은 아그립바, 버니게, 베스도, 바울로 통일했습니다. χιλίαρχοι는 로마 군사 직함을 반영하여 ‘천부장들’로, κατ’ ἐξοχὴν은 직위 단정보다 사회적 저명성을 나타내도록 ‘유력한 사람들’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘바울이 끌려 나왔습니다’
    rationale: ἤχθη는 ‘인도되었다/데려왔다’라는 수동 표현입니다. ‘끌려’는 본문에 없는 강제성과 모욕의 뉘앙스를 더하며, ‘나왔습니다’도 화자의 위치를 전제합니다.
  - severity: low
    issue: ‘알현실’
    rationale: ἀκροατήριον은 공식적인 청문 또는 심문이 이루어지는 장소입니다. ‘알현실’은 군주에게 알현하는 방이라는 의미로 좁혀질 수 있습니다.
  - severity: low
    issue: ‘도성의 지도자들’
    rationale: κατ’ ἐξοχὴν은 지도력이나 공직을 단정하기보다 그 성의 저명하고 유력한 남성들을 가리킵니다.
  revised_text: 다음 날 아그립바와 버니게가 화려한 모습을 하고 와서 천부장들과 그 성의 유력한 사람들과 함께 심문 장소에 들어갔습니다. 베스도가 명령하자 바울이 인도되어 들어왔습니다.
  revised_footnotes:
  - marker: a
    text: ‘화려한 모습을 하고’는 ‘큰 화려함과 위세를 갖추고’ 또는 ‘성대한 의식을 갖추고’로도 옮길 수 있습니다.
    reason: μετὰ πολλῆς φαντασίας의 공개적 과시·화려함이라는 어휘 범위를 보존합니다.
  - marker: b
    text: ‘그 성의 유력한 사람들’은 ‘그 성의 저명한 사람들’로도 옮길 수 있습니다.
    reason: κατ’ ἐξοχὴν은 사회적 탁월성·저명성을 나타내며 특정 공직을 단정하지 않습니다.
  revision_rationale: 원문의 법정·공적 청문 맥락과 수동 동사의 의미를 더 정확히 반영하도록 ‘알현실’과 ‘끌려 나왔습니다’를 고쳤습니다. 또한 ‘지도자들’이 암시할 수 있는 직위 단정을 피했습니다.
