  source_fidelity: 핵심 의미는 잘 옮겼습니다. 그러나 직접 인용문의 종결이 「가라… 보낼 것이다」로 되어 있어 지정된 현대 합쇼체와 일치하지 않습니다. 또한 μακράν의 ‘멀리’와 εἰς ἔθνη의 목적지를 유지하되, 한국어에서는 「멀리 이방인들에게로」가 자연스럽습니다.
  naturalness: 서술부 「그분께서 저에게 말씀하셨습니다」는 자연스럽습니다. 다만 번역의 목표 문체에 맞추어 인용문도 「가십시오… 보낼 것입니다」로 통일하는 것이 적절합니다. 수신자 호칭은 현대 존대 직접화법에서 중립적인 「당신」보다 문어적이면서도 자연스러운 「그대」를 사용했습니다.
  terminology: ἔθνη는 이 문맥에서 유대인과 대비되는 비유대인을 가리키므로 「이방인들」이 적절합니다. 영어 감사 기록의 ‘nations’ 대안은 한국어 각주로 보존합니다.
