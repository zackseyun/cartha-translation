source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
  footnotes:
  - marker: a
    text: Literally, 'at the feet of Gamaliel,' an idiom for being trained under a teacher.
    reason: cultural_note
  - marker: b
    text: Or 'the ancestral law.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 길리기아 다소에서 태어났으나 이 성에서 자라, 가말리엘의 발 아래에서[a] 우리 조상들의 율법을 엄격하게 배웠으며, 오늘 여러분 모두처럼 하나님께 열심을 품고 있는 유대인입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「가말리엘의 발 아래에서」는 스승에게서 배우거나 그의 가르침 아래에서 수학함을 뜻하는 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  english_pob_choice: at the feet of Gamaliel
  chosen_korean: 가말리엘의 발 아래에서
  alternatives_korean:
  - 가말리엘 문하에서
  - 가말리엘에게 사사받아
  lexicon: BDAG
  rationale: 관용 표현의 본래 형식을 보존하고 각주로 의미를 풀어준다.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  english_pob_choice: being zealous for God
  chosen_korean: 하나님께 대해 열심이 있는 사람
  alternatives_korean:
  - 하나님을 위한 열심당
  - 하나님께 열심을 품은 자
  lexicon: BDAG
  rationale: ζηλωτής는 정치적 「열심당」을 가리킬 수도 있으나 여기서는 종교적 열정의 일반 의미. 「열심」을 「하나님께 대해」와 결합해 자연스럽게 옮긴다.
