  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 마지막 절의 ἐπιγνούς(알고/깨닫고)는 ‘그가 로마 시민임’과 ‘자신이 그를 결박했음’ 모두에 걸리므로, 현 번역의 ‘...알고는 ...때문에’보다 두 사실을 병렬로 밝혀 주는 편이 원문 구조와 인과관계를 더 정확히 드러냅니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그에게서 물러갔고’와 ‘두려워했습니다’도 문맥에 잘 맞습니다. 마지막 인과 표현만 다듬으면 더 명료하고 자연스럽습니다.
  terminology: ‘신문’은 ἀνετάζειν의 공적 심문 의미를 적절히 살리며, 각주의 채찍질에 의한 심문 설명도 문맥에 부합합니다. ‘천부장’은 전통적 성경 용어로 사용할 수 있고, ‘지휘관’ 대안 각주도 유익합니다. ‘로마 시민’과 ‘결박’ 역시 정확합니다.
  issues:
