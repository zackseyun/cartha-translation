    issue: 마지막 절에서 ‘알고는’의 범위와 ‘때문에’의 인과관계가 다소 불명확합니다.
    rationale: 그리스어는 천부장이 바울이 로마 시민이라는 사실과 자신이 바울을 결박한 사실을 깨닫고 두려워했다고 말합니다. 두 내용을 병렬로 번역하면 ἐπιγνούς 및 καὶ ὅτι ... καὶ ὅτι의 구조를 더 충실히 반영합니다.
