  text: Now those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
  footnotes:
  - marker: a
    text: Or 'they did not understand the voice.' Compare Acts 9:7, where Paul's companions are said to hear the sound/voice; the difference may be between hearing a sound and understanding the speaker.
    reason: alternative_reading
translation:
  language: ko
  text: 저와 함께 있던 자들은 그 빛은 보았으나, 저에게 말씀하시는 분의 음성은 듣지[a] 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「음성을 알아듣지 못했습니다」. 사도행전 9:7과 비교하면 동료들이 소리는 들었으나 그 말씀의 내용을 알아듣지 못한 것을 가리킬 수 있다.
    reason: alternative_reading
