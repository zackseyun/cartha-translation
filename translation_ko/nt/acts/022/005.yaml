review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 「저를 위해 증언」은 μοι를 한국어에서 다소 부자연스럽고 오해 가능하게 처리합니다. 문맥상 바울의 진술을 확증하는 증언이므로 「이를 증언합니다」가 더 정확합니다. δεδεμένους는 이미 결박된 상태를 나타내므로 「결박하여」보다 「결박된 채」가 충실합니다.
  naturalness: 「이는 … 바입니다」와 「그곳으로 가는 길이었습니다」는 다소 문어적·우회적입니다. 현대 표준어 합쇼체로 문장을 직접적으로 정리했습니다.
  terminology: πρεσβυτέριον은 교회 제도 용어로 들릴 수 있는 「장로회」보다 역사적 집단을 분명히 하는 「장로들 전체」로 옮겼습니다. ἀδελφοί는 본문에서 「형제들」로 유지하고, 공동체 전체를 가리킬 수 있다는 영어 감사 기록의 주석을 보존했습니다.
  issues:
  - severity: medium
    issue: 「저를 위해 증언할 수 있는」
    rationale: μαρτυρεῖ μοι는 바울을 위해 변호한다기보다 그의 말/사실을 증언한다는 뜻입니다. 「이를 증언합니다」가 문맥과 한국어 용법에 더 맞습니다.
  - severity: medium
    issue: 「결박하여」
    rationale: δεδεμένους는 완전 수동 분사로, 대상들이 결박된 상태임을 뜻합니다. 바울이 그 자리에서 결박하는 행위로 읽힐 수 있으므로 「결박된 채」로 수정해야 합니다.
  - severity: low
    issue: 「모든 장로회」
    rationale: 현대 한국어에서 특정 교단의 교회 조직을 연상할 수 있습니다. 여기서는 유대 지도자들의 집단을 가리키므로 「장로들 전체」가 더 투명합니다.
  revised_text: 제가 말한 일은 대제사장과 장로들 전체도 증언합니다. 저는 그들에게서 다마스쿠스에 있는 형제들에게[a] 보내는 편지들을 받아, 그곳에 있는 사람들도 결박된 채 예루살렘으로 끌고 와 처벌받게 하려고 다마스쿠스로 가고 있었습니다.
