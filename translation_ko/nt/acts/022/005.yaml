translation:
  language: ko
  text: 이는 대제사장과 모든 장로회가 저를 위해 증언할 수 있는 바입니다. 저는 그들에게서 다마스쿠스에 있는 형제들에게 보내는 편지들을 받아, 거기 있는 자들도 결박하여 예루살렘으로 끌어와 처벌받게 하려고 그곳으로 가는 길이었습니다.
  philosophy: optimal-equivalence
