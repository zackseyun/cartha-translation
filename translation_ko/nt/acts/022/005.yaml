translation:
  language: ko
  text: 제가 말한 일은 대제사장과 장로들 전체도 증언합니다. 저는 그들에게서 다마스쿠스에 있는 형제들에게[a] 보내는 편지들을 받아, 그곳에 있는 사람들도 결박된 채 예루살렘으로 끌고 와 처벌받게 하려고 다마스쿠스로 가고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
