review_pass:
  verdict: revise
  source_fidelity: 원문의 καὶ를 반영하고, αὐτὸν λέγοντά μοι의 ‘그를/그분이 내게 말씀하시는 것을 보았다’라는 환상 목격 구문을 더 직접적으로 옮기는 것이 좋습니다. 명령의 이중 긴급성(Σπεῦσον … ἐν τάχει)과 예루살렘 밖으로 나가라는 방향성도 유지했습니다.
  naturalness: 초안은 전반적으로 자연스럽지만, ‘그분께서 저에게 말씀하시는 것을’보다 ‘그분이 나에게 말씀하시는 것을’이 목격 대상과 발화 행위를 더 매끄럽게 연결합니다. 인용문의 ‘나에 대한 너의’는 직접 발화 안에서 ‘나에 대한 네’가 자연스럽습니다.
  terminology: ‘증언’은 μαρτυρία의 법정적·선포적 용례에 적절합니다. ‘그분’은 본절의 대명사적 지시를 유지하면서 한국어에서 자연스럽게 존중을 나타냅니다. ‘받아들이다’는 παραδέχομαι에 적합하며, 대안인 ‘받아들여 주다/받다’는 각주로 제시할 수 있습니다.
  issues:
  - severity: low
    issue: 접속사 καὶ가 초안에서 드러나지 않습니다.
    rationale: 서술의 연속을 나타내므로 ‘그리고’를 보충하는 편이 최적 등가에 더 가깝습니다.
  - severity: low
    issue: 직접 인용 안의 2인칭 표현이 ‘너의’로 되어 있습니다.
    rationale: 현대 한국어 직접 발화에서는 ‘네 증언’이 더 자연스럽고, 명령형 ‘나가라’와도 일관됩니다.
  - severity: low
    issue: 영어 감사 기록의 παραδέχομαι 어휘 대안에 대응하는 각주가 없습니다.
    rationale: ‘받아들이다’의 번역 선택을 유지하되 ‘받다’라는 가능한 어휘 대안을 각주로 밝혀 투명성을 높일 수 있습니다.
  revised_text: 그리고 그분이 나에게 말씀하시는 것을 보았습니다. 「서둘러, 빨리 예루살렘에서 나가라. 그들이 나에 대한 네 증언을 받아들이지 않을 것이기 때문이다.」
  revised_footnotes:
  - marker: a
    text: 또는 “나에 대한 네 증언을 받지 않을 것이다.”
    reason: παραδέχονται의 가능한 어휘적 대안(‘받아들이다/받다’)을 제시합니다.
  revision_rationale: 원문의 서술 연결, 환상에서 본 대상의 발화, 긴급성을 나타내는 두 명령적 표현을 보존했습니다. ‘그분’은 원문의 대명사를 한국어로 자연스럽게 처리한 것이며, 본절에 없는 칭호를 추가하지 않습니다. 각주는 본문의 의미를 바꾸지 않고 παραδέχομαι의 어휘적 대안을 제시합니다.
