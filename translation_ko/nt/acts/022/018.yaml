review_pass:
  verdict: revise
  source_fidelity: The draft conveys the vision, the urgent departure from Jerusalem, and the reason that the hearers will not accept Paul's testimony concerning the speaker. However, the direct speech uses plain-style forms (나가라, 너의) rather than the specified modern formal-polite 합쇼체. The two Greek expressions of urgency are best retained without the somewhat redundant Korean sequence '서둘러 빨리.'
  naturalness: The narrative sentence is natural, but the quotation should consistently use formal-polite speech. '서둘러 예루살렘에서 즉시 나가십시오' is idiomatic and preserves the double urgency.
  terminology: '''증언'' appropriately renders μαρτυρία. ''받아들이지 않다'' is a natural rendering of παραδέχομαι in this context; a footnote records the viable alternative ''받지 않다.'' The contextual referent is retained as ''그분'' rather than being interpretively expanded to a title.'
  issues:
  - severity: medium
    issue: Direct quotation is not in the requested modern formal-polite register.
    rationale: The draft has '나가라' and '너의,' which are plain-style/marked forms, while the target variant requires 합쇼체. The speech should use forms such as '나가십시오' and an appropriate formal second-person construction.
  - severity: low
    issue: The paired urgency is awkwardly phrased as '서둘러 빨리.'
    rationale: Σπεῦσον and ἐν τάχει both express urgency, but Korean reads more naturally with '서둘러' plus '즉시' while retaining both elements.
  revised_text: 그분께서 저에게 말씀하시는 것을 보았습니다. 「서둘러 예루살렘에서 즉시 나가십시오. 그들이 나에 대하여 당신이 하는 증언을 받아들이지[a] 않을 것이기 때문입니다.」
  revised_footnotes:
