- from: 그가 말했습니다. 「우리 조상들의 하나님께서 너를 미리 택하여 그분의 뜻을 알게 하시고, 그 의로우신 분을[a] 보게 하시며, 그분의 입에서 나는 음성을 듣게 하셨다.
  to: 그가 말했습니다. 「우리 조상들의 하나님께서 너를 택하셔서 그분의 뜻을 알고, 그 의로우신 분을[a] 보며, 그분의 입에서 나오는 음성을 듣도록 하셨습니다.」
  rationale: 시간적 의미를 덧붙인 「미리」를 제거하고, 선택의 목적을 나타내는 세 병렬 부정사를 한국어의 「…하도록 하셨습니다」 구조로 옮겼습니다. 제목적 표현과 직접적인 ‘입’의 이미지는 보존했으며, 따옴표 누락을 바로잡았습니다.
