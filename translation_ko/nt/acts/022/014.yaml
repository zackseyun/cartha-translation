  - severity: low
    issue: 세 부정사의 목적 관계가 한국어에서 다소 흐립니다.
    rationale: 「알고, 보고, 듣도록」으로 병렬 목적을 명시하면 γνῶναι, ἰδεῖν, ἀκοῦσαι를 자연스럽고 충실하게 반영합니다.
