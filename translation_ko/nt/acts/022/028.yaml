  source_fidelity: 핵심 의미는 대체로 전달되지만, 바울의 말 「저는 태어나면서부터입니다」는 한국어에서 무엇을 두고 말하는지 지나치게 생략되어 자연스럽지 않습니다. 문맥상 함축된 로마 시민권을 밝혀 「태어날 때부터 시민권자입니다」로 옮기는 것이 원문의 법적 신분 의미를 정확히 드러냅니다.
  naturalness: 서술은 합쇼체이나 인용문의 「얻었소」는 하오체여서 요청된 현대 표준 합쇼체와 일관되지 않습니다. 인용문도 합쇼체로 통일하는 것이 자연스럽습니다. 「큰 돈」보다 「많은 돈」 또는 「큰 액수」가 해당 관용적 금액 표현에 더 매끄럽습니다.
