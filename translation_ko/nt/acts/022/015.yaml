  source_fidelity: 원문의 미래형(ἔσῃ), 증인(μάρτυς), 증언의 대상인 모든 사람(πρὸς πάντας ἀνθρώπους), 보고 들은 내용(ὧν ἑώρακας καὶ ἤκουσας)을 유지했습니다. 다만 초안의 ‘모든 사람 앞에서’는 방향·대상 의미의 πρός보다 ‘앞에서’라는 장소/공적 상황을 더 강하게 시사하므로 ‘모든 사람에게’로 고쳤습니다. αὐτῷ의 여격은 본문의 ‘그분을 위하여’와 각주의 ‘그분께’ 대안을 통해 보존했습니다.
