  terminology: ‘증인’은 μάρτυ스의 표준적이고 문맥상 정확한 번역입니다. ‘그분’은 앞 문맥의 주님/예수를 가리키되 본 절에 명시되지 않은 이름을 본문에 보충하지 않습니다. ‘모든 사람’은 ἄνθρωποι의 포괄적 의미를 반영합니다.
