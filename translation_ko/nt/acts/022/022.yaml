  source_fidelity: 그리스어의 미완료 과거 Ἤκουον은 지속해서 듣고 있던 행위를, ἄχρι τούτου τοῦ λόγου는 바울의 발언 중 ‘이 말/이 대목까지’를 가리킵니다. ἐπῆραν τὴν φωνὴν은 ‘목소리를 높여’로 충실합니다. Αἶρε ἀπὸ τῆς γῆς는 그를 산 사람들 가운데서 제거하라는, 문맥상 죽음을 요구하는 외침이며, οὐ ... καθῆκεν αὐτὸν ζῆν은 그가 살아 있는 것이 마땅하지 않다는 판단입니다.
  naturalness: 초안의 ‘그는 살려 둘 자가 못 됩니다’는 자연스럽지만 원문의 비인칭적 ‘마땅함’ 표현을 ‘살려 둘 자격’이라는 평가로 다소 바꿉니다. ‘그가 살아 있는 것은 마땅하지 않습니다’가 현대 표준어 합쇼체 안에서 원문의 표현과 의미를 더 직접적으로 보존합니다. ‘듣다가’는 지속성을 충분히 드러내지 못할 수 있어 ‘듣고 있었습니다’로 다듬었습니다.
  terminology: ‘그런 자’는 τὸν τοιοῦτον의 경멸적 지시를 적절히 보존합니다. ‘땅에서 없애 버리십시오’는 αἶρε ... ἀπὸ τῆς γῆς의 제거 요구를 자연스럽게 옮기며, 주석에서 죽음 요구라는 문맥적 함의를 명시합니다.
