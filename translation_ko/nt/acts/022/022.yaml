  text: 그들은 이 말까지는 그의 말을 듣고 있었습니다. 그러다가 목소리를 높여 외쳤습니다. 「그런 자를 땅에서 없애 버리십시오[a]. 그가 살아 있는 것은 마땅하지 않습니다[b].」
  philosophy: optimal-equivalence
