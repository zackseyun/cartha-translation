    issue: ‘살려 둘 자가 못 됩니다’는 καθῆκεν의 ‘마땅하다/적절하다’라는 표현을 ‘자격’ 개념으로 이동시킵니다.
    rationale: 군중의 의도는 유지되지만, 원문의 판단 형식과 더 가까운 번역으로 고칠 수 있습니다.
