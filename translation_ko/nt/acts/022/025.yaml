  text: 그러나 그들이 가죽끈으로 바울을 늘어뜨렸을 때, 바울이 곁에 서 있는 백부장에게 말했습니다. “아직 유죄 판결을 받지 않은 로마 시민을[a] 채찍질하는 것이 여러분에게 합법적입니까?”
