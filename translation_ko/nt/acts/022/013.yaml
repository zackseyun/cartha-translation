  text: 그가 저에게 와서 곁에 서서 저에게 말씀하셨습니다. 「사울 형제여, 다시 보십시오.[a]」 바로 그 시각에 저는 다시 보게 되어 그를 바라보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
