  source_fidelity: 그리스어의 ἐλθὼν πρὸς ἐμέ, ἐπιστάς, 명령 ἀνάβλεψον, αὐτῇ τῇ ὥρᾳ, 그리고 εἰς αὐτόν의 흐름은 대체로 충실히 옮겼습니다. 다만 εἶπέν μοι의 간접목적어 μοι가 한국어 문장에서는 발화 동사에 명시되지 않아, 이를 보완하는 것이 좋습니다.
