  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
  footnotes:
  - marker: a
    text: Or 'see again' / 'regain your sight' for both occurrences of ἀναβλέπω; the verb can also mean 'look up,' but here the blindness-and-healing context favors restoration of sight.
    reason: lexical_alternative
translation:
