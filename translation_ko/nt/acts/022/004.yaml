  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
  footnotes:
  - marker: a
    text: Or 'this path' or 'this movement.' The Greek literally says 'this way,' but in Acts it often functions as a name for the Christian movement.
    reason: lexical_alternative
  - marker: b
    text: Or 'unto death.' The phrase indicates the deadly extent of the persecution.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 이 「길」을[a] 죽음에 이르기까지[b] 박해하여, 남자와 여자 모두를 결박하고 옥에 넘겨주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 「이 길」이라고 합니다. 사도행전에서는 그리스도인 운동 또는 공동체를 가리키는 호칭으로 자주 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「죽음에 이를 정도로」. 이 표현은 박해의 치명적인 범위를 나타내며, 바울이 직접 사람들을 죽였다고 단정하지는 않습니다.
    reason: lexical_alternative
