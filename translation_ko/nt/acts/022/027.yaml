  verdict: revise
  source_fidelity: 초안은 χιλίαρχος를 ‘천부장’으로 옮기고 긍정 대답을 보존했으나, προσελθών의 접근 동작이 ‘와서’로 다소 약화되었습니다. 또한 직접 의문문을 ‘…인지 나에게 말하시오’라는 간접 구성으로 바꾸어 Λέγε μοι, σὺ Ῥωμαῖος εἶ;의 발화 구조와 질문의 직접성을 충분히 살리지 못합니다. 문맥상 Ῥωμαῖος는 로마 시민의 법적 신분을 뜻하므로 본문에서 ‘로마 시민’으로 명시하는 것이 한국어에서 정확합니다.
  naturalness: ‘당신이 로마 사람인지 나에게 말하시오’는 현대 표준 한국어의 자연스러운 대화체가 아니며, 합쇼체도 일관되게 구현하지 못합니다. ‘말해 보십시오. 당신은 로마 시민입니까?’가 직접적이고 자연스러운 현대 합쇼체입니다.
  terminology: ‘천부장’은 사도행전의 전통적이며 통용되는 역어로 유지할 수 있습니다. 다만 χιλίαρχος가 로마 군대의 장교를 가리킨다는 대체 역어 주석은 유지합니다. ‘로마 사람’은 국적·출신지 의미로도 읽힐 수 있으므로, 이 문맥의 시민권 의미를 ‘로마 시민’ 및 주석으로 명료하게 처리합니다.
  issues:
  - severity: medium
    issue: 직접 질문이 부자연스러운 간접 구성으로 바뀜
    rationale: Λέγε μοι 뒤의 σὺ Ῥωμαῖος εἶ;는 직접 질문입니다. ‘…인지 나에게 말하시오’는 현대 한국어에서 어색할 뿐 아니라 원문의 질문 형식을 흐립니다.
  - severity: low
    issue: 접근 동작의 표현 약화
    rationale: προσελθών은 천부장이 바울에게 다가간 뒤 말했음을 나타내므로 ‘다가와’가 적절합니다.
  - severity: medium
    issue: 로마 시민권 의미를 뒷받침하는 문화 주석 누락
    rationale: 영어 감사 기록의 b 주석에 해당하는 정보가 한국어 초안에는 없어 ‘로마 사람’의 법적 의미가 불분명합니다.
  revised_text: 천부장이[a] 다가와 그에게 말했습니다. 「내게 말해 보십시오. 당신은 로마 시민입니까?」 그가 대답했습니다. 「그렇습니다.」
  revised_footnotes:
  - marker: a
    text: 또는 「지휘관」. 헬라어 χιλίαρχος는 로마군 장교를 가리키며, 전통적으로 「천부장」으로 옮겨진다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 「로마 시민」은 법적 의미의 로마 시민권자를 가리킨다. 이는 앞뒤 문맥에서 분명해진다.
    reason: cultural_note
  revision_rationale: 다가오는 동작과 직접 질문의 구조를 보존하고, 현대 표준 합쇼체로 다듬었습니다. ‘로마 시민’은 본문 문맥에서 Ῥωμαῖος의 법적 의미를 정확히 전달하며, 관련 문화 정보를 주석으로 보완했습니다. b 주석은 본문에 표지가 없어도 해당 핵심 문화 주석을 보존하기 위해 제시했습니다.
