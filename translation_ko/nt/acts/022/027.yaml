  source_fidelity: 초안은 χιλίαρχος가 바울에게 와서 질문하고 바울이 긍정하는 기본 의미를 대체로 전달합니다. 그러나 προσελθών의 ‘다가가’라는 움직임과 Ῥωμαῖος가 이 문맥에서 가리키는 법적 시민권 의미를 더 분명하고 자연스럽게 반영할 필요가 있습니다.
  naturalness: ‘와서’보다 ‘다가가’가 원문의 동작을 더 정확히 살립니다. 질문은 ‘내게 말하시오. 당신은 로마 시민이오?’로 옮기면 현대 표준어 합쇼체 안에서 자연스럽고 직접화법의 긴장도 유지됩니다.
  terminology: ‘천부장’은 한국어 성경에서 널리 정착된 χιλίαρχος의 번역으로 유지할 수 있습니다. 다만 로마 군대의 장교라는 역사적 의미를 각주에 밝혀 ‘지휘관’이라는 대안을 제시합니다. ‘로마 시민’은 본문 문맥상 Ῥωμαῖος의 법적 의미를 정확히 드러내며, 직역상의 ‘로마인’은 각주로 보완합니다.
