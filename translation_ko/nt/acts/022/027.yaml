source:
  edition: SBLGNT
  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
  footnotes:
  - marker: a
    text: Or “commander.” The Greek χιλίαρχος refers to a Roman officer, traditionally rendered “tribune” or more generally “commander.”
    reason: lexical_alternative
  - marker: b
    text: “A Roman” here means a Roman citizen in the legal sense, as the surrounding context makes clear.
    reason: cultural_note
translation:
  language: ko
  text: 천부장이[a] 다가가 바울에게 말했습니다. “내게 말하시오. 당신은 로마 시민이오?[b]” 바울이 대답했습니다. “예.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지휘관”. 헬라어 χιλίαρχος는 여기서 로마군 장교를 가리키며, 전통적으로 “천부장”으로 옮긴다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “로마인”. 이 문맥에서는 법적 의미의 로마 시민을 가리킨다.
    reason: cultural_note
