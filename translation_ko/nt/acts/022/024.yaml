  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 εἴπας가 앞선 명령에 수반되는 지시를 도입하므로, 한국어에서도 두 지시의 관계를 더 자연스럽게 드러내는 편이 좋습니다. 또한 두 번째 αὐτόν을 밝혀 ‘그를 신문하라’로 하는 것이 원문을 더 분명히 반영합니다.
  naturalness: 현행의 ‘명하고, … 신문하라고 말했습니다’는 ‘명하다’와 ‘말하다’가 겹쳐 다소 부자연스럽습니다. ‘명령하면서 … 지시했습니다’가 현대 한국어 합쇼체 문장으로 더 매끄럽습니다.
  terminology: ‘천부장’, ‘병영’, ‘채찍질’, ‘신문’은 문맥과 한국어 성서 전통에 잘 맞습니다. ‘병영’에는 문화 주석을, ‘채찍질로 … 신문’에는 어휘 주석을 연결하는 것이 적절합니다.
  issues:
