  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
  footnotes:
  - marker: a
    text: Greek ἱερόν refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: b
    text: Or 'in a trance.' The Greek expression literally says 'to become in a trance,' an idiom for entering a visionary state.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 제가 예루살렘으로 돌아간 뒤 성전에서[a] 기도하고 있을 때, 황홀경에[b] 빠진 일이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἱερόν은 내전이 아니라 성전 경내 전체를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 환상적 상태에 들어가는 것을 가리키는 관용 표현입니다. 또는 ‘황홀경에 있었습니다.’
    reason: lexical_alternative
