  to: 그런데 제가 예루살렘으로 돌아간 뒤 성전에서[a] 기도하고 있을 때, 황홀경에[b] 빠진 일이 있었습니다.
  rationale: ‘그런데 … 일이 있었습니다’로 Ἐγένετο δέ μοι의 서술 전환과 개인적 경험을 반영했습니다. ‘돌아간 뒤’는 부정과거 분사의 선행 시간을, ‘기도하고 있을 때’는 동시 진행을 나타냅니다. 성전 관련 각주는 ἱερόν의 범위를 명시하도록 유지했고, ἐκστάσει의 상태 진입 표현은 ‘황홀경에 빠진’으로 간결하게 옮겼습니다.
