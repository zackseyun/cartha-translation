  source_fidelity: 개정이 필요합니다. στρατιώτας는 문맥상 기병 및 δεξιολάβοι와 구별되는 병력이나, 본문이 명시적으로 ‘보병’이라고 한 것은 아니므로 ‘병사’가 더 안전합니다. 또한 Ἑτοιμάσατε는 백부장들에게 직접 내린 복수 명령이므로 ‘준비시키시오’보다 ‘준비하십시오’가 적절합니다. ἀπὸ τρίτης ὥρας τῆς νυκτός의 출발 시점은 ‘밤 제삼시부터’로 반영했습니다.
