source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
  footnotes:
  - marker: a
    text: Greek 'the Jews'; here it refers to a particular group among the Jews involved in the plot, not to the Jewish people as a whole.
    reason: cultural_note
  - marker: b
    text: Or 'put themselves under a curse.' The expression refers to a self-imposed oath invoking judgment on themselves if they failed.
    reason: lexical_alternative
translation:
  language: ko
  text: 날이 밝자 유대인들이[a] 음모를 꾸미고 스스로 저주를 받기로 맹세했습니다[b]. 그들은 바울을 죽일 때까지 먹지도 마시지도 않겠다고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 「유대인들」이라고 하지만, 여기서는 음모에 가담한 특정 유대인들을 가리키며 유대 민족 전체를 가리키지 않습니다.
    reason: cultural_note
  - marker: b
    text: 또는 「스스로 저주 아래에 두었습니다」. 이 표현은 맹세를 지키지 못할 경우 자신들이 심판을 받기를 자청하는 자기저주 맹세를 가리킵니다.
    reason: lexical_alternative
