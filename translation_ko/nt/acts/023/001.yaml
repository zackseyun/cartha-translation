  - 시민으로 살아 왔습니다
  lexicon: BDAG
  rationale: 동사는 본래 「시민으로서 살다」의 어원을 갖지만, 여기서는 일반적 도덕적 삶을 가리킨다. 자연스러운 한국어로 「살아 왔습니다」.
