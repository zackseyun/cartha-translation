  source_fidelity: 그리스어의 주어(‘곁에 서 있던 사람들’), 발화 동사, ‘하나님의 대제사장’, 그리고 λοιδορεῖς의 현재형 의문을 대체로 반영합니다. 다만 초안의 ‘곁에 선 자들’과 ‘욕하는 것이오?’는 현대 표준어 합쇼체로는 부자연스럽습니다.
  naturalness: ‘곁에 서 있던 사람들이’가 현대 한국어에서 자연스럽고, 직접 의문문은 ‘모욕하십니까?’로 옮기는 것이 합쇼체 문체와 문맥에 맞습니다. 주어 ‘당신’을 생략해도 질문 대상은 분명하며, 한국어에서 불필요한 ‘당신’이 주는 어색함을 피합니다.
  terminology: ‘대제사장’은 ἀρχιερεύς의 확립된 정확한 역어입니다. ‘하나님의 대제사장’은 τοῦ θεοῦ를 충실히 반영하며, 그 개인에 대한 추가적인 신학적 승인을 함축하지 않습니다. λοιδορεῖς는 본문에서 ‘모욕하다’로 자연스럽게 옮기고, ‘욕하다’는 각주 대안으로 제시합니다.
  issues:
