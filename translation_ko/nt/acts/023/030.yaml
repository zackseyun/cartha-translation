- from: 그러나 이 사람을 해치려는 음모가 있을 것이라는 통고를 받고, 저는 곧 그를 각하께 보냈으며, 고발자들에게도 각하 앞에서 그에 대한 사건을 진술하라고 명했습니다.」
  to: 그런데 이 사람을 겨냥한 음모가 있을 것이라는 보고를 받고, 저는 곧바로 그를 각하께 보냈으며, 그의 고발자들에게도 각하 앞에서 그에 대한 고발 내용을 진술하라고 명령했습니다.
  rationale: 원문의 수동적 보고 수령, 바울을 겨냥한 음모, 즉각적인 파송, 그리고 고발자들에게 수신자 앞에서 고발을 진술하라는 지시를 유지했습니다. δέ의 연결 기능은 「그런데」로, 법정 표현은 「고발 내용」으로 자연스럽게 옮겼습니다.
