  text: 그런데 이 사람을 겨냥한 음모가 있을 것이라는 보고를 받고, 저는 곧바로 그를 각하께 보냈으며, 그의 고발자들에게도 각하 앞에서 그에 대한 고발 내용을 진술하라고 명령했습니다.
