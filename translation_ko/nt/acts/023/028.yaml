base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
  footnotes:
  - marker: a
    text: Or "their Sanhedrin." The Greek συνέδριον refers to a council; in this context it likely denotes the Jewish ruling council in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 제기하는 혐의가 무엇인지 알아보려고, 저는 그를 그들의 의회로 데리고 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 산헤드린.” 그리스어 συνέδριον은 의회 또는 평의회를 뜻하며, 이 문맥에서는 예루살렘의 유대 최고 의회를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
