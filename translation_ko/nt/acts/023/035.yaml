source:
  edition: SBLGNT
  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
  footnotes:
  - marker: a
    text: Or, “I will hear you fully.” The Greek verb can mean to hear someone out completely; in this legal context, “hear your case fully” makes the judicial sense explicit.
    reason: lexical_alternative
  - marker: b
    text: Praetorium refers to the official residence or headquarters of the Roman governor; here, likely Herod’s palace in Caesarea.
    reason: cultural_note
translation:
  language: ko
  text: 「당신을 고발하는 사람들도 도착하면, 당신의 사건을 심리하겠습니다」라고 그가 말했습니다. 그리고 그는 그를 헤롯의 관저[a]에서 지키도록 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 관저(프라이토리온)는 로마 총독의 공식 거처 또는 본부를 가리킵니다. 여기서는 가이사랴에 있던 헤롯의 왕궁을 가리키는 것으로 보입니다.
    reason: cultural_note
