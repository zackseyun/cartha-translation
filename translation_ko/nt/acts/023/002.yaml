  terminology: ‘대제사장’, ‘아나니아’, ‘명령했습니다’, ‘입을 치다’는 적절합니다. ‘바울의 입’으로 지시 대상을 명확히 하되, 때리는 방식은 특정하지 않아 τύπτειν의 폭넓은 의미를 보존합니다.
