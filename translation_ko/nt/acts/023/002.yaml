  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 αὐτοῦ는 문맥상 바울을 가리키므로, 한국어의 ‘그의’가 대제사장 아나니아를 가리킬 수 있는 모호함을 피하는 것이 좋습니다. παρεστῶσιν은 곁에 서 있거나 시중드는 사람들을 뜻하므로 ‘곁에 서 있는 사람들’이 자연스럽고 충실합니다.
