  source_fidelity: 초안의 ‘죄도 짓지 않았음’은 ἔχοντα ἔγκλημα(그에게 제기된 혐의/고발)가 가리키는 법적 혐의의 부재를 실제 범죄를 짓지 않았다는 무죄 판단으로 바꾸므로, 원문의 법정적·절차적 표현을 넘어섭니다. ‘결박’은 직역상 가능하나 여기서는 사형과 병렬되는 법적 처분을 가리키므로 ‘구금’이 현대 한국어에서 더 자연스럽습니다.
  naturalness: ‘그들의 율법 문제’는 다소 어색하고, ζητημάτων의 논쟁·쟁점의 뜻이 충분히 드러나지 않습니다. ‘그들의 율법에 관한 쟁점들’과 ‘사형이나 구금에 해당할 만한 혐의’는 현대적이면서도 격식 있는 합쇼체 문장입니다.
  terminology: νόμος는 ‘율법’, ἐγκαλούμενον은 ‘고발당하고 있었다’, ἔγκλημα는 ‘혐의’로 옮겼습니다. ‘사형’은 θανάτου의 법적 문맥을, ‘구금’은 δεσμῶν의 법적 결과를 적절히 반영합니다.
  issues:
  - severity: high
    issue: ‘어떤 죄도 짓지 않았음’
    rationale: 원문은 바울이 사형이나 결박에 해당할 혐의로 고발되지 않았다는 보고이지, 그가 실제로 아무 죄도 범하지 않았다는 단정이 아닙니다.
  - severity: medium
    issue: ‘그들의 율법 문제’
    rationale: ζητημάτων은 단순한 ‘문제’보다 논쟁 중인 질문 또는 쟁점이라는 뜻이므로 ‘율법에 관한 쟁점들’이 더 정확하고 자연스럽습니다.
  revised_text: 제가 알게 된 바에 따르면, 그는 그들의 율법에 관한 쟁점들 때문에 고발당하고 있었으나, 사형이나 구금에 해당할 만한 혐의는 없었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들의 율법에 관한 논쟁거리들’.
    reason: ζητημάτων의 ‘쟁점/논쟁거리’라는 어휘적 범위를 보입니다.
  - marker: b
    text: 직역하면 ‘사형이나 결박에 합당한’.
    reason: δεσμῶν의 문자적 표현과 한국어의 법적 의역 ‘구금’을 투명하게 연결합니다.
  revision_rationale: ‘죄를 짓지 않았다’라는 실질적 무죄 판정을, 원문이 말하는 ‘사형이나 구금에 해당할 혐의가 없었다’는 절차적 판단으로 바로잡았습니다. 또한 쟁점의 의미와 법적 문맥을 자연스러운 현대 한국어로 반영했습니다.
