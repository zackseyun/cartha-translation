- from: 바울이 그들 가운데 한쪽이 사두개인이고 다른 쪽이 바리새인임을 알고는, 공의회에서 외쳤습니다. 「형제 여러분, 저는 바리새인이요, 바리새인의 아들입니다. 저는 죽은 자들의 소망과 부활 때문에 심판받고 있습니다.」
  to: 바울은 그들 가운데 한 부류는 사두개인이고 다른 부류는 바리새인인 것을 알고, 공의회에서 외쳤습니다. 「형제 여러분, 저는 바리새인이며 바리새인들의 아들입니다. 저는 죽은 이들의 소망과 부활에 관하여 재판을 받고 있습니다.[a]」
  rationale: The revision corrects the singularization of Φαρισαίων and represents περί as the subject of Paul's trial. The main text keeps the Greek coordination of "hope and resurrection," while the footnote records the viable reading in which the hope is specifically directed toward the resurrection of the dead. No doctrinal interpretation is imposed.
