review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s statement, the present-tense identification of the high priest, and the scriptural prohibition. However, ‘기록되었으되’ is archaic and does not meet the requested modern formal-polite register. The citation’s wording is better rendered with a modern Korean reporting construction.
  naturalness: ‘기록되었으되’ is not natural modern Standard Korean. ‘…라고 기록되어 있기 때문입니다’ is clear, formal, and idiomatic. ‘악담하다’ is understandable but can suggest casual malicious talk; ‘비방하다’ more naturally conveys speaking evil against a ruler in this context.
  terminology: ‘대제사장,’ ‘형제 여러분,’ and ‘백성’ are appropriate. ‘지도자’ is a natural, suitably broad rendering of ἄρχων; it avoids implying a specific modern governmental office while retaining the source’s generic sense.
  issues:
  - severity: medium
    issue: 'Archaic connective and citation formula: ‘기록되었으되’'
    rationale: This form is not modern formal-polite Korean. The Greek γέγραπται γάρ is naturally represented by ‘…라고 기록되어 있기 때문입니다.’
  - severity: low
    issue: ‘악담하지 말라’ may be semantically less precise
    rationale: While possible, ‘악담하다’ often has a colloquial sense of saying malicious things. ‘비방하지 말라’ more directly conveys the prohibition on speaking evil of a ruler.
  revised_text: 바울이 말했습니다. “형제 여러분, 저는 그가 대제사장인 줄 알지 못했습니다. ‘너는 네 백성의 지도자를 비방하지 말라’라고 기록되어 있기 때문입니다.”
  revised_footnotes:
  - marker: a
    text: 또는, “너는 네 백성의 지도자를 헐뜯지 말라.”
    reason: ‘비방하다’는 οὐκ ἐρεῖς κακῶς의 자연스러운 현대 한국어 번역이며, ‘헐뜯다’는 ‘악하게 말하다’라는 표현의 가능한 어휘적 대안을 제시합니다.
  revision_rationale: 현대 합쇼체에 맞지 않는 ‘기록되었으되’를 현대적인 성경 인용 공식으로 바꾸고, 금지 표현을 더 정확하고 자연스러운 ‘비방하지 말라’로 다듬었습니다. 본문의 ἐστίν이 가리키는 대제사장 직분은 한국어의 ‘대제사장인 줄’에 자연스럽게 보존됩니다.
