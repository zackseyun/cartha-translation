review_pass:
  verdict: revise
  source_fidelity: 핵심 내용은 대체로 충실합니다. 그러나 γέγραπται의 현존하는 성경 인용 공식은 ‘기록되었으되’보다 ‘기록되어 있습니다’가 현대 한국어에서 더 정확하고 자연스럽습니다. 또한 κακῶς는 단순한 험담보다 공적 권위자에 대한 비방·모욕의 뜻을 포함할 수 있으므로 ‘비방하지 말라’가 더 알맞습니다.
  naturalness: 합쇼체 서술은 자연스럽지만, ‘기록되었으되’는 현대 표준어 성경 문체로 다소 고어적입니다. 인용문 앞뒤의 문장부호와 인용 연결도 현대적으로 다듬는 것이 좋습니다.
  terminology: ‘대제사장’, ‘백성’, ‘통치자’는 적절합니다. ‘형제 여러분’은 남성으로 구성된 공의회 청중이라는 문맥과 ἀδελφοί에 잘 맞습니다. ‘비방하다’는 여기서 ‘악하게 말하다/욕하다’의 자연스러운 문어적 표현입니다.
  issues:
  - severity: medium
    issue: ‘기록되었으되’의 문체
    rationale: γέγραπται는 성경 인용을 도입하는 현재적 효력의 완료 수동 표현입니다. ‘기록되어 있습니다’가 그 기능을 보존하면서 현대 합쇼체에 더 자연스럽습니다.
  - severity: low
    issue: ‘악담하지 말라’의 어휘 범위
    rationale: ‘악담하다’는 험담의 뉘앙스로 좁게 들릴 수 있습니다. κακῶς ἐρεῖς는 권위자를 악하게 말하거나 비방하는 행위를 포괄하므로 ‘비방하지 말라’가 더 적합합니다.
  revised_text: 그러자 바울이 말했습니다. “형제 여러분, 저는 그가 대제사장인 줄 알지 못했습니다. 기록되어 있기를, ‘너는 네 백성의 통치자를 비방하지 말라’ 하였기 때문입니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “네 백성의 통치자를 악하게 말하지 말라.”
    reason: κακῶς의 직역적 표현을 제시하며, 본문의 ‘비방하지 말라’가 문맥상 자연스러운 번역임을 보입니다.
  revision_rationale: 현대 표준어 합쇼체에 맞게 성경 인용 공식을 ‘기록되어 있기를’로 고치고, 인용된 금지 명령의 ‘악담하다’를 더 넓고 문맥에 맞는 ‘비방하다’로 조정했습니다. 현재형 ‘그가 대제사장인 줄’은 그가 당시 지닌 직분을 가리키는 한국어 표현으로 유지했습니다.
