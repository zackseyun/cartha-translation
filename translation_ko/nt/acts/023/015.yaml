  source_fidelity: 초안은 주요 어휘를 대체로 반영하지만, ὡς μέλλοντας διαγινώσκειν의 가장/구실의 뉘앙스가 '것처럼 하십시오'라는 별도 명령으로 처리되어 원문의 한 목적절 구조가 흐려졌습니다. 또한 '알리십시오'는 무엇을 알리는지 목적어가 불분명하여, 천부장에게 바울을 데려오도록 요청하는 문맥을 충분히 드러내지 못합니다.
  naturalness: '''천부장에게, 그가''의 쉼표는 부자연스럽고, ''마치 … 것처럼 하십시오''는 앞 명령과 결합되지 않아 현대 한국어 문장으로도 어색합니다. 직접 인용문의 끝에 닫는 인용 부호만 있는 구조 오류도 있습니다.'
  terminology: '''공의회''와 ''천부장''은 문맥상 적절합니다. ''더 정확히 조사하다''는 διαγινώσκειν ἀκριβέστερον을 자연스럽게 옮깁니다. 살해 계획은 ''죽일 준비가 되어 있습니다''가 ἕτοιμοί ἐσμεν의 현재 진술을 더 충실히 반영합니다.'
