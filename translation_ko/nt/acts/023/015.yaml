  to: 그러므로 이제 여러분은 공의회와 함께 천부장에게, 여러분이 그에 관한 일을 더 정확히 조사하려는 것처럼 하여 그를 여러분에게 데려오도록 요청하십시오. 우리는 그가 가까이 오기 전에 그를 죽일 준비가 되어 있습니다.
  rationale: 원문의 명령문(ἐμφανίσατε)과 목적절(ὅπως καταγάγῃ)을 한국어에서 자연스럽게 연결하고, ὡς μέλλοντας가 나타내는 가장된 조사 의도를 '…것처럼 하여'로 보존했습니다. 현재의 준비 상태와 접근 전이라는 시간·공간적 제한도 반영했습니다.
