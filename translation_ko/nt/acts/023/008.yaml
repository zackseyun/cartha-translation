  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
  footnotes:
  - marker: a
    text: Or, 'the Pharisees acknowledge all three'—that is, resurrection, angel, and spirit. The Greek says 'both,' which most directly points to 'angel' and 'spirit,' but some understand it more broadly from the context.
    reason: alternative_reading
translation:
  language: ko
  text: 사두개인들은 부활도 없고 천사도 없고 영도 없다고 말하지만, 바리새인들은 그 둘[a] 다를 인정하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「바리새인들은 셋 모두를 인정한다」 — 곧 부활과 천사와 영. 헬라어는 「둘 다」라고 하는데, 가장 직접적으로는 「천사」와 「영」을 가리킬 수 있으나 더 넓게 이해되기도 한다.
    reason: alternative_reading
