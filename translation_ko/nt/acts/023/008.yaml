  source_fidelity: 초안은 사두개인들의 부활·천사·영 부정과 바리새인들의 긍정을 대체로 정확히 옮깁니다. 그러나 「말하지만 … 인정하기 때문입니다」는 원문의 γάρ(설명)의 연결을 한국어에서 부자연스럽고 불완전하게 처리합니다. τὰ ἀμφότερα의 ‘둘’은 본문에서 유지하고, 가능한 더 넓은 문맥적 이해는 각주에 보존하는 것이 적절합니다.
  naturalness: 「말하지만」과 문말 「때문입니다」의 결합은 현대 표준 한국어 합쇼체에서 어색합니다. 「말하고, … 인정하기 때문입니다」로 하면 이 절이 앞 문맥을 설명하는 문장이라는 기능이 자연스럽게 드러납니다.
  terminology: 「사두개인들」, 「바리새인들」, 「부활」, 「천사」, 「영」은 적절합니다. 「인정하다」는 ὁμολογοῦσιν의 여기 문맥에서 자연스럽습니다.
  issues:
  - severity: medium
    issue: 접속 표현의 불일치
    rationale: 원문의 μὲν γὰρ … δὲ는 대조를 포함한 설명적 배경 진술인데, 초안의 「말하지만 … 인정하기 때문입니다」는 역접과 이유 종결을 부자연스럽게 결합하여 문장 연결을 흐립니다.
  revised_text: 사두개인들은 부활도 없고 천사도 없고 영도 없다고 말하고, 바리새인들은 둘 다를 인정하기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「바리새인들은 셋 모두를 인정한다」—곧 부활과 천사와 영. 헬라어는 「둘 다」라고 하며, 가장 직접적으로는 「천사」와 「영」을 가리킨다. 그러나 문맥상 더 넓게 이해하기도 한다.
    reason: alternative_reading
  revision_rationale: 문말의 「때문입니다」에 맞게 앞부분을 「말하고」로 고쳐 γάρ의 설명 기능을 자연스럽게 반영했습니다. 본문은 헬라어의 「둘 다」를 그대로 유지하며, 부활까지 포함한 세 항목으로 이해하는 견해는 각주에 남겼습니다.
