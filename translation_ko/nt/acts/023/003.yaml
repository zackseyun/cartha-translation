review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the legal contrast and the commanded beating, but '치실 것이오' reduces μέλλει + infinitive to a simple future and does not retain its impending/imminent force. '회칠한 담벼락 같은 자여' weakens and expands the direct vocative τοῖχε κεκονιαμένε.
  naturalness: The draft is generally understandable in modern formal Korean, but '판단하려고 앉아서' can suggest purpose ('sit down in order to judge') rather than Paul's pointed portrayal of someone sitting in judgment. A direct vocative and a more idiomatic rhetorical question are smoother.
  terminology: '''하나님,'' ''율법,'' ''판단하다,'' and ''명하다'' are suitable. ''회칠한 담벼락아'' preserves the established metaphor without interpretive explanation.'
  issues:
  - severity: medium
    issue: The imminence of μέλλει is not represented.
    rationale: '''치실 것이오'' is a plain future. ''곧 ... 치실 것입니다'' retains the impending sense while remaining natural Korean.'
  - severity: medium
    issue: The insult is softened by '같은 자여.'
    rationale: The Greek directly addresses the person as a 'whitewashed wall'; adding '같은 자' changes the metaphor into a comparison.
  - severity: low
    issue: '''판단하려고 앉아서'' may imply purpose rather than concurrent judicial activity.'
    rationale: '''앉아 ... 판단하면서'' better reflects κάθῃ κρίνων (''you sit judging'').'
  revised_text: 그때 바울이 그에게 말했습니다. “하나님께서 곧 당신을 치실 것입니다[a], 회칠한 담벼락아! 당신이 율법대로 나를 판단하려고 앉아 있으면서도, 율법을 어기며 나를 치라고 명하는 것입니까?”
