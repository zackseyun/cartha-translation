source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
  footnotes:
  - marker: a
    text: Or 'God will strike you.' The Greek says literally, 'God is about to strike you,' which may emphasize imminence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 바울이 그에게 말했습니다. “하나님께서 곧 당신을 치실 것입니다[a], 회칠한 담벼락아! 당신이 율법대로 나를 판단하려고 앉아 있으면서도, 율법을 어기며 나를 치라고 명하는 것입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 당신을 치실 것입니다.” 그리스어는 직역하면 “하나님께서 당신을 치시려 합니다”이며, 임박함을 강조할 수 있습니다.
    reason: lexical_alternative
