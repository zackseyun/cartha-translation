  to: 그때 바울이 그에게 말했습니다. “하나님께서 곧 당신을 치실 것입니다[a], 회칠한 담벼락아! 당신이 율법대로 나를 판단하려고 앉아 있으면서도, 율법을 어기며 나를 치라고 명하는 것입니까?”
