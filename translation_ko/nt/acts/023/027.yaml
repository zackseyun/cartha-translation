  text: 이 사람은 유대인들에게 붙잡혀 그들에게 죽임을 당하려 하고 있었는데, 제가 그가 로마인임을 알고 군사들과 함께 가서 그를 구해 냈습니다.
  philosophy: optimal-equivalence
