  source_fidelity: 초안은 전반적으로 원문의 의미를 잘 전달하지만, ‘그가 로마 시민임을 알고 군대와 함께 가서’라는 배열은 앎을 출동·접근의 선행 동기로 한정하여 들리게 합니다. 원문의 μαθών은 구출 행위와 관련된 분사이므로, ‘알고 … 구해 냈습니다’로 두어 원문의 관계를 더 가깝게 보존하는 편이 안전합니다. 또한 Ἰουδαίων의 해석상 대안은 각주로 표시하는 것이 적절합니다.
  naturalness: ‘붙들려’, ‘죽임을 당하려 하고 있었는데’, ‘군대와 함께 가서 그를 구해 냈습니다’는 현대 표준어 합쇼체에서 자연스럽고, 서신 안의 관리의 보고라는 문맥에도 맞습니다.
  terminology: Ῥωμαῖος는 법적 문맥에서 로마 시민권을 가리키므로 ‘로마 시민’이 자연스럽습니다. Ἰουδαίων은 본문에서 ‘유대인들’로 옮기되 ‘유대 사람들’이라는 지리적 의미 가능성을 각주에 보존합니다.
  issues:
  - severity: medium
    issue: ‘로마 시민임을 알고’가 ‘군대와 함께 가서’ 앞에 놓여 원문의 분사 관계가 출동 이전의 앎으로만 읽힙니다.
    rationale: 원문은 ‘군대와 함께 가서 그를 구해 냈습니다’라는 주절에 μαθών(알고/알게 되어)을 결부합니다. 한국어에서는 ‘군대와 함께 가서, 그가 로마 시민이라는 것을 알고 그를 구해 냈습니다’처럼 구출 행위 가까이에 두는 것이 더 충실합니다.
  - severity: low
    issue: Ἰουδαίων의 의미 대안에 대한 각주가 없습니다.
    rationale: 이 낱말은 ‘유대인들’과 ‘유대 사람들’ 모두를 뜻할 수 있으므로, 영어 감사 기록의 어휘 결정에 맞추어 대안을 각주로 남기는 것이 좋습니다.
  revised_text: 이 사람은 유대인들ᵃ에게 붙들려 그들에게 죽임을 당하려 하고 있었는데, 저는 군대와 함께 가서, 그가 로마 시민이라는 것을 알고 그를 구해 냈습니다.
  revised_footnotes:
  - marker: ᵃ
    text: 또는 ‘유대 사람들’. 그리스어 낱말은 민족·종교적 의미의 유대인들을 가리킬 수도 있고, 지리적 의미에서 유대 지방 사람들을 가리킬 수도 있습니다. 여기서는 예루살렘에서 바울에게 맞선 유대인 무리를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 사건 전개와 분사 관계를 더 가깝게 반영하도록 ‘알고’를 구출 동사 가까이 옮겼습니다. ‘로마 시민’은 이 법적 문맥에서 자연스러운 한국어 표현이며, 논쟁 가능한 Ἰουδαίων의 지시 대상은 각주로 보존했습니다.
