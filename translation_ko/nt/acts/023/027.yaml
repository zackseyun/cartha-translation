review_pass:
  verdict: revise
  source_fidelity: ‘죽임을 당할 뻔하였는데’는 결과적으로 죽음을 면했다는 회고적 뉘앙스를 강하게 내므로, μέλλοντα ἀναιρεῖσθαι(죽임을 당하려 하고 있던/막 죽임을 당할)의 임박성을 더 직접적으로 나타내는 표현으로 고치는 것이 안전합니다. 또한 μαθών은 로마인임을 안 사실을 구출 행동과 연결하므로 이를 유지했습니다.
  naturalness: ‘유대인들에게 붙잡혀 … 죽임을 당하려 하고 있었는데’와 ‘군사들과 함께 가서 그를 구해 냈습니다’는 현대 표준어 합쇼체에서 자연스럽고, 편지 안의 1인칭 보고체에도 맞습니다.
  terminology: Ἰουδαίων은 본문에서 통상 ‘유대인들’로 옮기되, 지리적 의미의 ‘유대인/유대 지방 사람들’ 가능성을 각주로 남겼습니다. Ῥωμαῖος는 직역에 따라 ‘로마인’으로 두어 시민권이라는 함의를 본문에 과도하게 명시하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘죽임을 당할 뻔하였는데’
    rationale: ‘거의 죽임을 당했다’는 뜻으로 읽히기 쉬우나, 원문의 μέλλοντα ἀναιρεῖσθαι는 살해가 임박했음을 말합니다. ‘죽임을 당하려 하고 있었는데’가 그 진행·임박의 의미를 더 충실히 보존합니다.
  - severity: low
    issue: Ἰουδαίων의 의미 범위가 본문에만 제시됨
    rationale: 문맥상 ‘유대인들’이 자연스럽지만, 이 그리스어는 ‘유대 지방 사람들’이라는 지리적 의미도 가질 수 있으므로 번역 선택을 투명하게 하는 각주가 유익합니다.
  revised_text: 이 사람은 유대인들에게 붙잡혀 그들에게 죽임을 당하려 하고 있었는데, 제가 그가 로마인임을 알고 군사들과 함께 가서 그를 구해 냈습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘유대 지방 사람들.’ 그리스어는 민족·종교적 의미의 유대인들을 가리킬 수도 있고 유대 지방 사람들을 가리킬 수도 있습니다. 여기서는 예루살렘에서 바울을 반대한 유대인 무리를 가리키는 것으로 보입니다.
    reason: Ἰουδαίων의 가능한 지리적 의미를 보존합니다.
  revision_rationale: 살해의 임박성을 더 정확히 나타내도록 ‘죽임을 당할 뻔하였는데’를 ‘죽임을 당하려 하고 있었는데’로 바꾸었습니다. 군사 집단을 뜻하는 στράτευμα는 한국어에서 과도하게 전체 군대를 연상시킬 수 있는 ‘군대’ 대신 자연스러운 ‘군사들’로 옮겼습니다. 본문은 편지 작성자의 자기 제시를 완화하거나 주변 서술과 조화시키지 않고, 로마인임을 알고 구출했다는 원문의 진술을 그대로 유지합니다.
