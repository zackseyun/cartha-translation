  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Greek term can denote Jews in an ethnic-religious sense or people of Judea in a geographic sense; here it most likely refers to the Jewish crowd/opponents in Jerusalem.
