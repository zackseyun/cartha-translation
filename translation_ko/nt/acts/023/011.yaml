  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
  footnotes:
  - marker: a
    text: Or “Take heart.”
    reason: lexical_alternative
  - marker: b
    text: Or “bear witness”; both verbs for Paul's past and future speaking are from the same witness/testimony word group in Greek.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이튿날 밤에 주께서 그의 곁에 서서 말씀하셨습니다. “용기를 내라. 네가 예루살렘에서 나에 대해 증언한 것처럼, 로마에서도 증언해야 한다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  lexicon: BDAG
  rationale: 문맥상 예수님을 가리키는 κύριος; 글로사리 기본값.
- source_word: εἰς Ῥώμην
  english_pob_choice: in Rome
  chosen_korean: 로마에서도
  alternatives_korean: []
  lexicon: BDAG
  rationale: '글로사리: Ῥώμη→로마. 사도행전 후반부 서사의 전체 종착점을 가리키는 결정적 구절.'
