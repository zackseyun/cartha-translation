  to: 그러므로 그들에게 설득당하지 마십시오[a]. 그들 가운데서 마흔 명이 넘는 사람들이 바울을 죽이려고 매복하여 기다리고 있습니다. 그들은 그를 죽이기 전에는 먹지도 마시지도 않겠다고 스스로 저주를 걸고 맹세했습니다[b]. 이제 그들은 준비를 갖추고 당신에게서 올 약속을 기다리고 있습니다[c].
  rationale: 원문의 피설득 명령, 매복의 현재성, 마흔 명 초과, 살해 전까지 먹고 마시지 않겠다는 자기저주적 맹세, 그리고 천부장에게서 기대하는 약속을 보존했습니다. ‘허락만’의 해석적 제한을 제거하고, 자연스럽지 않은 명사와 짝 없는 인용 부호를 바로잡았습니다.
