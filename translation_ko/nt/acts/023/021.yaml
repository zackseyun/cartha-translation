  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
  footnotes:
  - marker: a
    text: Or 'have put themselves under an oath'; the Greek expression includes the idea of invoking a curse upon themselves if they fail.
    reason: lexical_alternative
  - marker: b
    text: That is, they are waiting for your agreement or authorization.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들에게 설득당하지 마십시오[a]. 그들 가운데서 마흔 명이 넘는 사람들이 바울을 죽이려고 매복하여 기다리고 있습니다. 그들은 그를 죽이기 전에는 먹지도 마시지도 않겠다고 스스로 저주를 걸고 맹세했습니다[b]. 이제 그들은 준비를 갖추고 당신에게서 올 약속을 기다리고 있습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 말에 넘어가지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어 표현은 그들이 맹세를 지키지 못할 경우 자신들에게 저주가 임하기를 자청하는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 이 ‘약속’은 천부장의 확답이나 승인을 가리킬 수 있습니다.
    reason: lexical_alternative
