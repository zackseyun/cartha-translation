    issue: 명령의 직접성
    rationale: 원문의 ἄπαγε는 명령형입니다. ‘데려가 주십시오’는 공손한 부탁의 뉘앙스를 더하므로, 합쇼체를 유지하면서도 ‘데리고 가십시오’로 옮기는 편이 더 직접적입니다.
  - severity: low
    issue: 연결 표현의 자연스러움
    rationale: προσκαλεσάμενος를 ‘불러서’로 처리하면 선행 동작과 발화를 자연스럽게 연결합니다.
