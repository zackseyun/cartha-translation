  verdict: revise
  source_fidelity: 바울이 한 백부장을 불러 천부장에게 청년을 데려가도록 지시하고, 그 청년에게 천부장에게 알릴 일이 있다는 내용을 담아 원문의 의미를 대체로 충실히 옮겼습니다. 다만 ἄπαγε는 상대에게 수행을 요청하는 ‘데려가 주십시오’보다 직접적인 명령인 ‘데리고 가십시오’가 더 가깝습니다.
  naturalness: ‘한 사람을 불러 말했습니다’도 이해되지만, 분사로 이어지는 동작을 ‘불러서 말했습니다’로 연결하면 현대 한국어 서술이 더 자연스럽습니다. ‘백부장 한 사람’은 자연스러운 표현입니다.
  terminology: ἑκατοντάρχης의 ‘백부장’과 χιλίαρχος의 ‘천부장’은 사도행전의 로마 군사 맥락을 반영하는 확립된 번역어입니다. νεανίας의 ‘청년’ 및 ἀπαγγεῖλαι의 ‘알릴 일’도 적절합니다.
