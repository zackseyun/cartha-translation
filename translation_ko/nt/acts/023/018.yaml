  source_fidelity: 원문의 동작 순서(그 청년을 데리고 천부장에게 감)와 바울의 요청 내용은 대체로 충실합니다. 다만 직접 화법에서 천부장에게 ‘당신’이라고 부르는 것은 현대 한국어의 공손한 상황에 맞지 않아, 원문의 δεύτε인칭을 자연스러운 호칭으로 옮길 필요가 있습니다.
  naturalness: ‘당신께’는 특히 부하가 상관에게 말하는 장면에서 대립적이거나 어색하게 들릴 수 있습니다. ‘천부장님께’를 사용하면 현대 표준어 합쇼체의 공손한 대화 관습을 따르면서 의미를 보존합니다. ‘부탁했습니다’는 ἠρώτησεν의 요청 의미를 자연스럽게 전달합니다.
  terminology: ‘천부장’은 χιλίαρχος의 전통적 성경 용어로 유지할 수 있습니다. 다만 로마 군대의 직책이라는 역사적 배경은 각주로 밝혀 두는 것이 좋습니다. ‘죄수 바울’과 ‘청년’은 각각 δέσμιος와 νεανίας에 적절합니다.
  issues:
  - severity: medium
    issue: 직접 화법의 ‘당신께’
    rationale: 원문의 σέ는 단순한 2인칭이지만, 한국어에서 하급자가 상관에게 ‘당신’이라고 직접 부르는 것은 현대 공손한 문체에서 부자연스럽습니다. ‘천부장님께’로 바꾸면 원문의 지시 대상과 대화의 위계를 자연스럽게 나타냅니다.
  - severity: low
    issue: 천부장의 역사적 직책에 대한 안내 부재
    rationale: ‘천부장’은 전통적인 번역어이나 현대 독자에게는 직책의 성격이 불분명할 수 있습니다. 원문의 χιλίαρχος가 로마 군 지휘관을 가리킨다는 간략한 각주가 이해를 돕습니다.
  revised_text: 그가 그 청년을 데리고 천부장¹에게 가서 말했습니다. “죄수 바울이 저를 불러, 이 청년을 천부장님께 데려가 달라고 부탁했습니다. 이 청년이 천부장님께 할 말이 있어서입니다.”
  revised_footnotes:
