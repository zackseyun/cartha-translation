  text: 그래서 그는 그 청년을 데리고 천부장에게 가서 말했습니다. 「죄수 바울이 저를 불러 이 청년을 천부장님께 데려가 달라고 부탁했습니다. 이 청년이 천부장님께 드릴 말씀이 있습니다.」
  philosophy: optimal-equivalence
