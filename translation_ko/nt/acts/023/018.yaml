  source_fidelity: 원문의 행동 연쇄(그 청년을 데리고 천부장에게 감)와 바울의 요청 및 청년이 전할 말이 있다는 설명은 초안에 대체로 반영되어 있습니다. 다만 직접화법의 ‘당신/당신께’는 상관인 천부장에게 말하는 병사의 상황과 현대 한국어의 높임법에 맞지 않으며, ‘저를 불러’ 뒤의 요청 관계도 더 분명히 하는 것이 좋습니다.
  naturalness: ‘당신’은 현대 표준 한국어에서 이 상황의 존대 호칭으로 부자연스럽거나 무례하게 들릴 수 있습니다. ‘천부장님께’와 ‘드릴 말씀이 있습니다’를 사용하면 합쇼체의 공적·격식 있는 서술과 대화가 자연스럽습니다.
  terminology: ‘천부장’은 χιλίαρχος에 대한 한국어 성경의 통용 번역으로 적절합니다. 역사적 직책이 로마 군의 지휘관임을 밝히는 주석을 덧붙여 용어의 의미를 보완할 수 있습니다. ‘죄수 바울’은 δέσμιος를 충실히 옮깁니다.
  issues:
  - severity: medium
    issue: 직접화법의 ‘당신/당신께’
    rationale: 원문은 2인칭 단수이나, 한국어에서는 천부장에게 보고하는 병사가 ‘당신’이라고 부르는 것은 존대와 상황에 맞지 않습니다. 직책 호칭 ‘천부장님’을 써야 합니다.
  - severity: low
    issue: ‘청년을’의 지시성 및 요청의 명료성
    rationale: 원문은 앞 절에서 언급된 νεανίας를 가리키므로 ‘그 청년’을 쓰고, 바울이 병사에게 청년을 데려가 달라고 요청했다는 관계를 명시하면 더 자연스럽고 분명합니다.
  revised_text: 그래서 그는 그 청년을 데리고 천부장에게 가서 말했습니다. 「죄수 바울이 저를 불러 이 청년을 천부장님께 데려가 달라고 부탁했습니다. 이 청년이 천부장님께 드릴 말씀이 있습니다.」
  revised_footnotes:
