  source_fidelity: ‘천부장’은 χιλίαρχος를 적절히 옮기며, 손을 잡은 행동과 사적으로 물은 질문의 핵심도 보존합니다. 다만 ‘따로 물러서서’는 ἀναχωρήσας κατ’ ἰδίαν에 비해 현대 한국어에서 다소 어색하고, 상대와 따로 자리를 옮긴 의미가 덜 분명합니다.
  naturalness: ‘따로 가서’가 현대 표준어에서 더 자연스럽고 문맥상 사적인 대화를 위해 자리를 옮긴 상황을 명료하게 나타냅니다. 질문 종결을 합쇼체로 고쳐 목표 문체를 일관되게 했습니다.
  terminology: ‘천부장’은 로마 군사 직책 χιλίαρχος에 대한 성경 문맥의 통용 번역으로 적절합니다. ‘알릴 것’은 ἀπαγγεῖλαι의 보고·전달 의미를 무리 없이 살립니다.
