    rationale: ἀναχωρέω는 여기서 사적으로 대화하려고 따로 가는 행동을 뜻합니다. ‘따로 가서’가 그 의미를 자연스럽게 전달합니다.
  - severity: low
    issue: 질문 종결이 목표 합쇼체와 불일치
    rationale: 초안의 ‘무엇이냐?’는 해라체입니다. 지정된 현대 공식-공손체에 맞추어 ‘무엇입니까?’로 고칩니다.
