  source_fidelity: ‘천부장’은 χιλίαρχος에 적절하고, ‘그 청년’과 ‘돌려보냈습니다’도 각각 νεανίσκον과 ἀπέλυσε의 문맥을 잘 반영합니다. 다만 원문의 복수형 ταῦτα는 ‘이 일’을 넘어 ‘이 일들/이 사실들’로 옮기는 편이 더 충실합니다. παραγγείλας는 공식적 지시이므로 ‘단단히 일러’보다 ‘명령하고’가 원문의 발화 행위를 더 직접적으로 나타냅니다.
