    rationale: SBLGNT 본문은 ἐξ ἑνός(‘한 사람에게서’)이며, 일부 사본의 ‘한 피에게서’ 이문을 각주로 밝혀 독자가 본문 선택을 확인할 수 있게 해야 합니다.
