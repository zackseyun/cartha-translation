source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
  footnotes:
  - marker: a
    text: Or “the Deity,” “the divine nature,” or “the Godhead.” Greek τὸ θεῖον is a broad term for what is divine; here it refers to the true God in Paul’s argument.
    reason: lexical_alternative
  - marker: b
    text: Or “a carved image” or “an engraved thing.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 하나님의 자녀이므로, 신적인 존재가 금이나 은이나 돌, 곧 사람의 기술과 생각으로 새긴 형상과 같다고 생각해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신적인 존재’는 그리스어 τὸ θεῖον을 옮긴 말입니다. ‘신성’, ‘신격’, 또는 ‘신적 본성’으로도 옮길 수 있습니다. 여기서는 바울의 논증에서 참 하나님을 가리킵니다.
    reason: lexical_alternative
