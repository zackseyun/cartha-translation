  source_fidelity: 초안은 바울이 아테네에서 일행을 기다렸고, 도시의 우상 숭배 상태를 보고 내적으로 강한 동요를 겪었다는 핵심을 전달합니다. 다만 ‘그의 영이 격분하였습니다’는 현대 한국어에서 다소 어색하며, ‘ἐν αὐτῷ’의 내적 강조도 충분히 드러나지 않습니다.
  naturalness: ‘그의 심령이 속에서 격분하였습니다’보다 ‘그의 심령이 크게 격분하였습니다’가 더 자연스럽지만, 원문의 ‘within him’을 반영하려면 ‘내적으로 크게 격분하였습니다’가 자연스럽습니다. ‘심령’은 이 문맥에서 바울 자신의 내적 영을 가리키는 전통적이면서도 이해 가능한 표현입니다.
  terminology: τὸ πνεῦμα αὐτοῦ는 성령이 아니라 바울 자신의 영/내적 존재를 뜻하므로 ‘그의 심령’으로 옮겼습니다. παρωξύνετο의 강한 지속적 동요는 ‘크게 격분하였습니다’로 반영하되, 단순한 슬픔으로 약화하지 않았습니다. κατείδωλον은 ‘우상으로 가득한’으로 유지했습니다.
