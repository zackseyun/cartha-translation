  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
  footnotes:
  - marker: a
    text: Or 'the brothers and sisters'; the Greek says 'brothers' and can refer to fellow believers collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the sea' or 'toward the sea'; the Greek wording may indicate movement as far as the coast without specifying more.
    reason: alternative_reading
translation:
