  text: 그때 형제들[a]이 곧바로 바울을 바다까지[b] 가도록 떠나보냈습니다. 한편 실라와 디모데 두 사람은 그곳에 남아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제자매들’. 그리스어 ‘형제들’은 믿는 이들 공동체 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘바다로’ 또는 ‘바다 쪽으로’. 그리스어 표현은 해안까지 가는 이동을 가리킬 수 있으나, 더 구체적인 목적지는 밝히지 않습니다.
