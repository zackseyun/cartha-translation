source:
  edition: SBLGNT
  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
  footnotes:
  - marker: a
    text: Or, more literally, “some brothers,” referring to fellow believers; the group may have included women depending on context.
    reason: lexical_alternative
  - marker: b
    text: The Greek title is “politarchs,” a local Macedonian term for city officials.
    reason: cultural_note
  - marker: c
    text: Or “the inhabited world”; the phrase can refer to the known civilized world, often the Roman world.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들을 찾지 못하자, 그들은 야손과 몇몇 형제들을 도시 관리들[1] 앞에 끌고 가서 외쳤습니다. “온 세상[2]을 소란하게 한 이들이 여기에도 왔는데,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 그리스어로는 ‘폴리타르크들’이며, 마케도니아 지역에서 쓰인 도시 행정관의 명칭입니다.
    reason: cultural_note
  - marker: '2'
    text: 그리스어는 ‘거주하는 세계’를 뜻하며, 이 문맥에서는 당시 알려진 세계, 흔히 로마 세계를 가리킬 수 있습니다.
    reason: lexical_alternative
