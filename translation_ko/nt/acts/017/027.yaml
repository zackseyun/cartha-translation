translation:
  language: ko
  text: 이는 그들이 하나님을 찾고, 혹시라도 그분을 더듬어 찾아 만나게 하려는 것입니다.[a] 참으로 그분은 우리 각 사람에게서 멀리 계시지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더듬어 찾아’는 제한된 인식이나 어둠 속에서 손으로 더듬듯 찾는다는 뜻입니다.
    reason: ψηλαφήσειαν의 촉각적 탐색 비유를 보존하고 설명합니다.
