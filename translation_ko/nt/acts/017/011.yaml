source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: Now these were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
  footnotes:
  - marker: a
    text: Or 'more noble.' The Greek may refer either to a more commendable disposition or, less likely here, to higher social standing.
    reason: lexical_alternative
  - marker: b
    text: Or 'welcomed the message.'
    reason: lexical_alternative
translation:
  language: ko
  text: 베뢰아 사람들은 데살로니가에 있는 사람들보다 더 고결한 사람들이었습니다[a]. 그들은 모든 열의를 다하여 말씀을 받아들이고[b], 이것들이 과연 그러한지 알아보려고 날마다 성경을 살폈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 고귀한.’ 그리스어는 칭찬할 만한 성품이나 태도를 가리킬 수 있으며, 여기서는 가능성이 낮지만 더 높은 사회적 신분을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 말씀을 환영했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  english_pob_choice: more noble-minded
  chosen_korean: 더 신실하여
  alternatives_korean:
  - 더 고결하여
  - 더 너그러워
  lexicon: BDAG
  rationale: εὐγενής는 본디 「귀족 출신」이나, 여기서는 비유적으로 「열린 마음·고결한 성품」을 가리킨다. 한국 전통 번역의 「신사적」 보다는 「신실하다(공정·진실)」가 본문의 「성경을 살피는」 행위와 잘 어울린다.
