- from: 베뢰아 사람들은 데살로니가 사람들보다 더 신실하여, 말씀을 모든 열심으로 받았으며, 이러한 일들이 그러한가 하여 날마다 성경을 살폈습니다.
  to: 베뢰아 사람들은 데살로니가에 있는 사람들보다 더 고결한 사람들이었습니다[a]. 그들은 모든 열의를 다하여 말씀을 받아들이고[b], 이것들이 과연 그러한지 알아보려고 날마다 성경을 살폈습니다.
  rationale: ‘신실한’을 εὐγενέστεροι의 문맥상 의미인 ‘고결한’으로 바로잡고, 비교 대상의 장소 수식을 명시했습니다. ‘모든 열의를 다하여’는 μετὰ πάσης προθυμίας의 강한 적극성을, ‘과연 그러한지 알아보려고’는 성경을 조사한 목적을 자연스럽게 드러냅니다. εὐγενέστεροι의 남아 있는 어휘적 모호성은 본문에 강요하지 않고 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
