- from: 그러나 유대인들이 시기하여 장터의 악한 사람들 몇을 끌어들이고 무리를 모아 도시를 소란하게 하였으며, 야손의 집에 들이닥쳐 그들을 민회로 끌어내려고 찾았습니다.
  to: 그러나 유대인들은 시기하여 장터에 있던 악한 사람들 몇 명을 데리고 무리를 만들어 도시를 소란에 빠뜨렸으며, 야손의 집에 가서 그들을 데리고 나와 민회[a] 앞에 세우려고 했습니다.
  rationale: The revision removes an unwarrantedly forceful portrayal of arrival at Jason’s house, makes the imperfect attempt to bring the unnamed persons out explicit, and retains the civic sense of δῆμος with a footnote. It preserves the source’s unspecified pronoun “그들” and does not narrow “유대인들” to a leadership group.
