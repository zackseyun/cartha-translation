  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
  footnotes:
  - marker: a
    text: Or 'to the public assembly' or 'before the people'; the Greek δῆμος refers to the civic body gathered in public, not merely an undefined crowd.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유대인들은 시기하여 장터에 있던 악한 사람들 몇 명을 데리고 무리를 만들어 도시를 소란에 빠뜨렸으며, 야손의 집에 가서 그들을 데리고 나와 민회[a] 앞에 세우려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성 앞에” 또는 “공개 집회에.” 그리스어 δῆμος는 단순히 불특정한 군중이 아니라 공개적으로 모인 시민 공동체 또는 민회를 가리킵니다.
    reason: lexical_alternative
