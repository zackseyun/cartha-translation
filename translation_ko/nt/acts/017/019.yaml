  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
  footnotes:
  - marker: a
    text: Or, 'that you are speaking.' The Greek more literally says, 'the teaching being spoken by you.'
    reason: lexical_alternative
  - marker: b
    text: '''Areopagus'' may refer to the hill itself or to the council associated with it; traditional English also has ''Mars Hill.'''
    reason: cultural_note
translation:
  language: ko
  text: 그들이 그를 붙들어 아레오바고[a]로 데려가며 이렇게 말하였습니다. “당신이 말하는 이 새로운 가르침이 무엇인지 우리가 알 수 있겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아레오바고’는 그 언덕 자체를 가리킬 수도 있고, 그와 관련된 평의회를 가리킬 수도 있습니다. 전통적으로 ‘마르스 언덕’이라고도 합니다.
    reason: cultural_note
