  source_fidelity: 원문의 ἐπιλαβόμενοί는 ‘붙들어’로, ἤγαγον은 ‘데려가며’로 충실히 옮겼습니다. ‘아레오바고’는 장소와 그에 관련된 회의체 가운데 어느 하나로 한정하지 않아 원문의 역사적 모호성을 보존합니다. ὑπὸ σοῦ λαλουμένη는 한국어에서 자연스러운 능동 표현인 ‘당신이 말하는’으로 옮겼으며, 의미상 행위자와 가르침의 관계를 유지합니다.
  naturalness: 초안의 ‘말하기를’은 현대 표준 합쇼체 서술로 다소 문어적이고, 인용부호가 닫히지 않았습니다. ‘데려가며 이렇게 말하였습니다’와 완결된 인용문은 현대의 격식 있는 성경 문체에 자연스럽습니다.
  terminology: ‘아레오바고’는 고유 명칭으로 적절합니다. 해당 말이 언덕 자체인지 그와 연관된 평의회인지 논의되는 점을 각주로 밝혀 본문은 과도하게 해석하지 않도록 했습니다. ‘가르침’은 διδαχή에 적절한 현대어 번역입니다.
