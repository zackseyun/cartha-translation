  text: 또한 그분께서는 무엇인가가 필요하신 것처럼 사람의 손으로 섬김을 받으시는 것도 아닙니다[a]. 그분 자신이 모든 이에게 생명과 호흡과 모든 것을 주시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
