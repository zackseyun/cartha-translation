  verdict: revise
  source_fidelity: ‘죽은 자의 부활’은 한국어에서 일반 개념으로 이해될 수 있으나, 원문의 복수 νεκρῶν을 ‘죽은 이들의 부활’로 드러내는 것이 더 충실합니다. 또한 Ἀκουσόμεθά σου의 ‘당신에게서/당신의 말을 듣다’라는 뜻과 καὶ πάλιν의 ‘다시’를 본문에 명시하는 편이 적절합니다.
  naturalness: 현대 표준어 합쇼체로 ‘이 일에 관하여는 당신의 말씀을 다시 듣겠습니다’는 자연스럽고, 인용문의 공손한 발화와 서술문의 문체가 일관됩니다.
  terminology: ‘부활’은 ἀνάστασις에 대한 확립되고 자연스러운 대응어입니다. ‘죽은 이들’은 복수 표현을 보존하면서도 현대 한국어에서 무리가 없습니다.
  issues:
  - severity: medium
    issue: ‘죽은 자의 부활’이 원문의 복수 ‘죽은 이들’을 충분히 드러내지 못합니다.
    rationale: νεκρῶν은 복수이며, 여기서는 죽은 사람들 전체와 관련된 부활을 가리킵니다. ‘죽은 이들의 부활’이 이를 더 직접적으로 반영합니다.
  - severity: medium
    issue: 인용문의 ‘다시 듣겠다’에는 ‘당신의 말을/당신에게서’라는 σου의 대상이 명시되지 않았습니다.
    rationale: ἀκούω와 속격 σου는 ‘당신의 말을 듣다’ 또는 ‘당신에게서 듣다’라는 뜻입니다. 한국어 본문에도 이를 드러내면 원문 충실도가 높아집니다.
  revised_text: 그들이 죽은 이들의 부활에 관하여 듣고, 어떤 이들은 비웃었고 다른 이들은 “이 일에 관하여는 당신의 말씀을 다시 듣겠습니다” 하였습니다.
