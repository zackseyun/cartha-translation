  naturalness: ‘바울과 실라의 편에 서게 되었습니다’는 현대 한국어에서 자연스럽고, 해당 동사가 나타내는 결속·가담의 의미를 전달합니다. ‘유력한 여성들’은 ‘귀부인들’보다 현대적이며 원문의 사회적 prominence를 더 정확히 나타냅니다.
