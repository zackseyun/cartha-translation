  text: 그들 가운데 몇몇은 설득되어 바울과 실라의 편에 서게 되었습니다.[a] 또한 하나님을 경외하는 헬라인들 가운데 큰 무리와 유력한 여성들도 적지 않게 그렇게 되었습니다.
