  to: 그들 가운데 몇몇은 설득되어 바울과 실라의 편에 서게 되었습니다.[a] 또한 하나님을 경외하는 헬라인들 가운데 큰 무리와 유력한 여성들도 적지 않게 그렇게 되었습니다.
  rationale: 문장 결합을 자연스러운 현대 표준 한국어로 다듬고, ‘귀부인들’을 원문의 사회적 유력함을 나타내는 ‘유력한 여성들’로 고쳤습니다. ‘설득되어,’ ‘하나님을 경외하는 헬라인들,’ ‘큰 무리,’ ‘적지 않게’는 각각 원문의 어휘적 선택과 수사적 완곡 표현을 유지합니다. 각 집단이 바울과 실라의 편에 서게 되었다는 생략된 동사는 ‘그렇게 되었습니다’로 보충하되 의미를 추가하지 않았습니다.
