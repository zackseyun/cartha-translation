  source_fidelity: 개정이 필요합니다. συνέβαλλον αὐτῷ를 단정적으로 ‘논쟁하였습니다’로 옮기면 논쟁·토론·논의가 가능한 원문의 폭이 다소 좁아집니다. 또한 εὐηγγελίζετο의 목적어 관계는 ‘예수와 부활을 복음으로 전하다’보다 ‘예수와 부활에 관한 복음을 전하다’로 밝혀 주는 편이 정확합니다.
  naturalness: 초안의 ‘말쟁이’는 현대 한국어에서 단지 말이 많은 사람이라는 뜻으로도 흔히 쓰여 σπερμολόγος의 경멸적 뉘앙스가 약합니다. 현대 합쇼체 서술로 문장 종결과 인용을 정비하면 더 자연스럽습니다.
  terminology: ‘에피쿠로스 학파’, ‘스토아 학파’, ‘이방의 신들’은 적절합니다. 다만 ξένων δαιμονίων은 발화자들의 이교적 관점에서 낯선 신적 존재를 뜻하므로, ‘낯선 신들’과 주석이 더 직접적이며 ‘귀신’이라는 기독교적 의미를 피합니다.
  issues:
