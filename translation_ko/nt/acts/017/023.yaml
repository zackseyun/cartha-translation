- from: 내가 지나가다가 여러분이 예배하는 것들을 살펴보았는데, 「알지 못하는 신에게」라고 새겨진 제단도 발견하였습니다. 그러므로 여러분이 알지 못하고 예배하는 그것을, 내가 여러분에게 전합니다.
  to: 내가 지나가면서 여러분의 숭배 대상들을 살펴보다가, 「알지 못하는 신에게」라고 새겨진 제단도 발견하였습니다. 그러므로 여러분이 알지 못한 채 예배하는 그것을 내가 여러분에게 선포합니다.
  rationale: 원문의 중성 관계대명사 ὃ는 ‘그것’으로 유지하여 대상을 인격화하지 않았습니다. ‘알지 못하는 신에게’는 비문의 무관사 표현을 한국어에서 자연스럽게 재현하며, 별도의 정관사 대안 각주는 한국어에는 적용되지 않으므로 두지 않았습니다. 동사 καταγγέλλω는 ‘선포합니다’로 바로잡았습니다.
