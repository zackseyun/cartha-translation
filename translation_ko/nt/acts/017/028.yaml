    rationale: 원문에서 ἐν αὐτῷ ... ἐσμέν은 바울의 진술이며, ὡς ... εἰρήκασιν 뒤에 오는 인용문은 「Τοῦ γὰρ καὶ γένος ἐσμέν」입니다. 초안의 구두점과 접속은 이 구문 관계를 바꿉니다.
  - severity: medium
    issue: 인용문의 καί가 번역되지 않음
    rationale: 「우리도」가 ‘we also’를 반영합니다.
