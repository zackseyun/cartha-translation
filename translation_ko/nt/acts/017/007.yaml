  source_fidelity: The draft generally conveys the accusation, but it restructures the relative opening into two sentences and uses '예수라 하는 다른 왕이 있다,' which can sound less direct than the Greek accusation that Jesus himself is another king. The final unmatched quotation mark is also extraneous.
