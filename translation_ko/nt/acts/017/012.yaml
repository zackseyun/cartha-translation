  source_fidelity: 초안의 ‘그래서’와 ‘그들 가운데 많은 사람이 믿었고’는 μὲν οὖν, ἐξ αὐτῶν, ἐπίστευσαν을 대체로 충실히 반영합니다. 그러나 ‘헬라의’는 민족/집단을 가리키는 Ἑλληνίδων보다 지리적 소속으로 읽힐 수 있고, ‘귀부인들’은 εὐσχήμων이 나타내는 사회적 명성·지위를 지나치게 귀족적이고 예절 중심으로 한정합니다. 또한 οὐκ ὀλίγοι의 완곡한 강조를 번역 주석으로 밝혀 주는 것이 적절합니다.
  naturalness: ‘그러므로’, ‘유력한 그리스인 여성들’, ‘적지 않은 남자들’은 현대 표준 한국어의 합쇼체 문맥에서 자연스럽습니다. ‘그리스인’은 고대 문맥의 Ἑλληνίδες에 대해 ‘헬라의’보다 명료하며, ‘유력한’은 사회적 인지와 지위를 자연스럽게 나타냅니다.
  terminology: πιστεύω는 본문에 목적어를 보충하지 않고 ‘믿었습니다’로 유지했습니다. εὐσχήμονες는 ‘유력한’으로 옮기고, 가능한 대안인 ‘존경받는’/‘사회적 지위가 높은’은 각주에 남겼습니다. οὐκ ὀλίγοι는 ‘적지 않은’으로 직역적 완곡 표현을 보존했습니다.
