  terminology: ‘회당’, ‘유대인들’, ‘하나님을 경외하는 사람들’, ‘변론하였습니다’는 현대의 격식 있는 합쇼체에 적절하며, 원문의 종교·논변 어휘를 과도하게 해석하지 않습니다.
  issues:
  - severity: medium
    issue: ‘날마다 마주치는 사람들’의 범위가 불명확합니다.
