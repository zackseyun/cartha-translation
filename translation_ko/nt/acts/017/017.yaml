  source_fidelity: 초안은 διελέγετο의 지속적 논변, 회당의 두 대상, 장터에서의 날마다의 활동을 대체로 반영합니다. 그러나 ‘날마다 마주치는 사람들’은 바울이 날마다 만난 고정된 사람들처럼 들릴 수 있어, 우연히 그곳에 와 있던 사람들(τοὺς παρατυγχάνοντας)의 뜻이 충분히 드러나지 않습니다.
