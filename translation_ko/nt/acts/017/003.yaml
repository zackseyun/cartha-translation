translation:
  language: ko
  text: 메시아[a]가 고난을 받고 죽은 자들 가운데서 살아나야 했으며, 내가 여러분에게 전하는 이 예수가 바로 그 메시아임을 풀어 설명하고 논증하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리스도’. 본 절에서 두 번 나오는 ‘메시아’는 모두 ‘그리스도’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸν χριστὸν
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: 바울의 회당 변증에서 Χριστός는 명백히 칭호로 기능한다(「예수가 곧 그 메시아이다」). 본 번역의 원칙대로 「메시아」.
theological_decisions:
- issue: 회당 변증에서 Χριστός를 칭호로 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 본문 구조 「τὸν χριστὸν…οὗτός ἐστιν ὁ χριστός, ὁ Ἰησοῦς」는 「메시아」가 칭호임을 명시적으로 드러낸다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — Χριστός'
