  to: 세상과 그 안에 있는 모든 것을 지으신 하나님, 곧 하늘과 땅의 주이신 분께서는 사람의 손으로 만든 신전들 안에 거하지 않으십니다.
  rationale: 현재 상태를 나타내는 분사구와 ‘주’의 술어 관계를 ‘하늘과 땅의 주이신 분’으로 바로잡고, 인간이 만든 신전이라는 χειροποίητος의 뜻을 명료하게 했습니다. 원문의 ‘세상과 그 안의 모든 것’ 및 하나님께서 신전 안에 거하지 않으신다는 직접 진술을 유지했습니다.
