  text: 바울은 아레오바고 한가운데에 서서 이렇게 말하였습니다. “아테네의 남성 여러분, 내가 보기에 여러분은 모든 면에서 매우 종교적입니다.[a]”
  philosophy: optimal-equivalence
  footnotes:
