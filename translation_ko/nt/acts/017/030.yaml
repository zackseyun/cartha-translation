  source_fidelity: ‘알지 못하던 시대’는 의미상 가능하지만, τῆς ἀγνοίας는 누구의 ‘알지 못함’인지를 명시하지 않는 명사구입니다. ‘무지의 시대’가 이 표현의 압축성과 범위의 열림을 더 잘 보존합니다. 또한 πάντας πανταχοῦ의 보편적 범위를 ‘어디에나 있는 모든 사람’으로 더 자연스럽고 분명하게 드러낼 수 있습니다.
