  terminology: ‘회개하다’는 μετανοεῖν의 신약성경 정착 번역어로 적절합니다. ‘간과하셨으나’는 ὑπεριδών의 과거의 관용/지나침을 전달하며, 승인했다는 뜻으로 오해하지 않도록 주석을 붙일 수 있습니다.
