base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
  footnotes:
  - marker: a
    text: Or 'foreign things' or 'unfamiliar things.' The Greek term can denote what is strange because it is new or foreign to the hearer.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'what these things want to be,' an idiom meaning 'what these things mean' or 'what significance they have.'
    reason: lexical_alternative
translation:
  language: ko
  text: “당신은 우리 귀에 낯선 어떤 것들을 들려주고 있습니다.[a] 그러므로 우리는 이것들이 무엇을 뜻하는지 알고자 합니다.”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국의 것들’ 또는 ‘생소한 것들’. 그리스어는 듣는 사람에게 새롭거나 외국적이어서 낯설게 여겨지는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
