  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
  footnotes:
  - marker: a
    text: Some manuscripts read 'all the Greeks' instead of simply 'they all.' The earliest text is shorter and leaves the group's identity unspecified.
    reason: textual_variant
translation:
  language: ko
  text: 그러자 그들이 모두[a] 회당장 소스데네를 붙잡아 재판석 앞에서 때리고 있었습니다. 그러나 갈리오는 이 모든 일에는 전혀 관심을 두지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 단순히 ‘모두’가 아니라 ‘모든 그리스인’으로 되어 있습니다. 가장 이른 본문은 더 짧으며, 그 집단이 누구인지는 특정하지 않습니다.
    reason: textual_variant
