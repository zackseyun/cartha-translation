    reason: textual_variant
  revision_rationale: 미완료 과거 ἔτυπτον의 지속·반복상을 ‘때리고 있었습니다’로 반영하고, οὐδὲν τούτων의 복수 지시를 ‘이 모든 일’로 보존했습니다. 또한 πάντες의 지시 대상은 원문에서 명시되지 않으므로 본문에는 ‘그들이 모두’로 남기고, 사본 변이를 각주로 처리했습니다.
