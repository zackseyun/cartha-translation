review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. ἔτυπτον은 미완료 과거로서 반복되거나 계속된 구타를 나타내므로 단순 과거 ‘때렸으나’보다 ‘때리고 있었습니다’가 원문의 상을 더 잘 보존합니다. οὐδὲν τούτων은 복수 표현이므로 ‘이 모든 일’로 옮기는 것이 적절합니다. πάντες의 집단 정체는 본문에서 특정하지 않고 각주로 변이만 밝힙니다.
  naturalness: ‘회당장 소스데네’, ‘재판석 앞에서’, ‘전혀 관심을 두지 않았습니다’는 현대 표준어 합쇼체에서 자연스럽고 격식에 맞습니다. ‘그러자’와 ‘그러나’는 각각 서술의 진행과 갈리오의 무관심의 대조를 잘 드러냅니다.
  terminology: ἀρχισυνάγωγος는 ‘회당장’으로, βῆμα는 이 문맥의 사법적 단상을 가리키는 ‘재판석’으로 유지합니다. Σωσθένης은 통용 표기인 ‘소스데네’, Γαλλίων은 ‘갈리오’로 표기합니다.
  issues:
  - severity: medium
    issue: ἔτυπτον의 미완료상이 번역문에서 소실됨
    rationale: ‘때렸으나’는 단회적 단순 과거로 읽히기 쉬운 반면, 그리스어 미완료형은 진행·반복적 행위를 나타냅니다.
  - severity: low
    issue: τούτων의 복수 지시가 ‘이 일’이라는 단수 표현으로 축소됨
    rationale: ‘이 모든 일’은 갈리오가 관심을 두지 않은 사태들을 복수로 지시하는 원문을 더 충실히 반영합니다.
  - severity: low
    issue: πάντες의 사본 변이에 관한 각주가 없음
    rationale: 본문은 집단의 정체를 특정하지 않지만, 일부 사본의 ‘모든 그리스인’ 독법은 번역상 중요한 본문 비평 정보이므로 ‘모두’에 각주를 답니다.
  revised_text: 그러자 그들이 모두[a] 회당장 소스데네를 붙잡아 재판석 앞에서 때리고 있었습니다. 그러나 갈리오는 이 모든 일에는 전혀 관심을 두지 않았습니다.
  revised_footnotes:
