  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
  footnotes:
  - marker: a
    text: Or 'they took him with them' or 'they welcomed him.' The Greek verb can carry the sense of receiving someone as well as taking someone aside.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 회당에서 담대하게 말하기 시작하였습니다. 브리스길라와 아굴라가 그의 말을 듣고 그를 따로 데려가 하나님의 도를 그에게 더 정확하게 설명하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 데리고 갔다’ 또는 ‘그를 맞아들였다.’ 그리스어 동사는 사람을 받아들이거나 함께 데려가는 뜻도 지닐 수 있습니다.
    reason: προσελάβοντο의 문맥상 선택된 의미(‘따로 데려가’)와 가능한 어휘적 대안을 보존합니다.
