translation:
  language: ko
  text: 그러나 말[a]과 이름과 여러분의 법에 관한 문제들이라면, 여러분이 직접 처리할 일입니다. 나는 이러한 일들의 재판관이 되기를 원하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
