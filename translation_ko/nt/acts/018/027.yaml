revisions:
- from: 그가 아카이아로 건너가기를 원하므로, 형제들이 그를 격려하면서 제자들에게 그를 영접하도록 편지하였습니다. 그가 그곳에 이르러 은혜로 말미암아 믿게 된 사람들에게 많은 도움을 주었습니다.
  to: 그가 아카이아로 건너가고자 하자, 형제들[a]은 그를 격려하고 제자들에게 그를 환영해 달라고 편지하였습니다. 그가 도착하자 은혜를 통하여[b] 믿게 된 사람들에게 크게 도움이 되었습니다.
  rationale: The revision makes the opening clause temporal rather than causal, uses more idiomatic coordinated Korean for the brothers’ actions, and avoids adding an unstated destination at arrival. It retains the audit trail’s preferred reading that grace relates to the believers’ coming to faith, while preserving the alternate syntactic attachment in a properly anchored footnote. The ‘brothers’ note is also restored with an anchor at the relevant Korean term.
