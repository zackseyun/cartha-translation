review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 βλασφημούντων의 의미 범위를 반영할 수 있도록 ‘비방’에 각주를 달고, καθαρὸς ἐγώ는 이 문맥의 책임 면제 의미를 더 분명히 나타내는 편이 좋습니다. ἐκτιναξάμενος τὰ ἱμάτια는 ‘옷을 떨며’보다 ‘옷을 털고’가 자연스럽고 정확합니다.
  naturalness: 초안의 인용문 안 ‘것이오’와 ‘깨끗합니다/가겠습니다’가 섞여 있어 현대 표준 합쇼체로 통일할 필요가 있습니다. 또한 ‘말하기를 … 하였습니다’보다 직접화법 뒤의 ‘말했습니다’가 자연스럽습니다.
  terminology: ‘이방인들’은 유대인 회당 청중과 대조되는 τὰ ἔθνη를 적절히 옮깁니다. ‘나는 책임이 없습니다’는 여기서 καθαρός가 뜻하는 책임·죄책으로부터의 면제를 자연스럽게 전달합니다. ‘비방하다’는 본문상 가능한 번역이며, ‘모독하다’라는 대안을 각주에 보존합니다.
  issues:
  - severity: medium
    issue: 인용문 종결 표현의 높임말 등급이 혼합됨
    rationale: ‘있을 것이오’는 현대 표준 합쇼체의 ‘깨끗합니다’, ‘가겠습니다’와 일관되지 않습니다.
  - severity: low
    issue: ‘옷을 떨며’의 동작 표현
    rationale: ἐκτινάσσω는 옷을 ‘털다/떨쳐 내다’라는 상징적 행위를 가리키므로 ‘옷을 털고’가 더 자연스럽고 분명합니다.
  - severity: low
    issue: βλασφημούντων 및 책임 관용구에 대한 각주 부재
    rationale: ‘비방’은 문맥상 적절하지만 ‘모독’이라는 어휘적 가능성과 ‘피가 머리 위에’라는 책임 관용구의 의미를 각주로 밝혀 독자의 오해를 줄일 수 있습니다.
  revised_text: 그들이 대적하고 비방하자, 바울은 옷을 털고 그들에게 말했습니다. “여러분의 피는 여러분 자신의 머리 위에 있습니다.[b] 나는 책임이 없습니다. 이제부터 이방인들에게[c]로 가겠습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “모독하자.” 그리스어 동사는 신성한 것을 모독하는 말이나 심한 욕설·비방을 가리킬 수 있습니다. 여기서는 바울과 그가 전한 메시지에 대한 적대적인 비방을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: “여러분의 피는 여러분 자신의 머리 위에 있습니다”는 그 결과에 대한 책임이 그들 자신에게 있다는 뜻의 관용적 선언입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “민족들에게.” 여기서는 유대인이 아닌 사람들을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 현대 표준 합쇼체로 문체를 통일하고, 옷을 터는 상징 행위를 자연스럽게 옮겼습니다. ‘나는 책임이 없습니다’는 καθαρὸς ἐγώ의 문맥상 의미를 전달하며, ‘피’의 책임 관용구와 ‘이방인들’은 본문의 표현을 유지했습니다. βλασφημούντων의 어휘적 대안은 각주로 보존했습니다.
