  verdict: revise
  source_fidelity: 개정문은 ἀντιτασσομένων을 ‘맞서고’로, βλασφημούντων을 문맥상 적절히 ‘비방하자’로 옮기며, 상징 행동인 ἐκτιναξάμενος τὰ ἱμάτια를 ‘옷을 털고’로 충실히 반영합니다. ‘여러분의 피는 여러분 자신의 머리 위에 있습니다’는 원문의 엄중한 책임 관용구를 보존하고, καθαρὸς ἐγώ의 문맥적 의미는 ‘나는 책임이 없습니다’로 명료하게 전달합니다. εἰς τὰ ἔθνη도 이 문맥에서 ‘이방인들에게’가 적절합니다.
  naturalness: 초안의 ‘말하기를 … 하였습니다’와 인용문 안의 ‘있을 것이오’는 현대 표준 한국어 합쇼체에서 부자연스럽거나 문체가 섞여 있습니다. 직접 인용 뒤에 ‘말했습니다’를 쓰고, 인용문 전체를 현대 합쇼체로 통일하는 편이 자연스럽습니다. 또한 ‘옷을 떨며’보다 상징적 몸짓을 나타내는 ‘옷을 털고’가 자연스럽습니다.
  terminology: ‘이방인’은 유대인 청중과 대비되는 τὰ ἔθνη를 한국어 성경 문맥에서 자연스럽게 나타냅니다. ‘깨끗합니다’는 한국어에서 도덕적·의례적 청결로 오해될 수 있으므로, 여기서 말하는 사명 수행 후의 무책임/무죄책을 ‘나는 책임이 없습니다’로 옮기는 것이 적절합니다. βλασφημούντων은 신성모독 또는 모욕적 비방을 뜻할 수 있으므로 각주로 범위를 밝혔습니다.
