  - severity: medium
    issue: ‘나는 깨끗합니다’
    rationale: καθαρὸς는 여기서 바울이 전한 책임에서 벗어났다는 비유적·법정적 의미입니다. 한국어 ‘깨끗합니다’는 원치 않는 도덕적 또는 의례적 의미를 낳을 수 있습니다.
