  source_fidelity: 대체로 원문을 충실히 옮겼습니다. 그러나 εἶχεν εὐχήν은 단순히 과거에 서원했다는 행위보다 서원에 묶여 있던 상태를 가리키므로, ‘서원하였기’보다 ‘서원 중이었기’가 더 정확합니다. κειράμενος는 ‘머리를 깎다’로 적절하며, 문법상 바울을 가리키는 본문 처리도 타당합니다.
  naturalness: 합쇼체와 현대 표준어는 자연스럽습니다. 다만 ‘그와 함께 브리스길라와 아굴라가 있었습니다’보다 ‘브리스길라와 아굴라도 그와 함께했습니다’가 여행 동행이라는 문맥을 더 자연스럽고 분명하게 드러냅니다.
  terminology: 바울, 브리스길라, 아굴라, 시리아, 겐그레아는 통용되는 성경 인명·지명 표기입니다. ‘형제들’은 ἀδελφοῖς의 표현을 보존합니다. 서원의 구체적 종류를 본문에 넣지 않았습니다.
  issues:
  - severity: medium
    issue: ‘이는 그가 서원하였기 때문입니다’
    rationale: εἶχεν γὰρ εὐχήν은 직역하면 ‘그가 서원을 가지고 있었기 때문이다’이며, 서원을 했다는 과거 행위 자체보다 서원에 관련된 지속 상태를 나타냅니다. ‘서원 중이었기 때문입니다’가 이를 더 잘 반영합니다.
  - severity: low
