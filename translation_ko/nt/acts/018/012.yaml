  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
  footnotes:
  - marker: a
    text: Greek 'the Jews'; here this refers to the local Jewish group acting against Paul, not to all Jewish people universally.
    reason: cultural_note
  - marker: b
    text: Or 'to the judgment seat.' The Greek term refers to the official judicial bench or tribunal.
    reason: lexical_alternative
translation:
  language: ko
  text: 갈리오가 아카이아의 속주 총독으로 있을 때, 유대인들이[a] 한마음으로 바울에게 맞서 그를 재판석[b] 앞으로 데리고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘유대인들’이라고 합니다. 여기서는 모든 유대인을 가리키는 말이 아니라 바울을 대적하여 행동한 현지의 유대인 집단을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘재판 자리’. 그리스어는 관리가 재판을 행하는 공식 재판석 또는 법정을 가리킵니다.
    reason: lexical_alternative
