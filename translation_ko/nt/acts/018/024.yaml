  yaml_path: translation/nt/acts/018/024.yaml
  text: Now a certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
  footnotes:
  - marker: a
    text: Or 'learned man' for 'eloquent man'; the Greek λόγιος can describe either eloquence or learning.
    reason: lexical_alternative
translation:
  language: ko
  text: 아볼로라는 어떤 유대인이 에베소에 이르렀습니다. 그는 알렉산드리아 태생으로, 말솜씨가 뛰어난[a] 사람이었으며 성경에 능통했습니다.
  philosophy: optimal-equivalence
