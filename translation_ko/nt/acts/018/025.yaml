  verdict: revise
  source_fidelity: ‘예수에 관한 일을’은 τὰ περὶ τοῦ Ἰησοῦ의 포괄적 대상을 ‘일’로 다소 좁힐 수 있으므로 ‘예수에 관한 것들’이 더 충실합니다. 또한 ζέων τῷ πνεύματι의 ‘영’은 아볼로 자신의 영인지 성령인지 문법적으로 단정하기 어려워, 본문과 각주에서 그 모호성을 보존하는 것이 적절합니다.
  naturalness: ‘영으로 뜨거워’보다 ‘영이 뜨거워’가 현대 한국어 성경 문체에서 더 자연스럽고 이해하기 쉽습니다. ‘주의 도(道)’의 한자는 현대 표준어 본문에서는 불필요하므로 ‘주의 길’로 옮겼습니다.
  terminology: ‘주의 길’은 τὴν ὁδὸν τοῦ κυρίου를 자연스럽게 살리며, ‘요한의 세례’와 ‘예수’는 통용되는 성경 용어를 유지합니다.
  issues:
  - severity: medium
    issue: ‘예수에 관한 일을’이라는 표현
    rationale: 그리스어 τὰ περὶ τοῦ Ἰησοῦ는 예수에 관련된 가르침·사항 전반을 뜻하며, ‘일’은 사건이나 행위로 의미를 좁힐 수 있습니다.
  - severity: low
    issue: ‘영으로 뜨거워’의 어색함 및 각주 부재
    rationale: ζέων τῷ πνεύματι는 인간의 영과 성령이라는 두 이해가 가능합니다. ‘영이 뜨거워’가 더 자연스럽고, 각주로 대안 이해를 밝혀 모호성을 보존해야 합니다.
  - severity: low
    issue: ‘도(道)’의 한자 병기
    rationale: 현대 표준어 합쇼체 본문에서는 한자 병기 없이 ‘길’로 쓰는 편이 자연스럽고, 원문의 ‘길’ 비유도 직접 드러납니다.
  revised_text: 이 사람은 주의 길을 배워 알고 있었으며, 영이 뜨거워 예수에 관한 것들을 정확하게 말하고 가르쳤습니다. 그는 요한의 세례만 알고 있었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘성령 안에서 열정에 불타.’ 여기의 ‘영’은 아볼로 자신의 영을 가리킬 수도 있고 성령을 가리킬 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 원문의 완료 수동분사(‘배워 알고 있었으며’), 지속적인 미완료 동사들(‘말하고 가르쳤습니다’), 그리고 요한의 세례만 알고 있었다는 지식의 제한을 보존했습니다. ‘영’의 지시 대상은 본문에서 확정하지 않고 각주에 가능한 이해를 제시했습니다.
