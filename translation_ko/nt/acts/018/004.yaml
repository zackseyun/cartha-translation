  source_fidelity: ‘안식일마다’ accurately renders the distributive phrase κατὰ πᾶν σάββατον, and ‘회당에서’ correctly renders ἐν τῇ συναγωγῇ. ‘변론하면서’ is an appropriate Korean rendering of διελέγετο in this synagogue setting, conveying reasoned, persuasive discourse. ‘유대인들과 헬라인들을 설득하였습니다’ preserves both groups named in the Greek and does not improperly narrow Ἕλληνας to a particular subgroup. The Korean past progressive-like coordination and habitual setting adequately convey the Greek imperfects without asserting either success or failure beyond the text.
