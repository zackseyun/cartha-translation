translation:
  language: ko
  text: 그들이 또 말했습니다. 「갈릴리 사람들아, 어찌하여 하늘을 바라보며 서 있습니까? 너희에게서 하늘로 올려지신 이 예수께서는, 너희가 그분께서 하늘로 가시는 것을 본 그대로 오실 것입니다.」
  philosophy: optimal-equivalence
