review_pass:
  verdict: revise
  source_fidelity: ‘다시’는 원문 οὕτως ἐλεύσεται에 없으므로 제거해야 합니다. 또한 ἀναλημφθείς는 수동형이므로 ‘올라가신’보다 ‘올려지신’이 원문 형식과 의미를 더 충실히 반영합니다. 본문의 ‘그대로’는 οὕτως ... ὃν τρόπον의 방식 비교를 자연스럽게 옮깁니다.
  naturalness: 현대 표준어 합쇼체로 ‘말했습니다’, ‘서 있습니까?’, ‘오실 것입니다’를 사용했습니다. ‘너희에게서 하늘로 올려지신’은 다소 문어적이지만 원문의 분리와 수동성을 보존하는 데 필요한 자연스러운 성경 문체입니다.
  terminology: ‘갈릴리 사람들아’는 Ἄνδρες Γαλιλαῖοι의 직접 호칭을 자연스럽게 옮깁니다. ‘하늘’은 승천 문맥의 οὐρανός에 적절합니다. οὗτος ὁ Ἰησοῦς는 해석적으로 ‘바로 이 예수’ 또는 ‘같은 예수’로 확대하지 않고 ‘이 예수’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘다시 오실 것입니다’의 ‘다시’
    rationale: 그리스어 본문은 예수께서 ‘같은 방식으로’ 오신다고 말하지만, ‘다시’에 해당하는 어휘를 명시하지 않습니다. 문맥상 재림을 암시할 수 있으나 본문 번역에 추가하지 않는 편이 안전합니다.
  - severity: low
    issue: ‘올라가신’의 능동 표현
    rationale: ἀναλημφθείς는 ‘올려지신/들려 올라가신’이라는 수동 분사입니다. 수동 표현이 원문의 문법과 사건 묘사를 더 정확히 반영합니다.
  - severity: low
    issue: ‘이렇게 말하였습니다’
    rationale: καὶ εἶπαν의 ‘또 말하였다’라는 연결을 ‘그들이 또 말했습니다’로 명시하면 원문에 더 가깝고 독립 구절에서도 주어가 분명합니다.
  revised_text: 그들이 또 말했습니다. 「갈릴리 사람들아, 어찌하여 하늘을 바라보며 서 있습니까? 너희에게서 하늘로 올려지신 이 예수께서는, 너희가 그분께서 하늘로 가시는 것을 본 그대로 오실 것입니다.」
  revised_footnotes:
  - marker: a
    text: '‘이 예수’: 전통적으로 ‘바로 이 예수’ 또는 ‘같은 예수’로도 옮깁니다. 그러나 그리스어는 직역하면 ‘이 예수’라고 합니다.'
    reason: lexical_alternative
  revision_rationale: 원문에 없는 ‘다시’를 삭제하고, 승천 동사의 수동태를 반영했습니다. 비교 구문은 ‘본 그대로’로 유지했으며, ‘이 예수’에 대한 전통적 확대 번역은 본문이 아니라 각주로 처리했습니다.
