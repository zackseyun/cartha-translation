  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘너희를 떠나’는 ἀφ’ ὑμῶν(‘너희에게서’)과 ἀναλημφθείς(‘올려짐을 받다/들려 올라가다’)의 수동적 뉘앙스를 약화하며, ‘다시’는 ἐλεύσεται에 명시되어 있지 않은 보충입니다. ‘본 그대로’도 비교 구문은 전달하지만, 예수께서 가시는 모습을 보았다는 목적어 관계를 더 분명히 하는 편이 좋습니다.
  naturalness: 합쇼체의 자연스럽고 현대적인 표현으로 다듬었습니다. ‘하늘을 바라보며 서 있습니까?’와 ‘그와 같은 방식으로 오실 것입니다’는 원문의 질문 및 방식 비교를 자연스럽게 나타냅니다.
  terminology: ‘하늘’, ‘올려지신’, ‘이 예수’는 승천 문맥과 헬라어 어휘를 충실히 반영합니다. ‘갈릴리 사람들아’는 한국어에서 자연스러운 호격이며, 원문의 남성 복수 호칭은 한국어의 일반적 집단 호칭으로 무리 없이 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘너희를 떠나 하늘로 올라가신’
    rationale: ἀναλημφθείς는 수동태로 ‘올려지신/들려 올라가신’이며, ἀφ’ ὑμῶν은 ‘너희에게서’입니다. ‘떠나 ... 올라가신’은 능동적 출발로 바꾸어 원문의 표현을 다소 약화합니다.
  - severity: medium
    issue: ‘다시 오실 것입니다’
    rationale: ἐλεύσεται는 ‘오실 것입니다’이며, ‘다시’는 문맥상 이해될 수 있어도 본문에 명시된 어휘는 아닙니다. 최적 등가 번역에서는 본문에서 제외하는 것이 안전합니다.
  - severity: low
    issue: ‘너희가 하늘로 가시는 것을 본 그대로’
    rationale: ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον은 ‘너희가 그분께서 하늘로 가시는 것을 본 그 방식으로’라는 비교 구조입니다. 수정안은 이 관계를 더 명료하게 드러냅니다.
  revised_text: 그들이 이렇게 말했습니다. 「갈릴리 사람들아, 왜 하늘을 바라보며 서 있습니까? 너희에게서 하늘로 올려지신 이 예수께서는, 너희가 그분께서 하늘로 가시는 것을 본 그와 같은 방식으로 오실 것입니다.」
  revised_footnotes:
  - marker: a
    text: 전통적으로는 ‘바로 이 예수께서’라고도 번역합니다. 헬라어 본문은 직역하면 ‘이 예수’이며, ‘바로’는 동일성을 강조하기 위한 해석적 보충입니다.
    reason: lexical_alternative
  revision_rationale: 행위 주체를 암시하는 ‘떠나 ... 올라가신’을 원문의 수동태에 맞추어 ‘너희에게서 하늘로 올려지신’으로 고쳤습니다. 또한 원문에 없는 ‘다시’를 삭제하고, 예수께서 하늘로 가시는 모습을 보았다는 비교 절의 관계를 명확히 했습니다. 영어 POB 감사 기록의 ‘This Jesus/This same Jesus’ 대안은 한국어 각주로 보존했습니다.
