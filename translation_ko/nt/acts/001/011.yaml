  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
  footnotes:
  - marker: a
    text: Or, more traditionally, “This same Jesus.” The Greek explicitly says “This Jesus”; “same” is an interpretive expansion meant to emphasize identity.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 말하였습니다. 「갈릴리 사람들아, 어찌하여 하늘을 쳐다보며 서 있습니까? 너희를 떠나 하늘로 올라가신 이 예수께서, 너희가 하늘로 가시는 것을 본 그대로 다시 오실 것입니다.」
  philosophy: optimal-equivalence
