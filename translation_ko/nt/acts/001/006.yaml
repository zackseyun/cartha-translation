    rationale: ἀποκαθιστάνεις는 현재 직설법이며, 원문은 ‘지금 회복하고 계십니까/회복하시는 때입니까?’라고 묻습니다. 또한 ‘주시다’는 원문에 없는 수혜적 어감을 보탭니다.
  - severity: low
    issue: ‘그래서 모인 사람들이’의 시간적 연결이 다소 약함
    rationale: συνελθόντες는 질문 당시 함께 모여 있던 상황을 나타내므로 ‘그들이 함께 모였을 때에’가 시간적 참여를 더 정확하고 자연스럽게 드러냅니다.
