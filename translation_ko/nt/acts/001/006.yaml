review_pass:
  verdict: revise
  source_fidelity: The draft conveys the question, address, time reference, and restoration of the kingdom to Israel. However, “회복시켜 주시려는 것입니까?” makes the present ἀποκαθιστάνεις primarily a future intention (“are you intending to restore?”). A present-progressive Korean form better preserves the Greek wording without deciding whether the question concerns an imminent or ongoing restoration.
  naturalness: The draft is generally natural in modern formal-polite Korean. “그분께” is acceptable, but the Greek pronoun is naturally carried by the honorific verb, and “함께 모인 사람들이” more explicitly represents συνελθόντες.
  terminology: “주님” appropriately renders Κύριε, and “나라” is a natural Korean rendering of βασιλεία in this context. “이스라엘에게” preserves the Greek dative’s direct sense; a note should retain the viable alternative “이스라엘을 위해.”
  issues:
  - severity: medium
    issue: The verb phrase “회복시켜 주시려는 것입니까?” shifts the present-tense question toward future intention.
    rationale: ἀποκαθιστάνεις is present tense (“are you restoring”), not explicitly a volitional future construction. “회복시키고 계십니까?” more closely preserves the source while remaining idiomatic.
  - severity: low
    issue: The temporal participle συνελθόντες is rendered only as “모인 사람들.”
    rationale: “함께 모인 사람들이” retains the sense of gathering together and reads naturally.
  revised_text: 그래서 함께 모인 사람들이 여쭈었습니다. 「주님, 지금 이때에 이스라엘에게 나라를 회복시키고 계십니까?」
  revised_footnotes:
  - marker: a
    text: 또는 “이스라엘을 위해.” 그리스어 여격은 “이스라엘에게” 나라를 회복한다는 뜻으로 직접 이해할 수도 있고, “이스라엘을 위해”라는 수혜의 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the discourse connection, the temporal sense of the participle, and the present aspect of the question. It keeps the historical-theological ambiguity of the kingdom’s restoration and records the dative alternative without interpreting the disciples’ expectation.
