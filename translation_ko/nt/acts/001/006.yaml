  source_fidelity: 초안은 질문의 핵심 내용과 존칭을 대체로 전달하지만, ‘회복시켜 주시려는’은 그리스어 현재형 ἀποκαθιστάνεις를 의도·미래 지향으로 바꾸며, ‘주다’는 원문에 명시되지 않은 수혜의 뉘앙스를 더합니다. συνελθόντες의 시간적 관계도 더 분명히 드러낼 수 있습니다.
  naturalness: ‘그들이 함께 모였을 때에 … 여쭈었습니다’와 ‘지금이 … 때입니까?’는 현대 표준어 합쇼체에서 자연스럽고, 직접 질문의 형식을 명료하게 재현합니다.
  terminology: Κύριε는 ‘주님’, βασιλεία는 여기서 ‘나라’, ἀποκαθιστάνεις는 ‘회복하시는’으로 옮기는 것이 적절합니다. τῷ Ἰσραήλ의 여격은 ‘이스라엘에’로 직역적 방향성을 유지하되, 한국어 문맥상 그 나라가 이스라엘을 위한 것이라는 함의도 무리 없이 전달됩니다.
  issues:
