  to: 이 일이 예루살렘에 사는 모든 사람에게 알려졌으며, 그 결과 그 밭은 그들 자신의 고유한 언어로 ‘아켈다마흐’[a]라고 불리게 되었습니다. 그 뜻은 ‘피의 밭’입니다.
