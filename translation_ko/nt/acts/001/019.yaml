source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
  footnotes:
  - marker: a
    text: Akeldamach is more commonly rendered 'Akeldama' in English versions; the Greek form here is Ἁκελδαμάχ.
    reason: alternative_reading
  - marker: b
    text: Or 'in their own dialect.' The Greek διάλεκτος can refer to a regional speech form or more generally to a language.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일이 예루살렘에 사는 모든 사람에게 알려졌으며, 그 결과 그 밭은 그들 자신의 고유한 언어로 ‘아켈다마흐’[a]라고 불리게 되었습니다. 그 뜻은 ‘피의 밭’입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표기는 Ἁκελδαμάχ입니다. 한국어 성경 번역에서는 흔히 ‘아겔다마’로도 표기합니다.
    reason: alternative_reading
