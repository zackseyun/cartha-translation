  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
  footnotes:
  - marker: a
    text: Or 'while assembling with them'; some understand the phrase as 'while eating with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 함께 계실 때[a], 그분은 그들에게 명령하셨습니다. 「예루살렘을 떠나지 말고, 아버지의 약속, 곧 너희가 내게서 들은 것을 기다리라.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 συναλιζόμενος는 ‘그들과 함께 계실 때’ 또는 ‘그들과 함께 모이실 때’로 이해할 수 있습니다. 일부는 ‘그들과 함께 식사하실 때’로도 이해합니다.
    reason: lexical_alternative
