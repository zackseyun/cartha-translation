  source_fidelity: 원문의 복수 지시어 ταῦτα는 ‘이 말씀들’로 반영하는 것이 더 가깝습니다. ἐπήρθη의 수동적 상향 이동과, 구름으로 인해 더 이상 보이지 않게 된 결과는 유지되어야 합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체에 맞습니다. 다만 ‘구름이 그분을 받아 그들의 시야에서 사라지게 하였습니다’는 ‘받아’의 목적과 결과 연결이 다소 부자연스럽습니다. ‘가려 ... 보이지 않게 하였습니다’가 현대 한국어에서 명료합니다.
  terminology: 예수님을 가리키는 높임 표현(‘예수께서는’, ‘그분’)은 문맥상 적절합니다. ‘구름’은 본문에서 상징 의미를 명시하지 않고 일반 명사로 유지합니다.
  issues:
