review_pass:
  verdict: revise
  source_fidelity: 그리스어의 사건 순서와 핵심 의미는 대체로 반영되어 있습니다. 다만 ἐπήρθη의 수동 표현은 ‘들려 올라가셨고’보다 ‘위로 들어 올려지셨습니다’가 더 직접적이며, ὑπέλαβεν은 구름이 그분을 시야에서 가리게 된 결과를 자연스럽게 드러내는 표현으로 다듬는 것이 좋습니다.
  naturalness: ‘구름이 그분을 받아 그들의 시야에서 사라지게 하였습니다’는 한국어에서 ‘구름이 사람을 받다’가 다소 어색합니다. ‘구름이 그분을 가려 그들의 시야에서 보이지 않게 하였습니다’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘예수께서는’과 ‘그분’의 지칭은 적절합니다. νεφέλη는 본문에서 해석을 덧붙이지 않고 ‘구름’으로 옮기는 것이 적절합니다. 가능한 신현적 연상은 본문에 삽입하지 않고 주석으로 제한합니다.
  issues:
  - severity: medium
    issue: ἐπήρθη의 수동성이 약화되어 있습니다.
    rationale: ‘들려 올라가셨고’도 의미상 가능하지만, 수동태 ἐπήρθη의 ‘들어 올려짐’을 더 분명히 반영하려면 ‘위로 들어 올려지셨습니다’가 안전합니다.
  - severity: medium
    issue: ‘구름이 그분을 받아’가 한국어에서 부자연스럽습니다.
    rationale: ὑπέλαβεν은 여기서 구름이 그분을 받아 시야에서 보이지 않게 한 장면을 나타냅니다. ‘가려 … 보이지 않게 하였습니다’는 결과를 자연스럽고 절제되게 전달합니다.
  revised_text: 이 말씀을 하신 뒤, 그들이 보고 있는 가운데 예수께서는 위로 들어 올려지셨습니다. 그리고 구름이 그분을 가려 그들의 시야에서 보이지 않게 하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “들려 올라가셨습니다.”
    reason: lexical_alternative
  - marker: b
    text: 구름은 성경의 다른 장면들에서 하나님의 임재와 연관되기도 하지만, 이 구절 자체는 이를 명시하지 않습니다.
    reason: cross_reference
  - marker: c
    text: 직역하면 “그들의 눈에서 [그분을] 받아 갔습니다.”
    reason: lexical_alternative
  revision_rationale: 수동태인 ἐπήρθη를 ‘위로 들어 올려지셨습니다’로 옮겨 원문의 문법적 형태와 가시적인 상승을 보존했습니다. ὑπέλαβεν과 ἀπὸ τῶν ὀφθαλμῶν αὐτῶν은 구름이 그분을 가려 더는 보이지 않게 했다는 자연스러운 한국어 표현으로 옮겼습니다. 구름의 상징적 의미는 본문에 추가하지 않고 절제된 주석에만 남겼습니다.
