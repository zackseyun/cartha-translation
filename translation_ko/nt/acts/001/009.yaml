    issue: ταῦτα의 복수성이 ‘이 말씀’에서 단수로 약화됩니다.
    rationale: 앞선 발언 전체를 가리키므로 ‘이 말씀들을’이 원문의 형태를 더 직접적으로 반영합니다.
  - severity: medium
    issue: ‘구름이 그분을 받아 그들의 시야에서 사라지게 하였습니다’는 한국어 문장 연결이 어색하고 ὑπέλαβεν의 문맥상 효과를 불명료하게 합니다.
    rationale: 구름이 그를 보이지 않게 했다는 문맥상 결과를 ‘가려 ... 보이지 않게 하였습니다’로 자연스럽고 정확하게 표현할 수 있습니다.
  revised_text: 이 말씀들을 하신 뒤, 그들이 보는 가운데 예수께서는 들려 올라가셨고, 구름이 그분을 가려 그들의 눈앞에서 보이지 않게 하였습니다.
