review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence of entering and going up, the room where the group was staying, and the list of eleven names. However, its parenthetical insertions present supplied familial relationships typographically within the text. In particular, Ἰούδας Ἰακώβου leaves the relationship to James unstated and requires a note if rendered as ‘son of James.’
  naturalness: The overall Korean is understandable and appropriately formal-polite. Removing the parenthetical insertions produces smoother, publication-ready Korean. ‘열심당원 시몬’ is a clear modern conventional rendering of Σίμων ὁ ζηλωτής.
  terminology: The established Korean biblical names 베드로, 요한, 야고보, 안드레, 빌립, 도마, 바돌로매, 마태, 알패오, 시몬, and 유다 are suitable. ‘다락방’ naturally renders ὑπερῷον in this context. The ambiguity of ‘유다 야고보의’ must not be resolved without a footnote.
  issues:
  - severity: medium
    issue: Parenthetical kinship labels in the main text
    rationale: ‘알패오의 (아들) 야고보’ and ‘야고보의 (아들) 유다’ are not natural Korean Bible style. More importantly, the Greek phrase Ἰούδας Ἰακώβου does not explicitly identify Judas as James’s son; the supplied relationship must be qualified in a footnote.
  - severity: low
    issue: Rendering of ζηλωτής
    rationale: ‘셀롯인’ is intelligible but less idiomatic in current standard Korean than ‘열심당원.’ The latter is the conventional clear biblical rendering.
