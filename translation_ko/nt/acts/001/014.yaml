  verdict: revise
  source_fidelity: The draft accurately identifies the whole group, including the women, Mary the mother of Jesus, and his brothers, and it preserves the united orientation toward prayer. However, it does not explicitly convey the durative force of the periphrastic imperfect (ἦσαν προσκαρτεροῦντες).
  naturalness: The sentence is natural modern Korean in formal-polite narrative style. Moving the accompanying-group phrase before the adverbial phrase and adding '계속' makes the ongoing action and syntactic relationships clearer without becoming wooden.
  terminology: ‘여인들,’ ‘예수의 어머니 마리아,’ and ‘예수의 형제들’ are appropriate. ‘형제들’ preserves ἀδελφοί without deciding whether the relationship was biological or a broader kinship category.
  issues:
