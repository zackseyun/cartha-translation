review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal sense accurately: Jesus'' post-suffering life, evidential demonstrations, appearances across forty days, and teaching about God''s kingdom. However, its clause order makes the many proofs sound chiefly like evidence supplied after the appearances and teaching, whereas the Greek presents the proofs as accompanying his presentation of himself alive.'
  naturalness: The Korean is generally natural and appropriately formal-polite. Reordering into two sentences improves readability and more clearly attaches 'many convincing proofs' to Jesus' demonstration that he was alive. '사십 일에 걸쳐' naturally conveys appearances distributed throughout the period.
  terminology: '''고난을 받으신 후,'' ''하나님 나라,'' and ''살아 계심'' are suitable standard Korean biblical terminology in formal-polite register. ''많은 확실한 증거'' appropriately represents the evidential force of τεκμήρια without adding doctrinal interpretation.'
  issues:
  - severity: medium
    issue: The placement of '많은 확실한 증거로' is syntactically delayed.
    rationale: In the Greek, ἐν πολλοῖς τεκμηρίοις directly qualifies Jesus' presenting himself alive. The revision places the phrase with '자신이 살아 계심을 ... 보이셨습니다' to preserve that relationship clearly.
  - severity: low
    issue: '''사십 일 동안'' can be heard as continuous duration.'
    rationale: δι’ ἡμερῶν τεσσεράκοντα refers to appearances occurring across a forty-day period. '사십 일에 걸쳐' more naturally retains this distributive sense.
  revised_text: 예수께서는 고난을 받으신 후, 많은 확실한 증거로[a] 자신이 살아 계심을 사도들에게 보이셨습니다. 사십 일에 걸쳐 그들에게 나타나시고 하나님 나라에 관한 일들을 말씀하셨습니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 τεκμηρίοις는 어떤 사실을 확실하게 입증하는 증거들을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision keeps the explicit antecedent '사도들에게,' which is supplied by the immediately preceding context, while placing the evidential phrase next to the act of demonstrating that Jesus was alive. It also renders the forty-day phrase as a span over which appearances occurred. The footnote wording is adjusted to match the plural Greek form and formal-polite register.
