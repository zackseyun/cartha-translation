review_pass:
  verdict: revise
  source_fidelity: The draft conveys Jesus' post-suffering appearance, his being alive, the many evidences, the forty-day period, and his teaching about God's kingdom. However, its participial sequencing can make the evidences sound like a later, separate act after the appearances and teaching. Recasting the sentence more closely reflects the Greek main assertion with its accompanying participles.
  naturalness: The draft is generally clear and uses suitable modern formal-polite Korean. A source-order revision gives a smoother Korean sentence while retaining the connection of the appearances and teaching to the forty-day period.
  terminology: '"하나님 나라" and "고난을 받으신" are appropriate. "그리스어" is preferred to the older label "헬라어." "많은 증거" adequately renders πολλοῖς τεκμηρίοις; the explanatory footnote may note its certainty-establishing force without making "확실한" part of the main text.'
  issues:
  - severity: low
    issue: Participial relationship is less transparent in the draft's clause order.
    rationale: The Greek states that he presented himself alive after suffering, with many proofs, while appearing over forty days and speaking about God's kingdom. Placing the forty-day appearances and teaching before the final main verb can be read as a sequential chain in Korean rather than as accompanying actions.
  - severity: low
    issue: Footnote uses the dated term "헬라어."
    rationale: '"그리스어" is the standard modern Korean designation and better fits the requested register.'
  revised_text: 예수께서는 고난을 받으신 뒤 많은 증거를 통하여 자신이 살아 계심을 그들에게 보이셨습니다. 사십 일 동안 그들에게 나타나시고 하나님 나라에 관한 일을 말씀하셨습니다.
  revised_footnotes:
  - marker: a
    text: 그리스어 τεκμηρίοις는 확실성을 입증하는 증거를 가리킨다.
    reason: lexical_alternative
  revision_rationale: The revision makes the principal assertion—Jesus' showing himself alive after suffering, with many proofs—explicit before rendering the actions that occurred over forty days. It preserves the source's temporal span, recipients, and kingdom-teaching content. The footnote wording is modernized without adding a doctrinal claim.
