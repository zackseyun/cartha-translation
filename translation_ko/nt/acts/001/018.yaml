  terminology: ‘불의의 삯’은 μισθὸς τῆς ἀδικίας의 도덕적으로 부정적인 표현과 ‘삯/대가’의 의미를 보존합니다. ‘내장’은 σπλάγχνα의 구체적인 신체 의미에 적절합니다.
