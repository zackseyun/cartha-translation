  source_fidelity: ‘사들였는데’는 ἐκτήσατο(얻다/취득하다)를 개인의 직접 구매로 한정하여, 유다가 관련된 돈을 통해 그 밭을 취득한 것으로 말할 수 있는 원문의 여지를 좁힙니다. ‘얻었고’가 이를 충실히 보존합니다. πρηνὴς γενόμενος는 ‘머리부터 떨어져’로 옮길 수 있으나 해석상 여지가 있어 각주로 밝혔습니다.
