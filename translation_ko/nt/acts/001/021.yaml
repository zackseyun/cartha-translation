review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inference, the Lord Jesus, the comprehensive time span, and the idiom of going in and out among the group. However, 사람들 weakens ἀνδρῶν, which specifically denotes men, and 함께 다녔던 is more interpretive than the participle’s basic sense of being together with the apostolic group.
  naturalness: 주 예수께서 우리 가운데 드나드신 모든 기간에 우리와 함께 있었던 남자들 가운데 한 사람이 반드시— is natural modern formal Korean while appropriately retaining the verse’s syntactic continuation into verse 22.
  terminology: 주 예수 properly renders ὁ κύριος Ἰησοῦς. 남자들 preserves the explicitly male noun ἀνδρῶν. 그리스어 is preferable to 헬라어 in contemporary standard Korean usage.
  issues:
  - severity: medium
    issue: 사람들 does not preserve ἀνδρῶν.
    rationale: ἀνήρ denotes men in this context; a gender-neutral Korean term loses source information.
  - severity: low
    issue: 우리와 함께 다녔던 overstates the lexical image of συνελθόντων.
    rationale: The participle means those who had come together with/were with the group. 우리와 함께 있었던 communicates the sustained association required by the context without adding the image of traveling together.
  - severity: low
    issue: The footnote reason and wording need alignment.
    rationale: The note explains a cultural/idiomatic expression rather than offering a lexical alternative, and 그리스어 is the standard current designation.
  revised_text: 그러므로 주 예수께서 우리 가운데 드나드신 모든 기간에 우리와 함께 있었던 남자들 가운데 한 사람이 반드시—
  revised_footnotes:
  - marker: a
    text: 「드나드시다」는 예수께서 제자들 가운데서 계속 공적으로 활동하신 것을 가리키는 그리스어 관용 표현입니다.
    reason: cultural_note
  revision_rationale: The revision preserves the source’s masculine reference and its temporal scope, renders the association with the apostles without unnecessary paraphrase, and retains the dash because the necessary complement is completed in the following verse. The supplied 한 사람이 makes Korean syntax workable and reflects the immediately continuing construction without changing the intended meaning.
