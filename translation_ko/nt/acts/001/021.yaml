  verdict: revise
  source_fidelity: 초안의 「사람들」은 ἀνδρῶν(남자들)의 성별 한정을 약화합니다. 또한 「우리와 함께 다녔던」은 지속적 동행이라는 문맥적 의미는 전달하지만, 「우리와 함께 지내 온」이 συνελθόντων의 ‘우리와 함께한 이들’이라는 표현을 더 절제하여 반영합니다. δεῖ의 필연성은 다음 절의 보어와 연결되는 미완결 구문이므로, 이 절만으로 완결시키지 않았습니다.
  naturalness: 「주 예수께서 우리 가운데 드나드시던 모든 기간 동안 우리와 함께 지내 온 남자들 가운데서—」는 현대 표준 한국어로 자연스러우며, 다음 절로 이어지는 베드로의 미완결 문장을 보존합니다.
  terminology: 「주 예수」는 ὁ κύριος Ἰησοῦ를 적절히 옮깁니다. 「남자들」은 ἀνήρ의 남성 지시를 보존합니다. 「드나드시다」는 εἰσῆλθεν καὶ ἐξῆλθεν의 관용적 표현을 유지합니다.
  issues:
  - severity: medium
    issue: ἀνδρῶν을 「사람들」로 번역함
    rationale: 원문 ἀνήρ는 여기서 성인 남성을 가리키므로, 일반적인 「사람들」은 원문의 성별 한정을 보존하지 못합니다.
  - severity: low
    issue: 각주 reason이 내용과 맞지 않음
    rationale: 현 각주는 대안 어휘가 아니라 「드나들다」 관용구의 의미를 설명하는 문화·관용 표현 주석입니다.
  revised_text: 그러므로 주 예수께서 우리 가운데 드나드시던 모든 기간 동안 우리와 함께 지내 온 남자들 가운데서—
  revised_footnotes:
  - marker: a
    text: 「드나들다」는 예수께서 제자들 가운데서 지속적으로 공적 활동을 하신 것을 가리키는 관용적 표현입니다.
    reason: cultural_note
  revision_rationale: 「사람들」을 「남자들」로 고쳐 원문의 ἀνδρῶν을 반영하고, συνελθόντων의 문맥상 동반 관계는 과도하게 의역하지 않고 「우리와 함께 지내 온」으로 옮겼습니다. 시간 표현은 ἐν παντὶ χρόνῳ를 따라 「모든 기간 동안」으로 명시했습니다. 원문의 문장이 다음 절에 계속되므로 대시를 유지했습니다.
