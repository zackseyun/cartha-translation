  verdict: revise
  source_fidelity: The draft accurately conveys the Father’s authority and the disciples’ lack of entitlement to this knowledge. However, its syntax makes the Father’s setting of the times sound like the primary assertion ('...것이니') rather than preserving the Greek’s main clause, 'It is not for you to know.' The singular '그 시기' in the footnote also does not reflect the plural pair χρόνους ἢ καιρούς.
  naturalness: The proposed revision is natural in contemporary standard Korean and consistently uses formal-polite 합쇼체. '때와 시기' retains a readable distinction between the two related Greek temporal terms.
  terminology: '''아버지,'' ''권위,'' and ''때와 시기'' appropriately render ὁ πατήρ, ἐξουσία, and χρόνους ἢ καιρούς. ''자신의 권위로'' is idiomatic Korean for the sense of ἐν τῇ ἰδίᾳ ἐξουσίᾳ; the footnote records the more literal alternative without imposing a theological interpretation.'
  issues:
  - severity: medium
    issue: The main-clause emphasis is shifted by '...정하신 것이니, 너희가 알 바가 아니다.'
    rationale: Greek makes 'it is not for you to know' the main assertion, with 'which the Father has set...' modifying 'times or seasons.' The revision preserves that structure more clearly.
  - severity: low
    issue: The footnote refers to '그 시기' in the singular.
    rationale: The source has the plural temporal pair χρόνους ἢ καιρούς ('times or seasons'). The footnote should refer to both terms in the plural.
