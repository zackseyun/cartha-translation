review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the casting of lots, the lot falling to Matthias, and his being reckoned with the eleven. However, “열한 사도와 함께 헤아려졌습니다” is a somewhat literal and unnatural rendering of συγκατεψηφίσθη with the group-reference μετά τῶν ἕνδεκα ἀποστόλων. Rendering him as counted as one among the eleven expresses the Greek result clearly without adding a doctrinal claim.
  naturalness: The draft is generally clear and uses appropriate modern formal-polite Korean. “그들을 두고 제비를 뽑았습니다” is more idiomatic in this selection context than the unqualified “제비를 뽑았는데,” and “열한 사도 가운데 한 사람으로 헤아려졌습니다” is natural Korean.
  terminology: “제비,” “맛디아,” and “사도” are appropriate standard Korean biblical terms. “맛디아” follows established Korean Bible name usage for Μαθθίας. “헤아려졌습니다” retains the sense of being counted/reckoned, rather than importing the stronger notion of appointment.
  issues:
  - severity: low
    issue: The lot-casting is left unqualified.
    rationale: The Greek includes αὐτοῖς, referring to the persons under consideration. Korean “그들을 두고” naturally conveys that the lots were cast with reference to the candidates.
  - severity: medium
    issue: “열한 사도와 함께 헤아려졌습니다” is overly literal and awkward.
    rationale: Although μετά can be rendered “with,” the clause means that Matthias was reckoned as part of the eleven-apostle group. “열한 사도 가운데 한 사람으로 헤아려졌습니다” expresses this without implying more than συγκατεψηφίσθη states.
  revised_text: 그리고 그들은 그들을 두고 제비를 뽑았습니다. 제비가 맛디아에게 떨어졌고, 그는 열한 사도 가운데 한 사람으로 헤아려졌습니다.
  revised_footnotes: []
  revision_rationale: The revision improves idiomatic Korean while preserving the narrative sequence and the selection-by-lot procedure. It renders συγκατεψηφίσθη as being reckoned among the group, without construing the verse as an explicit statement of divine appointment or adding ecclesiological implications.
