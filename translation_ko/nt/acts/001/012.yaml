  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
  footnotes:
  - marker: a
    text: Or more traditionally, “called the Mount of Olives.”
    reason: lexical_alternative
  - marker: b
    text: A “Sabbath day’s journey” was the customary distance a Jew could travel on the Sabbath.
    reason: cultural_note
translation:
  language: ko
  text: 그때에 그들은 예루살렘 가까이, 안식일 길만큼 떨어져 있는 감람산[a]이라 불리는 산에서 예루살렘으로 돌아왔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 「올리브들의 산」입니다. 전통적으로 「감람산」이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 「안식일 길」은 유대 관습에서 안식일에 이동할 수 있다고 여긴 거리를 가리킵니다.
    reason: cultural_note
