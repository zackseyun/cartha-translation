  verdict: revise
  source_fidelity: 개정이 필요합니다. πεσὼν ἐπὶ τὴν γῆν은 단순히 ‘땅에 쓰러져/땅에 떨어져’라는 뜻이며, ‘엎드러지자’는 엎드린 자세를 구체화하고 시간 관계도 더 강하게 만듭니다. 또한 ἤκουσεν은 ‘들었습니다’로 주체의 청취를 명시하는 편이 정확합니다. 나머지 호격 반복과 ‘왜 나를 박해하느냐?’는 원문을 충실히 반영합니다.
  naturalness: ‘그에게 말씀하시는 한 음성이 들려왔습니다’는 ‘음성’이 ‘말씀하다’의 주체가 되는 구조와 ‘한 음성’이 다소 부자연스럽습니다. ‘그에게 말씀하시는 음성을 들었습니다’가 현대 한국어 성서 문체에서 자연스럽고 원문의 구조도 보존합니다.
  terminology: ‘사울아, 사울아’는 이름의 반복 호격을 잘 보존합니다. ‘박해하다’는 διώκεις의 적대적 추적·박해라는 문맥에 적절합니다. 본문에 ‘신현현’ 등의 해석적 규정은 넣지 않는 것이 바람직합니다.
  issues:
  - severity: medium
    issue: ‘땅에 엎드러지자’가 πεσὼν ἐπὶ τὴν γῆν을 다소 구체화함
    rationale: 원문은 땅으로 떨어지거나 쓰러진 행위만 말하며, 엎드린 자세를 명시하지 않습니다. ‘-자’는 뒤 사건과의 시간 관계도 원문의 분사보다 더 단정적으로 들릴 수 있습니다.
  - severity: medium
