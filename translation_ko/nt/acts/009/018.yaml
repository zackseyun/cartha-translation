  - severity: medium
    issue: εὐθέως에 해당하는 ‘즉시’가 번역문에 없습니다.
    rationale: 원문은 비늘 같은 것이 떨어진 사건의 즉각성을 명시하므로 이를 반영해야 합니다.
  - severity: low
    issue: 번역문이 ‘세례를 받고,’로 끝나 한국어 문장으로 미완결입니다.
    rationale: 원문의 절 끝 쉼표를 기계적으로 보존하기보다, 한국어에서 자연스러운 완결 문장으로 옮길 수 있습니다.
