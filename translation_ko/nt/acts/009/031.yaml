  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
  footnotes:
  - marker: a
    text: Some manuscripts read 'the churches' instead of 'the church.'
    reason: textual_variant
  - marker: b
    text: Or 'comfort' or 'exhortation' of the Holy Spirit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 교회[a]는 온 유대와 갈릴리와 사마리아 전역에서 평안을 누리고 세워져 갔으며, 주를 경외하고 성령의 격려[b] 가운데 살아가면서 늘어 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 ‘교회’ 대신 ‘교회들’이라고 되어 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘성령의 위로’ 또는 ‘성령의 권면’.
    reason: lexical_alternative
