    issue: ‘더욱’이 원문에 없는 비교·강조를 더합니다.
    rationale: ἐπληθύνετο는 ‘늘어 가고 있었다/번성하고 있었다’라는 지속적 증가를 뜻하나, ‘더욱’에 해당하는 비교·강조어는 없습니다.
  - severity: low
    issue: ‘든든히’가 ‘세워져 갔으며’에 강화 의미를 추가합니다.
    rationale: οἰκοδομουμένη는 ‘세워져 가다, 덕을 세우다’의 건축 비유를 나타냅니다. ‘든든히’는 가능한 해석이지만 본문에는 없는 수식입니다.
  - severity: medium
    issue: 단수 ‘교회’의 복수 이문 및 παράκλησις의 어휘 대안에 대한 각주가 없습니다.
