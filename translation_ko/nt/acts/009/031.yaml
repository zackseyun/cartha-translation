  source_fidelity: 핵심 의미와 단수 집합명사인 ἐκκλησία는 잘 반영되었습니다. 다만 ‘더욱’은 원문의 미완료 동사 ἐπληθύνετο가 나타내는 지속적 증가에 비교급·강조의 의미를 더하므로 삭제하는 것이 안전합니다. ‘든든히’도 οἰκοδομουμένη의 ‘세워져 감’에 없는 강화 의미를 보탭니다.
  naturalness: 합쇼체 문체는 자연스럽고, ‘평안을 누리고’, ‘주를 경외하고’, ‘늘어 갔습니다’는 현대 표준어 성경 문맥에 적절합니다. ‘성령의 격려 가운데 살아가면서’는 원문의 병렬된 여격 표현과 삶의 행보라는 비유를 자연스럽게 보존합니다.
  terminology: ‘교회’, ‘주’, ‘성령’, ‘경외’는 적절합니다. παράκλησις는 본문에서 ‘격려’로 옮기고 ‘위로’와 ‘권면’을 각주로 제시하여 어휘 범위를 보존하는 것이 좋습니다. 단수 ‘교회’의 중요한 본문 이문도 각주로 밝혀야 합니다.
  issues:
