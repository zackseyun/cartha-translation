  to: 듣는 사람들은 모두 놀라서 이렇게 말하였습니다. 「이 사람은 예루살렘에서 이 이름을 부르는 사람들을 유린하던 자가 아닌가? 또 그들을 결박한 채 대제사장들에게 데려가려고 여기까지 온 것이 아닌가?」
