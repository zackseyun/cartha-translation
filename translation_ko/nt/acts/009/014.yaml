  naturalness: ‘여기서 … 권한을 가지고 있습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 인용문 안의 아나니아의 발화에도 적절합니다.
  terminology: ἀρχιερεῖς는 ‘대제사장들’, δῆσαι는 원문의 이미지를 보존하는 ‘결박하다’로 옮겼습니다. ‘주의 이름을 부르다’는 ἐπικαλεῖσθαι τὸ ὄνομα의 성경적 관용구를 보존하며, 각주로 가능한 ‘부르다/간구하다’의 뉘앙스를 밝혔습니다.
