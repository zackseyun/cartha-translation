  - severity: medium
    issue: ‘받아’가 현재의 소유를 과거의 수령 행위로 약화함
    rationale: παρὰ τῶν ἀρχιερέων은 권한의 출처를, ἔχει는 현재의 소유를 나타냅니다. ‘대제사장들에게서 … 권한을 가지고 있습니다’가 두 요소를 더 직접적으로 반영합니다.
  revised_text: 또 그는 여기서 대제사장들에게서 주의 이름을 부르는[a] 모든 사람을 결박할 권한을 가지고 있습니다.”
