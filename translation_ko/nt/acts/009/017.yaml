- from: 아나니아가 떠나 그 집에 들어가 사울에게 손을 얹고 말하였습니다. 「형제 사울이여, 당신이 오던 길에 당신에게 나타나신 주, 곧 예수께서 나를 보내셨습니다. 당신이 다시 보게 되고 성령으로 충만케 되도록 말입니다.」
  to: 아나니아가 가서 그 집에 들어가 사울에게 손을 얹고 말하였습니다. “사울 형제여, 주님, 곧 네가 오던 길에서[a] 네게 나타나신 예수님께서, 네가 시력을 되찾고 성령으로 충만하게 되도록 나를 보내셨습니다.[b]”
  rationale: The revision keeps Jesus explicitly appositional to ‘the Lord,’ connects the two purpose outcomes directly to the sending, and updates direct address and phrasing for natural modern formal Korean. The footnotes preserve the English audit trail’s alternatives for the imperfect travel expression and recovery of sight.
