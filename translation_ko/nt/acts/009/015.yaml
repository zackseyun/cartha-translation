  source_fidelity: The draft correctly identifies the Lord's speech, the command to go, Paul's chosen status, and the threefold audience. However, it omits the closing quotation mark and renders the imperative in non-polite informal speech (가거라), contrary to the requested modern formal-polite register.
  naturalness: ‘내 이름을 들고 갈’ is understandable and preserves the metaphor, but ‘내 이름을 전하기 위해’ is more natural Korean in this missionary context while retaining the purpose expressed by τοῦ βαστάσαι. ‘내가 택한 그릇’ is an established and natural biblical metaphor in Korean.
  terminology: ‘주님,’ ‘이방인들,’ ‘임금들,’ ‘이스라엘 자손들,’ and ‘그릇’ preserve the key terms and biblical register without imposing doctrinal interpretation. ‘택한’ renders ἐκλογῆς appropriately without importing a systematized doctrine of election.
  issues:
  - severity: high
    issue: The sentence lacks a closing quotation mark.
    rationale: This is a structural punctuation defect that leaves the direct speech unclosed.
  - severity: medium
    issue: ‘가거라’ does not follow the required modern formal-polite 합쇼체 register.
    rationale: The direct imperative should be rendered formally as ‘가십시오.’
  - severity: low
    issue: The wording can more naturally express the purpose of bearing Jesus’ name.
    rationale: ‘내 이름을 전하기 위해’ is idiomatic Korean and faithfully conveys the purpose infinitive in its public-witness context.
  revised_text: 그러나 주님께서 그에게 말씀하셨습니다. “가십시오. 이 사람은 이방인들과 임금들과 이스라엘 자손들 앞에 내 이름을 전하기 위해 내가 택한 그릇입니다.”
