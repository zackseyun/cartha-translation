  source_fidelity: 전반적인 사건 순서와 의미는 잘 옮겼습니다. 다만 πᾶσαι αἱ χῆραι는 복수 주어이므로 ‘모든 과부들이’로 해야 하며, ἐποίει의 미완료 시제는 도르가가 계속하거나 습관적으로 만들던 옷이라는 뉘앙스를 지닌 ‘만들던’으로 옮기는 것이 더 가깝습니다. ἀνήγαγον의 주어는 원문에서 특정되지 않으므로 ‘사람들이’보다 ‘그들이’가 불필요한 명시를 피합니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. ‘모든 과부가’는 한국어 문법상 단수처럼 들리고 집단 주어와도 호응하지 않으므로 ‘모든 과부들이’로 고칩니다. ‘속옷과 겉옷’은 현대 한국어에서 속옷을 좁게 이해할 여지가 있으나, 두 고대 의복 용어의 관례적 구별을 유지하는 번역으로 사용 가능하며 주석으로 보완합니다.
  terminology: ‘베드로’, ‘다락방’, ‘도르가’는 적절합니다. χιτῶνας와 ἱμάτια의 구별은 ‘속옷과 겉옷’으로 유지하되, 여기서 ‘속옷’은 현대의 내의만을 뜻하지 않는다는 문화적 설명을 붙입니다.
  issues:
  - severity: medium
    issue: ‘모든 과부가’가 단수형으로 되어 있음
    rationale: πᾶσαι αἱ χῆραι는 ‘모든 과부들’이라는 복수 표현이며, 뒤의 ‘서서/울면서/보여 주었습니다’와도 복수 주어로 호응해야 합니다.
  - severity: low
    issue: ‘만든’이 미완료 시제의 지속·반복적 뉘앙스를 충분히 드러내지 못함
    rationale: ἐποίει는 미완료 직설법으로, 도르가가 그들과 함께 지내며 만들곤 하던 일을 나타냅니다. ‘만들던’이 문맥상 자연스럽고 더 가깝습니다.
  - severity: low
    issue: ‘사람들이’가 원문보다 주어를 다소 명시함
    rationale: ἀνήγαγον의 주어는 문맥상 앞서 온 이들이지만 본절에서는 단지 복수로 제시됩니다. ‘그들이’가 원문의 비특정성을 보존합니다.
  revised_text: 베드로가 일어나 그들과 함께 갔습니다. 그가 이르자 그들이 그를 다락방으로 데리고 올라갔는데, 모든 과부들이 그의 곁에 서서 울면서 도르가가 자기들과 함께 있을 때 만들던 속옷과 겉옷들을 보여 주었습니다.
  revised_footnotes:
