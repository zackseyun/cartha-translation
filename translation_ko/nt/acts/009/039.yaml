    text: ‘속옷과 겉옷’은 그리스어의 서로 다른 두 의복 명칭을 옮긴 것입니다. 여기서 ‘속옷’은 현대의 내의만을 뜻하지 않고, 몸에 가까이 입는 옷을 가리킬 수 있습니다.
    reason: cultural_note
  revision_rationale: 복수 주어를 바로잡고, 도르가의 반복적·지속적인 의복 제작을 나타내는 미완료 시제를 ‘만들던’으로 반영했습니다. 또한 원문의 비특정 복수 주어를 보존했으며, 의복 용어의 고대적 의미를 주석으로 설명했습니다.
