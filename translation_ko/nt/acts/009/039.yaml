    rationale: χιτών은 몸에 가까이 입는 기본 의복이지만, 본문의 문맥에서 현대식 속내의를 뜻하지는 않습니다. ἱμάτια와의 구별은 ‘옷과 겉옷’으로 자연스럽게 살릴 수 있습니다.
  - severity: low
    issue: ἐποίει의 미완료 과거가 ‘만든’에서 충분히 드러나지 않습니다.
    rationale: ‘만들던’은 도르가가 살아 있을 때 계속하거나 관례적으로 만들던 일을 무리 없이 반영합니다.
  - severity: low
    issue: ‘모든 과부가’는 집단 주어로 다소 어색합니다.
