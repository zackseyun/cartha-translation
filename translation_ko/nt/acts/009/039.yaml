  source_fidelity: 대체로 원문 흐름을 잘 따르지만, χιτῶνας를 현대 한국어에서 속옷/내의로 강하게 이해되는 ‘속옷’으로 옮긴 것은 부정확하거나 오해를 부를 수 있습니다. 또한 ἐποίει의 미완료 과거는 ‘만든’보다 ‘만들던’이 더 잘 반영합니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. 다만 집합 명사인 ‘모든 과부가’는 ‘과부들이 모두’가 더 자연스럽고, ‘사람들이’보다 문맥상 선행하는 사절들을 가리키는 ‘그들은’이 더 매끄럽습니다.
  terminology: ‘다락방’은 ὑπερῷον의 적절한 번역입니다. 도르가도 적절합니다. 의복 두 종류의 구별은 ‘옷과 겉옷’으로 유지하되, 첫 항을 현대적 속내의로 오해될 수 있는 ‘속옷’으로 한정하지 않는 편이 좋습니다.
