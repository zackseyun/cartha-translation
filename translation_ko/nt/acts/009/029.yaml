  revision_rationale: 집단명 Ἑλληνισταί를 음역하여 보존하고, 독자의 이해를 위해 각주에 문맥상 지시 대상을 제시했습니다. 두 미완료 동사의 지속적 성격은 한국어에서 자연스러운 범위 내에서 ‘말하고 변론하였습니다’ 및 ‘죽이려 하고 있었습니다’로 반영했습니다. δέ의 대조는 ‘그러나’로 옮겼습니다.
