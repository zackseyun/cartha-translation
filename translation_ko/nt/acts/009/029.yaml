  source_fidelity: 초안은 Ἑλληνιστάς를 ‘헬라어를 쓰는 사람들’로 일반화하여, 사도행전에서의 특정 집단 명칭이라는 뉘앙스를 충분히 보존하지 못합니다. 또한 ἐπεχείρουν의 미완료적 지속성을 ‘죽이려고 하였습니다’보다 ‘죽이려 하고 있었습니다’가 더 잘 드러냅니다.
  naturalness: ‘헬라어를 쓰는 사람들’은 현대 한국어로는 다소 설명적이며, 본문에서는 집단명 ‘헬레니스트들’을 쓰고 각주로 뜻을 밝히는 편이 자연스럽고 정확합니다. ‘말하고 변론하며’는 두 동작의 연결을 자연스럽게 나타냅니다.
  terminology: Ἑλληνισταί는 단순히 그리스어를 사용하는 모든 사람을 뜻하기보다, 여기서는 통상 예루살렘의 그리스어 사용 유대인들을 가리키는 명칭으로 이해됩니다. 음역어 ‘헬레니스트들’과 비해석적 설명 각주를 사용합니다.
  issues:
  - severity: medium
    issue: Ἑλληνιστάς의 일반화
    rationale: ‘헬라어를 쓰는 사람들’은 해당 용어를 언어 능력만으로 규정하며, 본문이 가리키는 사회·종교적 집단 명칭을 흐립니다.
  - severity: low
    issue: ἐπεχείρουν의 미완료상 약화
    rationale: ‘죽이려고 하였습니다’는 시도 자체는 전달하지만 진행·반복적 시도의 뉘앙스가 약합니다.
  - severity: low
    issue: ‘또’의 첨가
    rationale: τε καί는 두 동사 ‘말하다’와 ‘변론하다’를 연결하며, 문맥상 별도의 ‘또’라는 부가 의미를 요구하지 않습니다.
  revised_text: 그는 헬레니스트들과 말하고 변론하였습니다. 그러나 그들은 그를 죽이려 하고 있었습니다.
