  to: 아나니아가 대답하였습니다. “주님, 저는 이 사람에 관하여 많은 이들에게서 들었습니다. 그가 예루살렘에서 주님의 성도들에게 얼마나 많은 악한 일을 했는지요.”
  rationale: The revision corrects the unclosed quotation and incomplete final clause, uses natural modern formal-polite Korean, and more closely represents ὅσα κακά as “얼마나 많은 악한 일을.” No footnote is necessary because the translation does not introduce an ambiguity requiring explanation.
