    issue: '"산 채로" for ζῶσαν'
    rationale: Although literally related to being alive, "산 채로" is less idiomatic here and may imply merely that she was still alive. The Greek presents her demonstrably alive following her restoration; "살아 있는 모습으로" conveys this result clearly.
