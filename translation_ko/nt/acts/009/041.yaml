  verdict: revise
  source_fidelity: The draft accurately represents the sequence of Peter extending his hand, raising her, summoning the saints and widows, and presenting her alive. However, "산 채로" is not the best Korean predicate rendering of ζῶσαν in this context; it can suggest an incidental contrast ('while still alive') rather than the emphatic result that she is alive.
  naturalness: '"그 여인을 살아 있는 모습으로 보여 주었습니다" is clear, idiomatic modern Korean and naturally conveys that Peter presented her to the summoned group as alive. "그녀에게 손을 내밀어" and "일으켜 세우고" are natural formal-polite narrative phrasing.'
  terminology: '"성도들" faithfully renders τοὺς ἁγίους, and "과부들" faithfully renders τὰς χήρας. "일으켜 세우다" is a suitable rendering of ἀνέστησεν; the note preserves its possible resonance with resurrection terminology without making the immediate action more specific than the Greek does.'
  issues:
