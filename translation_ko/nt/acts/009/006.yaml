  source_fidelity: 초안의 ‘누가 너에게’는 그리스어 미래 수동태(λαληθήσεταί σοι)에 없는 행위자를 보충하므로, 원문의 비특정·간접적 표현을 약화합니다. 또한 종결 따옴표는 짝이 없습니다. ‘해야 할’은 σε δεῖ ποιεῖν의 필연/의무의 힘을 적절히 반영합니다.
  naturalness: ‘일어나 성으로 들어가십시오’와 ‘…듣게 될 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘듣게 될 것입니다’는 한국어에서 자연스러운 방식으로 원문의 수동적·비특정적 전달을 유지합니다.
  terminology: ‘성’은 문맥상 πόλις의 전통적 성경 용례이면서 현대 독자에게도 이해 가능합니다. δεῖ의 강한 필요는 ‘해야 할’로 유지했습니다. 특정한 신적 행위자나 교리적 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘누가 너에게 일러 줄 것이다’가 비특정 수동태에 행위자를 보충함
    rationale: λαληθήσεταί σοι는 문자적으로 ‘너에게 말해질 것이다’이며, 누가 말할지를 밝히지 않습니다. ‘누가’는 원문에 없는 행위자 존재를 명시합니다.
  - severity: low
    issue: 합쇼체 요구와 초안의 ‘들어가거라’ 불일치
    rationale: 대상 변형이 현대 격식체 합쇼체이므로 ‘들어가십시오’가 요구되는 문체에 맞습니다.
  - severity: low
