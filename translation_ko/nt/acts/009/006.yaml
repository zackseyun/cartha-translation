review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative turn, the commands to rise and enter the city, and the necessity expressed by δεῖ. However, the explicit subject “누가” adds an actor not stated in the Greek future passive (λαληθήσεταί σοι).
  naturalness: “들어가거라” does not maintain the requested modern formal-polite 합쇼체 register. “일어나 성으로 들어가십시오” is natural formal-polite Korean. An agentless active construction is more natural than a literal Korean passive here.
  terminology: “성” appropriately renders πόλις in this setting, and “해야 할 일” naturally conveys ὅ τί σε δεῖ ποιεῖν without weakening the force of necessity.
  issues:
  - severity: medium
    issue: Register mismatch in “들어가거라”
    rationale: The target register is modern formal-polite 합쇼체; the imperative should be “들어가십시오.”
  - severity: medium
    issue: Added explicit agent in “누가 너에게”
    rationale: The Greek uses an impersonal future passive, “it will be spoken/told to you,” without identifying who will speak. Korean can preserve this indirectness by omitting the subject.
  revised_text: 그러나 일어나 성으로 들어가십시오. 그러면 네가 해야 할 일을 네게 일러 줄 것입니다.”
  revised_footnotes:
  - marker: a
    text: 직역하면, “네가 해야 할 것이 네게 말해질 것입니다.”
    reason: λαληθήσεταί σοι의 비인칭적 미래 수동 표현을 드러내며, 본문의 자연스러운 한국어 능동 표현이 화자를 특정하지 않음을 보여 준다.
  revision_rationale: 합쇼체 명령형으로 고치고, 원문의 비특정 수동 표현에 없는 “누가”를 삭제했습니다. “그러면”은 두 번째 καί가 이어 주는 결과적 진행을 자연스럽게 나타내며, “해야 할 일”은 δεῖ의 필요·의무의 힘을 유지합니다.
