    reason: 미래 수동태 λαληθήσεταί σοι의 비특정적·간접적 표현을 보여 주는 직역 대안입니다.
  revision_rationale: 원문의 대조 접속사(‘그러나’), 두 명령, 그리고 미래 수동태의 비특정성을 유지하도록 고쳤습니다. 한국어에서 어색한 ‘말해질 것이다’ 대신 ‘듣게 될 것이다’를 사용하되, 직역 가능성은 각주로 제시했습니다. 합쇼체로 통일하고 불필요한 닫는 따옴표를 제거했습니다.
