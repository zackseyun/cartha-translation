  text: 그러나 바나바는 그를 데리고 사도들에게 가서, 그가 길에서 어떻게 주님을 뵈었는지와 주님께서 그에게 말씀하셨다는 것, 그리고 그가 다마스쿠스에서 어떻게 예수의 이름으로 담대히 말하였는지를 그들에게 이야기하였습니다.
