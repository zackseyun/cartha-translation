review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's statement, Jesus' present-tense healing declaration, the commands, and the immediate response. However, '네 자리를 정돈하여라' both weakens στρῶσον ('prepare/spread one's bedding') into general tidying and uses a non-합쇼체 imperative.
  naturalness: The narrative is natural modern Korean. The direct speech needs consistent modern formal-polite register; '일어나 ... 하십시오' is appropriate. '메시아이신 예수께서' naturally expresses 'Jesus the Messiah' in Korean.
  terminology: '''메시아'' correctly reflects Χριστός as a title. ''고치십니다'' retains the Greek present without imposing a completed-healing nuance. ''침상'' conveys the bedding/bed sense of στρῶσον without specifying a modern bed.'
  issues:
  - severity: medium
    issue: The imperative '정돈하여라' is not in the required modern formal-polite 합쇼체 register.
    rationale: The target variant explicitly requires 합쇼체. It should be rendered as '정돈하십시오.'
  - severity: low
    issue: '''네 자리를 정돈하다'' is broader than the bedding-specific command στρῶσον σεαυτῷ.'
    rationale: The Greek calls Aeneas to prepare or arrange his own bedding/bed. '자신의 침상을 정돈하십시오' more directly retains that sense while reading naturally.
