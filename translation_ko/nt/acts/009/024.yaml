  terminology: ‘음모’, ‘사울’, ‘죽이려고’, ‘성문들’은 문맥과 용례에 적절합니다. ‘성문들’은 문맥상 도시의 문들을 가리키며, 원문의 복수형도 반영합니다.
  issues:
