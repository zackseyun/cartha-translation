    issue: ‘성문을 지키고 있었습니다’
    rationale: παρετηροῦντο는 단순히 경비를 서거나 지키는 행위보다, 사울을 붙잡아 죽이려는 목적으로 출입구를 계속 감시하는 것을 나타냅니다. ‘감시하고 있었습니다’가 동사의 의미와 미완료 과거의 지속성을 더 정확히 보존합니다.
  - severity: low
    issue: καὶ(‘또한’)의 첨가 의미가 드러나지 않음
    rationale: ‘또’ 또는 ‘또한’을 넣으면 음모를 꾸민 것에 더하여 성문들을 감시했다는 원문의 첨가적 연결을 반영할 수 있습니다.
