  source_fidelity: 첫 문장은 ἐγνώσθη의 비인칭 수동 표현과 ἐπιβουλή를 충실히 옮겼습니다. 그러나 παρετηροῦντο는 지속적인 감시·주시를 뜻하므로 ‘지키고 있었습니다’보다 ‘감시하고 있었습니다’가 원문에 더 가깝습니다. καὶ의 첨가 의미도 ‘또’로 드러내는 것이 좋습니다.
