  - severity: medium
    issue: ‘살기’는 φόνος의 의미를 충분히 직접적으로 나타내지 못합니다.
    rationale: ‘살기’는 위협적인 기세나 분위기를 뜻할 수 있으나, φόνος는 살해/قتل의 의미 영역입니다. 이 문맥에서는 ‘살의’가 자연스러운 한국어 관용을 유지하면서도 살해 의도를 더 잘 전달합니다.
  - severity: low
