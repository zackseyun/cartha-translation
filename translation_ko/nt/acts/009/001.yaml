  terminology: κύριος는 ‘주님’으로, μαθηταί는 ‘제자들’로, ἀρχιερεύς는 ‘대제사장’으로 옮겼습니다. ‘주님의’는 현대 한국어에서 ‘주의’보다 소유 관계와 호칭을 더 분명하고 자연스럽게 나타냅니다.
