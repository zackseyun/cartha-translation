  terminology: Ἰουδαίους는 이 문맥에서 ‘유대인들’로, ὁ χριστός는 유대적 메시아 칭호를 보존하여 ‘메시아’로 옮겼습니다. ‘이분’은 οὗτός의 강조된 지시를 보존하며, 불필요하게 교리적 내용을 덧붙이지 않습니다.
