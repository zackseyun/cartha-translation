revisions:
- from: 사울이 예루살렘에 이르러 제자들과 어울리려 하였으나, 모두가 그를 두려워하고 그가 제자라는 것을 믿지 못하였습니다.
  to: 사울이 예루살렘에 이르러 제자들과 어울리려고 하였으나, 모두가 그를 두려워하였습니다. 그가 제자임을 믿지 않았기 때문입니다.
  rationale: 'The revision preserves the Greek narrative sequence and contrast: Saul sought association with the disciples, but they feared him because they did not believe he was a disciple. It removes the possible inability nuance of ''믿지 못하였습니다'' and makes the causal participle explicit in natural Korean.'
  reviewer_model: gpt-5.6-terra
