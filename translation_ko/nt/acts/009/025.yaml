  text: 그러나 사울의 제자들이 밤에 그를 데리고 큰 광주리에 담아 성벽을 통해 내려보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “성벽을 통해”입니다. 이는 성벽에 난 구멍이나 창을 가리킬 가능성이 있지만, 그리스어 본문은 이를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘내려보냈다’와 ‘내려서’라는 두 표현을 함께 사용하여 탈출시키는 방식을 생생하게 나타냅니다.
    reason: lexical_alternative
