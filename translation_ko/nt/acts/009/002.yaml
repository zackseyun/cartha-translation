    text: 또는 ‘그 길의’. 그리스어는 초기 그리스도교 운동을 가리키는 명칭을 사용합니다.
    reason: τῆς ὁδοῦ의 직역적 가능성과 초기 운동 명칭으로서의 용법을 밝혀, 본문의 표현을 보존하면서 의미를 명료하게 합니다.
