  to: 그에게 다마스쿠스에 있는 회당들에 보낼 편지들을 청하였습니다. 이는 그 길[a]에 속한 사람들을, 남자든 여자든, 발견하면 결박한 채 예루살렘으로 끌고 오려는 것이었습니다.
