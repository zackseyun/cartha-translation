  to: 사울과 동행하던 사람들은 그 음성[a]은 들었지만 아무도 보지 못하고, 말문이 막힌 채 서 있었습니다.
  rationale: ‘말없이’를 ‘말문이 막힌 채’로 고쳐 ἐνεοί의 무언(無言) 이상의 의미를 반영했습니다. φωνή는 본문에서 ‘음성’으로 유지하되, ‘소리’라는 어휘적 대안은 각주로 제시했습니다. 이는 사도행전 22:9과의 관계를 특정 방식으로 조화시키지 않고 본문의 어휘적 모호성을 보존합니다.
