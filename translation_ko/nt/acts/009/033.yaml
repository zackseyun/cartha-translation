  source_fidelity: 원문의 εὗρεν(‘발견했습니다’)은 단순한 만남보다 발견의 서술을 나타내므로 ‘만났는데’보다 ‘발견했습니다’가 더 가깝습니다. παραλελυμένος는 ‘중풍에 걸려’보다 넓은 ‘마비되어’로 옮기는 것이 원문의 의미를 불필요하게 한정하지 않습니다. κράβαττος의 구체적 이미지는 ‘침상’으로 반영했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 장기간 누워 있던 상태를 명료하게 표현합니다.
  terminology: 인명 ‘Αἰνέαν’은 한국어 성경 번역 관례와 음역에 따라 ‘애니아’로 유지했습니다. ‘마비되어’는 의학적 진단이나 특정 질환명을 덧붙이지 않고 παραλελυμένος의 상태를 충실히 전달합니다.
  issues:
