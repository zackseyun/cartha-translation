    rationale: 원문은 베드로가 그곳에서 그 사람을 ‘발견했다’고 서술하며, 이전부터 알고 있던 사람과의 단순한 만남을 뜻하지 않습니다.
  - severity: medium
    issue: ‘중풍에 걸려’는 παραλελυμένος를 특정 질환으로 한정합니다.
    rationale: 그리스어는 마비 상태를 뜻하며, 현대 한국어에서 ‘중풍’은 흔히 뇌졸중을 가리켜 원문에 없는 원인 또는 진단을 암시할 수 있습니다.
