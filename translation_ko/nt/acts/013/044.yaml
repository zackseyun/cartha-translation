source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
  footnotes:
  - marker: a
    text: Or 'On the next Sabbath' or 'On the following Sabbath.'
    reason: lexical_alternative
  - marker: b
    text: '''The word of the Lord'' may also be understood as ''the Lord''s message'' or, contextually, ''the message about the Lord.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그다음 안식일[a]에 거의 온 성이 주의 말씀[b]을 들으려고 모였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다가오는 안식일” 또는 “다음 안식일”.
    reason: Τῷ ἐρχομένῳ σαββάτῳ의 시간적 표현은 ‘다가오는/다음/그다음 안식일’로 옮길 수 있다.
  - marker: b
    text: “주의 말씀”은 “주께서 주신 말씀”, “주님에 관한 메시지”로도 이해할 수 있다.
    reason: τοῦ κυρίου가 수식하는 λόγος는 소유·기원 및 내용의 뉘앙스를 겹쳐 가질 수 있으므로, 본문에서는 이를 해석적으로 한정하지 않는다.
