translation:
  language: ko
  text: 회당 모임이 끝난 뒤에, 많은 유대인들과 경건한 유대교 개종자들이 바울과 바나바를 따라갔습니다. 바울과 바나바는 그들과 이야기하며 그들에게 하나님의 은혜 안에 계속 머물러 있으라고 권면하였습니다.
  philosophy: optimal-equivalence
