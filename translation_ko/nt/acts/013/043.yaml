  to: 회당 모임이 끝난 뒤에, 많은 유대인들과 경건한 유대교 개종자들이 바울과 바나바를 따라갔습니다. 바울과 바나바는 그들과 이야기하며 그들에게 하나님의 은혜 안에 계속 머물러 있으라고 권면하였습니다.
  rationale: 회당의 건물이 아니라 모인 회중의 해산을 가리키는 문맥을 ‘회당 모임이 끝난 뒤’로 자연스럽게 옮겼습니다. προσήλυτοι의 구체적 의미를 보존하고, προσμένειν의 지속성을 드러내며, 한국어 문장 흐름과 합쇼체 서술을 다듬었습니다.
