  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
  footnotes:
  - marker: a
    text: 'Or ''our ancestors.'' Greek: ''our fathers.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'exalted the people' or 'increased the people.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'with a high arm'; an Exodus idiom for God's powerful deliverance.
    reason: cultural_note
  - marker: d
    text: Or 'he brought them out from it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 이스라엘 백성의 하나님께서는 우리 조상들을[a] 택하시고, 그 백성이 이집트 땅에서 나그네로 머무는 동안 그들을 크게 하셨으며[b], 높이 드신 팔로[c] 그들을 그곳에서 이끌어 내셨습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 조상들’. 그리스어는 ‘우리 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 백성을 높이셨으며’ 또는 ‘번성하게 하셨으며’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘높은 팔로’. 출애굽 전승에서 하나님의 강력한 구원을 가리키는 표현입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘그들을 그곳에서 데리고 나오셨습니다’.
    reason: lexical_alternative
