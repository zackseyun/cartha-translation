  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: Now after the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
  footnotes:
  - marker: a
    text: Or “message of exhortation.” The Greek phrase can carry both encouragement and exhortation.
    reason: lexical_alternative
  - marker: b
    text: Greek “Men, brothers,” a respectful familial form of address.
    reason: lexical_alternative
translation:
  language: ko
  text: 율법과 예언서의 낭독이 있은 뒤, 회당장들은 그들에게 전갈을 보내어 이렇게 말했습니다. “형제 여러분[a], 여러분 가운데 백성을 위한 격려의 말[b]이 있으면 말씀하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 “남자들, 형제들이여.” 존중과 친족적 유대감을 나타내는 호칭입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “권면의 말.” 그리스어는 격려와 권면의 뜻을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
