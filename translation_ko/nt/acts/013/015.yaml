  source_fidelity: 수정이 필요합니다. 초안의 ‘사람을 보내어’는 ἀπέστειλαν을 지나치게 구체화하여 실제 사람을 파견했다는 뜻을 더하며, 이 문맥에서는 전달된 전갈을 가리키는 표현이 더 정확합니다. 또한 ‘권면할 말씀’은 λόγος παρακλήσεως의 격려/권면 양면성을 주로 권면으로 한정합니다.
  naturalness: ‘전갈을 보내어 이렇게 말했습니다’는 회당 책임자들이 방문자들에게 전달한 초청의 뜻을 자연스럽게 나타냅니다. ‘형제 여러분’과 ‘말씀하십시오’는 현대 한국어의 정중한 합쇼체에 맞습니다.
  terminology: ‘율법과 예언서’는 회당에서 낭독된 성경의 두 구분을 나타내기에 적절합니다. ‘회당장들’은 ἀρχισυνάγωγοι의 복수형과 회당 내 직책을 자연스럽게 반영합니다. ‘격려의 말’에는 각주로 ‘권면’의 가능성을 밝혀 παρακλήσεως의 의미 폭을 보존합니다.
