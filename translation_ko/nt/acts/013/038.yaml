    reason: cross_reference
  - marker: c
    text: Or 'be declared righteous.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 형제 여러분[a], 여러분에게 알려 드립니다. 이분[b]을 통하여 여러분에게 죄 사함이 선포됩니다. 또한 모세의 율법으로는 여러분이 의롭다 하심을 받을 수 없었던 모든 것에서[c],
  philosophy: optimal-equivalence
  footnotes:
