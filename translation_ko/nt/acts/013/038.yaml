    text: 또는 ‘형제자매 여러분’. ἄνδρες ἀδελφοί는 청중에게 하는 관용적인 호칭입니다.
    reason: lexical_alternative
  - marker: b
    text: 바로 앞에서 언급된 예수를 가리킵니다.
    reason: cross_reference
  - marker: c
