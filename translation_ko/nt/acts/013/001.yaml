  source_fidelity: ‘어릴 적 친구’는 σύντροφος가 공유 양육이나 성장 배경을 암시할 수 있다는 가능성을 하나의 특정한 관계로 확정합니다. 본문의 더 넓고 신중한 뜻을 살려 ‘가까운 동료’로 옮기는 것이 적절합니다. 또한 Κυρηναῖος는 ‘키레네’보다 한국어 성경 지명 관례에 맞는 ‘구레네’로 표기했습니다.
  naturalness: 문장 안에서 인명마다 쉼표 뒤에 ‘와’를 반복한 형태와 ‘있었으니’는 현대 한국어 합쇼체 성경 문장으로 다소 부자연스럽고, 후자는 원문의 약한 연결사 δέ보다 설명·인과의 뉘앙스를 강하게 합니다. 열거를 자연스럽게 정리하고 종결을 ‘있었습니다’로 고쳤습니다.
  terminology: 안디옥, 바나바, 시므온, 니게르, 구레네, 루기오, 마나엔, 사울 및 ‘분봉왕’은 통용되는 한국어 성경 표기와 잘 맞습니다. ‘예언자들과 교사들’도 προφῆται καὶ διδάσκαλοι를 교단적 직제로 과도하게 한정하지 않는 적절한 번역입니다.
  issues:
