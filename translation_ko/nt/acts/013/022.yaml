  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
  footnotes:
  - marker: a
    text: Or, more traditionally, “a man after my own heart.” The Greek more literally says “according to my heart.”
    reason: lexical_alternative
  - marker: b
    text: Greek “all my wills,” with the noun in the plural; many English translations smooth this to “all my will.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 왕위에서 물러나게 하신 뒤에, 하나님께서는 다윗을 그들의 왕으로 세우셨습니다. 또 그에 대하여 증언하여 말씀하셨습니다. 「내가 이새의 아들 다윗을 찾았다. 그는 내 마음에 맞는 사람이며, 내 모든 뜻을 이루리라.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  english_pob_choice: a man according to my heart
  chosen_korean: 내 마음에 맞는 사람
  alternatives_korean:
  - 내 마음에 맞는 자
  - 내 마음을 따르는 사람
  lexicon: BDAG
  rationale: 삼상 13:14 + 시 89:20의 합성 인용. 「내 마음에 맞는」이 한국어 정착 표현이며, 신적 인격적 선택의 무게가 자연스럽다.
