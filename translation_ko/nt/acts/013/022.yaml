revisions:
- from: 그를 폐하신 뒤에, 다윗을 세워 그들의 왕으로 삼으셨고, 그에 대하여 증언하시며 이렇게 말씀하셨습니다. 「내가 이새의 아들 다윗을 만났으니, 내 마음에 맞는 사람이라. 그가 내 모든 뜻을 이루리라.」
  to: 그를 왕위에서 물러나게 하신 뒤에, 하나님께서는 다윗을 그들의 왕으로 세우셨습니다. 또 그에 대하여 증언하여 말씀하셨습니다. 「내가 이새의 아들 다윗을 찾았다. 그는 내 마음에 맞는 사람이며, 내 모든 뜻을 이루리라.」
  rationale: 'The revision clarifies the removal from kingship, renders “found” more precisely, and recasts the divine quotation in natural modern Korean. It retains the source’s reference to David as Jesse’s son, the characterization “according to my heart,” and the future fulfillment of all God’s purposes. No footnote is necessary: Korean 「모든 뜻」 idiomatically represents the Greek plural θελήματα, and the wording does not conceal a material ambiguity.'
