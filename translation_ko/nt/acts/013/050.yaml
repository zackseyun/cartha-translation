    rationale: τοὺς πρώτους는 남성 복수이므로, 원문의 성별 지시를 보존하려면 '유력한 남성들'처럼 명시하는 것이 적절합니다.
  - severity: low
    issue: σεβομένας의 가능한 전문적 뉘앙스에 대한 각주 부재
    rationale: '''경건한''은 본문에서 과도한 해석을 피하는 좋은 번역이지만, 하나님을 경외하며 유대교 회당과 관련된 여성들을 뜻할 수 있다는 가능성을 각주로 밝혀 두는 것이 어휘적 모호성을 보존합니다.'
