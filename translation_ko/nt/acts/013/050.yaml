  source_fidelity: 핵심 사건의 순서와 인과관계는 대체로 잘 반영되어 있습니다. 다만 εὐσχήμονας의 사회적 의미를 현대어로 더 자연스럽게 옮기고, ὅρια의 공간적 의미를 '지경'보다 분명하게 표현하는 것이 좋습니다. 또한 원문의 남성 복수 표현 τοὺς πρώτους τῆς πόλεως를 성별 중립적인 '인사들'로만 옮기지 않고 남성 지시를 보존했습니다.
  naturalness: '''지체 높은''과 ''자기들의 지경''은 현대 표준 한국어 합쇼체에서는 다소 고풍스럽거나 어색합니다. ''사회적으로 높은 지위에 있는'' 및 ''그 지역 밖으로''가 자연스럽고 뜻도 명료합니다.'
  terminology: '''경건한 여인들''은 σεβομένας의 폭넓은 의미를 유지하며, 회당과 관련된 이방인 하나님 경외자일 가능성은 각주로 처리하는 것이 안전합니다. ''박해를 일으켰습니다''는 ἐπήγειραν διωγμόν의 사역적 의미를 적절히 전달합니다.'
  issues:
  - severity: medium
    issue: 현대어 어색함 및 지역 표현의 불명료성
    rationale: '''지체 높은''과 ''자기들의 지경''은 현대 독자에게 고풍스럽고, 후자는 ''그들''의 선행사와 추방 범위를 불필요하게 모호하게 합니다. 원문의 ὅρια가 가리키는 지역적 범위를 ''그 지역 밖으로''로 옮기고 대안은 각주로 보존하는 편이 좋습니다.'
  - severity: low
