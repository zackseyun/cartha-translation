  to: 그러나 유대인들은 경건한 여인들[a]과 그 성의 사회적으로 높은 지위에 있는 유력한 남성들을 선동하고, 바울과 바나바에 대한 박해를 일으켜 그들을 그 지역 밖으로 쫓아냈습니다[b].
