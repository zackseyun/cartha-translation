  text: “이제 보십시오. 주님의 손이 당신 위에 있습니다. 당신은 눈이 멀어 한동안 해를 보지 못하게 될 것입니다.” 즉시 그에게 안개와 어둠이 덮쳤습니다. 그는 이리저리 다니며 자신을 손잡아 이끌어 줄 사람을 찾았습니다.
