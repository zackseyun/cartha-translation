base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
  footnotes:
  - marker: a
    text: 'Or: “away from faith.” The Greek phrase may be heard either as turning him away from the Christian faith specifically or from believing response more generally.'
    reason: alternative_reading
  - marker: b
    text: “Elymas” is explained as a translated or interpreted name; the exact derivation is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 마술사 엘루마[b]가—그의 이름은 그렇게 번역됩니다—그들에게 맞서고 있었으며, 총독을 그 믿음[a]에서 돌아서게 하려고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “믿음에서.” 그리스어 표현은 그를 기독교 신앙에서 돌아서게 한다는 뜻으로도, 더 일반적으로 믿는 반응에서 돌아서게 한다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: “엘루마”는 번역되거나 해석된 이름으로 설명되지만, 정확한 어원은 확실하지 않습니다.
    reason: lexical_alternative
