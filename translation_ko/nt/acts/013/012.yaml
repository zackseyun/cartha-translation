  source_fidelity: 초안의 ‘총독’, ‘일어난 일’, ‘믿었습니다’는 각각 ὁ ἀνθύπατος, τὸ γεγονός, 목적어 없이 쓰인 ἐπίστευσεν을 대체로 충실히 옮깁니다. 다만 ‘그 일어난 일’은 현대 한국어에서 부자연스럽고, τοῦ κυρίου의 속격이 지닌 ‘주님의/주에 관한’ 해석 가능성을 본문만으로는 충분히 보존하지 못합니다.
