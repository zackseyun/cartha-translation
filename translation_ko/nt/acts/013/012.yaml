  terminology: ‘총독’은 ἀνθύπατος에 대한 한국어 성경의 통용 번역으로 수용 가능합니다. ‘주’와 ‘믿었습니다’도 본문의 절제된 표현과 프로젝트 용어에 부합합니다. ‘주의 가르침’은 본문에 두되, 속격의 가능한 방향을 각주에서 밝혀야 합니다.
