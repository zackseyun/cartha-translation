    issue: λέγει의 현재형 및 무표지 주어가 ‘말씀하셨습니다’로 변경·특정됨
    rationale: 그리스어는 현재형 ‘말한다’이며 주어를 명시하지 않습니다. 한국어의 ‘말씀하셨습니다’는 과거형이고, 높임말의 주체를 사실상 하나님으로 정합니다.
  - severity: low
