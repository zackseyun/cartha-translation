    rationale: 문법적으로 가능하지만, ὅσιος의 명사적 용법과 한국어 성경 인용 문체에는 ‘거룩한 이’가 더 자연스럽고 직접적입니다.
  - severity: low
    issue: 영어 감사 기록의 어휘 대안 및 ἐν ἑτέρῳ 보충에 대한 각주 앵커 누락
    rationale: ‘다른 시편’은 허용되는 보충이나 원문에는 명사가 없으며, ‘거룩한 이’와 ‘썩음’에도 의미상 대안이 있습니다. 해당 선택을 확인할 수 있도록 앵커와 각주를 제공합니다.
