review_pass:
  verdict: revise
  source_fidelity: 헬라어의 διότι καὶ, ἐν ἑτέρῳ, 현재형 λέγει 및 인용문의 허용 관용을 대체로 반영합니다. 그러나 「말씀하셨습니다」는 원문에 명시되지 않은 존귀한 화자(하나님)를 확정하고 과거형으로 바꾸므로, 무표지의 현재형 인용 공식으로 고쳐야 합니다.
  naturalness: 「당신은 당신의」의 연쇄는 문법상 가능하지만 현대 한국어 인용문으로 다소 어색합니다. 주제 표지와 높임 선어말을 사용한 「당신께서는 당신의」가 더 자연스럽고 합쇼체에 맞습니다.
  terminology: ὅσιος는 여기서 「거룩한 이」로 옮겨 인격적 단수와 문맥상의 존칭을 보존합니다. διαφθορά는 본문에서 「썩음」으로 유지할 수 있으며, 전통적 대안인 「부패」를 각주로 제시하는 것이 적절합니다. 원문에는 κύριος나 명시적 호격이 없으므로, 그에 관한 신학적 결정으로 화자를 규정하지 않아야 합니다.
  issues:
  - severity: medium
    issue: 「말씀하셨습니다」
    rationale: λέγει는 현재형이며, 주어가 명시되지 않은 성경 인용 공식입니다. 높임 과거형은 하나님을 화자로 확정하는 효과가 있어 원문의 모호성을 좁힙니다.
  - severity: low
    issue: 「당신은 당신의 거룩한 분이」
    rationale: 두 번의 「당신」이 연달아 나와 자연스럽지 않습니다. 「당신께서는 당신의」로 고치면 원문의 두 소유·인칭 표지를 유지하면서 한국어 흐름이 좋아집니다.
  - severity: medium
    issue: 기존 신학적 결정의 κύριος/호격 설명
    rationale: 제시된 SBLGNT 본문에는 κύριος도 호격도 없습니다. 번역은 이를 전제하여 특정 신명을 논하거나 화자를 확정해서는 안 됩니다.
  revised_text: 그러므로 또 다른 시편에서도 이렇게 말합니다. 「당신께서는 당신의 거룩한 이가 썩음을 보게 하지 않으실 것입니다.」
  revised_footnotes:
  - marker: a
    text: 직역하면, ‘또 다른 곳에서’ 또는 ‘또 다른 구절에서’입니다. 헬라어는 ‘또 다른’이라고만 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 신실한 이’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부패’입니다.
    reason: lexical_alternative
  revision_rationale: 현재형의 무표지 성경 인용 공식은 「이렇게 말합니다」로 옮겨 화자를 불필요하게 특정하지 않았습니다. 인용문은 2인칭과 소유격을 모두 보존하되, 현대 합쇼체 문장으로 자연스럽게 다듬었습니다. 「또 다른 시편」은 영어 감사 기록의 명시화 선택을 따르며, 원문의 생략 가능성은 각주에서 밝혔습니다.
