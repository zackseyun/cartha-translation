  source_fidelity: ‘말씀하셨습니다’는 그리스어 현재형 λέγει를 과거로 바꾸고, 존칭 주어를 통해 발화자를 하나님으로 사실상 특정합니다. 본문의 무표지 주어(하나님 또는 성경으로 이해될 수 있음)를 보존하려면 비인칭적 인용 공식인 ‘이렇게 말합니다’가 더 충실합니다. 또한 τὸν ὅσιόν σου는 ‘거룩한 분’보다 ‘거룩한 이’가 한국어 성경 문체와 원문의 명사적 표현에 더 가깝습니다.
  naturalness: ‘그러므로 또 다른 시편에서 이렇게 말합니다’는 현대 표준어의 자연스러운 성경 인용 문체입니다. 인용문에서는 2인칭 주어를 생략하고 높임 종결 ‘하실 것입니다’를 사용하여, 원문의 2인칭을 유지하면서 ‘당신은 당신의’라는 반복을 피했습니다.
  terminology: ‘거룩한 이’와 ‘썩음’은 행 13장의 시편 인용 및 한국어 성경 문체에 잘 맞습니다. ‘신실한 이’와 ‘부패’는 원문의 가능한 어휘 범위이므로 각주로 보존합니다. ἐν ἑτέρῳ에 ‘시편’을 보충한 선택은 인용의 실제 출처를 명료하게 하지만, 원문에 명사가 없음을 각주로 밝혀야 합니다.
  issues:
