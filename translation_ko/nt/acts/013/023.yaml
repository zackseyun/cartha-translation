  terminology: ‘하나님’, ‘이스라엘’, ‘구원자’, ‘예수’는 적절합니다. ‘세우셨습니다’는 여기서 구원자를 마련하고 일으키셨다는 문맥적 의미이며, 부활을 뜻하도록 단정하지 않습니다.
