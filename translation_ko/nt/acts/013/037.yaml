  terminology: ‘하나님’, ‘일으키신’, ‘썩음’은 사도행전의 부활 문맥 및 한국어 성경적 용례에 적절합니다. 특히 ‘썩음’은 육체의 부패를 뜻하면서도 시편 16편과의 어휘적 연결을 유지합니다.
