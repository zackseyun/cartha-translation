  to: 「보라, 너희 비웃는 자들아, 놀라고 멸망하여라. 내가 너희 시대에 한 일을 이루고 있으니, 누가 너희에게 그것을 자세히 이야기해 주어도 너희는 결코 믿지 않을 것이다.」
