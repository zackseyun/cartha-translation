  source_fidelity: 수정이 필요합니다. 본문의 ‘다시는 썩음으로 돌아가지 않게 하실 일’은 미래의 일처럼 들리며, ‘하실 일에 관하여는’도 ὅτι 절의 내용, 곧 하나님께서 예수를 일으키셔서 그가 더 이상 썩음으로 돌아가지 않게 하셨다는 사실을 충분히 반영하지 못합니다. 또한 인용문의 ‘다윗에게 약속한’은 다윗 속격이 지닌 표현상의 여지를 좁히는 보충입니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, ‘사실에 관해서는’은 문맥상 앞 절의 내용을 받아 성경 인용을 도입하는 기능을 분명히 합니다. ‘다윗의 거룩하고 확실한 복들’은 다소 압축된 인용 표현이지만, 각주로 관용적·해석적 대안을 보완합니다.
  terminology: ‘죽은 자들 가운데서’, ‘썩음’, ‘일으키시다’는 부활 문맥에 적합합니다. τὰ ὅσια Δαυὶδ τὰ πιστά는 본문에서 ‘다윗의 거룩하고 확실한 복들’로 옮겨 원문의 압축성과 속격의 여지를 보존하고, 언약 약속이라는 의미 및 전통적 ‘다윗의 확실한 자비’ 번역은 각주에서 제시합니다.
