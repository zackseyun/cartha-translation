review_pass:
  verdict: revise
  source_fidelity: 현 초안의 ‘그들의 자손인 우리에게’는 제시된 SBLGNT 본문의 τοῖς τέκνοις ἡμῶν(‘우리의 자녀들/후손들에게’)와 맞지 않으며, 본문 이문을 본문에 반영해 버립니다. 또한 ἀναστήσας의 ‘일으키다’는 문맥상 죽은 자들 가운데서의 부활과 세움/등장시킴 양쪽으로 이해될 수 있으므로, 본문에서는 그 모호성을 유지하고 각주로 밝혀야 합니다.
  naturalness: ‘우리 자녀들에게 이 약속을 이루어 주셨습니다’는 현대 표준 한국어에서 자연스럽고, 앞 절의 약속을 가리키는 ταύτην을 명료하게 전달합니다. 성경 인용은 평서형으로 유지하여 인용문의 문체를 살렸습니다.
  terminology: ‘일으키심으로써’는 ἀναστήσας의 해석상 열린 의미를 보존합니다. ‘시편 둘째 편’과 ‘너는 내 아들이다. 오늘 내가 너를 낳았다’는 원문의 인용 구조와 핵심 어휘를 충실히 옮깁니다.
  issues:
  - severity: high
    issue: ‘그들의 자손인 우리에게’
    rationale: SBLGNT의 본문은 τοῖς τέκνοις ἡμῶν, 즉 ‘우리의 자녀들/후손들에게’입니다. ‘그들의 자손인 우리’는 알려진 이문 계열의 독법을 각주 없이 본문에 채택한 것이므로 수정이 필요합니다.
  - severity: medium
    issue: 본문 이문 및 ἀναστήσας의 의미 범위에 대한 각주 부재
    rationale: ‘우리 자녀들에게/우리에게, 그들의 자녀들에게’의 본문 이문과 ‘일으키심’의 두 가능한 이해를 각주로 보존해야 합니다.
  revised_text: 하나님께서 예수를 일으키심으로써 우리 자녀들에게[a] 이 약속을 이루어 주셨습니다. 이는 시편 둘째 편에도 기록된 바와 같습니다. “너는 내 아들이다. 오늘 내가 너를 낳았다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리에게, 곧 그들의 자녀들에게.’ 일부 사본은 ‘우리 자녀들에게’라고 하고, 다른 사본들은 ‘우리에게, 곧 그들의 자녀들에게’라는 읽기를 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: ‘예수를 일으키심으로써’는 ‘예수를 죽은 사람들 가운데서 살리심으로써’라고도 번역할 수 있습니다. 그러나 그리스어는 예수를 세우시거나 등장시키셨다는 뜻일 수도 있습니다.
    reason: alternative_reading
  revision_rationale: SBLGNT의 ἡμῶν을 본문에 따라 ‘우리 자녀들에게’로 옮기고, 대안 독법은 각주로 처리했습니다. ἀναστήσας의 부활 및 세움/등장 의미 사이의 해석상 긴장은 본문 ‘일으키심’과 각주로 보존했습니다. 각주 b는 의미상 ‘일으키심’에 연결되어야 하지만, 현재 표시 체계상 본문에 b 표지가 누락되어 있으므로 구조적으로는 ‘일으키심으로써[b]’로 표기하는 것이 필요합니다.
