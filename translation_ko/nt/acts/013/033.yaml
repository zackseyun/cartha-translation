review_pass:
  verdict: revise
  source_fidelity: 현 초안의 ‘그들의 자손인 우리에게’는 본문(SBLGNT)의 τοῖς τέκνοις ἡμῶν(‘우리의 자녀들/후손들에게’)이 아니라 이문 ‘우리, 곧 그들의 자녀들에게’를 본문에 채택한 표현입니다. SBLGNT 본문을 따라 ‘우리의 자녀들에게’로 옮기고, 이문은 각주로 처리해야 합니다. ἀναστήσας의 ‘일으키심’은 죽음에서의 부활과 세움/등장의 의미를 모두 열어 둘 수 있어 유지할 수 있습니다.
  naturalness: ‘시편 둘째 편에도 이렇게 기록된 바와 같습니다’보다 ‘시편 둘째 편에 기록되어 있는 바와 같이’가 문장 연결과 현대 표준어 문체에 더 자연스럽습니다. 본문 서술은 합쇼체로 정리하고, 시편 인용문은 직접 인용의 선언체로 보존했습니다.
  terminology: ‘약속’, ‘시편 둘째 편’, ‘아들’, ‘낳았다’는 원문의 어휘와 시편 2:7의 상호본문적 표현을 적절히 보존합니다. ‘낳았다’는 후대의 교리적 해설을 덧붙이지 않습니다.
  issues:
  - severity: high
    issue: 본문의 수여 대상이 SBLGNT 본문과 다릅니다.
    rationale: 초안의 ‘그들의 자손인 우리에게’는 τοῖς τέκνοις ἡμῶν을 ‘우리의 자녀들에게’로 읽지 않고 다른 이문을 본문에 반영합니다. 기준 본문을 본문 번역에 따르고 이문은 각주에 두어야 합니다.
  - severity: medium
    issue: 이문 및 ἀναστήσας의 대안 의미에 대한 각주가 없습니다.
    rationale: 수여 대상의 본문 이문과 ‘일으키심’의 의미 범위는 번역상 중요한 불확정 요소이므로, 본문 의미를 고정하지 않도록 적절한 위치에 각주를 달아야 합니다.
  - severity: low
    issue: ‘기록된 바와 같습니다’가 다소 우회적입니다.
    rationale: γέγραπται의 성경 인용 공식은 ‘기록되어 있는 바와 같이’가 자연스럽고 지속적 기록의 뉘앙스도 잘 드러냅니다.
  revised_text: 하나님께서 예수를 일으키심으로써 우리의 자녀들에게[a] 이 약속을 이루셨습니다. 이는 시편 둘째 편에 기록되어 있는 바와 같습니다. 「너는 내 아들이다. 오늘 내가 너를 낳았다.」
  revised_footnotes:
  - marker: a
    text: 다른 사본들에는 ‘우리, 곧 그들의 자녀들에게’라고 되어 있다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘예수를 죽은 사람들 가운데서 살리심으로써.’ 그리스어는 ‘일으키심’을 세우거나 등장하게 함의 뜻으로도, 죽은 사람들 가운데서 살리심의 뜻으로도 이해될 수 있다.
    reason: alternative_reading
  revision_rationale: SBLGNT의 τοῖς τέκνοις ἡμῶν을 ‘우리의 자녀들에게’로 본문에 반영했습니다. 초안이 채택했던 ‘우리, 곧 그들의 자녀들에게’의 읽기는 이문으로 각주 처리했습니다. ἀναστήσας는 본문에서 ‘일으키심’으로 유지하여 문맥상 논의되는 두 의미를 성급히 결정하지 않았고, 그 대안을 각주로 제시했습니다. 각주 b는 ‘예수를 일으키심으로써’ 뒤에 붙여야 합니다.
