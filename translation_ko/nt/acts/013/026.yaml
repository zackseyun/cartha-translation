source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
  footnotes:
  - marker: a
    text: Or 'Men, brothers.' The Greek vocative is literally masculine; the address may include the wider gathered audience.
    reason: lexical_alternative
  - marker: b
    text: Or 'the God-fearers among you,' a possible reference to Gentile synagogue adherents who worshiped the God of Israel.
    reason: cultural_note
  - marker: c
    text: Or 'the word of this salvation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 형제 여러분[a], 아브라함의 후손 여러분과 여러분 가운데 하나님을 경외하는 여러분[b], 이 구원의 말씀[c]이 우리에게 보내졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남자 형제들이여.” 그리스어 호격은 문법적으로 남성형이지만, 이 공적 خطاب이 모인 청중 전체를 포함할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “여러분 가운데 있는 하나님 경외자들.” 이 표현은 이스라엘의 하나님을 예배하던 이방인 회당 참석자들을 가리킬 수도 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 “이 구원에 관한 말씀.”
    reason: lexical_alternative
