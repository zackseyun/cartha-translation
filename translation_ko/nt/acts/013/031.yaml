translation:
  language: ko
  text: 그분은 여러 날 동안 갈릴리에서 예루살렘으로 그분과 함께 올라갔던 사람들에게 나타나셨습니다. 그들은 지금 백성에게 그분을 증언하는 증인입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘백성’은 이 문맥에서 특히 이스라엘 백성, 곧 유대 민족을 가리킬 가능성이 높습니다. 그러나 그리스어 본문은 단지 ‘백성’이라고만 말합니다.
    reason: cultural_note
