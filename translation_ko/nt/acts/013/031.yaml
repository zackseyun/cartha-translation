revisions:
- from: 그는 여러 날 동안, 갈릴리에서 예루살렘까지 자기와 함께 올라갔던 사람들에게 나타나셨으니, 그들이 지금 그를 위한 증인으로서 백성에게 서 있습니다.
  to: 그분은 여러 날 동안 갈릴리에서 예루살렘으로 그분과 함께 올라갔던 사람들에게 나타나셨습니다. 그들은 지금 백성에게 그분을 증언하는 증인입니다.[a]
  rationale: 문장을 둘로 나누어 관계절의 한국어 표현을 자연스럽게 했습니다. ‘그분을 증언하는 증인’은 증언의 대상(그분)과 증언이 향하는 대상(백성)을 모두 명확히 하면서도, 원문의 관계적 표현을 특정 교리적 해석으로 확장하지 않습니다. ‘백성’은 본문대로 유지하고 문맥적 범위는 각주에서만 설명했습니다.
