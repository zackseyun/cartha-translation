  - severity: medium
    issue: ‘백성에게 서 있습니다’
    rationale: ‘εἰσὶ μάρτυρες’는 ‘증인입니다’라는 현재의 신분·역할 진술인데, ‘서 있습니다’는 한국어에서 어색하며 원문의 의미도 흐립니다.
  - severity: low
    issue: ‘자기와 함께’
    rationale: 문법상 예수를 가리키지만, 한국어에서는 ‘그분과 함께’가 지시 대상을 더 명료하게 하고 경칭 문체에도 잘 맞습니다.
