  source_fidelity: 초안은 하나님 나라, 예수 메시아의 이름, 남녀의 포괄성을 대체로 충실히 옮겼습니다. 그러나 τῷ Φιλίππῳ는 빌립이 전한 내용 자체만이 아니라 빌립을 말하는 이/증인으로 믿었다는 뜻인데, 초안의 ‘그들이 믿고’는 목적어가 빠져 있습니다. 또한 미완료 수동태 ἐβαπτίζοντο의 진행·반복적 배경을 단순 과거 ‘세례를 받았습니다’로 평준화했습니다.
  naturalness: ‘빌립의 말을 믿었고’는 한국어에서 빌립을 신뢰할 만한 전도자로 믿고 그의 선포를 받아들였다는 뜻을 자연스럽게 드러냅니다. ‘세례를 받고 있었습니다’는 집단적으로 이어진 세례의 미완료상을 보존하면서도 현대의 격식 있는 합쇼체에 맞습니다.
  terminology: ‘하나님의 나라’, ‘복음’, ‘세례’는 적절합니다. Χριστοῦ의 칭호성을 반영하여 ‘예수 메시아’를 유지했습니다. ‘이름’도 원문의 표현을 보존했습니다.
  issues:
  - severity: medium
    issue: ‘그들이 믿고’에 빌립을 믿었다는 목적어가 나타나지 않습니다.
    rationale: ἐπίστευσαν τῷ Φιλίππῳ는 빌립이 말한 것을 믿는다는 의미이며, 한국어에서는 목적어를 밝혀야 ‘하나님 나라와 이름’을 믿었다는 식의 구조적 오해를 줄일 수 있습니다.
  - severity: low
    issue: ‘세례를 받았습니다’가 미완료 수동태의 진행·반복적 양상을 반영하지 못합니다.
    rationale: ἐβαπτίζοντο는 단회적 완료 사건보다 세례가 진행되고 있었음을 나타냅니다.
