    rationale: Μεγάλη는 ‘능력’(δύναμις)을 수식하는 여성형 명칭/칭호입니다. 한국어 번역도 ‘위대하다고 불리는 하나님의 능력’처럼 ‘능력’과 연결하는 편이 충실합니다.
