  source_fidelity: 개정안은 ᾧ προσεῖχον을 ‘그에게 귀를 기울였고’로, ἀπὸ μικροῦ ἕως μεγάλου를 사회적 범위를 나타내는 한국어 관용 표현인 ‘낮은 사람부터 높은 사람까지’로 옮깁니다. ἡ καλουμένη Μεγάλη는 ‘위대하다고 불리는’으로 번역하여, 군중이 하나님의 능력에 붙인 명칭이라는 헬라어의 수동적·칭호적 표현을 보존합니다.
  naturalness: 초안의 ‘주의를 기울이며 말하였습니다’도 이해되지만, ‘귀를 기울였고, 이렇게 말했습니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 서술 관계도 명료합니다. 중첩된 「 」와 ‘위대한 자’라는 표현은 자연스럽지 않고 뜻을 흐릴 수 있어 고쳤습니다.
  terminology: ‘하나님의 능력’은 τοῦ θεοῦ ἡ Δύναμις를 충실히 반영합니다. ‘위대하다고 불리는’은 Μεγάλη를 인격 명사인 ‘위대한 자’로 바꾸지 않으면서 그 명칭성을 유지합니다. 대체 가능한 제목형 해석은 각주로 제시합니다.
  issues:
