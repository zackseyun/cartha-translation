  source_fidelity: κατελθών의 방향성은 ‘내려가’로, ἐκήρυσσεν과 τὸν χριστόν은 ‘메시아를 선포하였습니다’로 옮겨 충실히 반영합니다. τὴν πόλιν τῆς Σαμαρείας는 특정 도시를 가리킬 수도, 사마리아 지역의 한 도시를 가리킬 수도 있으므로 본문과 각주에서 그 여지를 보존했습니다.
