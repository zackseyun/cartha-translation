translation:
  language: ko
  text: 그가 읽고 있던 성경 구절은 다음과 같았습니다. 「양처럼 도살장으로 끌려갔고[a], 어린양이 그 털을 깎는 사람 앞에서 잠잠한 것처럼[b], 그도 자기 입을 열지 않습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “도살을 당하도록.”
    reason: lexical_alternative
  - marker: b
