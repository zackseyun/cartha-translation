  source_fidelity: 인용문의 마지막 동사 ἀνοίγει는 현재형이므로, 초안의 과거형 「열지 아니하였다」는 원문의 인용 현재를 보존하지 못합니다. 또한 인용문을 닫는 문장부호가 누락되어 있습니다. 「도살장으로 끌려갔고」와 「어린양」 및 털을 깎는 행위의 표현은 원문에 충실합니다.
  naturalness: 「그가 읽고 있던 성경 구절은 다음과 같았습니다」는 현대 표준어 합쇼체의 자연스러운 서술입니다. 인용문에서는 「양처럼」, 「잠잠한 것처럼」, 「입을 열지 않습니다」가 문어적이되 현대적으로 자연스럽습니다.
  terminology: γραφή는 「성경」으로, πρόβατον/ἀμνός의 구별은 「양/어린양」으로 유지했습니다. κείραντος는 「털을 깎는 사람」으로 옮겨 행위와 대상을 명확히 했습니다. 「어린양」이 지닌 한국어 성경 전통의 연상을 본문에 별도 해석으로 덧붙이지 않았습니다.
