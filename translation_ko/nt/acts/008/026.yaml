  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: Now an angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
  footnotes:
  - marker: a
    text: Or “at noon.” The Greek phrase can indicate either direction (“south”) or time (“at midday/noon”).
    reason: alternative_reading
  - marker: b
    text: Or “This is desert,” possibly meaning the route passes through a desert region rather than emphasizing that the road itself is deserted.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 천사가 빌립에게 말했습니다. “일어나 남쪽으로[a] 가서 예루살렘에서 가자로 내려가는 길로 가십시오. 그 길은 외딴 길입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정오에.” 그리스어 표현은 방향(“남쪽으로”)이나 시간(“정오에”)을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “이곳은 광야입니다.” 이 말은 그 길 자체가 외딴 길이라는 뜻일 수도 있고, 그 길이 광야 지역을 지난다는 뜻일 수도 있습니다.
    reason: lexical_alternative
