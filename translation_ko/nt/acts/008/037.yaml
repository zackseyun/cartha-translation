  naturalness: 현대 표준 한국어 합쇼체에서는 상대를 「당신」이라고 부르기보다 존대 어미로 처리하는 편이 자연스럽습니다. 또한 「하나님의 아들 메시아이심」은 두 칭호의 관계가 다소 불분명하므로 「메시아, 곧 하나님의 아들」로 풀어 주었습니다.
  terminology: Χριστός는 영어 POB의 결정을 따라 「메시아」로 옮겼고, 「하나님의 아들」과 병렬·동격 관계가 드러나도록 했습니다. 본문비평상 이 절의 이른 사본 결여 사실은 본문 대괄호만으로 처리하지 않고 빌립 이름에 각주 표지를 두어 밝혔습니다.
