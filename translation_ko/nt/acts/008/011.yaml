  source_fidelity: 초안은 이유를 나타내는 διά + 부정사구와 사람들의 반응을 대체로 반영합니다. 그러나 ἐξεστακέναι의 완료상 및 사역 의미는 ‘그의 마술에 놀라 왔기’보다 그가 그들을 놀라게 해 온 것으로 드러내는 편이 더 정확합니다. 또한 προσεῖχον의 미완료상은 지속적 반응으로 옮기는 것이 적절합니다.
  naturalness: ‘그의 마술에 놀라 왔기’는 현대 한국어에서 다소 어색하며, ‘주의를 기울였던 것입니다’는 문맥상 불필요하게 회고적·설명적인 종결입니다. 주어를 분명히 하고 지속 표현을 사용하면 자연스럽습니다.
  terminology: μαγείαις는 그 성격을 단정하지 않는 ‘마술 행위’로 옮겨, 속임수인지 초자연적 행위인지 본문이 규정하지 않는 여지를 보존합니다. ‘마술’ 단독보다 행위·실천을 가리키는 복수형에 더 가깝습니다.
  issues:
