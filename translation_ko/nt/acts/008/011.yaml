    issue: 완료 사역 표현과 미완료 반응의 표현이 약함
    rationale: ἐξεστακέναι는 ‘그들을 놀라게 하다’의 완료부정사이고, προσεῖχον은 지속적으로 주의를 기울였다는 미완료입니다. 초안의 ‘놀라 왔기’와 ‘기울였던’은 이 관계를 덜 분명하게 합니다.
  - severity: low
    issue: ‘마술’ 단독의 의미 범위
    rationale: 마술은 현대 한국어에서 공연·기술적 마술을 연상시킬 수 있습니다. ‘마술 행위’는 μαγείαις가 가리키는 실천들을 더 자연스럽게 포괄하면서도 신학적으로 과도한 단정을 피합니다.
