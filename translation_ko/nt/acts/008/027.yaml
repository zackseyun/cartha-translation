  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
  footnotes:
  - marker: a
    text: Or 'court official' for 'eunuch'; the Greek term can in some contexts refer to a royal official, though here the literal sense is likely intended.
    reason: lexical_alternative
  - marker: b
    text: '''Candace'' may function as a dynastic title for the queen rather than a personal name.'
    reason: cultural_note
translation:
  language: ko
  text: 빌립이 일어나 길을 떠났습니다. 그런데 보십시오, 에티오피아 사람인 한 남자가 있었습니다. 그는 환관[a]이며 에티오피아 사람들의 여왕 간다게[b]의 고관으로서, 그 여왕의 모든 국고를 맡고 있었습니다. 그는 예배하러 예루살렘에 와 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환관’으로 옮긴 그리스어 낱말은 문맥에 따라 ‘궁정 관리’를 뜻할 수도 있습니다. 그러나 여기서는 본래 의미인 ‘환관’일 가능성이 높습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘간다게’는 개인 이름이라기보다 에티오피아 여왕에게 쓰인 왕조적 칭호일 수 있습니다.
    reason: cultural_note
