- from: 그런데 시몬이라 하는 어떤 사람이 전부터 그 성에서 마술을 행하며 사마리아 백성을 놀라게 하고, 자기를 위대한 자라 자처하고 있었습니다.
  to: 그런데 시몬이라는 어떤 사람이 전부터 그 성에서 마술을 부리며 사마리아 사람들을 놀라게 하고, 자신이 대단한 사람이라고 말하고 있었습니다.
  rationale: 원문의 시간적 배경(‘전부터’), 지속적 활동을 나타내는 분사들(마술을 부리며, 놀라게 하고), 그리고 시몬의 자기 과시적 발언을 자연스러운 현대 한국어 합쇼체로 유지했습니다. 영어 감사 기록의 어휘 대안은 한국어 본문에 별도 주석이 반드시 필요한 수준의 본문상 모호성을 만들지 않으므로 주석은 두지 않았습니다.
