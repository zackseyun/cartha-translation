review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문을 충실히 옮겼습니다. 다만 λέγων은 단순히 자신에 관해 ‘말하는’ 행위이므로, ‘자처하고’보다 ‘말하고’가 더 직접적입니다. 또한 τὸ ἔθνος τῆς Σαμαρείας는 이 문맥에서 ‘사마리아 사람들’이 자연스럽고 정확합니다.
  naturalness: ‘위대한 자라 자처하고’는 다소 문어적이며 ‘위대한 자’가 특정 칭호처럼 들릴 수 있습니다. ‘자신이 대단한 사람이라고 말하고’가 현대 표준어 합쇼체 서술에 자연스럽습니다.
  terminology: μαγεύων은 ‘마술을 부리며’로, ἐξιστάνων은 ‘놀라게 하며’로 옮겼습니다. 이는 마술 행위와 사람들을 경악하게 한 결과를 담되, 본문에 없는 신학적 평가를 덧붙이지 않습니다.
  issues:
  - severity: low
    issue: ‘자처하고’는 λέγων보다 해석적으로 한 단계 강합니다.
    rationale: 원문은 ‘말하면서’라는 분사이며, 자기 과시의 뉘앙스는 뒤따르는 발언 내용에서 충분히 드러납니다.
  - severity: low
    issue: ‘사마리아 백성’은 현대 한국어에서 다소 포괄적·집단적이며 자연스럽지 않을 수 있습니다.
    rationale: 여기서 ἔθνος는 사마리아의 주민들을 가리키므로 ‘사마리아 사람들’이 문맥상 더 명료합니다.
  revised_text: 그런데 시몬이라는 어떤 사람이 전부터 그 성에서 마술을 부리며 사마리아 사람들을 놀라게 하고, 자신이 대단한 사람이라고 말하고 있었습니다.
