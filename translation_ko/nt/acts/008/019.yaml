    text: 또는 ‘권능’. 그리스어 엑수시아(ἐξουσία)는 권한, 권리, 또는 행사할 능력을 뜻할 수 있습니다. 여기서는 손을 얹어 성령을 받게 하는 데 관련된 권한을 가리킵니다.
