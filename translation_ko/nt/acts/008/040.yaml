base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
  footnotes:
  - marker: a
    text: Or 'appeared at Azotus.' The Greek more literally says 'was found at Azotus,' which may imply sudden divine relocation in context without stating it explicitly.
    reason: alternative_reading
translation:
  language: ko
  text: 빌립은 아소도에서 발견되었고,[a] 두루 다니면서 가이사랴에 이를 때까지 모든 성읍에 복음을 전하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아소도에 나타났고.” 그리스어는 더 문자적으로 “아소도에서 발견되었다”라고 말합니다. 문맥상 갑작스러운 하나님의 이동을 암시할 수 있으나, 본문 자체는 그것을 명시하지 않습니다.
    reason: 원문의 중립적인 수동 표현을 보존하면서 문맥에서 가능한 이해를 밝혀 줍니다.
