base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
  footnotes:
  - marker: a
    text: Or 'his descendants' or 'his contemporaries'; the Greek 'generation' preserves the ambiguity of the Isaiah 53 quotation.
    reason: alternative_reading
  - marker: b
    text: Or 'judgment was taken away from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 낮아졌을 때에 공의가 그에게서 빼앗겼습니다.[b] 누가 그의 세대[a]를 이야기할 수 있겠습니까? 그의 생명이 땅에서 빼앗기기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 후손들’ 또는 ‘그의 동시대인들’. 그리스어 ‘세대’는 이사야 53장 인용문의 모호성을 그대로 지닙니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘심판이 그에게서 빼앗겼습니다’ 또는 ‘그에 대한 재판이 빼앗겼습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη
  english_pob_choice: In his humiliation justice was taken away from him
  chosen_korean: 그의 낮아짐 중에 그에 대한 공의가 빼앗겼으니
