  source_fidelity: 초안은 핵심 의미를 대체로 반영하지만, 「그에 대한 공의」는 κρίσις αὐτοῦ의 법정적·수동적 의미를 한국어에서 다소 부자연스럽고 모호하게 만듭니다. 또한 γενεά의 의도된 모호성 및 κρίσις의 대안적 의미를 보존하는 주석이 필요합니다.
  naturalness: 「그의 낮아짐 중에」와 「그의 세대를 이야기하겠는가」는 현대 표준 한국어 합쇼체로 다소 직역투입니다. 「그가 낮아졌을 때에」, 「누가 그의 세대를 이야기할 수 있겠습니까」가 더 자연스럽습니다. 문말의 닫는 인용부호는 이 절 단독 본문에서는 제거하는 것이 적절합니다.
  terminology: ταπείνωσις는 「낮아짐」으로, κρίσις는 본문에서 「공의」로 유지하되 「심판/재판」의 가능성을 주석으로 밝혔습니다. γενεά는 해석을 확정하지 않고 「세대」로 옮기며, 후손과 동시대인이라는 가능한 뜻을 주석에 보존했습니다.
