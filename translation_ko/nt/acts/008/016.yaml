  source_fidelity: 원문의 이유를 나타내는 γάρ를 ‘이는 … 때문입니다’로 적절히 옮겼습니다. 앞 절의 성령을 문맥상 보충하여 ‘성령이’라고 한 것은 자연스럽고, οὐδέπω, ἐπ’ οὐδενὶ αὐτῶν, ἐπιπεπτωκός의 의미도 ‘아직 그들 중 아무에게도 임하지 않으셨고’에 충실히 반영되었습니다. βεβαπτισμένοι ὑπῆρχον의 완료된 선행 행위와 그 제한을 ‘세례를 받았을 뿐이었기’ 및 ‘다만’이 잘 나타냅니다. ‘주 예수의 이름으로’는 εἰς τὸ ὄνομα의 한국어 성경 문맥상 관용적이고 이해 가능한 번역입니다.
  naturalness: 현대 표준 한국어의 정중한 합쇼체로 자연스럽습니다. ‘성령이 … 임하지 않으셨고’의 높임말은 한국어 기독교 문체에서 일반적이며 문장 전체의 격식에도 맞습니다.
  terminology: ‘성령’, ‘주 예수’, ‘세례’는 확립된 한국어 성경 용어이며, 원문의 κύριος Ἰησοῦ와 세례 표현을 적절히 반영합니다.
