review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Peter's response, the association of Simon and his silver in the pronouncement, and the contrast between God's gift and money. However, "살 수" narrows κτᾶσθαι (acquire/obtain) to an explicit commercial purchase, and the informal "네" conflicts with the specified modern formal-polite register. The optative εἴη should remain a wish/pronouncement rather than be made merely declarative.
  naturalness: The revised wording uses modern standard Korean in 합쇼체. "멸망하기를 바랍니다" renders the optative wish in a contemporary form; it retains the severity of the statement without using archaic "-할지어다."
  terminology: '"은" retains the Greek''s concrete ἀργύριον (''silver,'' functioning as money in context), while "돈" naturally renders χρημάτων. "하나님의 선물" is an accurate, nonsectarian rendering of δωρεά.'
  issues:
  - severity: medium
    issue: Informal second-person address
    rationale: '"네" is 해체 and does not meet the required modern formal-polite (합쇼체) target register.'
  - severity: medium
    issue: κτᾶσθαι rendered as "살 수"
    rationale: The verb means acquire or obtain. Although money supplies a commercial context, "buy" is narrower than the Greek and unnecessarily makes the acquisition itself a purchase verb.
  - severity: low
    issue: Optative force is expressed with archaic style
    rationale: '"멸망할지어다" does express the wish, but it is not modern 합쇼체. A contemporary wish formulation preserves the grammatical force.'
  revised_text: 그러나 베드로가 그에게 말하였습니다. “당신의 은이 당신과 함께 멸망하기를 바랍니다. 당신이 하나님의 선물을 돈으로 얻을 수 있다고 생각했기 때문입니다.”
