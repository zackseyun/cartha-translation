  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
  footnotes:
  - marker: a
    text: Or 'May your money go to destruction with you.' The Greek uses 'silver' here, a common way of referring to money.
    reason: lexical_alternative
  - marker: b
    text: Or 'obtain' or 'purchase.' The sense is that Simon regarded God's gift as something that could be gained by payment.
    reason: lexical_alternative
