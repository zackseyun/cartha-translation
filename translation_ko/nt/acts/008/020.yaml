- from: 그러나 베드로가 그에게 말하였습니다. 「네 은이 너와 함께 멸망할지어다. 네가 하나님의 선물을 돈으로 살 수 있다고 여겼기 때문이다.」
  to: 그러나 베드로가 그에게 말하였습니다. “당신의 은이 당신과 함께 멸망하기를 바랍니다. 당신이 하나님의 선물을 돈으로 얻을 수 있다고 생각했기 때문입니다.”
