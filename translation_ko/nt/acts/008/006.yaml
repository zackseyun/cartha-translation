  source_fidelity: 원문의 미완료 과거 προσεῖχον은 ‘귀를 기울였습니다’로 자연스럽게 옮겨졌고, ὁμοθυμαδόν의 공동·일치의 의미도 ‘한마음으로’에 잘 반영되었습니다. 빌립의 말과 그가 행하는 표징을 보고 듣는 상황적 관계도 보존합니다. ἀκούειν αὐτούς의 형태상 난점은 문맥상 빌립을 가리키는 것으로 처리한 영어 감사 기록과 일치하며, 한국어의 ‘그의 말’은 안전한 문맥적 해석입니다.
  naturalness: 문장은 현대 표준 한국어 합쇼체로 자연스럽고, ‘무리’, ‘귀를 기울였습니다’, ‘표징들’의 연결도 매끄럽습니다. ‘듣고 … 보면서’는 원문의 동시적·상황적 ἐν τῷ 구문을 적절히 나타냅니다.
  terminology: ‘빌립’은 통용되는 인명 표기이며, ‘표징들’은 σημεῖα를 불필요하게 ‘기적’으로 해석 확대하지 않는 적절한 번역입니다. ‘한마음으로’도 교파적 해석을 덧붙이지 않고 ὁμοθυμαδόν의 뜻을 전달합니다.
