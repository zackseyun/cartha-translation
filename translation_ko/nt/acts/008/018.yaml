  to: 그러나 시몬은 사도들의 안수를 통하여 성령[a]이 주어지는 것을 보고, 그들에게 돈을 제시하였습니다.
  rationale: 본문에 없는 ‘말하였습니다’를 삭제하여 8:18의 절 범위를 지키고, ‘돈을 제시하였습니다’로 προσήνεγκεν χρήματα의 제공·제안 의미를 보존했습니다. ‘사도들의 안수를 통하여’는 손을 얹음과 수단을 나타내는 διά를 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
