review_pass:
  verdict: revise
  source_fidelity: 초안은 '사도들이 손을 얹음으로 성령이 주어지는 것'을 보았다는 핵심 의미를 대체로 반영합니다. 그러나 '돈을 주며 말하였습니다'는 본문에 없는 발화를 첨가하고, προσήνεγκεν χρήματα(돈을 제시하였다/바쳤다)의 의미도 '돈을 주다'로 약화합니다.
  naturalness: '''사도들의 안수를 통하여 성령이 주어지는 것을 보고''는 현대 표준 한국어의 격식 있는 합쇼체 문맥에서 자연스럽고 명료합니다. ''제시하였습니다''는 돈을 건네어 제안한 행위를 자연스럽게 나타냅니다.'
  terminology: ἐπίθεσις τῶν χειρῶν은 '안수'로 옮길 수 있으며, διά의 수단 의미는 '통하여'로 보존합니다. τὸ πνεῦμα의 문면상 표현과 문맥상 성령 지시를 함께 존중하기 위해 본문은 '성령'으로 하고 각주에서 그리스어 표현을 밝힙니다. 이 표현은 사도들이 성령의 궁극적 근원이라는 주장을 덧붙이지 않습니다.
  issues:
  - severity: high
    issue: '''말하였습니다''의 첨가'
    rationale: SBLGNT의 8:18은 시몬이 돈을 제시한 데서 끝나며, 그가 말한 내용은 다음 절(8:19)에 나옵니다. 따라서 발화 동사를 넣으면 절 경계와 본문 내용이 바뀝니다.
  - severity: medium
    issue: '''돈을 주며''의 번역'
    rationale: προσήνεγκεν αὐτοῖς χρήματα는 단순히 돈을 실제로 주었다기보다 그들에게 돈을 제시하거나 바쳤다는 뜻입니다. '제시하였습니다'가 제안/제공의 뉘앙스를 더 잘 보존합니다.
  revised_text: 그러나 시몬은 사도들의 안수를 통하여 성령[a]이 주어지는 것을 보고, 그들에게 돈을 제시하였습니다.
