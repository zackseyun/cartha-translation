    issue: ὁδηγέω와 δυναίμην의 의미를 ‘일러 주다’와 ‘깨닫다’로 한정함
    rationale: 원문은 ‘누군가 나를 인도하지 않는다면 내가 어떻게 할 수 있겠는가’라고 하여 안내와 이해의 양면을 남깁니다. 초안은 이를 해석 행위인 ‘깨닫다’로 좁힙니다.
  revised_text: 그가 말했습니다. “누군가가 나를 인도해 주지 않으면 제가 어떻게 할 수 있겠습니까?” 그러고는 빌립에게 올라와 자기와 함께 앉아 달라고 청했습니다.
