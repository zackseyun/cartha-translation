  source_fidelity: 초안의 ‘일러 주지 않으면 어떻게 깨달을 수 있겠습니까?’는 ὁδηγήσει(인도하다/안내하다)와 δυναίμην(할 수 있다)의 폭넓고 비유적인 표현을 ‘가르쳐 주다/깨닫다’로 구체화합니다. 원문의 문자적·비유적 중의성을 보존하는 편이 더 충실합니다. 나머지 서술과 빌립을 초청하는 행위는 원문에 부합합니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘올라와 자기와 함께 앉아 달라고 청했습니다’는 마차에 올라타라는 공간적 뉘앙스와 정중하지만 간절한 요청을 자연스럽게 전달합니다.
  terminology: ‘인도해 주다’는 ὁδηγέω의 기본 의미를 유지하면서 성경 본문 이해라는 문맥에서의 비유적 의미도 열어 둡니다. ‘빌립’은 통용되는 인명 표기입니다.
  issues:
