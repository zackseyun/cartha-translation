  source_fidelity: 첫 절은 더러운 영들이 큰 소리를 지르면서 사람들에게서 나갔다는 점을 분명히 해야 합니다. 현 초안도 대체로 이를 전달하지만, ‘더러운 영이 들린’의 단수 표현과 뒤의 ‘그 영들이’의 복수 표현이 어울리지 않습니다. δεύτε 절의 παραλελυμένοι는 특정 질병명인 ‘중풍병자’보다 포괄적인 ‘마비된 사람들’로 옮기는 것이 원문에 더 가깝습니다.
  naturalness: ‘더러운 영들에 사로잡혀 있던 많은 사람에게서 그 영들이’는 복수 지시를 일관되게 하면서도 현대 표준어 성경 문체로 자연스럽습니다. ‘마비된 사람들과 다리를 저는 사람들 중 많은 이’는 원문의 두 부류와 ‘많은 이’의 범위를 자연스럽게 보존합니다.
