  to: 빌립은 달려가서 그 사람이 예언자 이사야의 글을 읽고 있는 것을 듣고 말하였습니다. “당신은 읽고 계신 것을 정말 이해하십니까?”
  rationale: The revision clarifies the referent of the reader and uses ‘이해하다’ for comprehension, while preserving the swift movement, the audible reading without adding ‘aloud,’ Isaiah’s title, and the emphasis of Ἆρά γε through ‘정말.’
