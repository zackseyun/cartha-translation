translation:
  language: ko
  text: 다시 두 번째로 그에게 음성이 들려왔습니다. “하나님께서 깨끗하게 하신 것을 속된 것이라고[a] 하지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “부정한 것이라고 하지 마십시오”, “더러운 것으로 여기지 마십시오.”
    reason: κοινόω는 여기서 ‘속되게 하다/속된 것으로 여기다’라는 의례적 정결 범주의 표현입니다. ‘부정하다’ 또는 ‘더럽다’는 이해를 돕는 가능한 번역이지만, 본문에서는 καθαρίζω와의 어휘적 대조를 살려 ‘속된 것’으로 옮깁니다.
theological_decisions:
- issue: 하나님의 정결 선언이 인간의 「속됨」 범주를 무효화함
  chosen_reading: 하나님께서 깨끗하게 하신 것을 너는 속되다 하지 말아라.
  alternative_readings:
  - 하나님이 깨끗하게 하신 것을 네가 속되다고 하지 말라
  rationale: ἐκαθάρισεν의 신적 행위와 μὴ κοίνου의 명령적 금지를 직역 유지. 「속되다 하지 말라」는 단순한 권면이 아니라 정결 범주의 권한이 하나님께 있음을 선언하는 명령이다.
  doctrine_reference: 'DOCTRINE.md: divine-prerogative on purity categories'
