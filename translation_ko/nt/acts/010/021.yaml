review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's descent, his identification as the person sought, and his question about the visitors' purpose. ‘무슨 일로 오셨습니까?’ is a natural contextual rendering of τίς ἡ αἰτία δι’ ἣν πάρεστε, though it slightly shifts the explicit present-state sense (‘are present’) toward arrival (‘came’).
  naturalness: ‘당신들이’ is often confrontational or unnatural when directly addressing several unfamiliar people in modern formal Korean. ‘여러분이 … 바로 저입니다’ is smoother, polite, and retains the Greek plural address. ‘말했습니다’ is also the more natural modern narrative form while maintaining 합쇼체 in direct speech.
  terminology: ‘베드로’ is standard. No theological terminology is at issue. ‘보십시오’ appropriately renders ἰδού without archaic diction.
  issues:
