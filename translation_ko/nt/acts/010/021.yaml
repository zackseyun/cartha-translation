    issue: Direct plural address ‘당신들이’ is stylistically awkward.
    rationale: Although grammatically possible, ‘당신들’ can sound accusatory in contemporary Korean. ‘여러분’ is the idiomatic formal-polite address to the group and preserves the plural.
