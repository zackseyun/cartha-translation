review_pass:
  verdict: revise
  source_fidelity: 핵심 지시와 인물·장소 정보는 대체로 충실합니다. 다만 μετακάλεσαι는 사람을 자신에게 오도록 ‘불러오다/청하여 오게 하다’라는 뜻이므로, 단순히 데려오는 행위에 초점을 둘 수 있는 ‘데려오너라’보다 ‘불러오십시오’가 더 정확합니다. ‘사람을 보내어’는 헬라어에 목적어가 명시되어 있지는 않으나, 문맥상 보내는 사람들을 자연스럽게 보충한 것으로 허용됩니다.
  naturalness: ‘베드로라고 하는 시몬’과 ‘무두장이 시몬의 집에 묵고 있습니다’는 현대 표준 한국어로 자연스럽습니다. 합쇼체 요건에 맞추어 명령과 서술을 각각 ‘-십시오’, ‘-습니다’로 통일했습니다. 초안 끝의 닫는 인용 부호(」)는 짝이 없어 삭제해야 합니다.
  terminology: ‘욥바’, ‘베드로’, ‘시몬’, ‘무두장이’는 통용되는 성경 인명·직업 명칭이며 적절합니다. ξενίζεται의 손님으로 머무는 뜻은 ‘묵고 있습니다’가 간결하고 정확하게 전달합니다.
  issues:
  - severity: medium
    issue: ‘데려오너라’
    rationale: μετακάλεσαι는 누군가를 부르거나 청하여 오게 하는 명령입니다. ‘데려오다’는 파견자가 직접 동행·호송하는 뉘앙스를 더할 수 있으므로 ‘불러오십시오’가 원문의 의미 범위에 더 가깝습니다.
  - severity: medium
    issue: 합쇼체 불일치
    rationale: 초안의 ‘데려오너라’, ‘머물고 있다’는 현대 formal-polite 합쇼체가 아닙니다.
  - severity: low
    issue: 짝 없는 닫는 인용 부호(」)
    rationale: 앞선 여는 인용 부호 없이 닫는 부호만 있어 문장부호 구조 오류입니다.
  revised_text: 그러므로 욥바로 사람을 보내어 베드로라고 하는 시몬을 불러오십시오. 그는 바닷가에 있는 무두장이 시몬의 집에 묵고 있습니다.
