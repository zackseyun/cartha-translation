  source_fidelity: 원문의 현재분사 συνομιλῶν을 ‘이야기하면서’로, 부정과거 εἰσῆλθεν을 ‘들어가’로, 역사적 현재 εὑρίσκει를 한국어 서술 관습에 맞추어 과거형 ‘보았습니다’로 충실히 옮겼습니다. 완료분사 συνεληλυθότας의 이미 모여 있는 상태도 ‘모여 있는’으로 적절히 반영했습니다.
  naturalness: ‘베드로는 그와 이야기하면서 안으로 들어가, 많은 사람이 모여 있는 것을 보았습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽고 이해하기 쉽습니다. ‘그’의 지시 대상은 앞 문맥의 고넬료이므로 본문 내에서 별도 반복 없이도 충분히 분명합니다.
