  source_fidelity: 원문의 시간 표현은 나흘 전의 바로 이 시각과 제구시의 기도를 연결합니다. 초안의 ‘나흘 전 이맘때에’는 대체로 적절하나, ‘바로 이 시각’이 현재 시각과의 대응을 더 분명히 드러냅니다. ἀνήρ는 ‘한 사람’으로 옮기며, ἐν ἐσθῆτι λαμπρᾷ는 ‘빛나는 옷을 입은’으로 자연스럽게 반영했습니다.
  naturalness: 초안은 문장이 ‘서서’에서 끝나 인용문과 절이 미완성입니다. 완결된 문장으로 고치고, 현대 표준어 합쇼체에 맞추어 ‘기도하고 있었습니다’와 ‘내 앞에 서 있었습니다’를 사용했습니다.
  terminology: 고유명사 ‘고넬료’, 시간 명칭 ‘제구시’, 그리고 시각 환산 각주는 유지했습니다. 사람으로 나타난 존재를 본문이 ‘한 사람’이라고 표현하므로 존칭 표현인 ‘한 분’은 사용하지 않았습니다.
  issues:
