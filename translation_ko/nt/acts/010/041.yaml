  text: 그분은 모든 백성에게 나타나신 것이 아니라, 하나님께서 미리 정하신 증인들, 곧 우리에게 나타나셨습니다. 우리는 그분께서 죽은 자들 가운데서 살아나신 뒤에 그분과 함께 먹고 마셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
