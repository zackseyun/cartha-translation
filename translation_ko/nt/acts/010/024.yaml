  naturalness: ‘그 다음 날, 그가 가이사랴에 들어갔습니다’와 ‘친척들과 가까운 친구들을 불러 모아 놓고’는 현대 표준어 합쇼체에서 자연스럽고 명료합니다. 쉼표와 문장 분리를 통해 서술의 흐름도 정돈했습니다.
  terminology: 가이사랴, 고넬료는 한국어 성서 번역 전통과 현대 독자에게 익숙한 표기입니다. ‘가까운 친구들’은 ἀναγκαίους φίλους의 친밀하고 신뢰할 만한 친구라는 뜻을 무리 없이 전달합니다.
