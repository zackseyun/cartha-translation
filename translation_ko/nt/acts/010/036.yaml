revisions:
- from: 이것이 하나님께서 이스라엘 자손에게 보내신 말씀이니, 곧 예수 메시아를 통하여 평화의 복음을 전하시는 것입니다 — 이분이 만유의 주이십니다.
  to: 하나님께서 이스라엘 자손에게 보내신 말씀입니다. 하나님께서는 예수 메시아를 통하여 평화의 복음을 선포하셨습니다. 이분은 만유의 주이십니다.
  rationale: The revision removes the unsupported opening demonstrative, clarifies that God both sent the message and proclaimed peace through Jesus the Messiah, and preserves the emphatic final identification of Jesus as Lord of all. The slight sentence division is a natural Korean accommodation of the Greek participial construction and does not alter its meaning.
