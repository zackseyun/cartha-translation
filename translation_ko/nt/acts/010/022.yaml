  to: 그들이 말하였습니다. “백부장 고넬료는 의롭고 하나님을 경외하는 사람이며, 유대 사람들 전체에게서 좋은 평판을 받고 있습니다. 그는 거룩한 천사를 통하여 하나님의 지시를 받아, 당신을 자기 집으로 부르고 당신에게서 말씀을 듣도록 하였습니다.”
