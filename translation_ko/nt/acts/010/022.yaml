  verdict: revise
  source_fidelity: The draft broadly conveys Cornelius's status, reputation, angelic instruction, and the two ensuing actions. However, '좋게 평이 난' is unidiomatic, and '신적인 지시' is less appropriate than language that identifies the communication as divine while retaining the holy angel as its intermediary. The revised wording also makes Cornelius the understood subject of both 'summon' and 'hear,' as in the Greek infinitives.
  naturalness: 'Several expressions are awkward in modern formal Korean: ''고넬료라는 의롭고'' produces an unnatural noun modification, and ''좋게 평이 난'' is not standard idiom. The revision uses fluent formal-polite narration and quotation while maintaining the source''s compact report.'
  terminology: '''백부장,'' ''의로운 사람,'' and ''하나님을 경외하는 사람'' are accurate, established Korean biblical terms. ''유대 사람들 전체'' communicates ὅλου τοῦ ἔθνους τῶν Ἰουδαίων without suggesting a modern nation-state. ''거룩한 천사를 통하여 하나님의 지시'' represents both ἐχρηματίσθη (divine communication) and ὑπὸ ἀγγέλου ἁγίου.'
  issues:
