    issue: Unnatural Korean phrasing for Cornelius's description and reputation
    rationale: '''백부장 고넬료라는 의롭고 ... 분'' has an ill-formed modifying sequence, and ''좋게 평이 난'' is nonstandard and awkward. The Greek passive μαρτυρούμενος denotes favorable public testimony, naturally rendered as receiving a good reputation.'
  - severity: low
    issue: '''신적인 지시'' is stylistically unnatural and underspecifies the divine-communication idiom'
    rationale: ἐχρηματίσθη denotes receiving a divine communication. '거룩한 천사를 통하여 하나님의 지시를 받았다' is idiomatic Korean and preserves both the divine character of the message and the angelic agency.
