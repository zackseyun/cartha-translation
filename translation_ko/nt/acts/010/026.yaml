  naturalness: The revised wording is natural contemporary standard Korean in formal-polite register. The direct imperative '일어나십시오' appropriately renders the singular imperative in respectful speech.
  terminology: '''베드로,'' ''사람,'' and the respectful speech level are appropriate. ''나도 사람입니다'' idiomatically preserves the inclusive emphasis of καὶ ἐγὼ αὐτός without adding the interpretive word ''단지/오직'' (''only'').'
