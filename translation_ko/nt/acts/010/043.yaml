  source_fidelity: 그리스어의 현재형 μαρτυροῦσιν은 ‘증언합니다’로 옮기는 것이 적절합니다. ‘그를 믿는 자마다’, ‘그의 이름을 통하여’, ‘죄 사함을 받는다’는 각각 πάντα τὸν πιστεύοντα εἰς αὐτόν, διὰ τοῦ ὀνόματος αὐτοῦ, ἄφεσιν ἁμαρτιῶν λαβεῖν을 충실히 반영합니다.
  naturalness: 초안의 ‘증언하기를 … 하였습니다’는 현재형 서술과 다소 어긋나며 문장이 무겁습니다. 또한 끝의 닫는 인용 부호는 짝이 없어 제거해야 합니다. 두 절로 나누면 현대 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘예언자’, ‘증언합니다’, ‘그의 이름을 통하여’, ‘죄 사함’은 문맥과 성경 한국어의 주요 용어를 무리 없이 반영합니다. ‘자마다’보다 포괄적이고 자연스러운 ‘사람마다’를 사용합니다.
