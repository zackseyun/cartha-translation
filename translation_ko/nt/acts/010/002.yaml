review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Cornelius’s piety, his household’s association with his fear of God, charitable activity toward the people, and continual prayer. However, ‘자선’ is somewhat broader than ἐλεημοσύνας, which commonly denotes almsgiving or relief for those in need; ‘구제’ better preserves this sense. The revised wording also keeps the three descriptive elements in a clearer parallel structure.
  naturalness: The revision is natural in modern standard Korean and uses formal-polite narrative style (‘…사람이었습니다’). ‘온 집안과 함께’ clearly conveys σὺν παντὶ τῷ οἴκῳ αὐτοῦ without implying a physical house.
  terminology: ‘하나님을 경외하다’ is established, natural biblical Korean for φοβούμενος τὸν θεόν and retains the possible God-fearer resonance without turning it into a technical label in the text. ‘백성’ appropriately preserves λαός, and ‘많은 구제를 베풀다’ conveys plural, abundant almsgiving.
  issues:
  - severity: low
    issue: ‘많은 자선’ is less specific than the Greek ἐλεημοσύνας πολλὰς.
    rationale: In this context ἐλεημοσύνη normally refers to almsgiving or material relief for people in need. ‘많은 구제를 베풀며’ is more precise while remaining idiomatic Korean.
  revised_text: 그는 온 집안과 함께 하나님을 경외하고, 백성에게 많은 구제를 베풀며, 늘 하나님께 기도드리는 경건한 사람이었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘하나님을 경외하는 사람’. 이 표현은 이스라엘의 하나님을 예배하던 이방인을 가리키는 통용된 묘사로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘많은 자선’. 그리스어는 흔히 가난한 이들을 위한 구제의 선물을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The text is revised to render ἐλεημοσύνας more specifically as ‘구제’ and to present the Greek participial descriptions in a fluent Korean parallel sequence. Footnote a should be anchored to ‘하나님을 경외하고,’ and footnote b to ‘많은 구제를,’ preserving the English audit trail’s lexical information at the relevant Korean expressions.
