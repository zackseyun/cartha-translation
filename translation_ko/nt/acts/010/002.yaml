translation:
  language: ko
  text: 그는 경건했으며, 온 집안과 함께 하나님을 경외하고[a] 백성에게 많은 자선을[b] 베풀며 늘 하나님께 기도했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 경외하는 이’. 이 표현은 하나님을 경외한다는 일반적 뜻과 함께, 이스라엘의 하나님을 예배하던 이방인을 가리키는 통용된 표현일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘많은 구제’. 그리스어는 흔히 궁핍한 사람들에게 주는 자선의 선물이나 구제를 가리킵니다.
    reason: lexical_alternative
