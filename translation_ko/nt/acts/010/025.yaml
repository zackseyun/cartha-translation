review_pass:
  verdict: revise
  source_fidelity: The temporal clause and the actions of Cornelius are substantially conveyed. However, ‘맞으러 나와’ (‘came out to meet’) introduces a directional ‘came out’ not expressed in συναντήσας αὐτῷ. The reference ‘그 발’ is also less explicit than the Greek’s reference to Peter’s feet.
  naturalness: The draft is fluent, modern standard Korean in formal-polite narrative style. ‘맞이하여’ is equally natural and avoids the added directional nuance; ‘그의 발 앞에’ gives clear reference without sounding unnatural.
  terminology: ‘엎드려 절하였습니다’ appropriately renders the combined physical prostration and προσκυνέω in context. A footnote should retain ‘경배하였습니다’ as a viable stronger lexical alternative, while the main text preserves the contextual sense of reverential prostration/homage.
  issues:
  - severity: medium
    issue: ‘맞으러 나와’ adds ‘came out.’
    rationale: συναντήσας means that Cornelius met Peter; the Greek text does not specify that Cornelius came out to do so.
  - severity: low
    issue: No footnote preserves the lexical range of προσκυνέω.
    rationale: The verb can denote an act of homage/prostration or worship. The English audit trail rightly records the stronger alternative, which should be available to Korean readers as well.
  revised_text: 베드로가 들어오자 고넬료가 그를 맞이하여 그의 발 앞에 엎드려 절하였습니다[a].
  revised_footnotes:
