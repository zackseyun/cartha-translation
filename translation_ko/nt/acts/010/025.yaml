  rationale: ‘맞으러 나와’를 ‘그를 맞이하여’로 고쳐 원문에 없는 이동 방향을 제거하고, 발의 소유자를 명확히 했습니다. 본문의 ‘절하였습니다’는 고넬료의 엎드린 행위와 공경의 표현을 자연스럽게 전달하며, ‘경배하였습니다’라는 가능한 어휘적 대안은 각주에 보존했습니다.
