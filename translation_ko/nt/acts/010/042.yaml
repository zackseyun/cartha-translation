  terminology: ‘전파하다’, ‘엄숙히 증언하다’, ‘백성’, ‘심판자’는 문맥과 어휘에 적절합니다. ‘산 사람과 죽은 사람’은 ζώντων καὶ νεκρῶν을 자연스럽게 보존합니다.
