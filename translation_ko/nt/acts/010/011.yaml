  revision_rationale: 원문의 불특정한 명사구(σχεῦός τι)를 '어떤 물체'로 드러내고, 큰 천과의 비교(ὡς ὀθόνην μεγάλην)를 유지했습니다. 또한 '잡힌 채'라는 추가 동작을 피하고, 내려오는/내려지는 운동과 네 귀퉁이의 관계를 간결하게 표현했습니다.
