translation:
  language: ko
  text: 우리는 그분께서 유대인의 땅과 예루살렘에서 행하신 모든 일의 증인입니다. 그들은 그분을 나무에 매달아 죽였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목재에’. 그리스어는 ‘나무’를 뜻하며, 해석적으로는 ‘십자가에’라고 할 수도 있습니다. 이는 신명기 21:23을 반향하는 것일 수 있습니다.
    reason: ξύλον의 어휘적 범위와 십자가로 해석되는 문맥적 의미를 구별하고, 가능한 구약성경 반향을 밝혀 줍니다.
