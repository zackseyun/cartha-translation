  source_fidelity: 초안의 ‘데려오너라’는 μετάπεμψαι(사람을 보내어 오도록 청하다/불러오다)보다 물리적으로 데리고 오는 뜻을 다소 강하게 만들 수 있습니다. 또한 ‘베드로라 하는 시몬이라는 자’는 원문의 ‘시몬이라는 어떤 사람, 곧 베드로라 불리는 이’를 어색하게 중첩하여 표현합니다.
