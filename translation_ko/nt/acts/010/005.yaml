  terminology: ‘욥바’, ‘시몬’, ‘베드로’는 통용되는 성경 인명·지명 표기를 유지합니다. ἄνδρας는 문맥상 남성 사자들을 가리키나, 한국어 본문에서는 자연스럽게 ‘사람들을’로 옮길 수 있습니다.
