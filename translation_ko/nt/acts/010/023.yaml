  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
  footnotes:
  - marker: a
    text: Or "hosted them" or "received them as guests"; the Greek specifically refers to extending hospitality by lodging them.
    reason: lexical_alternative
  - marker: b
    text: '"Brothers" translates the masculine plural ἀδελφῶν; in early Christian usage this can sometimes include fellow believers more broadly, that is, "brothers and sisters."'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 베드로는 그들을 안으로 맞아들여 묵게 하였습니다.[a] 이튿날 그는 일어나 그들과 함께 떠났으며, 욥바에서 온 형제들[b] 몇 명도 그와 함께 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 손님으로 맞아들였습니다.’ 그리스어는 손님에게 숙소를 제공하는 환대를 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 남성 복수형 ἀδελφῶν을 옮긴 말입니다. 초기 그리스도인 용례에서 이 말은 때때로 더 넓게 동료 신자들을 포함할 수 있으므로, ‘형제자매들’로 이해될 수도 있습니다.
    reason: lexical_alternative
