  source_fidelity: ἀθέμιτον은 반드시 성문 율법 위반만을 뜻하지 않고 허용되지 않음 또는 관습·규범에 어긋남을 포괄하므로, '율법에 어긋나는'은 다소 단정적입니다. 또한 προσέρχεσθαι는 원문에 없는 '그 집'을 특정하지 않는 편이 안전합니다. μηδένα ... ἄνθρωπον과 κοινὸν ἢ ἀκάθαρτον의 사람에 대한 적용 및 두 정결 범주의 구별은 유지되어야 합니다.
  naturalness: 합쇼체는 대체로 자연스럽지만, '그 집을 방문하는'은 원문의 목적어를 보충합니다. '찾아가거나'가 문맥상 자연스러우면서도 더 절제된 표현입니다. 인용문의 닫는 따옴표도 필요합니다.
  terminology: '''속된''과 ''부정한''은 κοινός와 ἀκάθαρτος의 구별을 비교적 잘 보존합니다. λέγειν은 단순한 상태 서술보다 ''부르다/여기다''가 더 직접적이므로 ''부르지 말라''로 옮깁니다. ''다른 민족 사람''은 ἀλλόφυλος의 문자적 범위를 보존하는 적절한 표현입니다.'
