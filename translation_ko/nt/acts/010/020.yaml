    text: 또는 ‘아무 차별이나 구별도 하지 말고.’ 그리스어 분사는 ‘의심하거나 망설이다’ 또는 ‘구별하다/차별하다’를 뜻할 수 있으며, 후자의 의미는 이 장의 유대인과 이방인이라는 주제와 관련될 수 있습니다.
