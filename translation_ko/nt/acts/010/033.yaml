translation:
  language: ko
  text: 그러므로 저는 곧바로 사람을 보내어 당신을 불렀습니다. 당신이 오신 것은 잘하신 일입니다. 이제 그러므로 우리 모두는 하나님 앞에 있어, 주님께서[a] 당신에게 명하신 모든 것을 들으려 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘주님’입니다. 문맥상 예수를 가리킬 가능성이 크지만, 하나님을 가리키는 것으로 이해하는 이들도 있습니다.
