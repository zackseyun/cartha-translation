  source_fidelity: 첫 문장의 ‘사람을 보내어 당신을 모시려 하였습니다’는 ἔπεμψα πρὸς σέ의 완료된 행동을 ‘모시려 했다’라는 미완의 의도로 바꾸며, ‘모시다’는 원문의 소환/초청 의미보다 과도하게 공경의 뉘앙스를 더합니다. 또한 마지막의 ‘주께서’는 주님(κύριος)과 하나님(θεός)의 구별을 한국어에서 흐립니다. 수정문은 즉각성, 베드로를 부른 행동, 명령의 완료 수동 의미, 그리고 κύριος의 의도적 비특정성을 보존합니다.
  naturalness: 합쇼체로 자연스럽게 다듬었습니다. ‘당신이 와 주시니 잘하였습니다’ 대신 ‘오신 것은 잘하신 일입니다’로 바꾸어, 과거 사건에 대한 고넬료의 정중한 평가를 자연스럽게 표현했습니다.
  terminology: θεός는 ‘하나님’, κύριος는 ‘주님’으로 일관되게 구별했습니다. κύριος의 지시 대상은 본문에서 ‘주님’으로만 옮기고, 문맥상 예수를 가리킬 가능성과 더 일반적인 이해 가능성은 각주에서 제한적으로 밝혔습니다.
