  source_fidelity: 초안의 ‘군소리 없이’는 ἀναντιρρήτως(이의·반대 없이)의 핵심 뜻을 대체로 전달하지만, 구어적이며 ‘이의 없이’가 더 직접적이고 격식에 맞습니다. μεταπεμφθείς는 단순히 ‘부르심을 받았을 때’라는 시간절보다 ‘부름을 받고’가 수동적 소환 관계를 더 잘 나타냅니다. 문말의 닫는 따옴표는 본문에 대응하지 않습니다.
  naturalness: ‘그러므로 나도 부름을 받고 이의 없이 왔습니다’와 ‘무슨 이유로 나를 부르셨는지 묻겠습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 추론 및 질문의 진행을 보존합니다.
