    rationale: 제시된 SBLGNT 본문은 χάριτος('은혜')를 읽지만, 일부 사본은 πίστεως('믿음')를 읽습니다. 영어 POB 감사 기록에도 이 이문이 명시되어 있으므로, 본문은 원문을 따르되 독자용 각주로 이문을 알려야 합니다.
