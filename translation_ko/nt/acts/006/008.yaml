  source_fidelity: 그리스어 본문은 '은혜와 능력이 충만한' 스데반이 백성 가운데서 지속적으로 큰 τέρατα와 σημεῖα를 행했음을 말합니다. 초안은 핵심 의미와 미완료 시제의 진행성을 대체로 잘 옮겼습니다. 다만 본문이 채택한 χάριτος(은혜)와 중요한 πίστεως(믿음) 이문을 알리는 각주가 필요합니다.
  naturalness: '''은혜와 능력이 충만하여'' 및 ''행하고 있었습니다''는 현대 표준 한국어 합쇼체로 자연스럽습니다. ''큰 기이한 일과 표적''은 다소 어색하고, 복수의 두 항목을 더 자연스럽게 나타내려면 ''큰 이적과 표적''이 적절합니다.'
  terminology: '''은혜'', ''능력'', ''표적''은 적절합니다. τέρατα는 ''이적''으로 옮겨 σημεῖα(표적)와 구별되는 경이로운 행위의 뜻을 보존했습니다. 본문은 SBLGNT의 ''은혜''를 따르고, ''믿음''은 이문 각주로 처리합니다.'
  issues:
