  terminology: ‘회당’, ‘자유민’, ‘구레네’, ‘알렉산드리아’, ‘길리기아’, ‘아시아’, ‘스데반’은 적절합니다. ‘아시아’는 현대의 대륙이 아니라 로마 속주를 가리키므로 문화적 주석을 보완하는 것이 유익합니다.
