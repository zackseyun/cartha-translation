  source_fidelity: 원문의 단수 관사와 ‘불리는’(τῆς λεγομένης)은 뒤따르는 자유민·구레네인·알렉산드리아인 및 길리기아와 아시아 출신 사람들과 관련된 회당의 명칭/구성을 수식합니다. 초안은 ‘자유민이라 불리는 회당’이라고만 하여 뒤의 집단들을 회당 명칭과 분리해 보이게 할 수 있습니다. 또한 ‘논쟁하였습니다’는 συζητοῦντες의 대립적 논쟁을 적절히 반영합니다.
