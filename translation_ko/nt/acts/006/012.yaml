  source_fidelity: ‘달려들어’는 ἐπιστάντες의 갑작스러운 접근보다 물리적 공격을 더 강하게 암시하며, ‘끌고 갔습니다’는 ἤγαγον(데리고 가다/이끌다)의 뜻을 다소 과장할 수 있습니다. 또한 이 문맥의 συνέδριον은 산헤드린을 가리킬 가능성이 높으므로 이를 본문에서 밝혔습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 사건의 급작스러움과 강제성을 ‘들이닥쳐 그를 붙잡아’에 적절히 반영합니다.
  terminology: γραμματεῖς는 역사적 직함을 보존하면서도 현대 독자에게 이해되는 ‘율법학자들’로 유지했습니다. συνέδριον은 ‘산헤드린 공의회’로 옮기고, 일반적 번역 가능성은 각주에 제시했습니다.
  issues:
  - severity: medium
    issue: ‘스데반에게 달려들어’
    rationale: ἐπιστάντες는 갑자기 다가서거나 들이닥치는 행위를 뜻하며, ‘달려들다’는 본문이 명시하지 않는 공격성을 더할 수 있습니다.
  - severity: low
    issue: ‘공의회로’
    rationale: 예루살렘의 이 문맥에서 συνέδριον은 특정 유대 최고 의결·재판 기구인 산헤드린을 가리킬 가능성이 높습니다. 역사적 지시 대상을 본문에 드러내는 편이 더 정확합니다.
  - severity: low
    issue: ‘끌고 갔습니다’
    rationale: 앞선 συνήρπασαν이 강제적 붙잡음을 이미 나타내지만, ἤγαγον 자체는 넓게 ‘데리고 가다/이끌다’입니다. ‘데리고 갔습니다’가 동사의 의미를 더 정확히 보존합니다.
  revised_text: 그들은 또 백성과 장로들과 율법학자들을 선동하고, 스데반에게 들이닥쳐 그를 붙잡아 산헤드린 공의회에 데리고 갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘공의회’. 그리스어 συνέδριον은 일반적으로 ‘공의회’로도 옮길 수 있으나, 여기서는 유대의 최고 의결·재판 기구인 산헤드린을 가리킬 가능성이 높습니다.
    reason: lexical_alternative
  revision_rationale: τέ의 약한 연결은 ‘또’로 자연스럽게 반영했습니다. ἐπιστάντες의 돌연한 접근은 ‘들이닥쳐’로, συναρπάζω의 강제성은 ‘붙잡아’로 옮겼습니다. ἄγω에는 중립적인 ‘데리고 갔습니다’를 사용했으며, συνέδριον의 문맥상 특정성을 ‘산헤드린 공의회’와 각주로 반영했습니다.
