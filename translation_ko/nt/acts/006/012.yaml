  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
  footnotes:
  - marker: a
    text: Or 'the council.' The Greek συνέδριον can be rendered more generically, but here likely refers specifically to the Jewish ruling council, the Sanhedrin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 백성과 장로들과 서기관들을 선동하고, 그에게 갑자기 들이닥쳐 그를 붙잡아 산헤드린 공의회[1]로 데리고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 또는 ‘공의회’. 그리스어 συνέδριον은 일반적으로 ‘공의회’로도 번역할 수 있으나, 여기서는 유대의 통치·사법 기관인 산헤드린을 가리키는 것으로 보입니다.
    reason: lexical_alternative
