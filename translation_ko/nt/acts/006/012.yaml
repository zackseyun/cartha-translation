  source_fidelity: ‘스데반에게 달려들어’는 문맥상 지시 대상은 분명하지만, ἐπιστάντες는 우선 ‘갑자기 들이닥치다/다가서다’라는 돌발적 접근을 뜻하며, 뒤의 συνήρπασαν이 물리적 제압을 나타냅니다. 또한 γραμματεῖς는 역사적 직함인 ‘서기관들’로 옮기는 편이 더 직접적입니다. συνέδριον은 이 문맥에서 산헤드린을 가리킬 가능성이 높으므로 이를 본문과 주석에서 밝혔습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하며, ‘그에게 갑자기 들이닥쳐 그를 붙잡아’가 원문의 동작 순서와 긴박성을 자연스럽게 드러냅니다.
  terminology: ‘백성’, ‘장로들’, ‘서기관들’, ‘산헤드린 공의회’는 예루살렘의 유대 공적·사법 맥락을 보존하는 통용 용어입니다. ‘산헤드린’의 역사적 특정성은 주석으로 보완합니다.
  issues:
  - severity: medium
    issue: ἐπιστάντες를 ‘달려들어’로 번역함
    rationale: ‘달려들다’는 이미 공격·제압의 행위를 강하게 내포할 수 있는데, 원문은 먼저 갑작스럽게 다가오고 이어 붙잡았다고 서술합니다. ‘갑자기 들이닥쳐’가 두 동작의 구분을 더 잘 보존합니다.
  - severity: low
    issue: γραμματεῖς를 ‘율법학자들’로 번역함
    rationale: 의미는 대체로 맞지만, 원문의 역사적 직함을 보존하는 ‘서기관들’이 더 직접적이며 성경 한국어 사용에서도 자연스럽습니다.
  - severity: low
    issue: συνέδριον의 구체적 지시 대상에 대한 안내 부재
    rationale: 이 문맥의 συνέδριον은 일반 공의회보다 유대 최고 의회인 산헤드린을 가리킬 가능성이 높습니다. 본문에 역사적 명칭을 쓰고 주석으로 일반적 번역 가능성을 안내하는 것이 적절합니다.
  revised_text: 그리고 그들은 백성과 장로들과 서기관들을 선동하고, 그에게 갑자기 들이닥쳐 그를 붙잡아 산헤드린 공의회[1]로 데리고 갔습니다.
