review_pass:
  verdict: revise
  source_fidelity: ‘흥왕하였고’는 ηὔξανεν의 성장·확산 의미를 대체로 전달하지만 현대 표준어로는 지나치게 문어적·고풍스럽습니다. 또한 ‘더욱’은 원문에 명시된 비교를 보태는 경향이 있습니다. ‘제사장 중에서도’의 ‘-도’는 원문의 단순 접속 τε보다 ‘심지어/또한’의 강조를 다소 더합니다.
  naturalness: ‘말씀이 계속 퍼져 나가고’와 ‘순종해 갔습니다’는 현대 합쇼체에서 자연스러우며, 세 동사의 미완료적 진행성을 무리 없이 반영합니다.
  terminology: ‘하나님의 말씀’, ‘제자들’, ‘제사장들’, ‘믿음’은 적절합니다. τῇ πίστει의 객관적 의미(믿는 내용/신앙)에 대한 가능한 이해는 각주로 보존하는 것이 안전합니다.
  issues:
  - severity: medium
    issue: ‘더욱 흥왕하였고’
    rationale: ‘흥왕하다’는 현대 일반 독자에게 고풍스럽고, ‘더욱’은 비교급적 뉘앙스를 추가할 수 있습니다. ηὔξανεν의 지속적 성장·확산은 ‘계속 퍼져 나가고’가 자연스럽게 전달합니다.
  - severity: low
    issue: ‘제사장 중에서도’
    rationale: ‘-도’는 특별한 강조를 암시할 수 있으나, 원문의 τε는 단순한 접속의 기능입니다. ‘많은 제사장들이’가 더 직접적입니다.
  - severity: low
    issue: ‘순종하게 되었습니다’의 진행성
    rationale: 의미상 가능하지만 완료된 변화에 더 초점이 놓입니다. 미완료 ὑπήκουον의 진행·점진성을 ‘순종해 갔습니다’로 더 잘 드러낼 수 있습니다.
  revised_text: 그리고 하나님의 말씀이 계속 퍼져 나가고, 예루살렘에서 제자들의 수가 크게 늘어났으며, 많은 제사장들이 믿음에 순종해 갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘믿음에 순종하고 있었습니다.’ 여기서 ‘믿음’은 내면의 신뢰만이 아니라 그들이 받아들인 믿음의 메시지 또는 신앙을 가리킬 수 있습니다.
    reason: τῇ πίστει의 객관적 의미 가능성과 ὑπήκουον의 진행적 의미를 보존합니다.
  revision_rationale: 고풍스러운 ‘흥왕’과 원문에 없는 비교적 뉘앙스를 피하고, 세 미완료 동사의 지속적 전개를 현대적인 한국어로 반영했습니다. ‘제사장 중에서도’의 추가 강조를 제거했으며, ‘믿음’의 해석상 범위는 각주에서 제시했습니다.
