  source_fidelity: 초안은 핵심 의미를 대체로 충실히 옮겼습니다. 다만 '더욱'은 원문에 없는 비교·추가의 뉘앙스를 더하며, 세 동사의 미완료적 진행성을 더 자연스럽게 반영할 수 있습니다. '제사장 중에서도 많은 사람'보다 '많은 제사장들'이 πολύς ὄχλος τῶν ἱερέων의 집단적 표현을 더 직접적으로 전달합니다.
  naturalness: '''흥왕하였고''는 현대 표준 한국어 합쇼체 성경 번역으로는 다소 고어적입니다. ''계속 자라나고''가 자연스럽고 원문의 성장 비유를 보존합니다.'
  terminology: '''하나님의 말씀'', ''제자'', ''제사장'', ''믿음''은 적절합니다. τῇ πίστει는 객관적 의미의 ''그 믿음/신앙''일 수도 있고 주관적 ''믿음''으로도 읽힐 수 있으므로, 본문에서는 기존의 간결한 ''믿음''을 유지하고 각주에서 가능한 의미를 밝혀 모호성을 보존하는 것이 안전합니다.'
  issues:
  - severity: medium
    issue: '''더욱 흥왕하였고'''
    rationale: σφόδρα는 제자 수의 증가를 수식하며, '더욱'은 λόγος의 성장에 붙어 원문에 없는 비교 의미를 암시합니다. 또한 '흥왕'은 현대적 문체에서 고어적입니다.
  - severity: low
    issue: '''제사장 중에서도 많은 사람'''
    rationale: 원문은 많은 제사장들의 집단을 가리킵니다. '많은 제사장들'이 더 직접적이고 자연스럽습니다.
  - severity: low
    issue: 진행성의 표현
    rationale: ηὔξανεν, ἐπληθύνετο, ὑπήκουον은 모두 미완료형입니다. 한국어에서 매번 기계적으로 반복할 필요는 없으나, 앞의 두 동사에 '계속'을 사용해 요약적 진행성을 드러낼 수 있습니다.
  revised_text: 그리고 하나님의 말씀이 계속 자라나고, 예루살렘에서 제자들의 수가 크게 계속 늘어났으며, 많은 제사장들이 믿음에 순종하게 되었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘믿음에 순종하고 있었습니다.’ 여기서 ‘믿음’은 내적인 신뢰만이 아니라 그리스도교의 믿음 또는 전해진 메시지를 가리킬 수도 있습니다.
    reason: τῇ πίστει의 객관적 의미 가능성과 ὑπήκουον의 진행적 뉘앙스를 보존합니다.
  revision_rationale: 현대적인 합쇼체로 고쳐 고어적인 '흥왕'을 피하고, σφόδρα의 수식 범위를 제자 수의 증가에 두었습니다. 또한 제사장들의 집단성을 직접 표현하고, '믿음'의 해석상 열림은 각주로 보존했습니다.
