  to: 그러나 형제 여러분, 여러분 가운데서 평판이 좋고 성령과 지혜가 충만한 남자 일곱 명을 뽑으십시오. 우리는 그들을 이 일을 맡도록 세우겠습니다.
  rationale: 원문의 약한 전환 표지(δέ)를 ‘그러나’로, 성별이 명시된 ἄνδρας를 ‘남자’로 반영했습니다. 또한 선택된 남자들을 사도들이 임명한다는 관계절의 연결을 유지하도록 문장을 고쳤습니다. ‘평판이 좋고’, ‘성령과 지혜가 충만한’, ‘이 일을 맡도록 세우겠습니다’는 각각 μαρτυρουμένους, πλήρεις πνεύματος καὶ σοφίας, καταστήσομεν ἐπὶ τῆς χρείας ταύτης를 자연스럽고 충실하게 옮깁니다.
