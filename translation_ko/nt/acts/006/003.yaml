    rationale: 원문의 οὓς는 ‘일곱 남자’를 받는 관계대명사이며, ‘그러면’은 원문에 없는 조건·결과 연결을 더합니다. 선택된 이들을 임명한다는 연결을 직접 표현하는 편이 정확합니다.
