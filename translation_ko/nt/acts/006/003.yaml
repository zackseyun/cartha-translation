  source_fidelity: 개정이 필요합니다. δέ는 이 문맥에서 강한 인과를 나타내는 ‘그러므로’보다 전환·대조의 ‘그러나’로 옮기는 것이 적절합니다. ἄνδρας는 성인 남성을 뜻하므로 ‘사람’이 아니라 ‘남자’로 명시해야 합니다. 또한 οὓς καταστήσομεν은 선택된 이들을 사도들이 세운다는 관계절이므로 ‘그러면’으로 결과 관계를 만들지 않는 편이 원문에 더 가깝습니다.
  naturalness: ‘평판이 좋고’와 ‘성령과 지혜가 충만한’은 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. ‘이 일을 맡도록 세우겠습니다’는 공식적 임명과 맡겨진 책임이라는 뜻을 자연스럽게 전달합니다.
  terminology: ‘형제 여러분’은 ἀδελφοί의 남성형 호칭을 보존하면서 한국어에서는 회중을 향한 자연스러운 호칭입니다. ‘남자 일곱 명’은 ἄνδρας의 성별 명시를 보존합니다. ‘성령’은 누가-행전 문맥에서 πνεῦμα의 통상적 지시 대상을 반영하며, 본문에 ‘거룩한’이 명시되지 않았다는 점을 별도로 과도하게 해설할 필요는 없습니다.
