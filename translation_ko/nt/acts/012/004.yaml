  - marker: a
    text: Literally, 'four tetrads of soldiers,' that is, four groups of four soldiers.
    reason: lexical_alternative
  - marker: b
    text: Greek πάσχα means 'Passover'; some older English versions render it 'Easter' here.
    reason: alternative_reading
