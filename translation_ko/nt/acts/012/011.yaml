  to: 베드로가 정신을 차리고[a] 말하였습니다. 「이제 나는 참으로 알게 되었습니다. 주께서 자신의 천사를 보내시어 헤롯의 손에서[b], 또 유대 백성이 바라던 모든 일에서[c] 나를 건져 내셨습니다.」
  rationale: 현대 합쇼체로 문체를 통일하고, προσδοκία의 문맥상 의미를 더 분명하게 옮겼습니다. ‘주’의 지시 대상을 해석적으로 특정하지 않았으며, ‘헤롯의 손’이라는 원문의 관용적 이미지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T09:32:49Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘유대 백성이 기다리던 모든 일’은 προσδοκία가 가리키는, 베드로에게 일어나기를 백성이 기대하던 결과라는 뜻을 다소 불명확하게 만듭니다. ‘유대 백성이 바라던 모든 일’이 그 뜻을 더 정확히 드러냅니다.
  naturalness: ‘정신이 들어’도 가능하지만, 이 문맥에서 ‘정신을 차리고’가 현대 한국어에서 더 자연스럽습니다. 초안의 직접화법 ‘알겠다…구나’는 지정된 현대 합쇼체와 맞지 않으므로 합쇼체로 통일하는 것이 필요합니다.
  terminology: ‘주’, ‘천사’, ‘헤롯의 손’, ‘건져 내셨습니다’는 적절합니다. ‘헤롯의 손’은 권세·지배를 뜻하는 관용 표현이므로 주석으로 보완합니다. κύριος의 지시 대상을 특정하지 않고 ‘주’로 유지했습니다.
  issues:
  - severity: medium
    issue: 직접화법의 종결 표현이 합쇼체가 아닙니다.
    rationale: ‘알겠다’와 ‘구나’는 해라체/감탄형이며, 과제에서 지정한 현대 격식 존대체(합쇼체)와 일치하지 않습니다.
  - severity: medium
    issue: ‘유대 백성이 기다리던 모든 일’의 의미가 다소 모호합니다.
    rationale: πάσης τῆς προσδοκίας는 백성이 베드로에 대하여 기대하던 일, 곧 예상하던 결과를 가리킵니다. ‘바라던 모든 일’이 이를 더 직접적으로 전달합니다.
  - severity: low
    issue: 원문의 관용구와 주요 어구에 대한 주석 표지가 없습니다.
    rationale: ‘정신을 차리고’, ‘헤롯의 손’, ‘유대 백성이 바라던 모든 일’은 번역 선택 또는 관용적 의미를 설명할 수 있으므로 표지와 주석을 추가합니다.
