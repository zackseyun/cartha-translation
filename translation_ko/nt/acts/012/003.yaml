    text: 또는 “유대 사람들”. 문맥에 따라 “유대 지도자들”로 이해하기도 하지만, 그리스어 본문은 단지 “유대인들”이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 무교절은 누룩 없는 빵을 먹으며 지키는 절기입니다. 유월절과 밀접하게 이어지는 절기 기간을 가리킵니다.
    reason: cultural_note
  revision_rationale: 원문의 시간적 분사(‘보고’), 유대인들에게 기쁨이 되었다는 비인칭 표현, 베드로를 추가로 체포한 행동, 그리고 무교절이라는 시간 배경을 보존하도록 다듬었습니다. 각주는 본문이 명시하지 않는 Ἰουδαῖοι의 범위와 무교절의 문화적 배경만 최소한으로 설명합니다.
