review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그 일이 유대 사람들의 마음에 든 것’은 ἀρεστόν ἐστιν의 현재적·비인칭적 표현을 다소 완결된 과거 사실처럼 들리게 할 수 있으며, ‘유대 사람들’보다 본문의 통상적이고 직접적인 대응어인 ‘유대인들’이 더 적절합니다. προσέθετο의 첨가·연속의 뉘앙스도 ‘베드로도’로 유지됩니다.
  naturalness: 합쇼체 문장으로 자연스럽지만, 주어를 밝혀 ‘그는’으로 처리하면 앞 절의 헤롯과의 연결이 더 명확합니다. ‘체포했습니다’는 이 문맥의 συλλαβεῖν에 자연스럽고 정확한 현대어입니다.
  terminology: Ἰουδαίοις는 본문이 범위를 지도자들로 한정하지 않으므로 ‘유대인들’로 옮기고, 가능한 ‘유대 사람들/유대 지도자들’ 해석은 각주로만 제시합니다. τῶν ἀζύμων은 ‘무교절’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘마음에 든 것을 보고’의 시제·표현
    rationale: 원문은 ‘그것이 유대인들에게 기쁘게/마음에 든다는 것을 보고’라는 인식의 내용을 나타냅니다. ‘기쁘게 한다는 것을 보고’가 이를 더 직접적으로 반영합니다.
  - severity: low
    issue: ‘유대 사람들’의 용어 선택
    rationale: 가능한 번역이지만, 여기서는 원문의 직접적 대응어이며 현대 한국어 성경 문체에도 자연스러운 ‘유대인들’이 더 적합합니다.
  revised_text: 그 일이 유대인들을 기쁘게 한다는 것을 보고, 그는 베드로도 체포했습니다.[a] 그때는 무교절[b] 기간이었습니다.
  revised_footnotes:
