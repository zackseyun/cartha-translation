  verdict: revise
  source_fidelity: 초안은 사건의 순서와 ‘무교절’이라는 절기 표기를 대체로 보존합니다. 다만 ‘그 일이 유대 사람들의 마음에 든 것’은 ἀρεστόν ἐστιν τοῖς Ἰουδαίοις의 비인칭 ‘유대인들을 기쁘게/좋아하게 하다’ 구문을 다소 부자연스럽고 불명확하게 옮깁니다. 또한 원문의 괄호 속 시간 배경을 괄호로 보존하는 편이 좋습니다.
  naturalness: ‘유대인들이 그것을 좋아한다는 것을 보고’와 ‘체포했습니다’가 현대 표준어 합쇼체 서술에서 자연스럽습니다. 문맥상 주어인 헤롯을 밝혀 한국어 단독 구절로도 명료하게 했습니다.
  terminology: Ἰουδαίοις는 본문에서 ‘유대인들’로 유지합니다. 문맥이 특정 지도자들만을 명시하지 않으므로 그렇게 한정하지 않았습니다. τῶν ἀζύμων은 관련되지만 구별되는 유월절로 바꾸지 않고 ‘무교절’로 옮겼습니다. συλλαβεῖν은 이 문맥에서 ‘체포하다’가 적절합니다.
  issues:
  - severity: medium
    issue: ‘그 일이 유대 사람들의 마음에 든 것’
    rationale: 원문의 비인칭 술어가 가리키는 반응을 어색하게 명사화하며, ‘그 일’의 지시 대상도 단독 구절에서 불명확합니다. ‘그것을 좋아한다’로 고치는 것이 원문의 의미와 한국어 용법에 더 가깝습니다.
  - severity: low
    issue: 괄호의 시간 배경 미보존
    rationale: ἦσαν δὲ ἡμέραι τῶν ἀζύμων은 저자가 삽입한 괄호성 배경 설명이므로 괄호로 표시하는 편이 형식과 기능을 보존합니다.
  revised_text: 헤롯은 유대인들이 그것을 좋아한다는 것을 보고, 베드로도 체포했습니다. (그때는 무교절 기간이었습니다.)
  revised_footnotes:
  - marker: a
    text: 또는 ‘유대 지방 사람들’. 그리스어 ‘유대인들’은 문맥에 따라 이러한 뜻을 가질 수 있으나, 여기서는 본문이 단지 ‘유대인들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 무교병을 먹는 절기 기간을 가리킵니다.
    reason: cultural_note
  revision_rationale: 원문의 시간적 분사(‘보고’), 유대인들의 호의, 베드로를 추가로 체포한 행동, 그리고 무교절이라는 괄호 속 시간 배경을 모두 보존했습니다. ‘헤롯’을 명시해 한국어에서 생길 수 있는 주어의 모호성을 줄였으며, 유대인들의 범위를 지도자들로 축소하지 않았습니다. 제안한 각주는 영어 감사 기록의 어휘적 대안과 문화적 설명을 한국어로 제공하지만, 본문에는 앵커가 없으므로 편집 단계에서 각각 ‘유대인들’과 ‘무교절’ 뒤에 연결해야 합니다.
