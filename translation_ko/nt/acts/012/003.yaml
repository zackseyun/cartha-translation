  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
  footnotes:
  - marker: a
    text: Or "the Judeans" or, by contextual narrowing, "the Jewish leaders." The Greek term can bear these senses in some contexts, but here the text simply says "the Jews."
    reason: lexical_alternative
  - marker: b
    text: That is, the festival period following Passover, marked by the eating of unleavened bread.
    reason: cultural_note
translation:
  language: ko
  text: 그 일이 유대인들을 기쁘게 한다는 것을 보고, 그는 베드로도 체포했습니다.[a] 그때는 무교절[b] 기간이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대 사람들”. 문맥에 따라 “유대 지도자들”로 이해하기도 하지만, 그리스어 본문은 단지 “유대인들”이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 무교절은 누룩 없는 빵을 먹으며 지키는 절기입니다. 유월절과 밀접하게 이어지는 절기 기간을 가리킵니다.
    reason: cultural_note
