  source_fidelity: 원문의 두 명령(띠를 매고, 샌들을 신으라), 베드로의 즉각적인 순종, 이어지는 명령(겉옷을 두르고 따르라)을 충실히 옮겼습니다. δεύτερη 서술동사 λέγει의 역사적 현재는 한국어에서도 현재형 ‘말합니다’로 반영했습니다.
  naturalness: 초안의 ‘신을 신어라’는 ‘샌들’이라는 구체적 대상을 잃고, 명령형 ‘-어라/-오너라’는 요청된 현대 정중체(합쇼체)와 맞지 않습니다. ‘허리띠를 매고 샌들을 신으십시오’ 및 ‘따라오십시오’가 현대 표준 한국어로 자연스럽습니다.
  terminology: ἱμάτιον은 일반 옷보다 바깥에 걸치는 옷을 가리키므로 ‘겉옷’으로 유지했습니다. ζῶσαι는 ‘허리띠를 매고’로, ὑπόδησαι τὰ σανδάλιά σου는 ‘샌들을 신으십시오’로 구체성을 보존했습니다.
