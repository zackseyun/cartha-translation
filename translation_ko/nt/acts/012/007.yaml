review_pass:
  verdict: revise
  source_fidelity: 초안은 사건의 핵심 의미를 대체로 충실히 옮겼습니다. 그러나 καὶ ἰδού에 덧붙인 ‘그런데’는 원문에 없는 역접적 전환을 도입하며, 명령문 ‘일어나거라’는 요구된 현대 합쇼체 높임말 문체와 맞지 않습니다.
  naturalness: ‘쳐서 깨우며 … 하고 말하자’는 동작의 연결이 다소 어색합니다. ‘쳐서 그를 깨우고 말했습니다’로 순서를 분명히 하면 자연스럽습니다. 또한 ‘보십시오’ 뒤의 쉼표와 직접화법의 합쇼체를 사용하면 현대 문어 서술로 매끄럽습니다.
  terminology: ‘주의 천사’, ‘베드로’, ‘감방’, ‘쇠사슬’은 문맥과 원어에 적절합니다. πλευρά는 여기서 ‘옆구리’가 자연스럽고, ἐκ τῶν χειρῶν은 해석을 과도하게 보태지 않고 ‘그의 손에서’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘그런데’가 καὶ ἰδού에 역접 의미를 더합니다.
    rationale: καὶ는 이 문맥에서 단순 접속이며, ἰδού는 주의를 환기합니다. 역접적 ‘그런데’는 원문에 없는 담화 관계를 부여할 수 있습니다.
  - severity: medium
    issue: 천사의 명령 ‘일어나거라’가 합쇼체 요구와 일치하지 않습니다.
    rationale: 대상 번역의 지정 문체가 현대 정중체(합쇼체)이므로 직접화법도 ‘일어나십시오’로 통일하는 것이 적절합니다.
  - severity: low
    issue: ‘쳐서 깨우며 … 하고 말하자’의 연결이 부자연스럽습니다.
    rationale: 원문의 분사 πατάξας는 베드로를 깨운 행위에 선행하거나 수반되는 동작입니다. 한국어에서는 ‘쳐서 그를 깨우고 말했습니다’가 의미 관계를 더 명료하게 드러냅니다.
