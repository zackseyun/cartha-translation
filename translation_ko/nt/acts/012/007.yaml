- from: 그런데 보십시오, 주의 천사가 곁에 서더니 감방 안에 빛이 비쳤습니다. 천사가 베드로의 옆구리를 쳐서 깨우며 「급히 일어나거라」 하고 말하자, 그의 손에서 쇠사슬이 떨어졌습니다.
  to: 보십시오, 주의 천사가 곁에 섰고 감방 안에 빛이 비쳤습니다. 천사가 베드로의 옆구리를 쳐서 그를 깨우고 말했습니다. 「급히 일어나십시오.」 그러자 그의 손에서 쇠사슬이 떨어졌습니다.
