  to: 헤롯은 두로와 시돈 사람들을 몹시 적대하고 있었습니다. 그러나 그들은 한마음으로 헤롯에게 찾아와 왕의 침실을 맡은 관리 블라스도를 설득한 뒤, 평화를 요청하고 있었습니다. 그들의 지방이 왕의 영토에서 양식을 공급받고 있었기 때문이었습니다.
