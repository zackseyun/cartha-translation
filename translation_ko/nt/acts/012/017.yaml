    issue: '''옥'' is archaic in a translation designated as modern standard Korean.'
    rationale: '''감옥'' is the ordinary modern equivalent of φυλακή in this context.'
  - severity: low
    issue: No note accompanies '형제들.'
    rationale: Although '형제들' appropriately represents the Greek masculine plural, the term may contextually encompass the broader body of believers; a concise alternative-rendering note preserves this possibility without altering the main text.
