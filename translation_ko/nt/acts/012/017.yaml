  source_fidelity: 수정이 필요합니다. κατασείσας ... σιγᾶν은 손짓으로 듣는 이들을 조용히 하게 한 행위이며, 현 번역도 대체로 맞지만 ‘시늉’보다 ‘손짓하여’가 원문의 실제 몸짓을 더 자연스럽고 정확히 드러냅니다. ταῦτα는 복수이므로 ‘이 일들을’로 옮기는 것이 적절합니다. 나머지 ‘주’, ‘옥에서 이끌어 내셨는지’, ‘야고보’, ‘다른 곳’은 원문에 충실합니다.
  naturalness: ‘알리시오’는 현대 표준어 합쇼체보다 다소 고풍스럽고 명령조가 강합니다. 현대 정중 문체에는 ‘알리십시오’가 적합합니다. ‘손으로 … 시늉을 한 뒤’도 이해되나, ‘손짓하여 그들을 조용히 하게 한 뒤’가 더 자연스럽습니다.
  terminology: ‘주께서’, ‘옥’, ‘야고보’, ‘형제들’은 적절합니다. ‘형제들’은 원문의 남성 복수 명사를 유지하며, 문맥상 더 넓은 신자 공동체를 가리킬 가능성은 각주로 밝혀 둘 수 있습니다.
  issues:
