translation:
  language: ko
  text: 베드로가 손으로 조용히 하라는 시늉을 한 뒤, 주께서 자기를 옥에서 어떻게 이끌어 내셨는지를 그들에게 설명하였습니다. 그리고 「이 일을 야고보와 형제들에게 알리시오」 하고 말한 뒤에 떠나 다른 곳으로 갔습니다.
  philosophy: optimal-equivalence
