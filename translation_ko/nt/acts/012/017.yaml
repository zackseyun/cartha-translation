  text: 베드로는 그들에게 조용히 하라는 손짓을 하고, 주께서 자기를 감옥에서 어떻게 이끌어 내셨는지를 그들에게 자세히 이야기해 주었습니다. 그리고 “이 일을 야고보와 형제들에게 알리십시오[a]”라고 말하고, 떠나 다른 곳으로 갔습니다.
