    issue: ταῦτα의 복수성이 ‘이 일을’에서 단수로 축소됨
    rationale: 원문은 ‘이 일들/이러한 일들’을 알리라고 명합니다. 한국어에서도 ‘이 일들을’로 자연스럽게 복수를 보존할 수 있습니다.
  - severity: low
    issue: ‘알리시오’가 현대 합쇼체에 비해 고풍스러움
    rationale: 요청된 표준어 현대 정중 문체에는 ‘알리십시오’가 더 자연스럽습니다.
  - severity: low
    issue: ‘손으로 조용히 하라는 시늉’의 표현이 다소 우회적임
    rationale: κατασείσας ... τῇ χειρὶ σιγᾶν은 손짓으로 침묵을 요구한 행위이므로 ‘손짓하여 그들을 조용히 하게 한’이 자연스럽고 의미도 분명합니다.
  revised_text: 베드로는 손짓하여 그들을 조용히 하게 한 뒤, 주께서 자신을 옥에서 어떻게 이끌어 내셨는지 그들에게 이야기하였습니다. 그리고 “이 일들을 야고보와 형제들에게 알리십시오” 하고 말한 뒤, 떠나 다른 곳으로 갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘형제자매들에게’. 그리스어는 ‘형제들’이라고 하며, 문맥에 따라 더 넓은 신자 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 손짓의 기능을 자연스러운 현대 한국어로 명확히 하고, 복수 지시어 ταῦτα를 ‘이 일들을’로 보존했으며, 직접 인용의 명령형을 현대 합쇼체로 조정했습니다. κύριος의 구체적 지시 대상은 본문이 확정하지 않으므로 ‘주’로 그대로 유지했습니다.
