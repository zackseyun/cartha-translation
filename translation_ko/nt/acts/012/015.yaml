  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
  footnotes:
  - marker: a
    text: Or possibly, 'his guardian angel,' 'his representative angel,' or according to some interpreters, 'his spirit/ghost.' The Greek simply says 'his angel.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그녀에게 말하였습니다. “너 미쳤구나.” 그러나 그녀는 그것이 사실이라고 계속 주장하였습니다. 그러자 그들은 “그의 천사입니다.”[a] 하고 계속 말하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 수호천사’, ‘그를 대신하는 천사’로 이해할 수 있으며, 일부 해석자들은 ‘그의 영/유령’으로 보기도 합니다. 그리스어는 단지 ‘그의 천사’라고 말합니다.
    reason: ‘그의 천사’가 가리키는 바에 대해 본문이 설명하지 않으므로, 가능한 해석들을 본문 밖에서 제시하여 모호성을 보존합니다.
