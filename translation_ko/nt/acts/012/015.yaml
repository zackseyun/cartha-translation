revisions:
- from: 사람들이 그 여종에게 말하였습니다. 「너 미쳤구나.」 그러나 여종이 그렇다고 우기자 사람들은 「그것은 그의 천사다」 하고 말하였습니다.
  to: 그들은 그녀에게 말하였습니다. “너 미쳤구나.” 그러나 그녀는 그것이 사실이라고 계속 주장하였습니다. 그러자 그들은 “그의 천사입니다.”[a] 하고 계속 말하였습니다.
  rationale: 원문의 대명사와 병렬 구조를 보존하고, 두 미완료 동사의 반복·지속성을 ‘계속 주장하였습니다’와 ‘계속 말하였습니다’로 반영했습니다. ‘그의 천사’는 직역으로 유지하고, 해석상 논쟁이 있는 의미는 각주로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
