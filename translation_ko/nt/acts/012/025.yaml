review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT reading εἰς Ἰερουσαλήμ with “예루살렘으로 돌아갔습니다” and preserves the associated action of taking John Mark. However, “임무” narrows διακονία to a commission or task; the Greek retains the broader sense of service/ministry. The meaningful εἰς/ἐξ textual variant also needs an anchored footnote.
  naturalness: The sentence is fluent modern standard Korean in formal-polite 합쇼체. “마가라 하는 요한” is understandable, but “마가라고 불리는 요한” more directly and naturally reflects ἐπικληθέντα Μᾶρκον.
  terminology: Render διακονία as “섬김의 일,” which is suitably broad in this relief-service context without importing “구제” into the text. Retain the established names 바나바, 사울, 요한, and 마가.
  issues:
  - severity: medium
    issue: “임무” for διακονία
    rationale: “임무” can imply a specifically assigned mission and is narrower than διακονία (“service/ministry”). “섬김의 일” preserves the lexical breadth and the contextual sense.
  - severity: medium
    issue: The textual variant affecting “예루살렘으로” lacks a footnote anchor.
    rationale: The supplied SBLGNT text reads “to Jerusalem,” but some manuscripts read “from Jerusalem.” Since this changes the direction of travel, it should be documented at the relevant phrase.
  - severity: low
    issue: “마가라 하는” is less direct than the source phrasing.
    rationale: “마가라고 불리는” transparently represents “John who was called Mark” while remaining natural Korean.
