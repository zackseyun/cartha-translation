  terminology: ‘주의 천사’, ‘하나님’, ‘영광을 … 돌리다’는 한국어 성경 문체와 현대적 정중 문체에 모두 적합합니다. ‘주의 천사’는 무관사 원문의 부정적 용법을 불필요하게 특정하지 않습니다.
