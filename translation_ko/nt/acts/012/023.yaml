  source_fidelity: 원문의 παραχρῆμα는 ‘즉시’로, ἐπάταξεν은 결과를 앞당겨 단정하지 않는 ‘쳤습니다’로 옮기는 것이 적절합니다. ἀνθ’ ὧν 이하의 인과관계도 ‘그가 … 않았기 때문입니다’로 충실히 반영됩니다. 다만 γενόμενος σκωληκόβρωτος는 단순히 ‘벌레에 먹혀’라기보다 ‘벌레에 먹히게 되어/벌레에 먹힌 상태가 되어’라는 상태 변화의 분사이므로 이를 드러내는 편이 더 정확합니다.
