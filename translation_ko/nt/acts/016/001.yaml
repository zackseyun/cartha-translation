  to: 바울은 또 더베에도 이르고 루스드라에도 이르렀습니다. 보십시오, 거기에 디모데라 하는 한 제자가 있었는데, 그는 믿는 유대인 여자의 아들이요, 그의 아버지는 헬라인이었습니다.
