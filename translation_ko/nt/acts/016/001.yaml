    issue: δὲ καὶ의 첨가 의미가 명시되지 않았습니다.
    rationale: '''바울이 더베와 루스드라에도 이르렀습니다''의 ''-에도''는 두 지명 모두에 대한 첨가라기보다 루스드라에만 붙는 형태로 읽힐 수 있으며, 원문의 ''also''에 해당하는 서술적 첨가도 명료하지 않습니다.'
  - severity: low
