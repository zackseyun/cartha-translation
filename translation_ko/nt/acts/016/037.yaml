  source_fidelity: 핵심 법적 항의와 문장 흐름은 대체로 충실합니다. 다만 Ῥωμαίους의 법적 신분을 단순한 ‘로마인’보다 ‘로마 시민’으로 옮기는 것이 문맥과 원문의 뜻을 더 정확히 드러냅니다. ἀκατακρίτους는 본문에서 ‘재판도 없이’로 자연스럽게 번역하되, ‘유죄 판결도 받지 않고’라는 직역적 대안을 주석으로 보완할 수 있습니다.
  naturalness: ‘그러나 바울이 그들에게 말하기를 … 하였습니다’는 현대 표준어 합쇼체 서술에서 다소 문어적이고 무겁습니다. ‘바울은 그들에게 말하였습니다’가 더 자연스럽습니다. 또한 ‘그것은 안 됩니다’보다 ‘절대로 안 됩니다’가 οὐ γάρ의 단호한 거절을 더 잘 살립니다.
  terminology: ‘로마 시민’은 이 구절의 법적·시민권적 호소를 정확히 반영합니다. ‘감옥’은 ‘옥’보다 현대 표준어에서 자연스럽고, ‘데리고 나가게 하십시오’는 ἐξαγαγέτωσαν의 직접적인 요구를 보존합니다.
  issues:
  - severity: medium
    issue: ‘로마인’이 시민권이라는 법적 의미를 충분히 드러내지 못함
    rationale: ἀνθρώπους Ῥωμαίους ὑπάρχοντας는 이 문맥에서 로마 시민 신분 및 그에 따른 법적 보호를 근거로 한 항의입니다. ‘로마 시민’이 한국어에서 그 기능을 명확히 전달합니다.
