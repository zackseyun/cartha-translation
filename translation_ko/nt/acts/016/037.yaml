  to: 그러나 바울은 그들에게 말하였습니다. “그들이 로마 시민인 우리를 재판도 없이[a] 공개적으로 매질하고 감옥에 가두어 놓고, 이제는 우리를 몰래 내보내려 합니까? 절대로 안 됩니다. 그들이 직접 와서 우리를 데리고 나가게 하십시오.[b]”
  rationale: ‘로마인’을 ‘로마 시민’으로 고쳐 원문의 법적 호소를 분명히 했고, 서술 도입과 부정 표현을 현대 표준어 합쇼체에 맞게 다듬었습니다. ‘재판도 없이’는 영어 감사 기록의 선택을 따르되 직역적 대안을 주석에 보존했으며, 출옥을 직접 요구하는 동사의 대안도 주석으로 제시했습니다.
