base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
  footnotes:
  - marker: a
    text: Or “praetors,” the Roman civic officials in a colony such as Philippi.
    reason: cultural_note
  - marker: b
    text: Or “Judeans.” The Greek term can refer either to Jews generally or to people from Judea; here “Jews” best fits the ethnic-religious accusation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 행정관들[a] 앞으로 데려가서 말했습니다. “이 사람들은 유대인으로서 우리 도시를[b] 소란스럽게 하고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “법무관들.” 빌립보와 같은 로마 식민도시에서 이 말은 로마의 도시 행정관들을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 “우리의 도시.” 그리스어는 고발자들이 자기 도시라고 강조하는 뉘앙스를 담고 있습니다.
    reason: translation_note
