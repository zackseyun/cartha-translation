  to: 그들이 그들에게 와서 그들을 달래고, 그들을 데리고 나간 뒤 그 도시를 떠나 달라고 계속 요청하였습니다.
  rationale: 원문에 없는 명시적 사과를 제거하고, παρακαλέω의 문맥상 회유적 의미를 ‘달래고’로 옮겼습니다. 이어지는 ἐξαγαγόντες의 선행 동작과 ἠρώτων의 미완료적 요청을 각각 ‘데리고 나간 뒤’와 ‘계속 요청하였습니다’로 반영했습니다.
