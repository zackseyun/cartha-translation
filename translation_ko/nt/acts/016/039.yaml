review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘사과하고’는 παρακαλέω의 가능한 문맥상 완화·회유의 뉘앙스를 넘어, 원문에 명시되지 않은 사과 행위를 단정합니다. 또한 ἠρώτων은 미완료형이므로 지속·반복의 요청을 자연스럽게 반영하는 것이 좋습니다.
  naturalness: ‘그들에게 와서’와 ‘데리고 나간 뒤’는 현대 표준 한국어에서 자연스럽고, 합쇼체 문체에도 맞습니다. ‘그 도시’는 본문의 정관성을 무리 없이 살립니다.
  terminology: παρεκάλεσαν은 이 문맥에서 ‘달래고’로 옮겨 관리들이 바울과 실라를 회유·무마하려 한 어감을 나타냈습니다. ἠρώτων은 ‘계속 요청하였습니다’로, 앞 동사와 구별하면서 미완료의 진행·반복 가능성을 반영했습니다.
  issues:
  - severity: medium
    issue: ‘사과하고’
    rationale: παρεκαλέσαν은 ‘권하다, 간청하다, 달래다/위로하다’ 등의 뜻을 지니지만, ‘사과하다’라는 명시적 행위를 뜻하지는 않습니다. 문맥상 사과에 가까운 태도일 수 있어도 번역문에서 이를 단정하면 원문보다 의미가 좁아집니다.
  - severity: low
    issue: ἠρώτων의 미완료상 미반영
    rationale: ‘청하였습니다’도 기본 의미는 전달하지만, 미완료형이 시사하는 계속되거나 거듭된 요청을 ‘계속 요청하였습니다’로 안전하게 드러낼 수 있습니다.
  revised_text: 그들이 그들에게 와서 그들을 달래고, 그들을 데리고 나간 뒤 그 도시를 떠나 달라고 계속 요청하였습니다.
