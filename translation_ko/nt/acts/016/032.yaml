  to: 그리고 그들은 그와 그의 집에 있는 모든 사람에게 주님의 말씀을 말해 주었습니다.
  rationale: The revision removes the added causal implication of ‘그래서,’ renders the neutral verbal force of ἐλάλησαν with ‘말해 주었습니다,’ and retains a natural Korean construction in which the man and all those in his house are included as the recipients. No footnote is needed, since ‘주님의 말씀’ preserves rather than resolves the possible nuances of the genitive.
