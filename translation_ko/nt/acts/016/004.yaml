  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 '전달하여 지키게 하였습니다'는 παραδιδόναι ... φυλάσσειν의 '지키도록 전달하다'보다 사도 일행이 직접 복종을 강제했다는 인상을 약간 더 줄 수 있습니다. 이를 목적 표현으로 조정합니다.
  naturalness: 합쇼체 서술로 자연스럽습니다. '여러 도시를 다니면서'와 '지키도록 전달했습니다'는 현대 표준 한국어에서 매끄럽고, 반복되는 목적어는 생략해도 의미가 분명합니다.
  terminology: δόγματα는 예루살렘 회의의 공식 결정이라는 문맥을 반영하여 '결의들'로 옮기고, '결정들'이라는 대안을 각주로 제시합니다. ἀπόστολοι와 πρεσβύτεροι는 각각 '사도들', '장로들'로 유지합니다.
