  to: 그들이 여러 도시를 다니면서, 예루살렘에 있는 사도들과 장로들이 결정한 결의들[a]을 그들에게 지키도록 전달했습니다.
  rationale: 원문의 진행 중인 이동(διεπορεύοντο), 공식 결정의 전달(παρεδίδοσαν), 그리고 그 결정들을 준수하게 하는 목적(φυλάσσειν)을 한국어 문장 구조에서 자연스럽게 보존했습니다. '결의들'은 δόγματα의 공식성과 공동체적 결정이라는 문맥을 반영하되, 후대의 기술적 교리 용어를 강요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T09:33:01Z'
