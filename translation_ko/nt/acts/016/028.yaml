  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 직접 발화 구조와 긴급한 외침을 더 자연스럽고 분명하게 드러내는 것이 좋습니다. 「아무 해도」는 μηδὲν ... κακόν의 폭넓은 표현을 적절히 보존합니다.
  naturalness: 초안의 「외쳐 말하기를, … 하였습니다」는 현대 표준 한국어 합쇼체에서 다소 문어적이고 어색합니다. 「큰 소리로 외쳤습니다」 뒤에 직접 인용을 두면 자연스럽습니다. 「해를 입히다」보다 이 문맥에서는 「해를 끼치다」가 더 자연스러운 결합입니다.
  terminology: 「바울」은 표준적인 인명 표기이며, 「우리」와 「모두」는 ἅπαντες의 총칭을 충실히 반영합니다. 신학 용어 관련 문제는 없습니다.
  issues:
  - severity: low
    issue: 서술 인용 구조의 부자연스러움
    rationale: 「바울이 큰 소리로 외쳐 말하기를, … 하였습니다」는 직접 인용과 간접 인용이 혼합된 듯한 구조입니다. 원문의 외침과 발화 내용을 한국어 직접 인용으로 분명히 제시하는 편이 자연스럽습니다.
  - severity: low
    issue: 「자신에게 아무 해도 입히지 마십시오」의 어휘 결합
    rationale: 의미는 통하지만, 자신에게 위해를 가하는 문맥에서는 「자신에게 아무 해도 끼치지 마십시오」가 현대 한국어에서 더 자연스럽습니다.
  revised_text: 바울이 큰 소리로 외쳤습니다. “자신에게 아무 해도 끼치지 마십시오. 우리는 모두 여기 있습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “자신을 해치지 마십시오.” 그리스어 표현은 문자적으로 “자신에게 아무 나쁜 일도 하지 마십시오”라는 더 넓은 뜻이지만, 문맥에서는 간수가 자신을 해치려 한 일을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 원문의 ἐφώνησεν과 φωνῇ μεγάλῃ를 「큰 소리로 외쳤습니다」로 자연스럽게 옮기고, λέγων이 도입하는 직접 발화를 명료하게 처리했습니다. 「아무 해도 끼치지 마십시오」는 κακόν의 일반성을 유지하면서도 문맥상 의도된 자해를 암시합니다. 각주에서 더 간결한 대안과 원문의 폭넓은 표현을 밝혔습니다.
