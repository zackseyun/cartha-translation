  source_fidelity: 초안은 προαγαγὼν αὐτοὺς ἔξω와 τί με δεῖ ποιεῖν의 기본 뜻을 대체로 전달하지만, Κύριοι를 ‘선생들이여’로 옮긴 것은 문맥상의 공손한 호칭을 교사·스승이라는 직함으로 한정하여 부정확합니다. 또한 ἵνα σωθῶ의 목적절과 수동 표현은 ‘구원을 받으려면’으로 더 직접적으로 반영하는 편이 좋습니다.
  naturalness: ‘그들을 밖으로 데리고 나가 말하기를’보다 ‘그들을 밖으로 데리고 나간 뒤에 말했습니다’가 현대 표준 한국어 합쇼체 서술에서 자연스럽습니다. 인용문의 ‘제가 … 해야 합니까?’도 자연스럽고 공손한 문체입니다.
  terminology: Κύριοι는 여기서 신적 칭호 ‘주님’이 아니라 바울과 실라에게 하는 공손한 사회적 호칭입니다. ‘선생님들’은 현대 한국어에서 자연스러운 존칭이며, 특정 교사 직함이나 신적 칭호로 읽힐 가능성은 문맥상 낮습니다. σωθῶ는 문맥과 다음 절을 고려하여 ‘구원을 받다’로 유지합니다.
  issues:
