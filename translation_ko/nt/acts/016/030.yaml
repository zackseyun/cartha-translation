    issue: ‘선생들이여’
    rationale: Κύριοι는 이 문맥에서 공손한 호칭이지 ‘교사들’이라는 직함이 아닙니다. 또한 ‘선생들이여’는 현대 합쇼체 성경 문장으로 다소 문어적이고 부자연스럽습니다.
  - severity: low
    issue: ‘내가 어떻게 해야 구원을 받겠습니까?’
    rationale: 의미는 대체로 맞지만, τί με δεῖ ποιεῖν ἵνα σωθῶ의 ‘무엇을 해야 … 받는가’와 목적 관계를 ‘제가 구원을 받으려면 무엇을 해야 합니까?’로 옮기면 더 직접적이고 자연스럽습니다.
