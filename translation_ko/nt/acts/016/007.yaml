  rationale: 문장은 δέ의 완만한 전환을 「그런데」로, ἐλθόντες의 시간적 용법을 「이르렀을 때」로, ἐπείραζον의 미완료적 시도를 「들어가려고 하고 있었습니다」로 반영했습니다. 「예수의 영」은 원문의 비통상적 그리스도론적 표현을 그대로 유지했습니다. ἐάω는 한국어 문법에 맞게 행위절을 목적어로 풀었으며, 무시아 관련 지리적 여지는 각주로 보존했습니다.
