  source_fidelity: ‘행정관들’ accurately renders στρατηγοί in this colonial civic setting, and ‘날이 밝자’ suitably conveys the temporal genitive absolute. However, ‘호위병들’ does not represent ῥαβδούχους, which specifically denotes the magistrates’ rod-bearing official attendants.
