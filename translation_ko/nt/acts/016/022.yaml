  verdict: revise
  source_fidelity: 초안은 무리의 집단적 적대 행동, 행정관들의 명령, 그리고 구타라는 기본 뜻을 대체로 전달합니다. 그러나 ῥαβδίζειν은 막대기/회초리로 때리는 형벌을 가리키므로 일반적인 ‘매’보다 구체화할 필요가 있습니다. 또한 αὐτῶν τὰ ἱμάτια의 ‘그들’은 문맥상 바울과 실라를 가리키지만, 한국어 초안에서는 바로 앞 주어인 행정관들의 옷으로 읽힐 여지가 있습니다. 미완료 과거 ἐκέλευον의 진행적 뉘앙스도 반영하는 편이 좋습니다.
  naturalness: ‘무리가 함께 일어나 그들을 대적하니’는 자연스럽지만, 현대 한국어 서술에서는 ‘대적하였고’가 문장 연결에 더 매끄럽습니다. ‘옷을 찢어 벗긴 뒤’와 ‘막대기로 때리라고 명령하고 있었습니다’는 공적 사법 장면에 맞는 현대적 합쇼체입니다.
  terminology: στρατηγοί는 ‘행정관들’로 옮길 수 있으며, 빌립보의 로마 식민도시의 시민 행정관이라는 배경은 주석으로 보완할 수 있습니다. ῥαβδίζειν은 ‘막대기로 때리다’로 옮겨 채찍질과 구별했습니다.
  issues:
  - severity: medium
    issue: ‘매로 치라고’는 ῥαβδίζειν의 도구인 막대기/회초리를 명시하지 않습니다.
    rationale: 이 동사는 막대기로 구타하는 형벌을 뜻하므로, 일반적 ‘매’는 원문의 구체성을 약화시킬 수 있습니다.
  - severity: medium
    issue: ‘그들의 옷’의 지시 대상이 한국어 문장에서는 행정관들로 오해될 수 있습니다.
    rationale: 그리스어 문맥상 옷은 바울과 실라의 옷입니다. 각주로 지시 대상을 밝혀 모호성을 해소할 수 있습니다.
  - severity: low
    issue: ‘명령하였습니다’는 ἐκέλευον의 미완료 과거의 진행성을 충분히 드러내지 않습니다.
    rationale: ‘명령하고 있었습니다’는 장면 전개의 지속적 명령을 자연스럽게 반영합니다.
  revised_text: 무리가 함께 일어나 그들을 대적하였고, 행정관들은 그들의[a] 옷을 찢어 벗긴 뒤 막대기로 때리라고 명령하고 있었습니다.
  revised_footnotes:
  - marker: a
    text: ‘그들’은 문맥상 바울과 실라를 가리킵니다.
    reason: referent_clarification
  - marker: b
    text: ‘행정관들’은 빌립보의 로마 시민 행정관들을 가리킵니다. 더 기술적으로는 ‘프라이토르들’로도 옮길 수 있습니다.
    reason: cultural_note
  revision_rationale: 막대기 구타라는 형벌의 구체성을 회복하고, 옷의 소유자가 바울과 실라임을 각주로 명확히 했으며, 미완료 과거의 진행성을 반영했습니다. 본문에 불필요한 역사 정보를 추가하지 않고 각주로 보완했습니다.
