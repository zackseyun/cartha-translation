  source_fidelity: 개정이 필요합니다. περιρήξαντες αὐτῶν τὰ ἱμάτια는 관리들이 바울과 실라의 옷을 벗겨 내는 행위를 가리키는데, 초안의 ‘그들의 옷을 찢고’는 옷 자체를 찢었다는 뜻으로 읽히며 벗김의 의미를 충분히 전달하지 못합니다. ῥαβδίζειν도 ‘매’보다 막대기로 때리는 형벌을 분명히 하는 표현이 적절합니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. 다만 ‘옷을 벗긴 뒤’와 ‘몽둥이로 치라’가 현대 표준어에서 더 명확하고 자연스럽습니다.
  terminology: ‘행정관들’은 빌립보의 로마 도시 행정·사법 관리를 가리키는 στρατηγοί의 무난한 번역입니다. ‘몽둥이로 치다’는 ῥαβδίζειν의 막대기 형벌을 구체적으로 보존합니다.
  issues:
  - severity: medium
    issue: ‘그들의 옷을 찢고’
    rationale: 그리스어는 옷을 찢어 훼손했다기보다 그들에게서 옷을 벗겨 내었다는 뜻입니다. 또한 한국어 표현은 소유자와 행위자가 다소 불분명합니다.
  - severity: medium
    issue: ‘매로 치라고’
    rationale: ‘매’는 채찍이나 회초리 등 넓은 도구를 가리킬 수 있습니다. ῥαβδίζειν의 ‘막대기/몽둥이로 때리다’라는 의미를 더 직접적으로 옮기는 편이 좋습니다.
  revised_text: 그러자 무리가 함께 일어나 그들을 대적하였습니다. 행정관들은 그들의 옷을 벗긴 뒤, 그들을 몽둥이로 치라고 명령하였습니다.
  revised_footnotes: []
  revision_rationale: 원문의 집단적 적대 행동, 행정관들의 옷 벗김, 그리고 막대기로 때리라는 명령을 현대 한국어 합쇼체로 명확하게 옮겼습니다. 원문에 없는 인명이나 해석을 덧붙이지 않았습니다.
