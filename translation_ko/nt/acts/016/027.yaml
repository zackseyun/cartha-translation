    rationale: ‘감옥 문들’ is clearer and more standard in contemporary formal Korean.
  - severity: low
    issue: The draft orders the supposition before drawing the sword.
    rationale: The Greek presents ‘drew the sword’ before the main clause and its explanatory participle. Reordering improves correspondence without changing meaning.
