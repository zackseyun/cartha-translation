  terminology: ‘간수,’ ‘죄수들,’ ‘칼,’ and ‘자결’ are suitable contextual renderings. ‘자결’ is a concise formal rendering of ἑαυτὸν ἀναιρεῖν in this context, without adding a motive or doctrinal interpretation.
