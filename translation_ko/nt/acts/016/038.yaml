  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
  footnotes:
  - marker: a
    text: Or 'Roman citizens.' The Greek says 'Romans,' but in this legal context the point is their protected civic status.
    reason: lexical_alternative
  - marker: b
    text: '''Rod-bearers'' refers to the magistrates'' attendants, traditionally called ''lictors.'''
    reason: cultural_note
  - marker: c
    text: '''Magistrates'' translates στρατηγοί, the leading civic officials in Philippi.'
    reason: cultural_note
translation:
  language: ko
  text: 막대기를 든 수행원들이 이 말을 행정관들에게[a] 보고하니, 행정관들은 그 사람들이 로마인이라는 말을 듣고 두려워하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘행정관들’은 그리스어 스트라테고이(στρατηγοί)로, 빌립보의 주요 시민 행정관들을 가리킵니다. ‘막대기를 든 수행원들’은 그 행정관들을 보좌하며 막대기를 권위의 표지로 지닌 사람들을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 그리스어는 문자적으로 ‘로마인들’이라고 합니다. 이 법적 상황에서는 로마 시민으로서의 보호된 지위가 함축됩니다.
    reason: lexical_alternative
