translation:
  language: ko
  text: 그 여종은 바울과 우리를 계속 따라다니며 외쳤습니다. “이 사람들은 지극히 높으신 하나님의 종들이며, 여러분에게 구원의 길을 전하고 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου
  english_pob_choice: slaves of the Most High God
  chosen_korean: 지극히 높으신 하나님의 종들
  alternatives_korean:
  - 지극히 높으신 하나님의 노예들
  lexicon: BDAG
  rationale: 본 본문은 점치는 영의 입을 통한 외침이며, 신약 일반의 「하나님의 종」 칭호 용법(서신서적 인사 정형이 아님)이므로 「종」으로 옮긴다.
