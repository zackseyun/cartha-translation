  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
  footnotes:
  - marker: a
    text: Or “during the night” or “by night.”
    reason: lexical_alternative
  - marker: b
    text: Or “a man of Macedonia.”
    reason: lexical_alternative
  - marker: c
    text: Greek “crossing over into Macedonia, help us”; the English “Come over” conveys the idiomatic force of the participle with the imperative.
    reason: lexical_alternative
