  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 믿는 사람’ 또는 ‘주님께 믿을 만한 사람’.
    reason: πιστή는 문맥상 ‘신실한,’ ‘믿는,’ 또는 ‘믿을 만한’이라는 뜻을 가질 수 있다.
