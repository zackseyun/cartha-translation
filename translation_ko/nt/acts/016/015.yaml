    text: 또는 ‘주님을 믿는 사람’ 또는 ‘주님께 믿을 만한 사람’.
    reason: πιστή는 문맥상 ‘신실한,’ ‘믿는,’ 또는 ‘믿을 만한’이라는 뜻을 가질 수 있다.
  revision_rationale: 'Temporal ὡς is rendered as ''받았을 때에,'' and the two verbs describing Lydia''s appeal are represented distinctly: she earnestly urged the group and ultimately prevailed on them. The revision uses modern formal narrative Korean, keeps the household-baptism statement neutral, and adds a footnote at πιστή to preserve its lexical ambiguity.'
