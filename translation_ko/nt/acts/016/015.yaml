review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys baptism, the household, lodging in Lydia's dwelling, and her successful insistence. However, '받은 후에' narrows ὡς to a completed-after sequence rather than its ordinary temporal force ('when'), and '청하여 말하기를' does not adequately represent her earnest urging. The lexical breadth of πιστή should be retained with a note.
  naturalness: The wording is understandable but stiff and dated in places, especially '그가 우리에게 청하여 말하기를' and '주께 신실한 자로 여기시거든.' A direct narrative construction and '신실한 사람으로 여기신다면' are natural in contemporary formal Korean.
  terminology: '''세례'' is an appropriate established Korean biblical term. ''주님'' appropriately renders κύριος in this context. ''신실한 사람'' is suitable for πιστή, provided a note preserves the possible sense ''believing'' or ''trustworthy.'''
  issues:
  - severity: medium
    issue: '''세례를 받은 후에'' for ὡς δὲ'
    rationale: ὡς is temporal ('when/as'), not explicitly sequential 'after.' '받았을 때' preserves the source more closely.
  - severity: medium
    issue: '''청하여 말하기를'' for παρεκάλεσεν λέγουσα'
    rationale: The expression is awkward in modern Korean and weakens the earnest invitational force of παρεκάλεσεν. '간청하며 말했습니다' is natural and retains the force.
  - severity: low
    issue: '''주께 신실한 자로 여기시거든'''
    rationale: This is literary and somewhat unnatural for the requested modern formal-polite register. '주님께 신실한 사람으로 여기신다면' is clearer while preserving the perfect assessment and conditional appeal.
  - severity: low
    issue: No note for πιστή
    rationale: πιστή can carry the senses faithful, believing, or trustworthy. A brief note prevents the Korean rendering from unnecessarily resolving that lexical ambiguity.
  revised_text: 루디아와 그의 집안이 세례를 받았을 때에, 루디아가 우리에게 간청하며 말했습니다. 「여러분이 나를 주님께 신실한 사람으로 여기신다면[a], 제 집에 들어와 머무르십시오.」 그리고 그는 우리를 강권했습니다.
  revised_footnotes:
