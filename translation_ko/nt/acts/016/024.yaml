  terminology: ‘간수’, ‘명령’, ‘차꼬’는 적절합니다. ξύλον은 문자적으로 나무/나무 기구이나, 이 문맥에서는 발을 고정하는 나무 구속 기구를 뜻하므로 ‘차꼬’가 자연스럽습니다.
