translation:
  language: ko
  text: 두아디라 출신으로 자색 옷감을 파는, 하나님을 경외하는 루디아라 하는 한 여자가 듣고 있었습니다. 주께서 그 여자의 마음을 여시어 바울이 말하고 있는 것들에 주의를 기울이게 하셨습니다.
  philosophy: optimal-equivalence
