  source_fidelity: 초안은 루디아의 출신, 자색 옷감 거래, 하나님에 대한 경외, 듣고 있던 행위, 주께서 마음을 여신 일, 그리고 바울의 말에 주의를 기울이게 된 결과를 대체로 충실히 옮깁니다. 그러나 τις의 부정·도입적 뉘앙스가 빠졌고, λαλουμένοις의 진행 중인 발화를 더 직접적으로 반영하는 편이 좋습니다.
  naturalness: 문장은 전반적으로 자연스럽고 합쇼체도 적절합니다. 다만 여성인 루디아를 가리키는 ‘그의 마음’은 현대 표준어에서 성별 지시가 다소 불분명할 수 있으므로 ‘그 여자의 마음’으로 명료하게 하는 것이 좋습니다. ‘자색 옷감을 파는’은 ‘자색 옷감 장수’보다 문맥 안에서 더 자연스럽습니다.
  terminology: ‘하나님을 경외하는’은 σεβομένη τὸν θεόν을 적절히 보존하며, 이를 고정된 사회·종교 집단 명칭으로 단정하지 않습니다. κύριος는 원문의 열린 지시를 유지하여 ‘주’로 번역했습니다. ‘두아디라’와 ‘루디아’의 음역도 적절합니다.
  issues:
