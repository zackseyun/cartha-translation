  text: 두아디라 도시 출신으로 자색 옷감 장수이며 하나님을 경외하는 루디아라는 여자가 듣고 있었는데, 주께서 그의 마음을 여시어 바울이 말한 것에 귀를 기울이게 하셨습니다.
  philosophy: optimal-equivalence
