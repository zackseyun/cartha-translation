    rationale: 루디아를 가리키는 여성 소유 표현에는 ‘그녀의 마음’이 자연스럽고 명확합니다.
  - severity: low
    issue: τις와 λαλουμένοις의 의미 요소가 일부 약화됨
    rationale: 초안에는 ‘한’이 없고 ‘바울이 말한 것’은 현재 진행 중인 수동 복수분사 τοῖς λαλουμένοις의 뉘앙스를 충분히 드러내지 못합니다.
  revised_text: 두아디라 시 출신으로 자색 옷감을 파는, 하나님을 섬기던 루디아라는 한 여자가 듣고 있었습니다. 주께서 그녀의 마음을 여셔서 바울이 말하고 있던 것들에 귀를 기울이게 하셨습니다.
  revised_footnotes:
