  source_fidelity: 개정안은 τις의 도입성(‘한 여자’)과 ἤκουεν의 미완료상(‘듣고 있었습니다’)을 보존합니다. 또한 τοῖς λαλουμένοις의 복수·진행 표현을 ‘바울이 말하고 있던 것들’로 옮겨 원문보다 단순화된 초안의 표현을 보완합니다. κύριος는 ‘주’로만 옮겨 지시 대상을 불필요하게 특정하지 않았습니다.
  naturalness: 초안의 ‘그의 마음’은 현대 한국어에서 남성으로도 읽힐 수 있으므로 ‘그녀의 마음’으로 고쳤습니다. ‘두아디라 도시 출신으로 자색 옷감 장수이며’보다 ‘두아디라 시 출신으로 자색 옷감을 파는’이 자연스럽고 수식 관계가 분명합니다.
  terminology: σεβομένη τὸν θεόν은 본문에서 자연스러운 ‘하나님을 섬기던’으로 옮기고, ‘하나님을 경외하는 사람’이라는 대안 및 이 표현의 가능한 사회·종교적 함의를 각주에 남겼습니다. πορφυρόπωλις는 옷감에 한정되지 않을 수 있으나, 영어 POB의 ‘purple cloth’ 결정을 따라 ‘자색 옷감’을 유지했습니다.
  issues:
