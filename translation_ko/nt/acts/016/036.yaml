  source_fidelity: 초안의 ‘사람을 보내어’는 ἀπέσταλκαν에 없는 목적어(사람)를 보충하여, 관리들이 사람을 파견했다는 뜻으로 바꿉니다. 원문은 석방하라는 전달/명령을 보냈다는 뜻이며, 그 전달 수단은 명시하지 않습니다. 또한 복수형 ἀπολυθῆτε를 ‘여러분’으로 옮긴 점과 ‘평안히 가십시오’는 적절합니다.
  naturalness: ‘이 말을 전하여 말하기를’은 같은 의미의 동작을 겹쳐 현대 한국어 문장으로 부자연스럽습니다. 문장을 나누어 직접 인용을 도입하면 간결하고 자연스럽습니다.
  terminology: δεσμοφύλαξ는 ‘간수’, στρατηγοί는 문맥상 ‘행정관들’로 적절합니다. ἀπολυθῆτε는 구금에서의 해제를 가리키므로 ‘석방하다’가 분명합니다.
