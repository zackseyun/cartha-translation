base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
  footnotes:
  - marker: a
    text: Or 'where we thought there was prayer.' The Greek word can refer either to prayer itself or to a place set apart for prayer; the context here favors 'place of prayer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 안식일에 우리는 성문 밖, 기도하는 곳[a]이 있으리라고 생각한 강가로 나갔습니다. 그리고 앉아서 그곳에 모여 있던 여인들에게 이야기하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기도가 있으리라고.’ 헬라어 προσευχή는 기도 자체를 가리킬 수도 있고, 기도를 위해 마련된 장소를 가리킬 수도 있습니다. 여기서는 문맥상 ‘기도하는 곳’이 더 알맞습니다.
    reason: lexical_alternative
