  terminology: ἔθη는 ‘관습’, παραδέχεσθαι는 ‘받아들이다’, ποιεῖν은 ‘행하다’로 옮기는 것이 적절합니다. ‘허용되지 않는’은 고발자들이 주장하는 법적·시민적 금지를 표현하며, 그 주장의 사실 여부를 확정하지 않습니다.
