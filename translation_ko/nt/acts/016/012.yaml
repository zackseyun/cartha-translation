id: ACT.16.12
reference: Acts 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
  footnotes:
  - marker: a
    text: Or 'the first city of the district of Macedonia.' The Greek phrase is difficult, and 'first' may refer to rank, prominence, or sequence.
    reason: alternative_reading
  - marker: b
    text: That is, a Roman colony, a city granted special status under Roman rule.
    reason: cultural_note
translation:
  language: ko
  text: 그곳에서 마케도니아 지역의 주요 도시[가]이며 로마 식민 도시[나]인 빌립보로 갔습니다. 우리는 이 도시에서 며칠 동안 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 또는 ‘마케도니아 지역의 첫째 도시’. 그리스어 표현은 해석하기 어렵습니다. ‘첫째’는 순서, 지위, 또는 중요성을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: 나
    text: 곧 로마의 식민 도시로서, 로마의 통치 아래 특별한 지위를 부여받은 도시를 말합니다.
    reason: cultural_note
