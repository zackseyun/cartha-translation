revisions:
- from: 그 여종이 여러 날 동안 이렇게 하였습니다. 바울이 심히 괴로워하여 영을 돌이켜 말하기를, 「내가 예수 메시아의 이름으로 네게 명령하노니 그에게서 나오라」 하니, 곧 그 시간에 나왔습니다.
  to: 그 여종은 여러 날 동안 계속 이렇게 하였습니다. 그러나 바울은 몹시 괴로워하여 그 영을 향하여 돌아서서 말하였습니다. “내가 예수 메시아의 이름으로 네게 명령하니, 그 여종에게서 나오라.” 그러자 그 영은 바로 그때에 나왔습니다.
  rationale: 바울이 영을 향해 돌아서서 말한 행동을 명료하게 하고, 명령의 대상과 떠난 주체가 모두 영임을 분명히 했습니다. 원문에 없는 영의 성격은 덧붙이지 않았으며, 미완료의 반복성과 즉각적인 결과도 보존했습니다.
