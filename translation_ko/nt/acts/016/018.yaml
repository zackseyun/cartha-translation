  source_fidelity: 개정이 필요합니다. 초안의 ‘영을 돌이켜’는 ἐπιστρέψας τῷ πνεύματι(그 영을 향하여 돌아서서/그 영에게)의 관계를 한국어로 자연스럽게 나타내지 못합니다. 또한 마지막 ‘나왔습니다’의 주체는 영이므로 이를 명시하는 편이 원문의 지시 관계를 정확히 보존합니다.
  naturalness: ‘그 영을 향하여 돌아서서 그 영에게 말하였습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 인용문 안의 직접 명령도 명료합니다. ‘계속 이렇게 하였습니다’는 미완료 과거의 반복성을 반영합니다.
  terminology: πνεῦμα는 원문처럼 ‘영’으로 유지하고 악한 영이나 귀신으로 확대하지 않았습니다. Ἰησοῦ Χριστοῦ는 프로젝트의 용어 방침 및 영어 감사 기록에 따라 ‘예수 메시아’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘영을 돌이켜 말하기를’의 문법적·의미적 연결이 부자연스럽습니다.
    rationale: ἐπιστρέψας는 바울이 방향을 돌린 것을, τῷ πνεύματι는 그 발화의 상대를 나타냅니다. 초안은 ‘영을 돌이키다’처럼 읽혀 원문의 관계를 흐립니다.
  - severity: medium
    issue: 마지막 문장에서 나온 주체가 명시되지 않았습니다.
    rationale: ἐξῆλθεν의 문법적 주어는 앞서 말을 들은 영입니다. 한국어에서는 ‘그 영이’라고 밝혀야 여종이 나온 것으로 오해되지 않습니다.
  - severity: low
    issue: ‘여러 날 동안 이렇게 하였습니다’가 미완료의 반복·지속성을 충분히 드러내지 않습니다.
    rationale: ἐποίει의 미완료상은 ‘계속 이렇게 하였습니다’로 더 분명하게 표현할 수 있습니다.
