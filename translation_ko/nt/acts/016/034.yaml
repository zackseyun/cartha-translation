  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
  footnotes:
  - marker: a
    text: Or 'he set a table before them'; the Greek idiom refers to providing a meal.
    reason: lexical_alternative
  - marker: b
    text: The Greek can also be understood to emphasize that the rejoicing involved his entire household; some take the clause to imply the household also shared in the believing.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그들을 자기 집으로 데리고 올라가 그들 앞에 음식을 차려 주고, 하나님을 믿은 뒤 온 집안과 함께 크게 기뻐하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어의 ‘온 집안과 함께’는 온 집안이 기뻐함에 함께했음을 나타냅니다. 일부는 온 집안도 믿음에 참여했다는 뜻으로 이해하지만, ‘믿은’에 해당하는 분사는 단수이므로 가장 직접적으로는 간수를 가리킵니다.
    reason: alternative_reading
