  source_fidelity: 개정문은 τοῦτον을 문맥상 선행 인물인 디모데를 가리키는 대명사 ‘그’로, σὺν αὐτῷ ἐξελθεῖν을 ‘자기와 함께 떠나다’로 옮깁니다. λαβών의 선행 동작은 ‘그를 데려다가’로, περιέτεμεν의 직접 목적은 자연스러운 한국어 표현인 ‘그에게 할례를 행하였다’로 분명히 했습니다. διὰ τοὺς Ἰουδαίους와 γάρ의 설명 관계 및 아버지가 Ἕλλην이었다는 진술도 보존합니다.
  naturalness: 초안의 ‘원하여’는 현대 합쇼체 산문에서 다소 압축적이며, ‘그를 데리고’와 ‘그를 데려다가’의 연속은 다소 어색합니다. 문장을 나누고 ‘자기와 함께’, ‘그에게 할례를 행하였습니다’를 사용하면 현대 표준어 합쇼체로 더 자연스럽고 명료합니다.
  terminology: ‘바울’, ‘유대인들’, ‘할례’, ‘헬라인’은 성경 및 현대 한국어의 통용 용례에 적절합니다. ‘헬라인’은 원문의 Ἕλλην을 보존하며, 본문에 ‘이방인’이라는 해석적 일반화를 추가하지 않습니다.
  issues:
