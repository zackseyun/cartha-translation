review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 προϊδών은 ‘그러므로’가 아니라 ‘미리 내다보고’이며, ἐγκατελείφθη의 수동 표현은 ‘버려두심을 받지 아니하셨고’보다 ‘버려지지 않으셨고’가 자연스럽고 정확합니다. εἰς ᾅδην은 문맥상 ‘하데스에 버려지지 않으셨고’로 옮겨 원문의 의미를 보존합니다.
  naturalness: 초안의 문어적 ‘아니하셨고’와 ‘하였습니다’의 혼용, 그리고 부자연스러운 수동 명사구를 현대 표준어 합쇼체의 일관된 서술로 다듬었습니다. 인용부호 없이 간접 인용으로 처리하여 그리스어 ὅτι절의 구조를 자연스럽게 반영했습니다.
  terminology: χριστοῦ는 이 문맥에서 칭호적 의미가 뚜렷하므로 ‘메시아’로 유지합니다. ᾅδης는 ‘하데스’로, σάρξ는 문자적 신체를 가리키므로 ‘육체’로, διαφθορά는 ‘썩음’으로 옮겼습니다.
  issues:
