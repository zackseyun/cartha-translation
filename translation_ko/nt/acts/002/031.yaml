    rationale: προϊδὼν은 ‘미리 보고/내다보고’라는 분사이며, 추론 접속사 ‘그러므로’에 해당하는 표현은 본문에 없습니다.
  - severity: medium
    issue: ‘하데스에 버려두심을 받지 아니하셨고’의 표현이 부자연스러움
    rationale: ἐγκατελείφθη는 ‘버려지다/내버려지다’의 수동 동사입니다. 한국어에서는 ‘버려지지 않으셨고’가 자연스럽게 원문의 수동 의미를 전달합니다.
  - severity: low
    issue: 하데스 및 썩음 관련 주석이 없음
    rationale: ‘하데스’가 최종 심판의 장소를 뜻하는 것으로 오해되지 않도록 간단한 문화 주석을, ‘썩음’의 대안 번역을 제시하는 것이 영어 감사 기록과 용어의 투명성에 부합합니다.
