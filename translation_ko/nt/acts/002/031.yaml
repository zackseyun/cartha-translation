- from: 그러므로 그는 이 일을 미리 보고 메시아의[a] 부활에 관하여 말하였으니, 곧 「그분이 하데스에 버려두심을 받지 아니하셨고, 그분의 육체도 썩음을 보지 아니하였다」 하였습니다.
  to: 그는 미리 내다보고 메시아의[a] 부활에 관하여, 곧 그분은 하데스에[b] 버려지지 않으셨고 그분의 육체는 썩음을[c] 보지 않았다고 말하였습니다.
