  source_fidelity: 초안은 πᾶς ὃς ἐὰν과 σωθήσεται를 대체로 충실하게 옮겼지만, κύριος를 본문에서 ‘야훼’로 특정하여 그리스어 본문의 ‘주’라는 표현 및 사도행전 안에서 의도적으로 유지되는 지시 대상의 긴장을 좁혔습니다. 또한 ἔσται가 이루는 인용의 미래적 도입을 ‘그리고’와 미래형 문장으로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘주님의 이름을 부르는 사람은 누구나 구원을 받을 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 성경적 관용구인 ‘이름을 부르다’도 보존합니다. 단독 절 표기에서는 앞 절에서 시작된 인용부호의 닫는 부호를 재현하지 않아도 문장이 완결됩니다.
  terminology: κύριος는 본문에서 ‘주님’으로 옮겨 요엘 원문 배경의 YHWH와 사도행전의 예수 중심 문맥 사이의 해석상 긴장을 보존합니다. ‘구원’은 σωθήσεται의 표준적이고 문맥상 적절한 번역입니다.
  issues:
