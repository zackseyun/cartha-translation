    issue: 본문의 ‘야훼’가 κύριος의 지시 대상을 확정합니다.
    rationale: 이 인용은 요엘에서는 YHWH를 가리키지만, 사도행전의 사용 문맥에서는 예수와 관련된 적용이 논의됩니다. 그리스어 본문은 κύριος(‘주’)라고만 하므로, 본문 번역은 이를 ‘주님’으로 유지하고 배경 설명은 주석에서 제시하는 편이 원문과 영어 감사 기록에 더 충실합니다.
  - severity: low
    issue: 현대 합쇼체에 맞춘 종결이 필요합니다.
    rationale: ‘받을 것입니다’는 요청된 현대 정중 문체를 일관되게 반영합니다.
  revised_text: 그리고 주님의[a] 이름을 부르는 사람은 누구나 구원을 받을 것입니다.
