  source_fidelity: 핵심 명제와 어순상의 강조는 대체로 충실합니다. 그러나 γινωσκέτω의 명령을 「알아 두십시오」로 옮긴 것은 지속적·공적 확신의 요구를 다소 약화하며, ἐποίησεν의 「되게 하셨습니다」는 원문의 ‘만들다/세우다’보다 존재론적 변화로 읽힐 위험이 더 큽니다. 「주와 메시아로 삼으셨습니다」가 문맥상 더 적절합니다.
  naturalness: 합쇼체 문장으로 자연스럽지만, 「이스라엘의 온 집」보다 성경적 집단 관용구를 살린 「이스라엘 온 집」이 더 매끄럽습니다. 「확실히 알아 두십시오」는 일상적으로 자연스러우나 본문의 선언적 명령에는 「분명히 알아야 합니다」가 더 직접적입니다.
  terminology: κύριος는 「주」, χριστός는 이 문맥에서 「메시아」로 처리한 것이 적절합니다. 다만 각주가 본문 의미를 특정 그리스도론적 설명으로 과도하게 한정하고 「승귀」라는 덜 일반적인 표현을 사용하므로, 원문의 문맥적 의미를 중립적으로 설명하도록 다듬는 것이 좋습니다.
  issues:
