revisions:
- from: 그러므로 이스라엘의 온 집은 확실히 알아 두십시오. 여러분이 십자가에 못 박은 이 예수를 하나님께서 주와 메시아가 되게 하셨습니다.[a]
  to: 그러므로 이스라엘 온 집은 하나님께서 여러분이 십자가에 못 박은 이 예수를 주와 메시아로 삼으셨다는 것을 분명히 알아야 합니다.[a]
  rationale: 명령의 힘을 살리고, ἐποίησεν을 한국어에서 더 자연스럽고 문맥에 맞게 「삼으셨다」로 옮겼습니다. 「주」와 「메시아」라는 핵심 칭호 및 ‘여러분이 십자가에 못 박은 이 예수’라는 대조와 강조를 보존했습니다. 각주는 Χριστός의 대안 번역과 ἐποίησεν의 문맥적 의미를 함께 설명하되, 본문이 직접 진술하지 않는 체계적 결론을 강요하지 않도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
