    rationale: 「알아 두십시오」는 기억·유의의 뉘앙스를 낼 수 있습니다. 여기서는 이스라엘 전체가 확실히 알도록 요구하는 현재 명령이므로 「분명히 알아야 합니다」가 더 가깝습니다.
  - severity: medium
    issue: ἐποίησεν의 번역
    rationale: 「주와 메시아가 되게 하셨습니다」는 한국어에서 이전에 그러하지 않았다는 존재론적 변화로 들릴 수 있습니다. 원문의 문맥상 하나님이 예수를 주와 메시아로 세우신/삼으신 선언을 「주와 메시아로 삼으셨습니다」로 옮기는 편이 자연스럽고 오해가 적습니다.
  - severity: low
    issue: 각주의 표현과 범위
    rationale: 「승귀」는 현대 표준어 성경 번역에서 비교적 낯선 전문어이며, 각주가 원문의 어휘 주석을 넘어 특정 교리적 틀을 단정적으로 제시합니다. 문맥상 부활과 높이심에 관련된 공적 확증·세움이라는 점을 중립적으로 제시할 수 있습니다.
