review_pass:
  verdict: revise
  source_fidelity: 초안은 사건의 시간적 계기와 군중의 집결, 각 사람이 자기 방언으로 말하는 것을 들었다는 핵심을 대체로 반영합니다. 그러나 λαλούντων αὐτῶν의 선행사를 본문에 명시되지 않은 ‘사도들’로 한정했고, συνεχύθη를 ‘어찌할 바를 몰랐습니다’로 옮겨 단순한 혼란·당혹 이상의 의미를 부여했습니다.
  naturalness: ‘이 소리가 나자’, ‘무리가 모여들었습니다’, ‘저마다 … 듣고 혼란에 빠졌습니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘자기 지방의 말’보다 ‘자기 방언’이 διάλεκτος의 어휘적 색채를 더 직접적으로 보존합니다.
  terminology: διάλεκτος는 여기서 각 사람이 알아듣는 고유한 지역어/방언을 가리키므로 ‘방언’으로 옮겼습니다. ‘사도들’은 문맥상 가능한 지시 대상일 수 있으나 이 절의 αὐτῶν 자체는 명시적으로 그렇게 한정하지 않으므로 ‘그들이’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘사도들이’가 원문의 대명사 αὐτῶν을 구체적 집단으로 한정합니다.
    rationale: 문맥상 사도들을 가리킬 가능성은 있으나, 이 절의 표현은 ‘그들이 말하는 것을’이라고만 하므로 번역문도 불필요한 명시화를 피하는 것이 안전합니다.
  - severity: medium
    issue: ‘어찌할 바를 몰랐습니다’는 συνεχύθη의 의미를 과도하게 구체화합니다.
    rationale: 수동형 συγχέω는 혼란스럽게 되다, 당황하다의 뜻입니다. 무엇을 해야 할지 몰랐다는 행동·판단의 난처함은 본문이 직접 말하지 않습니다.
  revised_text: 이 소리가 나자 무리가 모여들었습니다. 저마다 그들이 자기 방언으로 말하는 것을 듣고 혼란에 빠졌습니다.
