  source_fidelity: ‘올라가지 못하였으나’는 다윗이 능력이 없었다는 뉘앙스를 더하므로, 단순 부정 과거인 οὐκ ἀνέβη에 맞게 ‘올라가지 않았습니다’로 고쳐야 합니다. 또한 그리스어 본문의 두 κύριος는 모두 ‘주’로 옮기고, 시편 히브리어 본문의 YHWH 배경은 각주에서만 밝혀야 합니다.
  naturalness: 서술은 현대 표준어 합쇼체로 정리하고, 인용문의 겹따옴표와 종결 부호를 완결했습니다. ‘하늘에’와 ‘내 오른편에’는 자연스러우면서도 본문의 의미를 충실히 전달합니다.
  terminology: κύριος는 본문에서 일관되게 ‘주’로 번역했습니다. 첫 번째 ‘주’를 본문에서 ‘야훼’로 바꾸는 것은 그리스어 원문의 동일한 표현을 넘어 히브리어 배경을 본문에 도입하는 것이므로 피했습니다. 메시아라는 해석적 규정도 각주에서 제거했습니다.
