  to: 다윗은 하늘에 올라가지 않았습니다. 그러나 그 자신이 이렇게 말합니다. ‘주께서[a] 내 주께 말씀하셨다. “내 오른편에 앉아 있어라.”’
  rationale: 원문의 단순 과거 부정, δέ의 대조, αὐτός의 강조, 현재형 인용 도입을 반영했습니다. 시편 인용에서는 그리스어 본문의 두 κύριος를 모두 ‘주’로 유지하고, 첫 번째 표현의 YHWH 배경만 중립적인 각주로 제시했습니다. 누락된 인용 부호와 종결 부호도 보완했습니다.
