  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
  footnotes:
  - marker: a
    text: Or 'in the temple.' The Greek term refers to the temple complex, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: b
    text: '''Breaking bread'' may refer to ordinary shared meals, though some understand it to include the Lord''s Supper.'
    reason: alternative_reading
  - marker: c
    text: Or 'food.'
    reason: lexical_alternative
  - marker: d
    text: Or 'sincerity of heart' or 'generosity of heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 날마다 한마음으로 성전[a]에 꾸준히 모이며, 집집마다 떡을 떼고[b], 기쁨과 순전한 마음[d]으로 음식을 나누어 먹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전에서’. 그리스어는 특히 성소 내부만이 아니라 성전 경내 전체를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘떡을 떼다’는 일반적인 공동 식사를 가리킬 수 있으나, 주의 만찬을 포함하는 것으로 이해하는 이들도 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘진실한 마음으로’ 또는 ‘너그러운 마음으로’.
    reason: lexical_alternative
