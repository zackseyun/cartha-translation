    issue: ἔκδοτον의 수동 표현을 능동문으로 변경함
    rationale: 초안의 ‘하나님께서 … 내어 주셨고’는 ‘넘겨진/내어 주어진’이라는 원문의 수동적 서술을 하나님을 명시적 행위자로 하는 능동문으로 바꿉니다. 문맥상 하나님의 계획은 명시되지만, 이 분사 자체의 문법적 수동성과 표현상의 여지를 보존하는 편이 더 충실합니다.
