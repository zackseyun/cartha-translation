  source_fidelity: 수정이 필요합니다. 초안의 ‘하나님께서 … 내어 주셨고’는 ἔκδοτον의 수동적 ‘넘겨진/내어 주어진’을 능동문으로 바꾸어, 본문에 명시되지 않은 주어를 확정합니다. 하나님의 정하신 뜻과 미리 아심은 보존하되, ‘넘겨진’이라는 수동 표현을 유지해야 합니다. ‘율법 없는 자들의 손을 빌려’는 διὰ χειρὸς ἀνόμων의 매개적 행위자성과 단수 ‘손’을 자연스럽게 살립니다.
  naturalness: ‘하나님의 정하신 뜻과 미리 아심에 따라 넘겨진 이 예수’를 문두에 두면 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. 이어지는 ‘여러분은 … 못 박아 죽였습니다’는 원문의 직접적인 책망을 분명히 전달합니다.
  terminology: ‘하나님의 정하신 뜻’, ‘미리 아심’, ‘율법 없는 자들’, ‘십자가에 못 박아 죽였습니다’는 각각 βουλή, πρόγνωσις, ἄνομοι, προσπήξαντες ἀνείλατε를 적절히 반영합니다. ‘미리 아심’은 원문의 명사적 신학 용어를 보존하며, 수동형 ‘넘겨진’은 신적 계획과 인간 책임의 긴장을 해소하지 않습니다.
  issues:
