  terminology: σάρξ는 이 문맥에서 윤리적 ‘육신’이 아니라 몸을 이루는 ‘육체/살’의 뜻입니다. ‘육체’는 원문의 신체적 지시를 유지하면서 한국어에서 자연스럽습니다. κατασκηνώσει는 ‘거할 것입니다’로 옮겨 ‘쉴 것이다’보다 원문의 거주 이미지를 보존합니다.
