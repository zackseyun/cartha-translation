    rationale: δυνάμεις는 이 문맥에서 ‘기적’으로 자연스럽게 옮길 수 있으며, ἀποδεδειγμένον은 하나님께서 예수를 청중에게 공적으로 증명/입증하셨다는 뜻입니다. ‘기적과 기사와 표적으로 여러분에게 증명해 주신 분’이 의미와 문장을 모두 분명히 합니다.
