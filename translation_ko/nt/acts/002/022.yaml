translation:
  language: ko
  text: 이스라엘 남자 여러분, 이 말씀들을 들으십시오. 나사렛 예수는 하나님께서 그분을 통하여 여러분 가운데서 행하신 기적과 기사와 표적으로 여러분에게 증명해 주신 분입니다. 여러분도 친히 아는 바와 같습니다.
  philosophy: optimal-equivalence
