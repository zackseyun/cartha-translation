  source_fidelity: 초안은 하나님께서 예수를 통하여 행하신 일들로 예수를 청중에게 입증하셨다는 기본 구조를 대체로 반영합니다. 그러나 ‘입증해 보이신 분’은 한국어에서 다소 부자연스럽고, 무엇을 누구에게 입증하는지의 관계가 흐려집니다. 또한 원문의 마지막 강조절(‘여러분 자신이 아는 바와 같이’)을 문장 끝에 두는 편이 구조와 강조를 더 충실히 살립니다.
  naturalness: ‘이스라엘 남자 여러분’은 남성 복수 호격을 자연스럽게 보존합니다. ‘기적과 기사와 표적’은 현대 표준어 합쇼체 문맥에서 널리 이해되면서도 원문의 세 항목을 구별합니다. 문장 끝의 ‘여러분 자신이 아는 바와 같습니다’는 αὐτοὶ의 강조를 자연스럽게 드러냅니다.
  terminology: ‘나사렛 사람 예수’는 ὁ Ναζωραῖος를 무리 없이 옮깁니다. ‘사람’은 ἄνδρα를 보존하며, ‘하나님께서 ... 그를 통하여 행하신’은 하나님을 행위의 주체로, 예수를 매개로 명시합니다. δυνάμεις는 본문에서 ‘기적’으로 번역하고 각주에서 ‘능력 있는 일들’이라는 대안을 밝혀 의미 범위를 보완합니다.
  issues:
  - severity: medium
    issue: ‘입증해 보이신 분’의 결합이 부자연스럽고 수식 관계가 불명료합니다.
    rationale: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς는 하나님께서 예수를 청중에게 공개적으로 입증/인정하셨다는 뜻입니다. ‘여러분에게 입증하신 사람’이 대상과 수혜자를 더 명확하게 표시합니다.
  - severity: low
    issue: 강조절의 위치와 ‘친히’의 처리
    rationale: καθὼς αὐτοὶ οἴδατε는 원문에서 문장 끝에 놓이며 αὐτοὶ가 청중을 강조합니다. ‘여러분 자신이 아는 바와 같습니다’가 이 강조와 문장 흐름을 더 잘 반영합니다.
  revised_text: 이스라엘 남자 여러분, 이 말씀을 들으십시오. 나사렛 사람 예수는 하나님께서 여러분 가운데서 그를 통하여 행하신 기적과 기사와 표적으로 여러분에게 입증하신 사람입니다. 여러분 자신이 아는 바와 같습니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 δυνάμεσι는 여기서 ‘능력 있는 일들’ 또는 ‘권능의 나타남’으로도 옮길 수 있습니다. 본문은 이어지는 ‘기사와 표적’과의 정형적인 세 항목을 고려하여 ‘기적’으로 번역했습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 남성 호격, 예수의 ‘사람’됨, 하나님이 행위의 주체이고 예수가 매개라는 문법적 관계를 명료하게 유지했습니다. 세 명사의 병렬을 ‘기적과 기사와 표적’으로 간결하게 살리고, 마지막 청중 강조절을 원문과 같이 문장 끝에 배치했습니다. 각주 표지는 세 항목 가운데 δυνάμεσι에 해당하는 ‘기적’ 뒤에 둡니다.
