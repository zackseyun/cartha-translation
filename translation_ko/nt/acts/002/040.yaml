  source_fidelity: 원문의 ἑτέροις τε λόγοις πλείοσιν은 ‘다른 많은 말로’보다 ‘그 밖의 더 많은 말로’가 ἑτέροις와 πλείοσιν을 함께 더 분명히 반영합니다. 두 미완료 과거 동사(διεμαρτύρατο, παρεκάλει)의 지속·반복성을 ‘거듭’과 ‘계속’으로 살렸습니다. Σώθητε의 수동 명령은 ‘구원을 받으십시오’로 유지했습니다.
  naturalness: ‘엄숙히 증언하고 권면하며 말하였습니다’는 동작 연결이 다소 경직되고 미완료상의 지속성이 드러나지 않습니다. ‘엄숙히 증언하고 계속 권면했습니다’는 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘증언하다’, ‘권면하다’, ‘구원을 받다’, ‘세대’는 문맥과 신학적 용어에 적절합니다. ‘비뚤어진’은 σκολιᾶς의 비유를 자연스럽게 보존합니다.
  issues:
  - severity: medium
    issue: 두 미완료 과거 동사의 지속성이 충분히 반영되지 않음
    rationale: διεμαρτύρατο와 παρεκάλει는 모두 미완료상이며, 특히 후자는 계속된 권면을 나타냅니다. ‘거듭’ 및 ‘계속’으로 이를 반영하는 것이 적절합니다.
  - severity: low
    issue: ‘다른 많은 말’이 πλείοσιν의 비교·증가 뉘앙스를 약하게 드러냄
    rationale: ‘그 밖의 더 많은 말’은 ἑτέροις와 πλείοσιν을 모두 보다 투명하게 옮깁니다.
  - severity: low
    issue: 수동 명령의 능동적 대안에 관한 번역 주석이 없음
    rationale: 본문은 수동태를 유지하되, 영어 감사 기록에 있는 가능한 능동적 이해를 각주로 밝혀 독자가 문법적 형태와 해석적 대안을 구별하도록 할 수 있습니다.
  revised_text: 베드로는 그 밖의 더 많은 말로 거듭 엄숙히 증언하고 그들을 계속 권면했습니다. “이 비뚤어진 세대로부터 구원을 받으십시오.”¹
  revised_footnotes:
  - marker: '1'
    text: 또는 “이 비뚤어진 세대로부터 자신을 구하십시오.” 그리스어 동사는 수동태(“구원을 받으십시오”)이지만, 듣는 이들의 응답이 요청된다는 점을 반영하여 능동적으로 옮기는 번역도 있습니다.
    reason: Σώθητε의 수동태를 본문에서 보존하면서 가능한 능동적 번역 대안을 제시합니다.
  revision_rationale: 본문은 원문의 어휘와 문법적 뉘앙스를 더 충실히 반영하도록 다듬었습니다. 특히 ‘그 밖의 더 많은 말로’로 두 수식어를 살리고, ‘거듭’과 ‘계속’으로 미완료상의 지속성을 표시했습니다. 구원 명령은 수동태를 유지했으며, 대안적 능동 번역은 각주에만 제시했습니다.
