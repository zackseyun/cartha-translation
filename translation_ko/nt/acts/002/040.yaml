  - severity: low
    issue: 수동 명령에 대한 대안 독해 각주가 없음
    rationale: Σώθητε는 문법적으로 수동태이나 문맥상 능동적·재귀적으로 옮기는 번역도 있으므로, 본문의 수동성을 보존하면서 대안 번역을 각주로 제시하는 것이 영어 감사 기록 및 해석상 모호성 보존에 부합합니다.
