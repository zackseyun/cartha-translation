  source_fidelity: 개정이 필요합니다. 원문의 ἑτέροις τε λόγοις πλείοσιν은 ‘그 밖의 많은 말로도’로, διεμαρτύρατο는 ‘엄숙히 증언하고’로 옮기는 것이 적절합니다. 특히 미완료 과거 παρεκάλει의 지속성을 ‘계속 권면하면서’로 드러내야 합니다. Σώθητε의 수동 명령은 ‘구원을 받으십시오’로 보존했습니다.
  naturalness: 초안의 ‘증언하고 권면하며 말하였습니다’는 문법상 가능하지만, 권면의 대상과 반복·지속의 뉘앙스가 약합니다. ‘그들을 계속 권면하면서 이렇게 말하였습니다’가 현대 표준어 합쇼체에서 더 자연스럽고 분명합니다.
  terminology: ‘구원을 받으십시오’는 σῴζω의 수동태를 유지하는 적절한 신학 용어입니다. ‘비뚤어진 세대’는 σκολιᾶς의 비유적 표현을 자연스럽게 보존합니다.
  issues:
  - severity: medium
    issue: παρεκάλει의 미완료 과거 및 목적어가 충분히 반영되지 않음
