translation:
  language: ko
  text: 베드로는 그 밖의 많은 말로도 엄숙히 증언하고 그들을 계속 권면하면서 이렇게 말하였습니다. “이 비뚤어진 세대로부터 구원을 받으십시오[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 비뚤어진 세대로부터 여러분 자신을 구원하십시오.” 헬라어 동사는 수동태(“구원을 받으십시오”)이지만, 듣는 이들의 응답을 강조하기 위해 능동적으로 옮기는 번역도 있습니다.
    reason: alternative_reading
