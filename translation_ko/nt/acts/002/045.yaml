  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
  footnotes:
  - marker: a
    text: Or 'lands and possessions.' The two Greek terms likely distinguish kinds of owned goods, with κτήματα often referring to property holdings and ὑπάρξεις to possessions more generally.
