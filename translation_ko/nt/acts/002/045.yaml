translation:
  language: ko
  text: 그들은 재산[a]과 소유물을 팔아, 각 사람이 필요로 하는 대로 모든 사람에게 나누어 주곤 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토지와 소유물’. 그리스어의 두 단어는 소유한 물건의 서로 다른 종류를 구별하는 듯합니다. κτήματα는 흔히 토지 등을 포함한 재산을, ὑπάρξεις는 더 일반적인 소유물을 가리킬 수 있습니다.
