  text: 다윗이 그분에 관하여 이렇게 말하기 때문입니다. “나는 언제나 주님을[a] 내 앞에 두고 바라보았습니다. 그분은 내가 흔들리지 않도록 내 오른편에 계십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시편 16:8 인용입니다. 히브리어 시편 본문에서 이 표현은 신명 YHWH에 해당합니다.
    reason: cross_reference
theological_decisions:
