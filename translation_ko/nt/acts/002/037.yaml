  text: Now when they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
  footnotes:
  - marker: a
    text: Or “cut to the heart.” The Greek expression describes a sharp inner conviction or distress.
