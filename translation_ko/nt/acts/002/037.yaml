translation:
  language: ko
  text: 그들이 이 말씀을 듣고 마음이 찔려[a], 베드로와 나머지 사도들에게 말하였습니다. “형제들이여[b], 우리가 어떻게 해야 합니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마음이 꿰찔려.” 그리스어 표현은 마음 깊은 곳에 날카롭게 찔림을 받은 듯한 강한 충격이나 괴로움을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 “남자들이여, 형제들이여”입니다. 이는 관습적인 호칭으로, 문맥에 따라 “형제들이여” 또는 “형제자매 여러분”과 같이 기능할 수 있습니다.
    reason: lexical_alternative
