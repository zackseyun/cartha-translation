  source_fidelity: 현 번역은 큰 흐름을 잘 반영하지만, 「약속하신 성령」은 τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου를 ‘약속된 성령’으로 해석하여 본문의 남아 있는 속격 관계의 여지를 본문에서 없앱니다. 또한 τῇ δεξιᾷ의 ‘하나님의 오른편으로/하나님의 오른손으로’라는 가능한 이해를 주석으로 보존하는 것이 적절합니다.
  naturalness: 합쇼체는 대체로 자연스럽습니다. 다만 「받아 부어 주셨으니, 곧 여러분이 보고 듣는 이것입니다」는 한국어에서 ‘이것’이 술어 보어처럼 연결되어 다소 부자연스럽고, 무엇을 부었는지 문장 구조가 흐려집니다. 관계절을 「여러분이 보고 듣고 있는 이것을 부으셨습니다」로 옮기면 원문의 구조와 현대 한국어 어법을 함께 살릴 수 있습니다.
  terminology: 「하나님」, 「아버지」, 「성령」은 적절합니다. τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου는 본문에서 「성령에 관한 약속」으로 옮기고, ‘약속된 성령’이라는 해석은 각주에 제시하는 것이 원문의 모호성을 더 잘 보존합니다.
  issues:
  - severity: medium
    issue: 「약속하신 성령」이 속격 구문의 한 해석을 본문에 고정합니다.
    rationale: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου는 성령에 관한 약속 또는 약속된 성령으로 이해될 수 있습니다. 본문은 전자를 채택하고 후자를 각주로 남겨야 합니다.
  - severity: medium
    issue: 마지막 절의 한국어 문장 구조가 부자연스럽고 지시어의 문법적 역할이 불명확합니다.
    rationale: 원문은 ‘그분이 이것, 곧 여러분이 보고 듣는 것을 부으셨다’는 구조입니다. 이를 직접 반영해야 합니다.
  - severity: low
    issue: 하나님의 오른편에 관한 대안적 이해를 보존하는 각주가 없습니다.
    rationale: τῇ δεξιᾷ는 문맥상 ‘하나님의 오른편으로’가 적절하지만, ‘하나님의 오른손으로/권능으로’라는 도구적 이해도 가능하므로 각주가 필요합니다.
  revised_text: 그러므로 그분은 하나님의 오른편으로 높임을 받으시고, 아버지에게서 성령에 관한 약속을 받으신 뒤, 여러분이 보고 듣고 있는 이것을 부으셨습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘하나님의 오른손으로(권능으로)’. 그리스어 여격은 ‘하나님의 오른편으로’라는 위치적 의미나 ‘하나님의 오른손으로’라는 도구적 의미로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘약속된 성령’. 그리스어 표현은 성령에 관한 약속을 뜻할 수도 있고, 약속된 선물로서의 성령을 뜻할 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 분사 연쇄와 주절을 분명히 하여 ‘높임을 받으시고—약속을 받으신 뒤—이것을 부으셨습니다’로 옮겼습니다. 성령 관련 속격의 해석상 여지는 본문과 각주로 구분해 보존했으며, 하나님의 오른편에 관한 여격의 대안도 각주에 제시했습니다.
