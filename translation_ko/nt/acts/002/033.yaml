review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘약속하신 성령’은 τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου의 가능한 의미 하나를 본문에서 확정하며, ‘곧 여러분이 보고 듣는 이것입니다’는 τοῦτο를 ‘부어 주셨다’의 목적어로 삼는 원문의 통사 관계를 바꾸어 놓습니다.
  naturalness: 합쇼체와 전반적 어휘는 적절하나, 마지막 절은 한국어 문장으로도 ‘이것’이 무엇인지 단정하는 서술이 되어 어색하고 원문의 흐름과 다릅니다. 목적어를 동사 앞에 두어 자연스럽고 정확하게 고쳤습니다.
  terminology: ‘하나님’, ‘아버지’, ‘성령’은 표준적인 현대 한국어 성서 용례에 맞습니다. 성령 관련 소유격의 의미는 본문에서 과도하게 결정하지 않고 각주로 가능한 대안을 보존했습니다.
  issues:
  - severity: high
    issue: ‘약속하신 성령’이 성령 자신이 약속된 선물이라는 해석을 본문에서 확정합니다.
    rationale: 그리스어 ‘성령의 약속’은 성령 자신이 약속된 선물이라는 뜻과 성령에 관한 약속이라는 뜻으로 읽힐 수 있습니다. 본문은 더 중립적인 ‘성령에 관한 약속’으로 옮기고 다른 가능성을 각주에 남기는 것이 안전합니다.
  - severity: high
    issue: ‘곧 여러분이 보고 듣는 이것입니다’가 원문의 목적어-관계절 구조를 진술문으로 바꿉니다.
    rationale: ἐξέχεεν τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε는 ‘여러분이 보고 듣는 바로 이것을 부어 주셨습니다’라는 구조입니다. 수정문은 τοῦτο를 ‘부어 주셨습니다’의 목적어로 유지합니다.
  - severity: medium
    issue: τῇ δεξιᾷ τοῦ θεοῦ의 위치적/도구적 모호성이 무각주로 남아 있습니다.
    rationale: 문맥상 ‘하나님의 오른편으로’가 자연스럽지만, 여격은 ‘하나님의 오른손으로/권능으로’라는 도구적 이해도 가능합니다. 영어 감사 기록에 맞추어 각주로 보존합니다.
  revised_text: 그러므로 그분은 하나님의 오른편으로 높임을 받으시고, 아버지께로부터 성령에 관한 약속을 받으신 뒤, 여러분이 보고 듣고 있는 바로 이것을 부어 주셨습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘하나님의 오른손으로’. 그리스어 여격은 하나님의 오른편으로 높임을 받았다는 위치적 뜻이나, 하나님의 오른손 곧 권능으로 높임을 받았다는 도구적 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘약속된 성령’. 그리스어 표현은 성령에 관한 약속 또는 약속된 선물로서의 성령을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 분사 연쇄와 주절을 유지하고, ‘부어 주셨다’의 목적어인 τοῦτο와 이를 수식하는 관계절을 정확히 반영했습니다. 성령 관련 표현과 하나님의 오른편이라는 표현의 해석상 여지는 본문에서 확정하지 않고 각주로 보존했습니다.
