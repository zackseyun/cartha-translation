    text: Or 'to Sheol,' reflecting the Hebrew text behind this quotation; Greek here has 'Hades.'
    reason: alternative_reading
  - marker: b
    text: Or 'your faithful one.'
    reason: lexical_alternative
  - marker: c
    text: That is, bodily decay or decomposition; traditional English often has 'corruption.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주께서 내 영혼을 하데스에[a] 버려두지 않으시고, 주의 거룩한 이가[b] 썩음을[c] 보게 내버려 두지 않으실 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「스올」. 이 인용문의 배경인 히브리어 본문은 「스올」에 해당하는 말을 사용하지만, 여기의 그리스어 본문은 「하데스」입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 「주의 신실한 이」.
