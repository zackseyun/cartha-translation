    issue: The possessive emphasis in τῇ ἰδίᾳ διαλέκτῳ ἡμῶν is underrepresented.
    rationale: '''태어난 곳의 말'' primarily identifies a regional language; the Greek also stresses that it is each listener''s own language. ''우리 각자가 태어난 곳에서 쓰는 자기 고유의 말'' preserves both elements.'
  revised_text: 그런데 어떻게 우리 각자가 자신이 태어난 곳에서 쓰는 자기 고유의 말로 듣고 있습니까?
