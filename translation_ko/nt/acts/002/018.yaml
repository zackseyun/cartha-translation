review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the paired male and female slave terms, the divine Spirit, outpouring imagery, and future prophecy. However, it omits the emphatic καί γε ('even/indeed') and renders the plural demonstrative temporal phrase ἐν ταῖς ἡμέραις ἐκείναις as singular '그날에.'
  naturalness: ‘남종들과 여종들 위에도’ is understandable, but ‘남종들과 여종들에게도’ is more natural Korean with ‘영을 부어 주다’ while still conveying the Greek ἐπί in this metaphorical context. The revision consistently uses modern formal-polite 합쇼체.
  terminology: ‘남종’ and ‘여종’ appropriately preserve the explicitly gendered δοῦλοι/δούλαι and their socially subordinate status. ‘내 영’ is the established, natural Korean biblical rendering of πνεῦμά μου. ‘예언하다’ directly reflects προφητεύω.
  issues:
  - severity: medium
    issue: καί γε의 강조가 빠졌습니다.
    rationale: καί γε는 앞선 범주에 더하여 특히 낮은 사회적 지위의 남녀 종들에게까지 성령이 부어짐을 강조합니다. ‘도’로 이 강조를 반영할 수 있습니다.
  - severity: medium
    issue: ἐν ταῖς ἡμέραις ἐκείναις의 복수형이 단수 ‘그날에’로 바뀌었습니다.
    rationale: 원문은 ‘그 날들에’라는 복수의 지시적 시간 표현입니다. 의미를 불필요하게 단수화하지 않아야 합니다.
  - severity: low
    issue: 초안의 종결 표현이 지정된 합쇼체와 일관되지 않습니다.
    rationale: ‘부어 주리니, ... 것이다’ 대신 ‘부어 주겠으며, ... 것입니다’로 현대 표준어 합쇼체를 유지합니다.
  revised_text: 그 날들에 내가 내 남종들과 내 여종들에게도 내 영을 부어 주겠으며, 그들은 예언할 것입니다.
