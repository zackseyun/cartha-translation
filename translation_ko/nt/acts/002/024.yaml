translation:
  language: ko
  text: 하나님께서는 그분을 일으키시고 죽음의 고통을[a] 풀어 주셨습니다. 이는 그분께서 죽음에[b] 붙들려 계실 수 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
