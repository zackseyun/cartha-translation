translation:
  language: ko
  text: 그러자 베드로가 열한 사도와 함께 일어서서 목소리를 높여 그들에게 선언하였습니다. 「유대 사람들과 예루살렘에 사는 모든 사람들이여, 이것을 알아 두시고 내 말에 귀를 기울이십시오.」
  philosophy: optimal-equivalence
theological_decisions:
- issue: 오순절 설교에서 베드로의 청중 호칭(군중 대상 합쇼체)
  chosen_reading: 합쇼체(공적·격식체)로 청중을 호명
  alternative_readings:
  - 반말
  rationale: 베드로가 「유대 사람들」 「이스라엘 사람들」이라 부르며 공적 광장에서 선포하는 장면이므로, 한국어 화행의 자연성에 맞춰 합쇼체로 옮긴다. 직접 신적 발화나 친밀한 제자 대상 발화는 별도 정책을 따른다.
  doctrine_reference: 'KOREAN_PIPELINE.md: 합쇼체 정책 + DOCTRINE.md §5'
