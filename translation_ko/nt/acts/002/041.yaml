  source_fidelity: The draft correctly conveys the favorable reception of Peter's word, baptism, the approximate number, and the passive ‘were added’ without supplying an unstated object. However, it does not preserve the audit trail's lexical note for ψυχαί (‘souls’), which functions idiomatically here as a count of people.
  naturalness: ‘그날에’ is understandable but ‘그날’ is more natural in modern Korean prose. ‘그러므로’ provides a suitably formal, readable rendering of the narrative/inferential particle sequence.
  terminology: ‘그의 말’ appropriately renders λόγος here without adding theological force. ‘세례를 받았고’ faithfully renders the passive ἐβαπτίσθησαν. The note clarifies that ‘명’ reflects the idiomatic counting sense of ψυχαί, rather than a technical anthropological claim.
  issues:
