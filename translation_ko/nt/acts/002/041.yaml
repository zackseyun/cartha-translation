    rationale: The English audit trail explicitly retains a note that ‘souls’ commonly means persons/people in this counting context. A Korean note should preserve this clarification and its anchor.
  - severity: low
    issue: ‘그날에’ is slightly less idiomatic than ‘그날.’
    rationale: Both are accurate, but ‘그날’ is the more natural modern Korean temporal expression.
