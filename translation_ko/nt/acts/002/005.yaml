    text: ‘유대인’은 문맥에 따라 ‘유대 지역 사람들’로도 옮길 수 있습니다. 그러나 여기서는 ‘천하 각 나라에서 온’ 사람들이므로, 더 넓은 민족적·종교적 의미의 ‘유대인’이 알맞습니다.
    reason: alternative_reading
  - marker: b
    text: ‘천하’는 온 세상, 곧 사람이 사는 세계 전역을 뜻하는 성서적 관용 표현입니다.
