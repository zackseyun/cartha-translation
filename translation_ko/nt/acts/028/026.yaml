review_pass:
  verdict: revise
  source_fidelity: 초안은 πορεύθητι와 εἰπόν의 명령을 적절히 옮기고, οὐ μή의 강한 부정을 ‘결코’로 잘 드러냅니다. 그러나 도입 분사 λέγων이 빠졌고, Ἀκοῇ ἀκούσετε 및 βλέποντες βλέψετε의 반복·강조가 ‘분명히’로 다소 평준화되었습니다. 또한 여는 인용 부호가 닫히지 않아 본문 구조가 불완전합니다.
  naturalness: ‘듣기는 들어도’, ‘보기는 보아도’는 현대 표준어에서 자연스러우면서도 예언 인용문의 반복과 역설을 살립니다. 합쇼체 명령형 ‘말하십시오’를 사용해 목표 문체를 유지했습니다.
  terminology: ‘깨닫다’는 συνίημι의 내적 이해를 자연스럽게 반영합니다. 마지막 ἴδητε는 앞의 시각 동사와의 반복을 보존하되 문맥상 내적 인식을 나타내도록 ‘알아보지 못할 것이다’로 옮겼습니다. 특정 교리적 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: 도입 분사 λέγων의 누락
    rationale: 원문은 앞선 발화에 연결되는 ‘말하면서/말하기를’을 포함합니다. 절 단위 번역에서도 이를 반영하는 것이 원문 충실성에 유익합니다.
  - severity: medium
    issue: 반복·강조 표현의 평준화
    rationale: Ἀκοῇ ἀκούσετε와 βλέποντες βλέψετε는 의도적인 반복을 이루므로, ‘분명히’만으로 처리하기보다 ‘듣기는 들어도’, ‘보기는 보아도’로 드러내는 편이 최적 등가 원칙에 더 맞습니다.
  - severity: high
