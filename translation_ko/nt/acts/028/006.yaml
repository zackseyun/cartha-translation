  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
  footnotes:
  - marker: a
    text: Or, 'nothing out of the ordinary' or 'nothing amiss' was happening to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그가 부어오르거나 갑자기 쓰러져 죽을 것이라고 기대하고 있었습니다. 그러나 그들이 한참 기다리며 그에게 아무런 이상도 생기지 않는 것을 보고는,[a] 생각을 바꾸어 그가 신이라고 말하기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게 아무런 비정상적인 일이 일어나지 않는 것을” 또는 “그에게 아무런 해로운 일이 일어나지 않는 것을.”
    reason: μηδὲν ἄτοπον은 ‘이상한/비정상적인’, ‘잘못된’, 또는 문맥상 ‘해로운’ 결과가 없었다는 뜻으로 옮길 수 있습니다.
