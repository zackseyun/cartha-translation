  source_fidelity: 현 초안의 두 번째 문장은 ‘내가 그들을 고치지 않게 하려 함’이라고 하여 ἰάσομαι αὐτούς의 긍정적 결과를 부정으로 바꾸고, μήποτε 절의 논리를 과도하게 목적문으로 확정합니다. ‘그렇지 않았다면 … 내가 그들을 고쳤을 것입니다’는 본문의 조건적 결과를 보존하며, 각주에서 ‘그들이 … 하지 않도록’이라는 더 강한 뉘앙스를 제시합니다.
  naturalness: ‘귀로 무겁게 들었으며’는 직역투이므로 ‘귀로는 둔하게 들었으며’로 다듬었습니다. 문장 전체는 현대 표준어 합쇼체로 정리했고, 불필요한 닫는 인용 부호를 제거했습니다.
  terminology: ‘마음’, ‘깨달아’, ‘돌이켜’, ‘고쳤을 것입니다’는 καρδία, συνῶσιν, ἐπιστρέψωσιν, ἰάσομαι를 각각 자연스럽고 과도하게 교리화하지 않도록 옮깁니다. ‘돌이켜’에는 회개·회심을 단정하지 않는 원문의 방향 전환 의미를 유지합니다.
