revisions:
- from: 마침 보블리오의 아버지가 열병과 이질에 걸려 누워 있었습니다. 바울이 그에게 들어가 기도하고 그에게 손을 얹어 그를 고쳐 주었습니다.
  to: 그때 보블리오의 아버지는 열병과 이질을 앓아 누워 있었습니다. 바울은 그를 찾아가 기도한 뒤 그에게 손을 얹고 그를 고쳐 주었습니다.
  rationale: The revision removes the potentially over-interpreting “마침,” replaces an unnatural directional expression with idiomatic Korean that preserves the contextual movement toward the sick man, and clarifies that Paul prayed before healing. It retains the source’s restrained account of illness and healing without imposing theological interpretation.
