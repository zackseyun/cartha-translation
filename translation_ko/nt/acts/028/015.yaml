  language: ko
  text: 그곳에서 형제들[a]이 우리에 관한 소식을 듣고 우리를 마중하러 압비오 광장과 삼관까지 왔습니다. 바울은 그들을 보고 하나님께 감사드리고 용기를 얻었습니다.
  philosophy: optimal-equivalence
  footnotes:
