  source_fidelity: 헬라어의 시간절, 바울에게 주어진 허가, 별도로 머무름, 그를 지키는 군인의 동반이라는 핵심 의미는 대체로 반영되었습니다. 그러나 "군사 한 사람"은 정관사가 있는 τῷ ... στρατιώτῃ를 부당하게 명시적 부정으로 만들며, 원문의 특정한 배정 경비병이라는 문맥적 뉘앙스를 약화합니다.
  naturalness: '"자기를 지키는 군사 한 사람"보다 "그를 지키는 군인"이 현대 표준어에서 더 자연스럽고, 서술 대상이 바울임을 명료하게 합니다. "머무르는 것을 허락받았습니다"는 합쇼체의 자연스러운 수동 표현입니다.'
  terminology: στρατιώτῃ는 현대 한국어에서 "군인"으로 옮기는 것이 자연스럽습니다. καθ’ ἑαυτὸν은 "따로"로 유지하여, 군인과 함께 있었다는 뒤 구절과 충돌하지 않게 했습니다.
