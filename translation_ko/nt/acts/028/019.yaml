  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
  footnotes:
  - marker: a
    text: Or 'while the Jews were opposing me' or 'because the Jews were contradicting me.'
    reason: lexical_alternative
  - marker: b
    text: '''The Jews'' here refers to Paul''s Jewish opponents in this legal context, not a blanket statement about all Jewish people.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 유대인들이[a] 반대하였기 때문에[b] 저는 카이사르에게 상소할 수밖에 없었습니다. 그렇다고 제가 제 민족을 고발할 것이 있었던 것은 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 “유대인들”은 이 법적 상황에서 바울에게 반대한 유대인들을 가리키며, 모든 유대인을 싸잡아 가리키는 말은 아닙니다.
    reason: cultural_note
  - marker: b
    text: 또는 “반대하고 있었기 때문에”, “이의를 제기했기 때문에”.
    reason: lexical_alternative
