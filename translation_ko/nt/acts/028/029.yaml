  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
  footnotes:
  - marker: a
    text: This entire verse is absent from the earliest Greek manuscripts (including 3rd-century Papyrus 74, 4th-century Sinaiticus, and 4th-century Vaticanus) and early Coptic translations. It is present in the Byzantine majority tradition, as well as early Latin and Syriac translations. It is likely a later scribal expansion added to round out the narrative of the Jewish leaders' departure.
