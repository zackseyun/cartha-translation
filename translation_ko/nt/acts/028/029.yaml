    text: 이 구절 전체는 가장 이른 헬라어 사본들(3세기 파피루스 74, 4세기 시내 사본과 바티칸 사본)과 초기 콥트어 번역본에 없습니다. 이 구절은 비잔틴 다수 사본 전통과 초기 라틴어 및 시리아어 번역본에는 있습니다. 유대 지도자들이 떠나는 이야기를 마무리하기 위해 후대 필사자가 덧붙인 확장일 가능성이 큽니다.
    reason: textual_critical
