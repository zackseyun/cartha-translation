  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
  footnotes:
  - marker: a
    text: Greek βάρβαροι literally means 'barbarians,' that is, non-Greek-speaking people; here it refers to the island's local inhabitants without necessarily implying savagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'showed us no ordinary kindness.'
    reason: lexical_alternative
