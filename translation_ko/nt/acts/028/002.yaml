  source_fidelity: 핵심 의미는 대체로 충실하나, οὐ τὴν τυχοῦσαν φιλανθρωπίαν은 ‘보통이 아닌 호의’보다 ‘각별한 친절’로 옮기는 편이 현대 한국어에서 더 자연스럽습니다. 또한 ἐφεστῶτα는 이미 닥쳐 계속되고 있는 비의 상황을 나타내므로 이를 반영했습니다.
  naturalness: 초안의 ‘보통이 아닌 호의’는 직역투이며, ‘비가 내리고 추웠기에’는 문맥상 가능하지만 계속된 악천후의 배경을 충분히 드러내지 못합니다. 문장을 나누고 ‘계속 내리는 비와 추위 때문에’로 다듬었습니다.
  terminology: βάρβαροι를 본문에서 ‘그곳 사람들’로 처리한 것은 현대적이며 비비하적입니다. 주석에서는 이 말의 비(非)그리스어권 의미를 설명하되, 본문에 없는 민족적·토착성 함의를 과도하게 부여하지 않도록 ‘토착 주민’을 ‘그 섬의 주민’으로 고쳤습니다.
