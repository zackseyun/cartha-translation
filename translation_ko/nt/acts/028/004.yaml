  source_fidelity: ‘그 지역 사람들’은 βάρβαροι의 지시 대상을 대체로 전달하지만, 본문의 섬 배경을 반영한 ‘그 섬 주민들’이 더 정확하고 자연스럽습니다. δίκη를 본문에서 특정 ‘정의의 여신’으로 단정한 것은 원문의 의인화 가능성을 지나치게 확정합니다. 또한 ‘살려 두지 않는구나’는 원문의 부정과거(οὐκ εἴασεν)를 현재 진행처럼 옮깁니다.
  naturalness: 대화문 안에 겹낫표와 각주 표지가 결합된 현행 표기는 부자연스럽습니다. 현대 표준어 합쇼체에 맞추어 서술과 직접화법을 정리하고, ‘바다에서 무사히 빠져나왔는데도’로 역접 관계를 자연스럽게 드러낼 수 있습니다.
  terminology: φονεύς는 ‘살인자’, διασωθέντα는 이 문맥에서 ‘무사히 빠져나오다’, δίκη는 본문에서는 ‘정의’로 두고 각주에서 의인화 및 여신 암시 가능성을 설명하는 것이 적절합니다. τὸ θηρίον은 특정 종을 확정하지 않는 ‘그 짐승’으로 유지합니다.
