translation:
  language: ko
  text: 그들이 그에게 말했습니다. “우리는 유대에서 당신에 관하여 온 편지를 받은 적도 없고, 형제들[a] 가운데 아무도 와서 당신에 관하여 무슨 나쁜 말을 보고하거나 말한 적도 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
