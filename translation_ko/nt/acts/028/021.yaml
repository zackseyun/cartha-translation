  source_fidelity: 그리스어의 이중 부정(οὔτε … οὔτε), 유대에서 온 편지, 와서 알리거나 말한 형제라는 핵심 요소는 초안에 대체로 반영되었습니다. 그러나 닫는 인용 부호가 빠져 있고, 인용문 안의 ‘않았소’는 요구된 현대 합쇼체와 일치하지 않습니다. ‘무슨 악한 것’은 직역투이므로 문맥상 ‘나쁜 말’로 옮기는 것이 자연스럽습니다.
  naturalness: ‘그대’와 ‘않았소’는 현대 표준어 합쇼체 대화문으로는 다소 고풍스럽고 문체가 서술문의 ‘말했습니다’와 혼재됩니다. ‘당신’ 및 ‘없습니다’로 통일하고, ‘형제들 가운데 누가’는 ‘형제들 가운데 아무도’로 다듬어 부정 상관구문을 자연스럽게 했습니다.
  terminology: ‘유대’는 Ἰουδαία의 지명으로 적절합니다. ἀδελφοί는 본문이 기독교 신자를 명시하지 않으므로 ‘형제들’로 유지하고, 그 가능한 지시 대상을 설명하는 각주를 붙였습니다. πονηρόν은 이 맥락에서 ‘나쁜 말’로 자연스럽게 반영했습니다.
