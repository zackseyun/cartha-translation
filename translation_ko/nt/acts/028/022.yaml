  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
  footnotes:
  - marker: a
    text: Or 'party' or 'movement'; Greek αἵρεσις here does not necessarily mean 'heresy' in the later technical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리는 당신께서 어떤 생각을 하고 계신지 당신에게서 듣는 것이 마땅하다고 여깁니다. 이 분파[a]에 대해서는 그것이 어디서나 반대의 말을 듣고 있다는 것을 우리가 알고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
