- from: 그러나 우리는 그대에게서 그대의 견해를 듣고 싶소. 이 분파에 관해서는, 곳곳에서 반대를 받는다는 것을 우리가 알기 때문이오.」
  to: 그러나 우리는 당신께서 어떤 생각을 하고 계신지 당신에게서 듣는 것이 마땅하다고 여깁니다. 이 분파[a]에 대해서는 그것이 어디서나 반대의 말을 듣고 있다는 것을 우리가 알고 있기 때문입니다.
  rationale: ἀξιοῦμεν의 정중한 판단을 ‘마땅하다고 여깁니다’로, πανταχοῦ를 ‘어디서나’로 반영했습니다. ἀντιλέγεται는 해당 집단을 향해 반대하는 말이 이어진다는 뜻으로 옮겼으며, αἵρεσις의 시대착오적 ‘이단’ 이해를 피하도록 각주를 달았습니다.
