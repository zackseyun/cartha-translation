  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
  footnotes:
  - marker: a
    text: Or “one word” or “one statement.” The Greek literally says “one word,” here functioning as a concluding remark.
    reason: lexical_alternative
  - marker: b
    text: Or “to your ancestors.” The Greek reads “to your fathers,” referring to Israel’s forefathers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로 의견이 일치하지 않은 채, 바울이 한마디 말[a]을 한 뒤에 떠나갔습니다. 「성령께서 예언자 이사야를 통해 여러분의 조상들[b]에게 옳게 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 말씀” 또는 “한 진술.” 그리스어는 직역하면 “한 말”이며, 여기서는 마무리 발언을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “여러분의 아버지들에게.” 여기서는 이스라엘의 선조들을 가리킵니다.
    reason: lexical_alternative
