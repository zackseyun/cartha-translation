- from: 그들이 그와 약속한 날에, 더 많은 사람이 그의 숙소로 그에게 왔습니다. 그가 그들에게 아침부터 저녁까지 모세의 율법과 예언서로부터 예수에 관해 설명하며, 하나님의 나라를 엄히 증언하고 그들을 설득했습니다.
  to: 그들이 그와 날짜를 정한 뒤, 더 많은 사람들이 그가 머무는 숙소로 왔습니다. 바울은 아침부터 저녁까지 그들에게 하나님의 나라를 설명하고 힘주어 증언하며, 모세의 율법과 예언서에 근거하여 예수에 관해 그들을 설득했습니다.
  rationale: 수정문은 날짜를 함께 정했다는 Ταξάμενοι ... αὐτῷ ἡμέραν, 비교급 πλείονες, 숙소를 향한 εἰς τὴν ξενίαν을 자연스럽게 반영했습니다. 또한 하나님의 나라를 설명하고 증언한 일과, 모세의 율법 및 예언서에 근거하여 예수에 관해 설득한 일을 헬라어의 통사 관계에 맞게 구분했습니다. πείθων은 성공 여부를 단정하지 않는 '설득하며/설득했습니다'로 옮겼습니다.
