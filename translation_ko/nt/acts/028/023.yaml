  terminology: '''하나님의 나라'', ''모세의 율법'', ''예언서''는 적절합니다. ''예수에 관해''도 적절하되, 율법과 예언서가 예수에 관한 설득의 근거임을 문장 구조상 명확히 해야 합니다.'
