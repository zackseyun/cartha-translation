review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘로마로 갔습니다’는 εἰς τὴν Ῥώμην ἤλθαμεν의 목적지 도착을 충분히 나타내지 못하므로 ‘로마에 이르렀습니다’로 옮기는 것이 적절합니다. 또한 παρεκλήθημεν은 수동으로 받은 요청/권유를 나타내므로 ‘머물러 달라는 요청을 받았습니다’가 의미와 한국어 표현을 모두 잘 살립니다.
  naturalness: ‘머물도록 청함을 받았습니다’는 문법적으로 가능하지만 현대 표준 한국어 합쇼체에서는 다소 경직되고 부자연스럽습니다. ‘머물러 달라는 요청을 받았습니다’가 자연스럽고 정중한 서술체입니다.
  terminology: ἀδελφούς는 본문에서 ‘형제들’로 유지하되, 문맥상 지역 그리스도인 공동체의 동료 신자들을 가리킬 가능성을 각주로 밝혔습니다. ‘이레’는 ἡμέρας ἑπτά를 자연스럽고 정확하게 옮깁니다.
  issues:
  - severity: medium
    issue: ‘로마로 갔습니다’
    rationale: ἔρχομαι + εἰς는 로마라는 목적지에 이르렀음을 나타냅니다. ‘로마로’는 단지 이동 방향이나 행위를 나타낼 수 있어 도착의 뉘앙스가 약해집니다.
  - severity: low
    issue: ‘머물도록 청함을 받았습니다’
    rationale: 원문의 수동적 요청 의미는 반영하지만, 현대 한국어에서는 명사화된 ‘청함을 받았습니다’보다 ‘머물러 달라는 요청을 받았습니다’가 더 자연스럽습니다.
  revised_text: 거기서 우리는 형제들[a]을 만나, 그들과 함께 이레 동안 머물러 달라는 요청을 받았습니다. 그리고 이렇게 해서 우리는 로마에 이르렀습니다.
