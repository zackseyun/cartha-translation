  source_fidelity: 핵심 구문과 어휘는 대체로 충실합니다. 다만 αὐτοὶ καί의 강조(‘그들도/그들 역시’)가 ‘그들은’에서 빠졌고, 본문 끝의 닫는 인용 부호는 원문에 근거하지 않는 문장부호 오류입니다.
  naturalness: ‘그러므로 여러분은 … 아십시오’는 현대 한국어 합쇼체에서 자연스럽고, 공적 선언의 어조도 유지합니다. ‘보내졌음을’도 적절합니다.
  terminology: ‘이방인들’은 이 문맥의 τοῖς ἔθνεσιν에 적합하며, ‘하나님의 구원’은 τοῦ θεοῦ의 속격 의미를 성급히 한정하지 않습니다. ἀκούσονται는 ‘들을 것입니다’으로 옮겨 문맥상 수용의 뉘앙스를 암시하면서도 ‘듣다/귀 기울이다’의 여지를 보존합니다.
