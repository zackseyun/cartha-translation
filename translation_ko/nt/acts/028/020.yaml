  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 διὰ ταύτην οὖν τὴν αἰτίαν의 인과·추론 연결은 ‘그러므로 이런 이유로’보다 ‘그러므로 이러한 이유로’가 더 자연스럽고, παρεκάλεσα는 이 문맥에서 만남과 대화를 요청했다는 뜻을 분명히 하는 편이 좋습니다. ἅλυσιν과 περίκειμαι는 ‘이 사슬을 차고 있습니다’로 적절히 보존됩니다.
  naturalness: 초안의 ‘여러분을 만나 함께 이야기하기를 청했습니다’는 다소 문어적이고 ‘함께’가 원문에 없는 강조로 들릴 수 있습니다. ‘여러분을 뵙고 여러분과 이야기하려고 청했습니다’가 현대 표준어 합쇼체에서 자연스럽습니다. 끝의 닫는 인용 부호(」)는 제거해야 합니다.
  terminology: ‘이스라엘의 소망’은 τῆς ἐλπίδος τοῦ Ἰσραήλ의 압축적이고 신학적으로 열려 있는 표현을 잘 보존합니다. 이를 메시아나 부활로 본문에서 한정하지 않습니다. ‘사슬’도 단수 ἅλυσιν에 적절합니다.
  issues:
  - severity: medium
    issue: 본문 끝에 짝이 없는 닫는 인용 부호(」)가 있습니다.
    rationale: 인용의 시작 표지가 없고 원문에도 직접 인용이 아니므로 문장부호 오류입니다.
  - severity: low
    issue: ‘함께 이야기하기를 청했습니다’의 표현이 다소 부자연스럽고 ‘함께’는 원문에 명시되지 않습니다.
    rationale: 두 부정사 ἰδεῖν καὶ προσλαλῆσαι는 만남과 대화를 요청한 것으로 자연스럽게 옮길 수 있습니다.
  revised_text: 그러므로 저는 이러한 이유로 여러분을 뵙고 여러분과 이야기하려고 청했습니다. 이스라엘의 소망 때문에 제가 이 사슬을 차고 있기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘이스라엘이 바라는 소망’.
    reason: ‘이스라엘의 소망’은 소유·관련을 나타내는 속격 표현으로, 한국어에서 가능한 해석적 대안을 제시하되 본문은 원문의 압축성과 신학적 여지를 유지합니다.
  revision_rationale: 문법적 오류인 불필요한 닫는 인용 부호를 제거하고, 만남과 대화의 요청을 자연스러운 합쇼체로 다듬었습니다. ‘이스라엘의 소망’과 ‘사슬’은 원문의 어휘적·신학적 모호성을 보존하여 유지했습니다.
