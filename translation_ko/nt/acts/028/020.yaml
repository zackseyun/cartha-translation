  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ταύτην(‘이’)은 ‘이런’보다 ‘이’로 옮기는 편이 정확하며, 문장 끝의 닫는 인용 부호는 본문에 근거가 없습니다. ‘이스라엘의 소망’은 해석을 덧붙이지 않고 그대로 유지하는 것이 적절합니다.
  naturalness: ‘그러므로 이런 이유로’는 그리스어의 중복된 논리 표지를 반영하려 하나 한국어에서는 다소 부자연스럽습니다. ‘그러므로 바로 이 일 때문에’가 강조와 연결을 자연스럽게 살립니다. ‘함께 이야기하기’도 가능하나 ‘이야기를 나누다’가 현대 격식체 문맥에서 더 매끄럽습니다.
  terminology: ‘이스라엘의 소망’과 ‘사슬’은 적절합니다. ‘사슬을 차고 있습니다’는 구금 상태의 구체적 표상을 자연스럽게 전달하며, 신학적 의미를 한정하지 않습니다.
  issues:
