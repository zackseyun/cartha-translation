  naturalness: 초안도 전반적으로 자연스럽지만, ‘가이사랴에서 나에게로 보낸 사람’은 누가 보냈는지 문법적으로 잠시 불분명할 수 있습니다. 수동 표현인 ‘보내졌던’을 사용하면 현대 표준 한국어에서 더 명료하고 원문의 분사 의미도 잘 드러납니다.
  terminology: ‘가이사랴’는 통용되는 성경 지명 표기이며, ‘사람 셋’보다 ‘세 사람’이 이 문맥의 서술문에서 조금 더 자연스럽습니다. 합쇼체 종결도 유지했습니다.
