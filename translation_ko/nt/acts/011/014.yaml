  naturalness: ‘그가 너에게 말을 할 것이며, 그 말로 너와 네 온 집안이 구원을 받을 것입니다’는 현대 표준 한국어로 자연스럽고, 요청된 합쇼체 종결을 따릅니다. ‘온 집안’은 건물이 아니라 household를 가리키는 문맥에 알맞습니다.
