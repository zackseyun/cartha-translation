    issue: The draft adds ‘사람을’ after ‘욥바로.’
    rationale: The Greek imperative Ἀπόστειλον has no explicit object in this verse. Adding ‘people/men’ imports an object from the broader narrative rather than translating the stated text.
  - severity: medium
    issue: The draft does not render πῶς (‘how’).
    rationale: πῶς introduces the content/manner of the report and should be preserved.
  - severity: high
    issue: The translation has an uncompleted reporting construction and no formal-polite sentence ending.
    rationale: The draft ends after the direct command and lacks the completion of ‘그가 우리에게 알려 주기를.’
