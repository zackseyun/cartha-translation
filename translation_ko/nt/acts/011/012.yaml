  text: 성령께서 나에게 아무 차별도 두지 말고 그들과 함께 가라고 말씀하셨습니다.[a] 이 여섯 형제도 나와 함께 왔으며, 우리는 그 사람의 집에 들어갔습니다.
  philosophy: optimal-equivalence
