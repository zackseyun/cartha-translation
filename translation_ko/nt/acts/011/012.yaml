  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
  footnotes:
  - marker: a
    text: Or 'without hesitating' or 'without doubting.' The Greek participle can denote either not making a distinction or not wavering.
