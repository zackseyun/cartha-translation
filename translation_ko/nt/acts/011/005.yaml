  verdict: revise
  source_fidelity: The draft correctly conveys Peter's location, prayer, visionary state, the sheet-like object, its descent from heaven, and its arrival at Peter. However, "황홀경 중에" is less natural in this sentence than a verbal construction, and "큰 보자기 같은 것" does not explicitly retain the indefinite object sense of σκεῦός τι. "내 앞에까지" narrows ἄχρι ἐμοῦ ('as far as/to me') to a position in front of Peter.
  naturalness: The revised wording uses contemporary standard Korean in formal-polite 합쇼체. "황홀경에 빠져" is an established Korean rendering for the altered visionary state intended by ἐν ἐκστάσει, without reducing the following ὅραμα to the same concept.
  terminology: '"환상" appropriately renders ὅραμα. "황홀경" is retained as the familiar biblical term for ἔκστασις; it should not be replaced with "황홀한 상태," which can suggest merely an emotional experience. "보자기" naturally represents the large sheet image in Korean, while "어떤 물건" preserves the broad, indefinite σκεῦός τι.'
  issues:
  - severity: medium
    issue: The indefinite object term σκεῦός τι is underrepresented.
    rationale: '"큰 보자기 같은 것" gives the comparison but leaves out the text''s initial presentation of the item as an unspecified object. "큰 보자기 같은 어떤 물건" preserves both features.'
  - severity: low
    issue: '"내 앞에까지" is overly spatially specific.'
    rationale: ἦλθεν ἄχρι ἐμοῦ says that it came as far as Peter, not specifically that it stopped in front of him. "내게까지" is closer and natural.
  - severity: low
    issue: The phrase "황홀경 중에" is somewhat stiff.
    rationale: '"황홀경에 빠져" is a more idiomatic modern Korean verbal expression while retaining the established biblical term.'
  revised_text: 「내가 욥바 성에서 기도하고 있었는데, 황홀경에 빠져 환상을 보았습니다. 큰 보자기 같은 어떤 물건이 네 귀퉁이에 매달린 채 하늘에서 내려와 내게까지 이르렀습니다.
