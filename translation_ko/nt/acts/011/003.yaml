  text: 그들은 이렇게 말했습니다. 「당신은 무할례자들[a]이 있는 곳에 들어가 그들과 함께 음식을 먹었군요.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무할례를 받은 남자들’. ‘무할례자’는 당시 유대인의 관점에서 할례라는 언약 표지가 없는 사람들을 가리키며, 흔히 이방인을 뜻합니다.
    reason: ‘무할례자’라는 원문의 언약·사회적 경계 표현을 보존하면서, 독자가 이를 단순한 신체 묘사가 아니라 당시의 유대교적 범주로 이해하도록 돕습니다.
