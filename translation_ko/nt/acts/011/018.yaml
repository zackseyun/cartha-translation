revisions:
- from: 그들이 이 말을 듣고 잠잠해진 뒤에 하나님을 영화롭게 하며 말하였습니다. 「그러면 하나님께서 이방인들에게도 생명에 이르는 회개를 주셨구나.」
  to: 그들은 이 말을 듣고 잠잠해졌고 하나님께 영광을 돌리면서 말했습니다. “그렇다면 하나님께서 이방인들에게도 생명에 이르는 회개를 주셨습니다.”
  rationale: 병렬된 동사들의 관계를 보존하도록 ‘뒤에’를 제거하고, δοξάζω를 자연스러운 공적 성서 문체인 ‘하나님께 영광을 돌리다’로 옮겼습니다. 결론을 나타내는 Ἄρα는 ‘그렇다면’으로, 이방인까지 포함한다는 καί의 강조는 ‘이방인들에게도’로 반영했습니다. μετάνοιαν εἰς ζωήν의 의미 범위를 좁히지 않고 ‘생명에 이르는 회개’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
