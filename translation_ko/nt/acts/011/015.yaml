  source_fidelity: The draft accurately conveys the temporal setting, the Spirit's coming upon ‘them,’ and the comparison with the earlier event. However, καί in ὥσπερ καὶ ἐφ’ ἡμᾶς is left unexpressed; ‘우리에게도’ should retain the explicit ‘also’ in the comparison.
  naturalness: ‘말하기 시작할 때’ is a natural modern Korean rendering of the contemporaneous temporal construction and avoids unnecessarily choosing between ‘as’ and ‘when.’ Using ‘성령께서’ with the honorific predicate is consistent and natural in formal Korean Christian usage.
  terminology: ‘성령’ and ‘임하시다’ are standard, suitably formal Korean biblical terminology. The revision uses consistent honorific marking for the Holy Spirit without adding theological interpretation.
  issues:
