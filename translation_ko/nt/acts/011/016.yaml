    rationale: 원문의 ἐν은 여기서 ‘안에서’와 ‘으로/with’가 모두 가능한 것으로 논의됩니다. 본문에는 ‘성령 안에서’를 두고, ‘성령으로’를 대안 각주로 제시하는 것이 모호성을 더 잘 보존합니다.
  - severity: low
    issue: ‘너희는’과 ‘것이다’는 요청된 현대 합쇼체에 충분히 맞지 않습니다.
