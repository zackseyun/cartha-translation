    rationale: 원문은 ‘주님의 말씀을 기억했다’고 한 뒤 그 말씀이 무엇인지 인용합니다. 초안은 ‘말씀하시던 것’이 ‘기억났다’고 하여 주님의 말씀이라는 명사구와 인용 도입의 관계를 흐립니다.
