  source_fidelity: 초안은 기본 의미와 대조 구조를 대체로 보존합니다. 그러나 「주께서 말씀하시던 것이 기억났습니다」는 τοῦ ῥήματος τοῦ κυρίου(‘주님의 말씀’)와 ὡς ἔλεγεν(인용을 이끄는 ‘그가 말씀하신 것’)의 관계를 불분명하게 만들며, 한국어로도 자연스럽지 않습니다. 또한 ἐν πνεύματι ἁγίῳ를 ‘성령으로’로만 옮기면 가능한 처소적/영역적 뉘앙스가 본문에서 사라집니다.
  naturalness: ‘그때 저는 주님의 말씀이 생각났습니다. 주님께서는 이렇게 말씀하셨습니다’는 현대 표준 한국어의 합쇼체 서술로 자연스럽고, 회상과 인용의 관계를 명료하게 드러냅니다. 인용 안의 ‘여러분’과 ‘받게 될 것입니다’도 대상 독자에게 맞는 현대적 공손 문체입니다.
  terminology: κύριος는 ‘주님’, βαπτίζω는 ‘세례를 주다/세례를 받다’, πνεῦμα ἅγιον은 ‘성령’으로 일관되게 옮겼습니다. ἐν의 해석 가능성은 본문 ‘성령 안에서’와 각주 ‘성령으로’로 보존했습니다.
