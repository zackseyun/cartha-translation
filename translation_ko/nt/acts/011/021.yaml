  source_fidelity: 그리스어의 핵심 요소를 충실히 옮겼습니다. ‘주의 손’은 χεὶρ κυρίου의 성서적 비유를 보존하며, ‘그들과 함께하시매’는 μετ’ αὐτῶν의 동행·도우심을 자연스럽게 나타냅니다. ‘많은 사람이 믿고 주께 돌아왔습니다’는 πολύς ἀριθμὸς ὁ πιστεύσας 및 ἐπέστρεψεν ἐπὶ τὸν κύριον을 적절히 반영합니다.
  naturalness: 표준어 현대 한국어 합쇼체로 자연스럽고, ‘-하시매’는 지나치게 고어적이지 않으면서 성서 문맥에 알맞은 문어적 연결 표현입니다. 문장 흐름도 명료합니다.
  terminology: ‘주’, ‘주의 손’, ‘주께 돌아오다’는 사도행전의 관용적·신학적으로 절제된 표현을 잘 유지합니다. κύριος를 ‘예수님’ 또는 ‘하나님’으로 명시하지 않아 원문의 지시 대상에 관한 여지를 보존합니다.
