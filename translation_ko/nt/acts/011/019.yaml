  source_fidelity: ‘환난’은 θλῖψις의 넓은 의미를 잘 보존합니다. 다만 ‘스데반의 일로’는 ἐπὶ Στεφάνῳ의 관련·계기 관계를 다소 구어적으로 뭉뚱그리므로 ‘스데반과 관련하여’가 원문의 범위를 더 안전하게 보존합니다. 또한 ‘두루 다니면서’는 여러 지역을 돌아다닌다는 뉘앙스를 더하므로, 이동의 도달 범위를 나타내는 ἕως에 맞게 ‘…까지 이르렀으며’로 고쳤습니다.
  naturalness: 개정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘유대 사람’보다 성경 문맥과 일반적 현대 용례에 맞는 ‘유대인들’을 사용했으며, ‘이르렀으며’와 ‘전하였습니다’의 연결도 자연스럽습니다.
  terminology: ‘환난’은 본문의 폭넓은 θλῖψις를 유지하고, ‘말씀’은 사도행전의 반복적인 τὸν λόγον 표현을 보존합니다. ‘유대인들’은 Ἰουδαίοις의 복수 및 집단 지시를 적절히 반영합니다.
