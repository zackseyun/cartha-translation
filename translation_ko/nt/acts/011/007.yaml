  source_fidelity: 그리스어는 베드로가 자신에게 말하는 ‘한 음성’을 들었으며, 그 음성이 ‘일어나서, 베드로여, 잡아 죽여 먹으라’고 명령했다고 말합니다. 초안의 ‘잡아 먹어라’는 θῦσον(짐승을 잡아 죽이다/도살하다)의 죽임 요소를 충분히 드러내지 못합니다.
  naturalness: ‘말씀하시는 음성’은 자연스럽지만 화자를 신적으로 특정하는 뉘앙스를 더할 수 있습니다. ‘한 음성이 나에게 이렇게 말하는 것을’으로 옮기면 현대 한국어로 자연스럽고 원문의 비특정성을 보존합니다.
  terminology: θῦσον은 여기서 단순히 붙잡는다는 뜻보다 ‘잡아 죽이다/도살하다’의 뜻이므로 ‘잡아 죽여’가 적절합니다. 합쇼체 직접 명령으로 ‘일어나십시오 … 드십시오’를 사용했습니다.
  issues:
