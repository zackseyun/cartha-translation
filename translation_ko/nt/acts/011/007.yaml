    rationale: θῦσον은 제의적 ‘희생을 드리다’로 단정할 필요는 없지만, 동물을 죽여 먹으라는 명령을 포함합니다. ‘잡아 죽여 드십시오’가 그 의미를 보존합니다.
  - severity: low
    issue: ‘말씀하시는 음성’이 화자의 신적 지위를 문법적으로 암시할 수 있습니다.
    rationale: 원문은 단지 ‘나에게 말하는 한 음성’이라고 하므로, 비특정적인 서술로 옮기는 편이 더 직접적입니다.
