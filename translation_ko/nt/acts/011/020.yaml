  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
  footnotes:
  - marker: a
    text: Some manuscripts read 'Greeks' instead of 'Hellenists.' If that reading is original, the sense is that they were speaking to Gentiles, not only to Greek-speaking Jews.
    reason: textual_variant
translation:
  language: ko
  text: 그런데 그들 가운데에는 키프로스와 구레네 출신인 몇몇 남자가 있었습니다. 이들은 안디옥에 이르러 헬레니스트들에게도[a] 말하면서 주 예수에 관한 복음을 전하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 ‘헬레니스트들’ 대신 ‘그리스인들’이라고 되어 있습니다. 이 독법이 원문이라면, 그들은 그리스어를 쓰는 유대인들뿐 아니라 이방인들에게도 말한 것이라는 뜻입니다.
    reason: textual_variant
