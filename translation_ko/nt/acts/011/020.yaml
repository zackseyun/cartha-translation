review_pass:
  verdict: revise
  source_fidelity: 원문의 δέ는 강한 역접이라기보다 화제 전환에 가까우므로 ‘그러나’보다 ‘그런데’가 알맞습니다. ἄνδρες의 남성 지시, 키프로스·구레네 출신, 안디옥에 온 뒤의 행동, ἐλάλουν의 지속성, 그리고 SBLGNT 본문의 Ἑλληνιστάς를 반영했습니다. εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν은 주 예수를 복음의 내용으로 선포한다는 뜻으로 옮겼습니다.
  naturalness: 초안의 ‘키프로스와 키레네 사람 몇’은 현대 표준 한국어에서 다소 부자연스럽고, ‘말하며 … 전하였습니다’는 미완료 과거의 지속성을 충분히 드러내지 못합니다. ‘몇몇 남자가 있었습니다’와 ‘말하면서 … 전하고 있었습니다’가 자연스럽고 원문에 가깝습니다.
  terminology: ‘구레네’는 한국어 성경에서 널리 쓰이는 지명 표기입니다. Ἑλληνιστάς는 본문에서 해석을 앞당겨 ‘헬라어를 쓰는 사람들’로 단정하기보다 음역한 ‘헬레니스트들’로 두고, 중요한 이문 Ἕλληνας 및 통상적 의미를 각주로 밝혀야 합니다. ‘주 예수’는 그리스도론적 호칭을 보존합니다.
  issues:
  - severity: medium
    issue: 본문의 ‘헬라어를 쓰는 사람들’이 Ἑλληνιστάς의 기술적 명칭과 주요 이문을 본문 차원에서 충분히 보존하지 못합니다.
    rationale: SBLGNT의 독법은 Ἑλληνιστάς이며, 일부 사본의 Ἕλληνας(그리스인들)는 내러티브상 의미 차이가 큽니다. 본문은 ‘헬레니스트들’로 유지하고 이문을 각주로 제시하는 것이 안전합니다.
  - severity: low
    issue: ‘그러나’와 단순 과거 표현이 각각 δέ의 담화 기능 및 ἐλάλουν의 미완료상을 다소 과도하게 또는 약하게 처리합니다.
    rationale: ‘그런데’와 진행 표현이 원문의 연결 및 지속적 활동을 더 충실히 반영합니다.
