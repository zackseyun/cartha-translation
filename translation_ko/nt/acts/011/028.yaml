  terminology: ‘성령’은 사도행전의 이 예언 문맥에 적절합니다. λιμός에는 현대 한국어에서 일반적인 ‘기근’을 사용했습니다. ‘온 세상’은 οἰκουμένη의 넓은 의미를 유지하며, 로마 세계라는 문맥적 가능성은 각주에서 밝혔습니다. ‘글라우디오’는 통용되는 한국어 음역입니다.
