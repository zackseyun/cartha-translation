  source_fidelity: 수정안은 εἷς ἐξ αὐτῶν을 ‘그들 가운데 한 사람’으로 명시하고, ἀναστάς, διὰ τοῦ πνεύματος, 미래의 기근, ἐπὶ Κλαυδίου의 시간 표현을 충실히 반영합니다. οἰκουμένη의 범위는 본문에서 과도하게 한정하지 않고 각주로 보존합니다.
