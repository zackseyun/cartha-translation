  source_fidelity: The location phrase οἱ ὄντες κατὰ τὴν Ἰουδαίαν syntactically modifies ‘the brothers,’ not both ‘the apostles and the brothers.’ The draft’s initial Korean modifier can naturally be read as qualifying both coordinated groups. The revised word order preserves the Greek attachment. ‘이방인들,’ ‘하나님의 말씀,’ and ‘받았다’ accurately convey the principal lexical content.
  naturalness: The revised sentence is natural, formal-polite Korean and avoids an unnecessary comma between the compound subject and predicate.
  terminology: 사도들, 형제들, 이방인들, and 하나님의 말씀 are established, contextually appropriate Korean biblical terms. A note explains the likely broader representative reference of 형제들 without replacing the masculine lexical form.
  issues:
