    issue: Modifier attachment of ‘유대 곳곳에 있는’
    rationale: Placed before ‘사도들과 형제들이,’ the Korean phrase can modify both nouns, whereas the Greek participial phrase follows and modifies only οἱ ἀδελφοί (‘the brothers’).
  revised_text: 사도들과 유대 곳곳에 있는 형제들이 이방인들도 하나님의 말씀을 받았다는 소식을 들었습니다.
