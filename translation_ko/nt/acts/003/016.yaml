review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the twofold reference to Jesus' name, the unspecified referent of faith, and the public character of the healing. However, '완전한 회복' adds a recovery-oriented nuance not expressed by ὁλοκληρία, which denotes complete soundness or health.
  naturalness: The Korean is generally clear and maintains modern formal-polite register. '그분으로 말미암는 믿음' is understandable but is less direct and slightly more archaic in tone than '그분을 통한 믿음.'
  terminology: Rendering ὁλοκληρία as '온전한 건강' more directly conveys bodily soundness/completeness without importing an additional restoration metaphor. '강하게 하였습니다' retains the concrete force of ἐστερέωσεν while remaining natural in context.
  issues:
  - severity: medium
    issue: '''완전한 회복'' for ὁλοκληρία'
    rationale: The Greek names the resulting condition—complete soundness/health—not specifically a process or concept of recovery. '온전한 건강' better preserves the lexical sense.
  - severity: low
    issue: '''그분으로 말미암는 믿음'' is somewhat marked'
    rationale: The phrase can be understood correctly, but '그분을 통한 믿음' is more natural contemporary formal Korean and leaves the Greek ambiguity about the faith's precise relation to Jesus intact.
  revised_text: 그분의 이름에 대한 믿음에 근거하여, 그분의 이름이 여러분이 보고 알고 있는 이 사람을 강하게 하였습니다. 또 그분을 통한 믿음이 여러분 모두 앞에서 이 사람에게 이 온전한 건강을 주었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그분의 이름을 신뢰함’. 그리스어 피스티스는 ‘믿음’, ‘신뢰’, 그리고 일부 문맥에서는 ‘신실함’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘완전한 건전함’ 또는 ‘완전한 건강’.
    reason: lexical_alternative
  revision_rationale: ‘온전한 건강’으로 고쳐 ὁλοκληρία의 결과 상태를 더 직접적으로 옮겼습니다. 또한 ‘그분을 통한 믿음’은 δι’ αὐτοῦ의 간결함과 해석상의 여지를 유지하면서 현대 표준 한국어에서 더 자연스럽습니다. 각주에는 πίστις와 ὁλοκληρία의 주요 어휘 대안을 보존했습니다.
