  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
  footnotes:
  - marker: a
    text: Or 'trust in his name.' The Greek word pistis can mean 'faith,' 'trust,' or in some contexts 'faithfulness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'complete soundness' or 'perfect health.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his name has made strong'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분의 이름을 믿는 믿음으로, 그분의 이름이 여러분이 보고 알고 있는 이 사람을 굳세게 하였습니다. 그리고 그분을 통한 믿음이 여러분 모두 앞에서 이 사람에게 이 온전한 회복을 주었습니다.
  philosophy: optimal-equivalence
