    rationale: '''그분의 이름에 대한 믿음''도 이해되나, ''그분의 이름을 믿는 믿음''이 한국어의 자연스러운 목적 관계를 더 분명히 나타냅니다.'
  - severity: low
    issue: δι’ αὐτοῦ의 표현
    rationale: '''그분으로 말미암는''은 가능하지만 다소 경직됩니다. ''그분을 통한''은 그리스어의 매개·근원 관계를 유지하면서도 주체나 작용 방식을 과도하게 해석하지 않습니다.'
  - severity: low
