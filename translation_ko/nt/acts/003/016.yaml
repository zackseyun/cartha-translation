  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 첫 구절의 '그분의 이름에 대한 믿음'은 가능하지만 한국어에서는 '그분의 이름을 믿는 믿음'이 더 자연스럽고, δεύτερη '믿음'의 δι’ αὐτοῦ는 '그분을 통한'으로 옮겨 매개·근원의 여지를 유지하는 편이 좋습니다. ταύτην의 지시성도 '이 온전한 회복'으로 드러내는 것이 적절합니다.
  naturalness: 초안은 합쇼체와 현대 표준어에 맞습니다. 그러나 '그분으로 말미암는 믿음'은 다소 문어적이고 결속이 약하게 들릴 수 있어 '그분을 통한 믿음'이 더 간결하고 자연스럽습니다. '완전한 회복'보다 '온전한 회복'이 ὁλοκληρία의 건강·완전성의 뜻을 더 잘 보존합니다.
  terminology: '''이름''을 그대로 유지하여 예수의 이름이라는 누가의 강조와 환유적 표현을 보존합니다. ''믿음''도 유지하며, 그 믿음의 주체를 특정하지 않습니다.'
  issues:
