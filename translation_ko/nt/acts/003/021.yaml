  source_fidelity: 초안은 οὐρανὸν ... δέξασθαι를 ‘하늘은 ... 받아 두어야 합니다’로 적절히 옮겼습니다. 그러나 ‘하나님께서 ... 말씀하신 만물을 회복하실 때’는 하나님이 만물을 회복하신다는 뜻으로 읽히며, 원문의 ‘하나님께서 ... 말씀하신 모든 것의 회복’이라는 수식 관계를 바꿉니다.
  naturalness: ‘모든 것의 회복의 때까지’는 현대 표준 한국어에서 자연스럽고, 원문의 복수 χρόνοι(때들)의 의미도 ‘때까지’라는 집합적 표현으로 무리 없이 반영합니다. ‘받아 두어야 합니다’는 문맥상 그분이 하늘에 머무심을 나타내는 자연스러운 표현입니다.
  terminology: ‘거룩한 예언자들’, ‘옛적부터’, ‘회복’은 각각 τῶν ἁγίων ... προφητῶν, ἀπ’ αἰῶνος, ἀποκαταστάσεως에 충실합니다. ‘모든 것’은 πάντων의 범위를 보존하며 특정 교리적 해석을 덧붙이지 않습니다.
  issues:
  - severity: high
    issue: ‘하나님께서 ... 말씀하신 만물을 회복하실 때’의 수식 관계
    rationale: 원문은 ‘하나님께서 예언자들을 통해 말씀하신 모든 것의 회복’(ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεός)입니다. 초안은 관계절을 ‘만물’이 아니라 ‘회복하실’에 연결하여, 하나님이 회복 행위의 직접 주체라는 별도의 명제를 만들 수 있습니다.
