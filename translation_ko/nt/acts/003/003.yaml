  verdict: revise
  source_fidelity: ‘구제를 청하기’는 ἐλεημοσύνην λαβεῖν(구제금을 받다)의 뜻을 충분히 구체화하지 못합니다. ‘구제금을 달라고 청하다’는 그가 받기 위해 요청했다는 의미를 명확히 드러냅니다. ἠρώτα의 미완료 과거는 ‘청하고 있었습니다’로 진행성을 자연스럽게 반영했습니다.
  naturalness: ‘성전 경내로 들어가려는 것을 보고’와 ‘구제금을 달라고 청하고 있었습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 명료합니다.
  terminology: ἱερόν은 내전인 ναός가 아니라 성전 구역 전체를 가리키므로 본문에서는 ‘성전 경내’로 옮겼습니다. ἐλεημοσύνη는 이 문맥에서 ‘구제금’이 적절합니다. 인명 ‘베드로’, ‘요한’은 관례적 표기를 유지했습니다.
  issues:
  - severity: medium
    issue: ‘구제를 청하기 시작하였습니다’의 목적어 및 의미가 불명확합니다.
    rationale: 원문의 ‘구제금을 받기 위해 청하다’에서 구체적인 금품을 요청한 의미가 약화됩니다. 또한 ‘청하기 시작하였다’는 가능한 해석이지만, 미완료 과거의 진행성을 단정적으로 개시 의미로 좁힐 필요는 없습니다.
  - severity: low
    issue: ἱερόν의 성전 경내 의미가 본문에 반영되지 않았습니다.
    rationale: ‘성전’만으로도 문맥상 가능하지만, 여기서는 성전 건물의 내부 성소가 아니라 성전 구역으로 들어가는 장면이므로 ‘성전 경내’가 더 정확합니다.
  revised_text: 그는 베드로와 요한이 성전 경내로 들어가려는 것을 보고, 구제금을 달라고 청하고 있었습니다.
