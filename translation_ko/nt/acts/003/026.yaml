source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
  footnotes:
  - marker: a
    text: Or 'having raised up' may mean 'having brought forth/appointed' his servant, not specifically 'having raised him from the dead.'
    reason: alternative_reading
  - marker: b
    text: Or 'his child'; Greek παῖς can mean 'servant' or 'child,' though 'servant' likely reflects the Isaiah Servant background here.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서는 자신의 종[b]을 일으키시고[a], 여러분 각 사람을 여러분의 악한 행실에서 돌이키게 하심으로 여러분에게 복을 주시려고 그를 먼저 여러분에게 보내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일으키시고’는 ‘부활시키시고’로도, 또는 자신의 종을 세우시고/일으켜 보내셨다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 파이스는 ‘종’ 또는 ‘자녀’를 뜻할 수 있습니다. 여기서는 이사야의 ‘종’ 배경을 반영하여 ‘종’으로 옮겼습니다.
    reason: lexical_alternative
