    text: 또는 “백성 가운데서 끊어질 것입니다.”
    reason: ‘끊어지다’는 신명기 배경의 ‘cut off’라는 관용적 대안을 반영합니다. 본문은 ἐξολεθρευθήσεται의 더 강한 파괴·제거의 뉘앙스를 따라 ‘완전히 멸절될 것입니다’로 옮깁니다.
