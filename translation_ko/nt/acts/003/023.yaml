review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the indefinite universal subject, the specific prophet, and removal from the people. However, its plain-style ending does not meet the required modern formal-polite register, and ‘완전히 끊어질 것이다’ is less natural Korean while only partially conveying the destructive force of ἐξολεθρευθήσεται. The source’s ambiguity concerning the mode and timing of judgment is retained.
  naturalness: ‘사람은 누구든지’ is understandable but redundant; ‘사람은 누구나’ is smoother. ‘백성 가운데서 완전히 멸절될 것입니다’ is natural enough in formal biblical Korean and expresses severe destruction/removal without defining it as temporal, ecclesial, or final judgment.
  terminology: ‘그 예언자’ appropriately reflects τοῦ προφήτου ἐκείνου without interpretive capitalization or doctrinal expansion. ‘백성 가운데서’ preserves ἐκ τοῦ λαοῦ. A lexical-alternative footnote should be anchored to retain the audit-trail option ‘cut off from among the people.’
  issues:
  - severity: medium
    issue: Register mismatch
    rationale: The required target register is modern formal-polite 합쇼체, but ‘것이다’ is plain declarative. It should be ‘것입니다.’
  - severity: medium
    issue: Judgment verb is not optimally natural or forceful
    rationale: ‘완전히 끊어질 것이다’ can suggest only exclusion and is stylistically less natural here. ἐξολεθρευθήσεται denotes thorough destruction/removal; ‘완전히 멸절될 것입니다’ better preserves that force while leaving the judgment’s precise nature unspecified.
  - severity: low
    issue: Lexical-alternative footnote lacks an anchor
    rationale: The English audit trail preserves ‘cut off from among the people’ as a legitimate alternative. Adding a Korean anchor and equivalent footnote maintains that transparency.
  revised_text: 그 예언자의 말을 듣지 않는 사람은 누구나 백성 가운데서 완전히 멸절될 것입니다.[a]』
  revised_footnotes:
