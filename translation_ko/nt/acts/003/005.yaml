  source_fidelity: 초안은 ἐπεῖχεν을 ‘주의를 기울이며’로, προσδοκῶν과 λαβεῖν을 ‘기대하였습니다/받을 것’으로 대체로 충실하게 옮깁니다. 그러나 문두의 ‘그래서’는 δέ의 가벼운 서술 연결을 인과 관계로 강화할 수 있습니다. 또한 ‘그들에게서’는 παρά + 속격이 나타내는 출처를 더 분명히 드러냅니다.
  naturalness: ‘그러자 그는 그들에게 주의를 기울이며 그들에게서 무엇인가 받기를 기대하였습니다’는 현대 표준 한국어의 자연스러운 합쇼체 서술이며, 원문의 지속적인 주의와 기대의 동시성을 보존합니다.
  terminology: 특수 신학 용어는 없습니다. ‘무엇인가’는 τι의 비특정성을, ‘받기’는 λαβεῖν의 맥락상 수령 의미를 적절히 반영합니다.
