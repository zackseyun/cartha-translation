id: ACT.3.25
reference: Acts 3:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
  footnotes:
  - marker: a
    text: Or 'children'; Greek 'sons,' a covenant-heir expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'seed.' The Greek can refer collectively to Abraham's descendants and, in biblical-theological context, can also carry a singular representative sense.
    reason: alternative_reading
translation:
  language: ko
  text: 여러분은 예언자들과, 하나님께서 여러분의 조상들과 맺으시고 아브라함에게 “네 후손[b] 안에서 땅의 모든 족속이 복을 받을 것이다”라고 말씀하신 언약의 자손[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 ‘아들들’입니다. 여기서는 예언자들의 약속과 언약의 상속에 참여하는 이들을 가리키는 표현이며, 반드시 예언자들의 생물학적 후손만을 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘씨’. 헬라어는 집합적으로 아브라함의 후손들을 가리킬 수 있으며, 단수의 대표적 의미도 배제하지 않습니다.
    reason: alternative_reading
