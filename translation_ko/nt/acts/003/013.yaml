  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
  footnotes:
  - marker: a
    text: Or "his child Jesus." The Greek word παῖς can mean either "child" or "servant"; here "servant" is preferred because of the likely echo of Isaiah's Servant language.
    reason: alternative_reading
translation:
  language: ko
  text: 아브라함과 이삭과 야곱의 하나님, 우리 조상들의 하나님께서 그분의 종 예수를[a] 영광스럽게 하셨습니다. 그러나 여러분은 빌라도가 그를 놓아주기로 결정하였을 때에도, 그를 넘겨주고 빌라도 앞에서 부인하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 παῖς는 「종」 또는 「자녀」를 의미할 수 있다. 이사야의 「종의 노래」를 반향하므로 「종」으로 옮긴다.
    reason: alternative_reading
