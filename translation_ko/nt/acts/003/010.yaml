  source_fidelity: 개정안은 ἐπεγίνωσκον을 ‘알아보았습니다’로, ‘바로 그 사람’으로 οὗτος의 지시·강조를 반영합니다. ‘…에 앉아 구걸하던’은 ὁ … καθήμενος와 ἐλεημοσύνην의 구체적 의미를 보존하며, ‘놀라움과 경악으로 가득 찼습니다’는 ἐπλήσθησαν θάμβους καὶ ἐκστάσεως를 충실히 옮깁니다.
