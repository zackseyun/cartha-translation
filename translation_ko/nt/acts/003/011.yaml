  source_fidelity: 그리스어의 κρατοῦντος는 베드로와 요한을 붙잡고 있는 동작을 나타내며, 초안의 ‘매달려 있는’은 가능한 해석이지만 다소 강하고 정서적인 뉘앙스를 더합니다. 또한 ἐπὶ τῇ στοᾷ는 그들이 있던 장소를 나타내는데, 초안의 ‘...곳으로 그들을 향해’는 이동 방향과 장소 관계가 어색하게 겹칩니다.
  naturalness: ‘솔로몬의 행각이라 불리는 곳으로 그들을 향해 함께 달려왔습니다’는 한국어에서 수식 관계가 불명확합니다. ‘그곳에 있는 그들에게 일제히 달려왔습니다’로 하면 장소와 대상이 자연스럽고 분명해집니다.
  terminology: ‘베드로’, ‘요한’, ‘솔로몬’, ‘행각’은 표준적인 성경 및 건축 용어 사용입니다. ‘붙잡고’는 여기서 물리적으로 붙들고 있음을 무리 없이 전달합니다.
  issues:
  - severity: medium
    issue: ‘매달려 있는’이 κρατέω의 의미보다 다소 강하게 들릴 수 있습니다.
    rationale: κρατέω는 붙잡다, 꽉 잡고 있다를 뜻하며 ‘매달리다’도 가능한 문맥적 표현이지만, 원문의 표현 범위를 좁히고 의존적·정서적 뉘앙스를 보탤 수 있습니다.
  - severity: medium
    issue: 장소와 이동 대상의 관계가 불명확합니다.
    rationale: 원문은 사람들이 ‘솔로몬의 행각에서’ 베드로와 요한에게 달려간다는 뜻입니다. 초안의 ‘곳으로 그들을 향해’는 한국어 어순상 장소와 사람 모두를 방향 보어로 처리하여 어색합니다.
