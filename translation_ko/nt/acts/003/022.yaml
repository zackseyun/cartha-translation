  text: 모세는 참으로 이렇게 말하였습니다. 『주 하나님께서 여러분의 형제들 가운데서 나와 같은 예언자 한 분을 여러분을 위하여 일으키실 것입니다. 그가 여러분에게 말씀하시는 모든 것을 들어야 합니다.』
  philosophy: optimal-equivalence
