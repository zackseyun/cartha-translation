    rationale: 초안은 『로 인용을 시작하지만 해당 인용을 닫지 않아 구조적으로 불완전합니다.
  - severity: low
    issue: 각주 앵커의 내용상 위치 조정 필요
    rationale: ‘형제들’의 어휘·맥락 대안은 ‘모세는 말하였습니다’가 아니라 ‘형제들’에 붙는 것이 적절하며, 신명기와의 문구 차이는 ‘주 하나님’에 붙이는 것이 명확합니다.
  revised_text: 모세는 이렇게 말하였습니다. “주 하나님께서 여러분의 형제들[a] 가운데서 나와 같은 예언자 한 분을 여러분을 위해 일으키실 것입니다. 여러분은 그가 여러분에게 말씀하시는 모든 것을 들어야 합니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘여러분의 동족 이스라엘 사람들’. 그리스어는 ‘여러분의 형제들’이라고 하며, 여기서는 언약 공동체 안의 대표적 친족 관계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 사도행전은 여기서 신명기 18:15을 약간 다르게 인용합니다. 특히 사도행전의 그리스어 본문은 ‘주 너희 하나님’이 아니라 ‘주 하나님’이라고 합니다.
