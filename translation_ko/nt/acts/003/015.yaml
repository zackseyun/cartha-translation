  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
  footnotes:
  - marker: a
    text: Or 'Prince of life,' 'Leader of life,' or 'Founder of life.' The Greek ἀρχηγός can carry senses of origin, leadership, or preeminence.
