translation:
  language: ko
  text: 그러나 여러분은 생명의 창시자[a]를 죽였습니다. 하나님께서는 그분을 죽은 자들 가운데서 일으키셨으며, 우리는 이 일의 증인입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἀρχηγός는 「창시자」, 「인도자」, 「선구자」 등의 의미 폭을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「우리는 그분의 증인입니다.」 헬라어는 부활하신 분 자신이나 그분의 부활 사건을 가리킬 수 있습니다.
    reason: alternative_reading
