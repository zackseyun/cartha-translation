review_pass:
  verdict: revise
  source_fidelity: 핵심 대조(행위가 아니라 자비), 구원, 거듭남의 씻음, 성령과 연관된 새롭게 하심은 보존되어 있습니다. 그러나 초안의 「우리가 의 가운데서 행한 행위」는 헬라어의 수식 관계를 어색하게 드러내며, 「행위로부터」는 여기서 근거나 기준을 나타내는 ἐξ의 문맥상 기능에 자연스럽지 않습니다. 또한 강조된 ἡμεῖς는 「친히」로 명시하는 편이 좋습니다.
  naturalness: 「그분께서 … 구원하셨습니다 — … 통하여」라는 도치와 대시 구성이 한국어 합쇼체 산문에서는 다소 부자연스럽습니다. 주절을 끝에 두고 「~ 때문이 아니라, … 따라」의 대조를 이루면 현대 표준어에서 명료하고 자연스럽습니다.
  terminology: 「구원」「자비」「거듭남」「성령」은 적절합니다. 「의롭게 행한 행위」는 ἐν δικαιοσύνῃ의 의미를 자연스럽게 반영하면서 「정의」라는 대안도 각주에 남깁니다. 본문은 성령의 행위성을 자연스럽게 나타내되, 소유격으로도 옮길 수 있는 구문의 여지는 각주로 보존합니다.
  issues:
  - severity: medium
    issue: 「우리가 의 가운데서 행한 행위로부터」가 어색하고 ἐξ의 문맥상 기능을 충분히 반영하지 못함
    rationale: 이 구절의 ἐξ는 구원의 근거·기준을 부정하는 대조에 놓입니다. 「우리가 친히 의롭게 행한 행위 때문이 아니라」가 한국어에서 자연스럽고, 수식 관계 및 강조된 ἡμεῖς를 보존합니다.
  - severity: medium
    issue: 각주 c가 본문과 동일한 표현을 대안으로 제시함
    rationale: 본문의 「성령의 새롭게 하심」과 각주의 대안이 동일하여 대안 독법을 제공하지 못합니다. 본문을 「성령으로 말미암는 새롭게 하심」으로 하고, 소유격적 연결을 대안으로 제시하면 구문의 여지를 정확히 보존합니다.
  - severity: low
    issue: 대시를 통한 후치된 수단구가 한국어 문장 흐름을 저해함
    rationale: 수단구를 「구원하셨습니다」 앞에 배치하면 합쇼체의 완결된 문장으로 자연스럽습니다.
  revised_text: 그분께서는 우리가 친히 의롭게 행한 행위 때문이 아니라, 자신의 자비를 따라 거듭남의 씻음[b]과 성령으로 말미암는 새롭게 하심[c]을 통하여 우리를 구원하셨습니다.
  revised_footnotes:
