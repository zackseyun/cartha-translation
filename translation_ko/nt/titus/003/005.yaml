    text: 또는 「정의 가운데서 행한 일들」. 헬라어 δικαιοσύνη는 「의」 또는 「정의」를 의미할 수 있으며, 바울의 용례에서는 본문에 「의」를 둡니다.
    reason: lexical_alternative
