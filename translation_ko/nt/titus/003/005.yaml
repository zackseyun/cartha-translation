    text: 「씻음」은 세례나 정결의 상징, 또는 그 둘 모두를 가리킬 수 있습니다. 헬라어 자체는 번역자가 이 해석상의 결정을 본문에서 명시하도록 요구하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「성령의 새롭게 하심」. 헬라어 구문은 「성령」을 「새롭게 하심」의 행위자로 나타내거나, 소유격 관계로 옮길 여지를 둡니다.
