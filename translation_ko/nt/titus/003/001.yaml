review_pass:
  verdict: revise
  source_fidelity: 핵심 구조는 잘 반영되어 있으나, πειθαρχεῖν은 여기서 통치 권위에 ‘순종하다/따르다’라는 뜻이므로 ‘순응하며’보다 ‘순종하며’가 더 직접적입니다. 기존 각주는 ὑποτάσσεσθαι를 ‘굴복하다’로 과도하게 강하게 옮기고, 본문의 종속 구문을 독립 명령으로 바꾸므로 수정이 필요합니다.
  naturalness: 합쇼체의 ‘일깨워 주십시오’와 종결 구조는 자연스럽습니다. 두 동사의 병렬을 살리기 위해 쉼표를 두고 ‘복종하고 순종하며’로 옮기는 것이 현대 표준어에서도 명료합니다.
  terminology: ἀρχαῖς ἐξουσίαις는 시민 통치 문맥에서 ‘통치자들과 권세자들’로 옮길 수 있습니다. ὑποτάσσεσθαι는 ‘복종하다’, πειθαρχεῖν은 ‘순종하다’로 구별해 두 동사의 병렬을 보존합니다. ‘모든 선한 일’은 ἔργον ἀγαθόν에 적절합니다.
  issues:
  - severity: medium
    issue: πειθαρχεῖν의 번역이 ‘순응하며’로 되어 있음
    rationale: ‘순응하다’도 문맥상 가능하지만 πειθαρχεῖν의 권위에 대한 복종·순종의 뜻을 충분히 드러내지 못합니다. ‘순종하며’가 더 직접적이며 영어 POB의 ‘to be obedient’에도 부합합니다.
  - severity: medium
    issue: 각주의 ‘굴복하고 순종하라’
    rationale: ‘굴복하다’는 ὑποτάσσεσθαι보다 강한 항복의 뉘앙스를 더하며, 본문의 ‘일깨워 주십시오’에 의존하는 부정사 구조를 독립 명령으로 변경합니다.
  revised_text: 그들에게 통치자들과 권세자들에게 복종하고, 순종하며, 모든 선한 일에 준비되어 있어야 함을 일깨워 주십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「통치자들과 권세에 복종하고 순종하며」.
    reason: lexical_alternative
  revision_rationale: πειθαρχεῖν을 ‘순종하며’로 바로잡고, 각주에서 ‘굴복하다’와 독립 명령형을 제거했습니다. 본문은 원문의 병렬된 부정사들과 ‘모든 선한 일에 준비되어 있다’는 상태 표현을 유지합니다.
