review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the ongoing imperative to Titus, the paired civic referents (ἀρχαῖς ἐξουσίαις), the two infinitives for submission and obedience, and readiness for every good work. However, the footnote's ‘굴복하고’ is stronger than ὑποτάσσεσθαι and should not be presented as a lexical alternative.
  naturalness: The main sentence is generally natural in formal-polite Korean. Changing ‘모든 선한 일에 준비되어’ to ‘모든 선한 일을 할 준비가 되어’ is more idiomatic and makes the readiness construction clear without adding substantive interpretation.
  terminology: ‘통치자들과 권세자들’ retains the source's paired terms and fits biblical formal register. ‘복종하고 순종하며’ appropriately renders the closely related but distinct Greek verbs. The alternative ‘굴복하고’ should be replaced with ‘복종하고,’ since ‘굴복’ implies being overcome or forced to yield.
  issues:
  - severity: medium
    issue: Footnote a renders ὑποτάσσεσθαι as ‘굴복하고’.
    rationale: ‘굴복하다’ carries a coercive, defeat-oriented sense not required by the Greek middle/passive infinitive, which here calls for being subject/submitting to civic rulers. It overstates the source.
  - severity: low
    issue: ‘모든 선한 일에 준비되어’ is slightly less idiomatic than an action-oriented readiness phrase.
    rationale: The Greek πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι means being ready for every good work. ‘모든 선한 일을 할 준비가 되어’ expresses this naturally in Korean while retaining the full scope.
  revised_text: 그들에게 통치자들과 권세자들에게 복종하고 순종하며, 모든 선한 일을 할 준비가 되어 있어야 한다고 일깨워 주십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「통치자들과 권세자들에게 복종하고 순종하라」.
    reason: lexical_alternative
  revision_rationale: The main text is retained in its source-faithful formal register, with a minor idiomatic clarification of readiness for good works. The footnote is corrected to remove the overly forceful ‘굴복하다’ and to give a valid alternative imperative-style rendering of the infinitive sequence.
