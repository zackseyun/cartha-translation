  source_fidelity: 그리스어 σπουδαίως πρόπεμψον은 두 사람을 여행길에 필요한 지원을 갖추어 힘써 보내라는 뜻이며, 초안의 핵심 의미는 대체로 충실합니다. 그러나 두 번째 문장인 “그들에게 부족한 것이 하나도 없게 하려는 것입니다”는 ἵνα 목적절을 설명문처럼 바꾸어 명령의 직접성과 문장 연결을 약화합니다.
  naturalness: “여정을 힘써 도와 보내십시오”도 이해되지만, “여행길을 힘써 도와 보내십시오”가 προπέμπω의 여행 지원 의미를 더 자연스럽고 분명하게 드러냅니다. 목적절은 “그들에게 아무것도 부족하지 않도록”으로 처리하는 것이 현대 표준 한국어와 합쇼체 성경 문체에 자연스럽습니다.
  terminology: τὸν νομικόν은 여기서 법률 전문인을 가리킬 수 있으나 유대 율법 전문가라는 뜻도 배제되지 않습니다. 한국어 성경의 관습적이고 모호성을 보존하는 “율법사 세나”는 유지할 수 있습니다. “아볼로”도 통용 표기입니다.
