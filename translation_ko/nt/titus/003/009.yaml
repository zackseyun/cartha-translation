  source_fidelity: 「족보 따지기」는 γενεαλογίας(‘족보들/계보들’) 자체를 ‘그것을 따지는 행위’로 해석하여 본문에 더합니다. 본문은 해당 표현을 일반적으로 유지하는 편이 원문의 범위와 영어 POB의 판단에 더 충실합니다. 또한 νομικάς는 법정 소송을 뜻하는 ‘법적’이라기보다 율법과 관련된 것을 가리키므로 각주 표현을 조정해야 합니다.
  naturalness: 전반적으로 합쇼체이며 자연스럽습니다. 다만 열거 항목을 명사형으로 통일한 「족보」가 더 간결하고, 「피하십시오」는 명령형 περιΐστασο를 자연스럽게 옮깁니다.
  terminology: νόμος는 문맥상 「율법」으로 유지할 수 있습니다. 「무익하고 헛되다」는 ἀνωφελεῖς καὶ μάταιοι를 적절히 반영합니다. 각주의 「법적 싸움들」은 법률·소송의 뉘앙스를 유발할 수 있어 「율법과 관련된 싸움들」로 고칩니다.
  issues:
  - severity: medium
    issue: 「족보 따지기」가 γενεαλογίας를 해석적으로 확장함
    rationale: 원문은 ‘족보들/계보들’을 말할 뿐, 본문에서 ‘따지기’라는 행위를 명시하지 않습니다. 역사적·해석적 특정화를 피하려면 명사 표현을 유지해야 합니다.
  - severity: medium
    issue: 각주 b의 「법적 싸움들」이 νομικὰς의 의미를 좁힐 수 있음
    rationale: 여기서는 소송이나 법률상의 싸움보다는 율법에 관련된 다툼이라는 뜻이 적절합니다.
  - severity: low
    issue: 각주 a가 ζήτησις를 단수로 제시함
    rationale: 본문은 ζητήσεις 복수형입니다. 사전 표제어를 의도한 것이라면 가능하지만, 본문 어형을 설명하는 각주에서는 복수형을 반영하는 편이 명확합니다.
  revised_text: 그러나 어리석은 논쟁과 족보와 다툼과 율법에 관한 싸움은 피하십시오. 그것들은 무익하고 헛되기 때문입니다.
