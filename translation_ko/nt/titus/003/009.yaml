review_pass:
  verdict: revise
  source_fidelity: ‘족보 따지기’는 γενεαλογίας(‘족보들/계보들’) 자체를 ‘족보를 따지는 행위’로 해석하여 옮긴 표현입니다. 본문은 그 의미를 더 특정하지 않으므로 ‘족보들’로 보존하는 것이 더 충실합니다. 또한 νομικὰς는 문맥상 ‘율법에 관한’으로 자연스럽게 풀 수 있습니다.
  naturalness: 합쇼체 명령문 ‘피하십시오’는 자연스럽고, 병렬 항목을 ‘논쟁, 족보, 다툼, 율법에 관한 싸움’으로 제시해도 현대 표준어에서 명료합니다.
  terminology: ‘율법’은 νόμος 계열에 대한 일관된 용어로 적절합니다. ‘무익하고 헛되다’도 ἀνωφελεῖς καὶ μάταιοι를 잘 반영합니다. 각주 a의 ‘공허한 사변’은 본문 어휘보다 해석을 더하므로 더 중립적인 대안으로 조정합니다.
  issues:
  - severity: medium
    issue: ‘족보 따지기’가 γενεαλογίας를 해석적으로 확장함
    rationale: ‘족보 따지기’는 족보 자체가 아니라 족보를 따지는 행위를 뜻합니다. 원문은 논쟁의 성격을 단정하지 않고 ‘족보들’을 병렬하므로, 역사적·해석적 특정화를 피한 명사형 번역이 적절합니다.
  - severity: low
    issue: 각주 a의 대안 ‘공허한 사변’이 과도하게 해석적임
    rationale: ζητήσεις는 문맥상 논쟁적인 논의일 수 있으나, ‘공허한’이라는 평가는 μωράς 및 문장 전체의 평가와 겹쳐 어휘 대안 자체로는 덜 정확합니다.
  revised_text: 그러나 어리석은 논쟁과 족보와 다툼과 율법에 관한 싸움은 피하십시오. 그것들은 무익하고 헛되기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「논의」 또는 「논쟁거리」. 헬라어 ζήτησις는 문맥에 따라 논쟁적인 논의나 논쟁거리를 가리킬 수 있다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 「법에 관련된 싸움들」. 문맥상 「율법에 관한 싸움들」로 이해할 수 있다.
    reason: lexical_alternative
  revision_rationale: γενεαλογίας의 의미 범위를 본문에서 좁히지 않도록 ‘족보’로 고쳤습니다. 명령 동사 περιΐστασο의 회피 의미는 자연스러운 합쇼체 ‘피하십시오’로 반영했습니다. 각주는 원문의 어휘적 대안을 제시하되, 특정 역사적 배경이나 해석을 본문에 덧붙이지 않도록 다듬었습니다.
