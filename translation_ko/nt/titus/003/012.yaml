  terminology: 아데마, 두기고, 니고볼리는 한국 교회에서 널리 쓰이는 이름 표기이며 유지할 수 있습니다. “그대”와 합쇼체의 조합도 문어적이지만 일관되고 허용됩니다.
  issues:
