    text: 또는 「부지런히 나에게 오십시오」, 「최선을 다해 나에게 오십시오」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「거기서 겨울을 나기로 결심했습니다」.
    reason: lexical_alternative
