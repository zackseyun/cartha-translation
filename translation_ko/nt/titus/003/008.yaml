  to: 이 말은 믿을 만합니다. 나는 당신이 이러한 것들에 관하여 확신을 가지고 힘주어 말하기를[a] 바랍니다. 이는 하나님을 믿는 사람들이 선한 일에 힘쓰는 데 마음을 쓰게 하려는 것입니다[b]. 이러한 것들은 선하고 사람들에게 유익합니다.
  rationale: 원문에 없는 「그러므로」를 제거하고, βούλομαί σε διαβεβαιοῦσθαι를 현대 합쇼체에 맞게 「나는 당신이 ... 힘주어 말하기를 바랍니다」로 다듬었습니다. ἵνα 목적절은 「이는 ... 하려는 것입니다」로 자연스럽게 연결하되, φροντίζω와 προΐστασθαι의 두 요소를 「힘쓰는 데 마음을 쓰다」로 보존했습니다. 완료 분사의 의미는 본문에서 자연스러운 현재적 신분 표현으로 옮기고 직역 가능성은 각주에 제시했습니다.
