  verdict: revise
  source_fidelity: 본문은 ἐπιστομίζειν의 강한 비유, οἶκος의 가구 단위 의미, ἀνατρέπω의 파괴적 효과, 그리고 αἰσχροῦ κέρδους χάριν의 동기를 대체로 충실히 전달합니다. 다만 αἰσχροῦ κέρδους χάριν은 단순히 ‘이득을 위하여’보다 ‘이득을 얻으려고’로 옮길 때 한국어에서 동기 관계가 더 분명해집니다.
  naturalness: ‘온 가정들’과 ‘부끄러운 이득’은 이해 가능하지만 현대 표준 한국어에서는 다소 직역투입니다. ‘온 가정들을’과 ‘수치스러운 이득’을 사용하고, 목적과 수단의 관계를 자연스럽게 재배열하는 것이 좋습니다.
  terminology: ‘입을 막아야 합니다’는 원문의 문자적 비유와 문맥상 해로운 가르침을 제지한다는 뜻을 적절히 보존합니다. 기존 각주 a의 ‘영어 POB의 silenced를 본문에 살린 직역’이라는 설명은 한국어 본문 및 원어 어휘 설명과 맞지 않고, 영어 번역 과정을 본문 각주에 불필요하게 끌어들입니다.
  issues:
  - severity: medium
    issue: 각주 a가 영어 POB 번역 선택을 근거로 제시하며 ‘silenced’를 ‘직역’이라고 설명합니다.
    rationale: ἐπιστομίζω의 직역적 비유는 ‘입을 막다’이며, 영어 번역의 표현 선택은 한국어 독자용 원어 각주에 포함할 필요가 없습니다. 각주는 원어의 문자적 의미와 가능한 한국어 대안을 간결하게 설명해야 합니다.
  - severity: low
    issue: ‘온 가정들’과 ‘부끄러운 이득’이 다소 직역투입니다.
    rationale: 복수 가구 단위에는 ‘온 가정들을’이, αἰσχρός의 윤리적 비난에는 ‘수치스러운 이득’이 현대 한국어에서 더 자연스럽고 뜻도 보존합니다.
  revised_text: 이런 자들의 입을 막아야 합니다[a]. 그들은 수치스러운 이득을 얻으려고 마땅히 가르쳐서는 안 될 것을 가르쳐 온 가정들을 무너뜨리고 있기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「침묵시켜야 합니다」. 헬라어는 문자적으로 「입을 막다」라는 뜻이다.
    reason: lexical_alternative
  - marker: b
    text: 「온 가정들」은 단순한 건물이 아니라 한 집안의 식구와 권속을 포함하는 가구 단위를 가리킨다.
    reason: cultural_note
  - marker: c
    text: 또는 「추한 이득」 또는 「부정한 이득」.
    reason: lexical_alternative
  revision_rationale: 원문의 의미와 합쇼체를 유지하면서, 목적을 나타내는 χάριν을 ‘얻으려고’로 명료화하고 직역투를 완화했습니다. 각주 a에서는 영어 번역 과정에 대한 언급을 삭제하고 원어의 비유적 문자 의미와 대안을 제시했습니다. 본문에는 실제로 붙는 표지 a만 남기고, b와 c는 관련 표현에 각각 붙여 구조와 앵커를 일치시켰습니다.
