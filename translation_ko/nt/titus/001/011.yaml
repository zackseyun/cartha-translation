review_pass:
  verdict: revise
  source_fidelity: 본문은 ἐπιστομίζειν의 강한 비유, διδάσκοντες ἃ μὴ δεῖ의 부당한 가르침, αἰσχροῦ κέρδους χάριν의 동기, 그리고 ὅλους οἴκους의 복수적 범위를 대체로 충실히 반영합니다. 다만 ‘온 가정들’은 한국어에서 다소 직역투이므로, 복수와 ‘전체’의 뜻을 자연스럽게 드러내는 표현으로 다듬는 것이 좋습니다.
  naturalness: 합쇼체 문장과 전반적 어조는 적절합니다. ‘여러 집안을 송두리째 무너뜨리고’는 ‘온 가정들’을 더 자연스러운 현대 표준어로 바꾸면서도 ἀνατρέπω의 강한 파괴·전복의 뜻을 유지합니다.
  terminology: ‘입을 막아야 합니다’, ‘가르치지 말아야 할 것’, ‘부끄러운 이득’은 문맥과 신학적 함의를 과도하게 해석하지 않는 적절한 표현입니다. 각주는 영어 번역 선택을 언급하지 않고 한국어 독자를 위해 독립적으로 설명하도록 고쳤습니다.
  issues:
  - severity: low
    issue: ‘온 가정들’은 한국어에서 어색한 복수 명사구입니다.
    rationale: ὅλους οἴκους는 여러 ‘가구/집안’ 전체를 뜻하므로, ‘여러 집안을 송두리째’가 복수성과 전면적 피해를 자연스럽게 전달합니다.
  - severity: low
    issue: 각주 a의 ‘영어 POB의 「silenced」를 본문에 살린 직역’은 본문 주석으로 부적절하고 표현상 모순됩니다.
    rationale: 한국어 각주는 원어와 한국어 번역의 관계를 설명해야 하며, 본문 ‘입을 막다’ 자체가 이미 문자적 표현입니다.
  revised_text: 그들의 입을 막아야 합니다[a]. 그들은 부끄러운 이득[c]을 얻으려고 가르치지 말아야 할 것을 가르쳐서, 여러 집안을 송두리째 무너뜨리고 있기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「침묵시켜야 합니다」. 헬라어 동사는 문자적으로 「입을 막다」라는 뜻이다.
    reason: lexical_alternative
  - marker: b
    text: 「여러 집안」은 단순한 건물이 아니라, 그 집에 속한 가족과 권속을 포함한 가구 단위를 가리킨다.
    reason: cultural_note
  - marker: c
    text: 또는 「추한 이득」. 도덕적으로 수치스러운 이득을 뜻한다.
    reason: lexical_alternative
  revision_rationale: ‘온 가정들’을 자연스러운 한국어로 고치고, 가정 단위라는 의미는 각주에서 보완했습니다. 또한 ‘이득을 얻으려고’를 사용하여 χάριν이 나타내는 목적을 분명히 했으며, 각주 a에서 영어 번역에 대한 메타 언급을 제거했습니다. 원문의 비난의 강도와 방법을 특정하지 않는 범위는 유지했습니다.
