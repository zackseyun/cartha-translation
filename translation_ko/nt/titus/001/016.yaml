  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ὁμολογοῦσιν은 이 문맥에서 진정성 여부를 보장하지 않는 외적 주장이라는 대조를 이루므로, 「고백하지만」보다 「주장하지만」이 더 정확합니다. 또한 ἀδόκιμοι는 도덕적 당위의 「합당하지 않다」보다 적합성·자격 미달을 나타내는 「부적합하다」가 더 가깝습니다.
  naturalness: 「가증한 자요 불순종하는 자며」는 문법적으로 가능하나 현대 표준어 합쇼체에서는 다소 문어적·설교체로 들립니다. 원문의 형용사 병렬을 살려 「가증하고 불순종하며」로 하면 더 자연스럽고 간결합니다.
  terminology: 「하나님」, 「부인합니다」, 「불순종」, 「선한 일」은 적절합니다. βδελυκτοί의 「가증한」도 강한 부정적 평가를 충실히 전달합니다.
