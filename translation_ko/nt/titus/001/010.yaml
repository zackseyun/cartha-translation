  source_fidelity: 개정이 필요합니다. 초안은 세 핵심 술어의 의미와 ‘특히’의 강조를 대체로 잘 전달하지만, γάρ의 앞 절에 대한 설명적 연결이 ‘많기 때문입니다’라는 문장 종결로 다소 부자연스럽게 처리되었고, πολλοὶ와 ἀνυπότακτοι의 결합도 더 직접적으로 드러낼 수 있습니다.
  naturalness: ‘특히 할례에 속한 자들 가운데 그러합니다’는 문법상 가능하나 현대 한국어로는 다소 어색하고 우회적입니다. ‘특히 할례에 속한 자들이 그러합니다’가 더 자연스럽고 강조 범위를 명료하게 합니다.
  terminology: ‘복종하지 않고’, ‘헛된 말을 하며’, ‘사람을 속이는’은 각각 ἀνυπότακτοι, ματαιολόγοι, φρεναπάται를 자연스럽게 옮깁니다. 각주의 ‘유대주의 반대자’는 한국어상 ‘유대교에 반대하는 사람’으로 읽힐 수 있어, 원 영어의 Judaizing을 정확히 반영하도록 수정해야 합니다.
