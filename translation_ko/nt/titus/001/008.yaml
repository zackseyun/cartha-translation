translation:
  language: ko
  text: 오히려 손님을 잘 대접하며[a], 선한 것을 사랑하고, 분별력이 있으며, 의롭고[b], 거룩하며[c], 자제력이 있어야 합니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「나그네를 사랑하며」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「공정한」, 「올바른」. 헬라어 δίκαιος는 정의와 도덕적 올바름의 뜻을 모두 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「경건한」. ὅσιος는 하나님을 향한 합당한 헌신과 경외의 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: d
    text: 헬라어는 여기서 서로 관련된 두 덕목을 사용합니다. σώφρονα는 건전한 판단과 절제를, ἐγκρατῆ는 자기 통제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλόξενον
  english_pob_choice: hospitable
  chosen_korean: 손님을 잘 대접하고
  alternatives_korean:
  - 나그네를 사랑하고
  - 손 대접을 즐기고
  lexicon: BDAG
  rationale: φιλόξενος는 문자적으로 「나그네/이방인을 사랑하는」. 1세기 환대 문화를 담아 「손님을 잘 대접하는」으로 옮긴다.
- source_word: φιλάγαθον
  english_pob_choice: loving what is good
  chosen_korean: 선한 것을 사랑하며
  alternatives_korean:
  - 선을 사랑하며
  - 좋은 것을 사랑하며
  lexicon: BDAG
  rationale: φιλο- + ἀγαθός. 「선한 것을 사랑한다」가 가장 충실하다.
- source_word: σώφρονα
  english_pob_choice: self-controlled
  chosen_korean: 신중하고
  alternatives_korean:
  - 분별 있고
  - 건전한 마음을 가지고
  - 절제하고
  lexicon: BDAG
  rationale: σώφρων은 건전한 분별·절제. 뒤에 오는 ἐγκρατῆ(자제력)와 구분하기 위해 「신중하고」로 옮긴다. 영어 POB가 σώφρονα를 「self-controlled」로, ἐγκρατῆ를 「disciplined」로 구분한 흐름과 다르게 한국어는 「신중/자제」 짝으로 자연스러움을 살린다.
- source_word: δίκαιον
  english_pob_choice: upright
  chosen_korean: 의롭고
  alternatives_korean:
  - 공정하고
  - 올바르고
  lexicon: BDAG
  rationale: δίκαιος의 표준 한국어 등가어 「의롭다」. 「공정」은 사회적 어감으로 좁다.
- source_word: ὅσιον
  english_pob_choice: holy
  chosen_korean: 거룩하고
  alternatives_korean:
  - 경건하고
  - 신실하고
  lexicon: BDAG
  rationale: ὅσιος는 하나님을 향한 합당한 헌신을 함의한다. 「거룩하다」가 가장 일반적이며, 각주로 「경건한」을 둔다.
- source_word: ἐγκρατῆ
  english_pob_choice: disciplined
  chosen_korean: 자제력이 있는
  alternatives_korean:
  - 절제하는
  - 자기를 다스리는
  lexicon: BDAG
  rationale: ἐγκρατής는 자기 자신에 대한 통제. 「자제력이 있는」이 σώφρων과 명확히 구분된다.
