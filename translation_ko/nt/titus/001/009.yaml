  to: 그는 가르침[a]에 따른 믿을 만한 말씀을 굳게 붙들어야 합니다. 그래야 건전한 가르침으로 권면하고, 반대하는 이들을 책망할[b] 수 있습니다.
  rationale: πιστοῦ λόγου를 ‘믿을 만한 말씀’으로 옮겨 말씀의 신뢰성이라는 문맥상 의미를 분명히 했습니다. 문장을 둘로 나누고 ‘그래야’와 ‘~할 수 있습니다’를 사용하여 ἵνα가 나타내는 목적을 자연스러운 합쇼체로 드러냈습니다. ἐλέγχειν은 영어 POB의 주 선택 및 교정적 뉘앙스에 맞추어 ‘책망하다’로 두되, 논증·폭로의 의미는 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:48:39Z'
