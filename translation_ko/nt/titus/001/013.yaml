  to: 이 증언은 참입니다. 그러므로 그들이 신앙[a] 안에서 건전해지도록 그들을 엄하게 책망하십시오.
  rationale: 문체상 어색한 「참됩니다」를 「참입니다」로 고치고, τῇ πίστει를 자연스러운 한국어 「신앙 안에서」로 옮겼습니다. 각주는 개인적 믿음과 기독교 신앙의 내용이라는 두 해석 가능성을 보존합니다. 명령문 어순도 현대 합쇼체에 맞게 다듬었습니다.
