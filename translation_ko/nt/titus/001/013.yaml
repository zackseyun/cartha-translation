    issue: 「참됩니다」의 현대 한국어 어색함
    rationale: ἀληθής의 단순한 술어 진술에는 「참입니다」가 현대 합쇼체에서 자연스럽고 직접적입니다.
  - severity: medium
    issue: 「그 믿음 안에서」의 부자연스러움 및 각주와의 중복
    rationale: 한국어에서 「그 믿음」은 지시 대상이 불명확하게 들리며, 본문 표현과 각주의 대안 「믿음 안에서」가 사실상 동일해 각주의 기능이 약화됩니다. 「신앙 안에서」를 본문에 두고 「믿음 안에서」를 대안으로 제시하는 것이 자연스럽고 의미 범위를 보존합니다.
  revised_text: 이 증언은 참입니다. 그러므로 그들이 신앙[a] 안에서 건전해지도록 그들을 엄하게 책망하십시오.
