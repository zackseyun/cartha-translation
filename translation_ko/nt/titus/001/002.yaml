  to: 영원한 생명의 소망 안에서입니다. 이 생명은 거짓말하지 않으시는 하나님께서 영원한 시대들이 시작되기 전에[a] 약속하신 것입니다.
  rationale: 'The revision replaces an unidiomatic prepositional expression and removes an unnatural equative dash construction. It preserves the Greek sequence and ambiguity: the hope concerns eternal life, and that life was promised by the God who does not lie before the ages began. The footnote retains the alternative ‘before time began’ without imposing a metaphysical interpretation.'
