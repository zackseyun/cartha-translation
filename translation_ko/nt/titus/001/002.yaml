review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies eternal life as the antecedent of ἣν and accurately renders God's truthfulness and the pre-temporal force of πρὸ χρόνων αἰωνίων. However, its dash construction makes the relative clause read as an awkward apposition ('it is the life') rather than a normal Korean relative clause.
  naturalness: ‘영원한 생명의 소망 위에’ is not idiomatic in this context, and the long em-dash construction is syntactically unnatural in modern formal Korean. Recasting the relative clause as a following sentence preserves the verse’s referential connection while producing clear Korean.
  terminology: ‘영원한 생명’ and ‘거짓말하지 않으시는 하나님’ are accurate and suitably formal. ‘영원한 시대들이 시작되기 전에’ retains the audit trail’s ‘before the ages began,’ though it is best set in a smoother sentence.
  issues:
  - severity: medium
    issue: ‘소망 위에’ is an unnatural rendering of ἐπ’ ἐλπίδι in this Korean context.
    rationale: While ἐπί with the dative can have a basis-related sense, Korean ‘~ 위에’ here suggests a physical or conceptual foundation and does not naturally express the relation intended by the Greek. ‘소망 안에서’ is idiomatic and does not over-specify the relation.
  - severity: medium
    issue: The dash construction (‘— … 그 생명입니다 —’) obscures the relative clause ἣν.
    rationale: The Greek says that God promised the eternal life in view; it does not use an equative clause. A separate Korean sentence, ‘이 생명은 … 약속하신 것입니다,’ clearly maintains the antecedent and faithfully conveys the relative clause.
  revised_text: 영원한 생명의 소망 안에서입니다. 이 생명은 거짓말하지 않으시는 하나님께서 영원한 시대들이 시작되기 전에[a] 약속하신 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「시간이 시작되기 전에」. 헬라어는 문자적으로 「영원한/오랜 시대들 이전에」라고 말합니다.
    reason: lexical_alternative
