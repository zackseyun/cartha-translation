review_pass:
  verdict: revise
  source_fidelity: 핵심 자격 요건과 πιστά의 양의성은 대체로 잘 보존했습니다. 그러나 ἐν κατηγορίᾳ ἀσωτίας의 κατηγορία는 ‘책망’보다 ‘고발/혐의’라는 법정적·공적 비난의 뜻에 가깝습니다. 따라서 ‘방탕의 책망을 받거나’는 원문의 고발·혐의의 뉘앙스를 충분히 드러내지 못합니다.
  naturalness: ‘방탕하다는 고발을 받거나 불복종하는 자녀가 아닌’은 현대 표준어 합쇼체 문맥에서 자연스럽고, 두 부정 조건이 모두 자녀를 수식한다는 관계도 분명히 합니다. ‘한 아내의 남편’은 다소 직역적이지만, 논쟁적인 헬라어 관용구의 함의를 성급히 결정하지 않는 데 적절합니다.
  terminology: ‘책망할 것이 없고’, ‘한 아내의 남편’, ‘신실한 자녀’, ‘방탕’, ‘불복종하는’은 이 문맥에 적절합니다. πιστά의 대안 ‘믿는’은 각주로 유지해야 하며, μιᾶς γυναικὸς ἀνήρ의 대안도 유지하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘방탕의 책망을 받거나’가 κατηγορία의 의미를 약화함
    rationale: κατηγορία는 단순히 꾸지람을 듣는 일보다 고발, 혐의, 비난의 제기를 가리킵니다. ‘방탕하다는 고발을 받거나’가 원문의 공적·법정적 어감을 더 충실히 전달합니다.
  revised_text: 누구든지 책망할 것이 없고, 한 아내의 남편이며[b], 신실한[a] 자녀를 두되 그 자녀들이 방탕하다는 고발을 받거나 불복종하는 자녀가 아닌 사람이어야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「믿는」 자녀. 헬라어 πιστά는 「신실한」과 「믿는」 양쪽으로 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「한 여자의 남자」. 헬라어 직역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「방탕한 삶」. ἀσωτία는 절제 없는 방종한 삶을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: κατηγορία를 ‘고발’로 옮겨 원문의 혐의·고발의 의미를 회복했습니다. ‘방탕’을 유지하되 ‘방탕하다는’으로 구성하여 자연스러운 한국어를 만들었습니다. 각주 c는 본문 ‘방탕’에 계속 연결되도록 유지해야 합니다.
