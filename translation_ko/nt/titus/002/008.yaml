  source_fidelity: 개정이 필요합니다. λόγον은 이 문맥에서 가르침 가운데 ‘말을 하다’로 옮기는 것이 적절하며, 초안의 ‘말을 보여 주십시오’는 한국어 결합이 부자연스럽고 원문의 권면을 흐립니다. ἵνα 이하의 목적절과 ἐντραπῇ의 수동 의미도 자연스럽게 바로잡았습니다. περὶ ἡμῶν은 범위를 확대하지 않고 ‘우리에게 관하여’로 유지했습니다.
  naturalness: ‘정죄받을 수 없는 건전한 말’과 ‘부끄러움을 당하게 하려는 것입니다’는 현대 표준 한국어 합쇼체 성경 문체로 다소 어색합니다. ‘건전하고 비난받을 여지가 없는 말을 하십시오’ 및 ‘부끄러움을 당할 것입니다’가 더 자연스럽고 명료합니다.
  terminology: ὑγιής는 목회서신의 용례에 맞게 ‘건전한’으로 유지했습니다. ἀκατάγνωστος는 법정적·평판적 뉘앙스를 보존하여 ‘비난받을 여지가 없는’으로 옮겼습니다. ὁ ἐξ ἐναντίας는 해석을 과도하게 덧붙이지 않고 ‘반대하는 자’로, φαῦλον은 ‘나쁜 말’로 옮겼습니다.
