review_pass:
  verdict: revise
  source_fidelity: 개정문은 형용사·분사로 이루어진 목록과 목적절의 관계를 보존합니다. 본문의 목록은 2:4의 ‘가르치다’에 문법적으로 이어지므로, 한국어에서 독립절로 자연스럽게 읽히도록 그 동사를 보충하되 대괄호로 표시했습니다. οἰκουργούς는 SBLGNT 본문에 따라 ‘집안일을 하며’로, βλασφημῆται는 이 문맥의 공적 훼손 의미를 살려 ‘비방받지’로 옮겼습니다.
  naturalness: 초안의 ‘…복종하도록 말입니다’는 현대 표준 한국어에서 문장 성분이 불완전하고 부자연스럽습니다. 개정문은 합쇼체 명령문으로 문법적으로 완결되며, 쉼표로 덕목 목록을 명료하게 구분합니다.
  terminology: σώφρονας는 ‘신중하고’, ἁγνάς는 ‘정결하며’, ἀγαθάς는 포괄적인 ‘선하며’로 유지했습니다. ὑποτασσομένας는 본문의 관계적 복종을 덧붙임 없이 ‘자기 남편에게 복종하도록’으로 옮겼습니다. 각주 b에서 중간태가 반드시 ‘자발성’을 뜻한다고 한 주장은 문법적으로 과도하므로 삭제했습니다.
  issues:
  - severity: high
    issue: ‘자기 남편에게 복종하도록 말입니다’가 문법적으로 불완전합니다.
    rationale: 원문의 형용사·분사 목록은 바로 앞 절(2:4)의 가르침의 목적에 종속됩니다. 한국어에서는 해당 통사 관계를 보충하지 않으면 완결된 합쇼체 문장이 되지 않습니다.
  - severity: medium
    issue: 각주 b가 중간태를 근거로 ‘자발적 자기복종’이라고 단정합니다.
    rationale: ὑποτασσομένας의 형태만으로 자발성이라는 신학적·의지적 뉘앙스를 확정할 수 없습니다. 가능한 번역 대안만 제시하는 것이 안전합니다.
  - severity: low
    issue: 각주 c의 설명이 ‘모독’에 치우쳐 본문의 사회적 비방·훼손 의미를 충분히 반영하지 못합니다.
    rationale: βλασφημέω는 여기서 하나님의 말씀을 헐뜯거나 비방하는 행위를 가리킬 수 있습니다. 본문은 ‘비방받지’가 자연스럽고, ‘모독받지’는 문자적 대안으로 각주에 남길 수 있습니다.
  revised_text: '[젊은 여자들이] 신중하고 정결하며, 집안일을 하고, 선하며, 자기 남편에게 복종하도록 가르치십시오. 그리하여 하나님의 말씀이 비방받지[c] 않게 하십시오.'
  revised_footnotes:
  - marker: a
    text: 또는 「집안에서 일하는」. 헬라어 어휘는 드물며, 가정의 살림과 관련된 일을 하는 것을 가리킨다. 다른 이문에는 「집을 지키는」이라는 뜻의 단어가 있다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「자기 남편에게 복종하는」 또는 「자기 남편에게 순종하는」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「모독받지」 또는 「헐뜯김을 받지」. 더 문자적으로는 「신성 모독을 당하지」.
    reason: lexical_alternative
  revision_rationale: 2:5는 2:4의 ἵνα σωφρονίζωσιν에 이어지는 종속 목록이므로, 한국어 단독 본문에서 필요한 ‘가르치십시오’를 보충하고 그 보충분은 대괄호 처리했습니다. 초안의 비문을 해소하고, 중간태에 대한 과도한 해석을 각주에서 제거했습니다. 또한 초안에 있던 a·b 각주 표지를 실제 본문에 모두 붙여 각주 앵커를 정합하게 했습니다.
