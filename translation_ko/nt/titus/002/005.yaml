review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘 선택은 대체로 원문에 충실합니다. 그러나 ὑποτασσομένας는 여성 복수 분사로 앞선 덕목 목록과 병렬을 이루는데, 초안의 「복종하도록 말입니다」는 문법적으로 부자연스럽고 원문의 병렬 구조를 흐립니다. 또한 중간/수동 형태만으로 ‘자발적 자기복종’이라는 의미를 확정할 수 없습니다.
  naturalness: 「…복종하도록 말입니다」는 현대 표준 한국어 합쇼체로 자연스럽지 않습니다. 문맥상 2:4의 가르침을 보충하여 「젊은 여자들이 … 하도록 가르치며」라고 하면 문장 구조와 목적절이 명료해집니다.
  terminology: 「신중하고」「정결하며」「집안일에 힘쓰고」「선하며」는 적절합니다. βλασφημῆται는 이 문맥에서 하나님의 말씀/복음이 사람들에게 비방·중상당하는 뜻이므로 본문은 「비방받지」가 더 자연스럽고, 「모독받지」는 문자적 대안으로 각주에 둘 수 있습니다. 「그리스어」가 현대 학술 한국어에서 「헬라어」보다 중립적입니다.
  issues:
  - severity: medium
    issue: 「자기 남편에게 복종하도록 말입니다」의 문법 및 병렬 구조
    rationale: 원문의 여성 복수 분사는 앞의 형용사들과 병렬인 덕목 목록입니다. 「말입니다」는 이 구절에서 불완전하고, 「복종하도록」은 다른 병렬 항목과도 맞지 않습니다. 앞 절의 가르침 동사를 문맥상 보충해 자연스럽게 연결할 필요가 있습니다.
  - severity: medium
    issue: 각주 b의 ‘중간태로 자발적 자기복종’ 주장
    rationale: ὑποτασσομένας의 형태는 중간/수동으로 분석될 수 있으나, 형태 자체가 자발성의 신학적·의미론적 강조를 확정하지는 않습니다. 영어 감사 기록처럼 단순한 번역 대안을 제시하는 것이 안전합니다.
  - severity: low
    issue: βλασφημῆται의 본문 번역
    rationale: 하나님의 말씀을 대상으로 할 때 ‘비방받다’는 공적 비난·중상을 자연스럽게 전달합니다. ‘모독받다’는 가능한 더 문자적인 대안으로 각주에 남길 수 있습니다.
  revised_text: 젊은 여자들이 신중하고 정결하며, 집안일에 힘쓰고[a] 선하며, 자기 남편에게 복종하도록[b] 가르치며, 하나님의 말씀이 비방받지[c] 않게 하려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「집안에서 일하는」 또는 「집안을 지키는」. 그리스어 낱말은 드물며, 가정에서 하는 일에 종사함을 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「자기 남편에게 순종하도록」 또는 「자기 남편에게 복종하는」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「비난받지」; 더 문자적으로는 「모독받지」.
    reason: lexical_alternative
  revision_rationale: 앞 절에 암시된 ‘가르치다’의 내용을 한국어 문장에 보충하여, 원문의 덕목 목록과 ἵνα 목적절의 관계를 자연스럽게 드러냈습니다. 이는 새로운 의미를 더하는 것이 아니라 2:4–5에 걸친 원문의 통사 관계를 한국어로 표시한 것입니다. ‘자발적’이라는 해석적 주석은 삭제하고, βλασφημέω의 문맥상 의미는 본문에서 「비방받다」로, 문자적 선택지는 각주로 보존했습니다.
