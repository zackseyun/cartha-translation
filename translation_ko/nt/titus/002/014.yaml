review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 καθαρίσῃ의 직접목적어인 λαὸν περιούσιον(‘자기 소유의 백성’)이 현행문의 ‘우리를 깨끗하게 하여 … 백성이 되게’에서는 다소 우회적으로 처리되어, ‘정결하게 하다’와 ‘자기 소유의 백성’의 결속을 더 분명히 하는 편이 좋습니다.
  naturalness: 현행문도 이해되지만, ‘자기에게 속한 백성, 곧 선한 일에 열심을 내는 백성이 되게’는 ‘백성’의 반복과 ‘깨끗하게 하여 … 되게’의 연결이 다소 무겁습니다. 수정문은 현대 표준 한국어 합쇼체에서 더 자연스럽게 읽힙니다.
  terminology: ‘구속’, ‘불법’, ‘선한 일’은 적절합니다. περιούσιον은 ‘자기 소유의 백성’으로 옮겨 소유·언약의 뉘앙스를 더 직접적으로 드러냈습니다. footnote의 대안 ‘귀중한 백성’은 가능하나, ‘보배로운 백성’이 한국어 성경 문맥에서 더 자연스럽습니다.
  issues:
  - severity: medium
    issue: καθαρίσῃ ἑαυτῷ λαὸν περιούσιον의 문장 결속이 약함
    rationale: 그리스어는 ‘자신을 위하여 자기 소유의 백성을 정결하게 하다’라는 구조입니다. 초안은 ‘우리를 깨끗하게 하여 … 백성이 되게’로 뜻을 전달하지만, 정결하게 되는 대상과 ‘자기 소유의 백성’이라는 명사가 문법적으로 느슨하게 연결됩니다.
  - severity: low
    issue: ‘백성’의 불필요한 반복
    rationale: ‘자기에게 속한 백성, 곧 선한 일에 열심을 내는 백성’은 의미상 문제는 없으나, 한국어에서는 두 번째 ‘백성’을 생략하거나 관형 구조로 처리하는 편이 더 매끄럽습니다.
  revised_text: 그분은 우리를 위하여 자신을 내주셨습니다. 이는 우리를 모든 불법에서 구속하시고, 자신을 위하여 선한 일에 열심인 자기 소유의 백성으로 정결하게 하시려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「보배로운 백성」 또는 「특별한 백성」. 헬라어 「자기 소유의 백성」은 그분께 특별히 속한 언약 백성이라는 의미를 보존합니다.
    reason: lexical_alternative
  revision_rationale: ‘자기 자신’을 자연스러운 재귀 표현인 ‘자신’으로 다듬고, καθαρίσῃ와 λαὸν περιούσιον의 관계를 ‘자기 소유의 백성으로 정결하게 하시다’로 밀접하게 연결했습니다. ζηλωτὴν καλῶν ἔργων은 ‘선한 일에 열심인’으로 유지하여 열의와 지속적 성향을 보존했습니다. ‘자신을 위하여’는 ἑαυτῷ의 여격적 소유·목적 뉘앙스를 반영합니다.
