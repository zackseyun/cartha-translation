  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δεσπόταις가 복수이므로 「자기 주인들에게」가 더 정확하며, 세 항목은 모두 ὑποτάσσεσθαι와 병렬된 부정사이므로 한국어에서도 하나의 종결 표현에 병렬시키는 편이 원문 구조를 더 잘 반영합니다.
  naturalness: 현 문장의 「복종해야 합니다. 기쁘게 해 드리고」는 문장이 분리되어 병렬 구조가 다소 어색합니다. 또한 「해 드리다」의 높임은 주인에게 존대를 부여하는 한국어 화자의 태도를 불필요하게 더합니다. 「기쁘게 하며」가 자연스럽고 중립적입니다.
  terminology: 「노예들」은 δοῦλος 및 이 문맥의 δεσπότης가 드러내는 예속 현실을 적절히 보존합니다. 「주인들」은 δεσπόταις의 복수를 반영합니다. 각주 a의 「매인 신분」과 「봉사하는 자」는 현대 한국어에서 부자연스럽거나 지나치게 완화될 수 있어 다듬는 것이 좋습니다.
