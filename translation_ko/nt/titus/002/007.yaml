  terminology: ‘선한 일’ is appropriate and consistent for καλά ἔργα. ‘순수함’ is a more idiomatic contextual rendering of ἀφθορία than ‘순결,’ while its note retains the stronger literal sense. ‘품위’ aptly renders σεμνότης and is slightly more direct than ‘진중함’ for the quality of dignified seriousness.
