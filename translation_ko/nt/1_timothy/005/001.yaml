  verdict: revise
  source_fidelity: Πρεσβυτέρῳ와 νεωτέρους는 이 문맥에서 각각 나이 많은 남자와 젊은 남자를 가리키는 것으로 보는 것이 적절합니다. 현 초안의 「연장자」와 「젊은이들」은 성별을 명시하지 않아 원문의 남성 대조를 충분히 드러내지 못합니다. 「호되게 꾸짖지 말고」와 「아버지에게 하듯 권면하십시오」는 원문의 대조와 권면의 어조를 잘 반영합니다.
  naturalness: 초안 마지막의 「젊은이들은 형제처럼,」은 한국어 문장으로 미완결되어 어색합니다. 생략된 동사를 보충하여 「젊은 남자들에게는 형제에게 하듯 하십시오」로 옮기면 합쇼체 문체를 유지하면서 자연스럽습니다.
  terminology: 「장로」는 가능한 대안이지만, 이어지는 젊은 남자 및 다음 절의 가족 관계 비유와 연령·성별 대조상 본문은 교회 직분보다 나이 많은 남자를 뜻하는 것으로 옮기는 편이 타당합니다. 「권면하십시오」는 παρακάλει의 문맥상 적절합니다.
  issues:
  - severity: medium
    issue: 「연장자」와 「젊은이들」이 원문의 남성 지시를 중화합니다.
    rationale: 원문은 남성 단수 Πρεσβυτέρῳ와 남성 복수 νεωτέρους를 사용하며, 바로 다음 절에서 여성 집단을 별도로 언급합니다. 따라서 성별을 명시하는 번역이 문맥 구조를 더 충실히 보존합니다.
  - severity: medium
    issue: 마지막 구절이 문법적으로 미완결입니다.
    rationale: 「젊은이들은 형제처럼,」에는 술어가 없어 독립된 한국어 성경 절로 읽기에 부자연스럽습니다. 원문의 생략된 동사를 한국어에서 보충할 수 있습니다.
  revised_text: 나이 든 남자를 호되게 꾸짖지 말고, 아버지에게 하듯 권면하십시오. 젊은 남자들에게는 형제에게 하듯 하십시오.
  revised_footnotes:
