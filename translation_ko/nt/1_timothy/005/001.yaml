review_pass:
  verdict: revise
  source_fidelity: Πρεσβυτέρῳ and νεωτέρους are masculine singular/plural substantives. The draft’s ‘연장자/젊은이들’ loses the explicit male reference. ‘호되게’ also adds an intensity that the English audit trail deliberately does not make explicit. The revision preserves the age-based contrast and the implied repeated exhortation in the final clause.
  naturalness: ‘나이 든 남자’ and ‘젊은 남자들에게는 형제에게 하듯 하십시오’ are natural modern formal-polite Korean. Supplying ‘하십시오’ in the second coordinated phrase makes the Korean clause complete without adding a distinct action.
  terminology: '‘장로’ is properly retained only as a footnoted alternative: the immediate age-and-sex pattern, continued in the next verse, favors an older male rather than the church office. ‘권면하십시오’ suitably conveys παρακάλει in this respectful contrast.'
  issues:
  - severity: medium
    issue: Gender-specific references are rendered generically.
    rationale: ‘연장자’ and ‘젊은이들’ can include women, whereas the Greek masculine forms refer here to older and younger men within a sex-specific sequence.
  - severity: low
    issue: ‘호되게’ over-specifies the rebuke.
    rationale: ἐπιπλήξῃς denotes rebuking/censuring, but the audit trail selects ‘Do not rebuke’ rather than ‘Do not sharply rebuke.’
  - severity: low
    issue: The final Korean clause is syntactically incomplete as presented.
    rationale: Although the Greek continues into the following verse, Korean reads more naturally with the implied exhortation supplied after ‘형제에게 하듯.’
  revised_text: 나이 든 남자를 꾸짖지 말고, 아버지에게 하듯 권면하십시오. 젊은 남자들에게는 형제에게 하듯 하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「장로」. 헬라어 πρεσβύτερος는 「나이 든 남자」 또는 「장로」를 가리킬 수 있습니다. 그러나 여기서는 이어지는 「젊은 남자들」 및 다음 절의 나이와 성별에 따른 대비 때문에 「나이 든 남자」라는 뜻이 더 자연스럽습니다.
    reason: alternative_reading
  revision_rationale: 문맥상 교회 직분을 뜻하는 ‘장로’가 아니라 나이 많은 남성을 가리키는 것으로 옮기고, 이어지는 ‘젊은 남자들’과의 대비를 보존했습니다. 한국어의 자연스러운 문장 구조를 위해 마지막 절에 문맥상 생략된 ‘하십시오’를 보충했습니다.
