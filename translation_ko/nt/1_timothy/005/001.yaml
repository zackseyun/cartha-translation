    text: 또는 「장로」. 그리스어 πρεσβύτερος는 「나이 든 남자」 또는 「장로」를 가리킬 수 있으나, 본문의 나이와 성별에 따른 대조는 「나이 든 남자」라는 뜻을 지지합니다.
    reason: alternative_reading
  revision_rationale: 원문의 연령·성별 대조를 보존하도록 「연장자」와 「젊은이들」을 각각 「나이 든 남자」와 「젊은 남자들」로 고쳤습니다. 또한 한국어에서 미완결이던 마지막 구문에 문맥상 생략된 동사를 보충했습니다. 장로라는 가능한 대안은 각주에 유지했습니다.
