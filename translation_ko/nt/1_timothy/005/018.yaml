revisions:
- from: 성경이 말씀하기를, 「곡식을 떠는[a] 소의 입에 망을 씌우지 말라」 하셨고, 또한 「일꾼은 자기 삯[b]을 받기에 합당하다」 하셨기 때문입니다.
  to: 이는 성경이 「타작하는[a] 소의 입에 망을 씌우지 마십시오」라고 말하고, 「일꾼은 자기 삯[b]을 받을 자격이 있습니다」라고도 말하기 때문입니다.
  rationale: The revision preserves the explanatory force of γάρ ("이는 ... 때문입니다"), the present scriptural testimony of λέγει, and the coordination of the two citations. It replaces dated and syntactically uneven quotation reporting with parallel modern formal-polite Korean, clarifies the threshing participle, and updates the footnote terminology. No theological or canonical inference is added regarding the scope of "성경."
