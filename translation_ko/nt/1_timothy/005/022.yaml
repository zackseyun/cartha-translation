translation:
  language: ko
  text: 누구에게도 성급히 안수하지[a] 마십시오. 다른 사람들의 죄에 참여하지도 마십시오. 자신을 정결하게 지키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 구체적으로는 「누구를 너무 성급히 임직시키지 마십시오」라고도 볼 수 있습니다. 헬라어를 직역하면 「손을 얹다」이며, 사역을 위한 임명이나 인정과 흔히 관련되는 관용 표현입니다.
    reason: lexical_alternative
