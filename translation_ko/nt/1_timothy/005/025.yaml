review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 ‘숨겨질 수 없다’는 뜻은 잘 옮겼습니다. 다만 τὰ ἄλλως ἔχοντα는 앞의 ἔργα를 받아 가리키므로, 한국어에서도 ‘것들’보다 ‘일들’을 밝혀 주는 편이 원문의 지시 대상을 더 정확히 보존합니다. 또한 ‘행실’은 지속적인 품행의 뉘앙스가 강하여 ἔργα의 개별 행위/일이라는 범위보다 다소 좁습니다.
  naturalness: ‘이와 같이 … 분명히 드러나며’와 ‘숨겨질 수 없습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘그 밖의 일들’은 원문의 절제된 대비를 자연스럽게 유지합니다.
  terminology: καλὰ ἔργα는 ‘선한 일들’로 옮겨 ‘선한 행실’보다 원문의 복수적·구체적 의미를 잘 드러냅니다. τὰ ἄλλως ἔχοντα는 악한 일로 단정하지 않고 ‘그 밖의 일들’로 처리하며, 각주에서 가능한 해석을 제시합니다.
  issues:
  - severity: low
    issue: ‘선한 행실’
    rationale: ἔργα는 개별 ‘일/행위’를 가리키며, ‘행실’은 일반적 품행이나 행동 양식으로 들릴 수 있습니다.
  - severity: medium
    issue: ‘그렇지 않은 것들’
    rationale: 원문의 중성 복수 표현은 생략된 ‘일들/행위들’을 가리키는데, ‘것들’은 지시 대상이 지나치게 넓고 한국어에서는 무엇을 뜻하는지 불분명합니다.
  - severity: low
    issue: 각주의 ‘그렇지 못한 것들’
    rationale: ‘그렇지 못한’은 한국어에서 결함이나 부정적 평가를 더 강하게 암시할 수 있어, 원문이 악한 일을 명시하지 않는 점을 충분히 보존하지 못합니다.
  revised_text: 이와 같이 선한 일들도 분명히 드러나며, 그 밖의 일들도 숨겨질 수 없습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “다른 일들”, “그와 다른 일들”. 일부는 앞 절(24절)과의 유비에 따라 이를 특히 악한 일들로 이해합니다.
    reason: alternative_reading
  revision_rationale: ‘선한 일들’로 ἔργα의 범위를 보존하고, 뒤의 중성 복수 표현도 ‘일들’로 명시했습니다. ‘그 밖의’는 원문의 ‘다르게 있는 것들’을 악한 일로 단정하지 않은 채 자연스럽게 옮기며, 해석상 가능한 악한 일이라는 이해는 각주에만 남겼습니다.
