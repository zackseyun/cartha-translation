id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
  footnotes:
  - marker: a
    text: Some manuscripts read 'if any believing man or woman has widows' or 'if any believer has widows,' broadening the instruction beyond a specifically female subject.
    reason: textual_variant
translation:
  language: ko
  text: 어떤 믿는 여자[a]에게 돌볼 과부들이 있으면, 그 여자는 그 과부들을 부양해야 합니다. 그래야 교회가 부담을 지지 않고 참으로 과부인 이들을 부양할 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 「어떤 믿는 남자나 여자에게 과부들이 있으면」 또는 「어떤 믿는 자에게 과부들이 있으면」으로 읽어, 이 지시의 대상을 여자에 한정하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  english_pob_choice: any believing woman
  chosen_korean: 어떤 믿는 여자
  alternatives_korean:
  - 어떤 믿는 자(여자)
  lexicon: BDAG
  rationale: SBLGNT 본문은 여성형 πιστή. 사본 변형은 각주.
- source_word: ἐπαρκείτω αὐταῖς
  english_pob_choice: let her provide for them
  chosen_korean: 그가 그들을 돌봐야 합니다
  alternatives_korean:
  - 그가 그들을 부양하라
  lexicon: BDAG
  rationale: ἐπαρκέω의 「돕다·돌보다」.
- source_word: μὴ βαρείσθω ἡ ἐκκλησία
  english_pob_choice: let the church not be burdened
  chosen_korean: 교회가 짐을 지지 않게
  alternatives_korean:
  - 교회가 부담받지 않게
  lexicon: BDAG
  rationale: 3:5·15와 일관 「교회」.
- source_word: ταῖς ὄντως χήραις ἐπαρκέσῃ
  english_pob_choice: provide for those who are truly widows
  chosen_korean: 참으로 과부 된 자들을 돌볼
  alternatives_korean:
  - 진짜 과부들을 후원할
  lexicon: BDAG
  rationale: 3절과 일관.
