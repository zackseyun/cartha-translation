  to: 어떤 믿는 여자[a]에게 돌볼 과부들이 있으면, 그 여자는 그 과부들을 부양해야 합니다. 그래야 교회가 부담을 지지 않고 참으로 과부인 이들을 부양할 수 있습니다.
  rationale: 여성 단수 주어를 ‘그 여자는’으로 분명히 하고, 미해결 대괄호 표기를 제거했습니다. 두 차례의 ἐπαρκέω는 지원·부양의 문맥을 반영하여 ‘부양하다’로 일관되게 옮겼습니다. 마지막 절은 교회가 부담에서 벗어나 참으로 과부인 이들을 지원할 수 있게 된다는 ἵνα 목적절의 관계를 ‘그래야 … 수 있습니다’로 자연스럽게 나타냅니다. 이문은 각주에서만 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:48:26Z'
