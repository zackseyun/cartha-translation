review_pass:
  verdict: revise
  source_fidelity: 그리스어는 ‘어떤 사람들의 죄’가 명백하며 그 사람들보다 앞서 심판에 이르고, 다른 경우에는 그 죄들이 뒤따른다는 대조를 이룹니다. 초안은 전반 의미를 잘 전달하지만, ‘심판으로 나아가다’는 한국어 결합이 다소 부자연스럽고, ‘심판에 이르다’가 εἰς κρίσιν과 전진 이미지를 더 정확하고 자연스럽게 살립니다.
  naturalness: ‘드러나 있어’는 현대 표준어 합쇼체 본문으로는 다소 구어적·불완전하게 들립니다. ‘분명히 드러나 있습니다’로 하면 자연스럽고 격식 있는 문장이 됩니다. ‘그들을 앞서 심판에 이르다’는 죄가 의인화되어 사람보다 먼저 심판에 간다는 원문의 비유를 보존합니다.
  terminology: ‘죄’, ‘심판’은 적절합니다. κρίσις의 범위를 특정한 교회적 평가나 종말의 심판으로 한정하지 않았습니다. 각주 b의 ‘신적 심판의 어감’은 현대 한국어에서 다소 딱딱하므로 ‘하나님의 심판’으로 자연스럽게 고치되, ‘가리킬 수도’와 ‘어감도’의 가능성 표현을 유지합니다.
  issues:
  - severity: medium
    issue: ‘심판으로 나아가지만’의 조사 및 동사 결합
    rationale: εἰς κρίσιν은 ‘심판에 이르다/나아가다’로 옮기는 것이 자연스럽습니다. 현행 ‘심판으로 나아가다’는 목적지 표현으로 어색하며, 원문의 ‘심판에 앞서 간다’는 이미지를 덜 분명하게 합니다.
  - severity: low
    issue: 본문의 ‘드러나 있어’
    rationale: 의미는 맞지만 합쇼체 성경 본문에서는 ‘드러나 있습니다’가 더 자연스럽고 문체상 안정적입니다.
  - severity: low
    issue: 각주 a가 영어 대안의 범위를 넘어 전체 절을 새로 제시함
    rationale: 영어 감사 기록의 대안은 πρόδηλοί의 ‘obvious/evident’ 차이에 관한 것입니다. 한국어 각주도 해당 어휘 대안만 간결하게 제시하는 편이 정확합니다.
  - severity: low
    issue: 각주 b의 ‘신적 심판의 어감’
    rationale: 뜻은 전달되지만 자연스러운 현대 한국어는 ‘하나님의 심판을 뜻할 수도 있습니다’입니다. 이는 해석을 확정하지 않고 원문의 넓은 가능성을 보존합니다.
  revised_text: 어떤 사람들의 죄는 분명히 드러나 있어서 그들을 앞서 심판에 이르지만, 다른 사람들의 죄는 뒤따라옵니다.
  revised_footnotes:
  - marker: a
    text: 또는 「어떤 사람들의 죄는 명백합니다」.
    reason: lexical_alternative
  - marker: b
    text: 「심판」은 이 문맥에서 현재의 평가를 가리킬 수도 있으나, 더 넓게는 하나님의 심판을 뜻할 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 본문을 현대 표준어 합쇼체로 다듬고, προάγουσαι εἰς κρίσιν의 ‘앞서 심판에 이르다’라는 의인화된 이동 이미지를 유지했습니다. 마지막 절은 그리스어의 생략을 한국어에서 자연스럽게 보완하여 ‘다른 사람들의 죄’라고 하되, 죄가 나중에 뒤따른다는 원문의 모호한 시간적·판단적 여지를 해소하지 않았습니다. 각주는 영어 POB 감사 기록의 기능과 범위에 맞추어 정리했습니다.
