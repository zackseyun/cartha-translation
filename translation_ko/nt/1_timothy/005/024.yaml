review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 대조 구조는 대체로 보존되었습니다. 다만 「그들을 앞서 심판으로 나아가지만」은 죄들이 사람들보다 먼저 심판을 향해 간다는 원문의 인격화된 이미지를 한국어에서 다소 어색하게 전달합니다. 「그들보다 먼저 심판에 이르지만」이 전진 방향과 선행 관계를 더 자연스럽고 명료하게 나타냅니다.
  naturalness: 「드러나 있어」와 뒤따르는 분사는 가능하지만, 이 문맥에서는 「분명히 드러나 있으며」가 현대 표준어 문장으로 더 자연스럽고 문어적 합쇼체 성경 번역의 격식에도 잘 맞습니다.
  terminology: 「죄」와 「심판」은 적절합니다. ἄνθρωποι는 문맥상 일반적 사람들을 가리키므로 「사람들」이 알맞습니다. 각주의 「심판에 들어간다」는 원문의 ‘앞서 가다’의 관계를 충분히 드러내지 못하므로 본문의 수정에 맞추어 고칩니다.
  issues:
  - severity: medium
    issue: 본문의 「그들을 앞서 심판으로 나아가지만」이 부자연스럽고 수식 관계가 불명확합니다.
    rationale: προάγουσαι는 죄들이 해당 사람들보다 먼저 심판을 향해/심판에 이르는 모습을 나타냅니다. 「그들보다 먼저 심판에 이르지만」은 이를 자연스럽게 보존합니다.
  - severity: low
    issue: 각주 a의 「그들보다 먼저 심판에 들어간다」는 ‘앞서 감’의 비교 관계를 충분히 명시하지 않습니다.
    rationale: 대안 번역에서도 죄가 사람들보다 선행한다는 원문의 이미지를 보존하도록 「그들보다 먼저 심판에 이른다」로 조정합니다.
  revised_text: 어떤 사람들의 죄는 분명히 드러나 있으며, 그들보다 먼저 심판에 이르지만, 다른 사람들의 죄는 뒤따라옵니다.
  revised_footnotes:
  - marker: a
    text: 또는 「어떤 사람들의 죄는 분명하여, 그들보다 먼저 심판에 이른다」.
    reason: lexical_alternative
  - marker: b
    text: 「심판」은 본 문맥에서 현재의 평가를 가리킬 수도 있으나, 이 말은 더 폭넓게 신적 심판을 가리킬 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 본문을 현대 표준어의 자연스러운 문장으로 다듬되, 죄들이 사람들보다 먼저 심판에 이른다는 원문의 비유적·인격화된 표현과 「심판」의 해석상 열린 범위를 유지했습니다. 각주 a도 본문의 선행 관계를 정확히 반영하도록 수정했습니다.
