  source_fidelity: 수정이 필요합니다. 본문의 복수 명령 μανθανέτωσαν은 과부의 자녀나 손주들을 가리키므로 ‘그들은 … 배워야 합니다’로 명시하는 편이 정확합니다. 또한 τὸν ἴδιον οἶκον은 단순히 ‘집안에서’가 아니라 자기 가정/집안에 대하여 경건을 실천한다는 뜻이며, τοῖς προγόνοις를 본문에서 ‘부모’로 한정하는 것은 그리스어의 범위보다 좁습니다.
