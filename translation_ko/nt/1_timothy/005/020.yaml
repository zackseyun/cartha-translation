  source_fidelity: 수정 전 본문은 τοὺς ἁμαρτάνοντας의 목적격 표지(‘자들을’)가 빠져 있었고, ἵνα와 접속법 ἔχωσιν이 나타내는 목적을 ‘될 것입니다’라는 단순 미래 진술로 옮겼습니다. 이를 목적의 명령 표현으로 바로잡았습니다. ‘모든 사람 앞에서’, ‘책망하십시오’, ‘나머지 사람들’, ‘두려움’은 원문의 의미 범위를 적절히 보존합니다.
  naturalness: ‘죄를 짓는 자들을 모든 사람 앞에서 책망하십시오’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그리하여 … 갖게 하십시오’는 앞의 명령과 목적절의 관계를 분명히 합니다.
