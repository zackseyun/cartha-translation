  to: 잘 이끄는 장로[a]들은 갑절의 공경[b]을 받을 만한 이들로 여기십시오. 특히 말씀과 가르침에 수고하는[c] 장로들은 더욱 그렇게 여기십시오.
  rationale: 「잘 이끄는」으로 지도력의 뜻을 자연스럽게 옮기고, 「갑절의 공경」으로 τιμή의 폭을 보존했습니다. 또한 후반절을 명령문으로 명시하여, 말씀과 가르침에 수고하는 장로들이 특별히 이러한 공경을 받을 만한 이들로 여겨져야 한다는 원문의 구조를 분명히 했습니다.
