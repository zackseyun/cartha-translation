review_pass:
  verdict: revise
  source_fidelity: 그리스어의 수동 명령법(ἀξιούσθωσαν), ‘두 배의 존경’(διπλῆς τιμῆς), 그리고 μάλιστα의 ‘특히’의 범위는 대체로 잘 반영되었습니다. 다만 προεστῶτες는 이 문맥에서 실제 지도력을 나타내지만, 「다스리는」은 현대 한국어에서 다소 통치적이고 강하게 들릴 수 있으므로 「잘 이끄는」이 원문의 의미와 영어 감사 기록의 ‘lead well’을 더 자연스럽게 전달합니다.
  naturalness: 「…자들이 그러합니다」도 이해되지만, 원문의 명령을 직접 유지하여 「…장로들은 더욱 그렇게 여기십시오」라고 하는 편이 더 명료하고 자연스럽습니다. 「갑절의 공경」은 성경 문체에서 자연스러우며 τιμή가 존경과 지원을 함께 암시할 수 있는 여지를 보존합니다.
  terminology: πρεσβύτεροι는 문맥상 교회의 장로/지도자를 가리키므로 「장로」가 적절합니다. 「말씀과 가르침」은 λόγῳ καὶ διδασκαλίᾳ의 병렬을 보존합니다. 「공경」은 본문 내 τιμή의 폭을 「존경」보다 조금 더 잘 유지하며, 각주에서 물질적 지원 가능성을 밝혀야 합니다.
  issues:
  - severity: low
    issue: 「잘 다스리는」의 어감
    rationale: προΐστημι는 지도·감독을 포함하지만, 여기서는 「잘 이끄는」이 불필요하게 통치적이지 않으면서 원문의 지도력 의미를 충실히 옮깁니다.
  - severity: low
    issue: 「두 배의 존경」의 의미 폭
    rationale: τιμή는 존경뿐 아니라 문맥상 물질적 지원을 포함할 수 있습니다. 「갑절의 공경」과 각주가 이 의미 폭을 더 잘 보존합니다.
  - severity: low
    issue: 둘째 절반의 명령 연결
    rationale: 「특히 … 자들이 그러합니다」보다 「특히 … 장로들은 더욱 그렇게 여기십시오」가 수동 명령법의 적용 대상을 분명히 하고 한국어 문장 흐름도 개선합니다.
  revised_text: 잘 이끄는 장로[a]들은 갑절의 공경[b]을 받을 만한 이들로 여기십시오. 특히 말씀과 가르침에 수고하는[c] 장로들은 더욱 그렇게 여기십시오.
