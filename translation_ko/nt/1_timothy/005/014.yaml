review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 동사들의 병렬 구조는 대체로 충실합니다. 다만 νεωτέρας가 문맥상 가리키는 ‘젊은 과부들’을 대괄호로 처리할 필요는 없으며, 본문에 자연스럽게 명시하는 편이 낫습니다. μηδεμίαν은 ‘어떤 …도’로 드러내는 것이 부정의 강도를 더 분명히 보존합니다.
  naturalness: ‘젊은 [과부]들’의 대괄호는 성경 본문으로서 부자연스럽습니다. ‘시집가서’도 가능하나 현대 표준어의 공적·성경 번역 문체에서는 ‘결혼하고’가 더 중립적이고 자연스럽습니다. ‘가정을 이끌며’는 οἰκοδεσποτεῖν의 가정 운영·감독 의미를 자연스럽게 전달합니다.
  terminology: ‘대적하는 자’는 원문의 불특정 단수성을 보존하며 사탄으로 단정하지 않습니다. ‘비방할 어떤 빌미도’는 λοιδορίας χάριν의 목적/결과 관계와 ἀφορμή의 ‘구실, 빌미’를 명료하게 표현합니다. 각주는 대적자의 가능한 사탄 지시를 가능성으로만 남기고, γαμεῖν 자체가 재혼을 명시하지 않는다는 점을 보존합니다.
  issues:
  - severity: low
    issue: ‘젊은 [과부]들’의 대괄호 표기
    rationale: 문맥상 보충된 지시 대상은 본문에 자연스럽게 ‘젊은 과부들’로 표현할 수 있습니다. 대괄호는 독해를 방해하고, 이 문맥에서는 불필요한 편집 표지입니다.
  - severity: low
    issue: ‘시집가서’의 표현
    rationale: 의미상 틀리지는 않지만, γαμεῖν의 단순한 ‘결혼하다’보다 성별 관용 표현의 색채가 강합니다. ‘결혼하고’가 원문의 비표지성을 더 잘 보존합니다.
  - severity: low
    issue: μηδεμίαν의 전면 부정 명시
    rationale: ‘조금도’도 가능하지만, ‘어떤 빌미도’가 ‘어떠한 기회/구실도 주지 않다’라는 원문의 수식 관계를 더 직접적으로 나타냅니다.
  revised_text: 그러므로 나는 젊은 과부들이 결혼하고[b] 자녀를 낳고 가정을 이끌며, 대적하는 자[a]에게 비방할 어떤 빌미도 주지 않기를 원합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「원수」. 사탄을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 단순히 「결혼하다」라고 말합니다. 문맥이 젊은 과부들에 관한 것이므로 재혼이 함의됩니다.
    reason: lexical_alternative
  revision_rationale: 문맥상 함의된 ‘과부들’을 대괄호 없이 본문에 자연스럽게 반영하고, γαμεῖν은 재혼을 본문에서 명시하지 않는 ‘결혼하고’로 옮겼습니다. 가정 관리의 능동적 의미는 ‘가정을 이끌며’로, 상대에게 주지 말아야 할 ἀφορμή는 ‘비방할 어떤 빌미도’로 다듬었습니다. 각주 표지는 해당 단어에 정확히 연결되며, 대적자의 정체에 관한 원문의 모호성을 유지합니다.
