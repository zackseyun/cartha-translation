review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 충실합니다. νεωτέρας는 앞 문맥의 과부들을 가리키며, 결혼·출산·가정 관리·비방의 빌미를 주지 않음이라는 병렬 구조도 잘 반영했습니다. 다만 본문에 대괄호로 「과부」를 넣는 방식은 번역문으로 부자연스럽고, 문맥상 보충한 말은 대괄호 없이 명시하는 편이 안전합니다.
  naturalness: 「젊은 과부들이 결혼하여 자녀를 낳고 가정을 관리하며」가 현대 표준어 합쇼체 문장으로 자연스럽습니다. 「집안을 다스리며」도 가능한 번역이나, 현대 한국어에서는 다소 권위주의적으로 들릴 수 있어 οἰκοδεσποτεῖν의 가정 운영·관리 의미를 「가정을 관리하며」로 옮겼습니다.
  terminology: 「대적하는 자」는 τῷ ἀντικειμένῳ의 단수성과 지시 대상의 열려 있는 성격을 보존합니다. 「비방할 빌미」는 λοιδορίας χάριν의 목적/근거의 뉘앙스를 자연스럽게 나타냅니다. 각주에서는 사탄을 가리킬 가능성을 가능성으로만 남겨 본문의 모호성을 유지했습니다.
  issues:
  - severity: low
    issue: 본문의 「젊은 [과부]들」이라는 대괄호 표기
    rationale: 과부라는 보충은 문맥상 타당하지만, 본문 안의 대괄호는 한국어 성경 번역문으로 어색하며 독자에게 본문성에 관한 불필요한 인상을 줄 수 있습니다. 문맥상 지시 대상을 본문에 자연스럽게 명시하는 편이 낫습니다.
  - severity: low
    issue: 「집안을 다스리며」의 현대적 어감
    rationale: 원문의 가정 주관·운영 의미를 반영하지만, 「다스리다」는 현대 한국어에서 지배·통치의 뉘앙스가 강할 수 있습니다. 「가정을 관리하며」는 의미를 보존하면서 더 자연스럽습니다.
  revised_text: 그러므로 나는 젊은 과부들이 결혼하여 자녀를 낳고 가정을 관리하며, 대적하는 자에게 비방할 빌미를 조금도 주지 않기를 원합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「원수」. 사탄을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 단순히 「결혼하다」라고 하지만, 문맥상 젊은 과부들의 재혼이 함의됩니다.
    reason: lexical_alternative
  revision_rationale: 문맥상 보충된 「과부」를 대괄호 없이 자연스럽게 본문에 반영하고, 가정 운영을 가리키는 동사를 현대 한국어에 맞게 조정했습니다. 또한 비방의 목적/근거를 「비방할 빌미」로 명료하게 표현했습니다. 각주 표지는 각각 「대적하는 자」와 「결혼하여」에 유지해야 합니다.
