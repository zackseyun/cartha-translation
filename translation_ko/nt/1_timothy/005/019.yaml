id: 1TI.5.19
reference: 1 Timothy 5:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
  footnotes:
  - marker: a
    text: Or 'an older man,' if πρεσβυτέρου is taken in the age-based sense rather than as the church office 'elder.'
    reason: alternative_reading
  - marker: b
    text: This wording reflects the OT legal principle that a matter is established by 'two or three witnesses' (cf. Deut 19:15).
    reason: cross_reference
translation:
  language: ko
  text: 장로[a]에 대한 고발은 두세 증인의 증언에 근거하지 않고서는 받아들이지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「연로한 사람」. πρεσβύτερος를 교회 직분인 「장로」가 아니라 나이에 관한 뜻으로 이해할 경우의 번역이다. 그러나 앞 문맥(17절)을 고려하면 여기서는 「장로」가 가장 자연스럽다.
    reason: alternative_reading
  - marker: b
    text: 「두세 증인의 증언」은 한 사건이 두세 증인의 증언으로 확정된다는 구약의 법 원칙을 반영한다(신 19:15 참조).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου κατηγορίαν
  english_pob_choice: an accusation against an elder
  chosen_korean: 장로에 대한 고발
  alternatives_korean:
  - 장로를 거슬러 제기되는 고소
  lexicon: BDAG
  rationale: 17절과 일관 「장로」.
- source_word: μὴ παραδέχου
  english_pob_choice: Do not accept
  chosen_korean: 받아들이지 마십시오
  alternatives_korean:
  - 받아들이지 말라
  lexicon: BDAG
  rationale: παραδέχομαι의 「받아들이다·승인하다」.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  english_pob_choice: on the basis of two or three witnesses
  chosen_korean: 두 사람이나 세 사람의 증인이 없이는
  alternatives_korean:
  - 두세 증인의 진술에 근거하지 않고는
  lexicon: BDAG
  rationale: 「~없이는」 부정 구문으로 더 자연스럽게.
