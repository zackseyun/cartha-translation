translation:
  language: ko
  text: 새로 믿기 시작한 사람이어서는 안 됩니다. 그가 교만해져서 마귀의 심판[a]에 빠지지 않도록 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
