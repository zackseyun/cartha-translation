  source_fidelity: 핵심 의미는 대체로 충실하나, κρίμα를 본문에서 ‘정죄’로 한정하여 ‘심판’이 지닌 범위와 속격 τοῦ διαβόλου의 의도적 모호성을 다소 좁힙니다. 또한 ἵνα μὴ의 목적 표현은 ‘그렇지 않으면 … 때문입니다’보다 직접적으로 드러내는 편이 좋습니다.
  naturalness: ‘새로 믿은 사람’은 자연스럽지만 ‘새로 믿기 시작한 사람’이 νεόφυτον의 교회적 의미를 더 분명히 합니다. ‘교만으로 마음이 부풀어’는 τυφωθείς의 비유와 자만의 뜻을 현대 표준어로 자연스럽게 전달합니다.
  terminology: ‘마귀’는 διάβολος의 일반적인 한국어 성경 용례에 맞습니다. κρίμα는 본문에서 ‘심판’으로 옮겨 정죄를 포함하는 폭넓은 뜻과 속격의 관계상 모호성을 보존하고, 가능한 해석은 각주로 제시합니다.
  issues:
  - severity: medium
    issue: ‘마귀의 정죄’가 κρίμα와 τοῦ διαβόλου의 모호성을 좁힘
    rationale: κρίμα는 ‘심판’ 또는 ‘정죄’가 될 수 있으며, ‘마귀의’는 마귀가 받은 심판과 마귀와 관련된 심판 사이의 관계를 확정하지 않습니다. 본문은 ‘심판’으로 두고 각주에서 대안을 제시하는 것이 안전합니다.
  - severity: low
    issue: 목적절의 연결 방식
    rationale: ἵνα μὴ는 경고의 목적을 나타냅니다. ‘그렇지 않으면 … 때문입니다’는 한국어로 다소 중복되고 논리 관계가 약해질 수 있으므로 ‘… 일이 없도록’으로 옮깁니다.
  revised_text: 새로 믿기 시작한 사람이어서는 안 됩니다. 그가 교만으로 마음이 부풀어 마귀의 심판에 빠지는 일이 없도록 해야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「마귀가 받은 정죄에 빠질」; 또는 「마귀와 관련된 심판 아래 떨어질」.
    reason: alternative_reading
  revision_rationale: νεόφυτον은 새로 신앙에 들어온 사람을 가리키므로 ‘새로 믿기 시작한 사람’으로 옮겼습니다. τυφωθείς의 ‘부풀다’라는 비유는 ‘교만으로 마음이 부풀어’에 반영했습니다. κρίμα는 ‘심판’으로 번역하고, τοῦ διαβόλου의 관계를 본문에서 확정하지 않았습니다. 이에 따른 해석 대안은 각주에 유지했습니다.
