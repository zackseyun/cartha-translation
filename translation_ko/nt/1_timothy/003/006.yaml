review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders νεόφυτον as a person newly come to faith and τυφωθείς as becoming proud. However, «마귀의 정죄» narrows κρίμα (‘judgment’) to condemnation, and «그렇지 않으면 ... 때문입니다» recasts the Greek purpose/warning clause (ἵνα μὴ) as a causal explanation.
  naturalness: «새로 믿은 사람» is understandable and natural in church usage. Recasting the second sentence as a warning purpose clause is more natural and more closely reflects the Greek syntax in modern formal Korean.
  terminology: «심판» better represents κρίμα without deciding whether condemnation is intended. «마귀의 심판» retains the Greek genitive’s ambiguity in the main text; the footnote states principal interpretive possibilities without making either one the text.
  issues:
  - severity: medium
    issue: «마귀의 정죄» is too narrow for κρίμα.
    rationale: κρίμα can denote judgment more broadly and the construction with τοῦ διαβόλου is disputed. «심판» preserves both the lexical range and the ambiguity.
  - severity: medium
    issue: «그렇지 않으면 ... 때문입니다» does not adequately express ἵνα μὴ.
    rationale: The Greek presents the reason for the qualification as a preventive purpose/result (‘so that/lest he become proud and fall’), not simply a causal ‘because’ statement.
  revised_text: 새로 믿기 시작한 사람이어서는 안 됩니다. 그가 교만해져서 마귀의 심판[a]에 빠지지 않도록 해야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「마귀가 받은 것과 같은 정죄에 빠질」; 또는 「마귀와 관련된 심판 아래로 떨어질」.
    reason: alternative_reading
  revision_rationale: The revision uses «심판» for κρίμα and changes the connective to a preventive purpose expression corresponding to ἵνα μὴ. The main text leaves τοῦ διαβόλου (‘of the devil’) open, while the footnote records the leading contextual interpretations.
