  to: '모두가 인정하듯 경건의 비밀은 위대합니다[a]:


    그분께서 육체로 나타나셨고,


    영으로 의롭게 인정되셨으며[b],


    천사들에게 보이셨고,


    민족들 가운데 선포되셨으며[c],


    세상에서 믿음을 받으셨고,


    영광 가운데 들려 올라가셨습니다[d].'
  rationale: 공동의 고백이라는 ὁμολογουμένως의 의미를 본문에 반영하고, δικαιόω의 여기 문맥상 ‘입증/정당화’ 의미를 명료하게 했습니다. ἔθνεσιν과 ἐν πνεύματι의 해석상 여지는 각각 본문과 각주에 보존했습니다. 수동태의 찬송적 병렬과 합쇼체 종결은 유지하면서 현대 표준어 어법을 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:48:29Z'
review_pass:
  verdict: revise
  source_fidelity: SBLGNT의 ὅς, 수동 동사 연쇄, 그리고 ἐν πνεύματι의 모호성을 대체로 잘 반영합니다. 다만 ὁμολογουμένως를 단순한 강조인 「참으로」로 옮기면 공동의 인정·고백이라는 의미가 약해집니다. 또한 ἔθνεσιν의 더 넓은 기본 의미는 본문에서 「민족들」로 두고 「이방인들」을 대안으로 처리하는 편이 원문과 영어 POB의 선택에 더 충실합니다. 「의롭다 함을 받으셨다」는 한국어에서 의롭게 만들어졌다는 의미로 읽힐 수 있으므로, 여기의 ‘입증/정당화’ 의미를 드러내야 합니다.
  naturalness: 합쇼체와 찬송적 병렬 구조는 자연스럽습니다. 그러나 「세상에서 믿어지셨고」는 현대 한국어에서 다소 부자연스럽고, 「들리어」는 현대 표준어 문맥에서 「들려」보다 덜 자연스럽습니다. 「모두가 인정하듯」, 「믿음을 받으셨고」, 「들려 올라가셨습니다」가 현대적이면서도 격식을 유지합니다.
  terminology: 「경건의 비밀」, 「천사들」, 「영광」은 적절합니다. πνεύμα는 본문에서 「영」으로 유지하고 각주에서 성령 및 ‘성령 안에서’ 해석을 제시하는 것이 적절합니다. δικαιόω에는 구원론적 ‘칭의’와 혼동되지 않도록 「의롭게 인정되셨다」를 사용합니다.
  issues:
  - severity: medium
    issue: ὁμολογουμένως가 「참으로」로 약화됨
    rationale: 이 부사는 단순한 사실 강조보다 ‘공통으로 인정되듯/고백하듯’이라는 의미를 지닙니다.
  - severity: medium
    issue: ἐδικαιώθη가 「의롭다 함을 받으셨다」로 번역됨
    rationale: 이 표현은 그분이 의롭게 되셨다는 의미로 오해될 수 있습니다. 문맥상 ‘의롭게 인정되다/옳음이 입증되다’가 적절합니다.
  - severity: medium
    issue: ἔθνεσιν의 본문 번역을 「이방인들」로 한정함
    rationale: 가능한 해석이지만, 본문은 ‘민족들’을 유지하고 ‘이방인들’을 각주 대안으로 두어 어휘 범위를 보존하는 편이 안전합니다.
  - severity: low
    issue: 「세상에서 믿어지셨고」와 「들리어」의 현대 한국어 자연스러움
    rationale: 각각 「세상에서 믿음을 받으셨고」와 「들려 올라가셨습니다」가 더 자연스럽습니다.
  - severity: low
    issue: 본문 변형 각주의 「누구께서」 표현
    rationale: ὅς는 관계대명사이며 독립적으로 「누구께서」라고 하면 한국어에서 부자연스럽습니다. 문맥상 「그분께서」로 반영되었음을 설명하는 편이 명료합니다.
