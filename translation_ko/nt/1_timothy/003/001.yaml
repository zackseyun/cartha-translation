    rationale: 문법적으로 가능하지만 다소 교회 내부의 관용적 표현이며, ὀρέγεται와 ἐπιθυμεῖ의 서로 다른 어휘 선택을 평준화합니다. 현대어 ‘열망하다/바라다’가 더 자연스럽습니다.
  revised_text: 이 말은 믿을 만합니다. 누구든지 감독하는 일[a]을 열망하면, 그는 선한 일[b]을 바라는 것입니다.
