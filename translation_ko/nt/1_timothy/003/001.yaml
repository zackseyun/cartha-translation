    issue: πιστὸς의 번역이 ‘신실합니다’로 되어 있음
    rationale: 이 공식구에서 πιστός는 말 자체가 신뢰할 만하다는 뜻입니다. ‘신실하다’는 현대 한국어에서 사람의 성품이나 하나님에 대한 충실성을 우선적으로 연상시켜 의미가 어긋날 수 있습니다.
  - severity: medium
    issue: ἐπισκοπῆς를 ‘감독의 직분’으로 고정함
