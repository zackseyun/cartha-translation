base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
  footnotes:
  - marker: a
    text: Or 'from outsiders.' The phrase refers to people outside the Christian community.
    reason: lexical_alternative
  - marker: b
    text: Or 'fall into disgrace.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the slanderer’s trap,' if διάβολος is taken in a more generic sense; here it is understood as 'the devil.'
    reason: alternative_reading
translation:
  language: ko
  text: 또한 바깥 사람들[a]에게서도 좋은 평판을 받아야 합니다. 이는 그가 수치[b]와 마귀의 올무[c]에 빠지지 않도록 하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「외부인들」. 그리스도 공동체 밖의 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「치욕」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「비방하는 자의 덫」. διάβολος를 일반적 의미로 이해하면 가능하나, 여기서는 「마귀」를 가리키는 것으로 이해합니다.
    reason: alternative_reading
