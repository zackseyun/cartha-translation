review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal terms: καλὴ μαρτυρία as ‘좋은 평판,’ ἀπὸ τῶν ἔξωθεν as people outside the Christian community without inserting that interpretation into the text, ὀνειδισμός as public shame/reproach, and παγίδα τοῦ διαβόλου as ‘마귀의 올무.’ However, ‘그렇지 않으면 … 빠질 수 있기 때문입니다’ changes the Greek purpose clause (ἵνα μή) into an explanatory conditional and adds the weaker possibility ‘수 있다.’'
  naturalness: ‘바깥 사람들에게서 좋은 평판을 받다’ is natural modern Korean. Recasting the final clause as ‘… 빠지지 않도록’ is both more idiomatic and more faithful. Footnotes should consistently use formal-polite prose.
  terminology: ‘평판,’ ‘수치,’ ‘마귀,’ and ‘올무’ are appropriate, understandable Korean terms. ‘마귀의 올무’ preserves the established biblical metaphor without forcing a denominational interpretation.
  issues:
  - severity: medium
    issue: The main text renders ἵνα μὴ as ‘그렇지 않으면 … 때문입니다.’
    rationale: The source expresses the purpose of possessing a good reputation, not a conditional explanation. The wording also introduces ‘빠질 수’ (‘may/can fall’), which weakens the intended prevention/purpose relation.
  - severity: low
    issue: Footnotes use plain declarative endings rather than the requested formal-polite register.
    rationale: Updating ‘가리킨다’ and ‘이해한다’ to ‘가리킵니다’ and ‘이해합니다’ gives the notes a consistent modern formal-polite style without changing their content.
  revised_text: 그는 또한 수치와 마귀의 올무에 빠지지 않도록 바깥 사람들[a]에게서 좋은 평판을 받아야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「외부인들」. 그리스도 공동체 밖의 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「치욕」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「비방하는 자의 덫」. διάβολος를 일반적 의미로 보면 가능하지만, 여기서는 「마귀」로 이해합니다.
    reason: alternative_reading
  revision_rationale: 'The revision restores the Greek purpose relation by using ‘… 빠지지 않도록’ and removes the added conditional/explanatory wording and weakened possibility. Footnote anchors remain placed at the relevant expressions: [a] ‘바깥 사람들,’ [b] ‘수치,’ and [c] ‘마귀의 올무.’'
