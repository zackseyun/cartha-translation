review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the favorable attestation from outsiders and the devil''s snare. However, 「그렇지 않으면 … 빠질 수 있기 때문입니다」does not represent ἵνα μή well: it changes the purpose clause into a conditional-causal statement and weakens the stated outcome with 「수」.'
  naturalness: 「좋은 평판을 받아야 합니다」is natural Korean. Recasting the final clause as 「… 빠지지 않도록」is both natural in formal Korean and closer to the Greek syntax.
  terminology: 「좋은 평판」appropriately conveys μαρτυρίαν καλὴν in this context; 「바깥 사람들」preserves the unexpressed boundary without prematurely inserting ‘church’; and 「마귀의 올무」is established, accurate biblical Korean terminology. 「수치」is acceptable for ὀνειδισμός, with 「치욕」retained as an alternative.
  issues:
  - severity: medium
    issue: The purpose clause is rendered as a conditional-causal statement.
    rationale: ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου means ‘so that he may not fall into reproach and the devil’s snare.’ 「그렇지 않으면 … 빠질 수 있기 때문입니다」adds an explicit ‘otherwise/because’ relationship not stated in Greek and makes the consequence merely possible.
  revised_text: 또한 바깥 사람들[a]에게서도 좋은 평판을 받아야 합니다. 이는 그가 수치[b]와 마귀의 올무[c]에 빠지지 않도록 하기 위함입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「외부인들」. 그리스도 공동체 밖의 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「치욕」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「비방하는 자의 덫」. διάβολος를 일반적 의미로 이해하면 가능하나, 여기서는 「마귀」를 가리키는 것으로 이해합니다.
    reason: alternative_reading
  revision_rationale: The revision restores the Greek purpose construction with 「… 빠지지 않도록 하기 위함입니다」and removes the added conditional-causal wording and weakened potential expression. It otherwise preserves the draft’s accurate and idiomatic lexical choices, while making the footnote alternatives syntactically aligned with their anchors.
