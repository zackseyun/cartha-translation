  source_fidelity: 원문의 대조 구조와 의미를 충실히 옮겼습니다. 「약간의 유익이 있을 뿐」은 πρὸς ὀλίγον의 정도상 제한을 자연스럽게 반영하며, 각주가 기간적 의미의 가능성도 보존합니다. 「모든 일에 유익합니다」와 현재의 삶 및 장차 올 삶에 관한 약속이라는 표현도 원문의 범위를 잘 전달합니다.
