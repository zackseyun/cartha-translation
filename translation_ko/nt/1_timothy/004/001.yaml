    rationale: δέ는 여기서 강한 반대보다는 담화의 완만한 전환을 나타내므로 「그런데」가 더 적절합니다.
  - severity: low
    issue: 「마음을 두어」의 결합과 자연스러움
    rationale: προσέχοντες는 어떤 대상에 주의를 기울이거나 귀를 기울이는 뜻입니다. 「귀를 기울여」는 복수의 대상인 영들과 가르침에 모두 자연스럽게 연결됩니다.
  - severity: low
    issue: 인용절 도입 표현의 중복
    rationale: 「말씀하시기를 … 하셨습니다」 대신 「말씀하십니다」와 내용절을 분리하면 λέγει의 현재형과 현대 합쇼체를 더 자연스럽게 반영합니다.
