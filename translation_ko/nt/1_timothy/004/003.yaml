  source_fidelity: 개정이 필요합니다. 현 번역은 κωλυόντων과 ἀπέχεσθαι의 규제·명령 의미 및 하나님께서 음식들을 감사로 받도록 창조하셨다는 목적을 대체로 전달합니다. 그러나 τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν을 ‘믿는 자들과 … 자들’로 옮겨, 문법상 한 집단을 가리키는 두 특성을 두 집단처럼 보이게 합니다.
  naturalness: ‘음식을 끊을 것을 명합니다’도 이해되지만, 음식에 대한 절제를 가리키는 문맥에서는 ‘음식들을 삼가라고 명합니다’가 더 자연스럽고 직접적입니다. ‘감사하며 받도록’은 ‘감사함으로 받게 하시려고’보다 현대 한국어에서 매끄럽습니다.
  terminology: ‘혼인’, ‘하나님’, ‘진리’는 적절합니다. ἐπεγνωκόσι의 완료상은 ‘진리를 알게 된’으로 옮겨, 진리를 알게 된 결과의 상태를 자연스럽게 나타낼 수 있습니다.
