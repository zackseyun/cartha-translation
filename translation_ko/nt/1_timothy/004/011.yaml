  source_fidelity: 그리스어의 두 현재 명령법(Παράγγελλε, δίδασκε)을 합쇼체 명령으로 정확히 옮겼습니다. 「이것들을」은 중성 복수 ταῦτα를, 「명하고」는 권위 있는 지시를 나타내는 παραγγέλλω를, 「가르치십시오」는 δίδασκε를 충실히 반영합니다.
