  terminology: 「명하다」는 본문에서 요구되는 παραγγέλλω의 강한 지시·명령의 뉘앙스를 유지하며, 「가르치다」는 δίδασκε의 표준적이고 자연스러운 대응어입니다. 불필요한 교리적 함의는 추가하지 않았습니다.
