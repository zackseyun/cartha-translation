    text: 또는 「노파들의 옛이야기」. 그리스어는 직역하면 「노파들에게 특징적인 신화」이며, 비하적 표현입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 γραώδεις μύθους가 지닌 구체적이고 비하적인 수사를 한국어에서 더 명료하고 자연스럽게 옮겼습니다. 나머지 어휘와 명령 구조는 유지했으며, 두 번째 δέ에 대해 원문보다 강한 전환을 암시하는 표현은 제거했습니다.
