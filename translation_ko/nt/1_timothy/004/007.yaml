    text: 또는 「노파들의 옛이야기」. 헬라어는 직역하면 「노파에게 특유한 신화들」이며, 비하적 표현이다.
    reason: lexical_alternative
  revision_rationale: 원문의 어순을 기계적으로 따르기보다, βεβήλους καὶ γραώδεις가 함께 μύθους를 수식하는 관계를 한국어에서 명료하게 표현했습니다. 두 현재 명령형을 각각 합쇼체 명령문으로 옮기고, 원문에 없는 「도리어」를 삭제했습니다. 각주는 통용적 관용적 대안을 기록하면서도 원문의 비하적 어감과 문자적 의미를 설명합니다.
