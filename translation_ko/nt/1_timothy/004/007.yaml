review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 「도리어」는 원문의 두 번째 δέ가 요구하지 않는 대조를 추가하며, 첫 명령을 연결형 「물리치고」로 처리하여 원문의 나란한 두 현재 명령형을 충분히 드러내지 못합니다. 「노파의 이야기 같은」은 γραώδεις의 ‘노파 특유의’라는 수식 관계를 다소 우회적으로 표현합니다.
  naturalness: 「속된 노파 특유의 신화들」 및 두 개의 독립된 합쇼체 명령문은 현대 표준 한국어에서 자연스럽고 분명합니다. 「경건을 위하여 훈련하십시오」는 πρὸς εὐσέβειαν의 목적 용법과 γυμνάζω의 훈련 비유를 자연스럽게 보존합니다.
  terminology: βέβηλος는 「속된」, μῦθος는 「신화」, εὐσέβεια는 목회서신의 용례에 맞춰 「경건」으로 유지합니다. γραώδεις의 원문에 있는 비하적 성격은 「노파 특유의」와 각주에서 보존하되, 불필요하게 표현을 강화하지 않습니다.
  issues:
  - severity: medium
    issue: 「도리어」가 원문에 없는 대조를 더함
    rationale: 두 번째 δέ는 긍정적 대응 명령을 연결할 뿐, ‘오히려/도리어’라는 강화된 반전 의미를 명시하지 않습니다.
  - severity: medium
    issue: 두 명령형 가운데 첫 명령을 「물리치고」로 종속 처리함
    rationale: παραιτοῦ와 γύμναζε는 모두 현재 명령형입니다. 각각 「물리치십시오」「훈련하십시오」로 옮겨 병렬 명령을 드러내는 것이 안전합니다.
  - severity: low
    issue: 「노파의 이야기 같은」의 수식 관계가 다소 완화됨
    rationale: γραώδεις는 μύθους를 직접 수식하며 ‘노파 특유의’라는 뜻입니다. 해당 표현이 더 직접적입니다.
  revised_text: 그러나 속된 노파 특유의 신화들은 물리치십시오.[a] 그대 자신을 경건을 위하여 훈련하십시오.
  revised_footnotes:
