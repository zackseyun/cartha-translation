  source_fidelity: 핵심 의미는 대체로 전달하지만, ἐπίμενε αὐτοῖς의 지속적 전념을 ‘그것들에 머무르십시오’로 옮긴 표현은 현대 한국어에서 부자연스럽고 지시 대상도 불명확합니다. 또한 σώσεις는 ‘그대 자신과 ... 듣는 이들’을 목적어로 하는 능동형이므로 이를 분명히 드러내는 것이 좋습니다.
  naturalness: ‘그것들에 머무르십시오’는 비인칭 선행사를 받는 한국어 표현으로 어색합니다. ‘이 일들에 계속 힘쓰십시오’가 명령의 지속성과 복수 지시어를 자연스럽게 전달합니다. ‘주의를 기울이십시오’도 ‘정신을 집중하고’보다 ἔπεχε의 경계하며 살피는 뉘앙스에 더 가깝습니다.
  terminology: διδασκαλία는 문맥상 ‘가르침’으로 적절합니다. σῴζω는 본문에서 ‘구원하다’를 유지하되, 그 구원의 정확한 범위를 각주에서 열어 두어야 합니다. 본문이 구원을 특정 교리적 기제로 한정하지 않으므로 그러한 해석을 번역 근거로 삼지 않습니다.
