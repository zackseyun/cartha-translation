review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. διὰ τοῦτο는 목적의 ‘이 일을 위해’보다 원인·근거의 ‘이 때문에’가 적절합니다. 또한 εἰς ζωὴν αἰώνιον은 믿는 이들의 지향점/결과를 나타내며, ‘영생을 얻을’은 의미상 가능하나 원문의 표현보다 한 단계 더 명시적입니다. ὑποτύπωσιν은 바울 자신이 후대 신자들의 본보기가 된다는 뜻이므로 목적어를 명시해야 합니다.
  naturalness: 합쇼체와 전반적인 문체는 자연스럽습니다. 다만 ‘그분의 온갖 오래 참으심’은 ‘그분의 모든 오래 참으심’이 더 자연스럽고, ‘본보기로 삼으시려는’의 대상이 불분명하므로 ‘나를 … 본보기로’로 밝혀야 합니다.
  terminology: ‘자비를 입었습니다’, ‘메시아 예수’, ‘오래 참으심’, ‘영생’은 적절합니다. ‘메시아’ 대안 각주는 해당 단어에 직접 붙어야 하나, 현 초안에서는 자비를 입었습니다에 붙어 있어 앵커가 잘못되었습니다.
  issues:
  - severity: medium
    issue: 각주 a의 앵커가 ‘자비를 입었습니다’에 붙어 있으나 각주 내용은 ‘메시아/그리스도’ 번역에 관한 것이다.
    rationale: 독자가 각주가 설명하는 단어를 식별할 수 있도록 ‘메시아’에 앵커를 옮겨야 합니다.
  - severity: medium
    issue: ‘바로 이 일을 위해’가 διὰ τοῦτο의 인과 관계를 목적 관계로 바꾼다.
    rationale: διὰ + 대격은 여기서 ‘이 때문에/이 까닭에’라는 근거를 나타냅니다.
  - severity: medium
    issue: ‘본보기로 삼으시려는’에서 본보기가 되는 대상이 문법적으로 불명확하다.
    rationale: πρὸς ὑποτύπωσιν은 바울이 장차 믿을 사람들을 위한 본보기가 되는 목적을 나타냅니다. ‘나를 … 본보기로’로 명시하는 것이 필요합니다.
  - severity: low
    issue: ‘믿어 영생을 얻을 자들’은 εἰς ζωὴν αἰώνιον을 ‘영생을 획득하다’로 다소 확정적으로 풀어쓴다.
    rationale: ‘영생에 이르도록 그분을 믿게 될 사람들’은 원문의 목적·지향 어감을 더 직접적으로 보존합니다.
  revised_text: 그러나 바로 이 때문에 내가 자비를 입었습니다. 이는 메시아[a] 예수께서 으뜸인 나를 통하여 그분의 모든 오래 참으심[c]을 보이시고, 나를 장차 영생에 이르도록 그분을 믿게 될 사람들[d]의 본보기로 삼으시려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「그리스도」. 본 번역은 칭호의 의미를 살려 「메시아」로 옮깁니다.
    reason: alternative_reading
  - marker: c
    text: 또는 「모든 관용」 또는 「모든 오래 참음」. μακροθυμία는 오래 참고 절제하는 인내를 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 「그분을 믿게 될 사람들」 또는 「그분을 믿을 사람들」.
    reason: previous_rendering
  revision_rationale: 인과 관계(διὰ τοῦτο), 바울 안에서/바울을 통하여 나타난 인내(ἐν ἐμοὶ), 바울 자신이 본보기가 되는 목적(πρὸς ὑποτύπωσιν), 그리고 영생을 향한 믿음(εἰς ζωὴν αἰώνιον)을 한국어 문장 안에서 분명히 하였습니다. ‘메시아’ 관련 각주 앵커도 해당 어휘로 바로잡았습니다.
