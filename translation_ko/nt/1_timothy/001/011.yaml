  source_fidelity: κατά의 규범적 용법을 「…을 따른」으로, τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ의 속격 연쇄를 「복되신 하나님의 영광의 복음」으로 보존했습니다. ὃ ἐπιστεύθην ἐγώ도 「그 복음이 내게 맡겨졌습니다」로 수동의 위탁 의미를 충실히 전달합니다.
