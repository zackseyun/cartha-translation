  terminology: 「복음」, 「하나님」, 「복되신」은 현대 한국어 성경 번역의 격식 있는 신학 용례에 적합합니다. 각주도 본문의 구조 보존과 관용적 형용사 번역의 대안을 적절히 제시합니다.
