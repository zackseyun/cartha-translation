  source_fidelity: 본문의 주요 구문과 의미는 정확합니다. τέλος는 목적을 뜻하는 ‘목표’, ἐκ는 세 항목을 사랑의 근원으로 제시하는 ‘~에서 우러나오는’, ἀνυποκρίτου는 ‘거짓 없는’으로 충실히 옮겼습니다. 다만 παραγγελίας를 ‘명령’으로 옮긴 선택의 대안이 영어 POB 감사 기록에는 각주로 보존되어 있으나 한국어 초안에는 해당 각주가 없어 보완하는 것이 안전합니다.
  naturalness: ‘이 명령의 목표는 … 사랑입니다’는 현대 표준 한국어의 합쇼체로 자연스럽습니다. ‘정결한 마음’, ‘선한 양심’, ‘거짓 없는 믿음’의 병렬도 명료합니다.
  terminology: ‘명령’은 παραγγελία의 권위 있는 분부라는 뜻을 무리 없이 전달합니다. ‘선한 양심’은 ‘깨끗한 양심’보다 원문의 ἀγαθή를 더 직접적으로 반영합니다. 믿음 관련 각주는 πίστις의 가능한 의미를 열어 두되, 본문 의미를 ‘진정한 신앙’으로 단정하지 않도록 조정했습니다.
