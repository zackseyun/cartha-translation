  to: '믿음 안에서 나의 참된 자녀[a]인 디모데에게: 하나님 아버지와 우리 주이신 메시아[b] 예수께로부터 은혜와 자비와 평강이 있기를 빕니다.'
  rationale: 수신자와 인사말의 구조는 유지하되, ‘우리의 주’가 메시아 예수를 수식하는 원문의 문법 관계를 「우리 주이신」으로 명료하게 했습니다. 또한 각주 a는 본문에 없는 생물학적 친자 관계의 함의를 피하고, γνήσιος의 번역 대안만 제시하도록 정리했습니다.
