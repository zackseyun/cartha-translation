  naturalness: 「우리 주 메시아 예수」는 칭호의 결속 관계가 다소 불분명하고 현대 표준 한국어에서는 약간 경직됩니다. 「우리 주이신 메시아 예수」가 자연스럽고 문법 관계를 명료하게 합니다.
  terminology: 「믿음 안에서」, 「참된 자녀」, 「은혜·자비·평강」, 「하나님 아버지」, 「메시아」는 적절합니다. 각주 a의 친자 관계 설명은 영적 관계라는 본문 문맥을 흐릴 수 있으므로, 어휘 대안만 제시하도록 고칩니다.
