    rationale: 그리스어 τοῦ κυρίου ἡμῶν은 Χριστοῦ Ἰησοῦ를 수식합니다. 「우리 주이신 메시아 예수」로 옮기면 예수가 ‘우리의 주’라는 관계를 자연스럽고 명확하게 드러냅니다.
