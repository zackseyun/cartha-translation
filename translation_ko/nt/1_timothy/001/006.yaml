  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἀστοχήσαντες는 앞선 내용을 목표에서 빗나가거나 그것을 놓친다는 뜻인데, 본문의 「이것들을 빗나가」는 한국어 문법상 부자연스럽고 목적 관계도 불명확합니다. ἐξετράπησαν은 후회나 유감의 의미를 포함하지 않으므로 「말았습니다」는 삭제하는 것이 적절합니다.
  naturalness: 「이러한 것들에서 빗나가 헛된 말로 돌아섰습니다」는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 두 방향 비유를 구별해 살립니다.
  terminology: 「헛된 말」은 ματαιολογίαν의 무익하고 공허한 말을 적절히 옮깁니다. 「어떤 사람들」도 τινες의 비특정성을 보존합니다.
  issues:
  - severity: medium
    issue: 「이것들을 빗나가」의 조사 및 결합이 부자연스럽습니다.
    rationale: 「빗나가다」가 이 문맥에서 앞선 목표·기준으로부터 이탈함을 나타낼 때는 「~에서 빗나가」가 자연스럽습니다. 원문의 속격 목적어가 지닌 '목표를 놓침'의 관계도 더 잘 드러납니다.
  - severity: low
    issue: 「돌이키고 말았습니다」가 원문에 없는 유감·결과 강조를 덧붙입니다.
    rationale: ἐξετράπησαν은 '돌아서다/벗어나다'를 뜻하며, 「-고 말다」의 비의도성이나 아쉬움은 본문에 명시되지 않습니다.
  revised_text: 어떤 사람들은 이러한 것들에서 빗나가 헛된 말로 돌아섰습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「이러한 것들을 놓쳐」. 헬라어 ἀστοχέω는 과녁을 놓치다, 목표에서 빗나가다라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「공허한 논의」 또는 「무의미한 말」.
    reason: lexical_alternative
  revision_rationale: 5절의 선행 내용을 가리키는 ὧν은 「이러한 것들」로 명시했습니다. ἀστοχήσαντες의 목표-이탈 비유는 「이러한 것들에서 빗나가」로, ἐξετράπησαν의 방향 전환은 「헛된 말로 돌아섰습니다」로 옮겨 두 동사의 의미를 보존했습니다. 원문에 없는 유감의 뉘앙스는 제거했습니다.
