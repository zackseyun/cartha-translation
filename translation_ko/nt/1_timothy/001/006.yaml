review_pass:
  verdict: revise
  source_fidelity: ἀστοχήσαντες는 앞 절의 목표·덕목들을 기준으로 ‘빗나가다/놓치다’라는 뜻이며, ‘이러한 것들에서 빗나가’가 이를 자연스럽고 분명하게 나타냅니다. ἐξετράπησαν εἰς는 헛된 말로 향해 본래의 길에서 벗어난 결과를 나타냅니다.
  naturalness: 초안의 ‘헛된 말로 돌이키고 말았습니다’는 결합이 어색하고, ‘-고 말았습니다’가 본문에 없는 유감·후회의 뉘앙스를 더합니다. ‘헛된 말에 빠져들었습니다’는 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘헛된 말’은 ματαιολογίαν의 무익하고 공허한 말을 적절히 옮깁니다. ‘어떤 사람들’도 τινες의 비특정성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘헛된 말로 돌이키고 말았습니다’
    rationale: ἐξετράπησαν εἰς의 방향·결과를 한국어로 부자연스럽게 처리하며, ‘-고 말았습니다’가 원문에 없는 후회 또는 뜻밖의 완료 뉘앙스를 첨가합니다.
  - severity: low
    issue: ‘이것들을 빗나가’
    rationale: 의미는 전달되지만 ἀστοχέω와 속격 관계를 ‘이러한 것들에서 빗나가’로 표현하면 문법 관계와 선행 내용에 대한 지시가 더 자연스럽고 명료합니다.
  revised_text: 어떤 사람들은 이러한 것들에서 빗나가 헛된 말에 빠져들었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「이러한 것들에서 벗어나」. 헬라어 ἀστοχέω는 과녁을 놓치거나 목표에서 빗나가다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「공허한 논의」 또는 「무의미한 말」.
    reason: lexical_alternative
  revision_rationale: 원문의 두 동사가 나타내는 순서와 방향을 보존하되, 한국어에서 자연스러운 연결로 고쳤습니다. ‘빠져들었습니다’는 헛된 말이라는 상태·활동으로 돌아선 결과를 나타내며, 원문에 없는 유감의 뉘앙스는 제거했습니다.
