review_pass:
  verdict: revise
  source_fidelity: 그리스어의 대조적 분사 구조와 μήτε...μήτε의 두 항은 대체로 잘 반영되었습니다. 다만 περὶ τίνων은 단순 목적어가 아니라 ‘무엇에 관하여’를 뜻하므로 이를 본문에서 드러내는 편이 더 정확합니다. νοοῦντες는 여기서 ‘이해하다’가 자연스럽고 정확합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. 다만 앞의 복수 주어에 이어지는 ‘자기가’는 ‘자신들이’로 맞추는 것이 더 매끄럽고, ‘원하면서도’가 양보 관계를 자연스럽게 나타냅니다.
  terminology: ‘율법의 교사’는 νομοδιδάσκαλοι에 충실하며 한국어 성경 문맥에서도 이해 가능한 표현입니다. 각주는 본문에서 특정하지 않은 유대 율법/토라 문맥을 가능성의 수준으로만 설명하므로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: περὶ τίνων의 관계가 ‘무엇을 단언하는지’로 평면화되어 있습니다.
    rationale: περί는 논의·단언의 대상을 ‘무엇에 관하여’라고 표시합니다. ‘무엇에 관해 그토록 단언하는지’로 옮기면 원문의 관계를 보존합니다.
  - severity: low
    issue: ‘자기가’가 복수 주어 ‘그들’과 수적으로 매끄럽게 호응하지 않습니다.
    rationale: ‘자신들이’로 고치면 원문의 복수 분사와 한국어 문장 호응을 모두 더 잘 반영합니다.
  - severity: low
    issue: μὴ νοοῦντες에 ‘알지 못합니다’를 사용했습니다.
    rationale: 문맥상 단순 지식의 부재보다 자신들의 말과 확언의 내용을 ‘이해하지 못함’을 가리키므로 ‘이해하지 못합니다’가 더 적절합니다.
  revised_text: 그들은 율법의 교사[a]가 되기를 원하면서도, 자신들이 무엇을 말하는지, 또 무엇에 관해 그토록 단언하는지 이해하지 못합니다.
  revised_footnotes:
  - marker: a
    text: 「율법의 교사」는 유대 율법(토라)을 가르칠 권위를 자처한 자들을 가리키는 것으로 보인다.
    reason: cultural_note
  revision_rationale: 본문의 의미를 바꾸지 않고, περί의 ‘~에 관하여’라는 관계를 회복했으며, 복수 주어 호응과 νοέω의 문맥상 의미를 다듬었습니다. ‘율법’은 본문대로 유지하고, 유대 율법/토라라는 역사적 문맥은 각주에서 가능성으로만 설명했습니다.
