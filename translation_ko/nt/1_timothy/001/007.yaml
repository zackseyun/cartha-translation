  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 περὶ τίνων의 ‘무엇에 관하여’를 본문에서 명시하면 두 번째 무지의 대상을 더 정확히 보존할 수 있습니다. διαβεβαιοῦνται의 강한 확신·단언의 뉘앙스도 유지했습니다.
  naturalness: 원문의 양보적 관계는 「원하면서도」가 「원하지만」보다 자연스럽고 분명합니다. 복수 주어에 맞추어 「자신들이」를 사용하고, 「무엇에 관하여 확신에 차서 단언하는지」로 현대 표준어 합쇼체 문장을 다듬었습니다.
  terminology: 「율법의 교사」는 νομοδιδάσκαλοι에 적절합니다. 본문에서는 ‘율법’으로 두고, 유대 율법/토라를 가리킬 가능성은 각주에서 제한적으로 설명하는 것이 적절합니다.
  issues:
  - severity: low
    issue: περὶ τίνων의 관계가 본문에서 충분히 드러나지 않음
    rationale: 기존 「무엇을 그토록 단언하는지」도 뜻은 통하지만, 원문은 단언의 내용 자체뿐 아니라 ‘무엇에 관하여’ 단언하는지를 말합니다. 이를 명시하면 원문의 구문적 대비를 보존합니다.
  - severity: low
    issue: 각주의 「자처한 자들」 표현
    rationale: 뜻은 정확하나 「권위를 자처하는 사람들」이 현대 한국어에서 더 자연스럽고, 현재 분사적 맥락에도 더 잘 맞습니다.
  revised_text: 그들은 율법의 교사가 되기를 원하면서도, 자신들이 무엇을 말하는지, 또 무엇에 관하여 확신에 차서 단언하는지 알지 못합니다.
  revised_footnotes:
  - marker: a
    text: 「율법의 교사」는 유대 율법(토라)을 가르칠 권위를 자처하는 사람들을 가리키는 것으로 보입니다.
    reason: cultural_note
  revision_rationale: 양보적 분사 관계를 「원하면서도」로 명료하게 옮기고, περὶ τίνων을 「무엇에 관하여」로 드러냈습니다. διαβεβαιοῦνται는 자신 있게 강하게 주장한다는 뜻이므로 「확신에 차서 단언하는지」로 번역했습니다. 율법의 구체적 지시 대상은 본문에 과도하게 한정하지 않고 각주에서 가능성으로만 설명했습니다.
