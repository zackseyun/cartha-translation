  to: 내가 마케도니아로 갈 때 그대에게 에베소에 머물러 있으라고 권한 것은, 그대가 어떤 사람들에게 다른 교훈을 가르치지 말라고 명령하게 하려는 것이었습니다.[a]
  rationale: παρεκάλεσά는 ‘권한’으로, παραγγείλῃς는 ‘명령하게’로 구별하여 원문의 어휘와 권위의 차이를 보존했습니다. ἵνα 목적절은 한국어에서 ‘…하게 하려는 것이었습니다’로 명료하게 표현했습니다. ‘다른 교훈을 가르치다’는 ἑτεροδιδασκαλεῖν의 대조적 의미를 유지하며 ‘거짓’이라는 해석적 평가를 추가하지 않습니다. 각주는 ‘다르게 가르치다’라는 가능한 어휘적 표현을 제시합니다.
