  source_fidelity: 현 초안은 παρεκάλεσά(‘권하였다/간곡히 부탁하였다’)를 ‘명하여’로 옮겨 παραγγέλλω와 구별되는 어휘의 강도를 높였습니다. 또한 ἑτεροδιδασκαλεῖν의 ‘가르치다’가 ‘전하다’로 약화되었습니다. 수정문은 바울의 권면과 디모데가 다른 이들에게 내릴 권위 있는 명령을 구별하고, ἵνα의 목적 관계를 자연스러운 한국어 완결문으로 드러냅니다.
  naturalness: ‘그대에게 명하여 에베소에 머물러 있게 한 그대로’는 수식 관계가 무겁고, 절 끝의 대시와 각주 표지가 문장 종결을 대신하여 현대 한국어로 부자연스럽습니다. ‘권한 것은 … 하려는 것이었습니다’ 구문이 합쇼체 문체에서 명료하고 자연스럽습니다.
  terminology: ἐν Ἐφέσῳ는 ‘에베소’, εἰς Μακεδονίαν은 ‘마케도니아’로 유지합니다. ἑτεροδιδασκαλεῖν은 본문에서 ‘다른 교훈을 가르치다’로 옮겨 ‘거짓’이라는 추가 평가를 피하면서도 원문의 교육 행위를 보존합니다. παραγγέλλω는 ‘명령하다’로 옮깁니다.
