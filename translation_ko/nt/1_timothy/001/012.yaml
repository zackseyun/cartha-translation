  source_fidelity: 핵심 의미는 충실합니다. Χάριν ἔχω는 감사의 표현으로, ἐνδυναμώσαντί με는 그리스도께서 바울을 강하게/능력 있게 하신 일로, πιστόν με ἡγήσατο는 바울을 신실한 사람으로 여기신 일로, θέμενος εἰς διακονίαν은 그를 사역에 세우신 일로 적절히 옮겼습니다. 다만 ‘우리 주 메시아 예수’는 한국어에서 칭호들의 관계가 다소 불분명할 수 있어, 원문의 동격 관계를 드러내는 ‘우리 주이신 메시아 예수’가 더 정확하고 자연스럽습니다.
