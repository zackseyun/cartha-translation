translation:
  language: ko
  text: 그러나 우리 주의 은혜가 메시아[a] 예수 안에 있는 믿음과 사랑과 함께 더욱더 넘쳐흘렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
