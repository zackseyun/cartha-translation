  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, 「우리는 세상에 아무것도 가지고 오지 않았습니다. 왜냐하면 우리도 아무것도 가지고 나갈 수 없기 때문입니다.」 헬라어 접속사 ὅτι는 인과적 의미(「왜냐하면」)로도, 앞의 진술에 대응하는 두 번째 진술을 이끄는 말(「또한」)로도 이해될 수 있습니다.
