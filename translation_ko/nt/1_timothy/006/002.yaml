review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the familial basis for it, the intensified service, and the final charge to teach and exhort. However, “그 섬김의 유익” specifies that the benefit is the slaves’ service, whereas the compressed Greek phrase οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι is disputed and the English audit trail intentionally leaves the benefit unspecified. The Korean should retain that restraint.
  naturalness: The revised wording uses natural modern formal-polite Korean. Plural references to the believing masters are made consistent, and “더욱 섬겨야 합니다” renders μᾶλλον without adding the nuance of doing so “well.”
  terminology: “노예들/주인들” appropriately reflects the household-slavery setting and δεσπότας. “형제들” preserves the masculine-plural familial term, with an inclusive alternative retained in a footnote. “믿는 이들” and “사랑받는 이들” naturally convey πιστοί and ἀγαπητοί without importing a doctrinal specification of who loves them.
  issues:
  - severity: medium
    issue: The phrase “그 섬김의 유익” over-specifies the referent of τῆς εὐεργεσίας.
    rationale: Although the contextual reading that believing masters benefit from the enslaved persons’ service is plausible, the Greek construction is difficult and the approved English audit trail preserves ambiguity by saying only “the benefit.” The main Korean text should likewise avoid inserting “그 섬김의.”
  - severity: low
    issue: “더욱 잘 섬겨야 합니다” adds “well” beyond μᾶλλον.
    rationale: μᾶλλον means “more/all the more.” “더욱 섬겨야 합니다” is both sufficient and closer to the source.
  revised_text: 또 믿는 주인들을 둔 노예들은 그 주인들이 형제들[a]이라는 이유로 그들을 업신여기지 말고, 오히려 더욱 섬겨야 합니다. 유익을 받는 이들이[b] 믿는 이들이며 사랑받는 이들이기 때문입니다. 이것들을 가르치고 권면하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「형제자매」. 헬라어는 「형제들」이지만, 여기서는 동료 신자 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 「유익을 받는 이들」이라는 구절은 해석이 까다롭습니다. 노예들의 섬김으로 유익을 받는 믿는 주인들을 가리키는 것으로 보는 것이 가장 자연스럽지만, 본문은 이를 명시하지 않습니다.
    reason: alternative_reading
  revision_rationale: The revision removes an interpretive addition concerning the nature of the benefit, retains the source’s ambiguity with an explanatory footnote, and makes the plural master references and the degree expression more source-faithful.
