  naturalness: ‘믿음에 관하여 빗나갔습니다’는 현대 표준어의 공식적 문체에서 자연스럽고, ἀστοχέω의 비유적 ‘목표를 빗나감’도 유지합니다. 종결 축복문은 ‘은혜가 여러분과 함께 있기를 빕니다’가 정형적이면서도 문법적으로 더 매끄럽습니다.
