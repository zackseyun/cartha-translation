  naturalness: ‘그 선한 고백으로 증언하신’의 ‘으로’는 고백을 증언의 수단으로 읽히게 하며, 원문의 뜻을 흐립니다. ‘선한 고백을 하신’은 한국어에서 자연스럽고, 공적 증언으로서의 고백이라는 문맥도 보존합니다. 하나님과 예수를 함께 ‘앞에서’의 범위에 두도록 문장 구조도 다듬었습니다.
