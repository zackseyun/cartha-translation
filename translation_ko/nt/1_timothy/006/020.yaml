  to: 디모데여, 그대에게 맡겨진 것을 지키십시오. 속되고 헛된 말과 지식이라고 거짓되이 불리는 것의 대립 주장[a]을 피하십시오[b].
  rationale: 호격의 엄숙함은 유지하되 고풍스러운 「오」를 제거했습니다. 두 형용사의 병렬을 「속되고 헛된」으로 명확히 했고, 참여분사 ἐκτρεπόμενος는 한국어에서 자연스러운 회피 명령 「피하십시오」로 옮겼습니다. ψευδώνυμος는 ‘거짓된 지식’이라고 단정하지 않고 ‘지식이라고 거짓되이 불리는 것’으로 번역하여 원문의 명명 비판을 보존했습니다. 각주 표지는 해당 어구에 맞게 배치했습니다.
