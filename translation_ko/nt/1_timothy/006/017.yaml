    issue: 재물 관련 본문 표현과 각주 b의 대안이 부정확하게 배치됨
    rationale: SBLGNT의 ἐπὶ πλούτου ἀδηλότητι는 직역상 ‘재물의 불확실성에’이며, ‘불확실한 재물에’는 가능한 대안입니다. 초안은 대안을 본문으로 채택하고 각주에는 실질적으로 동의어인 ‘불확실한 부에’를 두어 영어 감사 기록의 대조를 보존하지 못합니다.
