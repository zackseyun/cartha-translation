  source_fidelity: 원문의 명령(παράγγελλε), 현재 시대(ἐν τῷ νῦν αἰῶνι), 소망의 두 대조 대상, 그리고 하나님이 모든 것을 풍성히 제공하시는 목적을 대체로 잘 옮겼습니다. 다만 ἐπὶ πλούτου ἀδηλότητι의 본문상 표현은 ‘불확실한 재물’보다 ‘재물의 불확실성에’가 더 직접적이며, 현 초안의 각주 b는 본문과 사실상 같은 뜻을 반복하여 대안을 제공하지 못합니다.
  naturalness: ‘명하여 … 하십시오’는 명령의 수신자와 내용이 겹쳐 다소 어색합니다. ‘…라고 명하십시오’가 현대 표준어 합쇼체에서 더 자연스럽고 문장 구조도 분명합니다. ‘부유한 자들’은 가능하지만 ‘부유한 사람들’이 현대 공적 문체에서 덜 표지적입니다.
  terminology: ‘현 시대’는 αἰών의 시간적 의미를 보존하며, ‘소망을 두다’는 반복된 ἐπί의 대조를 자연스럽게 재현합니다. ‘누리도록’은 εἰς ἀπόλαυσιν의 목적을 적절히 전달합니다.
  issues:
