- from: 믿음의 선한 싸움을 싸우십시오[a]. 그대가 부르심을 받아 들어간 영생을 굳게 붙드십시오. 그대는 많은 증인 앞에서 그 선한 고백을 하였습니다[b].
  to: 믿음의 선한 싸움을 싸우십시오[a]. 부르심을 받은 영생을 굳게 붙드십시오. 많은 증인 앞에서 선한 고백을 하였습니다[b].
  rationale: The revision removes the unsupported assertion that the addressee has entered eternal life, preserves the coordinate structure of the final clause, and updates the notes to distinguish contextual association from explicit Greek syntax. It also improves modern formal-polite Korean by omitting an unnecessary literary pronoun.
