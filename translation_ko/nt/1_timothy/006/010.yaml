  source_fidelity: 핵심 어휘 선택은 대체로 원문에 충실합니다. 「온갖 악의 한 뿌리」는 ῥίζα의 무관사성과 πάντων τῶν κακῶν의 종류적 의미를 적절히 반영하며, 「많은 고통으로 자신을 꿰찔렀습니다」는 περιέπειραν ὀδύναις πολλαῖς의 강한 비유를 보존합니다. 다만 현 본문의 「…한 뿌리이기 때문입니다」는 γάρ를 문장 단위의 한국어 접속 표현으로 잘못 처리하여 독립 문장으로 성립하지 않습니다.
