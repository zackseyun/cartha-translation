  source_fidelity: 원문의 대조적 접속사 δέ, 부를 추구하는 사람들, ‘시험·올무·많은 욕망’의 병렬, 그리고 욕망들이 사람들을 ὄλεθρος와 ἀπώλεια로 빠뜨리는 관계를 충실히 반영합니다. 다만 ‘어리석고 해로운 많은 욕망’은 수식어 배열상 다소 부자연스러우므로 ‘많은 어리석고 해로운 욕망’으로 다듬는 것이 안전합니다.
