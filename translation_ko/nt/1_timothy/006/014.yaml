  rationale: ἄσπιλος의 「흠·얼룩 없음」.
- source_word: ἀνεπίλημπτον
  english_pob_choice: above reproach
  chosen_korean: 책망할 것이 없이
  alternatives_korean:
  - 흠 잡을 것 없이
  lexicon: BDAG
  rationale: 3:2와 일관.
- source_word: μέχρι τῆς ἐπιφανείας
  english_pob_choice: until the appearing
  chosen_korean: 나타나심까지
  alternatives_korean:
  - 나타나심에 이르기까지
  - 현현까지
  lexicon: BDAG
  rationale: ἐπιφάνεια의 종말론적 「나타나심」.
