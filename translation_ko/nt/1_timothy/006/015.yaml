    rationale: ἰδίοις는 ‘자기의/그분 자신의’이라는 뜻입니다. ‘정하신’은 문맥상 가능한 함의이지만 본문에 없는 동작을 전면에 내세우며, 원문의 소유 표현을 대체합니다. 「자기의 때에」로 옮겨 의미를 보존하는 것이 안전합니다.
