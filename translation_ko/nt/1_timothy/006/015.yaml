  verdict: revise
  source_fidelity: 「정하신 때에」는 καιροῖς ἰδίοις의 ‘자기의/그분 자신의 때들’이라는 소유·귀속의 뜻을 해석적으로 바꾸며, 복수의 시간적 국면도 약화합니다. 「자기의 때에」가 본문의 표현을 더 직접적으로 보존합니다. 나머지는 ἐπιφάνειαν을 받는 ἣν을 「그것」으로 옮기고, 신적 칭호 및 두 현재분사의 의미를 충실히 반영합니다.
  naturalness: 합쇼체 문장으로 자연스럽고 격식에 맞습니다. 「자기의 때에 그것을 보이실 분은」은 문맥상 선행하는 ‘나타나심’을 가리키며 자연스럽게 이해됩니다.
  terminology: 「복되시고 유일하신 통치자」, 「다스리는 자들의 왕」, 「주관하는 자들의 주」는 현대 표준어이면서 원문의 칭호와 분사 구조를 적절히 살립니다. 「주관하는 자들」은 κυριεύοντες의 ‘지배권을 행사하는 이들’을 무리 없이 전달합니다.
