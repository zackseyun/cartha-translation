translation:
  language: ko
  text: 자기의 때에[a] 그것을 보이실 분은 복되시고 유일하신 통치자, 다스리는 자들의 왕이시며 주관하는 자들의 주이십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「정해진 때에」. 본 어구는 그분에게 속한, 그분이 정하신 때를 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: 전통적 번역은 「왕의 왕, 주의 주」. 헬라어는 분사를 사용하여 직역하면 「다스리는 자들의 왕, 주관하는 자들의 주」가 된다.
    reason: alternative_reading
