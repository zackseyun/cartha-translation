  - marker: a
    text: 또는 「큰 이득」, 「큰 수익원」. 헬라어는 5절의 「이익」(πορισμός)과 같은 어휘를 사용하여 그 표현을 되받습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「만족」, 「충분함」. 여기서는 독립적인 자기 의존보다는 만족하거나 충분히 여김의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
