  source_fidelity: 초안은 주요 어휘를 대체로 적절히 옮겼으나, ἐξ ὧν γίνεται(‘그것들로부터 생겨난다’)에 해당하는 서술이 빠져 있어 악덕 목록이 문법적으로나 의미상으로 완결되지 않습니다. 또한 τετύφωται는 ‘교만에 사로잡혀’보다 ‘교만해져/교만으로 부풀어’가 원문의 상태 변화와 비유를 더 직접적으로 반영합니다.
  naturalness: ‘병적으로 집착하는 자입니다’는 이해 가능하지만, 원문의 질병 비유를 살린 ‘병들어 있습니다’가 더 자연스럽고 간결합니다. 결과 목록은 ‘…이 생겨납니다’로 마무리하면 현대 표준어 문장으로 완결됩니다.
  terminology: ‘시기, 다툼, 비방, 악한 의심’은 적절합니다. βλασφημίαι에 대한 각주는 대인 관계 문맥의 모욕적·비방하는 말을 설명하도록 다듬었습니다. ‘그리스어’가 현대 한국어 성경 및 학술 문맥에서 ‘헬라어’보다 더 중립적이고 일반적입니다.
