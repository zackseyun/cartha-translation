  - severity: low
    issue: 각주의 그리스어 형태
    rationale: 본문은 πάντων ἀνθρώπων(속격 복수)인데, 각주는 ἄνθρωποι(주격 복수)를 제시합니다. 설명상 어근을 든 것일 수 있으나, 본문 형태를 제시하는 편이 정확합니다.
