- from: 그분은 모든 사람을 위하여[a] 자신을 대속물[b]로 내어 주셨으니, 이것이 정한 때에 증언된[c] 그 증거입니다.
  to: 그분은 모든 사람을 위하여[a] 자신을 대속물[b]로 내어 주셨습니다. 이는 하나님께서 정하신 때에 주어진 증언[c]입니다.
  rationale: 원문의 ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων을 「모든 사람을 위하여 자신을 대속물로 내어 주셨습니다」로 충실히 옮겼습니다. τὸ μαρτύριον καιροῖς ἰδίοις는 동사가 생략된 압축 구문이므로, 한국어의 완결성을 위해 ‘주어진’을 최소한으로 보충했습니다. 이는 원문의 의미를 과도하게 해석하지 않으면서도 ‘증언된 그 증거’의 중복과 부자연스러움을 해소합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:48:28Z'
