  source_fidelity: 핵심 어휘의 대응은 대체로 적절하나, 현 번역은 ὑπὲρ의 목적어와 ἵνα 목적절을 연결하는 한국어 문장이 비문에 가깝습니다. 특히 ‘위해서도 그리하여’는 원문의 접속 관계를 반영하지 못합니다. 앞 절의 기도 권면이 이 절에도 이어짐을 한국어에서 보충해 명시하는 것이 안전합니다.
