review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 본문은 9절의 '자신을 단장하다'에 이어지는 대조로서, γυναῖκες가 선한 '일들'(ἔργων, 복수)로 자신을 단장해야 한다는 뜻입니다. 현 번역의 '선한 행실'은 의미상 가능하지만 복수 명사와 단장 대상인 재귀적 의미가 약화됩니다. 또한 ἐπαγγελλομέναις는 단순한 신앙 고백보다 공개적으로 내세우거나 표방한다는 뜻이 더 가깝습니다.
  naturalness: '''하나님을 경외한다고 표방하는 여자들에게 어울리는 것''은 현대 표준어의 격식 있는 문체로 자연스럽고, ''자신을 꾸미십시오''는 앞 절에서 이어지는 단장 동작을 한국어에서 명확히 합니다. ''오히려''는 앞 절의 부정적 외적 단장과의 대조를 자연스럽게 드러냅니다.'
  terminology: θεοσέβεια는 '하나님을 경외함'으로 옮길 수 있으나, 각주에서 '경배'를 동일어로 제시하면 의미가 다소 좁아질 수 있습니다. '하나님께 대한 헌신' 및 '하나님을 경외함'을 대안으로 두는 것이 적절합니다. ἔργα ἀγαθά는 '선한 일들'로 번역하여 복수와 윤리적 행위의 뜻을 보존합니다.
  issues:
  - severity: medium
    issue: ἐπαγγελλομέναις를 '고백하는'으로 번역
    rationale: 이 분사는 하나님을 경외함/경건을 스스로 내세우거나 표방하는 뜻입니다. '고백하다'도 가능하나, 자백·신앙고백의 제도적 뉘앙스를 더할 수 있어 '표방하다'가 더 가깝습니다.
  - severity: medium
    issue: ἔργων ἀγαθῶν의 복수 및 단장 대상이 불명확함
    rationale: '''선한 행실''은 포괄적 표현이지만 원문의 복수 ''선한 일들''을 흐리며, ''자신을''을 보충하지 않으면 무엇을 꾸미는지 한국어에서 불분명합니다.'
  - severity: low
    issue: 각주 b의 '하나님을 경배·경외함'
    rationale: θεοσέβεια는 하나님께 대한 경외와 헌신의 경건을 뜻하며, '경배'를 병렬 대안으로 제시하는 것은 예배 행위에 의미를 좁힐 수 있습니다.
  revised_text: 오히려 하나님을 경외한다고 표방하는 여자들에게 어울리는 것, 곧 선한 일들[c]로 자신을 꾸미십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「합당한」, 「알맞은」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「하나님께 대한 헌신」. θεοσέβεια는 하나님께 대한 경외와 헌신으로 나타나는 경건을 가리킨다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 「선한 일들을 통하여」. 이 문맥에서는 선한 일들이 합당한 단장임을 가리킨다.
    reason: lexical_alternative
  revision_rationale: 문장의 대조를 '오히려'로 유지하고, ἐπαγγελλομέναις의 '표방하다' 의미와 ἔργων ἀγαθῶν의 복수형을 반영했습니다. 9절에서 이어지는 단장 동작의 대상을 '자신을'으로 명시하되, 선한 일이 구원의 공로라는 의미는 추가하지 않았습니다. 원래의 각주 표지 체계를 보존하기 위해 a와 b 각주도 유지했으며, 해당 표지는 본 절 번역문에 직접 나타나지 않더라도 제공된 영문 감사 이력의 어휘 대안 세트를 충실히 보존합니다.
