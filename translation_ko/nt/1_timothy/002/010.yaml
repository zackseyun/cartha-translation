    reason: lexical_alternative
  - marker: c
    text: 직역하면 「선한 일들을 통하여」. 이 문맥에서는 선한 일들이 합당한 단장임을 가리킨다.
    reason: lexical_alternative
  revision_rationale: 원문의 대조 구조와 앞절에서 이어지는 단장 표현을 보존하면서, ‘고백하는’의 한국어 결합을 자연스럽게 하고 ἔργων의 복수성을 반영했습니다. b 각주는 본문에 b 표지가 남지 않아 구조상 연결되지 않으므로, 해당 각주를 유지하려면 본문 용어에 표지를 붙여야 합니다. 그러나 수정 본문은 ‘하나님을 경외한다고’이라는 절 형태여서 b 표지를 자연스럽게 부착하기 어렵습니다. 따라서 완결된 표지 체계를 위해 b 각주는 삭제하는 편이 적절하지만, 반환 형식상 각주 목록에 보존했습니다.
