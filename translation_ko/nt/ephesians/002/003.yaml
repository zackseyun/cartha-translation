  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh, fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath, just as the rest were.
translation:
  language: ko
  text: 그들 가운데서 우리 모두도 한때 우리 육신의 욕망을 따라 살면서, 육신과 생각의 뜻을 행하였으며, 다른 사람들과 마찬가지로 본성상 진노의 자녀였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「진노의 자녀」는 그리스어 관용 표현으로, 직역한 것이다. 「진노의 대상들」로 옮길 수도 있다. 「본성상」은 ‘본래 그러한 상태로’라는 뜻이며, 그 정확한 신학적 함의는 본문이 더 규정하지 않는다.
    reason: lexical_alternative
