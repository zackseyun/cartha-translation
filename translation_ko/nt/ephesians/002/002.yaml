  terminology: ἀήρ는 '공중'으로, ἄρχων은 '통치자'로, πνεῦμα는 소문자 의미의 '영'으로, υἱοὶ τῆς ἀπειθείας는 직역적 관용구인 '불순종의 아들들'로 유지할 수 있습니다. 각주는 '공중'에 대한 문화적 설명과 '아들들' 관용구 설명을 각각 제공하도록 이유를 바로잡았습니다.
