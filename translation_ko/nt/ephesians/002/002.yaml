    rationale: ἐνεργοῦντος의 계속적 현재 활동을 보존하면서 한국어 어법을 개선합니다.
  revised_text: 그 죄들 가운데에서 여러분은 한때 이 세상의 시대의 흐름을 따라, 공중의 권세를 다스리는 자, 곧 지금 불순종의 아들들 안에서 활동하는 영을 따라 살았습니다.
