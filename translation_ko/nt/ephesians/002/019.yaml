review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrast between exclusionary civic statuses and shared citizenship/household membership. However, 「성도들과 함께한 동료 시민」is not an idiomatic or syntactically sound rendering of συμπολῖται τῶν ἁγίων. The revision renders the shared-citizenship sense naturally without narrowing the referent of 「성도들」.
  naturalness: 「외인」 and 「거류민」form a clear formal pair in modern Korean, and 「성도들과 함께 시민」naturally expresses fellow citizenship. 「하나님의 가족」is a current, readily understood rendering of household membership; 「권속」is now relatively archaic.
  terminology: 「성도들」retains the established biblical term for ἅγιοι without implying a canonized class. 「하나님의 가족」communicates οἰκεῖοι τοῦ θεοῦ as belonging to God's household and avoids the dated register of 「권속」.
  issues:
  - severity: medium
    issue: 「성도들과 함께한 동료 시민」 is unidiomatic and structurally unclear.
    rationale: 「함께한」modifies an action or relationship and does not naturally modify 「동료 시민」here. συμπολῖται means those sharing citizenship with the saints; 「성도들과 함께 시민」states that relationship directly.
  - severity: low
    issue: 「하나님의 권속」has an archaic register for the requested modern standard Korean.
    rationale: Though traditionally used and broadly understandable, 「권속」is not the most natural contemporary equivalent. 「하나님의 가족」clearly conveys the household-membership metaphor.
  revised_text: 그러므로 여러분은 더 이상 외인이나 거류민이 아니며, 성도들과 함께 시민이고 하나님의 가족입니다.
  revised_footnotes: []
  revision_rationale: The revision corrects the awkward rendering of shared citizenship and updates the household term while retaining the source's inferential force, the twofold civic-status contrast, and the broad, untranslated theological scope of 「성도들」.
