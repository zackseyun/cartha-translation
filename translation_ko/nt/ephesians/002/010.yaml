review_pass:
  verdict: revise
  source_fidelity: 마지막 절의 「우리로 그 가운데서 행하게 하신 것」은 ἵνα + 접속법이 나타내는 목적을 하나님의 직접적 사역(‘행하게 하셨다’)으로 바꾸어 놓습니다. 또한 ἔργοις와 οἷς는 모두 복수이므로 「선한 일들/그 일들」로 반영하는 것이 안전합니다. 수정문은 하나님께서 선한 일들을 미리 마련하신 목적이 우리가 그 안에서 살아가는 데 있음을 보존합니다.
  naturalness: 「그분의 만드신 작품이니」보다 「그분이 만드신 작품이며」가 현대 표준어 합쇼체 문장으로 더 자연스럽습니다. ‘그 일들 가운데서 살아가다’는 바울의 περιπατέω 은유를 한국어에서 자연스럽게 전달합니다.
  terminology: ποίημα는 「작품」으로, κτισθέντες는 「지음받았습니다」로 유지할 수 있습니다. Χριστῷ Ἰησοῦ는 프로젝트의 제목 번역 원칙과 영어 POB를 따라 「메시아 예수」로 유지합니다. 「미리 마련하셨습니다」는 προητοίμασεν의 선행 준비 의미를 반영합니다.
  issues:
  - severity: medium
    issue: 「우리로 그 가운데서 행하게 하신 것입니다」가 목적절을 직접적 사역의 서술로 바꿈
    rationale: ἵνα ἐν αὐτοῖς περιπατήσωμεν은 ‘우리가 그 안에서 걷도록/살아가도록’이라는 목적을 나타냅니다. 현행의 ‘행하게 하셨다’는 하나님이 실제로 그렇게 하도록 만드셨다는 뜻을 더하여 본문의 표현보다 강합니다.
  - severity: low
    issue: 선한 일과 관계대명사의 복수가 단수로 평준화됨
    rationale: ἔργοις ἀγαθοῖς 및 οἷς는 복수입니다. 한국어에서 집합 단수도 가능하나, 대명사 연결과 원문의 수를 명료하게 하려면 「선한 일들」「그 일들」이 적절합니다.
  - severity: low
    issue: 각주에 ‘손길로 빚으신’이라는 원문에 없는 구체적 이미지를 덧붙임
    rationale: ποίημα는 만들어진 것, 작품을 뜻하지만 손으로 빚는 행위까지 특정하지 않습니다. 중립적으로 설명하는 편이 원문 의미를 더 정확히 보존합니다.
  revised_text: 우리는 그분이 만드신 작품이며[a], 메시아 예수 안에서 선한 일들을 하도록 지음받았습니다. 하나님께서는 우리가 그 선한 일들 가운데서 살아가도록 그 일들을 미리 마련하셨습니다.
  revised_footnotes:
