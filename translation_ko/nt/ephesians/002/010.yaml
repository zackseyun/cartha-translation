  to: 우리는 그분이 만드신 작품이며[a], 메시아 예수 안에서 선한 일들을 하도록 지음받았습니다. 하나님께서는 우리가 그 선한 일들 가운데서 살아가도록 그 일들을 미리 마련하셨습니다.
  rationale: 목적을 나타내는 ἵνα절을 ‘하도록’으로 옮겨 하나님의 선행 준비와 인간의 삶이라는 본문의 관계를 보존했습니다. 복수 명사를 반영하고, ‘걷다’의 삶의 방식이라는 은유는 자연스러운 한국어인 ‘그 일들 가운데서 살아가다’로 표현했습니다.
  reviewer_model: gpt-5.6-terra
