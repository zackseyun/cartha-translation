  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you, the Gentiles in the flesh, who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: ko
  text: 그러므로 기억하십시오. 여러분은 한때 육신에 있어 이방인이었고, 육신에 손으로 행한 이른바 「할례」에게서 「무할례」라 불렸습니다[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「할례」와 「무할례」는 단순한 해부학적 표현이 아니라 언약·민족적 신분을 가리키는 호칭입니다. 「이른바 할례」는 외적인 할례에 대한 유보적 또는 비판적 뉘앙스를 지닐 수 있습니다. 「육신에 손으로 행한」에서 ‘손으로 행한’은 χειροποίητος를, ‘육신에’는 ἐν σαρκί를 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἔθνη
  english_pob_choice: the Gentiles
  chosen_korean: 이방인
  alternatives_korean:
  - 열방
  - 민족들
  lexicon: BDAG
  rationale: 본 문맥에서 비유대인을 가리키므로 「이방인」을 채택.
- source_word: ἀκροβυστία / περιτομή
  english_pob_choice: uncircumcision / circumcision
  chosen_korean: 무할례 / 할례
  alternatives_korean:
  - 할례받지 않은 자 / 할례받은 자
  lexicon: BDAG
  rationale: 호칭의 무게를 보존하기 위해 명사형 「무할례/할례」를 그대로 채택.
