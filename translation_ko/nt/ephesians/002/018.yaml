    issue: ‘그러므로’ translates the conjunction in the wrong direction.
    rationale: ὅτι introduces the ground/explanation for the preceding statement; ‘이는/왜냐하면’ is required rather than an inferential ‘therefore’.
  - severity: high
    issue: ‘얻었습니다’ changes the present tense of ἔχομεν to a completed past event.
    rationale: 'The Greek states a present shared reality: ‘we have access.’'
  - severity: medium
    issue: The footnote gives an overly specific royal-audience definition of προσαγωγή.
    rationale: The word can denote access, approach, or introduction; the royal image may be evocative but is not lexically mandatory and should not be presented as its definition.
