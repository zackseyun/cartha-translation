  source_fidelity: 'The draft reverses the logical relation: ὅτι is explanatory/causal (''for/because''), not inferential (''therefore''). It also renders the present ἔχομεν as completed past (''obtained''). The revised wording retains the present shared access and the sequence through him—in one Spirit—to the Father.'
  naturalness: ‘우리 둘 다’ is natural enough while preserving the reference to both formerly divided parties. ‘아버지께 나아갈 수 있습니다’ is idiomatic modern formal-polite Korean for having access, without forcing a courtly image into the main text.
  terminology: ‘성령’ appropriately reflects the likely referent of πνεύματι in context. The prior footnote’s assertion that προσαγωγή specifically means being led before a king overstates the lexical evidence; the revised note gives viable Korean renderings without imposing that image.
  issues:
