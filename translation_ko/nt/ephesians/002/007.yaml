  source_fidelity: 개정이 필요합니다. 초안의 ‘오는 시대들 동안에’는 ἐν τοῖς αἰῶσιν의 영역적 용법을 시간적 지속(‘동안’)으로 다소 바꾸며, ‘인자하심을 통하여’는 ἐν χρηστότητι를 수단으로 강하게 해석합니다. 또한 ‘베푸신’은 원문에 없는 완료된 행위의 뉘앙스를 더합니다.
  naturalness: ‘다가올 시대들에서’, ‘우리를 향한 인자하심으로’, ‘은혜의 넘치는 풍성함’은 현대 표준어의 격식 있는 성경 문체 안에서 자연스럽고, 합쇼체의 문장 종결도 유지합니다.
  terminology: χρηστότης는 여기서 하나님의 호의롭고 선한 태도를 가리키므로 ‘인자하심’이 적절합니다. Χριστῷ Ἰησοῦ는 제목의 의미를 살려 ‘메시아 예수 안에서’로 옮깁니다. ὑπερβάλλον은 ‘측량할 수 없는’보다 ‘넘치는’이 원문의 비교·초과 의미를 더 직접적으로 반영합니다.
