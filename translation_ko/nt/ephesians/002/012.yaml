  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah, alienated from the commonwealth of Israel and strangers to the covenants of the promise, having no hope and without God in the world.
translation:
  language: ko
  text: 그 당시 여러분은 메시아 없이, 이스라엘의 시민 공동체[a]에서 소외되었고 약속의 언약들에는 외인이었으며, 소망도 없고 세상에서 하나님 없이 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
