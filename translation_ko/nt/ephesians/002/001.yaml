  footnotes:
  - marker: a
    text: 헬라어 본문은 1절을 「죽어 있는」이라는 분사 구문(ὄντας νεκρούς)으로 시작하여, 5절의 본동사(συνεζωοποίησεν, 「함께 살리셨다」)까지 문장을 종결하지 않는다. 한국어도 「죽어 있었는데」로 이어서 이 미완결 구조를 나타낸다.
