    rationale: ‘함께’가 누구와 결속되는지 즉시 드러나지 않습니다. 목적어 뒤에 「메시아와 함께」를 두면 그리스어의 결합 의미가 더 분명하고 자연스럽습니다.
  - severity: low
    issue: 기존 각주가 수정된 본문 표현과 불일치
