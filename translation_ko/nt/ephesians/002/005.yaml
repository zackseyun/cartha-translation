  source_fidelity: 「범죄」는 παραπτώματα(허물들/범과들)의 어감을 다소 좁히므로 「허물」이 더 적절합니다. 또한 συνεζωοποίησεν의 목적어와 「메시아와 함께」의 결속을 자연스럽게 드러내도록 어순을 조정했습니다. 앞 절에서 이어지는 주어 하나님을 한국어 문장에 밝혀 자연스럽게 보완했습니다. χάριτί ἐστε σεσῳσμένοι의 완료 수동 표현은 「구원을 받았습니다」로 자연스럽게 옮기되, 각주에서 완료의 결과 상태를 설명합니다.
  naturalness: 기존의 「메시아와 함께 우리를 살리셨습니다」는 수식 관계가 순간적으로 불분명합니다. 「우리를 메시아와 함께 살리셨습니다」가 현대 표준 한국어 합쇼체에서 더 자연스럽습니다. 「구원을 받은 자입니다」는 사람을 범주화하는 표현으로 다소 부자연스러워 「구원을 받았습니다」로 고쳤습니다.
  terminology: Χριστός는 제목적 의미를 살려 「메시아」로 유지했습니다. παραπτώματα는 「허물」, χάρις는 확립된 신학 용어인 「은혜」, σῴζω는 「구원」으로 옮겼습니다.
