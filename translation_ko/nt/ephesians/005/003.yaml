    rationale: ‘그 이름조차 부르지 마십시오’는 독자가 특정 ‘이름’을 발화하지 말라는 뜻으로 들릴 수 있습니다. 원문의 ‘언급조차 되지 않게/되어서는 안 된다’라는 공동체적 금지를 반영하는 표현이 더 정확합니다.
