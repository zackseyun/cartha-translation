  source_fidelity: 초안의 ‘그 이름조차 부르지 마십시오’는 μηδὲ ὀνομαζέσθω의 수동 명령형을 독자가 어떤 이름을 말하지 말라는 직접 명령으로 다소 좁혀 표현합니다. 원문은 음행, 온갖 불결함, 탐욕이 공동체 안에서 언급조차 되지 않아야 한다는 강한 금지를 나타냅니다. ‘성도에게’는 복수 여격 ἁγίοις에 맞추어 ‘성도들에게’로 고쳐야 합니다.
  naturalness: ‘성적 부도덕’, ‘온갖 불결함’, ‘언급조차 되어서는 안 됩니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 강조와 공동체적 범위를 유지합니다.
  terminology: Πορνεία는 현대적으로 ‘성적 부도덕’으로, ἀκαθαρσία πᾶσα는 포괄성을 살려 ‘온갖 불결함’으로, πλεονεξία는 범위를 좁히지 않는 ‘탐욕’으로 옮겼습니다. ἅγιοι는 바울 서신의 통상적 교회 지칭을 따라 ‘성도들’로 유지했습니다.
