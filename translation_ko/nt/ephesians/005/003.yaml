    rationale: ‘음행’은 교회 전통에서는 익숙하지만 현대 일반 한국어에서는 범위가 불명확하거나 고어적으로 들릴 수 있습니다. Πορνεία의 넓은 뜻을 ‘성적 부도덕’으로 분명히 드러낼 수 있습니다.
