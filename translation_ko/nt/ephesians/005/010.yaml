  source_fidelity: 「무엇이 주를 기쁘시게 하는 것인지」는 τί ἐστιν εὐάρεστον τῷ κυρίῳ의 간접의문문과 ‘주께/주를 기쁘시게 하는’ 의미를 충실히 옮깁니다. 「분별하면서」는 δοκιμάζοντες의 현재분사적, 지속적 권면 흐름을 자연스럽게 반영하며, 문맥상 시험하여 가려 내는 뜻을 충분히 담습니다.
