  terminology: 「주」는 κύριος를 불필요하게 ‘예수님’ 또는 ‘하나님’으로 확정하지 않고 보존합니다. 「분별」은 윤리적 식별 문맥에 적합하며 특정 교리적 해석을 더하지 않습니다.
