  source_fidelity: 초안은 γυνή/ἀνήρ를 각각 ‘아내/남편’으로 옮기고, φοβῆται의 존중·경외 의미를 반영하려는 점은 적절합니다. 그러나 οὕτως(‘이와 같이’)가 빠졌으며, πλὴν을 ‘그러나 어쨌든’으로 겹쳐 옮겨 전환의 기능이 다소 불분명해졌습니다.
  naturalness: ‘여러분 각자도’와 ‘그러나 어쨌든’의 결합은 현대 한국어 합쇼체에서 다소 어색합니다. ‘여러분도 저마다’ 및 ‘…해야 합니다’ 구성이 분배적 강조와 문장의 요약적 권면을 자연스럽게 전달합니다. 사람을 대상으로 한 ‘경외하십시오’는 한국어에서 종교적 용례를 강하게 연상시키므로 ‘존중해야 합니다’가 문맥상 더 자연스럽습니다.
  terminology: ‘아내’, ‘남편’, ‘자기 자신’은 적절합니다. φοβῆται는 본문에서 ‘존중하다’로 번역하고, 각주에서 문자적 ‘두려워하다’ 및 경외적 존중의 의미를 밝혀 어휘적 투명성을 유지하는 것이 좋습니다.
