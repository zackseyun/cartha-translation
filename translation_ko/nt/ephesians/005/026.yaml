review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the purpose clause, cleansing, sanctification, water-washing, and word imagery. However, “그녀” is unnatural and contextually under-specified in Korean where the referent is the church, and “말씀과 함께 물로 씻음으로” is syntactically stiff. The revision retains the source’s association of the washing with water and the word without deciding its theological significance.
  naturalness: Use “그 교회” for the feminine singular referent in this context and recast the instrumental phrase as a natural Korean verbal expression. “정결하게 하신 후” appropriately represents the participle’s antecedent action without requiring a doctrinal interpretation.
  terminology: “거룩하게 하시다” preserves ἁγιάζω in clear modern Korean. “말씀” preserves the breadth of ῥῆμα; the note retains the possible baptismal evocation without treating it as settled sacramental doctrine.
  issues:
  - severity: medium
    issue: The pronoun “그녀” is awkward in Korean and leaves the church referent unnecessarily opaque.
    rationale: Although αὐτήν is grammatically feminine and refers to the church in context, Korean ordinarily identifies this ecclesiological referent as “그 교회” rather than using a feminine personal pronoun.
  - severity: medium
    issue: “말씀과 함께 물로 씻음으로” is stiff and can obscure the clause’s action and relations.
    rationale: A verbal rendering more naturally conveys the cleansing through water-washing in association with the word while retaining the Greek’s ambiguity about the precise force of ἐν ῥήματι.
  - severity: low
    issue: The existing footnote reason is labeled lexical_alternative although its content is a cultural/theological-contextual note.
    rationale: Relabeling it as cultural_note accurately describes the note without altering the translation’s meaning.
  revised_text: 이는 그분이 말씀과 함께 물로 씻어 그 교회를 정결하게 하신 후, 거룩하게 하시려는 것입니다.[a]
