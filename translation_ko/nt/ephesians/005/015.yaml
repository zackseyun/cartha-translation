review_pass:
  verdict: revise
  source_fidelity: The draft conveys the general exhortation, but its second half shifts from Paul's contrast of two manners of walking/living to a more generic prohibition, “하지 말고.” Rendering the same conduct verb across both halves better reflects περιπατεῖτε and the ellipsis after “wise.”
  naturalness: “어떻게 행하는지 자세히 살피십시오” is understandable but somewhat stiff and can suggest examining one's actions in retrospect. “어떻게 살아가는지 매우 주의 깊게 살피십시오” is natural modern formal Korean and clearly communicates vigilant attention to one's manner of life.
  terminology: “지혜 없는 사람 / 지혜로운 사람” naturally expresses ἄσοφοι / σοφοί in Korean without importing a male-only implication. No specialized theological term or footnote is required.
  issues:
  - severity: medium
    issue: The contrast is rendered with “지혜 없는 자같이 하지 말고,” rather than maintaining the source's contrast in manner of life.
    rationale: Greek has “not as unwise, but as wise,” governed by the preceding imperative concerning how the audience walks. Repeating “살다” in Korean preserves this syntactic and semantic connection.
  - severity: low
    issue: “자세히 살피십시오” underrepresents the vigilance and precision of ἀκριβῶς.
    rationale: “매우 주의 깊게 살피십시오” more directly conveys careful, exact attention while remaining idiomatic.
  revised_text: 그러므로 여러분이 어떻게 살아가는지 매우 주의 깊게 살피십시오. 지혜 없는 사람처럼 살지 말고 지혜로운 사람처럼 사십시오.
  revised_footnotes: []
