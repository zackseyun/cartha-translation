    reason: lexical_alternative
  revision_rationale: 비교를 「남편이 아내의 머리인 것처럼 메시아께서도 교회의 머리이시고」로 자연스럽게 표현하여 ὡς καί를 보존했습니다. 「그분 친히」는 αὐτός의 강조를, 「그 몸의 구원자」는 τοῦ σώματος의 정관사와 명시되지 않은 소유 표현을 유지합니다. 「이는 … 때문입니다」는 앞 구절을 근거로 드는 ὅτι의 기능을 합쇼체로 자연스럽게 나타냅니다.
