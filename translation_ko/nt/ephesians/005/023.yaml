theological_decisions:
- issue: 「머리」 은유의 해석 폭
  chosen_reading: 「머리」를 직역으로 보존하여 권위·두드러짐·근원의 다층적 해석 폭을 본문 안에 닫지 않는다.
  alternative_readings:
  - 「우두머리」(권위)로 좁히기
  - 「근원」(원천)으로 좁히기
  rationale: 본 단락 전체(23–32)는 머리-몸 비유를 메시아-교회 관계로 확장한다. 한국어 본문이 은유의 다층을 보존하면, 단락 끝의 「큰 비밀」(32) 신학적 폭도 살아 있다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
