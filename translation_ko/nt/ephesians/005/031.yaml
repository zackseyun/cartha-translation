  source_fidelity: 초안은 ἀντὶ τούτου의 인과적 용법과 결혼 맥락의 성별 표현을 대체로 잘 반영합니다. 그러나 πατέρα καὶ μητέρα를 포괄적인 ‘부모’로 옮겨 원문의 명시적 병렬을 약화했고, σάρκα μίαν을 ‘한 몸’으로만 번역하여 ‘flesh’의 어휘를 충분히 드러내지 못합니다.
  naturalness: ‘이 때문에’, ‘자기 아버지와 어머니를 떠나’, ‘자기 아내와 결합할 것이며’는 현대 표준어 합쇼체 문맥에서 자연스럽고 격식에 맞습니다. ‘한 몸이 될 것입니다’는 한국어 성경 관용을 유지하되 각주로 원문의 ‘육체’를 밝혀 의미를 보완할 수 있습니다.
  terminology: γυνή는 문맥상 ‘아내’가 적절하며, προσκολληθήσεται는 ‘결합하다’로 무리 없이 옮길 수 있습니다. σάρξ의 혼인 인용구 특유의 표현은 ‘한 몸’이라는 관용 번역에 직역 각주를 덧붙여 보존합니다.
