  - severity: medium
    issue: ‘한 몸’에 대한 원문 어휘 보완 없음
    rationale: σάρξ는 여기서 혼인 결합을 가리키는 ‘flesh’이며, ‘한 몸’은 자연스러운 한국어 성경 관용이지만 ‘육체’라는 원어의 표현을 감출 수 있습니다. 직역 각주가 필요합니다.
