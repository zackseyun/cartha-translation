  text: For everything that is made visible is light. Therefore it says, "Wake up, sleeper, and rise from the dead, and Messiah will shine on you."
translation:
  language: ko
  text: 드러나는 것은 모두 빛이기 때문입니다[a]. 그러므로 다음과 같이 말합니다. “잠자는 이여, 깨어나십시오. 죽은 이들 가운데서 일어나십시오. 그러면 메시아께서[b] 당신을 비추실 것입니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “폭로되는 것은 모두 빛입니다.” 그리스어 φανερούμενον은 “드러나게 되는” 또는 “폭로되어 밝혀지는”으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 “그리스도”입니다. 여기서는 Χριστός가 칭호로 기능하므로 “메시아”로 옮겼습니다. 전통적 번역은 “그리스도”입니다.
    reason: alternative_reading
  - marker: c
    text: 이 인용의 정확한 출처는 분명하지 않습니다. 이사야 60:1과 같은 성경 주제를 반향한 것일 수도 있고, 초기 그리스도교 찬송을 반영한 것일 수도 있습니다.
    reason: cross_reference
