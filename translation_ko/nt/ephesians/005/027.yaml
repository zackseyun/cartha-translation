  source_fidelity: 개정이 필요합니다. 초안의 ‘또한’은 본절 그리스어에 없는 접속 부가어이며, ‘세우시고’는 παραστήσῃ의 목적절을 충분히 드러내지 못합니다. 또한 두 번째 ἵνα 절의 긍정 목적(교회가 거룩하고 흠 없게 되는 것)을 더 분명히 표현해야 합니다.
  naturalness: ‘자기에게 교회를 … 세우시고’는 한국어에서 어순과 수식 관계가 다소 불분명합니다. ‘그분 자신이 교회를 … 자기에게 세우시며’ 및 ‘그 교회가 … 되게 하시려는 것입니다’로 옮기면 현대 표준어 합쇼체로 자연스럽고 의미 관계도 명료합니다.
  terminology: ἐκκλησία는 ‘교회’, ἔνδοξον은 ‘영광스러운 모습’, σπίλος/ῥυτίς는 ‘티/주름’, ἁγία/ἄμωμος는 ‘거룩하고 흠 없게’로 옮기는 것이 문맥의 정결·신부 비유를 보존합니다. αὐτὸς와 ἑαυτῷ의 강조와 재귀성은 ‘그분 자신이’와 ‘자기에게’로 유지합니다.
