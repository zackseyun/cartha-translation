- from: 또한 친히 자기에게 교회를 영광스러운 모습으로—흠도 주름도 그 어떤 것도 없이—세우시고, 거룩하고 흠 없게 하시려 함입니다.
  to: 이는 그분 자신이 교회를 영광스러운 모습으로, 티나 주름이나 그와 같은 어떤 것도 없이 자기에게 세우시며, 그 교회가 거룩하고 흠 없게 하시려는 것입니다.
  rationale: 본문에 없는 ‘또한’을 제거하고, αὐτὸς ἑαυτῷ의 강조된 재귀 표현을 ‘그분 자신이… 자기에게’로 보존했습니다. ‘티나 주름이나 그와 같은 어떤 것도 없이’는 μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων을 자연스럽게 반영합니다. 마지막 절은 교회가 ‘거룩하고 흠 없게’ 되는 긍정 목적을 나타내도록 다듬었습니다.
