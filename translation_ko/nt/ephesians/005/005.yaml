  source_fidelity: 현 초안의 ‘분명히 깨달아 알아야 합니다’는 ἴστε γινώσκοντες의 강조는 살리지만 다소 중복적이고 의무 표현으로 치우칩니다. 또한 ‘이는 우상숭배자입니다’는 선행하는 사람 목록과 문법적으로 맞지 않으며, εἰδωλολάτρης의 인칭 명사를 정확히 반영하지 못합니다. 수정문은 탐욕스러운 자와 우상숭배자의 관련을 본문에서 자연스럽게 드러내되, 중성 관계대명사의 해석상 여지는 각주에 보존합니다.
  naturalness: ‘부정한 자’와 ‘기업을 누리지 못합니다’는 현대 한국어의 정중한 성경 문체 안에서 자연스럽습니다. ‘이것을 분명히 아십시오’는 합쇼체를 유지하면서도 원문의 권고적·강조적 어조를 간결하게 전달합니다.
  terminology: πόρνος는 ‘음행하는 자’, ἀκάθαρτος는 ‘부정한 자’, πλεονέκτης는 ‘탐욕스러운 자’, εἰδωλολάτρης는 ‘우상숭배자인 자’로 옮겼습니다. Χριστός는 제공된 번역 정책에 따라 ‘메시아’로 유지했고, κληρονομία는 ‘기업’으로 유지했습니다.
  issues:
