    rationale: ‘깨달아 알다’는 의미가 겹치며, ‘-아야 합니다’는 원문의 강조적 앎/권고를 필연적 의무로 다소 과도하게 바꿉니다.
  revised_text: 여러분은 이것을 분명히 아십시오. 곧 음행하는 자나 부정한 자나 탐욕스러운 자, 곧 우상숭배자인 자[a]는 메시아와 하나님의 나라에서 기업을 누리지 못합니다.
