    issue: ‘이는 우상숭배자입니다’의 지시 및 문법
    rationale: 그리스어 εἰδωλολάτρης는 ‘우상숭배자’라는 인칭 명사입니다. 초안의 ‘이는’은 앞의 복수적 사람 목록을 추상적으로 받아 단수 서술어와 결합하므로 어색하며, ‘우상숭배자’라는 술어의 대상도 불명확합니다.
  - severity: low
