review_pass:
  verdict: revise
  source_fidelity: The draft communicates the vice list, exclusion from inheritance, and the coordinate phrase 'the kingdom of Messiah and God.' However, '알아야 합니다' recasts the imperative ἴστε as a statement of obligation. The clause concerning the idolater also needs wording that more naturally reflects its contextual connection, especially with greed, while retaining the Greek syntactic ambiguity in a note.
  naturalness: '''깨달아 알아야 합니다'' is redundant and less direct in modern formal Korean. ''확실히 알아 두십시오'' is idiomatic 합쇼체. ''유업'' is clearer than ''기업'' for κληρονομίαν in contemporary Korean, where 기업 commonly means a business enterprise.'
  terminology: '''메시아,'' ''하나님,'' and ''우상숭배자'' are appropriate. ''음행하는 자,'' ''부정한 자,'' and ''탐욕스러운 자'' preserve the ethical categories and Pauline register. The footnote should state the alternative more accurately: the Greek neuter relative construction can be understood abstractly, especially in relation to greed, despite the following personal noun ''idolater.'''
  issues:
  - severity: medium
    issue: The imperative is rendered as an obligation.
    rationale: ἴστε is imperative ('know/be sure'), whereas '알아야 합니다' means 'must know.'
  - severity: medium
    issue: The main-text wording of the idolater clause is syntactically awkward and its referent is insufficiently clear.
    rationale: The Greek has a difficult neuter relative pronoun followed by εἰδωλολάτρης. In context it is most naturally connected especially with the greedy person, but an abstract construal should remain available in a footnote.
  - severity: low
    issue: 기업 may be misunderstood in modern Korean.
    rationale: For κληρονομίαν, '유업' retains the inheritance sense without the dominant modern association of 기업 with a company.
  revised_text: 여러분은 이것을 확실히 알아 두십시오. 곧 음행하는 자나 부정한 자나 탐욕스러운 자, 곧 우상숭배자인 자는 메시아와 하나님의 나라에서 유업을 얻지 못합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「곧 우상숭배에 해당하는 것이다」. 그리스어의 중성 관계대명사는 앞의 내용을, 특히 탐욕을 가리킬 수도 있다(골 3:5 참조).
    reason: alternative_reading
  revision_rationale: The revision restores the direct imperative force, uses natural formal-polite Korean, and replaces the potentially misleading '기업' with '유업.' The main text adopts the contextually strongest personal sense of εἰδωλολάτρης while the note preserves the grammatically possible abstract reading and its particular relevance to greed.
