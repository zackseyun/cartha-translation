  source_fidelity: 그리스어의 핵심 관계(남편들–아내들, 메시아–교회)와 명령 및 메시아의 자기 내어 주심은 대체로 보존되었습니다. 그러나 문장 끝의 ‘그렇게 하십시오’는 명령의 직접 목적어인 ‘사랑하십시오’를 다시 명시하지 않아, 비교가 사랑의 방식이 아니라 일반적 행동 전체를 가리키는 듯 들릴 수 있습니다. 또한 ‘그녀’는 교회를 가리키는 문법적 여성 대명사를 기계적으로 옮긴 표현으로, 현대 표준 한국어에서는 교회를 지시할 때 부자연스럽습니다.
