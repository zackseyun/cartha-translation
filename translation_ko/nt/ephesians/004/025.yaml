  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force of Διὸ, the renunciatory participle ἀποθέμενοι, the distributed imperative, and the corporate-body rationale. ‘서로의 지체’ appropriately retains the metaphorical force of ἀλλήλων μέλη.
