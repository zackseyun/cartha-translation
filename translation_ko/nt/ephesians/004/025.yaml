  terminology: ‘거짓을 벗어 버리고’ suitably renders τὸ ψεῦδος and ἀποθέμενοι. ‘진실을 말하십시오’ is the natural Korean expression for speaking ἀλήθεια in this context. ‘지체’ is the established and appropriate rendering for μέλη in the body metaphor.
  issues:
