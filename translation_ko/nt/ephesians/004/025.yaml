    issue: Awkward relational phrasing
    rationale: ‘이웃과 더불어 진리를 말하십시오’ is overly literal and less idiomatic in contemporary formal Korean. ‘이웃에게 진실을 말하십시오’ communicates truthful speech directed toward one’s neighbor naturally, without materially changing the sense.
  revised_text: 그러므로 거짓을 벗어 버리고, 각 사람은 자기 이웃에게 진실을 말하십시오. 우리는 서로의 지체이기 때문입니다.
