  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body, being joined together and held together through every supporting joint, according to the working in measure of each individual part, causes the growth of the body for building itself up in love.
translation:
  language: ko
  text: 그분에게서 온몸은 공급을 돕는 모든 관절[a]을 통하여 짜 맞추어지고 결속되어, 각 부분의 분량에 따른 활동을 통해 몸의 자람을 이루어 사랑 안에서 자신을 세워 갑니다.
  philosophy: optimal-equivalence
  footnotes:
