    rationale: ματαιότητι τοῦ νοὸς αὐτῶν은 ‘그들의 νοῦς의 헛됨/허무함 가운데’라는 구조입니다. ‘생각이 헛되다’라는 뜻은 유지하되, 헛됨이 그들의 생각(마음)에 속한다는 관계를 명시하는 편이 더 충실합니다.
  - severity: low
    issue: 문장 끝의 대시(—)를 쉼표로 바로잡아야 합니다.
    rationale: 그리스어 본문은 다음 절로 이어지는 쉼표로 끝나며, 대시는 한국어 본문에서 불필요한 단절 또는 누락처럼 보일 수 있습니다.
  - severity: low
    issue: 영어 감사 기록의 ἔθνη 어휘 대안에 대응하는 각주가 없습니다.
