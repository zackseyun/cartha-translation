  verdict: revise
  source_fidelity: 대체로 충실합니다. 다만 「그들의 헛된 생각」은 ματαιότης τοῦ νοός를 ‘헛된 생각들/내용’으로 읽히게 하여, 그들의 마음·사고 자체의 ‘허망함/공허함’이라는 속격 관계를 충분히 드러내지 못합니다.
  naturalness: 「나는 이것을 말하며 주 안에서 증언합니다」보다 「나는 이것을 말하고 주 안에서 증언합니다」가 두 동사의 병렬을 더 자연스럽게 나타냅니다. 「그들의 생각의 허망함 속에서」는 현대 표준어의 격식 있는 문체에서 자연스러우면서 원문의 의미 관계를 보존합니다.
  terminology: 「주」, 「이방인들」, 그리고 반복되는 περιπατέω의 윤리적 비유를 위한 「행하다」는 적절합니다. ἔθνη의 가능한 다른 뜻은 번역문에 넣지 않고 각주로 제시하는 것이 안전합니다.
  issues:
  - severity: medium
    issue: 「그들의 헛된 생각 가운데」가 원문의 속격 관계를 약화함
    rationale: ματαιότητι τοῦ νοὸς αὐτῶν은 ‘그들의 생각/마음의 허망함(공허함)’이지, 주로 ‘그들이 품는 헛된 생각들’을 뜻하지 않습니다.
  - severity: low
    issue: 「말하며」의 연결 방식
    rationale: λέγω καὶ μαρτύρομαι는 두 동사의 병렬이므로 「말하고 … 증언합니다」가 더 직접적이고 자연스럽습니다.
  revised_text: 그러므로 나는 이것을 말하고 주 안에서 증언합니다. 여러분은 더 이상 이방인들이 행하는 것처럼 그들의 생각의 허망함 속에서 행하지 마십시오.
  revised_footnotes:
