  source_fidelity: 핵심 권면과 반복되는 περιπατεῖν(‘행하다’)은 반영되어 있으나, ‘그들의 헛된 생각 가운데’는 속격 구조인 ‘그들의 마음/생각의 헛됨’을 다소 느슨하게 처리합니다. 또한 본문의 쉼표 자리에 대시를 둔 것은 문장 연결을 부정확하게 보이게 합니다.
  naturalness: ‘말하며’보다 병렬 동사를 살린 ‘말하고 … 증언합니다’가 현대 한국어에서 더 자연스럽습니다. ‘그들의 생각의 헛됨 가운데서’는 다소 문어적이지만 원문의 추상 명사 및 ‘ἐν’ 구문을 보존하는 자연스러운 성서 문체입니다.
  terminology: ἐν κυρίῳ는 ‘주 안에서’, ἔθνη는 문맥상 ‘이방인들’로 유지합니다. ἔθνη의 가능한 어휘 대안은 각주로 제시하여 본문의 범주를 과도하게 좁히거나 ‘이교도’라는 추가 판단을 넣지 않습니다.
  issues:
