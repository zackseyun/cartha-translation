  naturalness: ‘예수 안에 진리가 있는 것처럼’이 현대 표준 한국어에서 자연스럽고, 앞 절의 ‘가르침을 받았다면’과 비교 구문의 관계를 명확히 합니다. 본 절은 앞 문장에 문법적으로 이어지는 조건절이므로 끝의 긴 대시를 유지했습니다.
