  source_fidelity: The draft accurately renders the inferential οὖν ('그러므로'), Paul's self-description as a prisoner ἐν κυρίῳ ('주 안에서 갇힌 자'), the exhortational force of παρακαλῶ ('권합니다'), and the call to conduct oneself worthily of one's calling. '여러분이 받은 부르심' naturally conveys the calling by which they were called without adding a doctrinal specification.
  naturalness: The wording is generally natural in modern formal-polite Korean. However, the terminal em dash leaves the verse structurally incomplete. Removing it yields a complete, properly punctuated Korean sentence. '주 안에서 갇힌 내가' is slightly more natural and concise than the nominalized '갇힌 자인 내가' while preserving the source expression.
  terminology: '''부르심'' appropriately renders κλῆσις, and ''합당하게 행하십시오'' suitably retains the conduct metaphor of περιπατέω in a formal register. ''주 안에서'' preserves the breadth of ἐν κυρίῳ and should not be narrowed to ''주님을 위하여'' or possessive wording.'
