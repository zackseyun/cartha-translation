  source_fidelity: 핵심 어휘와 μέν/δέ의 분배 구조는 대체로 잘 반영되었습니다. 다만 원문의 복수 대상을 더 자연스럽게 드러내기 위해 「어떤 이들은」으로 다듬는 것이 좋습니다. 「그분이 친히」는 αὐτός의 강조를 적절히 보존합니다.
  naturalness: 초안의 「어떤 자들은」은 현대 표준어 성경 문체에서는 다소 거칠고, 「복음 전하는 자」도 직함 목록 안에서는 약간 어색합니다. 「어떤 이들은」과 「복음 전하는 이들」이 자연스럽습니다. 끝의 대시와 「주셨으니」는 이 절만 제시할 때 미완결적으로 보이므로 합쇼체 종결로 고칩니다.
