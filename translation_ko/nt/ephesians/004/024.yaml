  source_fidelity: 수정안은 ἐνδύσασθαι의 ‘입다’ 은유, τὸν καινὸν ἄνθρωπον의 ‘새사람’, κατὰ θεόν의 비해석적 표현인 ‘하나님을 따라’, 그리고 수동 분사 κτισθέντα의 ‘지음받은’을 모두 보존합니다. ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας는 ‘진리의 의와 거룩함 안에서’로 옮겨 ἐν의 영역/상태 표현과 τῆς ἀληθείας의 수식 범위를 불필요하게 한정하지 않았습니다.
  naturalness: 초안의 두 문장도 이해할 수 있으나, 그리스어에서 ‘새사람’을 수식하는 분사구를 독립 서술문으로 풀어 놓아 원문의 긴밀한 구조가 다소 약해집니다. 수식어를 ‘새사람’ 앞에 배치하면 한국어 문장 흐름도 자연스럽고 원문의 결속도 더 잘 드러납니다. ‘입으십시오’는 현대 표준어 합쇼체에 적절합니다.
  terminology: ‘새사람’은 바로 앞 문맥의 ‘옛사람’과 대응하는 확립된 용어로 적절합니다. ‘의’, ‘거룩함’, ‘진리’도 원문의 핵심 용어를 보존합니다. ‘하나님을 따라’는 다소 직역적이지만 ‘하나님의 형상대로’처럼 해석을 확정하지 않으므로 이 본문에서는 유지하는 편이 낫습니다.
