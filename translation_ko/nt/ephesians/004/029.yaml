    issue: ‘세움에 유익한’이라는 표현
    rationale: πρὸς οἰκοδομὴν τῆς χρείας는 필요한 상황/필요에 맞추어 세워 주는 말을 뜻합니다. ‘세움’은 현대 한국어에서 명사적 결합이 어색하므로 ‘필요에 맞게 세워 주는 데 좋은 말’로 옮기는 편이 명료하고 자연스럽습니다.
  - severity: low
    issue: ‘은혜를 끼치게’라는 결합
    rationale: ‘은혜를 끼치다’는 현대 한국어에서 자연스러운 결합이 아닙니다. 원문의 δῷ χάριν(은혜를 주다)을 ‘은혜를 베풀게’로 옮기면 의미와 문체를 함께 살릴 수 있습니다.
  - severity: low
    issue: 금지 명령의 표현
    rationale: ‘나오지 못하게 하고’보다 ‘나오지 않게 하십시오’가 μὴ ἐκπορευέσθω의 직접적인 금지 명령을 더 자연스럽게 전달합니다.
