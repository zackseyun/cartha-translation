review_pass:
  verdict: revise
  source_fidelity: 핵심 비유인 σαπρός를 ‘썩은 말’로 옮긴 점과 ‘듣는 이들’ 및 ‘은혜’를 보존한 점은 원문에 충실합니다. 다만 현재의 ‘나오지 못하게 하고’는 금지 명령의 직접성이 다소 약하고, ‘세움에 유익한’은 οἰκοδομή의 은유와 한국어 문장 결합을 충분히 살리지 못합니다.
  naturalness: ‘세움에 유익한 말’과 ‘은혜를 끼치게’는 현대 표준 한국어에서 다소 어색하거나 번역투입니다. ‘필요에 맞게 세워 주는 데 좋은 말’ 및 ‘은혜를 베풀게’가 합쇼체 권면문으로 자연스럽습니다.
  terminology: ‘썩은 말’은 원문의 생생한 은유를 유지하므로 적절합니다. χάριν은 여기서도 바울의 어휘를 보존하여 ‘은혜’로 두되, 한국어의 자연스러운 결합을 위해 ‘은혜를 베풀게’로 표현하는 것이 좋습니다.
  issues:
