review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the cessation of theft, personal labor, and sharing with a needy person. However, its repeated second-person honorific imperatives ('수고하십시오,' '있게 하십시오') shift the Greek's generic third-person formulation into direct address and make the purpose clause sound like a separate command. The revision retains the generic subject and represents the final clause as the purpose of honest labor.
  naturalness: The proposed wording is natural modern standard Korean in formal-polite 합쇼체. It avoids the awkward construction '나눌 것이 있게 하십시오' and gives the purpose relation a clear, idiomatic expression.
  terminology: '''도둑질하던 사람,'' ''자기 손,'' ''선한 일,'' and ''궁핍한 사람'' suitably render the principal terms. ''궁핍한 사람'' is acceptable for one who has need without narrowing the Greek to a particular kind of need.'
  issues:
  - severity: medium
    issue: Person/register shift and purpose-clause force
    rationale: The Greek uses a substantival third-person participle followed by third-person imperatives. The draft's '수고하십시오' and especially '나눌 것이 있게 하십시오' directly address the reader and turn ἵνα ἔχῃ ('so that he may have') into an additional imperative. A generic deontic formulation better preserves both grammar and the purpose relationship.
  - severity: low
    issue: Awkward Korean expression
    rationale: '''궁핍한 자와 나눌 것이 있게 하십시오'' is not idiomatic: the recipient is more naturally marked with ''-에게,'' and ''나누어 줄 것을 가질 수 있도록'' clearly expresses resources available for sharing.'
  revised_text: 도둑질하던 사람은 더 이상 도둑질하지 말고, 궁핍한 사람에게 나누어 줄 것을 가질 수 있도록 오히려 자기 손으로 선한 일을 하며 수고해야 합니다.
  revised_footnotes: []
  revision_rationale: 'The revision preserves the contrast between stealing and strenuous honest labor, retains the emphasis on one''s own hands, and makes the final ἵνα clause the stated purpose of labor: having something to share with a person in need. No Korean footnote is required because the translation does not adopt a disputed reading or introduce an ambiguity requiring explanation.'
