- from: 도둑질하던 자는 더 이상 도둑질하지 말고, 도리어 자기 손으로 선한 일을 하여 수고하십시오. 그리하여 궁핍한 자와 나눌 것이 있게 하십시오.
  to: 도둑질하던 사람은 더 이상 도둑질하지 말고, 궁핍한 사람에게 나누어 줄 것을 가질 수 있도록 오히려 자기 손으로 선한 일을 하며 수고해야 합니다.
  rationale: 'The revision preserves the contrast between stealing and strenuous honest labor, retains the emphasis on one''s own hands, and makes the final ἵνα clause the stated purpose of labor: having something to share with a person in need. No Korean footnote is required because the translation does not adopt a disputed reading or introduce an ambiguity requiring explanation.'
