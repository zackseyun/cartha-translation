- from: 이는 우리가 더 이상 어린아이가 되지 않고, 사람들의 속임수와 거짓의 술책을 향한 교활함에 의해, 모든 가르침의 바람에 휩쓸려 떠밀리지 않게 하려 함입니다—
  to: 이는 우리가 사람들의 속임수[a]와 미혹의 계략을 꾸미려는 교활함으로 말미암아, 파도에 흔들리고 모든 가르침의 바람에 이리저리 떠밀리는 어린아이로 더 이상 머물지 않게 하려는 것입니다.
  rationale: 목적절(ἵνα)을 ‘이는 … 하려는 것입니다’로 유지하고, μηκέτι ὦμεν을 ‘더 이상 … 머물지 않게’로 바로잡았습니다. 두 분사에 담긴 파도와 바람의 비유를 각각 살렸으며, 사람들의 속임수와 교활함이 그러한 불안정함을 초래하는 수단임을 ‘…으로 말미암아’로 표현했습니다. ‘미혹의 계략을 꾸미려는’은 πρὸς의 지향성을 반영하면서 πλάνη의 의미를 특정 교리적 해석으로 제한하지 않습니다.
