  source_fidelity: ὑμεῖς의 대조적 강조는 ‘여러분은’으로, δέ의 대조는 ‘그러나’로, οὐχ οὕτως는 ‘그렇게 ... 않다’로 충실히 옮겼습니다. ἐμάθετε의 능동 과거와 τὸν Χριστόν을 직접목적어로 받는 특이한 표현도 ‘메시아를 ... 배우지 않았습니다’로 보존했습니다.
  naturalness: ‘메시아를 배우다’는 일상적인 한국어 결합보다 다소 낯설지만, 원문의 의도적으로 두드러진 직접목적어 구문을 보존하면서도 이해 가능한 현대 표준어입니다. 합쇼체도 일관됩니다. 끝의 긴 대시는 다음 절로 이어지는 원문의 미완결 연결을 나타내는 표기로 수용 가능합니다.
  terminology: Χριστόν을 ‘메시아’로 옮긴 것은 본문에서의 칭호적 용법과 제시된 번역 원칙에 부합합니다. ‘그리스도’로 바꾸거나 ‘예수’를 보충할 필요가 없습니다.
