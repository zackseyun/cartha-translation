  terminology: βλασφημία를 이 문맥에서 ‘비방’으로 옮기는 것은 적절합니다. 각주에서는 신성모독이라는 가능한 대안을 밝혀 두되, ‘해코지하는 말’처럼 다소 구어적이고 범위가 불명확한 표현은 ‘모욕적이거나 해치는 말’로 다듬는 것이 좋습니다.
