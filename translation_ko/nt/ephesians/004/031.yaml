  source_fidelity: 개정이 필요합니다. πικρία는 ‘쓴 뿌리’가 아니라 내면의 쓰라림·원한·악감정에 해당하며, ‘뿌리’는 본문에 없는 비유를 추가합니다. 또한 ἀρθήτω는 공동체 윤리 권면에서 한국어 능동 명령으로 자연스럽게 옮길 수 있습니다. ‘격분’과 ‘분노’는 θυμός와 ὀργή의 구별을 적절히 유지합니다.
