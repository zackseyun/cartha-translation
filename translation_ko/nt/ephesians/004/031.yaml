  verdict: revise
  source_fidelity: 초안의 ‘쓴 뿌리’는 πικρία에 없는 ‘뿌리’ 이미지를 더하므로 삭제해야 합니다. 또한 κραυγή는 이 문맥에서 적대적인 큰 소리, 곧 ‘고함’으로 옮기는 것이 적절합니다. ἀρθήτω의 수동 명령은 ‘없어지게 하십시오’로 자연스럽게 반영했습니다.
  naturalness: ‘쓴 마음’, ‘격분’, ‘분노’, ‘고함’, ‘비방하는 말’의 병렬은 현대 표준 한국어의 격식 있는 성경 문체에서 자연스럽습니다. ‘여러분에게서 없어지게 하십시오’는 대상이 태도와 말 모두인 목록에 무리 없이 적용됩니다.
  terminology: θυμός와 ὀργή는 각각 ‘격분’과 ‘분노’로 구별했습니다. βλασφημία는 문맥상 ‘비방하는 말’로 유지하되, 주석에서 더 넓은 ‘해로운 말’ 가능성을 밝혔습니다. κακία는 ‘악의’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘쓴 뿌리’
    rationale: πικρία는 ‘쓴 뿌리’가 아니라 쓰라린 적의·원한의 태도(‘쓴 마음/쓴 감정’)를 뜻합니다. ‘뿌리’는 원문에 없으며 히브리서 12:15 등의 표현을 연상시켜 본문에 없는 이미지를 보탭니다.
  - severity: low
    issue: ‘떠드는 소리’
    rationale: κραυγή는 단순한 소란이나 떠드는 소리보다, 대인 관계의 적대적 언행 목록에서 ‘고함’ 또는 ‘고성’에 가깝습니다.
  - severity: low
    issue: 각주 표현 ‘해코지하는 말’
    rationale: 의미는 전달되지만 현대 격식 문체에서는 ‘해로운 말’ 또는 ‘모욕적인 말’이 더 자연스럽고, βλασφημία의 의미 범위도 더 정확히 보존합니다.
  revised_text: 모든 쓴 마음과 격분과 분노와 고함과 비방하는 말[a]은 모든 악의와 함께 여러분에게서 없어지게 하십시오.
  revised_footnotes:
