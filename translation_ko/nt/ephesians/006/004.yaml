  source_fidelity: 초안은 πατέρες를 ‘아버지들’로, ἐκτρέφετε를 ‘양육하십시오’로 옮겨 주요 의미를 대체로 보존합니다. 그러나 ‘분노케’는 현대 표준어 문체에 다소 고풍스럽고, ‘훈계와 권면’은 παιδεία의 훈육·교정의 의미와 νουθεσία의 권고·타이름의 의미를 충분히 구별하지 못합니다. 또한 κυρίου의 넓은 속격 관계는 ‘주의’로 유지하되 각주로 그 폭을 밝혀 두는 것이 적절합니다.
  naturalness: ‘아버지 여러분은’, ‘분노하게 하지 말고’, ‘양육하십시오’는 현대 합쇼체에서 자연스럽고 직접적인 권면 문체입니다. ‘훈육과 훈계 안에서’는 원문의 ἐν을 비교적 가깝게 반영하면서도 한국어로 이해 가능합니다.
  terminology: πατέρες는 성별을 넓히지 않고 ‘아버지’로 유지했습니다. παιδεία는 양육 과정의 훈련과 교정을 포함하는 ‘훈육’으로, νουθεσία는 말에 의한 교훈·경계의 성격을 지닌 ‘훈계’로 구별했습니다. κύριος는 프로젝트 원칙에 따라 ‘주’로 옮겼습니다.
