    text: 또는 「변함없는 사랑으로」, 「시들지 않는 사랑으로」, 「진실함으로」. 헬라어 「ἐν ἀφθαρσίᾳ」는 간결하며, 무엇을 수식하는지와 뜻이 분명하지 않은 표현이다.
