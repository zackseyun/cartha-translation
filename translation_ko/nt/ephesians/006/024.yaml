  verdict: revise
  source_fidelity: 현 번역의 ‘변함없이’는 ἐν ἀφθαρσίᾳ를 ‘변함없는 사랑’으로 해석하여, 원문의 간결한 표현과 그 수식 범위의 여지를 본문에서 좁힙니다. ‘썩지 아니함으로’는 다소 문어적이지만 원문의 ‘incorruptibility’를 더 직접적으로 보존합니다. ‘우리 주 예수 메시아’, ‘사랑하는 모든 이’, ‘은혜’는 원문에 충실합니다.
  naturalness: 현 문장은 자연스럽고 합쇼체 기도·축복 문체에도 맞습니다. 수정문도 문어적 축복문으로 자연스럽게 읽히며, ‘썩지 아니함으로’의 낯섦은 원문의 의도적인 압축성과 논쟁성을 보존하기 위한 것입니다.
  terminology: χάρις는 ‘은혜’, κύριος는 ‘주’, Χριστός는 프로젝트 방침에 따라 ‘메시아’로 유지하는 것이 적절합니다. ἀφθαρσία는 본문에서 ‘변함없이’로 의역하지 않고 ‘썩지 아니함’ 계열로 옮겨야 합니다.
  issues:
  - severity: medium
    issue: ‘변함없이’가 ἐν ἀφθαρσίᾳ의 의미를 단일한 방식으로 해석합니다.
    rationale: 이는 ‘변함없는/시들지 않는 사랑’이라는 가능한 해석을 채택한 표현입니다. 원문은 사랑의 성격, 은혜가 주어지는 방식 또는 진실성과 관련된 의미 등으로 논의되어 왔으므로, 본문에서는 보다 형식적이고 덜 결정적인 표현을 사용하고 대안은 각주에 남기는 편이 안전합니다.
  revised_text: 우리 주 예수 메시아를 썩지 아니함으로 사랑하는 모든 이에게 은혜가 함께하기를 빕니다.
  revised_footnotes:
  - marker: a
    text: 또는 「변함없이 사랑하는」, 「진실함으로 사랑하는」, 「시들지 않는 사랑으로」. 헬라어 「ἐν ἀφθαρσίᾳ」는 간결하고 의미 범위가 논쟁적인 표현이다.
    reason: alternative_reading
