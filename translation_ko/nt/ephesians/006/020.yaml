  source_fidelity: ‘사절이 되었으니’는 πρεσβεύω의 현재형(‘사절로 일하다/사절의 역할을 하다’)을 완료된 상태 변화처럼 옮깁니다. 또한 ‘그대로’보다 ὡς δεῖ의 의무·당위는 ‘대로’ 또는 ‘마땅히 … 대로’가 더 정확합니다. ἐν αὐτῷ의 중성 지시는 앞 절의 복음/복음의 비밀을 가리키므로 ‘그 안에서’로 보존할 수 있습니다.
