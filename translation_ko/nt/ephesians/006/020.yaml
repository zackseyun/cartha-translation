  to: 나는 이 복음을 위하여 쇠사슬에 매인 사절로 일하고 있으니, 내가 마땅히 말해야 하는 대로 그 안에서 담대히 말할 수 있도록 해 주시기를 빕니다.
  rationale: 현재형 πρεσβεύω를 ‘사절로 일하고 있습니다’로 바로잡고, ὡς δεῖ με λαλῆσαι를 자연스러운 당위 표현으로 다듬었습니다. ‘그 안에서’는 중성 대명사의 선행사인 복음 또는 복음의 비밀을 가리키되, 본문이 지닌 연결을 과도하게 해설하지 않습니다. ‘해 주시기를 빕니다’는 바로 앞 절의 ‘나를 위하여도’에서 이어지는 바울의 기도 요청을 한국어에서 완결되게 드러냅니다.
  reviewer_model: gpt-5.6-terra
