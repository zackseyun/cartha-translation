review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the distributive scope, the slave/free contrast, the Lord as the source, and the future recompense. However, "각 사람이 행한 선한 일은 무엇이든" does not naturally express the indefinite relative clause ὃ ἂν ποιήσῃ ἀγαθόν ("whatever good [thing] each does").
  naturalness: The sentence is comprehensible but syntactically strained. "무슨 선한 일을 하든지" is idiomatic modern Korean and directly conveys the indefinite sense. "그에 대해 ... 보답을 받게 될" naturally communicates the corresponding-result sense of κομίσεται without implying that the good deed itself is literally returned.
  terminology: '"노예," "자유인," and "주" are appropriate in this social and theological context. "보답" is suitable here for the recompense implicit in receiving back what corresponds to the good done.'
  issues:
  - severity: medium
    issue: The Korean construction "각 사람이 행한 선한 일은 무엇이든" is unnatural and weakens the force of the indefinite clause.
    rationale: The Greek describes any good act a person may do, rather than foregrounding a nominalized "good deed that each person has done." "각 사람이 무슨 선한 일을 하든지" preserves both the distributive "each" and the indefinite "whatever."
  - severity: low
    issue: '"그대로 돌려받다" can suggest receiving the identical deed back.'
    rationale: κομίσεται denotes receiving in return what corresponds to the good done. "그에 대해 ... 보답을 받다" is more idiomatic Korean while retaining that correspondence.
  revised_text: 노예이든 자유인이든, 각 사람이 무슨 선한 일을 하든지 그에 대해 주께로부터 보답을 받게 될 것을 아십시오.
