revisions:
- from: 노예든 자유인이든 각 사람이 행한 선한 일은 무엇이든 주께로부터 그대로 돌려받을 것을 아십시오.
  to: 노예이든 자유인이든, 각 사람이 무슨 선한 일을 하든지 그에 대해 주께로부터 보답을 받게 될 것을 아십시오.
  rationale: The revision replaces an awkward nominal construction with an idiomatic indefinite conditional expression, retains the Greek order's distributive scope and slave/free contrast, and renders the future reciprocal recompense naturally in formal-polite Korean.
