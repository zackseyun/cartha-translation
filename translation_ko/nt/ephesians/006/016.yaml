review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 문장 구조는 대체로 충실합니다. 다만 σβέσαι는 불을 ‘끄다/꺼뜨리다’이므로 ‘끌 수’는 오역에 가까우며, τοῦ πονηροῦ의 인격적·추상적 양의성을 각주로 보존하는 것이 적절합니다.
  naturalness: ‘불화살을 능히 끌 수 있을 것입니다’는 현대 표준어에서 부자연스럽고 의미도 맞지 않습니다. ‘모두 꺼뜨릴 수 있을 것입니다’가 자연스럽고 원문의 미래 가능 표현을 살립니다. ‘방패를 드십시오’는 군사 은유 안에서 ‘들어 올리십시오’보다 간결하고 자연스럽습니다.
  terminology: ‘믿음’, ‘방패’, ‘불화살’, ‘악한 자’는 적절합니다. θυρεός의 ‘큰 방패’라는 구체성은 가능하지만 본문에 보충하지 않아도 됩니다. τοῦ πονηροῦ는 문맥상 ‘악한 자’가 가장 유력하나 ‘악’이라는 추상적 이해도 문법상 가능하므로 각주로 남깁니다.
  issues:
  - severity: high
    issue: ‘끌 수’
    rationale: σβέσαι는 ‘끄다, 꺼뜨리다, 진화하다’라는 뜻입니다. ‘끌다’는 해당 동사의 의미를 전달하지 못합니다.
  - severity: low
    issue: τοῦ πονηροῦ의 대안 독해 미표시
    rationale: 본문의 ‘악한 자’는 전쟁 비유 문맥에서 타당하지만, 관사 있는 단수 형용사는 ‘악’으로도 읽힐 수 있습니다. 번역 선택이 신학적으로 과도하게 단정되지 않도록 각주로 보존하는 것이 좋습니다.
  revised_text: 모든 상황에서 믿음의 방패를 드십시오. 그 방패로 악한 자[1]의 모든 불화살을 모두 꺼뜨릴 수 있을 것입니다.
  revised_footnotes:
  - marker: '1'
    text: 또는 ‘악’. 그리스어 표현은 문맥상 인격적인 ‘악한 자’를 가리키는 것으로 가장 자연스럽지만, 추상적인 ‘악’으로도 읽을 수 있습니다.
    reason: alternative_reading
  revision_rationale: ‘끌 수’를 원문의 σβέσαι에 맞는 ‘꺼뜨릴 수’로 고쳐 의미와 현대성을 회복했습니다. 상대절의 수단을 ‘그 방패로’로 명시하여 ἐν ᾧ를 자연스럽게 반영했습니다. ‘악한 자’의 문맥상 적절한 주번역을 유지하되, 실제 문법적 대안을 각주로 보존했습니다. 영어 감사 자료의 각주 표지는 내용과 연결 위치가 서로 어긋나 있으므로, 한국어에서는 검증 가능한 위치에 필요한 대안 각주만 새로 배치했습니다.
