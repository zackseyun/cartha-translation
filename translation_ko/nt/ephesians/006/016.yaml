  text: In all circumstances, taking up the shield of faith, with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: ko
  text: 모든 상황에서 믿음의 방패를 드십시오. 그 방패로 악한 자[1]의 모든 불화살을 모두 꺼뜨릴 수 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
