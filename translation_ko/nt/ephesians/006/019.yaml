  terminology: μυστήριον τοῦ εὐαγγελίου는 ‘복음의 비밀’로 적절합니다. παρρησίᾳ는 ‘담대하게’로 자연스럽게 옮길 수 있습니다. λόγος는 이 문맥에서 ‘말씀’보다 ‘말’이 중립적이며 원문의 의미를 더 정확히 보존합니다.
