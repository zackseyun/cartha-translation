  naturalness: ‘평강이 형제들에게, 또 믿음과 함께한 사랑이’는 현대 한국어 문장 배열로 다소 어색합니다. ‘형제들에게 평안과 믿음과 함께하는 사랑이’가 합쇼체 축원문으로 자연스럽습니다. ‘메시아이신 주 예수’는 ‘주 예수 메시아’보다 한국어에서 제목 관계를 분명하고 자연스럽게 드러냅니다.
