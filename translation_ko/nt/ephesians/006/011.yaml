  source_fidelity: 본문의 ‘하나님의 전신갑주’와 ‘마귀의 간계’는 각각 πανοπλία와 μεθοδείας를 적절히 옮깁니다. 다만 ‘그리하면’은 πρὸς τὸ δύνασθαι의 목적을 결과·조건처럼 들리게 할 수 있으므로, ‘~할 수 있도록’으로 목적을 명시하는 편이 더 충실합니다. ‘맞서 서다’는 στῆναι πρὸς의 대항·버팀 의미를 자연스럽게 보존합니다.
  naturalness: ‘하나님의 전신갑주를 입으십시오’는 한국어 성경 문체와 현대 합쇼체에 자연스럽습니다. 목적절을 앞에 두어 ‘…맞서 설 수 있도록 …입으십시오’로 하면 명료하고 매끄럽습니다.
  terminology: ‘전신갑주’는 한국어 교회 전통에서 널리 정착한 표현으로 유지할 수 있습니다. 그러나 현 각주는 이 낱말이 ‘머리부터 발끝까지’를 뜻한다고 지나치게 구체화하며, ‘한국 교회 전통의 무게’라는 평가는 번역 주석으로 적절하지 않습니다. πλήρης 장비라는 어휘 범위를 반영한 중립적 대안을 제시합니다.
  issues:
