  source_fidelity: 초안의 ‘갖추어 입으십시오’는 ἀναλάβετε(‘취하다, 들어 올리다’)보다 ‘입다’의 뜻을 앞세웁니다. 또한 ‘설 수 있게 하십시오’는 독자가 스스로 가능하게 만들라는 명령처럼 들려, ἵνα δυνηθῆτε(‘…할 수 있도록’)의 목적절을 정확히 옮기지 못합니다. 개정문은 목적절과 ‘맞서다—서다’의 군사적 병행을 보존합니다.
  naturalness: ‘하나님의 전신갑주를 갖추십시오’와 ‘…하도록’은 현대 표준 한국어 합쇼체에서 자연스럽고 명료합니다. ‘악한 날’은 원문의 열려 있는 표현을 유지합니다.
  terminology: ‘전신갑주’는 πανοπλία의 완전한 무장 장비라는 뜻을 유지하는 통용 성서 용어입니다. ‘하나님의’는 τοῦ θεοῦ의 폭넓은 속격을 해석적으로 좁히지 않습니다. ‘맞서고’는 ἀντιστῆναι를 자연스럽게 옮기며, 마지막 ‘서다’와의 연결을 살립니다.
  issues:
