  - severity: high
    issue: ‘설 수 있게 하십시오’가 목적절의 주어와 양태를 바꿈
    rationale: ἵνα δυνηθῆτε는 ‘여러분이 할 수 있도록’이라는 목적을 나타냅니다. 현행 표현은 독자에게 그 가능성을 만들어 내라고 명하는 뜻으로 읽힐 수 있습니다.
