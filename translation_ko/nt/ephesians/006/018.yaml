  source_fidelity: 현 번역은 기도, 성령 안에서의 기도, 깨어 있음, 성도를 위한 간구라는 주요 요소를 담고 있습니다. 그러나 ‘끝까지 인내하며’는 ἐν πάσῃ προσκαρτερήσει(‘모든/온갖 끈기 가운데, 끈질기게’)를 시간적 종결점으로 좁히며, ‘깨어 간구하십시오’는 ἀγρυπνοῦντες와 δέησις의 병렬 관계를 다소 합쳐 버립니다. 또한 περὶ πάντων τῶν ἁγίων의 ‘모든 성도를 위하여’가 ‘간구’에 명확히 연결되도록 조정하는 것이 좋습니다.
  naturalness: 합쇼체 명령문으로 자연스럽게 다듬을 수 있습니다. ‘온갖 기도와 간구로’와 ‘온갖 끈기와 간구로’는 원문의 반복과 포괄성을 보존하면서도 현대 한국어에서 이해 가능합니다.
  terminology: ‘성령 안에서’는 문맥상 가장 개연적인 πνεύματι의 해석이며, 무관사형이므로 ‘영 안에서’라는 대안 가능성을 각주로 남깁니다. ‘성도’는 바울의 용례상 특정 후대의 제한된 범주가 아니라 모든 신자를 가리키므로 설명 각주를 둡니다. ‘간구’는 προσευχή와 δέησις의 구별을 유지하는 적절한 역어입니다.
