  source_fidelity: ‘끝으로’는 Τοῦ λοιποῦ의 결론적 전환을 잘 옮깁니다. 그러나 ‘그분의 힘 있는 위력 안에서’는 κράτος와 ἰσχύς의 관계를 한국어에서 다소 부자연스럽고 불분명하게 만들며, 끝의 대시는 절을 미완성처럼 보이게 합니다. ‘그분의 힘의 권능 안에서’는 두 힘 관련 명사를 유지하면서 원문의 강조적 중첩을 더 충실히 반영합니다.
  naturalness: ‘강건해지십시오’는 현대 표준어 합쇼체로 사용 가능하며, 수동적·수혜적 뉘앙스를 어느 정도 보존합니다. 접속사 앞뒤의 쉼표와 종결 대시를 제거하고 문장 끝을 마침표로 처리하는 것이 자연스럽습니다.
  terminology: κύριος는 ‘주’로, κράτος는 ‘권능’으로, ἰσχύς는 ‘힘’으로 옮겼습니다. ‘강건해지십시오’는 독자가 스스로 힘을 내라는 능동적 명령으로만 읽지 않도록 ‘강해지십시오’보다 적절합니다.
