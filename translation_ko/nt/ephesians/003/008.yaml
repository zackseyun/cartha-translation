  source_fidelity: 핵심 어휘는 대체로 충실합니다. ἐλαχιστοτέρῳ의 수사적 비교급은 ‘가장 작은 이보다도 더 작은’으로 잘 드러났고, ἔθνεσιν은 문맥상 ‘이방인들’, Χριστοῦ는 프로젝트 방침에 따라 ‘메시아’로 옮긴 것이 적절합니다. 다만 원문의 부정과거 수동사 ἐδόθη와 목적 부정사 εὐαγγελίσασθαι의 관계는 ‘은혜가 주어져 … 전하게 되었다/전하도록 되었다’라는 위임의 의미이며, 초안의 ‘전하게 하시고’는 원문에 없는 명시적 행위자를 보태고 뒤에 이어질 접속 구조처럼 만들어 정확하지 않습니다.
  naturalness: ‘모든 성도 가운데 지극히 작은 자보다도 더 작은 나’는 의미는 통하지만 현대 표준어에서는 ‘가장 작은 이보다도 더 작은 나’가 더 자연스럽습니다. 또한 ‘풍성함’은 단수 명사 ‘πλοῦτος’의 비유적 의미를 살릴 수 있으나, ‘측량할 수 없는 풍성함’보다 ‘헤아릴 수 없는 풍성한 은혜/풍성함’이 자연스러울 수 있습니다. 여기서는 원어의 은유를 보존하여 ‘헤아릴 수 없는 풍성함’을 사용했습니다.
  terminology: ‘성도’, ‘은혜’, ‘이방인들’, ‘메시아’는 본문 및 프로젝트의 용어 선택과 부합합니다. εὐαγγελίσασθαι는 단순 전달이 아니라 복된 소식을 선포하는 행위이므로 ‘복음으로 전하도록’으로 그 성격을 드러냈습니다. 각주 a는 어원 설명으로는 가능하지만 본문의 번역 선택을 직접 뒷받침하도록 다듬는 편이 낫습니다.
