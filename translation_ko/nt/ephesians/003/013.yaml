  naturalness: ‘환난들’은 현대 표준 한국어에서는 다소 어색합니다. ‘나의 고난’으로 집합적·개념적으로 표현하고, ‘낙심하지 마시기를 부탁드립니다’로 옮기면 합쇼체의 정중한 권면이 자연스럽습니다.
