  terminology: Use '목적' for πρόθεσις, '메시아' for Χριστός as a title, and '주' for κύριος. '영원한 목적' is conventional, formal, and clear; a note preserves the literal 'purpose of the ages' wording without forcing an unnatural Korean construction into the verse.
