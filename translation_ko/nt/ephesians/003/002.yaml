  source_fidelity: 개정안은 εἴ γε의 조건적·수사적 전제를 「…들으셨다면」으로 보존합니다. 또한 τῆς δοθείσης가 여성 단수로 χάριτος를 수식한다는 점을 반영하여, 하나님께서 바울에게 주신 은혜와 그 은혜를 맡은 직무를 구분해 표현했습니다. εἰς ὑμᾶς의 독자들을 향한 목적·방향은 「여러분을 위하여」로 옮겼습니다.
  naturalness: 초안의 「들었을 줄 압니다」는 자연스럽기는 하나 원문의 조건문을 바울의 직접적 확신 진술로 바꿉니다. 개정안은 합쇼체를 유지하면서도 다음 절로 이어지는 미완결 조건절에 맞게 자연스럽습니다.
  terminology: 이 문맥의 οἰκονομία는 하나님의 구원 계획 일반보다는 바울에게 맡겨진 관리·봉사의 책임을 가리키므로 「청지기 직분」을 채택했습니다. 「경륜」은 가능한 어휘적 대안이지만 여기서는 맡겨진 직무라는 문맥적 초점이 약해질 수 있으므로 각주에 제시했습니다. 「은혜」는 바울 서신의 χάρις에 대한 표준적이고 적절한 번역입니다.
  issues:
  - severity: high
    issue: εἴ γε의 조건 형식이 「…들었을 줄 압니다」로 바뀌어 있음
    rationale: 원문은 참일 것으로 기대하는 조건·가정(‘만일/참으로 … 들으셨다면’)을 사용합니다. 바울이 ‘안다’고 단언하는 문장으로 옮기면 문법적 형태와 담화상의 연결이 달라집니다.
  - severity: medium
    issue: 「하나님 은혜의 경륜」은 이 문맥에서 οἰκονομία의 맡겨진 직무 의미를 충분히 드러내지 못함
    rationale: 3:2의 οἰκονομία는 바울에게 위탁된 은혜의 관리·봉사 직무를 가리키는 것이 문맥상 가장 자연스럽습니다. 또한 「하나님 은혜」보다 「하나님의 은혜」가 현대 표준 한국어 문장에서는 더 자연스럽습니다.
  - severity: medium
