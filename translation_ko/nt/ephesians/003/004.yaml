  source_fidelity: 초안의 ‘읽으면’은 ἀναγινώσκοντες의 수단/상황적 의미를 적절히 반영합니다. 그러나 ‘깨달을 수 있을 것입니다’는 현재형 δύνασθε를 미래적·완곡하게 바꾸므로 현재의 가능성을 나타내는 ‘깨달을 수 있습니다’가 더 충실합니다. 또한 σύνεσις를 ‘통찰’로 옮긴 뒤 이를 다시 ‘깨닫다’의 목적어로 삼으면 한국어에서 다소 부자연스럽습니다.
  naturalness: ‘여러분은 이것을 읽으면 내가 메시아의 비밀을 이해하는 바를 깨달을 수 있습니다’는 현대 표준어 합쇼체로 자연스럽고, 독자가 바울의 이해를 파악하게 된다는 문맥을 명료하게 전달합니다. 문장 끝의 대시는 삭제해야 합니다.
  terminology: Χριστοῦ는 프로젝트의 제목어 원칙과 영어 POB의 선택에 따라 ‘메시아’로 유지합니다. 영어 감사 이력의 대안 표기를 반영하여 ‘그리스도’ 가능성을 각주로 보존합니다. ‘이해하는 바’는 σύνεσις의 지적 이해를 자연스럽게 표현하며, ‘비밀’은 μυστήριον의 문맥상 의미를 유지합니다.
