  terminology: ἐκκλησία는 「교회」, ἀρχαί/ἐξουσίαι는 본문에서 해석을 과도하게 고정하지 않는 「통치자들과 권세자들」로 유지합니다. πολυποίκιλος는 「다채로운」으로 옮기고, 각주에서 풍성한 다양성의 뉘앙스를 설명합니다.
