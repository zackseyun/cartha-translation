  terminology: ‘통치자들과 권세자들’, ‘교회’, ‘하나님’은 적절합니다. ‘각양각색의 지혜’는 πολυποίκιλος의 다면적·풍성한 뉘앙스를 보존하며, 특정 교리 해석을 본문에 추가하지 않습니다.
