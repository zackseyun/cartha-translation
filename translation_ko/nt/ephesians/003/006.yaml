  rationale: '문장의 병렬 구조와 현대 한국어의 자연스러움을 위해 συγκληρονόμα를 ‘공동 상속자들’로 고쳤고, 복수 주어에 맞추어 서술 명사를 복수화했습니다. ‘메시아 예수 안에 있는 약속’은 원문의 ἐν Χριστῷ Ἰησοῦ가 약속과 연결되는 독해를 한국어에서 명료하게 표현합니다. 세 술어의 순서는 원문의 순서에 맞추어 공동 상속자, 한 몸의 지체, 약속의 공동 참여로 배열하는 편이 더 충실하지만, 위 문장은 참여 항목을 앞에 배치해 원문 순서를 바꾸므로 수정 필요. 최종 권고문은 다음과 같습니다: ‘곧 이방인들이 복음을 통하여 공동 상속자들이고, 한 몸의 지체들이며, 메시아 예수 안에 있는 약속에 함께 참여하는 자들이 된다는 것입니다.’'
