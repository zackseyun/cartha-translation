  source_fidelity: ‘이제’는 δέ를 시간 부사로 좁혀 옮겨 본문에 없는 시간적 뉘앙스를 더합니다. 또한 ‘역사하시는 능력’은 능력 자체를 높임의 대상으로 삼는 듯하여 자연스럽지 않습니다. 나머지 핵심 의미, 곧 구하거나 생각하는 것을 크게 넘어 행하실 수 있음과 우리 안에서 작용하는 능력의 기준은 대체로 잘 반영되었습니다.
