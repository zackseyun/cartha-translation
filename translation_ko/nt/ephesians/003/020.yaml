  terminology: ‘능력’, ‘구하다’, ‘생각하다’, ‘역사하다’는 교회 문맥에서도 널리 이해되는 표현이며 특정 교리 해석을 덧붙이지 않습니다. ‘훨씬 더 넘치게’는 ὑπερεκπερισσοῦ의 강한 강조를 적절히 살립니다.
  issues:
