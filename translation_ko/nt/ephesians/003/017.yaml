  source_fidelity: 현 초안은 κατοικῆσαι의 선행 기도문 의존성을 ‘거하시게 하시고’로 어느 정도 반영하지만, ἐρριζωμένοι καὶ τεθεμελιωμένοι(완료 수동 분사)를 ‘뿌리를 박고 터를 잡아’라는 능동 표현으로 옮겨 수동성과 완료의 결과 상태를 잃었습니다. 또한 ‘마음 안에’보다 ‘마음에’가 자연스럽고 충실합니다.
  naturalness: ‘사랑 안에 뿌리를 내리고 기초가 놓인 여러분이’는 식물과 건축의 짝 비유, 수동적 결과 상태를 자연스러운 표준 한국어로 보존하며, 다음 절로 이어지는 원문의 미완결 분사구문도 반영합니다.
