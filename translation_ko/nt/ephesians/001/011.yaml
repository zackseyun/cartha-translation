  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance, having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: ko
  text: 그분 안에서 우리도 하나님의 기업이 되었으며[a], 모든 일을 자신의 뜻의 계획에 따라 이루시는 분의 목적을 따라 미리 정하심을 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「우리도 기업을 얻었습니다」. 그리스어 동사는 우리가 하나님의 분깃 또는 소유가 되었다는 뜻으로도, 우리가 기업을 받았다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκληρώθημεν
  english_pob_choice: were made an inheritance
  chosen_korean: 기업이 되었으니
  alternatives_korean:
  - 기업을 얻었으니
  - 분깃을 받았으니
  lexicon: BDAG
  rationale: 수동태로 「하나님의 분깃이 됨」을 우선 표현. 「기업을 얻음」도 의미적으로 가능하나 본문의 수동성을 보존하기 위해 「기업이 되었으니」를 택한다.
- source_word: πρόθεσιν
  english_pob_choice: purpose
  chosen_korean: 작정
  alternatives_korean:
  - 계획
  - 의도
  lexicon: BDAG
  rationale: 「작정」이 영구적 결정을 함의한다.
- source_word: βουλὴν τοῦ θελήματος
  english_pob_choice: counsel of his will
  chosen_korean: 뜻의 결의
  alternatives_korean:
  - 뜻의 계획
  - 의지의 의논
  lexicon: BDAG
  rationale: βουλή는 「숙고·결의」를 가리키므로 「결의」로 옮긴다.
