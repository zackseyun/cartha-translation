    text: 또는 「우리도 기업을 얻었습니다」. 그리스어 동사는 우리가 하나님의 분깃 또는 소유가 되었다는 뜻으로도, 우리가 기업을 받았다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
