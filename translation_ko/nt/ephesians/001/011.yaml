review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the debated passive sense of ἐκληρώθημεν and retains the alternative in a footnote. However, it recasts the participial clause too freely as a causal/result explanation ("이는 … 결과이며"), and its final dash leaves the verse syntactically unfinished. The revision preserves the relation of the participle προορισθέντες ('having been predestined') and renders the two distinct terms πρόθεσις and βουλή without conflation.
  naturalness: '"기업이 되었으니" is understandable but somewhat compressed and archaic in this context, while "뜻의 결의" and "작정" together sound stiff and unnecessarily doctrinally loaded. A complete two-clause formal-polite sentence is more natural in modern standard Korean.'
  terminology: '"기업" is retained for the inheritance/allotted-possession sense, with "하나님의 기업" making the intended passive reading intelligible in Korean. "목적" renders πρόθεσις, and "뜻의 계획" represents βουλὴ τοῦ θελήματος without treating the two expressions as identical. "미리 정하심을 받았습니다" accurately retains the passive force of προορισθέντες.'
  issues:
  - severity: high
    issue: The translation ends with an em dash and lacks a completed Korean sentence.
    rationale: The source verse is syntactically complete; the Korean translation must likewise be complete and structurally usable.
  - severity: medium
    issue: '"이는 … 미리 정하심을 받은 결과이며" changes the participial relationship and introduces a result formulation not explicit in the Greek.'
    rationale: προορισθέντες is an aorist passive participle modifying "we"; rendering it as a coordinated clause better preserves its force without adding a causal explanation.
  - severity: medium
    issue: '"작정" and "뜻의 결의" are stiff and blur the distinction between πρόθεσις and βουλή.'
    rationale: The Greek uses purpose (πρόθεσις) and counsel/plan (βουλή) as related but distinct expressions. "목적" and "뜻의 계획" are clear modern Korean equivalents.
  - severity: low
    issue: The footnote's wording about "제비뽑아" is overly compressed and may suggest that literal lot-casting is the contextual sense.
    rationale: The relevant ambiguity is whether believers became God's allotted possession or received an inheritance; the note should state that contrast directly.
  revised_text: 그분 안에서 우리도 하나님의 기업이 되었으며[a], 모든 일을 자신의 뜻의 계획에 따라 이루시는 분의 목적을 따라 미리 정하심을 받았습니다.
