  source_fidelity: 수정이 필요합니다. ἔχομεν은 현재 직설법으로 현재의 소유·현실을 나타내는데, 초안의 「얻었으니」는 완료된 과거 사건으로 바꿉니다. 또한 κατὰ τὸ πλοῦτος τῆς χάριτος αὐτοῦ는 구속/용서가 그 은혜의 풍성함에 상응한다는 기준·척도를 나타내며, 「이는 … 것이며—」보다 직접적으로 옮기는 편이 충실합니다.
  naturalness: 「그분 안에서」, 「그분의 피를 통하여」, 「…을 누리고 있습니다」는 현대 표준어 합쇼체에서 자연스럽습니다. 「은혜의 풍성함에 따라」는 원문의 κατά를 무리 없이 드러냅니다.
  terminology: 「구속」은 ἀπολύτρωσις의 정착된 신학 용어로 적절합니다. 「범죄」는 가능하나, παράπτωμα를 일반 죄보다 반드시 ‘구체적 범행’으로 한정할 수는 없습니다. 각주에서 그와 같은 과도한 의미 한정 및 값을 치른다는 설명을 제거하고, 번역 대안을 제시해야 합니다.
