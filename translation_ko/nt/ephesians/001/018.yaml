  source_fidelity: 핵심 비유인 ‘마음의 눈’과 목적 표현은 대체로 보존되었습니다. 그러나 ‘부르심에 속한 소망’은 κλήσεως αὐτοῦ의 자연스러운 한국어 표현이 아니며, ‘그분 기업’에는 소유격 표지가 빠져 있습니다. ἐν τοῖς ἁγίοις는 본문에서 ‘성도들 가운데’로 옮기고 대안을 각주로 남기는 것이 적절합니다.
  naturalness: ‘성도들 안에 있는 그분 기업의 영광의 풍성함’은 소유 관계가 불분명하고 명사 연쇄가 다소 거칩니다. ‘성도들 가운데 있는 그분의 유산의 영광의 풍성함’이 현대의 격식 있는 성서 한국어로 더 명료합니다.
  terminology: ‘성도’, ‘부르심’, ‘영광’은 적절합니다. κληρονομία는 현대어의 ‘유산’으로 옮기되, 본문과 각주 모두 그분의 유산이라는 열어 둔 소유격을 유지합니다. ‘풍성함’은 πλοῦτος의 적절한 표현입니다.
  issues:
  - severity: medium
    issue: ‘그분의 부르심에 속한 소망’
    rationale: 그리스어 τῆς κλήσεως αὐτοῦ는 ‘그분의 부르심의 소망’ 또는 ‘그분의 부르심에 따른 소망’으로 표현하는 편이 자연스럽습니다. ‘속한’은 한국어에서 수식 관계를 부자연스럽게 만듭니다.
  - severity: medium
    issue: ‘그분 기업’의 소유격 누락
    rationale: κληρονομίας αὐτοῦ에는 ‘그분의’가 명시되어야 합니다.
