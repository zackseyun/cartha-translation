  source_fidelity: 개정이 필요합니다. 「영광스러운 은혜」는 δόξης τῆς χάριτος(‘그분의 은혜의 영광’)의 속격 관계를 형용사 표현으로 바꾸어 ‘은혜의 영광’을 ‘영광스러운 은혜’로 전환합니다. 또한 「사랑하시는 자」는 완료 수동분사 ἠγαπημένῳ의 수동 의미를 반영하지 못합니다.
  naturalness: 현 번역의 「…하려 하심이며」는 독립 절로는 부자연스럽습니다. 「…하시려는 것입니다」로 옮기면 현대 표준 한국어의 합쇼체로 자연스럽고, εἰς의 목적 용법도 분명해집니다.
  terminology: χάρις는 「은혜」로 유지하고, ἐχαρίτωσεν은 「은혜를 베푸셨습니다」로 옮겨 동족어 관계를 한국어에서 가능한 범위 안에서 드러냈습니다. τῷ ἠγαπημένῳ는 칭호적 용법과 수동 의미를 살려 「사랑받으시는 분」으로 번역했습니다.
