  terminology: ‘은혜’, ‘평강’, ‘주’, ‘메시아’는 원문의 의미와 프로젝트의 Χριστός 번역 방침을 적절히 보존합니다. 각주에는 ‘그리스도’가 이름처럼 쓰이는 대안임을 설명하여 독자의 이해를 도울 필요가 있습니다.
