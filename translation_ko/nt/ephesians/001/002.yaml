  source_fidelity: 원문의 축복 인사 구조와 ‘하나님 우리 아버지’ 및 ‘주 예수 메시아’라는 두 근원을 충실히 반영합니다. 다만 한국어에서 ‘우리 아버지 하나님’은 다소 압축되어 있어, ‘우리 아버지이신 하나님’으로 풀어 쓰면 θεοῦ πατρὸς ἡμῶν의 동격 관계가 더 분명해집니다.
