  source_fidelity: 개정이 필요합니다. ἐνήργηκεν은 여기서 하나님께서 능력을 메시아 안에서 실제로 작용시키거나 발휘하셨다는 뜻인데, 「베푸셨으니」는 능력을 선물처럼 주셨다는 의미로 기울 수 있습니다. 또한 원문에 없는 「이미」를 삭제해야 합니다. 두 분사는 하나님께서 그 능력을 발휘하신 방식/행동을 나타내므로, 문장을 완결하고 그 연관을 드러내는 표현이 적절합니다.
  naturalness: 초안의 「앉히시며—」는 문장이 미완결된 채 대시로 끝나므로, 독립된 절로 제시되는 본문으로는 자연스럽지 않습니다. 「하늘에 속한 곳에서」도 이해되지만 한국어에서는 「하늘에 있는 영역에서」가 더 자연스럽고, 이 정형 표현의 영역적 뜻을 잘 전달합니다.
  terminology: 「메시아」는 Χριστός의 칭호적 용법을 적절히 반영합니다. 「오른편」은 관용적 지위 표현으로 유지하되, 「하나님 자신의 오른편」으로 주체를 분명히 했습니다. 「죽은 자들 가운데서」는 ἐκ νεκρῶν의 표준적이고 자연스러운 번역입니다.
