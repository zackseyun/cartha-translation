  source_fidelity: 본문의 핵심 의미는 대체로 정확합니다. 다만 「복종케」는 현대 표준 한국어에서는 다소 문어적·고어적으로 들리므로 「복종하게」가 더 자연스럽습니다. 「그분을 만물 위에 머리로 교회에 주셨습니다」는 αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ의 수여, 만물 위의 머리 되심, 교회와의 특별한 관계를 모두 보존합니다.
