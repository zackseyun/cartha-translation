  lexicon: BDAG
  rationale: 한국 교회 전통의 「창세 전에」가 간결하면서도 정확하다.
- source_word: ἀμώμους
  english_pob_choice: blameless
  chosen_korean: 흠 없는
  alternatives_korean:
  - 책망할 것 없는
  lexicon: BDAG
