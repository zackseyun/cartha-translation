  text: 이는 그분께서 창세 전에 그분 안에서 우리를 택하셔서, 우리가 그분 앞에서 거룩하고 흠 없는 사람이 되게 하시려는 것이며, 사랑 안에서[b]—
  philosophy: optimal-equivalence
  footnotes:
