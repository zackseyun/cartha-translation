    rationale: 문맥상 그러한 이해가 가능하더라도, 이 절의 헬라어는 대명사를 사용합니다. 어휘 주석으로서 본문에 없는 식별을 확정하는 것은 불필요하며, 대명사의 개방성을 좁힙니다.
  - severity: low
    issue: ἐν ἀγάπῃ의 절 경계상 모호성이 충분히 보존되지 않음
    rationale: 원문은 이 구가 앞 절을 수식하는지 다음 절과 연결되는지 논쟁의 여지가 있습니다. 본문과 주석은 어느 한쪽을 확정하지 않고 그 가능성을 밝혀야 합니다.
