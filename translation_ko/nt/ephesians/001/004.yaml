    issue: ἐξελέξατο를 「세우셨으니」로 번역함
    rationale: ἐξελέξατο는 ‘선택하다/택하다’이며, ‘세우다’는 원문에 없는 다른 행위를 나타냅니다. 본문의 선택 언어와 신학적 표현을 바꾸므로 수정이 필요합니다.
  - severity: medium
