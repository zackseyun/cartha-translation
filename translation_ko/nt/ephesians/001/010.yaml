  source_fidelity: 개정이 필요합니다. 초안의 「그분의」는 본절 그리스어에 없는 소유 표현이며, 「때가 차매」는 τοῦ πληρώματος τῶν καιρῶν의 명사구와 οἰκονομίαν의 관계를 지나치게 시간절로 바꿉니다. 또한 「메시아 안에서 머리 되시는 분 안에서」는 ἐν τῷ Χριστῷ를 중복하여 옮기며, 「통일되게」는 ἀνακεφαλαιώσασθαι에 담긴 ‘한 머리 아래 모음’의 비유를 불필요하게 해설적으로 확정합니다.
  naturalness: 「때들이 충만해질 때를 위한 경륜」은 현대 표준어에서 다소 무거운 신학적 명사구이나 원문의 압축된 문장 구조를 충실히 반영하며, 뒤의 동작을 명료하게 연결합니다. 「만물, 곧 하늘에 있는 것들과 땅에 있는 것들을」은 자연스럽게 포괄 범위와 대조를 드러냅니다. 마지막 「곧 그분 안에서,」는 원문의 반복 및 다음 절로 이어지는 미완결 구문을 보존합니다.
  terminology: οἰκονομία는 「경륜」으로 유지하되, 각주에서 「관리·경영·계획」의 의미 범위를 제시합니다. Χριστός는 제목적 용법을 따라 「메시아」로 옮깁니다. ἀνακεφαλαιώσασθαι는 본문에서 「한 머리 아래 모으다」로 번역하고, ‘총괄하다/요약하다’ 및 ‘한데 모으다’라는 대안을 각주에 남겨 의미의 긴장을 보존합니다.
