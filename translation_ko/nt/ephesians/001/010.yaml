  - severity: high
    issue: 「때가 차매」가 명사구 및 경륜의 의미를 축소함
    rationale: τοῦ πληρώματος τῶν καιρῶν은 ‘때들이 충만해짐’을, οἰκονομία는 그때를 위한/그때에 관련된 경륜·관리 체계를 나타냅니다. 단순 시간절로 처리하면 οἰκονομία의 핵심이 약화됩니다.
  - severity: high
    issue: 「메시아 안에서 머리 되시는 분 안에서」의 중복 및 과잉 해설
    rationale: ἐν τῷ Χριστῷ는 한 번만 나오며, κεφαλή는 동사의 합성 요소로 암시될 뿐 ‘머리 되시는 분’이라는 별도 전치사구가 아닙니다.
