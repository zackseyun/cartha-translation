translation:
  language: ko
  text: 때들이 충만해질 때를 위한 경륜[a]으로서, 메시아 안에서 만물, 곧 하늘에 있는 것들과 땅에 있는 것들을 한 머리 아래 모으려 하신 것입니다[b]—곧 그분 안에서,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「경륜」(οἰκονομία)은 관리·경영·계획 또는 질서 있는 운영을 뜻할 수 있다.
    reason: lexical_alternative
  - marker: b
    text: 「한 머리 아래 모으다」(ἀνακεφαλαιώσασθαι)는 「총괄하다」 또는 「요약하다」로도 옮길 수 있으며, 모든 것을 한데 모은다는 뉘앙스를 포함할 수 있다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν
  english_pob_choice: the administration of the fullness of the times
  chosen_korean: 때가 차매 그분의 경륜
  alternatives_korean:
