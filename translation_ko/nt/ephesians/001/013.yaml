    reason: lexical_alternative
  revision_rationale: 문장을 현대 표준어 합쇼체로 완결하고, ‘인침’이라는 자연스럽고 정착된 수동적 봉인 용어를 사용했습니다. 원문의 두 ‘그분 안에서’를 유지했으며, δεύτε 번째 καί는 한국어에서 자연스러운 접속사 ‘그리고’로 반영했습니다. ‘약속의 거룩한 성령’은 원문의 속격과 형용사를 모두 보존하고, 더 관용적인 해석은 각주에 남겼습니다.
