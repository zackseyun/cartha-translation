review_pass:
  verdict: revise
  source_fidelity: 수동태 ἐσφραγίσθητε는 ‘인침을 받았습니다’로 자연스럽게 보존해야 합니다. 또한 τῷ ἁγίῳ를 본문에서 반영하여 ‘거룩한 성령’으로 옮기는 것이 안전합니다. 두 ἐν ᾧ는 모두 그리스도와의 연합이라는 문맥을 따라 ‘그분 안에서’로 유지했습니다.
  naturalness: ‘인 치심을 받았으니—’는 현대 표준 한국어에서 부자연스럽고, 합쇼체 문장 종결도 아닙니다. ‘인침을 받았습니다’가 성경 번역어로 정착되어 있으면서도 현대 독자에게 자연스럽습니다. 두 분사는 한국어의 자연스러운 연결을 위해 ‘듣고, 그리고 … 믿은 뒤에’로 처리했습니다.
  terminology: ‘진리의 말씀’, ‘복음’, ‘성령’, ‘인침’은 널리 이해되는 성경 용어입니다. τῆς ἐπαγγελίας의 압축된 속격을 보존하여 ‘약속의 거룩한 성령’으로 번역했으며, ‘약속하신 성령’은 각주 대안으로 제시합니다.
  issues:
  - severity: medium
    issue: ‘인 치심’이라는 표기와 ‘받았으니—’ 종결
    rationale: ‘인 치심’은 현대 한국어의 일반적 성경 용어가 아니며 띄어쓰기와 명사화가 어색합니다. ‘-았으니—’는 종속 종결로 남아 있어 단독 절인 본문의 합쇼체 문장으로 완결되지 않습니다.
  - severity: medium
    issue: τῷ ἁγίῳ(‘거룩한’)의 명시적 반영 누락
    rationale: ‘성령’이 관습상 Holy Spirit을 가리킬 수는 있으나, 원문의 형용사를 번역문에서 보존하는 편이 원문 충실성에 더 적합합니다.
  - severity: low
    issue: 각주가 본문 대안보다 해설적이고 의미를 과도하게 특정함
    rationale: ‘소유권·보호·확정’은 봉인의 가능한 함의를 설명하지만 이 절의 어휘 대안 자체는 아닙니다. 간결한 번역 대안을 제시하는 편이 각주 목적에 맞습니다.
  revised_text: 그분 안에서 여러분도 진리의 말씀, 곧 여러분의 구원의 복음을 듣고, 그리고 그분 안에서 믿은 뒤에 약속의 거룩한 성령으로 인침을 받았습니다.
  revised_footnotes:
