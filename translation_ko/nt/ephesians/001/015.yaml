  source_fidelity: 원문의 접속적 도입(Διὰ τοῦτο κἀγώ), 바울 자신을 더하는 강조, 과거분사 ἀκούσας의 미완결 문장 구조를 충실히 반영합니다. ‘주 예수 안에 있는 여러분의 믿음’은 ἐν τῷ κυρίῳ Ἰησοῦ를 유지하며, ‘모든 성도를 향한 사랑’도 εἰς πάντας τοὺς ἁγίους의 대상 지향성을 잘 드러냅니다.
