  source_fidelity: 원문의 οὐ παύομαι εὐχαριστῶν은 ‘감사하기를 그치지 않는다’는 지속적 부정을 잘 반영해야 하며, ὑπὲρ ὑμῶν은 ‘여러분을 위하여’가 적절합니다. 그러나 μνείαν ποιούμενος는 직역적으로 ‘언급을 하면서/언급하며’라는 관용 표현입니다. 초안의 ‘기억합니다’도 가능한 해석적 표현이지만, 본문의 최적 등가 원칙과 영어 POB 본문의 선택(‘making mention’)에 비추어 본문에서는 ‘언급합니다’가 더 충실합니다.
