  source_fidelity: 핵심 열거와 시대 대조는 대체로 충실합니다. 다만 ὑπεράνω가 통치·권세 등의 열거와 ‘불리는 모든 이름’ 모두를 포괄한다는 관계가 한국어 문장에서 더 분명해야 합니다. 또한 본문의 ὀνομαζομένου는 ‘일컫는’보다 수동 의미가 드러나는 ‘불리는’이 적절합니다.
  naturalness: 초안의 ‘오는 시대에 일컫는 모든 이름 위에 훨씬 뛰어나게 하셨으며—’는 수식 범위가 다소 불분명하고, ‘하시며—’로 끝나 문장 자체가 미완성으로 남습니다. 현대 표준어 합쇼체에서는 완결된 문장으로 다듬는 것이 자연스럽습니다.
  terminology: ‘통치와 권세와 능력과 주권’은 ἀρχή, ἐξουσία, δύναμις, κυριότης의 추상적 권위 범주를 현대어로 구별하여 옮긴 안전한 선택입니다. 인간적·우주적·영적 존재 가운데 어느 하나로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: ὀνομαζομένου의 태와 수식 범위
    rationale: ‘일컫는 모든 이름’은 능동적으로 읽히거나 다소 어색할 수 있습니다. ‘이 시대뿐 아니라 오는 시대에도 불리는 모든 이름’으로 옮기면 수동 분사와 시간 수식의 범위가 자연스럽게 드러납니다.
  - severity: medium
    issue: 문장 종결 및 ὑπεράνω의 포괄 범위
    rationale: ‘하시며—’는 단독 절로 미완성입니다. ‘그를 … 모든 이름보다도 훨씬 위에 계시게 하셨습니다’라고 하면 앞 문맥의 목적어를 최소한으로 보충하면서 모든 열거 항목에 대한 우월성을 명확히 합니다.
