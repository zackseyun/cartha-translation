    rationale: εἰς ἔπαινον τῆς δόξης αὐτοῦ는 문자상 「그분의 영광의 찬양을 위하여」라는 목적 표현입니다. 「하십니다」와 암시된 인간 주체는 원문에 없습니다.
  revised_text: 그분은 우리 기업의 보증이시며, 그 소유의 구속을 위한 분이시고, 그분의 영광을 찬양하기 위한 분이십니다.
