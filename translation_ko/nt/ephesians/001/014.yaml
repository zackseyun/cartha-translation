review_pass:
  verdict: revise
  source_fidelity: ἀρραβών은 약속된 유업의 현재적 보증/선급을 뜻하므로 「보증」은 가능하나, 본문의 두 εἰς 구문(「소유의 구속을 향하여/위하여」, 「그분의 영광의 찬양을 위하여」)을 각각 보존해야 합니다. 「하나님의 소유 된 백성」은 τῆς περιποιήσεως에 없는 「하나님」과 「백성」을 특정하여 해석을 앞섭니다.
  naturalness: 초안의 「그분의 영광을 찬송하게 하십니다」는 자연스럽지만, 원문의 명사적 목적 구문을 인과적 서술로 바꾸고 앞선 목적 구문과의 병렬을 약화합니다. 「찬양을 위하여」가 현대 표준어 합쇼체 문맥에서 자연스럽고 구조를 잘 드러냅니다.
  terminology: 「유업」은 κληρονομία에 적절합니다. 「보증」은 주석으로 상거래적 선급/담보의 뉘앙스를 보완할 수 있습니다. περιποίησις는 이 구절에서 지시 대상이 논의될 수 있으므로 「소유」로 유지하여 모호성을 보존합니다.
  issues:
  - severity: medium
    issue: τῆς περιποιήσεως를 「하나님의 소유 된 백성」으로 확대함
    rationale: 그리스어는 「소유/소유물」이라고만 하며, 하나님과 백성을 명시하지 않습니다. 가능한 해석을 본문에 확정하지 않아야 합니다.
  - severity: medium
    issue: 두 번째 εἰς ἔπαινον τῆς δόξης αὐτοῦ의 목적 구조가 「찬송하게 하십니다」로 전환됨
    rationale: 원문은 「그분의 영광의 찬양을 위하여」라는 명사구이며, 첫 εἰς 구문과 병렬됩니다. 번역도 목적 표현을 유지하는 편이 충실합니다.
  revised_text: 그분은 우리 유업의 보증이시며, 그 소유의 구속을 향하여, 그분의 영광을 찬양하기 위함입니다.
  revised_footnotes:
  - marker: a
    text: ἀρραβών은 계약의 이행을 확정하는 선급금 또는 담보를 가리키는 상거래 용어입니다. 여기서는 장차 받을 유업을 확증하는 현재의 「보증」이라는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: 본문의 「소유」는 해석적으로 한정하지 않고 유지했으며, 두 εἰς 목적 구문을 각각 「…을 향하여」와 「…하기 위함입니다」로 드러냈습니다. 「보증」의 상거래적 뉘앙스는 각주에서 보완했습니다.
