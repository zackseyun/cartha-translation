  source_fidelity: 초안은 ἀρραβών을 「보증」으로 옮긴 것은 가능하지만, τῆς περιποιήσεως를 「하나님의 소유 된 백성」으로 특정하여 원문의 의도적인 모호성을 해소하고 「하나님의」 및 「백성」을 보태었습니다. 또한 두 번째 εἰς ἔπαινον을 「그분의 영광을 찬송하게 하십니다」로 풀어, 원문에 없는 사역 주체와 목적어를 추가합니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체를 유지하면서, 병렬된 두 εἰς 목적구를 병렬적으로 드러냅니다. 「그 소유」는 다소 문어적이나 원문의 지시와 범위가 확정되지 않은 표현을 보존하는 데 적절합니다.
  terminology: 「기업」, 「보증」, 「구속」, 「영광」, 「찬양」은 문맥상 안정적인 성경 용어입니다. ἀρραβών의 상거래적 뉘앙스는 각주에서 설명할 수 있으나, 「계약금」으로 단정하지 않고 본문의 「보증」을 유지합니다.
