  - 한없이 크신
  lexicon: BDAG
  rationale: ὑπερβάλλω의 「넘어섬」의 무게를 살려 「측량할 수 없이 크신」으로 옮긴다.
- source_word: ἐνέργειαν τοῦ κράτους τῆς ἰσχύος
  english_pob_choice: working of the might of his strength
  chosen_korean: 힘의 위력으로 이루어지는 능력의 역사
  alternatives_korean:
  - 그분의 힘 있는 권능의 활동
  lexicon: BDAG
  rationale: 세 능력 어휘(ἐνέργεια/κράτος/ἰσχύς)의 누적을 한국어로 풀되 직역 무거움을 피한다.
