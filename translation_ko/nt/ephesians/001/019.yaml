  text: 또한 믿는 우리를 향한 그분의 능력이 얼마나 뛰어나게 큰지, 그리고 그것이 그분의 강한 힘의 능력 있는 작용에 따른 것인지를 알게 되기를 구합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “믿는 우리 안에서.” 그리스어는 직역하면 “우리를 향하여”라고 말합니다. 일부 번역은 하나님의 능력이 믿는 사람들 안에서 일한다는 뜻을 더 분명히 드러내어 옮깁니다.
    reason: εἰς ἡμᾶς의 방향성을 본문에서 보존하면서, 문맥상 가능한 ‘우리 안에서’라는 해석적 번역을 제시합니다.
lexical_decisions:
- source_word: ὑπερβάλλον μέγεθος
  english_pob_choice: surpassing greatness
  chosen_korean: 측량할 수 없이 크신
  alternatives_korean:
