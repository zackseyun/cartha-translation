  text: having made known to us the mystery of his will, according to his good pleasure, which he purposed in himself
translation:
  language: ko
  text: 그분 뜻의 비밀[a]을 우리에게 알리셨으니, 이는 그분이 그분 안에서[b] 작정하신 그분의 기쁘신 뜻에 따른 것이며—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: μυστήριον은 본 번역의 정형 어휘로 「비밀」, 곧 이전에는 감추어져 있었으나 이제 계시된 하나님의 경륜을 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: ἐν αὐτῷ는 직역하면 「그분 안에서」이다. 이를 하나님을 가리켜 「자기 안에서」로 이해하는 견해도 있고, 그리스도(메시아)를 가리켜 「그리스도 안에서」로 이해하는 견해도 있다.
    reason: alternative_reading
