  verdict: revise
  source_fidelity: 초안의 「이끄셨으니」는 προορίσας(미리 정하다/예정하다)에 없는 ‘인도하다’의 뜻을 더하므로 삭제해야 합니다. εἰς αὐτόν은 문맥상 ‘그분 자신을 위하여’로 옮길 수 있으나, ‘그분께로’라는 방향적 이해도 가능한 표현이므로 각주로 보존했습니다.
  naturalness: 「양자됨에 이르도록」보다 「양자로 삼으시기로」가 현대 표준 한국어에서 자연스럽고, 법적 입양·신분 부여의 의미도 유지합니다. 「뜻의 기쁘신 결정」은 다소 부자연스럽고 εὐδοκία에 ‘결정’을 과도하게 부가하므로 「뜻의 선하신 기쁨」으로 조정했습니다.
  terminology: Χριστοῦ는 정책과 원문상 칭호로서 「메시아」를 유지했습니다. υἱοθεσία는 「양자로 삼음」으로 번역하고, 원어의 ‘아들의 신분’ 및 상속 함의는 각주에서 밝혔습니다.
  issues:
  - severity: high
    issue: 「자기에게로 이끄셨으니」가 원문에 없는 행위와 결과를 추가함
    rationale: προορίσας는 ‘미리 정하신/예정하신’이라는 뜻이며, ‘이끄셨다’에 해당하는 동사가 원문에 없습니다.
  - severity: medium
    issue: 「뜻의 기쁘신 결정」의 의미 확장 및 어색한 결합
    rationale: εὐδοκία는 호의, 선한 기쁨, 기뻐하심을 뜻합니다. ‘결정’은 본문에 명시되지 않은 작정의 뉘앙스를 추가합니다.
  - severity: medium
    issue: εἰς αὐτόν의 해석상 가능성을 본문에서 단정하고 각주로 보존하지 않음
    rationale: ‘그분 자신을 위하여’가 문맥상 자연스럽지만, 방향적 의미인 ‘그분께로’도 가능한 것으로 논의됩니다. 번역의 선택은 하되 각주로 대안을 제시하는 것이 적절합니다.
  revised_text: 그분께서는 예수 메시아를 통하여 우리를 양자로 삼으시기로, 그분 자신의 뜻의 선하신 기쁨을 따라 자신을 위하여[a] 미리 정하셨으니,
  revised_footnotes:
  - marker: a
    text: 또는 「그분께로」. 헬라어 εἰς αὐτόν은 문맥상 「그분 자신을 위하여」라는 목적을 나타낼 수 있으며, 「그분께로」라는 방향으로도 이해될 수 있다.
    reason: lexical_alternative
  - marker: b
    text: 「양자로 삼음」에 해당하는 헬라어 υἱοθεσία는 본래 「아들의 신분으로 입양함」을 가리키며, 법적 상속자 신분의 함의를 담는다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 「이끄셨으니」를 제거하고, προορίσας의 의미를 「미리 정하셨으니」로 보존했습니다. υἱοθεσία는 자연스러운 한국어로 「양자로 삼으시기로」라고 옮기되 원어의 아들 신분 및 법적 함의를 각주에 명시했습니다. εἰς αὐτόν의 가능한 해석은 본문과 각주에서 함께 보존했으며, εὐδοκία의 의미를 불필요하게 ‘결정’으로 확대하지 않았습니다.
