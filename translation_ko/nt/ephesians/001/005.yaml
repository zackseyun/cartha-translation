    text: 「양자로 삼으시기로」는 헬라어 υἱοθεσία를 옮긴 것입니다. 이 말은 본래 ‘아들의 신분으로 입양함’을 가리키며, 법적 상속자 신분의 함의를 담고 있습니다.
    reason: lexical_alternative
