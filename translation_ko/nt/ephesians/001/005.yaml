  text: having predestined us for adoption through Jesus Messiah to himself, according to the good pleasure of his will,
translation:
  language: ko
  text: 또한 예수 메시아로 말미암아 우리를 양자됨[a]에 이르도록 미리 정하사 자기에게로 이끄셨으니, 이는 그분 뜻의 기쁘신 결정대로 된 것이며—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: υἱοθεσία는 본래 「아들로 입양됨」을 가리키는 법적 용어이며, 상속자 신분의 함의를 담는다. 한국어 「양자됨」으로 옮긴다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  english_pob_choice: having predestined
  chosen_korean: 미리 정하사
  alternatives_korean:
  - 예정하사
  - 미리 작정하사
  lexicon: BDAG
  rationale: 글로서리 기본값. 「예정하사」도 가능하나 「미리 정하사」가 동사성을 보존한다.
- source_word: υἱοθεσίαν
  english_pob_choice: adoption
  chosen_korean: 양자됨
  alternatives_korean:
  - 아들 됨
  - 입양
  lexicon: BDAG
  rationale: 헬라-로마 법적 입양 제도의 무게를 담는 「양자됨」을 채택. 「아들 됨」도 가능하나 입양적 함의가 약하다.
- source_word: εὐδοκίαν τοῦ θελήματος
  english_pob_choice: good pleasure of his will
  chosen_korean: 뜻의 기쁘신 결정
  alternatives_korean:
  - 뜻의 선하신 기쁨
  - 기뻐하시는 뜻
  lexicon: BDAG
  rationale: εὐδοκία는 단순한 「기쁨」이 아니라 결정·작정의 무게를 담은 「기쁘신 뜻」이다. 한국어 「뜻의 기쁘신 결정」으로 양 측면을 보존한다.
