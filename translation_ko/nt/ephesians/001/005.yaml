  source_fidelity: 수정이 필요합니다. 초안의 「자기에게로 이끄셨으니」는 εἰς αὐτόν을 별도의 ‘이끄심’ 행위로 풀어 원문에 없는 동사를 더하며, προορίσας의 참여 구조도 과거 서술 「이끄셨으니」로 바꿉니다. εἰς αὐτόν은 ‘자기에게로/자신을 위하여’라는 방향 또는 목적의 여지를 보존해야 합니다.
  naturalness: 「뜻의 기쁘신 결정」은 현대 표준 한국어에서 어색하며, 「양자됨에 이르도록」도 문맥상 부자연스럽습니다. 「양자로 삼으시기로」와 「그분의 뜻에 따라 기뻐하신 대로」가 자연스럽고 원문의 구조를 잘 반영합니다.
  terminology: προορίζω는 「미리 정하시고」로, υἱοθεσία는 법적 입양 및 아들 신분의 함의를 밝혀 「양자로 삼으시기로」로 옮깁니다. Χριστός는 제목 의미를 살려 「메시아」로 유지합니다. εὐδοκία는 ‘결정’으로 과도하게 한정하지 않고 「기뻐하신 대로」로 번역합니다.
  issues:
  - severity: high
    issue: 「자기에게로 이끄셨으니」가 원문에 없는 행위를 추가함
    rationale: εἰς αὐτόν은 ‘그 자신에게로/그 자신을 위하여’를 뜻하는 전치사구이며, ‘이끌다’라는 동사를 포함하지 않습니다.
  - severity: medium
    issue: 「뜻의 기쁘신 결정」이 εὐδοκία를 부자연스럽고 과도하게 해석함
    rationale: εὐδοκία는 호의적인 기쁨, 선한 기뻐함을 가리키며, ‘결정’은 본문이 명시하지 않는 의미를 더합니다.
  - severity: medium
    issue: 「양자됨에 이르도록」이 한국어에서 어색하고 수단·목적 관계를 흐림
    rationale: εἰς υἱοθεσίαν은 입양의 목적을 나타내므로 ‘양자로 삼으시기로’가 자연스럽고 법적 신분 변화를 명료하게 나타냅니다.
  revised_text: 또 예수 메시아를 통하여 우리를 자기에게로 양자로 삼으시기로 미리 정하시고, 그분의 뜻에 따라 기뻐하신 대로 하셨습니다—
