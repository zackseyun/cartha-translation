  source_fidelity: 원문의 식별 구문(‘이 사람은 … 제자입니다’), 현재의 증언 행위, 완료된 기록 행위, 그리고 화자 미상의 1인칭 복수 ‘우리는 압니다’를 충실히 보존합니다. ‘그의 증언이 참되다’는 ἀληθὴς αὐτοῦ ἡ μαρτυρία ἐστίν을 정확히 반영합니다.
  naturalness: 표준어 현대 합쇼체로 자연스럽고 문장 구조도 명료합니다. ‘이 일들에 대하여’와 ‘이 일들을’의 반복은 원문의 반복을 적절히 살립니다.
  terminology: ‘제자’, ‘증언하다/증언’, ‘기록하다’, ‘참되다’는 요한복음의 문맥과 현대 한국어 성서 문체에 잘 맞습니다. 특히 ‘증언하고/증언’의 어근 반복은 μαρτυρῶν/μαρτυρία의 연결을 효과적으로 보존합니다.
