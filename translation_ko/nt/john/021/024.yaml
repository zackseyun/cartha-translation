id: JHN.21.24
reference: John 21:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
  footnotes:
  - marker: a
    text: Or 'bears witness about these things ... his witness is true.' The Greek uses cognate witness/testimony language throughout the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람은 이 일들에 대하여 증언하고 또 이 일들을 기록한 제자입니다. 그리고 우리는 그의 증언이 참되다는 것을 압니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일들에 대하여 증언하고 … 그의 증언은 참되다.’ 헬라어는 이 절 내내 증언 어근을 반복해 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν
  english_pob_choice: This is
  chosen_korean: 이 사람은
  alternatives_korean:
  - 이 이는
  - 이 제자는
  lexicon: BDAG
  rationale: 지시어의 식별 기능을 살리면서 한국어에서 자연스럽고 문맥상 지시 대상을 분명히 하는 표현으로 옮겼습니다.
- source_word: ὁ μαθητὴς
  english_pob_choice: the disciple
  chosen_korean: 제자
  alternatives_korean:
  - 학습자
  - 따르는 사람
  lexicon: BDAG
  rationale: 요한복음에서 예수를 따르는 문맥상 ‘제자’가 가장 직접적이고 관용적인 대응입니다.
- source_word: μαρτυρῶν / μαρτυρία
  english_pob_choice: testifies / testimony
  chosen_korean: 증언하고 / 증언
  alternatives_korean:
  - 증거하고 / 증거
  - 간증하고 / 간증
  lexicon: BDAG
  rationale: 동사와 명사의 어근 연결을 한국어에서도 드러내기 위해 같은 어휘군인 ‘증언’으로 통일해 cognate 관계를 살렸습니다.
- source_word: ὁ γράψας ταῦτα
  english_pob_choice: who wrote these things
  chosen_korean: 이 일들을 기록한
  alternatives_korean:
  - 이것들을 쓴
  - 이것들을 써 놓은
  lexicon: BDAG
  rationale: aorist 분사의 완료된 기록 행위를 자연스러운 현대 한국어로 반영하되, 단순한 ‘쓰다’보다 문맥상 문서화의 의미가 살아 있는 ‘기록하다’를 택했습니다.
- source_word: ἀληθὴς αὐτοῦ ἡ μαρτυρία ἐστίν
  english_pob_choice: his testimony is true
  chosen_korean: 그의 증언이 참되다는 것을 압니다
  alternatives_korean:
  - 그의 증언은 참입니다
  - 그의 증언이 참된 것임을 압니다
  lexicon: BDAG
  rationale: 문장 종결에서 ὅτι 절의 내용을 ‘~다는 것을 압니다’로 풀어 한국어 문장 흐름을 살리면서, ἀληθής를 ‘참되다’로 옮겨 진술의 신뢰성을 분명히 했습니다.
theological_decisions:
- issue: 우리는 압니다의 1인칭 복수 주체
  chosen_reading: 주체를 특정하지 않고 ‘우리는 압니다’로 그대로 유지했습니다.
  alternative_readings:
  - 복음서 기자의 편집적 발언으로 특정함
  - 증언 공동체의 진술로 해석함
  rationale: 헬라어는 1인칭 복수를 분명히 쓰지만 화자를 명시하지 않으므로, 해석을 확정하지 않고 본문이 가진 증언의 공동성/편집성 긴장을 보존했습니다.
  doctrine_reference: 저자성·공동증언 문제는 본문 수준에서 유보
