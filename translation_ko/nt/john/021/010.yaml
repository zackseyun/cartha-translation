id: JHN.21.10
reference: John 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
  footnotes:
  - marker: a
    text: Or, more formally, “Bring from the fish that you caught now.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. 「지금 잡은 물고기 몇 마리를 가져오십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, 「지금 잡은 물고기 몇 마리를 가져오십시오.」
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: BDAG
  rationale: 서술 문맥의 역사적 현재를 한국어 자연스러운 과거형으로 옮겼고, 예수의 발화를 존중하는 합쇼체로 처리했습니다.
- source_word: Ἐνέγκατε
  english_pob_choice: Bring
  chosen_korean: 가져오십시오
  alternatives_korean:
  - 가지고 오십시오
  - 가져오세요
  lexicon: BDAG
  rationale: 제자들이 이미 잡은 물고기를 예수께로 옮겨 오라는 명령이므로, 단순 ‘bring’의 동작을 자연스럽게 드러내는 ‘가져오십시오’가 적절합니다.
- source_word: ἀπὸ τῶν ὀψαρίων
  english_pob_choice: some of the fish
  chosen_korean: 물고기 몇 마리
  alternatives_korean:
  - 물고기 가운데 몇 마리
  - 잡은 것들 가운데 일부
  lexicon: BDAG
  rationale: ἀπό+부분적 속격의 부분 취지를 한국어의 ‘몇 마리’로 자연스럽게 살렸습니다. ‘물고기들 중 일부’보다 간결하고 현장감이 있습니다.
- source_word: ὧν ἐπιάσατε νῦν
  english_pob_choice: that you have now caught
  chosen_korean: 지금 잡은
  alternatives_korean:
  - 방금 잡은
  - 방금 잡아 온
  lexicon: BDAG
  rationale: νῦν은 최근성을 나타내므로 ‘지금’으로 옮겼고, 이미 끝난 잡은 행위를 수식하는 형태로 압축해 자연스럽게 표현했습니다.
theological_decisions:
- issue: 예수의 직접 명령 어조
  chosen_reading: 명령형을 부드럽게 완화하지 않고 ‘가져오십시오’로 옮겼습니다.
  alternative_readings:
  - 가져오세요
  - 가져오라
  rationale: 본문은 제자들에게 주는 직접 명령이므로, 현대 한국어 합쇼체를 유지하되 명령의 강도를 약화시키지 않았습니다.
  doctrine_reference: 본문의 서술/발화 레벨 유지
- issue: ‘지금’의 시간부사 처리
  chosen_reading: νῦν을 ‘지금’으로 번역해 즉시성을 드러냈습니다.
  alternative_readings:
  - 방금
  - 최근에
  rationale: 영문 POB의 ‘now caught’가 드러내는 최근 완료성과 원문의 νῦν을 함께 반영하기 위해 ‘지금’을 선택했습니다.
  doctrine_reference: 문맥상 시간 부사 처리
