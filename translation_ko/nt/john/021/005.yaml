base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
  footnotes:
  - marker: a
    text: Or 'anything to eat.' The Greek προσφάγιον refers more specifically to food eaten with bread; in this fishing context, it likely refers to fish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수께서 그들에게 말씀하셨습니다. “얘들아, 먹을 것[a]이 없느냐?” 그들이 그분께 대답했습니다. “없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 προσφάγιον은 빵과 함께 먹는 음식을 뜻하며, 특히 이 문맥에서는 물고기를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  english_pob_choice: Children
  chosen_korean: 얘들아
  alternatives_korean:
  - 아이들아
  - 자녀들아
  - 친구들아
  lexicon: BDAG
  rationale: 어린 제자들에게 친근하게 부르는 호격의 뉘앙스를 살리면서, 한국어에서 자연스러운 직접 호칭으로 옮겼습니다. '자녀들아'는 과도하게 신학적이고, '친구들아'는 해석을 앞세웁니다.
- source_word: μή τι προσφάγιον ἔχετε
  english_pob_choice: you do not have any fish, do you?
  chosen_korean: 먹을 것 좀 있느냐
  alternatives_korean:
  - 생선이 좀 있느냐
  - 먹을 것이 있느냐
  - 반찬거리가 있느냐
  lexicon: BDAG
  rationale: προσφάγιον은 빵과 함께 먹는 음식으로, 이 장면에서는 구체적으로 물고기를 가리킬 가능성이 높지만 한국어로는 지나친 특정화보다 문맥상 자연스러운 '먹을 것'이 더 원문 의미를 넓게 보존합니다.
- source_word: ἀπεκρίθησαν αὐτῷ
  english_pob_choice: They answered him
  chosen_korean: 그들이 그분께 대답했습니다
  alternatives_korean:
  - 그들이 그에게 대답했습니다
  - 그들이 대답했습니다
  lexicon: BDAG
  rationale: 서술의 기본 응답 공식을 자연스럽게 살리되, 앞선 예수 호칭과의 일관성을 위해 '그분께'를 사용했습니다.
theological_decisions:
- issue: 예수의 호칭과 대화체의 직설성
  chosen_reading: 예수께서 친근한 호격으로 제자들에게 직접 말씀하시는 장면으로, 합쇼체 서술 안에서 '얘들아'를 유지했습니다.
  alternative_readings:
  - 조금 더 중립적인 '아이들아'
  - 더 거리감 있는 '자녀들아'
  rationale: 원문 Παιδία는 정서적 친밀감을 띠는 직접 호칭이므로, 한국어에서도 관계의 가까움을 살리는 표현이 더 적절합니다.
  doctrine_reference: 요한복음 21장 문맥의 제자-주님 관계
