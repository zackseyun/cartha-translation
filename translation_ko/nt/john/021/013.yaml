  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
  footnotes:
  - marker: a
    text: Or 'came and took the bread and gave it to them.' The Greek uses historical presents.
    reason: lexical_alternative
  - marker: b
    text: Or 'and in the same way the fish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 오셔서 빵을 가져다가 그들에게 주시고, 물고기도 그렇게 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘오신다 … 가져가신다 … 주신다’라는 역사적 현재를 사용합니다. 문맥에 따라 ‘오셔서 … 가져다가 … 주셨습니다’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘물고기도 그와 같이 주십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  english_pob_choice: comes
  chosen_korean: 오셔서
  alternatives_korean:
  - 오십니다
  - 오고
  - 오셔서 오셔서
  lexicon: BDAG
  rationale: 현재형 역사적 현재를 한국어에서는 자연스러운 서술 흐름의 진행형/연결형으로 옮겨, 장면의 즉시성을 살렸습니다.
- source_word: λαμβάνει τὸν ἄρτον
  english_pob_choice: takes the bread
  chosen_korean: 빵을 들어
  alternatives_korean:
  - 빵을 집어
  - 그 빵을 들어
  - 빵을 받으셔서
  lexicon: BDAG
  rationale: 단순히 ‘취하다’보다 식사 장면에서 손에 들어 분배하는 동작을 자연스럽게 드러내는 표현을 택했습니다. 정관사 ὁ ἄρτος의 특정성을 한국어에서는 문맥상 자연스럽게 처리했습니다.
- source_word: δίδωσιν αὐτοῖς
  english_pob_choice: gives it to them
  chosen_korean: 그들에게 주시고
  alternatives_korean:
  - 그들에게 그것을 주시고
  - 그들에게 건네시고
  - 그들에게 나누어 주시고
  lexicon: BDAG
  rationale: 앞선 ‘빵’을 한국어에서 반복하지 않고도 지시가 분명하므로 대명사 ‘그것’을 생략해 간결하게 옮겼습니다. ‘나누어 주시고’는 해석이 더해져 본문을 좁히지 않도록 피했습니다.
- source_word: ὀψάριον ὁμοίως
  english_pob_choice: the fish likewise
  chosen_korean: 물고기도 그와 같이 하셨습니다
  alternatives_korean:
  - 물고기도 마찬가지로 하셨습니다
  - 물고기도 그와 같이
  - 물고기도 역시
  lexicon: BDAG
  rationale: ὁμοίως의 병렬을 살리면서, 한국어에서는 생략된 동사를 보충해 자연스럽게 마무리했습니다. ὀψάριον은 이 문맥에서 음식으로서의 물고기이므로 ‘물고기’로 옮겼습니다.
theological_decisions:
- issue: 부활 현현 장면의 서술 시제 처리
  chosen_reading: 그리스어의 역사적 현재를 한국어에서는 흐름이 살아 있는 연결 서술로 옮겼습니다.
  alternative_readings:
  - '과거형으로 평탄하게 옮김: ‘예수님이 오셨습니다…’'
  rationale: 문법적 시제보다 장면의 생생함을 살리는 것이 본문의 효과를 더 잘 반영하므로, 한국어에서는 합쇼체의 자연스러운 연쇄 동작으로 구현했습니다.
  doctrine_reference: Translation philosophy §1, §6
