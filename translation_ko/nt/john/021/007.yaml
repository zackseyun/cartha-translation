  source_fidelity: 수정이 필요합니다. 초안의 ‘자기의 겉옷을 두르게 했습니다’는 사역형으로서 베드로가 다른 이에게 옷을 두르게 했다는 뜻이 될 수 있으며, 중간태 διεζώσατο(스스로 겉옷을 두르다/동여매다)를 충실히 옮기지 못합니다. 또한 γυμνός는 문맥상 문자적 나체와 옷을 거의 입지 않은 상태 사이의 의미 범위를 지니므로, 본문과 각주에서 그 여지를 보존해야 합니다.
  naturalness: ‘겉옷을 두르고’가 현대 표준어 합쇼체 서술에서 자연스럽고, ‘주님이시라는 말을 듣고’는 ὅτι절의 내용을 명확히 드러냅니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자의 연결을 명료하게 합니다.
  terminology: ‘예수님’, ‘주님’, ‘시몬 베드로’, ‘겉옷’, ‘바다’는 한국어 성경 문맥과 원문의 명칭 및 핵심 용어에 적절합니다. γυμνός를 본문에서 ‘벗고 있었다’로 두고 ‘옷을 거의 입지 않은 상태’라는 문맥적 가능성을 각주로 보완합니다.
  issues:
