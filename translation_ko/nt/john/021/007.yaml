  - severity: low
    issue: γυμνός에 대한 본문·각주 관계
    rationale: 초안의 본문 ‘벗은 몸’과 각주의 첫 대안 ‘벗은 몸이었다’가 사실상 중복됩니다. 본문은 직결되는 표현으로 두고, 각주에서는 문맥상 ‘옷을 거의 입지 않은 상태’라는 대안을 제시하는 것이 더 유익합니다.
