  to: 그러자 예수님이 사랑하신 그 제자가 베드로에게 말했습니다. “주님이십니다.” 그러자 시몬 베드로는 주님이시라는 말을 듣고 자기의 겉옷을 두르고, 그는 벗고 있었기 때문입니다[a], 바다로 몸을 던졌습니다.
  rationale: 중간태 동사 διεζώσατο를 자연스러운 한국어로 정확히 반영하도록 사역형을 제거하고 ‘자기의 겉옷을 두르고’로 수정했습니다. γυμνός의 논쟁적·문맥 의존적 범위를 본문과 각주에서 보존했으며, 각주 표지를 해당 어구 바로 뒤로 옮겼습니다. 나머지 연결 표현, 존대 서술, 인명 및 ‘주님’은 원문과 영어 POB의 번역 결정을 충실히 따릅니다.
