id: JHN.21.7
reference: John 21:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
  footnotes:
  - marker: a
    text: Or, “for he was naked.” The Greek γυμνός can mean either literally naked or insufficiently/lightly clothed, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수님이 사랑하신 그 제자가 베드로에게 말했습니다. "주님이십니다." 그러자 시몬 베드로는 그것이 주님이신 것을 듣고 자기의 겉옷을 두르게 했습니다—그는 벗은 몸이었기 때문입니다—그리고 바다로 몸을 던졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “벗은 몸이었다.” 헬라어 γυμνός는 문맥에 따라 문자적으로 ‘벌거벗은’ 또는 ‘충분히/가볍게만 입은’ 상태를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  english_pob_choice: that disciple whom Jesus loved
  chosen_korean: 예수님이 사랑하신 그 제자
  alternatives_korean:
  - 예수님이 사랑한 제자
  - 예수님께서 사랑하신 그 제자
  lexicon: BDAG
  rationale: ἐκεῖνος의 지시성을 살려 ‘그’와 ‘제자’를 함께 유지했고, ἠγάπα는 자연스러운 과거 서술로 ‘사랑하신’으로 옮겼습니다.
- source_word: Ὁ κύριός ἐστιν
  english_pob_choice: It is the Lord
  chosen_korean: 주님이십니다
  alternatives_korean:
  - 주님입니다
  - 주이십니다
  lexicon: BDAG
  rationale: κύριος는 이 문맥에서 예수님에 대한 인식의 호칭이므로 기본값 ‘주님’을 유지했고, 한국어에서는 감탄적 확인을 살리는 존대 종결로 옮겼습니다.
- source_word: τὸν ἐπενδύτην
  english_pob_choice: his outer garment
  chosen_korean: 자기의 겉옷
  alternatives_korean:
  - 그의 바깥옷
  - 겉옷
  lexicon: BDAG
  rationale: ἐπενδύτης는 몸에 걸치는 바깥옷이므로, 의미를 과장하지 않으면서도 자연스러운 한국어 표현인 ‘겉옷’으로 옮겼습니다.
- source_word: ἦν γὰρ γυμνός
  english_pob_choice: for he was lightly clothed
  chosen_korean: 그는 벗은 몸이었기 때문입니다
  alternatives_korean:
  - 그는 벌거벗었기 때문입니다
  - 그는 거의 입지 않고 있었기 때문입니다
  lexicon: BDAG
  rationale: γυμνός의 직접적 의미를 따라 ‘벗은 몸’으로 옮기되, 문맥상 완전한 노출인지 작업복 차림의 결핍인지 단정하지 않기 위해 한국어를 다소 중립적으로 잡았습니다.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  english_pob_choice: threw himself into the sea
  chosen_korean: 바다로 몸을 던졌습니다
  alternatives_korean:
  - 바다에 몸을 던졌습니다
  - 바다로 뛰어들었습니다
  lexicon: BDAG
  rationale: βάλλω의 역동성을 살리기 위해 ‘몸을 던졌습니다’를 택했고, θάλασσα는 요한복음의 용례에 맞게 ‘바다’로 옮겼습니다.
theological_decisions:
- issue: γυμνός의 상태를 한국어로 얼마나 직접적으로 드러낼지
  chosen_reading: 벗은 몸이었기 때문입니다
  alternative_readings:
  - 벌거벗었기 때문입니다
  - 거의 입지 않고 있었기 때문입니다
  rationale: 본문은 베드로의 옷차림이 불완전했음을 말하지만, 정확히 전면적 나체였는지는 문맥상 여지를 남깁니다. 한국어는 직역의 강도를 유지하되, 독자가 문맥을 지나치게 성적·자극적으로 읽지 않도록 중립적인 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §1, §6
