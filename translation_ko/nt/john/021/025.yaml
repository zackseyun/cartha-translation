review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그것들을 하나씩 기록한다면’은 그리스어 γράφηται(수동태)의 의미를 능동으로 바꾸므로, ‘그것들이 하나씩 기록된다면’으로 고쳐야 합니다. 나머지 핵심 의미, 곧 예수께서 행하신 많은 다른 일, 개별 기록이라는 가정, 세상이 책들을 수용하지 못한다는 과장적 표현은 잘 보존되어 있습니다.
  naturalness: ‘세상 자체라도’도 이해되지만, 부정문에서 ‘세상 자체도’가 ‘not even the world itself’를 더 자연스럽고 직접적으로 나타냅니다. ‘그 기록될 책들’은 앞의 조건절과의 지시 관계를 한국어에서 명료하게 합니다.
  terminology: ‘예수께서 하신’, ‘기록’, ‘책들’, ‘담을 수 없을 것입니다’는 현대 표준어 합쇼체에 적절하며, χωρέω의 공간적 비유도 유지합니다. γραφόμενα βιβλία의 문맥상 미래-결과적 번역인 ‘기록될 책들’은 각주로 직역 가능성을 밝혀 안전합니다.
