id: JHN.21.25
reference: John 21:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: Now there are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
  footnotes:
  - marker: a
    text: Or, 'would contain the books that would be written.' The Greek verb can mean 'have room for' or 'contain,' and the participle may be rendered more idiomatically as a future-result idea.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 예수께서 하신 다른 많은 일들도 있습니다. 그것들을 하나씩 기록한다면, 내 생각에는 세상 자체라도 기록될 책들을 다 담을 수 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기록될 책들’은 직역하면 ‘기록되는 책들’입니다. 문맥상 ‘기록될’이라는 미래-결과적 표현이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν δὲ καὶ ἄλλα πολλὰ
  english_pob_choice: Now there are also many other things
  chosen_korean: 또 예수께서 하신 다른 많은 일들도 있습니다
  alternatives_korean:
  - 그리고 예수께서 하신 다른 많은 일들도 있습니다
  - 이 밖에도 예수께서 하신 다른 많은 일들이 있습니다
  lexicon: BDAG
  rationale: δὲ의 담화 전환을 '또'로 옮겨 결말부의 덧붙임 느낌을 살리고, ἄλλα πολλὰ를 '다른 많은 일들'로 자연스럽게 표현했습니다.
- source_word: ἐποίησεν ὁ Ἰησοῦς
  english_pob_choice: that Jesus did
  chosen_korean: 예수께서 하신
  alternatives_korean:
  - 예수께서 행하신
  - 예수께서 하신 일
  lexicon: BDAG
  rationale: ποιέω는 여기서 넓게 '행하다/하다'의 뜻이므로, 문맥에 맞게 간결한 '하신'으로 옮겼습니다.
- source_word: ἅτινα ἐὰν γράφηται καθ’ ἕν
  english_pob_choice: which, if they were written down one by one
  chosen_korean: 그것들을 하나씩 기록한다면
  alternatives_korean:
  - 그것들이 하나씩 기록된다면
  - 그것들을 하나하나 적는다면
  lexicon: BDAG
  rationale: 가정적 조건과 분배적 표현 καθ’ ἕν을 한국어의 자연스러운 '하나씩'으로 살렸고, γράφηται는 기록 행위를 분명하게 하는 '기록한다면'으로 옮겼습니다.
- source_word: χωρήσειν τὰ γραφόμενα βιβλία
  english_pob_choice: would have room for the books being written
  chosen_korean: 기록될 책들을 다 담을 수 없을 것입니다
  alternatives_korean:
  - 기록될 책들을 담을 수 없을 것입니다
  - 기록되는 책들을 다 담지 못할 것입니다
  lexicon: BDAG
  rationale: χωρέω의 '들어갈 자리가 있다/담다'라는 공간 이미지를 살려 '다 담을 수 없을 것입니다'로 옮겼고, γραφόμενα βιβλία는 문맥상 '기록될 책들'로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 요한복음 결말의 과장법 보존
  chosen_reading: 세상 자체라도 기록될 책들을 다 담을 수 없을 것입니다
  alternative_readings:
  - 세상도 기록될 책들을 담지 못할 것입니다
  - 세상이라도 그 책들을 다 담을 수 없을 것입니다
  rationale: 이 절의 수사적 과장을 약화시키지 않고, 복음서 끝맺음의 증언적 강조를 그대로 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
