    issue: ‘그것이 예수님이신 줄’이라는 지시 표현
    rationale: 사람의 신원을 가리키는 이 문맥에서 ‘그것’은 비인칭적으로 들립니다. 원문의 의미를 보태지 않으면서 ‘그분이 예수님이신 줄’로 고치면 자연스럽고 명확합니다.
  - severity: low
    issue: ‘이미 날이 밝아 오자’의 시간상 뉘앙스
    rationale: ‘밝아 오자’는 동이 트기 시작하는 순간을 강조할 수 있습니다. γενομένης와 ἤδη의 완료된 시간 배경은 ‘날이 이미 밝았을 때’가 더 직접적으로 드러냅니다.
  - severity: low
    issue: 각주의 대안 및 문자적 설명에 비인칭 ‘그것’을 사용함
    rationale: 본문 수정에 맞추어 각주도 ‘그분이 예수님이신 줄’로 통일해야 대안 번역과 문자적 설명이 자연스럽고 정확합니다.
