id: JHN.21.4
reference: John 21:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: Now when daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
  footnotes:
  - marker: a
    text: Or "did not recognize that it was Jesus." The Greek says more literally, "did not know that it was Jesus."
    reason: lexical_alternative
translation:
  language: ko
  text: 이미 날이 밝아 오자 예수께서 해변에 서 계셨습니다. 그러나 제자들은 그것이 예수님이신 줄 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예수님이신 줄 알아보지 못했습니다.” 그리스어는 더 문자적으로 “그것이 예수님이신 줄 알지 못했습니다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  english_pob_choice: when daybreak had already come
  chosen_korean: 이미 날이 밝아 오자
  alternatives_korean:
  - 이미 아침이 되자
  - 이미 새벽이 지나자
  lexicon: BDAG
  rationale: genitive absolute의 시간 배경을 자연스러운 한국어 부사절로 옮기되, πρωΐα의 이른 아침/동틀 무렵의 뉘앙스를 ‘날이 밝다’로 살렸습니다.
- source_word: ἔστη
  english_pob_choice: stood
  chosen_korean: 서 계셨습니다
  alternatives_korean:
  - 서 있었습니다
  - 서셨습니다
  lexicon: BDAG
  rationale: 단순한 과거 사건을 나타내면서도, 예수의 지속된 현존을 한국어에서 자연스럽게 드러내기 위해 ‘서 계셨습니다’를 택했습니다.
- source_word: εἰς τὸν αἰγιαλόν
  english_pob_choice: on the shore
  chosen_korean: 해변에
  alternatives_korean:
  - 해안가에
  - 해변가에
  - 모래사장에
  lexicon: BDAG
  rationale: αἰγιαλός는 바닷가/해변을 가리키므로, 문맥에 맞는 현대적 표준어인 ‘해변’으로 옮겼습니다.
- source_word: ᾔδεισαν
  english_pob_choice: did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알아보지 못했습니다
  - 인식하지 못했습니다
  lexicon: BDAG
  rationale: 동사가 οἶδα의 ‘알다’이므로, 영어 POB처럼 인식의 방향을 암시하되 원뜻을 보존하는 ‘알지 못했습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 부활 후 예수 인식 실패의 표현
  chosen_reading: 제자들의 반응을 설명하지 않고, 단지 ‘알지 못했다’는 서술로 유지했습니다.
  alternative_readings:
  - ‘예수님이신 줄 알아보지 못했습니다’로 해석적으로 옮김
  rationale: 본문은 왜 알아보지 못했는지 설명하지 않으므로, 그 긴장을 유지해 서술의 절제를 보존했습니다.
  doctrine_reference: 서술이 제공하지 않는 설명을 덧붙이지 않음
