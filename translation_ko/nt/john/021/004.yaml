revisions:
- from: 이미 날이 밝아 오자 예수께서 해변에 서 계셨습니다. 그러나 제자들은 그것이 예수님이신 줄 알지 못했습니다.[a]
  to: 날이 이미 밝았을 때, 예수께서는 해변에 서 계셨습니다. 그러나 제자들은 그분이 예수님이신 줄 알지 못했습니다.[a]
  rationale: 시간 배경을 원문의 ‘이미 아침이 되었을 때’에 맞추고, 예수의 신원을 가리키는 한국어 지시 표현을 자연스럽게 바로잡았습니다. 본문은 οἶδα의 기본 뜻을 따라 ‘알지 못했습니다’로 유지하고, ‘알아보다’는 각주의 해석적 대안으로만 제시했습니다. 본문과 각주의 표지는 모두 비인칭 ‘그것’이 아니라 사람을 가리키는 ‘그분’에 일치시켰습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:06Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그것이 예수님이신 줄’은 한국어에서 사람을 가리키는 방식으로 부자연스럽고, 원문의 식별 절(‘예수이심을’)도 더 자연스럽게 ‘그분이 예수님이신 줄’로 옮길 수 있습니다. 또한 ‘이미 날이 밝아 오자’는 날이 밝기 시작하는 시점에 초점을 두므로, πρωΐας ... ἤδη γενομένης의 ‘이미 아침/동틀 무렵이 되었을 때’를 더 직접적으로 반영하는 표현이 적절합니다.
  naturalness: ‘날이 이미 밝았을 때’와 ‘그분이 예수님이신 줄’은 현대 표준어 합쇼체 문맥에서 자연스럽습니다. ‘서 계셨습니다’는 예수님에 대한 공손한 서술로 자연스럽고, 해변에 서 계신 상태를 무리 없이 나타냅니다.
  terminology: ‘예수님’, ‘제자들’, ‘해변’은 일관되고 적절합니다. 원문의 οἶδα를 본문에서는 ‘알지 못했습니다’로 유지하며, ‘알아보지 못했습니다’는 해석적 대안으로 각주에만 둡니다.
