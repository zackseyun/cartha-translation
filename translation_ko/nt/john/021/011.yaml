source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
  footnotes:
  - marker: a
    text: Or 'went up'; the Greek verb is literally 'went up,' but in context likely means that Simon Peter got into or onto the boat to pull in the net.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the land'; here 'shore' conveys the sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 시몬 베드로가 올라가서[a] 큰 물고기 백오십삼 마리가 가득 든 그물을 육지로[b] 끌어올렸습니다. 그렇게 많았는데도 그물은 찢어지지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘올라가서’입니다. 문맥상 시몬 베드로가 그물을 끌어올리기 위해 배에 또는 배 위로 올라간 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅으로’ 또는 ‘육지로’입니다. 여기서는 어획 장면의 문맥상 물에서 뭍으로 끌어올린 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  english_pob_choice: went aboard
  chosen_korean: 올라가
  alternatives_korean:
  - 배에 올라가
  - 올라탔는데
  lexicon: BDAG
  rationale: 직역하면 ‘올라가다’이지만, 문맥상 베드로가 그물을 끌어올리기 위해 배나 물가 쪽으로 몸을 움직인 동작을 가리키므로 한국어에서는 간결하게 ‘올라가’로 처리했습니다.
- source_word: εἵλκυσεν
  english_pob_choice: pulled
  chosen_korean: 끌어올렸는데
  alternatives_korean:
  - 끌었습니다
  - 잡아당겼는데
  lexicon: BDAG
  rationale: 그물을 물에서 육지로 당겨 올리는 동작이므로 ‘끌어올리다’가 가장 자연스럽고, 힘을 들여 당기는 뉘앙스도 살립니다.
- source_word: εἰς τὴν γῆν
  english_pob_choice: onto the shore
  chosen_korean: 육지에
  alternatives_korean:
  - 뭍에
  - 해변으로
  lexicon: BDAG
  rationale: 직역은 ‘땅으로/육지로’이지만, 어획 장면의 문맥에서 ‘육지’가 대상 지점을 직접적이고도 자연스럽게 드러냅니다.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  english_pob_choice: one hundred fifty-three
  chosen_korean: 백쉰세 마리
  alternatives_korean:
  - 153마리
  - 백오십삼 마리
  lexicon: BDAG
  rationale: 원문의 구체적 수를 그대로 반영하되, 한국어 성경 문체에서는 한자식 수사보다 읽기 쉬운 ‘백쉰세 마리’를 택했습니다.
theological_decisions:
- issue: 많은 수에도 그물이 찢어지지 않았다는 서술의 보존
  chosen_reading: “그렇게 많았지만 그 그물은 찢어지지 않았습니다”로, 수량의 과중함과 보존의 대비를 분명히 살렸습니다.
  alternative_readings:
  - “그래도 그 그물은 찢어지지 않았습니다”
  - “그 수가 많았음에도 그 그물은 찢어지지 않았습니다”
  rationale: 본문의 대조점은 단순한 정보가 아니라 기적적 보존의 강조에 있으므로, 수의 많음과 그물의 무결성을 함께 선명하게 드러냈습니다.
  doctrine_reference: 본문 서술의 기적적 표지
