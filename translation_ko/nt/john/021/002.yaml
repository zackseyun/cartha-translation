id: JHN.21.2
reference: John 21:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
  footnotes:
  - marker: a
    text: 'Greek: ''Thomas called Didymus.'' ''Didymus'' is the Greek term meaning ''Twin.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬 베드로, 디두모라고 불리는 도마, 갈릴리 가나 출신 나다나엘, 세베대의 아들들, 그리고 그의 제자들 가운데 다른 두 사람이 함께 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 Δίδυμος는 고유명사로 음역할 수 있지만, 뜻은 ‘쌍둥이’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  english_pob_choice: were together
  chosen_korean: 함께 있었습니다
  alternatives_korean:
  - 같이 있었습니다
  - 한곳에 있었습니다
  lexicon: BDAG
  rationale: ἦσαν의 상태 서술과 ὁμοῦ의 ‘함께/같은 곳에’ 의미를 자연스러운 합쇼체로 압축해 옮겼습니다.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  english_pob_choice: Thomas called Didymus
  chosen_korean: 디두모라고 불리는 도마
  alternatives_korean:
  - 도마라고 불리는 디두모
  - 디두모라 불리는 도마
  lexicon: BDAG
  rationale: λεγόμενος는 ‘불리는’으로, Δίδυμος는 고유명사로 음역해 POB의 형식을 따르면서도 주석 없이도 읽히게 했습니다.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  english_pob_choice: Nathanael from Cana of Galilee
  chosen_korean: 갈릴리 가나 출신 나다나엘
  alternatives_korean:
  - 갈릴리 가나에서 온 나다나엘
  - 갈릴리 가나 사람 나다나엘
  lexicon: BDAG
  rationale: ἀπό는 출신/기원을 나타내므로 ‘출신’으로 옮겨 출처를 분명히 했습니다.
- source_word: οἱ τοῦ Ζεβεδαίου
  english_pob_choice: the sons of Zebedee
  chosen_korean: 세베대의 아들들
  alternatives_korean:
  - 세베대의 아들들
  - 세베대의 아들들
  lexicon: BDAG
  rationale: 관용적 소유 표현으로서 ‘세베대의 아들들’이 가장 자연스럽고, 문맥상 누군지 이미 알려진 집단을 가리킵니다.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  english_pob_choice: two others of his disciples
  chosen_korean: 그의 제자들 가운데 다른 두 사람
  alternatives_korean:
  - 그의 제자들 중 다른 두 사람
  - 제자들 가운데 다른 둘
  lexicon: BDAG
  rationale: ἐκ τῶν μαθητῶν αὐτοῦ의 부분적 의미를 살리되, 한국어에서는 ‘가운데’로 자연스럽게 풀어 옮겼습니다.
