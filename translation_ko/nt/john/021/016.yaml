source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
  footnotes:
  - marker: a
    text: 'Greek uses two different verbs for ''love'' in this exchange: Jesus asks with agapaō, and Peter replies with phileō. Many interpreters see a distinction; others see stylistic variation. The main text renders both as ''love'' to avoid overstating the difference.'
    reason: lexical_alternative
  - marker: b
    text: Or 'again, a second time'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 다시, 두 번째로[a] 그에게 말씀하셨습니다. “요한의 아들 시몬아, 네가 나를 사랑합니까?” 시몬이 예수께 말씀드렸습니다. “예, 주님, 제가 주님을 사랑하는 것을 주님께서 아십니다.” 예수께서 그에게 말씀하셨습니다. “내 양들을 목양하십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 반복을 πάλιν(다시)과 δεύτερον(두 번째로)으로 겹쳐 표현합니다.
    reason: source_note
  - marker: b
    text: 그리스어에서는 예수님의 질문에 ἀγαπάω, 시몬의 대답에 φιλέω라는 서로 다른 ‘사랑하다’ 동사를 사용합니다. 둘 사이에 의미 차이가 있다고 보는 해석도 있고 문체상의 변이로 보는 해석도 있으므로, 본문에서는 모두 ‘사랑하다’로 옮겼습니다. 또한 ‘목양하십시오’는 ποιμαίνω를 옮긴 것으로, 양을 목자처럼 돌보고 인도한다는 비유를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  english_pob_choice: again, a second time
  chosen_korean: 다시 두 번째로
  alternatives_korean:
  - 두 번째로
  - 다시
  lexicon: BDAG
  rationale: πάλιν과 δεύτερον이 함께 반복을 겹쳐 강조하므로, 한국어에서도 ‘다시’와 ‘두 번째로’를 함께 살려 중복된 반복 강조를 보존했습니다.
- source_word: Σίμων ⸀Ἰωάννου
  english_pob_choice: Simon, son of John
  chosen_korean: 요한의 아들 시몬
  alternatives_korean:
  - 시몬, 요한의 아들
  - 요한의 아들인 시몬
  lexicon: BDAG
  rationale: 속격 Ἰωάννου는 자연스러운 부자 관계로 옮기는 것이 가장 분명하며, 본문의 인물 호칭을 매끄럽게 유지합니다.
- source_word: ἀγαπᾷς με / φιλῶ σε
  english_pob_choice: do you love me / I love you
  chosen_korean: 나를 사랑하느냐 / 주님을 사랑하는
  alternatives_korean:
  - 나를 사랑하느냐 / 주님을 좋아합니다
  - 나를 사랑하느냐 / 주님께 애정을 가집니다
  lexicon: BDAG
  rationale: 두 동사 모두 한국어에서는 기본적으로 ‘사랑하다’로 옮겨야 본문의 대답과 요청이 자연스럽게 대응되며, 과도한 의미 차이를 주입하지 않습니다.
- source_word: Ποίμαινε τὰ πρόβατά μου
  english_pob_choice: Shepherd my sheep
  chosen_korean: 내 양들을 목양하라
  alternatives_korean:
  - 내 양들을 치라
  - 내 양들을 돌보라
  lexicon: BDAG
  rationale: ποιμαίνω는 단순히 ‘먹이다’보다 목자처럼 인도하고 돌보고 다스리는 행위를 가리키므로, 목양하다가 비유를 가장 온전히 살립니다.
theological_decisions:
- issue: ἀγαπάω와 φιλέω의 차이를 한국어 본문에서 어떻게 처리할지
  chosen_reading: 본문에서는 둘 다 ‘사랑하다’로 번역하고, 동사 차이는 확대 해석하지 않습니다.
  alternative_readings:
  - ἀγαπάω는 ‘사랑하다’, φιλέω는 ‘좋아하다’로 구분
  - ἀγαπάω는 ‘깊이 사랑하다’, φιλέω는 ‘사랑하다’로 구분
  rationale: 요한복음에서는 두 동사가 어느 정도 겹쳐 쓰일 수 있으므로, 본문에서 강한 신학적 대비를 만들어내기보다 동일한 핵심 의미를 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, source tension preserved rather than over-resolved.
