source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
  footnotes:
  - marker: a
    text: The Greek uses φιλέω here ('love, have affection for') where earlier in the exchange Jesus had used ἀγαπάω in two questions. Some interpreters see a meaningful distinction; others regard the verbs as overlapping in this context. The translation preserves the exchange with 'love' and does not force a sharper contrast than the Greek clearly requires.
    reason: lexical_alternative
  - marker: b
    text: 'Greek uses two verbs for ''know'' in Peter''s reply: οἶδα and γινώσκω. English normally renders both as ''know'' here; the repetition may suggest nuance, but not one that can be expressed naturally without over-interpretation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 세 번째로 그에게 말씀하셨습니다. 「시몬, 요한의 아들아, 네가 나를 사랑하느냐?」 베드로는 그가 세 번째로 「네가 나를 사랑하느냐?」라고 말씀하시는 것을 보고 마음이 아파졌습니다. 그는 그에게 대답했습니다. 「주님, 주님께서는 모든 것을 아십니다. 주님께서 내가 주님을 사랑하는 것을 아십니다.」 예수께서 그에게 말씀하셨습니다. 「내 양들을 먹이십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 여기서 φιλέω를 사용하며, 앞선 두 질문에서는 ἀγαπάω가 나옵니다. 두 동사의 차이를 의미 있게 보는 해석도 있지만, 이 문맥에서 그 차이를 지나치게 분명하게 만들지는 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: 베드로의 대답에는 ‘알다’를 뜻하는 두 동사, οἶδα와 γινώσκω가 함께 나옵니다. 한국어에서는 보통 둘 다 ‘알다’로 옮기며, 자연스러운 표현을 위해 본문도 그렇게 처리했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  english_pob_choice: the third time
  chosen_korean: 세 번째로
  alternatives_korean:
  - 세 번째 때
  - 세 번째로
  lexicon: BDAG
  rationale: 반복된 질문의 시간·횟수 표현으로 자연스럽고, 앞선 두 번의 질문과의 연속성을 그대로 드러냅니다.
- source_word: Σίμων Ἰωάννου
  english_pob_choice: Simon, son of John
  chosen_korean: 시몬, 요한의 아들
  alternatives_korean:
  - 시몬, 요한의 아들아
  - 시몬, 요한의 아들인
  lexicon: BDAG
  rationale: 헬라어 속격은 가장 자연스럽게 부자 관계로 읽히므로, 표준 한국어의 친명호 구조로 옮겼습니다.
- source_word: φιλεῖς με / φιλῶ σε
  english_pob_choice: love / love
  chosen_korean: 사랑하느냐 / 사랑합니다
  alternatives_korean:
  - 좋아하느냐 / 좋아합니다
  - 애정을 두느냐 / 애정을 둡니다
  lexicon: BDAG
  rationale: φιλέω의 기본 의미는 애정이 있는 사랑이며, 본문이 요구하는 엄숙한 관계성을 살리기 위해 둘 다 ‘사랑’으로 유지했습니다. 영어 POB처럼 본문에서 ἀγαπάω와의 차이를 과도하게 해석하지 않았습니다.
- source_word: ἐλυπήθη
  english_pob_choice: was grieved
  chosen_korean: 마음이 아파졌습니다
  alternatives_korean:
  - 근심했습니다
  - 슬퍼했습니다
  lexicon: BDAG
  rationale: 단순한 감상보다 깊은 내적 고통을 나타내므로, 현대 한국어에서 자연스럽고 강한 정서 표현을 택했습니다.
- source_word: πάντα σὺ οἶδας, σὺ γινώσκεις
  english_pob_choice: you know all things; you know
  chosen_korean: 주님께서는 모든 것을 아십니다. 주님께서 내가 주님을 사랑하는 것을 아십니다
  alternatives_korean:
  - 주님은 모든 것을 아십니다. 주님은 내가 주님을 사랑함을 아십니다
  - 주님께서는 모든 것을 알고 계십니다. 주님께서 ... 아십니다
  lexicon: BDAG
  rationale: οἶδα와 γινώσκω의 반복을 한국어에서 둘 다 ‘아십니다’로 자연스럽게 살리되, POB의 주석처럼 두 동사의 미세한 차이를 본문에서 과장하지 않았습니다.
- source_word: Βόσκε τὰ πρόβατά μου
  english_pob_choice: Feed my sheep
  chosen_korean: 내 양들을 먹이십시오
  alternatives_korean:
  - 내 양들을 먹이십시오
  - 내 양 떼를 돌보십시오
  lexicon: BDAG
  rationale: βόσκω는 ‘먹이다/풀을 먹이다’의 의미가 핵심이므로 ‘돌보다’보다 직접적인 동사로 옮겼고, πρόβατα는 ‘양들’로 유지했습니다.
theological_decisions:
- issue: φιλέω와 ἀγαπάω의 차이를 번역에서 어떻게 처리할지
  chosen_reading: 본문에서는 두 동사를 모두 ‘사랑하다’로 옮기고, 그 차이를 결정적 의미로 못 박지 않았습니다.
  alternative_readings:
  - ‘사랑하느냐’와 ‘마음에 두느냐’처럼 다르게 구분하기
  - 동사의 교체 자체를 번역으로 강조하기
  rationale: 헬라어의 어휘 대비는 해석상 논의가 있지만, 본문 수준에서 안정적으로 확정하기 어렵습니다. 그래서 POB의 취지대로 긴장을 보존하되 과잉 해석은 피했습니다.
  doctrine_reference: Translation philosophy §3; §5
