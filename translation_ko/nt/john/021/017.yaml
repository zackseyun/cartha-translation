  rationale: 원문의 ὅτι가 나타내는 인과관계(세 번째 질문을 받았기 때문에 베드로가 슬퍼함)를 회복했습니다. 화자를 명확히 하고, 베드로의 존대 발화에 맞춰 ‘제가’를 사용했습니다. 논쟁적인 어휘 차이는 기존 번역 원칙에 따라 주석에서만 다루었으며, 각주 표지를 해당 표현 가까이 옮겼습니다.
