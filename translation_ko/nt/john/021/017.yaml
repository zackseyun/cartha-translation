  english_pob_choice: you know all things; you know
  chosen_korean: 주님께서는 모든 것을 아십니다. 주님께서 내가 주님을 사랑하는 것을 아십니다
  alternatives_korean:
  - 주님은 모든 것을 아십니다. 주님은 내가 주님을 사랑함을 아십니다
  - 주님께서는 모든 것을 알고 계십니다. 주님께서 ... 아십니다
  lexicon: BDAG
  rationale: οἶδα와 γινώσκω의 반복을 한국어에서 둘 다 ‘아십니다’로 자연스럽게 살리되, POB의 주석처럼 두 동사의 미세한 차이를 본문에서 과장하지 않았습니다.
- source_word: Βόσκε τὰ πρόβατά μου
  english_pob_choice: Feed my sheep
  chosen_korean: 내 양들을 먹이십시오
  alternatives_korean:
  - 내 양들을 먹이십시오
  - 내 양 떼를 돌보십시오
  lexicon: BDAG
  rationale: βόσκω는 ‘먹이다/풀을 먹이다’의 의미가 핵심이므로 ‘돌보다’보다 직접적인 동사로 옮겼고, πρόβατα는 ‘양들’로 유지했습니다.
theological_decisions:
- issue: φιλέω와 ἀγαπάω의 차이를 번역에서 어떻게 처리할지
  chosen_reading: 본문에서는 두 동사를 모두 ‘사랑하다’로 옮기고, 그 차이를 결정적 의미로 못 박지 않았습니다.
  alternative_readings:
  - ‘사랑하느냐’와 ‘마음에 두느냐’처럼 다르게 구분하기
  - 동사의 교체 자체를 번역으로 강조하기
  rationale: 헬라어의 어휘 대비는 해석상 논의가 있지만, 본문 수준에서 안정적으로 확정하기 어렵습니다. 그래서 POB의 취지대로 긴장을 보존하되 과잉 해석은 피했습니다.
  doctrine_reference: Translation philosophy §3; §5
