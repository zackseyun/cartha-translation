  source_fidelity: 수정이 필요합니다. 초안의 ‘말씀하시는 것을 보고’는 ὅτι εἶπεν αὐτῷ(그가 그에게 말했기 때문에)를 ‘보고’로 바꾸어 원문의 인과관계와 의미를 벗어납니다. 또한 대명사의 반복으로 화자가 다소 불분명합니다. ‘세 번째로’와 φιλέω, 두 ‘알다’ 동사의 반복, 그리고 βόσκε/πρόβατα의 ‘먹이다/양들’은 적절히 반영되어 있습니다.
  naturalness: ‘마음이 아파졌습니다’도 이해되지만 이 문맥의 ἐλυπήθη에는 ‘슬퍼했습니다’가 더 자연스럽고 직접적입니다. 예수님과 베드로를 명시하고, 베드로의 발화에는 ‘제가’를 사용하면 현대 표준어 합쇼체의 높임과 지시 관계가 더 분명해집니다.
  terminology: ‘요한의 아들아’, ‘사랑하느냐’, ‘주님’, ‘모든 것을 아십니다’, ‘내 양들을 먹이십시오’는 원문 및 영어 POB의 어휘 결정을 충실히 따릅니다. φιλέω와 ἀγαπάω의 차이 및 οἶδα와 γινώσκω의 차이는 본문에서 과도하게 구별하지 않고 주석으로 보존하는 것이 타당합니다.
