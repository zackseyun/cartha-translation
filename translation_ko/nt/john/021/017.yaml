revisions:
- from: 그가 세 번째로 그에게 말씀하셨습니다. 「시몬, 요한의 아들아, 네가 나를 사랑하느냐?」 베드로는 그가 세 번째로 「네가 나를 사랑하느냐?」라고 말씀하시는 것을 보고 마음이 아파졌습니다. 그는 그에게 대답했습니다. 「주님, 주님께서는 모든 것을 아십니다. 주님께서 내가 주님을 사랑하는 것을 아십니다.」 예수께서 그에게 말씀하셨습니다. 「내 양들을 먹이십시오.」[a][b]
