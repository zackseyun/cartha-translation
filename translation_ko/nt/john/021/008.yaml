  - severity: medium
    issue: ‘물고기 그물’
    rationale: 이 표현은 한국어에서 보통 물고기를 잡는 도구로서의 그물을 뜻합니다. 본문의 속격은 문맥상 그물 안의 물고기와의 관계를 나타내므로 ‘물고기가 든 그물’이 더 정확합니다.
  - severity: medium
    issue: 각주 b와 c의 표현 및 표지 위치
    rationale: 각주 b의 ‘그물이 가득 찬 물고기들’은 문법적·의미적으로 부정확하고, 각주 c는 본문의 ‘육지’와 대안 ‘해안’의 관계를 반대로 서술합니다. 각주는 해당 어구 바로 뒤에 배치하는 것이 명확합니다.
