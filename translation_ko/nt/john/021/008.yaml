id: JHN.21.8
reference: John 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
  footnotes:
  - marker: a
    text: About two hundred cubits is roughly 300 feet or 90 meters.
    reason: cultural_note
  - marker: b
    text: Or 'the net of fish.' The Greek expression may be rendered more literally, but here it likely means the net containing the fish.
    reason: lexical_alternative
  - marker: c
    text: Or 'shore' for 'land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 다른 제자들은 작은 배를 타고 왔습니다. 그들은 육지에서 멀지 않았는데, 겨우 약 이백 규빗쯤 떨어져 있었습니다. 그들은 물고기 그물을 끌고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이백 규빗은 대략 90미터, 또는 300피트 정도입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그물이 가득 찬 물고기들’로 볼 수도 있습니다. 헬라어 표현은 더 문자적으로 옮길 수 있지만, 여기서는 물고기를 담고 있는 그물을 가리키는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘해안’이 아니라 ‘육지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  english_pob_choice: But the other disciples
  chosen_korean: 그런데 다른 제자들은
  alternatives_korean:
  - 그리고 다른 제자들은
  - 그런데 나머지 제자들은
  lexicon: BDAG
  rationale: δέ의 대조·전환 기능을 살려 문맥상 자연스러운 ‘그런데’로 옮겼고, ἄλλοι μαθηταί는 직역에 가까운 ‘다른 제자들’이 가장 무난합니다.
- source_word: τῷ πλοιαρίῳ
  english_pob_choice: in the small boat
  chosen_korean: 작은 배를 타고
  alternatives_korean:
  - 작은 배 안에서
  - 배를 타고
  lexicon: BDAG
  rationale: πλοιάριον의 축소형 뉘앙스를 살리면서 한국어로 자연스럽게 읽히도록 ‘작은 배’로 옮겼습니다.
- source_word: ἀπὸ πηχῶν διακοσίων
  english_pob_choice: about two hundred cubits away
  chosen_korean: 겨우 약 이백 규빗쯤 떨어져 있었습니다
  alternatives_korean:
  - 약 이백 규빗쯤 떨어져 있었습니다
  - 두 백 규빗쯤 떨어져 있었습니다
  lexicon: BDAG
  rationale: πηχῶν은 고대 길이 단위인 ‘규빗’을 유지했고, ὡς의 추정성을 ‘약’으로, 거리 감각을 살리기 위해 ‘떨어져 있었습니다’로 옮겼습니다.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  english_pob_choice: the net of fish
  chosen_korean: 물고기 그물을
  alternatives_korean:
  - 물고기들을 담은 그물을
  - 물고기 그물
  lexicon: BDAG
  rationale: POB의 결정에 맞추어 목적격적 구조를 유지하면서도, 한국어에서는 ‘물고기 그물’이 자연스러워 생략 없이 옮겼습니다.
theological_decisions:
- issue: τῷ πλοιαρίῳ의 축소형과 서사적 색채
  chosen_reading: ‘작은 배’로 번역해 단순히 ‘배’로 평평하게 만들지 않았습니다.
  alternative_readings:
  - 단순히 ‘배’로 옮김
  - ‘조그만 배’로 옮김
  rationale: 본문의 축소형은 장면의 구체성과 소박한 현장감을 더하므로, 그 뉘앙스를 보존하는 것이 좋습니다.
  doctrine_reference: 본문의 서사적 세부를 보존하는 번역 원칙
