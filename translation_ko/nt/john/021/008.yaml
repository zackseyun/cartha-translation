revisions:
- from: 그런데 다른 제자들은 작은 배를 타고 왔습니다. 그들은 육지에서 멀지 않았는데, 겨우 약 이백 규빗쯤 떨어져 있었습니다. 그들은 물고기 그물을 끌고 있었습니다.[a][b][c]
  to: 그런데 다른 제자들은 작은 배를 타고 왔습니다. 그들은 육지[b]에서 멀지 않은, 약 이백 규빗쯤 떨어진 곳에서 물고기가 든 그물[c]을 끌고 왔습니다.[a]
  rationale: 원문은 다른 제자들이 작은 배로, 육지에서 약 이백 규빗 떨어진 곳으로부터 물고기와 관련된 그물을 끌며 왔다는 하나의 서술입니다. 불필요한 ‘겨우’를 제거하고, 속격 표현의 문맥상 의미를 자연스러운 한국어로 옮겼으며, 각주의 내용과 표지 위치를 바로잡았습니다.
