theological_decisions:
- issue: 부활 표현의 주어·태 유지
  chosen_reading: ‘일으켜지신 뒤에’로 수동태를 유지해, 예수의 부활이 하나님에 의해 일으켜진 사건임을 드러냈습니다.
  alternative_readings:
  - ‘다시 살아나신 뒤에’
  - ‘죽은 자들 가운데서 살아나신 뒤에’
  rationale: 원문 분사 ἐγερθεὶς는 수동형이므로, 능동적 표현으로 바꾸지 않고 수동의 구조를 보존했습니다.
  doctrine_reference: 부활론; 번역 원칙 §1, §3
