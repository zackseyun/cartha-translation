  - 이 사건은
  lexicon: BDAG
  rationale: 앞에 나온 나타나심의 사건을 가리키는 지시어이므로, 단순하고 자연스러운 ‘이것은’으로 아나포라를 살렸습니다.
- source_word: ἤδη τρίτον
  english_pob_choice: now the third time
  chosen_korean: 이제 … 세 번째로
  alternatives_korean:
