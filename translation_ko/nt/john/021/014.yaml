  lexicon: BDAG
  rationale: ἤδη와 τρίτον의 누적된 횟수 감각을 한국어에서 자연스럽게 전달하기 위해 ‘이제 … 세 번째로’로 옮겼습니다.
- source_word: ἐφανερώθη
  english_pob_choice: was revealed
  chosen_korean: 드러나신
  alternatives_korean:
  - 나타나신
  - 계시되신
  - 보이신
  lexicon: BDAG
  rationale: 수동형 φανερόω의 의미를 살리면서 요한복음 특유의 ‘드러남’ 뉘앙스를 보존하기 위해 ‘드러나신’으로 옮겼습니다.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  english_pob_choice: after he had been raised from the dead
  chosen_korean: 죽은 사람들 가운데서 일으켜지신 뒤에
  alternatives_korean:
  - 죽은 자들 가운데서 일으켜지신 뒤에
  - 죽은 사람들 가운데서 일으켜지신 후에
  - 죽은 자들 가운데서 다시 살아나신 뒤에
  lexicon: BDAG
  rationale: 분사 ἐγερθεὶς의 수동형을 유지하고 ἐκ νεκρῶν의 관용구를 직역에 가깝게 반영하기 위해 ‘죽은 사람들 가운데서 일으켜지신 뒤에’로 옮겼습니다.
theological_decisions:
- issue: 부활 표현의 주어·태 유지
  chosen_reading: ‘일으켜지신 뒤에’로 수동태를 유지해, 예수의 부활이 하나님에 의해 일으켜진 사건임을 드러냈습니다.
  alternative_readings:
  - ‘다시 살아나신 뒤에’
  - ‘죽은 자들 가운데서 살아나신 뒤에’
  rationale: 원문 분사 ἐγερθεὶς는 수동형이므로, 능동적 표현으로 바꾸지 않고 수동의 구조를 보존했습니다.
  doctrine_reference: 부활론; 번역 원칙 §1, §3
