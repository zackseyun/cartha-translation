source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
  footnotes:
  - marker: a
    text: Or “have breakfast.” The Greek verb refers specifically to the morning meal.
    reason: lexical_alternative
  - marker: b
    text: The verb translated “ask” can also carry the sense “question” or “examine closely.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “와서 아침을 드십시오.[a]” 그러나 제자들 중 아무도 그분께 “당신은 누구십니까?” 하고 묻지[b] 못했습니다. 그분이 주님이심을 알고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아침 식사를 하십시오.” 여기서 그리스어 동사는 특별히 아침 식사를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘묻다’로 옮긴 동사는 문맥에 따라 “질문하다”나 “자세히 살피다”의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  english_pob_choice: Come
  chosen_korean: 오너라
  alternatives_korean:
  - 와라
  - 이리 오너라
  lexicon: BDAG
  rationale: 초대의 뉘앙스를 살리되, 현대 한국어에서 직접적이고 자연스러운 명령형으로 옮겼습니다.
- source_word: ἀριστήσατε
  english_pob_choice: eat breakfast
  chosen_korean: 아침을 먹어라
  alternatives_korean:
  - 아침밥을 먹어라
  - 아침식사를 하십시오
  lexicon: BDAG
  rationale: 동사가 가리키는 아침 식사라는 시간성을 살리면서도, 한국어에서는 ‘아침을 먹다’가 가장 자연스럽습니다.
- source_word: ἐξετάσαι
  english_pob_choice: to ask
  chosen_korean: 묻기를
  alternatives_korean:
  - 질문하기를
  - 따져 묻기를
  lexicon: BDAG
  rationale: 문맥상 예수께 직접 질문하는 뜻이므로 기본값은 ‘묻다’로 두되, 동사의 더 강한 ‘살피다/캐묻다’ 뉘앙스는 대안으로 남겼습니다.
- source_word: ὁ κύριός ἐστιν
  english_pob_choice: it was the Lord
  chosen_korean: 그분이 주님이심을
  alternatives_korean:
  - 그분이 주님이신 것을
  - 주님이심을
  lexicon: BDAG
  rationale: κύριος의 예수 지시 용례를 따라 ‘주님’으로 옮겼고, ‘-이심을’ 구조로 문장 전체의 인지 내용을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 부활 서사에서 κύριος의 호칭 처리
  chosen_reading: ‘주님’으로 번역해 부활하신 예수를 인식하는 서술의 무게를 살렸습니다.
  alternative_readings:
  - 주
  - 주인
  - 선생님
  rationale: 이 문맥의 κύριος는 단순한 예의 호칭보다 부활하신 예수에 대한 인식 표지이므로, POB 기본값에 따라 ‘주님’을 유지하는 것이 가장 적합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
