id: JHN.21.20
reference: John 21:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
  footnotes:
  - marker: a
    text: Or “following” or “following him”; the Greek participle does not state the object explicitly.
    reason: lexical_alternative
  - marker: b
    text: Or “reclined … on his breast.” The Greek reflects the posture of reclining at a meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 베드로가 돌아서서 예수님께서 사랑하신 제자가 따라오는 것을 보았는데, 그는 저녁 식사 자리에서 예수님의 가슴에 기대어 "주님, 당신을 넘겨줄 사람이 누구입니까?" 하고 말했던 그 제자였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  english_pob_choice: turned
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아보며
  - 몸을 돌려
  lexicon: BDAG
  rationale: 아오리스트 분사로서 베드로의 동작을 선행 설명하므로, 한국어에서는 자연스러운 연결 동사구 ‘돌아서서’로 사건 순서를 살렸습니다.
- source_word: μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς
  english_pob_choice: the disciple whom Jesus loved
  chosen_korean: 예수님께서 사랑하신 제자
  alternatives_korean:
  - 예수님이 사랑하셨던 제자
  - 예수님이 사랑하던 제자
  lexicon: BDAG
  rationale: 요한복음의 고유한 칭호를 직역에 가깝게 유지하되, 현대 한국어에서 자연스럽고 존중을 담는 ‘사랑하신’으로 옮겼습니다.
- source_word: ἀκολουθοῦντα
  english_pob_choice: following
  chosen_korean: 따라오는
  alternatives_korean:
  - 뒤따르는
  - 따라가는
  lexicon: BDAG
  rationale: 그리스어 분사는 대상이 명시되지 않으므로 한국어도 목적어를 덧붙이지 않고, 장면상 자연한 현재 진행적 표현으로 처리했습니다.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  english_pob_choice: against his chest
  chosen_korean: 예수님의 가슴에 기대어
  alternatives_korean:
  - 예수님의 가슴에
  - 예수님의 품에
  lexicon: BDAG
  rationale: στῆθος는 신체 부위의 밀착을 가리키며, 식사 자리의 자세를 살리기 위해 ‘기대어’로 동작성을 드러냈습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 대한 직접 호칭으로서 POB의 기본 원칙에 따라 ‘주님’을 사용해 존칭과 신학적 무게를 유지했습니다.
- source_word: ὁ παραδιδούς σε
  english_pob_choice: the one betraying you
  chosen_korean: 당신을 넘겨줄 사람
  alternatives_korean:
  - 당신을 배반할 사람
  - 당신을 팔 사람
  lexicon: BDAG
  rationale: παραδίδωμι는 수난 문맥에서 ‘넘겨주다/넘기다’의 의미가 핵심이므로, ‘배반하다’로만 좁히지 않고 ‘넘겨줄’로 옮겨 인계와 배신의 긴장을 함께 살렸습니다.
theological_decisions:
- issue: 직접 화법의 존칭 처리
  chosen_reading: 예수님께 대한 호칭을 ‘주님’으로 유지하고, 인용문 안의 말은 평서적 한국어 질문으로 자연화했습니다.
  alternative_readings:
  - 주
  - 선생님
  - 주여
  rationale: 본문은 제자의 경외 어린 직접 발화를 담지만, 한국어 합쇼체 문맥에서는 ‘주님’이 가장 자연스럽고 경건한 대응입니다.
  doctrine_reference: John 21:20의 κύριος 호칭 관행
- issue: ‘넘겨줄’의 배신-인도 양면성 보존
  chosen_reading: ‘배반할’보다 ‘넘겨줄’로 옮겨, 수난 서사에서의 법적/서사적 ‘전달’과 배신 의미를 함께 남겼습니다.
  alternative_readings:
  - 배반할
  - 팔 사람
  rationale: 본문의 παραδιδούς는 단순 감정적 배신어보다, 예수를 권세자들에게 넘기는 행위를 지시하는 수난 용어이므로 그 긴장을 보존해야 합니다.
  doctrine_reference: 수난 서사 어휘(παραδίδωμι)
