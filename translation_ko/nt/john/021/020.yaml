revisions:
- from: 베드로가 돌아서서 예수님께서 사랑하신 제자가 따라오는 것을 보았는데, 그는 저녁 식사 자리에서 예수님의 가슴에 기대어 "주님, 당신을 넘겨줄 사람이 누구입니까?" 하고 말했던 그 제자였습니다.
  to: 베드로가 돌아서서, 예수님께서 사랑하신 제자, 곧 저녁 식사 때 예수님의 가슴에 기대어 앉아 “주님, 주님을 넘겨줄 사람이 누구입니까?” 하고 말했던 제자가 따라오는 것을 보았습니다.
  rationale: 두 관계절이 동일한 제자를 가리키는 원문의 구조를 한국어 동격 구성으로 명료하게 반영했습니다. ἀκολουθοῦντα의 목적어는 원문에 명시되지 않았으므로 보충하지 않았고, παραδιδούς의 ‘넘겨주다’도 유지했습니다.
