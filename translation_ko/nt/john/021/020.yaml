review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 두 번째 관계절(‘그는 또한 식사 때 … 말했던 사람이다’)은 앞의 ‘예수님께서 사랑하신 제자’를 수식·동격으로 더 직접 연결하는 편이 정확합니다. ‘넘겨줄’은 παραδιδούς의 인도/배반의 함의를 무리 없이 보존합니다.
  naturalness: 초안의 ‘그는 … 말했던 그 제자였습니다’는 지시어와 서술어가 중복되어 다소 부자연스럽고, ‘당신을’은 한국어에서 예수님께 드리는 직접 호칭으로 자연스럽지 않습니다. 동격 수식으로 재구성하고 ‘주님을’로 바꾸면 현대 합쇼체 문체에 더 자연스럽습니다.
  terminology: ‘예수님’, ‘제자’, ‘주님’은 일관되고 적절합니다. στῆθος는 ‘가슴’으로 옮길 수 있으며, 식사 맥락의 ἀνέπεσεν을 ‘기대어 앉아’로 표현하여 기대어 누운 식사 자세를 드러냈습니다.
  issues:
  - severity: medium
    issue: ‘그는 … 말했던 그 제자였습니다’라는 반복적 서술
    rationale: 원문의 관계절은 제자를 추가로 식별하는 수식절입니다. 초안의 독립 서술은 의미는 전달하지만 한국어 문장으로 부자연스럽고 지시 대상이 잠시 흐려집니다.
  - severity: low
    issue: 직접 화법의 ‘당신을’
    rationale: 현대 한국어의 경건하고 자연스러운 직접 호칭에서는 ‘주님을’이 더 적절합니다. 원문의 2인칭 목적어 의미도 그대로 유지됩니다.
  revised_text: 베드로가 돌아서서, 예수님께서 사랑하신 제자, 곧 저녁 식사 때 예수님의 가슴에 기대어 앉아 “주님, 주님을 넘겨줄 사람이 누구입니까?” 하고 말했던 제자가 따라오는 것을 보았습니다.
