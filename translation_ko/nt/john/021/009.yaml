id: JHN.21.9
reference: John 21:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
  footnotes:
  - marker: a
    text: Or 'they came ashore.' The Greek more literally says 'they got out onto the land.'
    reason: lexical_alternative
  - marker: b
    text: '''Charcoal fire'' translates a term also used in John 18:18, linking this scene verbally with Peter''s earlier denial setting.'
    reason: cross_reference
translation:
  language: ko
  text: 그들이 땅에 올라오자 숯불이 놓여 있는 것과 그 위에 생선과 빵이 있는 것을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅에 올라오자’는 그리스어의 ‘땅으로/땅에 올라가다’라는 비교적 직역적 이미지를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숯불’은 요한복음 18:18에도 쓰이는 같은 어휘로, 베드로의 이전 부인 장면과 언어적으로 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέβησαν εἰς τὴν γῆν
  english_pob_choice: they got out onto the land
  chosen_korean: 땅에 올라오자
  alternatives_korean:
  - 땅으로 내려가자
  - 상륙하자
  - 뭍에 오르자
  lexicon: BDAG
  rationale: 배에서 뭍으로 나오는 동작을 한국어로 자연스럽게 옮기면서도, γῆ를 단순히 ‘해안’으로 좁히지 않고 ‘땅’으로 유지했습니다.
- source_word: ἀνθρακιὰν κειμένην
  english_pob_choice: a charcoal fire laid there
  chosen_korean: 숯불이 놓여 있는 것
  alternatives_korean:
  - 숯불이 피워져 있는 것
  - 숯불이 놓인 것
  - 숯불더미가 있는 것
  lexicon: BDAG
  rationale: ἀνθρακιὰν은 단순한 불이 아니라 숯불/숯불자리의 의미가 있어 ‘숯불’로 옮겼고, κειμένην의 놓여 있는 상태를 살렸습니다.
- source_word: ὀψάριον ἐπικείμενον
  english_pob_choice: fish lying on it
  chosen_korean: 그 위에 생선이 있는 것
  alternatives_korean:
  - 그 위에 생선이 놓여 있는 것
  - 그 위에 물고기가 놓인 것
  - 그 위에 생선이 얹혀 있는 것
  lexicon: BDAG
  rationale: ὀψάριον은 요한복음에서 음식으로서의 생선을 가리키므로 ‘생선’으로 옮겼고, ἐπικείμενον은 ‘그 위에 있는/놓여 있는’ 관계를 드러냈습니다.
- source_word: ἄρτον
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 빵 한 덩이
  - 빵덩이
  lexicon: BDAG
  rationale: ἄρτος의 기본 의미를 한국어 현대어에서 가장 자연스럽게 전달하는 표현으로 ‘빵’을 택했습니다.
theological_decisions:
- issue: 장면의 상호본문적 연결(요 18:18의 숯불)
  chosen_reading: 본문에는 반영하지 않고, 같은 어휘의 반복만 그대로 드러냈습니다.
  alternative_readings:
  - ‘숯불’ 대신 일반적인 ‘불’로 완화하기
  - 주석으로 연결을 본문에 덧붙이기
  rationale: 이 절의 숯불은 베드로의 이전 부인 장면과 언어적으로 연결되지만, 본문 자체는 그 연상을 암시할 뿐 설명하지 않으므로 번역문은 과잉해석 없이 유지했습니다.
  doctrine_reference: 상호본문성은 본문이 암시하는 범위에서만 드러내야 함
- issue: 역사적 현재 βλέπουσιν의 처리
  chosen_reading: ‘보았습니다’로 자연스러운 서술 과거를 사용했습니다.
  alternative_readings:
  - ‘봅니다’로 현재형을 유지하기
  - ‘보게 됩니다’로 사건 진행을 강조하기
  rationale: 서사적 현재는 한국어에서 보통 과거로 옮겨 읽기 흐름을 살리는 것이 자연스럽고, 사건 순서를 명확하게 전달합니다.
  doctrine_reference: optimal equivalence
