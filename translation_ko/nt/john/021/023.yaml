id: JHN.21.23
reference: John 21:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
  footnotes:
  - marker: a
    text: Or “this saying spread among the brothers.” The Greek λόγος can mean “word,” “statement,” or “report.”
    reason: lexical_alternative
  - marker: b
    text: “Brothers” here refers to the community of disciples; the Greek uses the masculine plural ἀδελφοί.
    reason: cultural_note
  - marker: c
    text: 'That is, Jesus did not promise that this disciple would never die; he stated a hypothetical condition: “If I want him to remain until I come …”'
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 그 제자가 죽지 않을 것이라는 이 말[a]이 형제들[b] 사이에 퍼졌습니다. 그러나 예수님께서는 그에게 그가 죽지 않을 것이라고 말씀하신 것이 아니라, “내가 그가 내가 올 때까지 머물러 있기를 원한다면[c], 그것이 너에게 무슨 상관이냐?”라고 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 제자가 죽지 않을 것이라는 이 말이 형제들 사이에 퍼졌다.” 헬라어 λόγος는 “말”, “진술”, “소식”을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 “형제들”은 제자 공동체를 가리키며, 헬라어는 남성 복수 ἀδελφοί를 사용합니다.
    reason: cultural_note
  - marker: c
    text: 즉, 예수님은 이 제자가 죽지 않을 것이라고 약속하신 것이 아니라, “내가 그가 내가 올 때까지 머물러 있기를 원한다면 …”이라는 가정적 말씀을 하신 것입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς τοὺς ἀδελφοὺς
  english_pob_choice: spread among the brothers
  chosen_korean: 형제들 사이에 퍼졌는데
  alternatives_korean:
  - 형제들에게 전해졌는데
  - 형제들 가운데 퍼졌는데
  lexicon: BDAG
  rationale: ἐξῆλθεν은 여기서 소식의 확산을 가리키므로 ‘퍼졌는데’가 자연스럽고, εἰς τοὺς ἀδελφοὺς는 공동체 내부로의 전파를 살려 ‘형제들 사이에’로 옮겼습니다.
- source_word: οὗτος ὁ λόγος
  english_pob_choice: this report
  chosen_korean: 이 말
  alternatives_korean:
  - 이 소식
  - 이 이야기
  - 이 보고
  lexicon: BDAG
  rationale: λόγος는 여기서 신학적 ‘말씀’이 아니라 유통된 진술을 가리키므로, 한국어에서는 과도하게 공식적이지 않은 ‘이 말’로 옮겨 소문/진술의 성격을 살렸습니다.
- source_word: ὁ μαθητὴς ἐκεῖνος
  english_pob_choice: that disciple
  chosen_korean: 그 제자
  alternatives_korean:
  - 그 사람
  - 그 제자 그 사람
  lexicon: BDAG
  rationale: 요한복음의 지시적 표현을 따라 특정 인물을 가리키는 ‘그 제자’로 옮겼습니다.
- source_word: οὐκ ἀποθνῄσκει
  english_pob_choice: would not die
  chosen_korean: 죽지 않을 것이라고
  alternatives_korean:
  - 죽지 않는다고
  - 죽지 않는다고 했습니다
  lexicon: BDAG
  rationale: 간접화법의 미래적 의미를 한국어로 자연스럽게 반영해 ‘죽지 않을 것이라고’로 옮겼습니다.
- source_word: τί πρὸς σέ
  english_pob_choice: what is that to you?
  chosen_korean: 그것이 너에게 무슨 상관이냐?
  alternatives_korean:
  - 그게 너와 무슨 관계냐?
  - 그게 네게 무슨 일이냐?
  lexicon: BDAG
  rationale: 이 관용구는 베드로의 관심사를 끊어 내는 말이므로, 직설적인 한국어 관용 표현인 ‘무슨 상관이냐?’를 택했습니다.
theological_decisions:
- issue: 예수님의 발언이 ‘죽지 않음’의 약속처럼 오해되지 않도록 하는 방식
  chosen_reading: 두 번째 절을 ‘예수님은 … 말씀하신 것이 아니라’로 분명히 번역해, 앞의 유통된 말과 예수님의 실제 발언을 구분했습니다.
  alternative_readings:
  - 더 문자적으로 ‘그에게 죽지 않을 것이라고 말씀하지 않으셨습니다’
  - 오해를 덜 드러내는 단순 직역
  rationale: 본문 자체가 오해를 바로잡고 있으므로, 한국어에서도 소문/해설의 구분이 분명히 드러나도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 본문 내부의 해명 구조 보존
