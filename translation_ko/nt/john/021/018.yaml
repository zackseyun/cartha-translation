id: JHN.21.18
reference: John 21:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
  footnotes:
  - marker: a
    text: Or 'gird yourself' / 'another will gird you.' The Greek verb refers literally to fastening or binding on clothing; here it contrasts Peter's former independence with later dependence.
    reason: lexical_alternative
  - marker: b
    text: '''Stretch out your hands'' is often understood as alluding to Peter''s death by crucifixion; the next verse explains that Jesus said this to indicate the kind of death by which Peter would glorify God.'
    reason: cross_reference
  - marker: c
    text: Or 'lead you' / 'take you.' The Greek can denote being borne or taken along to an unwanted destination.
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로, 진실로 내가 당신에게 말합니다. 당신이 젊을 때에는 스스로 띠를 띠고 원하는 곳으로 걸어 다녔지만, 늙으면 당신은 손을 뻗을 것이고, 다른 사람이 당신에게 띠를 띠워 원하지 않는 곳으로 데려갈 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘띠를 띠다’는 문자적으로는 옷을 동여매는 동작을 가리키며, 여기서는 이전의 자율성과 이후의 의존성을 대비합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손을 뻗다’는 흔히 베드로의 죽음, 곧 십자가형을 가리키는 말로 이해됩니다. 다음 절이 예수께서 이 말씀으로 베드로가 어떤 죽음으로 하나님께 영광을 돌릴지를 나타내신 것이라고 설명합니다.
    reason: cross_reference
  - marker: c
    text: ‘데려가다’ 또는 ‘인도하다’로도 옮길 수 있습니다. 헬라어는 원치 않는 목적지로 끌려가는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로, 진실로
  alternatives_korean:
  - 아멘, 아멘
  - 참으로, 참으로
  lexicon: BDAG
  rationale: 요한복음의 엄중한 강조 형식을 자연스러운 현대 한국어로 옮기되, 반복된 확언의 힘을 보존했습니다.
- source_word: ἐζώννυες σεαυτόν / ἄλλος σε ζώσει
  english_pob_choice: you used to dress yourself / another will dress you
  chosen_korean: 스스로 띠를 띠고 / 다른 사람이 당신에게 띠를 띠워
  alternatives_korean:
  - 스스로 띠를 매고 / 다른 사람이 당신을 띠로 매어
  - 스스로 차려입고 / 다른 사람이 당신을 입혀
  lexicon: BDAG
  rationale: ζώννυμι의 문자적 ‘띠를 띠다’ 이미지를 살려 앞뒤 대조를 유지했습니다. POB 영어의 ‘dress’는 현대적 풀어쓰기이지만, 한국어에서는 본래 동작을 드러내는 표현이 더 분명합니다.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  english_pob_choice: you will stretch out your hands
  chosen_korean: 손을 뻗을 것이고
  alternatives_korean:
  - 두 손을 펼칠 것이고
  - 손을 내밀 것이고
  lexicon: BDAG
  rationale: 본문의 이미지를 문자적으로 유지해 다음 절의 설명이 자연스럽게 이어지도록 했습니다. 십자가형을 본문 안에 미리 풀지 않았습니다.
- source_word: οἴσει ὅπου οὐ θέλεις
  english_pob_choice: carry you where you do not want to go
  chosen_korean: 원하지 않는 곳으로 데려갈 것입니다
  alternatives_korean:
  - 원하지 않는 곳으로 끌고 갈 것입니다
  - 가고 싶지 않은 곳으로 데려갈 것입니다
  lexicon: BDAG
  rationale: οἴσει는 ‘데려가다/운반하다’의 강제성을 포함할 수 있어, 한국어에서는 이동의 결과를 자연스럽게 드러내는 ‘데려갈 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘손을 뻗다’와 ‘띠를 띠우다’를 십자가 예언으로 본문에 직접 명시할지 여부
  chosen_reading: 본문은 상징적·문자적 표현을 유지하고, 십자가 해석은 다음 절의 설명에 맡겼습니다.
  alternative_readings:
  - ‘십자가에 못 박힘’을 암시하도록 본문을 해석적으로 풀어 쓰는 방식
  - 죽음의 방식까지 본문에 직접 반영하는 방식
  rationale: 예수의 말씀 자체는 이미지로 말하고, 곧이어 서술자가 그 의미를 설명합니다. 따라서 본문에서 해석을 앞당기지 않고 긴장을 보존하는 편이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
