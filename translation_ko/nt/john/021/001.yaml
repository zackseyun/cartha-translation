  text: 이 일들이 있은 뒤에 예수께서 디베랴 바닷가에서 제자들에게 다시 자신을 나타내셨습니다[a]. 그분은 이렇게 자신을 나타내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
