  source_fidelity: 첫 절의 자기 현현과 ‘다시’ 및 제자들에게라는 수혜 대상은 대체로 충실합니다. 그러나 마지막 절의 οὕτως는 뒤따르는 사건을 소개하는 방식 표현인데, 초안의 ‘그분이 나타내신 모습은 이러했습니다’는 예수께서 어떤 ‘모습’을 제시하셨다는 뜻으로 바꾸어 버립니다. 또한 τῆς θαλάσσης라는 명칭을 일반명사 ‘호수’로 바꾸기보다 본문의 ‘디베랴 바다’를 보존하는 편이 안전합니다.
