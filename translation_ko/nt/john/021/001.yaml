  - ‘보이셨습니다’로 번역
  rationale: 본문의 φανερόω는 단순 시각적 출현보다 자신을 드러내는 의미가 강하므로, 부활 현현의 실재성과 계시성을 함께 보존하는 번역을 택했습니다.
