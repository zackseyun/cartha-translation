id: JHN.21.1
reference: John 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
  footnotes:
  - marker: a
    text: Or 'appeared'; the Greek verb can denote making oneself visible or known.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들 뒤에 예수께서 디베랴 호숫가에서 제자들에게 다시 자신을 나타내셨습니다. 그리고 그분이 나타내신 모습은 이러했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 이 일들 뒤에
  alternatives_korean:
  - 이후에
  - 이 일 후에
  lexicon: BDAG
  rationale: 복수 지시어 ταῦτα를 살려 단순한 시간표현보다 사건들의 연속을 드러내는 표현으로 옮겼습니다.
- source_word: ἐφανέρωσεν ἑαυτὸν
  english_pob_choice: revealed himself
  chosen_korean: 자신을 나타내셨습니다
  alternatives_korean:
  - 자신을 드러내셨습니다
  - 나타나셨습니다
  lexicon: BDAG
  rationale: φανερόω의 ‘보이게 하다/드러내다’와 반사대명사의 자기현시를 살려, 단순한 ‘출현’보다 자기 계시의 뉘앙스를 보존했습니다.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  english_pob_choice: by the Sea of Tiberias
  chosen_korean: 디베랴 호숫가에서
  alternatives_korean:
  - 디베랴 바닷가에서
  - 디베랴 바다 곁에서
  lexicon: BDAG
  rationale: ἐπί + 속격의 위치 관계를 자연스럽게 반영하면서, 요한복음의 지명을 한국어 독자에게 익숙한 ‘호수’로 옮기되 본문 고유명칭인 디베랴는 유지했습니다.
- source_word: ἐφανέρωσεν δὲ οὕτως
  english_pob_choice: and he revealed himself in this way
  chosen_korean: 그리고 그분이 나타내신 모습은 이러했습니다
  alternatives_korean:
  - 그리고 그분은 이렇게 자신을 나타내셨습니다
  - 그리고 그렇게 자신을 나타내셨습니다
  lexicon: BDAG
  rationale: 뒤이어 전개될 사건 서두의 기능을 살려 ‘이러했습니다’로 연결했고, 반복 동사 ἐφανέρωσεν의 문학적 응집을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 부활하신 예수의 현현 표현
  chosen_reading: ‘자신을 나타내셨습니다’로 옮겨 실제 만남과 자기 계시를 함께 드러냈습니다.
  alternative_readings:
  - ‘나타나셨습니다’로 단순화
  - ‘보이셨습니다’로 번역
  rationale: 본문의 φανερόω는 단순 시각적 출현보다 자신을 드러내는 의미가 강하므로, 부활 현현의 실재성과 계시성을 함께 보존하는 번역을 택했습니다.
  doctrine_reference: 부활 현현과 계시의 언어
