    text: 또는 ‘나타나셨습니다’. 그리스어 동사는 자신을 보이게 하거나 알리다는 뜻을 나타낼 수 있습니다.
    reason: φανερόω의 ‘자신을 나타내셨습니다’에는 ‘나타나셨습니다’ 및 ‘자신을 알리셨습니다’라는 의미 범위가 있어, 영어 POB의 어휘 대안 주석을 한국어로 반영합니다.
