source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
  footnotes:
  - marker: a
    text: Or simply, “and you will find”; the object (“fish” or “some”) is implied by the fishing context rather than stated explicitly in Greek.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말씀하셨습니다. 「그물을 배 오른편에 던지십시오. 그러면 잡을 것입니다。」 그들이 던졌더니, 물고기가 너무 많아서 더는 끌어올릴 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 동사의 목적어를 분명히 밝히지 않으므로, 문맥상 ‘물고기’가 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  english_pob_choice: Cast
  chosen_korean: 던지십시오
  alternatives_korean:
  - 던지십시오
  - 내리십시오
  - 던져 보십시오
  lexicon: BDAG
  rationale: 어업 장면에서 그물을 ‘cast’하는 동작을 자연스럽게 살리기 위해 ‘던지십시오’로 옮겼습니다. ‘내리십시오’는 방향은 맞지만 동작감이 약합니다.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  english_pob_choice: the right side of the boat
  chosen_korean: 배 오른편
  alternatives_korean:
  - 배의 오른쪽
  - 배 오른편
  - 배의 우현
  lexicon: BDAG
  rationale: μέρη는 문자적으로 ‘부분들’이지만 여기서는 배의 한쪽 면을 가리키므로 ‘오른편’이 가장 자연스럽고 간결합니다. ‘우현’은 항해 용어라 현대 독자에게 불필요하게 전문적입니다.
- source_word: εὑρήσετε
  english_pob_choice: you will find some
  chosen_korean: 잡을 것입니다
  alternatives_korean:
  - 찾을 것입니다
  - 무엇인가를 찾을 것입니다
  - 물고기를 잡을 것입니다
  lexicon: BDAG
  rationale: 이 동사는 직역하면 ‘찾다’이지만, 문맥상 제자들이 실제로 얻게 될 것은 물고기이므로 한국어에서는 의미를 드러내는 ‘잡을 것입니다’가 더 분명합니다. 다만 원문의 암시를 반영해 과도한 설명은 피했습니다.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  english_pob_choice: because of the multitude of fish
  chosen_korean: 물고기가 너무 많아서
  alternatives_korean:
  - 물고기의 무리 때문에
  - 물고기가 많아서
  - 물고기 떼 때문에
  lexicon: BDAG
  rationale: πλήθος는 ‘무리, 다수’의 의미이므로 원문의 원인을 한국어 관용에 맞게 ‘너무 많아서’로 풀었습니다. ‘물고기 떼’는 의미는 맞지만 이미지가 다소 구어적입니다.
