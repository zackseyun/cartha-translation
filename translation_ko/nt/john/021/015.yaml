id: JHN.21.15
reference: John 21:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
  footnotes:
  - marker: a
    text: 'Greek has two different verbs here: Jesus asks with ἀγαπάω (''love''), and Peter replies with φιλέω (''love, have affection for''). Many interpreters see a distinction; others take the variation as stylistic. The main text renders both as ''love'' to avoid overstating a contrast the context does not make explicit.'
    reason: lexical_alternative
  - marker: b
    text: '''More than these'' may mean ''more than these men do'' or ''more than these things.'' The Greek leaves the comparison implicit.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 아침 식사를 마친 뒤에, 예수께서 시몬 베드로에게 말씀하셨습니다. “요한의 아들 시몬아, 너는 나를 이들보다 더 사랑하느냐?”[b] 시몬 베드로가 예수께 말했습니다. “예, 주님. 제가 주님을 사랑하는 것을 주님께서 아십니다.”[a] 예수께서 그에게 말씀하셨습니다. “내 어린 양들을 먹이라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에서 예수께서는 ἀγαπάω(‘사랑하다’)를 사용하여 물으시고, 베드로는 φιλέω(‘사랑하다, 애정을 두다’)를 사용하여 대답합니다. 많은 해석자는 두 동사 사이에 의미 차이가 있다고 보지만, 다른 이들은 문체상의 변이로 봅니다. 본문은 문맥이 명시하지 않는 대비를 과도하게 드러내지 않기 위해 둘 다 ‘사랑하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘이들보다 더’는 비교를 완결하지 않아, ‘이 사람들이 나를 사랑하는 것보다 더’라는 뜻일 수도 있고 ‘네가 이들/이것들을 사랑하는 것보다 더’라는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  english_pob_choice: had eaten breakfast
  chosen_korean: 아침 식사를 마쳤을 때
  alternatives_korean:
  - 아침을 먹었을 때
  - 아침 식사를 했을 때
  lexicon: BDAG
  rationale: ἀριστάω는 아침 식사를 하다라는 뜻이므로, 한국어에서는 자연스럽고 구체적인 ‘아침 식사를 마쳤을 때’로 옮겨 시간 관계를 살렸습니다.
- source_word: Σίμων Ἰωάννου
  english_pob_choice: Simon, son of John
  chosen_korean: 요한의 아들 시몬
  alternatives_korean:
  - 시몬, 요한의 아들
  - 요한아들 시몬
  lexicon: BDAG
  rationale: 헬라어 속격은 친자관계를 가리키는 부름말로 자연스럽게 읽히므로, 본문에서는 직역에 가깝게 ‘요한의 아들 시몬’으로 처리했습니다.
- source_word: ἀγαπᾷς / φιλῶ
  english_pob_choice: do you love / I love
  chosen_korean: 사랑하느냐 / 사랑하는
  alternatives_korean:
  - 사랑하느냐 / 친애하느냐
  - 사랑하느냐 / 애정을 가지고 있느냐
  lexicon: BDAG
  rationale: 두 동사의 차이를 본문에서 과도하게 풀지 않도록, 주된 의미는 둘 다 ‘사랑하다’로 두고, 어휘 차이는 본문을 지나치게 해석하지 않는 방향을 택했습니다.
- source_word: Βόσκε τὰ ἀρνία μου
  english_pob_choice: Feed my lambs
  chosen_korean: 내 어린 양들을 먹이라
  alternatives_korean:
  - 내 양들을 먹이라
  - 내 어린 양들을 치라
  lexicon: BDAG
  rationale: βόσκω는 ‘먹이다’가 핵심이므로 ‘치라’보다 직접적인 ‘먹이라’를 택했고, ἀρνία는 ‘어린 양들’로 옮겨 목가적 이미지를 살렸습니다.
theological_decisions:
- issue: ἀγαπάω와 φιλέω의 차이를 한국어 본문에서 어떻게 다룰지
  chosen_reading: 본문에서는 둘 다 ‘사랑하다’로 두고, 두 동사의 차이는 드러내되 해석적으로 단정하지 않았습니다.
  alternative_readings:
  - 첫 번째는 ‘사랑하다’, 두 번째는 ‘친애하다’로 구분
  - 둘 사이에 질적 단계 차이가 있다고 명시
  rationale: 요한복음 21:15의 사랑 동사 차이는 해석 논쟁이 있으므로, 본문을 해석보다 앞서지 않게 하여 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3; contested lexical distinction ἀγαπάω / φιλέω
- issue: πλέον τούτων의 비교 대상
  chosen_reading: ‘이 사람들보다’로 옮겨 비교의 열어 둠을 유지했습니다.
  alternative_readings:
  - ‘이것들보다’
  - ‘이 사람들보다 더 나를 사랑하느냐’
  rationale: 헬라어는 비교 대상을 분명히 지정하지 않으므로, 한국어도 한쪽으로 좁히지 않되 문맥상 자연스러운 ‘이 사람들보다’를 택했습니다.
  doctrine_reference: Translation philosophy §3
