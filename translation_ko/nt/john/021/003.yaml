base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
  footnotes:
  - marker: a
    text: Greek has the historical present ('Simon Peter says to them ... they say to him'), a common narrative feature often rendered in English with past tense.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬 베드로가 그들에게 말했습니다. “나는 물고기 잡으러 갑니다.” 그러자 그들이 그에게 말했습니다. “우리도 함께 가겠습니다.” 그들은 밖으로 나가 배에 올랐고, 그날 밤에는 아무것도 잡지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 역사적 현재(‘시몬 베드로가 그들에게 말하고 … 그들이 그에게 말합니다’)를 사용합니다. 한국어에서는 서술의 자연스러움을 위해 과거형으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει / λέγουσιν
  english_pob_choice: said / said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말합니다
  - 말하였습니다
  lexicon: SBLGNT
  rationale: 그리스어 역사적 현재의 서술 기능은 한국어에서 자연스러운 과거형으로 옮기는 것이 합쇼체 서사에 가장 잘 맞습니다.
- source_word: Ὑπάγω ἁλιεύειν
  english_pob_choice: I am going to fish
  chosen_korean: 나는 물고기 잡으러 갑니다
  alternatives_korean:
  - 나는 낚시하러 갑니다
  - 나는 물고기를 잡으러 가겠습니다
  lexicon: BDAG
  rationale: Ὑπάγω의 ‘가다’와 ἁλιεύειν의 목적을 함께 살려, 모션과 목적이 모두 드러나는 ‘물고기 잡으러 갑니다’로 옮겼습니다.
- source_word: σὺν σοί
  english_pob_choice: with you
  chosen_korean: 당신과 함께
  alternatives_korean:
  - 너와 함께
  - 함께 당신과
  lexicon: BDAG
  rationale: 대상에게 직접 말하는 장면이지만, 한국어 서사에서 예수의 제자들 사이 대화는 존대형 ‘당신’이 가장 무리 없이 읽히며 σύν의 동행 의미를 잘 드러냅니다.
- source_word: ἐπίασαν οὐδέν
  english_pob_choice: they caught nothing
  chosen_korean: 아무것도 잡지 못했습니다
  alternatives_korean:
  - 한 마리도 잡지 못했습니다
  - 아무것도 잡지 않았습니다
  lexicon: BDAG
  rationale: 어획 맥락의 πιάζω를 ‘잡다’로 옮기고, οὐδέν의 전면적 부정을 자연스러운 부정 표현으로 살렸습니다.
theological_decisions:
- issue: 제자들끼리의 직접 호칭에서의 한국어 존대 수준
  chosen_reading: “우리도 당신과 함께 가겠습니다”처럼 상호 대화는 합쇼체로 통일했습니다.
  alternative_readings:
  - “우리도 너와 함께 가겠습니다”
