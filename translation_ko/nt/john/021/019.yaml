id: JHN.21.19
reference: John 21:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: Now he said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
  footnotes:
  - marker: a
    text: Or “by what manner of death.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek uses a historical present: “he says to him.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서는 이것을 말씀하신 것은 그가 어떤 종류의 죽음으로 하나님을 영화롭게 할지를 나타내기 위해서였습니다[a]. 그리고 이렇게 말씀하신 뒤, 그에게 말씀하셨습니다[b]. “나를 따르십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어떤 방식의 죽음으로.”
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 역사적 현재를 사용합니다. “그가 그에게 말씀하십니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  english_pob_choice: to indicate
  chosen_korean: 나타내기 위해서
  alternatives_korean:
  - 알리기 위해
  - 보여 주기 위해
  lexicon: BDAG
  rationale: 분사 σημαίνων은 예수님의 말씀의 목적을 설명하므로, 직접적 예언보다는 간접적으로 ‘드러내다/알리다’는 뉘앙스를 살려 ‘나타내기 위해서’로 옮겼습니다.
- source_word: ποίῳ θανάτῳ
  english_pob_choice: by what kind of death
  chosen_korean: 어떤 종류의 죽음으로
  alternatives_korean:
  - 어떤 죽음으로
  - 어떤 방식의 죽음으로
  lexicon: BDAG
  rationale: ποίῳ가 단순한 ‘무슨 죽음’보다 질적 뉘앙스를 더하므로, 죽음의 유형을 드러내는 표현인 ‘어떤 종류의 죽음으로’를 선택했습니다.
- source_word: δοξάσει τὸν θεόν
  english_pob_choice: he would glorify God
  chosen_korean: 하나님을 영화롭게 할지를
  alternatives_korean:
  - 하나님께 영광을 돌릴지를
  - 하나님을 영화롭게 할 것인지를
  lexicon: BDAG
  rationale: δοξάσει는 미래 의미를 지니므로 간접화법 속에서 ‘할지를’로 처리해 자연스러운 한국어를 유지하면서도 미래성을 보존했습니다.
- source_word: Ἀκολούθει μοι
  english_pob_choice: Follow me
  chosen_korean: 나를 따르십시오
  alternatives_korean:
  - 나를 따르라
  - 계속 나를 따르십시오
  lexicon: BDAG
  rationale: 현재 명령형의 지속적 제자도 뉘앙스는 문맥에 남기되, 합쇼체의 직접 명령으로는 ‘나를 따르십시오’가 가장 자연스럽고 분명합니다.
theological_decisions:
- issue: 베드로의 죽음이 하나님을 영화롭게 한다는 표현의 범위
  chosen_reading: 본문은 죽음 자체가 어떤 방식으로 하나님을 영화롭게 하는지 구체화하지 않고, 그 죽음이 하나님께 영광이 되리라는 점만 유지합니다.
  alternative_readings:
  - 순교적 증언을 통해 하나님을 영화롭게 한다
  - 죽음의 방식 전체를 넓게 가리킨다
  rationale: 원문은 결과를 선언할 뿐 메커니즘을 설명하지 않으므로, 본문의 신학적 긴장을 해치지 않도록 해석을 본문 밖으로 확장하지 않았습니다.
  doctrine_reference: 본문의 긴장 보존
