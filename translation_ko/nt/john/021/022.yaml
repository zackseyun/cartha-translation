id: JHN.21.22
reference: John 21:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
  footnotes:
  - marker: a
    text: Or, 'If I will him to remain until I come.' The Greek verb can express either desire ('want') or will ('will/wish').
    reason: lexical_alternative
  - marker: b
    text: '''Until I come'' is left intentionally open; interpreters differ on whether this refers to Jesus'' later coming in a historical event or to his final coming.'
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “내가 그가 내가 올 때까지 머물러 있기를 원한다[a]면, 그것이 당신과 무슨 상관이 있습니까? 당신은 나를 따르십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘원한다’는 θέλω를 옮긴 말입니다. 이 동사는 ‘바라다’ 또는 ‘뜻하다/의지하다’의 의미를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 올 때까지’는 의도적으로 열어 둔 표현입니다. 이것이 역사적 사건에서의 예수님의 오심을 가리키는지, 그분의 최종적 오심을 가리키는지는 본문이 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  english_pob_choice: Jesus said to him
  chosen_korean: 예수께서 그에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그에게 말씀하십니다
  lexicon: SBLGNT
  rationale: 서술문 흐름에 맞춰 자연스러운 과거형으로 옮기되, 존칭 동사 '말씀하셨습니다'로 예수의 발화를 공손하게 처리했습니다.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  english_pob_choice: If I want him to remain
  chosen_korean: 내가 그가 ... 머물기를 원한다면
  alternatives_korean:
  - 내가 그가 ... 남아 있기를 원한다면
  - 내가 그를 ... 머물게 하려 한다면
  lexicon: BDAG
  rationale: θέλω의 의지/원함을 '원한다'로 살리고, μένειν은 문맥상 단순 '머물다'보다 '머물다/남아 있다'의 의미가 가능해 '머물다'를 택했습니다.
- source_word: ἕως ἔρχομαι
  english_pob_choice: until I come
  chosen_korean: 내가 올 때까지
  alternatives_korean:
  - 내가 돌아올 때까지
  - 내가 오고 있을 때까지
  lexicon: BDAG
  rationale: '''오다''를 그대로 반영해 해석을 좁히지 않았고, 도래의 구체적 성격은 드러내지 않아 영어 POB의 열린 처리와 맞췄습니다.'
- source_word: τί πρὸς σέ;
  english_pob_choice: what is that to you?
  chosen_korean: 그것이 너와 무슨 상관이 있습니까?
  alternatives_korean:
  - 그것이 너와 무슨 관계가 있습니까?
  - 그게 너에게 무슨 상관이 있습니까?
  lexicon: BDAG
  rationale: 그리스어 관용구의 책망/차단 기능을 살리기 위해 직역보다 자연스러운 한국어 관용 표현으로 옮겼습니다.
- source_word: σύ μοι ἀκολούθει
  english_pob_choice: You follow me
  chosen_korean: 너는 나를 따르십시오
  alternatives_korean:
  - 당신은 나를 따르십시오
  - 너는 계속 나를 따르십시오
  lexicon: BDAG
  rationale: 강조된 인칭대명사 σύ를 '너는'으로 살리고, 현재 명령형의 지속성을 과잉 설명하지 않으면서 직접 명령을 분명히 했습니다.
theological_decisions:
- issue: ἕως ἔρχομαι의 '올 때'가 가리키는 사건
  chosen_reading: 구체적 사건을 특정하지 않고 '내가 올 때까지'로 열어 두었습니다.
  alternative_readings:
  - 부활 후 나타나심까지
  - 예루살렘 심판 때까지
  - 재림 때까지
  rationale: 문맥이 예수의 '오심'을 단정적으로 규정하지 않으므로, 본문이 유지하는 긴장을 번역에서도 보존했습니다.
  doctrine_reference: 해석을 확정하지 않고 본문의 모호성을 보존
