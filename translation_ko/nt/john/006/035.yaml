id: JHN.6.35
reference: John 6:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
  footnotes:
  - marker: a
    text: Or, 'will by no means ever thirst.' The Greek uses an emphatic negation with 'ever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “나는 생명의 빵입니다. 내게 오는 사람은 결코 배고프지 않을 것이며, 나를 믿는 사람은 결코 목마르지 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘결코 어느 때에도 목마르지 않을 것입니다.’ 그리스어는 강한 부정 표현과 ‘어느 때에라도’를 뜻하는 말을 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  english_pob_choice: Jesus said to them
  chosen_korean: 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 말씀하셨습니다
  - 예수께서 그들에게 이르셨습니다
  lexicon: BDAG
  rationale: εἶπεν의 내러티브 도입은 ‘말씀하셨습니다’가 가장 자연스럽고, Ἰησοῦς의 직접 화행을 공손한 서술체로 보존합니다.
- source_word: ὁ ἄρτος τῆς ζωῆς
  english_pob_choice: the bread of life
  chosen_korean: 생명의 빵
  alternatives_korean:
  - 생명의 떡
  - 생명을 주는 빵
  lexicon: BDAG
  rationale: 직역성이 있으면서도 현대 한국어에서 이해 가능한 ‘빵’을 택해, 은유를 유지하되 교회 전통어 ‘떡’의 관용을 필수로 강요하지 않았습니다.
- source_word: οὐ μὴ πεινάσῃ
  english_pob_choice: will never hunger
  chosen_korean: 결코 배고프지 않을 것이며
  alternatives_korean:
  - 결코 굶주리지 않을 것이며
  - 절대로 배고프지 않을 것이며
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어 ‘결코 …지 않을’로 옮겨 미래 부정의 확실성을 살렸습니다.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  english_pob_choice: the one who believes in me
  chosen_korean: 나를 믿는 사람
  alternatives_korean:
  - 내게 믿는 사람
  - 내 안으로 믿는 사람
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω + εἰς는 관계적 신뢰를 뜻하므로 ‘나를 믿는 사람’으로 자연스럽게 옮겼습니다.
- source_word: οὐ μὴ διψήσει πώποτε
  english_pob_choice: will never thirst again
  chosen_korean: 결코 목마르지 않을 것입니다
  alternatives_korean:
  - 결코 목마르지 않을 것입니다
  - 언제까지나 목마르지 않을 것입니다
  lexicon: BDAG
  rationale: πώποτε의 ‘언제든지/일찍이’ 의미와 οὐ μή의 강한 부정을 합쳐, 한국어에서는 반복성보다 절대적 부정을 우선해 표현했습니다.
theological_decisions:
- issue: Ἐγώ εἰμι의 자기계시 뉘앙스
  chosen_reading: ‘나는 …입니다’라는 직접 자기선언을 유지해 추가 해설 없이 보존했습니다.
  alternative_readings:
  - ‘나 자신이 …입니다’로 강조하기
  - ‘내가 바로 …입니다’로 해설하기
  rationale: 본문이 요구하는 것은 설명의 확대가 아니라 예수의 자기동일시를 있는 그대로 드러내는 것이므로, 요한복음의 ‘I am’ 진술이 가진 긴장을 과도하게 풀지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
