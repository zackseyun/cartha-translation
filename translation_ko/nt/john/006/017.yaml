  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
  footnotes:
  - marker: a
    text: Or 'to the other side of the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'darkness had already fallen.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and after getting into a boat, they were going'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 배에 올라타고 바다를 건너 가버나움으로 가고 있었습니다. 이미 어둠이 깔렸고, 예수님은 아직 그들에게 오지 않으셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다의 다른 쪽으로’라고도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘어둠이 이미 내려앉았다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 앞의 분사구문을 풀어 ‘배에 올라타고 … 가고 있었습니다’로 옮긴 이전 방식에 해당합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  english_pob_choice: They got into a boat
  chosen_korean: 배에 올라타고
  alternatives_korean:
  - 배에 들어가고
  - 배에 타고
  lexicon: BDAG
  rationale: aorist 분사로서 먼저 일어난 동작을 한국어의 연결형으로 풀어, 동작의 선후를 자연스럽게 드러냈습니다. πλοῖον은 갈릴리 호수의 문맥에 맞게 ‘배’로 옮겼습니다.
- source_word: ἤρχοντο
  english_pob_choice: were heading
  chosen_korean: 가고 있었습니다
  alternatives_korean:
  - 건너가고 있었습니다
  - 향하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 시상의 진행성을 살려 단순 과거보다 진행형으로 옮겼습니다. 문맥상 ‘건너가다’의 의미가 있으나, 한국어 본문에서는 뒤의 ‘바다를 건너’가 이를 보완합니다.
- source_word: πέραν τῆς θαλάσσης
  english_pob_choice: across the sea
  chosen_korean: 바다를 건너
  alternatives_korean:
  - 바다 건너편으로
  - 바다 건너쪽으로
  lexicon: BDAG
  rationale: πέραν + 속격의 이동 방향을 직역에 가깝게 살리면서도 한국어로는 자연스럽게 ‘바다를 건너’로 표현했습니다.
- source_word: σκοτία ἤδη ἐγεγόνει
  english_pob_choice: it had already become dark
  chosen_korean: 이미 어둠이 깔렸고
  alternatives_korean:
  - 이미 어두워졌고
  - 이미 밤이 되었고
  lexicon: BDAG
  rationale: 완료/상태를 나타내는 표현을 한국어의 관용적 서술로 옮겨, 단순한 시간표현보다 분위기와 상태 변화를 함께 드러냈습니다.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  english_pob_choice: had not yet come to them
  chosen_korean: 아직 그들에게 오지 않으셨습니다
  alternatives_korean:
  - 아직 그들에게 이르지 않으셨습니다
  - 아직 그들 곁에 오지 않으셨습니다
  lexicon: BDAG
  rationale: πρὸς αὐτούς를 ‘그들에게’로 직역해 예수님의 미도착을 분명히 했습니다. 예수님을 지칭할 때는 한국어에서 자연스러운 존칭형 종결을 사용했습니다.
theological_decisions:
- issue: 서술의 긴장감과 진행성 보존
  chosen_reading: 배에 오른 뒤 바다를 건너는 진행, 이미 내려앉은 어둠, 그리고 예수님의 아직 도착하지 않으심을 순서대로 드러냈습니다.
  alternative_readings:
  - 단순 과거로 평탄화하여 옮기기
  - 어둠의 상태만 간단히 진술하기
  rationale: 이 구절의 의미는 사건의 순서와 지연이 만들어 내는 서사적 긴장에 있습니다. 그래서 시상과 상태 변화를 너무 평면적으로 만들지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
