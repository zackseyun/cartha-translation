revisions:
- from: 그들은 배에 올라타고 바다를 건너 가버나움으로 가고 있었습니다. 이미 어둠이 깔렸고, 예수님은 아직 그들에게 오지 않으셨습니다.[a][b][c]
  to: 그들은 배에 올라타[c] 바다 건너편[a] 가버나움으로 가고 있었습니다. 이미 어두워졌고[b], 예수님은 아직 그들에게 오지 않으셨습니다.
  rationale: ‘이미 어두워졌고’로 σκοτία ἤδη ἐγεγόνει의 변화 후 상태를 중립적으로 옮기고, ‘바다 건너편 가버나움으로’로 πέραν τῆς θαλάσσης와 목적지를 자연스럽게 연결했습니다. 모든 각주 표지를 해당 어구에 배치했으며, 이전 번역 방식에 관한 각주 c의 설명을 현재 본문과 구별되도록 정리했습니다.
