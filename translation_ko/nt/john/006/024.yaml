  naturalness: 초안의 ‘그들 자신이 배들에 올라가’와 ‘찾고 있었습니다’는 현대 한국어 합쇼체 서술로 다소 어색합니다. ‘그들 스스로 그 배들에 타고’ 및 완결된 과거 서술을 사용하면 더 자연스럽습니다.
