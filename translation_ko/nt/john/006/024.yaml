id: JHN.6.24
reference: John 6:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
  footnotes:
  - marker: a
    text: Or 'the small boats' or 'the little boats'; the Greek uses a diminutive form for 'boats.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 무리는 예수님께서 거기에 계시지 않고 그분의 제자들도 없다는 것을 보았을 때, 그들 스스로 그 배들에 타고 예수님을 찾으려고 가버나움으로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 πλοιάρια는 ‘배’의 지소형이며, ‘작은 배들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  english_pob_choice: So when
  chosen_korean: 그러므로 … 때
  alternatives_korean:
  - 그때
  - 그래서 … 때
  lexicon: BDAG
  rationale: ὅτε의 시간 관계와 οὖν의 이어짐을 함께 살려, 한국어에서는 자연스럽게 원인·전개를 잇는 ‘그러므로 … 때’로 옮겼습니다.
- source_word: ὁ ὄχλος
  english_pob_choice: the crowd
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: BDAG
  rationale: 복음서 서술에서 ὄχλος는 보통 모여 있는 무리를 가리키므로, 문맥상 가장 자연스러운 ‘무리’를 선택했습니다.
- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  english_pob_choice: was not there, nor his disciples
  chosen_korean: 거기에 계시지 않고, 또한 제자들도 없다는 것
  alternatives_korean:
  - 거기에 없고, 제자들도 없다는 것
  - 그곳에 계시지 않고 제자들도 없다는 것
  lexicon: BDAG
  rationale: 예수님에 대해선 존칭을 살려 ‘계시지’로, 제자들에 대해서는 병렬된 부정 구조를 유지해 의미를 분명히 했습니다.
- source_word: ἐνέβησαν αὐτοὶ εἰς τὰ πλοιάρια
  english_pob_choice: they themselves got into the boats
  chosen_korean: 그들 자신이 배들에 올라가
  alternatives_korean:
  - 그들 스스로 배들에 타고
  - 그들 자신이 작은 배들에 올라가
  lexicon: BDAG
  rationale: ἐνέβησαν은 배에 ‘오르다/타다’의 뜻이므로 ‘올라가’로 옮겼고, αὐτοὶ의 강조는 ‘그들 자신이’로 반영했습니다. πλοιάρια의 지소형은 본문에서는 일반적인 ‘배들’로 두었습니다.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  english_pob_choice: looking for Jesus
  chosen_korean: 예수를 찾고 있었습니다
  alternatives_korean:
  - 예수를 찾고 있었습니다
  - 예수를 찾아다니고 있었습니다
  lexicon: BDAG
  rationale: ζητοῦντες는 단순히 탐색하는 동작을 가리키므로, 과도한 신학적 색채가 덧씌워지지 않도록 일상적이고 직접적인 ‘찾고 있었습니다’로 옮겼습니다.
