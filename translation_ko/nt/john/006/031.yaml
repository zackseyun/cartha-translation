source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
  footnotes:
  - marker: a
    text: Or “Our ancestors.” The Greek literally says “our fathers.”
    reason: lexical_alternative
  - marker: b
    text: “In the wilderness” may also be rendered “in the desert.”
    reason: lexical_alternative
translation:
  language: ko
  text: '우리 조상들은 광야에서 만나를 먹었습니다. 기록된 바와 같이: ‘그가 그들에게 먹도록 하늘에서 빵을 주셨습니다.’[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들’은 원문의 ‘우리의 아버지들’이라는 남성 복수 표현을 한국어에서 관용적으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘광야’는 ‘사막’으로도 옮길 수 있지만, 출애굽 및 만나 전승의 성경적 맥락에서는 ‘광야’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  english_pob_choice: Our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리의 아버지들
  - 우리 선조들
  lexicon: BDAG
  rationale: πατέρες의 직역은 ‘아버지들’이지만, 이 문맥에서는 이스라엘의 선조들을 가리키는 관용적 표현이므로 한국어에서는 성별을 과도하게 드러내지 않는 ‘조상들’이 자연스럽고 의미도 분명합니다.
- source_word: ἐν τῇ ἐρήμῳ
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: BDAG
  rationale: 출애굽 전승과 연결되는 ἔρημος는 이 문맥에서 ‘광야’가 가장 익숙하고 성경적 연관성을 잘 보존합니다.
- source_word: Ἄρτον
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 빵 한 조각
  lexicon: BDAG
  rationale: ἄρτος는 여기서 특정한 한 덩어리보다 하나님이 주신 먹거리를 가리키는 일반명사이므로, 한국어에서는 일상적이고 중립적인 ‘빵’이 적절합니다.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  english_pob_choice: He gave them ... to eat
  chosen_korean: 그가 ... 그들에게 주어 먹게 하셨습니다
  alternatives_korean:
  - 그가 그들에게 먹을 빵을 주셨습니다
  - 그가 그들에게 먹도록 주셨습니다
  lexicon: BDAG
  rationale: δίδωμι + 부사격 + 부정사 구조를 ‘주어 먹게 하셨습니다’로 옮기면 인용문의 구조를 비교적 가깝게 유지하면서도 한국어 문장이 자연스럽습니다.
theological_decisions:
- issue: 인용문의 화자를 즉시 신학적으로 확장하지 않기
  chosen_reading: 광야에서 만나를 주신 역사적·성경적 진술로 옮기고, 후속 문맥의 그리스도론적 전개를 여기서 미리 삽입하지 않았습니다.
  alternative_readings:
  - ‘하늘의 참 빵’ 등으로 해석을 앞당겨 표현하기
  rationale: 이 구절은 군중이 출애굽 전승을 인용하는 자리이므로, 본문 자체의 말씀을 보존하고 이후 예수님의 해석이 문맥 안에서 드러나도록 하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
