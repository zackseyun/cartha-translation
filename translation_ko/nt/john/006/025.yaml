  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
  footnotes:
  - marker: a
    text: 'Or “when have you come here?” The Greek perfect verb can be rendered more formally that way, but the idiomatic sense in context is arrival: “when did you get here?”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 바다 건너편에서 그분을 찾아서, 그분께 말했습니다. 「라삐, 언제 여기 오셨습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “언제 여기로 오셨습니까?”가 되지만, 문맥상 핵심은 도착 시점입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  english_pob_choice: when they found
  chosen_korean: 찾아서
  alternatives_korean:
  - 찾은 뒤에
  - 찾고 나서
  lexicon: BDAG
  rationale: 부사적 aorist 분사로서 앞선 동작을 자연스럽게 이어 주는 시점 표현이므로, 한국어에서는 결과적으로 ‘찾아서’가 가장 간결하고 문맥에 맞습니다.
- source_word: πέραν τῆς θαλάσσης
  english_pob_choice: on the other side of the sea
  chosen_korean: 바다 건너편에서
  alternatives_korean:
  - 바다 저편에서
  - 바다 맞은편에서
  lexicon: BDAG
  rationale: 지리적 대조를 살리면서 한국어로 자연스럽게 옮기기 위해 ‘건너편’으로 풀었습니다.
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 라삐
  alternatives_korean:
  - 랍비
  - 선생님
  lexicon: BDAG
  rationale: 직접 호칭의 유대교적 호칭을 보존하기 위해 음역을 유지했고, 한국어 표기는 통용되는 ‘라삐’를 택했습니다.
- source_word: ὧδε γέγονας
  english_pob_choice: when did you get here
  chosen_korean: 언제 여기 오셨습니까
  alternatives_korean:
  - 언제 여기까지 오셨습니까
  - 언제 여기 오게 되셨습니까
  - 언제 여기 오셨나요
  lexicon: BDAG
  rationale: 완료형 γέγονας는 이 문맥에서 ‘도착해 여기 계시게 된 시점’을 묻는 관용적 표현이므로, ‘오셨습니까’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예수께 대한 직접 호칭의 높임말 처리
  chosen_reading: 본문 서술은 평서형으로 유지하되, 직접 질문에서는 주어를 높여 ‘오셨습니까’로 옮겼습니다.
  alternative_readings:
  - ‘오셨나요’처럼 더 구어적으로 옮김
  - ‘도착하셨습니까’로 더 명시적으로 옮김
  rationale: 장면의 자연스러운 대화체를 살리면서도 예수께 대한 존대 수준을 유지하기 위해 현대 공손체를 사용했습니다.
  doctrine_reference: 예수에 대한 경칭적 직접 화법
