  source_fidelity: 첫 질문의 ἵνα 절은 ‘우리가 보고 당신을 믿도록/믿게 되도록’이라는 목적을 나타냅니다. 초안의 ‘우리가 보고 당신을 믿게 하려면 말입니다’는 예수께서 그들을 믿게 ‘만드신다’는 사역·사동의 뜻으로 읽히며, 원문의 목적절을 부정확하게 옮깁니다. 또한 σημεῖον은 단수이므로 ‘무슨 표적’을 유지하는 것이 적절합니다.
  naturalness: ‘그러자 그들이 그에게 말했습니다’와 ‘무슨 일을 하십니까?’는 현대 표준어 합쇼체로 자연스럽습니다. 목적절은 ‘우리가 보고 당신을 믿도록’으로 고치면 사동적 오해 없이 간결하고 자연스럽습니다.
