id: JHN.6.30
reference: John 6:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
  footnotes:
  - marker: a
    text: Or “believe in you” or “trust you.” The Greek more literally says “believe you,” using the dative pronoun rather than the more common Johannine expression “believe in.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 그에게 말했습니다. 「그렇다면 우리가 보고 당신을 믿도록, 당신은 무슨 표적을 행하십니까? 무슨 일을 하십니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 “당신을 믿다”라고 합니다. 여기에는 요한복음에서 더 흔한 “당신 안으로 믿다”라는 표현과 달리, 당신을 믿다 또는 당신의 말을 믿다는 뜻의 여격 대명사가 쓰였습니다. “당신을 신뢰하다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  english_pob_choice: So they said to him
  chosen_korean: 그러자 그들이 그에게 말했습니다
  alternatives_korean:
  - 그래서 그들이 그에게 말했습니다
  - 그러므로 그들이 그에게 말했습니다
  lexicon: BDAG
  rationale: οὖν의 이어짐과 반응성을 살리되, 현대 한국어에서 자연스러운 인과·전개 표현인 「그러자」를 사용했습니다.
- source_word: σημεῖον
  english_pob_choice: sign
  chosen_korean: 표적
  alternatives_korean:
  - 징표
  - 사인
  lexicon: BDAG
  rationale: 요한복음에서 σημεῖον은 단순한 기적이 아니라 의미를 가리키는 신학적 표지이므로, 한국어 성경어에서 널리 쓰이는 「표적」을 택했습니다.
- source_word: πιστεύσωμέν σοι
  english_pob_choice: believe you
  chosen_korean: 당신을 믿게
  alternatives_korean:
  - 당신을 믿도록
  - 당신에게 믿게
  lexicon: BDAG
  rationale: 여기서는 εἰς + 대격이 아니라 여격 σοι가 쓰였으므로 「믿다」의 직접 목적어 형태를 살려 「당신을 믿게」로 옮겼습니다.
- source_word: τί ἐργάζῃ
  english_pob_choice: What work are you doing?
  chosen_korean: 무슨 일을 하십니까?
  alternatives_korean:
  - 무슨 일을 하고 계십니까?
  - 어떤 일을 하십니까?
  lexicon: BDAG
  rationale: ἐργάζομαι의 ‘일하다/행하다’ 뉘앙스를 반영해 「무슨 일을 하십니까」로 옮기되, 앞의 ποιεῖς와 중복되지 않도록 한국어에서는 자연스럽게 정리했습니다.
theological_decisions:
- issue: πιστεύω + 여격의 의미
  chosen_reading: “당신을 믿게”로 유지하여, 더 흔한 ‘믿고 따르다/믿어 들어가다’의 표현을 섞지 않았습니다.
  alternative_readings:
  - 당신을 믿도록
  - 당신을 신뢰하게
  rationale: 본문은 여격 인칭대명사 σοι를 사용하며, 요한복음의 관용구인 ‘믿다 안으로’(εἰς)를 쓰지 않습니다. 따라서 문법 차이를 드러내는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §§1, 3, 5; Contested terms: πίστις'
