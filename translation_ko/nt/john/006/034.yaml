translation:
  language: ko
  text: 그러자 그들이 그에게 말했습니다. “주님[a], 항상 이 빵을 저희에게 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님, 항상 이 빵을 저희에게 주십시오.” 그리스어 호칭은 ‘주님’ 외에 공손한 직접 호칭으로도 쓰일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν
  english_pob_choice: So they said
  chosen_korean: 그러자 그들이 말했습니다
  alternatives_korean:
  - 그래서 그들이 말했습니다
  - 그러므로 그들이 말했습니다
  lexicon: BDAG
  rationale: οὖν의 이어짐을 자연스러운 한국어 담화 표지인 ‘그러자’로 옮겨, 앞선 요청의 응답이라는 흐름을 살렸습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인이시여
  - 선생님
  - Sir
  lexicon: BDAG
  rationale: 공손한 직접 호칭으로서의 범위를 살리면서도, 요한복음 문맥에서 가능한 신학적 울림을 유지하기 위해 ‘주님’을 택했습니다.
- source_word: δὸς ἡμῖν
  english_pob_choice: give us
  chosen_korean: 저희에게 주십시오
  alternatives_korean:
  - 저희에게 주시옵소서
  - 저희에게 주십시오
  lexicon: BDAG
  rationale: aorist 명령형의 직접적 요청을 현대 합쇼체 청유로 옮겨, 원문의 간결한 간구를 자연스럽게 표현했습니다.
- source_word: τὸν ἄρτον τοῦτον
  english_pob_choice: this bread
  chosen_korean: 이 빵
  alternatives_korean:
  - 이 떡
  - 이 빵덩이
  - 이 양식
  lexicon: BDAG
  rationale: ἄρτος의 기본 의미를 살리면서 현대 한국어에서 자연스러운 ‘빵’을 선택했고, 지시어 ‘τοῦτον’은 ‘이’로 보존했습니다.
theological_decisions:
- issue: κύριε의 한국어 호칭 수위
  chosen_reading: ‘주님’으로 번역해 단순한 예의 호칭을 넘을 수 있는 여지를 남겼습니다.
  alternative_readings:
  - ‘선생님’으로 낮추는 번역
  - ‘주’로 더 직역하는 번역
  rationale: 영어 POB가 ‘Lord’를 기본값으로 두면서도 각주에서 ‘Sir’ 가능성을 열어 둔 점을 반영했습니다. 한국어에서도 ‘주님’이 공손함과 더 깊은 의미 가능성을 함께 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
