  rationale: 문장 종결과 어순을 현대 합쇼체에 맞게 다듬고, ‘조각들로 열두 광주리를 채웠습니다’로 원문의 행위 구조를 회복했습니다. ‘사람들이 먹은 뒤에 남은’은 완료분사와 ἐπερίσσευσαν의 문맥상 의미를 자연스럽게 반영하되, 먹은 이들이 의도적으로 남겼다고 단정하지 않습니다. 각주 b도 원문의 직역적 범위와 문맥적 뜻을 더 정확히 설명하도록 고쳤습니다.
