  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ⸀ἐπερίσσευσαν τοῖς βεβρωκόσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
  footnotes:
  - marker: a
    text: Or 'fragments' for 'pieces' (κλασμάτων).
    reason: lexical_alternative
  - marker: b
    text: Literally, 'which overflowed/abounded for those who had eaten'; the sense is that these were the portions left over after the meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 그것들을 모아, 사람들이 먹은 뒤에 남은 다섯 보리떡 조각들로 열두 광주리를 채웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부스러기들’로 옮길 수 있습니다(κλασμάτων).
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘먹은 사람들에게 남은/넘친 것’입니다. 문맥상 식사 뒤에 남은 떡 조각들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον
  english_pob_choice: they gathered them
  chosen_korean: 그들이 그것들을 거두어
  alternatives_korean:
  - 그들이 그것들을 모아
  - 그들이 그것들을 모았고
  lexicon: BDAG
  rationale: 남은 것을 ‘거두다’는 자연스러운 한국어로, 제자들이 남은 떡조각을 수거한 행위를 분명하게 드러냅니다.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  english_pob_choice: filled twelve baskets
  chosen_korean: 열두 광주리에 채웠으니
  alternatives_korean:
  - 열두 바구니를 가득 채웠으니
  - 열두 광주리를 채웠으니
  lexicon: BDAG
  rationale: κοφῖνος는 바구니보다 다소 구체적인 용기이므로, 성경 문맥에 맞는 ‘광주리’를 택해 수량과 충만함을 살렸습니다.
- source_word: κλασμάτων
  english_pob_choice: pieces
  chosen_korean: 조각들이었습니다
  alternatives_korean:
  - 부스러기들이었습니다
  - 조각들입니다
  lexicon: BDAG
  rationale: κλάσματα는 빵을 떼어 낸 조각들이므로, 지나치게 문어적인 ‘부스러기’보다 직관적인 ‘조각’이 원뜻을 잘 전합니다.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  english_pob_choice: from the five barley loaves
  chosen_korean: 다섯 보리떡의
  alternatives_korean:
  - 다섯 보리빵의
  - 다섯 보리떡으로 된
  lexicon: BDAG
  rationale: ἄρτος는 이 문맥에서 떡/빵을 가리키며, ‘보리떡’이 한국어 성경 독자에게 가장 자연스럽고 원문의 재료 정보도 보존합니다.
- source_word: τοῖς βεβρωκόσιν
  english_pob_choice: by those who had eaten
  chosen_korean: 사람들이 먹고 남은
  alternatives_korean:
  - 먹은 사람들이 남긴
  - 먹은 이들이 남긴
  lexicon: BDAG
  rationale: 완료 분사는 ‘먹은 뒤의 상태’를 나타내므로, 남은 것의 출처를 한국어에서 가장 자연스럽게 ‘먹고 남은’으로 풀었습니다.
theological_decisions:
- issue: 남은 양의 의미를 어떻게 나타낼지
  chosen_reading: ‘먹고 남은’으로 옮겨, 기적의 결과가 단순한 여분이 아니라 실제로 식사 후에 남은 분량임을 드러냈습니다.
  alternative_readings:
  - ‘남겨진’
  - ‘초과된’
  rationale: 그리스어 ἐπερίσσευσαν은 ‘넘쳐 남다/남아 있다’는 뜻이지만, 본문 맥락상 식사 후 잔량을 가리키므로 과장된 뉘앙스 없이 결과를 분명히 했습니다.
  doctrine_reference: 본문 맥락상 기적의 풍성함을 유지하면서도, 의미를 필요 이상으로 신학화하지 않는 번역 원칙
