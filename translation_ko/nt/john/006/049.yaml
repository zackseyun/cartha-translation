  rationale: aorist 동사 ἔφαγον은 단순히 ‘먹었다’는 사실을 말하므로, 문맥의 대비를 살려 한국어에서는 앞절을 연결해 ‘먹었지만’으로 처리했습니다.
- source_word: ἐν τῇ ἐρήμῳ
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
