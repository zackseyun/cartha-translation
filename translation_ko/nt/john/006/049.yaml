  lexicon: BDAG
  rationale: ἐρήμος는 출애굽 전승의 배경인 ‘광야’가 가장 적절하며, 성경적 상호텍스트성을 보존합니다.
- source_word: τὸ μάννα
  english_pob_choice: the manna
  chosen_korean: 만나를
  alternatives_korean:
