  lexicon: BDAG
  rationale: 정관사와 함께 나온 τὸ μάννα는 이미 알려진 출애굽기의 만나를 가리키므로, 통상적인 성경 용어인 ‘만나’를 사용했습니다.
theological_decisions:
- issue: ‘your fathers’의 한국어 화법과 성별 포괄성
  chosen_reading: 조상들
