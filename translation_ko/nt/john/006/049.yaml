  rationale: πατέρες는 문자적으로 ‘아버지들’이지만, 여기서는 광야 세대를 가리키는 집단적 조상 의미가 분명하므로 한국어에서는 자연스럽게 ‘조상들’로 옮겨 대표성과 역사성을 살렸습니다.
