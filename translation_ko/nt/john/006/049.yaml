lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  english_pob_choice: Your fathers
  chosen_korean: 여러분의 조상들은
  alternatives_korean:
  - 여러분의 아버지들은
  lexicon: BDAG
  rationale: πατέρες는 문자적으로 ‘아버지들’이지만, 여기서는 광야 세대를 가리키는 집단적 조상 의미가 분명하므로 한국어에서는 자연스럽게 ‘조상들’로 옮겨 대표성과 역사성을 살렸습니다.
- source_word: ἔφαγον
  english_pob_choice: ate
  chosen_korean: 먹었지만
  alternatives_korean:
  - 먹었습니다
  lexicon: BDAG
  rationale: aorist 동사 ἔφαγον은 단순히 ‘먹었다’는 사실을 말하므로, 문맥의 대비를 살려 한국어에서는 앞절을 연결해 ‘먹었지만’으로 처리했습니다.
- source_word: ἐν τῇ ἐρήμῳ
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: BDAG
  rationale: ἐρήμος는 출애굽 전승의 배경인 ‘광야’가 가장 적절하며, 성경적 상호텍스트성을 보존합니다.
- source_word: τὸ μάννα
  english_pob_choice: the manna
  chosen_korean: 만나를
  alternatives_korean:
  - 하늘 양식을
  lexicon: BDAG
  rationale: 정관사와 함께 나온 τὸ μάννα는 이미 알려진 출애굽기의 만나를 가리키므로, 통상적인 성경 용어인 ‘만나’를 사용했습니다.
theological_decisions:
- issue: ‘your fathers’의 한국어 화법과 성별 포괄성
  chosen_reading: 조상들
  alternative_readings:
  - 아버지들
  - 선조들
  rationale: 본문의 수신자-조상 관계를 유지하면서도 한국어에서 오해를 줄이기 위해, 직역적 ‘아버지들’ 대신 집단적 역사 지시를 드러내는 ‘조상들’을 택했습니다. 이는 본문의 의미를 희석하지 않으면서 청중 이해를 돕습니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral'
