  - 선조들
  rationale: 본문의 수신자-조상 관계를 유지하면서도 한국어에서 오해를 줄이기 위해, 직역적 ‘아버지들’ 대신 집단적 역사 지시를 드러내는 ‘조상들’을 택했습니다. 이는 본문의 의미를 희석하지 않으면서 청중 이해를 돕습니다.
