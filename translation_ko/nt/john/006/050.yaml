id: JHN.6.50
reference: John 6:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
  footnotes:
  - marker: a
    text: Or 'This is the bread coming down from heaven.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'not die' is left broad in the main text; interpreters variously understand it as freedom from ultimate death, spiritual death, or eschatological destruction in context.
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 누구든지 그것을 먹고 죽지 않도록 하늘에서 내려오는 빵입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘이것은 하늘에서 내려오는 빵이다.’
    reason: lexical_alternative
  - marker: b
    text: ‘죽지 않도록’은 본문에서 죽음의 범주를 특정하지 않고 넓게 유지한 표현입니다. 문맥에 따라 궁극적인 죽음, 영적 죽음, 또는 종말론적 멸망으로 이해될 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: οὗτός
  english_pob_choice: This
  chosen_korean: 이것은
  alternatives_korean:
  - 이것
  - 이분은
  lexicon: BDAG
  rationale: 지시어는 대상 빵을 직접 가리키므로 간결한 ‘이것은’이 자연스럽고 원문의 즉시성을 살립니다.
- source_word: ὁ ἄρτος
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  lexicon: BDAG
  rationale: 기본 어휘는 ‘빵’이며, 요한복음 6장에서는 상징적 의미가 더해지더라도 본문의 어휘 자체를 과도하게 풀이하지 않는 편이 적절합니다.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  english_pob_choice: that comes down from heaven
  chosen_korean: 하늘에서 내려오는
  alternatives_korean:
  - 하늘에서 내려오는
  - 하늘로부터 내려오는
  lexicon: BDAG
  rationale: 현재 분사를 자연스러운 관형절로 옮기되, 계속 진행되는 동작감이 드러나도록 ‘내려오는’을 택했습니다.
- source_word: μὴ ἀποθάνῃ
  english_pob_choice: and not die
  chosen_korean: 죽지 않을 것입니다
  alternatives_korean:
  - 죽지 않을 것입니다
  - 죽지 않게 될 것입니다
  - 죽지 않습니다
  lexicon: BDAG
  rationale: ἵνα 절의 목적/결과를 한국어 미래·의도 표현으로 풀어 자연스럽게 만들면서도, 영어 POB가 유지한 ‘not die’의 폭을 좁히지 않았습니다.
theological_decisions:
- issue: ‘not die’의 의미 범위
  chosen_reading: ‘죽지 않을 것입니다’로 유지하여 육체적 죽음, 영적 죽음, 종말론적 멸망 중 하나로 한정하지 않습니다.
  alternative_readings:
  - 영원히 죽지 않을 것입니다
  - 영적으로 죽지 않을 것입니다
  - 멸망하지 않을 것입니다
  rationale: 본문 자체는 죽음의 종류를 명시하지 않으므로, 영어 POB처럼 넓은 표현을 보존해 요한복음의 신학적 긴장을 유지합니다.
  doctrine_reference: 본문의 표현 범위를 좁히지 않고 유지하는 원칙
