- from: 이것은 하늘에서 내려오는 빵이니, 누구든지 그것을 먹으면 죽지 않을 것입니다.[a][b]
  to: 이것은 누구든지 그것을 먹고 죽지 않도록 하늘에서 내려오는 빵입니다.[a][b]
  rationale: 현재분사 καταβαίνων은 ‘하늘에서 내려오는’으로 유지했습니다. ἵνα 이하를 ‘누구든지 그것을 먹고 죽지 않도록’으로 옮겨, 빵이 하늘에서 내려오는 목적/결과를 표현하되 죽음의 의미를 해석적으로 한정하지 않았습니다. 각주 b도 본문이 명시하지 않은 해석을 본문에 삽입하지 않고 가능한 이해로만 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:11Z'
