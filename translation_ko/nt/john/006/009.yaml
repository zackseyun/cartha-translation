lexical_decisions:
- source_word: παιδάριον
  english_pob_choice: boy
  chosen_korean: 아이
  alternatives_korean:
  - 소년
  - 어린아이
  - 작은 아이
  lexicon: BDAG
  rationale: 어린 소년을 가리키는 말로, 현대 한국어에서는 성별과 나이를 과도하게 좁히지 않는 ‘아이’가 가장 자연스럽고 본문에도 무리가 없습니다.
- source_word: ἄρτους κριθίνους
  english_pob_choice: barley loaves
  chosen_korean: 보리떡
  alternatives_korean:
  - 보리 빵
  - 보리로 만든 떡
  - 보리빵
  lexicon: BDAG
  rationale: ἄρτοι는 빵/떡 덩어리를 뜻하고 κριθίνους가 보리임을 밝히므로, 한국어 성경에서 익숙하면서도 원뜻을 살리는 ‘보리떡’이 적절합니다.
- source_word: ὀψάρια
  english_pob_choice: fish
  chosen_korean: 물고기
  alternatives_korean:
  - 생선
  - 작은 물고기
  - 반찬
  lexicon: BDAG
  rationale: 이 문맥에서는 빵과 함께 먹는 물고기를 가리키므로, 과도한 해석을 피하면서 자연스럽게 이해되는 ‘물고기’로 옮겼습니다.
- source_word: εἰς τοσούτους
  english_pob_choice: for so many
  chosen_korean: 이 많은 사람에게
  alternatives_korean:
  - 그 많은 사람에게
  - 저 많은 사람에게
  - 이렇게 많은 사람에게
  lexicon: BDAG
  rationale: εἰς는 여기서 충분성/대응을 나타내므로, 직접적으로 ‘많은 사람에게’라고 옮겨 부족함의 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 수사 의문문의 뉘앙스
  chosen_reading: “무엇이 되겠습니까?”로 옮겨, 단순 정보 질문이 아니라 충분치 않음을 드러내는 평가적 질문으로 살렸습니다.
  alternative_readings:
  - “무슨 소용이 있겠습니까?”
  - “어찌 충분하겠습니까?”
  rationale: 그리스어 문장은 남은 음식의 양이 많은 무리를 감당하지 못한다는 반응이므로, 한국어에서도 수사적 무력감을 유지하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 본문 주해/서술 뉘앙스
