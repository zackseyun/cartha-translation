id: JHN.6.27
reference: John 6:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
  footnotes:
  - marker: a
    text: Or 'that endures for eternal life.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'has sealed'; the expression conveys authorization or authentication.
    reason: lexical_alternative
translation:
  language: ko
  text: 썩어 없어지는 음식을 위해 일하지 말고, 영생에 이르도록 남아 있는 음식[a]을 위해 일하십시오. 인자께서 그것을 여러분에게 주실 것입니다. 아버지이신 하나님께서 그에게 인장을 찍으셨기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영생까지 지속되는 음식’.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 ‘인장을 찍다’라는 표현을 사용하며, 위임이나 인증의 의미를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε
  english_pob_choice: Do not work
  chosen_korean: 일하지 말고
  alternatives_korean:
  - 일하십시오
  - 수고하지 말고
  - 애쓰지 말고
  lexicon: BDAG
  rationale: 명령형의 금지를 자연스러운 한국어로 옮기되, 단순한 금지가 아니라 목적을 둔 행동의 방향 전환이라는 흐름을 살리기 위해 ‘일하지 말고’로 렌더링했습니다.
- source_word: βρῶσιν
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 먹을 것
  - 양식
  - 식물
  lexicon: BDAG
  rationale: 문맥상 ‘먹는 행위’가 아니라 실제로 먹는 대상을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘음식’을 택했습니다.
- source_word: ἀπολλυμένην
  english_pob_choice: that perishes
  chosen_korean: 썩어 없어지는
  alternatives_korean:
  - 사라지는
  - 멸망하는
  - 없어지는
  lexicon: BDAG
  rationale: 단순히 ‘사라지는’보다 음식의 소멸·부패 뉘앙스를 함께 살려, 시간에 따라 없어지는 대상임을 드러내는 표현으로 옮겼습니다.
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  english_pob_choice: that remains to eternal life
  chosen_korean: 영생에 이르는
  alternatives_korean:
  - 영생을 위해 남아 있는
  - 영생까지 지속되는
  - 영원한 생명에 남는
  lexicon: BDAG
  rationale: εἰς의 목표/도달 방향을 살리기 위해 ‘에 이르는’으로 옮겼고, μένω의 지속성을 한국어에서 과도하게 늘이지 않도록 간결하게 처리했습니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자이신 분
  lexicon: BDAG
  rationale: 요한복음에서의 표제어적 자기 호칭을 살리기 위해 전통적이면서도 본문상 기능을 드러내는 ‘인자’를 사용했습니다.
- source_word: ἐσφράγισεν
  english_pob_choice: has set his seal on
  chosen_korean: 인장을 찍으셨기 때문입니다
  alternatives_korean:
  - 봉인하셨기 때문입니다
  - 도장을 찍으셨기 때문입니다
  - 인증하셨기 때문입니다
  lexicon: BDAG
  rationale: 봉인/인증의 은유를 한국어에서 가장 직관적으로 전달하는 표현으로 ‘인장을 찍다’를 택해, 단순한 추상적 ‘인증’으로 축소하지 않았습니다.
theological_decisions:
- issue: ὁ πατὴρ ἐσφράγισεν ὁ θεός의 앱포지션 처리
  chosen_reading: 아버지 하나님께서
  alternative_readings:
  - 하나님 아버지께서
  - 아버지, 곧 하나님께서
  rationale: 원문은 아버지를 하나님으로 식별하는 구조이므로, 한국어에서도 두 칭호를 함께 살려 관계와 동일시를 동시에 드러냈습니다.
  doctrine_reference: 니케아 신경(381); 번역 원칙 §6
- issue: ἐσφράγισεν의 은유 보존
  chosen_reading: 인장을 찍으셨기 때문입니다
  alternative_readings:
  - 인증하셨기 때문입니다
  - 봉인하셨기 때문입니다
  rationale: 하나님의 위임·확인이라는 의미를 드러내되, 원문의 표지를 지우지 않기 위해 은유를 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §6
