  verdict: revise
  source_fidelity: 핵심 대조와 명령은 대체로 보존되었으나, μένουσαν(‘남아 있는/지속되는’)이 본문에서 빠져 ‘영생에 이르는 음식’으로만 번역되었습니다. 또한 각주 표지의 문자와 위치가 불일치하고 중복되어 있습니다.
  naturalness: ‘썩어 없어지는 음식’과 ‘일하지 말고 … 일하십시오’는 자연스럽습니다. 다만 ‘영생에 이르는 음식’은 음식 자체가 영생에 도달하는 듯하여 원문의 ‘영생에 이르도록 남아 있는 음식’보다 덜 정확합니다. ‘그에게 인장을 찍으셨습니다’는 은유를 보존하면서도 현대 한국어에서 이해 가능합니다.
  terminology: ‘인자’는 적절하며, ὁ πατήρ … ὁ θεός는 ‘아버지이신 하나님’으로 옮겨 원문의 동격 관계를 보다 투명하게 나타낼 수 있습니다. σφραγίζω의 표상은 ‘인장을 찍다’로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: 각주 표지의 문자·위치·중복이 일치하지 않습니다.
    rationale: 본문에는 키릴 문자 [а], [ㅂ]와 라틴 문자 [a][b]가 혼재하고, [b]는 의미상 해당하는 ‘인장을 찍으셨습니다’가 아니라 ‘주실 것입니다’ 뒤에 놓였으며 마지막에 중복됩니다. 제공된 각주 marker a/b와 정확히 대응하도록 바로잡아야 합니다.
  - severity: medium
