    issue: 각주의 ‘남성만’ 표현
    rationale: ἄνδρες가 집계의 문법적 주어라는 점은 분명하지만, ‘만’은 본문이 직접 진술하지 않는 참석자 구성 또는 절대적 배제를 함축할 수 있습니다.
