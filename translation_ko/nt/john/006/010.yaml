id: JHN.6.10
reference: John 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
  footnotes:
  - marker: a
    text: Greek first says 'the people' (ἀνθρώπους), then later 'the men' (ἄνδρες), indicating that the count of about five thousand refers specifically to the men.
    reason: lexical_alternative
  - marker: b
    text: Or 'recline.' The Greek verb can refer to reclining for a meal, but here 'sit down' is used for natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “사람들을 앉게 하십시오.” 그곳에는 풀이 많았습니다. 그래서 남자들이 앉았는데, 수는 약 오천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 먼저 ‘사람들’(ἀνθρώπους)을 말한 뒤, 나중에 ‘남자들’(ἄνδρες)이라고 하여, 약 오천 명이라는 수가 남성만을 가리킨다는 점을 보여 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  english_pob_choice: Have the people sit down
  chosen_korean: “사람들을 앉게 하십시오”
  alternatives_korean:
  - “사람들을 눕게 하십시오”
  - “사람들을 앉히십시오”
  lexicon: SBLGNT; BDAG
  rationale: ἀναπεσεῖν은 식사 자리의 ‘recline’ 뉘앙스가 있으나, 야외에서의 장면과 현대 한국어 자연성을 고려하면 ‘앉게 하십시오’가 가장 읽히기 쉽고 지시의 힘도 잘 살립니다.
- source_word: χόρτος πολὺς
  english_pob_choice: plenty of grass
  chosen_korean: 풀이 많았습니다
  alternatives_korean:
  - 많은 풀이 있었습니다
  - 풀이 풍부했습니다
  lexicon: SBLGNT; BDAG
  rationale: χόρτος는 여기서 ‘풀/잔디’를 가리키며, πολὺς는 단순한 존재가 아니라 양의 많음을 나타냅니다. 한국어에서는 ‘풀이 많았습니다’가 가장 자연스럽습니다.
- source_word: οἱ ἄνδρες
  english_pob_choice: the men
  chosen_korean: 남자들이
  alternatives_korean:
  - 남성들이
  - 사람들이
  lexicon: SBLGNT; BDAG
  rationale: 앞의 ἀνθρώπους는 넓은 의미의 ‘사람들’이지만, 여기 ἄνδρες는 남성만을 가리키므로 구분을 살려 ‘남자들’로 옮겼습니다.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  english_pob_choice: about five thousand in number
  chosen_korean: 수는 약 오천 명이었습니다
  alternatives_korean:
  - 약 오천 명이었습니다
  - 오천 명쯤이었습니다
  lexicon: SBLGNT; BDAG
  rationale: ὡς는 추정값을 나타내며, τὸν ἀριθμόν은 인원수를 명시합니다. 한국어에서는 ‘수는 약 오천 명’이 그 정보를 간결하게 반영합니다.
theological_decisions:
- issue: 남성 명시와 집계 범위
  chosen_reading: ἄνδρες를 ‘남자들’로 옮겨, 앞의 일반적 ‘사람들’과 구별했습니다.
  alternative_readings:
  - 두 표현을 모두 ‘사람들’로 평준화함
  - ‘남성들’로 옮김
  rationale: 본문은 먼저 일반 집단을 말한 뒤, 실제 집계가 남성 기준임을 분명히 합니다. 이 차이를 유지해야 독자가 수의 범위를 오해하지 않습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4 (Gender-accurate over gender-neutral)
