- from: 그런데 예수님은 그를 시험하시려고 이 말씀을 하셨습니다. 예수님 자신은 무엇을 하실지 이미 알고 계셨습니다.[a]
  to: 그런데 예수님께서는 그를 시험하시려고 이렇게 말씀하셨습니다. 예수님께서는 친히 무엇을 하려고 하시는지 알고 계셨습니다.[a]
  rationale: The revision removes the unexpressed ‘이미,’ renders μέλλω’s prospective/intended-action nuance with ‘무엇을 하려고 하시는지,’ and uses ‘친히’ to express αὐτός emphatically in natural modern Korean. The footnote now supplies a genuine rendering alternative while retaining the contextual distinction between testing and tempting.
