base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
  footnotes:
  - marker: a
    text: Or 'to try him'; the verb can also mean 'to tempt,' but here the sense is to test or prove him.
