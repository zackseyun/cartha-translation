translation:
  language: ko
  text: 그런데 예수님께서는 그를 시험하시려고 이렇게 말씀하셨습니다. 예수님께서는 친히 무엇을 하려고 하시는지 알고 계셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 시험하여’; 이 동사는 ‘유혹하다’라는 뜻도 가질 수 있지만, 여기서는 시험하거나 입증한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  english_pob_choice: But he was saying this
  chosen_korean: 그런데 예수님은 이 말씀을 하셨습니다
  alternatives_korean:
  - 그리고 예수님은 이 말씀을 하셨습니다
  - 예수님은 그렇게 말씀하셨습니다
  lexicon: SBLGNT / BDAG
  rationale: δὲ의 약한 전환을 ‘그런데’로 살리고, ἔλεγεν의 미완료상은 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: πειράζων
  english_pob_choice: to test
  chosen_korean: 시험하시려고
  alternatives_korean:
  - 테스트하시려고
  - 유혹하시려고
  - 시험하여
  lexicon: BDAG
  rationale: 문맥상 유혹이 아니라 시험/검증의 뜻이므로 ‘시험하다’를 택했고, 목적 용법은 ‘-하시려고’로 자연스럽게 반영했습니다.
- source_word: αὐτὸς γὰρ
  english_pob_choice: for he himself
  chosen_korean: 예수님 자신은
  alternatives_korean:
  - 그분은 친히
  - 그는 자신이
  lexicon: BDAG
  rationale: αὐτός의 강조를 ‘자신’으로 살려 예수님의 선행 인식을 분명히 했습니다.
- source_word: ᾔδει τί ἔμελλεν ποιεῖν
  english_pob_choice: knew what he was about to do
  chosen_korean: 무엇을 하실지 이미 알고 계셨습니다
  alternatives_korean:
  - 무엇을 하려고 하시는지 알고 계셨습니다
  - 무엇을 하실 예정인지 알고 계셨습니다
  lexicon: BDAG
  rationale: ἔμελλεν ποιεῖν의 임박/의도 가능성을 과도하게 좁히지 않기 위해 ‘이미 알고 계셨습니다’와 ‘하실지’로 옮겨, 선행 지식의 강조를 유지했습니다.
theological_decisions:
- issue: πειράζων의 신학적 뉘앙스
  chosen_reading: 예수님이 빌립을 죄로 유혹한 것이 아니라 그의 이해와 믿음을 시험하시는 것으로 번역했습니다.
  alternative_readings:
  - 유혹하시려고
  - 떠보시려고
  rationale: 본문의 문맥이 신앙적 검증에 있으므로 ‘시험하다’가 가장 정확하며, 도덕적 유혹 의미는 배제해야 합니다.
  doctrine_reference: 문맥 우선 원칙; 시험과 유혹의 구별 유지
- issue: 예수님의 선지식 강조
  chosen_reading: ‘예수님 자신은’과 ‘이미 알고 계셨습니다’로 선행 인식을 보존했습니다.
  alternative_readings:
  - 예수님은 알고 계셨습니다
  - 예수님은 미리 아셨습니다
  rationale: αὐτός의 강조와 서술의 설명성을 유지하기 위해, 단순한 ‘알고 계셨습니다’보다 강한 표현을 사용했습니다.
  doctrine_reference: 원문 강조 보존; 과잉 해설 자제
