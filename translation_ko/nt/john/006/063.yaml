id: JHN.6.63
reference: John 6:63
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
  footnotes:
  - marker: a
    text: Or 'the spirit gives life.' The Greek πνεῦμα can mean 'Spirit' or 'spirit'; here the context favors the Holy Spirit.
    reason: alternative_reading
  - marker: b
    text: '''The flesh'' may refer broadly to what is merely human; translating it as ''sinful nature'' here would be more interpretive than the Greek requires.'
    reason: lexical_alternative
  - marker: c
    text: Or 'are Spirit and life' or 'are spiritual and life-giving.' The Greek wording is compressed and qualitative.
    reason: alternative_reading
translation:
  language: ko
  text: 영은 생명을 주시는 분이십니다[a]. 육은 아무 유익도 없습니다[b]. 내가 여러분에게 말한 말들은 영이며 생명입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영이 생명을 주십니다.’ 여기서는 문맥이 성령을 가리키는 쪽을 더 강하게 지지합니다.
    reason: alternative_reading
  - marker: b
    text: ‘육’은 넓게는 단지 인간적인 것, 곧 육에 속한 것을 가리킬 수 있습니다. 이를 ‘죄성’으로 옮기면 원문보다 해석이 더 앞서게 됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영이자 생명입니다’ 혹은 ‘영적이며 생명을 주는 것입니다.’ 원문의 표현은 매우 압축되어 있어 질적 의미를 담을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν
  english_pob_choice: It is the Spirit who gives life
  chosen_korean: 영은 생명을 주시는 분이십니다
  alternatives_korean:
  - 성령은 생명을 주십니다
  - 영은 살게 하는 분이십니다
  - 영은 생명을 주는 영입니다
  lexicon: BDAG
  rationale: 첫 절의 τὸ πνεῦμα는 문맥상 생명을 주시는 주체를 가리키므로, 한국어에서는 인격적 주체를 살려 ‘생명을 주시는 분’으로 옮겼습니다. ‘성령’은 의미를 더 분명히 하지만, 원문이 명시하는 바를 지나치게 확정하지 않도록 기본어 ‘영’을 유지했습니다.
- source_word: ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν
  english_pob_choice: the flesh benefits nothing
  chosen_korean: 육은 아무 유익도 없습니다
  alternatives_korean:
  - 육신은 아무 소용이 없습니다
  - 육은 아무 도움도 되지 않습니다
  - 육은 아무것도 유익하게 하지 못합니다
  lexicon: BDAG
  rationale: σάρξ는 여기서 ‘죄성’처럼 신학적으로 좁혀 번역하기보다, 원문이 지시하는 ‘육/육적인 것’의 대비를 살리기 위해 ‘육’으로 옮겼습니다. ὠφελεῖ οὐδέν은 ‘아무 유익도 없다’가 가장 직접적이어서 그 어감을 따랐습니다.
- source_word: τὰ ῥήματα ἃ ἐγὼ λελάληκα ὑμῖν
  english_pob_choice: The words that I have spoken to you
  chosen_korean: 내가 여러분에게 말한 말들은
  alternatives_korean:
  - 내가 여러분에게 말한 말씀들은
  - 내가 여러분에게 전한 말들은
  - 내가 여러분에게 한 말들은
  lexicon: BDAG
  rationale: ῥήματα는 구체적으로 ‘말해진 말들/발화들’이므로 ‘말들’로 옮겨 원문의 복수성을 살렸습니다. λελάληκα의 완료 시제는 지금까지 효력이 남아 있는 발화를 나타내므로 ‘말한’으로 자연스럽게 반영했습니다.
- source_word: πνεῦμά ἐστιν καὶ ζωή ἐστιν
  english_pob_choice: are spirit and are life
  chosen_korean: 영이요 생명입니다
  alternatives_korean:
  - 영이며 생명입니다
  - 영이자 생명입니다
  - 성령이며 생명입니다
  lexicon: BDAG
  rationale: 두 개의 술어를 병렬로 유지하되, 한국어에서는 중복을 줄이기 위해 ‘영이요 생명입니다’로 압축했습니다. 원문의 질적 진술을 살려 ‘성령’보다 ‘영’을 유지했고, ‘spirit and life’의 강한 진술을 훼손하지 않도록 했습니다.
theological_decisions:
- issue: 첫 절의 πνεῦμα의 지시 대상
  chosen_reading: 문맥상 생명을 주시는 성령을 가리키는 것으로 읽되, 본문에는 중립적으로 ‘영’으로 옮겼습니다.
  alternative_readings:
  - 일반적인 영/영적 원리
  - 인간의 영
  rationale: 요한복음 전체 문맥에서 생명을 주시는 주체는 성령과 강하게 연결되지만, 원문 자체가 그 용어를 명시하지는 않습니다. 그래서 해석을 본문 위에 덧씌우지 않도록 본문 번역은 중립적으로 두고, 문맥적 이해는 열어 두었습니다.
  doctrine_reference: 'Affirmations; Translation philosophy #3'
- issue: σάρξ와 πνεῦμα의 대비
  chosen_reading: ‘육’과 ‘영’의 대조를 그대로 유지했습니다.
  alternative_readings:
  - 죄성 vs. 성령
  - 인간의 노력 vs. 하나님의 역사
  rationale: 이 구절의 핵심은 육적인 것의 무익함과 영의 생명 주심을 직접 대비하는 데 있습니다. 이를 특정 교리 용어로 좁히면 요한이 유지한 긴장이 약화되므로, 원문의 대비를 그대로 살렸습니다.
  doctrine_reference: 'Contested terms table for σάρξ; Translation philosophy #3'
