base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
  footnotes:
  - marker: a
    text: Or 'they will all be God-taught.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예언서들에 기록된 바, “하나님께서 가르치신 사람들이 모두 될 것이다.”라고 하였습니다. 아버지에게서 듣고 배우는 사람은 누구나 내게 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께 가르침받은 사람들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  english_pob_choice: It is written
  chosen_korean: 기록된 바
  alternatives_korean:
  - 기록되어 있습니다
  - 기록된 대로
  lexicon: BDAG
  rationale: 관용적인 성경 인용 도입 표현으로, 현재의 기록 상태와 권위를 자연스럽게 살립니다.
- source_word: ἐν τοῖς προφήταις
  english_pob_choice: in the Prophets
  chosen_korean: 예언서들에
  alternatives_korean:
  - 예언자들 안에
  - 예언서 가운데
  lexicon: BDAG
  rationale: 여기서는 인물 일반이 아니라 성경의 예언서 묶음을 가리키는 용법이므로, 문맥상 ‘예언서들’이 가장 분명합니다.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  english_pob_choice: they will all be taught by God
  chosen_korean: 하나님께서 가르치신 사람들이 모두 될 것이다
  alternatives_korean:
  - 모두 하나님께 가르침을 받을 것이다
  - 모두 하나님-가르침을 받은 사람들이 될 것이다
  lexicon: BDAG
  rationale: ‘διδακτοὶ θεοῦ’의 수동적 의미를 살리면서도, 한국어에서 자연스러운 ‘하나님께서 가르치신’으로 옮겼습니다. POB의 주석적 대안인 ‘God-taught’의 직역도 가능하지만 본문에는 본역을 택했습니다.
- source_word: πᾶς ὁ ἀκούσας ... καὶ μαθὼν
  english_pob_choice: Everyone who has heard ... and has learned
  chosen_korean: 아버지에게서 듣고 배우는 사람은 누구나
  alternatives_korean:
  - 아버지에게서 듣고 배운 사람은 모두
  - 아버지에게서 들은 뒤 배운 사람은 누구나
  lexicon: BDAG
  rationale: 분사구의 선행 완료성을 한국어에서 현재적 일반 진리로 자연화해, 결과를 강조하는 ‘...하는 사람은 누구나’로 표현했습니다.
theological_decisions:
- issue: 하나님의 가르침과 예수께 오는 응답의 관계
  chosen_reading: 본문의 순서를 그대로 살려, 하나님께 배우는 사람은 예수께 온다고 번역하고 그 메커니즘은 설명하지 않았습니다.
  alternative_readings:
  - 결정론적으로 더 강하게 해석하는 번역
  - 인간의 자발적 응답을 더 강하게 드러내는 번역
  rationale: 원문은 두 요소의 관계를 진술하지만, 그 신학적 작동 방식을 해명하지 않습니다. 따라서 해석을 덧붙이지 않고 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
