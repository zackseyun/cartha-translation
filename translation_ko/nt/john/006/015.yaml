revisions:
- from: 예수께서 그들이 와서 자기를 왕으로 삼으려고 붙잡으려는 것을 아시고, 다시 혼자 산으로 물러나셨습니다.[a]
  to: 그러므로 예수께서는 그들이 곧 와서 자기를 붙잡아[a] 왕으로 삼으려 한다는 것을 아시고, 다시 혼자 산으로 물러가셨습니다.
  rationale: οὖν을 ‘그러므로’로, μέλλουσιν ἔρχεσθαι를 ‘곧 와서’로 반영하여 원문의 연결성과 임박성을 회복했습니다. ‘붙잡아’는 ἁρπάζειν의 강압적 뉘앙스를 유지하며, 각주는 그 강제성을 더 분명히 하는 대안을 제공합니다. 본문의 의미나 신학적 해석을 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:01Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 γνοὺς, ἁρπάζειν, 목적절, ἀνεχώρησεν, πάλιν 및 αὐτὸς μόνος를 대체로 충실히 반영합니다. 그러나 οὖν의 연결 기능이 빠졌고, μέλλουσιν ἔρχεσθαι의 임박성도 ‘와서’만으로는 충분히 드러나지 않습니다.
  naturalness: ‘그러므로 예수께서는 … 아시고’ 및 ‘곧 와서 … 하려 한다는 것을’은 현대 표준어 합쇼체에서 자연스럽고, 원문의 사건 전개와 긴박성을 분명히 합니다. ‘혼자’는 αὐτὸς μόνος의 강조를 한국어답게 표현합니다.
  terminology: ‘붙잡아 왕으로 삼으려’는 강제적 붙잡음과 왕으로 세우려는 목적을 보존합니다. 각주에서는 ἁρπάζειν의 강제적 대안을 ‘강제로 데려가’로 명료하게 제시합니다.
  issues:
  - severity: medium
    issue: οὖν의 연결 표현이 누락되었습니다.
    rationale: οὖν은 앞선 사건에 이어지는 추론적·서술적 연결을 표시합니다. 한국어 본문에서 ‘그러므로’를 사용해 이 기능을 보존하는 것이 안전합니다.
  - severity: medium
    issue: μέλλουσιν ἔρχεσθαι의 임박성이 충분히 반영되지 않았습니다.
    rationale: ‘와서’만으로는 ‘막/곧 오려고 하다’라는 μέλλω의 임박한 미래 의미가 약해집니다. ‘곧 와서’로 보완할 수 있습니다.
  - severity: low
    issue: 각주 표지가 대체 어휘인 ‘붙잡아’에 직접 붙어 있지 않습니다.
    rationale: 각주는 ἁρπάζειν의 번역 대안을 설명하므로 해당 어휘 뒤에 표지를 두고, 대안도 문법적으로 독립적인 표현으로 정리하는 편이 명확합니다.
  revised_text: 그러므로 예수께서는 그들이 곧 와서 자기를 붙잡아[a] 왕으로 삼으려 한다는 것을 아시고, 다시 혼자 산으로 물러가셨습니다.
