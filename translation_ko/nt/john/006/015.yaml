id: JHN.6.15
reference: John 6:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
  footnotes:
  - marker: a
    text: Or 'take him by force in order to make him king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들이 와서 자기를 왕으로 삼으려고 붙잡으려는 것을 아시고, 다시 혼자 산으로 물러나셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕으로 삼으려고 억지로 데려가려는”으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  english_pob_choice: knowing
  chosen_korean: 아시고
  alternatives_korean:
  - 알고
  - 깨닫고
  lexicon: BDAG
  rationale: 예수께서 상황을 인지하신 뒤의 행위를 나타내므로, 문맥상 가장 자연스럽고 직접적인 「아시고」로 옮겼습니다.
- source_word: μέλλουσιν ἔρχεσθαι
  english_pob_choice: were about to come
  chosen_korean: 와서
  alternatives_korean:
  - 오려고
  - 곧 올 것을 알고
  lexicon: BDAG
  rationale: 임박한 행동을 한국어에서는 현재적 진행으로 간결하게 풀어 「와서」로 처리해, 직역 어색함을 줄이면서 긴박감을 살렸습니다.
- source_word: ἁρπάζειν
  english_pob_choice: seize
  chosen_korean: 붙잡으려는
  alternatives_korean:
  - 빼앗으려는
  - 억지로 데려가려는
  - 잡아채려는
  lexicon: BDAG
  rationale: ἁρπάζειν의 강압적 뉘앙스를 살리되 한국어 문장 흐름을 고려해 「붙잡으려는」으로 옮겼습니다. 단순한 접촉이 아니라 강제로 확보하려는 의미가 드러납니다.
- source_word: ἵνα ποιήσωσιν βασιλέα
  english_pob_choice: in order to make him king
  chosen_korean: 왕으로 삼으려고
  alternatives_korean:
  - 왕으로 만들려고
  - 왕으로 세우려고
  lexicon: BDAG
  rationale: 목적절의 의미를 자연스럽게 살리면서, 예수를 정치적으로 왕위에 올리려는 의도를 간명하게 표현했습니다.
- source_word: ἀνεχώρησεν πάλιν εἰς τὸ ὄρος
  english_pob_choice: withdrew again to the mountain
  chosen_korean: 다시 ... 산으로 물러나셨습니다
  alternatives_korean:
  - 다시 산으로 물러가셨습니다
  - 다시 산으로 들어가셨습니다
  lexicon: BDAG
  rationale: ἀνεχώρησεν의 후퇴·철수 의미를 「물러나셨습니다」로 살렸고, πάλιν은 「다시」로 옮겼습니다. ὄρος는 문맥상 일반적인 산으로 유지했습니다.
- source_word: αὐτὸς μόνος
  english_pob_choice: by himself alone
  chosen_korean: 혼자
  alternatives_korean:
  - 홀로
  - 그 자신만
  lexicon: BDAG
  rationale: 중복 강조는 한국어에서 자연스럽게 한 번만 드러내는 편이 더 읽기 쉬우므로 「혼자」로 압축했습니다.
theological_decisions:
- issue: 군중의 왕 세우기 시도 성격
  chosen_reading: 예수를 자발적으로 추대하는 장면이 아니라, 예수를 강제로 붙잡아 정치적 왕으로 삼으려는 시도로 옮겼습니다.
  alternative_readings:
  - 예수를 왕으로 만들려는 뜻으로
  - 예수를 왕으로 모시려는 뜻으로
  rationale: ἁρπάζειν이 강압성을 분명히 하므로, 이를 완화하면 본문의 정치적·폭력적 성격이 약화됩니다. POB의 영어 판단을 따라 강제성을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
