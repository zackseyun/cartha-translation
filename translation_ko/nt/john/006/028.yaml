translation:
  language: ko
  text: 그들이 예수께 말했습니다. “그러면 우리가 무엇을 해야 하나님의 일들을 할 수 있습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나님의 일들’입니다. 이 표현은 ‘하나님께서 요구하시는 일들’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτόν
  english_pob_choice: Then they said to him
  chosen_korean: 그들이 예수께 말했습니다
  alternatives_korean:
  - 그들이 그분께 말했습니다
  - 그러자 그들이 그에게 말했습니다
  lexicon: SBLGNT; BDAG
  rationale: 화자와 대상의 관계를 자연스럽게 드러내기 위해 ‘예수께’로 구체화했고, οὖν의 흐름은 문장 첫머리의 문맥 연결로 처리했습니다.
- source_word: Τί ποιῶμεν
  english_pob_choice: What must we do
  chosen_korean: 우리가 무엇을 해야
  alternatives_korean:
  - 우리가 무엇을 해야 합니까
  - 우리가 무엇을 하여야
  lexicon: BDAG
  rationale: deliberative question의 요구성을 살리되, 한국어에서는 ‘무엇을 해야’가 가장 자연스럽고 현대적인 질의를 이룹니다.
- source_word: ἐργαζώμεθα τὰ ἔργα
  english_pob_choice: work the works
  chosen_korean: 하나님이 원하시는 일들을 할 수 있습니까
  alternatives_korean:
  - 하나님의 일들을 할 수 있습니까
  - 하나님의 일들을 행할 수 있습니까
  lexicon: BDAG
  rationale: ἔργα의 반복을 한국어에서 완전히 기계적으로 재현하기보다, 본문의 의미를 드러내는 ‘일들’로 옮기되 의미상 대응을 유지했습니다.
- source_word: τοῦ θεοῦ
  english_pob_choice: of God
  chosen_korean: 하나님이 원하시는
  alternatives_korean:
  - 하나님의
  - 하나님께 속한
  lexicon: BDAG
  rationale: 문맥상 가능한 ‘하나님이 요구하시는 일들’의 뜻을 살리면서도, 그리스어 속격의 해석적 개방성을 지나치게 좁히지 않기 위해 ‘원하시는’으로 옮겼습니다.
theological_decisions:
- issue: τὰ ἔργα τοῦ θεοῦ의 속격 의미
  chosen_reading: 주본문은 ‘하나님이 원하시는 일들’로 옮기되, 속격의 해석을 한 가지로 완전히 고정하지는 않았습니다.
  alternative_readings:
  - 하나님의 일들
  - 하나님께 속한 일들
  - 하나님이 하시는 일들
  rationale: 요한복음의 문맥상 이 표현은 요구되는 행위와 하나님께 속한 행위 사이의 긴장을 지닐 수 있으므로, 본문 의미를 자연스럽게 전달하면서도 해석을 과도하게 단정하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
