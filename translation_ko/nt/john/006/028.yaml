base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
  footnotes:
  - marker: a
    text: Or “What should we do so that we may do the works of God?” The Greek can also be understood as “the works God requires.”
