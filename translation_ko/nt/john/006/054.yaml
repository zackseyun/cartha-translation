  to: 내 살을 먹고[a] 내 피를 마시는 사람은 영생을 가지고 있습니다. 나는 그를 마지막 날에 다시 살리겠습니다.[b]
  rationale: τρώγω의 어휘 각주에 있던 오역을 제거하고 실제 가능한 대안인 ‘먹어 치운다’와 ‘씹는다’를 제시했습니다. 현재 소유를 나타내는 ἔχει는 ‘가지고 있습니다’로 자연스럽게 옮겼습니다. ἀναστήσω는 본문에서 부활 의미가 분명한 ‘다시 살리겠습니다’로 유지하되, 직역적 대안을 각주로 제공했습니다. 성례전적·비유적 해석은 본문에 덧붙이지 않았습니다.
