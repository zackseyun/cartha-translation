id: JHN.6.54
reference: John 6:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
  footnotes:
  - marker: a
    text: Or 'feeds on' or more vividly 'chews.' The Greek verb τρώγω is more concrete than a generic word for eating.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''I will raise him up.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 살을 먹고[a] 내 피를 마시는 사람은 영생을 가지고 있습니다. 나는 그를 마지막 날에 다시 살리겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹어 치운다’, 더 생생하게는 ‘씹는다’. 그리스어 τρώγω는 일반적인 ‘먹다’보다 더 구체적인 동사입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그를 일으키겠습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  english_pob_choice: The one who eats
  chosen_korean: 먹고
  alternatives_korean:
  - 먹는 사람
  - 섭취하는 사람
  lexicon: BDAG
  rationale: 현재분사 ὁ τρώγων의 지속적·인격적 성격을 한국어에서는 ‘먹는 사람’보다 자연스러운 동사 연결로 살려 ‘먹고’로 옮겼습니다. 문맥상 주체를 가리키므로 명사화보다 행위 중심 표현이 더 직접적입니다.
- source_word: μου τὴν σάρκα
  english_pob_choice: my flesh
  chosen_korean: 내 살
  alternatives_korean:
  - 내 육체
  - 내 몸
  lexicon: BDAG
  rationale: σάρξ는 이 절에서 구체적이고 문자적인 의미이므로 교회적 관용어인 ‘몸’보다 직역에 가까운 ‘살’을 택했습니다. 영어 POB의 ‘flesh’와 같은 긴장을 한국어에서도 유지합니다.
- source_word: τὸ αἷμα
  english_pob_choice: my blood
  chosen_korean: 내 피
  alternatives_korean:
  - 내 혈액
  lexicon: BDAG
  rationale: αἷμα는 문자적으로 ‘피’이며, 문맥상 완곡화하지 않고 그대로 옮겨야 합니다. ‘혈액’은 현대어로는 과도하게 생물학적이어서 본문 톤을 흐릴 수 있습니다.
- source_word: ἔχει ζωὴν αἰώνιον
  english_pob_choice: has eternal life
  chosen_korean: 영생을 가지고
  alternatives_korean:
  - 영생을 얻고
  - 영원한 생명을 가지고
  lexicon: BDAG
  rationale: ἔχει의 현재 소유 뉘앙스를 살려 ‘가지고’로 옮겼습니다. ζωὴ αἰώνιος는 요한문헌의 정형 표현이므로 ‘영생’이 가장 간결하고 자연스럽습니다.
- source_word: ἀναστήσω
  english_pob_choice: will raise
  chosen_korean: 다시 살리겠습니다
  alternatives_korean:
  - 다시 일으키겠습니다
  - 일으켜 세우겠습니다
  lexicon: BDAG
  rationale: 부활 문맥에서 ἀναστήσω는 단순한 ‘들어 올리다’보다 죽은 자를 다시 살리는 의미가 강하므로 ‘다시 살리겠습니다’로 옮겼습니다. 영어 POB의 ‘raise’와 대응하면서 한국어 독자에게 뜻이 분명합니다.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  english_pob_choice: on the last day
  chosen_korean: 마지막 날에
  alternatives_korean:
  - 끝날에
  - 최후의 날에
  lexicon: BDAG
  rationale: 요한복음의 종말론적 관용구를 자연스러운 한국어로 옮겼습니다. ‘마지막 날’이 문맥상 가장 널리 이해되며, ‘에’는 헬라어 여격의 시간 용법을 무리 없이 반영합니다.
theological_decisions:
- issue: 먹고 마시는 언어를 성례전적 또는 비유적으로 미리 해석할지 여부
  chosen_reading: 주요 본문은 문자적·구체적 표현을 유지하고 해석은 열어 둡니다.
  alternative_readings:
  - 성찬을 직접 가리키는 표현으로 정리하기
  - 믿음을 비유한 표현으로 풀어쓰기
  rationale: 원문은 ‘살’, ‘피’, ‘먹다’, ‘마시다’의 구체적 언어를 사용하므로, 본문 자체에서 신학적 긴장을 해소하지 않고 유지하는 것이 가장 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: αὐτόν의 성별 표지 보존 여부
  chosen_reading: 그를
  alternative_readings:
  - 그 사람을
  - 그분을
  rationale: 헬라어 남성 단수 대명사를 그대로 반영해 인칭·문법 표지를 유지했습니다. 한국어의 ‘그를’은 문법상 자연스러우면서도 원문의 지시 대상을 보존합니다.
  doctrine_reference: 'Translation philosophy §4: Gender-accurate over gender-neutral.'
