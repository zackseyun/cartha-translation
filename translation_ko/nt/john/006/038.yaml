  source_fidelity: 헬라어의 인과적 설명과 목적 대조를 자연스럽게 반영합니다. ‘내가 하늘에서 내려온 것은 … 것이 아니라 … 것입니다’는 ὅτι 이하의 설명을 한국어 문장 구조에 맞게 옮기며, καταβέβηκα의 완료적 결과도 ‘내려온’으로 무리 없이 표현합니다. ‘하늘에서’와 ‘나를 보내신 분’도 원문의 표현을 충실히 보존합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽고 명료합니다. ‘뜻을 행하려는’의 반복은 원문의 병렬과 대조를 살리며, 문체상 어색하지 않습니다.
  terminology: θέλημα를 두 차례 모두 ‘뜻’으로 옮겨 원문의 반복과 신학적으로 중요한 대조를 유지했습니다. ‘나를 보내신 분’은 τοῦ πέμψαντός με를 불필요하게 특정하지 않고 자연스럽게 번역합니다.
