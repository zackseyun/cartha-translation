id: JHN.6.38
reference: John 6:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: ko
  text: 내가 하늘에서 내려온 것은 내 뜻을 행하려는 것이 아니라, 나를 보내신 분의 뜻을 행하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβέβηκα
  english_pob_choice: I have come down
  chosen_korean: 내려온 것은
  alternatives_korean:
  - 내려왔습니다
  - 내려왔던 것은
  - 하강한 것은
  lexicon: BDAG
  rationale: 완료 시상의 현재적 효력을 살리면서도 한국어에서는 자연스럽게 ‘내려온 것’으로 풀어, 하늘에서의 하강과 지금의 관련성을 함께 드러냈습니다.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘로부터 내려온
  - 천국에서
  lexicon: BDAG
  rationale: 요한복음의 공간적·신학적 이미지를 살리기 위해 직역에 가까운 ‘하늘에서’를 택했고, ‘천국’은 본문의 하늘/기원 표지를 좁혀 버릴 수 있어 피했습니다.
- source_word: τὸ θέλημα τὸ ἐμὸν / τὸ θέλημα τοῦ πέμψαντός με
  english_pob_choice: my own will / the will of the one who sent me
  chosen_korean: 내 뜻 / 나를 보내신 분의 뜻
  alternatives_korean:
  - 내 의지 / 나를 보내신 이의 뜻
  - 내가 원하는 바 / 나를 보내신 분이 원하시는 것
  lexicon: BDAG
  rationale: θέλημα를 ‘뜻’으로 옮겨 개인적 의도와 신학적 목적을 함께 살렸고, 반복되는 병렬을 유지하기 위해 두 곳 모두 같은 낱말을 사용했습니다. ‘나를 보내신 분’은 예수의 파송 관계를 드러내는 articular participle을 자연스럽게 반영합니다.
theological_decisions:
- issue: 아들의 하늘에서의 내려옴과 파송의 진술을 어떻게 드러낼지
  chosen_reading: ‘내가 하늘에서 내려온 것’으로 직설적으로 옮겨, 단순한 사명 위임 이상의 하늘 기원 진술을 유지했습니다.
  alternative_readings:
  - ‘내가 하나님께로부터 왔다’처럼 보다 완곡하게 옮기는 방식
  - 은유적 파송 언어로만 처리하는 방식
  rationale: 본문은 예수의 출처를 하늘로 명시하므로, 이를 약화시키지 않고 그대로 드러내는 것이 요한복음의 문맥과 본문의 힘을 보존합니다.
  doctrine_reference: 요한복음의 그리스도론적 자기증언; 니케아 신경(381)과 칼케돈(451)의 기독론과 양립
