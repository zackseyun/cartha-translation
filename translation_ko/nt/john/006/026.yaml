id: JHN.6.26
reference: John 6:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
  footnotes:
  - marker: a
    text: Or 'you seek me ... because you ate the bread and were satisfied.' The Greek more literally says 'from the loaves' and uses a verb meaning 'were filled' or 'were satisfied.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 대답하여 말씀하셨습니다. “진실로 진실로 내가 너희에게 말합니다. 너희는 표적들을 보았기 때문에가 아니라, 떡을 먹고[a] 배부르게 되었기 때문에 나를 찾고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 떡들 중에서 먹고’ 또는 ‘그 떡들로부터 먹고’입니다. 원문은 복수형 ‘떡들’과 ἐκ(‘~중에서/로부터’)를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  english_pob_choice: Jesus answered them ...
  chosen_korean: 예수께서 그들에게 대답하여 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 대답하셨습니다
  - 예수께서 그들에게 대답하여 이르셨습니다
  lexicon: SBLGNT / BDAG
  rationale: 헬라어의 중복된 발화 도입(“대답하여 말씀하셨습니다”)을 자연스러운 한국어로 옮기되, 응답의 동사와 발화 도입을 함께 살렸습니다.
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 아멘 아멘
  - 참으로 참으로
  lexicon: BDAG
  rationale: 요한복음의 장중한 이중 아멘 공식을 현대 표준어에서 읽기 쉬우면서도 엄숙하게 전달하는 표현으로 옮겼습니다.
- source_word: σημεῖα
  english_pob_choice: signs
  chosen_korean: 표적들
  alternatives_korean:
  - 기적들
  - 표징들
  lexicon: BDAG
  rationale: 요한복음의 σημεῖα는 단순한 기적보다 의미를 가리키는 ‘표적’의 성격이 강하므로, 신학적 뉘앙스를 살려 복수형으로 옮겼습니다.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  english_pob_choice: you ate from the loaves
  chosen_korean: 빵들을 먹고
  alternatives_korean:
  - 빵들에서 먹고
  - 빵들로부터 먹고
  lexicon: BDAG
  rationale: ἐκ τῶν ἄρτων의 부분적 의미를 살리되 한국어에서는 ‘빵들을 먹고’가 가장 자연스럽습니다. 복수형은 앞선 떡의 기적을 가리킵니다.
- source_word: ἐχορτάσθητε
  english_pob_choice: were filled
  chosen_korean: 배부르게 되었기 때문에
  alternatives_korean:
  - 배가 불렀기 때문에
  - 만족했기 때문에
  lexicon: BDAG
  rationale: 단순한 만족이 아니라 먹고 충분히 채워진 상태를 나타내므로, 원인의 절 안에서 자연스럽게 ‘배부르게 되다’로 옮겼습니다.
theological_decisions:
- issue: σημεῖα의 의미를 ‘기적’이 아니라 ‘표적’으로 유지할지 여부
  chosen_reading: ‘표적들’로 옮겨, 행위가 가리키는 계시적 의미를 드러냈습니다.
  alternative_readings:
  - 기적들
  - 표징들
  rationale: 문맥에서 예수의 행위는 단순한 놀라운 사건이 아니라 자신을 가리키는 표지이므로, 요한복음의 신학적 어휘를 보존하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
