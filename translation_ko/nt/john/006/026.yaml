  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 그러나 현 본문은 ἐκ τῶν ἄρτων의 ‘떡들 중에서/떡으로부터’라는 부분·출처의 뉘앙스를 자연스러운 한국어를 위해 명시적으로 옮기지 않았는데, 각주는 그것을 ‘살린 표현’이라고 하여 본문과 맞지 않습니다. 또한 ἄρτοι는 이 문맥에서 한국어 성경 문체상 ‘빵들’보다 ‘떡’이 자연스럽습니다.
  naturalness: ‘예수께서 그들에게 대답하여 말씀하셨습니다’와 ‘진실로 진실로’는 장중한 합쇼체 서술로 허용됩니다. 다만 ‘빵들을 먹고’는 현대 표준 한국어에서 부자연스럽고, 문맥상 ‘떡을 먹고’가 자연스럽습니다. ‘배부르게 되었기 때문에’는 적절합니다.
  terminology: σημεῖα를 ‘표적들’로 옮긴 것은 요한복음의 핵심 어휘를 보존하며 적절합니다. ἄρτοι는 ‘떡’으로 옮기는 것이 한국어 성경 용례와 자연스러운 독법에 맞습니다. ἐκ의 직역적 뉘앙스는 본문에 억지로 삽입하지 말고 정확한 각주로 밝혀야 합니다.
