id: JHN.6.52
reference: John 6:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
  footnotes:
  - marker: a
    text: Or 'the Judeans' or, contextually, 'the Jewish leaders.' The Greek reads simply 'the Jews.'
    reason: alternative_reading
  - marker: b
    text: Or 'his body.' The Greek word is 'flesh' (σάρξ), retained here to preserve the concrete wording and tension of the passage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 유대인들이 서로 다투며 말했습니다. 「이 사람이 어떻게 자기 살을 우리에게 먹게 줄 수 있습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들’, 문맥상 ‘유대인 지도자들’일 수도 있습니다. 헬라어 본문은 단순히 ‘유대인들’이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 몸’. 헬라어 단어는 ‘살’(σάρξ)이며, 이 구절의 구체적 표현과 긴장을 보존하기 위해 여기에 그대로 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  english_pob_choice: were arguing
  chosen_korean: 서로 다투며
  alternatives_korean:
  - 서로 논쟁하며
  - 서로 말다툼하며
  - 서로 싸우며
  lexicon: BDAG
  rationale: 미완료 과거의 지속적 갈등을 한국어 자연문으로 살리면서, 물리적 싸움까지는 단정하지 않도록 했습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대인 지도자들
  - 유대 사람들
  - 유다 사람들
  lexicon: BDAG
  rationale: 본문의 직접 표현을 따르되, 현대 한국어에서는 단수형 집단 명사보다 복수형 주어가 자연스러워 ‘유대인들’로 옮겼습니다.
- source_word: σάρκα
  english_pob_choice: flesh
  chosen_korean: 살
  alternatives_korean:
  - 육체
  - 몸
  - 고기
  lexicon: BDAG
  rationale: 영어 POB가 ‘flesh’를 유지한 것처럼, 여기서는 상징적으로 완화하지 않고 구체성과 충격을 살리는 ‘살’을 택했습니다.
- source_word: τὴν σάρκα αὐτοῦ
  english_pob_choice: his flesh
  chosen_korean: 자기 살
  alternatives_korean:
  - 그의 살
  - 자신의 육체
  - 자기 몸
  lexicon: BDAG
  rationale: 직접 인칭대명사보다 한국어에서 자연스러운 재귀 표현을 택해, 예수의 몸에 대한 구체적·감각적 표현을 보존했습니다.
theological_decisions:
- issue: σάρξ의 처리
  chosen_reading: ‘살’로 직역해 물리적·충격적 의미를 유지했습니다.
  alternative_readings:
  - 몸
  - 육체
  rationale: 이 구절은 청중이 예수의 말을 문자적으로 받아들이는 장면이므로, 의미를 완화하는 해석어보다 원어의 긴장을 드러내는 표현이 필요합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: σάρξ *sarx* → ''flesh'' (literal) / ''sinful nature'' (metaphorical)'
- issue: οἱ Ἰουδαῖοι의 범위
  chosen_reading: 본문의 직접 표현을 따라 ‘유대인들’로 두었습니다.
  alternative_readings:
  - 유대인 지도자들
  - 유대 사람들
  rationale: 요한복음의 문맥상 범위에 대한 논의가 있으나, 본문 자체는 더 좁히지 않으므로 번역문에서 해석적으로 제한하지 않았습니다.
  doctrine_reference: 원문 우선 원칙 및 해석적 좁힘 자제
