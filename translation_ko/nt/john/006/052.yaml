  verdict: revise
  source_fidelity: 원문의 미완료 시제(지속되는 논쟁), 상호성, ‘이 사람’의 거리 두는 어조, 그리고 σάρξ의 구체적인 ‘살’은 대체로 충실히 반영되었습니다. 다만 ‘자기 살을 우리에게 먹게 줄 수 있습니까?’는 한국어 문법과 결합 관계가 부자연스러워, δοῦναι … φαγεῖν(‘우리에게 그의 살을 주어 먹게 하다/먹을 수 있게 하다’)의 관계를 분명히 해야 합니다.
  naturalness: ‘서로 다투며 말했습니다’는 자연스럽고 합쇼체 서술에 맞습니다. 그러나 ‘먹게 줄’은 현대 표준어에서 어색하며, 누가 무엇을 먹는지와 ‘주다’의 목적 관계가 불명확해집니다. ‘주어 먹게 할 수 있습니까?’로 고치면 자연스럽고 원문의 뜻도 보존됩니다.
  terminology: ‘유대인들’은 οἱ Ἰουδαῖοι의 직접적 표현을 보존하며, 범위를 좁히지 않는 점에서 적절합니다. σάρξ를 ‘살’로 옮긴 것도 ‘몸’으로 신학적으로 완화하지 않고 원문의 구체성과 긴장을 보존합니다. 각주 a는 ‘유대인들’에, 각주 b는 ‘살’에 직접 붙이는 것이 각주의 대상어를 명확히 합니다.
