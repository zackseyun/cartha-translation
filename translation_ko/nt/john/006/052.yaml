  rationale: 문법적으로 어색한 ‘먹게 줄’을 ‘주어 먹게 할’로 고쳐, δοῦναι와 φαγεῖν의 관계를 자연스러운 한국어로 재현했습니다. ‘유대인들’과 ‘살’은 유지했으며, 각주 표지를 해당 본문어에 옮겨 각주의 참조 대상을 명확히 했습니다.
