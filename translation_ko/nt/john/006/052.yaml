base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
  footnotes:
  - marker: a
    text: Or 'the Judeans' or, contextually, 'the Jewish leaders.' The Greek reads simply 'the Jews.'
    reason: alternative_reading
  - marker: b
    text: Or 'his body.' The Greek word is 'flesh' (σάρξ), retained here to preserve the concrete wording and tension of the passage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 유대인들이[a] 서로 다투며 말했습니다. 「이 사람이 어떻게 우리에게 자기 살을[b] 주어 먹게 할 수 있습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들’, 문맥상 ‘유대인 지도자들’일 수도 있습니다. 헬라어 본문은 단순히 ‘유대인들’이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 몸’. 헬라어 단어는 ‘살’(σάρξ)이며, 이 구절의 구체적 표현과 긴장을 보존하기 위해 여기에 그대로 두었습니다.
    reason: lexical_alternative
