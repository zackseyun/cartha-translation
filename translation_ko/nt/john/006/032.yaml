- from: 그러므로 예수께서 그들에게 말씀하셨습니다. 「진실로 진실로 내가 너희에게 말합니다. 모세가 너희에게 하늘에서 내려온 떡을 준 것이 아니라, 내 아버지께서 너희에게 하늘에서 내려온 참된 떡을 주십니다.」[a][b]
  to: 그러자 예수께서 그들에게 말씀하셨습니다. “진실로 진실로 내가 너희에게 말합니다. 모세가 너희에게 하늘에서 온 떡을 준 것은 아닙니다.[a] 오히려 내 아버지께서 너희에게 하늘에서 온 참된 떡을 주십니다.[b]”
  rationale: 원문에 없는 ‘내려온’을 제거하여 ἐκ τοῦ οὐρανοῦ의 표현을 보존했습니다. οὖν은 자연스러운 담화 연결로 ‘그러자’로 옮겼습니다. 모세에 관한 부정과 아버지의 현재적 ‘주십니다’의 대조를 유지하고, 각주 표지를 해당 어구 바로 뒤로 옮겨 범위를 명확히 했습니다.
