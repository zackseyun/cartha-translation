id: JHN.6.32
reference: John 6:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
  footnotes:
  - marker: a
    text: Or, 'it was not Moses who gave you the bread from heaven.' The Greek places the negation before 'Moses,' making the contrast in agency especially prominent.
    reason: lexical_alternative
  - marker: b
    text: '''True bread'' can also mean ''real'' or ''genuine'' bread—the ultimate bread from heaven, not merely the earlier manna as a sign.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수께서 그들에게 말씀하셨습니다. 「진실로 진실로 내가 너희에게 말합니다. 모세가 너희에게 하늘에서 내려온 떡을 준 것이 아니라, 내 아버지께서 너희에게 하늘에서 내려온 참된 떡을 주십니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모세가 너희에게 하늘에서 내려온 떡을 준 것이 아니라’로도 옮길 수 있습니다. 헬라어는 부정을 ‘모세’ 앞에 두어 공급의 주체를 더욱 강하게 대비합니다.
    reason: alternative_reading
  - marker: b
    text: ‘참된 떡’은 ‘실제의 떡’ 또는 ‘진짜 떡’의 뜻도 될 수 있습니다. 그러나 여기서는 앞선 만나를 넘어서는 궁극적 떡이라는 요한의 뉘앙스를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν οὖν αὐτοῖς
  english_pob_choice: So Jesus said to them
  chosen_korean: 그러므로 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그래서 예수께서 그들에게 말씀하셨습니다
  - 그때 예수께서 그들에게 말씀하셨습니다
  lexicon: SBLGNT
  rationale: οὖν의 이어짐과 문맥적 결론성을 살려 ‘그러므로’로 옮기되, 한국어 문장 흐름은 자연스럽게 유지했습니다.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly, truly, I say to you
  chosen_korean: 진실로 진실로 내가 너희에게 말합니다
  alternatives_korean:
  - 아멘 아멘 내가 너희에게 말합니다
  - 참으로 참으로 내가 너희에게 말합니다
  lexicon: BDAG
  rationale: 요한복음의 엄숙한 이중 서두를 반복으로 살리되, 현대 한국어에서 바로 이해되는 ‘진실로 진실로’로 옮겼습니다.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  english_pob_choice: the bread from heaven
  chosen_korean: 하늘에서 내려온 떡
  alternatives_korean:
  - 하늘에서 온 떡
  - 하늘의 떡
  lexicon: BDAG
  rationale: ἐκ τοῦ οὐρανοῦ를 한국어에서 자연스럽고 구체적으로 드러내기 위해 ‘하늘에서 내려온’으로 옮겼고, ἄρτον은 본문 문맥의 만나-생명 빵 연상을 살려 ‘떡’으로 번역했습니다.
- source_word: τὸν ἀληθινόν
  english_pob_choice: the true
  chosen_korean: 참된
  alternatives_korean:
  - 진짜의
  - 진정한
  lexicon: BDAG
  rationale: ἀληθινός의 ‘진짜’보다도, 요한복음에서 자주 드러나는 참됨/궁극적 실재의 뉘앙스를 한국어 ‘참된’이 가장 안정적으로 전달합니다.
theological_decisions:
- issue: 모세와 아버지의 대조적 공급 주체
  chosen_reading: 모세는 ‘준 것이 아니라’로, 아버지는 ‘주십니다’로 옮겨 현재의 공급과 대비를 살렸습니다.
  alternative_readings:
  - 모세가 주지 않았습니다... 아버지께서 주십니다
  - 모세가 너희에게 준 분이 아닙니다... 아버지께서 주십니다
  rationale: 본문은 모세의 과거적 역할과 아버지의 현재적 주심을 대조합니다. 한국어에서도 시제를 분명히 구분해 요한의 논지를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘참된 떡’의 해석 범위
  chosen_reading: ‘참된 떡’을 본문에 그대로 두어, 단순한 ‘실제의 떡’이 아니라 표징을 넘어서는 궁극적 실재라는 긴장을 보존했습니다.
  alternative_readings:
  - 실제의 떡
  - 진짜 떡
  rationale: 요한복음의 ἀληθινός는 종종 앞선 표상보다 더 깊은 বাস্ত재를 가리키므로, 해설적 풀어쓰기보다 본문 표현을 유지하는 편이 source에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
