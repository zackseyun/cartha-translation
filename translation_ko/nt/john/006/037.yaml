id: JHN.6.37
reference: John 6:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
  footnotes:
  - marker: a
    text: Or 'All that the Father gives me will come to me.' The Greek uses a neuter singular collective expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will never cast out' or 'I will by no means cast out.' The Greek expression is an emphatic negation.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지께서 내게 주시는 모든 것은[a] 내게로 올 것이며, 내게 오는 사람은 내가 결코 밖으로 내쫓지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 중성 단수 집합 표현을 반영한 번역입니다. 원문은 개인을 직접 지칭하기보다 ‘모두/모든 것’의 형태를 사용합니다.
    reason: source_note
  - marker: b
    text: ‘결코 … 내쫓지 않을 것입니다’는 οὐ μὴ의 강한 부정을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  english_pob_choice: All that
  chosen_korean: 모두
  alternatives_korean:
  - 모든 것
  - 내게 주시는 모든 것
  - 다
  lexicon: BDAG
  rationale: 중성 단수의 집합적 표현을 한국어에서 가장 자연스럽게 살리기 위해 ‘모두’로 옮겼습니다. 개인을 직접 지칭하는 방식으로 좁히지 않고, 집합적 의미를 유지합니다.
- source_word: δίδωσίν μοι
  english_pob_choice: gives me
  chosen_korean: 내게 주시는
  alternatives_korean:
  - 내게 주는
  - 내게 주고 계시는
  - 내게 주셨던
  lexicon: BDAG
  rationale: 현재형의 주는 동작을 살리되, 한국어에서는 존칭을 고려해 ‘주시는’으로 옮겼습니다. 완료로 굳히지 않고 원문의 현재성을 유지합니다.
- source_word: τὸν ἐρχόμενον πρός με
  english_pob_choice: the one who comes to me
  chosen_korean: 내게 오는 사람
  alternatives_korean:
  - 내게 나아오는 사람
  - 내게 오는 자
  - 누구든지 내게 오는 사람
  lexicon: BDAG
  rationale: 분사구의 일반적·반복적 의미를 자연스러운 한국어로 풀어 ‘내게 오는 사람’으로 옮겼습니다. ‘자’보다 현대적이며, ‘누구든지’는 원문의 관사 있는 분사 형태를 약간 더 풀어쓴 표현입니다.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  english_pob_choice: I will certainly not cast out
  chosen_korean: 결코 밖으로 내쫓지 않을 것입니다
  alternatives_korean:
  - 결코 내쫓지 않을 것입니다
  - 절대로 밖으로 내쫓지 않을 것입니다
  - 밖으로 내쫓아 버리지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μὴ의 강한 부정을 ‘결코’로, ἐκβάλω ἔξω의 배제 이미지를 ‘밖으로 내쫓다’로 살렸습니다. ‘밖으로’는 단순한 거절이 아니라 바깥으로 밀어내는 뜻을 드러냅니다.
theological_decisions:
- issue: πᾶν ὃ의 집합적 중성 표현을 개인화할지 여부
  chosen_reading: 집합적 의미를 유지해 ‘아버지께서 내게 주시는 것은 모두’로 번역했습니다.
  alternative_readings:
  - 아버지께서 내게 주시는 모든 사람은
  - 아버지께서 내게 주시는 것마다
  rationale: 헬라어가 중성 단수 집합 표현을 사용하므로, 개인을 명시적으로 좁히기보다 문법적 긴장을 유지했습니다. 이는 본문이 말하는 범위를 한국어에서 성급하게 해석하지 않게 합니다.
  doctrine_reference: 문법과 신학적 해석의 긴장을 보존합니다.
- issue: οὐ μὴ ἐκβάλω ἔξω의 강한 부정의 강도
  chosen_reading: 예수님의 수용을 강하게 보장하는 표현으로 옮겼습니다.
  alternative_readings:
  - 결코 내쫓지 않을 것입니다
  - 다시는 내쫓지 않을 것입니다
  rationale: 본문의 초점은 내게 오는 사람을 확실히 받아들이신다는 약속입니다. 이를 종말론적·교리적 결론으로 확장하지 않고, 본문 자체의 강한 보증을 유지했습니다.
  doctrine_reference: 본문이 직접 말하는 범위를 넘는 교리적 단정을 피합니다.
