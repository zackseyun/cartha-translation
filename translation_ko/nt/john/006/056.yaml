  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
  footnotes:
  - marker: a
    text: Or 'feeds on' / 'chews'; the Greek verb is more vivid than a generic word for eating.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional: ''abides in me, and I in him.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 살을 먹고 내 피를 마시는 사람은 내 안에 머물고, 나도 그 사람 안에 머뭅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹고 산다’ / ‘씹는다’. 그리스어 동사는 일반적인 ‘먹다’보다 더 생생합니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘내 안에 거하고, 나도 그 안에 거하느니라’로 옮깁니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ τρώγων
  english_pob_choice: The one who eats
  chosen_korean: 내 살을 먹는 사람
  alternatives_korean:
  - 내 살을 먹는 자
  - 내 살을 먹는 이
  - 내 살을 먹어 가는 사람
  lexicon: BDAG
  rationale: 정관사+현재분사는 특정 행동으로 특징지어지는 사람을 가리키므로, 자연스러운 현대 한국어로는 ‘먹는 사람’이 가장 잘 대응합니다.
- source_word: τρώγων
  english_pob_choice: eats
  chosen_korean: 먹고
  alternatives_korean:
  - 씹고
  - 먹어 삼키고
  - 먹어
  lexicon: BDAG
  rationale: τρώγω의 더 생생한 뉘앙스를 한국어로 과도하게 해석하지 않으면서도, 본문이 단순한 일반어보다 강한 육체적 이미지를 띤다는 점은 ‘먹고’로 충분히 유지할 수 있습니다.
- source_word: ἐν ἐμοὶ μένει
  english_pob_choice: remains in me
  chosen_korean: 내 안에 머물고
  alternatives_korean:
  - 내 안에 남고
  - 내 안에 거하고
  - 내 안에 abide하고
  lexicon: BDAG
  rationale: μένω의 요한 문맥상 지속적 관계를 살리기 위해 ‘머물다’를 선택했습니다. ‘거하다’는 전통적이지만 현대 한국어에서는 덜 자연스럽습니다.
- source_word: κἀγὼ ἐν αὐτῷ
  english_pob_choice: and I in him
  chosen_korean: 나도 그 사람 안에 머뭅니다
  alternatives_korean:
  - 나도 그 안에 머뭅니다
  - 그리고 나는 그 사람 안에 있습니다
  - 나도 그 안에 머물고
  lexicon: BDAG
  rationale: 그리스어는 뒤의 동사를 생략한 병렬 구조이므로, 한국어에서는 자연스럽게 ‘머뭅니다’를 보충해 상호 내주를 분명히 드러냈습니다.
- source_word: σάρκα
  english_pob_choice: my flesh
  chosen_korean: 내 살
  alternatives_korean:
  - 내 육체
  - 내 육신
  - 내 몸
  lexicon: BDAG
  rationale: σάρξ는 여기서 예수의 실제 ‘살’과 수난-희생적 이미지를 가리키므로, 신학적 완곡어인 ‘육체’보다 직접적인 ‘살’이 원문에 가깝습니다.
- source_word: αἷμα
  english_pob_choice: my blood
  chosen_korean: 내 피
  alternatives_korean:
  - 내 혈액
  - 내 핏줄
  lexicon: BDAG
  rationale: ‘피’는 본문의 충격적 희생 제의적 이미지를 그대로 보존해야 하므로, 일상화된 다른 표현으로 바꾸지 않았습니다.
theological_decisions:
- issue: 성찬적/비유적 해석을 본문에 미리 결정할지 여부
  chosen_reading: 본문은 해석을 덧붙이지 않고, ‘내 살을 먹고 내 피를 마시는’이라는 원문의 구체적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 성찬을 직접 가리키는 표현을 명시함
  - 믿음을 뜻하는 비유로 풀이함
  rationale: 이 절의 신학적 해석은 전통에 따라 갈리므로, 번역문에서 어느 한 해석으로 봉합하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
- issue: μένω의 번역
  chosen_reading: ‘머물다’를 사용해 요한복음의 상호 내주를 관계적 지속성으로 표현했습니다.
  alternative_readings:
  - ‘거하다’
  - ‘붙어 있다’
  - ‘합일하다’
  rationale: ‘머물다’는 현대 한국어에서 자연스럽고, 신비주의적 또는 교리적 과잉 해석 없이 상호 내주의 의미를 전달합니다.
  doctrine_reference: Translation philosophy §1 Original-language primacy; §6 Readable modern English.
