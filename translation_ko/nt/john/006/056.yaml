translation:
  language: ko
  text: 내 살을 먹고[a] 내 피를 마시는 사람은 내 안에 머물고, 나도 그 사람 안에 머뭅니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘씹어 먹는다’. 그리스어 동사는 일반적인 ‘먹다’보다 더 생생한 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 ‘내 안에 거하고, 나도 그 안에 거한다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ τρώγων
  english_pob_choice: The one who eats
  chosen_korean: 내 살을 먹는 사람
  alternatives_korean:
  - 내 살을 먹는 자
