  source_fidelity: 본문은 τρώγων과 πίνων의 현재분사 병렬, ‘살’과 ‘피’의 구체성, 그리고 μένει의 상호적 관계를 충실히 옮깁니다. 다만 각주 a의 ‘먹고 산다’는 τρώγω의 가능한 의미가 아니므로 삭제·수정해야 합니다. 뒤 절의 생략된 동사를 ‘머뭅니다’로 보충한 것은 한국어 문장에서는 자연스럽고 의미상 정당합니다.
  naturalness: ‘내 살을 먹고 내 피를 마시는 사람은 내 안에 머물고, 나도 그 사람 안에 머뭅니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 어휘 각주는 ‘씹어 먹는다’처럼 간명하게 제시하는 편이 더 자연스럽고 정확합니다.
