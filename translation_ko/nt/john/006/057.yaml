revisions:
- from: 아버지께서 살아 계시듯이 나를 보내셨고, 나도 아버지 때문에 삽니다. 나를 먹는 그 사람도 나 때문에 살 것입니다.[a][b]
  to: 살아 계신 아버지께서 나를 보내신 것처럼, 나도 아버지로 말미암아 삽니다. 나를 먹는[a] 사람도 나로 말미암아 살 것입니다.[b]
  rationale: 비교 접속사 καθὼς의 범위와 ‘살아 계신’의 수식 대상을 바로잡아 원문의 문장 구조를 보존했습니다. 두 διά 구문은 “~로 말미암아”로 일관되게 옮겨 인과적 의미와 평행을 드러냈습니다. ‘먹는’은 τρώγω의 구체성을 유지하며, 각주는 본문과 중복되지 않는 직역적 대안을 제시하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:08Z'
