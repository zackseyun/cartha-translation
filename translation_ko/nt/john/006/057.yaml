id: JHN.6.57
reference: John 6:57
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
  footnotes:
  - marker: a
    text: Or 'the one who eats me.' The Greek verb is vivid and concrete, literally referring to eating/chewing.
    reason: lexical_alternative
  - marker: b
    text: Or 'through the Father' and 'through me.' The Greek preposition can be understood in a causal or instrumental sense; here the main text uses the causal sense to preserve the Father-Son / Son-believer parallel.
    reason: alternative_reading
translation:
  language: ko
  text: 아버지께서 살아 계시듯이 나를 보내셨고, 나도 아버지 때문에 삽니다. 나를 먹는 그 사람도 나 때문에 살 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 먹는 사람.” 헬라어 동사는 매우 생생하고 구체적으로, 문자적으로는 먹거나 씹는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “아버지를 통해”와 “나를 통해.” 헬라어 전치사는 인과적이거나 도구적 의미로 이해될 수 있으며, 여기서는 아버지-아들 / 아들-믿는 이의 평행을 살리기 위해 인과적 의미를 본문에 담았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν πατὴρ
  english_pob_choice: the living Father
  chosen_korean: 살아 계신 아버지
  alternatives_korean:
  - 살아 있는 아버지
  - 생명이신 아버지
  lexicon: BDAG
  rationale: ζῶν은 πατήρ를 꾸미는 분사이므로, 존칭을 살린 “살아 계신 아버지”가 가장 자연스럽고 원문의 생명성을 보존합니다.
- source_word: ἀπέστειλέν με
  english_pob_choice: sent me
  chosen_korean: 나를 보내셨고
  alternatives_korean:
  - 나를 보내셨습니다
  - 나를 파송하셨고
  lexicon: BDAG
  rationale: ἀποστέλλω는 단순한 보냄보다 사명 부여를 포함할 수 있지만, 본문은 비교 구문의 한 항이므로 과도한 해석을 피하고 “보내셨다”로 옮겼습니다.
- source_word: διὰ τὸν πατέρα
  english_pob_choice: because of the Father
  chosen_korean: 아버지 때문에
  alternatives_korean:
  - 아버지로 말미암아
  - 아버지를 통해
  lexicon: BDAG
  rationale: διά + 대격의 인과적 의미를 살려 “때문에”로 옮겼습니다. 이렇게 해야 뒤의 δι’ ἐμέ와 평행을 이루며, 단순한 매개보다 근거/원인을 드러냅니다.
- source_word: ὁ τρώγων με
  english_pob_choice: the one who feeds on me
  chosen_korean: 나를 먹는 그 사람
  alternatives_korean:
  - 나를 먹고 있는 그 사람
  - 나를 씹는 그 사람
  lexicon: BDAG
  rationale: τρώγω의 구체적이고 생생한 ‘먹다/씹다’의 감각을 살리되, 한국어에서는 “먹는”이 가장 직역에 가깝고 문장 안에서 자연스럽습니다. 다만 거친 느낌은 원문이 가진 구체성의 일부로 남겨 두었습니다.
- source_word: δι’ ἐμέ
  english_pob_choice: because of me
  chosen_korean: 나 때문에
  alternatives_korean:
  - 나를 통해
  - 나로 말미암아
  lexicon: BDAG
  rationale: 앞의 “아버지 때문에”와 대응시키기 위해 동일하게 인과를 드러내는 표현을 택했습니다. 이렇게 하면 아버지-아들의 생명 관계와 믿는 이의 생명 관계의 대칭이 드러납니다.
theological_decisions:
- issue: 아들이 아버지 때문에 산다는 표현의 신학적 함의
  chosen_reading: “아버지 때문에 삽니다”로 번역하되, 존재론적 열등을 함축하지 않도록 유지했습니다.
  alternative_readings:
  - 아버지를 통해 삽니다
  - 아버지로 말미암아 삽니다
  rationale: 본문은 아들의 생명이 아버지와의 관계 안에 있다는 경제적/관계적 진술입니다. 번역은 원문의 인과성을 유지하면서 니케아 신앙고백과 상충하는 종속론적 해석을 밀어 넣지 않도록 했습니다.
  doctrine_reference: 니케아 신경(381), 칼케돈 신조(451)
- issue: τρώγω의 구체성 vs 성례적/은유적 해석
  chosen_reading: “나를 먹는”으로 구체성을 살리되, 성례전적 의미나 믿음-연합의 의미를 번역에서 단정하지 않았습니다.
  alternative_readings:
  - 나를 먹고 마시는
  - 나를 받아들이는
  rationale: 요한복음 6장의 해석은 전통마다 다르므로, 원문의 생생한 동사를 보존하면서 특정 교리적 결론을 번역문에 고정하지 않는 것이 적절합니다.
  doctrine_reference: 해석의 긴장을 보존
