  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
  footnotes:
  - marker: a
    text: Or more formally, 'But I told you that you have indeed seen me, and yet you do not believe.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 너희에게 말하였으되, 너희가 나를 보고도 믿지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘내가 너희에게 말하였으되, 너희가 나를 보았음에도 믿지 않습니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 진술과의 대조를 자연스러운 현대 한국어 역접으로 살렸습니다.
- source_word: εἶπον ὑμῖν
  english_pob_choice: I told you
  chosen_korean: 내가 너희에게 말하였으되
  alternatives_korean:
  - 내가 너희에게 말했습니다
  - 내가 너희에게 일렀습니다
  lexicon: BDAG
  rationale: 직접 대화체에서 ‘말하다’ 계열이 가장 자연스럽고, ‘너희에게’로 수신자를 분명히 드러냈습니다.
- source_word: ἑωράκατέ με
  english_pob_choice: you have seen me
  chosen_korean: 너희가 나를 보고도
  alternatives_korean:
  - 너희가 나를 보았고도
  - 너희가 나를 보았음에도
  lexicon: BDAG
  rationale: 완료형의 결과적 현재 관련성을 살리되, 공관적 대조가 드러나도록 ‘보고도’로 처리했습니다. 영어 POB의 견해 차이처럼, 한국어에서는 부자연스러운 직역보다 문맥상 대비를 분명히 했습니다.
- source_word: οὐ πιστεύετε
  english_pob_choice: you do not believe
  chosen_korean: 믿지 않습니다
  alternatives_korean:
  - 믿지 않으십니다
  - 믿지 않네요
  lexicon: BDAG
  rationale: 요한복음에서 πιστεύω는 통상 ‘믿다’로 옮기는 것이 가장 직접적이며, 현재형의 지속적 불신을 표준 서술체로 반영했습니다.
theological_decisions:
- issue: ‘보고도’에 담긴 대조성
  chosen_reading: 예수를 실제로 보았음에도 믿지 않는다는 반전을 문법적으로 드러냈습니다.
  alternative_readings:
  - 단순히 ‘나를 보았고 믿지 않습니다’로 평서
  - ‘나를 보았지만 믿지 않습니다’
  rationale: 헬라어의 첫 καί는 단순 접속을 넘는 강조를 띨 수 있어, 영어 POB가 지적한 대비를 한국어에서도 ‘-도’로 표시해 청중이 ‘보았는데도 믿지 않음’이라는 반전을 즉시 파악하도록 했습니다.
  doctrine_reference: John 6:36의 담화 대비 구조; translation philosophy §3
