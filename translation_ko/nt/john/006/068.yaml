source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
  footnotes:
  - marker: a
    text: Or “Master.” The Greek title can function as a respectful form of address, but “Lord” is the project's default rendering for κύριος and fits Johannine usage here.
    reason: alternative_reading
translation:
  language: ko
  text: 시몬 베드로가 그에게 대답했습니다. 「주님, 우리가 누구에게로 가겠습니까? 주님께는 영원한 생명의 말씀이 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님.” 그리스어 호칭은 존칭으로 쓰일 수 있으나, κύριος의 이 프로젝트 기본 번역과 요한복음의 용례에 따라 “주님”으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
