  terminology: ‘시몬 베드로’, ‘주님’, ‘영원한 생명’은 표준적인 성경 용어이며 원문의 의미와 요한복음의 용례를 무리 없이 반영합니다. 각주에서 영어 ‘Master’를 그대로 제시하기보다 한국어 대안인 ‘선생님’을 제시해야 합니다.
