  - 선생님
  rationale: 이 장면은 베드로가 예수께 신앙 고백적으로 말하는 맥락이므로, 단순 호칭보다 예수의 권위를 드러내는 '주님'이 본문 기능을 더 잘 전달합니다.
  doctrine_reference: 요한복음의 κύριος 호칭 관행
