id: JHN.6.68
reference: John 6:68
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
  footnotes:
  - marker: a
    text: Or “Master.” The Greek title can function as a respectful form of address, but “Lord” is the project's default rendering for κύριος and fits Johannine usage here.
    reason: alternative_reading
translation:
  language: ko
  text: 시몬 베드로가 그에게 대답하여 말했습니다. 「주님, 우리가 누구에게로 가겠습니까? 당신에게는 영원한 생명의 말씀들이 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “주님”입니다. 'Master'는 가능하지만, 이 프로젝트의 κύριος 기본값과 요한복음 문맥상 'Lord'에 해당하는 호칭으로 이해하는 것이 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: SBLGNT
  rationale: 대화 문맥에서 자연스러운 응답 동사로 옮겼으며, 문장 흐름상 합쇼체의 서술형과 잘 맞습니다.
- source_word: Σίμων Πέτρος
  english_pob_choice: Simon Peter
  chosen_korean: 시몬 베드로
  alternatives_korean:
  - 시몬 피터
  - 시몬 베드루
  lexicon: 고유명사 표기 관행
  rationale: 한국어 성경에서 널리 굳어진 인명형을 따랐습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  - 스승님
  lexicon: BDAG
  rationale: κύριος의 기본 호칭값과 요한복음의 그리스도론적 울림을 살려, 예수께 대한 직접 호칭을 '주님'으로 옮겼습니다.
- source_word: πρὸς τίνα
  english_pob_choice: to whom
  chosen_korean: 누구에게로
  alternatives_korean:
  - 누구에게
  - 어디로
  lexicon: BDAG
  rationale: πρός + 대격이 이동의 방향과 대상을 함께 드러내므로, 질문의 대상자 방향을 살리는 '누구에게로'가 가장 자연스럽습니다.
- source_word: ῥήματα
  english_pob_choice: words
  chosen_korean: 말씀들
  alternatives_korean:
  - 말들
  - 말씀
  lexicon: BDAG
  rationale: 단순한 '말'보다 예수의 권위 있는 발화를 드러내는 '말씀들'이 문맥상 더 적절합니다.
- source_word: ζωῆς αἰωνίου
  english_pob_choice: eternal life
  chosen_korean: 영원한 생명의
  alternatives_korean:
  - 영생의
  - 영원한 생명에 관한
  lexicon: BDAG
  rationale: 요한복음의 핵심 표현을 그대로 살리되, 수식 구조는 한국어에서 자연스럽게 '영원한 생명의'로 처리했습니다.
theological_decisions:
- issue: Κύριε의 예수 호칭 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 선생님
  rationale: 이 장면은 베드로가 예수께 신앙 고백적으로 말하는 맥락이므로, 단순 호칭보다 예수의 권위를 드러내는 '주님'이 본문 기능을 더 잘 전달합니다.
  doctrine_reference: 요한복음의 κύριος 호칭 관행
