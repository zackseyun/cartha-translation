  alternatives_korean:
  - 시몬 피터
  - 시몬 베드루
  lexicon: 고유명사 표기 관행
  rationale: 한국어 성경에서 널리 굳어진 인명형을 따랐습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  - 스승님
  lexicon: BDAG
  rationale: κύριος의 기본 호칭값과 요한복음의 그리스도론적 울림을 살려, 예수께 대한 직접 호칭을 '주님'으로 옮겼습니다.
- source_word: πρὸς τίνα
  english_pob_choice: to whom
  chosen_korean: 누구에게로
  alternatives_korean:
  - 누구에게
  - 어디로
  lexicon: BDAG
  rationale: πρός + 대격이 이동의 방향과 대상을 함께 드러내므로, 질문의 대상자 방향을 살리는 '누구에게로'가 가장 자연스럽습니다.
- source_word: ῥήματα
  english_pob_choice: words
  chosen_korean: 말씀들
  alternatives_korean:
  - 말들
  - 말씀
  lexicon: BDAG
  rationale: 단순한 '말'보다 예수의 권위 있는 발화를 드러내는 '말씀들'이 문맥상 더 적절합니다.
- source_word: ζωῆς αἰωνίου
  english_pob_choice: eternal life
  chosen_korean: 영원한 생명의
  alternatives_korean:
  - 영생의
  - 영원한 생명에 관한
  lexicon: BDAG
  rationale: 요한복음의 핵심 표현을 그대로 살리되, 수식 구조는 한국어에서 자연스럽게 '영원한 생명의'로 처리했습니다.
theological_decisions:
- issue: Κύριε의 예수 호칭 번역
  chosen_reading: 주님
  alternative_readings:
