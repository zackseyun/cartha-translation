review_pass:
  verdict: revise
  source_fidelity: 첫 두 문장은 원문의 의미를 충실히 옮깁니다. 다만 마지막 문장에서 ‘세상 생명을 위하여’가 한국어 어순상 ‘내가 줄 빵’을 수식하는 것으로 읽힐 수 있습니다. 원문에서는 ‘내가 줄 빵’이 ‘내 살’이며, ‘세상의 생명을 위한’은 그 ‘살’의 목적/수혜를 나타냅니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. ‘살아 있는 빵’과 ‘내 살’은 다소 낯설 수 있으나 원문의 의도적인 구체성을 보존하는 적절한 표현입니다. 각주 b의 ‘그 나이’는 현대 한국어에서 αἰών을 잘못 이해하게 하는 부자연스럽고 부정확한 표현이므로 고쳐야 합니다.
  terminology: σάρξ는 ‘살’로 유지하는 것이 적절하며 ‘몸’으로 완화하지 않아야 합니다. κόσμος도 ‘세상’으로 유지하는 것이 적절합니다. ‘헬라어’보다는 현대 학술·성경 번역 문맥에서 더 중립적인 ‘그리스어’를 사용했습니다.
  issues:
  - severity: medium
    issue: 마지막 절의 수식 관계가 불명확합니다.
    rationale: ‘내가 세상 생명을 위하여 줄 빵’은 ὑπὲρ τῆς τοῦ κόσμου ζωῆς가 δώσω 또는 ‘빵’을 수식하는 듯 읽힐 수 있습니다. 원문의 술어 구조, 즉 ‘내가 줄 빵은 세상의 생명을 위한 내 살이다’를 드러내는 것이 안전합니다.
  - severity: high
    issue: 각주 b의 ‘그 나이로 들어가’는 αἰῶνα의 부정확한 번역입니다.
    rationale: αἰών은 여기서 ‘나이’가 아니라 ‘시대/세대’의 뜻을 지니며, εἰς τὸν αἰῶνα는 문맥상 ‘영원히’라는 관용적 의미입니다.
