id: JHN.6.51
reference: John 6:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
  footnotes:
  - marker: a
    text: Or 'eats of this bread.' The Greek preposition can be rendered more literally this way, but 'eats from this bread' is more natural in current English.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will live into the age.' The expression means enduringly or forever.
    reason: lexical_alternative
  - marker: c
    text: Greek 'flesh,' not 'body.' The wording is intentionally concrete.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 하늘에서 내려온 살아 있는 빵입니다[a]. 누구든지 이 빵을 먹으면 영원히 살 것입니다[b]. 그리고 내가 세상 생명을 위하여 줄 빵은 내 살입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “하늘로부터 내려온”입니다.
    reason: source_note
  - marker: b
    text: 헬라어 표현은 문자적으로는 “그 나이로 들어가 살 것이다”에 가깝지만, 의미는 지속적으로, 곧 영원히 산다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어는 “살”이며, “몸”이 아닙니다. 의도적으로 구체적인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  english_pob_choice: the living bread
  chosen_korean: 살아 있는 빵
  alternatives_korean:
  - 생명의 빵
  - 살아 있는 떡
  lexicon: BDAG
  rationale: ζῶν은 형용사적으로 “살아 있는”으로 옮기는 것이 직접적이며, “생명의 빵”은 문맥의 해석을 미리 끌어와 원문의 표현을 약화시킬 수 있습니다.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  english_pob_choice: that came down from heaven
  chosen_korean: 하늘에서 내려온
  alternatives_korean:
  - 하늘로부터 내려온
  - 하늘에서 내려오신
  lexicon: BDAG
  rationale: 완료된 하강을 나타내는 분사이므로 자연스러운 관계절/관형절로 처리했고, 존대형 “내려오신”은 서술 화법보다 예수에 대한 경어를 과도하게 드러낼 수 있어 피했습니다.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  english_pob_choice: If anyone eats of this bread
  chosen_korean: 누구든지 이 빵을 먹으면
  alternatives_korean:
  - 누구든지 이 빵을 먹는다면
  - 누구든지 이 빵에서 먹으면
  lexicon: BDAG
  rationale: ἐκ는 원문의 “from/of” 뉘앙스를 가지지만, 한국어에서는 “이 빵을 먹으면”이 가장 자연스럽고 의미를 과하게 풀지 않습니다.
- source_word: ζήσει εἰς τὸν αἰῶνα
  english_pob_choice: he will live forever
  chosen_korean: 영원히 살 것입니다
  alternatives_korean:
  - 그는 영원히 살 것입니다
  - 그는 영원까지 살 것입니다
  lexicon: BDAG
  rationale: 관용구 εἰς τὸν αἰῶνα는 요한복음에서 지속성을 넘어 ‘영원히’가 가장 간명한 대응입니다.
- source_word: ἡ σάρξ μού ἐστιν
  english_pob_choice: is my flesh
  chosen_korean: 내 살입니다
  alternatives_korean:
  - 내 육체입니다
  - 내 몸입니다
  lexicon: BDAG
  rationale: σάρξ는 이 문맥에서 구체적이고 도발적인 “살”로 옮겨야 하며, “몸”은 본문의 강한 어휘를 완화합니다.
theological_decisions:
- issue: σάρξ의 번역이 성찬적·해석적 완화로 흐를 가능성
  chosen_reading: 본문의 직설성을 살려 “내 살”로 옮겼습니다.
  alternative_readings:
  - 내 몸
  - 내 육체
  rationale: 원문은 예수의 자기기증을 구체적으로 말하므로, 해석을 미리 정리하는 표현보다 원문의 충격을 보존하는 번역이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: σάρξ'
- issue: “세상”의 범위를 좁힐지 여부
  chosen_reading: “세상”을 그대로 유지했습니다.
  alternative_readings:
  - 인류
  - 택함 받은 자들
  rationale: κόσμος의 보편적 범위를 유지해 본문이 말하는 수혜의 폭을 임의로 축소하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3; Affirmations
