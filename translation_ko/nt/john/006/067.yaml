  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
  footnotes:
  - marker: a
    text: Or, “Do you also want to leave?” The Greek question uses μή, which often expects a negative answer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수께서 열둘에게 말씀하셨습니다. “여러분도 떠나고 싶지는 않습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “여러분도 떠나고 싶습니까?” 그리스어 질문은 μή로 시작되어 대개 부정적인 대답을 기대합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그리하여
  - 그런즉
  lexicon: BDAG
  rationale: 직전 문맥의 많은 제자들이 떠난 흐름에 이어지는 논리적·서사적 연결을 분명히 하면서도, 예수의 발화가 시작되는 장면의 중량감을 살릴 수 있습니다.
- source_word: τοῖς δώδεκα
  english_pob_choice: to the Twelve
  chosen_korean: 열둘에게
  alternatives_korean:
  - 열두 제자에게
  - 열두 사람에게
  lexicon: BDAG
  rationale: ‘열둘’은 단순 수량이 아니라 예수의 핵심 집단을 가리키는 호칭이므로, ‘열두 제자들’로 풀기보다 짧게 ‘열둘’로 옮겨 титуль적 뉘앙스를 살렸습니다.
- source_word: Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν
  english_pob_choice: You do not want to go away too, do you?
  chosen_korean: 너희도 떠나고자 하느냐?
  alternatives_korean:
  - 너희도 떠나고 싶으냐?
  - 너희도 가 버리고자 하느냐?
  lexicon: BDAG
  rationale: μή가 붙은 질문은 보통 부정적 답을 기대하므로, 한국어에서는 굳이 부정형의 꼬리질문으로 만들지 않고 자연스러운 의문문으로 옮기되 ‘너희도’로 καί와 ὑμεῖς의 강조를 반영했습니다. ὑπάγειν은 단순 이동이 아니라 예수 곁을 떠나는 뜻이므로 ‘떠나다’가 가장 적절합니다.
theological_decisions:
- issue: μή가 이끄는 질문의 기대 방향
  chosen_reading: 예수께서 제자들의 이탈을 사실로 단정하기보다, ‘아니지 않느냐’는 기대를 내포한 질문으로 말씀하신 것으로 보존합니다.
  alternative_readings:
  - 중립적 질문으로 ‘너희도 떠나고자 하느냐?’만 읽는 방식
  rationale: 그리스어 μή 의문문이 가진 담화상의 기대를 훼손하지 않으면서도, 한국어에서 과도하게 해석을 덧씌우지 않기 위한 처리입니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
