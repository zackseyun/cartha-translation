  source_fidelity: 개정문은 οὖν의 문맥적 연결(‘그러자’), τοῖς δώδεκα의 호칭적 성격(‘열둘에게’), καὶ ὑμεῖς의 ‘여러분도’, 그리고 μή 의문문의 부정적 답변 기대를 반영합니다. ‘떠나고 싶지는 않습니까?’는 θέλετε ὑπάγειν을 자연스럽게 옮기며, 떠나는 대상이 예수 자신인지 공동체인지 원문이 명시하지 않는 범위를 넘어서지 않습니다.
  naturalness: 초안의 대화문 종결 ‘하느냐?’는 지정된 현대 합쇼체와 맞지 않습니다. ‘여러분도 떠나고 싶지는 않습니까?’는 현대 표준어의 격식 있는 존대 의문문으로 자연스럽고, 원문의 부정 의문문 뉘앙스도 드러냅니다. οὖν은 이 문맥에서 ‘그러므로’보다 ‘그러자’가 더 자연스럽습니다.
  terminology: ‘열둘’은 예수의 핵심 제자 집단을 가리키는 정착된 호칭적 표현으로 적절합니다. 기존 각주는 본문과 같은 문구를 ‘또는’으로 제시하므로 실제 대안이 되지 않습니다. 중립형 질문을 대안으로 제시하고 μή의 기능을 설명하도록 고쳤습니다.
