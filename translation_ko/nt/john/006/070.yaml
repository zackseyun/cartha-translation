revisions:
- from: 예수께서 그들에게 대답하셨습니다. 「내가 너희 열둘을 선택하지 않았느냐? 그런데 너희 중 하나는 마귀입니다.」[a]
  to: 예수께서 그들에게 대답하셨습니다. “내가 너희 열두 사람을 선택하지 않았느냐? 그러나 너희 가운데 한 사람은 마귀 같은 자입니다.”[a]
  rationale: ‘열두 사람’으로 알려진 집단을 자연스럽게 지시하고, ‘그러나’로 καὶ가 이 문맥에서 이루는 대조를 드러냈습니다. ‘마귀 같은 자’는 διάβολος의 강한 표현을 약화하지 않으면서도 무관사 서술어가 지닌 질적 의미와 사탄 자신과의 비동일시를 한국어에서 분명히 합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:04Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 반문(‘내가 … 선택하지 않았느냐?’) 및 대조는 잘 반영했습니다. 그러나 무관사 서술어 διάβολός의 질적 용법을 ‘마귀입니다’로만 옮기면 한국어에서는 사탄/마귀와의 직접적 동일시로 더 쉽게 읽힐 수 있습니다.
  naturalness: ‘너희 열둘’은 가능하나 현대 표준어 문장에서는 다소 구어적이고 집단 지시가 불분명할 수 있습니다. ‘너희 열두 사람’과 ‘너희 가운데 한 사람’이 자연스럽고 명료합니다.
