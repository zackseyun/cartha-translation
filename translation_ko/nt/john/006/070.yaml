id: JHN.6.70
reference: John 6:70
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
  footnotes:
  - marker: a
    text: Or “a slanderer.” The Greek word can denote a false accuser or, in many contexts, the Devil. Here the wording is qualitative rather than a direct identification with Satan.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 대답하셨습니다. 「내가 너희 열둘을 선택하지 않았느냐? 그런데 너희 중 하나는 마귀입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어 διάβολος는 여기서 ‘비방자’라는 뜻을 띨 수도 있지만, 문맥상 인격적 대적을 가리키는 질적 표현으로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 응답하셨습니다
  - 말씀하셨습니다
  lexicon: BDAG
  rationale: 대화 장면의 표준 응답 동사로 자연스럽고, 예수의 발화를 격식 있는 합쇼체로 살렸습니다.
- source_word: ὑμᾶς τοὺς δώδεκα
  english_pob_choice: you, the Twelve
  chosen_korean: 너희 열둘
  alternatives_korean:
  - 너희, 열둘
  - 너희 열두 제자
  lexicon: BDAG
  rationale: 목적격 대명사와 관사 있는 αριθμός 표현을 간결하게 옮겨, 이미 알려진 집단 표지인 ‘열둘’의 기능을 보존했습니다.
- source_word: ἐξελεξάμην
  english_pob_choice: Did I not choose
  chosen_korean: 선택하지 않았느냐
  alternatives_korean:
  - 뽑지 않았느냐
  - 가리지 않았느냐
  lexicon: BDAG
  rationale: 예수의 반문 구조를 그대로 살리되, ‘선택하다’가 문맥상 가장 직접적이며 POB 영어 선택과도 맞습니다.
- source_word: διάβολός
  english_pob_choice: a devil
  chosen_korean: 마귀입니다
  alternatives_korean:
  - 악한 자입니다
  - 비방자입니다
  - 사탄입니다
  lexicon: BDAG
  rationale: 무관사 서술어의 질적 의미를 살리려 했지만, 한국어에서는 ‘마귀’가 인격적 대적의 강도를 가장 직접적으로 드러내며, 단순한 ‘비방자’보다 원문의 날카로움을 보존합니다.
theological_decisions:
- issue: διάβολός의 의미를 사탄 본인과의 동일시로 고정할지, 질적 묘사로 둘지
  chosen_reading: ‘마귀입니다’로 번역하되, 유다를 사탄과 동일 존재로 단정하지는 않도록 합니다.
  alternative_readings:
  - 사탄입니다
  - 비방자입니다
  - 마귀 같은 사람입니다
  rationale: 무관사 서술어는 질적 표현으로 읽는 것이 적절합니다. 한국어 ‘마귀’는 원문의 신학적 긴장과 예수의 강한 경고를 유지하면서도, 존재론적 동일시는 피하게 해 줍니다.
  doctrine_reference: 원문이 드러내는 긴장을 해소하지 않고 보존하는 번역 원칙
- issue: ‘열둘’의 집단명 표지 처리
  chosen_reading: 고유 집단명처럼 보이도록 ‘너희 열둘’로 옮겼습니다.
  alternative_readings:
  - 너희 열두 사람
  - 너희, 그 열둘
  rationale: 문맥상 단순 수량이 아니라 제자 집단 전체를 가리키므로, 관용적 집단 표지를 유지하는 것이 적절합니다.
  doctrine_reference: 복음서의 제자 집단 호칭 관행
