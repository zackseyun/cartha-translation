id: JHN.6.11
reference: John 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
  footnotes:
  - marker: a
    text: Or 'to those who were seated.' The Greek more literally says 'to those who were reclining,' the customary posture for a meal.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the small fish.' The Greek term can refer to fish eaten with bread, possibly small fish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수께서 빵들을 집으시고 감사하신 뒤, 기대어 있던 이들에게[a] 나누어 주셨습니다. 물고기도[b] 마찬가지로 그들이 원하는 만큼 나누어 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기대어 있는 이들’입니다. 이는 당시 식사 자리에서 취하던 관습적인 자세를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ὀψάριον(여기서는 복수형)은 빵과 함께 먹는 물고기, 특히 작은 물고기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν ... τοὺς ἄρτους
  english_pob_choice: took the loaves
  chosen_korean: 그 빵들을 받으시고
  alternatives_korean:
  - 그 빵들을 취하시고
  - 그 빵들을 집으시고
  lexicon: BDAG
  rationale: ἄρτους는 이 식사 장면에서 ‘빵’ 일반보다 개별 덩어리로 이해하는 것이 자연스럽고, ἔλαβεν은 단순 소유 이전의 동작이므로 ‘받으시고’가 흐름에 맞습니다.
- source_word: εὐχαριστήσας
  english_pob_choice: after giving thanks
  chosen_korean: 감사하신 뒤
  alternatives_korean:
  - 감사하시고
  - 감사드린 뒤
  lexicon: BDAG
  rationale: 분사로서 주동사 이전의 동작을 나타내므로 한국어에서도 선행 동작을 분명히 했고, 본문에 없는 감사의 대상은 덧붙이지 않았습니다.
- source_word: τοῖς ἀνακειμένοις
  english_pob_choice: to those who were reclining
  chosen_korean: 앉아 있는 이들에게
  alternatives_korean:
  - 기대어 앉아 있는 이들에게
  - 식사하느라 기대어 있는 이들에게
  lexicon: BDAG
  rationale: 직역하면 ‘기대어 누워 있는/앉아 있는’이지만, 한국어에서는 식사 자세를 그대로 생소하게 옮기기보다 문맥상 자연한 ‘앉아 있는 이들’로 풀되, 의미 손실은 최소화했습니다.
- source_word: διέδωκεν
  english_pob_choice: distributed them
  chosen_korean: 나누어 주셨습니다
  alternatives_korean:
  - 분배하셨습니다
  - 배분하셨습니다
  lexicon: BDAG
  rationale: 빵을 군중에게 여러 차례 나누어 주는 분배적 동작을 자연스럽게 살렸습니다.
- source_word: ἐκ τῶν ὀψαρίων
  english_pob_choice: from the fish
  chosen_korean: 물고기도
  alternatives_korean:
  - 생선도
  - 작은 물고기도
  lexicon: BDAG
  rationale: ὀψάριον은 반찬용의 작은 물고기를 가리킬 수 있지만, 본문에서는 과도한 구체화보다 한국어로 가장 자연스러운 ‘물고기’가 적절합니다.
theological_decisions:
- issue: εὐχαριστήσας의 의미를 감사로만 유지할지, 축복/성찬적 뉘앙스를 드러낼지
  chosen_reading: 본문 표현대로 ‘감사하신 뒤’로 옮기고 성찬적 해석은 본문에 주입하지 않았습니다.
  alternative_readings:
  - ‘축복하신 뒤’로 옮기기
  - 성찬을 암시하는 표현을 본문에 강화하기
  rationale: 헬라어 동사는 분명히 ‘감사하다’의 뜻이며, 요한의 서술에 후대적 성찬 해석을 번역어로 밀어 넣지 않는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
