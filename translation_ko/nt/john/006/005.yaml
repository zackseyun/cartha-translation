review_pass:
  verdict: revise
  source_fidelity: ‘이 사람들로 먹게 하겠습니까’는 ἵνα φάγωσιν οὗτοι의 목적절을 다소 부자연스러운 사역 표현으로 바꾸어, 사람들이 직접 먹는다는 뜻을 흐립니다. 또한 ἄρτους는 현대 표준어에서 쌀로 만든 음식으로 우선 이해되기 쉬운 ‘떡’보다 ‘빵’이 원문의 일반적 의미를 더 정확히 전달합니다. ‘그래서’는 οὖν의 문맥상 연결을 자연스럽게 반영합니다.
  naturalness: ‘자기에게 오는 것’은 예수에 대한 재귀 지시로 다소 어색하므로 ‘자신에게 오는 것’으로 다듬었습니다. 목적을 앞세운 ‘이 사람들이 먹을 수 있도록 우리가 어디에서 … 사겠습니까?’는 합쇼체 직접 화법으로 자연스럽고 명료합니다.
  terminology: 인명 ‘예수’, ‘빌립’은 적절합니다. ἄρτος는 본문에서 ‘빵’으로 번역하고, 개별 빵덩이/빵들의 의미 가능성은 각주로 보존합니다. 각주 표지는 해당 어구 가까이에 배치했습니다.
  issues:
  - severity: medium
    issue: ἵνα φάγωσιν οὗτοι의 번역이 부자연스러운 사역 구문입니다.
    rationale: ‘이 사람들로 먹게 하겠습니까’는 한국어에서 예수가 사람들에게 먹도록 강제·사역한다는 인상을 줄 수 있습니다. 원문은 ‘이 사람들이 먹도록/먹을 수 있도록’이라는 목적을 나타냅니다.
  - severity: medium
    issue: ἄρτους를 ‘떡’으로 옮긴 선택이 현대 표준어에서 의미를 오도할 수 있습니다.
    rationale: 현대 한국어의 ‘떡’은 통상 한국식 쌀 음식으로 이해됩니다. 이 문맥의 ἄρτοι는 빵 또는 빵덩이들이므로 ‘빵’이 더 직접적입니다.
  - severity: low
    issue: 각주 표지가 모두 인용문 끝에 한꺼번에 놓여 있습니다.
    rationale: 각주 a는 ‘많은 무리’, c는 ‘빵’에 연결하고, b는 질문 전체에 연결해야 각주의 대상이 분명합니다.
  revised_text: 그래서 예수께서 눈을 들어 많은 무리[a]가 자신에게 오는 것을 보시고 빌립에게 말씀하셨습니다. “이 사람들이 먹을 수 있도록 우리가 어디에서 빵[c]을 사겠습니까?”[b]
  revised_footnotes:
  - marker: a
    text: ‘많은 무리’는 ‘큰 무리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리가 어디에서 빵을 사겠습니까?’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘빵’은 일반적인 빵 또는 여러 개의 빵덩이를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 서술 순서와 질문의 목적절을 보존하면서 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘빵’으로 본문의 지시 대상을 명확히 하고, ‘빵덩이들’이라는 수적·어휘적 가능성은 각주에 남겼습니다. 영어 감사 기록의 세 어휘 대안도 각각 대응하는 위치에 연결했습니다.
