id: JHN.6.5
reference: John 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
  footnotes:
  - marker: a
    text: Or 'a great crowd.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'From where shall we buy bread...?'
    reason: lexical_alternative
  - marker: c
    text: Or 'loaves.' The Greek word can refer to bread generally or to individual loaves.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수께서 눈을 들어 많은 무리가 자기에게 오는 것을 보시고 빌립에게 말씀하셨습니다. “우리가 어디에서 떡을 사서 이 사람들로 먹게 하겠습니까?”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리’는 문자적으로 ‘큰 군중’의 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘어디에서 우리가 떡을 사겠습니까?’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘떡’은 여기서 일반적인 빵 또는 여러 개의 빵덩이를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς
  english_pob_choice: lifting up his eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 높이 들어
  - 눈을 치켜들어
  lexicon: BDAG
  rationale: 관용적으로 결합된 표현이므로 한국어에서도 자연스럽게 '눈을 들어'로 옮겨 원문의 시선 전환을 살렸습니다.
- source_word: πολὺς ὄχλος
  english_pob_choice: a large crowd
  chosen_korean: 많은 무리
  alternatives_korean:
  - 큰 무리
  - 큰 군중
  lexicon: BDAG
  rationale: 크기와 수를 함께 드러내는 표현으로 '많은 무리'가 가장 자연스럽고, '군중'보다 복음서 문맥의 집단성을 잘 살립니다.
- source_word: Πόθεν ἀγοράσωμεν
  english_pob_choice: Where are we to buy
  chosen_korean: 우리가 어디에서 사서
  alternatives_korean:
  - 우리가 어디에서 사야 하겠습니까
  - 어디에서 우리가 사겠습니까
  lexicon: BDAG
  rationale: Πόθεν의 출처·장소 감각을 살려 '어디에서'로 옮기고, 문맥상 질문의 실용적 뉘앙스를 유지했습니다.
- source_word: ἄρτους
  english_pob_choice: bread / loaves
  chosen_korean: 떡
  alternatives_korean:
  - 빵
  - 빵덩이
  - 떡과 빵
  lexicon: BDAG
  rationale: 복음서의 ἄρτος를 한국어 성경 전통과 현대 가독성 모두를 고려해 '떡'으로 옮겼습니다. 여기서는 일반 음식으로서의 빵/떡을 가리키므로 복수성은 문맥으로 보완됩니다.
- source_word: ἵνα φάγωσιν οὗτοι
  english_pob_choice: so that these may eat
  chosen_korean: 이 사람들로 먹게 하겠습니까
  alternatives_korean:
  - 이 사람들이 먹게 하겠습니까
  - 그들이 먹도록 하겠습니까
  lexicon: BDAG
  rationale: ἵνα의 목적 의미를 살리면서, οὗτοι를 직접 지시하는 말맛을 유지하기 위해 '이 사람들'로 옮겼습니다.
theological_decisions:
- issue: 예수의 직접 화법에서의 존칭 처리
  chosen_reading: 예수께서 빌립에게 ‘우리가 ... 하겠습니까?’라고 공손한 질문형으로 말씀하셨습니다.
  alternative_readings:
  - ‘우리가 ... 하느냐?’처럼 보다 직설적인 형태
  - 평서형에 가까운 서술
  rationale: 원문은 질문형이며, 한국어 합쇼체로 옮겨 예수의 말씀이 갖는 격식을 유지했습니다. 다만 제자들을 향한 대화의 자연스러움도 함께 살렸습니다.
  doctrine_reference: 복음서 화법과 인물 간 대화의 문체
