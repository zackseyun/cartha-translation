  source_fidelity: 원문의 사건 순서(예수께서 눈을 드심, 많은 무리가 예수께 오는 것을 보심, 빌립에게 질문하심)와 핵심 어휘는 대체로 충실합니다. 다만 ἵνα φάγωσιν οὗτοι의 목적절은 ‘이 사람들이 먹게 하겠습니까?’보다 이들이 먹도록 마련한다는 목적을 더 자연스럽게 드러내는 표현이 적절합니다.
  naturalness: 초안의 ‘이 사람들로 먹게 하겠습니까?’는 현대 표준어 합쇼체에서는 다소 문어적이고 부자연스럽습니다. ‘이 사람들이 먹을 수 있도록 하겠습니까?’가 자연스럽고 원문의 목적 관계도 분명히 합니다. 예수의 행위에는 ‘눈을 드시고’를 사용하여 서술의 존대도 일관되게 했습니다.
  terminology: ‘예수’, ‘빌립’, ‘떡’, ‘무리’는 한국어 성경 문맥과 현대 독자 모두에게 통용되는 적절한 용어입니다. ἄρτους의 ‘떡’은 유지하되, 빵 또는 빵덩이를 뜻할 수 있다는 각주를 유지합니다.
