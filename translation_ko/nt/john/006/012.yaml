id: JHN.6.12
reference: John 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
  footnotes:
  - marker: a
    text: Or 'they were satisfied' or 'they had eaten their fill.'
    reason: lexical_alternative
  - marker: b
    text: 'Greek has the historical present: ''he says.'' Some translations smooth this to ''he said.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'fragments.'
    reason: lexical_alternative
  - marker: d
    text: Or 'so that nothing may be wasted.' The Greek more literally says 'so that nothing may be lost.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 배불리 먹은 뒤에, 예수께서 제자들에게 말씀하십니다. “남은 조각들을 모으십시오. 아무것도 잃어버리지 않게 하려는 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘배불렀을 때’ 또는 ‘먹고 난 뒤에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 역사적 현재를 사용하여 ‘말씀하십니다’라고 합니다. 일부 번역은 이를 ‘말했습니다’로 자연화합니다.
    reason: lexical_alternative
  - marker: c
    text: κλάσματα는 빵의 ‘조각들’ 또는 ‘부스러기들’을 뜻합니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘아무것도 잃어버리지 않게’입니다. 일부 번역은 문맥상 ‘아무것도 낭비되지 않게’로 풉니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπλήσθησαν
  english_pob_choice: they were filled
  chosen_korean: 배불리 먹은 뒤에
  alternatives_korean:
  - 배가 불렀을 때
  - 충분히 먹었을 때
  - 배불리 먹은 후에
  lexicon: BDAG
  rationale: 먹는 장면의 문맥에서 ‘filled’는 단순한 만복보다 식사를 충분히 마친 상태를 뜻하므로, 자연스러운 한국어로 ‘배불리 먹은 뒤에’라고 옮겼습니다.
- source_word: λέγει
  english_pob_choice: he says
  chosen_korean: 말씀하십니다
  alternatives_korean:
  - 말합니다
  - 말하십니다
  - 이르십니다
  lexicon: BDAG
  rationale: 요한복음의 역사적 현재를 한국어에서도 살리되, 예수에게는 공손한 서술형인 ‘말씀하십니다’를 사용해 현재성과 존대의 균형을 잡았습니다.
- source_word: Συναγάγετε τὰ περισσεύσαντα κλάσματα
  english_pob_choice: Gather up the leftover pieces
  chosen_korean: 남은 조각들을 모으십시오
  alternatives_korean:
  - 남은 조각들을 거두십시오
  - 남아 있는 조각들을 모으십시오
  - 남은 부스러기들을 모으십시오
  lexicon: BDAG
  rationale: Συναγάγετε는 단순히 ‘모으다’보다 흩어진 것을 한데 거두는 뉘앙스가 있으나, 한국어에서는 ‘모으십시오’가 가장 자연스럽고 명령형의 힘도 분명합니다. κλάσματα는 여기서 빵 조각들을 가리키므로 ‘조각들’이 적절합니다.
- source_word: ἵνα μή τι ἀπόληται
  english_pob_choice: so that nothing may be lost
  chosen_korean: 아무것도 잃어버리지 않게 하려는 것입니다
  alternatives_korean:
  - 아무것도 없어지지 않게 하려는 것입니다
  - 아무것도 낭비되지 않게 하려는 것입니다
  - 아무것도 잃지 않게 하려는 것입니다
  lexicon: BDAG
  rationale: ἀπόληται를 이 문맥에서는 음식 조각이 ‘사라지다/잃어버리다’는 뜻으로 유지하는 것이 가장 원문에 가깝습니다. ‘낭비되다’는 해석을 덧입히므로 본문에는 ‘잃어버리지 않게’로 두었습니다.
theological_decisions:
- issue: ἵνα μή τι ἀπόληται의 의미 범위
  chosen_reading: 이 절에서는 구원론적 ‘멸망’이 아니라 남은 음식 조각이 사라지지 않도록 하라는 실제적 의미로 읽었습니다.
  alternative_readings:
  - ‘멸망하지 않게’로 옮겨 요한복음의 다른 신학적 용례를 환기하는 읽기
  - ‘낭비되지 않게’로 풀어 실제적 기능을 더 강조하는 읽기
  rationale: 문맥상 예수께서는 오병이어 후 남은 조각을 거두라고 지시하시는 것이므로, 신학적 함의를 과도하게 확장하지 않고 즉각적인 물질적 의미를 살렸습니다.
  doctrine_reference: 문맥 우선 원칙; 요한의 어휘적 긴장 보존
