base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
  footnotes:
  - marker: a
    text: Or 'Then if you were to see the Son of Man ascending where he was before.' The Greek is a rhetorical conditional question.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 인자가 전에 있던 곳으로 올라가는 것을 여러분이 보게 된다면 어떻게 하시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러면 인자가 전에 있던 곳으로 올라가는 것을 여러분이 본다면 어떻게 하시겠습니까?’ 그리스어는 수사적 조건문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  english_pob_choice: Then what if
  chosen_korean: 그러면 … 어떻게 하시겠습니까
  alternatives_korean:
  - 그렇다면 … 어떻게 되겠습니까
  - 그러면 … 어떻겠습니까
  lexicon: BDAG
  rationale: οὖν의 추론 흐름과 ἐὰν의 조건문을 함께 살려, 한국어에서는 자연스러운 수사적 질문형으로 옮겼습니다.
- source_word: θεωρῆτε
  english_pob_choice: you were to see
  chosen_korean: 여러분이 보게 된다면
  alternatives_korean:
  - 여러분이 보신다면
  - 여러분이 보게 되면
  lexicon: BDAG
  rationale: 조건문 안의 prospective한 시각 동사를 한국어에서는 ‘보게 된다면’으로 옮겨, 단순 현재가 아닌 가상적 목격의 뉘앙스를 살렸습니다.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자이신 분
  lexicon: BDAG
  rationale: 예수의 자기 칭호이자 단락 내에서 이미 확립된 표현이므로, 통상적 교회어인 ‘인자’를 유지했습니다.
- source_word: ἀναβαίνοντα ὅπου ἦν τὸ πρότερον
  english_pob_choice: ascending to where he was before
  chosen_korean: 전에 있던 곳으로 올라가는
  alternatives_korean:
  - 전에 계시던 곳으로 올라가는
  - 이전의 그곳으로 올라가는
  lexicon: BDAG
  rationale: ‘올라가는’으로 상승 동작을 자연스럽게 살리고, ‘전에 있던 곳’으로 ὅπου ἦν τὸ πρότερον의 시간적 선재성을 과도하게 해석하지 않으면서 보존했습니다.
theological_decisions:
- issue: 인자의 ‘전에 있던 곳’이 무엇인지 명시할지 여부
  chosen_reading: 본문이 직접 말하는 범위 안에서만 두고, ‘하늘’이나 ‘아버지께로’ 같은 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 하늘로 올라가는
  - 아버지께로 돌아가는
  rationale: 그리스어는 선재성과 상승을 강하게 암시하지만, 본 절 자체는 그 장소를 명시하지 않으므로 번역에서 해석을 앞서지 않았습니다.
  doctrine_reference: Translation philosophy; John 6 문맥의 선재/상승 진술
