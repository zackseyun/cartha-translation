source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
  footnotes:
  - marker: a
    text: Or 'drags him' or 'pulls him.' The Greek verb can carry a stronger sense of drawing or pulling; 'draws' is used in the main text to preserve the wording without forcing a particular theological explanation of how the Father brings a person to the Son.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'him' with representative force; the statement applies generally, not only to males.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 보내신 아버지께서 그를[b] 이끌지[a] 않으시면, 아무도 내게 올 수 없습니다. 그리고 나는 마지막 날에 그를 일으킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이끌다’는 더 강한 뜻의 ‘끌다’ 또는 ‘끌어당기다’로도 옮길 수 있습니다. 여기서는 그 표현이 아버지께서 사람을 아들에게 오게 하시는 방식을 어떻게 설명하는지 미리 단정하지 않기 위해 ‘이끌다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 남성 단수 대명사는 여기서 대표적으로 쓰였으므로, 이 말씀은 남성에게만 한정되지 않고 일반적으로 적용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  english_pob_choice: No one is able
  chosen_korean: 아무도 … 올 수 없습니다
  alternatives_korean:
  - 아무도 … 올 능력이 없습니다
  - 아무도 … 올 수 없습니다
  lexicon: BDAG
  rationale: οὐδεὶς와 δύναται의 결합은 단순한 가능성보다 ‘올 수 있음/없음’의 능력 부재를 나타내므로, 자연스러운 한국어로 ‘아무도 … 올 수 없습니다’라고 옮겼습니다.
- source_word: ἐλθεῖν πρός με
