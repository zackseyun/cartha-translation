id: JHN.6.44
reference: John 6:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
  footnotes:
  - marker: a
    text: Or 'drags him' or 'pulls him.' The Greek verb can carry a stronger sense of drawing or pulling; 'draws' is used in the main text to preserve the wording without forcing a particular theological explanation of how the Father brings a person to the Son.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'him' with representative force; the statement applies generally, not only to males.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지께서 나를 보내신 이가 그를 이끌지 않으시면, 아무도 내게 올 수 없습니다. 그러면 나는 마지막 날에 그를 일으킬 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이끌다’는 본문이 허용하는 더 강한 ‘끌다/끌어당기다’의 가능성을 완전히 닫지 않으면서도, 문맥상 강압으로 단정하지 않기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 남성 단수 대명사는 여기서 대표적 용법으로 쓰였으므로, 의미는 일반적이며 남성만을 가리키지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  english_pob_choice: No one is able
  chosen_korean: 아무도 … 올 수 없습니다
  alternatives_korean:
  - 아무도 … 올 능력이 없습니다
  - 아무도 … 올 수 없습니다
  lexicon: BDAG
  rationale: οὐδεὶς와 δύναται의 결합은 단순한 가능성보다 ‘올 수 있음/없음’의 능력 부재를 나타내므로, 자연스러운 한국어로 ‘아무도 … 올 수 없습니다’라고 옮겼습니다.
- source_word: ἐλθεῖν πρός με
  english_pob_choice: to come to me
  chosen_korean: 내게 오다
  alternatives_korean:
  - 내게 나아오다
  - 내게 오게 되다
  lexicon: BDAG
  rationale: 요한복음에서 πρός με의 방향성을 살리되 과도하게 설명하지 않기 위해, 신앙적 접근의 의미를 유지하는 ‘내게 오다’를 택했습니다.
- source_word: ἑλκύσῃ
  english_pob_choice: draws
  chosen_korean: 그를 이끌지
  alternatives_korean:
  - 그를 끌지
  - 그를 끌어당기지
  lexicon: BDAG
  rationale: 이 동사는 강한 끌어당김까지 포괄하지만, POB의 ‘draws’처럼 해석을 고정하지 않기 위해 한국어에서는 중립적이면서도 힘이 있는 ‘이끌다’를 사용했습니다.
- source_word: αὐτόν
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그 사람을
  lexicon: BDAG
  rationale: 그리스어 남성 단수 대명사의 대표적 용법을 그대로 반영하여, 일반적 지시를 살리면서도 문장을 어색하게 중성화하지 않는 ‘그를’로 옮겼습니다.
- source_word: ἀναστήσω αὐτὸν
  english_pob_choice: I will raise him up
  chosen_korean: 그를 일으킬 것입니다
  alternatives_korean:
  - 그를 일으켜 세울 것입니다
  - 그를 부활시킬 것입니다
  lexicon: BDAG
  rationale: 요한복음의 종말론적 부활 맥락에서 ‘일으키다’는 αναστήσω의 핵심 이미지를 살리며, ‘부활시키다’보다 본문의 동사적 표현을 더 직접적으로 반영합니다.
theological_decisions:
- issue: ἑλκύσῃ의 신학적 긴장 보존
  chosen_reading: ‘이끌다’로 번역해 아버지의 주도적 행위를 분명히 하되, 강제적 뉘앙스로 단정하지는 않았습니다.
  alternative_readings:
  - ‘끌다’
  - ‘끌어당기다’
  - ‘강제로 끌다’
  rationale: 원어는 사람을 그리스도께 오게 하는 하나님의 작용을 말하지만, 그 방식까지 본문이 확정적으로 풀어 주지는 않으므로, 의미의 힘을 유지하면서도 신학적 결론을 앞서 정하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
