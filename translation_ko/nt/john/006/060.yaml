id: JHN.6.60
reference: John 6:60
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
  footnotes:
  - marker: a
    text: Or “This saying is hard”; λόγος here can also mean “saying,” “message,” or “teaching.”
    reason: lexical_alternative
  - marker: b
    text: Or “who can hear it?” The Greek verb can mean hear, listen to, or heed/accept, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그의 제자들 가운데 많은 사람이 이 말을 듣고 말했습니다. 「이 말은 어렵습니다[a]. 누가 그것을 들을 수 있겠습니까?[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「이 가르침은 어렵습니다」. λόγος는 여기서 ‘말’, ‘말씀’, ‘가르침’이라는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「누가 그것을 받아들일 수 있겠습니까?」. 그리스어 동사는 ‘듣다’, ‘귀 기울이다’, ‘받아들이다’의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  english_pob_choice: many
  chosen_korean: 많은 사람이
  alternatives_korean:
  - 많은 이들이
  - 많은 무리가
  lexicon: BDAG
  rationale: 제자들 무리 안에서 상당수를 가리키는 단순한 수량 표현이므로, 현대 한국어에서 자연스러운 「많은 사람이」로 옮겼습니다.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  english_pob_choice: of his disciples
  chosen_korean: 그의 제자들 가운데
  alternatives_korean:
  - 그의 제자들 중에서
  - 그의 제자들로부터
  lexicon: BDAG
  rationale: 발화자가 제자 집단 내부에서 나온다는 뜻을 살리기 위해 「가운데」를 써서, 단순 소속보다 내부 일부라는 뉘앙스를 드러냈습니다.
- source_word: Σκληρός ἐστιν ὁ λόγος οὗτος
  english_pob_choice: This word is hard
  chosen_korean: 이 말은 어렵습니다
  alternatives_korean:
  - 이 말은 कठ합니다
  - 이 말은 거칩니다
  - 이 말은 힘듭니다
  lexicon: BDAG
  rationale: σκληρός의 ‘딱딱하다/거칠다/감당하기 어렵다’의 폭을 한국어 「어렵습니다」가 가장 무리 없이 담아, 단순 지적 난해성으로만 좁히지 않도록 했습니다.
- source_word: τίς δύναται αὐτοῦ ἀκούειν
  english_pob_choice: who can listen to it
  chosen_korean: 누가 그것을 들을 수 있겠습니까?
  alternatives_korean:
  - 누가 그것을 들을 수 있습니까?
  - 누가 그것에 귀를 기울일 수 있겠습니까?
  lexicon: BDAG
  rationale: ἀκούειν의 ‘듣다/귀 기울이다/받아들이다’ 가능성을 열어 두기 위해 직역에 가까운 「들을 수 있겠습니까」를 택했고, 문맥상 불만의 뉘앙스를 질문형으로 유지했습니다.
theological_decisions:
- issue: 말씀의 ‘어려움’의 성격
  chosen_reading: 예수의 말씀이 지적으로만 어려운 것이 아니라, 듣고 감당하기 어렵다는 포괄적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 지적으로 이해하기 어려운 말씀
  - 도덕적으로 거슬리거나 받아들이기 힘든 말씀
  rationale: σκληρός는 엄격함, 거침, 감당하기 어려움까지 포괄할 수 있으므로, 한국어에서도 의미를 한쪽으로 확정하지 않고 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
