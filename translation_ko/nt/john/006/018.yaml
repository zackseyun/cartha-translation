lexical_decisions:
- source_word: ἥ τε θάλασσα
  english_pob_choice: And the sea
  chosen_korean: 그리고 바다가
  alternatives_korean:
  - 그리고 그 바다가
  - 그런데 바다가
  lexicon: SBLGNT / BDAG
  rationale: θάλασσα는 일반 명사 ‘바다’로 옮기고, τε의 가벼운 연결은 자연스러운 한국어 접속사 ‘그리고’로 반영했습니다.
- source_word: ἀνέμου μεγάλου
  english_pob_choice: a strong wind
  chosen_korean: 바람이 세게
  alternatives_korean:
  - 큰 바람이
  - 강한 바람이
  - 거센 바람이
  lexicon: BDAG
  rationale: μέγας의 기본값인 ‘큰’도 가능하지만, 날씨 맥락에서는 한국어에서 ‘세게/강한/거센’이 더 자연스럽고 의미를 잘 드러냅니다.
- source_word: πνέοντος
  english_pob_choice: was blowing
  chosen_korean: 불고 있었으므로
  alternatives_korean:
  - 불고 있었기에
  - 불고 있는 동안
  - 불고 있었습니다
  lexicon: BDAG
  rationale: 현재 분사로서 바다의 상태를 일으키는 지속적 배경을 나타내므로, 원인·상황을 드러내는 ‘-었으므로’로 옮겼습니다.
- source_word: διεγείρετο
  english_pob_choice: was being stirred up
  chosen_korean: 점점 거세지고 있었습니다
  alternatives_korean:
  - 흔들리고 있었습니다
  - 뒤흔들리고 있었습니다
  - 거칠어지고 있었습니다
  lexicon: BDAG
  rationale: 미완료 수동태의 진행성을 살리면서도, 바다의 상태 변화를 한국어로 자연스럽게 드러내기 위해 ‘점점 거세지고 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: 바다의 상태를 직접적으로 묘사하는 수동·진행 표현
  chosen_reading: ‘거세지고 있었습니다’로 진행 중인 변화와 외부 요인에 의한 상태 변화를 함께 살렸습니다.
  alternative_readings:
  - ‘흔들리고 있었습니다’
  - ‘뒤흔들리고 있었습니다’
  rationale: 본문은 바다가 바람 때문에 지속적으로 영향을 받는 모습을 보여 주므로, 단순 결과보다 과정성을 드러내는 번역이 더 적합합니다.
  doctrine_reference: 서사적 묘사
