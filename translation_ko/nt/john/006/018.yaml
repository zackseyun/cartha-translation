- from: 그리고 바람이 세게 불고 있었으므로 바다가 점점 거세지고 있었습니다.[a]
  to: 그리고 바다는 강한 바람이 불고 있어서 요동하고 있었습니다.[a]
  rationale: 원문의 문장 전개에 맞추어 ‘바다’를 먼저 두고, 현재분사 πνέοντος의 지속적 원인 관계는 ‘불고 있어서’로 옮겼습니다. διεγείρετο의 미완료적 진행과 바람에 의한 교란 상태는 자연스러운 한국어 ‘요동하고 있었습니다’로 반영했습니다. 각주는 가능한 의미 범위를 보존하되, 원문에 없는 ‘점점’의 의미는 제거했습니다.
