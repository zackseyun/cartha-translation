id: JHN.6.40
reference: John 6:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
  footnotes:
  - marker: a
    text: Or 'everyone who beholds the Son and believes in him.' The verb can carry the sense of attentive seeing, not merely physical sight.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''and I will raise him up.'' The Greek explicitly includes ''I,'' adding emphasis: ''I myself will raise him up.'''
    reason: lexical_alternative
translation:
  language: ko
  text: “이는 내 아버지의 뜻입니다. 곧 아들을 보고[a] 그를 믿는 모든 사람이 영원한 생명을 얻는 것이며, 내가 친히[b] 마지막 날에 그를 일으킬 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아들을 바라보고.” θεωρῶν은 단순한 육안 시각보다 주의 깊게 보는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내가 그를 일으킬 것입니다.” 헬라어는 ἐγώ(“내가”)를 분명히 넣어 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  english_pob_choice: For this is
  chosen_korean: “이것이 … 뜻입니다”
  alternatives_korean:
  - “이는 … 뜻입니다”
  - “실로 이것은 … 입니다”
  lexicon: BDAG
  rationale: γάρ의 설명적 연결을 한국어의 자연스러운 앞받침으로 살리고, τοῦτο ἐστιν은 간결하게 “이것이”로 옮겼습니다.
- source_word: τὸ θέλημα τοῦ πατρός μου
  english_pob_choice: the will of my Father
  chosen_korean: “내 아버지의 뜻”
  alternatives_korean:
  - “내 아버지의 원하심”
  - “내 아버지의 의지”
  lexicon: BDAG
  rationale: θέλημα은 문맥상 하나님의 뜻/의도를 가리키므로, 표준적이면서도 신학적 무게를 보존하는 “뜻”으로 옮겼습니다.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν
  english_pob_choice: everyone who sees the Son and believes in him
  chosen_korean: “아들을 보고 그를 믿는 사람마다”
  alternatives_korean:
  - “아들을 바라보고 그를 믿는 사람마다”
  - “아들을 주의 깊게 보고 그를 믿는 사람마다”
  lexicon: BDAG
  rationale: θεωρῶν의 ‘주의 깊게 보다/바라보다’ 가능성을 존중하되, 본문 주석의 선택을 과도하게 고정하지 않기 위해 기본 본문은 “보고”로 두고, 믿음의 대상을 분명히 했습니다.
- source_word: ἔχῃ ζωὴν αἰώνιον
  english_pob_choice: may have eternal life
  chosen_korean: “영원한 생명을 얻게 하는 것입니다”
  alternatives_korean:
  - “영원한 생명을 가질 것입니다”
  - “영원한 생명을 얻게 하려는 것입니다”
  lexicon: BDAG
  rationale: ἵνα + 접속법의 목적/결과 뉘앙스를 살려 “얻게 하는 것입니다”로 옮겼고, ζωὴν αἰώνιον은 요한복음의 관용을 따라 “영원한 생명”으로 번역했습니다.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ
  english_pob_choice: and I myself will raise him up on the last day
  chosen_korean: “그리고 마지막 날에 내가 그를 다시 일으킬 것입니다”
  alternatives_korean:
  - “그리고 마지막 날에 내가 친히 그를 일으킬 것입니다”
  - “그리고 내가 그를 마지막 날에 다시 살릴 것입니다”
  lexicon: BDAG
  rationale: ἀναστήσω는 요한복음의 부활/일으킴 표현을 따라 “다시 일으킬”로 옮겼고, ἐγώ의 강조는 자연스러운 주어 중복으로 과도하지 않게 드러냈습니다.
theological_decisions:
- issue: ἵνα + ἔχῃ의 목적/결과 뉘앙스
  chosen_reading: “영원한 생명을 얻게 하는 것입니다”
  alternative_readings:
  - “영원한 생명을 가지게 하려는 것입니다”
  - “영원한 생명을 얻게 될 것입니다”
  rationale: 문법적으로는 목적/결과를 함께 내포하므로, 한국어도 단순 미래보다 “~게 하는 것입니다”로 옮겨 문장 구조를 보존했습니다.
  doctrine_reference: Preserve grammatical force without flattening the clause.
- issue: ἐγώ의 강조
  chosen_reading: “내가 그를 다시 일으킬 것입니다”
  alternative_readings:
  - “나 자신이 그를 다시 일으킬 것입니다”
  - “내가 친히 그를 다시 일으킬 것입니다”
  rationale: 한국어에서 “내가”만으로도 주어 강조가 충분히 살아나므로, 본문의 ἐγώ가 가진 개인적 책임과 확언을 과장하지 않고 드러냈습니다.
  doctrine_reference: Original-language primacy over translation tradition.
