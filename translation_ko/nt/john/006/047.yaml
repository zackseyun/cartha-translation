  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
  footnotes:
  - marker: a
    text: Or "whoever believes." The Greek has an articular present participle, literally "the one believing."
    reason: lexical_alternative
  - marker: b
    text: Or "everlasting life"; more literally, "life age-lasting / of the age."
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로 진실로 여러분에게 말합니다. 믿는 사람은 영원한 생명을 가집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영생.” αἰώνιος는 문맥상 ‘영원한’의 뜻이지만, 직역하면 ‘영-시대의 / 시대-지속적인’ 생명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
