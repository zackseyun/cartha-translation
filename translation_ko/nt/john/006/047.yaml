  text: 진실로 진실로 내가 여러분에게 말합니다. 믿는 사람은 영원한 생명을 가집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영생.” 직역하면 “시대에 속한 생명.”
    reason: lexical_alternative
