  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
  footnotes:
  - marker: a
    text: Or "whoever believes." The Greek has an articular present participle, literally "the one believing."
    reason: lexical_alternative
  - marker: b
    text: Or "everlasting life"; more literally, "life age-lasting / of the age."
    reason: lexical_alternative
translation:
