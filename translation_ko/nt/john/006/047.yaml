  terminology: ‘영원한 생명’은 ζωὴν αἰώνιον의 표준적이고 적절한 번역입니다. ‘영생’은 유효한 대안입니다. αἰώνιος의 직역적 어원 설명은 ‘시대에 속한’ 정도로 절제하여, 문맥상의 ‘영원한’ 번역과 어원적 표면형을 구별하는 편이 좋습니다.
