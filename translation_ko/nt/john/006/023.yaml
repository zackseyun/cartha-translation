  rationale: 본문은 예수를 가리키는 κύριος이므로, 경칭적이면서도 본문 직결성이 높은 '주'를 본문에 두었습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주/주님'
