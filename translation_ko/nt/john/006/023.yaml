id: JHN.6.23
reference: John 6:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
  footnotes:
  - marker: a
    text: Or, more literally, 'small boats came from Tiberias.' The Greek πλοιάρια is a diminutive form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 디베랴에서 온 배들이 그들이 빵을 먹은 곳 근처에, 곧 주께서 감사하신 뒤였습니다, 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '디베랴에서 온 작은 배들'입니다. 그리스어 πλοιάρια는 지소형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 상황과의 대조를 분명히 하면서도 한국어 문맥에서 자연스럽고 문어적인 접속사로 옮겼습니다.
- source_word: πλοιάρια
  english_pob_choice: boats
  chosen_korean: 배들
  alternatives_korean:
  - 작은 배들
  - 배
  lexicon: BDAG
  rationale: 영어 POB의 본문은 일반적으로 'boats'로 처리했지만, 그리스어의 지소형 뉘앙스는 주석에서 다루는 편이 더 안전하여 본문에는 중립적인 '배들'로 옮겼습니다.
- source_word: ἐγγὺς τοῦ τόπου
  english_pob_choice: near the place
  chosen_korean: 그들이 빵을 먹은 곳 근처에
  alternatives_korean:
  - 그 장소 가까이에
  - 그곳 근처에
  lexicon: BDAG
  rationale: 바로 뒤의 관계절이 장소를 특정하므로, 단순히 '곳 근처'보다 한국어에서 더 자연스럽게 대상 장소를 되살려 주는 표현으로 옮겼습니다.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  english_pob_choice: after the Lord had given thanks
  chosen_korean: 주께서 감사하신 뒤였습니다
  alternatives_korean:
  - 주께서 감사하신 후
  - 주님이 감사하신 뒤
  lexicon: BDAG
  rationale: 분사구의 선행 행위를 한국어에서 자연스럽게 드러내기 위해 '뒤였습니다'로 처리했고, κύριος는 예수에게 대한 호칭으로 '주'를 유지했습니다.
theological_decisions:
- issue: κύριος의 호칭 유지
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 주인
  rationale: 본문은 예수를 가리키는 κύριος이므로, 경칭적이면서도 본문 직결성이 높은 '주'를 본문에 두었습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주/주님'
