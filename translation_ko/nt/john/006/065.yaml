source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
  footnotes:
  - marker: a
    text: Or “unless it has been granted to him from the Father.”
    reason: lexical_alternative
  - marker: b
    text: The Greek says “to him,” using a masculine singular form with generic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 말씀하셨습니다. “이런 이유로 내가 너희에게 말했습니다. 아무도 아버지께로부터 그에게 주어지지 않으면 내게 올 수 없습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아버지께로부터 그에게 허락되지 않으면.”
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 남성 단수형을 쓰지만, 일반적인 사람을 가리키는 뜻으로 사용되었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  english_pob_choice: he was saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하고 계셨습니다
  - 말하셨습니다
  lexicon: BDAG
  rationale: 미완료 시제의 진행성은 한국어에서 문맥상 자연스러운 과거 서술로 충분히 드러나므로, 공손한 서술체인 “말씀하셨습니다”를 택했습니다.
- source_word: Διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 이런 이유로
  alternatives_korean:
  - 이 때문에
  - 그래서
  lexicon: BDAG
  rationale: 앞선 문맥을 가리키는 인과 연결을 살리되, 한국어에서 너무 설명적이거나 구어체로 흐르지 않도록 “이런 이유로”로 옮겼습니다.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  english_pob_choice: unless it has been given
  chosen_korean: 주어지지 않으면
  alternatives_korean:
  - 주어지지 않는 한
  - 허락되지 않으면
  lexicon: BDAG
  rationale: δεδομένον의 수동 의미를 살려 “주어지다”로 옮겼고, 조건문에서는 한국어 관용에 따라 부정 조건으로 자연스럽게 표현했습니다.
- source_word: ἐκ τοῦ πατρός
  english_pob_choice: from the Father
  chosen_korean: 아버지께로부터
  alternatives_korean:
  - 아버지에게서
  - 아버지로부터
  lexicon: BDAG
  rationale: ἐκ의 출처/기원 의미를 반영해 “아버지께로부터”로 옮겼으며, 관계 문맥상 하나님 아버지를 가리키는 표현으로 읽었습니다.
theological_decisions:
- issue: 주어지다/허락되다의 신학적 긴장
  chosen_reading: 본문의 조건을 “주어지지 않으면”으로 सीधे 옮겨, 아버지에게서 오는 부여가 선행한다는 진술을 그대로 남겼습니다.
  alternative_readings:
  - 허락되지 않으면
  - 가능하게 되지 않으면
  rationale: 본문은 예수께 나아옴이 아버지에게서 주어지는 것에 달려 있음을 말하지만, 그 방식까지 체계화하지는 않습니다. 따라서 신학적 해석을 덧씌우지 않고 긴장을 보존했습니다.
  doctrine_reference: 성경 본문의 긴장 보존
