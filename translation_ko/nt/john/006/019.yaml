id: JHN.6.19
reference: John 6:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
  footnotes:
  - marker: a
    text: A stadion was an ancient unit of distance; twenty-five or thirty stadia is roughly three to four miles (about five to six kilometers).
    reason: cultural_note
  - marker: b
    text: Or 'walking on the water.' The Greek literally says 'walking on the sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 약 스물다섯이나 서른 스타디온을 노를 저어 갔을 때[a], 예수께서 바다 위를 걸어[b] 배 가까이 오시는 것을 보았고, 그들은 두려워했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스타디온은 고대의 거리 단위로, 스물다섯이나 서른 스타디온은 대략 5~6킬로미터(약 3~4마일)입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘물 위를 걸어’. 헬라어는 문자적으로 ‘바다 위를 걸어’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  english_pob_choice: had rowed
  chosen_korean: 노를 저어 갔을 때
  alternatives_korean:
  - 배를 몰았을 때
  - 가려고 했을 때
  lexicon: BDAG
  rationale: 뱃사공의 추진 행위를 나타내는 말이므로, 문맥상 자연스럽고 정확한 '노를 저어'를 택했습니다. 완료분사로서 앞선 행위를 배경에 두는 점은 '-았을 때'로 살렸습니다.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  english_pob_choice: twenty-five or thirty stadia
  chosen_korean: 약 스물다섯이나 서른 스타디온쯤
  alternatives_korean:
  - 약 세 내지 네 마일쯤
  - 스물다섯 또는 서른 스타디온
  lexicon: BDAG
  rationale: 본문의 고대 거리 단위를 그대로 드러내기 위해 '스타디온'을 유지하고, 'ὡς'의 완곡한 근사치를 '약 …쯤'으로 옮겼습니다.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  english_pob_choice: walking on the sea
  chosen_korean: 바다 위를 걸어
  alternatives_korean:
  - 바다 위를 걷는
  - 물 위를 걸어
  lexicon: BDAG
  rationale: 원문은 θάλασσα(바다)를 말하므로 '물'로 바꾸지 않고 '바다 위를'로 옮겼습니다. 동작의 진행을 한국어 자연문으로 살리기 위해 동사구를 간결하게 구성했습니다.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  english_pob_choice: coming near the boat
  chosen_korean: 배 가까이 오시는 것을
  alternatives_korean:
  - 배에 가까워지는 것을
  - 배 가까이 다가오시는 것을
  lexicon: BDAG
  rationale: γίνομαι와 ἐγγύς의 결합은 단순한 위치가 아니라 '가까워지다/다가오다'의 움직임을 나타내므로, 이를 반영해 '배 가까이 오시는'으로 옮겼습니다. 예수께 대한 서술이므로 존칭을 유지했습니다.
theological_decisions:
- issue: 기적 장면의 직설성을 약화하지 않는 표현
  chosen_reading: 바다 위를 걸어
  alternative_readings:
  - 바다 곁을 걸어
  - 물 위를 걸어
  rationale: 원문은 ἐπὶ τῆς θαλάσσης로 바다 자체를 배경이 아니라 걸음의 대상처럼 제시합니다. 한국어에서도 그 충격을 그대로 드러내기 위해 '바다 위를'을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3
