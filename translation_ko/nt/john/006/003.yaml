  - severity: low
    issue: ‘산으로 올라가셨고’의 연결이 다소 직역적으로 들릴 수 있습니다.
    rationale: ‘산에 올라가셔서’는 εἰς τὸ ὄρος와 ἀνῆλθεν의 결합을 자연스럽게 살리고, 뒤따르는 ‘거기에서 앉아 계셨습니다’와의 순차 관계를 명료하게 합니다.
