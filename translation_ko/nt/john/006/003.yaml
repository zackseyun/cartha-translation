  source_fidelity: 원문의 ἀνῆλθεν, εἰς τὸ ὄρος, ἐκεῖ, ἐκάθητο, μετὰ τῶν μαθητῶν αὐτοῦ의 장소 이동과 그곳에서 제자들과 함께 앉아 있는 장면을 충실히 반영합니다. 다만 원문의 서사 진행 표지 δέ가 현 번역에서는 명시되지 않아, 자연스러운 범위에서 ‘그때’를 보충하는 편이 더 좋습니다.
  naturalness: ‘산에 올라가셔서, 거기에서 제자들과 함께 앉아 계셨습니다’는 현대 표준어 합쇼체에서 자연스럽고, 미완료형 ἐκάθητο의 지속적인 장면도 적절히 드러냅니다. ‘산으로 올라가셨고’도 이해되지만, ‘산에 올라가셔서’가 이동의 목적지와 이어지는 동작을 더 매끄럽게 연결합니다.
  terminology: ‘제자들’은 μαθηταί에 대한 복음서 문맥의 표준적이고 적절한 번역입니다. 인명에는 한국어 성경 문체에 맞추어 ‘예수께서는’을 사용했습니다.
