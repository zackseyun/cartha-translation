id: JHN.6.3
reference: John 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀνῆλθεν δὲ εἰς τὸ ⸀ὄρος Ἰησοῦς, καὶ ἐκεῖ ἐκάθητο μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: ko
  text: 예수님은 산으로 올라가셨고, 거기에서 제자들과 함께 앉아 계셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  english_pob_choice: went up
  chosen_korean: 올라가셨고
  alternatives_korean:
  - 올라가셨습니다
  - 산으로 가셨고
  - 오르셨고
  lexicon: BDAG
  rationale: 지리적 이동을 자연스럽게 나타내면서도, 상위 위치로 이동한다는 원문 동사를 그대로 반영했습니다.
- source_word: εἰς τὸ ὄρος
  english_pob_choice: on the mountain
  chosen_korean: 산으로
  alternatives_korean:
  - 산 위로
  - 그 산으로
  - 산에
  lexicon: BDAG
  rationale: 동사 ἀνῆλθεν과 결합해 ‘산 쪽/산으로 올라감’의 방향성을 살리되, 한국어에서 ‘산에 올라가셨습니다’보다 간결하게 처리했습니다.
- source_word: ἐκάθητο
  english_pob_choice: sat
  chosen_korean: 앉아 계셨습니다
  alternatives_korean:
  - 앉아 있었습니다
  - 앉으셨습니다
  - 계셨습니다
  lexicon: BDAG
  rationale: 미완료시제의 지속적 장면을 살려 단순 완료형보다 ‘앉아 계셨습니다’가 상황의 지속을 더 잘 드러냅니다.
- source_word: μαθητῶν
  english_pob_choice: disciples
  chosen_korean: 제자들
  alternatives_korean:
  - 학생들
  - 따르는 이들
  lexicon: BDAG
  rationale: 복음서 맥락에서 μαθητής는 관계적·제자도적 의미가 강하므로 ‘제자들’이 가장 적절합니다.
theological_decisions:
- issue: 예수님의 위치와 동작을 어떻게 자연스럽게 옮길지
  chosen_reading: ‘산으로 올라가셨고, 거기에서 제자들과 함께 앉아 계셨습니다’로 옮겨 단순한 이동과 그곳에서의 머묾을 함께 보이도록 했습니다.
  alternative_readings:
  - ‘산에 올라가셨고 거기서 제자들과 함께 앉아 계셨습니다’
  - ‘산 위로 올라가셨고 거기에서 제자들과 함께 앉아 계셨습니다’
  rationale: 본문은 특별한 상징 설명보다 장소 이동과 자리함을 차분히 서술하므로, 과장하지 않고 장면성을 살리는 번역이 적절합니다.
  doctrine_reference: 복음서 서술의 장면 묘사 원칙
