id: JHN.6.1
reference: John 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
  footnotes:
  - marker: a
    text: Or, more formally, 'After these things, Jesus departed beyond the Sea of Galilee, of Tiberias.'
    reason: lexical_alternative
  - marker: b
    text: The 'Sea of Galilee' was also known as the 'Sea of Tiberias.' John includes both names to identify the same body of water.
    reason: cultural_note
translation:
  language: ko
  text: 이 일들 후에 예수께서 갈릴리 바다, 곧 티베리아스 바다의 저편으로 가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, ‘갈릴리 바다’라고도 불리는 ‘티베리아스 바다’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 이 일들 후에
  alternatives_korean:
  - 이후에
  - 그 뒤에
  lexicon: SBLGNT
  rationale: 복수 지시어 ταῦτα를 살려 사건들의 전개를 자연스럽게 이어 주는 표현으로 옮겼습니다.
- source_word: ἀπῆλθεν
  english_pob_choice: went away
  chosen_korean: 가셨습니다
  alternatives_korean:
  - 떠나셨습니다
  - 가셨습니다
  lexicon: BDAG
  rationale: 이동을 나타내는 간결한 서술로, 본문의 서사 흐름을 해치지 않는 자연스러운 합쇼체로 옮겼습니다.
- source_word: πέραν τῆς θαλάσσης
  english_pob_choice: to the other side of the Sea
  chosen_korean: 바다의 저편으로
  alternatives_korean:
  - 바다 건너편으로
  - 저편으로
  lexicon: BDAG
  rationale: πέραν의 방향성을 살려 ‘저편’으로 표현했고, 목적격적 이동을 한국어 조사로 자연화했습니다.
- source_word: τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος
  english_pob_choice: the Sea of Galilee, which is the Sea of Tiberias
  chosen_korean: 갈릴리 바다, 곧 티베리아스 바다
  alternatives_korean:
  - 갈릴리 바다, 곧 티베리아스의 바다
  - 갈릴리 바다, 즉 티베리아스 바다
  lexicon: BDAG
  rationale: 두 겹의 속격을 같은 수역의 이중 명칭으로 처리해, 두 이름이 동일한 바다를 가리킨다는 점을 드러냈습니다.
theological_decisions:
- issue: 해안/호수 명칭의 병기
  chosen_reading: 갈릴리 바다와 티베리아스 바다를 같은 대상의 이중 명칭으로 제시했습니다.
  alternative_readings:
  - 티베리아스 바다라고만 옮김
  - 갈릴리 호수라고 옮김
  rationale: 요한이 지리적 동일성을 독자에게 확인시키는 방식이므로, 두 명칭을 함께 유지하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 본문의 지리적 식별 방식
