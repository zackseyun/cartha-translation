id: JHN.6.61
reference: John 6:61
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
  footnotes:
  - marker: a
    text: Or, “Does this cause you to stumble?”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서는 제자들이 이 일 때문에 불평하고 있는 것을 속으로 아시고 그들에게 말씀하셨습니다. “이것이 너희에게 걸림돌이 됩니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이것이 너희를 실족하게 합니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς δὲ
  english_pob_choice: knowing
  chosen_korean: 속으로 아시고
  alternatives_korean:
  - 아시고
  - 알고 계시고
  lexicon: BDAG
  rationale: 분사 εἰδὼς는 예수의 동시적 인식을 나타내므로, 한국어에서는 자연스럽게 ‘속으로 아시고’로 옮겨 내적 인식의 뉘앙스를 살렸습니다.
- source_word: ἐν ἑαυτῷ
  english_pob_choice: in himself
  chosen_korean: 속으로
  alternatives_korean:
  - 자기 안에서
  - 자신 안에서
  lexicon: BDAG
  rationale: 직역하면 ‘자기 안에서’이지만, 문맥상 외적 보고가 아니라 내적 인식을 가리키므로 한국어에서는 자연스럽고 간결하게 ‘속으로’로 표현했습니다.
- source_word: γογγύζουσιν
  english_pob_choice: were grumbling
  chosen_korean: 수군거리고 있다는
  alternatives_korean:
  - 투덜거리고 있다는
  - 불평하고 있다는
  lexicon: BDAG
  rationale: γογγύζω는 불만 섞인 중얼거림을 뜻하므로, 공동체적·부정적 뉘앙스를 살린 ‘수군거리다’를 선택했습니다.
- source_word: σκανδαλίζει
  english_pob_choice: offend
  chosen_korean: 걸려 넘어지게 합니까
  alternatives_korean:
  - 불쾌하게 합니까
  - 마음에 거슬립니까
  lexicon: BDAG
  rationale: σκανδαλίζω는 단순한 감정적 불쾌감보다 더 강한 ‘걸려 넘어짐/실족’의 가능성을 담고 있어, 본문이 지닌 신학적 긴장을 살리기 위해 직역에 가까운 표현을 택했습니다.
theological_decisions:
- issue: σκανδαλίζει의 의미 범위
  chosen_reading: 예수의 말씀이 단지 불쾌감을 주는지보다, 믿음에서 걸려 넘어지게 하는지를 묻는 것으로 읽었습니다.
  alternative_readings:
  - 이것이 너희를 불쾌하게 합니까?
  - 이것이 너희를 화나게 합니까?
  rationale: 요한복음 문맥에서 σκανδαλίζω는 반감 이상의 의미, 곧 예수를 거부하게 될 위험을 포함할 수 있으므로 그 긴장을 풀지 않고 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
