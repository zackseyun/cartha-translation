revisions:
- from: 예수께서는 제자들이 이것에 대해 수군거리고 있다는 것을 속으로 아시고 그들에게 말씀하셨습니다. 「이것이 너희를 걸려 넘어지게 합니까?」[a]
  to: 예수께서는 제자들이 이 일 때문에 불평하고 있는 것을 속으로 아시고 그들에게 말씀하셨습니다. “이것이 너희에게 걸림돌이 됩니까?”[a]
  rationale: 중복된 각주를 실제 어휘 대안으로 바로잡고, γογγύζουσιν의 불만 섞인 중얼거림을 ‘불평하고 있다’로 명확히 했습니다. σκανδαλίζει는 본문에서 자연스러운 ‘걸림돌이 되다’로 옮기고, 각주에서 ‘실족하게 하다’를 제시하여 은유적·신학적 긴장을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:03Z'
review_pass:
  verdict: revise
  source_fidelity: ‘속으로 아시고’는 ἐν ἑαυτῷ의 내적 인식을 적절히 반영합니다. 그러나 γογγύζουσιν은 불만을 품고 중얼거리거나 불평하는 뜻이므로 ‘수군거리다’보다 ‘불평하다’가 더 정확합니다. σκανδαλίζει의 ‘걸려 넘어짐/실족’ 은유는 보존하되, 한국어 본문에서는 자연스러운 표현으로 옮기고 각주에서 명시하는 것이 좋습니다.
  naturalness: ‘이것에 대해 수군거리고 있다는 것’은 다소 어색하며, ‘이 일 때문에 불평하고 있는 것을’이 현대 표준어 합쇼체 서술에 더 자연스럽습니다. ‘너희를 걸려 넘어지게 합니까’는 어법상 가능하지만 다소 직역투이므로 ‘너희에게 걸림돌이 됩니까’가 자연스럽습니다.
  terminology: ‘제자들’, ‘예수께서’, ‘말씀하셨습니다’는 적절합니다. σκανδαλίζω는 본문에서 ‘걸림돌이 되다’로, 각주에서 ‘실족하게 하다’로 보완하여 감정적 불쾌감과 신앙적 걸려 넘어짐의 의미 범위를 열어 둡니다.
