source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
  footnotes:
  - marker: a
    text: Or 'from the presence of God' or 'with God.' The Greek phrase can carry a nuance of personal proximity as well as source.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 아버지를 보았다는 말은 아닙니다. 하나님에게서 오신[a] 그분만이 아버지를 보셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 임재로부터 오신 분’ 또는 ‘하나님과 함께 계신 분’. 이 그리스어 표현은 출처뿐 아니라 인격적 가까움의 뉘앙스도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  english_pob_choice: Not that
  chosen_korean: 아무도 아버지를 본 사람이 없다는 뜻이 아닙니다
  alternatives_korean:
  - 그것은 아무도 아버지를 본 적이 없다는 뜻이 아닙니다
  - 아버지를 본 사람이 없다는 말이 아닙니다
  lexicon: BDAG
  rationale: 앞절의 말을 바로잡는 설명적 완화이므로, 한국어에서도 원인보다 교정의 기능이 드러나도록 ‘~다는 뜻이 아닙니다’로 옮겼습니다.
- source_word: ἑώρακέν τις
  english_pob_choice: anyone has seen
  chosen_korean: 아무도 아버지를 본 사람이 없다는
  alternatives_korean:
  - 누군가 아버지를 보았다는
  - 어떤 사람이라도 아버지를 보았다는
  lexicon: BDAG
  rationale: 부정문에서 τις는 일반적으로 ‘아무도’로 자연스럽게 처리할 수 있으며, 완료 시제는 ‘본 적이 있다/본 사람’의 현재 관련성을 살렸습니다.
- source_word: ὁ ὢν παρὰ τοῦ θεοῦ
  english_pob_choice: the one who is from God
  chosen_korean: 하나님에게서 오신 분
  alternatives_korean:
  - 하나님에게서 나온 분
  - 하나님 곁에 계신 분
  lexicon: BDAG
  rationale: παρά + 속격의 출처/기원 뉘앙스를 기본으로 따라 ‘~에게서 오신 분’으로 옮겼고, 문맥상 인격적 출처를 드러내는 표현을 택했습니다.
- source_word: ἑώρακεν τὸν πατέρα
  english_pob_choice: he has seen the Father
  chosen_korean: 아버지를 보셨습니다
  alternatives_korean:
  - 아버지를 보았습니다
  - 아버지를 뵈었습니다
  lexicon: BDAG
  rationale: 예수에 대한 존칭을 고려해 서술문에서 ‘보셨습니다’로 옮기되, 본문의 완료 시제가 주는 현재적 사실성은 유지했습니다.
theological_decisions:
- issue: παρὰ τοῦ θεοῦ의 관계 뉘앙스
  chosen_reading: 하나님에게서 오신 분
  alternative_readings:
  - 하나님 앞에 계신 분
  - 하나님과 함께 계신 분
  - 하나님의 임재에서 오신 분
  rationale: 본문은 아버지를 본 유일한 분의 신적 기원/파송을 말하지만, 한국어 본문에서는 과도한 형이상학적 해석보다 출처 중심 표현이 가장 직접적입니다. 각주는 공간적·관계적 뉘앙스가 가능함을 보존합니다.
  doctrine_reference: 요한복음의 아들-아버지 관계, 번역 원칙 §1, §3
