  to: 누구든지 아버지를 보았다는 말은 아닙니다. 하나님에게서 오신[a] 그분만이 아버지를 보셨습니다.
  rationale: οὐχ ὅτι를 ‘누구든지 아버지를 보았다는 말은 아닙니다’로 옮겨, 앞선 발언을 바로잡거나 한정하는 원문의 기능을 보존했습니다. εἰ μὴ의 예외는 ‘하나님에게서 오신 그분만이’로 명확히 드러냈고, οὗτος의 강조는 ‘그분만이’로 반영했습니다. 각주 표지는 설명 대상인 παρὰ τοῦ θεοῦ에 맞추어 이동했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:05Z'
