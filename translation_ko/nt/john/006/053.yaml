id: JHN.6.53
reference: John 6:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
  footnotes:
  - marker: a
    text: Or 'body' for 'flesh'; Greek has 'flesh' (σάρξ), which preserves the concrete force of the saying.
    reason: lexical_alternative
  - marker: b
    text: The verse says simply 'life,' not 'eternal life,' though the wider context in John often connects this life with eternal life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수께서 그들에게 말씀하셨습니다. “진실로 진실로 여러분에게 말합니다. 인자의 살을 먹고 그의 피를 마시지 않으면, 여러분은 자기 안에 생명이 없습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살’은 헬라어 σάρξ의 직접 대응어로, 본문의 구체적이고 육체적인 충격을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 단순히 ‘생명’이라고 말하며, ‘영생’이라는 수식어는 없습니다. 다만 요한복음의 더 넓은 문맥은 이 생명을 영원한 생명과 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν οὖν
  english_pob_choice: So ... said
  chosen_korean: 그러므로 ... 말씀하셨습니다
  alternatives_korean:
  - 그래서 ... 말씀하셨습니다
  - 그때 ... 말씀하셨습니다
  lexicon: SBLGNT / BDAG
  rationale: οὖν의 인과·연결 기능을 한국어의 자연스러운 추론 연결어 ‘그러므로’로 살려 앞 문맥과의 이어짐을 드러냈습니다.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly, truly, I say to you
  chosen_korean: 진실로 진실로 여러분에게 말합니다
  alternatives_korean:
  - 아멘 아멘 여러분에게 말합니다
  - 진실로 여러분에게 말합니다
  lexicon: BDAG
  rationale: 요한복음의 강조 공식은 한국어에서 반복을 유지한 ‘진실로 진실로’가 가장 직접적이며, 교회적 관용어를 그대로 음역한 ‘아멘 아멘’보다 현재 독자에게 의미 기능이 분명합니다.
- source_word: σάρκα
  english_pob_choice: flesh
  chosen_korean: 살
  alternatives_korean:
  - 육체
  - 몸
  lexicon: BDAG
  rationale: σάρξ의 구체적이고 충격적인 육체성을 살려 ‘몸’으로 완화하지 않고 ‘살’로 옮겼습니다. 이는 영어 POB가 ‘flesh’를 유지한 판단과 같습니다.
- source_word: τὸ αἷμα
  english_pob_choice: blood
  chosen_korean: 피
  alternatives_korean:
  - 혈액
  - 피를 흘린 것
  lexicon: BDAG
  rationale: αἷμα의 직설적 이미지를 그대로 살리기 위해 일상적이면서도 강한 표현인 ‘피’를 선택했습니다.
- source_word: ζωὴν ἐν ἑαυτοῖς
  english_pob_choice: life in yourselves
  chosen_korean: 자기 안에 생명이 없습니다
  alternatives_korean:
  - 자기들 안에 생명이 없습니다
  - 여러분 안에 생명이 없습니다
  lexicon: BDAG
  rationale: 문맥상 집단 청중을 가리키므로 복수 존칭의 의미를 반영하되, ἐν ἑαυτοῖς의 직접성을 살려 ‘자기 안에’로 옮겼습니다. ‘영생’으로 확장하지 않고 단순히 ‘생명’을 유지했습니다.
theological_decisions:
- issue: σάρξ와 αἷμα의 식음 언어를 어떻게 처리할지
  chosen_reading: 비유적 완화 없이 ‘살을 먹고 그의 피를 마시다’라는 직설적 표현을 유지했습니다.
  alternative_readings:
  - ‘받아먹다’처럼 성례적 어휘로 풀기
  - ‘몸을 먹고’로 완화하기
  rationale: 본문은 의도적으로 거칠고 도발적인 표현을 사용하므로, 신학적 해석을 미리 결론짓지 않고 긴장을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3; contested terms guidance for σάρξ
- issue: ζωὴν을 ‘영생’으로 확장할지 여부
  chosen_reading: 본문 그대로 ‘생명’으로 유지했습니다.
  alternative_readings:
  - ‘영생’
  rationale: 이 절에는 αἰώνιος가 없으므로, 요한문맥상의 신학을 근거로 본문에 없는 수식을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1 and §3
