lexical_decisions:
- source_word: ἐγώ εἰμι
  english_pob_choice: I am
  chosen_korean: 내가 …입니다
  alternatives_korean:
  - 나는 …입니다
  - 내가 바로 …입니다
  lexicon: BDAG
  rationale: 헬라어의 1인칭 주어와 동사의 결합을 자연스러운 한국어 주어-서술 구문으로 옮기되, 예수의 자기 동일시를 분명히 드러내기 위해 주어를 살렸습니다.
- source_word: ὁ ἄρτος
  english_pob_choice: the bread
  chosen_korean: 떡
  alternatives_korean:
  - 빵
  - 빵덩이
  - 빵 한 조각
  lexicon: BDAG
  rationale: ‘the bread’의 정체 규정적 힘을 살리면서도 요한복음의 상징적 선언에 맞는 한국어 성경체 표현으로 ‘떡’을 택했습니다.
- source_word: τῆς ζωῆς
  english_pob_choice: of life
  chosen_korean: 생명의
  alternatives_korean:
  - 생명을 주는
  - 생명을 위한
  lexicon: BDAG
  rationale: 속격을 직역해 ‘~의’ 구조를 유지함으로써 요한복음 특유의 압축된 표현을 보존했습니다.
theological_decisions:
- issue: ἐγώ εἰμι의 자기 계시적 울림
  chosen_reading: 문장 자체는 단순한 서술문으로 번역하되, ‘내가’라는 주어를 유지해 예수의 강한 자기 동일시를 보존했습니다.
  alternative_readings:
  - 나는 생명의 떡입니다
  - 내가 곧 생명의 떡입니다
  rationale: 원문은 절대적 ἐγώ εἰμι가 아니라 서술격 문장이므로, 원문에 없는 ‘곧’을 넣어 해설하지 않고도 그리스도론적 무게를 유지하는 쪽이 적절합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
