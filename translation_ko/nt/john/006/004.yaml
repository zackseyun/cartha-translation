  yaml_path: translation/nt/john/006/004.yaml
  text: Now the Passover[a], the feast of the Jews, was near.
  footnotes:
  - marker: a
    text: Or 'the feast of the Judeans.' The Greek term can denote either Jews generally or Judeans in particular, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인의 명절인 유월절이 가까웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἰουδαίων은 문맥에 따라 ‘유대인’ 또는 ‘유다 사람들’을 가리킬 수 있습니다. 여기서는 유월절을 가리키는 문맥이므로 ‘유대인의’로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἐγγὺς
  english_pob_choice: Now ... was near
  chosen_korean: 가까웠습니다
  alternatives_korean:
  - 가까이 있었습니다
  - 다가오고 있었습니다
  lexicon: BDAG
  rationale: ἦν + ἐγγύς는 사건의 시간적 근접을 나타내므로, 한국어에서는 과도한 직역보다 자연스러운 시제·상황 표현인 ‘가까웠습니다’가 적절합니다.
- source_word: πάσχα
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 파스카
  - 이스라엘의 명절
  lexicon: BDAG
  rationale: πάσχα는 유대 절기인 유월절을 가리키므로, 표준 한국어 성경 용례에 맞는 ‘유월절’로 옮겼습니다.
- source_word: ἑορτὴ
  english_pob_choice: feast
  chosen_korean: 명절
  alternatives_korean:
  - 절기
  - 축제
  lexicon: BDAG
  rationale: ἑορτή는 단순한 행사보다 종교적 축일의 뉘앙스가 강하므로, 현대 한국어에서 자연스럽고 의미를 잘 담는 ‘명절’을 택했습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인들의
  alternatives_korean:
  - 유다인들의
  - 유대인의
  lexicon: BDAG
  rationale: 여기서는 지역명보다 민족·종교 공동체를 가리키는 뉘앙스가 자연스럽기 때문에, 본문 의미를 직접 드러내는 ‘유대인들의’로 옮겼습니다.
theological_decisions:
- issue: Ἰουδαίων의 한국어 처리와 반유대주의적 오해 방지
  chosen_reading: 유대인들의 명절
  alternative_readings:
  - 유다인들의 명절
  - 유대인의 절기
  rationale: 요한복음의 Ἰουδαῖοι는 문맥에 따라 다양한 범위를 가리키지만, 이 절에서는 유월절을 설명하는 일반적 종교 표지이므로 ‘유대인들의’가 가장 자연스럽고, 반유대주의적 독해를 조장하지 않도록 맥락을 유지합니다.
  doctrine_reference: 문맥 우선의 원문 의미 보존
- issue: ‘Now’의 서술 기능
  chosen_reading: 그때는
  alternative_readings:
  - 이때
  - 그런데
  rationale: δέ는 단순한 서술 연결어로서 장면 전환을 부드럽게 표시하므로, 한국어에서는 의미를 과장하지 않는 ‘그때는’으로 문맥 흐름을 살렸습니다.
  doctrine_reference: 서사 연결의 자연스러운 재현
