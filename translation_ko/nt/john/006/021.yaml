revisions:
- from: 그러므로 그들은 그를 배에 태우려 했습니다[a]. 그러자 곧 배는 그들이 가고 있던 땅에 이르렀습니다.
  to: 그래서 그들은 기꺼이 그를 배에 태우고자 했습니다. 그리고 곧 배는 그들이 가고 있던 땅에 이르렀습니다[a].
  rationale: ἤθελον의 수용·동의의 태도와 εὐθέως의 즉시성을 유지하되, 현대 한국어에서 자연스럽게 다듬었습니다. γῆ를 ‘땅’으로 유지하여 ‘해안’이라는 문맥적 해석은 각주로만 제시했고, 각주 표지를 해당 둘째 절로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:04Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘태우려 했습니다’는 문맥상 가능하지만 실제로 태우려 시도했다는 뜻으로도 읽힐 수 있어, ἤθελον의 동의·수용의 태도를 더 분명히 드러내는 표현이 낫습니다. δεύτε 절의 ‘땅에 이르렀습니다’는 ἐγένετο ... ἐπὶ τῆς γῆς의 갑작스러운 도착을 자연스럽게 전달합니다.
  naturalness: ‘그러므로’와 이어지는 ‘그러자’의 중첩은 다소 무겁습니다. ‘그래서 … 그리고 곧’이 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 οὖν과 καί의 연결도 충분히 반영합니다.
  terminology: ‘배’, ‘땅’은 πλοῖον, γῆ에 적절합니다. 본문의 대안은 둘째 절에 관한 것이므로 각주 표지는 첫 절이 아니라 둘째 절에 두어야 합니다.
  issues:
  - severity: medium
    issue: ἤθελον의 번역
    rationale: ‘그를 배에 태우려 했습니다’는 의도 또는 시도의 뉘앙스를 낼 수 있습니다. 여기서는 두려움이 가신 제자들이 예수를 배에 받아들이려 한 태도를 나타내므로 ‘기꺼이 … 태우고자 했습니다’가 수용 의지를 더 잘 전달합니다.
  - severity: low
    issue: 접속 표현의 중복
    rationale: ‘그러므로 … 그러자’는 원문의 οὖν과 καί를 모두 결과 접속으로 강화하여 한국어 문장이 다소 경직됩니다. 둘째 연결을 ‘그리고’로 옮기면 자연스럽습니다.
  - severity: medium
    issue: 각주 표지 위치
    rationale: 각주의 대안은 ‘곧 배가 … 해안에 도착했습니다’라는 둘째 절의 표현에 해당하므로, 표지는 해당 절 끝에 위치해야 합니다.
  revised_text: 그래서 그들은 기꺼이 그를 배에 태우고자 했습니다. 그리고 곧 배는 그들이 가고 있던 땅에 이르렀습니다[a].
  revised_footnotes:
