    text: 또는 ‘곧 배가 그들이 가고 있던 해안에 도착했습니다.’
    reason: lexical_alternative
  revision_rationale: ἤθελον의 수용·동의의 태도와 εὐθέως의 즉시성을 유지하되, 현대 한국어에서 자연스럽게 다듬었습니다. γῆ를 ‘땅’으로 유지하여 ‘해안’이라는 문맥적 해석은 각주로만 제시했고, 각주 표지를 해당 둘째 절로 옮겼습니다.
