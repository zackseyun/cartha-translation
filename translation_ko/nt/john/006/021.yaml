id: JHN.6.21
reference: John 6:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
  footnotes:
  - marker: a
    text: Or 'immediately the boat arrived at the shore to which they were going.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 그를 배에 태우려 했습니다[a]. 그러자 곧 배는 그들이 가고 있던 땅에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러자 곧 배가 그들이 가고 있던 해안에 도착했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  english_pob_choice: they were willing
  chosen_korean: 그들은 그를 배에 태우려 했습니다
  alternatives_korean:
  - 그들은 그를 배에 태우고 싶어 했습니다
  - 그들은 그를 배에 데려가려 했습니다
  lexicon: BDAG
  rationale: 미완료 과거의 θέλω는 단순한 순간적 의지보다 태도나 준비 상태를 나타내므로, 한국어에서는 ‘~하려 했습니다’로 옮겨 서술 흐름을 자연스럽게 살렸습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런즉
  lexicon: BDAG
  rationale: 앞 문맥에서 이어지는 결과나 전개를 표시하므로, 현대 한국어에서 연결감을 분명히 하는 ‘그러므로’가 적절합니다.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  english_pob_choice: the boat was at the land
  chosen_korean: 배는 … 땅에 이르렀습니다
  alternatives_korean:
  - 배는 … 땅에 있었습니다
  - 배는 … 해안에 도착했습니다
  lexicon: BDAG
  rationale: γίνομαι+장소 표현은 단순 존재보다 ‘그곳에 이르게 됨’을 뜻할 수 있으므로, 원문의 돌연성을 살리면서도 한국어로 자연스러운 ‘이르렀습니다’를 택했습니다.
- source_word: γῆς
  english_pob_choice: land
  chosen_korean: 땅
  alternatives_korean:
  - 육지
  - 땅가
  lexicon: BDAG
  rationale: 이 문맥에서 γῆ는 물가의 지점이 아니라 목적지의 ‘땅’을 가리키므로, POB의 ‘land’와 대응되게 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 배가 ‘즉시’ 목적지에 있게 된 사건의 표현을 설명적으로 완화할지 여부
  chosen_reading: 원문의 급작스러운 전개를 그대로 살려 ‘그러자 곧 배는 … 이르렀습니다’로 옮겼습니다.
  alternative_readings:
  - 그러자 배는 곧 해안에 도착했습니다
  - 그러자 곧 배가 목적지에 닿았습니다
  rationale: 본문은 설명을 덧붙이지 않고 즉시성을 강조하므로, 번역도 그 긴장과 놀라움을 해소하지 않도록 직설적으로 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
