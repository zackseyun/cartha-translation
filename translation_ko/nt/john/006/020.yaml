    issue: 직접화법의 높임말 등급 불일치
    rationale: 번역의 목표 문체가 현대 합쇼체인데 ‘나다’는 평서체입니다. ‘나입니다’는 즉각적인 자기식별의 뜻을 유지하면서 뒤의 ‘두려워하지 마십시오’와 문체를 일치시킵니다.
  - severity: medium
    issue: 대안 독법 각주의 직역 문구와 표지 위치
