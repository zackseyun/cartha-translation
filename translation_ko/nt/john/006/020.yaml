  source_fidelity: 본문의 의미와 담화 흐름은 대체로 충실합니다. 다만 Ἐγώ εἰμι에 해당하는 각주 표기는 한국어에서 지나치게 비문에 가깝고, 각주 표지가 해당 어구가 아니라 인용문 끝에 놓여 있어 대안 독법의 연결이 덜 분명합니다.
  naturalness: ‘그런데 예수님께서 그들에게 말씀하셨습니다’와 ‘두려워하지 마십시오’는 자연스러운 현대 표준어 합쇼체입니다. 그러나 동일한 직접화법 안에서 ‘나다’는 평서체이므로, 합쇼체 목표와 일관되게 ‘나입니다’로 하는 편이 더 적절합니다. 각주의 ‘더 넓은 신학적 주제를 메아리칠’도 ‘신학적 주제를 떠올리게 할’보다 덜 자연스럽습니다.
  terminology: 예수님, 두려워하다 등의 용어 선택에는 문제가 없습니다. ἐγώ εἰμι의 요한복음적 공명을 본문에 단정적으로 부과하지 않고 각주에서 가능성으로 남기는 방식도 적절합니다.
  issues:
