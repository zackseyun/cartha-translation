  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
  footnotes:
  - marker: a
    text: Or, more literally, 'I am.' In John, this expression can function as simple self-identification and may also echo broader theological themes.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 예수님께서 그들에게 말씀하셨습니다. “나입니다.”[a] “두려워하지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “나는 있다.” 요한복음에서 이 표현은 단순한 자기 식별로 쓰일 수도 있으며, 더 넓은 신학적 주제를 떠올리게 할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ λέγει
  english_pob_choice: But he said
  chosen_korean: 그런데 예수님께서 … 말씀하셨습니다
  alternatives_korean:
  - 그리고 예수님께서 … 말씀하셨습니다
  - 그러나 그분이 … 말씀하셨습니다
  lexicon: BDAG
  rationale: δέ의 흐름 전환을 '그런데'로 살리고, 역사적 현재 λέγει는 한국어 서술문에 맞게 과거형으로 자연스럽게 옮겼습니다. 주어는 문맥상 예수님이 분명하므로 이름을 밝혔습니다.
- source_word: Ἐγώ εἰμι
  english_pob_choice: It is I
  chosen_korean: 나다
  alternatives_korean:
  - 나입니다
  - 내가 그입니다
  - 나는 그다
  lexicon: BDAG
  rationale: 이 문맥에서는 제자들에게 자신을 알아보게 하는 즉각적 자기식별이므로, 한국어 관용에 맞는 짧은 선언형 '나다'를 택했습니다. 동시에 요한복음 특유의 더 직접적인 '나는 곧'류의 울림을 과도하게 덧씌우지 않도록 했습니다.
- source_word: μὴ φοβεῖσθε
  english_pob_choice: do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: BDAG
  rationale: μή + 현재 명령은 금지형으로, 현대 표준어에서 가장 자연스럽고 공손한 금지 표현인 '두려워하지 마십시오'로 옮겼습니다. 제자들을 안심시키는 장면의 정서도 잘 반영합니다.
theological_decisions:
- issue: Ἐγώ εἰμι의 직역 가능성과 요한복음 내 신학적 울림을 어떻게 처리할지
  chosen_reading: 본문에는 즉각적 자기소개로서 '나다'를 두고, 과도한 신학적 해석은 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 나는 곧이다
  - 나는 나다
  - 나는 그다
  rationale: 이 절의 직접 기능은 두려워하는 제자들에게 예수님이 자신임을 알아보게 하는 데 있습니다. 따라서 본문은 자연스러운 한국어 자기식별을 우선하되, ἐγώ εἰμι의 더 큰 요한적 공명을 필요 이상으로 평탄화하지 않도록 절제했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 3 (Preserve theological tension rather than resolve it)
