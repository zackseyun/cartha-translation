id: JHN.6.2
reference: John 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
  footnotes:
  - marker: a
    text: Or 'miracles' or 'miraculous signs'; John’s word 'signs' emphasizes what these works reveal about Jesus.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 무리가 그분을 따르고 있었는데, 이는 그분께서 병든 사람들에게 행하고 계시는 표적들[a]을 그들이 보고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘표적’은 요한복음의 σημεῖα를 반영합니다. 이는 단순한 ‘기적’보다 예수의 행위가 지닌 계시적 의미를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  english_pob_choice: was following
  chosen_korean: 따르고 있었는데
  alternatives_korean:
  - 따랐는데
  - 계속 따르고 있었는데
  lexicon: BDAG
  rationale: 미완료 시상의 진행성을 살려 과거에 지속되던 행동으로 옮겼습니다.
- source_word: ὄχλος πολύς
  english_pob_choice: a large crowd
  chosen_korean: 많은 무리
  alternatives_korean:
  - 큰 무리
  - 많은 군중
  lexicon: BDAG
  rationale: ὄχλος는 집합된 사람들을 가리키므로 ‘무리’가 자연스럽고, πολύς의 수적 강조를 ‘많은’으로 반영했습니다.
- source_word: σημεῖα
  english_pob_choice: signs
  chosen_korean: 표적들
  alternatives_korean:
  - 기적들
  - 표지들
  lexicon: BDAG
  rationale: 요한복음의 σημεῖα는 단순한 기적보다 예수가 누구인지 드러내는 의미가 있어, 전통적이면서도 의미를 보존하는 ‘표적’으로 옮겼습니다.
- source_word: ἐπὶ τῶν ἀσθενούντων
  english_pob_choice: on those who were sick
  chosen_korean: 병든 사람들에게
  alternatives_korean:
  - 병든 사람들 위에
  - 병든 사람들에 대하여
  lexicon: BDAG
  rationale: ἐπί+속격의 관계를 한국어로는 행위의 대상/관련 대상으로 자연스럽게 풀어 ‘-에게’로 옮겼습니다.
theological_decisions:
- issue: 요한복음의 σημεῖα 신학
  chosen_reading: ‘표적들’로 옮겨 행위 자체보다 그것이 드러내는 계시적 의미를 살렸습니다.
  alternative_readings:
  - 기적들
  - 놀라운 일들
  rationale: 요한은 예수의 행위를 단순한 초자연 현상이 아니라 계시적 표지로 제시하므로, 그 신학적 긴장을 유지하는 번역이 적합합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
