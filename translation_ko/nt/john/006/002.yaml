  source_fidelity: ‘그때’는 원문의 약한 연결사 δέ가 지닌 단순한 서술 연결보다 시간적 한정을 더합니다. 또한 각주는 σημεῖα에 관한 것이므로 해당 단어에 직접 붙이는 것이 적절합니다. 미완료 시제의 지속성(따르고 있었으며, 보고 있었고, 행하고 계심)과 병든 이들과 관련하여 표적을 행하셨다는 뜻은 유지할 수 있습니다.
  naturalness: ‘그리고’로 서술을 자연스럽게 이어 주고, 이유를 나타내는 ‘이는 … 때문입니다’ 구문을 유지했습니다. ‘그분’과 ‘행하고 계시는’은 현대 한국어의 정중한 성서 문체에 맞습니다.
  terminology: σημεῖα는 요한복음에서 일관되게 중요한 용어이므로 ‘표적들’을 유지합니다. ἐπὶ τῶν ἀσθενούντων은 한국어에서 자연스러운 관계 표현인 ‘병든 사람들에게’로 옮겼으며, 이를 단순한 장소 표현으로 한정하지 않았습니다.
  issues:
