  - severity: medium
    issue: 각주 표지가 ‘표적들’이 아니라 문장 끝에 놓여 있습니다.
    rationale: 각주의 내용이 σημεῖα/‘표적’의 번역 선택을 설명하므로, 독자가 참조 대상을 즉시 알 수 있도록 ‘표적들’ 뒤에 붙여야 합니다.
