  source_fidelity: 핵심 본문은 대체로 충실하게 옮겼고, 본문 비평상 대안 읽기와 속격의 폭도 각주로 적절히 보존했습니다. 다만 두 완료형 πεπιστεύκαμεν과 ἐγνώκαμεν은 현재까지 이어지는 확정된 믿음과 앎을 나타내므로, 단순 과거형만으로는 그 결과 상태가 다소 약화됩니다.
  naturalness: ‘하나님의 거룩하신 이’는 현대 표준어에서 명사구로 다소 부자연스럽습니다. 또한 예수께 대한 직접 호칭으로 ‘당신은’은 현대 한국어에서 어색하거나 무례하게 들릴 수 있습니다. 문맥상 존칭 호칭인 ‘주님’을 사용하고, 내용절을 구성하면 합쇼체에서 자연스럽습니다.
  terminology: ὁ ἅγιος τοῦ θεοῦ는 칭호로서 ‘하나님의 거룩한 분’이 자연스럽고 원문의 관계 속격도 유지합니다. 이는 ‘성자’처럼 의미를 신학적으로 특정하지 않으며, ‘하나님에게서 온’으로 근원 의미만을 한정하지도 않습니다.
