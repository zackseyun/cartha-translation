translation:
  language: ko
  text: 그리고 우리는 주님께서 하나님의 거룩한 분이심을 믿어 왔고 알게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘메시아, 살아 계신 하나님의 아들’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘하나님에게서 온 거룩한 분’으로 옮길 수 있습니다. 그리스어 속격은 관계나 근원을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἡμεῖς
  english_pob_choice: And we
  chosen_korean: 그리고 우리도
  alternatives_korean:
  - 우리도
  - 그리고 우리는
  lexicon: BDAG
  rationale: ἡμεῖς의 강조를 한국어에서는 주제 표지와 대조의 뉘앙스를 살린 ‘우리도’로 옮기고, 문두의 καὶ는 자연스러운 연결어 ‘그리고’로 처리했습니다.
- source_word: πεπιστεύκαμεν καὶ ἐγνώκαμεν
  english_pob_choice: have believed and have come to know
