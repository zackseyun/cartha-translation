id: JHN.6.69
reference: John 6:69
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
  footnotes:
  - marker: a
    text: Some manuscripts read, 'the Messiah, the Son of the living God.'
    reason: textual_variant
  - marker: b
    text: Or 'the Holy One from God.' The Greek genitive can express relation or source.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리도 믿었고 또 알게 되었습니다. 곧 당신은 하나님의 거룩하신 이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘메시아, 살아 계신 하나님의 아들’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘하나님에게서 온 거룩한 이’로 옮길 수 있습니다. 헬라어 속격은 관계나 근원을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἡμεῖς
  english_pob_choice: And we
  chosen_korean: 그리고 우리도
  alternatives_korean:
  - 우리도
  - 그리고 우리는
  lexicon: BDAG
  rationale: ἡμεῖς의 강조를 한국어에서는 주제 표지와 대조의 뉘앙스를 살린 ‘우리도’로 옮기고, 문두의 καὶ는 자연스러운 연결어 ‘그리고’로 처리했습니다.
- source_word: πεπιστεύκαμεν καὶ ἐγνώκαμεν
  english_pob_choice: have believed and have come to know
  chosen_korean: 믿었고 또 알게 되었습니다
  alternatives_korean:
  - 믿고 알게 되었습니다
  - 믿어 왔고 또 알게 되었습니다
  lexicon: BDAG
  rationale: 두 완료형의 결과 상태를 살리되, 한국어에서는 ‘믿었다’와 ‘알게 되었다’의 병렬로 현재까지의 확정된 상태를 자연스럽게 표현했습니다.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  english_pob_choice: the Holy One of God
  chosen_korean: 하나님의 거룩하신 이
  alternatives_korean:
  - 하나님의 거룩한 분
  - 하나님의 성자
  - 하나님께 속한 거룩한 분
  lexicon: BDAG
  rationale: ἅγιος를 단순 형용사보다 호칭적 명칭으로 읽어 ‘거룩하신 이’로 옮겨, 그리스도론적 칭호의 힘을 보존했습니다.
- source_word: τοῦ θεοῦ
  english_pob_choice: of God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님에게서 온
  - 하나님께 속한
  lexicon: BDAG
  rationale: γενitive의 관계성을 그대로 유지해 ‘~의’ 구조로 옮겼고, ‘from God’로 좁혀 소스를 특정하지 않았습니다.
theological_decisions:
- issue: 요한복음 6:69의 칭호 해석
  chosen_reading: 본문의 ὁ ἅγιος τοῦ θεοῦ를 “하나님의 거룩하신 이”로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 메시아, 살아 계신 하나님의 아들
  - 하나님에게서 온 거룩한 이
  rationale: 공인본문이 가진 칭호를 마태복음의 평행구나 후대 확장형과 조화시키지 않고, 요한 본문의 직접적인 표지를 보존하기 위함입니다.
  doctrine_reference: 본문 정합성; 번역 원리 §§1, 3, 5
