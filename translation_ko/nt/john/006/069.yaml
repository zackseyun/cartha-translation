  to: 그리고 우리는 주님께서 하나님의 거룩한 분이심을 믿어 왔고 알게 되었습니다.[a][b]
  rationale: 완료형의 지속적 결과를 ‘믿어 왔고 알게 되었습니다’로 반영했습니다. 현대 합쇼체에서 자연스럽고 공손한 문장을 위해 직접 대명사 대신 문맥상 적절한 존칭 호칭 ‘주님’을 사용했으며, 그리스도론적 칭호는 원문의 폭을 유지하는 ‘하나님의 거룩한 분’으로 다듬었습니다. 각주는 원문의 이문과 속격의 대안적 이해를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:08Z'
