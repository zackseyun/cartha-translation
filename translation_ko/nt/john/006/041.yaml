revisions:
- from: 그러므로 유대 사람들은 그분에 대해 수군거리며, 그분이 말씀하시기를 「나는 하늘에서 내려온 빵이다」라고 하셨기 때문입니다.[a]
  to: 그러므로 유대인들은[a] 그분이 “나는 하늘에서 내려온 빵이다”라고 말씀하셨기 때문에 그분에 대하여 계속 불평하였습니다.
  rationale: 원문의 인과관계와 미완료 과거의 지속성을 보존하면서, 기존 한국어 문장의 문법적 결함을 바로잡았습니다. οἱ Ἰουδαῖοι를 본문에서 임의로 ‘지도자들’로 좁히지 않고 표준적으로 ‘유대인들’로 옮겼으며, 논쟁적인 지시 범위는 각주에서만 설명했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:07Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 οὖν은 ‘그러므로’로, Ἐγόγγυζον의 미완료 과거는 ‘계속 불평하였습니다’로 옮겨 논리적 연결과 지속적인 불평의 뉘앙스를 반영했습니다. ὅτι는 불평의 이유를 나타내므로 ‘~하셨기 때문에’로 처리했습니다. οἱ Ἰουδαῖοι는 본문에서 ‘유대인들’로 직역하되, 그 지시 대상의 문맥적 폭은 각주에서 밝혔습니다.
  naturalness: 기존 문장은 ‘수군거리며’와 ‘~때문입니다’의 연결이 문법적으로 부자연스럽고, 종결도 서술 문맥에 맞지 않았습니다. 인과관계를 명확히 하고 현대 한국어 합쇼체 서술문으로 다듬었습니다.
  terminology: ‘빵’은 현대 한국어에서 자연스럽고 본문의 비유를 잘 전달합니다. 예수에 대한 존칭은 ‘그분’, ‘말씀하셨다’를 사용하여 일관되게 유지했습니다. ‘유대인들’은 원문의 표준적 대응어이며, 각주가 이를 전체 유대 민족에 관한 일반화로 오해하지 않도록 합니다.
  issues:
  - severity: medium
    issue: 본문의 문장 연결과 종결이 부자연스럽습니다.
    rationale: ‘수군거리며, ... 하셨기 때문입니다’는 원인의 종속절과 주절이 온전히 연결되지 않으며, 서술 종결도 앞선 행동과 문법적으로 맞지 않습니다.
  - severity: low
    issue: ‘수군거리며’는 γογγύζω의 불평 의미보다 잡담·속삭임의 의미로 읽힐 수 있습니다.
    rationale: 이 동사는 여기서 불만을 품고 계속 투덜대는 행위를 가리키므로 ‘계속 불평하였습니다’가 더 직접적입니다.
  - severity: low
    issue: 각주의 대안 표현이 본문의 ‘유대 사람들’과 중복되고 원문의 지리적 가능성을 충분히 드러내지 못합니다.
    rationale: 영어 감사 기록과 원문의 의미 범위에 맞추어 ‘유대 지역 사람들’ 및 문맥상 ‘유대 지도자들’ 가능성을 제시하는 편이 명료합니다.
  revised_text: 그러므로 유대인들은[a] 그분이 “나는 하늘에서 내려온 빵이다”라고 말씀하셨기 때문에 그분에 대하여 계속 불평하였습니다.
  revised_footnotes:
