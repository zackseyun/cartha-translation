id: JHN.6.41
reference: John 6:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
  footnotes:
  - marker: a
    text: Or “the Judeans” or, in some contexts, “the Jewish leaders.” John’s phrase “the Jews” can refer to a particular group opposing Jesus rather than to the Jewish people as a whole.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 유대 사람들은 그분에 대해 수군거리며, 그분이 말씀하시기를 「나는 하늘에서 내려온 빵이다」라고 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥에 따라 ‘유대 사람들’ 또는 ‘유대 지도자들’로도 이해할 수 있습니다. 요한복음의 ‘유대인들’ 표현은 예수와 대립하는 특정 집단을 가리키는 경우가 많습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  english_pob_choice: were grumbling
  chosen_korean: 수군거리며
  alternatives_korean:
  - 투덜거리며
  - 불평하며
  lexicon: BDAG
  rationale: imperfect의 계속된 불만 표지를 자연스럽게 살리되, 한국어에서 과도하게 구어적이거나 반복적 뉘앙스를 피하기 위해 ‘수군거리며’를 택했습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대 사람들은
  alternatives_korean:
  - 유대인들은
  - 유대 지도자들은
  lexicon: BDAG
  rationale: 요한복음의 관용적 표현을 직역하되, 한국어에서 곧바로 민족 일반화로 들릴 수 있는 ‘유대인들’보다 문맥상 대립 집단을 완곡하게 드러내는 ‘유대 사람들’을 사용했습니다.
- source_word: ὁ ἄρτος
  english_pob_choice: the bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 빵 한 덩이
  lexicon: BDAG
  rationale: 이 단락의 생계적·상징적 식물 비유를 현대 한국어로 가장 자연스럽게 전달하는 기본어는 ‘빵’입니다. 관사로 특정된 예수의 자기지시를 문장 전체에서 분명히 하기 위해 ‘그 빵’이 아닌 서술 구조를 유지했습니다.
- source_word: ὁ καταβὰς ἐκ τοῦ οὐρανοῦ
  english_pob_choice: that came down from heaven
  chosen_korean: 하늘에서 내려온
  alternatives_korean:
  - 하늘로부터 내려온
  - 하늘에서 내려오신
  lexicon: BDAG
  rationale: 분사구의 완료된 하강 동작을 한국어 관형절로 옮겼습니다. 예수께 대한 직접 경칭을 지나치게 주입하지 않고 원문의 자기선언 구조를 살렸습니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 한국어 처리와 반유대적 오해 방지
  chosen_reading: ‘유대 사람들’로 옮겨, 본문이 특정 반대 집단을 가리키는 맥락은 살리되 전체 유대 민족에 대한 일반화로 읽히지 않게 했습니다.
  alternative_readings:
  - 유대인들
  - 유대 지도자들
  rationale: 요한복음의 해당 표현은 문맥에 따라 폭이 달라질 수 있으므로, 원문의 집단적 지시를 유지하면서도 현대 한국어 독자에게 불필요한 민족 일반화를 최소화했습니다.
  doctrine_reference: Translation philosophy §1 (원문 우선) and §6 (가독성)
