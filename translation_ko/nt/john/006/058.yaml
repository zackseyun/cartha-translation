id: JHN.6.58
reference: John 6:58
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
  footnotes:
  - marker: a
    text: Or 'the ancestors.' Greek 'the fathers' likely refers to Israel's forefathers who ate the manna.
    reason: lexical_alternative
  - marker: b
    text: Literally 'will live into the age,' an idiom meaning enduring life forever.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 하늘에서 내려온 빵입니다[a]. 이 빵은 조상들이 먹고도 죽었던 빵과는 다릅니다[b]. 이 빵을 먹는 사람은 영원히 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘로부터 내려온’.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘조상들’은 광야에서 만나를 먹었던 이스라엘의 선조들을 가리키는 것으로 보입니다.
    reason: historical_context
lexical_decisions:
- source_word: οὗτός ἐστιν
  english_pob_choice: This is
  chosen_korean: 이것이 …입니다
  alternatives_korean:
  - 이것은 …입니다
  - 이분은 …입니다
  lexicon: BDAG
  rationale: 지시어+계사 구조를 자연스러운 현대 한국어로 옮기되, 앞서 전개된 ‘빵’을 가리키는 지시성을 살리기 위해 ‘이것이’로 시작했습니다.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  english_pob_choice: that came down from heaven
  chosen_korean: 하늘에서 내려온
  alternatives_korean:
  - 하늘로부터 내려온
  - 하늘에서 내려온
  lexicon: BDAG
  rationale: aorist 분사를 관계절처럼 풀어 ‘내려온’으로 옮겼고, ἐξ οὐρανοῦ의 출처를 직역에 가깝게 ‘하늘에서’로 보존했습니다.
- source_word: οἱ πατέρες
  english_pob_choice: the fathers
  chosen_korean: 조상들
  alternatives_korean:
  - 아버지들
  - 선조들
  lexicon: BDAG
  rationale: 한국어에서는 ‘the fathers’의 혈통적·역사적 지시를 ‘조상들’이 가장 자연스럽게 전달합니다. 남성 복수의 표지와 이스라엘 광야 세대에 대한 암시도 유지됩니다.
- source_word: ὁ τρώγων
  english_pob_choice: the one who eats
  chosen_korean: 먹는 사람
  alternatives_korean:
  - 먹는 자
  - 먹는 이는
  lexicon: BDAG
  rationale: 현재분사의 일반적·반복적 의미를 한국어 관형절보다 자연스러운 명사구로 풀었습니다. 동사의 구체적 감각을 과도하게 살리기보다 POB의 중립적 ‘eats’를 반영했습니다.
- source_word: ζήσει εἰς τὸν αἰῶνα
  english_pob_choice: will live forever
  chosen_korean: 영원히 살 것입니다
  alternatives_korean:
  - 영원히 생명을 누릴 것입니다
  - 세세토록 살 것입니다
  lexicon: BDAG
  rationale: 직역하면 ‘그 시대까지’의 관용이지만, 한국어에서는 결과 의미를 분명히 하는 ‘영원히’가 가장 자연스럽고 요한복음의 종말론적 지속 생명을 잘 전달합니다.
theological_decisions:
- issue: ‘먹다’의 의미와 성찬적 해석의 범위
  chosen_reading: 중립적으로 ‘먹는 사람’이라고 옮겨, 이 구절만으로 성찬적 해석을 확정하지 않았습니다.
  alternative_readings:
  - ‘받아먹는 사람’
  - ‘참여하는 사람’
  rationale: 본문의 문법적 의미는 ‘먹는’이며, 문맥상 논쟁적인 성찬/비성찬 해석을 번역이 미리 결정하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 3
- issue: ‘하늘’ 출처 표현의 신학적 직접성
  chosen_reading: ‘하늘에서 내려온’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘하늘로부터 온’
  - ‘하늘에서부터 내려온’
  rationale: 출처를 흐리지 않고 예수의 기원에 대한 요한복음의 직접적 진술을 살리기 위해, 원문의 방향성을 그대로 드러냈습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 1
