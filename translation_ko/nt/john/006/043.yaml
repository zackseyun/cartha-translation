lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  english_pob_choice: Jesus answered and said to them
  chosen_korean: 예수께서 대답하여 그들에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 대답하여 말씀하셨습니다
  - 예수께서 그들에게 말씀하시며 대답하셨습니다
  lexicon: BDAG
  rationale: ἀπεκρίθη + εἶπεν의 관용적 이중 표현을 한국어로 자연스럽게 살리되, 서술 연결을 매끄럽게 하기 위해 ‘대답하여 … 말씀하셨습니다’로 옮겼습니다.
- source_word: Μὴ γογγύζετε
  english_pob_choice: Do not grumble
  chosen_korean: 투덜대지 마십시오
  alternatives_korean:
  - 원망하지 마십시오
  - 불평하지 마십시오
  - 투덜거리지 마십시오
  lexicon: BDAG
  rationale: γογγύζω의 핵심은 불평 섞인 불만 표출이므로, 한국어에서 구어적이면서도 의미를 유지하는 ‘투덜대다’를 택했습니다. ‘원망하다’는 대상이 신을 향할 때 더 강하게 기울 수 있어 여기서는 다소 좁습니다.
- source_word: μετ’ ἀλλήλων
  english_pob_choice: among yourselves / with one another
  chosen_korean: 서로에게서
  alternatives_korean:
  - 서로
  - 서로 간에
  - 너희끼리
  lexicon: BDAG
  rationale: 이 구절은 무리 안에서의 상호적 불평을 가리키므로, 관계성을 드러내는 표현으로 처리했습니다. 다만 한국어로는 ‘서로’만으로도 뜻이 충분해 자연성을 위해 ‘서로에게서’로 다듬었습니다.
theological_decisions:
- issue: 예수의 직접 명령을 한국어 공손 체계로 어떻게 옮길지
  chosen_reading: 직접 화법 안에서도 예수의 권면은 존대 명령형 ‘-십시오’로 옮겼습니다.
  alternative_readings:
  - 반말형 ‘투덜대지 마라’
  - 평서형 ‘투덜대지 말라’
  rationale: 본문은 제자/무리에게 주시는 권면이므로 현대 표준어 합쇼체를 유지하되, 직접 명령의 힘을 보존했습니다.
  doctrine_reference: 공손체/직접화법 register
- issue: ‘grumble’의 정서적 강도 선택
  chosen_reading: ‘투덜대다’로 옮겨 불평의 뉘앙스와 구약 광야 전승의 울림을 함께 살렸습니다.
  alternative_readings:
  - 불평하다
  - 원망하다
  - 불만을 품다
  rationale: 영어 POB가 ‘grumble’을 택해 성경적 공명을 살린 것처럼, 한국어에서도 지나치게 완화되지 않는 일상어를 사용했습니다.
  doctrine_reference: 출애굽기/민수기의 불평 전통
