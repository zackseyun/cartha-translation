  source_fidelity: 원문의 ἀπεκρίθη … καὶ εἶπεν은 ‘대답하여 말씀하셨습니다’로 충실히 반영할 수 있습니다. μὴ γογγύζετε는 진행 중인 행위를 중지하라는 뜻으로 한정하지 않고 ‘불평하지 마십시오’로 옮기는 것이 안전합니다. μετ’ ἀλλήλων은 상호·집단 내부의 행위를 뜻하므로 ‘서로 간에’가 적절합니다.
  naturalness: 초안의 ‘서로에게서 투덜대지 마십시오’에서 ‘서로에게서’는 한국어상 ‘서로로부터’라는 출처 의미로 읽혀 부자연스럽고 원문의 관계 의미를 전달하지 못합니다. ‘투덜대다’도 현대 구어성이 강해 공적 성경 문체에는 ‘불평하다’가 더 자연스럽습니다.
  terminology: ‘예수께서’, ‘말씀하셨습니다’, ‘-십시오’는 표준어 현대 합쇼체에 적합합니다. γογγύζω에는 ‘불평하다’를 사용하되, 각주에서 ‘투덜거리다’와 ‘수군거리다’라는 가능한 어휘적 뉘앙스를 밝혀 둘 수 있습니다.
