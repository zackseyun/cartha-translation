id: JHN.6.14
reference: John 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
  footnotes:
  - marker: a
    text: Or 'the miracle that he had done'; John regularly uses 'sign' (σημεῖον) to emphasize the revelatory meaning of Jesus's works, not only their miraculous character.
    reason: lexical_alternative
  - marker: b
    text: '''The Prophet'' likely refers to the expected prophet like Moses (Deut 18:15–18).'
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 사람들이 그가 행하신 표적을 보고, 「이분이야말로 참으로 세상에 오시는 그 예언자이십니다」라고 말하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘표적’은 요한복음의 σημεῖον을 따른 번역으로, 단순한 ‘기적’보다 예수님의 행위가 지닌 계시적 의미를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 예언자’는 신명기 18:15–18의 ‘모세와 같은 예언자’를 가리키는 것으로 이해될 가능성이 큽니다.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  english_pob_choice: So when the people
  chosen_korean: 그러므로 사람들이
  alternatives_korean:
  - 그러자 사람들이
  - 그래서 사람들이
  lexicon: BDAG
  rationale: οὖν의 논리적 전개를 ‘그러므로’로 살리고, ἄνθρωποι는 성별을 특정하지 않는 집단 지시이므로 자연스러운 ‘사람들’로 옮겼습니다.
- source_word: ἰδόντες
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았고
  - 본 뒤
  lexicon: BDAG
  rationale: 부사절적 분사로서 장면의 선행 동작을 간결하게 나타내는 ‘보고’가 서술 흐름에 가장 자연스럽습니다.
- source_word: ὃ ἐποίησεν σημεῖον
  english_pob_choice: the sign that he had done
  chosen_korean: 그가 행하신 표적을
  alternatives_korean:
  - 그가 행하신 기적을
  - 그가 하신 표징을
  lexicon: BDAG
  rationale: 요한복음의 σημεῖον은 단순한 기적보다 계시적 의미를 띠므로 ‘표적’을 유지했습니다. 문맥상 목적격 관계를 자연스럽게 풀어 옮겼습니다.
- source_word: ὁ προφήτης
  english_pob_choice: the Prophet
  chosen_korean: 그 예언자
  alternatives_korean:
  - 그 선지자
  - 예언자
  lexicon: BDAG
  rationale: 헬라어의 정관사 있는 τίτλος적 용례를 살려 ‘그 예언자’로 옮겼고, 한국어에서 문맥상 제목처럼 들리도록 했습니다.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  english_pob_choice: who is coming into the world
  chosen_korean: 세상에 오시는
  alternatives_korean:
  - 세상에 오고 계시는
  - 세상에 들어오시는
  lexicon: BDAG
  rationale: 현재분사 구조를 ‘오시는’으로 살려 지속적·서술적 뉘앙스를 반영했고, 요한복음의 관용적 표현을 자연스럽게 유지했습니다.
theological_decisions:
- issue: ‘그 예언자’의 정체를 본문 안에서 어디까지 드러낼지
  chosen_reading: 본문에는 식별어를 덧붙이지 않고 ‘그 예언자’로 유지했습니다.
  alternative_readings:
  - 모세와 같은 예언자
  - 선지자
  rationale: 그리스어 본문은 단지 ‘그 예언자’라고 말하므로, 신명기 18장의 연관 가능성은 주석 영역에 남기고 본문에서는 해석을 과잉 주입하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 직접화법의 존칭 처리
  chosen_reading: 대상 인물이 ‘주님’으로 고백되는 맥락은 아니지만, 문맥상 경칭을 살려 ‘이분이야말로 … 이십니다’로 옮겼습니다.
  alternative_readings:
  - 이분이야말로 … 입니다
  - 이분이야말로 … 이십니다
  rationale: 군중의 인식이 높아지는 장면을 한국어에서 자연스럽게 드러내기 위해 서술문 내부의 높임을 사용했습니다.
  doctrine_reference: Korean honorific style in direct and reported speech
