id: JHN.6.29
reference: John 6:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
  footnotes:
  - marker: a
    text: Or “the work God requires” or “the work God does.” The Greek phrase “the work of God” can be understood in more than one way, and the wording here preserves that ambiguity.
    reason: alternative_reading
  - marker: b
    text: Or “trust in the one whom he has sent.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 그들에게 말씀하셨습니다. 「이것이 하나님의 일입니다 — 곧 그가 보내신 이 안에 믿는 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님이 요구하시는 일” 혹은 “하나님이 하시는 일.” ‘하나님의 일’이라는 헬라어 구는 여러 방식으로 이해될 수 있으므로, 본문은 그 중의성을 보존합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “그가 보내신 이를 신뢰하는 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 ... 말씀하셨습니다
  alternatives_korean:
  - 대답하여 ... 이르셨습니다
  - 대답하여 ... 말씀하셨습니다
  lexicon: SBLGNT
  rationale: 헬라어의 두 동사 구조를 한국어에서 자연스럽게 살리기 위해 ‘대답하여 ... 말씀하셨습니다’로 옮겼습니다. 요한복음 서술체의 대화 응답으로도 무리 없습니다.
- source_word: τὸ ἔργον τοῦ θεοῦ
  english_pob_choice: the work of God
  chosen_korean: 하나님의 일
  alternatives_korean:
  - 하나님께서 하셔야 하는 일
  - 하나님이 하시는 일
  lexicon: BDAG
  rationale: ‘τοῦ θεοῦ’의 소유·주격적 중의성을 그대로 살리기 위해 ‘하나님의 일’로 옮겼습니다. 문맥상 요구되는 일로도, 하나님께 속한 일로도 읽힐 수 있는 긴장을 보존합니다.
- source_word: πιστεύητε εἰς
  english_pob_choice: you believe in
  chosen_korean: 믿는 것입니다
  alternatives_korean:
  - 믿고 있는 것입니다
  - 믿으라는 것입니다
  lexicon: BDAG
  rationale: 한국어에서는 ‘믿다’가 앞의 ‘안에’를 자연스럽게 받기 어렵기 때문에, ‘~안에 믿다’보다 ‘믿는 것입니다’로 매끈하게 정리하되, 믿음의 대상을 뒤에서 분명히 밝혔습니다.
- source_word: εἰς ὃν ἀπέστειλεν ἐκεῖνος
  english_pob_choice: in the one whom he has sent
  chosen_korean: 그가 보내신 이 안에
  alternatives_korean:
  - 그가 보내신 분을
  - 그가 보내신 이를
  lexicon: BDAG
  rationale: εἰς + 인칭대상은 요한복음에서 ‘~안에 믿다’의 방향성을 가지므로, 한국어에서는 전치사적 이미지를 살려 ‘안에’로 처리했습니다. ‘그가’는 앞선 하나님을 가리키는 것으로 유지했습니다.
theological_decisions:
- issue: ‘하나님의 일’의 중의성
  chosen_reading: 본문은 ‘하나님의 일’로 유지해, 하나님이 요구하시는 일과 하나님께 속한 일 사이의 긴장을 풀지 않았습니다.
  alternative_readings:
  - 하나님이 요구하시는 일
  - 하나님이 하시는 일
  rationale: 영어 POB가 보존한 중의성을 한국어에서도 유지하는 편이 문맥과 신학적 긴장에 더 충실합니다. 이 절은 행위 목록이 아니라 예수에 대한 믿음을 중심에 둡니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 해소하지 말고 보존할 것'
