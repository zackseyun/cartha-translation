id: JHN.6.66
reference: John 6:66
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
  footnotes:
  - marker: a
    text: Or 'Because of this, many of his disciples went away'; the Greek opening can be taken causally, though in context 'From that time' better reflects the turning-point sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그때부터 그의 제자들 가운데 많은 사람이 뒤로 돌아가 더 이상 그와 함께 다니지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그때부터’는 Ἐκ τούτου의 시간적 뉘앙스를 따른 번역입니다. 문맥상 원인적 의미인 ‘이로 말미암아/이 때문에’도 가능하지만, 여기서는 전환점의 의미가 더 강합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  english_pob_choice: From this time
  chosen_korean: 그때부터
  alternatives_korean:
  - 이로부터
  - 이 일로부터
  - 그 뒤로
  lexicon: BDAG
  rationale: 문맥상 원인보다 전환점의 시점을 가리키므로, 자연스러운 현대 한국어로 ‘그때부터’라고 옮겨 시간적 전환을 살렸습니다.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  english_pob_choice: went back
  chosen_korean: 뒤로 돌아가
  alternatives_korean:
  - 물러가
  - 되돌아가
  - 돌아가
  lexicon: BDAG
  rationale: 단순한 ‘떠남’이 아니라 뒤로 물러나며 이전 방향을 버리는 느낌이 있어, ‘뒤로 돌아가’로 동작과 방향을 함께 드러냈습니다.
- source_word: οὐκέτι μετ’ αὐτοῦ περιεπάτουν
  english_pob_choice: no longer walked with him
  chosen_korean: 더 이상 그와 함께 다니지 않았습니다
  alternatives_korean:
  - 더 이상 그와 함께 걷지 않았습니다
  - 더 이상 그를 따르지 않았습니다
  lexicon: BDAG
  rationale: περιπατέω의 직유를 살리되 한국어에서 ‘함께 다니다’가 지속적 동행을 가장 자연스럽게 표현하므로, ‘걷다’보다 관계적 의미를 더 분명히 전달했습니다.
- source_word: τῶν μαθητῶν αὐτοῦ
  english_pob_choice: of his disciples
  chosen_korean: 그의 제자들 가운데
  alternatives_korean:
  - 그의 제자들 중에서
  - 그의 제자들 가운데서
  lexicon: BDAG
  rationale: ἐκ의 부분격을 한국어의 ‘~가운데’로 옮겨, 제자 전체가 아니라 그 집단 안의 일부가 떠났다는 점을 분명히 했습니다.
theological_decisions:
- issue: μαθηταί를 ‘제자’로 유지할지, ‘추종자/따르던 이들’로 완화할지
  chosen_reading: 제자
  alternative_readings:
  - 추종자
  - 따르던 이들
  rationale: 본문은 예수의 제자들 가운데 많은 사람이 떠났다고만 말하며, 더 좁은 열두 제자와의 대비를 번역에 미리 주입하지 않습니다. 따라서 범주를 그대로 유지하는 ‘제자’가 본문의 긴장을 보존합니다.
  doctrine_reference: 본문의 범주를 보존하고 신학적 결론을 번역에 선반영하지 않음
