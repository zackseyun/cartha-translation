  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
  footnotes:
  - marker: a
    text: Or, 'that which comes down from heaven and gives life to the world.' The Greek wording can be taken more impersonally, but the masculine participles favor a personal referent.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 하나님의 떡은 하늘에서 내려와 세상에 생명을 주는 이입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘에서 내려와 세상에 생명을 주는 것.’ 그리스어 표현은 더 비인칭적으로도 읽을 수 있으나, 남성형 분사들은 인격적 대상을 더 강하게 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  english_pob_choice: bread
  chosen_korean: 떡
  alternatives_korean:
  - 빵
  - 빵조각
  - 식물
  lexicon: BDAG
  rationale: 요한복음의 상징적 담화에서 ἄρτος는 단순한 ‘음식’보다 구체적인 빵/떡의 이미지를 유지하는 것이 중요하여, 한국어에서는 자연스럽고 성경적 울림이 있는 ‘떡’을 택했습니다.
- source_word: τοῦ θεοῦ
  english_pob_choice: of God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님께 속한
  - 하나님에게서 온
  - 하나님이 주시는
  lexicon: BDAG
  rationale: 원문의 소유격/출처 뉘앙스를 모두 열어 두기 위해, 직접적으로는 ‘하나님의’로 옮겨 원문 형식을 보존했습니다.
- source_word: ὁ καταβαίνων
  english_pob_choice: the one who comes down
  chosen_korean: 내려와
  alternatives_korean:
  - 내려오는 이
  - 내려오는 것
  - 내려오시는 분
  lexicon: BDAG
  rationale: 그리스어 남성 단수 분사 형태가 인격적 대상을 가리키므로, 비인칭화하지 않고 문맥상 예수를 가리키는 인격적 표현을 살려 ‘내려와’로 연결했습니다.
- source_word: τῷ κόσμῳ
  english_pob_choice: to the world
  chosen_korean: 세상에
  alternatives_korean:
  - 세상에게
  - 인류에게
  - 온 세상에
  lexicon: BDAG
  rationale: κόσμος의 요한복음적 용법을 따라 ‘세상’을 유지했고, 여기에 생명을 ‘주는’ 방향을 가장 자연스럽게 나타내는 여격 표현으로 ‘세상에’를 선택했습니다.
theological_decisions:
- issue: 마지막 분사의 인격적 대상 여부
  chosen_reading: ‘내려와 세상에 생명을 주는 이’로 번역해, 빵 자체가 아니라 인격적 존재를 가리키는 흐름을 살렸습니다.
  alternative_readings:
  - ‘하늘에서 내려와 세상에 생명을 주는 것’
  rationale: 원문은 남성 단수 분사(ὁ καταβαίνων, διδοὺς)를 사용하므로, 단순한 사물 지시로 완화하지 않고 예수 자신을 예시하는 인격적 의미를 보존하는 것이 문법과 문맥에 더 충실합니다.
  doctrine_reference: Johannine grammar and context
- issue: κόσμος의 범위
  chosen_reading: ‘세상’으로 그대로 두어, 생명을 주는 범위의 넓이를 좁히지 않았습니다.
  alternative_readings:
  - 인류
  - 모든 사람
  rationale: 본문은 생명을 주는 대상의 광범위를 진술할 뿐, 구원 적용의 범위를 해설하지 않으므로 요한복음의 표준 용어인 ‘세상’을 유지하는 것이 가장 안전합니다.
  doctrine_reference: 'Translation philosophy #3'
