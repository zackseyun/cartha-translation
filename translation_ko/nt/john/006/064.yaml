source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
  footnotes:
  - marker: a
    text: Or, more literally, 'who would hand him over.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who the ones not believing were'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 여러분 가운데에는 믿지 않는 이들이 있습니다. 예수께서는 처음부터 믿지 않는 이들이 누구인지[b], 또 자기를 넘겨줄 사람이 누구인지[a] 아셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기를 배반할 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘누가 믿지 않는 사람들인지를’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞절과의 대비를 자연스럽게 살리면서도 문어체 합쇼체에 어울리는 역접 연결로 옮겼습니다.
- source_word: ἐξ ὑμῶν τινες
  english_pob_choice: some among you
  chosen_korean: 여러분 가운데는 믿지 않는 이들이 있습니다
  alternatives_korean:
  - 여러분 중 일부는 있습니다
  - 여러분 가운데 몇 사람은 있습니다
  lexicon: BDAG
  rationale: ἐξ ὑμῶν의 집합 내부성을 살려 ‘가운데’를 사용했고, τινες의 불특정 일부를 한국어 자연문으로 풀었습니다.
- source_word: οἳ οὐ πιστεύουσιν
  english_pob_choice: who do not believe
  chosen_korean: 믿지 않는 이들이
  alternatives_korean:
  - 믿지 않습니다
  - 믿지 않는 자들이
  lexicon: BDAG
  rationale: 현재형 πιστεύουσιν의 지속적 불신을 ‘믿지 않는’으로 살리고, 인칭 관계절을 명사구로 자연화했습니다.
- source_word: ὁ παραδώσων αὐτόν
  english_pob_choice: who would betray him
  chosen_korean: 자기를 넘겨줄 사람
  alternatives_korean:
  - 자기를 배반할 사람
  - 자기를 넘겨줄 이
  lexicon: BDAG
  rationale: παραδίδωμι의 배신적 뉘앙스를 살리되, 본문 주석 전통의 ‘넘겨주다/넘겨주다’ 계열을 유지했습니다.
theological_decisions:
- issue: παραδίδωμι의 유다 관련 번역
  chosen_reading: ‘넘겨줄 사람’으로 번역해 행위의 배신성과 법정·서사적 인도를 함께 드러냄
  alternative_readings:
  - 배반할 사람
  - 넘겨줄 사람
  rationale: 요한복음 문맥에서 단순한 전달이 아니라 예수를 적대 세력에 넘기는 배신 행위이므로, 과도하게 도덕화된 단일어보다 문맥적 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: πιστεύω의 렌더링
  chosen_reading: ‘믿지 않는’
  alternative_readings:
  - 신뢰하지 않는
  - 믿지 아니하는
  rationale: 요한문헌에서 πιστεύω는 지적 동의와 관계적 신뢰를 함께 포괄하므로, 한국어에서는 관용적이면서도 의미를 넓게 담는 ‘믿다’ 계열을 유지했습니다.
  doctrine_reference: Translation philosophy §3
