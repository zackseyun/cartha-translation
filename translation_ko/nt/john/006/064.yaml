  to: 그러나 여러분 가운데에는 믿지 않는 이들이 있습니다. 예수께서는 처음부터 믿지 않는 이들이 누구인지[b], 또 자기를 넘겨줄 사람이 누구인지[a] 아셨기 때문입니다.
  rationale: 본문의 의미는 유지하고, 각주 a를 παραδώσων αὐτόν에 해당하는 ‘자기를 넘겨줄 사람’ 뒤로 옮겼습니다. 각주 b는 본문을 단순 반복하지 않도록, οἱ μὴ πιστεύοντες의 신원 확인을 다른 한국어 어순으로 제시했습니다. 또한 ‘가운데에는’은 ἐξ ὑμῶν의 집단 내부 의미를 더 매끄럽게 드러냅니다.
