id: JHN.6.7
reference: John 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: ko
  text: 빌립이 그에게 대답했습니다. “이백 데나리온어치의 빵도 각 사람이 조금씩 받기에는 그들에게 충분하지 않습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ... Φίλιππος
  english_pob_choice: Philip answered him
  chosen_korean: 빌립이 그에게 대답했습니다
  alternatives_korean:
  - 빌립이 그에게 대답했습니다
  - 빌립이 응답했습니다
  lexicon: ἀποκρίνομαι
  rationale: 서술의 자연스러운 대답 표현으로 옮기되, 원문의 문장 구조와 직접응답을 살려 ‘그에게’로 대상도 분명히 했습니다.
- source_word: Διακοσίων δηναρίων
  english_pob_choice: Two hundred denarii
  chosen_korean: 이백 데나리온어치
  alternatives_korean:
  - 이백 데나리온어치
  - 이백 데나리온
  lexicon: δηνάριον
  rationale: 화폐 단위 자체보다 ‘어치’가 값어치/가격의 의미를 분명히 드러내므로, 문맥상 ‘~어치’로 자연스럽게 옮겼습니다.
- source_word: ἄρτοι
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 빵
  - 떡
  lexicon: ἄρτος
  rationale: 복수형이지만 한국어에서는 문맥상 셀 수 없는 음식명으로 자연스럽게 처리했습니다. 현대 한국어 독자에게는 ‘빵’이 직관적입니다.
- source_word: οὐκ ἀρκοῦσιν αὐτοῖς
  english_pob_choice: is not enough for them
  chosen_korean: 그들에게 충분하지 않아서
  alternatives_korean:
  - 그들에게 충분하지 않아서
  - 그들에게 모자라서
  lexicon: ἀρκέω
  rationale: ‘충분하다/모자라다’ 중에서 원문의 부족을 분명히 하면서도 자연스러운 현대 문장을 위해 ‘충분하지 않다’로 잡았습니다.
- source_word: ἵνα ... ἕκαστος βραχύ τι λάβῃ
  english_pob_choice: so that each one may receive a little
  chosen_korean: 각 사람이 조금이라도 받게 하기는 어렵습니다
  alternatives_korean:
  - 각 사람이 조금이라도 받게 하기는 어렵습니다
  - 각 사람이 조금씩 받게 하기에는 부족합니다
  lexicon: ἵνα + λάβῃ
  rationale: ἵνα 절의 결과/목적 뉘앙스를 살리되, 한국어에서는 ‘~하기는 어렵습니다’로 연결해야 전체 의미가 매끄럽고 명확합니다.
theological_decisions:
- issue: 결과절 ἵνα의 기능
  chosen_reading: ‘각 사람이 조금이라도 받게 하기는 어렵습니다’로 목적/결과를 함께 담아 표현했습니다.
  alternative_readings:
  - ‘각 사람이 조금이라도 받게 하기 위해서는’
  - ‘그래서 각 사람이 조금이라도 받을 수 있게’
  rationale: 본문은 빵의 양이 부족하다는 진술과 그 결과를 이어 주므로, 한국어에서는 단순한 목적문보다 자연스러운 결과·한계 진술이 더 정확합니다.
  doctrine_reference: 문법적·담화적 연결(헬라어 ἵνα 절)
