  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
  footnotes:
  - marker: a
    text: Or "real food" and "real drink."
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 살이 참된 음식이며 내 피가 참된 마실 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “진짜 음식이며 진짜 마실 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  english_pob_choice: flesh
  chosen_korean: 살
  alternatives_korean:
  - 육체
  - 몸
  lexicon: BDAG
  rationale: 문맥에서 예수님의 살과 피가 병렬로 제시되므로, 해석을 덧붙인 ‘몸’보다 원문의 직설성을 살리는 ‘살’이 가장 가깝습니다.
- source_word: ἀληθής
  english_pob_choice: 'true'
  chosen_korean: 참된
  alternatives_korean:
  - 진짜의
  - 실제의
  lexicon: BDAG
  rationale: ἐστι와 결합한 서술적 형용사를 한국어에서는 ‘참된’으로 옮겨, POB의 ‘true’를 유지하면서도 자연스러운 품위를 확보했습니다.
- source_word: βρῶσις
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 먹을 것
  - 양식
  lexicon: BDAG
  rationale: ‘먹는 행위’보다 ‘먹는 것’의 의미가 문맥상 적절하므로 ‘음식’으로 옮겼습니다. ‘양식’은 한국어 교회어법의 뉘앙스가 강해 덜 직접적입니다.
- source_word: πόσις
  english_pob_choice: drink
  chosen_korean: 마실 것
  alternatives_korean:
  - 음료
  - 마시는 것
  lexicon: BDAG
  rationale: βρῶσις와 대구를 이루는 명사이므로 ‘마실 것’으로 대응시켜, 행위가 아니라 대상 자체를 가리키는 구문을 반영했습니다.
theological_decisions:
- issue: ἀληθής를 ‘진짜’로 풀지 않고 ‘참된’으로 번역할지 여부
  chosen_reading: ‘참된’은 사물의 본질적 참됨을 살리면서도, 성찬 논쟁을 번역 단계에서 미리 결론내리지 않습니다.
  alternative_readings:
  - 진짜의
  - 실제의
  rationale: 요한복음의 표현력을 보존하고, ‘실재성’으로만 좁혀 읽게 만들지 않기 위해 더 직역적인 ‘참된’을 택했습니다.
  doctrine_reference: 성찬론 관련 해석의 긴장을 번역에서 유지
