id: JHN.6.22
reference: John 6:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
  footnotes:
  - marker: a
    text: Or 'boat' for 'small boat' (πλοιάριον); the Greek uses a diminutive form here.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts and editions vary between 'small boat' (πλοιάριον) and 'boat' (πλοῖον) in this verse; the translation reflects the wording of the printed Greek text in each clause.
    reason: textual_variant
translation:
  language: ko
  text: 이튿날에 바다 건너편에 서 있던 무리가 다른 작은 배는 거기 없고 오직 하나뿐인 것을 보았고, 또 예수께서 제자들과 함께 그 배에 타지 않으시고, 제자들만 떠난 것을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 πλοιάριον은 축소형으로, 여기서는 ‘작은 배’의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 앞부분의 πλοιάριον과 뒷부분의 πλοῖον 사이에 사본 차이가 있습니다. 이 번역은 각 절에 제시된 인쇄 본문의 표현을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  english_pob_choice: On the next day
  chosen_korean: 이튿날에
  alternatives_korean:
  - 다음 날에
  - 그다음 날에
  lexicon: BDAG
  rationale: 시간 표현의 자연스러운 한국어로, 앞선 사건 다음 날이라는 전환을 간결하게 살렸습니다.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης
  english_pob_choice: the crowd that had been standing on the other side of the sea
  chosen_korean: 바다 건너편에 서 있던 무리
  alternatives_korean:
  - 바다 건너편에 서 있던 군중
  - 바다 저편에 서 있던 무리
  lexicon: BDAG
  rationale: ἑστηκώς의 상태를 ‘서 있던’으로 옮기고, πέραν τῆς θαλάσσης는 ‘바다 건너편에’로 자연스럽게 표현했습니다.
- source_word: πλοιάριον
  english_pob_choice: small boat
  chosen_korean: 작은 배
  alternatives_korean:
  - 조그만 배
  - 작은 보트
  lexicon: BDAG
  rationale: 헬라어 축소형의 뉘앙스를 살리되 한국어에서 지나치게 기술적으로 들리지 않도록 ‘작은 배’로 옮겼습니다.
- source_word: πλοῖον
  english_pob_choice: boat
  chosen_korean: 그 배
  alternatives_korean:
  - 배
  - 그 작은 배
  lexicon: BDAG
  rationale: 후반 절의 πλοῖον은 정관적 지시를 살려 ‘그 배’로 두어 앞절과의 대응을 보이게 했습니다.
- source_word: μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον
  english_pob_choice: his disciples had gone away alone
  chosen_korean: 제자들만 떠난 것을
  alternatives_korean:
  - 제자들만 떠났음을
  - 제자들만 가 버린 것을
  lexicon: BDAG
  rationale: μόνοι의 배타성을 ‘제자들만’으로 살리고, 뒤의 서술 전체를 종속절로 정리해 앞의 ‘보았고’와 연결했습니다.
theological_decisions:
- issue: 예수께서 제자들과 함께 배에 타지 않으신 사실의 서술 방식
  chosen_reading: 예수께서 제자들과 함께 그 배에 타지 않으시고
  alternative_readings:
  - 예수께서 제자들과 함께 그 배에 들어가지 않으시고
  - 예수께서 제자들과 함께 그 배에 오르지 않으시고
  rationale: 공동 탑승의 부재를 가장 직접적으로 드러내는 표현을 택해, 본문의 관찰 진술을 과장 없이 전달했습니다.
  doctrine_reference: 서술 본문에서 불필요한 해석을 덧붙이지 않고 사건의 관찰 가능성을 유지하는 번역 원칙
