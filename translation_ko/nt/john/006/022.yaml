  terminology: ‘작은 배’와 ‘배’를 각각 유지하여 πλοιάριον과 πλοῖον의 인쇄 본문상 구별을 보존했습니다. ‘배에 들어가지 않으시고’는 συνεισῆλθεν εἰς τὸ πλοῖον의 ‘제자들과 함께 배 안으로 들어가다/타다’라는 뜻을 충실히 전달합니다.
