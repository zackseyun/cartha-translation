  source_fidelity: 핵심 사건 순서와 배의 구별은 대체로 충실합니다. 다만 원문은 두 ὅτι절을 모두 ‘보았다’의 내용으로 제시하므로, 한국어에서도 두 사실을 병렬로 명확히 연결하는 것이 좋습니다. 또한 πλοιάριον과 πλοῖον의 차이는 본문과 각주 표지에서 각각 분명히 드러나야 합니다.
