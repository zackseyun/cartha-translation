theological_decisions:
- issue: 예수의 하늘 기원 주장 표현
  chosen_reading: ‘하늘에서 내려왔다’는 말을 그대로 살려, 은유로 완화하지 않았습니다.
  alternative_readings:
  - ‘하늘로부터 왔다’
  - ‘하늘에서 내려오셨다’
  rationale: 본문은 군중의 반발을 통해 예수의 선재·성육신적 발언을 직접 제시하므로, 그 신학적 긴장을 유지하는 쪽이 원문에 가깝습니다.
  doctrine_reference: '니케아 신경(381); 번역 원칙: 신학적 긴장을 해소하지 말고 보존'
