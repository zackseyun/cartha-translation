  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: ko
  text: 그들은 이렇게 말하고 있었습니다. 「이 사람이 요셉의 아들 예수가 아니냐? 우리가 그의 아버지와 어머니를 알고 있는데, 어째서 그가 이제 ‘나는 하늘에서 내려왔다’고 말하는가?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘로부터 내려왔다’입니다.
