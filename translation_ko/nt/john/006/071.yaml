  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: Now he was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
  footnotes:
  - marker: a
    text: Or, more literally, 'hand him over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 예수님에 대해 말씀하신 것이었습니다. 곧 시몬 이스가리옷의 아들 유다인데, 그는 열둘 중 하나로서 예수님을 넘겨주려고 하던 사람이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν δὲ
  english_pob_choice: Now he was speaking
  chosen_korean: 이것은 예수님에 대해 말씀하신 것이었습니다
  alternatives_korean:
  - 그리고 그는 말씀하셨습니다
  - 그런데 그는 말씀하신 것이었습니다
  lexicon: BDAG
  rationale: ἔλεγεν의 미완료 시상과 설명적 문맥을 살려, 단순 과거보다 계속적·해설적 의미가 드러나도록 옮겼습니다. 한국어에서는 직접적인 화법보다 문맥상 해설 문장으로 자연스럽게 처리했습니다.
- source_word: τὸν Ἰούδαν Σίμωνος Ἰσκαριώτου
  english_pob_choice: Judas, the son of Simon Iscariot
  chosen_korean: 시몬 이스가리옷의 아들 유다
  alternatives_korean:
  - 유다, 시몬 이스가리옷의 아들
  - 시몬 이스가리옷의 아들 유다
  lexicon: BDAG
  rationale: 두 속격이 유다를 아버지-계보로 식별하므로, 한국어에서도 ‘~의 아들’ 구조로 관계를 분명히 했습니다. ‘이스가리옷’을 유다의 별칭처럼 떼어놓지 않고 원문의 결속을 유지했습니다.
- source_word: παραδιδόναι αὐτόν
  english_pob_choice: betray him
  chosen_korean: 예수님을 넘겨주려고 하던
  alternatives_korean:
  - 예수님을 배반하려고 하던
  - 예수님을 넘기려고 하던
  lexicon: BDAG
  rationale: παραδίδωμι는 문자적으로는 ‘넘겨주다’이지만, 요한복음의 수난 서술에서는 배반의 함의가 강합니다. 본문 의미를 직접적으로 드러내되, 한국어 문맥에서는 자연스럽게 ‘넘겨주다’로 살렸습니다.
- source_word: εἷς ἐκ τῶν δώδεκα
  english_pob_choice: one of the Twelve
  chosen_korean: 열둘 중 하나로서
  alternatives_korean:
  - 열두 제자 가운데 하나로서
  - 열둘 가운데 하나로서
  lexicon: BDAG
  rationale: ‘열둘’은 사도 집단의 고유한 호칭이므로 이를 유지했습니다. 분사적 덧붙임을 한국어의 ‘-로서’로 처리해 신분상의 아이러니를 살렸습니다.
theological_decisions:
- issue: παραδιδόναι의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘넘겨주다’로 옮기되, 앞뒤 문맥이 배반 행위임을 분명히 드러내도록 했습니다.
  alternative_readings:
  - 배반하다
  - 건네주다
  rationale: 이 동사는 단순 전달보다 배신의 행위를 가리키는 서술적 기능이 강합니다. 전통적 교회어인 ‘배반하다’만 쓰면 행위의 인계적 성격이 약해질 수 있어, 본문과 문맥을 함께 보이는 표현을 택했습니다.
  doctrine_reference: lexical-contextual decision; preserve narrative and moral force without softening the source
