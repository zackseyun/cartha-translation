  source_fidelity: 원문은 예수님께서 유다에 관하여 말씀하고 계셨음을 설명합니다. 초안의 ‘이것은 예수님에 대해 말씀하신 것’은 대상이 예수님으로 바뀌어 원문의 핵심 내용을 반대로 옮긴 중대한 오류입니다. 또한 ‘넘겨주려고 하던’은 μέλλω의 미래 지향성을 어느 정도 살리지만, 문장 전체에서 유다의 신원과 행위의 관계를 더 명료하게 해야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서 설명적 서술로 자연스럽게 읽힙니다. ‘열둘 가운데 하나였던’은 원문의 동격적 강조를 한국어에서 무리 없이 드러냅니다.
  terminology: ‘시몬 이스가리옷의 아들 유다’는 SBLGNT의 속격 결속을 반영합니다. παραδιδόναι는 문맥상 ‘배반할’로 옮기고, 문자적 대안인 ‘넘겨주다’는 각주로 보존합니다. ‘열둘’은 제자 집단의 관용적 호칭으로 유지했습니다.
