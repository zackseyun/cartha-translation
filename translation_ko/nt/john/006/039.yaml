id: JHN.6.39
reference: John 6:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
  footnotes:
  - marker: a
    text: Or, more personally, 'all whom he has given me ... raise them up.' The Greek uses a collective singular expression, literally 'all that ... it.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이것이 나를 보내신 분의 뜻입니다. 곧 그분이 내게 주신 모든 것에서 아무것도 잃지 않고, 마지막 날에 그것을 다시 살리는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내게 그가 주신 모든 것… 그것을 다시 살리는 것’입니다. 그리스어는 중성 단수의 집합적 표현을 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  english_pob_choice: will
  chosen_korean: 뜻
  alternatives_korean:
  - 의지
  - 원하심
  lexicon: BDAG
  rationale: 하나님의 목적적 의도를 자연스럽게 드러내면서도, 단순한 감정적 바람보다 더 강한 ‘뜻’의 의미를 살렸습니다.
- source_word: τοῦ πέμψαντός με
  english_pob_choice: the one who sent me
  chosen_korean: 나를 보내신 분
  alternatives_korean:
  - 나를 보내신 이
  - 나를 파견하신 분
  lexicon: BDAG
  rationale: πέμπω의 관계적·동사적 힘을 살려 직역에 가깝게 옮기되, 한국어에서 자연스러운 명사구로 표현했습니다.
- source_word: πᾶν ὃ δέδωκέν μοι
  english_pob_choice: all that he has given me
  chosen_korean: 내게 주신 모든 것
  alternatives_korean:
  - 내게 주신 모든 사람
  - 내게 주신 모든 것들
  lexicon: BDAG
  rationale: 그리스어의 중성 단수 집합 표현을 그대로 반영해 ‘모든 것’으로 옮겼습니다. 이는 영어 POB의 집합적 독법과도 맞습니다.
- source_word: ἀπολέσω
  english_pob_choice: I should lose nothing
  chosen_korean: 아무것도 잃지
  alternatives_korean:
  - 아무것도 잃어버리지
  - 아무도 잃지
  lexicon: BDAG
  rationale: ἀπόλλυμι를 여기서는 ‘멸하다’보다 ‘잃다’로 이해하는 것이 문맥에 맞고, 부정문에서는 ‘아무것도 잃지’가 가장 자연스럽습니다.
- source_word: ἀναστήσω αὐτό
  english_pob_choice: should raise it up
  chosen_korean: 그것을 다시 살리는
  alternatives_korean:
  - 그것을 다시 일으키는
  - 그것을 부활시키는
  lexicon: BDAG
  rationale: 중성 단수 대명사 αὐτό를 살려 ‘그것’을 유지했습니다. ‘다시 살리는’은 종말론적 ‘일으키다’의 의미를 현대 한국어로 자연스럽게 전달합니다.
theological_decisions:
- issue: 중성 단수 집합 표현을 사람 중심 복수로 풀지 여부
  chosen_reading: ‘내게 주신 모든 것’과 ‘그것을’으로 유지해 집합적 단수 표현을 보존했습니다.
  alternative_readings:
  - ‘내게 주신 모든 사람’과 ‘그들을’
  - ‘내게 맡기신 이들’
  rationale: 본문은 πᾶν, ὃ, αὐτό의 중성 단수 형태를 사용하므로, 이를 성급히 인칭 복수로 바꾸면 원문의 표현적 긴장이 사라집니다. 문맥상 사람들이 가리켜질 수 있어도 번역은 그 집합적 형태를 보존하는 편이 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 집합적 단수 표현 보존
