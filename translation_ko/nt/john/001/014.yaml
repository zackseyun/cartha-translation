id: JHN.1.14
reference: John 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
  footnotes:
  - marker: a
    text: Or "tabernacled among us"; the verb echoes tent/tabernacle imagery.
    reason: lexical_alternative
  - marker: b
    text: Or "only begotten Son"; alternatively, "unique Son."
    reason: alternative_reading
translation:
  language: ko
  text: 말씀이 육신이 되어 우리 가운데 거하셨고[a], 우리가 그의 영광을 보았으니, 그 영광은 아버지에게서 난 독생자의 영광이며 은혜와 진리가 충만합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "장막처럼(σκηνή) 우리 가운데 장막을 치셨다" — ἐσκήνωσεν은 σκηνή(장막) 어근을 사용해 성막·임재 이미지를 환기합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 "오직 하나뿐인 아들/only begotten Son" — μονογενοῦς는 '유일성'을 강조하는데, 전통적으로 '독생자(only begotten)'로 번역되어 교리적 무게를 가집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  english_pob_choice: the Word
  chosen_korean: 말씀
  alternatives_korean:
  - 로고스
  - 메시지
  - 이성
  lexicon: BDAG; Johannine usage
  rationale: 그리스어 λόγος의 전통적인 한국어 등가어는 '말씀'으로, 요한서문의 인격적·신학적 무게를 전달합니다. '로고스'는 원어적 뉘앙스를 유지하지만 비전문가에게 낯설고, '메시지'나 '이성'은 인격적 어감을 약화시킵니다.
- source_word: σὰρξ
  english_pob_choice: flesh
  chosen_korean: 육신
  alternatives_korean:
  - 육체
  - 사람됨
  - 인간성
  lexicon: BDAG
  rationale: σὰρξ는 단순한 '사람'이 아니라 '육신/살의 실재성'을 말하므로 한국어에서는 '육신'으로 직역해 현장적(incarnational) 의미를 보존합니다. '육체'도 가능하나 '육신'이 더 전통적·신학적 뉘앙스를 유지합니다.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  english_pob_choice: dwelt among us
  chosen_korean: 우리 가운데 거하셨다
  alternatives_korean:
  - 우리 가운데 장막을 치셨다
  - 우리 가운데 임하셨다
  - 우리 가운데 머무르셨다
  lexicon: BDAG; Septuagint allusion (σκηνή)
  rationale: 동사 어근은 σκηνή(장막) 이미지를 불러오므로 '장막/처소' 함의를 보존하는 각주를 달고, 본문은 현대어 독자를 위해 '거하셨다'로 자연스럽게 표현합니다.
- source_word: μονογενοῦς
  english_pob_choice: the one and only Son
  chosen_korean: 독생자
  alternatives_korean:
  - 오직 하나뿐인 아들
  - 외아들
  - only begotten Son (역사적 번역)
  lexicon: BDAG; Patristic usage
  rationale: μονογενοῦς는 '유일함'을 강조하는 어휘입니다. 한국어 전통에서는 '독생자'가 널리 통용되므로 본문어로 채택하고, 역사적·교리적 번역 'only begotten'은 각주로 남깁니다.
theological_decisions:
- issue: 모노게누스(μονογενοῦς) 번역의 신학적 민감성
  chosen_reading: 독생자
  alternative_readings:
  - 오직 하나뿐인 아들
  - only begotten Son
  rationale: 원어는 '유일함'을 전제하므로 '독생자'가 한국어 전통과 의미를 잘 연결합니다. 'only begotten'은 고전적 교리 언어로 중요한 역사적 무게가 있으므로 본문 대신 각주로 보존해 검토 가능하게 합니다.
  doctrine_reference: Translation theology; Christological history
- issue: ἐσκήνωσεν(장막 이미지) — 직역 vs. 함의 보존
  chosen_reading: 우리 가운데 거하셨다 (본문), 장막 이미지는 각주로 설명
  alternative_readings:
  - 우리 가운데 장막을 치셨다
  - 우리 가운데 거하셨다(직역 없이)
  rationale: 본문은 현대 한국어 독자에게 자연스러운 표현을 우선하지만, 동사의 장막(σκηνή) 어근이 신학적으로 이스라엘의 성막·임재 이미지를 불러오므로 그 함의를 각주에 명시해 독자가 원문의 상호텍스트적 의미를 검토할 수 있게 합니다.
  doctrine_reference: Tabernacle/Incarnation typology; Translation transparency
