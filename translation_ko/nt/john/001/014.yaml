    issue: ‘은혜와 진리가 충만합니다’의 수식 대상 및 시제
    rationale: πλήρης는 남성 단수이며, 문맥상 말씀(또는 ‘아버지께로부터 오신 독생자’)을 묘사합니다. 초안처럼 ‘영광’에 연결하면 여성 명사 δόξα와의 문법적 연결도 맞지 않으며, 아오리스트 서술의 문맥에서 현재형 ‘충만합니다’도 부정확합니다.
  - severity: low
    issue: 각주 a의 대안 표현이 부자연스럽고 중복됨
    rationale: ‘장막처럼 … 장막을 치셨다’는 뜻이 겹칩니다. ἐσκήνωσεν의 장막 어근과 가능한 직역을 간결하게 제시하는 편이 낫습니다.
  - severity: low
    issue: 각주 b의 영어 혼입 및 μονογενοῦς 설명
    rationale: 대상 언어가 한국어이므로 영어 ‘only begotten Son’ 대신 한국어로 전통 번역을 제시해야 합니다. 또한 ‘독생자’가 곧 유일성의 뜻을 완전히 투명하게 드러내지는 않으므로 ‘유일하신 아들’을 대안으로 제시하는 것이 원어 의미를 보완합니다.
