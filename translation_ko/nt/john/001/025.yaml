id: JHN.1.25
reference: John 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
  footnotes:
  - marker: a
    text: Or “the Christ.” The Greek title is Χριστός (Christos), rendered here as “the Messiah” to preserve the Jewish messianic context.
    reason: alternative_reading
  - marker: b
    text: “The Prophet” likely refers to the expected prophet like Moses (see Deut. 18:15).
    reason: cross_reference
translation:
  language: ko
  text: 그들이 그에게 묻고 말했습니다. “그러면 당신이 메시아[a]도 아니고 엘리야도 아니며 그 예언자[b]도 아니라면, 왜 세례를 베푸십니까?”
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “그리스도”. 원어의 칭호 Χριστός(Christos)를 본문상 유대적 메시야 기대를 보존하도록 '메시아'로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: '“그 예언자”는 신명기 18:15에 예언된 모세와 같은 기대된 예언자를 가리키는 것으로 보입니다(비교: 신 18:15).'
    reason: cross_reference
lexical_decisions:
- source_word: ὁ χριστὸς
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 그리스도(음역)
  lexicon: BDAG
  rationale: Χριστός는 이 문맥에서 직함적 기능을 하므로 유대적 메시야 기대를 보존하는 '메시아'를 사용했습니다.
- source_word: βαπτίζεις
  english_pob_choice: are you baptizing
  chosen_korean: 세례를 베푸십니까
  alternatives_korean:
  - 세례를 줍니까
  - 세례를 베풀고 있습니까
  lexicon: BDAG
  rationale: 현재 직설법의 계속적·현행적 활동을 한국어의 정중한 현재형('베푸십니까')로 표현했습니다.
- source_word: ὁ προφήτης
  english_pob_choice: the Prophet
  chosen_korean: 그 예언자
  alternatives_korean:
  - 그 선지자
  - 예언자(일반적)
  lexicon: BDAG
  rationale: 요한복음의 문맥에서 특정 기대 인물을 가리키므로 일반적 '예언자' 대신 관사적·지시적 의미를 살려 '그 예언자'로 옮겼습니다.
- source_word: οὐδὲ ... οὐδὲ
  english_pob_choice: nor ... nor
  chosen_korean: …도 아니고 …도 아니며
  alternatives_korean:
  - 또는 … 또는 …
  lexicon: BDAG
  rationale: 반복된 부정 연결을 한국어의 '도 아니고…도 아니며'로 재현하여 원문의 병렬 구조를 살렸습니다.
theological_decisions:
- issue: Rendering Χριστός in this Johannine question
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: Χριστός가 제목적·유대적 맥락에서 사용되므로 '메시아'로 옮겨 원문의 민족·종말론적 기대를 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → Messiah (title rendering)'
- issue: Whether ὁ προφήτης denotes a specific eschatological figure
  chosen_reading: 그 예언자(모세와 같은 기대된 예언자)
  alternative_readings:
  - 일반적 예언자
  rationale: 요한복음과 전통적 해석(신명기 18:15 참조)은 여기서 '그 예언자'가 특정 예언자상을 가리키는 것으로 보이므로 본문에 그 기대를 반영합니다.
  doctrine_reference: Deut 18:15; Johannine context
