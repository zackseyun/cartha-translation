review_pass:
  verdict: revise
  source_fidelity: 첫째 구의 εἰς(…으로/에 대한 방향)를 한국어 조사 ‘-로’가 ‘자기에게 속한 것들’에 직접 붙는 방식으로 처리하여 다소 부자연스럽고, ‘것들’ 자체가 도착 장소처럼 들립니다. τὰ ἴδια의 중성 복수와 뒤의 사람을 가리키는 οἱ ἴδιοι의 대비는 유지하되, 한국어에서는 ‘그분께 속한 곳’으로 자연스럽게 옮기고 각주에서 ‘그분께 속한 것들’이라는 더 문자적인 가능성을 밝혀 두는 것이 안전합니다. 두 번째 구의 ‘그분의 백성’ 및 ‘그분을’은 원문의 소유 관계와 목적어를 충실히 반영합니다.
  naturalness: ‘자기에게 속한 것들로 오셨으나’는 현대 한국어에서 수단을 나타내는 ‘-로’로도 읽혀 어색합니다. ‘그분께 속한 곳으로 오셨으나’는 문장 흐름과 방향성을 자연스럽게 살립니다. ‘백성들’은 집합 명사 ‘백성’으로 충분하므로 단수형이 더 자연스럽습니다.
  terminology: ‘받아들이지 않았습니다’는 παρέλαβον의 넓은 의미를 무리 없이 전달합니다. ‘그분’은 합쇼체의 존중 서술 ‘오셨으나’와 조응하며, 특정 교리적 해석을 추가하지 않습니다. 첫 구의 ‘곳’은 본문에서 영역·거처의 공간적 함의를 드러내되, 각주가 중성 복수의 더 넓은 ‘것들’ 가능성을 보존합니다.
  issues:
  - severity: medium
    issue: 첫 구의 한국어 목적지 표현이 부자연스럽습니다.
    rationale: ‘자기에게 속한 것들로 오셨다’에서 ‘-로’는 통상 수단 또는 변화를 나타낼 수 있고, ‘것들’은 ‘오다’의 목적지로 자연스럽지 않습니다. εἰς의 방향성을 자연스러운 한국어 목적지 표현으로 바꿀 필요가 있습니다.
  - severity: low
    issue: ‘자기 백성들’의 복수 표지가 불필요합니다.
    rationale: ‘백성’은 집단을 가리키는 명사이므로 ‘그분의 백성’이 자연스럽고, οἱ ἴδιοι가 사람들을 가리킨다는 점도 충분히 드러납니다.
  revised_text: 그분께서는 그분께 속한 곳[a]으로 오셨으나, 그분의 백성은 그분을 받아들이지 않았습니다[b].
  revised_footnotes:
  - marker: a
    text: 또는 ‘그분께 속한 것들에게’라고 번역할 수 있습니다. 그리스어 첫 구(τὰ ἴδια)는 중성 복수이며, 뒤의 남성 복수 οἱ ἴδιοι(그분의 백성)와 문법적으로 구별됩니다. 이는 그분께 속한 영역, 거처, 소유 등을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분을 받지 않았습니다’, ‘그분을 영접하지 않았습니다’ 또는 ‘그분을 환영하지 않았습니다’라고 번역할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 개정문은 εἰς의 방향성과 τὰ ἴδια/οἱ ἴδιοι의 중성 대 남성 대조를 보존하면서도 현대 표준 한국어에서 자연스러운 문장을 제공합니다. 첫 구를 특정하게 ‘집’이나 ‘땅’으로 단정하지 않았고, ‘곳’의 공간적 번역이 포착하지 못할 수 있는 넓은 중성 복수의 범위는 각주로 명시했습니다. 각주 표지는 본문에 각각 한 번씩 정확히 연결됩니다.
