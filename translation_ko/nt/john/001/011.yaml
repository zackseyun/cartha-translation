review_pass:
  verdict: revise
  source_fidelity: 첫 구의 εἰς τὰ ἴδια는 중성 복수이면서 도착의 방향·장소를 나타냅니다. 초안의 ‘자기에게 속한 것들로 오셨으나’는 중성 복수의 대비를 살리려는 장점이 있으나, 한국어에서 ‘것들로 오다’는 수단으로도 읽히고 목적지 표현으로 부자연스럽습니다. ‘자기에게 속한 곳에’는 문맥상 자연스러운 목적지 표현으로 옮기되, 중성 복수와 그 가능한 넓은 의미는 각주에서 보존하는 것이 안전합니다. 뒤의 οἱ ἴδιοι는 사람을 뜻하므로 ‘자기 백성’이 적절하며, παραλαμβάνω의 부정은 ‘받아들이지 않았습니다’로 충실히 옮겼습니다.
  naturalness: ‘자기에게 속한 곳에 오셨으나, 자기 백성은 그를 받아들이지 않았습니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. 집합 명사인 ‘백성’은 한국어에서 복수 표지 없이도 복수의 사람들을 충분히 가리킵니다.
  terminology: ‘백성’은 οἱ ἴδιοι의 인적 지시를 분명히 하면서 특정 교리적 해석을 덧붙이지 않습니다. ‘받아들이다’는 ‘받다’, ‘영접하다’, ‘환영하다’의 함의를 어느 하나로 과도하게 한정하지 않는 적절한 선택입니다.
  issues:
  - severity: medium
    issue: 첫 구의 ‘자기에게 속한 것들로 오셨으나’가 한국어 목적지 표현으로 어색하고 모호합니다.
    rationale: εἰς는 도착의 방향·장소를 나타내지만, 한국어 조사 ‘-로’는 이 문맥에서 수단 또는 재료의 뜻으로도 읽힐 수 있습니다. ‘것들’ 자체를 도착지로 삼는 표현도 자연스럽지 않습니다. 중성 복수의 폭은 각주로 보존하면서 본문은 ‘자기에게 속한 곳에’로 다듬는 것이 더 충실하고 자연스럽습니다.
  - severity: low
    issue: 각주 a의 제시 대안이 본문과 실질적으로 거의 같으며, 본문의 관용적 처리와 원문의 중성 복수 사이의 관계를 충분히 설명하지 못합니다.
    rationale: 수정 본문이 ‘곳’으로 자연스럽게 옮기는 경우, 각주에서 원문의 중성 복수가 ‘그에게 속한 것들’이며 영역·거처·소유 등을 포괄할 수 있음을 밝혀 해석의 폭을 보존해야 합니다.
  revised_text: 자기에게 속한 곳에 오셨으나, 자기 백성은 그를 받아들이지 않았습니다[b].
  revised_footnotes:
  - marker: b
    text: 또는 ‘받지 않았습니다’, ‘영접하지 않았습니다’, 또는 ‘환영하지 않았습니다’라고 번역할 수 있습니다. 그리스어 παραλαμβάνω는 여기서 사람을 받아들이거나 영접하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: a
    text: 또는 직역하여 ‘자기에게 속한 것들로’라고 할 수 있습니다. 그리스어 첫 구 τὰ ἴδια는 중성 복수로, 영역·거처·소유 등 그에게 속한 것을 가리킬 수 있으며, 뒤의 남성 복수 οἱ ἴδιοι(그의 백성)와 문법적으로 구별됩니다.
    reason: alternative_reading
  revision_rationale: 첫 구는 원문의 중성 복수와 뒤따르는 남성 복수의 대조를 유지해야 합니다. 다만 한국어 본문에서 ‘것들로 오셨다’는 목적지 의미가 불명확하므로, 문맥상 자연스러운 ‘자기에게 속한 곳에’로 옮겼습니다. 이 표현이 원문을 ‘집’이나 특정 장소로 단정하지 않도록, 중성 복수의 넓은 지시 범위와 직역 가능성은 각주 a에 명시했습니다. 각주 표지는 해당 본문 표현 뒤에 직접 붙여 원문의 문법적 대비를 정확히 연결했습니다.
