id: JHN.1.11
reference: John 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
  footnotes:
  - marker: a
    text: Or 'He came to what was his own'; the Greek first phrase is neuter plural, distinct from the following masculine plural 'his own people.'
    reason: alternative_reading
  - marker: b
    text: Or 'did not accept him' or 'did not welcome him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 그분께 속한 곳[a]으로 오셨으나, 그분의 백성은 그분을 받아들이지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분께 속한 것들에게’라고 번역할 수 있습니다. 그리스어 첫 구(τὰ ἴδια)는 중성 복수이며, 뒤의 남성 복수 οἱ ἴδιοι(그분의 백성)와 문법적으로 구별됩니다. 이는 그분께 속한 영역, 거처, 소유 등을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분을 받지 않았습니다’, ‘그분을 영접하지 않았습니다’ 또는 ‘그분을 환영하지 않았습니다’라고 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  english_pob_choice: to his own
  chosen_korean: 자기에게 속한 것들
  alternatives_korean:
  - 자기 것들
  - 자기 소유
  - 자기 영역/거처
  lexicon: BDAG
  rationale: 그리스어 중성 복수 τὰ ἴδια는 문자적으로 ‘그에게 속한 것들’을 가리킬 가능성이 높습니다. 영어 POB가 선택한 'to his own'과 일치하도록 한국어로는 ‘자기에게 속한 것들’이라 번역하여 사람이 아닌 소유·영역·거처 등 중성적 대상성을 보존했습니다. 이것은 뒤에 나오는 남성 복수 οἱ ἴδιοι(사람들)과의 대비를 훼손하지 않습니다.
- source_word: ἦλθεν
  english_pob_choice: came
  chosen_korean: 오셨다
  alternatives_korean:
  - 왔다
  - 도착했다
  lexicon: BDAG
  rationale: ἦλθεν의 단순 과거성(도달 행위)을 한국어로 자연스럽게 전달하기 위해 '오셨다'를 선택했습니다. 영어 POB의 'came'에 대응하며, 한국어 경어 형식을 고려해 인물(말씀/그리스도)에 대한 일반적 서술에서 널리 쓰이는 '오셨다'를 사용했습니다.
- source_word: οἱ ἴδιοι
  english_pob_choice: his own people
  chosen_korean: 자기 백성들
  alternatives_korean:
  - 자기 사람들
  - 자기 일파
  lexicon: BDAG
  rationale: οἱ ἴδιοι는 남성 복수로 사람들을 가리키므로, 한국어로 '자기 백성들'이라 번역하여 인적 집단임을 명확히 했습니다. 영어 POB의 'his own people'과 등가적이며, 앞의 τὰ ἴδια(중성)과의 문법적·의미적 대비를 드러냅니다.
- source_word: παρέλαβον
  english_pob_choice: did not receive
  chosen_korean: 받아들이지 않았습니다
  alternatives_korean:
  - 받지 않았습니다
  - 영접하지 않았습니다
  - 환대하지 않았습니다
  lexicon: BDAG
  rationale: παραλαμβάνω는 사람을 '받다/영접하다/받아들이다'의 의미 범위를 가집니다. 한국어 번역에서는 수용과 환영의 일반적 의미를 모두 포함하는 '받아들이지 않았습니다'를 택해 과도하게 좁히지 않았습니다. 문체상 격식을 유지하기 위해 존댓말 과거 부정형을 사용했습니다.
- source_word: αὐτόν
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그분을
  - 그를(그분을)
  lexicon: BDAG
  rationale: 문맥상 지시대명사 αὐτόν은 바로 앞의 말씀/빛/그(로고스)를 가리킵니다. 한국어로는 자연스러운 지시대명사 '그를'을 사용했고, 경어를 이미 문장 전체에서 사용했으므로 별도 높임표현을 부과하지 않았습니다.
theological_decisions:
- issue: ἴδιος의 중복 사용(중성 복수 τὰ ἴδια vs. 남성 복수 οἱ ἴδιοι)의 지시 대상과 뉘앙스
  chosen_reading: 첫 구절 τὰ ἴδια는 그에게 속한 것들(영역·거처·소유)을 가리키는 중성 복수로 읽고, 이어지는 οἱ ἴδιοι는 그의 백성(사람들)을 가리키는 남성 복수로 읽습니다. 번역은 이 구별을 명확히 드러내며 해석적 결론으로 좁히지 않습니다.
  alternative_readings:
  - 양쪽 구절이 단순히 '자기 백성'을 가리킨다.
  - 첫 구절은 구체적으로 '자기 집/가정'을 가리킨다.
  rationale: '그리스어의 성(gender)·수(number) 표시는 의미적 구별을 시사합니다. 영어 POB 감사 자료와 일치하게, 번역은 원문이 만든 긴장(소유·영역 대 인적 공동체)을 보존하는 편이 신중합니다. 과도한 해석(예: 특정 장소로 단정) 대신 독자가 원문에서 드러나는 두 층위의 대비를 인지하도록 번역했습니다.'
  doctrine_reference: Translation philosophy §3, 신학적 긴장 보존
