id: JHN.1.1
reference: John 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
  footnotes:
  - marker: a
    text: Or, 'the Word was divine' or 'what God was, the Word was.' The Greek wording presents 'God' qualitatively in the final clause, affirming the Word's full deity while distinguishing the Word from 'God' in the preceding clause.
    reason: alternative_reading
  - marker: b
    text: The opening phrase echoes Genesis 1:1, linking the Word with the beginning of creation.
    reason: cross_reference
translation:
  language: ko
  text: 태초에 말씀[a]이 계셨고, 그 말씀이 하나님과 함께[b] 계셨으며, 말씀은 하나님이셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '말씀은 신성이었다' 또는 '하나님이 그러하신 것처럼 말씀도 그러하였다.' 그리스어 어구는 마지막 절에서 θεός를 질적(qualitative)으로 제시하여 말씀의 온전한 신성을 확인하면서도 앞절의 '하나님'과 인격적으로 구별함을 유지합니다.
    reason: alternative_reading
  - marker: b
    text: 이 첫 구절은 창세기 1:1을 떠올리게 하여 말씀을 창조의 '태초'와 연결합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  english_pob_choice: In the beginning
  chosen_korean: 태초에
  alternatives_korean:
  - 처음에
  - 시작에
  - 처음부터
  lexicon: BDAG
  rationale: 그리스어 구문은 창세기 1:1을 암시하므로(영어 POB와 동일) 문학적·신학적 울림을 살리기 위해 '태초에'를 사용했습니다. 다른 선택지는 더 일반적이거나 서술적이지만, '태초에'가 원문의 창조·원초적 시점을 한국어로 가장 직접적으로 전달합니다.
- source_word: ἦν
  english_pob_choice: was
  chosen_korean: 계셨습니다
  alternatives_korean:
  - 있었습니다
  - 존재했습니다
  lexicon: BDAG
  rationale: 피조물로서가 아니라 신성과 인격을 서술하는 문맥이므로 한국어의 경건한 서술 관습을 따라 존칭어 '계셨습니다'를 사용했습니다. 문체적·공경적 이유로 평서형 '있었습니다' 대신 선택했으며, 이 것은 의도적인 담화적 등록(register) 변화입니다(아래 신학적 결정에서 문서화).
- source_word: ὁ λόγος
  english_pob_choice: the Word
  chosen_korean: 말씀
  alternatives_korean:
  - 로고스
  - 말
  - 메시지
  lexicon: BDAG
  rationale: 요한복음에서 λόγος는 계시와 인격을 모두 함축하는 용어입니다. 한국어 전통 번역과 현대 번역 관행을 감안하여 '말씀'을 선택했습니다. '로고스'는 원어를 그대로 드러내지만 한국어 독자에게 부담이 될 수 있고, '이성'·'사유'처럼 철학적 뉘앙스를 주는 번역은 요한의 신학을 왜곡할 위험이 있습니다.
- source_word: πρὸς τὸν θεόν
  english_pob_choice: with God
  chosen_korean: 하나님과 함께
  alternatives_korean:
  - 하나님께로
  - 하나님의 임재 가운데
  lexicon: BDAG
  rationale: πρός + 대격은 관계적·지향적 의미를 가질 수 있으나 문맥상 인격적 친교와 구별을 드러냅니다. '하나님과 함께'는 인격적 동행과 동시성을 가장 자연스럽게 전달합니다. '하나님의 임재 가운데'는 해석적 확장입니다.
- source_word: τὸν θεόν
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 야훼
  - 주 하나님
  lexicon: BDAG
  rationale: 신약 본문에서 θεός을 번역할 때는 통상 한국어로 '하나님'을 씁니다. 본 절은 창세기 문구를 암시하지만 직접적인 히브리어 YHWH 표기를 인용하는 구절이 아니므로, POB 용어집 규칙에 따라 여기에 '야훼'를 도입하지 않았습니다.
- source_word: θεὸς ἦν ὁ λόγος
  english_pob_choice: the Word was God
  chosen_korean: 말씀은 하나님이셨습니다
  alternatives_korean:
  - 말씀은 신성이었다
  - 말씀은 신적이었다
  - 말씀은 신이었다
  lexicon: BDAG
  rationale: '원문에서 θεός가 관사 없이 술어로 나오는 구조는 질적(qualitative) 함의를 지닙니다. 한국어 본문은 ''말씀은 하나님이셨습니다''로 처리하여 말씀의 온전한 신성을 확언하면서도 앞절의 ''하나님과 함께''와 인격적 구별을 유지하려고 했습니다. 동등하게 가능하지만 덜 관용적인 대체안들은 각기 다른 뉘앙스(예: ''신성이었다''는 형용사적·속성적 뉘앙스를 강조)를 줍니다. 이러한 대체안은 주석(각주 a)에 기록했습니다.'
theological_decisions:
- issue: Rendering the anarthrous predicate θεός in the final clause
  chosen_reading: 말씀은 하나님이셨습니다
  alternative_readings:
  - 말씀은 신성이었다
  - 말씀은 신적 존재였다
  - 말씀은 신이었다
  rationale: 그리스어에서 관사가 없는 술어 θεός는 질적 서술로 읽히는 것이 통상적이며(영문 POB의 판단과 일치), 본문은 말씀의 온전한 신성을 고백하면서도 앞절의 '하나님과 함께'와 인격적으로 구별합니다. 한국어 본문은 관용적이고 독자에게 분명한 '말씀은 하나님이셨습니다'를 메인 텍스트로 삼고, 문법적·신학적 대안은 각주(a)로 보존해 독자가 원문 구문의 긴장을 추적할 수 있게 했습니다.
  doctrine_reference: '니케아 신경(381년) 및 번역원칙: 신학적 긴장을 해결하기보다 보존할 것'
- issue: Use of honorific register for verbs referring to the divine (ἦν → 계셨습니다)
  chosen_reading: 경건한 서술을 위해 '계셨습니다' 사용
  alternative_readings:
  - '''있었습니다'''
  - '''존재했습니다'''
  rationale: 한국어 번역 관습과 독자의 수용성을 고려하여, 신을 가리키는 서술에는 경칭 어휘(계시다 계열)를 사용하는 것이 일반적입니다. 이는 본문 해석에 영향을 주지는 않지만 담화적 톤을 높여 독자가 본문이 말하는 숭고한 대상을 느끼도록 돕습니다. 이 등록 변화는 의도적이며 독자에게 투명하게 문서화합니다.
  doctrine_reference: 번역 스타일 가이드 및 문화적·담화적 관습
