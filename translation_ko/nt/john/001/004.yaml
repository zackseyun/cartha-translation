id: JHN.1.4
reference: John 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
  footnotes:
  - marker: a
    text: Or 'the light of humanity' or 'the light of people'; Greek 'of men' uses a masculine plural with generic human reference.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 안에 생명이 있었습니다. 그 생명은 사람들의 빛이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '인류의 빛' 또는 '사람의 빛'이라고 번역할 수 있습니다; 그리스어 ἀνθρώπων은 문법적으로 남성 복수형이지만 일반적인 인간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῷ
  english_pob_choice: In him
  chosen_korean: 그 안에
  alternatives_korean:
  - 그분 안에
  - 그것 안에
  - 그에게
  lexicon: BDAG
  rationale: ἐν + dative rendered naturally as '안에'. αὐτῷ in context refers back to the λόγος, which John presents as a person; so I render it with the personal demonstrative '그' rather than the impersonal '그것'. I did not use the honorific '그분' because this is narrative reference, not direct address, and to avoid imposing later ecclesial reverence in the immediate clause.
- source_word: ζωὴ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 존재
  lexicon: BDAG
  rationale: ζωὴ is best rendered by the common Korean theological term '생명', which preserves the lexical simplicity while allowing Johannine theological depth to remain in the context rather than being paraphrased as '영원한 생명.'
- source_word: ἦν
  english_pob_choice: was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었다
  - 존재했습니다
  lexicon: BDAG
  rationale: The imperfect εἰμί (ἦν) expresses a past continuous/state; '있었습니다' is a formal-polite past rendering that preserves ongoing past existence in Korean narrative register.
- source_word: ἡ ζωὴ
  english_pob_choice: the life
  chosen_korean: 그 생명
  alternatives_korean:
  - 생명은
  - 그 삶
  lexicon: BDAG
  rationale: The article marks anaphoric reference to the life just mentioned. '그 생명' preserves the definite, identifying force of τὸ/ἡ + noun in Korean; in the text it functions as the topic of the second clause ('그 생명은 ...').
- source_word: τὸ φῶς
  english_pob_choice: the light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 광채
  lexicon: BDAG
  rationale: φῶς is translated straightforwardly as '빛'. The definite article in Greek makes this an identification ('the light'); Korean marks that by the preceding '그' on the life ('그 생명은 … 빛이었습니다'). '빛' is the standard, semantically neutral choice that preserves Johannine imagery.
- source_word: τῶν ἀνθρώπων
  english_pob_choice: of men
  chosen_korean: 사람들의
  alternatives_korean:
  - 인류의
  - 사람의
  - 인간의
  lexicon: BDAG
  rationale: ἀνθρώπων is grammatically masculine plural but functions generically ('human beings'). Korean has no grammatical gender; '사람들의' best captures the generic, representative sense of the Greek without imposing a modern gendered English form. Because alternate inclusive renderings are possible ('인류의' etc.), I document that option in the footnote.
theological_decisions:
- issue: Referent and personal force of αὐτῷ
  chosen_reading: Rendered personally as '그' and translated as '그 안에' (not '그것')
  alternative_readings:
  - '''그것'', if λόγος is taken as impersonal'
  - '''그분'', if a more honorific reference is desired'
  rationale: In the immediate context of John 1 the λόγος is presented with personal predicates and relations; rendering αὐτῷ as personal ('그') preserves that Johannine personal force. I avoided '그분' to keep the prose narrative tone and not to introduce honorific theology into the simple witness of the verse.
  doctrine_reference: 'Affirmations: Nicene/Chalcedonian orthodoxy; Translation philosophy 1'
- issue: Generic force of ἀνθρώπων
  chosen_reading: Render '사람들의' to indicate generic human reference
  alternative_readings:
  - '''인류의'', to emphasize the collective species'
  - '''사람의'', as a singular generically used form'
  rationale: Greek masculine plural functions generically here. Korean rendering '사람들의' best matches the source's representative sense while remaining natural in Korean. To preserve transparency about inclusive alternatives, the footnote records other possible readings.
  doctrine_reference: Translation philosophy 4
