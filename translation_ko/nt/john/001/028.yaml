id: JHN.1.28
reference: John 1:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
  footnotes:
  - marker: a
    text: Some manuscripts and later translation traditions read 'Bethabara' instead of 'Bethany.'
    reason: textual_variant
translation:
  language: ko
  text: 이 일들이 요단 강 건너편 베다니[a]에서 일어났는데, 거기서 요한이 세례를 베풀고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 몇몇 사본과 이후 번역 전통은 '베다바라'(Βηθαβαρᾷ)를 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: These things
  chosen_korean: 이 일들이
  alternatives_korean:
  - 이 일
  - 이것들
  lexicon: BDAG
  rationale: 원문 그리스어 ταῦτα는 복수 지시사로 앞선 사건들을 가리키므로 복수형 '이 일들이'로 옮겨 원문의 수(複數)를 보존했습니다.
- source_word: ἐν Βηθανίᾳ
  english_pob_choice: in Bethany
  chosen_korean: 베다니
  alternatives_korean:
  - 벧냐
  - 베다니아
  lexicon: SBLGNT / 지명 관습
  rationale: 현대 한국어 성경 전통에서 Βηθανίᾳ는 '베다니'로 널리 정착되어 있어 독자가 지명을 쉽게 식별하도록 이 표기를 사용했습니다.
- source_word: πέραν τοῦ Ἰορδάνου
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 강 건너편
  alternatives_korean:
  - 요단 강 건너
  - 요단 강 저편
  lexicon: BDAG
  rationale: πέραν + 속격은 화자 기준의 ‘저편/건너편’ 위치를 나타내므로 한국어로는 '요단 강 건너편'이 자연스럽고 의미를 충실히 전달합니다.
- source_word: βαπτίζων
  english_pob_choice: was baptizing
  chosen_korean: 세례를 베풀고 있었습니다
  alternatives_korean:
  - 세례를 주고 있었습니다
  - 침수하고 있었습니다
  lexicon: BDAG
  rationale: ἐν + 현재 분사(ἦν βαπτίζων)의 진행적 의미를 살려 '세례를 베풀고 있었습니다'로 옮겼고, 한국 교회어휘와 일치하도록 '세례'를 사용했습니다.
theological_decisions:
- issue: Place-name reading Βηθανίᾳ ('Bethany') versus Βηθαβαρᾷ ('Bethabara')
  chosen_reading: Bethany (Βηθανίᾳ)
  alternative_readings:
  - Bethabara (Βηθαβαρᾷ)
  rationale: SBLGNT 기준 본문은 Βηθανίᾳ를 채택하고 있으므로 본문 번역도 이를 따랐습니다. 다만 후대 사본 전통에서 Βηθαβαρᾷ 읽기가 알려져 있어 이를 각주로 보존합니다.
  doctrine_reference: '번역 원칙: 원문 우선성과 교정본 따름; 사본 전통의 대안은 각주로 표기'
