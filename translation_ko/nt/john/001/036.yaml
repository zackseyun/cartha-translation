id: JHN.1.36
reference: John 1:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: ko
  text: 그는 예수님이 걸어가시는 것을 바라보며 말합니다. 「보라, 하나님의 어린양이십니다!」
  philosophy: formal
lexical_decisions:
- source_word: ἰδε (Ἴδε)
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 보세요
  lexicon: 'SBLGNT: ἰδε'
  rationale: ἰδε는 즉각적인 주목을 요구하는 감탄사입니다. '보라'는 고전적이지만 그 즉시적·명령적 어조를 보존하면서 본문에 가까운 전달을 합니다. '보십시오/보세요'는 현대적 공손어이나 그 즉각적 명령성을 약화시킵니다.
- source_word: ἀμνὸς τοῦ θεοῦ
  english_pob_choice: the Lamb of God
  chosen_korean: 하나님의 어린양
  alternatives_korean:
  - 하나님의 양
  - 야훼의 어린양
  lexicon: 'SBLGNT: ἀμνός + θεός'
  rationale: 직역 '하나님의 어린양'은 유대/제사적 이미지(희생·구속)를 충실히 전달합니다. θεός은 POB 표준에 따라 '하나님'으로 옮겼습니다; 여기서 야훼를 직접 인용하는 문맥은 아니므로 '야훼' 표기는 사용하지 않았습니다.
- source_word: ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει
  english_pob_choice: And looking at Jesus as he was walking, he says
  chosen_korean: 예수님이 걸어가시는 것을 바라보며 말합니다
  alternatives_korean:
  - 예수님을 바라보며 말합니다
  - 그가 예수님을 보고 말합니다
  lexicon: 'SBLGNT: ἐμβλέψας, περιπατοῦντι, λέγει'
  rationale: 원문은 분사(ἐμβλέψας, περιπατοῦντι)로 예수의 '걷는' 모습을 주목하는 동작을 묘사합니다. '바라보며'는 ἐμβλέψας의 지속적·집중적 시선을 살리고, '걸어가시는'으로 예수에 대한 경의(보통 예수에 대한 경칭은 본문 밖 규정에 따라 선택)를 반영하여 본문의 시간·관계를 보존합니다.
theological_decisions:
- issue: Referent form for Jesus and verbal honorifics in narrative
  chosen_reading: 예수님 (honorific) + 걸어가시는 (honorific verb form)
  alternative_readings:
  - 예수 (neutral)
  - 예수 그리스도 / 주 예수 (title-form)
  rationale: POB 한국어 지침은 현대 표준 한국어의 정중한 서술을 권장합니다. 본문은 예수의 인물 표지를 상정하므로 '예수님'과 경의법을 사용해 독자가 원문이 의도한 존중과 신앙적 맥락을 인식하도록 했습니다. 이는 원문의 신적·인간적 맥락을 해치지 않으면서 한국어 독자에게 자연스럽습니다.
  doctrine_reference: 'POB glossary: treatment of κύριος/Jesus; Korean target style guidance'
