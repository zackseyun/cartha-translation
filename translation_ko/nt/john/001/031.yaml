id: JHN.1.31
reference: John 1:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
  footnotes:
  - marker: a
    text: Or 'I did not recognize him.' The Greek can refer either to lack of acquaintance or lack of recognition; the main text preserves the broader wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 그를 알지 못했습니다[a], 그러나 이 때문에 저는 물 가운데서 세례를 베풀러 왔습니다 — 그가 이스라엘에게 드러나도록 하기 위함이었습니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '알아보지 못했습니다'. 그리스어는 개인적 친분의 부재나 인식의 실패 모두를 가리킬 수 있으므로 본문은 더 넓은 의미의 '알지 못함'을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  english_pob_choice: And I
  chosen_korean: 저는
  alternatives_korean:
  - 나는
  - 나도
  lexicon: BDAG
  rationale: κἀγὼ(καί + ἐγώ)는 앞부분 증언과의 연속성과 약한 강조를 가진다. 현대 한국어 공적 서술에서는 '저는'이 정중하고 자연스러워 의미와 담화적 강조를 보존한다.
- source_word: οὐκ ᾔδειν
  english_pob_choice: did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알아보지 못했습니다
  - 알지 못했습니다(알지 못하고 있었습니다)
  lexicon: BDAG
  rationale: 그리스어 불완료형 οἶδα는 과거의 '알지 못함' 상태를 전달한다. 한국어에서는 '알지 못했습니다'가 가장 직접적이며, '알아보지 못했습니다'는 해석적 가능성을 제시하므로 각주로 남긴다.
- source_word: ἐν ὕδατι
  english_pob_choice: in water
  chosen_korean: 물 가운데서
  alternatives_korean:
  - 물로
  - 물 안에서
  lexicon: BDAG
  rationale: ἐν + 여격의 공간적 사용을 살려 '물 가운데서'로 번역했다. '물로'는 수단·도구적 뉘앙스를 줄 수 있으므로 원문 어순과 공간적 표현을 우선했다.
- source_word: βαπτίζων
  english_pob_choice: baptizing
  chosen_korean: 세례를 베풀러
  alternatives_korean:
  - 세례하며
  - 침수시키며
  lexicon: BDAG
  rationale: 현재분사적 배경을 한국어로 자연스럽게 전달하기 위해 '세례를 베풀러 왔습니다' 형태를 택했다. '세례'는 POB 용어 집합의 관례에 따랐고, 과도한 의례적 용어 변경은 피했다.
- source_word: τῷ Ἰσραὴλ
  english_pob_choice: to Israel
  chosen_korean: 이스라엘에게
  alternatives_korean:
  - 이스라엘 가운데서
  - 이스라엘에게(백성에게)
  lexicon: BDAG
  rationale: 수동적 'φανερωθῇ'의 수혜자를 나타내는 여격을 한국어로는 '에게'로 자연스럽게 전달한다. 집단적 언급임을 흐리지 않도록 간결한 표현을 선택했다.
theological_decisions:
- issue: Meaning of John's statement that he did not know Jesus
  chosen_reading: 본문은 이전의 '알지 못함'을 단순한 과거 상태로 번역하여, 개인적 친분의 부재인지 메시아로서의 인식 실패인지 특정하지 않고 신학적 긴장을 보존합니다.
  alternative_readings:
  - 그를 알아보지 못했습니다(인식의 실패).
  - 그를 메시아로 알지 못했습니다(메시아 인식의 부재).
  rationale: 구절 자체는 '알지 못했다'라는 넓은 표현에 머문다. 본문을 과도하게 조정해 화해시키지 않고 원문이 남긴 불확정성을 유지하는 것이 POB의 원칙과 일치합니다.
  doctrine_reference: 원문 텐션 보존—해석적 과잉 금지
