id: JHN.1.21
reference: John 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
  footnotes:
  - marker: a
    text: Or, “that Prophet,” likely referring to the expected prophet like Moses (Deut 18:15, 18).
    reason: alternative_reading
  - marker: b
    text: Greek has the historical present, “he says,” a vivid narrative style.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 물었습니다. 「그러면 당신은 엘리야입니까?」 그리고 그는 말합니다[b], 「아닙니다.」 「당신은 그 선지자[a]이십니까?」 하고 그는 대답했습니다. 「아니요.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문에 관사가 있어 특정 기대된 인물을 가리키는 것으로 보입니다; 이는 신명기 18장의 모세와 같은 예언자(신 18:15,18)를 염두에 둔 표현일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 역사적 현재(λέγει)를 사용합니다; 현대 한국어 번역에서는 본문적 생생함을 살리기 위해 현재형 '말합니다'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  english_pob_choice: asked
  chosen_korean: 물었습니다
  alternatives_korean:
  - 물어보았습니다
  - 질문했습니다
  lexicon: BDAG
  rationale: 그리스어 aorist ἐρωτάω는 직접적 질문을 도입하므로 간결한 과거형 '물었습니다'가 내러티브에 자연스럽습니다.
- source_word: Τί οὖν;
  english_pob_choice: What then?
  chosen_korean: 그러면
  alternatives_korean:
  - 그렇다면
  - 그러면 어떻게 되겠습니까
  lexicon: BDAG
  rationale: 짧은 추적 질문으로 앞의 부정들을 전제로 하므로 한국어에서도 간결한 연결어 '그러면'로 이어짐을 살렸습니다.
- source_word: Ἠλίας
  english_pob_choice: Are you Elijah?
  chosen_korean: 엘리야
  alternatives_korean:
  - 엘리아스
  - 엘리야(히브리어)
  lexicon: BDAG
  rationale: 성경 한국어 관행에 따라 '엘리야'로 음역했습니다(일반적으로 사용되는 표기).
- source_word: Οὐκ εἰμί
  english_pob_choice: I am not
  chosen_korean: 아닙니다
  alternatives_korean:
  - 나는 아닙니다
  - 저는 아닙니다
  lexicon: BDAG
  rationale: 부정된 계사만 있는 그리스어의 간결하고 강조된 표현을 한국어의 짧은 부정문 '아닙니다'로 그대로 살렸습니다.
- source_word: Ὁ προφήτης
  english_pob_choice: the Prophet
  chosen_korean: 그 선지자
  alternatives_korean:
  - 그 예언자
  - 그 예언자(모세 같은 예언자)
  lexicon: BDAG
  rationale: 정관사는 특정 기대된 인물을 가리키므로 본문에서는 '그 선지자'로 명시해 원문이 남기는 신학적 긴장을 보존했습니다.
- source_word: λέγει
  english_pob_choice: he says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말한다
  - 말하였다
  lexicon: BDAG
  rationale: 요한복음의 역사적 현재를 반영해 본문에 생생함을 주기 위해 현재형 '말합니다'로 옮겼습니다(각주[b] 참조).
theological_decisions:
- issue: Identity of 'the Prophet'
  chosen_reading: 본문에 '그 선지자'로 보존하여 지칭 대상을 번역에서 규정하지 않음
  alternative_readings:
  - 신명기 18장에 예고된 모세와 같은 '그 예언자'를 명시적으로 가리킴으로 번역
  - 일반적인 예언자(특정 인물 아님)로 번역
  rationale: 그리스어의 정관사는 특정 기대된 인물을 가리키지만 본문 자체가 그 인물의 정확한 정체를 밝히지 않으므로 번역에서 판단을 유보하고 원문이 제기하는 신학적 긴장을 유지합니다.
  doctrine_reference: 번역은 본문이 의도하는 신학적 긴장을 보존해야 함
- issue: John's denial regarding Elijah
  chosen_reading: 존의 단순 부정으로 '아닙니다'를 그대로 번역함
  alternative_readings:
  - 직접적인 문자적 부정('나는 엘리야가 아니다')으로 확장
  - 다른 복음서들과 조화시키며 '영적으로 엘리야가 아니다' 등으로 해석
  rationale: 본문은 명확한 단정형 부정을 제시하므로 해석적 조정 없이 평이하게 '아닙니다'로 옮겨 원문 의도를 그대로 드러내는 편이 적절합니다.
  doctrine_reference: 본문의 직접 진술을 본문 번역에서 보존, 화해적인 해석은 주석에서 다룸
