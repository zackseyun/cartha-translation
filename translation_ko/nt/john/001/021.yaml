- from: 그들이 그에게 물었습니다. 「그러면 당신은 엘리야입니까?」 그리고 그는 말합니다[b], 「아닙니다.」 「당신은 그 선지자[a]이십니까?」 하고 그는 대답했습니다. 「아니요.」
  to: 그들이 그에게 물었습니다. “그러면 당신은 엘리야입니까?” 그가 말합니다[b], “아닙니다.” “당신은 그 예언자[a]이십니까?” 하고 그는 대답했습니다. “아니요.”
  rationale: 직접 인용의 문장부호를 현대 한국어 용법에 맞게 수정하여 역사적 현재와 인용 내용의 연결을 명확히 했습니다. 또한 현대적 표준어에 맞춰 '선지자'를 '예언자'로 조정했습니다. 엘리야에 대한 부정과 '그 예언자'의 지시 대상에 관한 원문의 긴장은 해석적으로 해소하거나 보충하지 않았습니다.
