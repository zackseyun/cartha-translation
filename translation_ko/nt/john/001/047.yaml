id: JHN.1.47
reference: John 1:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: ko
  text: 예수께서 나다나엘이 자신에게 다가오는 것을 보시고 그에 대하여 말씀하시되, “보십시오, 참으로 속임이 없는 이스라엘 사람입니다.”
  philosophy: formal
lexical_decisions:
- source_word: Ἰησοῦς
  english_pob_choice: Jesus
  chosen_korean: 예수께서
  alternatives_korean:
  - 예수
  - 예수님
  - 예수님께서
  lexicon: Ἰησοῦς
  rationale: 서사적 맥락에서 화자(예수)를 공경하는 현대 한국어 관습에 따라 주격 존칭 '-께서'를 사용했습니다. 이는 POB의 현대·정중한 문체 지침과 일치합니다.
- source_word: Ναθαναὴλ
  english_pob_choice: Nathanael
  chosen_korean: 나다나엘
  alternatives_korean:
  - 나다나엘(전통 표기)
  - 나타나엘
  lexicon: Ναθαναὴλ
  rationale: 한국 성경 전통에서 널리 쓰이는 전통 음역 '나다나엘'을 채택했습니다.
- source_word: Ἴδε
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 보시오
  lexicon: Ἴδε
  rationale: POB 영어판의 'Look'을 반영하여 명령형의 즉시적 호소를 현대적·정중한 어투로 옮겼습니다. 직역적 전통어 '보라' 대신 합쇼체 문체에 맞춘 선택입니다.
- source_word: Ἰσραηλίτης / ἐν ᾧ δόλος οὐκ ἔστιν
  english_pob_choice: an Israelite in whom there is no deceit
  chosen_korean: 속임이 없는 이스라엘 사람
  alternatives_korean:
  - 간계가 없는 이스라엘 사람
  - 거짓이 없는 이스라엘 사람
  - 속임수가 없는 이스라엘 사람
  lexicon: Ἰσραηλίτης; δόλος
  rationale: Ἰσραηλίτης는 친숙한 '이스라엘 사람'으로, δόλος는 '속임'으로 번역해 'deceit'의 범위를 포괄하면서 지나치게 고어적이지 않게 표현했습니다.
- source_word: ἐρχόμενον πρὸς αὐτὸν
  english_pob_choice: coming toward him
  chosen_korean: 자신에게 다가오는 것을
  alternatives_korean:
  - 그에게 다가오는
  - 그에게 오는
  lexicon: ἐρχόμενον
  rationale: 그리스어의 분사(ἐρχόμενον)를 한국어에서는 명사절('…것')로 옮겨 문법상 자연스럽게 연결했습니다.
theological_decisions:
- issue: 명령형 Ἴδε의 어법(보라 vs. 보십시오)과 격식 수준
  chosen_reading: 보십시오 (현대 정중체)
  alternative_readings:
  - 보라 (전통적인 성경 어투)
  - 보아라 / 보시오 (다른 문체 대안)
  rationale: 영어 POB의 'Look' 복원을 따르되, 프로젝트의 표준인 현대·정중체를 유지하기 위해 '보십시오'를 선택했습니다. 본 구절의 즉시적 호소성을 보존하면서도 전체 텍스트의 문체 일관성을 우선했습니다.
  doctrine_reference: 문체·번역 원칙(현대 정중체 우선)
- issue: 예수 호칭의 겸손성/존칭 처리
  chosen_reading: 예수께서
  alternative_readings:
  - 예수
  - 예수님
  - 예수님께서
  rationale: 서술부에서 인물(특히 예수)을 존중하는 한국어 관습을 반영해 존칭 주격형을 사용했습니다. 신학적 해석을 추가하지 않는 형태적 선택입니다.
  doctrine_reference: POB 번역 가이드라인(서사적 존칭)
