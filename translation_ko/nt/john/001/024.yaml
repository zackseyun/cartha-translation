id: JHN.1.24
reference: John 1:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
  footnotes:
  - marker: a
    text: Or "they were sent by the Pharisees." The Greek more literally indicates that they were from the Pharisees.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 바리새인들로부터 보내졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바리새인들이 보냈다”라고 번역할 수 있습니다. 그러나 그리스어 ἐκ는 문자적으로 출처·기원(‘~로부터’)을 나타내므로 본문은 바리새인 출신임을 보다 직접적으로 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 그리고
  - 그때
  - 이에
  lexicon: BDAG
  rationale: 그리스어 연결사 Καὶ는 단순한 접속사로 이야기 흐름을 이어 주므로 한국어에서는 평이한 '그리고'로 처리해 서술의 연속성을 보전합니다.
- source_word: ἀπεσταλμένοι ἦσαν
  english_pob_choice: they had been sent
  chosen_korean: 보내졌습니다
  alternatives_korean:
  - 파송되었습니다
  - 보냄을 받았습니다
  lexicon: BDAG
  rationale: 완료 분사 + ἦσαν의 구조는 ‘보내진 결과 상태’를 드러내므로 한국어에서는 결과적 상태를 담는 수동형 '보내졌습니다'로 표현했습니다. '파송되었습니다'도 가능하지만 다소 관료적 어감이 있습니다.
- source_word: ἐκ
  english_pob_choice: from
  chosen_korean: 로부터
  alternatives_korean:
  - 에게서
  - 에서
  lexicon: BDAG
  rationale: ἐκ은 출처·기원을 표시하므로 한국어에서는 출처를 분명히 하는 '로부터'를 선택해 '발신 출처' 의미를 살립니다. '에 의해서'처럼 과도한 행위 주체를 추가하지 않습니다.
- source_word: τῶν Φαρισαίων
  english_pob_choice: the Pharisees
  chosen_korean: 바리새인들
  alternatives_korean:
  - 바리새인
  - 바리새파
  lexicon: BDAG
  rationale: 그룹 명칭 Φαρισαῖοι의 표준 한국어 표기는 '바리새인'이며, 문맥상 복수·집단을 드러내기 위해 '바리새인들'로 표기했습니다.
theological_decisions:
- issue: Relationship of the delegation to the Pharisees
  chosen_reading: 그 사람들은 바리새인 출신으로 보내진 사람들이었고, 여기서 ἐκ는 출처·기원을 표시합니다.
  alternative_readings:
  - 그 사람들이 바리새인들에 의해 파송되었다(=강한 행위자 강조).
  rationale: 원문 그리스어는 ἐκ + 생격을 사용하여 기원(출처)을 더 직접적으로 표지합니다. 따라서 번역은 바리새인들의 '출신/발신'을 강조하되 문맥이 행위주(sender)를 암시할 수 있음을 허용합니다.
  doctrine_reference: Translation philosophy §1, §3
