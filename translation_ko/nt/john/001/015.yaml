id: JHN.1.15
reference: John 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
  footnotes:
  - marker: a
    text: Or, “has taken precedence over me” / “has surpassed me” for “has become before me.” The Greek can express priority or rank as well as sequence.
    reason: lexical_alternative
  - marker: b
    text: Or, “he existed before me.” The wording 'he was before me' preserves the Greek more closely while still allowing the implication of preexistence in context.
    reason: alternative_reading
translation:
  language: ko
  text: 요한은 그분에 대하여 증언하며 이렇게 외쳐 말해 왔습니다. “이분은 내가 말했던 바로 그분이셨습니다. ‘내 뒤에 오시는 분이 나보다 앞서게 되셨습니다[a]. 이는 그분이 나보다 먼저 계셨기 때문입니다[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나보다 우위에 서게 되셨다’ 또는 ‘나를 능가하게 되셨다’로 번역할 수 있습니다. 그리스어는 시간적 순서뿐 아니라 우위나 선행의 의미도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분이 나보다 먼저 존재하셨다’로 번역할 수 있습니다. ‘나보다 먼저 계셨습니다’는 문맥상 전존을 뜻할 수 있으나, 원문은 이를 ‘존재하다’라는 말로 명시하지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  english_pob_choice: testifies
  chosen_korean: 증언하며
  alternatives_korean:
  - 증거하며
  - 증언합니다
  lexicon: BDAG
  rationale: μαρτυρεῖ의 법정적·목격자 의미를 살려 '증언하다'로 번역했습니다. 현재 시제의 지속적·현장감(‘진술하고 있다’)을 살리기 위해 분사적 연결(‘증언하며’)을 사용하고, 정중체 문맥에 맞추어 본문 전체는 과거형 '말했습니다'로 처리했습니다.
- source_word: κέκραγεν
  english_pob_choice: has cried out
  chosen_korean: 외쳐 말했습니다
  alternatives_korean:
  - 큰 소리로 외쳤습니다
  - 큰소리로 외쳐 말했습니다
  lexicon: BDAG
  rationale: 완료의 지속적 효과를 한국어에서 자연하게 옮기기 위해 '외쳐 말했습니다'로 처리했습니다. '외쳐'가 참여사적 느낌을, '말했습니다'가 완결된 발화 행위를 전달합니다.
- source_word: ἔμπροσθέν μου γέγονεν
  english_pob_choice: has become before me
  chosen_korean: 내 앞에 있게 되었습니다
  alternatives_korean:
  - 내 앞에 있게 되었다
  - 내 앞에 놓이게 되었습니다
  - 나보다 앞서게 되었습니다
  lexicon: BDAG
  rationale: γέγονεν의 완료적 성격과 ἔμπροσθεν의 공간·우위 의미를 보수적으로 살려 '내 앞에 있게 되었습니다'로 옮겼습니다. 지나치게 해석적인 '능가하였다/우선하였다' 같은 번역은 피했습니다. 본문에는 동일한 의미범위의 다른 번역 가능성이 있음을 주석[a]로 남겼습니다.
- source_word: πρῶτός μου ἦν
  english_pob_choice: he was before me
  chosen_korean: 그가 나보다 먼저 계셨습니다
  alternatives_korean:
  - 그가 나보다 먼저 존재하셨습니다
  - 그가 나보다 앞서 있었습니다
  lexicon: BDAG
  rationale: πρῶτός의 '먼저/우선' 의미를 한국어의 시간·위계 표현으로 담기 위해 '나보다 먼저 계셨습니다'로 번역했습니다. 본구절은 전통적 기독론적 '전존(前存)' 함의를 시사하나, 원문 문체를 존중하여 과도한 신학적 해설을 본문에 추가하지 않았습니다(주석[b] 참고).
theological_decisions:
- issue: 'Final clause and Christ''s preexistence: how explicitly to render ''πρῶτός μου ἦν''.'
  chosen_reading: 『그가 나보다 먼저 계셨습니다』로 번역하여 원문의 비교·우선성 주장(‘먼저 있음’)을 그대로 살리고, 교리적 해설은 추가하지 않았습니다.
  alternative_readings:
  - 『그가 나보다 먼저 존재했습니다』(더 직접적 '존재' 어휘를 사용해 전존을 명시)
  - 더 중립적으로『먼저 있었다』(덜 경건한 어휘)
  rationale: 요한복음의 문맥은 아들이의 우선성과 전존을 암시하지만, 번역은 원문 문체와 어휘 범위를 넘지 않도록 합니다. 따라서 '먼저 계셨습니다'처럼 원문 비교어를 살리되, 존재론적 해석은 독자가 문맥 전체에서 판단하도록 남겨두었습니다.
  doctrine_reference: '원문은 전통적 기독론(예: 니케아 신조)과 호응하나, 번역은 본문 충실성을 우선시하여 신학적 결론을 본문에 강제하지 않습니다.'
