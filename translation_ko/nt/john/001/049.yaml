id: JHN.1.49
reference: John 1:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: ko
  text: 나다나엘이 그에게 대답하였습니다. 「랍비[a], 당신은 하나님의 아들이십니다[b]; 당신은 이스라엘의 왕이십니다。」
  philosophy: formal
  footnotes:
  - marker: a
    text: '''랍비''는 히브리/아람어 רַבִּי의 음역어입니다. 1세기 유대적 호칭을 드러내기 위해 음역을 유지했습니다 (대안: ''선생님'').'
    reason: lexical_alternative
  - marker: b
    text: 그리스어 관사와 문맥상 메시아적·그리스도론적 함의를 반영하여 '하나님의 아들'을 정관적 타이틀로 번역했습니다.
    reason: theological_note
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하였습니다
  alternatives_korean:
  - 응답하였습니다
  - 말하였습니다
  lexicon: BDAG/Greek grammar
  rationale: 대화 서술에서 ἀπεκρίθη의 통상적 서술형을 현대 한국어 합쇼체로 옮겼습니다. '대답하였습니다'가 문맥상 자연스럽고 원문의 담담한 서술을 보존합니다.
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 랍비
  alternatives_korean:
  - 선생님
  - 라우비(음역 변형)
  lexicon: BDAG/Aramaic רַבִּי
  rationale: 원어의 1세기 유대적 호칭을 보존하기 위해 음역 '랍비'를 사용했습니다. 이는 문화적·종교적 맥락을 드러내므로 단순한 '선생님' 번역보다 원문 정보를 전달합니다.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  english_pob_choice: the Son of God
  chosen_korean: 하나님의 아들
  alternatives_korean:
  - 하나님의 아들 되신 분
  - 하나님의 아들(비관사)
  lexicon: BDAG
  rationale: 그리스어의 관사적 표지를 반영하여 정관적 타이틀로 번역했습니다. 요한복음 내에서의 메시아적·그리스도론적 함의를 약화하지 않기 위해 '하나님의 아들'의 타이틀성을 유지합니다.
- source_word: βασιλεὺς ... τοῦ Ἰσραήλ
  english_pob_choice: King of Israel
  chosen_korean: 이스라엘의 왕
  alternatives_korean:
  - 이스라엘의 군주
  - 이스라엘의 통치자
  lexicon: BDAG
  rationale: 직역적 어휘 선택으로 '왕'을 택해 원문의 왕적·메시아적 칭호를 드러냈습니다. 소유격 '…의'는 원문 소유관계를 그대로 전달합니다.
theological_decisions:
- issue: Christological force of Nathanael's confession 'the Son of God'
  chosen_reading: '원문이 제시하는 정관적·타이틀적 의미를 그대로 유지: ''하나님의 아들'''
  alternative_readings:
  - 한 명(비특정)의 하나님의 아들
  - 하나님의 아들(칭호성을 약화)
  rationale: 요한 복음에서 해당 어구는 강한 메시아적·그리스도론적 함의를 지니므로 번역에서 타이틀로 유지하여 신학적 긴장을 지웁니다.
  doctrine_reference: Affirmations; Preserve theological tension rather than resolve it
- issue: Royal-messianic sense of 'King of Israel'
  chosen_reading: '원문이 드러내는 명확한 왕적 칭호로 번역: ''이스라엘의 왕'''
  alternative_readings:
  - 이스라엘 위의 왕(해석적 확장)
  - 이스라엘의 통치자(완곡 표현)
  rationale: '''이스라엘의 왕''은 독자에게 메시아적 기대를 직접 환기하므로 불필요한 완곡화를 피하고 원문 의미를 보존합니다.'
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
