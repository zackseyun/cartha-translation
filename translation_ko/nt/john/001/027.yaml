lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  english_pob_choice: the one coming after me
  chosen_korean: 제 뒤에 오시는 분
  alternatives_korean:
  - 나 뒤에 오시는 이
  - 내 뒤에 오시는 이
  lexicon: BDAG
  rationale: 그리스어 관사화된 현재 분사는 사람을 지시하는 명사적 기능을 합니다. '제 뒤에 오시는 분'은 분사의 계속적·현재적 성격을 살리고, ὀπίσω μου의 계승·시간적 의미(단순 공간적 '뒤에 있음'이 아님)를 자연스러운 한국어로 전달합니다.
- source_word: οὐκ εἰμὶ ἄξιος
  english_pob_choice: I am not worthy
  chosen_korean: 저는 … 자격이 없습니다
  alternatives_korean:
  - 저는 합당하지 않습니다
  - 저는 받을 자격이 없습니다
  lexicon: BDAG
  rationale: ἄξιος는 '가치·자격'을 뜻하는 어휘입니다. '자격이 없습니다'는 원문의 겸손 표현을 과도하게 신학화하지 않으면서 한국어로 겸허함을 전달합니다.
- source_word: ἱμάντα τοῦ ὑποδήματος
  english_pob_choice: sandal strap
  chosen_korean: 신발끈
  alternatives_korean:
  - 샌들 끈
  - 신발 띠
  lexicon: BDAG
  rationale: ἱμάς은 끈·끈끈한 띠를, ὑπόδημα는 신발·샌달을 가리킵니다. 한국어에서 '신발끈'은 원래 의미(신발을 묶는 끈 또는 끈 같은 장치)를 명확히 전달하므로 자연스럽고 정확합니다.
theological_decisions:
- issue: Relation of 'after me' to the coming one
  chosen_reading: 시간적·계승적 의미로 '제 뒤에 오시는'로 번역
  alternative_readings:
  - 순수한 공간적 '내 뒤에 서 있는/오는'
  rationale: 요한복음 맥락에서 말하는 'ὀπίσω μου'는 사역상의 계승·후속성을 암시합니다. 본 구절 자체는 그 신학적 주장(우월성 등)을 확대하지 않고도 계승적 의미를 전달하는 것이 적절하므로 '제 뒤에 오시는'으로 표기하여 원문의 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
