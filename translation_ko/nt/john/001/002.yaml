id: JHN.1.2
reference: John 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
  footnotes:
  - marker: a
    text: Or 'This one was in the beginning with God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 태초에 하나님과 함께 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이 분은 태초에 하나님과 함께 있었습니다.' — οὗτος의 지시적 강조를 직역적으로 반영하는 대안 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  english_pob_choice: He
  chosen_korean: 그는
  alternatives_korean:
  - 이 분은
  - 이 사람은
  - 이것은
  lexicon: BDAG
  rationale: οὗτος는 문맥상 1절의 λόγος를 지시하는 지시대명사입니다. 영어 POB가 'He'로 인격적 지시를 살린 것과 마찬가지로, 한국어에서는 '그는'이 자연스럽고 원문의 인칭·지시성을 해치지 않습니다. '이 분은/이 사람은'도 가능하지만 보다 관점이 가까워지거나 현대적 느낌을 주므로 본문 연속성에 비해 어색할 수 있습니다. '이것은'은 무생격 지시로 인격성을 약화시키므로 배제했습니다.
- source_word: ἦν
  english_pob_choice: was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 계셨습니다
  - 존재했습니다
  lexicon: BDAG
  rationale: ἦν(εἰμί의 불완료형)은 지속적 상태를 나타냅니다. 한국어 공시법으로는 '있었습니다'가 가장 직역적이고 중립적인 전달입니다. '계셨습니다'는 경어적 뉘앙스를 포함하여 피지시체의 신성을 암시할 수 있으므로, 신학적 과잉을 피하려고 중립형을 선택했습니다. '존재했습니다'는 '존재'라는 추상적 어휘로 문학적 공명을 약화할 수 있습니다.
- source_word: ἐν ἀρχῇ
  english_pob_choice: in the beginning
  chosen_korean: 태초에
  alternatives_korean:
  - 처음에
  - 시초에
  lexicon: BDAG
  rationale: ἐν ἀρχῇ는 창세기 1:1과의 문학적·신학적 호응을 불러일으킵니다. 한국어 전통 번역에서 이 구절을 번역할 때 '태초에'가 그 호응을 가장 강하게 보존하므로, 원문 의도를 살리기 위해 '태초에'를 선택했습니다. '처음에'도 가능하지만 창세기와의 직접적 연계성이 약해집니다.
- source_word: πρὸς
  english_pob_choice: with
  chosen_korean: 함께
  alternatives_korean:
  - 향하여
  - 면전에서
  - 곁에
  lexicon: BDAG
  rationale: 요한서신의 πρός + 대격은 인격적 관계·지향성을 나타냅니다. 한국어로는 '함께'가 거리와 관계성을 모두 담아 간결하면서도 원문의 대인(對人)적 뉘앙스를 살립니다. '향하여'는 방향성만, '면전에서'는 현존을 지나치게 현장화하는 어감이 있습니다.
- source_word: τὸν θεόν
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 그 하나님
  - 하나님께
  lexicon: BDAG
  rationale: 정관사를 포함한 τὸν θεόν은 특정한 신을 지시하나, 한국어 관습상 영어처럼 'the God'을 따로 표현하지 않고 '하나님'으로 옮기는 것이 자연스럽습니다. 본문은 신(하나님)과의 관계를 말하므로 '하나님'으로 번역했습니다.
theological_decisions:
- issue: Referent of οὗτος in relation to John 1:1
  chosen_reading: οὗτος는 1절의 λόγος(말씀)를 지시하며 인칭 대명사로 번역(그는)했습니다.
  alternative_readings:
  - 지시대명사를 문자적으로 '이것/이 분/이 사람'으로 옮기는 번역
  - 무명(무인칭)적 해석으로 고유명사화하지 않는 번역
  rationale: 원문 문맥(요한 서문)은 λόγος를 계속해서 전개하므로 οὗτος를 인격적 대명사로 읽는 것이 본문의 흐름을 유지합니다. 영어 POB도 'He'로 처리했으며, 한국어에서도 '그는'으로 인격성을 보존해 독자가 λόγος의 동일 대상을 계속 인식하도록 했습니다.
  doctrine_reference: Affirmations; Translation philosophy §§1,6
- issue: Force of πρὸς τὸν θεόν and relational language
  chosen_reading: πρὸς τὸν θεόν은 인격적 관계·병존을 뜻하므로 '하나님과 함께'로 번역했습니다.
  alternative_readings:
  - '''하나님을 향하여/쪽으로'' (향하고 있음)'
  - '''하나님 앞에/면전에서'' (공존의 현존성 강조)'
  rationale: 요한서 신학에서 πρός는 단순한 위치를 넘어 관계성을 드러냅니다. '함께'라는 한국어는 근접성과 관계성을 간결하게 전달하여 원문의 긴장(동일성과 구별성)을 유지합니다.
  doctrine_reference: Translation philosophy §3
- issue: Honorific language for the Word's existence
  chosen_reading: 서술 동사로서 중립적 서술 '있었습니다'를 사용했습니다; '계셨습니다'는 대안입니다.
  alternative_readings:
  - '''계셨습니다'' (경어·신성 표지)'
  - '''존재했습니다'' (철학적·존재론적 어감)'
  rationale: 본문은 λόγος의 신적 지위를 함축하지만, 번역에서 과도한 경어(계셨습니다)를 사용하면 원문이 암시하는 신성의 문제에 대해 추가적인 신학적 해석을 도입할 수 있습니다. 따라서 원문 의미를 충실히 전달하는 중립적 표현을 선택했습니다.
  doctrine_reference: Translation practice; stylistic balance
