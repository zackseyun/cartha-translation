id: JHN.1.42
reference: John 1:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
  footnotes:
  - marker: a
    text: Some manuscripts read 'Jonah' instead of 'John'; the SBLGNT text reads 'John.'
    reason: textual_variant
  - marker: b
    text: Cephas is the Semitic name corresponding to Peter, with the sense 'rock' or 'stone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그를 예수께 데려갔습니다. 예수께서 그를 똑바로 보시고 말씀하셨습니다. “당신은 시몬, 요한의 아들입니다[a]. 당신은 게바[b]라고 불릴 것입니다(이는 번역하면 베드로입니다).”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘요한’ 대신 ‘요나’를 읽습니다. SBLGNT 본문은 ‘요한’을 읽습니다.
    reason: textual_variant
  - marker: b
    text: ‘게바’(Κηφᾶς)는 ‘바위’ 또는 ‘돌’의 뜻을 지닌 셈어계 이름이며, 그리스어 이름 ‘베드로’(Πέτρος)에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  english_pob_choice: brought
  chosen_korean: 데려갔습니다
  alternatives_korean:
  - 인도했습니다
  - 데려왔습니다
  lexicon: BDAG
  rationale: Aorist ἄγω는 여기서 한 인물을 다른 사람(예수)에게 데려가는 완료된 행위를 나타냅니다. 한국어로는 자연스럽고 공적인 내러티브 톤에 맞게 '데려갔습니다'를 택했습니다.
- source_word: ἐμβλέψας αὐτῷ
  english_pob_choice: Looking at him
  chosen_korean: 똑바로 보시고
  alternatives_korean:
  - 응시하시고
  - 시선을 고정하시고
  lexicon: BDAG
  rationale: ἐμβλέψας는 단순한 흘깃봄 이상의 응시를 뜻합니다. 과도하게 번역하지 않으면서도 강조를 살리기 위해 '똑바로 보시고'를 선택했습니다.
- source_word: ὁ υἱὸς Ἰωάννου
  english_pob_choice: the son of John
  chosen_korean: 요한의 아들
  alternatives_korean:
  - 요나의 아들
  - 요한의 아들
  lexicon: BDAG
  rationale: SBLGNT 본문은 Ἰωάννου(요한)를 채택하므로 본문은 '요한의 아들'로 번역했습니다. 일부 사본은 '요나'(Jonah)를 전하는 전통이 있기 때문에 그 점은 각주(a)로 표기했습니다.
- source_word: Κηφᾶς
  english_pob_choice: Cephas
  chosen_korean: 케파
  alternatives_korean:
  - 게바
  - 케파스
  lexicon: BDAG
  rationale: Κηφᾶς는 세미틱 개인명입니다. POB 원칙에 따라 고유명사는 음역하되, 널리 알려진 그리스어 이름(Πέτρος)은 본문과 주석에서 함께 보이므로 본문에는 음역 '케파'를 사용했습니다.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  english_pob_choice: which is translated Peter
  chosen_korean: (이는 번역하면 베드로입니다)
  alternatives_korean:
  - (이는 베드로라 한다)
  - (뜻은 ‘바위’이다)
  lexicon: BDAG
  rationale: 그리스어 본문이 Κηφᾶς를 Πέτρος로 주석하므로 본문에서는 두 이름을 병기하고, 의미('바위')는 주석(각주 b)로 분리해 원문명의 기능을 보존했습니다.
theological_decisions:
- issue: Rendering of Κηφᾶς/Πέτρος
  chosen_reading: 본문에서는 두 이름을 모두 고유명사로 표기(케파 · 베드로)한다
  alternative_readings:
  - 동적 번역으로 '바위' 등 의미를 본문에 옮긴다
  - Πέτρος만 본문에 표기하고 Κηφᾶς는 각주로 처리한다
  rationale: 본문은 인물에게 새 이름을 부여하는 장면입니다. 이름의 기능을 그대로 살리는 것이 중요하므로 원문처럼 음역된 세미틱 이름(케파)과 그리스어 이름(베드로)을 병기하여 명명 행위의 텍스트적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; preserve theological tension rather than resolve it.'
- issue: Register for Jesus' direct speech to Simon
  chosen_reading: 예수의 직접 호칭은 원문 σὺ의 친밀하고 직접적인 호격을 반영하여 비존칭(평서형) 어조로 처리할 수 있다
  alternative_readings:
  - 본문 내내 합쇼체(존칭)를 유지한다
  rationale: 원문은 2인칭 단수 σὺ로 직접적이며 개인적인 호명입니다. POB의 스타일 규정에 따라 줄거리 내화자의 합쇼체와는 구별하여 예수의 직접 호명은 원문이 전달하는 친밀성을 해치지 않는 범위에서 직설적 표현을 허용했습니다。
  doctrine_reference: POB style notes on quoted speech register.
