  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'not from bloodlines.' The Greek has the plural 'bloods,' an unusual expression referring to natural descent or human parentage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 피들로부터 난 것이 아니며[a], 육체의 뜻에서 난 것도 아니고, 사람의 뜻에서 난 것도 아니며, 오직 하나님에게서 태어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 관용적으로 '혈통에서 난 것이 아니다.' 헬라어는 복수형 αἱμάτων를 사용하고 있는데, 이는 자연적 혈통·인간의 친자관계를 가리키는 이례적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  english_pob_choice: who
  chosen_korean: 그들은
  alternatives_korean:
  - 그들
  - …한 자들
  lexicon: BDAG
  rationale: οἳ는 앞 구절의 사람들을 가리키는 관계대명사입니다. 한국어에서 자연스럽고 명확한 연결을 위해 주어 역할을 하는 '그들은'을 선택하여 문맥적 연계성을 보존했습니다.
- source_word: ἐξ αἱμάτων
  english_pob_choice: from bloods
  chosen_korean: 피들로부터
  alternatives_korean:
  - 혈통으로부터
  - 피로부터
  - 혈통에서
  lexicon: BDAG
  rationale: 그리스어 αἱμάτων의 복수형 사용은 이례적이며 '혈통/가계로서의 출신'을 가리키는 관용적 표현으로 이해됩니다. 영어 POB의 논쟁을 반영하여 복수의 뉘앙스를 살리기 위해 직역적 표지인 '피들로부터'를 선택하고, 독자 친화적 대안은 각주로 제시했습니다.
- source_word: θελήματος
  english_pob_choice: will
  chosen_korean: 뜻
  alternatives_korean:
  - 욕망
  - 결정
  lexicon: BDAG
  rationale: θελήματος는 '의지/뜻'의 의미가 기본입니다. 여기서는 반복되는 구조('…의 뜻에서 난 것도 아니고')를 자연스럽게 살리기 위해 '뜻'을 사용했습니다.
- source_word: σαρκὸς
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 육체적 본성
  - 육
  lexicon: BDAG
  rationale: σάρξ는 폴라니즘적 맥락에서 '육체'로 번역되는 경우가 많습니다. 여기서는 인간의 생식적·육체적 출생을 가리키는 의미로 읽히므로, 한국어로도 '육체'가 원문 의도를 잘 전달합니다.
- source_word: ἀνδρὸς
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 사람의 뜻
  - 남편
  lexicon: BDAG
  rationale: ἀνήρ는 문자적으로 '남자/사람(성인 남성)'을 의미합니다. 문맥상 '육체의 뜻'과 대조되는 '인간(사람)의 의지'를 드러내는 것이 목적이어서, 국내 독자에게 부자연스럽지 않도록 성별 강조를 약하게 한 '사람'을 선택했습니다. 원문은 남성 단수의 대조를 포함하므로 대안으로 '남자'가 가능합니다.
- source_word: ἐκ θεοῦ
  english_pob_choice: from God
  chosen_korean: 하나님에게서
  alternatives_korean:
  - 하나님으로부터
  - 하나님에게로부터
  lexicon: BDAG
  rationale: ἐκ + 속격은 출처·기원을 표지합니다. 한국어에서 자연스럽고 포멀한 표현으로 '하나님에게서'를 선택하여 앞의 세 요소와 대조되는 신적 기원을 분명히 했습니다.
- source_word: ἐγεννήθησαν
  english_pob_choice: were born
  chosen_korean: 태어났습니다
  alternatives_korean:
  - 낳아졌습니다
  - 생겨났습니다
  lexicon: BDAG
  rationale: Aorist 수동의 의미(그들 '가 태어났다/낳아졌다')를 한국어 정중체로 자연스럽게 전달하기 위해 '태어났습니다'를 선택했습니다. '낳아졌다'는 직역적·신학적 용어로 남겨둘 수 있으나 현대 한국어 독자에게는 '태어났습니다'가 명확합니다.
theological_decisions:
- issue: 인간적 출신과 신적 출생 사이의 대비
  chosen_reading: 구절은 출생의 기원이 자연적인 혈통·육체적 의지·남성의 의지와 같은 인간적 근거에 있지 않고, 하나님에게서 온 신적 기원임을 말합니다.
  alternative_readings:
  - 본문은 단지 민족적 혈통(ethnicity)을 배제하는 데만 집중할 수 있다.
  - 후대 전통에서는 본문을 성례적·형이상학적 재생론으로 읽을 수 있다.
  rationale: 세 번의 부정(복수형 αἱμάτων; σαρκὸς의 뜻; ἀνδρὸς의 뜻)이 인간적 출생을 여러 각도에서 배제하고 신적 출생을 강조합니다. 번역은 이 대비를 보존하되 본문이 제시하는 신비(어떻게 '하나님에게서' 태어나는지)는 본문 자체가 해결하지 않으므로 교리적 결론을 덧붙이지 않았습니다.
  doctrine_reference: 본문의 대비(인간적 기원 대 신적 출생)를 보존; 교리적 긴장은 해소하지 않음.
