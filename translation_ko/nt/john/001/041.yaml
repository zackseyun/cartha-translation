lexical_decisions:
- source_word: εὑρίσκει
  english_pob_choice: found
  chosen_korean: 찾았습니다
  alternatives_korean:
  - 찾습니다
  - 만났습니다
  lexicon: BDAG
  rationale: 원문의 역사적 현재를 한국어 서술 문맥에서 자연스럽게 과거형(완료)로 바꾸어 사건의 완료와 현재적 결과를 전달합니다.
- source_word: ἀδελφὸν τὸν ἴδιον
  english_pob_choice: his own brother
  chosen_korean: 자기 형제
  alternatives_korean:
  - 그의 형제
  - 친형제
  lexicon: BDAG
  rationale: ἴδιον의 강조를 살려 단순한 소유대명사 '자기'를 사용해 '자기 형제'로 번역하여 소속·친밀성을 보존합니다.
- source_word: Μεσσίαν
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 기름부음 받은 자
  lexicon: BDAG
  rationale: 프로젝트 용어집과 판결에 따라 헤브라이어·유대적 칭호의 의미를 살려 '메시아'로 음역합니다(제목·칭호로서의 보전).
- source_word: χριστός (in parenthesis)
  english_pob_choice: Christ / Anointed One (discussion)
  chosen_korean: 그리스도
  alternatives_korean:
  - 메시아
  - 기름부음 받은 자
  lexicon: BDAG
  rationale: 괄호 안 원문은 헬라어 형태 χριστός을 직접 가리키므로, 독자가 익히 아는 헬라어-전통형 '그리스도'로 표기하여 원문의 표식성을 드러냅니다.
theological_decisions:
- issue: 메시아/그리스도 표기(원문 Μεσσίαν과 괄호의 χριστός 관계)
  chosen_reading: 주본문은 '메시아'로 표기하고 괄호는 헬라어 표기 대응어 '그리스도'로 제시
  alternative_readings:
  - 본문과 괄호 모두 '메시아'로 통일
  - 본문을 '메시아', 괄호를 '기름부음 받은 자(Anointed One)'로 설명
  rationale: 원문은 셈어적 칭호(Μεσσίαν)를 제시한 뒤 괄호로 헬라어 대응어 χριστός을 밝히고 있습니다. 본문에는 유대적 칭호인 '메시아'를 우선 보전하되, 괄호에는 원문 언어 표식을 독자가 인식할 수 있도록 전통적 헬라어-한국어 표기 '그리스도'를 둡니다. 이는 제목의 역사적·언어적 맥락을 투명하게 드러내려는 POB 원칙과 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names. Contested terms table: Χριστός → Messiah (where title; Christ where name-like).'
