  verdict: revise
  source_fidelity: 원문의 역사적 현재는 한국어 서사에서 과거형으로 자연스럽게 옮길 수 있습니다. 그러나 ‘찾아가서’는 εὑρίσκει에 없는 이동의 의미를 더하므로 삭제해야 합니다. 괄호의 μεθερμηνευόμενον χριστός는 메시아라는 명칭의 번역·대응 표현을 밝히므로, ‘헬라어로는’이라고 원문에 명시되지 않은 정보를 보태기보다 번역 관계를 직접 표현하는 편이 충실합니다.
  naturalness: ‘그는 먼저 자기 형제 시몬을 찾아 그에게 말했습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 행위 순서도 분명히 드러냅니다. 괄호는 인용문 안에서 ‘이는 번역하면 …라는 뜻입니다’로 처리하면 한국어 문장 흐름이 자연스럽습니다.
  terminology: Μεσσίας는 ‘메시아’로, χριστός는 원문의 번역 주석 기능을 살려 ‘그리스도’로 유지할 수 있습니다. 이는 고유한 칭호의 언어적 대응을 보여 주며, 본문의 메시아 표기를 보존합니다.
