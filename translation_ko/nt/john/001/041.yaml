  - severity: low
    issue: ‘헬라어로는’은 원문 괄호에 명시된 정보가 아닙니다.
    rationale: χριστός가 그리스어 단어인 것은 사실이지만, 본문은 단지 ‘번역하면 그리스도’라는 주석을 제공합니다. 번역문도 그 관계만 직접 표현하는 것이 더 절제되고 충실합니다.
