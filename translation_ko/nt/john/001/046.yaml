id: JHN.1.46
reference: John 1:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
  footnotes:
  - marker: a
    text: Or, more literally, “Can anything good be from Nazareth?”
    reason: lexical_alternative
translation:
  language: ko
  text: 나다나엘이 그에게 말했습니다. 「나사렛에서 무슨 좋은 것이 있을 수 있겠습니까?[a]」 빌립이 그에게 말했습니다. 「와서 보십시오。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘나사렛에서 선한 것이 있을 수 있겠는가?’(더 직역적으로는 ‘나사렛에서 선한 것이 있을 수 있겠는가?’)라고 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ Ναζαρὲτ
  english_pob_choice: from Nazareth
  chosen_korean: 나사렛에서
  alternatives_korean:
  - 나사렛 출신
  - 나사렛에서 난
  lexicon: BDAG
  rationale: ἐκ은 기원의 장소를 나타냅니다. 한국어에서는 자연스러운 표현으로 ‘…에서’ 형태(나사렛에서)를 사용하여 출신·출처의 의미를 살렸습니다.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  english_pob_choice: Can anything good come from Nazareth?
  chosen_korean: 무슨 좋은 것이 있을 수 있겠습니까?
  alternatives_korean:
  - 무엇이 나올 수 있겠습니까?
  - 무엇이 선할 수 있겠습니까?
  lexicon: BDAG
  rationale: δύναμαι의 가능성·능력을 묻는 수사적 질문을 보존하면서 현대 한국어의 자연스러운 의문문으로 옮겼습니다. ἀγαθὸν은 중성형으로 문맥상 '좋은/선한 것'을 의미하므로 '좋은'을 선택했습니다.
- source_word: Ἔρχου καὶ ἴδε
  english_pob_choice: Come and see
  chosen_korean: 와서 보십시오
  alternatives_korean:
  - 오십시오 그리고 보십시오
  - 와서 보아라
  lexicon: BDAG
  rationale: 현대 한국어의 정중한 명령·초대 표현인 '와서 보십시오'가 그리스어 현재 명령형의 초대적 어감을 유지합니다. 더 구어적인 '와서 보아라'보다 공적 번역register에 적합합니다.
- source_word: Ναθαναήλ / ὁ Φίλιππος
  english_pob_choice: Nathanael / Philip
  chosen_korean: 나다나엘 / 빌립
  alternatives_korean:
  - 나단아엘 / 필립포
  lexicon: 지명·인명 전통 표기
  rationale: 한국어 전통 성경 표기를 따랐습니다(나다나엘·빌립). 인명은 원형을 유지하는 것이 감사와 추적 가능성에 유리합니다.
theological_decisions:
- issue: 나다나엘의 나사렛에 대한 질문의 어조
  chosen_reading: 수사적 회의로 번역하되, 원문이 명시적으로 조롱·경멸을 표하지 않으므로 과도한 풍자나 완곡한 해석을 피함
  alternative_readings:
  - '강한 경멸·조소로 번역 (예: ''나사렛에서 무슨 쓸모 있는 것이 있겠어?'')'
  - 중립적 사실 확인의 질문으로 번역
  rationale: 그리스어는 회의적 어조를 함축하지만 명확한 경멸 표시를 담지 않습니다. 따라서 한국어도 수사적 의문을 유지하되 원문 이상의 평가를 부여하지 않았습니다.
  doctrine_reference: 원문 우선 원칙 — 저자의 독자 향한 이해를 훼손하지 않음
