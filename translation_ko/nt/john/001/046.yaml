  source_fidelity: 질문의 핵심은 ἐκ Ναζαρέτ가 나타내는 출처와 δύναται의 가능성, 그리고 τί ἀγαθόν의 수사적 부정 의문입니다. 초안의 ‘나사렛에서 무슨 좋은 것이 있을 수 있겠습니까?’는 한국어에서 나사렛이라는 장소 안에 좋은 것이 존재하는지를 묻는 뜻으로도 자연스럽게 읽혀, 출처·기원의 뉘앙스가 약해집니다. ‘나올 수 있겠습니까?’가 해당 의미를 더 정확하고 자연스럽게 전달합니다. 빌립의 초대는 충실합니다.
