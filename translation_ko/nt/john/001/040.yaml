id: JHN.1.40
reference: John 1:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
  footnotes:
  - marker: a
    text: Or, more literally, 'one of the two who heard from John and followed him.' The 'him' refers to Jesus in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 안드레[a]는 시몬 베드로의 형제로서, 요한에게서 들은 두 사람 중 한 사람이었고 그를 따라갔습니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 더 문자적으로 ‘요한에게서 들은 그리고 그를 따랐던 두 사람 중 한 사람’이라고 읽을 수 있습니다. 여기서 ‘그’는 본문 맥락(요한복음 1:35–39)에서 예수를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνδρέας
  english_pob_choice: Andrew
  chosen_korean: 안드레
  alternatives_korean:
  - 안드레아
  - 앤드류
  lexicon: NT onomastics / Korean biblical usage
  rationale: 한국어 성서 전승에서 안드레(안드레아보다 줄어든 형태)가 널리 쓰입니다. 고유명사는 관습적 전음으로 옮기되, 원문의 인명을 보존합니다.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  english_pob_choice: Simon Peter’s brother
  chosen_korean: 시몬 베드로의 형제
  alternatives_korean:
  - 베드로의 형제 시몬
  - 시몬의 형제(베드로)
  lexicon: BDAG
  rationale: ἀδελφός는 문자적 친족 '형제'입니다. 한국어에서는 소유격 표지를 사용해 '시몬 베드로의 형제'로 자연스럽게 전달합니다.
- source_word: τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ
  english_pob_choice: who had heard from John and followed him
  chosen_korean: 요한에게서 들은 … 두 사람 중 한 사람이며 그를 따라간
  alternatives_korean:
  - 요한에게서 들은 두 사람 중 한 사람
  - 요한의 말을 들은 그리고 그를 따랐던 두 사람 중 하나
  lexicon: BDAG
  rationale: 그리스어의 부정사는 선행 사건(먼저 들었다)이후의 행위(따랐다)를 함께 수식합니다. 한국어에서는 관계절로 풀어 자연스럽게 시간적 순서를 살리되, 그리스어가 남기는 인칭 대명사의 모호성을 그대로 ‘그’를 남겨 두었습니다.
theological_decisions:
- issue: Referent of αὐτῷ
  chosen_reading: '''그''는 맥락상 예수를 가리킨다'
  alternative_readings:
  - '''그''는 요한을 가리킬 수 있다'
  rationale: 요한복음 1:35–39의 문맥에서 두 제자들이 요한의 증언을 듣고 예수를 따라간 것으로 서술됩니다. 본문은 대명사를 명시하지 않으나, 문맥상 예수를 지시하는 것이 가장 자연스럽습니다. 본문에서 불필요하게 설명을 추가하지 않고 본래의 대명사 사용을 유지하되, 주석으로 독자가 쉽게 확인하도록 합니다.
  doctrine_reference: 본문 문학적 맥락 보존(John 1:35–39); 교리적 결론 추가 금지
