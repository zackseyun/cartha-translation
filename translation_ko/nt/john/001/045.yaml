  - severity: low
    issue: 인물 식별 구절이 문장 파편처럼 들림
    rationale: ‘예수, 요셉의 아들, 나사렛 출신입니다’보다 관계절을 사용하면 원문의 동일 인물 식별을 매끄럽게 전달합니다.
  revised_text: 빌립은 나다나엘을 찾아 그에게[a] 말했습니다. “우리는 모세가 율법에서 그에 관하여 기록하고 선지자들도 기록한 분을 찾았습니다. 요셉의 아들이며 나사렛 출신인 예수입니다.”
