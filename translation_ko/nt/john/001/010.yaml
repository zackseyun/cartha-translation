id: JHN.1.10
reference: John 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
  footnotes:
  - marker: a
    text: Or 'was made through him.' The Greek verb means 'came to be' or 'came into existence.'
    reason: lexical_alternative
  - marker: b
    text: '''Did not know him'' can also imply ''did not recognize him'' or ''did not acknowledge him.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 세상에 있었습니다. 세상은 그를 통하여 생겨났고[a], 세상은 그를 알지 못했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「지어졌습니다」로 번역할 수 있습니다. 그리스어 동사(γίνομαι)는 「생겨나다」 또는 「존재하게 되다」라는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 「그를 알지 못했습니다」는 문맥상 「그를 알아보지 못했습니다」 또는 「그를 인정하지 않았습니다」라는 뜻으로 읽을 여지도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  english_pob_choice: world
  chosen_korean: 세상
  alternatives_korean:
  - 피조물
  - 인류
  lexicon: BDAG
  rationale: κόσμος가 세 절에 반복되므로 한결같이 '세상'으로 옮겨 원문이 주는 다양한 층위를 보존합니다. 요한서신에서 κόσμος는 거주 세계 또는 반역하는 인류 쪽으로 기울 수 있으나 '세상'이 어느 한 뜻으로 과도하게 치우치지 않습니다.
- source_word: ἦν
  english_pob_choice: was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 존재했습니다
  - 계셨습니다
  lexicon: BDAG
  rationale: 임퍼펙트 εἰμί은 계속적 현존을 나타냅니다. '있었습니다'는 철학적 의미를 덧붙이지 않고 단순한 지속적 존재를 전달합니다. 신격에 대한 경어(계셨습니다)는 본문에 추가적 경칭을 도입할 수 있어 자제했습니다.
- source_word: δι’ αὐτοῦ
  english_pob_choice: through him
  chosen_korean: 그를 통하여
  alternatives_korean:
  - 그로 말미암아
  - 그에 의해
  lexicon: BDAG
  rationale: διά+생격은 도구·매개 또는 작용 주체를 나타냅니다. '그를 통하여'는 요한 문맥에서 중재자 역할을 분명히 하면서 현대 한국어로 자연스럽습니다.
- source_word: ἐγένετο
  english_pob_choice: came into being
  chosen_korean: 생겨났습니다
  alternatives_korean:
  - 지어졌습니다
  - 생겼습니다
  lexicon: BDAG
  rationale: γίνομαι는 '존재하게 되다/생겨나다'의 의미입니다. ἦν(있었다)과 대조되는 존속과 기원의 차이를 한국어로도 유지하기 위해 '생겨났습니다'를 선택했습니다.
- source_word: ἔγνω
  english_pob_choice: did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알아보지 못했습니다
  - 인정하지 않았습니다
  lexicon: BDAG
  rationale: γινώσκω는 기본적으로 '알다'이며 인식·관계적 승인까지 포함할 수 있습니다. 본문이 함축하는 신학적 여지를 보존하기 위해 직역에 가까운 '알지 못했습니다'를 택하고, 해석적 확장은 각주로 처리합니다.
- source_word: αὐτόν / αὐτοῦ
  english_pob_choice: him
  chosen_korean: 그
  alternatives_korean:
  - 그분
  - 그것
  lexicon: BDAG
  rationale: 대명사들은 직전에 제시된 로고스(ὁ λόγος)를 가리킵니다. 원문이 인격성을 부각하므로 중성적 '그것' 대신 인칭 대명사 '그'를 사용하되, 불필요한 경칭은 추가하지 않았습니다.
theological_decisions:
- issue: Referent of the implied subject
  chosen_reading: 문맥상의 로고스를 인격적 '그(He)'로 번역합니다.
  alternative_readings:
  - 추상 명사로만 읽어 '그것(It)'으로 번역
  rationale: 1:1–9의 직전 문맥이 로고스를 분명히 인격화하고 남성 대명사를 사용합니다. 본절에서도 동일한 담화 주어가 이어지므로 인격적 지시어를 유지해 본문 의도를 보존합니다.
  doctrine_reference: 번역 원칙 §1 원문 우선; 문맥상 인격화의 보존
- issue: 창조 언어(ἦν vs ἐγένετο)의 구별
  chosen_reading: ἦν은 '있었다'로, ἐγένετο는 '생겨났다'로 번역하여 존재와 기원의 차이를 보존합니다.
  alternative_readings:
  - 두 동사를 모두 같은 '있었다/지어졌다' 등으로 합치 번역
  rationale: 요한 서문의 ἦν과 ἐγένετο의 교차는 신학적으로 의미가 있으므로 한국어에서도 대조가 드러나야 합니다. 이는 로고스의 선재성과 세상의 피조성 사이의 구별을 드러냅니다.
  doctrine_reference: 번역 원칙 §1 원문 우선; §3 신학적 긴장 보존
- issue: 경어(계셨다) 사용 여부
  chosen_reading: 대인칭 지시를 경어로 처리하지 않고 보통어 '있었습니다'를 사용합니다.
  alternative_readings:
  - 신적 인물에 대해 경어 '계셨습니다' 사용
  rationale: 본문이 3인칭 서술일 뿐 직접적인 경칭을 요구하지 않습니다. 경어를 도입하면 본문에 없는 신학적·교회적 경외가 추가될 수 있으므로 중립적 어투를 택했습니다.
  doctrine_reference: 번역 원칙 §1 원문 우선; 번역자는 텍스트에 명시되지 않은 경칭을 자의적으로 추가하지 않음
