id: JHN.1.43
reference: John 1:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
  footnotes:
  - marker: a
    text: Or 'to Galilee.' The Greek preposition can be rendered either more literally ('into') or more idiomatically ('to') in English.
    reason: lexical_alternative
  - marker: b
    text: The verbs 'finds' and 'says' are present tense in Greek, a historical present used for vivid narration.
    reason: lexical_alternative
  - marker: c
    text: The command 'Follow me' can denote both literal accompanying and the broader call to become Jesus' disciple.
    reason: alternative_reading
translation:
  language: ko
  text: 다음 날 예수께서는 갈릴리로[a] 나가시려 하십니다. 예수께서 빌립을 찾아가 그에게 말씀하시되[c][b] 「나를 따르라.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '갈릴리로'로 번역될 수 있습니다. 그리스어 전치사 εἰς는 장소로의 이동을 표시합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사들은 역사적 현재를 사용하여 서술의 생동감을 줍니다; 한국어에서 이를 현재어감으로 살렸습니다.
    reason: lexical_alternative
  - marker: c
    text: '''나를 따르라''는 문자적 동행을 넘아 예수의 제자가 되라는 부르심을 포함할 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  english_pob_choice: The next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 이튿날
  - 그 다음 날
  lexicon: BDAG
  rationale: 그리스어 관용적 시간 표현을 한국어 자연스러운 서술로 옮겼습니다. '다음 날'은 이야기의 연속성을 유지하면서 어색하지 않습니다.
- source_word: εἰς τὴν Γαλιλαίαν
  english_pob_choice: into Galilee
  chosen_korean: 갈릴리로
  alternatives_korean:
  - 갈릴리 안으로
  - 갈릴리로 향하여
  lexicon: BDAG
  rationale: εἰς는 목적지로의 이동을 표시합니다. 한국어에서는 '...로'가 자연스러워 원어의 이동성을 보존하면서 읽기 쉽게 합니다. (대안적으로 보다 문자적인 ‘안으로’도 가능함)
- source_word: εὑρίσκει / λέγει
  english_pob_choice: finds / says (historical present)
  chosen_korean: 찾아가 ... 말씀하시다 (현재 서술)
  alternatives_korean:
  - 찾았다 / 말하였다 (과거)
  - 찾아가서 말하였다 (과거 서술)
  lexicon: BDAG
  rationale: 요한 복음의 역사적 현재를 반영하여 한국어에서도 동사의 생동감을 살려 현재형/현재서술 어감을 사용했습니다. 이는 원문 서술의 즉시성과 현장감을 보존합니다.
- source_word: Ἀκολούθει μοι
  english_pob_choice: Follow me
  chosen_korean: 나를 따르라
  alternatives_korean:
  - 나를 따르십시오
  - 나와 함께 오라
  - 나를 따라오너라
  lexicon: BDAG
  rationale: 명령형의 현재 시제는 지속적인 제자도의 부르심을 함축합니다. 예수의 직접적 소환이라는 긴장감을 살리기 위해 친밀한 명령형 '나를 따르라'로 번역했고, 인용문 안에서 서술체(합쇼체)와의 의도적 어조 전환을 적용했습니다.
theological_decisions:
- issue: Force of Jesus' command to Philip
  chosen_reading: '직접적인 제자 부르심: ''나를 따르라''라는 제자화의 소환'
  alternative_readings:
  - 단순한 동행 초대(물리적 이동)
  - 임시적 동반 요청
  rationale: 신약에서 ἀκολούθει μοι는 문맥상 반복적으로 제자적 호출을 의미합니다. 본문은 짧은 이동 장면이지만 번역은 문법적 원형을 그대로 옮기고 의미적 여지를 남겨 제자 부르심의 신학적 무게를 삭제하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
