  to: 다음 날 예수께서는 갈릴리로[a] 떠나시려고 하셨습니다. 예수께서는 빌립을 만나시고 그에게 말씀하십니다[c][b]. 「나를 따르십시오.」
  rationale: 아오리스트 ἠθέλησεν은 과거형으로, 역사적 현재 εὑρίσκει와 λέγει는 현재형으로 구별했습니다. ‘만나시고’는 εὑρίσκει에 충실하면서 불필요한 이동 의미를 피합니다. 인용문은 현대 표준 한국어 합쇼체로 통일했으며, 각주의 중복 대안과 오자를 바로잡았습니다.
