    text: 전통적으로는 ‘예수 그리스도’를 사용합니다.
    reason: alternative_reading
  revision_rationale: 원문의 설명 접속사 ὅτι를 ‘왜냐하면’으로 반영하고, 한국어에서 자연스러운 칭호 표현인 ‘메시아이신 예수’로 다듬었습니다. 각주는 동일한 그리스어 칭호 Χριστός의 전통적 한국어 음역 표기를 안내하도록 정확히 조정했습니다.
