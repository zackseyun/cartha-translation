id: JHN.1.7
reference: John 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
  footnotes:
  - marker: a
    text: Or 'bear witness about the Light.'
    reason: lexical_alternative
  - marker: b
    text: That is, through John's testimony; some take 'through him' to refer to the Light instead.
    reason: alternative_reading
translation:
  language: ko
  text: 이 사람은 증인이 되려고 왔습니다[a], 빛에 관하여 증언하여 모든 사람이 그를 통하여 믿게 하려는 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '빛에 관해 증거하러 왔다'라고 옮길 수 있습니다(어휘적 대안).
    reason: lexical_alternative
  - marker: b
    text: 원문 δι’ αὐτοῦ는 문법상 '그(요한)'를 가리키는 것이 가장 자연스럽습니다. 그러나 역사적·신학적 전통 가운데 일부는 '그'를 '빛(메시아)'으로 읽어 '사람들이 빛을 통하여 믿는다'고 해석합니다(대체 해석).
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  english_pob_choice: This one
  chosen_korean: 이 사람
  alternatives_korean:
  - 이 분
  - 그(사람)
  - 이 자
  lexicon: BDAG
  rationale: 그리스어 οὗτος는 앞에서 소개된 요한을 지시하는 강조적 지시대명사입니다. 단순한 대명사 '그'보다 '이 사람'을 써서 지시의 근접성과 대조(요한과 빛의 구별)를 분명히 살렸습니다. '이 분'은 경어적 색채가 있어 인물화의 거리감을 줄이지만 원문의 직설적 지시어감을 약화시킬 수 있어 2순위로 제시했습니다.
- source_word: ἦλθεν
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 도착했습니다
  - 이르렀습니다
  lexicon: BDAG
  rationale: ἦλθεν(ἔρχομαι의 과거)은 단순 서술적 '왔다'입니다. 한국어 공식문체에서는 '왔습니다'가 자연스럽고 담화의 진행을 보존합니다. '도착했습니다'는 장소적 뉘앙스를 더해 원문보다 구체적이므로 대안으로 표기했습니다.
- source_word: εἰς μαρτυρίαν
  english_pob_choice: as a witness
  chosen_korean: 증인이 되려고
  alternatives_korean:
  - 증언하려고
  - 증거하러
  lexicon: BDAG
  rationale: εἰς + 명사는 목적·역할을 나타냅니다. '증인이 되려고'는 요한이 온 목적(역할)을 한국어로 충실히 전달합니다. '증언하려고'는 동사적 목적을 강조하고 '증거하러'는 고전적 번역 선택이므로 대안으로 제시했습니다.
- source_word: ἵνα μαρτυρήσῃ
  english_pob_choice: so that he might testify
  chosen_korean: 증언하도록
  alternatives_korean:
  - 증언하려고
  - 증언하기 위하여
  lexicon: BDAG
  rationale: ἵνα 절은 목적(subjunctive)의 표지입니다. 한국어에서는 목적을 나타낼 때 '-도록/하기 위하여/하려고' 등으로 옮깁니다. 본문에는 이미 εἰς μαρτυρίαν과 유사한 뜻이 반복되므로, 문장 흐름을 고려해 '증언하도록'으로 간결하게 표현했습니다.
- source_word: περὶ τοῦ φωτός
  english_pob_choice: about the Light
  chosen_korean: 빛에 관하여
  alternatives_korean:
  - 빛에 대하여
  - 그 빛에 관하여
  lexicon: BDAG
  rationale: περί + 属格은 '…에 관하여'로 자연스럽게 번역됩니다. 요한복음의 φῶς(빛)는 명사적·제목적 사용이 있어 문맥상 '빛'을 대문자 표기 대신 문장 내 강조로 처리하고, 한국어로는 '빛에 관하여'가 원문의 중립성을 유지합니다.
- source_word: ἵνα πάντες πιστεύσωσιν / δι’ αὐτοῦ
  english_pob_choice: so that all might believe through him
  chosen_korean: 모든 사람이 그를 통하여 믿게 하려는 것입니다
  alternatives_korean:
  - 모든 사람이 그를 통해 믿게 하려 함이다
  - 모든 사람이 그 빛을 통하여 믿게 하려는 것이다
  - 모든 사람이 믿게 하려는 것입니다(통로 불특정)
  lexicon: BDAG
  rationale: ἵνα πάντες πιστεύσωσιν은 또 하나의 목적절이며, διὰ + 属格은 수단·매개를 나타냅니다. 한국어로 '그를 통하여'는 '그(요한)의 증언을 통로로 하여' 믿게 하려는 의미를 전달합니다. 원문이 문법적으로는 요한을 지시하는 αὐτοῦ를 쓰고 있으나 담화상 '빛'으로 읽힐 여지도 있으므로(대체해석은 부록 주석에 표기) 대체 번역들을 보조안으로 제시했습니다.
theological_decisions:
- issue: δι’ αὐτοῦ(“그를 통하여”)의 지시대상
  chosen_reading: '''그''는 증인인 요한을 가리킵니다.'
  alternative_readings:
  - '''그''가 빛(메시아)을 가리킨다.'
  rationale: 문법적·담화적 근거로서는 바로 앞에 서술된 인물(요한)이 자연스러운 선행사가 됩니다. 본 절은 요한의 사명(증언)을 진술하며, 다음 절(Jn 1:8)에서 요한과 빛을 분명히 구별하므로 '그를 통하여'를 요한의 증언을 통한 믿음으로 읽는 것이 문맥상 가장 일관됩니다. 다만 전통적·신학적 독자들은 '그'를 '빛(메시아)'로 이해하여 '사람들이 빛을 통해 믿는다'고 읽을 수 있으므로, 이 대안은 주석 주footnote로 표기하여 독자가 원문적 긴장을 볼 수 있게 했습니다.
  doctrine_reference: '문맥 보존: 요한(증인)과 빛(메시아)의 구별을 유지함으로써 증언의 매개성(요한을 통한 믿음)과 빛 자체로서의 구속적 역할 사이의 긴장을 드러냄.'
