id: JHN.1.18
reference: John 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
  footnotes:
  - marker: a
    text: Some manuscripts read 'the only Son' (or 'the only begotten Son') instead of 'the one and only God.'
    reason: textual_variant
  - marker: b
    text: Or 'at the Father's side.' The Greek literally says 'in the bosom of the Father,' expressing intimate closeness.
    reason: lexical_alternative
  - marker: c
    text: Or 'has explained him' or 'has revealed him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 하나님을 본 적이 없습니다. 아버지의 품에[b] 계신 유일하신 하나님[a]이 그를 알려 주셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 '오직 아들'(또는 '외아들')이라고 전합니다.
    reason: textual_variant
  - marker: b
    text: 또는 '아버지의 곁에'로 옮길 수 있습니다. 그리스어는 문자적으로 '아버지의 품에'라는 친밀한 이미지를 전달합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그를 설명하였다' 또는 '그를 계시하였다'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν / οὐδεὶς ἑώρακεν πώποτε
  english_pob_choice: No one has ever seen God
  chosen_korean: 아무도 하나님을 본 적이 없습니다
  alternatives_korean:
  - 아무도 하나님을 본 일은 없습니다
  - 지금까지 누구도 하나님을 본 적이 없습니다
  lexicon: BDAG
  rationale: 완전시·부정어구(πώποτε + ἑώρακεν)의 결과 상태를 한국어로 자연스럽게 전달하기 위해 '아무도 ... 본 적이 없습니다' 형식을 사용했습니다.
- source_word: μονογενὴς θεὸς
  english_pob_choice: the one and only God
  chosen_korean: 유일하신 하나님
  alternatives_korean:
  - 외아들(또는 외아들 하나님)
  - 오직 하나뿐인 하나님
  - 독특하신 하나님
  lexicon: BDAG
  rationale: SBLGNT 본문이 'μονογενὴς θεός'로 표기하므로 영어 POB 판단처럼 μονογενής를 'one and only/unique'로 읽어 '유일하신'으로 옮겼습니다. 전통적 '외아들/외아들로 난' 번역은 본문 전사 차이(변이)를 주석으로 보존합니다.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  english_pob_choice: in the bosom of the Father
  chosen_korean: 아버지의 품에
  alternatives_korean:
  - 아버지 곁에
  - 아버지의 가슴에
  lexicon: BDAG
  rationale: κόλπος의 은유적 친밀함을 살리기 위해 문자적 이미지인 '품'을 사용했습니다. '곁'은 해석적 대안으로 각주로 표기했습니다.
- source_word: ἐξηγήσατο
  english_pob_choice: has made him known
  chosen_korean: 알려 주셨습니다
  alternatives_korean:
  - 설명하셨습니다
  - 계시하셨습니다
  - 드러내 보이셨습니다
  lexicon: BDAG
  rationale: 동사의 의미 범위(해설·설명·계시)를 한국어로 자연스럽게 전달하기 위해 중립적이고 공적 어조에 적합한 '알려 주셨습니다'를 선택했습니다. 대안들은 각주로 표기합니다.
theological_decisions:
- issue: 'Textual reading: μονογενὴς θεὸς (SBLGNT) versus ὁ μονογενὴς υἱός (''the only Son'')'
  chosen_reading: 본문(SBLGNT)을 따라 '유일하신 하나님'으로 본문에 직역하고, '오직 아들/외아들'이라는 전통적·장절적 변이는 각주로 제시합니다.
  alternative_readings:
  - 오직 아들(또는 외아들)
  - 오직 하나뿐인 존재
  rationale: 원문(삼위일체·기독론적 해석에 민감한 구절)에 대한 투명성을 유지하기 위해 인쇄본(SBLGNT)을 본문에 따랐습니다. 다만 이 변이는 신학적 함의가 크므로 주석으로 보존하여 심리적·교리적 편향을 피했습니다.
  doctrine_reference: Translation philosophy §1, §3; Affirmations (문헌 투명성 및 교리적 중립성)
- issue: Rendering Θεός
  chosen_reading: 본문의 θεός은 일반적 신칭으로 '하나님'으로 번역함 — 야훼(야호와) 표기는 사용하지 않음
  alternative_readings:
  - 야훼(특히 구약 인용일 때)
  - 주(문체상)
  rationale: 신약 본문에서 θεός은 통상 신(하나님)을 가리키므로 프로젝트 용어집에 따라 '하나님'을 사용했습니다. 야훼 표기는 구약의 יהוה 인용·암시가 명백할 때만 각주로 표기합니다.
  doctrine_reference: 'POB glossary: Θεός → ''하나님'' 지침'
