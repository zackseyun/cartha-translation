id: JHN.1.6
reference: John 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
  footnotes:
  - marker: a
    text: Or 'his name was John' or more compactly 'named John.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께로부터 보내심을 받은 한 사람이 있었습니다. 그의 이름은 요한이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '요한이라 불렸습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  english_pob_choice: There was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 생겼습니다
  - 나타났습니다
  lexicon: BDAG
  rationale: γίνομαι(ἐγένετο)는 서사에서 새로운 인물을 도입하는 존재론적·현상적 서술입니다. 한국어로는 자연스럽고 격식 있는 과거서술형 '있었습니다'가 이 존재적 도입을 그대로 전달합니다(창조적·현상적 중 하나로 과잉해석하지 않음).
- source_word: ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 남자
  - 한 인간
  lexicon: BDAG
  rationale: 단수 남성 형태가 특정 남성 개인을 가리키므로 '한 사람'이 자연스럽고 성별·인물성을 전달합니다. '한 남자'는 과도하게 성별을 강조할 수 있고 '한 인간'은 일반성을 너무 강조합니다.
- source_word: ἀπεσταλμένος
  english_pob_choice: sent
  chosen_korean: 보내심을 받은
  alternatives_korean:
  - 보내심 받은 자
  - 파송된
  lexicon: BDAG
  rationale: 수동 분사로서 '보내진 사람'의 상태를 나타냅니다. 한국어로는 수동·완료 의미를 전달하는 '보내심을 받은'으로 처리해 원문이 지닌 위임·파송의 성격을 유지합니다.
- source_word: παρὰ θεοῦ
  english_pob_choice: from God
  chosen_korean: 하나님에게서
  alternatives_korean:
  - 하나님으로부터
  - 하나님께서
  lexicon: BDAG
  rationale: παρά + 属格은 출처·기원을 가리키는 경우가 많습니다. '하나님에게서'는 출처로서의 의미를 한국어로 직접 전달합니다. '하나님께서'는 행위자의 강조가 되어 원문의 출처 강조를 흐릴 수 있으므로 부차적 대안으로 표기합니다. 또한 신명칭은 신약 문맥의 θεός이므로 프로젝트 표준에 따라 '하나님'을 사용합니다.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  english_pob_choice: whose name was John
  chosen_korean: 그의 이름은 요한입니다
  alternatives_korean:
  - 요한이라 불렸습니다
  - 이름하여 요한이라 합니다
  lexicon: BDAG
  rationale: 그리스어 관용구는 '그에게 이름이 — 이다'의 구조입니다. 한국어로는 '그의 이름은 요한입니다'가 동일한 식별기능을 자연스럽게 전달합니다. 더 간결한 '요한이라 불렸습니다' 등은 가능하나 원문의 문장구조와 식별력을 살리기 위해 본 표현을 선택했습니다.
- source_word: Ἰωάννης
  english_pob_choice: John
  chosen_korean: 요한
  alternatives_korean:
  - 요한
  lexicon: BDAG / 전통적 한국어 성경 표기
  rationale: 인명은 전통적 한국 성경에서 널리 인정되는 형식(요한)을 사용합니다. 프로젝트 방침에 따라 현대 한국어 성경 표기를 따릅니다.
theological_decisions:
- issue: Nature and force of 'ἀπεσταλμένος παρὰ θεοῦ' — source vs. agent
  chosen_reading: The phrase indicates John is divinely commissioned; the preposition conveys source/origin, so Korean renders this as '하나님에게서 보내심을 받은' to preserve origin without importing extra doctrinal claims about office.
  alternative_readings:
  - Interpret as stronger agentive '하나님께서 보내신' (emphasizes God as sending agent).
  - Minimize divine commissioning and read as mere association with God.
  rationale: 'παρά + 属格은 출처(source)를 가리키는 전형적 용법입니다. ἀπεσταλμένος는 수동 분사로 파송된 상태를 말하므로 번역은 ''보내심을 받은'' 등 수동·출처 의미를 결합해야 원문 의도를 정확히 반영합니다. 영어 감사 자료와 일치하게 신학적 과잉 해석(예: 직임명제)을 피하고 단순한 파송 표지를 유지합니다.'
  doctrine_reference: 'Translation principle: preserve the plain sense of the source text without importing later doctrinal claims.'
- issue: 'Use of θεός as the divine name (rendering choice: ''하나님'' vs. ''야훼'')'
  chosen_reading: Render θεός as '하나님' in this New Testament context.
  alternative_readings:
  - Use '야훼' to signal citation/allusion to YHWH (reserved for OT quotations).
  - Use '주님' as a reverent NT vocative.
  rationale: 프로젝트 용어집은 OT의 יהוה 표기를 '야훼'로 하도록 규정하지만, 신약 그리스어 θεός는 통상적으로 '하나님'으로 번역합니다. 본문은 θεός의 일반적 사용이므로 '하나님'을 사용하여 한국 독자에게 친숙하고 명확하게 전달합니다.
  doctrine_reference: 'Project glossary: θεός → ''하나님'' unless context indicates direct citation of יהוה.'
- issue: Register and politeness (narrative voice)
  chosen_reading: Use modern formal-polite (합쇼체) narrative register.
  alternative_readings:
  - Use archaic 존칭(하옵나이다) or casual registers.
  rationale: 프로젝트 스타일 규정에 따라 현대 표준 한국어의 합쇼체(-습니다/-습니다)를 사용하여 공적 성경 번역의 관습을 따르고 원문 서술의 존중을 유지합니다.
  doctrine_reference: POB Korean style guidelines
