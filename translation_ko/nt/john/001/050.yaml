language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
  footnotes:
  - marker: a
    text: Or, 'Is it because I told you that I saw you under the fig tree that you believe?'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 그에게 이르시되 「내가 무화과나무 아래에서 너를 보았다고 네게 말하였기 때문에[a] 너는 믿느냐? 너는 이보다 더 큰 것을 보게 될 것이다。」
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는, '내가 네게 무화과나무 아래에서 너를 보았다고 네게 말하였기 때문에 네가 믿느냐?'로 번역할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτι
  english_pob_choice: Because
  chosen_korean: …때문에
  alternatives_korean:
  - …인가
  - …라는 것
  lexicon: BDAG
  rationale: 맨 앞 Ὅτι는 인과를 제시하므로 한국어로 ‘…때문에’로 처리해 원문의 인과관계를 직역적으로 드러냅니다. 영어 POB가 선택한 'Because'와 대응됩니다. 대안 '…인가'는 영어 각주가 제시한 해석(‘Is it because…?’)로 가능하지만, 원문에 직접적인 의문사 도입어가 없어 질문문 전체를 불필요하게 바꾸지 않으려 하였습니다.
- source_word: εἶπον σοι ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς
  english_pob_choice: I told you that I saw you under the fig tree
  chosen_korean: 내가 무화과나무 아래에서 너를 보았다고 네게 말하였기 때문에
  alternatives_korean:
  - 내가 네게 ‘내가 무화과나무 아래에서 너를 보았다’라고 말했기 때문에
  - 내가 네게 무화과나무 아래에서 너를 보았다고 했으므로
  lexicon: BDAG
  rationale: 그리스어의 두 번의 ὅτι 구조(말함을 도입하는 ὅτι + 내용절의 ὅτι)를 한국어로 자연스럽게 처리하기 위해 간접화법형을 선택했습니다. 직접인용형(큰따옴표 삽입)은 가능하지만, 원문의 중첩된 ὅτι를 과도하게 표출하지 않기 위해 간결한 간접화법으로 번역했습니다.
- source_word: πιστεύεις
  english_pob_choice: do you believe
  chosen_korean: 너는 믿느냐?
  alternatives_korean:
  - 너는 믿습니까?
  - 네가 믿느냐?
  lexicon: BDAG
  rationale: 현재 직설법의 수사적 질문을 그대로 살려 '너는 믿느냐?'로 번역했습니다. 문맥상 반문적 어조(수사적 질문)를 유지하는 것이 중요하므로 평서형으로 바꾸지 않았습니다. 공손도 선택지('믿습니까?')는 가능하나, 원어의 직설적 호칭과 신속한 호응을 감안해 친숙한 2인칭 표현을 사용했습니다.
- source_word: μείζω τούτων ὄψῃ
  english_pob_choice: you will see greater things than these
  chosen_korean: 너는 이보다 더 큰 것을 보게 될 것이다
  alternatives_korean:
  - 너는 이것들보다 더 큰 것을 보리라
  - 너는 이보다 더 큰 일들을 보게 되리라
  lexicon: BDAG
  rationale: μείζω 토ύτων의 비교구문을 한국어로 '이보다 더 큰 것'으로 단순화하여 표현했습니다. 영어 POB의 'greater things'에 충실하고, 현대 한국어 문체에 맞게 미래 표지를 '보게 될 것이다'로 선택했습니다.
theological_decisions:
- issue: Force of Jesus' question πιστεύεις;
  chosen_reading: 수사적 질문(Do you believe?)으로 번역하여 의문과 약간의 도전적 어조를 유지함
  alternative_readings:
  - ‘내가 네게 그렇게 말했으니 네가 믿는가?’처럼 경미한 책망으로 읽기
  - 문맥상 평서문으로 해석하여 단순한 진술로 처리하기
  rationale: 그리스어의 문장부호와 어순, 그리고 곧 이어지는 약속(보다 큰 것을 보리라)이 수사적 질문으로 읽히는 해석을 지지합니다. 본문은 나다나엘의 즉각적 반응과 예수의 계시 약속 사이의 긴장감을 유지해야 하므로 질문형을 고수했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
