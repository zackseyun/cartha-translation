id: JHN.1.23
reference: John 1:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
  footnotes:
  - marker: a
    text: Or, less likely in English punctuation, “I am a voice in the wilderness of one crying out.” The Greek phrase can be construed differently, but the main text reflects the most natural reading here.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. "나는 광야에서 외치는 이의 소리입니다[a]. '야훼의 길을 곧게 하라.' 이사야 선지자가 말한 대로입니다[b]."
  philosophy: formal
  footnotes:
  - marker: a
    text: 그리스어 어순상 'Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ'는 구두점에 따라 '나는 광야에서 외치는 이의 소리입니다' 또는 드물게 '나는 한 사람이 광야에서 외치는 소리입니다'로 달리 읽힐 수 있습니다. 본문은 보다 자연스러운 전통적 연결을 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 그리스어 κύριος는 이사야 원문(히브리어 יהוה)을 인용한 전통을 반영합니다. POB 방침에 따라 본문에 역사적·신학적 명목 '야훼'를 사용했습니다.
    reason: ot_citation
lexical_decisions:
- source_word: Ἐγὼ
  english_pob_choice: I
  chosen_korean: 나는
  alternatives_korean:
  - 저는
  - 나는 스스로
  lexicon: BDAG
  rationale: 그리스어의 명시적 주어(Ἐγὼ)는 강조를 함의하므로 한국어에서도 직접적 식별을 남기기 위해 '나는'을 택했습니다. 공손한 성격을 유지하되 1인칭 자인(자기식별)의 노골적 표현을 보존합니다.
- source_word: φωνὴ ... βοῶντος
  english_pob_choice: a voice of one crying out
  chosen_korean: 광야에서 외치는 이의 소리
  alternatives_korean:
  - 외치는 자의 소리
  - 한 사람의 외침 소리
  - 광야의 소리
  lexicon: BDAG
  rationale: φωνὴ(소리)을 보수적으로 '소리'로, γενική participle(βοῶντος)은 '외치는 이의'로 연결하여 '광야에서 외치는 이의 소리'로 번역했습니다. 이는 영어 POB의 연결(“a voice of one crying out in the wilderness”)을 존중하면서 한국어 어순에 맞추어 자연스럽게 표현합니다.
- source_word: ἐν τῇ ἐρήμῳ
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 사막에서
  - 광야 한가운데서
  lexicon: BDAG
  rationale: ἔρημος의 전통적·신학적 어휘인 '광야'를 사용하여 예언적·종교적 맥락을 보존했습니다. '사막'은 지리적 이미지가 강하므로 본문적 뉘앙스를 해칠 수 있습니다.
- source_word: Εὐθύνατε τὴν ὁδὸν
  english_pob_choice: Make straight the way
  chosen_korean: 길을 곧게 하라
  alternatives_korean:
  - 길을 곧게 준비하라
  - 길을 바로 하라
  lexicon: BDAG
  rationale: 아오리스트 명령형의 직접성을 살려 한국어 성경 전통과도 조응하는 명령형 '곧게 하라'를 사용했습니다. ὁδός는 '길'로 번역하여 은유적·문자적 의미를 모두 포착합니다.
- source_word: κυρίου
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 주님
  lexicon: LXX / SBLGNT context
  rationale: 요한복음 안의 이사야 인용에서 κύριος는 원래 히브리어 יהוה을 지칭하는 전통적 LXX 인용을 반영합니다. POB 프로젝트 방침에 따라 OT 인용으로서 본문에서는 학술적 음역 '야훼'를 메인 텍스트에 사용하고, 주석(각주)으로 출처를 밝힙니다.
theological_decisions:
- issue: Rendering of κύριος in the Isaiah citation
  chosen_reading: 야훼 (main text) with OT citation note
  alternative_readings:
  - 주 (주님)
  - the Lord (English-style)
  rationale: Greek κύριος in LXX renderings of Isaiah reflects Hebrew יהוה. POB 원칙은 신약에서 구약을 인용하거나 암시할 때 원문 신적 이름의 신학적 무게를 투명하게 드러내는 것이므로 본문에는 '야훼'를 사용하고 각주로 인용 근거를 밝힙니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 야훼 when quoting יהוה'
