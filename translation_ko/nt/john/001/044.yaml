  text: ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Now Philip was from Bethsaida[a], from the town of Andrew and Peter.
  footnotes:
  - marker: a
    text: Or 'from the city of Andrew and Peter,' that is, their hometown.
    reason: lexical_alternative
translation:
  language: ko
  text: 빌립은 벳세다[a] 출신으로, 안드레와 베드로의 도시 출신이었습니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘안드레와 베드로의 도시 출신’이라고 할 수 있는데, 즉 그들의 고향을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φίλιππος
  english_pob_choice: Philip
  chosen_korean: 빌립
  alternatives_korean:
  - 필립
  - 필립포
  lexicon: NT onomastics / Korean biblical usage
  rationale: 한국 성경 관용형을 따르며, '빌립'은 신약 인명 표기에서 널리 쓰이는 형태이므로 본문 인명으로 채택했습니다.
- source_word: ἀπὸ Βηθσαϊδά
  english_pob_choice: from Bethsaida
  chosen_korean: 벳세다
  alternatives_korean:
  - 벳새다
  - 베싸이다
  lexicon: Biblical place-name transliteration practice
  rationale: Βηθσαϊδά는 고유지명이므로 한국 성경 전통에 따라 음역했습니다; 여러 전통형이 있어 각주로 대안 가능성을 남겼습니다.
- source_word: ἐκ τῆς πόλεως
  english_pob_choice: from the town
  chosen_korean: 도시
  alternatives_korean:
  - 마을
  - 고향
  lexicon: BDAG (πόλις)
  rationale: πόλις는 도시/마을 모두 가능하므로 영어 POB의 'town' 기조를 반영해 현대 한국어로는 '도시'를 선택했습니다; 문맥상 안드레·베드로와의 연관(고향)임을 독자가 알 수 있게 구성했습니다.
- source_word: ἦν δὲ
  english_pob_choice: was / Now
  chosen_korean: 출신으로 ... 출신이었습니다
  alternatives_korean:
  - 있었다
  - 출신이었다
  lexicon: BDAG (εἰμί imperfect usage)
  rationale: ἦν은 상태의 과거 표현이므로 한국어로 과거의 신분·출신을 나타내는 표현(출신이었다 / 출신이었습니다)으로 번역했습니다; δέ의 온화한 연결 기능은 문장 연결로 살렸습니다.
theological_decisions:
- issue: '격률(γενitive) ''Ἀνδρέου καὶ Πέτρου''의 의미: 소유/귀속 vs. 출신·연관'
  chosen_reading: 안드레와 베드로와 관련된 도시(그들의 고향)이라는 출신·연관 의미
  alternative_readings:
  - 안드레와 베드로가 소유한 도시(문자적 소유)
  - 단순한 지리적 표지(소속 없이)
  rationale: 그리스어 속격은 소유·관계를 모두 표현할 수 있으나 복음서 문맥과 영어 POB의 판독을 따라 '그들의 고향' 즉 출신·연관으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 문법적·문맥적 판단
