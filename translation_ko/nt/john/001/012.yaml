id: JHN.1.12
reference: John 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
  footnotes:
  - marker: a
    text: Or 'authority' or 'power' to become children of God; the Greek term can denote delegated authority, right, or capability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그를 영접한 모든 사람에게는—곧 그의 이름을 믿는 사람들에게—하나님의 자녀가 될 권리를[a] 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '권세'나 '권능'으로 번역할 수 있습니다; 그리스어 ἐξουσία는 위임된 권한, 권리 또는 능력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  english_pob_choice: all who
  chosen_korean: 모든 사람에게
  alternatives_korean:
  - 많은 사람들
  - 누구든지
  lexicon: BDAG
  rationale: 그리스어 ὅσοι는 집합적·포괄적 의미를 지닌 복수 관계사입니다. 영어 POB가 'all who'를 택한 것처럼 한국어에서도 '모든 사람에게'가 현대 한국어 독자에게 포괄적이고 자연스럽게 전달됩니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 이제
  lexicon: BDAG
  rationale: δὲ는 앞 구절의 대조를 표시합니다(요한복음 1:11의 거부와 대조). '그러나'가 한국어에서 적절한 역접 연결어입니다.
- source_word: ἔλαβον αὐτόν
  english_pob_choice: received him
  chosen_korean: 그를 영접한
  alternatives_korean:
  - 그를 받아들인
  - 그를 맞아들인
  lexicon: BDAG
  rationale: λαμβάνω는 여기에서 환영·영접의 의미로 사용됩니다. 한국어 성경 전통과 현대 독자성에 맞게 '영접한'이 적합하며, 단순한 물리적 취득('받아들인')보다 대상을 환영하는 어감이 살아납니다.
- source_word: ἔδωκεν
  english_pob_choice: he gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주셨다
  - 부여하셨습니다
  lexicon: BDAG
  rationale: δίδωμι의 단순 과거적 전달을 한국어의 공손한 서술형으로 옮겼습니다. 주어가 하나님이므로 한국어 관습에 따라 존칭 어미('주셨습니다')를 사용하여 경의를 표했습니다.
- source_word: ἐξουσίαν
  english_pob_choice: the right
  chosen_korean: 권리
  alternatives_korean:
  - 권세
  - 권능
  - 권한
  lexicon: BDAG
  rationale: 영어 POB는 'the right'를 택해 ἐξουσία의 수여된 자격·자격권(entitlement) 뉘앙스를 살렸습니다. 한국어로는 법적·관계적 '권리'가 해당 뉘앙스를 가장 분명히 전달합니다. 전통적 성경 번역의 '권세'나 '권능'은 'authority/power' 쪽 뉘앙스가 강해 본문이 강조하는 수여된 자격이라는 면을 덜 반영할 수 있습니다. (본문어휘의 가능성에 대해 각주[a]를 달아 다른 번역어를 표기했습니다.)
- source_word: τέκνα θεοῦ
  english_pob_choice: children of God
  chosen_korean: 하나님의 자녀
  alternatives_korean:
  - 하나님의 아들들
  - 하나님의 자손
  lexicon: BDAG; POB glossary
  rationale: τέκνα는 성별을 특정하지 않는 포괄적 용어입니다. 영어 POB의 방침대로 'children'을 반영하여 한국어로는 '하나님의 자녀'를 선택해 남성지향적 '아들들'(υἱοί)로의 번역을 피했습니다.
- source_word: γενέσθαι
  english_pob_choice: to become
  chosen_korean: 될
  alternatives_korean:
  - 되어지게 하다
  - 있게 하다
  lexicon: BDAG
  rationale: γίνομαι의 부정사적 용법을 한국어로 자연스럽게 전달하기 위해 '되다' 계열을 사용했습니다. 영어 POB의 'to become'에 대응하여 '될'로 간결하게 처리했습니다.
- source_word: τοῖς πιστεύουσιν
  english_pob_choice: to those who believe
  chosen_korean: 믿는 사람들에게
  alternatives_korean:
  - 믿는 이들에게
  - 믿음을 가진 자들에게
  lexicon: BDAG
  rationale: 현재 분사형이 특징 지우는 집단을 가리키므로 동사 어조('믿는')를 살렸습니다. '사람들에게'는 현대 한국어 독자에게 자연스럽고 포괄적인 표현입니다.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  english_pob_choice: in his name
  chosen_korean: 그의 이름을
  alternatives_korean:
  - 그를 향하여
  - 그의 인격을 향하여
  lexicon: BDAG
  rationale: πιστεύω εἰς + ὄνομα는 '그의 이름(인격과 권위)을 향한 믿음'을 가리킵니다. 한국어로는 문맥상 '그의 이름을 믿는 사람들에게'처럼 표현해 원문 의미를 보존합니다.
theological_decisions:
- issue: Relational sequence between 'received him' and 'believe in his name'
  chosen_reading: 두 표현을 모두 살려, 뒤의 '그의 이름을 믿는 사람들'을 앞 '영접한 사람들'을 특정·설명하는 동일화적 동격(즉, 설명적 동격)으로 처리했습니다.
  alternative_readings:
  - 두 표현을 완전히 동의어로 보아 하나의 의미만 번역할 수 있다.
  - 두 표현을 별개의 단계로 읽어 순차적 행위(먼저 영접, 그 다음 믿음)로 번역한다.
  rationale: 원문은 ὅσοι...ἔλαβον αὐτόν과 τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ를 모두 기입하여 수신자들을 지정합니다. 영어 POB의 결정에 따라 두 표현을 모두 보존하되, 두 번째 구절이 첫째 구절을 특정·설명하는 방식으로 처리하면 요한 본문의 신학적·문체적 긴장(영접과 믿음의 관계)을 불필요히 축소하지 않습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: Meaning of divine sonship term
  chosen_reading: τέκνα를 '하나님의 자녀'로 번역하여 남성적 '아들' 표현을 피했습니다.
  alternative_readings:
  - τέκνα를 관습적 교회 번역인 '아들들'로 옮긴다.
  rationale: 텍스트는 τέκνα(복수·비성별)를 사용하므로 POB의 성별 정확성 원칙에 따라 '자녀'로 번역하는 것이 원어 의미를 가장 충실히 전달합니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
