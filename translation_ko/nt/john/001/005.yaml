id: JHN.1.5
reference: John 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
  footnotes:
  - marker: a
    text: Or, 'the darkness has not comprehended it' or 'grasped it.' The Greek verb can carry either the sense of overcoming or of grasping/understanding.
    reason: alternative_reading
translation:
  language: ko
  text: 그 빛이 어둠 가운데[a] 비치고, 어둠은 그 빛을 이기지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '어둠이 그것을 이해하지 못하였다' 또는 '파악하지 못하였다' — 그리스어 동사 καταλαμβάνω는 '붙잡다/압도하다/파악하다'의 뜻을 지닙니다. 본문 맥락과 요한의 이미지상 '이기다/압도하다'의 의미를 기본으로 삼았고, 인지적 대안은 본 각주로 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  english_pob_choice: the light
  chosen_korean: 그 빛
  alternatives_korean:
  - 빛
  - 빛(그것)
  lexicon: BDAG
  rationale: 원문의 관사(τὸ)와 요한 서문의 주제적, 대조적 기능을 살려 정지(定指)를 유지하기 위해 '그 빛'으로 번역했습니다. 한국어에서는 단지 '빛'만 쓰면 불특정성이 느껴질 수 있으므로 원문의 확정성을 반영해 '그'를 붙였습니다.
- source_word: σκοτίᾳ / σκοτία
  english_pob_choice: the darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 그 어둠
  - 어둠 가운데
  lexicon: BDAG
  rationale: 그리스어 관사를 반영하여 문맥상 대조되고 인격화된 'the darkness'를 나타냅니다. 본문에서는 두 번 등장하므로 첫 번째 어구에서는 '어둠 가운데'로 공간적·상징적 배경을 살리고, 두 번째 언급에서는 행위의 주체로서 자연스럽게 '어둠은'으로 처리했습니다(표현의 중복을 피하기 위함).
- source_word: φαίνει
  english_pob_choice: shines
  chosen_korean: 비치고
  alternatives_korean:
  - 비칩니다
  - 비치고 있다
  lexicon: BDAG
  rationale: 현재 직설법의 생동감을 살리기 위해 '비치다' 계열로 번역했습니다. 연결형 '-고'를 사용해 두 절을 문법적으로 결합시키되, 동작의 계속성을 담는 표면적 현재로 읽히도록 처리했습니다.
- source_word: κατέλαβεν
  english_pob_choice: has not overcome
  chosen_korean: 이기지 못했습니다
  alternatives_korean:
  - 이해하지 못했습니다
  - 파악하지 못했습니다
  - 붙잡지 못했습니다
  lexicon: BDAG
  rationale: καταλαμβάνω는 '붙잡다/파악하다/압도하다' 등 중의적 의미를 갖습니다. 빛과 어둠의 대립이라는 은유적 맥락에서는 '이기다/압도하다'의 의미가 가장 적절하므로 '이기지 못했습니다'를 택했습니다. 영어 POB가 취한 'has not overcome'의 신학적 긴장을 살리고자 주된 의미로 선정하였으며, 인지적 대안(이해하지 못했다)은 주석으로 보존합니다.
- source_word: αὐτὸ
  english_pob_choice: it
  chosen_korean: 그 빛을
  alternatives_korean:
  - 그것을
  - 그 빛을(그것을)
  lexicon: BDAG
  rationale: 그리스어 중성 대명사 αὐτό은 문법적으로 φῶς(빛)에 일치합니다. 한국어에서는 중성 대명사보다 명사를 직접 반복하는 것이 명확하므로 '그 빛을'로 처리하여 지시 대상을 명확히 했습니다. 또한 요한서문 전체가 로고스의 인격을 말하고 있음에도 문법적 일치를 존중하여 비인격적 대명사 대신 명사 직접 반복을 택했습니다.
theological_decisions:
- issue: κατέλαβεν(καταλαμβάνω)의 의미 — 충돌적 '압도/이김' vs. 인지적 '이해/파악'
  chosen_reading: 어둠이 그 빛을 이기지 못했습니다 (압도/이김의 의미)
  alternative_readings:
  - 어둠이 그것을 이해하지 못했습니다 (인지적 의미)
  - 어둠이 그것을 붙잡지 못했습니다 (물리적·점유의 의미)
  rationale: 요한의 '빛과 어둠' 대조는 상징적·윤리적 갈등의 이미지를 제공하므로 공격적·충돌적 의미가 우선적으로 읽힙니다. 그러나 원어의 중의성은 신학적으로 유의미하므로 '이해하지 못했다' 같은 인지적 읽기는 본문 주석(각주)으로 보존하여 긴장을 삭제하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: 시제·상태 표지 — φαίνει(현재)와 κατέλαβεν(ἀόριστος)의 시간적·상태적 처리
  chosen_reading: 첫 절은 현재 지속적 표지(비친다), 둘째 절은 사건의 불발·현 상태(이기지 못했다)로 처리
  alternative_readings:
  - 둘 다 현재로 번역하여 '비칩니다, 이기지 못합니다'로 계속성 강조
  - 둘 다 완료 시제로 번역하여 '비쳐 왔고, 이기지 못했다'로 역사적 서술 강조
  rationale: φαίνει의 생생한 현재성을 보존하여 '빛이 지금 비친다'는 인상을 주었고, κατέλαβεν은 그리스어의 aorist로 사건성을 띠나 영어 POB는 'has not overcome'의 상태적 지속을 택했습니다. 한국어에서는 사실상 '이기지 못했습니다'가 그 상태(어둠이 여전히 이기지 못하고 있음)를 잘 전달하므로 이 음영을 살려 현재의 계속성과 결과의 상태를 동시에 전달하는 방식으로 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Maintain authorial aspect and theological tension)
- issue: 대명사 αὐτό의 번역—중성 대명사 vs. 명사 반복
  chosen_reading: 대명사 대신 '그 빛을'로 명사 반복
  alternative_readings:
  - '''그것을'' (중성 대명사)'
  - 생략하여 '어둠은 이기지 못했습니다' (문맥으로 보충)
  rationale: 한국어에서 중성대명사는 영어보다 덜 자연스러워서 가독성이 떨어질 수 있습니다. 또한 요한서문의 신학적 인격성(로고스)을 지우지 않으면서 문법적 일치를 명확히 하기 위해 명사를 반복하였습니다. 이는 원문의 지시대상(φῶς)에 충실한 번역 선택입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: 관사 처리 및 문체(정지성 유지 vs. 자연스러운 한국어 흐름)
  chosen_reading: 원문의 정지성을 반영하되 한국어 문맥에 맞게 약간의 중복 회피
  alternative_readings:
  - 원문 관사를 매번 '그'로 직역하여 '그 빛이 그 어둠 가운데...' 등으로 중복 사용
  - 관사를 모두 생략하여 '빛이 어둠 가운데...'처럼 보다 일반화
  rationale: 원문의 관사(τὸ·ἡ)를 통해 명확히 대조되는 주제성을 살려야 합니다. 그러나 한국어에서는 과도한 '그' 반복이 어색하므로 첫 사용에서 확정성을 드러내고 두 번째 언급은 문맥상 확정된 주어 형태('어둠은')로 처리하여 균형을 맞췄습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (Faithful readability)
