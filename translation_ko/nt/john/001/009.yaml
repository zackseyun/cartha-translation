  source_fidelity: 현 번역은 ἐρχόμενον을 빛의 도래로 해석하고 각주로 대안적 결속을 보존한 점은 적절합니다. 그러나 첫 문장인 “참된 빛이었습니다”는 주어 없이 독립되어 원문의 한 문장 구조와 ἦν의 기능을 부정확하고 부자연스럽게 재현합니다. ‘밝히는’보다 ‘비추는’이 φωτίζει의 빛 비유를 더 직접적으로 유지합니다.
