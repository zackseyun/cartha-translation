id: JHN.1.9
reference: John 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
  footnotes:
  - marker: a
    text: 'Or: ''The true light, which enlightens every man coming into the world.'' The Greek participle ''coming'' can be read with ''every man'' rather than with ''the true light.'''
    reason: alternative_reading
translation:
  language: ko
  text: 참된 빛[a]이었습니다. 모든 사람을 밝히는 그 빛이 세상에 들어오고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: "참된 빛, 세상에 들어오는 모든 사람을 밝히는"으로 읽을 수 있습니다. 헬라어 분사 ἐρχόμενον은 문법적으로 πάντα ἄνθρωπον(남성 단수)을 수식할 수 있으므로, 본문은 ''세상에 들어오는 모든 사람을 밝히는''으로도 해석될 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 빛(대문자 Light)
  lexicon: BDAG
  rationale: 요한복음의 통상적 어휘를 따릅니다. 헬라어 φῶς는 일반 명사로 쓰였으므로 한국어도 관용적이고 명확한 '빛'으로 번역했습니다. 문맥상 그리스도론적 의미가 있으나 본문은 관사의 일반 명사 활용을 보이므로 대문자화하거나 교리적 수식어를 붙이지 않았습니다.
- source_word: ἀληθινόν
  english_pob_choice: 'true'
  chosen_korean: 참된
  alternatives_korean:
  - 참
  - 진실한
  - 실재하는
  lexicon: BDAG
  rationale: 요한서신 전통에서 ἀληθινός는 '궁극적·진실한 실체'의 의미를 담습니다. 한국어로는 '참된'이 어조와 분량 면에서 원문 의미를 가장 충실히 전달합니다.
- source_word: φωτίζει
  english_pob_choice: enlightens
  chosen_korean: 밝히는/비추는
  alternatives_korean:
  - 비추는
  - 밝게 하는
  - 깨우치는
  lexicon: BDAG
  rationale: 헬라어 φωτίζει는 문자적·비유적 조어를 모두 담습니다. 한국어는 문맥에 자연스러운 동격 표현 '밝히는'과 '비추는'을 허용했으며 본문에서는 '모든 사람을 밝히는'으로 번역했습니다.
- source_word: πάντα ἄνθρωπον
  english_pob_choice: every person
  chosen_korean: 모든 사람
  alternatives_korean:
  - 각 사람
  - 모든 사람들
  - 모든 인간
  lexicon: BDAG
  rationale: 그리스어 단수형 ἄνθρωπον은 보편적·대리적 '사람'을 가리킵니다. 현대 한국어의 포용성과 가독성을 고려하여 영어 초안의 최종 번역('every person')을 반영하여 '모든 사람'으로 처리했습니다. 원문의 단수 형태와 대표성 문제는 각주와 신학적 결정에서 다룹니다.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  english_pob_choice: was coming into the world
  chosen_korean: 세상에 들어오고 있었습니다
  alternatives_korean:
  - 세상에 오는
  - 세상으로 들어오는
  - 세상에 들어온
  lexicon: BDAG
  rationale: 그리스어 현재·분사구문은 수식 대상이 불분명합니다. 본문 주해와 영어 POB의 결정에 따라 본문 전체 맥락에서 빛의 '도래'를 강조하도록 번역했습니다. 한국어에서 자연스러운 시상(時相) 표현은 '들어오고 있었습니다'입니다.
- source_word: ἦν
  english_pob_choice: was
  chosen_korean: 이었습니다
  alternatives_korean:
  - 있었다
  - 있었습니다
  lexicon: BDAG
  rationale: ἦν의 미완료적·과거 상황 표지를 한국어 정중체 과거형 '이었습니다'로 표현해 전체 문장의 서술 흐름을 살렸습니다. 분사와 결합해 '들어오고 있었습니다'의 서술 어감을 지원합니다.
theological_decisions:
- issue: ἐρχόμενον ('들어오고 있던/오는')의 통사적 귀속
  chosen_reading: 참된 빛(τὸ φῶς τὸ ἀληθινόν)에 수식되어 '그 빛이 세상에 들어오고 있었습니다'로 처리함.
  alternative_readings:
  - '''모든 사람''(πάντα ἄνθρωπον)을 수식하여 ''세상에 들어오는 모든 사람을 밝히는''으로 읽는 통사(문법적 수식 대상이 ἄνθρωπον인 해석).'
  rationale: '원문 분사 ἐρχόμενον은 형태상 남성 단수 목적어(ἄνθρωπον)와 일치하므로 문법적으로 ἄνθρωπον을 수식할 가능성이 있습니다. 그러나 요한 복음의 서두(프로롤로그) 맥락과 전형적인 요한적 어휘(예: ''오심/도래''의 메시아적 사용; Jn 3:19, 6:14, 11:27, 16:28 등)를 고려하면 분사가 ''빛''의 도래를 가리키는 것으로 읽는 것이 본문 전체의 주제(빛의 도래·계시)를 더 잘 뒷받침합니다. 따라서 본문 본문은 그리스도론적 독해를 따랐고, 문법적 모호성은 각주(a)에 기록하여 대안적 해석을 보존했습니다(Translation philosophy §3: Preserve theological tension rather than resolve it.).'
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
