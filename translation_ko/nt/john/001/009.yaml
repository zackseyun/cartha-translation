  terminology: ‘참된 빛’, ‘모든 사람’, ‘세상’은 요한복음의 주요 어휘와 원문의 의미를 충실히 반영합니다. ‘비추는’은 φωτίζει의 문자적·비유적 범위를 불필요하게 좁히지 않습니다.
