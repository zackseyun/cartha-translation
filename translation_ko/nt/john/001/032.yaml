revisions:
- from: 요한이 증언하여 말했습니다. 「내가 성령이 하늘로부터[b] 비둘기처럼[a] 내려오는 것을 보았습니다, 그리고 그것이 그 위에 머물렀습니다。」
  to: 요한이 이렇게 증언했습니다. “나는 성령이 하늘로부터[b] 비둘기처럼[a] 내려오는 것을 보았습니다. 그리고 성령은 그분 위에 머물러 계셨습니다.”
  rationale: 원문의 두 동작, 곧 성령이 내려오는 것과 그분 위에 머무르는 것을 한국어에서 분명하고 자연스럽게 나타냈습니다. ‘성령’을 반복하여 잘못된 ‘그것’ 지시를 제거했고, ἐπ’ αὐτόν의 대상은 ‘그분’으로 밝혔습니다. 비교 및 출발점에 관한 각주는 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:09Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 ‘성령’, ‘비둘기처럼’, ‘하늘로부터’, ‘머물렀습니다’는 대체로 원문에 충실합니다. 그러나 ‘그것이 그 위에’는 성령을 사물화하고, ἐπ’ αὐτόν의 인칭 목적어를 한국어에서 부자연스럽고 모호하게 처리합니다.
  naturalness: ‘요한이 증언하여 말했습니다’와 ‘그것이 그 위에 머물렀습니다’는 현대 표준 한국어 합쇼체 성경 문맥에서 어색합니다. 성령을 주어로 다시 밝혀 ‘그분 위에 머물러 계셨습니다’라고 하면 자연스럽고 지시 관계도 명료합니다.
  terminology: ‘성령’은 요한복음 1:32–33의 문맥 및 영어 POB의 결정을 적절히 반영합니다. 비교 표현은 ‘비둘기처럼’이 적절하며, 출발점은 ‘하늘로부터’로 유지할 수 있습니다. 성령과 예수를 가리키는 존칭 표현은 한국어의 관습적 종교 문체에 맞으며 원문의 의미를 추가하지 않습니다.
  issues:
