id: JHN.1.32
reference: John 1:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
  footnotes:
  - marker: a
    text: Or “as a dove.” The Greek can be rendered either way, though the wording most naturally expresses likeness.
    reason: lexical_alternative
  - marker: b
    text: Or “from heaven.”
    reason: lexical_alternative
translation:
  language: ko
  text: 요한이 이렇게 증언했습니다. “나는 성령이 하늘로부터[b] 비둘기처럼[a] 내려오는 것을 보았습니다. 그리고 성령은 그분 위에 머물러 계셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 ‘비둘기로’로 번역할 수 있습니다. 그러나 그리스어 ὡς는 비교를 표시하므로 ‘비둘기처럼’이 본문의 이미지와 더 정확히 일치합니다.
    reason: lexical_alternative
  - marker: b
    text: 혹은 ‘하늘에서’로 번역할 수 있습니다. ἐξ/ἐκ의 출발점 의미를 살려 ‘하늘로부터’를 선택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεθέαμαι
  english_pob_choice: I have seen
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았노라
  - 보았다
  lexicon: BDAG
  rationale: 그리스어 완전(perfect) 형태의 현재 관련성을 한국어로 자연스럽게 살리기 위해 현재·과거 의미를 전달하는 공손한 과거형 '보았습니다'를 사용했습니다. '보았노라'는 고어적이고 '보았다'는 평서형이지만 공손체 문맥에 덜 어울립니다.
- source_word: τὸ πνεῦμα
  english_pob_choice: the Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 영
  lexicon: BDAG
  rationale: 요한의 침례·표징 맥락(1:32–33)에서 πνεῦμα는 인격적·신적 실체로 읽히므로, 프로젝트 용어집과 영어 POB의 결정에 따라 '성령'으로 번역했습니다. 일반적 비신적 '영'은 문맥상 적절치 않습니다.
- source_word: ὡς περιστερὰν
  english_pob_choice: like a dove
  chosen_korean: 비둘기처럼
  alternatives_korean:
  - 비둘기같이
  - 비둘기로서
  lexicon: BDAG
  rationale: ὡς는 비교를 나타내므로 '비둘기처럼'으로 번역하여 모양·양태의 유사성을 유지했습니다. '비둘기로서'는 실체 동일시로 읽힐 수 있어 과도한 확정화를 피했습니다.
- source_word: ἐξ οὐρανοῦ
  english_pob_choice: out of heaven
  chosen_korean: 하늘로부터
  alternatives_korean:
  - 하늘에서
  - 하늘로부터(또는 '하늘에서')
  lexicon: BDAG
  rationale: ἐξ(ἐκ)는 출발점을 나타내므로 보다 문자적으로 '하늘로부터'를 선택했습니다. '하늘에서'도 가능하지만 본문 이미지의 공간적 이동('out of')을 살리기 위해 '로부터'를 택했습니다.
theological_decisions:
- issue: Identification of τὸ πνεῦμα
  chosen_reading: τὸ πνεῦμα은 문맥상 성령(Holy Spirit)으로 이해함
  alternative_readings:
  - 비신적·일반적 '영'(영혼·기운)으로 읽기
  rationale: 요한복음의 침례·표징 장면과 이어지는 본문(1:33)의 내용은 신적 위임과 성령 세례를 가리키므로, 본문 뜻을 곧게 전달하기 위해 '성령'으로 표기했습니다. 이는 영어 POB의 신학적 판단과 일치합니다.
  doctrine_reference: Translation philosophy §1; John 1:32–33 문맥
