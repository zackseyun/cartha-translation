    rationale: 그리스어 τὸ πνεῦμα의 문법 성은 중성이지만, 한국어에서 성령을 ‘그것’으로 받는 것은 부자연스럽고 비인격화하는 뉘앙스를 냅니다. 영어의 중성 대명사 선택을 한국어에 기계적으로 옮겨서는 안 됩니다.
  - severity: medium
    issue: ‘그 위에’의 지시 대상이 불명확함
    rationale: ἐπ’ αὐτόν은 성령이 예수 위에 머물렀다는 뜻입니다. ‘그 위에’는 선행사와 역할 관계가 불분명하므로 ‘그분 위에’로 명시하는 것이 안전합니다.
  - severity: low
    issue: 각주의 표지가 해당 어구와 떨어져 있고 순서가 뒤바뀜
    rationale: 비교 표현에는 a, ‘하늘로부터’에는 b를 각각 바로 붙여 독자가 각주 대상을 즉시 알 수 있게 해야 합니다.
