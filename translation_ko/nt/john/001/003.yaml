id: JHN.1.3
reference: John 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
  footnotes:
  - marker: a
    text: 'Or, beginning with verse 4: ''What has come into being in him was life.'''
    reason: alternative_reading
translation:
  language: ko
  text: 모든 것이 그를 통하여[a] 생겨났고, 그가 없이는 생겨난 것이 단 하나도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 4절부터 읽어 '그 안에서 생겨난 것이 생명이었다'라고 시작할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  english_pob_choice: All things
  chosen_korean: 모든 것
  alternatives_korean:
  - 만물
  - 모든 것이
  - 모두
  lexicon: BDAG
  rationale: 그리스어 중성 복수의 포괄적 범위를 한국어로 자연스럽게 전달하기 위해 '모든 것'을 선택했습니다. '만물'은 고전적이고 문어적 뉘앙스가 강하며, '모든 것이'도 가능하나 본문 맥락에서 이어지는 서술적 어투를 유지하기 위해 주격 조사 없이 기본형 '모든 것'을 사용하였습니다.
- source_word: δι’ αὐτοῦ
  english_pob_choice: through him
  chosen_korean: 그를 통하여
  alternatives_korean:
  - 그를 통해
  - 그로 말미암아
  - 그에 의하여
  lexicon: BDAG
  rationale: διά의 관격 표시는 도구·매개로서의 '통하여/through' 의미를 갖습니다. 한국어에서 공적·고전적 어조를 유지하면서 명확한 수단성을 드러내기 위해 '그를 통하여'를 선택했습니다. '그를 통해'는 구어적이고 '그로 말미암아'는 다소 고어적이라 보조 선택으로 남깁니다.
- source_word: ἐγένετο
  english_pob_choice: came into being
  chosen_korean: 생겨났습니다
  alternatives_korean:
  - 존재하게 되었습니다
  - 만들어졌습니다
  - '생겨났습니다(과거완료 뉘앙스: 생겨난)'
  lexicon: BDAG
  rationale: γίνομαι의 존재론적 '존재하게 되다/생겨나다' 의미를 살려 '생겨났습니다'를 선택했습니다. '만들어졌습니다'는 장인적 제작 이미지를 줄 수 있어 피했고, '존재하게 되었습니다'는 길어질 수 있으므로 간결한 '생겨났습니다'를 택했습니다.
- source_word: χωρὶς αὐτοῦ
  english_pob_choice: apart from him
  chosen_korean: 그가 없이는
  alternatives_korean:
  - 그 없이
  - 그 없이에는
  - 그로부터 떨어져서는
  lexicon: BDAG
  rationale: χωρὶς의 분리·부재 의미를 전달하기 위해 '그가 없이는'을 사용했습니다. '그 없이'도 가능하지만, 본문 어조와 문장 구조상 '그가 없이는'이 더 명확하고 격식에 맞습니다.
- source_word: οὐδὲ ἕν
  english_pob_choice: not even one thing
  chosen_korean: 단 하나도 없습니다
  alternatives_korean:
  - 하나도 없다
  - 아무것도 없다
  - 조금도 아니다
  lexicon: BDAG
  rationale: οὐδὲ ἕν의 강조적 부정을 한국어에서 자연스럽고 강하게 전달하기 위해 '단 하나도 없습니다'를 선택했습니다. '아무것도 없다'는 의미상 가깝지만, 원어의 'ἕν(한 가지)' 강조를 살려 '단 하나' 표현을 택했습니다.
- source_word: ὃ γέγονεν
  english_pob_choice: that has come into being
  chosen_korean: 생겨난 것
  alternatives_korean:
  - 이미 생겨난 것
  - 생겨난 바
  - 생겨난 것(완료적 뉘앙스)
  lexicon: BDAG
  rationale: 완료상 γέγονεν의 '이미 생겨나 계속된 상태' 뉘앙스를 한국어로 음미하여 '생겨난 것'으로 처리했습니다. 본 구(句)는 3절에 결속시키는 판독을 따르므로 '그가 없이는 생겨난 것이 단 하나도 없습니다'의 형태로 자연스럽게 결합됩니다.
theological_decisions:
- issue: Relation of the final clause ὃ γέγονεν
  chosen_reading: 'Attach the clause to verse 3: ''…그가 없이는 생겨난 것이 단 하나도 없습니다.'''
  alternative_readings:
  - 'Begin verse 4 with the clause: ''그 안에서 생겨난 것이 생명이었다.'' (즉 4절 시작으로 ὃ γέγονεν을 취함)'
  rationale: '원래의 그리스 필사본은 문장 부호가 결여되어 있어 ὃ γέγονεν을 3절에 결속시킬지 4절로 넘길지 두 가지 합리적 판독이 존재합니다. 본 번역은 영문 POB의 판단을 따라 3절에 결속시키는 판독을 택하여 ''모든 것이 그를 통하여 생겨났고, 그가 없이는 생겨난 것이 단 하나도 없습니다''로 번역했습니다. 그러나 원문상의 불확실성을 지우지 않기 위해 대체 판독을 각주(a)에 남깁니다(POB 번역 철학 §3: 원문상의 신학적 긴장을 불필요히 해소하지 말라).'
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it; preserve alternatives in a footnote where the source is genuinely ambiguous.'
