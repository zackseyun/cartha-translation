  rationale: 대조 접속사 ἀλλά의 기능을 ‘오히려’로 명시하고, ἵνα 목적절 뒤에 주절 동사가 생략된 원문 구조를 각주에서 정확하고 자연스러운 한국어로 설명했습니다. ‘왔습니다’는 영어 POB와 마찬가지로 문맥상 보충하되, 원문에 명시된 동사인 것처럼 보이지 않도록 했습니다.
