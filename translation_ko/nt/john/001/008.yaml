  source_fidelity: 본문은 요한이 ‘그 빛’이 아니며 빛에 관해 증언하는 역할을 했다는 핵심을 충실히 옮깁니다. 그러나 원문의 ἀλλά가 나타내는 분명한 대조는 ‘-고’보다 ‘오히려’로 드러내는 편이 낫습니다. 또한 ‘왔습니다’는 원문에 명시된 동사가 아니라 앞절 문맥에서 보충한 말이므로 각주가 이를 더 정확히 설명해야 합니다.
