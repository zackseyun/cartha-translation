source:
  edition: SBLGNT
  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
  footnotes:
  - marker: a
    text: Or more literally, 'He was not the light, but that he might bear witness about the light.' The Greek leaves the verb in the second clause implied from the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 빛이 아니었습니다. 오히려 그 빛에 관해 증언하러 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 두 번째 절에서 ‘증언하도록’이라는 목적절만 제시하고 주절 동사를 명시하지 않습니다. 번역의 ‘왔습니다’는 앞절의 문맥에 따라 보충한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  english_pob_choice: was not
  chosen_korean: 아니었습니다
  alternatives_korean:
  - 있지 않았습니다
  - 자신이 ~이 아니었습니다
  lexicon: BDAG
  rationale: οὐκ ἦν의 부정된 과거 상태를 한국어의 공손한 과거 존댓말로 옮겼습니다. 영어 'was not'과 동일한 정보(과거의 부정)를 전달하므로 '아니었습니다'가 자연스럽습니다. 맥락상 주어는 문장 전체에서 분명하므로 동사부정만으로 충분합니다.
- source_word: ἐκεῖνος
  english_pob_choice: He
  chosen_korean: 그는
  alternatives_korean:
  - 그 사람은
  - 저 사람은
  - 그분은
  lexicon: BDAG
  rationale: 요한 복음의 서론에서 ἐκεῖνος는 강한 인칭지시적 역할을 하므로 한국어의 자연스러운 인칭 대명사 '그는'을 사용했습니다. 원문 의미를 해치지 않으면서 평이한 현대 한국어 문체를 유지합니다. 예배적 존칭 '그분'은 본문이 예수 대신 증언자(요한)를 말하므로 불필요한 높임을 피하기 위해 배제했습니다.
- source_word: τὸ φῶς
  english_pob_choice: the light
  chosen_korean: 그 빛
  alternatives_korean:
  - 빛
  - 그 빛이
  - 그 광휘
  lexicon: BDAG
  rationale: 정관사를 포함한 표현으로, 서문의 특정한 계시적 '빛'을 가리킵니다. 한국어에서는 관념적·특정 대상을 분명히 하기 위해 '그 빛'으로 처리해 원문의 한정성을 살렸습니다. 문장 첫머리의 반복을 피하고자 첫 절에서는 '빛'으로 줄일 수도 있으나, 명확성을 위해 두 절 모두에서 동일 대상임을 드러냈습니다.
- source_word: ἀλλ’ ἵνα
  english_pob_choice: but came to
  chosen_korean: …하러 왔습니다
  alternatives_korean:
  - …하기 위하여
  - 그러나 …하려고
  - 대신 …하기 위해
  lexicon: BDAG
  rationale: ἀλλὰ ἵνα는 대조적 목적을 표하는 구조로, 그 뒤의 동사가 문맥에서 생략되어 있습니다. 영어 POB가 문맥적 보충으로 'came to'를 선택한 것과 같이 한국어도 목적과 동작을 자연스럽게 연결하는 표현 '증언하러 왔습니다'로 보충하여 번역했습니다. 직역적 '…하기 위하여'도 가능하지만 현대 한국어 가독성을 고려해 동작을 드러내는 구문을 택했습니다.
- source_word: μαρτυρήσῃ
  english_pob_choice: bear witness
  chosen_korean: 증언하다/증언하러 오다
  alternatives_korean:
  - 증거하다
  - 증언을 하다
  - 증거를 바라다
  lexicon: BDAG
  rationale: μαρτυρέω의 법정적·증언적 어감을 한국어 '증언'으로 전달했습니다. '증언하러 왔습니다'는 ἀλλ’ ἵνα의 목적 구문을 보충한 형태로, 영어 'bear witness'의 검사·증언적 뉘앙스를 유지합니다.
- source_word: περὶ τοῦ φωτός
  english_pob_choice: about the light
  chosen_korean: 그 빛에 관해
  alternatives_korean:
  - 빛에 관하여
  - 빛에 대해서
  - 그 빛에 대해
  lexicon: BDAG
  rationale: περί + 소유격의 의미를 '…에 관해/…에 대해'로 옮겨 자연스러운 한국어 전치구구를 사용했습니다. 원문이 특정한 '빛'을 가리키므로 '그 빛에 관해'로 처리해 의미의 정확성을 살렸습니다.
theological_decisions:
- issue: Identity and role of John relative to the true light
  chosen_reading: 이 구절은 요한(증언자) 자신이 그 빛이 아님을 부정하고, 그의 목적이 그 빛에 대해 증언하는 것이었음을 밝힙니다.
  alternative_readings:
  - 더 직역하면 '그는 빛이 아니었으나, 빛에 관해 증언하기 위함이다'처럼 ἀλλ᾽ ἵνα + 접속법의 목적성을 강하게 살릴 수 있습니다.
  rationale: 원문 그리스어는 두 번째 절의 동사를 문맥상으로 생략(ἐλλipsis)하고 목적을 나타내는 ἵνα 구문을 사용합니다. 영어 POB는 'came to bear witness'로 그 동사를 보충하였고, 본 한국어 번역도 동일한 보충을 하여 독자가 요한의 역할(증언자)을 명확히 이해하도록 했습니다. 과도한 신학적 해석을 추가하지 않고 원문의 대조적 목적을 전달하는 데 중점을 두었습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
