  lexicon: BDAG
  rationale: μένω의 일관 번역 「거하다」를 유지한다.
- source_word: χωρὶς ἐμοῦ
  english_pob_choice: apart from me
  chosen_korean: 나를 떠나서는
  alternatives_korean:
