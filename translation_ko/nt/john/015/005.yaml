  source_fidelity: 본문의 핵심 대응은 대체로 정확합니다. ἄμπελος/κλήματα를 ‘포도나무/가지’로, 상호 내주 표현을 ‘내 안에 … 그 안에’로, χωρὶς ἐμοῦ를 ‘나를 떠나서는’으로 옮긴 것은 원문에 충실합니다. 다만 각주 표지가 문장 끝에 함께 놓여 있어 해당 어구와의 연결이 불분명하며, a 각주의 대안 표현은 원문의 상호적 구조를 충분히 반영하지 못합니다.
  naturalness: ‘내가 곧 포도나무이고’도 이해되지만, 은유적 동일시를 진술하는 문맥에서는 ‘나는 포도나무요’가 더 자연스럽고 간결한 현대 한국어 성경 문체입니다. ‘거하다’는 현대 독자에게 다소 문어적이지만, 요한복음의 지속적 관계 언어를 일관되게 보존하는 번역으로 적절합니다.
  terminology: ‘포도나무’, ‘가지’, ‘열매’, ‘거하다’는 모두 적절합니다. ‘헬라어’보다 현대 학술·번역 주석에서는 ‘그리스어’가 더 표준적입니다. 남성 단수 αὐτῷ에 관한 각주는 본문 한국어에 성별 표지가 없다는 점을 고려하여, 문법 형태와 대표적 용법만 설명해야 합니다.
