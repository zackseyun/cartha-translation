  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
  footnotes:
  - marker: a
    text: Or, 'they would not be guilty of sin' or 'they would not have guilt.' The Greek more literally says, 'they would not have sin.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they have no pretext' for their sin.
    reason: lexical_alternative
  - marker: c
    text: Or 'concerning their sin'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 와서 그들에게 말하지 않았더라면, 그들에게 죄가 없었을 것입니다. 그러나 이제 그들은 자기 죄에 대하여 변명할 여지가 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「그들은 그 죄에 대한 책임이 없었을 것이다」, 「그들에게 죄책이 없었을 것이다」. 헬라어는 더 문자적으로 「그들에게 죄가 없었을 것이다」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「자기 죄에 대한 핑계」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「그들의 죄에 관하여」.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  english_pob_choice: would not have sin
  chosen_korean: 죄가 없었을 것이다
  alternatives_korean:
  - 죄책이 없었을 것이다
  lexicon: BDAG
  rationale: 문자적 「죄를 가지지 않았을 것이다」를 한국어로 자연스럽게 「죄가 없었을 것이다」로 옮긴다.
- source_word: πρόφασιν
  english_pob_choice: excuse
  chosen_korean: 변명
  alternatives_korean:
  - 핑계
  lexicon: BDAG
  rationale: 표준 등가어.
