  to: 내가 와서 그들에게 말하지 않았더라면, 그들에게 죄가 없었을 것입니다. 그러나 이제 그들은 자기 죄에 대하여 변명할 여지가 없습니다.[a][b][c]
  rationale: 조건문의 ‘죄가 없었을 것입니다’는 원문의 ἁμαρτίαν οὐκ εἴχοσαν을 과도하게 해석하지 않고 보존합니다. 후반부만 ‘변명할 여지’로 다듬어 πρόφασις와 οὐκ ἔχουσιν의 결합을 자연스러운 현대 한국어로 반영했습니다. 각주는 본문의 신학적 함의를 확정하지 않으면서 가능한 어휘적 대안을 제공합니다.
