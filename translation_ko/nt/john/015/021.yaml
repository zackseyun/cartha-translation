  terminology: 「내 이름 때문에」와 「나를 보내신 분」은 각각 διὰ τὸ ὄνομά μου와 τὸν πέμψαντά με를 적절히 보존합니다. 「분」은 존칭 문맥에서 자연스럽고, 원문에 없는 「아버지」를 보충하지 않습니다.
