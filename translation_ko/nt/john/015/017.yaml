review_pass:
  verdict: revise
  source_fidelity: 원문의 ταῦτα(복수)는 ‘이것들’로, ἐντέλλομαι ὑμῖν은 ‘여러분에게 명하다’로 적절히 반영되었습니다. ἵνα ἀγαπᾶτε ἀλλήλους는 목적을 나타내는 ‘여러분이 서로 사랑하도록’으로 옮기는 것이 충실합니다. 다만 현행 ‘명하는 것은 … 하려는 것입니다’는 주어가 무엇을 의도하는지 불분명하고, ἵνα절의 목적 관계도 다소 어색하게 표현합니다.
  naturalness: ‘내가 이것들을 여러분에게 명하는 것은, 여러분이 서로 사랑하게 하려는 것입니다’는 현대 표준어에서 어색하며, 특히 ‘명하는 것은 … 하려는 것입니다’의 결합이 자연스럽지 않습니다. ‘… 사랑하도록 하기 위해서입니다’가 합쇼체의 격식과 문장 흐름을 유지합니다.
  terminology: ‘명하다’는 ἐντέλλομαι의 직접성과 권위 있는 어조를 보존하는 적절한 표현입니다. ‘서로 사랑하다’는 ἀγαπᾶτε ἀλλήλους의 상호성을 자연스럽게 나타냅니다. 대체 번역 각주도 본문의 목적 용법을 단정하지 않고 내용에 가까운 이해 가능성을 보존하도록 다듬었습니다.
  issues:
  - severity: medium
    issue: 본문의 ‘명하는 것은 … 하려는 것입니다’ 구문이 어색하고 목적 관계의 주체를 불명확하게 합니다.
    rationale: 원문은 ‘내가 이것들을 여러분에게 명한다, যাতে/그 결과 여러분이 서로 사랑하도록’이라는 구조입니다. 한국어에서는 ‘…하도록 하기 위해서입니다’로 목적 관계를 명시하는 편이 자연스럽고 충실합니다.
