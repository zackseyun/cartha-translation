  terminology: ἔργα는 요한복음의 폭넓은 용례를 보존하는 「일들」로 유지했습니다. 「죄가 없었을 것입니다」는 ἁμαρτίαν οὐκ εἴχοσαν의 ‘죄를 가지다’라는 표현을 직역적으로 보존하며, 각주에서 책임/유죄라는 해석적 대안을 제시합니다. 「아버지」는 원문의 관계 표현을 그대로 반영합니다.
