  source_fidelity: 「다 보고도 미워하였습니다」의 -고도는 원문의 단순 병렬 καί...καί에 없는 양보 관계를 더합니다. 또한 현행 각주 a는 ‘죄가 없었을 것입니다’에, 각주 b는 두 동사의 병렬에 각각 붙어야 합니다.
