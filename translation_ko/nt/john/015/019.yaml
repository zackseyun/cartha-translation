  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
  footnotes:
  - marker: a
    text: Or 'of the world' for 'from the world' (ἐκ τοῦ κόσμου); the Greek preposition can express source or belonging. The main text keeps the repeated preposition visible.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 세상에 속해 있었다면,[a] 세상은 자기 것을 사랑했을 것입니다. 그러나 여러분이 세상에 속하지 않고, 오히려 내가 여러분을 세상에서 택해 냈기 때문에, 바로 그 때문에 세상이 여러분을 미워합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상에 속해’와 ‘세상에서’는 모두 헬라어 ἐκ τοῦ κόσμου의 번역입니다. 이 표현은 문맥에 따라 출처와 소속의 뉘앙스를 함께 나타낼 수 있으며, 본문에서는 세 차례 반복됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  english_pob_choice: from the world
  chosen_korean: 세상에 속해
  alternatives_korean:
  - 세상으로부터
  - 세상에서 난
  lexicon: BDAG
  rationale: ἐκ는 출처·소속의 이중 의미를 가지며, 한국어 「~에 속하다」로 가장 자연스럽다.
- source_word: ἐφίλει
  english_pob_choice: would love
  chosen_korean: 사랑하다
  alternatives_korean:
  - 아끼다
  lexicon: BDAG
  rationale: φιλέω는 가족적·우정적 사랑이나, 본문에서는 「자기 것을 끼고 사랑한다」는 의미로 ἀγαπάω와 큰 차이 없이 「사랑하다」로 옮긴다.
