  to: 내 안에 거하십시오. 나도 여러분 안에 거하겠습니다. 가지가 포도나무에 거하지 않으면 스스로 열매를 맺을 수 없는 것처럼, 여러분도 내 안에 거하지 않으면 열매를 맺을 수 없습니다.[a]
