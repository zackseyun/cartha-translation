  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
  footnotes:
  - marker: a
    text: Or 'Abide in me, and I in you.' The verb μένω can also be rendered 'abide,' a traditional English rendering that emphasizes ongoing dwelling or continuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 안에 거하십시오. 나도 여러분 안에 거하겠습니다. 가지가 포도나무에 거하지 않으면 스스로 열매를 맺을 수 없는 것처럼, 여러분도 내 안에 거하지 않으면 열매를 맺을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 μένω는 「머무르다」 또는 「지속하다」로도 옮길 수 있습니다. 여기서는 요한복음 15:1-11에서 반복되는 이 동사를 일관되게 나타내기 위해 「거하다」로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε
  english_pob_choice: remain
  chosen_korean: 거하십시오
  alternatives_korean:
  - 머무르십시오
  - 지속하십시오
  lexicon: BDAG
  rationale: μένω는 요한복음의 핵심 동사로, 15:1-11에 10회 반복되며 지속적·관계적 거주를 가리킨다. 한국어 「거하다」로 통일하여 어휘유희와 신학적 무게를 보존한다.
