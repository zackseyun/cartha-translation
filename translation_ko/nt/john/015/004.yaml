review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 κἀγὼ ἐν ὑμῖν은 동사가 생략된 병렬 구문입니다. 초안의 「그러면」은 원문에 없는 조건·결과 관계를 명시하므로 삭제하는 것이 적절합니다. 한국어에서는 생략된 동사를 자연스럽게 보충하여 「나도 여러분 안에 거하겠습니다」로 옮길 수 있습니다. 마지막 절의 「열매를 맺을 수 없습니다」는 앞 절의 능력 및 ‘열매를 맺다’를 자연스럽게 보충한 것으로 원문의 함의를 충실히 전달합니다.
  naturalness: 「거하십시오」는 현대 일상어보다는 성경적·문어적 어감을 지니지만, 본문에서 반복되는 μένω를 일관되게 나타내며 합쇼체에도 맞습니다. 「그러면」을 삭제하면 문장이 더 간결하고 원문의 병렬 구조에 가까워집니다.
  terminology: 「거하다」는 이 단락의 반복 핵심어 μένω를 일관되게 옮기는 선택으로 수용 가능합니다. 각주에서는 현대 학술 용례에 맞게 「헬라어」를 「그리스어」로 고치고, 실제로 제시하는 어휘 대안을 밝혀 각주 사유(lexical_alternative)에 부합하게 합니다.
  issues:
  - severity: medium
    issue: 첫 문장에 「그러면」이 첨가됨
    rationale: κἀγὼ ἐν ὑμῖν은 ‘그리고 나도 너희 안에’라는 동사 생략의 병렬 구문입니다. 「그러면」은 원문에 명시되지 않은 조건·결과 연결을 추가합니다.
  - severity: low
    issue: 각주가 lexical_alternative인데 대안 번역을 제시하지 않음
    rationale: 현 각주는 「거하다」를 채택한 이유만 설명합니다. 「머무르다」 등의 가능한 대안을 밝혀 각주의 분류와 내용을 일치시키는 것이 좋습니다.
  - severity: low
    issue: 각주의 「헬라어」 용어
    rationale: 표준 현대 한국어 성서학 용례에서는 「그리스어」가 더 자연스럽고 중립적입니다.
