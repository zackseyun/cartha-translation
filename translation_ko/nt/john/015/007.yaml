  verdict: revise
  source_fidelity: 조건절의 두 μένω를 같은 말로 반복하고, ὃ ἐὰν θέλητε를 ‘원하는 것은 무엇이든’으로 옮겨 원문의 무제한적 목적어를 정확히 드러내는 것이 좋습니다. γένηται ὑμῖν도 ‘여러분에게 이루어질 것입니다’로 자연스럽고 충실하게 유지됩니다.
  naturalness: 초안의 ‘무엇이든 원하는 대로 구하십시오’는 ‘원하는 방식대로’라는 뜻으로도 읽힐 수 있습니다. ‘여러분이 원하는 것은 무엇이든 구하십시오’가 현대 표준어 합쇼체로 더 명료하고 자연스럽습니다. ‘머무르다’는 현대어에서 ‘거하다’보다 자연스럽고, 반복도 보존합니다.
  terminology: ‘내 안에’, ‘내 말’, ‘구하십시오’는 적절합니다. ‘말’은 여기서 ῥήματα의 복수성을 한국어의 집합적 단수로 자연스럽게 처리합니다. 각주 a는 실제 본문 선택과 구별되는 대안을 제시하도록 고치고, 각주 표지는 해당 어구 바로 뒤에 둡니다.
