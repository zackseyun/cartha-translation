    issue: The footnote’s quoted alternative is incomplete.
    rationale: It quotes only the two past-tense clauses but leaves out μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ ('remain in my love'), although the English audit-trail alternative covers the whole verse.
  - severity: medium
    issue: The footnote inaccurately characterizes the Korean rendering as completed/perfect in meaning.
    rationale: 사랑하였습니다 is an ordinary Korean past-tense expression; it does not grammatically encode an English-style present perfect. The Greek aorists may be translated naturally with Korean past forms without a note that overstates aspectual meaning.
  - severity: low
    issue: 거하십시오 is less idiomatic than 머무르십시오 in this context.
    rationale: 머무르십시오 naturally expresses remaining in a state or sphere and is modern formal-polite Korean.
