id: JHN.12.2
reference: John 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
  footnotes:
  - marker: a
    text: Or, more literally, 'one of those reclining with him.' Reclining was the customary posture for a formal meal.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 거기서 예수님을 위해 잔치를 차렸습니다. 마르다는 시중을 들고 있었고, 나사로는 예수님과 함께 식탁에 앉은 사람들 가운데 한 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예수님과 함께 기대어 앉은 사람들 가운데 한 사람’입니다. 당시의 공식 식사에서는 이런 기대는 자세가 일반적이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  english_pob_choice: made
  chosen_korean: 차렸습니다
  alternatives_korean:
  - 만들었습니다
  - 준비했습니다
  - 베풀었습니다
  lexicon: BDAG
  rationale: δεῖπνον과 함께 쓰인 ἐποίησαν은 단순 제작보다 식사를 마련하는 뜻이므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘차리다’를 택했습니다.
- source_word: δεῖπνον
  english_pob_choice: dinner
  chosen_korean: 잔치
  alternatives_korean:
  - 저녁식사
  - 식사
  - 만찬
  lexicon: BDAG
  rationale: 이 장면은 단순한 끼니보다 예수님을 위한 공식적 환대를 보여 주므로, 한국어로는 ‘잔치’가 문맥을 가장 잘 드러냅니다.
- source_word: διηκόνει
  english_pob_choice: was serving
  chosen_korean: 시중을 들고 있었고
  alternatives_korean:
  - 섬기고 있었고
  - 봉사하고 있었고
  - 접대하고 있었고
  lexicon: BDAG
  rationale: 미완료 시상은 계속되는 동작을 가리키므로 진행형을 살렸고, 식탁 자리에서의 실제 돌봄을 드러내기 위해 ‘시중을 들다’로 옮겼습니다.
- source_word: ἐκ τῶν ἀνακειμένων σὺν αὐτῷ
  english_pob_choice: one of those reclining at the table with him
  chosen_korean: 예수님과 함께 식탁에 앉은 사람들 가운데 한 사람이었습니다
  alternatives_korean:
  - 예수님과 함께 기대어 앉은 사람들 가운데 한 사람이었습니다
  - 예수님과 함께 식사 자리에서 기대어 있던 사람들 가운데 한 사람이었습니다
  lexicon: BDAG
  rationale: ἀνάκειμαι의 당시 식사 관습을 직접 옮기면 ‘기대어 앉다’가 될 수 있지만, 현대 독자에게는 의미 전달이 약하므로 본문 뜻을 분명히 하는 방식으로 풀어 옮겼습니다.
theological_decisions:
- issue: 예수님의 식사 자리에서의 자세를 어떻게 한국어로 드러낼지
  chosen_reading: ‘식탁에 앉은’으로 옮기되, 원문의 ‘reclining’ 관습은 별도 각주로 보완합니다.
  alternative_readings:
  - ‘기대어 앉은’
  - ‘식탁에 기대어 있는’
  rationale: 본문의 핵심은 나사로가 예수님과 함께 식사 자리에 있었다는 사실이며, 현대 한국어 본문 가독성을 해치지 않으면서 문화적 배경은 각주로 보완하는 편이 적절합니다.
  doctrine_reference: 성경 문화배경 전달 원칙
