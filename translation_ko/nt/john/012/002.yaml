revisions:
- from: 그들은 거기서 예수님을 위해 잔치를 차렸습니다. 마르다는 시중을 들고 있었고, 나사로는 예수님과 함께 식탁에 앉은 사람들 가운데 한 사람이었습니다.[a]
  to: 그러므로 그들은 거기서 예수님을 위하여 식사를 마련하였습니다. 마르다는 시중을 들고 있었고, 나사로는 예수님과 함께 식탁에 기대어 앉아 있던 사람들 가운데 한 사람이었습니다.[a]
  rationale: δεῖπνον을 의미 범위에 맞게 ‘식사’로 고치고, οὖν을 ‘그러므로’로 반영했습니다. 미완료 동사 διηκόνει는 진행 중인 행동을 나타내도록 유지했습니다. ἀνακειμένων은 본문에서 ‘식탁에 기대어 앉아 있던’으로 옮기고, 각주에서 당시 식사 관습을 간결히 설명했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:44Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 δεῖπνον을 ‘잔치’로 옮겨 통상적인 주된 식사라는 원어의 의미를 과장하며, οὖν의 연결 기능도 본문에서 빠져 있습니다. 또한 ἀνακειμένων의 ‘기대어 앉다/비스듬히 누워 식사하다’라는 자세를 본문에서 ‘식탁에 앉은’으로 평준화합니다.
  naturalness: ‘식사를 마련하였습니다’, ‘시중을 들고 있었고’, ‘식탁에 기대어 앉아 있던 사람들’은 현대 표준어 합쇼체로 자연스럽고, 원문의 식사 관습도 무리 없이 전달합니다.
  terminology: ‘식사’는 δεῖπνον에 적절하며 ‘잔치’가 함축하는 축제성·성대한 연회의 과장을 피합니다. ‘시중을 들다’는 여기서 식사를 섬기는 διηκόνει에 적합합니다. ‘식탁에 기대어 앉아 있던’은 ἀνακειμένων의 문화적으로 특정된 식사 자세를 보존합니다.
  issues:
  - severity: medium
    issue: δεῖπνον을 ‘잔치’로 번역함
    rationale: δεῖπνον은 주된 식사, 흔히 저녁 식사를 가리키지만, 원문 자체가 잔치나 연회를 뜻하는 말은 아닙니다. ‘잔치’는 규모와 성격을 과장할 수 있습니다.
  - severity: low
    issue: οὖν의 연결 표현이 누락됨
    rationale: οὖν은 앞 문맥에 이어지는 서술임을 표시합니다. 한국어 ‘그러므로’ 또는 ‘그래서’로 반영하는 것이 적절합니다.
  - severity: medium
    issue: ἀνακειμένων을 ‘식탁에 앉은’으로 평준화함
    rationale: 원문은 당시 정식 식사에서 기대어 앉는 자세를 가리킵니다. 각주만으로 보완하기보다 본문에도 ‘기대어 앉아’로 반영하면 원문의 구체성을 보존할 수 있습니다.
  revised_text: 그러므로 그들은 거기서 예수님을 위하여 식사를 마련하였습니다. 마르다는 시중을 들고 있었고, 나사로는 예수님과 함께 식탁에 기대어 앉아 있던 사람들 가운데 한 사람이었습니다.[a]
  revised_footnotes:
