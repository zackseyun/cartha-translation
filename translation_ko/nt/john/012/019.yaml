id: JHN.12.19
reference: John 12:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
  footnotes:
  - marker: a
    text: Or 'everyone has gone after him.' The Greek says 'the world,' likely as rhetorical exaggeration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 바리새인들이 서로 말했습니다. 「여러분도 보시다시피, 아무것도 이루지 못하고 있습니다. 보십시오, 세상이 그를 따라갔습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모두가 그를 따라갔습니다.’ 그리스어는 ‘세상’이라고 말하며, 여기서는 바리새인들의 과장된 표현으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Φαρισαῖοι
  english_pob_choice: So the Pharisees
  chosen_korean: 그러자 바리새인들이
  alternatives_korean:
  - 그래서 바리새인들이
  - 그런즉 바리새인들이
  lexicon: SBLGNT / BDAG
  rationale: οὖν의 이어짐을 자연스러운 한국어 담화 표지로 옮겨 앞선 사건에 대한 반응임을 살렸습니다.
- source_word: πρὸς ἑαυτούς
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 서로에게
  - 자기들끼리
  lexicon: BDAG
  rationale: 바리새인들이 집단 안에서 주고받는 말이라는 재귀적·상호적 뜻을 간결하게 반영했습니다.
- source_word: Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν
  english_pob_choice: You see that you are accomplishing nothing
  chosen_korean: 보십시오, 여러분은 아무것도 이루지 못하고 있습니다
  alternatives_korean:
  - 보십시오, 여러분은 아무런 성과도 내지 못하고 있습니다
  - 보십시오, 여러분은 아무 유익도 얻지 못하고 있습니다
  lexicon: BDAG
  rationale: θεωρεῖτε를 단순 명령형처럼 처리하지 않고, 상대를 몰아붙이는 반문적 진술로 읽어 한국어에서도 비난의 뉘앙스를 살렸습니다. ὠφελεῖτε οὐδέν은 ‘유익을 얻다’보다 ‘이루다/성과를 내다’가 문맥상 더 자연스럽습니다.
- source_word: ἴδε ὁ κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν
  english_pob_choice: Look—the world has gone after him.
  chosen_korean: 보십시오—온 세상이 그를 따라가고 있습니다.
  alternatives_korean:
  - 보십시오—세상이 그 뒤를 따라갔습니다.
  - 보십시오—온 세상이 그에게로 갔습니다.
  lexicon: BDAG
  rationale: ἴδε의 돌출된 강조를 ‘보십시오’로 옮겼고, κόσμος는 문맥상 과장된 총칭으로 읽어 ‘온 세상’으로 살렸습니다. ὀπίσω αὐτοῦ ἀπῆλθεν은 ‘뒤를 따라가다’의 관용적 흐름을 한국어 동사구로 자연스럽게 재현했습니다.
theological_decisions:
- issue: κόσμος의 범위와 과장법
  chosen_reading: ‘온 세상’으로 옮기되, 실제로는 과장된 비난의 표현이라는 점을 본문 어휘 수준에서 유지했습니다.
  alternative_readings:
  - ‘모두가 그를 따라가고 있습니다’
  - ‘온 사람이 그를 따라가고 있습니다’
  rationale: 요한복음의 κόσμος를 단순히 ‘사람들’로 좁히면 원문의 수사적 과장을 약화시킵니다. 본문은 바리새인들의 좌절 섞인 과장으로서 ‘온 세상’을 말하는 효과를 유지하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
