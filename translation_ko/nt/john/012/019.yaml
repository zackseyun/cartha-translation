revisions:
- from: 그러자 바리새인들이 서로 말했습니다. 「보십시오, 여러분은 아무것도 이루지 못하고 있습니다. 보십시오—온 세상이 그를 따라가고 있습니다.」[a]
  to: 그러자 바리새인들이 서로 말했습니다. 「여러분도 보시다시피, 아무것도 이루지 못하고 있습니다. 보십시오, 세상이 그를 따라갔습니다.」[a]
  rationale: οὖν의 전환은 ‘그러자’로, πρὸς ἑαυτούς의 상호 발화는 ‘서로 말했습니다’로 유지했습니다. Θεωρεῖτε는 명령으로 단정하지 않고 ‘여러분도 보시다시피’로 옮겨 복수 청자를 향한 질책성 진술을 반영했습니다. κόσμος는 ‘세상’으로 보존하고 과장적 의미는 각주로 처리했으며, ἀπῆλθεν은 완료된 사건으로 ‘따라갔습니다’로 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:41Z'
review_pass:
  verdict: revise
  source_fidelity: ‘온 세상’은 κόσμος의 과장적 범위를 반영할 수 있으나, 원문의 어휘 자체는 ‘세상’이므로 본문에서 ‘온’을 더하지 않는 편이 더 충실합니다. 또한 ἀπῆλθεν은 완료된 사건을 가리키므로 ‘따라가고 있습니다’보다 ‘따라갔습니다’가 적절합니다.
  naturalness: 합쇼체 인용문에서 ‘여러분도 보시다시피’는 서로에게 하는 질책성 발언을 자연스럽게 나타냅니다. 두 번째 ἴδε는 ‘보십시오’로 유지하여 갑작스러운 주의 환기의 힘을 살렸습니다.
  terminology: ‘바리새인들’, ‘세상’, ‘그를 따라갔습니다’는 표준적이고 원문에 충실한 표현입니다. κόσμος의 수사적 과장은 본문에 해석어를 보태지 않고 각주에서 설명합니다.
  issues:
  - severity: medium
    issue: ‘온 세상’이 κόσμος에 해석적 한정어를 더합니다.
    rationale: 원문은 ὁ κόσμος(‘세상’)라고 하며, 발화의 과장성은 유지하되 본문에서 ‘온’을 첨가하지 않는 것이 어휘적 대응과 영어 POB의 방침에 더 맞습니다.
  - severity: medium
    issue: ‘그를 따라가고 있습니다’가 ἀπῆλθεν의 완료된 사건성을 지속 진행으로 바꿉니다.
    rationale: 아오리스트 ἀπῆλθεν은 여기서 사람들이 예수님을 따라가 버린 것으로 보이는 결과를 가리킵니다. 한국어에서는 ‘그를 따라갔습니다’가 안전합니다.
  - severity: low
    issue: 기존 각주는 본문이 이미 ‘온 세상’으로 번역되었다고 설명하여, ‘직역하면 세상’이라는 설명과 본문 사이의 거리를 크게 만듭니다.
    rationale: 본문을 ‘세상’으로 보존하고, 그것이 바리새인들의 과장된 표현이라는 점을 각주로 설명하면 원문과 주석의 역할이 분명해집니다.
  revised_text: 그러자 바리새인들이 서로 말했습니다. 「여러분도 보시다시피, 아무것도 이루지 못하고 있습니다. 보십시오, 세상이 그를 따라갔습니다.」[a]
  revised_footnotes:
