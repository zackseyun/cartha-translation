id: JHN.12.47
reference: John 12:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
  footnotes:
  - marker: a
    text: Or 'I do not condemn him.' The Greek verb can mean 'judge' or, in context, carry the sense of adverse judgment.
    reason: lexical_alternative
  - marker: b
    text: 'Greek ''him,'' with generic force: the statement applies to anyone who hears and does not keep Jesus'' words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 내 말을 듣고도 그것을 지키지 않으면, 나는 그를 심판하지 않습니다. 나는 세상을 심판하러 온 것이 아니라 세상을 구원하러 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐάν τίς
  english_pob_choice: if anyone
  chosen_korean: 누구든지
  alternatives_korean:
  - 어떤 사람이
  - 누군가
  lexicon: BDAG
  rationale: 조건문의 보편적·비특정적 성격을 자연스러운 현대 한국어로 옮기기 위해 '누구든지'를 썼습니다.
- source_word: φυλάξῃ
  english_pob_choice: keep them
  chosen_korean: 지키지
  alternatives_korean:
  - 지키지 않
  - 지켜 지키지
  - 간직하지
  lexicon: BDAG
  rationale: φυλάσσω의 '지키다/보존하다/준수하다' 범위를 살리되, 요한복음에서 예수의 말을 충실히 따르는 의미를 가장 간결하게 드러내는 표현으로 '지키다'를 택했습니다.
- source_word: κρίνω
  english_pob_choice: judge
  chosen_korean: 심판하지 않습니다
  alternatives_korean:
  - 판단하지 않습니다
  - 정죄하지 않습니다
  lexicon: BDAG
  rationale: 앞뒤에 같은 동사가 반복되어 대조를 이루므로 기본 의미를 유지해야 했습니다. 한국어에서는 법정적·종말론적 뉘앙스를 함께 담는 '심판하다'가 가장 적절합니다.
- source_word: σώσω
  english_pob_choice: save
  chosen_korean: 구원하러 왔습니다
  alternatives_korean:
  - 구해내러 왔습니다
  - 살리러 왔습니다
  lexicon: BDAG
  rationale: σῴζω의 신학적 핵심을 살리기 위해 '구원하다'를 사용했습니다. '구하다'는 일상적 의미로 좁아질 수 있어 피했습니다.
theological_decisions:
- issue: κρίνω를 '심판하다'로 옮길지 '정죄하다'로 풀지
  chosen_reading: 본문의 반복어를 따라 '심판하다'를 유지했습니다.
  alternative_readings:
  - 정죄하지 않습니다
  - 판단하지 않습니다
  rationale: 이 절은 예수의 사명이 심판이 아니라 구원이라는 점을 강조하지만, 요한복음 내의 심판 언어와의 긴장을 지우지 않아야 합니다. 따라서 해석을 앞당겨 '정죄하다'로 좁히지 않았습니다.
  doctrine_reference: 요한 문헌의 심판-구원 긴장을 보존합니다.
