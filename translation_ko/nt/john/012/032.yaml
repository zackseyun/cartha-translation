id: JHN.12.32
reference: John 12:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
  footnotes:
  - marker: a
    text: Or 'if I am lifted up.' The Greek uses a conditional form, but in context it refers to the impending certainty of Jesus' death.
    reason: alternative_reading
  - marker: b
    text: '''Lifted up'' can also carry the sense ''exalted,'' preserving John''s double meaning of crucifixion and glorification.'
    reason: lexical_alternative
  - marker: c
    text: Or simply 'all.' The Greek likely means all people, not necessarily making explicit how this relates to later theological debates about the extent of salvation.
    reason: lexical_alternative
translation:
  language: ko
  text: “그리고 내가 땅에서 들어 올려질 때[a][b], 모든 사람을[c] 내게로 이끌겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 땅에서 들어 올려지면’으로 옮길 수 있습니다. 그리스어는 조건형을 사용하지만, 여기서는 예수님의 임박한 죽음을 확실한 사건으로 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: ‘들어 올려지다’는 십자가에 달려 높이 올려지는 것과 영광을 받는다는 뜻을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 단순히 ‘모두’로 옮길 수 있습니다. 그리스어는 사람들을 가리키는 남성 복수형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  english_pob_choice: And I
  chosen_korean: 내가
  alternatives_korean:
  - 그리고 내가
  - 나도
  lexicon: BDAG
  rationale: 문맥상 앞말과 이어지는 인칭 강조를 살리되, 한국어에서는 문두의 ‘그리고’보다 주어 ‘내가’가 더 자연스럽고, 예수의 선언성을 분명하게 보여 줍니다.
- source_word: ἐὰν ὑψωθῶ
  english_pob_choice: when I am lifted up
  chosen_korean: 땅에서 들어 올려질 때
  alternatives_korean:
  - 땅에서 높여질 때
  - 땅에서 들리게 될 때
  - 땅에서 높임을 받을 때
  lexicon: BDAG
  rationale: ‘들어 올려질 때’는 십자가에 달리는 물리적 높아짐과 요한복음의 영광 개념을 함께 남기며, 한국어에서 ‘when’의 시간적 확정성을 자연스럽게 전달합니다.
- source_word: πάντας
  english_pob_choice: all people
  chosen_korean: 모든 사람을
  alternatives_korean:
  - 모두를
  - 만민을
  lexicon: BDAG
  rationale: 그리스어 남성 복수 목적격의 사람 대상성을 분명히 드러내기 위해 ‘모든 사람’을 택했고, 단순한 ‘모두’보다 오해의 여지가 적습니다.
- source_word: ἑλκύσω
  english_pob_choice: will draw
  chosen_korean: 이끌겠습니다
  alternatives_korean:
  - 끌어당기겠습니다
  - 끌어오겠습니다
  lexicon: BDAG
  rationale: ‘이끌다’는 단순한 물리적 끌어당김보다 인격적이고 효력 있는 ‘draw’의 의미를 한국어로 잘 살리며, 요한복음의 신학적 뉘앙스도 유지합니다.
- source_word: πρὸς ἐμαυτόν
  english_pob_choice: to myself
  chosen_korean: 내게로
  alternatives_korean:
  - 내 자신에게
  - 나에게
  lexicon: BDAG
  rationale: 반사대명사의 자기지향성을 한국어에서는 ‘내게로’로 자연스럽게 표현할 수 있어, 목적지와 방향성을 모두 담습니다.
theological_decisions:
- issue: ὑψωθῶ의 이중 의미 보존
  chosen_reading: ‘들어 올려질 때’로 두 의미를 함께 남겨 둡니다.
  alternative_readings:
  - ‘높임을 받을 때’로만 옮김
  - ‘십자가에 달릴 때’로만 옮김
  rationale: 요한복음은 예수의 십자가와 영화를 의도적으로 겹쳐 말하므로, 하나로만 좁히지 않고 번역에서도 긴장을 유지하는 편이 원문에 충실합니다.
  doctrine_reference: 요한복음의 십자가-영광 신학
- issue: ἐὰν의 조건문을 시간 확정으로 옮김
  chosen_reading: 예정된 사건을 가리키는 ‘때’로 옮깁니다.
  alternative_readings:
  - ‘만일’로 옮김
  - ‘만약’으로 옮김
  rationale: 형식은 조건문이지만 문맥상 예수의 다가오는 죽음이 확정된 사건으로 제시되므로, 한국어에서는 ‘때’가 의미와 문맥을 더 정확히 드러냅니다.
  doctrine_reference: 문맥적 확정성
