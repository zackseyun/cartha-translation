id: JHN.12.4
reference: John 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
  footnotes:
  - marker: a
    text: Or, more literally, 'the one who was about to hand him over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 제자들 가운데 한 사람인 가룟 유다—곧 예수를 넘겨줄 사람이—말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그를 넘겨줄 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  english_pob_choice: But ... said
  chosen_korean: 그런데 ... 말했습니다
  alternatives_korean:
  - 하지만 ... 말했습니다
  - 그리고 ... 말했습니다
  lexicon: BDAG
  rationale: δέ의 약한 전환을 한국어 담화 흐름에 맞게 ‘그런데’로 살렸고, 역사적 현재 λέγει는 자연스러운 서술체 ‘말했습니다’로 옮겼습니다.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  english_pob_choice: Judas Iscariot
  chosen_korean: 가룟 유다
  alternatives_korean:
  - 가룟 사람 유다
  - 유다 이스가리옷
  lexicon: BDAG
  rationale: 한국어 성경에서 널리 통용되는 고유명사 형태를 따르되, ὁ Ἰσκαριώτης의 식별 기능은 ‘가룟’으로 보존했습니다.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  english_pob_choice: one of his disciples
  chosen_korean: 제자들 가운데 한 사람
  alternatives_korean:
  - 그의 제자들 가운데 하나
  - 그의 추종자들 가운데 한 사람
  lexicon: BDAG
  rationale: μαθητής의 핵심 관계를 ‘제자’로 유지하고, εἷς τῶν의 부분 소속을 한국어 관용에 맞게 ‘가운데 한 사람’으로 표현했습니다.
- source_word: ὁ μέλλων αὐτὸν παραδιδόναι
  english_pob_choice: the one who was about to betray him
  chosen_korean: 곧 예수를 넘겨줄 사람
  alternatives_korean:
  - 그를 배반하려던 사람
  - 그를 넘겨주려던 사람
  lexicon: BDAG
  rationale: μέλλων의 임박성을 ‘곧’으로, παραδιδόναι의 기본 의미를 따라 ‘넘겨줄’로 옮겼고, 문맥상 배신의 함의는 본문 흐름에서 드러나게 했습니다.
theological_decisions:
- issue: παραδιδόναι의 문맥상 의미
  chosen_reading: ‘배반하다’보다 더 기본적인 ‘넘겨주다’를 본문에 두어, 유다가 예수를 적대 세력에 인도하는 행위를 문자적으로 드러냈습니다.
  alternative_readings:
  - 예수를 배반할 사람
  - 예수를 넘겨줄 사람
  rationale: 이 절은 인물 소개 절이며, ‘배반하다’는 해석적 강도가 강합니다. POB의 영어 주해처럼 직역형 대안을 유지해, 후속 문맥에서 배신의 도덕적 무게가 더 선명해지도록 했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
