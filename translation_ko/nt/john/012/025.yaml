id: JHN.12.25
reference: John 12:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
  footnotes:
  - marker: a
    text: Or 'soul'; Greek ψυχή can mean 'life,' 'self,' or 'soul' depending on context.
    reason: lexical_alternative
  - marker: b
    text: '''Hates his life'' is a deliberate paradox about rejecting attachment to one''s life in the present world-order; compare Luke 14:26 for similar idiom. It does not commend self-hatred.'
    reason: cross_reference
translation:
  language: ko
  text: 자기 목숨을 사랑하는 사람은 그것을 잃고, 이 세상에서 자기 목숨을 미워하는 사람은 영원한 생명에 이르도록 그것을 지킬 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''목숨''은 여기서 헬라어 ψυχή의 문맥적 의미를 따른 번역입니다. 이 단어는 문맥에 따라 ''생명'', ''자기'', ''혼/영혼''을 뜻할 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''미워하는''은 자기혐오를 권하는 말이 아니라, 현재 세상 질서에 대한 집착을 끊는 예수의 역설적 표현입니다. 눅 14:26과 비슷한 용례를 참고할 수 있습니다.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  english_pob_choice: the one who loves
  chosen_korean: 사랑하는 사람
  alternatives_korean:
  - 사랑하는 이
  - 사랑하는 자
  lexicon: BDAG
  rationale: 정관사+현재분사는 일반적 주어를 가리키므로 한국어에서는 자연스러운 보편적 주어 표현으로 옮겼습니다.
- source_word: ψυχὴν
  english_pob_choice: life
  chosen_korean: 목숨
  alternatives_korean:
  - 생명
  - 혼
  - 영혼
  - 자기
  lexicon: BDAG
  rationale: 문맥상 잃고 지키는 대상인 ψυχή는 '생명'보다 일상적이고 직접적인 '목숨'이 더 자연스럽고, 본문의 역설을 분명하게 드러냅니다.
- source_word: ἀπολλύει
  english_pob_choice: loses
  chosen_korean: 잃고
  alternatives_korean:
  - 멸하고
  - 없애고
  - 파괴하고
  lexicon: BDAG
  rationale: 대상어가 '목숨'이므로 '잃다'가 가장 자연스럽고, 영어 POB의 'loses'처럼 결과를 말하는 대조를 살립니다.
- source_word: ὁ μισῶν
  english_pob_choice: the one who hates
  chosen_korean: 미워하는 사람
  alternatives_korean:
  - 증오하는 사람
  - 사랑하지 않는 사람
  lexicon: BDAG
  rationale: μισέω의 강한 표현을 약화하지 않고 살리되, 한국어에서는 문어적으로 지나치지 않은 '미워하는 사람'이 본문의 역설을 유지합니다.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  english_pob_choice: in this world
  chosen_korean: 이 세상에서
  alternatives_korean:
  - 이 세상 안에서
  - 이 시대에
  lexicon: BDAG
  rationale: κόσμος의 현재적 세계 질서를 한국어의 자연스러운 표현인 '이 세상'으로 옮겼습니다.
- source_word: φυλάξει
  english_pob_choice: will keep
  chosen_korean: 지킬 것입니다
  alternatives_korean:
  - 보존할 것입니다
  - 간직할 것입니다
  - 지켜 둘 것입니다
  lexicon: BDAG
  rationale: φυλάσσω는 '지키다/보호하다'의 의미가 핵심이므로, 종말론적 결과를 담는 미래형으로 '지킬 것입니다'를 택했습니다.
- source_word: εἰς ζωὴν αἰώνιον
  english_pob_choice: for eternal life
  chosen_korean: 영원한 생명에 이르도록
  alternatives_korean:
  - 영원한 생명을 위하여
  - 영생을 위해
  - 영원한 생명으로
  lexicon: BDAG
  rationale: εἰς의 목적·도달 지점을 살려 단순한 목적어보다 '—에 이르도록'으로 옮겨, 보존의 귀결이 영원한 생명임을 드러냅니다.
theological_decisions:
- issue: '''자기 목숨을 미워하는'' 역설의 의미'
  chosen_reading: 본문의 강한 역설을 그대로 살려, 현재의 세계 질서에 대한 집착을 버리는 태도로 읽히게 했습니다.
  alternative_readings:
  - 자기 목숨을 덜 사랑하는
  - 자기 생명을 아끼지 않는
  rationale: 그리스어 μισέω의 직설성을 약화시키면 예수의 역설적 요구가 흐려지므로, 본문은 문자적 긴장을 유지하되 자해나 자기혐오를 뜻하지 않는다는 해석은 문맥에 맡깁니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
- issue: ψυχή의 번역
  chosen_reading: ψυχή를 두 절 모두에서 '목숨'으로 번역했습니다.
  alternative_readings:
  - 생명
  - 혼
  - 영혼
  - 자기
  rationale: 이 절은 잃고 지키는 대상의 대비가 중심이므로, 헬라어 ψυχή의 넓은 의미를 인정하되 이 문맥에서는 육체-정신 이분법을 불러오지 않는 '목숨'이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, Original-language primacy over translation tradition
