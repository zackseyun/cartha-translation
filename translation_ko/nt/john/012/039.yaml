review_pass:
  verdict: revise
  source_fidelity: 주절의 ‘믿을 수 없었습니다’는 οὐκ ἠδύναντο πιστεύειν의 불능을 적절히 보존합니다. 그러나 ὅτι는 뒤이은 이사야의 발언을 인용하는 근거를 도입하므로 ‘이는 … 때문입니다’보다 직접 인용 도입인 ‘이사야가 다시 말했습니다’로 옮기는 편이 원문 문장 구조와 인용 표지에 더 충실합니다.
  naturalness: ‘이런 이유로’와 ‘믿을 수 없었습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘이는 이사야가 다시 말했기 때문입니다’는 다음 절의 인용을 미리 이유절로 종결해 다소 부자연스럽고, 콜론 뒤에 이어지는 직접 인용의 문체를 살리는 것이 좋습니다.
  terminology: ‘이사야’, ‘믿다’는 표준 성경 번역 용례 및 요한복음의 핵심 용어에 적절합니다. 불능을 단순한 불신으로 바꾸는 대안 각주는 본문이 보존하는 의미를 약화하므로 유지하지 않는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ὅτι의 처리와 인용 도입
    rationale: 본문의 ὅτι는 ‘이사야가 다시 말했기 때문이다’라는 완결된 이유절보다, 다음 절에 계속되는 이사야 인용을 도입합니다. 한국어에서도 ‘이는 이사야가 다시 말했습니다.’로 두고 다음 절의 인용으로 이어 주는 것이 구조를 보존합니다.
  - severity: medium
    issue: 대안 각주가 불능의 의미를 약화함
    rationale: ‘믿지 못했습니다’는 문맥에 따라 불신이라는 결과만을 뜻할 수 있어 οὐκ ἠδύναντο의 명시적 능력 부정을 충분히 반영하지 못합니다. 본문 번역이 이미 자연스럽고 정확하므로 이 대안 각주는 불필요합니다.
  revised_text: 이런 이유로 그들은 믿을 수 없었습니다. 이는 이사야가 다시 말했습니다.
