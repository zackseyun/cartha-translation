  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: ko
  text: 이런 이유로 그들은 믿을 수 없었습니다. 이는 이사야가 다시 말했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “믿지 못했습니다”.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 이런 이유로
  alternatives_korean:
  - 그러므로
  - 이 일 때문에
  lexicon: BDAG
  rationale: 앞 문맥과의 인과 관계를 분명히 드러내면서도, 단순한 결론 표시보다 원인-결과 연결을 유지하는 표현으로 옮겼습니다.
- source_word: οὐκ ἠδύναντο
  english_pob_choice: they were not able
  chosen_korean: 믿을 수 없었습니다
  alternatives_korean:
  - 믿지 못했습니다
  - 믿을 능력이 없었습니다
  lexicon: BDAG
  rationale: δύναμαι의 무능력을 한국어에서 자연스럽게 드러내는 표현으로 옮겼고, 단순한 의지 부족으로 약화되지 않도록 했습니다.
- source_word: πιστεύειν
  english_pob_choice: to believe
  chosen_korean: 믿을
  alternatives_korean:
  - 믿어야 할
  - 믿는
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω를 한국어에서도 가장 직접적인 동사 ‘믿다’로 옮겨, 반복되는 요한 문체를 살렸습니다.
- source_word: πάλιν
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 거듭
  - 또
  lexicon: BDAG
  rationale: 이사야 인용이 추가로 이어진다는 뜻을 간결하게 드러내는 기본 대응으로 ‘다시’를 택했습니다.
theological_decisions:
- issue: 믿지 못함의 성격
  chosen_reading: 의도적 거부로 풀지 않고, 본문이 말하는 능력의 부재를 그대로 살려 ‘믿을 수 없었습니다’라고 옮겼습니다.
  alternative_readings:
  - 믿지 않으려고 했습니다
  - 믿지 않았습니다
  rationale: 헬라어 본문은 단순한 불원보다 무능력을 말하므로, 그 긴장을 한국어에서도 보존하는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 본문의 불능 진술을 보존하고, 예정/책임 논쟁은 해석에 남겨 둡니다.
