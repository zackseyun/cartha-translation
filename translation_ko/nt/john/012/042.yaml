id: JHN.12.42
reference: John 12:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
  footnotes:
  - marker: a
    text: Or 'be put out of the synagogue' or 'be expelled from the synagogue.' The Greek denotes exclusion from synagogue community.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 심지어 지도자들 가운데서도 많은 사람이 그를 믿었습니다. 하지만 바리새인들 때문에 그들은 자신을 드러내어 고백하지 않았으니, 그렇게 해서 회당에서 제외되지 않으려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회당에서 쫓겨나지 않으려는’ 또는 ‘회당에서 내쫓기지 않으려는’으로 옮길 수 있습니다. 그리스어는 회당 공동체로부터의 배제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  english_pob_choice: Nevertheless
  chosen_korean: 그러나
  alternatives_korean:
  - 그럼에도
  - 그렇지만
  - 그럼에도 불구하고
  lexicon: BDAG
  rationale: 두 개의 양보·대조 입자를 한국어에서 가장 자연스럽게 압축해, 앞 문맥의 긴장과 반전을 살리되 문장을 과도하게 무겁게 만들지 않기 위해 ‘그러나’로 옮겼습니다.
- source_word: ἐκ τῶν ἀρχόντων πολλοὶ
  english_pob_choice: even among the rulers many
  chosen_korean: 심지어 지도자들 가운데서도 많은 사람이
  alternatives_korean:
  - 권력자들 가운데서도 많은 사람이
  - 지도자들 중에도 많은 사람이
  - 당국자들 가운데서도 많은 사람이
  lexicon: BDAG
  rationale: ἄρχοντες를 요한복음 문맥에 맞게 ‘지도자들’로 옮겨, 단순한 정치적 ‘통치자’보다 유대 지도층이라는 집단성을 드러냈습니다.
- source_word: ἐπίστευσαν εἰς αὐτόν
  english_pob_choice: believed in him
  chosen_korean: 그를 믿었습니다
  alternatives_korean:
  - 그 안에서 믿었습니다
  - 그에게 믿음을 두었습니다
  - 그를 신뢰했습니다
  lexicon: BDAG
  rationale: εἰς αὐτόν의 인격적 신뢰 방향을 한국어 관용에 맞게 가장 सीधे하게 나타내기 위해 ‘그를 믿었습니다’로 옮겼습니다.
- source_word: οὐχ ὡμολόγουν
  english_pob_choice: they were not confessing it
  chosen_korean: 자신을 드러내어 고백하지 않았습니다
  alternatives_korean:
  - 그를 고백하지 않았습니다
  - 그 사실을 고백하지 않았습니다
  - 공개적으로 고백하지 않았습니다
  lexicon: BDAG
  rationale: 그리스어는 고백의 대상이 명시되지 않아, 문맥상 예수에 대한 믿음을 공개적으로 인정하지 못한 뜻을 ‘자신을 드러내어 고백하지 않았습니다’로 자연스럽게 풀었습니다.
- source_word: ἀποσυνάγωγοι γένωνται
  english_pob_choice: become excluded from the synagogue
  chosen_korean: 회당에서 제외되지 않으려는
  alternatives_korean:
  - 회당에서 쫓겨나지 않으려는
  - 회당 공동체에서 배제되지 않으려는
  - 회당에서 출교되지 않으려는
  lexicon: BDAG
  rationale: ἀποσυνάγωγος는 단순한 물리적 퇴출보다 회당 공동체로부터의 배제를 가리키므로, POB의 해석을 따라 ‘회당에서 제외되지 않으려는’으로 옮겼습니다.
theological_decisions:
- issue: 믿음과 공개적 고백 사이의 긴장
  chosen_reading: many believed in him를 그대로 ‘그를 믿었습니다’로 두고, 이어지는 부정적 행위를 믿음의 진정성 판단으로 해소하지 않았습니다.
  alternative_readings:
  - 겉으로만 믿는 척했습니다
  - 참된 믿음은 아니었습니다
  - 구원받는 믿음이었습니다
  rationale: 본문은 많은 지도자들의 믿음과 그들의 두려운 침묵을 나란히 제시할 뿐, 그 믿음의 구원론적 최종 판정을 내리지 않습니다. 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
