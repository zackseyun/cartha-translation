translation:
  language: ko
  text: 그래서 대제사장들은 나사로도 죽이기로 결정했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나사로를 죽이려는 계획을 세웠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  english_pob_choice: decided
  chosen_korean: 결정했습니다
  alternatives_korean:
  - 계획했습니다
  - 숙의했습니다
  - 결의했습니다
  lexicon: BDAG
  rationale: βουλεύομαι는 숙고 끝에 굳어진 결정을 뜻하므로, 현대 한국어에서 가장 자연스럽고 결과를 분명히 드러내는 ‘결정했습니다’로 옮겼습니다.
- source_word: δὲ
  english_pob_choice: So
  chosen_korean: 그래서
  alternatives_korean:
  - 그리고
  - 그러나
  - 이제
  lexicon: BDAG
  rationale: δέ는 앞뒤 서술을 잇는 연결어로, 앞 절의 흐름을 이어 주는 ‘그래서’가 가장 자연스럽습니다.
- source_word: οἱ ἀρχιερεῖς
  english_pob_choice: the chief priests
  chosen_korean: 대제사장들
  alternatives_korean:
  - 대사제들
  - 수석 제사장들
  lexicon: BDAG
  rationale: 복수형 ἀρχιερεῖς는 단일한 ‘대제사장’이 아니라 성전 지도층을 가리키므로, 표준적인 복수 표현 ‘대제사장들’로 옮겼습니다.
- source_word: ἀποκτείνωσιν
  english_pob_choice: kill
  chosen_korean: 죽이기로
  alternatives_korean:
  - 살해하기로
  - 사형에 처하기로
  lexicon: BDAG
  rationale: ἀποκτείνω는 단순히 ‘죽이다’라는 의미이며, 여기서는 사법적 절차를 뜻하지 않으므로 가장 직접적인 ‘죽이기로’가 적절합니다.
theological_decisions:
- issue: 나사로에 대한 적대적 의도의 표현 수위
  chosen_reading: 본문이 말하는 범위 안에서만, 대제사장들이 나사로를 죽이려는 결정을 내렸다고 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘음모를 꾸몄습니다’처럼 더 강한 모의 표현으로 옮김
  rationale: 본문에는 ‘음모’에 해당하는 별도 어휘가 없으므로, 번역이 본문보다 더 강한 해석을 덧붙이지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: source text only, without importing interpretive escalation.'
