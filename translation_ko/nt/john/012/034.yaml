id: JHN.12.34
reference: John 12:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
  footnotes:
  - marker: a
    text: Or "be exalted." In John, "lifted up" can carry both the sense of being raised up physically and being exalted.
    reason: lexical_alternative
  - marker: b
    text: Greek "the Christ"; here rendered "the Messiah" because the term functions as a title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 무리가 그에게 대답했습니다. 「우리는 율법에서 메시아[b]가 영원히 머문다고 들었습니다. 그런데 어떻게 당신이 ‘인자가 들어 올려져야 한다’[a]고 말합니까? 이 인자는 누구입니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “높임을 받아야 한다.” 요한복음에서 ‘들어 올리다’는 물리적으로 들어 올려짐과 높임 또는 영화의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 “그리스도”입니다. 여기서는 호칭으로 쓰였으므로 “메시아”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν
  english_pob_choice: So ... answered
  chosen_korean: 그러자 ... 대답했습니다
  alternatives_korean:
  - 그래서 ... 대답했습니다
  - 그리하여 ... 대답했습니다
  lexicon: BDAG
  rationale: οὖν의 이어짐과 응답의 흐름을 자연스럽게 살리면서, 현대 한국어에서 가장 무리 없는 연결 표현으로 옮겼습니다.
- source_word: ὁ ὄχλος
  english_pob_choice: the crowd
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: BDAG
  rationale: 요한복음의 ὄχλος는 단순한 인원 집합보다 공개적으로 모인 집단을 가리키므로, 문맥에 맞는 표준적 한국어인 ‘무리’를 택했습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: 여기서 Χριστός는 호칭으로 기능하므로, 프로젝트 기본값에 따라 ‘메시아’로 옮겨 유대적-종말론적 의미를 유지했습니다.
- source_word: ὑψωθῆναι
  english_pob_choice: be lifted up
  chosen_korean: 들어 올려져야 한다
  alternatives_korean:
  - 높임을 받아야 한다
  - 들려져야 한다
  - 영광받아야 한다
  lexicon: BDAG
  rationale: 요한복음에서 ὑψόω는 십자가의 물리적 ‘들어 올림’과 영화의 의미를 함께 지니므로, 어느 한쪽으로 좁히지 않는 표현을 택했습니다.
theological_decisions:
- issue: Χριστός의 번역어
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 문맥에서는 칭호로서의 의미가 강하므로, 독자가 유대적 메시아 대망을 그대로 읽도록 ‘메시아’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → Messiah (where title; Christ where name-like)'
- issue: 요한복음의 ὑψωθῆναι가 지니는 이중 의미
  chosen_reading: 들어 올려져야 한다
  alternative_readings:
  - 높임을 받아야 한다
  - 들려져야 한다
  rationale: 십자가에 달려 물리적으로 ‘들어 올려짐’과 그로 인한 높임의 의미가 함께 있으므로, 해석을 하나로 고정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
