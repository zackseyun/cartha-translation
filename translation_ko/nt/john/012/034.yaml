  terminology: Χριστός는 칭호적 용법에 맞게 ‘메시아’로 유지하는 것이 적절합니다. ‘인자’와 ‘들어 올려져야 한다’도 정착된 성서 한국어 용례 및 원문의 의도적 중의성을 잘 보존합니다.
