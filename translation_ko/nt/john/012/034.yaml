  source_fidelity: 본문 번역은 대체로 SBLGNT의 의미를 충실히 반영합니다. ‘메시아’, ‘영원히 머문다’, ‘인자가 들어 올려져야 한다’는 각각 ὁ χριστός, μένει εἰς τὸν αἰῶνα, ὑψωθῆναι의 의미와 요한복음 특유의 긴장을 적절히 보존합니다. 다만 각주 표지가 가리키는 본문 위치와 각주 내용이 서로 맞지 않습니다.
