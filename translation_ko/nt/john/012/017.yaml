id: JHN.12.17
reference: John 12:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
  footnotes:
  - marker: a
    text: Or 'was testifying'; the Greek verb can denote giving testimony or bearing witness, a recurring theme in John.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그분과 함께 있었던 무리가, 곧 예수님께서 나사로를 무덤에서 불러내시고 죽은 자들 가운데서 일으키셨을 때 함께 있던 그 무리가 증언하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증언하고 있었습니다’; 여기서 그리스어 동사는 증언과 증거 제시를 모두 뜻할 수 있으며, 이는 요한복음에 반복되는 주제입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  english_pob_choice: was bearing witness
  chosen_korean: 증언하고 있었습니다
  alternatives_korean:
  - 증언했습니다
  - 계속 증언하고 있었습니다
  - 증거하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 시상의 지속성을 살리기 위해 진행형으로 옮겼고, 요한복음의 μαρτυρέω 관용을 따라 ‘증언하다’를 택했습니다.
- source_word: ὁ ὄχλος
  english_pob_choice: the crowd
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: BDAG
  rationale: ὄχλος의 일반적 집단 의미를 자연스럽게 살리되, 한국어에서 다소 문학적인 ‘군중’보다 중립적인 ‘무리’를 택했습니다.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  english_pob_choice: that had been with him
  chosen_korean: 그분과 함께 있었던
  alternatives_korean:
  - 그분과 함께 있던
  - 그와 함께 있었던
  lexicon: BDAG
  rationale: 분사구가 가리키는 특정한 무리를 식별하는 구조를 살려 과거의 동시 체류를 자연스럽게 표현했습니다.
- source_word: ἐκ τοῦ μνημείου
  english_pob_choice: out of the tomb
  chosen_korean: 무덤에서 불러내시고
  alternatives_korean:
  - 무덤 밖으로
  - 무덤에서
  lexicon: BDAG
  rationale: 직역인 ‘무덤에서’만으로는 동작성이 약해져, ἐφώνησεν의 ‘불러내다’와 결합해 무덤 밖으로 나오게 하신 장면을 더 분명히 드러냈습니다.
theological_decisions:
- issue: “죽은 자들 가운데서”의 부활 표현
  chosen_reading: 죽은 자들 가운데서 일으키셨습니다
  alternative_readings:
  - 죽은 자들 가운데서 살리셨습니다
  - 죽은 자들 가운데서 일으켜 세우셨습니다
  rationale: ἐκ νεκρῶν의 표준 부활 표현을 유지해 기적의 진술을 약화하지 않고, 요한의 서술 의도를 분명히 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
