  to: 그러므로 그분께서 나사로를 무덤에서 불러내시고 죽은 자들 가운데서 일으키셨을 때 그분과 함께 있던 무리가 증언하고 있었습니다.[a]
  rationale: 원문의 단일한 관사 분사구를 한국어의 ‘그분과 함께 있던 무리’로 한 번만 옮겨 중복을 제거했습니다. ‘그러므로’는 οὖν의 연결을, ‘증언하고 있었습니다’는 미완료 시상의 진행성을, ‘죽은 자들 가운데서 일으키셨습니다’는 ἐκ νεκρῶν의 부활 표현을 유지합니다. 예수의 이름은 헬라어 본문에 명시되지 않았으므로 대명사로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:40Z'
