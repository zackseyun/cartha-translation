id: JHN.12.23
reference: John 12:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
  footnotes:
  - marker: a
    text: Or “The time has come.” The Greek says “hour,” a recurring Johannine term for Jesus’ appointed moment of suffering and glory.
    reason: lexical_alternative
  - marker: b
    text: Or “the Human One.” The Greek title “the Son of Man” echoes Daniel 7 and is retained here for its theological and intertextual force.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 대답하셨습니다. “인자[a]가 영광을 받을 때[b]가 왔습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 아들’. 그리스어 호칭 ‘인자’는 다니엘 7장을 배경으로 하는 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘시간’. 그리스어 ὥρα(‘때, 시간’)는 요한복음에서 예수의 정해진 고난과 영광의 때를 가리키는 반복적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  english_pob_choice: answered them, saying
  chosen_korean: 그들에게 대답하여 말씀하셨습니다
  alternatives_korean:
  - 그들에게 응답하여 말씀하셨습니다
  - 그들에게 대답하며 말씀하셨습니다
  lexicon: BDAG
  rationale: ἀποκρίνομαι는 서사에서 자연스럽게 ‘대답하다’로 옮기고, λέγων은 한국어에서도 이어지는 발화 표지를 살려 ‘말씀하셨습니다’로 처리했습니다.
- source_word: Ἐλήλυθεν
  english_pob_choice: has come
  chosen_korean: 왔습니다
  alternatives_korean:
  - 이르렀습니다
  - 도착했습니다
  lexicon: BDAG
  rationale: 완료형이 현재에 남아 있는 결과를 나타내므로, 한국어에서는 시제가 살아 있는 ‘왔습니다’가 가장 자연스럽고 간결합니다.
- source_word: ἡ ὥρα
  english_pob_choice: the hour
  chosen_korean: 때
  alternatives_korean:
  - 시간
  - 시간이
  lexicon: BDAG
  rationale: 요한복음의 ὥρα는 단순한 시각보다 예수의 정해진 결정적 순간을 가리키므로, 본문 안에서는 ‘때’로 옮기되 의미는 주석 없이도 보존되도록 했습니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자(人子)
  lexicon: BDAG
  rationale: 전통적 교회 용어가 ‘인자’이므로, 다니엘 7장과 요한복음의 상호본문성을 살려 직역적 호칭을 유지했습니다.
- source_word: δοξασθῇ
  english_pob_choice: to be glorified
  chosen_korean: 영광을 받을
  alternatives_korean:
  - 영광스럽게 될
  - 영광을 얻을
  lexicon: BDAG
  rationale: 수동태의 신학적 의미를 살리면서도 한국어에서 자연스러운 표현인 ‘영광을 받다’로 옮겨, 예수의 영화가 수난과 높아짐을 포함한다는 긴장을 보존했습니다.
theological_decisions:
- issue: 요한복음의 ἡ ὥρα 모티프를 한국어에서 어떻게 보존할지
  chosen_reading: ‘때’로 옮기되, 결정적이고 정해진 순간이라는 의미를 본문 흐름으로 드러냈습니다.
  alternative_readings:
  - ‘시간’으로 직역
  - ‘그때’로 완화
  rationale: ‘시간’은 너무 일반적이고, ‘때’는 요한복음에서 반복되는 예수의 정해진 순간이라는 신학적 무게를 비교적 잘 보존합니다. 별도의 각주 없이도 문맥상 충분히 전달됩니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: δοξασθῇ의 수동형을 어떻게 신학적으로 처리할지
  chosen_reading: ‘영광을 받을’
  alternative_readings:
  - ‘영광스럽게 될’
  - ‘영광을 받게 될’
  rationale: 요한복음에서 예수의 ‘영광’은 단순한 명예가 아니라 십자가와 부활, 그리고 아버지의 공적 인정까지 포괄합니다. 한국어 수동 표현으로 그 신학적 깊이를 유지했습니다.
  doctrine_reference: Affirmations; Translation philosophy §2, §4
