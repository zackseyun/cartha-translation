  lexicon: BDAG
  rationale: 자기 기원이나 독자성을 부정하는 관용구이므로, 직역의 딱딱함을 피하면서도 ‘스스로’로 독립적 발화를 하지 않았다는 뜻을 살렸습니다.
- source_word: ἐλάλησα
