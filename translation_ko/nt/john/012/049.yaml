  lexicon: BDAG
  rationale: 현재완료 뉘앙스를 한국어에서 자연스럽게 풀어, 지금까지의 발화 전체를 가리키는 선언으로 읽히게 했습니다.
- source_word: ὁ πέμψας με πατήρ
