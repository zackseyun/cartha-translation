    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 스스로 말한 것이 아니기 때문입니다[a]. 나를 보내신 아버지께서 친히 내가 무엇을 말해야 하고 무엇을 이야기해야 하는지에 관하여 명령을 주셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음대로’ 또는 ‘내 자신의 권위로’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 여기서 ‘말하다’와 ‘이야기하다/말하다’에 해당하는 서로 다른 두 동사를 사용합니다. 번역은 그 구별을 가능한 한 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  english_pob_choice: from myself
  chosen_korean: 내 스스로
  alternatives_korean:
