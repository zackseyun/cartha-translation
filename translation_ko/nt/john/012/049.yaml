- source_word: τί εἴπω καὶ τί λαλήσω
  english_pob_choice: what I should say and what I should speak
  chosen_korean: 내가 무엇을 말해야 하고 무엇을 말해야 하는지
  alternatives_korean:
  - 내가 무엇을 말해야 하고 무엇을 이야기해야 하는지
  - 내가 무엇을 말해야 하고 무엇을 발화해야 하는지
  lexicon: BDAG
  rationale: 그리스어의 λέγω/λαλέω 구분은 영어 본문이 ‘say/speak’로 보존하지만, 한국어에서는 두 동사를 무리하게 다르게 만들기보다 명령 내용의 이중성을 자연스럽게 전달하는 쪽이 더 정확합니다.
theological_decisions:
- issue: 아버지와 아들의 발화 종속성
  chosen_reading: 예수님은 독자적으로 말하지 않으시고, 아버지의 명령에 따라 말씀하십니다.
  alternative_readings:
  - 예수님이 단지 인간 예언자처럼 말한다
  - 예수님이 아버지와 무관하게도 말하지만 우연히 일치한다
  rationale: 본문의 ‘내 스스로 말하지 않았다’와 ‘아버지께서 명령을 주셨다’를 그대로 살려, 사역상의 종속성을 드러내되 본질적 열등성으로 오해되지 않도록 했습니다.
