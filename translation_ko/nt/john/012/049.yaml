id: JHN.12.49
reference: John 12:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
  footnotes:
  - marker: a
    text: Or 'on my own' or 'from my own authority.'
    reason: lexical_alternative
  - marker: b
    text: The Greek uses two different verbs, 'say' and 'speak'; the translation preserves the distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 내 스스로 말한 것이 아닙니다[a]. 나를 보내신 아버지께서 친히 내가 무엇을 말해야 하고 무엇을 말해야 하는지에 대한 명령을 주셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음대로’ 또는 ‘내 권위로부터’.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 ‘말하다’와 ‘말하다/발화하다’에 해당하는 서로 다른 두 동사를 사용합니다. 번역은 그 구별을 가능한 한 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  english_pob_choice: from myself
  chosen_korean: 내 스스로
  alternatives_korean:
  - 혼자
  - 내 권위로부터
  - 내 힘으로
  lexicon: BDAG
  rationale: 자기 기원이나 독자성을 부정하는 관용구이므로, 직역의 딱딱함을 피하면서도 ‘스스로’로 독립적 발화를 하지 않았다는 뜻을 살렸습니다.
- source_word: ἐλάλησα
  english_pob_choice: have not spoken
  chosen_korean: 말한 것이 아닙니다
  alternatives_korean:
  - 말하지 않았습니다
  - 말한 바 없습니다
  lexicon: BDAG
  rationale: 현재완료 뉘앙스를 한국어에서 자연스럽게 풀어, 지금까지의 발화 전체를 가리키는 선언으로 읽히게 했습니다.
- source_word: ὁ πέμψας με πατήρ
  english_pob_choice: the Father who sent me
  chosen_korean: 나를 보내신 아버지
  alternatives_korean:
  - 나를 파송하신 아버지
  - 나를 보내신 아버지께서
  lexicon: BDAG
  rationale: 보냄의 관계를 유지하면서, 요한복음의 ‘아버지’ 호칭을 문맥에 맞게 자연스러운 합쇼체로 옮겼습니다.
- source_word: τί εἴπω καὶ τί λαλήσω
  english_pob_choice: what I should say and what I should speak
  chosen_korean: 내가 무엇을 말해야 하고 무엇을 말해야 하는지
  alternatives_korean:
  - 내가 무엇을 말해야 하고 무엇을 이야기해야 하는지
  - 내가 무엇을 말해야 하고 무엇을 발화해야 하는지
  lexicon: BDAG
  rationale: 그리스어의 λέγω/λαλέω 구분은 영어 본문이 ‘say/speak’로 보존하지만, 한국어에서는 두 동사를 무리하게 다르게 만들기보다 명령 내용의 이중성을 자연스럽게 전달하는 쪽이 더 정확합니다.
theological_decisions:
- issue: 아버지와 아들의 발화 종속성
  chosen_reading: 예수님은 독자적으로 말하지 않으시고, 아버지의 명령에 따라 말씀하십니다.
  alternative_readings:
  - 예수님이 단지 인간 예언자처럼 말한다
  - 예수님이 아버지와 무관하게도 말하지만 우연히 일치한다
  rationale: 본문의 ‘내 스스로 말하지 않았다’와 ‘아버지께서 명령을 주셨다’를 그대로 살려, 사역상의 종속성을 드러내되 본질적 열등성으로 오해되지 않도록 했습니다.
  doctrine_reference: Nicene Creed (381), Chalcedon (451)
