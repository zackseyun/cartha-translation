  source_fidelity: 원문의 ἐξ ἐμαυτοῦ는 독자적 기원·권위로 말하지 않았다는 뜻으로, 본문의 ‘내가 스스로’가 이를 적절히 옮깁니다. ὁ πέμψας με πατήρ, αὐτός, ἐντολήν, 그리고 완료형 δέδωκεν도 ‘나를 보내신 아버지께서 친히 … 명령을 주셨습니다’에 충실히 반영되었습니다. 다만 원문이 εἴπω와 λαλήσω라는 두 동사를 구별해 병렬한 데 반해, 초안은 둘 다 ‘말해야’로 번역하여 그 구별을 없앴습니다.
  naturalness: ‘내가 내 스스로’는 ‘내가 스스로’보다 중복감이 있습니다. 또한 ‘무엇을 말해야 하고 무엇을 말해야 하는지에 대한 명령’은 반복 때문에 부자연스럽습니다. ‘무엇을 말해야 하고 무엇을 이야기해야 하는지에 관하여 명령을’로 고치면 현대 표준어 합쇼체에서 자연스럽고 원문의 병렬도 유지됩니다.
  terminology: ‘아버지’, ‘명령’, ‘친히’는 요한복음 문맥과 원문의 강조를 적절히 반영합니다. λαλέω를 여기서 ‘이야기하다’로 옮기는 것은 λέγω의 ‘말하다’와의 완전한 어휘적 대립을 주장하지 않으면서도 원문의 두 동사 사용을 한국어에서 드러내는 안전한 방식입니다.
