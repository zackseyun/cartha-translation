review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 충실합니다. πάντοτε의 반복, μεθ’ ἑαυτῶν의 ‘여러분과 함께’, 그리고 가난한 이들의 지속적 현존과 예수님의 제한된 현존 사이의 대조가 잘 보존되었습니다. 다만 γάρ를 ‘왜냐하면’으로 시작하고 다시 ‘-기 때문입니다’로 끝낸 구조는 같은 인과 표지를 중복합니다.
  naturalness: 현 문장은 이해 가능하나 ‘왜냐하면 … 때문입니다’는 현대 표준어의 격식 있는 문장에서는 중복적이고 다소 부자연스럽습니다. ‘이는 … 때문입니다’로 고치면 원문의 설명·근거 기능을 자연스럽게 유지합니다. ‘언제나 … 있지는 않기’는 원문의 οὐ πάντοτε를 자연스럽고 분명하게 반영합니다.
  terminology: ‘가난한 사람들’은 τοὺς πτωχούς에 대한 현대적이고 자연스러운 번역입니다. 예수님의 직접 발화에는 ‘나는’을 유지하는 것이 적절합니다.
  issues:
  - severity: low
    issue: 인과 표현의 중복
    rationale: ‘왜냐하면’과 문미의 ‘-기 때문입니다’가 동일한 γάρ의 근거 기능을 이중으로 표지합니다. 의미 오류는 아니지만 문체상 수정이 필요합니다.
  - severity: low
    issue: 영어 POB의 어휘 대안 각주 미반영
    rationale: 영어 감사 기록의 ‘poor people’ 대안을 한국어에서도 독자가 확인할 수 있도록 ‘가난한 이들’이라는 대안 각주를 붙이는 것이 앵커 및 감사 기록의 대응에 유익합니다.
  revised_text: 이는 가난한 사람들[a]은 언제나 여러분과 함께 있지만, 나는 언제나 여러분과 함께 있지는 않기 때문입니다.
  revised_footnotes:
