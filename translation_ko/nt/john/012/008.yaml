    rationale: 초안의 ‘왜냐하면’과 ‘아니기 때문입니다’는 모두 γάρ의 근거 제시 기능을 표시합니다. 원문에는 인과 접속사 하나만 있으므로, 한국어에서도 하나만 유지해야 합니다.
  revised_text: 가난한 사람들은 언제나 여러분과 함께 있지만, 나는 언제나 여러분과 함께 있지는 않기 때문입니다.
