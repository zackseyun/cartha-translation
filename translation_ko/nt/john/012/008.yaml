id: JHN.12.8
reference: John 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
  footnotes:
  - marker: a
    text: 'Or, ''poor people.'' The Greek adjective is used substantivally: ''the poor.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 가난한 사람들은 늘 여러분과 함께 있지만, 나는 늘 여러분과 함께 있는 것이 아니기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς πτωχοὺς
  english_pob_choice: the poor
  chosen_korean: 가난한 사람들
  alternatives_korean:
  - 가난한 이들
  - 가난한 자들
  - 가난한 사람들
  lexicon: BDAG
  rationale: 형용사 πτωχούς가 명사처럼 쓰여 특정 집단을 가리키므로, 한국어에서는 자연스러운 집단명사로 풀어 ‘가난한 사람들’이라 옮겼습니다. 전통적 ‘가난한 자들’보다 현대 독자가 더 즉시 이해할 수 있습니다.
- source_word: γάρ
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 이는
  - for
  - 그러므로
  lexicon: BDAG
  rationale: 이 절은 앞선 발언의 근거를 제시하므로, 한국어에서는 인과를 분명히 드러내는 ‘왜냐하면’이 적절합니다.
- source_word: πάντοτε
  english_pob_choice: always
  chosen_korean: 늘
  alternatives_korean:
  - 항상
  - 언제나
  - 계속
  lexicon: BDAG
  rationale: 두 번 반복되는 πάντοτε를 같은 어감으로 살리되, 대화체이면서도 문어적인 ‘늘’로 간결하게 대응했습니다.
- source_word: μεθ’ ἑαυτῶν
  english_pob_choice: with you
  chosen_korean: 여러분과 함께
  alternatives_korean:
  - 여러분 곁에
  - 여러분 가운데
  - 여러분과
  lexicon: BDAG
  rationale: 직역보다 ‘함께’가 존재와 동행의 의미를 자연스럽게 살립니다. ‘여러분과 함께 있는’은 이어지는 동사와도 잘 맞습니다.
theological_decisions:
- issue: 가난한 사람들에 대한 평가절하로 오해될 가능성
  chosen_reading: 두 대상의 상시성/일시성을 대비하는 말로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 가난한 사람들의 중요성을 완곡하게 보강하는 의역
  - 대조를 약화시키는 해석적 문장화
  rationale: 원문은 가난한 이들의 지속적 존재와 예수님의 육체적 동행의 제한성을 대비할 뿐, 가난한 사람들을 덜 중요하다고 말하지 않습니다. 번역도 이 긴장을 그대로 보존해야 합니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 신학적 판단을 덧붙이지 않고, 서술된 대비를 유지합니다.'
