  source_fidelity: 대조 접속사 δέ와 반복되는 πάντοτε, 그리고 μεθ’ ἑαυτῶν의 ‘여러분과 함께’라는 의미는 초안에 대체로 충실히 반영되었습니다. 다만 문두의 ‘왜냐하면’과 문미의 ‘-기 때문입니다’가 γάρ를 중복하여 표현하므로, 한 번만 나타내는 편이 원문의 연결 기능을 더 정확하고 자연스럽게 살립니다.
  naturalness: ‘왜냐하면 … 때문입니다’의 중복 인과 표지는 현대 표준 한국어에서 부자연스럽습니다. 문두 접속 표현을 생략하고 문미의 ‘-기 때문입니다’로 앞 문맥에 대한 근거 제시를 나타내면 합쇼체 문체에도 자연스럽습니다.
  terminology: ‘가난한 사람들’은 τοὺς πτωχούς의 명사적 용법을 현대적으로 자연스럽게 옮긴 표현입니다. ‘여러분’과 ‘함께’도 본문의 복수 수신자와 동반/현존의 뜻을 적절히 전달합니다.
  issues:
