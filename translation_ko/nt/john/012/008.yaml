    reason: lexical_alternative
  revision_rationale: 문두의 ‘왜냐하면’을 삭제하여 중복된 인과 표현을 바로잡았습니다. 문미의 ‘-기 때문입니다’는 γάρ가 앞선 문맥에 제시하는 근거라는 기능을 보존합니다. πάντοτε의 반복은 ‘언제나’로 일관되게 유지하고, δεύτε 절의 부정은 ‘있지는 않다’로 대조를 분명히 했습니다. 본문이 가난한 사람들에 대한 평가를 덧붙이지 않도록 그대로 유지했습니다.
