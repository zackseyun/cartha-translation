revisions:
- from: 그들은 곧 갈릴리 베싸이다 출신인 빌립에게 와서, 이렇게 말하며 그에게 물었습니다. 「선생님, 우리는 예수님을 뵙고 싶습니다.」[a]
  to: 그들은 그래서 갈릴리 벳새다 출신인 빌립에게 가서 청했습니다. 「선생님,[a] 우리는 예수님을 뵙고 싶습니다.」
  rationale: 원문의 접속 관계와 요청 동사의 뜻을 더 충실히 반영하고, 중복된 서술을 제거했습니다. κύριε의 문맥적 모호성은 본문의 자연스러운 공손 호칭과 대안 독법 각주를 통해 보존했습니다.
  reviewer_model: gpt-5.6-terra
