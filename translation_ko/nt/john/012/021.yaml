source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
  footnotes:
  - marker: a
    text: Or “Sir, we want to see Jesus.” The Greek vocative κύριε can be a respectful form of address to a person as well as “Lord.”
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그래서 갈릴리 벳새다 출신인 빌립에게 가서 청했습니다. 「선생님,[a] 우리는 예수님을 뵙고 싶습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님.” 그리스어 호격 κύριε는 사람에게 쓰는 공손한 호칭일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  english_pob_choice: these
  chosen_korean: 그들은
  alternatives_korean:
  - 이 사람들은
  - 이들은
  lexicon: BDAG
  rationale: 앞절의 그리스인들을 가리키는 지시어이므로 연결성을 살리면서도 한국어에서는 문장 첫머리에 자연스러운 주어로 옮겼습니다.
- source_word: προσῆλθον
  english_pob_choice: came to
  chosen_korean: 와서
  alternatives_korean:
  - 다가와서
  - 찾아와서
  lexicon: BDAG
  rationale: 대화 시작을 드러내는 동작으로서 한국어 서술에 가장 자연스럽고, 단순한 이동보다 ‘접근’의 뉘앙스를 유지합니다.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  english_pob_choice: who was from Bethsaida in Galilee
  chosen_korean: 갈릴리 베싸이다 출신인
  alternatives_korean:
  - 갈릴리 베싸이다의
  - 갈릴리 베싸이다에서 온
  lexicon: BDAG
  rationale: 지명 정보를 간결하게 담되 출신을 밝히는 수식으로 처리했습니다. ‘베싸이다’는 현행 음역을 따랐습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 선생님
  alternatives_korean:
  - 주님
  - 서생님
  lexicon: BDAG
  rationale: 이 장면에서는 예수님이 아니라 빌립에게 하는 정중한 호칭이므로, 한국어에서는 실제 대화 상대에게 쓰는 공손한 호칭으로 옮겼습니다. 본문 의미상 종교적 호칭으로 고정하지 않았습니다.
- source_word: ἰδεῖν
  english_pob_choice: to see
  chosen_korean: 뵙고 싶습니다
  alternatives_korean:
  - 보고 싶습니다
  - 만나고 싶습니다
  lexicon: BDAG
  rationale: 직역의 ‘보다’를 유지할 수 있지만, 이 요청은 단순 시각적 관찰보다 면담 요청의 성격이 강하므로 한국어에서는 예의를 갖춘 ‘뵙고 싶습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: κύριε의 호칭 해석
  chosen_reading: 빌립에게 대한 공손한 호칭으로 이해하여 ‘선생님’으로 옮김
  alternative_readings:
  - 주님
  - 서생님
  rationale: POB 영어 주석도 이 자리의 κύριε가 사람에게 쓰는 존칭일 수 있음을 밝힙니다. 문맥상 예수님을 향한 신앙 고백이 아니므로, 본문 독자가 오해하지 않도록 한국어에서는 상대방 존칭을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
