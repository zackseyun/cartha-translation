    issue: οὖν을 ‘곧’으로 번역함
    rationale: ‘곧’은 시간적 즉시성을 암시할 수 있으나, 여기서 οὖν은 앞 절의 그리스인들과 이어지는 서술적 연결을 나타냅니다.
  - severity: medium
    issue: ἠρώτων을 ‘이렇게 말하며 그에게 물었습니다’로 번역함
    rationale: ‘말하며’와 ‘물었습니다’가 중복되고, 직접화법은 질문보다 요청의 내용입니다. ‘청했습니다’가 원문의 요청 동사와 한국어 문맥에 더 정확합니다.
  - severity: low
    issue: ‘베싸이다’ 표기
    rationale: 표준 한국어 성경 지명 관용과의 일관성을 위해 ‘벳새다’가 더 적절합니다.
