id: JHN.12.16
reference: John 12:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
  footnotes:
  - marker: a
    text: Or 'did not know these things at first.'
    reason: lexical_alternative
  - marker: b
    text: '''Was glorified'' in John commonly refers to Jesus'' glorification through his death, resurrection, and exaltation.'
    reason: cross_reference
  - marker: c
    text: Or 'had been written concerning him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제자들은 처음에는 이런 것들을 이해하지 못했습니다[a]. 그러나 예수께서 영광을 받으신 뒤[b], 그제야 이 일들이 그분에 대하여 기록된 것임과 사람들이 이런 일들을 그분에게 행했다는 것을 기억해 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처음에는 이런 것들을 알지 못했습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘영광을 받으셨다’는 요한복음에서 흔히 예수의 죽음, 부활, 높아지심을 아우르는 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔγνωσαν ... τὸ πρῶτον
  english_pob_choice: did not understand these things at first
  chosen_korean: 처음에는 이런 것들을 이해하지 못했습니다
  alternatives_korean:
  - 처음에는 이런 것들을 알지 못했습니다
  - 처음에는 이런 것들을 알지 못했습니다
  lexicon: BDAG
  rationale: γινώσκω는 여기서 단순한 정보 부재보다 사건의 의미를 파악하지 못한 상태를 가리키므로, ‘이해하다’가 문맥의 뜻을 가장 잘 드러냅니다.
- source_word: ἐδοξάσθη Ἰησοῦς
  english_pob_choice: when Jesus was glorified
  chosen_korean: 예수께서 영광을 받으신 뒤
  alternatives_korean:
  - 예수께서 영광을 받으셨을 때
  - 예수께서 영화롭게 되셨을 때
  lexicon: BDAG
  rationale: δόξα/δοξάζω의 요한적 용례를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘영광을 받으시다’로 옮겼습니다.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  english_pob_choice: had been written about him
  chosen_korean: 그분에 대하여 기록된 것
  alternatives_korean:
  - 그분에 관하여 기록된 것
  - 그에 대해 기록된 것
  lexicon: BDAG
  rationale: ἐπί + 여격은 여기서 ‘~에 대하여/관하여’의 뜻이므로, 공간적 뉘앙스를 피하고 예언 성취의 문맥을 살려 옮겼습니다.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  english_pob_choice: they had done these things to him
  chosen_korean: 사람들이 이런 일들을 그분에게 행했다는 것
  alternatives_korean:
  - 그들이 이런 일들을 그분에게 했다는 것
  - 이런 일들을 그분에게 저질렀다는 것
  lexicon: BDAG
  rationale: αὐτῷ의 대상을 분명히 하면서, 입성 장면의 행동을 본문이 있는 그대로 회고하도록 ‘행했다’로 유지했습니다.
theological_decisions:
- issue: 예수의 ‘영광을 받으심’의 범위
  chosen_reading: ‘영광을 받으신 뒤’로 유지하여, 요한복음의 복합적 의미—십자가, 부활, 높아지심—를 하나로 좁히지 않았습니다.
  alternative_readings:
  - 부활하신 뒤
  - 높임을 받으신 뒤
  rationale: 요한은 ‘영광’ 언어를 여러 층위로 사용하므로, 번역이 그 신학적 긴장을 보존하도록 했습니다.
  doctrine_reference: 요한복음의 영광-십자가-높아짐 모티프
- issue: ‘기록된 것’의 표현
  chosen_reading: 예수께 일어난 일이 성경의 기록과 대응한다는 점을 드러내기 위해 ‘그분에 대하여 기록된 것’으로 옮겼습니다.
  alternative_readings:
  - 그분에 관하여 기록된 것
  - 그분에게 대하여 기록된 것
  rationale: 본문은 사건이 우연이 아니라 성경 성취임을 강조하므로, 그 구조를 한국어에서도 분명히 보존했습니다.
  doctrine_reference: 성경 성취와 예언의 대응
