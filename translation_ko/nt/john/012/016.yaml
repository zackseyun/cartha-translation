  - severity: medium
    issue: ἐπ’ αὐτῷ γεγραμμένα에 대응하는 어휘 대안 각주가 누락되었습니다.
    rationale: 영어 POB 감사 기록에는 이 구절에 대한 ‘그분에 관하여 기록되어 있었다’라는 대안 각주가 있습니다. 한국어 본문에서도 해당 위치에 각주를 두어 선택의 여지를 보존하는 것이 적절합니다.
