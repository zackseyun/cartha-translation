  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
  footnotes:
  - marker: a
    text: Or 'beholds'; the Greek verb can carry the sense of seeing with attentive perception, not merely physical sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나를 보는 사람은 나를 보내신 분을 봅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘봅니다’의 기본 뜻은 시각적 인지이지만, θεωρέω는 주의 깊게 보고 인식한다는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεωρῶν
  english_pob_choice: the one who sees
  chosen_korean: 나를 보는 사람
  alternatives_korean:
  - 나를 보는 이
  - 나를 관찰하는 사람
  - 나를 바라보는 사람
  lexicon: BDAG
  rationale: articular present participle를 한국어에서는 자연스러운 관계절로 옮겼습니다. POB의 'the one who sees'처럼 대표적 단수의 일반성을 살리되, '관찰하는'처럼 과도하게 해석하지 않았습니다.
- source_word: θεωρεῖ
  english_pob_choice: sees
  chosen_korean: 봅니다
  alternatives_korean:
  - 봅니다
  - 바랍니다
  - 관찰합니다
  lexicon: BDAG
  rationale: 동사 θεωρέω는 단순 시각보다 주의 깊은 인지를 포함할 수 있지만, 반복 구조를 살리기 위해 기본어 '보다'를 택했습니다. 필요 이상의 해설적 표현은 피했습니다.
- source_word: τὸν πέμψαντά με
  english_pob_choice: the one who sent me
  chosen_korean: 나를 보내신 분
  alternatives_korean:
  - 나를 보내신 분
  - 나를 보내신 이를
  - 나를 파송하신 분
  lexicon: BDAG
  rationale: articular aorist participle은 기능상 '보내신 분'으로 자연스럽게 옮길 수 있습니다. '파송하다'는 가능하지만 본문에서 더 직접적인 '보내다'를 유지했습니다.
theological_decisions:
- issue: 예수와 보내신 분을 '봄'의 대응 관계
  chosen_reading: 예수를 보는 것은 그를 보내신 분을 보는 것이라는 계시적 대응으로 직역했습니다.
  alternative_readings:
  - 예수를 통해 보내신 분을 알게 된다는 식의 완화된 해석
  - 존재론적 동일성을 더 강하게 드러내는 의역
  rationale: 본문은 계시적 가시성의 직접 대응을 말하므로, 설명을 덧붙여 약화하거나 교리적으로 확장하지 않고 원문의 힘을 유지했습니다.
  doctrine_reference: 요한복음의 계시 기독론; 니케아-칼케돈 정통 이해
