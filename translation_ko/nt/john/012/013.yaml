revisions:
- from: 그들은 야자나무 가지를 가져다가 그를 맞으러 나갔고, 외쳐 말했습니다. 「호산나! 주의 이름으로 오시는 이, 곧 이스라엘의 왕은 복되십니다!」[a][b]
  to: 그들은 종려나무 가지를 가져다가 그를 맞으러 나갔고, 계속 외치고 있었습니다. 「호산나![a] 주의 이름으로 오시는 이는 복되시며, 이스라엘의 왕이십니다!」[b]
  rationale: καὶ를 ‘곧’으로 해석해 좁히지 않고 ‘-시며’로 이어 원문의 접속 관계를 보존했습니다. 군중의 반복적 외침은 ‘계속 외치고 있었습니다’로, palm branches는 ‘종려나무 가지’로 다듬었습니다. 호산나와 시편 암시의 각주 표지는 해당 표현 및 인용 전체에 자연스럽게 배치했습니다.
  reviewer_model: gpt-5.6-terra
