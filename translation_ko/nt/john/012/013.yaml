id: JHN.12.13
reference: John 12:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
  footnotes:
  - marker: a
    text: Hosanna is a Hebrew-derived acclamation meaning 'save now' or 'please save,' which by this period also functioned as a shout of praise.
    reason: lexical_alternative
  - marker: b
    text: This line echoes Psalm 118:26.
    reason: cross_reference
  - marker: c
    text: Or 'and the King of Israel.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 야자나무 가지를 가져다가 그를 맞으러 나갔고, 외쳐 말했습니다. 「호산나! 주의 이름으로 오시는 이, 곧 이스라엘의 왕은 복되십니다!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호산나’는 ‘지금 구원하소서’라는 뜻의 히브리어 유래 외침이지만, 이 시기에는 찬양의 구호로도 기능했습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 시편 118:26을 반향합니다.
    reason: cross_reference
lexical_decisions:
- source_word: τὰ βαΐα τῶν φοινίκων
  english_pob_choice: the branches of the palm trees / palm branches
  chosen_korean: 야자나무 가지
  alternatives_korean:
  - 종려나무 가지
  - 팜나무 가지
  lexicon: BDAG
  rationale: βάϊα는 이 문맥에서 나뭇가지를 뜻하고, τῶν φοινίκων은 야자나무를 가리킵니다. 한국어에서는 의미를 자연스럽게 살리면서도 식물명을 분명히 하기 위해 ‘야자나무 가지’로 옮겼습니다.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  english_pob_choice: went out to meet him
  chosen_korean: 그를 맞으러 나갔고
  alternatives_korean:
  - 그를 만나러 나갔고
  - 그를 맞이하러 나갔고
  lexicon: BDAG
  rationale: ὑπάντησις는 ‘마주 나가 만남’의 뜻이므로, 간결하고 자연한 한국어로 ‘맞으러 나갔고’가 원문의 방향성과 동작을 잘 살립니다.
- source_word: ἐκραύγαζον
  english_pob_choice: were crying out
  chosen_korean: 외쳐 말했습니다
  alternatives_korean:
  - 소리쳐 말했습니다
  - 계속 외쳤습니다
  lexicon: BDAG
  rationale: 미완료 과거의 반복·지속 뉘앙스를 살리면서도 한국어 문장 흐름에 맞게 군중의 구호를 드러내기 위해 ‘외쳐 말했습니다’를 택했습니다.
- source_word: εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου
  english_pob_choice: Blessed is the one who comes in the name of the Lord
  chosen_korean: 주의 이름으로 오시는 이…은 복되십니다
  alternatives_korean:
  - 주님의 이름으로 오시는 이는 복되십니다
  - 주의 이름으로 오시는 분은 복되십니다
  lexicon: BDAG
  rationale: 시편 118:26의 인용을 살려 문어체 축복 선언으로 옮겼습니다. συμμετοχική 표현 ὁ ἐρχόμενος는 ‘오시는 이’로 처리해 인격적 호칭을 유지했습니다.
- source_word: ὁ βασιλεὺς τοῦ Ἰσραήλ
  english_pob_choice: the King of Israel
  chosen_korean: 이스라엘의 왕
  alternatives_korean:
  - 이스라엘 왕
  - 이스라엘의 임금
  lexicon: BDAG
  rationale: 왕적·메시아적 호칭을 약화하지 않기 위해 직역에 가깝게 ‘이스라엘의 왕’으로 유지했습니다.
theological_decisions:
- issue: κυρίου의 처리와 시편 118:26 암시
  chosen_reading: ‘주의 이름’으로 번역해 본문의 그리스어 표면을 유지했습니다.
  alternative_readings:
  - ‘야훼의 이름’
  - ‘주님의 이름’
  rationale: 여기서는 요한복음의 그리스어가 κύριος를 사용하므로 본문 차원에서는 ‘주’로 옮기는 것이 가장 직접적입니다. 구약 인용 배경은 본문 구조와 주석적 맥락에서 충분히 드러납니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
- issue: 군중의 외침을 예배적 찬양으로만 완화하지 않음
  chosen_reading: ‘호산나’와 ‘이스라엘의 왕’을 함께 유지해 왕적·간구적 긴장을 보존했습니다.
  alternative_readings:
  - ‘지금 구원하소서’로 풀어쓰기
  - ‘이스라엘의 임금’으로 완화
  rationale: 호산나는 원의미상 간구이면서 이 시기에는 찬양 구호로도 기능하므로 음역을 유지하는 편이 본문의 역사적·예배적 층위를 함께 살립니다. 또한 예수의 왕권 선언을 명시적으로 보존했습니다.
  doctrine_reference: DOCTRINE.md Affirmations; John 12 문맥
