review_pass:
  verdict: revise
  source_fidelity: 그리스어의 καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ은 앞의 축복 선언에 이어지는 접속 표현인데, 초안의 ‘곧’은 이를 동격적 ‘즉/even’으로 한정합니다. 본문은 접속을 보존하여 옮기는 편이 안전합니다. 또한 미완료 과거 ἐκραύγαζον의 반복·지속성을 ‘계속 외치고 있었습니다’로 더 분명히 나타낼 수 있습니다.
  naturalness: ‘외쳐 말했습니다’는 한국어에서 다소 중복적입니다. ‘계속 외치고 있었습니다’가 군중의 외침과 인용된 구호를 자연스럽게 연결합니다. ‘종려나무 가지’는 이 문맥의 palm branches를 가리키는 표준적이고 자연스러운 성서 한국어입니다.
  terminology: ‘호산나’, ‘주의 이름’, ‘이스라엘의 왕’은 유지합니다. ‘복되십니다’와 ‘왕이십니다’는 인용 안에서 예수께 드리는 공적 외침에 맞는 현대 합쇼체 존대입니다.
  issues:
  - severity: medium
    issue: ‘곧 이스라엘의 왕은’이 καὶ를 동격적 의미로 좁힘
    rationale: SBLGNT 본문은 καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ을 읽습니다. ‘곧’도 문맥상 가능한 해석일 수 있으나, 접속사 ‘그리고/또한’의 열린 연결을 보존하는 번역이 원문 충실성에 더 적합합니다.
  - severity: low
    issue: ‘외쳐 말했습니다’가 ἐκραύγαζον의 지속성을 충분히 드러내지 못하고 표현이 중복됨
    rationale: 미완료 과거는 진행되거나 반복된 외침을 나타낼 수 있습니다. ‘계속 외치고 있었습니다’는 이를 자연스럽게 반영합니다.
  - severity: low
    issue: ‘야자나무 가지’는 한국어에서 코코야자나무를 우선 연상시킬 수 있음
    rationale: φοίνιξ는 여기서 일반적으로 종려(palm)를 가리키므로, ‘종려나무 가지’가 성서 문맥에서 더 정확하고 관례적인 명칭입니다.
  revised_text: 그들은 종려나무 가지를 가져다가 그를 맞으러 나갔고, 계속 외치고 있었습니다. 「호산나![a] 주의 이름으로 오시는 이는 복되시며, 이스라엘의 왕이십니다!」[b]
  revised_footnotes:
