translation:
  language: ko
  text: 그들은 사람들의 영광을 하나님의 영광보다 더 사랑하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들의 인정’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησαν
  english_pob_choice: loved
  chosen_korean: 사랑하였습니다
  alternatives_korean:
  - 좋아하였습니다
  - 더 원하였습니다
  lexicon: BDAG
  rationale: ἀγαπάω의 강한 애정과 의지적 지향을 살리기 위해 단순한 선호보다 ‘사랑하다’를 택했습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명예
  - 칭찬
  - 인정
  lexicon: BDAG
  rationale: 요한복음의 반복되는 신학적 용례를 살리기 위해 δόξα를 ‘영광’으로 옮겼습니다.
- source_word: τῶν ἀνθρώπων
  english_pob_choice: of men
  chosen_korean: 사람들의
  alternatives_korean:
  - 사람의
  - 인간의
  lexicon: BDAG
  rationale: ἄνθρωποι는 남성만이 아니라 사람 일반을 가리키므로, 현대 한국어에서는 자연스럽고 성중립적인 ‘사람들의’로 옮겼습니다.
- source_word: μᾶλλον ἤπερ
  english_pob_choice: rather than
  chosen_korean: 보다 더
  alternatives_korean:
  - ~보다
  - ~보다 차라리
  lexicon: BDAG
  rationale: 두 대상 사이의 선호를 나타내는 비교 구문이므로, 한국어에서는 ‘~보다 더’로 대비를 분명히 했습니다.
theological_decisions:
- issue: 사람의 영광과 하나님의 영광의 대비
  chosen_reading: 인간으로부터 오는 인정과 하나님께 속한 영광 사이의 우선순위를 드러내는 본문으로 읽었습니다.
  alternative_readings:
  - 사람들의 칭찬과 하나님의 칭찬의 대비
  - 명예에 대한 추구와 하나님의 영광에 대한 추구의 대비
  rationale: δόξα는 여기서 단순한 평판보다 더 넓은 ‘영광’의 의미를 가지며, 요한복음의 신학적 대비를 보존하는 것이 본문 의미를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
