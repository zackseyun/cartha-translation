id: JHN.12.31
reference: John 12:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
  footnotes:
  - marker: a
    text: Or 'the prince of this world.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the ruler of this world' is commonly understood to refer to Satan.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 이 세상에 대한 심판이 이루어집니다. 이제 이 세상의 통치자는 밖으로 내쫓길 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 세상의 통치자’는 보통 사탄을 가리키는 것으로 이해됩니다.
    reason: theological_note
  - marker: b
    text: 또는 ‘이 세상의 군주’.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 바로 지금
  lexicon: BDAG
  rationale: 반복되는 νῦν의 긴박한 시점감을 살리면서 한국어 문장 흐름에 자연스럽게 맞는 표준적 표현으로 옮겼습니다.
- source_word: κρίσις
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 판단
  - 정죄
  lexicon: BDAG
  rationale: 요한복음 문맥에서 ‘this world’에 임하는 결정적 판결/심판의 뜻을 살려, 법정적이고 종말론적인 힘을 드러내는 ‘심판’으로 옮겼습니다.
- source_word: ὁ ἄρχων τοῦ κόσμου τούτου
  english_pob_choice: the ruler of this world
  chosen_korean: 이 세상의 통치자
  alternatives_korean:
  - 이 세상의 지배자
  - 이 세상의 군주
  - 이 세상의 왕
  lexicon: BDAG
  rationale: ἄρχων의 권세적 의미를 현대 한국어에서 가장 투명하게 드러내는 말로 ‘통치자’를 선택했고, 영어 POB처럼 본문에는 이름을 넣지 않고 칭호를 유지했습니다.
- source_word: ἐκβληθήσεται ἔξω
  english_pob_choice: will be cast out
  chosen_korean: 밖으로 내쫓길 것입니다
  alternatives_korean:
  - 밖으로 던져질 것입니다
  - 쫓겨날 것입니다
  - 밖으로 내던져질 것입니다
  lexicon: BDAG
  rationale: 수동 미래형과 ἔξω의 배제/추방 뉘앙스를 함께 살리기 위해, 단순한 이동이 아니라 강제적 축출을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘이 세상의 통치자’의 정체를 본문에서 밝힐지 여부
  chosen_reading: 본문은 칭호만 유지하고, 암시된 정체는 본문 밖으로 확장하지 않았습니다.
  alternative_readings:
  - 사탄
  - 마귀
  - 이 세상 체계의 의인화
  rationale: 영어 POB의 주석처럼 이 표현이 사탄을 가리킨다는 이해는 널리 알려져 있지만, 헬라어 본문 자체는 명칭이 아니라 칭호를 사용하므로 본문 번역은 그 긴장을 유지했습니다.
  doctrine_reference: 해석은 주석에서, 본문은 원문 어휘를 보존한다.
