revisions:
- from: 아버지, 아버지의 이름을 영광스럽게 해 주십시오. 그때 하늘에서 음성이 들려왔습니다. 「내가 이미 영광스럽게 했고, 또다시 영광스럽게 하겠습니다.」[a]
  to: 아버지, 아버지의 이름을 영화롭게 하여 주십시오. 그러자 하늘에서 음성이 들려왔습니다. “내가 그 이름을 영화롭게 하였고, 다시 영화롭게 하겠습니다.”[a]
  rationale: 목적어 ‘그 이름을’을 보충하여 하늘의 음성이 바로 앞의 ‘아버지의 이름’을 가리킴을 분명히 했습니다. 원문에 없는 ‘이미’를 삭제하고, δοξάζω의 신학적 어휘 연결과 현대 성서 문체를 고려해 ‘영화롭게 하다’로 다듬었습니다. οὖν은 자연스러운 서사 진행을 위해 ‘그러자’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:47Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 화자 전환은 대체로 충실합니다. 그러나 하늘의 음성에서 생략된 목적어가 한국어 문장에서는 보완되어야 하며, 앞의 ‘이름’을 받는다는 점을 명시하는 것이 원문의 문맥과 영어 감사 기록에 더 충실합니다. 또한 ἐδόξασα는 단순과거이므로 ‘이미’는 본문에 없는 시간적 뉘앙스를 더합니다.
  naturalness: ‘영광스럽게 해 주십시오/했다’는 이해 가능하지만 이 문맥에서는 다소 어색합니다. ‘영화롭게 하여 주십시오/영화롭게 하였고’가 현대 한국어 성서 문체에서 자연스럽고, 합쇼체도 유지합니다.
  terminology: δόξα/δοξάζω 계열의 신학적 연결을 보존하기 위해 ‘영화롭게 하다’를 사용했습니다. ‘이름’은 하나님의 계시된 명예와 성품을 가리키는 문맥을 유지합니다.
  issues:
  - severity: medium
