id: JHN.12.28
reference: John 12:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
  footnotes:
  - marker: a
    text: Or, more formally, “I glorified it, and I will glorify it again.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지, 아버지의 이름을 영광스럽게 해 주십시오. 그때 하늘에서 음성이 들려왔습니다. 「내가 이미 영광스럽게 했고, 또다시 영광스럽게 하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 동사 시제를 더 형식적으로 살리면 “내가 영광스럽게 했고, 또다시 영광스럽게 하겠습니다”가 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 저의 아버지
  - 하늘 아버지
  lexicon: BDAG
  rationale: 하나님께 대한 직접 호격이므로, 소유격을 덧붙이지 않고 자연스러운 호칭인 ‘아버지’로 옮겼습니다.
- source_word: δόξασόν
  english_pob_choice: glorify
  chosen_korean: 영광스럽게 해 주십시오
  alternatives_korean:
  - 영광을 돌려 주십시오
  - 영광되게 해 주십시오
  - 영화롭게 해 주십시오
  lexicon: BDAG
  rationale: δοξάζω의 핵심인 ‘영광’ 의미를 살리면서, 아버지께 드리는 간구로서 한국어 명령형을 공손하게 표현했습니다.
- source_word: τὸ ὄνομα
  english_pob_choice: your name
  chosen_korean: 아버지의 이름
  alternatives_korean:
  - 아버지의 명성
  - 아버지의 이름을
  lexicon: BDAG
  rationale: ‘이름’은 단순한 호칭이 아니라 하나님의 드러난 성품과 명예를 가리키므로, 직역적이면서도 신학적 무게를 유지했습니다.
- source_word: ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ
  english_pob_choice: Then a voice came from heaven
  chosen_korean: 그때 하늘에서 음성이 들려왔습니다
  alternatives_korean:
  - 그러자 하늘로부터 음성이 왔습니다
  - 그리고 하늘에서 소리가 들렸습니다
  lexicon: BDAG
  rationale: 이야기 진행을 나타내는 οὖν은 ‘그때’로, φωνή는 뒤의 직접 발화를 고려해 ‘음성’으로, ἐκ τοῦ οὐρανοῦ는 표준적인 ‘하늘에서’로 옮겼습니다.
- source_word: Ἐδόξασα καὶ πάλιν δοξάσω
  english_pob_choice: I have glorified it, and I will glorify it again
  chosen_korean: 내가 이미 영광스럽게 했고, 또다시 영광스럽게 하겠습니다
  alternatives_korean:
  - 내가 영광스럽게 했고, 또 영광스럽게 하겠습니다
  - 내가 이미 영화롭게 했고, 다시 영화롭게 하겠습니다
  lexicon: BDAG
  rationale: 첫 동사는 완료된 행위를 현재 관련성을 가진 한국어로 풀었고, δεύτερος 미래는 미래형으로 유지했습니다. ‘it’의 지시 대상은 앞문의 ‘이름’입니다.
theological_decisions:
- issue: 직접 화법에서 아버지께 드리는 간구의 한국어 높임말
  chosen_reading: ‘해 주십시오’로 공손한 간구를 유지했습니다
  alternative_readings:
  - ‘해 주시옵소서’
  - ‘영광스럽게 하소서’
  rationale: 본문은 예수의 기도/간청이므로, 현대 합쇼체를 유지하되 하나님께 드리는 요청의 공손함을 분명히 했습니다.
  doctrine_reference: Translation philosophy §5
- issue: 하늘의 음성과 이어지는 신적 자기 선언의 시제 처리
  chosen_reading: ‘내가 이미 영광스럽게 했고, 또다시 영광스럽게 하겠습니다’로 과거-미래의 대조를 살렸습니다
  alternative_readings:
  - ‘내가 영광스럽게 했고, 다시 영광스럽게 하겠다’
  - ‘내가 영광스럽게 했으며, 또 영광스럽게 할 것이다’
  rationale: Ἐδόξασα와 δοξάσω의 시간 대비를 한국어에서 분명히 드러내어, 이미 행해진 일과 앞으로 행해질 일을 모두 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
