id: JHN.12.14
reference: John 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
  footnotes:
  - marker: a
    text: Or "a donkey colt." The Greek ὀνάριον refers to a donkey, often a young one.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 어린 나귀를 찾으신 다음, 그 위에 올라타셨습니다. 이는 기록된 바와 같습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὀνάριον은 나귀를 가리키며, 보통 어린 나귀를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  english_pob_choice: having found
  chosen_korean: 찾으신 다음
  alternatives_korean:
  - 찾으시고
  - 찾은 뒤에
  - 찾으신 후
  lexicon: BDAG
  rationale: 분사 εὑρὼν은 주절 동사보다 앞선 동작을 나타내므로, 한국어에서는 선행성을 자연스럽게 드러내는 ‘찾으신 다음’으로 옮겼습니다.
- source_word: ὀνάριον
  english_pob_choice: a young donkey
  chosen_korean: 어린 나귀
  alternatives_korean:
  - 나귀 새끼
  - 어린 당나귀
  lexicon: BDAG
  rationale: ὀνάριον의 축소형 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 의미가 분명한 ‘어린 나귀’를 채택했습니다.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  english_pob_choice: sat on it
  chosen_korean: 그 위에 올라타셨습니다
  alternatives_korean:
  - 그 위에 앉으셨습니다
  - 그것에 앉으셨습니다
  lexicon: BDAG
  rationale: 직역의 ‘앉다’도 가능하지만, 동물이동체 위에 자세를 잡는 동작은 한국어에서 ‘올라타다’가 더 자연스럽고 문맥상 분명합니다.
- source_word: καθώς ἐστιν γεγραμμένον
  english_pob_choice: just as it is written
  chosen_korean: 기록된 바와 같습니다
  alternatives_korean:
  - 기록된 대로입니다
  - 기록된 것과 같습니다
  lexicon: BDAG
  rationale: 인용 공식을 한국어 성경 문체에 맞게 간결히 옮기되, ‘기록된 바’로 성경 인용임을 유지했습니다.
theological_decisions:
- issue: 예수의 행동과 성경 인용의 관계
  chosen_reading: 예수의 동작을 곧바로 ‘기록된 바’와 대응시키되, 이 절 자체만으로 예수의 의도적 예언 성취를 과도하게 설명하지는 않았습니다.
  alternative_readings:
  - 예수께서 의도적으로 예언을 성취하셨음을 더 분명히 드러내는 표현
  rationale: 본문은 행동 서술 뒤에 인용 공식을 붙여 상응 관계를 말하지만, 동기의 세부를 명시하지는 않으므로 그 절제성을 보존했습니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 예언 성취의 긴장을 유지합니다.
