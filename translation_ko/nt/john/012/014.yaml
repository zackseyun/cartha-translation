  source_fidelity: εὑρὼν의 선행 동작과 ὀνάριον의 젊은 나귀라는 뜻은 대체로 잘 반영되었습니다. 그러나 ἐκάθισεν ἐπ’ αὐτό는 ‘올라타셨습니다’보다 ‘그 위에 앉으셨습니다’가 원문의 행위를 더 직접적으로 옮깁니다. 또한 καθώς ἐστιν γεγραμμένον은 앞선 사건 전체가 성경 기록과 일치함을 나타내는 인용 공식이므로, ‘이는’보다는 ‘기록된 바와 같습니다’가 더 충실합니다.
