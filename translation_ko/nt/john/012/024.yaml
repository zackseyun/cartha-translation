  timestamp: '2026-07-13T08:22:41Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 조건문과 농경 비유, 그리고 ‘많은 열매를 맺다’는 잘 반영했습니다. 그러나 αὐτὸς μόνος μένει는 ‘하나만 남아 있습니다’보다 ‘홀로 남아 있습니다’가 ‘그 밀알이 단독으로 남는다’는 뜻을 더 정확히 전달합니다. 또한 각주 b의 ‘땅에 묻혀’는 본문의 ‘땅에 떨어져’보다 한 단계 더 구체화한 표현입니다.
  naturalness: ‘그것은 하나만 남아 있습니다’는 현대 한국어에서 다소 부자연스럽고, 무엇이 하나라는 것인지 모호하게 들릴 수 있습니다. ‘그 밀알은 홀로 남아 있습니다’는 자연스럽고 비유의 대조를 분명히 합니다.
  terminology: ‘진실로, 진실로’, ‘밀알’, ‘많은 열매를 맺습니다’는 요한복음의 문체와 한국어 성경 용례에 잘 맞습니다. 존대 서술형 합쇼체도 일관됩니다.
  issues:
