    issue: αὐτὸς μόνος μένει의 번역이 ‘그것은 하나만 남아 있습니다’로 되어 있음
    rationale: ‘하나만’은 수량상 하나가 남는다는 뜻으로도 읽혀, 해당 밀알이 홀로 남아 열매를 맺지 못한다는 μόνος의 의미를 충분히 드러내지 못합니다.
  - severity: low
    issue: 각주 b가 ‘땅에 묻혀’라고 표현함
    rationale: 원문은 πεσὼν εἰς τὴν γῆν, 곧 땅에 떨어지는 모습을 말합니다. ‘묻혀’는 농경적으로 이해 가능한 보충이지만 본문보다 구체적이므로 피하는 편이 안전합니다.
  - severity: low
    issue: 각주 a의 표지가 관련 어구에 직접 붙어 있지 않음
    rationale: 어휘 대안 각주는 ‘홀로 남아 있습니다’에 붙여 그 적용 범위를 명확히 하는 것이 좋습니다.
