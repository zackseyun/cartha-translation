revisions:
- from: 진실로, 진실로 내가 너희에게 말합니다. 밀알이 땅에 떨어져 죽지 않으면 그것은 하나만 남아 있습니다. 그러나 죽으면 많은 열매를 맺습니다.[a][b]
  to: 진실로, 진실로 내가 너희에게 말합니다. 밀알이 땅에 떨어져 죽지 않으면, 그 밀알은 홀로 남아 있습니다.[a] 그러나 죽으면 많은 열매를 맺습니다.[b]
  rationale: ‘홀로 남아 있습니다’로 αὐτὸς μόνος의 단독성을 자연스럽고 정확하게 드러냈습니다. 각주 a를 해당 어구에 배치하고, 각주 b에서 원문에 없는 ‘묻혀’라는 구체화를 ‘떨어져’로 바로잡았습니다. 비유의 그리스도론적·제자도적 함의는 본문에 풀어 넣지 않고 각주와 문맥에만 남겼습니다.
