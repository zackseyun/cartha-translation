id: JHN.12.24
reference: John 12:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
  footnotes:
  - marker: a
    text: Or 'it remains alone.'
    reason: lexical_alternative
  - marker: b
    text: The image refers to a grain that must die in the ground in order to become fruitful; in context, Jesus applies this pattern to his own death and to those who follow him.
    reason: cross_reference
translation:
  language: ko
  text: 진실로, 진실로 내가 너희에게 말합니다. 밀알이 땅에 떨어져 죽지 않으면 그것은 하나만 남아 있습니다. 그러나 죽으면 많은 열매를 맺습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것은 하나만 남아 있습니다.”
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 땅에 묻혀 죽어야 열매 맺는 밀알을 가리키며, 문맥에서 예수님은 이 패턴을 자신의 죽음과 그를 따르는 이들에게 적용하십니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로, 진실로
  alternatives_korean:
  - 아멘, 아멘
  - 참으로, 참으로
  lexicon: BDAG
  rationale: 요한복음의 강조적 담화 표지를 한국어로 자연스럽게 살리면서도 반복의 강세를 유지하기 위해 '진실로, 진실로'로 옮겼습니다.
- source_word: ὁ κόκκος τοῦ σίτου
  english_pob_choice: the grain of wheat
  chosen_korean: 밀알
  alternatives_korean:
  - 밀 한 알
  - 밀의 씨앗
  lexicon: BDAG
  rationale: κόκκος와 σίτου의 농경 이미지를 간결하게 살리면서 한국어에서도 익숙한 표현인 '밀알'을 사용했습니다.
- source_word: αὐτὸς μόνος μένει
  english_pob_choice: it remains by itself
  chosen_korean: 그것은 하나만 남아 있습니다
  alternatives_korean:
  - 그것은 홀로 남아 있습니다
  - 그것은 혼자 남아 있습니다
  lexicon: BDAG
  rationale: μόνος의 핵심인 '홀로/단독으로'의 의미를 살리되, 감정적 고립보다 생산성의 부재를 드러내기 위해 '하나만 남아 있습니다'로 옮겼습니다.
- source_word: πολὺν καρπὸν φέρει
  english_pob_choice: it bears much fruit
  chosen_korean: 많은 열매를 맺습니다
  alternatives_korean:
  - 많은 열매를 가져옵니다
  - 큰 열매를 맺습니다
  lexicon: BDAG
  rationale: φέρω καρπόν의 관용적 표현을 한국어 성경 문맥에 맞게 '열매를 맺다'로 옮기고, πολύν은 '많은'으로 처리해 과장 없이 수량을 드러냈습니다.
theological_decisions:
- issue: 죽음-열매의 비유를 본문 안에서 얼마나 풀어 쓸 것인가
  chosen_reading: 본문은 농경 비유 자체를 유지하고, 그 비유의 적용은 뒤 문맥에 맡겼습니다.
  alternative_readings:
  - 예수님의 죽음과 그로 인한 열매를 본문에 직접 풀어 쓴다
  rationale: 요한복음의 문맥상 예수님의 죽음과 제자도에 대한 함의가 강하지만, 이 절 자체는 이미지를 말할 뿐 해석을 완전히 풀어 설명하지 않습니다. 따라서 번역문에서는 해석을 과잉 주입하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; do not import doctrinal claims the text does not make explicitly.'
