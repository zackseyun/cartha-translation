- from: 그가 그들의 눈을 멀게 하시고 그들의 마음을 완고하게 하셨습니다[a]. 그래서 그들이 눈으로 보지 못하고 마음으로 깨닫지 못하며 돌이켜[b], 내가 그들을 고치지[c] 못하게 하셨습니다.
  to: 그가 그들의 눈을 멀게 하셨고 그들의 마음을 완고하게 하셨습니다. 이는 그들이 눈으로 보지 못하고 마음으로 깨닫지 못하며 돌이켜[a], 내가 그들을 고치게 되지 않도록 하신 것입니다[b][c].
  rationale: 원문의 명시적 신적 행위와 ‘눈/마음’의 병행을 유지했습니다. ἵνα의 목적/결과 구조는 ‘이는 … 않도록 하신 것입니다’로 재현하되, ἰάσομαι의 능동적 미래 의미를 ‘내가 그들을 고치게 되지 않도록’ 안에 보존했습니다. 또한 영어 감사 기록의 세 각주 기능에 맞추어 표지와 각주 내용을 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:46Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘내가 그들을 고치지 못하게 하셨습니다’는 ἰάσομαι αὐτούς(‘내가 그들을 고칠 것이다/고치게 될 것이다’)를 ‘고치지 못하다’로 바꾸어, 화자의 치유 능력이 불가능해진다는 뜻을 덧붙입니다. ἵνα 아래의 부정은 보고·깨닫고·돌이키는 연쇄 및 그에 따른 치유가 일어나지 않음을 나타내므로, 한국어에서도 목적/결과 관계를 유지하되 치유 동사 자체를 부정하지 않아야 합니다.
  naturalness: ‘그들의 마음을 완고하게 하셨습니다’와 ‘눈으로 보지 못하고 마음으로 깨닫지 못하며’는 현대 표준어 합쇼체로 자연스럽습니다. 다만 ‘돌이켜, 내가 그들을 고치지 못하게’는 문법적 연결과 의미 모두 부자연스럽습니다. ‘…돌이켜 내가 그들을 고치게 되지 않도록’으로 연결하면 인용문의 목적/결과 구조가 자연스럽게 드러납니다.
  terminology: ‘마음’, ‘완고하게 하셨습니다’, ‘돌이켜’, ‘고치다’는 각각 καρδία, ἐπώρωσεν, στραφῶσιν, ἰάσομαι에 적절합니다. ‘돌이켜’는 ‘회개하다’보다 해석을 덜 가하므로 유지하는 것이 좋습니다. 각주 표지도 내용과 일치하도록 재배치해야 합니다.
  issues:
  - severity: high
    issue: ἰάσομαι의 의미가 ‘고치지 못하게’로 역전됨
    rationale: 그리스어는 ‘내가 그들을 고칠 것이다’라는 1인칭 미래 능동형입니다. 목적/결과 문맥상 치유가 발생하지 않도록 한다는 뜻이지만, ‘내가 고치지 못하다’는 원문에 없는 무능·불가능의 의미를 만듭니다.
  - severity: medium
    issue: 각주 a의 표지와 내용이 불일치함
    rationale: 각주 a는 ‘turn’의 대안이라고 설명하지만 본문 표지는 ‘완고하게 하셨습니다’ 뒤에 있습니다. 표지는 ‘돌이켜’에 붙어야 합니다.
  - severity: medium
    issue: 각주 b와 c의 표지 및 설명이 서로 맞지 않음
    rationale: 이사야 6:10 반영 각주는 해당 인용문 전체 또는 절 끝에 붙이는 것이 적절하며, 미래형/조건적 뉘앙스 각주는 ‘고치게 되지 않도록’에 붙어야 합니다. 현 초안은 b가 ‘돌이켜’에, c가 부정된 치유 표현에 붙어 있어 감사 추적과 내용이 혼선됩니다.
