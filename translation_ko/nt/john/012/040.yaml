id: JHN.12.40
reference: John 12:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
  footnotes:
  - marker: a
    text: Or 'be converted' for 'turn.'
    reason: lexical_alternative
  - marker: b
    text: Some translations read 'I will heal them'; the Greek form is future, but 'I would heal them' fits the quoted purpose/result construction in English.
    reason: lexical_alternative
  - marker: c
    text: This line echoes Isaiah 6:10.
    reason: cross_reference
translation:
  language: ko
  text: 그가 그들의 눈을 멀게 하셨고 그들의 마음을 완고하게 하셨습니다. 이는 그들이 눈으로 보지 못하고 마음으로 깨닫지 못하며 돌이켜[a], 내가 그들을 고치게 되지 않도록 하신 것입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회심하다’.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 이사야 6:10을 반영합니다.
    reason: cross_reference
  - marker: c
    text: 직역하면 ‘내가 그들을 고칠 것이다’입니다. 여기서는 앞의 목적/결과 절에 맞추어 ‘고치게 되지 않도록’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τετύφλωκεν
  english_pob_choice: has blinded
  chosen_korean: 눈을 멀게 하셨습니다
  alternatives_korean:
  - 눈을 가리셨습니다
  - 눈이 멀게 하셨습니다
  lexicon: BDAG
  rationale: 완료 시상의 결과 상태를 살리면서, 주어의 능동적 행위를 분명히 드러내는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐπώρωσεν
  english_pob_choice: hardened
  chosen_korean: 마음을 완고하게 하셨습니다
  alternatives_korean:
  - 마음을 굳게 하셨습니다
  - 마음을 완악하게 하셨습니다
  lexicon: BDAG
  rationale: πωρόω의 ‘굳어지게 하다/완고하게 하다’라는 강한 경고적·심판적 뉘앙스를 살리기 위해 ‘완고하게 하다’를 택했습니다.
- source_word: καρδίαν / καρδίᾳ
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속마음
  lexicon: BDAG
  rationale: 성경적 ανθρωπολογία의 ‘heart’를 한국어의 자연스러운 ‘마음’으로 옮기되, 지적·의지적 인식 기능도 함께 담도록 했습니다.
- source_word: στραφῶσιν
  english_pob_choice: turn
  chosen_korean: 돌이켜
  alternatives_korean:
  - 돌아서
  - 회개하여
  lexicon: BDAG
  rationale: 직역적이면서도 회개의 방향성을 담는 ‘돌이켜’를 사용해, 영어 POB가 지킨 의미의 폭을 한국어에서도 유지했습니다.
- source_word: ἰάσομαι
  english_pob_choice: I would heal
  chosen_korean: 내가 그들을 고치지 못하게 하셨습니다
  alternatives_korean:
  - 내가 그들을 고치리라
  - 내가 그들을 고칠 것입니다
  lexicon: BDAG
  rationale: 인용절 안의 목적/결과 구조를 따라 한국어에서도 ‘would heal’의 조건적·서술적 뉘앙스를 살렸습니다. 본문이 말하는 바를 명시하기 위해 부정형으로 풀어 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 심판과 완고하게 하심의 직접성
  chosen_reading: 주어를 분명히 ‘그가’로 두고, 눈을 멀게 하시고 마음을 완고하게 하셨다고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 수동적으로 흐리는 표현
  - 행위 주체를 생략하는 번역
  rationale: 이 구절은 이사야 6:10을 인용하며 신적 심판의 긴장을 직접적으로 드러냅니다. 번역에서 그 긴장을 완화하지 않고 보존하는 것이 소스에 충실합니다.
  doctrine_reference: Translation philosophy §3
- issue: ἰάσομαι의 미래형과 인용문 내 목적절의 관계
  chosen_reading: ‘내가 그들을 고치지 못하게 하셨습니다’로 옮겨, 결과적으로 치유가 일어나지 않게 되는 의미를 드러냈습니다.
  alternative_readings:
  - 내가 그들을 고칠 것입니다
  - 내가 그들을 고치리라
  rationale: 그리스어 미래형을 그대로 직설 미래로만 옮기면 인용문의 목적/결과 구조가 덜 선명해집니다. 본문 흐름에 맞춰 한국어에서는 결과적 의미를 드러내는 쪽이 더 정확합니다.
  doctrine_reference: Translation philosophy §3
