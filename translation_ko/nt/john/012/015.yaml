  source_fidelity: 그리스어의 핵심 의미는 대체로 반영되어 있으나, καθήμενος ἐπὶ πῶλον ὄνου는 ‘나귀의 새끼를 타고’보다 ‘나귀 새끼 위에 앉아’가 더 직접적입니다. 또한 원문의 호격과 2인칭 소유 표현을 현대 합쇼체 안에서 일관되게 처리할 필요가 있습니다.
  naturalness: 초안은 ‘두려워하지 마십시오/오신다/계십니다’와 ‘딸아/보아라/네’가 섞여 있어 요청된 현대 공손체(합쇼체) register가 일관되지 않습니다. 수정문은 예언적 호격의 문체를 유지하면서 공손체 종결을 일관되게 사용합니다.
  terminology: ‘시온의 딸’은 예언적 의인화를 보존하는 적절한 표현입니다. ‘왕’의 대문자화는 한국어에 적용되지 않으므로 ‘왕’으로 두었습니다. ‘예수님’은 원문에 명시되지 않으므로 본문에는 넣지 않고, 상호참조 주석에서만 문맥적 설명으로 유지했습니다.
