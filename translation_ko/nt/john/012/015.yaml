id: JHN.12.15
reference: John 12:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
  footnotes:
  - marker: a
    text: Or 'Do not fear.'
    reason: lexical_alternative
  - marker: b
    text: '''Daughter of Zion'' is a prophetic personification of Zion/Jerusalem.'
    reason: cultural_note
  - marker: c
    text: Or 'Behold' or 'See.'
    reason: lexical_alternative
  - marker: d
    text: Literally, 'on a colt of a donkey.'
    reason: lexical_alternative
  - marker: e
    text: This wording echoes Zechariah 9:9, presenting Jesus as Zion’s promised king.
    reason: cross_reference
translation:
  language: ko
  text: 「두려워하지 마십시오, 시온의 딸아. 보아라, 네 왕이 오신다. 그는 나귀의 새끼를 타고 계십니다.」[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워하지 말라’.
    reason: lexical_alternative
  - marker: b
    text: ‘시온의 딸’은 시온/예루살렘을 가리키는 예언적 의인화입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘보라’, ‘보십시오’.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘나귀의 새끼 위에’.
    reason: lexical_alternative
  - marker: e
    text: 이 표현은 스가랴 9:9를 반향하며, 예수님을 시온이 기다리던 왕으로 제시합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ φοβοῦ
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 두려워하지 마세요
  - 무서워하지 마십시오
  - 두려워하지 말라
  lexicon: BDAG
  rationale: μή + 현재 중간/수동 명령형은 두려움 금지를 나타내므로, 현대 표준어의 공손한 금지형으로 자연스럽게 옮겼습니다.
- source_word: θυγάτηρ Σιών
  english_pob_choice: daughter of Zion
  chosen_korean: 시온의 딸
  alternatives_korean:
  - 시온의 딸이여
  - 시온 딸
  - 시온의 처녀
  lexicon: BDAG
  rationale: 예언적 의인화 표현을 살려 직역에 가깝게 옮겼고, 한국어 성경 문맥에서 익숙한 ‘시온의 딸’을 유지했습니다.
- source_word: ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보아라
  alternatives_korean:
  - 보십시오
  - 보라
  - 여기
  lexicon: BDAG
  rationale: 주의를 환기하는 지시어이므로, 본문 흐름을 살리면서도 현대적인 감각의 감탄·지시 표현으로 처리했습니다.
- source_word: ἐπὶ πῶλον ὄνου
  english_pob_choice: on a donkey’s colt
  chosen_korean: 나귀의 새끼를 타고 계십니다
  alternatives_korean:
  - 나귀 새끼 위에 앉아 계십니다
  - 나귀의 새끼 위에 계십니다
  - 어린 나귀를 타고 계십니다
  lexicon: BDAG
  rationale: πῶλος ὄνου는 ‘나귀의 새끼/어린 나귀’를 뜻하므로, 문맥상 왕의 도래를 한국어로 자연스럽게 드러내기 위해 ‘타고 계십니다’로 옮겼습니다.
theological_decisions:
- issue: 시가/예언 인용의 메시아 왕권 표현
  chosen_reading: ‘네 왕’과 현재형 ‘오신다’를 유지해 예언적 성취와 임박성을 드러냈습니다.
  alternative_readings:
  - ‘네 임금’
  - ‘네 왕이 오고 있다’
  - ‘네 왕이 오십니다’
  rationale: 본문은 스가랴 9:9의 메시아 왕 이미지를 직접 반향하므로, 해설을 덧붙이지 않고도 왕권과 도래의 긴박함이 드러나도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
