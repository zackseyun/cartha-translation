id: JHN.12.44
reference: John 12:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
  footnotes:
  - marker: a
    text: Or, “Whoever believes in me.”
    reason: lexical_alternative
  - marker: b
    text: This does not deny that Jesus is the proper object of faith; it expresses that believing in him is inseparable from believing in the Father who sent him.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 큰 소리로 외쳐 말씀하셨습니다. 「나를 믿는 사람은 나를 믿는 것이 아니라 나를 보내신 분을 믿는 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “누구든지 나를 믿는 사람은.”
    reason: lexical_alternative
  - marker: b
    text: 이 말은 예수님이 믿음의 올바른 대상이 아니라는 뜻이 아니라, 예수님을 믿는 믿음이 그를 보내신 아버지를 믿는 믿음과 분리될 수 없음을 나타냅니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν
  english_pob_choice: But Jesus cried out and said
  chosen_korean: 예수께서 큰 소리로 외쳐 말씀하셨습니다
  alternatives_korean:
  - 예수께서 외쳐 말씀하셨습니다
  - 예수께서 소리 높여 말씀하셨습니다
  lexicon: BDAG
  rationale: ἔκραξεν은 단순히 말한 것이 아니라 공적인 자리에서 크게 외친 뉘앙스가 있어, 한국어에서도 ‘큰 소리로 외쳐’로 음성과 강조를 함께 살렸습니다.
- source_word: Ὁ πιστεύων
  english_pob_choice: The one who believes
  chosen_korean: 나를 믿는 사람은
  alternatives_korean:
  - 믿는 사람은
  - 믿는 이는
  lexicon: BDAG
  rationale: 관사+현재분사는 일반성을 가진 명사구이므로, 현대 한국어에서는 자연스러운 ‘나를 믿는 사람은’으로 옮겨 generic한 뜻을 드러냈습니다.
- source_word: πιστεύει εἰς ἐμὲ
  english_pob_choice: believes in me
  chosen_korean: 나를 믿는
  alternatives_korean:
  - 나 안에 믿는
  - 나에게 믿는
  lexicon: BDAG
  rationale: πιστεύω+εἰς는 요한복음에서 통상 ‘믿다/믿는’으로 옮기는 것이 가장 정확하며, ‘나를 믿는’이 한국어에서도 의미를 자연스럽게 전달합니다.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  english_pob_choice: but in the one who sent me
  chosen_korean: 나를 보내신 분을 믿는 것입니다
  alternatives_korean:
  - 나를 보내신 이를 믿는 것입니다
  - 나를 보내신 분에게 믿는 것입니다
  lexicon: BDAG
  rationale: ἀλλά의 대조를 살리면서도, 본문이 ‘그분’을 직함처럼 지시하므로 ‘보내신 분’을 유지했습니다. 본문에는 ‘아버지’가 없으므로 메인 텍스트에서 특정하지 않았습니다.
theological_decisions:
- issue: 예수님을 믿는 것과 보내신 이를 믿는 것이 서로 분리되는 것처럼 들릴 수 있음
  chosen_reading: 본문의 역설을 유지해, 예수님을 믿는 믿음이 곧 예수님을 보내신 분께 향하는 믿음임을 드러내도록 했습니다.
  alternative_readings:
  - ‘나를 믿는 것이 곧 나를 보내신 분을 믿는 것입니다’
  - ‘나만 믿는 것이 아니라 나를 보내신 분을 믿는 것입니다’
  rationale: 헬라어에는 ‘오직’이 없으므로 이를 덧붙여 긴장을 해소하지 않았습니다. 요한복음의 신학 안에서 예수와 보내신 분의 연합을 번역이 지나치게 설명하지 않도록 했습니다.
  doctrine_reference: 요 12:44; 번역 철학 §3 신학적 긴장 보존
