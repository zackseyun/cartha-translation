id: JHN.12.7
reference: John 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
  footnotes:
  - marker: a
    text: Or, 'Leave her alone; she has kept it for the day of my burial.' Some understand the clause as describing what she has already done rather than what she may yet do.
    reason: alternative_reading
  - marker: b
    text: Or, 'Leave her alone, so that she may keep it until the day of my burial.' The Greek construction can also be taken with a more explicit temporal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수께서 말씀하셨습니다[a]. 「그 여자를 그냥 두십시오[b]. 그 여자가 내 장례의 날을 위하여 그것을 간직하게 하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「그 여자를 그냥 두십시오. 그녀가 내 장례의 날을 위하여 그것을 간직해 왔습니다.」 어떤 이들은 이 절을, 그녀가 앞으로 그렇게 하게 하라는 뜻이 아니라 이미 그렇게 했다는 뜻으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는, 「그 여자를 그냥 두십시오. 그 여자가 내 장례 날까지 그것을 간직하게 하십시오.」 헬라어 구조는 더 분명한 시간적 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그래서
  alternatives_korean:
  - 그러므로
  - 그다음에
  lexicon: BDAG
  rationale: 서술의 논리적·사건적 이어짐을 자연스러운 현대 한국어로 살렸습니다.
- source_word: Ἄφες αὐτήν
  english_pob_choice: Leave her alone
  chosen_korean: 그 여자를 그냥 두십시오
  alternatives_korean:
  - 그녀를 내버려 두십시오
  - 그 여자를 놔두십시오
  lexicon: BDAG
  rationale: 행동을 중단시키는 명령의 힘을 살리되, 합쇼체에서 자연스럽고 직접적인 표현으로 옮겼습니다.
- source_word: ἵνα ... τηρήσῃ αὐτό
  english_pob_choice: so that she may keep it
  chosen_korean: 그래서 내 장례를 위해 그것을 간직하게 하십시오
  alternatives_korean:
  - 그래서 내 장례 날까지 그것을 지키게 하십시오
  - 그래서 내 장례를 위해 그것을 보존하게 하십시오
  lexicon: BDAG
  rationale: ἵνα 절의 목적/결과 관계를 보존하면서 τηρέω의 ‘간직하다/보관하다’ 의미를 반영했습니다.
- source_word: τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου
  english_pob_choice: the day of my burial
  chosen_korean: 내 장례를 위해
  alternatives_korean:
  - 내 장례 날을 위해
  - 내 매장일을 위해
  lexicon: BDAG
  rationale: 직역식 ‘장례의 날’도 가능하지만, 한국어에서는 ‘내 장례를 위해’가 목적 관계를 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: ἵνα 절의 의미와 문장 흐름
  chosen_reading: 예수께서 여인이 향유를 더 이상 방해받지 않게 하시고, 그것이 자신의 장례와 연결되도록 두라고 말씀하신 것으로 옮겼습니다.
  alternative_readings:
  - 그녀가 이미 그것을 내 장례를 위해 간직해 왔다는 뜻으로 옮김
  - 그녀가 내 장례 날까지 그것을 간직하도록 하라는 뜻으로 옮김
  rationale: 헬라어 구문은 실제로 양방향 해석이 가능하므로, 본문이 지닌 긴장을 없애지 않으면서도 한글 본문에서는 가장 직접적인 목적 구조를 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
