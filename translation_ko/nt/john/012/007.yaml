revisions:
- from: 그래서 예수께서 말씀하셨습니다. 「그 여자를 그냥 두십시오. 그래서 내 장례를 위해 그것을 간직하게 하십시오.」[a][b]
  to: 그러자 예수께서 말씀하셨습니다[a]. 「그 여자를 그냥 두십시오[b]. 그 여자가 내 장례의 날을 위하여 그것을 간직하게 하십시오.」
  rationale: 원문의 논리적 연결은 ‘그러자’로 자연스럽게 유지하고, ἵνα + 접속법의 목적/허용 구조는 ‘…간직하게 하십시오’로 보존했습니다. 또한 εἰς τὴν ἡμέραν에 들어 있는 ‘날’을 본문에 회복했습니다. 논쟁적인 구문의 대안, 곧 이미 간직했다는 독법과 ‘…날까지’라는 시간적 독법은 각주에 남겨 본문의 모호성을 해소하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:43Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 명령과 ἵνα 목적절의 미래지향적 독법은 대체로 충실합니다. 다만 본문의 εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου는 ‘내 장례를 위해’보다 ‘내 장례의 날을 위하여’처럼 ‘날’의 요소를 드러내는 편이 더 정확합니다.
  naturalness: 초안의 ‘그래서 … 그래서’ 반복은 현대 한국어 문장 흐름에서 어색합니다. ‘그러자’로 서술 연결을 자연스럽게 하고, 각주 표지를 해당 구절 가까이에 배치하면 읽기와 참조가 명료해집니다.
  terminology: ‘그 여자를 그냥 두십시오’와 ‘간직하다’는 명령의 어조와 τηρέω의 의미를 적절히 전달합니다. ‘내 장례의 날’은 ἐνταφιασμοῦ의 매장/장례 맥락을 유지하면서도 현대적이고 이해 가능한 표현입니다.
  issues:
  - severity: medium
    issue: 본문에서 ‘날’(τὴν ἡμέραν)의 의미가 빠져 있습니다.
    rationale: ‘내 장례를 위해’도 목적성을 전달하지만, 원문은 특별히 예수의 장례의 ‘날’을 향한 보존을 말합니다. 이를 본문에 반영해야 합니다.
  - severity: low
    issue: ‘그래서’가 한 절 안에서 반복됩니다.
    rationale: οὖν과 ἵνα의 연결을 각각 ‘그래서’로 옮겨 의미는 통하지만, 문체가 부자연스럽습니다. ‘그러자’와 ‘…하게 하십시오’의 목적 구성으로 구별하는 것이 자연스럽습니다.
  - severity: low
    issue: 각주 b의 인용문이 본문 명령의 직접 인용 형태와 일치하지 않습니다.
    rationale: ‘그 여자를 그냥 두셔서’보다 본문과 같이 ‘그 여자를 그냥 두십시오’로 두고, 뒤 절에서 ‘…날까지’를 제시해야 대안의 차이가 명확해집니다.
