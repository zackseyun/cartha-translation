  to: 그래서 예수께서 그들에게 말씀하셨습니다. 「빛이 아직 잠시 동안 여러분 가운데[a] 있습니다. 여러분에게 빛이 있는 동안 걸으십시오. 어둠이 여러분을 덮치지 않도록 하십시오. 어둠 속에서 걷는 사람은 자기가 어디로 가는지 알지 못합니다.」
