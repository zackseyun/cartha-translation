id: JHN.12.35
reference: John 12:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
  footnotes:
  - marker: a
    text: Or “in you” or “with you.” The Greek phrase can be understood in more than one way, though “among you” best fits the immediate context of Jesus’ present public presence.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 예수께서 그들에게 말씀하셨습니다. 「빛이 아직 잠시 동안 여러분 가운데[a] 있습니다. 여러분에게 빛이 있는 동안 걸으십시오. 어둠이 여러분을 덮치지 않도록 하십시오. 어둠 속에서 걷는 사람은 자기가 어디로 가는지 알지 못합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「여러분 안에」, 「여러분과 함께」. 그리스어 구문은 여러 방식으로 이해될 수 있지만, 바로 앞 문맥에서 예수의 공개적 임재를 가리키는 「여러분 가운데」가 가장 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν
  english_pob_choice: among you
  chosen_korean: 여러분 가운데
  alternatives_korean:
  - 여러분 안에
  - 여러분과 함께
  lexicon: BDAG
  rationale: 공적 자리에서 예수께서 청중에게 자신이 빛으로서 ներկայ해 계신 상황이므로, 내적 내주보다 공동체적·현장적 임재를 드러내는 「가운데」가 가장 자연스럽습니다.
- source_word: Ἔτι μικρὸν χρόνον
  english_pob_choice: still ... for a little while
  chosen_korean: 아직 잠시 동안
  alternatives_korean:
  - 아직 조금만 더
  - 조금 더
  lexicon: BDAG
  rationale: ἔτι의 「아직/여전히」와 μικρὸν χρόνον의 짧은 시간을 함께 살려, 종료가 임박한 시간을 간결하게 표현했습니다.
- source_word: περιπατεῖτε
  english_pob_choice: Walk
  chosen_korean: 걸으십시오
  alternatives_korean:
  - 행하십시오
  - 삶을 사십시오
  lexicon: BDAG
  rationale: 이미지를 평이하게 유지하되, 한국어에서는 현재 명령형보다 「걸으십시오」가 원문의 행위적 비유를 더 직접적으로 드러냅니다.
- source_word: καταλάβῃ
  english_pob_choice: overtake
  chosen_korean: 덮치지 못할 것입니다
  alternatives_korean:
  - 붙잡지 못할 것입니다
  - 사로잡지 못할 것입니다
  lexicon: BDAG
  rationale: 어둠이 사람을 향해 다가와 휩쓸어 가는 장면을 살리기 위해, 단순한 추상어보다 동적이고 위협적인 「덮치다」를 택했습니다.
theological_decisions:
- issue: τὸ φῶς의 상징을 어디까지 명시적으로 풀어 쓸지
  chosen_reading: 본문의 상징을 그대로 유지해 「빛」으로 직역합니다.
  alternative_readings:
  - 예수님이 빛이십니다
  - 진리의 빛
  rationale: 요한복음의 빛/어둠 대비를 본문 자체의 이미지로 남겨 두는 것이 더 원문 충실적이며, 예수의 정체를 해설로 미리 확정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
