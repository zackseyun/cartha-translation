id: JHN.12.27
reference: John 12:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
  footnotes:
  - marker: a
    text: Or, 'What should I say? “Father, save me from this hour”?' The Greek may also be read as a rhetorical question rather than a direct request.
    reason: alternative_reading
translation:
  language: ko
  text: 지금 내 영혼이 괴로워합니다[a]. 내가 무엇이라고 말하겠습니까? 아버지, 이 때에서 나를 구해 주십시오. 그러나 내가 바로 이 때를 위하여 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 무엇이라고 말하겠습니까? “아버지, 이 때에서 나를 구해 주십시오”?’로 읽을 수 있습니다. 헬라어는 수사적 질문으로도 해석될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  english_pob_choice: Now
  chosen_korean: 지금
  alternatives_korean:
  - 이제
  - 바로 지금
  lexicon: BDAG
  rationale: 즉시성을 나타내는 부사로서 ‘지금’이 가장 자연스럽고, 문장의 긴박감을 잘 살립니다.
- source_word: ἡ ψυχή μου
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 혼
  - 내 목숨
  - 내 자아
  lexicon: BDAG
  rationale: 요한복음에서 예수의 내적 존재와 고통을 드러내는 표현으로, ‘영혼’이 중립적이면서도 무게를 유지합니다.
- source_word: τετάρακται
  english_pob_choice: is troubled
  chosen_korean: 괴로워합니다
  alternatives_korean:
  - 불안합니다
  - 흔들립니다
  - 고통받습니다
  lexicon: BDAG
  rationale: 완료 수동태가 나타내는 현재의 뒤흔들린 상태를 한국어 현재형으로 옮기되, 단순 감정보다 더 강한 내적 동요를 ‘괴로워합니다’로 살렸습니다.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  english_pob_choice: save me from this hour
  chosen_korean: 이 때에서 나를 구해 주십시오
  alternatives_korean:
  - 이 시간에서 나를 구원해 주십시오
  - 이 순간에서 나를 건져 주십시오
  lexicon: BDAG
  rationale: ἐκ은 ‘~에서/부터’의 분리를 나타내므로 ‘이 때에서’로 직접 살렸고, 간구형 명령은 합쇼체 청원형으로 옮겼습니다. ‘구해 주십시오’는 본문의 구출/해방 뉘앙스를 자연스럽게 전달합니다.
- source_word: ὥρα
  english_pob_choice: hour
  chosen_korean: 이 때
  alternatives_korean:
  - 이 시간
  - 이 순간
  lexicon: BDAG
  rationale: 요한복음의 신학적으로 짙은 ‘hour’를 한국어에서 직역하면 오해될 수 있어, 사건의 결정적 때를 드러내는 ‘때’로 옮기되 지시어를 유지했습니다.
theological_decisions:
- issue: 예수의 말씀 ‘Father, save me from this hour’의 해석을 직접 간구로 볼지, 수사적 질문의 일부로 볼지
  chosen_reading: 본문 흐름대로 직접 발화로 옮기되, 해석 가능성의 긴장은 각주로 보존합니다.
  alternative_readings:
  - ‘내가 무엇이라고 말하겠습니까? “아버지, 이 때에서 나를 구해 주십시오”?’처럼 수사적 질문으로 이해
  - 간구를 거절되는 말로 읽는 해석
  rationale: 초기 사본에는 문장부호가 없으므로 두 독해가 가능하지만, SBLGNT의 제시를 따라 직접 청원으로 옮기면 예수의 실제 두려움과 사명을 향한 순종 사이의 긴장이 그대로 드러납니다. 다만 수사적 가능성은 각주로 남겨 독단적으로 해소하지 않습니다.
  doctrine_reference: '번역 철학: 신학적 긴장을 보존하고 단정적으로 해소하지 않음.'
