  to: 지금 내 영혼이 괴로워합니다[a]. 내가 무엇이라고 말하겠습니까? 아버지, 이 때를 피하게 해 주십시오. 그러나 바로 이 때문에 내가 이 때에 이르렀습니다.
  rationale: The revision distinguishes διὰ τοῦτο (‘바로 이 때문에’) from εἰς τὴν ὥραν ταύτην (‘이 때에 이르렀습니다’), thereby following the Greek syntax and preserving the Johannine ‘hour’ motif. It also replaces an unnatural Korean expression with an idiomatic request for deliverance, while retaining the alternative punctuation/reading in the footnote.
