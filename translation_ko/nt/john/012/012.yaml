lexical_decisions:
- source_word: Τῇ ἐπαύριον
  english_pob_choice: The next day
  chosen_korean: 이튿날에
  alternatives_korean:
  - 다음 날에
  - 그 이튿날에
  lexicon: BDAG
  rationale: 관용적인 시간 부사구로 자연스럽게 옮기되, 서술의 연속성을 살렸습니다.
- source_word: ὁ ὄχλος πολὺς
  english_pob_choice: the large crowd
  chosen_korean: 큰 무리
  alternatives_korean:
  - 많은 무리
  - 큰 군중
  - 큰 사람들
  lexicon: BDAG
  rationale: ὄχλος는 ‘무리/군중’의 뜻이므로, πολὺς의 규모감을 살려 ‘큰 무리’로 옮겼습니다.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  english_pob_choice: that had come to the feast
  chosen_korean: 절기에 왔던
  alternatives_korean:
  - 절기에 온
  - 명절에 왔던
  - 축제에 왔던
  lexicon: BDAG
  rationale: 정관사+분사구가 수식절 역할을 하므로 ‘왔던’으로 과거 선행성을 드러냈고, ἑορτή는 문맥상 ‘절기’로 옮겼습니다.
- source_word: ἀκούσαντες ὅτι ἔρχεται
  english_pob_choice: when they heard that Jesus was coming
  chosen_korean: 예수께서 ... 오신다는 것을 듣고
  alternatives_korean:
  - 예수께서 ... 오신다는 말을 듣고
  - 예수께서 ... 오신다는 소식을 듣고
  lexicon: BDAG
  rationale: 분사구의 시간적 의미를 ‘-는 것을 듣고’로 자연스럽게 풀어, 역사적 현재 ἔρχεται는 내용절 안에서 현재형의 생생함을 살렸습니다.
- source_word: εἰς Ἱεροσόλυμα
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘으로
  alternatives_korean:
  - 예루살렘에
  - 예루살렘 안으로
  lexicon: BDAG
  rationale: 이동 방향을 나타내는 εἰς를 한국어의 방향 격조사 ‘-으로’로 옮겼습니다.
theological_decisions:
- issue: ἑορτή의 절기/명절/축제 선택
  chosen_reading: ‘절기’로 번역해 요한복음의 유월절 문맥을 유지했습니다.
  alternative_readings:
  - 명절
  - 축제
  - 절기와 축제를 병기
  rationale: 본문의 ἑορτή는 일반적 축제보다 유대 종교 절기의 뉘앙스가 강하므로, 문맥에 더 정확한 ‘절기’를 택했습니다.
  doctrine_reference: 요한복음의 유대 절기 서술 맥락
