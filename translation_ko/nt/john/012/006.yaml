    text: 직역하면, ‘가난한 사람들에 관하여 그에게 관심이 있었기 때문이 아니라.’ μέλει는 여기서 어떤 사람들에게 관심을 두거나 돌보는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돈주머니.’ γλωσσόκομον은 돈을 넣어 두는 용기나 상자를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision restores the source's single contrasted motivation, renders concern for the poor more precisely in idiomatic 합쇼체, and makes Judas's repeated misappropriation explicit without overtranslating the lexical verb apart from its immediate context. Footnote a is corrected to reflect the actual Greek construction, while footnote b remains properly anchored to 돈함.
