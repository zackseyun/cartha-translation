id: JHN.12.6
reference: John 12:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: Now he said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the moneybag.' The Greek term can refer to a container for holding money.
    reason: lexical_alternative
  - marker: b
    text: Or 'he carried off' or 'he used to steal what was put into it.' The verb often means 'carry' or 'bear,' but here the context ('he was a thief') indicates misappropriation.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 이 말을 한 것은 가난한 사람들을 돌보는 데 관심이 있어서가 아니라[a], 그가 도둑이었고 돈함[b]을 맡아 그 안에 넣어 둔 것을 빼돌리곤 했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘가난한 사람들에 관하여 그에게 관심이 있었기 때문이 아니라.’ μέλει는 여기서 어떤 사람들에게 관심을 두거나 돌보는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돈주머니.’ γλωσσόκομον은 돈을 넣어 두는 용기나 상자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  english_pob_choice: not because he cared about the poor
  chosen_korean: 가난한 사람들을 생각해서 이 말을 한 것이 아닙니다
  alternatives_korean:
  - 가난한 사람들을 염려해서가 아니었습니다
  - 가난한 사람들에게 마음이 있었던 것이 아닙니다
  lexicon: BDAG
  rationale: μέλει/ἔμελεν의 ‘관심·염려’ 의미를 한국어의 자연스러운 ‘생각하다/염려하다’로 옮겨, 부정된 동기를 분명하게 드러냈습니다.
- source_word: κλέπτης ἦν
  english_pob_choice: he was a thief
  chosen_korean: 그는 도둑이었고
  alternatives_korean:
  - 그는 도둑이었습니다
  - 그는 절도범이었고
  lexicon: BDAG
  rationale: κλέπτης는 은밀히 훔치는 자를 가리키므로, 직설적이고 일상적인 ‘도둑’이 가장 자연스럽고 본문 비난의 강도도 잘 살립니다.
- source_word: τὸ γλωσσόκομον
  english_pob_choice: the money box
  chosen_korean: 돈함
  alternatives_korean:
  - 돈주머니
  - 돈궤
  lexicon: BDAG
  rationale: γλωσσόκομον의 기본 의미가 돈을 넣는 용기이므로, 전통적 ‘돈주머니’보다 용기라는 이미지가 드러나는 ‘돈함’을 채택했습니다.
- source_word: τὰ βαλλόμενα ἐβάσταζεν
  english_pob_choice: he used to take what was put into it
  chosen_korean: 거기에 넣는 것을 빼돌렸습니다
  alternatives_korean:
  - 거기에 넣는 것을 가져갔습니다
  - 거기에 넣는 것을 훔쳐 갔습니다
  lexicon: BDAG
  rationale: ἐβάσταζεν의 사전적 ‘지니다/들다’보다 문맥상 착복·유용의 의미가 분명하므로, 한국어에서도 ‘빼돌리다’로 John의 고발 의도를 살렸습니다.
theological_decisions:
- issue: ἐβάσταζεν의 의미를 단순한 운반으로 완화할지 여부
  chosen_reading: 도둑이라는 설명과 함께, 돈함에 들어오는 것을 지속적으로 빼돌리는 행위로 번역했습니다.
  alternative_readings:
  - 그것을 운반했습니다
  - 그것을 지녔습니다
  rationale: 문맥이 이미 유다의 절도 행위를 밝히므로, 동사의 의미를 중립적으로 눌러 버리면 저자의 고발이 약화됩니다. 따라서 반복적 착복의 뉘앙스를 살리는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 원문의 고발 강도를 보존하고, 전통적 완곡화보다 소스 중심 의미를 우선합니다.
