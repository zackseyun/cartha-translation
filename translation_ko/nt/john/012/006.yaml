revisions:
- from: 그는 가난한 사람들을 생각해서 이 말을 한 것이 아닙니다[a]. 그는 도둑이었고, 돈함[b]을 맡고 있으면서 거기에 넣는 것을 빼돌렸습니다.
  to: 그가 이 말을 한 것은 가난한 사람들을 돌보는 데 관심이 있어서가 아니라[a], 그가 도둑이었고 돈함[b]을 맡아 그 안에 넣어 둔 것을 빼돌리곤 했기 때문입니다.
  rationale: The revision restores the source's single contrasted motivation, renders concern for the poor more precisely in idiomatic 합쇼체, and makes Judas's repeated misappropriation explicit without overtranslating the lexical verb apart from its immediate context. Footnote a is corrected to reflect the actual Greek construction, while footnote b remains properly anchored to 돈함.
  reviewer_model: gpt-5.6-terra
