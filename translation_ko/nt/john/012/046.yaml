id: JHN.12.46
reference: John 12:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
  footnotes:
  - marker: a
    text: Or 'a light.' The Greek lacks the article, and the phrase may be rendered either qualitatively ('as light') or more literally ('a light').
    reason: lexical_alternative
  - marker: b
    text: Or 'whoever believes in me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 세상에 빛으로[a] 왔습니다. 이는 나를 믿는 모든 사람[b]이 어둠에 머물지 않게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 빛으로’. 그리스어에는 관사가 없으므로, 질적 의미의 ‘빛으로’로도, 더 문자적으로 ‘한 빛으로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘누구든지 나를 믿는 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 한 빛
  - 빛으로
  lexicon: BDAG
  rationale: 무관사 술어명사로서 예수의 정체와 기능을 드러내는 표현이므로, 한국어에서도 해설을 덧붙이지 않고 ‘빛’으로 간명하게 살렸습니다.
- source_word: εἰς τὸν κόσμον
  english_pob_choice: into the world
  chosen_korean: 세상에
  alternatives_korean:
  - 세상 속으로
  - 세상으로
  lexicon: BDAG
  rationale: εἰς의 이동·진입 의미를 자연스러운 한국어로 옮기되, 요한복음의 ‘세상’ 표지를 살려 ‘세상에 왔습니다’로 표현했습니다.
- source_word: πᾶς ὁ πιστεύων
  english_pob_choice: everyone who believes
  chosen_korean: 나를 믿는 모든 사람
  alternatives_korean:
  - 믿는 모든 사람
  - 누구든지 나를 믿는 사람
  lexicon: BDAG
  rationale: 현재분사와 πᾶς가 이루는 일반적 범주를 한국어의 관용적 관계절로 옮겨, 보편성을 유지하면서도 문장을 자연스럽게 했습니다.
- source_word: ἐν τῇ σκοτίᾳ
  english_pob_choice: in the darkness
  chosen_korean: 어둠에
  alternatives_korean:
  - 그 어둠 속에
  - 어둠 가운데
  lexicon: BDAG
  rationale: 정관사가 가리키는 요한적 영적 실재를 유지하려 했지만, 한국어에서는 ‘어둠에 머물다’가 가장 자연스럽고 상태 지속의 뉘앙스를 잘 드러냅니다.
- source_word: μὴ μείνῃ
  english_pob_choice: may not remain
  chosen_korean: 머물지 않게 하려는 것입니다
  alternatives_korean:
  - 남아 있지 않게 하려는 것입니다
  - 머무르지 않도록 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα + μή + 접속법이 나타내는 목적/결과의 부정 구조를 현대 한국어의 ‘-지 않게 하려는 것입니다’로 옮겨, 문맥의 목적성을 살렸습니다.
theological_decisions:
- issue: 예수의 자기계시를 ‘빛’의 은유로 어떻게 보존할 것인가
  chosen_reading: ‘세상에 빛으로 왔습니다’라고 번역해, 예수가 빛 자체로 오셨다는 은유를 그대로 유지했습니다.
  alternative_readings:
  - ‘세상에 한 빛으로 왔습니다’
  - ‘세상에 빛을 가져오러 왔습니다’
  rationale: 본문은 해설적 문장보다 상징적 자기선언을 제시하므로, 은유를 풀어 설명하지 않고 원문의 힘을 보존하는 쪽을 택했습니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 3, 6
- issue: ‘everyone who believes’의 범위를 어떻게 드러낼 것인가
  chosen_reading: ‘나를 믿는 모든 사람’으로 번역해, 믿는 자들의 보편 범주를 드러내되 구원론 논쟁을 추가하지 않았습니다.
  alternative_readings:
  - ‘누구든지 나를 믿는 사람’
  rationale: 본문 자체는 믿음의 메커니즘을 논쟁적으로 규정하지 않으므로, 초청의 보편성과 약속의 범위만을 충실히 반영했습니다.
  doctrine_reference: Affirmations; Translation philosophy §3
