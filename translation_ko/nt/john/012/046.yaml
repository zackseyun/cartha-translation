  source_fidelity: 첫 문장은 ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα를 대체로 충실히 옮겼습니다. 그러나 둘째 문장의 ‘그래서’는 ἵνα의 목적을 단순 결과·추론으로 흐리며, ‘…머물지 않게 하려는 것입니다’는 앞의 ‘나는’과 문법적으로 매끄럽게 연결되지 않습니다. 목적을 명확히 표시하도록 고쳐야 합니다.
  naturalness: ‘나는 세상에 빛으로 왔습니다. 이는 … 하려는 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 예수의 오심의 목적을 분명히 연결합니다. 각주 표지도 해당 어구 바로 뒤에 두는 편이 독자에게 명료합니다.
  terminology: ‘빛’, ‘세상’, ‘나를 믿는 모든 사람’, ‘어둠에 머물다’는 요한복음의 핵심 어휘와 문맥에 적절합니다. 무관사 φῶς의 대안인 ‘한 빛으로’는 각주에서만 제시하는 것이 안전합니다.
  issues:
