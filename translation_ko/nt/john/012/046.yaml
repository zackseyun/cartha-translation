    rationale: ἵνα πᾶς ... μὴ μείνῃ는 예수께서 빛으로 세상에 오신 목적을 나타냅니다. ‘그래서’는 결과나 담화상 결론으로도 읽히며, ‘나를 믿는 모든 사람은 … 하려는 것입니다’는 사람이 목적을 의도하는 듯한 비자연스러운 구조가 됩니다.
