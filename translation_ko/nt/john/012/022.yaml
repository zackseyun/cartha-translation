  to: 빌립이 안드레에게 와서 말합니다. 안드레와 빌립이 와서 예수께 말합니다.[a]
  rationale: 두 절에서 같은 그리스어 기본 동사 λέγω를 일관되게 ‘말합니다’로 옮겨 원문의 병렬성과 비표지성을 보존했습니다. ‘와서 말합니다’는 ἔρχεται καὶ λέγει/λέγουσιν의 연결을 자연스러운 한국어 연쇄 동작으로 표현하면서 현재형 서술을 유지합니다. 각주도 실제 번역 방식에 맞게 정정했습니다.
