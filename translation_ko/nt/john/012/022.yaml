    reason: korean_style_note
lexical_decisions:
- source_word: ἔρχεται
  english_pob_choice: comes
  chosen_korean: 와서 / 와서 말합니다
  alternatives_korean:
  - 옵니다
  - 찾아갑니다
  lexicon: BDAG
  rationale: 현재형 역사적 현재를 한국어에서도 살려 ‘옵니다’보다 ‘와서’로 이어지는 동작감을 유지했습니다. 첫 동사와 둘째 동사의 연쇄를 자연스럽게 보이도록 했습니다.
- source_word: λέγει
  english_pob_choice: tells
  chosen_korean: 말합니다
  alternatives_korean:
  - 이야기합니다
  - 전합니다
  - 말해 줍니다
  lexicon: BDAG
  rationale: 상대에게 직접 전달하는 동작이므로 단순한 ‘말합니다’가 가장 자연스럽고 원문의 전달성을 보존합니다. ‘전합니다’는 약간 설명적입니다.
- source_word: καὶ λέγουσιν
  english_pob_choice: and tell
  chosen_korean: 와서 말씀드립니다
  alternatives_korean:
  - 가서 말합니다
  - 그리고 말합니다
  - 와서 전합니다
  lexicon: BDAG
  rationale: 두 사람이 예수께 함께 다가가 말하는 장면을 반영하여 ‘와서’와 ‘말씀드립니다’를 연결했습니다. 예수께 드리는 직접적 발화를 존중하는 문맥이므로 공손한 표현을 택했습니다.
- source_word: τῷ Ἰησοῦ
  english_pob_choice: Jesus
  chosen_korean: 예수께
  alternatives_korean:
  - 예수님께
  - 예수에게
  lexicon: BDAG
  rationale: 여격은 한국어에서 조사로 처리하는 것이 자연스럽고, 예수께 대한 존칭은 문맥상 적절하지만 본문은 서술문이므로 과도한 이름형 존칭보다 ‘예수께’가 원문에 더 가깝습니다.
theological_decisions:
- issue: 예수께 말하는 장면의 높임법
  chosen_reading: 서술문은 합쇼체로 유지하되, 예수께 향하는 동작은 ‘예수께’로 표시하고 종결은 ‘말씀드립니다’로 공손성을 반영했습니다.
  alternative_readings:
  - 예수에게 말합니다
  - 예수님께 말씀드립니다
  rationale: 본문은 제자들의 보고 장면이므로 기도문식 존대나 과도한 경어를 덧붙이기보다, 서술체의 공손함만 유지하는 것이 적절합니다.
  doctrine_reference: Narrative register; reverence toward Jesus in Korean translation style
