  to: 나를 거부하고 내 말들을 받아들이지 않는 사람에게는 그를 심판할 이가 있습니다. 내가 말한 그 말이 마지막 날에 그를 심판할 것입니다.[a][b]
  rationale: 복수 ῥήματα를 ‘내 말들’로 옮겨 원문의 수와 뒤따르는 단수 λόγος의 대비를 보존했습니다. λαμβάνω는 이 문맥에서 단순 수령보다 수용의 의미가 분명하므로 ‘받아들이지 않는’으로 다듬었습니다. 나머지 문장은 심판하는 이를 예수께서 하신 ‘그 말’로 식별하는 본문의 긴장을 해소하지 않고 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:48Z'
