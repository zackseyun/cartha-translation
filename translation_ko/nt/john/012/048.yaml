    rationale: 한국어 집합적 단수도 가능하지만, 원문의 복수 ‘내 말들’과 이어지는 단수 λόγος ‘그 말’의 표현상 구별을 살리는 것이 최적 등가 원칙에 더 부합합니다.
  - severity: low
