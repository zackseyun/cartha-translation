  naturalness: 합쇼체는 일관되고 자연스럽습니다. ‘내 말을 받지 않는’도 가능하지만, 이 문맥에서 계시의 말을 수용하지 않는 뜻을 드러내는 ‘내 말들을 받아들이지 않는’이 더 분명하고 자연스럽습니다.
  terminology: ἀθετέω의 ‘거부하다’, κρίνω의 ‘심판하다’, ἐσχάτῃ ἡμέρᾳ의 ‘마지막 날’은 적절합니다. λόγος는 본문에서 ‘그 말’로 유지하고, 각주에서 ‘메시지’ 대안을 제시하는 것이 타당합니다.
