id: JHN.12.48
reference: John 12:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
  footnotes:
  - marker: a
    text: Or 'does not accept my words.' The Greek verb can carry the sense of receiving, welcoming, or accepting.
    reason: lexical_alternative
  - marker: b
    text: Or 'the message that I spoke.' Greek logos can mean 'word' or 'message' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 거부하고 내 말들을 받아들이지 않는 사람에게는 그를 심판할 이가 있습니다. 내가 말한 그 말이 마지막 날에 그를 심판할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 말들을 받지 않는’. 헬라어 동사는 받다, 맞이하다, 받아들이다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 말한 메시지’. 헬라어 λόγος는 문맥에 따라 ‘말’이나 ‘메시지’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  english_pob_choice: rejects
  chosen_korean: 거부하고
  alternatives_korean:
  - 거절하고
  - 배척하고
  - 무시하고
  lexicon: BDAG
  rationale: ἀθετέω는 단순한 무시보다 인격적·권위적 거부의 뜻이 강하므로, 예수 자신을 향한 행위를 드러내는 ‘거부하고’로 옮겼습니다.
- source_word: λαμβάνων τὰ ῥήματά μου
  english_pob_choice: does not receive my words
  chosen_korean: 내 말을 받지 않는
  alternatives_korean:
  - 내 말을 받아들이지 않는
  - 내 말을 받아들이지 않는 사람
  - 내 말씀을 받지 않는
  lexicon: BDAG
  rationale: λαμβάνω는 요한 문맥에서 ‘받다’의 의미가 자연스럽고, ῥήματα는 복수의 실제 발화들을 가리키므로 ‘말’을 써서 직접성을 살렸습니다.
- source_word: ὁ λόγος ὃν ἐλάλησα
  english_pob_choice: the word that I spoke
  chosen_korean: 내가 말한 그 말
  alternatives_korean:
  - 내가 말한 그 말씀
  - 내가 전한 그 말
  - 내가 말한 그 메시지
  lexicon: BDAG
  rationale: λόγος는 여기서 단순 정보가 아니라 예수의 선포된 말 자체를 가리키므로, ‘그 말’로 직역성을 유지하되 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: ἐκεῖνος κρινεῖ αὐτὸν
  english_pob_choice: will judge him
  chosen_korean: 그를 심판할 것입니다
  alternatives_korean:
  - 그를 판단할 것입니다
  - 그를 판결할 것입니다
  - 그를 심판하게 될 것입니다
  lexicon: BDAG
  rationale: κρίνω는 종말론적 심판의 뜻을 포함하므로, 한국어 성경에서 널리 통용되는 ‘심판하다’가 문맥의 무게를 가장 잘 드러냅니다.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  english_pob_choice: on the last day
  chosen_korean: 마지막 날에
  alternatives_korean:
  - 그 마지막 날에
  - 종말의 날에
  - 최후의 날에
  lexicon: BDAG
  rationale: 요한복음의 종말론적 관용구를 현대 한국어로 자연스럽게 옮기되, 특정 교리 체계를 덧붙이지 않기 위해 ‘마지막 날’로 유지했습니다.
theological_decisions:
- issue: 심판의 주체와 예수의 말씀의 관계
  chosen_reading: 예수의 말이 최종 심판의 기준이자 심판 행위의 직접적 매개로 제시되도록 유지했습니다.
  alternative_readings:
  - 예수 자신이 직접 심판한다는 뜻으로 완전히 풀어쓰기
  - 말씀은 단지 기준일 뿐이라고 약화시키기
  rationale: 본문은 먼저 ‘그를 심판하는 이가 있습니다’라고 한 뒤, 그 심판 주체를 ‘내가 말한 그 말’로 식별하므로, 다른 요한문맥과 조화시키며 약화하지 않고 본문의 긴장을 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
