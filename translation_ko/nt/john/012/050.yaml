id: JHN.12.50
reference: John 12:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
  footnotes:
  - marker: a
    text: Or 'his command leads to eternal life' or 'his command concerns eternal life.' The Greek more literally says 'his command is eternal life.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나는 그분의 명령이 영생임을 압니다. 그러므로 내가 말하는 것은 아버지께서 내게 말씀하신 그대로 내가 말하는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 명령은 영생으로 이끕니다’ 혹은 ‘그분의 명령은 영생에 관한 것입니다.’ 헬라어는 더 문자적으로 ‘그분의 명령은 영생입니다’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  english_pob_choice: commandment
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 명령문
  lexicon: BDAG
  rationale: Ἐντολή는 여기서 단순한 도덕적 ‘계명’보다 권위를 지닌 지시나 명령의 성격이 더 분명하므로, 한국어로는 현대적이고 자연스러운 ‘명령’을 택했습니다.
- source_word: ζωὴ αἰώνιος
  english_pob_choice: eternal life
  chosen_korean: 영생
  alternatives_korean:
  - 영원한 생명
  - 영원한 삶
  lexicon: BDAG
  rationale: 요한복음의 관용적 표현을 살리기 위해 ‘영생’을 사용했습니다. 이는 단순한 지속 기간보다 하나님 나라의 생명에 참여한다는 신학적 무게를 잘 드러냅니다.
- source_word: ἃ οὖν ἐγὼ λαλῶ
  english_pob_choice: So what I speak
  chosen_korean: 그러므로 내가 말하는 것은
  alternatives_korean:
  - 그러므로 내가 말하는 것들
  - 그래서 내가 말하는 것은
  lexicon: BDAG
  rationale: 중성 복수 관계대명사 ἃ를 한국어에서는 문맥상 자연스럽게 ‘내가 말하는 것’으로 옮겨, 예수님의 발화 내용을 가리키는 기능을 보존했습니다.
- source_word: εἴρηκέν μοι ὁ πατήρ
  english_pob_choice: has told me
  chosen_korean: 아버지께서 내게 말씀하신 그대로
  alternatives_korean:
  - 아버지께서 내게 말씀하신 대로
  - 아버지께서 내게 말씀하신 바와 같이
  lexicon: BDAG
  rationale: 완료 시상의 지속된 효력을 한국어로 자연스럽게 살리기 위해 ‘말씀하신 그대로’로 옮겼습니다. ‘the Father’는 요한복음의 호칭을 살려 ‘아버지’로 번역했습니다.
theological_decisions:
- issue: ‘그분의 명령이 영생이다’라는 직설적 등식의 보존
  chosen_reading: 본문의 등식을 해설로 풀지 않고, 아버지의 명령과 영생 사이의 직접적인 동일시를 유지했습니다.
  alternative_readings:
  - 그분의 명령은 영생으로 이끕니다
  - 그분의 명령은 영생에 관한 것입니다
  rationale: 헬라어는 해석을 덧붙이지 않는 직접 등식을 사용하므로, 본문이 지닌 신학적 긴장을 보존하기 위해 의미를 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
