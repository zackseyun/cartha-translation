id: JHN.12.11
reference: John 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
  footnotes:
  - marker: a
    text: Or 'many of the Judeans.' In John, 'the Jews' can sometimes refer more specifically to Judeans or to Jewish authorities, depending on context.
    reason: alternative_reading
  - marker: b
    text: Or 'were departing' or 'were leaving.' The Greek verb suggests ongoing movement away, likely from the stance or influence of the authorities opposing Jesus.
    reason: lexical_alternative
  - marker: c
    text: Or 'were putting their faith in Jesus' or 'were trusting in Jesus.'
    reason: lexical_alternative
  - marker: d
    text: Or 'because many of the Jews were going away because of him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 까닭은 많은 유대인들이 그로 인해 떠나가고 예수님을 믿고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인들’은 문맥에 따라 ‘유다인들’ 또는 유대 지도층을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: 그 까닭은 … 때문입니다
  alternatives_korean:
  - 왜냐하면 … 이기 때문입니다
  - … 하였기 때문입니다
  lexicon: BDAG
  rationale: 앞 절의 원인을 받는 접속사로서 자연스러운 현대 한국어 원인 표현을 택했습니다.
- source_word: ὑπῆγον
  english_pob_choice: were going away
  chosen_korean: 떠나가고
  alternatives_korean:
  - 가고 있고
  - 물러가고
  - 떠나고
  lexicon: BDAG
  rationale: 진행·반복의 미완료상을 살리되, 문맥상 예수님 쪽으로 이동하는 것이 아니라 기존 입장에서 물러나는 흐름이므로 ‘떠나가고’로 옮겼습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 많은 유대인들이
  alternatives_korean:
  - 많은 유대 사람들
  - 많은 유다인들이
  lexicon: BDAG
  rationale: 본문의 집합적 표현을 유지하되 한국어에서는 자연스러운 복수 주어로 처리했습니다. 본문이 모든 유대인을 뜻하는 것은 아니므로 ‘많은’의 범위를 살렸습니다.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  english_pob_choice: were believing in Jesus
  chosen_korean: 예수님을 믿고 있었기
  alternatives_korean:
  - 예수님을 믿고 있었기 때문
  - 예수님께 믿음을 두고 있었기
  lexicon: BDAG
  rationale: πιστεύω εἰς의 방향성을 살려 ‘예수님을 믿다’로 옮기고, 미완료상을 ‘믿고 있었기’로 반영했습니다.
theological_decisions:
- issue: τῶν Ἰουδαίων의 지시 대상
  chosen_reading: 본문은 ‘유대인들’로 옮기되, 특정 지도층 전체나 모든 유대 민족 전체에 대한 진술로 확대하지 않았습니다.
  alternative_readings:
  - 유다인들
  - 유대 사람들
  rationale: 요한복음의 Ἰουδαῖοι는 문맥에 따라 범위가 달라질 수 있으므로, 원문 표현을 유지하면서도 과도한 일반화를 피했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥에 따른 용례 보존
