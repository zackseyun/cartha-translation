  source_fidelity: 원문의 인과 관계(ὅτι), 부분집합 표현(πολλοὶ τῶν Ἰουδαίων), 나사로를 가리키는 δι’ αὐτόν, 그리고 예수를 향한 믿음(ἐπίστευον εἰς τὸν Ἰησοῦν)은 대체로 충실히 반영되어 있습니다. 다만 현행 ‘그 까닭은 … 때문입니다’는 하나의 원인절을 중복된 인과 틀로 감싸므로, 앞 절을 받는 ὅτι의 기능을 더 직접적으로 표현하는 편이 안전합니다.
  naturalness: ‘그 까닭은 … 때문입니다’는 문법적으로 가능하지만 현대 한국어에서는 다소 장황하고 겹친 표현입니다. ‘이는 … 때문입니다’가 합쇼체 문맥에서 자연스럽고, 앞 절의 이유를 제시하는 절이라는 점도 분명히 합니다. ‘그로 인해’보다 ‘그 때문에’가 더 자연스럽습니다.
