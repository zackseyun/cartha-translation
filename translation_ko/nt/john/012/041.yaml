id: JHN.12.41
reference: John 12:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
  footnotes:
  - marker: a
    text: Or "Isaiah said these things because he saw God's glory and spoke about him." The pronouns likely refer to Jesus in John's context, but the broader Isaianic background is the vision of the Lord's glory (Isa 6:1).
    reason: alternative_reading
translation:
  language: ko
  text: 이사야가 이런 일들을 말한 것은 그가 그의 영광을 보고 그에 대해 말했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이사야가 하나님의 영광을 보고 그에 대해 말했기 때문입니다.” 문맥상 대명사는 예수를 가리키지만, 더 넓은 이사야서 배경은 주님의 영광에 대한 환상입니다(사 6:1).
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 일들을
  alternatives_korean:
  - 이것들을
  - 이런 것들을
  lexicon: BDAG
  rationale: 앞의 예언자적 진술들을 가리키는 중성 복수이므로, 문맥상 자연스러운 복수 지시 표현인 ‘이런 일들을’로 옮겼습니다.
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: -기 때문입니다
  alternatives_korean:
  - -라고
  - 왜냐하면
  lexicon: BDAG
  rationale: 여기서는 이사야가 그렇게 말한 이유를 설명하는 인과 관계가 가장 자연스러우므로, 한국어 원인 표현으로 풀어 옮겼습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 광채
  - 존귀
  lexicon: BDAG
  rationale: 요한복음에서 δόξα는 신학적으로 무게 있는 ‘영광’이 표준적이므로 그대로 살렸습니다.
- source_word: ἐλάλησεν περὶ αὐτοῦ
  english_pob_choice: spoke about him
  chosen_korean: 그에 대해 말했습니다
  alternatives_korean:
  - 그에 관해 말했습니다
  - 그를 두고 말했습니다
  lexicon: BDAG
  rationale: περί+목적격의 뜻을 현대 한국어로 자연스럽게 풀어, 앞의 ‘말한’과 뒤의 ‘말했습니다’를 구분했습니다.
theological_decisions:
- issue: αὐτοῦ의 지시 대상
  chosen_reading: ‘그의/그에’는 요한의 문맥에 따라 예수를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 하나님/주님의 영광을 가리킨다고 보다 일반적으로 옮길 수 있습니다.
  rationale: 12:37–41의 문맥에서 이사야 인용은 예수에 대한 반응을 설명하는 데 사용되므로, 본문이 허용하는 범위 안에서 기독론적 지시를 반영했습니다.
  doctrine_reference: John 12:37–41; Translation philosophy §3 Preserve theological tension rather than resolve it.
