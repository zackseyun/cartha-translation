  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
  footnotes:
  - marker: a
    text: A denarius was a standard daily wage for a laborer; three hundred denarii was roughly a year's earnings, allowing for days not worked.
    reason: cultural_note
translation:
  language: ko
  text: 이 향유를 왜 삼백 데나리온에 팔아 가난한 사람들에게 주지 않았습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 당시 노동자의 보통 하루 품삯이었습니다. 일하지 않는 날들을 감안하면, 삼백 데나리온은 거의 1년치 품삯에 해당합니다.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  - 어찌하여
  lexicon: BDAG
  rationale: 원문의 의문문을 자연스러운 현대 한국어 질문형으로 살리되, 따로 설명을 덧붙이지 않고 직접적인 항의를 담았습니다.
- source_word: μύρον
  english_pob_choice: perfume
  chosen_korean: 향유
  alternatives_korean:
  - 향수
  - 연고
  - 향기로운 기름
  lexicon: BDAG
  rationale: 문맥상 값비싼 도유용 향유를 가리키므로, 한국어 성경에서 널리 쓰이면서도 물질적 성격을 잘 드러내는 '향유'를 택했습니다.
- source_word: τριακοσίων δηναρίων
  english_pob_choice: for three hundred denarii
  chosen_korean: 삼백 데나리온에
  alternatives_korean:
  - 삼백 은전으로
  - 삼백 일품삯에
  lexicon: BDAG
  rationale: 화폐 단위를 그대로 옮겨 역사적 무게를 보존했고, '에'를 써서 매매 가격을 나타내는 원문의 의미를 살렸습니다.
- source_word: πτωχοῖς
  english_pob_choice: to the poor
  chosen_korean: 가난한 사람들에게
  alternatives_korean:
  - 가난한 이들에게
  - 가난한 자들에게
  - 가난한 사람들
  lexicon: BDAG
  rationale: 명사적 용법을 한국어에서 자연스러운 집단 표현으로 풀되, '가난한 사람들'보다 문장 흐름에 맞는 여격형을 택했습니다.
theological_decisions:
- issue: 유다가 제기한 자선 논리를 직접 인용하는 어조
  chosen_reading: 질문 자체를 그대로 살려, 향유의 낭비처럼 보이는 행위와 가난한 사람들에 대한 배려 사이의 긴장을 드러냈습니다.
  alternative_readings:
  - 의역하여 완곡하게 표현하기
  - 비판적 뉘앙스를 약화시키기
  rationale: 이 구절은 단순한 정보 전달이 아니라 가치 판단을 담은 항의이므로, 원문의 날카로운 질문을 둔화시키지 않는 것이 본문 의미에 충실합니다.
  doctrine_reference: 본문 맥락의 화자 의도 보존
