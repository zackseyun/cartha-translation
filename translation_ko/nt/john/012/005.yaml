  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
  footnotes:
  - marker: a
    text: A denarius was a standard daily wage for a laborer; three hundred denarii was roughly a year's earnings, allowing for days not worked.
    reason: cultural_note
translation:
  language: ko
  text: 이 향유를 왜 삼백 데나리온에 팔아 가난한 사람들에게 주지 않았습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 당시 노동자의 보통 하루 품삯이었습니다. 삼백 데나리온은 쉬지 않는 날을 감안하면 거의 1년치 수입에 해당합니다.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  - 어찌하여
  lexicon: BDAG
  rationale: 원문의 의문문을 자연스러운 현대 한국어 질문형으로 살리되, 따로 설명을 덧붙이지 않고 직접적인 항의를 담았습니다.
- source_word: μύρον
  english_pob_choice: perfume
  chosen_korean: 향유
  alternatives_korean:
