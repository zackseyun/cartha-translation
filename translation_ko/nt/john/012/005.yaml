  rationale: 문맥상 값비싼 도유용 향유를 가리키므로, 한국어 성경에서 널리 쓰이면서도 물질적 성격을 잘 드러내는 '향유'를 택했습니다.
- source_word: τριακοσίων δηναρίων
  english_pob_choice: for three hundred denarii
  chosen_korean: 삼백 데나리온에
  alternatives_korean:
  - 삼백 은전으로
  - 삼백 일품삯에
  lexicon: BDAG
  rationale: 화폐 단위를 그대로 옮겨 역사적 무게를 보존했고, '에'를 써서 매매 가격을 나타내는 원문의 의미를 살렸습니다.
- source_word: πτωχοῖς
  english_pob_choice: to the poor
  chosen_korean: 가난한 사람들에게
  alternatives_korean:
  - 가난한 이들에게
  - 가난한 자들에게
  - 가난한 사람들
  lexicon: BDAG
  rationale: 명사적 용법을 한국어에서 자연스러운 집단 표현으로 풀되, '가난한 사람들'보다 문장 흐름에 맞는 여격형을 택했습니다.
theological_decisions:
- issue: 유다가 제기한 자선 논리를 직접 인용하는 어조
  chosen_reading: 질문 자체를 그대로 살려, 향유의 낭비처럼 보이는 행위와 가난한 사람들에 대한 배려 사이의 긴장을 드러냈습니다.
  alternative_readings:
  - 의역하여 완곡하게 표현하기
  - 비판적 뉘앙스를 약화시키기
  rationale: 이 구절은 단순한 정보 전달이 아니라 가치 판단을 담은 항의이므로, 원문의 날카로운 질문을 둔화시키지 않는 것이 본문 의미에 충실합니다.
  doctrine_reference: 본문 맥락의 화자 의도 보존
