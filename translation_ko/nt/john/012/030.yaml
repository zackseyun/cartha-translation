id: JHN.12.30
reference: John 12:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
  footnotes:
  - marker: a
    text: Or 'This voice has not happened because of me, but because of you.' The Greek preposition can also be understood causally, though the context favors 'for the sake of' or 'for the benefit of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 말씀하셨습니다. 「이 음성은 내게서 난 것이 아니라 너희를 위한 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 음성은 내게서 발생한 것이 아니라 너희를 위해 발생한 것입니다’라고도 옮길 수 있습니다. 여기서 διά + 대격은 원인으로도 이해될 수 있지만, 문맥상 ‘~을 위해’ 또는 ‘~의 유익을 위해’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말씀하셨습니다
  alternatives_korean:
  - 대답하셨고 말씀하셨습니다
  - 응답하여 말씀하셨습니다
  lexicon: SBLGNT
  rationale: 요한복음의 반복 공식인 ἀπεκρίθη ... καὶ εἶπεν을 한국어에서 자연스럽게 살리되, 두 동사의 응답·발화 기능을 함께 드러내기 위해 「대답하여 말씀하셨습니다」로 옮겼습니다.
- source_word: ἡ φωνὴ αὕτη
  english_pob_choice: This voice
  chosen_korean: 이 음성
  alternatives_korean:
  - 이 소리
  - 이 목소리
  lexicon: BDAG
  rationale: 문맥상 하늘에서 들린 신적 발화를 가리키므로, 물리적 ‘소리’보다 사건성을 갖는 ‘음성’이 더 적절합니다.
- source_word: δι’ ἐμὲ / δι’ ὑμᾶς
  english_pob_choice: for my sake / for yours
  chosen_korean: 내게서 난 것이 아니라 너희를 위한 것입니다
  alternatives_korean:
  - 내 이익을 위한 것이 아니라 너희 이익을 위한 것입니다
  - 나 때문에가 아니라 너희 때문에입니다
  lexicon: BDAG
  rationale: διά + 대격은 여기서 원인보다 목적·이익의 뉘앙스가 강하므로, ‘~을 위한’으로 benefactive 의미를 살렸습니다. 동시에 앞절의 대조를 한국어에서 자연스럽게 만들기 위해 첫 절은 ‘내게서 난 것이 아니라’로 표현했습니다.
theological_decisions:
- issue: 하늘의 음성의 목적성
  chosen_reading: 이 음성은 예수 자신을 확인하기 위한 것이 아니라, 듣는 이들의 유익을 위한 것입니다.
  alternative_readings:
  - 이 음성은 예수 때문에 난 것이지만 군중을 위해 의도된 것입니다
  - 이 음성은 예수에게서가 아니라 군중에게서 난 것입니다
  rationale: 본문의 διά + 대격을 목적/이익으로 읽는 것이 문맥에 가장 잘 맞으며, 예수의 필요가 아니라 청중의 유익을 강조하는 긴장을 그대로 보존합니다.
  doctrine_reference: 원문 우선 원칙에 따라 문맥이 허용하는 의미 범위를 번역에 반영
