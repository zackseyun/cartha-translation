  source_fidelity: 수정이 필요합니다. 초안의 ‘내게서 난 것’은 δι’ ἐμέ를 음성의 출처/기원으로 바꾸어, 원문의 대격 διά가 나타내는 수혜·목적(또는 가능한 원인) 관계를 보존하지 못합니다. ‘이 음성이 들린 것은 나를 위한 것이 아니라 너희를 위한 것입니다’는 γέγονεν의 발생·도래 사건성과 양쪽 διά구의 대조를 자연스럽게 반영합니다.
  naturalness: ‘이 음성이 들린 것은 … 위한 것입니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 앞 문맥의 하늘 음성을 가리키는 표현으로도 분명합니다. ‘대답하여 말씀하셨습니다’도 문어적이지만 자연스럽고 적절합니다.
  terminology: ‘음성’은 문맥상 적절합니다. ‘나를 위해/너희를 위해’는 δι’ ἐμέ / δι’ ὑμᾶς의 병행을 보존하며, ‘내게서’처럼 기원 관계를 암시하지 않습니다.
