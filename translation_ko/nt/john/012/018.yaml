id: JHN.12.18
reference: John 12:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
  footnotes:
  - marker: a
    text: Or, 'the crowd met him' or 'the crowd came out to meet him.' The Greek verb includes the sense of going to meet someone.
    reason: lexical_alternative
  - marker: b
    text: '''Sign'' is John''s characteristic term for a miraculous act that points beyond itself to Jesus''s identity and mission; alternatively, ''miracle.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 군중도 그분을 맞으러 나갔습니다. 그들이 그분이 이 표적을 행하신 것을 들었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맞으러 나갔습니다’는 ὑπαντάω의 방향성, 곧 누군가에게 가서 만나는 뜻을 살린 번역입니다. ‘만났습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘표적’은 요한복음에서 자주 쓰이는 σημεῖον의 번역이며, 사건 자체뿐 아니라 그것이 가리키는 의미를 함께 나타낼 수 있습니다. ‘기적’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 이런 이유로
  alternatives_korean:
  - 그러므로
  - 이 때문에
  lexicon: BDAG
  rationale: 앞선 문맥과의 인과 관계를 분명히 드러내면서도 현대 한국어에서 자연스럽게 읽히는 표현입니다.
- source_word: ὑπήντησεν
  english_pob_choice: went to meet
  chosen_korean: 맞으러 나갔습니다
  alternatives_korean:
  - 마중 나갔습니다
  - 나가서 만났습니다
  lexicon: BDAG
  rationale: ‘가서 맞다’의 방향성을 살리되, 한국어에서 자연스러운 동작 표현으로 옮겼습니다.
- source_word: ὁ ὄχλος
  english_pob_choice: the crowd
  chosen_korean: 군중
  alternatives_korean:
  - 무리
  - 사람들
  lexicon: BDAG
  rationale: 요한복음의 ὄχλος는 특정하게 모인 다수를 가리키므로, 문맥상 ‘군중’이 가장 자연스럽습니다.
- source_word: τὸ σημεῖον
  english_pob_choice: this sign
  chosen_korean: 이 표적
  alternatives_korean:
  - 이 기적
  - 그 표적
  lexicon: BDAG
  rationale: 요한복음의 σημεῖον이 지닌 계시적 의미를 살려 ‘표적’으로 옮겼습니다. 한국 교회 용례는 있으나, 본문 자체의 신학적 기능을 더 분명히 드러냅니다.
theological_decisions:
- issue: 요한의 σημεῖον 번역
  chosen_reading: 표적
  alternative_readings:
  - 기적
  - 이적
  rationale: 이 단어는 단순한 놀라운 사건이 아니라 예수님의 정체와 사명을 가리키는 संकेत이므로, 의미를 약화시키는 ‘기적’보다 ‘표적’이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
