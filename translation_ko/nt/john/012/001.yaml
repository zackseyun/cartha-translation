translation:
  language: ko
  text: 그러므로 예수께서는 유월절 엿새 전 베다니에 오셨습니다. 그곳에는 예수께서 죽은 자들 가운데서[a] 살리신 나사로가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘죽은 이들로부터’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ οὖν Ἰησοῦς
  english_pob_choice: So Jesus
  chosen_korean: 그러므로 예수께서는
  alternatives_korean:
  - 그리하여 예수께서는
  - 그런데 예수께서는
  - 예수께서는
  lexicon: SBLGNT / BDAG
  rationale: οὖν의 이어짐을 한국어로는 담백한 인과·연결 표지인 ‘그러므로’로 살려, 앞 문맥과의 연속성을 드러냈습니다.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  english_pob_choice: six days before the Passover
  chosen_korean: 유월절 엿새 전
  alternatives_korean:
  - 유월절 여섯 날 전에
  - 유월절로부터 엿새 전에
  - 유월절 이전 엿새에
  lexicon: BDAG
  rationale: 관용적 시간표현을 자연스러운 한국어 어순으로 옮기되, ‘유월절’은 절기의 통상적 명칭으로 처리했습니다.
- source_word: ἦλθεν εἰς Βηθανίαν
  english_pob_choice: came to Bethany
  chosen_korean: 베다니에 오셨습니다
  alternatives_korean:
  - 베다니로 오셨습니다
  - 베다니에 이르셨습니다
  - 베다니에 가셨습니다
  lexicon: BDAG
  rationale: ἔρχομαι의 서술적 용법을 ‘오시다’로 옮겨 내러티브 흐름을 살리고, 지명은 현대 표기 ‘베다니’를 따랐습니다.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν Ἰησοῦς
  english_pob_choice: whom Jesus had raised from the dead
  chosen_korean: 예수께서 죽은 자들 가운데서 살리신
  alternatives_korean:
  - 예수께서 죽은 자들 가운데서 일으키신
  - 예수께서 죽은 자들 가운데서 다시 살리신
  - 예수께서 죽은 자들 가운데서 살려 내신
  lexicon: BDAG
  rationale: ἐγείρω는 부활 문맥에서 ‘살리다/일으키다’가 가능하나, 한국어 독자가 자연스럽게 이해하도록 ‘살리신’으로 옮겼고, ἐκ νεκρῶν은 ‘죽은 자들 가운데서’로 직역 성격을 유지했습니다.
theological_decisions:
- issue: 예수의 부활 행위에 대한 주체 강조
  chosen_reading: 문장 끝의 ‘예수께서’를 그대로 살려, 나사로를 살리신 주체가 예수님임을 명시했습니다.
  alternative_readings:
  - 마지막 ‘예수께서’를 ‘그분께서’로 줄이는 번역
  - 주어 반복을 생략하는 번역
  rationale: 헬라어 원문은 문장 말미에 Ἰησοῦς를 다시 적어 강조합니다. 이를 한국어에서도 유지하여 예수의 행위를 분명하게 드러냈습니다.
  doctrine_reference: 원문 주체 강조 보존
