  source_fidelity: 본문 번역은 대체로 SBLGNT에 충실합니다. οὖν의 연결, 유월절 엿새 전이라는 시간 표현, 베다니, 그리고 예수께서 나사로를 죽은 자들 가운데서 살리신 사실이 모두 보존되었습니다. 다만 각주 표지가 유월절에 붙어 있으나 각주 내용은 ἐκ νεκρῶν(‘죽은 자들 가운데서’)에 관한 것이므로, 표지를 해당 표현으로 옮겨야 합니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. ‘그러므로’는 οὖν의 연결 기능을 다소 강하게 인과적으로 들리게 할 수 있으나 문맥상 허용됩니다. ‘그곳에는 … 나사로가 있었습니다’도 원문의 단순한 장소·존재 진술을 자연스럽게 반영합니다.
  terminology: ‘유월절’, ‘베다니’, ‘나사로’, ‘죽은 자들 가운데서 살리신’은 표준적인 성경 한국어 용례와 원문의 의미에 부합합니다. 각주 내용은 본문에서 이미 사용한 표현을 ‘더 문자적으로’라고 부르므로, 어휘 대안을 명확히 하도록 조정하는 것이 좋습니다.
  issues:
