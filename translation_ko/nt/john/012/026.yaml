revisions:
- from: 누구든지 나를 섬기려거든 나를 따르십시오. 그리고 내가 있는 곳에 나의 종도 거기에 있을 것입니다. 누구든지 나를 섬기면 아버지께서 그를 존귀하게 하실 것입니다.
  to: 누구든지 나를 섬기면, 나를 따르십시오. 내가 있는 곳에는 나의 종도 있을 것입니다. 누구든지 나를 섬기면 아버지께서 그를 존귀하게 여기실 것입니다.
  rationale: 원문의 두 조건절을 모두 ‘섬기면’으로 통일하여 일반 조건을 보존했습니다. 장소에 관한 강조와 ‘또한’의 뜻은 ‘내가 있는 곳에는 ...도’로 자연스럽게 반영했습니다. 마지막 약속은 τιμάω의 넓은 의미를 유지하도록 ‘존귀하게 여기실 것입니다’로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:41Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 조건절의 ‘섬기려거든’은 διακονῇ(‘섬기면’)에 의지·의도를 더하므로 조건을 직접적으로 옮기는 편이 더 정확합니다. 또한 마지막 τιμήσει는 ‘존귀하게 하다’보다 ‘존귀하게 여기다’가 ‘존중하고 영예를 돌리다’라는 뜻을 더 자연스럽고 폭넓게 보존합니다.
  naturalness: 합쇼체는 일관되며 전반적으로 자연스럽습니다. 다만 ‘내가 있는 곳에 나의 종도 거기에’는 한국어에서 장소 표현이 겹치므로 ‘내가 있는 곳에는 나의 종도 있을 것입니다’가 더 매끄럽습니다.
  terminology: ‘섬기다’, ‘따르십시오’, ‘종’, ‘아버지’는 문맥과 신학 용례에 적절합니다. διάκονος를 교회 직분인 ‘집사’로 옮기지 않은 점도 적절합니다.
  issues:
  - severity: medium
    issue: ‘섬기려거든’이 조건절에 의도·결심의 뉘앙스를 추가합니다.
    rationale: ἐὰν τις ἐμοὶ διακονῇ는 ‘누구든지 나를 섬기면’이라는 일반 조건문입니다. ‘섬기려거든’은 ‘섬기고자 한다면’에 가까워 원문보다 한 단계 앞선 의지를 명시합니다.
  - severity: low
    issue: 장소 표현 ‘...곳에 ... 거기에’가 중복됩니다.
    rationale: ὅπου ... ἐκεῖ καί의 대응 관계는 보존해야 하지만, 한국어에서는 조사 ‘에는’과 ‘도’로 자연스럽게 나타낼 수 있습니다.
  - severity: low
    issue: ‘그를 존귀하게 하실 것입니다’는 다소 결과적·격상적 의미로 들릴 수 있습니다.
    rationale: τιμάω는 여기서 아버지께서 그 사람을 존중하고 영예롭게 여기신다는 약속입니다. ‘존귀하게 여기시다’가 보상의 구체 형태를 확정하지 않으면서 더 직접적으로 대응합니다.
  revised_text: 누구든지 나를 섬기면, 나를 따르십시오. 내가 있는 곳에는 나의 종도 있을 것입니다. 누구든지 나를 섬기면 아버지께서 그를 존귀하게 여기실 것입니다.
  revised_footnotes: []
  revision_rationale: 원문의 두 조건절을 모두 ‘섬기면’으로 통일하여 일반 조건을 보존했습니다. 장소에 관한 강조와 ‘또한’의 뜻은 ‘내가 있는 곳에는 ...도’로 자연스럽게 반영했습니다. 마지막 약속은 τιμάω의 넓은 의미를 유지하도록 ‘존귀하게 여기실 것입니다’로 다듬었습니다.
