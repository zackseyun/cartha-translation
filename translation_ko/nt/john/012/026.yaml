id: JHN.12.26
reference: John 12:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
  footnotes:
  - marker: a
    text: 'Greek has a generic masculine singular construction: ''If anyone serves me ... the Father will honor him.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 나를 섬기면, 나를 따르십시오. 내가 있는 곳에는 나의 종도 있을 것입니다. 누구든지 나를 섬기면 아버지께서 그를 존귀하게 여기실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονῇ
  english_pob_choice: serves
  chosen_korean: 섬기려거든 / 섬기면
  alternatives_korean:
  - 섬기면
  - 시중들면
  - 봉사하면
  lexicon: BDAG
  rationale: διακονέω는 여기서 예수께 대한 일반적 섬김을 뜻하므로, 교회직이나 과도한 종교어감을 덜어 주는 ‘섬기다’를 택했습니다. 첫 절은 조건을 살려 ‘섬기려거든’으로, 뒤 절은 직설 조건문으로 반복했습니다.
- source_word: ἀκολουθείτω
  english_pob_choice: let him follow
  chosen_korean: 따르십시오
  alternatives_korean:
  - 따르게 하십시오
  - 계속 따르십시오
  lexicon: BDAG
  rationale: 현재 명령형의 지속적 제자도를 한국어 합쇼체 명령으로 자연스럽게 옮기기 위해 ‘따르십시오’를 썼습니다. 문맥상 계속성을 과도하게 풀어 쓰지 않았습니다.
- source_word: διάκονος
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 일꾼
  - 섬기는 사람
  - 집사
  lexicon: BDAG
  rationale: 이 단어는 후대의 교회 직분 ‘집사’가 아니라 예수를 섬기는 사람을 가리키므로, POB 기본값에 따라 ‘종’으로 옮겼습니다. 문맥상 ‘일꾼’보다 더 직접적으로 종속성과 소속을 드러냅니다.
- source_word: τιμήσει
  english_pob_choice: will honor
  chosen_korean: 존귀하게 하실 것입니다
  alternatives_korean:
  - 영광을 주실 것입니다
  - 존중하실 것입니다
  - 명예를 주실 것입니다
  lexicon: BDAG
  rationale: τιμάω는 단순한 예우를 넘어 가치를 부여하고 높이는 뜻을 지니므로, 한국어에서 그 결과를 가장 잘 드러내는 ‘존귀하게 하다’를 택했습니다. 다만 보상의 정확한 형태는 본문이 특정하지 않으므로 해석을 좁히지 않았습니다.
theological_decisions:
- issue: 지시대명사와 대표적 남성형의 처리
  chosen_reading: ‘누구든지’로 일반성을 살리되, 뒤따르는 인칭대명사는 원문의 대표적 남성형을 그대로 반영해 ‘그를’로 옮겼습니다.
  alternative_readings:
  - 전 구절을 ‘... 그 사람 ... 그 사람을’처럼 완전 중성화하는 번역
  rationale: 원문은 generic τις와 함께 남성 단수 형태를 사용합니다. 본문이 가진 대표적 남성형을 지우지 않고, 자연스러운 한국어에서는 ‘누구든지’로 포괄성을 드러내는 방식이 가장 균형적입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
- issue: ‘아버지께서 그를 존귀하게 하실 것입니다’의 보상의 성격
  chosen_reading: 보상의 구체적 형태를 확정하지 않고, 아버지의 존귀하게 하심이라는 약속 자체를 그대로 드러냈습니다.
  alternative_readings:
  - 이 구절을 곧바로 종말론적 영화나 하늘의 상급으로 풀어 쓰는 번역
  rationale: 원문은 하나님 아버지의 응답을 약속하지만, 그 존귀함이 어떤 방식으로 나타나는지는 여기서 규정하지 않습니다. 본문의 신학적 폭을 유지하기 위해 구체화를 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
