revisions:
- from: 이것은 이사야 선지자의 말씀이 이루어지게 하려는 것이었습니다. 「주님, 우리의 보고를 누가 믿었으며, 주님의 팔이 누구에게 나타났습니까?」[a]
  to: 이는 이사야 선지자가 말한 말씀이 이루어지게 하려는 것이었습니다. 「주님, 우리가 전한 소식을 누가 믿었습니까? 주님의 팔이 누구에게 드러났습니까?」[a]
  rationale: 관계절 ‘이사야 선지자가 말한’을 복원하여 원문 정보를 보존했습니다. ἵνα 성취 구문은 목적과 결과의 구분을 해설로 확정하지 않는 기존의 ‘이루어지게 하려는 것’ 구문을 유지했습니다. ἀκοή는 현대 한국어에서 자연스러운 ‘우리가 전한 소식’으로 옮기되, ‘들음/보고/메시지’의 실제 어휘 범위는 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:54Z'
