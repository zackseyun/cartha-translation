  source_fidelity: 수정이 필요합니다. 초안은 ἵνα ... πληρωθῇ의 성취 구문과 인용문의 핵심 의미를 대체로 보존하지만, ὃν εἶπεν(“그가 말한”)을 번역에서 빠뜨렸습니다. 또한 ‘우리의 보고’는 현대 한국어에서 문서성 보고를 우선 연상시켜 ἀκοή의 선포된 내용이라는 뜻을 자연스럽게 전달하지 못합니다.
