id: JHN.12.38
reference: John 12:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
  footnotes:
  - marker: a
    text: Or “what we heard” or “our message.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 이사야 선지자의 말씀이 이루어지게 하려는 것이었습니다. 「주님, 우리의 보고를 누가 믿었으며, 주님의 팔이 누구에게 나타났습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀκοή는 ‘보고, 들음, 들은 내용’까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα ... πληρωθῇ
  english_pob_choice: so that ... might be fulfilled
  chosen_korean: …이 이루어지게 하려는 것
  alternatives_korean:
  - …이 성취되게 하려는 것
  - …이 이루어지도록 하기 위한 것
  lexicon: BDAG
  rationale: ἵνα와 aorist passive subjunctive의 결합은 목적과 결과를 함께 담을 수 있어, 한국어에서는 자연스러운 ‘이루어지게 하려는 것’으로 옮겨 과도한 해석을 피했습니다.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  english_pob_choice: the word of Isaiah the prophet
  chosen_korean: 이사야 선지자의 말씀
  alternatives_korean:
  - 예언자 이사야의 말씀
  - 이사야의 말씀
  lexicon: BDAG
  rationale: λόγος는 여기서 인용-성취 공식을 이루는 ‘말씀’이 가장 직접적이며, τοῦ προφήτου는 ‘선지자’로 옮겨 인물의 직함을 분명히 했습니다.
- source_word: τῇ ἀκοῇ ἡμῶν
  english_pob_choice: our report
  chosen_korean: 우리의 보고
  alternatives_korean:
  - 우리의 들음
  - 우리가 들은 것
  - 우리의 메시지
  lexicon: BDAG
  rationale: ἀκοή는 ‘듣는 것/들음’과 ‘전해진 소식’의 범위를 가지므로, 이사야 53:1의 탄식과 잘 맞는 ‘보고’로 옮겨 전달된 내용의 의미를 살렸습니다.
- source_word: ὁ βραχίων κυρίου
  english_pob_choice: the arm of the Lord
  chosen_korean: 주님의 팔
  alternatives_korean:
  - 야훼의 팔
  - 주의 팔
  lexicon: BDAG
  rationale: 이미지적 표현을 보존해 하나님의 능동적 역사와 권능을 드러내기 위해 직역에 가깝게 유지했습니다. 인용문 안의 κυρίου는 문맥상 주님의 것으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 인용문의 주어 호칭 κύριε의 한국어 처리
  chosen_reading: 「주님」으로 옮겨, 이사야 인용문의 직접 호칭을 살렸습니다.
  alternative_readings:
  - 주여
  - 주
  rationale: 본문은 예언 인용의 직접 화법이므로, 한국어에서도 경어적 기도 호칭인 ‘주님’이 가장 자연스럽고 본문의 예배적 울림을 보존합니다.
  doctrine_reference: 인용문 내 직접 호칭의 예배적 톤 보존
- issue: ἵνα 절의 목적/결과 뉘앙스
  chosen_reading: 목적과 결과를 구분해 단정하지 않고, 단순한 성취 구문으로 유지했습니다.
  alternative_readings:
  - 이사야 선지자의 말씀이 성취되도록
  - 그래서 이사야 선지자의 말씀이 이루어졌습니다
  rationale: 요한복음의 성취 공식은 종종 목적과 결과의 긴장을 함께 담으므로, 한국어에서도 그 긴장을 풀어 설명하지 않고 남겨 두었습니다.
  doctrine_reference: 번역 신학 §3 (신학적 긴장 보존)
