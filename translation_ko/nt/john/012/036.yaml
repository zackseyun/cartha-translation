id: JHN.12.36
reference: John 12:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
  footnotes:
  - marker: a
    text: Or 'children of light.' The Greek reads 'sons of light,' an idiom for people characterized by light.
    reason: lexical_alternative
  - marker: b
    text: Or 'and after departing he hid himself from them'.
    reason: previous_rendering
translation:
  language: ko
  text: 빛을 가지고 있는 동안, 빛의 아들들이[a] 되도록 빛을 믿으십시오. 예수께서는 이 말씀을 하시고 떠나 그들에게서 몸을 숨기셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛의 자녀들’. 헬라어는 문자적으로 ‘빛의 아들들’이라고 하며, 빛의 성격을 지닌 사람들을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘떠나신 뒤 그들에게서 숨으셨습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  english_pob_choice: While you have the light
  chosen_korean: 빛을 가지고 있는 동안에는
  alternatives_korean:
  - 빛을 가지고 있을 동안에는
  - 빛이 있는 동안에는
  lexicon: BDAG
  rationale: ὡς + 현재형은 시간적 조건을 나타내므로 ‘동안에는’으로 살리고, τὸ φῶς는 요한복음의 표지를 유지해 ‘빛’으로 직역했습니다.
- source_word: πιστεύετε εἰς τὸ φῶς
  english_pob_choice: believe in the light
  chosen_korean: 빛을 믿으십시오
  alternatives_korean:
  - 빛 안에 믿음을 두십시오
  - 빛을 신뢰하십시오
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω εἰς는 통상적인 ‘믿다’로 옮기는 것이 가장 직접적이며, 공적 권면의 어조를 반영해 명령형 ‘믿으십시오’를 택했습니다.
- source_word: υἱοὶ φωτός
  english_pob_choice: sons of light
  chosen_korean: 빛의 아들들이
  alternatives_korean:
  - 빛의 자녀들이
  - 빛에 속한 사람들
  lexicon: BDAG
  rationale: 남성 복수형 υἱοί를 지우지 않기 위해 ‘아들들’을 유지했고, ‘빛의’라는 소유격 구조로 관용적 표현을 살렸습니다.
- source_word: ἐλάλησεν Ἰησοῦς
  english_pob_choice: Jesus spoke these things
  chosen_korean: 예수께서는 이 말씀들을 하시고 나서
  alternatives_korean:
  - 예수께서는 이 말씀을 말씀하셨고
  - 예수께서는 이 말을 하셨습니다
  lexicon: BDAG
  rationale: λαλέω의 ‘말하다/말씀하다’ 의미를 반영해 ‘말씀들을 하시고 나서’로 옮겼고, 뒤의 동작보다 선행함을 드러내기 위해 연결 표현을 사용했습니다.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  english_pob_choice: and he departed and hid from them
  chosen_korean: 그들을 떠나 숨어 계셨습니다
  alternatives_korean:
  - 떠나 그들로부터 숨으셨습니다
  - 떠나 그들에게서 숨으셨습니다
  lexicon: BDAG
  rationale: 아오리스트 분사 ἀπελθών의 선행 동작과 ἐκρύβη의 서술을 자연스러운 한국어 서술로 압축하되, 중립적/수동적 뉘앙스를 과도하게 해석하지 않도록 ‘숨어 계셨습니다’로 번역했습니다.
theological_decisions:
- issue: υἱοὶ φωτός의 성별 표지 보존
  chosen_reading: 빛의 아들들이
  alternative_readings:
  - 빛의 자녀들이
  rationale: 원문이 남성 복수형 υἱοί를 사용하므로, 대표성은 유지하되 형태는 지우지 않는 쪽을 택했습니다. 다만 한국어에서 자연스러운 수용성을 위해 복수 표지를 덧붙였습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
- issue: 예수의 이탈과 숨으심의 서술 방식
  chosen_reading: 그들을 떠나 숨어 계셨습니다
  alternative_readings:
  - 그들로부터 숨으셨습니다
  - 그들 앞에서 몸을 숨기셨습니다
  rationale: 본문은 사건의 연속을 간단히 진술하므로 과잉 설명을 피하고, ‘숨으셨습니다’에 존칭 동사를 사용해 서술의 품위를 유지했습니다.
  doctrine_reference: POB narrative register guideline
