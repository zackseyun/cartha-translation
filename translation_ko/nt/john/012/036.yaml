revisions:
- from: 빛을 가지고 있는 동안에는 빛을 믿으십시오. 그러면 여러분은 빛의 아들들이 되실 것입니다. 예수께서는 이 말씀들을 하시고 나서 그들을 떠나 숨어 계셨습니다.[a][b]
  to: 빛을 가지고 있는 동안, 빛의 아들들이[a] 되도록 빛을 믿으십시오. 예수께서는 이 말씀을 하시고 떠나 그들에게서 몸을 숨기셨습니다.[b]
  rationale: 목적절(ἵνα γένησθε)을 ‘되도록’으로 옮겨 원문의 문법적 관계를 보존하고, 불필요한 미래 서술 및 첨가된 대명사를 제거했습니다. 마지막 절은 ἀπελθὼν의 선행 동작과 ἀπ’ αὐτῶν의 대상을 자연스럽게 드러내도록 다듬었습니다. 각주 표지는 해당 어구 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:53Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. ἵνα γένησθε는 명령에 딸린 목적절로서 ‘빛의 아들들이 되도록’이 적절합니다. 초안의 ‘그러면 여러분은 … 되실 것입니다’는 목적을 단순한 미래 결과로 바꾸고, 원문에 없는 2인칭 대명사를 보탭니다. ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν은 떠난 뒤 그들에게서 자신을 숨긴 사건을 말하므로 ‘떠나 그들에게서 몸을 숨기셨습니다’가 동작과 대상을 더 분명히 반영합니다.
  naturalness: ‘빛을 가지고 있는 동안’과 ‘빛을 믿으십시오’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘빛의 아들들이 되도록’은 직역적 핵심 표현을 보존하면서도 목적 관계를 매끄럽게 드러냅니다. ‘숨어 계셨습니다’는 지속 상태와 보조용언의 뉘앙스를 더하므로 간결한 사건 서술인 ‘몸을 숨기셨습니다’로 고쳤습니다.
  terminology: ‘빛’은 요한복음의 반복되는 표지를 보존합니다. υἱοὶ φωτός는 원문의 남성 복수 명사를 따라 ‘빛의 아들들’로 옮기고, 관용적·포괄적 의미의 가능한 표현인 ‘빛의 자녀들’을 각주로 제시합니다. λαλέω의 Ταῦτα는 한국어에서 집합적으로 자연스러운 ‘이 말씀’을 사용했습니다.
  issues:
  - severity: medium
    issue: ‘그러면 여러분은 빛의 아들들이 되실 것입니다’
    rationale: ἵνα + 접속법은 목적을 나타내며, γένησθε는 미래 직설법이 아닙니다. 해당 표현은 목적 관계를 미래 결과로 바꾸고 원문에 없는 ‘여러분’을 추가합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치됨
    rationale: a는 ‘빛의 아들들’에, b는 숨으심의 표현에 각각 직접 붙여야 각주의 지시 대상이 명확합니다.
  - severity: low
    issue: ‘숨어 계셨습니다’
    rationale: 원문의 아오리스트 사건 서술에 지속적 상태의 뉘앙스를 더할 수 있습니다. ‘몸을 숨기셨습니다’가 문맥상 자연스럽고 ἐκρύβη의 중간태적 의미를 충실히 전달합니다.
  revised_text: 빛을 가지고 있는 동안, 빛의 아들들이[a] 되도록 빛을 믿으십시오. 예수께서는 이 말씀을 하시고 떠나 그들에게서 몸을 숨기셨습니다.[b]
  revised_footnotes:
