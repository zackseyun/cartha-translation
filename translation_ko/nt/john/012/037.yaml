  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
  footnotes:
  - marker: a
    text: Or 'did not believe in him'; the Greek verb is imperfect, which may suggest ongoing or repeated unbelief.
    reason: lexical_alternative
  - marker: b
    text: Or 'But although he had done'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그들 앞에서 그렇게 많은 표적을 행하셨는데도, 그들은 그를 믿지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿지 않았습니다’는 헬라어 미완료 시상의 반복·지속적 불신 가능성을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  english_pob_choice: so many
  chosen_korean: 그렇게 많은
  alternatives_korean:
  - 매우 많은
  - 그토록 많은
  lexicon: BDAG
  rationale: 표적의 수가 많았음을 수량적으로 드러내면서도 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: σημεῖα
  english_pob_choice: signs
  chosen_korean: 표적
  alternatives_korean:
  - 기적
  - 징표
  lexicon: BDAG
  rationale: 요한복음의 σημεῖα는 단순한 기적보다 계시적 의미를 지닌 사건이므로, 그 신학적 기능을 살리는 ‘표적’을 택했습니다.
- source_word: ἔμπροσθεν αὐτῶν
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에서 공개적으로
  - 그들 눈앞에서
  lexicon: BDAG
  rationale: 공적으로 보이는 자리에서 행해졌다는 뜻을 간결하게 살렸습니다.
- source_word: οὐκ ἐπίστευον εἰς αὐτόν
  english_pob_choice: they did not believe in him
  chosen_korean: 그를 믿지 않았습니다
  alternatives_korean:
  - 그 안에 믿지 않았습니다
  - 그를 믿고 있지 않았습니다
  lexicon: BDAG
  rationale: πιστεύω + εἰς의 관용구를 한국어의 자연스러운 ‘믿다’로 옮기되, 지속적 불신의 뉘앙스는 문맥으로 유지했습니다.
theological_decisions:
- issue: 요한복음의 지속적 불신을 어떻게 반영할 것인가
  chosen_reading: 그들은 그를 믿지 않았습니다
  alternative_readings:
  - 그들은 그를 믿고 있지 않았습니다
  - 그들은 계속 그를 믿지 않았습니다
  rationale: 헬라어 미완료 시상의 반복·지속 뉘앙스는 있으나, 한국어에서는 과도한 확대 없이 문맥이 충분히 전달되도록 간결하게 옮겼습니다.
  doctrine_reference: 문맥이 드러내는 지속적 불신의 긴장을 보존하되, 의미를 과장하지 않습니다.
