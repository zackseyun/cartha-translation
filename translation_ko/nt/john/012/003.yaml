id: JHN.12.3
reference: John 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
  footnotes:
  - marker: a
    text: A litra was a Roman unit of weight, roughly twelve ounces or about a third of a kilogram.
    reason: cultural_note
  - marker: b
    text: Or 'genuine nard'; the adjective translated 'pure' (πιστικῆς) is lexically debated.
    reason: lexical_alternative
  - marker: c
    text: 'Traditional English: ''spikenard.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 마리아는 값비싼 순수한 나드 향유 한 리트라를 가져다가 예수님의 발에 바르고, 자기 머리카락으로 그분의 발을 닦았습니다. 집 안은 향유의 향기로 가득 찼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 리트라는 로마의 무게 단위로, 대략 12온스, 곧 약 3분의 1킬로그램 정도입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘진짜 나드’; ‘순수한’으로 옮긴 πιστικῆς는 어휘적으로 논쟁의 여지가 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적인 영어 표현은 ‘스파이크나드’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그러므로
  - 그런즉
  lexicon: BDAG
  rationale: 서술 흐름의 연결을 자연스럽게 살리되, 논증적 ‘그러므로’보다 사건 전개를 잇는 시간적 전환으로 읽히는 값을 살렸습니다.
- source_word: λίτραν
  english_pob_choice: a litra
  chosen_korean: 한 리트라
  alternatives_korean:
  - 한 근
  - 약 삼백 그램
  lexicon: BDAG
  rationale: 고대 도량형의 구체성을 보존하기 위해 음역을 택했고, 현대 환산으로 바꾸지 않아 본문 고유성을 유지했습니다.
- source_word: νάρδου
  english_pob_choice: nard
  chosen_korean: 나드
  alternatives_korean:
  - 스파이크나드
  - 향나드
  lexicon: BDAG
  rationale: 널리 알려진 음역을 따르되, 전통적 번역어보다 원문이 가리키는 향료의 이름을 직접 드러내도록 했습니다.
- source_word: πιστικῆς
  english_pob_choice: pure
  chosen_korean: 순수한
  alternatives_korean:
  - 진짜의
  - 진품의
  - 순수한 참된
  lexicon: BDAG
  rationale: πιστικός의 어휘적 논쟁을 고려하면서도, 문맥상 값비싼 나드의 품질을 자연스럽게 표현하는 한국어로 옮겼습니다.
- source_word: ἤλειψεν
  english_pob_choice: anointed
  chosen_korean: 바르고
  alternatives_korean:
  - 기름을 부어
  - 도포하고
  - 발랐습니다
  lexicon: BDAG
  rationale: 문맥은 향유를 발에 바르는 행위이므로, 의례적 의미를 과도하게 불어넣는 ‘기름부으시다’보다 물리적 행위를 분명히 하는 표현을 택했습니다.
- source_word: ἐξέμαξεν
  english_pob_choice: wiped
  chosen_korean: 닦았습니다
  alternatives_korean:
  - 씻어냈습니다
  - 훔쳤습니다
  lexicon: BDAG
  rationale: 머리카락을 사용해 발에 묻은 향유를 닦아내는 동작을 자연스럽게 드러내는 동사로 옮겼습니다.
theological_decisions:
- issue: ἤλειψεν의 의미를 의례적 ‘기름부음’으로 과장하지 않음
  chosen_reading: 예수님의 발에 향유를 바르는 행위로 번역하되, 상징적·성례전적 의미를 본문 이상으로 덧붙이지 않았습니다.
  alternative_readings:
  - 예수님께 기름을 부었습니다
  - 예수님께 향유를 부어 바쳤습니다
  rationale: 본문은 실제 행위의 묘사에 초점이 있으며, 번역은 그 강한 상징 가능성을 지우지도, 반대로 확정하지도 않아야 합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상을 교리적으로 단정하지 말고, 문맥이 남겨 둔 긴장을 보존합니다.'
