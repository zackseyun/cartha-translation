  to: 그러므로 유대인들[a] 가운데서 큰 무리가 예수께서 거기에 계신다는 것을 알고, 예수 때문만이 아니라 그분께서 죽은 자들 가운데서 살리신 나사로도 보려고 왔습니다.
  rationale: 나사로를 수식하는 원문의 관계절을 한국어 관형절로 복원하여 예수께서 나사로를 죽은 자들 가운데서 살리셨다는 의미를 정확히 반영했습니다. 또한 지시 대상이 예수임을 문맥상 명확히 하고, Ἰουδαίων의 대안 의미는 해당 어구에 연결된 각주로 간결하고 중립적으로 보존했습니다.
