id: JHN.12.9
reference: John 12:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
  footnotes:
  - marker: a
    text: Or "from among the Judeans." The Greek term can refer either to Jewish people generally or, in some contexts in John, more specifically to Judeans.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 유대인들 가운데서 많은 무리가 그가 거기에 있다는 것을 알고, 예수 때문만이 아니라 나사로도 보려고 왔습니다. 그는 죽은 자들 가운데서 살리신 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들 가운데서”. 이 그리스어는 일반적으로 유대인을 가리킬 수도 있고, 요한복음의 어떤 문맥에서는 더 구체적으로 유대 지방 사람들, 곧 유대인들을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  english_pob_choice: learned
  chosen_korean: 알고
  alternatives_korean:
  - 알게 되어
  - 알아차리고
  - 알았습니다
  lexicon: BDAG
  rationale: ἐγγινώσκω의 결과적 인지를 자연스럽게 옮기되, 서술 흐름상 ‘알고’가 가장 간결하고 매끈합니다.
- source_word: ὄχλος πολὺς
  english_pob_choice: a large crowd
  chosen_korean: 많은 무리
  alternatives_korean:
  - 큰 무리
  - 많은 군중
  - 큰 군중
  lexicon: BDAG
  rationale: 집합 명사 ὄχλος의 군중성을 살리면서 πολὺς의 양적 강조를 반영했습니다.
- source_word: ἐκ τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인들 가운데서
  alternatives_korean:
  - 유대인들 중에서
  - 유대인들로부터
  - 유대 사람들 가운데서
  lexicon: BDAG
  rationale: ἐκ의 출처/범위 의미를 살려 단순한 소속보다 ‘가운데서’로 옮겼습니다. 요한복음의 Ἰουδαῖοι는 문맥상 민족·종교 집단을 가리킬 수 있어 이를 보존했습니다.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  english_pob_choice: whom he had raised from the dead
  chosen_korean: 죽은 자들 가운데서 살리신 사람
  alternatives_korean:
  - 죽은 자들 가운데서 일으키신 사람
  - 죽은 자들 가운데서 살리신 자
  - 죽은 사람들 가운데서 일으키신 사람
  lexicon: BDAG
  rationale: ἐγείρω의 ‘일으키다/살리다’ 의미를 반영하되, 라자로를 설명하는 절로서 한국어에서는 자연스럽게 ‘사람’으로 풀어 주었습니다.
theological_decisions:
- issue: Ἰουδαίων의 한국어 처리와 반유대주의 오해 가능성
  chosen_reading: ‘유대인들 가운데서’로 옮겨, 집단 표지를 유지하되 단정적 적대 표현은 피했습니다.
  alternative_readings:
  - 유대인들 중에서
  - 유대 사람들 가운데서
  - 유대인들로부터
  rationale: 본문은 무리의 출처를 말할 뿐 평가를 가하지 않으므로, 원문의 범주성을 살리면서도 부정적 뉘앙스를 덧씌우지 않는 표현을 택했습니다.
  doctrine_reference: 원문 우선 번역; 본문 내 긴장 보존
