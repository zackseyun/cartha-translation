  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: Now there were some Greeks among those going up to worship at the feast[a].
  footnotes:
  - marker: a
    text: Or 'certain Greeks'; possibly non-Jews who had come up to worship at the festival.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 명절에 예배하러 올라온 사람들 가운데 몇몇 헬라인이 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 헬라인들’이며, 절기에 예배하러 올라온 비유대인들일 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  english_pob_choice: Now there were
  chosen_korean: 그때 … 있었습니다
  alternatives_korean:
  - 그리고 … 있었습니다
  - 이제 … 있었습니다
  lexicon: BDAG
  rationale: 존재를 나타내는 ἦσαν과 완만한 연결어 δέ를 자연스러운 서술 흐름으로 옮기기 위해, 시간적 전환을 드러내는 ‘그때’와 평서형 ‘있었습니다’를 사용했습니다.
- source_word: Ἕλληνές τινες
  english_pob_choice: some Greeks
  chosen_korean: 몇몇 헬라인
  alternatives_korean:
  - 어떤 헬라인
  - 몇몇 그리스 사람들
  lexicon: BDAG
  rationale: Ἕλληνες의 기본 의미는 민족·문화적 지칭인 ‘헬라인’이므로, 일반화된 ‘이방인’보다 원문을 더 직접적으로 살렸습니다. τινες는 불특정성을 나타내므로 ‘몇몇’으로 옮겼습니다.
- source_word: ἐκ τῶν ἀναβαινόντων
  english_pob_choice: among those going up
  chosen_korean: 올라온 사람들 가운데
  alternatives_korean:
  - 올라가던 사람들 가운데
  - 올라가려던 사람들 가운데
  lexicon: BDAG
  rationale: ἐκ + 분사는 어떤 무리의 일부임을 나타내므로 ‘가운데’로 자연스럽게 처리했고, 예루살렘 순례 맥락의 관용적 표현인 ‘올라오다’를 살렸습니다.
- source_word: ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ
  english_pob_choice: to worship at the feast
  chosen_korean: 명절에 예배하러
  alternatives_korean:
  - 명절에 경배하러
  - 축제 때 예배하려고
  lexicon: BDAG
  rationale: προσκυνέω는 이 문맥에서 단순한 절이 아니라 종교적 예배를 뜻하므로 ‘예배하다’로 옮겼고, ἑορτή는 유대 절기를 가리키는 맥락상 ‘명절’이 자연스럽습니다.
theological_decisions:
- issue: Ἕλληνες의 정체를 어떻게 처리할 것인가
  chosen_reading: 민족·문화적 지칭을 유지해 ‘헬라인’으로 옮기고, ‘이방인’으로 일반화하지 않았습니다.
  alternative_readings:
  - 이방인
  - 그리스 사람들
  rationale: 원문은 Ἕλληνες라고만 말하며 이들이 유대인/개종자/하나님을 경외하는 자인지 단정하지 않습니다. 번역도 그 긴장을 해소하지 않고 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
