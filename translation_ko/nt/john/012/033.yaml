id: JHN.12.33
reference: John 12:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: Now he was saying this to signify what kind of death he was about to die[a].
  footnotes:
  - marker: a
    text: Or 'by what kind of death.' The Greek expression can emphasize the manner of death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이렇게 말씀하셨습니다. 그것은 자기에게 어떤 죽음이 닥칠지를 알리려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 방식으로 죽을지’. 그리스어 표현은 죽음의 방식을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  english_pob_choice: this
  chosen_korean: 그것은
  alternatives_korean:
  - 이것은
  - 이 일은
  lexicon: BDAG
  rationale: 앞선 예수의 말씀을 가리키는 중성 지시어로, 한국어에서는 문맥상 자연스럽게 받는 대명사 ‘그것’을 사용했습니다.
- source_word: ἔλεγεν
  english_pob_choice: was saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하고 계셨습니다
  - 말하셨습니다
  lexicon: BDAG
  rationale: 미완료시상의 반복·진행성을 살리면서도 한국어 서술에서는 매끄럽게 읽히도록 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: σημαίνων
  english_pob_choice: to signify
  chosen_korean: 알리려는 것이었습니다
  alternatives_korean:
  - 의미하는 것이었습니다
  - 가리키는 것이었습니다
  - 암시하는 것이었습니다
  lexicon: BDAG
  rationale: 문맥상 예수의 말이 죽음의 방식에 대한 표지를 주는 기능이므로, 단순한 ‘의미하다’보다 결과 지향적인 ‘알리다’가 더 자연스럽고 본문의 기능을 잘 드러냅니다.
- source_word: ποίῳ θανάτῳ
  english_pob_choice: what kind of death
  chosen_korean: 어떤 죽음
  alternatives_korean:
  - 무슨 죽음
  - 어떤 방식의 죽음
  - 어느 죽음
  lexicon: BDAG
  rationale: 여격의 ποίῳ는 죽음의 ‘종류/방식’을 묻는 표현이므로, 한국어에서는 ‘어떤 죽음’으로 간결하게 살렸습니다.
theological_decisions:
- issue: 죽음의 구체적 형태를 본문에 드러낼지 여부
  chosen_reading: 본문의 간접성을 유지해 ‘어떤 죽음’이라고만 번역했습니다.
  alternative_readings:
  - 십자가에서 죽을 어떤 죽음
  - 어떤 방식으로 죽을지
  rationale: 이 절은 예수의 말씀이 죽음의 방식을 가리킨다고 설명하지만, 여기서 십자가를 직접 언급하지는 않습니다. 본문이 허용하는 간접성을 유지하는 것이 사도요한의 서술 의도를 더 정확히 반영합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 범위를 넘겨 해석을 본문 안에 미리 삽입하지 않습니다.'
