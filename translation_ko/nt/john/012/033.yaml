  source_fidelity: 개정이 필요합니다. 초안의 ‘자기에게 어떤 죽음이 닥칠지’는 μέλλω ἀποθνῄσκειν(죽게 되다)을 죽음이 닥치는 것으로 바꾸어 행위와 표현의 초점을 약화합니다. 또한 σημαίνων은 예수께서 말씀하신 방식/목적을 나타내므로, 두 문장으로 분리한 초안보다 그 관계를 문장 안에서 밝혀야 합니다.
  naturalness: ‘이 말씀은 예수께서 … 하신 말씀이었습니다’는 요한복음의 해설적 서술에 자연스럽고 현대 표준어 합쇼체에 맞습니다. ‘어떤 방식으로 죽게 되실지’는 한국어에서 자연스러우면서 ποίῳ θανάτῳ의 방식적 뉘앙스를 살립니다.
  terminology: 예수님에 대한 높임말 ‘말씀하신/되실’은 적절합니다. 본문이 십자가형을 명시하지 않으므로 이를 본문에 삽입하지 않았습니다.
  issues:
  - severity: high
    issue: ‘자기에게 어떤 죽음이 닥칠지’
    rationale: 원문의 ‘어떤 죽음으로 죽게 되실지’라는 표현을 죽음이 외부에서 닥치는 사건으로 바꾸며, ‘죽다’와 죽음의 방식이라는 초점을 충분히 보존하지 못합니다.
  - severity: medium
    issue: ‘그는 이렇게 말씀하셨습니다. 그것은 … 알리려는 것이었습니다.’
    rationale: ‘이렇게’는 원문에 없는 지시를 더하고, σημαίνων이 ἔλεγεν에 연결되는 관계를 부자연스럽게 분리합니다. 또한 τοῦτο는 앞선 말씀을 가리키므로 ‘이 말씀’으로 받는 편이 명확합니다.
  revised_text: 이 말씀은 예수께서 자신이 어떤 방식으로 죽게 되실지를[a] 나타내시며 하신 말씀이었습니다.
