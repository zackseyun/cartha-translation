  - severity: medium
    issue: ‘천둥이 났다’는 해당 의미에서 관용성이 낮습니다.
    rationale: βροντὴν γεγονέναι는 천둥이 발생했다는 뜻이며, 표준 현대 한국어의 자연스러운 대응은 ‘천둥이 쳤다’ 또는 ‘천둥소리가 났다’입니다.
  - severity: low
    issue: ‘그러므로’는 οὖν의 서사적 연결을 다소 강한 논리적 결론으로 들리게 할 수 있습니다.
    rationale: 이 문맥에서는 ‘그러자’가 앞 절의 음성에 이은 장면 전환·반응을 자연스럽게 드러냅니다.
  - severity: low
