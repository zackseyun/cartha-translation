id: JHN.12.29
reference: John 12:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
  footnotes:
  - marker: a
    text: Or more idiomatically, “that it had thundered” or “that there had been thunder.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 거기에 서 있던 무리는 그 소리를 듣고 “천둥이 쳤다”라고 말하고 있었습니다.[a] 다른 이들은 “천사가 그에게 말했습니다”라고 말하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 “천둥소리가 났다”라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὖν ὄχλος
  english_pob_choice: the crowd / So
  chosen_korean: 그러므로 그곳에 서서 그것을 들은 무리들은
  alternatives_korean:
  - 그래서 그 무리는
  - 그러자 그 무리는
  lexicon: BDAG
  rationale: οὖν의 이어짐을 ‘그러므로’로 드러내고, ὄχλος는 문맥상 단수 집합 명사인 ‘무리’로 옮겼습니다.
- source_word: ὁ ἑστὼς καὶ ἀκούσας
  english_pob_choice: that was standing there and had heard it
  chosen_korean: 그곳에 서서 그것을 들은
  alternatives_korean:
  - 거기 서 있었고 들은
  - 서서 듣고 있던
  lexicon: BDAG
  rationale: 완료 분사 ἑστὼς와 aorist 분사 ἀκούσας의 선행 관계를 살려 ‘서서…들은’으로 자연스럽게 옮겼습니다.
- source_word: βροντὴν γεγονέναι
  english_pob_choice: that thunder had happened
  chosen_korean: “천둥이 났다”
  alternatives_korean:
  - “천둥이 있었다”
  - “천둥이 일어났다”
  lexicon: BDAG
  rationale: 직역적 ‘thunder had happened’의 뜻을 살리되 한국어에서 자연스러운 사건 표현인 ‘천둥이 났다’로 옮겼습니다.
- source_word: Ἄγγελος αὐτῷ λελάληκεν
  english_pob_choice: An angel has spoken to him
  chosen_korean: “천사가 그에게 말하였다”
  alternatives_korean:
  - “천사가 그에게 말씀하셨다”
  - “한 천사가 그에게 말하였다”
  lexicon: BDAG
  rationale: ἄγγελος는 여기서 하늘 존재로 이해되는 ‘천사’로 옮겼고, λελάληκεν의 완료 시상은 한국어 과거 서술로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 천둥에 대한 군중의 해석
  chosen_reading: 군중은 들린 음성을 하나님의 직접 음성으로 이해하지 못하고, 어떤 이들은 그것을 천둥으로 들었습니다.
  alternative_readings:
  - 음성의 의미를 더 분명히 풀어 설명할 수 있음
  - 단순히 소리였다고만 옮길 수 있음
  rationale: 본문은 군중의 인식 차이를 보여 주므로, 사건의 해석을 과도하게 정리하지 않고 두 반응을 병렬로 유지했습니다.
  doctrine_reference: source transparency; narrative restraint
