revisions:
- from: 그러므로 그곳에 서서 그것을 들은 무리들은 “천둥이 났다”라고 말하고 있었습니다. 또 다른 사람들은 “천사가 그에게 말하였다”라고 말하고 있었습니다.[a]
  to: 그러자 거기에 서 있던 무리는 그 소리를 듣고 “천둥이 쳤다”라고 말하고 있었습니다.[a] 다른 이들은 “천사가 그에게 말했습니다”라고 말하고 있었습니다.
  rationale: 서사 연결어를 ‘그러자’로 조정하고, 군중의 상태와 들은 대상을 자연스럽게 표현했습니다. βροντὴν γεγονέναι는 한국어 관용에 맞게 ‘천둥이 쳤다’로 옮겼으며, 관련 어휘 대안 각주를 해당 인용문에 직접 연결했습니다. 두 집단의 반복·지속적 발언을 ‘말하고 있었습니다’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:23:01Z'
