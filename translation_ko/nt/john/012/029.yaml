  source_fidelity: 원문의 두 분사(‘서 있던’, ‘들었던’)와 두 미완료 동사(반복·지속적 발언)를 자연스러운 한국어로 반영해야 합니다. βροντὴν γεγονέναι는 한국어 관용상 ‘천둥이 쳤다’가 정확하며, 각주가 이 표현에 직접 붙어야 합니다.
  naturalness: 초안의 ‘천둥이 났다’는 현대 표준어에서 다소 부자연스럽고, 각주가 절 끝에 놓여 어느 표현을 보충하는지 불분명합니다. ‘그러자’, ‘거기에 서 있던 무리’, ‘다른 이들’이 문맥과 문체에 더 자연스럽습니다.
  terminology: ὄχλος는 ‘무리’, ἄγγελος는 문맥상 ‘천사’로 적절합니다. αὐτῷ는 선행 문맥의 예수를 가리키므로 ‘그에게’로 유지할 수 있습니다. 천사의 발화를 ‘말했습니다’로 옮겨 원문의 완료형이 가리키는 이미 이루어진 발화를 자연스럽게 표현했습니다.
  issues:
