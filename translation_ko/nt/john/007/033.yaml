id: JHN.7.33
reference: John 7:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
  footnotes:
  - marker: a
    text: Or “for a little time still.”
    reason: lexical_alternative
  - marker: b
    text: “The one who sent me” refers to the Father in John’s broader context.
    reason: cross_reference
translation:
  language: ko
  text: 그러자 예수께서 말씀하셨습니다. “나는 너희와 함께 잠시 더 있다가[b] 나를 보내신 분께로[a] 갑니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “나를 보내신 분”은 요한복음의 더 넓은 문맥에서 아버지를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: “잠시 더 있다가”는 ‘아직/여전히’의 뉘앙스를 포함한 시간 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν οὖν
  english_pob_choice: So Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그러므로 말씀하셨습니다
  - 그래서 예수께서 말씀하셨습니다
  lexicon: BDAG
  rationale: οὖν은 앞뒤 대화의 논리적 이어짐을 표시하므로, 한국어에서는 자연스러운 서술 연결로 풀되 과도한 논리 접속어는 피했습니다. 예수의 발화 도입은 존칭 동사 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: Ἔτι χρόνον μικρόν
  english_pob_choice: I am with you a little while longer
  chosen_korean: 너희와 함께 조금 더 있다가
  alternatives_korean:
  - 너희와 함께 아직 잠시 있다가
  - 너희와 함께 조금만 더 있다가
  lexicon: BDAG
  rationale: ἔτι와 χρόνον μικρόν의 결합은 ‘아직/더’의 잔여 기간과 ‘짧음’을 함께 드러내므로, 문맥상 자연한 ‘조금 더’로 옮겼습니다. “a little while longer”의 시간적 잔여감을 살렸습니다.
- source_word: μεθ’ ὑμῶν εἰμι
  english_pob_choice: I am with you
  chosen_korean: 너희와 함께 있다가
  alternatives_korean:
  - 너희와 함께 있습니다
  - 너희 가운데 있습니다
  lexicon: BDAG
  rationale: 현재적 동행의 진술이므로 ‘함께 있다’로 직역성을 유지했습니다. 한국어에서는 뒤의 ‘가다’와의 연결을 위해 종결 대신 연결형 ‘있다가’를 사용했습니다.
- source_word: ὑπάγω πρὸς τὸν πέμψαντά με
  english_pob_choice: I am going to the one who sent me
  chosen_korean: 나를 보내신 분께로 갑니다
  alternatives_korean:
  - 나를 보내신 이에게 갑니다
  - 나를 보내신 분께로 가고 있습니다
  lexicon: BDAG
  rationale: πέμψαντά με는 ‘나를 보내신 분’이라는 실질 명사구로 옮겨 관계적·신학적 함의를 유지했습니다. ὑπάγω는 요한복음에서 단순한 이동보다 떠남의 의미가 있으나, 여기서는 과장하지 않고 ‘갑니다’로 담았습니다.
theological_decisions:
- issue: “나를 보내신 분”의 명시적 대상
  chosen_reading: 본문이 직접 말하는 관계 표현을 유지하고, 대상은 본문 밖에서 독자가 요한복음의 더 넓은 문맥을 통해 이해하게 했습니다.
  alternative_readings:
  - 하나님 아버지께로 갑니다
  - 아버지께로 갑니다
  rationale: 그리스어는 직설적으로 ‘아버지’라 하지 않고 ‘나를 보내신 분’이라고 말하므로, 본문이 가진 간접성과 서술의 절제를 보존했습니다.
  doctrine_reference: 요한복음의 파송-귀환 구조
