  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 οὐδεὶς ἐπέβαλεν의 단순 과거 부정은 ‘손을 대지 못했습니다’보다 ‘손을 대지 않았습니다’가 더 정확합니다. ‘못했습니다’는 외적·내적 무능을 불필요하게 부각할 수 있습니다.
  naturalness: 합쇼체는 자연스럽습니다. 각주 표지를 해당 어구 가까이에 배치하면 한국어 독자에게 각주의 지시 대상이 더 분명해집니다.
  terminology: ‘붙잡고 싶어 했습니다’는 ἤθελον πιάσαι의 지속된 의도를 자연스럽게 전달하며, ‘체포하려고’라는 대안 각주도 적절합니다. ‘손을 대다’는 여기서 물리적으로 붙잡으려는 관용적 의미를 문맥상 유지합니다.
