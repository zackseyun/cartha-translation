source:
  edition: SBLGNT
  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
  footnotes:
  - marker: a
    text: Or 'from among them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to arrest him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 그들 가운데 일부[a]는 그를 붙잡고 싶어 했습니다[b]. 그러나 아무도 그에게 손을 대지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 가운데서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 체포하려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  english_pob_choice: some
  chosen_korean: 일부
  alternatives_korean:
  - 몇몇 사람들
  - 어떤 이들
  lexicon: BDAG
  rationale: 불특정 다수 가운데 일부를 가리키므로, 현대 한국어에서는 간결하고 자연스러운 ‘일부’가 indefiniteness를 잘 살립니다.
- source_word: ἐξ αὐτῶν
  english_pob_choice: of them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 중
  - 그들로부터
  lexicon: BDAG
  rationale: 단순 소속이 아니라 큰 무리 안에서 갈라져 나온 일부라는 뜻을 자연스럽게 드러내기 위해 ‘그들 가운데’로 옮겼습니다.
- source_word: πιάσαι
  english_pob_choice: to seize
  chosen_korean: 붙잡고 싶어 했습니다
  alternatives_korean:
  - 붙잡으려 했습니다
  - 체포하려 했습니다
  lexicon: BDAG
  rationale: πιάζω는 기본적으로 ‘붙잡다/붙들다’의 뜻이며, 이 문맥에서는 체포 뉘앙스도 가능하므로, 본문은 직접적 의미를 살리되 주석으로 체포 가능성을 열어 두었습니다.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  english_pob_choice: laid hands on him
  chosen_korean: 그에게 손을 대지 못했습니다
  alternatives_korean:
  - 그를 붙들지 못했습니다
  - 그에게 손을 얹지 못했습니다
  lexicon: BDAG
  rationale: 헬라어 관용구는 적대적 제압이나 체포를 뜻하므로, 직역형 관용어 ‘손을 대다’를 유지하되 부정문으로 결과를 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘seize/lay hands on’의 폭력적·체포적 함의
  chosen_reading: 본문은 군중 일부의 의도를 단순한 접촉이 아니라 예수를 붙잡아 억류하려는 시도로 이해했습니다.
  alternative_readings:
  - 단순히 몸을 만지려는 시도
  - 분노 속의 물리적 제지
  rationale: 문맥상 적대적 의도와 관용구의 통상적 용법이 체포 또는 강제 구금의 뉘앙스를 지지하므로, 그 강도를 약화하지 않았습니다.
  doctrine_reference: 요한복음 7장 문맥상 예수의 때가 아직 오지 않았다는 서술
