revisions:
- from: 세상은 너희를 미워할 수 없지만, 나를 미워합니다. 이는 내가 그것에 대하여 증언하기를, 그 행위가 악하기 때문입니다.[a][b][c][d]
  to: 세상은 너희를 미워하지 못합니다[a][b]. 그러나 나를 미워합니다. 내가 세상에 대하여 그 행위들이 악하다고 증언하기 때문입니다[c][d].
  rationale: ‘미워하지 못합니다’는 οὐ δύναται의 불능을 자연스럽게 보존하고, ‘그러나’는 δέ의 대조를 명료하게 드러냅니다. ‘세상에 대하여’는 περὶ αὐτοῦ의 비인격적 선행사를 한국어답게 처리했으며, ‘그 행위들이 악하다고 증언하기’는 ὅτι절의 내용을 명확히 연결하고 복수 ἔργα를 보존합니다. 각주 표지는 해당 표현 가까이 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:08Z'
