id: JHN.7.7
reference: John 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
  footnotes:
  - marker: a
    text: Or 'cannot hate you.'
    reason: lexical_alternative
  - marker: b
    text: '''The world'' in John often refers to the human order in opposition to God, not to the created universe as such.'
    reason: cultural_note
  - marker: c
    text: Or 'I bear witness about it.'
    reason: lexical_alternative
  - marker: d
    text: Or 'its deeds are evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 세상은 너희를 미워하지 못합니다[a][b]. 그러나 나를 미워합니다. 내가 세상에 대하여 그 행위들이 악하다고 증언하기 때문입니다[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희를 미워할 수 없다’.
    reason: lexical_alternative
  - marker: b
    text: 요한복음에서 ‘세상’은 종종 피조된 우주 자체가 아니라 하나님께 대항하는 인간 질서를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘세상에 대하여 증언한다’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그 행위들은 악하다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  english_pob_choice: is not able
  chosen_korean: 미워할 수 없지만
  alternatives_korean:
  - 미워하지 못하지만
  - 미워할 능력이 없지만
  lexicon: BDAG
  rationale: δύναμαι의 능력/불능 의미를 살리기 위해 단순 부정이 아니라 가능성의 표현으로 옮겼습니다.
- source_word: ὁ κόσμος
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 이 세상
  - 세상 체계
  lexicon: BDAG
  rationale: 요한복음의 κόσμος는 종종 하나님께 대항하는 인간 질서를 가리키므로, 여기서는 과도한 해설 없이 표준적인 '세상'으로 유지했습니다.
- source_word: μαρτυρῶ περὶ αὐτοῦ
  english_pob_choice: I testify about it
  chosen_korean: 그것에 대하여 증언하기를
  alternatives_korean:
  - 그것에 대하여 증언한다
  - 그것을 증언한다
  lexicon: BDAG
  rationale: μαρτυρέω의 법정적·증언적 뉘앙스를 살려 '증언하다'를 택했고, περὶ αὐτοῦ는 한국어 자연성을 위해 '그것에 대하여'로 옮겼습니다.
- source_word: τὰ ἔργα αὐτοῦ πονηρά ἐστιν
  english_pob_choice: its works are evil
  chosen_korean: 그 행위가 악하기 때문입니다
  alternatives_korean:
  - 그 일들이 악하기 때문입니다
  - 그의 일들이 악하기 때문입니다
  lexicon: BDAG
  rationale: ἔργα는 단순한 결과물보다 도덕적 행위를 가리키는 문맥이므로 '행위'로 옮겼고, πονηρά는 도덕적 악을 직접 드러내는 '악하다'로 번역했습니다.
theological_decisions:
- issue: κόσμος의 신학적 함의
  chosen_reading: '''세상''을 본문에 유지하고, 해설을 본문 밖으로 미룹니다.'
  alternative_readings:
  - 세상 체계
  - 하나님께 대항하는 인간 질서
  rationale: 요한복음의 κόσμος는 중층적 의미를 가지므로, 본문에서는 그 긴장을 풀어버리지 않고 '세상'으로 유지하는 편이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
