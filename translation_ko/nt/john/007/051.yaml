review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal legal vocabulary and rhetorical-question form, but its construction “듣고, ... 알아보기도 전에” presents hearing as already completed while only knowing remains pending. The Greek ἐὰν μὴ governs both coordinated requirements: the law is not to judge unless it has first heard from the person and learned what he is doing.'
  naturalness: The revised conditional expression “알아본 뒤가 아니면” is natural in modern formal Korean and makes the joint procedural condition clear. “심판합니까?” appropriately retains the negative-answer-expecting rhetorical force of initial Μή.
  terminology: “우리 율법,” “사람,” and “심판하다” are suitable, source-faithful choices in this legal context. “알아보다” reasonably renders γνῷ as ascertaining the relevant facts without strengthening it to condemnation or investigation beyond the context.
  issues:
  - severity: medium
    issue: The conditional sequence is inaccurately scoped in the draft.
    rationale: “먼저 그에게서 듣고, 그가 무엇을 하고 있는지 알아보기도 전에” can mean that the law hears him but judges before finding out what he is doing. The source requires both hearing from him first and knowing what he does before judgment.
  - severity: low
    issue: Footnote a describes ‘사람’ as an added Korean unpacking.
    rationale: ‘사람’ directly renders the generic representative singular ἄνθρωπον; the note should describe it as such rather than imply that the translator inserted an element not represented in the source.
  revised_text: 우리 율법은 먼저 그에게서 듣고[b] 또 그가 무엇을 하고 있는지 알아본 뒤가 아니면 사람을[a] 심판합니까?
