id: JHN.7.51
reference: John 7:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
  footnotes:
  - marker: a
    text: Or 'a person.' The Greek says 'a man' as a representative singular.
    reason: lexical_alternative
  - marker: b
    text: Or 'hear him first.' The Greek more literally says 'hear first from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 율법은 먼저 그에게서 듣고, 그가 무엇을 하고 있는지 알아보기도 전에 사람을 심판합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’을 넣은 것은 원문의 대표 단수 ἄνθρωπον을 한국어에서 자연스럽게 풀어 쓴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘먼저 그에게서 듣고’는 παρ’ αὐτοῦ의 직역에 가까우며, ‘그의 말을 먼저 듣고’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος ἡμῶν
  english_pob_choice: our law
  chosen_korean: 우리 율법
  alternatives_korean:
  - 우리 법
  - 우리의 율법
  lexicon: BDAG
  rationale: 소유격 ἡμῶν을 살려 공동체가 의지하는 규범을 자연스럽게 ‘우리 율법’으로 옮겼습니다. 여기서는 제도명보다 유대인들이 호소하는 법적 기준이라는 점이 중요합니다.
- source_word: κρίνει
  english_pob_choice: judge
  chosen_korean: 심판합니까
  alternatives_korean:
  - 판단합니까
  - 판결합니까
  lexicon: BDAG
  rationale: κρίνω의 법정적 뉘앙스를 살리되, 한국어에서 문맥상 가장 자연스러운 법적 판정 표현으로 ‘심판하다’를 택했습니다.
- source_word: τὸν ἄνθρωπον
  english_pob_choice: a man
  chosen_korean: 사람을
  alternatives_korean:
  - 한 남자를
  - 한 사람을
  lexicon: BDAG
  rationale: 원문은 대표 단수이지만, 이 구절의 논지는 성별보다 일반적 인간을 가리키는 법적 진술이어서 한국어에서는 포괄적인 ‘사람’을 사용했습니다.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  english_pob_choice: it first hears from him
  chosen_korean: 먼저 그에게서 듣고
  alternatives_korean:
  - 먼저 그의 말을 듣고
  - 그에게서 먼저 듣고
  lexicon: BDAG
  rationale: παρά + 속격의 ‘~에게서’라는 직접 출처를 살리고, πρῶτον을 ‘먼저’로 앞세워 절차상의 선행 조건을 드러냈습니다.
- source_word: γνῷ τί ποιεῖ
  english_pob_choice: knows what he is doing
  chosen_korean: 그가 무엇을 하고 있는지 알아보기도 전에
  alternatives_korean:
  - 그가 무엇을 하는지 알기도 전에
  - 그가 무엇을 하고 있는지 알기 전에
  lexicon: BDAG
  rationale: γινώσκω를 단순한 인지보다 사실 파악의 완료로 읽어 ‘알아보다’로 옮겼고, 현재형 ποιεῖ의 진행성을 살려 ‘하고 있는지’로 표현했습니다.
theological_decisions:
- issue: 문장 끝의 수사 의문문 처리
  chosen_reading: 마지막을 ‘…심판합니까?’로 번역해 기대되는 부정 답변의 수사적 힘을 한국어로 살렸습니다.
  alternative_readings:
  - …심판하지 않습니까?
  - …심판하겠습니까?
  rationale: μή로 시작하는 질문은 부정 대답을 기대하는 형태이므로, 단순 평서문보다 수사 의문문으로 옮기는 것이 원문의 논증 압력을 더 잘 드러냅니다.
  doctrine_reference: 요 7:51 문맥상 공정한 재판 절차와 예수에 대한 판단의 성급함
- issue: ‘우리 율법’의 범위
  chosen_reading: ‘우리 율법’으로 두어 말하는 이들이 공동체적으로 소유한다고 여기는 법을 드러냈습니다.
  alternative_readings:
  - ‘율법’
  - ‘우리 법’
  rationale: 원문 소유격은 단순한 일반 법이 아니라 화자 집단이 자기 것으로 내세우는 규범임을 보이므로, 소유 표현을 유지하는 것이 논증의 당사자성을 살립니다.
  doctrine_reference: 유대 지도자들의 절차적 정당성 주장
