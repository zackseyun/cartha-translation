id: JHN.7.38
reference: John 7:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
  footnotes:
  - marker: a
    text: Or, 'from within him'; some understand 'his' to refer to the Messiah rather than to the believer.
    reason: alternative_reading
  - marker: b
    text: Greek 'belly' or 'womb'; here likely a figurative expression for the inner self.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 믿는 사람은, 성경이 말한 대로, 그 사람의 속에서[a][b] 생수의 강들이 흘러나올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 속에서’; 일부는 ‘그의’가 믿는 사람이 아니라 메시아를 가리킨다고 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘배’ 또는 ‘태’를 뜻합니다. 여기서는 내면의 중심을 가리키는 비유적 표현일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  english_pob_choice: The one who believes
  chosen_korean: 나를 믿는 사람은
  alternatives_korean:
  - 믿는 이는
  - 믿는 자는
  lexicon: BDAG
  rationale: 현재분사 관용구를 명사적으로 풀어 ‘한 사람’의 일반적·지속적 성격을 살렸습니다. ‘사람’은 현대 한국어에서 자연스럽고, 합쇼체 본문에 맞게 문장 출발점을 분명히 합니다.
- source_word: εἰς ἐμέ
  english_pob_choice: in me
  chosen_korean: 나를
  alternatives_korean:
  - 내 안으로
  - 나 안에
  lexicon: BDAG
  rationale: πιστεύω와 결합한 εἰς는 신뢰의 방향성을 나타내므로, 한국어에서는 ‘나를 믿다’가 가장 자연스럽게 그 방향성을 전달합니다.
- source_word: καθὼς εἶπεν ἡ γραφή
  english_pob_choice: just as the Scripture said
  chosen_korean: 성경이 말한 대로
  alternatives_korean:
  - 성경이 말했듯이
  - 성경에 기록된 대로
  lexicon: BDAG
  rationale: ‘성경’은 헬라어의 단수 정관사형 γραφή를 반영하는 대표적 표현입니다. ‘말한 대로’는 인용 공식을 자연스럽게 옮기면서도 예언적 권위를 유지합니다.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  english_pob_choice: from his inner being / from his belly
  chosen_korean: 그 사람의 속에서
  alternatives_korean:
  - 그의 배에서
  - 그의 내면에서
  - 그의 속사람에게서
  lexicon: BDAG
  rationale: κοιλία는 문자적으로 ‘배’이지만, 여기서는 인간 내부의 근원이라는 비유가 더 적절합니다. POB의 긴장점(문자적 의미와 비유적 의미)을 살리기 위해 과도한 해석 없이 ‘속’으로 옮겼습니다.
- source_word: ὕδατος ζῶντος
  english_pob_choice: living water
  chosen_korean: 생수의 강들
  alternatives_korean:
  - 살아 있는 물의 강들
  - 생명의 물의 강들
  lexicon: BDAG
  rationale: ‘living water’는 요한복음의 반복적 신학 용어이므로 ‘생수’로 번역해 상호본문성을 살렸습니다. 복수 ‘강들’은 ποταμοί를 직접 반영합니다.
theological_decisions:
- issue: ἐκ τῆς κοιλίας αὐτοῦ의 대명사 지시 대상
  chosen_reading: ‘그 사람’을 믿는 사람으로 읽어, 생수의 강들이 믿는 사람의 속에서 흘러나온다고 옮겼습니다.
  alternative_readings:
  - 메시아/예수를 가리켜 그분에게서 흘러나온다고 읽는 해석
  - 대명사를 모호하게 남겨 두는 해석
  rationale: 가장 가까운 선행사는 ‘나를 믿는 사람’이므로 문법적으로는 믿는 사람이 수원(水源)입니다. 다만 일부 해석 전통의 대안은 본문 밖에서 삭제하지 않고, 본문 자체는 가장 자연스러운 지시 관계를 드러내도록 했습니다.
  doctrine_reference: '번역 원칙: 문법적 선행사와 해석 전통의 긴장을 보존합니다.'
