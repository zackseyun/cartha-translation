    rationale: 문맥상 신적 영을 뜻하지만, 한국어의 ‘그분’은 원문 표현보다 더 명시적인 인격적·존칭적 표현입니다. ‘영’을 선행사로 직접 재구성하면 이를 피할 수 있습니다.
