    rationale: ‘그분을 믿은 이들이 받게 될 것이기 때문입니다’는 ‘왜 이 말씀을 하셨는가’를 설명하는 이유절처럼 읽힙니다. 원문은 ‘그 영에 관하여 말씀하셨는데, 그 영을 믿는 이들이 받게 되어 있었다’라는 관계절 구조입니다.
