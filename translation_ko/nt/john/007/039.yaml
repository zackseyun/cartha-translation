revisions:
- from: 이것은 그 영[a]에 관하여 하신 말씀인데, 그분을 믿은 이들이 받게 될 것이기 때문입니다. 아직 그 영은 없었습니다[b]. 이는 예수께서 아직 영광을 받지 않으셨기 때문입니다.
  to: 예수께서는 자신을 믿는 이들이 받게 될 영[a]에 관하여 이 말씀을 하셨습니다. 예수께서 아직 영광을 받지 않으셨으므로, 영은 아직 없었습니다[b].
  rationale: 관계대명사와 μέλλω+부정사 구문을 ‘믿는 이들이 받게 될 영’으로 자연스럽게 재구성하여 원문의 수식 관계를 회복했습니다. ‘영은 아직 없었습니다’는 οὔπω γὰρ ἦν πνεῦμα의 간결하고 논쟁적인 표현을 해석적으로 ‘주어지지 않았다’로 본문에서 확정하지 않고 보존합니다. 그 대안은 각주에서만 제시했습니다.
  reviewer_model: gpt-5.6-terra
