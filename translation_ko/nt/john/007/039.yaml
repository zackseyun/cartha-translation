id: JHN.7.39
reference: John 7:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: Now he said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'for the Spirit had not yet been given.' The Greek reads simply, 'for the Spirit was not yet,' linking this to Jesus not yet being glorified.
    reason: alternative_reading
  - marker: b
    text: Or 'for the Spirit was not yet'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서는 자신을 믿는 이들이 받게 될 영[a]에 관하여 이 말씀을 하셨습니다. 예수께서 아직 영광을 받지 않으셨으므로, 영은 아직 없었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 명시적으로 옮기면, ‘영이 아직 주어지지 않았다’로 이해할 수도 있습니다. 그리스어는 단순히 ‘영은 아직 없었다’라고 말하며, 이를 예수께서 아직 영광을 받지 않으신 것과 연결합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면, ‘아직 영은 없었습니다’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: τοῦ πνεύματος / πνεῦμα
  english_pob_choice: Spirit
  chosen_korean: 그 영
  alternatives_korean:
  - 영
  - 성령
  lexicon: BDAG
  rationale: 문맥상 믿는 이들이 받게 될 신적 영을 가리키므로 ‘성령’도 가능하지만, 헬라어에 없는 ἅγιον을 덧붙이지 않기 위해 기본형 ‘영’을 사용했습니다. 문장 흐름상 지시성을 분명히 하기 위해 첫 언급은 ‘그 영’으로 처리했습니다.
- source_word: οὗ
  english_pob_choice: whom
  chosen_korean: 그분을
  alternatives_korean:
  - 그것을
  - 그
  lexicon: BDAG
  rationale: 영을 가리키는 관계대명사는 한국어에서 대상을 살리는 ‘그분을’이 가장 자연스럽고, 인격적 주체성을 과하게 해석하지 않으면서도 문맥의 인칭성을 반영합니다.
- source_word: ἔμελλον λαμβάνειν
  english_pob_choice: were about to receive
  chosen_korean: 받게 될
  alternatives_korean:
  - 받으려 하고 있던
  - 받을 참이던
  lexicon: BDAG
  rationale: μέλλω+부정사는 임박한 미래를 나타내므로, ‘받게 될’이 현재 서술에 맞으면서도 가까운 장차를 잘 살립니다.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  english_pob_choice: for the Spirit was not yet
  chosen_korean: 아직 그 영은 없었습니다
  alternatives_korean:
  - 그 영은 아직 없었습니다
  - 아직 영은 없었습니다
  lexicon: BDAG
  rationale: 그리스어의 간결한 진술을 너무 풀지 않고 옮기되, 한국어에서는 ‘있지 않았다’보다 ‘없었습니다’가 더 자연스럽고 독자가 즉시 이해하기 쉽습니다. 다만 존재론적 부정으로 오해되지 않도록 다음 절의 이유를 그대로 연결했습니다.
- source_word: ἐδοξάσθη
  english_pob_choice: been glorified
  chosen_korean: 영광을 받지 않으셨기 때문입니다
  alternatives_korean:
  - 영광을 받지 않으셨기 때문입니다
  - 영화되지 않으셨기 때문입니다
  lexicon: BDAG
  rationale: 요한복음에서 δοξάζω는 예수의 수난-부활-높아지심 전체를 가리키는 표지어이므로, 교회적 관용보다 본문의 동사를 살린 ‘영광을 받다’로 옮겼습니다.
theological_decisions:
- issue: οὔπω γὰρ ἦν πνεῦμα의 의미를 어떻게 처리할 것인가
  chosen_reading: 본문은 ‘아직 그 영은 없었습니다’로 직역에 가깝게 두고, 그 뒤의 이유절로 예수의 영광과 연결했습니다.
  alternative_readings:
  - 그 영이 아직 주어지지 않았습니다
  - 그 영이 아직 임하지 않았습니다
  rationale: 원문에는 ‘주어지다’나 ‘임하다’가 없으므로, 의미를 분명히 하려는 해석을 본문에 넣기보다 요한이 남겨 둔 긴장을 보존했습니다. 이는 성령의 선재를 부정하는 뜻이 아니라, 예수의 영광 이후라는 구속사적 국면을 가리키는 표현으로 읽혀야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it); Nicene orthodoxy regarding the Holy Spirit
