  - 유대인 지도자들
  rationale: 본문 자체가 더 좁은 집단을 명시하지 않으므로, 해석을 앞서 넣어 범위를 축소하지 않았습니다.
  doctrine_reference: 원어 우선 원칙; 본문이 허용하는 범위를 넘어서는 해석의 회피
