    reason: alternative_reading
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  english_pob_choice: So the Jews
  chosen_korean: 그러므로 유대인들은
  alternatives_korean:
  - 그런데 유대인들은
  - 유대 사람들은
  lexicon: BDAG
  rationale: οὖν의 이어짐을 한국어 담화표지 ‘그러므로’로 살리고, Ἰουδαῖοι는 본절의 직접 문맥상 추가 좁힘 없이 기본 의미를 유지했습니다.
- source_word: ἐζήτουν
  english_pob_choice: were looking for
  chosen_korean: 찾고 있었고
  alternatives_korean:
  - 찾고 있었으며
  - 찾으려 하고 있었고
  lexicon: BDAG
  rationale: 미완료 시제의 지속적·반복적 탐색을 자연스러운 진행형으로 옮겼습니다.
- source_word: ἐν τῇ ἑορτῇ
  english_pob_choice: at the feast
  chosen_korean: 명절에
  alternatives_korean:
  - 축제에
  - 절기에
  lexicon: BDAG
  rationale: ἑορτή를 본문 맥락에 맞게 한국어에서 가장 자연스러운 ‘명절’로 옮겨, 장소라기보다 행사/시기 안에서의 추적이라는 뉘앙스를 반영했습니다.
- source_word: ἐκεῖνος
  english_pob_choice: that one
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 자
  - 그분
  lexicon: BDAG
  rationale: ἐκεῖνος의 거리감은 유지하되, 한국어에서는 “그 사람”이 가장 자연스럽고 본문의 다소 차가운 지시를 과도하게 확대하지 않습니다.
theological_decisions:
- issue: Ἰουδαῖοι의 한국어 범주화
  chosen_reading: 본절에서는 ‘유대인들’로 두고, 지도자들로 한정하지 않았습니다.
  alternative_readings:
