id: JHN.7.11
reference: John 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
  footnotes:
  - marker: a
    text: Or “the Judeans,” possibly referring more specifically to the Judean Jewish authorities in John’s narrative context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 유대인들은 명절에 그를 찾고 있었고, “그 사람이 어디 있습니까?” 하고 말하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  english_pob_choice: So the Jews
  chosen_korean: 그러므로 유대인들은
  alternatives_korean:
  - 그런데 유대인들은
  - 유대 사람들은
  lexicon: BDAG
  rationale: οὖν의 이어짐을 한국어 담화표지 ‘그러므로’로 살리고, Ἰουδαῖοι는 본절의 직접 문맥상 추가 좁힘 없이 기본 의미를 유지했습니다.
- source_word: ἐζήτουν
  english_pob_choice: were looking for
  chosen_korean: 찾고 있었고
  alternatives_korean:
  - 찾고 있었으며
  - 찾으려 하고 있었고
  lexicon: BDAG
  rationale: 미완료 시제의 지속적·반복적 탐색을 자연스러운 진행형으로 옮겼습니다.
- source_word: ἐν τῇ ἑορτῇ
  english_pob_choice: at the feast
  chosen_korean: 명절에
  alternatives_korean:
  - 축제에
  - 절기에
  lexicon: BDAG
  rationale: ἑορτή를 본문 맥락에 맞게 한국어에서 가장 자연스러운 ‘명절’로 옮겨, 장소라기보다 행사/시기 안에서의 추적이라는 뉘앙스를 반영했습니다.
- source_word: ἐκεῖνος
  english_pob_choice: that one
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 자
  - 그분
  lexicon: BDAG
  rationale: ἐκεῖνος의 거리감은 유지하되, 한국어에서는 “그 사람”이 가장 자연스럽고 본문의 다소 차가운 지시를 과도하게 확대하지 않습니다.
theological_decisions:
- issue: Ἰουδαῖοι의 한국어 범주화
  chosen_reading: 본절에서는 ‘유대인들’로 두고, 지도자들로 한정하지 않았습니다.
  alternative_readings:
  - 유대 사람들
  - 유대인 지도자들
  rationale: 본문 자체가 더 좁은 집단을 명시하지 않으므로, 해석을 앞서 넣어 범위를 축소하지 않았습니다.
  doctrine_reference: 원어 우선 원칙; 본문이 허용하는 범위를 넘어서는 해석의 회피
