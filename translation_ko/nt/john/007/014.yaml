id: JHN.7.14
reference: John 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: Now when the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
  footnotes:
  - marker: a
    text: Or 'about the middle of the feast.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'the temple' here uses ἱερόν, referring to the temple complex or courts, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: c
    text: Or 'was teaching.' The Greek imperfect may emphasize ongoing action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 명절이 이미 절반쯤 지나자 예수께서 성전으로 올라가셔서 가르치셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명절의 한가운데쯤’.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘성전’은 내전 자체가 아니라 성전 परिसर 전체를 가리키는 ἱερόν입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘가르치고 계셨습니다.’ 그리스어 미완료과거는 계속되는 동작을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη δὲ τῆς ἑορτῆς μεσούσης
  english_pob_choice: Now when the feast was already half over
  chosen_korean: 명절이 이미 절반쯤 지나자
  alternatives_korean:
  - 명절 한가운데였을 때
  - 명절이 이미 중간쯤 되었을 때
  lexicon: BDAG
  rationale: τῆς ἑορτῆς μεσούσης의 시간적 상황을 자연스러운 한국어로 압축해, 축제가 진행 중이며 절반가량 지난 시점을 살렸습니다.
- source_word: ἀνέβη
  english_pob_choice: went up
  chosen_korean: 올라가셔서
  alternatives_korean:
  - 올라가셨습니다
  - 올라가
  lexicon: BDAG
  rationale: 예루살렘/성전으로의 상향 이동을 반영해 ‘올라가시다’를 살렸고, 이어지는 동작과의 연결을 위해 연결어미를 썼습니다.
- source_word: εἰς τὸ ἱερὸν
  english_pob_choice: into the temple
  chosen_korean: 성전으로
  alternatives_korean:
  - 성전 뜰로
  - 성전 구역으로
  lexicon: BDAG
  rationale: ἱερόν은 내전이 아니라 성전 परिसर 전체를 가리키므로, 표준적이면서도 넓은 의미를 유지하는 ‘성전’으로 옮겼습니다.
- source_word: ἐδίδασκεν
  english_pob_choice: was teaching
  chosen_korean: 가르치셨습니다
  alternatives_korean:
  - 가르치고 계셨습니다
  - 가르치기 시작하셨습니다
  lexicon: BDAG
  rationale: 미완료과거의 진행성을 한국어에서 가장 자연스럽게 드러내기 위해 단순 과거보다 지속적 행위를 암시하는 서술로 옮겼습니다.
theological_decisions:
- issue: ἐδίδασκεν의 진행상과 서술 톤
  chosen_reading: 예수께서 그 자리에서 계속 가르치고 계신 장면으로 읽었습니다.
  alternative_readings:
  - 가르치기 시작하셨습니다
  - 가르치셨습니다
  rationale: 그리스어 미완료상은 시작점보다 진행 중인 상태를 강조하므로, 본문이 말하는 지속적 가르침을 유지했습니다.
  doctrine_reference: 헬라어 시상/상(Aspect)과 서술 문맥
