base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: Now when the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
  footnotes:
  - marker: a
    text: Or 'about the middle of the feast.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'the temple' here uses ἱερόν, referring to the temple complex or courts, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: c
    text: Or 'was teaching.' The Greek imperfect may emphasize ongoing action.
    reason: lexical_alternative
translation:
  language: ko
  text: 명절이 이미 중반에 이르렀을 때, 예수께서 성전으로 올라가셔서 가르치고 계셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명절 한가운데쯤’.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘성전’은 내전 자체가 아니라 성전 구역 전체를 가리키는 ἱερόν입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘가르치셨습니다.’ 그리스어 미완료과거는 계속되는 동작을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη δὲ τῆς ἑορτῆς μεσούσης
  english_pob_choice: Now when the feast was already half over
  chosen_korean: 명절이 이미 절반쯤 지나자
