  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
  footnotes:
  - marker: a
    text: Or 'to be openly known' / 'to be public.' The Greek expression emphasizes public openness or visibility.
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 은밀히 어떤 일을 하면서 자신은 공개적으로 드러나는 것을[a] 추구하지는 않습니다. 이런 일들을 한다면, 자신을 세상에 드러내십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공개적으로 드러나는 것’은 ἐν παρρησίᾳ εἶναι의 공개성·가시성의 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  english_pob_choice: no one
  chosen_korean: 아무도
  alternatives_korean:
  - 아무도 없으니
  - 그 누구도
  lexicon: BDAG
  rationale: 일반적 부정 주어를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  english_pob_choice: does anything in secret
  chosen_korean: 은밀히 아무 일도 하지 않으면서
  alternatives_korean:
  - 비밀리에 무엇이든 하지 않으면서
  - 숨은 곳에서 아무 일도 하지 않으면서
  lexicon: BDAG
  rationale: τι의 막연한 목적어를 ‘아무 일도’로 살리고, ἐν κρυπτῷ의 숨김/은밀함을 ‘은밀히’로 반영했습니다.
- source_word: ἐν παρρησίᾳ εἶναι
  english_pob_choice: to be in public view
  chosen_korean: 공개적으로 알려지기를
  alternatives_korean:
  - 드러나 있기를
  - 공공연히 알려지기를
  - 사람들 앞에 있기를
  lexicon: BDAG
  rationale: 이 구절에서는 담대한 발화가 아니라 공개적 가시성/드러남의 의미가 중심이므로 그 뜻을 살렸습니다.
- source_word: φανέρωσον σεαυτὸν τῷ κόσμῳ
  english_pob_choice: show yourself to the world
  chosen_korean: 자신을 세상에 드러내십시오
  alternatives_korean:
  - 자신을 세계에 나타내십시오
  - 자신을 세상에 보여주십시오
  lexicon: BDAG
  rationale: φανερόω의 ‘드러내다/나타내다’ 의미를 직접 살렸고, τῷ κόσμῳ는 요한복음의 문맥을 따라 ‘세상’으로 옮겼습니다.
theological_decisions:
- issue: τῷ κόσμῳ의 번역 범위
  chosen_reading: 세상
  alternative_readings:
  - 공공장소
  - 대중
  rationale: 즉각적 문맥은 공개성에 대한 요구이지만, 요한복음의 κόσμος는 단순한 대중보다 더 넓은 신학적·서사적 울림을 가지므로 ‘세상’을 유지했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
