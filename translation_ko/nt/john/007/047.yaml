  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
  footnotes:
  - marker: a
    text: Or, “Have you also been deceived?” The verb can mean being misled or deceived; “led astray” preserves the sense of being drawn into error.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 바리새인들이 그들에게 대답했습니다. 「너희도 길을 잘못 들었느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희도 속은 것이냐?”로 옮길 수 있습니다. πλανάω는 ‘길을 잘못 들다/미혹되다/속다’의 의미 폭을 가지며, 여기서는 잘못된 판단으로 이끌려 들어간 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  english_pob_choice: So ... answered
  chosen_korean: 그러자 ... 대답했습니다
  alternatives_korean:
  - 이에 ... 대답했습니다
  - 그래서 ... 대답했습니다
  lexicon: BDAG
  rationale: οὖν의 전개감을 자연스러운 담화 연결어 ‘그러자’로 살리고, ἀπεκρίθησαν은 대화 서술에서 가장 직접적인 ‘대답했습니다’로 옮겼습니다.
- source_word: οἱ Φαρισαῖοι
  english_pob_choice: the Pharisees
  chosen_korean: 바리새인들이
  alternatives_korean:
  - 바리새파 사람들이
  - 바리새인들은
  lexicon: BDAG
  rationale: 신약에서 표준화된 집단명으로서 ‘바리새인들’이 가장 자연스럽고 식별성이 높습니다.
- source_word: Μὴ καὶ ὑμεῖς
  english_pob_choice: Have you also
  chosen_korean: 너희도 ...느냐
  alternatives_korean:
  - 너희도 ...였느냐
  - 설마 너희도 ...느냐
  lexicon: BDAG
  rationale: μή로 시작하는 의문문이 부정 기대를 담는 점을 한국어의 반문형으로 살렸고, καί의 ‘also/even’은 주어 뒤의 ‘도’로 반영했습니다.
- source_word: πεπλάνησθε
  english_pob_choice: been led astray
  chosen_korean: 길을 잘못 들었느냐
  alternatives_korean:
  - 속은 것이냐
  - 미혹된 것이냐
  lexicon: BDAG
  rationale: πλανάω의 ‘잘못 이끌리다/잘못 가다’라는 의미를 살리면서, 단순 정보 오류보다 종교적·윤리적 ‘오류로 빠짐’의 뉘앙스를 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 조롱 섞인 반문의 어조
  chosen_reading: 정말 너희까지도 잘못된 길에 들어섰느냐는 경멸 섞인 반문으로 옮겼습니다.
  alternative_readings:
  - 단순 질문으로 중립적으로 옮길 수 있음
  - ‘혹시 너희도 속았느냐’로 더 직접적인 비난을 드러낼 수 있음
  rationale: μή-의문문의 기대되는 부정 답변과 바리새인들의 반문적 조롱을 살리되, 본문에 없는 강조어를 덧붙이지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; rhetorical force without paraphrase.'
