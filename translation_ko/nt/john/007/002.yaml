lexical_decisions:
- source_word: ἦν δὲ
  english_pob_choice: Now
  chosen_korean: 그때
  alternatives_korean:
  - 그리고
  - 이제
  - 그러나
  lexicon: SBLGNT
  rationale: δὲ는 서술의 흐름을 잇는 약한 전환이므로, 문맥상 자연스럽게 시간 전환을 드러내는 ‘그때’로 옮겼습니다.
- source_word: ἐγγὺς
  english_pob_choice: was near
  chosen_korean: 가까웠습니다
  alternatives_korean:
  - 임박했습니다
  - 곧 다가왔습니다
  - 가까이 있었습니다
  lexicon: BDAG
  rationale: 절기 시점의 시간적 근접을 현대 한국어에서 가장 자연스럽게 나타내는 표현으로 옮겼습니다.
- source_word: ἡ ἑορτὴ τῶν Ἰουδαίων
  english_pob_choice: the Jewish feast
  chosen_korean: 유대인의 명절
  alternatives_korean:
  - 유대인의 절기
  - 유대인의 축제
  - 유대교의 명절
  lexicon: BDAG
  rationale: ἑορτή는 종교적 기념일/축제를 가리키므로 ‘명절’로 번역하고, τῶν Ἰουδαίων은 문맥상 소유·소속을 나타내어 ‘유대인의’로 옮겼습니다.
- source_word: ἡ σκηνοπηγία
  english_pob_choice: the Feast of Tabernacles
  chosen_korean: 초막절
  alternatives_korean:
  - 장막절
  - 초막 축제
  - 초막들의 절기
  lexicon: BDAG
  rationale: 한국 교회·학술 용례에서 널리 통용되는 절기명인 ‘초막절’을 본문에 두되, 더 문자적인 대응을 위한 대안은 주석으로 남길 수 있습니다.
theological_decisions:
- issue: τῶν Ἰουδαίων의 처리
  chosen_reading: 유대인의
  alternative_readings:
  - 유대인들의
  - 유대교의
  rationale: 여기서는 폄하적 표현이 아니라 절기의 소속을 표시하는 수식이므로, 문맥에 맞는 중립적 소유 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 절기명 σκηνοπηγία의 번역 전략
  chosen_reading: 초막절
  alternative_readings:
  - 장막절
  - 초막들의 절기
  rationale: 본문에는 관용적으로 알려진 절기명을 사용해 가독성을 확보하고, 더 직역적인 표현은 필요 시 주석으로 보완하는 방식이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
