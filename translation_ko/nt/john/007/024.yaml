  source_fidelity: 개정이 필요합니다. κατ’ ὄψιν은 사람의 신체적 ‘외모’에 한정되기보다 겉으로 드러나는 모습이나 표면적 인상에 근거함을 뜻합니다. ‘겉모습을 따라’가 이 범위를 더 충실히 보존합니다. τὴν δικαίαν κρίσιν은 목적어이므로 ‘의로운 판단을 하십시오’가 원문의 명령과 명사구를 자연스럽게 반영합니다.
