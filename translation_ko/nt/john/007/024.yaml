  terminology: κρίνω/κρίσις의 연관성은 ‘판단하지 말고’와 ‘판단을 하십시오’로 충분히 드러납니다. δικαίαν은 문맥상 ‘의로운’으로 유지할 수 있으며, 이를 단지 법적 절차상의 공정성으로 축소하지 않습니다.
