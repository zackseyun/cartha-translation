translation:
  language: ko
  text: 외모로 판단하지 말고, 의로운 판단으로 판단하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “겉모습으로 판단하지 말고, 의로운 판단으로 판단하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κρίνετε
  english_pob_choice: Do not judge
  chosen_korean: 판단하지 말고
  alternatives_korean:
  - 심판하지 말고
  - 재단하지 말고
  lexicon: BDAG
  rationale: 금지 명령의 직접성을 살리되, 한국어에서는 같은 어근을 두 번 반복하는 구성으로 'judge'를 자연스럽게 옮길 수 있어 뒤의 κρίσιν과의 병행을 유지했습니다.
- source_word: κατ’ ὄψιν
  english_pob_choice: according to appearances
  chosen_korean: 외모로
  alternatives_korean:
  - 겉모습으로
  - 겉으로 보이는 대로
  - 외형상으로
  lexicon: BDAG
  rationale: ὄψις는 겉으로 드러나는 모습, 외관을 가리키므로 한국어에서는 간결하게 '외모로'가 가장 자연스럽고 표면적 판단의 의미를 잘 살립니다.
- source_word: τὴν δικαίαν κρίσιν
  english_pob_choice: with righteous judgment
  chosen_korean: 의로운 판단으로
  alternatives_korean:
  - 의로운 심판으로
  - 공의로운 판단으로
  - 옳은 판단으로
  lexicon: BDAG
  rationale: δικαίαν은 윤리적·정당성의 뉘앙스를 지니므로 '의로운'이 '공정한'보다 원문의 도덕적 색채를 더 잘 보존합니다. κρίσις는 여기서 '판단'으로 옮겨 동사의 반복과 자연스러운 한국어를 함께 살렸습니다.
- source_word: κρίνετε
  english_pob_choice: judge
  chosen_korean: 판단하십시오
  alternatives_korean:
  - 심판하십시오
  - 재단하십시오
  lexicon: BDAG
  rationale: 반복되는 κρίνετε를 한국어에서도 동일 어근으로 재현해 대조 구조를 분명하게 했습니다. 두 번째 절의 '판단'은 행위 기준을 가리키는 명령으로 자연스럽습니다.
theological_decisions:
- issue: δικαίαν의 윤리적-법적 색채
  chosen_reading: 의로운
  alternative_readings:
  - 공의로운
  - 옳은
  rationale: 이 문맥은 단순한 절차적 공정성보다 하나님의 뜻에 합치되는 올바름을 요구하므로 '의로운'이 원문의 اخلاق적 힘을 더 직접적으로 드러냅니다.
  doctrine_reference: translation philosophy §5
