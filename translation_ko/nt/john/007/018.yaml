id: JHN.7.18
reference: John 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
  footnotes:
  - marker: a
    text: Or 'on his own' or 'from his own authority' for 'from himself.'
    reason: lexical_alternative
  - marker: b
    text: Or 'truthful' for 'true.'
    reason: lexical_alternative
  - marker: c
    text: Or 'injustice' or 'wrongdoing' for 'unrighteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스스로 말하는 사람은 자기의 영광을 구합니다[a]. 그러나 그를 보낸 이의 영광을 구하는 사람은 참되며[b], 그에게는 불의가 없습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 뜻대로’ 혹은 ‘자기 권위로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진실한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘불의함’이나 ‘부정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  english_pob_choice: from himself
  chosen_korean: 스스로
  alternatives_korean:
  - 자기에게서
  - 자기 힘으로
  - 자기 권위로
  lexicon: BDAG
  rationale: 직역형인 ‘자기에게서’도 가능하지만, 여기서는 ‘from himself’의 자기 기원·자기주도성을 한국어로 자연스럽게 살리는 ‘스스로’가 본문 대조를 선명하게 보존합니다.
- source_word: τὴν δόξαν τὴν ἰδίαν
  english_pob_choice: his own glory
  chosen_korean: 자기의 영광
  alternatives_korean:
  - 자기 영광
  - 자기 명예
  - 자기 존귀
  lexicon: BDAG
  rationale: δόξα는 요한복음에서 하나님의 영광/사람의 영광을 아우르는 핵심어이므로, 전통적 교회어를 유지하되 소유 대조를 분명히 하는 ‘자기의 영광’으로 옮겼습니다.
- source_word: τοῦ πέμψαντος αὐτὸν
  english_pob_choice: of the one who sent him
  chosen_korean: 자신을 보낸 이
  alternatives_korean:
  - 그를 보낸 이
  - 그를 보내신 분
  - 그의 보낸 자
  lexicon: BDAG
  rationale: 아전트적 분사구를 ‘보낸 이’로 옮겨 파송 관계를 직접 드러내고, 문맥상 예수의 파송을 자연스럽게 유지했습니다.
- source_word: ἀληθής
  english_pob_choice: 'true'
  chosen_korean: 참된
  alternatives_korean:
  - 진실한
  - 진짜인
  - 진정한
  lexicon: BDAG
  rationale: 문맥상 말의 진실성만이 아니라 인격과 존재의 신뢰성을 함께 가리키므로, 한국어에서 그 폭을 비교적 넓게 담는 ‘참된’이 적절합니다.
- source_word: ἀδικία
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불의함
  - 부정
  - 불법
  lexicon: BDAG
  rationale: ἀδικία를 윤리적·신학적 차원에서 그대로 드러내는 표준적인 대응어로 ‘불의’를 택했고, ‘부정’보다 본문의 도덕적 평가를 더 분명히 합니다.
theological_decisions:
- issue: ‘스스로 말하는’과 ‘자신을 보낸 이의 영광을 구하는’의 대조
  chosen_reading: 자기 출처·자기 영광을 추구하는 말과, 보낸 이의 영광에 맞추는 말을 대조하는 구조로 옮겼습니다.
  alternative_readings:
  - ‘자기 권위로 말하는’
  - ‘혼자서 말하는’
  rationale: 본문은 말의 권위와 방향을 대조하지만, 한국어 본문에 없는 설명을 덧붙이지 않고 원문의 긴장을 유지하는 것이 더 적합합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: ἀληθής의 번역
  chosen_reading: ‘참된 사람’으로 옮겨, 단순히 말이 맞다는 뜻을 넘어 그 사람의 진실성과 신뢰성을 함께 담았습니다.
  alternative_readings:
  - ‘진실한 사람’
  - ‘진짜인 사람’
  rationale: 문맥상 예수의 말과 삶의 일치, 그리고 그분의 신뢰 가능성을 함께 평가하는 진술이므로, 한국어에서 과도하게 축소되지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5
