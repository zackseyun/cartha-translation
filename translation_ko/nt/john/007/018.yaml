  source_fidelity: 첫 절의 ‘스스로 말하는’은 ἀφ’ ἑαυτοῦ의 자기 기원·자기 권위의 뉘앙스를 자연스럽게 보존합니다. 그러나 ‘자신을 보낸 이’는 한국어 재귀 대명사의 통상적 지시상 그 사람이 자기 자신을 보냈다는 뜻으로 읽히므로, αὐτόν(그를)을 정확히 반영하지 못합니다.
  naturalness: ‘그를 보낸 이’로 고치면 지시 관계가 명료합니다. 또한 술어를 ‘참되며’로 처리하면 ‘참된 사람’보다 간결하고 원문의 인물에 대한 서술을 자연스럽게 살립니다.
