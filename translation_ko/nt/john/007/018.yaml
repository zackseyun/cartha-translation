  to: 스스로 말하는 사람은 자기의 영광을 구합니다[a]. 그러나 그를 보낸 이의 영광을 구하는 사람은 참되며[b], 그에게는 불의가 없습니다[c].
  rationale: ‘자신’을 ‘그’로 고쳐 원문의 대명사 지시를 정확히 했습니다. 이어지는 술어도 ‘참되며’로 조정하여 ἀληθής의 인격적 신뢰성과 원문의 병렬 술어 구조를 자연스럽게 보존했습니다. 나머지 핵심 용어와 각주 표지는 유지했습니다.
