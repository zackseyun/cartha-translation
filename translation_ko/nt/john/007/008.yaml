id: JHN.7.8
reference: John 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
  footnotes:
  - marker: a
    text: Some manuscripts read, 'I am not yet going up to this feast.'
    reason: textual_variant
  - marker: b
    text: Or 'my appointed time has not yet been fulfilled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 절기[a]에 올라가십시오. 나는 이 절기[b]에 올라가지 않겠습니다. 내 때가 아직 다 이루어지지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 몇몇 사본은 ‘나는 이 절기에 아직 올라가지 않겠습니다’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘내 정해진 때가 아직 이루어지지 않았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε / ἀναβαίνω
  english_pob_choice: go up / am not going up
  chosen_korean: 올라가십시오 / 올라가지 않겠습니다
  alternatives_korean:
  - 가십시오 / 가지 않겠습니다
  - 올라가세요 / 올라가지 않겠어요
  lexicon: SBLGNT / BDAG
  rationale: 절기와 예루살렘 순례의 방향성을 살려 ‘올라가다’를 유지했습니다. 명령형과 부정형도 같은 동사를 맞춰 반복 구조를 살렸습니다.
- source_word: ἑορτή
  english_pob_choice: feast
  chosen_korean: 절기
  alternatives_korean:
  - 명절
  - 축제
  lexicon: BDAG
  rationale: 요한복음의 유대 절기 문맥에서는 ‘절기’가 가장 자연스럽고, 단순한 종교행사가 아니라 정해진 경축일이라는 뜻도 잘 드러냅니다.
- source_word: καιρός
  english_pob_choice: time
  chosen_korean: 때
  alternatives_korean:
  - 시간
  - 정해진 때
  - 적절한 때
  lexicon: BDAG
  rationale: 문맥상 단순한 시간보다 예수님의 사역과 연결된 정해진 시점을 가리키므로, 간결하게 ‘때’로 옮겼습니다.
- source_word: πεπλήρωται
  english_pob_choice: has not yet come to fulfillment
  chosen_korean: 아직 다 이루어지지 않았습니다
  alternatives_korean:
  - 아직 충만해지지 않았습니다
  - 아직 성취되지 않았습니다
  - 아직 완전히 이루어지지 않았습니다
  lexicon: BDAG
  rationale: 완료된 상태를 나타내는 동사를 한국어에서도 결과 상태로 살려, 단순히 ‘오지 않았다’보다 ‘이루어지지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 부정 표현과 사본 변이
  chosen_reading: 본문은 SBLGNT의 οὐκ을 따라 ‘나는 이 절기에 올라가지 않겠습니다’로 두고, 사본 변이로 인한 ‘아직’의 가능성은 각주로 보완했습니다.
  alternative_readings:
  - 나는 아직 이 절기에 올라가지 않겠습니다
  rationale: 본문 자체의 읽기를 흐리지 않으면서, 예수님의 뒤이어 나타나는 방문과의 긴장을 주석으로 투명하게 보존하기 위함입니다.
  doctrine_reference: '번역 원칙: 본문 읽기를 우선하되, 중요한 변이는 각주로 보존하여 해석상의 긴장을 유지한다.'
