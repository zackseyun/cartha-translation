revisions:
- from: 당신들은 절기[a]에 올라가십시오. 나는 이 절기[b]에 올라가지 않겠습니다. 내 때가 아직 다 이루어지지 않았기 때문입니다.
  to: 여러분은 절기에 올라가십시오. 나는 이 절기에 올라가지 않습니다[a]. 내 때[b]가 아직 이루어지지 않았기 때문입니다.
  rationale: 각주 표지를 각각 사본 변이가 있는 부정 동사구와 어휘 대안이 있는 ‘내 때’로 바로잡았습니다. 원문의 현재형을 ‘올라가지 않습니다’로 옮기고, πεπλήρωται의 완료된 결과 상태는 ‘아직 이루어지지 않았습니다’로 유지했습니다. 본문의 οὐκ를 따라 ‘아직’은 본문에 추가하지 않고 사본 변이 각주에만 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:08Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 οὐκ(‘아니다’)와 οὔπω(‘아직 아니다’) 사본 변이를 구별하려는 방향은 적절합니다. 다만 현재 각주 표지가 해당 단어·구절에 연결되어 있지 않아, 본문 비평 및 어휘 대안의 근거가 독자에게 잘못 연결됩니다. 또한 ἀναβαίνω의 현재형은 한국어에서 ‘올라가지 않습니다’가 ‘올라가지 않겠습니다’보다 더 직접적으로 보존합니다.
  naturalness: ‘여러분은 … 올라가십시오’와 ‘내 때’는 표준어 합쇼체에서 자연스럽습니다. ‘아직 이루어지지 않았습니다’는 불필요한 ‘다’를 빼면 더 간결하고 자연스럽게 완료 수동의 결과 상태를 표현합니다.
  terminology: ἑορτή를 ‘절기’, καιρός를 ‘때’로 옮긴 것은 요한복음 문맥에 적절합니다. ‘정해진 때’는 본문이 아니라 어휘 대안 각주에 두는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 사본 변이 각주 [a]의 표지가 첫 ‘절기’에 붙어 있습니다.
    rationale: 각주는 δεύτε 번째 문장의 οὐκ/οὔπω 변이, 곧 ‘올라가지 않습니다/아직 올라가지 않습니다’에 관한 것입니다. 해당 부정 동사구에 표지를 붙여야 합니다.
  - severity: medium
    issue: 어휘 대안 각주 [b]의 표지가 두 번째 ‘절기’에 붙어 있습니다.
    rationale: 각주는 καιρός, 즉 ‘내 때’의 대안 번역에 관한 것이므로 ‘내 때’에 표지를 옮겨야 합니다.
  - severity: low
    issue: ‘올라가지 않겠습니다’는 원문의 현재형보다 미래의 의지·결정으로 들릴 수 있습니다.
    rationale: SBLGNT 본문의 οὐκ ἀναβαίνω는 현재형이므로 ‘올라가지 않습니다’가 본문의 표현을 더 직접적으로 보존하며, ‘아직’도 본문에 넣지 않습니다.
  revised_text: 여러분은 절기에 올라가십시오. 나는 이 절기에 올라가지 않습니다[a]. 내 때[b]가 아직 이루어지지 않았기 때문입니다.
  revised_footnotes:
