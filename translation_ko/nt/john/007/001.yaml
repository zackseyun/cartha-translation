id: JHN.7.1
reference: John 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
  footnotes:
  - marker: a
    text: Or 'the Judeans' or 'the Jewish leaders.' In John, 'the Jews' often refers more specifically to the Judean Jewish authorities or opposition in the narrative context, not to the Jewish people as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일들 뒤에 예수님께서는 갈릴리에서 활동하고 계셨습니다. 유대인들이[a] 그분을 죽이려고 하고 있었기 때문에, 예수님께서는 유대에서 활동하기를 원하지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들’ 혹은 ‘유대 지도자들’. 요한복음에서 ‘유대인들’은 문맥에 따라 유대의 반대 세력, 특히 지도층을 더 구체적으로 가리킬 때가 있습니다. 이는 유대 민족 전체를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after these things
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 이 일들 후에
  - 그 일들 뒤에
  lexicon: BDAG
  rationale: 복수 지시어의 연결감을 유지하면서도 한국어 문장 흐름이 자연스럽게 이어지도록 했습니다.
- source_word: περιεπάτει
  english_pob_choice: was walking
  chosen_korean: 다니셨습니다
  alternatives_korean:
  - 걷고 계셨습니다
  - 돌아다니셨습니다
  lexicon: BDAG
  rationale: 완료가 아닌 미완료의 지속성을 살리되, 갈릴리라는 지역 안에서의 계속적인 활동을 한국어로 자연스럽게 나타냈습니다.
- source_word: ἐν τῇ Γαλιλαίᾳ
  english_pob_choice: in Galilee
  chosen_korean: 갈릴리에서
  alternatives_korean:
  - 갈릴리 안에서
  - 갈릴리 전역에서
  lexicon: BDAG
  rationale: 지리적 위치를 과장하지 않고 기본적인 장소 표지를 그대로 옮겼습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들이
  alternatives_korean:
  - 유대 사람들이
  - 유대 지도자들이
  lexicon: BDAG
  rationale: 본문의 직접 표지를 유지하되, 요한복음의 문맥상 특정한 대립 집단으로 읽힐 수 있는 긴장을 살렸습니다. 영어 POB의 각주는 한국어 본문을 바꾸지 않고도 같은 맥락 설명을 뒷받침합니다.
theological_decisions:
- issue: 요한복음에서 '유대인들'의 지시 대상
  chosen_reading: 본문에는 '유대인들'을 유지하고, 각주로 이 표현이 문맥상 유대의 반대 세력, 특히 지도층을 가리킬 수 있음을 알렸습니다.
  alternative_readings:
  - 유대 지도자들이
  - 유대 사람들은
  rationale: 원문 표현을 지우지 않으면서도 민족 전체에 대한 일반화로 오해되지 않도록 했습니다. 이는 원문 우선성과 문맥적 정밀성을 함께 지키는 방식입니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
