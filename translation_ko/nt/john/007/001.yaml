revisions:
- from: 그 뒤에 예수님께서는 갈릴리에서 다니셨습니다[a]. 유대에서 다니기를 원하지 않으셨는데, 유대인들이 그분을 죽이려고 찾고 있었기 때문입니다.
  to: 그 일들 뒤에 예수님께서는 갈릴리에서 활동하고 계셨습니다. 유대인들이[a] 그분을 죽이려고 하고 있었기 때문에, 예수님께서는 유대에서 활동하기를 원하지 않으셨습니다.
  rationale: ‘그 일들 뒤에’는 μετὰ ταῦτα의 복수 지시어를 보존했습니다. 두 περιπατέω는 한국어에서 자연스러운 ‘활동하고 계셨습니다/활동하기’로 옮겨 지역 내 지속적 활동이라는 문맥상 의미를 유지했습니다. ἐζήτουν ... ἀποκτεῖναι는 ‘죽이려고 하고 있었다’로 옮겨 지속적인 살해 의도를 정확히 나타냈습니다. 또한 ‘유대인들’의 문맥적 지시 대상에 관한 각주를 올바른 본문어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:05Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. ἐζήτουν αὐτὸν ἀποκτεῖναι는 그분을 죽이려는 지속적인 의도를 뜻하므로, ‘그분을 죽이려고 찾고 있었다’는 ‘죽이기 위해 그분의 소재를 찾았다’는 뜻으로 좁혀질 수 있습니다. 또한 각주는 οἱ Ἰουδαῖοι에 관한 것이므로 해당 표현에 붙어야 합니다.
  naturalness: ‘갈릴리에서 다니셨습니다’와 ‘유대에서 다니기를’은 반복을 보존하려는 의도는 이해되지만 현대 표준 한국어에서는 다소 부자연스럽습니다. ‘갈릴리에서 활동하고 계셨습니다’와 ‘유대에서 활동하기를’은 미완료의 지속성과 지역 내 활동이라는 뜻을 자연스럽게 전달합니다.
  terminology: ‘유대인들’을 본문에 유지하고, 문맥상 유대의 반대 세력 및 특히 지도층을 가리킬 수 있다는 각주를 두는 것은 원문 및 영어 POB 감사 기록에 부합합니다. 다만 각주 표지는 ‘유대인들’에 연결해야 합니다.
  issues:
  - severity: medium
    issue: ‘죽이려고 찾고 있었다’의 의미가 부정확하거나 불필요하게 좁아질 수 있습니다.
    rationale: ζητέω + 부정사는 ‘~하려고 하다/꾀하다’라는 지속적 적대 의도를 나타냅니다. 한국어 ‘찾다’는 대상의 소재를 수색한다는 의미를 강하게 유발합니다.
  - severity: medium
    issue: 각주 표지가 ‘갈릴리’에 붙어 있습니다.
    rationale: 각주의 내용은 ‘유대인들’(οἱ Ἰουδαῖοι)의 지시 범위에 관한 것이므로 해당 단어에 표지를 붙여야 독자가 각주의 대상을 정확히 알 수 있습니다.
  - severity: low
    issue: ‘다니셨습니다/다니기를’의 반복이 현대 한국어에서 다소 어색합니다.
    rationale: 원문의 περιπατέω 반복을 기계적으로 재현하기보다, 지역 안에서 계속 활동한다는 문맥적 의미와 미완료상을 자연스럽게 옮기는 편이 안전합니다.
  revised_text: 그 일들 뒤에 예수님께서는 갈릴리에서 활동하고 계셨습니다. 유대인들이[a] 그분을 죽이려고 하고 있었기 때문에, 예수님께서는 유대에서 활동하기를 원하지 않으셨습니다.
