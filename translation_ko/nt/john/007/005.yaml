  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
  footnotes:
  - marker: a
    text: Or 'For not even his brothers were believing in him.' The Greek imperfect verb can be rendered as a simple past ('believed') or as ongoing past action ('were believing').
