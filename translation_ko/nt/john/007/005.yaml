translation:
  language: ko
  text: 그러나 그 형제들조차도 그분을 믿지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 미완료 시제는 ‘믿고 있지 않았습니다’처럼 지속적 과거로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γάρ
  english_pob_choice: For not even
  chosen_korean: 그러나 …조차도
  alternatives_korean:
  - 그리고 심지어는
  - 그런데도
  lexicon: BDAG
  rationale: οὐδὲ의 강조와 γὰρ의 앞문맥 연결을 함께 살려, 문맥상 대조를 자연스럽게 드러내는 ‘그러나 …조차도’로 옮겼습니다.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  english_pob_choice: his brothers
  chosen_korean: 그분의 형제들
  alternatives_korean:
  - 그의 형제들
  - 그분의 형제들까지
  lexicon: BDAG
  rationale: 문맥상 예수의 남자 형제들을 가리키므로 ‘형제들’로 옮기되, 한국어 문체에서는 인칭 대명사보다 ‘그분’을 사용해 지시를 분명히 했습니다.
- source_word: ἐπίστευον
  english_pob_choice: believed / were believing
  chosen_korean: 믿지 않았습니다
  alternatives_korean:
  - 믿고 있지 않았습니다
  - 계속 믿고 있지 않았습니다
  lexicon: BDAG
  rationale: 미완료 시제의 지속성은 살릴 수 있지만, 한국어에서는 부정 과거형으로도 그 상태의 지속을 충분히 드러낼 수 있어 가장 자연스러운 표현을 택했습니다.
- source_word: εἰς αὐτόν
  english_pob_choice: in him
  chosen_korean: 그분을
  alternatives_korean:
  - 그분 안에서
  - 그분에게
  lexicon: BDAG
  rationale: πιστεύω + εἰς는 단순한 지적 동의가 아니라 인격적 신뢰의 방향을 나타내므로, 한국어에서는 표준적으로 ‘믿다’의 목적어 구조로 옮겼습니다.
theological_decisions:
- issue: John의 πιστεύω εἰς 사용을 한국어에서 어떻게 드러낼지
  chosen_reading: 예수에 대한 인격적 신뢰/믿음의 부재를 말합니다.
  alternative_readings:
  - 예수에 대한 신앙이 없었습니다
  - 예수를 신뢰하지 않았습니다
  rationale: 요한복음의 πιστεύω εἰς는 단순 동의가 아니라 예수께 향하는 믿음을 뜻하므로, 본문이 말하는 거부를 과장하지 않으면서도 그 의미를 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
