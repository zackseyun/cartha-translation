  source_fidelity: 그리스어의 미완료 과거(Ἔλεγον), 예루살렘 주민들 가운데 일부(τινες ἐκ τῶν Ἱεροσολυμιτῶν), 그리고 긍정의 답을 예상하는 부정 의문문을 대체로 충실히 반영했습니다. 다만 ‘그러므로’는 οὖν의 문맥 연결을 다소 강한 논리적 귀결로 만들 수 있어 더 중립적인 ‘그래서’가 적절합니다.
  naturalness: ‘그들이 죽이려고 찾는 바로 그 사람’은 ‘이 사람이’와 결합될 때 지시어와 ‘사람’이 중복되어 다소 무겁습니다. ‘이 사람이 그들이 죽이려고 찾는 사람이 아닙니까?’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 원문의 의미도 보존합니다.
  terminology: ‘예루살렘 사람들’은 Ἱεροσολυμίται를 자연스럽게 옮깁니다. ‘죽이려고 찾는’은 죽일 목적으로 찾는다는 ζητοῦσιν ἀποκτεῖναι의 표현을 유지하며, 단순히 ‘죽이려 하는’으로 약화하지 않았습니다.
