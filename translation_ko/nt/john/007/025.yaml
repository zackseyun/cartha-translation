lexical_decisions:
- source_word: Ἔλεγον
  english_pob_choice: were saying
  chosen_korean: 말하고 있었습니다
  alternatives_korean:
  - 말했습니다
  - 이야기하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 과거의 반복·진행되는 발화를 살리기 위해 단순 과거보다 진행형을 선택했습니다.
- source_word: ἐκ τῶν Ἱεροσολυμιτῶν
  english_pob_choice: of the people of Jerusalem
  chosen_korean: 예루살렘 사람들 가운데
  alternatives_korean:
  - 예루살렘 사람들 중에서
  - 예루살렘 주민들 가운데
  - 예루살렘 사람들로부터
  lexicon: BDAG
  rationale: Ἱεροσολυμίτης는 예루살렘의 주민을 가리키므로, 출신/집단 안에서 나온 일부라는 뉘앙스를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: Οὐχ οὗτός ἐστιν
  english_pob_choice: Is this not the man
  chosen_korean: 이 사람이 ... 아닙니까?
  alternatives_korean:
  - 이 사람이 ... 아닙니까
  - 이 사람이 바로 ... 아닙니까?
  lexicon: BDAG
  rationale: 부정 의문문의 기대 답변을 살리되, 현대 한국어에서 가장 자연스러운 확인 질문 형태로 옮겼습니다.
- source_word: ὃν ζητοῦσιν ἀποκτεῖναι
  english_pob_choice: the man they are seeking to kill
  chosen_korean: 그들이 죽이려고 찾는 바로 그 사람
  alternatives_korean:
  - 그들이 죽이려 하는 사람
  - 그들이 죽이려고 찾는 사람
  lexicon: BDAG
  rationale: ζητοῦσιν의 ‘찾다/구하다’와 ἀποκτεῖναι의 ‘죽이다’를 분리해, 단순히 ‘죽이려 한다’보다 원문의 동작 구조를 더 분명히 드러냈습니다.
