  rationale: 문맥상 화자들은 예수의 신원을 두고 놀라움과 암시를 담아 말하고 있으며, 한국어에서도 반문형으로 그 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 요한복음 7장의 공개 논쟁 문맥
