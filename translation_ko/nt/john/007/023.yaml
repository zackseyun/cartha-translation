- from: 사람이 안식일에 할례를 받아 모세의 율법이 어겨지지 않게 하면서도, 내가 안식일에 사람 전체를 온전하게 해 주었다고 해서 너희가 나에게 화를 냅니까?[a][b][c]
  to: 한 남자가 안식일에 할례를 받는 것이 모세의 율법이 어겨지지 않게 하려는 것이라면, 내가 안식일에 한 사람을 온전히 낫게 하였다고 해서 너희가 내게 화를 냅니까?[a][b][c]
  rationale: The revision more precisely represents the male individual assumed by circumcision, makes the conditional-purpose syntax explicit, and renders ὑγιῆ ἐποίησα with an unambiguous Korean healing expression. It preserves the rhetorical contrast between a partial bodily rite and restoring an entire person, without adding doctrinal conclusions.
