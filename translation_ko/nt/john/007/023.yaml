id: JHN.7.23
reference: John 7:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
  footnotes:
  - marker: a
    text: Or 'is circumcised' for 'receives circumcision.' The Greek idiom is literally 'receives circumcision.'
    reason: lexical_alternative
  - marker: b
    text: Or 'may not be set aside' or 'may not be annulled' for 'may not be broken.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'a whole man well' highlights Jesus' contrast between circumcising one part of the body and restoring the entire man.
    reason: cross_reference
translation:
  language: ko
  text: 사람이 안식일에 할례를 받아 모세의 율법이 어겨지지 않게 하면서도, 내가 안식일에 사람 전체를 온전하게 해 주었다고 해서 너희가 나에게 화를 냅니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘할례를 받다’ 대신 ‘할례를 당하다’로 볼 수 있습니다. 헬라어 관용구는 문자적으로 ‘할례를 받다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어겨지지 않게’ 대신 ‘폐지되지 않게’나 ‘무효화되지 않게’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘사람 전체’는 한 부분만이 아니라 온 사람을 회복시키는 예수님의 대비를 살린 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  english_pob_choice: receives circumcision
  chosen_korean: 할례를 받다
  alternatives_korean:
  - 할례를 받다(직역)
  - 할례를 시행받다
  lexicon: BDAG
  rationale: 헬라어 관용구의 수동적 의미를 한국어의 자연스러운 관용 표현인 ‘할례를 받다’로 옮겨, ‘받는다’는 동작성을 살리면서도 과도한 의역을 피했습니다.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  english_pob_choice: so that the law of Moses may not be broken
  chosen_korean: 모세의 율법이 어겨지지 않게
  alternatives_korean:
  - 모세의 율법이 깨지지 않게
  - 모세의 율법이 폐지되지 않게
  lexicon: BDAG
  rationale: λύω의 법적 문맥을 고려하되 한국어에서는 ‘어기다’가 법을 위반하지 않도록 지키는 뜻을 가장 직접적으로 드러내므로, ‘broken’의 의미를 자연스럽게 전달합니다.
- source_word: ὅλον ἄνθρωπον
  english_pob_choice: a whole man
  chosen_korean: 사람 전체
  alternatives_korean:
  - 온전한 사람
  - 한 사람 전체
  lexicon: BDAG
  rationale: 문맥상 할례의 ‘한 부분’과 대비되는 표현이므로, ‘사람 전체’로 옮겨 예수님의 아전인수적 대비를 유지했습니다.
- source_word: ὑγιῆ ἐποίησα
  english_pob_choice: I made ... well
  chosen_korean: 온전하게 해 주었다
  alternatives_korean:
  - 건강하게 해 주었다
  - 낫게 해 주었다
  lexicon: BDAG
  rationale: 직역된 ‘건강하게 만들다’보다 한국어에서 문맥상 더 자연스럽고, 신체 일부가 아니라 사람 전체를 회복시키는 대비를 살릴 수 있어 ‘온전하게 해 주었다’로 옮겼습니다.
theological_decisions:
- issue: 안식일 할례와 안식일 치유의 대비
  chosen_reading: 예수님은 안식일 할례가 모세의 율법을 어기지 않기 위한 정당한 관행이라면, 안식일에 사람 전체를 회복시키는 일은 더더욱 정당하다고 논증하십니다.
  alternative_readings:
  - 율법과 자비 행위를 일반적으로 대조하시는 말씀
  - 유대 전통 전체를 비판하시는 말씀
  rationale: 본문의 수사 구조는 이미 인정된 안식일 할례 관행에서 더 큰 행위의 정당성을 이끌어 내는 아폴리오리(a fortiori) 논증입니다. 번역은 이 논리를 유지하고, 율법 자체를 단순 폐기하는 방향으로 오해되지 않게 했습니다.
  doctrine_reference: source primacy; preserve theological tension
