base_translation:
  language: en
  yaml_path: translation/nt/john/007/053.yaml
  text: And[a] each went to his own home.
  footnotes:
  - marker: a
    text: This verse begins the story of the woman caught in adultery (John 7:53–8:11). The entire passage is absent from the earliest Greek manuscripts (including 3rd-century papyri and the 4th-century Sinaiticus and Vaticanus) as well as early Coptic and Syriac translations. It is present in the 5th-century Codex Bezae, the Latin tradition, and the later Byzantine majority tradition. In some manuscripts, the story floats to different positions (such as after John 21:25 or Luke 21:38)—clear evidence of an originally independent oral tradition incorporated into the textual stream. It is preserved here due to its theological and pastoral belovedness across 1500 years of Christian reading.
    reason: textual_critical
translation:
  language: ko
  text: 그리고 각 사람은 자기 집으로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 간음하다 붙잡힌 여인 이야기(요 7:53–8:11)의 시작입니다. 이 단락 전체는 가장 이른 그리스어 사본들(3세기 파피루스들과 4세기 시내 사본, 바티칸 사본 포함)과 초기 콥트어·시리아어 번역본들에는 없고, 5세기 베자 사본, 라틴 전승, 후대 비잔틴 다수 본문 전통에는 있습니다. 일부 사본에서는 이 이야기가 요 21:25 뒤나 눅 21:38 뒤 등 여러 위치로 이동해 전해지기도 하는데, 이는 원래 독립된 구전 전승이 본문 전승에 편입되었음을 보여 줍니다. 다만 1500년 동안 그리스도교 독서 전통에서 사랑받아 온 점을 고려하여 여기 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ ἐπορεύθη
  english_pob_choice: And ... went
  chosen_korean: 그리고 ... 갔습니다
  alternatives_korean:
  - 그리고 ... 떠났습니다
  - 그리고 ... 가 버렸습니다
  lexicon: BDAG
  rationale: ἐπορεύθη는 단순한 이동을 가리키므로, 문맥에 맞게 가장 자연스러운 ‘갔습니다’로 옮겼습니다.
- source_word: ἕκαστος
  english_pob_choice: each
  chosen_korean: 각 사람은
  alternatives_korean:
  - 각자
  - 모두
  - 저마다
  lexicon: BDAG
  rationale: 개별적으로 흩어졌다는 점을 살리기 위해 집합적 표현보다 개별성을 드러내는 ‘각 사람은’을 선택했습니다.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  english_pob_choice: to his own home
  chosen_korean: 자기 집으로
  alternatives_korean:
  - 자기 집안으로
  - 자기 집으로 돌아가
  lexicon: BDAG
  rationale: οἶκος는 문자적으로 ‘집’이지만, 영어 POB의 audit trail처럼 관용적으로 ‘home’의 의미이므로 한국어에서도 자연스러운 ‘자기 집으로’로 옮겼습니다.
theological_decisions:
- issue: 문맥상 이 절이 간음하다 붙잡힌 여인 이야기의 시작점이라는 점
  chosen_reading: 본문은 독립된 절로 번역하되, 내역은 주석 영역이 아니라 본문 자체에서는 드러내지 않았습니다.
  alternative_readings:
  - 이 절을 본문에 각주로 표시하여 본문비평 정보를 드러내는 방식
  - 본문을 약화시켜 부차적 표기로 처리하는 방식
  rationale: 이 구절 자체의 그리스어 문장 의미를 그대로 전달하는 것이 우선이며, 본문비평 정보는 별도의 주석 체계에서 다루는 것이 더 적절합니다.
  doctrine_reference: 본문비평 및 정경사 관련 일반 원칙
