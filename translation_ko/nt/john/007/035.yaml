id: JHN.7.35
reference: John 7:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
  footnotes:
  - marker: a
    text: Or “the Judeans.” The Greek term can denote Jews generally or, in some contexts, people from Judea.
    reason: lexical_alternative
  - marker: b
    text: “The dispersion among the Greeks” refers to Jewish people scattered among Greek-speaking populations, not to a dispersion made up of Greeks.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 유대인들이 서로 말했습니다. “이 사람이 어디로 가려는 것입니까? 우리가 그를 찾지 못하게 되겠군요. 그는 헬라인들 가운데 흩어진 이산민에게로 가서 헬라인들에게 가르치려는 것입니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대 사람들.” 헬라어 이 표현은 일반적으로 유대인을 가리키거나, 어떤 문맥에서는 유대 지역 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “헬라인들 가운데 흩어진 이산민”은 헬라어권 사람들 사이에 흩어져 사는 유대인들을 가리키며, 헬라인들 자체로 이루어진 흩어짐을 뜻하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 사람들
  - 유대 지역 사람들
  lexicon: BDAG
  rationale: 요한복음의 이 표현은 문맥상 집단적·민족적 지칭으로 읽히며, 영어 POB의 'the Jews'에 맞춰 한국어로는 가장 직접적인 대응인 '유대인들'을 택했습니다.
- source_word: πρὸς ἑαυτούς
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 서로에게
  - 자기들끼리
  lexicon: BDAG
  rationale: 상호 대화의 뉘앙스를 간결하게 살리기 위해 한국어 자연 표현인 '서로'를 사용했습니다.
- source_word: διασπορὰν τῶν Ἑλλήνων
  english_pob_choice: the dispersion among the Greeks
  chosen_korean: 헬라인들 가운데 흩어진 이산민
  alternatives_korean:
  - 헬라인들 가운데의 흩어짐
  - 헬라인들 사이의 디아스포라
  lexicon: BDAG
  rationale: διασπορά는 유대인들이 흩어져 사는 상태를 가리키므로 단순한 '흩어짐'보다 집단성을 드러내는 '이산민'을 택했고, τῶν Ἑλλήνων은 그 대상이 아니라 그들 '가운데'라는 위치 관계로 반영했습니다.
- source_word: Ἕλληνας
  english_pob_choice: the Greeks
  chosen_korean: 헬라인들
  alternatives_korean:
  - 그리스인들
  - 이방인들
  lexicon: BDAG
  rationale: 본문의 반복되는 Ἕλληνες/Ἕλληνας를 민족·문화적 의미의 '헬라인들'로 일관되게 옮겨, 의미를 넓혀 '이방인들'로 바꾸지 않았습니다.
theological_decisions:
- issue: Ἰουδαῖοι의 한국어 지칭 범위
  chosen_reading: 유대인들
  alternative_readings:
  - 유대 사람들
  - 유대 지역 사람들
  rationale: 이 절은 지역적 제한보다 집단 지칭이 더 자연스럽고, 본문이 실제로 말하는 범위를 좁히지 않기 위해 '유대인들'로 옮겼습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 긴장을 보존하는 번역
