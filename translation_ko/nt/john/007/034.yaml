  to: 너희는 나를 찾을 것이며, 찾지 못할 것이고, 내가 있는 곳에 너희는 올 수 없습니다.[a][b]
  rationale: The revision replaces an added adversative relation with Korean coordination corresponding to καί, while retaining future force, the repeated ‘find’ verb, and inability to come. Footnote b is adjusted so that it supplies a genuine Korean alternative rather than duplicating the main wording. The footnote anchors are retained.
