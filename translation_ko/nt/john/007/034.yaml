translation:
  language: ko
  text: 너희는 나를 찾겠으나 찾지 못할 것이며, 내가 있는 곳에 너희는 올 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: ‘너희는 나를 찾을 것이다.’'
    reason: alternative_reading
  - marker: b
    text: '또는: ‘너희는 올 수 없습니다.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ζητήσετέ με
  english_pob_choice: You will seek me
  chosen_korean: 너희는 나를 찾겠으나
  alternatives_korean:
  - 너희는 나를 구하겠으나
  - 너희는 나를 찾을 것이나
  lexicon: BDAG
  rationale: ζητέω의 기본적 의미를 ‘찾다’로 자연스럽게 살리되, 문맥상 예수님을 더 이상 만날 수 없게 된 상황의 뉘앙스를 담기 위해 미래 대립 구조로 옮겼습니다.
- source_word: οὐχ εὑρήσετε
  english_pob_choice: will not find
  chosen_korean: 찾지 못할 것이며
  alternatives_korean:
  - 발견하지 못할 것이며
  - 만나지 못할 것이며
  lexicon: BDAG
  rationale: εὑρίσκω의 직접 대응으로 ‘찾지 못하다’를 택해 단순한 ‘발견’보다 인격적 대상인 예수님을 찾는 맥락을 보존했습니다.
- source_word: ὅπου εἰμὶ ἐγὼ
  english_pob_choice: where I am
  chosen_korean: 내가 있는 곳에
  alternatives_korean:
  - 내가 있는 데에
  - 내가 있는 곳으로
  lexicon: BDAG
  rationale: ὅπου를 장소를 나타내는 한국어 표현으로 옮기면서, 강조된 ἐγώ는 자연스러운 어순으로 처리해 문장의 초점이 장소에 머물게 했습니다.
- source_word: οὐ δύνασθε ἐλθεῖν
  english_pob_choice: you are not able to come
  chosen_korean: 너희는 올 수 없습니다
  alternatives_korean:
  - 너희는 올 수 없습나다
  - 너희는 올 수 없습니다만
  lexicon: BDAG
  rationale: δύνασθε의 능력 부정을 살려 ‘오다’에 대한 불가능성을 분명히 했고, 영어 POB처럼 금지보다 불능의 의미가 드러나도록 했습니다.
theological_decisions:
- issue: ‘너희는 올 수 없습니다’의 불능이 무엇을 뜻하는지
  chosen_reading: 불능의 성격을 특정하지 않고 그대로 둡니다.
  alternative_readings:
  - ‘올 수 없습니다’ 대신 ‘올 수 없습니다만’으로 완화하는 해석
  - ‘올 수 없습니다’에 구원론적 이유를 덧붙이는 해석
  rationale: 본문은 δύνασθε로 능력의 부정을 말할 뿐, 그 이유가 도덕적·영적·사법적·일시적 제약인지 규정하지 않으므로 그 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
