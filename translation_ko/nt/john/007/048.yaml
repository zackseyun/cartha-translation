  chosen_korean: 그를 믿은
  alternatives_korean:
  - 그에게 믿음을 둔
  - 그에게 신뢰한
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω εἰς 용법은 통상 ‘~을 믿다/믿는’으로 번역하는 것이 가장 자연스러워, 신학적 의미를 유지하면서도 과도한 설명을 피했습니다.
theological_decisions:
