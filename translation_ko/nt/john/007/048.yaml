  lexicon: BDAG
  rationale: μή τις가 기대하는 부정적 답변을 살리되, 본문을 단정문으로 바꾸지 않고 한국어의 자연스러운 반문 형태로 옮겼습니다.
- source_word: ἐκ τῶν ἀρχόντων
  english_pob_choice: of the rulers
  chosen_korean: 지도자들 가운데
  alternatives_korean:
  - 통치자들 가운데
  - 권력자들 가운데
  - 관리들 가운데
  lexicon: BDAG
  rationale: ἄρχοντες는 여기서 유대 사회의 인정된 지배층을 가리키므로, 직역적이면서도 현대 독자가 이해할 수 있는 ‘지도자들 가운데’로 옮겼습니다.
- source_word: ἐπίστευσεν εἰς αὐτὸν
  english_pob_choice: believed in him
  chosen_korean: 그를 믿은
  alternatives_korean:
  - 그에게 믿음을 둔
  - 그에게 신뢰한
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω εἰς 용법은 통상 ‘~을 믿다/믿는’으로 번역하는 것이 가장 자연스러워, 신학적 의미를 유지하면서도 과도한 설명을 피했습니다.
