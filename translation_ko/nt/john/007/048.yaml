  source_fidelity: 그리스어의 μή τις가 이끄는 부정적 답변을 예상하는 의문문, ἐκ ... ἢ ἐκ ...의 병렬 구조, 그리고 πιστεύω εἰς αὐτόν의 의미를 대체로 충실히 반영했습니다. 다만 ‘바리새파 사람들’은 집단명 Φαρισαῖοι의 통상적이고 정확한 한국어 명칭인 ‘바리새인들’로 고치는 것이 좋습니다.
  naturalness: ‘지도자들 가운데나 바리새파 사람들 가운데서’는 ‘가운데’의 반복과 조사 결합 때문에 다소 무겁습니다. 두 집단을 먼저 병렬로 제시한 뒤 ‘가운데서’를 한 번만 쓰면 현대 표준 한국어로 더 자연스럽습니다.
  terminology: ἄρχοντες는 문맥상 유대의 지도·권위 계층을 가리키며 ‘지도자들’은 허용되는 일반적 번역입니다. Φαρισαῖοι는 ‘바리새파 사람들’보다 성경 한국어에서 확립된 집단명 ‘바리새인들’이 더 정확하고 자연스럽습니다. ‘그를 믿다’도 요한복음의 πιστεύω εἰς 용례에 적절합니다.
  issues:
