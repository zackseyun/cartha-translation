  alternative_readings:
  - 아무도 지도자들이나 바리새파 사람들 가운데서 그를 믿지 않았습니다.
  rationale: 그리스어는 여전히 질문문이므로, 부정 선언으로 바꾸면 화자의 경멸적 수사와 서술의 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
