  - 권력자들 가운데
  - 관리들 가운데
  lexicon: BDAG
  rationale: ἄρχοντες는 여기서 유대 사회의 인정된 지배층을 가리키므로, 직역적이면서도 현대 독자가 이해할 수 있는 ‘지도자들 가운데’로 옮겼습니다.
- source_word: ἐπίστευσεν εἰς αὐτὸν
