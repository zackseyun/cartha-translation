id: JHN.7.30
reference: John 7:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
  footnotes:
  - marker: a
    text: Or 'they were trying to arrest him.' The Greek verb can mean 'to seize,' and in context this likely implies arrest.
    reason: lexical_alternative
  - marker: b
    text: '''His hour'' is a recurring expression in John for the divinely appointed time in Jesus'' mission, especially his suffering, death, resurrection, and glorification.'
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 그들은 그를 붙잡으려고 찾고 있었으나, 아무도 그에게 손을 대지 못했습니다. 그의 때가 아직 오지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙잡으려고’는 문맥상 체포 시도를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 때’는 요한복음에서 예수의 사명, 특히 수난과 영화롭게 됨과 연결된 반복적 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  english_pob_choice: they were seeking
  chosen_korean: 찾고 있었으나
  alternatives_korean:
  - 붙잡으려 하고 있었으나
  - 애쓰고 있었으나
  lexicon: BDAG
  rationale: 미완료 과거의 지속적 시도를 살리기 위해 ‘찾고 있었습니다’보다 진행성을 드러내는 표현을 택했습니다. 앞뒤 문맥상 단순한 탐색이 아니라 체포 시도를 가리키므로 ‘붙잡으려고’로 목적을 분명히 했습니다.
- source_word: πιάσαι
  english_pob_choice: to seize
  chosen_korean: 붙잡으려고
  alternatives_korean:
  - 잡으려고
  - 체포하려고
  lexicon: BDAG
  rationale: 동사의 기본 의미는 ‘붙잡다/붙들다’이지만, 문맥상 실제로는 예수를 체포하려는 시도입니다. 영어 POB의 ‘seize’와 같이 원뜻을 유지하되 문맥적 함의를 드러내는 표현을 선택했습니다.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  english_pob_choice: laid a hand on him
  chosen_korean: 그에게 손을 대지 못했습니다
  alternatives_korean:
  - 그에게 손을 얹지 못했습니다
  - 그를 붙잡지 못했습니다
  lexicon: BDAG
  rationale: 헬라어 관용구를 직역하면 ‘손을 얹다’이지만, 여기서는 예수에게 실제로 행동을 가하지 못했다는 의미가 핵심입니다. 그래서 관용적 한국어로 자연스럽게 옮기되, ‘손’을 유지해 원문 이미지도 살렸습니다.
- source_word: ἡ ὥρα αὐτοῦ
  english_pob_choice: his hour
  chosen_korean: 그의 때
  alternatives_korean:
  - 그의 시간
  - 정해진 때
  lexicon: BDAG
  rationale: 요한복음의 φορ뛰는 신학적 표현인 ‘hour’를 한국어에서는 관용적으로 ‘때’로 옮기면 가장 자연스럽고도 상징성을 유지할 수 있습니다. ‘시간’은 물리적 의미로 좁아질 수 있어 피했습니다.
theological_decisions:
- issue: 요한복음의 ‘his hour’의 신학적 함의
  chosen_reading: ‘그의 때’로 유지하되, 본문 안에서는 그 의미를 죽음/영광으로 과도하게 좁히지 않았습니다.
  alternative_readings:
  - 그의 죽을 때
  - 정해진 수난의 때
  rationale: 요한복음에서 이 표현은 예수의 수난, 죽음, 영화롭게 됨을 포괄하는 반복어입니다. 본절 자체는 그 범위를 구체화하지 않으므로, 문맥의 긴장감을 유지하기 위해 넓은 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, 신학적 긴장을 해소하지 않고 보존함
