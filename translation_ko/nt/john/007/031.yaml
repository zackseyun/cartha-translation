id: JHN.7.31
reference: John 7:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
  footnotes:
  - marker: a
    text: Or, 'the Christ.' The Greek title Χριστός is rendered 'Messiah' here because it is used as a title in a Jewish messianic context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 무리 가운데 많은 사람이 그를 믿었습니다[a]. 그리고 그들은 말했습니다. 「메시아가 오시면, 이 사람이 행한 것보다 더 많은 표적을 행하시겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리스도.’ 여기서는 Χριστός가 유대적 메시아 맥락의 호칭으로 쓰이므로 ‘메시아’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  english_pob_choice: But many from the crowd
  chosen_korean: 그러나 무리 가운데 많은 사람이
  alternatives_korean:
  - 그리고 무리 가운데 많은 사람이
  - 무리에서 많은 사람이
  lexicon: BDAG
  rationale: δὲ의 대조를 살려 ‘그러나’로 옮기고, ἐκ τοῦ ὄχλου의 부분적 의미는 ‘무리 가운데’로 자연스럽게 반영했습니다.
- source_word: ἐπίστευσαν εἰς αὐτόν
  english_pob_choice: believed in him
  chosen_korean: 그를 믿었습니다
  alternatives_korean:
  - 그에게 믿음을 두었습니다
  - 그를 믿어 의지했습니다
  lexicon: BDAG
  rationale: εἰς를 포함한 πιστεύω의 인격적 신뢰를 한국어의 기본 표현 ‘믿다’로 간결하게 살렸습니다.
- source_word: Ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 그 메시아
  lexicon: BDAG
  rationale: 본문의 Χριστός는 이름이 아니라 유대적 종말론 맥락의 호칭이므로, POB 기준에 따라 ‘메시아’로 옮겼습니다.
- source_word: σημεῖα
  english_pob_choice: signs
  chosen_korean: 표적
  alternatives_korean:
  - 징조
  - 기적
  lexicon: BDAG
  rationale: 요한복음에서 σημεῖα는 단순한 기적보다 계시적 의미가 있는 ‘표적’이 적절합니다.
theological_decisions:
- issue: Χριστός의 호칭 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 절에서 Χριστός는 예수의 고유명처럼 쓰인 것이 아니라 ‘오는 메시아’라는 호칭이므로, 유대적 기대를 드러내는 ‘메시아’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → Messiah (where title; Christ where name-like)'
- issue: μή를 포함한 반문형 질문의 힘
  chosen_reading: 예상되는 부정 답변을 가진 반문으로 유지
  alternative_readings:
  - 중립적인 미래 질문
  rationale: ‘더 많은 표적을 행하시겠습니까?’로 번역해, 화자들이 예수의 표적을 메시아적 기준으로 충분한 것으로 보고 있음을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
