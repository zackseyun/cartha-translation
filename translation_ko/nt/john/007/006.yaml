id: JHN.7.6
reference: John 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
  footnotes:
  - marker: a
    text: Or “My appointed time has not yet arrived.” The Greek word can mean a fitting or appointed time, not merely time in general.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 예수님께서 그들에게 말씀하셨습니다. “내 때[a]는 아직 이르지 않았지만, 너희 때는 언제나 준비되어 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 정해진 때는 아직 이르지 않았습니다.” 여기서 헬라어는 단순한 ‘시간’보다 알맞거나 정해진 때를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς
  english_pob_choice: So Jesus said to them
  chosen_korean: 그러므로 예수님께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그때 예수님께서 그들에게 말씀하셨습니다
  - 그래서 예수님께서 그들에게 말씀하셨습니다
  lexicon: SBLGNT / BDAG
  rationale: οὖν의 인과·연결 기능을 한국어의 ‘그러므로’로 살리고, λέγει의 역사적 현재는 자연스러운 서술체인 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: ὁ καιρὸς ὁ ἐμὸς
  english_pob_choice: My time
  chosen_korean: 내 때
  alternatives_korean:
  - 내 정해진 때
  - 내 appointed time
  - 내 시기
  lexicon: BDAG
  rationale: καιρός의 ‘정해진/알맞은 때’라는 뉘앙스를 살리면서도, 본문의 대조를 간결하게 드러내기 위해 ‘내 때’로 옮겼습니다.
- source_word: οὔπω πάρεστιν
  english_pob_choice: has not yet come
  chosen_korean: 아직 이르지 않았습니다
  alternatives_korean:
  - 아직 오지 않았습니다
  - 아직 여기에 있지 않습니다
  - 아직 도래하지 않았습니다
  lexicon: BDAG
  rationale: πάρεστιν의 ‘도착하다/현존하다’ 의미를 한국어의 시간 표현인 ‘이르다’로 자연스럽게 옮겨, 시점이 아직 도달하지 않았음을 나타냈습니다.
- source_word: ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος
  english_pob_choice: but your time is always ready
  chosen_korean: 하지만 너희 때는 늘 준비되어 있습니다
  alternatives_korean:
  - 그러나 너희 때는 항상 준비되어 있습니다
  - 하지만 너희 때는 언제나 준비되어 있습니다
  - 하지만 너희 때는 늘 알맞습니다
  lexicon: BDAG
  rationale: δὲ의 대조를 ‘하지만’으로 살리고, ἕτοιμος는 ‘준비되어 있습니다’로 옮겨 서로 대비되는 두 ‘때’의 상태를 분명하게 했습니다.
theological_decisions:
- issue: καιρός의 시간 이해
  chosen_reading: 본문은 예수님의 ‘때’를 일반적 시간보다 ‘정해진/알맞은 때’로 암시하지만, 본문 자체의 표현을 따라 ‘내 때’로 유지했습니다.
  alternative_readings:
  - 내 정해진 때
  - 내 appointed time
  - 내 시기
  rationale: 요한복음 전체의 신학적 함의를 지나치게 풀어 쓰지 않고, 원문이 지닌 긴장과 간결성을 보존하기 위해서입니다.
  doctrine_reference: 본문-우선 원칙, 요한복음의 ‘때’ 신학은 과잉해석 없이 보존
