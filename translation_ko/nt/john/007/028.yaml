id: JHN.7.28
reference: John 7:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
  footnotes:
  - marker: a
    text: Or, 'You know me, and you know where I come from.' The statement may be heard as ironic or challenging in context, but the Greek is formally declarative.
    reason: alternative_reading
  - marker: b
    text: '''From myself'' can also be rendered ''on my own,'' expressing that Jesus did not come on his own initiative.'
    reason: lexical_alternative
  - marker: c
    text: '''True'' may also carry the sense ''genuine'' or ''real'' in John''s usage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수께서 성전에서 가르치시며 외쳐 말씀하셨습니다. 「너희는 나를 알고, 내가 어디서 왔는지도 압니다. 나는 스스로 온 것이 아닙니다. 오히려 나를 보내신 분은 참되신 분이신데, 너희는 그분을 알지 못합니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내가 어디서 왔는지’로 옮겨도 되며, 문맥상 이 진술은 반어적이거나 도전적으로 들릴 수 있습니다. 그러나 헬라어 형태는 선언문입니다.
    reason: alternative_reading
  - marker: b
    text: ‘스스로’는 ‘내 마음대로/내 뜻대로’라는 주도성의 뉘앙스도 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘참되신’은 요한문헌에서 ‘참된/참다운/진정한’의 의미를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  english_pob_choice: cried out
  chosen_korean: 외쳐 말씀하셨습니다
  alternatives_korean:
  - 소리치셨습니다
  - 큰소리로 말씀하셨습니다
  lexicon: SBLGNT + BDAG
  rationale: 공적·공개적 발화를 드러내면서도, 한국어에서 자연스럽고 품위 있게 예수의 선언성을 살립니다.
- source_word: ἐν τῷ ἱερῷ
  english_pob_choice: in the temple
  chosen_korean: 성전에서
  alternatives_korean:
  - 성전 뜰에서
  - 성전 구역에서
  lexicon: BDAG
  rationale: ἱερόν은 성전 परिसर 전체를 가리키므로, 표준적이고 간결한 ‘성전에서’가 문맥에 적절합니다.
- source_word: ἀπ’ ἐμαυτοῦ
  english_pob_choice: from myself
  chosen_korean: 스스로 온 것이 아닙니다
  alternatives_korean:
  - 내 힘으로 온 것이 아닙니다
  - 내가 스스로 온 것이 아닙니다
  lexicon: BDAG
  rationale: 단순한 출처만이 아니라 독자적 기원·주도성을 부정하는 뜻을 반영하기 위해, 본문의 대비를 살려 ‘스스로’로 옮겼습니다.
- source_word: ἀληθινὸς
  english_pob_choice: 'true'
  chosen_korean: 참되신
  alternatives_korean:
  - 진실하신
  - 참된
  lexicon: BDAG
  rationale: 요한복음에서 ἀληθινός는 단순한 사실성보다 ‘참됨/참되심’의 질적 뉘앙스를 가지므로, 하나님을 가리키는 형용사로 자연스러운 ‘참되신’이 적절합니다.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  english_pob_choice: whom you do not know
  chosen_korean: 너희는 그분을 알지 못합니다
  alternatives_korean:
  - 너희는 그를 알지 못합니다
  - 너희는 그분을 모르고 있습니다
  lexicon: BDAG
  rationale: 직접 목적어를 한국어 어순에 맞게 앞세우되, 예수의 대조적 책망을 분명히 하기 위해 존칭 대명사 ‘그분’을 사용했습니다.
theological_decisions:
- issue: ‘보내신 분’의 지시 대상을 명시할지 여부
  chosen_reading: 본문 그대로 ‘나를 보내신 분’으로 두고, ‘아버지’를 덧붙이지 않았습니다.
  alternative_readings:
  - 나를 보내신 아버지
  - 아버지께서 나를 보내셨습니다
  rationale: 그리스어는 관계적 표현을 사용하며 여기서 직접적으로 ‘아버지’라고 말하지 않으므로, 요한문맥이 주는 의미를 해치지 않으면서 본문 표현을 보존했습니다.
  doctrine_reference: Original-language primacy; preserve Johannine relational language without over-explicitation.
- issue: ‘너희는 나를 알고…’ 구문의 화용론적 긴장
  chosen_reading: 서술형을 유지해, 문맥이 주는 도전적/반어적 긴장을 본문 밖에서 해석하게 했습니다.
  alternative_readings:
  - 의문형으로 처리
  - 노골적인 반어를 표시
  rationale: 헬라어는 형식상 선언문이므로, 번역문에서 과도하게 해석을 고정하지 않고 예수의 공개적 책망이라는 긴장을 보존합니다.
  doctrine_reference: Preserve rhetorical/theological tension rather than resolve it.
