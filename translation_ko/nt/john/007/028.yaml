revisions:
- from: 그러므로 예수께서 성전에서 가르치시며 외쳐 말씀하셨습니다. 「너희는 나를 알고, 내가 어디서 왔는지도 압니다. 나는 스스로 온 것이 아닙니다. 오히려 나를 보내신 분은 참되신 분이신데, 너희는 그분을 알지 못합니다.」[a][b][c]
  to: 그러자 예수께서 성전에서 가르치시면서 큰 소리로 말씀하셨습니다. 「너희는 나도 알고, 내가 어디에서 왔는지도 압니다.[a] 나는 스스로 온 것이 아닙니다.[b] 그러나 나를 보내신 분은 참되십니다.[c] 너희는 그분을 알지 못합니다.」
  rationale: Κἀμὲ의 강조를 ‘나도’로 반영하고, ἀλλά를 중립적인 ‘그러나’로 옮겼습니다. 발화 동사는 δημόσια적 큰 소리를 나타내되 고통이나 감정적 울부짖음을 암시하지 않는 ‘큰 소리로 말씀하셨습니다’로 다듬었습니다. 기존 각주 a의 중복을 제거하고, 모든 각주를 해당 어구에 직접 연결했습니다. ‘보내신 분’을 아버지로 명시하지 않아 본문의 관계적 표현과 해석상 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:11Z'
