id: JHN.7.27
reference: John 7:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
  footnotes:
  - marker: a
    text: Or, 'But we know where this one comes from; but when the Christ comes, no one knows where he comes from.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 우리는 이 사람이 어디에서 왔는지 압니다. 메시아께서 오실 때에는 아무도 그분이 어디에서 왔는지 알지 못합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그런데 / 그러나
  alternatives_korean:
  - 하지만
  - 그렇지만
  lexicon: BDAG
  rationale: 앞절과의 강한 대조를 살리되, 첫 절은 문맥 전환이 자연스러운 ‘그런데’로, 둘째 절은 반복 대조를 분명히 하는 ‘그러나’로 옮겼습니다.
- source_word: τοῦτον
  english_pob_choice: this man
  chosen_korean: 이 사람
  alternatives_korean:
  - 이분
  - 이 사람을
  lexicon: BDAG
  rationale: 지시대명사의 약간 경계적인 뉘앙스는 유지하되, 현대 한국어에서 자연스럽고 과도하게 해설적이지 않은 표현으로 ‘이 사람’을 택했습니다.
- source_word: πόθεν ἐστίν
  english_pob_choice: where he is from
  chosen_korean: 어디에서 왔는지
  alternatives_korean:
  - 어디 출신인지
  - 어디서 온 분인지
  lexicon: BDAG
  rationale: 출처·기원을 묻는 표현이므로 한국어에서는 ‘어디에서 왔는지’가 가장 간결하고 반복 구조도 잘 살립니다.
- source_word: χριστός
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 기름부음 받은 이
  lexicon: BDAG
  rationale: POB의 용례를 따라 тит울로서의 χριστός를 ‘메시아’로 옮겨, 유대적·종말론적 기대를 유지했습니다.
theological_decisions:
- issue: 군중 발언의 의미를 번역에서 해석할지 여부
  chosen_reading: 군중이 가진 통념을 그대로 보고하는 문장으로 번역했습니다.
  alternative_readings:
  - 메시아는 어디서 올지 아무도 모른다고 해설적으로 풀어쓰기
  rationale: 이 절은 내러티브 안에서 군중의 주장과 오해를 기록하는 것이므로, 번역문이 그 신학적 긴장을 해소하지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: 존칭 대명사 사용
  chosen_reading: 예수님을 가리키는 마지막 절에서 ‘그분’을 사용했습니다.
  alternative_readings:
  - 그가
  - 그 사람
  rationale: 본문의 군중 발언은 다소 거리감 있는 지시를 담지만, 한국어 공적 성경문체에서는 동일 인물을 가리킬 때 과도한 불쾌감을 피하면서도 인물 지시를 분명히 하기 위해 ‘그분’을 선택했습니다.
  doctrine_reference: Korean style convention for reverent third-person reference in narrative
