  - severity: medium
    issue: 각주 b의 대안 번역과 설명의 연결이 부정확함
    rationale: ‘예언자가 일어나지 않는다’는 한국어만으로 하나님이 예언자를 세우신다는 뉘앙스를 더 분명히 드러내지 않습니다. 수동 가능성을 반영한 ‘세워지지 않는다’가 각주 설명에 더 맞습니다.
  - severity: low
