revisions:
- from: 그들이 그에게 대답하여 말했습니다. 「당신도 갈릴리에서 나온 사람입니까? 알아보십시오. 갈릴리에서는 어떤 예언자도 나오지 않습니다.」[a][b]
  to: 그들이 그에게 대답하여 말했습니다. 「당신도 갈릴리 출신입니까? [a]찾아보고 알아보십시오. 갈릴리 출신 예언자는 나오지 않습니다. [b]」
  rationale: 출신을 나타내는 전치사구의 의미를 ‘갈릴리 출신’으로 분명히 하고, 두 명령형을 보존했습니다. 부정의 답을 기대하는 질문은 본문에서 과도하게 해설하지 않고 각주에 남겼습니다. 각주 표지는 각각 해당 질문과 예언자의 출현/세움에 관한 절에 배치했습니다. ‘세워지지 않는다’는 본문의 유일한 의미라고 단정하지 않고, ἐγείρεται의 가능한 수동적 뉘앙스를 각주에서만 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:16Z'
