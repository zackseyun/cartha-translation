source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
  footnotes:
  - marker: a
    text: Or, “Surely you are not also from Galilee, are you?” The Greek question is framed to expect a negative answer.
    reason: lexical_alternative
  - marker: b
    text: Some translate, “no prophet is raised up from Galilee,” preserving a possible nuance that God raises up prophets.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 대답하여 말했습니다. 「당신도 갈릴리 출신입니까? [a]찾아보고 알아보십시오. 갈릴리 출신 예언자는 나오지 않습니다. [b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “설마 당신도 갈릴리 사람입니까?” 그리스어 질문은 부정의 대답을 기대하는 형식입니다.
    reason: alternative_reading
  - marker: b
    text: 일부는 “갈릴리 출신 예언자는 세워지지 않는다”로 옮깁니다. 이는 하나님께서 예언자를 세우신다는 가능한 뉘앙스를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  english_pob_choice: They answered and said
  chosen_korean: 그들이 그에게 대답하여 말했습니다
  alternatives_korean:
  - 그들이 그에게 대답했습니다
  - 그들이 그에게 말했습니다
  lexicon: SBLGNT / BDAG
  rationale: 두 동사의 중복을 한국어에서도 어느 정도 살려 요한복음 특유의 서술 리듬을 유지했습니다.
- source_word: Μὴ καὶ σὺ ... εἶ;
  english_pob_choice: Are you also from Galilee?
  chosen_korean: 당신도 갈릴리에서 나온 사람입니까?
  alternatives_korean:
  - 당신도 갈릴리 출신입니까?
  - 설마 당신도 갈릴리 사람입니까?
  lexicon: BDAG
  rationale: μή가 부정의 대답을 기대하는 뉘앙스를 담지만, 본문은 상대를 깎아내리는 질문이므로 자연스러운 한국어 의문문으로 옮기되 비아냥의 어조는 문맥으로 드러나게 했습니다.
- source_word: ἐραύνησον καὶ ἴδε
  english_pob_choice: Search and see
  chosen_korean: 알아보십시오
  alternatives_korean:
  - 살펴보십시오
  - 찾아보십시오
  lexicon: BDAG
  rationale: 두 명령형을 한국어에서 지나치게 직역하면 부자연스럽기 때문에, 조사와 확인의 의미를 하나의 공손한 명령으로 압축했습니다.
- source_word: ἐκ τῆς Γαλιλαίας προφήτης οὐκ ἐγείρεται
  english_pob_choice: no prophet arises from Galilee
  chosen_korean: 갈릴리에서는 어떤 예언자도 나오지 않습니다
  alternatives_korean:
  - 갈릴리에서 예언자는 일어나지 않습니다
  - 갈릴리에서는 예언자가 생겨나지 않습니다
  lexicon: BDAG
  rationale: οὐκ ἐγείρεται는 단순한 ‘일어나다’보다 출현/등장을 뜻하는 문맥이므로 ‘나오다’로 자연스럽게 옮겼습니다. '예언자'는 원문의 προφήτης를 그대로 살린 표현입니다.
theological_decisions:
- issue: 부정의 대답을 기대하는 질문의 처리
  chosen_reading: 주본문에서는 자연스러운 한국어 질문으로 두고, 부정 기대는 드러내지 않았습니다.
  alternative_readings:
  - 설마 당신도 갈릴리 사람입니까?
  - 당신도 갈릴리 출신이 아니겠지요?
  rationale: 그리스어 μή의 뉘앙스는 분명하지만, 본문 자체는 상대를 조롱하는 질문으로 충분히 전달되므로 과도한 해설형 문장을 본문에 넣지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 (preserve tension/ambiguity where relevant)'
