  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
  footnotes:
  - marker: a
    text: Or “will see” or “observe.” The Greek verb can emphasize watching or beholding, and the future form in this purpose clause may be rendered in slightly different ways in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그의 형제들이 그에게 말했습니다. 「여기서 떠나 유대로 가십시오. 그래야 당신의 제자들도 당신이 하고 있는 일들을 보게 될 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: θεωρήσουσιν은 목적절에서 ‘보다/관찰하다’의 뉘앙스를 가질 수 있습니다. 문맥에 따라 ‘보게 될 것입니다’ 또는 ‘관찰하게 될 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτὸν
  english_pob_choice: So his brothers said to him
  chosen_korean: 그러므로 그의 형제들이 그에게 말했습니다
  alternatives_korean:
  - 그래서 그의 형제들이 그에게 말했습니다
  - 그리하여 그의 형제들이 그에게 말했습니다
  lexicon: BDAG
  rationale: οὖν의 순차·추론 연결을 한국어의 자연스러운 담화 연결어 ‘그러므로’로 옮겨 흐름을 유지했습니다.
- source_word: Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν
  english_pob_choice: Leave here and go to Judea
  chosen_korean: 여기서 떠나 유대로 가십시오
  alternatives_korean:
  - 여기서 나가 유대로 가십시오
  - 이곳을 떠나 유대로 가십시오
  lexicon: BDAG
  rationale: 두 명령형의 압박감을 살리되, 현대 한국어에서 자연스럽고 직접적인 명령문으로 간결하게 옮겼습니다.
- source_word: οἱ μαθηταί σου
  english_pob_choice: your disciples
  chosen_korean: 당신의 제자들도
  alternatives_korean:
  - 당신의 제자들도
  - 당신의 제자들까지도
  lexicon: BDAG
  rationale: μαθηταί를 요한복음의 통상 용례에 따라 ‘제자들’로 옮기고, καὶ의 추가 의미를 ‘도’로 반영했습니다.
- source_word: θεωρήσουσιν
  english_pob_choice: may see
  chosen_korean: 보게 될 것입니다
  alternatives_korean:
  - 보게 될 수 있습니다
  - 볼 것입니다
  - 관찰하게 될 것입니다
  lexicon: BDAG
  rationale: ἵνα 절의 목적·예상 의미를 살리면서도, θεωρέω의 지각적 의미를 ‘보다’로 담았습니다.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  english_pob_choice: the works you are doing
  chosen_korean: 당신이 하고 있는 일들
  alternatives_korean:
  - 당신이 행하시는 일들
  - 당신의 일들
  - 당신이 행하고 있는 일들
  lexicon: BDAG
  rationale: ἔργα를 요한복음의 문맥상 단순한 ‘일’보다 행위의 실재를 드러내는 표현으로 살리되, 한국어에서는 과도한 문어성을 피했습니다.
theological_decisions:
- issue: 예수의 형제들에 대한 지칭
  chosen_reading: 문맥상 예수의 형제들이 실제 발화 주체로 그대로 드러나도록 ‘그의 형제들’로 옮겼습니다.
  alternative_readings:
  - 형제자매들
  - 친족들
  rationale: 본문은 남성 복수형을 쓰며, 이어지는 문맥도 예수의 형제들이 말하는 장면이므로 범위를 넓히지 않았습니다.
  doctrine_reference: 본문이 말하는 친족 관계를 그대로 유지하는 것이 해석의 과잉을 막습니다.
