review_pass:
  verdict: revise
  source_fidelity: ‘자기들에 관해’는 περὶ αὐτοῦ(‘그에 관하여’)의 지시 대상을 바리새인들로 바꾸므로 수정이 필요합니다. 또한 ὑπηρέτας는 체포를 위해 파견된 공적 인원을 가리키며, ‘하속들’은 현대 한국어에서 자연스럽지 않고 단순 사적 종속자를 연상시킬 수 있습니다.
  naturalness: ‘하속들’은 현대 표준어 성경 문체에서 다소 낡고 부자연스럽습니다. ‘성전 경비원들’은 요한복음의 문맥에서 자연스럽지만, 그 문맥적 구체화는 각주로 밝혔습니다. 각주 표지도 해당 낱말 또는 구에 직접 붙였습니다.
  terminology: ‘바리새인들’, ‘대제사장들’은 적절합니다. ὑπηρέτας는 문맥상 ‘성전 경비원들’로 옮기되, 원어 자체는 공식 파견 인원을 더 넓게 가리킨다는 점을 각주에 보존했습니다. πιάσωσιν은 ‘붙잡으려고’로 옮겨 ‘체포하다’보다 넓은 물리적 붙잡음의 의미를 유지했습니다.
  issues:
  - severity: high
    issue: ‘자기들에 관해’가 αὐτοῦ의 지시 대상을 바리새인들로 바꿈
    rationale: 그리스어 αὐτοῦ는 단수 남성으로 예수를 가리킵니다. 바리새인들을 가리키는 ‘자기들’은 본문의 의미를 변경합니다.
  - severity: medium
    issue: ‘하속들’의 어휘 선택
    rationale: ὑπηρέτας의 공적·집행적 역할을 충분히 드러내지 못하고 현대 한국어에서는 낡거나 사적 종속 관계를 연상시킬 수 있습니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 한꺼번에 배치됨
    rationale: 각주가 설명하는 표현에 표지를 직접 붙여 독자가 각주의 대상을 분명히 알 수 있게 해야 합니다.
  revised_text: 바리새인들은 무리가 그에 관하여 이런 말들을 수군거리는 것을 들었고, 대제사장들과 바리새인들은 그를 붙잡으려고 성전 경비원들을 보냈습니다.
  revised_footnotes:
  - marker: a
    text: ‘수군거리다’는 그리스어가 나타내는 낮고 불만 섞인 말투를 반영합니다. ‘중얼거리다’ 또는 ‘불평하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ὑπηρέτας는 권위자들이 파견한 공식 수행원 또는 집행 인원을 가리킵니다. ‘성전 경비원들’은 이 문맥에 따른 번역이며, ‘관리들’ 또는 ‘경비원들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 직역하면 ‘그를 붙잡으려고’입니다. 문맥상 ‘그를 체포하려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: αὐτοῦ를 ‘그’로 바로잡아 예수를 지시하도록 했습니다. ὑπηρέτας는 현대적이고 문맥에 맞는 ‘성전 경비원들’로 수정하되, 원어의 더 넓은 의미와 문맥적 구체화는 각주에 명시했습니다. 완성본에서는 각주 표지를 각각 ‘수군거리는’[a], ‘성전 경비원들을’[b], ‘붙잡으려고’[c]에 붙여 제시해야 합니다.
