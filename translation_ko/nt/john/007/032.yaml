  verdict: revise
  source_fidelity: ‘자기들에 관해’는 περὶ αὐτοῦ(‘그에 관하여’)를 잘못 가리키므로 반드시 고쳐야 합니다. 또한 ὑπηρέτας는 단순한 ‘하속’보다 체포 임무를 띤 공적 수행·집행 인원을 가리키므로, 문맥상 ‘성전 경비원들’이 더 충실합니다. 목적 표현 ‘붙잡으려고’는 ἵνα πιάσωσιν αὐτόν을 자연스럽고 정확하게 반영합니다.
  naturalness: ‘하속들’은 현대 표준어 합쇼체 성경 문맥에서 다소 낡고, 단순 사적 종을 연상시킬 수 있습니다. ‘그에 대해’, ‘성전 경비원들’, ‘붙잡으려고’는 자연스럽고 격식 있는 현대 한국어입니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘바리새인들’과 ‘대제사장들’은 통용되는 신약 용어로 유지할 수 있습니다. ὑπηρέτας는 이 문맥에서 성전 당국의 체포 집행 인원을 뜻하므로 ‘성전 경비원들’로 옮기고, 각주에서 그리스어의 더 넓은 의미와 대안을 밝혔습니다.
  issues:
  - severity: high
    issue: ‘자기들에 관해’가 περὶ αὐτοῦ의 지시 대상을 잘못 번역함
    rationale: αὐτοῦ는 예수, 곧 ‘그’를 가리킵니다. 현 번역은 바리새인들이 자신들에 관한 말을 들은 것으로 바꾸어 본문 의미를 훼손합니다.
  - severity: medium
    issue: ‘하속들’이 ὑπηρέτας의 공적·집행적 역할을 충분히 드러내지 못함
    rationale: 이들은 예수를 붙잡기 위해 파견된 공식 인원입니다. ‘하속’은 현대어에서 사적 심부름꾼 또는 종의 뉘앙스가 강합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있음
    rationale: 각주가 설명하는 어휘 바로 뒤에 표지를 배치하면 각주의 적용 대상이 분명해집니다.
  revised_text: 바리새인들은 무리가 그에 대해 이런 말을 수군거리는 것을 들었고, 대제사장들과 바리새인들은 그를 붙잡으려고 성전 경비원들을 보냈습니다.
  revised_footnotes:
  - marker: a
    text: ‘수군거리다’는 낮은 목소리로 불만스럽게 말하는 뉘앙스의 그리스어를 옮긴 것입니다. ‘중얼거리다’ 또는 ‘불평하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 공식 수행원 또는 집행 인원을 가리킵니다. 이 문맥에서는 ‘성전 경비원들’ 또는 ‘관리들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 문자적으로 ‘그를 붙잡도록’이라는 목적을 나타냅니다. 문맥상 ‘그를 체포하려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 지시 대상의 중대한 오류를 ‘그에 대해’로 바로잡았습니다. ὑπηρέτας는 문맥상 체포를 위해 파견된 공식 인원이므로 현대 한국어에서 자연스럽고 기능을 드러내는 ‘성전 경비원들’로 수정했습니다. 의미를 덧붙이지 않도록 각주에서 해당 표현이 지닌 더 넓은 어휘 범위와 대안을 제시했습니다. 완성문에서는 각주 표지를 각각 ‘수군거리는[a]’, ‘성전 경비원들을[b]’, ‘붙잡으려고[c]’ 뒤에 배치해야 합니다.
