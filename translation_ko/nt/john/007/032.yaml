id: JHN.7.32
reference: John 7:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
  footnotes:
  - marker: a
    text: Or 'grumbling' or 'murmuring.' The Greek suggests subdued, discontented talk.
    reason: lexical_alternative
  - marker: b
    text: Or 'temple police' or 'guards' for 'officers.' The Greek refers to official attendants sent by the Jewish authorities.
    reason: lexical_alternative
  - marker: c
    text: Or 'to arrest him.' The Greek more literally says 'to seize him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바리새인들은 무리가 그에 관하여 이런 말들을 수군거리는 것을 들었고, 대제사장들과 바리새인들은 그를 붙잡으려고 성전 경비원들을 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤκουσαν
  english_pob_choice: heard
  chosen_korean: 들었고
  alternatives_korean:
  - 들었습니다
  - 들어 알게 되었고
  lexicon: BDAG
  rationale: ἀκούω의 여기서는 정보 전달을 받아들이는 뜻이므로, 자연스러운 과거형 ‘들었고’로 옮겼습니다.
- source_word: γογγύζοντος
  english_pob_choice: muttering
  chosen_korean: 수군거리는
  alternatives_korean:
  - 중얼거리는
  - 불평하는
  - 속삭이며 불만을 터뜨리는
  lexicon: BDAG
  rationale: γογγύζω의 낮고 억눌린 말투를 살리되, 한국어에서는 ‘수군거리다’가 가장 자연스럽게 그 뉘앙스를 전달합니다.
- source_word: ὄχλου
  english_pob_choice: the crowd
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: BDAG
  rationale: 요한복음에서 ὄχλος는 모여 있는 집단을 가리키므로, 문맥상 자연한 ‘무리’로 옮겼습니다.
- source_word: ὑπηρέτας
  english_pob_choice: officers
  chosen_korean: 하속들
  alternatives_korean:
  - 관리들
  - 경위들
  - 성전 경비들
  lexicon: BDAG
  rationale: 유대 지도자들이 보내는 공식 수행원을 가리키므로, 단순한 ‘종’보다 공적 집행 성격을 드러내는 ‘하속들’을 선택했습니다.
theological_decisions:
- issue: ὑπηρέτας의 제도적 성격
  chosen_reading: 대제사장들과 바리새인들의 권한 아래 있는 공식 파견 인원으로 이해했습니다.
  alternative_readings:
  - 성전 경비대
  - 그냥 종들
  rationale: 본문은 예수를 체포하기 위한 공식 조치를 묘사하므로, 직역적이면서도 제도적 힘을 잃지 않는 표현이 필요합니다.
  doctrine_reference: historical-context
