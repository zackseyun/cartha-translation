  text: ἀπεκρίθησαν οἱ ὑπηρέται· Οὐδέποτε ⸂ἐλάλησεν οὕτως⸃ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
  footnotes:
  - marker: a
    text: Or “Never has anyone spoken like this.” The Greek reads “a man,” using a masculine singular form with representative force.
    reason: lexical_alternative
translation:
  language: ko
  text: 관리들이 대답했습니다. 「이런 식으로 말한 사람은 지금까지 한 번도 없었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἄνθρωπος는 남성 단수 형태이지만 대표적 일반성을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  english_pob_choice: answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 답했습니다
  - 응답했습니다
  lexicon: ἀποκρίνομαι
  rationale: 문맥상 질문이나 논쟁에 이어지는 응답이므로, 자연스러운 서술체로 ‘대답했습니다’가 가장 적절합니다.
- source_word: οἱ ὑπηρέται
  english_pob_choice: the officers
  chosen_korean: 관리들
  alternatives_korean:
  - 경관들
  - 하급 관리들
  - 시종들
  lexicon: ὑπηρέτης
  rationale: 이들은 7:32, 45에서 예수를 잡으러 보냄을 받은 성전 측 파견 인원이므로, 기능을 드러내는 중립적 표현인 ‘관리들’로 옮겼습니다. ‘시종들’은 지나치게 일반적입니다.
- source_word: Οὐδέποτε
  english_pob_choice: Never
  chosen_korean: 지금까지 한 번도
  alternatives_korean:
  - 결코
  - 한 번도
  lexicon: οὐδέποτε
  rationale: 절대적 부정을 한국어 관용에 맞게 풀어, ‘지금까지 한 번도’로 시간적 누적의 뉘앙스를 분명히 했습니다.
- source_word: ἐλάλησεν οὕτως
  english_pob_choice: has spoken like this
  chosen_korean: 이런 식으로 말한
  alternatives_korean:
  - 그렇게 말한
  - 이처럼 말씀하신
  lexicon: λαλέω + οὕτως
  rationale: 동사의 ‘말하다’와 방식 부사 ‘οὕτως’의 결합을 그대로 살려 ‘이런 식으로’로 표현했습니다. 예수의 발화를 높여 ‘말씀하신’으로 과도하게 격상하지 않았습니다.
- source_word: ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 어떤 사람
  lexicon: ἄνθρωπος
  rationale: 그리스어의 남성 단수는 대표적·일반적 용법이므로, 한국어에서는 자연스러운 일반명사 ‘사람’으로 옮겨 성별 표지를 과도하게 부각하지 않으면서도 의미를 보존했습니다.
theological_decisions:
- issue: ἄνθρωπος의 대표적 일반성
  chosen_reading: ‘사람’으로 옮겨 일반적 의미를 유지함
  alternative_readings:
  - ‘남자’로 옮김
  - ‘누구도’로 의역함
  rationale: 본문의 초점은 예수의 발화 방식의 유례없음에 있으며, 성별 정보 자체가 핵심이 아닙니다. 한국어에서는 ‘사람’이 대표적 일반성을 가장 자연스럽게 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
