id: JHN.7.36
reference: John 7:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
  footnotes:
  - marker: a
    text: Or 'What is this word/saying that he said?' The Greek λόγος can mean 'word,' 'statement,' 'message,' or 'saying' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Some translations render this 'Where I am going, you cannot come,' but the Greek text here says 'Where I am,' preserving a deliberate tension in John's wording.
    reason: alternative_reading
  - marker: c
    text: Or '‘You will seek me and will not find me,’ and, ‘Where I am, you are not able to come’?”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말씀하신 이 말이 무엇입니까? ‘너희는 나를 찾겠지만 찾지 못할 것이며, 내가 있는 곳에 너희는 올 수 없다’ 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 말/말씀/언급이 무엇입니까?’로 옮길 수 있습니다. λόγος는 문맥에 따라 ‘말’, ‘말씀’, ‘언급’, ‘말하는 바’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 이를 ‘내가 가는 곳’으로 옮기지만, 여기의 헬라어는 ‘내가 있는 곳’이라고 말합니다. 요한의 의도적 긴장을 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  english_pob_choice: What is this statement
  chosen_korean: 이 말이 무엇입니까?
  alternatives_korean:
  - 이 말씀은 무엇입니까?
  - 이 말씀이 무엇을 뜻합니까?
  lexicon: BDAG
  rationale: λόγος는 여기서 예수께서 하신 말의 내용을 가리키므로, 자연스러운 현대 한국어로 ‘이 말’이라고 옮기되 질문의 형식은 그대로 살렸습니다.
- source_word: εἶπε
  english_pob_choice: that he said
  chosen_korean: 그가 말씀하신
  alternatives_korean:
  - 그가 하신
  - 그가 말씀한
  lexicon: BDAG
  rationale: 직접 인용을 이끄는 보도절이므로 ‘말씀하신’으로 처리해, 뒤의 인용문과 자연스럽게 연결했습니다.
- source_word: Ζητήσετέ με καὶ οὐχ εὑρήσετε
  english_pob_choice: You will seek me and will not find me
  chosen_korean: 너희는 나를 찾겠지만 찾지 못할 것이며
  alternatives_korean:
  - 너희는 나를 찾을 것이나 찾지 못할 것이며
  - 너희는 나를 구하겠지만 찾지 못할 것이며
  lexicon: BDAG
  rationale: ζητέω는 문맥상 ‘찾다’가 가장 자연스럽고, 부정 결과를 분명히 하기 위해 ‘찾지 못할 것’으로 옮겼습니다.
- source_word: ὅπου εἰμὶ ἐγὼ
  english_pob_choice: Where I am
  chosen_korean: 내가 있는 곳에
  alternatives_korean:
  - 내가 있는 데에
  - 내가 있는 곳
  lexicon: BDAG
  rationale: 헬라어는 ‘내가 가는 곳’이 아니라 현재형 ‘내가 있는 곳’이므로, 그 긴장을 보존하면서도 한국어에서 자연스럽게 읽히도록 ‘내가 있는 곳에’로 옮겼습니다.
- source_word: οὐ δύνασθε ἐλθεῖν
  english_pob_choice: you are not able to come
  chosen_korean: 너희는 올 수 없다
  alternatives_korean:
  - 너희는 올 능력이 없다
  - 너희는 올 수 없다
  lexicon: BDAG
  rationale: δύνασθε의 ‘능력/가능성 없음’을 드러내되, 한국어에서는 간결한 ‘올 수 없다’가 가장 직접적입니다.
theological_decisions:
- issue: ὅπου εἰμὶ ἐγώ의 현재형 보존
  chosen_reading: ‘내가 있는 곳에’로 옮겨, ‘내가 가는 곳’으로 풀지 않았습니다.
  alternative_readings:
  - 내가 가는 곳에
  - 내가 있는 곳으로
  rationale: 본문은 현재형 εἰμί를 사용하므로, 요한복음의 의도적 긴장—예수의 현재적 존재와 제자들의 접근 불가능성—을 해소하지 않고 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
