revisions:
- from: 나는 그분을 압니다. 이는 내가 그분에게서 왔고, 그분이 나를 보내셨기 때문입니다.[a][b]
  to: 나는 그분을 압니다. 내가 그분에게서 왔고[b] 그분이 나를 보내셨기 때문입니다.[a]
  rationale: The main text keeps the explicit first-person emphasis, the causal relationship introduced by ὅτι, and the distinct claims of origin/source and sending. ‘그분에게서 왔고’ remains a natural Korean idiom for the Johannine source/origin expression, without reducing it to mere geographical movement. The footnotes are revised so that their anchors and stated alternatives accurately correspond to the Greek clauses.
