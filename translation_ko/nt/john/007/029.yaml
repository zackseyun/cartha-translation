id: JHN.7.29
reference: John 7:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
  footnotes:
  - marker: a
    text: Or "that I am from him." The Greek conjunction can be taken as introducing content ('that') or reason ('because'); the context favors a causal sense.
    reason: lexical_alternative
  - marker: b
    text: Or "I came from him" or "I am from his presence." The Greek phrase can express source or origin more specifically than simple English "from him" may convey.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 그분을 압니다. 내가 그분에게서 왔고[b] 그분이 나를 보내셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그분에게서 왔고 그분이 나를 보내셨다는 것.” 그리스어 접속사 ὅτι는 내용(“~라는 것”)이나 이유(“왜냐하면”)를 나타낼 수 있습니다. 여기서는 문맥상 이유를 나타내는 것으로 보는 것이 더 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분에게서 온” 또는 “그분의 곁(임재)에서 온.” παρά와 속격의 결합은 단순한 출처뿐 아니라 기원 또는 그분의 임재로부터 비롯됨을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ οἶδα
  english_pob_choice: I know
  chosen_korean: 나는 그분을 압니다
  alternatives_korean:
  - 나는 그를 압니다
  - 내가 그분을 알고 있습니다
  lexicon: BDAG
  rationale: ἐγὼ의 강조를 살리기 위해 주어를 앞세웠고, οἶδα는 현재 상태의 ‘앎’이므로 자연스러운 합쇼체로 ‘압니다’라고 옮겼습니다.
- source_word: αὐτόν
  english_pob_choice: him
  chosen_korean: 그분을
  alternatives_korean:
  - 그를
  - 그이를
  lexicon: BDAG
  rationale: 문맥상 대상은 아버지이므로, 한국어에서 무례하지 않으면서도 인격적 지시를 살리는 ‘그분’을 선택했습니다.
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - …라고
  lexicon: BDAG
  rationale: 문맥이 직접 인용이 아니라 이유 제시이므로, ‘때문입니다’로 원인 관계를 분명하게 드러냈습니다.
- source_word: παρ’ αὐτοῦ εἰμι
  english_pob_choice: I am from him
  chosen_korean: 내가 그분에게서 왔고
  alternatives_korean:
  - 나는 그분에게서 있습니다
  - 나는 그분에게서 왔습니다
  - 나는 그분의 임재로부터 왔습니다
  lexicon: BDAG
  rationale: παρά + 속격의 출처/기원을 한국어로 자연스럽게 풀어, 단순 위치보다 ‘출처·기원’의 의미가 드러나도록 했습니다.
- source_word: κἀκεῖνός με ἀπέστειλεν
  english_pob_choice: and he sent me
  chosen_korean: 그분이 나를 보내셨기 때문입니다
  alternatives_korean:
  - 그분도 나를 보내셨기 때문입니다
  - 그리고 그분이 나를 보내셨습니다
  lexicon: BDAG
  rationale: κακείνος의 대조·연결 기능을 ‘그분이’로 자연스럽게 이어, 파송의 행위가 앞의 이유절을 완결하도록 했습니다.
theological_decisions:
- issue: παρ’ αὐτοῦ εἰμι의 신학적 뉘앙스
  chosen_reading: ‘내가 그분에게서 왔고’로 옮겨, 단순한 이동이 아니라 아버지로부터의 출처와 기원을 드러냈습니다.
  alternative_readings:
  - 나는 그분에게서 있습니다
  - 나는 그분으로부터 왔습니다
  rationale: 본문은 예수와 아버지의 관계를 단순한 장소 표현으로 축소하지 않으면서도, 출처와 파송의 긴장을 함께 유지합니다.
  doctrine_reference: Translation philosophy §3; 요한복음의 파송-기원 주제
