    text: 또는 “내가 그분에게서 왔고 그분이 나를 보내셨다는 것.” 그리스어 접속사 ὅτι는 내용(“~라는 것”)이나 이유(“왜냐하면”)를 나타낼 수 있습니다. 여기서는 문맥상 이유를 나타내는 것으로 보는 것이 더 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분에게서 온” 또는 “그분의 곁(임재)에서 온.” παρά와 속격의 결합은 단순한 출처뿐 아니라 기원 또는 그분의 임재로부터 비롯됨을 나타낼 수 있습니다.
    reason: alternative_reading
