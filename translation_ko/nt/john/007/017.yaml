id: JHN.7.17
reference: John 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
  footnotes:
  - marker: a
    text: Or 'on my own' or 'on my own authority.' The Greek literally says 'from myself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 그의 뜻을 행하고자 하면, 이 가르침이 하나님에게서 온 것인지, 아니면 내가 스스로[a] 말하는 것인지 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나 자신에게서’입니다. ‘내 뜻대로’ 또는 ‘내 자신의 권위로’라고 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  english_pob_choice: If anyone wants
  chosen_korean: 누구든지 … 하려 하면
  alternatives_korean:
  - 누구든지 … 하고자 하면
  - 누구든지 … 원하면
  lexicon: BDAG
  rationale: 조건절의 일반적 가능성을 살리면서, 현대 한국어에서 자연스러운 가정 표현으로 옮겼습니다. θέλω의 의지성을 반영하되 지나치게 딱딱하지 않게 처리했습니다.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  english_pob_choice: to do his will
  chosen_korean: 그의 뜻을 행하려
  alternatives_korean:
  - 그의 뜻을 하려
  - 그의 뜻을 실천하려
  lexicon: BDAG
  rationale: ποιεῖν with θέλημα의 관용적 결합을 반영해 ‘뜻을 행하다’로 옮겼습니다. ‘뜻’을 사용해 의지/원함의 의미를 살리고, ‘행하다’로 실행성을 드러냈습니다.
- source_word: γνώσεται περὶ τῆς διδαχῆς
  english_pob_choice: he will know about the teaching
  chosen_korean: 그 교리가 … 알게 될 것입니다
  alternatives_korean:
  - 그 가르침에 대해 알게 될 것입니다
  - 그 교훈에 대해 알게 될 것입니다
  lexicon: BDAG
  rationale: διδαχή는 여기서 예수의 가르침 자체를 가리키므로 ‘교리’보다도 넓은 ‘가르침’이 가능하지만, 문맥상 논의 대상의 내용성을 살려 ‘교리’로 옮겼습니다. 다만 본문이 특정한 교회 교의 용어를 뜻하는 것은 아니므로 해석상 긴장을 피하기 위해 주어 위치를 자연스럽게 조정했습니다.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  english_pob_choice: whether it is from God
  chosen_korean: 하나님에게서 나온 것인지
  alternatives_korean:
  - 하나님에게서 온 것인지
  - 하나님으로부터 온 것인지
  lexicon: BDAG
  rationale: ἐκ는 출처/기원을 나타내므로 ‘-에게서 나온 것’으로 옮겼습니다. ἐστιν을 단순한 존재 동사로 두면서도 한국어에서 자연스럽게 출처를 드러내기 위해 ‘나온 것’으로 처리했습니다.
- source_word: ἀπ’ ἐμαυτοῦ λαλῶ
  english_pob_choice: I am speaking from myself
  chosen_korean: 내가 스스로 말하는 것인지
  alternatives_korean:
  - 내가 나 자신에게서 말하는 것인지
  - 내가 제 뜻대로 말하는 것인지
  lexicon: BDAG
  rationale: ἀπ’ ἐμαυτοῦ의 직역인 ‘나 자신에게서’도 가능하지만, 한국어에서 어색하지 않으면서 자발적 기원/독자성을 드러내는 ‘스스로’로 옮겼습니다. λαλῶ는 현재 시제로서 대화 상황에 맞게 ‘말하는’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: τὸ θέλημα αὐτοῦ의 대명사 지시 대상
  chosen_reading: 주어진 대명사 ‘그의’는 본문에서 명시적 선행사를 반복하지 않고 유지했습니다.
  alternative_readings:
  - ‘하나님의 뜻’으로 명시할 수 있습니다.
  rationale: 문맥상 지시 대상은 하나님이 분명하지만, 원문은 대명사를 사용하므로 한국어도 그 긴장을 보존했습니다. 본문이 말하는 절제된 방식—지시 대상을 완전히 풀지 않는 방식—을 유지하는 것이 출처에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ἀπ’ ἐμαυτοῦ의 독자성/권위 함의
  chosen_reading: 주본문은 ‘내가 스스로 말하는 것인지’로 두어, 본문의 출처-기원 언어를 보존했습니다.
  alternative_readings:
  - ‘내 권한으로 말하는 것인지’
  - ‘내 임의로 말하는 것인지’
  rationale: 본문의 직접 표지는 ‘출처’이지, 해설적 확장인 ‘권한’ 그 자체가 아닙니다. 따라서 원문 표현을 보존하고, 권위의 함의는 독자가 문맥에서 파악하도록 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
