  source_fidelity: 핵심 조건문과 두 출처의 대조는 보존되어 있습니다. 그러나 διδαχή를 ‘교리’로 옮기면 특정 교회 교의 체계라는 현대 한국어의 좁고 전문적인 뉘앙스가 더해집니다. 여기서는 예수께서 말씀하신 가르침을 가리키므로 ‘가르침’이 더 충실합니다.
  naturalness: ‘그 교리가 하나님에게서 나온 것인지’보다 ‘이 가르침이 하나님에게서 온 것인지’가 현대 표준 한국어에서 자연스럽고, 논의 중인 가르침을 가리키는 문맥도 잘 드러냅니다. ‘내가 스스로 말하는 것인지’는 ἀπ’ ἐμαυτοῦ의 독자적 출처라는 함의를 자연스럽게 전달합니다.
  terminology: ‘가르침’은 διδαχή에 적절하며 교파적·체계신학적 의미를 불필요하게 부과하지 않습니다. ‘하나님’과 ‘뜻을 행하다’는 일관되고 적절합니다. 각주도 본문의 ‘스스로’에 직접 연결하고, 대안의 의미를 더 정확하고 자연스럽게 고쳐야 합니다.
