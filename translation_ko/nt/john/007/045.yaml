id: JHN.7.45
reference: John 7:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
  footnotes:
  - marker: a
    text: Or “they said to them.” The Greek explicitly uses a demonstrative (“those men”), likely for emphasis, referring to the chief priests and Pharisees.
    reason: lexical_alternative
  - marker: b
    text: Or “Why did you not lead him here?” The verb can mean “lead” or “bring”; here “bring” best fits the context of officers sent to arrest Jesus.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 경비병들이 대제사장들과 바리새인들에게 왔습니다. 그러자 대제사장들과 바리새인들이 경비병들에게 말했습니다. “왜 그를 데려오지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데려오다’는 ἠγάγετε를 체포하러 갔다가 대상자를 데리고 돌아오는 문맥에 맞게 옮긴 것입니다. 문맥에 따라 ‘인도하다’ 또는 ‘데리고 오다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπηρέται
  english_pob_choice: officers
  chosen_korean: 경비병들
  alternatives_korean:
  - 관리들
  - 하속들
  - 경찰들
  lexicon: BDAG
  rationale: 요한복음의 문맥에서 예수를 붙잡으러 보낸 성전 측의 실무 인원을 가리키므로, 현대 한국어로는 기능을 드러내는 ‘경비병들’이 자연스럽고 오해가 적습니다.
- source_word: ἀρχιερεῖς
  english_pob_choice: chief priests
  chosen_korean: 대제사장들
  alternatives_korean:
  - 주된 제사장들
  - 수제사장들
  lexicon: BDAG
  rationale: 복수형 집단 명칭을 표준적으로 옮겨, 종교 권위층을 가리키는 역사적 호칭을 유지했습니다.
- source_word: ἐκεῖνοι
  english_pob_choice: those men
  chosen_korean: 그
  alternatives_korean:
  - 그 사람들
  - 그들
  lexicon: BDAG
  rationale: 그리스어의 지시적 강조는 한국어에서 앞선 명사구를 굳이 반복하지 않고 ‘그런데’와 주어 위치로 자연스럽게 드러내되, 문맥상 말하는 주체가 대제사장들과 바리새인들임을 유지했습니다.
- source_word: ἠγάγετε
  english_pob_choice: did you not bring
  chosen_korean: 데려오지 않았습니까
  alternatives_korean:
  - 데리고 오지 않았습니까
  - 가져오지 않았습니까
  - 인도하지 않았습니까
  lexicon: BDAG
  rationale: 체포 대상인 예수를 공적으로 연행해 오는 상황이므로, 단순한 이동보다 ‘데려오다’가 문맥상 적합합니다.
theological_decisions:
- issue: 예수 체포 임무 실패에 대한 문답의 어조
  chosen_reading: 질문은 단순 정보 요청이 아니라 명령 불이행을 추궁하는 뉘앙스를 살려, 직설적인 반문으로 옮겼습니다.
  alternative_readings:
  - 왜 그를 데려오지 않았소?
  - 왜 그를 끌고 오지 않았습니까?
  rationale: 장면의 긴장과 권위적 분위기를 보존해야 하므로, 평서적 설명보다 추궁하는 질문의 압박감을 드러내는 표현이 원문 효과에 가깝습니다.
  doctrine_reference: 본문의 서사적 기능과 화행 분석
- issue: 직접화법의 한국어 높임말
  chosen_reading: 직접 인용문 안은 권위자들이 하급자에게 묻는 상황이므로 합쇼체의 질문형을 사용했습니다.
  alternative_readings:
  - 반말체
  - 해요체
  rationale: 현대 한국어 독자가 인물 관계를 즉시 파악할 수 있도록, 외부 서술은 합쇼체로 유지하고 인용문도 상황에 맞는 격식을 적용했습니다.
  doctrine_reference: Korean register and discourse convention
