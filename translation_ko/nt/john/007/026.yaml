review_pass:
  verdict: revise
  source_fidelity: ‘아무도’는 그리스어의 정해진 복수 주어 ‘그들’을 보편적 주어로 넓힙니다. 또한 ‘말씀하고’는 원문의 중립적인 λαλεῖ에 존대의 뉘앙스를 더합니다. 이를 각각 ‘그들은’과 ‘말하고’로 고치면 원문의 주어와 어조를 더 충실히 반영합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘보십시오’는 주의를 환기하는 ἴδε를 적절히 살리며, ‘혹시 … 것입니까?’는 μήποτε가 나타내는 놀랍고 조심스러운 추측을 무리 없이 전달합니다.
  terminology: ὁ χριστός는 이 문맥에서 칭호이므로 ‘메시아’가 적절합니다. 각주에서 ‘그리스도’를 번역 대안으로 제시한 것도 허용됩니다.
  issues:
  - severity: medium
    issue: ‘아무도’가 복수대명사 ‘그들’을 보편적 주어로 바꿉니다.
    rationale: οὐδὲν αὐτῷ λέγουσιν의 주어는 ‘아무도’가 아니라 문맥상 특정된 ‘그들’입니다. ‘아무도’는 원문보다 넓은 의미를 만들고, 지도자들이 아무 말도 하지 않는다는 이어지는 추측과의 연결도 약화시킵니다.
  - severity: low
    issue: ‘말씀하고’는 원문에 없는 예수에 대한 존대를 표시합니다.
    rationale: λαλεῖ는 중립적으로 ‘말하다’입니다. 합쇼체의 문장 종결은 유지하되 동사 자체의 주체 존대는 피하는 편이 원문 어조에 더 가깝습니다.
  revised_text: 「보십시오, 그가 공개적으로 말하고 있는데도 그들은 그에게 아무 말도 하지 않습니다. 혹시 지도자들이 정말로 이 사람이 메시아임을 알고 있는 것입니까?」[a]
