id: JHN.7.26
reference: John 7:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
  footnotes:
  - marker: a
    text: Or, 'Could it be that the rulers really know that this is the Christ?'
    reason: alternative_reading
translation:
  language: ko
  text: 「보십시오, 그가 공개적으로 말씀하고 있는데도 아무도 그에게 아무 말도 하지 않습니다. 혹시 지도자들이 정말로 이 사람이 메시아임을 아는 것입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘지도자들이 정말로 이 사람이 그리스도임을 아는 것입니까?’
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδε
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: BDAG
  rationale: 화자의 주의를 끌어 대상을 가리키는 감탄사 성격을 살려, 현대 한국어에서 자연스러운 명령형 관찰 표현인 ‘보십시오’로 옮겼습니다.
- source_word: παρρησίᾳ
  english_pob_choice: openly
  chosen_korean: 공개적으로
  alternatives_korean:
  - 드러내 놓고
  - 대놓고
  - 담대하게
  lexicon: BDAG
  rationale: 여기서는 담대함보다 공적·공개적 발화의 뉘앙스가 핵심이므로 ‘공개적으로’가 가장 직접적입니다.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  english_pob_choice: they say nothing to him
  chosen_korean: 아무도 그에게 아무 말도 하지 않습니다
  alternatives_korean:
  - 그에게 아무 말도 하지 않습니다
  - 그를 향해 아무 말도 하지 않습니다
  lexicon: BDAG
  rationale: αὐτῷ를 그대로 살려 ‘그에게’로 옮기고, 문맥상 주어가 집단임을 자연스럽게 드러내기 위해 ‘아무도’로 표현했습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 메시아이신 분
  lexicon: 'DOCTRINE.md: Χριστός → Messiah when titular'
  rationale: 이 절의 Χριστός는 고유명이라기보다 유대적 왕-구원자 칭호이므로, 프로젝트 기본 용례에 따라 ‘메시아’로 유지했습니다.
theological_decisions:
- issue: Χριστός의 번역을 칭호로 볼지 이름처럼 볼지
  chosen_reading: ‘메시아’로 번역하여 군중의 추측이 지닌 칭호적 의미를 보존했습니다.
  alternative_readings:
  - ‘그리스도’로 음역
  - ‘메시아’와 ‘그리스도’를 병기
  rationale: 문맥상 사람들은 예수를 호칭적으로 식별하고 있으므로, 유대적 기대를 드러내는 ‘메시아’가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, Χριστός → ''Messiah'' where title; ''Christ'' where name-like'
