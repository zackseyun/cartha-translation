revisions:
- from: 그러므로 유대인들은 놀라며 말했습니다. “이 사람이 어떻게 글을 알지 못한 채 글을 압니까?”[a][b]
  to: 그러자 유대인들[a]은 놀라며 말했습니다. “이 사람은 배우지 않았는데 어떻게 글을 압니까?”[b]
  rationale: The revision corrects the central semantic error by rendering μὴ μεμαθηκώς as ‘배우지 않았는데.’ It preserves the source’s direct question, the ongoing astonishment, and the unqualified wording ‘유대인들,’ while relocating both footnote anchors to the words explained.
