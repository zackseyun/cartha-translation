source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
  footnotes:
  - marker: a
    text: Or “How does this man have such learning?” Greek “know letters.”
    reason: lexical_alternative
  - marker: b
    text: In John, “the Jews” here refers contextually to Jesus’ Jewish interlocutors/opponents in Jerusalem, likely including Judean authorities, not to the Jewish people as a whole.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 유대인들[a]은 놀라며 말했습니다. “이 사람은 배우지 않았는데 어떻게 글을 압니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 요한복음에서 여기의 “유대인들”은 문맥상 예루살렘에서 예수님과 대화하거나 대립하던 유대인들을 가리키며, 유대 당국자들을 포함했을 가능성이 있습니다. 이는 유대 민족 전체를 가리키는 말은 아닙니다.
    reason: cultural_note
  - marker: b
    text: 또는 “이 사람이 배우지 않았는데 어떻게 이런 학식을 갖추었습니까?” 헬라어를 직역하면 “글을 압니까?”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  english_pob_choice: were marveling
  chosen_korean: 놀라며
  alternatives_korean:
  - 경탄하며
  - 놀라고
  lexicon: BDAG
  rationale: 미완료시제가 보이는 지속적 반응을 한국어의 연결형 ‘-며’로 살리고, 갑작스런 단회 반응보다 진행 중인 놀람을 자연스럽게 드러냅니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들은
  alternatives_korean:
  - 유대 사람들은
  - 유대 지도자들은
  lexicon: BDAG
  rationale: 본문의 표면적 표현을 따라 ‘유대인들’로 옮기되, 한국어에서는 주어를 자연스럽게 드러내기 위해 복수 주격 표지를 붙였습니다.
- source_word: γράμματα
  english_pob_choice: letters
  chosen_korean: 글
  alternatives_korean:
  - 문자
  - 학문
  - 학식
  lexicon: BDAG
  rationale: 직역하면 ‘글’이지만, 이 문맥에서는 문자 지식/학문적 소양을 가리키므로 한국어에서 가장 간결하게 문맥을 드러내는 ‘글’을 택했습니다. 본문의 질문 형식은 그대로 유지했습니다.
- source_word: μὴ μεμαθηκώς
  english_pob_choice: without having studied
  chosen_korean: 글을 알지 못한 채
  alternatives_korean:
  - 배운 적 없이
  - 공부하지도 않고
  lexicon: BDAG
  rationale: 완료분사와 부정은 예수께 정식 교육이 없다는 뜻을 담고 있어, ‘배우지 않았다’보다 ‘글을 알지 못한 채’가 원문의 반어적 긴장과 ‘γράμματα’의 관용적 뉘앙스를 함께 살립니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 지시 대상
  chosen_reading: 유대인들
  alternative_readings:
  - 유대 지도자들
  - 유대 사람들
  rationale: 본문의 직접 표현을 유지하여 원문의 어휘를 앞세우고, 문맥상 특정 집단을 지시하는 표현이라는 점은 본문 내부에서 충분히 이해되도록 두었습니다.
  doctrine_reference: 원어 우선 번역 원칙; 본문 내 문맥 해석 보존
