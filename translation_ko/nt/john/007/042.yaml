id: JHN.7.42
reference: John 7:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
  footnotes:
  - marker: a
    text: Or, 'the Christ.' The Greek title is ὁ χριστός.
    reason: alternative_reading
translation:
  language: ko
  text: “성경이 다윗의 씨에서, 그리고 다윗이 있었던 그 마을인 베들레헴에서 메시아가 나온다고 말하지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그리스도.’ 그리스어 칭호는 ὁ χριστός입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  english_pob_choice: the Scripture
  chosen_korean: 성경
  alternatives_korean:
  - 그 성경
  - 그 기록
  lexicon: BDAG
  rationale: 요한복음에서 ἡ γραφή는 권위 있는 성경 전체를 가리키므로, 한국어에서는 관용적이면서도 권위감을 살리는 ‘성경’으로 옮겼습니다.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  english_pob_choice: from the offspring of David
  chosen_korean: 다윗의 씨에서
  alternatives_korean:
  - 다윗의 후손에게서
  - 다윗의 자손에게서
  - 다윗의 계통에서
  lexicon: BDAG
  rationale: σπέρμα는 여기서 혈통/계보를 뜻하므로, 직역에 가까운 ‘씨’로 살리되 한국어 어순에 맞게 ‘다윗의 씨에서’로 옮겼습니다.
- source_word: ἀπὸ Βηθλέεμ τῆς κώμης
  english_pob_choice: from Bethlehem, the village
  chosen_korean: 베들레헴에서, 그 마을인
  alternatives_korean:
  - 베들레헴에서, 그 촌락인
  - 베들레헴이라는 마을에서
  lexicon: BDAG
  rationale: κώμη는 도시가 아닌 작은 마을이므로 ‘마을’로 옮겼고, 관계절을 붙여 베들레헴을 설명하는 원문의 구조를 반영했습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 그 메시아
  lexicon: BDAG
  rationale: 이 문맥에서 Χριστός는 고유명사보다 유대적 왕적 칭호로 기능하므로, 프로젝트 기본어휘에 따라 ‘메시아’로 번역했습니다.
theological_decisions:
- issue: Χριστός의 칭호 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 문맥이 ‘예수의 이름’이 아니라 성경이 말한 기대된 구원자 칭호를 논하는 자리이므로, 칭호성을 드러내는 ‘메시아’가 더 정확합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → 메시아 (as title)'
