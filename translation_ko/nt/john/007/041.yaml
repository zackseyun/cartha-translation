translation:
  language: ko
  text: 다른 사람들은 “이 사람이 메시아입니다”라고 말했습니다. 그런데 어떤 이들은 “메시아가 갈릴리에서 나오지 않지 않습니까?”라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리스도.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι
  english_pob_choice: Others
  chosen_korean: 다른 사람들은
  alternatives_korean:
  - 어떤 이들은
  - 다른 이들은
  lexicon: BDAG
  rationale: 대조되는 군중 내 집단을 자연스럽게 드러내면서, 한국어에서 반복을 피하고 유려하게 읽히도록 했습니다.
- source_word: Οὗτός ἐστιν ὁ χριστός
  english_pob_choice: This is the Messiah
  chosen_korean: 이 사람이 메시아입니다
  alternatives_korean:
  - 이분이 메시아입니다
  - 이것이 메시아입니다
  lexicon: BDAG
  rationale: 지시대명사 Οὗτός는 여기서 인물 식별이므로 ‘이 사람’으로 옮기고, χριστός는 제목으로서 ‘메시아’를 사용했습니다.
- source_word: οἱ δὲ
  english_pob_choice: But some
  chosen_korean: 그런데 어떤 이들은
  alternatives_korean:
  - 하지만 다른 사람들은
  - 그런데 다른 이들은
  lexicon: BDAG
  rationale: δέ의 대조를 살리되, 한국어에서 같은 명사를 반복하는 것보다 ‘어떤 이들은’이 자연스럽고 구분이 분명합니다.
- source_word: Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
  english_pob_choice: The Messiah doesn’t come from Galilee, does he?
  chosen_korean: 메시아가 갈릴리에서 나오지 않지 않습니까?
  alternatives_korean:
  - 메시아가 갈릴리에서 오지 않지 않습니까?
  - 메시아가 갈릴리에서 옵니까?
  lexicon: BDAG
  rationale: ἐκ τῆς Γαλιλαίας는 출신/기원을 나타내므로 ‘갈릴리에서 나오다’가 가장 자연스럽고, μή가 이끄는 반어적 질문의 부정 기대를 종결형 의문으로 반영했습니다.
theological_decisions:
- issue: Χριστός의 번역어
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 절에서 χριστός는 논쟁 중인 칭호이므로, 헬라어 표기 음역보다 히브리적 기대를 드러내는 ‘메시아’가 문맥상 더 직접적입니다.
