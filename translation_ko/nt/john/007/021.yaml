id: JHN.7.21
reference: John 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
  footnotes:
  - marker: a
    text: Or “deed.” The Greek word can mean either, but “work” preserves John's recurring use of the term for Jesus' actions.
    reason: lexical_alternative
  - marker: b
    text: Likely referring back to Jesus' healing of the lame man on the Sabbath in John 5:1–18.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그들에게 대답하여 말씀하셨습니다. “내가 한 가지 일[a][b]을 했는데, 너희는 모두 놀랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일’은 ‘행위’로도 옮길 수 있습니다. 그러나 요한복음에서 예수님의 행위를 가리켜 반복해서 쓰이는 표현을 살리기 위해 ‘일’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 아마도 요한복음 5:1–18에 나오는, 안식일에 다리 저는 사람을 고치신 일을 가리키는 듯합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 이르셨습니다
  alternatives_korean:
  - 대답하셨고 말씀하셨습니다
  - 대답하여 말씀하셨습니다
  lexicon: BDAG
  rationale: 헬라어의 관용적 이중 동사구를 자연스럽게 살리되, 한국어에서는 중복을 줄이기 위해 ‘대답하여 이르셨습니다’로 옮겨 답변의 시작을 분명히 했습니다.
- source_word: Ἓν ἔργον
  english_pob_choice: one work
  chosen_korean: 한 가지 일
  alternatives_korean:
  - 한 일
  - 하나의 일
  lexicon: BDAG
  rationale: ἔργον의 요한복음 내 신학적 ‘일/행위’ 의미를 의식하면서도, 한국어에서 문맥상 자연스러운 표현을 위해 ‘한 가지 일’로 옮겼습니다.
- source_word: ἐποίησα
  english_pob_choice: I did
  chosen_korean: 했습니다
  alternatives_korean:
  - 행했습니다
  - 해냈습니다
  lexicon: BDAG
  rationale: 단순 과거를 자연스럽게 살려 ‘했습니다’로 옮겼으며, 과도하게 격식을 높인 ‘행했습니다’보다 구어적이지 않으면서도 본문의 평이한 어조를 유지합니다.
- source_word: πάντες θαυμάζετε
  english_pob_choice: you all marvel
  chosen_korean: 너희는 모두 놀라고 있습니다
  alternatives_korean:
  - 너희는 모두 놀랍니다
  - 너희는 모두 경이로워합니다
  lexicon: BDAG
  rationale: 2인칭 복수와 현재형의 지속적 반응을 살려 ‘너희는 모두’와 진행적 현재인 ‘놀라고 있습니다’로 옮겨, 단순한 감탄보다 당혹과 놀라움이 섞인 반응을 드러냈습니다.
theological_decisions:
- issue: ἔργον의 의미를 한국어에서 어떻게 보존할지
  chosen_reading: ‘한 가지 일’로 옮기되, 문맥상 예수의 특정 행위를 가리키는 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘한 일’
  - ‘한 행위’
  rationale: 요한복음에서 ἔργον은 예수의 표적적 행위를 가리키는 경우가 많지만, 이 절만으로는 독자에게 과도한 신학적 해설을 넣지 않는 것이 적절하므로, 본문은 간결하게 두고 문맥적 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
