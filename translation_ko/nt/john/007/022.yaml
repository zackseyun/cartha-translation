id: JHN.7.22
reference: John 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
  footnotes:
  - marker: a
    text: Or 'not because it is from Moses, but from the fathers.' The parenthetical clause explains that circumcision did not originate with Moses but with the patriarchs.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 모세는 여러분에게 할례를 주셨습니다—할례가 모세에게서 비롯된 것이 아니라 조상들에게서 비롯된 것이기는 하지만—여러분은 안식일에도 한 남자에게 할례를 행합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 이 때문에
  alternatives_korean:
  - 그러므로
  - 이런 까닭에
  lexicon: BDAG
  rationale: 앞선 논지를 근거로 삼는 설명적 연결어로, 요한복음의 논증 흐름을 자연스럽게 살리면서도 원문의 인과를 유지합니다.
- source_word: τὴν περιτομήν
  english_pob_choice: circumcision
  chosen_korean: 할례
  alternatives_korean:
  - 포경
  - 할례 의식
  lexicon: BDAG
  rationale: 유대 전승과 율법 맥락에서의 제도적 용어이므로 표준 교회·성경 용례인 ‘할례’를 사용했습니다.
- source_word: ἐκ τοῦ Μωϋσέως … ἐκ τῶν πατέρων
  english_pob_choice: not that it is from Moses, but from the fathers
  chosen_korean: 그것이 모세에게서 난 것이 아니라 조상들에게서 난 것입니다
  alternatives_korean:
  - 모세에게서 비롯된 것이 아니라 조상들에게서 비롯된 것입니다
  - 모세에게서 나온 것이 아니라 조상들에게서 나온 것입니다
  lexicon: BDAG
  rationale: ἐκ의 출처/기원을 한국어의 ‘~에게서 난 것’으로 옮겨, 제도적 기원에 대한 설명이라는 점을 분명히 했습니다. ‘조상들’은 족장들을 가리키는 성경적 표현을 유지합니다.
- source_word: ἐν σαββάτῳ
  english_pob_choice: on the Sabbath
  chosen_korean: 안식일에도
  alternatives_korean:
  - 안식일에
  - 안식일 동안에도
  lexicon: BDAG
  rationale: 관용적 시간 표현을 자연스럽게 살리되, 뒤의 현재형 관습 진술과 맞물려 실제 준행 상황을 드러내도록 했습니다.
theological_decisions:
- issue: ‘조상들’의 범위
  chosen_reading: 여기서 ‘조상들’은 모세보다 앞선 족장들, 곧 할례의 기원을 가진 언약 조상들을 가리킵니다.
  alternative_readings:
  - 이스라엘의 선조 전반을 넓게 가리키는 표현
  rationale: 예수님의 논지는 역사적 기원에 있습니다. 할례가 모세 율법보다 앞선 제도라는 점을 드러내야 문맥의 논증력이 보존됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
