  source_fidelity: ‘알지 못하니’는 그리스어의 한정적 현재분사(‘율법을 알지 못하는’)를 이유·근거를 나타내는 연결 어미로 바꾸어, 원문에 없는 인과 뉘앙스를 더할 수 있습니다. 또한 ἐπάρατοί εἰσιν은 복수 술어이므로 집단 구성원을 가리키는 ‘저주받은 자들입니다’가 형태와 의미를 더 직접적으로 반영합니다.
  naturalness: ‘율법을 알지 못하는 이 무리’와 ‘저주받은 자들입니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 본문 화자의 경멸적이고 단정적인 어조를 유지합니다.
  terminology: νόμος는 이 문맥에서 유대교의 율법/토라이므로 ‘율법’이 적절합니다. 각주 표지는 내용과 연결되는 낱말 뒤에 바로 배치해야 하며, 기존 초안은 a·b의 표지 순서가 각주 내용과 반대로 붙어 있습니다.
