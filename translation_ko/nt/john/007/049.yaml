  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
  footnotes:
  - marker: a
    text: Or 'under a curse.'
    reason: lexical_alternative
  - marker: b
    text: '''The law'' refers to the Jewish law/Torah.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 율법[b]을 알지 못하는 이 무리는 저주받은 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주 아래 있는 자들입니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 유대인의 율법, 곧 토라를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 권위자들의 판단과 대조되는 반대 전환을 자연스러운 한국어 역접 접속사로 옮겼습니다.
- source_word: ὁ ὄχλος οὗτος
  english_pob_choice: this crowd
  chosen_korean: 이 무리
  alternatives_korean:
  - 이 군중
  - 이 사람들
  lexicon: BDAG
  rationale: ὄχλος는 여기서 특정 집단을 가리키는 군중/무리로 읽히며, 한국어에서는 ‘이 무리’가 가장 자연스럽고 경멸적 뉘앙스를 과도하게 더하지 않습니다.
- source_word: ὁ μὴ γινώσκων τὸν νόμον
  english_pob_choice: which does not know the law
  chosen_korean: 율법을 알지 못하니
  alternatives_korean:
  - 율법을 모르는
  - 율법을 알지 못하는
  lexicon: BDAG
  rationale: 현재분사절의 설명 기능을 한국어 관용에 맞게 풀어 ‘알지 못하니’로 처리해, 무리의 상태를 서술하면서도 문장을 매끄럽게 만들었습니다. νόμος는 유대인의 토라/율법을 가리키므로 ‘율법’으로 옮겼습니다.
- source_word: ἐπάρατοί εἰσιν
  english_pob_choice: is accursed
  chosen_korean: 저주 아래 있습니다
  alternatives_korean:
  - 저주받았습니다
  - 저주를 받은 자들입니다
  lexicon: BDAG
  rationale: ἐπάρατος의 핵심은 단순한 욕설이 아니라 ‘저주를 받은/저주 아래 있는’ 상태이므로, 한국어에서는 상태성을 살린 표현을 택했습니다. 공동체적 낙인을 드러내면서도 현대 독자가 이해하기 쉽습니다.
theological_decisions:
- issue: 저주 선언의 강도를 완화할지 여부
  chosen_reading: 화자들의 적대적 단정을 그대로 보존하고, 서술자 해설처럼 거리두기 표현을 추가하지 않았습니다.
  alternative_readings:
  - ‘그들은 저주를 받았다고 말합니다’처럼 발화 거리를 두는 번역
  - ‘저주를 받은 것입니다’처럼 더 완곡하게 표현하는 번역
  rationale: 본문은 바리새인들의 직접적 판단을 제시하므로, 그 신학적 긴장을 약화하지 않고 원문의 공격성을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 본문 화자의 판단과 서술자의 승인 여부를 구분하되, 텍스트가 주는 긴장을 유지함.
