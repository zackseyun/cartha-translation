  - severity: medium
    issue: 각주 표지와 각주 내용의 연결이 뒤바뀜
    rationale: a는 ‘저주 아래 있다’라는 어휘 대안인데 ‘율법’ 뒤에, b는 율법의 문화적 설명인데 문장 끝에 붙어 있습니다. 각각 해당 표현 뒤로 옮겨야 합니다.
  - severity: low
