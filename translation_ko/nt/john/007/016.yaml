id: JHN.7.16
reference: John 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
  footnotes:
  - marker: a
    text: Or, “but belongs to the one who sent me,” highlighting source and possession in the Greek genitive expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 대답하셔서 말씀하셨습니다. “내 가르침은 내 것이 아니라, 나를 보내신 분의 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 소유와 출처를 드러내는 속격 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ... καὶ εἶπεν
  english_pob_choice: So Jesus answered them, “
  chosen_korean: 예수께서 그들에게 대답하셔서 말씀하셨습니다.
  alternatives_korean:
  - 그래서 예수께서 그들에게 대답하여 말씀하셨습니다.
  - 예수께서 그들에게 대답하셨습니다.
  lexicon: SBLGNT
  rationale: οὖν의 연결성과 ἀπεκρίθη/εἶπεν의 보고 동사를 자연스럽게 살려, 현대 한국어에서 가장 읽기 쉬운 서술형으로 옮겼습니다.
- source_word: Ἡ ἐμὴ διδαχή
  english_pob_choice: My teaching
  chosen_korean: 내 가르침
  alternatives_korean:
  - 내 교훈
  - 나의 가르침
  lexicon: BDAG
  rationale: διδαχή는 여기서 기술적 ‘교리’보다 예수의 발화 내용 자체를 가리키므로, ‘가르침’이 가장 직접적입니다.
- source_word: οὐκ ἔστιν ἐμὴ
  english_pob_choice: is not mine
  chosen_korean: 내 것이 아니라
  alternatives_korean:
  - 내 것이 아닙니다
  - 내 소유가 아니라
  lexicon: BDAG
  rationale: 소속과 출처의 대비를 살리기 위해 ‘내 것’이라는 소유 표현을 유지했습니다. 한국어에서는 문장 흐름상 ‘내 것이 아니라’가 가장 압축적입니다.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  english_pob_choice: but his who sent me
  chosen_korean: 나를 보내신 분의 것입니다
  alternatives_korean:
  - 나를 보내신 분께 속한 것입니다
  - 나를 보내신 분에게서 난 것입니다
  lexicon: BDAG
  rationale: πέμψαντός με의 ‘보내다’ 동사를 그대로 살리되, 소유/출처의 대비를 한국어에서 자연스럽게 드러내기 위해 ‘~의 것입니다’로 마무리했습니다.
theological_decisions:
- issue: 예수의 가르침의 기원과 권위
  chosen_reading: 예수께서 자신의 가르침이 자립적으로 나온 것이 아니라 자신을 보내신 분에게서 온 것이라고 말씀하신 것으로 유지했습니다.
  alternative_readings:
  - 단순히 인간 교사가 자신의 소유권을 부인하는 말로 축소하는 해석
  - 예수와 보내신 분 사이의 구별을 과도하게 분리하는 해석
  rationale: 본문의 핵심은 가르침의 출처와 소유의 대비이며, 요한복음 문맥에서 이는 아버지와 아들의 사명 일치를 드러냅니다. 번역은 그 긴장을 풀지 않고 보존합니다.
  doctrine_reference: 니케아 신경(381), 칼케돈 정의(451)
