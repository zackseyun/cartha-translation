translation:
  language: ko
  text: 이에 예수께서 그들에게 대답하여 말씀하셨습니다. “내 가르침은 내 것이 아니라 나를 보내신 분의 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
