id: JHN.7.43
reference: John 7:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: ko
  text: 그러므로 무리 가운데 그 때문에 분열이 생겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  english_pob_choice: division
  chosen_korean: 분열
  alternatives_korean:
  - 나뉨
  - 분쟁
  - 갈라짐
  lexicon: BDAG
  rationale: 사람들 사이에 생긴 갈라진 상태를 가리키므로, 현대 한국어에서 자연스럽고 사회적 균열을 잘 드러내는 ‘분열’을 택했습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러자
  - 그러니
  lexicon: BDAG
  rationale: 앞선 논의를 바탕으로 한 결과를 나타내는 연결이므로, 인과와 추론을 함께 살릴 수 있는 ‘그러므로’로 옮겼습니다.
- source_word: ἐν τῷ ὄχλῳ
  english_pob_choice: in the crowd
  chosen_korean: 무리 가운데
  alternatives_korean:
  - 무리 안에서
  - 사람들 가운데
  - 군중 가운데
  lexicon: BDAG
  rationale: ὄχλος는 단순한 인원 집합보다 ‘무리/군중’의 뉘앙스가 강하므로, 집합 내부에서 일어난 분열을 드러내는 ‘무리 가운데’로 옮겼습니다.
- source_word: δι’ αὐτόν
  english_pob_choice: because of him
  chosen_korean: 그로 말미암아
  alternatives_korean:
  - 그 때문에
  - 그를 두고
  - 그로 인해
  lexicon: BDAG
  rationale: διά + 대격의 원인 관계를 직결적으로 드러내면서도, 본문이 가리키는 인물에게 생긴 분열이라는 의미를 자연스럽게 살리는 표현으로 처리했습니다.
theological_decisions:
- issue: αὐτόν의 지시 대상
  chosen_reading: ‘그’는 문맥상 예수님을 가리키지만, 본문에서는 대명사를 유지합니다.
  alternative_readings:
  - 예수님 때문에
  - 그분 때문에
  rationale: 문맥상 예수님을 뜻하지만, 한국어 본문은 원문의 지시 대명사 기능을 보존하는 편이 더 직접적이며 해석을 과도하게 앞당기지 않습니다.
  doctrine_reference: 문맥 기반 지시대상 보존
- issue: σχίσμα의 강도
  chosen_reading: 단순한 의견 차이가 아니라 실제로 무리가 갈라지는 상태로 번역합니다.
  alternative_readings:
  - 의견이 엇갈림
  - 논쟁
  rationale: 원어는 내부 분열의 결과를 가리키므로, 약화된 ‘의견 차이’보다 공동체적 균열을 드러내는 번역이 본문의 힘을 더 잘 반영합니다.
  doctrine_reference: 사회적 분열의 실재성 유지
