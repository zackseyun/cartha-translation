id: JHN.7.50
reference: John 7:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
  footnotes:
  - marker: a
    text: Or 'who had come to him before.' The pronoun 'him' refers to Jesus in the broader context.
    reason: lexical_alternative
translation:
  language: ko
  text: 니고데모가 그들에게 말했습니다. 그분께 먼저 왔던 사람, 곧 그들 가운데 한 사람인 그가 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분’은 문맥상 예수님을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말합니다
  lexicon: SBLGNT
  rationale: 헬라어 현재형 서술용법을 한국어에서는 자연스러운 과거 서술로 옮겼습니다.
- source_word: Νικόδημος
  english_pob_choice: Nicodemus
  chosen_korean: 니고데모
  alternatives_korean:
  - 니고데무스
  lexicon: 표준 외래어 표기
  rationale: 인명은 한국어 성경 관용 표기인 니고데모를 따랐습니다.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  english_pob_choice: the one who had come to him earlier
  chosen_korean: 그분께 먼저 왔던 사람
  alternatives_korean:
  - 그분께 이전에 왔던 사람
  - 그분께 먼저 온 사람
  lexicon: BDAG
  rationale: 관사+분사가 명사구로 니고데모를 동격 설명하므로, 시간의 선후를 살려 자연스럽게 옮겼습니다. 문맥상 αὐτόν은 예수님을 가리키므로 ‘그분’으로 번역했습니다.
- source_word: εἷς ὢν ἐξ αὐτῶν
  english_pob_choice: being one of them
  chosen_korean: 그들 가운데 한 사람인 그가
  alternatives_korean:
  - 그들 중 한 사람으로서
  - 그들 가운데 하나인
  lexicon: BDAG
  rationale: 현재분사 구문이 니고데모의 소속 배경을 덧붙이므로, 인물 설명으로 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: αὐτόν의 지시 대상
  chosen_reading: 문맥상 예수님을 가리키므로 ‘그분’으로 분명하게 옮겼습니다.
  alternative_readings:
  - 형식상 ‘그에게’로 두어 지시 대상을 덜 분명하게 둘 수 있습니다.
  rationale: 요한복음 3장 문맥에서 니고데모는 이미 예수님께 나아간 인물로 소개되므로, 독자가 문맥적 지시를 즉시 파악하도록 했습니다.
  doctrine_reference: 요한복음 3:1–2 문맥
- issue: 문장 내부의 동격 구조
  chosen_reading: ‘니고데모가 그들에게 말했습니다’ 앞에 동격 설명을 배치해 헬라어 어순을 반영했습니다.
  alternative_readings:
  - 주절을 먼저 두고 뒤에 수식절을 붙이는 일반 한국어 어순으로 재배열할 수 있습니다.
  rationale: 본문의 핵심은 니고데모를 ‘먼저 왔던 사람, 그들 가운데 한 사람’으로 규정하며 발언하는 장면이므로, 그 식별 정보를 앞에 두는 구조를 유지했습니다.
  doctrine_reference: 서술 구조의 문맥 보존
