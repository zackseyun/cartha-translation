  rationale: 원문의 단일 주절 ‘니고데모가 그들에게 말하였다’에 ‘이전에 그에게 왔던’과 ‘그들 가운데 한 사람이었던’이라는 두 식별 정보를 자연스러운 한국어 관형·서술 구조로 결합했습니다. ‘그에게’는 원문의 대명사를 그대로 보존하며, 불필요한 해설 각주는 حذف했습니다.
