  source_fidelity: 첫 발화의 Δαιμόνιον ἔχεις는 직역하면 ‘당신에게는 귀신이 있습니다’이며, 문맥상 한국어 관용 표현으로는 ‘당신은 귀신 들렸습니다’가 적절합니다. 초안의 ‘귀신이 붙어 있습니다’는 귀신이 달라붙었다는 구체적 이미지를 보태므로 원문의 ‘가지고 있다’ 관용 표현보다 해석적입니다. 둘째 질문은 τίς와 현재형 ζητεῖ 및 부정사 ἀποκτεῖναι를 충실히 옮겼습니다.
