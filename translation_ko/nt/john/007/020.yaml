lexical_decisions:
- source_word: ἀπεκρίθη ὁ ὄχλος
  english_pob_choice: The crowd answered
  chosen_korean: 무리가 대답했습니다
  alternatives_korean:
  - 군중이 대답했습니다
  - 무리가 응답했습니다
  lexicon: BDAG
  rationale: ὄχλος는 여기서 특정 집단으로 말하는 ‘무리/군중’이 자연스럽고, ἀπεκρίθη는 대화 맥락에서 ‘대답했습니다’가 가장 직접적입니다.
- source_word: Δαιμόνιον ἔχεις
  english_pob_choice: You have a demon
  chosen_korean: 당신에게는 귀신이 붙어 있습니다
  alternatives_korean:
  - 당신은 귀신 들렸습니다
  - 당신에게는 악귀가 있습니다
  lexicon: BDAG
  rationale: 본문의 직역은 ‘당신은 귀신을 가지고 있다’에 가깝지만, 한국어에서는 ‘귀신이 붙어 있습니다’가 원문의 공격적 관용을 비교적 그대로 살리면서도 자연스럽습니다.
- source_word: τίς σε ζητεῖ ἀποκτεῖναι
  english_pob_choice: Who is seeking to kill you?
  chosen_korean: 누가 당신을 죽이려 합니까?
  alternatives_korean:
  - 누가 당신을 죽이려고 합니까?
  - 누가 당신을 죽이려 하고 있습니까?
  lexicon: BDAG
  rationale: τίς는 의문사 ‘누가’로 살리고, ζητεῖ와 ἀποκτεῖναι의 결합은 목적이 드러나는 자연스러운 한국어로 ‘죽이려 합니까?’를 택했습니다.
theological_decisions:
- issue: δαιμόνιον을 예수에 대한 적대적 비난으로 어떻게 옮길지
  chosen_reading: 본문의 비난을 해석적으로 완화하지 않고 ‘귀신’으로 직역 계열 표현을 유지했습니다.
  alternative_readings:
  - 당신은 귀신 들렸습니다
  - 당신은 악한 영에 사로잡혔습니다
  rationale: 요한복음의 장면은 군중의 적대적 발언을 그대로 보고하므로, 본문보다 강한 해석을 덧붙이지 않는 번역이 적절합니다.
  doctrine_reference: 원어 우선 원칙; 번역이 본문이 가진 긴장과 모욕의 수위를 보존해야 함
