  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: ko
  text: 이 말씀들을 하신 뒤에, 예수님께서는 갈릴리에 머무르셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 그런 말씀들을
  alternatives_korean:
  - 이것들을
  - 그 일들을
  lexicon: BDAG
  rationale: 지시대명사의 복수형이 앞선 발화를 가리키므로, 한국어에서는 문맥상 자연스럽고 구어체로도 어색하지 않은 ‘그런 말씀들’로 옮겼습니다.
- source_word: εἰπὼν
  english_pob_choice: saying
  chosen_korean: 하신 뒤에
  alternatives_korean:
  - 말한 뒤에
  - 말씀하신 후에
  lexicon: BDAG
  rationale: 부정과거 분사는 앞선 행위를 나타내므로, 한국어에서는 선행 완료를 분명히 드러내는 ‘하신 뒤에’로 처리했습니다.
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 예수님께서는
  alternatives_korean:
  - 그분은
  - 예수님 자신은
  lexicon: BDAG
  rationale: 이 문맥의 αὐτός는 서술상 주어를 강조하는 기능이 있으나, 한국어에서는 호칭을 명시해 자연스럽게 옮기는 것이 가장 가까우며, ‘자신’은 과도하게 강조될 수 있습니다.
- source_word: ἔμεινεν
  english_pob_choice: remained
  chosen_korean: 그대로 머무르셨습니다
  alternatives_korean:
  - 머무르셨습니다
  - 머물러 계셨습니다
  lexicon: BDAG
  rationale: μένω의 기본 의미인 ‘머물다/남다’를 살리되, 장면의 정적 지속감을 드러내기 위해 ‘그대로 머무르셨습니다’로 옮겼습니다.
theological_decisions:
- issue: αὐτός의 강조 반영 여부
  chosen_reading: 한국어 본문에서는 별도의 강조어 ‘자신’을 넣지 않고, 예수님을 명시한 주어로 자연스럽게 처리했습니다.
  alternative_readings:
  - 예수님 자신은
  - 그분은
  rationale: 본문의 강조는 문맥상 미묘하며, 한국어에서 과도한 반영은 어색함을 낳을 수 있습니다. 따라서 의미는 보존하되 문장 흐름을 우선했습니다.
  doctrine_reference: 문맥적 강조와 한국어 자연성
