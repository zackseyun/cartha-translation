review_pass:
  verdict: revise
  source_fidelity: ‘유대인들이 두려워서’는 한국어에서 ‘유대인들이 두려움을 느껴서’로 읽힐 수 있어, διὰ τὸν φόβον τῶν Ἰουδαίων(‘유대인들에 대한/유대인들 때문에 생긴 두려움으로’)의 관계를 충분히 분명히 하지 못합니다. ‘유대인들을 두려워하여’는 원인의 의미와 두려움의 대상을 정확히 드러냅니다. 그 밖에 ‘그러나’, ‘아무도’, ‘그에 관해’, ‘드러내 놓고 말하지 않았습니다’는 원문의 대조, 포괄 부정, 지속적 발화의 문맥, 파르레시아의 공개성을 자연스럽게 반영합니다.
  naturalness: ‘유대인들을 두려워하여’는 현대 표준어 합쇼체 문장에 자연스럽고 의미상 모호함이 없습니다. ‘드러내 놓고’는 이 문맥에서 숨김없이 또는 공공연하게 말하는 뜻을 자연스럽게 전달합니다.
  terminology: Ἰουδαίων은 본문에서 ‘유대인들’로 보존하되, 요한복음 문맥에서 유대 민족 전체가 아니라 예루살렘의 유대 지도층 또는 유대 당국을 가리킬 수 있다는 점을 각주에서 밝혀야 합니다. 기존 각주의 ‘유대아의 권력자들’은 다소 부자연스럽고, 일반 유대인 전체를 뜻할 가능성도 언급하지 않아 원문의 지시 대상이 지닌 범위를 충분히 보존하지 못합니다.
  issues:
  - severity: medium
    issue: 두려움의 대상이 문법적으로 모호함
    rationale: ‘유대인들이 두려워서’는 조사 ‘이/가’ 때문에 유대인들이 두려워했다는 뜻으로 읽힐 수 있습니다. 원문은 말하는 사람들이 유대인들을 두려워했음을 뜻하므로 목적격을 써서 분명히 해야 합니다.
  - severity: low
    issue: 각주가 Ἰουδαίων의 가능한 지시 범위를 충분히 제시하지 못함
    rationale: 본문어는 일반 유대인을 가리킬 수도, 이 문맥에서는 특히 예루살렘 기반의 유대 지도층/당국을 가리킬 수도 있습니다. 각주는 후자의 가능성만 간략히 언급하므로 두 가능성과 문맥적 주의를 함께 제시하는 편이 더 정확합니다.
  revised_text: 그러나 유대인들을 두려워하여 아무도 그에 관해 드러내 놓고 말하지 않았습니다.[a]
