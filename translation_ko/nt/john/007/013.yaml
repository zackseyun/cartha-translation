  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
  footnotes:
  - marker: a
    text: Or more specifically in this context, 'the Jewish leaders' or 'the Judean authorities.' In John, 'the Jews' can refer to the Jewish people generally or, in some passages, to the Jerusalem-based authorities opposed to Jesus.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 유대인들이 두려워서 아무도 그에 관해 드러내 놓고 말하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘유대인들’은 문맥상 더 구체적으로는 유대 지도자들 또는 유대아의 권력자들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  english_pob_choice: no one
  chosen_korean: 아무도
  alternatives_korean:
  - 누구도
  - 아무 사람도
  lexicon: BDAG
  rationale: 부정 대명사 οὐδεὶς의 포괄성을 자연스러운 현대 한국어로 옮기기 위해 ‘아무도’를 택했습니다.
- source_word: μέντοι
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그럼에도
  lexicon: BDAG
  rationale: 앞선 문맥과의 약한 대조를 한국어 담화 흐름에 맞게 연결하는 표지로 ‘그러나’를 사용했습니다.
- source_word: παρρησίᾳ
  english_pob_choice: openly
  chosen_korean: 드러내 놓고
  alternatives_korean:
  - 공개적으로
  - 대놓고
  - 똑바로
  lexicon: BDAG
  rationale: 파르레시아의 핵심인 숨김없는 발화를 살리되, 단순히 ‘공개적으로’보다 말의 태도를 더 분명히 드러내는 표현으로 옮겼습니다.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  english_pob_choice: for fear of the Jews
  chosen_korean: 유대인들이 두려워서
  alternatives_korean:
  - 유대인들에 대한 두려움 때문에
  - 유대인들이 무서워서
  lexicon: BDAG
  rationale: διά + 대격의 원인 의미를 한국어 원인 표현으로 옮겼고, 본문을 과도하게 해석하지 않기 위해 ‘두려워서’로 간결하게 처리했습니다.
theological_decisions:
- issue: τῶν Ἰουδαίων의 지시 대상
  chosen_reading: 본문에는 ‘유대인들’을 그대로 두되, 주석 없이 본문에서 좁혀 해석하지는 않았습니다.
  alternative_readings:
  - 유대 지도자들
  - 유대아 사람들
  rationale: 요한복음에서 Ἰουδαῖοι는 문맥에 따라 넓은 민족적 의미나 예루살렘 권력층을 가리킬 수 있으므로, 본문은 원형을 유지하고 해석의 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy), §3 (preserve tension)
