    text: 요한복음에서 ‘유대인들’은 유대 민족 일반을 가리킬 수도 있고, 일부 문맥에서는 예수님을 반대한 예루살렘 기반의 유대 지도자들이나 유대 당국을 더 구체적으로 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  english_pob_choice: no one
  chosen_korean: 아무도
  alternatives_korean:
  - 누구도
  - 아무 사람도
  lexicon: BDAG
  rationale: 부정 대명사 οὐδεὶς의 포괄성을 자연스러운 현대 한국어로 옮기기 위해 ‘아무도’를 택했습니다.
- source_word: μέντοι
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
