  source_fidelity: 원문의 부분격 표현(‘무리 가운데 몇몇’)과 ὁ προφήτης의 특정·제목적 뉘앙스는 대체로 잘 반영했습니다. 다만 ἔλεγον은 미완료 과거이므로 단순 과거 ‘말했습니다’보다 진행·반복의 뉘앙스를 드러내는 표현이 더 충실합니다.
