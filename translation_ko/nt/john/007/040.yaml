id: JHN.7.40
reference: John 7:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
  footnotes:
  - marker: a
    text: '''The Prophet'' likely refers to the expected prophet like Moses (see Deuteronomy 18:15), though some interpreters take it more generally as ''the prophet.'''
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 이 말씀을 들은 무리 가운데 몇몇은 이렇게 말하고 있었습니다. “이분이야말로 참으로 그 예언자[a]이십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 예언자’는 신명기 18:15에 나오는 모세와 같은 예언자를 가리킬 가능성이 큽니다. 다만 어떤 해석자들은 이를 더 일반적으로 ‘예언자’라는 뜻으로 이해합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  english_pob_choice: some from the crowd
  chosen_korean: 무리 가운데서 … 몇몇이
  alternatives_korean:
  - 무리 가운데서
  - 사람들 중 몇몇이
  - 군중 가운데서 몇몇이
  lexicon: BDAG
  rationale: 부분 집합이 무리 전체가 아니라 그중 일부임을 드러내기 위해 ‘몇몇이’를 넣어 partitive sense를 살렸습니다.
- source_word: οὖν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니
  - 그리하여
  lexicon: BDAG
  rationale: 앞 문맥에서 이어지는 추론적 연결을 분명히 하면서도 문장 첫머리에서 자연스럽게 읽히는 접속어로 옮겼습니다.
- source_word: τῶν λόγων τούτων
  english_pob_choice: these words
  chosen_korean: 이 말씀
  alternatives_korean:
  - 이 말들
  - 이 말씀들
  - 이런 말
  lexicon: BDAG
  rationale: 직전의 예수 말씀을 가리키므로, 한국어에서는 복수감이 강한 ‘말들’보다 문맥상 자연스러운 ‘이 말씀’이 적절합니다.
- source_word: ὁ προφήτης
  english_pob_choice: the Prophet
  chosen_korean: 그 예언자
  alternatives_korean:
  - 예언자
  - 그 선지자
  - 그 예언자 분
  lexicon: BDAG
  rationale: 문맥상 모세와 같은 기대된 예언자를 가리키는 제목적 표현이므로, 일반명사보다 특정성을 띠는 ‘그 예언자’로 옮겼습니다.
theological_decisions:
- issue: ὁ προφήτης의 제목성 보존
  chosen_reading: ‘그 예언자’로 옮겨, 단순한 일반 예언자 언급이 아니라 기대된 인물을 가리키는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 예언자
  - 그 선지자
  - 메시아
  rationale: 본문은 그 인물을 곧바로 메시아로 동일시하지 않으므로, 해석을 앞서 확정하지 않고 제목적 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
