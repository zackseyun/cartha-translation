    rationale: Ἀγαθός는 여기서 예수에 대한 긍정적 인물 평가입니다. ‘좋은 사람입니다’는 한국어의 자연스러운 인물 평가이면서 원문이 함축하는 인칭 대상을 명료하게 드러냅니다.
