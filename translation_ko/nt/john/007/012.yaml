id: JHN.7.12
reference: John 7:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
  footnotes:
  - marker: a
    text: Or “grumbling” or “whispering” about him.
    reason: lexical_alternative
  - marker: b
    text: Or “he deceives the crowd” or “he leads the crowd astray.”
    reason: lexical_alternative
translation:
  language: ko
  text: 무리들 사이에서 그에 대한 많은 수군거림이 있었습니다. 어떤 이들은 「그는 좋습니다」라고 말했고, 다른 이들은 「아니, 오히려 그가 무리를 미혹하고 있습니다」라고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “수군거림”이나 “속삭임”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 무리를 속이고 있다” 혹은 “그가 무리를 잘못된 길로 이끌고 있다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμὸς
  english_pob_choice: murmuring
  chosen_korean: 수군거림
  alternatives_korean:
  - 웅성거림
  - 불평
  - 속삭임
  lexicon: BDAG
  rationale: 공개 토론보다 낮은 목소리의 떠들썩한 말들을 가리키므로, 문맥상 중립적이면서도 소곤거리는 분위기를 살리는 ‘수군거림’이 적합합니다.
- source_word: ἐν τοῖς ὄχλοις
  english_pob_choice: among the crowds
  chosen_korean: 무리들 사이에서
  alternatives_korean:
  - 군중들 가운데
  - 사람들 사이에서
  lexicon: BDAG
  rationale: 복수형 ὄχλοι의 분산된 집단감을 살리기 위해 ‘무리들’로 옮기고, 그 안에서 퍼지는 소문이라는 관계를 ‘사이에서’로 표현했습니다.
- source_word: Ἀγαθός ἐστιν
  english_pob_choice: He is good
  chosen_korean: 그는 좋습니다
  alternatives_korean:
  - 그는 선합니다
  - 그는 훌륭합니다
  lexicon: BDAG
  rationale: 형용사 Ἀγαθός의 기본 의미를 직접 살리되, 인물 평가를 자연스러운 현대 한국어로 드러내기 위해 ‘좋습니다’를 택했습니다. ‘선합니다’는 도덕적 뉘앙스를 너무 좁힐 수 있습니다.
- source_word: πλανᾷ τὸν ὄχλον
  english_pob_choice: he is misleading the crowd
  chosen_korean: 그가 무리를 미혹하고 있습니다
  alternatives_korean:
  - 그가 무리를 속이고 있습니다
  - 그가 무리를 잘못된 길로 이끌고 있습니다
  lexicon: BDAG
  rationale: πλανᾷ의 ‘길을 잃게 하다/그릇되게 하다’라는 의미를 살려, 단순한 기만보다 더 넓은 오도 행위를 나타내는 ‘미혹하다’로 옮겼습니다.
theological_decisions:
- issue: 예수에 대한 상반된 군중 평가의 보존
  chosen_reading: 긍정적 평가와 부정적 평가를 모두 그대로 병렬로 제시해, 서술자의 판단을 덧붙이지 않았습니다.
  alternative_readings:
  - 한쪽 평가를 완화하거나 요약하는 번역
  - ‘좋은 사람’처럼 설명을 보탠 번역
  rationale: 이 구절은 군중 내부의 분열된 반응을 보고할 뿐이므로, 원문이 가진 긴장과 대립을 그대로 드러내는 것이 본문 의도에 충실합니다.
  doctrine_reference: 문맥의 긴장을 해소하지 않고 유지
