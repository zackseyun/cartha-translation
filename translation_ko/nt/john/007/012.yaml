- from: 무리들 사이에서 그에 대한 많은 수군거림이 있었습니다. 어떤 이들은 「그는 좋습니다」라고 말했고, 다른 이들은 「아니, 오히려 그가 무리를 미혹하고 있습니다」라고 말했습니다.[a][b]
  to: 무리들 사이에는 그에 관해 수군거림이 많이 있었습니다.[a] 어떤 이들은 “그는 좋은 사람입니다”라고 말했고, 다른 이들은 “아니요, 오히려 그가 무리를 미혹하고 있습니다.[b]”라고 말했습니다.
