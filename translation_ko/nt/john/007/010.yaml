id: JHN.7.10
reference: John 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
  footnotes:
  - marker: a
    text: Or 'but in secret.' The Greek expression is literally 'but as if in secret,' which may soften the statement slightly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 형제들이 먼저 그 절기에 올라간 뒤에, 예수께서도 올라가셨습니다. 그러나 드러내어 가신 것이 아니라, 마치 숨은 듯이 가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 숨은 듯이.’ 헬라어 표현은 문자적으로는 ‘마치 숨은 듯이’이므로, 다소 완곡하게 들릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ... ἀνέβη
  english_pob_choice: had gone up ... went up
  chosen_korean: 올라간 뒤에 ... 올라가셨습니다
  alternatives_korean:
  - 올라갔습니다 ... 올라갔습니다
  - 올라간 뒤 ... 올라가셨습니다
  lexicon: BDAG
  rationale: ἀναβαίνω의 기본 의미인 ‘올라가다’를 살리고, 먼저 형제들이 올라간 뒤 예수께서도 이어서 올라가신 순서를 한국어의 ‘뒤에’로 분명히 했습니다.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들이
  alternatives_korean:
  - 그의 형제들
  - 그의 형제들과 자매들
  lexicon: BDAG
  rationale: 문맥상 예수의 남자 형제들을 가리키는 표현이지만, 한국어에서는 자연스럽게 ‘그의 형제들이’로 옮기면 성별을 과도하게 드러내지 않으면서도 본문 의미를 유지할 수 있습니다.
- source_word: εἰς τὴν ἑορτήν
  english_pob_choice: to the feast
  chosen_korean: 그 절기에
  alternatives_korean:
  - 그 축제에
  - 그 명절에
  lexicon: BDAG
  rationale: ἑορτή는 유대 절기/축제를 가리키므로, 문맥상 특정 절기를 지시하는 ‘그 절기’가 가장 간결하고 원문에 가깝습니다.
- source_word: οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ
  english_pob_choice: not openly but as if in secret
  chosen_korean: 드러내어 가신 것이 아니라, 마치 숨은 듯이 가셨습니다
  alternatives_korean:
  - 공개적으로 가신 것이 아니라, 비밀리에 가셨습니다
  - 겉으로 드러나게 가지 않으시고, 숨은 듯이 가셨습니다
  lexicon: BDAG
  rationale: φανερῶς는 ‘드러나게/공개적으로’의 뜻이므로 ‘드러내어’로 옮기고, ὡς ἐν κρυπτῷ의 완곡함을 살려 ‘마치 숨은 듯이’로 처리했습니다.
theological_decisions:
- issue: 예수께서 이전 말씀(7:8)과 달리 절기에 올라가신 방식의 긴장
  chosen_reading: 본문의 서술을 그대로 살려, 예수께서 나중에 올라가셨지만 공개적으로는 가지 않으셨다고 옮겼습니다.
  alternative_readings:
  - 앞선 말씀과 조화시키기 위해 의미를 풀어 옮김
  - 예수께서 마음을 바꾸신 것으로 암시함
  rationale: 헬라어 본문은 시간 순서와 공개성의 차이만 진술하며 설명을 덧붙이지 않으므로, 번역도 그 긴장을 해소하지 않고 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
