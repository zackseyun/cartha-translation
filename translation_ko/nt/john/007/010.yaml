    issue: ‘먼저’가 원문에 없음
    rationale: ὡς 이하의 시간 절과 τότε는 형제들이 올라간 후 예수께서 올라가셨음을 나타내지만, ‘먼저’라는 별도 강조는 명시하지 않습니다.
  - severity: medium
    issue: ‘마치 숨은 듯이’의 의미와 문체가 부정확하고 어색함
    rationale: ἐν κρυπτῷ는 ‘은밀히/in secret’라는 방식 또는 상황을 가리킵니다. ‘숨은 듯이’는 숨은 상태 자체를 암시할 수 있으며, 원문의 완곡한 ὡς는 ‘마치 은밀히’로 더 직접적으로 보존할 수 있습니다.
  revised_text: 그런데 그의 형제들이 그 절기에 올라간 뒤에, 예수께서도 올라가셨습니다. 그러나 공개적으로가 아니라, 마치 은밀히 올라가셨습니다.[a]
