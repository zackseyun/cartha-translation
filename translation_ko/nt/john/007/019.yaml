id: JHN.7.19
reference: John 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
  footnotes:
  - marker: a
    text: Or, 'Has not Moses given you the law?' The Greek perfect can be rendered either way in English.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'does the law.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 여러분에게 율법을 주지 않았습니까?[b] 그런데도 여러분 중에는 율법을 지키는 사람[a]이 아무도 없습니다. 왜 나를 죽이려 하십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘율법을 행한다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 문두의 질문은 긍정의 대답을 예상하는 반문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  english_pob_choice: Did not ... give
  chosen_korean: 주지 않았습니까
  alternatives_korean:
  - 주지 않습니까
  - 주셨습니까
  lexicon: BDAG
  rationale: 문두의 οὐ가 예/아니오를 기대하는 반어적 질문이므로 한국어도 반문형으로 옮겼습니다. 완료형 δέδωκεν은 문맥상 과거의 행위를 가리키므로 자연스럽게 ‘주지 않았습니까’로 처리했습니다.
- source_word: τὸν νόμον
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 율법서
  lexicon: BDAG
  rationale: 모세가 준 것으로 직접 지칭되므로 토라/모세 율법의 의미가 분명합니다. 한국어에서는 교회 용례에 따라 ‘율법’이 가장 정확하고 자연스럽습니다.
- source_word: ποιεῖ τὸν νόμον
  english_pob_choice: keeps the law
  chosen_korean: 율법을 지키는
  alternatives_korean:
  - 율법을 행하는
  - 율법을 실천하는
  lexicon: BDAG
  rationale: ποιέω의 직역인 ‘행하다’보다, 이 문맥에서는 율법을 준수한다는 뜻이므로 ‘지키다’가 의미를 가장 잘 드러냅니다.
- source_word: ζητεῖτε ἀποκτεῖναι
  english_pob_choice: are you seeking to kill
  chosen_korean: 죽이려 하십니까
  alternatives_korean:
  - 죽이려고 찾으십니까
  - 죽일 생각입니까
  lexicon: BDAG
  rationale: ζητέω + 부정사 구조의 의도/시도 의미를 한국어의 진행적 의향 표현으로 옮겼습니다. ‘죽이려 하십니까’가 현재의 계획성과 공격성을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: ‘율법’의 범위
  chosen_reading: 모세를 통해 주어진 모세 율법/토라를 가리킵니다.
  alternative_readings:
  - 일반적인 도덕 법칙
  - 추상적 의미의 법
  rationale: 예수님이 곧바로 모세를 수여자로 언급하므로, 여기의 νόμος는 추상적 법이 아니라 시내산 전승의 율법을 가리킨다고 보는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 요 7:19 문맥 주해
