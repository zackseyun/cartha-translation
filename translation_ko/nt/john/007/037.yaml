  source_fidelity: ‘그러나’는 δέ의 약한 연결 기능에 비해 대조를 지나치게 강하게 만듭니다. 이를 생략하면 원문의 담화 연결을 과장하지 않으면서 한국어 서술도 자연스럽습니다. 나머지 절기 시점, 예수님의 공개적 외침, 목마름과 마심의 비유적 표현, 두 명령의 초청은 충실히 보존됩니다.
  naturalness: ‘명절의 마지막 날, 곧 그 큰 날에’와 ‘서서 큰 소리로 외쳐 말씀하셨습니다’는 현대 표준어 합쇼체 성경 문체에서 자연스럽습니다. 직접 인용문의 ‘와서 마시십시오’도 공개적 초청의 명령성을 적절히 나타냅니다.
  terminology: ‘명절’, ‘목마르다’, ‘마시다’는 원문의 절기 및 비유 이미지를 해설 없이 보존합니다. 한국어 ‘누구든지’는 성별을 드러내지 않는 일반 표현이므로, 그리스어의 문법 단수 일반성을 설명하는 현 각주는 한국어 본문 이해에 필요한 어휘 대안을 제공하지 않습니다.
