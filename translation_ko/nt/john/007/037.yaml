revisions:
- from: 그러나 명절의 마지막 날, 곧 그 큰 날에 예수께서 서서 크게 외치며 말씀하셨습니다. 「누구든지 목마르거든 나에게로 와서 마시십시오.」[a]
  to: 명절의 마지막 날, 곧 그 큰 날에 예수께서 서서 큰 소리로 외쳐 말씀하셨습니다. 「누구든지 목마르거든 나에게로 와서 마시십시오.」
  rationale: 원문보다 강한 역접을 넣는 ‘그러나’를 삭제하고, κράζω의 큰 소리의 공개적 발화는 ‘큰 소리로 외쳐’로 자연스럽게 드러냈습니다. 성별 비표지인 한국어 ‘누구든지’에는 문법 단수 관련 각주가 필요하지 않으므로 앵커와 함께 삭제했습니다. 목마름과 마심의 의미는 해설로 좁히지 않고 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:10Z'
