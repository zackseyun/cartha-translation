id: JHN.7.37
reference: John 7:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: Now on the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
  footnotes:
  - marker: a
    text: Or, more inclusively in English, 'let that person come to me and drink.' The Greek uses a grammatically singular generic expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 명절의 마지막 날, 곧 그 큰 날에 예수께서 서서 크게 외치며 말씀하셨습니다. 「누구든지 목마르거든 나에게로 와서 마시십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문법상 단수 일반 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  english_pob_choice: Now on the last day
  chosen_korean: 그러나 명절의 마지막 날
  alternatives_korean:
  - 그리고 그 마지막 날
  - 그 절기의 마지막 날
  lexicon: BDAG
  rationale: Ἐν + 여격의 시간 표지와 δέ의 약한 연결을 살려 자연스러운 서술로 옮겼습니다. ἑορτή는 요한복음의 절기 문맥에서 ‘명절’로도 충분히 자연스럽게 기능합니다.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  english_pob_choice: the great day of the feast
  chosen_korean: 곧 그 큰 날
  alternatives_korean:
  - 명절의 큰 날
  - 그 장엄한 절기 날
  lexicon: BDAG
  rationale: μέγας의 강조를 살리되, 한국어에서 ‘큰 날’이 가장 직접적으로 원문의 표지를 보존합니다. ‘곧’은 앞의 마지막 날을 풀어 주는 설명적 연결로 넣었습니다.
- source_word: ἔκραξεν λέγων
  english_pob_choice: cried out, saying
  chosen_korean: 크게 외치며 말씀하셨습니다
  alternatives_korean:
  - 큰 소리로 외치며 말씀하셨습니다
  - 외쳐 말씀하셨습니다
  lexicon: BDAG
  rationale: κράζω의 공개적·강한 발화를 ‘크게 외치다’로 옮기고, 예수의 직접 발화를 현대 한국어 예수 서술 관행에 맞게 ‘말씀하셨습니다’로 표현했습니다.
- source_word: Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω
  english_pob_choice: If anyone is thirsty, let him come to me and drink
  chosen_korean: 누구든지 목마르거든 나에게로 와서 마시십시오
  alternatives_korean:
  - 누구든지 목마르면 나에게로 와서 마시십시오
  - 목마른 사람은 나에게로 와서 마시십시오
  lexicon: BDAG
  rationale: τις의 일반적·가명적 성격을 ‘누구든지’로 살렸고, διψᾷ는 현대 한국어에서 자연스러운 ‘목마르거든’으로 옮겼습니다. ἐρχέσθω와 πινέτω는 초청의 뉘앙스를 살려 한국어 명령형 공손체로 처리했습니다.
theological_decisions:
- issue: 직접 인용문의 화법과 공손체
  chosen_reading: 예수의 공개 선언을 서술문은 합쇼체로 유지하되, 직접 인용문은 청중에게 주는 초청/명령의 힘을 살려 공손한 명령형으로 옮겼습니다.
  alternative_readings:
  - 직접 인용문을 평서형으로 완화
  - 명령성을 더 부드럽게 표현
  rationale: 원문은 공개적 외침과 강한 초청을 함께 담고 있으므로, 한국어에서도 지나치게 부드럽게 완화하지 않고 요청의 힘을 유지하는 것이 본문 효과를 잘 반영합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
