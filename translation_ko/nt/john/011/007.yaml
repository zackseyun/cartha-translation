  terminology: ‘제자들’, ‘유대’, ‘말씀하십니다’는 문맥과 한국어 성서 번역 관행에 잘 맞습니다. ‘유대’는 지역명으로 충분히 분명하며, εἰς의 ‘안으로/…로’ 가능성은 각주에서 제한적으로 설명합니다.
