id: JHN.11.7
reference: John 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
  footnotes:
  - marker: a
    text: Or “to Judea again.” The Greek preposition can be rendered either “into” or “to” in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 그가 제자들에게 말씀하십니다. “다시 유대로[a] 갑시다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 유대에.’ 그리스어 전치사 εἰς는 이 문맥에서 ‘~안으로’ 또는 목적지를 나타내는 ‘~로/에’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  english_pob_choice: Then after this
  chosen_korean: 그런데 이 일들 뒤에
  alternatives_korean:
  - 그 후에
  - 그런 다음 이 일들 뒤에
  lexicon: BDAG
  rationale: 두 개의 시간 표지가 연속으로 나오므로, 한국어에서는 자연스럽게 이어지는 서술로 정리하되 사건의 순서를 유지했습니다.
- source_word: λέγει
  english_pob_choice: he says
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  - 말하십니다
  - 말했다
  lexicon: BDAG
  rationale: 요한복음의 현재시제를 한국어에서 그대로 살리기보다, 서술문의 자연스러운 문체로 옮기되 예수의 발화를 존중하는 형태로 처리했습니다.
- source_word: τοῖς μαθηταῖς
  english_pob_choice: to the disciples
  chosen_korean: 제자들에게
  alternatives_korean:
  - 그의 제자들에게
  - 문도들에게
  lexicon: BDAG
  rationale: 그리스어에는 소유격 대명사가 없으므로 ‘그의’를 덧붙이지 않고 단순히 ‘제자들’로 옮겼습니다.
- source_word: εἰς τὴν Ἰουδαίαν
  english_pob_choice: into Judea
  chosen_korean: 유대에
  alternatives_korean:
  - 유대로
  - 유대 땅으로
  lexicon: BDAG
  rationale: εἰς의 이동 방향을 반영하되, 한국어에서는 장소명사에 조사 ‘에’를 붙이는 것이 가장 자연스러워 ‘유대에’로 옮겼습니다.
theological_decisions:
- issue: 예수의 직접 발화에서 문체와 공손성의 균형
  chosen_reading: 직접 인용문 안에서는 명령형을 과도하게 격식화하지 않고, 서술문에서만 합쇼체를 유지했습니다.
  alternative_readings:
  - “다시 유대로 가자.”
  - “다시 유대 땅으로 가십시다.”
  rationale: 그리스어 Ἄγωμεν은 포괄적 권유형이므로, 한국어에서도 공동 제안의 힘을 살리는 것이 적절합니다. 다만 독자 대상 서술은 합쇼체로 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
