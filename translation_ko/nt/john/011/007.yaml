  source_fidelity: ‘그런데’는 원문의 순차 표지 ἔπειτα에 없는 대조·전환의 뉘앙스를 더합니다. 또한 μετὰ τοῦτο는 단수이므로 ‘이 일들 뒤에’보다 ‘그 후에’가 적절합니다. λέγει의 역사적 현재는 ‘말씀하십니다’로 보존할 수 있으며, εἰς τὴν Ἰουδαίαν은 이동의 목적지를 나타내는 ‘유대로’가 자연스럽고 충실합니다.
