  to: 그 후에 그가 제자들에게 말씀하십니다. “다시 유대로[a] 갑시다.”
  rationale: 시간적 순차만을 표현하도록 첫 구절을 고치고, 단수 지시어를 자연스러운 한국어로 반영했습니다. 역사적 현재를 보존했으며, Ἄγωμεν의 포괄적 권유는 합쇼체의 ‘갑시다’로 옮겼습니다. 각주 표지는 전치사 선택이 걸린 ‘유대로’에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:23:03Z'
