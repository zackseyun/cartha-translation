id: JHN.11.16
reference: John 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
  footnotes:
  - marker: a
    text: Greek Didymus; that is, Twin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 디두모라 불리는 도마가 동료 제자들에게 말했습니다. “우리도 가서 그와 함께 죽읍시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 디두모는 ‘쌍둥이’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θωμᾶς
  english_pob_choice: Thomas
  chosen_korean: 도마
  alternatives_korean:
  - 토마스
  lexicon: BDAG
  rationale: 한국어 성서 전통에서 널리 정착된 이름을 따랐습니다.
- source_word: ὁ λεγόμενος Δίδυμος
  english_pob_choice: called Twin
  chosen_korean: 디두모라 불리는
  alternatives_korean:
  - 쌍둥이라 불리는
  - 디두무스라 불리는
  lexicon: BDAG
  rationale: Δίδυμος는 ‘쌍둥이’라는 뜻이지만, 본문은 도마에게 붙은 별칭을 설명하므로 음역과 풀이를 함께 살려 ‘디두모라 불리는’으로 옮겼습니다.
- source_word: τοῖς συμμαθηταῖς
  english_pob_choice: to his fellow disciples
  chosen_korean: 동료 제자들에게
  alternatives_korean:
  - 함께 배우는 이들에게
  - 동료 문도들에게
  lexicon: BDAG
  rationale: 공동으로 제자된 사람들을 가리키는 말이므로, 자연스러운 현대 한국어로 ‘동료 제자들’이 적절합니다.
- source_word: Ἄγωμεν καὶ ἡμεῖς
  english_pob_choice: Let us also go
  chosen_korean: 우리도 가서
  alternatives_korean:
  - 우리도 갑시다
  - 우리 역시 가자
  lexicon: BDAG
  rationale: 권유적 청유를 한국어로 자연스럽게 살리되, ‘also’를 앞에 둔 강조를 ‘우리도’로 반영했습니다.
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  english_pob_choice: so that we may die with him
  chosen_korean: 그와 함께 죽읍시다
  alternatives_korean:
  - 그와 함께 죽게 됩시다
  - 그와 함께 죽도록 합시다
  lexicon: BDAG
  rationale: ἵνα절의 목적·결과를 문자적으로 반복하기보다, 도마의 결의 어린 말투를 한국어 청유형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 도마의 발화 어조
  chosen_reading: 결의인지 체념인지 단정하지 않고, 본문이 드러내는 말 자체만 전달했습니다.
  alternative_readings:
  - 용감한 충성
  - 비장한 체념
  - 반어적 비관
  rationale: 헬라어 본문은 도마의 태도를 명시적으로 해석하지 않으므로, 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: 본문의 심리적·신학적 긴장 보존
