id: JHN.11.50
reference: John 11:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
  footnotes:
  - marker: a
    text: Or 'on behalf of the people'; the phrase may also carry the sense 'in place of the people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 한 사람이 백성을 위하여 죽는 것이, 온 민족이 멸망하는 것보다 유익하다는 것을 생각하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성을 대신하여’; 이 표현은 ‘백성을 위해’라는 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  english_pob_choice: Nor do you consider
  chosen_korean: 당신들은 … 생각하지 못합니다
  alternatives_korean:
  - 당신들은 … 고려하지 못합니다
  - 당신들은 … 헤아리지 못합니다
  lexicon: BDAG
  rationale: 부정 연결사 οὐδὲ와 인지 동사 λογίζεσθε의 결합을 자연스러운 현대 한국어로 옮기되, 단순 지적이 아니라 책임 있는 숙고의 결여를 드러내기 위해 ‘생각하지 못합니다’를 택했습니다.
- source_word: συμφέρει
  english_pob_choice: it is better
  chosen_korean: 유익하다는
  alternatives_korean:
  - 더 낫다는
  - 이롭다는
  - 유익하다는
  lexicon: BDAG
  rationale: συμφέρει의 핵심은 ‘유리함/이익’이므로, 직역투의 ‘더 낫다’보다 상황적 이득을 살리는 ‘유익하다’가 문맥상 더 분명합니다.
- source_word: ὑπὲρ τοῦ λαοῦ
  english_pob_choice: for the people
  chosen_korean: 백성을 위하여
  alternatives_korean:
  - 백성을 위해
  - 백성을 대신하여
  - 백성을 위하여
  lexicon: BDAG
  rationale: ὑπέρ는 이 자리에서 대표성·대리성·유익을 모두 열어 두므로, 본문은 넓은 의미의 ‘위하여’로 두고, 대리적 뉘앙스는 과도하게 확정하지 않았습니다.
- source_word: ὅλον τὸ ἔθνος
  english_pob_choice: the whole nation
  chosen_korean: 온 민족
  alternatives_korean:
  - 전체 민족
  - 온 나라
  - 온 민족
  lexicon: BDAG
  rationale: ἔθνος는 여기서 유대 민족 전체를 가리키는 집합명사이므로, 정치적·민족적 전체성을 자연스럽게 드러내는 ‘온 민족’이 적절합니다.
- source_word: ἀπόληται
  english_pob_choice: perish
  chosen_korean: 멸망하는 것
  alternatives_korean:
  - 망하는 것
  - 멸하는 것
  - 멸망하는 것
  lexicon: BDAG
  rationale: ἀπόληται는 단순 소멸보다 파멸·멸망의 강한 뜻을 가지므로, 문맥의 비극성과 위기감을 살려 ‘멸망하는 것’으로 옮겼습니다.
theological_decisions:
- issue: ὑπὲρ의 의미를 본문에서 어떻게 유지할 것인지
  chosen_reading: 본문은 ‘백성을 위하여’로 넓게 옮겨, 대리·대속의 의미를 즉시 고정하지 않았습니다.
  alternative_readings:
  - 백성을 대신하여
  - 백성을 위하여(대리적 뉘앙스 가능)
  rationale: 가야바의 발언은 정치적 계산으로 제시되지만, 곧이어 요한은 이를 예언적으로 재해석합니다. 따라서 한국어 본문에서도 즉시 ‘대신하여’로 좁히지 않고, 해석의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 보존하고 한쪽으로 성급히 결정하지 않음'
