  source_fidelity: 수정이 필요합니다. 초안의 비교 구문은 대체로 의미를 전달하지만, 원문의 ἵνα 절은 ‘한 사람이 죽고 온 민족 전체가 멸망하지 않는 것’이라는 결과를 함께 제시합니다. 이를 비교 표현으로 바꾸면 μὴ의 부정과 두 절의 결속이 다소 약해집니다. 또한 οὐδὲ의 추가적 부정은 ‘또한 … 않습니다’로 드러내는 편이 적절합니다.
  naturalness: ‘당신들은’은 현대 표준 한국어의 공적 발화에서 불필요하게 대립적이거나 직접적인 어감을 낼 수 있습니다. 산헤드린을 향한 발화에는 합쇼체와 조화되는 ‘여러분은’이 자연스럽습니다. ‘생각하지 못합니다’는 능력의 결여로 들릴 수 있어, 현재의 숙고·계산을 하지 않는다는 뜻의 ‘생각하지도 않습니다’가 더 정확합니다.
  terminology: ‘백성을 위하여’, ‘온 민족 전체’, ‘멸망하다’는 λαός, ἔθνος, ἀπόληται를 문맥에 맞게 잘 반영합니다. 각주에서는 본문의 넓은 ‘위하여’를 유지하면서 ὑπέρ의 가능한 대리적 의미를 제시하되, 주석의 설명이 본문 표현을 단순히 반복하지 않도록 다듬었습니다.
