  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: ko
  text: 예수께서 오셨을 때, 라자로가 이미 무덤에 들어간 지 나흘이 된 것을 보셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν οὖν
  english_pob_choice: So when Jesus arrived
  chosen_korean: 예수께서 오셨을 때
  alternatives_korean:
  - 예수께서 도착하셨을 때
  - 예수께서 오신 뒤
  lexicon: BDAG
  rationale: aorist 분사와 οὖν의 시간·연결 관계를 한국어 서술문에서 자연스럽게 살려, 앞선 상황에 이어 예수의 도착 시점을 밝히는 표현으로 옮겼습니다.
- source_word: αὐτὸν
  english_pob_choice: that Lazarus
  chosen_korean: 라자로가
  alternatives_korean:
  - 그를
  - 그 라자로를
  lexicon: BDAG
  rationale: 지시대명사를 그대로 두기보다 문맥상 대상인 라자로를 드러내어, 본문의 의미를 분명하게 전달했습니다.
- source_word: τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα
  english_pob_choice: had already been in the tomb four days
  chosen_korean: 이미 무덤에 들어간 지 나흘이 된 것을
  alternatives_korean:
  - 이미 무덤에 있은 지 나흘 된 것을
  - 벌써 무덤에 들어간 지 나흘이 된 것을
  lexicon: BDAG
  rationale: 직역하면 다소 부자연스럽기 때문에, 장례 후 경과 기간을 나타내는 의미를 한국어 관용으로 풀어 옮기되 ἤδη의 ‘이미’는 유지했습니다.
- source_word: ἐν τῷ μνημείῳ
  english_pob_choice: in the tomb
  chosen_korean: 무덤에
  alternatives_korean:
  - 묘실에
  - 무덤 속에
  lexicon: BDAG
  rationale: μνημεῖον은 이 문맥에서 매장 장소를 뜻하므로, 가장 직접적이고 보편적인 ‘무덤’으로 번역했습니다.
