review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ arrival, Lazarus’s identity, the tomb, and the elapsed four days. However, 보셨습니다 means “saw” and does not adequately render εὗρεν (“found/ascertained”). The narrative connective οὖν is also unrepresented.
  naturalness: The duration expression 무덤에 들어간 지 나흘이 된 is natural modern Korean. 확인하셨습니다 idiomatically conveys the narrative sense of εὗρεν without implying that Jesus acquired previously unknown information.
  terminology: 나사로 is the established standard Korean biblical form of Λάζαρος and is preferable to 라자로 in a standard Korean Bible translation. 무덤 is appropriate for μνημεῖον.
  issues:
  - severity: medium
    issue: εὗρεν is translated as 보셨습니다.
    rationale: εὑρίσκω here means that Jesus found or ascertained Lazarus’s condition, not merely that he visually saw it. 확인하셨습니다 better represents the verb in natural Korean.
  - severity: low
    issue: The narrative connective οὖν is omitted.
    rationale: While Korean need not mechanically render every connective, 이에 naturally preserves the forward narrative link signaled by οὖν.
  - severity: low
    issue: The personal name is given as 라자로.
    rationale: 나사로 is the conventional and broadly recognized standard Korean biblical rendering of Λάζαρος.
  revised_text: 이에 예수께서 오셔서 나사로가 이미 무덤에 들어간 지 나흘이 된 것을 확인하셨습니다.
