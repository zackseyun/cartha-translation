base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Now Jesus loved Martha and her sister and Lazarus.
translation:
  language: ko
  text: 예수께서는 마르다와 그 여동생과 나사로를 사랑하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  english_pob_choice: loved
  chosen_korean: 사랑하셨습니다
  alternatives_korean:
  - 사랑하고 계셨습니다
  - 사랑하셨습니다
  - 사랑해 오셨습니다
  lexicon: BDAG
  rationale: ἀγαπάω 계열은 POB의 기본값인 ‘사랑’으로 옮기고, 미완료 과거는 한국어에서 자연스러운 서술형 과거로 처리해 예수의 지속적 태도를 드러냈습니다.
- source_word: τὴν ἀδελφὴν αὐτῆς
  english_pob_choice: her sister
  chosen_korean: 그 여동생
  alternatives_korean:
  - 그의 여동생
  - 그 자매
  - 그 누이
  lexicon: BDAG
  rationale: 문맥상 마리아를 가리키는 관계를 한국어에서 자연스럽게 풀어 ‘그 여동생’으로 옮겼습니다. ‘누이’보다 현대 문체에 맞고, ‘자매’보다 가족관계가 더 분명합니다.
- source_word: ὁ Ἰησοῦς ... τὴν Μάρθαν ... καὶ τὸν Λάζαρον
  english_pob_choice: Now Jesus loved Martha and her sister and Lazarus.
  chosen_korean: 예수께서는 마르다와 그 여동생과 나사로를
  alternatives_korean:
  - 예수께서는 마르다와 그 여동생과 나사로를
  - 예수께서 마르다와 그 여동생과 나사로를
  lexicon: BDAG
  rationale: 주어를 먼저 두고 목적어들을 병렬로 유지해 헬라어의 평행 구조를 살렸습니다. 이름은 통용되는 한국어 음역을 따랐습니다.
theological_decisions:
- issue: δέ의 담화 연결과 ‘Now’의 처리
  chosen_reading: 문맥 전환을 자연스럽게 드러내는 단순 서술로 처리했습니다.
  alternative_readings:
  - 그리고
  - 그러나
  - 무표지 연결
  rationale: δέ는 강한 역접이 아니라 약한 연결이므로, 한국어 본문에는 별도의 접속사를 두지 않아도 원문의 담화 흐름이 충분히 전달됩니다.
  doctrine_reference: Translation philosophy §§3, 6
- issue: ἠγάπα의 미완료 시상
  chosen_reading: 예수의 지속적인 사랑을 단순 과거 서술로 표현했습니다.
  alternative_readings:
  - 사랑하고 계셨습니다
  - 사랑해 오셨습니다
  - 사랑하시는 중이었습니다
  rationale: 미완료의 지속성을 과도하게 해설하지 않으면서도, 본문이 말하는 예수의 변함없는 사랑을 충분히 보존합니다.
  doctrine_reference: Translation philosophy §§3, 6
