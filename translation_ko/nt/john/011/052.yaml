id: JHN.11.52
reference: John 11:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
  footnotes:
  - marker: a
    text: Or 'not only for the nation, but also in order to gather into one the scattered children of God.'
    reason: lexical_alternative
  - marker: b
    text: '''The nation'' refers in context to the Jewish nation.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 민족을 위한 것만이 아니라, 흩어진 하나님의 자녀들을 하나로 모으시려는 것이기도 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족만이 아니라, 흩어진 하나님의 자녀들을 하나로 모으시기 위하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘민족’은 문맥상 유대 민족을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  english_pob_choice: nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 국민
  - 백성
  lexicon: BDAG
  rationale: 여기서는 일반적 ‘민족/국가들’이 아니라 유대 민족을 가리키는 단수 집합 개념이므로, 문맥을 살리면서도 한국어에서 자연스러운 ‘민족’으로 옮겼습니다.
- source_word: ὑπὲρ
  english_pob_choice: for
  chosen_korean: 위한
  alternatives_korean:
  - 대신한
  - 을/를 위하여
  - 을/를 위해
  lexicon: BDAG
  rationale: 이 절은 앞선 문맥의 죽음의 목적을 이어가므로, 관계를 자연스럽게 드러내는 ‘위한’이 가장 적절합니다.
- source_word: τέκνα τοῦ θεοῦ
  english_pob_choice: children of God
  chosen_korean: 하나님의 자녀들
  alternatives_korean:
  - 하나님의 아들들
  - 하나님의 자녀
  lexicon: BDAG
  rationale: τέκνα는 성별이 한정되지 않는 ‘children’이므로, 남성 중심으로 좁아질 수 있는 ‘아들들’보다 ‘자녀들’이 원문에 더 가깝습니다.
- source_word: διεσκορπισμένα
  english_pob_choice: the scattered
  chosen_korean: 흩어진
  alternatives_korean:
  - 분산된
  - 흩어져 있는
  - 분산되어 있는
  lexicon: BDAG
  rationale: 완료/수동 분사로서 흩어진 상태를 가리키므로, 상태를 간결하게 드러내는 형용사적 표현 ‘흩어진’을 택했습니다.
- source_word: συναγάγῃ εἰς ἕν
  english_pob_choice: he might gather into one
  chosen_korean: 하나로 모으시려는
  alternatives_korean:
  - 하나로 모으게 하시려는
  - 한데 모으시려는
  - 하나가 되게 하시려는
  lexicon: BDAG
  rationale: 목적절의 뉘앙스를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘하나로 모으시려는’으로 옮겼습니다. ‘into one’의 긴축된 표현은 결과를 암시하는 한국어 구문으로 재현했습니다.
theological_decisions:
- issue: ‘하나님의 자녀들’의 범위
  chosen_reading: 유대 민족을 넘어 흩어진 하나님의 백성 전체를 향한 포괄적 지시로 두되, 정확한 집단 범주는 본문이 더 이상 규정하지 않는 것으로 유지했습니다.
  alternative_readings:
  - 디아스포라 유대인만
  - 유대인과 이방인 가운데 택하신 신자들
  rationale: 본문은 ‘민족’과 대비되는 더 넓은 대상을 말하지만, 그 정확한 구성은 명시하지 않으므로 번역에서도 그 긴장을 풀지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
