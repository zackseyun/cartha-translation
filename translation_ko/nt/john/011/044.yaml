id: JHN.11.44
reference: John 11:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: ko
  text: 죽었던 사람이 손과 발이 수의로 묶인 채 나왔고, 그의 얼굴은 수건으로 감싸져 있었습니다. 예수께서 그들에게 말씀하셨습니다. 「그를 풀어 주어 가게 하십시오.」[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘수의’는 원문의 결박용 천(κειρίαις)을 장례 맥락에 맞게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τεθνηκώς
  english_pob_choice: The man who had died
  chosen_korean: 죽었던 사람
  alternatives_korean:
  - 죽은 사람
  - 죽었던 자
  lexicon: τεθνηκώς
  rationale: 분사구를 자연스러운 서술로 옮기되, 단순히 상태를 묘사하는 ‘죽은 사람’보다 과거 완료의 결과 상태를 드러내는 ‘죽었던 사람’이 원문의 시간감을 더 잘 살립니다.
- source_word: κειρίαις
  english_pob_choice: burial cloths
  chosen_korean: 수의
  alternatives_korean:
  - 장례용 천
  - 감는 천
  lexicon: κειρία
  rationale: 묶는 띠나 천을 가리키므로 ‘수의’가 장례 맥락과 결박 이미지를 함께 전달할 수 있어, 본문의 무덤 장면에 가장 적절합니다.
- source_word: σουδαρίῳ
  english_pob_choice: a cloth
  chosen_korean: 수건
  alternatives_korean:
  - 천
  - 얼굴보
  lexicon: σουδάριον
  rationale: 얼굴을 감싼 천이라는 기능이 분명하므로, 한국어에서 가장 즉각적으로 이해되는 ‘수건’으로 옮기되, 장례용 천이라는 맥락은 앞 절의 ‘수의’로 보완했습니다.
- source_word: Λύσατε αὐτόν καὶ ἄφετε αὐτὸν ὑπάγειν
  english_pob_choice: Unbind him and let him go.
  chosen_korean: 그를 풀어 주어 가게 하십시오.
  alternatives_korean:
  - 그를 풀어 놓고 가게 하십시오
  - 그를 풀어 그가 가게 하십시오
  lexicon: λύω / ἀφίημι / ὑπάγω
  rationale: 두 명령의 연쇄를 유지하면서 한국어 명령형으로 자연스럽게 옮겼습니다. ‘풀어 주어’는 결박 해제를, ‘가게 하십시오’는 허용의 뉘앙스를 담습니다.
theological_decisions:
- issue: 예수의 발화 시제
  chosen_reading: 예수께서 그들에게 말씀하셨습니다
  alternative_readings:
  - 예수께서 그들에게 말씀하십니다
  - 예수께서 그들에게 이르셨습니다
  rationale: 본문의 현재형 λέγει를 반영하여 서술 현재로 유지했습니다. 서사적 생동감과 원문 시제를 살리려는 POB의 개정 취지를 따릅니다.
  doctrine_reference: 서사 시제 보존
- issue: 죽은 자의 회복과 해방 명령
  chosen_reading: 그를 풀어 주어 가게 하십시오
  alternative_readings:
  - 그를 풀어 놓으십시오
  - 그를 놓아 주십시오
  rationale: 예수의 명령은 단순한 해제가 아니라 묶임에서의 해방과 이동 허용을 함께 포함하므로, 두 의미를 모두 드러내는 형태로 옮겼습니다.
  doctrine_reference: 본문 의미 보존
