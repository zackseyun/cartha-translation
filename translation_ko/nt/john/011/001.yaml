source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: Now a certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
  footnotes:
  - marker: a
    text: Or, 'Now there was someone sick, Lazarus of Bethany, from the village of Mary and Martha her sister.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 어떤 사람이 병들어 있었는데, 베다니 출신의 나사로였습니다. 그곳은 마리아와 그녀의 자매 마르다가 사는 마을이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어떤 사람’은 원문의 τις를 살린 표현이며, 이름 나사로로 이어지는 서술상 도입입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δέ τις
  english_pob_choice: Now a certain man was
  chosen_korean: 그런데 어떤 사람이 병들어 있었는데
  alternatives_korean:
  - 그리고 어떤 사람이 병들어 있었습니다
  - 그런데 한 사람이 병들어 있었습니다
  lexicon: BDAG
  rationale: δέ의 서사 전개를 ‘그런데’로 자연스럽게 살리고, τις의 불특정하지만 특정된 인물을 ‘어떤 사람’으로 옮겼습니다. 주어를 바로 이름으로 이어 주기보다 병든 상태를 먼저 제시하는 원문 흐름을 따랐습니다.
- source_word: ἀσθενῶν
  english_pob_choice: was sick
  chosen_korean: 병들어 있었는데
  alternatives_korean:
  - 아팠는데
  - 쇠약해져 있었는데
  lexicon: BDAG
  rationale: 이 문맥에서 ἀσθενῶν은 단순한 약함보다 병듦을 뜻하므로 ‘병들어 있었습니다’가 가장 직접적입니다. 서술을 매끄럽게 하기 위해 뒤의 이름 소개로 연결되는 -는데 형식을 사용했습니다.
- source_word: ἀπὸ Βηθανίας
  english_pob_choice: from Bethany
  chosen_korean: 베다니 출신의
  alternatives_korean:
  - 베다니에서 온
  - 베다니의
  lexicon: BDAG
  rationale: ἀπό의 출신/기원을 살려 ‘출신의’로 옮겼습니다. 이름 뒤에 붙여 인물의 연고지를 간결하게 표시했습니다.
- source_word: ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  english_pob_choice: from the village of Mary and her sister Martha
  chosen_korean: 그곳은 마리아와 그녀의 자매 마르다가 사는 마을이었습니다
  alternatives_korean:
  - 마리아와 그녀의 자매 마르다가 사는 마을이었습니다
  - 마리아와 마르다 자매의 마을이었습니다
  lexicon: BDAG
  rationale: κώμη는 도시보다 작은 ‘마을’이므로 그렇게 옮겼습니다. 영어 POB처럼 마르다가 마리아의 자매임을 분명히 하되, 한국어에서는 ‘그녀의 자매’로 자연스럽게 처리해 관계를 드러냈습니다.
