id: JHN.11.13
reference: John 11:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Now Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
  footnotes:
  - marker: a
    text: Or, more literally, 'about the sleep of sleep,' that is, about literal sleep rather than death.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서는 나사로의 죽음에 관하여 말씀하셨던 것입니다. 그러나 그들은 예수께서 잠[a]에 관하여 말씀하신다고 생각했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘잠의 잠’입니다. 여기서 제자들은 죽음이 아니라 문자 그대로 잠드는 일을 가리킨다고 생각했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  english_pob_choice: had spoken
  chosen_korean: 말씀하신 것이었습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말씀해 두셨습니다
  lexicon: BDAG
  rationale: 과거보다 앞선 발화를 나타내는 완료적 뉘앙스를 한국어의 과거 완료적 표현으로 살렸습니다.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  english_pob_choice: about his death
  chosen_korean: 그의 죽음에 대해
  alternatives_korean:
  - 그의 죽음에 관해
  - 그가 죽는 일에 대해
  lexicon: BDAG
  rationale: περί+속격의 의미를 자연스러운 현대 한국어로 옮기되, 예수의 말씀 대상이 라자로의 죽음을 가리킨다는 맥락을 유지했습니다.
- source_word: κοιμήσεως τοῦ ὕπνου
  english_pob_choice: the sleep of rest
  chosen_korean: 잠의 잠
  alternatives_korean:
  - 잠의 휴식
  - 잠의 잠자기
  lexicon: BDAG
  rationale: 본문의 반복 구조를 그대로 드러내기 위해 직역적 반복을 살렸고, 이는 예수의 비유적 '죽음'과 제자들의 문자적 '잠' 이해를 대비시킵니다.
- source_word: ἐκεῖνοι ἔδοξαν
  english_pob_choice: they thought
  chosen_korean: 그들은 ... 생각했습니다
  alternatives_korean:
  - 그들은 ... 여겼습니다
  - 그들은 ... 추정했습니다
  lexicon: BDAG
  rationale: 잘못 이해한 인식을 나타내는 동사이므로, 가장 자연스럽고 오해의 성격을 담기 쉬운 '생각했습니다'로 옮겼습니다.
theological_decisions:
- issue: '''sleep'' 비유를 어떻게 처리할지'
  chosen_reading: 예수의 죽음 언급과 제자들의 문자적 수면 이해를 그대로 대비시키고, 사후 상태 교리를 암시하는 방향으로 확장하지 않았습니다.
  alternative_readings:
  - 죽음을 완전히 완곡하게만 처리하기
  - 영혼수면 교리처럼 읽힐 표현을 덧붙이기
  rationale: 본문은 비유적 표현과 오해를 대조할 뿐, 여기서 교리를 정식화하지 않습니다. 따라서 서술의 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문의 오해 구조를 보존하고 교리적 확장을 피함
- issue: 문체상 인용 여부
  chosen_reading: 예수의 직접 인용이 아닌 서술문으로 유지했습니다.
  alternative_readings:
  - 직접화법처럼 재구성하기
  rationale: 그리스어 본문도 내러티브 서술을 사용하므로, 한국어도 같은 서술층위를 유지하는 것이 적절합니다.
  doctrine_reference: 서술 시점과 화자 층위 보존
