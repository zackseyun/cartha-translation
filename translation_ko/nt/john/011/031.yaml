review_pass:
  verdict: revise
  source_fidelity: 주어를 이루는 두 분사구(마리아와 함께 집 안에 있던 / 마리아를 위로하던)는 모두 οἱ Ἰουδαῖοι를 수식합니다. 초안의 ‘...유다 사람들과 그녀를 위로하고 있던 사람들은’은 이를 두 집단처럼 만들고, ‘그와’는 선행 대상도 불분명합니다. 이를 한 집단을 가리키는 관계절로 바로잡았습니다. 마리아가 ‘급히 일어나 나갔다’는 완료된 사건과, 그들이 무덤에 가서 울려 한다고 추정한 의미도 보존했습니다.
  naturalness: ‘마리아와 함께 집 안에 있으면서 마리아를 위로하던 유대인들은’은 현대 표준어 합쇼체 문장으로 자연스럽고, 원문의 수식 관계를 명료하게 드러냅니다. ‘울려고 그러는 줄 알고’는 구어적 뉘앙스가 있으므로 ‘울려고 한다고 생각하여’로 다듬었습니다.
  terminology: Ἰουδαῖοι는 영어 POB의 ‘the Jews’ 및 이 문맥의 애도객 집단이라는 지시를 따라 ‘유대인들’로 옮겼습니다. 지리적 의미 가능성은 각주에서 ‘유다 사람들’ 대안으로 보존했습니다. μνημεῖον은 문맥에 맞게 ‘무덤’으로 유지했습니다.
  issues:
  - severity: high
    issue: 주어 수식 구조가 두 집단으로 분리됨
    rationale: ‘유다 사람들과 그녀를 위로하고 있던 사람들은’은 καὶ로 연결된 두 분사구가 동일한 명사 οἱ Ἰουδαῖοι를 수식한다는 원문 구조를 ‘유다 사람들’과 별도의 ‘위로하던 사람들’이라는 두 집단으로 오해하게 합니다.
  - severity: medium
    issue: ‘그와 함께’의 지시 대상이 불명확함
    rationale: 원문 αὐτῆς는 마리아를 가리키지만, 한국어 초안의 ‘그’는 문맥상 명확하지 않습니다. ‘마리아와 함께’라고 밝혀야 합니다.
  - severity: low
    issue: 추정 표현의 문체
    rationale: ‘울려고 그러는 줄 알고’는 의미는 전달하지만 현대 공적 성경문체로는 다소 구어적입니다. ‘울려고 한다고 생각하여’가 δόξαντες의 추정을 자연스럽고 격식 있게 반영합니다.
