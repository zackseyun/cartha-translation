id: JHN.11.31
reference: John 11:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' In John, Ἰουδαῖοι can sometimes refer more narrowly to people from Judea or to the Judean leadership, but here it refers to the group mourning with Mary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그와 함께 집 안에 있던 유다 사람들과 그녀를 위로하고 있던 사람들은 마리아가 급히 일어나 나가는 것을 보고, 그녀가 무덤으로 가서 거기서 울려고 그러는 줄 알고 그녀를 따라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 Ἰουδαῖοι는 마리아와 함께 있는 조문객들을 가리키며, 문맥에 따라 ‘유대인들’ 또는 ‘유다 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  english_pob_choice: So the Jews
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: BDAG
  rationale: 요한복음의 Ἰουδαῖοι는 문맥에 따라 넓거나 좁게 쓰이므로, 여기서는 마리아와 함께 있는 조문객 집단을 가리키는 점을 살려 ‘유다 사람들’로 옮겼습니다.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  english_pob_choice: who were with her in the house and comforting her
  chosen_korean: 그녀와 함께 집 안에 있던 사람들과 그녀를 위로하고 있던 사람들
  alternatives_korean:
  - 그녀와 함께 집에 있던 사람들과 그녀를 위로하던 사람들
  - 그녀와 함께 그 집에 있던 사람들과 그녀를 위로하는 사람들
  lexicon: BDAG
  rationale: 분사구를 관계절로 풀어, 집 안에서 함께 있었고 실제로 위로하고 있던 조문객이라는 뜻을 자연스럽게 드러냈습니다.
- source_word: ἰδόντες τὴν Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν
  english_pob_choice: when they saw that Mary got up quickly and went out
  chosen_korean: 마리아가 급히 일어나 나가는 것을 보고
  alternatives_korean:
  - 마리아가 급히 일어나 밖으로 나가는 것을 보고
  - 마리아가 빨리 일어나 나가는 것을 보고
  lexicon: BDAG
  rationale: ἀνέστη는 여기서 부활이 아니라 자리에서 일어남을 뜻하므로 ‘일어나’로 옮겼고, ταχέως는 ‘급히’로 자연스럽게 표현했습니다.
- source_word: δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ
  english_pob_choice: thinking that she was going to the tomb to weep there
  chosen_korean: 그녀가 무덤으로 가서 거기서 울려고 그러는 줄 알고
  alternatives_korean:
  - 그녀가 무덤으로 가서 거기서 울려고 한다고 생각하고
  - 그녀가 무덤으로 가서 거기서 울 것이라고 생각하고
  lexicon: BDAG
  rationale: δόξαντες는 추측을, ἵνα κλαύσῃ ἐκεῖ는 목적을 나타내므로, ‘울려고’로 목적 의미를 살리면서 한국어 문맥에 맞게 풀었습니다.
theological_decisions:
- issue: Ἰουδαῖοι의 번역 범위
  chosen_reading: 이 절에서는 마리아와 함께 있는 조문객 집단을 가리키는 말로 읽고 ‘유다 사람들’로 옮겼습니다.
  alternative_readings:
  - 유대인들
  - 유다인들
  rationale: 요한복음에서 Ἰουδαῖοι는 문맥에 따라 민족·지역·지도층을 가리킬 수 있으므로, 여기서는 장례 장면의 실제 화자를 좁혀 읽는 쪽을 택했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 요한복음의 문맥 민감한 용례 보존
