id: JHN.11.46
reference: John 11:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
  footnotes:
  - marker: a
    text: Or 'reported to them what Jesus did.' The Greek does not explicitly state the motive of those who went to the Pharisees.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그들 가운데 몇 사람은 바리새인들에게 가서 예수께서 하신 일을 그들에게 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 그들이 어떤 의도로 바리새인들에게 갔는지를 직접 밝히지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: τινὲς
  english_pob_choice: some
  chosen_korean: 몇 사람은
  alternatives_korean:
  - 어떤 사람들은
  - 일부는
  lexicon: BDAG
  rationale: 전체 무리 가운데 일부를 가리키는 불특정 복수이므로, 자연스러운 현대 한국어로는 ‘몇 사람은’이 가장 간결하고 의미를 잘 살립니다.
- source_word: ἀπῆλθον
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 떠났습니다
  lexicon: BDAG
  rationale: 문맥상 단순한 이동보다 바리새인들에게로 향해 간 동작이 핵심이어서, 한국어에서는 결과까지 자연스럽게 이어 주는 ‘가서’가 적절합니다.
- source_word: εἶπαν αὐτοῖς
  english_pob_choice: told them
  chosen_korean: 그들에게 알렸습니다
  alternatives_korean:
  - 그들에게 말했습니다
  - 그들에게 전했습니다
  lexicon: BDAG
  rationale: 단순 발화보다 ‘보고/전달’의 성격이 드러나므로, 중립적인 서술로 ‘알렸습니다’를 택했습니다.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  english_pob_choice: what Jesus had done
  chosen_korean: 예수께서 하신 일
  alternatives_korean:
  - 예수께서 하신 것
  - 예수님이 하신 일
  lexicon: BDAG
  rationale: 중성 관계대명사 ἃ는 예수의 행한 행위들을 포괄하므로, 한국어에서는 자연스럽게 ‘하신 일’로 옮겼습니다.
theological_decisions:
- issue: 그들이 바리새인들에게 간 의도
  chosen_reading: 본문은 그들이 무엇을 보고했는지만 말하며, 적대적 의도를 직접 말하지 않습니다.
  alternative_readings:
  - 예수님을 고발하려고 갔다
  - 예수님을 배신하려고 갔다
  rationale: 문맥상 긴장은 있을 수 있지만, 이 절 자체는 동기까지 명시하지 않으므로 판단을 덧붙이지 않고 중립적으로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
