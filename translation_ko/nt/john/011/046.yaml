  terminology: ‘바리새인들’과 ‘예수’는 성경 번역에서 통용되는 명칭이며, ‘예수께서’는 본문 전체의 격식 있는 존대 서술과 일관됩니다. ‘하신 일’은 복수 관계대명사가 가리키는 행위들을 집합적으로 자연스럽게 표현합니다.
