  source_fidelity: 그리스어의 대조 접속사(δὲ), 앞선 무리 가운데 일부(τινὲς ἐξ αὐτῶν), 바리새인들에게 간 행위, 그리고 예수께서 하신 일을 그들에게 전한 내용을 충실히 반영합니다. ‘가서’는 ἀπῆλθον과 뒤따르는 목적지를 자연스러운 한국어 연쇄 동작으로 옮긴 표현이며, ‘알렸습니다’도 εἶπαν αὐτοῖς의 중립적인 보고 행위를 적절히 전달합니다.
