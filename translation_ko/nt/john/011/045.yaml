id: JHN.11.45
reference: John 11:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
  footnotes:
  - marker: a
    text: Or 'from among the Jews'; in some Johannine contexts, 'Judeans' is also argued as a possible rendering of Ἰουδαῖοι.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 마리아에게 와서 그가 하신 일을 본 유대인들[a] 가운데 많은 사람이 그를 믿었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유대인들 중에서 많은 사람’. 요한복음의 일부 문맥에서 Ἰουδαῖοι는 ‘유대 지역 사람들’로도 옮길 수 있다는 견해가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  english_pob_choice: Therefore many
  chosen_korean: 그러므로 많은
  alternatives_korean:
  - 그래서 많은
  - 그리하여 많은
  lexicon: BDAG
  rationale: οὖν의 인과·결론 관계를 살려 ‘그러므로’로 옮기고, Πολλοὶ는 단순하고 자연스러운 ‘많은’으로 번역했습니다.
- source_word: ἐκ τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인들 가운데서
  alternatives_korean:
  - 유대인들 중에서
  - 유대인들로부터
  - 유대인들 가운데
  lexicon: BDAG
  rationale: ἐκ + partitive genitive의 부분적 의미를 한국어의 ‘가운데서’로 드러냈습니다. 이 구문은 단순 소속보다 집합 안에서의 일부를 가리키므로, 관용적인 ‘유대인들 가운데서’가 가장 자연스럽습니다.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  english_pob_choice: who had come to Mary
  chosen_korean: 마리아에게 왔고
  alternatives_korean:
  - 마리아에게 온
  - 마리아에게 와 있던
  - 마리아의 집에 왔고
  lexicon: BDAG
  rationale: 관계절의 참여를 자연스럽게 이어 주기 위해 ‘마리아에게 왔고’로 옮겼습니다. πρὸς τὴν Μαριὰμ은 단순한 위치가 아니라 마리아를 향해 온 이동을 가리킵니다.
- source_word: θεασάμενοι ἃ ἐποίησεν
  english_pob_choice: had seen what he had done
  chosen_korean: 그가 하신 일을 본
  alternatives_korean:
  - 그가 행하신 것을 본
  - 그가 하신 일들을 목격한
  - 그가 하신 것을 보고
  lexicon: BDAG
  rationale: θεάομαι의 ‘주의 깊게 보다/목격하다’ 의미를 살리되 과도하게 풀이하지 않고, ἃ ἐποίησεν은 관용적으로 ‘그가 하신 일’로 옮겼습니다.
- source_word: ἐπίστευσαν εἰς αὐτόν
  english_pob_choice: believed in him
  chosen_korean: 그를 믿게 되었습니다
  alternatives_korean:
  - 그를 믿었습니다
  - 그 안에 믿음을 두었습니다
  - 그를 신뢰하게 되었습니다
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω εἰς + 대명사 구문은 단순한 동의보다 인격적 신뢰의 방향성을 가집니다. 한국어에서는 ‘믿다’만으로도 충분히 전달되므로, 불필요한 신학적 확장을 피하면서 결과 상태를 드러내는 ‘믿게 되었습니다’를 택했습니다.
theological_decisions:
- issue: πιστεύω εἰς αὐτόν의 신앙 응답 표현
  chosen_reading: 그를 믿게 되었습니다
  alternative_readings:
  - 그를 믿었습니다
  - 그 안에 믿음을 두었습니다
  - 그를 신뢰했습니다
  rationale: 본문은 라자로 사건을 본 뒤 예수께로 향한 신뢰의 응답을 말합니다. 한국어에서 ‘믿다’는 이 문맥의 표준적 대응이며, ‘믿게 되었습니다’는 결과적·서술적 뉘앙스를 살리면서도 요한의 신앙 응답을 자연스럽게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: πιστεύω/πίστις의 기본 렌더링 원칙'
