  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ἐπίστευσαν은 단순 과거 서술이므로 ‘믿게 되었습니다’의 변화·결과 발생 뉘앙스보다 ‘믿었습니다’가 더 직접적입니다. 또한 분사구를 ‘와서 … 본’으로 묶어야 수식 범위와 사건 순서가 한국어에서 명확해집니다.
  naturalness: 초안의 ‘많은 유대인들 가운데서 마리아에게 왔고 … 본 이들이’는 ‘가운데서’의 부분 의미와 뒤따르는 관계절의 연결이 다소 어색합니다. ‘마리아에게 와서 … 본 유대인들 가운데 많은 사람이’는 현대 표준어 문장으로 자연스럽고 원문의 수식 관계를 보존합니다.
  terminology: Ἰουδαῖοι는 본문과 요한복음의 통상적 용례를 따라 ‘유대인들’로 유지합니다. πιστεύω εἰς αὐτόν은 불필요한 교리적 확장 없이 ‘그를 믿었습니다’로 옮깁니다.
