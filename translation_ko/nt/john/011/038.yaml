    text: 또는 ‘마음속으로 분노하시며’ 또는 ‘마음속으로 크게 괴로워하시며’. 이 동사는 매우 강한 표현이며, 단순한 슬픔만을 뜻하는 것은 아닐 수 있습니다.
    reason: lexical_alternative
