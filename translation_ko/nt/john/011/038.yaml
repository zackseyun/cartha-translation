  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
  footnotes:
  - marker: a
    text: Or 'indignant within himself' or 'greatly disturbed within himself'; the Greek verb is unusually strong and may suggest more than sorrow alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 예수께서는 다시 마음속으로 깊이 격동하시며[a] 무덤에 이르셨습니다. 그 무덤은 동굴이었고, 그 입구 앞에 돌이 놓여 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음속으로 분노하시며’ 또는 ‘마음속으로 크게 괴로워하시며’. 이 동사는 매우 강한 표현이며, 단순한 슬픔만을 뜻하는 것은 아닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: then
  chosen_korean: 다시 한번
  alternatives_korean:
  - 그러므로
  - 그래서
  lexicon: BDAG
  rationale: 이 연결사는 앞선 장면에서 이어지는 서술의 흐름을 표시하므로, 한국어에서는 원인-결론보다는 이야기 진행을 드러내는 표현이 자연스럽습니다.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  english_pob_choice: deeply moved within himself
  chosen_korean: 자기 안에서 깊이 동요하시며
  alternatives_korean:
  - 자기 안에서 크게 마음이 상하시며
  - 자기 안에서 분노하시며
  - 자기 안에서 몹시 괴로워하시며
  lexicon: BDAG
  rationale: 동사는 강한 내적 격동을 가리키며, 단순한 슬픔이나 분노로 좁히기보다 감정의 강도를 살리는 것이 원문과 POB의 신중한 처리에 맞습니다.
- source_word: μνημεῖον
  english_pob_choice: tomb
  chosen_korean: 무덤
  alternatives_korean:
  - 묘
  - 장지
  lexicon: BDAG
  rationale: 뒤이어 동굴과 돌문이 나오는 맥락에서 장례용 매장 장소를 뜻하므로, 현대 한국어에서는 '무덤'이 가장 직접적입니다.
- source_word: σπήλαιον
  english_pob_choice: cave
  chosen_korean: 동굴
  alternatives_korean:
  - 굴
  - 굴속
  lexicon: BDAG
  rationale: 이곳은 단순한 평지 무덤이 아니라 동굴형 매장소이므로, 형태를 분명히 드러내는 '동굴'이 적절합니다.
- source_word: λίθος ἐπέκειτο ἐπ’ αὐτῷ
  english_pob_choice: a stone was lying against it
  chosen_korean: 돌이 그 위를 막고 있었습니다
  alternatives_korean:
  - 돌이 그 앞에 놓여 있었습니다
  - 돌이 그것을 덮고 있었습니다
  - 돌이 그 위에 놓여 있었습니다
  lexicon: BDAG
  rationale: 동굴 입구를 막는 돌이라는 기능을 드러내기 위해, 단순한 위치보다 봉쇄의 의미가 살아 있는 표현을 택했습니다.
theological_decisions:
- issue: ἐμβριμώμενος의 감정 뉘앙스
  chosen_reading: 예수의 감정을 슬픔이나 분노로 단정하지 않고, 강한 내적 동요로 남겨 둡니다.
  alternative_readings:
  - 분노하셨습니다
  - 몹시 괴로워하셨습니다
  - 깊이 슬퍼하셨습니다
  rationale: 본문은 예수의 감정 강도를 분명히 하지만 정확한 정서는 논쟁적이므로, 해석을 서둘러 닫지 않고 원문의 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
