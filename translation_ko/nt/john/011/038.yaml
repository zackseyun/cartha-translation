revisions:
- from: 예수께서는 다시 한번 자기 안에서 깊이 동요하시며 무덤으로 가셨습니다. 그런데 그것은 동굴이었고, 돌이 그 위를 막고 있었습니다.[a]
  to: 이에 예수께서는 다시 마음속으로 깊이 격동하시며[a] 무덤에 이르셨습니다. 그 무덤은 동굴이었고, 그 입구 앞에 돌이 놓여 있었습니다.
  rationale: ‘이에’로 οὖν의 문맥 연결을, ‘다시’로 πάλιν을 반영했습니다. ἐμβριμώμενος ἐν ἑαυτῷ는 감정의 정확한 성격을 단정하지 않는 본문 표현과 대안 각주로 처리했습니다. 돌의 위치는 동굴무덤 문맥에 맞추어 ‘그 입구 앞에’로 옮겨, 원문의 위치 묘사를 과도하게 해석하지 않으면서도 한국어로 자연스럽게 전달했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:34Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 οὖν의 연결 기능을 번역문에서 빠뜨렸고, ‘돌이 그 위를 막고’는 동굴인 무덤을 받는 ‘그 위’가 공간적으로 부자연스러우며 ἐπ’ αὐτῷ의 문맥상 위치를 충분히 정확하게 전달하지 못합니다. ‘이에’로 서술 연결을 살리고, 돌의 위치를 동굴무덤의 입구와 관련하여 자연스럽게 표현하는 것이 안전합니다.
  naturalness: ‘자기 안에서 깊이 동요하시며’는 이해되지만 현대 표준 한국어에서는 ‘마음속으로 깊이 격동하시며’가 더 자연스럽고 원문의 강한 정서적 동요를 잘 보존합니다. ‘그 입구 앞에 돌이 놓여 있었습니다’는 동굴무덤 묘사에 자연스럽습니다.
  terminology: ‘무덤’과 ‘동굴’은 μνημεῖον과 σπήλαιον에 적절합니다. 논쟁적인 ἐμβριμώμενος는 본문에서 특정 감정으로 단정하지 않고 ‘깊이 격동하시며’로 두며, 각주에서 ‘분노’ 및 ‘크게 동요/괴로움’의 가능성을 제시합니다.
  issues:
  - severity: medium
    issue: οὖν의 연결 기능이 누락됨
    rationale: 초안의 ‘다시 한번’은 πάλιν에 해당할 뿐 οὖν(그러므로/이에/그래서)의 앞 문맥 연결을 전달하지 않습니다.
  - severity: medium
    issue: ‘돌이 그 위를 막고 있었습니다’의 지시와 공간 표현이 부정확하고 부자연스러움
    rationale: 무덤이 동굴이라고 한 직후 ‘그 위’라고 하면 돌이 동굴의 꼭대기를 덮는 듯 들립니다. 문맥상 돌은 동굴무덤의 입구에 놓여 있거나 입구를 가로막고 있는 것입니다.
  - severity: low
    issue: 정서 표현의 현대적 자연스러움
    rationale: ‘자기 안에서 깊이 동요하시며’도 가능하나, ‘마음속으로 깊이 격동하시며’가 ἐν ἑαυτῷ 및 강한 ἐμβριμάομαι의 뉘앙스를 더 자연스럽게 나타냅니다.
  revised_text: 이에 예수께서는 다시 마음속으로 깊이 격동하시며[a] 무덤에 이르셨습니다. 그 무덤은 동굴이었고, 그 입구 앞에 돌이 놓여 있었습니다.
