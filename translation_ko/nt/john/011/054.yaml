id: JHN.11.54
reference: John 11:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
  footnotes:
  - marker: a
    text: Or 'among the Judeans.' In John, 'the Jews' can sometimes refer more specifically to people in Judea or to the Judean authorities, depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 예수님께서는 더 이상 유대인들[a] 가운데에서 공개적으로 다니지 않으셨습니다. 그 대신 그곳을 떠나 광야 가까이에 있는 지역, 곧 에브라임이라 불리는 도시로 가셔서 제자들과 함께 그곳에 머무르셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 지방 사람들 가운데에서.’ 요한복음에서 ‘유대인들’은 문맥에 따라 유대 지방 사람들 또는 유대 당국을 더 구체적으로 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι παρρησίᾳ περιεπάτει
  english_pob_choice: no longer walked openly
  chosen_korean: 더 이상 공개적으로 다니지 않으셨습니다
  alternatives_korean:
  - 더 이상 드러내 놓고 다니지 않으셨습니다
  - 더 이상 사람들 앞에서 다니지 않으셨습니다
  lexicon: BDAG
  rationale: παρρησίᾳ의 공적·공개적 뉘앙스를 살려 ‘공개적으로’로 옮기고, περιεπάτει는 이동 관용구로서 자연스러운 ‘다니지 않으셨습니다’를 택했습니다.
- source_word: ἐν τοῖς Ἰουδαίοις
  english_pob_choice: among the Jews
  chosen_korean: 유대인들 가운데서
  alternatives_korean:
  - 유대 사람들 가운데서
  - 유대인들 사이에서
  lexicon: BDAG
  rationale: 문맥상 지역적·사회적 범위 안에서의 공개 활동을 가리키므로 ‘가운데서’로 관계를 살렸고, 영어 POB의 기본 본문 선택을 따라 ‘유대인들’을 유지했습니다.
- source_word: ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου
  english_pob_choice: departed from there to the region near the wilderness
  chosen_korean: 거기서 떠나 광야 가까이에 있는 지역으로
  alternatives_korean:
  - 거기서 떠나 황야 근처의 지역으로
  - 거기서 떠나 사막 가까이에 있는 지방으로
  lexicon: BDAG
  rationale: χώραν은 현대 지리 용어로는 ‘지역’이 가장 무난하고, ἔρημος는 성경적 지리 표현에 맞게 ‘광야’로 옮겼습니다.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  english_pob_choice: to a city called Ephraim
  chosen_korean: 에브라임이라 불리는 한 도시로
  alternatives_korean:
  - 에브라임이라고 불리는 한 마을로
  - 에브라임이라는 도시로
  lexicon: BDAG
  rationale: λεγομένην은 수동 분사로 ‘불리는’이 가장 직접적이며, πόλις를 ‘도시’로 옮겨 장소 식별을 분명히 했습니다.
- source_word: κἀκεῖ ἔμεινεν μετὰ τῶν μαθητῶν
  english_pob_choice: and stayed there with the disciples
  chosen_korean: 제자들과 함께 거기 머무르셨습니다
  alternatives_korean:
  - 제자들과 함께 그곳에 머무르셨습니다
  - 제자들과 함께 거기서 머무르셨습니다
  lexicon: BDAG
  rationale: μένω의 지속 거주·체류 뉘앙스를 살려 ‘머무르셨습니다’로 옮겼고, μαθητῶν은 소유격이 없으므로 단순히 ‘제자들’로 번역했습니다.
theological_decisions:
- issue: Ἰουδαῖοι의 번역과 요한복음 내 의미 범위
  chosen_reading: 유대인들
  alternative_readings:
  - 유대 사람들
  - 유대인들/유대 사람들
  rationale: 이 절에서는 예수님이 공개적으로 활동하던 대상 집단을 지시하는 서술이므로 본문은 익숙한 ‘유대인들’을 유지하되, 용례상 지역적 의미 가능성은 각주로 남겨 과도한 일반화나 반대로 지나친 축소를 피했습니다.
  doctrine_reference: Translation philosophy §3, §5
