  to: 그래서 예수님께서는 더 이상 유대인들[a] 가운데에서 공개적으로 다니지 않으셨습니다. 그 대신 그곳을 떠나 광야 가까이에 있는 지역, 곧 에브라임이라 불리는 도시로 가셔서 제자들과 함께 그곳에 머무르셨습니다.
  rationale: 의미를 바꾸지 않고, 도시와 지역의 관계를 한국어에서 더 분명히 했습니다. 또한 Ἰουδαῖοι의 지역적 대안이 본문 번역과 실질적으로 구별되도록 각주 표현을 조정했습니다.
