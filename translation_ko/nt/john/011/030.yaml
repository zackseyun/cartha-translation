    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  english_pob_choice: not yet
  chosen_korean: 아직 ... 않
  alternatives_korean:
  - 아직 ... 아니
  lexicon: BDAG
  rationale: 부정의 미완료 상태를 자연스러운 한국어로 살려, 예수께서 그 시점까지 마을에 들어오시지 않았음을 분명히 했습니다.
- source_word: ἐληλύθει
  english_pob_choice: had ... come
  chosen_korean: 들어오시지 않았
  alternatives_korean:
  - 오시지 않았
  - 도착하지 않으셨
  lexicon: BDAG
  rationale: 문맥상 ‘마을 안으로 오다/들어오다’의 의미가 핵심이므로, 단순한 도착보다 장소 진입을 드러내는 ‘들어오시다’를 택했습니다.
- source_word: κώμην
  english_pob_choice: village
  chosen_korean: 마을
  alternatives_korean:
  - 촌락
  - 촌
  lexicon: BDAG
  rationale: κώμη를 현대 한국어에서 가장 자연스럽고 과장되지 않게 옮기면 ‘마을’이 적절합니다.
- source_word: ὑπήντησεν αὐτῷ
  english_pob_choice: had met him
  chosen_korean: 그분을 만났던
  alternatives_korean:
  - 그분에게 나가 맞이했던
  - 그분을 만나러 나갔던
  lexicon: BDAG
  rationale: 본문은 마르다가 예수님을 만난 위치를 가리키므로, 기본값은 ‘만나다’로 두되 과도한 해석을 피했습니다.
theological_decisions:
- issue: 주어 예수님의 호칭과 존대 표현
  chosen_reading: 예수께서는 ... 들어오시지 않았고 ... 계셨습니다
  alternative_readings:
  - 예수는 ... 들어오지 않았고 ... 있었다
  rationale: 서술문에서는 합쇼체를 유지하되, 예수님을 주어로 할 때는 한국어 존대 체계를 반영해 ‘-시-’를 사용했습니다.
  doctrine_reference: Korean biblical style / reverence in direct reference to Jesus
