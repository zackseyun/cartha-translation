id: JHN.11.4
reference: John 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
  footnotes:
  - marker: a
    text: Or “does not lead to death.” The Greek expression can denote that death is not the final outcome or purpose of the sickness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수님께서 들으시고 말씀하셨습니다. “이 병은 죽음에 이르는 것이 아니라 하나님의 영광을 위한 것이며, 이것으로 말미암아 하나님의 아들이 영광을 받게 하려는 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας δὲ
  english_pob_choice: But when Jesus heard it
  chosen_korean: 그러나 예수님께서 들으시고
  alternatives_korean:
  - 예수님께서 들으신 뒤
  - 예수님께서 듣고
  lexicon: BDAG
  rationale: 부사절의 시간적 선행을 자연스럽게 풀어내되, δέ의 흐름 전환은 그러나로 반영했습니다.
- source_word: ἀσθένεια
  english_pob_choice: sickness
  chosen_korean: 병
  alternatives_korean:
  - 질병
  - 아픔
  lexicon: BDAG
  rationale: 라자로나의 상태를 가리키는 일반적 표현으로, 문맥상 ‘병’이 가장 자연스럽고 과도하게 의학화하지 않습니다.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  english_pob_choice: is not unto death
  chosen_korean: 죽음에 이르는 것이 아니라
  alternatives_korean:
  - 죽음을 향한 것이 아니라
  - 죽음으로 끝나는 것이 아니라
  lexicon: BDAG
  rationale: πρὸς + 대격의 목적/결과 뉘앙스를 살려, 실제 죽음을 배제한다기보다 최종 목적이나 결말이 죽음이 아님을 드러냈습니다.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  english_pob_choice: for the glory of God
  chosen_korean: 하나님의 영광을 위한 것이며
  alternatives_korean:
  - 하나님의 영광을 위하여
  - 하나님의 영광을 위해
  lexicon: BDAG
  rationale: ὑπέρ의 목적/유익 의미를 한국어로 간결하게 살리면서, 뒤의 ἵνα 절과도 자연스럽게 연결했습니다.
- source_word: δι’ αὐτῆς
  english_pob_choice: through it
  chosen_korean: 이것으로 말미암아
  alternatives_korean:
  - 그것을 통하여
  - 그것으로
  lexicon: BDAG
  rationale: διά + 속격의 수단성을 살리되, 앞의 ‘병’을 가리키는 대명사 관계를 한국어에서 더 분명하게 드러냈습니다.
theological_decisions:
- issue: ‘죽음에 이르는 것이 아니다’의 의미
  chosen_reading: 이 병이 최종 목적이나 결과로서 죽음을 향하는 것이 아니라는 뜻으로 읽었습니다.
  alternative_readings:
  - 라자로가 실제로 죽지 않는다는 단정
  - 단지 ‘치명적이지 않다’는 뜻으로 약화하는 읽기
  rationale: 본문 뒤의 서술에서 라자로가 실제로 죽지만, 문장은 그 죽음이 최종 결론이 아님을 말하므로 긴장을 보존해야 합니다.
  doctrine_reference: 본문의 종말 목적 진술을 실제 사건 서술과 구별하여 보존
