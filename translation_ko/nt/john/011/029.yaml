lexical_decisions:
- source_word: ἐκείνη
  english_pob_choice: she
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 사람
  - 그 여자분
  - 그 이는
  lexicon: BDAG
  rationale: 직전 문맥의 마리아를 가리키는 지시어이므로, 한국어에서는 문맥상 자연스러운 인칭 표현으로 풀어 옮겼습니다. 여성 지시를 분명히 하되, 단순 대명사보다 서술 흐름이 분명한 ‘그 여자’를 택했습니다.
- source_word: ὡς ἤκουσεν
  english_pob_choice: when she heard it
  chosen_korean: 그것을 듣고서
  alternatives_korean:
  - 들었을 때
  - 듣자
  - 그 말을 듣고
  lexicon: BDAG
  rationale: ὡς의 시간 용법과 직전 절의 보고 내용을 반영하여, 한국어에서는 결과적으로 ‘듣고서’로 자연스럽게 연결했습니다. ‘그것을’은 앞절의 소식을 가리키는 내용을 드러냅니다.
- source_word: ἠγέρθη ταχὺ
  english_pob_choice: she got up quickly
  chosen_korean: 급히 일어나
  alternatives_korean:
  - 빨리 일어나
  - 서둘러 일어나
  - 곧바로 일어나
  lexicon: BDAG
  rationale: ἠγέρθη는 여기서 수동이 아니라 ‘일어나다’의 관용적 용법이므로, 오해 없이 능동적 의미를 살려 번역했습니다. ταχὺ는 행위의 신속함을 강조하므로 ‘급히’가 자연스럽습니다.
- source_word: ἤρχετο πρὸς αὐτόν
  english_pob_choice: went to him
  chosen_korean: 그에게로 가고 있었습니다
  alternatives_korean:
  - 그에게 갔습니다
  - 그에게로 갔습니다
  - 그를 향해 갔습니다
  lexicon: BDAG
  rationale: 미완료 시제의 진행성을 살려 ‘가고 있었습니다’로 옮겼습니다. πρός + 대격은 방향성을 나타내므로 ‘에게로’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 미완료 시제 ἤρχετο의 서술 효과
  chosen_reading: 행동이 진행 중인 모습을 살려 ‘가고 있었습니다’로 번역했습니다.
  alternative_readings:
  - 갔습니다
  - 가고 있었습니다
  rationale: 이 절은 마리아가 즉시 반응하여 예수께 향하는 장면의 긴박함을 보여 주므로, 단순한 과거 완료보다 진행상을 드러내는 번역이 본문의 분위기를 더 잘 보존합니다.
  doctrine_reference: 서사 문맥 보존
