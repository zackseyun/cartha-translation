id: JHN.11.57
reference: John 11:57
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: Now the chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
  footnotes:
  - marker: a
    text: Or, more literally, 'where he is.' The Greek has a present tense ('is'), but English often shifts to 'was' after a past reporting verb.
    reason: lexical_alternative
  - marker: b
    text: '''Seize'' could also be rendered ''arrest'' in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 대제사장들과 바리새인들은 누구든지 예수께서 어디에 계시는지 알게 되면 알려야 한다는 명령을 이미 내려 두었습니다. 이는 그들이 예수님을 붙잡기[a] 위해서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙잡다’는 이 문맥에서 ‘체포하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  english_pob_choice: had given
  chosen_korean: 이미 내렸습니다
  alternatives_korean:
  - 내렸었습니다
  - 주었습니다
  - 지시했습니다
  lexicon: BDAG
  rationale: 과거 완료의 선행성을 살리면서 한국어에서는 ‘명령을 내리다’가 가장 자연스럽고 공식적인 표현이어서 이렇게 옮겼습니다.
- source_word: ἀρχιερεῖς
  english_pob_choice: chief priests
  chosen_korean: 대제사장들
  alternatives_korean:
  - 수석 제사장들
  - 주된 제사장들
  lexicon: BDAG
  rationale: 요한복음의 이 표현은 단일한 ‘대제사장’이 아니라 제사장 지도층 전체를 가리키므로 복수형을 살려 ‘대제사장들’로 옮겼습니다.
- source_word: ἐντολὰς
  english_pob_choice: orders
  chosen_korean: 명령
  alternatives_korean:
  - 지시
  - 지침
  - 명령들
  lexicon: BDAG
  rationale: 공식적이고 권위 있는 지시라는 점을 살려 ‘명령’으로 옮겼고, 문맥상 복수의 구체적 지시를 한국어에서 자연스럽게 통합했습니다.
- source_word: πιάσωσιν
  english_pob_choice: might seize
  chosen_korean: 붙잡으려는
  alternatives_korean:
  - 잡으려는
  - 체포하려는
  - 붙들려는
  lexicon: BDAG
  rationale: πιάζω의 핵심은 ‘붙잡다/붙들다’이므로, 법적 뉘앙스를 과도하게 좁히는 ‘체포하다’보다 넓은 의미를 살린 ‘붙잡다’가 적절합니다.
theological_decisions:
- issue: 예수의 현재 위치를 나타내는 간접화법의 시제 처리
  chosen_reading: ‘어디에 계신지’로 현재 상태를 살려 번역했습니다.
  alternative_readings:
  - ‘어디에 계셨는지’
  - ‘어디에 있는지’
  rationale: 그리스어는 직접적으로 ‘그가 어디에 있는지’(현재 시제)라고 말하지만, 한국어에서는 보고 시점의 시제를 굳이 과거로 바꾸지 않고도 자연스럽게 현재 상태를 유지할 수 있습니다.
  doctrine_reference: 서술의 직접성 보존
