revisions:
- from: 이제 대제사장들과 바리새인들은 누가 예수께서 어디에 계신지 알게 되면 보고하라는 명령을 이미 내렸습니다. 그렇게 하여 그를 붙잡으려는 것이었습니다.[a][b]
  to: 대제사장들과 바리새인들은 누구든지 예수께서 어디에 계시는지 알게 되면 알려야 한다는 명령을 이미 내려 두었습니다. 이는 그들이 예수님을 붙잡기[a] 위해서였습니다.
  rationale: δέ에 대한 불필요한 시간 부사를 제거하고, δεδώκεισαν의 선행성을 ‘이미 내려 두었습니다’로 자연스럽게 나타냈습니다. ἵνα ἐάν τις γνῷ … μηνύσῃ의 명령 내용을 ‘누구든지 … 알게 되면 알려야 한다’로, ὅπως πιάσωσιν αὐτόν의 목적을 ‘그들이 예수님을 붙잡기 위해서’로 명료하게 옮겼습니다. 현재형 ἐστιν은 한국어 ‘계시는지’로 보존했습니다. 중복된 시제 각주는 삭제하고, 어휘 대안 각주의 앵커를 해당 단어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:37Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존했지만, 문두의 ‘이제’는 원문의 δέ가 요구하지 않는 시간 부사이며, 둘째 문장의 ‘그렇게 하여 … 것이었습니다’는 ὅπως가 나타내는 목적 관계와 그 주체를 다소 불분명하게 합니다. 목적절을 명시적으로 옮기는 것이 안전합니다.
  naturalness: ‘명령을 이미 내렸습니다’는 자연스럽지만, ‘그렇게 하여 그를 붙잡으려는 것이었습니다’는 문어적으로 어색하고 누가 붙잡으려 했는지가 불명확합니다. ‘이는 그들이 예수님을 붙잡기 위해서였습니다’가 현대 표준어 합쇼체에 더 자연스럽습니다.
  terminology: ‘대제사장들’, ‘바리새인들’, ‘명령’, ‘붙잡다’는 적절합니다. 다만 본문의 [a]는 본문과 동일한 표현을 ‘직역’으로 제시하여 기능하지 않으므로 제거해야 하며, ‘붙잡다’의 대안 각주는 해당 낱말 바로 뒤에 붙여야 합니다.
  issues:
  - severity: medium
    issue: ‘이제’가 δέ를 시간 부사처럼 번역합니다.
    rationale: δέ는 여기서 약한 연결·전개 표지이며 ‘이제’라는 시간 의미를 명시하지 않습니다. 한국어에서는 자연스럽게 생략할 수 있습니다.
  - severity: medium
    issue: 목적절의 의미와 주체가 불명확합니다.
    rationale: ὅπως πιάσωσιν αὐτόν은 그 명령의 목적, 곧 지도자들이 예수님을 붙잡기 위한 것임을 나타냅니다. ‘그렇게 하여 … 것이었습니다’보다 목적을 직접 밝혀야 합니다.
  - severity: low
    issue: 각주 a가 중복되고 앵커가 기능하지 않습니다.
    rationale: 본문이 이미 ‘어디에 계시는지’라고 번역하면서 같은 말을 ‘직역’으로 제시합니다. 한국어 번역에서는 시제 전환이 없어 해당 각주가 필요하지 않습니다.
  - severity: low
    issue: 각주 b의 앵커 위치가 부정확합니다.
    rationale: ‘체포하다’ 대안은 ‘붙잡다’에 관한 것이므로 그 표현 바로 뒤에 배치해야 합니다.
