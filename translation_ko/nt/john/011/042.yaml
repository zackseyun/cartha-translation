id: JHN.11.42
reference: John 11:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
  footnotes:
  - marker: a
    text: Or 'for the sake of the crowd standing around.'
    reason: lexical_alternative
  - marker: b
    text: The Greek explicitly says 'that you sent me,' with emphasis on 'you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 아버지께서 언제나 제 말을 들어 주신다는 것을 알고 있었습니다. 그러나 제가 이렇게 말씀드린 것은 주위에 서 있는 군중 때문입니다[a]. 그들이 아버지께서 저를 보내셨다는 것을 믿도록 하기 위해서입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주위에 서 있는 군중을 위하여’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘당신이 나를 보내셨다’라고 말하며, ‘당신’에 강조가 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ᾔδειν
  english_pob_choice: I knew
  chosen_korean: 알고 있었습니다
  alternatives_korean:
  - 알았습니다
  - 알고 있었습니다
  lexicon: BDAG
  rationale: οἶδα의 미완료/과거적 용법을 자연스러운 한국어로 옮기되, 기도 발화의 지속적 확신을 드러내기 위해 ‘알고 있었습니다’를 택했습니다.
- source_word: πάντοτέ μου ἀκούεις
  english_pob_choice: you always hear me
  chosen_korean: 언제나 저를 들으신다는 것
  alternatives_korean:
  - 항상 제 말을 들으신다는 것
  - 항상 저를 들어 주신다는 것
  lexicon: BDAG
  rationale: ἀκούω + 속격의 ‘듣다/들으시다’ 의미를 살려, 예수와 아버지의 관계를 해치지 않으면서도 한국어로는 ‘들으신다’로 간결하게 옮겼습니다.
- source_word: διὰ τὸν ὄχλον τὸν περιεστῶτα
  english_pob_choice: because of the crowd standing around
  chosen_korean: 둘러서 있는 군중 때문에
  alternatives_korean:
  - 주위에 서 있는 군중 때문에
  - 둘러선 군중을 위해
  lexicon: BDAG
  rationale: διά + 대격의 원인/이유를 ‘때문에’로 옮기고, περιεστῶτα는 공간적으로 주변에 서 있는 모습을 살려 ‘둘러서 있는’으로 표현했습니다.
- source_word: ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας
  english_pob_choice: so that they may believe that you sent me
  chosen_korean: 이는 그들이 아버지께서 저를 보내셨다는 것을 믿게 하려는 것입니다
  alternatives_korean:
  - 그래서 그들이 아버지께서 저를 보내셨다는 것을 믿게 하려는 것입니다
  - 그들이 아버지께서 저를 보내셨음을 믿도록 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα의 목적을 분명히 살리고, ἀπέστειλας는 요한복음의 ‘보내다’ 신학을 유지하는 ‘보내셨다’로 옮겼습니다.
theological_decisions:
- issue: 공적 발화의 목적
  chosen_reading: 예수께서 하신 말씀은 군중의 믿음을 위한 공개적 기도라는 점을 분명히 드러냅니다.
  alternative_readings:
  - 단순히 기적 직전의 설명으로만 읽을 수도 있습니다.
  rationale: 문맥상 아버지의 항상 들으심을 고백하면서도, 곁에 선 군중의 믿음을 위해 공개적으로 말씀하신다는 목적절을 그대로 살리는 것이 본문에 가장 충실합니다.
  doctrine_reference: 요한복음의 표적-믿음 구조
- issue: 보냄 받은 자로서의 정체성
  chosen_reading: ‘저를 보내셨다’는 표현을 유지하여 아버지와 아들의 파송 관계를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘저를 보내셨다’를 완화하여 단순한 위임 정도로 읽을 수도 있습니다.
  rationale: σύ의 강조와 함께 나타나는 ἀπέστειλας는 요한복음의 핵심 진술이므로, 의미를 약화하지 않고 그대로 옮겼습니다.
  doctrine_reference: 요한복음의 파송 신학
