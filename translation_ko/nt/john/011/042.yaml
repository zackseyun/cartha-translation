revisions:
- from: 그러나 저는 언제나 저를 들으신다는 것을 알고 있었습니다. 하지만 제가 이렇게 말한 것은 둘러서 있는 군중 때문에였습니다. 이는 그들이 아버지께서 저를 보내셨다는 것을 믿게 하려는 것입니다.[a][b]
  to: 저는 아버지께서 언제나 제 말을 들어 주신다는 것을 알고 있었습니다. 그러나 제가 이렇게 말씀드린 것은 주위에 서 있는 군중 때문입니다[a]. 그들이 아버지께서 저를 보내셨다는 것을 믿도록 하기 위해서입니다.[b]
  rationale: The revision preserves the Greek's causal διά phrase and purpose ἵνα clause while using idiomatic modern formal Korean. It retains ‘보내셨다’ for ἀπέστειλας, supplies ‘아버지’ only as the contextually explicit referent of the Greek second-person address, and relocates each note marker to the expression it explains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft generally retains the verse''s three movements: Jesus'' knowledge that the Father always hears him, his public statement because of the surrounding crowd, and the purpose that they believe the Father sent him. Revision is needed to make the aorist εἶπον clearly retrospective, to improve the rendering of the crowd''s location, and to place the notes at their relevant textual anchors.'
  naturalness: ‘둘러서 있는 군중’ is understandable but less idiomatic than ‘주위에 서 있는 군중.’ ‘이는 … 하려는 것입니다’ is also somewhat indirect after the past-tense ‘말한’; a direct purpose expression is more natural in modern formal Korean.
  terminology: ‘아버지께서 저를 보내셨다’ appropriately preserves the Johannine sending language. ‘그리스어’ is preferred over ‘헬라어’ in a contemporary scholarly note. The explicit Greek pronoun is represented in the note without imposing an unnecessary Korean emphatic pronoun in the verse text.
  issues:
  - severity: medium
    issue: The purpose statement is phrased as a present intention after a past action.
    rationale: εἶπον is aorist (‘I said/spoke’). Korean should naturally express that Jesus spoke for the purpose that the crowd would believe, rather than suggesting an ongoing present action.
  - severity: low
    issue: ‘둘러서 있는 군중’ is stylistically awkward.
    rationale: The participle τὸν περιεστῶτα denotes the crowd standing around Jesus. ‘주위에 서 있는 군중’ is a more natural modern Korean equivalent.
  - severity: medium
    issue: The footnote markers are both placed at the end rather than anchored to their respective expressions.
    rationale: Note a concerns the crowd phrase, and note b concerns the subject of ‘sent me.’ Placing each marker at the pertinent phrase provides a faithful, usable note system.
  - severity: low
    issue: The source-language label ‘헬라어’ is dated in this scholarly note.
    rationale: ‘그리스어’ is current standard Korean usage and accurately identifies the language of the source text.
  revised_text: 저는 아버지께서 언제나 제 말을 들어 주신다는 것을 알고 있었습니다. 그러나 제가 이렇게 말씀드린 것은 주위에 서 있는 군중 때문입니다[a]. 그들이 아버지께서 저를 보내셨다는 것을 믿도록 하기 위해서입니다.[b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘주위에 서 있는 군중을 위하여’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘당신이 나를 보내셨다’라고 말하며, ‘당신’에 강조가 있습니다.
    reason: source_note
  revision_rationale: The revision preserves the Greek's causal διά phrase and purpose ἵνα clause while using idiomatic modern formal Korean. It retains ‘보내셨다’ for ἀπέστειλας, supplies ‘아버지’ only as the contextually explicit referent of the Greek second-person address, and relocates each note marker to the expression it explains.
