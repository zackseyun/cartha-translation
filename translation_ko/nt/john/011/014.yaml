    issue: 인명 ‘라자로’
    rationale: Λάζαρος는 표준 한국어 성경 용례에서 일반적으로 ‘나사로’로 표기됩니다. ‘라자로’는 한국어 독자에게 비표준적이며 라틴계 표기로 인식될 수 있습니다.
  - severity: low
    issue: τότε οὖν을 ‘그때’로만 번역
    rationale: ‘그때’는 시간 연결은 나타내지만 οὖν의 전환·귀결 기능을 약화합니다. ‘그러자’는 두 요소를 자연스럽게 함께 반영합니다.
  - severity: medium
    issue: 각주 대안의 ‘공개적으로’
    rationale: παρρησίᾳ는 여기서 공적 장소에서의 발언보다 앞선 비유적 표현과 대비되는 숨김없는 명료한 발화를 뜻합니다. ‘공개적으로’는 불필요한 상황 정보를 암시할 수 있습니다.
  revised_text: 그러자 예수께서 그들에게 분명히[a] 말씀하셨습니다. “나사로가 죽었습니다.”
