lexical_decisions:
- source_word: τότε οὖν
  english_pob_choice: So then
  chosen_korean: 그때
  alternatives_korean:
  - 그리하여
  - 그런즉
  - 그때에
  lexicon: BDAG
  rationale: τότε와 οὖν이 함께 이루는 시간적·전개적 연결을 한국어에서는 간결한 ‘그때’로 자연스럽게 살렸습니다. 앞선 진술에 대한 이어짐과 전환을 과도하게 중복하지 않으면서도 맥락의 흐름을 유지합니다.
- source_word: παρρησίᾳ
  english_pob_choice: plainly
  chosen_korean: 분명히
  alternatives_korean:
  - 드러내 놓고
  - 공공연히
  - 분명하게
  lexicon: BDAG
  rationale: 이 단어는 ‘은밀하게’가 아니라 공개적이고 분명한 발화를 가리키므로, 현대 한국어에서 의미를 가장 सीधे 전달하는 ‘분명히’로 옮겼습니다.
- source_word: εἶπεν αὐτοῖς
  english_pob_choice: told them
  chosen_korean: 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그들에게 말씀하셨다
  - 그들에게 말했다
  lexicon: BDAG
  rationale: 예수의 발화를 지시동사 ‘말씀하다’로 옮겨 존칭을 반영하되, 내용 전달의 기능을 유지했습니다. ‘말했다’보다 예수 화자에 대한 한국어 관용을 살립니다.
- source_word: ἀπέθανεν
  english_pob_choice: has died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 세상을 떠났습니다
  - 별세했습니다
  - 죽었다
  lexicon: BDAG
  rationale: aorist의 사건 완료를 한국어 과거 시제로 자연스럽게 반영했습니다. ‘세상을 떠났습니다’는 완곡해지고, ‘죽었다’는 문체상 덜 합쇼체이므로 본문에는 ‘죽었습니다’를 택했습니다.
theological_decisions:
- issue: 예수의 진술 방식과 ‘분명히’의 기능
  chosen_reading: 예수께서 라자로의 죽음을 은유 없이 직접 확인하시는 장면으로 읽었습니다.
  alternative_readings:
  - ‘공개적으로’라는 뉘앙스를 더 강하게 살려 공동체 앞에서의 선언으로 읽는 방식
  - 앞선 ‘잠들다’ 비유를 계속 완곡하게 유지하는 방식
  rationale: 본문은 ἀπέθανεν으로 앞선 비유적 표현을 명시적으로 해명하므로, 한국어도 그 긴장을 흐리지 않고 직설적으로 전달해야 합니다. ‘분명히’는 그 해명의 어조를 보존합니다.
  doctrine_reference: 본문이 비유를 해소하는 지점을 그대로 반영
