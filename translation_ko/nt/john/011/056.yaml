id: JHN.11.56
reference: John 11:56
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
  footnotes:
  - marker: a
    text: Greek ἱερόν refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: b
    text: Or, “he will by no means come to the feast.” The Greek uses an emphatic negation (οὐ μὴ).
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 예수를 찾고 있었고, 성전 뜰에 서서 서로 말했습니다. “여러분은 어떻게 생각합니까? 그분은 절대로 이 명절에 오지 않으실 것입니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성전’은 ἱερόν의 의미를 반영하며, 여기서는 성전 내부의 지성소가 아니라 성전 परिसर/뜰을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘절대로’는 그리스어 οὐ μή의 강한 부정을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  english_pob_choice: were looking for
  chosen_korean: 찾고 있었고
  alternatives_korean:
  - 찾고 있었습니다
  - 찾아다니고 있었습니다
  lexicon: BDAG
  rationale: 미완료시제의 진행 중인 동작을 살리면서도, 한국어에서 자연스러운 서술인 ‘찾고 있었고’로 옮겼습니다.
- source_word: ἐν τῷ ἱερῷ
  english_pob_choice: in the temple courts
  chosen_korean: 성전 뜰에
  alternatives_korean:
  - 성전에서
  - 성전 구역에
  lexicon: BDAG
  rationale: ἱερόν은 내실(ναός)이 아니라 성전 परिसर/구역을 가리키므로, 공역의 넓이를 드러내는 ‘성전 뜰’이 적절합니다.
- source_word: Τί δοκεῖ ὑμῖν;
  english_pob_choice: What do you think?
  chosen_korean: 여러분은 어떻게 생각합니까?
  alternatives_korean:
  - 어떻게 생각하십니까?
  - 여러분의 생각은 어떻습니까?
  lexicon: BDAG
  rationale: 의견을 묻는 관용적 질문이므로, 현대 한국어에서 자연스러운 정중형으로 의미를 그대로 살렸습니다.
- source_word: οὐ μὴ ἔλθῃ
  english_pob_choice: he certainly will not come
  chosen_korean: 절대로 … 오지 않으실 것입니까?
  alternatives_korean:
  - 결코 … 오지 않으실 것입니까?
  - 반드시 … 오지 않으실 것입니까?
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 ‘절대로’로 반영해 강조를 살렸고, 문맥상 예수를 높여 부르는 표현으로 ‘오지 않으실’로 옮겼습니다.
theological_decisions:
- issue: 강한 부정(οὐ μή)의 뉘앙스
  chosen_reading: “절대로 … 오지 않으실 것입니까?”로 매우 강한 확실성의 부정을 드러냅니다.
  alternative_readings:
  - “결코 … 오지 않으실 것입니까?”
  - “그분은 틀림없이 오지 않으실 것입니까?”
  rationale: 본문은 단순한 가능성 부정이 아니라 강한 확정적 부정을 담고 있으므로, 한국어에서도 그 긴장을 분명하게 드러내는 것이 좋습니다.
  doctrine_reference: Greek syntax of οὐ μή with aorist subjunctive
