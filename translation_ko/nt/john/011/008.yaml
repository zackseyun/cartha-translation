revisions:
- from: 제자들이 그에게 말했습니다. 「랍비, 바로 지금 유대인들이 당신을 돌로 치려고 했는데, 또 그곳으로 가시려는 것입니까?」[a]
  to: 제자들이 그에게 말했습니다. 「랍비, 방금 유대인들이[a] 당신을 돌로 치려고 했는데, 또 그곳으로 가십니까?」
  rationale: 최근성을 나타내는 νῦν를 ‘방금’으로 바로잡고, 현재형 ὑπάγεις를 직접적인 현재 의문문 ‘가십니까’로 옮겼습니다. 또한 각주 표지를 해당 명사 뒤로 이동하여 요한복음에서 οἱ Ἰουδαῖοι의 가능한 문맥적 지시 대상을 명확히 안내했습니다. 본문은 원문의 모호성을 유지하며 특정 집단으로 단정하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:28Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 역사적 현재 λέγουσιν은 한국어 서술에서 과거형 ‘말했습니다’로 자연스럽게 옮겼습니다. ἐζήτουν의 미완료상은 ‘돌로 치려고 했는데’로, 실제 행위의 완료가 아니라 지속적·시도적 위협으로 적절히 반영됩니다. 다만 νῦν는 과거의 위협이 매우 최근에 있었음을 가리키므로 ‘바로 지금’보다 ‘방금’이 더 정확하고 자연스럽습니다. ὑπάγεις는 현재형 의문이므로 ‘가시려는 것입니까’보다 단순 현재의 ‘가십니까’가 원문에 더 가깝습니다.
  naturalness: ‘방금 … 했는데, 또 그곳으로 가십니까?’는 현대 표준어 합쇼체에서 자연스럽고, 제자들의 우려와 반문을 명료하게 전달합니다. 각주 표지는 지시 대상인 ‘유대인들’ 바로 뒤에 두어 참조 범위가 분명하도록 했습니다.
  terminology: ‘랍비’는 Ῥαββί의 음역 호칭을 보존합니다. οἱ Ἰουδαῖοι는 본문에서 ‘유대인들’로 유지하되, 요한복음 문맥에서 ‘유다인들’ 또는 예수를 대적한 유대 지역의 지도자들을 가리킬 가능성을 각주에 보존했습니다. ‘돌로 치다’는 λιθάσαι에 충실하며 ‘죽이다’를 본문에 보태지 않았습니다.
  issues:
  - severity: low
    issue: ‘바로 지금’이 과거의 위협과 결합되어 다소 어색합니다.
    rationale: νῦν는 이 문맥에서 현재 진행 중인 사건이라기보다 바로 직전의 위협을 가리킵니다. ‘방금’이 최근성을 더 자연스럽고 정확하게 나타냅니다.
  - severity: low
    issue: ‘가시려는 것입니까’가 ὑπάγεις의 현재형을 의도·계획의 표현으로 다소 이동시킵니다.
    rationale: 원문은 ‘또 그곳으로 가십니까?’라는 직접적인 현재형 반문입니다. ‘가십니까’가 의미를 추가하지 않고 이를 보존합니다.
  - severity: low
    issue: 각주 표지가 인용문 끝에 있어 ‘유대인들’이라는 특정 어휘에 대한 주석임이 덜 분명합니다.
    rationale: 대상 명사 바로 뒤에 표지를 두면 대안 번역의 적용 범위가 명확해집니다.
