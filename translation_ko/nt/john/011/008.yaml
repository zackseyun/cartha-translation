id: JHN.11.8
reference: John 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
  footnotes:
  - marker: a
    text: Or “the Judeans” or, contextually, “the Jewish leaders.” John often uses “the Jews” for Jesus’ opponents in Judea rather than for the Jewish people as a whole.
    reason: alternative_reading
translation:
  language: ko
  text: 제자들이 그에게 말했습니다. 「랍비, 바로 지금 유대인들이 당신을 돌로 치려고 했는데, 또 그곳으로 가시려는 것입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유다인들”, 문맥상 “유대 지도자들”일 수 있습니다. 요한은 종종 예수를 대적하는 유대 지역의 사람들을 가리켜 “유대인들”이라고 씁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말합니다
  lexicon: SBLGNT
  rationale: 현재형 역사적 현재를 한국어 서술에서는 자연스러운 과거로 옮겨, 내러티브 흐름을 유지했습니다.
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 랍비
  alternatives_korean:
  - 선생님
  lexicon: BDAG
  rationale: 제자들의 직접 호칭을 살리기 위해 음역형을 유지했습니다. 호칭의 유대적·요한적 색채가 흐려지는 ‘선생님’은 본문 어감이 약합니다.
- source_word: νῦν
  english_pob_choice: just now
  chosen_korean: 바로 지금
  alternatives_korean:
  - 지금
  - 방금
  lexicon: BDAG
  rationale: 직전의 위협을 가리키는 최근성을 드러내기 위해 ‘바로 지금’으로 옮겼습니다.
- source_word: λιθάσαι
  english_pob_choice: to stone
  chosen_korean: 돌로 치려고
  alternatives_korean:
  - 돌로 치다
  - 돌로 죽이려고
  lexicon: BDAG
  rationale: 동사의 핵심 의미는 ‘돌로 치다’이지만, 한국어에서는 목적과 긴장을 살리기 위해 의도 표현을 덧붙였습니다. ‘죽이려고’는 결과를 앞세워 본문의 직접성을 약간 넘어설 수 있어 본문에는 넣지 않았습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들이
  alternatives_korean:
  - 유다인들이
  - 유대 지도자들이
  lexicon: BDAG
  rationale: 기본 대응은 ‘유대인들’이지만, 요한복음의 용례상 문맥에 따라 더 좁은 대상을 가리킬 수 있으므로 한국어 본문은 중립적으로 두고, 과도한 특정화는 피했습니다.
- source_word: ὑπάγεις ἐκεῖ
  english_pob_choice: are you going there
  chosen_korean: 그곳으로 가시려는 것입니까
  alternatives_korean:
  - 거기로 가십니까
  - 그곳에 다시 가십니까
  lexicon: BDAG
  rationale: ἐκεῖ의 지시성을 살려 ‘그곳으로’로 옮겼고, ὑπάγεις의 현재 진행적 도발/의문 뉘앙스를 한국어의 의도·향하는 상태 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 지시 대상
  chosen_reading: 유대인들이
  alternative_readings:
  - 유다인들이
  - 유대 지도자들이
  rationale: 본문의 기본 어휘값을 유지하되, 요한복음의 적대적 문맥이 항상 민족 전체를 뜻하는 것은 아니므로 본문에서는 해석을 덧씌우지 않았습니다.
  doctrine_reference: 원문 우선 번역; 문맥상 잠재적 오해는 주석 처리로 관리
