id: JHN.11.34
reference: John 11:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
  footnotes:
  - marker: a
    text: Or “Sir, come and see.” The Greek κύριε can function as a respectful address, but “Lord” is retained as the default rendering.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말씀하셨습니다. 「그를 어디에 두었습니까?」 그들이 그에게 말했습니다. 「주님[a], 오셔서 보십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님.” 그리스어 κύριε는 존칭 호칭으로 기능할 수 있지만, 기본 번역은 “주님”으로 유지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  english_pob_choice: he said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 물으셨습니다
  lexicon: BDAG
  rationale: 말의 내용이 질문이지만, 서술동사 자체는 ‘묻다’보다 ‘말씀하다/말하다’로 두는 것이 원문 동사를 과도하게 해석하지 않으면서도 한국어에서 자연스럽습니다.
- source_word: Ποῦ τεθείκατε αὐτόν
  english_pob_choice: Where have you laid him?
  chosen_korean: 그를 어디에 두었습니까?
  alternatives_korean:
  - 그를 어디에 묻으셨습니까?
  - 그를 어디에 놓으셨습니까?
  lexicon: BDAG
  rationale: τεθείκατε는 ‘놓다/두다’의 완료형으로, 무덤 맥락이지만 직접적으로 ‘묻다’로 좁히기보다 ‘두다’로 옮겨 원문의 표현 범위를 유지했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 주
  lexicon: BDAG
  rationale: 예수께 대한 직접 호칭이므로 기본값인 ‘주님’을 따랐고, 단순한 예의 호칭보다 문맥의 신앙적 울림을 살렸습니다.
- source_word: ἔρχου καὶ ἴδε
  english_pob_choice: come and see
  chosen_korean: 오셔서 보십시오
  alternatives_korean:
  - 오시고 보십시오
  - 와서 보십시오
  lexicon: BDAG
  rationale: 두 명령형의 연속을 한국어에서 자연스럽게 연결해 공손한 청유형으로 옮겼으며, 직역보다 의미 단위가 더 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: κύριε의 예수 호칭 번역
  chosen_reading: 주님
  alternative_readings:
  - 선생님
  - 주
  rationale: 이 장면에서 κύριε는 단순한 사회적 예의와 더불어 요한복음의 기독론적 함의를 가질 수 있으므로, 기본 번역인 ‘주님’을 유지하는 것이 그 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
