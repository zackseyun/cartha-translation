id: JHN.11.21
reference: John 11:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
  footnotes:
  - marker: a
    text: Or 'Sir'; the Greek κύριε can function as a respectful form of address, but 'Lord' is the project's default rendering and also preserves possible theological weight in John's Gospel.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 마르다가 예수님께 말했습니다. “주님, 만일 주님께서 여기 계셨더라면, 내 형제는 죽지 않았을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님”. 헬라어 κύριε는 공손한 호칭으로도 기능할 수 있으나, 프로젝트의 기본값은 “주님”이며 요한복음에서는 신학적 울림도 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν οὖν
  english_pob_choice: So said
  chosen_korean: 그러므로 마르다가 말했습니다
  alternatives_korean:
  - 그런데 마르다가 말했습니다
  - 그때 마르다가 말했습니다
  lexicon: BDAG
  rationale: οὖν의 연결성을 살려 “그러므로”로 옮기되, 한국어 문장 흐름은 자연스럽게 정리했습니다. εἶπεν은 평서형 구어체가 아닌 서술체 “말했습니다”로 처리했습니다.
- source_word: πρὸς τὸν Ἰησοῦν
  english_pob_choice: to Jesus
  chosen_korean: 예수님께
  alternatives_korean:
  - 예수님에게
  - 예수님을 향해
  lexicon: BDAG
  rationale: πρός + 대격은 발화의 수신자를 가리키므로 한국어 조사로 자연스럽게 “께”를 사용했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  - 주인이시여
  lexicon: BDAG
  rationale: POB의 기본 선택인 Lord를 한국어 신앙어휘에서 가장 직접적으로 대응하는 “주님”으로 옮겼습니다. 단순 예우의 “선생님”보다 요한복음의 잠재적 기독론적 울림을 더 잘 보존합니다.
- source_word: εἰ ἦς ὧδε οὐκ ἂν ἀπέθανεν
  english_pob_choice: if you had been here, ... would not have died
  chosen_korean: 만일 주님께서 여기 계셨더라면, ... 죽지 않았을 것입니다
  alternatives_korean:
  - 주님께서 여기 계셨다면, ... 죽지 않았을 것입니다
  - 주님께서 여기만 계셨더라면, ... 죽지 않았을 것입니다
  lexicon: BDAG
  rationale: 가정법 반사실 조건문의 시간감을 살리기 위해 “계셨더라면 / 죽지 않았을 것입니다”로 옮겼습니다. “여기”는 ὧδε의 공간적 의미를 가장 간결하게 반영합니다.
- source_word: ὁ ἀδελφός μου
  english_pob_choice: my brother
  chosen_korean: 내 형제
  alternatives_korean:
  - 내 오빠
  - 내 동생
  - 내 형
  lexicon: BDAG
  rationale: ἀδελφός는 마르다가 라자로를 가리키는 말로, 성별·연령 관계를 한국어로 특정하기 어려워 중립적인 “형제”를 택했습니다.
theological_decisions:
- issue: Κύριε의 번역에서 예우와 기독론적 가능성의 보존
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 선생님
  rationale: 이 장면에서 κύριε는 단순한 호칭을 넘어 예수께 대한 존칭이면서, 요한복음 전체 맥락에서는 주되심의 여지를 담을 수 있습니다. “주님”은 그 긴장을 가장 균형 있게 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
