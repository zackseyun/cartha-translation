  source_fidelity: 핵심 의미는 정확합니다. 다만 οὖν은 이 문맥에서 강한 논리적 결론을 표시하기보다 앞 사건을 이어 가는 연결어이므로, “그러므로”보다 “그래서”가 원문의 연결성과 한국어 문맥을 더 자연스럽게 전달합니다. 반사실 조건(“계셨더라면 … 죽지 않았을 것입니다”)과 ἀδελφός의 관계상 중립성(“형제”)은 잘 보존되었습니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. 다만 서사 연결에서 “그러므로”는 다소 논증적·문어적으로 들릴 수 있어 “그래서”로 다듬는 것이 좋습니다. 또한 예수께 직접 공손하게 말하는 발화이므로 “내 형제”보다 “제 형제”가 현대 표준 한국어의 대화 관습에 더 잘 맞습니다.
  terminology: “주님”은 κύριε에 대한 프로젝트 기본 선택을 충실히 따르며, 요한복음에서 존칭과 가능한 신학적 함의를 함께 유지합니다. 대안 독법 각주는 유지할 수 있습니다. 각주 표지는 해당 호칭인 “주님” 바로 뒤에 두는 편이 참조 범위를 명확히 합니다.
