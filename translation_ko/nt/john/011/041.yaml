revisions:
- from: 그들은 돌을 치웠습니다[a]. 예수께서는 눈을 들어 위를 바라보시고 말씀하셨습니다. “아버지, 제 말씀을 들어 주셨으니 감사드립니다.”
  to: 그래서 그들은 돌을 치웠습니다[a]. 예수께서는 눈을 들어 위를 바라보시고 말씀하셨습니다. “아버지, 제 말을 들어 주셨으니 감사드립니다.”
  rationale: οὖν의 결과적 흐름을 ‘그래서’로 반영했습니다. ἤκουσάς μου는 기도 문맥의 ‘들어 주셨다’를 유지하면서, 한국어에서 자연스러운 목적어인 ‘제 말’을 사용했습니다. 각주는 본문 표현과 중복되지 않는 실제 어휘 대안으로 정리했습니다.
