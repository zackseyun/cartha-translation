id: JHN.11.41
reference: John 11:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
  footnotes:
  - marker: a
    text: Or “raised his eyes” or more idiomatically “looked up.”
    reason: lexical_alternative
  - marker: b
    text: Or “that you heard me.” The Greek aorist can be rendered more literally this way; “have heard me” reflects the completed action with present relevance in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 돌을 치웠습니다[a]. 예수께서는 눈을 들어 위를 바라보시고 말씀하셨습니다. “아버지, 제 말씀을 들어 주셨으니 감사드립니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌을 들어 올렸다” 혹은 더 관용적으로 “돌을 치웠다”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν οὖν τὸν λίθον
  english_pob_choice: So they took away the stone
  chosen_korean: 그들은 돌을 치웠습니다
  alternatives_korean:
  - 그들은 돌을 옮겼습니다
  - 그들은 돌을 들어 올렸습니다
  lexicon: BDAG
  rationale: ἦραν은 여기서 무덤 입구를 막은 돌을 ‘치우다/옮기다’는 뜻으로 자연스럽게 풀어야 하며, ‘들어 올리다’는 한국어에서 동작은 보이지만 결과가 덜 분명합니다.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  english_pob_choice: lifted his eyes upward
  chosen_korean: 눈을 들어 위를 바라보시고
  alternatives_korean:
  - 눈을 들어 올리시고
  - 위를 바라보시고
  lexicon: BDAG
  rationale: 직역의 이미지를 살리되 한국어에서 자연스러운 기도 동작으로 표현했습니다. ‘위로’보다 ‘위를 바라보시고’가 방향과 행위를 함께 드러냅니다.
- source_word: Πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아버지여
  - 오 아버지
  lexicon: BDAG
  rationale: 기도 중 직접 호칭이므로 현대 한국어에서는 단순한 호격 ‘아버지’가 가장 자연스럽습니다. ‘아버지여’는 종교적 문체를 강하게 띱니다.
- source_word: εὐχαριστῶ σοι
  english_pob_choice: I thank you
  chosen_korean: 감사드립니다
  alternatives_korean:
  - 감사합니다
  - 감사하옵나이다
  lexicon: BDAG
  rationale: 예수의 기도에서 하나님께 드리는 공손한 감사는 합쇼체로 옮기되, 구어적 ‘감사합니다’보다 더 직접적인 경어 표현인 ‘감사드립니다’가 어울립니다.
- source_word: ὅτι ἤκουσάς μου
  english_pob_choice: that you have heard me
  chosen_korean: 제 말씀을 들어 주셨으니
  alternatives_korean:
  - 저를 들어 주셨으니
  - 제 말을 들으셨으니
  lexicon: BDAG
  rationale: aorist의 완료된 응답을 한국어에서는 결과가 현재와 연결된 ‘들어 주셨으니’로 살렸습니다. ‘말씀’은 예수의 기도 발화를 드러내며, ‘저를’보다 목적어가 분명합니다.
theological_decisions:
- issue: 예수의 하나님 호칭을 기도체로 어떻게 살릴지
  chosen_reading: 아버지
  alternative_readings:
  - 오 아버지
  - 아버지여
  rationale: 본문은 장엄한 예전문이 아니라 예수의 직접 기도이므로, 친밀함과 경외를 함께 담는 간명한 호칭을 택했습니다.
  doctrine_reference: Translation philosophy 6
- issue: ἤκουσάς μου의 시제와 기도 응답의 뉘앙스
  chosen_reading: 들어 주셨으니
  alternative_readings:
  - 들으셨으니
  - 들어 주셨습니다
  rationale: 본문은 아버지가 이미 들으셨다는 사실을 진술하되, 그 응답이 현재의 감사로 이어지는 뉘앙스를 갖습니다. 한국어에서는 완료성과 현재적 의미를 함께 담는 표현이 적절합니다.
  doctrine_reference: Translation philosophy 1, 3
