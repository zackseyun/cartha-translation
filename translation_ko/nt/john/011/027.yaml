revisions:
- from: 그녀가 그에게 말했습니다. 「네, 주님. 저는 당신이 메시아이시며 하나님의 아들이시고, 세상에 오고 계신 분임을 믿었습니다.」[a][b]
  to: 그녀가 그에게 말했습니다. 「네, 주님. 저는 당신이 메시아이시며[a] 하나님의 아들이시고 세상에 오고 계신 분이심을[b] 믿어 왔습니다.」
  rationale: 완료형의 지속적 확신을 ‘믿어 왔습니다’로 반영하고, 원문의 현재분사 표현과 존대를 보존했습니다. 의미상 병렬인 메시아·하나님의 아들·세상에 오고 계신 분이라는 고백 구조를 유지했으며, 각주 표지를 관련 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
