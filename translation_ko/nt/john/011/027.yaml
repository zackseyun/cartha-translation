id: JHN.11.27
reference: John 11:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
  footnotes:
  - marker: a
    text: Or “the Christ.” The Greek title is Χριστός (Christos), rendered here as “Messiah” to preserve its meaning as a title.
    reason: alternative_reading
  - marker: b
    text: Or “who is coming into the world.” The Greek participial expression can be rendered more explicitly with a relative clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그에게 말했습니다. 「네, 주님. 저는 당신이 메시아이시며[a] 하나님의 아들이시고 세상에 오고 계신 분이심을[b] 믿어 왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리스도.” 그리스어 직함 Χριστός는 그 의미를 살리기 위해 여기서는 “메시아”로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “세상에 오시는 분.” 그리스어 현재분사구는 관계절로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  english_pob_choice: She said to him
  chosen_korean: 그녀가 그에게 말했습니다
  alternatives_korean:
  - 그녀가 그에게 말합니다
  lexicon: SBLGNT / BDAG
  rationale: 희랍어 역사적 현재를 한국어 서술에서는 자연스러운 과거형으로 옮겨 대화의 흐름을 살렸습니다.
- source_word: Ναί
  english_pob_choice: 'Yes'
  chosen_korean: 네
  alternatives_korean:
  - 예
  - 그렇습니다
  lexicon: BDAG
  rationale: 간결한 긍정 응답으로서 한국어 대화체에서 가장 자연스러운 선택입니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아이시며
  alternatives_korean:
  - 그리스도이시며
  - 그 메시아이시며
  lexicon: BDAG
  rationale: 직함으로서 Χριστός는 프로젝트 기본값에 따라 메시아로 옮겼고, 고백문의 호칭성을 살리기 위해 서술형 조사와 높임을 반영했습니다.
- source_word: πεπίστευκα
  english_pob_choice: I have believed
  chosen_korean: 믿었습니다
  alternatives_korean:
  - 믿고 있습니다
  - 믿어 왔습니다
  lexicon: BDAG
  rationale: 완료 시제의 지속된 확신을 한국어에서는 현재형보다 과거 완료적 뉘앙스가 있는 평서형으로 옮겨, 너무 설명적으로 늘리지 않았습니다.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  english_pob_choice: the one coming into the world
  chosen_korean: 세상에 오고 계신 분
  alternatives_korean:
  - 세상에 들어오시는 분
  - 세상에 오시는 분
  - 세상에 오고 있는 분
  lexicon: BDAG
  rationale: 현재분사의 계속성과 인격적 지시를 살리기 위해 ‘오고 계신’으로 옮겼고, κόσμον은 요한복음의 일반적 용법에 따라 ‘세상’으로 번역했습니다.
theological_decisions:
- issue: κύριε의 호칭 강도
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 선생님
  - 님
  rationale: 문맥이 메시아와 하나님의 아들을 고백하는 장면이므로 단순한 호칭보다 예배적·신앙적 무게를 가진 ‘주님’이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — κύριος → Lord'
- issue: ὁ υἱὸς τοῦ θεοῦ의 표기
  chosen_reading: 하나님의 아들이시고
  alternative_readings:
  - 하나님의 아들이며
  - 하나님의 아들
  rationale: 직함의 정체성을 분명히 하면서 문장 내 병렬 구조를 자연스럽게 유지하기 위해 높임을 포함한 연결형으로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy — original-language primacy'
