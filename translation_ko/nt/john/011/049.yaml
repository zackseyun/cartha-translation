id: JHN.11.49
reference: John 11:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
  footnotes:
  - marker: a
    text: Or, more formally, “You do not know anything.” The Greek expression is an emphatic rebuke, literally using a double negative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 한 사람인 가야바는 그해 대제사장이었는데, 그들에게 말했습니다. 「너희는 아무것도 모릅니다。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 “너희는 아무것도 알지 못합니다.”로 옮길 수 있습니다. 헬라어의 이중 부정은 논리적 이중 부정이 아니라 강한 꾸짖음입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  english_pob_choice: But one of them
  chosen_korean: 그들 가운데 한 사람인
  alternatives_korean:
  - 그들 가운데 한 사람
  - 그들 중 한 사람인
  lexicon: BDAG
  rationale: εἷς...τις의 관용적 결합을 자연스럽게 살려 ‘한 사람’으로 옮기고, ἐξ αὐτῶν은 ‘그들 가운데’로 풀어 집단 내부의 인물을 드러냈습니다. δέ의 약한 전환은 앞뒤 문맥을 고려해 쉼표와 문장 흐름으로 반영했습니다.
- source_word: Καϊάφας
  english_pob_choice: Caiaphas
  chosen_korean: 가야바
  alternatives_korean:
  - 카이아파스
  lexicon: BDAG
  rationale: 성경에서 널리 쓰이는 한국어 음역인 ‘가야바’를 택해 인명 인지도를 유지했습니다.
- source_word: ἀρχιερεὺς
  english_pob_choice: high priest
  chosen_korean: 대제사장이었는데
  alternatives_korean:
  - 대제사장이었고
  - 대제사장이었습니다
  lexicon: BDAG
  rationale: ἀρχιερεύς는 직분명으로서 ‘대제사장’이 가장 직접적이며, 서술적 연결을 위해 ‘-이었는데’로 자연스럽게 이어 주었습니다.
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  english_pob_choice: You know nothing at all
  chosen_korean: 너희는 아무것도 모릅니다
  alternatives_korean:
  - 너희는 아무것도 알지 못합니다
  - 너희는 전혀 모릅니다
  lexicon: BDAG
  rationale: 원문의 Ὑμεῖς가 주어를 강조하고, 이중 부정 οὐκ ... οὐδέν의 강한 꾸짖음은 ‘아무것도 모릅니다’로 살렸습니다. ‘알지 못합니다’보다 직설적이며, POB의 반박 뉘앙스를 유지합니다.
theological_decisions:
- issue: 가야바의 연대 표지(그해) 처리
  chosen_reading: ‘그해’로 옮겨 역사적 표지를 그대로 유지했습니다.
  alternative_readings:
  - ‘그해의’처럼 관계형으로 풀어 쓰기
  - 해석을 덧붙여 의미를 확장하기
  rationale: 본문은 가야바의 직분을 특정 연도로 한정할 뿐이므로, 신학적 설명을 덧붙이지 않고 시간 표지를 간결하게 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
