    reason: cultural_note
lexical_decisions:
- source_word: ἦν δὲ
  english_pob_choice: Now
  chosen_korean: 그런데
  alternatives_korean:
  - 이제
  - 그리고
  lexicon: BDAG
  rationale: δὲ는 강한 대조보다 서술 진행을 잇는 약한 연결이므로, 문맥의 흐름을 살리면서도 한국어에서 자연스러운 연결어인 ‘그런데’를 택했습니다.
- source_word: ἐγγὺς
  english_pob_choice: near
  chosen_korean: 가깝고
  alternatives_korean:
  - 근처에 있고
  - 가까이에 있고
  lexicon: BDAG
  rationale: ἐγγύς의 공간적 근접성을 간결하게 살리기 위해 ‘가깝고’로 옮겼습니다.
- source_word: Ἱεροσολύμων
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 성
  - 예루살렘 도성
  lexicon: standard proper name
  rationale: Ἱεροσόλυμα의 통용 번역인 ‘예루살렘’을 사용했습니다.
- source_word: ἀπὸ σταδίων δεκαπέντε
  english_pob_choice: about fifteen stadia away
  chosen_korean: 약 열다섯 스타디온 떨어져 있었습니다
  alternatives_korean:
  - 약 두 마일 떨어져 있었습니다
  - 대략 세 킬로미터 떨어져 있었습니다
  lexicon: BDAG
  rationale: στάδιον은 고대 거리 단위이므로 본문 단위를 보존해 ‘스타디온’으로 옮기고, ἀπό의 공간 관계는 ‘떨어져 있었습니다’로 풀었습니다.
