    reason: cultural_note
lexical_decisions:
- source_word: ἦν δὲ
  english_pob_choice: Now
  chosen_korean: 그런데
  alternatives_korean:
  - 이제
  - 그리고
  lexicon: BDAG
  rationale: δὲ는 강한 대조보다 서술 진행을 잇는 약한 연결이므로, 문맥의 흐름을 살리면서도 한국어에서 자연스러운 연결어인 ‘그런데’를 택했습니다.
