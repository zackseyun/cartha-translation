  rationale: Ἱεροσόλυμα의 통용 번역인 ‘예루살렘’을 사용했습니다.
- source_word: ἀπὸ σταδίων δεκαπέντε
  english_pob_choice: about fifteen stadia away
  chosen_korean: 약 열다섯 스타디온 떨어져 있었습니다
  alternatives_korean:
