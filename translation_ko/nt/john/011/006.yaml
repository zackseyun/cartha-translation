    text: 또는 ‘그가 앓는다고.’ 그리스어는 ‘앓고 있다’에 현재형을 사용합니다.
    reason: lexical_alternative
  revision_rationale: ‘더’를 삭제하여 원문에 없는 비교·추가의 뜻을 피했습니다. ἀσθενεῖ의 현재 상태를 ‘앓고 있다’로 자연스럽게 반영하고, 주석 표지를 해당 표현에 붙였습니다. ‘그러므로 … 들으셨을 때’는 ὡς οὖν의 연결 및 시간적 흐름을, ‘이틀 동안 머무르셨습니다’는 τότε μὲν ἔμεινεν … δύο ἡμέρας의 서술을 유지합니다.
