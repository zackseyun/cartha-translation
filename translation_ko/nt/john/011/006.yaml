  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
  footnotes:
  - marker: a
    text: Or 'that he is sick.' Greek uses the present tense after 'heard,' but English commonly renders it as past in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그분은 병이 들었다는 말을 들으시고, 그분이 계시던 곳에 이틀을 더 머무르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 아프다고’. 헬라어는 ‘들으신 뒤’에 현재형을 쓰지만, 한국어에서는 이런 문맥에서 보통 과거로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  english_pob_choice: So when
  chosen_korean: 그러므로 … 들으시고
  alternatives_korean:
  - 그래서 … 들으시고
  - 그러자 … 들으시고
  - 그리고 … 들으시고
  lexicon: BDAG
  rationale: οὖν의 추론·이음의 흐름과 ὡς의 시간적 전개를 함께 살려 한국어에서는 자연스러운 인과 연결어로 옮겼습니다.
- source_word: ἤκουσεν
  english_pob_choice: he heard
  chosen_korean: 들으시고
  alternatives_korean:
  - 들으셨습니다
  - 듣고
  lexicon: BDAG
  rationale: 보고된 사실을 받아들이는 동작을 간결하게 살리되, 뒤의 동작과 이어지는 서술 흐름을 위해 연결형을 택했습니다.
- source_word: ἔμεινεν
  english_pob_choice: he stayed
  chosen_korean: 머무르셨습니다
  alternatives_korean:
  - 계속 계셨습니다
  - 머무셨습니다
  - 있으셨습니다
  lexicon: BDAG
  rationale: μένω의 장소적 의미를 살려 ‘머무르다’로 옮겼고, 존칭 표현으로 주어를 자연스럽게 처리했습니다.
- source_word: ἐν ᾧ ἦν τόπῳ
  english_pob_choice: in the place where he was
  chosen_korean: 그분이 계시던 곳에
  alternatives_korean:
  - 그가 있던 곳에
  - 계시던 그 장소에
  - 그분이 있던 자리에서
  lexicon: BDAG
  rationale: 그리스어의 다소 중복적인 장소 표현을 한국어에서는 지나친 반복 없이 자연스럽게 압축하되, ‘계시던 곳’으로 장소성을 유지했습니다.
- source_word: δύο ἡμέρας
  english_pob_choice: two days
  chosen_korean: 이틀을
  alternatives_korean:
  - 두 날을
  - 이틀 동안
  lexicon: BDAG
  rationale: 기간의 표준 한국어 표현으로 ‘이틀’을 사용해 διάρκειας의 의미를 분명하게 전달했습니다.
theological_decisions:
- issue: 예수님의 지연이 만드는 서술상의 긴장 보존
  chosen_reading: 예수님이 곧바로 가지 않으시고 ‘이틀을 더 머무르셨습니다’라고 직서했습니다.
  alternative_readings:
  - 의도를 덧붙여 친절하게 설명하는 번역
  - 지연의 인상을 약화시키는 완곡 번역
  rationale: 본문은 병을 들으신 뒤 즉시 움직이지 않으시는 긴장을 드러내므로, 번역에서도 그 긴장을 해소하지 않고 그대로 드러내는 것이 원문의 효과를 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
