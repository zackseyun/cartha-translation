    reason: alternative_reading
  revision_rationale: The revision makes the temporal clause and the two Greek aorist responses clear in natural 합쇼체. It retains the ambiguity of ἐνεβριμήσατο, expresses the idiomatic reflexive sense of ἐτάραξεν ἑαυτόν without suggesting deliberate self-infliction, and relocates both footnote anchors to the words they explain.
