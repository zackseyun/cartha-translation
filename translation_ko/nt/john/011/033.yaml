id: JHN.11.33
reference: John 11:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' Here the term refers to the Jewish mourners who had come with Mary, not to the Jewish people as a whole.
    reason: lexical_alternative
  - marker: b
    text: The verb can also carry the sense 'was indignant' or 'was deeply stirred,' expressing strong inner agitation.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 예수께서는 그녀가 울고, 그녀와 함께 온 유대인들이[a] 우는 것을 보셨을 때, 영으로 깊이 격동하시고[b] 마음이 심히 괴로워지셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘유대인들’은 마리아와 함께 온 유대인 조문객들을 가리키며, 유대 민족 전체를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 ‘분노하셨다’ 또는 ‘깊이 격동되셨다’로도 옮길 수 있으며, 강한 내적 동요를 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러자
  lexicon: BDAG
  rationale: 앞 절에서 이어지는 서술적 결론을 나타내는 연결어이므로, 원문의 추론·전개 기능을 자연스럽게 살려 ‘그러므로’로 옮겼습니다.
- source_word: κλαίουσαν / κλαίοντας
  english_pob_choice: weeping
  chosen_korean: 우는 것
  alternatives_korean:
  - 울고 있는 것
  - 통곡하는 것
  lexicon: BDAG
  rationale: 두 대상 모두의 지속적 슬픔을 나타내므로, 과도하게 격양된 ‘통곡’보다 중립적인 ‘우는 것’이 원문과 한국어 문맥에 잘 맞습니다.
- source_word: Ἰουδαίους
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유다 사람들
  - 유대 사람들
  lexicon: BDAG
  rationale: 이 절에서는 마리아와 함께 온 조문객들을 가리키는 일반 명사로 쓰였으므로, 직역성을 살리되 오해를 막기 위해 ‘유대인들’로 두었습니다.
- source_word: ἐνεβριμήσατο τῷ πνεύματι
  english_pob_choice: was deeply moved in his spirit
  chosen_korean: 영 안에서 깊이 동요하시며
  alternatives_korean:
  - 영 안에서 분노하시며
  - 영 안에서 깊이 흔들리시며
  - 속으로 몹시 괴로워하시며
  lexicon: BDAG
  rationale: ἐνεβριμήσατο는 분노, 격한 동요, 내적 격정을 모두 시사할 수 있어 특정 감정으로 단정하지 않고, ‘깊이 동요하시며’로 강한 내적 반응을 보존했습니다. τῷ πνεύματι는 인격적 내면을 가리키므로 ‘영 안에서’로 옮겼습니다.
- source_word: ἐτάραξεν ἑαυτόν
  english_pob_choice: troubled himself
  chosen_korean: 자신이 괴로워하셨습니다
  alternatives_korean:
  - 자신을 괴롭게 하셨습니다
  - 스스로 마음이 뒤흔들리셨습니다
  lexicon: BDAG
  rationale: 재귀 표현을 살려 예수의 내적 동요가 단순 수동 상태가 아니라 자기 자신에게 미친 격렬한 흔들림임을 드러냈습니다. 한국어에서는 자연스러운 서술을 위해 ‘괴로워하셨습니다’를 택했습니다.
theological_decisions:
- issue: 예수의 정서 표현(ἐνεβριμήσατο)의 구체적 성격
  chosen_reading: 분노, 격앙, 깊은 동요 중 하나로 고정하지 않고, 강한 내적 동요를 열어 둔 표현으로 옮겼습니다.
  alternative_readings:
  - 분노하셨습니다
  - 몹시 격노하셨습니다
  - 깊이 슬퍼하셨습니다
  rationale: 원문은 예수의 반응을 강하게 제시하지만 그 정서의 정확한 방향은 해석상 긴장이 있으므로, 번역에서 그 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
