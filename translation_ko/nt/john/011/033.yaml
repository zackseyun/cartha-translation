revisions:
- from: 그러므로 예수께서 그녀가 우는 것과, 그녀와 함께 온 유대인들이 우는 것을 보시고, 영 안에서 깊이 동요하시며 자신이 괴로워하셨습니다.[a][b]
  to: 그러므로 예수께서는 그녀가 울고, 그녀와 함께 온 유대인들이[a] 우는 것을 보셨을 때, 영으로 깊이 격동하시고[b] 마음이 심히 괴로워지셨습니다.
  rationale: The revision makes the temporal clause and the two Greek aorist responses clear in natural 합쇼체. It retains the ambiguity of ἐνεβριμήσατο, expresses the idiomatic reflexive sense of ἐτάραξεν ἑαυτόν without suggesting deliberate self-infliction, and relocates both footnote anchors to the words they explain.
