source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
  footnotes:
  - marker: a
    text: Or, more literally, 'if he has gone to sleep.' Jesus had spoken of Lazarus's death figuratively as sleep, but the disciples understood him to mean ordinary sleep.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek verb can also be rendered ''he will be saved,'' but here it refers to recovery from illness: ''he will recover'' or ''he will get well.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 제자들이 그에게 말했습니다. “주님, 그가 잠들었으면[a] 나을 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사 κεκοίμηται는 ‘잠들어 있다’ 또는 ‘잠이 들었다’라는 뜻입니다. 예수님은 나사로의 죽음을 잠에 비유하여 말씀하셨지만, 여기서 제자들은 그것을 보통의 수면으로 이해했습니다.
    reason: alternative_reading
  - marker: b
    text: 원문의 동사 σῴζω는 흔히 ‘구원하다’로도 번역되지만, 이 질병 문맥에서는 병에서 ‘낫다’ 또는 ‘회복되다’를 뜻합니다.
    reason: lexical_alternative
