- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 드리는 직접 호칭으로서 경외를 담으면서도 현대 한국어 예배·성서 문체에 자연스러운 ‘주님’을 선택했습니다.
- source_word: κεκοίμηται
  english_pob_choice: has fallen asleep
  chosen_korean: 잠들었으면
  alternatives_korean:
  - 잠이 들었으면
  - 자고 있으면
  lexicon: BDAG
  rationale: 문맥상 제자들은 예수님의 비유적 표현을 문자적으로 이해하므로, ‘죽었다’는 의미를 드러내지 않고 ordinary sleep의 뜻을 살렸습니다. 조건문 속 상태를 자연스럽게 나타내기 위해 ‘잠들었으면’으로 옮겼습니다.
- source_word: σωθήσεται
  english_pob_choice: he will recover
  chosen_korean: 나을 것입니다
  alternatives_korean:
  - 회복할 것입니다
  - 병이 나을 것입니다
  - 구원받을 것입니다
  lexicon: BDAG
  rationale: 질병 문맥에서 σῴζω는 ‘구원하다’보다 ‘낫다/회복되다’의 뜻이 적절하므로, 제자들의 오해를 반영하는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: κεκοίμηται의 이중 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 단순한 수면 표현을 두고, 죽음의 비유적 의미는 드러내지 않습니다.
  alternative_readings:
  - ‘쉬고 있습니다’처럼 더 완곡하게 번역하기
  - ‘잠들었다’와 함께 죽음의 암시를 본문에 일부 반영하기
  rationale: 이 구절의 초점은 제자들이 예수님의 비유를 오해했다는 사실입니다. 본문은 그들의 이해 수준을 그대로 보여 주고, 비유적 의미는 뒤 문맥에서 밝혀지므로 여기서는 ordinary sleep으로 번역하는 것이 서사와 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
