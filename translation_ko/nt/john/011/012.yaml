id: JHN.11.12
reference: John 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
  footnotes:
  - marker: a
    text: Or, more literally, 'if he has gone to sleep.' Jesus had spoken of Lazarus's death figuratively as sleep, but the disciples understood him to mean ordinary sleep.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek verb can also be rendered ''he will be saved,'' but here it refers to recovery from illness: ''he will recover'' or ''he will get well.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 제자들이 그에게 말했습니다. “주님, 그가 잠들었으면 나을 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사 κεκοίμηται는 문자적으로는 ‘잠들다’이지만, 예수님은 나사로의 죽음을 비유적으로 말씀하셨습니다. 여기서는 제자들이 그 말을 보통의 수면으로 이해한 것으로 나타납니다.
    reason: alternative_reading
  - marker: b
    text: 원문의 σῴζω는 여기서 ‘구원하다’가 아니라 병에서 ‘나아 회복하다’는 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러자
  alternatives_korean:
  - 그러므로
  - 그래서
  lexicon: BDAG
  rationale: 앞선 말씀에 대한 자연스러운 서술적 이어짐을 나타내며, 현대 한국어에서 결과·전개의 흐름을 매끄럽게 살립니다.
- source_word: μαθηταὶ
  english_pob_choice: the disciples
  chosen_korean: 제자들이
  alternatives_korean:
  - 그 제자들이
  - 그의 제자들이
  lexicon: BDAG
  rationale: 원문의 정관사는 맥락상 이미 특정된 제자들을 가리키므로, 한국어에서는 군더더기 없이 ‘제자들이’로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 드리는 직접 호칭으로서 경외를 담으면서도 현대 한국어 예배·성서 문체에 자연스러운 ‘주님’을 선택했습니다.
- source_word: κεκοίμηται
  english_pob_choice: has fallen asleep
  chosen_korean: 잠들었으면
  alternatives_korean:
  - 잠이 들었으면
  - 자고 있으면
  lexicon: BDAG
  rationale: 문맥상 제자들은 예수님의 비유적 표현을 문자적으로 이해하므로, ‘죽었다’는 의미를 드러내지 않고 ordinary sleep의 뜻을 살렸습니다. 조건문 속 상태를 자연스럽게 나타내기 위해 ‘잠들었으면’으로 옮겼습니다.
- source_word: σωθήσεται
  english_pob_choice: he will recover
  chosen_korean: 나을 것입니다
  alternatives_korean:
  - 회복할 것입니다
  - 병이 나을 것입니다
  - 구원받을 것입니다
  lexicon: BDAG
  rationale: 질병 문맥에서 σῴζω는 ‘구원하다’보다 ‘낫다/회복되다’의 뜻이 적절하므로, 제자들의 오해를 반영하는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: κεκοίμηται의 이중 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 단순한 수면 표현을 두고, 죽음의 비유적 의미는 드러내지 않습니다.
  alternative_readings:
  - ‘쉬고 있습니다’처럼 더 완곡하게 번역하기
  - ‘잠들었다’와 함께 죽음의 암시를 본문에 일부 반영하기
  rationale: 이 구절의 초점은 제자들이 예수님의 비유를 오해했다는 사실입니다. 본문은 그들의 이해 수준을 그대로 보여 주고, 비유적 의미는 뒤 문맥에서 밝혀지므로 여기서는 ordinary sleep으로 번역하는 것이 서사와 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
