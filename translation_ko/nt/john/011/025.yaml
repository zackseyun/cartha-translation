id: JHN.11.25
reference: John 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
  footnotes:
  - marker: a
    text: Or “Whoever believes in me, even if they die, will live.” The Greek is singular masculine (“the one who believes … even if he dies”) used representatively.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “나는 부활이요 생명입니다. 나를 믿는 사람은, 죽더라도 살 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “나를 믿는 자는, 죽더라도 살 것입니다.” 그리스어는 단수 남성 표현(“믿는 그 한 사람… 그가 죽더라도”)을 대표적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  english_pob_choice: Jesus said to her
  chosen_korean: 예수께서 그에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그녀에게 말씀하셨습니다
  - 예수께서 마르다에게 말씀하셨습니다
  lexicon: BDAG
  rationale: εἶπεν은 서술문의 자연스러운 과거 발화를 나타내므로 ‘말씀하셨습니다’로 옮겼고, αὐτῇ는 문맥상 마르다를 가리키지만 본문에는 대명사만 있으므로 이름을 덧붙이지 않았습니다.
- source_word: Ἐγώ εἰμι
  english_pob_choice: I am
  chosen_korean: 나는 …입니다
  alternatives_korean:
  - 나는 …이다
  - 내가 …입니다
  lexicon: BDAG
  rationale: 요한복음의 자기 계시적 표현을 살리기 위해 단순하고 직접적인 ‘나는’ 구조를 유지했습니다.
- source_word: ἡ ἀνάστασις καὶ ἡ ζωή
  english_pob_choice: the resurrection and the life
  chosen_korean: 부활이요 생명입니다
  alternatives_korean:
  - 부활이며 생명입니다
  - 부활과 생명입니다
  lexicon: BDAG
  rationale: 두 개의 정관사 명사를 병렬로 두어 예수가 부활과 생명 자체로 동일시되는 문법적 힘을 살리기 위해 ‘-이요’ 연결을 사용했습니다.
- source_word: ὁ πιστεύων εἰς ἐμέ
  english_pob_choice: the one who believes in me
  chosen_korean: 나를 믿는 사람은
  alternatives_korean:
  - 나를 믿는 자는
  - 나를 믿는 이는
  lexicon: BDAG
  rationale: 남성 단수 분사 구조를 대표적 의미로 살리되 한국어에서는 자연스럽고 포괄적인 ‘사람’으로 옮겨 독자가 문맥의 일반성을 이해하도록 했습니다.
- source_word: κἂν ἀποθάνῃ ζήσεται
  english_pob_choice: even if he dies, will live
  chosen_korean: 죽더라도 살 것입니다
  alternatives_korean:
  - 죽어도 살 것입니다
  - 비록 죽을지라도 살 것입니다
  lexicon: BDAG
  rationale: κἄν의 양보 조건과 ζήσεται의 미래 약속을 간결하게 전달하기 위해 ‘죽더라도’와 ‘살 것입니다’를 사용했습니다.
theological_decisions:
- issue: 예수의 자기 동일시 표현 Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή의 보존
  chosen_reading: “나는 부활이요 생명입니다”
  alternative_readings:
  - “나는 부활과 생명입니다”
  - “나는 부활이며 생명입니다”
  rationale: 기능 설명으로 풀지 않고 예수가 부활과 생명 그 자체라고 선언하는 직접적 동일시를 유지했습니다.
  doctrine_reference: DOCTRINE.md Affirmations; Translation philosophy §1, §3
- issue: ὁ πιστεύων의 단수 대표성 유지
  chosen_reading: “나를 믿는 사람은”
  alternative_readings:
  - “나를 믿는 자는”
  - “나를 믿는 누구든지”
  rationale: 그리스어의 단수 남성 분사를 한국어에서 성중립적 복수로 바꾸지 않고, 대표적 단수로 옮겨 원문의 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
