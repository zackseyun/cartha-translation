  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
  footnotes:
  - marker: a
    text: Or “the Sanhedrin,” the Jewish ruling council.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 대제사장들과 바리새인들은 공의회를 소집하고 이렇게 말했습니다. 「우리가 무엇을 하고 있습니까? 이 사람이 많은 표적을 행하고 있기 때문입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공의회’는 여기서 유대 지도자 회의체를 가리키는 말로 이해할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: συνήγαγον
  english_pob_choice: gathered
  chosen_korean: 소집하고
  alternatives_korean:
  - 모으고
  - 불러모으고
  - 집결하고
  lexicon: BDAG
  rationale: 공의회와 같은 회의체를 여는 맥락이므로 단순한 ‘모이다’보다 회의 소집의 기능을 드러내는 ‘소집하다’가 가장 자연스럽습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그리하여
  - 그런즉
  lexicon: BDAG
  rationale: 앞 단락의 표적에 대한 반응으로 이어지는 논리적 연결을 한국어에서 분명하게 살리되, 지나치게 구어적인 어감을 피했습니다.
- source_word: συνέδριον
  english_pob_choice: the council
  chosen_korean: 공의회
  alternatives_korean:
  - 공회
  - 산헤드린
  - 회의
  lexicon: BDAG
  rationale: 유대의 통치 회의를 가리키는 표현이므로 ‘공의회’로 옮겨 회의체의 성격을 드러내면서도, 본문 자체의 일반 명사를 유지했습니다.
- source_word: πολλὰ σημεῖα
  english_pob_choice: many signs
  chosen_korean: 많은 표적
  alternatives_korean:
  - 많은 기적
  - 많은 이적
  - 많은 표징
  lexicon: BDAG
  rationale: 요한복음의 σημεῖα는 단순한 기적보다 예수의 정체를 드러내는 표지의 의미가 강하므로, 전통적 교회어보다 ‘표적’이 원문의 신학적 뉘앙스를 더 잘 보존합니다.
theological_decisions:
- issue: σημεῖα의 신학적 뉘앙스
  chosen_reading: 표적
  alternative_readings:
  - 기적
  - 표징
  rationale: 요한은 예수의 행위를 자기지시적 사건이 아니라 그분을 가리키는 표로 제시하므로, 설명을 덧붙이지 않고 ‘표적’으로 옮기는 것이 본문의 의도를 가장 잘 살립니다.
  doctrine_reference: 요한복음의 표적 신학 보존
