revisions:
- from: 그러므로 대제사장들과 바리새인들은 공의회를 소집하고 이렇게 말했습니다. 「우리가 무엇을 하고 있습니까? 이 사람이 많은 표적을 행하고 있기 때문입니다」.[a]
  to: 그러므로 대제사장들과 바리새인들은 회의[a]를 소집하고 이렇게 말하고 있었습니다. “우리가 무엇을 하고 있습니까? 이 사람이 많은 표적을 행하고 있기 때문입니다.”
  rationale: 본문의 συνέδριον을 특정 제도 명칭으로 확정하지 않고 ‘회의’로 번역했으며, 산헤드린이라는 문맥상 가능한 식별은 각주로 제시했습니다. 각주 앵커를 관련 번역어에 붙이고, 미완료 과거 ἔλεγον을 ‘말하고 있었습니다’로 반영했습니다. 나머지 어휘와 문장 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:52Z'
review_pass:
  verdict: revise
  source_fidelity: ‘공의회’는 특정 제도 명칭을 다소 강하게 암시할 수 있으나, συνέδριον은 여기서 일반적으로 ‘회의/의회’를 뜻하며 산헤드린일 가능성은 각주로 보완하는 편이 원문의 개방성을 더 잘 보존합니다. 또한 ἔλεγον의 미완료상은 ‘말하고 있었습니다’로 반영할 수 있습니다.
  naturalness: ‘회의를 소집하고 이렇게 말하고 있었습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 직접 인용문의 현재형 질문과도 잘 어울립니다. 각주 표지는 해당 단어 바로 뒤에 두어 지시 대상을 명확히 했습니다.
  terminology: ‘대제사장들’, ‘바리새인들’, ‘표적’은 적절합니다. 요한복음의 σημεῖα에 대해 ‘표적’은 신학적 함의를 과도하게 해설하지 않고 보존합니다. συνέδριον은 본문에서 ‘회의’로 옮기고 ‘산헤드린’은 대안적 식별로 각주 처리했습니다.
