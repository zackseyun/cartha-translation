id: JHN.11.40
reference: John 11:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: ko
  text: 예수께서 그녀에게 말씀하셨습니다. “내가 네게, 네가 믿으면 하나님의 영광을 보게 될 것이라고 말하지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광’은 헬라어 δόξα의 표준적 번역으로, 요한복음에서 하나님의 자기 계시와 긴밀히 연결됩니다.
    reason: source_note
lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: SBLGNT
  rationale: 예수의 직접 화법 도입으로서 존대형 동사를 써 공손함을 유지하되, 한국어 서술에서는 자연스러운 과거 시제로 옮겼습니다.
- source_word: Οὐκ εἶπόν σοι
  english_pob_choice: Did I not tell you
  chosen_korean: 내가 네게 … 말하지 않았습니까
  alternatives_korean:
  - 내가 네게 … 말하지 않았습니까?
  - 내가 너에게 … 말하지 않았습니까
  lexicon: BDAG
  rationale: 헬라어의 수사적 질문을 한국어에서도 반문형으로 살려, 단순 진술이 아니라 이미 말한 사실을 상기시키는 뉘앙스를 유지했습니다.
- source_word: ἐὰν πιστεύσῃς
  english_pob_choice: if you believe
  chosen_korean: 믿으면
  alternatives_korean:
  - 믿는다면
  - 믿게 되면
  lexicon: BDAG
  rationale: πιστεύω를 명사형 ‘믿음’이 아니라 동사적 의미로 살려, 조건절의 간결함과 요한복음의 반복적 표현을 유지했습니다.
- source_word: ὄψῃ τὴν δόξαν
  english_pob_choice: you will see the glory
  chosen_korean: 영광을 보게 될 것이라고
  alternatives_korean:
  - 영광을 보리라고
  - 영광을 볼 것이라고
  lexicon: BDAG
  rationale: ὁράω의 미래 의미를 자연스러운 한국어 미래 표현으로 옮기고, δόξα는 요한복음 맥락에 맞게 ‘영광’으로 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 표현
  chosen_reading: τοῦ θεοῦ는 ‘하나님’으로 옮겨, 일반적 기독교 한국어 독자에게 즉시 이해되도록 했습니다.
  alternative_readings:
  - 하느님
  - 신
  rationale: 이 절은 요한복음의 표준 신학 어휘를 사용하므로, 보편적 개신교 번역 관습에 따라 ‘하나님’을 유지하는 것이 source-directed 의미를 가장 안정적으로 전달합니다.
  doctrine_reference: POB glossary default for Θεός
- issue: 예수의 반문과 약속의 범위
  chosen_reading: 문장을 단순한 조건문이 아니라, 이미 한 말을 상기시키는 반문으로 유지했습니다.
  alternative_readings:
  - 일반 원리로 확장
  - 나사로 부활에만 한정
  rationale: 본문은 마르다에게 주어진 직접 발언을 전달하므로, 믿음과 영광의 관계를 해석적으로 좁히지 않고 원문이 가진 긴장을 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
