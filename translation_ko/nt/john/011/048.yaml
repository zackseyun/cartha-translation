id: JHN.11.48
reference: John 11:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
  footnotes:
  - marker: a
    text: Or 'our temple'; the Greek says 'our place,' which may refer specifically to the temple or more broadly to their place or standing.
    reason: alternative_reading
  - marker: b
    text: Or 'our people' for 'our nation.'
    reason: lexical_alternative
translation:
  language: ko
  text: “우리가 그를 이렇게 그대로 두면[a], 모든 사람이 그를 믿게 될 것이고[b], 그러면 로마인들이 와서 우리의 자리와 민족을 빼앗아 갈 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 성전’. 헬라어는 ‘우리의 자리’라고 되어 있으며, 구체적으로는 성전을 가리킬 수도 있고 더 넓게는 그들의 자리나 지위를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘우리의 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἀφῶμεν αὐτὸν οὕτως
  english_pob_choice: If we let him go on like this
  chosen_korean: “우리가 그를 이렇게 그대로 두면”
  alternatives_korean:
  - 우리가 그를 그냥 두면
  - 우리가 그를 이대로 두면
  - 우리가 그를 계속 그렇게 두면
  lexicon: BDAG
  rationale: ἀφῶμεν은 허용/방임의 뉘앙스가 있어 ‘그대로 두면’으로 옮겼고, οὕτως의 지속성을 ‘이렇게’와 ‘그대로’로 함께 살려 자연스럽게 표현했습니다.
- source_word: πάντες πιστεύσουσιν εἰς αὐτόν
  english_pob_choice: everyone will believe in him
  chosen_korean: “모든 사람이 그를 믿게 될 것이고”
  alternatives_korean:
  - 사람들이 다 그를 믿게 될 것이고
  - 모든 이가 그를 믿게 될 것이고
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω εἰς + 대격은 통상 ‘믿다/믿게 되다’로 옮기므로, 관계성을 분명히 드러내면서도 한국어 문맥에 자연스러운 ‘그를 믿게 될 것’으로 처리했습니다.
- source_word: οἱ Ῥωμαῖοι
  english_pob_choice: the Romans
  chosen_korean: “로마인들이”
  alternatives_korean:
  - 로마 사람들이
  - 로마 사람들이 와서
  lexicon: BDAG
  rationale: Ῥωμαῖοι는 민족/집단 명칭이므로 ‘로마인들’이 가장 सीधे하고 간결합니다.
- source_word: τὸν τόπον
  english_pob_choice: our place
  chosen_korean: “우리의 자리”
  alternatives_korean:
  - 우리의 자리
  - 우리의 장소
  - 우리의 성전
  lexicon: BDAG
  rationale: τόπος는 문자적으로 ‘장소/자리’이지만, 문맥상 성전이나 지위까지 열려 있으므로 본문에서는 해석을 과하게 좁히지 않는 ‘자리’로 두었습니다.
- source_word: τὸ ἔθνος
  english_pob_choice: our nation
  chosen_korean: “민족”
  alternatives_korean:
  - 나라
  - 백성
  - 민족
  lexicon: BDAG
  rationale: ἔθνος는 여기서 정치적·집단적 위기의식을 나타내므로 ‘민족’이 ‘백성’보다 문맥상 더 직접적이며, 주석 없이도 집단 전체를 가리키는 느낌을 살립니다.
theological_decisions:
- issue: τὸν τόπον의 의미를 본문에서 특정할지 여부
  chosen_reading: 본문은 ‘자리’로 두어 성전/지위 가능성을 열어 둡니다.
  alternative_readings:
  - 성전
  - 위치
  - 지위
  rationale: 그리스어 τόπος 자체는 더 넓은 의미를 가지며, 본문이 의도적으로 남겨 둔 모호성을 한국어에서도 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve ambiguity rather than resolve interpretively.'
