id: JHN.11.15
reference: John 11:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
  footnotes:
  - marker: a
    text: Or 'so that you may come to believe.' The Greek aorist subjunctive may emphasize coming into belief, though 'believe' is kept in the main text as the broader and less interpretively loaded rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 너희를 위하여 내가 거기에 있지 않았던 것을 기뻐합니다. 이는 너희가 믿게 하려는 것입니다. 그러나 그에게 갑시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 믿기 시작하게 하려는 것입니다.’ 그리스어 부정과거 접속법은 믿게 되는 시작을 강조할 수 있습니다. 그러나 본문은 더 넓고 덜 해석적인 의미로 ‘믿게’라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  english_pob_choice: I am glad
  chosen_korean: 기뻐합니다
  alternatives_korean:
  - 즐거워합니다
  - 반기고 있습니다
  lexicon: BDAG
  rationale: 현재형 1인칭 진술로서 예수의 긍정적 감정을 자연스러운 합쇼체로 옮기되, 단순한 감정보다 능동적 기쁨을 드러내는 표현을 택했습니다.
- source_word: δι’ ὑμᾶς
  english_pob_choice: for your sake
  chosen_korean: 너희를 위해
  alternatives_korean:
  - 너희를 위하여
  - 너희 덕분에
  lexicon: BDAG
  rationale: διά + 목적격이 여기서는 제자들의 유익을 가리키므로, 한국어에서도 이유보다 수혜를 드러내는 ‘너희를 위해’가 가장 자연스럽습니다.
- source_word: ἵνα πιστεύσητε
  english_pob_choice: so that you may believe
  chosen_korean: 이는 너희가 믿게 하려는 것입니다
  alternatives_korean:
  - 그래서 너희가 믿도록 하려는 것입니다
  - 이는 너희가 믿기 위함입니다
  lexicon: BDAG
  rationale: ἵνα의 목적 의미를 살리면서도, aorist 접속법의 기동적 뉘앙스를 과도하게 해석하지 않도록 ‘믿게 하려는’으로 옮겼습니다.
- source_word: ἄγωμεν πρὸς αὐτόν
  english_pob_choice: Let us go to him
  chosen_korean: 우리가 그에게 가 봅시다
  alternatives_korean:
  - 우리가 그에게 갑시다
  - 가자
  lexicon: BDAG
  rationale: 호ortatory 용법의 1인칭 복수 접속법을 표준 합쇼체 요청/권유로 풀어, 한국어에서 부드럽고 자연스러운 공동 행동 권면을 살렸습니다.
theological_decisions:
- issue: 예수의 ‘기뻐함’과 장례적 맥락의 긴장
  chosen_reading: 기쁨은 상황 자체를 즐긴다는 뜻이 아니라, 제자들의 믿음을 위해 그 상황을 유익하게 받으신다는 의미로 유지했습니다.
  alternative_readings:
  - 기뻐하지 않습니다
  - 기뻐하십니다(완곡하게 약화)
  rationale: 원문 χαίρω의 정서를 지우지 않으면서, 이어지는 목적절(ἵνα πιστεύσητε)과의 연결을 보존해야 합니다. 이 긴장은 요한복음의 서술 의도에 속하므로 평평하게 만들지 않았습니다.
  doctrine_reference: 요한복음의 표적-믿음 구조; 번역 철학 §3
- issue: ἵνα πιστεύσητε의 믿음 강도
  chosen_reading: ‘믿게’로 번역하되 ‘믿기 시작하다’로 과잉 해석하지 않았습니다.
  alternative_readings:
  - 믿기 시작하게
  - 믿음에 들어오게
  rationale: aorist 접속법이 진입적 뉘앙스를 띨 수 있으나, 본절은 제자들의 이전 불신을 단정하는 문맥이 아니므로 더 넓은 ‘믿게 하려는’으로 유지했습니다.
  doctrine_reference: πιστεύω/믿음 관련 번역 원칙
