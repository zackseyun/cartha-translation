base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: ko
  text: 그러므로 그날부터 그들은 그를 죽이기로 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας
  english_pob_choice: from that day on / So
  chosen_korean: 그날부터
  alternatives_korean:
  - 그날 이후로
  - 그때부터
  lexicon: BDAG
  rationale: ἀπό + ‘그날’은 시작점을 나타내므로 ‘그날부터’가 자연스럽게 지속적 전환을 드러냅니다. οὖν의 연결감은 문맥상 별도 접속어 없이도 이전 장면과의 결과 관계로 충분히 반영됩니다.
- source_word: ἐβουλεύσαντο
  english_pob_choice: they planned
  chosen_korean: 모의했습니다
  alternatives_korean:
  - 계획했습니다
  - 결정했습니다
  - 상의했습니다
  lexicon: BDAG
  rationale: βουλεύομαι는 숙의 끝에 세운 의도를 뜻하므로, 단순한 ‘계획’보다 적대적 뉘앙스를 살리는 ‘모의하다’가 문맥에 더 가깝습니다.
- source_word: ἵνα ἀποκτείνωσιν αὐτόν
  english_pob_choice: to kill him
  chosen_korean: 예수를 죽이기로
  alternatives_korean:
  - 그를 죽이려고
  - 그를 죽이도록
  - 그를 죽이기 위해
  lexicon: BDAG
  rationale: ἵνα + 접속법은 목적을 나타내므로 한국어에서는 ‘-기로’로 간결하게 옮겼습니다. 전치사적 설명을 덧붙이지 않고도 행위의 목적이 분명히 드러납니다.
theological_decisions:
- issue: 예수를 향한 지도자들의 의도
  chosen_reading: 단순한 논의가 아니라, 실제 살해 의도를 갖춘 결의로 옮겼습니다.
  alternative_readings:
  - 예수를 죽일 방법을 논의했습니다
  - 예수를 죽이기로 결정했습니다
  rationale: 본문은 예수에 대한 적대가 공식적 결의 수준에 이르렀음을 보여 주므로, 그 긴장과 심각성을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 본문의 직접적 의미와 서술의 강도를 유지합니다.'
