    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  english_pob_choice: were saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하고 있었습니다
  - 계속 말했습니다
  lexicon: BDAG
  rationale: 미완료 시상의 반복·진행 뉘앙스는 한국어에서 자연스러운 서술 과거로 충분히 드러낼 수 있어, 문맥 흐름을 해치지 않는 「말했습니다」를 택했습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그때
  alternatives_korean:
  - 그러므로
  - 그러자
  - 그래서
  lexicon: BDAG
  rationale: 앞선 예수님의 눈물 장면에서 이어지는 서사적 연결을 한국어 담화에 자연스럽게 살리되, 논리적 결론처럼 과도하게 들리지 않도록 「그때」로 옮겼습니다.
- source_word: Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 사람들
  - 유다인들
  lexicon: BDAG
  rationale: 본문의 집단 표지를 직접 반영하면서도 현대 한국어에서 역사적·민족적 집단 지시를 비교적 투명하게 전달하는 표현을 택했습니다. 이 절에서는 현장에 있던 애곡자들을 가리키는 맥락이므로 단순 직역을 유지했습니다.
- source_word: ἐφίλει
  english_pob_choice: loved
  chosen_korean: 사랑했는지
  alternatives_korean:
  - 좋아했는지
  - 아꼈는지
  - 사랑하고 있었는지
  lexicon: BDAG
  rationale: φιλέω의 친밀한 애정을 한국어의 「사랑하다」로 옮기되, 감탄형 간접화법에 맞춰 결과상 「사랑했는지」로 처리해 문장의 힘을 살렸습니다.
theological_decisions:
- issue: 유대인들(οἱ Ἰουδαῖοι)의 한국어 처리
  chosen_reading: 본문의 표면형을 따라 「유대인들」로 두고, 이 장면이 예루살렘 주변의 현장 목격자들을 가리킨다는 맥락은 본문 밖 주해에 맡깁니다.
  alternative_readings:
  - 유대 사람들
  - 유다인들
  rationale: 요한복음의 고정 표현을 지나치게 완화하면 원문이 가진 서술 습관과 반복성을 흐릴 수 있습니다. 이 절에서는 비난적 일반화가 아니라 현장 인물 지시이므로, 본문은 직설적으로 두는 편이 소스 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §1, §5
