  naturalness: 「보십시오, 그분이 그를 얼마나 사랑하셨는지!」는 현대 표준어 합쇼체에 자연스럽고, 예수님을 가리키는 주어에는 높임을 반영합니다. 「그분/그」의 구별로 원문의 두 남성 단수 대명사를 과도한 해설 없이 재현합니다.
  terminology: οἱ Ἰουδαῖοι는 본문에서 「유대인들」로 유지합니다. 각주의 「유다인들」은 현장에 있던 사람들을 지역적으로 더 특정하는 가능성이라는 점을 정확히 밝혀야 하며, 기존 각주의 「이 구절의 인물」은 지시 대상이 불명확합니다.
