source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
  footnotes:
  - marker: a
    text: Or, “Could he not have kept this man from dying?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들 중 몇 사람이 말했습니다[a]. 「눈먼 사람의 눈을 뜨게 한 이 사람이 이 사람도 죽지 않게 할 수는 없었습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「그가 이 사람이 죽는 것을 막을 수는 없었습니까?」
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  english_pob_choice: But some of them
  chosen_korean: 그러나 그들 중 몇 사람이
  alternatives_korean:
  - 그들 가운데 몇 사람이
  - 그들 중 일부가
  lexicon: BDAG
  rationale: τινές + ἐξ αὐτῶν은 자연스럽게 ‘그들 중 몇 사람’으로 옮길 수 있고, δέ는 앞 문맥과의 대비를 살려 ‘그러나’로 표현했습니다.
- source_word: ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  english_pob_choice: who opened the eyes of the blind man
  chosen_korean: 눈먼 사람의 눈을 뜨게 한
  alternatives_korean:
  - 눈먼 사람의 눈을 연
  - 눈먼 사람의 눈을 열어 주신
  lexicon: BDAG
  rationale: 동사 ἀνοίγω의 관용적 표현을 한국어에서도 ‘눈을 뜨게 하다’로 자연스럽게 살렸고, ‘그 사람’에 대한 식별 기능도 유지했습니다.
- source_word: ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ
  english_pob_choice: have made it so that this man would not die
  chosen_korean: 이 사람이 죽지 않게도 할 수는 없었습니까
  alternatives_korean:
  - 이 사람이 죽지 않도록 하게 할 수는 없었습니까
  - 이 사람이 죽지 않게 만들 수는 없었습니까
  lexicon: BDAG
  rationale: ποιέω + ἵνα는 결과를 이루게 하는 의미이므로 ‘할 수는 없었습니까’로 질문형 능력 표현을 살리면서, 한국어 자연성을 위해 목적절을 압축해 옮겼습니다.
- source_word: οὗτος
  english_pob_choice: this man
  chosen_korean: 이 사람
  alternatives_korean:
  - 이분
  - 이 사람
  lexicon: BDAG
  rationale: 예수에 대한 지시와 나사로에 대한 재지시 모두에서 οὗτος의 지시성을 유지하되, 한국어에서는 반복되는 ‘이 사람’이 가장 직접적이고 문맥상 분명합니다.
theological_decisions:
- issue: 말하는 이들의 어조
  chosen_reading: 수사적 반문으로서 예수의 능력에 대한 의문을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 단순한 정보 질문으로 완화하는 번역
  - 노골적 비난으로 강화하는 번역
  rationale: 그리스어 Οὐκ ἐδύνατο는 단순 질문보다 반문에 가깝고, 본문이 드러내는 긴장과 암시된 비판을 과장하지 않으면서 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 긴장을 평탄화하지 않음
