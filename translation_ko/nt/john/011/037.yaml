    issue: καί의 범위와 ‘도’의 위치
    rationale: καὶ οὗτος는 나사로를 가리켜 ‘이 사람도’를 뜻합니다. 초안의 ‘죽지 않게도’는 ‘또한’이 죽지 않음이라는 결과에 붙는 듯 들리고 한국어 어순도 어색합니다.
  - severity: low
    issue: 동격구의 반복
    rationale: ‘이 사람이, 곧 … 그 사람이’는 그리스어의 한정 분사구를 과도하게 반복합니다. ‘눈먼 사람의 눈을 뜨게 한 이 사람이’로 자연스럽게 식별 기능을 보존할 수 있습니다.
  - severity: medium
    issue: 각주 대안의 이중 사역 표현
    rationale: ‘죽지 않도록 하게 할’은 한국어에서 불필요한 이중 사역으로 어색합니다. 영어 감사 기록의 대안인 ‘kept this man from dying’에 맞춰 ‘죽는 것을 막을’로 고칩니다.
  revised_text: 그러나 그들 중 몇 사람이 말했습니다[a]. 「눈먼 사람의 눈을 뜨게 한 이 사람이 이 사람도 죽지 않게 할 수는 없었습니까?」
