review_pass:
  verdict: revise
  source_fidelity: ‘자기 동생’은 ἀδελφή가 제공하지 않는 연령 관계를 덧붙입니다. 또한 λάθρᾳ는 마리아를 부르는 행위 자체보다 뒤따르는 발화가 다른 이들에게 들리지 않게 이루어진 방식을 수식하는 것으로 옮기는 편이 안전합니다.
  naturalness: ‘자기 자매인 마리아를 불러, 남몰래 말했습니다’는 현대 표준어 문장으로 자연스럽고, 인용문에서는 반복되는 ‘당신’을 ‘마리아’로 바꾸어 자매 사이의 발화로 더 자연스럽게 만들었습니다.
  terminology: διδάσκαλος는 존칭을 갖춘 ‘선생님’으로 유지했습니다. ‘주인님’은 한국어에서 종속 관계의 뉘앙스가 강하므로 본문의 어휘적 대안으로는 ‘스승님’이 더 적절합니다.
  issues:
  - severity: high
    issue: ‘자기 동생 마리아’가 자매의 연령 순서를 특정함
    rationale: 그리스어 ἀδελφή는 단지 ‘자매’를 뜻하며, 마리아가 마르다의 여동생이라는 정보는 본문에 없습니다.
  - severity: medium
    issue: ‘남몰래’의 수식 범위가 ‘불러’에 걸릴 수 있음
    rationale: λάθρᾳ는 εἰποῦσα와 함께 마리아에게 한 말을 공개적으로 들리지 않게 했다는 뜻입니다. 쉼표와 어순으로 이를 분명히 하는 것이 좋습니다.
  - severity: medium
    issue: 각주 표지가 해당 본문 어구에 붙어 있지 않고, 각주 c에 비한국어 문자 ‘উপস্থিত’가 포함됨
    rationale: 각주는 해당 어구 뒤에 연결되어야 하며, 오탈자는 한국어 문장으로 바로잡아야 합니다.
  revised_text: 그리고 이 말을 하고 나서 마르다는 떠나, 자기 자매인 마리아를 불러 남몰래 말했습니다. “선생님께서[a] 여기 계시고, 마리아를 부르십니다.”[b]
  revised_footnotes:
  - marker: a
    text: '또는 “스승님께서.” 그리스어: “선생님.”'
    reason: lexical_alternative
  - marker: b
    text: 또는 “마리아를 부르고 계십니다.” 그리스어 현재시제는 더 문자적으로 이렇게 옮길 수 있지만, 여기서는 예수께서 마리아가 오기를 요청하신다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “은밀히.” 그리스어 부사는 다른 이들에게 들리지 않게 말하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
