id: JHN.11.28
reference: John 11:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
  footnotes:
  - marker: a
    text: Or “secretly.” The Greek adverb can denote speaking out of public hearing.
    reason: lexical_alternative
  - marker: b
    text: 'Or “The Master is here.” Greek: “The Teacher.”'
    reason: lexical_alternative
  - marker: c
    text: Or “calls you” / “is calling you.” The Greek present tense may be rendered more literally, but here likely means that he is asking for your presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 말을 하고 나서 마르다는 떠나서, 자기 동생 마리아를 남몰래 불러 말했습니다. “선생님께서 여기 계시고, 당신을 부르십니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “비밀리에.” 그리스어 부사는 공개적으로 들리지 않게 말하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '또는 “주인님께서.” 그리스어: “선생님.”'
    reason: lexical_alternative
  - marker: c
    text: 또는 “당신을 부르고 계십니다.” 그리스어 현재시제는 더 문자적으로 옮길 수 있지만, 여기서는 그가 마리아의 উপস্থিত를 요청하고 있다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  english_pob_choice: after saying this
  chosen_korean: 이 말을 하고 나서
  alternatives_korean:
  - 말한 뒤에
  - 이것을 말하고
  lexicon: BDAG
  rationale: 부사적 분사구를 한국어의 자연스러운 시간 연결로 옮겨, 사건의 선후를 분명히 하면서도 과도하게 문어적으로 만들지 않았습니다.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  english_pob_choice: called Mary her sister
  chosen_korean: 자기 동생 마리아를 불러
  alternatives_korean:
  - 자기 누이 마리아를 불러
  - 마리아를 불렀습니다
  lexicon: BDAG
  rationale: φωνέω의 ‘부르다/소리내어 부르다’라는 의미를 살려, 마리아가 마르다의 동생임을 한국어로 자연스럽게 드러냈습니다.
- source_word: λάθρᾳ
  english_pob_choice: privately
  chosen_korean: 남몰래
  alternatives_korean:
  - 은밀히
  - 몰래
  lexicon: BDAG
  rationale: 공개적인 자리에서 들리지 않게 말한 뉘앙스를 살리되, ‘비밀스럽게’보다 중립적이고 장면에 맞는 표현으로 옮겼습니다.
- source_word: Ὁ διδάσκαλος
  english_pob_choice: The Teacher
  chosen_korean: 선생님께서
  alternatives_korean:
  - 선생님이
  - 스승님께서
  lexicon: BDAG
  rationale: 예수께 대한 존칭을 유지하면서 διδάσκαλος의 기본 뜻을 따라 ‘선생님’으로 옮겼고, 직접 인용 안에서 주어 표시를 위해 주격 조사보다 높임 표현을 사용했습니다.
- source_word: φωνεῖ σε
  english_pob_choice: is calling for you
  chosen_korean: 당신을 부르십니다
  alternatives_korean:
  - 부르십니다
  - 당신을 부르십니다
  lexicon: BDAG
  rationale: 현재시제의 진행성을 한국어에서 자연스럽게 표현하면서, 단순히 이름을 부르는 것이 아니라 마리아의 উপস্থিত를 요청하는 뜻을 살렸습니다.
theological_decisions:
- issue: 예수 호칭 διδάσκαλος의 한국어 존칭 수준
  chosen_reading: 선생님께서
  alternative_readings:
  - 선생님이
  - 스승님께서
  rationale: 본문은 예수의 신적 칭호를 새로 부여하기보다, 마르다가 부르는 존칭적 호칭을 보여 줍니다. 한국어에서는 자연스러운 존칭으로 그 관계를 드러내는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 2, 6
- issue: λάθρᾳ의 뉘앙스
  chosen_reading: 남몰래
  alternative_readings:
  - 은밀히
  - 몰래
  rationale: 이 장면은 주변 사람들 앞에서 공공연히 말하지 않았음을 뜻하지만, 반드시 속임수나 음모를 암시하지는 않습니다. ‘남몰래’는 그 긴장을 유지하면서도 과장하지 않습니다.
  doctrine_reference: Translation philosophy §§1, 6
