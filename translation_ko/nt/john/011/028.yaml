review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἀδελφή는 단지 ‘자매/누이’를 뜻하며 마리아가 마르다의 ‘동생’이라는 출생 순서는 본문에 없습니다. 또한 λάθρᾳ는 마리아를 부른 행위가 다른 이들에게 들리지 않도록 이루어진 방식을 수식하므로 해당 표현에 각주를 붙이는 것이 적절합니다.
  naturalness: 초안의 문장은 대체로 자연스럽지만, ‘자기 동생’은 불필요한 정보를 더합니다. 직접 인용에서 자매 사이의 ‘당신’은 현대 한국어에서 다소 부자연스러우므로 ‘너’를 사용하되, 예수에 대해서는 ‘부르십니다’로 존대를 유지하는 편이 자연스럽습니다.
  terminology: διδάσκαλος는 ‘선생님’이 적절합니다. 영어 감사 기록의 ‘Master’에 대응하는 한국어 각주 대안은 소유·주종 관계의 뉘앙스가 강한 ‘주인님’보다 ‘스승님’이 자연스럽고 원문의 교사 의미에도 가깝습니다.
  issues:
  - severity: high
    issue: ‘자기 동생 마리아’
    rationale: 그리스어 τὴν ἀδελφὴν αὐτῆς는 ‘그녀의 자매 마리아’일 뿐, 마리아가 연소 자매라는 정보를 제공하지 않습니다.
  - severity: medium
    issue: 각주 표지가 인용문 끝에 일괄 배치됨
    rationale: a는 λάθρᾳ, b는 ὁ διδάσκαλος, c는 φωνεῖ σε에 각각 연결되어야 하므로 해당 한국어 표현 바로 뒤에 배치해야 합니다.
  - severity: medium
    issue: 각주 c의 ‘마리아의 존재’ 표현
    rationale: 원문과 영어 감사 기록은 마리아가 예수께 오도록 요청받는다는 뜻입니다. ‘존재’는 오기 위한 요청이라는 의미를 전달하지 못하며, 초안에는 비한국어 문자도 섞여 있습니다.
  - severity: low
    issue: ‘주인님’ 각주 대안
    rationale: 가능한 번역 전통을 반영하려는 의도는 이해되나, 현대 한국어에서 ‘주인님’은 διδάσκαλος보다 강한 소유·주종 의미를 불러올 수 있습니다.
  revised_text: 그리고 이 말을 한 뒤에 마르다는 떠나가 자기 자매 마리아를 남몰래[a] 불러 이렇게 말했습니다. “선생님께서[b] 여기 계시며, 너를 부르십니다.”[c]
  revised_footnotes:
  - marker: a
    text: 또는 “은밀히.” 그리스어 부사는 다른 사람들이 듣지 못하게 말하거나 부르는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '또는 “스승님께서.” 그리스어: “선생님.”'
    reason: lexical_alternative
  - marker: c
    text: 또는 “너를 부르고 계십니다.” 그리스어 현재시제는 더 문자적으로 옮길 수 있지만, 여기서는 예수께서 마리아가 오기를 요청하신다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 마리아의 출생 순서를 암시하는 ‘동생’을 ‘자매’로 고쳐 원문의 범위를 보존했습니다. λάθρᾳ, διδάσκαλος, φωνεῖ σε에 각주 표지를 각각 연결했고, 각주 c의 의미 및 문자 오류를 바로잡았습니다. ‘여기 계시며’는 πάρεστιν의 현재적 현존을, ‘부르십니다’는 φωνεῖ의 현재형과 예수에 대한 존대를 자연스럽게 반영합니다.
