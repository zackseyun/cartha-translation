  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
  footnotes:
  - marker: a
    text: Or “the one who had died.”
    reason: lexical_alternative
  - marker: b
    text: Or “he stinks”; Greek has a verb meaning “to emit an odor.”
    reason: lexical_alternative
  - marker: c
    text: Literally, “for he is a fourth-day man,” that is, he has been dead four days.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “돌을 치우십시오.” 그러자 죽은 사람[a]의 누이 마르다가 예수께 말했습니다. “주님, 이미 냄새가 납니다[b]. 죽은 지 나흘째[c]이기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 이’. 그리스어는 ‘죽다’라는 뜻의 동사의 완료분사를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악취가 납니다’. 그리스어 동사는 냄새를 내다라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘넷째 날인 이’입니다. 여기서는 죽은 지 나흘째라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  english_pob_choice: Take away
  chosen_korean: 옮겨 놓으십시오
  alternatives_korean:
  - 치우십시오
  - 가져가십시오
  lexicon: BDAG
  rationale: 무덤 입구를 막은 돌을 물리적으로 제거하라는 명령이므로, 단순한 ‘들어 올리다’보다 결과를 드러내는 ‘옮겨 놓으십시오’가 자연스럽고 문맥에 맞습니다.
- source_word: τὸν λίθον
  english_pob_choice: the stone
  chosen_korean: 돌
  alternatives_korean:
  - 바위
  - 그 돌
  lexicon: BDAG
  rationale: 무덤을 막는 석재를 가리키는 일반적 표현이므로 ‘돌’이 가장 직접적이고 분명합니다.
- source_word: τοῦ τετελευτηκότος
  english_pob_choice: the dead man
  chosen_korean: 죽은 사람
  alternatives_korean:
  - 죽은 자
  - 이미 죽은 사람
  - 세상을 떠난 사람
  lexicon: BDAG
  rationale: 완료 분사가 나타내는 ‘죽어 있는 상태’를 한국어로 자연스럽게 풀어, 마르다가 라자로를 지칭하는 참조를 유지했습니다.
- source_word: ὄζει
  english_pob_choice: he smells
  chosen_korean: 냄새가 납니다
  alternatives_korean:
  - 악취가 납니다
  - 썩는 냄새가 납니다
  - 그는 냄새를 풍깁니다
  lexicon: BDAG
  rationale: 그리스어 동사는 ‘악취를 내다’는 뜻이지만, 한국어에서는 주어를 사람으로 유지하면서도 노골적이거나 구어체적인 표현을 피하는 ‘냄새가 납니다’가 적절합니다.
- source_word: τεταρταῖος
  english_pob_choice: he has been dead four days
  chosen_korean: 죽은 지 나흘이나 되었기 때문입니다
  alternatives_korean:
  - 나흘째 되었습니다
  - 죽은 지 벌써 나흘입니다
  - 나흘 동안 죽어 있었기 때문입니다
  lexicon: BDAG
  rationale: 직역하면 ‘사흘이 아닌 네째 날 사람’이라는 관용적 표현이어서, 한국어에서는 의미를 드러내는 설명형으로 옮겼습니다.
theological_decisions:
- issue: Κύριε의 호칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 주인님
  - 선생님
  rationale: 요한복음에서 예수께 대한 κύριε는 단순한 예의호칭보다 더 무게 있는 호칭이므로, 프로젝트 기본값에 따라 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
