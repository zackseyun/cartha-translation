  to: 예수께서 말씀하셨습니다. “돌을 치우십시오.” 그러자 죽은 사람[a]의 누이 마르다가 예수께 말했습니다. “주님, 이미 냄새가 납니다[b]. 죽은 지 나흘째[c]이기 때문입니다.”
