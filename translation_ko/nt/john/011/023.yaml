id: JHN.11.23
reference: John 11:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
  footnotes:
  - marker: a
    text: Or “Your brother will rise.” The Greek verb can be rendered simply “will rise”; “again” makes the resurrection sense explicit in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “네 형제는 다시 살아날 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 형제는 살아날 것입니다.” 헬라어 동사는 단순히 “일어나다/살아나다”로도 옮길 수 있으며, “다시”는 부활의 뜻을 한국어에서 분명하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  english_pob_choice: says
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  - 이르십니다
  lexicon: SBLGNT
  rationale: 요한복음의 역사적 현재를 한국어에서 자연스러운 과거 서술로 옮기되, 예수의 말씀 행위를 공손하게 드러내기 위해 ‘말씀하셨습니다’를 선택했습니다.
- source_word: αὐτῇ
  english_pob_choice: to her
  chosen_korean: 그에게
  alternatives_korean:
  - 그녀에게
  - 마르다에게
  lexicon: SBLGNT
  rationale: 지시대명사 자체보다 문맥상 마르다를 가리키는 대상을 한국어에서 자연스럽게 드러내기 위해 ‘그에게’로 옮겼습니다.
- source_word: Ἀναστήσεται
  english_pob_choice: will rise again
  chosen_korean: 다시 살아날 것입니다
  alternatives_korean:
  - 일어날 것입니다
  - 다시 일어날 것입니다
  - 부활할 것입니다
  lexicon: BDAG
  rationale: 문맥이 나사로의 죽음 이후를 말하므로 단순한 ‘일어나다’보다 죽음에서의 회생을 분명히 하는 ‘다시 살아나다’를 택했습니다. ‘부활하다’는 교리적 용어로는 맞지만 여기서는 원문이 허용하는 표현보다 해석을 앞세울 수 있어 피했습니다.
- source_word: ὁ ἀδελφός σου
  english_pob_choice: your brother
  chosen_korean: 네 형제
  alternatives_korean:
  - 당신의 형제
  - 네 오빠
  - 네 남동생
  lexicon: BDAG
  rationale: ἀδελφός의 기본 의미를 살리되, 한국어에서 마르다와 나사로의 형제 관계를 중립적으로 전달하기 위해 ‘형제’를 사용했습니다.
theological_decisions:
- issue: 부활 표현의 범위
  chosen_reading: ‘다시 살아날 것입니다’로 옮겨, 즉시 회복과 최종 부활 중 어느 하나로도 과도하게 고정하지 않았습니다.
  alternative_readings:
  - 부활할 것입니다
  - 다시 일어날 것입니다
  - 살아날 것입니다
  rationale: 예수의 약속은 분명하지만, 이 절만으로 그 부활의 시점과 방식의 모든 신학적 구분을 해결하지는 않으므로 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
