  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
  footnotes:
  - marker: a
    text: Or, 'And now I know.' The Greek conjunction can be rendered simply 'and,' but in context it also carries a contrastive turn after Martha's statement about Lazarus's death.
    reason: lexical_alternative
  - marker: b
    text: Greek, 'whatever you ask God.' English often expresses this idiom as 'ask from God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 지금도 저는 주님께서 하나님께 무엇이든 구하시면, 하나님께서 주님께 주실 줄 압니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러나 지금도’는 앞선 마르다의 죽음 언급 뒤에 이어지는 전환의 뉘앙스를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘하나님께 무엇이든 구하다’입니다. 한국어에서도 ‘하나님께 무엇이든 구하다’로 자연스럽게 표현할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: But even now
  chosen_korean: 그러나 지금도
  alternatives_korean:
  - 그리고 지금도
  - 지금도
  lexicon: BDAG
  rationale: καί는 여기서 단순 접속보다 앞선 마르다의 말과 이어지는 반전의 뉘앙스를 가지므로, ‘그러나’로 전환감을 살리고 νῦν의 시간감은 ‘지금도’로 보존했습니다.
- source_word: οἶδα
  english_pob_choice: I know
  chosen_korean: 저는 … 압니다
  alternatives_korean:
  - 저는 … 알고 있습니다
  - 저는 … 확신합니다
  lexicon: BDAG
  rationale: οἶδα의 현재적 확정 인식을 자연스러운 합쇼체로 옮겨 ‘압니다’로 두었습니다.
- source_word: ὅσα ἂν αἰτήσῃ
  english_pob_choice: whatever you ask
  chosen_korean: 당신이 무엇이든 구하시면
  alternatives_korean:
  - 당신이 무엇이든 요청하시면
  - 당신이 구하시는 것은 무엇이든
  lexicon: BDAG
  rationale: ἄν이 붙은 관계절의 불특정·일반성을 ‘무엇이든’으로 살렸고, 기도 맥락의 αἰτέω는 ‘구하다’가 가장 직접적입니다.
- source_word: τὸν θεὸν / ὁ θεός
  english_pob_choice: from God ... God
  chosen_korean: 하나님께 ... 하나님께서
  alternatives_korean:
  - 하나님으로부터 ... 하나님이
  - 하나님께 ... 하나님이
  lexicon: BDAG
  rationale: αἰτέω의 목적어는 한국어에서는 ‘~께 구하다’가 자연스러우므로 ‘하나님께’로, 뒤의 미래 주어는 ‘하나님께서’로 분명히 했습니다.
theological_decisions:
- issue: 본문이 예수와 하나님 아버지의 관계를 서술할 때 위계를 완화하거나 교리적으로 재구성할지 여부
  chosen_reading: 본문의 직설적 표현을 유지해, 마르다의 믿음 고백을 ‘당신이 하나님께 무엇이든 구하시면 하나님께서 당신에게 주실 줄 압니다’로 옮겼습니다.
  alternative_readings:
  - ‘하나님께서 당신의 기도를 들으실 것입니다’로 완화
  - ‘아버지께서’로 확장
  rationale: 요한복음의 내러티브 긴장을 지우지 않고, 본문이 말하는 관계를 그대로 드러내는 것이 source-direct 번역에 더 충실합니다.
  doctrine_reference: 'Translation philosophy #3'
