  source_fidelity: 원문의 식별적 서술(ἦν … Μαριὰμ)과 마리아를 수식하는 두 분사, 그리고 나사로가 마리아의 형제라는 관계를 유지해야 합니다. 초안의 ‘그때는’은 δέ에 시간적 의미를 과도하게 부여하며, ‘오빠’는 원문에 없는 연령 관계를 더합니다. ‘향유를 붓고’보다 ἀλείψασα의 기름을 바르는 행위에는 ‘향유를 바르고’가 더 직접적입니다.
