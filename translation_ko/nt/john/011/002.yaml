  terminology: Μαριὰμ은 ‘마리아’, κύριον은 ‘주님’, μύρῳ는 ‘향유’로 유지하는 것이 적절합니다. ‘형제’는 ἀδελφός가 제공하지 않는 출생 순서를 보태지 않습니다. 각주도 독자용 어휘 대안으로 간결하게 고칩니다.
