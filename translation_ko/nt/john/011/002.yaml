id: JHN.11.2
reference: John 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: Now it was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
  footnotes:
  - marker: a
    text: Or 'with ointment' or 'with fragrant oil'; the Greek term refers to perfumed oil/ointment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때는 마리아였습니다. 곧 주님께 향유를 붓고 자기 머리카락으로 그의 발을 닦은 바로 그 마리아였습니다[a]. 그에게는 나사로라는 오빠가 있었는데, 그가 병들어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향유’는 헬라어 μύρον의 자연스러운 한국어 대응입니다. 문맥상 향이 나는 기름/연고를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  english_pob_choice: Now it was
  chosen_korean: 그때는 …였습니다
  alternatives_korean:
  - 그리고 마리아였습니다
  - 그런데 마리아였습니다
  lexicon: BDAG
  rationale: δὲ의 담화 전환과 ἦν의 식별적 용법을 살려, 단순한 서술보다 ‘바로 그 사람’을 소개하는 문맥을 한국어로 자연스럽게 드러냈습니다.
- source_word: Μαριὰμ
  english_pob_choice: Mary
  chosen_korean: 마리아
  alternatives_korean:
  - 메리
  lexicon: 표준 외래어 표기
  rationale: 성경 인명은 통용되는 한국어 표기 ‘마리아’를 사용했습니다.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: 'DOCTRINE.md Contested terms: κύριος → Lord'
  rationale: 예수를 가리키는 κύριος는 프로젝트 기본값에 따라 ‘주님’으로 옮겨, 단순한 사회적 호칭보다 서술적·신학적 무게를 살렸습니다.
- source_word: μύρῳ
  english_pob_choice: with perfume
  chosen_korean: 향유를
  alternatives_korean:
  - 향수를
  - 향기로운 기름을
  - 연고를
  lexicon: BDAG
  rationale: μύρον은 향이 나는 기름/연고를 가리키므로, 이 문맥의 ‘기름부음’ 행위를 한국어로 가장 자연스럽게 드러내는 ‘향유’를 택했습니다.
theological_decisions:
- issue: 주님(κύριος)의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 요한복음 서술에서 예수를 높이는 호칭으로 기능하므로, 본문의 공경과 기독론적 함의를 유지하는 ‘주님’이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
