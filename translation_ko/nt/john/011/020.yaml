  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
  footnotes:
  - marker: a
    text: Or 'Jesus is coming.' The Greek uses a present tense verb in the reported clause, which can be rendered more formally as a vivid present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 마르다는 예수께서 오신다는 말을 듣고 그분을 만나러 나갔습니다. 그러나 마리아는 집에 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 현재형 ἔρχεται는 보고된 말 속에서 생동감 있는 현재로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러자
  lexicon: BDAG
  rationale: οὖν의 이어짐과 앞 문맥에 대한 추론적 연결을 살리되, 한국어 서술문에서 자연스러운 접속어로 옮겼습니다.
- source_word: ὡς ἤκουσεν ὅτι
  english_pob_choice: when heard that
  chosen_korean: …라는 말을 듣고
  alternatives_korean:
  - …를 듣고
  - …라고 듣고
  lexicon: BDAG
  rationale: 직접 인용문이 아니라 보고된 내용을 들었다는 의미를 자연스럽게 드러내면서, ὅτι 절의 내용성을 유지했습니다.
- source_word: ἔρχεται
  english_pob_choice: was coming
  chosen_korean: 오신다는
  alternatives_korean:
  - 오고 계신다는
  - 오신다
  lexicon: BDAG
  rationale: 보고된 현재형의 생동감을 살리면서도 문장 전체를 한국어 서술 흐름에 맞게 현재적 내용으로 처리했습니다.
- source_word: ὑπήντησεν αὐτῷ
  english_pob_choice: went to meet him
  chosen_korean: 그분을 만나러 나갔습니다
  alternatives_korean:
  - 그분을 맞으러 갔습니다
  - 그분을 만나러 갔습니다
  lexicon: BDAG
  rationale: ὑπαντάω의 ‘가서 만나다’라는 방향성을 살려 단순한 ‘만났다’보다 동작의 향방이 드러나게 했습니다.
- source_word: ἐκαθέζετο
  english_pob_choice: was sitting
  chosen_korean: 앉아 있었습니다
  alternatives_korean:
  - 앉아 있었습니다
  - 자리에 앉아 있었습니다
  lexicon: BDAG
  rationale: 미완료 시상의 지속 상태를 한국어의 ‘-아 있었습니다’로 옮겨, 마리아의 정지된 상태를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마리아와 마르다의 대비를 드러내는 δὲ의 처리
  chosen_reading: ‘그러나’로 옮겨 두 자매의 행동 대비를 분명히 했습니다.
  alternative_readings:
  - 그리고
  - 한편
  rationale: 문맥상 단순한 나열보다 대조가 분명하여, 서술의 긴장을 보존하는 쪽이 원문 효과에 더 가깝습니다.
  doctrine_reference: 문맥적 대비(서사 구조)
