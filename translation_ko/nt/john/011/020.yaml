lexical_decisions:
- source_word: ἡ οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러자
  lexicon: BDAG
  rationale: οὖν의 이어짐과 앞 문맥에 대한 추론적 연결을 살리되, 한국어 서술문에서 자연스러운 접속어로 옮겼습니다.
- source_word: ὡς ἤκουσεν ὅτι
