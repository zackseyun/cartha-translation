  chosen_korean: …라는 말을 듣고
  alternatives_korean:
  - …를 듣고
  - …라고 듣고
  lexicon: BDAG
  rationale: 직접 인용문이 아니라 보고된 내용을 들었다는 의미를 자연스럽게 드러내면서, ὅτι 절의 내용성을 유지했습니다.
- source_word: ἔρχεται
  english_pob_choice: was coming
  chosen_korean: 오신다는
  alternatives_korean:
  - 오고 계신다는
