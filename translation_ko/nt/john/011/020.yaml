  lexicon: BDAG
  rationale: 보고된 현재형의 생동감을 살리면서도 문장 전체를 한국어 서술 흐름에 맞게 현재적 내용으로 처리했습니다.
- source_word: ὑπήντησεν αὐτῷ
  english_pob_choice: went to meet him
  chosen_korean: 그분을 만나러 나갔습니다
  alternatives_korean:
  - 그분을 맞으러 갔습니다
  - 그분을 만나러 갔습니다
  lexicon: BDAG
  rationale: ὑπαντάω의 ‘가서 만나다’라는 방향성을 살려 단순한 ‘만났다’보다 동작의 향방이 드러나게 했습니다.
- source_word: ἐκαθέζετο
  english_pob_choice: was sitting
  chosen_korean: 앉아 있었습니다
  alternatives_korean:
  - 앉아 있었습니다
  - 자리에 앉아 있었습니다
  lexicon: BDAG
  rationale: 미완료 시상의 지속 상태를 한국어의 ‘-아 있었습니다’로 옮겨, 마리아의 정지된 상태를 자연스럽게 표현했습니다.
theological_decisions:
