source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Now many of the Jews had come to Martha and Mary to comfort them about their brother[a].
  footnotes:
  - marker: a
    text: Or 'many from among the Judeans had come to Martha and Mary.' The Greek term can denote Jews generally or, in some contexts in John, Judeans more specifically.
    reason: alternative_reading
translation:
  language: ko
  text: 유대인들[a] 가운데 많은 사람이 마르다와 마리아에게 와서 그들의 형제의 일로 그들을 위로하려고 와 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다인들’. 요한복음에서 Ἰουδαῖοι는 일반적인 유대인을 가리킬 수도 있고, 문맥에 따라 더 구체적으로 유다인을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  english_pob_choice: Now many
  chosen_korean: 이제 유대인들 가운데 많은 사람
  alternatives_korean:
  - 그리고 많은 사람
  - 그런데 많은 사람
  lexicon: BDAG
  rationale: δέ의 약한 연결을 자연스러운 서술 전환으로 살려 ‘이제’로 옮기고, πολλοί는 수량감이 드러나도록 ‘많은 사람’으로 표현했습니다.
- source_word: ἐκ τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인들 가운데
  alternatives_korean:
  - 유대인들의
  - 유대인들 중에서
  - 유다인들 가운데
  lexicon: BDAG
  rationale: 부분성을 드러내는 ἐκ + 속격을 한국어의 ‘가운데’로 옮겨, 단순 소속보다 ‘그들 중 일부’라는 뜻이 보이게 했습니다.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  english_pob_choice: to comfort them
  chosen_korean: 위로하고 있었습니다
  alternatives_korean:
  - 위로하려고 왔습니다
  - 그들을 위로하려 했습니다
  lexicon: BDAG
  rationale: παραμυθέομαι의 뜻을 ‘위로하다’로 살리고, 목적절을 한국어의 자연스러운 진행상으로 풀어 장례식 문맥의 돌봄 행위를 드러냈습니다.
- source_word: περὶ τοῦ ἀδελφοῦ
  english_pob_choice: about their brother
  chosen_korean: 그들의 형제를
  alternatives_korean:
  - 그들의 오빠를
  - 그들의 남동생을
  lexicon: BDAG
  rationale: 본문은 마르다와 마리아의 공통된 형제를 가리키므로 관계를 분명히 하되, 한국어에서는 목적어를 보충해 ‘형제를 위로하다’라는 의미가 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: Ἰουδαίων의 번역 선택
  chosen_reading: 유대인들
  alternative_readings:
  - 유다인들
  - 유대 사람들
  rationale: 요한복음에서 Ἰουδαῖοι는 문맥에 따라 넓은 민족·종교적 범주로도 쓰이므로, 이 절의 단순한 조문 상황에는 ‘유대인들’이 가장 무리 없는 번역입니다.
  doctrine_reference: 'Translation philosophy: 원문 우선, 문맥적 다의성은 불필요하게 해소하지 않는다.'
