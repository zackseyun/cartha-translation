  source_fidelity: 원문의 미완료과거완료(ἐληλύθεισαν)는 방문자들이 이미 와 있던 상태를 나타내며, 목적절(ἵνα παραμυθήσωνται)은 그들이 위로하려고 왔다는 목적을 나타냅니다. 초안의 ‘위로하고 있었습니다’는 목적을 실제 진행 행위로 바꾸므로 수정이 필요합니다. 또한 δέ는 ‘이제’라는 시간 부사를 요구하지 않습니다.
  naturalness: ‘마르다와 마리아에게 … 와 있었습니다’와 ‘그들의 형제의 일로 위로하려고’는 현대 표준 한국어 합쇼체에서 자연스럽고, 성별·연령이 불명확한 ἀδελφός를 ‘형제’로 보존합니다.
