  to: 유대인들[a] 가운데 많은 사람이 마르다와 마리아에게 와서 그들의 형제의 일로 그들을 위로하려고 와 있었습니다.
  rationale: 시간 부사 ‘이제’를 제거하여 δέ의 약한 연결 기능을 과도하게 해석하지 않았습니다. ‘와서 … 위로하고 있었습니다’를 ‘… 위로하려고 와 있었습니다’로 고쳐, 이미 와 있던 상태와 방문 목적을 함께 반영했습니다. ‘그들의 형제의 일로’는 περί의 ‘~에 관하여/말미암아’라는 범위를 자연스럽게 살리면서 형제의 죽음을 본문보다 앞서 명시하지 않습니다.
  reviewer_model: gpt-5.6-terra
