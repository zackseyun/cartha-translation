  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘마지막 날에 있는 부활 때에’는 원문의 두 전치사구를 기계적으로 겹쳐 놓아 한국어로 부자연스럽고, ‘마지막 날’과 ‘부활’의 결합 관계도 흐립니다. ‘마지막 날의 부활 때에’는 ἐν τῇ ἀναστάσει와 ἐν τῇ ἐσχάτῃ ἡμέρᾳ를 자연스럽게 함께 보존합니다.
  naturalness: ‘마르다가 그에게 말했습니다’와 ‘나는 … 압니다’는 현대 표준어 합쇼체에 자연스럽습니다. 다만 기존의 ‘마지막 날에 있는 부활 때에’는 현대 한국어 관용에 맞지 않아 수정이 필요합니다.
  terminology: ‘부활’, ‘마지막 날’, ‘다시 살아나다’는 본문의 종말론적 부활 언어를 적절히 전달합니다. 각주도 본문의 ‘마지막 날’을 보존하도록 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ‘마지막 날에 있는 부활 때에’가 비자연스럽고 수식 관계가 불명확합니다.
    rationale: 원문의 ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ는 부활과 마지막 날을 함께 지시합니다. 한국어에서는 ‘마지막 날의 부활 때에’가 이 시간적·종말론적 관계를 자연스럽게 나타냅니다.
  - severity: medium
    issue: 각주 ‘또는 “부활 때에”’가 원문 및 영어 감사 기록의 대안을 충분히 반영하지 못합니다.
    rationale: 대안 표현에도 ‘마지막 날’이 포함되어야 의미 범위가 축소되지 않습니다. ‘마지막 날에 부활할 때에’는 한국어에서 가능한 대안적 구문입니다.
  revised_text: 마르다가 그에게 말했습니다. “나는 그가 마지막 날의 부활 때에 다시 살아나리라는 것을 압니다.”[a]
