lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말합니다
  lexicon: SBLGNT
  rationale: 헬라어 역사적 현재는 한국어 서술에서는 자연스러운 과거형으로 옮기는 것이 대화 문맥을 가장 잘 살립니다.
- source_word: αὐτῷ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그분에게
  lexicon: BDAG
  rationale: 여격 인칭대명사는 직접목적·간접목적 관계를 드러내는 한국어 조사구로 옮기는 것이 가장 자연스럽습니다.
- source_word: Οἶδα
  english_pob_choice: I know
  chosen_korean: 나는 … 압니다
  alternatives_korean:
  - 나는 … 알고 있습니다
  - 나는 … 확신합니다
  lexicon: BDAG
  rationale: 지식/확신을 나타내는 단정적 표현을 살리되, 마르다의 진술을 현대 한국어에서 자연스럽게 전달했습니다.
- source_word: ἀναστήσεται / ἀνάστασις
  english_pob_choice: he will rise again / in the resurrection
  chosen_korean: 다시 살아나리라는 것 / 부활 때에
  alternatives_korean:
  - 다시 일어나리라는 것 / 부활에서
  - 부활 가운데서
  lexicon: BDAG
  rationale: 동사 ἀναστήσεται는 부활 문맥에서 단순한 '일어남'보다 '다시 살아남'이 의미를 더 정확히 드러냅니다. ἐν τῇ ἀναστάσει는 POB의 'in the resurrection'을 반영하되, 한국어에서는 시간·국면을 나타내는 '때에'로 자연스럽게 풀었습니다.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  english_pob_choice: on the last day
  chosen_korean: 마지막 날에
  alternatives_korean:
  - 끝날에
  - 최후의 날에
  lexicon: BDAG
  rationale: 종말론적 관용구를 현대 한국어의 가장 직접적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 부활 문구의 종말론적 범위
  chosen_reading: 마르다는 막연한 사후 생존이 아니라 마지막 날의 부활을 말합니다.
  alternative_readings:
  - 단순한 위로의 진술
  - 영적인 재생에 대한 말
  rationale: '''부활''과 ''마지막 날''이 함께 있어 종말론적 육체 부활의 지시가 분명하므로, 그 구체성을 유지했습니다.'
  doctrine_reference: Affirmations; John 11 문맥
