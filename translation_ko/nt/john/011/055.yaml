revisions:
- from: 그때는 유대인의 유월절이 가까웠습니다. 그래서 많은 사람이 시골에서 예루살렘으로 유월절 전에 올라와 자신을 정결하게 하였습니다.[a][b]
  to: 유대인의 유월절[b]이 가까웠습니다. 많은 사람이 유월절 전에 자신을 정결하게 하려고[a] 시골에서 예루살렘으로 올라갔습니다.
  rationale: 원문의 배경 진술과 약한 연결을 자연스럽게 보존하면서, ‘올라갔다’의 과거 사건과 ‘정결하게 하려고’의 목적 관계를 분명히 했습니다. 의례적 정결이라는 역사적 의미는 본문과 각주로 유지하되, 완료 여부나 후대 신학적 의미를 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:23:06Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ἦν의 배경적 미완료를 ‘그때는’으로 과도하게 풀고, δέ를 ‘그래서’라는 인과 관계로 옮겼습니다. 또한 ἵνα 목적절을 완료된 행위(‘정결하게 하였습니다’)로 처리하여, 올라간 목적이라는 원문의 관계가 약화되었습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, ‘예루살렘으로 올라갔습니다’는 순례 이동의 관용적 표현과 원문의 ἀνέβησαν을 잘 반영합니다.
  terminology: ‘유대인의 유월절’ 및 ‘자신을 정결하게 하려고’는 각각 τὸ πάσχα τῶν Ἰουδαίων과 의례적 의미의 ἁγνίσωσιν ἑαυτούς를 적절히 보존합니다. 각주 표지도 해당 표현 바로 뒤에 배치했습니다.
  issues:
  - severity: medium
    issue: ‘그래서’가 δέ를 인과 접속으로 번역함
    rationale: δέ는 여기서 약한 연결사이며, 앞 문장과의 명시적 인과를 나타내지 않습니다.
  - severity: high
    issue: 목적절을 ‘자신을 정결하게 하였습니다’로 번역함
    rationale: ἵνα ἁγνίσωσιν은 예루살렘에 올라간 목적을 나타냅니다. 실제 정결 행위가 이미 완료되었다고 단정하지 않아야 합니다.
  - severity: low
    issue: ‘그때는’의 첨가
    rationale: 원문에는 시간 부사 ‘그때’가 없으므로, 배경 서술을 불필요하게 특정하지 않는 편이 더 충실합니다.
  revised_text: 유대인의 유월절[b]이 가까웠습니다. 많은 사람이 유월절 전에 자신을 정결하게 하려고[a] 시골에서 예루살렘으로 올라갔습니다.
