id: JHN.11.55
reference: John 11:55
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: Now the Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
  footnotes:
  - marker: a
    text: Or 'the Jewish Passover.' The Greek more literally reads 'the Passover of the Jews,' a recurring expression in John.
    reason: lexical_alternative
  - marker: b
    text: That is, to undergo ritual purification in preparation for the Passover.
    reason: cultural_note
translation:
  language: ko
  text: 그때는 유대인의 유월절이 가까웠습니다. 그래서 많은 사람이 시골에서 예루살렘으로 유월절 전에 올라와 자신을 정결하게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 유월절을 앞두고 행하는 의례적 정결입니다.
    reason: cultural_note
  - marker: b
    text: ‘유대인의 유월절’은 헬라어의 ‘유대인들의 유월절’을 비교적 직접적으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  english_pob_choice: the Passover of the Jews
  chosen_korean: 유대인의 유월절
  alternatives_korean:
  - 유대인들의 유월절
  - 유대인의 파스카
  lexicon: BDAG
  rationale: 문법적으로는 ‘유대인의 유월절’이 소유격 구조를 가장 자연스럽게 옮기며, 한국어 독자가 이해하기도 쉽습니다. POB의 본문 의미는 보존하되, 한국어에서는 과도하게 낯선 직역보다 명료성을 우선했습니다.
- source_word: ἀνέβησαν
  english_pob_choice: went up
  chosen_korean: 올라와
  alternatives_korean:
  - 올라갔습니다
  - 갔습니다
  lexicon: BDAG
  rationale: 예루살렘으로의 순례 이동은 ‘올라가다’가 지리적·관용적 뉘앙스를 함께 살립니다. 본문 동사의 상승 이미지를 유지했습니다.
- source_word: ἐκ τῆς χώρας
  english_pob_choice: from the countryside
  chosen_korean: 시골에서
  alternatives_korean:
  - 시골 지역에서
  - 시골들에서
  - 농촌에서
  lexicon: BDAG
  rationale: χώρα는 도시 예루살렘과 대조되는 주변 거주지를 가리키므로 ‘시골’이 가장 자연스럽습니다. 현대 한국어에서 읽기 쉽게 하되 대조 구조는 유지했습니다.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  english_pob_choice: to purify themselves
  chosen_korean: 자신을 정결하게 하였습니다
  alternatives_korean:
  - 자신을 정결하게 하려고 했습니다
  - 자신을 깨끗하게 하였습니다
  - 자신을 의식적으로 정결하게 하였습니다
  lexicon: BDAG
  rationale: ἁγνίζω는 여기서 유월절 준비를 위한 의례적 정결을 뜻하므로 ‘정결하게 하다’가 가장 정확합니다. ‘깨끗하게 하다’보다 종교적·의례적 의미가 분명합니다.
theological_decisions:
- issue: 유월절 전 정결 행위의 성격
  chosen_reading: 본문의 정결은 도덕적 자기개선이 아니라 유월절 참여를 앞둔 유대적 의례 정결로 옮겼습니다.
  alternative_readings:
  - 자신을 깨끗하게 하였습니다
  - 자신을 성결하게 하였습니다
  rationale: 문맥상 제의적 준비를 나타내므로, 후대 기독교적 내적 성화 개념으로 읽히지 않도록 ‘정결하게’로 제한했습니다. 이는 요한복음의 역사적 유대 배경을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
