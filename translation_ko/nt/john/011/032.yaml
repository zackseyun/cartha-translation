id: JHN.11.32
reference: John 11:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
  footnotes:
  - marker: a
    text: Or "Sir." The Greek κύριε can be a respectful form of address, but here it is rendered "Lord" in keeping with the project's default for κύριος and the Gospel's portrayal of Jesus.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 마리아가 예수께서 계시던 곳에 와서 그분을 보고 그분의 발 아래 엎드리며 그분께 말했습니다. 「주님, 주님께서 여기 계셨더라면 내 형제는 죽지 않았을 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ οὖν Μαριὰμ ὡς ἦλθεν
  english_pob_choice: So when Mary came
  chosen_korean: 그래서 마리아가 와서
  alternatives_korean:
  - 그러므로 마리아가 왔을 때
  - 그때 마리아가 와서
  lexicon: BDAG
  rationale: οὖν의 진행/결과 연결을 한국어의 ‘그래서’로 자연스럽게 살리고, ὡς + aorist의 시간적 도입을 ‘와서’로 간결하게 표현했습니다.
- source_word: ὅπου ἦν Ἰησοῦς
  english_pob_choice: where Jesus was
  chosen_korean: 예수께서 계시던 곳에
  alternatives_korean:
  - 예수께서 계신 곳에
  - 예수님이 계시던 곳에
  lexicon: BDAG
  rationale: 단순한 장소절이므로 ‘곳에’로 옮겼고, 과거 서술의 흐름에 맞게 ‘계시던’으로 처리했습니다.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  english_pob_choice: she fell at his feet
  chosen_korean: 그분의 발 아래 엎드리며
  alternatives_korean:
  - 그분의 발 앞에 쓰러지며
  - 그분의 발치에 엎드리며
  lexicon: BDAG
  rationale: 문맥상 예수 앞에서의 몸을 낮춤을 나타내므로, 한국어에서 자연스럽고 경건한 동작을 드러내는 ‘엎드리다’로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인이여
  - 선생님
  lexicon: BDAG
  rationale: 본문의 κύριε는 예수께 대한 호칭이며, 프로젝트 기본값에 따라 ‘주님’으로 옮겨 존칭과 신학적 무게를 유지했습니다.
- source_word: οὐκ ἄν ... ἀπέθανεν
  english_pob_choice: would not have died
  chosen_korean: 죽지 않았을 것입니다
  alternatives_korean:
  - 죽지 않았을 텐데요
  - 죽지 않았을 것입니다
  lexicon: BDAG
  rationale: 사실과 반대되는 과거 조건문의 결과를 한국어 관용법으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 마리아의 예수 호칭을 ‘주님’으로 유지할지 여부
  chosen_reading: 주님
  alternative_readings:
  - 주인님
  - 선생님
  rationale: 요한복음에서 예수께 대한 κύριε는 단순한 예의보다 더 큰 존칭을 띨 수 있으므로, 평이화하지 않고 ‘주님’으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
