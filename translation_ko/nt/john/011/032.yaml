  naturalness: 현행 문장은 이해되지만 ‘그분의 발 아래’는 예수의 발 밑이라는 공간적 의미로 들릴 수 있습니다. ‘그분의 발치에 엎드려’가 현대 표준어에서 자연스럽고 문맥에 알맞습니다.
  terminology: Κύριε를 ‘주님’으로 옮긴 것은 프로젝트 용례 및 본문 문맥에 적절합니다. 영어 POB의 대안 가능성을 반영하는 주석을 해당 호칭에 붙이는 것이 감사 추적과 의미 범위 보존에 유익합니다.
