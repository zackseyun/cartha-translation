revisions:
- from: 그래서 마리아가 예수께서 계시던 곳에 와서 그분을 보고 그분의 발 아래 엎드리며 그분께 말했습니다. 「주님, 주님께서 여기 계셨더라면 내 형제는 죽지 않았을 것입니다.」
  to: 그래서 마리아가 예수께서 계시던 곳에 와서 그분을 보고 그분의 발치에 엎드려 그분께 말했습니다. 「주님[a], 주님께서 여기 계셨더라면 내 형제는 죽지 않았을 것입니다.」
  rationale: ‘발 아래’를 ‘발치에’로 고쳐 예수의 발 앞에 엎드린 동작이라는 원문의 관용적 의미를 정확히 반영했습니다. 또한 ‘엎드리며’를 ‘엎드려’로 고쳐 서사 속 연속된 완료 동작을 자연스럽게 표현했습니다. ‘주님’은 유지하고, 영어 POB 감사 기록의 호칭 대안성을 한국어 각주로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:48Z'
