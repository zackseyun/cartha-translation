id: JHN.11.11
reference: John 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
  footnotes:
  - marker: a
    text: Or, more explicitly, “has died.” Jesus uses sleep figuratively for death here; the disciples initially misunderstand him in the following verses.
    reason: alternative_reading
translation:
  language: ko
  text: 이러한 말씀을 하신 뒤에, 그들에게 말씀하셨습니다. 「우리의 친구 나사로가 잠들었습니다. 그러나 내가 가서 그를 깨우겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 명시적으로는 “죽었습니다”입니다. 예수님께서는 여기서 죽음을 잠에 빗대어 비유적으로 말씀하십니다. 제자들은 이어지는 절들에서 처음에는 이를 오해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει
  english_pob_choice: After saying these things, he said
  chosen_korean: 이러한 말씀을 하신 뒤에 그들에게 말씀하셨습니다
  alternatives_korean:
  - 이런 것들을 말씀하신 뒤에 그들에게 말씀하셨습니다
  - 그 말씀들을 하신 뒤에 그들에게 말씀하셨습니다
  lexicon: SBLGNT
  rationale: ταῦτα는 앞선 담화를 가리키는 복수 지시어이므로 ‘이러한 말씀들’의 의미를 살리되, 한국어에서는 자연스러운 완결형으로 정리했습니다. 역사적 현재 λέγει는 서술체에 맞게 과거형으로 옮겼습니다.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  english_pob_choice: Lazarus our friend
  chosen_korean: 나사로, 우리의 친구가
  alternatives_korean:
  - 우리의 친구 나사로가
  - 우리 친구 나사로가
  lexicon: BDAG
  rationale: 호격적 강조와 관계성을 살리기 위해 이름을 먼저 두고, ὁ φίλος ἡμῶν은 소유격적 관계를 그대로 반영해 ‘우리의 친구’로 옮겼습니다.
- source_word: κεκοίμηται
  english_pob_choice: has fallen asleep
  chosen_korean: 잠들었습니다
  alternatives_korean:
  - 잠들어 있습니다
  - 잠이 들었습니다
  - 죽었습니다
  lexicon: BDAG
  rationale: 본문은 죽음을 ‘잠’으로 비유하므로, 해석을 앞당겨 ‘죽었습니다’로 풀지 않고 비유를 한국어로 자연스럽게 보존했습니다. 시제감은 현재완료적 뉘앙스로 ‘잠들었습니다’에 담았습니다.
- source_word: πορεύομαι ἵνα ἐξυπνίσω αὐτόν
  english_pob_choice: I am going so that I may wake him up
  chosen_korean: 내가 가서 그를 깨우겠습니다
  alternatives_korean:
  - 내가 가서 그를 깨우도록 하겠습니다
  - 내가 가서 그를 깨우러 가겠습니다
  lexicon: BDAG
  rationale: ἵνα의 목적 의미는 한국어에서 종종 목적절보다 의도 표현으로 자연스러워 ‘가서 … 깨우겠습니다’로 옮겼습니다. ἐξυπνίσω는 잠의 비유를 유지하면서도 자연스럽게 ‘깨우다’로 처리했습니다.
theological_decisions:
- issue: κεκοίμηται의 비유를 본문에서 설명으로 바꿀지 여부
  chosen_reading: 주요 본문에서는 ‘잠들었습니다’로 비유를 유지했습니다.
  alternative_readings:
  - 죽었습니다
  - 잠들어 죽었습니다
  rationale: 예수님의 의도적 비유와 이어지는 제자들의 오해를 보존하기 위해, 본문은 해석을 조기 확정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
