review_pass:
  verdict: revise
  source_fidelity: ἀπέστειλαν은 ‘보내다’이며, 본문은 전달자를 명시하지 않습니다. 따라서 ‘사람을 보내어’는 가능한 상황을 구체화하지만 원문에 없는 ‘사람’을 추가합니다. ‘전갈을 보내어’는 πρὸς αὐτὸν λέγουσαι의 메시지 전달 기능을 자연스럽게 살리면서 그 추가를 피합니다. 나머지는 Κύριε, ἴδε, ὃν φιλεῖς, ἀσθενεῖ를 충실히 반영합니다.
  naturalness: 합쇼체의 ‘말했습니다’, ‘보십시오’, ‘주님께서’는 일관되고 자연스럽습니다. ‘전갈을 보내어 말했습니다’는 서사 문맥에서 자연스러운 현대 표준어입니다.
  terminology: ‘누이들’은 가족 관계를, ‘주님’은 Κύριε에 대한 정중한 호칭을 적절히 드러냅니다. φιλεῖς를 ‘사랑하시는’으로 옮긴 것은 문맥상 안전하며, 신학적 의미를 과도하게 확정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘사람을 보내어’가 원문에 없는 전달자를 명시합니다.
    rationale: ἀπέστειλαν은 단순히 ‘보냈다’이고, 누구를 보냈는지는 본절에서 말하지 않습니다. 영어 POB의 ‘sent word’ 및 원문의 메시지 전달 구조에 맞게 ‘전갈을 보내어’로 옮기는 편이 더 정확합니다.
  revised_text: 누이들이 그에게 전갈을 보내어 말했습니다. “주님, 보십시오. 주님께서 사랑하시는 이가 병들었습니다.”
