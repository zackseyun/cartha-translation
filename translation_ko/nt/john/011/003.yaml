id: JHN.11.3
reference: John 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: ko
  text: 누이들이 그에게 사람을 보내어 말했습니다. “주님, 보십시오. 주님께서 사랑하시는 이가 병들었습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτὸν
  english_pob_choice: sent word to him
  chosen_korean: 그에게 사람을 보내어
  alternatives_korean:
  - 그에게 전갈을 보내어
  - 그에게 소식을 전하여
  lexicon: ἀποστέλλω
  rationale: 문맥상 단순히 ‘말하다’가 아니라 메시지를 전달하기 위해 사람을 보내는 동작을 드러내야 하므로, 한국어에서도 자연스러운 ‘사람을 보내어’로 옮겼습니다.
- source_word: αἱ ἀδελφαὶ
  english_pob_choice: the sisters
  chosen_korean: 누이들이
  alternatives_korean:
  - 자매들이
  - 언니들이
  lexicon: ἀδελφή
  rationale: 마르다와 마리아를 가리키는 가족관계를 살리기 위해 ‘누이들’이 가장 자연스럽고 본문 정보에 충실합니다.
- source_word: ἴδε
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보십시오, 보아라
  lexicon: ἴδε
  rationale: ἐίδε/ἴδε의 주의 환기 기능을 살리면서도, 주님께 드리는 말로서 정중한 호소를 유지하기 위해 ‘보십시오’로 옮겼습니다.
- source_word: ὃν φιλεῖς
  english_pob_choice: the one you love
  chosen_korean: 주님께서 사랑하시는 이
  alternatives_korean:
  - 주님이 사랑하시는 사람
  - 주님께서 아끼시는 이
  lexicon: φιλέω
  rationale: φιλέω의 애정적 사랑을 ‘사랑하시는’으로 직접 반영하되, 대상 지시를 한국어에서 자연스럽게 하기 위해 ‘이’를 사용했습니다.
theological_decisions:
- issue: 예수에 대한 호칭을 어떻게 처리할지
  chosen_reading: ‘주님’으로 번역해, 제자적 호소의 경어를 유지했습니다.
  alternative_readings:
  - ‘주’
  - ‘선생님’
  rationale: 본문의 Κύριε는 단순 호칭이 아니라 예수께 드리는 정중한 호출이므로, 한국어 독자에게도 그 경외와 간구의 뉘앙스를 분명하게 전달하는 ‘주님’이 적절합니다.
  doctrine_reference: Korean register and Christological address in Johannine narrative
