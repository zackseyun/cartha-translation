- from: 그는 이것을 자기 자신에게서 말한 것이 아니었습니다. 그러나 그해 대제사장으로서, 예수께서 그 민족을 위해 죽으실 것이라고 예언한 것입니다.[a][b][c]
  to: 그는 이것을 자기 뜻으로 말한 것이 아니었습니다[a]. 그러나 그해 대제사장으로서 예수께서 그 민족을 위해[c] 죽으실[b] 것이라고 예언했습니다.
  rationale: 자연스럽지 않은 직역을 현대 표준 한국어로 바로잡고, 예언 행위를 명료한 합쇼체 서술로 처리했습니다. 본문은 ‘그 민족을 위해’로 ὑπέρ의 의미 폭을 유지했으며, 더 강한 대리 의미는 각주에만 남겼습니다. 각주 표지도 각각의 관련 어구에 직접 연결했습니다.
