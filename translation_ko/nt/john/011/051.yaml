id: JHN.11.51
reference: John 11:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: Now he did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
  footnotes:
  - marker: a
    text: Or 'on his own' for 'from himself.'
    reason: lexical_alternative
  - marker: b
    text: Or 'was going to die' or 'was destined to die.'
    reason: lexical_alternative
  - marker: c
    text: Or 'on behalf of the nation.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 이것을 자기 자신에게서 말한 것이 아니었습니다. 그러나 그해 대제사장으로서, 예수께서 그 민족을 위해 죽으실 것이라고 예언한 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽게 될 것’ 혹은 ‘죽도록 정해졌을 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 민족을 대신하여’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν
  english_pob_choice: he did not say this from himself
  chosen_korean: 이것을 자기 자신에게서 말한 것이 아니었습니다
  alternatives_korean:
  - 이것을 스스로 말한 것이 아니었습니다
  - 이것을 자기 뜻으로 말한 것이 아니었습니다
  lexicon: BDAG
  rationale: ἀφ’ ἑαυτοῦ는 말의 출처가 자기 자신이 아님을 뜻하므로, 직역을 살리되 한국어에서 자연스럽게 ‘자기 자신에게서’로 옮겼습니다.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  english_pob_choice: being high priest that year
  chosen_korean: 그해 대제사장으로서
  alternatives_korean:
  - 그해 대제사장이었기에
  - 그해 대제사장인 채로
  lexicon: BDAG
  rationale: 분사구는 이유와 배경을 함께 담으므로, 원문의 배경적 설명을 유지하는 ‘-으로서’로 자연스럽게 처리했습니다.
- source_word: ἐπροφήτευσεν
  english_pob_choice: he prophesied
  chosen_korean: 예언한 것입니다
  alternatives_korean:
  - 예언했습니다
  - 예언한 바입니다
  lexicon: BDAG
  rationale: 동사 ἐπροφήτευσεν의 직접적 의미를 살려, 단순 발언이 아니라 실제 예언 행위였음을 분명히 했습니다.
- source_word: ἔμελλεν Ἰησοῦς ἀποθνῄσκειν
  english_pob_choice: Jesus was going to die
  chosen_korean: 예수께서 죽으실 것이라고
  alternatives_korean:
  - 예수께서 죽게 되실 것이라고
  - 예수께서 곧 죽으실 것이라고
  lexicon: BDAG
  rationale: μέλλω는 임박성을 포함할 수 있지만 여기서는 단정적 미래를 담는 표현이 자연스러워, 과도한 ‘곧’은 피하고 ‘-실 것’으로 옮겼습니다.
- source_word: ὑπὲρ τοῦ ἔθνους
  english_pob_choice: for the nation
  chosen_korean: 그 민족을 위해
  alternatives_korean:
  - 그 민족을 위하여
  - 그 민족을 대신하여
  lexicon: BDAG
  rationale: ὑπέρ는 대표·유익의 폭이 있으므로 본문은 넓게 ‘위해’로 두어, 대속적 의미를 과잉 특정하지 않도록 했습니다.
theological_decisions:
- issue: 대제사장 직분과 예언의 관계
  chosen_reading: 카이아파스의 말은 그 자신의 의도에서 나온 것이 아니면서도, 그해 대제사장이라는 직분 때문에 실제 예언으로 기능했습니다.
  alternative_readings:
  - 단지 아이러니한 말로만 이해하는 읽기
  - 카이아파스가 자신의 뜻과 무관하게 성령의 직접 영감을 의식적으로 받았다는 읽기
  rationale: 본문은 ‘예언했다’고 분명히 말하므로 그 예언성을 유지하되, 그의 내적 인식이나 도덕적 승인까지는 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §3; John 11:51 audit trail
- issue: ὑπὲρ의 신학적 범위
  chosen_reading: 본문의 ‘위해’는 대표·유익의 넓은 의미를 유지하며, 주해적 여백을 남깁니다.
  alternative_readings:
  - 그 민족을 대신하여
  - 그 민족을 위한 속죄로
  rationale: 이 절만으로 대속 공식 전체를 규정하지 않도록, 원문의 폭을 유지하는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §3
