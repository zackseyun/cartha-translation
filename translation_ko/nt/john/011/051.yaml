  source_fidelity: 원문의 대조(δὲ), 발언의 출처를 나타내는 ἀφ’ ἑαυτοῦ, 그해 대제사장이라는 배경, 예언의 내용, 그리고 ὑπὲρ의 넓은 유익·대표 의미를 대체로 충실히 반영합니다. 다만 ‘자기 자신에게서 말한’은 한국어에서 부자연스럽고, ‘예언한 것입니다’는 이 문맥에서 서술 종결로 매끄럽지 않습니다.
