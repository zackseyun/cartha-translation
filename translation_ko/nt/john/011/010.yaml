id: JHN.11.10
reference: John 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
  footnotes:
  - marker: a
    text: Or 'the light is not with him.' The Greek more literally says 'in him,' which may suggest more than the absence of external light.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 누구든지 밤에 걸으면 걸려 넘어집니다. 빛이 그 안에 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 안에’는 헬라어의 ἐν αὐτῷ를 따른 것으로, 단순히 외부의 빛이 없다는 뜻보다 더 깊은 내적 의미를 암시할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  english_pob_choice: But if
  chosen_korean: 그러나 ...면
  alternatives_korean:
  - 그런데 ...면
  - 하지만 ...이면
  lexicon: BDAG
  rationale: 앞 절과의 대비를 살리면서 조건문을 자연스러운 한국어로 옮기기 위해 ‘그러나’와 조건 어미를 함께 썼습니다.
- source_word: περιπατῇ
  english_pob_choice: walks
  chosen_korean: 걸으면
  alternatives_korean:
  - 다니면
  - 행하면
  lexicon: BDAG
  rationale: 직역의 걸음 이미지를 유지하면서도 문맥상 지속적 삶의 방식까지 담을 수 있는 표현으로 ‘걸으면’을 택했습니다.
- source_word: προσκόπτει
  english_pob_choice: stumbles
  chosen_korean: 걸려 넘어집니다
  alternatives_korean:
  - 넘어집니다
  - 비틀거립니다
  lexicon: BDAG
  rationale: 단순히 ‘넘어지다’보다 원문의 걸림과 넘어짐의 이미지를 함께 드러내는 표현입니다.
- source_word: τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ
  english_pob_choice: the light is not in him
  chosen_korean: 빛이 그 안에 없습니다
  alternatives_korean:
  - 빛이 그와 함께 있지 않습니다
  - 빛이 그 속에 없습니다
  lexicon: BDAG
  rationale: 영어 POB가 보존한 ‘in him’의 내적 표현을 한국어에서도 그대로 살려, 외적 조명 부재로만 축소하지 않았습니다.
theological_decisions:
- issue: ‘그 안에’의 내적 의미 유지
  chosen_reading: 외부에 빛이 없다는 뜻으로 풀지 않고, 빛이 그 사람 안에 없다는 직설적 표현을 유지했습니다.
  alternative_readings:
  - 그에게 빛이 없다는 단순 상황 설명
  - 그와 함께 빛이 없다는 외적 조건 설명
  rationale: 요한복음의 빛/어둠 이미지는 단순 환경 설명을 넘어 내적 상태를 가리킬 수 있으므로, 해석을 미리 좁히지 않는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
