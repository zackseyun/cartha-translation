id: JHN.11.9
reference: John 11:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
  footnotes:
  - marker: a
    text: Or 'twelve hours of the day.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the light of this world' may carry broader Johannine resonance about divine illumination, though the wording here is left untranslated as stated.
    reason: cross_reference
  - marker: c
    text: Greek has the representative singular 'anyone ... he.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하셨습니다. “낮에는 열두 시간이 있지 않습니까?[a] 누구든지[c] 낮에 걸어 다니면 걸려 넘어지지 않습니다. 이 세상의 빛을[b] 보기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낮에는’은 문자적으로는 ‘낮의 열두 시간’ 또는 ‘낮의 열두 시간들’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 세상의 빛’은 요한복음에서 자주 보이는 상징적 표현일 수 있으나, 여기서는 본문의 문구를 그대로 옮겼습니다.
    reason: cross_reference
  - marker: c
    text: 헬라어는 대표적 단수 표현을 사용하여 ‘누구든지 … 그는’의 형태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 대답하셨다
  - 응답하셨습니다
  lexicon: SBLGNT
  rationale: 서사에서의 자연스러운 응답 동사를 합쇼체로 옮겼습니다. 예수의 발화 도입을 과도하게 격식화하지 않으면서도 문맥에 맞게 분명하게 전달합니다.
- source_word: Οὐχὶ δώδεκα ὧραί εἰσιν τῆς ἡμέρας;
  english_pob_choice: Are there not twelve hours in the day?
  chosen_korean: 낮에는 열두 시간이 있지 않습니까?
  alternatives_korean:
  - 낮의 시간이 열두 시간이 아닙니까?
  - 한낮에 열두 시간이 있지 않습니까?
  lexicon: SBLGNT
  rationale: 반문이 기대하는 긍정의 답을 살리면서, τῆς ἡμέρας를 한국어의 자연스러운 시간 표현인 '낮에는'로 옮겼습니다. '낮의 시간'보다 간결하고 의미가 분명합니다.
- source_word: ἐάν τις περιπατῇ
  english_pob_choice: If anyone walks
  chosen_korean: 누구든지 낮에 걸어 다니면
  alternatives_korean:
  - 누구든지 낮에 걸으면
  - 어떤 사람이 낮에 걸어 다니면
  lexicon: SBLGNT
  rationale: 일반적·대표적 조건을 한국어의 '누구든지'로 살렸고, περιπατῇ의 동작성을 반영해 '걸어 다니면'으로 옮겼습니다.
- source_word: οὐ προσκόπτει
  english_pob_choice: he does not stumble
  chosen_korean: 넘어지지 않습니다
  alternatives_korean:
  - 실족하지 않습니다
  - 걸려 넘어지지 않습니다
  lexicon: SBLGNT
  rationale: 직역의 '실족하다'는 종교적 관용성이 강해 일상적 비유의 힘이 약해질 수 있어, 문맥상 자연한 '넘어지다'로 옮겼습니다. 다만 비유의 의미를 해치지 않도록 반문적 논리 흐름은 유지했습니다.
- source_word: τὸ φῶς τοῦ κόσμου τούτου
  english_pob_choice: the light of this world
  chosen_korean: 이 세상의 빛
  alternatives_korean:
  - 이 세상의 빛
  - 세상의 빛
  lexicon: SBLGNT
  rationale: 영문 POB처럼 해석을 덧붙이지 않고 원문의 관용구를 그대로 유지했습니다. '이 세상의 빛'은 문맥의 상징성을 열어 두면서도 직설적입니다.
theological_decisions:
- issue: '''빛''의 요한적 상징성을 본문에서 얼마나 드러낼지'
  chosen_reading: 주석 없이 본문에서는 '이 세상의 빛'을 그대로 두어 상징적 가능성을 열어 둡니다.
  alternative_readings:
  - 예수나 신적 인도를 직접 가리키는 것으로 풀어 쓰기
  - '''세상의 빛''이라고 일반화해 버리기'
  rationale: 이 절은 격언처럼 들리는 예수의 답변 안에서 빛의 이미지를 사용하지만, 본문 자체는 그 의미를 즉시 해설하지 않습니다. 따라서 번역은 문구를 보존하고 신학적 해석은 독자에게 남겨 둡니다.
  doctrine_reference: 본문이 허용하는 긴장을 유지합니다.
