id: JHN.2.8
reference: John 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
  footnotes:
  - marker: a
    text: Or, “the headwaiter” or “the steward.” The Greek term refers to the person in charge of the banquet.
    reason: lexical_alternative
  - marker: b
    text: Or, “And they brought it.” The Greek verb can be rendered either way depending on English perspective.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. 「지금 물을 떠서 연회 책임자[a]에게 가져가십시오.」 그들은 가져갔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “수석 시종”, “상차림 책임자(주최자)” 등으로 번역할 수 있습니다. 그리스어 어휘는 연회를 총괄하는 담당자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 혹은 “그들이 가져왔다”로 번역할 수 있습니다. 그리스어 동사의 관점(화자의 위치)에 따라 영어·한국어에서 두 가지 관점이 가능함을 반영한 주석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  english_pob_choice: he said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  - 말했다
  lexicon: BDAG
  rationale: 그리스어 현재(역사적 현재)는 서술적 맥락에서 과거 서술로 읽히기도 하므로, 한국어 표준 번역의 서술 문맥에서 자연스러운 합쇼체 과거형 '말씀하셨습니다'를 사용하여 원문의 대화 행위를 유지했습니다.
- source_word: Ἀντλήσατε
  english_pob_choice: Draw some out
  chosen_korean: 물을 떠서
  alternatives_korean:
  - 물을 조금 떠서
  - 물을 떠내어
  lexicon: BDAG
  rationale: aorist 명령형은 물을 떠내는 즉각적 행동을 요구하므로, 영어 POB가 한 것처럼 한국어에서도 암시된 목적어(물)를 명시해 원문의 행위를 분명히 했습니다. '물을 떠서'는 과도한 의역 없이 명령의 즉시성을 전달합니다.
- source_word: ἀρχιτρικλίνῳ
  english_pob_choice: the master of the feast
  chosen_korean: 연회 책임자
  alternatives_korean:
  - 수석 시종
  - 주최자
  - 상차림 책임자
  lexicon: BDAG
  rationale: 원어는 연회 전체를 관리하는 사람을 가리키므로 한국어로 '연회 책임자'라 하여 직무적 성격을 드러냈습니다. 원어의 관직적 뉘앙스를 살리되 과도하게 고어적 표현은 피했습니다. 대안들은 주석[a]에 표기했습니다.
- source_word: οἱ δὲ ἤνεγκαν
  english_pob_choice: So they took it
  chosen_korean: 그들은 가져갔습니다
  alternatives_korean:
  - 그리고 그들이 가져왔습니다
  - 그들이 가져왔다
  lexicon: BDAG
  rationale: δέ는 가벼운 접속어이므로 한국어에서는 간결하게 연결해 '그들은 가져갔습니다'로 번역했습니다. 영어 POB가 지적한 대로 그리스어 동사는 관점에 따라 '가져왔다' 또는 '가져갔다'로 옮길 수 있어 주석[b]을 달았습니다.
theological_decisions:
- issue: 명령문(예수의 말씀) 문체
  chosen_reading: 현대 한국어 합쇼체의 정중한 명령형(가져가십시오) 사용
  alternative_readings:
  - 고전적/문어적 명령형(가져가라)
  - 평서형 축약(가져가)
  rationale: 번역 지침에 따라 본문은 현대 표준 한국어 합쇼체로 일관되게 번역합니다. 예수의 명령은 원문의 즉물적 명령성을 유지하되, 현대 독자에게 문체적 어색함을 주지 않기 위해 정중한 명령형을 사용했습니다. 이는 신학적 의미를 변경하지 않습니다.
  doctrine_reference: translation_style
