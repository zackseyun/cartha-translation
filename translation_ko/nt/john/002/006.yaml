  source_fidelity: 개정이 필요합니다. 원문의 κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων은 항아리들이 유대인의 정결 예식과 관련하여, 곧 그 예식을 위해 놓여 있었다는 뜻을 나타냅니다. 초안의 “이는 … 따라”는 선행 내용 전체를 받는 설명·인과 구문처럼 들려 원문의 수식 관계를 흐립니다. 또한 ἀνά의 분배적 의미는 “각각”으로 명시하는 편이 좋습니다.
  naturalness: “돌로 된 물항아리”와 “놓여 있었습니다”는 자연스럽습니다. 다만 “이는 유대인의 정결 예식에 따라”는 문장 연결이 부자연스럽고, “두세 단위”는 무엇의 단위인지 지나치게 일반적입니다. 고대 단위명 ‘메트레테스’를 본문에 보존하고 주석에서 환산을 설명하면 자연스럽고 정확합니다.
  terminology: “유대인의 정결 예식”은 καθαρισμός과 τῶν Ἰουδαίων을 문맥에 맞게 잘 반영합니다. μετρητής는 일반적인 “단위”보다 음역한 “메트레테스”로 옮겨 특정 고대 액량 단위라는 점을 보존합니다.
