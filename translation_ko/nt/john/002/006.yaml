id: JHN.2.6
reference: John 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: Now there were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
  footnotes:
  - marker: a
    text: Or 'for the purification custom of the Jews'; the phrase refers to ritual cleansing practices.
    reason: lexical_alternative
  - marker: b
    text: A 'measure' (Greek metretēs) was an ancient liquid measure, roughly equivalent to 8–9 gallons or 35–40 liters.
    reason: cultural_note
translation:
  language: ko
  text: 거기에는 돌로 된 물항아리 여섯이 놓여 있었는데, 이는 유대인의 정결 예식에 따라[a] 한 항아리마다 두세 단위씩 담을 수 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '유대인의 정결 관습을 위한 것'으로 읽을 수 있습니다; 이 구절은 의식적인 정결 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 고대의 'μετρητής'는 액량 단위로, 대략 35–40리터(약 8–9갤런) 정도였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: λίθιναι ὑδρίαι
  english_pob_choice: stone water jars
  chosen_korean: 돌로 된 물항아리
  alternatives_korean:
  - 돌항아리
  - 석(石) 항아리
  - 물단지
  lexicon: BDAG
  rationale: λίθιναι은 재질('돌')을, ὑδρίαι는 물을 담는 그릇을 가리킵니다. '돌로 된 물항아리'는 그릇의 재질과 용도를 모두 전달하여 원문 의미에 더 가깝습니다.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  english_pob_choice: in accordance with the Jewish rites of purification
  chosen_korean: 유대인의 정결 예식
  alternatives_korean:
  - 유대인의 정결 규례
  - 유대인들의 정결 관습
  - 유대인의 의식적 정결
  lexicon: BDAG
  rationale: κατὰ는 관례·적합성을 표시하고 καθαρισμός은 의식적 정결을 가리킵니다. Ἰουδαίων은 문맥상 종교적·문화적 관습을 말하므로 '유대인의 정결 예식'이 가장 적절합니다.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  english_pob_choice: two or three measures
  chosen_korean: 두세 단위
  alternatives_korean:
  - 두세 되
  - 두세 메트레테스
  - 두세 양
  lexicon: BDAG
  rationale: μετρητής는 고대의 액량 단위를 가리킵니다. 본문에서는 구체적 환산을 주지 않고 단위를 유지하는 것이 원문 충실도에 부합하므로 '두세 단위'로 처리하고, 구체적 설명은 주석으로 제공합니다.
theological_decisions:
- issue: Rendering of τῶν Ἰουδαίων (Ἰουδαῖος) in Johannine context
  chosen_reading: 유대인의 정결 예식
  alternative_readings:
  - 유대인들의 정결 관습
  - 유대인의 정결 규례
  - 유대인의 종교적 관습(지리적·정체성 강조)
  rationale: Ἰουδαῖος는 문맥에 따라 '유대인' 또는 '유대인의'로 번역될 수 있습니다. 여기서는 예식·정결 관습을 가리키는 문맥적 의미가 명백하므로 종교·문화적 관행을 나타내는 '유대인의 정결 예식'을 선택했습니다. 본역은 원문이 지닌 종교적·사회적 성격을 보존하려는 판단입니다.
  doctrine_reference: 'Translation principle: original-language primacy; preserve theological/cultural sense where ambiguity exists.'
