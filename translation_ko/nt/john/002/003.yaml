id: JHN.2.3
reference: John 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
  footnotes:
  - marker: a
    text: Or, more literally, 'when wine was lacking.'
    reason: lexical_alternative
  - marker: b
    text: 'Greek uses the historical present: ''says.'' Some translations render it ''said.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 포도주가 떨어졌을 때[a], 예수의 어머니께서 그에게[b] 말합니다. 「그들은 포도주가 없습니다。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자 그대로 '포도주가 부족했을 때'.
    reason: lexical_alternative
  - marker: b
    text: '원문 그리스어는 역사적 현재를 사용합니다: ''말합니다.'' 일부 번역은 맥락상 과거형으로 옮깁니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  english_pob_choice: when the wine ran out
  chosen_korean: 포도주가 떨어졌을 때
  alternatives_korean:
  - 포도주가 부족했을 때
  - 포도주가 없었을 때
  lexicon: BDAG
  rationale: 그리스어의 소유격 절(생격 절)·미완료적 의미를 한국어로 자연스럽게 옮기면 '포도주가 떨어졌을 때'가 문맥상의 결핍을 분명히 하면서도 어색하지 않습니다. 더 문자 그대로는 '포도주가 부족했을 때'가 가능하므로 주석[a]로 대체 독법을 기록합니다.
- source_word: λέγει
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말했다
  - 말씀하십니다
  lexicon: BDAG
  rationale: 요한복음의 서술은 역사적 현재를 사용하므로 한국어 본문에서도 현재형 '말합니다'로 살려 원문의 화법 질감을 유지합니다. 일부 번역은 과거형으로 옮기므로 주석[b]에 설명합니다.
- source_word: μήτηρ τοῦ Ἰησοῦ
  english_pob_choice: the mother of Jesus
  chosen_korean: 예수의 어머니
  alternatives_korean:
  - 예수의 어머니(마리아)
  - 마리아
  lexicon: BDAG
  rationale: 원문은 이름을 밝히지 않고 '예수의 어머니'로 지칭하므로 같은 방식으로 옮겨 존속적 지칭 방식을 보존합니다(본문이 인물의 역할을 강조함).
- source_word: Οἶνον οὐκ ἔχουσιν
  english_pob_choice: They have no wine
  chosen_korean: 그들은 포도주가 없습니다
  alternatives_korean:
  - 저희에게 포도주가 없습니다
  - 주최자들에게는 포도주가 없습니다
  - 포도주가 없습니다(존재적)
  lexicon: BDAG
  rationale: 복수 동사로 주어가 문맥상 생략되어 있으므로 한국어에서는 '그들'로 번역하여 원문의 불특정·암시적 지시를 유지합니다. 구체적 주체를 보충하면 원문이 드러내지 않는 정보를 추가하므로 피했습니다.
theological_decisions:
- issue: 요한 서술의 역사적 현재 사용
  chosen_reading: 본문의 현재형 서술을 유지(『말합니다』)
  alternative_readings:
  - 서술을 과거형으로 전환(『말했다』)
  rationale: 역사적 현재를 보존하면 원문의 이야기 기법과 현장감이 독자에게 잘 전달됩니다. 이는 신학적 판단이라기보다 문체·담화 특성의 보존에 관한 번역 결정입니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: 『그들은 포도주가 없습니다』의 암시된 복수 주어 지시
  chosen_reading: 그들의(암시된) 존재를 '그들'로 남겨 두어 원문의 불특정성을 유지
  alternative_readings:
  - 주최자들/혼인 잔치 주인들 등 구체적 지시어 보충
  rationale: 그리스어는 주어를 명시하지 않으므로 구체적 주체를 첨가하면 본문이 제공하지 않는 세부를 도입하게 됩니다. 따라서 영어 POB의 결정처럼 한국어도 암시적 지시를 유지합니다.
  doctrine_reference: 번역 원칙 §3
