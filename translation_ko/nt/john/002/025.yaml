id: JHN.2.25
reference: John 2:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
  footnotes:
  - marker: a
    text: Or 'about a person' / 'what was in a person.' The Greek uses the singular 'man' generically for a human being or humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그는 사람[a]에 관해 누구의 증언도 필요로 하지 않으셨습니다. 이는 그 자신이 사람 안에 무엇이 있는지를 아셨기 때문입니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '한 사람'/'한 인간' 등으로 번역될 수 있습니다. 헬라어 ἄνθρωπος의 단수는 일반적·대표적 단수로 쓰여 ‘사람[human being]’ 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν + ἵνα τις μαρτυρήσῃ
  english_pob_choice: had no need that anyone should testify
  chosen_korean: 증언도 필요로 하지 않으셨습니다
  alternatives_korean:
  - 증언할 필요가 없었습니다
  - 누구의 증언도 필요하지 않으셨습니다
  lexicon: BDAG
  rationale: χρείαν ἔχειν + ἵνα-clause은 '…할 필요가 있다/없다'로 자연스럽게 한국어화됩니다. 존칭을 피하지 않는 서술 어조를 유지하되(원문이 예수의 사실 진술이므로), 한국어 표준 문체에 맞춰 공손한 과거형(하지 않으셨습니다)을 사용하여 αὐτὸς γὰρ의 설명적 뒷문장과 연결했습니다.
- source_word: περὶ τοῦ ἀνθρώπου
  english_pob_choice: about man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 인간
  - 사람에 관하여
  lexicon: BDAG
  rationale: 그리스어 ἄνθρωπος 단수는 일반적(representative) 단수로 읽힐 수 있으므로, 한국어에서도 성별 중립적이고 자연스러운 '사람'으로 번역해 원문의 단수 형태와 어조를 보존합니다. 주석(a)으로 가능한 대체 번역을 제시했습니다.
- source_word: ἐγίνωσκεν
  english_pob_choice: knew
  chosen_korean: 아셨기 때문입니다
  alternatives_korean:
  - 알고 계셨기 때문입니다
  - 알고 있었습니다
  lexicon: BDAG
  rationale: 임퍼펙트 ἐγίνωσκεν은 지속적·특성적 지식을 나타내므로 한국어에서는 단순 과거형 '아셨다'를 쓰되 문체상 공손한 연결어미로 '아셨기 때문입니다'라 하여 지속적 지식의 설명 기능을 살렸습니다. 예수에 대한 높임(‘계셨다’)은 서술 일관성을 위해 일반 과거형으로 처리하였습니다.
theological_decisions:
- issue: Scope of Jesus' knowledge (individual vs. representative)
  chosen_reading: 원문 단수(ἄνθρωπος/ἀνθρώπῳ)를 유지하여 범위를 특정하지 않고 예수의 직접적·내면적 지식을 넓게 표현합니다.
  alternative_readings:
  - 각 개인의 마음속을 아셨다고 좁혀 번역할 수 있음
  - 인간 본성 일반을 가리킨다고 넓혀 번역할 수 있음
  rationale: 그리스어 단수는 대표적 단수로 읽히는 여지가 있어, 번역은 그 신학적 긴장을 지우지 않고 그대로 드러내는 편이 원문 의미를 더 충실히 전달합니다. 따라서 '사람'이라는 단어를 반복해 사용해 원문의 일치성을 살리고 범위를 고정하지 않았습니다.
  doctrine_reference: Translation philosophy §3–4; English POB theological decision (scope of knowledge)
