  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
  footnotes:
  - marker: a
    text: Or, “to the brim.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. "항아리들에 물을 채우십시오." 그들이 그것들을 위까지 채웠습니다[a].
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 "테두리까지" 곧 "가득 차도록"이라고 번역할 수 있습니다(lexical alternative).
    reason: lexical_alternative
lexical_decisions:
- source_word: Γεμίσατε
  english_pob_choice: Fill
  chosen_korean: 채우십시오
  alternatives_korean:
  - 채우시오
  - 가득 채우십시오
  lexicon: BDAG
  rationale: 그리스어 aorist 명령형(복수)은 직접적인 명령을 전합니다. 현대 한국어의 공손한 명령형으로는 '-십시오'가 성경 번역의 문체와 어울립니다.
- source_word: ὑδρίας
  english_pob_choice: water jars
  chosen_korean: 항아리들
  alternatives_korean:
  - 물항아리들
  - 단지들
  lexicon: BDAG
  rationale: ὑδρία는 물을 담는 항아리·단지를 가리킵니다. 본절은 재질(돌 등)을 명시하지 않으므로 단순히 '항아리들'로 옮기되, 문맥상 물을 담는 용기임을 표기하기 위해 다음 어구에 '물'을 명시했습니다.
- source_word: ὕδατος
  english_pob_choice: with water
  chosen_korean: 물로
  alternatives_korean:
  - 물로 가득
  - 물을
  lexicon: BDAG
  rationale: ὕδατος의 소유격은 채움의 내용(무엇으로 채우는가)을 나타냅니다. 한국어에서는 '물로'로 자연스럽게 표현합니다.
- source_word: ἕως ἄνω
  english_pob_choice: up to the top / to the brim
  chosen_korean: 위까지
  alternatives_korean:
  - 가득(끝)까지
  - 테두리(＝가득)까지
  lexicon: BDAG
  rationale: 문구는 '위쪽까지'라는 완전한 채움을 뜻합니다. 한국어에서는 간결하게 '위까지'라 하였고, '가득'·'테두리까지(=to the brim)'와 의미상 중첩되므로 주석으로 대안 표기를 남겼습니다.
theological_decisions:
- issue: 재질 표기(항아리의 돌제 여부)
  chosen_reading: 항아리들 (재질 미표시)
  alternative_readings:
  - 돌로 된 물항아리들(석제 항아리들)
  - 물항아리들
  rationale: 요한복음 2:6에서 항아리들이 '석제'였다고 명시하는 구절이 있으나(문맥상 연결되더라도), 본절의 그리스어(ὑδρίας)는 여기서 재질을 표기하지 않습니다. 직역 원칙에 따라 본절에는 재질을 보태지 않았습니다. 독자는 본문의 전후 맥락(요 2:6)을 통해 재질을 알 수 있습니다.
  doctrine_reference: see John 2:6 context
- issue: 인용문의 문체(명령어체)
  chosen_reading: 공손한 명령형 '-십시오' 사용
  alternative_readings:
  - 비격식 명령형 '-하라'
  - 격식체 '-채우시오'
  rationale: 원문의 명령형은 복수 청자를 향한 직접 명령입니다. 현대 한국어의 정중한 서술체(합쇼체) 규범을 따르면서 원령의 명령성을 보존하려 '-십시오'를 사용했습니다.
  doctrine_reference: translation style guidance
