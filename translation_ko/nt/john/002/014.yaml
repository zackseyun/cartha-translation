source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
  footnotes:
  - marker: a
    text: Greek 'in the temple' uses ἱερόν, referring to the temple complex or precincts, not specifically the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 성전[a]에서 소와 양과 비둘기를 파는 사람들과 거기 앉아 있는 환전상들을 발견하셨다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 그리스어 ἱερόν은 성전 구내나 뜰을 가리키며, 특정히 내부의 성소(나ός)를 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  english_pob_choice: found
  chosen_korean: 발견하셨다
  alternatives_korean:
  - 보셨다
  - 찾으셨다
  lexicon: BDAG
  rationale: Aorist of εὑρίσκω denotes encountering/finding; '발견하셨다' conveys that decisive, eventive sense in modern Korean narration.
- source_word: ἱερῷ
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 성전 뜰
  - 성전 구역
  - 성소
  lexicon: BDAG
  rationale: ἱερόν here denotes the temple complex/precincts; 표준적이고 간결한 한국어 표기는 '성전'이며, 세부 공간 정보는 각주로 보존합니다.
- source_word: βόας / πρόβατα / περιστερὰς
  english_pob_choice: oxen and sheep and doves
  chosen_korean: 소와 양과 비둘기
  alternatives_korean:
  - 소들·양들·비둘기들
  - 가축들
  lexicon: BDAG
  rationale: 제사에 사용되는 동물을 가리키는 전통적 용어로 '소·양·비둘기'가 현대 한국어에서 명료하고 적절합니다.
- source_word: κερματιστὰς
  english_pob_choice: money changers
  chosen_korean: 환전상들
  alternatives_korean:
  - 돈 바꾸는 사람들
  - 환전업자들
  lexicon: BDAG
  rationale: κέρματιστης는 동전·통화를 교환하는 사람을 의미하므로 '환전상들'이 간결하고 등가적인 한국어 표현입니다.
theological_decisions:
- issue: Scope of ἱερῷ in relation to the Jerusalem temple
  chosen_reading: 본문에서는 '성전'으로 번역하되, 그리스어 ἱερόν은 성전 구내·뜰을 가리키므로 각주로 그 공간적 범위를 표기합니다.
  alternative_readings:
  - 성전 뜰
  - 성전 구역
  - 성소(내부 성전)
  rationale: 문맥(제사용 가축과 환전상들의 활동)이 성전 전체 구내·뜰을 지시하므로 본문은 '성전'으로 일상적으로 번역하고, 정확한 공간적 뉘앙스는 주석으로 보존하는 편이 독자 친화적이면서 원문 의미를 유지합니다.
  doctrine_reference: Translation philosophy §1, §6
