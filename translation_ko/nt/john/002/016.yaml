id: JHN.2.16
reference: John 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
  footnotes:
  - marker: a
    text: Or “a marketplace.” The Greek more literally reads “a house of trade,” preserving the repetition of “house” in the sentence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 비둘기를 파는 사람들에게 말씀하셨습니다. 「여기서 이것들을 치워 가십시오. 내 아버지의 집을 장사하는 집[a]으로 만들지 마십시오。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시장(광장)”으로 번역할 수 있습니다. 헬라어는 보다 문자적으로 ‘장사하는 집’이라 읽히며, 그리스어의 ‘집’ 반복을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  english_pob_choice: doves
  chosen_korean: 비둘기
  alternatives_korean:
  - 비둘기들
  - 비둘기류
  - 비둘기(제물용)
  lexicon: BDAG
  rationale: 헬라어 단어는 제사용으로 팔리던 새를 가리키며, 한국어로는 일반적으로 '비둘기'라고 번역합니다. 복수성은 문맥으로 충분히 전달되므로 단수형 표기가 자연스럽습니다.
- source_word: πωλοῦσιν
  english_pob_choice: selling
  chosen_korean: 파는 (사람들에게)
  alternatives_korean:
  - 팔고 있는
  - 판매하는
  - 팔다
  lexicon: BDAG
  rationale: 현재분사는 행위로 그 집단을 지시하므로 '파는 사람들에게'로 번역하여 그들의 지속적 상업 활동을 드러냅니다.
- source_word: Ἄρατε ταῦτα ἐντεῦθεν
  english_pob_choice: Take these things away from here
  chosen_korean: 여기서 이것들을 치워 가십시오
  alternatives_korean:
  - 이것들을 여기서 치워라
  - 이것들을 치워 버리십시오
  - 여기서 가져가십시오
  lexicon: BDAG
  rationale: αorist 명령의 단호한 요구를 한국어의 정중 명령형 '치워 가십시오'로 살려 원문의 결단성을 유지했습니다.
- source_word: τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου
  english_pob_choice: my Father’s house a house of trade
  chosen_korean: 내 아버지의 집을 장사하는 집
  alternatives_korean:
  - 우리 아버지의 집을
  - 하나님의 집을
  - 시장(광장)으로
  lexicon: BDAG
  rationale: 그리스어가 οἶκος(집)를 반복하므로 한국어에서도 '집을 ... 집'의 대조를 살려 '장사하는 집'으로 번역했고, πατρός μου의 단수 소유격을 보존하여 '내 아버지'로 처리했습니다.
theological_decisions:
- issue: Rendering Jesus’ designation of the temple as 'my Father’s house'
  chosen_reading: ‘내 아버지의 집’으로 직역하여 예수의 특수한 아버지 관점을 보존
  alternative_readings:
  - ‘우리 아버지의 집’
  - ‘하나님의 집’
  - ‘주님의 집’
  rationale: 그리스어는 명확히 μου(내)를 사용하여 예수의 고유한 친자 관계를 드러냅니다. 번역은 이 본문이 제기하는 그리스도론적 힘을 훼손하지 않도록 원어의 소유격을 그대로 살렸습니다.
  doctrine_reference: '번역철학 §1(원문 우선), 참조: 영어 POB 결정(예수의 독특한 filiation 강조)'
