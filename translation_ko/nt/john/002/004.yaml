id: JHN.2.4
reference: John 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
  footnotes:
  - marker: a
    text: Or, more literally, “What is that to me and to you?”—an idiom expressing distance of concern, not necessarily hostility.
    reason: lexical_alternative
  - marker: b
    text: “Woman” was a normal respectful form of address in that setting, though it can sound abrupt in English.
    reason: cultural_note
translation:
  language: ko
  text: 예수께서 그녀에게 말씀하셨습니다. 「여인[b], 그 일이 나와 당신에게 무슨 상관이 있습니까[a]? 아직 내 때가 이르지 않았습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘나와 당신에게 그것이 무엇입니까?’—관심사나 관계의 거리를 나타내는 관용구이며, 반드시 적대감을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 당시 ‘여인’이라는 호칭은 통상적인 존중의 표현으로도 쓰였지만, 현대 한국어에서는 다소 건조하거나 갑작스럽게 들릴 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말씀하신다
  - 말씀하셨다
  lexicon: BDAG / SBLGNT usage
  rationale: '원문은 역사적 현재형을 사용하지만, 한국어 내러티브에서는 경어체의 과거형(예: ''말씀하셨습니다'')이 자연스럽고 예수에 대한 경칭을 유지합니다. 직접 인용문의 동사는 발화 시제로 따로 표기했습니다.'
- source_word: Τί ἐμοὶ καὶ σοί
  english_pob_choice: What does that have to do with me and with you
  chosen_korean: 그것이 내게나 네게 무슨 상관이 있습니까
  alternatives_korean:
  - 내게와 네게 그것이 무슨 관계가 있습니까
  - 나와 너에게 무슨 상관이 있느냐
  lexicon: BDAG (idiom)
  rationale: 그리스어 관용구는 문자적 소유·관계 질문이라기보다 거리감을 나타내는 표현입니다. 한국어에서 '그것이 내게나 네게 무슨 상관이 있습니까'는 그 의미를 보존하면서 현대적이고 이해하기 쉬운 표현입니다.
- source_word: γύναι
  english_pob_choice: woman
  chosen_korean: 여인
  alternatives_korean:
  - 어머니
  - 여자
  lexicon: BDAG / Johannine vocative usage
  rationale: 원어의 호격은 문자적으로 'woman'입니다. '어머니'는 본문이 암시하는 관계를 과도하게 규정하므로 피했고, '여자'는 현대 한국어에서 거칠게 들릴 수 있어 중립적이고 문어적인 '여인'을 선택했습니다. 어조 문제는 각주로 설명합니다.
- source_word: ἡ ὥρα μου
  english_pob_choice: my hour
  chosen_korean: 내 때
  alternatives_korean:
  - 내 시간
  - 내 때(때문)
  - 나의 때
  lexicon: BDAG / Johannine motif
  rationale: 요한복음에서 'ὥρα'는 신학적으로 적절한 순간(자기 고백·고난·영광)을 지시하므로 '때'로 번역하여 한국어 독자가 의미의 부담 없이 '특정한 때'임을 알게 했습니다. '시간'보다 '때'가 본문적 색채를 유지합니다.
theological_decisions:
- issue: 예수의 어조(어머니에 대한 호칭)와 거리감
  chosen_reading: 존중을 유지하되 상황적 거리감을 표현한 응답
  alternative_readings:
  - 거친 꾸짖음
  - 따뜻한 애정의 표현
  rationale: Τί ἐμοὶ καὶ σοί는 관계적·상황적 거리감을 나타내는 관용구입니다. γύναι는 당시 용례상 경칭으로도 쓰이므로 번역은 무례하거나 지나치게 다정하지 않도록 균형을 유지했습니다. 본문 자체의 긴장을 보존하기 위해 호칭을 직역하고 각주로 어조를 설명합니다.
  doctrine_reference: 번역 원칙 §3 (POB 영어 감사문맥)
- issue: 요한서간에서의 '내 때(내 ὥρα)' 의미
  chosen_reading: 예수의 신적 사역과 영광·고난이 연관된 예정된 순간을 가리킴
  alternative_readings:
  - 단지 이 표적을 행할 순간
  - 특별한 신학적 의미 없는 일반적 시간
  rationale: 요한복음 전반에서 'ὥρα'는 예수 사역의 결정적 순간들과 연결됩니다. 본문에서는 문자적 번역어를 유지하여 독자가 요한의 신학적 주제를 인식하도록 했습니다.
  doctrine_reference: 번역 원칙 §1, §3
