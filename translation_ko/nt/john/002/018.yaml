id: JHN.2.18
reference: John 2:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
  footnotes:
  - marker: a
    text: Or 'the Jewish leaders' or 'the Judeans'; in John, 'the Jews' can refer more narrowly to a representative group, especially the Judean authorities, depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 유대인들이[a] 대답하여 그에게 말했습니다. 「당신이 이런 일들을 하신다는 것을 우리에게 어떤 표적으로 보이십니까?」
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '유대인 지도자들' 또는 '유다인들'; 요한복음에서 '유대인들'은 문맥에 따라 대표적 집단, 특히 유다 당국을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대인 지도자들
  - 유다인들
  - 유대인(대표자들)
  lexicon: BDAG
  rationale: '그리스어 원문은 문자적으로 ''유대인들''이다. 요한복음에서 문맥에 따라 제한적 의미(예: 유다당국)를 가질 수 있으나, 본 절 자체는 그 범위를 명시하지 않으므로 주해적 축약을 피하고 문자적 표현을 유지했습니다.'
- source_word: σημεῖον
  english_pob_choice: What sign
  chosen_korean: 표적
  alternatives_korean:
  - 기적
  - 표징
  lexicon: BDAG
  rationale: 요한복음에서 σημεῖον은 단순한 기적 이상으로 어떤 신적 권위를 가리키는 '표적'의 의미를 자주 담는다. '표적'은 원어의 지시적·증명적 함의를 보존합니다.
- source_word: ὅτι
  english_pob_choice: that
  chosen_korean: …한다는 것을
  alternatives_korean:
  - …때문에
  - …라는
  lexicon: BDAG
  rationale: 여기서 ὅτι는 내용절을 이끄는 접속사로 작용한다. 한국어에서는 '…한다는 것을'으로 처리하여 영어 POB의 'that you do these things'에 해당하는 내용 절을 충실히 전달합니다.
- source_word: δεικνύεις / ταῦτα ποιεῖς
  english_pob_choice: do you show us ... that you do these things
  chosen_korean: 어떤 표적으로…보이십니까 / …을 하신다는
  alternatives_korean:
  - 보이시겠습니까 / 하신다
  - 보이십니까 / 하십니다
  lexicon: BDAG
  rationale: δεικνύεις와 ποιεῖς의 현재 시제(직설법)는 청중의 즉각적 도전·요구를 담고 있다. 존칭형 '보이십니까'와 '하신다는'으로 현재적·진술적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: Referent of 'the Jews' in John's Gospel
  chosen_reading: 원문적·문자적 '유대인들'을 본문에 그대로 유지
  alternative_readings:
  - 유대인 지도자들
  - 유다인(지배층, 당국)
  rationale: '요한복음에서 ''οἱ Ἰουδαῖοι''는 문맥에 따라 특정 집단(예: 지도자들, 유다의 당국)을 가리킬 수 있으나, 이 절 자체는 그 범위를 지정하지 않는다. 원문 우선 원칙에 따라 문자적 표현을 본문에 보존하고 주석(각주)으로 대안적 독법을 알립니다.'
  doctrine_reference: Translation philosophy §1, §3
