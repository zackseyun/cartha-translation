revisions:
- from: 그가 예루살렘에 유월절 곧 명절 때 있을 때에, 많은 사람이 그의 이름을 믿었습니다[a]. 그들은 그가 행하신 표적들을 보고 있었습니다[b].
  to: 그가 예루살렘에 계시던 유월절 명절 때에, 그가 행하시던 표적들을 보면서 많은 사람이 그의 이름을 믿었습니다[a][b].
  rationale: 문장을 하나로 재구성하여 ‘표적들을 보면서’가 ‘믿었습니다’를 수식하도록 했습니다. 이로써 θεωροῦντες의 동시적·지속적 관찰과 ἐποίει의 미완료적 진행성을 각각 ‘보면서’와 ‘행하시던’으로 반영했습니다. ‘그의 이름을 믿었습니다’는 요한 특유의 표현을 보존하며, 그 믿음의 성격을 본 절에서 미리 해석하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:24Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 어휘(유월절, 그의 이름을 믿다, 표적)를 잘 보존합니다. 그러나 θεωροῦντες(보면서/보고)가 ἐπίστευσαν을 수식하는 동시적 분사인데, 이를 독립된 두 문장으로 분리하여 믿음과 표적을 보는 행위의 문법적 연결이 약화되었습니다. 또한 ἐποίει의 진행적 과거는 ‘행하신’보다 ‘행하시던’으로 옮기는 편이 더 잘 드러납니다.
  naturalness: ‘그가 예루살렘에 유월절 곧 명절 때 있을 때에’는 조사와 시간 표현이 겹쳐 현대 한국어로 다소 부자연스럽습니다. ‘그가 예루살렘에 계시던 유월절 명절 때에’ 및 ‘…보면서’가 자연스럽고 원문의 문장 관계도 살립니다.
  terminology: ‘유월절’, ‘표적’, ‘그의 이름을 믿었습니다’는 요한복음의 관용과 전통적 성서 용어를 적절히 유지합니다. 주석 a의 ‘정체성에 향한’은 ‘정체성을 향한’으로 바로잡아야 합니다. 주석 b는 영어 감사 기록의 취지를 따라 ‘기적’이라는 번역 가능성을 언급하되, 본문의 ‘표적’을 유지하는 설명으로 다듬었습니다.
  issues:
  - severity: medium
    issue: 분사구 θεωροῦντες의 문장 관계가 독립 문장으로 분리됨
    rationale: 그리스어는 ‘그가 행하시던 표적들을 보면서’라는 동시적 상황 아래 ‘많은 사람이 믿었다’고 말합니다. 두 문장으로 나누면 표적을 보는 일이 믿음과 동반된 원인·상황이라는 연결이 약해집니다.
  - severity: low
