id: JHN.2.23
reference: John 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: Now when he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
  footnotes:
  - marker: a
    text: Or 'believed in him.' Literally, 'believed in his name,' a Johannine expression emphasizing trust directed toward his revealed identity.
    reason: lexical_alternative
  - marker: b
    text: '''Signs'' is John''s characteristic term for works that point beyond themselves to who Jesus is; some translations render it ''miraculous signs.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 예루살렘에 유월절 곧 명절 때 있을 때에, 많은 사람이 그의 이름을 믿었습니다[a]. 그들은 그가 행하신 표적들을 보고 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그를 믿었다.' 문자적으로는 '그의 이름을 믿었다'—요한의 표현으로 그의 드러난 정체성에 향한 신뢰를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 요한이 쓰는 '표적'은 행위 자체를 넘어서 그가 누구인지를 가리키는 신학적 용어입니다; 일부 번역은 이를 '기적'이라 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ πάσχα
  english_pob_choice: at the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 유월절 때
  - 유월절 기간
  lexicon: BDAG
  rationale: πάσχα는 여기서 유월절 제사의 시기를 가리키므로 전통적인 한국어 성서어 '유월절'을 사용했습니다. 영어 POB의 'Passover'에 대응합니다.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  english_pob_choice: believed in his name
  chosen_korean: 그의 이름을 믿었습니다
  alternatives_korean:
  - 그를 믿었습니다
  - 그의 이름 안으로 믿음을 두었습니다
  lexicon: BDAG
  rationale: 요한복음의 고유한 관용(πιστεύω εἰς + τὸ ὄνομα)인 '이름을 믿다'를 직역으로 보존하여, 믿음이 그의 드러난 정체성(이름)을 향한 신뢰임을 유지합니다. 문맥상(다음 절) 이 믿음의 성격이 추가로 해석되므로 본 절에서는 문장 그대로 옮겼습니다.
- source_word: τὰ σημεῖα
  english_pob_choice: the signs
  chosen_korean: 표적들
  alternatives_korean:
  - 기적들
  - 표징들
  lexicon: BDAG
  rationale: 요한서신에서 σημεῖα는 신학적 의미를 지닌 용어이므로 전통적 한국어 성경어 '표적'을 사용했습니다. 번역 주석으로 이 용어가 단순한 기적을 넘어 인물의 정체를 가리킨다는 점을 표시합니다.
- source_word: θεωροῦντες ... ἃ ἐποίει
  english_pob_choice: as they were seeing the signs that he was doing
  chosen_korean: 그들은 그가 행하신 표적들을 보고 있었습니다
  alternatives_korean:
  - 그들이 보고 있던 표적들
  - 보고 있던 그의 표적들
  lexicon: BDAG
  rationale: θεωροῦντες의 계속적·동시적 관찰을 한국어의 계속적 서술 '보고 있었습니다'로 살려 번역했습니다. ἐποίει의 미완료적 과거성도 '행하신'으로 처리하여 행위의 연속성을 나타냈습니다.
theological_decisions:
- issue: 요한복음의 '이름을 믿다'가 가리키는 믿음의 성격
  chosen_reading: 본문은 단순히 '많은 사람이 그의 이름을 믿었다'고 번역하여 본문의 진술을 그대로 보존합니다; 믿음의 충분성이나 깊이는 다음 구절(2:24)이 밝힐 여지가 있으므로 본 절에서 선제적으로 평가하지 않습니다.
  alternative_readings:
  - 사람들이 기적 때문에 표면적으로만 믿었다고 번역하여 믿음의 불완전함을 강조할 수 있다.
  - 그냥 '그를 믿었다'로 번역하여 요한의 어법적 색채를 약화시킬 수 있다.
  rationale: 그리스어는 명백히 'τὸ ὄνομα' 구문을 사용하므로 이를 유지하는 것이 요한의 표현과 신학적 긴장을 보존합니다. 본문 자체가 믿음의 사실을 진술하고, 다음 절이 그 믿음의 성격을 한정하므로 번역은 원문 긴장을 해소하지 않습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
