review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 그러나 ‘사흘 만에’는 문맥에 따라 ‘단 사흘 만에’라는 경과·신속성의 뉘앙스를 더할 수 있어, ἐν τρισὶν ἡμέραις의 시간 표현을 더 직접적으로 반영하는 ‘사흘 안에’로 고쳤습니다. 또한 목적어 αὐτόν을 ‘그것을’로 명시하여 성전이라는 표면적 지시 대상을 유지했습니다.
  naturalness: ‘대답하여 그들에게 말씀하셨습니다’는 현대 합쇼체 성경 문체에서 자연스럽습니다. ‘이 성전을 허물어 버리십시오’도 명령의 파괴 의미를 잘 전달합니다. ‘사흘 안에 내가 그것을 일으키겠습니다’는 다소 문어적이지만, 원문의 의도적인 수수께끼성과 대명사 지시를 보존하는 데 적절합니다.
  terminology: ναός는 ‘성전’으로 유지하는 것이 적절합니다. ἐγείρω는 ‘일으키겠습니다’로 번역하여 건축적 재건으로 한정하지 않고 부활의 공명을 보존했습니다. 각주의 ‘자신의 몸’은 지시 주체가 불명확하므로 예수께서 자신의 몸을 가리켜 말씀하신 것이라는 표현으로 명료하게 고쳤습니다.
  issues:
