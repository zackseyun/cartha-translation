    issue: ‘사흘 만에’의 시간 뉘앙스
    rationale: ‘사흘 만에’는 한국어에서 경과 기간이나 예상보다 빠름을 암시할 수 있습니다. ἐν τρισὶν ἡμέραις의 표현을 더 중립적으로 옮기기 위해 ‘사흘 안에’로 조정했습니다.
  - severity: low
    issue: 목적어 αὐτόν의 미표시
    rationale: 한국어에서는 목적어 생략이 가능하지만, 여기서는 성전을 가리키는 표면적 대명사를 표시하는 편이 원문의 모호한 지시와 문장 구조를 더 잘 보존합니다.
  - severity: medium
    issue: 각주의 ‘자신의 몸’ 지시 불명확
    rationale: ‘요한은 … 자신의 몸으로 해석한다’는 표현은 요한 자신의 몸처럼 읽힐 여지가 있습니다. 예수께서 자신의 몸을 가리켜 말씀하신 것이라고 명시해야 합니다.
