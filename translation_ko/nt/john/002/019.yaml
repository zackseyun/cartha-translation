id: JHN.2.19
reference: John 2:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
  footnotes:
  - marker: a
    text: Or, “tear down this temple … I will rebuild it.” The Greek verb translated “raise … up” can be heard in context with resurrection overtones; John later explains that Jesus was speaking about the temple of his body (2:21).
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 그들에게 말씀하셨습니다. 「이 성전을 허물어 버리십시오. 사흘 안에 내가 그것을 일으키겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 성전을 허물어라 … 내가 다시 세우겠다.” 그리스어 동사 ἐγείρω는 문맥상 부활의 어감을 가질 수 있으며, 요한은 2:21에서 예수께서 자신의 몸을 가리켜 말씀하신 것이라고 설명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη / εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 … 말씀하셨습니다
  alternatives_korean:
  - 응답하고 말했습니다
  - 대답하여 이르셨습니다
  lexicon: BDAG
  rationale: 원문의 두 동사(ἀπεκρίθη … καὶ εἶπεν)는 관용적으로 함께 쓰이므로 한국어에서도 '대답하여 말씀하셨습니다'로 병기하여 원문의 겹겹이 놓인 화법을 보존합니다.
- source_word: Λύσατε
  english_pob_choice: Destroy
  chosen_korean: 허물어 버리십시오
  alternatives_korean:
  - 헐어 버리십시오
  - 허물어라
  - 무너뜨려라
  lexicon: BDAG
  rationale: Aorist 명령형의 파괴·해체 의미를 살려 '허물어 버리십시오'로 번역했습니다. 존댓말 어조(합쇼체)를 유지하면서도 명령의 파급력을 전달합니다.
- source_word: ναὸν
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 성전 건물
  lexicon: BDAG
  rationale: ναός는 '성전'으로 자연스럽고 독자에게 친숙한 표기를 사용합니다. 요한복음의 문맥상 예루살렘 성전을 가리키는 말로 이해됩니다.
- source_word: ἐγερῶ
  english_pob_choice: I will raise ... up
  chosen_korean: 일으키겠습니다
  alternatives_korean:
  - 다시 세우겠습니다
  - 일으키리라
  lexicon: BDAG
  rationale: ἐγείρω의 미래형이 부활 어감을 가질 수 있으므로 건축적 의미로 한정하지 않고 '일으키겠습니다'로 하여 부활적 공명을 열어 두었습니다.
theological_decisions:
- issue: 예수가 '이 성전'을 본문에서 곧바로 자신의 몸으로 명시할지 여부
  chosen_reading: 본문은 그대로 '이 성전'으로 번역하고 설명은 후속 절(요 2:21)에 맡김
  alternative_readings:
  - 본문에서 곧바로 '내 몸'으로 해석을 결부하여 번역한다 ('이 성전을 — 곧 내 몸을 — 헐어라')
  rationale: 요한은 본문에서 고의적으로 모호함을 남기고(ἐγείρω의 부활 어감 포함) 2:21에서 해석을 제공하므로 번역도 모호성을 보존해야 합니다. 본문에서 과도하게 설명하면 내러티브의 신학적 긴장이 흐려집니다.
  doctrine_reference: '번역철학 §3: 신학적 긴장 보존'
