id: JHN.2.17
reference: John 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
  footnotes:
  - marker: a
    text: Or “has consumed me,” reflecting the wording of Psalm 69:9 in some textual traditions; John’s Greek here reads “will consume me.”
    reason: alternative_reading
translation:
  language: ko
  text: '제자들이 이것이 기록되어 있음을 기억했습니다[a]: 「야훼의 집을 위한 열심이 나를 삼킬 것이다」[b].'
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 일부 필사 전통의 시편 69:9 원문을 반영하여 '나를 삼켰다'로 번역할 수 있습니다; 요한의 그리스어는 여기에서 미래형(καταφάγεταί με)을 취합니다.
    reason: alternative_reading
  - marker: b
    text: 이 인용은 시편 69:9을 가리키며, 본문 표기에 따라 OT의 신명을 가리키는 표기를 '야훼'로 처리했습니다.
    reason: ot_citation
lexical_decisions:
- source_word: μαθηταὶ
  english_pob_choice: disciples
  chosen_korean: 제자들
  alternatives_korean:
  - 배우는 자들
  - 제자
  lexicon: BDAG
  rationale: μαθηταὶ의 표준적 NT 번역어인 '제자들'을 사용하여 원문의 교습·추종 관계를 유지합니다.
- source_word: γεγραμμένον ἐστίν
  english_pob_choice: it is written
  chosen_korean: 기록되어 있음을
  alternatives_korean:
  - 기록되어 있습니다
  - 적혀 있음을
  lexicon: BDAG
  rationale: 성경 인용 서술문으로서 현재·완료적 의미를 보존하며 한국어 문장 흐름에 맞게 '…있음을' 형태로 처리했습니다.
- source_word: ζῆλος
  english_pob_choice: Zeal
  chosen_korean: 열심
  alternatives_korean:
  - 열정
  - 질투하는 마음
  lexicon: BDAG
  rationale: OT 인용의 신앙적·열정적 의미를 살리기 위해 전통적이고 중립적인 '열심'을 선택했습니다.
- source_word: καταφάγεταί με
  english_pob_choice: will consume me
  chosen_korean: 나를 삼킬 것이다
  alternatives_korean:
  - 나를 삼켰다
  - 나를 집어삼킬 것이다
  lexicon: BDAG
  rationale: 요한복음의 그리스어형은 미래 시제를 취하므로 한국어로도 미래 시제('…것이다')를 유지하여 원문 어법을 충실히 전달했습니다.
theological_decisions:
- issue: 미래 시제의 OT 인용(καταφάγεταί με) 취급
  chosen_reading: 요한의 그리스어 표기를 따라 '나를 삼킬 것이다'의 미래 시제를 보존합니다.
  alternative_readings:
  - '''나를 삼켰다''와 같이 과거 시제로 조화'
  rationale: 본문의 그리스어는 미래형을 사용하며, 전통적 시제 조정(과거형으로 바꿈)은 요한의 고유한 신학적·문체적 선택을 가릴 수 있으므로 원문 시제를 유지합니다.
  doctrine_reference: 번역철학 §1, §3 (원문 충실성 우선)
- issue: OT 인용에서 하나님의 이름 처리(『야훼』 표기)
  chosen_reading: OT 인용을 가리키는 문구이므로 '야훼'를 본문 인용 안에 반영했습니다.
  alternative_readings:
  - '''주'' 또는 ''주님의 집'' 등 교회 전통적 표기'
  - 무표기(단순히 '네 집' 등)
  rationale: 프로젝트 방침에 따라 신명시적·시편적 인용에서 원문의 'YHWH'에 해당하는 지시를 가시화하기 위해 학문적 전사 '야훼'를 사용했습니다. 이는 원전의 청자 지향성과 인용 출처를 명확히 하기 위한 표기입니다.
  doctrine_reference: '용어집: יהוה → 야훼(프로젝트 규정)'
