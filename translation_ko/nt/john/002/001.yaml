source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
  footnotes:
  - marker: a
    text: Or 'a wedding feast.' The Greek term can refer to the wedding celebration as well as the marriage event.
    reason: lexical_alternative
  - marker: b
    text: Or 'the mother of Jesus was there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째 날에 갈릴리 가나에서 혼인 잔치[a]가 있었고, 예수의 어머니도 거기에 계셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '혼인 잔치'라고 할 수 있습니다. 헬라어 γάμος는 결혼 행사와 잔치를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '예수의 어머니가 거기에 계셨다'라고 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  english_pob_choice: on the third day
  chosen_korean: 셋째 날에
  alternatives_korean:
  - 다음날로부터 사흘째에
  - 제삼일에
  lexicon: BDAG
  rationale: The Greek dative time phrase functions as a straightforward temporal marker in the narrative. '셋째 날에' is a natural, idiomatic Korean rendering that preserves the simple chronological notice without adding symbolic overtone.
- source_word: γάμος
  english_pob_choice: a wedding
  chosen_korean: 혼인 잔치
  alternatives_korean:
  - 혼인
  - 결혼식
  lexicon: BDAG / Liddell-Scott
  rationale: γᾶμος can denote the marriage event or the wedding feast. '혼인 잔치' explicitly captures the celebratory/feasting sense present in narrative contexts like John 2; footnote a records the alternative '혼인'/'wedding feast.'
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  english_pob_choice: in Cana of Galilee
  chosen_korean: 갈릴리 가나에서
  alternatives_korean:
  - 가나(갈릴리)에서
  - 갈릴리의 가나에서
  lexicon: BDAG
  rationale: Proper-name transliteration follows common Korean biblical usage. '갈릴리 가나' keeps the two-place identifier concise and mirrors the Greek genitive construction without over-expanding.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  english_pob_choice: the mother of Jesus / Jesus's mother
  chosen_korean: 예수의 어머니
  alternatives_korean:
  - 예수의 모친
  - 그 예수의 어머니
  lexicon: BDAG
  rationale: A literal genitival relation is best here. '예수의 어머니' is modern, clear, and aligns with the Greek's plain reference; rendered with polite narrative verb to match the project's style.
theological_decisions:
- issue: Narrative temporal marker 'the third day' (τῇ ἡμέρᾳ τῇ τρίτῃ)
  chosen_reading: Rendered as a simple chronological notice ('셋째 날에') without imposing symbolic resurrection meaning.
  alternative_readings:
  - A typological/allusive reading tying the phrase to later Johannine resurrection motifs.
  rationale: While Johannine readers may detect theological resonances, in this context the phrase functions as a straightforward time marker in the narrative sequence. The translation preserves the ambiguity by not adding interpretive language.
  doctrine_reference: Preserve theological tension; do not resolve Johannine symbolism in the main text.
