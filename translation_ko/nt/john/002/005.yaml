  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 διακόνοις는 이 잔치 장면에서 교회 직분이나 일반적 예속 신분을 뜻하기보다 잔치에서 일을 맡아 시중드는 사람들을 가리키므로, '종들'보다 문맥상 구체적인 표현이 더 적절합니다. ὅ τι ἂν λέγῃ는 불특정 관계절이며, 각주에서 ἄν을 단순한 '가능성·잠정성'으로 규정한 것은 정확하지 않습니다.
  naturalness: '''그가 너희에게 무슨 말을 하든지 그대로 하십시오''는 자연스럽지만, 현대 합쇼체의 일관성을 위해 청자를 ''여러분''으로 처리하고, ''무엇을''을 사용하면 더 표준적이고 매끄럽습니다.'
