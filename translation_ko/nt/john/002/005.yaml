id: JHN.2.5
reference: John 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
  footnotes:
  - marker: a
    text: Or, more literally, “Whatever he may say to you, do.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 어머니가 시중드는 이들에게 말했습니다. 「그가 여러분에게 무엇을 말하든지, 그대로 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 문자적으로는 ‘그가 여러분에게 무엇을 말하든지, 하십시오’라고 번역할 수 있습니다. 그리스어 표현은 그가 말하는 것이 무엇이든지 행하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  english_pob_choice: his mother
  chosen_korean: 그의 어머니
  alternatives_korean:
  - 그의 어머니다
  - 예수의 어머니
  - 어머니께서
  lexicon: BDAG / POB glossary
  rationale: 그리스어 소유격 aὐτοῦ를 그대로 살려 가족적 식별을 유지합니다. '그의 어머니'는 원문의 경제성을 보존하면서 현대 한국어 내러티브에 자연스럽게 들어맞습니다; '예수의 어머니'로 확장하면 원문의 간결성을 넘어서 해석적 부연이 됩니다.
- source_word: διακόνοις
  english_pob_choice: servants
  chosen_korean: 종들에게
  alternatives_korean:
  - 시중드는 이들에게
  - 종들
  - 집사들에게
  lexicon: BDAG / POB glossary
  rationale: 여기서는 결혼 잔치에서 수고하는 사람들을 가리키므로 교회 직분 '집사'로 읽지 않습니다. POB 용어집의 일반적 봉사자 의미에 따라 '종들에게'로 직역하여 원문의 사회적 역할을 전달합니다.
- source_word: Ὅ τι ἂν λέγῃ ὑμῖν ποιήσατε
  english_pob_choice: Whatever he tells you, do it.
  chosen_korean: 그가 너희에게 무슨 말을 하든지 그대로 하십시오
  alternatives_korean:
  - 그가 너희에게 무슨 말을 하든지 하십시오
  - 무엇이든 그가 너희에게 말하는 대로 행하십시오
  - 그가 너희에게 말할지라도 실행하십시오
  lexicon: BDAG
  rationale: ἄν을 포함한 부정적·불특정 관계사구의 가능성·개방성을 '무슨 말을 하든지'로 전달하고, 명령형 ποιήσατε는 한국어의 정중한 명령문 '하십시요/하십시오'로 바꿨습니다. 영어 POB가 보인 'do it'의 함의를 한국어에 자연스럽게 살리기 위해 '그대로 하십시오'라 번역했습니다.
theological_decisions:
- issue: Referent of the implied subject in 'whatever he tells you' (Ὅ τι ἂν λέγῃ ὑμῖν)
  chosen_reading: 대명사 '그'는 예수를 가리키지만 본문 경제성을 유지하여 본문에서는 '그'로 번역했습니다.
  alternative_readings:
  - '''예수''로 명시적으로 확장하여 ''예수께서 너희에게 무슨 말을 하든지...''로 번역'
  - 문맥상 명확하므로 대명사를 생략하고 '무슨 말을 하든지'로만 처리
  rationale: 원문은 주어를 명시하지 않으나 앞뒤 문맥상 예수가 지시 대상입니다. POB 원칙인 원문 우선성과 문장 경제성을 따라 '그'로 처리하여 번역자가 추가 해설을 삽입하지 않았습니다.
  doctrine_reference: 원문 우선성; POB 신학적 중립성 원칙
- issue: 회중에 대한 명령문 어조
  chosen_reading: 직접 인용문의 명령은 정중한 합쇼체 명령문 '하십시요/하십시오'로 표현했습니다.
  alternative_readings:
  - 성경 전통의 고전적 명령형 '하라'를 사용
  - 구어체의 '해' 등으로 완화
  rationale: 프로젝트의 목표 어조(현대 표준 한국어 합쇼체)를 우선하면서도, 인용된 명령의 권위를 보존하기 위해 정중한 명령형을 택했습니다. 내러티브(서술)와 인용(명령) 사이의 등록 전환을 문서화했습니다.
  doctrine_reference: 번역 스타일 가이드(현대 합쇼체 유지)
