id: JHN.2.12
reference: John 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
  footnotes:
  - marker: a
    text: Or 'his relatives' or 'his kinsmen'; the Greek word can refer to brothers in the narrower sense or, in some contexts, to a wider family relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 그와 그의 어머니와 그의 형제들[a]과 그의 제자들은 가버나움으로 내려갔고, 그들은 거기에서 많은 날을 머물지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친척들’ 또는 ‘가까운 친족’. 그리스어 단어는 좁은 의미의 남성 형제들을 가리킬 수도 있고, 어떤 문맥에서는 더 넓은 친족 관계를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  english_pob_choice: After this
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 이 일 후에
  lexicon: BDAG
  rationale: 시간적 연결어로서 원문 단수 지시를 보존합니다. '그 후에'는 현대 한국어에서 자연스럽고 원문 의미를 그대로 전달합니다.
- source_word: κατέβη
  english_pob_choice: went down
  chosen_korean: 내려갔습니다
  alternatives_korean:
  - 내려오셨습니다
  - 내려갔다
  lexicon: BDAG
  rationale: 지리적 이동을 나타내는 동사입니다. 서술형 현대 한국어에서 '내려갔습니다'가 원문 'went down'의 의미와 문체(합쇼체)에 가장 가깝습니다.
- source_word: εἰς Καφαρναοὺμ
  english_pob_choice: to Capernaum
  chosen_korean: 가버나움으로
  alternatives_korean:
  - 가버나움에
  - 가버나움으로 들어가
  lexicon: BDAG; 한국 관습 표기
  rationale: 지명은 한국어 성경 관습 표기 '가버나움'을 따랐습니다. 방향을 표시하는 전치사적 의미를 살려 '으로'를 사용합니다.
- source_word: οἱ ἀδελφοὶ
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제자매
  - 그의 친척들
  lexicon: BDAG
  rationale: 그리스어 문법상 남성 복수형이며 본문은 가장 직역 가능한 '형제들'을 택합니다. 확대 해석(형제자매/친척)은 각주로 표기해 독자가 원문 범위를 검토할 수 있게 했습니다.
theological_decisions:
- issue: Referent of ἀδελφοί in relation to Jesus' family
  chosen_reading: 본문은 주 텍스트에서 '형제들'으로 표기하고, 더 넓은 친족 가능성은 각주로 제시합니다.
  alternative_readings:
  - 형제자매(남녀 포함)
  - 친척들/가족(넓은 혈연)
  rationale: '원어의 남성 복수형을 그대로 반영하여 번역의 충실성을 우선했습니다. 이 어휘는 역사적·신학적 논쟁(예: 마리아의 영처성)과 연결되므로 본문을 변경하지 않고 주석으로 대체적 해석을 제시합니다.'
  doctrine_reference: Affirmations; Translation philosophy §§3–4
- issue: 본문 주어 표기 — 원문의 대명사 vs. 이름(예수) 삽입
  chosen_reading: 원문 대명사(그)는 그대로 사용하여 '그'로 표기
  alternative_readings:
  - 예수께서/예수님이(경칭 포함)로 명시
  - 이후 문맥상 이름을 보완하여 '예수' 삽입
  rationale: 그리스어는 명시적 대명사를 사용하므로 이를 따랐습니다. 본문에 이름을 첨가하거나 경칭을 넣으면 원문의 서술적 관점을 변경하거나 신학적 존칭을 덧붙이는 효과가 있어 자의적 확대를 피했습니다.
  doctrine_reference: 'Translation principle: maintain author''s referent without adding later theological reverence'
