id: JHN.2.9
reference: John 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: Now when the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
  footnotes:
  - marker: a
    text: Or 'headwaiter' for 'master of the feast.' The Greek term refers to the one overseeing the banquet.
    reason: lexical_alternative
  - marker: b
    text: Greek 'the water having become wine'; alternatively, 'the water turned into wine.'
    reason: lexical_alternative
  - marker: c
    text: 'John uses a historical present here: ''calls,'' though English often renders it ''called.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 연회 책임자[a]가 물이 포도주가 된 것을[b] 맛보았을 때, 그는 그것이 어디에서 왔는지 알지 못했습니다. 그러나 그 물을 길어 온 시중드는 이들은 알고 있었습니다. 연회 책임자는 신랑을 부릅니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수석 시중’이라고 할 수 있습니다. 그리스어 용어는 연회를 감독하는 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘포도주가 된 물’입니다. 완전분사는 완료된 변화의 결과를 나타냅니다. 또는 ‘물이 포도주로 변한 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 요한은 여기에서 서사적 현재를 사용합니다. 원문은 현재형을 써서 이야기의 생생함을 높입니다. 한국어에서는 보통 과거형으로 옮기지만, 본문의 생동감을 살리기 위해 현재형을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  english_pob_choice: master of the feast
  chosen_korean: 연회 책임자
  alternatives_korean:
  - 수석 시중
  - 주최자
  - 우두머리
  lexicon: BDAG
  rationale: 그리스어 어절은 연회를 감독·주관하는 인물을 가리킵니다. '연회 책임자'는 사회적 역할을 분명히 전달하면서 한국어로 자연스럽고 중립적인 표현입니다.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  english_pob_choice: the water that had become wine
  chosen_korean: 물이 포도주가 된 것
  alternatives_korean:
  - 물이 포도주로 변한 것
  - 물이 포도주가 되어 있는 것
  lexicon: BDAG
  rationale: 원문의 완전분사 γεγενημένον은 완료된 변화와 현재의 결과를 나타냅니다. '물이 포도주가 된 것'은 그 완료된 상태를 과도한 부연 없이 전달합니다.
- source_word: διάκονοι
  english_pob_choice: servants
  chosen_korean: 시중들
  alternatives_korean:
  - 종들
  - 시종들
  - 종업원들
  lexicon: BDAG
  rationale: 이 서사적 맥락에서 식탁을 시중드는 사람들을 가리킵니다. 교회 직임 '집사'와 혼동되지 않도록 '시중들'을 선택했습니다.
- source_word: φωνεῖ
  english_pob_choice: calls
  chosen_korean: 부릅니다(서사적 현재)
  alternatives_korean:
  - 부르셨다(과거)
  - 부른다(평서형)
  lexicon: BDAG
  rationale: 요한 복음은 여기서 서사적 현재를 사용합니다. 본문 생생함을 유지하기 위해 한국어 정중체 현재 '부릅니다'로 보존했습니다(각주 c 참조).
theological_decisions:
- issue: Narrative description of the miracle
  chosen_reading: '원문대로 완전한 변화를 서술: ''물이 포도주가 된 것''으로 번역'
  alternative_readings:
  - '현상적 변화나 외관상의 변화로 완곡하게 옮기기(예: ''물이 포도주로 보였거나 향이 났다'')'
  rationale: 그리스어의 완전분사 γεγενημένον은 실제로 변화가 일어나 현재 그 결과가 존재함을 표지합니다. 불필요한 신학적 확대를 피하되, 텍스트가 분명히 진짜 변화로 말하고 있음을 그대로 반영해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 서사적 현재의 처리(φωνεῖ)
  chosen_reading: 요한의 서사적 현재를 살려 한국어 정중체 현재 '부릅니다'로 옮김
  alternative_readings:
  - '일반 서술 시 과거 시제로 평이하게 옮기기(예: ''불렀다'')'
  rationale: 서사적 현재는 이야기의 즉시성과 생동감을 전달합니다. 한국어에서도 의미 손실을 피하기 위해 현재형 정중체로 보존하되, 주석(각주 c)으로 독자에게 시제 판단 근거를 제공합니다.
  doctrine_reference: Narrative tense practice in POB
