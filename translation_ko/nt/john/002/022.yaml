  verdict: revise
  source_fidelity: 원문의 수동형 ἠγέρθη는 본문의 ‘일으킴을 받으셨다’로 적절히 보존되어 있습니다. 그러나 ὅτι τοῦτο ἔλεγεν을 ‘그가 이런 말을 하시고 계셨다는 것’으로 옮기면 단일한 ‘이것’보다 부정확하고, 예수님을 가리키는 존칭 주어와도 어울리지 않습니다. 불완료과의 지속·반복 가능성은 각주로 남기되 본문은 문맥상 자연스러운 단순 과거로 옮기는 것이 안전합니다.
  naturalness: ‘그가 이런 말을 하시고 계셨다는 것’은 존칭과 대명사의 결합이 어색하고, ‘이런 말’도 τοῦτο의 지시성을 약화합니다. ‘예수님께서 이 말씀을 하셨다는 것’이 현대 표준어 합쇼체 문체에서 자연스럽습니다. λόγος는 이 절에서 예수님의 앞선 발화를 가리키므로 ‘예수님께서 하신 말씀’이 자연스럽고 명확합니다.
