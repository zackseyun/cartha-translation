  to: 그러므로 예수님께서 죽은 자들 가운데서 일으킴을 받으셨을 때[a], 제자들은 예수님께서 이 말씀을 하셨다는 것을 기억하고[b], 성경과 예수님께서 하신 말씀[c]을 믿었습니다.
  rationale: 수동형 부활 표현, ‘성경’, 그리고 믿음의 목적어 구조는 유지했습니다. 다만 예수님을 지칭하는 표현을 일관된 존칭으로 고치고, τοῦτο를 ‘이 말씀’으로 분명히 했습니다. 불완료과의 가능한 지속성은 번역 본문에 진행상을 강제하지 않고 각주에서 보존했으며, λόγος 관련 각주는 해당 낱말에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:15Z'
