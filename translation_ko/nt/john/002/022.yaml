id: JHN.2.22
reference: John 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
  footnotes:
  - marker: a
    text: Or, 'he rose from the dead.' The Greek verb is passive ('was raised'), which is preserved in the main text.
    reason: lexical_alternative
  - marker: b
    text: Or, 'that he was saying this' or 'that he said this.' The imperfect verb may suggest repeated or ongoing prior speech.
    reason: lexical_alternative
  - marker: c
    text: Or, 'the statement' for 'the word.' The Greek term can refer to a spoken word, statement, or message.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수님께서 죽은 자들 가운데서 일으킴을 받으셨을 때[a], 제자들은 예수님께서 이 말씀을 하셨다는 것을 기억하고[b], 성경과 예수님께서 하신 말씀[c]을 믿었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예수님께서 죽은 자들 가운데서 일어나셨다.’ 그리스어 동사는 수동형(‘일으킴을 받으셨다’)이며, 본문은 그 수동 표현을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예수님께서 이 말씀을 하고 계셨다는 것’ 또는 ‘예수님께서 이 말씀을 말씀하시던 것.’ 그리스어 불완료과는 과거의 지속적이거나 반복적인 발화를 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘말씀’ 대신 ‘진술’ 또는 ‘메시지.’ 그리스어 λόγος는 말한 내용, 진술, 또는 메시지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  english_pob_choice: he was raised
  chosen_korean: 일으킴을 받으셨다
  alternatives_korean:
  - 일어나셨다
  - 일으키심을 받으셨다
  - 일으켜졌다
  lexicon: BDAG; Liddell-Scott
  rationale: 그리스어는 수동형으로, 한국어에서도 수동 표현을 유지하여 '주체(하나님)에 의해 일으킴을 받으셨다'는 문법적 뉘앙스를 보존했습니다. 존칭형 '-시-'를 사용해 예수님을 지칭하는 한국어 관습을 따랐습니다.
- source_word: ὅτι τοῦτο ἔλεγεν
  english_pob_choice: that he had been saying this
  chosen_korean: 그가 이런 말을 하시고 계셨다는 것
  alternatives_korean:
  - 그가 이런 말을 하셨다는 것
  - 그가 이런 말을 하고 있었다는 것
  lexicon: BDAG
  rationale: ἔλεγεν의 불완료과(imperfect)는 과거의 계속적·반복적 발화를 암시할 수 있어 한국어에서 '하시고 계셨다' 형태로 그 지속성을 살렸습니다; 대안으로 단순 과거형도 가능함을 표기합니다.
- source_word: ἐμνήσθησαν
  english_pob_choice: remembered
  chosen_korean: 기억하고
  alternatives_korean:
  - 기억하였다
  - 떠올렸다
  - 생각해냈다
  lexicon: BDAG
  rationale: 여기서는 어어적 연결을 위해 연결형 '-고'를 사용했으나 어근 의미는 '마음에 떠올리다/기억하다'로, 그리스어의 aorist가 한 번에 떠오른 사실을 묘사함을 반영합니다.
- source_word: τῇ γραφῇ καὶ τῷ λόγῳ
  english_pob_choice: the Scripture and the word
  chosen_korean: 성경과 예수님이 하신 그 말
  alternatives_korean:
  - 그 기록과 그 말씀
  - 성경과 그 진술
  lexicon: BDAG; Johannine usage
  rationale: γραφή의 단수형은 권위 있는 성문헌을 가리키므로 '성경'으로, λόγος는 바로 앞의 예수 말씀이므로 '예수님이 하신 그 말'로 연결해 번역했습니다(대안으로 '말씀' 또는 '진술'이 가능함).
theological_decisions:
- issue: Rendering the resurrection verb in passive voice
  chosen_reading: 일으킴을 받으셨다 (수동 보존)
  alternative_readings:
  - 예수님이 일어나셨다
  - 예수님이 일으키셨다
  rationale: 원문 그리스어가 수동형(ἠγέρθη)이므로 한국어에서도 수동을 보존하여 문법적·신학적 뉘앙스를 보존합니다(행위주체의 개입을 배제하거나 드러내는 문제와 직결됨).
  doctrine_reference: Affirmations; Translation principles (voice preservation)
- issue: Use of honorific language for Jesus in Korean narration
  chosen_reading: 예수님께서 ... 하시고 계셨다는 등 존칭 사용
  alternative_readings:
  - 예수님이 ... 했다 (비존칭 서술)
  - 예수께서 ... (다른 존칭 표현)
  rationale: 한국어 성경 번역 관습에서 예수님 인칭에 존칭 '-시-'를 쓰는 것이 독자 기대와 경건표현에 맞습니다. 문법적·의미적 충실성을 해치지 않도록 최소한의 존칭을 적용했습니다.
  doctrine_reference: Translation style guidelines; Korean Bible convention
