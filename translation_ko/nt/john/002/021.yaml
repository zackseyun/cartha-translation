  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
  footnotes:
  - marker: a
    text: Or 'sanctuary of his body'; the Greek word here is naos, which often refers more specifically to the inner temple than to the entire temple complex.
