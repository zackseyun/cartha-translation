id: JHN.4.12
reference: John 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
  footnotes:
  - marker: a
    text: Or, more explicitly, 'Surely you are not greater than our father Jacob, are you?' The Greek question with μή expects a negative answer.
    reason: lexical_alternative
translation:
  language: ko
  text: 설마 당신께서 우리 조상 야곱[a]보다 더 위대하십니까? 그는 우리에게 그 우물을 주었고, 그 자신도 그 우물에서 마셨으며, 그의 아들들과 가축들도 마셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신께서 우리 조상 야곱보다 더 위대하신 것은 아니겠지요?’ 그리스어의 μή로 시작하는 질문은 부정의 답변을 기대하는 수사적 질문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  english_pob_choice: Are you
  chosen_korean: 당신이 … 더 크십니까?
  alternatives_korean:
  - 확실히 당신은 … 더 크지 않습니까?
  - 당신은 … 더 크지 않습니까?
  lexicon: BDAG
  rationale: μή로 시작하는 질문은 부정의 대답을 기대하는 수사적 질문입니다. 영어 POB가 선택한 것처럼 한국어에서도 묻는 형식을 유지하여 원문의 수사적 긴장(질문자가 '아니오'를 기대함)을 보존합니다. 강조하는 σὺ는 한국어의 인칭표현('당신이')과 어순으로 전달합니다.
- source_word: μείζων
  english_pob_choice: greater than
  chosen_korean: 더 큰
  alternatives_korean:
  - 더 위대한
  - 더 뛰어난
  lexicon: BDAG
  rationale: 여기서 비교급은 지위나 위상(‘더 큰 사람’)을 가리키며 물리적 크기가 아닙니다. 간결하고 자연스러운 한국어 표현으로 '더 큰'을 선택했습니다.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  english_pob_choice: our father Jacob
  chosen_korean: 우리 아버지 야곱
  alternatives_korean:
  - 우리 조상 야곱
  - 야곱 우리 조상
  lexicon: BDAG
  rationale: 원문이 친족적·존칭적 언어를 사용하므로 '우리 아버지'라는 표현을 통해 청자의 경외와 계보적 연속성을 살렸습니다. 고유명사는 POB 표준에 따라 '야곱'으로 표기합니다.
- source_word: τὰ θρέμματα αὐτοῦ
  english_pob_choice: his livestock
  chosen_korean: 그의 가축들
  alternatives_korean:
  - 그의 가축
  - 그의 떼
  lexicon: BDAG
  rationale: θρέμματα는 사육되는 동물을 가리키는 포괄적 어휘이므로 한국어로도 범위를 좁히지 않고 '가축들'로 번역하여 원어의 의미를 보존합니다.
theological_decisions:
- issue: Force of the rhetorical question introduced by μή
  chosen_reading: 원문의 수사적 질문은 ‘아니오’라는 대답을 기대합니다 (수사적 부정 기대).
  alternative_readings:
  - 명시적 부정으로 번역하여 ‘당신은 우리 아버지 야곱보다 더 크지 않습니까?’라고 옮긴다.
  rationale: 그리스어 μή이 의문문에서 사용될 때 화자는 부정의 답변을 예상합니다. 한국어 번역은 영어 POB와 같이 묻는 형식을 유지하여 원문의 긴장과 화자의 반응(도전)을 훼손하지 않고 전달합니다.
  doctrine_reference: Translation philosophy §3, 긴장 보존(수사적 질문 유지)
