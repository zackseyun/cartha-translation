    reason: lexical_alternative
lexical_decisions:
- source_word: μαθηταὶ αὐτοῦ
  english_pob_choice: his disciples
  chosen_korean: 그의 제자들
  alternatives_korean:
  - 제자들
  - 예수의 제자들
  - 그 제자들
  lexicon: BDAG
  rationale: μαθηταί는 요한복음 서술에서 일관되게 '제자들'로 번역되는 표준 어휘이며, αὐτοῦ의 소유격은 문맥상 예수를 가리킵니다. '그의 제자들'은 소유관계를 분명히 하여 원문의 뜻을 충실히 전달합니다.
- source_word: ἀπεληλύθεισαν
  english_pob_choice: had gone away
  chosen_korean: 이미 떠나
  alternatives_korean:
  - 이미 떠났습니다
  - 이미 떠나갔습니다
  lexicon: BDAG
  rationale: 그리스어 미완료/완료 앞시제의 뉘앙스를 한국어로는 '이미'와 함께 표현하여 '이전에 떠나 있던 상태'를 전달합니다. 본문은 앞선 행위(떠남)를 설명하므로 '이미 떠나'가 적절합니다.
- source_word: εἰς τὴν πόλιν
  english_pob_choice: into the city
  chosen_korean: 도시
  alternatives_korean:
  - 마을
  - 읍
  - 성
  lexicon: BDAG
  rationale: πόλις는 기본적으로 '도시'를 의미하지만 문맥상 '마을'로 번역할 여지도 있습니다. 표준적이고 중립적인 번역으로 '도시'를 택하고, 문헌상 가능한 대안은 주석[a]로 표시했습니다.
- source_word: τροφὰς ἀγοράσωσιν
  english_pob_choice: to buy food
  chosen_korean: 음식을 사러
  alternatives_korean:
  - 식량을 사러
  - 식료품을 사러
  - 양식을 사러
  lexicon: BDAG
  rationale: τροφάς는 식품/양식을 뜻합니다. 현대 한국어 독자에게 자연스러운 표현으로 '음식을 사러'를 택했고, '식량' 등 다른 가능한 뉘앙스는 주석[b]으로 표시했습니다.
