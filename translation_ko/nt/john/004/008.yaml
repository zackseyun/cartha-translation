    rationale: γάρ gives the reason for the preceding statement. Korean “이는 … 때문입니다” preserves this explanatory relation.
  - severity: low
    issue: “떠나 … 갔습니다” duplicates the motion verb.
    rationale: The Greek has one pluperfect verb (ἀπεληλύθεισαν). A single natural Korean expression better represents it.
