  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his slaves met him, saying that his child was alive.
  footnotes:
  - marker: a
    text: Or 'his son'; Greek pais can mean 'child,' 'boy,' or in some contexts 'servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아직 내려가고 있을 때에 그의 종들이 그에게 만나 말하기를, 그 아이[a]가 살아 있다고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들’. 헬라어 pais는 ‘아이’, ‘소년’, 어떤 문맥에서는 ‘종’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  english_pob_choice: already
  chosen_korean: 아직
  alternatives_korean:
  - 이미
  - 벌써
  lexicon: BDAG
  rationale: ‘ἤδη’는 진행 중인 동작이 사건 시점에 이미 시작되어 있음을 나타내므로, 한국어에서는 자연스럽게 ‘아직 내려가고 있을 때에’로 풀어 시간적 선행을 살렸습니다.
- source_word: καταβαίνοντος
  english_pob_choice: was already going down
  chosen_korean: 내려가고 있을 때에
  alternatives_korean:
  - 내려가고 있던 때에
  - 내려가던 중에
  lexicon: BDAG
  rationale: 현재 분사 속 genitive absolute의 동시성을 살려, 단순 과거보다 진행 중인 상황을 드러내는 표현을 택했습니다.
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 시종들
  lexicon: BDAG
  rationale: 이 인물들은 집안에 속한 종속적 하인들이지만, 한국어 ‘노예들’은 현대 독자에게 과도하게 제도적·인종적 뉘앙스를 줄 수 있어, POB의 직접성을 유지하면서도 자연스러운 ‘종들’을 택했습니다.
- source_word: παῖς
  english_pob_choice: his child
  chosen_korean: 그 아이
  alternatives_korean:
  - 그의 아들
  - 그의 자녀
  - 그 아이
  lexicon: BDAG
  rationale: ‘παῖς’의 의미 범위가 넓고 이 절 자체는 성별을 명시하지 않으므로, ‘아들’로 좁히지 않고 ‘아이’로 옮겨 어휘적 폭을 보존했습니다.
theological_decisions:
- issue: παῖς의 지시 대상 범위
  chosen_reading: 그 아이
  alternative_readings:
  - 그의 아들
  - 그의 자녀
  rationale: 문맥상 치유받은 자녀를 가리키지만, 본 절의 어휘는 ‘아들’로 확정하지 않습니다. 번역문은 본문의 폭을 유지하고, 필요한 경우 다음 절의 문맥이 성별을 보완하도록 두었습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
