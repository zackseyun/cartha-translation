  source_fidelity: ‘아직’은 ἤδη(‘이미, 벌써’)와 반대되는 시간 의미를 낳으므로 ‘이미’로 고쳐야 합니다. 또한 ὑπήντησαν αὐτῷ는 종들이 그를 만난 사건이므로 ‘그에게 만나’가 아니라 목적어를 취한 ‘그를 만나’가 정확합니다. παῖς의 폭은 ‘그의 아이’와 각주로 적절히 보존됩니다.
  naturalness: 초안의 ‘그에게 만나 말하기를’은 현대 표준 한국어 합쇼체에서 문법적으로 부자연스럽고, ‘말하기를 … 하였습니다’는 서술이 중복됩니다. ‘그를 만나 … 말했습니다’가 자연스럽고 현대적인 서사체입니다.
  terminology: ‘종들’은 δοῦλοι의 사회적 종속성을 지나치게 완화하지 않으면서 한국어 성경 문체에도 맞습니다. ‘그의 아이’는 παῖς를 성별이나 친족 관계로 과도하게 한정하지 않으며, ‘아들’ 가능성은 각주로 남깁니다.
