  - severity: high
    issue: ‘그에게 만나’의 목적격 사용 오류
    rationale: ‘만나다’는 여기서 만나는 대상을 목적어로 취해야 합니다. 종들이 그를 만났으므로 ‘그를 만나’가 맞습니다.
