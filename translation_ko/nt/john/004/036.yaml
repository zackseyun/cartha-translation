id: JHN.4.36
reference: John 4:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
  footnotes:
  - marker: a
    text: Or 'reward' instead of 'wages.' The Greek term can denote either earned pay or recompense.
    reason: lexical_alternative
  - marker: b
    text: Or 'unto eternal life.' The phrase can express goal or result.
    reason: lexical_alternative
translation:
  language: ko
  text: 추수하는 사람은 삯을 받고[a] 영생에 이르는 열매를 거둡니다. 이는 뿌리는 사람과 추수하는 사람이 함께 기뻐하게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보상’입니다. 헬라어 용어는 노동의 대가인 삯이나 보상을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  english_pob_choice: the one who reaps
  chosen_korean: 추수하는 사람
  alternatives_korean:
  - 거두는 사람
  - 추수꾼
  lexicon: BDAG
  rationale: 분사구문을 명사화한 표현으로, 현대 한국어에서 자연스럽고 동작의 진행성을 살릴 수 있습니다.
- source_word: μισθὸν
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 보상
  - 급여
  - 상
  lexicon: BDAG
  rationale: μισθός의 노동 대가 이미지를 살리면서도, ‘보상’처럼 추상화하지 않기 위해 ‘삯’을 택했습니다.
- source_word: εἰς ζωὴν αἰώνιον
  english_pob_choice: for eternal life
  chosen_korean: 영생을 위하여
  alternatives_korean:
  - 영생에 이르도록
  - 영생을 향하여
  lexicon: BDAG
  rationale: εἰς의 목적/귀착을 한국어 목적격 구조로 자연스럽게 옮겼습니다.
- source_word: χαίρῃ
  english_pob_choice: may rejoice
  chosen_korean: 기뻐하게 하십니다
  alternatives_korean:
  - 기뻐하게 하십니다
  - 기뻐하도록 하십니다
  lexicon: BDAG
  rationale: ἵνα절의 목적 뉘앙스를 한국어 사역형으로 풀어, 함께 기뻐함이 의도된 결과임을 분명히 했습니다.
theological_decisions:
- issue: ‘추수’ 비유의 현재성
  chosen_reading: 현재형 서술을 그대로 살려, 추수가 이미 진행 중인 현실감을 유지했습니다.
  alternative_readings:
  - ‘이미’와 같은 부사를 덧붙여 현재성을 강화하는 읽기
  rationale: 본문 자체의 현재시제와 바로 앞뒤 문맥이 충분히 그 뉘앙스를 전달하므로, 본문에 없는 부사를 추가하지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-text primacy'
