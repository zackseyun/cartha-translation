revisions:
- from: 추수하는 사람은 삯을 받으며[a] 영생을 위하여 열매를 거두고, 뿌리는 사람과 추수하는 사람이 함께 기뻐하게 하십니다.
  to: 추수하는 사람은 삯을 받고[a] 영생에 이르는 열매를 거둡니다. 이는 뿌리는 사람과 추수하는 사람이 함께 기뻐하게 하려는 것입니다.
  rationale: The revision removes the unsupported causative honorific construction and renders the ἵνα clause as a formal Korean purpose statement. It also makes the relation of the fruit to eternal life clearer while retaining the source’s ambiguity concerning the precise goal/result force of εἰς.
  reviewer_model: gpt-5.6-terra
