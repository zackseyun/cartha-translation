review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the reaper, wages, gathering fruit, and the shared joy of sower and reaper. However, ‘기뻐하게 하십니다’ is a causative honorific expression with an implicit personal agent, not a direct rendering of the Greek ἵνα clause, whose stated subjects are the sower and the reaper themselves. ‘영생에 이르는 열매’ more clearly relates the gathered fruit to eternal life without suggesting that the reaper gathers it for his own benefit.
  naturalness: ‘추수하는 사람’ and ‘삯’ are natural in a modern formal biblical register. Recasting the final purpose clause as ‘이는 … 하려는 것입니다’ is idiomatic formal Korean and avoids an unlicensed implicit subject.
  terminology: ‘영생’ is the established and appropriate rendering of ζωή αἰώνιος. ‘삯’ preserves the concrete labor-payment imagery of μισθός; the lexical alternative footnote is useful. ‘추수하는 사람’ and ‘뿌리는 사람’ maintain the source’s participial parallelism.
  issues:
  - severity: medium
    issue: The final clause, ‘뿌리는 사람과 추수하는 사람이 함께 기뻐하게 하십니다,’ introduces an implicit honorific causative agent.
    rationale: Greek has ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων, ‘so that the one sowing and the one reaping may rejoice together.’ It does not state that someone ‘makes’ them rejoice, nor does it warrant the honorific ‘하십니다.’
  - severity: low
    issue: ‘영생을 위하여 열매를 거두고’ may attach the purpose primarily to the reaper’s action.
    rationale: εἰς ζωὴν αἰώνιον most directly qualifies the fruit being gathered in relation to eternal life. ‘영생에 이르는 열매’ better preserves that relation in Korean.
  revised_text: 추수하는 사람은 삯을 받고[a] 영생에 이르는 열매를 거둡니다. 이는 뿌리는 사람과 추수하는 사람이 함께 기뻐하게 하려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘보상’입니다. 헬라어 용어는 노동의 대가인 삯이나 보상을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported causative honorific construction and renders the ἵνα clause as a formal Korean purpose statement. It also makes the relation of the fruit to eternal life clearer while retaining the source’s ambiguity concerning the precise goal/result force of εἰς.
