revisions:
- from: 예수께서 그에게 말씀하셨습니다. “가십시오. 당신의 아들이 삽니다.” 그 사람은 예수께서 자기에게 하신 말씀을 믿고 떠나갔습니다.
  to: 예수께서 그에게 말씀하셨습니다. “가십시오. 아드님은 살아 있습니다.” 그 사람은 예수께서 그에게 하신 말씀을 믿고 길을 떠났습니다.
  rationale: 현재형 ζῇ의 ‘살아 있음’을 명확하고 자연스러운 한국어로 바로잡았습니다. 또한 공손한 합쇼체 대화에 맞게 ‘아드님’을 사용하고, 관계절의 ‘자기’가 가질 수 있는 지시적 어색함을 ‘그에게’로 해소했습니다. 마지막 동사는 포ρεύομαι의 출발·이동 의미를 자연스럽게 반영했습니다.
  reviewer_model: gpt-5.6-terra
