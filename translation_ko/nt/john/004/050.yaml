id: JHN.4.50
reference: John 4:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
  footnotes:
  - marker: a
    text: Or 'trusted the word that Jesus spoke to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “가십시오. 아드님은 살아 있습니다.” 그 사람은 예수께서 그에게 하신 말씀을 믿고 길을 떠났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορεύου
  english_pob_choice: Go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 떠나십시오
  - 가시기 바랍니다
  lexicon: BDAG
  rationale: 명령형 πορεύου의 직접적이고 간결한 의미를 살리면서, 예수의 말에 맞는 공손한 합쇼체로 옮겼습니다.
- source_word: ὁ υἱός σου
  english_pob_choice: your son
  chosen_korean: 당신의 아들
  alternatives_korean:
  - 아드님
  - 당신의 자녀
  lexicon: BDAG
  rationale: υἱός는 ‘아들’이므로 성별을 지우는 ‘자녀’보다 원문을 더 분명히 반영했습니다. 대화체 공손성을 위해 ‘당신의’로 정리했습니다.
- source_word: ζῇ
  english_pob_choice: lives
  chosen_korean: 삽니다
  alternatives_korean:
  - 살아 있습니다
  - 살아납니다
  lexicon: BDAG
  rationale: 현재형 ζῇ의 간결한 선언성을 살려 ‘삽니다’로 옮겼습니다. 이는 단순한 미래가 아니라 지금 살아 있음을 알리는 말입니다.
- source_word: ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ
  english_pob_choice: The man believed the word
  chosen_korean: 그 사람은 예수께서 자기에게 하신 말씀을 믿고
  alternatives_korean:
  - 그 사람은 그 말씀을 믿고
  - 그 사람은 예수의 말씀을 신뢰하고
  lexicon: BDAG
  rationale: λόγος를 단순히 ‘말씀’으로 두되 뒤의 관계절을 풀어 ‘예수께서 자기에게 하신 말씀’으로 밝혔습니다. ἐπίστευσεν은 프로젝트 기본값에 따라 ‘믿고’로 옮겼습니다.
- source_word: ἐπορεύετο
  english_pob_choice: went on his way
  chosen_korean: 떠나갔습니다
  alternatives_korean:
  - 가던 길을 갔습니다
  - 길을 떠났습니다
  lexicon: BDAG
  rationale: 미완료 과거의 진행성을 한국어에서 자연스럽게 드러내기 위해 ‘떠나갔습니다’로 옮겼습니다. 앞선 순종의 반응과 이어지는 동작을 간결하게 살렸습니다.
theological_decisions:
- issue: πιστεύω의 번역에서 ‘믿다’와 ‘신뢰하다’의 선택
  chosen_reading: 믿고
  alternative_readings:
  - 신뢰하고
  rationale: 이 절은 예수의 말에 대한 응답을 서술할 뿐이므로, 신학적 구분을 미리 결론짓지 않고 프로젝트 기본값인 ‘믿다’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (πίστις → 믿음; alternatives faithfulness, trust), and ''Preserve theological tension rather than resolve it.'''
