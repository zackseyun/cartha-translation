id: JHN.4.25
reference: John 4:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
  footnotes:
  - marker: a
    text: 'Greek: ''Messiah, the one called Christ.'' John explains the Semitic title Μεσσίας with the Greek title χριστός. Elsewhere in this translation, χριστός as a title is normally rendered ''Messiah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 그에게 말했습니다. “저는 메시아가 오신다는 것을 압니다[a]. 곧 오실 그분이 우리에게 모든 것을 말씀해 주실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 “메시아, 곧 그리스도”라는 이중 설명 구조를 갖습니다. 한국어 본문에서는 칭호를 ‘메시아’로 유지하고, 설명은 문맥 안에서 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  english_pob_choice: The woman said to him
  chosen_korean: 그 여자가 그에게 말했습니다
  alternatives_korean:
  - 그 여자가 그에게 말해요
  - 여자가 그에게 말했습니다
  lexicon: BDAG
  rationale: 현재형 서술을 한국어 서술문에서는 자연스러운 과거로 옮기되, 문맥상 특정 인물인 사마리아 여자를 분명히 드러내기 위해 ‘그 여자’를 썼습니다.
- source_word: Μεσσίας / χριστός
  english_pob_choice: Messiah / the one called Messiah
  chosen_korean: 메시아 / 메시아
  alternatives_korean:
  - 그리스도
  - 기름부음 받은 이
  lexicon: BDAG
  rationale: 두 용어가 병렬로 나오지만 둘 다 칭호로 기능하므로 기본 용례에 따라 ‘메시아’로 통일했습니다. 본문 안에서 한 칭호를 다른 칭호로 풀이하는 구조를 유지하기 위해 괄호 대신 ‘곧’ 구조로 뜻을 풀었습니다.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  english_pob_choice: When he comes
  chosen_korean: 곧 오실 그분이
  alternatives_korean:
  - 그가 오실 때
  - 그분이 오시면
  lexicon: BDAG
  rationale: 조건적 미래를 한국어에서 자연스럽게 나타내기 위해 ‘곧 오실’로 옮기고, 강조 대명사 ἐκεῖνος는 ‘그분’으로 살렸습니다.
- source_word: ἀναγγελεῖ ἡμῖν ⸀ἅπαντα
  english_pob_choice: he will tell us all things
  chosen_korean: 우리에게 모든 것을 말씀해 주실 것입니다
  alternatives_korean:
  - 우리에게 다 말씀하실 것입니다
  - 우리에게 모든 일을 알려 주실 것입니다
  lexicon: BDAG
  rationale: ἀναγγελεῖ는 단순한 ‘알리다’보다 내용 전체를 분명히 밝혀 주는 뜻이 있어, 존대와 문맥을 살린 ‘말씀해 주실 것입니다’로 옮겼습니다. ἅπαντα는 ‘모든 것’이 가장 직접적입니다.
theological_decisions:
- issue: 메시아 칭호와 예언적 기대의 표현 방식
  chosen_reading: ‘메시아’로 직역적 칭호를 유지하고, 이어지는 설명은 본문 흐름 안에서 풀어 썼습니다.
  alternative_readings:
  - 그리스도라고 옮기기
  - 주석으로만 풀기
  rationale: 이 구절은 사마리아 여인이 종말론적 기대를 말하는 장면이므로, 전통 교회 용어보다 원어 칭호의 의미를 직접 드러내는 것이 소스 충실성에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; contested terms table for Χριστός'
