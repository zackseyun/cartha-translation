id: JHN.4.52
reference: John 4:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
  footnotes:
  - marker: a
    text: Or, 'at one o’clock,' if the hour is reckoned from sunrise; some understand John's timekeeping differently.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 그는 그들에게 그 아이가 나아지기 시작한 시각을 물었습니다. 그러자 그들이 그에게 말했습니다. “어제 제칠 시[a]에 열이 그를 떠났습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 해 뜬 때부터 시간을 셈하는 방식이라면 ‘오후 1시쯤’입니다. 요한의 시간 표기를 다르게 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο
  english_pob_choice: he asked
  chosen_korean: 물었습니다
  alternatives_korean:
  - 물어보았습니다
  - 알아보았습니다
  lexicon: BDAG
  rationale: πυνθάνομαι는 문맥상 상대에게 시간을 묻는 뜻이므로, 자연스러운 현대 한국어로 ‘물었습니다’가 가장 직접적입니다.
- source_word: τὴν ὥραν
  english_pob_choice: the hour
  chosen_korean: 그 나아진 때
  alternatives_korean:
  - 그 시간
  - 그 시각
  lexicon: BDAG
  rationale: 직역하면 ‘그 시간’이지만, 여기서는 병이 나아지기 시작한 시점을 가리키므로 문맥을 살려 ‘나아진 때’로 옮겼습니다.
- source_word: ὥραν ἑβδόμην
  english_pob_choice: the seventh hour
  chosen_korean: 일곱 시
  alternatives_korean:
  - 일곱째 시
  - 제7시
  lexicon: BDAG
  rationale: 그리스어의 시간 표지를 한국어에서 가장 자연스럽게 보존한 표현은 ‘일곱 시’이며, 본문이 어떤 시간 계산법을 전제하는지는 확정하지 않았습니다.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  english_pob_choice: the fever left him
  chosen_korean: 열이 그를 떠났습니다
  alternatives_korean:
  - 열이 그에게서 떠났습니다
  - 열이 사라졌습니다
  lexicon: BDAG
  rationale: 주어-목적어 구조를 살리기 위해 ‘열이 그를 떠났습니다’로 옮겼고, 병세 완화의 인격화된 표현을 유지했습니다.
theological_decisions:
- issue: ‘일곱 시’의 시간 계산을 현대 시각으로 환산할지 여부
  chosen_reading: 본문은 그대로 ‘일곱 시’로 두고, 어느 계산 체계인지 본문에서 확정하지 않았습니다.
  alternative_readings:
  - 오전 1시경(해 뜬 뒤 일곱째 시)
  - 오후 7시경(로마식 계산)
  rationale: 요한복음 본문은 시간 계산 방식을 명시하지 않으므로, 번역이 그 모호성을 미리 해소하지 않도록 했습니다.
  doctrine_reference: '번역 원칙 §3: 본문의 긴장과 모호성을 불필요하게 해소하지 않는다.'
