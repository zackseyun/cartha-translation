  verdict: revise
  source_fidelity: ‘그 나아진 때’는 κομψότερον ἔσχεν이 가리키는 병세가 호전되기 시작한 시점을 다소 부자연스럽고 불명확하게 표현합니다. ‘일곱 시’는 현대 한국어에서 통상 특정 시계 시각으로 이해될 수 있으므로, 원문의 시간 계산법의 불확정성을 보존하는 표현으로 바꾸는 것이 좋습니다.
  naturalness: ‘그 아이가 나아지기 시작한 시각’은 지시 대상과 시간적 의미를 분명히 하면서도 현대 표준 한국어에 자연스럽습니다. ‘그러자 그들이 그에게 말했습니다’도 합쇼체 서술에 맞습니다.
  terminology: ‘제칠 시’는 현대 시계상의 ‘일곱 시’로 성급히 환산하지 않고 ὥραν ἑβδόμην을 보존합니다. 각주의 ‘오전 1시쯤’은 해 뜬 때부터 계산할 경우의 통상적 환산과 맞지 않으므로 ‘오후 1시쯤’으로 바로잡아야 합니다. 각주 표지도 시간 표현에 붙여야 합니다.
