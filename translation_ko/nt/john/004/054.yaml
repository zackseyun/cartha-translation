  source_fidelity: 수정이 필요합니다. 초안은 δεύτερον σημεῖον을 '두 번째 표적'으로, ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν을 '유대에서 갈릴리로 오신 뒤에'로 적절히 옮겼습니다. 그러나 πάλιν('다시')이 번역문에서 누락되었습니다. '뒤에'는 ἐλθὼν의 선행 시간 관계를 나타낼 수는 있어도 πάλιν의 반복 의미를 대신하지 못합니다.
  naturalness: '''이것은 예수께서 유대에서 갈릴리로 오신 뒤에 다시 행하신 두 번째 표적이었습니다''는 현대 표준어 합쇼체로 자연스럽고, 요한복음의 서술 문체에도 적절합니다.'
  terminology: σημεῖον은 요한복음의 문학적·신학적 용례를 보존하도록 '표적'으로 유지하는 것이 적절합니다. 영어 POB의 lexical-alternative 주석도 한국어 번역문에서 표적에 연결해 보존하는 것이 좋습니다.
  issues:
