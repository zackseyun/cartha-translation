id: JHN.4.54
reference: John 4:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
  footnotes:
  - marker: a
    text: Or "miracle." John commonly uses "sign" to emphasize the act's meaning as well as its power.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 예수께서 유대에서 갈릴리로 오신 뒤에 다시 행하신 두 번째 표적[a]이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기적”. 요한복음은 이 행위의 능력뿐 아니라 그 의미도 강조하기 위해 흔히 “표적”이라는 말을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  english_pob_choice: This
  chosen_korean: 이것은
  alternatives_korean:
  - 이 일은
  - 이것이
  lexicon: BDAG
  rationale: 앞서 나온 치유 사건을 가리키는 지시어이므로, 자연스러운 문맥 연결을 살려 '이것은'으로 옮겼습니다.
- source_word: πάλιν
  english_pob_choice: again
  chosen_korean: 뒤에
  alternatives_korean:
  - 다시
  - 또
  lexicon: BDAG
  rationale: 문장 전체의 시간 관계를 매끄럽게 하기 위해 '오신 뒤에'로 풀어, 'again'이 가진 순서상 반복/이후성을 한국어 문맥에서 반영했습니다.
- source_word: δεύτερον σημεῖον
  english_pob_choice: the second sign
  chosen_korean: 두 번째 표적
  alternatives_korean:
  - 두 번째 기적
  - 둘째 표징
  lexicon: BDAG
  rationale: 요한복음의 σημεῖον은 단순한 기적보다 의미를 드러내는 '표적'이 적절하므로, POB의 'sign'을 '표적'으로 대응시켰습니다.
- source_word: ἐποίησεν
  english_pob_choice: did
  chosen_korean: 행하신
  alternatives_korean:
  - 하신
  - 베푸신
  lexicon: BDAG
  rationale: 표적과 결합된 ποιέω는 한국어에서 행위의 수행을 드러내는 '행하다'가 자연스럽고, 서술체로도 무리 없습니다.
theological_decisions:
- issue: σημεῖον의 요한복음 내 신학적 기능
  chosen_reading: '''표적''으로 번역하여 사건의 의미를 드러내는 기능을 보존했습니다.'
  alternative_readings:
  - 기적
  - 이적
  rationale: 요한복음에서 σημεῖον은 놀라운 일 자체보다 예수의 정체를 가리키는 기능이 핵심이므로, 신학적 중립성이 덜한 '기적'보다 '표적'이 본문의 의도를 더 잘 살립니다.
  doctrine_reference: Translation philosophy §1, §5
