    rationale: 원문의 πάλιν은 이 표적이 반복되는 순서 가운데 있음을 표시합니다. 초안의 '오신 뒤에'는 ἐλθὼν의 시간 관계를 표현할 뿐, πάλιν을 번역하지 않습니다.
