id: JHN.4.11
reference: John 4:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
  footnotes:
  - marker: a
    text: Or “Sir.” The Greek κύριε is a respectful form of address and can mean either “Lord” or “Sir” depending on context.
    reason: alternative_reading
  - marker: b
    text: Or “running water,” that is, fresh flowing water as opposed to stagnant water. The wording also preserves the deeper sense intended in Jesus’ statement.
    reason: lexical_alternative
translation:
  language: ko
  text: 여인이 그에게 말합니다. 「주님[a], 양동이도 없으시고 우물도 깊지 않습니다[b]. 그러면 어디서 생수를 얻으십니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님”/“아저씨”. 헬라어 κύριε는 경칭으로 문맥에 따라 '주님' 또는 단순한 공경의 호칭(=sir, '선생님/아저씨')으로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “흐르는 물(문자적)” — 즉 고여 있는 물과 대비되는 신선한 흐르는 물. 이 표현은 예수의 비유적 의미도 포함하므로 본문에는 '생수'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 아저씨
  - 주인
  lexicon: BDAG
  rationale: 프로젝트 기본 규정에 따라 κύριος의 지정어를 '주님'으로 유지했습니다. 여기서는 사마리아 여인이 예수에게 경칭으로 말하는 장면이므로 본문에서는 경의어 '주님'을 사용하고, 경칭으로서의 덜 신학적인 대안은 주석(각주 a)에 남겼습니다.
- source_word: ἄντλημα
  english_pob_choice: bucket
  chosen_korean: 양동이
  alternatives_korean:
  - 물 긷는 그릇
  - 물동이
  - 바가지
  lexicon: BDAG
  rationale: 물긷는 도구를 가리키는 일반적 어휘로 '양동이'가 현대 한국어에서 자연스럽고 장면에 적합합니다.
- source_word: τὸ φρέαρ
  english_pob_choice: the well
  chosen_korean: 우물
  alternatives_korean:
  - 구덩이
  - 저수지
  - 물웅덩이
  lexicon: BDAG
  rationale: φρέαρ는 물을 긷는 우물을 가리키는 표준어입니다. 맥락상 '우물'이 가장 적절합니다.
- source_word: τὸ ὕδωρ τὸ ζῶν
  english_pob_choice: the living water
  chosen_korean: 생수
  alternatives_korean:
  - 흐르는 물
  - 살아 있는 물
  - 맑은 물
  lexicon: BDAG
  rationale: 요한복음의 문맥에서는 문자적 '흐르는 물'의 의미와 예수의 비유적·구원론적 의미가 중첩됩니다. '생수'는 짧고 한국어 독자에게 두 겹의 의미(신선한 물·영적 생명)를 전달하므로 본문에 채택하고, 문자적 대안은 주석(각주 b)에 남겼습니다.
theological_decisions:
- issue: 여인이 예수를 부르는 κύριε의 번역
  chosen_reading: 주님(경칭으로 번역하되, 본문에서 프로젝트 규정의 기본어 사용)
  alternative_readings:
  - 선생님/아저씨(단순한 경칭)
  - 주인(지배적 호칭)
  rationale: DOCTRINE.md의 규정에 따라 κύριος는 기본적으로 '주님'으로 표기합니다. 그러나 본문상 사마리아 여인이 단순한 경칭으로 사용했을 가능성도 있어 그 대안은 각주로 남겨 독자가 신학적 함의를 과도하게 부여하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: τὸ ὕδωρ τὸ ζῶν의 중의성(문자적 흐르는 물 vs. 신학적 생수)
  chosen_reading: 생수(원어의 중의성을 보존)
  alternative_readings:
  - 흐르는 물(문자적)
  - 살아 있는 물(직역 형태)
  rationale: 요한복음은 이 표현을 비유적·문자적 의미로 동시에 담고 있으므로 '생수'라는 한국어 표현이 두 층의 의미를 보존합니다. 문자적 대안은 각주로 제시했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
