id: JHN.4.23
reference: John 4:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
  footnotes:
  - marker: a
    text: Or 'in the Spirit'; the Greek can denote worship empowered by the Holy Spirit, worship in the human spirit, or worship characterized by spiritual reality.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 한 시간이 오고 있고, 지금 이미 왔습니다. 참된 예배자들은 아버지를 영과 진리 안에서 예배할 것입니다. 왜냐하면 아버지께서는 바로 그런 사람들을 자기에게 예배하는 이들로 찾으시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞 절과의 대비를 자연스럽게 살리되, 담화 전환을 부드럽게 이어 주는 역접으로 옮겼습니다.
- source_word: ἔρχεται ὥρα / καὶ νῦν ἐστιν
  english_pob_choice: an hour is coming / and is now here
  chosen_korean: 한 시간이 오고 있고, 지금 이미 왔습니다
  alternatives_korean:
  - 때가 오고 있고, 지금 이미 왔습니다
  - 한 때가 오고 있고, 지금 이미 왔습니다
  lexicon: BDAG
  rationale: 요한복음의 종말론적 표현을 살리기 위해 '한 시간'과 '오고 있다/왔습니다'의 긴장을 유지했습니다.
- source_word: πνεύματι καὶ ἀληθείᾳ
  english_pob_choice: in spirit and truth
  chosen_korean: 영과 진리 안에서
  alternatives_korean:
  - 영 안에서와 진리 안에서
  - 성령 안에서와 진리 안에서
  lexicon: BDAG
  rationale: ἐν의 구문을 한국어에서는 '안에서'로 자연스럽게 풀어 주되, πνεύματι의 의미 범위를 좁히지 않기 위해 '성령'으로 특정하지 않았습니다.
- source_word: ζητεῖ
  english_pob_choice: is indeed seeking
  chosen_korean: 찾으시기 때문입니다
  alternatives_korean:
  - 구하고 계시기 때문입니다
  - 찾고 계시기 때문입니다
  lexicon: BDAG
  rationale: καὶ γάρ의 이유 제시를 살리면서, 하나님이 이런 사람들을 찾으신다는 능동성을 한국어 동사 '찾다'로 간결하게 옮겼습니다.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  english_pob_choice: to worship him
  chosen_korean: 자기에게 예배하는 이들
  alternatives_korean:
  - 자기를 예배하는 이들
  - 그분께 예배하는 이들
  lexicon: BDAG
  rationale: participial phrase를 목적적 구문으로 자연화하되, '예배하다'를 유지해 λατρεία가 아닌 προσκυνέω의 예배 행위를 드러냈습니다.
theological_decisions:
- issue: ἐν πνεύματι의 범위
  chosen_reading: main text는 '영'으로 두어 인간의 영, 성령, 영적 실재라는 문맥적 가능성을 열어 두었습니다.
  alternative_readings:
  - 성령 안에서
  - 영적으로
  rationale: 본문이 의도적으로 남겨 둔 신학적 긴장을 해치지 않기 위해 단정적으로 한 방향으로 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
