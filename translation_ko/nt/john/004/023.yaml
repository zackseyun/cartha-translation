revisions:
- from: 그러나 한 시간이 오고 있고, 지금 이미 왔습니다. 참된 예배자들은 아버지를 영과 진리 안에서 예배할 것입니다. 왜냐하면 아버지께서는 바로 그런 사람들을 자기에게 예배하는 이들로 찾으시기 때문입니다.
  to: 그러나 참된 예배자들이 영[a]과 진리로 아버지께 예배할 때가 오고 있으며, 지금이 바로 그때입니다. 왜냐하면 아버지께서는 바로 그러한, 곧 자신에게 예배하는 사람들을 찾으시기 때문입니다.
  rationale: 한국어의 자연스러운 요한복음 문체를 위해 ‘때’를 사용하되, ἔρχεται와 νῦν ἐστιν의 미래 도래와 현재 실현의 긴장을 ‘오고 있으며, 지금이 바로 그때입니다’로 보존했습니다. πνεύματι의 신학적으로 논쟁 가능한 범위는 본문에서 해소하지 않고 각주로만 밝혔습니다. 마지막 절은 ‘아버지께서도’처럼 καί에 별도 대명사적 의미를 부여하지 않고 ‘바로’로 강조를 자연스럽게 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:58Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘한 시간이’는 헬라어의 무관사 ὥρα를 형식적으로 반영하려 한 것이지만, 한국어 성경 문맥에서는 부자연스럽고 요한복음의 관용적 표현인 ‘때’를 훼손합니다. 또한 καὶ νῦν ἐστιν은 ‘지금 이미 왔습니다’보다 ‘지금이 바로 그때입니다’처럼 현재 실현을 나타내야 합니다. 마지막 절의 현재분사 τοὺς προσκυνοῦντας αὐτόν은 하나님께 예배하는 사람들을 수식하므로 이를 명료하게 반영했습니다.
  naturalness: ‘영과 진리 안에서’와 ‘자기에게 예배하는 이들로 찾으시기’는 직역투입니다. ‘영과 진리로 아버지께 예배하다’, ‘자신에게 예배하는 사람들을 찾으시다’가 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘참된 예배자’, ‘아버지’, ‘영’, ‘진리’, ‘예배’는 유지했습니다. πνεύματι의 성령/인간의 영/영적 실재에 관한 모호성은 본문에서 ‘영’으로 보존하고, 영어 POB 감사 기록에 상응하는 각주를 추가했습니다.
  issues:
  - severity: medium
    issue: ‘한 시간이 오고 있고, 지금 이미 왔습니다’
    rationale: ‘한 시간’은 한국어에서 60분의 시간 단위로 우선 이해되어 문맥상 부자연스럽습니다. 또한 νῦν ἐστιν은 ‘이미 왔다’보다 그 때가 현재라는 실현된 현재를 말합니다.
  - severity: medium
    issue: ‘영과 진리 안에서’
    rationale: 한국어에서는 이 표현이 부자연스럽고, 헬라어 ἐν이 함께 걸리는 두 명사를 ‘영과 진리로’로 옮기는 것이 자연스럽습니다. 이때 ‘영’의 지시 대상은 각주로 열어 둡니다.
  - severity: medium
    issue: ‘자기에게 예배하는 이들로 찾으시기’
    rationale: ‘-로 찾다’는 원문의 목적어 구조를 한국어에서 어색하게 만듭니다. τοιούτους와 이를 수식하는 현재분사를 ‘그러한, 곧 자신에게 예배하는 사람들’로 옮겨 구조와 의미를 보존합니다.
  revised_text: 그러나 참된 예배자들이 영[a]과 진리로 아버지께 예배할 때가 오고 있으며, 지금이 바로 그때입니다. 왜냐하면 아버지께서는 바로 그러한, 곧 자신에게 예배하는 사람들을 찾으시기 때문입니다.
  revised_footnotes:
