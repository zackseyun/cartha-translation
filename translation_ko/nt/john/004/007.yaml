id: JHN.4.7
reference: John 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
  footnotes:
  - marker: a
    text: Or, more literally, “comes … says”; the Greek uses historical presents in the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 사마리아에서 온 한 여자가 물을 길으러 왔습니다. 예수께서 그녀에게 말씀하셨습니다[a]. “내게 마실 것을 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘오다 … 말하다’로, 원문 그리스어는 이 서술에서 역사적 현재(현재형 사용)를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 온다
  - 왔어요
  lexicon: BDAG
  rationale: 그리스어 현재는 서술에서 역사적 현재로 쓰였습니다. 한국어 서술에서 과거형(왔습니다)이 더 자연스럽고 이야기 흐름을 보존합니다.
- source_word: γυνὴ; ἐκ τῆς Σαμαρείας
  english_pob_choice: a woman from Samaria
  chosen_korean: 사마리아에서 온 한 여자
  alternatives_korean:
  - 사마리아 여인
  - 사마리아 출신의 여자
  lexicon: BDAG
  rationale: 원문은 출신·장소를 표시하며 명시적 민족·종파 표지를 요구하지 않습니다. '사마리아에서 온 한 여자'는 원문의 미지시성과 장소표시를 그대로 살립니다.
- source_word: ἀντλῆσαι ὕδωρ
  english_pob_choice: to draw water
  chosen_korean: 물을 길으러
  alternatives_korean:
  - 물을 길어 오러
  - 물을 길러 오러
  lexicon: BDAG
  rationale: 부정사(목적)를 나타내므로 한국어로도 목적구문('...하러')으로 옮기는 것이 자연스럽습니다. '물을 길으러'가 가장 직역적이고 통용됩니다.
- source_word: λέγει αὐτῇ; Δός μοι πεῖν
  english_pob_choice: said to her; Give me a drink
  chosen_korean: 예수께서 그녀에게 말씀하셨습니다. '내게 마실 것을 주십시오.'
  alternatives_korean:
  - 예수께서 그녀에게 말했습니다. '물 한 모금 주십시오.'
  - 예수께서 그녀에게 말씀하십니다. '내게 마실 것을 주십시오.'
  lexicon: BDAG
  rationale: 예수를 주어로 삼을 때 한국어 관습상 존칭형(예수께서 … 말씀하셨습니다)을 사용했습니다. 명령형(Δός)과 목적의 부정사(πεῖν)는 '마실 것을 주십시오'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: Reference of 'Samaria'
  chosen_reading: 사마리아에서 온 한 여자(출신·장소 표지로 번역)
  alternative_readings:
  - 사마리아인(민족적·종파적 표지로 번역)
  - 사마리아 도시 출신(구체적 도시 표지)
  rationale: 그리스어는 단순히 출신지를 말할 뿐 민족적·종파적 정체성을 명시하지 않습니다. 과잉해석을 피하고 원문이 기록한 정보만 옮겼습니다.
  doctrine_reference: '원문 우선 번역 원칙: 원어가 독자에게 제공한 정보를 보존합니다.'
