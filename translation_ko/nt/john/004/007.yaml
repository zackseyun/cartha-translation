translation:
  language: ko
  text: 사마리아에서 온 한 여자가 물을 길으러 왔습니다. 예수께서 그녀에게 말씀하셨습니다[a]. “내게 마실 것을 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
