revisions:
- from: 그리고 그 동네의 많은 사마리아 사람들이 그 여자가 증언하는 말을 인하여 그분을 믿게 되었습니다. “그분이 내가 한 모든 일을 말씀해 주셨습니다.”
  to: 그리고 그 동네에서 사마리아 사람들 가운데 많은 이들이 그 여자가 “그분이 내가 한 모든 일을 말씀해 주셨습니다”라고 증언한 말 때문에 그분을 믿었습니다.
  rationale: 장소적 출처(ἐκ), 부분적 집단 표현, 믿음의 단순 과거 서술을 정확히 반영하도록 고쳤습니다. 여자의 증언과 그 인용 내용을 한국어 문장 안에서 자연스럽게 연결하되, λόγος를 ‘말’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:54Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 ἐκ은 장소적 출처를 나타내므로 ‘그 동네의’보다 ‘그 동네에서’가 정확합니다. 또한 ἐπίστευσαν은 단순 과거 서술이므로 원인·결과의 추가 뉘앙스를 띠는 ‘믿게 되었습니다’보다 ‘믿었습니다’가 적절합니다. 인용 내용은 γυναῖκος μαρτυρούσης의 증언 내용으로 명시적으로 연결했습니다.
  naturalness: ‘말을 인하여’는 현대 표준어 합쇼체 성경 번역으로 다소 문어적이고 부자연스럽습니다. ‘…라고 증언한 말 때문에’는 λόγος의 ‘말/증언’ 의미와 원인 관계를 자연스럽게 드러냅니다.
  terminology: ‘사마리아 사람들 가운데 많은 이들’은 τῶν Σαμαριτῶν의 부분성을 보존합니다. ‘그분을 믿었습니다’는 πιστεύω εἰς αὐτόν의 인격을 향한 믿음을 유지하며, 교리적 확장을 더하지 않습니다. ‘그분이 … 말씀해 주셨습니다’는 한국어의 일관된 존칭 표현으로 인용문의 자연스러움을 유지합니다.
  issues:
  - severity: medium
    issue: ‘그 동네의’
    rationale: Ἐκ δὲ τῆς πόλεως ἐκείνης의 ἐκ은 소유·귀속이 아니라 ‘그 동네에서/from that town’라는 출처를 나타냅니다.
  - severity: medium
    issue: ‘믿게 되었습니다’
    rationale: ἐπίστευσαν은 단순히 그들이 믿었다고 서술합니다. ‘-게 되다’는 본문에 없는 변화·결과의 뉘앙스를 덧붙일 수 있습니다.
  - severity: low
    issue: ‘증언하는 말을 인하여’
    rationale: 현재분사와 λόγος를 직역적으로 겹친 표현이 현대 한국어에서 어색합니다. 인용문을 증언의 내용으로 연결하고 ‘때문에’를 쓰는 편이 자연스럽습니다.
  revised_text: 그리고 그 동네에서 사마리아 사람들 가운데 많은 이들이 그 여자가 “그분이 내가 한 모든 일을 말씀해 주셨습니다”라고 증언한 말 때문에 그분을 믿었습니다.
  revised_footnotes: []
  revision_rationale: 장소적 출처(ἐκ), 부분적 집단 표현, 믿음의 단순 과거 서술을 정확히 반영하도록 고쳤습니다. 여자의 증언과 그 인용 내용을 한국어 문장 안에서 자연스럽게 연결하되, λόγος를 ‘말’로 유지했습니다.
