id: JHN.4.39
reference: John 4:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
  footnotes:
  - marker: a
    text: Or “because of the woman’s message.” The Greek word λόγος can mean “word,” “message,” or “report.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 동네에서 사마리아 사람들 가운데 많은 이들이 그 여자가 “그분이 내가 한 모든 일을 말씀해 주셨습니다”라고 증언한 말 때문에 그분을 믿었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  english_pob_choice: And ... from that town
  chosen_korean: 그리고 그 동네의
  alternatives_korean:
  - 그리고 그 도시의
  - 그 동네에서
  lexicon: BDAG
  rationale: ἐκ은 출처·기원을 나타내므로 한국어에서도 ‘-의’로 귀속을 살렸고, πόλις는 이 문맥의 사마리아 정착지에 자연스러운 ‘동네’로 옮겼습니다.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  english_pob_choice: many of the Samaritans
  chosen_korean: 많은 사마리아 사람들
  alternatives_korean:
  - 사마리아 사람들 가운데 많은 이들
  - 많은 사마리아 사람들
  lexicon: BDAG
  rationale: 부분적 소속을 자연스럽게 드러내기 위해 ‘많은 사마리아 사람들’로 옮겨, ‘many of the Samaritans’의 뜻을 간결하게 살렸습니다.
- source_word: ἐπίστευσαν εἰς αὐτόν
  english_pob_choice: believed in him
  chosen_korean: 그분을 믿게 되었습니다
  alternatives_korean:
  - 그분을 믿었습니다
  - 그분께 믿음을 두었습니다
  lexicon: BDAG
  rationale: εἰς가 지닌 방향성을 살려 단순한 동의가 아니라 ‘그분을 향한 믿음’으로 읽히도록 했습니다.
- source_word: διὰ τὸν λόγον
  english_pob_choice: because of the word
  chosen_korean: 말을 인하여
  alternatives_korean:
  - 말 때문에
  - 메시지 때문에
  lexicon: BDAG
  rationale: λόγος의 의미 범위를 열어 두면서도 요한복음의 ‘말’ 표현을 유지하기 위해 ‘말’을 택했습니다. ‘인하여’는 원인 관계를 분명히 합니다.
- source_word: μαρτυρούσης
  english_pob_choice: who was testifying
  chosen_korean: 증언하는
  alternatives_korean:
  - 증언하고 있는
  - 증언하던
  lexicon: BDAG
  rationale: 현재분사의 진행성을 살리되 한국어 문장에서는 관계절보다 분사형이 더 자연스러워 ‘증언하는’으로 처리했습니다.
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  english_pob_choice: He told me everything I did
  chosen_korean: 내가 한 모든 일을 말씀해 주셨습니다
  alternatives_korean:
  - 내가 한 모든 것을 말씀해 주셨습니다
  - 내가 한 일을 다 말씀해 주셨습니다
  lexicon: BDAG
  rationale: λέγω는 여기서 ‘말하다’보다 청자에게 내용을 알려 주는 의미가 강해 ‘말씀해 주셨습니다’로 옮겼고, πάντα ἃ ἐποίησα는 ‘내가 한 모든 일’로 간명하게 반영했습니다.
theological_decisions:
- issue: 요한복음의 πιστεύω εἰς 표현
  chosen_reading: 그분을 믿게 되었습니다
  alternative_readings:
  - 그분을 믿었습니다
  - 그분께 믿음을 두었습니다
  rationale: 본문은 예수에 대한 실제적인 믿음을 서술하며, 추가적인 교리적 설명을 덧붙이지 않고 관계적 방향성을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3
