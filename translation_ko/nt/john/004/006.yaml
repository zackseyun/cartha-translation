id: JHN.4.6
reference: John 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Now Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
  footnotes:
  - marker: a
    text: Or 'spring'; Greek πηγή can denote a spring or a well.
    reason: lexical_alternative
  - marker: b
    text: Or 'was sitting thus,' possibly implying 'just as he was' or 'in this way.'
    reason: lexical_alternative
  - marker: c
    text: That is, approximately noon if counted by Jewish daylight hours.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에 야곱의 우물이 있었습니다[a]. 그래서 예수께서 여행으로 지치셔서 우물가에 그렇게 앉아 계셨습니다[b]. 때는 대략 여섯째 시간이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '샘' — 그리스어 πηγή는 샘(스프링)이나 우물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그렇게 앉아 있었다' — οὕτως(οὕτω)는 '그렇게/있는 그대로' 등 여러 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 유대식 낮 시간 계산으로는 대략 정오를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγή
  english_pob_choice: well
  chosen_korean: 우물
  alternatives_korean:
  - 샘
  - 샘터
  lexicon: BDAG
  rationale: πηγή는 샘(spring)이나 우물(well)을 가리킬 수 있으나, 본문 맥락과 물 길어 올리는 장소로서의 전통적 이해는 '우물'을 더 자연스럽게 만듭니다. 대안 '샘'은 원어의 가능성을 보존하기 위해 주석[a]으로 남겼습니다.
- source_word: κεκοπιακὼς
  english_pob_choice: wearied
  chosen_korean: 지치다(지치셔서)
  alternatives_korean:
  - 피곤하다
  - 힘이 다하다
  lexicon: BDAG
  rationale: κοπιάω의 완료 분사는 수고의 결과로서의 상태를 나타내므로 '지치다'가 그 상태를 그대로 전달합니다(문장에서는 경어형 '지치셔서'로 표현).
- source_word: ἐκαθέζετο · οὕτως · ἐπὶ τῇ πηγῇ
  english_pob_choice: was sitting · there · by the well
  chosen_korean: 우물가에 그렇게 앉아 계셨습니다
  alternatives_korean:
  - 우물가에 앉아 계셨다
  - 우물가에 그렇게 앉아 있었다
  - 우물가에 앉아 있었다
  lexicon: BDAG
  rationale: ἐκαθέζετο의 미완료적 서술은 진행·상태를 드러내므로 '앉아 계셨습니다'가 적절합니다. οὕτως는 '그렇게/그 자리에서' 등으로 해석될 수 있어 의미의 불확실성을 [b]로 표시했습니다.
- source_word: ὥρα ἦν ὡς ἕκτη
  english_pob_choice: It was about the sixth hour
  chosen_korean: 대략 여섯째 시간이었습니다
  alternatives_korean:
  - 대략 정오였다
  - 대략 낮 여섯째 시간이었다
  lexicon: BDAG
  rationale: 원어 표현을 그대로 살려 '여섯째 시간'이라고 번역해 본문의 시간표현에서 생기는 신학적·해석학적 긴장을 보존합니다(해석상 '정오'가 될 수 있음을 주석[c]에 보존).
theological_decisions:
- issue: Time reference in 'the sixth hour'
  chosen_reading: 본문의 문자적 '여섯째 시간' 표현을 본문 번역에 그대로 유지
  alternative_readings:
  - 대략 정오로 번역(독자 친화적 해석)
  - 로마식 시간 계산을 따른다면 오후 6시로 읽을 가능성 제시
  rationale: 요한복음의 시간표현은 신학적·서사적 함의를 가지므로 본문 자체의 표현을 보존하여 독자가 원문적 긴장을 경험하도록 하는 것이 원칙입니다. 해석적 보충은 주석[c]에서 제공합니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 해소하기보다 보존한다.'
