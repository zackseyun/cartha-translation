id: JHN.4.1
reference: John 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
  footnotes:
  - marker: a
    text: Or 'Jesus was making more disciples and baptizing more than John.' The Greek can be read with the comparison applying to the combined activity rather than only to 'disciples.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수께서 바리새인들이 예수께서 요한보다 더 많은 제자들을 만들고 또 세례를 베풀고 있다는 소식을 들었다는 것을 아셨습니다[a]—
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '예수께서 제자들을 더 많이 만들고 세례도 더 많이 베풀었다'로 읽을 수도 있습니다. 그리스어는 비교 구문이 결합된 두 동사(ποιεῖ καὶ βαπτίζει)에 모두 적용될 수도 있으므로, 비교의 범위가 '제자들'에만 한정되지 않는 읽기가 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  english_pob_choice: Therefore, when
  chosen_korean: 그러므로 ... 아셨습니다
  alternatives_korean:
  - 그때
  - 그리하여
  lexicon: BDAG
  rationale: Ὡς marks a temporal clause ('when') while οὖν signals narrative inference ('therefore/so'). '그러므로' preserves the inferential force and the clause retains the temporal sense by the subordinate clause ending—'아셨습니다'.
- source_word: βαπτίζει
  english_pob_choice: baptizing
  chosen_korean: 세례를 베풀고 있다는
  alternatives_korean:
  - 세례를 주고 있다는
  - 침수(침례)하고 있다는
  lexicon: BDAG
  rationale: βαπτίζει is the standard NT verb for baptism. '세례를 베풀다' is a neutral, transparent Korean equivalent that keeps the ritual sense without adopting a denominational term; the progressive '있다는' matches the Greek present.
- source_word: πλείονας μαθητὰς … ἢ Ἰωάννης
  english_pob_choice: more disciples … than John
  chosen_korean: 요한보다 더 많은 제자들을
  alternatives_korean:
  - 제자들을 더 많이 만들고(또한) 세례도 더 많이 베풀었다
  - 제자들과 세례 둘 다에서 요한보다 더 많았다
  lexicon: BDAG
  rationale: The comparative πλείονας modifies μαθητὰς ('more disciples'); the Greek comparison can plausibly scope over the coordinated verbs (ποιεῖ καὶ βαπτίζει). I render the straightforward comparative on '제자들' and mark the ambiguity with a footnote so the reader can see the alternative scoping.
theological_decisions:
- issue: Possible implication that 예수께서 개인적으로 세례를 베푸셨다는 인상
  chosen_reading: 본문의 표면적 어구를 보존하여 '예수께서 ... 세례를 베풀고 있다'라고 번역하되, 다음 4:2에서의 명확화가 본문 전체의 해석을 보완하도록 둔다.
  alternative_readings:
  - 4:1을 4:2의 정보를 미리 반영하여 '예수의 무리가 더 많은 제자를 만들고 세례를 베풀었다'처럼 번역해 본문을 조화시킨다.
  rationale: 원문은 4:1에서 예수가 제자들을 만들고 세례를 베푸는 것으로 말하지만 4:2가 곧 '예수 자신이 세례를 베풀지 아니하셨다'고 명시한다. 번역은 본문의 문언을 그대로 유지하여 신학적 긴장을 보존하고, 다음 구절의 명시적 설명이 독자로 하여금 전체 상황을 이해하게 하도록 한다.
  doctrine_reference: 원문 충실성 — 신학적 긴장 보존
