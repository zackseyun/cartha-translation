id: JHN.4.53
reference: John 4:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
  footnotes:
  - marker: a
    text: Or “Your son is alive.”
    reason: lexical_alternative
  - marker: b
    text: The verb “believed” may refer either to believing Jesus' word specifically or to coming to faith in Jesus more fully; the Greek leaves the scope implicit.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 그 아버지는, 예수께서 그에게 「네 아들이 살고 있다」[a]고 말씀하신 바로 그때였음을 알게 되었고, 그 자신도 믿었으며, 그의 온 집안도 그러했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 아들이 살아 있다.”
    reason: lexical_alternative
  - marker: b
    text: ‘믿었다’는 예수의 말씀 자체를 믿은 것인지, 예수께 대한 더 충만한 믿음에 이른 것인지 그 범위가 본문에 분명히 드러나지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω οὖν
  english_pob_choice: So the father knew
  chosen_korean: 그러므로 그 아버지는 … 알게 되었고
  alternatives_korean:
  - 그래서 그 아버지는 … 알았고
  - 그러므로 아버지는 … 깨달았고
  lexicon: BDAG
  rationale: οὖν의 인과적 연결을 ‘그러므로’로 살리고, ἔγνω는 단순한 인지의 결과를 나타내므로 ‘알게 되었습니다’가 자연스럽고 원문에 가깝습니다.
- source_word: Ὁ υἱός σου ζῇ
  english_pob_choice: Your son lives
  chosen_korean: 「네 아들이 살고 있다」
  alternatives_korean:
  - 「네 아들이 살아 있다」
  - 「네 아들은 살았다」
  lexicon: BDAG
  rationale: ζῇ는 현재의 생존 상태를 선언하므로 ‘살고 있다’가 가장 직접적입니다. ‘살아 있다’도 가능하지만, 동작성 있는 현재 진술을 덜 분명하게 만듭니다.
- source_word: ἐπίστευσεν αὐτὸς
  english_pob_choice: he himself believed
  chosen_korean: 그 자신도 믿었으며
  alternatives_korean:
  - 그도 믿었으며
  - 그 자신이 믿었으며
  lexicon: BDAG
  rationale: αὐτός의 강조를 살리기 위해 ‘그 자신도’로 옮겼습니다. 이는 단순한 주어 반복보다 개인적 반응을 더 분명히 드러냅니다.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  english_pob_choice: his whole household
  chosen_korean: 그의 온 집안도
  alternatives_korean:
  - 그의 온 가정도
  - 그의 모든 식구도
  lexicon: BDAG
  rationale: οἰκία는 건물이 아니라 가정/가족 공동체를 가리키므로 ‘집안’이 적절합니다. ὅλη는 ‘온’으로 자연스럽게 전체성을 나타냅니다.
theological_decisions:
- issue: 아버지의 믿음의 범위
  chosen_reading: 본문은 아버지가 믿었다고 말할 뿐, 그 믿음이 예수의 말씀에 대한 신뢰인지 예수 자신에 대한 더 충만한 믿음인지는 확정하지 않습니다.
  alternative_readings:
  - 예수의 치유 말씀만 믿었다
  - 이 시점에 더 완전한 구원적 믿음에 이르렀다
  rationale: 요한복음의 πιστεύω는 신학적으로 깊을 수 있지만, 이 절 자체는 믿음의 범위를 명시하지 않습니다. 따라서 원문의 긴장을 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
