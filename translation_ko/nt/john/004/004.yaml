id: JHN.4.4
reference: John 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: Now he had to pass through Samaria[a].
  footnotes:
  - marker: a
    text: Or "it was necessary for him to go through Samaria." The Greek states necessity without specifying its exact basis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사마리아를 지나가야 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 사마리아를 지나가야 할 필요가 있었습니다”라고 번역할 수 있습니다. 헬라어는 필요성을 말하지만, 그 근거가 무엇인지는 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  english_pob_choice: had to
  chosen_korean: 지나가야만 했다
  alternatives_korean:
  - 지나가야 했다
  - 가야 할 필요가 있었다
  - 가야만 했다
  lexicon: BDAG
  rationale: ἔδει는 과거 시점의 필요성을 나타내므로 한국어에서 자연스러운 서술형 과거 필요성 표현 '지나가야만 했다'로 옮겨 원문의 강한 필요성 어감을 유지했습니다.
- source_word: δὲ
  english_pob_choice: Now
  chosen_korean: —
  alternatives_korean:
  - 그런데
  - 그리고
  - 이어서
  lexicon: BDAG
  rationale: 여기서 δὲ는 서사적 전환을 표지하므로 한국어 본문에는 별도 접속사 없이 문맥 연결만 살려 자연스럽게 처리했습니다.
- source_word: αὐτὸν
  english_pob_choice: he
  chosen_korean: 그는
  alternatives_korean:
  - 그를
  - 예수님은
  - 그분은
  lexicon: BDAG
  rationale: 헬라어의 대명사 αὐτόν은 문맥상 주어를 가리키므로 영어의 'he'처럼 한국어에서는 '그는'으로 옮겨 원문의 지시성을 보존했습니다(원문은 이름을 새로 도입하지 않습니다).
- source_word: διέρχεσθαι διὰ τῆς Σαμαρείας
  english_pob_choice: pass through Samaria
  chosen_korean: 사마리아를 지나가다
  alternatives_korean:
  - 사마리아 지역을 지나가다
  - 사마리아를 통해 가다
  - 사마리아를 거쳐 가다
  lexicon: BDAG
  rationale: διά + 장소는 '…을 통과하다/지나가다'의 뜻이므로 간결한 '사마리아를 지나가다'로 옮겨 지리적 이동을 그대로 전달했습니다.
theological_decisions:
- issue: Force of necessity in ἔδει
  chosen_reading: 본문은 필요성을 '지나가야만 했다'로 표기하되, 필요성의 근거는 밝히지 않음(지리적 편의, 사회적 이유, 또는 신적 목적 가능성 모두 열어둠).
  alternative_readings:
  - 단순한 지리적 편의(경로상으로 지나가는 것)
  - 신적/사명적 필연성(예수의 사역을 위한 하나님의 목적)
  rationale: 원문은 필요성을 진술하지만 원인을 명시하지 않으므로 번역은 필요성의 사실만 전달하고 그 원인은 해석자에게 맡깁니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: Referent choice for αὐτόν (pronoun) vs. explicit '예수님'
  chosen_reading: 원문 대명사를 반영하여 한국어로는 '그는'으로 처리함; 인물을 예명(예수님)으로 명시하지 않음.
  alternative_readings:
  - '''예수님은''으로 명시하여 독자에게 인물을 분명히 함'
  - '''그분은'' 등 경칭 사용'
  rationale: 원문의 대명사 표현을 유지하면 본문 연속성에서 출처-충실도를 살릴 수 있으므로 불필요한 명시를 피했습니다. 문맥상 독자가 이전 문맥에서 인물을 알 수 있지만, 이름을 덧붙이는 것은 원문에 없는 정보의 추가가 됩니다.
  doctrine_reference: Translation fidelity to source-language deixis.
