id: JHN.4.49
reference: John 4:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
  footnotes:
  - marker: a
    text: Or “Sir.” The Greek word is κύριε, a respectful address that can also mean “Lord.”
    reason: alternative_reading
translation:
  language: ko
  text: 그 왕의 신하가 그에게 말했습니다[a]. “주님, 내 아이가 죽기 전에 내려오십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님.” 여기의 헬라어 κύριε는 존칭으로, ‘주님’이나 ‘선생님’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  english_pob_choice: the royal official
  chosen_korean: 그 왕의 신하
  alternatives_korean:
  - 왕의 관리
  - 궁정 관리
  - 왕의 장교
  lexicon: BDAG
  rationale: βασιλικός은 왕이나 왕실에 속한 사람을 가리키는 실질적 명사로 쓰였으므로, ‘신하’가 왕실 소속을 자연스럽게 드러내면서도 신분을 과도하게 특정하지 않습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - sir
  - 주
  lexicon: BDAG
  rationale: κύριε는 존칭 주소로서 ‘주님’이 POB의 기본 대응을 살리며, 이 장면에서 예수께 대한 존중과 더 넓은 서술적 울림을 함께 보존합니다.
- source_word: κατάβηθι
  english_pob_choice: come down
  chosen_korean: 내려오십시오
  alternatives_korean:
  - 내려가십시오
  - 와 주십시오
  lexicon: BDAG
  rationale: καταβαίνω의 지시형은 문자적으로 ‘내려오다’이므로, 지리적 방향성을 유지하면서 한국어 명령·요청체로 자연스럽게 옮겼습니다.
- source_word: τὸ παιδίον μου
  english_pob_choice: my child
  chosen_korean: 내 아이
  alternatives_korean:
  - 내 자녀
  - 내 아들
  - 내 어린아이
  lexicon: BDAG
  rationale: παιδίον은 성별보다 ‘어린 자녀’의 의미가 중심이므로, 원문의 일반성을 살려 ‘아이’로 옮겼습니다.
theological_decisions:
- issue: κύριε의 예수 호칭 번역과 존칭 뉘앙스
  chosen_reading: 주님
  alternative_readings:
  - 선생님
  - 주
  rationale: 이 본문은 단순 예절 표현을 넘는 복음서적 호칭의 층위를 보존하는 것이 중요하므로, 표준 번역값인 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (κύριος → Lord); John narrative Christology'
