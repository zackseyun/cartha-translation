id: JHN.4.38
reference: John 4:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
  footnotes:
  - marker: a
    text: Or 'to harvest.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you have entered into the fruit of their labor' or 'you have shared in their work.' The Greek more literally says 'you have entered into their labor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 보내어 너희가 수고하지 않은 것을 추수하게 하였습니다[a]. 다른 이들이 수고하였고, 너희는 그들의 수고에 참여하게 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거두게’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희는 그들의 수고의 열매를 얻게 되었다’ 또는 ‘너희는 그들의 일에 참여하였다’. 그리스어는 더 문자적으로 ‘너희는 그들의 수고 속으로 들어갔다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  english_pob_choice: sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈습니다
  - 파송하였습니다
  lexicon: BDAG
  rationale: 완료된 파송 행위를 자연스럽게 드러내면서도, 예수의 파송이라는 선교적 힘을 유지하기 위해 ‘보내어’를 택했습니다.
- source_word: θερίζειν
  english_pob_choice: to reap
  chosen_korean: 추수하게
  alternatives_korean:
  - 거두게
  - 수확하게
  lexicon: BDAG
  rationale: 농사 비유를 살리되 현대 한국어에서 자연스러운 ‘추수하다’로 옮겼습니다. 본문의 비유를 직역 수준에서 보존합니다.
- source_word: κεκοπιάκατε / κεκοπιάκασιν / κόπον
  english_pob_choice: have not labored for / have labored / labor
  chosen_korean: 수고하지 않은 것 / 수고하였으며 / 수고 속
  alternatives_korean:
  - 일하지 않은 것 / 일하였으며 / 일 속
  - 노동하지 않은 것 / 노동하였으며 / 노동 속
  lexicon: BDAG
  rationale: 동사 κοπιάω와 명사 κόπος의 어근 연결을 한국어에서도 반복되는 ‘수고’로 최대한 드러내어, 앞뒤의 의미 연계를 보존했습니다.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  english_pob_choice: you have entered into their labor
  chosen_korean: 그들의 수고 속으로 들어갔습니다
  alternatives_korean:
  - 그들의 수고 안으로 들어갔습니다
  - 그들의 수고에 참여하였습니다
  lexicon: BDAG
  rationale: 그리스어가 결과물보다 ‘그들의 수고’ 자체를 말하므로, POB의 직역 방향을 따라 ‘속으로 들어갔습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘others’의 지시 대상
  chosen_reading: 본문이 말하는 ‘다른 이들’의 범위를 특정하지 않고 그대로 두었습니다.
  alternative_readings:
  - 선지자들을 가리킨다
  - 세례 요한을 가리킨다
  - 예수 자신의 사역까지 포함한다
  rationale: 본문 자체가 지시 대상을 열어 두므로, 해석을 좁히지 않고 비유적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
