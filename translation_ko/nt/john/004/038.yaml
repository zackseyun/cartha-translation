review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν을 잘 반영하지만, 원문의 목적어 ὃ οὐχ ὑμεῖς κεκοπιάκατε가 ‘추수하게 하였습니다’에 직접 연결되도록 어순을 조정하는 것이 더 정확합니다. 마지막 구절은 ‘수고 속으로 들어갔습니다’가 지나치게 직역적이고 한국어로는 부자연스러우므로, εἰσεληλύθατε의 참여·진입 이미지를 보존하는 ‘수고에 참여하게 되었습니다’로 옮기고 문자적 표현은 각주에서 밝혔습니다.
  naturalness: ‘너희는 수고하지 않은 것을 추수하였고’도 이해되지만 원문의 파송 목적을 흐리게 할 수 있습니다. ‘너희가 수고하지 않은 것을 추수하게 하였습니다’가 자연스럽고 구조도 분명합니다. ‘그들의 수고 속으로 들어갔습니다’는 현대 표준 한국어에서 어색한 비유이므로 수정이 필요합니다.
  terminology: ‘추수하다’는 θερίζειν의 농경 비유를 적절히 보존합니다. κοπιάω와 κόπος의 연관은 ‘수고하다/수고’로 유지했습니다. ‘다른 이들’은 지시 대상을 특정하지 않아 본문의 의도적 모호성을 보존합니다.
  issues:
  - severity: medium
    issue: 첫 문장에서 관계절의 연결이 다소 불분명합니다.
    rationale: ὃ οὐχ ὑμεῖς κεκοπιάκατε는 ‘추수하다’의 목적어입니다. 이를 ‘보내어 … 추수하게 하였습니다’ 안에 배치하면 헬라어 구문과 파송의 목적이 더 분명해집니다.
  - severity: medium
    issue: ‘그들의 수고 속으로 들어갔습니다’는 한국어 표현으로 부자연스럽습니다.
    rationale: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε는 문자적으로는 ‘그들의 수고 안으로 들어왔다’이지만, 한국어에서는 ‘수고에 참여하게 되었습니다’가 자연스럽게 참여의 뜻을 전달합니다. 문자적 표현은 각주로 보존할 수 있습니다.
  - severity: medium
    issue: 각주 b의 표지가 ‘다른 이들이 수고하였으며’에 붙어 있어 각주 내용의 대상 구절과 맞지 않습니다.
    rationale: 각주 b는 마지막 절 ‘너희는 그들의 수고에 참여하게 되었습니다’ 및 그 문자적 번역을 설명하므로 해당 절 뒤에 붙여야 합니다.
