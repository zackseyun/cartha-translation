source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
  footnotes:
  - marker: a
    text: The verbs 'see' and 'believe' are plural in Greek, so Jesus' words likely extend beyond the official himself to a wider group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수께서 그에게 말씀하셨습니다. “너희가 표적과 이적을 보지 않으면, 결코 믿지 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어에서 ‘보다’와 ‘믿다’가 복수형이므로, 이 말씀은 앞서 언급된 관리 한 사람만이 아니라 더 넓은 대상을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν οὖν
  english_pob_choice: So ... said
  chosen_korean: 그러자 ... 말씀하셨습니다
  alternatives_korean:
  - 그때 ... 말씀하셨습니다
  - 그래서 ... 말씀하셨습니다
  lexicon: BDAG
  rationale: οὖν은 앞 대화의 흐름을 잇는 접속어이므로, 한국어에서는 자연스러운 인과·전환 표현인 ‘그러자’로 옮겨 서술의 연속성을 살렸습니다.
- source_word: πρὸς αὐτόν
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그 사람에게
  - 그에게로
  lexicon: BDAG
  rationale: 말하기 동사의 방향을 나타내는 πρός + 대격은 가장 직접적으로 ‘그에게’로 옮기는 것이 자연스럽고, 문맥상 특정 인물에게 한 말임을 충분히 드러냅니다.
- source_word: σημεῖα καὶ τέρατα
  english_pob_choice: signs and wonders
  chosen_korean: 표적들과 이적들
  alternatives_korean:
  - 징표들과 놀라운 일들
  - 표징들과 기이한 일들
  lexicon: BDAG
  rationale: 요한복음의 σημεῖον은 단순한 기적보다 의미를 지시하는 ‘표적’이 적합하고, τέρατα는 초자연적 경이를 가리키므로 관용적 대응어인 ‘이적’으로 옮겼습니다. 복수형도 살려 각각 복수 표지를 반영했습니다.
- source_word: οὐ μὴ πιστεύσητε
  english_pob_choice: you will certainly not believe
  chosen_korean: 결코 믿지 않을 것입니다
  alternatives_korean:
  - 절대로 믿지 않을 것입니다
  - 정말로 믿지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μὴ + 접속법은 강한 부정을 나타내므로, 한국어에서는 ‘결코’로 그 절대적 거절감을 살렸습니다. ‘믿다’는 요한복음의 πιστεύω에 가장 직접적인 대응어입니다.
theological_decisions:
- issue: 복수형 ‘너희’의 범위
  chosen_reading: 본문은 앞에서 한 사람에게 말하는 형식이지만, 동사들이 복수형이므로 예수의 말씀은 그 개인을 넘어 더 넓은 청중이나 태도를 향해 있습니다.
  alternative_readings:
  - 전부 단수로 이해하여 ‘그대가 ... 보지 않으면’으로 좁게 옮김
  - 복수성을 풀어서 ‘너희들’처럼 노골적으로 확장함
  rationale: 헬라어 복수형을 한국어 본문에서 ‘너희’로 드러내면, POB가 지적한 대로 개인을 넘는 적용 범위를 보존하면서도 본문을 과도하게 확장하지 않습니다.
  doctrine_reference: 본문의 수적 긴장을 해소하지 않고 유지합니다.
