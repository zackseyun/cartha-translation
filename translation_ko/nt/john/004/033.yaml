  naturalness: ‘그래서 제자들은 서로 말하고 있었습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. 인용문도 ‘설마 누가 그분께 먹을 것을 가져다드렸겠습니까?’로 하면 존대와 질문의 부정 예상이 자연스럽게 함께 나타납니다.
