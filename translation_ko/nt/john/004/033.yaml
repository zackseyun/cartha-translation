translation:
  language: ko
  text: 그런데 제자들은 서로 말하고 있었습니다. 「누가 그분께 무엇인가 먹을 것을 가져다드렸을까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  english_pob_choice: were saying
  chosen_korean: 말하고 있었습니다
  alternatives_korean:
  - 말했습니다
  - 서로 말하였습니다
  lexicon: BDAG
  rationale: 미완료시제의 진행·반복적 뉘앙스를 살려 장면 속에서 계속 오간 대화를 자연스러운 한국어로 옮겼습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그런데
  alternatives_korean:
  - 그러므로
  - 그래서
  lexicon: BDAG
  rationale: 앞 문맥에서 이어지는 서술적 연결을 살리면서도 현대 한국어에서 자연스러운 전환을 택했습니다.
- source_word: πρὸς ἀλλήλους
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 서로에게
  - 한데
  lexicon: BDAG
  rationale: 상호 발화를 간결하게 드러내는 표현으로 처리하여, 제자들끼리 나누는 말임을 분명히 했습니다.
- source_word: Μή τις ἤνεγκεν αὐτῷ φαγεῖν
  english_pob_choice: Has anyone brought him something to eat?
  chosen_korean: 누가 그분께 무엇인가 먹을 것을 가져다드렸을까?
  alternatives_korean:
  - 누가 그분께 먹을 것을 가져다드렸을까?
  - 설마 누가 그분께 먹을 것을 가져다드린 것은 아닐까?
  lexicon: BDAG
  rationale: μή τις가 기대하는 부정적 답을 담은 추측성 질문이므로, 단순 정보질문보다 추정형으로 옮기되 의미를 과장하지 않았습니다. '가져다드리다'는 예수께 향한 공손한 목적어 관계를 자연스럽게 살렸습니다.
theological_decisions:
- issue: μή τις가 만드는 부정 예상 질문의 뉘앙스
  chosen_reading: 추측성 질문으로 처리해 제자들의 의문과 부정을 함께 드러냈습니다.
  alternative_readings:
  - 그냥 정보질문으로 옮김
  - 부정 서술문으로 재구성
  rationale: 헬라어 μή의 기대 답변이 부정이라는 점을 한국어에서 자연스럽게 보존하려면, 단순한 평서문보다 추정형 질문이 더 적절합니다.
  doctrine_reference: 문법적-담화적 처리
