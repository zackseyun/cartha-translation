  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
  footnotes:
  - marker: a
    text: Or, more literally, 'For you have had five men, and the one you now have is not your man/husband.' The Greek word ἀνήρ can mean 'man' or 'husband'; here the context favors 'husband.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 다섯 남편[a]을 가졌고, 지금 함께 있는 이는 당신의 남편이 아닙니다. 당신이 한 말은 참입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 보다 문자적으로 ‘당신은 다섯 명의 남자를 가졌고…’라고 번역될 수 있습니다. 그리스어 ἀνήρ는 ‘남자’ 또는 ‘남편’을 의미할 수 있으며, 본문 맥락은 ‘남편’의 의미를 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρας
  english_pob_choice: husbands
  chosen_korean: 다섯 남편
  alternatives_korean:
  - 다섯 명의 남자
  - 다섯 남자
  lexicon: BDAG
  rationale: ἀνήρ의 맥락상 과거의 결혼 관계를 가리키므로 '남편'으로 번역하는 것이 관계적 의미를 살립니다. 한국어에서 수량을 분명히 하기 위해 '다섯'을 유지했습니다.
- source_word: ἔσχες
  english_pob_choice: you have had
  chosen_korean: 가졌고
  alternatives_korean:
  - 가졌습니다
  - 가진 적이 있습니다
  lexicon: BDAG
  rationale: 그리스어 ἔσχες(aorist)는 과거의 경험을 가리키므로 한국어에서는 간결한 과거·완료 의미를 전달하는 '가졌고'를 사용하여 다음 절과 자연스럽게 이어지게 했습니다.
- source_word: οὐκ ἔστιν σου ἀνήρ
  english_pob_choice: is not your husband
  chosen_korean: 당신의 남편이 아닙니다
  alternatives_korean:
  - 당신에게 남편이 아니다
  - 당신의 남자가 아니다
  lexicon: BDAG
  rationale: σου(당신의)와 ἀνήρ의 소유관계를 명확히 하기 위해 한국어 자연어 표현인 '당신의 남편'을 선택했습니다. 이는 앞의 '남편들'과 대조되어 원문 의미를 드러냅니다.
theological_decisions:
- issue: Sense of ἀνήρ in both occurrences
  chosen_reading: 첫 번째 ἀνήρ(복수형 ἄνδρας)은 '남편들'(다섯 남편)로, 두 번째 ἀνήρ는 단수 '남편'으로 번역
  alternative_readings:
  - 두 번 모두 문자적으로 '남자(사람)'로 번역
  - 첫 번째를 '남자들', 두 번째를 '남자'로 번역
  rationale: 문맥상 예수의 발언은 여자의 결혼 이력(과거의 배우자들)과 현재의 비혼(혹은 혼인관계가 아님)을 대조하므로, 첫 번째는 결혼관계로서의 '남편들'로, 두 번째는 현재관계의 부재를 가리키는 '남편'으로 읽는 것이 원문 의도를 충실히 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
