id: JHN.4.26
reference: John 4:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
  footnotes:
  - marker: a
    text: Or, “I am he, the one speaking to you.” The Greek reads simply, “I am, the one speaking to you,” with the implied identification supplied from the context of the Messiah in the previous verse.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그 여자에게 말씀하셨습니다. “나는 그 사람입니다. 당신에게 말하고 있는 이 사람입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: BDAG
  rationale: 서술형 현재를 한국어에서는 자연스러운 과거 서술로 옮기되, 예수의 발화이므로 평범한 ‘말했습니다’보다 조금 더 경건한 ‘말씀하셨습니다’를 택했습니다.
- source_word: αὐτῇ
  english_pob_choice: to her
  chosen_korean: 그 여자에게
  alternatives_korean:
  - 그녀에게
  - 그에게
  lexicon: BDAG
  rationale: 앞 문맥의 사마리아 여인을 가리키므로 한국어에서는 지시를 분명하게 해 주는 ‘그 여자에게’가 가장 자연스럽습니다.
- source_word: Ἐγώ εἰμι
  english_pob_choice: I am
  chosen_korean: 나는 그 사람입니다
  alternatives_korean:
  - 나는 있습니다
  - 내가 그입니다
  lexicon: BDAG
  rationale: 헬라어는 문자적으로 ‘나는 있다/이다’이지만, 문맥상 앞절의 메시아를 가리키는 자기 식별이므로 한국어에서는 그 함의를 드러내되 ‘그’(he)를 문맥상 보충했습니다.
- source_word: ὁ λαλῶν σοι
  english_pob_choice: the one speaking to you
  chosen_korean: 당신에게 말하고 있는 이 사람입니다
  alternatives_korean:
  - 당신에게 말하는 이입니다
  - 당신에게 이야기하고 있는 이 사람입니다
  lexicon: BDAG
  rationale: 현재분사 구문을 한국어의 관계절로 옮기되, 예수의 자기지시를 분명히 하기 위해 ‘이 사람입니다’를 붙였습니다.
theological_decisions:
- issue: Ἐγώ εἰμι의 직역성과 문맥적 명시성
  chosen_reading: 본문에는 없는 ‘그’ 해석을 완전히 숨기지 않되, 문맥상 드러나는 메시아 자기 계시를 한국어 문장 안에 자연스럽게 반영했습니다.
  alternative_readings:
  - 나는 입니다
  - 나는 그입니다
  rationale: 이 절은 4:25의 ‘메시아’ 문맥 속에서 예수의 정체를 밝히는 장면이므로, 의미는 드러내되 지나친 확장은 피하는 방향이 적절합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve contextual identification without over-expanding the source.'
