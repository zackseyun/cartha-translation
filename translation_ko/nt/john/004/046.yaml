  source_fidelity: 본문의 사건 순서와 핵심 의미는 대체로 충실합니다. 다만 βασιλικός는 왕과 관련된 관리를 가리키므로 ‘왕의 관리’가 ‘왕의 신하’보다 직무적 의미를 더 정확히 드러냅니다. 또한 현 초안의 각주 표지는 해당 각주 내용과 일치하지 않습니다.
  naturalness: ‘그러므로’와 ‘다시 갈릴리의 가나에 오셨습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. ‘왕의 관리 한 사람이 있었는데’도 자연스럽고 간결합니다.
  terminology: 가나, 갈릴리, 가버나움 및 ‘포도주’는 적절합니다. βασιλικός는 직위를 단정하지 않으면서 왕실과의 관계를 나타내는 ‘왕의 관리’로 옮기는 것이 적절합니다.
