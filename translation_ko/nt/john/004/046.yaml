id: JHN.4.46
reference: John 4:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'where he turned the water into wine.' The Greek reads more literally, 'where he had made the water wine.'
    reason: lexical_alternative
  - marker: b
    text: Or 'nobleman' or 'king's officer.' The Greek βασιλικός denotes someone attached to a royal court or in royal service.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 예수께서 다시 갈릴리의 가나에 오셨습니다. 그곳은 그가 물을 포도주로 만드신 곳이었습니다. 또 왕의 신하[a] 가운데 한 사람이 있었는데, 그의 아들이 가버나움에서 병들어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 해석적으로, ‘그가 물을 포도주로 바꾸신 곳’. 헬라어는 더 문자적으로 ‘그가 물을 포도주로 만드신 곳’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦλθεν οὖν
  english_pob_choice: So he came
  chosen_korean: 그러므로 예수께서 … 오셨습니다
  alternatives_korean:
  - 그래서 예수께서 … 오셨습니다
  - 그리하여 예수께서 … 오셨습니다
  lexicon: BDAG
  rationale: οὖν의 인과·전개 연결을 살려 자연스러운 서술 연결어로 ‘그러므로’를 택했고, 문맥상 주어는 앞절의 예수님을 이어 받아 드러내었습니다.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  english_pob_choice: he had made the water wine
  chosen_korean: 물을 포도주로 만드신 곳
  alternatives_korean:
  - 물을 포도주로 바꾸신 곳
  - 물을 포도주가 되게 하신 곳
  lexicon: BDAG
  rationale: 직역의 긴장을 살리되 한국어에서 자연스럽게 읽히도록 ‘물’을 목적어로, ‘포도주로 만드신’으로 옮겼습니다. 이는 POB의 ‘had made the water wine’에 대응합니다.
- source_word: βασιλικός
  english_pob_choice: royal official
  chosen_korean: 왕의 신하
  alternatives_korean:
  - 왕의 관리
  - 궁정 관리
  - 귀족
  lexicon: BDAG
  rationale: βασιλικός가 왕실/왕궁에 속한 사람을 가리키므로, 신분 추정보다 소속 관계를 드러내는 ‘왕의 신하’를 택했습니다. POB의 ‘royal official’과 대응합니다.
- source_word: ἠσθένει
  english_pob_choice: was sick
  chosen_korean: 병들어 있었습니다
  alternatives_korean:
  - 아파 있었습니다
  - 병이 들었습니다
  lexicon: BDAG
  rationale: 단순한 상태 설명으로서의 신체 질병을 자연스럽게 옮겼습니다. ‘병들어 있었습니다’는 진행 상태를 살리면서도 과장되지 않습니다.
theological_decisions:
- issue: καὶ ἦν τις βασιλικός의 인물 성격을 과도하게 특정하지 않음
  chosen_reading: 왕의 신하 가운데 한 사람
  alternative_readings:
  - 왕의 관리 가운데 한 사람
  - 귀족 한 사람
  rationale: 본문은 그가 왕실과 관련된 인물임만 말하며 정확한 직책은 밝히지 않습니다. 따라서 역사적 추정을 덧붙이지 않고 본문 수준의 의미를 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 불필요한 역사적 구체화 회피
