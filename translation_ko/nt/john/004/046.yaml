  to: 그러므로 예수께서 다시 갈릴리의 가나에 오셨습니다. 그곳은 그가 물을 포도주로 만드신[a] 곳이었습니다. 또 왕의 관리[b] 한 사람이 있었는데, 그의 아들이 가버나움에서 병들어 있었습니다.
