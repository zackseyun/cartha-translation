  verdict: revise
  source_fidelity: 「그 사이에」는 Ἐν τῷ μεταξὺ의 시간적 의미를 자연스럽게 반영합니다. ἠρώτων의 미완료적·반복적 뉘앙스도 「계속 권했습니다」로 보존됩니다. 직접 인용문이 그 권유의 내용을 충분히 나타내므로, λέγοντες를 별도로 「말했습니다」로 중복해 옮길 필요는 없습니다.
  naturalness: 현 초안의 「계속 권하며 말했습니다」는 문법적으로 가능하지만, 직접 인용문 앞에서 동작이 중첩되어 다소 어색합니다. 「계속 권했습니다」 뒤에 직접 인용을 두면 현대 표준 한국어 합쇼체에서 더 간결하고 자연스럽습니다.
  terminology: 「랍비」는 원문의 유대적 호칭을 보존하며 적절합니다. 「잡수십시오」는 예수께 드리는 공손한 합쇼체 권유로 자연스럽고, 본문의 요청/권유 기능을 잘 전달합니다.
