source:
  edition: SBLGNT
  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
  footnotes:
  - marker: a
    text: Or “In the meantime.”
    reason: lexical_alternative
  - marker: b
    text: The verb can also be rendered “were asking” or “kept asking”; here it carries the sense of urging Jesus to eat.
    reason: lexical_alternative
  - marker: c
    text: “Rabbi” is a Jewish title of address, also meaning “Teacher.”
    reason: cultural_note
translation:
  language: ko
  text: 그 사이에 제자들이 그분께 계속 권했습니다. 「랍비, 잡수십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  english_pob_choice: Meanwhile
  chosen_korean: 그 사이에
  alternatives_korean:
  - 그동안
  - 이때에
  - 그 사이
  lexicon: BDAG
  rationale: 문맥상 여인이 떠난 뒤 다음 대화로 넘어가는 사이를 가리키는 관용 표현이므로, 현대 한국어에서 자연스럽고 시간의 간극을 잘 드러내는 「그 사이에」로 옮겼습니다.
- source_word: ἠρώτων
  english_pob_choice: were urging
  chosen_korean: 계속 권하며
  alternatives_korean:
  - 묻고 있었습니다
  - 계속 묻고 있었습니다
  - 요청하고 있었습니다
  lexicon: BDAG
  rationale: 미완료시제는 반복적·지속적 행동을 나타내며, 여기서는 단순 질문보다 예수님께 식사하시도록 재촉하는 뉘앙스가 강하므로 「계속 권하며」가 더 적절합니다.
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 랍비
  alternatives_korean:
  - 선생님
  lexicon: BDAG
  rationale: 유대적 호칭을 그대로 살려 예수님께 대한 제자들의 말투와 1세기 배경을 유지했습니다. 「선생님」은 뜻은 전달하지만 호칭의 역사적 색채를 약화시킵니다.
- source_word: φάγε
  english_pob_choice: eat
  chosen_korean: 잡수십시오
  alternatives_korean:
  - 드십시오
  - 먹으십시오
  lexicon: BDAG
  rationale: 예수님께 하는 공손한 권유이므로 한국어에서는 평서적 명령형 「먹으십시오」보다 대화체 존대인 「잡수십시오」가 자연스럽고 장면의 정서를 잘 살립니다.
theological_decisions:
- issue: 제자들의 말투와 예수님에 대한 존대 표현
  chosen_reading: 제자들이 예수님께 공손히 식사를 권하는 장면으로 옮겼습니다.
  alternative_readings:
  - 직역하여 '먹으십시오'로 옮김
  - 보다 평평하게 '드십시오'로 옮김
  rationale: 원문은 간단한 명령형이지만 실제 기능은 음식 섭취를 권하는 말입니다. 한국어 합쇼체에서는 예수님께 대한 자연스러운 공손함을 살리는 편이 장면의 의도에 부합합니다.
  doctrine_reference: 복음서의 대화체 재현과 예수에 대한 존대 화법
