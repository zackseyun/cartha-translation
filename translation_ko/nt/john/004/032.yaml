id: JHN.4.32
reference: John 4:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
  footnotes:
  - marker: a
    text: Or 'I have something to eat that you do not know.' Jesus is speaking metaphorically, as the following context makes clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “나는 너희가 알지 못하는 먹을 것을 가지고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먹을 것’은 문자적 음식이라기보다, 이어지는 문맥이 보여 주는 비유적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  english_pob_choice: But he said to them
  chosen_korean: 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그런데 그가 그들에게 말했습니다
  - 그러나 그가 그들에게 말씀하셨습니다
  lexicon: SBLGNT
  rationale: 대화 맥락상 화자는 예수이므로 주어를 분명히 드러내고, δὲ의 완만한 전개는 문맥 속에서 자연스럽게 처리했습니다.
- source_word: βρῶσιν
  english_pob_choice: food
  chosen_korean: 먹을 것을
  alternatives_korean:
  - 음식을
  - 먹을 양식을
  lexicon: BDAG
  rationale: βρῶσις는 여기서 ‘먹는 행위’가 아니라 ‘먹을 것/음식’이므로, 문맥상 자연스럽고 비유성도 유지되는 ‘먹을 것’을 택했습니다.
- source_word: ἔχω φαγεῖν
  english_pob_choice: I have food to eat
  chosen_korean: 가지고 있습니다
  alternatives_korean:
  - 먹을 것을 가지고 있습니다
  - 먹을 것이 있습니다
  lexicon: BDAG
  rationale: 소유+섭취 구문을 한국어에서는 ‘가지고 있다’로 풀어, 직역보다 어색하지 않으면서도 소스의 구조를 보존했습니다.
- source_word: ὑμεῖς οὐκ οἴδατε
  english_pob_choice: you do not know
  chosen_korean: 너희가 알지 못하는
  alternatives_korean:
  - 너희가 모르고 있는
  - 너희는 알지 못하는
  lexicon: BDAG
  rationale: ἐγώ/ὑμεῖς의 대조를 살리기 위해 주어를 ‘너희’로 살렸고, οἴδατε는 단순한 인지 부재를 나타내므로 ‘알지 못하는’이 가장 직접적입니다.
theological_decisions:
- issue: 예수의 ‘먹을 것’의 비유성
  chosen_reading: 본문은 비유를 즉시 풀지 않고, 제자들의 오해가 남도록 ‘먹을 것’을 그대로 유지했습니다.
  alternative_readings:
  - ‘양식’으로 옮겨 더 상징적으로 처리할 수 있음
  - ‘무언가 먹을 것’처럼 풀어 설명할 수 있음
  rationale: 이 절은 곧 이어지는 문맥에서 비유적 의미가 드러나므로, 본문 자체의 긴장을 보존하는 것이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
