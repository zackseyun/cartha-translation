id: JHN.4.27
reference: John 4:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
  footnotes:
  - marker: a
    text: Or, “What do you want?” for “What are you seeking?”
    reason: lexical_alternative
  - marker: b
    text: Literally, “What are you speaking with her?” The sense is, “Why are you speaking with her?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제자들이 [a]도착했고, 예수께서 여자와 말씀하고 계신 것을 보고 놀랐습니다. 그러나 아무도, “무엇을 찾으십니까?” 또는[b] “왜 그 여자와 말씀하십니까?”라고 묻지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무엇을 원하십니까?”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그 여자와 무엇을 말하고 있습니까?”이지만, 뜻은 “왜 그 여자와 말씀하십니까?”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐπὶ τούτῳ ἦλθαν
  english_pob_choice: And at this point his disciples came
  chosen_korean: 그때 제자들이 도착했고
  alternatives_korean:
  - 그 순간 제자들이 왔고
  - 이때 제자들이 왔고
  lexicon: BDAG
  rationale: ἐπὶ τούτῳ는 시간 부사로 자연스럽게 ‘그때/이때’의 흐름을 나타내므로 한국어에서도 서술의 전환을 간결하게 살렸습니다.
- source_word: ἐθαύμαζον
  english_pob_choice: they were amazed
  chosen_korean: 놀랐습니다
  alternatives_korean:
  - 경탄했습니다
  - 놀라워했습니다
  lexicon: BDAG
  rationale: 미완료 시제의 반응적 놀람을 한국어 현재·과거 서술로 자연스럽게 옮기되, 과도하게 종교적이거나 고어적인 표현은 피했습니다.
- source_word: μετὰ γυναικὸς ἐλάλει
  english_pob_choice: he was speaking with a woman
  chosen_korean: 여자와 말씀하고 계신 것을
  alternatives_korean:
  - 한 여자와 말씀하고 계신 것을
  - 여자와 대화하고 계신 것을
  lexicon: BDAG
  rationale: γυνή는 여기서 특정 여자를 가리키는 일반 명사이므로 ‘여자’로 옮겼고, ἐλάλει의 진행상을 살려 ‘말씀하고 계신’으로 표현했습니다.
- source_word: Τί ζητεῖς;
  english_pob_choice: What are you seeking?
  chosen_korean: “무엇을 찾으십니까?”
  alternatives_korean:
  - “무엇을 구하십니까?”
  - “무엇을 원하십니까?”
  lexicon: BDAG
  rationale: ζητεῖς는 기본적으로 ‘찾다/구하다’의 뜻이므로 본문에는 ‘무엇을 찾으십니까?’를 두어 원문에 가깝게 두었습니다.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  english_pob_choice: Why are you speaking with her?
  chosen_korean: “왜 그 여자와 말씀하십니까?”
  alternatives_korean:
  - “왜 그 여자와 이야기하십니까?”
  - “왜 그 여자와 말씀을 나누십니까?”
  lexicon: BDAG
  rationale: τί + λαλεῖς는 직역하면 ‘무엇을 말하십니까’이지만 문맥상 의도된 뜻은 이유를 묻는 말이므로 자연스러운 한국어 질문으로 옮겼습니다.
theological_decisions:
- issue: 제자들의 반응을 암시하는 사회적 긴장
  chosen_reading: 본문이 직접 말하는 놀람만 드러내고, 이유 설명은 본문 밖으로 넘겼습니다.
  alternative_readings:
  - 유대인-사마리아인 관계나 남녀 관습을 본문에 덧붙여 설명하기
  rationale: 원문은 제자들이 왜 놀랐는지를 구체화하지 않으므로, 번역문은 그 절제된 서술을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: source restraint and optimal equivalence.'
