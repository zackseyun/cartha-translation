  to: 이는 예수님께서 친히 선지자는 자기 고향에서는 존경을 받지 못한다고 증언하셨기 때문입니다.
  rationale: 수정문은 γάρ를 ‘이는 … 때문입니다’로 명시하여 앞 문맥을 설명하는 원문의 담화 기능을 보존했습니다. ‘친히’로 예수에 대한 αὐτός의 강조를 자연스럽게 반영했고, ‘선지자’, ‘자기 고향’, ‘존경을 받지 못하다’를 유지하여 어휘 의미와 지리적 지시의 모호성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
