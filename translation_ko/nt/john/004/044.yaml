    rationale: ‘예수님 자신이’도 이해되지만, 사람 이름과 함께 쓰일 때 ‘예수님께서 친히’가 더 자연스럽고 αὐτός의 강조를 충분히 보존합니다.
  revised_text: 이는 예수님께서 친히 선지자는 자기 고향에서는 존경을 받지 못한다고 증언하셨기 때문입니다.
