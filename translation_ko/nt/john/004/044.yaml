id: JHN.4.44
reference: John 4:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
  footnotes:
  - marker: a
    text: Or 'in his own country' or 'in his own native place.' The Greek πατρίς can refer to one's homeland or home region.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 예수님께서 친히 선지자는 자기 고향에서는 존경을 받지 못한다고 증언하셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς ... Ἰησοῦς
  english_pob_choice: Jesus himself
  chosen_korean: 예수님 자신이
  alternatives_korean:
  - 예수님이
  - 그분 자신이, 예수님이
  lexicon: BDAG
  rationale: αὐτός의 강조를 살려 주어를 단순히 ‘예수님이’로만 두지 않고 ‘예수님 자신이’로 옮겼습니다.
- source_word: ἐμαρτύρησεν
  english_pob_choice: testified
  chosen_korean: 증언하셨으니
  alternatives_korean:
  - 증언하셨습니다
  - 증거하셨습니다
  - 말씀하셨으니
  lexicon: BDAG
  rationale: μαρτυρέω의 증언 언어를 유지하면서 문맥상 앞절과 이어지는 이유를 자연스럽게 나타내기 위해 ‘-하셨으니’로 옮겼습니다.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  english_pob_choice: in his own homeland
  chosen_korean: 자기 고향에서는
  alternatives_korean:
  - 자기 고향 땅에서는
  - 자기 본향에서는
  - 자기 나라에서는
  lexicon: BDAG
  rationale: πατρίς는 문맥상 한 개인의 출신지/고향을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘자기 고향’으로 옮기되 ‘에서는’으로 장소적 범위를 살렸습니다.
- source_word: τιμὴν οὐκ ἔχει
  english_pob_choice: has no honor
  chosen_korean: 존경을 받지 못한다고
  alternatives_korean:
  - 존경이 없다고
  - 영예를 얻지 못한다고
  - 존중을 받지 못한다고
  lexicon: BDAG
  rationale: τιμή의 핵심 의미인 ‘존귀/존경’을 살리면서 한국어에서 관용적인 표현인 ‘존경을 받지 못하다’로 옮겼습니다.
theological_decisions:
- issue: 속담적 진술의 직접성
  chosen_reading: 예수님의 증언 내용을 직접화법 없이 간접인용으로 옮겨, 일반 원리로서의 진술 성격을 유지했습니다.
  alternative_readings:
  - 직접인용으로 처리
  - 보다 속담처럼 일반화하여 표현
  rationale: 본문은 ‘한 선지자는 자기 고향에서는 존경을 받지 못한다’는 일반 진술을 담고 있으므로, 해설을 덧붙이지 않고 그대로 전달하는 편이 원문의 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
