- from: 예수께서 대답하시고 그 여인에게 말씀하셨다. 「이 물을 마시는 모든 사람은 다시 목마르게 될 것입니다[a].」
  to: 예수께서 그 여인에게 대답하여 말씀하셨습니다. “이 물을 마시는 사람은 누구나 다시 목마를 것입니다[a].”
  rationale: 합쇼체 서술 종결로 문체를 통일하고, ἀπεκρίθη ... καὶ εἶπεν의 두 동사를 '대답하여 말씀하셨습니다'로 유지했습니다. Πᾶς ὁ πίνων의 포괄성과 διψήσει πάλιν의 미래·반복 의미를 각각 '사람은 누구나'와 '다시 목마를 것입니다'로 자연스럽게 반영했습니다. 각주는 영어 감사 기록의 동사적 어휘 대안을 한국어에 맞게 제시합니다.
