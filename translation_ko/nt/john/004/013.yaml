    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하시고 말씀하셨다
  alternatives_korean:
  - 대답하시어 말씀하셨다
  - 대답하시며 말씀하셨다
  lexicon: BDAG
  rationale: 그리스어의 이중 응답형(ἀπεκρίθη ... καὶ εἶπεν)은 요한복음 서술 문체의 전형이다. 두 동사를 모두 살려 텍스트의 질감을 보존하기 위해 '대답하시고 말씀하셨다'로 직역했습니다.
- source_word: Πᾶς ὁ πίνων
  english_pob_choice: Everyone who drinks
  chosen_korean: 이 물을 마시는 모든 사람
  alternatives_korean:
  - 누구든지 마시는 자
  - 마시는 사람은 누구나
  lexicon: BDAG
  rationale: 관사 있는 현재 분사는 관습적·범주적 의미를 가진다. 성별 중립적 범주를 살려 '모든 사람'으로 번역했습니다.
- source_word: τοῦ ὕδατος τούτου
  english_pob_choice: this water
  chosen_korean: 이 물
  alternatives_korean:
  - 이곳의 물
  - 이 특정한 물
  lexicon: BDAG
  rationale: 지시적 대명사 τούτου의 직접적 지시를 유지하기 위해 간결하게 '이 물'로 처리했습니다. 문맥상 물리적 물을 가리킴이 분명합니다.
- source_word: διψήσει πάλιν
  english_pob_choice: will be thirsty again
  chosen_korean: 다시 목마르게 될 것입니다
  alternatives_korean:
  - 다시 목마를 것이다
  - 다시 목마르게 되리라
  lexicon: BDAG
  rationale: 미래 동사(또는 상태 서술)로서의 의미를 한국어의 자연스러운 미래 표현으로 살리기 위해 '다시 목마르게 될 것입니다'를 선택했습니다.
theological_decisions:
- issue: Retention of the double speech formula ἀπεκρίθη ... καὶ εἶπεν
  chosen_reading: 원문이 사용한 두 동사 모두를 살려 번역
  alternative_readings:
  - 하나의 동사로 축약하여 '대답했다' 또는 '말했다'만 표기
  rationale: 요한 복음의 서술 텍스트에서 이중 동사형은 흔한 문체적 장치이다. 두 동사를 모두 유지하면 원문의 리듬과 독자에 대한 화법적 정보가 보존됩니다.
  doctrine_reference: Translation philosophy §1, §5
