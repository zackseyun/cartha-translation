  source_fidelity: 그리스어의 이중 서술 동사(ἀπεκρίθη ... καὶ εἶπεν), 여성을 가리키는 여격(αὐτῇ), 포괄적 현재분사(Πᾶς ὁ πίνων), 지시사('이 물'), 그리고 미래의 반복된 갈증(διψήσει πάλιν)을 모두 충실히 옮길 수 있습니다. '목마르게 되다'도 의미상 가능하지만, 여기서는 '목마르다'가 διψήσει를 더 직접적이고 자연스럽게 반영합니다.
  naturalness: 초안의 '말씀하셨다'는 평서체이고 인용문의 '것입니다'는 합쇼체여서, 지정된 현대 표준어 합쇼체 안에서 문체가 섞입니다. 서술문도 '말씀하셨습니다'로 고쳐 일관되게 하는 것이 자연스럽습니다. '사람은 누구나'는 포괄적 일반 진술에 자연스럽습니다.
  terminology: 예수에 대한 높임말 '예수께서', '말씀하셨습니다'는 적절합니다. '그 여인'은 αὐτῇ의 선행 대상을 명확히 하며, '목마를 것입니다'는 신학적 해석을 더하지 않고 일상적 물에 관한 발화를 그대로 보존합니다.
