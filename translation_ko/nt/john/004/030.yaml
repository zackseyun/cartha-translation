lexical_decisions:
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  english_pob_choice: They went out of the city
  chosen_korean: 그 도시에서 나왔습니다
  alternatives_korean:
  - 그 도시를 떠났습니다
  - 그 도시 밖으로 나왔습니다
  lexicon: BDAG
  rationale: ἐξέρχομαι의 이동 방향을 자연스러운 합쇼체로 옮기되, ‘도시에서 나와’로 도시 내부에서 밖으로 나가는 의미를 분명히 살렸습니다.
- source_word: ἤρχοντο
  english_pob_choice: were coming
  chosen_korean: 오고 있었습니다
  alternatives_korean:
  - 오고 있었습니다
  - 가고 있었습니다
  lexicon: BDAG
  rationale: 미완료 시상의 진행성을 살려 ‘오고 있었습니다’로 옮겼습니다. 한국어에서는 ‘그분께로’와 결합할 때 ‘가고 있었습니다’보다 ‘오고 있었습니다’가 더 자연스럽습니다.
- source_word: πρὸς αὐτόν
  english_pob_choice: to him
  chosen_korean: 그분께로
  alternatives_korean:
  - 그에게
  - 그쪽으로
  lexicon: BDAG
  rationale: 예수께 향하는 접근의 방향성을 드러내기 위해 ‘그분께로’로 옮겼습니다. 문맥상 예수를 지칭하므로 존칭 대명사를 사용했습니다.
theological_decisions:
- issue: 예수 지칭의 한국어 화법
  chosen_reading: 서술문은 합쇼체를 유지하되, 예수께 향하는 표현은 ‘그분께로’로 존중을 드러냈습니다.
  alternative_readings:
  - 그에게
  - 주님께로
  rationale: 본문 자체는 평서적 서술이지만, 한국어 독자에게 자연스러운 경의 표현을 유지하는 것이 문맥에 맞습니다. 동시에 ‘주님’으로 명시하지 않아 원문의 인칭 지시를 보존했습니다.
  doctrine_reference: 존칭 표현과 서술체의 균형
