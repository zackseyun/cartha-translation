  rationale: ἀλλά를 ‘오히려’로 드러내고, γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον을 ‘그 안에서 영생에 이르도록 솟아오르는 샘물’로 옮겨, 원문의 존재 변화와 솟아오르는 이미지 및 영생을 향하는 방향을 보존했습니다. ‘이르게 할’이라는 추가적 사역 의미는 제거했습니다.
