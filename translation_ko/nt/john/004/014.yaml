id: JHN.4.14
reference: John 4:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: ko
  text: 그러나 내가 그에게 줄 물을 마시는 사람은 영원히 목마르지 않을 것입니다. 오히려 내가 그에게 줄 물은 그 안에서 영생에 이르도록 솟아오르는 샘물이 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδωρ
  english_pob_choice: water
  chosen_korean: 물
  alternatives_korean:
  - 생수
  - 성령
  lexicon: BDAG ὕδωρ; Liddell-Scott
  rationale: 본문은 문자적으로 'water'를 말하므로 일반 한국어 '물'로 번역했습니다. 신학적 해설(성령 비유)은 요한복음 전체 문맥에서 가능하지만 본문 자체는 '물'을 명시하므로 문자어를 우선했습니다.
- source_word: πηγὴ ὕδατος ἁλλομένου
  english_pob_choice: a spring of water welling up
  chosen_korean: 샘물이 되어 솟아 올라
  alternatives_korean:
  - 솟아나는 샘
  - 끊임없이 솟는 샘물
  lexicon: BDAG πηγή; Liddell-Scott ἁλλομένου
  rationale: πῆγή의 공간적·동적 이미지를 살려 '샘물이 되어 솟아 올라'로 처리해 영어 원문의 'welling up' 뉘앙스를 전달했습니다.
- source_word: ζωὴν αἰώνιον
  english_pob_choice: eternal life
  chosen_korean: 영생
  alternatives_korean:
  - 영원한 생명
  - 영원한 삶
  lexicon: BDAG ζωή αἰώνιος
  rationale: 요한복음에서 반복되는 신학어 'eternal life'는 한국어 성경 전통을 따라 '영생'으로 번역해 독자가 신학적 연결을 바로 인식하도록 했습니다.
- source_word: αὐτῷ (ἐγὼ δώσω αὐτῷ)
  english_pob_choice: him
  chosen_korean: 그에게
  alternatives_korean:
  - 그 사람에게
  - 그에게(성별중립)
  lexicon: Greek pronoun αὐτός (masculine singular) usage
  rationale: 그리스어의 남성 단수 대명사(αὐτῷ)를 반영하여 영어 POB의 'him'에 상응하는 '그에게'를 선택했습니다. 문맥상 보편적 독자를 가리키는 일반적 용법으로 이해되므로 성차별적 의도는 없습니다.
theological_decisions:
- issue: Literal 'water' vs. theological identification as the Spirit
  chosen_reading: 문자적 '물'로 번역 (물)
  alternative_readings:
  - 직접적으로 '성령'으로 표기
  - 해설적 각주로 '성령' 관련 언급 추가
  rationale: 요한복음 4장 전체와 7장 등의 문맥에서 '생수'가 성령과 연결되지만, 본 구절 자체는 '물'을 문자적으로 말합니다. 원문에 충실하기 위해 본문 본문에서는 '물'로 유지하고, 주석에서 성령 해석을 다루는 것이 원문 근거를 보존하는 방식입니다.
  doctrine_reference: John 4:10-14; John 7:37-39
- issue: Rendering of οὐ μὴ ... εἰς τὸν αἰῶνα (negation + 'into the age')
  chosen_reading: 영원히 목마르지 않을 것입니다
  alternative_readings:
  - 결코 목마르지 않을 것이다
  - 영원토록 목마르지 않으리라
  rationale: 그리스어의 강한 부정(οὐ μὴ)과 'εἰς τὸν αἰῶνα'의 시간적 지속을 한국어로 자연하고 명확하게 전달하기 위해 '영원히 목마르지 않을 것입니다'로 번역했습니다.
  doctrine_reference: Greek verbal negation (BDAG οὐ μὴ); Johannine eschatological language
