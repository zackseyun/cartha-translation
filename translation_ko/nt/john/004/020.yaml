translation:
  language: ko
  text: 우리 조상들은[a] 이 산에서 예배했습니다. 그런데 여러분은 예루살렘에 예배해야 할[b] 곳이 있다고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 아버지들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예배하는 것이 필요한 곳’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  english_pob_choice: Our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  - 우리 조상님들
  lexicon: BDAG
  rationale: 그리스어는 문자적으로 '우리의 아버지들'을 말하지만, 문맥상 공동체의 선조·계보를 가리키므로 한국어로는 '우리 조상들'이 자연스러우며 원문의 대표적·역사적 어감을 보존합니다. 대안으로 '우리 아버지들'도 가능하나 현대 한국어에서는 혈연적 아버지보다 '조상'이 더 적합합니다.
- source_word: ἐν τῷ ὄρει τούτῳ · προσεκύνησαν
  english_pob_choice: on this mountain ... worshiped
  chosen_korean: 이 산에서 경배했습니다
  alternatives_korean:
  - 이 산 위에서 예배했습니다
  - 이 언덕에서 절했습니다
  lexicon: BDAG
  rationale: ἐν + ὄρει는 위치를 나타내므로 '이 산에서'로 자연스럽게 옮겼고, προσκυνέω의 종교적 의미를 살려 '경배했다'로 번역했습니다. '예배했다'도 가능하지만 '경배'는 고대적 예배 행위(허리 굽힘·절함)를 포함하는 감각을 전달합니다.
- source_word: προσκυνεῖν δεῖ
  english_pob_choice: where one must worship
  chosen_korean: 예배해야 할 곳
  alternatives_korean:
  - 예배해야만 하는 곳
  - 예배하는 것이 필요하다고 여겨지는 곳
  lexicon: BDAG
  rationale: δεῖ의 비인칭·필요성 뜻을 한국어로는 관형절로 자연스럽게 처리해 '예배해야 할 곳'으로 표현했습니다. 이는 일반적·규범적 주장(어디서 예배해야 하는지에 대한 보편적 주장)을 반영합니다.
theological_decisions:
- issue: 사마리아인(화자)과 유대인(청자) 사이의 대비를 본문에 명시할지 여부
  chosen_reading: 대조를 본문에 추가로 명시하지 않고 대명사 대조(우리 ... 너희)를 그대로 살림
  alternative_readings:
  - 본문에 '사마리아인 우리 조상들'과 '너희 유대인' 등으로 명시적으로 추가
  - 독자 이해를 돕기 위해 본문 밖에서 주석으로만 설명
  rationale: 원문은 대명사로 대비를 만든다. 본문에 추가 설명을 넣으면 원문 이상의 정보를 삽입하게 되므로 대명사 대조를 그대로 살렸습니다. 필요한 역사·문화적 배경은 주석에서 다루어야 합니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 범위에서 읽기 가능한 표현을 선택하되, 원문에 없는 정체성 표기를 본문에 삽입해선 안 된다.'
