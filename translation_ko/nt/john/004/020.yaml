review_pass:
  verdict: revise
  source_fidelity: 원문의 대조적 대명사(‘우리’/‘너희’)와 장소 및 예배의 필요성 주장은 대체로 충실합니다. 다만 동일한 προσκυνέω를 ‘경배’와 ‘예배’로 달리 옮긴 점은 불필요한 의미 차이를 만들 수 있고, 각주 표지가 해당 표현에 붙어 있지 않습니다.
  naturalness: ‘너희는’은 현대 합쇼체 문맥에서 다소 거칠게 들릴 수 있으므로 ‘여러분은’이 더 자연스럽고 공손합니다. ‘그런데’는 원문의 문맥상 대조를 자연스러운 한국어로 드러냅니다.
  terminology: προσκυνέω는 이 절에서 예배 장소를 논하는 종교적 문맥이므로 ‘예배하다’로 일관되게 옮겼습니다. οἱ πατέρες ἡμῶν은 공동체의 선조를 뜻하므로 ‘우리 조상들’이 적절합니다.
  issues:
  - severity: medium
    issue: 각주 표지의 위치가 각주 내용과 일치하지 않습니다.
    rationale: a 각주는 ‘우리 조상들’의 대안을 설명하지만 문장 끝의 ‘경배했습니다’에 붙어 있고, b 각주는 ‘예배해야 할’의 필요성 표현을 설명하지만 문장 끝의 ‘말합니다’에 붙어 있습니다. 표지는 해당 어구 바로 뒤에 두어야 합니다.
  - severity: low
    issue: 동일한 그리스어 동사 προσκυνέω가 본문에서 ‘경배했습니다’와 ‘예배해야 할’로 다르게 번역되었습니다.
    rationale: 문맥상 두 용례 모두 예배 행위를 가리키므로 ‘예배’로 일관되게 번역하는 편이 원문의 반복과 논지를 더 잘 보존합니다.
  - severity: low
    issue: ‘너희는’은 합쇼체 문장 종결과 결합될 때 현대 표준어에서 다소 거칠게 들립니다.
    rationale: 명시된 복수 대명사와 대비는 유지하면서 ‘여러분은’으로 옮기면 현대의 공손한 문체에 맞습니다.
  revised_text: 우리 조상들은[a] 이 산에서 예배했습니다. 그런데 여러분은 예루살렘에 예배해야 할[b] 곳이 있다고 말합니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리 아버지들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예배하는 것이 필요한 곳’.
    reason: lexical_alternative
  revision_rationale: 각주 표지를 해당 어구 뒤로 옮겨 구조적 연결을 바로잡았습니다. 동일한 원어 동사 προσκυνέω를 ‘예배하다’로 일관되게 번역했으며, 대명사 대조는 보존하되 현대 합쇼체에 맞게 ‘여러분은’으로 다듬었습니다. ‘그런데’는 καὶ가 이 문맥에서 수행하는 대조적 연결을 자연스럽게 나타낼 뿐, 사마리아인과 유대인이라는 원문 밖의 정보를 추가하지 않습니다.
