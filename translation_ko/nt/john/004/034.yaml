id: JHN.4.34
reference: John 4:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
  footnotes:
  - marker: a
    text: Or 'finish his work.'
    reason: lexical_alternative
  - marker: b
    text: '''Him who sent me'' refers contextually to the Father, though the Greek does not state the title explicitly here.'
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “나의 양식은 나를 보내신 이의 뜻을 행하고[a] 그분의 일을 완수하는 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 일을 끝내는 것’.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμά
  english_pob_choice: food
  chosen_korean: 양식
  alternatives_korean:
  - 음식
  - 먹을거리
  lexicon: BDAG
  rationale: βρῶμα의 문자적 의미는 ‘먹는 것’이지만, 한국어에서는 ‘나의 음식은’보다 ‘나의 양식은’이 더 자연스럽게 은유를 살리면서도 예수의 비유적 발언으로 읽히게 합니다.
- source_word: ἵνα ποιήσω τὸ θέλημα
  english_pob_choice: is to do the will
  chosen_korean: 뜻을 행하고
  alternatives_korean:
  - 뜻을 행하는 것입니다
  - 뜻을 하는 것입니다
  lexicon: BDAG
  rationale: ἵνα + 접속법은 여기서 목적/내용을 나타내므로, 한국어에서는 ‘~하는 것입니다’로 풀어 자연스럽게 옮기되, θέλημα는 하나님의 ‘뜻’으로 간결하게 유지했습니다.
- source_word: τοῦ πέμψαντός με
  english_pob_choice: of him who sent me
  chosen_korean: 나를 보내신 이
  alternatives_korean:
  - 나를 보내신 분
  - 나를 파송하신 분
  lexicon: BDAG
  rationale: 직역적으로는 ‘나를 보내신 이’가 가장 원문에 가깝고, 영어 POB처럼 제목을 덧붙이지 않아도 문맥상 아버지를 가리키는 의미를 보존합니다.
- source_word: τελειώσω αὐτοῦ τὸ ἔργον
  english_pob_choice: complete his work
  chosen_korean: 그분의 일을 완수하는 것
  alternatives_korean:
  - 그분의 일을 완성하는 것
  - 그분의 일을 끝내는 것
  lexicon: BDAG
  rationale: τελειόω는 단순히 ‘끝내다’보다 목적에 이른 완성을 뜻하므로, ‘완수하다’가 의미를 더 잘 담습니다.
theological_decisions:
- issue: ‘나를 보내신 이’의 지시 대상
  chosen_reading: 본문에는 명시하지 않고 ‘나를 보내신 이’로 유지했습니다.
  alternative_readings:
  - ‘아버지’로 명시하기
  rationale: 요한복음의 문맥은 아버지를 가리키지만, 헬라어 본문은 그 호칭을 여기서 직접 쓰지 않으므로 번역문도 그 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙
