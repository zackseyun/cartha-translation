lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  english_pob_choice: After the two days
  chosen_korean: 이틀이 지난 뒤에
  alternatives_korean:
  - 이틀 후에
  - 이틀이 지나고
  lexicon: SBLGNT / BDAG
  rationale: μετά + 대격은 시간의 경과 뒤를 나타내므로 ‘지난 뒤에’로 옮겼고, 정관사가 붙은 ‘두 날’은 앞선 이틀 체류를 가리키는 맥락을 살렸습니다.
- source_word: ἐξῆλθεν
  english_pob_choice: he departed
  chosen_korean: 떠나셨습니다
  alternatives_korean:
  - 나가셨습니다
  - 출발하셨습니다
  lexicon: BDAG
  rationale: 직역의 ‘나가셨습니다’보다 서술문에서 자연스러운 이동 표현인 ‘떠나셨습니다’를 택해, 이전 장소를 벗어나는 의미를 살렸습니다.
- source_word: ἐκεῖθεν
  english_pob_choice: from there
  chosen_korean: 거기에서
  alternatives_korean:
  - 그곳에서
  - 거기서
  lexicon: BDAG
  rationale: 직전 문맥의 장소를 가리키는 부사이므로, 한국어에서도 가장 무난한 ‘거기에서’로 옮겼습니다.
- source_word: εἰς τὴν Γαλιλαίαν
  english_pob_choice: for Galilee
  chosen_korean: 갈릴리로
  alternatives_korean:
  - 갈릴리로 향하여
  - 갈릴리 안으로
  lexicon: BDAG
  rationale: εἰς의 목적지 방향성을 한국어 여격 조사 ‘-로’로 자연스럽게 나타냈습니다.
