  lexicon: SBLGNT / BDAG
  rationale: μετά + 대격은 시간의 경과 뒤를 나타내므로 ‘지난 뒤에’로 옮겼고, 정관사가 붙은 ‘두 날’은 앞선 이틀 체류를 가리키는 맥락을 살렸습니다.
- source_word: ἐξῆλθεν
